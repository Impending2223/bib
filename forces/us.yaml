# The armed forces of the United States, 1960-68, kept by hand (tools/bib/forces.py renders them; its STYLE notes).
#
# Every figure is read off a page of an open copy, with its table and page in its source. The owner's request,
# Oct. 20-22, 2026: U.S. forces and materiel a year (men, where they were, the machines: aircraft, ships, armor,
# missiles), set apart from the economic tables, a block a year under Armed Forces Day.
#
# Schema
#   sources: {KEY: {cite, url, note?}}       cite: the work, table and page, *italics* for titles; url: the page read
#   tables: a list, in the order shown. Each table:
#     key, title                              the title says what is counted, not the date
#     asof                                    the date of the count, as the source gives it ("June 30", "Sept. 30")
#     unit                                    persons | thousands | count (the head of the figures says it)
#     note                                    optional: one or two sentences shown under the table
#     tol                                     optional: how far a total may stand from its parts (rounding; default 0)
#     rows: [{key, label, sum?, group?, indent?}]
#        sum: the keys whose figures the row's figure is the total of; `check` holds the row to them, column by
#             column, in every year (a part absent that year counts nothing)
#        group: true for a heading row (a label, no figures)
#     cols: [{key, head}]                     a column is shown in a year only where that year has it
#     years: {YYYY: {COL: {src, ROW: figure, ..., printed?: {ROW: why}, as?: {ROW: the source's own label}}}}
#        figure: an integer; a string where the source prints a fraction or a pair ('26½', '4/3'); null for the
#        source's dash. printed: a row the source prints though its parts do not make it (shown on hover, and
#        excused from the sum check). as: the label the source gives a row that year, where it differs.
#
# Where a table is classified then (the Air Force's Statistical Digest: confidential or secret, downgraded later), its
# note says so: those figures were not public in the year they count.

