# The world's armed forces, 1960-68, kept by hand (tools/bib/forces.py renders them; its STYLE notes). Same schema as
# forces/us.yaml. Printed then, each its own table: the International Institute for Strategic Studies' *Military
# Balance* (no copy open: the Internet Archive lends, HathiTrust searches only), as the *Statistical Abstract*
# reprinted its table of personnel from the 1967 edition (the Military Balance, 1966-1967) on, and Jane's *Fighting
# Ships*' count of ships from the 1968 on, the Abstract's figures as printed, its countries regrouped by alliance and
# region ("(Z)" its "less than 500"); the Arms Control and Disarmament Agency's first world table (1966, published
# Dec. 1968), DTIC's copy; SIPRI's first yearbook (1969), the NATO and Warsaw Pact countries' military spending a year,
# 1960-68, at 1960 prices, its sources for NATO including NATO's own published figures (a figure in brackets, as printed, is
# its rough estimate and counts in the sums); an ally's own count, the British government's of its regular forces at
# June 30 (the Central Statistical Office's *Annual Abstract of Statistics*, from the Ministry of Defence, each year as
# first printed in the next year's edition, archive.org's open copies). Compiled since, apart: the Correlates of War
# Project's military personnel, every year, and the Federation of American Scientists' warheads. Not reached: NATO's
# archives and its Annual Review tables (archives.nato.int: a browser check, Oct. 23, 2026, 00:33 to 06:07 UTC), the
# *NATO Letter* and NATO's press releases of the figures, the other allies' white papers, the Parallel History Project
# (notes/leads.md, Foreign). The Abstract's 1966
# edition (census.gov, open Oct. 23, 2026) prints no table of the world's forces in its international section.

