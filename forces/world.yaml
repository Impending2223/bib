# The world's armed forces, 1966-68, kept by hand (tools/bib/forces.py renders them; its STYLE notes). Same schema as
# forces/us.yaml. The International Institute for Strategic Studies' *Military Balance* (from 1959) is the source of the
# men under arms, but no copy of it is open (the Internet Archive lends, HathiTrust searches only); the *Statistical
# Abstract* reprinted its table of personnel each year from the 1967 edition (the Military Balance, 1966-1967), and
# Jane's *Fighting Ships*' count of ships from the 1968, and those pages are open: read off them here, the Abstract's
# figures as printed, its countries regrouped by alliance and region; "(Z)" is its "less than 500". The editions of 1966 and before were not reached (notes/leads.md, Foreign).

