    cite: '*Statistical Abstract of the United States, 1968* (89th ed.), table 1258, p. 845, from *Jane''s Fighting Ships, 1967-68*'
    url: https://www2.census.gov/library/publications/1968/compendia/statab/89ed/1968-13.pdf#page=27
