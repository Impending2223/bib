    cite: '*Statistical Abstract of the United States, 1969* (90th ed.), table 1253, p. 839, from *Jane''s Fighting Ships, 1968-69*'
    url: https://www2.census.gov/library/publications/1969/compendia/statab/90ed/1969-12.pdf#page=16
