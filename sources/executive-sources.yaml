# The named sources of the Executive Branch roster: the works a holder's `src` cites that the renderer does not
# link by itself (tools/bib/executive_sources.py links CDIR, Cong. Rec., POCOM, FRUS, Wikipedia, APP, the Federal
# Register and URLs). Each entry is one work or one series; the first entry whose pattern matches wins.
# Links verified 2026-10-07 from this environment (200 with a real body; PDFs by a range request).
#
#   match   Python regex, matched against the whole source string as items() reads it (anchored at the end)
#   short   the label in the holder's "Sources:" line; {0} the whole match, {1}, {2}.. the groups ('' if absent).
#           Plain text: no markup.
#   cite    the full citation, in the page's list of sources (markup allowed: *Title*). Written without groups:
#           the list formats it with every group empty. An entry without cite is not listed.
#   urls    a link for each value of group 1 (quote the keys); a page anchor where the offset was checked
#   url     the link otherwise (may use {1}..); without braces it also links the citation in the list
#   n       a note after the citation in the list
#
# archive.org page anchors are /page/n<index>, the index of the page in the item's OCR (_djvu.xml), checked
# against its words. FRASER PDF anchors are #page=<PDF page>, checked with pdftotext.

