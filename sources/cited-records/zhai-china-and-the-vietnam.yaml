# The records w.zhai-china-and-the-vietnam (Qiang Zhai, China and the Vietnam Wars, 1950-1975, 2000) cites for the
# calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026). Logged Oct. 29, 2026 (book-zhai) from
# the owner's copy, the notes at pp. 223-66 read off the page by chapter and number: `page` is the text page the note's
# number stands on, except where the entry cites the note itself (Harriman and Khiem, Rusk and Micunovic: the note's own
# page); `note` its number. Published studies, memoirs and Chinese histories and chronicles the notes cite without
# naming a document (Li Ke and Hao Shengzhang, Han Huaizhi and Tan Jingqiao, Xie Yixian, Guo Ming, Xue Mouhong and Pei
# Jianzhang, Wang Xiangen, Cong Jin, Zhou waijiao dashiji and Zhou nianpu cited by page alone) are works, not records,
# and are not listed. Zhai's abbreviations: "77 Conversations", the Cold War International History Project's Working
# Paper No. 22 (1998); MZJW, Mao Zedong junshi wenji, 6 vols. (1993); JPA, the Jiangsu Provincial Archives.
