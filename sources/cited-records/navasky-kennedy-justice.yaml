# The records w.navasky-kennedy-justice gives for the calendar's claims (tools/bib/cited_records.py; the owner's rule,
# Oct. 28, 2026). Read Oct. 29, 2026 (batch 3, patch b3-navasky) from the owner's copy on the Drive (Atheneum, 1971; the
# Internet Archive's scan, its OCR text layer). Navasky's "Bibliographic Notes" (pp. 458-65) are few, numbered by chapter,
# mostly published works; the author's interviews, "the sources of all direct quotes or paraphrases" unless the text says
# otherwise (Author's Note, xi), were deposited at the John F. Kennedy Library. None of the chapter notes is attached to a
# passage the calendar cites, so no entry carries a `via` row. Logged instead, keyed by page alone (no note), are the
# documents the book prints or quotes in its text for those passages: each a record the series does not yet hold.
