# The records w.kallina-kennedy-v-nixon cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule,
# Oct. 28, 2026). Logged Oct. 29, 2026, by the first reading of Edmund F. Kallina Jr., Kennedy v. Nixon: The Presidential
# Election of 1960 (2010), the owner's copy (a print replica: the printed folios read off the running heads; the notes,
# pp. 217-60, numbered by chapter, so a record is keyed by the printed page its note number stands on and the number,
# lettered a, b ... where one note gives several records, in the note's order). Only the records the notes give for
# the passages that ground a calendar entry; the published works the notes cite (memoirs, studies, Gallup's volumes, the
# edited papers) are not listed, nor the notes' commentary. The claims each record grounds are the `via` rows of the
# entries' maps. notes/book-checks/kallina-kennedy-v-nixon.md.
