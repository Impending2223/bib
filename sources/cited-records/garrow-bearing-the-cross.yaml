# The records w.garrow-bearing-the-cross cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Read Oct. 29, 2026 (stage 5 backfill, garrow) from the owner's copy, the notes at pp. 633-723 read off the page (the text
# layer, and the page images where it is garbled). Garrow's notes are numbered by chapter: `page` is the text page of the
# passage the calendar entry rests on (within the entry's pinpoint; the note's number may stand on the next page), `note`
# its number in that chapter; several records under one number lettered a, b ... in the order first used. Garrow's key to
# the abbreviations (newspapers, collections, the FBI's files by number) is his bibliography, pp. 764-71: the records are
# written out from it. Only the records a note gives for the passage an entry rests on, not the note's others; published
# works the notes cite (memoirs, studies, magazines' essays) are not listed. Each note's interviews are one record
# (`kind: interview`), the interviewers in parentheses as Garrow gives them (his own, and those at the Kennedy, Johnson
# and other libraries his bibliography lists, pp. 755-63); they are not put in the entries' "To check".
# The claims each record grounds are the `via` rows of the entries' maps.
