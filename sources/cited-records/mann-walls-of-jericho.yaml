# The records w.mann-walls-of-jericho cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule,
# Oct. 28, 2026). Mann's source notes are unnumbered, keyed by the text's page and the phrase they gloss ("247 game of
# verbal gymnastics: RBR speech text, 2/8/60, Speech Files, RBRL"); the note key here is that phrase made a slug, a
# record a line, several records under one phrase lettered .a, .b in the note's order. Published works the notes cite
# (memoirs, studies, CQ's Almanac and Weekly Report) are not listed; the Congressional Record, the papers, the oral
# histories (RBRL: the Russell Library; LBJL, JFKL: the Johnson and Kennedy Libraries; USSHO: the Senate Historical
# Office; MSRC: Moorland-Spingarn), Mann's own interviews and the newspapers are. A Record page Mann cites is `found`
# there and, where read off the bound Record's scan on govinfo, `read`. Read Oct. 29, 2026, from the archive.org scan
# of the first edition (Harcourt Brace, 1996).
