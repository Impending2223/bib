# The records w.mann-grand-delusion cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Cited by printed page and the note's number (Mann numbers the notes a chapter; the page is the text's, where the
# note's mark stands); several records under one number lettered a, b ... in the note's order. Published works the notes
# cite (memoirs, studies, Gibbons, Beschloss's transcripts, the Pentagon Papers as books) are not listed; a record FRUS,
# the Public Papers or the Congressional Record prints is `found` there. The Foreign Relations Committee's executive
# sessions as the Historical Series prints them ("ExSess SFRC"), the Mansfield Papers (Univ. of Montana) and Mann's own
# interviews are listed as cited. Read Oct. 29, 2026, from the archive.org scan of the first edition (Basic Books, 2001).
