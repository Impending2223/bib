# The records w.humphrey-education-of-a-public-1976 cites for the calendar's claims (tools/bib/cited_records.py; the owner's
# rule, Oct. 28, 2026). Logged Oct. 29, 2026, by the reading of Hubert H. Humphrey, The Education of a Public Man: My Life and
# Politics (1976), the owner's copy (the Internet Archive's scan, its text layer; printed pages read off the running heads).
# The memoir has no source notes: its notes (441-96) are the author's asides. A record is logged only where the text or one
# of those notes prints or quotes a document that grounds an entry, keyed by the printed page and `note: text` (printed in the
# text) or the note's number. Documents the memoir quotes that ground no entry are listed in notes/book-checks/
# humphrey-education-of-a-public-1976.md. The claims each record grounds are the `via` rows of the entries' maps.
