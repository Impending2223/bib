# The records branch-parting-the-waters cites for the calendar's claims (tools/bib/cited_records.py), logged Oct. 29, 2026,
# by the batch 3 reading (Taylor Branch, Parting the Waters: America in the King Years, 1954-63; Feb. 1960-Dec. 1963).
# Branch's endnotes (pp. 923-) are not numbered: each is keyed by the printed page of the text it serves and a
# catchphrase. Here `note` is the note's place among the notes printed for that page, counted from 1 in the order printed
# ('3' the page's third note); a note citing several records gives each a letter in its own order ('2a', '2b'). The "n."
# of an entry's `via` rows and of its "To check" items counts the same way. The collections by Branch's abbreviations
# (pp. 923-26): A/KP, the Papers of Martin Luther King, Jr., King Library and Archives, Atlanta; A/SC, the SCLC Records,
# there; A/SN, the SNCC Papers, there; A/OH, the King Library's oral history collection; BUK, the King Papers at Boston
# University; CRDP, the Civil Rights Documentation Project, Howard University; JFKOH, the Kennedy Library's oral
# histories; RAC, the Rockefeller Archive Center; APR, the A. Philip Randolph Papers, Library of Congress; CRA, the City
# Records, Albany, Ga.; BIR, the Eugene T. Connor Papers, Birmingham Public Library; PRA, the Pacifica Radio Archive; AAP,
# the papers of Archie E. Allen; FBI files by number (100-106670, King; 100-392452, Levison). Newspapers by name. Books and
# articles of historians the notes cite are works, not records, and are not logged; the author's interviews and the oral
# histories are logged (kind: interview, oral history) and stay out of the entries' "To check". `entry` names the calendar
# entry whose `via` rows ground it, in the tree or in a pending patch (inbox/2026-10-29-b3-branch-ptw-1.yaml, -2.yaml);
# the records of two entries other pending patches edit (cal.1960-10-12.elections-1960, cal.1960-10-25.king) are logged
# here for the rows notes/book-checks/branch-parting-the-waters.md gives them.
