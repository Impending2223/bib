# The records w.branch-at-canaans-edge cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Read Oct. 29, 2026 (batch 3, b3-branch-ace) from the owner's copy (PDF, its text layer; printed folio = PDF page - 16
# to p. 274, the plates between, then PDF page - 40), the notes at pp. 780-980 read off the text layer. Branch's notes
# are not numbered: each is keyed to its text page and opens with a catchphrase from the passage. `page` is the text
# page the note gives; `note` is that catchphrase, its first words in lower case joined by hyphens ("i-didnt-give" for
# "I didn't give..."); several records under one catchphrase lettered .a, .b in the note's order. Branch's key to the
# abbreviations (A/KP, the King Papers, King Library and Archives; A/SC, the SCLC Records; A/SN, the SNCC Papers; FK, FBI
# file 100-106670 on King; FLNY, FBI file 100-111180 on Levison, New York; FDCA, FBI file 44-12831 on the election laws of
# Dallas County; FSMM, FBI file 44-28544 on the Selma march; FVL, FBI file 44-28601 on Liuzzo; FSC, the FBI's file on
# SCLC; PDD, the President's Daily Diary; RS, the Chicago police's Red Squad files, Chicago History Museum; BIR,
# Birmingham Public Library Archives) is at pp. 777-80: the records are written out from it. Only the records a note
# gives for the passage an entry rests on; published works the notes cite (memoirs, studies) are not listed, nor the
# author's interviews, which are not put in the entries' "To check". A White House recording the Miller Center gives is
# `found` by its page there. The claims each record grounds are the `via` rows of the entries' maps.
