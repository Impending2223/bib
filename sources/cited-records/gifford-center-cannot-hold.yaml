# The records w.gifford-center-cannot-hold cites for the calendar's claims (tools/bib/cited_records.py; the owner's
# rule, Oct. 28, 2026). Logged Oct. 29, 2026, by the first reading of Laura Jane Gifford, The Center Cannot Hold:
# The 1960 Presidential Election and the Rise of Modern Conservatism (2009), the owner's copy (Internet Archive's scan
# of the Northern Illinois University Press edition: printed page = PDF page - 14 throughout). The notes, pp. 205-29,
# are numbered by chapter; a record is keyed by the printed page its note number stands on and the number, lettered
# a, b ... where one note gives several records, in the note's order. Only the records the notes give for the
# passages that ground a calendar entry; the published books the notes cite are not listed (they are cited, where
# they are, as works). "NALN": the Nixon pre-presidential papers as the book cites them. notes/book-checks/
# gifford-center-cannot-hold.md.
