# The records perlstein-before-the-storm cites for the calendar's claims (tools/bib/cited_records.py), logged Oct. 29, 2026,
# by the stage 5 second reading (the Republicans; Perlstein, Before the Storm, 1960-Nov. 1964). Perlstein's endnotes
# (pp. 517-) are not numbered: each is keyed by the printed page of the text it serves and a catchphrase. Here `note`
# is the note's place among the notes printed for that page, counted from 1 in the order printed ('3' the page's third
# note); a note citing several records gives each a letter in its own order ('2a', '2b'). The "n." of an entry's `via`
# rows and of its "To check" items counts the same way. The collections by Perlstein's abbreviations (p. 517): CM, the
# Clarence Manion Papers; WAR, the William A. Rusher Papers; FCW, the F. Clifton White Papers; AHF, the Barry Goldwater
# Papers; DK, the Denison Kitchel Papers; FSA, the Free Society Association Papers; RAC, the Rockefeller Archive Center;
# ML, the Marvin Liebman Papers; LN, the Leonard Nadasdy papers; MTR, the Museum of Television and Radio. Books and
# articles of historians the notes cite are works, not records, and are not logged; the author's interviews are logged
# (kind: interview) and stay out of the entries' "To check". `entry` names the calendar entry whose `via` rows it grounds.
