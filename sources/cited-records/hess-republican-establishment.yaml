# The records hess-republican-establishment cites for the calendar's claims (tools/bib/cited_records.py), logged Oct. 29,
# 2026, by the reading of Hess and Broder, The Republican Establishment (1967), pp. 1-70. The book has no endnotes: its
# footnotes cite published books and articles (works, not records: Novak, White, Shadegg, Karl Hess, Cotter and
# Hennessy, Alexander, Rovere) or carry the authors' own reporting (the city chairmen's meeting of Jan. 25, 1966, p. 59;
# the governors' Washington office, p. 33; Murphy's election, p. 27; the Ripon Society's officers, p. 68). The
# documents it quotes in its text (the Coordinating Committee's papers, p. 52; the fifty-four members'
# statement, p. 17; Ford's Bowling Green speech, p. 29) are quoted without a note. So no record is logged.
