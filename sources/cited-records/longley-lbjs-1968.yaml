# The records w.longley-lbjs-1968 cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule,
# Oct. 28, 2026). Read Oct. 29, 2026 (book run, Longley) from the owner's copy, the notes at pp. 287-331 read by
# chapter and number (the key the `via` rows use: page, the text page the note's number stands on; note, its number;
# several records under one number lettered a, b ... in the note's order). Only the records behind the passages the
# calendar cites. Published works the notes cite (memoirs, studies, FRUS and the Public Papers as such) are not
# listed; a record FRUS, the Papers or the Record prints is `found` there. Longley's notes cite FRUS by page and often
# by the wrong document number (doc. 213 for every Pueblo meeting of Jan. 23-25): `where` keeps the note's form,
# `found` the document that holds the words.
