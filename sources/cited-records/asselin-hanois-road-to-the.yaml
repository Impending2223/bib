# The records w.asselin-hanois-road-to-the (Pierre Asselin, Hanoi's Road to the Vietnam War, 1954-1965, 2013) cites for
# the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026). Logged Oct. 29, 2026 (stage 5
# backfill, chen-asselin-nguyen) from the owner's copy, the notes at pp. 213-290 read off the page by chapter and number:
# `page` is the text page the note's number stands on, `note` its number; several records under one number lettered a, b
# in the note's order. Records as Asselin cites them (his Vietnamese titles without diacritics). Published studies and
# the official histories (Lich su quan su Viet Nam, Victory in Vietnam, Duiker, Turley) are works, not records, and are
# not listed. Asselin's abbreviations: VNAC3, Vietnam National Archives Center 3, Hanoi; VKD, Van kien Dang--Toan tap
# (vol. 22, 1961; 23, 1962; 24, 1963; 25, 1964); FGDH, the French General Delegation at Hanoi; AO:VN, ADF, Asie-Oceanie,
# Vietnam, Archives diplomatiques de France; BCGH, the British Consulate General at Hanoi; SEAD, the Foreign Office's
# Southeast Asia Department; NAUK, the National Archives, Kew; LAC, Library and Archives Canada, Ottawa; DPC, the Douglas
# Pike Collection, VATTU, the Vietnam Archive at Texas Tech University.
