# The records w.branch-pillar-of-fire cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Logged Oct. 29, 2026, by the batch 3 reading (Taylor Branch, Pillar of Fire: America in the King Years, 1963-65), from
# the owner's copy, the source notes at pp. 621-708 read off the page (OCR, put right where it misread).
# Branch's notes are not numbered: each is keyed by the printed page of the text it serves and a catchphrase. Here `note`
# is the catchphrase's first words, hyphenated, as printed (a footnote's with "fn-"); several records under one
# catchphrase are lettered .a, .b ... in the note's order. The "n." of an entry's `via` rows counts the same way.
# Collections by Branch's abbreviations (pp. 617-19): A/ the King Library and Archives, Atlanta (A/KP King's papers, A/SC
# the SCLC's, A/SN the SNCC's, A/MFDP, A/AR the Anne Romaine papers); F and letters, an FBI file (FK King, FLP the Penn
# case, FMB the MIBURN case, FMX Malcolm X; the rest keyed there to the file numbers); PDD, the President's Daily Diary;
# LBJ, the LBJ Library; LHM, an FBI letterhead memorandum; MDAH, MSSC, SHSW, TOU, UNC as Branch lists them.
# Only the records the notes give for the passages that ground a calendar entry; published works the notes cite are not
# listed, nor the notes' commentary. The author's own interviews (`kind: interview`) are logged but not put in the
# entries' To check: no copy. The claims each record grounds are the `via` rows of the entries' maps.
