# Daylight saving time and the standard zones: the register (kept by hand). For each State and D.C., 1960-68, whether
# and when it kept daylight saving time: the State's law, the local option where the State had none, the dates
# observed each year where a source gives them; the Federal law (the Standard Time Act of 1918, the Uniform Time Act of
# 1966 and its effective date, the States' exemptions under it); the zone boundaries where a State lay in two zones; and
# the IANA tz database's history set against the law and practice read, for the zones the series uses. Begun Nov. 10,
# 2026, at the owner's request (Nov. 6, 2026: "... to find the State and Federal adoption of daylight time"). The hours
# of the polls: sources/poll-hours.yaml. The memo: notes/extensions/memos/poll-hours.md. Checks: tools/bib/pollhours.py.
#
# Sources, by key (each row's `sources` names its page and copy):
#   DOANE     Doris Chase Doane, *Time Changes in the U.S.A.* (1966), with its *Supplement ... 1966 through 1969*
#             (1969), an astrologers' reference (Professional Astrologers Inc.): a State a section, the standard time
#             adopted and "Daylight (or War) Time Observed", statewide and by local ordinance, with a table of dates; its
#             "1966 Time Picture" (pp. 168-70) and the Supplement's "Daylight Saving Time Observance", 1967-72 (pp.
#             3-4). Its sources are named only in general ("Suggested Time Reference Sources", p. 172); it warns
#             "Check with local authorities" throughout. archive.org, time-changes-in-usa-1966 (open; the leaf is the
#             printed page plus one in the main text). A compilation, not law: its rows say "observed", not "enacted".
#   CTU-1963-S  the Committee for Time Uniformity's "Extent of Observance in 1963 of Daylight Saving Time in the United
#             States", "derived from 1962 reports received from the individual States, as adjusted by 1963 reports
#             received as of Apr. 25, 1963", printed in *Uniform Time Legislation: Hearings Before the S. Comm. on
#             Commerce*, 88th Cong. 21-22 (1963) (govinfo CHRG-89shrg98118; PDF page = printed + 6)
#   CTU-1963-H  the Committee's table of the same title, "derived from 1963 reports received from official sources
#             within the individual States", attached to Rep. Fulton's statement, *Uniform Time: Hearings Before the
#             Subcomm. on Commerce and Finance of the H. Comm. on Interstate and Foreign Commerce*, 88th Cong. 37-38
#             (1964) (CHRG-88hhrg36471; PDF page = printed + 6). It differs from CTU-1963-S for Colorado, Michigan and
#             Oklahoma.
#   CTU-1965  the Committee's "Extent of Observance in 1965 ...", "derived from 1965 reports received from State
#             officials and other sources", *Uniform Time: Hearing Before the H. Comm. on Interstate and Foreign
#             Commerce*, 89th Cong. 71-73 (1966) (CHRG-89hhrg58797; PDF page = printed + 6)
#   S-1965    the Committee's "Background on the Snarls in Time Observance", *Uniform Time Legislation: Hearing Before
#             the S. Comm. on Commerce*, 89th Cong. 25-30 (1965) (CHRG-89shrg47149; PDF page = printed + 6)
#   The witnesses' and the Committee's statements of a State's law are `cited` grounds (the law not read here).
#
# Top level: federal (the Federal law, a row an act or order), states (a row a State), zones_split (the States in two
# zones), tz (the comparison).
#   federal    {act, cite, url, does, effective, sources}
#   states     st, name, zones (the IANA zones the series uses for its places), law (optional: the State's own law as a
#              source states it, or as read), years, surveys, leads (optional)
#     years    a list, each {span 'YYYY..YYYY', observed, dates (optional), places (optional), sources, check
#              (optional)}; observed is one of
#                none       no daylight time kept in the State (local exceptions, if any, in places)
#                local      kept by local option or ordinance only, in places named or not
#                most       kept statewide but in places named (places)
#                statewide  kept by State law or throughout the State
#                federal    the Uniform Time Act's advanced time (1967-68), the State not exempt
#                exempt     the State exempt by its law under § 3(a) of the Act
#              dates, a list of 'YYYY-MM-DD..YYYY-MM-DD', the first and last days of advanced time (the change at
#              2 a.m. unless a source says otherwise), for the statewide (or main) observance only
#     surveys  {CTU-1963-S, CTU-1963-H, CTU-1965, DOANE-1966}: the category each puts the State in (statewide, local,
#              none, reverse: the Committee's "in reverse", a place keeping the zone to its west all year)
#   zones_split  {st, zones, line, sources}: where the boundary ran, as the rules read give it
#   tz         {zone, places (the series' States or places it stands for), years, tz (what the database gives),
#              read (what the sources read give), agrees (yes | no | partly), note}
federal:
- act: 'An Act to save daylight and to provide standard time for the United States (the Standard Time Act), as amended'
  cite: 'Act of Mar. 19, 1918, ch. 24, 40 Stat. 450; 15 U.S.C. §§ 261-264 (1964)'
  url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf'
  does: 'five zones (eastern, central, mountain, Pacific, Alaska), their limits defined by the Interstate Commerce Commission; the zone''s standard time governs the common carriers and the acts of Federal officers. Its daylight saving was repealed in 1919; from 1946 to 1966 no Federal law advanced the clock, the States and localities choosing'
  sources:
  - {ref: 'Uniform Time Act of 1966, § 2 (recites the 1918 act, 40 Stat. 450; 15 U.S.C. 261-264, and the 1921 act)', page: '80 Stat. 107', url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf', ground: seen}
  - {ref: 'S-1965 (the Commission''s statement: "the decision to adopt daylight saving time or to remain on standard time is left to the States and local communities")', page: '14', url: 'https://www.govinfo.gov/content/pkg/CHRG-89shrg47149/pdf/CHRG-89shrg47149.pdf#page=20', ground: seen}
- act: 'An Act to transfer the Panhandle and Plains section of Texas and Oklahoma to the United States standard central time zone'
  cite: 'Act of Mar. 4, 1921, 41 Stat. 1446; 15 U.S.C. § 265 (1964)'
  url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf'
  does: 'all of Texas and Oklahoma in the central zone (El Paso and Hudspeth Counties kept mountain time all year: CTU-1965; the line moved to them in 1970: zones_split)'
  sources:
  - {ref: 'Uniform Time Act of 1966, § 2', page: '80 Stat. 107', url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf', ground: seen}
- act: 'Uniform Time Act of 1966'
  cite: 'Pub. L. 89-387, 80 Stat. 107 (Apr. 13, 1966); 15 U.S.C. §§ 260-267'
  url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf'
  does: '§ 3(a): the standard time of each zone advanced one hour from 2 a.m. on the last Sunday of April to 2 a.m. on the last Sunday of October, "except that any State may by law exempt itself ... but only if such law provides that the entire State (including all political subdivisions thereof) shall observe the standard time"; § 3(b): State and local laws providing other advances or dates superseded; § 3(c): the ICC to enforce by injunction; § 4: eight zones (Atlantic, eastern, central, mountain, Pacific, Yukon, Alaska-Hawaii, Bering), their limits by ICC order; § 6: effective Apr. 1, 1967, but a place keeping daylight time in 1966 to keep it from 2 a.m. on the last Sunday in April 1966 to the last Sunday in October'
  effective: '1967-04-01'
  sources:
  - {ref: '80 Stat. 107-109', page: '107-109', url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf', ground: seen}
- act: 'Department of Transportation Act, § 6(e)(5): the ICC''s functions under the 1918 and 1921 acts and the Uniform Time Act transferred to the Secretary of Transportation'
  cite: 'Pub. L. 89-670, § 6(e)(5), 80 Stat. 931, 939-940 (Oct. 15, 1966); § 15(a), 80 Stat. 949 (effective ninety days after the Secretary first took office, or earlier by the President''s order)'
  url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg931.pdf#page=10'
  does: 'the zones and the Act''s enforcement the Department''s from its opening (Apr. 1, 1967: check, the executive order fixing the day not read)'
  sources:
  - {ref: '80 Stat. 939-940, 949', page: '939-940, 949', url: 'https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg931.pdf#page=10', ground: seen}
- act: 'Standard time zone boundaries: Atlantic standard time zone (OST Docket No. 10, Amdt. 1), amending Part 239 (formerly Part 139) of 49 C.F.R.'
  cite: '32 Fed. Reg. 16,162-64 (Nov. 25, 1967), effective Dec. 23, 1967'
  url: 'https://www.govinfo.gov/content/pkg/FR-1967-11-25/pdf/FR-1967-11-25.pdf#page=22'
  does: 'the Atlantic zone created (Puerto Rico, the Virgin Islands; not Maine); the zones'' definitions renumbered under the Uniform Time Act. The ICC''s zone rules were Part 139 before the Department''s Part 239'
  sources:
  - {ref: '32 Fed. Reg. 16,162-64', page: '16162-64', url: 'https://www.govinfo.gov/content/pkg/FR-1967-11-25/pdf/FR-1967-11-25.pdf#page=22', ground: seen}
- act: 'Standard time zone boundaries, recodified (49 C.F.R. pt. 71)'
