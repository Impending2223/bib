# The register (tools/bib/lives.py, register; notes/guide/names.md): the fourth source of name entries, after
# Part III, the Executive roster and the Congress rosters (the owner, Nov. 22, 2026: "Can't we just give the name
# register and start going?"). A person the calendar's 'Names:' lines name whom none of those holds: a key a
# person; `name` as the calendar writes it, in its own order; `chars`, his characters as the entries most often give
# them (a simplified and a traditional form one man); `polity` (sources/polities.yaml) where the threads of the
# entries naming him make it plain; `apart`, persons of the series whose form the name shares and who are other
# men (the characters differ). A name two strings of characters give is two men (key, key-2); a name the
# characters give two romanizations of is one, the other form in sources/name-forms.yaml. ./bib check holds it
# (lives.register_problems). Rows made from the names-unknown warnings of Nov. 22, 2026.
