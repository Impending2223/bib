# State laws and constitutions: the register (kept by hand). For each State and D.C., 1959-69: where the session laws,
# the compiled statutes or code, the constitution as then in force, the legislative journals and the attorney
# general's opinions were made and printed; the law that obliged an officer to compile, keep or publish each, as
# then in force where found; the basis of our belief that each exists; and every copy with its access from here.
# Begun Oct. 24, 2026, at the owner's request ("create and maintain a similar listing for sourcing State constitutions
# and laws ... take care for the legal authority for the recording, compilation, and publication of the constitution
# and the laws. Identified authority is strongly preferred"). The States the calendar names most were done first.
#
# Per State: st, name, notes (optional), items: one per publication, each:
#   kind       session laws | code | constitution | journal | ag opinions | other
#   title      as the volume or the catalog gives it (say which, where the volume was not seen)
#   form       optional: the title page's own words, read, with what else it says of its making
#   years      the volumes or editions of the period, as found
#   officer    who compiled, printed or certified it, as the volume or the law says
#   printed_in (constitutions) where its official text was printed then
#   authority  the law obliging an officer to make, keep, compile or publish it, one a line:
#              {law: the provision, as then in force where found (its words where read), read: the volume or edition
#              read and where, url} or {law, cited_in: where it is cited (a title page, a certificate), url}
#   authority_searched  where no authority is found, or only a citation: "authority not found" in effect, and what
#              was searched. An item has `authority`, `authority_searched`, or both.
#   basis      why we believe it exists, as in sources/states.yaml: {ground: seen | catalog | law | cited | assumed,
#              ref, url}; HathiTrust records by the Bib API (catalog.hathitrust.org/api/volumes/brief/...), whose
#              answer gives the record's volumes and rights
#   cited_as   patterns (Python regular expressions, case ignored) by which the series' files cite it (a pattern with
#              a space counts only where the State is meant: tools/sources/make_listing.py STYLE 2)
#   online     one line each, {host, url, years, access, checked, note}; access as in sources/states.yaml (open,
#              borrow, bot-check, blocked, dead, other), tested from here on `checked`, one request a second. A
#              HathiTrust line is bot-checked (its pages; the Bib API answered on the date). A page that answers but
#              is a script application, or a soft 404, says so in `years` or `note`: `open` is the page, not the volume.
#   notes      optional
# Recheck: python3 tools/sources/check_access.py --law [--write] [--st XX ...]
# The listing: python3 tools/sources/make_listing.py writes notes/state-law-sources.md from this file (rerun after
# every change; ./bib check warns when it is stale). Checks: tools/bib/state_law.py.
