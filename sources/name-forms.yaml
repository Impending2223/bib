# Kept by hand. The other forms of each name Part III writes in its own order, without a comma (tools/bib/lives.py,
# natural): the romanizations and spellings FRUS's lists of persons give, and the forms the presidential documents
# use. FRUS takes a form as a list's whole name ('Mao Tse-tung', 'Diem, Ngo Dinh'), or as the name before a title
# ('Souvanna Phouma, Prince'); APP takes it as a phrase in the text. A form here must name the one person: not
# 'General Minh' (several), not 'Madame Nhu' for Nhu. Keyed by the name as Part III writes it, its own script dropped.
