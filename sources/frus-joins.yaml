    why: Pakistani Minister of Foreign Affairs and Commonwealth Relations, 1947–54, in each.
  - keys: [arif-abdul-salam-muhammad, arif-abd-al-salim-muhammad]
    why: Iraqi Deputy Prime Minister (1958); President of Iraq, Feb. 1963–Apr. 1966.
  - keys: [pachachi-adnan-m, pachachi-adnan-al]
