  - keys: [taher-abdel-hadi, tahir-abd-al-hadi]
    why: Governor of Petromin, the Saudi General Petroleum and Mineral Organization, in both.
  - keys: [camps-miriam, camp-miriam]
    why: Office of European Regional Affairs, economic organization; later Policy Planning. Miriam Camps.
  - keys: [jorgensen-gordon-l, jorgenson-gordon-l]
    why: Embassy in Vientiane; Chief of the CIA Station in Saigon.
  - keys: [sacksteder-frederick-h-jr, sackstedter-frederick-h-jr]
    why: Office of Western European Affairs; Mission to the United Nations.
  - keys: [leuam-insisiengmay, leum-insisiengmay]
