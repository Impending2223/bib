  - keys: [kim-jong-pil, kim-chong-pil]
    why: Director of the KCIA; Prime Minister of the Republic of Korea from June 3, 1971.
  - keys: [yu-ta-wei, yu-ta-wai]
    why: Minister of Defense of the Republic of China in both.
  - keys: [paik-too-jin, paik-doo-jin, paik-tu-chin]
    why: Prime Minister of the Republic of Korea from Dec. 19, 1970.
  - keys: [zimmermann-warren, zimmerman-warren]
    why: Policy Planning Staff; political officer, Embassy in the Soviet Union. Warren Zimmermann.
  - keys: [moffat-jay-p, moffatt-jay-p]
