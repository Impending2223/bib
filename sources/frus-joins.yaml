  - keys: [beckett-john-a, beckett-j-angus]
    why: John Angus Beckett, of the British Ministry of Fuel and Power, its Petroleum Division, and its petroleum attaché in Washington.
  - keys: [sternfeld-reuben, sternfeld-ray]
