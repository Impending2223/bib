  - keys: [cho-chung-hwan, cho-chung-whan, cho-chong-hwan, cho-chung-hwan-cho]
    why: Vice Minister, then Minister, of Foreign Affairs of the Republic of Korea.
  - keys: [le-nguyen-khang, le-nguyen-thang]
    why: Commander of the Vietnamese Marine Corps and of III Corps, 1966–68.
  - keys: [nguyen-duy-trinh, nguyen-dinh-trinh]
    why: Deputy Prime Minister and Foreign Minister of the Democratic Republic of Vietnam in both.
  - keys: [phan-huy-quat, pham-huy-quat, pham-hut-quat]
