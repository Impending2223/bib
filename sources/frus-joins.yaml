  - keys: [lin-piao, lin-biao]
    why: Minister of Defense of the People's Republic of China, 1959–71, in both; Wade-Giles and pinyin.
  - keys: [huang-chen, huang-zhen]
    why: PRC Ambassador to France; Chief of the PRC Liaison Office in Washington from 1973; Wade-Giles and pinyin.
  - keys: [chen-i, chen-yi]
    why: Foreign Minister of the People's Republic of China in both.
  - keys: [chi-peng-fei, chi-peng-tei]
    why: Vice Minister, then Foreign Minister, of the People's Republic of China.
  - keys: [chung-il-kwon, chung-ii-kwan]
