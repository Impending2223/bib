title: Republic of Vietnam provinces, late 1966, approximated by GADM 4.1 level-2 districts
date: late 1966 (after Sa Đéc's re-creation, 24 Sept. 1966; before Trà Ôn and Vũng Liêm moved to Vĩnh Long, 14 Jan. 1967)
method: each modern district (GADM 4.1, pre-2025) assigned whole to the 1966 unit holding most of it; Vĩnh Linh and Cồn Cỏ (north of the Bến Hải)
  dropped; Côn Sơn from Natural Earth (GADM lacks Côn Đảo)
counts:
  provinces: 44
  autonomous_cities:
  - Huế
  - Đà Nẵng
  - Cam Ranh
  - Đà Lạt
  - Vũng Tàu
  - Sài Gòn
  special:
  - Côn Sơn (administrative base, Interior Ministry)
general_sources:
- https://vi.wikipedia.org/wiki/T%E1%BB%89nh_(Vi%E1%BB%87t_Nam_C%E1%BB%99ng_h%C3%B2a)
- https://en.wikipedia.org/wiki/First-level_subdivisions_of_Vietnam
- https://en.wikipedia.org/wiki/I_Corps_(South_Vietnam)
- https://en.wikipedia.org/wiki/II_Corps_(South_Vietnam)
- https://en.wikipedia.org/wiki/III_Corps_(South_Vietnam)
- https://en.wikipedia.org/wiki/IV_Corps_(South_Vietnam)
- https://vi.wikipedia.org/wiki/Bi%E1%BB%87t_khu_Th%E1%BB%A7_%C4%91%C3%B4
note_sources: No en Wikipedia article 'Provinces of South Vietnam' exists (Oct. 2026); the vi list 'Tỉnh (Việt Nam Cộng hòa)' serves. Areas 'against
  N (year)' in notes compare the GADM area with the figure the articles print.
later_changes_to_1975:
- '14 Jan. 1967: Trà Ôn and Vũng Liêm from Vĩnh Bình to Vĩnh Long.'
- '7 Sept. 1967: Tuyên Đức''s capital moved from Đà Lạt to Tùng Nghĩa.'
- '1967–68 (date not found): Bình Tuy back in III CTZ.'
- '1970: Gia Định takes Cần Giờ and Quảng Xuyên from Biên Hòa; Gia Định joins MR 3 (1 July 1970, CTZs renamed Military Regions).'
- 'By 1974: autonomous towns added: Cần Thơ, Mỹ Tho, Nha Trang, Qui Nhơn, Rạch Giá; special zone Phú Quốc (vi W list of 1974).'
- '1 Nov. 1974: Côn Sơn becomes Phú Hải town of Gia Định.'
