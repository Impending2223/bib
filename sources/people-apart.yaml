# Persons the name rules would join who are two, kept apart by hand (tools/bib/lives.py, people). Each pair as
# Part III, the Executive roster or the Congress rosters write them, with the reason. `check` fails on a name here that
# no source writes.
- names: ['Moses, Robert', 'Moses, Robert P.']
  reason: Robert Moses (1888-1981), New York's builder, president of the World's Fair of 1964-65; Robert P. Moses
    (1935-2025), of SNCC and COFO. Part III may drop a middle initial, so the bare name would join the fuller.
- names: ['Martin, John Bartlow', 'Martin, John B.']
  reason: John Bartlow Martin (1915-1987), writer, Stevenson's and Kennedy's speechwriter, Ambassador to the Dominican
    Republic, 1962-63; John B. Martin, Michigan Republican,
    Commissioner on Aging, 1969-73. The initial agrees.
