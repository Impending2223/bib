    rows:
      - date: '1960-08-09'
        kind: change
        before: 1.90
        price: 1.76
        by: Esso Export
        note: 'Esso Export''s new posting, 14 cents less; "old price" $1.90. The day, Aug. 9: the CIA''s Central Intelligence Bulletin, Aug. 16, 1960, and Current Intelligence Weekly Summary, Aug. 18, 1960.'
        source: 'The Oil and Gas Journal, Aug. 15, 1960 (vol. 58, no. 33), 83, "Esso Export''s New Middle East Postings"'
        cite: '*Oil and Gas Journal*, Aug. 15, 1960, 83'
