      - date: '1960-09'
        kind: change
        before: 1.76
        price: 1.80
        by: Esso Export
        note: Esso Export restores up to 4 cents, the week before Sept. 19, to the other companies' postings; the pattern settles at $1.80.
        source: 'The Oil and Gas Journal, Sept. 19, 1960 (vol. 58, no. 38), 81, "World Crude Prices Adjusted Higher"'
        cite: '*Oil and Gas Journal*, Sept. 19, 1960, 81'
