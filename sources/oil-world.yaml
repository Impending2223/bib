# Kept by hand: the world's oil a year, 1960-68, and the posted price of Arabian light, for the calendar's Oil thread.
# tools/bib/oilworld.py reads it (its docstring and STYLE notes); a calendar entry tagged oilworld:<YYYY> carries the
# year's table, one tagged oilprice:ras-tanura the table of posted prices. Quotation marks straight, as typed.
#
# production: crude oil by country, thousand 42-gallon barrels in the year, as the Bureau of Mines' Minerals Yearbook
#   for the year printed it ("World production of crude petroleum by countries"; the year's column, preliminary), read
#   off the page images of archive.org's copies (item, leaf: the first page's leaf, 0-based) and held, every row of the
#   column, to the table's printed continent and world totals (Oct. 22, 2026; the rows not kept here are the world total
#   less the kept ones). prior: the year before as the same table printed it, revised; the change is from it.
#   Keys: us, ussr (with Asia), venezuela, saudi, kuwait, iran, iraq, libya, canada, indonesia (with West Irian from 1964),
#   algeria (with the Sahara), nigeria, qatar, trucial (the Trucial States: Abu Dhabi alone through 1968; Dubai's Fateh
#   field to produce from late 1969, Minerals Yearbook 1968, IV, 950-951), mexico, neutral (the Kuwait-Saudi Arabia
#   Neutral Zone, printed apart). A country with no production that year is left out. estimate: the rows the table marks
#   "e". us_today: EIA's U.S. field production of crude oil today, thousand barrels (MCRFPUS1, annual), shown where it
#   differs from the Yearbook's figure.
# reserves: proved reserves by country, thousand barrels, from the Oil and Gas Journal's year-end "World Wide Oil at a
#   Glance" table (the last issue of the year; archive.org, open, 1959-61 only), read off the page; free_world and bloc
#   (the table's "Russia and controlled areas") as printed, ussr from the bloc's footnote.
# posted: the posted price of crude oil, dollars a barrel f.o.b., each dated: `date` the day or month it took effect or
#   was read; `kind` change (a new posting) or quoted (a reading of a price in force); the source with its page.

