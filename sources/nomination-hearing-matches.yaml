# Kept by hand: the nominees of sources/nomination-hearings.yaml whom the rules of tools/bib/hearings.py cannot
# settle (its RULES 1 and 4). Read Nov. 5, 2026, each against the hearing's own text (govinfo's PDF, its text layer).
#
#   matches   {package, name, person, why}: `name` as the generated file gives the nominee; `person` the name entry's
#             name (people() in tools/bib/lives.py), or null where the nominee is no one the series holds; `why`
#             the ground, with the hearing's words or the series' record that gives it
#   open      {package, name, why}: not settled; why, and what would settle it. `./bib hearings open` lists every
#             nominee whom only a name fits; a row here says it has been read and left
#
# `check` [hearings] fails on a row whose package or name the file does not hold, a person who names no one, a row
# without its reason.

