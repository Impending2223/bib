    url: https://archive.org/details/alabama-official-statistical-register-1975
    verified: true
  - host: Alabama Dept. of Archives and History digital collections (CONTENTdm, collection 'register')
    view: full (reported)
    years: 1963 edition at id/593; the collection presumably holds the others
    url: https://digital.archives.alabama.gov/digital/collection/register/id/593
    verified: false
  label_1968:
    edition: '1971'
    democratic: unverified (see notes)
    wallace: unverified (see notes)
    source: https://archive.org/details/alabama-official-statistical-register-1971/page/n399/mode/1up (pp. 393-410)
    verified: false
  other_labels: 'The 1967 edition (1966 returns) uses "(Dem.)" and "(Rep.)" and gives keys in footnotes: "*A.C.P.
    - Alabama Conservative Party", "*T.P.F.A. - Third Party For America", "*N.S.R.P. — National States Rights Party",
    "*N.W.A.P. — National White American Party". Its index also has "American Party" (1964). The 1963 edition has
    a heading "NATIONAL STATES RIGHTS PARTY CANDIDATES". The 1975 edition (1972, 1974 returns) uses "(D)", "(R)",
    "(NDPA)", "(AC)", "(I)", and once each "(NPA)" and "(NDAP)"; I did not find the key in the OCR.'
  modern_archive: None found for 1956-74 from the Secretary of State. (The AUM library's "Alabama Elections Collection"
    is a university collection, not a State publication.)
  notes: 'In the 1971 edition the 1968 tables are printed sideways, and the OCR comes out as mirrored nonsense ("For
    Presidential Elector Place No. 8 ... NOSNiaoa aor Aiim"), so I could not read the column labels. The page images
    were blocked here. What the label should be, per Wikipedia (secondhand): Wallace''s electors were the Alabama
    Democratic Party''s ballot line; Humphrey''s ran on two lines, "Alabama Independent Democrat" and the National
    Democratic Party of Alabama (NDPA). Wikipedia''s table relabels Wallace as "American Independent". Someone should
    look at pp. 396-410 by eye. Alabama voted for electors one at a time ("Place No. 1-10"), so the Register prints
    a vote for each elector, not one slate total.'
