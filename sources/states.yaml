- st: AL
  publication: Alabama Official and Statistical Register (quadrennial; same title through the period)
  publisher: Alabama Department of Archives and History (State Department of Archives and History), Montgomery
  frequency: quadrennial (1955, 1959, 1963, 1967, 1971, 1975)
  covers: 'Each edition prints the two general elections before it (checked in each edition''s OCR): 1959 = Nov.
    1956 and Nov. 1958; 1963 = Nov. 1960 and Nov. 1962; 1967 = Nov. 1964 and Nov. 1966; 1971 = Nov. 5, 1968 and
    Nov. 3, 1970; 1975 = Nov. 7, 1972 and Nov. 5, 1974. (1955 = 1952 and 1954.) Primaries and runoffs are printed
    too. The 1968 general returns are pp. 393-410 in the 1971 edition; Wikipedia cites pp. 396-410 for the presidential
    vote.'
