    covers: 'one Statement per election; special elections since the last Statement are printed in the next one (''Including: Special Elections'')'
    contents:
      general: President (slates), U.S. Senate, U.S. House, by county; Supplement by district and city
      specials: 'yes, with votes, every one checked. 1963-01-22 CA-1 (Clausen 79,292; Grader 65,339; Stuart 1,661), 1963-06-11 CA-23 and 1964-02-18 CA-5: Nov. 3, 1964 Statement, ''Special Elections in 1963 and 1964'', pp. 28-29 (1962-64 vol., leaves ~179-180). 1965-12-15 CA-26 run-off (Rees 40,430; Marshall 27,579) and 1966-06-07 CA-14 special primary: June 7, 1966 Statement (1966-68 vol., leaf ~50). 1967-12-12 CA-11 run-off: 1966-68 vol., leaf ~185. 1969-04-29 CA-27 run-off and 1970-06-30 CA-24 and CA-35 run-offs: Nov. 3, 1970 Statement, ''Special Elections in 1969 and 1970'' (1970-72 vol., leaves ~57-58). 1974: June 4, 1974 primary Statement, ''Special Election Results'' pp. 51-54 (1973-74 vol., p. 54 = leaf n95): CA-6 special primary June 4, 1974 (Burton 73,114, 50.02%*) and CA-13 special primary MARCH 5, 1974 (Lagomarsino 52,140, 53.64%*). Special primaries and run-offs both printed, precinct, absentee and total vote, by county; some 1969-70 tables give ''total vote only''.'
      state_races: governor and all statewide offices by county; State Senate and Assembly by district (county breakdown); judges; propositions
      primaries: official, all parties (Democratic, Republican, minor), by county, in the primary Statement; no run-offs (none in California primaries)
