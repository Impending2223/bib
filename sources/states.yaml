# State election sources: each State's own official publications of election returns (blue books, legislative
# manuals, registers, statements of vote, official canvasses, abstracts, count books, State election databases),
# where they can be read, and whether this environment can open them. Kept for the elections, specials and any
# State races; the House Clerk's Statistics remain the series' source for the returns until a State source is read.
#
# DRAFT, 2026-10-06: the first survey, made while the network blocked most hosts. Entries marked `verified: false`
# were not opened. A verification pass (access from here, specials, State races, primaries) will replace this.
# Recheck access: python3 tools/sources/check_access.py [--write] [--st XX ...]
