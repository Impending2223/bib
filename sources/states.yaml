# State election sources: each State's own official publications of election returns (blue books, legislative
# manuals, registers, statements of vote, official canvasses, abstracts, count books) and State election
# databases; where they can be read; what they print; and whether a session in this environment can open them.
# Surveyed and verified 2026-10-06, for 1956-1974 first; many series run on before and after (see `years`).
# The House Clerk's Statistics remain the series' source for the returns (elections/); this register is where
# to look for what the Clerk does not print (specials between Novembers, State races, primaries) and to check it.
#
# Per State:
#   sources: one per publication or database
#     title, publisher, kind (blue book | canvass | statement of vote | register | database | count book | report),
#     frequency, covers (which edition prints which election)
#     contents: general (President, Senate, House; level), specials (congressional specials between Novembers,
#       with votes or not, as checked), state_races (governor, statewide, legislature), primaries (official or
#       party; parties; runoffs; level), checked_in (the edition and pages looked at)
#     online: one line each, {host, url, years, access, checked, pattern, rights, note}
#   labels_1968: the Democratic and Wallace slates as the State printed them (verified: true where read on the page)
#   best_for_specials: where to get vote counts for this State's specials (congress/specials.yaml)
#   gaps: what is not online for 1956-1974, and where it is (State archives, microfilm, paper)
#
# access, as tested from this environment on `checked`:
#   open       the page or file answers with content
#   borrow     Internet Archive lending only (needs a login)
#   bot-check  the site answers with a bot challenge (Cloudflare "Just a moment...", AWS WAF, captcha). Do not try
#              to get around it; a person in a browser can open it. HathiTrust's pages are bot-checked here, but its
#              catalog data feeds answer (catalog.hathitrust.org/api/volumes/brief/htid/<id>.json; the Bib API;
#              the monthly hathifile): use them for holdings and rights, not text.
#   blocked    this environment's network policy refuses the host (the environment's network settings can allow it)
#   dead       404 or gone; other: see the note
# Recheck: python3 tools/sources/check_access.py [--write] [--st XX ...]
#
# Ways in that work from here: archive.org item pages, OCR text (https://archive.org/download/<id>/<id>_djvu.txt)
# and page images (https://archive.org/download/<id>/page/n<N>.jpg); CONTENTdm APIs on State collections; some
# State sites want a browser User-Agent (Kentucky, Utah); www.nj.gov works where nj.gov is refused.
- st: AK
  name: Alaska
  sources:
  - title: '"State of Alaska Official Returns by Election Precincts, General Election <date>" (1970: "Published by Lieutenant Governor"); separate "... Primary Election <date>" (1968: "Published by Secretary of State") and "... Special Election March 6, 1973"'
    publisher: Secretary of State, from 1970 Lieutenant Governor (Division of Elections)
    kind: canvass
    frequency: each election
    covers: one pamphlet per election; 1958 statehood referendum and general in one volume (paper only)
    contents:
      general: President, U.S. Senate, U.S. House at large, by precinct with election-district totals and a statewide recapitulation
      specials: 'yes, with votes. 1973-03-06 AK-0 checked: Notti (D) 33,123, Young (R) 35,044, persons voting 69,121, by precinct (73spec.pdf p. 8 statewide totals); also a bonding proposition on the same ballot'
      state_races: governor-lieutenant governor (1970 checked), State Senate and House by precinct within election district (1970 'State Representatives' pages), judicial retention by judicial district, referenda
      primaries: 'official, separate pamphlet each primary (open primary, all parties on one ballot; 1968 checked: Senate Gravel, Gruening (D), Rasmuson, Stevens (R); House Begich, Rader, Veach, Wright (D), Pollock (R)), by precinct'
      checked_in: 68genr.pdf p. 2; 70genr.pdf pp. 1-3, 12, 20, 24, 27; 68prim.pdf pp. 1-2; 73spec.pdf pp. 1-2, 9
    online:
    - {host: Alaska Division of Elections, url: 'https://www.elections.alaska.gov/Core/Archive/68GENR/68genr.pdf', years: general 1960-1974 every even year, access: open, checked: '2026-10-06', pattern: 'https://www.elections.alaska.gov/Core/Archive/YYGENR/YYgenr.pdf, same files at /results/YYGENR/YYgenr.pdf (tested 60, 62, 64, 66, 68, 70, 72, 74; 58 is 404)'}
    - {host: Alaska Division of Elections, url: 'https://www.elections.alaska.gov/Core/Archive/68PRIM/68prim.pdf', years: primary 1960-1974, access: open, checked: '2026-10-06', pattern: 'https://www.elections.alaska.gov/Core/Archive/YYPRIM/YYprim.pdf (tested 60-74 even years)'}
    - {host: Alaska Division of Elections, url: 'https://www.elections.alaska.gov/Core/Archive/73SPEC/73spec.pdf', years: 'special election Mar. 6, 1973', access: open, checked: '2026-10-06'}
    - {host: Alaska Division of Elections, url: 'https://www.elections.alaska.gov/doc/info/ElectionResults.php', years: index page, access: bot-check, checked: '2026-10-06', note: 'access: bot-check (AWS WAF captcha, HTTP 405)'}
    - {host: Alaska Division of Elections, url: 'http://www.elections.alaska.gov/doc/info/stathood.htm', years: '1958', access: bot-check, checked: '2026-10-06', note: 'access: bot-check (WAF, 403)'}
    - {host: Alaska State Library, url: 'https://lam.alaska.gov/elections', years: research guide, access: open, checked: '2026-10-06'}
    notes: 'Scanned images, no text layer; tesseract reads them adequately. The State Library guide lists print holdings: 1958 returns (JK9593 1958.A53); official returns by precinct, general 1960-1984 and primary 1958-1984 (JK9592.A35, .A37); and says the paper returns are sometimes more detailed than the website''s scans.'
  labels_1968:
    democratic: Humphrey (D)
    wallace: Wallace (I)
    source: 68genr.pdf p. 2 (column heads under 'U.S. President')
    verified: true
  best_for_specials: the Division of Elections' 73SPEC/73spec.pdf (votes by precinct)
  gaps: 1958 statehood/general returns not online (State Library print). No blue book used.
- st: AL
  name: Alabama
  sources:
  - title: Alabama Official and Statistical Register
    publisher: Alabama Department of Archives and History (Milo B. Howard, Jr., Director, 1971)
    kind: blue book
    frequency: quadrennial (1955, 1959, 1963, 1967, 1971, 1975, 1979); the 1971 edition was printed late (it notes events of 1972-73)
    covers: 'each edition prints the elections of the four years before it: 1959 = 1956-58; 1963 = 1960-62; 1967 = 1964-66; 1971 = 1968-70; 1975 = 1972-74'
    contents:
      general: President (a vote for each elector, Place No. 1-10, by county; elector names as column heads, no party label on p. 396 of the 1971 ed.), U.S. Senate, U.S. House, by county
      specials: 'no votes. 1972-04-04 AL-3: the 1971 Register (Congress chapter) says only ''Mrs. Elizabeth Bullock Andrews ... nominated by Democratic Executive Committee to succeed her husband, January 27, 1972; elected April 4, 1972; took her seat, April 9, 1972.'' The 1975 Register''s election chapter has no special-election table (its OCR headings: Dem. primary May 2, 1972; second primary May 30, 1972; general Nov. 7, 1972; amendment elections). She was unopposed.'
      state_races: governor and statewide offices by county; legislature by district and place (the 1970 legislative returns, left out of the 1971 ed., are printed at the head of the 1975 ed.'s ch. XII, p. 207); constitutional amendment elections by county
      primaries: 'official, Democratic primary and second primary (runoff), by county: e.g. 1959 ed. May 6 and June 3, 1958; 1963 ed. May 3 and May 31, 1960, May 1 and May 29, 1962; 1971 ed. May 7, 1968 and May 5, 1970; 1975 ed. May 2 and May 30, 1972, May 7, 1974. Republican primaries not seen.'
      checked_in: OCR of the 1959, 1963, 1967, 1971, 1975 editions (election headings); 1971 ed. p. 396 (page image); 1975 ed. ch. XII, p. 207 ff.
    online:
    - {host: Internet Archive, url: 'https://archive.org/details/alabama-official-statistical-register-1971', years: '1903-1979, every edition (series ids alabama-official-statistical-register-YYYY)', access: open, checked: '2026-10-06', pattern: 'https://archive.org/details/alabama-official-statistical-register-YYYY (tested 1955, 1959, 1963, 1967, 1971, 1975; 1979 listed by search)'}
    - {host: Internet Archive (OCR text), url: 'https://archive.org/download/alabama-official-statistical-register-1975/OSR_1975_djvu.txt', years: same, access: open, checked: '2026-10-06', pattern: 'https://archive.org/download/alabama-official-statistical-register-YYYY/OSR_YYYY_djvu.txt (tested 1959, 1963, 1967, 1971, 1975)'}
    - {host: ADAH digital collections (CONTENTdm), url: 'https://digital.archives.alabama.gov/digital/collection/register/id/593', years: unknown, access: other, checked: '2026-10-06', note: 'access: other: the page returns 200 but is an empty JavaScript shell; the CONTENTdm API answers ''Error looking up collection /register'' and the IIIF manifest is 404; WebFetch is refused (egress)'}
    - {host: HathiTrust, url: 'https://catalog.hathitrust.org/Record/102871127', years: Register (catalog record), access: bot-check, checked: '2026-10-06'}
    notes: The 1968 presidential tables (1971 ed. pp. 393-410) are printed sideways; the OCR is mirrored nonsense, so use the page images (p. 396 = https://archive.org/download/alabama-official-statistical-register-1971/page/n399.jpg). AL voted for electors one at a time, so the Register gives a vote for each elector.
  labels_1968:
    democratic: none printed on p. 396 (columns headed by elector names under 'For Presidential Elector Place No. 1')
    wallace: same
    source: 1971 Register p. 396 (page image)
    verified: true
  best_for_specials: none with votes found; the Register records only the 1972 AL-3 result (unopposed). The Clerk does not print it either; newspapers or the Secretary of State's certificate (ADAH) for any figure.
  gaps: 'Republican and minor-party nominations (conventions) not in the Register as seen. Precinct returns: county probate offices and ADAH (Secretary of State election files).'
- st: AR
  name: Arkansas
  sources:
  - title: '"Historical Report of the Secretary of State" (editions 1958, 1968, 1978, 1986, 1998, 2008, 2018)'
    publisher: Arkansas Secretary of State
    kind: report
    frequency: about every ten years
    covers: each edition reprints the returns from statehood to its year; the 2008 and 2018 editions cover 1956-74 in full
    contents:
      general: President, U.S. Senate (by class), U.S. House by district, statewide totals only; 'Unopposed' where no contest
      specials: '1966-11-08 AR-4: yes, with votes, as a separate ''Special Election'' row (Pryor, Democrat, 85,125; Lowe, Republican, 46,764; total 131,889), below the full-term race (86,887 / 46,804). 1961-04-18 AR-6: no; the House table goes from 1960 to 1962. The Congress roster has only a footnote: Catherine D. Norrell ''Elected to fill vacancy caused by death of her husband, William F. Norrell; seated April 25, 1961.'''
      state_races: governor only (with Democratic primary, Democratic run-off, Republican primary and general, statewide totals); no other statewide offices and no legislative returns (rosters only)
      primaries: 'official totals, statewide only: Democratic primary and run-off, Republican primary, for governor and U.S. Senate (2018 ed. ch. 6); not for the House'
      checked_in: 2018 edition ch. 6 'Arkansas Elections' (contents p. 345; House pp. 367-400, the 1966 special on p. 389; gubernatorial p. 401 ff.); 2008 edition text searched
    online:
    - {host: Arkansas Secretary of State, url: 'https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf', years: 2018 edition (609 pp.), access: open, checked: '2026-10-06'}
    - {host: Arkansas Secretary of State, url: 'https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf', years: 2008 edition (751 pp.), access: open, checked: '2026-10-06'}
    - {host: Arkansas Secretary of State, url: 'https://www.sos.arkansas.gov/elections/research/historical-report-of-the-secretary-of-state', years: series page (links only the 2018 PDF), access: open, checked: '2026-10-06'}
    - {host: Internet Archive, url: 'https://archive.org/details/historicalreport0000unse', years: 2008 edition, access: borrow, checked: '2026-10-06'}
    - {host: Arkansas State Archives, url: 'https://digitalheritage.arkansas.gov/finding-aids/602', years: 'finding aid: Certified election returns of Arkansas precincts and counties, 1902-1978 (microfilm, e.g. 1962 Democratic preferential primary through 1964 presidential electors, per search summary)', access: other, checked: '2026-10-06', note: 'access: other: proxy ''CONNECT tunnel failed, response 502'' (upstream unreachable), twice'}
    notes: 'No biennial State canvass for 1956-74 found. The Internet Archive''s Arkansas compilations (''1980 Arkansas Elections: A Compilation of Primary, Run-Off, and General Election'', ''Official Certification of Votes, 1986 ...'') start after the period. The 1958, 1968 and 1978 Historical Reports were not found online.'
  labels_1968:
    democratic: not printed by slate in the Historical Report (statewide totals by candidate with party)
    wallace: unverified
    source: 2018 Historical Report, presidential table (not opened for 1968)
    verified: false
  best_for_specials: '1966 AR-4: the Historical Report (2008 or 2018), statewide totals. 1961 AR-6: none found in State publications; the county certified returns on microfilm at the Arkansas State Archives (finding aid 602).'
  gaps: 'County-level returns and House primaries for 1956-74: only the certified returns on microfilm (Arkansas State Archives). Legislature: no returns.'
