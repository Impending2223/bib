# Population of the cities of China, Taiwan, Hong Kong and Macau as the United Nations' *Demographic Yearbook* printed
# it in the 1960s, kept by hand (Nov. 26, 2026), for the map of China (tools/bib/cnmap.py: the Cities layer). In the
# form of sources/indochina/cities.yaml. Read by eye off the page images of the Yearbooks, from
# https://unstats.un.org/unsd/demographic-social/products/dyb/ ("1966 DYB.pdf", "1970 DYB.pdf"): the table of the
# population of capital cities and cities of 100,000 and more inhabitants (1966: table 6; 1970: table 8). Every figure
# was then checked against the files' text layer.
#
# What the Yearbooks print for China (mainland): 103 cities in 1966 (p. 185), each with one figure: for 40 of the
# larger the estimate of 31 December 1957, for Liaoyang a census of 1940, for the other 62 the census of 30 June 1953.
# The 1970 Yearbook (pp. 446-447) prints the 1953 figure for every city but Liaoyang, which it leaves out, and the 40
# estimates of 1957 again, in italics. Both say the figures of 1953 and 1957 were released by the State Statistical
# Bureau, Peking (1966: n. 97; 1970: n. 200). Neither prints a figure for the mainland later than 1957.
# The other Yearbooks of the 1960s were not read by eye (sources/china/README.md, "Cities", says what a search of
# their text found).
# For Taiwan (1966: p. 186; 1970: p. 447) they print estimates of 1965 and of 1969 and the census of 16 September
# 1956, excluding armed forces and foreigners (1966: n. 100; 1970: n. 203); for Hong Kong, Victoria at the census of
# 1961; for Macau, the censuses of 1950 and 1960.
#
# Each city: `place`, the gazetteer's key (sources/places.yaml), whose point is in sources/china/places.json. Every
# city here is a place of the gazetteer: 34 that no calendar entry named were made places of it on Nov. 26, 2026
# (the owner, Nov. 25: "Add the cities to the gazetteer"; tools/cnmap/places.py, CITY, names each one's Wikidata
# item), so no city carries a point of its own. `as`: the city as the Yearbook names it; that the one is the other
# is this file's reading. `rows`, the figures, each with `date` (the day of a census, C, or of an estimate, E),
# `pop`, `of` (city proper, or urban agglomeration), `src` (the Yearbook, its table and printed page) and `note`:
# the Yearbook's own marks, stated (an asterisk: provisional; italics, in the 1970 Yearbook: "of lesser reliability").
# The map shows the first row; the tap, all. A figure the two Yearbooks print alike is cited to the 1966 Yearbook.
#
# `unplaced`: figures printed for a city this file could not place, kept so that the reading is not lost. "Malibo"
# was not identified (the owner, Nov. 25, 2026: "I can't identify Malibo either").
#
# Check: Chuchow is taken as Zhuzhou in Hunan (株洲): the Yearbook names no province.
# Check: Taichow is taken as Taizhou in Jiangsu (泰州): the Yearbook names no province.
# Check: Chinchow is taken as Jinzhou in Liaoning (锦州): the Yearbook names no province.
# Port Arthur and Dairen (Lüta) is set at Dalian.
sources:
  dyb1966: United Nations, *Demographic Yearbook 1966*, table 6
  dyb1970: United Nations, *Demographic Yearbook 1970*, table 8
