- id: x.1989.john-doar-the-work-of-the-2
  what: 'John Doar, "The Work of the Civil Rights Division in Enforcing Voting Rights," speech at the U.S. Department of Justice, ca. 1989, courtesy of John Doar. In his remarks, Doar described the end of the contested vote count as follows: "The result in the six boxes: Baker, 1,412, Clark, 92, enough votes to determine the result of the election. However the Dallas County Democratic Executive Committee immediately rejected all the votes in the six boxes. This was done by a majority of the forty men on the self-perpetuating, lily-white Democratic Executive Committee. The [Civil Rights] Division was determined that the black citizens of Dallas County not be disillusioned with their first experience in actual participation in a local election. ... From that time until the federal court decided the contest twenty days later, federal observers guarded the boxes."'
  kind: speech
  date: '1989'
  made: contemporaneous
  form: original
  open: not held
  read: false
