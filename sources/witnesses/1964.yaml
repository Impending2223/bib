- id: x.1964-02-15.morrison-to-moyers-feb-15-1964
  what: 'Morrison to Moyers, Feb. 15, 1964, and July 24, 1965, WHCEF, Name File, LBJ. In the first letter, Morrison offered encouragement to the early Johnson administration, including a long-range appraisal of the Cold War: "Our governmental system is not nearly as easily transportable as the Russian one, but it has stood longer and is universally recognized as more idealistic, based as itis on the dignity of man as created in the image ofjustice and goodness for all. Our main disadvantage is that we are too far ahead to identify with the have-nots. The world is already fearful and jealous of our power. We are muscle-bound in foreign affairs with little in the way of practical and consistent alternatives to offer to revolutionary minded have-nots. Our prime exportable gift has so far been to assure protection with massive, essentially irrelevant, military strength. ... China is determined to identify herself with the revolutions of the world even if itmeans breaking her ties with Russia. The country that can best fit itselftoidentify with the revolutions of the future will have gained the world by 2000. This will certainly not be Russia." Morrison''s second letter to Moyers, just before LBJ announced the major troop commitment to Vietnam, pleaded: "Many of us had begun to feel that it wasn''t worth writing any more as things went from bad to worse. If the right decision is made it will have to be great and probably not helpful politically. ... We pray that you and your boss will have the courage to replace patriotism with a true God."'
  kind: letter
  date: '1964-02-15'
  where: LBJ Library
  agent:
    - Morrison
  made: contemporaneous
  form: original
  open: not held
  read: false
