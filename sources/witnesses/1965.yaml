  what: 'Congressional Record, Aug. 4, 1965, p. 19378. Forty-nine Democrats and thirty Republicans voted for the final bill. The supporting Democrats included three Southerners: Albert Gore of Tennessee, George Smathers of Florida, and Ralph Yarborough of Texas. The only Republican to vote nay was Strom Thurmond of South Carolina, who had switched parties ten months earlier to become the first of the Deep South''s new "Goldwater Republicans" in the Senate. The only other Southern Republican, John Tower of Texas, had voted against the voting rights bill on first passage, but was absent for the decisive vote on the conference report'
