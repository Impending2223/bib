- id: x.1965-03-25.rev-t-frank-mathews-to-my
  what: 'Rev. T. Frank Mathews to "My dear Fellow Churchmen," March 25, 1965, BIR/C8f24. Excerpts from the second letter: "It may be of some help to all of us to visualize the consequences had not this resolutionof-compliance-with-the-Canons been adopted. As a priest of the Episcopal Church, it is clear that I would have to resign as your rector. You would not be able to replace me with another Episcopal priest, since this congregation would have to dissolve its communion with the Protestant Episcopal Church in the U.S.A. As individuals and as a group you would no longer be Episcopalians and the Book of Common Prayer would no longer be yours. . . . |know all of you are ''Big'' people who love your church with a big love. As an Episcopal Church, we must abide by the Canons. . . . Unless the group is disorderly and creating a disturbance (in which case it is the canonical responsibility of the ushers to refuse them admittance), it is not for us to judge any man''s motives for attending church. Perhaps our motives are not always as pure as they should be'
  kind: letter
  date: '1965-03-25'
  agent:
    - Rev. T. Frank Mathews
  made: contemporaneous
  form: original
  open: not held
  read: false
