- id: x.1965-12-16.john-ruskin-sermon-a-new-understanding
  what: 'John Ruskin sermon, "A New Understanding of the White Problem," attached to Ruskin to Francis Walter, Dec. 16, 1965, BIR/FW2f5. Ruskin, a Unitarian minister from San Diego, had met Rey. Walter on a pilgrimage to Selma. He recalled in his sermon that Rev. Mathews ofSt. Paul''s was explaining to them his reservations about the civil rights movement, largely by recounting the troubles Daniels had caused at his worship services: "When the telephone rang and the rector answered it and was informed that Jonathan Daniels had just been shot and killed over at Hayneville, in Lowndes County. This shook us all up very badly and, after a few important telephone calls, we had a moment of memorial prayers for Jonathan Daniels. Then Father Walters asked his colleague in the ministry for permission to have a memorial service for Jonathan Daniels at St. Paul''s Episcopal Church. The rector refused and stuck to his refusal because, as he said, ''A memorial service for Jonathan Daniels would just turn into a demonstration.'' The real irony of this became apparent the following Monday when a newspaper carried the picture of a funeral service for the late Mr. Matt Murphy, the notorious Klan leader."'
  kind: speech
  date: '1965-12-16'
  where: Francis X. Walter papers, Birmingham Public Library
  made: contemporaneous
  form: original
  open: not held
  read: false
