- id: x.1965-08-24.statement-by-the-rev-t-frank
  what: '"Statement by the Rev. T. Frank Mathews, Rector of St. Paul''s Church, Selma, Alabama, in Reply to a request from The Living Church for a Comment Regarding the Death of Jonathan Daniels," Aug. 24, 1965. "It is my understanding that a Memorial Service is being planned for Brown''s Chapel," the statement concluded. "Any additional service in St. Paul''s would appear to the community of Selma to be another civil rights demonstration for which we do not feel this church building should be used or the liturgy of the Church employed. I do not feel that Rev. John Morris understands the situation here in Selma, or he would not have been critical of a decision that is calculated to avoid further discord and to support the efforts of thinking and concerned persons toward the restoring of a spirit of good will among both races in this community where Jonathan Daniels lived and worked the last five months of his life."'
  kind: statement
  date: '1965-08-24'
  made: contemporaneous
  form: original
  open: not held
  read: false
