# Kept by hand: the presidential documents (APP) where a bare name shared by two persons of the series is one of
# them (tools/lives/app_names.py). Name as the series writes it: {bare: [first year, last year], forms: [other exact
# forms, as 'Ambassador Roth'], why: the reason}. In those years the bare first name and surname, and each form,
# name him. Without an entry here, a name two persons share names neither, unless the text gives what tells them
# apart (a further given name or initial, a suffix).

'Dean, John W., III':
  bare: [1969, 1974]
  why: >-
    John G. Dean, Ambassador to Cambodia from 1974, is in no APP document of 1953-74 by any form of his name; every
    "John Dean" of 1969-74 is the Counsel to the President (the press conferences of March 1973 on, the Watergate
    statements and addresses of 1973-74). Read Oct. 8, 2026.

'Roth, William M.':
  bare: [1963, 1969]
  forms: [Ambassador Roth]
  why: >-
    Deputy Special Representative for Trade Negotiations from 1963, Special Representative 1967-69, with the rank of
    Ambassador. William V. Roth, Jr., in the House from 1967, is named in no APP document of 1963-69; the
    swearing-in statement of Mar. 24, 1967, the Kennedy Round signing of Dec. 16, 1967, and the report of Jan. 15,
    1969 name the Special Representative. Read Oct. 8, 2026.

# Sons known by their suffix (strict: true): each has a father of the same name, better known, whom the bare name
# means. Matched only by the suffix ('Franklin D. Roosevelt, Jr.'), an office title only he held ('Under Secretary
# Hoover'), or the years given. Read Oct. 8, 2026, from each one's documents.

'Roosevelt, Franklin D., Jr.':
  strict: true
  why: >-
    "Franklin D. Roosevelt" and "Franklin Roosevelt" in 1953-74 are the President (d. 1945): the New Deal, the
    memorial, the quotations. Of 561 documents the bare name gave the son, 20 print "Jr.".

'Hoover, Herbert, Jr.':
  strict: true
  why: >-
    "Herbert Hoover" is the President (d. 1964): the Hoover Commissions, birthdays, the funeral. Of 63 documents the
    bare name gave the son, 2 print "Jr.".

'Clay, Lucius D., Jr.':
  strict: true
  why: >-
    "Lucius D. Clay" and "General Clay" are the father: the Berlin airlift, the President's representative in Berlin,
    1961-62, the Clay Committee on foreign aid, 1963. Of 28 documents, 1 prints "Jr.".

'MacArthur, Douglas, II':
  strict: true
  why: >-
    "Douglas MacArthur" is the General (d. 1964), the Ambassador's uncle. Of 9 documents, 2 print "II".

'Taft, Robert, Jr.':
  strict: true
  bare: [1970, 1970]
  why: >-
    "Robert Taft" and "Senator Robert Taft" are the father (d. July 31, 1953), alive and remembered, except in the
    1970 Senate campaign: the President's statement and remarks of Oct. 19, 1970 name the son. Of 32 documents, none
    prints "Jr.".

'Stevenson, Adlai E., III':
  strict: true
  why: >-
    "Adlai Stevenson" after 1965 is the father remembered: the tributes, the bust of Feb. 5, 1968, "talked sense to
    the American people". The son by "III": the Chicago dinner of May 17, 1966 ("Adlai Stevenson III for State
    Treasurer").
