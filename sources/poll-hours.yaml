# The hours of the polls: the register (kept by hand). For each State and D.C., the hours the polls opened and closed
# at general elections, 1960-68, and at primaries where the law differs; the statute as then in force (its code section
# and the session law that set or changed it, with its effective date where read); the local options as the law states
# them. Begun Nov. 10, 2026, at the owner's request (Nov. 6, 2026: "Elections are late evening or night events in the
# constituency where they're held. (If poll closing times are fixed by law, we should set an agent or agents on the State
# law and the relevant session laws to find them, and to find the State and Federal adoption of daylight time.)").
# The clock each law names, and the State's daylight time, are in sources/daylight-time.yaml. How the election-night
# range uses them: notes/extensions/memos/poll-hours.md. Checks: tools/bib/pollhours.py ([poll-hours]).
#
# The ground for every State: a compilation of the period, read off its pages,
#   PPH  *Projections—Predictions of Election Results and Political Broadcasting (Sec. 315, Communications Act):
#        Hearings Before the Subcomm. on Communications of the S. Comm. on Commerce*, 90th Cong. (1967), July 18-20,
#        1967 (govinfo, CHRG-90shrg82635; the PDF's page is the printed page plus 4). Two compilations in it, both the
#        Library of Congress's Legislative Reference Service's (American Law Division):
#        Table A  "General elections: opening and closing of polls (local time)", a State a row, the code section, the
#                 hours, remarks; pp. 14-16, printed with the Service's memorandum of Dec. 2, 1966 (pp. 6-17). Check:
#                 the table's date and compiler (it follows the memorandum and precedes Table B, the Record's
#                 references of 1964-65).
#        Appendix "State laws", to Elizabeth Yadlosky, "Premature Release of Election Results and Election
#                 Predictions" (Apr. 6, 1967), pp. 17-75: each State's provisions quoted from its code and latest
#                 supplement and session laws (named in each State's heading), with the code's history notes; "The
#                 opening and closing times is given for all states" (p. 31). D.C. is not in it.
#        Where the two differ, both are given and the row carries a Check. Pastore's opening statement (p. 1) and
#        the report's text are quoted where they date a closing.
# Then, for the States the compilation leaves unclear or where the law changed in the span, the States' own codes,
# session laws and election-law compilations, where sources/state-law.yaml or a search found them open.
#
# Per State: st, name, rows, compiled_only, notes (optional), leads (optional).
#   rows       one per rule (a class of election and of place), each:
#     elections  a list: general | primary | special | municipal | all (every election the section governs)
#     applies    where: 'statewide', or the class of place as the law names it ("counties of 400,000 or more")
#     open       the opening hour, local, 24-hour 'HH:MM'; a range 'HH:MM-HH:MM' where the law lets an officer fix it
#                between; null where the law fixes none
#     close      the closing hour, the same way. Voters in line at the hour may vote in most States (the sections say
#                so); the hour is the law's, not the last ballot's.
#     clock      optional: the time the law names ("eastern standard", "standard", "standard or daylight as in
#                effect"); absent where it names none (then the local civil time: sources/daylight-time.yaml)
#     law        the code section as the source prints it, with the code's edition
#     history    optional: the session laws the code's history note gives, as printed (or read in the volume)
#     effective  optional: the date the governing act took effect, where read
#     span       the years of 1960-68 for which the row is the law read: 'YYYY..YYYY' (one year 'YYYY..YYYY' too)
#     span_basis why: the history note's last change, the act's date, the editions read
#     sources    a list, each {ref, page, url, ground}: ref the work (PPH, or the volume), page the printed page or
#                pages, url the copy at that page, ground as in sources/states.yaml (seen: read off the page here;
#                catalog; law; cited; assumed)
#     check      optional: what is not settled
#   compiled_only  true where PPH alone grounds the State's rows (no State volume read)
#   leads      what remains, each a lead (notes/leads.md, State and cities)
# Hours are as the law states them; nothing here is a reckoning. The years 1967-68 rest on PPH (mid-1967) and, where
# named, a later volume; a session of 1967 or 1968 not read is a lead.
