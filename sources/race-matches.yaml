# Races matched to a person by name, settled by hand (tools/bib/lives.py, election_sentences).
#
# The lives take a candidate in elections/<year>.yaml as the person where the names agree. A race is refused
# without this file only on certain grounds: after his death; another man of the name seated from it in the
# rosters; another man the Directory's winner; the Directory's full given names disagreeing with the returns'; a
# win while in executive office when the Congress met (Art. I, sec. 6). A race confirmed by nothing (the rosters
# seating him from it, his own Directory entry as its winner or naming his candidacy that year) shows "Check:
# matched by name only".
#
#   Person as the series writes him:
#     refuse:  {race: why}      not his: left out of his life
#     confirm: {race: why}      his: shown without the Check
#
# Race keys: the year, then the readings' key: chamber (h, s), State, district (0 at large) or Senate class,
# an at-large position after a hyphen, 'special' for a special held with a regular race ('1962 h AL 0',
# '1966 s SC 3 special'). `check` fails on a person or race that does not answer.
#
# Seeded Oct. 7, 2026 from the State and election-day office rules, which no longer refuse anything: each a
# namesake by its State or the office he held that day. Check: each awaits the owner's confirmation.

