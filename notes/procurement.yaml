  size: about 805 days; a day 2-15 pages
  public_domain: 'Kept by the White House staff in the course of their duties: a federal record and a work of the U.S. Government
    (17 U.S.C. § 105). The site''s robots.txt allows general readers (ai-train=no, use=reference); fetched by the owner,
    cited by the Library''s address.'
  settles: '1,156 calendar entries tagged name:johnson-lyndon-b on 838 days, 805 of them not among the Catalog''s 50 (daybook/diary.yaml);
    leads: Primary records, Cal. II (King, Dec. 18, 1964; Feb. 9, 1965); the Diary lead; the Johnson–Ramsey Clark tape (Jan.
    20 or 21, 1967); cal.1966-11-16.succession'
