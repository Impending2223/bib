# The procurement map: public-domain materials this environment cannot reach, for the owner to fetch in a browser
# and save to the Google Drive folder "1968 series: sources for Claude" under each record's save_as name. The guide
# is notes/procurement.md; this file holds the same items as records. Written Oct. 23, 2026, from notes/leads.md,
# sources/states.yaml (copies bot-checked, blocked or dead), notes/calendar-audit.md (./bib audit-cal: 691 dated
# entries with no primary record), the hathifile of Oct. 1, 2026 (rights and access profiles) and HathiTrust's Bib
# API, archive.org's and govinfo's searches. Items found open elsewhere are not here (procurement.md, "Found open").
# Already procured, so left off: OSD vol. V; Nixon, Six Crises; Dittmer, Local People; Schlesinger, Robert Kennedy and
# His Times; Frankum, Like Rolling Thunder; Miller, Misalliance; Victory in Vietnam.
#
# Fields: id; tier (1 fetch first: dense, settles many entries; 2; 3); family; title (the full citation); url (the
# page to open); steps (what to click); save_as (the file name in the Drive folder); size; public_domain (why);
# settles (lead headings in notes/leads.md, entry ids, counts); check (anything unverified).
# Counts of "entries carrying a Check" are entries in the election and State threads (governors, specials,
# legislatures, State constitutions and finance, mayors, the elections-19xx threads) tagged with the State and
# carrying any "Check": a place to look, not a promise that the volume settles each.
# HathiTrust: every volume here is full view (pd or pdus) by the hathifile and the Bib API; nearly all were digitized
# by Google (access profile "google"), and for those the whole-volume PDF may ask for a HathiTrust partner login
# (Check); page-at-a-time download needs none. Its pages are bot-checked from this environment only.
