- cite:
    id: cal.1960-03-30.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 12'
    'on': The covering note, 2 a.m., goes to Liu Shaoqi, Zhou Enlai, Zhu De, Peng Zhen, Yang Shangkun, Xi Zhongxun, Tan Zhenlin, Liu Lantao, Li Fuchun, Bo Yibo, Li Xiannian and Lu Dingyi for changes, the directive to go out by telegram by Apr. 5; the Center itself is to answer for the "five many, five few."
