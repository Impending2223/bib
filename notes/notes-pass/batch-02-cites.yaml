    id: cal.1960-07-04.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 44'
    'on': 'Deng presides; Peng Zhen attends. The two parties have grown further apart since the summit, above all at Bucharest; Khrushchev calls Lenin outdated; the Center will not "set its watch" by Moscow. At worst Soviet aid is squeezed and experts withdrawn early, with subversion, no advanced techniques, a front with imperialism. China is not afraid: 240 million militia, strategic systems in each region, industry spread, grain self-sufficient everywhere.'
- cite:
    id: cal.1961-01-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 92–93'
    'on': 'Deng presides, Zhou and Chen Yun attending: imports of grain for three years at least, ten billion jin; low rations, "melons and greens for grain."'
