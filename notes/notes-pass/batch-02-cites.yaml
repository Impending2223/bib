    'on': 'Zhou: grain short by about 10 billion jin in 1962; eight measures, the first to cut offices, urban population, staff and grain supply; "it is we who have made the mistakes," Mao not to take the responsibility.'
- cite:
    id: cal.1962-08-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 212'
    'on': 'Peng Zhen attends; Mao presides. Li Xiannian: purchases less, imports 5.4 million tons last year, 4.7 this; free-market prices halved, grain''s to a quarter. Mao: better let grain, cotton and oil into the free market; have Tan Zhenlin speak of the situation.'
- cite:
    id: cal.1963-07-10.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 283'
    'on': 'Peng Zhen attends. Suslov on Soviet help to Chinese defense: 24 defense enterprises built, 33 building, 60 divisions armed, the documentation for the MiG-17, MiG-19, MiG-21-F and Tu-16; 198 enterprises, 21,000 sets of documentation; Khrushchev''s words to Mao on a joint fleet, July 31, 1958.'
