note: 'Fact-check pass of Oct. 2, 2026. Entries still marked Check that the agents could not settle: the web-search budget ran out and the proxy blocked the source sites. A finding marked unverified is a lead from memory, not a fact. Rerun these with web access; remove an item here when its Check is settled.'
