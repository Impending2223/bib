# Leads for the next fact-check pass. Not data: the build ignores this file.
note: 'Fact-check passes of Oct. 2, 2026. The first pass was blocked (proxy and search budget); the rerun reached APP, govinfo, senate.gov, voteview, history.state.gov, archives.gov, federalregister.gov, history.house.gov, fjc.gov, archive.org and Wikipedia, but not congress.gov, jfklibrary.org, Justia, CourtListener, HathiTrust, LoC or WorldCat catalogs. Items below are the Checks still open after the rerun; a finding marked unverified is a lead from memory, not a fact. Remove an item when its Check is settled.'
items:
  - id: cal.1961-01-19.laos
    finding: 'Rerun Oct. 2, 2026. The Check asks only for the article''s pages, which the brief excludes. One search did not find the JAH table of contents. Owner to decide whether to drop the Check.'
    sources: []
  - id: cal.1961-03.right-and-the-military
    finding: 'Rerun Oct. 2, 2026. Two searches: Otis Chandler''s five-part Los Angeles Times series of 1961 confirmed in outline (reason.com; OAC finding aids), but no dates found and Gene Blake''s byline not confirmed. Time''s article not checked.'
    sources:
      - https://oac.cdlib.org/findaid/ark:/13030/c8v986s6
  - id: cal.1961-04-15.cuba
    finding: 'Rerun Oct. 2, 2026. One search and archive.org: no record of *Playa Girón: derrota del imperialismo* (4 vols., 1961–62). Still open.'
    sources: []
  - id: cal.1961-07-25.economy
    finding: 'Rerun Oct. 2, 2026. Sequence and date settled: at the NSC meeting of July 19, 1961 Kennedy judged it unwise to add $3.5 billion without new taxes, though immediate taxation might hurt the recovery (FRUS 1961-63 v14 d77); the July 25 address asks no new taxes and defers any increase to January (APP). Check narrowed to who argued against the tax: no source reached names Heller and Samuelson (two searches). Leads: Sorensen, Kennedy, 590-592 (cited in FRUS d81); Heller oral history, JFK Library (jfklibrary.org returns 403).'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v14/d77
      - https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis
  - id: cal.1961-08-31.rules
    finding: 'Rerun Oct. 2, 2026. Three searches. A contemporary report has Rayburn leaving for Bonham "a month before Congress adjourned" (adjournment Sept. 27, 1961), i.e., late August; no source states Aug. 31. Still open.'
    sources:
      - https://www.texashistory.unt.edu/ark:/67531/metapth847968/m1/1/
  - id: cal.1961-10-13.peace-corps
    finding: 'Rerun Oct. 2, 2026. The postcard was written the evening of Oct. 13, 1961 (Peace Corps Worldwide, RPCV site, several posts); when it was found and published is still open. Check narrowed to that date.'
    sources:
      - https://peacecorpsworldwide.org/postcard-part-1/
  - id: cal.1961-10-27.berlin-and-vienna
    finding: 'Rerun Oct. 2, 2026. One search did not find the Foreign Policy table of contents; JSTOR is not reachable. Still open.'
    sources: []
  - id: cal.1961-12-21.congo
    finding: 'Rerun Oct. 2, 2026. Kitona declaration Dec. 21, 1961, Tshombe accepting the central government (FRUS v20 d174, d176); Gullion arranged and steered the talks (FRUS v20 d166, d181). Open: "Repudiated within weeks." Tshombe reserved consultation with Katangan authorities (d174); the Katanga assembly acted on the declaration in mid-Feb. 1962, which a State Department telegram of Feb. 20 calls a good-will gesture (d207). Whether that counts as repudiation needs a secondary source. Check narrowed to the repudiation.'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v20/d174
      - https://history.state.gov/historicaldocuments/frus1961-63v20/d207
  - id: cal.1962-05.press-and-broadcasting
    finding: 'Rerun Oct. 2, 2026. Two searches: Sorensen (via CS Monitor) confirms the 1962 cancellation; no source gives the month.'
    sources:
      - https://csmonitor.com/2000/0424/p2s2.html
  - id: cal.1962-05-09.vietnam
    finding: 'Rerun Oct. 2, 2026. Words confirmed for McNamara''s first visit, 1962 (Federal Times obituary, 2009; several secondary sources). Date open: sources give a two-day visit in May 1962 but not the days; FRUS v2 search did not turn up a record of the visit. Check narrowed to the date.'
    sources:
      - https://fedline.federaltimes.com/2009/07/06/robert-mcnamara-former-defense-secretary-dead-at-93/
  - id: cal.1962-07.missile-crisis
    finding: 'Rerun Oct. 2, 2026. Raúl Castro in Moscow July 2-17, 1962, met by Malinovsky; first Soviet ships for Cuba sailed before he left (CIA, Evidence of a Soviet Military Commitment to Defend Cuba). Open: that a defense agreement was initialed during the visit. Check narrowed to the initialing.'
    sources:
      - https://www.cia.gov/readingroom/node/20801
  - id: cal.1962-12-26.vietnam
    finding: 'Rerun Oct. 2, 2026. Mansfield''s report to Kennedy dated Dec. 18, 1962 (FRUS 1961-63 v2 d330). The Palm Beach meeting date not found in FRUS v2 ch. 10 or one search.'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v02/d330
  - id: kja.mikoyan-anatomiya-karibskogo-krizisa
    finding: 'Rerun Oct. 2, 2026. Russian year still open: one search (Russian title + Academia 2006) found the book described (about 1,500 pp.) but no catalog record with the year; archive.org has no record. LoC and WorldCat refuse scripted queries.'
    sources:
      - https://nsarchive.gwu.edu/russian-pages/mikoyan-archives
  - id: kja.economy-prospects-and-policies
    finding: 'Rerun Oct. 2, 2026. Title and date still open: one search found only press of Jan. 6, 1961 on the task-force reports, no record of the report''s exact title; archive.org has none; jfklibrary.org returns 403.'
    sources:
      - https://stanleymeisler.com/article/task-forces-asked-by-kennedy
  - id: kja.who.wilson-henry-hall
    finding: 'Rerun Oct. 2, 2026. NCpedia and the LBJ Library biography (via search) give Wilson as administrative assistant for legislative liaison, 1961–67, resigning in 1967 for the Chicago Board of Trade. O''Brien kept the liaison lead as Postmaster General from Nov. 1965. Check narrowed to whether "after O''Brien" is the right description.'
    sources:
      - https://www.ncpedia.org/biography/wilson-henry-hall-jr
      - https://discoverlbj.org/item/bio-wilsonh
  - id: kjc.rights-1961-report
    finding: 'Rerun Oct. 2, 2026. Five books; the report was transmitted Sept. 9, 1961 (usccr.gov 1961 files, via search). Release dates of the individual books still open; usccr.gov is not reachable from this environment.'
    sources:
      - https://usccr.gov/files/historical/1961/61-004-U.pdf
      - https://www.crmvet.org/docs/ccr_61_voting.pdf
  - id: opp.rhodes-john-j
    finding: 'Rerun Oct. 2, 2026. Encyclopedia.com (Contemporary Authors) gives the title as *John Rhodes: I Was There* (1995). One source only, so the entry is unchanged; ASU Library finding aids (aspace.lib.asu.edu) are the likely second source but not reachable here.'
    sources:
      - https://encyclopedia.com/arts/educational-magazines/rhodes-john-jacob-ii-1916-2003
  - id: opp.republican-coordinating-committee-reports-and
    finding: 'Rerun Oct. 2, 2026. RCC issued 47 position papers and 24 statements, Apr. 1965–1968. The Ray C. Bliss Papers are in Archival Services, University of Akron (Polsky Building); no source found says the RCC set is among them.'
    sources:
      - https://blogs.uakron.edu/liblog/?p=5943
      - https://en.wikipedia.org/wiki/Ray_C._Bliss
  - id: adm.loi-le-duc-tho
