  - id: cal.1961-07-25.economy
    finding: 'Rerun Oct. 2, 2026. Sequence and date settled: at the NSC meeting of July 19, 1961 Kennedy judged it unwise to add $3.5 billion without new taxes, though immediate taxation might hurt the recovery (FRUS 1961-63 v14 d77); the July 25 address asks no new taxes and defers any increase to January (APP). Check narrowed to who argued against the tax: no source reached names Heller and Samuelson (two searches). Leads: Sorensen, Kennedy, 590-592 (cited in FRUS d81); Heller oral history, JFK Library (jfklibrary.org returns 403).'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v14/d77
      - https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-berlin-crisis
  - id: cal.1961-08-31.rules
    finding: 'Date Rayburn left Washington not found in the one search run (results gave only his death, Nov. 16, 1961). Lead: Hardeman & Bacon, *Rayburn*; Handbook of Texas. Not settled: the session''s WebSearch budget ran out and WebFetch is blocked for every source domain tried (history.state.gov, presidency.ucsb.edu, govinfo.gov, uscode.house.gov, wikipedia).'
    sources: []
  - id: cal.1961-10-13.peace-corps
    finding: 'Rerun Oct. 2, 2026. The postcard was written the evening of Oct. 13, 1961 (Peace Corps Worldwide, RPCV site, several posts); when it was found and published is still open. Check narrowed to that date.'
    sources:
      - https://peacecorpsworldwide.org/postcard-part-1/
  - id: cal.1961-10-27.berlin-and-vienna
    finding: 'Garthoff, ''Berlin 1961: The Record Corrected,'' Foreign Policy no. 84 (Fall 1991), starting p. 142, not verified. Not settled: the session''s WebSearch budget ran out and WebFetch is blocked for every source domain tried (history.state.gov, presidency.ucsb.edu, govinfo.gov, uscode.house.gov, wikipedia).'
    sources: []
  - id: cal.1961-12-21.congo
    finding: 'Rerun Oct. 2, 2026. Kitona declaration Dec. 21, 1961, Tshombe accepting the central government (FRUS v20 d174, d176); Gullion arranged and steered the talks (FRUS v20 d166, d181). Open: "Repudiated within weeks." Tshombe reserved consultation with Katangan authorities (d174); the Katanga assembly acted on the declaration in mid-Feb. 1962, which a State Department telegram of Feb. 20 calls a good-will gesture (d207). Whether that counts as repudiation needs a secondary source. Check narrowed to the repudiation.'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v20/d174
      - https://history.state.gov/historicaldocuments/frus1961-63v20/d207
  - id: cal.1962-05.press-and-broadcasting
    finding: 'Sources found (CSMonitor citing Sorensen) confirm the 1962 cancellation but give no month. Not verified: the session''s web search budget ran out (200/200) and WebFetch is blocked for every source domain tried (senate.gov, presidency.ucsb.edu, govinfo, history.state.gov, jfklibrary.org, wikipedia, voteview, nsarchive, cia.gov). Lead, unverified: recollection is late May 1962.'
    sources: []
  - id: cal.1962-05-09.vietnam
    finding: 'Rerun Oct. 2, 2026. Words confirmed for McNamara''s first visit, 1962 (Federal Times obituary, 2009; several secondary sources). Date open: sources give a two-day visit in May 1962 but not the days; FRUS v2 search did not turn up a record of the visit. Check narrowed to the date.'
    sources:
      - https://fedline.federaltimes.com/2009/07/06/robert-mcnamara-former-defense-secretary-dead-at-93/
  - id: cal.1962-07.missile-crisis
    finding: 'Rerun Oct. 2, 2026. Raúl Castro in Moscow July 2-17, 1962, met by Malinovsky; first Soviet ships for Cuba sailed before he left (CIA, Evidence of a Soviet Military Commitment to Defend Cuba). Open: that a defense agreement was initialed during the visit. Check narrowed to the initialing.'
    sources:
      - https://www.cia.gov/readingroom/node/20801
  - id: cal.1962-12-26.vietnam
    finding: 'Not verified: session web-search budget ran out and page fetches were blocked. Mansfield''s Palm Beach meeting with Kennedy is usually dated Dec. 26, 1962, but no source retrieved.'
    sources: []
