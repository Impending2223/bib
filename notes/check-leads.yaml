  - id: cal.1961-12-21.congo
    finding: 'Kitona declaration Dec. 21, 1961 (2:30 a.m.), Tshombe''s letter to Bunche, Gullion arranging, confirmed (FRUS vol. XX, ed. note 174). Not settled: ''Repudiated within weeks.'' Tshombe signed with a reservation that he must consult Katangan authorities; Katanga assembly convened Jan. 3, 1962 and on Feb. 15 accepted Kitona only as a basis for discussion. Could not confirm an outright repudiation or its date; web search budget exhausted and fetch blocked.'
    sources:
      - https://history.state.gov/historicaldocuments/frus1961-63v20/d174
      - https://digitallibrary.un.org/record/625174/files/S_5053_Add.8-EN.pdf
  - id: cal.1961-12-21.europe-and-the-alliance
    finding: 'Bermuda meeting Dec. 21-22, 1961, joint communique Dec. 22, on Berlin and atmospheric-test preparations: confirmed. The ''Check'' follows the Neustadt and Costigliola citations; not verified (Costigliola, Diplomatic History vol. 8, no. 3, 1984, starting p. 227 is believed right but unconfirmed); Common Market as a topic also unconfirmed. Web search budget exhausted, fetch blocked.'
    sources:
      - https://presidency.ucsb.edu/node/235955
      - https://realtime1960s.com/post/kennedy-and-macmillan-conclude-bermuda-meeting
