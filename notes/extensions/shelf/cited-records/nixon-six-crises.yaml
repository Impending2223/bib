# The records w.nixon-six-crises cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Logged Oct. 29, 2026, by the batch-3 reading of Richard M. Nixon, Six Crises, the owner's copy (Doubleday's reissue with
# the introduction of 1969, LC 78-87100; the Internet Archive's scan, its text layer; printed pages by the running heads).
# The memoir has no notes; its footnotes are the author's asides. A record is one the text quotes or names for a passage
# that grounds a calendar entry, keyed by the printed page it stands on and `note: text` (the record quoted in the text;
# text-a, text-b where a page quotes two), or `star-a` ... for the records the unnumbered footnote on p. 354 names. The
# claims each grounds are the `via` rows of the entries' maps. notes/book-checks/nixon-six-crises.md.
