# The records w.nguyen-hanois-war (Lien-Hang T. Nguyen, Hanoi's War, 2012) cites for the calendar's claims
# (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026). Logged Oct. 29, 2026 (stage 5 backfill,
# chen-asselin-nguyen) from the owner's copy, the notes at pp. 313-390 read off the page by chapter and number: `page` is
# the text page the note's number stands on, `note` its number; several records under one number lettered a, b in the
# note's order. Records as Nguyen cites them (her Vietnamese titles without diacritics). Published studies, memoirs and
# the official histories (Luu Van Loi, Pribbenow, Lich su bien nien, the military histories) are works, not records,
# and are not listed. Nguyen's abbreviations: VKDTT, Van Kien Dang Toan Tap, 54 vols. (Hanoi, 1998- ); DTNG, the
# Foreign Ministry's Dai su ky chuyen de: Dau Tranh Ngoai Giao ..., 5 vols., for internal circulation (Hanoi, 1987);
# PLT-BNG, the Foreign Ministry's archives, Hanoi; DPC, the Douglas Pike Collection, VA-TTU, the Virtual Archive, Texas
# Tech University; 77 Conversations, the Cold War International History Project's working paper (1998).
