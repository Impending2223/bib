# The records w.white-making-of-the-president cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule,
# Oct. 28, 2026). Logged Oct. 29, 2026, by the batch-3 reading of Theodore H. White, The Making of the President 1960,
# the owner's copy (Atheneum, 1961, the first edition, LC 61-9259; its text layer; printed pages by the running heads,
# the PDF's page less 16). The book's footnotes are numbered by chapter and are mostly asides; a record is one a note
# names, or one the text quotes as a document, for a passage that grounds a calendar entry, keyed by the printed page
# and the note's number, or `note: text` for a document quoted in the text. The claims each grounds are the `via` rows
# of the entries' maps. The last two rows ground entries in other pending patches (notes/book-checks/
# white-making-of-the-president.md, "For entries in pending patches"); their `via` rows are for the merger.
