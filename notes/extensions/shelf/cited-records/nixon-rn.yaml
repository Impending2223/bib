# The records w.nixon-rn cites for the calendar's claims (tools/bib/cited_records.py; the owner's rule, Oct. 28, 2026).
# Logged Oct. 29, 2026, by the reading of Richard M. Nixon, RN: The Memoirs of Richard Nixon (1978), the owner's copy (the
# Internet Archive's scan, its text layer; printed pages read off the running heads). The memoir has no notes: a record is
# one the text quotes or names for a passage that grounds a calendar entry, keyed by the printed page it stands on and
# `note: text` (the record named in the text, not a note). Nixon's own diary entries, letters received that ground no
# entry, and the published works he quotes (White, Bradlee, Humphrey, Efron) are not listed. The claims each record grounds
# are the `via` rows of the entries' maps. notes/book-checks/nixon-rn.md.
- record: Nixon's statement on the Manila communiqué, Nov. 3, 1966, printed in full by the New York Times
  kind: statement
  date: '1966-11-03'
  where: New York Times (the day not given)
  cited_by: {page: '274', note: text}
  found: null
  read: false
