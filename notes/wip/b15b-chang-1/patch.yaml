      when: Aug. 15
      date: '1960-08-15'
      thread: elections-1960
      also:
      - china
      c: 'Bowles to Archibald Cox, a rough draft for a Kennedy campaign speech: the Republicans have badly underestimated the "inherently imperialistic and expansionist" nature of any Chinese regime; China likened to Nazi Germany and Japan, seeking "living space," fuel and food; Mao in many ways the new Hitler. A Democratic administration would see the possible differences between the Soviet Union and China, without "wishful thinking."'
      n: '[[w.chang-friends-and-enemies]], 218–19. Made public: 1990 ([[w.chang-friends-and-enemies]], 219). To check: Bowles to Archibald Cox, Aug. 15, 1960, Bowles Papers, box 205, folder 0056 (cited by [[w.chang-friends-and-enemies]], 219 n.31). Names: Bowles, Cox, Kennedy, Mao.'
      src:
        c: 09dfe0a1
        rows:
        - 'w.chang-friends-and-enemies 218–19: all'
        - 'via x.1960-08-15.bowles-to-cox-draft-campaign-speech: all'
      tags:
      - polity:us
      - vis:only:us
      - name:bowles-chester
      - name:cox-archibald
      - name:kennedy-john-f
      - name:mao-zedong
