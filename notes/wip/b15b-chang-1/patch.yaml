        rows:
        - 'w.chang-friends-and-enemies 218–19: all'
        - 'via x.1960-08-15.bowles-to-cox-draft-campaign-speech: all'
      tags:
      - polity:us
      - vis:only:us
      - name:bowles-chester
      - name:cox-archibald
      - name:kennedy-john-f
      - name:mao-zedong
