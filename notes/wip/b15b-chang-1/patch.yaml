      c: 'Baguio, the chiefs of mission conference, the afternoon, by Thomson''s notes. The ambassador to Taiwan: since China''s test of October 1964 Chiang wants the "wherewithal to take out [Peking''s] nukes"; the "Gimo and Madame eat-sleep-love-dream ''counterattack.''" Reischauer: the Soviet Union, not China, the bigger enemy.'
      n: '[[w.chang-friends-and-enemies]], 227 (Chiang''s wish and the ambassador''s words); [[w.chang-friends-and-enemies]], 263 (Reischauer''s view). Made public: 1990 ([[w.chang-friends-and-enemies]], 227). To check: handwritten notes of Mar. 9, 1965, P.M., Thomson Papers, box 19, Baguio 2, 3/65 (cited by [[w.chang-friends-and-enemies]], 227 n.59a), (cited by [[w.chang-friends-and-enemies]], 263 n.21b); [[w.schoenbaum-waging-war-and-peace]], 454 (by 1967 Chiang against the bomb''s use on his countrymen) (cited by [[w.chang-friends-and-enemies]], 227 n.59b). Names: Chiang Kai-shek, Reischauer. Check: the ambassador''s name; Chang gives only his post. The words: "P.M." (227 n.59).'
