      thread: china
      c: 'The Operations Coordinating Board''s "Report on U.S. Policy Toward Taiwan and the Government of the Republic of China" (NSC 5723), as Chang gives it: Taiwan''s standard of living among the highest in Asia, the people''s morale good, its forces a credible deterrent to the mainland; the Nationalists hold China''s seat in the United Nations; some 13 percent of the gross national product to the military, the forces close to 700,000 of a population of 11,000,000.'
      n: '[[w.chang-friends-and-enemies]], 224. Made public: 1990 ([[w.chang-friends-and-enemies]], 224). To check: Operations Coordinating Board, "Report on U.S. Policy Toward Taiwan and the Government of the Republic of China," May 18, 1960, Eisenhower Library, WHO OSANSA, NSC, Policy Papers, box 22 (cited by [[w.chang-friends-and-enemies]], 224 nn.45–46). Check: whether each figure is the report''s; Chang''s paragraph speaks of Taiwan "by the time Kennedy took office."'
