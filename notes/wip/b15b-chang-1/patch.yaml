      c: 'The State Department. Rusk''s policy planning meeting on "The Sino-Soviet Conflict and U.S. Policy." Rostow: the split historic and unprecedented, but "no one knows what to do about it." Bohlen: "the Russians have become the Mensheviks, while the Chinese are Bolsheviks." Rusk: more study, in and out of government, and of the Chinese regime''s stability.'
      n: '[FRUS 1961–63, XXII, doc. 82](https://history.state.gov/historicaldocuments/frus1961-63v22/d82) (Thomson to Harriman, Jan. 12, 1962, from his notes of the meeting). [[w.chang-friends-and-enemies]], 222–23 ("that morning," by Thomson''s recollection in Hilsman, 344). See [[cal.1961-12-19.china-2]]. Made public: 1967 ([[w.hilsman-to-move-a-nation]], 344, Thomson''s recollection); the notes, 1990 ([[w.chang-friends-and-enemies]], 223). To check: [[w.hilsman-to-move-a-nation]], 344 (cited by [[w.chang-friends-and-enemies]], 222 n.40). Names: Rusk, Rostow, Bohlen, Thomson. The words: "that morning" ([[w.chang-friends-and-enemies]], 222).'
