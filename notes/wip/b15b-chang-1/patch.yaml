      when: Apr.
      date: 1960-04
      thread: china
      c: 'Bowles, in *Foreign Affairs*, "The ''China Problem'' Reconsidered": the Sino-Soviet relationship not "rigid, monolithic, unchangeable"; a two-China policy, to protect the Nationalists on Taiwan and leave room for dealings with the mainland, some trade among them.'
