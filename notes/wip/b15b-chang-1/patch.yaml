      c: 'Hilsman, director of State''s Bureau of Intelligence and Research, the first official public report on the Sino-Soviet split: a Chinese nuclear explosion, however "dramatic," "will not change the balance of power in Asia, much less throughout the world."'
      n: '[[w.chang-friends-and-enemies]], 223 n.43 (the first official public report on the split); [[w.chang-friends-and-enemies]], 251 (Hilsman in public in 1962, on a Chinese explosion, and on the Chinese as rather cautious in the Taiwan Strait). To check: [[w.department-of-state-bulletin]], [Nov. 26, 1962, 807–11](https://archive.org/details/departmentofstat4762unit/page/807/mode/1up) (cited by [[w.chang-friends-and-enemies]], 223 n.43), (cited by [[w.chang-friends-and-enemies]], 251 n.47b). Names: Hilsman. Check: the day of the remark of 251; Chang gives "in 1962" and cites the same Bulletin.'
