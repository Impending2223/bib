      c: 'Washington, Harriman''s house, a drink at 6. Harriman to Dobrynin: the United States will not support a Nationalist attack on the mainland, holding that force not be used by either side to change the situation; Cabot will tell Wang the same at Warsaw the next day; should the Chinese buildup be more ominous, Khrushchev should understand the treaty with the Nationalists.'
