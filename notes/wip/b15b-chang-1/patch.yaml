      when: June 27
      date: '1962-06-27'
      thread: china
      c: 'News conference. Kennedy''s opening statement on the Taiwan area: an attack on the offshore islands to be met by the policy of the Formosa Resolution; the United States will defend Formosa and the Pescadores, as under Eisenhower in 1958; his own position of Oct. 16, 1960, quoted.'
      n: 'The President''s News Conference, [1962 Pub. Papers 509](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=569) (June 27, 1962). [[w.chang-friends-and-enemies]], 226 (Kennedy''s public statement of the administration''s stand; the day not given). See [[cal.1962-06-27.court]]. Names: Kennedy, Eisenhower.'
