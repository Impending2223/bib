      id: cal.1963-09-05.china
      when: Sept. 5
      date: '1963-09-05'
      thread: china
      c: 'Chiang Kai-shek to Kennedy, his last letter: Khrushchev and Mao in a mortal fight for the bloc, unable to "tolerate each other''s existence"; Khrushchev would not come to Mao''s side against a Nationalist counterattack. Chiang would airdrop trained guerrillas 100 to 300 at a time and launch commando raids of 300 to 500, more than ten sorties each, to touch off an "anti-tyranny revolutionary movement," American forces not needed.'
      n: '[[w.chang-friends-and-enemies]], 226–27. Made public: 1990 ([[w.chang-friends-and-enemies]], 226). To check: Chiang to Kennedy, Sept. 5, 1963, with an attachment, Kennedy Papers, POF, box 113a, China-General 1963 (cited by [[w.chang-friends-and-enemies]], 227 n.56). Names: Chiang Kai-shek, Kennedy, Khrushchev, Mao.'
      src:
        c: b56fe3b1
        rows:
        - 'w.chang-friends-and-enemies 226–27: all'
        - 'via x.1963-09-05.chiang-to-kennedy: all'
