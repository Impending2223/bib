      when: Sept. 18
      date: '1962-09-18'
      thread: china
      also:
      - soviet-union
      c: 'The State Department''s paper "1962 Public Attitudes Toward U.S. Policy on China," as Chang draws on it: Brzezinski for continuing to ostracize Peking, to put further strain on Moscow; Nixon: the United States "could no more encourage a split between Red China and Russia than fly without wings."'
