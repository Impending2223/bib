- add:
    entry:
      id: cal.1960-08-04.china-leadership-7
      when: Aug. 4
      date: '1960-08-04'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, the Foreign Ministry. Chervonenko, on his own initiative, protests to Chen Yi that Chinese organizations are reading the Soviet experts the two governments'' confidential notes on their recall. Chen: the recall of some 1,400 to 1,500 specialists in sixteen towns and 500 to 600 organizations, made without consultation, against the treaty and the agreements, "will shake the whole China"; all will be gone by Sept. 1. He speaks, he says, for himself, not for the party or the government. China''s ambassador at Moscow sees only a deputy head of department. Peng Zhen''s talks with Kozlov at Moscow and with Khrushchev at Bucharest brought no unity; the Chinese signed the Bucharest communique with reservations. Moscow has taken two actions, the journal closed and the experts recalled; China will take none. "We are not Yugoslavia." The Chinese people''s hatred of American imperialism will last twenty or thirty years.'
      n: '[[w.brothers-in-arms]], 361–364 (the Soviet record, excerpted); [[w.westad-introduction]], 25–26 ("a big event, which will shake the whole of China"; "We are not Yugoslavia"; 26 n.88, the record); [[w.westad-sino-soviet-alliance-and]], 178 (the hatred of American imperialism; 178 n.38, the record); [[w.zhang-sino-soviet-economic-cooperation]], 214 (Chen: having hurt China economically, Moscow must stop "hurting the friendship"; the two may debate theory but economic relations should not worsen). Made public: 1998. To check: [[w.bianjibu-dangdai-zhongguo-waijiao]], 117–18 (cited by [[w.zhang-sino-soviet-economic-cooperation]], 214 n.94). Names: Chervonenko, Chen Yi, Peng Zhen, Kozlov, Khrushchev.'
      src:
        c: 95f2aa73
        rows:
        - 'w.brothers-in-arms 361–364: all'
        - 'via x.1960-08-04.chervonenko-chen-yi-record-avprf: all'
        - 'w.westad-introduction 25–26: ?'
        - 'w.westad-sino-soviet-alliance-and 178: ?'
        - 'w.zhang-sino-soviet-economic-cooperation 214: ?'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc+ussr
      - name:chervonenko-stepan-v
      - name:chen-yi
      - name:peng-zhen
      - name:kozlov-frol-r
      - name:khrushchev-nikita-s
      place: peking
