- add:
    entry:
      id: cal.1960-07.soviet-union-leadership
      when: July
      date: 1960-07
      thread: soviet-union-leadership
      also:
      - china
      c: 'The CPSU Central Committee''s plenum. Kozlov''s report "on the results" of the Bucharest meeting "and on the erroneous positions" of the Chinese leadership: the Chinese must be brought along if socialism is to expand abroad, in Europe and Asia above all, and to escape an American nuclear attack during the "final shift in the global correlation of forces"; the Chinese turn from their international obligations and from Marxism–Leninism. It sums up Khrushchev''s reasons for withdrawing the experts from China.'
      n: '[[w.westad-sino-soviet-alliance-and]], 178–179 (Kozlov''s speech "to the CPSU Central Committee in July"); [[w.westad-introduction]], 26 n.89 (the report to the July plenum, its title, the draft of July 13, 1960; the reasons for the recall). Made public: 1998. To check: Kozlov, report to the plenum (draft), July 13, 1960, TsKhSD, CPSU Central Committee Plenum Collection, Twenty-first Party Congress, esp. pp. 62–74 (cited by [[w.westad-introduction]], 26 n.89; [[w.westad-sino-soviet-alliance-and]], 179 n.39). Names: Kozlov, Khrushchev. Check: the day; [[cal.1960-07.china]] has Wu Lengxi''s plenum of July 13–16.'
      src:
        c: 285ad9ce
        rows:
        - 'w.westad-sino-soviet-alliance-and 178–179: B, C'
        - 'w.westad-introduction 26 n.89: A, B, D'
        - 'via x.1960-07-13.kozlov-report-plenum-draft: all'
      tags:
      - polity:ussr
      - vis:only:ussr
      - name:kozlov-frol-r
      - name:khrushchev-nikita-s
      place: moscow
