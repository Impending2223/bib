      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 26, 1960. Made public: 1996 ([[w.cold-war-international-history]], nos. 6–7 (Winter 1995/1996), 167–69, the Soviet record in English translation, cited by [[w.westad-sino-soviet-alliance-and]], 179 n.40). Names: Mao Zedong, Chervonenko, Yang Shangkun.'
- edit:
    id: cal.1962-03-01.china-leadership-3
    base: aa6ea90c
    set:
      n: '[[w.yang-shangkun-riji]], II, 129 (Mar. 1, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1694 (Mar. 1, 1962; afternoon; Deng receives Chervonenko and the CPSU''s letter of Feb. 22, uneasy at the two parties'' relations. Deng: the unity of the two countries and parties of great weight now; the Chinese party cares no less than any; relations abnormal for years, as the letter admits; to be solved on a common base, Marxism–Leninism, the Moscow Declaration and Statement); [[w.mao-zedong-zhuan]], V, ch. 70 nn.1, 2 (Mar. 1: Chervonenko hands Deng Xiaoping the CPSU letter of Feb. 22: the differences to be narrowed, unity kept; talks hinted at, nothing proposed; the book also cites Yang Shangkun''s diary, II, 129). The words: 下午4时到6时 (II, 129). Made public: 1998 ([[w.brothers-in-arms]], 374–375, the Soviet record, excerpted). To check: Record of Deng Xiaoping''s 邓小平 talk with Chervonenko 契尔沃年科, Mar. 1, 1962, receiving the CPSU Central Committee''s letter of Feb. 22 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.1). See [[cal.1962-02-22.soviet-union]]. Names: Deng Xiaoping, Yang Shangkun, Chervonenko.'
- edit:
    id: cal.1962-04-09.china-leadership-3
    base: c2536195
    set:
      n: '[[w.yang-shangkun-riji]], II, 142 (Apr. 9, 1962; notes 1–2: Gromyko, Rusk); [[w.deng-xiaoping-nianpu-1904]], III, 1699–1700 (Apr. 9, 1962; morning; Deng gives Chervonenko the reply of Apr. 7: unity needs problems solved, solved by meeting; a meeting held well or not at all. Chervonenko on the CPSU''s plenum and Soviet farming; the record of Gromyko''s talks with Rusk at Geneva (footnote 1: Gromyko, then Soviet Foreign Minister; Rusk, Secretary of State)); [[w.mao-zedong-zhuan]], V, ch. 70 n.3 (Apr. 9, morning: Deng Xiaoping gives Chervonenko the Center''s reply: its core, that unity needs the problems settled and the way to settle them is a meeting; it proposes a new conference of the world''s Communist and workers'' parties; the day and the hour as the book gives them). The words: 上午10时 (II, 142). Made public: 1998 ([[w.brothers-in-arms]], 375, the Soviet record, excerpted). To check: Record of Deng Xiaoping''s 邓小平 talk with Chervonenko 契尔沃年科, Apr. 9, 1962, handing over the Central Committee''s reply (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.3). Names: Deng Xiaoping, Yang Shangkun, Chervonenko, Gromyko, Rusk. Check: [[cal.1962-04-07.soviet-union]] has the reply handed to the Soviet ambassador at Peking on Apr. 7.'
- edit:
    id: cal.1963-07-05.china
    base: 9592bad6
    set:
      n: '[[w.fursenko-khrushchevs-cold-war]], 527–28; [[w.zedong-mao-zedong-nianpu]], V, July 5, 1963 (the delegation under Deng Xiaoping and Peng Zhen leaves Peking; the talks run to July 20); [[w.lengxi-shinian-lunzhan-1956-1966]], 602–603 (Wu: the talks "from July 6 to July 20," nine meetings (the day: variant), at the CPSU Central Committee''s conference hall on the Lenin Hills; for the Soviets Suslov, Grishin, Ponomarev, Andropov, Ilyichev, Satyukov and Ambassador Chervonenko; the first meeting, July 6: Suslov speaks first, over two hours, against the Chinese letter of June 14 and for the CPSU''s of Mar. 30, the general line peaceful coexistence, competition and transition, the CPSU a party of the whole people; adjourned); [[w.macfarquhar-origins-of-the-cultural]], III, 352 (the first meeting on July 6, where Suslov read a seventy-page paper; each side restates its position and attacks the other''s). To check: [[w.xiuquan-huiyi-yu-huainian]], 371 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 352 n.23); [[w.jin-1949-1989-niande-zhongguo]], 588–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 352 n.24); [[w.arbatov-system]], 94 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 352 n.25). See [[cal.1963-03-12.china]]. Names: Suslov, Deng.'
