      c: 'Geneva 日内瓦. Chen Yi 陈毅 receives the Canadian Broadcasting Corporation''s European representative and its reporters, and gives them a television interview: no word of mutual recognition with Green; the United States occupies Taiwan by force, the core of the dispute; China a member of the United Nations and a permanent member of the Security Council by right; China backs a second Asian–African conference; no famine in China, though three years of natural calamities unknown for a century; the West''s talk of Sino-Soviet differences shows its annoyance at their unity.'
