      c: 'Chen Yi 陈毅, one night at a *qin* gathering 琴会, hears the ancient *Guangling san* 《广陵散》 and Mao''s new *ci* sung to *qin* and *pipa*; writes "The *qin* gathering" 《琴会》, four stanzas of six-character lines, with a note: develop ancient music and instruments, against both national nihilism and national conservatism, on the course of "a hundred flowers" and "weeding through the old to bring forth the new."'
