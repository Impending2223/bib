      c: 'Geneva 日内瓦, the conference on Laos. Chen Yi 陈毅: the American and French draft protocol a plan of interference, not to be considered; a state choosing peace and neutrality needs no international supervision; the chief question the end of SEATO; the agreement to rest on the 1954 final declaration, not the cease-fire agreement; all foreign troops and military personnel to leave; the Chiang remnants to be dealt with; "if the United States insists on making Laos SEATO''s protectorate, what is the sense of our sitting here?"'
      n: '[[w.chen-yi-nianpu]], 877–878. Names: Chen Yi.'
