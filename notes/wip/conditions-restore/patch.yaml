      date: '1961-01-27'
      thread: china
      place: shanghai
      c: 'As a Shanghai 上海 report has it: in the canteens of the Shanghai Machine Tool Factory rice is washed so carelessly that several kilos a day are dug out of the sewers, to feed the pigs; on the night shift, under slack supervision, workers eat their fill, some in eating contests, a champion managing about two kilos of rice at a sitting.'
      n: '[[w.dikotter-maos-great-famine]], 196. To check: Shanghai Municipal Archives, Jan. 27, 1961, A36-1-246, pp. 9–17 (cited by [[w.dikotter-maos-great-famine]], 196 n.22).'
