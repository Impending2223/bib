      - europe-and-the-alliance
      c: 'As an East German file has it: China imports 5.96 million tonnes of grain in 1961, Australia 2.74, Canada 2.34, Burma 0.3, France 0.285, Germany 0.25, Argentina 0.045. Not all for home use: the Burmese rice shipped on to Ceylon to meet China''s commitments; some 160,000 tonnes to East Germany against the trade deficit; two cargoes of wheat, some 60,000 tonnes, from Canadian ports to Tirana as a gift.'
      n: '[[w.dikotter-maos-great-famine]], 110 (Table 4: the imports); [[w.dikotter-maos-great-famine]], 112–113 (the rice, the grain to East Germany, the wheat to Tirana). Made public: 2010. To check: BArch, Berlin, 1962, DL2-VAN-175, p. 15 (cited by [[w.dikotter-maos-great-famine]], 110 n.table-4a, 113 n.25); Allan J. Barry, "The Chinese Food Purchases," *China Quarterly*, no. 8 (Oct.–Dec. 1961), 21 (cited by [[w.dikotter-maos-great-famine]], 110 n.table-4b). Check: the day.'
      src:
