      date: '1961-12-15'
      thread: china-leadership
      also:
      - china
      place: hunan
      c: 'As a Hunan 湖南 report has it: in Yueyang county some 22,000 people lose their homes to the Tieshan 鐵山 Reservoir; their bricks, furniture, tools and cattle taken for a collective farm in the mountains, where they are sent; the reservoir abandoned, the evacuees, going home, find ghost villages stripped bare and shelter in huts, privies, pig sheds and caves, some of which collapse on them; 10 kilos of grain a month; few with padded clothes or blankets.'
      n: '[[w.dikotter-maos-great-famine]], 170–171. Made public: 2010. To check: Hunan Provincial Archives, Dec. 15, 1961 and Mar. 21, 1962, 207-1-753, pp. 103–5 and 106–9 (cited by [[w.dikotter-maos-great-famine]], 171 n.36). Check: the day; the note gives files of Dec. 15, 1961 and Mar. 21, 1962.'
