    item: '[[w.dikotter-maos-great-famine]], 246 (the file of Aug. 4, n.6: in Beijing''s Number Two Cotton Factory 90 per cent of the children sick, mostly with measles and chickenpox; scabies and worms widespread; death rates high)'
