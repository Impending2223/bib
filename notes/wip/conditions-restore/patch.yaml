- edit:
    id: cal.1961.china-leadership-33
    base: dc7200e0
    set:
      gloss:
        title: Estimates
        text:
        - Estimates of the famine, 1958–62 (the famine has no thread of its own; set here, on the leadership's own national count of its toll, as the most fitting entry, by the owner's rule of Nov. 21, 2026).
        - 'Dikötter: at least 45 million deaths above the normal rate in 1958–62, Chen Yizi''s 43 to 46 million borne out by the archives; of the victims at least 6 to 8 per cent, some 2.5 million, beaten or tortured to death; 1 to 3 million suicides, 3 to 6 per cent of the avoidable deaths; perhaps half of all cadres regularly beating the people they served; 30 to 40 per cent of all houses turned to rubble ([[w.dikotter-maos-great-famine]], 325, 333; 298; 304; 294; 169). He takes Cao Shuji''s 32.5 million, from the county gazetteers, as a conservative baseline (325, 329).'
        - 'Yang Jisheng: about 36 million abnormal deaths in the famine, between 35 and 37 million with the 1.81 million of 1958 and 0.42 million of 1962 by the provinces'' official figures; some 40 million births lost; a loss of about 76 million people in all ([[w.yang-jisheng-mubei]], II, 1004–1005; the same 36 million, [[w.yang-jisheng-tiandi-fanfu]], I, 54). Cases of people eating people, by his reckoning, several thousand in the country (I, 55).'
        - 'Yang Jisheng, by the official figures for Qinghai: 102,900 abnormal deaths there, 5 per cent of the province ([[w.yang-jisheng-tiandi-fanfu]], I, 395).'
- edit:
    id: cal.1965-11-10.china-leadership
    base: 708ac5e1
    set:
      gloss:
        title: Estimates
        text:
        - Estimates of the Cultural Revolution's dead (the thread's matter, set on its first entry, Yao Wenyuan's article, by the owner's rule of Nov. 21, 2026).
        - 'Yang Jisheng: the cleansing of the class ranks, the "one strike, three anti" and the hunt for the "May 16" elements together cost over 2 million abnormal deaths, twenty times the cadres who died abnormally in the Cultural Revolution; those killed in mass slaughters by the authorities not fewer than 300,000 ([[w.yang-jisheng-tiandi-fanfu]], II, 633, 685). In Guangxi, of the 89,700 dead with names and addresses reported in 1984, 79,000 killed in organized massacres; on a total of 100,000, 80,000 massacred (II, 676).'
        - 'The estimates Yang gives: Ding Shu, 30 million struggled in the cleansing and 500,000 dead; Andrew Walder and Su Yang, from over 1,500 county gazetteers, some 36 million persecuted in the countryside, 750,000 to 1.5 million killed, as many maimed; the official history, 100 million implicated ([[w.yang-jisheng-tiandi-fanfu]], II, 600). For the "one strike, three anti": Wang Rui, 20,000 to 30,000 killed; Ding Shu, 100,000, or 150,000 to 200,000 (II, 632).'
- edit:
    id: cal.1968.vietnam-hanoi
    base: 5dd9c139
    set:
      gloss:
        title: Estimates
        text:
        - 'Friedman: between 1965 and 1968 more than 320,000 Chinese troops served in the DRV, chiefly in air defense, engineering, construction, minesweeping and logistics ([[w.friedman-shadow-cold-war]], 167, citing [[w.zhai-china-and-the-vietnam]], 135).'
        - 'Friedman: Soviet aid to the DRV reportedly exceeded the Chinese by 1968, half of all socialist aid ([[w.friedman-shadow-cold-war]], 167, citing [[w.gaiduk-soviet-union-and-the]], 58–59, [[w.zhang-communist-powers-divided]], 91–92, and [[w.zhai-china-and-the-vietnam]], 136); Mehta, by the note, has Chinese economic aid in 1967–68 still above the Soviet ([[w.mehta-soviet-biscuit-factories-and]]).'
        - 'Khoo, by the Chinese estimates: the PLA''s antiaircraft units in North Vietnam shoot down 1,707 aircraft, damage 1,608 and capture 42 American pilots in their four years in the DRV; over 1,100 Chinese soldiers dead, 4,300 wounded ([[w.khoo-collateral-damage]], 29, citing [[w.bianjibu-dangdai-zhongguo-junduide-junshi]], 759, and [[w.zhang-vietnam-war-1964-1969]], 759). By the Foreign Ministry''s account China''s aid to the DRV in 1964–69 totals $180 million (29, citing [[w.wang-taiping-zhonghua-renmin-gongheguo-waijiaoshi]], 35).'
        - 'Khoo, from the PLA''s history of the Cultural Revolution: China''s military aid to the DRV, 1964 to 1968, guns 80,500, 220,767, 141,531, 146,600, 219,899; artillery pieces 1,250, 4,439, 3,362, 3,984, 7,087; bullets (thousands) 25,240, 114,010, 178,120, 147,000, 247,920; shells (thousands) 335, 1,800, 1,066, 1,363, 2,082; radio transmitters 426, 2,779, 1,568, 2,464, 1,854; telephones 2,941, 9,502, 2,235, 2,289, 3,313; tanks 16 in 1964, 26 in 1967, 18 in 1968; ships 7, 14, 25, 18 in 1965–68; aircraft 18 in 1964, 2 in 1965, 70 in 1967; vehicles 25, 114, 96, 435, 454; uniforms (thousands) 400, 800, 1,000 in 1966–68 ([[w.khoo-collateral-damage]], 29, Table 2.1, from [[w.ke-wenhua-dageming-zhongde-renmin]], 416).'
        - 'Khoo, by the Chinese records: from August 1964 to November 1968, 383 sorties of American warplanes, in 155 groups, violate Chinese airspace; Chinese aircraft fly 2,138 sorties in answer ([[w.khoo-collateral-damage]], 29, citing [[w.zhang-vietnam-war-1964-1969]], 744–745).'
        - 'Pike''s estimates of Soviet aid, as Khoo gives them: Soviet military aid to North Vietnam $125–190 million in 1960–64, $1.4–1.8 billion in 1965–68; Soviet economic aid about $918–988 million in 1965–68; in 1968 Soviet military aid two-thirds of Hanoi''s, worth $392 million ([[w.khoo-collateral-damage]], 27). The estimates of Soviet economic aid for 1965–69, by Pike, Thai Quang Trung and the CIA, in millions of dollars: 278, 85 (1965); 150–165, 150 (1966); 200–240, 200, 200 (1967); 290–305, 240, 700 (1968); 290–385, 250, 250 (1969); of military aid, by Pike and Trung: 210–270, 210; 360–455, 360; 505–650, 505; 390–440, 290; 175–195, 220 ([[w.khoo-collateral-damage]], 86–87, Tables 4.1–4.2).'
- edit:
    id: cal.1969-09-04.china-leadership-2
    base: cbafff8b
    set:
      gloss:
        title: The record
        text:
        - 'Khoo: from the launch of the Tet Offensive in late January 1968 to Hồ Chí Minh''s funeral, Hanoi goes on sending delegations to Peking, but no Chinese delegation, official or unofficial, goes to Hanoi ([[w.khoo-collateral-damage]], 39; the nearest note, n.203, cites [[w.lawson-sino-vietnamese-conflict]], 109).'
