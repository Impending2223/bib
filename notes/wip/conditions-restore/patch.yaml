- cite:
    id: cal.1962.china-leadership-48
    item: '[[w.dikotter-maos-great-famine]], 289 (n.11, the same file, p. 150: death rates in Hebei''s labour camps of 4 to 8 per cent a year in 1959–61, the lowest the book found)'
- edit:
    id: cal.1960-04.china-leadership-16
    base: 2076eab0
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter: a death rate of about 5 per cent in 1958 and 1962 and 10 per cent a year in 1959–61 in the reform-through-labour camps would mean some 700,000 dead of disease and starvation; with three or four held in local re-education camps for each criminal handed to the courts, a prisoner population of 8 to 9 million a year in the Great Leap Forward (1.8 to 2 million in labour camps, 6 to 8 million in re-education camps), and some 3 million dead in the gulag during the famine ([[w.dikotter-maos-great-famine]], 289, 291).'
