      gloss:
        title: Estimates
        text:
        - 'Dikötter: close to 6 million tonnes of grain bought in 1960–61 at a cost of US$367 million, about half paid in 1961 ([[w.dikotter-maos-great-famine]], 109); the wheat sent to Albania, a country of some 1.4 million, as much as a fifth of its needs (113).'
