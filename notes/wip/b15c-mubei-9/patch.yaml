        c: Shuicheng 水城 county, Guizhou 貴州. By the account of Yan Yuebin 宴樂斌 (so printed), he and two others, on their way from the county seat to Nankai 南開 commune for the rectification 整風整社 work, stop at a member's house for water and find a woman of about 40 cutting up a child's body with a kitchen knife, the head and limbs severed. She says the child starved that morning and that the family, without food, is eating it to live.
