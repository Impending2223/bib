patch: 2026-11-20-b15c-mubei-9
by: 'Claude (batch 15c run 9, Yang Jisheng, *Mubei*, Tiandi 2016 ed.: run 8''s leads; the crimes of chs. 10–13, I, 487–611), Nov. 20, 2026'
ops:
  - edit:
      id: cal.1960-12-09.china-leadership-6
      base: d5784b54
      set:
        n: '[[w.yang-jisheng-mubei]], I, 512–513. The book prints four of the 46 beaten killed (I, 512); the entry said ten. Made public: 2008. To check: Chuxiong Prefectural Committee, "Report to the provincial committee on the problems of Taoyuan district, Cangling commune, Chuxiong county," Dec. 9, 1960 (cited by [[w.yang-jisheng-mubei]], I, 513 n.48). See [[cal.1960.china-leadership-90]]; [[cal.1960-05-16.china-leadership-10]]; [[cal.1960.china-leadership-91]]; [[cal.1960.china-leadership-92]]. Check: the book names the cadre Yu 余; the passage the note closes runs over the two pages.'
        c: The Chuxiong 楚雄 prefectural committee 地委 reports to the provincial committee on the problems of Taoyuan 桃園 district, Cangling 蒼嶺 commune, Chuxiong county 關於楚雄縣蒼嶺公社桃園管理區問題向省委的報告. The district's cadre beat 46 members, killing four and maiming nine; of its 1,692 people 205 had wasting or edema and 98 died. In 1960 he ate 162 jin of pork, 260 of beef, 46 chickens and 173 jin of fish, and won a bronze medal at the year's heroes' meeting.
        src:
          c: 060183c6
          rows:
            - 'w.yang-jisheng-mubei I, 512-513: all'
            - 'via w.yang-jisheng-mubei I, 513 n.48: all'
