        at: before 1960-01
        place: jinsha-guizhou
        thread: china-leadership
        also: [china]
        c: Jinsha 金沙 county, Guizhou 貴州. Under the county secretary Zhao Guangyu 趙廣玉 and the secretariat secretary Wang Guomin 王國民 the county committee presses a campaign against hiding and sharing out grain 反瞞產私分, eight months from the winter of 1959, with its "four clean-outs" 四光政策 (the Party cadres above the team all removed, the houses torn down, the furniture searched out, the stoves scraped) and its "ten fulfilments" 十大兌現 (fines and confiscation for stripping bark, digging wild greens, killing a pig or sheep, stealing crops, missing work, mourning the dead). In it 250 cadres of the district level, 69 percent, are dismissed, transferred, expelled or prosecuted.
        n: '[[w.yang-jisheng-mubei]], I, 568, 569 (Wang Weizhou''s findings on his inspection of November 1960, from the Central Discipline Inspection Commission''s chronicle that Li Jian gave the author). Made public: 2008. To check: *Zhongjiwei dashiji* 《中紀委大事記》 (a document given to the author by Li Jian, then vice-secretary of the Central Discipline Inspection Commission) (named by [[w.yang-jisheng-mubei]], I, 568; no note). Check: the months; the book gives eight months from the winter of 1959.'
