      base: d3e0c9c9
      set:
        n: '[[w.yang-jisheng-mubei]], II, 1170 (the book''s chronology); [[w.yang-jisheng-mubei]], I, 587 n.5, 588 (the region committee''s report of March 1960 on the "Zhongning incident": the county committee refused to carry out the Center''s and the region''s instructions, hid the truth, resisted inspection, struck at Party members and cadres in the name of rectification; the county committee''s leadership "in bad men''s hands"; the county committee wholly reorganized). Made public: 1998 (the articles of *Ningxia wenshi ziliao* no. 21 from which the book compiles its section on the incident: [[w.yang-jisheng-mubei]], I, 587 n.5). To check: Li Shujie 李樹杰, 《談「中寧事件」》; Su Zhongshen 蘇忠深, 《我在「中寧事件」上接觸到高指標問題》; Ren Shanyi 任善藝, 《「中寧事件」前後的幾點零星回憶》; Ye Guangcai 葉光彩, 《農民蕭漢興上書毛澤東》, all in *Ningxia wenshi ziliao* 寧夏文史資料 no. 21 (Ningxia renmin chubanshe, May 1998) (cited by [[w.yang-jisheng-mubei]], I, 587 n.5). Check: the book gives the day only; its chapter on the incident (ch. 13) is not yet read; the calendar holds the Center''s approval of the Ningxia committee''s correction of Mar. 31.'
