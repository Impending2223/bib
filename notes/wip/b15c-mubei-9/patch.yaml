        c: Yanshan 硯山 county, Yunnan 雲南. With members selling clothes and bedding for food and some leaving the land for trade, the county committee 縣委 opens a mass struggle against the enemy 對敵鬥爭 and in a short time struggles against over 500 people. By June 5 only 60,000 of the county's 160,000 mu of paddy are planted.
        n: '[[w.yang-jisheng-mubei]], I, 512 n.47. Made public: 2008. To check: Yunnan Provincial Committee work group, "Report on Yanshan county''s neglect of the masses'' livelihood and its carrying out of mistaken struggle" 《關於硯山縣忽視群眾生活實行亂鬥爭的報告》, June 8, 1960 (cited by [[w.yang-jisheng-mubei]], I, 512 n.47).'
