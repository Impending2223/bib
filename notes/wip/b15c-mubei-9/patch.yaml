      set:
        n: '[[w.dikotter-maos-great-famine]], 302; [[w.yang-jisheng-mubei]], I, 512, 513 n.48 (the Chenjiaba 陳家壩 team twelve days without rations, its 76 members eating roots, Cheng Shusheng 程樹生, 86, starving; the cadre Yu 余). Made public: 2008 ([[w.yang-jisheng-mubei]], first ed.). To check: Yunnan Provincial Archives, Dec. 9, 1960, 2-1-4157, p. 170 (cited by [[w.dikotter-maos-great-famine]], 302 n.63). See [[cal.1960-12.china-leadership-22]]. Check: the day.'
