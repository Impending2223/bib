        c: 'Zhongning 中寧 county, Ningxia 寧夏. Su Zhongshen 蘇忠深, a cadre of the county committee, goes with the county head Wu Keqiang 巫克強 to two communes north of the Yellow River 黃河 to inspect the spring sowing: no member at work in the fields. In a mess hall some 20 starving members kneel to them and cry for help.'
