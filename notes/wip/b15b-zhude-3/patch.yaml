        date: '1963-03-30'
        place: chengdu
        thread: china-leadership
        c: 'Chengdu 成都. Zhu De 朱德 hears Liao Zhigao 廖志高 and Yang Chao 杨超, secretaries of the Sichuan committee''s Secretariat 中共四川省委书记处, and Yang Wanxuan 杨万选, of its Standing Committee and head of its rural work department 农村工作部, on Sichuan''s plans for the Third Five-Year Plan 第三个五年计划 and the province''s three-level cadre conference, and says: grain and oil targets not too high, or they will fail; grain grows some 4 or 5 percent a year, not 10-odd; output planned in the order agriculture, light, heavy; many lines; herds much enlarged, to give the people meat; more exports for foreign exchange to buy machinery, light industry, handicrafts and household sidelines all able to export, the targets rising each year.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1870. Made public: 2016. Names: Zhu De.'
