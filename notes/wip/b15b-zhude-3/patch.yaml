  - cite: {id: cal.1962-09-24.china, item: '[[w.zhu-de-nianpu-xinbian]], III, 1850–1851 (Sept. 24–27, 1962; Zhu De 朱德 at the Eighth Central Committee''s Tenth Plenum 中共八届十中全会 in the Huairen Tang 怀仁堂, Zhongnanhai 中南海, which adopts the decisions on further consolidating the communes'' collective economy and developing farming, on commerce work, on the planned exchange of leading Party and government cadres and on strengthening the Party''s control organs, and the Work Regulations for the Rural People''s Communes; elects Lu Dingyi 陆定一, Kang Sheng 康生 and Luo Ruiqing 罗瑞卿 secretaries of the Secretariat; announces the special investigation of Peng Dehuai 彭德怀 and Xi Zhongxun 习仲勋; removes Huang Kecheng 黄克诚 and Tan Zheng 谭政 from the Secretariat; Mao Zedong 毛泽东 on class struggle, to be spoken of "every year, every month"; the plenum also puts economic work "first")'}
  - cite: {id: cal.1962-09-25.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1850–1851 (Sept. 25, 1962; Zhu De 朱德 speaks at the plenary: with the "eight-character policy" 八字方针 in industry and the Twelve Articles 十二条 and Sixty Articles 六十条 in farming the situation much better, the market livelier with the private plots and fairs, the peasants glad; the situation not to be judged all black; to learn to trade the most urgent thing, not for the commerce departments alone but for the Party committees and all; many countries want China''s goods; China''s climates and many hands can grow a great variety, several thousand Chinese medicines alone; the teams, well organized, to run many lines, sell to the state, and grow rich, not a few but all together)'}
