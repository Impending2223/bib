        c: 'Gejiu 个旧. Zhu De 朱德 inspects the Gejiu tin mine 个旧锡矿 and writes an inscription for it: "Tin first, comprehensive use, quality and quantity both, economic accounting" 以锡为主，综合利用，重质重量，经济核算. He explains "comprehensive use": crossing the grasslands on the Long March 长征, when the troops killed a beast nothing was thrown away, bone, meat, hoof and hide all used; with Gejiu''s riches comprehensive use matters the more.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1843. Made public: 2016. Names: Zhu De.'
