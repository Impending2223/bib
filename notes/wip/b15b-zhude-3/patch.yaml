        c: 'Zhengzhou 郑州, Henan 河南省. Zhu De 朱德 arrives. He hears Liu Jianxun 刘建勋, first secretary of the Henan committee 中共河南省委, on their work. Told that Henan''s coal output is falling and its mines lose over ten million yuan a year, he says: coal prices must be settled, for with long losses production cannot grow.'
