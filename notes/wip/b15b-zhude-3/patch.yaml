        c: 'Shanghai 上海. Zhu De 朱德 hears the heads of the city''s commerce bureau 上海市商业局 and foreign trade bureau 外贸局. Told that the conflict between state commerce and the supply cooperatives is sharp, he says: state commerce and the basic cooperatives trade as buyer and seller, the cooperatives to make a profit, nothing taken from them without pay; a country so large and populous, its people scattered, cannot be served by state commerce alone, but through the basic cooperatives.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1857. Made public: 2016. Names: Zhu De.'
