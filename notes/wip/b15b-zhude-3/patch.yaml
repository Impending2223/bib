        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Zhu De 朱德 hears Li Weixin 李维新, vice-governor of Zhejiang 浙江省, and the heads of the province''s commerce department 商业厅 and supply cooperatives on commerce and foreign trade. Told that salt shipped out of the province is sold at a loss, he says: salt was once a great profit, now a loss; how to carry salt to six hundred million? Peddlers to be let carry it; on mulberry and silkworms: public and private rearing both, every household''s mulberry and silkworms making full use of spare hands.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1857. Made public: 2016. Names: Zhu De.'
