  - add:
      entry:
        id: cal.1962-06-20.china-leadership-8
        when: June 20
        date: '1962-06-20'
        thread: china-leadership
        c: 'Zhu De 朱德 talks with Yang Chengwu 杨成武, deputy chief of the General Staff 中国人民解放军副总参谋长, on defense building and readiness for war: the navy''s technical equipment and the defense of the islands to be strengthened; if war comes the navy and the islands will meet it first, Hainan Island 海南岛 and Zhejiang 浙江 above all; new military techniques to be mastered, or strategy and tactics will come to nothing.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1843. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-06-20.china-leadership-9
        when: June 20
        date: '1962-06-20'
        thread: china-leadership
        c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, a report on his inspection of Sichuan 四川 and Yunnan 云南 with proposals: most of Yunnan''s handicraft and supply cooperatives restored and output rising, but prices of the handicraft cooperatives'' goods made from materials they buy themselves held so tight they lose money, to be let rise to cover costs with a small profit; the village population eating commodity grain to be cut, the market towns'' craftsmen and the communes'' service units firmly streamlined to strengthen farming, those kept fed by the teams, not on state-sold grain; the policy allowing members to keep one or more draft animals not carried out, horses, mules, cattle and donkeys much fewer; the "horse caravans" 马帮 of Yunnan and Sichuan still needed for years, they and their inns to be run by the basic cooperatives or the teams, farming in season and hauling out of it; below the county, communes larger, teams smaller: since the Sixty Articles 六十条 the communes and brigades made smaller and the full-time and subsidized cadres more, a commune to a township or larger, under the county, no district above it, to free cadres for the base; Yunnan the country''s base for nonferrous metals, over a million tons proved, tin the most, output to be raised, not cut; Yunnan''s hills, forests, warmth, rain and water works promise much for opening waste land, over ten million mu by estimate (perhaps tens of millions in fact), a good place to settle those sent down and open the hills.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1843–1845. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1962-06-25.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1845 (June 25, 1962; Zhu De 朱德, with Deng Xiaoping 邓小平, Peng Zhen 彭真 and others, at the capital''s rally, so printed, for the twelfth anniversary of the "liberation" of the Democratic People''s Republic of Korea 首都各界人民纪念朝鲜民主主义人民共和国解放十二周年集会)'}
  - add:
      entry:
        id: cal.1962-06-26.china-leadership-6
        when: June 26
        date: '1962-06-26'
        thread: china-leadership
        c: 'Zhu De 朱德 talks with Chen Qihan 陈奇涵, vice-president of the Supreme People''s Court 最高人民法院, and Yang Zhicheng 杨至诚, vice-president of the Higher Military Academy 高等军事学院, on the army''s history from the Nanchang rising 南昌起义 to the Jinggangshan 井冈山: the Party''s 党 military work in the first civil war, its gains and lessons; why the Nanchang rising was launched and how its army went south; the chief lesson of its failure, that it was not joined with Jiangxi''s 江西 peasant movement; how the remnant held on, the South Hunan rising 湘南起义 of early 1928, the meeting on the Jinggangshan in April with the Autumn Harvest rising''s troops 秋收起义部队 under Mao Zedong 毛泽东, and the battles that founded and held the Jinggangshan base. The summary of the talks, "From the Nanchang Rising to the Jinggangshan," is in his *Selected Works* 《朱德选集》.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1845. Made public: 1983 ([[w.de-zhu-de-xuanji-selected]], where the nianpu says the record is collected as 《从南昌起义到上井冈山》). To check: [[w.de-zhu-de-xuanji-selected]] (《从南昌起义到上井冈山》, the summary of the talks of June 26 and July 22, 1962, where the nianpu says it is collected: [[w.zhu-de-nianpu-xinbian]], III, 1845). Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1962-06-29.china-leadership-3, item: '[[w.zhu-de-nianpu-xinbian]], III, 1845 (June 29, 1962; Zhu De 朱德, with Liu Shaoqi 刘少奇, Dong Biwu 董必武, Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真 and others, at the farewell banquet of Pak Kum Chol 朴金哲, head of the Supreme People''s Assembly delegation, and speaks: Korea''s internal affairs admit no foreign interference; the aggressor troops of American imperialism have no ground to stay in South Korea)'}
  - cite: {id: cal.1962-06-29.china-leadership-9, item: '[[w.zhu-de-nianpu-xinbian]], III, 1845 (June 29, 1962; Zhu De 朱德 at the NPC Standing Committee''s 全国人大常委会 ceremony presenting old Korean books held in China to the Korean people)'}
