  - add:
      entry:
        id: cal.1962-05-26.china-leadership-5
        when: May 26
        date: '1962-05-26'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, by letter, on what he found in the Xichang 西昌 region of Sichuan 四川: 100 million jin of "dead-corner grain" 死角粮 stored over the years in the hills, some from 1954, soon to spoil, which the prefectural committee would turn, besides brewing and starch, to feed for livestock and poultry, above all horses and cattle, to send draft animals and meat inland, a view he thinks sound; the people''s life very hard, one team with only 10 or 11 jin of grain a head a month in April and May, a full laborer 16 jin at the summer harvest and transplanting, from last year''s drought and from policy: the commune rule of no more than 12 liang a day even where a team has grain left after procurement and reserves, rations issued every ten days for fear of "eating ahead" 过头粮, limits still on opening small plots, the peasants bound too tight; local products plentiful but no way to ship them out; minerals rich, coal, iron, nickel, gold, silver, copper, lead, zinc, the iron chiefly vanadium-titanium ore; the Xichang steel works halted, but the small nickel works and the native copper, lead, zinc and gold works, which lose no money, to be allowed and helped to go on.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1841. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
