  - add:
      entry:
        id: cal.1963-03-02.china-leadership-9
        when: Mar. 2
        date: '1963-03-02'
        thread: china-leadership
        c: 'Zhu De 朱德 to Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, by letter, on what he learned in Jiangsu 江苏, Zhejiang 浙江, Guangdong 广东, Guangxi 广西, Hunan 湖南 and Hubei 湖北, with proposals: the village fairs on the whole healthy, the market from dead to alive, goods from few to many, prices from high to low, order returning; the basic supply cooperatives, most of them turned from state shops, to be put in order and given back their democratic management, run by the masses; their own trading to fight speculators, but no scrambling for goods between cooperatives or with state commerce, policy unified and prices concerted; the cooperatives to join commerce, handicrafts and the banks in aiding collective and household sidelines, so that there is work in every season; Hainan Island 海南岛 a treasure, its rubber, coconut, oil palm, coffee and cocoa, some strategic, to be opened with grain, labor, goods and water works, the teams and members urged to plant tropical crops and the state to study them and give technical help; much room to raise exports, above all local specialties, by restoring the teams'' and households'' sidelines and organizing purchase; the Ministry of Foreign Trade 外贸部 to set up an economic research body on world trade and foreign markets.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1866–1868. Made public: 2016. Names: Zhu De, Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:deng-xiaoping', 'vis:only:prc']
