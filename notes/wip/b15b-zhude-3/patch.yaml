        id: cal.1962-12-20.china-leadership-6
        when: Dec. 20
        date: '1962-12-20'
        place: jinan
        thread: china-leadership
        c: 'Jinan 济南, Shandong 山东省. Zhu De 朱德 arrives. He hears Bai Rubing 白如冰, a secretary of the Shandong committee''s Secretariat 中共山东省委书记处, and the vice-governors Su Yiran 苏毅然 and Liu Binglin 刘秉琳 on village work. Told that some village cadres'' conduct is bad and they embezzle grain, he says: embezzlement breaks the law, a few to be punished to teach the many; much lawlessness is within the Party, and the control commission 监察委员会 must first educate the Party''s cadres; more goods for export, handicrafts developed, the supply cooperatives put right.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1856. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-F']
  - add:
      entry:
        id: cal.1962-12-21.china-leadership-9
        when: Dec. 21
        date: '1962-12-21'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京, Jiangsu 江苏省. Zhu De 朱德 arrives. He hears the heads of the Jiangsu committee 中共江苏省委 on their work. Told that a few cadres take more than their share, more work points, coupons and private plots, he says: the root answer is the masses'' supervision, elections every year, the bad voted out, none appointed; cadres'' labor to be kept up, against revisionism; more export goods: the door cannot be shut, the world market must be reached; export goods made by small works, not big ones, easier and more flexible.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1856–1857. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-G']
