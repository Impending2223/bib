  - add:
      entry:
        id: cal.1962-06-20.china-leadership-8
        when: June 20
        date: '1962-06-20'
        thread: china-leadership
        c: 'Zhu De 朱德 talks with Yang Chengwu 杨成武, deputy chief of the General Staff 中国人民解放军副总参谋长, on defense building and readiness for war: the navy''s technical equipment and the defense of the islands to be strengthened; if war comes the navy and the islands will meet it first, Hainan Island 海南岛 and Zhejiang 浙江 above all; new military techniques to be mastered, or strategy and tactics will come to nothing.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1843. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-06-20.china-leadership-9
        when: June 20
        date: '1962-06-20'
        thread: china-leadership
        c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, a report on his inspection of Sichuan 四川 and Yunnan 云南 with proposals: most of Yunnan''s handicraft and supply cooperatives restored and output rising, but prices of the handicraft cooperatives'' goods made from materials they buy themselves held so tight they lose money, to be let rise to cover costs with a small profit; the village population eating commodity grain to be cut, the market towns'' craftsmen and the communes'' service units firmly streamlined to strengthen farming, those kept fed by the teams, not on state-sold grain; the policy allowing members to keep one or more draft animals not carried out, horses, mules, cattle and donkeys much fewer; the "horse caravans" 马帮 of Yunnan and Sichuan still needed for years, they and their inns to be run by the basic cooperatives or the teams, farming in season and hauling out of it; below the county, communes larger, teams smaller: since the Sixty Articles 六十条 the communes and brigades made smaller and the full-time and subsidized cadres more, a commune to a township or larger, under the county, no district above it, to free cadres for the base; Yunnan the country''s base for nonferrous metals, over a million tons proved, tin the most, output to be raised, not cut; Yunnan''s hills, forests, warmth, rain and water works promise much for opening waste land, over ten million mu by estimate (perhaps tens of millions in fact), a good place to settle those sent down and open the hills.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1843–1845. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
