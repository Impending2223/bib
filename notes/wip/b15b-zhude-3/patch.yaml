        place: xichang
        thread: china-leadership
        c: Xichang 西昌. Zhu De 朱德 inspects the seventh production team of the Minquan brigade 民权大队 of the Haibin commune 海滨公社.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1840. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1962-05-22.china-leadership-9
        when: May 22
        date: '1962-05-22'
        time_range: ['1962-05-21T22:00Z', '1962-05-22T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: xichang
        thread: china-leadership
        c: 'Xichang 西昌. Zhu De 朱德 hears the Xichang prefectural committee 中共西昌地委 on farming and work among the nationalities, and says: the spirit of the Seven Thousand Cadres Conference 七千人大会 to be carried out, democracy practiced and the cadres let say all they have to say; experience summed up, the root of it theory joined to practice; seeking truth from facts the essence of Mao Zedong Thought 毛泽东思想; those wrongly dealt with in the struggle against right deviation to be rehabilitated; here, unlike the interior, some policies to be loosened: restitution to be thorough, private plots to be enough, members to open waste land equal to their plots, up to a tenth of the cultivated land in most places; distribution by work.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1840. The words: 上午 (1840). Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
