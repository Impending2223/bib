  - add:
      entry:
        id: cal.1962-07-19.china-leadership-15
        when: July 19
        date: '1962-07-19'
        place: beidaihe
        thread: china-leadership
        c: 'Beidaihe 北戴河. Zhu De 朱德 talks with his staff 身边工作人员, the first of two talks: under a single policy, the methods to suit each place, with local rules and differences in ownership, responsibility and management; the main thing now to oppose the "left," not the right, which anyone can do; people to dare to speak; the coast''s "export of labor," building companies too to work abroad; commerce wholly centralized a problem, the grain departments to make a small profit, not lose money; collective and household sidelines side by side, much to be met by the family, not society, the family not to be broken up, or the peasants will idle; peasants to be urged to open waste land, untaxed for some years; draft animals collectively owned and privately kept, or privately owned; enterprises run by their directors under rules, each man answerable; taxes the state''s basic revenue, the enterprises'' taxes, depreciation and profits to be reckoned apart. The nianpu gives the points for the two talks together.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1846. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
