  - cite: {id: cal.1963-02-06.china-leadership-3, item: '[[w.zhu-de-nianpu-xinbian]], III, 1863–1864 (Feb. 7, 1963; Zhu De 朱德 at the meeting of the Politburo, the Secretariat and the regional bureaus'' first secretaries Liu Shaoqi 刘少奇 holds Feb. 6–9 in the Huairen Tang 怀仁堂, Zhongnanhai 中南海, on the fairs of the large and middle cities, grain, labor, wages, increasing production and practicing economy, and a "five-anti" 五反 campaign in the cities)'}
  - add:
      entry:
        id: cal.1963-02-07.china-leadership-2
        when: Feb. 7
        date: '1963-02-07'
        place: peking
        thread: china-leadership
        c: 'The Huairen Tang 怀仁堂, Zhongnanhai 中南海, Peking. Zhu De 朱德 speaks at the meeting Liu Shaoqi 刘少奇 holds: in the past years the country lacked food and clothing, and the organs'' production and the private plots saved lives; socialism must now be built from several sides; in the "five-anti" 五反 campaign the cadres to rely chiefly on examining themselves, from the top down, layer by layer, by self-criticism; embezzlement and taking more than one''s share come to idleness, speculation and a little more for oneself; but for grave cases, a self-examination and the money and goods returned enough, no seizing of pigtails and no labels lightly put on. (The nianpu''s note: the "five-anti" campaign is against embezzlement and theft, speculation, waste, dispersionism and bureaucratism.)'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1864. Made public: 2016. Names: Zhu De, Liu Shaoqi.'
        tags: ['polity:prc', 'name:zhu-de', 'name:liu-shaoqi', 'vis:only:prc']
  - add:
