  - add:
      entry:
        id: cal.1962-05-20.china-leadership-4
        when: May 20
        date: '1962-05-20'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, by letter, on his inspection of Shaanxi 陕西 and Sichuan 四川: Shaanxi''s wheat crop likely down by a third, from 4 billion jin to 2.8 billion, 500 million below last year''s 3.3 billion, and the people''s life very hard; Shaanxi''s coal enterprises losing money, the small pits most; the allocation price of coal may stand, but the small pits'' retail price to be raised locally, not fixed from above, or the pits will fail and the people lack fuel; the eating-houses and snack stalls of both provinces'' markets gone, the peasants at market finding nothing to eat: private persons or the cooperatives to open a few eating-houses in the market towns, the state supplying no grain and the peasants selling their own.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1838. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-05-20.china-leadership-5
        when: May 20
        date: '1962-05-20'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, by letter, on Sichuan''s 四川省 handicraft departments trading part of their products for raw materials: before the drive on speculation in the fourth quarter of last year the free market''s high prices for bamboo and timber raised costs and brought losses; after it the materials all but vanished and many handicraft cooperatives and works broke up; trading products for the villages'' bamboo, timber, palm fiber, ferns and grasses has brought the trades back, with four gains: materials, steadier prices, short haulage solved, losses turned to profit; the handicrafts'' materials too many and scattered for the state plan or the commerce departments; with 20 to 30 percent of their products traded for materials and 70 to 80 percent to the commerce departments, those departments would hold more goods than when they took all.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1838–1839. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
