  - cite: {id: cal.1963-02-25.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1866 (Feb. 25, 1963; Zhu De 朱德 presides at the eighty-fifth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第八十五次会议, which approves the agreement on cultural cooperation between the governments of China and the Republic of Tanganyika 《中华人民共和国和坦噶尼喀共和国政府文化合作协定》)'}
  - add:
      entry:
        id: cal.1963-02-27.china-leadership-9
        when: Feb. 27
        date: '1963-02-27'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, in the North China group 华北组 of the Central Work Conference 中共中央工作会议, on opposing revisionism: we hold to unity but do not fear a split; whether in cooperation or a split, the key is to do the work at home well; the whole Party and people of one heart under the banner of Mao Zedong Thought 毛泽东思想, hard struggle, self-reliance, more output and thrift, the technical reform of farming step by step, an independent and complete industrial system and strong national defense.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1865. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
