        date: '1963-01-26'
        place: canton
        thread: china-leadership
        c: 'Canton 广州. Zhu De 朱德 hears Zhao Ziyang 赵紫阳, second secretary of the Guangdong committee 中共广东省委, and Lin Liming 林李明, a secretary of its Secretariat, on their work, and says: Hainan 海南岛 to grow chiefly tropical cash crops, the one place in the country best suited to them; new land in terraces, not by burning the hills, for with the trees burnt the soil and water go; water stored and trees planted, and once the trees live all else will grow.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1861. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
