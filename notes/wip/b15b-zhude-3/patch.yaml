  - add:
      entry:
        id: cal.1962-09-06.china-leadership-3
        when: Sept. 6
        date: '1962-09-06'
        thread: china-leadership
        c: 'Zhu De 朱德 to Li Xiannian 李先念 and Chen Boda 陈伯达, by letter: he agrees in the main with the draft "Decision on Questions of Commerce Work" 《关于商业工作问题的决定》（草案）, with four points: to "promote production, enliven the economy, join town and country, trade at home and abroad," the supply and marketing cooperatives'' channels to be restored and made sound at once; under unified leadership the market to be livelier, ending "chaos without unity, death with it," no one rule for every place; the Party''s lead in commerce strengthened, members called to learn to trade, good cadres sent to its offices and enterprises; with goods short, full exchange at equal value hard, the price scissors to be narrowed step by step, in the long run by the law of value, care now that readjusting prices does not widen the gap, and later the inverted grain price, the grain-cotton price gap and industry''s losses to be resolved.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1849. Made public: 2016. Names: Zhu De, Li Xiannian, Chen Boda.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:li-xiannian', 'name:chen-boda', 'vis:only:prc']
