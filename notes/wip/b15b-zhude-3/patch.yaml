  - cite: {id: cal.1962-05-14.china-leadership-6, item: '[[w.zhu-de-nianpu-xinbian]], III, 1837 (May 14, 1962; Zhu De 朱德 presides at the fifty-fourth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第五十四次会议, which hears Peng Zhen 彭真 on the NPC delegation''s visit to the Democratic People''s Republic of Korea and decides appointments and removals)'}
