        thread: china-leadership
        c: 'Zhu De 朱德 hears Wang Zhen 王震 on the state farms 农垦, and says: Yunnan 云南 has good conditions, subtropical cash crops promising, to be developed, the land round the basins 坝子 extended, some dry basins opened; the Northeast 东北 cannot live without sidelines, which must grow; logging to think first of getting the timber out, not only of profit, for if it cannot be got out there is no profit at all; sericulture to be done as a household sideline, the people roused to plant mulberry, for only so will it grow.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1853. Made public: 2016. Names: Zhu De.'
