  - add:
      entry:
        id: cal.1962-04-19.china-leadership-7
        when: Apr. 19
        date: '1962-04-19'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 talks with Fang Zhichun 方志纯, a secretary of the Jiangxi committee''s Secretariat 中共江西省委书记处 and vice-governor of Jiangxi 江西省, then in Peking: trade for six hundred million people cannot rest on the state alone; neither private nor collective trade allowed will not do; traders pay tax; without economic democracy all the talk of democracy comes to nothing; the market towns'' people to be sent down, not kept by the state; outside unified purchase and sale, individuals to sell cooked food and open teahouses and eating-houses. Jiangxi''s villages first to restore farming, second to develop sidelines; the province to make export goods, with a share of the exports'' earnings; the hills'' bamboo, timber, mushrooms and the like for the teams, pulp for the brigades; a supply base for Hong Kong 香港; only when the peasants grow rich will the whole economy revive.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1835. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1962-04-19.china-leadership-6, item: '[[w.zhu-de-nianpu-xinbian]], III, 1835 (Apr. 19, 1962; Zhu De 朱德, with Chen Yi 陈毅, Guo Moruo 郭沫若 and others, at the poetry forum of the editors of *Shikan* 《诗刊》 of the Chinese Writers'' Association 中国作家协会, and speaks: our socialist building great and glorious, poetry to show it to the people and to those after us; the good things of China''s thousands of years to be inherited, the old giving rise to the new; his own four or eight lines, written as he is moved, hardly poems, only the wish to express himself; he would meet the poets often)'}
  - cite: {id: cal.1962-04-23.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1835 (Apr. 23, 1962; Zhu De 朱德 at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议, which hears the reports on streamlining in the Northeast 东北地区 and the Central Finance and Economics Group''s 中央财经小组 report on the 1962 plan for readjusting the economy)'}
  - add:
      entry:
        id: cal.1962-04-24.china-leadership-13
        when: Apr. 24
        date: '1962-04-24'
        thread: china-leadership
        c: 'Zhu De 朱德 talks with Lin Haiyun 林海云, Vice-Minister of Foreign Trade 外贸部; on trade relations with the Soviet Union 苏联: trade with it still possible, and good for both sides.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1835–1836. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1962-04-24.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1836 (Apr. 24, 1962; Zhu De 朱德 at the Politburo Standing Committee 中共中央政治局常委会议, which hears Zhou Enlai 周恩来 on the Central Finance and Economics Group''s draft report on discussing the 1962 plan for readjusting the economy 《关于讨论一九六二年国民经济调整计划的报告（草稿）》)'}
  - add:
      entry:
        id: cal.1962-04-27.china-leadership-13
        when: Apr. 27
        date: '1962-04-27'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, by letter: he agrees with the proposal in a letter from Ren Qiming 任启明, a cadre of the forestry special products bureau of Rui''an county 瑞安县林业特产局, Zhejiang 浙江省, that every village household plant mulberry and raise silkworms, worth spreading; the household silkworms of the past ten years and more fewer and fewer because the new methods ignored the people''s old habits; new methods to start from China''s facts and not forget the people''s ways, in silkworms and in much else.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1836. [[w.deng-xiaoping-nianpu-1904]], III, 1703 (the letter, under Deng''s comment of Apr. 28, 1962). Made public: 2009 ([[w.deng-xiaoping-nianpu-1904]]). Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
  - cite: {id: cal.1962-05-01.china-leadership-6, item: '[[w.zhu-de-nianpu-xinbian]], III, 1836 (May 1, 1962; Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德, Zhou Enlai 周恩来 and others at the capital''s May Day evening gala 首都庆祝五一国际劳动节联欢晚会)'}
