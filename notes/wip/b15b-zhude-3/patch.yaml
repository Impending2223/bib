  - add:
      entry:
        id: cal.1962-05-24.china-leadership-11
        when: May 24
        date: '1962-05-24'
        place: kunming
        thread: china-leadership
        c: 'Kunming 昆明. Zhu De 朱德 visits the Black Dragon Pool park 黑龙潭公园 at the foot of Longquan Hill 龙泉山 in the northern suburbs and writes the poem "Revisiting the Black Dragon Pool" 《重游黑龙潭》, recalling his quarters in its old temple at the Double Ninth restoration 重阳光复 (the nianpu''s note: the Yunnan rising of Oct. 30, 1911, led by Cai E 蔡锷 and others in answer to the Wuchang 武昌 rising, in which Zhu De took part, his troops quartered in the park''s temple).'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1840. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
