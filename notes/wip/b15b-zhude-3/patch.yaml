      entry:
        id: cal.1962-08-20.china-leadership-6
        when: Aug. 20
        date: '1962-08-20'
        place: beidaihe
        thread: china-leadership
        c: 'Beidaihe 北戴河. Zhu De 朱德 writes in his notebook his views on the economy and policy: the organs'' production not to be written off for its embezzlers, who are to be dealt with by Party policy and the law; prices a tangled question not yet worked out; the Sixty Articles on agriculture 农业六十条 and the Seventy Articles on industry 工业七十条, once adopted, to be carried out, some works not doing so; the relations of state, collective and individual to be settled: with no house, food or family, how can the collective hold?; in foreign trade, imports to feed exports works; the "three guarantees" 三包 to the group workable in some areas; China a semi-feudal base where capitalism never grew, so the transition slower; seek truth from facts and suit each place, a single national rule, like a national maize campaign, not; for settled lives and work, main work and sidelines both, families to be made.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1848. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1962-08-21.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1848 (Aug. 21, 1962; Zhu De 朱德 at the meeting at Mao Zedong''s 毛泽东 in the afternoon)'}
  - add:
      entry:
        id: cal.1962-08-25.china-leadership-8
        when: Aug. 25
        date: '1962-08-25'
        place: qinhuangdao
        thread: china-leadership
        c: 'Qinhuangdao 秦皇岛. Zhu De 朱德 inspects the Qinhuangdao docks 秦皇岛码头 and the Yaohua glass works 耀华玻璃厂. Hearing the heads of the port bureau 秦皇岛港务局, he says: they are to take up exports and find trade; a dock is for carrying trade, ore, salt, coal; through the docks to deal with every country, trade on a world scale; without grain there are always stones, the goods to be found; socialism always goes forward, at times blocked, pausing, readjusting, then on again, not always pressed down.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1848–1849. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-G']
