        c: 'Zhu De 朱德, going from Shaanxi 陕西 to Sichuan 四川, passing Guangyuan 广元 in northern Sichuan, writes the ci "To the tune Yingwu qu: Battle Is Where the Heart Is at Ease" 《鹦鹉曲·战斗乃心安乐处》: his family farmers for generations south of the Ba Mountains 巴山; failing at books he became a soldier; fifty years ago he left home to seek the truth; a life in the saddle, battle where his heart is at ease.'
