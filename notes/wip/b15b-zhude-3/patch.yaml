        c: 'Xichang 西昌. Zhu De 朱德 hears the heads of the Xichang prefectural committee 中共西昌地委 and of its construction, industry, and finance and trade departments. In his notebook: the prefecture has much land and few people, rich in farming, forest, herds, sidelines, fish and minerals, with great promise; gold, silver, copper, iron, nickel, aluminum and other ores all to be mined.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1839. Made public: 2016. Names: Zhu De.'
