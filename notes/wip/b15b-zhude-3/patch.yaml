      entry:
        id: cal.1962-12-03.china-leadership-8
        when: Dec. 3
        date: '1962-12-03'
        thread: china-leadership
        c: 'Zhu De 朱德 receives Arudji Kartawinata 阿鲁季·卡塔威纳塔, Deputy Speaker of Indonesia''s Gotong Royong parliament 印度尼西亚合作国会, and his wife, and 阿赫马迪, Minister of Transmigration and Cooperatives, and his secretary. On the Sino-Indian 中印 border he says: in September 1959 the NPC Standing Committee''s eighth session adopted a good resolution urging India to settle the border by peaceful talks; India did not listen and encroached, each time warned, until the two sides'' posts stood some fifty meters apart; China held back and urged them not to use force, but they pressed on and on Oct. 20 attacked in force, and this time China struck back; the clash came wholly of India''s refusal of advice and talks, thinking China''s transport hard and troops few there; China won in self-defense yet withdrew of itself behind the line of actual control of Nov. 7, 1959; China wants no war and no land by force, but American imperialism stirs things up, setting Asians to fight Asians; the Bandung spirit 万隆会议精神 should guide this age, and by it war can be ended and peace kept.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1854–1855. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'polity:indonesia', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc+indonesia@B-H']
