  - add:
      entry:
        id: cal.1963-02-11.china-leadership-10
        when: Feb. 11
        date: '1963-02-11'
        thread: china-leadership
        c: 'Zhu De 朱德 talks with those of the State Council 国务院 in charge of the economy: the prices of coal and other raw materials to be settled, the mines too to earn; Guangxi 广西 to make more export goods; Hainan''s 海南 subtropical and tropical lands to grow tropical cash crops, not competing with grain for land; Hainan''s iron mine to prepare to export ore; the Yunnan 云南, Guizhou 贵州 and Sichuan 四川 railways the arteries, international lines, to be finished early; socialism in the villages a long process, still by two hands, the household first put in order; where transport is poor, still a self-sufficient economy, the teams to be consolidated; the works already built to produce; more exports, to buy what is needed; Guilin 桂林 a resort that can earn foreign exchange; frozen goods to be released.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1864–1865. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1963-02-11.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1865 (Feb. 11–28, 1963; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 in the Huairen Tang 怀仁堂, Zhongnanhai 中南海, on the 1963 plan, the decision on industrial work, policies of the day, the trading policy of commercial enterprises, the draft rules for primary and middle schools and socialist education in the cities; Mao Zedong 毛泽东 tells of Hunan''s 湖南 socialist education movement and the "four clean-ups" 四清 of accounts, granaries, property and work points in the Baoding 保定 prefecture, Hebei, saying "class struggle, once grasped, works wonders")'}
