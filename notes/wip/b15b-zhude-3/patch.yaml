        date: '1963-03-11'
        thread: china-leadership
        c: 'Zhu De 朱德 hears the heads of the state price departments 国家物价部门, and says: the low prices of coal and iron, he suspects, were set up by Gao Gang 高岗 in the Northeast 东北 after the Japanese colonial policy; the theory that heavy industry loses money to be reconsidered, for with losses there are no materials and no wish to produce more; prices to be raised somewhat, coal, iron, steel and timber, the change made in the five- and ten-year plans, the trouble not feared.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1868. Made public: 2016. Names: Zhu De.'
