        c: 'Gejiu 个旧, Yunnan 云南. Zhu De 朱德 arrives. He hears the heads of the Honghe Hani and Yi Autonomous Prefecture committee 中共红河哈尼族彝族自治州委 on their work. Told that the dependents'' grain is the chief difficulty, he says: much waste land, water and grass here, for herds; told the farms have over 200,000 people, the Hekou 河口 rubber farm alone 10,000: they are to grow their own grain; small industry and primary teachers sent down to the teams, all to set to work, standing on their own feet, the conditions good.'
