  - cite: {id: cal.1962-05-06.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1836 (May 6, 1962; Zhu De 朱德, with Chen Yi 陈毅, Ulanhu 乌兰夫 and others, watches the Peking aviation sports display 北京市航空体育表演 at the Western Suburb airport 北京西郊机场)'}
  - cite: {id: cal.1962-05-07.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1836–1837 (May 7–11, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "May conference" 五月会议) Liu Shaoqi 刘少奇 holds at the Huairen Tang 怀仁堂, Peking 北京, on the Central Finance and Economics Group''s draft report on the 1962 readjustment plan: the conference agrees with the Center''s view of the economic situation; Liu in his summing-up: not a fine situation but a difficult one, to be made plain to the cadres)'}
  - add:
      entry:
        id: cal.1962-05-08.china-leadership-9
        when: May 8
        date: '1962-05-08'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference''s 中共中央工作会议 industry and communications group 工交小组: the heart of the readjustment is cutting workers and the town population, the chief means of getting past the present difficulties, and the ministries and commissions to act at once; in the villages farming and sidelines, more grain and produce in the spirit of Nanniwan 南泥湾精神; without this resolve it will not do.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1836. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-05-09.china-leadership-10
        when: May 9
        date: '1962-05-09'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference''s 中共中央工作会议 agriculture, forestry, finance and trade group 农林财贸小组: household sidelines too tightly bound, the bans to be lifted; farming joined with sidelines, the members'' income will rise, the teams grow rich and the collective economy hold.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1836–1837. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-05-11.china-leadership-9
        when: May 11
        date: '1962-05-11'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference''s 中共中央工作会议 plenary, on village work: the whole Party to be roused to develop farming, the economy''s base; though the order agriculture, light, heavy industry was long proclaimed, building followed heavy, light, agriculture, a road that does not go through, and must now be turned round; in the villages two legs, the main work and sidelines both; the peasants'' food, clothing, housing and travel cannot be met by grain shared out from the main work alone, but by household sidelines.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1837. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1962-05-09.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1837 (May 8, 1962; Zhu De 朱德 at the reception of Sedivy 塞迪维, the Czechoslovak Ambassador, for the seventeenth anniversary of Czechoslovakia''s liberation)'}
