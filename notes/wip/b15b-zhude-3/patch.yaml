  - add:
      entry:
        id: cal.1963-02-10.china-leadership-5
        when: Feb. 10
        date: '1963-02-10'
        thread: china-leadership
        c: 'Zhu De 朱德 to Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, by letter, on his inspection of the southern provinces, cities and regions, with proposals: the Ministry of Foreign Trade 外贸部 to study foreign trade in force and set up an economic research body to study foreign markets systematically and gather economic and technical intelligence through trade, joined with home production, so that foreign trade serves production better and grows more active and flexible.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1864. Made public: 2016. Names: Zhu De, Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:deng-xiaoping', 'vis:only:prc']
