        c: 'Wuhan 武汉. Zhu De 朱德 hears Zhang Tixue 张体学, executive secretary of the Secretariat of the Hubei committee 中共湖北省委书记处 and governor of Hubei 湖北省, on foreign trade and the supply cooperatives, and says: the cooperatives to rest on the masses'' shares and supervision; sidelines, hill goods and medicinal herbs to be bought up through them; silk, tea, hog bristles and tung oil to be restored; commerce to spur production, for only with more goods is there more to share out; the fairs to be opened and well run.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1863. Made public: 2016. Names: Zhu De.'
