        date: '1963-01-30'
        place: guilin
        thread: china-leadership
        c: 'Guilin 桂林. Zhu De 朱德 hears the heads of the Guilin prefectural 中共桂林地委 and city 桂林市委 committees on village work, and says: the relations of state, collective and individual to be set right, none to be served alone; without the individual neither state nor collective can grow, and only with the three joined will the masses work with a will; the peasants'' getting rich not to be feared: if they lack food and clothes and cannot keep their families, how can socialism be built?; the fairs good, nothing to fear, buying and selling bring the economy to life.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1862. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
