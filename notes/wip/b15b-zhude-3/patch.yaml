        c: Zhu De 朱德 drives north by the eastern road for Wanning 万宁县 and Qionghai 琼海县 counties, calling on the local troops on the way and talking with cadres and men, and visiting the Nanlin farm 南林农场 and the Xinglong overseas Chinese farm 兴隆华侨农场. Seeing the Xinglong workers poorly housed, three generations under one roof, he tells its head to improve their housing.
