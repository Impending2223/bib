  - cite: {id: cal.1962-08-06.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1846–1847 (July 25–Aug. 24, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "Beidaihe conference" 北戴河会议), in its center group 中心小组 of Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De, Deng Xiaoping 邓小平, the State Council''s sector heads and the regional bureaus'' secretaries; meant for farming, grain, commerce and state aid to farming; Zhu De in the East China, Southwest, Northeast and North China groups, saying the task is to raise output, grain above all; Mao on Aug. 6 on "classes, the situation, contradictions," and six times in the center group against the "go-it-alone wind" 单干风, the "reversal-of-verdicts wind" 翻案风 and the "dark wind" 黑暗风, the agenda overturned)'}
