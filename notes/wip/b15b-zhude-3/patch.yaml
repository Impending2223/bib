  - add:
      entry:
        id: cal.1963-02-19.china-leadership-5
        when: Feb. 19
        date: '1963-02-19'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, by letter, on his inspection of Guangdong 广东 and Guangxi 广西: Hainan''s 海南 Shilu iron mine 石碌铁矿, being enlarged, to be told now whether it is to export ore, which he thinks it should, in quantity; Hainan has 330,000 mu of oil palm, perhaps 400,000 this year, but China has neither the skill nor the presses for palm oil: the Ministry of Foreign Trade 外贸部 to import small presses and technical papers as samples to copy; Hainan''s many tropical crops short of hands, the Center 中央 to send more fertilizer and tractors and settle more workers, worth the cost in the one island that can grow them in quantity; Guilin 桂林, a resort visited by foreigners and returned overseas Chinese, can earn foreign exchange, and its many relics to be kept.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1865–1866. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
