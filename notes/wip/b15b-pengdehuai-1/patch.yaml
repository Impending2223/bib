      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀, on his walk: in Moscow 莫斯科 in 1955 the Soviets said they kept nothing secret from Chinese comrades; he asked to see the navy and was shown two things; a lesson to him. In the Korean War the Soviet tanks sent as aid were old, newly painted; some had shell holes stopped with putty.'
