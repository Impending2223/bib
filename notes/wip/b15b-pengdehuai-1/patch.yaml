      - '1966-12-28T00:00Z'
      time_band: early morning
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀 to the head of the guard post: papers of his taken from his safe in Sichuan 四川 by the Aeronautics Institute''s (in fact the Geology Institute''s) men and brought to Peking should be collected; he wrote to the Chairman in November (December) on the Cultural Revolution in the southwest, and the draft is with his guard Jing Xizhen 景希珍, hidden in a radio; he wants to see Chairman Mao 毛主席, Premier Zhou 周总理 or Chen Boda 陈伯达; he does not know why he has been brought to Peking, for the Cultural Revolution or old accounts; he asks for the *Renmin ribao* 《人民日报》 and the *Jiefangjun bao* 《解放军报》 daily, and for the shirts, socks and transistor radio his guard has.'
      n: '[[w.peng-dehuai-nianpu]], 798–799. The words: 早晨起床后 (on rising) (798–799). Made public: 1998. Names: Peng Dehuai, Mao Zedong, Zhou Enlai, Chen Boda.'
