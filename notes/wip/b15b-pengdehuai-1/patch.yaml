- add:
    entry:
      id: cal.1965-10-24.china-leadership-3
      when: Oct. 24
      date: '1965-10-24'
      thread: china-leadership
      c: 'The Central Party School 中央党校 sends men to Guajiatun 挂甲屯 to look into Peng Dehuai 彭德怀, and they write a report, "Some of Peng Dehuai''s activities at Guajiatun" 《彭德怀在挂甲屯的一些活动》: by small favors and a show of care, playing on the masses'' feudal backwardness, he has won over a good many; grown-ups call him "Old Peng," children "Grandpa Peng"; some say that he has done what the state could not (the electric lights), and old women vow never to forget him.'
      n: '[[w.peng-dehuai-nianpu]], 791–792. Made public: 1998. Names: Peng Dehuai.'
