      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'The manganese mine 锰矿 near Xiangtan 湘潭. The mine''s director, Zhao Qihui 赵其惠, reports to Peng Dehuai 彭德怀. To them Peng: he is a man who erred, as they know; in his letter to Mao of July 14, 1959 he wrote "gains and losses," and someone copied it "losses and gains"; now he has seen the villages, he put it too lightly.'
      n: '[[w.peng-dehuai-nianpu]], 767. The words: 晚上 (767). Made public: 1998. Names: Peng Dehuai.'
