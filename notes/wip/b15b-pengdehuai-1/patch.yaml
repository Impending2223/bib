      date: '1965-09-10'
      thread: china-leadership
      c: 'Peng Zhen 彭真 tells Qiao Mingfu 乔明甫, deputy head of the Organization Department 中共中央组织部, that he will talk with Peng Dehuai 彭德怀 the next day, with Qiao and Jia Zhen 贾震 present. Jia Zhen tells Peng to go with him to the Great Hall of the People 人民大会堂 next day: someone of the Center will talk with him.'
      n: '[[w.peng-dehuai-nianpu]], 786. Made public: 1998. Names: Peng Zhen, Peng Dehuai.'
