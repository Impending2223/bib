      c: 'The Peng Dehuai and Xi Zhongxun special case review committee 彭、习专案审查委员会, second meeting. Kang Sheng 康生: the Center is giving these men work, and some may think their cases settled; two sides to it: it makes it easier to examine their activities, so there is to be no slackening; and it shows the Party''s hope that they will turn round, which is up to them.'
      n: '[[w.peng-dehuai-nianpu]], 786. The words: 上午 (786). Made public: 1998. Names: Kang Sheng, Peng Dehuai.'
