    item: '[[w.peng-dehuai-nianpu]], 765 (Nov. 3, 1961, morning: Peng Dehuai 彭德怀 back at Pengjiaweizi 彭家围子 of the Weimin team 为民生产队, Wushi brigade 乌石大队, Wushi commune 乌石公社, Xiangtan county 湘潭县, living in his old home; he leaves Wushi Dec. 9 and Changsha 长沙 by train Dec. 24, at Peking 北京 Dec. 26)'
