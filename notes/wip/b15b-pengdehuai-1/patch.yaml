- cite:
    id: cal.1965-11-30.china-leadership-6
    item: '[[w.peng-dehuai-nianpu]], 792 (Nov. 30, 1965: Peng Dehuai 彭德怀 arrives at Chengdu 成都; Yang Pei 杨沛, deputy secretary-general of the third-front construction committee 三线建设委员会, meets him at the station and sees to his affairs; he lodges at No. 7 Yongxing Lane 永兴巷, Chunxi Road 春熙路)'
- add:
    entry:
      id: cal.1965-12.china-leadership-19
      when: Dec., early
      date: '1965-12'
      at: before 1965-12-01
      place: chengdu
      thread: china-leadership
      c: 'Chengdu 成都. Liao Zhigao 廖志高, at a meeting of Sichuan''s 四川 department and bureau heads, relays the Center''s instruction: to strengthen the southwest''s work and the third front the Center has sent Marshal Peng 彭总; he is to be respected, not looked on with old eyes; Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and Peng Zhen 彭真 all talked with him; he is to be reported to, and may read top-secret papers; nothing is to be kept from him; the Center trusts him.'
      n: '[[w.peng-dehuai-nianpu]], 792–793. Made public: 1998. Names: Peng Dehuai, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
