- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 763 (Jan. 14–18, 1961: the Ninth Plenum 中共八届九中全会 at Peking 北京 adopts the policy of "readjustment, consolidation, filling out and raising standards" 调整、巩固、充实、提高; Mao Zedong 毛泽东 speaks several times, for seeking truth from facts and investigation)'
- cite:
    id: cal.1961-03-23.china-leadership-3
    item: '[[w.peng-dehuai-nianpu]], 763 (Mar. 23, 1961: the Center''s letter to the regional bureaus and the provincial, city and autonomous-region committees on conducting investigation seriously 《关于认真进行调查研究工作问题给各中央局，各省、市、自治区党委的一封信》; then Liu Shaoqi 刘少奇 to Changsha 长沙 and Ningxiang 宁乡, Zhu De 朱德 to Sichuan 四川, Hunan 湖南 and Shaanxi 陕西, Deng Xiaoping 邓小平 and Peng Zhen 彭真 to Shunyi 顺义 and Huairou 怀柔; Peng Dehuai 彭德怀 glad of it, and wishing himself to go to the villages)'
- cite:
    id: cal.1961-06-15.china-leadership-2
    item: '[[w.peng-dehuai-nianpu]], 763–764 (June 15, 1961: the Center issues the revised draft of the Working Regulations for the Rural People''s Communes 《农村人民公社工作条例（修正草案）》, the "Sixty Articles on Agriculture" 农业六十条: the public mess halls and the supply system dropped; cadres and members wrongly criticized or punished in recent years to be screened, and wholly wronged men restored to name and post)'
- cite:
    id: cal.1961-09-15.china-leadership-2
    item: '[[w.peng-dehuai-nianpu]], 764 (Sept. 15, 1961: the Center''s directive on current industrial problems 《关于当前工业问题的指示》, made at the Lushan 庐山 work conference, on the gravity of industry''s state and the urgency of the "eight characters")'
