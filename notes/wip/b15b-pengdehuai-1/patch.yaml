      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀: he bought thousands of volumes of the Marxist-Leninist classics and Mao''s *Selected Works*, all bound sets, and in recent years studied the military writings of Marx, Engels, Lenin, Stalin and the Chairman, with notes of over thirty thousand characters; the Red Guards must not destroy them.'
      n: '[[w.peng-dehuai-nianpu]], 804. Made public: 1998. Names: Peng Dehuai, Mao Zedong, Stalin.'
