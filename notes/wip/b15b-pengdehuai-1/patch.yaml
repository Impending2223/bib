- cite:
    id: cal.1962-01-11.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 771 (Jan. 11–Feb. 7, 1962: the enlarged work conference 扩大的工作会议, the "Seven Thousand Cadres conference" 七千人大会; about it the Center rehabilitated Party members wrongly criticized in the campaigns of past years, but not Peng Dehuai 彭德怀, whose charges were raised)'
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 771 (Liu Shaoqi 刘少奇, in the written report and his speech, on Peng Dehuai 彭德怀: many of the concrete matters in his letter fitted the facts, and a Politburo member writing to the Chairman commits no error even if some of his views are wrong; but he long had a small group in the Party, took part in the Gao Gang–Rao Shushi 高岗、饶漱石 anti-Party group as a chief member, had "international backing," and carried on factional activity behind the Center''s back; all may be rehabilitated but Peng. Mao Zedong 毛泽东 interjects: "So long as it is not illicit relations with foreign countries" 里通外国)'
- add:
    entry:
      id: cal.1962-01.china-leadership-8
      when: Jan., after the 27th
      date: '1962-01'
      at: after 1962-01-27
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, having read Liu Shaoqi''s 刘少奇 speech at the work conference, telephones Yang Shangkun 杨尚昆 in anger: tell the Chairman and Liu Shaoqi that he denies it. To others: he had been calm of late, but since the speech he cannot read or sleep; he had meant to go to the old base area of the Taihang 太行山 after the spring to investigate, but cannot now, for it would embarrass his hosts.'
      n: '[[w.peng-dehuai-nianpu]], 771. Made public: 1998. Names: Peng Dehuai, Liu Shaoqi.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1962-01.china-leadership-9
      when: Jan., after the 27th
      date: '1962-01'
      at: after 1962-01-27
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 writes "On Comrade Liu Shaoqi''s written report and speech at the enlarged central work conference" 《评刘少奇同志在扩大的中央工作会议上的书面报告和讲话》: that he had a small group in the Party, and that its activities were bound up with foreigners'' subversion in China, is made of nothing; Liu''s conclusion, from motives imagined, subjective, and will be proved wrong; he has no anti-Party group and no part in any foreigner''s subversion; it slanders him.'
      n: '[[w.peng-dehuai-nianpu]], 771–772. Made public: 1998. Names: Peng Dehuai, Liu Shaoqi.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:liu-shaoqi
