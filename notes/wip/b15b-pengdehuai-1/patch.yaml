      thread: china-leadership
      c: 'Kang Sheng 康生 minutes on the four papers Peng Dehuai 彭德怀 wrote on Jan. 3–5 ("Digging out the roots of my thinking step by step," "On an error of principle I made in army-building," "On the course of setting military ranks," "Why I wrote to Chairman Mao at the Lushan meeting"): another attack on the Party; to be sent to the Chairman, Vice-Chairman Lin 林总 and the Premier.'
      n: '[[w.peng-dehuai-nianpu]], 802. Made public: 1998. Names: Kang Sheng, Peng Dehuai, Mao Zedong.'
