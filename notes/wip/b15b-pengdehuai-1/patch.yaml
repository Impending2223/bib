      id: cal.1965-12-12.china-leadership
      when: Dec. 12–26
      date: '1965-12-12'
      place: chongqing
      thread: china-leadership
      c: 'Chongqing 重庆. Peng Dehuai 彭德怀 at the political work conference of the third-front construction committee 三线建设委员会. In its course he goes to Guang''an county 广安县, sees the rammed-earth houses of Plants 338 三三八厂 and 308 三〇八厂, and to Nanchong 南充 to learn how factories lead communes, and visits the Nanchong silk works 南充丝绸厂. Near its end Li Jingquan 李井泉 comes to the meeting: "Peng Dehuai has come."'
      n: '[[w.peng-dehuai-nianpu]], 793. Made public: 1998. Names: Peng Dehuai, Li Jingquan.'
