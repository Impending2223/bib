      date: '1967-04-20'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to Zhou Enlai 周恩来, by letter: reading in the *Renmin ribao* that the Soviet revisionists sell magnesium to the American imperialists, he recalls the slag heaped and washing away on the south bank of the Dadu 大渡河 at the Shimian 石棉 asbestos mine, which he saw last April: rich in calcium and magnesium, then phosphorus, it could be made into a calcium-magnesium-phosphate fertilizer good as a base manure; a small matter, but he does not know whom else to tell.'
      n: '[[w.peng-dehuai-nianpu]], 805. Made public: 1998. Names: Peng Dehuai, Zhou Enlai.'
