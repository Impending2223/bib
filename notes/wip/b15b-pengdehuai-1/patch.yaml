      date: '1967-07-20'
      thread: china-leadership
      c: 'The case group 专案组 gives Peng Dehuai 彭德怀 an outline for a confession to be written by early August: his life before the Red Army 红军 (posts, dates, witnesses, family and means); his stand in the Party''s two-line struggles since; his chief social relations; his names, aliases and assumed names; how he joined the Party, and who can attest it.'
      n: '[[w.peng-dehuai-nianpu]], 807. Made public: 1998. Names: Peng Dehuai.'
