      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀 tells the Red Guards of the Lushan meeting 庐山会议: he trusts them and tells them all; what do they want? The Cultural Revolution is aimed at the power-holders in the Party, and he is not one; the old accounts can be settled later. May he see their big-character posters? They will think about it, they say.'
      n: '[[w.peng-dehuai-nianpu]], 799. The words: 晚上 (799). Made public: 1998. Names: Peng Dehuai.'
