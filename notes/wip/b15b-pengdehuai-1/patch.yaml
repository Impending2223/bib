- add:
    entry:
      id: cal.1960-11-18.china-leadership-9
      when: Nov. 18
      date: '1960-11-18'
      time_range:
      - '1960-11-18T04:00Z'
      - '1960-11-18T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, at the Party School committee group''s 党校党委组 discussion: since Zunyi 遵义 the Party has split and united again, uniting with Mao''s 毛泽东 line ninety percent and leaving room; the struggle with Zhang Guotao 张国焘 ended with him alone; there was no split over Wang Ming''s 王明 line; the fight against the right of 1959 began from the wish for unity; his own saying at Lushan 庐山 that fighting the "left" was harder than fighting the right was one-sided, the right being the longer task; because of that fight some places have overlooked correcting the "left."'
      n: '[[w.peng-dehuai-nianpu]], 761. The words: 下午 (761). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
      - ok:fields-place
- add:
    entry:
      id: cal.1960-11-25.china-leadership-9
      when: Nov. 25
      date: '1960-11-25'
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 writes "Notes on reading the Center''s urgent directive" 《读中共中央紧急指示的笔记》: basically good, the return of private plots and houses and the end of the "communist wind" heartening; but it keeps the public mess halls 公共食堂, born of "eating without paying," which waste the cadres'' strength, and while they stand the peasants'' zeal will not revive; it says nothing of the imbalances, boasting and coercion since 1958, and is only the start of correcting the errors. A Communist, he should put this to the Center; but after the Lushan 庐山 meeting and the Eighth Plenum 八届八中全会 it would do no good and might be misread: better to read on, and ask to be sent down to the villages to labor and investigate.'
      n: '[[w.peng-dehuai-nianpu]], 761–762. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - ok:fields-place
