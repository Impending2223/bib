      c: 'Wukesong 五棵松, Peking 北京. The Red Guards tell Peng Dehuai 彭德怀 to expose the "crimes" of Li Jingquan 李井泉, Cheng Zihua 程子华 and others of the Southwest Bureau: he does not know of any.'
      n: '[[w.peng-dehuai-nianpu]], 802. Made public: 1998. Names: Peng Dehuai, Li Jingquan.'
