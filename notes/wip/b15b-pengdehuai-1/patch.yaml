- cite:
    id: cal.1965-11-10.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 792 (Nov. 10, 1965: Shanghai''s *Wenhui bao* 《文汇报》 prints Yao Wenyuan''s 姚文元 "On the new historical play *Hai Rui Dismissed from Office*" 《评新编历史剧〈海瑞罢官〉》, which ties the play''s "returning the land" and "redressing wrongs" to the "go-it-alone wind" and the "wind of reversing verdicts," and those to Lushan 庐山 and Peng Dehuai 彭德怀)'
