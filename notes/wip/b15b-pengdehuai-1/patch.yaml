- add:
    entry:
      id: cal.1960.china-leadership-119
      when: '1960, fall'
      date: '1960'
      at: before 1960-09-22
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 turns up the fishpond''s silt, digs the ground three feet deep as the papers of 1958 prescribed, and levels a fen of land as a test plot of wheat: the claims for Xushui 徐水 in 1958 were nonsense, he says, and he would not go to see them. At its second year''s harvest the plot yields 90 jin, by which he finds a thousand jin a mu the most a mu can bear.'
      n: '[[w.peng-dehuai-nianpu]], 760. Made public: 1998. Names: Peng Dehuai.'
