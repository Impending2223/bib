      when: Mar. 4
      date: '1967-03-04'
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀, writing his papers, is told by the guard officer of airing and baths; anxious: why keep him in the army? They pretend not to know, but know it all; "Ah! never make a mistake." He asks not to be kept in the army: could he go home and farm, as he asked at Lushan 庐山? If not, back to his small room at Wujiahuayuan 吴家花园 to read, looking after himself? If not, to the Party School to study?'
      n: '[[w.peng-dehuai-nianpu]], 804. Made public: 1998. Names: Peng Dehuai.'
