- cite:
    id: cal.1966-12-24.china-leadership-2
    item: '[[w.peng-dehuai-nianpu]], 798 (Dec. 24, 1966: Zhou Enlai 周恩来 minutes on the telephone record: tell the General Staff 总参 that if he is brought to Peking it is to be by train, not by air; Zhou''s office telephones the Red Guards'' heads of the two institutes, the third-front committee and the Chengdu Military Region 成都军区: do not struggle Peng Dehuai 彭德怀 in Chengdu 成都; bring him to Peking 北京 quickly, by train, not by air, the Geology Institute''s East Is Red with the army in charge of the escort; the Premier''s office to see to all on the way, the Peking Garrison 北京卫戍区 to send troops to wait in Peking and see to his living and study)'
