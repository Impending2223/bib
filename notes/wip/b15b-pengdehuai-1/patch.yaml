      c: 'Peng Dehuai 彭德怀, by letter to the Center 中共中央, asks to go to the villages to investigate: first three months in Hunan 湖南, back to Peking 北京 for the winter, then next spring to the Taihang 太行 region; if not allowed, to retire home to farm and live by his own labor; if not that, to read.'
