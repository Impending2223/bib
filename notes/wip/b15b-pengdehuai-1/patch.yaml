      c: 'Peng Dehuai 彭德怀 drafts a letter to Mao Zedong 毛泽东: a year in the southwest; Mao had asked him to write often, but with nothing achieved he had not; with Mao''s seventy-third birthday near, his good wishes and his views on building the southwest; an account of his tours and meetings; the Southwest Bureau and the committee distrust him and fear his influence spreading: so he asks to go into farm work.'
