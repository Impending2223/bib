    entry:
      id: cal.1967-08-20.china-leadership-6
      when: Aug. 20
      date: '1967-08-20'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 finishes his confession material, an autobiography of 61,000 characters, written to the demand of the Center''s special review committee of July 20, 1967, and late, he says, for the public trials: his family (1898–1916); old-style soldiering (1916–28); the Pingjiang rising 平江起义 (July 22, 1928); the Hunan–Hubei–Jiangxi base; 1930 to June 1937, the Futian incident 富田事变 among it; the war against Japan, with the Hundred Regiments 百团大战 of the autumn of 1940; the civil war; the five campaigns in Korea; his dealings with Gao Gang 高岗; Lushan 庐山.'
      n: '[[w.peng-dehuai-nianpu]], 810–811. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
