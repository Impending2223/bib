- add:
    entry:
      id: cal.1967-02-20.china-leadership-4
      when: Feb. 20
      date: '1967-02-20'
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀: why do the Red Guards not come? Brought here so long and not dealt with; he left his work without handing it over, and the third front has a meeting in March; his letter to the Aeronautics Institute''s Red Flag 北航红旗 some days ago is unanswered. Sores on his legs, arms and buttocks, the pills of little use, his body weaker; his shorts and drawers stained with blood and pus, no change of clothes, his socks and cotton trousers in holes, no things for daily use.'
      n: '[[w.peng-dehuai-nianpu]], 803. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1967-02-23.china-leadership-8
      when: Feb. 23
      date: '1967-02-23'
      place: peking
      thread: china-leadership
      c: Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀 asks for his small radio and his clothes, to see the big-character posters, and to subscribe to *Cankao xiaoxi* 《参考消息》.
      n: '[[w.peng-dehuai-nianpu]], 803. Made public: 1998. Names: Peng Dehuai.'
