      date: '1965-11-12'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, about this time, writes of his going to the southwest''s third front to his wife, Pu Anxiu 浦安修, who lives at Peking Normal University 北京师范大学; she comes to Wujiahuayuan 吴家花园 to see him off: he is to go first, she will follow him to Chengdu 成都.'
      n: '[[w.peng-dehuai-nianpu]], 792. Made public: 1998. Names: Peng Dehuai.'
