      date: '1967-01-16'
      place: peking
      thread: china-leadership
      c: Wukesong 五棵松, Peking 北京. Peng Dehuai's 彭德怀 thighs are covered with small red sores, a patch the size of a fingertip festering; washing, he says the nervous skin disease came of the strain of commanding from tunnels on the Korean front.
      n: '[[w.peng-dehuai-nianpu]], 802. Made public: 1998. Names: Peng Dehuai.'
