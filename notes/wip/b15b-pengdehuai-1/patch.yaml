      when: July 26
      date: '1967-07-26'
      time: '1967-07-26T08:00:00Z'
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peking 北京, the south sports ground of the Peking Aeronautics Institute 北京航空学院. With the Central Cultural Revolution Group''s approval, Han Aijing 韩爱晶 holds a rally of a hundred thousand to struggle Peng Dehuai 彭德怀 and Zhang Wentian 张闻天; after it they are suddenly paraded through the streets, Peng beaten as he is put on the truck. Back at 8:15 p.m., lying down, he says to himself: beaten too badly today, his hands numb, the bones broken last time aching; they beat him with sticks and hurt his back; let them beat him to death.'
      n: '[[w.peng-dehuai-nianpu]], 808. The words: 下午4点 (4 p.m.); 晚上8点15分 (8:15 p.m.) (808). Made public: 1998. Names: Peng Dehuai.'
