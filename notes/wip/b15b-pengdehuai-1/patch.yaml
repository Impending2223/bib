      place: wushi
      thread: china-leadership
      c: 'Wushi 乌石, Xiangtan county 湘潭县. Peng Dehuai 彭德怀 breaks waste ground on the Huangni Daping 黄泥大坪 outside his old home: in the twenty-seven days of this stay he opens two mu of paddy himself, and asks the brigade to open the plain''s fifty or sixty mu of waste with the water of the Wushi reservoir 乌石水库; the brigade has done it all from 1962.'
      n: '[[w.peng-dehuai-nianpu]], 765. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - name:peng-dehuai
