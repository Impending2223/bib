      place: peking
      thread: china-leadership
      c: 'Peking 北京. Hospital 267 二六七医院 reports on Peng Dehuai''s 彭德怀 X-rays: the fifth right rib broken in mid-shaft; the end of the tenth right rib possibly cracked; a little fluid (blood) in the right chest; part of the left lower lung collapsed; senile hypertrophic spondylitis of the spine.'
      n: '[[w.peng-dehuai-nianpu]], 807. Made public: 1998. Names: Peng Dehuai.'
