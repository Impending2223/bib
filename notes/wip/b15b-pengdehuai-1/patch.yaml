    entry:
      id: cal.1967-03-10.china-leadership-8
      when: Mar. 10
      date: '1967-03-10'
      thread: china-leadership
      c: 'Kang Sheng 康生, at the conference of the army''s cadres of army rank and above 军队军以上干部会议, on Peng Dehuai 彭德怀: when Chairman Mao put forward the general line, the Great Leap and the communes in 1958, the people and most of the Party found them very good, and the anti-Party group of Peng Dehuai, Huang Kecheng 黄克诚 and Zhang Wentian 张闻天 found them "very bad"; they seized on single faults to attack Mao Zedong Thought and the Chairman''s line, representatives of the bourgeoisie; and Peng has lately written to the Chairman again to reverse the Lushan 庐山 verdict.'
      n: '[[w.peng-dehuai-nianpu]], 804. See [[cal.1967-02-26.china-leadership-3]]. Made public: 1998. Names: Kang Sheng, Peng Dehuai, Mao Zedong.'
