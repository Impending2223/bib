      c: 'Wujiahuayuan 吴家花园, Peking 北京. At the gate at dusk Peng Dehuai 彭德怀 says he will take the bus to the Zizhuyuan park 紫竹院公园; the sentry will not let him: that cuts him off from the masses, he says. And: Lushan 庐山 in 1959 was hard to bear; he spoke out at what he saw, matters that touched the Center, and as a Politburo member he bore a share of blame; the "Twelve Articles" 十二条 and the "Sixty Articles" 六十条 made him glad; he wrote to the Center asking for light labor and investigation in the villages and had no answer; he has no work and nothing to be done.'
