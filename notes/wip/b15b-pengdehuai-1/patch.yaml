- cite:
    id: cal.1960-11-03.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 760 (Nov. 3, 1960: the Center''s urgent directive letter on the rural people''s communes'' present policies 《关于农村人民公社当前政策问题的紧急指示信》, the "Twelve Articles" 十二条: three-level ownership on the production team as basic accounting unit unchanged at least seven years from 1961; the "equalization and transfer" since the communes to be repaid within 1960, by the spring plowing of 1961 at latest; small private plots and household sidelines allowed; rural markets restored)'
