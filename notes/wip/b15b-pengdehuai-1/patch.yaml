      thread: china-leadership
      c: The Center 中共中央 sets up a review committee 审查委员会 of twenty, to examine above all Peng Dehuai 彭德怀, Huang Kecheng 黄克诚 and Zhang Wentian 张闻天; it holds its first meeting the same day. Its office is at Sanzuomen 三座门.
      n: '[[w.peng-dehuai-nianpu]], 776. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - ok:fields-place
- cite:
    id: cal.1962-09-24.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 776–777 (Sept. 24–27, 1962: the Tenth Plenum 中国共产党八届十中全会 at Peking 北京, on the economy beginning to recover; Mao Zedong''s 毛泽东 speech on classes, the situation, contradictions and unity in the Party; the "anti-Party activity" of Xi Zhongxun 习仲勋 and others through the novel *Liu Zhidan* 《刘志丹》 exposed; the plenum sets up a Peng Dehuai special case committee 彭德怀专案委员会 and a Xi Zhongxun special case committee 习仲勋专案委员会 to examine them)'
- cite:
    id: cal.1962-09-24.china-leadership-3
    item: '[[w.peng-dehuai-nianpu]], 777 (the plenum sets up the Xi Zhongxun special case committee 习仲勋专案委员会 beside Peng Dehuai''s)'
