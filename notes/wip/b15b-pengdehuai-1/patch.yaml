      c: Peking 北京. The *Renmin ribao* 《人民日报》, under the head "Wage the great struggle to destroy the bourgeois headquarters utterly; settle accounts with Peng Dehuai and his backer for their crimes of usurping the Party and the army" 《展开彻底摧毁资产阶级司令部的大斗争，坚决清算彭德怀及其后台篡党篡军罪行》, reports the rally of ten thousand of the army's general departments, the Defense Science and Technology Commission and the three services' organs and colleges in Peking against Peng Dehuai 彭德怀, and meetings of soldiers and civilians all over the country; from then a high tide of criticism of Peng sweeps the country.
