      date: '1961-12-18'
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 stays in all day. To Dai Ding 戴鼎, a county committee cadre: by the ten standards of a Party member he falls short in all but one, a Communist''s duty to say all he knows; at his home in Wushi 乌石 he saw an old duck-keeper who works for himself and for the collective, and does well; this year he has seen his home, next year he will see Shanxi 山西, the year after go home for good.'
      n: '[[w.peng-dehuai-nianpu]], 768. Made public: 1998. Names: Peng Dehuai.'
