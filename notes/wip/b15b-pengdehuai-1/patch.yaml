      - '1961-12-17T04:00Z'
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 at the Heling brigade 合岭大队 again; to its cadres, on Lushan 庐山 and the fight against the right: his nature is stubborn, a peasant''s son, and he had seen the peasants'' hard life.'
      n: '[[w.peng-dehuai-nianpu]], 767–768. The words: 上午 (767–768). Made public: 1998. Names: Peng Dehuai.'
