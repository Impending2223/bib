      thread: china-leadership
      c: Peking 北京, the auditorium of the *Hongqi* 《红旗》 offices. The Central Cultural Revolution Group 中央文革小组 calls the heads of the mass organizations of all factions and of the revolutionary committees of forty-seven colleges in Peking to rouse a high tide of great criticism of Liu Shaoqi's 刘少奇 revisionist line and the handful of renegades and capitalist-roaders; Chen Boda 陈伯达, Zhang Chunqiao 张春桥, Guan Feng 关锋 and Qi Benyu 戚本禹 speak.
      n: '[[w.peng-dehuai-nianpu]], 806. Names: Liu Shaoqi, Chen Boda, Zhang Chunqiao.'
