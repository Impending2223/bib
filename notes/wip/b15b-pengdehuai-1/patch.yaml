      c: 'The case group 专案组 relays Kang Sheng''s 康生 instruction of July 23: concentrate, seize the key questions, break through and pin them down; Peng Dehuai''s 彭德怀 three: his political history, illicit relations with foreign countries, and the anti-Party group and counter-revolutionary mutiny.'
      n: '[[w.peng-dehuai-nianpu]], 808. Made public: 1998. Names: Kang Sheng, Peng Dehuai.'
