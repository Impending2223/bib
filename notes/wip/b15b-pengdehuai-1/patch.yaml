      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. The Red Guards tell Peng Dehuai 彭德怀 to write from the next day on Liu Shaoqi, Deng Xiaoping, Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun 刘、邓、彭、罗、陆、杨: he has never so much as thought of it.'
