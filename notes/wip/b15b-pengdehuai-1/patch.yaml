    entry:
      id: cal.1967-12-13.china-leadership
      when: Dec. 13
      date: '1967-12-13'
      thread: china-leadership
      c: 'The case group 专案组 relays the instructions of Kang Sheng 康生 and Jiang Qing 江青. Kang: the Center''s special cases, set up after the enlarged Politburo meeting of May 1966, have in a year and eight months done great things, dragging out the renegades from Liu Shaoqi 刘少奇 down; before the Spring Festival the chief targets are to be brought down and their cases settled, the Central Committee''s members and alternates above all. Jiang Qing: several of the chief cases can be settled before the Spring Festival.'
      n: '[[w.peng-dehuai-nianpu]], 814. Made public: 1998. Names: Kang Sheng, Jiang Qing, Liu Shaoqi.'
      tags:
      - polity:prc
