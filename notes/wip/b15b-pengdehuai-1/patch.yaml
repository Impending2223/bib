- add:
    entry:
      id: cal.1967-01-03.china-leadership-7
      when: Jan. 3
      date: '1967-01-03'
      place: peking
      thread: china-leadership
      c: 'Peking 北京. The *Renmin ribao* 《人民日报》 prints Yao Wenyuan''s 姚文元 "On the counter-revolutionary double-dealer Zhou Yang" 《评反革命两面派周扬》: with the backing of Khrushchev''s 赫鲁晓夫 revisionist group, which attacked China''s general line, the communes and the Leap at the CPSU''s Twenty-first Congress in January 1961 (so printed), the Right opportunist anti-Party group that styled itself Hai Rui 海瑞 put forward at the Lushan meeting 庐山会议 a revisionist program through and through, dreaming of overthrowing the Center headed by Mao Zedong 毛泽东.'
      n: '[[w.peng-dehuai-nianpu]], 801. Names: Yao Wenyuan, Khrushchev, Mao Zedong.'
      tags:
      - polity:prc
      - name:yao-wenyuan
      - name:khrushchev-nikita-s
      - name:mao-zedong
- add:
    entry:
      id: cal.1967-01-03.china-leadership-8
      when: Jan. 3
      date: '1967-01-03'
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀, on his sixth day in custody, reads Yao Wenyuan''s 姚文元 article on Zhou Yang 周扬, his eyes resting on the word "Khrushchev": Lushan 庐山 has become a matter of the struggle between China and the Soviet Union, and his case harder to settle. To the sentry: how well Yao''s article is written! The Red Guards set him a study note, "Digging out the roots of my thinking step by step" 《逐步来挖思想根》.'
      n: '[[w.peng-dehuai-nianpu]], 801. Made public: 1998. Names: Peng Dehuai, Yao Wenyuan, Khrushchev.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:yao-wenyuan
      - name:khrushchev-nikita-s
      follows:
      - cal.1967-01-03.china-leadership-7
