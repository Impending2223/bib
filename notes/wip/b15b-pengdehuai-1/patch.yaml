      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to Yao Wenyuan 姚文元, by letter: the Red Guards want him to state his view of the passage of the article of the 3rd on the Right opportunist anti-Party group that styled itself Hai Rui; if such propaganda does good, let it go on; if it is to keep more to the facts, he can supply some material. He writes out how he came to write to Mao at Lushan 庐山, and what the letter said.'
      n: '[[w.peng-dehuai-nianpu]], 802. Made public: 1998. Names: Peng Dehuai, Yao Wenyuan, Mao Zedong.'
