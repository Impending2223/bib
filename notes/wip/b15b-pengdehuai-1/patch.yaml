      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'The manganese mine 锰矿. Hua Guofeng 华国锋 and Zhao Chuqi 赵处琪 call on Peng Dehuai 彭德怀; after lunch they tell him of the Center''s notice of a conference of cadres from county secretaries up, to open Jan. 10. It is important, he says: go back for it.'
      n: '[[w.peng-dehuai-nianpu]], 768. The words: 中午 (back to the mine); 午饭后 (after lunch) (768). Made public: 1998. Names: Peng Dehuai, Hua Guofeng.'
