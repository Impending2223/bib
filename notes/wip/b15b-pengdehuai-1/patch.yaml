- cite:
    id: cal.1967-08-01.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 808 (Aug. 1, 1967: the *Renmin ribao* 《人民日报》 reprints the *Hongqi* 《红旗》 editorial "The proletariat must hold the gun firmly: for the fortieth anniversary of the People''s Liberation Army" 《无产阶级必须牢牢掌握枪杆子》, the first public attack on Peng Dehuai''s 彭德怀 "plot to usurp the Party and the army" and the first public charge of his "illicit relations with foreign countries")'
