      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀, to a sentry, on the merits of cremation: when he dies, let him be burned and buried under an apple tree; or his ashes kept in a box in a room with his history and a photograph, to remember those before and teach those after.'
      n: '[[w.peng-dehuai-nianpu]], 782. Made public: 1998. Names: Peng Dehuai.'
