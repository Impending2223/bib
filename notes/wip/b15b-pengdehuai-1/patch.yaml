      c: 'Wujiahuayuan 吴家花园, Peking 北京. Jia Zhen 贾震 and Li Yifei 李一非 come to see Peng Dehuai 彭德怀 off: he is leaving, he says; he had meant to call at the Party School, his six years there; he thanks them, and asks for Ai Siqi''s 艾思奇 lecture on studying Mao''s 毛泽东 "four essays."'
