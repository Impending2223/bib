      thread: china-leadership
      c: 'The Yang Shangkun case group 杨尚昆专案组 interrogates Peng Dehuai 彭德怀, who gives his three dealings with Yang Shangkun 杨尚昆: after National Day 1959, at Wujiahuayuan 吴家花园, Yang and others brought him documents; in 1962, his letter written, he asked Yang to have it printed and sent to Chairman Mao; in 1965, before leaving for the southwest, he took him documents. He is ordered to write his relations with Yang.'
      n: '[[w.peng-dehuai-nianpu]], 813. The words: 上午 (813). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
