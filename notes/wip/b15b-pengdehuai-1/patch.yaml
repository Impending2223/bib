- add:
    entry:
      id: cal.1961-11-04.china-leadership-5
      when: Nov. 4–7
      date: '1961-11-04'
      place: wushi
      thread: china-leadership
      c: 'Wushi 乌石, Xiangtan county 湘潭县. Peng Dehuai 彭德怀 receives at his home the local cadres, villagers, teachers, kin and friends who come to see him, from the nearby counties and from Changsha 长沙, some walking a hundred or two hundred li; from the afternoon of Nov. 3 to the 15th, a hundred or two a day, a thousand or two in all, until the county and commune send men to turn them back on the roads. Their chief complaints: no faith in the collective in the hard times, and calls to fix output by household and divide the land 包产到户、分田到户, which he refuses dozens of times, hoarse, for the Party''s aim was the collective road; cadres who beat people, swear and coerce, which he has his secretary note for the county committee; the hard life; the Leap 大跃进 of 1958. Before the villagers he guards Mao''s 毛泽东 prestige in all he says.'
      n: '[[w.peng-dehuai-nianpu]], 765. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc@D-H
      - name:peng-dehuai
      - name:mao-zedong
