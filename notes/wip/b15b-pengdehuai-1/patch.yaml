      when: Sept. 7
      date: '1965-09-07'
      time_range:
      - '1965-09-07T11:00Z'
      - '1965-09-07T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀, on his walk: the grain policy is bad; tax less and buy more, taking fifteen to twenty percent as tax and buying the rest, and the peasants'' zeal would revive; members with no other income could sell a little grain for cash.'
      n: '[[w.peng-dehuai-nianpu]], 786. The words: 晚上 (786). Made public: 1998. Names: Peng Dehuai.'
