      c: 'The Peking Aeronautics Institute''s "preparatory group for struggling Peng Dehuai" 北航"斗彭德怀筹备组" to Qi Benyu 戚本禹, by letter: the material he sent has come but is too abstract; with the Geology Institute they plan a small meeting on Thursday and a big one on Sunday; they ask written leave, to get material soon, without which a struggle meeting is hard to hold.'
      n: '[[w.peng-dehuai-nianpu]], 806. The nianpu''s note: the material Qi Benyu had the Peng Dehuai case group give the Red Guards of the two institutes (806 n.1). Made public: 1998. Names: Peng Dehuai.'
