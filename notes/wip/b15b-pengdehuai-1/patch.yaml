- add:
    entry:
      id: cal.1960-11-18.china-leadership-9
      when: Nov. 18
      date: '1960-11-18'
      time_range:
      - '1960-11-18T04:00Z'
      - '1960-11-18T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, at the Party School committee group''s 党校党委组 discussion: since Zunyi 遵义 the Party has split and united again, uniting with Mao''s 毛泽东 line ninety percent and leaving room; the struggle with Zhang Guotao 张国焘 ended with him alone; there was no split over Wang Ming''s 王明 line; the fight against the right of 1959 began from the wish for unity; his own saying at Lushan 庐山 that fighting the "left" was harder than fighting the right was one-sided, the right being the longer task; because of that fight some places have overlooked correcting the "left."'
      n: '[[w.peng-dehuai-nianpu]], 761. The words: 下午 (761). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
