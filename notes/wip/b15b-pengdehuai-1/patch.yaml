      when: Dec. 11
      date: '1967-12-11'
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 writes his confession, telling again in detail how in the summer of 1922 at Zhuzikou 注滋口, Nanxian 南县, Hunan, he secretly did away with a local tyrant and landlord, was arrested when it came out, escaped on the way to Changsha 长沙, failed to find a place in the Guangdong army 粤军, went home to farm, and in late July 1923 passed into the Hunan Military School 湖南陆军讲武堂.
      n: '[[w.peng-dehuai-nianpu]], 813–814. Made public: 1998. Names: Peng Dehuai.'
