- cite:
    id: cal.1962-08-22.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 775 (Aug. 22, 1962: Peng Dehuai 彭德怀, to Mao Zedong 毛泽东 and the Center 中共中央: his letter of June 16 meant only to make clear the nature of his errors; he has no "small group," no ambition to usurp the Party, no part in foreigners'' subversion; asks that a special investigation be set up, and if real evidence is found he will accept Party discipline and the law, death and expulsion included, without complaint; once it is cleared he will trouble them no more)'
- add:
    entry:
      id: cal.1962-09.china-leadership-9
      when: Sept.
      date: '1962-09'
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, by letter to Mao Zedong 毛泽东 and the Center 中共中央, on the Military Commission''s enlarged meeting 军委扩大会议 of mid-August to early September 1959 at Peking 北京: three years on the facts are plainer. The "usurping of the army" 篡军: pressed then for the organization, list, program and aims of a "military club," he said there was none, and says again he had no such ambition. The "rewriting of the army''s history" 篡改军史: his talk at a forum of the Academy of Military Science 军事科学院 on Feb. 20, 1959, printed in part by the General Political Department 总政治部 for the meeting as evidence, said too little of the Nanchang 南昌 rising, but to treat the Pingjiang 平江 rising as a signal of the tide was no plot. On Mao: his words at the Academy, that Mao is a man, with a part in history, deciding at the turning points but not the whole of history, were faulty, but no "usurping." Other charges answered one by one.'
      n: '[[w.peng-dehuai-nianpu]], 775–776. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
      - ok:fields-place
      - ok:fields-at
