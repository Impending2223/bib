      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Told by the Red Guards to write what he makes of Yao Wenyuan''s 姚文元 article on Zhou Yang 周扬, Peng Dehuai 彭德怀 refuses: Yao is free to publish, and he is free not to.'
      n: '[[w.peng-dehuai-nianpu]], 801–802. Made public: 1998. Names: Peng Dehuai, Yao Wenyuan.'
