      when: Nov. 15
      date: '1960-11-15'
      time_range:
      - '1960-11-15T04:00Z'
      - '1960-11-15T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀, at the Party School committee group''s 党校党委组 discussion of the fourth volume of Mao''s 毛泽东 *Selected Works* 毛选四卷, on fighting the "left" and the right: Mao''s speech to the Jin-Sui 晋绥 cadres corrected the "left," which he understood only after his error at Lushan 庐山; Mao corrects the "left" with care, first affirming the achievements, but strikes hard against the right, Lushan included; the "communist wind" and "equalization and transfer" not the same as his own "petty-bourgeois fanaticism"; abroad, a wrong line is not corrected without a change of leadership.'
      n: '[[w.peng-dehuai-nianpu]], 761. The words: 下午 (761). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
