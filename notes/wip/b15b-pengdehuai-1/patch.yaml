      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. The Red Guards wake Peng Dehuai 彭德怀 in his bed: write out your "military club" 军事俱乐部. He strikes the table: there is none, though they cut off his head.'
      n: '[[w.peng-dehuai-nianpu]], 802. Made public: 1998. Names: Peng Dehuai.'
