- cite:
    id: cal.1965-09-11.china-leadership-3
    item: '[[w.peng-dehuai-nianpu]], 786–787 (Sept. 11, 1965, morning: to the Great Hall of the People 人民大会堂 with Jia Zhen 贾震; Peng Zhen 彭真, for the Center: he is to go to the third front 三线 as deputy commander, Li Jingquan 李井泉 commander; Peng Dehuai 彭德怀: a Communist, he will go where sent, but no one heeds an erring man; he asks to investigate in the villages instead, having no experience; on the forty days of criticism at Yan''an 延安 and the Korean War; on the Military Commission''s charge of "mountain-stronghold" sectarianism and Liu Shaoqi''s 刘少奇 "illicit relations with foreign countries" at the conference of seven thousand; Peng Zhen: the verdict cannot be reversed; go and work in peace; Peng Dehuai: after his removal as vice-premier this is natural; let the Ninth Congress next year remove him from the Politburo)'
- add:
    entry:
      id: cal.1965-09-14.china-leadership-8
      when: Sept. 14
      date: '1965-09-14'
      time_range:
      - '1965-09-14T04:00Z'
      - '1965-09-14T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. On Peng Zhen''s 彭真 and Lin Feng''s 林枫 instructions, Jia Zhen 贾震 and Li Yifei 李一非 come to hear how Peng Dehuai 彭德怀 takes the talk of the 11th. Peng: he does not know whether his objections reached the Center; he wants to settle in a village; quick-tempered, he would not be cursed there nor curse back; give him three rooms and take away the car and staff; he fears the third front, where men work hard and he would make them uneasy: never has he been so afraid. On the "trial of strength" 较量 charge: untrue, a guess; his troops were reorganized several times without complaint, and after the grasslands he took on the remnant of ten thousand himself. He did not know Mao 毛泽东 at the Pingjiang 平江 rising, met him only in 1928, read the Gutian 古田 resolution only at Yan''an 延安, and was won over until the Yan''an rectification, crying "Long live Mao Zedong" himself. He speaks too of Khrushchev''s 赫鲁晓夫 plots, and why at Lushan he spoke of "petty-bourgeois fanaticism" rather than subjectivism.'
      n: '[[w.peng-dehuai-nianpu]], 787–788. The words: 下午 (787–788). Made public: 1998. Names: Peng Zhen, Peng Dehuai, Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-zhen
      - name:peng-dehuai
      - name:mao-zedong
      - name:khrushchev-nikita-s
- cite:
    id: cal.1965-09-24.china-leadership-6
    item: '[[w.peng-dehuai-nianpu]], 788–789 (Sept. 21, 1965, evening: Peng Dehuai 彭德怀 to Mao Zedong 毛泽东: six years since the Eighth Plenum; he has read, learned grafting and gathered farming knowledge; after the Tenth Plenum told his case was under review, he wrote to the Center only once, in March 1963, asking to live in a village, and had no answer; Peng Zhen 彭真 on the 11th gave him the Center''s decision for the southwest''s third front, which took him aback; he knows nothing of defense industry and would rather work at a smaller post, a village or a plant, but will obey whatever is decided; once it is, he asks to see Mao, or Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 or Deng Xiaoping 邓小平)'
- variant:
    id: cal.1965-09-24.china-leadership-6
    unit: A
    witness: w.peng-dehuai-nianpu
    reads: 'Sept. 21, 1965, evening: Peng writes to Mao'
    at: '788'
- cite:
    id: cal.1965-09-23.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 789–790 (Sept. 23, 1965: at 7:30 a.m. Mao''s 毛泽东 secretary telephones that the Chairman will see him at 8:30, and Peng Dehuai 彭德怀 drives to the Yinian Tang 颐年堂, Zhongnanhai 中南海; by Peng''s own record of the talk, 《毛主席谈话纪要》: Mao had not slept, glad of his letter received the afternoon before; the southwest, with the most investment and the strategic rear, is fit for him, and he may yet lead troops and recover his name; Peng''s three pledges at Lushan 庐山; Mao: "Perhaps the truth is on your side"; Deng Xiaoping 邓小平 and Peng Zhen 彭真 come, then Liu Shaoqi 刘少奇, by 8:40; Mao: a third-front headquarters under the Party''s single lead, Li Jingquan 李井泉 first, Peng second, and Cheng Zihua 程子华; Mao''s past opposition to Peng was in earnest, his support now sincere; Peng to be seen as one divided into two; his deeds from the Li Lisan line to the Northwest; it ends at 1:30 p.m., after five and a half hours)'
- add:
    entry:
      id: cal.1965-09-27.china-leadership-14
      when: Sept. 27
      date: '1965-09-27'
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to Deng Xiaoping 邓小平, by letter: he had taken it from Peng Zhen''s 彭真 talk of Sept. 11 that he was to go to the southwest as Li Jingquan''s 李井泉 assistant, chiefly on defense work, and needed to learn of defense industry''s production, the army''s equipment and advanced technology; but recalling the Chairman''s talk of the 23rd, it did not settle that he would do defense industry, so those briefings may be spared; he asks to see Deng when convenient.'
      n: '[[w.peng-dehuai-nianpu]], 790–791. Made public: 1998. Names: Peng Dehuai, Deng Xiaoping, Li Jingquan, Peng Zhen.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:deng-xiaoping
      - name:li-jingquan
      - name:peng-zhen
- cite:
    id: cal.1965-10-06.china-leadership-6
    item: '[[w.peng-dehuai-nianpu]], 791 (Oct. 6, 1965: Deng Xiaoping 邓小平 sees Peng Dehuai 彭德怀 in the Huairen Tang 怀仁堂: the meeting of the southwest''s men at the work conference the Chairman asked for must wait for Liu Shaoqi''s 刘少奇 return from the Northeast; Peng may start preparing; all are laymen at the work; in politics, mutual trust, as the Chairman said)'
- cite:
    id: cal.1965-10-19.china-leadership-6
    item: '[[w.peng-dehuai-nianpu]], 791 (printed under Oct. 6, 1965: Peng Dehuai 彭德怀 goes to Yang Shangkun''s 杨尚昆 home to ask him to see to things before he leaves)'
- variant:
    id: cal.1965-10-19.china-leadership-6
    unit: A
    witness: w.peng-dehuai-nianpu
    reads: 'Oct. 6, 1965: Peng goes to Yang Shangkun''s home on what he needs done before leaving'
    at: '791'
- cite:
    id: cal.1965-10-16.china-leadership-2
    item: '[[w.peng-dehuai-nianpu]], 791 (Oct. 16, 1965, evening: Liu Shaoqi 刘少奇 calls the southwest group, Li Jingquan 李井泉, Cheng Zihua 程子华, Li Dazhang 李大章, Jia Qiyun 贾启允, Liao Zhigao 廖志高 and Yan Hongyan 阎红彦, Deng Xiaoping 邓小平 and Peng Zhen 彭真 attending: the Center has decided to send Peng Dehuai 彭德怀 to the southwest; his past is the Center''s business, not the Southwest Bureau''s; Peng: he committed no anti-Party crime at all; Deng: he may keep his views, work well and keep his integrity to the end; after Peng leaves they settle his living, papers and briefings)'
- variant:
    id: cal.1965-10-16.china-leadership-2
