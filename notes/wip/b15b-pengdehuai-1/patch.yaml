      date: '1967-02-12'
      place: peking
      thread: china-leadership
      c: Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀, sores all over him, itching, sleeps three or four hours a night and moves with difficulty; he asks to be seen, and an army doctor examines him and gives him a little medicine.
      n: '[[w.peng-dehuai-nianpu]], 803. Made public: 1998. Names: Peng Dehuai.'
