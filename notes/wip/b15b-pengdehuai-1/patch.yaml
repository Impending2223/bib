- add:
    entry:
      id: cal.1960-01-28.china-leadership-7
      when: Jan. 28
      date: '1960-01-28'
      place: peking
      thread: china-leadership
      c: Wujiahuayuan 吴家花园, Peking 北京. Peng Zhen 彭真 and Yang Shangkun 杨尚昆 call on Peng Dehuai 彭德怀 in the Spring Festival 春节, the lunar New Year falling on Jan. 28.
      n: '[[w.peng-dehuai-nianpu]], 758. Made public: 1998. Names: Peng Zhen, Peng Dehuai. Check: the day, and Yang Shangkun''s part: the nianpu puts the call "in the Spring Festival" under Jan. 28, while Yang''s diary has him at Canton and in Hainan from Jan. 26 into February ([[cal.1960-01-28.china-leadership-5]], [[cal.1960-01-29.china-leadership-4]]).'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-zhen
      - name:peng-dehuai
- add:
    entry:
      id: cal.1960-03-01.china-leadership-10
      when: Mar. 1
      date: '1960-03-01'
      thread: china-leadership
      c: 'The Party committee of the Central Higher Party School 中央高级党校党委会 reports to the Center 中共中央 on Peng Dehuai''s 彭德怀 study 《关于彭德怀学习情况的报告》: four months at Wujiahuayuan 吴家花园; besides Mao''s 毛泽东 *On Practice* 《实践论》 and *On Contradiction* 《矛盾论》, much time on books like the Soviet *Principles of Marxist Philosophy*; by his account he has gained from it, and now sees Mao''s contribution to theory as he had not; at Lushan 庐山 he had been unhappy that Mao, an old comrade-in-arms of decades, did not talk with him face to face; he had meant to add a line to his letter to Mao of Sept. 9, 1959, offering to do what good he still could for the people, and lacked the courage. Serious in his study, the committee finds; his mood generally normal.'
      n: '[[w.peng-dehuai-nianpu]], 758–759. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
      - ok:fields-place
- add:
    entry:
      id: cal.1960-04.china-leadership-26
      when: Apr.–May
      date: '1960-04'
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 studies political economy: Marx''s *Capital* 《资本论》, vol. I; the parts on economics of the *Selected Works of Mao Zedong* 《毛泽东选集》, vols. II–IV; Stalin''s *Economic Problems of Socialism in the USSR* 《苏联社会主义经济问题》.'
      n: '[[w.peng-dehuai-nianpu]], 759. Made public: 1998. Names: Peng Dehuai, Mao Zedong, Stalin.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
      - name:stalin-joseph
- add:
    entry:
      id: cal.1960-04.china-leadership-27
      when: Apr.–May
      date: '1960-04'
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 writes "Views on the Eighth Plenum of the Eighth Central Committee" 《对八届八中全会的看法》, notes of over fifty thousand characters. Rereading in April the plenum''s resolution on the anti-Party group headed by him 《中国共产党八届八中全会关于以彭德怀同志为首的反党集团的错误的决议》 weighed on him: it departs from the facts, settles old accounts and attacks the man, and makes his letter to Mao 毛泽东 of July 14, 1959 a "Right opportunist anti-Party program." His letter''s true motive, he writes: readjustment, above all of industry against agriculture, which lagged far behind; begun in 1959, a year would have done it. Practice, he writes, has shown it was not he who erred at Lushan 庐山; there was no "military club" 军事俱乐部 and no anti-Party group. Nine questions: the Beidaihe 北戴河 meeting; the nationwide steel drive; the pace of farm growth; who opposed the communes; the economic laws of socialism and capitalism; who "exaggerated to the extreme"; old accounts; irresponsible words; his view of Khrushchev 赫鲁晓夫.'
      n: '[[w.peng-dehuai-nianpu]], 759–760. Made public: 1998. Names: Peng Dehuai, Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
      - name:khrushchev-nikita-s
