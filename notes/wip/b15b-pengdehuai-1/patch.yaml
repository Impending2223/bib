- add:
    entry:
      id: cal.1967-07-19.china-leadership-11
      when: July 19
      date: '1967-07-19'
      time: '1967-07-19T06:30:00Z'
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peking 北京, the Peking Aeronautics Institute 北京航空学院. The deputy chief of staff of the First Division 一师 and four cadres bring Peng Dehuai 彭德怀 to a classroom for a struggle meeting of some thirty: why did he oppose Chairman Mao at Lushan 庐山; why launch the Hundred Regiments 百团大战; why great-power chauvinism? Han Aijing 韩爱晶, angered by his answers, asks whether "petty-bourgeois fanaticism" in his letter was not against the Chairman; Peng says not; Han and students knock him down, beat and kick him, and a man in heavy boots stamps on his chest until he faints; held up, he signs a slip "opposed Chairman Mao," and the meeting ends. Back at 5:50, he lies unable to move; pressed by the guard officer to write a confession: if he cannot, let them kill him.'
      n: '[[w.peng-dehuai-nianpu]], 806–807. The words: 下午2点30分 (2:30 p.m.); 5点50分 (5:50) (806–807). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
- add:
    entry:
      id: cal.1967-07-20.china-leadership-17
      when: July 20
      date: '1967-07-20'
      thread: china-leadership
      c: 'A guard officer telephones the Peng Dehuai case review office 彭德怀专案审查办公室: with the Central Cultural Revolution Group''s approval and the Peking Garrison''s consent, some thirty of the Aeronautics Institute''s "Red Flag fighting team" struggled Peng at a small meeting on the afternoon of July 19, from 3; his attitude being dishonest, they struck him a few times in anger; since then his chest hurts, he breathes with difficulty, cannot cough up phlegm, does not eat or rise; the doctor, without an X-ray, thinks there may be internal injury.'
      n: '[[w.peng-dehuai-nianpu]], 807. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
