- add:
    entry:
      id: cal.1960-01.china-leadership-20
      when: Jan.–Feb.
      date: '1960-01'
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀, from October 1959 to February 1960, studies philosophy: Yang Xianzhen''s 杨献珍 *What Is Materialism?* 《什么是唯物主义》, Ai Siqi''s 艾思奇 *Outline of Dialectical Materialism* 《辩证唯物主义纲要》, the Soviet *Principles of Marxist Philosophy* 《马克思主义哲学原理》, Engels''s *Ludwig Feuerbach and the End of Classical German Philosophy* 《费尔巴哈与德国古典哲学的终结》, Lenin''s *Materialism and Empirio-criticism* 《唯物主义与经验批判主义》; notes on his reading of nearly sixty thousand characters. Once or twice a week to the Party School 党校, to the philosophy and political economy study meetings of its Party committee members'' group 党校党委成员组.'
      n: '[[w.peng-dehuai-nianpu]], 758. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- cite:
    id: cal.1960-01-22.china-leadership-7
    item: '[[w.peng-dehuai-nianpu]], 758 (Jan. 22–Feb. 27, 1960: the enlarged meeting of the Military Commission 中央军委扩大会议 at Canton 广州; Lin Biao 林彪 in his speech calls for the army to carry further the struggle to eliminate the influence of the bourgeois military line of Peng and Huang 肃清彭、黄资产阶级军事路线影响的斗争)'
