      when: Feb. 24
      date: '1967-02-24'
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. A doctor finds neurodermatitis. Peng Dehuai 彭德怀 to him: the plank bed will not let him turn; why does the disease not heal? Kept every day in a room of twelve square meters and never let out to walk: it is unreasonable; his resistance is low.'
      n: '[[w.peng-dehuai-nianpu]], 803. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1967-02-25.china-leadership-7
      when: Feb. 25
      date: '1967-02-25'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 to Zhou Enlai 周恩来, by letter: seized at midnight of Dec. 22 at his Chengdu 成都 lodging by Red Guards of the Aeronautics and Geology Institutes and brought to Peking 北京, two months ago; questioned on Lushan 庐山 in the first half of January, he would not discuss it and abides by the Center''s decision; whether he is rehabilitated is for the Center, and he has asked no one for it; he had no subversion with any foreigner, no small group, and no "military club," of which there is neither program nor witness nor accuser; since Jan. 31 no Red Guards; now held by a unit of the army; he reads only the *Selected Works*, the *Quotations* and the *Renmin ribao*; no walks outside, only up and down twelve square meters, no sun, but a stove, and meals brought: all very good.'
      n: '[[w.peng-dehuai-nianpu]], 803–804. Made public: 1998. Names: Peng Dehuai, Zhou Enlai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:zhou-enlai
