      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀, in a note on reading Mao''s 毛泽东 works: a Communist should report things as they are, yet those who do so faithfully are often struck down, and the flatterers and pretenders rewarded.'
