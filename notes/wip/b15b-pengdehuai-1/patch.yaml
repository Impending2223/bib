- cite:
    id: cal.1967-01-01.china-leadership
    item: '[[w.peng-dehuai-nianpu]], 800 (Jan. 1, 1967: the *Renmin ribao* 《人民日报》 and *Hongqi* 《红旗》 New Year editorial, "Carry the Great Proletarian Cultural Revolution through to the end" 《把无产阶级文化大革命进行到底》: from October 1965 the criticism of *Hai Rui Dismissed from Office* 《海瑞罢官》, set going by Chairman Mao himself, prepared opinion for the movement)'
- add:
    entry:
      id: cal.1967-01-01.china-leadership-13
      when: Jan. 1
      date: '1967-01-01'
      time_range:
      - '1967-01-01T04:00Z'
      - '1967-01-01T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. A Red Guard 红卫兵 comes in: such as Peng Dehuai 彭德怀 must be met with force; if he tries to reverse his verdict he will be killed on the spot. Peng: he will not, not even were Chairman Mao gone; at sixty-nine he does not fear death.'
      n: '[[w.peng-dehuai-nianpu]], 800. The words: 下午 (800). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
- add:
    entry:
      id: cal.1967-01-01.china-leadership-14
      when: Jan. 1
      date: '1967-01-01'
      time_range:
      - '1967-01-01T11:00Z'
      - '1967-01-01T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Two Red Guards 红卫兵 search Peng Dehuai''s 彭德怀 things, burn his tobacco and pipe, take his tea and medicine, and say they would like to dig a pit and bury him. "Good: I''ll cheer you, long live," says Peng; one kicks him: what right has he to cry long live? He is to write a study note every day.'
      n: '[[w.peng-dehuai-nianpu]], 800. The words: 晚饭后 (after supper) (800). Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      follows:
      - cal.1967-01-01.china-leadership-13
- add:
    entry:
      id: cal.1967-01-01.china-leadership-15
      when: Jan. 1
      date: '1967-01-01'
      time_range:
      - '1967-01-01T11:00Z'
      - '1967-01-01T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀 slips a note into his notebook and whispers to the sentry: he has written to Chairman Mao 毛主席; the Red Guards must not know; let the platoon leader send it up. The letter: sent to the third-front committee, he had held no post but its third deputy directorship, and failed Mao''s hopes; seized on the night of Dec. 22 at his Chengdu 成都 lodging by Red Guards of the Peking Aeronautics Institute, handed on the 23rd to the Geology Institute''s East Is Red, brought to Peking on the 27th, now held by the Center''s guard troops; a last salute, and long life.'
      n: '[[w.peng-dehuai-nianpu]], 800. The words: 晚上 (800). Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
- add:
    entry:
      id: cal.1967-01-01.china-leadership-16
      when: Jan. 1
      date: '1967-01-01'
      place: peking
      thread: china-leadership
      c: 'Wukesong 五棵松, Peking 北京. Peng Dehuai 彭德怀 in "My diary" 《我的日记》: on New Year''s Day 1967 he finds himself seized at Chengdu 成都 by revolutionary mass organizations and brought to Peking 北京 for trial; ten days gone, and no charge yet named; the first time in his sixty-nine years.'
      n: '[[w.peng-dehuai-nianpu]], 801. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
