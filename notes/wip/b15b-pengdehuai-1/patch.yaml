      thread: china-leadership
      c: 'Qi Benyu''s 戚本禹 office telephones the head of the Peking Geology Institute''s revolutionary committee 北京地质学院革委会: Qi has directed that Peng Dehuai 彭德怀 be handed over to the Geology Institute and the Peking Aeronautics Institute 北京航空学院 to be struggled jointly; they are to settle the time with the Peking Garrison''s commander; the Central Cultural Revolution Group will supply the material.'
      n: '[[w.peng-dehuai-nianpu]], 806. Made public: 1998. Names: Peng Dehuai.'
