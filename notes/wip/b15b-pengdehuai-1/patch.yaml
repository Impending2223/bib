      - '1961-12-14T14:00Z'
      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'The manganese mine 锰矿. Peng Dehuai 彭德怀 receives a dozen of the mine''s leading cadres. On the villages: collectivization (the mess halls and the like) was not wrong in itself but premature; the communes are what the masses wanted, and good, but began too big and are now back to the advanced cooperative: could it not have waited a few years?'
      n: '[[w.peng-dehuai-nianpu]], 767. The words: 晚上 (767). Made public: 1998. Names: Peng Dehuai.'
