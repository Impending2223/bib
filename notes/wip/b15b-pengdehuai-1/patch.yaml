- add:
    entry:
      id: cal.1965-07-07.china-leadership-5
      when: July 7
      date: '1965-07-07'
      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. On He Long''s 贺龙 and Kang Sheng''s 康生 instructions, the Central Party School 中央党校 sends its vice-presidents Jia Zhen 贾震, Li Yifei 李一非 and Yang Changchun 杨长春 to talk with Peng Dehuai 彭德怀. He tells them of his study of Lenin in the Central Soviet Area 中央苏区, of Mao''s *On Contradiction* and *On Practice* at Yan''an 延安, and of Stalin''s *Economic Problems* at Wujiahuayuan; his letter at Lushan 庐山 need not have been written, for the Chairman would have corrected matters, yet being who he is he could not but write it. He has no complaint of Lushan, but two charges he will not accept: subversion with foreigners (if any treason is found, let him be dealt with by the law, he says, striking the tea table with both hands) and a faction, which he never had nor thought of. Six idle years sit on his conscience; at sixty-seven and well he can live ten years more. Until the Tenth Plenum he had the Center''s papers, and liked *Jingji xiaoxi* 《经济消息》 best; since, nothing, and no Party life: he is like a man who has left the Party. He will not kill himself like Gao Gang 高岗. He wants to go to the villages of the Yunnan 云南 or Guizhou 贵州 hills to labor and investigate at the grass roots; here the villagers call him "Old Peng," the children "Grandpa Peng." Let them tell the Center and Yang Shangkun 杨尚昆; if the Center will not have it, a move elsewhere; if he must stay, withdraw his staff and car, and leave him a gatekeeper and three rooms.'
      n: '[[w.peng-dehuai-nianpu]], 785–786. Made public: 1998. Names: He Long, Kang Sheng, Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:he-long
      - name:kang-sheng
      - name:peng-dehuai
      - name:mao-zedong
