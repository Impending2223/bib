      c: Peng Dehuai 彭德怀 begins writing his appeal to Mao Zedong 毛泽东 and the Center 中共中央 on the charges of "illicit relations with foreign countries" 里通外国, the "small group" 小集团 and his "history" 历史.
      n: '[[w.peng-dehuai-nianpu]], 772. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
- cite:
    id: cal.1962-06-16.china-leadership-2
    item: '[[w.peng-dehuai-nianpu]], 772–775 (June 16, 1962: Peng Dehuai 彭德怀 finishes the letter to "the Chairman and the Center" 主席并中央, the "eighty-thousand-character letter" 八万言书, written because of Liu Shaoqi''s 刘少奇 report and speech at the January conference, to ask the Center to clear up his case by the facts, not to attack the leaders or plot against the Party; its five parts: Lushan 庐山, his talks there with Zhou Xiaozhou 周小舟 and Zhang Wentian 张闻天 and why he wrote to Mao on July 14, 1959, and the "military club" 军事俱乐部, which he would not invent; Gao Gang 高岗 and the "Gao–Rao alliance"; his ten contacts with foreigners, above all the tour of eight East European countries before Lushan; his history, merits and errors, and "great-power chauvinism" in Korea; the "bourgeois military line" charged at the Military Commission''s enlarged meeting of October 1960, answered under army-building, the command system, strategy and the militia)'
- cite:
    id: cal.1962-06-18.china-leadership-4
    item: '[[w.peng-dehuai-nianpu]], 775 (printed under June 16, 1962: Peng Dehuai 彭德怀 goes to Zhongnanhai 中南海 and hands the long letter to Yang Shangkun 杨尚昆 himself, with a short note asking that copies be printed for the central leaders, the letter being long and hastily written; Yang has it printed and sent to Mao Zedong 毛泽东 and the Politburo''s members)'
- variant:
    id: cal.1962-06-18.china-leadership-4
    unit: B
    witness: w.peng-dehuai-nianpu
    reads: 'June 16, 1962: Peng goes to Zhongnanhai and hands the long letter to Yang Shangkun'
    at: '775'
- add:
    entry:
      id: cal.1962-07.china-leadership-16
      when: July, end
      date: '1962-07'
      at: before 1962-07-21
      place: peking
      thread: china-leadership
      c: Wujiahuayuan 吴家花园, Peking 北京, in the heaviest rain the Peking 北京 region has seen since 1949. Before dawn one day Peng Dehuai 彭德怀 runs through the rain to the villager Lu Xing's 卢兴 house, whose two old rooms leak badly, and urges the family to stay with him; they will not, and he has the guards bring reed mats and goes up to cover the roof. He goes house to house, brings the families in danger into Wujiahuayuan, and hands each of them a bowl of ginger soup.
      n: '[[w.peng-dehuai-nianpu]], 775. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - name:peng-dehuai
      - ok:fields-time
