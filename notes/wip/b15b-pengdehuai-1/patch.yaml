      c: 'The Center 中共中央 issues its notice on marking Army Day 八一建军节: to criticize the bourgeois military line, expose its makers'' collusion with the Party''s top capitalist-roader, and their plotting, under his backing and direction, to usurp the Party and the army, carrying the great criticism a stage further; its seventh article: the Eighth Plenum''s resolution on the anti-Party group headed by Peng Dehuai 彭德怀 《中国共产党八届八中全会关于以彭德怀为首的反党集团的决议》 to be published.'
