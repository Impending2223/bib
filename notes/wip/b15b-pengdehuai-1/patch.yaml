      thread: china-leadership
      c: 'Luodaozhuang 罗道庄, Peking 北京. Peng Dehuai 彭德怀 to the heads of the unit, by letter: he puts a great burden on them and is ashamed; two men on duty day and night, and he suggests one; they are busy with work, production and study, and he could do a little light labor.'
      n: '[[w.peng-dehuai-nianpu]], 805. Made public: 1998. Names: Peng Dehuai.'
