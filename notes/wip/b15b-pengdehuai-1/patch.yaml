      thread: china-leadership
      c: 'Wushi 乌石. The Weimin team 为民生产队 holds a members'' meeting at Peng Dehuai''s 彭德怀 house to thank him for his investment. No thanks are due, he says: some of his own family are members, and he has a share in it.'
