      date: '1967-07-18'
      place: peking
      thread: china-leadership
      c: 'Peking 北京. A guard officer of the Peking Garrison 北京卫戍区 goes to the Aeronautics Institute and gives Han Aijing 韩爱晶 Zhou Enlai''s 周恩来 instruction, to be passed on to the meeting: Peng Dehuai 彭德怀 may be criticized, but no "jet plane," no forced confessions believed, no parading in the streets; struggle by words, not by force.'
      n: '[[w.peng-dehuai-nianpu]], 806. Made public: 1998. Names: Zhou Enlai, Peng Dehuai.'
