      place: peking
      thread: china-leadership
      c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 asks to see the films *Huaishuzhuang* 《槐树庄》 and *Li Shuangshuang* 《李双双》: a good film; collectivization is the road all must take, and farming alone, without machines, is weak; but the individual economy was ended rather early, for China''s villages had farmed alone for thousands of years; collectives still plow with oxen and mules, and output cannot rise much nor stand a natural disaster while farm machinery is so far behind.'
      n: '[[w.peng-dehuai-nianpu]], 777. Made public: 1998. Names: Peng Dehuai.'
