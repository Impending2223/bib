- add:
    entry:
      id: cal.1965-01.vietnam-hanoi-2
      when: Jan.
      date: '1965-01'
      thread: vietnam-hanoi
      c: 'The National Defense Council, Hồ Chí Minh presiding, sets the course of defense work in the North: defense, order and combat readiness raised; armed forces of main force, regional troops, militia, self-defense and reserves built strong enough to beat the Americans; economy and defense joined, the country''s economic and defense potential enlarged.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378. Made public: 2013. Names: Hồ Chí Minh.'
      tags: [polity:drv, vis:only:drv, name:ho-chi-minh]
- add:
    entry:
      id: cal.1965-04-10.vietnam-hanoi
      when: Apr. 10
      date: '1965-04-10'
      thread: vietnam-hanoi
      c: 'The National Assembly''s resolution: in wartime its Standing Committee to decide the state plan, approve the budget and its accounts, fix taxes, approve the boundaries of provinces, and call the Assembly when it cannot meet in regular session. Hồ Chí Minh, at the Assembly, restates the Government''s position: "Nước Việt Nam là một, dân tộc Việt Nam là một" (Vietnam is one, the Vietnamese people are one).'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 348 (the resolution); [[w.lich-su-khang-chien-chong-my]], V, 323 (Hồ Chí Minh, from his *Toàn tập*, XIV, 532). Names: Hồ Chí Minh.'
      tags: [polity:drv, name:ho-chi-minh]
- add:
    entry:
      id: cal.1965-04-20.vietnam-hanoi
      when: Apr. 20
      date: '1965-04-20'
      thread: vietnam-hanoi
      c: 'The National Assembly, the Third Assembly''s second session, passes amendments to the Military Service Law: service with the colors lengthened as the fighting requires.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1965-04-21.vietnam-hanoi
      when: Apr. 21
      date: '1965-04-21'
      thread: vietnam-hanoi
      c: 'The National Assembly''s Standing Committee decides a partial mobilization, its decision no. 102-NQ/TVQH.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378–79 (the decision named in Hồ Chí Minh''s order of May 5). See [[cal.1965-04-20.vietnam-hanoi]].'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1965-04-26.vietnam-hanoi
      when: Apr. 26
      date: '1965-04-26'
      thread: vietnam-hanoi
      also: [vietnam-air-war]
      c: 'The Central Military Party Committee forms a Transport Department under the army''s General Logistics Department; military transport in the North reorganized and enlarged.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 430. Made public: 2013.'
      tags: [polity:drv, vis:only:drv]
- add:
    entry:
      id: cal.1965-05-02.vietnam-hanoi
      when: May 2–6
      date: '1965-05-02'
      thread: vietnam-hanoi
      also: [vietnam]
      c: 'Lò Gò, northwest Tây Ninh. The first congress of heroes and emulation fighters of the southern liberation armed forces. The Liberation Front''s Central Committee launches the emulation drive "Quyết chiến, quyết thắng giặc Mỹ" (resolved to fight and beat the Americans); Nguyễn Chí Thanh, of the Politburo, deputy secretary of the Central Military Party Committee: fight the Americans and the way to beat them will be found.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 45. Names: Nguyễn Chí Thanh.'
      tags: [polity:drv, name:nguyen-chi-thanh, province:tay-ninh]
- add:
    entry:
      id: cal.1965-05-05.vietnam-hanoi-2
      when: May 5
      date: '1965-05-05'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh signs order no. 47-LCT, the partial mobilization: part of the reserve officers, noncommissioned officers and men, and part of the army''s reservists not yet served, called up. The Government Council to plan it, defense raised as far as needed, the economy kept to the state plan.'
      n: '*Lệnh của Chủ tịch nước Việt Nam Dân chủ Cộng hòa*, no. 47-LCT, Hanoi, May 5, 1965, printed in [[w.lich-su-khang-chien-chong-my]], IV, 379. See [[cal.1965-04-21.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags: [polity:drv, name:ho-chi-minh]
- add:
    entry:
      id: cal.1965-06-21.vietnam-hanoi
      when: June 21
      date: '1965-06-21'
      thread: vietnam-hanoi
      also: [vietnam-air-war]
      c: 'The Prime Minister''s directive no. 71-TTg formally sets up the youth shock force against the Americans, its units held centrally, the young of the North sent to the transport front on the main routes.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 423.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1965-06-30.vietnam-hanoi
      when: June 30
      date: '1965-06-30'
      thread: vietnam-hanoi
      also: [vietnam-air-war]
      c: 'The Government Council''s decision on transport: every branch and level to take it as the central task of the Party and the Government.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 423.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1965-08-05.vietnam-hanoi-2
      when: Aug. 5
      date: '1965-08-05'
      thread: vietnam-hanoi
      c: 'The Prime Minister''s directive on education: the schools turned to serve the political task, each in its own work, as the new situation requires.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 365.'
      tags: [polity:drv]
- add:
    entry:
      id: cal.1965-08.vietnam-hanoi
      when: Aug.
      date: '1965-08'
      thread: vietnam-hanoi
      also: [vietnam]
      c: 'COSVN''s Standing Committee, its resolution: destroy and break up the Saigon army on a large scale, its main force above all; ring the American bases, destroying and wearing down the Americans.'
      n: '*Nghị quyết Thường vụ Trung ương Cục*, August 1965 (a copy in the Military History Institute), quoted in [[w.lich-su-khang-chien-chong-my]], IV, 61 and n.2. Made public: 2013. Check: the day; the history gives the month.'
      tags: [polity:drv, vis:only:drv]
- add:
    entry:
      id: cal.1965-09-02.vietnam-hanoi
      when: Sept. 2
      date: '1965-09-02'
      thread: vietnam-hanoi
      also: [vietnam]
      c: 'The Liberation Army''s 3d and 9th Infantry Divisions formed, in the South.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 37 n.1 (five divisions formed in 1965; the southern main force, eleven regiments and fifteen battalions in 1964, five divisions and eleven regiments by the year''s end, 37). Made public: 2013.'
      tags: [polity:drv, vis:only:drv]
- add:
    entry:
      id: cal.1965-09-20.vietnam-hanoi
      when: Sept. 20
      date: '1965-09-20'
      thread: vietnam-hanoi
      also: [vietnam]
      c: 'The Liberation Army''s 2d Infantry Division formed, in the South.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 37 n.1. Made public: 2013. See [[cal.1965-09-02.vietnam-hanoi]].'
      tags: [polity:drv, vis:only:drv]
- add:
    entry:
      id: cal.1965-10.vietnam-hanoi
      when: Oct.
      date: '1965-10'
      thread: vietnam-hanoi
      also: [vietnam-air-war]
      c: 'The Politburo''s resolution on securing transport in the new situation: the whole people roused to keep the roads open; the professional transport forces the core, the army''s engineers, logistics, transport and air defense the shock troops.'
      n: '*Nghị quyết Về công tác bảo đảm giao thông vận tải trong tình hình mới*, October 1965, quoted in [[w.lich-su-khang-chien-chong-my]], IV, 424. Made public: 2013. Check: the day.'
      tags: [polity:drv, vis:only:drv]
- add:
    entry:
      id: cal.1965-10.vietnam-hanoi-2
      when: Oct.
      date: '1965-10'
      thread: vietnam-hanoi
      also: [vietnam-air-war]
      c: 'The Government Council sets up the Central Transport Coordination Board, Phạm Hùng, of the Politburo, Deputy Prime Minister, at its head.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 426. Check: the day. Names: Phạm Hùng.'
      tags: [polity:drv]
