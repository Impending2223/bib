- cite:
    id: cal.1966-05.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 620 (the Center''s North China Bureau meeting at the Qianmen Hotel 前門飯店, Peking, opens May 21, 146 of Inner Mongolia''s Party, government
      and army leaders attending; Ulanfu 烏蘭夫 labelled a "three-anti element" with the error of "national splitting"; the verdict Liu Shaoqi''s and Deng Xiaoping''s, Mao''s part not known)'
