      when: Jan., after the 19th
      date: 1968-01
      at: after 1968-01-19
      thread: china-leadership
      c: 'The Center''s leaders, on the Kunming Military Region''s report: agreed, firmly block the Eighth Work Regiment''s return, urge it to lay down its arms and hand over the bad
        heads who seized guns and killed on the way.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 620. Made public: 1999. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88). Check: the
        day (between the reports of Jan. 19 and the attack of Jan. 27, by the page''s order).'
