- add:
    entry:
      id: cal.1968-01-21.china-leadership-2
      when: Jan. 21
      date: '1968-01-21'
      thread: china-leadership
      c: 'The Center''s meeting on the Yunnan 雲南 question. Kang Sheng 康生: the Eighth Work Regiment has formed a "West Yunnan Advance Column" and killed army representatives. Xie Fuzhi
        謝富治: Zhao Jianmin 趙健民 directs the "Cannon faction"''s fighting from Peking 北京. Zhao denies it; Kang: "by my forty years'' revolutionary experience ... I see you are a traitor!"
        Xie announces the Center''s decision to hold Zhao for examination; soldiers take him away. Held 2,089 days and nights.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 620. Made public: 1999. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88). Names: Kang
        Sheng, Xie Fuzhi.'
      src:
        c: 4550388a
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 620: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:kang-sheng
      - name:xie-fuzhi
      - ok:fields-place
