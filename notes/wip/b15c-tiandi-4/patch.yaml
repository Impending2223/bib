      when: May 20
      date: '1968-05-20'
      thread: china-leadership
      c: 'The Guangxi 廣西 Region''s revolutionary preparatory group 自治區革籌小組 and the Guangxi Military District 廣西軍區 direct the sub-districts and revolutionary committees to go on breaking
        the "Guangxi branch of the Anti-Communist National Salvation Corps" 反共救國團廣西分團: the case to be fought as a campaign.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 617. Made public: 1990. To check: [[w.guangxi-wenge-dashi-nianbiao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 617 n.84).'
      src:
        c: 83dc9427
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 617: all'
