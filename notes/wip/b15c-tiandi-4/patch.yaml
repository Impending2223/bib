- cite:
    id: cal.1966-08-31.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 665 (evening of Aug. 29: Gao Fuxing 高福興, the commune head, and Hu Defu 胡德福, secretary of its Youth League committee, with the backing
      of Zhang of the county police, hold a secret meeting of the main cadres of the commune''s 17 brigades; the "nine-man group" (with Li Ziyong 李自永 and Li Guanqing 李冠清, deputy secretaries)
      sets the plan; Hu: one action at 10:30 p.m. on the 31st, each brigade to choose "the worst" or "a clean sweep"; an oath of secrecy; He Yunxi 賀雲喜, the commune secretary, of landlord
      origin, held by the group)'
