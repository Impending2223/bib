      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 617. Made public: 1990. To check: [[w.guangxi-wenge-dashi-nianbiao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 617 n.84).'
