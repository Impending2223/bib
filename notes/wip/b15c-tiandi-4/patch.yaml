      place: hohhot
      thread: china-leadership
      c: 'Hohhot 呼和浩特, the stadium. The Inner Mongolia revolutionary committee''s mass rally urges the "new Inner Mongolian People''s Party" members to give themselves up and register:
        "leniency to those who confess, severity to those who resist," by a set day.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 622.'
