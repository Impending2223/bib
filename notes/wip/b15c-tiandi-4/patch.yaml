      when: Dec., after the 8th
      date: 1968-12
      at: after 1968-12-08
      place: shadian
      thread: china-leadership
      c: 'Shadian 沙甸. The army propaganda team searches house by house for the outside "Cannon faction" men, labels them the "South Yunnan Advance Column" 滇南挺進縱隊 and hands them to their
        units'' militia; it holds over 200 Hui for beating and struggle, 84 called "black generals against the army," 14 die; it quarters itself in the Great Mosque, closes it again,
        eats pork in it, and makes religion the line: worship and fasting a ground for struggle.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 679. To check: Zhou Kang 周康, 〈駭人聽聞的雲南沙甸慘案〉, *Yanhuang chunqiu* 《炎黃春秋》, 2007, no. 7 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 678 n.20).
