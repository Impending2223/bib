      when: Aug. 12
      date: '1968-08-12'
      place: canton
      thread: china-leadership
      c: Canton 廣州. The Canton Red Guard Congress 廣州紅代會 decides to clear out Wu Chuanbin 武傳斌 and Lin Fan 林凡, head of the Canton Medical College's "Red Flag" and a standing member of
        the Congress and deputy head of its core group.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 618.'
