- add:
    entry:
      id: cal.1964.china-leadership-31
      when: '1964'
      date: '1964'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: With Zhou Enlai's 周恩來 approval, Yunnan 雲南 builds a national defense road 國防公路 to supply Vietnam 越南; 17,000 young laborers drawn from Shandong 山東 and Henan 河南 in five work regiments,
        the Shandong men in the "Seventh" and "Eighth Work Regiments" 工七團, 工八團, promised "a send-off to those who go, a welcome to those who stay"; Zhao Jianmin 趙健民, provincial Party
        secretary, in charge of aid to Vietnam and of the laborers.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 619. Made public: 1999. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88). Names: Zhou
        Enlai.'
      src:
        c: 9281d6a8
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 619: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:zhou-enlai
