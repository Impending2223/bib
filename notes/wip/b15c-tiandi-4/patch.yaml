      when: July 30
      date: '1968-07-30'
      thread: china-leadership
      c: 'The Guangdong 廣東 revolutionary committee''s plenary session opens (to July 31): Wu Chuanbin 武傳斌 struggled and ordered to account for the "Anti-Communist National Salvation
        Corps," for his ties to "Wang, Guan and Qi" 王、關、戚 (Wang Li, Guan Feng, Qi Benyu), and for "seizing the handful in the army."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 618. Made public: 2016.'
      src:
        c: 0697d718
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 618: all'
