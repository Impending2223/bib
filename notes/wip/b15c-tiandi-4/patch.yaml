      thread: china-leadership
      c: The *Zhongda zhanbao* 中大戰報 and the "Wei'erhong" 衛二紅 fighting group of the Zhongshan University 中山大學 Revolutionary Rebel Committee print "Record of the crimes of the counter-revolutionary
        little bedbug Wu Chuanbin" 反革命小臭蟲武傳斌罪行錄.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 618.'
      src:
