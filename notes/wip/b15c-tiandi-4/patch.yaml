      when: June 17
      date: '1968-06-17'
      thread: china-leadership
      c: 'The Guangxi preparatory group and the Guangxi Military District 廣西軍區 issue the "Announcement on breaking the counter-revolutionary case of the ''Guangxi branch of the Anti-Communist
        National Salvation Corps of the Republic of China''" (the "June 17 Announcement" 6.17公告): the "proletarian revolutionaries" to rise at once and wipe it out.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 617–618 (the region-wide denunciations after it, II, 618). To check: [[w.guangxi-wenge-dashi-nianbiao]] (cited by [[w.yang-jisheng-tiandi-fanfu]],
        II, 617 n.84).'
      src:
        c: 3b61c382
