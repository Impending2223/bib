      when: Jan. 16
      date: '1968-01-16'
      place: xiaguan
      thread: china-leadership
      c: 'Xiaguan 下關. Armed fight between the "Eight faction" 八派 and the "Cannon faction" 炮派, Li Guozhen 李國貞 a deputy commander, over 300 of the Eighth Work Regiment in it: 104 dead
        (77 of the "Eight faction," 27 of the "Cannon faction").'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 619. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88).'
      src:
        c: '67929743'
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 619: all'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1968-01-19.china-leadership
      when: Jan. 19
      date: '1968-01-19'
      thread: china-leadership
      c: 'The garrison at Xiaguan 下關 that backs the "Eight faction" reports to the Kunming Military Region 昆明軍區: part of the Eighth Work Regiment, under capitalist roaders and bad men,
        has formed a "West Yunnan Advance Detachment" 滇西挺進隊, gone 450 kilometers west fully armed and taken many towns, killing army representatives and others.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 619. Made public: 1999. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88).'
