      id: cal.1968-01-27.china-leadership-3
      when: Jan. 27
      date: '1968-01-27'
      thread: china-leadership
      c: 'Troops surround and attack the Eighth Work Regiment 工八團 on its way back to Kunming 昆明: nearly 200 killed on the spot, over 100 taken and bound.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 620. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88).'
      src:
        c: 6ef7835f
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 620: all'
      tags:
      - polity:prc
      - ok:fields-place
- cite:
    id: cal.1966-05.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 620 (the Center''s North China Bureau meeting at the Qianmen Hotel 前門飯店, Peking, opens May 21, 146 of Inner Mongolia''s Party, government
      and army leaders attending; Ulanfu 烏蘭夫 labelled a "three-anti element" with the error of "national splitting"; the verdict Liu Shaoqi''s and Deng Xiaoping''s, Mao''s part not known)'
- cite:
    id: cal.1966-08-16.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 620 (the Center strips Ulanfu of all his posts and holds him in Peking)'
- cite:
    id: cal.1967.china-leadership-54
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 620–621 (May 1967, after the North China Bureau meeting: the Inner Mongolia Military Region made a provincial military district; Teng
      Haiqing 滕海清, deputy commander of the Peking Military Region, its acting commander; military control of the region''s and the leagues'' and banners'' public security)'
- cite:
