- cite:
    id: cal.1968-05-17.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 616–617 (63 seized, among them the corps'' head, deputy heads and political department chief; its programme, seals, secret addresses for
      foreign agencies and some arms taken; Nanning city and the Nanning, Yulin, Qinzhou and Liuzhou prefectures; "2,000 bandits" across the region; "merged and named" Feb. 3, 1968,
      as the report has it; ties with Vietnamese overseas Chinese)'
