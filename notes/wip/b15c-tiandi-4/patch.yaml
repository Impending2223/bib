      when: Aug. 7
      date: '1968-08-07'
      thread: china-leadership
      c: 'The Guangdong 廣東 revolutionary committee''s second enlarged plenary session opens (to Aug. 8): Wu Chuanbin 武傳斌, Mo Jingwei 莫競偉, Liu Jifa 劉繼發, Gao Xiang 高翔, Lin Changwen 林昌文
        and Qiu Xueke 丘學科, heads of the "Flag faction" 旗派, ordered to account.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 618. Made public: 2016.'
