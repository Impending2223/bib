      id: cal.1968-07.china-leadership-11
      when: July
      date: 1968-07
      thread: china-leadership
      c: 'The Inner Mongolia 內蒙古 revolutionary committee, Teng Haiqing 滕海清 at its head, finds the "Inner Mongolian People''s Party" 內蒙古人民革命黨 a "reactionary organization of national splitting
        hidden in Inner Mongolia," "Ulanfu''s 烏蘭夫 secret team": the opening of the campaign to "dig out Ulanfu''s black line and root out his poison" 挖肅 in the cleansing of the class
        ranks, Ulanfu named the party''s chief.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 621–622. Made public: 2008. To check: Alatengdelihai 阿拉騰德力海, comp., *Neimenggu wasu zainan shilu xubian* 《內蒙古挖肅災難實錄續編》 (privately compiled,
        Sept. 2008) (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 621 n.90).'
      src:
