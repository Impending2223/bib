      date: '1968-01-10'
      place:
      - kunming
      - xiaguan
      thread: china-leadership
      c: Li Guozhen 李國貞, a head of the Eighth Work Regiment 工八團, leaves Kunming 昆明 with 77 men, going west to relieve the more than 600 besieged at Xiaguan 下關; they reach Xiaguan Jan.
        13.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 619. To check: [[w.longjia-kang-sheng-yu-zhao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 619 n.88).'
