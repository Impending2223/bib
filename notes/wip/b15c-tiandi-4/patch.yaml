      c: The *Guangxi Lianzhi bao* 廣西聯指報 reports 43 "Anti-Communist National Salvation Corps" 反共救國團 and other "counter-revolutionary organizations" in Rong county 容縣.
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 617. To check: [[w.guangxi-wenge-dashi-nianbiao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 617 n.84).'
