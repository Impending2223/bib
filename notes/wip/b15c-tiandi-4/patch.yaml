      when: Feb. 17
      date: '1968-02-17'
      thread: china-leadership
      c: 'The *Guangxi Lianzhi bao* 廣西聯指報 prints "Strengthen the proletarian dictatorship, let no ox-demons and snake-spirits turn the sky over": the "Lianzhi" fighters and poor and
        lower-middle peasants of Yulin 玉林 prefecture expose "Anti-Communist National Salvation" bodies in Rong county 容縣, among them the "Anti-Communist National Salvation Team" of the
        county''s "4·22 Revolutionary General Headquarters" and "armies" in the Changshou 長壽, Dapeng 大鵬, Songshan 松山, Xiahe 下河, Sitang 寺堂 and Xunyang 尋陽 communes.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 617. To check: [[w.guangxi-wenge-dashi-nianbiao]] (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 617 n.84).'
