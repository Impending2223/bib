    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 616 (1:05 to 6:15 a.m.; Zhou Enlai to the Guangxi "4·22": "no ''Anti-Communist National Salvation Corps'' in your organization?", its
      headquarters in Canton, a branch in Guangxi; Kang Sheng on the heads of the Guangdong "Flag faction"; Zhou and Huang Yongsheng name Wu Chuanbin 武傳斌, head of the "Flag faction"
      and standing member of the Guangdong revolutionary committee)'
