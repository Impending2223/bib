- add:
    entry:
      id: cal.1963-10-02.vietnam-force-levels
      when: Oct. 2
      date: '1963-10-02'
      time_range:
        - 1963-10-02T22:00Z
        - 1963-10-02T22:30Z
      place: washington
      thread: vietnam-force-levels
      c: 'The 519th NSC, the Cabinet Room. Kennedy objects to "by the end of this year" for withdrawing the 1,000: if it is not done, a charge of over-optimism; McNamara: the sentence answers Fulbright and others who see the country bogged down for good, and shows a withdrawal plan. Both dates made the report''s, not the President''s. McNamara and Taylor''s basic presentation endorsed. White House statement, released by Salinger: in McNamara and Taylor''s judgment, the major part of the U.S. military task done by the end of 1965; 1,000 men out by the end of 1963. The political situation "deeply serious." Kennedy to McNamara, by O''Donnell''s account: "And tell them that means all of the helicopter pilots, too."'
      n: 'Summary Record of the 519th Meeting of the National Security Council, FRUS 1961–63, IV, doc. [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169) (Oct. 2, 1963, 6 p.m., to 6:30 p.m. by the President''s Log); Record of Action No. 2472, doc. [170](https://history.state.gov/historicaldocuments/frus1961-63v04/d170) (the endorsement; the statement). White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963). The meeting, recorded: [6:05 p.m.](https://prde.upress.virginia.edu/conversations/4022294), JFK Meeting Tape 114_A49.4 (PRDE only). [[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the NSC in the evening; Kennedy objects to "by the end of the year"; the statement released by Salinger); [[w.selverstone-kennedy-withdrawal]], 167–82 (the NSC, from the Miller Center''s draft transcript; the statement); [[w.gibbons-u-s-government-and]], II, 184–85 (the statement); [[w.schulimson-joint-chiefs-of-staff]], 379–81 (the meeting; the endorsement; the 1,000); [[w.futrell-united-states-air-force]], 190 (the NSC; 1965; the thousand); [[w.taylor-swords-and-plowshares]], 299 (the NSC; the statement, the 1965 target and the reduction); [[w.zaroulis-who-spoke-up]], 13 (the statement, quoted in part; McNamara predicts most troops home by December 1965); [[w.sen-church-alleged-assassination-plots]], 220 (the findings to the NSC; the withdrawal of 1,000 by the end of the year to be announced, approved by the President); [[w.odonnell-johnny-we-hardly-knew]], 17 (Kennedy''s words; he asks McNamara to announce the thousand and to say all American forces probably out by the end of 1965); [[w.schlesinger-robert-kennedy-and-his]], 716 (Kennedy''s words as "And tell them that means all the helicopter pilots too," after he took McNamara and Taylor into the Oval Office; the sentence on troop withdrawal deleted from the draft, then restored on McNamara''s direction; no day); [[w.reeves-president-kennedy]], 611–14 (the NSC; the statement). Check: the day and hour of Kennedy''s words to McNamara (O''Donnell; Schlesinger gives no day). Made public: the statement, the same day; the summary record, FRUS 1961–63, IV (1991). To check: William Sullivan, oral history 2, Kennedy Library (cited by [[w.reeves-president-kennedy]], 611); Salinger, press briefing, Oct. 2, 1963, National Security Files, box 314, Kennedy Library (cited by [[w.reeves-president-kennedy]], 614). See [[cal.1963-10-02.vietnam]]. Names: Kennedy, McNamara, Taylor, Fulbright, Salinger, O''Donnell.'
