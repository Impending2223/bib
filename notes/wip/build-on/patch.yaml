- edit:
    id: cal.1961-10-01.china-leadership
    base: '3a1fe461'
    set:
      c: 'Peking, Tiananmen. The National Day rally, the twelfth anniversary: 500,000 soldiers and civilians in Tiananmen Square; the parade, 10 a.m. to 12, no troops reviewed this year. Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Soong Ching Ling, Dong Biwu, Chen Yun and Deng Xiaoping on the Tiananmen rostrum, reviewing the parade; Chen Yi there from 9:50 a.m.; Peng Zhen and Yang Shangkun there too. Peng Zhen speaks: the Second Five-Year Plan''s main industrial targets met in 1960, two years early; three years of natural disaster, grave difficulty, the people advancing against it.'
      n: '[[w.zhou-enlai-waijiao-huodong]], 322 (Oct. 1, 1961; 上午); [[w.yang-shangkun-riji]], II, 73 (Oct. 1, 1961; Yang Shangkun on Tiananmen for the parade, 10 a.m. to 12; no troops reviewed this year; the Premier not named); [[w.deng-xiaoping-nianpu-1904]], III, 1661 (Oct. 1, 1961; morning; Deng at the Tiananmen rally and reviews the parade); [[w.chen-yi-nianpu]], 893 (Oct. 1, 1961, 9:50 a.m.; Chen Yi on the Tiananmen rostrum 天安门城楼 for the meeting and the parade); [[w.peng-zhen-nianpu-1902]], IV, 154–155 (Oct. 1, 1961, morning; Peng Zhen at the rally of 500,000 soldiers and civilians on Tiananmen Square, and speaks: under the general line the main industrial targets of the Second Five-Year Plan met in 1960, two years early; three years of natural disaster brought grave difficulty, the people united advance in the struggle against it); [[w.zhu-de-nianpu-xinbian]], III, 1814 (Oct. 1, 1961; Zhu De 朱德, with Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Soong Ching Ling 宋庆龄, Dong Biwu 董必武, Chen Yun 陈云, Deng Xiaoping 邓小平 and others, at the rally of 500,000 of the capital in Tiananmen Square 天安门广场 for the twelfth anniversary, and on the Tiananmen rostrum reviewing the parade); [[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun at the capital''s celebration of the twelfth anniversary at Tiananmen 天安门). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu, Chen Yun, Deng Xiaoping, Chen Yi, Peng Zhen.'
