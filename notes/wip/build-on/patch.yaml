- edit:
    id: cal.1960-11-05.soviet-union
    base: 'f4741bc2'
    set:
      c: 'Peking, then Moscow. Liu Shaoqi leaves in the morning for Moscow by Tu-104, with Deng Xiaoping, Yang Shangkun, Hu Qiaomu, Lu Dingyi, Wu Lengxi and Qiao Guanhua. At Moscow Khrushchev and Brezhnev, then Chairman of the Presidium of the Supreme Soviet, meet him. Brezhnev''s welcome is cool. Liu''s reply is applauded four times, longest at the 860 million people of the two countries. To his hosts he says the delegation has come to make the conference a success and to strengthen Sino-Soviet unity, and, if it goes well, he will make a state visit. The delegation lodges in three villas on the Lenin Hills, Liu, Deng and Peng Zhen each in one; the staff go to the Chinese embassy. Off at 10:15 a.m., seen off by Zhou Enlai, Zhu De, Lin Biao, Luo Ronghuan, Chen Yi, Li Fuchun, Liu Bocheng and Tan Zhenlin; Kang Sheng in the party. At the airport too Suslov, Gromyko and Andropov.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 369–372 ("the morning of Nov. 5" (369); the landing day not given, but Liu (446) says the Chinese reached Moscow on Nov. 5); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 496 (Nov. 5, 1960; Liu leads the Chinese Party and government delegation, flies to Moscow and arrives); [[w.yang-shangkun-riji]], I, 586–587 (Nov. 5, 1960; off at 10:15 a.m., seen off by the Politburo, the Secretariat and envoys; at Irkutsk, Liu Xiao and Panyushkin and Sedemin of the Soviet Central Committee; Omsk, half an hour; Moscow at 5:45 p.m. Moscow time, in cloud, visibility 300–400 meters; at the airport Khrushchev, Brezhnev, Suslov, Gromyko, Andropov, envoys and some 200 Chinese; Liu inspects the guard, Brezhnev speaks, then Liu); [[w.deng-xiaoping-nianpu-1904]], III, 1592 (Nov. 5, 1960; 10:15 a.m. Peking time Deng, the deputy head, and Liu Shaoqi lead the delegation out of Peking; at Moscow at 4:50 p.m. Moscow time, Khrushchev and Brezhnev at the airport); [[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 5, 1960, morning; Liu Shaoqi and Deng Xiaoping lead the second group (Kang Sheng, Yang Shangkun, Hu Qiaomu and others), seen off by Zhou Enlai, Zhu De, Lin Biao; at Moscow 4:45 p.m. Moscow time, Khrushchev, Brezhnev and Suslov at the airport); [[w.zhu-de-nianpu-xinbian]], III, 1787 (Nov. 5, 1960; Zhu De 朱德, with Zhou Enlai 周恩来, Lin Biao 林彪, Luo Ronghuan 罗荣桓, Chen Yi 陈毅, Li Fuchun 李富春, Liu Bocheng 刘伯承, Tan Zhenlin 谭震林 and others, at the airport to see off Liu Shaoqi''s 刘少奇 Party and government delegation to Moscow). Made public: 1996. See [[cal.1960-11-04.soviet-union]]. Names: Liu Shaoqi, Deng Xiaoping, Lu Dingyi, Qiao Guanhua, Khrushchev, Brezhnev, Peng Zhen, Suslov, Gromyko, Andropov, Zhou Enlai, Zhu De, Lin Biao, Luo Ronghuan, Chen Yi, Li Fuchun, Liu Bocheng, Tan Zhenlin, Kang Sheng. Check: the hour of landing; Wu gives the morning of departure only.'
