- edit:
    id: cal.1963-10-02.vietnam
    base: 3da99419
    set:
      c: 'McNamara and Taylor report to Kennedy on their mission. Their report, the same day: the military campaign has made great progress; serious political tensions in Saigon, the Diệm–Nhu government increasingly unpopular. Recommended: the bulk of U.S. personnel out by the end of 1965; plans to withdraw 1,000 by the end of 1963 announced in the very near future; selective economic pressures on Diệm, the commodity import program''s funds withheld.'
      n: 'Memorandum From the Chairman of the Joint Chiefs of Staff (Taylor) and the Secretary of Defense (McNamara) to the President, FRUS 1961–63, IV, doc. [167](https://history.state.gov/historicaldocuments/frus1961-63v04/d167) (Oct. 2, 1963). White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963) (the report "this morning"). Report of McNamara and Taylor to the President (Viet. II.I.3). The meeting, recorded: [11 a.m.](https://prde.upress.virginia.edu/conversations/4022293), JFK Meeting Tape 114_A49.2 (PRDE only). [[w.miller-misalliance]], 300–02 (the report; the thousand-man withdrawal over the next three months; Miller has the report call the political situation "deeply serious," the White House statement''s words); [[w.gibbons-u-s-government-and]], II, 184–85 (the report); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 289 (the report; the 1,000); [[w.schulimson-joint-chiefs-of-staff]], 379–81 (the report; the 1,000); [[w.futrell-united-states-air-force]], 190 (the report; 1965; the thousand); [[w.moyar-triumph-forsaken]], 254–55 (the report; the 1,000); [[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the hour''s briefing that morning: "we must have a means of disengaging from this area"). [[w.selverstone-kennedy-withdrawal]], 167–82 (the report; the morning meeting, from the Miller Center''s draft transcripts); [[w.taylor-swords-and-plowshares]], 299 (the report to the President; the 1965 target and the reduction); [[w.schlesinger-robert-kennedy-and-his]], 716 (the withdrawal of 1000 advisers by the end of 1963; Schlesinger has the report say "This is a Vietnamese war," the country and the war "must, in the end, be run solely by the Vietnamese"; no day); [[w.reeves-president-kennedy]], 611–14 (the report). Check: the words Schlesinger quotes from the report ("This is a Vietnamese war") are not in the report as FRUS prints it (doc. 167). Made public: the meeting, the White House statement, the same day; the report, *United States–Vietnam Relations, 1945–1967*, Book 12, 554–573 (1971), by FRUS''s note to doc. 167. To check: [[w.selverstone-its-a-date]]; msgs, 2d AD to PACAF, Sep 29 and 30, 1963, and Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27b); PACAF to 2d AD, Oct 9, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27c); ltrs, Frederick W. Flott to Harbin, Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27d); Wade to CHMAAGV, Sep 30, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27e). See [[cal.1963-09-21.vietnam]]. Names: McNamara, Taylor, Kennedy, Diệm, Nhu.'
