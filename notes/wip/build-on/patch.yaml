- edit:
    id: cal.1968-03-31.elections-1968
    base: 'a303391d'
    set:
      c: 'Address to the nation, 9 p.m. No attacks on North Vietnam, "unilaterally, and at once," but in "the area north of the demilitarized zone" where the enemy''s buildup threatens allied positions; Clifford''s order to the Joint Chiefs, effective 7 p.m.: no strikes north of the 20th parallel. Harriman to represent the United States at talks, Thompson to join him "at Geneva or any other suitable place." About 13,500 more support troops in five months, some from reserve units called up; $2.5 billion more in fiscal 1968, $2.6 billion in 1969; the surcharge urged. "I shall not seek, and I will not accept, the nomination of my party for another term as your President." "I have concluded that I should not permit the Presidency to become involved in the partisan divisions that are developing in this political year." The Oval Office: Lady Bird Johnson, Lynda, Clifford and Busby there. The text given out an hour before, without the withdrawal.'
      n: 'The President''s Address to the Nation Announcing Steps To Limit the War in Vietnam and Reporting His Decision Not To Seek Reelection, [1968–69 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=547); The President''s News Conference, [1968–69 Pub. Papers 476](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=554) (Mar. 31, 1968). FRUS 1964–68, VI, docs. [168](https://history.state.gov/historicaldocuments/frus1964-68v06/d168), [169](https://history.state.gov/historicaldocuments/frus1964-68v06/d169). [Johnson and Rockefeller, 11:59 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nelson-rockefeller-april-1-1968), Conversation WH6803-06-12859 (Miller Center). [President''s Daily Diary, Mar. 31, 1968](https://catalog.archives.gov/id/192475), images 10, 17 (LBJ Library; National Archives Catalog). [[w.frankum-like-rolling-thunder]], 59, 61 (the address; the strikes north of the 20th ended; not to run); [[w.cosmas-joint-chiefs-of-staff]], 171–172 (the address; Harriman; the troops and the cost); [[w.drea-mcnamara-clifford-and-the-2011]], 190, 225 (the address, the bombing limited, part of the reinforcement from the reserves, no other term); [[w.poole-joint-chiefs-of-staff-2012]], 59 (the bombing curtailed; the 13,500; not to run); [[w.johnson-vantage-point]], 425–37; [[w.dallek-flawed-giant]], 513, 529 (the address: the bombing, Harriman, the tax; not to run); [[w.herring-lbj-and-vietnam]], 151, 161, 163 (the address; the bombing stopped above the 20th parallel; Harriman; 13,500 more troops; not to run); [[w.chester-american-melodrama]], 4–5 (the withdrawal at 9:35 p.m.); [[w.clifford-counsel-to-the-president-2]], 522–24 (the ending shown Clifford in Johnson''s bedroom before the address); [[w.white-making-of-the-president-1969]], 117–19, 123–24 (the bombing held back below the 20th parallel; "I shall not seek and I will not accept the nomination of my party for another term as your President"); [[w.califano-triumph-and-tragedy-of]], 270 ("I shall not seek and would not accept" changed by Johnson''s hand to "will not accept"; Gaither and Robson in Califano''s office at work on campaign materials); [[w.branch-at-canaans-edge]], 748–49 (Clifford, "Nothing in my career ever surprised me so much"); [[w.berman-lyndon-johnsons-war]], 200–201 (the partial halt; "I shall not seek, and I will not accept"; Harris, approval 57 percent in April, 43 in March); [[w.shesol-mutual-contempt]], 435–37 (an hour before, to the Signal Corps man: "I''m not going to know probably until I get in there whether I''m going to use that speech"; after, asked whether Kennedy affected the timing: he "added to the general situation"); [[w.kotz-judgment-days]], 410–11 (9 p.m., the Oval Office; "a house that cannot stand"; "I shall not seek, and I will not accept"); [[w.zelizer-fierce-urgency-of-now]], 293 (the address at 9 p.m., its words; the text circulated an hour before without the withdrawal; Gallup''s low that day); [[w.bernstein-guns-or-butter]], 490–91 (9:01 p.m.; "I shall not seek, and I will not accept the nomination of my party"); [[w.taylor-swords-and-plowshares]], 391–92 (Rusk for the halt north of the 20th parallel in the drafting; Taylor reviews an early text); [[w.mann-walls-of-jericho]], 488 (the steps to de-escalate; "I shall not seek"); [[w.nixon-rn]], 300 (by Buchanan''s report to Nixon: "I shall not seek, and I will not accept, the nomination of my party"); [[w.zaroulis-who-spoke-up]], 162 (Sunday evening, Mar. 31: the address; the bombing ended except north of the DMZ; the invitation to negotiate; "I shall not seek, and I will not accept"); [[w.rusk-as-i-saw-it-1990]], 483 (the address: the bombing sharply curtailed; a 13,500-man increase against Westmoreland''s 206,000; peace talks proposed; the withdrawal at the end; not the hour, Harriman, the cost or the surcharge); [[w.johnson-white-house-diary]], 642, 645–46 (Mar. 31: "At 9 in the evening, Lyndon was to make his talk to the nation about the war" (642); Mrs. Johnson in the Oval Office with Clifford and Busby, Lynda joining; "Remember—pacing and drama"; the end quoted, "I have concluded that I should not permit the Presidency to become involved in the partisan divisions that are developing in this political year" and "Accordingly, I shall not seek, and I will not accept, the nomination of my party for another term as your President"; Luci and Lynda embrace him, Pat shakes hands; Clifford outside the door "with the oddest, most faraway expression"; nothing of the bombing, the troops or the surtax); [[w.witcover-85-days]], 128 (the closing words, which Sorensen watched on television at the apartment: "I shall not seek, and I will not accept, the nomination of my party for another term as your President"); [[w.khoo-collateral-damage]], 39, 41 (Johnson''s announcement of Mar. 31: a partial end to the bombing, a settlement on the Geneva accords of 1954). [[w.longley-lbjs-1968]], 99–103 (the address; the news conference). [[w.mcpherson-political-education]], 437–39 (the last drafting, Mar. 30: Katzenbach''s language on the bombing, the 13,500 replacements, a new peroration; Johnson''s own ending). To check: [[w.schandler-unmaking-of-a-president]]; [[w.christian-president-steps-down]]; [[w.hoopes-limits-of-intervention]]; [[w.woods-lbj]]; [[w.lafeber-deadly-bet]]; [[w.gould-1968]]; [[w.kaiser-1968-in-america]]; [[w.miller-lyndon]], 619 (cited by [[w.branch-at-canaans-edge]], 747); [*New York Times*, March 31, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/31/issue.html), at 50 (cited by [[w.branch-at-canaans-edge]], 748); President''s Daily Diary, March 31, 1968, p. 8, LBJ (cited by [[w.branch-at-canaans-edge]], 748); FRUS, *Vol. 6* (n.d.), 494–95 (cited by [[w.branch-at-canaans-edge]], 748); [*New York Times*, April 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/01/issue.html), at 1, 26 (cited by [[w.branch-at-canaans-edge]], 748); "Move Called ''Completely Irrevocable, " [*New York Times*, April 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/01/issue.html), at 28 (cited by [[w.branch-at-canaans-edge]], 749); President''s Daily Diary, March 31, 1968, p. 13, LBJ (cited by [[w.branch-at-canaans-edge]], 749); [[w.busby-thirty-first-of-march]], 226–29 (cited by [[w.branch-at-canaans-edge]], 749). After [[cal.1968-03-31.vietnam-205000-3]] (the sources above). After [[cal.1968-03-31.elections-1968-4]] (the sources above). See [[cal.1968-01-30.vietnam]]. Names: Johnson, Clifford, Harriman, Thompson, Lady Bird Johnson, Busby.'
