- edit:
    id: cal.1962-03-27.china-leadership
    base: '1fd89e14'
    set:
      c: 'The Second National People''s Congress, third session, opens in the Great Hall. Mao attends. Zhou Enlai gives the report on the work of the government. Afternoon, 4 to 6 p.m., the CPPCC sitting in; Zhu De presides; with Mao on the platform Liu Shaoqi, Soong Ching-ling, Dong Biwu, Zhou, Deng Xiaoping and Peng Zhen, an executive chairman. Only the international part of the report read: peaceful coexistence, settlement by talks, against nuclear war; the rest the next day.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 27, 1962. [[w.zhou-enlai-nianpu-1949]], II, 466 (Mar. 27, 1962: Zhou Enlai''s part, on the international situation and foreign policy: peaceful coexistence, settlement by talks, against nuclear war); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 552 (Mar. 27–Apr. 16, 1962; Liu attends the session, which adopts the resolutions on the government work report and on the Standing Committee''s work report); [[w.yang-shangkun-riji]], II, 137 (Mar. 27, 1962; 4 to 6 p.m.; the CPPCC sitting in; Mao present; only the international part read, the rest the next day at 3:30); [[w.deng-xiaoping-nianpu-1904]], III, 1697 (Mar. 27–Apr. 16, 1962; Deng at the NPC session); [[w.chen-yi-nianpu]], 913 (Mar. 27–Apr. 16, 1962; Chen Yi at the session in the Great Hall of the People); [[w.peng-zhen-nianpu-1902]], IV, 183 (Mar. 27–Apr. 16, 1962; Peng Zhen attends; on the 27th, afternoon, with Mao, Liu Shaoqi, Song Qingling, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping and others at the opening, one of the executive chairmen; Zhou''s report, its part on the world and foreign policy; on the 28th the part on the home situation; after the groups and the plenary speeches the session closes the afternoon of Apr. 16); [[w.guan-vietnamese-communists-relations-with]], 221–222 (Mar. 27–Apr. 16; even foreign Communist correspondents barred; by the British, from their "best Chinese contacts," two days on rehabilitating rightist opportunists, Peng Dehuai among them, bound up with a wish to come to terms with the Soviet Union); [[w.zhu-de-nianpu-xinbian]], III, 1834 (Mar. 27–Apr. 16, 1962; Zhu De 朱德 at the third session of the Second National People''s Congress 第二届全国人大第三次会议 at Peking 北京, presiding at its opening and its closing; it adopts the resolutions on the Government Work Report and on the Standing Committee''s work report); [[w.liu-jixian-ye-jianying-nianpu]], II, 894 (Mar. 27–Apr. 16, 1962; Ye Jianying 叶剑英 attends the session). Check: Zhou''s nianpu (II, 466) has the report in two parts, the international situation and foreign policy Mar. 27, the domestic situation Mar. 28. To check: Zhou''s report as printed in the *Renmin ribao*, Mar. 28, 1962; FO 371/164895, FC 1016/28, 6 April 1962, from Moscow to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 221 n.80); FO 371/164895, FC 10/6/33, 25 April 1962, from Shanghai to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 222 n.81). Names: Mao Zedong, Zhou Enlai, Zhu De, Liu Shaoqi, Dong Biwu, Deng Xiaoping, Peng Zhen.'
