- edit:
    id: cal.1966-11-14.china-leadership
    base: '84a9e720'
    set:
      c: 'Peking, Diaoyutai Building 12, afternoon. Mao calls a meeting of some Politburo standing members and the Cultural Revolution Group. It affirms the words and acts of the Shanghai Workers'' General Headquarters in the Anting incident, and tells Chen Boda to draft a document on how mines and factories are to make the Cultural Revolution. At 3 p.m.; Liu Shaoqi, Deng Xiaoping, Zhu De and Chen Yun not there; Jiang Qing and Wang Li sit in. Mao: the Workers'' General Headquarters accords with the Constitution''s freedom of association; Zhang Chunqiao may act first and report after, the facts first, then the concepts. Tao Zhu made to criticize himself.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 14, 1966 (its subject Mao, understood, as on July 23–25 and Nov. 15) and note 23. [[w.macfarquhar-maos-last-revolution]], 142 (Mao lectures the Standing Committee from the PRC Constitution on citizens'' right to organize and says it is all right to act first and submit a memorial to the throne later, since first there are facts, then concepts; Tao Zhu is forced to make a self-criticism); [[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 14, afternoon, at the Diaoyutai 钓鱼台, Mao calls a meeting attended by some members of the Standing Committee and members of the Cultural Revolution Group; he affirms Zhang Chunqiao''s way of dealing with it, ''first the facts, then the concept'', and tells Chen Boda to draft a document on how the cultural revolution is to be carried on in factories and mines). [[w.yang-jisheng-tiandi-fanfu]], I, 344 (Nov. 14 at 3 p.m. 下午3時 Mao calls an enlarged meeting of the Politburo Standing Committee, Liu Shaoqi, Deng Xiaoping, Zhu De and Chen Yun not attending, Jiang Qing and Wang Li sitting in; Mao: the Shanghai "Workers'' General Headquarters" accords with the Constitution''s "freedom of association"; of Zhang Chunqiao''s signing the five-point agreement without asking the Center: "he may cut first and report after; there are always facts first and concepts after"; the day given as Nov. 16 by the Zhou–Gu chronology); [[w.jian-zhou-enlai]], 556 (Zhang back in Peking; Tao Zhu doubts his handling, Zhou backing Tao without objecting himself; Mao, "At a Politburo meeting," holding the constitution: "Do the workers have the freedom of assembly? Have you read the constitution?" "It is fine to act first and obtain authorization later"; not the day). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). Check: the day; the Zhou and Gu chronology (199) has the meeting on Nov. 16 (cited at I, 344 n.31). To check: [[w.nianyi-da-dongluande-niandai]], 129–131 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.35a); [[w.li-wang-li-fansi-lu]], II, 654–655 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.35b); [[w.shanghai-wenhua-dageming-shihua]], I, 160–172 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.35c); Zhou Liangxiao 周良霄 and Gu Juying 顧菊英, *Shinian wenge dashiji* 《十年文革大事記》 (2008), 199 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 344 n.31b); [[w.li-xun-geming-zaofan-niandai]], 321–322 (cited by [[w.jian-zhou-enlai]], 556 n.52a); [[w.li-wang-li-fansi-lu]], 954–955 (cited by [[w.jian-zhou-enlai]], 556 n.52b); [[w.pu-weihua-zalan-jiu-shijie]], 310 (cited by [[w.jian-zhou-enlai]], 556 n.53a); [[w.li-wang-li-fansi-lu]], 955–956 (cited by [[w.jian-zhou-enlai]], 556 n.53b); [[w.qi-benyu-huiyilu]], 536 (cited by [[w.jian-zhou-enlai]], 556 n.53c); [[w.li-xun-geming-zaofan-niandai]], 321–322 (cited by [[w.jian-zhou-enlai]], 556 n.54). Names: Mao Zedong, Chen Boda, Liu Shaoqi, Deng Xiaoping, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao, Tao Zhu.'
