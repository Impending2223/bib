- edit:
    id: cal.1968-06-08.robert-kennedy
    base: 'd5ca4ac9'
    set:
      c: 'New York, St. Patrick''s Cathedral: the requiem Mass; Edward Kennedy speaks for the family. The funeral train to Washington, crowds along the line. Burial at Arlington at night, near his brother''s grave. Johnson at the Mass and the burial (Check). The Mass at 10 a.m.; 2,300 in the cathedral. Edward Kennedy: "a good and decent man, who saw wrong and tried to right it, saw suffering and tried to heal it, saw war and tried to stop it." Cardinal Cooke quotes Johnson: two hundred million did not kill him. The Nixons there. The train of twenty-one cars leaves Penn Station at 1:04 p.m., reaches Union Station at 9:25 p.m.; two killed at Elizabeth. Johnson and Humphrey at the grave.'
      n: '[[w.longley-lbjs-1968]], 148–54 (the Mass; the train; Johnson at Union Station and at the burial); [[w.white-making-of-the-president-1969]], 183–85 (half a million; 225 miles in eight and a half hours; Arlington at night, Johnson and Humphrey there); [[w.califano-triumph-and-tragedy-of]], 300–02 (Johnson goes against the Secret Service''s advice; Cooke''s homily on the two hundred million; word of Ray''s arrest; Union Station; the fifteenth car; Arlington); [[w.shesol-mutual-contempt]], 458–59 (Johnson and Califano at St. Patrick''s before ten; Union Station about nine; the Johnsons fifteenth in the procession; at the grave, the Lord''s Prayer; they leave before eleven); [[w.thomas-robert-kennedy]], 392–94 (St. Patrick''s; Edward Kennedy''s eulogy; the train on Saturday afternoon, eight hours to Washington, a million along the tracks, two killed at Elizabeth; the grave at Arlington by candlelight, thirty yards from his brother''s); [[w.clifford-counsel-to-the-president-2]], 546 (the burial at Arlington, June 8, near his brother; Clifford there); [[w.nixon-rn]], 306 (the Nixons at the Mass at St. Patrick''s; Edward Kennedy''s eulogy); [[w.schlesinger-robert-kennedy-and-his]], 915–16 (Friday before dawn, lines form at St. Patrick''s Cathedral; Saturday morning "the mass at St. Patrick''s, with Edward Kennedy''s moving speech and the singing of ''The Battle Hymn of the Republic''"; "Then the train made its long journey south under the savage sun," O''Donnell: "What marvelous crowds!"; "The train arrived in Washington. Night had fallen," mourners with candles following the coffin into Arlington, the cemetery dark (916); not "for the family," the grave''s place or Johnson); [[w.dallek-flawed-giant]], 548 (Johnson takes a low profile at the funeral mass in St. Patrick''s Cathedral on June 8 and at the funeral at Arlington, where Kennedy lies 100 feet from his brother''s grave; not the hour of the burial); [[w.johnson-white-house-diary]], 682–86 (June 8: the Johnsons, Marie Fehmer, Califano and Jim Jones leave the White House lawn "about 8:20" by helicopter, then jet from Andrews to New York; St. Patrick''s, "twenty-three hundred" in the cathedral; Salinger leads them down the aisle; Johnson rises as Mrs. Jacqueline Kennedy enters; Edward Kennedy''s eulogy: "a good and decent man, who saw wrong and tried to right it, saw suffering and tried to heal it, saw war and tried to stop it," and "Some men see things as they are and say, why? I dream things that never were and say, why not?"; Cardinal Cooke quotes Johnson''s remark that two hundred million did not kill him; Ethel Kennedy to Johnson: "You have been so kind"; the train two hours late; the cortege from Union Station past the Capitol, the Justice Department and the Lincoln Memorial, "many from Resurrection City"; Arlington, after 9, the Johnsons stand behind the family; the diary has no hour for the Mass); [[w.schlesinger-journals]], 293–95 (Saturday morning, "the service"; Edward Kennedy''s eulogy "superbly"; Reuther to Schlesinger at Pennsylvania Station, waiting for the train: the poor and the non-white "will all opt out now"; by train to Washington, the tracks lined with people, some crying, the train behind schedule; on the train O''Donnell, "Yes, but what are they good for?" and Radziwill, "To think that a few days ago they were calling this man the most ruthless man in America"; Arlington after nightfall, the last words said over the casket; "from St. Patrick''s Cathedral to Arlington Cemetery" (295); not the requiem Mass, Johnson, or the grave''s place); [[w.witcover-85-days]], 305–16 (the Solemn Requiem Mass at 10 a.m. the morning after Friday, June 7 (304, "Friday morning," a slip) at St. Patrick''s; Edward Kennedy''s eulogy, unannounced, written by Walinsky with Gwirtzman and Burke: "a good and decent man, who saw wrong and tried to right it, saw suffering and tried to heal it, saw war and tried to stop it," 305–06; the twenty-one-car train from Penn Station at 1:04 p.m.; Johnson at the Mass, in a front pew on the side opposite the family; the train reaches Union Station at 9:25 p.m.; the burial at Arlington about ninety minutes before midnight, twenty feet from his brother''s grave, 315–16). [[w.chester-american-melodrama]], 359 (the requiem Mass). See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy, Robert Kennedy, Johnson, Humphrey, Nixon.'
      src:
