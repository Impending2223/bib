    base: '43b1b407'
    set:
      c: 'Peking. Lin Biao presides over an enlarged Politburo meeting that hears Gu Mu on his revised draft of the provisions for industry. Lin and others criticize and reject the draft. Lin Biao, Kang Sheng, Jiang Qing, Chen Boda, Zhang Chunqiao, Xie Fuzhi and Wang Li attack it over three half-days; Zhang Chunqiao to Gu Mu: "your speech speaks for a handful of capitalist-roaders." Liu Shaoqi and Deng Xiaoping called in; Liu made to examine himself. Dec. 6, Zhou: he had Gu write it overnight, no time to consult. Lin''s summing-up: the industrial front much influenced by Liu and Deng; the Cultural Revolution to sweep every field. Ye Jianying and Zhu De attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 4, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 96 (Dec. 4–6, 1966; Zhou at the enlarged Politburo meeting under Lin Biao: Gu Mu reports on the industry-and-transport symposium; Lin Biao, Kang Sheng, Chen Boda and Wang Li attack Gus outline as saying "do not make the Cultural Revolution"; on the 6th, on Chen''s charge that Gu did not consult him, Zhou says he had Gu write it, overnight, with no time to ask opinion, and that though it has faults it did some work); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Dec. 6, 1966; Liu attends the enlarged Politburo meeting under Lin Biao on the Cultural Revolution in industry and communications; Lin attacks Liu and Deng Xiaoping: not a matter of fifty days but of ten and twenty years, the industrial and communications front much influenced by them; Liu, speaking, is made to examine himself); [[w.macfarquhar-maos-last-revolution]], 143 (the final document, a compromise, is ratified at a session of the Politburo chaired by Lin Biao in the first week of December); [[w.macfarquhar-maos-last-revolution]], 161 n.29 (Zhou, at a Standing Committee conference on Dec. 5: the movement cannot be braked; Lin Biao and Chen Boda on its force); [[w.macfarquhar-maos-last-revolution]], 186 (Dec. 6: Wang Li and other Group members accuse Tao Zhu of using production to suppress revolution); [[w.deng-xiaoping-nianpu-1904]], III, 1934 (Dec. 4–6, 1966; Deng attends the enlarged Politburo meeting Lin Biao presides over, on how industrial and communications enterprises are to carry on the ''cultural revolution''; at its end Lin concludes that the industrial and communications front was much influenced by Liu and Deng, the whole of it must make a thorough change of direction, and let the cultural revolution sweep every field and penetrate every field); [[w.mao-zedong-zhuan]], VI, ch. 75 n.30 (the outline, printed and sent up Nov. 23 by Gu Mu, goes Dec. 4 to the enlarged Politburo meeting under Lin Biao, where Lin Biao, Kang Sheng, Jiang Qing, Chen Boda, Zhang Chunqiao and Wang Li attack it fiercely, over three half-days: the industrial system''s problems worse than the cultural and educational, Zhang Chunqiao to Gu Mu: ''your speech speaks for a handful of capitalist-roaders''; on Dec. 6 Chen Boda calls it a surprise attack, Zhou: ''I asked them to write it, a night job, no time to consult''; Lin that afternoon: this movement is in a sense a movement to criticize cadres; Gu Mu''s recollection, n.30). [[w.yang-jisheng-tiandi-fanfu]], I, 335–336 (Dec. 4–6 at the Huairen Hall 懷仁堂 Lin Biao presides over the enlarged Politburo meeting, which hears Gu Mu on the state of the revision of the "Fifteen Articles"; Liu Shaoqi and Deng Xiaoping, already sidelined, are called in; Gu''s three points: industry and communications hold high the red banner of Mao Zedong Thought and there is no "black line"; the staff is basically good, with no question of leadership not in proletarian hands; the continuity and cooperation of production forbid its stopping, and the enterprises'' Party work cannot stop; Wang Li: "on your three points industry does not make a cultural revolution? the talk of the power-holders"; Kang Sheng, Jiang Qing and Xie Fuzhi also criticize; Lin''s summing-up of Dec. 6 wholly denies the Fifteen Articles); [[w.teiwes-tragedy-of-lin-biao]], 69 (in early December Lin convenes the enlarged Politburo meeting; Gu Mu presses the seminar''s concerns and is attacked by Jiang Qing and others of the Cultural Revolution Group; Wang Li attacks Tao Zhu for using production to suppress revolution, and Tao makes a self-criticism); [[w.liu-jixian-ye-jianying-nianpu]], II, 952 (Dec. 4–6, 1966; Ye Jianying 叶剑英 at the enlarged Politburo Lin Biao 林彪 presides, hearing Gu Mu 谷牧 on the forum on the Cultural Revolution in industrial, mining and transport enterprises); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Dec. 4–6, 1966; Zhu De 朱德 at the enlarged Politburo meeting 中共中央政治局扩大会议 in Peking 北京, which takes up the Center''s 中共中央 "Ten provisions on grasping revolution and promoting production (draft)" 《中共中央关于抓革命、促生产的十条规定（草案）》). Made public: 1996. Check: the entry has Lin and others criticize and reject Gu Mu''s draft at the meeting of Dec. 4–6; the book has the Politburo ratify the compromise in the first week of December (143). Check: the entry holds an enlarged Politburo meeting of Dec. 4–6 under Lin Biao; the book (161 n.29) gives Zhou''s words as spoken at a Standing Committee conference on Dec. 5. To check: Zhongfa [1966] 603, "Ten Points on Industry," issued Dec. 9, 1966 ([[w.wenhua-dageming-yanjiu-ziliao]], I, 182–183) (cited by [[w.macfarquhar-maos-last-revolution]], 144 n.41); [[w.gaoju-mao-zedong-sixiang]], 73 (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.29); [[w.xuan-wenhua-dageming-jianshi]], 125 (cited by [[w.macfarquhar-maos-last-revolution]], 186 n.18); [[w.womende-zhou-zongli]], 27, 28 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.30); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 61 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 336 n.14); [[w.nianyi-da-dongluande-niandai]], 137–143 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26a); [[w.shinian-houde-pingshuo]], 52–56 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26b); [[w.li-ping-wenhua-dageming-zhongde-zhou-enlai]], 9, 126 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26c); [[w.kau-lin-piao-affair]], 413 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26d). Names: Lin Biao, Gu Mu, Kang Sheng, Jiang Qing, Chen Boda, Zhang Chunqiao, Xie Fuzhi, Liu Shaoqi, Deng Xiaoping, Zhou Enlai, Ye Jianying, Zhu De.'
