- edit:
    id: cal.1966-02-05.china-leadership
    base: '57806a57'
    set:
      c: 'Peking. The Politburo Standing Committee, Liu Shaoqi presiding, approves the Outline Report and tells the Five-Man Group to take it to Mao at Wuhan, who will decide. Zhou Enlai and Deng Xiaoping there; Peng Zhen reports for the Group, with Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun and Hu Sheng, eleven in all. Xu Liqun, its chief drafter, reports; Kang Sheng silent. Wu Han''s problems academic, with no tie to Peng Dehuai. Mao in Wuhan, Zhu De in Jiangxi, Lin Biao in Suzhou.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966 ("二月五日"). [[w.macfarquhar-maos-last-revolution]], 29 (the third draft to Liu, Zhou and Deng); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631 (Feb. 5, 1966; Liu presides at the Politburo Standing Committee meeting, which discusses and agrees to the "Outline Report on the Current Academic Discussion" the Central Cultural Revolution Group of Five submitted (the "February Outline"); the outline says to keep to Mao''s policy of "letting go" stated at the propaganda work conference of March 1957, to hold to seeking truth from facts and equality before truth, to convince by reason and not decide like an academic overlord or press by force, to promote holding to truth and correcting mistakes at any time, to establish while breaking, to allow and welcome those who err and those who counter-attack academically to correct themselves, and to be serious and kind toward them, not "forbid revolution," and careful about publicly naming names in the press; Feb. 8 Peng Zhen and others report to Mao at Wuhan; Feb. 12 the Center sends the outline to the whole Party; footnote 1 (631) gives the Group''s head as Peng Zhen and its members as Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi); [[w.lengxi-shinian-lunzhan-1956-1966]], 933 ("early February": Liu Shaoqi''s meeting of the Standing Committee members in Peking, Zhou and Deng, after the Group of Five''s report, also took up whether to attend the CPSU''s 23rd Congress, invited in January; no view settled; Peng Zhen and Wu to ask Mao at Wuchang); [[w.macfarquhar-origins-of-the-cultural]], III, 454 (the Standing Committee members in the capital, Liu Shaoqi, Zhou Enlai and Deng Xiaoping, approve; Kang Sheng silent; Mao in Wuhan, Zhu De in Jiangxi, Lin Biao in Suzhou); [[w.deng-xiaoping-nianpu-1904]], III, 1893–1894 (Feb. 5, 1966; Deng at the Politburo Standing Committee meeting Liu Shaoqi presides over, which discusses and agrees to the Outline Report and decides that Peng Zhen and others report it to Mao at Wuhan; on the 8th Peng Zhen and Lu Dingyi go and report; Mao does not clearly state a different view); [[w.mao-zedong-zhuan]], VI, ch. 74 n.26 (early Feb., by Wu Lengxi''s recollection: the Standing Committee members in Peking, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, met on the outline and agreed it, with no mention of the Lushan meeting in articles of the discussion, and sent the group to Wuchang to report to Mao, who would decide; day, chair not given). [[w.yang-jisheng-tiandi-fanfu]], I, 120–122 (Liu Shaoqi 劉少奇 presides at the Standing Committee members in Peking, who discuss the draft; before the meeting Peng sends it to them with the line that for haste it could not be circulated in the Group; Xu Liqun reports orally and Peng does not read the Outline out; after Peng''s revision the members in Peking agree, and it is wired to Mao at Wuhan on Feb. 7; not that the meeting told the Group to take it to Mao); [[w.peng-zhen-nianpu-1902]], IV, 466–467 (Feb. 5, 1966; Peng Zhen reports for the Five-Man Group to the Standing Committee under Liu Shaoqi, Mao at Wuhan, Zhou Enlai, Deng Xiaoping and others there, with Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and others, eleven; Xu Liqun, its chief drafter, reports; the outline agreed, Peng and others to report to Mao; the debate bound to spread to other fields, long and hard, not settled by a few concluding articles or political verdicts; the "letting go" of March 1957; all equal before the truth; the erring allowed to correct themselves; care in naming names in the press; an academic criticism office of the group, Xu Liqun its head, with Hu Sheng, Wu Lengxi, Yao Zhen, Wang Li and Fan Ruoyu, Hu Sheng in charge of the academic side); [[w.jian-zhou-enlai]], 533 (Feb. 5, the Standing Committee chaired by Liu and Deng, Zhou there: Peng reports how the outlines were composed, Wu Han''s problems academic, no tie to Peng Dehuai; Liu and Deng endorse, Zhou concurs; Deng relays the decision and text to Mao); [[w.pu-weihua-zalan-jiu-shijie]], 59 (Liu Shaoqi calls the standing members in Peking, who discuss and pass the Outline Peng Zhen put up and decide that Peng and others go to Wuhan to report to Mao in person); [[w.liu-jixian-ye-jianying-nianpu]], II, 934–935 (Feb. 5, 1966; the Standing Committee under Liu Shaoqi 刘少奇 agrees to the Five-Man Group''s 文化革命五人小组 outline report on the present academic discussion 《关于当前学术讨论的汇报提纲》 (the "February Outline"), which tried to limit the "left"; forwarded by the Center Feb. 22 after Mao was asked, and soon repudiated by him). Made public: 1982 ([[w.kan-kang-sheng-pingzhuan]]). Check: Wu (933) dates the meeting only "early February," and has it take up the CPSU''s invitation to its 23rd Congress as well. To check: Outline Report of the Group of Five (the "February Outline"), as sent to the Center, in [[w.mao-zhuxi-zuixin-zhishi]], 1057–58 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.65); [[w.jin-1949-1989-niande-zhongguo]], 615–16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.137); [[w.zhu-de-nianpu]], 543 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.139); [[w.en-zhou-zongli-shengping-dashiji]], 456 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.141); [[w.lengxi-yi-mao-zhuxi-remembering]], 150 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.142); [[w.al-zhongguo-gongchan-dang-zhizheng]], 268 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.143a); [[w.kan-kang-sheng-pingzhuan]], 178 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.143b); [[w.qingshan-kang-sheng-waizhuan]], 257–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.143c); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 12 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 122 n.35). See [[cal.1966-02-03.china-leadership-2]]. Names: Liu Shaoqi, Peng Zhen, Zhou Enlai, Deng Xiaoping, Lu Dingyi, Kang Sheng, Peng Dehuai, Zhu De, Lin Biao, Mao Zedong. Check: whether [[w.kan-kang-sheng-pingzhuan]] (1982), on which the year rests, was printed for internal circulation; if so, Made public is the year of the next work cited ([[w.jin-1949-1989-niande-zhongguo]], 1989).'
