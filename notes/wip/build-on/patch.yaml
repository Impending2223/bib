    base: 'c388c3ec'
    set:
      c: 'Mao presides over an enlarged Politburo Standing Committee, Shanghai, opening Dec. 8 (to Dec. 15), on the "Luo Ruiqing question". Lin Biao, Ye Qun, Wu Faxian and Li Zuopeng charge Luo with opposing "putting politics first" and "usurping the army"; Ye Qun speaks three times, about ten hours, alleging Luo pressed Lin to give way. Five points fixed: the matter serious, the means vile; different from Peng and Huang; his record some achievement; "learn from the past" and "cure the sick"; the leadership partly to blame. Two steps, transfer, no face-to-face, cool handling. After it, Luo removed from his military posts, Yang Chengwu acting chief of staff. Sixty-one present, thirty-four of them senior officers; none but Mao and Lin knew the subject beforehand, and no notes allowed. Liu Shaoqi, Zhou Enlai, Deng Xiaoping and Zhu De attend; Peng Zhen stays in Peking to run the Center''s work. Mao: Luo an "ambitious schemer," treating Lin as an enemy. Luo, called to Shanghai Dec. 11, given no chance to answer. Zhu De: Mao Zedong Thought cannot be called the summit of Marxism-Leninism, for a summit cannot develop further.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 8, 1965 ("12月8日一15日"). [[w.zhou-enlai-nianpu-1949]], II, 768 (Dec. 8–15, 1965: Zhou attends in Shanghai the enlarged Standing Committee under Mao, at which Lin Biao, Ye Qun, Wu Faxian and Li Zuopeng spring a surprise attack on Luo Ruiqing, charging him with opposing "putting politics first" and "usurping the army and opposing the Party"; Luo is moved from military leadership and Yang Chengwu acts as chief of the General Staff); [[w.macfarquhar-maos-last-revolution]], 25–26 (the session of Dec. 8, sixty-one present; Ye Qun''s three speeches, ten hours; Lin Biao, Li Zuopeng and Wu Faxian in support); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 629–630 (Dec. 8–15, 1965; Liu attends the enlarged meeting of the Politburo Standing Committee held at Shanghai under Mao, which discusses the "problems" of Luo Ruiqing; the book says Lin Biao, Ye Qun, Wu Faxian, Li Zuopeng and others framed charges and attacked Luo by surprise, and he was removed from his posts; footnotes 1–4 (629) give their posts at the time: Luo, Secretary of the Secretariat, Vice-Premier and Chief of the General Staff; Ye Qun, director of Lin Biao''s office; Wu, commander of the air force; Li, deputy commander of the navy); [[w.macfarquhar-origins-of-the-cultural]], III, 450 (Ye Qun the chief witness, speaking ten hours, backed by Lin Biao, Wu Faxian and Li Zuopeng; Liu Shaoqi, Zhou Enlai and Deng Xiaoping taken aback; after it Mao has Zhou and Deng investigate); [[w.yang-shangkun-riji]], II, 695 (Dec. 8, 1965; Yang learns that the members of the Standing Committee have all gone to Shanghai for a meeting; the editors'' note: the enlarged Standing Committee, Dec. 8 to 15; the words: 得知常委各同志都去上海开会去了); [[w.deng-xiaoping-nianpu-1904]], III, 1886–1887 (Dec. 8–15, 1965; Deng at the enlarged Politburo Standing Committee meeting Mao presides over at Shanghai, on the Luo Ruiqing 罗瑞卿 question; there Lin Biao, Ye Qun 叶群 (footnote: then director of Lin''s office), Wu Faxian 吴法宪 (commander of the Air Force) and Li Zuopeng 李作鹏 (deputy commander of the Navy) list charges against Luo, slandering him as ''opposing putting politics first'' and ''usurping the army and opposing the Party'', in a sudden attack, and Luo is moved from his military leading post); [[w.mao-zedong-zhuan]], VI, ch. 74 (Dec. 8–16 at Shanghai Mao presides at the enlarged Standing Committee, whose members learn only at the opening that it is to criticize Luo Ruiqing; Ye Qun speaks three times, some ten hours; Luo called to Shanghai Dec. 11 and given no chance to answer). [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (Dec. 8 to 15, to criticize Luo Ruiqing; Luo removed as chief of staff at its end); [[w.peng-zhen-nianpu-1902]], IV, 452 (Dec. 8–16, 1965; Peng Zhen stays in Peking to run the Center''s work while the enlarged Standing Committee meets at Shanghai; Lin Biao, Ye Qun, Wu Faxian and Li Zuopeng charge Luo Ruiqing with opposing "putting politics first" and "seeking power and opposing the Party"; Luo moved from military leadership, Yang Chengwu 杨成武 acting chief of staff); [[w.jian-zhou-enlai]], 531 (the conference on Luo opens Dec. 8 and lasts a week; at the Standing Committee''s first sitting Mao calls Luo an "ambitious schemer" whose "worldview is different from ours," who "has virtually treated Comrade Lin Biao as an enemy"; then widened to the Politburo, ministers and commanders; Ye Qun speaks for Lin three times, ten hours in all: Luo would not be satisfied "unless Comrade Lin Biao let him be the minister of defense"); [[w.khoo-collateral-damage]], 28 (Luo Ruiqing, head of the Leading Group on Vietnamese Affairs until his purge in December 1965; Li Xiannian in charge after); [[w.pu-weihua-zalan-jiu-shijie]], 28–29 (sixty-one present, thirty-four of them senior officers; none but Mao and Lin Biao knew the subject beforehand; no notes allowed; Mao: Luo''s thinking distant from ours, he treats Lin as an enemy, a careerist; Mao has Ye Qun called from Suzhou to speak; three speeches, ten hours, her chief proof the four points Liu Yalou passed her before his death for Lin: to leave the political stage in time, guard his health, leave the army to others, give Luo a free hand; and Liu''s word that Luo would not forget her; Wu Faxian, in a speech of over 10,000 characters, that Liu Yalou had told him the four points too); [[w.liu-jixian-ye-jianying-nianpu]], II, 933 (Dec. 8–15, 1965; Mao Zedong''s 毛泽东 enlarged Politburo Standing Committee at Shanghai 上海 on Luo Ruiqing''s 罗瑞卿 so-called "problem": Lin Biao 林彪, Ye Qun 叶群, Wu Faxian 吴法宪 and Li Zuopeng 李作鹏 frame him as "against giving politics prominence" and "seizing the army and opposing the Party"; then Luo removed from his military posts); [[w.zhu-de-nianpu-xinbian]], III, 1944 (Dec. 8–15, 1965; Zhu De 朱德 at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议 Mao Zedong 毛泽东 calls at Shanghai 上海; those attending learn only at the meeting that it is to criticize Luo Ruiqing 罗瑞卿; Ye Qun 叶群, Lin Biao''s 林彪 wife, speaks three times, some ten hours, inventing how Luo pressed Lin Biao to "yield his place"; Luo, called to Shanghai on Dec. 11, is given no chance to answer at the meeting; Lin Biao, Wu Faxian 吴法宪, commander of the Air Force 空军司令员, Li Zuopeng 李作鹏, political commissar of the Navy 海军政治委员, and others charge him with "usurping the army and opposing the Party," opposing "giving prominence to politics" and the "living study and living use" of Mao Zedong Thought; Zhu De says at the meeting that Mao Zedong Thought cannot be called the summit of Marxism-Leninism, for a summit cannot develop further; the nianpu''s note: from Sept. 1959, when he took over the Ministry of Defense 国防部 and the Military Commission''s 中央军委 work, Lin Biao had often trumpeted Mao Zedong Thought as "the summit of Marxism-Leninism of our time"). Made public: 1996. To check: [[w.nianyi-da-dongluande-niandai-revised]], 87–88 (cited by [[w.macfarquhar-maos-last-revolution]], 25 n.48a); [[w.yao-san-ci-da-nan]], 285, 288 (cited by [[w.macfarquhar-maos-last-revolution]], 25 n.48b); [[w.jianping-fengyun-zhongde-gongheguo-dajiang]], 321 (cited by [[w.macfarquhar-maos-last-revolution]], 25 n.48c); [[w.nianyi-da-dongluande-niandai-revised]], 381 (cited by [[w.macfarquhar-maos-last-revolution]], 25 n.49); [[w.ping-kaiguo-zongli-zhou-enlai]], 457 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 450 n.115); Wang Renzhong 王任重, diary 日记, Dec. 28, 1965 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.22); [[w.qiu-huizuo-huiyilu]], 377–379; [[w.li-zuopeng-huiyilu]], 537–538 (cited by [[w.jian-zhou-enlai]], 531 n.56a, n.56b); [[w.jian-maos-china-and-the]], 357 (cited by [[w.khoo-collateral-damage]], 28 n.142); Li Xuefeng 李雪峰, 〈我所知道的「文革」發動內情〉, in Zhang Hua 張化 and Su Caiqing 蘇採青, eds., *Huishou "wenge"* 《回首「文革」》 (2003), II, 595 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 28 n.47). Names: Mao Zedong, Lin Biao, Ye Qun, Wu Faxian, Li Zuopeng, Luo Ruiqing, Yang Chengwu, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Zhu De, Peng Zhen.'
