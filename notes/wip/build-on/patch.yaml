- edit:
    id: cal.1961-01-19.laos
    base: 'f521e20d'
    set:
      c: 'Eisenhower–Kennedy transition meeting, the two alone, then with the outgoing and incoming secretaries. Laos called the key to Southeast Asia; accounts of what Eisenhower advised conflict. Cuba: help the anti-Castro guerrillas "to the utmost"; the training in Guatemala continued and accelerated. By Kennedy''s notes, the two from 9 a.m.; at 9:45, in the Cabinet Room, the six Cabinet members. Herter: intervene if the Laotian government invokes SEATO; Laos "the cork in the bottle," Thailand, the Philippines and Chiang Kai-shek to follow; Eisenhower too for intervention; Gates: forces for one front, not two. By Persons''s record, Eisenhower: unilateral action very bad, the United States "tagged" as interventionists; SEATO far better than a coalition with the Communists. By McNamara''s memorandum, Eisenhower: in the long run the United States cannot allow Castro''s government to continue.'
      n: 'FRUS 1961–63, XXIV, docs. [7](https://history.state.gov/historicaldocuments/frus1961-63v24/d7) (Kennedy''s notes, dictated), [8](https://history.state.gov/historicaldocuments/frus1961-63v24/d8) (Persons), [9](https://history.state.gov/historicaldocuments/frus1961-63v24/d9) (Herter), [11](https://history.state.gov/historicaldocuments/frus1961-63v24/d11) (McNamara''s, Jan. 24: "If Laos is lost ... we will lose all of Southeast Asia"); X, doc. [22](https://history.state.gov/historicaldocuments/frus1961-63v10/d22) (Clifford''s and McNamara''s memoranda, on Cuba). [[w.gibbons-u-s-government-and]], II, 9 (the meeting, Laos at the top of the agenda; Laos the "key to the whole area," by Clifford''s memorandum); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 174, 231 (Laos, by McNamara''s account; the training in Guatemala); [[w.marolda-united-states-navy-and]], 98 (Eisenhower on Laos); [[w.schulimson-joint-chiefs-of-staff]], 29 (the meeting; Laos the key); [[w.clifford-counsel-to-the-president-2]], 342–45 (the meeting with the secretaries in the Cabinet Room; Laos, Herter for intervening alone if need be, a division in twelve to seventeen days by Gates; Cuba, "to the utmost," the training in Guatemala; China, by Clifford''s account); [[w.fursenko-one-hell-of-a]], 77–78 ("To the utmost"); [[w.jones-bay-of-pigs]], 44 (Eisenhower''s recommendation to speed the training); [[w.rusk-as-i-saw-it-1990]], 428 (the meeting; Eisenhower''s advice, by Rusk''s account); [[w.sorensen-kennedy]], 231, 640 (the meeting; Laos); [[w.fursenko-khrushchevs-cold-war]], 336–37 ("It is the cork in the bottle"); [[w.mcnamara-in-retrospect]], ch. 2 at nn.5–9 (the meeting, its emphasis on Laos; the accounts: Clifford''s memorandum, Eisenhower "willing, ''as a last desperate hope, to intervene unilaterally''"; McNamara''s, "President Eisenhower advised against unilateral action by the United States in connection with Laos"). [[w.schlesinger-thousand-days-1965]], 163–64; [[w.moyar-triumph-forsaken]], 125–26 (the meeting; Herter on SEATO and Laos); [[w.poole-joint-chiefs-of-staff]], 124; [[w.reeves-president-kennedy]], 29–33 (the meeting; Laos the "cork in the bottle"; "To the utmost"); [[w.wofford-of-kennedys-and-kings]], 98 (Eisenhower to Kennedy the day before the inauguration: Laos "the key to all Southeast Asia"; Cuba, "helping train anti-Castro forces in Guatemala," aid the guerrillas "to the utmost," the effort "continued and accelerated"); [[w.ball-past-has-another-pattern]], 361 (Eisenhower tells Kennedy "just before the inauguration" that Laos is the key to Southeast Asia, "unbelievable pressure" on Thailand, Cambodia and South Vietnam; "as a last desperate hope, to intervene unilaterally," n.2; not the day or the place); [[w.schlesinger-robert-kennedy-and-his]], 702 (Eisenhower''s pre-inaugural briefing of Kennedy: he ignored Vietnam and called Laos the "present key to the entire area"; by Clark Clifford''s record of the meeting, he would be willing "to intervene unilaterally" if others could not be persuaded to act; not the Cuba talk, those present or the day); [[w.mann-grand-delusion]], 228–29 (the meeting of Jan. 19: Herter, the outgoing Secretary of State, argues the United States duty-bound to intervene if Laos asks under SEATO, "the cork in the bottle"; Eisenhower "felt we should intervene," by Kennedy''s record that day; Clifford, present, recalls Eisenhower willing "as a last desperate hope, to intervene unilaterally"; not the order of the meeting or the Cuba talk); [[w.odonnell-johnny-we-hardly-knew]], 275–76 (the morning briefing at the White House with Eisenhower and the outgoing secretaries; Cuba, Berlin, Africa, the balance of payments and Laos in the Cabinet Room; Eisenhower "urged him to keep on supporting this plan to overthrow Castro" and talked mostly of Laos, American combat troops possibly alone there; not the two alone; the date printed "January 19, 1960" is an error for 1961); [[w.guan-vietnamese-communists-relations-with]], 164, 177 (by Eisenhower, some sign that the Soviet Union was concerned at the Communist pressure in Laos and Southeast Asia from China and North Vietnam; Laos the key to all Southeast Asia, its fall to bring South Vietnam, Cambodia, Thailand and Burma after it; Vietnam less critical). Check: Rusk names those with Eisenhower as Kennedy, McNamara, Clifford and himself and gives two pieces of advice: no recognition of Communist China; troops into Laos, "with others if possible, alone if necessary" (428; also 283). To check: [[w.greenstein-what-did-eisenhower-tell]] (compares the five accounts); Clifford to Kennedy, memorandum of the conference of Jan. 19, 1961, on Laos, *U.S.–Vietnam Relations*, bk. 10, 1360–64 (cited by [[w.schulimson-joint-chiefs-of-staff]], 29 n.147); Clifford''s memorandum for Johnson (1969), *Pentagon Papers*, Gravel ed., II, 635–37, and Clifford to Kennedy, Jan. 24, 1961, POF, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], II, 9 n.19); [[w.united-states-vietnam-relations]], 1360–1364 (memorandum of the Eisenhower–Kennedy conference of Jan. 19, 1961, on Laos) (cited by [[w.guan-vietnamese-communists-relations-with]], 164 n.45); [[w.pentagon-papers]], II, 635–637 (Gravel ed.) (cited by [[w.guan-vietnamese-communists-relations-with]], 177 n.112b). Check: the Taylor report, [FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), 578–79 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 174 n.8), read: it gives no account of Jan. 19; its "continuation and accentuation" of the CIA''s activities is the President''s authorization of Jan. 28. See [[cal.1961-01-02.laos]]. Names: Eisenhower, Herter, Gates, Persons, Chiang Kai-shek, McNamara, Castro.'
