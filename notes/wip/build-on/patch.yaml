- edit:
    id: cal.1968-10-31.china-leadership
    base: '4972d27d'
    set:
      c: 'Mao closes the Twelfth Plenum, 5:15 p.m., Great Hall. It adopts the communique; approves the report on the "traitor, hidden enemy, scab" Liu Shaoqi (Jiang Qing, Kang Sheng, Xie Fuzhi); expels Liu from the Party for ever and strips all his posts; decides to convene the Ninth Congress; adopts the decision on its delegates and the draft constitution. Mao speaks: on the "February countercurrent", a big thing and not so big, a natural matter of differing views. Earlier, 4 p.m., with Lin Biao, Zhou and others in Fujian Hall on conveying the plenum. Mao also: Deng Xiaoping to be told apart from Liu, a few good words for him; on the class ranks, grasp tight and keep to policy, evidence not confession; old comrades, "criticize first, protect second, watch third"; Chen Yi to come to the Ninth Congress as the right. Of He Long: "it seems we can no longer protect him." Chen Shaomin does not raise her hand on Liu''s expulsion.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 260 (Oct. 31, 1968; the closing, the report, the resolution, Mao''s remarks and the notice); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 659–660 (Oct. 13–31, 1968; the book says the Twelfth Plenum of the Eighth Central Committee (enlarged) meets at Peking Oct. 13–31; of the Eighth Central Committee''s 97 members 40 can attend, 10 alternates are made members to pass half, and of the 133 participants 74 (over 57 percent) are enlarged participants, members of the Central Cultural Revolution Group and the Military Commission''s office group and persons from the provinces, municipalities, regions, great military regions and central organs; from the start the plenum breaks into groups to surround and criticize Zhu De, Chen Yun, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian and other veteran comrades; on the "Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi," written on forged evidence under Jiang Qing, Kang Sheng and Xie Fuzhi, it decides to expel Liu forever from the Party and strip him of all posts in and out of the Party, the book calling this the greatest wrongful case in the Party''s history; Chen Shaomin, member of the Central Committee and Vice-Chairman of the All-China Federation of Trade Unions, unafraid of the pressure, refuses to agree to it); [[w.jianguo-yilai-mao-zedong]], XIX, 363 (Oct. 31, 1968; Mao at the closing session: in cleaning up the class ranks, first grasp it tight, second attend to policy; set in bold type in the New Year''s Day editorial of the *Renmin ribao*, *Hongqi* and *Jiefangjun bao*, Jan. 1, 1969, n.1); [[w.macfarquhar-maos-last-revolution]], 276 (Mao''s closing: the countercurrent''s men wanted their views heard, as Politburo members, vice premiers and Military Commission vice chairmen, all right in Party life, and were open about it; they are to be delegates to the Ninth Congress); [[w.macfarquhar-maos-last-revolution]], 277 (Liu expelled and dismissed "once and for all"; the communique''s "unanimously," though Chen Shaomin did not raise her hand; the 74-page indictment by the Central Case Examination Group, which reportedly set 400,000 people to 4 million files, no event in it later than 1929); [[w.macfarquhar-maos-last-revolution]], 278 (the plenum ratifies the draft constitution prepared in Shanghai under the Cultural Revolution Group at Mao''s insistence, after a year of soliciting opinions, 126 provincial revolutionary committees and PLA units among them); [[w.macfarquhar-maos-last-revolution]], 279–280 (Mao protects Deng Xiaoping: reservations on expelling him; "He won''t rebel"; Deng dismissed from all posts in and out of the Party, not expelled); [[w.macfarquhar-maos-last-revolution]], 280 (Mao on Chen Yi, Chen Duxiu, Jian Bozan and Feng Youlan, the worker delegate Wang Hongwen and a Tibetan delegate); [[w.macfarquhar-maos-last-revolution]], 280–281 (Mao on He Long: "it seems we can no longer protect him"); [[w.macfarquhar-maos-last-revolution]], 281 (Mao: "the meeting wasn''t too bad; in fact it went quite well"); [[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 31, 1968; the nianpu: Mao, at the closing session, says of Deng Xiaoping that all want to expel him and he has some reservation; this man, he must be told apart from Liu Shaoqi, and in fact there are differences; my thought is perhaps conservative, not to your taste, and I say a few good words for Deng); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.38, 51, 52 (Oct. 31 Mao speaks at the closing session on three questions: clearing the class ranks, to be pressed and kept to policy, ''steady, accurate and hard'', evidence and not confession, no beating, no ''jet planes''; the scholars not to be overdone, Feng Youlan 冯友兰, Jian Bozan 翦伯赞 and Wu Han 吴晗 have some use, and he names Hua Luogeng, Zhao Jibin, Ren Jiyu, Zhou Gucheng, Liu Dajie, Tan Jiazhen, Su Buqing and Yang Rongguo; the older comrades, one criticism, two protection, three watching, naming Tan Qilong 谭启龙 and Jiang Weiqing 江渭清 among those felled in the provinces, who may be given something to do in some years; on the ''February counter-current'': to call it small is wrong, it is a big matter, to call it very grave is also wrong, a natural thing since they had differing views and spoke them openly, as Politburo members, vice-premiers and some Military Commission vice-chairmen; and he reserves on expelling Deng Xiaoping, ''there are differences from Liu Shaoqi'', he says a few good words for him, n.38, n.51; the plenum approves the report of the Central special case examination group of Oct. 18 and decides to expel Liu from the Party for ever, strip him of all posts, and go on settling accounts with him and his associates, the book giving this as the plenum''s resolution of the last day; the communique, printed in the *Renmin ribao* Nov. 2, says the plenum decides to convene the Ninth Congress at a suitable time, n.52; the book says Liu knew nothing of the report and had no right to defend himself). [[w.yang-jisheng-tiandi-fanfu]], II, 595 (the communiqué of Oct. 31: the work of cleansing the class ranks to be done well in factories, communes, offices, schools, all units and streets, "to dig out the handful of counter-revolutionaries hiding among the masses"; Mao at the plenum: about three years; "by next summer it will be about done"); [[w.yang-jisheng-tiandi-fanfu]], II, 704, 710 (the resolution: Liu expelled for ever, all his posts taken away; Mao in his closing speech on Tan Qilong and Jiang Weiqing, on Chen Yi as delegate of the right at the Ninth Congress, on Feng Youlan and Jian Bozan); [[w.chen-yi-nianpu]], 1210–1211 (Oct. 31, 1968; the plenum, in a most abnormal state, approves the report on Liu Shaoqi''s crimes, written with false evidence with the backing of Jiang Qing, Kang Sheng, Xie Fuzhi and others, and decides his expulsion "for ever," which the nianpu calls wrong, and adopts several papers for the Ninth Congress; Mao''s closing speech: some comrades did not much understand the "February adverse current" and after some ten days understood it better; those who erred explained, were questioned, and explained again; the matter neither small nor very great; men with views to speak, Politburo members, vice-premiers, some vice-chairmen of the Military Commission, within what Party life allows, and they spoke openly; always a left, a center and a right; the absence of the "February adverse current" comrades from the Ninth Congress would be a shortcoming; "Comrade Chen Yi, you come to the Ninth Congress in the character of that right side"); [[w.dikotter-cultural-revolution]], 180 n.42 (a month after Zhou''s announcement Liu Shaoqi formally expelled from the Party, a "renegade, traitor and scab hiding in the party and a running dog of imperialism, modern revisionism and the nationalist reactionaries"); [[w.pu-weihua-zalan-jiu-shijie]], 118 (the plenum''s communiqué: Chairman Mao''s proletarian revolutionary line, his strategic plan for the Cultural Revolution, his instructions and Vice-Chairman Lin''s speeches all correct; the Central Cultural Revolution Group has played an important part in carrying out his line; the *"Wenhua dageming" yanjiu ziliao*, II, 221 (118 n.56)); [[w.liu-jixian-ye-jianying-nianpu]], II, 978–979 (Oct. 31, 1968; the plenum closes, approving the report on Liu Shaoqi''s "crimes", written by Jiang Qing, Kang Sheng, Xie Fuzhi and others on false evidence, expelling him for ever, deciding to convene the Ninth Congress, adopting the draft constitution; Mao at the closing on the "February adverse current": a big thing and not so very great; they spoke openly, as Politburo members, vice-premiers and vice-chairmen of the Military Commission, as Party life allows; leaving them out of the Ninth Congress a shortcoming; old comrades: "criticize first, protect second, watch third"); [[w.chen-yun-nianpu-xiuding]], III, 164–165 (the plenum, "in a wholly abnormal state", adopts the ''Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi'' 《关于叛徒、内奸、工贼刘少奇罪行的审查报告》, written by Jiang Qing, Kang Sheng and others on false evidence, and expels Liu Shaoqi from the Party for ever, stripping him of all posts in and out of it; it adopts the decision to convene the Ninth Congress, the ''Decision on electing the delegates to the Ninth Congress'' 《关于九大代表产生的决定》 and the ''Decision on the draft constitution of the Communist Party of China'' 《关于中国共产党章程（草案）的决定》); [[w.peng-dehuai-nianpu]], 820 (the plenum approves the report on the crimes of "the traitor, hidden traitor and scab Liu Shaoqi" 刘少奇 and expels him from the Party for ever, stripping him of all his posts, as the communique 公报 Peng Dehuai 彭德怀 reads on Nov. 2 gives it). Made public: the communique, *Renmin ribao*, Nov. 2, 1968 (the session''s acts); 2013 (Mao''s speech, the Fujian Hall meeting). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 260 (Oct. 31, 1968), has Zhou tell Mao before the closing that he has drafted a notice on conveying the plenum, and speak at the session of Liu Shaoqi''s "crimes". To check: the plenum''s communique, the report on Liu Shaoqi''s case, the resolution expelling him, and Mao''s closing speech (cited by [[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1968); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 8 (cited by [[w.macfarquhar-maos-last-revolution]], 276 n.12); [[w.zhonghua-renmin-gongheguo-shi]], 351 (cited by [[w.macfarquhar-maos-last-revolution]], 277 n.13); [[w.dittmer-death-and-transfiguration]], 459 (cited by [[w.macfarquhar-maos-last-revolution]], 277 n.14); [[w.zhengdang-xuexi-ziliao]], IV, 38–40 (cited by [[w.macfarquhar-maos-last-revolution]], 278 n.19); Kang Sheng''s report to the Ninth Congress, in [[w.jiuda-ziliao-huibian]], 28 (cited by [[w.macfarquhar-maos-last-revolution]], 278 n.20); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 14 (cited by [[w.macfarquhar-maos-last-revolution]], 279 n.26); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 8–14 (cited by [[w.macfarquhar-maos-last-revolution]], 280 n.29); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 14 (cited by [[w.macfarquhar-maos-last-revolution]], 281 n.30); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 8 (cited by [[w.macfarquhar-maos-last-revolution]], 281 n.32); Mao Zedong 毛泽东, speech at the closing session of the enlarged Twelfth Plenum 中共八届扩大的十二中全会闭幕会 (record 讲话记录), Oct. 31, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.38); *Renmin ribao* 《人民日报》, Nov. 2, 1968 (the communique) (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.52); [[w.wenhua-dageming-yanjiu-ziliao]], II, 221 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 118 n.56). Names: Mao Zedong, Lin Biao, Zhou Enlai, Liu Shaoqi, Jiang Qing, Kang Sheng, Xie Fuzhi, Deng Xiaoping, Chen Yi, He Long. Check: the chronology''s note 39 on the report resting on false evidence is the editors''.'
