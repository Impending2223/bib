- edit:
    id: cal.1966-10-25.china-leadership
    base: 'f8a733c5'
    set:
      c: 'Peking. Mao to the Central Work Conference, on the first and second fronts and on the Cultural Revolution. After Stalin''s death Malenkov could not hold, and revisionism came; hence a first and a second front; now it has bred "independent kingdoms," and the Eleventh Plenum changed it. Before it he was on the second front, leaving daily work to others to build their standing; he bears blame, for proposing the Secretariat and for trusting too much. Peking could not carry out his views, so the Wu Han criticism began in Shanghai. He lit the fire: one wall poster approved, a letter to the Tsinghua middle school Red Guards, a poster of his own; the movement only five months old; Liu Shaoqi and Deng Xiaoping not wholly to blame. Of Deng: deaf, he sits far from him at meetings and never seeks him out. Lin Biao speaks too; Zhou Enlai, Deng and Ye Jianying there.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 25, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 81 (Oct. 25, 1966; Zhou at the plenary session of the Central Work Conference, where Lin Biao and Mao speak); [[w.macfarquhar-maos-last-revolution]], 136, 139 (Mao describes the statements of the conference''s initial stage as "not really that normal" and extends it; in his final address he admits that changes have come at a remarkably fast pace, asks "Who wants to topple you?" and hopes things will be a bit better after the "seventeen-day conference"); [[w.jianguo-yilai-mao-zedong]], XVIII, 374–382 (Oct. 25, 1966; Mao''s speech, printed from his revised copy; he also says he caused the trouble: approved one wall poster, wrote a letter to the Tsinghua middle school Red Guards, wrote a wall poster of his own; the movement only five months old, may need two five-month spells or more; Liu Shaoqi and Deng Xiaoping not wholly to blame; this conference took seventeen days; note 1: on Nov. 1 he revised Chen Boda''s record of it, "not to be issued for now"); [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94 (in October 1966 Mao quotes himself as having asked about revisionism appearing in "Beijing"); [[w.deng-xiaoping-nianpu-1904]], III, 1933–1934 (Oct. 25, 1966; Deng at the plenary session of the Central Work Conference Mao presides over; Mao says that before the Eleventh Plenum he stood in the second line, not running daily work, many things left to others, and those in the first line handled them not so well, and that the first-line, second-line system is now changed, the Peking question in the main settled; he also shows his dissatisfaction with Deng: Deng is deaf, at a meeting sits far from him and never seeks him out); [[w.mao-zedong-zhuan]], VI, ch. 75 nn.16, 21 (Oct. 25 Mao''s speech to the conference, the summing up, n.21: first the history of the first and second fronts, set up because after Stalin''s death Malenkov could not hold and revisionism came; he took the second front before the Eleventh Plenum so that others might gain standing among the masses and the country not be shaken when he went to see Marx; it had not gone well; now changed, but the Red Guards do not yet know; the alarm at the Twenty-three Articles; his warning in Sept. and Oct. of 1965 that Peking might go revisionist; ''Peking''s problem can now be said to be basically solved''; second, the cultural revolution, only five months old, perhaps two five-month periods more; ''the movement reached your own heads''; ''who wants to overthrow you? I do not, nor perhaps the Red Guards''; the first stage''s speeches abnormal, n.16). [[w.yang-jisheng-tiandi-fanfu]], I, 302–303 (Oct. 25 Mao to the conference: "if one wants the country safe: Stalin died, Malenkov could not hold, trouble came, revisionism came, they had set up a first front and a second front; now I think it not so good; I was on the second front, others on the first, and so it was scattered; coming into the city it was no longer concentrated; with a first and a second front came quite a few independent kingdoms"; "I too am responsible: first, I proposed the Secretariat, and the first and second fronts in the Standing Committee; then, I trusted others too much"; "the fire of the cultural revolution was lit by me, in great haste, only a few months; it does not run smoothly, there are conflicts, which is natural"; to the cadres: "if the line is wrong, correct it; who wants to overthrow you? I do not, and I think the Red Guards need not either"; after the conference Chen Boda''s report goes down, and Mao''s Aug. 5 poster is published to the whole Party and country); [[w.jian-zhou-enlai]], 554 (Mao: the Cultural Revolution only six months old, understandable that many fail to see its need; "revolutionary movements are naturally legitimate"); [[w.liu-jixian-ye-jianying-nianpu]], II, 947 (Oct. 25, 1966; Ye Jianying 叶剑英 at the conference''s plenary); [[w.pu-weihua-zalan-jiu-shijie]], 200, 200 n.19, 203 n.24 (before the Eleventh Plenum he was on the second line, and those on the first did not handle things so well; now the system of first and second lines has changed; after the last meeting some places held no meetings, others were thrown into disorder by the Red Guards). Made public: 2006. Check: the book calls it his final address to the conference (139); the chronology has the conference close Oct. 28. Check: whether Mao''s words of October 1966 the book cites ([[w.nianyi-da-dongluande-niandai]], 113) are this speech''s (III, 445 n.94). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]] or [[w.nianyi-da-dongluande-niandai]] or the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.mao-zedong-sixiang-wan]], 275 (cited by [[w.macfarquhar-maos-last-revolution]], 136 n.11); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1451 (cited by [[w.macfarquhar-maos-last-revolution]], 139 n.24); Mao Zedong, address to the Central Work Conference, Oct. 25, 1966 ([[w.schoenhals-chinas-cultural-revolution-1966]], 5–9) (cited by [[w.macfarquhar-maos-last-revolution]], 139 n.25); Record of Mao Zedong''s speech of Oct. 25, 1966 at the Central Work Conference, sent to Mao by Chen Boda (Mao''s revisions and note of Nov. 1) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 378 n.1); [[w.nianyi-da-dongluande-niandai]], 113 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94c); Michael Schoenhals, communication to the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 445 n.94d); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议 (record 讲话记录), Oct. 25, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.21); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议 (record 讲话记录), Oct. 25, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.16); Mao Zedong, address to the Central Work Conference, Oct. 25, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 303 n.35); Mao''s speech at the Central Work Conference, October 25, 1966, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 150–151 (cited by [[w.jian-zhou-enlai]], 554 n.46); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 143 (1998) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 200 n.19). Names: Mao Zedong, Wu Han, Liu Shaoqi, Deng Xiaoping, Lin Biao, Zhou Enlai, Ye Jianying.'
