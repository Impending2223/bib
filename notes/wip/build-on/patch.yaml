- edit:
    id: cal.1966-08-04.china-leadership
    base: 'ad33eb63'
    set:
      c: 'Peking. Mao presides over an enlarged Standing Committee meeting. The Center broke its own order (to suspend classes six months); the "mass line" and "trusting the masses" were fakes; some stood on the bourgeois side against the proletariat. Liu Shaoqi: "I bear the main responsibility in Peking." Mao: you ran a dictatorship in Peking; a directional error, in truth the bourgeois standpoint. Ye Jianying: millions of troops, no fear of ghosts. Mao: the ghosts are in this room. He ends the plenary day; the group meetings to hear it passed on. The Fujian Hall of the Great Hall. Liu: at worst he steps down, and there are five things he does not fear. Zhou Enlai, Deng Xiaoping and Chen Boda there; the plenum extended a week.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 4, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 4, 1966; Zhou present, after the Cultural Revolution Group''s meeting; Mao on the work groups, a question of direction and line); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966; Liu attends the enlarged Standing Committee meeting Mao calls, where Mao makes a still sharper charge on the sending of work groups: the Center broke its own order, it ordered classes suspended for half a year to do only the cultural revolution, and when the students rose it suppressed them; lightly put it is a question of direction, in fact one of line, a line error that violates Marxism; ox-ghosts and snake-spirits are in this room; Liu again takes responsibility, saying it is no more than stepping down, he is not afraid of that and has "five nots" of fear); [[w.macfarquhar-maos-last-revolution]], 89–90 (Mao calls an unscheduled enlarged Standing Committee meeting on the afternoon of Aug. 4; "suppression and terror", originating with the center; Chen Boda speaks for the Cultural Revolution Group; "You exercised dictatorship [here] in Beijing. Well done!"; the plenum is formally extended by a week, and the delegates meet in small groups from Aug. 4 to 6 to discuss Mao''s criticism, without warm support); [[w.deng-xiaoping-nianpu-1904]], III, 1928 (Aug. 4, 1966; 下午; Deng attends the enlarged Politburo 政治局 Standing Committee 政治局常委会 meeting Mao presides over, at which Mao again severely criticizes the sending of work teams); [[w.mao-zedong-zhuan]], VI, ch. 74 n.59 (Aug. 4 Mao summons an enlarged meeting of the Standing Committee and criticizes the leaders of the first line: the Center went against its own order stopping classes for half a year, and when people rose put them down; the mass line, trust in the masses, Marxism-Leninism all false; standing plainly on the bourgeois side against the proletariat; Liu Shaoqi says that in Peking the main responsibility is his, Mao: you ran a dictatorship in Peking, a directional error, in fact the bourgeois stand; Ye Jianying''s millions of troops, Mao: the ghosts are right here; at the end Mao ends the plenary meeting for the day, the group meetings to hear it relayed, n.59). [[w.yang-jisheng-tiandi-fanfu]], I, 221 (Aug. 4 Mao presides over an enlarged Standing Committee meeting and severely criticizes sending work groups as "suppression of the student movement," a matter of direction, in fact of line, a line error, against Marxism; "suppression, terror, and the terror comes from the Center"; Liu takes the responsibility, and Mao presses: "you ran a dictatorship in Peking, and ran it well"; Liu answers to his face: "it comes to no more than stepping down, I do not fear stepping down, there are five things I do not fear"; Mao: "there are ghosts and monsters in this room"; the plenary session set for that day is not held); [[w.jian-zhou-enlai]], 549 (Mao and Liu, side by side, quarrel "in an inflammatory mood"; Mao: "the party leadership has violated its own commitments"; "Mass line? Trusting the masses? Believing in Marxism-Leninism? All are false!"; Liu: "I am in Beijing, so I should bear the main responsibility"; Mao: "You have established a bourgeois dictatorship in Beijing!"; "Among those sitting here today are evil elements and monsters!"); [[w.chen-yun-nianpu-xiuding]], III, 154 (Mao sharply calls the work teams'' sending a suppression of the student movement, a question of direction and a line error: "the ghosts and monsters are among those sitting here"); [[w.pu-weihua-zalan-jiu-shijie]], 190–192, 191 n.10 (the plenary set for the afternoon is turned into group meetings; that afternoon the enlarged Standing Committee meets in the Fujian Hall of the Great Hall; Mao: under the Qing, the Beiyang armies and the Guomindang students were suppressed, and now the Communist Party; the Center broke its own order; a question of direction and line; the Nie poster a manifesto of the Peking Commune; Li Xuefeng''s "inside and outside differ"; Liu: "I bear the main responsibility"; Mao: you ran a dictatorship in Peking; Liu: at worst stepping down, the "five not-afraids" (191 n.10: Liu later examined himself for it); Ye Jianying''s millions of troops; Mao: "the ox-demons and snake-spirits are among those present"; Mao ends the day''s plenary; the groups to hear it conveyed). Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 52–53 (cited by [[w.macfarquhar-maos-last-revolution]], 89 n.14); [[w.xin-jiehou-changyi]], 56 (cited by [[w.macfarquhar-maos-last-revolution]], 90 n.15); Record of the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议记录, Aug. 4, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.59); Mao Zedong, remarks at the enlarged Standing Committee meeting, Aug. 4, 1966, in [[w.wenge-shinian-ziliao-xuanbian]], as quoted in [[w.wenqian-wannian-zhou-enlai]], 125 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 221 n.7a, 7b, 8); [[w.qi-benyu-huiyilu]], 456 (cited by [[w.jian-zhou-enlai]], 549 n.27); [[w.jin-chongji-liu-shaoqi-zhuan]], 1035–1036 (cited by [[w.jian-zhou-enlai]], 549 n.28b); [[w.liu-shaoqi-yanjiu]], 173 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 191 n.10). Names: Mao Zedong, Liu Shaoqi, Ye Jianying, Zhou Enlai, Deng Xiaoping, Chen Boda.'
