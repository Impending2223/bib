- edit:
    id: cal.1967-02-16.china-leadership-6
    base: '41f2aaf4'
    set:
      c: 'Zhou Enlai, ending the Huairen Hall meeting, tells Wang Li to draft at once a record of it for the Politburo and Group members who were not there. At seven. Wang Li, Zhang Chunqiao and Yao Wenyuan write it, Wang holding the pen; Chen Boda and Zhou revise it; 15 copies printed, the type broken up.'
      n: '[[w.macfarquhar-maos-last-revolution]], 194 n.66 (at seven o''clock, 194); [[w.yang-jisheng-tiandi-fanfu]], I, 390 (Wang Li, Zhang Chunqiao and Yao Wenyuan write up the meeting, Wang holding the pen; Chen Boda and Zhou revise it, Zhou adding several short interjections, among them his "Come back! Sit down" to Tan Zhenlin and, after Chen Yi on Yan''an, "it was right to criticize me"; Wang Li and Guan Feng have Wang Guangyu 王廣宇 of the Group''s office set it in type with a trusted printer, 15 copies, the type broken up at once; signed "recorded afterward by Zhang Chunqiao, Wang Li, Yao Wenyuan"; that night Wang Li gives Wang Guangyu a list of about ten to receive it, Mao, Lin Biao and Zhou among them, Jiang Qing and Qi Benyu too); [[w.teiwes-tragedy-of-lin-biao]], 76 (the "putting heads together" meetings of early and mid-February, chaired by Zhou because Lin is absent, the marshals and Vice Premiers on one side of the table, the Cultural Revolution Group on the other). Made public: 2006. To check: Wang Guangyu 王廣宇, 〈我是「二月逆流」會議記錄稿的唯一見證人〉, in Yan Changgui 閻長貴 and Wang Guangyu, *Wenshi qiuxin ji* 《問史求信集》 (Hongqi chubanshe 紅旗出版社, 2009), 193 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 390 n.9); the record of the Huairen Hall meeting of Feb. 16 《2月16日懷仁堂記錄》 (cited by [[w.wenqian-wannian-zhou-enlai]], 202, 210) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 390 n.10a); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E10–15 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35a); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 21–22, 1984 (FBIS, Nov. 6, 1984, K22–24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35b); [[w.baocun-tan-zhenlin-wai-zhuan]], 128 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35c). See [[cal.1967-02-16.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan, Chen Boda. Check: the note (194 n.66) names no source for the instruction.'
