- edit:
    id: cal.1966-05-19.china-leadership-3
    base: 'a8bfa4d8'
    set:
      c: 'Peng Zhen, in a five-minute reply to the enlarged Politburo meeting: he never dreamed of a coup; let the Center find any improper tie between him, Luo Ruiqing and Lu Dingyi. He admits errors, refuses the charges of subverting the Center and secret ties abroad. Then the meeting falls on him: Kang Sheng, Lin Biao, Chen Boda, He Long, Zhang Dingcheng, Yang Chengwu, Li Xiannian, Chen Yi, Bo Yibo, Liu Shaoqi, Nie Rongzhen and others; Li Xiannian: "Peng''s crux is the coup."'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 459; [[w.peng-zhen-nianpu-1902]], IV, 486 (May 19, 1966; Peng Zhen, in a short self-criticism, admits errors but refuses the charges Lin Biao forces on him: a coup, subverting the Center, secret ties abroad, he never dreamed of; whether he had anti-Party ties with Luo Ruiqing and Lu Dingyi, let the Center examine); [[w.pu-weihua-zalan-jiu-shijie]], 87–88 (the morning of May 19, five minutes; the meeting falls on him: Kang Sheng, Lin Biao, Chen Boda (the "four families" of Peng, Luo, Lu and Yang), He Long, Zhang Dingcheng, Yang Chengwu, Li Xiannian ("Peng''s crux is the coup"), Chen Yi; Bo Yibo, Liu Shaoqi, Liao Hansheng, Nie Rongzhen, Cai Chang, Yu Qiuli, Qian Ying, Zhou Rongxin and Yang Yong speak too). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 16–18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.159b). Names: Peng Zhen, Luo Ruiqing, Lu Dingyi, Kang Sheng, Lin Biao, Chen Boda, He Long, Li Xiannian, Chen Yi, Bo Yibo, Liu Shaoqi, Nie Rongzhen.'
      src:
