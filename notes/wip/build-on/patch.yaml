- edit:
    id: cal.1966-07-31.china-leadership
    base: 'fe235b0e'
    set:
      c: 'Mao replies to the Red Guards of the Middle School attached to Tsinghua University on their posters of June 24 and July 4 ("Long live the revolutionary spirit of rebellion"): warm support; "to rebel against reactionaries is justified"; unite all who can be united; give the erring work and a way to remake themselves; the proletariat must free all mankind. He asks the standing members to say whether it is right. Dated Aug. 1; not sent to the Red Guards then, but circulated as a plenum document. To Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda and fifteen others: "if wrong, please correct me." It backs too the Red Flag combat group of the middle school attached to Peking University and Peng Xiaomeng''s speech for it of July 25.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 31, 1966; [[w.macfarquhar-maos-last-revolution]], 87–88 (the letter, "To rebel is justified", answering two big-character posters the Tsinghua Red Guards sent July 28 with a covering letter; circulated to the plenum Aug. 1); [[w.macfarquhar-maos-last-revolution]], 106 (in early August Mao gives the Tsinghua middle school Red Guards his "ardent support"); [[w.jianguo-yilai-mao-zedong]], XVIII, 301–303 (July 31, 1966; Mao''s note of July 31 and the reply he revised, dated Aug. 1, printed from the revised copy; the reply also supports the poster of the Red Flag combat group of the middle school attached to Peking University and the speech Peng Xiaomeng 彭小蒙 made for it July 25; note 1: the reply not sent but spread fast; the posters printed in *Hongqi* no. 11, Aug. 21, retitled, and in *Renmin ribao* Aug. 24); [[w.deng-xiaoping-nianpu-1904]], III, 1927 (July 31, 1966; Mao writes to Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda and fifteen others: ''please consider whether this item (footnote 1: his letter to the Red Guards of the Middle School attached to Tsinghua University, expressing ''warm support'' for the views of their big-character posters) and its attachments (footnote 2: the Red Guards'' posters of June 24, "Long live the spirit of revolutionary rebellion", and of July 4, "Again on the spirit of revolutionary rebellion") are correct; if wrong, please correct me''); [[w.mao-zedong-zhuan]], VI, ch. 74 n.58 (Aug. 1, Mao''s letter to the Red Guards of the Tsinghua middle school, praising their ''spirit of revolutionary rebellion'' in three posters; ''to rebel against reactionaries is justified'', warm support; the same for all who take the same revolutionary attitude; unite all who can be united; those who have made grave errors to be given work and a way to start anew; the letter was not sent but printed as a document of the Eleventh Plenum and spread quickly outside, n.58). [[w.yang-jisheng-tiandi-fanfu]], I, 237 (Mao dictates 口授 the letter July 31: "I express to you my warm support"; "I and my revolutionary comrades take the same attitude; in Peking and in the country, in the cultural revolution, all who take your revolutionary attitude we support warmly"; to guard the young from going too far he tells them to unite all who can be united and to leave a way out to those who have erred; the letter is published to the Party''s high levels as a document of the Eleventh Plenum; Mao thereby approves the Red Guards as an organization); [[w.yang-jisheng-tiandi-fanfu]], II, 1144 (Aug. 1, the letter''s date: Mao writes the Red Guards of the Tsinghua middle school, praising their "revolutionary rebel spirit"); [[w.jian-zhou-enlai]], 548 (dated Aug. 1: "I express my warm support to you"; all of the same revolutionary attitude to be warmly supported); [[w.dikotter-cultural-revolution]], 71 n.15 ("on 1 August," a personal note of support: "To Rebel is Justified!"); [[w.pu-weihua-zalan-jiu-shijie]], 204–205, 205 n.25 (the morning of Aug. 1 the plenum prints the letter with the two posters; the text in full; written July 31 by the *Wengao*, revised Aug. 1 (205 n.25)). Made public: Aug. 1966 (circulated with the plenum papers); the Red Guards'' posters in *Hongqi*, no. 11, Aug. 21, 1966. Check: MacFarquhar (87, 87 n.9) says the letter also praised the Red Guards of the middle school attached to Peking University, the "Red Flag Combat Team". Check: the day; Yang has Mao dictate the letter July 31 (I, 237) and write it Aug. 1 (I, 231). To check: [[w.schram-mao-tse-tung-unrehearsed]], 260–261 (cited by [[w.macfarquhar-maos-last-revolution]], 88 n.9a); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1435 (cited by [[w.macfarquhar-maos-last-revolution]], 88 n.9b); [[w.wenhua-dageming-yanjiu-ziliao]], I, 63–65 (cited by [[w.macfarquhar-maos-last-revolution]], 88 n.9c); Red Guards of the middle school attached to Tsinghua University, big-character poster "Long live the revolutionary spirit of rebellion," June 24, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 303 n.3a); Red Guards of the middle school attached to Tsinghua University, big-character poster "Again on long live the revolutionary spirit of rebellion," July 4, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 303 n.3b); Mao Zedong 毛泽东, letter to the Red Guards of the Middle School attached to Tsinghua University 清华大学附中红卫兵, Aug. 1, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.58); Luo Xiaohai 駱小海, preface to Song Bolin 宋柏林, *Hongweibing xingshuai lu* 《紅衛兵興衰錄》 (Desai chubanshe 德賽出版公司, Hong Kong, 2006), 22 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 237 n.43); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 87–88 (cited by [[w.jian-zhou-enlai]], 548 n.24). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda.'
