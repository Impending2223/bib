- edit:
    id: cal.1968-03-12.robert-kennedy-campaign
    base: '4def00b8'
    set:
      c: 'New York, the night of New Hampshire''s vote. Robert Kennedy, after speaking at a United Jewish Appeal dinner, at "21" with Schlesinger and vanden Heuvel: the result no surprise, his decision now the more urgent. McCarthy''s success has boxed him in; of McCarthy: "I don''t blame him at all." He telephones Goodwin.'
      n: '[[w.chester-american-melodrama]], 119; [[w.white-making-of-the-president-1969]], 162 (a dinner in the Bronx; at a restaurant with vanden Heuvel, Schlesinger and Tom Johnston; Kennedy to Goodwin by telephone); [[w.shesol-mutual-contempt]], 417–18 (at "21" with Schlesinger and Moyers; Moyers on the way: the White House "impenetrable," "four more years of Johnson would be ruinous"; McCarthy "done a great job in opening the situation up"); [[w.thomas-robert-kennedy]], 359 (supper at "21," late; McCarthy''s 42 percent; Kennedy''s gloom); [[w.schlesinger-robert-kennedy-and-his]], 848–49 (Moyers to Schlesinger on the way: Johnson sealed off, "four more years of Johnson would be ruinous," Kennedy''s going a mistake; at "21," McCarthy''s success has boxed Kennedy in); [[w.schlesinger-journals]], 280, 286 (dinner at Ham Armstrong''s, "on the night of the New Hampshire primary" (286): Moyers to Schlesinger, Johnson "well sealed off from reality," the White House "impenetrable," "paranoid," four more years of Johnson "ruinous for the country"; later, Robert Kennedy at the 21 Club with vanden Heuvel and Tom Johnson, "a little subdued"; McCarthy''s success had boxed him in: "I don''t blame him at all"; Schlesinger''s suggestion that he endorse McCarthy; not the city, the United Jewish Appeal dinner or "no surprise"); [[w.witcover-85-days]], 66–67 (Tuesday, the plane to New York at 5:30, the United Jewish Appeal dinner, a late supper at "21" with Schlesinger and vanden Heuvel; not Kennedy''s words about the result). Names: Robert Kennedy, Schlesinger, vanden Heuvel, McCarthy, Goodwin.'
