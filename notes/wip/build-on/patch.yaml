- edit:
    id: cal.1964-07-14.elections-1964
    base: '7c888790'
    set:
      c: 'The platform fight. Scranton''s amendments rejected: civil rights, 897–409 (Check); extremism, naming the Birch Society; civilian control of nuclear weapons. Rockefeller, speaking for the extremism amendment, booed and shouted down from the floor and galleries. Eisenhower, the same day, against "sensation-seeking columnists and commentators." Rockefeller''s five minutes at the rostrum: "This is still a free country, ladies and gentlemen." Romney''s amendments defeated too. The platform read for ninety minutes.'
      n: '[Republican Party Platform of 1964](https://www.presidency.ucsb.edu/documents/republican-party-platform-1964) (July 13, 1964). [[w.perlstein-before-the-storm]], 381–84 (the platform fight, the vote, Rockefeller); [[w.young-two-suns-of-the]], 103 (Eisenhower; the amendments lost; Rockefeller booed); [[w.white-suite-3505]], 397–99 (the amendments; the civil rights roll call, 897 to 409); [[w.white-making-of-the-president-1965]], 199–202 (Eisenhower''s added lines on columnists and on the criminal with a switchblade; the platform read for ninety minutes; Rockefeller''s five minutes on extremism, "This is still a free country"; Romney''s compromise; White''s trailer, sixteen walkie-talkies and thirty telephone lines); [[w.branch-pillar-of-fire]], 401–02 (Eisenhower); [[w.goldberg-barry-goldwater]], 203–4 (the evening of July 14; the platform''s civil rights plank, "full implementation and faithful execution" of the act, against "inverse discrimination"; Vietnam, "We will move decisively to assure victory"; Romney''s amendments cleared with Rhodes, Fannin and Kleindienst, defeated too; Rockefeller booed by the galleries: "This is still a free country ladies and gentlemen"; Donaldson of ABC: "The ''bund'' booed louder"; Javits chilled by "the beginnings of an American totalitarianism"); [[w.smith-on-his-own-terms]], 451 (his televised appeal for moderation shouted down); [[w.bernstein-guns-or-butter]], 130 (Rockefeller''s five minutes; the Birch Society named, its lobbyist claiming 100 delegates; "These things have no place in America"); [[w.novak-agony-of-the-g]], 450–54 (Eisenhower, after Laird, for the platform unchanged; Tower and "faithful execution"; Rockefeller at the rostrum at 8:54 p.m., booed from the galleries; civil rights 897 to 409; Romney''s planks his own; Walter of Washington and Shadegg); [[w.dallek-flawed-giant]], 132 (Eisenhower on the columnists; Rockefeller shouted down); [[w.mann-grand-delusion]], 343 (the platform, mid-July: Johnson "encouraged an increase of aggression in South Vietnam by appearing to set limits on America''s willingness to act"; the party to "move decisively to assure victory in South Vietnam while confining the conflict as closely as possible"; not the day, the platform fight, the amendments, the votes, Rockefeller or Eisenhower). [[w.kabaservice-rule-and-ruin]], 112–13 (the three amendments; civil rights lost 897–409; Rockefeller shouted down: "It is still a free country"). Check: Branch quotes Eisenhower against "maudlin sympathy for the criminal ... roaming the streets with switchblade knife" (401). To check: [[w.white-making-of-the-president]], 199 (cited by [[w.branch-pillar-of-fire]], 401); [[w.ambrose-eisenhower]], 652 (cited by [[w.branch-pillar-of-fire]], 401). See [[cal.1964-07-13.elections-1964]]. Names: Scranton, Rockefeller, Eisenhower, Romney.'
