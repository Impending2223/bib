- edit:
    id: cal.1965-01-04.china-leadership
    base: '21ddb7f7'
    set:
      c: 'The Third National People''s Congress closes its first session: approves the Government Work Report, the main targets of the 1965 plan and the preliminary budget; elects Liu Shaoqi President of the Republic and Zhu De chairman of the Standing Committee; Zhou continues as Premier. Zhu De presides over the closing; Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen and Soong Ching-ling there. Sixteen Vice-Premiers named: Lin Biao, Chen Yun, Deng Xiaoping, He Long, Chen Yi, Ke Qingshi, Ulanhu, Li Fuchun, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Bo Yibo, Lu Dingyi, Luo Ruiqing, Tao Zhu and Xie Fuzhi; the thirteen vice-chairmen of the National Defense Council, Deng and Ye Jianying among them. Peng Dehuai no longer Vice-Premier.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 696 (Jan. 4, 1965); [[w.deng-xiaoping-nianpu-1904]], III, 1842 (Jan. 4, 1965; afternoon, 下午; Deng at the closing session of the First Session of the Third NPC, which approves the resolution on the Government Work Report, the main targets of the 1965 plan and the preliminary arrangement of the 1965 budget, and elects the Vice-Premiers and the Vice-Chairmen of the National Defense Council, Deng among both); [[w.peng-zhen-nianpu-1902]], IV, 384–385 (Jan. 4, 1965, afternoon; those present, the resolutions, the vice-premiers and vice-chairmen); [[w.jian-zhou-enlai]], 520 (Zhou again named premier "at a plenary session of the National People''s Congress," "In late December," so Chen); [[w.liu-jixian-ye-jianying-nianpu]], II, 927 (Jan. 4, 1965; the session closes in Peking 北京, and by Chairman Liu Shaoqi''s 刘少奇 order no. 3 Ye Jianying 叶剑英 is named a vice-chairman of the National Defense Council 国防委员会); [[w.zhu-de-nianpu-xinbian]], III, 1927–1928 (Jan. 4, 1965; Zhu De 朱德 presides over the closing, at which the session adopts the reports and resolutions and names the sixteen Vice-Premiers 国务院副总理 and the thirteen vice-chairmen of the National Defense Council 国防委员会; with Mao Zedong 毛泽东, Liu Shaoqi 刘少奇 and others, he receives all the deputies); [[w.chen-yun-nianpu-xiuding]], III, 147 (the Congress keeps Zhou Enlai Premier and names Lin Biao, Chen Yun, Deng Xiaoping and others, sixteen, vice-premiers); [[w.peng-dehuai-nianpu]], 784 (Dec. 20, 1964–Jan. 4, 1965: the first session of the Third National People''s Congress 全国人民代表大会第三届第一次会议 at Peking 北京 removes Peng Dehuai 彭德怀 as vice-premier of the State Council 国务院副总理). Names: Zhou Enlai, Liu Shaoqi, Zhu De, Mao Zedong, Deng Xiaoping, Peng Zhen, Lin Biao, Chen Yun, He Long, Chen Yi, Ke Qingshi, Li Fuchun, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Bo Yibo, Lu Dingyi, Luo Ruiqing, Tao Zhu, Xie Fuzhi, Ye Jianying, Peng Dehuai.'
