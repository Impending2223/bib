- edit:
    id: cal.1962-01-16.china-leadership-8
    base: '7ef41410'
    set:
      c: 'Tian Jiaying 田家英 to Yang Shangkun 杨尚昆: Liu and Deng have spoken to Mao 毛泽东; Mao sets up a drafting committee 起草委员会 of 20, to settle first what the main contradiction is, then write; it meets the next day at 3 p.m. By Yang Jisheng, under Liu Shaoqi: Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Bo Yibo, Chen Boda, Ke Qingshi, Li Jingquan, Song Renqiong, Ulanfu, Tao Zhu, Liu Lantao, Wang Renzhong and others.'
      n: '[[w.yang-shangkun-riji]], II, 113 (Jan. 16, 1962); [[w.yang-jisheng-tiandi-fanfu]], I, 66 (Mao proposes a new drafting committee of 21 under Liu Shaoqi: Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Bo Yibo, Chen Boda, Ke Qingshi, Li Jingquan, Song Renqiong, Ulanfu, Tao Zhu, Liu Lantao, Wang Renzhong and others). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: [[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], 75 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 66 n.57). See [[cal.1962-01-16.china-leadership]]. Names: Tian Jiaying, Yang Shangkun, Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Bo Yibo, Chen Boda, Ke Qingshi, Li Jingquan, Tao Zhu.'
