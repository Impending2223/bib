- edit:
    id: cal.1964-06-19.civil-rights-bill
    base: 'b7a86332'
    set:
      c: 'Senate passes the civil rights bill, [73–27](https://voteview.com/rollcall/RS0880409): Republicans 27–6, Democrats 46–21; of the eleven Southern States'' Senators, Yarborough alone for. The Mansfield–Dirksen substitute adopted June 17, [76–18](https://voteview.com/rollcall/RS0880407); Gore''s motion to recommit refused, [25–74](https://voteview.com/rollcall/RS0880408). Goldwater, June 18: "no constitutional basis" for the public accommodations and employment titles. He votes against. All one hundred present, Engle, ill, among them; Bennett, Bible, Hayden and Young for, after voting against cloture; Cotton and Hickenlooper against. Last speeches by Humphrey, Mansfield and Dirksen.'
      n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-2-1.pdf) (1964); [June 19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-3-2.pdf). Statement by the President Following Senate Passage of the Civil Rights Bill, [1963–64 Pub. Papers 787](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=871) (June 19, 1964). [[w.perlstein-before-the-storm]], 363–64 (Goldwater; Dirksen, June 19); [[w.branch-pillar-of-fire]], 357; [[w.humphrey-education-of-a-public-1976]], 285 (final passage; the toast in Mansfield''s office); [[w.solberg-hubert-humphrey]], 226–27 (the passage; to Lippmann, "most significant piece of legislation of this century"); [[w.kabaservice-rule-and-ruin]], 98, 101–2 (the vote; Goldwater one of the six Republicans against; his "federal police state of mammoth proportions"); [[w.white-suite-3505]], 370–71, 429–31 (Goldwater''s speech of June 18; its text, Appendix B); [[w.sundquist-politics-and-policy]], 270 (the vote, 73–27; Goldwater); [[w.mann-walls-of-jericho]], 427–28 (the substitute, 76–18, June 17; the vote, 73–27); [[w.white-making-of-the-president-1965]], 177 n.5 (7:49 p.m., 73 to 27); [[w.kotz-judgment-days]], 152 (73–27; Goldwater against, advised by Rehnquist and Bork); [[w.goldberg-barry-goldwater]], 197 (one of twenty-seven against: "fundamentally a matter of the heart. The problems of discrimination can not be cured by laws alone"; "If my vote is misconstrued, let it be, and let me suffer its consequences"); [[w.zelizer-fierce-urgency-of-now]], 128 (73–27, 7:49 p.m.; Dirksen''s speech; Russell: "overwhelmed and gagged"); [[w.bernstein-guns-or-butter]], 77 (73 to 27; Goldwater, June 18: "My basic objection . . . is constitutional"); [[w.whalen-longest-debate]], 211, 212–15 (76–18, forty-six Democrats and thirty Republicans; Gore''s motion; Goldwater''s speech; 7:40 p.m.); [[w.albert-little-giant-1990]], 286 (the Senate''s final passage, 73 to 27, June 19, a year to the day after Kennedy sent the bill; not the party divisions); [[w.civil-rights-rules-hearing-h-res-789]], 3–10 (Celler, June 30: the Senate''s changes to the House bill, title by title); [[w.risen-bill-of-the-century]], 237 (June 19, all one hundred senators present, Engle bedridden; 73 for, 27 against, Bennett, Bible, Hayden and Young for after voting against cloture, Cotton and Hickenlooper against; Humphrey, Mansfield and Dirksen''s last speeches; Mansfield will not stand for the photographs; Gore''s motion to send the bill to Judiciary beaten "overwhelmingly" that morning; not the party counts); [[w.purdum-idea-whose-time-has-2014]], 307–10 (the substitute adopted June 17, 76–18 (307); Goldwater, June 18, against the bill though he opposes "discrimination of any sort": it would "require the creation of a federal police force of mammoth proportions" (308–09); Gore''s motion to recommit, 25–74; at 7:40 p.m., 73–27, all but six of the thirty-three Republicans, forty-six of the sixty-seven Democrats; not Yarborough, nor Goldwater''s "no constitutional basis" nor his vote). Humphrey''s call before the vote: [[cal.1964-06-19.civil-rights-bill-4]]. The Senate sat from noon to 8:10 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=1), [D288](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=286). To check: H.R. 7152 as amended by the Senate, June 19, 1964 (the engrossed Senate amendment; not printed in the Record; the House concurred without amendment on July 2, so its text is the Act''s, Pub. L. No. 88-352, 78 Stat. 241–68; no separate open print found). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Yarborough, Gore, Mansfield, Dirksen, Goldwater, Johnson, Engle, Bennett, Bible, Hayden, Cotton, Hickenlooper, Humphrey. Check: the page.'
