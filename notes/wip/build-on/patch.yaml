- edit:
    id: cal.1966-08-05.china-leadership
    base: '50ca3dd8'
    set:
      c: 'Mao writes on a copy of the *Beijing ribao* of June 2 "Bombard the Headquarters: My Wall Poster": the first Marxist-Leninist poster and the commentator''s article well written; for fifty-odd days some leaders from the Center to the localities did the reverse, on a reactionary bourgeois standpoint, ran a bourgeois dictatorship, beat down the movement, spread terror; recalls the right deviation of 1962 and the "left in form, right in essence" of 1964. A plenum document, to county and regiment level Aug. 17; printed Aug. 5, 1967. In pencil, beside the reprinted *Renmin ribao* editorial "Sweep away all ox-demons and snake-spirits"; his secretary Xu Yefu''s fair copy, the title added.'
