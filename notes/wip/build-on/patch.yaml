- edit:
    id: cal.1966-01-12.program
    base: 'c195cdcd'
    set:
      c: 'State of the Union, to a joint session, 9 p.m. "I believe that we can continue the Great Society while we fight in Vietnam." Asked: health and education carried forward; the war on poverty pressed; a Department of Transportation and a Highway Safety Act; whole slum areas of several cities rebuilt; whole river basins cleaned; jury discrimination ended, crimes against civil rights workers made federal, discrimination in housing outlawed; 14(b) repealed; four-year terms for the House; truth in packaging and in lending; campaign finance reformed. For the war, the automobile and telephone excise cuts of Jan. 1 restored and taxes collected faster. Expenditures $112.8 billion, deficit $1.8 billion. Vietnam: "For 20 days now" no bombs on the North; "we will stay until aggression has stopped." Aid to nations trying to control population growth. Fifty-nine ovations; Watson to start the clapping. Lady Bird Johnson in the gallery.'
      n: 'Annual Message to the Congress on the State of the Union, [1966 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79) (Jan. 12, 1966). [[w.dallek-flawed-giant]], 299–302 (the address; poverty, cities, rivers, transportation, truth in lending, four-year terms; the deficit); [[w.califano-triumph-and-tragedy-of]], 117–20 (drafts Jan. 5–11; Goodwin will not go to the Capitol; the bedroom at 7:15 a.m., "cut by a third"; Clifford and Fortas that afternoon; the sentence on strikes, aimed at Lindsay; 59 interruptions, Watson to start the clapping; the four-year term, Celler on his hands); [[w.branch-at-canaans-edge]], 416–17 (59 ovations in the House, 417); [[w.zelizer-fierce-urgency-of-now]], 225–26 ("This nation is mighty enough . . . to pursue our goals in the rest of the world while still building a Great Society here at home"; a budget of $112.8 billion); [[w.bernstein-guns-or-butter]], 321–22 (the program asked; the day''s drafting: the "final" draft rejected by 7:15 a.m., Fortas and Clifford over it in the afternoon); [[w.bernstein-guns-or-butter]], 312; [[w.graham-uncertain-triumph]], 118; [[w.wofford-of-kennedys-and-kings]], 316 ("I believe that we can continue the Great Society while we fight in Vietnam," to Congress in January 1966); [[w.mann-grand-delusion]], 476–77 (State of the Union, Jan. 12: "For twenty days now, we and our Vietnamese allies have dropped no bombs in North Vietnam"; emissaries to forty countries; "no arbitrary limits to our search for peace"; any conference table, "four points or fourteen or forty"); [[w.johnson-white-house-diary]], 351–52 (Mrs. Johnson in the gallery: four-year terms for the House; aid to nations controlling population growth, "the first time a President has declared himself on the birth control issue"; "We must change to master change"; "three hundred private talks for peace in Vietnam" in 1965, no bombs "for twenty days"; about fifty-seven applauses; "almost no participation by the Republicans"; no approval from Russell or McClellan, "scant occasional expression" from Mansfield; she meets Johnson in the Speaker''s office afterward; not the hour or the text beyond these). Check: Bernstein, 321, gives 9:04 p.m. To check: [*New York Times*, Jan. 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/01/13/issue.html), at 1, 14 (cited by [[w.branch-at-canaans-edge]], 416); Vital Speeches of the Day, Vol. 32, pp. 226–30 (cited by [[w.branch-at-canaans-edge]], 416); "Ban on Color Line in Housing Asked/ President Also Seeks Law for Federal Penalties in Civil Rights Murders," [*New York Times*, Jan. 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/01/13/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 416). See [[cal.1965-01-04.program]]; [[cal.1965-12-24.vietnam]]. Names: Johnson, Watson, Lady Bird Johnson.'
