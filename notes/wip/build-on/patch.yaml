- edit:
    id: cal.1964-12-15.china-leadership
    base: 'bab032f6'
    set:
      c: 'The Central Work Conference opens, Beijing, the Hall of the People, Hebei Hall, afternoon, Mao presiding (to Jan. 14, 1965): on the rural socialist education movement, to adopt a document on it. Zhou Enlai on Khrushchev''s fall and the Moscow trip: Brezhnev follows Khrushchevism without Khrushchev, new struggles to be prepared. Liu Shaoqi opens the movement''s problems. Mao interjects: this is a plenum, enlarged; he is for clearing out some millions of Party members; no levy on grain where concealed land is reported. A plenary every afternoon at 3:30. Liu raises Tao Zhu''s letter on a new rich stratum. Deng Xiaoping, Peng Zhen and Zhu De attend; Chen Yun absent, ill.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 15, 1964 (the session), and Dec. 15, 1964–Jan. 14, 1965 (the conference). [[w.zhou-enlai-nianpu-1949]], II, 692–93 (Dec. 15, 1964: Zhou, at the Central Work Conference, reports on the Moscow visit and the Sino-Soviet party talks; says China must first do its own work well, lay the base at home and finish the socialist education movement, to have more strength in the world (Dec. 15–28; the conference met on rural socialist education)); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 609 (Dec. 15, 1964–Jan. 14, 1965; Liu attends the national work conference the Politburo calls; Mao criticizes the leadership method of the movement''s first stage); [[w.macfarquhar-origins-of-the-cultural]], III, 419 (the conference opens on Dec. 15 with Liu Shaoqi''s report on the movement''s problems, then breaks into small groups); [[w.deng-xiaoping-nianpu-1904]], III, 1839 (Dec. 15, 1964–Jan. 14, 1965; Deng attends the Central Work Conference 中央工作会议 Mao presides over; its main subject is the present rural socialist education movement, the adoption of papers on it and the solving of problems of the movement''s former stage; from Mao''s repeated remarks the conference''s minutes, ''Some problems now raised in the rural socialist education movement'', are put together in draft, listing twenty-three problems, later called the ''Twenty-three Articles''; on Dec. 15–19 Deng attends the plenary every afternoon); [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 15 the Central Work Conference, Dec. 15–28, from the Standing Committee''s decision of Nov. 25; Mao presides in the afternoon; Liu raises Tao Zhu''s letter on a new rich stratum, the length of the front, landlord families in the organs; Mao: no extra levy on grain; Zhou: none in the whole period (n.34)). [[w.yang-jisheng-mubei]], II, 1144 (the Central Work Conference, Dec. 15, 1964 to Jan. 14, 1965, held to discuss the four cleans and draw up the 23 Articles); [[w.peng-zhen-nianpu-1902]], IV, 378 (Dec. 15, 1964–Jan. 14, 1965; Peng Zhen at the Central Work Conference, chiefly on rural socialist education; Mao criticizes the movement''s leaders for an unclear view of the struggle''s nature, human-sea tactics and no mass line; set to end Dec. 28, it runs into January over Mao''s and Liu Shaoqi''s differences on its nature and methods; at its end Mao revises "Some current problems raised in the rural socialist education movement" (the "Twenty-three Articles"): most cadres good or fairly good, the lightly "unclean" freed soon; teams to rely on the masses and cadres, a three-way union; some "left" deviations corrected; but the stress "整党内那些走资本主义道路的当权派," in front of or behind the scenes, with backers below and above, even in the provinces and central departments; issued Jan. 14, 1965 to the provincial committees, the central ministries'' Party groups and the General Political Department); [[w.jian-zhou-enlai]], 518 (at the conference Liu speaks on the movement and Mao interrupts him again and again: "bourgeois" in "new bourgeois elements" the peasants do not understand; against Liu''s wish to drop "rectifying the Party," Mao supports it, millions of members "not true Communists"; Zhou silent; not the day); [[w.pu-weihua-zalan-jiu-shijie]], 5 (the conference of December 1964 to January 1965: Mao and Liu Shaoqi divided on the movement''s nature, Liu holding to the contradiction of the four cleans and four uncleans, Mao to that of socialism and capitalism, its point to rectify the power holders on the capitalist road); [[w.zhu-de-nianpu-xinbian]], III, 1924 (Dec. 15, 1964–Jan. 14, 1965; Zhu De 朱德 attends the work conference the Politburo calls at Peking 北京 on the socialist education movement: its first part under Liu Shaoqi 刘少奇, which draws up the *Summary of the national work conference called by the Politburo* 《中央政治局召集的全国工作会议讨论纪要》; its second under Mao Zedong 毛泽东, which takes the adopted summary up again and draws up *Some questions now arising in the rural socialist education movement* 《农村社会主义教育运动中目前提出的一些问题》, the "Twenty-three Articles" 二十三条); [[w.chen-yun-nianpu-xiuding]], III, 147 (Dec. 15–Jan. 14, 1965, Mao presiding: the Twenty-three Articles, the movement aimed at those in authority in the Party taking the capitalist road; Mao criticizes Liu Shaoqi''s "four clean and four unclean" and the overlapping contradictions, and the two "independent kingdoms" in Peking, the Secretariat and the Planning Commission; Chen Yun absent, ill). Made public: 1996. Check: the conference''s close; some sources end it Dec. 28, with the seventeen articles, others Jan. 14, 1965, with the Twenty-three (III, 419 n.106). To check: [[w.huaxuan-zhongguo-gongchan-dang-huiyi]], 508, 507 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106a); [[w.history-of-the-chinese]], 314–15 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106b); [[w.zhonggong-dangshi-dashi-nianbiao]], 337 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106c); [[w.zhonghua-renmin-gongheguo-fengyun]], 1, 962 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106d); [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 515–16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106e); [[w.en-zhou-zongli-shengping-dashiji]], 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106f); [[w.zheng-liu-shaoqi-yi-sheng]], 398 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106g); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1128, 1130, 1132 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.106h); Central Work Conference 中央工作会议, record 记录, Dec. 15, 1964 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.34); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1366–1371; [[w.liu-shaoqi-zhuan]], II, 965–967 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 5 n.11). Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Khrushchev, Brezhnev, Tao Zhu, Deng Xiaoping, Peng Zhen, Zhu De, Chen Yun.'
