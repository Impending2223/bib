- edit:
    id: cal.1963-10-01.china-leadership-8
    base: 46d60e51
    set:
      c: 'Peking 北京, Tiananmen 天安门. The National Day parade, the fourteenth anniversary, 10 a.m. to 12:15 p.m.; the rally, 500,000 of the capital''s people in Tiananmen Square 天安门广场. Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhu De 朱德, Soong Ching Ling 宋庆龄, Dong Biwu 董必武, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平 at the rally; Deng and Chen Yi 陈毅 review the parade; Yang Shangkun 杨尚昆 on the gate from 9 a.m. Peng Zhen 彭真 speaks: the economy better each year, the difficulties of the grave disasters of 1959–61 overcome; China, which imperialists, reactionaries, modern revisionists and modern dogmatists would isolate, has friends all over the world.'
      n: '[[w.yang-shangkun-riji]], II, 317 (Oct. 1, 1963); [[w.deng-xiaoping-nianpu-1904]], III, 1775 (Oct. 1, 1963, morning, 上午; the rally, Deng at it and at the review); [[w.chen-yi-nianpu]], 988 (Oct. 1, 1963, morning; Chen Yi at the ceremony and the review); [[w.peng-zhen-nianpu-1902]], IV, 293 (Oct. 1, 1963, morning; the meeting of 500,000, Peng''s speech); [[w.zhu-de-nianpu-xinbian]], III, 1884 (Oct. 1, 1963; the celebration and those at it, "and the other leaders of Party and state"). The words: 上午9时上天安门，10时到12时1刻游行完毕 (II, 317); 我们的朋友遍天下 (IV, 293). Names: Mao Zedong, Liu Shaoqi, Zhu De, Dong Biwu, Zhou Enlai, Deng Xiaoping, Chen Yi, Yang Shangkun, Peng Zhen.'
      src:
