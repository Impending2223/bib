- edit:
    id: cal.1967-02-25.china-leadership-5
    base: '27bd3491'
    set:
      c: 'On Mao''s view seven Politburo "life meetings" are held, at which Chen Yi, Tan Zhenlin and Xu Xiangqian, and Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen, are criticized. Jiang Qing and others attack them as a "bourgeois restoration current," later called the "February counter-current." The Politburo then stops meeting, the Cultural Revolution Group''s liaison meeting taking its place. Zhou Enlai presides, at Huairen Hall. Jiang Qing, Kang Sheng, Chen Boda and Xie Fuzhi lead the attack; the veterans examine themselves one by one. Kang Sheng: "the gravest anti-Party incident since the Eleventh Plenum," "a rehearsal for a coup." Zhu De criticized too. Zhou to Jiang Qing and Zhang Chunqiao: "from now you decide, I do the work for you."'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 76 (the book dates the seven meetings from Feb. 25 to Mar. 18; no day of any one is given; in late April Mao agrees to let several of the marshals, with Zhu De and Chen Yun, stand on Tiananmen for the May Day parade, which eased their position). [[w.yang-jisheng-tiandi-fanfu]], I, 392–393 (Zhou presides; seven "Politburo life meetings" at Huairen Hall 懷仁堂 from Feb. 25 to Mar. 18; Chen Yi by day at his foreign affairs, by night criticized; Kang Sheng: "the proletariat''s anger," "the gravest anti-Party incident since the Eleventh Plenum," "a rehearsal for a coup"; Jiang Qing: a "bourgeois restoration current"; the veterans examine themselves one by one; the Standing Committee''s liaison meeting that Zhou held for the daily work stops, the Group''s liaison meeting takes its place, Zhou presiding; Zhou to Jiang Qing and Zhang Chunqiao: "from now you decide, I do the work for you"); [[w.jian-zhou-enlai]], 570 (the meetings Zhou chairs over the following weeks; Jiang and the Group call the veterans "conspirators who have opposed Chairman Mao and longed for a capitalist restoration," and they criticize themselves; Zhou owns himself "insensitive" and "dumb"; Jiang: "You are just a wavering element"); [[w.chen-yi-nianpu]], 1188 (Feb. 25 to Mar. 18, 1967; Chen Yi at the seven Politburo "life meetings" at Huairen Hall, Zhongnanhai, on the so-called "February adverse current," besieged and criticized by Jiang Qing and others); [[w.dikotter-cultural-revolution]], 138 n.22 (struggle meetings against Tan Zhenlin, Chen Yi and Xu Xiangqian, all chaired by Zhou Enlai, in the room in Zhongnanhai where they had attacked the Group; the Standing Committee paralysed, the Group running the show); [[w.liu-jixian-ye-jianying-nianpu]], II, 961 (Feb. 25–Mar. 18, 1967; Ye Jianying 叶剑英 at the seven "political life criticism meetings" 政治生活批评会 in the Huairen Hall 怀仁堂, at which Jiang Qing 江青, Kang Sheng 康生, Chen Boda 陈伯达, Xie Fuzhi 谢富治 and others besiege and struggle Chen Yi, Tan Zhenlin, Xu Xiangqian, Ye Jianying and others for a "bourgeois restoration countercurrent" 资产阶级复辟逆流 (later the "February countercurrent" 二月逆流) and force their self-criticisms; the Politburo then stops meeting, the Group in effect taking its place); [[w.zhu-de-nianpu-xinbian]], III, 1963 (Feb.–Mar. 1967; the Center 中共中央 meets many times to criticize the so-called "February adverse current" 二月逆流; Zhu De 朱德 too is wrongly criticized; after it the Politburo 中共中央政治局 in effect stops working, replaced by the Central Cultural Revolution Group 中央文革小组). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage; [[w.wenqian-wannian-zhou-enlai]], 26th printing (2004), 209–213 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 393 n.20a); [[w.li-wang-li-fansi-lu]], the Beixing ed. as Yang cites it (2011, 2nd ed.), 下, 241 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 393 n.20b); Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 164 (cited by [[w.dikotter-cultural-revolution]], 138 n.22). Names: Chen Yi, Tan Zhenlin, Xu Xiangqian, Li Fuchun, Li Xiannian, Ye Jianying, Nie Rongzhen, Jiang Qing, Mao Zedong, Zhou Enlai, Kang Sheng, Chen Boda, Xie Fuzhi, Zhu De, Zhang Chunqiao. Check: the days of the seven meetings, the book giving only the span.'
