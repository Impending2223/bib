- edit:
    id: cal.1964-05-19.civil-rights-bill
    base: 'eff5ff6d'
    set:
      c: 'Both parties'' Senators in caucus on the revised bill. The Democrats: no objection but the South''s; Mansfield praises Humphrey. Dirksen in trouble with the Republicans. The Democrats, the old Supreme Court chamber, 10:10 to 11:54 a.m., forty-seven present; Mansfield: "Today is the 60th day of debate on the Civil Rights bill"; Humphrey explains the package, Titles II, V and VII changed; Russell: Dirksen''s amendments "a punitive expedition into the South"; Ervin granted a week. The Republicans, 9:24 a.m. to 12:09 p.m., twenty-seven present; Dirksen explains the bill, Title VII left to another conference; Hickenlooper: "a gargantuan thing."'
      n: '[[w.bernstein-guns-or-butter]], 72; [[w.whalen-longest-debate]], 184–85 (the Democrats in the old Supreme Court chamber, forty-nine; twenty-seven Republicans in S-207, Hickenlooper: "a gargantuan thing"); [[w.ritchie-minutes-of-the-senate]], 634–38 (the Democrats, the old Supreme Court chamber, 10:10 to 11:54 a.m., forty-seven named present; Mansfield: "Today is the 60th day of debate on the Civil Rights bill," cloture the key question; he praises Humphrey, 635–36; Humphrey explains the package, Titles II, V and VII changed, questions from Lausche, Symington, Byrd (W.Va.), Nelson, Douglas, Pastore, Holland, Ervin and Gore, 636–37; Clark not satisfied with Title VII but for a compromise, 636; Ervin wants a week to study it; Whalen''s forty-nine is not the minutes'' count); [[w.wolff-minutes-of-the-senate]], 976–78 (the Republicans, 9:24 a.m. to 12:09 p.m., twenty-seven present, with the Judiciary staff; on Cooper''s motion Dirksen explains the whole bill first, Titles I to XI, Title VII left to another conference; Aiken: a middle ground is needed; Hickenlooper for the whole picture first; Saltonstall: not binding; not "a gargantuan thing"); [[w.risen-bill-of-the-century]], 219 (May 19, the Democrats'' conference in the old Supreme Court chamber, Mansfield on the sixtieth day, Russell''s "punitive expedition," Ervin granted a week; the Republicans from 9 a.m., Hickenlooper against; not Mansfield''s praise of Humphrey); [[w.purdum-idea-whose-time-has-2014]], 292 (Tuesday, May 19: the Democrats'' caucus in the Old Senate Chamber, the Southerners dour, Russell: Dirksen''s amendments make it "a punitive expedition into the South," Stennis, Clark and Hart saying they could live with it; the Republicans'' in a conference room off the floor, Hickenlooper "a gargantuan thing!" and Simpson "warmed it over like hash"). See [[cal.1964-05-13.civil-rights-bill-2]]. Names: Mansfield, Humphrey, Dirksen, Russell, Ervin, Hickenlooper.'
