    set:
      c: 'Zhou flies from Urumqi to Beijing. Chen Yi with him, back from the United Arab Republic. At the western airport, 3 p.m., Zhu De, Deng Xiaoping, Peng Zhen, He Long, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Luo Ruiqing, Yang Shangkun and Liu Ningyi meet them.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 7, 1965); [[w.zhou-enlai-waijiao-huodong]], 467 (July 7, 1965; afternoon, by special plane back to Peking; Zhu De, Deng Xiaoping and other Party and state leaders meet him at the airport); [[w.yang-shangkun-riji]], II, 640 (July 7, 1965; Yang meets Zhou, Chen Yi and their party at the western airport at 3 p.m.; Urumqi not named; the words: 下午3时去西郊机场，迎接恩来、陈毅同志等回京); [[w.peng-zhen-nianpu-1902]], IV, 424 (July 7, 1965, afternoon; Peng Zhen, with Zhu De, Deng Xiaoping and others, at the airport meeting Zhou back from the UAR); [[w.chen-yi-nianpu]], 1106 (July 7, 1965, afternoon; Chen Yi with Zhou by special plane); [[w.zhu-de-nianpu-xinbian]], III, 1936–1937 (printed under July 8, 1965; Zhu De 朱德, with Deng Xiaoping 邓小平, Peng Zhen 彭真, He Long 贺龙, Li Xiannian 李先念, Tan Zhenlin 谭震林, Nie Rongzhen 聂荣臻, Luo Ruiqing 罗瑞卿, Yang Shangkun 杨尚昆, Liu Ningyi 刘宁一 and others, at the airport to welcome Zhou Enlai 周恩来 and Chen Yi 陈毅 back from their visit to the United Arab Republic 阿拉伯联合共和国). Names: Zhou Enlai, Chen Yi, Zhu De, Deng Xiaoping, Peng Zhen, He Long, Li Xiannian, Tan Zhenlin, Nie Rongzhen, Luo Ruiqing.'
