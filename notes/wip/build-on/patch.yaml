- edit:
    id: cal.1968-04-03.robert-kennedy
    base: '3eb426a2'
    set:
      c: 'Robert Kennedy and Sorensen with Johnson at the White House, at Kennedy''s asking. Would Johnson oppose his candidacy, or mobilize forces against him? Johnson: but for a few fund-raising dinners he plans to keep out of campaign politics; he "does not wish to forego his options." The Cabinet Room, 10 a.m., an hour and forty minutes; Rostow and Charles S. Murphy with Johnson. Johnson: "I want to keep the Presidency out of this campaign. I''m not that pure, but I am that scared." Kennedy: "You are a brave and dedicated man, Mr. President."'
      n: 'FRUS 1964–68, VI, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v06/d176). [[w.schlesinger-robert-kennedy-and-his]], 868–69 (the meeting; Kennedy''s question; Johnson to stay out; not D); [[w.dallek-flawed-giant]], 531; [[w.shesol-mutual-contempt]], 441–43 (from Rostow''s memorandum of the meeting, 10 a.m.); [[w.branch-at-canaans-edge]], 750–51 (Kennedy, "Your speech was magnificent"; "was my fault"; "You are a brave and dedicated man"); [[w.shesol-mutual-contempt]], 441, 444 (on the telegram, after Wisconsin, by Schlesinger: "I won''t bother answering that grandstanding little runt"; a hundred minutes; Johnson later: "I''m glad it ended on that note"); [[w.thomas-robert-kennedy]], 365 (Kennedy asks what Johnson means to do about the campaign; Johnson: stay out of it, "I am no king maker"; Kennedy: "You are a brave and dedicated man"); [[w.solberg-hubert-humphrey]], 325 (Kennedy asks to see Johnson, to ask whether the President meant to cut his throat; Johnson, on the request: "I won''t bother answering that grandstanding little runt"; Rostow and Charles Murphy attend and record; friendly; "You and I weren''t meant to be vice presidents"; no intention of dictating his successor; closer to the Vice President; "if I campaign for someone else, it will defeat what I am trying to do"; not Sorensen, the fund-raising dinners or the options); [[w.sorensen-counselor]], 461–62 (10 a.m., the Cabinet Room, one hour and forty minutes, with Rostow and Murphy; Johnson does 90 percent of the talking; Kennedy: "A lot of it was my fault"; Johnson: "I want to keep the Presidency out of this campaign. I''m not that pure, but I am that scared"; "I do not hate you, I do not dislike you"; Kennedy: "You are a brave and dedicated man, Mr. President"; at the door Johnson to Sorensen: "None of this would have happened if you hadn''t left"; Humphrey the next visitor); [[w.schlesinger-journals]], 286 (Kennedy to Schlesinger by telephone that evening: the meeting "friendly enough," Johnson "planned for the time being to stay out of the presidential contest," Kennedy would appreciate being told if he changed his mind; not Sorensen, the fund-raising dinners or Johnson''s options); [[w.witcover-85-days]], 136–37 (10 a.m., the Cabinet Room; Rostow and Charles S. Murphy with Johnson, Sorensen with Kennedy; a Hanoi message read; about an hour; Johnson will not run and will not take sides; Christian: neither asked "for any specific thing"; not B–D). [[w.longley-lbjs-1968]], 138–40 (the meeting, by Murphy''s notes; Johnson to stay out but for fund-raising dinners); [[w.palermo-in-his-own-right]], 156–58 (the meeting, Rostow and Murphy with Johnson; Kennedy''s question, "Are you opposed to my effort and will you marshal forces against me?"; Johnson to "stay out of pre-convention politics"). To check: Murphy''s notes of the meeting, Apr. 3, 1968, Diary Backup, LBJ Library; the Daily Diary, Apr. 3, 1968, LBJ Library (not among the Catalog''s scanned days) (cited by [[w.dallek-flawed-giant]], 531); Charles S. Murphy notes of LBJ, RFK, Sorensen meeting, 10:07–11:41 a.m., April 3, 1968, Diary Back-up, Box 94, LBJ (cited by [[w.branch-at-canaans-edge]], 750); Walt Rostow notes in same file (cited by [[w.branch-at-canaans-edge]], 750); LBJ received the Reuters bulletin at 9:55 a.m. ("Hanoi is ready to talk"), and he entered the Cabinet Room to begin the Kennedy meeting at 10:07; Walt Rostow, interview, Nov. 5, 1981; Charles Murphy, "Notes on Meeting of President with Sen. Robert Kennedy," Apr. 3, 1968, Box 65, Murphy Papers; Rostow, memorandum, Apr. 3, 1968, LBJ Library (cited by [[w.solberg-hubert-humphrey]], 325, its note). PDD, April 3, 1968, p. 2, LBJ (cited by [[w.branch-at-canaans-edge]], 750); [*New York Times*, March 31, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/31/issue.html), at 59 (cited by [[w.branch-at-canaans-edge]], 750); Sorensen notes, in Middleton, LBJ, pp. 224–25 (cited by [[w.branch-at-canaans-edge]], 751); [[w.schlesinger-thousand-days-1965]], 933–34 (cited by [[w.branch-at-canaans-edge]], 751). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Sorensen, Johnson, Rostow, Murphy.'
