- edit:
    id: cal.1962-08-06.china-leadership
    base: '093bf6e6'
    set:
      c: 'Beidaihe. The Central Work Conference (Aug. 6–24), Mao presiding. Plenary, afternoon: Mao says a work conference first, a plenum after to adopt the papers; six groups, and a core group of the Standing Committee, the Secretariat and the regional first secretaries. He speaks on class, the situation and contradictions; the conference turns to the class struggle and to criticizing the "dark wind" and "go-it-alone wind." Deng Xiaoping lays out four topics: rural work, finance and trade, city work, and an exchange of cadres between center and provinces. The plenary at 4 p.m., in the club of the central organs. The core group: Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng, the State Council''s sector heads and the regional bureaus'' secretaries. Mao: "Do classes actually exist in a socialist state?" Zhou Enlai, Zhu De and Peng Zhen attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 6, 1962 (the entry for Aug. 6–24). [[w.zhou-enlai-nianpu-1949]], II, 492 (July 28–Aug. 24, 1962: Zhou Enlai at the conference, which set up a center group of Mao, Liu, Zhou, Zhu De, Deng and the heads of the State Council''s sectors and the regional bureaus'' secretaries; Mao''s Aug. 6 speech on class, the situation and contradictions, the "dark wind," "go-it-alone wind" and "reversal wind"; Zhou speaks mainly on the plan and the situation in the villages); [[w.macfarquhar-origins-of-the-cultural]], III, 274–75 (Mao opens the conference on Aug. 6, sets aside the agenda for class, contradictions and the current situation, and attacks the three winds of pessimism, of going it alone and of reversing correct verdicts: "Do classes actually exist in a socialist state?"); [[w.yang-shangkun-riji]], II, 202 (Aug. 6, 1962; the plenary, 4 p.m.; Deng Xiaoping on the order of business; Mao speaks); [[w.deng-xiaoping-nianpu-1904]], III, 1720–1721 (Aug. 6–24, 1962; Deng attends; to treat farming, grain, commerce and aid to farming; Mao''s three questions on Aug. 6, classes, the situation, contradictions; class struggle through the whole socialist period; the "dark wind"; papers for the Tenth Plenum. Aug. 6 at the plenary Deng sets out the agenda: six regional groups and a core group working side by side, the groups the main part); [[w.mao-zedong-zhuan]], V, ch. 70 (Aug. 6, afternoon, in the club of the central organs 中直俱乐部 at Beidaihe: Mao presides over the plenary of the Central Work Conference and puts three questions, class, the situation and contradictions, to be discussed; the discussion then turns to class struggle and goes the one way). [[w.yang-jisheng-mubei]], II, 1175 (the Beidaihe Central Work Conference, July 25–Aug. 24, 1962; Mao''s talk of Aug. 6 on class, the situation and contradictions; his criticism of the "dark wind," the "go-it-alone wind" and the "reversal wind"; class struggle to be spoken of every year, every month); [[w.yang-jisheng-mubei]], II, 1128 n.34 (on Aug. 6, without consulting anyone, Mao speaks on class, the situation and contradictions: socialism or capitalism, the cooperatives or contracting households; the conference turns to the ''dark wind,'' the ''go-it-alone wind'' and the ''wind of reversing verdicts''); [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (the Beidaihe work conference, by the chronology July 25 to Aug. 24: Mao criticizes Liu Shaoqi''s and others'' handling of the famine); [[w.jian-zhou-enlai]], 469 (Aug. 6, Mao''s keynote: do classes exist in a socialist country; complete darkness or bright spots; collectivization still wanted; the view of darkness "most rampant among top leaders"); [[w.yang-jisheng-tiandi-fanfu]], I, 76–77 (Mao''s interjections at the core group on Aug. 9, 11, 13, 15, 17, 20; the conference turns to the "dark wind," the "go-it-alone wind" and the "wind of reversing verdicts"); [[w.peng-zhen-nianpu-1902]], IV, 209–210 (Aug. 5–24, 1962; Peng Zhen at the Central Work Conference; called on agriculture, grain and commerce; on the 6th Mao, at the plenary, raises class, the situation and contradictions, and again in the core group; at his asking the conference turns to class struggle and the criticism of the "dark wind" and the "go-it-alone wind," and prepares the Tenth Plenum''s papers on that line); [[w.dikotter-cultural-revolution]], 17 (Mao''s speech on class struggle at the Beidaihe retreat, Aug. 6); [[w.zhu-de-nianpu-xinbian]], III, 1846–1847 (July 25–Aug. 24, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "Beidaihe conference" 北戴河会议), in its center group 中心小组 of Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De, Deng Xiaoping 邓小平, the State Council''s sector heads and the regional bureaus'' secretaries; meant for farming, grain, commerce and state aid to farming; Zhu De in the East China, Southwest, Northeast and North China groups, saying the task is to raise output, grain above all; Mao on Aug. 6 on "classes, the situation, contradictions," and six times in the center group against the "go-it-alone wind" 单干风, the "reversal-of-verdicts wind" 翻案风 and the "dark wind" 黑暗风, the agenda overturned); [[w.chen-yun-nianpu-xiuding]], III, 137–138 (Aug. 6–24, its preparatory meeting from July 25; meant for farming, grain, commerce and support of agriculture, it turns to class struggle and the attack on the "dark wind" and the "go-it-alone wind"; Mao: some see all dark these two years; five or eight years to recover leaves no hope; strive for fast, prepare for slow; going it alone means polarization in a year, Khrushchev dares not openly dissolve the collective farms; Deng Zihui and Tian Jiaying named). Made public: 1997. Check: one source gives July 25 as the conference''s opening date, the days before Aug. 6 being spent on final drafts of documents on agriculture (III, 274 n.79). To check: [[w.schram-mao-tse-tung-unrehearsed]], 188 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.77); [[w.al-zhongguo-gongchan-dang-zhizheng]], 221 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.78); [[w.xin-zhongguo-biannianshi-1949]], 485 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.79a); [[w.mingxian-xin-zhongguo-sishiwu-nian]], 212 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.79b); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 274 n.79c); Mao Zedong, speech of Aug. 6, 1962, opening the Beidaihe work conference, in [[w.schram-new-texts-by-mao]], 152 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 275 n.83); Mao Zedong, speech of Aug. 6, 1962, opening the Beidaihe work conference, in [[w.schram-new-texts-by-mao]], 153 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 275 n.84a); Mao Zedong, speech of Aug. 6, 1962, opening the Beidaihe work conference, in [[w.zedong-ziliao-xuanbian-selection-of]], 269–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 275 n.84b); Mao''s first speech at the Beidaihe Conference, August 6, 1962 (cited by [[w.jian-zhou-enlai]], 469 n.19a); [[w.xianzhi-mao-zedong-zhuan-1949]], 1236–1237 (cited by [[w.jian-zhou-enlai]], 469 n.19c); *Mao Zedong sixiang wansui* 《毛澤東思想萬歲》 (1961–1968), 29–30 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 76 n.84). See [[cal.1962-08-05.china-leadership]]. Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Zhou Enlai, Zhu De, Peng Zhen.'
