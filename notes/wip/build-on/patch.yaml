- edit:
    id: cal.1968-10-13.china-leadership
    base: 'd570b6b1'
    set:
      c: 'Mao opens the Twelfth Plenum of the Eighth Central Committee (enlarged), Peking, Oct. 13–31, and speaks. Zhou Enlai gives the attendance and the agenda: preparing the Ninth Congress, amending the Party constitution, the domestic and international situation, the investigation report on the Liu Shaoqi case. Mao: two views, that the Eleventh Plenum''s resolution was basically right and that it was not; a show of hands is not agreement. 133 attend: 40 members, ten alternates made members to reach half, Huang Yongsheng, Xu Shiyou and Chen Xilian among them; 74 others. Mao: the Cultural Revolution completely necessary and very timely; the plenum "maybe a week, or seven to ten days"; the old wars easier, the enemy clear, in this one errors of thought and enemies mixed. He says a word for Deng Xiaoping: he fought the enemy, and no other historical problem found. Ye Jianying, Chen Yi, Chen Yun and Zhu De attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 13, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 258 (Oct. 13, 1968; the agenda and Mao''s speech); [[w.jianguo-yilai-mao-zedong]], XIX, 347 (Oct. 13, 1968; two passages of Mao''s speech at the opening of the plenum: the old north-south wars were easy to fight, the enemy being clear, and the Cultural Revolution is much harder; the trouble is that those who erred in thought and the contradictions with the enemy are mixed together and cannot yet be sorted out; Lin Biao quoted them in his report to the Ninth Congress of Apr. 1, 1969, printed in the *Renmin ribao* Apr. 28, 1969); [[w.macfarquhar-maos-last-revolution]], 273–274 (of the 87 living full members 40 invited, of 96 alternates 19 present; ten alternates made full members on the opening day, bringing the full members present to the 51 percent a lawful vote needs; 74 others with votes; Zhou''s agenda of four points); [[w.macfarquhar-maos-last-revolution]], 274 (Mao''s opening: the plenum to last "maybe a week, or seven to ten days"; "what questions should be raised?"; on Zhang Dingcheng, Wang Renzhong, Tao Zhu, Wang Yanchun, Deng Xiaoping and Jiang Hua, with Zhou''s and Xu Shiyou''s interjections; on the Ninth Congress, "talk about it among yourselves first"); [[w.deng-xiaoping-nianpu-1904]], III, 1946 (Oct. 13, 1968; the nianpu: Mao, in his speech at the plenum''s opening session, says of Deng Xiaoping: I always say a word for him, for he fought the enemy in the war against Japan and the war of liberation and no other historical problem has been found); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.35, 37 (Oct. 13 the enlarged Twelfth Plenum opens under Mao''s chairmanship, 133 attending, of whom 59 are Central Committee members and alternates, 50 members after ten alternates are raised to replace the dead and 9 alternates, the other 74 the members of the Group''s liaison meeting, of the Military Commission''s office group, the heads of provinces and great military regions and of the Center''s organs; Zhou: the plenum is called to prepare the Ninth Congress; the agenda four items, the principles and method of choosing delegates to the Ninth Congress, amending the draft constitution, the situation, the report of the special case groups, n.35; Mao on the situation, putting questions for discussion and no conclusion: there are two views, that the Eleventh Plenum''s resolution is basically right and that it is not so sure; he warned then and again at the October work conference; a show of hands is one thing, real agreement another; many comrades have not passed the test; the Central and alternate members, the masses do not forgive, as with Zhang Dingcheng 张鼎丞; the errors are there, the main responsibility is the Center''s and his, not the localities'' and not the army''s; it needs about three years, by next summer about done, n.37; the book gives no place for the plenum). [[w.yang-jisheng-tiandi-fanfu]], I, 403 (Mao at the plenum on the "February adverse current" in Sichuan: "one arrest and it is a hundred thousand? ... if you arrested wrongly, release them"; Zhang Guohua: 500 left, all bad men); [[w.yang-jisheng-tiandi-fanfu]], II, 688 (133 attending; of the 97 members of the Eighth Central Committee 10 dead and 40 present; Zhou names ten alternates members, Huang Yongsheng, Xu Shiyou and Chen Xilian among them, "agreed by the proletarian headquarters," making 50; the agenda of four items, the Liu Shaoqi case the fourth); [[w.yang-jisheng-tiandi-fanfu]], II, 1147; [[w.peng-zhen-nianpu-1902]], IV, 501–502 (Oct. 13–31, 1968; the plenum on calling the Ninth Congress; it approves the report on Liu Shaoqi''s alleged crimes built on false evidence and wrongly expels him "forever," removing him from all posts in and out of the Party); [[w.jian-zhou-enlai]], 588 (of the Eighth Congress''s members and alternates 87 still alive, most purged; Zhou has "sidelined" members rushed to Peking, some from prison; only forty of the members attend, fewer than half, so the first act makes ten alternates full members; several dozen Cultural Revolution stars attend); [[w.chen-yi-nianpu]], 1210 (Oct. 13–31, 1968; Chen Yi attends the enlarged Twelfth Plenum of the Eighth Central Committee at Peking); [[w.liu-jixian-ye-jianying-nianpu]], II, 977–978 (Oct. 13, 1968; Ye Jianying 叶剑英 at the opening of the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会; Mao presides; Zhou gives the agenda: the Ninth Congress''s preparations, the Party constitution''s revision, the situation at home and abroad, the report on Liu Shaoqi''s case; Mao: the Cultural Revolution completely necessary and very timely); [[w.chen-yun-nianpu-xiuding]], III, 164 (Oct. 13–31: Chen Yun attends the Twelfth Plenum of the Eighth Central Committee 中共八届十二中全会, Mao presiding); [[w.zhu-de-nianpu-xinbian]], III, 1966 (Oct. 13–31, 1968; Zhu De 朱德 at the enlarged Twelfth Plenum of the Eighth Central Committee 中共扩大的八届十二中全会 in Peking, Mao Zedong 毛泽东 presiding; in most abnormal conditions it adopts the "Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi" 《关于叛徒、内奸、工贼刘少奇罪行的审查报告》, written by Jiang Qing 江青, Kang Sheng 康生 and others on false evidence, expels Liu Shaoqi 刘少奇 from the Party forever and strips him of all posts, and decides to convene the Ninth Congress 中共九大); [[w.peng-dehuai-nianpu]], 820 n.1 (the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会 held at Peking 北京 Oct. 13–30, 1968). Made public: the communique, *Renmin ribao*, Nov. 2, 1968 (the plenum''s opening); 2013. Check: [[w.macfarquhar-maos-last-revolution]], 285 n.3, quotes Mao at the Twelfth Plenum, autumn 1968: the movement is not yet finished, nor will it be right after the Ninth Congress, since it reaches every factory, rural village, school and government organ (from the plenum transcript, 10; the printed text lacks "every rural village"); whether from this speech or from his closing speech of Oct. 31. To check: the plenum''s records; Mao''s speeches (the *wengao*); [[w.zhonghua-renmin-gongheguo-shi]], 350–351 (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.2); [[w.nianyi-da-dongluande-niandai]], 311 (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.3a); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1528 (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.3b); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 1, copy in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.4); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 1–2 (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.5); "Mao zhuxi zai dangde ba jie kuodade shier zhong quanhui shangde jianghua," 4 (cited by [[w.macfarquhar-maos-last-revolution]], 274 n.6); "Mao zhuxi zai dangde ba jie kuodade shi er zhong quanhui shangde jianghua," 10, copy in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 285 n.3b); Zhou Enlai 周恩来, speech at the opening session of the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会 (record 讲话记录), Oct. 13, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.35); Mao Zedong 毛泽东, speech at the opening session of the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会 (record 讲话记录), Oct. 13, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.37); Mao Zedong 毛澤東, 《在八屆十二中全會上的講話》, Oct. 13, 1968 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 403 n.38); Zhou Enlai, speech at the opening of the Twelfth Plenum, Oct. 13, 1968 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 688 n.1); Zhou''s speech at the opening session of the Twelfth Plenum of the Eighth Central Committee, Oct. 13, 1968, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 588 n.90a). Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Huang Yongsheng, Xu Shiyou, Chen Xilian, Deng Xiaoping, Ye Jianying, Chen Yi, Chen Yun, Zhu De.'
