- edit:
    id: cal.1966-08-01.china-leadership
    base: f051e2e9
    set:
      c: 'Peking, Great Hall. The Eleventh Plenum of the Eighth Central Committee, Mao presiding. Agenda, from Deng Xiaoping: the Decision on the Cultural Revolution; the major decisions since the Tenth Plenum; the personnel changes of May; a communiqué. Liu Shaoqi reports the Center''s work since the Tenth Plenum and takes responsibility for the work groups. Mao, during Chen Boda''s speech: over 90 percent of the work groups wholly wrong, under 10 percent good; they are to be withdrawn; they suppressed the movement. Present: 141 of the 173 members and alternates of the Central Committee, with 47 others, members of the Cultural Revolution Group and Nie Yuanzi among them; Zhou Enlai, Zhu De and Ye Jianying attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1, 1966; Zhou at the opening; Deng gives the agenda; Liu Shaoqi''s report and his taking responsibility for the work groups; Chen Boda charges the groups with wrong); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (Aug. 1–12, 1966; Liu attends the Eleventh Plenum of the Eighth Central Committee; Aug. 1 he reports to it the policies of the Politburo on international and domestic work since the Tenth Plenum and takes the responsibility for the work-group practice after the "Cultural Revolution" began: lately the Chairman was away and he presided over the Standing Committee''s work at home; when the Chairman returned he found the sending of work groups wrong, and the responsibility is chiefly his; Mao, interjecting, charges that the work groups made errors of direction and line, "actually standing on the bourgeois standpoint and opposing the proletarian revolution"); [[w.macfarquhar-maos-last-revolution]], 86–87 (the members and alternates elected in 1956 and 1958; Nie Yuanzi and a junior colleague; Deng''s opening speech sets the agenda; Liu''s report not properly scripted, the Decision not ready); [[w.macfarquhar-origins-of-the-cultural]], III, 462–63 (the Eleventh Plenum, Aug. 1–12, the first in four years); [[w.deng-xiaoping-nianpu-1904]], III, 1927 (Aug. 1–12, 1966; Deng attends the Eleventh Plenum of the Eighth Central Committee; on the afternoon of Aug. 1, at the opening Mao presides over, he announces the agenda: (1) adopt the Central Committee''s decision on the proletarian cultural revolution; (2) discuss and approve the Center''s major measures at home and abroad since the Tenth Plenum; (3) complete the formalities for the personnel changes of the May Politburo meeting; (4) adopt the communiqué; Liu Shaoqi reports on the Center''s work since the Tenth Plenum and takes responsibility for the sending of work teams); [[w.mao-zedong-zhuan]], VI, ch. 74 n.57 (Aug. 1 the Eleventh Plenum opens at Peking, Mao presiding; Deng Xiaoping announces the agenda in four items, a decision on the proletarian cultural revolution; the major decisions and measures since the Tenth Plenum; the formal confirmation of the May Politburo meeting''s personnel changes; the communiqué; the session first set for five days; Liu Shaoqi reports on the Center''s work and again takes the responsibility for the work teams; Chen Boda''s speech; Mao''s interjections that necessity hides in accident, that the poster of Nie Yuanzi and its broadcast brought the disorder, and that the decision should be made, to be overturned only at the next plenum, n.57). [[w.yang-jisheng-tiandi-fanfu]], I, 220–221 (Aug. 1–12 in Peking; the 47 non-voting; Deng Xiaoping announces four items: the resolution on the proletarian cultural revolution; the Center''s major measures since the Tenth Plenum in domestic and foreign matters, to be discussed and approved; the plenum communiqué; the formal approval of the May decisions on personnel; Liu reports the measures, and says that Peking''s cultural revolution made mistakes, especially over the work groups, "for which the responsibility is mainly mine"; "in the cultural revolution Peking reported to the Chairman once a week"); [[w.yang-jisheng-tiandi-fanfu]], II, 1144 (Aug. 1 to 12); [[w.peng-zhen-nianpu-1902]], IV, 488–489 (Aug. 1–12, 1966; the Eleventh Plenum adopts the Sixteen Articles; the Standing Committee from seven to eleven, Tao Zhu, Chen Boda, Kang Sheng and Li Fuchun added, in the order Mao, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun; Liu, Zhou, Zhu and Chen Yun no longer named vice-chairmen; Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying added to the Politburo, Li Xuefeng, Song Renqiong and Xie Fuzhi alternates; Peng Zhen, Luo Ruiqing and Lu Dingyi removed from the Secretariat, Yang Shangkun as alternate, Xie Fuzhi and Liu Ningyi added; Peng''s errors "extremely grave, anti-Party, anti-socialist, anti-Mao Zedong Thought"); [[w.jian-zhou-enlai]], 549 (the plenum opens Aug. 1 with Liu''s work report; Mao interrupts him on the work teams: "Over 90 percent of the work teams have been completely wrong. ... They have only played the role of suppressing and blocking the masses"); [[w.dikotter-cultural-revolution]], 68–69 n.9 (Mao accuses Liu of "running a dictatorship"; Lin Biao called back Aug. 6: the movement to "turn the world upside down"; on the last day the new Standing Committee of eleven by secret ballot, Lin number two); [[w.liu-jixian-ye-jianying-nianpu]], II, 941–942 (Aug. 1–12, 1966; Ye Jianying 叶剑英 at the Eleventh Plenum 八届十一中全会; it adopts the decision on the Cultural Revolution (the Sixteen Points)); [[w.chen-yun-nianpu-xiuding]], III, 154–155 (Chen Yun attends, Aug. 1–12, Mao presiding; Liu Shaoqi takes responsibility for the work teams; after Mao''s poster the plenum turns to exposing and criticizing Liu, and Zhu De, Chen Yun, Deng Zihui, Bo Yibo and others are criticized in varying degree; no chairman or vice-chairmen re-elected, Lin Biao alone afterward called vice-chairman, the vice-chairmanships of Liu, Zhou, Zhu De and Chen Yun no more mentioned); [[w.zhu-de-nianpu-xinbian]], III, 1955–1956 (Aug. 1–12, 1966; Zhu De 朱德 at the Eleventh Plenum of the Eighth Central Committee 中共八届十一中全会 in Peking, whose chief business is the decision on the Great Proletarian Cultural Revolution and the approval of the Center''s 中共中央 chief decisions on home and foreign questions since the Tenth Plenum 十中全会; the nianpu: the plenum marks the full launching of the "Cultural Revolution"); [[w.pu-weihua-zalan-jiu-shijie]], 186–189, 187 n.5, 188 n.6, 189 n.7 (Aug. 1 to 12, in Peking; 141 members and alternates present of 195, eleven dead, forty-three absent, among them the fallen (Peng Dehuai, Huang Kecheng, Zhang Wentian, Xi Zhongxun, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Ulanfu and others); forty-seven non-voting, among them teachers and students of the capital (187 n.5: Cao Yi''ou, Zhang Chengxian, Nie Yuanzi, Kong Dan and others); of the Standing Committee Chen Yun absent; Lin Biao, ill, comes back from Dalian Aug. 6; the afternoon of Aug. 1 Mao presides in the East Hall of the Great Hall; Deng gives the agenda (the Decision; the measures since the Tenth Plenum; the personnel changes, Tao Zhu to the Secretariat''s standing secretary, Ye Jianying a secretary; a communiqué); Liu tells of Chen Boda''s proposal and the majority against it, and takes the chief responsibility for the work groups; his speech never printed; Mao''s interjections; Chen Boda: the work groups did what Lu Ping dared not; Mao: necessity hides in chance; a decision is to be made (the record, 189 n.7)); [[w.peng-dehuai-nianpu]], 796 (Aug. 1–12, 1966: the Eleventh Plenum 中国共产党八届十一中全会 at Peking 北京; Aug. 5, Mao''s "Bombard the headquarters: my big-character poster"; Aug. 8, the Decision on the Great Proletarian Cultural Revolution 《关于无产阶级文化大革命的决定》, the "Sixteen Articles" 十六条). Made public: 1989. Check: MacFarquhar (86 n.4) has Lin Biao appear to chair the session in a photograph of the proceedings. To check: [[w.wenhua-dageming-bowuguan-2]], I, 210–211 (cited by [[w.macfarquhar-maos-last-revolution]], 86 n.4); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 273 (cited by [[w.macfarquhar-maos-last-revolution]], 87 n.6); [[w.xin-zhongguo-biannianshi-1949]], 276 (cited by [[w.macfarquhar-maos-last-revolution]], 87 n.7); [[w.yonglie-chen-boda-qiren]], 263–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 462 n.table); Record of the Eleventh Plenum of the Eighth Central Committee 中共八届十一中全会记录, Aug. 1, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.57); Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 99 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 221 n.6); [[w.jin-chongji-liu-shaoqi-zhuan]], 1032–1033 (cited by [[w.jian-zhou-enlai]], 549 n.25a); [[w.liu-shaoqi-zhuan]], II, 1033 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 188 n.6a); 中共八屆十一中全會記錄 (Aug. 1, 1966), in [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1426 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 189 n.7). Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Chen Boda, Zhou Enlai, Zhu De, Ye Jianying.'
