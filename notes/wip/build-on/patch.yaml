- edit:
    id: cal.1968-03-24.china-leadership
    base: 778a0b32
    set:
      c: 'Peking, the Great Hall. Lin Biao, to a meeting of 10,000 army cadres of regiment level and above, announces the "errors" of Yang Chengwu, Yu Lijin and Fu Chongbi and the decision on them: Yang removed as acting chief of staff, Yu arrested, Fu removed as garrison commander. Yang, with Yu, meant to bring down Wu Faxian, and with Fu, Xie Fuzhi; the matter neither large nor small. Lin praises Jiang Qing. Zhou Enlai, Jiang Qing, Chen Boda and Kang Sheng speak; Zhou leads the cry "down with whoever opposes Comrade Jiang Qing." Mao on the platform; Ye Jianying and Chen Yi below it. Kang Sheng: Yang has a "black backer."'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 221–222 (Mar. 24, 1968; Lin''s announcement, note 1); [[w.yang-jisheng-tiandi-fanfu]], I, 442–444 (the cadres of the army organs, units and academies in Peking, in the Great Hall''s auditorium, waiting from 9 p.m., the meeting beginning after midnight; Lin on Mao''s three points: against factionalism, against double-dealing, the relative and the absolute; Zhou: a new "February adverse current," and praise of Jiang Qing in the thirties); [[w.yang-jisheng-tiandi-fanfu]], II, 1146 (a rally of ten thousand: the three removed, Yu arrested); [[w.teiwes-tragedy-of-lin-biao]], 52, 92–101 (Lin, two hours late, speaks from an outline Mao gave him: Yang''s "mountaintopism," trusting a small gang from one district of Jin-Cha-Ji; "double dealing," a "Luo Ruiqing element"; the "distortion of Marxism," the "absolute authority" theory; by Teiwes and Sun, Yang meant to remove Wu Faxian, Xie Fuzhi, Xu Shiyou, Han Xianchu, Huang Yongsheng, Chen Xilian and Yang Dezhi, the minority to be knocked down; the top leadership met Mao four times to decide; nothing of a "rightist wind" or a backer; of Jiang Qing: she "loyally executed Chairman Mao''s instructions" and "has been very creative herself"); [[w.jian-zhou-enlai]], 584 ("Two days later," at a mass rally, standing before Mao, Lin lists their crimes, factionalism and opposition to Mao Thought, mistakes "neither very big nor very small"); [[w.chen-yi-nianpu]], 1201 (Mar. 24, 1968; the meeting announcing the order); [[w.dikotter-cultural-revolution]], 172 n.27 (two days later Lin Biao''s effusive praise of Jiang Qing: an "outstanding role," "great creative power," a "great proletarian fighter"); [[w.liu-jixian-ye-jianying-nianpu]], II, 975–976 (Mar. 24, 1968; evening; Ye Jianying 叶剑英 with Chen Yi 陈毅 and others, seated below the platform; Wu Faxian 吴法宪; Yang and Yu plotting to seize the Air Force; four meetings at the Chairman''s; after it, inside and outside the army, a wind to seize the "black backer of Yang, Yu and Fu", Ye Jianying, Chen Yi, Xu Xiangqian, Nie Rongzhen, Li Fuchun and Li Xiannian its chief targets). Made public: 1995. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 221–222 (Mar. 24, 1968), has Zhou speak at the meeting after Lin: he supports Mao''s decision and the order Lin announced, speaks of the three men''s "errors", and affirms and praises Jiang Qing. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2008), 727 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 442 n.57); Lin Biao 林彪, 《在軍隊幹部大會上講話》, Mar. 24, 1968, in the *Wenku* (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 443 n.58); 《中央首長在接見軍隊幹部會議上的講話》 (Zhou Enlai, Jiang Qing, Chen Boda), Mar. 24, 1968 (printed 1967), in the *Wenku* (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 443 n.59); [[w.nianyi-da-dongluande-niandai]], 273–284, 286, 293 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73a); [[w.harding-chinese-state-in-crisis-1991]], 186 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73b); [[w.teiwes-provincial-leadership-in-china]], 12, 22–24, 31 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73c); [[w.kau-lin-piao-affair]], 488–500 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73d); [[w.barnouin-ten-years-of-turbulence]], 165, 167 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.73e); [[w.kau-lin-piao-affair]], 489–490, 494 (cited by [[w.teiwes-tragedy-of-lin-biao]], 92 n.74); [[w.kau-lin-piao-affair]], 488 (cited by [[w.teiwes-tragedy-of-lin-biao]], 93 n.78); [[w.kau-lin-piao-affair]], 493–494 (cited by [[w.teiwes-tragedy-of-lin-biao]], 94 n.79a); [[w.kau-lin-piao-affair]], 490, 495 (cited by [[w.teiwes-tragedy-of-lin-biao]], 96 n.84a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXVI, 88, 90 (cited by [[w.teiwes-tragedy-of-lin-biao]], 96 n.84b); [[w.kau-lin-piao-affair]], 489, 497–499 (cited by [[w.teiwes-tragedy-of-lin-biao]], 100 n.93); [[w.kau-lin-piao-affair]], 488–489 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97a); [[w.yunsheng-maojiawan-jishi]], 151 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97b); [[w.weixun-wo-suo-zhidaode-ye]], 225 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97c); [[w.nianyi-da-dongluande-niandai]], 290 (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97d); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 101 n.97e); [[w.kau-lin-piao-affair]], 496 (cited by [[w.teiwes-tragedy-of-lin-biao]], 52 n.103); Lin Biao''s speech at a conference of commanders above army level, Mar. 24, 1968, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 584 n.73); CIA, Intelligence Report, "Mao''s ''Cultural Revolution'' II: The Purge of the P.L.A. and the Stardom of Madame Mao," June 1968, 42–44 (cited by [[w.dikotter-cultural-revolution]], 172 n.27c). See [[cal.1968-03-22.china-leadership]]. Names: Lin Biao, Yang Chengwu, Yu Lijin, Fu Chongbi, Wu Faxian, Xie Fuzhi, Jiang Qing, Zhou Enlai, Chen Boda, Kang Sheng, Mao Zedong, Ye Jianying, Chen Yi.'
