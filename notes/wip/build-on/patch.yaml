- edit:
    id: cal.1964-11-25.china-leadership
    base: '1fe7d00a'
    set:
      c: 'Mao presides over an enlarged Politburo Standing Committee, Yinian Tang, afternoon: decides to hold a Central Work Conference in December on rural socialist education and the Third National People''s Congress at the same time, on the 1965 plan; and discusses Chen Yi''s trip to Indonesia and Burma. Present: Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun, Li Xiannian, Tan Zhenlin, Lu Dingyi, Bo Yibo, Luo Ruiqing, Chen Boda and Wu Lengxi; Lin Biao absent.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 25, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 908–909 (the enlarged Standing Committee, Yinian Tang main hall: Liu, Zhou, Zhu De, Chen Yun, Deng, Peng Zhen, Chen Yi, Li Fuchun, Li Xiannian, Tan Zhenlin, Lu Dingyi, Bo Yibo, Luo Ruiqing, Chen Boda, Wu; Lin Biao absent; a Central Work Conference in December on rural socialist education, the Third NPC''s first session on the 1965 plan; attention turning from foreign to domestic matters); [[w.deng-xiaoping-nianpu-1904]], III, 1838 (Nov. 25, 1964; Deng at the enlarged Politburo Standing Committee meeting Mao presides over; it decides to hold a Central Work Conference 中央工作会议 in December on the rural socialist education movement, the convening of the First Session of the Third NPC and the 1965 national economic plan, and discusses Chen Yi''s proposed visit to Indonesia, Burma and other countries); [[w.peng-zhen-nianpu-1902]], IV, 373 (Nov. 25, 1964; Peng Zhen at Mao''s enlarged Standing Committee, which sets a Central Work Conference in December on rural socialist education, the third NPC''s first session and the 1965 plan, and discusses Chen Yi''s visits to Indonesia, Burma and others). Made public: 1999. Names: Mao Zedong, Chen Yi, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Lu Dingyi, Bo Yibo, Luo Ruiqing, Chen Boda, Lin Biao.'
