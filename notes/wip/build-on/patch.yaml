- edit:
    id: cal.1968-03-31.robert-kennedy
    base: 'b1b212d2'
    set:
      c: 'Robert Kennedy, landing at La Guardia shortly before ten, hears from Burns that Johnson will not run. That night, from his apartment, calls to party leaders and a telegram to Johnson proposing a meeting. The telegram, 11:43 p.m.: "Your decision regarding the Presidency subordinates self to country and is truly magnanimous. I respectfully and earnestly request an opportunity to visit you as soon as possible." Burns, with Dall Forsythe, boards the plane: "The President is not going to run!" Kennedy: "I wonder if he would have done it if I hadn''t come in." At 870 United Nations Plaza, Dutton, Sorensen, vanden Heuvel and Walinsky; calls by him, Edward Kennedy and Smith to Daley, governors, senators and mayors; to O''Brien: "Here we go again, Larry." Sorensen writes the telegram.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 867–68; [[w.palermo-in-his-own-right]], 155–56 (C; Kennedy''s advisers at his apartment into the morning); [[w.shesol-mutual-contempt]], 436, 439–40 (on the plane, Burns: "Johnson isn''t running"; "I wonder if he would have done it if I hadn''t come in"; at United Nations Plaza: "The joy is premature"; calls to Daley, who will not come to the telephone, and to governors, senators and mayors; to O''Brien before midnight: "Here we go again, Larry"); [[w.zelizer-fierce-urgency-of-now]], 293–94 (Burns to Kennedy on the plane: "Johnson isn''t running"; vanden Heuvel: "This sure solves a lot of our troubles"); [[w.thomas-robert-kennedy]], 365 (Burns boards the plane: "The president is not going to run"; Kennedy: "You''re kidding"; on the drive in: "I wonder if he would have done this if I hadn''t come in"); [[w.sorensen-counselor]], 461 (Sorensen''s account, written in 2008: that night at Robert Kennedy''s New York apartment, with other friends and advisers, he watches Johnson''s address; astonished at the withdrawal, he urges a friendly farewell meeting with Johnson, seeking at the least his neutrality; Kennedy asks him to arrange it and attend; not La Guardia, the calls or the telegram); [[w.schlesinger-journals]], 285 (the night of Mar. 31, Schlesinger finds at the apartment Dutton, Sorensen, vanden Heuvel, Walinsky and others; Sorensen has written a telegram to Johnson requesting a meeting; Kennedy on the telephone with political figures around the country; Kennedy "supposed to arrive in New York that evening at 9:45"; not the landing, Burns or the telegram''s text or time); [[w.witcover-85-days]], 126–32 (the plane at John F. Kennedy International, not La Guardia; Burns and Dall Forsythe come aboard: "The President is not going to run!"; the apartment at 870 United Nations Plaza; calls from the apartment by Kennedy, Edward Kennedy and Smith to leaders in the nonprimary States and the mayors; the telegram "truly magnanimous," dispatched "in the early hours"). Check: Shesol, 436, has the flight from Phoenix land at Kennedy International at about 9:50 p.m. Check: Zelizer, 293–94, has Burns come up the aisle of the plane, Kennedy just back from Phoenix. To check: Schlesinger, journal, Mar. 31, 1968 (cited by [[w.schlesinger-robert-kennedy-and-his]], 868 n.50); Robert Kennedy to Johnson, telegram, Mar. 31, 1968, 11:43 p.m., RFK Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 156 n.122). See [[cal.1968-03-31.elections-1968]]. The meeting: [[cal.1968-04-03.robert-kennedy]]. Names: Robert Kennedy, Johnson, Dutton, Sorensen, vanden Heuvel, Walinsky, Edward Kennedy, Smith, Daley, O''Brien.'
