- edit:
    id: cal.1962-01-27.china-leadership
    base: '4a550c02'
    unset: [time]
    set:
      c: 'The Great Hall, 2 p.m. Mao presides over the Work Conference''s plenary session. Liu Shaoqi''s oral report: nationally the errors and the successes stand not as one finger to nine but as three to seven; in some regions the errors the greater; the peasants'' phrase, "three parts natural calamity, seven parts man-made"; the center first to answer for the errors, the State Council included; the ten-year goals of 1963–72 may be thought too low. Mao interjects: the center''s own improper things included; the slogans yet to be cleared up; the goals may not be reached; local interests to be looked after. Three hours, to 5:10 p.m. Industry down 40 percent or more, "a great saddle." Of Peng Dehuai: particulars of his letter fit the facts, but he long had a small clique in the Party, a remnant of the Gao–Rao group, with foreign backing; all may be rehabilitated but he. Mao: "so long as it is not illicit relations with foreign countries." Zhou Enlai, Deng Xiaoping and Peng Zhen attend.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 27, 1962. [[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 27, 1962: Zhou Enlai attends the plenary); [[w.macfarquhar-origins-of-the-cultural]], III, 158–66 (the speech: natural and human causes, seven fingers to three, Xinyang and Tianshui, the three red banners, Peng Dehuai, trade; Mao''s interruptions at 159, 160, 163); [[w.lengxi-shinian-lunzhan-1956-1966]], 482–486 (Liu, in his speech explaining the written report, takes the international matter first: Moscow-type revisionism from the Twentieth Congress, now a fair system after the Twenty-second, the "four antis"; the 1957 and 1960 meetings checked but did not bind; the Soviet break with Albania; the Soviets as bad to friends, mild to foes; division of the movement unavoidable, good in a sense; for Sino-Soviet relations three possibilities, as now, worse without a break, an open break, cadres to prepare for the worst; self-reliance, trade with imperialism if Soviet trade stops); [[w.macfarquhar-origins-of-the-cultural]], III, 144–145 (Liu''s plenary address on the second draft); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 547–548 (Jan. 27, 1962; Liu''s supplementary talk to the enlarged conference: shortcomings and successes were once spoken of as one finger to nine, but for the country as a whole they are three fingers to seven, and in some places more than three fingers; in Hunan the peasants say "three parts natural calamity, seven parts man-made"; in a part of the country faults and errors are the main thing, not successes; to admit faults, sum up experience and learn; to clear up the slogans of recent years, "as bold as the man, as high the yield" and the labelling of attention to objective conditions as the "theory of conditions," and the claim that "left" is better than right; the Party is to take up again the tradition of seeking truth from facts, investigate, and develop democracy within the Party and among the people; the talk is in his Selected Works); [[w.yang-shangkun-riji]], II, 117 (Jan. 27, 1962; the Great Hall, 2 p.m.; Liu Shaoqi''s report three hours, to 5:10; Mao, presiding, announces group discussion the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1686 (Jan. 27, 1962; afternoon; Deng at the plenary: Liu, errors and successes perhaps three fingers to seven nationally, more in some regions; "three parts natural disaster, seven parts man-made" in some places; Mao sets the following days); [[w.mao-zedong-zhuan]], V, ch. 69 nn.16, 18 (Jan. 27, afternoon plenary, Mao presiding: Liu''s oral report on four matters, the international and domestic situation, centralized unity and Party style; the account of the faults, three parts to seven, no longer one finger to nine; Mao fixes the days left, to end by Jan. 30 or 31). [[w.dikotter-maos-great-famine]], 335–336 n.1 (Liu speaks three hours to the 7,000 cadres: successes to errors seven to three, not nine fingers to one; in places the errors greater, as in Xinyang and Tianshui; the Hunan saying of 30 per cent natural calamities, 70 per cent man-made; Mao interrupts him on the number of regions with falling output); [[w.yang-jisheng-mubei]], II, 1113–1115 n.9 (2 p.m., Mao presiding; Liu speaks three hours: the successes and the faults no longer one finger to nine but three to seven, in some regions the faults the larger; the peasants'' phrase, three parts natural calamity, seven parts man-made; the Center first to answer, then the provincial committees; the three red banners to be tried by practice; Mao puts in that quite a few have had edema); [[w.yang-jisheng-mubei]], II, 1125–1126 n.29 (Liu''s oral report held a passage on Peng Dehuai of about 1,100 characters, cut from his *Selected Works*: the struggle against Peng at Lushan was wholly necessary, not because of his letter, some of whose particulars fit the facts, but because for long he had had a small clique in the Party, a remnant of the Gao–Rao group and its main member, with an international background, its anti-Party acts tied to subversion by certain foreigners in China, and plotting to usurp the Party); [[w.yang-jisheng-mubei]], II, 648 ("three parts natural disaster, seven parts man-made"); [[w.jian-zhou-enlai]], 461 (Liu: 30 percent natural disasters, 70 percent human mistakes; the peasants will not be convinced otherwise); [[w.yang-jisheng-tiandi-fanfu]], I, 67–68 (the outline circulated beforehand to Mao and the Standing Committee and agreed; 2 p.m., Mao presiding; three hours; the output of industry down by 40 percent or more, "a saddle"; "three parts natural disaster, seven parts man-made"; three fingers to seven; the Center first responsible; the three red flags still to be tested in practice; Liu also on Peng Dehuai and Gao Gang); [[w.yang-jisheng-tiandi-fanfu]], I, 77 (Liu: Peng Dehuai has long had a small clique in the Party, took part in the Gao–Rao clique, used Gao Gang; both had foreign backing; Peng wanted to usurp the Party); [[w.peng-zhen-nianpu-1902]], IV, 169 (Jan. 27, 1962, afternoon; Peng Zhen at the plenary, Mao presiding; on Mao''s view Liu''s written report printed and Liu explains it orally: three years'' fall in farm output large, industry down over 40 percent in 1961, "a great saddle"; natural disasters and errors since 1958, in some areas the errors chief); [[w.peng-zhen-nianpu-1902]], IV, 169–170 (Jan. 27, 1962; Liu: "三分天灾，七分人祸" as Hunan peasants say of some places; the "three red banners" kept, to be judged after five or ten years; wrong slogans such as "人有多大胆，地有多高产" and "conditions-only theory" corrected; Mao arranges the coming days); [[w.dikotter-cultural-revolution]], 11–12 n.13 (Liu, before a packed audience: the farmers of Hunan hold the disaster 70 percent man-made, 30 percent natural; "man-made disaster" (renhuo); successes to setbacks seven to three, not nine fingers to one; Mao interrupts: not a small number of regions at all, in Hebei only 20 percent of regions fell in output, in Jiangsu 30 percent rose year after year); [[w.pu-weihua-zalan-jiu-shijie]], 5 (Liu: the economy''s grave difficulties "three parts natural calamity, seven parts man-made"; of the Three Red Banners, some questions not yet clear; after five or ten years more can be concluded); [[w.peng-dehuai-nianpu]], 771 (Liu Shaoqi 刘少奇, in the written report and his speech, on Peng Dehuai 彭德怀: many of the concrete matters in his letter fitted the facts, and a Politburo member writing to the Chairman commits no error even if some of his views are wrong; but he long had a small group in the Party, took part in the Gao Gang–Rao Shushi 高岗、饶漱石 anti-Party group as a chief member, had "international backing," and carried on factional activity behind the Center''s back; all may be rehabilitated but Peng. Mao Zedong 毛泽东 interjects: "So long as it is not illicit relations with foreign countries" 里通外国). Made public: 1996. To check: Liu''s oral report and the written report as adopted (the nianpu gives the oral report''s words and Mao''s interjections); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 418–43 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.96a); Liu Shaoqi, speech of Jan. 27, 1962, mimeographed version (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.96b); [[w.qi-qian-ren-dahui]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.96c); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 159 n.99a); Liu Shaoqi, speech of Jan. 27, 1962, mimeographed version (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 159 n.99b); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 420–21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 160 n.104); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 160 n.106); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 421 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 160 n.107); Liu Shaoqi, speech of Jan. 27, 1962, mimeographed version, 13–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 162 n.119); [[w.selected-works-of-liu]], 2, 328–96 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 145 n.27b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1017, 1019–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-e); Liu Shaoqi 刘少奇, oral report to the enlarged Central Work Conference, Jan. 27, 1962; [[w.shaoqi-liu-shaoqi-xuanji-selected]], 418–443 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.16); Record of the enlarged Central Work Conference 扩大的中央工作会议记录, Jan. 27, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.18); Liu Shaoqi, speech of Jan. 27, 1962, Gansu Provincial Archives, 91-18-493, pp. 58–60 and 62 (cited by [[w.dikotter-maos-great-famine]], 336 n.1); Wang Nianyi 王年一, 〈漫談文革〉, *Ershiyi shiji* 《二十一世紀》, Oct. 2006 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 77 n.87); [[w.sheng-zhongguo-gongchan-dangde-qishi]], 442 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 5 n.9). See [[cal.1962-01-26.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Peng Dehuai, Zhou Enlai, Deng Xiaoping, Peng Zhen.'
