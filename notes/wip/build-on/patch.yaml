- edit:
    id: cal.1962-08-03.china-leadership-3
    base: '2bb694f5'
    set:
      c: 'Beidaihe 北戴河, 9 p.m. At Mao''s 毛泽东, the Standing Committee on how to run the conference; Deng Xiaoping, Peng Zhen, Chen Boda and Yang Shangkun 杨尚昆 there. A core group 核心小组 of 22 set up: Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng, Peng, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Gu Mu, Lu Dingyi, Yang, Ke Qingshi, Li Jingquan, Tao Zhu, Song Renqiong, Li Xuefeng, Liu Lantao.'
      n: '[[w.yang-shangkun-riji]], II, 201 (Aug. 3, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1720 (Aug. 3, 1962; evening; a core group 核心小组 (central group)); [[w.peng-zhen-nianpu-1902]], IV, 209 (Aug. 3, 1962, evening; Peng, Chen Boda and Yang sit in; the Central Work Conference; a central (core) group, its 22). The words: 晚间9时 (II, 201). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Mao Zedong, Yang Shangkun, Deng Xiaoping, Peng Zhen, Chen Boda, Liu Shaoqi, Zhou Enlai, Zhu De, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Luo Ruiqing, Xie Fuzhi, Lu Dingyi, Ke Qingshi, Li Jingquan, Tao Zhu.'
