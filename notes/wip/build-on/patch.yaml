- edit:
    id: cal.1966-07-19.china-leadership
    base: 'a903b1b9'
    set:
      c: 'Peking. At Mao''s wish Liu Shaoqi presides over an enlarged Standing Committee meeting. Chen Boda proposes to withdraw the work groups; Liu, Deng Xiaoping and most others oppose. Asked afterward, Mao decides to withdraw them. Zhou Enlai, Kang Sheng, Chen Yi and Tao Zhu back Chen; Deng: bad groups may be withdrawn first, good ones stay; he does not agree to withdrawing them all. Liu: the groups good and bad, on the first line, to be helped; the students may debate a while longer.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 40 (July 19, 22, 1966; Zhou attends both meetings; Chen Boda''s proposal to withdraw the work groups opposed by Liu, Deng and most); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 19, 1966; Liu presides at the enlarged Standing Committee meeting on the "Cultural Revolution"; Chen Boda proposes to withdraw the work groups and is opposed by Deng Xiaoping and most others; Liu backs the majority, saying work groups are good and bad, are on the first line and have their hardships, and the demand is to help and educate them and sum up the work; the students'' recognition and action are not uniform and they may debate a while longer, gain experience, and then counter-attack the black gang); [[w.macfarquhar-maos-last-revolution]], 83 (Chen Boda again suggests withdrawing the work teams, and a majority led by Liu and Deng turns it down; Zhou Enlai''s position is not clear; Zhou is present at the first meeting); [[w.deng-xiaoping-nianpu-1904]], III, 1924 (July 19, 1966; afternoon, 下午; Deng at the enlarged Standing Committee meeting Liu Shaoqi holds on Mao''s view; when Chen Boda proposes to withdraw the work teams Deng and most others object; Deng says the work teams must be estimated correctly, neither the Party nor the teams had experience of such a movement; bad teams can be withdrawn first, good ones may stay and act for the Party committees; answering Chen''s charge that the central leaders in Peking ''fear the masses'' he rebuts it and says plainly that he does not agree to withdrawing all the work teams); [[w.yang-jisheng-tiandi-fanfu]], I, 212–214 (July 13, 19 and 22 the Center holds three meetings on the work groups, Chen Boda for the Cultural Revolution Group asking their withdrawal, Liu rebutting angrily and quarreling with Kang Sheng, Deng rising and refusing; the Huairen Hall meeting, which Li Xuefeng puts on July 18 afternoon and Yang, by the Zhou and Mao chronologies, on July 19: Liu says that this way of theirs truly sets masses against masses, "we have materials," Kang Sheng: "we have materials too," Chen Boda and Deng quarrel, Jiang Qing slips in and sits on a sofa; Chen Boda''s proposal was after Shanghai telephoned Wang Li in late June against the old organs sending work groups; after the Standing Committee dispute, Mao, asked, decides to withdraw them); [[w.jian-zhou-enlai]], 547 (Liu chairs the enlarged Standing Committee, Zhou there; Chen Boda, head of the Cultural Revolution Group, proposes recalling all work teams; the majority, Liu and Deng among them, oppose; Zhou: the teams might be "temporarily recalled and the masses thus be allowed to carry out the movement by themselves"; at the enlarged meeting "the next day," so Chen: Deng, against withdrawing the teams, yells at Chen Boda, "If all the work teams are to be recalled, how can the party lead?"; Liu backs him, most teams good; Zhou silent; the motion tabled; Mao absent; the Deng chronology the note cites has Deng''s rebuttal of Chen on July 19, III, 1924, and Liu and Deng''s "most work teams are good" on July 22, III, 1924–1925); [[w.pu-weihua-zalan-jiu-shijie]], 174–175, 175 n.124 (Chen Boda: "work groups are not necessarily wiser than the students"; Zhou Enlai, Kang Sheng, Chen Yi and Tao Zhu support him; Deng Xiaoping: bad work groups may be withdrawn first, good ones stay; Liu Shaoqi backs the majority; Li Xuefeng''s memoir has Deng stand up and speak in anger (175 n.124)). Made public: 1996. Check: [[w.jian-zhou-enlai]], 547, puts Deng''s outburst at Chen Boda and the tabling of the motion at a session the day after July 19; the Zhou chronology has the meetings on July 19 and 22 ([[cal.1966-07-22.china-leadership-7]]). To check: [[w.zhou-enlai-nianpu-1949]], III, 41 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.74); Mao Mao 毛毛, *Wode fuqin Deng Xiaoping "wenge" suiyue* 《我的父親鄧小平「文革」歲月》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2000), 21 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 213 n.69); Li Xuefeng 李雪峰, 〈回憶「文化大革命」初期的「五十天路線錯誤」〉, *Zhonggong dangshi yanjiu* 《中共黨史研究》 1998 no. 4, reprinted in Zhang Hua et al., eds., *Shinian wenge* 《十年文革》 (Zhonggong dangshi chubanshe 中共黨史出版社, 2007), 650–651 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 213 n.71); Chen Xiaonong 陳曉農, *Chen Boda zuihou koushu huiyi* 《陳伯達最后口述回憶》 (Dongfang chubanshe 東方出版社, 2010), 312 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 213 n.72); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 31 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 214 n.73); [[w.qi-benyu-huiyilu]], 445 (cited by [[w.jian-zhou-enlai]], 547 n.13b); [[w.li-xuefeng-recalling-the-first-fifty-days]], 5 (cited by [[w.jian-zhou-enlai]], 547 n.15a); [[w.qi-benyu-huiyilu]], 445–446 (cited by [[w.jian-zhou-enlai]], 547 n.15b); [[w.jin-chongji-liu-shaoqi-zhuan]], 1027–1028 (cited by [[w.jian-zhou-enlai]], 547 n.15d); 李雪峰, 〈回憶「文化大革命」初期的「五十天路線錯誤」——從「6.18」事件到「7.29」大會〉, in [[w.huishou-wenge-2-vols]], II, 657 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 175 n.124b). Names: Liu Shaoqi, Mao Zedong, Chen Boda, Deng Xiaoping, Zhou Enlai, Kang Sheng, Chen Yi, Tao Zhu.'
