- edit:
    id: cal.1964-06-16.china-leadership
    base: '5a489a17'
    set:
      c: 'Mao, at the Ming Tombs Reservoir, afternoon: after watching the Beijing and Jinan troops'' display, presides over a meeting of the Politburo Standing Committee and the first secretaries of the Party''s regional bureaus. Two things: local Party committees to take up military matters, and successors. Each province to build a militia, local troops, an arms plant. For successors, five conditions: know some Marxism-Leninism; serve the majority at home and abroad; unite most, even those once opposed; consult, no one-man talk; criticize oneself. Three tiers of successors, from the bureaus to the branches. The reservoir''s administration office. Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu, Deng Xiaoping, Peng Zhen and Chen Yi at the display. Gao Gang, Rao Shushi, Peng Dehuai and Huang Kecheng named as plotters; "successors grow in great storms."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 16, 1964; [[w.zhou-enlai-nianpu-1949]], II, 648 (June 15–16, 1964: Zhou, with Mao, Liu Shaoqi, Dong Biwu, Zhu De, Deng Xiaoping and others, reviews the exercises of the Beijing and Jinan units); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 594 (June 15 and 16, 1964; Liu, with Mao, Dong Biwu, Zhu De, Zhou Enlai and Deng Xiaoping, inspects the military skill display of the Peking and Jinan troops); [[w.macfarquhar-origins-of-the-cultural]], III, 363 n.97 (Mao speaks on revolutionary successors, in a speech to a central work conference on June 16); [[w.jianguo-yilai-mao-zedong]], XVII, 263–266 (June 16, 1964; an extract, printed from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967); note 1: at the Ming Tombs Reservoir''s administration office, to the Standing Committee and the regional bureaus'' first secretaries; the five conditions as the entry gives them, with Gao Gang, Rao Shushi, Peng Dehuai and Huang Kecheng named as plotters, and "successors grow in great storms"); [[w.macfarquhar-origins-of-the-cultural]], III, 448 (a two-day display at the Ming Tombs before Mao, Liu Shaoqi, Zhou Enlai, Zhu De and Deng Xiaoping; by post-Cultural Revolution accounts Mao approves; by Li Zhisui''s, he remarks on Luo Ruiqing caustically); [[w.yang-shangkun-riji]], II, 384 (June 16, 1964; Yang leaves at 2:15, reaches the Ming Tombs 十三陵 at 3:30 and watches the display on the water, 5 to 6 p.m.; 385: Li Xuefeng relays to the group on June 17 Mao''s words at the meeting near the reservoir the day before); [[w.deng-xiaoping-nianpu-1904]], III, 1816 (June 16, 1964; 下午; Deng attends the meeting Mao Zedong 毛泽东 calls of the Politburo 政治局 Standing Committee 政治局常委会 and the regional bureaus'' first secretaries, at which Mao speaks on the question of successors); [[w.mao-zedong-zhuan]], V, ch. 71 (June 16, afternoon 下午, at the Ming Tombs reservoir administration''s meeting room, Changping county: five conditions for successors; printed in the ninth commentary (n.43)). [[w.jian-zhou-enlai]], 488–489 (June 1964: Mao on raising successors to the proletarian cause); [[w.peng-zhen-nianpu-1902]], IV, 338 (June 16, 1964, afternoon; the Ming Tombs reservoir''s office; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first secretaries: the local committees to take up military affairs; revolutionary successors, five conditions: Marxism-Leninism, not revisionism; the majority''s interests; uniting the majority; consulting comrades; self-criticism; successors at several levels from the regional bureaus down to the branches); [[w.chen-yi-nianpu]], 1035 (June 15–16, 1964; Chen Yi with Mao, Liu Shaoqi, Dong Biwu, Zhu De, Zhou, Deng Xiaoping, Peng Zhen and others at the Ming Tombs Reservoir reviews the training display of the Peking and Jinan forces); [[w.pu-weihua-zalan-jiu-shijie]], 23 (June 15 and 16: Mao and the Party''s and state''s leaders review the competition displays of the Peking and Jinan units; Mao praises them and has the experience of the "picked men" spread through the army); [[w.zhu-de-nianpu-xinbian]], III, 1910–1911 (June 16, 1964, afternoon; the nianpu tells, under Zhu De''s review of the troops, Mao Zedong''s 毛泽东 meeting of the Politburo Standing Committee 中共政治局常委 and the regional bureaus'' first secretaries 中央局第一书记 at the office of the Ming Tombs reservoir 十三陵水库管理处: his talk on successors, a strategic measure against revisionism; the regions and provinces each to run arms works 军工厂, militia and local forces). Made public: 1989 ([[w.al-zhongguo-gongchan-dang-zhizheng]]). Check: the Wengao prints this talk from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), which Mao checked before it came out ([[w.jianguo-yilai-mao-zedong]], XVII, 265 n.1); if that printing was open, it was made public in 1967, not 1996. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1158–62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 363 n.97a); [[w.zedong-jianguo-yilai-mao-zedong]], 11, 87 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 363 n.97b); [[w.al-zhongguo-gongchan-dang-zhizheng]], 248 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 448 n.107a); [[w.zhisui-private-life-of-chairman]], 97–8, 157–9, 184–6, 435 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 448 n.107b); Mao Zedong 毛泽东, talk on training successors, Ming Tombs reservoir 十三陵水库, June 16, 1964 (printed in *Mao zhuxi lun jiaoyu geming* 《毛主席论教育革命》, Renmin chubanshe, Dec. 1967, 18-21) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.43). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu, Deng Xiaoping, Peng Zhen, Chen Yi, Peng Dehuai.'
