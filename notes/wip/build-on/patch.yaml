- edit:
    id: cal.1962-05-07.china-leadership
    base: 'f9915a2f'
    set:
      c: 'Peking. The Central Work Conference, Liu Shaoqi presiding, May 7–11, on the Central Finance Group''s draft report: the hardest period not past in some regions and branches; a great, broad adjustment of the economy; agriculture, light industry, heavy industry in that order; cut the industrial front, cut workers and town population, raise farm inputs and consumer goods, stop inflation. Zhou Enlai then drafts the Central Committee''s covering directive. May 7, the plenary, 3:30 to 6:50 p.m., 102 present; Li Fuchun and Li Xiannian report. Liu: without measures this year, next year worse; the economy may collapse. Zhou Enlai, Zhu De, Deng Xiaoping, Chen Yi and Peng Zhen attend; Liu, Zhou, Zhu De, Deng, Li Fuchun, Li Xiannian, Yao Yilin and Deng Zihui speak.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1962 (the entry for May 7–11); [[w.zhou-enlai-nianpu-1949]], II, 476–77 (May 7–11, 1962: Zhou Enlai arranges the agenda and the list of those attending; joins the industry and transport and other groups; speaks May 11); [[w.macfarquhar-origins-of-the-cultural]], III, 199–200, 208 (May 7–11: 105 officials; two days on the small group''s report, five groups; four Standing Committee members speak on the last day); [[w.macfarquhar-origins-of-the-cultural]], III, 209 (no conclusion was reached on further changes to rural collectivization); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 554–555 (May 7–11, 1962; Liu presides at the Central Work Conference (the "May conference"), chiefly on the Finance and Economics Small Group''s report on the 1962 adjustment plan; May 7, after Li Fuchun and Li Xiannian on further reducing the town population, cutting staff, shortening the industrial front, grain and foreign exchange, Liu: if no measures are taken this year, next year''s situation will be worse; the trend, if not turned, is a very bad one and the economy will collapse); [[w.yang-shangkun-riji]], II, 158 (May 7, 1962; the plenary, 3:30 to 6:50 p.m., 102 present, Liu Shaoqi presiding; Li Fuchun and Li Xiannian report); [[w.deng-xiaoping-nianpu-1904]], III, 1703–1704 (May 7–11, 1962; Deng attends and speaks at its close; the Finance and Economics Group''s draft report; the eight characters carried out fully, a broad readjustment, farming, light, heavy industry in order, the industrial front shortened, workers and townspeople cut, farming strengthened, the market supplied, inflation checked); [[w.mao-zedong-zhuan]], V, ch. 69 (May 7–11, the Central Work Conference at Peking, Liu Shaoqi presiding: the Politburo members in Peking and Secretariat members, the bureaus'' first secretaries, the Center''s and State Council''s officials; the plan for 1962 adjusted further). [[w.yang-jisheng-mubei]], II, 1175 (the May meeting, May 7–11, 1962, Liu Shaoqi presiding: the Xilou and State Council papers carried out; "retreat enough"; Chen Yun''s advice; "extraordinary measures for an extraordinary time"); [[w.chen-yi-nianpu]], 917 (May 7–11, 1962; Chen Yi attends); [[w.yang-jisheng-tiandi-fanfu]], I, 73 (May 7–11; Liu: "not a fine situation ... a difficult one"; the political situation may turn worse); [[w.peng-zhen-nianpu-1902]], IV, 194–195 (May 7–11, 1962 (the "May conference"); Peng Zhen attends; the Central Finance and Economics Group''s draft report on the 1962 adjustment plan; the decision to carry out the eight-character line by a sweeping adjustment, agriculture, light and heavy industry in order, the industrial front shortened, town population and staff cut, the market supplied, inflation stopped; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Li Fuchun, Li Xiannian, Yao Yilin and Deng Zihui speak); [[w.dikotter-cultural-revolution]], 17 n.9 (in May Liu presses for the right of some villagers to leave the collectives: "if we don''t allow 20 per cent of the peasants to go it alone, I don''t think we can keep the collective economy"); [[w.zhu-de-nianpu-xinbian]], III, 1836–1837 (May 7–11, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "May conference" 五月会议) Liu Shaoqi 刘少奇 holds at the Huairen Tang 怀仁堂, Peking 北京, on the Central Finance and Economics Group''s draft report on the 1962 readjustment plan: the conference agrees with the Center''s view of the economic situation; Liu in his summing-up: not a fine situation but a difficult one, to be made plain to the cadres); [[w.chen-yun-nianpu-xiuding]], III, 133 (May 7–11: the conference agrees with the group''s analysis and decides on an all-round, sweeping adjustment, agriculture, light and heavy industry in order, the industrial front shortened, workers and townspeople cut, the market supplied, inflation stopped; Deng Xiaoping at the close: two central tasks, 20 million fewer townspeople and better work in the teams; the group revises the report after, and with Mao''s approval it goes out May 26). Made public: 1995. To check: [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.55a); [[w.huaxuan-zhongguo-gongchan-dang-huiyi]], 481 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.55b); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 63–77 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 200 n.58a); [[w.enlai-zhou-enlai-xuanji-selected]], 2, 416–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 200 n.58b); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 444–49 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 200 n.58c); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 300–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 200 n.58d); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 94–96 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 208 n.92); Extracts of the minutes of the May meeting and the Beidaihe meeting, Oct. 1967, Shanghai Municipal Archives, B104-3-41, pp. 7–10 (cited by [[w.dikotter-cultural-revolution]], 17 n.9). Names: Liu Shaoqi, Zhou Enlai, Mao Zedong, Li Fuchun, Li Xiannian, Zhu De, Deng Xiaoping, Chen Yi, Peng Zhen.'
