- edit:
    id: cal.1969-04-01.china-leadership
    base: 'e7fce673'
    set:
      c: 'The Ninth National Congress of the Chinese Communist Party opens in the Great Hall, Peking, Apr. 1–24: 1,512 delegates for 22 million members. Mao is elected chairman of the presidium, Lin Biao vice-chairman, Zhou Enlai secretary-general; the agenda: Lin''s political report, the constitution, election of a Central Committee. Mao presides and speaks: the people''s political histories now clear; he hopes for a united congress and then for greater victories. The presidium of 176 passed by applause and hands. Lin Biao reads the political report. Mao: of the twelve at the first congress, only he and Dong Biwu remain. Dong, eighty-three, the oldest delegate; 422, 28 percent, for the armed forces. Chen Yun on the platform, front right; Chen Yi, Ye Jianying and Zhu De attend. Deng Xiaoping and many of the Eighth Central Committee shut out. The congress not announced; no foreign guests.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 1–24, 1969; the book says the Ninth Congress of the Chinese Communist Party meets at Peking; Lin Biao''s political report affirms the "theory of continuing revolution under the dictatorship of the proletariat" as the guiding thought of socialist revolution and the theoretical basis of the "Cultural Revolution," and so legitimizes the Cultural Revolution''s wrong theory and practice; the congress elects a new central leadership into which many close friends and followers of Lin Biao and Jiang Qing enter the Central Committee); [[w.jianguo-yilai-mao-zedong]], XIX, 416–423 (Apr. 1, 1969; Mao''s speech at the opening of the Ninth Congress, printed from the Center''s document, which the Center sent out May 9, 1969 with his speech of Apr. 28 at the First Plenum, for reading to the revolutionary committee members of factories, communes, schools and offices and army cadres of platoon level and above; he says of the first congress of 1921 that twelve delegates attended and that of them only he and Dong Biwu remain; he names Wang Jinmei, Deng Enming, Chen Tanqiu, He Shuheng and Li Hanjun as martyrs and Chen Gongbo, Zhou Fohai, Zhang Guotao and Liu Renjing as traitors, Li Da dead two years; and that of the Party''s early leaders Qu Qiubai, Li Lisan and Wang Ming erred, and that the political histories of Liu Shaoqi, Peng Zhen and Bo Yibo were unclear and are clear now); [[w.macfarquhar-maos-last-revolution]], 287 (1,512 delegates, Apr. 1–24, notionally for 22 million members, chosen by discussion, not election, some not Party members); [[w.macfarquhar-maos-last-revolution]], 287–288 (the oldest delegate Dong Biwu, eighty-three, a founder of the Party with Mao; the youngest a Red Guard of nineteen; 422 delegates, 28 percent, for the armed forces); [[w.macfarquhar-maos-last-revolution]], 288 (the congress not announced in advance; no foreign guests; reporters held back; the delegates kept incommunicado); [[w.macfarquhar-maos-last-revolution]], 285, 288 (Mao''s opening address: "a congress of unity and a congress of victory"; the job of the Cultural Revolution "not yet finished"); [[w.macfarquhar-maos-last-revolution]], 289 (Lin Biao, who had no part in the report and never read it through, though Mao asked him to, reads it on the opening day); [[w.deng-xiaoping-nianpu-1904]], III, 1947 (Apr. 1–24, 1969; the nianpu: Lin Biao gives the political report for the Central Committee; many of the Eighth Central Committee''s members, Politburo members and Standing Committee members, Deng Xiaoping among them, and a large body of former chief leaders of the provinces and central organs, are shut out of the Congress); [[w.mao-zedong-zhuan]], VI, ch. 77 n.75 (Apr. 1 the Ninth Congress opens in Peking under Mao''s chairmanship; Mao: ''I hope our congress will go well, will be a united congress, a victorious one''; after the Eighth Congress things are now pretty clear in political line, organizational line and thought, so a united congress and, on that ground, victory, and after it greater victory in the whole country; Lin Biao 林彪 then gives the Central Committee''s political report, in eight parts (the preparation of the Cultural Revolution; its course; doing struggle, criticism and reform well; its policies; the final victory of our revolution; the consolidation and building of the Party; relations of our country with foreign countries; the whole Party and people to unite for greater victory); the book dates the Congress Apr. 1–24, in two stages, Apr. 1–14 the report and the constitution, Apr. 15–24 the election, with three plenary sessions; no figure of delegates or members, n.75). [[w.yang-jisheng-tiandi-fanfu]], II, 714–715 (Apr. 1 to 24; at the meeting of Apr. 1 no one enters by the Great Hall''s main door); [[w.yang-jisheng-tiandi-fanfu]], II, 1147 (Apr. 1 to 24; a congress of the rebels'' and still more of the army''s victory); [[w.yang-jisheng-tiandi-fanfu]], II, 715–716 (the opening at 5 p.m., 下午 5 時, not 9 a.m.; the presidium of 176, its list given out beforehand, passed by applause and hands; Mao proposes Lin Biao as the presidium''s chairman, Lin turns it back to him; Mao chairman, Lin vice-chairman, Zhou Enlai secretary-general, each by hands; Mao''s opening speech, under 800 characters as the secretariat edited it, broken dozens of times by slogans); [[w.peng-zhen-nianpu-1902]], IV, 503 (Apr. 1–24, 1969; the congress makes lawful the Cultural Revolution''s wrong theory and practice; Lin Biao''s and Jiang Qing''s (Politburo from Apr. 28, the editors'' note) followers enter the Central Committee; Lin sole vice-chairman, Mao''s "successor"); [[w.khoo-collateral-damage]], 56–57 (the Ninth Congress, Apr. 1–24; Lin Biao on the Soviet proposal of talks: China "considering its reply"); [[w.teiwes-tragedy-of-lin-biao]], 104, 108 (Lin goes through the motions of reading the official report); [[w.jian-zhou-enlai]], 592–593 (Zhou reaches the Great Hall late in the afternoon; Mao opens the congress at 5:00 p.m., one of "unity and victory"; Lin, who had not read Zhang Chunqiao''s drafts, delivers the report in "broken sentences"); [[w.friedman-shadow-cold-war]], 177 (the Ninth Congress, from Apr. 1: the Cultural Revolution prolonged under the PLA, "purifying class ranks"); [[w.chen-yi-nianpu]], 1213 (Apr. 1–24, 1969; Chen Yi attends the Ninth Congress at Peking); [[w.dikotter-cultural-revolution]], 207 n.4 (the delegates flown to the capital by night on chartered military planes, told to tell no one of the Congress); [[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Apr. 1–24, 1969; Ye Jianying 叶剑英 at the Ninth Congress 中共第九次全国代表大会, elected to the Central Committee); [[w.chen-yun-nianpu-xiuding]], III, 168 (Apr. 1–24: Chen Yun attends the Ninth National Congress of the Communist Party of China and sits at the front of the platform on the right at its opening session; Mao gives the opening speech; the Congress adopts the political report Lin Biao makes for the Center and the revised constitution; the nianpu: the report makes the wrong thought centered on class struggle "the Party''s basic line for the whole historical stage of socialism" and calls "the theory of continuing revolution under the dictatorship of the proletariat" the newest development of Mao Zedong Thought; the new constitution writes Lin Biao into its general program as "Mao Zedong''s successor"; the Congress made the Cultural Revolution''s theory and practice lawful and strengthened Lin Biao''s and Jiang Qing''s places in the Center); [[w.zhu-de-nianpu-xinbian]], III, 1968–1969 (Apr. 1–24, 1969; Zhu De 朱德 at the Ninth National Congress of the Chinese Communist Party 中国共产党第九次全国代表大会 in Peking); [[w.peng-dehuai-nianpu]], 822 (Apr. 1–24, 1969: the Ninth Congress of the Chinese Communist Party 中国共产党第九次全国代表大会 held at Peking 北京). Check: [[w.macfarquhar-maos-last-revolution]], 285, gives the words "not yet finished" as from one of Mao''s speeches at the congress; its note (285 n.3) cites the page (4) of the "Jiuda" ziliao huibian it cites (289 n.19) for the opening address. To check: Central Committee, document of May 9, 1969 sending out Mao Zedong''s speech at the opening of the Ninth Congress and his speech of Apr. 28 at the First Plenum of the Ninth Central Committee, to be read to the members of revolutionary committees of factories, communes, schools and offices and to army cadres of platoon level and above (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 417 n.1); [[w.zhou-enlai-nianpu-1949]], III, 284, 285, 288 (cited by [[w.macfarquhar-maos-last-revolution]], 287 n.13); [[w.nianyi-da-dongluande-niandai]], 320 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.14a); [[w.jiuda-ziliao-huibian]], 44 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.15); [[w.xuan-wenhua-dageming-jianshi]], 202–203 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.16); [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 11–13 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.25); [[w.yunsheng-maojiawan-jishi]], 209–215 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.26); Mao Zedong 毛泽东, speech at the opening of the Ninth National Congress of the Chinese Communist Party 中共九大 (record 讲话记录), Apr. 1, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.75); Chi Zehou 遲澤厚, 〈中共「九大」內幕瑣憶〉, *Yanhuang chunqiu* 《炎黃春秋》, 2003, no. 3 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 715 n.3); Lin Biao, "Report to the Ninth National Congress of the Communist Party of China," *Peking Review*, Apr. 30, 1969, 33 (cited by [[w.khoo-collateral-damage]], 57 n.84); [[w.qiu-huizuo-huiyilu]], II, 620 (cited by [[w.jian-zhou-enlai]], 593 n.4b). Names: Mao Zedong, Lin Biao, Zhou Enlai, Dong Biwu, Chen Yun, Chen Yi, Ye Jianying, Zhu De, Deng Xiaoping.'
