- edit:
    id: cal.1968-03-25.vietnam
    base: 'b788d69d'
    set:
      c: 'The Wise Men. Mar. 25, at State: dinner with Rusk, Clifford and others, three briefings, DePuy''s among them. Mar. 26, Johnson with Wheeler and Abrams, then the group with the President. McGeorge Bundy''s summary: Acheson for the majority, "we can no longer do the job we set out to do in the time we have left and we must begin to take steps to disengage"; Ball, Dean, Vance and Dillon with him; Bradley, Taylor and Murphy against; Ball, Goldberg and Vance for stopping the bombing now. Johnson to Wheeler and Abrams: "We have no support for the war. This is caused by the 206,000 troop request, leaks, Ted Kennedy and Bobby Kennedy." The briefers: Habib, Carver and DePuy; Habib: "Stop bombing and negotiate." The group with the President, 10:30 a.m. to 12:15 p.m.'
      n: '[[w.johnson-vantage-point]], 415–18; [[w.mcpherson-political-education]], 433 (Acheson to McPherson, Mar. 26: the majority for de-escalation; Carroll''s editorial "my views precisely"); [[w.clifford-counsel-to-the-president-2]], 511–18 (the dinner at State and the three briefings; Johnson with Wheeler and Abrams, his words otherwise: "We have no support for the war. This was caused by the 206,000-man request and the leaks, by Teddy Kennedy and Bobby Kennedy"; Bundy''s summary; Ball and Vance for a full halt, not Goldberg); [[w.rusk-as-i-saw-it-1990]], 480–81 (the group; Acheson''s change); [[w.preston-war-council]], 238 (Bundy the Wise Men''s spokesman: "must begin to take steps to disengage"); [[w.white-making-of-the-president-1969]], 111–13; [[w.branch-at-canaans-edge]], 727–28 (Acheson, "what in the name of God are five hundred thousand men out there doing?"; Abrams to Johnson that evening); [[w.branch-at-canaans-edge]], 729 (Johnson to Wheeler and Abrams, "I don''t give a damn about the election"); [[w.berman-lyndon-johnsons-war]], 194–99 (Habib, Carver and DePuy; Habib: "Stop bombing and negotiate"; Goldberg: "who the hell are we fighting?"; Mar. 26, Bundy''s summary, Acheson: "we can no longer do the job we set out to do"; Ball, Vance, Dillon; Bradley, Taylor, Murphy, Fortas against); [[w.shesol-mutual-contempt]], 433 ("Your whole group must have been brainwashed"; Johnson: "This is caused by the 206,000-troop request, leaks ... and Bobby Kennedy"); [[w.kotz-judgment-days]], 398–99 ("We have no support for the war"); [[w.bernstein-guns-or-butter]], 481 (Habib: "Stop the bombing and negotiate"; Bundy: "a very significant shift"; Bradley for "support troops" only); [[w.drea-mcnamara-clifford-and-the-2011]], 189 (Clifford''s three options to the Wise Men at State; Johnson with them 10:30 a.m.–12:15 p.m., Mar. 26); [[w.taylor-swords-and-plowshares]], 390–91 (Carver, DePuy and Habib briefing; two sessions; the President''s poll); [[w.barrett-uncertain-warriors]], 147–48 (Wheeler and Abrams alone with Johnson on Mar. 26, almost two hours, before the Wise Men; Johnson: "We must have something"); [[w.zaroulis-who-spoke-up]], 159–60 (the week of March 25: the Wise Men briefed by Habib, DePuy and Carver, conferring with Rusk and Clifford; the next day their verdict, Bundy speaking for them; the bombing should be stopped, the war unwinnable); [[w.dallek-flawed-giant]], 512 (Mar. 26, Johnson with the Chiefs, by Clifford a "painfully sad speech": "We need more money in an election year, more taxes in an election year, more troops in an election year and more [budget] cuts in an election year. ... We have no support for the war"; not the causes Johnson names in H). [[w.longley-lbjs-1968]], 80–82 (Acheson''s terms; the briefings; the meeting with the President; "Who poisoned the well," by Clifford''s account); [[w.palermo-in-his-own-right]], 153 (H; the words as FRUS 1964–68, VI, doc. 156, prints them). [[w.ball-past-has-another-pattern]], 407–09 (the briefings; Bundy''s summary, Fortas and Murphy dissenting; Acheson, Dillon, Ridgway, Vance). Made public: FRUS 1964–68, VI (2002). [[w.cosmas-joint-chiefs-of-staff]], 169 (the briefings; the meeting; Acheson); [[w.drea-mcnamara-clifford-and-the-2011]], 189, 225 (the briefings of Mar. 25, DePuy''s among them; Johnson with Wheeler and Abrams; the majority for disengaging; some for stopping the bombing at once); [[w.dallek-flawed-giant]], 511–12 (the briefings; Johnson with the Chiefs; the majority for withdrawal, several against); [[w.herring-lbj-and-vietnam]], 162–63 (the Wise Men reconvened, most for moving toward extrication; Johnson with Wheeler and Abrams, Mar. 26). [FRUS 1964–68, VI, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v06/d155); [doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v06/d156); [doc. 157](https://history.state.gov/historicaldocuments/frus1964-68v06/d157); [doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v06/d158). Check: Taylor names Murphy, Fortas and himself as the three for the course of the strategy review, not Bradley ([[w.taylor-swords-and-plowshares]], 390). To check: [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]; [[w.hoopes-limits-of-intervention]]; [[w.brinkley-dean-acheson]]; President''s Daily Diary, March 26, 1968, pp. 4–8, LBJ (cited by [[w.branch-at-canaans-edge]], 727); [[w.langguth-our-vietnam]], 488–90 (cited by [[w.branch-at-canaans-edge]], 727); Rusk,As J Saw It, p. 478 (cited by [[w.branch-at-canaans-edge]], 728); FRUS, *Vol. 6* (n.d.), 474 (cited by [[w.branch-at-canaans-edge]], 728); FRUS, *Vol. 6* (n.d.), 476 (cited by [[w.branch-at-canaans-edge]], 728). See [[cal.1968-02-27.vietnam]]. Names: Rusk, Clifford, DePuy, Johnson, Wheeler, Abrams, Bundy, Acheson, Ball, Dean, Vance, Dillon, Bradley, Taylor, Murphy, Goldberg, Habib, Carver. Check: Ball (408) has Fortas and Murphy as the dissenters. Check: Clifford, 516, has Fortas with Bradley, Taylor and Murphy.'
