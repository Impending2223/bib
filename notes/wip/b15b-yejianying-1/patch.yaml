        c: 'Ye Jianying 叶剑英 meets the military delegation of the Communist Party of Venezuela 委内瑞拉共产党军事代表团 and tells them the short history and basic lessons of the Chinese revolution: of its lessons, for the Venezuelan comrades two in his own view, to seek truth from facts 实事求是 (start from the facts, from the peasants'' own demands, in organizing and arming them; policies neither too high nor too low, too early nor too late) and to be independent and self-reliant 独立自主 (internationalists, the Soviet Union and China having helped each other, but a party settles its own internal policies itself).'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 896–897. Made public: 2007. Names: Ye Jianying.'
