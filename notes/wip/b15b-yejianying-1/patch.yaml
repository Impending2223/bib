  - cite: {id: cal.1960-09-11.vietnam-diplomacy-2, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 882 (Sept. 11, 1960; Ye Jianying 叶剑英 at Hanoi with the delegation, its return the next day)'}
  - add:
      entry:
        id: cal.1960-09-11.china-leadership-9
        when: Sept. 11
        date: '1960-09-11'
        place: hanoi
        thread: china-leadership
        also: [vietnam-diplomacy]
        c: 'Hanoi 河内. Ye Jianying 叶剑英 to Hồ Chí Minh 胡志明, by letter: he has had the honor to come with the Party and government delegation for the DRV''s fifteenth National Day and the Third Congress of the Vietnam Workers'' Party 越南劳动党, and thanks the Party, the people and Hồ for the invitation; the delegation leaves the next day. With it four poems, "Miscellaneous verses on Vietnam" 《越南杂咏》: "Hanoi revisited" 《重游河内》 (back after forty-three years), "The fifteenth National Day of Vietnam" 《越南十五周年国庆》, "For President Hồ Chí Minh''s birthday" 《寿胡志明主席》 and "Ha Long Bay" 《游下龙湾》.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 882. Made public: 2007. Names: Ye Jianying, Hồ Chí Minh.'
        tags: ['polity:prc', 'polity:drv', 'name:ye-jianying', 'name:ho-chi-minh', 'vis:only:prc+drv']
  - cite: {id: cal.1960-09-14.china-leadership-9, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 882–883 (Sept. 14–Oct. 24, 1960; Ye Jianying 叶剑英 at the enlarged Military Commission 中央军委扩大会议 in Peking 北京, on the army''s political work in the new situation; its resolution on strengthening political and ideological work in the army 《关于加强军队政治思想工作的决议》)'}
