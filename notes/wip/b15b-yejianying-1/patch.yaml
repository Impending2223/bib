        date: '1961-05-31'
        place: wuxi
        thread: china-leadership
        c: 'Wuxi 无锡. Ye Jianying 叶剑英 at the Air Force''s 空军 training conference. He speaks: train frugally, "hard drill on the ground, fine flying in the air" 地面苦练，空中精飞; train in the hardest, most complex conditions; the key subjects drilled over and over; engineering and maintenance strengthened for flight safety, in men and in machines.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 889–890. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
