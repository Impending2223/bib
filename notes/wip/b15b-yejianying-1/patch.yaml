  - add:
      entry:
        id: cal.1960-06-14.china-leadership-10
        when: June 14
        date: '1960-06-14'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the specialist conference of the Academy of Military Science 军事科学院 assembling the drafts of the combined-arms combat regulations, the army-and-division and regiment-and-battalion parts 合成军队战斗条令军师和团营部分汇稿专业会议: on the situation; the guiding thought of the regulations (Chairman Mao''s thought the guide, the strategic line the ground, the army''s experience summed up, the fraternal countries'' learned from selectively, the enemy studied, the masses relied on, academic democracy); and the attitude and method of military research (truth sought from facts, close to the units and the masses).'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 879–880. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
