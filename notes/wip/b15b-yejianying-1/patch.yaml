        date: '1961-06-05'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 inspects the Military Academy 军事学院 and gives instructions on its teaching and other work: "learn one grade higher, learn one grade thoroughly" 学高一级，学透一级.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 890. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
