  - add:
      entry:
        id: cal.1964-05-18.china-leadership-13
        when: May 18
        date: '1964-05-18'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Ye Jianying 叶剑英 speaks to the Nanjing meeting on writing the science of campaigns 编写战役学南京会议 on why and how to write it: a big country, a long front, a war of many campaigns and several strategic stages, many arms; many campaign commanders needed, with common principles; the "treasure" of Chairman Mao and the old comrades to be dug out while they live; the "heads" and the "picked men" together.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 914–916. Made public: 2007. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc', 'name:mao-zedong']
  - add:
      entry:
        id: cal.1964-05-26.china-leadership-7
        when: May 26
        date: '1964-05-26'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, with Teng Haiqing 滕海清, deputy commander of the Peking Military Region 北京军区, sees the region''s picked units in night training 夜间训练, and meets their cadres. He speaks: the night and close combat of the army''s wars its tradition; whatever the enemy''s arms, the atom bomb or not, it will be met by night and close combat; bayonet, not fear of the bomb; picked men not for trophies or stage shows; spread and raise.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 916–917. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-time', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
