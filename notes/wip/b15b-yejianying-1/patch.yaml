        c: Ye Jianying 叶剑英 hears Ding Ganru 丁甘如 and Zheng Zhaodong 郑兆东 of the Academy of Military Science's 军事科学院 foreign armies department 外军部 and Wang Wei 王维 of its library 图书馆 on the materials on foreign armies, and gives his views on their sources, what to collect and how to treat it.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 879. Made public: 2007. Names: Ye Jianying.'
