        c: 'Xinyang 信阳, Henan 河南. The great competition 大比武 of teams of the Nanjing, Canton, Fuzhou and Wuhan Military Regions 南京、广州、福州、武汉军区 and an airborne army 空降某军, reviewing the spreading of Guo Xingfu''s 郭兴福 method: 44 tactical and 139 technical subjects shown. Ye Jianying 叶剑英 sees part of it and gives instructions.'
