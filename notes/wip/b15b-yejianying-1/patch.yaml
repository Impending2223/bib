        date: '1961-06-07'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Ye Jianying 叶剑英 at the Army''s 陆军 training conference. He speaks: drill the key points over and over, in complex and hard conditions, and frugally; all real skill is drilled; the Navy''s and the Air Force''s methods; for the Army, perhaps "drill hard in barracks, exercise finely in the field camp" 在营苦练，野营精演.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 890. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-06-12.china-leadership-11
        when: June 12
        date: '1961-06-12'
        place: peking
        thread: china-leadership
        c: Peking 北京. The enlarged meeting of the Military Commission 中央军委扩大会议 opens (to July 14); Ye Jianying 叶剑英 attends. Its vice-chairmen Lin Biao 林彪, He Long 贺龙 and Nie Rongzhen 聂荣臻 and its standing members Liu Bocheng 刘伯承, Luo Ronghuan 罗荣桓 and Xu Xiangqian 徐向前 preside in turn. On meeting a sudden emergency and on building the army; it draws up and approves the militia work regulations, the regulations on company management and education 《连队管理教育工作条例》 and the decision on stabilizing the cadre ranks 《稳定干部队伍的决定》. In the first half of July it reviews and revises the draft operational plan of Ye's group.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 883, 890–891. Made public: 2007. Names: Ye Jianying, Lin Biao, He Long, Nie Rongzhen, Liu Bocheng, Luo Ronghuan, Xu Xiangqian.'
        tags: ['polity:prc', 'name:ye-jianying', 'name:lin-biao', 'name:he-long', 'name:nie-rongzhen', 'name:liu-bocheng', 'name:luo-ronghuan', 'name:xu-xiangqian', 'vis:only:prc']
  - add:
