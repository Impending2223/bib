        time_band: morning
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: Ye Jianying 叶剑英 presides at meetings of the heads of the services and arms 各军兵种领导人会议, the mornings of Dec. 6 and 7, hearing each on its Cultural Revolution.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 952. The words: 上午 (952). The time is the first day''s. Made public: 2007. Names: Ye Jianying.'
