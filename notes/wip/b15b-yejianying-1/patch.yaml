        c: 'Ye Jianying 叶剑英 at the staff work conference of the Canton Military Region 广州军区参谋工作会议. He speaks, "Strengthen the headquarters, give full play to their role" 《加强司令部建设，充分发挥司令部的作用》: the headquarters the army''s leading organ and command center, its work harder in a combined army and combined war; staff officers to be built up in thought, in their trade (operations and tactics, staff skills, the arms and services and modern weapons, some natural science) and in style (active, planned, quick, exact, modest, responsible); the headquarters a proposing as well as an executing organ, the commanders to use and train it; readiness, training and research joined.'
