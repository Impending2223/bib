  - add:
      entry:
        id: cal.1966-12-08.china-leadership-5
        when: Dec. 8
        date: '1966-12-08'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks at the Military Commission''s forum of teachers'' and students'' representatives of thirteen army schools: against those who would criticize his and Chen Yi''s 陈毅 speeches at the "rallies of a hundred thousand", "they want great democracy? They are free to speak, so am I"; against rumors on the army''s leading organs: "the Military Commission and the General Political Department have no reactionary line"; no black line in the army.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 952. Made public: 2007. Names: Ye Jianying, Chen Yi.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'name:chen-yi', 'vis:only:prc']
  - cite: {id: cal.1966-12-31.china-leadership-8, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 952 (Dec. 31, 1966; on Mao''s instruction to "examine and close the case" 检讨一下，了此一案, Ye Jianying 叶剑英 forced to self-criticism before the army schools'' teachers'' and students'' representatives for the "errors" of his speeches at the two rallies of a hundred thousand)'}
  - add:
      entry:
        id: cal.1966-12.china-leadership-28
        when: Dec.
        date: 1966-12
        thread: china-leadership
        c: Ye Jianying 叶剑英 has his office's staff compile Marx's, Engels's, Lenin's and Stalin's sayings on cultural revolution and anarchism and the points of Lenin's *"Left-Wing" Communism, an Infantile Disorder* 《共产主义运动中的“左派”幼稚病》 for their study, against the wrong tendencies.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 952–953. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
