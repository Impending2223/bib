        thread: china-leadership
        c: 'Ye Jianying 叶剑英 instructs the whole army on field-camp training 野营训练 for its organs, from the Nanjing Military Region''s 南京军区 practice he saw the winter before: the organs of the province districts and above to go out in turn to remote villages as squads, platoons and companies, chiefly a political camp, to shed city habits and train for war.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 913–914. Made public: 2007. Names: Ye Jianying.'
