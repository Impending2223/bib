        c: 'Ye Jianying''s 叶剑英 article "The great strategic decisive battles" 《伟大的战略决战》 in *Hongqi* 红旗 no. 2: the victory of the three great campaigns 三大战役 of the civil war a victory of Mao Zedong''s 毛泽东 thought on the strategic decisive battle and of his strategic thought; his art of command under five heads (the moment and direction of the decisive battle seized; a different line for each of the three theaters; the ten military principles; three ways of disposing of the enemy''s troops; soldiers and people the root of victory); the people decide wars, men not things.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 884–885. Names: Ye Jianying, Mao Zedong.'
