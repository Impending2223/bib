  - cite: {id: cal.1961-12-31.vietnam-diplomacy, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 893 (Dec. 31, 1961; Ye Jianying 叶剑英 leads the Chinese military goodwill delegation 中国军事友好代表团 out of Hanoi 河内, back to Canton 广州)'}
