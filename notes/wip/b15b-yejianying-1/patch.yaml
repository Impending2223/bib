        thread: china-leadership
        c: 'Ye Jianying 叶剑英, at the second group of the Central Work Conference 中央工作会议: the Chairman says much has been exposed; if the meeting goes on the tone will rise and men be branded a black gang, anti-Party and anti-socialist, bad for the Party, the country and the world; the Chairman high in principle and in flexibility.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 947. Made public: 2007. Names: Ye Jianying.'
