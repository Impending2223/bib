        thread: china-leadership
        c: 'Peking 北京, the Great Hall of the People 人民大会堂. Ye Jianying 叶剑英 reports to the Peking Military Region''s 北京军区 four-level cadres'' meeting: Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平 had merit in the revolution''s history, not to be denied wholesale.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 949. Made public: 2007. Names: Ye Jianying, Liu Shaoqi, Deng Xiaoping.'
