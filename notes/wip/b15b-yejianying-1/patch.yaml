        c: 'Ye Jianying 叶剑英, at a second forum of the Academy of Military Science''s 军事科学院 war history department 战史部, goes on with writing the war history: the board to be the People''s Liberation Army War History Editorial Committee 中国人民解放军战史编审委员会, under a war history committee for the main lines; to be done fast, while the marshals Lin 林, Luo 罗, Liu 刘, Chen 陈 and Xu 徐 live and before what Mao holds is lost.'
