        when: Nov. 9
        date: '1963-11-09'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the General Staff''s 总参谋部 preparatory meeting on writing teaching materials on campaigns 编写战役教材准备会议, on four questions: Chairman Mao''s works and war under modern conditions (to solve the new problems of campaigns and tactics after nuclear weapons with what arms we have); the Higher Military Academy''s 高等军事学院 stress, the combined campaign, settled at the army level; theory, case study and exercises, the three links of teaching; a science of campaigns 战役学 written by the mass line, the whole army at it, the senior commanders taking part.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 905–907. Made public: 2007. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc', 'name:mao-zedong']
