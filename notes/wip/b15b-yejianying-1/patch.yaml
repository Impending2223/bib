        thread: china-leadership
        c: The Academy of Military Science 军事科学院. Ye Jianying 叶剑英, with Yan Kuiyao 阎揆要, Mo Yang 莫阳 (head of his office), Shi Xia 石侠 (his secretary) and Gao Rui 高锐 (head of the Academy's tactics department), arranges the coming specialist conference at Wuxi 无锡, Jiangsu 江苏, on writing the science of campaigns 战役学.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 913. Made public: 2007. Names: Ye Jianying.'
