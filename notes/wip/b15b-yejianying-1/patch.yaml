        when: Mar. 9
        date: '1964-03-09'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, with Yang Yong 杨勇, commander of the Peking Military Region 北京军区, sees the region''s picked units 尖子分队 show their skills (radio talk in code, single-soldier assault, taking prisoners), and meets them: drill and read Chairman Mao''s works daily, red and expert; the infantry to learn hand-to-hand fighting; code talk to be spread fast.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 913. Made public: 2007. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc', 'name:mao-zedong']
