        c: 'Ye Jianying 叶剑英 hears Ye Chuping 叶楚屏, head of the office of the Academy of Military Science 军事科学院, report on its work, and instructs: carry out the Center''s decision on better troops and simpler administration 精兵简政, and do the Academy''s work well.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 894. Made public: 2007. Names: Ye Jianying.'
