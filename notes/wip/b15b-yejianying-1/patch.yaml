  - add:
      entry:
        id: cal.1961-04-15.china-leadership-14
        when: Apr. 15
        date: '1961-04-15'
        place: canton
        thread: china-leadership
        c: 'Canton 广州. Ye Jianying 叶剑英 speaks at the closing of the first meeting of the Military Commission''s committee for accepting the regulations 军委条令验收委员会: the regulations embody "ourselves as the main thing" 以我为主 and Mao Zedong''s 毛泽东 military thought and sum up decades of fighting; the services and arms to match their own to the general combined-combat rules 合同战斗概则; a body of military scholars formed; up to the world''s level, ten relations solved in them (technique and politics, army and people, subjective and objective, preserving ourselves and destroying the enemy, attack and defense, part and whole, success and difficulty, Party committee and commander, political and military work, centralism and democracy).'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 887–888. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
