        date: 1962-06
        thread: china-leadership
        c: Ye Jianying 叶剑英 reports to the meeting of the research cadres of the Academy of Military Science 军事科学院, "Raise your head to look at the world, bury your head in military scholarship" 《抬头看世界，埋头钻学术》, calling on all its researchers to resolve to study military science and bring out more and better work.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 895. Made public: 2007. Names: Ye Jianying.'
