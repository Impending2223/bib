        thread: china-leadership
        c: 'Ye Jianying 叶剑英 to the Military Commission 军委, by report, on questions common to the training of the Army, Navy and Air Force: few subjects, done well, the key points drilled hard; a method for each service; to "move, hit and connect" 开得动、打得准、联得上 in technique, and in tactics to "combine, deploy and grip" 合得成、摆得开、捏得紧; the regulations kept; frugal training, old equipment for training rooms and grounds; Party committees in overall charge.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 891–892. Made public: 2007. Names: Ye Jianying.'
