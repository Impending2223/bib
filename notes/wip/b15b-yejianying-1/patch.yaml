  - cite: {id: cal.1966-11-13.china-leadership, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 948 (Nov. 13, 1966; Ye Jianying 叶剑英, with Zhou Enlai 周恩来, Tao Zhu 陶铸, Chen Yi 陈毅, He Long 贺龙, Xu Xiangqian 徐向前 and the heads of the general departments, services and arms, receives at the Workers'' Stadium 工人体育场 the hundred thousand of the army''s schools and cultural and sports units come to Peking)'}
  - add:
      entry:
        id: cal.1966-11-13.china-leadership-6
        when: Nov. 13
        date: '1966-11-13'
        time_range: ['1966-11-13T04:00Z', '1966-11-13T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Workers'' Stadium 工人体育场, Peking 北京. Ye Jianying 叶剑英, to the hundred thousand of the army''s schools and cultural and sports units, criticizes the movement''s wrong ways: truth one step too far becomes error (Lenin); some leaders, having owned their errors again and again, still beaten and struggled against, the Second Medical University 二医大 gone too far; let people err and correct themselves, as against the man in Lu Xun''s *True Story of Ah Q*; reading Mao''s books and obeying him more than seeing him; the *Quotations* not to be recited like scripture; a few have no class feeling, struggling a cadre fallen with a heart attack: he is angered; beware of men with ulterior motives.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 948–949. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'name:ye-jianying', 'name:mao-zedong']
  - add:
      entry:
        id: cal.1966-11-14.china-leadership-7
        when: Nov. 14
        date: '1966-11-14'
        time_range: ['1966-11-14T04:00Z', '1966-11-14T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: Ye Jianying 叶剑英, by telephone with Nie Rongzhen 聂荣臻, then touring Xinjiang 新疆, agrees with him that the movement in the Xinjiang Military Region 新疆军区 and the Production and Construction Corps 生产建设兵团, on the border, may be put off.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 949. The words: 下午 (949). Made public: 2007. Names: Ye Jianying, Nie Rongzhen.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'name:nie-rongzhen', 'vis:only:prc']
