  - cite: {id: cal.1966-10-18.china-leadership, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 946 (Oct. 18, 1966, midday to 3 p.m.; Ye Jianying 叶剑英 with Mao at the fifth reception, 1,500,000)'}
  - cite: {id: cal.1966-10-20.china-leadership-3, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 947 (Oct. 20, 1966, afternoon; Ye Jianying 叶剑英 with Nie Rongzhen 聂荣臻, Yang Chengwu 杨成武 and others at Zhou Enlai''s 周恩来 meeting hearing Zhang Zhenhuan 张震寰 on the last preparations of the launch and impact areas)'}
  - add:
      entry:
        id: cal.1966-10-21.china-leadership-7
        when: Oct. 21
        date: '1966-10-21'
        time_range: ['1966-10-20T22:00Z', '1966-10-21T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: Peking 北京. Over a hundred students of the Harbin Military Engineering Institute 哈尔滨军事工程学院 burst into the compound of the Ministry of Defense 国防部, then into the Defense Science and Technology Commission's 国防科委 offices, to seize the work teams' notebooks and the "black lists"; the leaders' pleas to leave go unheeded.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 947. The words: 上午 (947).'
        tags: ['polity:prc']
