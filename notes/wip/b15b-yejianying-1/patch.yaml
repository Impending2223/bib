  - add:
      entry:
        id: cal.1961-05-19.china-leadership-7
        when: May 19
        date: '1961-05-19'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Ye Jianying 叶剑英 at the Navy''s 海军 training conference. He speaks: four combinations for training, red, expert and fit 红、专、健; technical and tactical training ("move and hit", and "combine" 合得成); training and research; the academies and the units. The Navy to train frugally, ashore, in port and at sea: "drill often ashore, drill finely at sea."'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 888–889. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-31.china-leadership-7
        when: May 31
        date: '1961-05-31'
        place: wuxi
        thread: china-leadership
        c: 'Wuxi 无锡. Ye Jianying 叶剑英 at the Air Force''s 空军 training conference. He speaks: train frugally, "hard drill on the ground, fine flying in the air" 地面苦练，空中精飞; train in the hardest, most complex conditions; the key subjects drilled over and over; engineering and maintenance strengthened for flight safety, in men and in machines.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 889–890. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
