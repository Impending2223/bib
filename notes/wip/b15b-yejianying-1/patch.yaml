        id: cal.1961-02-10.china-leadership-16
        when: Feb. 10
        date: '1961-02-10'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the training conference of the Canton Military Region 广州军区训练会议, on four heads: the Party committee in overall charge, the commanders sharing the work, a lead with others in support (troops led well are united, disciplined, high in spirit and smart in bearing; trained well, "they move and they hit" 开得动，打得准; red first, expert and fit); the old cadres to pass on their experience; six contradictions in training (with political and cultural study, defense construction, help to the localities, supply, terms of service, the "lines" and the "blocks"); training for real war (by the unit''s battle plan, in hard and complex conditions, under atomic conditions).'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 885–887. Made public: 2007. Names: Ye Jianying.'
