        id: cal.1966-10-09.china-leadership-6
        when: Oct. 9
        date: '1966-10-09'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, at the second group of the Central Work Conference 中央工作会议: the Chairman means the movement to run to January, four months more; readiness for war is pressing, war may come about 1968; the Chairman cannot sleep till the third front 三线 is built; the Cultural Revolution the best mobilization for war, as the Japanese and Americans see; the young armed with Mao Zedong Thought.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 946. Made public: 2007. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc', 'name:mao-zedong']
