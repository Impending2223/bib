        date: '1964-01-19'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the Canton Military Region''s 广州军区 forum on studying and spreading Guo Xingfu''s 郭兴福 teaching method: a method guided by Mao Zedong Thought and carrying on the army''s tradition, the short cut to good training and the Military Commission''s strategic thought in practice, a matter of strategic weight; now to spread it from points to the whole, from the infantry to the other arms and services and the schools, and raise it, each arm adapting it creatively.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 911–912. Made public: 2007. Names: Ye Jianying.'
