  - add:
      entry:
        id: cal.1960-01-15.china-leadership-6
        when: Jan. 15
        date: '1960-01-15'
        place: wuhan
        thread: china-leadership
        c: 'Wuhan 武汉. Ye Jianying 叶剑英 speaks to the specialist conference reviewing the draft regulations 条令审稿专业会议: for the enemy a future war is a war of aggression under modern conditions, for us a people''s war under modern conditions 现代条件下的人民战争. Its likely features: a war of the whole people 全民战, a total war 总体战, a three-dimensional war 立体战, a combined war 合同战; opened as a rule by surprise attack; the battlefield changing swiftly. On the strategic line, finishing the combat regulations and a surge of research in military science.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 877–878. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-01-22.china-leadership-7
        when: Jan. 22–27
        date: '1960-01-22'
        place: canton
        thread: china-leadership
        c: 'Canton 广州. The enlarged meeting of the Military Commission 军委扩大会议; Ye Jianying 叶剑英 speaks on writing the army''s combat regulations 战斗条令 and on military-academic research: a standing task while the threat of war lasts; Party committees to put it in their plans, academic democracy, the masses drawn in. Military science 军事科学研究, by his account, falls into the theoretical sciences (military thought; military art: strategy, operations, tactics, organization, mobilization, military history and geography, training) and the technical sciences (weapons and equipment).'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 878–879. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
