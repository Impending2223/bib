  - cite: {id: cal.1966-11-29.china-leadership, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 950 (Nov. 29, 1966; Ye Jianying 叶剑英 with Zhou Enlai 周恩来 and Chen Yi 陈毅 at the Workers'' Stadium 工人体育场 rally of a hundred thousand of the army''s schools and cultural and sports units)'}
  - add:
      entry:
        id: cal.1966-11-29.china-leadership-5
        when: Nov. 29
        date: '1966-11-29'
        time_range: ['1966-11-29T04:00Z', '1966-11-29T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Workers'' Stadium 工人体育场, Peking 北京. Ye Jianying 叶剑英, to the hundred thousand of the army''s schools and cultural and sports units, again criticizes the movement''s wrong ways: the general departments'' wall posters not to be seen, touching the whole army and its secrets; trust the organs'' masses, do not meddle with the leading organs; the *Jiefangjun bao* 解放军报, which Chairman Mao praised, to be protected, not smashed; some ride the trains, want big houses and cars in Shanghai 上海; incited crowds rush at the Chairman''s offices; storming the Ministry of Defense 国防部 a grave error; "words are no crime"; he expects wall posters against him, and will speak.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 950–951. Names: Ye Jianying, Mao Zedong.'
        tags: ['polity:prc', 'name:ye-jianying', 'name:mao-zedong']
  - add:
      entry:
        id: cal.1966-11-29.china-leadership-6
        when: Nov. 29
        date: '1966-11-29'
        thread: china-leadership
        c: Ye Jianying 叶剑英 instructs the Military Museum's 军事博物馆 exhibition halls to keep the photographs of Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 951. Made public: 2007. Names: Ye Jianying, Liu Shaoqi, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'name:liu-shaoqi', 'name:deng-xiaoping', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-11-30.china-leadership-6
        when: Nov. 30
        date: '1966-11-30'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 presides at the Military Commission''s 军委 fifty-ninth standing meeting: Zhang Zhenhuan 张震寰 on the missile-nuclear test (the fourth nuclear test) and the tests to come, Tang Yanjie 唐延杰 on building a missile range at a base of the Defense Science and Technology Commission 国防科委; well pleased, it agrees to both. Some experts of the "two bombs" have had their homes raided, against the Party''s policy: apologies and amends to be made, and a forum of the experts held, to be received by Mao Zedong 毛泽东, Lin Biao 林彪 and Zhou Enlai 周恩来.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 951–952. Made public: 2007. Names: Ye Jianying, Mao Zedong, Lin Biao, Zhou Enlai.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc', 'name:mao-zedong', 'name:lin-biao', 'name:zhou-enlai']
  - cite: {id: cal.1966-12-04.china-leadership, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 952 (Dec. 4–6, 1966; Ye Jianying 叶剑英 at the enlarged Politburo Lin Biao 林彪 presides, hearing Gu Mu 谷牧 on the forum on the Cultural Revolution in industrial, mining and transport enterprises)'}
  - add:
