        when: May 19
        date: '1961-05-19'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Ye Jianying 叶剑英 at the Navy''s 海军 training conference. He speaks: four combinations for training, red, expert and fit 红、专、健; technical and tactical training ("move and hit", and "combine" 合得成); training and research; the academies and the units. The Navy to train frugally, ashore, in port and at sea: "drill often ashore, drill finely at sea."'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 888–889. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
