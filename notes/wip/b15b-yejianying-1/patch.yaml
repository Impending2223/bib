        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Ye Jianying 叶剑英 speaks at the Navy''s 海军 display of picked units: Guo Xingfu''s 郭兴福 method fits the Navy too, the more complex the technique the more; picked sailors, posts, departments and ships, the fleet a fist of five strong fingers; thought work the engine and the compass; Guo''s experience joined to their own, a new method, "a mule".'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 918–920. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'name:ye-jianying', 'vis:only:prc']
