        c: 'Ye Jianying 叶剑英 speaks to the General Staff''s 总参谋部 on-the-spot meeting on spreading Guo Xingfu''s 郭兴福 teaching method, "Learn Guo Xingfu''s teaching method, raise our army''s training to a new level" 《学习郭兴福教学法，把我军训练提高到新的水平》: its features in detail; the whole army to take Guo for its model, compare, learn, catch up and help, and shake off complacency.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 912. Made public: 2007. Names: Ye Jianying.'
