  - cite: {id: cal.1966-10-06.china-leadership-2, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 946 (Oct. 6, 1966; Ye Jianying 叶剑英 with Tao Zhu 陶铸, Chen Yi 陈毅 and Liao Chengzhi 廖承志 meeting the Hong Kong and Macao National Day visitors)'}
