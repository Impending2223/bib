        when: May 10
        date: '1962-05-10'
        thread: china-leadership
        c: 'The Academy of Military Science 军事科学院. Ye Jianying 叶剑英 receives the cadres from outside the Academy at the meeting reviewing the combat regulations for the army, division, regiment and battalion 军师、团营战斗条令审修会议, and, the military research bodies of the great military regions and the units having been abolished by Lin Biao 林彪, gives the talk "Make scientific research a necessity of the army''s cadres in work and in life" 《要使科学研究成为全军干部的工作必需和生活必需》: military science the study of war and of the laws of directing it, of joining men and weapons rightly; those moved to other posts by the abolition to keep up their research.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 894–895. Made public: 2007. Names: Ye Jianying, Lin Biao.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'name:lin-biao', 'vis:only:prc']
