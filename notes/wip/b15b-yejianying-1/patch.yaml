  - cite: {id: cal.1962-03-22.china-leadership-10, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 894 (Mar. 22, 1962; at the preparatory meeting of the Second National People''s Congress''s third session 第二届全国人大第三次会议 Ye Jianying 叶剑英 is elected to its presidium 主席团)'}
  - cite: {id: cal.1962-03-27.china-leadership, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 894 (Mar. 27–Apr. 16, 1962; Ye Jianying 叶剑英 attends the session)'}
