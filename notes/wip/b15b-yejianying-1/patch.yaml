        thread: china-leadership
        c: Ye Jianying 叶剑英 speaks at the Academy of Military Science's 军事科学院 mobilization meeting against bureaucratism 反对官僚主义动员大会 and calls on all its staff to join the movement.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 880. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
  - add:
