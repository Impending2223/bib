        when: May 28
        date: '1964-05-28'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, with Teng Haiqing 滕海清 and others, sees staff officers of the Peking Military Region 北京军区 plot maps, and talks with them: staff work more important than ever in modern war; the staff''s basic skills, "six abilities" 六会 (to draw, write, transmit, and to read maps, remember and calculate); some grasp of campaigns and tactics; red and expert.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 917–918. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
