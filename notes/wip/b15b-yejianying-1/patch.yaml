        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, with Nie Rongzhen 聂荣臻 and others, at the joint meeting of the Central Cultural Revolution Group 中央文革小组 and the army''s Cultural Revolution group 全军文革小组 on the students in the Ministry of Defense 国防部: Zhang Chunqiao 张春桥, Liu Zhijian 刘志坚 and others to tell them, by Mao''s order that the seats of the Center and the State Council be kept safe, that they must leave at once.'
