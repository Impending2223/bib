  - cite: {id: cal.1963-12-27.china-leadership-16, item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 909–910 (Dec. 24, 1963, the day of the Zhenjiang 镇江 display; Ye Jianying''s 叶剑英 report to the Military Commission 中央军委, "Proposing the Military Commission spread Guo Xingfu''s teaching method" 《建议军委推广郭兴福教学法》: the method carries on the army''s tradition; it rouses the men''s thought, joins technique, tactics, thought and style, goes from simple to complex, joins word and example, demands strictly; 400 cadres of ten military regions at Zhenjiang; a directive asked to spread it to the units, schools and militia. Mao Zedong 毛泽东, on reading it: Marshal Ye has found a good method)'}
