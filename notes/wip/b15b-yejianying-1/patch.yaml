        c: 'By the Military Commission''s 中央军委 decision, Ye Jianying 叶剑英 heads its committee for military training and academic research 军委军事训练和学术研究委员会, Su Yu 粟裕 and Zhang Zongxun 张宗逊 his deputies: one direction for the training, military research and acceptance of regulations of the whole army''s units and schools.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 892. Made public: 2007. Names: Ye Jianying.'
