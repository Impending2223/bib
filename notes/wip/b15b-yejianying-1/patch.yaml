        when: June 20
        date: '1960-06-20'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the fifth meeting of the preparatory committee for the Academy of Military Science''s 军事科学院 Military Technology Research Hall 军事技术研究馆 on its scale and stages: its students to be the army''s senior commanders, teachers and staff and the local Party leaders who are also the army''s and militia''s political commissars and run the war industry; exhibits of frontier and conventional arms, from technique and tactics to the operational art; a general hall for operations, branch halls by arm and service.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 880–881. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
