        when: Dec.
        date: 1966-12
        thread: china-leadership
        c: By the Military Commission's 军委 decision, to lighten his load, Ye Jianying 叶剑英 gives up the post of secretary of the Academy of Military Science's 军事科学院 Party committee; Su Yu 粟裕 its first secretary, Wang Shusheng 王树声 its second.
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 953. Made public: 2007. Names: Ye Jianying.'
        tags: ['polity:prc', 'ok:fields-place', 'name:ye-jianying', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966.china-leadership-94
        when: 1966, second half
        date: '1966'
        at: before 1966-07
        thread: china-leadership
        c: 'Ye Jianying 叶剑英, displeased with the "rebellion" and "dismissals" of the Cultural Revolution, writes the song lyric "For Comrade Chen Yi, to the tune Yumeiren" 《虞美人·赠陈毅同志》: when will the exchanges and bombardments end, how many officials dismissed; heart and soul for the public good.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 953. Made public: 2007. Names: Ye Jianying, Chen Yi.'
