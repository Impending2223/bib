        when: July 17
        date: '1964-07-17'
        place: mudanjiang
        thread: china-leadership
        c: 'Mudanjiang 牡丹江. Zhu De 朱德 speaks to a cadres'' meeting of the Mudanjiang city committee 中共牡丹江市委: some, after a few good years, forget that the Party came through hard struggle; we build socialism, not the capitalist way; before bourgeois corruption some have kept the revolutionary tradition and some have gone over; cadres in every post to watch for it; in the Party, mutual help, criticism and self-criticism, unity; if no one minds anyone, neither an office nor a factory can be run well.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1913–1914. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
