        c: 'Peking 北京. Zhu De 朱德 receives Lapin 拉宾, the Soviet Union''s new Ambassador. Of the Vietnamese war against America he says: whether it will touch off a third world war is a matter of judgment; their victory will strike the forces of American imperialist aggression and so put off a world war.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1932. Made public: 2016. Names: Zhu De, Lapin.'
        tags: ['polity:prc', 'polity:ussr', 'name:zhu-de', 'name:lapin-sergei-g', 'vis:only:prc+ussr@C-D']
