  - cite: {id: cal.1964-12-15.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1923–1924 (Dec. 15, 1964; Zhu De 朱德 at the Politburo meeting on the draft *Report on the Work of the Government* 《政府工作报告》 Zhou Enlai 周恩来 is to give at the Third NPC''s first session; Zhou explains it and reads the passage Mao Zedong 毛泽东 has added: human history a constant development from the realm of necessity to the realm of freedom, never to end; theories of standstill, pessimism, inaction and complacency all wrong)'}
