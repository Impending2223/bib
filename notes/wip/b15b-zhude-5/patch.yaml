        thread: china-leadership
        c: 'Zhu De 朱德 reaches Jiamusi 佳木斯. He inspects the Jiamusi paper mill 佳木斯造纸厂, the Jiamusi timber-processing works 佳木斯木材加工厂 and the Jiamusi particleboard works 佳木斯刨花板厂. He hears the heads of the Jiamusi city committee 中共佳木斯市委. At the paper mill he says: in a socialist enterprise good care of materials matters greatly; cut the use of raw materials by every means.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1914. Made public: 2016. Names: Zhu De.'
