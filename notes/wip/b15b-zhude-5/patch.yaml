  - add:
      entry:
        id: cal.1964-03-22.china-leadership-8
        when: Mar. 22
        date: '1964-03-22'
        thread: china-leadership
        c: 'Zhu De 朱德 cables the Center 中共中央 and Mao Zedong 毛泽东 on Guangxi 广西: last year''s drought was serious, grain some 1.2–1.3 billion jin 斤 below 1962, but cash crops up nearly everywhere; the region''s comrades, building on its nature, would grow grain and many lines together, subtropical cash crops above all, and hope that for the next two years the grain sent out of the region be cut or not raised; more timber, livestock and local goods could then go out, worth far more than grain, for export to buy grain; grain output so low that even the hundred-odd million jin sent out strains the whole region; in the hills, where carrying grain out is hard, some would rather give a pig than carry out a hundred jin; spare grain there better stored against famine, and for defense; their view worth weighing: in the long run less grain and more cash crops from such regions pays best.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1903–1904. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
