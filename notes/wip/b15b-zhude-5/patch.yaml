        c: 'Zhu De 朱德 meets and gives a banquet for Hugh Fernando 休·费尔南多, Speaker of Ceylon''s House of Representatives 锡兰众议院, and the parliamentary delegation he leads. At the banquet he says: both countries took part in the Bandung conference 万隆会议 and hold the Five Principles of Peaceful Coexistence 和平共处五项原则 and the ten principles of Bandung as the rule of their relations; Ceylon has always backed China''s lawful rights in the United Nations 联合国 and opposed the imperialists'' "two Chinas" 两个中国 plot, for which the Chinese people thank it; China backs Ceylon''s struggle against imperialism and colonialism, old and new, for its independence.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1917. Names: Zhu De.'
        tags: ['polity:prc', 'polity:ceylon', 'name:zhu-de']
