  - cite: {id: cal.1965-01-03.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1927 (Jan. 3, 1965, evening; Zhu De 朱德 at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议, where Mao Zedong 毛泽东, naming no one, criticizes Liu Shaoqi''s 刘少奇 way of leading the earlier "four clean-ups": the work teams relied on alone, ten thousand men massed in one county studying documents for months, the masses not relied on, mystery, "striking roots and linking up," the movement cold and cheerless, scholasticism and human-wave tactics; the documents to go straight to the masses)'}
  - cite: {id: cal.1965-01-04.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1927–1928 (Jan. 4, 1965; Zhu De 朱德 presides over the closing, at which the session adopts the reports and resolutions and names the sixteen Vice-Premiers and the thirteen vice-chairmen of the National Defense Council; with Mao Zedong 毛泽东, Liu Shaoqi 刘少奇 and others, he receives all the deputies)'}
  - cite: {id: cal.1965-01-09.china-leadership-3, item: '[[w.zhu-de-nianpu-xinbian]], III, 1928 (Jan. 9, 1965; Zhu De 朱德, Liu Shaoqi 刘少奇 and Zhou Enlai 周恩来 cable Norodom Sihanouk 诺罗敦·西哈努克, Norodom Montana 诺罗敦·蒙达那 and Norodom Kantol 诺罗敦·康托尔, thanking them and the Cambodian government for their efforts to save the nine Chinese trade staff and journalists the Brazilian authorities arrested in April 1964 and sentenced on Dec. 22, 1964)'}
  - cite: {id: cal.1965-01-14.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1928 (Jan. 14, 1965; Zhu De 朱德 attends the Central Work Conference 中央工作会议 on its minutes drawn up on Mao Zedong''s 毛泽东 views, *Some questions now arising in the rural socialist education movement* 《农村社会主义教育运动中目前提出的一些问题》, the "Twenty-three Articles" 二十三条; the Center sends them to the whole Party that day: serious, sharp class struggle in town and country; the movement''s point to rectify those in power in the Party taking the capitalist road; the movement henceforth called the "four clean-ups" 四清, in politics, economy, organization and thought)'}
  - cite: {id: cal.1965-01.china-leadership-7, item: '[[w.zhu-de-nianpu-xinbian]], III, 1928 (after the Central Work Conference, which closed Jan. 14, 1965; Liu Shaoqi 刘少奇, on his own, seeks Mao Zedong 毛泽东 out for a talk and makes a self-criticism)'}
