  - add:
      entry:
        id: cal.1964-03-01.china-leadership-12
        when: Mar. 1
        date: '1964-03-01'
        thread: china-leadership
        c: 'Zhu De 朱德 cables the Center 中共中央 and Mao Zedong 毛泽东: for two years Guangdong 广东省 has bought grain and the chief farm and sideline goods chiefly by requisition and assigned purchase, with exchange and negotiated purchase as a supplement; the quotas set in good time and then held, the increase bought by exchange and negotiation, no assigned quota added; good for state, collective and individual alike, the state getting the grain and goods it needs and the masses'' zeal kept up. Guangdong raises cassava silkworms 木薯蚕 on a large scale and makes rayon of cane bagasse, a new way to clothe the people; he proposes the provinces south of the Yangtze 江南 raise cassava silkworms wherever cassava grows, as a collective and a household sideline.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1901. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
