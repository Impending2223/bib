        c: 'Zhu De 朱德 reaches Yakeshi 牙克石, Inner Mongolia 内蒙古. He hears the heads of the Greater Xing''an Range Forestry Administration 大兴安岭林业管理局 on their work. Told of the great waste of forest resources, he says: do all things by the line of thrift and by the facts; rules that do not fit the facts must be changed; the state''s resources are not to be wasted and left so. The Ministry of Forestry''s 林业部 men here are to take the questions back to the departments concerned and find a remedy.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1916. Made public: 2016. Names: Zhu De.'
