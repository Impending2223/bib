        c: Peking 北京. Zhu De 朱德 presides over the 124th meeting of the Second NPC Standing Committee 第二届全国人大常委会. It hears Li Xiannian 李先念, for the State Council 国务院, on the final accounts for 1963 and the draft budget for 1964, reviews them and adopts resolutions on them; approves the apportioning of the Third NPC's 第三届全国人民代表大会 three hundred-odd deputies of the minority peoples; divides the Ministry of Education 教育部 into a Ministry of Higher Education 高等教育部 and a Ministry of Education; and approves the State Oceanographic Bureau 国家海洋局, the Bureau for Travel and Tourism 中国旅行游览事业管理局 and the State Council's Bureau of Scientific and Technical Cadres 国务院科学技术干部局 as organs directly under the State Council.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1914. Names: Zhu De, Li Xiannian.'
        tags: ['polity:prc', 'name:zhu-de', 'name:li-xiannian']
  - cite: {id: cal.1964-07-23.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1914–1915 (July 23, 1964; Zhu De 朱德, with Mao Zedong 毛泽东, Zhou Enlai 周恩来, Peng Zhen 彭真, Li Xiannian 李先念, Tan Zhenlin 谭震林, Lu Dingyi 陆定一, Chen Boda 陈伯达, Kang Sheng 康生 and others, receives the air force unit that shot down another U-2, the delegates to the enlarged Party committee meeting of the General Administration of Civil Aviation 中国民用航空总局, to the Party congress of the PLA''s unit 0906 and to the navy''s conference on political work in basic units, and the trainees of the All-China Federation of Trade Unions'' cadre school 中华全国总工会干部学校)'}
