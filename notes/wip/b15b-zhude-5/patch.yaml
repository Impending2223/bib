        date: '1964-12-27'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the Central Work Conference 中央工作会议 on the "four clean-ups" 四清 and "five-antis" 五反: a great revolution, to be waged in order, the Chairman''s thought put to work, every matter handled in the Chairman''s spirit of one dividing into two 一分为二, the basic-level organs of power too, some good, some bad; of those in power, the points'' findings show few good, but the good should be the many; set the organs of power right and the economy will come right. Some comrades, seeing so many problems, grow rash and would solve them by killing more; remolding is long; do not always reach for killing, set up no tribunals, try those to be tried by law; kill few, work with care, remold bad men as men into good ones.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1925. Made public: 2016. See [[cal.1964-12-27.china-leadership]]. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
