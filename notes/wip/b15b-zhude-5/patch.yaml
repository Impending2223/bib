  - add:
      entry:
        id: cal.1964-03-03.china-leadership-7
        when: Mar. 3
        date: '1964-03-03'
        place: canton
        thread: china-leadership
        c: 'Canton 广州. Zhu De 朱德 hears Lin Liming 林李明, a secretary of the Guangdong committee''s Secretariat 中共广东省委书记处, and says: let the production teams plant trees, with licences, the trees theirs; develop green tea, tung oil, pig bristles and the like, make more for export and win back the Hong Kong 香港 market; the private plots unchanged for thirty years; communism is long in coming; investment to be reckoned closely; use the land rationally, grow what pays best; keep to thrift.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1901–1902. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
