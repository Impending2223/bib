  - add:
      entry:
        id: cal.1964-02-25.china-leadership-13
        when: Feb. 25
        date: '1964-02-25'
        thread: china-leadership
        c: 'Zhu De 朱德 writes an inscription for the campaign to learn from Ouyang Hai 欧阳海: "Learn from Comrade Ouyang Hai''s lofty spirit of self-sacrifice; serve the people heart and soul." The nianpu''s note: Ouyang Hai, leader of the seventh squad of the third company of a unit of the PLA 中国人民解放军, died on Nov. 18, 1963, on duty at Hengyang 衡阳, Hunan 湖南省, pushing a startled horse off the track to save a passenger train.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1901. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de']
