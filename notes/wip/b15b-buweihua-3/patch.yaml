        c: The Sichuan committee's enlarged standing committee 中共四川省委常委扩大会 decides to criticize publicly by name nearly thirty people, among them Zhang Liqun 张黎群, deputy secretary of the Mianyang prefectural committee 绵阳地委 and formerly deputy director of the Southwest Bureau's general office; Li Yaqun 李亚群, deputy head of the committee's propaganda department and Party group secretary of the provincial federation of literary and art circles; Ma Shitu 马识途, deputy head of the Southwest Bureau's propaganda department; Sha Ting 沙汀, a leader of the federation; Li Banli 李半黎, editor-in-chief of the *Sichuan ribao* 四川日报; Cheng Zijian 程子健, head of the Southwest Bureau's united front department; and the writer Ge Bizhou 戈壁舟.
