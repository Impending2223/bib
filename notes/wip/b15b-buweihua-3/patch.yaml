        id: cal.1966-06-03.china-leadership-8
        when: June 3
        date: '1966-06-03'
        thread: china-leadership
        c: 'Zhou Enlai 周恩来, on the Capital Work Group''s plan for redeploying the capital''s guard units: agreed; carry it out at once, the deployment settled within four days, with a map of the battalions'' and companies'' stations and the mobile forces''; the other three matters agreed.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 116. Made public: 1999 ([[w.chongbi-fu-chongbi-huiyilu]]). To check: [[w.chongbi-fu-chongbi-huiyilu]], 178–180 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 116 n.48). See [[cal.1966-06.china-leadership-43]]. Names: Zhou Enlai.'
