  - add:
      entry:
        id: cal.1966-06.china-leadership-43
        when: June, by the 3rd
        date: 1966-06
        at: before 1966-06-03
        thread: china-leadership
        c: 'The Capital Work Group 首都工作组 submits its plan for redeploying the Peking Garrison''s 卫戍区 units: the units guarding key targets redeployed by June 10; the cadres of divisions and regiments and of the companies guarding key targets reassigned, step by step, by the end of June; the whole garrison adjusted by mid-June.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 115–116. Made public: 1999 ([[w.chongbi-fu-chongbi-huiyilu]]). To check: [[w.chongbi-fu-chongbi-huiyilu]], 178–180 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 116 n.48).'
