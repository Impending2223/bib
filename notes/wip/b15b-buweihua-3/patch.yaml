        c: 'The Capital Work Group 首都工作组, as its first task, makes Zhongnanhai 中南海 secure: Yang Shangkun 杨尚昆 had run its guard for over twenty years; the work takes two months. By Zhou Enlai''s 周恩来 account of Jan. 21, 1967.'
