      item: '[[w.pu-weihua-zalan-jiu-shijie]], 123–124 (Aug. 25: Mao receives a Tanzanian military delegation; Pan Zhenwu, head of the Defense Ministry''s foreign affairs bureau, to introduce it, is kept away on Yang Chengwu''s view after some of the bureau objected)'
