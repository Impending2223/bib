  - cite:
      id: cal.1966-06-03.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 115 (June 3, the Jingxi Hotel 京西賓館: the Capital Work Group and the Peking Military Region convene the garrison''s cadres of battalion level and above, with the premier, vice-premiers, vice-chairmen of the Military Commission and the heads of the general departments, services and academies; Zhou presides; the Military Commission''s order enlarging the garrison announced; Ye Jianying: three divisions and a regiment; Yang Chengwu: the garrison''s tasks as the premier, the Capital Work Group and Marshal Ye direct)'
  - cite:
      id: cal.1966-06.china-leadership-10
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 115 (the 24th Army''s 70th mechanized division made the Guard Third Division, the 63rd Army''s 189th the Guard Fourth; the garrison four divisions and a regiment, six regiments to a division, an independent regiment, a band and a cadres'' battalion, of army rank; later, on Ye Jianying''s instruction, the 112th Division at Gaobeidian, the 196th at Tianjin and the 193rd at Xuanhua at its call when needed)'
