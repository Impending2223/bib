  - cite:
      id: cal.1966-05-25.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 125–126 (May 25, 2 p.m., on the east wall of the big dining hall: the poster "What are Song Shuo, Lu Ping and Peng Peiyun doing in the Cultural Revolution?", signed by Nie Yuanzi and six others of the philosophy department; Nie of the university''s Party committee and secretary of the department''s general branch, Zhao Zhengyi its deputy secretary, the five others Party members and teachers, Yang Keming lately moved to the Academy of Sciences'' institute of electrical engineering; at odds with the university''s committee since the late Socialist Education movement)'
  - cite:
      id: cal.1964-11-11.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 126 (the Socialist Education pilot at Peking University from summer 1964 to early 1966; the work team under Zhang Panshi, deputy head of the Propaganda Department, rejects the university committee''s work as bourgeois, finds its cadres impure and sets out to seize power; Lu Ping criticized, Nie Yuanzi leading)'
  - cite:
      id: cal.1965-01-23.china-leadership-12
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 126 (January 1965: Peng Zhen at the Peking committee''s meeting criticizes the Peking University Socialist Education movement; the city committee then helps Lu Ping overturn the work team''s verdicts)'
  - cite:
      id: cal.1965-03-03.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 126 (March 1965: Deng Xiaoping at the Secretariat also criticizes the movement at Peking University; the Secretariat removes Zhang Panshi as head of the work team and reorganizes its leadership under Xu Liqun, deputy head of the Propaganda Department)'
  - cite:
      id: cal.1965-03.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 126 (the Peking committee''s meeting of the university''s cadres and activists, about half a year long, "the International Hotel meeting": many activists who followed the work team criticized)'
