  - cite:
      id: cal.1967-01-21.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 113–114 (by Bu''s notes, Zhou''s talk of Jan. 21, 1967 with the delegates of the Academy''s units in Peking: Lin Biao proposed a Peking work group on the Chairman''s instruction; the guard of Zhongnanhai, run by Yang Shangkun for over twenty years, settled first, in two months; the Chairman did not come back in the first half of 1966 because the capital was unsafe)'
