      item: '[[w.pu-weihua-zalan-jiu-shijie]], 124 (the foreign affairs bureau''s poster "Great good news" 〈特大喜訊〉, naming Yang Chengwu and the deputy chief of staff for foreign affairs; then Liu Qingming 劉清明, commandant of the Surveying and Mapping Academy, and others; He Long''s office staff, "Bombard the General Staff office''s Party committee"; the operations department, "Bombard Yang Chengwu," Wang Shangrong and Lei Yingfu signing first)'
  - add:
      entry:
        id: cal.1966-08-25.china-leadership-16
        when: Aug. 25, afternoon
        date: '1966-08-25'
        place: peking
        thread: china-leadership
        c: 'Some of the General Staff''s 总参谋部 foreign affairs bureau 外事局 march to the General Staff Party committee''s meeting, question Yang Chengwu 杨成武 and protest to the committee: Chairman Mao 毛主席 himself backed the bureau''s demand that Pan Zhenwu 潘振武 not attend the reception; Yang cannot escape the guilt of suppressing the masses.'
