        when: 1966, at the start of the movement in the Artillery's organs
        date: '1966'
        at: before 1966-07
        thread: china-leadership
        c: 'Chen Renqi 陈仁麒, political commissar of the Artillery 炮兵, to save himself, backs posters by some of its organs against the commander Wu Kehua 吴克华, the deputy commander Su Jin 苏进, the chief of staff Liao Dingxiang 廖鼎祥 and the deputy political commissar Ouyang Yi 欧阳毅: Wu "doing counter-revolution," Su "an old three-anti element," Ouyang close to the anti-Party Luo Ruiqing 罗瑞卿 and once of Zhang Guotao''s 张国焘 line.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 125. Made public: 1998 ([[w.ouyang-yi-huiyilu]], which names no one, only "a certain leader"). To check: [[w.ouyang-yi-huiyilu]], 361–362 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 125 n.66). Names: Luo Ruiqing.'
