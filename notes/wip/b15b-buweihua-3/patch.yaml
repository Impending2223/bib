  - cite:
      id: cal.1966-05-18.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 113 (mid-May 1966, during the enlarged Politburo meeting, Mao raises the strengthening of the capital''s guard; he dares not lightly come back to Peking)'
  - cite:
      id: cal.1966-05-15.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 113–114 (May 15, on Mao''s instruction: the Capital Work Group, Ye Jianying (vice-chairman and secretary-general of the Military Commission) head, Yang Chengwu (acting chief of staff) and Xie Fuzhi (vice-premier, minister of public security) deputies, with Liu Zhijian, Li Xuefeng, Wang Dongxing, Zhou Rongxin, Zheng Weishan, Fu Chongbi, Wan Li and Su Qianyi, answering directly to the Standing Committee)'
  - cite:
      id: cal.1966-05-15.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 114 (the office of the Capital Work Group under Wang Shangrong, head of the General Staff''s operations department, with Lei Yingfu, Shi Jinqian and Yu Sang his deputies)'
  - cite:
      id: cal.1966-05-18.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 114 (May 18: Zhou''s consultation with Yang Chengwu and the Peking Military Region and his written report; the 189th and 193rd divisions, Fu Chongbi commander; Mao, "do as proposed"; the *Zhou Enlai nianpu*, III, 31–32, by its note; the 193rd never came, the 24th Army''s 70th mechanized division instead)'
  - check:
      id: cal.1966-05-18.china-leadership-3
      text: 'Check: made public by the 1997 *Zhou Enlai nianpu* ([[w.zhou-enlai-nianpu-1949]]), III, 31–32, prints it (cited by [[w.pu-weihua-zalan-jiu-shijie]], 114 n.46).'
  - to-check:
