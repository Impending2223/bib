  - cite:
      id: cal.1966-05-26.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 114–115 (May 26: Ye Jianying presides, Zhou attends; Zhou names Fu Chongbi commander of the Peking Garrison; firm and steady, not hurried; the counter-revolutionaries few, the army reliable; Deng Xiaoping to be told of urgent troop moves when Zhou is away)'
  - cite:
      id: cal.1966-05-31.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 115 (May 31)'
