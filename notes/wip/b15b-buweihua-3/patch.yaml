        date: '1966-05-05'
        thread: china-leadership
        c: Zhang Enci 张恩慈, formerly a philosophy teacher at Peking University and a leftist of the Socialist Education movement's first phase, moved early in 1966 to the Central Party School 中共中央高级党校 and then to the Institute of Marxism-Leninism, writes "My views on the Four Cleanups movement at Peking University" 〈我对北京大学"四清"运动的意见〉, sharply criticizing the work team, the university's Party committee and the Peking committee's leadership of the movement and the university's carrying out of the Party's education policy.
