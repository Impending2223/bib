        thread: china-leadership
        c: 'Peking University 北京大学. The day Nie Yuanzi''s 聂元梓 poster goes up, over a thousand posters follow it on the campus, at first mostly for her, then mostly against; the two sides face each other, with pushing and shoving where hers was posted and the cry: "classmates, the class struggle is complex; do not be fooled; do not take the road of the rightists of 1957 against the Party!"'
