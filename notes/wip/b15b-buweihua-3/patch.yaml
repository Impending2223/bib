        when: May 17, late at night
        date: '1966-05-17'
        thread: china-leadership
        c: 'Deng Tuo 邓拓 writes to Peng Zhen 彭真 and Liu Ren 刘仁: he bears no grudge against his critics; he analyzes the background and faults of his *Yanshan yehua* 《燕山夜话》 and *Sanjiacun zhaji* 《三家村札记》, denies being anti-Party, anti-socialist or anti-Mao Zedong Thought, asks that the 171 pieces be examined, and that the published records of his talks be checked against what he said; as a Communist he should have stood the test, but his old illnesses have returned; long live the Party and Chairman Mao 毛主席.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 109–110. Made public: 2008. Names: Peng Zhen, Mao Zedong.'
