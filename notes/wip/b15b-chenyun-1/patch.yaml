  - cite: {id: cal.1960-12-29.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 61 (Chen Yun at the enlarged Standing Committee on international questions and the work conference)'}
  - cite: {id: cal.1960-12-30.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 61–62 (afternoon: Chen Yun at Mao''s meeting in Zhongnanhai hearing the Northeast and North China groups; on Mao''s word to live the rich days as poor ones, Chen Yun: next year no better than this; three things: be ready in mind and work; men and beasts to rest this winter for the spring ploughing; import as much grain as can be had, "eating first, construction second"; Mao sums up: eating first, the market second, construction third)'}
  - cite: {id: cal.1960-12-30.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 62 (Chen Yun with Zhu De and others at the airport to see Zhou Enlai''s friendship delegation off to Burma; there with Zhou and Ye Jizhuang settles the grain to be imported at 1.5 million tons)'}
  - cite: {id: cal.1960-12-31.china-leadership-7, item: '[[w.chen-yun-nianpu-xiuding]], III, 62 (after talking again with Ye Jizhuang, Chen Yun proposes through the Ministry of Foreign Trade to Zhou, already on his way to Burma, 2.5 million tons of rice; Zhou telephones his consent; the nianpu gives no day for either)'}
  - cite: {id: cal.1960-12-31.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 62 (the letter answers Deng''s question on next year''s poultry and egg exports: about 30 million dollars, all to Hong Kong; if not bought by quota but traded on the free market, the state can buy part at free-market prices and Hong Kong''s supply will not stop; the free market spurs output; collected in 《陈云文集》)'}
  - add:
      entry:
        id: cal.1960-12.china-leadership-32
        when: Dec.
        date: 1960-12
        thread: china-leadership
        c: 'Chen Yun 陈云, two weeks running, meets seven or eight experts of the farm, trade and policy-research departments on raising pigs in the villages: the piglet''s growth from birth to fattening, the feed, fuel and work time and the returns of state, collective and household raising compared: pigs to be "chiefly private, public as an aid" 私养为主、公养为辅, against the Center''s earlier "chiefly public" and the "public and private together" of the State Council Finance and Trade Office''s 国务院财贸办公室 report the Center forwarded on Nov. 15.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 62. See [[cal.1960-12-24.china-leadership]], where the work conference adopts it on Dec. 24. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11-15.china-leadership-15
        when: Nov. 15
        date: '1960-11-15'
        thread: china-leadership
        c: The Center 中共中央 approves and forwards the State Council Finance and Trade Office's 国务院财贸办公室 "Report on the production of non-staple foods in the big and middle cities and views for the future" 《关于大中城市副食品生产情况和今后意见的报告》, which changes the pig policy from "chiefly public, private as an aid" to "public and private together" 公养私养并举.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 62. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - variant: {id: cal.1960-06-27.china-leadership-2, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'at night (夜), with Liu Shaoqi, Zhou Enlai, Ke Qingshi and Lu Dingyi, to Mao''s to talk', at: 'III, 39'}
  - cite: {id: cal.1961-01-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 63 (Chen Yun receives the draft as Mao has it circulated; the report calls the Xinyang affair a counter-revolutionary restoration, the enemy''s class revenge, and asks for rectification like land reform; the nianpu''s note: it blamed the fall in grain and the mass deaths on bad men in power and the landlords, confusing contradictions among the people with those between enemy and people, and the Center''s endorsement fed the left error in the rectification)'}
