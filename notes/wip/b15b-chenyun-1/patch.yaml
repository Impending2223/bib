        date: '1960-09-30'
        thread: china-leadership
        c: The Center 中共中央 approves and forwards the State Planning Commission's 国家计委 report on the 1961 control figures, the first to state the policy of "adjust, consolidate, fill out, raise" 调整、巩固、充实、提高.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 42. See [[cal.1960-08-30.china-leadership-3]]. Made public: 2015.'
