  - cite: {id: cal.1960-12-24.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 60–61 (Chen Yun at the Central Work Conference, Dec. 24–Jan. 13; he speaks on the ways through the difficulties from his three months'' inquiry; a billion yuan for higher grain purchase prices, oil-seed, pig, poultry and egg prices raised, 2.5 billion yuan for compensation, private plots from 5 to 7 percent of the land, rural fairs freed; Mao: socialist construction not to be rushed, half a century; 1961 a year of seeking truth from facts; Dec. 24, pigs "raised publicly and privately, chiefly privately")'}
