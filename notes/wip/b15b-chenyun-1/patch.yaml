        date: '1960-01-20'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 talks with storytellers of the Shanghai Pingtan Troupe 上海市评弹团 on their revision of the long piece *Shuang zhu feng* 《双珠凤》: the changes to fit the history of the time.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 30. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
