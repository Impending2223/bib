  - add:
      entry:
        id: cal.1961-01-05.china-leadership-19
        when: Jan. 5
        date: '1961-01-05'
        time_range: ['1961-01-04T22:00Z', '1961-01-05T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Chen Yun 陈云 speaks to the meeting of the regional bureaus'' heads of agriculture and forestry offices 各中共中央局的农林办公室主任会议: a real turn in farming will take about four years; water, fertilizer and machines the main points of the Eight-Character Charter 八字宪法; the water works not useless; the big fertilizer works first, the small not yet mastered; three conditions for this year: be prepared (melons and vegetables, low rations), rest as well as work, "so that fewer die", and import some grain without fanfare; less land, the strong men sent off, the animals worn out, and 25 million more townspeople to feed; if nature cost 60 to 70 billion jin last year and men 50 to 60 billion, the 120 billion cannot come back in a year; more of the state''s goods to agriculture, exports down, steel cut; "eating first, construction second", which Mao and the Center approved; meetings by region to follow under the Rural Work Department 中央农村工作部, with An Ziwen 安子文 and the planning and economic commissions.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 63–65. The words: 上午 (63–65). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-01-07.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 65 (Chen Yun attends the Secretariat on the 1961 plan)'}
  - add:
      entry:
        id: cal.1961-01-08.china-leadership-8
        when: Jan. 8
        date: '1961-01-08'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Li Fuchun 李富春: the meeting of the day before decided to cut capital construction, but the investment in viscose fiber and polyvinyl chloride should not be cut, since cotton and leather will not grow much for years, and people cannot go on with a few feet of cloth and no rubber shoes.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 65. Made public: 2015. Names: Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-01-09.china-leadership-13
        when: Jan. 9
        date: '1961-01-09'
        thread: china-leadership
        c: 'Chen Yun 陈云 directs the drafting of the Grain Price Small Group''s 中共中央粮价问题小组 report to Mao and the Center: grain purchase prices to rise 20 percent on average from this year (a billion yuan more for the peasants), of the 2.5 billion yuan of compensation only 1.5 billion paid in cash this year and a billion in People''s Bank promissory notes next year; with other farm prices up 25 percent on 26 to 30 billion yuan of sales, the peasants to gain 6.5 to 7 billion; oil, meat, poultry and eggs this year, cotton, tobacco, hemp, tea, sugar, timber and bamboo next; grain sale prices and wages unchanged for a year or two, the sale price in town below the purchase price in the country; state accumulation down over a billion this year, two billion next; townspeople to pay about 2 billion yuan more (6.5 percent of their purchasing power); of 9.5 billion yuan of currency out, institutions hold about 4 billion, townspeople 2.8 billion (21 yuan a head), peasants 2.7 billion (5 yuan a head); a gap of about 3 billion between purchasing power and goods, to be met with 1.5 billion more goods (150,000 tons more of rolled steel and 10 million dollars of light-industry materials).'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 65–67. See [[cal.1960-10.china-leadership-3]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-01-09.china-leadership-9, item: '[[w.chen-yun-nianpu-xiuding]], III, 67 (Chen Yun attends the Secretariat on the work conference''s documents)'}
  - cite: {id: cal.1961-01-09.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 67 (Chen Yun at Mao''s meeting of the Standing Committee and the regional secretaries on the draft "Three Main Rules of Discipline and Eight Points for Attention" for Party and government cadres and the Ninth Plenum)'}
