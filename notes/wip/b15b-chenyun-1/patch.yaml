  - cite: {id: cal.1961-05-15.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 86 (5 p.m.: Chen Yun at the enlarged Standing Committee on the villages and foreign affairs)'}
  - add:
      entry:
        id: cal.1961-05-16.china-leadership-12
        when: May 16
        date: '1961-05-16'
        thread: china-leadership
        c: 'Chen Yun 陈云 drafts the Center''s Fertilizer Small Group''s 中央化肥小组 report to the Center 中共中央 on the Hangzhou 杭州 forum: of the small works begun in 1959, by the end of 1960 over twenty of 800 tons a year working, five of them steadily, and seven of 2,000 tons, three steadily: not technically proven; the six big works of 25,000 or 50,000 tons running normally, their plant all but proven at home, three sets to be made by the year''s end; ammonium nitrate the main product for two or three years; four or five works of 50,000 tons a year finished in each of 1962–64, 200,000 to 250,000 tons of new capacity a year from 1963, not at other sectors'' cost, first in the cash-crop and high-yield grain areas; 10,000 tons of key metals a works to be imported, 3.2 million dollars, the price of 45,000 tons of grain, against 500,000 to 600,000 tons more grain a year from the fertilizer; plant made at fixed works and supplied in full sets, coal washing, coking, power and transport included; about 30,000 tons of metals a works, over 20,000 of them from home. It goes on the 17th to Mao Zedong 毛泽东, Zhu De 朱德 and Deng Xiaoping 邓小平.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 86–88. See [[cal.1961-04-04.china-leadership-11]]. Made public: 1986 ([[w.chen-yun-wenxuan-1956]], where the nianpu says the report is collected). To check: [[w.chen-yun-wenxuan-1956]]. Names: Chen Yun, Mao Zedong, Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:mao-zedong', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-08-11.china-leadership-7
        when: Aug. 11
        date: '1961-08-11'
        thread: china-leadership
        c: The Center 中共中央 approves and issues the Fertilizer Small Group's 中央化肥小组 report on speeding the nitrogen-fertilizer industry.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 88. See [[cal.1961-05-16.china-leadership-12]]. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-05-21.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 88 (Chen Yun at the Central Work Conference in Peking, May 21–June 12; the revised Sixty Articles, rules on commerce and handicrafts, the nine measures to cut the towns'' population and grain sales; 20 million fewer townspeople in three years, 10 million this year; steel for the year cut from 20 to 11 million tons; Mao''s self-criticism and the rehabilitation of those wrongly criticized after Lushan; afterwards the mess halls left to the members and rations to households)'}
  - add:
