  - cite: {id: cal.1960-09-07.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 42 (the directive: over 900 million mu struck by disaster in 1960; summer wheat procurement 5.1 billion jin below last year''s; edema, unnatural deaths and flight continuing; stocks 10 billion jin below last year''s; rural rations 360 jin of unhusked grain a head a year south of the Huai, about 300 north of it; town rations cut about 2 jin a month)'}
