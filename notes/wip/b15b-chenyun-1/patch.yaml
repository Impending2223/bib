        c: 'Chen Yun 陈云 talks with the heads of the Propaganda Department''s arts division 中共中央宣传部文艺处 on quyi 曲艺: the audience comes first for entertainment, and the teaching must come through art; ninety percent of the jokes in an old piece he studied can be kept; older storytellers need not be held to the same demands as the young.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 73–74. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
