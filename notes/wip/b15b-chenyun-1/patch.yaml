  - cite: {id: cal.1960-06-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 38 (the "Ten-Year Summary": the Peking meeting of January 1959, called to cut the steel target again, left Mao and Chen Yun uneasy; 30 million tons at Beidaihe in August 1958, 20 million at Wuchang in December, 16.5 million at Shanghai in April 1959, 13 million at Peking in May)'}
