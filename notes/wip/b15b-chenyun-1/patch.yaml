  - add:
      entry:
        id: cal.1960-11.china-leadership-26
        when: Nov., at Shanghai, after the 14th
        date: 1960-11
        at: after 1960-11-14
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 inspects the synthetic-ammonia plant of 2,000 and of 800 tons a year that the Shanghai Agricultural Research Institute 上海农业研究所 and the Chemical Research Institute 化工研究院 have built, and tells them: find why the plant stops and treat the cause; design to China''s conditions, since a delicate plant, like Lin Daiyu 林黛玉 or Jia Baoyu 贾宝玉, is no use in the village; a year''s trial before the design is fixed; the Ministry of the Chemical Industry 化工部 to set a group of three on the 2,000-ton works, as on the 800, and send him its daily report; 7.5 million tons of synthetic ammonia in five years, at four jin of grain for each jin of fertilizer, would give 240 billion jin more grain, "and then I can lie down and sleep well."'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 53. The nianpu: at Shanghai from Nov. 14 to 20. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc@B-F']
  - add:
      entry:
        id: cal.1960-11-15.china-leadership-13
        when: Nov. 15
        date: '1960-11-15'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云, by letter to Zhou Enlai 周恩来 on Jiangsu''s 江苏 harvest and rations, proposes three aids to its farming: 200,000 cubic meters of timber outside the plan, with about 1,200 tons of tung oil and about 1,000 tons of hemp, to mend boats, windmills and carts; 1,000 tractors, worth 100 to 200 million jin of grain in the Xuzhou–Huai 徐淮 area alone; 12,000 kilowatts of generators next year for Zhenjiang 镇江 prefecture.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 53–54. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
