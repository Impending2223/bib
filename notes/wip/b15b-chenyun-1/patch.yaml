        n: '[[w.chen-yun-nianpu-xiuding]], III, 71. Made public: 2015. Names: Chen Yun, Li Xiannian.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'vis:only:prc']
