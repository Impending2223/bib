  - add:
      entry:
        id: cal.1961-02-11.china-leadership-11
        when: Feb. 11
        date: '1961-02-11'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Zhou Enlai 周恩来: Hebei 河北, its peasants weakening and the spring ploughing near, has raised rations from five to six liang a day and asks that the 370 million jin of grain allotted it be sent as planned; the Ministry of Food 粮食部 means to send 300 million jin in February, March and April, which satisfies Hebei; the province and city work hard at Tianjin''s 天津 Xingang 新港 so that imported grain can be unloaded at once.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 73. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-02-12.china-leadership-9
        when: Feb. 12
        date: '1961-02-12'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Ke Qingshi 柯庆施, copy to Cao Diqiu 曹荻秋, answers their questions on Shanghai''s 上海 grain and foreign exchange (whether the Ministry of Food objects to Anhui''s 安徽 sending Shanghai four million jin of flour beyond its quota; whether the Ministry of Foreign Trade will take the foreign-ship service company''s foreign exchange, the nianpu''s note): such matters are handled at the bureau level, so ministers often do not know of them, a great fault; they may raise any further problem with him.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 73. Made public: 2015. Names: Chen Yun, Ke Qingshi.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:ke-qingshi', 'vis:only:prc']
