  - add:
      entry:
        id: cal.1961-03-04.china-leadership-9
        when: Mar. 4
        date: '1961-03-04'
        thread: china-leadership
        c: 'Chen Yun 陈云 hears the heads of the Ministry of the Chemical Industry 化工部 on fertilizer: of the big, middle and small synthetic-ammonia works (25,000–50,000 tons, 10,000 tons and 800–2,000 tons a year, the nianpu''s note), the small have failed and the middle are not proven; the big, copied from abroad, are proven and need only more plant and materials, which can be imported: "build big"; the middle works to be argued further, with "opponents" from outside the ministry heard; to hear no contrary view is sure to fail; technical innovation good, but much of it unripe.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 77. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-03-06.china-leadership-10
        when: Mar. 6–8
        date: '1961-03-06'
        thread: china-leadership
        c: 'Chen Yun 陈云 goes on hearing the heads of the Ministry of the Chemical Industry 化工部 on basic and organic chemicals, rubber, medicine and the defense frontier industries: calcium-magnesium phosphate costs high because the works are small and scattered; reform to be tried before it is spread, "crossing the river by feeling the stones"; Hou Debang''s 侯德榜 combined soda process, in the textbooks twenty years, took six or seven years from a 3,000-ton trial to an 80,000-ton works; hear both sides, not "left" or right; ten big ammonia works of 25,000 tons a year, or five of 50,000, which he prefers.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 77–78. See [[cal.1961-03-04.china-leadership-9]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-03-06.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 78 (evening: Chen Yun at the Standing Committee hearing Zhou Enlai, Deng Xiaoping and Peng Zhen on their report to Mao at Canton)'}
