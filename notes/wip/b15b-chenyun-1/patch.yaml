        c: 'Shanghai 上海. Chen Yun 陈云 talks with Li Qingfu 李庆福 and He Zhanchun 何占春, heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团 and of the opera group of the Shanghai People''s Radio 上海人民广播电台: new pieces to be written and adapted chiefly by the young and middle-aged storytellers; the experienced old ones to teach at the school or put the old pieces in order, with sofas and strong tea and time to talk; each to his strength.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 54. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
