  - cite: {id: cal.1961-02-22.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 75 (evening: Chen Yun at the Standing Committee Liu Shaoqi chairs, hearing the Planning Commission''s Party group on the 1961 capital construction plan; he says the factories have 20 percent more workers than they need, and five million sent home would add much farm labor; purchasing power exceeds goods by 10 billion yuan: more goods, less spending, more high-priced sweets, high-priced restaurants and yarn, price rises kept narrow so as not to hurt bank savings; townspeople hold 2.5 billion yuan in savings, commune members 1.5 billion, the rest in their pockets; goods to the villages before the towns, to buy farm produce)'}
  - add:
      entry:
        id: cal.1961-02-23.china-leadership-8
        when: Feb. 23
        date: '1961-02-23'
        thread: china-leadership
        c: 'Chen Yun 陈云 meets the heads of the Central People''s Broadcasting Station''s 中央人民广播电台 arts department and its storytelling troupe 说唱团 on improving the Xihe dagu 西河大鼓 and danxian 单弦, which he means to study, and asks for their tapes, lyrics and materials: of over a hundred Jingyun dagu 京韵大鼓 pieces he has heard, the modern ones narrow, northern drum-song''s marks lost, all politics and no music; at work the audience sees model workers and after work hears of model workers; good traditional pieces to be played or they will be lost.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 75. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
