        time_range: ['1960-01-23T04:00Z', '1960-01-23T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Zhou Enlai 周恩来, flown in that morning, calls on Chen Yun 陈云 and talks with him.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 30. See [[cal.1960-01-23.china-leadership]]. The words: 下午 (30). Made public: 2015. Names: Zhou Enlai, Chen Yun.'
        tags: ['polity:prc', 'name:zhou-enlai', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
