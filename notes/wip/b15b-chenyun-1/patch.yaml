        when: Oct. 4
        date: '1960-10-04'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Zhou Enlai 周恩来: he means to spend three months more on the farms and the famine of Henan 河南, northern Anhui 皖北 and northern Jiangsu 苏北; once their farming turns round, China''s farming will look very different.'
