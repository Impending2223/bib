        c: Peking 北京, the Temple of Heaven Park 天坛公园. Chen Yun 陈云 at the May Day 五一国际劳动节 mass gathering.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 85. The words: 上午 (85). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
