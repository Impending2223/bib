  - cite: {id: cal.1960-07.china, item: '[[w.chen-yun-nianpu-xiuding]], III, 40 (the nianpu''s note: the Soviet note of July 16 recalling the experts; from July 28 to Sept. 1 all 1,390 Soviet experts in China withdrawn, more than 900 not sent, 343 contracts and supplements and 257 projects of scientific and technical cooperation torn up)'}
