  - add:
      entry:
        id: cal.1960-11-24.china-leadership-10
        when: Nov. 24
        date: '1960-11-24'
        thread: china-leadership
        c: 'Zhejiang 浙江. Chen Yun 陈云, hearing the heads of the Zhejiang committee 中共浙江省委: 1958''s output overestimated; in three years the mess halls, the water-works armies, seed and exports took 20 billion jin more, and the townspeople''s rations alone 16.7 billion jin of rice more; surplus provinces (Heilongjiang 黑龙江, Sichuan 四川, Jiangxi 江西, Zhejiang) send out more and more, the self-sufficient (Anhui 安徽, Hubei 湖北, Guangdong 广东, Guizhou 贵州, Yunnan 云南) and Fujian 福建 must now send out, Henan 河南 too, and Peking 北京, Tianjin 天津, Shanghai 上海 and Liaoning 辽宁 take far more; this year''s loss to disaster about 36 billion jin; the chief cause 30 million more in the towns and mines: cut the outflow by sending townsmen to the villages, and widen the source by more grain (ten thousand small works of 800 tons, fertilizer native and foreign) and by melons and vegetables mixed with grain; mess-hall rations by the head, the saving the eater''s own.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 54–55. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11-25.china-leadership-8
        when: Nov. 25
        date: '1960-11-25'
        thread: china-leadership
        c: 'Zhejiang 浙江. Chen Yun 陈云, hearing the heads of the Zhejiang committee 中共浙江省委: to bar peasants from the towns by fiat goes against economic law; keep them by more grain, more side-lines, higher grain purchase prices and a narrower gap between town and country; in Japan 日本 most village families have a member working in town, and home industries work for big industry; farming cannot arm itself from its own savings, and the time has come for industry to support it; the drought of Hebei 冀, Shandong 鲁, Henan 豫 and the north of Jiangsu and Anhui calls for water dispatched like an electric grid and the south''s water brought north; the planners, after the Soviet tradition, see only industry and transport; trade and finance to work by economic law, backed by administrative power; the home market neglected; the Center and the provinces to share by contract and proportion (a province with 1.8 million tons of steel capacity to deliver 1.6 million and keep 200,000); a leadership that hears no contrary view is in danger, and outside the first secretary and the organization chief no one dares tell the truth about cadres.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 56–57. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11-29.china-leadership-12
        when: Nov. 29
        date: '1960-11-29'
        thread: china-leadership
        c: 'Zhejiang 浙江. Chen Yun 陈云, hearing the heads of the Zhejiang committee 中共浙江省委: to squeeze people from the towns to the villages takes the firewood from under the pot, the first year with town rations, the second self-supporting; the mass movement joined with technical measures; along the Jiaozhou–Jinan railway 胶济路 in Shandong 山东, forty thousand wells with five-horsepower pumps would water ten million mu and give a billion jin more grain; a rubber-tired handcart is worth four or five laborers, a million wheels need only 2,400 tons of rubber, and 10,000 tons for handcarts would hardly hurt industry; boasting has cost dearly in politics: in Xinyang 信阳, Henan 河南, when someone wrote to the Center the prefectural committee forbade the truth and checked the writer''s hand, the public security serving to deceive those above and crush those below.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 57. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11.china-leadership-29
        when: Nov.
        date: 1960-11
        thread: china-leadership
        c: Chen Yun 陈云 proposes to the heads of the Ministry of Food's Party group 中共粮食部党组 the emergency import of grain; the group agrees and sends Li Xiannian 李先念 its report proposing to the Center that grain be imported.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 57. Made public: 2015. Names: Chen Yun, Li Xiannian.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11-29.china-leadership-13
        when: Nov. 29
        date: '1960-11-29'
        thread: china-leadership
        c: 'Li Xiannian 李先念, on Chen Yun''s 陈云 view, writes to Mao Zedong 毛泽东, Zhou Enlai 周恩来 and others and the Center: to get through next spring''s hunger and steady the grain situation, 1.2 billion jin of grain, or more, to be imported.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 57. See [[cal.1960-11.china-leadership-29]]. Made public: 2015. Names: Li Xiannian, Chen Yun, Mao Zedong, Zhou Enlai.'
        tags: ['polity:prc', 'name:li-xiannian', 'name:chen-yun', 'name:mao-zedong', 'name:zhou-enlai', 'vis:only:prc']
  - cite: {id: cal.1960-12-05.china-leadership-6, item: '[[w.chen-yun-nianpu-xiuding]], III, 57 (Dec. 5, Zhou Enlai''s minute: "have told Xiannian to proceed")'}
  - cite: {id: cal.1960-12-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 57 (Dec. 12, Mao''s minute: wholly agreed; two billion jin, if it can be imported, better)'}
  - add:
