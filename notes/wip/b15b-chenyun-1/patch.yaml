        c: 'Hangzhou 杭州, his residence. Chen Yun 陈云 twice sends for Zhou Liang 周良, deputy head of the Suzhou culture bureau 苏州市文化局, morning and evening, and hears him on the Suzhou pingtan''s 评弹 new writing and the revision of the traditional pieces, *San xiao* 《三笑》 and *Zhenzhu ta* 《珍珠塔》 among them: rules to be found for adapting novels and plays, forums on them; the storytellers to read the *General History of China* 《中国通史》, learn geography and review the old historical pieces with historical materialism. The time is the first talk''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 36. The words: 上午和晚上 (36). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1960-05-28.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 36 (the Center''s "Urgent directive on the transport of grain": two months running the grain moved to Peking, Tianjin, Shanghai and Liaoning has not met sales, the stocks almost gone)'}
  - cite: {id: cal.1960-06-06.china-leadership-6, item: '[[w.chen-yun-nianpu-xiuding]], III, 36 (June 6, the Center''s second urgent notice; the cities by then selling grain as it arrived)'}
  - add:
      entry:
        id: cal.1960-05-30.china-leadership-10
        when: May 30
        date: '1960-05-30'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 talks with the heads of the Zhejiang Quyi Workers'' Association 浙江省曲艺工作者协会 and storytellers of the provincial quyi troupe 省曲艺团: plays and novels must be changed when made into pingtan 评弹; a play is the story told by the character, pingtan the character shown in the telling; the new long pieces, mostly from novels of the revolution before 1949, not to have too many parts where the good suffer; old storytellers to hear them and propose changes.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 36. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-05-30.china-leadership-11
        when: May 30
        date: '1960-05-30'
        thread: china-leadership
        c: 'The Center 中共中央 approves and forwards the "second account" 第二本账 of the 1960 plans for industry, transport and capital construction 《关于一九六〇年工业生产、交通运输、基本建设计划第二本账的安排》 from the State Planning Commission 国家计委, the Economic Commission 经委 and the Capital Construction Commission 建委: industrial output to grow 47.6 percent, not the 23 percent the Congress adopted; steel 20.4 million tons, not the 18.4 million set early in the year. The Center calls it the Party''s "first account", to be fulfilled and overfulfilled, steel to reach 21 to 22 million tons if it can.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 37. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-06-04.china-leadership-10
        when: June 4
        date: '1960-06-04'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡 and He Zhanchun 何占春, head of the opera group of the Shanghai People''s Radio 上海人民广播电台: the pingtan 评弹 *Qingchun zhi ge* 《青春之歌》, heard on tape, is good, but wrong on two points: a yuan before the war of 1937 bought what two and a half or three yuan buy now, not two flat cakes; and the March 18 massacre 三一八惨案 was not Chiang Kai-shek''s 蒋介石, whose army had not reached Peking 北京. *Ku cai hua* 《苦菜花》 has six of its thirteen episodes of the good suffering: a line of revolutionary victory should run through it.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 37. Made public: 2015. Names: Chen Yun, Chiang Kai-shek.'
        tags: ['polity:prc', 'name:chen-yun', 'name:chiang-kai-shek', 'vis:only:prc']
  - add:
