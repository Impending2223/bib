  - add:
      entry:
        id: cal.1960-10-03.china-leadership-14
        when: Oct. 3
        date: '1960-10-03'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Mao Zedong 毛泽东, reports on his tour of the farms and the famine of Hebei 河北 and Shandong 山东: Shandong worse hit than Hebei; the Center to hold about a billion jin of grain to help the two; a few concrete measures will bring them through in two or three years; above all they kept the water, against both flood and drought: the Leap''s water works too many, a lesson, but not to be blamed hard, since without them each province would have lost not ten million mu and more but thirty million; he goes to Xuanhua 宣化 on the 4th on the iron mines, back the evening of the 6th, and asks to report in person on the villages'' way through the famine and the conditions of a real turn in farming.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 44. See [[cal.1960-10-06.china-leadership]]. Made public: 2015. To check: 《陈云文集》, where the nianpu says the letter is collected. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
