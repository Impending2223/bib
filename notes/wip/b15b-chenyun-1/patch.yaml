        when: Jan. 24
        date: '1961-01-24'
        thread: china-leadership
        c: Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡, sends three books on the Kunming Lake 昆明湖 for the Shanghai storyteller Qin Jiwen 秦纪文; having heard the revised pingtan 评弹 *Zhenzhu ta* 《珍珠塔》 and read four issues of debate in *Jiangsu xiqu* 《江苏戏曲》 on the Xi opera 锡剧 *Zhenzhu ta*, he has talked twice with Zhou Yang 周扬, and they broadly agree.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 71–72. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-02-12.china-leadership-8
        when: Feb. 12
        date: '1961-02-12'
        thread: china-leadership
        c: 'Chen Yun 陈云 writes again to Wu Zongxi 吴宗锡: three things in the revised pingtan 评弹 *Zhenzhu ta* 《珍珠塔》 not reasonable; Zhou Yang 周扬 thinks the Xi opera 锡剧 version broadly sound, and he agrees; pingtan, sung over dozens of episodes, must draw its people in full where a play may cut, which is why *Zhenzhu ta* must be revised and is hard to revise; not to let his and Zhou Yang''s views hold the work up, and some failed trials will help.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 71–72. See [[cal.1961-01-24.china-leadership-12]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-01-25.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 72 (evening: Chen Yun at the Standing Committee hearing Zhou Enlai on the trade delegation''s talks with the government of the German Democratic Republic and settling the work for after Mao leaves Peking)'}
