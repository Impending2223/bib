        time_band: morning
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Chen Yun 陈云, presiding at a working meeting of the State Council''s Finance and Trade Office 国务院财贸办公室: the Planning Commission 国家计委 to study this year''s market supply and the currency in circulation that cannot be drawn in; peasants with money and no industrial goods to buy will not sell their produce, which hurts light industry and supply in turn; first call on some goods for the market, higher prices on some luxuries, the warehouses cleared, some construction workers sent home to the villages; less pay for the idle factories'' workers, or bonds, to be weighed with care.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 74. The words: 上午 (74). Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
