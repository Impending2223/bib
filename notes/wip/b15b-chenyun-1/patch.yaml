  - add:
      entry:
        id: cal.1960-10-18.china-leadership-13
        when: Oct. 18
        date: '1960-10-18'
        thread: china-leadership
        c: 'Li Xiannian 李先念, summing up at the national conference of the provinces'' Party secretaries for finance and trade 全国省、市、自治区党委财贸书记会议: summer grain procurement 29.5 billion jin, 11.7 billion less than a year before; working stocks at the end of September 33.6 billion jin, 16.7 billion less; sales for the next nine months must run 2.6 billion jin a month below the year before''s, but are rising; if they are not held down, stocks will be dug into with none left to dig, and supplies will fail over wide areas.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 46–47. Made public: 2015. Names: Li Xiannian.'
        tags: ['polity:prc', 'name:li-xiannian', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-11-08.china-leadership-13
        when: Nov. 8
        date: '1960-11-08'
        thread: china-leadership
        c: The Center 中共中央 approves and forwards Li Xiannian's 李先念 summing-up at the conference of finance and trade secretaries.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 47. See [[cal.1960-10-18.china-leadership-13]]. Made public: 2015. Names: Li Xiannian.'
        tags: ['polity:prc', 'name:li-xiannian', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-19.china-leadership-11
        when: Oct. 19
        date: '1960-10-19'
        place: zhengzhou
        thread: china-leadership
        c: 'Zhengzhou 郑州. Chen Yun 陈云 hears the heads of the Henan committee 中共河南省委: its grief over the Xinyang 信阳 affair is good, but bad men to be told from good men who followed blindly; the villages will be hard put for two or three years more; procurement, long about 86 billion jin, set at 110 billion at Beidaihe 北戴河 this year, the towns, mess halls, water works, seed and exports using 60 billion jin more; every province to reckon what it grows, what the villages must keep and what can go to the towns; the towns, 90-odd million a few years ago, now 130 million; the Planning Commission must put farming first. Four ways for two or three years: the three-level ownership truly carried out; farm labor fixed for good, those who can come back from the towns to come back; industry to back any measure worth 50 to 100 million jin of grain; melons and vegetables mixed with grain. Henan, Hebei 冀, Shandong 鲁, northern Jiangsu and northern Anhui typical of China; water, fertilizer and tractors the keys; more grain, more pigs, more manure, more grain.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 47–48. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-20.china-leadership-11
        when: Oct. 20
        date: '1960-10-20'
        place: zhengzhou
        thread: china-leadership
        c: Zhengzhou 郑州. Chen Yun 陈云 hears Zhao Wenfu 赵文甫, vice-governor of Henan 河南省, on men drawing ploughs 人拉犁, the transport of grain and the province's economic plan.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 48. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-20.china-leadership-12
        when: Oct. 20
        date: '1960-10-20'
        place: zhengzhou
        thread: china-leadership
        c: 'Zhengzhou 郑州. Chen Yun 陈云, by letter to Li Fuchun 李富春, proposes that eight or nine thousand of the 20,000 tons of rubber to be re-exported to the Soviet Union 苏联 go to rubber-tired handcarts instead: it would ease the peasants'' carrying and so add to farm labor, a measure quicker to pay than any farm machine.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 48–49. Made public: 2015. Names: Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-21.china-leadership-10
        when: Oct. 21
        date: '1960-10-21'
        place: zhengzhou
        thread: china-leadership
        c: 'Zhengzhou 郑州. Chen Yun 陈云 to the heads of the Henan committee 中共河南省委: since 1958 grain consumption up 60 billion jin and more, by the towns'' growth, the mess halls and seed; no retreat, since steel must go on, the mess halls stay and seed be kept: clench the teeth two or three years and grow more grain, sweet potatoes, melons and vegetables; the zeal of 500 million peasants the root, policy first; a charter fixing the powers of commune, brigade, team and member for years. Why did no prefectural or county committee report the Xinyang 信阳 affair? Fear of being called right-leaning; a leadership that hears no contrary view is in danger; Zhou Enlai 周恩来 told him many at the finance and trade secretaries'' conference would not give the output of 1958 and 1959; output must be made real from the provincial committee down. Small freedoms: private plots, what grows by the house, livestock and poultry, house and furniture the members'' own. America''s 2.6 billion mu; Japan''s 10 million tons of steel and 30 million of rolling capacity; ore dressing the key to steel''s quality.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 49–50. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-22.china-leadership-10
        when: Oct. 22
        date: '1960-10-22'
        place: zhengzhou
        thread: china-leadership
        c: 'Zhengzhou 郑州. Chen Yun 陈云 talks again with the heads of the Henan committee 中共河南省委: water the key to China''s farming, from the sky, from under the ground and from outside; Henan 河南 must borrow water from the south; good steel for small farm tools; in steel, the mines first and the rolling mills second, and the kinds of steel.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 50. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-10-22.china-leadership-11
        when: Oct. 22
        date: '1960-10-22'
        place: zhengzhou
        thread: china-leadership
        c: 'Zhengzhou 郑州. Chen Yun 陈云, having received the draft of the Center''s "Urgent directive letter on present policy in the rural people''s communes" 《中共中央关于农村人民公社当前政策问题的紧急指示信》 that Zhou Enlai 周恩来 directed, writes to him: food is the peasants'' most pressing and general question, and only by putting their living and eating at the center can the "equalize and transfer" 一平二调 errors be righted; the 8,000 tons of rubber planned for export (5,000 in foreign-trade stocks, 3,000 about to be imported) to be kept for rural handcarts, and the plan for ten million handcarts next year not to be cut for the coking coal the steel industry needs.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 50–51. See [[cal.1960-11-03.china-leadership]]. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
