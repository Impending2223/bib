  - add:
      entry:
        id: cal.1960-02-23.china-leadership-9
        when: Feb. 23
        date: '1960-02-23'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡: no top storytellers of Shanghai 上海 to be sent to Hangzhou to play for him; second- or third-rank ones from Shanghai or Suzhou 苏州 will do, since he wants only the outline of each piece, hears each pair once in person and the rest on tape.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 32. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-03-01.china-leadership-9
        when: Mar. 1
        date: '1960-03-01'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云, having heard the tapes of the long piece *Zhenzhu ta* 《珍珠塔》 against its script, talks with Xue Xiaoqing 薛筱卿 of the Shanghai People''s Pingtan Troupe 上海市人民评弹团: much feudal morality in it, but its ambition for office not to be cut out, since study then was for office; it has been told for over a hundred years, and its revision should go slowly.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 32. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-03-20.china-leadership-13
        when: Mar. 20
        date: '1960-03-20'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 talks with members of the Shanghai People''s Pingtan Troupe 上海市人民评弹团: the traditional pieces hold the best, the dross and the harmless middle, and needless tangles; keep the best and the harmless, drop the dross; meetings of all who tell one piece to draw up its revision; success and failure both to be expected, as a general who wins two battles and loses one is a capable general; seriousness on the stage joined with liveliness; storytelling in standard Chinese 普通话 to be tried.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 32–33. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
