  - add:
      entry:
        id: cal.1961-04-16.china-leadership-13
        when: Apr. 16–20
        date: '1961-04-16'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Chen Yun 陈云 hears the heads of the Nanjing Chemical Industry Company 南京化学工业公司, five half-days running, and interjects: mines and chemical works on one plan, with fixed contracts for raw materials; inferior anthracite for gas to be studied; copper tailings for sulfuric acid; steel supplied to size and grade, with certificates; repairs by outside cooperation as before; technical staff only 4 percent of the workers, against 20 percent in the Soviet Union 苏联 and 30 to 40 in America; night colleges and correspondence courses; "red" not the only test, and the company''s fifty-odd technicians each to have a written record; the one-man management system wrong, but its sound rules not to be thrown out, and neither the factory director nor the Party secretary to rule alone; the mass movement not to break the rules. The time is the first day''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 83–84. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
