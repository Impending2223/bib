        date: 1960-11
        thread: china-leadership
        c: 'As the *Chen Yun nianpu* reports it: in November Peking 北京, Tianjin 天津 and Shanghai 上海 sell 570 million jin of grain and take in only 370 million, 200 million short.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 57. Made public: 2015.'
        tags: ['polity:prc', 'ok:fields-place', 'form:state', 'vis:only:prc']
  - add:
