  - add:
      entry:
        id: cal.1960-02-02.china-leadership-4
        when: Feb. 2–3
        date: '1960-02-02'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 calls a forum of the pingtan 评弹 world and speaks: the new pieces healthier, with more singing, but the narration weak, and narration is pingtan''s chief means; jokes and digressions now too timid; the audience pays twenty cents and has not come for a political lesson; errors of geography, history and science in the old pieces to be corrected; myth not superstition; a serious manner on the stage. The time is the first day''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 30–31. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-02-04.china-leadership-4
        when: Feb. 4
        date: '1960-02-04'
        place: [suzhou, shanghai]
        thread: china-leadership
        c: Chen Yun 陈云 goes from Suzhou 苏州 to Shanghai 上海.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 31. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1960-02.china-leadership-12
        when: Feb., at Shanghai, between the 4th and the 16th
        date: 1960-02
        at: after 1960-02-04
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海, resting. Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海人民评弹团: narration first, singing not neglected; one or two of the newly adapted long pieces to be raised in two or three years to the level of the traditional ones, to break the hold of scholar-and-beauty romance; professionals and amateurs, old and young storytellers together; advanced and middle classes for the storytellers; a school of their own; praise in due measure, no puffing in the press, Party and Youth League members not to live on the title; a research body, so that leaders are freed from routine.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 31–32. The nianpu dates the talks to his stay at Shanghai, Feb. 4–16. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
