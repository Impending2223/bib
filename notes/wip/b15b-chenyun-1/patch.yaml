        when: July 3 or 4
        date: '1960-07-03'
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with Zhu Lizhi 朱理治, member of the Center''s Finance and Economics Small Group 中共中央财经小组 and vice-chairman of the State Planning Commission 国家计划委员会: grain supply still very tight this year; in three years, 10,000 small fertilizer works making 800 tons of synthetic ammonia a year each, for 64 billion jin of fertilizer, 50 jin a mu, needing 2 million tons of rolled steel (350,000 tons of it seamless tube, and 300 tons of nickel and chrome), 4 million kilowatts of generators and 160,000 tons of copper; and 20 million more horsepower of drainage and irrigation machinery, for 25 million in all.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 39. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
