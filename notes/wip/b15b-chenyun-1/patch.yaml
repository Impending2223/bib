  - add:
      entry:
        id: cal.1960-02-02.china-leadership-4
        when: Feb. 2–3
        date: '1960-02-02'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 calls a forum of the pingtan 评弹 world and speaks: the new pieces healthier, with more singing, but the narration weak, and narration is pingtan''s chief means; jokes and digressions now too timid; the audience pays twenty cents and has not come for a political lesson; errors of geography, history and science in the old pieces to be corrected; myth not superstition; a serious manner on the stage. The time is the first day''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 30–31. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
