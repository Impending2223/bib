  - add:
      entry:
        id: cal.1960-03-31.china-leadership-7
        when: Mar. 31
        date: '1960-03-31'
        thread: china-leadership
        c: Chen Yun 陈云 asks Chen Yi 陈毅 to call on Ma Yinchu 马寅初, under attack for his *New Theory of Population* 《新人口论》 and already forced out as president of Peking University 北京大学 (the nianpu's note). Chen Yi tells Ma that he and Chen Yun both think his theory of population right.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 33. Made public: 2015. Names: Chen Yun, Chen Yi.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:chen-yi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-04-04.china-leadership-11
        when: Apr. 4
        date: '1960-04-04'
        thread: china-leadership
        c: 'Li Xiannian 李先念, presiding at a meeting of the State Council''s Finance and Trade Office 国务院财贸办公室: in the First Five-Year Plan Chen Yun 陈云 took grain and cotton in hand himself and the state held some cotton in reserve, but in the past two years the reserve has been used up; cotton is the strategic good second to grain, the state must keep something back of both, and the key is more production.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 33. Made public: 2015. Names: Li Xiannian, Chen Yun.'
        tags: ['polity:prc', 'name:li-xiannian', 'name:chen-yun', 'vis:only:prc']
