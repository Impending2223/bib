        id: cal.1960-01-06.china-leadership-7
        when: Jan. 6
        date: '1960-01-06'
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Chen Yun 陈云, by letter, asks Wu Zongxi 吴宗锡 and Li Qingfu 李庆福, head and deputy head of the Shanghai People's Pingtan Troupe 上海市人民评弹团, for a list of all the pingtan 评弹 storytellers of Shanghai 上海, Suzhou 苏州 and Changshu 常熟, each with his repertoire and whether he plays alone or paired, and for the Shanghai Pingtan Association's 上海评弹协会 playbills of the past few years.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 29. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1960-01-07.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 29–30 (Chen Yun absent through illness; the 1960 targets: output 306 billion yuan, steel 18.4 million tons, grain 600 billion jin; the 1959 grain crop in fact 340 billion jin)'}
  - add:
      entry:
        id: cal.1960-01-20.china-leadership-11
        when: Jan. 20
        date: '1960-01-20'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 writes eight points on putting the traditional pingtan 评弹 repertoire in order: cut the harmful, keep the best and the harmless, compress the tedious; enough sung passages; the best parts made into middle-length pieces to stand alone; digressions and jokes not too many; the stories to be revised while they are told, step by step.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 30. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
