        id: cal.1960-12-07.china-leadership-5
        when: Dec. 7
        date: '1960-12-07'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 meets the heads of the Shanghai and Suzhou 苏州 culture bureaus and the Shanghai People''s Pingtan Troupe 上海市人民评弹团, Li Taicheng 李太成, Wu Zongxi 吴宗锡, He Zhanchun 何占春 and Zhou Liang 周良: *Zhenzhu ta* 《珍珠塔》 has great sway, and a good revision of it will show the old pieces can be revised well; no cry of "left" or "right" at every fault, a hundred schools contending; the working people in art may have faults, as Lu Xun 鲁迅 held; "I deal in clothes and food".'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 57–58. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
