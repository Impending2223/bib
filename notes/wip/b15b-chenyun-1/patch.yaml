        id: cal.1960-05-15.china-leadership-8
        when: May 15
        date: '1960-05-15'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 talks with the heads of the Suzhou 苏州 culture bureau 苏州市文化局 and pingtan 评弹 storytellers of Shanghai 上海 and Jiangsu 江苏 on new work: a new piece a year, ten in ten years; he has heard *Lin hai xue yuan* 《林海雪原》 and *Ye huo chun feng dou gucheng* 《野火春风斗古城》, both from novels; a sung text needs more than a read one; tell new pieces boldly and fear no thin houses at first.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 35–36. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
