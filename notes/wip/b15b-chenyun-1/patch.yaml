  - add:
      entry:
        id: cal.1960-02.china-leadership-12
        when: Feb., at Shanghai, between the 4th and the 16th
        date: 1960-02
        at: after 1960-02-04
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海, resting. Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海人民评弹团: narration first, singing not neglected; one or two of the newly adapted long pieces to be raised in two or three years to the level of the traditional ones, to break the hold of scholar-and-beauty romance; professionals and amateurs, old and young storytellers together; advanced and middle classes for the storytellers; a school of their own; praise in due measure, no puffing in the press, Party and Youth League members not to live on the title; a research body, so that leaders are freed from routine.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 31–32. The nianpu dates the talks to his stay at Shanghai, Feb. 4–16. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
