        id: cal.1961-01-15.china-leadership-9
        when: Jan. 15
        date: '1961-01-15'
        thread: china-leadership
        c: 'The Center 中共中央 approves and forwards the Grain Price Small Group''s report: grain purchase prices to rise 20 percent on average across the country from the summer harvest, the bonus of 5 percent of the average price for the main grain areas of 1960 kept.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 67. See [[cal.1961-01-09.china-leadership-13]]. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-01-14.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 67–68 (Chen Yun at the Ninth Plenum; Li Fuchun''s report; "adjust, consolidate, fill out, raise" approved; agriculture, light industry, heavy industry in that order; capital construction in the budget cut 38 percent, steel up 1.6 percent; private plots from 5 to 7 percent for twenty years at least; pigs chiefly private, private sows allowed; the six regional bureaus approved; Mao calls for investigation and study)'}
  - cite: {id: cal.1961-01-15.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 68 (evening: Chen Yun at the meeting Mao calls to hear the plenum''s groups)'}
  - cite: {id: cal.1961-01-16.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 68 (afternoon: Chen Yun attends the Secretariat on the grain arrangements for 1961–62)'}
  - cite: {id: cal.1961-01-17.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 68 (evening: Chen Yun at the enlarged Standing Committee hearing the plenum''s groups)'}
  - add:
      entry:
        id: cal.1961-01-18.china-leadership-5
        when: Jan. 18
        date: '1961-01-18'
        place: peking
        thread: china-leadership
        c: 'Peking 北京, the Ninth Plenum 八届九中全会. Chen Yun 陈云 speaks: he approves the work of Liu Shaoqi''s 刘少奇 delegation at the Moscow 莫斯科 meeting of the parties; the 1961 plan truly puts agriculture first and agriculture, light and heavy industry in that order, gaps, quality and kinds before quantity; even 18.7 million tons of steel is hard (Britain and Germany took long to reach it, Japan and France stayed under 15 million, the Soviet Union had 18.31 million before the war); more rolling mills of every size and the whole chain from coal washing to rolling; the mines from hand labor to machines; Hebei 冀, Shandong 鲁, Henan 豫, northern Anhui and northern Jiangsu, now with water held, could change China''s farming; March to May the hungry months, grain moved east to west and back; free markets in the small towns from April, fine sweets and cakes in Peking 北京, Tianjin 天津 and Shanghai 上海, restaurants selling fried pork by the fourth quarter: rationing and open sale, "walking on two legs".'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 68–69. See [[cal.1961-01-14.china-leadership]]. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Liu Shaoqi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:liu-shaoqi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-01-19.china-leadership-8
        when: Jan. 19
        date: '1961-01-19'
        thread: china-leadership
        c: 'Chen Yun 陈云 speaks to the Central Work Conference 中共中央工作会议 on importing grain and drawing in currency: China must stand on its own grain, but two million tons can be imported now, the contracts nearly signed, and four million this year would ease things; walnuts, melon seeds and red dates to be exported for it, and a foot less cloth a head this year for a billion jin more grain: "one fist, not two"; cakes and sweets, cheap ones on coupons at five or six jiao a jin and dear ones for anyone with money, "one side of the net open", to calm people, nourish them and draw in money; imported sugar for fine sweets, imported wheat for cakes, the bran for pigs, and restaurants for fried pork; the capitalists'' interest at most 100 million yuan a year, 200,000 senior intellectuals, 50 million workers: the sweets will not run out, with over 100,000 tons of sugar landed, over 200,000 on the way and 300,000 more in the second quarter.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 69–71. Made public: 1986 ([[w.chen-yun-wenxuan-1956]], where the nianpu says the speech is collected). To check: [[w.chen-yun-wenxuan-1956]]. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-01-20.china-leadership-12
        when: Jan. 20
        date: '1961-01-20'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Provisional regulations on adjusting the system of management" 《关于调整管理体制的若干暂行规定》: for two or three years economic power to be gathered more to the Center and the regional bureaus; powers over men, money, trade and industry wrongly handed down since 1958 to prefectures, counties, communes and enterprises taken back; the central ministries'' enterprises wholly under their ministries; "one chessboard for the whole country, one account from top to bottom", no adding of targets level by level.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 71. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
