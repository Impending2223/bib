  - add:
      entry:
        id: cal.1960-09-29.china-leadership-12
        when: Sept. 29
        date: '1960-09-29'
        thread: china-leadership
        c: 'Chen Yun 陈云 attends the Secretariat 中共中央书记处 and reports on the farms and the famine of Hebei 河北 and Shandong 山东: industry, now with a base, must do more for agriculture; a million rubber-tired handcarts would give Hebei 750 million jin more grain, 600,000 horsepower of pumps would give Shandong 1.2 billion; the sharp question how much grain can be drawn from the villages for the towns: too much and the peasants go short, too little and the towns'' supply fails; grain and labor kept in the villages and sent to the towns stand in a proportion, and past it there is trouble.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 43. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
