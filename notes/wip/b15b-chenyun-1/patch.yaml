  - add:
      entry:
        id: cal.1960-12-20.china-leadership-5
        when: Dec. 20
        date: '1960-12-20'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Li Fuchun 李富春, proposes that eight or nine thousand tons more of rubber be squeezed from other uses in the draft 1961 targets for rubber-tired handcarts: with the townspeople unable to go back to the villages in numbers, the handcart lightens the peasants'' carrying and so adds to farm labor, quicker to pay than any farm machine.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 59. Made public: 2015. Names: Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-12-22.china-leadership-8
        when: Dec. 22
        date: '1960-12-22'
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with the staff of the Central People''s Broadcasting Station''s 中央人民广播电台 arts department on quyi 曲艺: the traditional pieces of the Jingyun 京韵大鼓 and Xihe 西河大鼓 drum ballads lively, the modern ones wooden; quyi too solemn; after a day''s work and study, people want something light, not a meeting.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 59. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1960-12-22.china-leadership-9
        when: Dec. 22
        date: '1960-12-22'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Zhou Yang 周扬, deputy head of the Propaganda Department 中共中央宣传部 and vice-chairman of the All-China Federation of Literary and Art Circles 全国文联, sends a list of the long pingtan 评弹 pieces: 56 traditional pieces from before 1949, 75 new ones on history or from classical novels and plays, and 25 on new people and new things, which draw far smaller houses, the work on them too short, the storytellers strangers to such people, and the pieces too solemn; he proposes that the Federation bring new writers into the work.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 59–60. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1960-12-23.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 60 (evening: Chen Yun with Liu Shaoqi, Zhu De, Deng Xiaoping and others at the meeting Mao calls of the regional bureaus'' first and second secretaries, on the villages'' livelihood and the coming work conference''s agenda; the six regional bureaus set up by the Politburo in September 1960 (the nianpu''s note))'}
  - add:
      entry:
        id: cal.1960-12-24.china-leadership-11
        when: Dec. 24
        date: '1960-12-24'
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with the heads of the Chinese Quyi Workers'' Association 中国曲艺工作者协会 on writing new pieces: a famous storyteller with a new piece draws less than a young one with an old piece, so the fault is the new pieces'' art; quyi has stressed politics and slighted entertainment; every piece the storytellers play to be recorded live and transcribed word for word.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 60. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
