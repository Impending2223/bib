        n: '[[w.chen-yun-nianpu-xiuding]], III, 88. Made public: 2015. Names: Chen Yun, Li Xiannian, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-25.china-leadership-7
        when: May 25
        date: '1961-05-25'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 speaks to the East China and Northeast groups 华东、东北组 of the Central Work Conference: investigation must go down to the grass roots, and also hear contrary views among the cadres around one, since refuting error is how truth grows, and Mao Zedong Thought 毛泽东思想 grew by struggle with error; compensation to the peasants, 15 to 20 billion yuan in all, 2 billion a year (1.5 from the Center, 0.5 from the localities), to be paid in full, even 40 billion, as a matter of restoring political faith; coal, iron, timber and bamboo for it to be in the plan; the mountain people carrying public and procurement grain out to be paid for the transport.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 88–89. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-05-28.china-leadership-7, item: '[[w.chen-yun-nianpu-xiuding]], III, 89 (afternoon: Chen Yun with Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian and others at the meeting Zhou Enlai calls on grain for the third quarter of 1961 and the year 1961–62)'}
  - cite: {id: cal.1961-05-28.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 89 (Chen Yun with Zhou Enlai, Peng Zhen, Li Fuchun, Tan Zhenlin, Bo Yibo, Yang Shangkun and others to Deng Xiaoping''s on grain)'}
  - cite: {id: cal.1961-05-30.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 89–90 (Chen Yun speaks to the East China area meeting of the Finance and Trade Office''s foreign trade conference: farm procurement better loose than tight; the wage bill from 13.7 billion yuan in 1956 to 26.3 billion; first food, then clothing; to steady the market import grain, and export farm produce for it; production for the world market, direct links of production and sale, exchange and return of goods, strict inspection; the state shops like "the King of Hell keeping a wine shop", the "official merchant" manner to go; printed in 《陈云文选》 as 《做好外贸工作》)'}
  - cite: {id: cal.1961-05-31.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 90–92 (Chen Yun speaks to the work conference on cutting staff and sending townspeople to the villages: four ways (policy, industry''s support, imports beyond 10 billion jin hard, townspeople to the villages), the first the root and the fourth indispensable; either squeeze the peasants'' rations or send townspeople down; three of the four grain crises since 1949 came from the towns'' growth; to reach 1958''s output again would take three or four years even at 20 to 30 billion jin more a year; 25 million new workers in three years, the towns at 130 million; twenty million sent down would save 3 billion jin the first year and 9 billion the second; printed in 《陈云文选》 as 《动员城市人口下乡》)'}
  - add:
      entry:
        id: cal.1961-06-03.china-leadership-11
        when: June 3
        date: '1961-06-03'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 speaks to the East China and Northeast groups 华东、东北组 of the Central Work Conference: the peasants'' zeal is up and goods will grow, but the state has nothing to trade them; steel, bamboo and coal for small goods the peasants need, and the timber saved from capital construction sold to them for tools and houses; first the villages, then the towns; high-priced sweets to go on; townspeople to the villages; then 100 million dollars of rubber, black sheet and other materials imported for goods, until coupons cover only a few things; fewer compulsory purchase quotas, and barter for the peasants'' surplus.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 92. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-06-06.china-leadership-13
        when: June 6
        date: '1961-06-06'
        time_range: ['1961-06-05T22:00Z', '1961-06-06T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 speaks to the Central Work Conference: after the summer harvest the provinces must buy more, since the Center must send grain to the Northeast 东北, or people will die in the stricken areas, and against accidents (late ships, floods on the railways, empty stores) the southern provinces to lend grain till autumn; fixed output quotas rouse the peasants, but even overfulfillers will eat less than in past years; steel for farm tools as compensation, made locally at the old handicraft forges, not in batches by the farm-machinery departments; Li Fuchun 李富春 is right that heavy industry must retreat far enough to meet farming''s and the market''s needs, but the Center, the regional bureaus and each province should first set up a group to rank industry''s measures of support.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 92–93. The words: 上午 (92–93). Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1961-06-06.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 93 (Chen Yun with Liu Shaoqi, Zhou Enlai, Zhu De and others meets and gives a banquet for the delegation of the Indonesian Communist Party under Aidit, its general secretary)'}
  - add:
      entry:
        id: cal.1961-06-09.china-leadership-9
        when: June 9
        date: '1961-06-09'
        place: peking
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with the heads concerned of the Central People''s Broadcasting Station 中央人民广播电台 and the Peking culture bureau 北京市文化局: the northern quyi 曲艺 troupe should take new students, since Hou Baolin 侯宝林 has no assistant and the Xihe dagu 西河大鼓 singer Ma Zengfen 马增芬 no regular pupil, and their art may be lost; performances to have captions, and Jingyun dagu 京韵大鼓 lyrics to be published in collections.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 93. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-06-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 93 (morning: Chen Yun at the plenary; when Li Fuchun says the plan must first meet the needs of farming and the market, Mao interjects: "Comrade Chen Yun said before that the market comes first; many opposed it then, and I did not speak; now are we not back on that track?")'}
  - add:
      entry:
        id: cal.1961-06-15.china-leadership-15
        when: June 15
        date: '1961-06-15'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Li Fuchun 李富春: cotton will not grow for five years, and people will be angry at a few feet of cloth coupons a year (towels and socks included); he proposes a "clothing small group" 穿衣问题小组 under a vice-chairman of the Planning Commission 国家计委 to study coke-oven by-products, North Korea''s 北朝鲜 vinylon process, a kapron 卡普隆 works of 5,000 tons a year in two years (two pairs of socks a townsman) and more viscose fiber.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 93–94. Made public: 2015. To check: To check: 《陈云文集》, where the nianpu says it is collected. Names: Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - variant: {id: cal.1961-01-12.china-leadership-2, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'in the morning (上午), Chen Yun with Zhu De, Deng Xiaoping and others at the airport to meet him', at: 'III, 67'}
