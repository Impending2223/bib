        date: 1960-10
        at: after 1960-10-28
        thread: china-leadership
        c: 'Anhui 安徽. Chen Yun 陈云 hears the heads of the Anhui committee 中共安徽省委 on farming, a network of waterways for the Huai 淮河 and fertilizer, and the Ministry of the Chemical Industry''s 化工部 capital construction department on the 800-ton synthetic-ammonia works, and repeats his Henan views: cash crops bear on industry, revenue and living, and their sown area and output must not fall again, since ten million mu more of grain will not solve grain, but ten million mu less of cotton makes a great problem; output quotas to leave room for overfulfillment; the members'' small freedoms; the small fertilizer works, many and early in Anhui, to be redesigned for the villages, with roving repair teams; a works of 10,000 to 20,000 tons a province next year; why did the Henan committee hear nothing beforehand of Xinyang 信阳?'
