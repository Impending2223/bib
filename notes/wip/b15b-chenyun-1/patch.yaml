        c: 'Chen Yun 陈云, after seeing the Shanghai Pingtan Troupe 上海评弹团 in a theater, meets its members: at Nanjing 南京 some days before he heard an opening song in praise of the Leap, "rice yielding 200,000 jin, a melon of 200 jin, peaches as big as a face", such things once sung but not to be sung now; Jiangsu 江苏 to be told to look over such lyrics.'
