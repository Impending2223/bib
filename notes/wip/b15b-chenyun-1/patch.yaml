        date: '1961-02-08'
        place: tianjin
        thread: china-leadership
        c: 'Tianjin 天津. Chen Yun 陈云 meets the heads of the province''s and city''s arts and quyi 曲艺 work: performers, accompanists, writers and lovers of each form to compile its materials; Jingyun dagu 京韵大鼓 has four marks, light lyrics, fine tunes, a crisp tempo, clear words and round tones, and the new pieces keep only the politics; the Hebei culture bureau 河北省文化局 to survey the province''s quyi performers and gather their lyrics.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 72–73. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
