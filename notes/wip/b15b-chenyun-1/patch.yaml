        when: Mar., after the 27th
        date: 1960-03
        at: after 1960-03-27
        thread: china-leadership
        c: 'Zhou Enlai 周恩来 sends Chen Yun''s 陈云 letter round to Deng Xiaoping 邓小平, Peng Zhen 彭真 and Li Fuchun 李富春, with a minute: Li Fuchun had proposed that Chen Yun attend the National People''s Congress 全国人大; Zhou had asked him at Hangzhou 杭州 whether he could come to its opening and close; his health fits him for the opening and close only, not every day.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 33. See [[cal.1960-03-27.china-leadership-10]]. Made public: 2015. Names: Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhou-enlai', 'name:chen-yun', 'name:deng-xiaoping', 'name:peng-zhen', 'name:li-fuchun', 'vis:only:prc']
