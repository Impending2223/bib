  - add:
      entry:
        id: cal.1961-05-05.china-leadership-15
        when: May 5
        date: '1961-05-05'
        thread: china-leadership
        c: 'Chen Yun 陈云 calls the heads concerned of the Ministry of the Chemical Industry 化工部, the First Ministry of Machine Building 一机部, the Ministry of Commerce 商业部, the State Economic Commission 国家经委 and the General Bureau of Materials 物资总局 on materials for the big nitrogen works'' plant: the lists of imported materials to be reckoned exactly and in full; the locally managed goods bought on the home market to be supplied by special offices of the Ministry of Commerce and the Bureau.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 85–86. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-06.china-leadership-10
        when: May 6
        date: '1961-05-06'
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团: pingtan''s 评弹 history must be studied, the years before and after the war with Japan too, when it turned commercial and vulgar jokes ran wild, whence the "cutting off of tails" 斩尾巴 after 1949 (the early movement of some in pingtan to stop the traditional pieces, the nianpu''s note); now jokes are needed again, but not to excess; students of literature, drama and music to be welcomed to study pingtan.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 86. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'vis:only:prc']
