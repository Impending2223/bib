  - add:
      entry:
        id: cal.1961-04-25.china-leadership-10
        when: Apr. 25
        date: '1961-04-25'
        thread: china-leadership
        c: 'Chen Yun 陈云 sees the Shanghai Pingtan Troupe 上海评弹团 perform and receives Wu Zongxi 吴宗锡 and the young storytellers of *Qingchun zhi ge* 《青春之歌》, Shi Wenlei 石文磊 and Zhao Kaisheng 赵开生 among them: a ballad needs flesh as well as bones, and jokes; the audience wants the good to come through; a revolutionary story ends in victory, as history did; Yang Zirong 杨子荣 of *Lin hai xue yuan* 《林海雪原》 really died but the novel lets him live, and the ballad may invent too; a piece takes not three years to revise but ten; a general who wins has lost battles.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 84–85. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
