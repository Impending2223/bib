        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡, gives the Shanghai People's Pingtan Troupe 上海市人民评弹团 a *Short General History of China* 《简明中国通史》, an atlas of the provinces 《中国分省地图》 and a *Ciyuan* 《辞源》, the atlas and the *Ciyuan* his own used copies, to rouse an interest in checking history and geography.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 37. Made public: 2015. To check: To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
