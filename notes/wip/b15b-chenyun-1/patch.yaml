        date: '1960-07-21'
        place: beidaihe
        thread: china-leadership
        c: 'Beidaihe 北戴河. Chen Yun 陈云 talks with Zhang Zhen 张珍, Vice-Minister of the Chemical Industry 化工部, and others on making and building synthetic-ammonia works of 800 tons a year: the small works bring two revolutions, ammonia water put straight on the fields, saving sulfur, and plant any province can make; their compressors the first hurdle; build small for the most part, with one big works a province as a base; 300,000 to 500,000 tons of synthetic fiber a year to be planned against the shortage of cotton yarn.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 41. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
