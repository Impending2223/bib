  - add:
      entry:
        id: cal.1961-04-04.china-leadership-11
        when: Apr. 4–10
        date: '1961-04-04'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 presides, six half-days running, at a forum on speeding the nitrogen-fertilizer industry, with members of the Center''s Fertilizer Small Group 中央化肥小组 (set up in October 1960 under the Planning Commission, Peng Tao 彭涛 at its head, the nianpu''s note) and others: for 1962–64 the works to be big, 200,000 to 250,000 tons of synthetic ammonia a year of new capacity, five works of 50,000 tons a year finished each year and ten building at once, near coal and in the high-yield grain and cash-crop areas; "I am an activist for small nitrogen works, now forced to go big", the small and middle plant still to be tried; imported materials "a great invention"; a buying group abroad under the Fertilizer Small Group; foreign exchange to go to 5 million tons of grain till August and then as needed, 45 million dollars at most in three years, a foot less cloth a head saving 35 million; Shanghai''s 上海 hundred-odd works for fertilizer plant, eighteen of them the core. Grain output of 1958, published as 750 billion jin, then 500 billion, he reckons at about 420 billion; 1960''s at most 310 billion, and the day he heard it was 310 billion he drank a glass of wine (the statistics give 287 billion for 1960 and 295 billion for 1961, the nianpu''s note); the loss to disaster not 120 billion, nor Li Xiannian''s 李先念 50 billion, but at most 36 billion; ten to twelve million townsmen to go to the villages; the Soviet planning method to be taken in part and dropped in part; speak without fear of "left" or right: "if anyone wants to expel you from the Party, come to me." The minutes of the forum follow. The time is the first day''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 80–82. Made public: 2015. Names: Chen Yun, Li Xiannian.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'vis:only:prc']
  - add:
