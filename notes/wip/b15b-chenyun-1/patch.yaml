      entry:
        id: cal.1960-10-04.china-leadership-12
        when: Oct. 4–6
        date: '1960-10-04'
        place: xuanhua
        thread: china-leadership
        c: 'Xuanhua 宣化. Chen Yun 陈云 inspects the Longyan Iron and Steel Company 龙烟钢铁公司 on moving its mines and coking from hand labor to machines: at the Yanshan 烟筒山, Sifangtai 四方台 and Pangjiapu 庞家堡 iron mines he goes twice down the pits, against his doctors'' rule of no more than a hundred paces, and walks the galleries to the face. To the heads of the locality, the Ministry of Metallurgy 冶金部, the company and the mines: the key to mechanizing the mines is haulage and cutting; the big modern steel works rest on small half-modern iron works, machine-built mills on hand-worked mines; quality and output turn on the mines, not the smelting; dressing at the mine; outside Wuhan 武钢 and Baotou 包钢, no hurry for big furnaces, which without ore have nothing to smelt.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 44–45. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc@C-G']
