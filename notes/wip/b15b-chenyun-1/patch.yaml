        when: Feb. 25
        date: '1961-02-25'
        thread: china-leadership
        c: 'The State Council''s Finance and Trade Office 国务院财贸办公室 reports to the Center 中共中央 on widening the sale of high-priced sweets and cakes 《关于继续扩大高价糖果和高价糕点供应范围的报告》: over forty cities sell them freely, and in thirty-odd days 18 million jin have been sold and 83 million yuan of currency drawn in; by the end of March high-priced sweets to be sold in every town and village, high-priced cakes in every city and town, without coupons or limit, the profits to the treasury.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 75–76. Made public: 2015.'
