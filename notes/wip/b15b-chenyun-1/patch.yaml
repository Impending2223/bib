  - cite: {id: cal.1960-11-03.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 52 (the "Urgent directive letter": three-level ownership with the team as base the communes'' fundamental system now; "equalize and transfer" opposed; private plots and small side-lines; to each by his work; labor saved for farming; grain arranged and the mess halls run well; rural fairs restored)'}
  - add:
      entry:
        id: cal.1960-11-14.china-leadership-6
        when: Nov. 14
        date: '1960-11-14'
        time_range: ['1960-11-13T22:00Z', '1960-11-14T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Chen Yun 陈云 meets members of the Jiangsu Culture Bureau 江苏省文化局 and the Jiangsu Quyi Troupe 江苏省曲艺团: the decline of the Yangzhou tanci 扬州弹词 has social and economic causes but also its own conservatism, the pieces handed only to sons; its tunes and playing to learn from other forms; trials and innovation to be allowed; learn from Suzhou 苏州 tanci''s new pieces; each student one or two pieces, played often, to master them.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 52–53. The words: 上午 (52–53). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1960-11-14.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 53 (the directive: rations and meat and oil reduced in two years; the new substitutes, maize-root flour, wheat-root flour, maize-stalk flour, acorn flour, leaf protein, artificial meat extract, chlorella, scenedesmus; leaves, grasses, wild plants, stalks and roots to be gathered and stored)'}
