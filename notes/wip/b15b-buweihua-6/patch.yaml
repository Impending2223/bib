        c: General Tang Liang 唐亮, once political commissar of the Nanjing Military Region 南京军区, retired sick in 1963, in the four olds 破四旧 takes the lead and burns his family's mahjong, playing cards, records, old books, high heels and qipaos, a thread-bound *Qinggong shisan chao* 《清宫十三朝》 among them, "a great pity."
