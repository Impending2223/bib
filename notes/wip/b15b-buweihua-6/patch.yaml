  - cite:
      id: cal.1966-08-25.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 225 (the Red Guard bodies of thirty-one West City middle schools meet at the girls'' middle school of Peking Normal University 师大女附中 and decide to found the Pickets'' West City detachment; nineteen more West City schools'' bodies join soon after; its declared duties: to study, carry out, spread and defend Mao Zedong Thought; to suppress the landlords, rich peasants, counter-revolutionaries, bad elements, rightists, the bourgeoisie and their "filial sons"; to annul propaganda and bans not in line with Mao Zedong Thought; to inspect every unit''s Red Guards; to hold false Red Guards and hooligans; to guard the important state organs and main streets)'
      units: A, B
  - add:
