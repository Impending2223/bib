        n: '[[w.pu-weihua-zalan-jiu-shijie]], 272 n.103. To check: [[w.zhonggong-shanghai-dangzhi]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 272 n.103). Made public: 2001 ([[w.zhonggong-shanghai-dangzhi]]).'
