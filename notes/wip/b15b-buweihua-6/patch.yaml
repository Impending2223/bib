      item: '[[w.pu-weihua-zalan-jiu-shijie]], 242, 242 n.86 (Aug. 22: the Center forwards the Ministry of Public Security''s report 〈严禁出动警察镇压革命学生运动〉: no police under any pretext to interfere with or suppress the movement; no arrests in the movement but of active counter-revolutionaries with proof of murder, arson, poisoning, sabotage or theft of state secrets)'
