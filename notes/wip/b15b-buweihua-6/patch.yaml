        thread: china-leadership
        c: 'Peking 北京, the Peking Geological Institute 北京地质学院. The rebels'' "liaison station for smashing the revisionist high-salary system" 砸烂修正主义高薪制度联络站, with the Red Guard headquarters'' approval, cancels the high salaries of the institute''s "capitalist roaders" and "reactionary academic authorities": they are to live on no more than Peking''s lowest standard, 25 yuan, their families on no more than its middling, 18 yuan.'
