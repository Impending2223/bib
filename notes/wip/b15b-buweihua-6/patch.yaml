        c: Peking 北京, Dongdan Santiao 东单三条. Red Guards of a dozen middle schools, with the direct backing of the Cultural Revolution Group 中央文革 and the public security organs, burst into the Franciscan Missionaries of Mary's convent 玛利亚方济格修女会 and demand the expulsion of the "Roman nuns" spying "under religion's cloak."
