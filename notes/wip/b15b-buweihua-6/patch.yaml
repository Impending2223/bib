      item: '[[w.pu-weihua-zalan-jiu-shijie]], 273–274, 274 n.106 (Zhou, explaining the papers on the sending away of the "four categories" the rebels found in the "black materials": early in the Cultural Revolution the landlords, rich peasants, counter-revolutionaries and bad elements were to be moved out, and a work group set up; he asked Mao June 10 and conveyed his instruction June 13; perhaps too many were sent; it has nothing to do with the Liu–Deng line''s branding the masses counter-revolutionary; the Red Guards'' driving the four categories back to the villages went too far)'
