        date: 1966-10
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Citywide rebel Red Guard bodies appear, the chief: the Red Guards'' Shanghai Colleges'' Revolutionary Committee 红卫兵上海市大专院校革命委员会 ("Hongge hui" 红革会), the Shanghai Bombard the Headquarters United Corps 上海炮打司令部联合兵团 ("Paosi" 炮司), the Shanghai Red Guards'' Third Headquarters 上海红卫兵第三司令部 and the Red Third Headquarters 红三司 split from it; among the middle schools, the Maoism Red Guards'' Northeast Shanghai Command 毛泽东主义红卫兵上海东北地区指挥部, the Southwest Shanghai Command 红卫兵上海西南地区指挥部 and the Shanghai Red Guard Revolutionary Rebel Committee 红卫兵上海市革命造反派委员会.'
