      item: '[[w.pu-weihua-zalan-jiu-shijie]], 233 (Aug. 29, evening, 8月29日晚: over thirty Red Guards of the Peking University economics department search the house of Zhang Shizhao, member of the NPC Standing Committee and of the CPPCC Standing Committee, carrying off his opium pipes and other things; seeing his photograph with Mao, they go no further)'
  - cite:
      id: cal.1966-08-30.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 233–234, 234 n.69 (Zhang''s letter asks Mao to ease matters "within the possible"; Mao''s comment of the 30th, "to the Premier to handle; he should be protected"; Zhou that day writes out in his own hand a list of cadres to be protected)'
  - cite:
      id: cal.1966-08-30.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 234, 234 n.68 (the list (234 n.68): Song Qingling, Guo Moruo, Zhang Shizhao, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Shao Lizi, Jiang Guangnai, Cai Tingkai, Sha Qianli, Zhang Xiruo, Li Zongren and others; the state''s vice-chairmen, the NPC Standing Committee''s vice-chairmen and members, the CPPCC''s vice-chairmen, the vice-premiers, ministers and vice-ministers, the democratic parties'' heads and the presidents of the Supreme Court and Procuratorate; the Ministry of Public Security to pass it to the United Front Work Department, to list the non-Party figures by it)'
  - cite:
