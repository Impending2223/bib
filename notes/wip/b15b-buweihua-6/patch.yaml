  - edit:
      id: cal.1966-08-20.china-leadership-4
      base: c4fe7064
      set:
        gloss:
          title: Estimates
          text:
            - Bu Weihua puts at 4,922 the cultural relics and old sites of Peking destroyed of the 6,843 the survey of 1958 had kept, most of them in August and September 1966, with over two hundred old buildings pulled down ([[w.pu-weihua-zalan-jiu-shijie]], 234). By an incomplete count he gives from Zhao Xuexun 趙學勳 (1985), 117 tons of metal relics were later saved from the copper smelters and over 320 tons of books and papers from the paper mills, and 185,000 paintings and calligraphies, 2,357,000 volumes of old books and 538,000 other relics were picked out at the depots of confiscated goods ([[w.pu-weihua-zalan-jiu-shijie]], 235, 235 n.70).
