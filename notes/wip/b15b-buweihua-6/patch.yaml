        date: '1966-09-12'
        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. The Shanghai Red Guard General Headquarters 上海市红卫兵总部 is founded; it holds that the movement be led by the Party committees.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
