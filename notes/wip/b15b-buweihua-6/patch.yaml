        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. The Red Guards' Shanghai Colleges' General Headquarters 红卫兵上海市大专院校总部 is founded; it holds that the movement be led by the Party committees.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. See [[cal.1966-09-12.china-leadership-10]].'
