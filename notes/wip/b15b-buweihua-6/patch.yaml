        date: 1966-08
        at: after 1966-08-19
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Red Guards rename streets, shops, factories and schools: Chang''an Avenue 长安街 East Is Red Avenue 东方红大路; Dongjiaominxiang 东交民巷 Anti-Imperialism Road 反帝路; Xijiaominxiang and Wangfujing 王府井 Anti-Revisionism Road 反修路; Guanghua Road 光华路, the seat of the Democratic Republic of Vietnam''s embassy, Aid Vietnam Road 援越路; the Wangfujing Department Store, the Peking Department Store; the Dong''an Market 东安市场, the East Wind Market 东风市场; the Peking Union Medical College Hospital 协和医院, the Anti-Imperialism Hospital; the Tongren Hospital 同仁医院, the Workers, Peasants and Soldiers Hospital. In Zhongnanhai 中南海 Zhou Enlai''s 周恩来 Xihua Hall 西花厅 is renamed the "Facing the Sun Hall" 向阳厅.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 231–232.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 231–232: all'
