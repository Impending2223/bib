  - cite:
      id: cal.1966-08-26.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 266 (Aug. 26: the Daxing county public security bureau''s meeting relays Xie Fuzhi''s speech at the city bureau''s enlarged meeting: do not be bound by the rules of the past; "if the masses beat people to death, I am not for it, but ... we cannot stop them, so do not force it"; the police to stand with the Red Guards and tell them of the "five categories"; the rumor that the commune, county, city and Zhou Enlai all back the killing)'
      units: A
  - cite:
      id: cal.1966-08-31.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 266 (from Aug. 27 to Sept. 1 thirteen communes and forty-eight brigades of Daxing kill 325 of the "four categories" and their families, the oldest eighty, the youngest thirty-eight days, twenty-two households wiped out; the Daxinzhuang commune worst, dozens killed on Aug. 31 alone, a well filled with corpses; the killing stopped only when Ma Li came to the county)'
      units: A
  - cite:
      id: cal.1966-09-01.china-leadership-12
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 266 (Ma Li, secretary of the city committee, goes to Daxing and stops it)'
  - cite:
      id: cal.1966-09-02.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 266, 266 n.93 (Sept. 2: the Peking committee''s "urgent notice" to stop the killings in town and country: the Party committees, the people''s councils'' Party groups and the public security to stop every killing; giving out lists of "hooligans" for struggle forbidden, on pain of discipline; the lists of the five categories not to be given to the masses)'
      units: A
  - cite:
      id: cal.1966-08-30.china-leadership-9
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 247–248, 248 n.95 (Zhang Yonghe 张永和, then a cadre of the county committee''s rural work department, sent to stop the killing at the Macun brigade of the East Is Red commune 东方红公社马村大队: the yard of the killings at the west end of the main street, the living bound and the dead lying in their blood, two barrows carrying the bodies out (said to be buried by the Yongding River); a boy of fourteen or fifteen has two fingers smashed by an iron bar; a young man made to find "hidden guns" jumps into a well and is hauled out with a rope; both die soon after (Zhang to Yu Luowen, 248 n.95b))'
  - to-check:
      id: cal.1966-08-30.china-leadership-9
      add: 張連和 (so the note), 〈五進馬村勸停殺〉, in [[w.nage-niandai-zhong-de]], I, 399–403 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 248 n.95a); 遇羅文, 〈大興屠殺調查〉, *Xin yusi* (www.xys.org) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 248 n.95b).
  - cite:
      id: cal.1966-08-20.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 269, 269 n.97 (Aug. 20: Mao on the *Jiefangjun bao* editors'' office''s *Wenhua dageming qingkuang jianbao* no. 109, which Lin Biao forwards: "Seen. A very good thing ... exposes the ox-demons completely"; "No wonder: this can strike out a road, good for the masses")'
      units: A
  - cite:
      id: cal.1966-08.china-leadership-36
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 269, 269 n.98 (one day at the height of the four olds Mao calls Wu De to report; Wu De, hoping to check it, says the city committee cannot control the disorder; Mao, slowly: nobody had touched the old remnants of several dynasties in Peking; the four olds have touched them, "that is good too" (Wu De, 2004, 27))'
      units: A
  - cite:
      id: cal.1966-07-21.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 269 n.96 (July 21: Mao, on the draft "The situation of the Great Proletarian Cultural Revolution and some questions of the Party''s policy," the forerunner of the Sixteen Points, changes "the Cultural Revolution is to make every work better, more, faster, cheaper" to "is to revolutionize men''s thought, and so make every work better, more, faster, cheaper" (the *Wengao*, XII, 83))'
  - cite:
      id: cal.1966-08-23.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 270 (Aug. 23: the front-page headline "The tide of the Great Proletarian Cultural Revolution sweeps the capital''s streets," and two editorials, "Excellent!" 〈好得很〉 and "Workers, peasants and soldiers must firmly support the revolutionary students": in a few days the Red Guards'' iron brooms have swept away the names and customs of the exploiting classes)'
  - cite:
      id: cal.1966-08-29.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 270 (Aug. 29: the editorial "Salute our Red Guards": the old customs swept out like rubbish; the bloodsuckers dragged out one by one, their hidden gold and silver, "change-of-heaven accounts" and weapons shown to the public)'
  - cite:
      id: cal.1966-08-31.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 270–271, 271 n.100 (Aug. 31, at Mao''s second reception of the teachers, students and Red Guards come to Peking: the Red Guards "take to the streets and sweep away the four olds"; the struggle-criticize-reform of the schools has gone out into society; Mao read and approved the speech beforehand)'
      units: A
  - cite:
      id: cal.1966-09-15.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 271, 271 n.101 (Sept. 15, Lin Biao at the third reception, in Tiananmen Square: "Red Guard fighters ... your revolutionary actions have shaken the whole society ... you have done right and done well"; the speech read and approved by Mao beforehand)'
  - cite:
      id: cal.1966-09-25.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 271–272, 271 n.102 (Sept. 25: Ye Jianying, with Qi Benyu and Xie Tangzhong, receiving delegates of teachers and students of art academies and troupes: the Red Guards'' "immortal merit"; Peking''s ten thousand "black households" no one had entered in sixteen years; a convent primary school foreigners ran for years; "the little generals ... whatever the law ... swept it all away"; it may break a little policy, but the greater gain is to sweep away bad men)'
