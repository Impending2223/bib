        place: jinan
        thread: china-leadership
        c: 'Jinan 济南. Red Guard bodies of some colleges and middle schools found two opposed bodies: the "Jinan Red Guard Division" 济南红卫兵师, mostly students backing their schools'' leaders, and the "Red Guard Jinan Command" 红卫兵济南指挥部, mostly students against them.'
