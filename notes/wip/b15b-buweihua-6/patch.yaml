  - add:
      entry:
        id: cal.1966-08-28.china-leadership-14
        when: Aug. 28
        date: '1966-08-28'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Kang Sheng 康生 receives the Peking Mining Institute''s 北京矿业学院 Mao Zedong Thought Red Guards 毛泽东思想红卫兵. Of the First Headquarters 一司: neither the Center 中央 nor the city committee 市委 knew of it beforehand; inquiry after the fact shows a few dozen schools set it up themselves. The Red Guards put three points: they do not recognize the headquarters founded the afternoon before; a general headquarters to be founded anew; failing that, they will ask Mao 毛泽东 directly. Kang: those that have not joined may found one of their own.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 224. The words: 我们中央、市委事前也不晓得; 没有加入的,你们重新成立一个 (224). See [[cal.1966-08-28.china-leadership-13]]. Names: Kang Sheng.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 224: all'
        tags: [polity:prc, name:kang-sheng]
  - cite:
      id: cal.1966-09-05.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 224–225 (forty-eight bodies of forty-eight colleges, over 11,000; Zhou Taian 周太安 of People''s University, son of the Navy''s deputy commander Zhou Xihan 周希汉, acting commander; very few minority bodies in it, Beihang''s Red Flag among them, the majority bodies overwhelming, called by the rebels the "royalist headquarters"; Jiang Qing, Xie Fuzhi, Yang Chengwu, Liu Zhijian and Wang Dongxing at its founding meeting, Jiang and Liu speaking; Yang Chengwu and Liu Zhijian its advisers)'
      units: A, B
