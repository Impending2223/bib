      item: '[[w.pu-weihua-zalan-jiu-shijie]], 232 (the Red Guards'' demand, by posters of Aug. 20 and 21, that Yangwei Road, where the Soviet embassy stands, be renamed Anti-Revisionism Road; the street to the Soviet commercial counsellor''s office renamed "Dig Out the Roots of Revisionism Street" 挖修根街)'
