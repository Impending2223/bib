        place: peking
        thread: china-leadership
        c: 'Peking 北京. Red Guards of the Peking Industrial Institute 北京工业学院 and some other colleges found the Capital Colleges'' Red Guard Liaison Committee 首都大专院校红卫兵联络委员会, then called the "Fourth Headquarters" 第四司令部: small, of little weight, soon gone.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 225.'
