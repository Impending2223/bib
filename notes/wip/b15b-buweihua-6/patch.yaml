  - add:
      entry:
        id: cal.1966-10.china-leadership-35
        when: Oct. and after
        date: 1966-10
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Citywide rebel Red Guard bodies appear, the chief: the Red Guards'' Shanghai Colleges'' Revolutionary Committee 红卫兵上海市大专院校革命委员会 ("Hongge hui" 红革会), the Shanghai Bombard the Headquarters United Corps 上海炮打司令部联合兵团 ("Paosi" 炮司), the Shanghai Red Guards'' Third Headquarters 上海红卫兵第三司令部 and the Red Third Headquarters 红三司 split from it; among the middle schools, the Maoism Red Guards'' Northeast Shanghai Command 毛泽东主义红卫兵上海东北地区指挥部, the Southwest Shanghai Command 红卫兵上海西南地区指挥部 and the Shanghai Red Guard Revolutionary Rebel Committee 红卫兵上海市革命造反派委员会.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228–229. See [[cal.1966-09-26.china-leadership-4]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228–229: all'
        tags: [polity:prc]
  - cite:
      id: cal.1966-08-08.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 (the Sixteen Points the first to put "destroy the four olds, build the four news": the old thought, culture, customs and habits of the exploiting classes; the Points do not say what is old and what new)'
  - cite:
      id: cal.1966-05-16.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 (the passage "no construction without destruction ... put destruction first, and construction is in it" 破字当头,立也就在其中了, written by Mao when revising the Notice, later the ground of the "great criticism" and the four olds)'
  - cite:
      id: cal.1966-10-25.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 n.62 (in the speech: the old culture and thought are at root the old "private" 私, the new the "public" 公)'
