      entry:
        id: cal.1966-08-31.china-leadership-14
        when: Aug. 31
        date: '1966-08-31'
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. The Hangzhou colleges' and middle schools' Red Guard headquarters 杭州市大中学校红卫兵司令部 ("Red First Headquarters" 红一司) is founded, with Red Guard pickets under it.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09-03.china-leadership-9
        when: Sept. 3
        date: '1966-09-03'
        place: canton
        thread: china-leadership
        c: Canton 广州, the Sun Yat-sen Memorial Hall 中山纪念堂. The city's first Red Guard congress, the chief officers of the Central-South Bureau 中南局, the Guangdong committee, the Canton committee, the Canton forces and the Guangdong Military District attending, adopts the "Red Guard Declaration" 《红卫兵宣言》.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09-07.china-leadership-8
        when: Sept. 7
        date: '1966-09-07'
        place: xinjiang
        thread: china-leadership
        c: The Xinjiang regional committee 新疆自治区党委 sends the schools a notice on preparing an Ürümqi 乌鲁木齐 colleges' and middle schools' "Red Guard General Headquarters" 红卫兵总部.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. Made public: 2008.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
