        place: xinjiang
        thread: china-leadership
        c: The Xinjiang regional committee 新疆自治区党委 sends the schools a notice on preparing an Ürümqi 乌鲁木齐 colleges' and middle schools' "Red Guard General Headquarters" 红卫兵总部.
