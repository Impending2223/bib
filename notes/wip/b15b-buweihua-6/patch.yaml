      item: '[[w.pu-weihua-zalan-jiu-shijie]], 258, 258 n.117 (the notice 〈关于组织外地高等学校革命学生、中等学校革命学生代表和革命教职工代表来北京参观文化大革命运动的通知〉: all college students from elsewhere, but for the sick, those already come and others unable, may come; one staff delegate to fifty college students; one student delegate to ten middle-school students and one staff delegate to a hundred; the train free; living and travel costs from the state, food and lodging in Peking by the city)'
