      item: '[[w.pu-weihua-zalan-jiu-shijie]], 227 (Sept. 3: with the city committee''s backing the Maoism Red Guards hold a delegates'' congress at the city''s Working People''s Cultural Palace and adopt their founding declaration; the committee sends an orchestra and reporters)'
      units: A, B
  - add:
