      item: '[[w.pu-weihua-zalan-jiu-shijie]], 225, 225 n.60 (founded the morning of Sept. 6, 9月6日上午; nineteen bodies of seventeen schools, about 4,000, nearly all minority factions, the Geological Institute''s East Is Red, the Tsinghua "Maoism Red Guards" 毛泽东主义红卫兵, the Posts and Telecommunications Institute''s East Is Red, the Foreign Languages Institute''s Red Flag battalion and the Politics and Law Institute''s commune among them; its conveners Zhou Yongzhang 周永璋 of the Geological Institute and Tang Jin 唐晋 of Tsinghua, Zhou soon removed and Zhu Chengzhao 朱成昭 in his place (225 n.60); Liu Zhijian, Zhou Rongxin and Qi Benyu at its founding meeting, Liu speaking; Yang Chengwu and Liu Zhijian its advisers)'
