        c: Peking 北京. The *Beijing ribao* 《北京日报》 reports that the city people's council 市人民委员会, on the proposal of the Red Guards and the revolutionary masses, has decided to form a special work group to reform the capital's street names thoroughly.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 231 n.65. To check: [[w.zhongguo-gongchandang-beijing-lishi]], 225 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 231 n.65b). See [[cal.1966-08.china-leadership-85]].'
