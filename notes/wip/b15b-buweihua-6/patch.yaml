        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. Shen Yinmo 沈尹默, eighty-four, deputy director of the Central Institute of Culture and History 中央文史馆 and a famous calligrapher, afraid his "reactionary calligraphy" will harm his family and that a fire would be seen and reported, tears up his life's work and genuine pieces of Ming and Qing calligraphers, soaks them to pulp in a footbath, and has his son tip them by night into Suzhou Creek 苏州河.
