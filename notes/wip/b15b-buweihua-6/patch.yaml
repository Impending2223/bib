  - cite:
      id: cal.1966-08-24.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 242–243 (Aug. 24, the "Aug. 24 incident": by noon the posters cover Tsinghua; about 2 p.m. Red Guards of the automatic control department seize the broadcasting station; at 5 p.m. over two thousand Red Guards of twelve schools, led by He Pengfei 贺鹏飞, head of the preparatory committee, enter, proclaim martial law, photograph and copy the posters and tear them all down, break into the dormitories to seize "rightists," beat and search the homes of the former leaders and "black gang," and order some mass organizations dissolved)'
