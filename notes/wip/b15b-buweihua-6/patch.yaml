        place: peking
        thread: china-leadership
        c: Peking 北京. Red Guards of class 2 (3) of the senior school of the Girls' No. 2 Middle School 女二中 put up a poster, "Declaration on naming Anti-Revisionism Road" 〈反修路命名宣言〉, on the wall facing the Soviet embassy 苏联大使馆, demanding that Yangwei Road 扬威路, where it stands, be renamed Anti-Revisionism Road.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 232.'
