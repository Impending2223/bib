      entry:
        id: cal.1966-09-09.china-leadership-8
        when: Sept. 9
        date: '1966-09-09'
        place: urumqi
        thread: china-leadership
        c: Ürümqi 乌鲁木齐. A congress of the area's Red Guard delegates, the regional committee's and the Xinjiang Military District's 新疆军区 leaders attending, announces the preparatory committee of the Ürümqi colleges' and middle schools' Red Guard General Headquarters 乌鲁木齐大中学校红卫兵总部筹委会 (later the "Red First Headquarters" 红一司).
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. See [[cal.1966-09-07.china-leadership-8]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09-10.china-leadership-7
        when: Sept. 10
        date: '1966-09-10'
        place: kunming
        thread: china-leadership
        c: Kunming 昆明. The Red Guard General Headquarters 红卫兵总部 of the Kunming area's colleges is founded, with Qin Jiwei 秦基伟, commander of the Kunming Military Region 昆明军区, its chief adviser, and Wang Yanquan 王砚泉, the region's deputy chief of staff, and Xu Zhifen 许志奋, deputy director of its political department, advisers; the rebels later mock it as the "royalist headquarters."
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
