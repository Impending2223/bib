      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 (the Sixteen Points the first to put "destroy the four olds, build the four news": the old thought, culture, customs and habits of the exploiting classes; the Points do not say what is old and what new)'
  - cite:
      id: cal.1966-05-16.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 (the passage "no construction without destruction ... put destruction first, and construction is in it" 破字当头,立也就在其中了, written by Mao when revising the Notice, later the ground of the "great criticism" and the four olds)'
  - cite:
      id: cal.1966-10-25.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 229 n.62 (in the speech: the old culture and thought are at root the old "private" 私, the new the "public" 公)'
  - cite:
      id: cal.1966-08-19.china
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 230–231, 230 n.63 (the leaflet of the Peking No. 2 Middle School 北京二中 Red Guards, "Last ultimatum: declaring war on the old world" 〈最后通牒——向旧世界宣战〉, put up in the city''s streets on Aug. 17: barbers, tailors, photographers and second-hand bookshops serving the bourgeoisie no exception; "jet" haircuts, cowboy trousers and shirts and Hong Kong-style dresses, yellow photographs and books; the trousers to be cut to shorts, high heels to flat)'
