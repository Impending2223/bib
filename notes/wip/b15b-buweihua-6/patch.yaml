        when: Aug., from the 25th
        date: 1966-08
        at: after 1966-08-25
        place: peking
        thread: china-leadership
        c: Peking 北京. The West City Pickets 西纠, after their founding, issue thirteen general orders 通令 one after another, detailed rules on guarding the Center's Party and government organs, protecting old cadres, keeping state secrets and the capital's order, against force and corporal punishment in struggle and house searches, on the policy toward the national bourgeoisie and on the reception of foreign guests.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 225–226. See [[cal.1966-08-25.china-leadership-4]].'
