        when: Sept., mid
        date: 1966-09
        at: before 1966-09-11
        place: jinan
        thread: china-leadership
        c: 'Jinan 济南. Red Guard bodies of some colleges and middle schools found two opposed bodies: the "Jinan Red Guard Division" 济南红卫兵师, mostly students backing their schools'' leaders, and the "Red Guard Jinan Command" 红卫兵济南指挥部, mostly students against them.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-10.china-leadership-34
        when: Oct., late
        date: 1966-10
        at: before 1966-10-21
        place: jinan
        thread: china-leadership
        c: Jinan 济南. At the height of the criticism of the "bourgeois reactionary line" the Red Guard Division 红卫兵师 and its bodies break up; the Red Guard Jinan Command grows into a province-wide body and is renamed the "Red Guard Shandong Command" 红卫兵山东指挥部.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. See [[cal.1966-09.china-leadership-38]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09-12.china-leadership-10
        when: Sept. 12
        date: '1966-09-12'
        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. The Shanghai Red Guard General Headquarters 上海市红卫兵总部 is founded; it holds that the movement be led by the Party committees.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
