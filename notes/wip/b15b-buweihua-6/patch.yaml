      item: '[[w.pu-weihua-zalan-jiu-shijie]], 242, 242 n.85 (Aug. 21: the General Staff''s and General Political Department''s regulation 〈关于绝对不许动用部队武装镇压革命学生运动的规定〉: no troops in any case to suppress the revolutionary student movement by arms, still less fire on students; even to fire in the air a grave political error, to be strictly punished)'
  - cite:
