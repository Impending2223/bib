      item: '[[w.pu-weihua-zalan-jiu-shijie]], 232, 232 n.66 (Zhou to the Red Guards: the stone lions must go, a "last ultimatum to the lions," those before Xinhuamen 新华门 too, being feudal; the record in the *Wenku* is dated Oct. 22, the *Zhou Enlai nianpu* Oct. 21)'
