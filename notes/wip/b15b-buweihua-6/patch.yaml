        id: cal.1966-09-08.china-leadership-11
        when: Sept. 8
        date: '1966-09-08'
        place: chongqing
        thread: china-leadership
        c: Chongqing 重庆. The headquarters of the Maoism Red Guards 毛泽东主义红卫兵 is formally founded; on the city committee's proposal, with the Chengdu Military Region's 成都军区 approval, Wei Tongtai 韦统泰, commander of the 54th Army 五十四军, and Liang Damen 梁大门, its political department's director, are its advisers.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 227. See [[cal.1966-09-03.china-leadership-5]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 227: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09-09.china-leadership-7
        when: Sept. 9
        date: '1966-09-09'
        place: chongqing
        thread: china-leadership
        c: 'Chongqing 重庆. The *Chongqing ribao* 《重庆日报》 reports the founding of the Maoism Red Guards'' 毛泽东主义红卫兵 headquarters under red banner headlines, with an editorial, "Salute to the heroic Red Guards" 〈向英雄的红卫兵致敬〉: "a great happy event" of the city''s Cultural Revolution.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 227. See [[cal.1966-09-08.china-leadership-11]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 227: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-09.china-leadership-37
        when: Sept., after the 9th
        date: 1966-09
        at: after 1966-09-09
        place: chongqing
        thread: china-leadership
        c: Chongqing 重庆. The city committee calls on every unit to have "red five categories" parents "send their sons to the army," to put their children into the Maoism Red Guards 毛泽东主义红卫兵; the *Chongqing ribao* 《重庆日报》 plays it up, and model workers and old workers across the city follow.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 227. See [[cal.1966-09-09.china-leadership-7]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 227: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-08-25.china-leadership-18
        when: Aug. 25
        date: '1966-08-25'
        place: nanning
        thread: china-leadership
        c: Nanning 南宁, the Red Star Theatre 红星剧院. The city's Red Guard united headquarters 红卫兵联合司令部 holds its founding meeting, heads of the Guangxi regional committee 自治区党委 and the Nanning committee attending; it calls for "destroying the four olds and building the four news" 破四旧、立四新.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 228: all'
        tags: [polity:prc]
