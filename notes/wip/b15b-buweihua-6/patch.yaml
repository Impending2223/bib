        c: 'Zhou Enlai 周恩来, through Zhou Rongxin 周荣鑫 and Xu Ming 许明, gives the West City Pickets 西纠 tasks: the Panchen Lama''s 班禅 safety at the Nationalities Institute 民族学院 students'' meeting to struggle him; the houses of Song Qingling 宋庆龄, He Xiangning 何香凝, Guo Moruo 郭沫若, Fu Zuoyi 傅作义, Zhang Zhizhong 张治中, Shao Lizi 邵力子, Zhang Shizhao 章士钊, Cheng Qian 程潜, Jiang Guangnai 蒋光鼐, Cai Tingkai 蔡廷锴, Sha Qianli 沙千里, Zhang Xiruo 张奚若, Li Zongren 李宗仁, Cheng Yanqiu 程砚秋 and others to be kept from house searches.'
