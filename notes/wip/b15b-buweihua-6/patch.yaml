        c: Canton 广州, the Sun Yat-sen Memorial Hall 中山纪念堂. The city's first Red Guard congress, the chief officers of the Central-South Bureau 中南局, the Guangdong committee, the Canton committee, the Canton forces and the Guangdong Military District attending, adopts the "Red Guard Declaration" 《红卫兵宣言》.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
