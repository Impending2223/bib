        thread: china-leadership
        c: 'Peking 北京, the Beijing Exhibition Hall 北京展览馆. Jiang Qing 江青, at the Haidian district''s 海淀区 middle-school delegates'' meeting, backs the Red Guards'' rebellion against the work groups and speaks of beating: "we do not advocate beating, but it is nothing much"; beating cannot drive out wrong ideas, but beatings in a revolutionary storm are no bad thing; Mao 毛泽东 has said a good man beating a bad one serves him right, a bad man beating a good one honors the good, good men beating each other is a misunderstanding; "from now on, no more beating."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 240, 240 n.81. The words: 我们不提倡打人,但打人也没有什么了不起 (240); the meeting 7月28日晚 (179). To check: 江青對北京市海淀區中學生的講話 (July 28, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 240 n.81). See [[cal.1966-07-28.china-leadership-12]]. Names: Jiang Qing, Mao Zedong.'
