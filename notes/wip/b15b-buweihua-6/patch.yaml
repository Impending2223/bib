        place: peking
        thread: china-leadership
        c: 'Peking 北京. Red Guards of the Central Academy of Fine Arts'' 中央美术学院 middle school put up a poster in the window of the Rongbaozhai 荣宝斋: a "black picture shop" that has served the bourgeoisie, the landlords and the "reactionary academic authorities," not socialism; an exchange of the "black gang" painters; to be ruined.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 231.'
