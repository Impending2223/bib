        c: 'Peking 北京. Thirty-eight college mass organizations outside the First Headquarters 一司, the Peking Mining Institute''s 北京矿业学院 Mao Zedong Thought Red Guards 毛泽东思想红卫兵 among them, issue a statement: its founding illegal and splittist; it cannot speak for the capital''s college Red Guards.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 224. See [[cal.1966-08-27.china-leadership-6]].'
