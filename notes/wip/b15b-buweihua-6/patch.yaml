        c: Shanghai 上海. By the incomplete count of the *Zhonggong Shanghai dangzhi* 《中共上海党志》 (2001), from Aug. 23 to Sept. 25, 1966, over 157,700 households in the city have their homes searched, 6.5 percent of all; some again and again; almost none of the former industrialists and merchants escapes.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 243, 243 n.87b; [[w.zhonggong-shanghai-dangzhi]], 755 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 243 n.87b). See [[cal.1966-08-23.china-leadership-5]].'
