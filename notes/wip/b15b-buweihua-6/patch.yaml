        tags: [polity:prc]
        gloss:
          title: Estimates
          text:
            - 'By other local gazetteers Bu Weihua lists, the households whose homes were searched: Suzhou 64,056; Wuhan 21,000; Kunming 1,749; Chuansha county, Shanghai, over 7,800; Putuo district, Shanghai, 5,363; a county of Zhejiang over 8,000; the Jiangcheng Hani and Yi autonomous county, Yunnan, 565; Weihai, Shandong, 273 of the business and cultural circles alone; a commune of Jiangsu 308; Qingcun commune of Fengxian county, Shanghai, 315 ([[w.pu-weihua-zalan-jiu-shijie]], 243 n.87).'
            - Estimates. Over 80,000 people of Shanghai were sent away by force to other places, by the count of *Zhongguo gongchandang zai Shanghai 80 nian* ([[w.zhongguo-gongchandang-zai-shanghai]], 645, cited by [[w.pu-weihua-zalan-jiu-shijie]], 255 n.109).
  - cite:
      id: cal.1966-08-23.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 234, 243–244, 264 n.88–89 (Aug. 23, afternoon: Red Guards of the Peking half-work, half-study printing school and other schools pile the opera costumes and props gathered at the city Culture Bureau in the four olds in the courtyard of the Confucius Temple at the Guozijian and burn them (234); the rebels of the city Culture Bureau and the Federation, with rebel students of Peking University and the Girls'' No. 8 Middle School, drag out some twenty or thirty: Zhao Dingxin 赵鼎新, the bureau''s head, Lao She, Xiao Jun 萧军, Luo Binji 骆宾基, Duanmu Hongliang 端木蕻良, the actors Xun Huisheng 荀慧生 and Hou Xirui 侯喜瑞; placarded, taken by two trucks to the Confucius Temple at the Guozijian, made to kneel before the fire of books and costumes and beaten for three hours (Xiao Jun''s account in Wang Youqin, 227); then brought back to the Federation and struggled again, Lao She belted by girl students on the steps (Yang Mo''s diary, written up three months later); a writer denounces him for taking American money (Cao Ming, by Hao Ran))'
      units: A
