      item: '[[w.pu-weihua-zalan-jiu-shijie]], 257, 257 n.115 (Aug. 28, to Tang Pingzhu 唐平铸, acting editor of the *Renmin ribao*, and Hu Chi 胡痴, acting editor of the *Jiefangjun bao*: the students care nothing for struggle-criticism-reform and want to sweep out the ox-demons in society; let them go, leaving some to keep house in turn; give letters of introduction to all, left or right; bad men going out can only spread poison, as at home; feed the students from elsewhere; there are rooms enough)'
  - cite:
