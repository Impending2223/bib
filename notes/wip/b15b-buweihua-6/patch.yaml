  - cite:
      id: cal.1966-08-27.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 224 (founded Aug. 27, the afternoon by the Mining Institute Red Guards'' words next day, "昨天下午成立"; twenty-nine bodies of twenty-seven colleges, about 6,000; Wang Yanqun 汪延群 of the Peking Light Industry Institute, Wang Dongxing''s daughter, commander; Liu Pingfan 刘平凡, Liu Zhijian''s daughter, among the deputies; all but a few bodies majority factions that had backed the work groups)'
      units: A
  - variant:
      id: cal.1966-08-27.china-leadership-6
      unit: A
      witness: w.pu-weihua-zalan-jiu-shijie
      reads: the commander Wang Yanqun 汪延群
      at: '224'
  - add:
      entry:
        id: cal.1966-08-27.china-leadership-20
        when: Aug. 27
        date: '1966-08-27'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Jiang Qing 江青, at the founding meeting of the Capital Colleges'' Red Guard Headquarters 首都大专院校红卫兵司令部 (the First Headquarters 一司), with Xie Fuzhi 谢富治, Yang Chengwu 杨成武, Liu Zhijian 刘志坚 and Wang Dongxing 汪东兴 present: she comes herself and believes the Cultural Revolution Group 中央文革小组 backs them too; she proposes Yang Chengwu and Liu Zhijian as their advisers, and gives them a task: to help the People''s Liberation Army guard Zhongnanhai 中南海, the Great Hall 大会堂 and the Diaoyutai 钓鱼台.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 224. The words: 我个人参加你们的大会; 协助人民解放军保护中南海、大会堂、钓鱼台 (224); the founding 昨天下午 (224, the Mining Institute Red Guards'' words of Aug. 28). See [[cal.1966-08-27.china-leadership-6]]. Names: Jiang Qing, Xie Fuzhi.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 224: all'
        tags: [polity:prc, name:jiang-qing, name:xie-fuzhi]
        time_range:
          - 1966-08-27T04:00Z
          - 1966-08-27T10:00Z
        time_band: afternoon
        time_zone: Asia/Shanghai
