        place: peking
        thread: china-leadership
        c: 'Peking 北京. The middle school of the "Mao Zedong-ism University" 毛泽东主义大学附中 puts up "Rules for Anti-Revisionism Road" 〈反修路规定〉: from Aug. 21 every foreign vehicle on it to go slow; the revisionist countries'' vehicles never again to run wild on China''s sacred soil.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 232. See [[cal.1966-08-20.china-leadership-11]].'
