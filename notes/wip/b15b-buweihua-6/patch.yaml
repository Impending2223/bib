  - cite:
      id: cal.1966-08-27.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 224 (founded Aug. 27, the afternoon by the Mining Institute Red Guards'' words next day, "昨天下午成立"; twenty-nine bodies of twenty-seven colleges, about 6,000; Wang Yanqun 汪延群 of the Peking Light Industry Institute, Wang Dongxing''s daughter, commander; Liu Pingfan 刘平凡, Liu Zhijian''s daughter, among the deputies; all but a few bodies majority factions that had backed the work groups)'
      units: A
