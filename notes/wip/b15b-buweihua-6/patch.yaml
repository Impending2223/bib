  - cite:
      id: cal.1966-08-18.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 231, 231 n.64 (Aug. 18: Red Guards of some Peking middle schools plan to storm the Palace Museum 故宫; Zhou, told that evening, orders it closed and has the Peking garrison send a battalion to guard it)'
  - cite:
      id: cal.1966-08-19.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 231, 231 n.64 (the next day Red Guards come to the Palace Museum, and the staff, as Zhou instructed, send them away)'
  - cite:
      id: cal.1966-08-19.china-leadership-12
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 231 (from Aug. 19: Red Guards of the No. 2, No. 15 and No. 63 middle schools smash the "Quanjude" signboard, over seventy years old, and put up "Peking Roast Duck Restaurant")'
