      item: '[[w.pu-weihua-zalan-jiu-shijie]], 234 (later, Hospital 301 told to be ready to take in Zhang Zhizhong, Zhang Shizhao, Cheng Qian, Fu Zuoyi and other senior democratic personages, old and ill, whom the government is to protect)'
