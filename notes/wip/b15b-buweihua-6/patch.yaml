        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. The Hangzhou colleges' and middle schools' Red Guard headquarters 杭州市大中学校红卫兵司令部 ("Red First Headquarters" 红一司) is founded, with Red Guard pickets under it.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 228.'
