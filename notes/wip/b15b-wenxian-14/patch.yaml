      when: May
      date: 1960-05
      thread: china-leadership
      c: '*Nei Menggu funü* 内蒙古妇女 prints "Chairman Mao''s sayings on the women''s movement" 毛主席关于妇女运动的语录, taken from "Chairman Mao comes to our pig farm" 《毛主席来到我们的养猪场》 (*Zhongguo funü*, July 1, 1958), exposed as a fabrication in 1958.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 219 (the Propaganda Department''s report of Feb. 23, 1961, which names it among the faults in the propaganda of Mao Zedong Thought). To check: *Nei Menggu funü*, May 1960.'
      tags:
      - polity:prc
