      when: Jan. 5
      date: '1961-01-05'
      thread: china-leadership
      place: peking
      c: 'Peking 北京. The Ministry of Health 卫生部 opens the national meeting of the heads of health departments and bureaus and some presidents of medical schools 全国卫生厅、局长及部分医药院校长会议, to Jan. 15, the Center''s departments sending men: the urgent treatment and prevention of disease.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 152 (the ministry''s Party group''s report of Jan. 20, 1961). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
