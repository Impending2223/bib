      thread: china-leadership
      c: 'The General Political Department 总政治部 reports to the Military Commission 军委 and the Center 中共中央 on the all-army political work conference of Oct. 18–Nov. 4: the four regulations for the company political instructor, the Party branch, the Youth League branch and the revolutionary soldiers'' committee adopted.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 773–778. Made public: 1997. See [[cal.1961-10-18.china-leadership-6]].'
