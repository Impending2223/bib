      c: 'The Ministry of Light Industry 轻工业部 holds its national meeting of the heads of light industry departments and bureaus 全国轻工业厅局长会议: daily-use industrial goods, small goods above all, to be arranged by the market''s need, trade by trade and kind by kind, the goods of the season and of the Spring Festival first.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 13 (the Ministry of Light Industry Party group''s report of Dec. 30, 1960). Made public: 1997.'
