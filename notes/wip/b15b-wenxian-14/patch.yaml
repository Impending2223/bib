    at: XIV, 182–183
- cite:
    id: cal.1961-04-04.china-leadership-11
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 337 (the Fertilizer Small Group''s report of May 16: the Hangzhou forum Chen Yun called, Apr. 4–10, with some of the group, studied the size and the deployment of the nitrogen works and agreed)'
- cite:
    id: cal.1961-05-04.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316 (Mao''s letter of May 6: a second notice sent May 4 put the conference off to May 20, for fuller inquiry)'
