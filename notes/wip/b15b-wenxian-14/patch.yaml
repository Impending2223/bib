      when: Dec. 27
      date: '1960-12-27'
      thread: china-leadership
      c: 'The Ministry of Light Industry 轻工业部 holds a telephone conference on the emergency arrangement of the production of daily-use industrial goods (chiefly small goods) 日用工业品（主要是小商品）生产紧急安排电话会议: the localities'' carrying out checked, further steps set.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 13 (the Ministry of Light Industry Party group''s report of Dec. 30, 1960). Made public: 1997.'
