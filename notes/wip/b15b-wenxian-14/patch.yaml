    entry:
      id: cal.1961-06.china-leadership-17
      when: June
      date: 1961-06
      thread: china-leadership
      c: The Party groups of the State Science Commission 国家科委 and the Academy of Sciences 中国科学院 draw up the "Fourteen opinions on the present work of the natural science research organs (draft)" 《关于自然科学研究机构当前工作的十四条意见（草案）》.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 546–570 (sent with Nie Rongzhen''s report of June 20). Made public: 1997. Sent on: [[cal.1961-07-19.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-13.china-leadership-10
      when: July 13
      date: '1961-07-13'
      thread: china-leadership
      c: 'The Ministry of National Defense''s 国防部 "Regulations on militia work" 《民兵工作条例》, dated July 13: the militia a tool of defense against imperialist aggression abroad and of the people''s democratic dictatorship at home, the army''s helper and reserve.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 846–857 (printed after the notice of the Center and the State Council of Dec. 11). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-04.china-leadership-7
      when: Aug. 4
      date: '1961-08-04'
      thread: china-leadership
      c: 'The Northwest Bureau 西北局 draws up the minutes of the first nationalities work conference of the Northwest 《西北地区第一次民族工作会议纪要》: the minorities about 18.4 percent of the region''s people, their autonomous areas about 78 percent of its land; the work in the pastoral areas and their communes since 1958 and the nationality and religious policies reviewed.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 819–844 (printed after the Center''s comment of Dec. 6). Made public: 1997. See [[cal.1961-07-11.china-leadership-4]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-04.china-leadership-8
      when: Aug. 4
      date: '1961-08-04'
      thread: china-leadership
      c: 'The United Front Department 中共中央统一战线工作部 reports to the Center 中共中央 and the Chairman "On continuing the policy of placing the bourgeoisie in the organs, the enterprises and the urban people''s communes" 《关于在机关、企业和城市人民公社等方面继续贯彻对资产阶级人们的安排政策的意见》: non-Party heads of provincial departments and bureaus in nineteen provinces and cities down from 380 in 1955 to about 270, from 20–25 to about 10 percent; capitalists placed in the joint enterprises demoted or idle, about 50 percent by typical inquiries, 70–80 in some places.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 572–575. Made public: 1997. See [[cal.1961-06-15.china-leadership-12]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-06.china-leadership-9
      when: Sept. 6
      date: '1961-09-06'
      thread: china-leadership
      c: 'Li Xiannian 李先念 reports to the Chairman and the Center 中共中央 "On the market, prices and the circulation of currency" 《关于市场、物价和货币流通问题的报告》: currency in circulation 9.5 billion yuan at the end of 1960, 11 billion on Sept. 5, 1961, about 12.5 billion expected by the year''s end; a yuan in circulation backed by 4.5 yuan of goods, against 8 or 9 when the market was stable.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 682–701. Made public: 1997. Names: Li Xiannian.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-xiannian
- add:
    entry:
      id: cal.1961-09-27.china-leadership-9
      when: Sept. 27
      date: '1961-09-27'
      thread: china-leadership
      c: 'The United Front 中央统战部, Organization 中央组织部 and Propaganda 中央宣传部 Departments report to the Center 中共中央 on the national conference on remolding rightists 《关于全国改造右派分子工作会议的报告》 (Aug. 28–Sept. 11, ninety-four present, Ping Jiesan 平杰三 and others speaking): about 100,000 labels removed in 1959 and 1960; over 80 percent of the rest behave well or fairly well; many units treat them roughly.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 756–762. Made public: 1997. See [[cal.1961-08-28.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-29.china-leadership-9
      when: Sept. 29
      date: '1961-09-29'
      thread: china-leadership
      c: 'The State Planning Commission Party group 国家计委党组 reports to the Center 中共中央 "On the supplementary plan (control figures) for the last two years of the second five-year plan" 《关于第二个五年计划后两年补充计划（控制数字）的报告》, after the national planning conference of July 17–Aug. 12 and the Lushan conference: steel this year about 8.5 million tons, in 1962 7.5 million; pig iron 12 and 10.7 million.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 714–737. Made public: 1997. See [[cal.1961-07-17.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09.china-leadership-8
      when: Sept.
      date: 1961-09
      thread: china-leadership
      c: 'The State Planning Commission Party group 国家计委党组 draws up "Some rules for improving planning work" 《关于改进计划工作的几项规定》: against the Leap''s long front, scattered power, changing plans and weak balancing; the state plan''s authority and discipline to be strengthened.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 744–754. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-08.china-leadership-9
      when: Nov. 8
      date: '1961-11-08'
      thread: china-leadership
      c: 'The Organization Department 中央组织部 reports to the Center 中共中央 "On strengthening the education and management of Party members" 《关于加强对党员的教育管理工作的报告》: at the end of June 1961 the Party had 17.38 million members in 1.33 million basic organizations, 6.42 million members added since 1958; nearly all of the 720,000 brigades with a basic organization.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 807–814. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-09.china-leadership-4
      when: Nov. 9
      date: '1961-11-09'
      thread: china-leadership
      c: 'Deng Zihui 邓子恢 reports to the Center 中共中央 and the Chairman, copied to the East China Bureau 华东局 and the Fujian 福建 committee, on the trials of the basic accounting unit 《关于农村人民公社基本核算单位试点情况的调查报告》: since reaching Longyan 龙岩 on Oct. 28 his work groups have tried it at Houtian 后田, Dengji 邓计 and other brigades and at Beicun 北村 brigade of Xinquan 新泉, Liancheng 连城; cadres and members for handing the unit down; the teams made smaller.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 799–803 (printed after the Center''s comment of Nov. 23). Made public: 1997. See [[cal.1961-10-24.china-leadership-6]]. Sent on: [[cal.1961-11.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
