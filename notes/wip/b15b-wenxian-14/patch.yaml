      when: Dec. 10
      date: '1960-12-10'
      thread: china-leadership
      c: Nie Rongzhen 聂荣臻 reports to Zhou Enlai 周恩来 on the line for science and technology work in 1961 and 1962, and sends his written outline to Li Fuchun 李富春.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 109 (Nie''s report of Jan. 7, 1961: Zhou and Li agreed, Zhou revising the outline). Made public: 1997. Names: Nie Rongzhen, Zhou Enlai, Li Fuchun.'
      tags:
