      when: Dec. 17
      date: '1960-12-17'
      thread: china-leadership
      c: 'With the Center''s 中共中央 approval, the forum of the provincial science secretaries 各省、市、自治区科学书记座谈会 meets, after a meeting of the local science commissions'' heads: the secretaries and the vice-ministers in charge of science discuss Nie Rongzhen''s 聂荣臻 outline and agree to its line, tasks and methods.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 109 (Nie''s report of Jan. 7, 1961). Made public: 1997. See [[cal.1960-12-10.china-leadership-5]]. Names: Nie Rongzhen.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:nie-rongzhen
