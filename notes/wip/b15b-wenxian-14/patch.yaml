    at: XIV, 300–315
- cite:
    id: cal.1961-04-15.china-leadership-5
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–301 (Mao''s comment, signed the morning of Apr. 15, printed in full in the Center''s forwarding of Apr. 26)'
- cite:
    id: cal.1961-04-10.china-leadership-6
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 310–315 (the investigation group''s report of Apr. 10, printed in full among the four enclosures to Hu Qiaomu''s letter of Apr. 14, which the Center forwarded Apr. 26)'
- cite:
    id: cal.1961-05-06.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317 (the letter printed in full, signed May 6, at Shanghai, to Li Jingquan for Chen Zhengren and to the first secretaries of the bureaus and provinces: the Center''s list of subjects for inquiry sent Apr. 25, its notice of May 4 putting the meeting off to May 20; each first secretary to spend the half-month in the villages and write to him; the note quotes the notice of Apr. 25)'
- cite:
    id: cal.1961-04-25.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 317 n.1 (the Center''s notice of Apr. 25 calling the work conference for mid-May, quoted: the mess halls, grain, the supply system, the hills and woods, fuel hills for the peasants, "three guarantees and one reward", draught animals and tools to brigade or team, rectification and restitution in the first- and second-class counties, communes and brigades, handicrafts and the supply and marketing cooperatives, to be studied at points for ten to fifteen days)'
- cite:
    id: cal.1961-05-07.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 (Zhou Enlai''s telephone report from the Handan 邯郸 district of May 7, printed from *Zhou Enlai xuanji*, II, as "On the inquiry into the mess halls, work points and other questions" 《关于食堂和评工记分等问题的调查》: three days of reports at Handan, then five days at Boyan 伯延 commune, Wu''an 武安 county; nearly all members, women and single men too, want to cook at home; members against the supply system, for keeping the "five guarantee" households; the work-point system of the higher cooperatives wanted back; the note: Mao forwarded it May 7 to the bureaus and committees)'
- cite:
    id: cal.1961-05-09.china-leadership-7
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320–323 (Mao''s comment, 3 a.m., May 9, at Shanghai, and Hu Qiaomu''s letter, 11 a.m., May 8, at Changsha, printed in full: the investigation group and the Hunan committee have proposed changes to the Sixty Articles; Hu, Wang Li and others to Liuyang 浏阳 to see the new handicraft cooperatives; Tao Zhu to Taoyuan 桃源)'
- cite:
    id: cal.1961-05-13.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331 (Mao''s comment of May 13 and the letter of Deng Xiaoping and Peng Zhen of May 10, printed in full: five investigation groups in Shunyi and Huairou and the Peking committee''s work groups, over a month; the size of communes and brigades, the supply system, grain procurement, "three guarantees and one reward", work points, the mess halls and ownership)'
- cite:
    id: cal.1961-05-10.china-leadership-9
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331 (the letter printed in full, with Mao''s comment of May 13 sending it to the bureaus and committees for reference)'
- cite:
    id: cal.1961-05-14.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336 (Mao''s comment, May 14, at Tianjin, and Zhang Pinghua''s letter of May 13, printed in full: Zhang and an investigation group at Dajiang 大江 brigade, Wenjiashi 文家市 commune, Liuyang 浏阳, from May 2; Mao: the letter to go to every prefectural, city and county committee in Hunan; policy to be made with the masses; no Party committee to make policy shut indoors without inquiry)'
- cite:
    id: cal.1961-05-16.china-leadership-12
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 337–346 (printed as "Speed up the nitrogen fertilizer industry" 《加速发展氮肥工业》, from *Chen Yun wenxuan*, III; the note: the report Chen Yun drafted May 16 for the Center''s Fertilizer Small Group, first titled "Report on speeding the development of the nitrogen fertilizer industry"; the Hangzhou forum of Apr. 4–10)'
- cite:
    id: cal.1961-08-11.china-leadership-7
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 346 n.1 (the Center''s comment of Aug. 11 quoted in full: sent to the bureaus, the provincial committees and the Party groups of the Planning and Economic Commissions and the Chemical Industry Ministry; the Center agrees with the report''s line of building large nitrogen plants; how many a year, for the Planning Commission in its plans for 1961–62 and the long term; equipment to be made at home and the needed materials imported)'
- add:
    entry:
      id: cal.1961-04-30.china-leadership-11
      when: Apr. 30
      date: '1961-04-30'
      thread: china-leadership
      c: The Center 中共中央 forwards the report of the Party groups of the State Planning Commission 国家计委, the State Economic Commission 国家经委 and the Ministry of Finance 财政部, "On swiftly clearing and reallocating the equipment and materials left by stopped and deferred projects" 《关于迅速清理和调剂使用停建、缓建项目结存的设备、材料的报告》.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 353 (named, with its date, in the measures for stopped projects of May 19 that the Center approved May 25: their equipment to be dealt with by it). Made public: 1997. To check: the report and the Center''s comment of Apr. 30, 1961 (named at [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 353).'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-18.china-leadership-10
      when: May 18
      date: '1961-05-18'
      thread: china-leadership
      c: 'The Center 中共中央 forwards, and agrees with, the Ministry of Labor Party group''s 劳动部党组 proposal of Apr. 13, "On setting up and improving the system of fixed staff and fixed quotas in the rectification of enterprises" 《关于企业整风中建立和健全定员定额制度的建议》: to be done first in the key enterprises, while the rectification lasts, and the experience spread.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 347–349 (the Center''s comment, May 18, and the proposal, Apr. 13; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-13.china-leadership-11]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-25.china-leadership-8
      when: May 25
      date: '1961-05-25'
      thread: china-leadership
      c: 'The Center 中共中央 approves the "Measures for dealing with stopped projects" 《关于停建项目的处理办法》 that the Party groups of the State Planning Commission 国家计委 and the Ministry of Finance 财政部 proposed on May 19, to be carried out: the men, equipment and materials of stopped projects to go to the building in the state plan, the work done by the end of June; the cities over-full, most of their people, technicians apart, to be sent back to farm in the villages.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 350–355 (the Center''s comment, May 25, and the measures, May 19; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-05-19.china-leadership-8]], [[cal.1961-04-09.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-05-31.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 (printed as "The causes of the present economic difficulties and the way to overcome them" 《当前经济困难的原因及其克服的办法》, from *Liu Shaoqi xuanji*, II: every contradiction now shows in grain; the Hunan peasants'' "three parts natural disaster, seven parts man-made"; Tao Lujia for Shanxi, and Hebei, Shandong and Henan, put the errors of work first; the Center to take responsibility)'
- cite:
    id: cal.1961-05-31.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 (printed as "Mobilize the urban population to go to the countryside" 《动员城市人口下乡》, from *Chen Yun wenxuan*, III; the note: his speech to the Central Work Conference)'
- cite:
    id: cal.1961-06-13.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 375–377 (the record of the talk with Sukarno printed in part as "China can have only one representative in the United Nations" 《中国在联合国只能有一个代表》, from [[w.mao-zedong-waijiao-wenxuan]]: while Chiang Kai-shek''s representative is in the United Nations China will not enter; "we have waited eleven years"; Sukarno gives the two views abroad, China and Taiwan in as one, or China in first and Chiang''s man expelled after; the note on West Irian)'
- cite:
    id: cal.1961-06-15.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 378–384 (the Center''s directive of June 15 on discussing and trying out the revised draft 《关于讨论和试行〈农村人民公社工作条例（修正草案）〉的指示》, printed in full: the draft of Mar. 22 discussed and tried; the work conference of late May to early June revised it; the revised draft to be read and explained to every Party member and commune member in the slack seasons; every Party committee to make investigation a regular system of work)'
- cite:
    id: cal.1961-06-15.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 385–411 (the "Working Regulations for the Rural People''s Communes (Revised Draft)" 《农村人民公社工作条例（修正草案）》, June 15, printed in full: three levels, commune, brigade and team; ownership at three levels, the brigade''s the base; the brigade the basic accounting unit; the note gives the changes from the March draft: whether a team runs a mess hall for its members to decide, rations distributed to households; the supply and wage parts of distribution, three to seven, dropped, all by work points; most hills and woods fixed to the teams, small patches to teams and members; the "Three Main Rules and Eight Points" for cadres added; the revised draft approved by Mao June 15, 224 n.1)'
- cite:
    id: cal.1961-06-17.china-leadership-4
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 378–384 (the directive as issued, dated June 15: every Party committee to make investigation and study a regular system of work)'
- cite:
    id: cal.1961-06-16.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 412–415 (the "Nine measures of the Central Work Conference on reducing the town population and cutting grain sales in the towns" 《中央工作会议关于减少城镇人口和压缩城镇粮食销量的九条办法》, approved by the Center June 16, printed in full: the towns may only lose people, never gain; from the base of 129 million town people at the end of 1960; to restore farming within three years; some matters left to the work conference of August)'
- cite:
    id: cal.1961-06-18.china-leadership-4
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 416–418 (the urgent directive, dated June 16, printed in full: from now to the end of July, a month and a half, a full count of the people and grain supply of the towns, chiefly the 183 large and medium cities; one ration a person, rations by labor and age, collective households first)'
- variant:
    id: cal.1961-06-18.china-leadership-4
    unit: A
    witness: w.jianguo-yilai-zhongyao-wenxian
    reads: June 16 (一九六一年六月十六日), the urgent directive's own date
    at: XIV, 416
- add:
    entry:
      id: cal.1961-06-17.china-leadership-7
      when: June 17
      date: '1961-06-17'
      thread: china-leadership
      c: 'The Center 中共中央 forwards for reference the Propaganda Department''s 中央宣传部 report of May 19, "On the teaching line of the liberal arts in the higher schools and the compiling of textbooks" 《关于高等学校文科教学方针和教材编选工作的报告》: textbooks a key to settled teaching and better quality; the Party committees of the regions charged with writing them to supply men and means.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 419–428 (the Center''s comment, June 17, and the report, May 19; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-05-19.china-leadership-9]], [[cal.1961-04-11.china-leadership-11]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-11.china-leadership-11
      when: Apr. 11
      date: '1961-04-11'
      place: peking
      thread: china-leadership
      c: 'Peking 北京. The Propaganda Department 中央宣传部, with the Ministries of Education 教育部 and Culture 文化部, opens the conference on the plan for compiling textbooks for the liberal arts and the art schools of the higher schools, to Apr. 25: 298 old teachers, experts, young teachers, presidents and branch secretaries and provincial propaganda and education men, a third of them outside the Party. Zhou Yang 周扬 reports at the opening; Lu Dingyi 陆定一 and Kang Sheng 康生 hold forums with experts outside the Party; Lu speaks at the close.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 420 (the Propaganda Department''s report of May 19). Made public: 1997. Names: Lu Dingyi, Kang Sheng.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:lu-dingyi
      - name:kang-sheng
- cite:
    id: cal.1961-06-19.china-leadership-11
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 429–435 (printed in full: since the urgent directive letter of Nov. 3, 1960 and the work conference''s minutes of Jan. 20 the restitution of transferred goods far from thorough; every Party organization to make up its mind to repay in full)'
- cite:
    id: cal.1961-06-19.china-leadership-4
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 436–449 (the "Provisions on some policy questions of handicrafts in town and country (trial draft)" 《关于城乡手工业若干政策问题的规定（试行草案）》, printed in full: three kinds of ownership through the socialist stage, the whole people''s, the collective and individual under the socialist economy''s lead, the collective the main one)'
- cite:
    id: cal.1961-06-19.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 450–461 (the "Provisions on improving commercial work (trial draft)" 《关于改进商业工作的若干规定（试行草案）》, printed in full: socialist commerce the bridge between the whole people''s and the collective economy, industry and farming, production and consumption; the line "develop the economy, ensure supply")'
- cite:
    id: cal.1961-06-19.china-leadership-5
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 462–490 (the speech printed in full from *Zhou Enlai xuanji*, II: not enough democratic style; many dare not think, speak or act, though Mao called for daring at Nanning in 1958)'
- add:
    entry:
      id: cal.1961-06-23.china-leadership-10
      when: June 23
      date: '1961-06-23'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Finance Ministry Party group''s 财政部党组 report of June 17, "On adjusting the burden of the agricultural tax" 《关于调整农业税负担的报告》, to be carried out. The report: the tax not cut for the poor harvests of 1959 and 1960; the real burden, tax and local surcharge, to average no more than 10 percent of farm income, the old "tithe"; for 1961 about 24 billion jin of fine grain, 9.14 percent of the 262 billion jin of contracted output, the regular tax 21.76 billion and the surcharge 2.18 billion, the surcharge cut from 15–30 percent of the tax to no more than 10. The comment: the heavy burden of the high-yield grain areas to be put right county by county.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 491–495 (the Center''s comment, June 23, and the report, June 17; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-06-17.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-26.china-leadership-6
      when: June 26
      date: '1961-06-26'
      thread: china-leadership
      c: 'The Center 中共中央 issues its "Provisions on some policies for fixing forest rights, protecting hills and woods and developing forestry (trial draft)" 《关于确定林权、保护山林和发展林业的若干政策规定（试行草案）》: natural forests and the hills made state property before the communes stay the state''s; the woods of the higher cooperatives stay the brigades'', teams'' and members''; trees planted since, "who plants, owns"; ownership fixed for the life of the trees, the boundaries marked.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 496–504 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-06-02.china-leadership-4]], [[cal.1961-06-09.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-06-28.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 505–510 (the "Notice on some questions in the work of cutting staff" 《关于精减职工工作若干问题的通知》, printed in full: to supplement the nine measures; those to go chiefly the new staff from the villages who joined since January 1958, temporary and contract workers among them)'
- cite:
    id: cal.1961-07-16.china-leadership-7
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 511–513 (the "Decision on some questions of strengthening the building of the atomic energy industry" 《关于加强原子能工业建设若干问题的决定》, printed in full: to break through atomic technique by its own efforts, the front shortened; the Second Ministry of Machine Building 二机部 to receive 86 senior scientists and engineers, 14 factory and mine heads and Party secretaries, 60 division and 18 section cadres, by the Organization Department before October; specialties at Xi''an Jiaotong University and the East China Institute of Technology at Shanghai; a radiation health bureau in the Health Ministry; all the ministry''s goods carried as military freight)'
- cite:
    id: cal.1961-07-19.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 514–570 (the Center''s comment, July 19, agreeing with Nie Rongzhen''s report of June 20 "On some policy questions in present natural science work" 《关于当前自然科学工作中若干政策问题的请示报告》 and the Fourteen Points of the Party groups of the Science and Technology Commission and the Academy of Sciences, 《关于自然科学研究机构当前工作的十四条意见（草案）》, all printed in full; the report''s chief points to be explained to those outside the Party by the heads of each unit)'
- add:
    entry:
      id: cal.1961-08-17.china-leadership-12
      when: Aug. 17
      date: '1961-08-17'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the United Front Department''s 中央统战部 report of Aug. 4, "Opinions on continuing the policy of placing the bourgeoisie in the organs, the enterprises and the urban people''s communes" 《关于在机关、企业和城市人民公社等方面继续贯彻对资产阶级人们的安排政策的意见》. Its comment: the posts of democratic personages and of the private staff of joint state-private enterprises not to be lightly changed; none removed or demoted except for breaking the law; the able may be promoted; none to be cut as a bundle in the streamlining, and those sent down to temper themselves long ago brought back; no rectification of democratic personages and businessmen in the present campaign.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 571–575 (the Center''s comment, Aug. 17, and the report, Aug. 4; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-08-04.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-09-15.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 576–607 (the Center''s directive of Sept. 15 on discussing and trying out the draft "Provisional Working Regulations for the Higher Schools directly under the Ministry of Education" 《关于讨论和试行教育部直属高等学校暂行工作条例（草案）的指示》, printed in full with the regulations: approved by the Center in principle; to be discussed and tried in the ministry''s twenty-six schools, discussed elsewhere, the provinces and ministries to decide whether to try it)'
- cite:
    id: cal.1961-09-15.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 608–612 (the Center''s "Decision on training cadres in rotation" 《关于轮训干部的决定》, Sept. 15, printed in full: on Mao''s proposal at the June work conference, all leading cadres of the Party to pass in turn through short training classes, to learn the laws of socialist construction and overcome "right" and "left" errors)'
- cite:
    id: cal.1961-09-15.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 613–635 (the Center''s "Directive on present problems of industry" 《关于当前工业问题的指示》, Sept. 15, printed in full: the main targets of the second five-year plan reached early in the three years of the leap)'
- cite:
    id: cal.1961-09-16.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 636–681 (the Center''s directive of Sept. 16 on discussing and trying out the draft "Working Regulations for State Industrial Enterprises" 《关于讨论和试行〈国营工业企业工作条例（草案）〉的指示》, printed in full with the regulations: drafted in a short time, incomplete; to be discussed in the central and local state enterprises and tried at points, the views reported to the Center by mid-November, the bureaus to report on the trials by late November)'
- add:
    entry:
      id: cal.1961-09-16.china-leadership-8
      when: Sept. 16
      date: '1961-09-16'
      thread: china-leadership
      c: 'The Center 中共中央 forwards Li Xiannian''s 李先念 report of Sept. 6 to the Chairman and the Center, "On the market, prices and the circulation of currency" 《关于市场、物价和货币流通问题的报告》, "most secret": its spirit only to be passed on, no figures, no reprinting. The report: too much money, too few goods, some prices up; currency in circulation 9.5 billion yuan at the end of 1960, 11 billion on Sept. 5, 1961, about 12.5 billion expected by the end of the year; a yuan in circulation buys 4.5 yuan of goods, against 8 or 9 when the market was stable. The comment: the high prices for some farm products a temporary measure, held tight by the provinces.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 682–701 (the Center''s comment, Sept. 16, and the report, Sept. 6, after a typical inquiry into 526 households of staff in 13 cities and a forum on prices; the notes give the State Statistical Bureau''s first estimates for 1961, the gross output of industry and farming 142 billion yuan, about 1957''s, and the currency issued year by year, 701 nn.1–2; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-09-06.china-leadership-9]]. Names: Li Xiannian.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-xiannian
- cite:
    id: cal.1961-09-29.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 704–711 (the letter printed in full from the manuscript, signed 8 a.m., Sept. 29; the notes give the papers he sent: Geng Changsuo''s letter of Dec. 30, 1960 to Tan Zhenlin; the Shandong rural work department''s forum views on the commune system; the Hubei committee''s report of Sept. 25; the Handan forum record of Sept. 27; five Hebei papers; Tao Zhu''s Lixi brigade report of Mar. 15, on which Mao had commented; the meeting he proposes, held at Peking Dec. 20, 1961–Jan. 10, 1962)'
- cite:
    id: cal.1961-09-26.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 740–743 (the "Record of the Handan talk" 《邯郸谈话会记录》, dated Sept. 27, printed in full as an attachment to the Center''s directive of Oct. 7: Liu Zihou 刘子厚, Wang Luming 王路明, Kang Xiumin 康修民, Pang Jun 庞均, Hu Kaiming 胡开明, Liu Qi 刘琦 and Li Yuenong 李悦农 of Hebei; Zhou Xing 周兴 and Cheng Huairen 程怀仁 of Shandong)'
- variant:
    id: cal.1961-09-26.china-leadership
    unit: A
    witness: w.jianguo-yilai-zhongyao-wenxian
    reads: Sept. 27 (一九六一年九月二十七日), the date of the Handan forum's record, and of the forum Mao called, as the notes give it
    at: XIV, 740, 708 n.4
- add:
    entry:
      id: cal.1960-12-30.china-leadership-8
      when: Dec. 30
      date: '1960-12-30'
      thread: china-leadership
      c: 'Geng Changsuo 耿长锁, head of Wugong 五公 commune, Shen county 深县, Hebei 河北, writes Tan Zhenlin 谭震林: the commune''s output in 1960 more than 50 percent below 1959, by man as well as by nature: low crops on waterlogged land, sweet potatoes after the wheat at the cost of the fields; procurement raised again and again, rations cut. The members ask that procurement go by standard mu, not by estimates in the field, more grown not more taken; "four contracts and one reward" for the small teams; the movement of draught animals freed.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 706 n.1 (the letter summarized; one of the papers Mao sent the Standing Committee Sept. 29, 1961). Made public: 1997. Sent on: [[cal.1961-09-29.china-leadership]]. Names: Tan Zhenlin.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:tan-zhenlin
      - ok:fields-place
- add:
    entry:
      id: cal.1961-03.china-leadership-31
      when: Mar.
      date: 1961-03
      thread: china-leadership
      c: 'The Shandong 山东 committee''s rural work department 农村工作部 holds four forums on the commune system: county and commune men want the big counties and communes cut down; the small teams want all income, after the state''s quotas and the reserve grain, theirs to divide. Concealed output, theft and slack work spring from the brigade''s pooled distribution among unequal teams; the accounting unit should be the unit that produces, a team of fifty or sixty households, its small groups about ten.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 706–707 n.2 (the department''s "Forum views on the system of the rural people''s communes" 《关于农村人民公社体制问题的座谈意见》, summarized; dated March 1961 in Mao''s letter of Sept. 29, 704). Made public: 1997. Sent on: [[cal.1961-09-29.china-leadership]]. Check: the day; the views were printed Mar. 17 in the department''s *Nongcun gongzuo qingkuang* 农村工作情况 no. 5, by the *Wengao*''s note as registered (x.1961-03.shandong-provincial-committee-rural-work-department-symposium-on-commune-structure; [[w.jianguo-yilai-mao-zedong]], XV, 530 n.2).'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-03.china-leadership-32
      when: Mar., late
      date: 1961-03
      at: before 1961-03-21
      thread: china-leadership
      c: The Zhangjiakou 张家口 prefectural committee approves a trial of the "big contract" in distribution at Guoleizhuang 郭磊庄 brigade, Guoleizhuang commune, Huai'an 怀安 county.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the committee''s report of Aug. 25, 1961). Made public: 1997. The report: [[cal.1961-08-25.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-08-12.china-leadership-13
      when: Aug. 12
      date: '1961-08-12'
      thread: china-leadership
      c: 'The Xiaogan 孝感 prefectural committee''s work group reports its inquiry into Jinxiu 锦绣 brigade, Wuchang 武昌 county, Hubei 湖北, trying the production team as the basic accounting unit: "three contracts and one reward" dropped, the team keeping its income after its share to the brigade.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (sent with the Hubei committee''s report of Sept. 25). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-08-17.china-leadership-13
      when: Aug. 17
      date: '1961-08-17'
      thread: china-leadership
      c: 'The Hebei 河北 committee''s work group reports to the committee on the "big contract" in distribution 分配大包干 in the Baoding 保定 district: the brigade fixes its deductions for the year, part to be handed up at a fixed share and the state''s quota apportioned alike; the rest of each team''s income the team divides, more earned more kept. Simpler than "three contracts and one reward" and fairer, the members and cadres for it.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 708–709 n.5 (the first of the five Hebei papers Mao sent the Standing Committee Sept. 29, with inquiry materials on brigades of Tang county and the Baoding district). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-08-18.china-leadership-12
      when: Aug. 18
      date: '1961-08-18'
      thread: china-leadership
      c: The Hebei 河北 committee's work group gives its brief account of the "big contract" in distribution at Zhangxiankou 张显口 brigade, Tonglong 峒龙 commune, Tang 唐 county.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the third of the five Hebei papers). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-08-25.china-leadership-8
      when: Aug. 25
      date: '1961-08-25'
      thread: china-leadership
      c: 'The Zhangjiakou 张家口 prefectural committee reports to Liu Zihou 刘子厚, the Hebei 河北 committee''s acting first secretary, on the trial of the "big contract" in distribution: at Guoleizhuang 郭磊庄 brigade, Huai''an 怀安 county, grain this year 889,467 jin, 26.93 percent up on last year, collective income 21.2 percent up; the members want the contracts renewed, for three years at least.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the fourth of the five Hebei papers). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-09-08.china-leadership-10
      when: Sept. 8
      date: '1961-09-08'
      thread: china-leadership
      c: 'The Baoding 保定 prefectural committee reports to the Hebei 河北 committee on the "big contract" in distribution found in some brigades while the Sixty Articles were carried down: where it is used the "five winds" are slight, output rises year by year; it gives the team more economic power and avoids levelling between teams, within the three-level ownership based on the brigade.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the second of the five Hebei papers). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-09-25.china-leadership-9
      when: Sept. 25
      date: '1961-09-25'
      thread: china-leadership
      c: 'The Hubei 湖北 committee asks the Central-South Bureau, and through it the Center and Mao, to try the production team as the basic accounting unit: with the brigade as the unit the levelling between poor and rich teams cannot be solved; trials by the Xiaogan 孝感 prefectural and Jingmen 荆门 county committees since the June three-level conference show it raises the teams'' and members'' zeal; the committee finds the case sound.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (the report summarized, with the Xiaogan work group''s report of Aug. 12 on Jinxiu brigade and the Jingmen work group''s material on Jinshan 金山 brigade). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-10-05.china-leadership-17
      when: Oct. 5
      date: '1961-10-05'
      thread: china-leadership
      c: 'The Shandong 山东 committee reports on "three contracts and one reward", after a forum of the prefectural and city first secretaries: since the Canton conference, with the brigade the accounting unit and pooling, levelling between teams and concealed output; the three contracts do not hold. All but Yantai 烟台 prefecture find handing the accounting unit down to the team inevitable.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 742–743 n.3 (one of the two Shandong papers the Center sent with its directive of Oct. 7). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- cite:
    id: cal.1961-10-07.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 738–743 (the directive printed in full, with the Handan record of Sept. 27 attached; sent with five Hebei papers, the Hubei report of Sept. 25 and its two enclosures, two Shandong papers and the Guangdong investigation group''s report of March on the Lixi brigade)'
- cite:
    id: cal.1961-10-04.china-leadership-4
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (the Hubei committee''s report of Sept. 25 summarized)'
- cite:
    id: cal.1961-03-16.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 710 n.11 (Tao Zhu''s report of Mar. 15, on which Mao wrote his comment: the Lixi brigade, Dali commune, Nanhai county, after rectification fixes each team''s quota to the brigade, the teams keeping all above it)'
- cite:
    id: cal.1961-07-17.china-leadership-10
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 714 (the State Planning Commission''s national planning conference, July 17–Aug. 12, as its report of Sept. 29 gives it)'
- add:
    entry:
      id: cal.1961-10-06.china-leadership-12
      when: Oct. 6
      date: '1961-10-06'
      thread: china-leadership
      c: 'The Center 中共中央 agrees in the main with the State Planning Commission Party group''s 国家计委党组 report of Sept. 29, "On the supplementary plan (control figures) for the last two years of the second five-year plan" 《关于第二个五年计划后两年补充计划（控制数字）的报告》, and sends it down: the regions, offices and ministries to draft their 1962 plans from below, by Nov. 15. The report, after the national planning conference of July 17–Aug. 12 and the Lushan conference: steel this year about 8.5 million tons, in 1962 7.5 million; pig iron 12 and 10.7 million.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 712–737 (the Center''s comment, Oct. 6, and the report, Sept. 29; the tables left out, 737 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-09-29.china-leadership-9]], [[cal.1961-07-17.china-leadership-10]], [[cal.1961-10-05.china-leadership-3]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-10-07.china-leadership-11
      when: Oct. 7
      date: '1961-10-07'
      thread: china-leadership
      c: The Center 中共中央 agrees in principle with the State Planning Commission Party group's 国家计委党组 "Some rules for improving planning work" 《关于改进计划工作的几项规定》 of September, to be sent to the planning organs at every level and tried.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 744–754 (the Center''s comment, Oct. 7, and the rules, September 1961; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-09.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-28.china-leadership-3
      when: Oct. 28
      date: '1961-10-28'
      thread: china-leadership
      c: 'The Center 中共中央 forwards, and agrees with, the report of Sept. 27 of the United Front 中央统战部, Organization 中央组织部 and Propaganda 中央宣传部 Departments on the national conference on remolding rightists 《关于全国改造右派分子工作会议的报告》. Its directive: the bourgeois rightists, though handled as an internal matter, stand in an antagonistic contradiction with the working people; the united front departments now in charge of them; labels removed by the standard of 1959, "those who qualify, removed", leniency meaning a batch of those who nearly qualify too. The report: about 100,000 labels removed in 1959 and 1960; over 80 percent of the rest behave well or fairly well; but many units treat them roughly, as if under control or in labor camps, beat and insult them, and discriminate against their families.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 755–762 (the Center''s directive, Oct. 28, and the report, Sept. 27; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-09-27.china-leadership-9]], [[cal.1961-08-28.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-28.china-leadership-6
      when: Aug. 28
      date: '1961-08-28'
      thread: china-leadership
      c: The national conference on the work of remolding rightists 全国改造右派分子工作会议 opens, to Sept. 11, with cadres of the Center's regional bureaus and of the provinces.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 756 (the departments'' report of Sept. 27). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-09-11.china-leadership-6
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 756 (the conference, Aug. 28–Sept. 11, as the departments'' report of Sept. 27 gives it)'
- add:
    entry:
      id: cal.1961-11-08.china-leadership-8
      when: Nov. 8
      date: '1961-11-08'
      thread: china-leadership
      c: 'The Center 中共中央 decides to set up the National Defense Industry Office 国防工业办公室 as a "line" of the State Council, answering in the Party to the Secretariat and the Military Commission, to manage the work of the Second and Third Ministries of Machine Building 二机部、三机部 and the National Defense Science Commission: conventional arms, the "sophisticated" weapons, research, cadres, production and building planned as one. Luo Ruiqing 罗瑞卿 its director; the five-man group on the sophisticated weapons 国防尖端五人小组, set up in May, abolished.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 763–764 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-10-06.china-leadership-9]]. Names: Luo Ruiqing.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:luo-ruiqing
- cite:
    id: cal.1961-11-14.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 765–771 (the "Directive on socialist education in the villages" 《关于在农村进行社会主义教育的指示》, dated Nov. 13, printed in full: the villages better this year than last, the autumn harvests mostly above last year''s, sidelines and handicrafts restored, pigs and poultry growing; the Sixty Articles to be carried further)'
- variant:
    id: cal.1961-11-14.china-leadership-2
    unit: A
    witness: w.jianguo-yilai-zhongyao-wenxian
    reads: the directive dated Nov. 13 (一九六一年十一月十三日)
    at: XIV, 765
- add:
    entry:
      id: cal.1961-11-17.china-leadership-8
      when: Nov. 17
      date: '1961-11-17'
      thread: china-leadership
      c: The Center 中共中央, replying to the Military Commission and the General Political Department 总政治部, approves the four regulations the army political work conference adopted, for the company political instructor, the company Party branch, the Youth League branch and the revolutionary soldiers' committee, with Xiao Hua's 肖华 report on carrying out the enlarged Military Commission's resolution and the "four-good companies", and the conference's report of Nov. 10. The army's political work this past year has done well; the deviations of a time are in the main put right.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 772–794 (the Center''s reply, Nov. 17, the conference''s report to the Military Commission and the Center, Nov. 10, and the four regulations; Xiao Hua''s report left out, 794 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-11-10.china-leadership-4]], [[cal.1961-10-18.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-18.china-leadership-6
      when: Oct. 18
      date: '1961-10-18'
      place: peking
      thread: china-leadership
      c: 'Peking 北京. The General Political Department 总政治部 opens the all-army political work conference 全军政治工作会议, to Nov. 4: 184 political department heads of the military regions, services, arms and higher schools, the army-level political commissars and some divisions'', on the enlarged Military Commission''s resolution on political work, the "four-good companies" and the companies'' political work.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 773 (the conference''s report of Nov. 10). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-11-01.china-leadership-5
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 773 (the all-army political work conference, Oct. 18–Nov. 4, in Peking, as its report of Nov. 10 gives it)'
- add:
    entry:
      id: cal.1961-11-23.china-leadership-7
      when: Nov. 23
      date: '1961-11-23'
      thread: china-leadership
      c: 'The Center 中共中央 issues its "Directive on timber production and afforestation" 《关于木材生产和造林问题的指示》: timber in 1961 and the plan for 1962, 24.5 million cubic meters, below the average of 1958–60, 40.73 million; pit props, sleepers and paper wood short, coal and paper down with them, rotten sleepers slowing the trains.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 795–797 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-11-23.china-leadership-5]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-11.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 798–803 (the Center''s comment of Nov. 23, "very good", to go down to the prefectures, counties and communes for reference; each provincial first secretary to spend ten days in the villages by Deng''s method before Dec. 20; and Deng Zihui''s report of Nov. 9, from Longyan, to the Center and the Chairman, printed in full: trials at Baitu, Houtian and other brigades and at Beicun, Lianchenger; cadres and masses all for handing the accounting unit down)'
- add:
    entry:
      id: cal.1961-10-24.china-leadership-6
      when: Oct. 24–28
      date: '1961-10-24'
      place:
      - peking
      - longyan
      thread: china-leadership
      c: Deng Zihui 邓子恢 leaves Peking 北京 for the south; at Zhengzhou 郑州 and Nanchang 南昌 he hears the Henan and Jiangxi rural work departments on the trials of the basic accounting unit; he reaches Longyan 龙岩, Fujian, the evening of Oct. 28.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 799 (his report of Nov. 9). The words: 二十八日晚 (799). Made public: 1997. His report: [[cal.1961-11-09.china-leadership-4]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-time
- cite:
    id: cal.1961-11-23.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 804–805 (Deng Xiaoping''s speech at the Secretariat on the metallurgical industry''s seven-year plan, printed from *Deng Xiaoping wenxuan*, I, as "Promote young technical cadres in large numbers" 《大批提拔年轻的技术干部》: too little care for technical cadres; graduates still trainees after years; promote men in their twenties and thirties)'
- add:
    entry:
      id: cal.1961-11-26.china-leadership-2
      when: Nov. 26
      date: '1961-11-26'
      thread: china-leadership
      c: 'The Center 中共中央 agrees with the Organization Department''s 中央组织部 report of Nov. 8, "On strengthening the education and management of Party members" 《关于加强对党员的教育管理工作的报告》: with the cadres taught afresh, the members too; no large intake of new members, quality first. The report: at the end of June 1961 the Party had 17.38 million members in 1.33 million basic organizations; 6.42 million members and 500,000 organizations added since 1958.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 806–814 (the Center''s comment, Nov. 26, and the report, Nov. 8; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-11-08.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-05.china-leadership-7
      when: Dec. 5
      date: '1961-12-05'
      thread: china-leadership
      c: The Center 中共中央, answering the Northeast Bureau's 东北局 telegram, agrees that Shenyang 沈阳 may take 5 percent of the profits of its state industry, retail trade and public utilities as funds for city building, on trial from 1962; railways, posts, banks and first-grade wholesale stations excepted; the money for water, drains, roads, bridges, flood works, city buses and gas.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 815–816 (to the Northeast Bureau and the Planning Commission, the Finance Ministry and the Ministry of Building; printed from the Central Committee''s document). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-12-06.china-leadership-6
      when: Dec. 6
      date: '1961-12-06'
      thread: china-leadership
      c: 'The Center 中共中央 approves and forwards the "Minutes of the first nationalities work conference of the Northwest" 《西北地区第一次民族工作会议纪要》 the Northwest Bureau 西北局 sent Oct. 30: the experience of the Tibetan areas of Qinghai 青海 and Gansu 甘肃 shows again that to neglect the nationalities question in the socialist revolution and construction is wrong. The minutes: grave errors in the Qinghai and Gansu Tibetan areas since 1958; Han chauvinism; the pastoral communes to be small, set up by the old tribes, the team the accounting unit; Tibetans who still hold some religious belief may be admitted to the Party there, by the Center''s reply of Feb. 14.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 817–844 (the Center''s comment, Dec. 6, and the minutes, Aug. 4; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-08-04.china-leadership-7]], [[cal.1961-07-11.china-leadership-4]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-07-11.china-leadership-4
      when: July 11
      date: '1961-07-11'
      place: lanzhou
      thread: china-leadership
      c: 'Lanzhou 兰州. The Northwest Bureau 西北局 opens the first nationalities work conference of the Northwest, to Aug. 4: the pastoral areas and their communes since 1958, and the carrying out of the Party''s nationality and religious policies.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 819 (the conference''s minutes of Aug. 4). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-14.china-leadership-9
      when: Feb. 14
      date: '1961-02-14'
      thread: china-leadership
      c: 'The Center 中共中央 replies to the Tibet Work Committee''s 西藏工委 "Opinions on some questions of policy in building the Party in society" 《对社会上建党工作中一些带政策界限问题的意见》: Tibetan working people and revolutionary intellectuals who ask to join the Party may be admitted though they keep some religious belief and feeling, if otherwise fit, loyal and disciplined, and are then to be educated out of it.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 840–841 (named and its rule given in the Northwest minutes of Aug. 4, 1961). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1961-12-11.china-leadership-5
      when: Dec. 11
      date: '1961-12-11'
      thread: china-leadership
      c: The Center 中共中央 and the State Council 国务院 approve and issue the Ministry of National Defense's 国防部 "Regulations on militia work" 《民兵工作条例》 of July 13, and give notice that, as the Military Commission's militia work group has become its People's Armed Forces Committee 人民武装委员会, the militia work groups at the county level and above become people's armed forces committees, with committees set up under the Party committees of communes and large factories and mines.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 845–857 (the notice, Dec. 11, and the regulations, July 13; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-07-13.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-18.china-leadership-5
      when: Dec. 18
      date: '1961-12-18'
      thread: china-leadership
      c: 'The Center 中共中央 agrees with the Ministry of Water Conservancy and Electric Power Party group''s 水利电力部党组 report of Nov. 25, "On present water conservancy work" 《关于当前水利工作的报告》, and its ten points on water management: water and fertilizer still the means of more output for some years; the unfinished new works to be completed and matched, the resettled people''s problems settled, management strengthened. The report: irrigable land 240 million mu in 1949 and 450 million in 1957; over a billion counted in 1960, 670 million effective by the provinces'' first check.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 858–865 (the Center''s comment, Dec. 18, and the report, Nov. 25; the ten points left out, 865 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-11-25.china-leadership-7]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-02.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 168–179 (the Center 中共中央 forwards the Central Culture and Education Small Group''s 中央文教小组 report "On the arrangement of culture and education work in 1961 and for a period to come" 《关于一九六一年和今后一个时期文化教育工作安排的报告》 on Feb. 7, 1961, to be followed: rural students over sixteen held to about 2 percent of the rural labor force for three to five years, 172; quality first in higher education, 173; enrolment for 1961, higher schools 250,000, 90,000 fewer than in 1960; printed from the Central Committee''s document)'
- cite:
    id: cal.1961-01-18.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 182–187 (the Finance and Trade Office''s 财贸办公室 "Request for instructions on some questions of foreign trade in 1961" 《关于一九六一年对外贸易若干问题的请示报告》, Jan. 18, 1961, to the Center, printed in full: grain imports raised from 2.2 billion jin to 8 billion, the 1 billion jin for re-export apart, all from capitalist countries; the Center approved it Feb. 7)'
