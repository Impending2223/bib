      c: '*Renmin ribao* 人民日报, page 7, prints "Always be the masses'' pupil" 《永远要做群众的小学生》, quoting the fabricated "Chairman Mao comes to our pig farm" 《毛主席来到我们的养猪场》.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 219 (the Propaganda Department''s report of Feb. 23, 1961, which names it among the faults in the propaganda of Mao Zedong Thought). To check: *Renmin ribao*, Dec. 27, 1960, 7.'
