    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 13, 1961; [[w.macfarquhar-origins-of-the-cultural]], III, 49 (the Peking report of May 10, prepared by Deng Tuo); [[w.deng-xiaoping-nianpu-1904]], III, 1637 (May 13, 1961; Mao: "send this letter to the regional bureaus and the provincial, city and regional committees for reference"); [[w.mao-zedong-zhuan]], V, ch. 68 n.13 (May 13, Mao forwards Deng Xiaoping''s and Peng Zhen''s letter of May 10: five survey groups and the Peking committee''s working groups spent over a month at Shunyi and Huairou; the sizes of brigades and teams adjusted and the peasants'' zeal greatly raised). [[w.peng-zhen-nianpu-1902]], IV, 129 (May 13, 1961; Mao''s comment: send the letter to the regional bureaus and the provincial committees for reference). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the Deng nianpu (III, 1636–1637) gives Deng''s and Peng Zhen''s report of May 10 as a letter (致信), not a telephone report. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71a); [[w.zhongguo-gongchan-dang-liushi]], 484 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71b); [[w.peng-zei-huairou-diaocha]], passim, 25–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71c); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 492–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.72b); Deng Xiaoping 邓小平 and Peng Zhen 彭真, letter to Mao Zedong (original 原件), May 10, 1961, on the month''s survey at Shunyi and Huairou (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.13). Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
- edit:
    id: cal.1961-05-10.china-leadership-9
    base: 25de6b07
    set:
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1636–1637 (May 10, 1961); [[w.peng-zhen-nianpu-1902]], IV, 128–129 (May 10, 1961; a letter; the communes and teams near Peking adjusted, communes of about 10,000, brigades by village, teams of about fifty households; grain bought nine tenths of the contract and four tenths of the surplus; the supply system "带有平均主义性质，害处很多", aid only for the "five guarantee" and needy; teams keeping "three contracts and a bonus" gained output every year; mess halls wholly voluntary, their accounts apart; tools and, at a price, animals to the teams; handicrafts, sidelines and supply cooperatives restored). Footnote 1: Peng''s team worked chiefly in Huairou (III, 1636). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331). Names: Deng Xiaoping, Peng Zhen, Mao Zedong.'
- edit:
    id: cal.1961-08-11.china-leadership-7
    base: 7a98e695
    set:
      n: '[[w.chen-yun-nianpu-xiuding]], III, 88. See [[cal.1961-05-16.china-leadership-12]]. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 346 n.1).'
- edit:
    id: cal.1961-05-31.china-leadership-2
    base: 0cc20ea8
    set:
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 62; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524–525 (May 31, 1961; Liu presides at the Central Work Conference''s plenary meeting and sums up: the peasants of Hunan say "three parts natural calamity, seven parts man-made"; for the country as a whole natural calamity is the main cause in some places, but not in most, where the faults and errors in work are the main cause; in carrying out the general line, organizing communes and the Leap there were many faults, some serious; some inexperience made unavoidable, some avoidable and earlier discoverable); [[w.yang-shangkun-riji]], II, 38 (May 31, 1961; Liu Shaoqi speaks at the enlarged session); [[w.dikotter-maos-great-famine]], 121 n.20 (Liu at a gathering of leaders: "the centre is the principal culprit"; the Hunan saying, 30 per cent natural calamities, 70 per cent man-made; no longer one finger in ten); [[w.yang-jisheng-mubei]], II, 648 n.2 (natural disasters not the chief cause in most places; the shortcomings and errors of the work the chief cause); [[w.jian-zhou-enlai]], 459 (the May work conference: Liu, the disaster 30 percent natural, 70 percent human error; Mao silent). Made public: 1985 ([[w.shaoqi-liu-shaoqi-xuanji-selected]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 prints it). To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], 335–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.126); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127a); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127b); [[w.china-reconstructs]], Nov. 1967, Supplement, 8, 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127c); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337–38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.128); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 338 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129a); [[w.selected-works-of-liu]], 2, 316 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129b); Liu Shaoqi, speech of May 31, 1961, Gansu Provincial Archives, 91-6-81, pp. 69–73 (cited by [[w.dikotter-maos-great-famine]], 121 n.20). Names: Liu Shaoqi.'
- edit:
    id: cal.1961-06-19.china-leadership-11
    base: 885f2e66
    set:
      n: '[[w.chen-yun-nianpu-xiuding]], III, 122 n.1. See [[cal.1961-06-09.china-leadership-6]]. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 429–435).'
- edit:
    id: cal.1961-06-18.china-leadership-4
    base: 1740b2cf
    set:
      n: '[[w.yang-jisheng-mubei]], II, 832; [[w.dikotter-maos-great-famine]], 238 n.37 (the order of June 18, 1961 to send back 20 million from the cities: 10 million before the end of the year, saving 2 million tonnes of grain; the rest in 1962, stragglers by 1963); [[w.yang-jisheng-tiandi-fanfu]], I, 369 (the same day as the nine measures; the localities carry them out, and great numbers of townspeople go back to the villages). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 416–418). To check: Central Committee, "Urgent instruction on verifying the urban population and grain supply," June 18, 1961 (named by [[w.yang-jisheng-mubei]], II, 832; no note). Check: the book dates both papers June 18; the calendar''s nine-point plan is June 16 (see [[cal.1961-06-16.china-leadership-2]]).'
- edit:
    id: cal.1961-07-16.china-leadership-7
    base: a617a80d
    set:
      n: '[[w.jian-zhou-enlai]], 515. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 511–513). To check: [[w.zhonggong-zhongyang-wenjian-xuanji]], XXXVII, 222–224 (the CC''s decision on strengthening the nuclear industry, July 16, 1961) (cited by [[w.jian-zhou-enlai]], 515 n.95).'
- edit:
    id: cal.1961-09-29.china-leadership
    base: c45a1dba
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 216–17 (Mao''s letter of Sept. 29 permitting team accounting, his last concession; experiments going beyond it unacceptable); [[w.macfarquhar-origins-of-the-cultural]], III, 69–70 (the letter on team accounting; the six contrary opinions); [[w.jianguo-yilai-mao-zedong]], XVI, 122–123 (Sept. 29, 1961; the letter, written at 8 a.m., with the papers it sends: Geng Changsuo''s letter, the Shandong, Hubei, Hebei and Handan materials; the team as base and the December conference); [[w.mao-zedong-zhuan]], V, ch. 68 n.29 (Sept. 29: Mao''s long letter to the Standing Committee on the basic accounting unit: the team, not the brigade; to be settled at the December conference). [[w.peng-zhen-nianpu-1902]], IV, 155 (Sept. 29, 1961; Mao''s letter: "三级所有、队为基础," the basic accounting unit the team, not the brigade; "六年之久的糊涂日子," time to wake in the seventh); [[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun receives Mao''s letter to the Standing Committee and others: the production team, not the brigade, to be the basic accounting unit, "three-level ownership, the team the foundation"; six muddled years since the higher co-operatives; the "three contracts and one bonus" 三包一奖 set brigade and team quarrelling). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 704–711). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1080 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.37a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 574–76 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.37b); [[w.bian-mao-zedong-he-tade]], 59–60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162b); [[w.mao-zedong-zai-hubei]], 335 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162c); [[w.yi-research-note-dangshi-yanjiu]], 36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162e); [[w.liu-shaoqi-yu-1962]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162f); Mao Zedong 毛泽东, letter to the members of the Politburo Standing Committee and others on the basic accounting unit, Sept. 29, 1961; in [[w.mao-zedong-wenji]], VIII, 284–285 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.29). Names: Mao Zedong, Geng Changsuo.'
      time: 1961-09-29T00:00Z
      time_zone: Asia/Shanghai
- edit:
    id: cal.1961-04-15.china-leadership-5
    base: 86f58feb
    set:
      time_range:
      - 1961-04-14T22:00Z
      - 1961-04-15T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 5–8 (Apr. 15, 1961); [[w.mao-zedong-zhuan]], V, ch. 68 n.6 (Apr. 14, Hu Qiaomu''s letter and four enclosures, the first formal call to break up the mess halls; Apr. 15, Mao sends them to Zhang Pinghua for the Hunan three-level cadre conference to discuss). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–301, the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 467 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 65 n.148b); Hu Qiaomu to Mao, Apr. 14, 1961, and its four enclosures (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 5 n.2a–e); Hu Qiaomu 胡乔木, report to Mao Zedong with four enclosures on the public mess halls at Shaoshan (original 原件), Apr. 14, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.6). Names: Mao Zedong, Liu Shaoqi, Zhang Pinghua, Hu Qiaomu, Wang Renzhong.'
