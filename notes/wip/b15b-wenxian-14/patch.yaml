- edit:
    id: cal.1961-11-23.china-leadership-3
    base: 186497f0
    set:
      n: '[[w.yang-shangkun-riji]], II, 92 (Nov. 23, 1961); [[w.deng-xiaoping-nianpu-1904]], III, 1672 (Nov. 23, 1961; morning; Deng presides; Wang Heshou on metallurgy''s seven-year plan. Deng: too little care of technical cadres; the young of twenty and thirty to be raised now, tens of thousands of engineers; by professional skill, the political test not opposing the Party and loyalty to the country; examination boards; degrees needed. Printed in *Deng Xiaoping wenxuan*, vol. 1, as "Promote young technical cadres in large numbers"); [[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 23, 1961, morning; the 301st meeting; Peng Zhen there; Wang Heshou on the Metallurgy Ministry''s seven-year plan). The words: 上午9时到12时 (II, 92). Made public: 1989 ([[w.xiaoping-deng-xiaoping-wenxuan-1938]], Deng''s speech at the meeting, from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 804–805 prints it, its note naming the Secretariat and the metallurgical plan); the hours, 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Deng Xiaoping, "Promote young technical cadres in large numbers" 《大批提拔年轻的技术干部》, his speech at this meeting, in [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (the nianpu''s vol. 1; cited by [[w.deng-xiaoping-nianpu-1904]], III, 1672).'
- edit:
    id: cal.1961-05-31.china-leadership
    base: c3cb320c
    set:
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 30–32; [[w.yang-shangkun-riji]], II, 38 (May 31, 1961; Chen Yun speaks at the enlarged session after Zhou''s report); [[w.yang-jisheng-mubei]], II, 832 (Chen Yun at the work conference of May 21–June 12, May 31: four ways to the grain problem, the first the rural policy, the fourth the move of townspeople to the countryside; n.50); [[w.chen-yun-nianpu-xiuding]], III, 90–92 (Chen Yun speaks to the work conference on cutting staff and sending townspeople to the villages: four ways (policy, industry''s support, imports beyond 10 billion jin hard, townspeople to the villages), the first the root and the fourth indispensable; either squeeze the peasants'' rations or send townspeople down; three of the four grain crises since 1949 came from the towns'' growth; to reach 1958''s output again would take three or four years even at 20 to 30 billion jin more a year; 25 million new workers in three years, the towns at 130 million; twenty million sent down would save 3 billion jin the first year and 9 billion the second; printed in 《陈云文选》 as 《动员城市人口下乡》). Made public: 1986 ([[w.chen-yun-wenxuan-1956]], where the nianpu says the speech is collected; [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 prints it from the *Wenxuan*''s vol. III). To check: [[w.chen-yun-tongzhi-wengao]], 120–21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 31 n.46); [[w.chen-yun-tongzhi-wengao]], 128 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 32 n.53); [[w.jin-1949-1989-niande-zhongguo]], 382 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 32 n.54). Names: Chen Yun, Liu Shaoqi.'
- edit:
    id: cal.1961-06-19.china-leadership-5
    base: 4a5492ef
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 417 (June 19, 1961); [[w.macfarquhar-origins-of-the-cultural]], III, 114–116 (Zhou''s "impromptu remarks," prepared in two days: against judging and labelling by fixed patterns; the 1956 policies on intellectuals stand); [[w.macfarquhar-origins-of-the-cultural]], III, 241 (Zhou''s remarks of June 1961 on his 1959 speech: not everything he said then was right, and he was uneasy that it drew no response); [[w.chen-yun-nianpu-xiuding]], III, 94 (Zhou on Chen Yun: his view is reasonable; he is weak and very tired and needs another setting to rest in, listening to pingtan 评弹, so as to do more for the Party; pingtan teaches too; Zhou prefers the northern quyi, the Suzhou dialect being hard for him, but each takes what he needs; art replaced by politics is no art). Made public: 1984 ([[w.enlai-zhou-enlai-xuanji-selected]], II (Renmin chubanshe, Nov. 1984, by CiNii Books NCID BA53138644), from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 462–490 prints the speech). To check: [[w.selected-works-of-zhou]], 2, 333, 353 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 114 n.130a); Zhou Enlai, speech of June 19, 1961, in [[w.selected-works-of-zhou]], 332 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 241 n.50). Names: Zhou Enlai.'
- edit:
    id: cal.1961-05-07.china-leadership
    base: d609be6f
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 7, 1961; [[w.zhou-enlai-nianpu-1949]], II, 409–10, May 7, 1961 (Zhou''s telephone report and Mao''s order to circulate it); [[w.macfarquhar-origins-of-the-cultural]], III, 49 (Zhou''s report from Handan: the three points); [[w.jianguo-yilai-mao-zedong]], XVI, 26–27 (May 7, 1961; Mao''s comment sending Zhou''s telephone report of 3:30 to 4 a.m. to the bureaus and provincial committees; the report''s points, note 1); [[w.mao-zedong-zhuan]], V, ch. 68 n.10 (May 7: Zhou Enlai telephones Mao from Handan of his survey at Boyan commune, Wu''an, four questions: the mess halls (nearly all members, women and bachelors too, want to cook at home), the supply system, the grain contract and the like; Mao has the record sent round). [[w.yang-jisheng-mubei]], II, 768 n.56 (Zhou Enlai''s report to Mao after his inquiry at Boyan commune in Wu''an, Hebei: nearly all members, women and single men among them, are willing to go home to cook; the members do not favor the supply system). Made public: 1984 ([[w.enlai-zhou-enlai-xuanji-selected]], II (Renmin chubanshe, Nov. 1984, by CiNii Books NCID BA53138644), Zhou''s report, from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 prints it, its note giving Mao''s forwarding). To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.67a); [[w.aiguo-zhongguo-da-guang-jiao]], 1, 10–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.67b); Record of Zhou Enlai''s 周恩来 telephone report to Mao Zedong from Handan, May 7, 1961 (电话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.10). Names: Mao Zedong, Zhou Enlai.'
- edit:
    id: cal.1961-05-14.china-leadership-2
    base: '49155690'
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 36–37 (May 14, 1961); [[w.mao-zedong-zhuan]], V, ch. 68 nn.14, 15 (May 14, written at Tianjin: the comment on Zhang Pinghua''s letter, all to follow the mass line and settle every question with the masses; the book dates Zhang''s letter May 10 and puts it at the Dajiang brigade, Liuyang county). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332). To check: Zhang Pinghua to Mao, May 13, 1961 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 36 n.1); Zhang Pinghua 张平化, letter to Mao Zedong of May 10, 1961 on the survey at the Dajiang brigade 大江大队, Liuyang county 浏阳县 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.14); Mao Zedong 毛泽东, comment forwarding Zhang Pinghua''s letter, written at Tianjin (manuscript 手稿), May 14, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.15). Names: Mao Zedong, Zhang Pinghua. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
- edit:
