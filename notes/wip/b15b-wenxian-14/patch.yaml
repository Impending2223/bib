      when: Nov. 25
      date: '1961-11-25'
      thread: china-leadership
      c: 'The Ministry of Water Conservancy and Electric Power Party group 水利电力部党组 reports to the Center 中共中央 "On present water conservancy work" 《关于当前水利工作的报告》: irrigable land 240 million mu in 1949 and 450 million in 1957; over a billion counted in 1960, about 670 million effective by the provinces'' first check.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 859–865. Made public: 1997.'
