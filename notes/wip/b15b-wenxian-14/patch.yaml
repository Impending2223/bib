      c: '*Jiankang bao* 健康报, an editorial: the "comprehensive quick therapy" 综合快速疗法 for chronic illness the fruit of applying Mao''s "On Contradiction" 矛盾论 in theory and practice.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 218 (the Propaganda Department''s report of Feb. 23, 1961, which names it among the faults in the propaganda of Mao Zedong Thought). To check: *Jiankang bao*, July 16, 1960.'
