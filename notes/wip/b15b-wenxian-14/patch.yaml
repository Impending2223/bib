      when: '1961'
      date: '1961'
      thread: china-leadership
      c: 'Liangcun 良村 brigade, Gangshang 岗上 commune, Gaocheng 藁城 county, Hebei 河北: its 1961 grain contract under "three contracts and one reward" 三包一奖, three tables of many items and rules of reward and penalty; the Hebei committee''s work group calls them "the tables of scholasticism" 烦琐哲学.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 710 n.5 (the fifth of the Hebei papers Mao sent the Standing Committee Sept. 29, 1961). Made public: 1997. Sent on: [[cal.1961-09-29.china-leadership]].'
