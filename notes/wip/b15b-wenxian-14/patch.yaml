- edit:
    id: cal.1961-01-20.china-leadership
    base: e466c3df
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 20, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 39–40 (the three teams, their leaders and members); [[w.jianguo-yilai-mao-zedong]], XV, 479–480 (Jan. 20, 1961; Mao''s letter to Tian Jiaying, 4 p.m. Jan. 20: ''On investigation work'' to Chen Boda and Hu Qiaomu for revision; three groups, each of six and its leader, formed in three days, all of high level; Tian to Zhejiang, Hu to Hunan, Chen to Guangdong; one team to the worst production team, one to the best, ten to fifteen days; then to Canton to report to him, a month on industry there; the Spring Festival in Guangdong; the letter to be read by all twenty-one; printed from the manuscript); [[w.mao-zedong-zhuan]], V, ch. 67 n.10 (Jan. 20, 4 p.m., the letter to Tian Jiaying on three survey groups, Chen Boda to Guangdong, Hu Qiaomu to Hunan, Tian to Zhejiang, six members each, each split in two, a worst and a best production team, ten to fifteen days, then to Canton to report and a month in the city on industry, two months in all; the groups'' twenty-one members to read the letter). Made public: 1983 ([[w.mao-zedong-shuxin-xuanji]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 prints it). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. Check: [[w.yang-jisheng-mubei]], II, 763, prints a photograph of the letter, its caption dated Oct. 20, 1961. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 902 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 421 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2a); [[w.bian-mao-zedong-he-tade]], 41–42, 107, 177 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2b); [[w.mao-zedong-shuxin-xuanji]], 574–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2c); [[w.zhongguo-gongchan-dang-liushi]], 483 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2d); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 219 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2e); [[w.xinhua-yuebao]], No. 10, 1992, 77–79 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5a); [[w.hu-qiaomu-wenji]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5b); [[w.rong-fengyun-renwu-jianwen-lu]], 69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5c); [[w.jizhi-mao-zedong-yu-hu]], 81–86 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5d); [[w.weiyuanhui-zhonggong-renming-lu]], 850 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6b); [[w.institute-whos-who-in-communist]], 271–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6c); [[w.board-whos-who-in-china]], 526–27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6d); [[w.1961-nian-guangdong-nongcun]], 62–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.7b); Mao Zedong 毛泽东, letter to Tian Jiaying 田家英 on organizing the survey groups (manuscript 手稿), Jan. 20, 1961, 4 p.m.; in [[w.mao-zedong-wenji]], VIII, 239–240 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.10). Names: Mao Zedong, Tian Jiaying, Chen Boda, Hu Qiaomu.'
