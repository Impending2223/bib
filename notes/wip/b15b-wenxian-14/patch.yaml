  - edit:
      id: cal.1961-05-13.china-leadership
      base: 9ab57f03
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], IV, May 13, 1961; [[w.macfarquhar-origins-of-the-cultural]], III, 49 (the Peking report of May 10, prepared by Deng Tuo); [[w.deng-xiaoping-nianpu-1904]], III, 1637 (May 13, 1961; Mao: "send this letter to the regional bureaus and the provincial, city and regional committees for reference"); [[w.mao-zedong-zhuan]], V, ch. 68 n.13 (May 13, Mao forwards Deng Xiaoping''s and Peng Zhen''s letter of May 10: five survey groups and the Peking committee''s working groups spent over a month at Shunyi and Huairou; the sizes of brigades and teams adjusted and the peasants'' zeal greatly raised). [[w.peng-zhen-nianpu-1902]], IV, 129 (May 13, 1961; Mao''s comment: send the letter to the regional bureaus and the provincial committees for reference). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331). Check: the Deng nianpu (III, 1636–1637) gives Deng''s and Peng Zhen''s report of May 10 as a letter (致信), not a telephone report. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71a); [[w.zhongguo-gongchan-dang-liushi]], 484 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71b); [[w.peng-zei-huairou-diaocha]], passim, 25–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71c); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 492–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.72b); Deng Xiaoping 邓小平 and Peng Zhen 彭真, letter to Mao Zedong (original 原件), May 10, 1961, on the month''s survey at Shunyi and Huairou (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.13). Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
  - edit:
      id: cal.1961-05-10.china-leadership-9
      base: 25de6b07
      set:
        n: '[[w.deng-xiaoping-nianpu-1904]], III, 1636–1637 (May 10, 1961); [[w.peng-zhen-nianpu-1902]], IV, 128–129 (May 10, 1961; a letter; the communes and teams near Peking adjusted, communes of about 10,000, brigades by village, teams of about fifty households; grain bought nine tenths of the contract and four tenths of the surplus; the supply system "带有平均主义性质，害处很多", aid only for the "five guarantee" and needy; teams keeping "three contracts and a bonus" gained output every year; mess halls wholly voluntary, their accounts apart; tools and, at a price, animals to the teams; handicrafts, sidelines and supply cooperatives restored). Footnote 1: Peng''s team worked chiefly in Huairou (III, 1636). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331). Names: Deng Xiaoping, Peng Zhen, Mao Zedong.'
  - edit:
      id: cal.1961-08-11.china-leadership-7
      base: 7a98e695
      set:
        n: '[[w.chen-yun-nianpu-xiuding]], III, 88. See [[cal.1961-05-16.china-leadership-12]]. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 346 n.1).'
  - edit:
      id: cal.1961-05-31.china-leadership-2
      base: 0cc20ea8
      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 62; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524–525 (May 31, 1961; Liu presides at the Central Work Conference''s plenary meeting and sums up: the peasants of Hunan say "three parts natural calamity, seven parts man-made"; for the country as a whole natural calamity is the main cause in some places, but not in most, where the faults and errors in work are the main cause; in carrying out the general line, organizing communes and the Leap there were many faults, some serious; some inexperience made unavoidable, some avoidable and earlier discoverable); [[w.yang-shangkun-riji]], II, 38 (May 31, 1961; Liu Shaoqi speaks at the enlarged session); [[w.dikotter-maos-great-famine]], 121 n.20 (Liu at a gathering of leaders: "the centre is the principal culprit"; the Hunan saying, 30 per cent natural calamities, 70 per cent man-made; no longer one finger in ten); [[w.yang-jisheng-mubei]], II, 648 n.2 (natural disasters not the chief cause in most places; the shortcomings and errors of the work the chief cause); [[w.jian-zhou-enlai]], 459 (the May work conference: Liu, the disaster 30 percent natural, 70 percent human error; Mao silent). Made public: 1985 ([[w.shaoqi-liu-shaoqi-xuanji-selected]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 prints it). To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], 335–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.126); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127a); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127b); [[w.china-reconstructs]], Nov. 1967, Supplement, 8, 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127c); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337–38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.128); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 338 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129a); [[w.selected-works-of-liu]], 2, 316 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129b); Liu Shaoqi, speech of May 31, 1961, Gansu Provincial Archives, 91-6-81, pp. 69–73 (cited by [[w.dikotter-maos-great-famine]], 121 n.20). Names: Liu Shaoqi.'
  - edit:
      id: cal.1961-06-19.china-leadership-11
      base: 885f2e66
      set:
        n: '[[w.chen-yun-nianpu-xiuding]], III, 122 n.1. See [[cal.1961-06-09.china-leadership-6]]. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 429–435).'
  - edit:
      id: cal.1961-06-18.china-leadership-4
      base: 1740b2cf
      set:
        n: '[[w.yang-jisheng-mubei]], II, 832; [[w.dikotter-maos-great-famine]], 238 n.37 (the order of June 18, 1961 to send back 20 million from the cities: 10 million before the end of the year, saving 2 million tonnes of grain; the rest in 1962, stragglers by 1963); [[w.yang-jisheng-tiandi-fanfu]], I, 369 (the same day as the nine measures; the localities carry them out, and great numbers of townspeople go back to the villages). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 416–418). To check: Central Committee, "Urgent instruction on verifying the urban population and grain supply," June 18, 1961 (named by [[w.yang-jisheng-mubei]], II, 832; no note). Check: the book dates both papers June 18; the calendar''s nine-point plan is June 16 (see [[cal.1961-06-16.china-leadership-2]]).'
  - edit:
      id: cal.1961-07-16.china-leadership-7
      base: a617a80d
      set:
        n: '[[w.jian-zhou-enlai]], 515. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 511–513). To check: [[w.zhonggong-zhongyang-wenjian-xuanji]], XXXVII, 222–224 (the CC''s decision on strengthening the nuclear industry, July 16, 1961) (cited by [[w.jian-zhou-enlai]], 515 n.95).'
  - edit:
      id: cal.1961-09-29.china-leadership
      base: c45a1dba
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 216–17 (Mao''s letter of Sept. 29 permitting team accounting, his last concession; experiments going beyond it unacceptable); [[w.macfarquhar-origins-of-the-cultural]], III, 69–70 (the letter on team accounting; the six contrary opinions); [[w.jianguo-yilai-mao-zedong]], XVI, 122–123 (Sept. 29, 1961; the letter, written at 8 a.m., with the papers it sends: Geng Changsuo''s letter, the Shandong, Hubei, Hebei and Handan materials; the team as base and the December conference); [[w.mao-zedong-zhuan]], V, ch. 68 n.29 (Sept. 29: Mao''s long letter to the Standing Committee on the basic accounting unit: the team, not the brigade; to be settled at the December conference). [[w.peng-zhen-nianpu-1902]], IV, 155 (Sept. 29, 1961; Mao''s letter: "三级所有、队为基础," the basic accounting unit the team, not the brigade; "六年之久的糊涂日子," time to wake in the seventh); [[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun receives Mao''s letter to the Standing Committee and others: the production team, not the brigade, to be the basic accounting unit, "three-level ownership, the team the foundation"; six muddled years since the higher co-operatives; the "three contracts and one bonus" 三包一奖 set brigade and team quarrelling). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 704–711). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1080 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.37a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 574–76 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 217 n.37b); [[w.bian-mao-zedong-he-tade]], 59–60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162b); [[w.mao-zedong-zai-hubei]], 335 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162c); [[w.yi-research-note-dangshi-yanjiu]], 36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162e); [[w.liu-shaoqi-yu-1962]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 69 n.162f); Mao Zedong 毛泽东, letter to the members of the Politburo Standing Committee and others on the basic accounting unit, Sept. 29, 1961; in [[w.mao-zedong-wenji]], VIII, 284–285 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.29). Names: Mao Zedong, Geng Changsuo.'
  - edit:
      id: cal.1961-09-26.china-leadership
      base: acfeb1f6
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 68–69 (the Handan meeting, nine officials of Hebei and Shandong); [[w.jianguo-yilai-mao-zedong]], XVI, 119–121 (Sept. 26, 1961; Mao''s own record of the meeting, headed Sept. 26, his "Sept. 27" in it an error, note 1: the nine Hebei and Shandong participants; the "three guarantees and one reward" as "scholasticism," 37 steps and 1,128 accounts; the Tang county commune that contracted for the whole; no place given); [[w.mao-zedong-zhuan]], V, ch. 68 n.28 (Sept. 26 at Handan: Liu Zihou, Wang Luming of Hebei and Zhou Xing of Shandong, the Baoding secretaries; Mao on the big contract, the feet and the waist, and the three contracts and one reward as scholasticism, 37 processes, 49 percents and 1,128 accounts; the book says he had the record arranged and dated Sept. 27). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 740–743). Check: MacFarquhar dates the Handan meeting Sept. 27. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.nongye-jitihua-zhongyao-wenjian]], xia, 519–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 68 n.160a); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 68 n.160b); [[w.bian-mao-zedong-he-tade]], 59–60 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 68 n.160c); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 562–64 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 68 n.160d); [[w.lingxiu-zai-hebei]], 363 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 68 n.160e); Record of Mao Zedong''s 毛泽东 talk, while hearing Liu Zihou 刘子厚, at Handan, Sept. 26, 1961 (谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.28). Names: Mao Zedong, Liu Zihou, Zhou Xing.'
  - edit:
      id: cal.1961-10-07.china-leadership
      base: a7a5b9ac
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 7, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 70 (the directive authorizing trials of team accounting); [[w.jianguo-yilai-mao-zedong]], XVI, 140–142 (Oct. 7, 1961; Mao''s notes on the draft, 1 a.m.: print it as it stands for the comrades; Peng Zhen to handle; his title and changes; the draft''s text, note 1); [[w.mao-zedong-zhuan]], V, ch. 68 (Oct. 7: the Center''s directive on the basic accounting unit issues after Mao''s revisions: the bureaus, provinces, prefectures and counties to study it in the second half of October and the first half of November, their first secretaries going down in person). [[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 7, 1961; Mao to Peng Zhen: print the Center''s directive on the basic accounting unit in the villages to the regional bureaus and provincial committees, for investigation and trials, reports by the end of November). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 738–743). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.nongye-jitihua-zhongyao-wenjian]], xia, 518 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 70 n.170). Names: Mao Zedong, Peng Zhen.'
  - place-key: {key: longyan, name: Longyan, zone: Asia/Shanghai, in: prc}
  - cite: {id: cal.1961-01-01.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 1–10 (the editorial printed in full: in 1960 China opened relations with Cuba, Ghana, Mali and Somalia, and signed treaties of friendship and non-aggression or of peace and friendship with Burma, Nepal, Afghanistan, Guinea and Cambodia)'}
  - add:
      entry:
        id: cal.1961-01-07.china-leadership-15
        when: Jan. 7
        date: '1961-01-07'
        thread: china-leadership
        c: 'The Center 中共中央 forwards to the regional bureaus and the provincial committees the Ministry of Light Industry Party group''s 轻工业部党组 report of Dec. 30, 1960, "On the urgent arrangement of the production of daily-use industrial goods (chiefly small goods)" 《关于紧急安排日用工业品（主要是小商品）生产的报告》. Its comment: in many places salt, matches, pots, basins, bowls and chopsticks cannot be bought; the shortage comes mainly from the leadership''s failure to arrange, not from the bad harvests. The report: small goods to be written into the state and local plans, their materials supplied, their factories fixed. Sent down to the county and regiment level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 11–18 (the Center''s comment, Jan. 7, 1961, and the report, Dec. 30, 1960; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-01-14.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 19–46 (Li Fuchun''s report of Jan. 14 to the plenum, "Opinions on arranging the national economic plan for 1961" 《关于安排一九六一年国民经济计划的意见》, printed in full: industrial output in 1960 214 billion yuan, 4 billion over the plan, 26 percent over 1959''s actual figure; for 1961 coal 436 million tons, iron 27.5 million, steel 19 million; industrial output about 231 billion yuan, 8 percent up)'}
  - cite: {id: cal.1961-01-14.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 75–77 (the plenum''s resolution of Jan. 18 on setting up the Center''s bureaus 《关于成立中央局的决议》, printed in full: the Politburo''s decision of 1960 approved; six bureaus, North China, the Northeast, East China, the Central-South, the Southwest and the Northwest, each to build a fairly complete economic system for its region; sent to the provincial and municipal committees'' secretariats and the central departments'' Party groups)'}
  - cite: {id: cal.1961-01-15.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 47–58 (the Center''s comment and the Finance Ministry Party group''s report of Dec. 31, 1960, "On improving the financial system and strengthening financial management" 《关于改进财政体制、加强财政管理的报告》, printed in full: financial power gathered to the Center, the regional bureaus and the provinces, "the whole country one chessboard"; no working funds for capital construction, no bank credit for fiscal spending; the measures not to be changed by any region or department on its own)'}
  - cite: {id: cal.1961-01-15.china-leadership-9, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 59–66 (the Center''s comment and the Grain Price Small Group''s 粮价问题小组 report of Jan. 9, printed in full: the group set up under Chen Yun during the work conference; purchase prices up 20 percent from the summer harvest and the 5 percent bonus of 1960 kept, 25 percent in all, sale prices not raised for now; meat, eggs, oil, cotton, tobacco, hemp, tea, sugar, timber and bamboo to follow in two years; 150,000 tons more rolled steel and 10 million dollars more foreign exchange for the market; the document not to go down as written, the figures of the currency issued struck out)'}
  - cite: {id: cal.1961-01-09.china-leadership-13, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 60–66 (the report, "On raising the purchase price of grain" 《关于提高粮食收购价格问题的报告》, Jan. 9, 1961, to the Chairman and the Center, printed in full with the Center''s comment of Jan. 15)'}
  - add:
      entry:
        id: cal.1961-01-15.china-leadership-10
        when: Jan. 15
        date: '1961-01-15'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Provisions on some questions of policy in the present procurement of farm products" 《关于目前农产品收购工作中几个政策问题的规定》: estimates too high, quotas too big, too much bought and too little left, a root of the "communist wind" and commandism. Farm products in three classes: grain, cotton and edible oil bought and sold by the state alone; a second class bought by contract; the rest bought and sold freely. Surplus over the quota may be sold at the rural markets the state names; the rural markets to be led and managed, no buying to resell.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 67–74 (printed from the Central Committee''s document, with its table of the three classes). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-01-19.china-leadership-8, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 78–82 (printed in full as "In arranging the market, leave one side of the net open" 《安排市场要网开一面》, from *Chen Yun wenxuan*, III; the note: Chen Yun''s speech to the Central Work Conference)'}
  - cite: {id: cal.1961-01-21.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 83–88 (the communiqué 《中国共产党第八届中央委员会第九次全体会议公报》, dated Jan. 20, printed from *Renmin ribao* of Jan. 21: the plenum met in Peking Jan. 14–18, Mao presiding; 83 members and 87 alternates; 23 others attended)'}
  - add:
      entry:
        id: cal.1961-01-20.china-leadership-13
        when: Jan. 20
        date: '1961-01-20'
        thread: china-leadership
        c: 'The Center 中共中央 issues the "Minutes of the Central Work Conference''s discussion of rural rectification and some questions of policy" 《中央工作会议关于农村整风整社和若干政策问题的讨论纪要》. The conference, opened at Peking Dec. 24, 1960, finds the rural situation "very good": about 80 percent of counties, communes and brigades good or basically good, about 20 percent with grave problems; over 90 percent of cadres good or basically good, nearly 7 percent with grave or fairly grave errors, about 3 percent "five-category elements" or degenerates. Xinyang''s 信阳 experience shows a bad area can be turned round in a few months.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 89–101 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-13.china-leadership-4]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - cite: {id: cal.1961-01-20.china-leadership-12, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 102–105 (printed in full: by "great power concentrated, small power dispersed", economic power to the Center, the regional bureaus and the provinces, for two or three years more to the Center and the bureaus; the powers over men, money, trade and industry handed down since 1958 wrongly taken back)'}
  - cite: {id: cal.1961-01-20.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 102–105 (the "Provisional regulations on adjusting the system of management" 《关于调整管理体制的若干暂行规定》, printed in full)'}
  - cite: {id: cal.1961-01-20.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 (the letter printed in full, from *Mao Zedong shuxin xuanji*)'}
  - add:
      entry:
        id: cal.1961-01-21.china-leadership-11
        when: Jan. 21
        date: '1961-01-21'
        thread: china-leadership
        c: 'The Center 中共中央 forwards Nie Rongzhen''s 聂荣臻 report of Jan. 7, to Li Fuchun 李富春 and Deng Xiaoping 邓小平 and the Secretariat, "On the arrangement of science and technology work in 1961 and 1962" 《关于一九六一、一九六二年科学技术工作安排的报告》, with his outline: the ministries and regions to write science and technology into the economic plan. Sent down to the province and army level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 108–120 (the Center''s comment, the report and the outline; printed from the Central Committee''s document). Made public: 1997. Names: Nie Rongzhen, Li Fuchun, Deng Xiaoping.'
        tags: ['polity:prc', 'vis:only:prc', 'name:nie-rongzhen', 'name:li-fuchun', 'name:deng-xiaoping']
  - cite: {id: cal.1961-01-23.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 121–125 (the decision of the Center and the State Council 《关于进一步压缩社会集团购买力的决定》, printed in full: from about 8 billion yuan in 1960 to about 5 or 4 billion, a cut of 40 to 50 percent; a year''s ban on buying sofas, carpets, cars, motorcycles, bicycles, television sets, cameras, typewriters, fans and other non-productive goods)'}
  - cite: {id: cal.1961-01-31.china-leadership-8, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 126–143 (the Center''s comment and the Hubei committee''s report of Jan. 25 to the Central-South Bureau, the Center and the Chairman, printed in full; the comment: the report very good, to be read several times; sent down to the county and regiment level)'}
  - add:
      entry:
        id: cal.1961-01-31.china-leadership-14
        when: Jan. 31
        date: '1961-01-31'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the report of Nov. 15, 1960 of the Party group of the former State Capital Construction Commission 国家基本建设委员会, "On saving land in capital construction" 《关于基本建设节约用地问题的报告》: from 1953 to 1959 construction took 94.65 million mu of farmland, water conservancy over 64.8 million of it (68 percent); too much taken, too early, good land for bad. Its comment: every building and land department to check its land; land not used, or not used for now, to be given back before the spring ploughing.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 144–150 (the Center''s comment and the report; printed from the Central Committee''s document; the summary of eight provinces'' reports on wasted land, named in the report, left out, 150 n.1). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-02-01.china-leadership-5, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 151–161 (the Center''s comment and the report of Jan. 20, printed in full: the report "very good, very important"; first secretaries to take charge; edema and the malnutrition of women and children to be checked in two or three months, so that healthy labor goes into the spring ploughing; disease work among the Party''s most important tasks this year, Party committees to take it up at least four times, the disaster areas once a month; the report follows the national meeting of health department and bureau heads at Peking, Jan. 5–15)'}
  - add:
      entry:
        id: cal.1961-02-04.china-leadership-12
        when: Feb. 4
        date: '1961-02-04'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the Ministry of Railways Party group''s 铁道部党组 report of Jan. 26, "On setting up political work departments in the railway system and improving the railway management system" 《关于在铁路系统建立政治工作部门和改进铁路管理体制的报告》, to be carried out. Its comment: the railways, the economy''s great artery and half military, are to be wholly under the ministry, in production, materials, funds, equipment and cadres; the ministry''s Party group becomes a Party committee; its political department the Center''s organ for Party work in the railways, under dual leadership with the regional and provincial committees, the ministry''s first.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 162–167 (the Center''s comment, Feb. 4, and the report, Jan. 26; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-02-02.china-leadership]].'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-02-07.china-leadership-9
        when: Feb. 7
        date: '1961-02-07'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the Central Culture and Education Small Group''s 中央文教小组 report "On the arrangement of culture and education work in 1961 and for a period to come" 《关于一九六一年和今后一个时期文化教育工作安排的报告》. Students to sleep and rest more, no outside labor this spring, girl students and women teachers'' health guarded. Enrolment for 1961: higher schools 250,000, 94,000 fewer than in 1960; secondary technical schools 500,000, 110,000 fewer; middle schools 3.35 million (550,000 senior), 990,000 fewer; primary schools as the localities set. Sent to the provincial and municipal committees and their departments.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 168–179 (the Center''s comment and the report; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-02-07.china-leadership-10
        when: Feb. 7
        date: '1961-02-07'
        thread: china-leadership
        c: 'The Center 中共中央 approves the Finance and Trade Office''s 财贸办公室 report of Jan. 18, "Request for instructions on some questions of foreign trade in 1961" 《关于一九六一年对外贸易若干问题的请示报告》, and its foreign trade plan for 1961: purchases 7.31 billion yuan, exports 5.67 billion, imports 4.924 billion. Its comment: only by squeezing out goods for export can grain, fertilizer, pesticides, medicines and steel be imported; imports in order of need, grain first.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 180–187 (the Center''s comment, Feb. 7, and the report, Jan. 18; two attachments left out, 187 nn.1–2; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-03-01.china-leadership-14
        when: Mar. 1
        date: '1961-03-01'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the experience of rectification at Tanzhou 坦洲 commune, Zhongshan 中山 county, Guangdong 广东, with the Central-South Bureau''s 中南局 comment of Feb. 9 to the Guangdong, Hunan, Hubei, Henan and Guangxi committees, "A fairly successful experience" 《一个比较成功的经验》: for the communes of the first and second class a fuller and healthier experience than Tonghaikou''s, a guiding document. The rectification to go deep, not in haste; with the spring ploughing begun, production first, rectification in the slack. Sent down to the county and regiment level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 188–214 (the Center''s comment, Mar. 1, the bureau''s comment, Feb. 9, and the commune''s experience; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-31.china-leadership-8]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - cite: {id: cal.1961-03-13.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216 (the letter printed in full, signed 8 a.m., Mar. 13, Canton; the notes: the Peking meeting the conference of the North China, Northeast and Northwest bureaus and provinces that Liu Shaoqi and Zhou Enlai had called, the "Three North" conference; Mao at Canton with the Central-South, Southwest and East China, the "Three South"; Tao Zhu sent that day to report)'}
  - add:
      entry:
        id: cal.1961-03-25.china-leadership-6
        when: Mar. 25
        date: '1961-03-25'
        thread: china-leadership
        c: 'Mao''s 毛泽东 letter of Mar. 13 on the two egalitarianisms is printed and sent to the provincial committees'' standing committees, the ministers of the Center''s departments and the secretaries of the central state organs'' Party groups.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 216 n.1. Made public: 1997. See [[cal.1961-03-13.china-leadership]]. Names: Mao Zedong.'
        tags: ['polity:prc', 'vis:only:prc', 'name:mao-zedong']
  - add:
      entry:
        id: cal.1961-03-15.china-leadership-11
        when: Mar. 15
        date: '1961-03-15'
        thread: china-leadership
        c: 'The Center 中共中央 forwards, and agrees with, the Propaganda Department''s 中央宣传部 report of Feb. 23, "On some problems in the propaganda of Mao Zedong Thought and of the leader''s revolutionary deeds" 《关于毛泽东思想和领袖革命事迹宣传中一些问题的检查报告》: Mao Zedong Thought vulgarized, a table-tennis player''s and a doctor''s methods put down to it; untrue stories of the leader printed; too many trifles of his life. Sent down to the county and regiment level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 217–220 (the Center''s comment, Mar. 15, and the report, Feb. 23; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-03-22.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 221–224 (the Center''s letter of Mar. 22 to all comrades 《关于讨论〈农村人民公社工作条例（草案）〉给全党同志的信》, printed in full: the draft sent to every rural branch and to all commune members; the problems: egalitarianism between teams and between members, communes too big in many places; the note: the draft adopted by the work conference Mar. 22, revised by the conference of May 21–June 12, and the revised draft approved by Mao June 15)'}
  - cite: {id: cal.1961-03-23.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 225–227 (the letter printed in full: Mao''s "On investigation work" of spring 1930, newly found, to be studied by the Party''s higher and middle cadres; the note: the essay is "Oppose book worship", left out, and gives Mao''s comment on it of Mar. 11)'}
  - cite: {id: cal.1961-03-11.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 227 n.1 (Mao''s comment printed in full: an old essay against dogmatism in the Red Army, then called "book worship"; written about spring 1930, unseen thirty years, found in January 1961 at the Central Revolutionary Museum, which had it from the Longyan prefectural committee in Fujian; some copies to be printed for comrades)'}
  - add:
      entry:
        id: cal.1961-04-03.china-leadership-15
        when: Apr. 3
        date: '1961-04-03'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the report of Mar. 25 of the Party groups of the State Planning Commission 国家计委 and the State Economic Commission 国家经委 on saving coal, to be carried out at once. Its comment: the want of fuel the most glaring problem in the economy; in the long run more oil, water power and other fuels and less coal; for now better coal, rational supply, lower coal norms. The departments and provinces to set saving targets, the Planning Commission to balance them.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 228–233 (the Center''s comment, Apr. 3, and the report, Mar. 25; the editors'' note corrects the report''s figure for thermal power to 543 kg of standard coal per 1,000 kWh, from the Coal Ministry''s policy research office, 233 n.1; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-04-03.china-leadership-16
        when: Apr. 3
        date: '1961-04-03'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Directive on grain rewards in the purchase of important industrial crops" 《关于收购重要经济作物实行粮食奖励的指示》: with grain short and the villages on "low rations, melons and vegetables in place of grain", peasants who grow the important industrial crops are to be rewarded in grain. Brigades growing them chiefly are assured the rations of the nearby surplus-grain teams, and besides receive reward grain, paid for at the state sale price, by the amount they sell: cotton, the main oil-seeds, flue-cured tobacco, hemp, tea, silkworm cocoons, sugar crops and some export fruit, medicinal herbs and local products, for the grain year July 1961–June 1962.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 234–237 (printed from the Central Committee''s document; the two tables of reward grain by province and of reference norms left out, 237 n.1). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-04-03.china-leadership-5, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 238–253 (an extract of the report, "Some tasks in our present construction" 《当前建设中的几项任务》, printed from [[w.zhou-enlai-jingji-wenxuan]]: first to pass the barrier of agriculture, the base of the economy, with over 500 million in the villages)'}
  - add:
      entry:
        id: cal.1961-04-09.china-leadership-8
        when: Apr. 9
        date: '1961-04-09'
        thread: china-leadership
        c: 'The Center 中共中央 approves the 1961 capital construction plan the State Planning Commission''s 国家计划委员会 Party group redrew after the Ninth Plenum and forwards its report of Apr. 2, "On arranging the capital construction plan for 1961" 《关于安排一九六一年基本建设计划的报告》, to be carried out at once: investment 12.9 billion yuan, 21.6 billion less than the 34.5 billion of the 1960 state plan; 771 large and medium projects under way and 325 kept on a small scale, 1,096 in all, 739 fewer than in 1960. Every unit, building, kept or stopped, to explain the reasons to its people; the Planning Commission, the provinces and the big central departments to set up command organs for capital construction in April. Sent down to the province level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 254–273 (the Center''s comment, Apr. 9, and the report, Apr. 2; eight enclosures left out, 273 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-06.china-leadership-2]].'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-04-09.china-leadership-9
        when: Apr. 9
        date: '1961-04-09'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the report of Apr. 4 of its five-man group on cutting cadres and arranging labor 中央精简干部和安排劳动力五人小组, "On adjusting rural labor and cutting and sending down staff" 《关于调整农村劳动力和精简下放职工问题的报告》, and agrees with it: more labor for farming, more staff cut and sent down, the cities'' population pressed down. The report: the provinces plan to cut 5.28 million staff from September 1960 to the end of 1961, 2.28 million of them sent home to the villages without pay and 3 million down to the villages with pay; 4,106,000 cut by the end of February or mid-March. Sent down to the province level.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 274–287 (the Center''s comment, Apr. 9, and the report, Apr. 4; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-07.china-leadership]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-04.china-leadership-10, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 288–298 (the Center''s "Directive on the guiding line of the work in Tibet" 《关于西藏工作方针的指示》, Apr. 21, to the Tibet Work Committee and the Southwest Bureau, printed in full: the rebellion of March 1959 put down and democratic reform done in the main in two years; for five years from 1961 no socialist transformation, no cooperatives, not even trials, still less communes; the peasants'' and herdsmen''s individual ownership to settle; against the "left" and haste)'}
  - cite: {id: cal.1961-04-26.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–315 (the Center''s forwarding of Apr. 26, on Mao''s instruction, of Hu Qiaomu''s letter and four enclosures on the mess halls, for reference, the bureaus and committees to decide whether to pass them down, with Mao''s comment of Apr. 15; Hu''s letter of Apr. 14 to Mao, from Shaoshan 韶山: the Shaoshan brigade to meet Apr. 16 on mess halls, hills and woods, houses and quotas; at Xiangxiang 湘乡, three brigades of the former Dongjiao commune 707 dead from October 1958 to March 1961, 13.5 percent of their people, and in two brigades nearby the deaths over three years about 20 percent)'}
  - variant: {id: cal.1961-04-26.china-leadership-2, unit: A, witness: w.jianguo-yilai-zhongyao-wenxian, reads: 'Hu Qiaomu''s letter of Apr. 14 to Mao, with his investigation group''s report on the mess halls of Shaoshan commune 韶山公社, Hunan, and three other enclosures, not a report from Sichuan', at: 'XIV, 300–315'}
  - cite: {id: cal.1961-04-15.china-leadership-5, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–301 (Mao''s comment, signed the morning of Apr. 15, printed in full in the Center''s forwarding of Apr. 26)'}
  - cite: {id: cal.1961-04-10.china-leadership-6, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 310–315 (the investigation group''s report of Apr. 10, printed in full among the four enclosures to Hu Qiaomu''s letter of Apr. 14, which the Center forwarded Apr. 26)'}
  - cite: {id: cal.1961-05-06.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317 (the letter printed in full, signed May 6, at Shanghai, to Li Jingquan for Chen Zhengren and to the first secretaries of the bureaus and provinces: the Center''s list of subjects for inquiry sent Apr. 25, its notice of May 4 putting the meeting off to May 20; each first secretary to spend the half-month in the villages and write to him; the note quotes the notice of Apr. 25)'}
  - cite: {id: cal.1961-04-25.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 317 n.1 (the Center''s notice of Apr. 25 calling the work conference for mid-May, quoted: the mess halls, grain, the supply system, the hills and woods, fuel hills for the peasants, "three guarantees and one reward", draught animals and tools to brigade or team, rectification and restitution in the first- and second-class counties, communes and brigades, handicrafts and the supply and marketing cooperatives, to be studied at points for ten to fifteen days)'}
  - cite: {id: cal.1961-05-07.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 (Zhou Enlai''s telephone report from the Handan 邯郸 district of May 7, printed from *Zhou Enlai xuanji*, II, as "On the inquiry into the mess halls, work points and other questions" 《关于食堂和评工记分等问题的调查》: three days of reports at Handan, then five days at Boyan 伯延 commune, Wu''an 武安 county; nearly all members, women and single men too, want to cook at home; members against the supply system, for keeping the "five guarantee" households; the work-point system of the higher cooperatives wanted back; the note: Mao forwarded it May 7 to the bureaus and committees)'}
  - check: {id: cal.1961-05-07.china-leadership, text: 'Check: Made public: [[w.enlai-zhou-enlai-xuanji-selected]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 prints Zhou''s report, may have printed it before 1997.'}
  - cite: {id: cal.1961-05-09.china-leadership-7, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320–323 (Mao''s comment, 3 a.m., May 9, at Shanghai, and Hu Qiaomu''s letter, 11 a.m., May 8, at Changsha, printed in full: the investigation group and the Hunan committee have proposed changes to the Sixty Articles; Hu, Wang Li and others to Liuyang 浏阳 to see the new handicraft cooperatives; Tao Zhu to Taoyuan 桃源)'}
  - cite: {id: cal.1961-05-13.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331 (Mao''s comment of May 13 and the letter of Deng Xiaoping and Peng Zhen of May 10, printed in full: five investigation groups in Shunyi and Huairou and the Peking committee''s work groups, over a month; the size of communes and brigades, the supply system, grain procurement, "three guarantees and one reward", work points, the mess halls and ownership)'}
  - cite: {id: cal.1961-05-10.china-leadership-9, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331 (the letter printed in full, with Mao''s comment of May 13 sending it to the bureaus and committees for reference)'}
  - cite: {id: cal.1961-05-14.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336 (Mao''s comment, May 14, at Tianjin, and Zhang Pinghua''s letter of May 13, printed in full: Zhang and an investigation group at Dajiang 大江 brigade, Wenjiashi 文家市 commune, Liuyang 浏阳, from May 2; Mao: the letter to go to every prefectural, city and county committee in Hunan; policy to be made with the masses; no Party committee to make policy shut indoors without inquiry)'}
  - cite: {id: cal.1961-05-16.china-leadership-12, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 337–346 (printed as "Speed up the nitrogen fertilizer industry" 《加速发展氮肥工业》, from *Chen Yun wenxuan*, III; the note: the report Chen Yun drafted May 16 for the Center''s Fertilizer Small Group, first titled "Report on speeding the development of the nitrogen fertilizer industry"; the Hangzhou forum of Apr. 4–10)'}
  - cite: {id: cal.1961-08-11.china-leadership-7, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 346 n.1 (the Center''s comment of Aug. 11 quoted in full: sent to the bureaus, the provincial committees and the Party groups of the Planning and Economic Commissions and the Chemical Industry Ministry; the Center agrees with the report''s line of building large nitrogen plants; how many a year, for the Planning Commission in its plans for 1961–62 and the long term; equipment to be made at home and the needed materials imported)'}
  - add:
      entry:
        id: cal.1961-04-30.china-leadership-11
        when: Apr. 30
        date: '1961-04-30'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the report of the Party groups of the State Planning Commission 国家计委, the State Economic Commission 国家经委 and the Ministry of Finance 财政部, "On swiftly clearing and reallocating the equipment and materials left by stopped and deferred projects" 《关于迅速清理和调剂使用停建、缓建项目结存的设备、材料的报告》.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 353 (named, with its date, in the measures for stopped projects of May 19 that the Center approved May 25: their equipment to be dealt with by it). Made public: 1997. To check: the report and the Center''s comment of Apr. 30, 1961, not printed in the volume.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-18.china-leadership-10
        when: May 18
        date: '1961-05-18'
        thread: china-leadership
        c: 'The Center 中共中央 forwards, and agrees with, the Ministry of Labor Party group''s 劳动部党组 proposal of Apr. 13, "On setting up and improving the system of fixed staff and fixed quotas in the rectification of enterprises" 《关于企业整风中建立和健全定员定额制度的建议》: to be done first in the key enterprises, while the rectification lasts, and the experience spread.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 347–349 (the Center''s comment, May 18, and the proposal, Apr. 13; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-25.china-leadership-8
        when: May 25
        date: '1961-05-25'
        thread: china-leadership
        c: 'The Center 中共中央 approves the "Measures for dealing with stopped projects" 《关于停建项目的处理办法》 that the Party groups of the State Planning Commission 国家计委 and the Ministry of Finance 财政部 proposed on May 19, to be carried out: the men, equipment and materials of stopped projects to go to the building in the state plan, the work done by the end of June; the cities over-full, most of their people, technicians apart, to be sent back to farm in the villages.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 350–355 (the Center''s comment, May 25, and the measures, May 19; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-09.china-leadership-8]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-05-31.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 (printed as "The causes of the present economic difficulties and the way to overcome them" 《当前经济困难的原因及其克服的办法》, from *Liu Shaoqi xuanji*, II: every contradiction now shows in grain; the Hunan peasants'' "three parts natural disaster, seven parts man-made"; Tao Lujia for Shanxi, and Hebei, Shandong and Henan, put the errors of work first; the Center to take responsibility)'}
  - cite: {id: cal.1961-05-31.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 (printed as "Mobilize the urban population to go to the countryside" 《动员城市人口下乡》, from *Chen Yun wenxuan*, III; the note: his speech to the Central Work Conference)'}
  - check: {id: cal.1961-05-31.china-leadership, text: 'Check: Made public: [[w.chen-yun-wenxuan-1956]] (1986) may print the speech, which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 364–374 prints from *Chen Yun wenxuan*, III.'}
  - cite: {id: cal.1961-06-13.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 375–377 (the record of the talk with Sukarno printed in part as "China can have only one representative in the United Nations" 《中国在联合国只能有一个代表》, from [[w.mao-zedong-waijiao-wenxuan]]: while Chiang Kai-shek''s representative is in the United Nations China will not enter; "we have waited eleven years"; Sukarno gives the two views abroad, China and Taiwan in as one, or China in first and Chiang''s man expelled after; the note on West Irian)'}
  - cite: {id: cal.1961-06-15.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 378–384 (the Center''s directive of June 15 on discussing and trying out the revised draft 《关于讨论和试行〈农村人民公社工作条例（修正草案）〉的指示》, printed in full: the draft of Mar. 22 discussed and tried; the work conference of late May to early June revised it; the revised draft to be read and explained to every Party member and commune member in the slack seasons; every Party committee to make investigation a regular system of work)'}
  - cite: {id: cal.1961-06-15.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 385–411 (the "Working Regulations for the Rural People''s Communes (Revised Draft)" 《农村人民公社工作条例（修正草案）》, June 15, printed in full: three levels, commune, brigade and team; ownership at three levels, the brigade''s the base; the brigade the basic accounting unit; the note gives the changes from the March draft: whether a team runs a mess hall for its members to decide, rations distributed to households; the supply and wage parts of distribution, three to seven, dropped, all by work points; most hills and woods fixed to the teams, small patches to teams and members; the "Three Main Rules and Eight Points" for cadres added; the revised draft approved by Mao June 15, 224 n.1)'}
  - cite: {id: cal.1961-06-17.china-leadership-4, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 378–384 (the directive as issued, dated June 15: every Party committee to make investigation and study a regular system of work)'}
  - cite: {id: cal.1961-06-16.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 412–415 (the "Nine measures of the Central Work Conference on reducing the town population and cutting grain sales in the towns" 《中央工作会议关于减少城镇人口和压缩城镇粮食销量的九条办法》, approved by the Center June 16, printed in full: the towns may only lose people, never gain; from the base of 129 million town people at the end of 1960; to restore farming within three years; some matters left to the work conference of August)'}
  - cite: {id: cal.1961-06-18.china-leadership-4, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 416–418 (the urgent directive, dated June 16, printed in full: from now to the end of July, a month and a half, a full count of the people and grain supply of the towns, chiefly the 183 large and medium cities; one ration a person, rations by labor and age, collective households first)'}
  - variant: {id: cal.1961-06-18.china-leadership-4, unit: A, witness: w.jianguo-yilai-zhongyao-wenxian, reads: 'June 16 (一九六一年六月十六日), the urgent directive''s own date', at: 'XIV, 416'}
  - add:
      entry:
        id: cal.1961-06-17.china-leadership-7
        when: June 17
        date: '1961-06-17'
        thread: china-leadership
        c: 'The Center 中共中央 forwards for reference the Propaganda Department''s 中央宣传部 report of May 19, "On the teaching line of the liberal arts in the higher schools and the compiling of textbooks" 《关于高等学校文科教学方针和教材编选工作的报告》: textbooks a key to settled teaching and better quality; the Party committees of the regions charged with writing them to supply men and means.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 419–428 (the Center''s comment, June 17, and the report, May 19; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-11.china-leadership-11]].'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-04-11.china-leadership-11
        when: Apr. 11
        date: '1961-04-11'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The Propaganda Department 中央宣传部, with the Ministries of Education 教育部 and Culture 文化部, opens the conference on the plan for compiling textbooks for the liberal arts and the art schools of the higher schools, to Apr. 25: 298 old teachers, experts, young teachers, presidents and branch secretaries and provincial propaganda and education men, a third of them outside the Party. Zhou Yang 周扬 reports at the opening; Lu Dingyi 陆定一 and Kang Sheng 康生 hold forums with experts outside the Party; Lu speaks at the close.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 420 (the Propaganda Department''s report of May 19). Made public: 1997. Names: Lu Dingyi, Kang Sheng.'
        tags: ['polity:prc', 'vis:only:prc', 'name:lu-dingyi', 'name:kang-sheng']
  - cite: {id: cal.1961-06-19.china-leadership-11, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 429–435 (printed in full: since the urgent directive letter of Nov. 3, 1960 and the work conference''s minutes of Jan. 20 the restitution of transferred goods far from thorough; every Party organization to make up its mind to repay in full)'}
  - cite: {id: cal.1961-06-19.china-leadership-4, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 436–449 (the "Provisions on some policy questions of handicrafts in town and country (trial draft)" 《关于城乡手工业若干政策问题的规定（试行草案）》, printed in full: three kinds of ownership through the socialist stage, the whole people''s, the collective and individual under the socialist economy''s lead, the collective the main one)'}
  - cite: {id: cal.1961-06-19.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 450–461 (the "Provisions on improving commercial work (trial draft)" 《关于改进商业工作的若干规定（试行草案）》, printed in full: socialist commerce the bridge between the whole people''s and the collective economy, industry and farming, production and consumption; the line "develop the economy, ensure supply")'}
  - cite: {id: cal.1961-06-19.china-leadership-5, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 462–490 (the speech printed in full from *Zhou Enlai xuanji*, II: not enough democratic style; many dare not think, speak or act, though Mao called for daring at Nanning in 1958)'}
  - check: {id: cal.1961-06-19.china-leadership-5, text: 'Check: Made public: [[w.enlai-zhou-enlai-xuanji-selected]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 462–490 prints the speech, may have printed it before 1997.'}
  - add:
      entry:
        id: cal.1961-06-23.china-leadership-10
        when: June 23
        date: '1961-06-23'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the Finance Ministry Party group''s 财政部党组 report of June 17, "On adjusting the burden of the agricultural tax" 《关于调整农业税负担的报告》, to be carried out. The report: the tax not cut for the poor harvests of 1959 and 1960; the real burden, tax and local surcharge, to average no more than 10 percent of farm income, the old "tithe"; for 1961 about 24 billion jin of fine grain, 9.14 percent of the 262 billion jin of contracted output, the regular tax 21.76 billion and the surcharge 2.18 billion, the surcharge cut from 15–30 percent of the tax to no more than 10. The comment: the heavy burden of the high-yield grain areas to be put right county by county.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 491–495 (the Center''s comment, June 23, and the report, June 17; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-06-26.china-leadership-6
        when: June 26
        date: '1961-06-26'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Provisions on some policies for fixing forest rights, protecting hills and woods and developing forestry (trial draft)" 《关于确定林权、保护山林和发展林业的若干政策规定（试行草案）》: natural forests and the hills made state property before the communes stay the state''s; the woods of the higher cooperatives stay the brigades'', teams'' and members''; trees planted since, "who plants, owns"; ownership fixed for the life of the trees, the boundaries marked.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 496–504 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-06-02.china-leadership-4]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-06-28.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 505–510 (the "Notice on some questions in the work of cutting staff" 《关于精减职工工作若干问题的通知》, printed in full: to supplement the nine measures; those to go chiefly the new staff from the villages who joined since January 1958, temporary and contract workers among them)'}
  - cite: {id: cal.1961-07-16.china-leadership-7, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 511–513 (the "Decision on some questions of strengthening the building of the atomic energy industry" 《关于加强原子能工业建设若干问题的决定》, printed in full: to break through atomic technique by its own efforts, the front shortened; the Second Ministry of Machine Building 二机部 to receive 86 senior scientists and engineers, 14 factory and mine heads and Party secretaries, 60 division and 18 section cadres, by the Organization Department before October; specialties at Xi''an Jiaotong University and the East China Institute of Technology at Shanghai; a radiation health bureau in the Health Ministry; all the ministry''s goods carried as military freight)'}
  - cite: {id: cal.1961-07-19.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 514–570 (the Center''s comment, July 19, agreeing with Nie Rongzhen''s report of June 20 "On some policy questions in present natural science work" 《关于当前自然科学工作中若干政策问题的请示报告》 and the Fourteen Points of the Party groups of the Science and Technology Commission and the Academy of Sciences, 《关于自然科学研究机构当前工作的十四条意见（草案）》, all printed in full; the report''s chief points to be explained to those outside the Party by the heads of each unit)'}
  - add:
      entry:
        id: cal.1961-08-17.china-leadership-12
        when: Aug. 17
        date: '1961-08-17'
        thread: china-leadership
        c: 'The Center 中共中央 forwards the United Front Department''s 中央统战部 report of Aug. 4, "Opinions on continuing the policy of placing the bourgeoisie in the organs, the enterprises and the urban people''s communes" 《关于在机关、企业和城市人民公社等方面继续贯彻对资产阶级人们的安排政策的意见》. Its comment: the posts of democratic personages and of the private staff of joint state-private enterprises not to be lightly changed; none removed or demoted except for breaking the law; the able may be promoted; none to be cut as a bundle in the streamlining, and those sent down to temper themselves long ago brought back; no rectification of democratic personages and businessmen in the present campaign.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 571–575 (the Center''s comment, Aug. 17, and the report, Aug. 4; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-09-15.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 576–607 (the Center''s directive of Sept. 15 on discussing and trying out the draft "Provisional Working Regulations for the Higher Schools directly under the Ministry of Education" 《关于讨论和试行教育部直属高等学校暂行工作条例（草案）的指示》, printed in full with the regulations: approved by the Center in principle; to be discussed and tried in the ministry''s twenty-six schools, discussed elsewhere, the provinces and ministries to decide whether to try it)'}
  - cite: {id: cal.1961-09-15.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 608–612 (the Center''s "Decision on training cadres in rotation" 《关于轮训干部的决定》, Sept. 15, printed in full: on Mao''s proposal at the June work conference, all leading cadres of the Party to pass in turn through short training classes, to learn the laws of socialist construction and overcome "right" and "left" errors)'}
  - cite: {id: cal.1961-09-15.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 613–635 (the Center''s "Directive on present problems of industry" 《关于当前工业问题的指示》, Sept. 15, printed in full: the main targets of the second five-year plan reached early in the three years of the leap)'}
  - cite: {id: cal.1961-09-16.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 636–681 (the Center''s directive of Sept. 16 on discussing and trying out the draft "Working Regulations for State Industrial Enterprises" 《关于讨论和试行〈国营工业企业工作条例（草案）〉的指示》, printed in full with the regulations: drafted in a short time, incomplete; to be discussed in the central and local state enterprises and tried at points, the views reported to the Center by mid-November, the bureaus to report on the trials by late November)'}
  - add:
      entry:
        id: cal.1961-09-16.china-leadership-8
        when: Sept. 16
        date: '1961-09-16'
        thread: china-leadership
        c: 'The Center 中共中央 forwards Li Xiannian''s 李先念 report of Sept. 6 to the Chairman and the Center, "On the market, prices and the circulation of currency" 《关于市场、物价和货币流通问题的报告》, "most secret": its spirit only to be passed on, no figures, no reprinting. The report: too much money, too few goods, some prices up; currency in circulation 9.5 billion yuan at the end of 1960, 11 billion on Sept. 5, 1961, about 12.5 billion expected by the end of the year; a yuan in circulation buys 4.5 yuan of goods, against 8 or 9 when the market was stable. The comment: the high prices for some farm products a temporary measure, held tight by the provinces.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 682–701 (the Center''s comment, Sept. 16, and the report, Sept. 6, after a typical inquiry into 526 households of staff in 13 cities and a forum on prices; the notes give the State Statistical Bureau''s first estimates for 1961, the gross output of industry and farming 142 billion yuan, about 1957''s, and the currency issued year by year, 701 nn.1–2; printed from the Central Committee''s document). Made public: 1997. Names: Li Xiannian.'
        tags: ['polity:prc', 'vis:only:prc', 'name:li-xiannian']
  - cite: {id: cal.1961-09-29.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 704–711 (the letter printed in full from the manuscript, signed 8 a.m., Sept. 29; the notes give the papers he sent: Geng Changsuo''s letter of Dec. 30, 1960 to Tan Zhenlin; the Shandong rural work department''s forum views on the commune system; the Hubei committee''s report of Sept. 25; the Handan forum record of Sept. 27; five Hebei papers; Tao Zhu''s Lixi brigade report of Mar. 15, on which Mao had commented; the meeting he proposes, held at Peking Dec. 20, 1961–Jan. 10, 1962)'}
  - cite: {id: cal.1961-09-26.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 740–743 (the "Record of the Handan talk" 《邯郸谈话会记录》, dated Sept. 27, printed in full as an attachment to the Center''s directive of Oct. 7: Liu Zihou 刘子厚, Wang Luming 王路明, Kang Xiumin 康修民, Pang Jun 庞均, Hu Kaiming 胡开明, Liu Qi 刘琦 and Li Yuenong 李悦农 of Hebei; Zhou Xing 周兴 and Cheng Huairen 程怀仁 of Shandong)'}
  - variant: {id: cal.1961-09-26.china-leadership, unit: A, witness: w.jianguo-yilai-zhongyao-wenxian, reads: 'Sept. 27 (一九六一年九月二十七日), the date of the Handan forum''s record, and of the forum Mao called, as the notes give it', at: 'XIV, 740, 708 n.4'}
  - add:
      entry:
        id: cal.1960-12-30.china-leadership-8
        when: Dec. 30
        date: '1960-12-30'
        thread: china-leadership
        c: 'Geng Changsuo 耿长锁, head of Wugong 五公 commune, Shen county 深县, Hebei 河北, writes Tan Zhenlin 谭震林: the commune''s output in 1960 more than 50 percent below 1959, by man as well as by nature: low crops on waterlogged land, sweet potatoes after the wheat at the cost of the fields; procurement raised again and again, rations cut. The members ask that procurement go by standard mu, not by estimates in the field, more grown not more taken; "four contracts and one reward" for the small teams; the movement of draught animals freed.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 706 n.1 (the letter summarized; one of the papers Mao sent the Standing Committee Sept. 29, 1961). Made public: 1997. Sent on: [[cal.1961-09-29.china-leadership]]. Names: Tan Zhenlin.'
        tags: ['polity:prc', 'vis:only:prc', 'name:tan-zhenlin', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-03.china-leadership-31
        when: '1961, March'
        date: '1961-03'
        thread: china-leadership
        c: 'The Shandong 山东 committee''s rural work department 农村工作部 holds four forums on the commune system: county and commune men want the big counties and communes cut down; the small teams want all income, after the state''s quotas and the reserve grain, theirs to divide. Concealed output, theft and slack work spring from the brigade''s pooled distribution among unequal teams; the accounting unit should be the unit that produces, a team of fifty or sixty households, its small groups about ten.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 706–707 n.2 (the department''s "Forum views on the system of the rural people''s communes" 《关于农村人民公社体制问题的座谈意见》, summarized; dated March 1961 in Mao''s letter of Sept. 29, 704). Made public: 1997. Sent on: [[cal.1961-09-29.china-leadership]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-03.china-leadership-32
        when: 'March, late'
        date: '1961-03'
        at: before 1961-03-21
        thread: china-leadership
        c: 'The Zhangjiakou 张家口 prefectural committee approves a trial of the "big contract" in distribution at Guoleizhuang 郭磊庄 brigade, Guoleizhuang commune, Huai''an 怀安 county.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the committee''s report of Aug. 25, 1961). Made public: 1997. The report: [[cal.1961-08-25.china-leadership-8]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-08-12.china-leadership-13
        when: Aug. 12
        date: '1961-08-12'
        thread: china-leadership
        c: 'The Xiaogan 孝感 prefectural committee''s work group reports its inquiry into Jinxiu 锦绣 brigade, Wuchang 武昌 county, Hubei 湖北, trying the production team as the basic accounting unit: "three contracts and one reward" dropped, the team keeping its income after its share to the brigade.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (sent with the Hubei committee''s report of Sept. 25). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-08-17.china-leadership-13
        when: Aug. 17
        date: '1961-08-17'
        thread: china-leadership
        c: 'The Hebei 河北 committee''s work group reports to the committee on the "big contract" in distribution 分配大包干 in the Baoding 保定 district: the brigade fixes its deductions for the year, part to be handed up at a fixed share and the state''s quota apportioned alike; the rest of each team''s income the team divides, more earned more kept. Simpler than "three contracts and one reward" and fairer, the members and cadres for it.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 708–709 n.5 (the first of the five Hebei papers Mao sent the Standing Committee Sept. 29, with inquiry materials on brigades of Tang county and the Baoding district). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-08-18.china-leadership-12
        when: Aug. 18
        date: '1961-08-18'
        thread: china-leadership
        c: 'The Hebei 河北 committee''s work group gives its brief account of the "big contract" in distribution at Zhangxiankou 张显口 brigade, Tonglong 峒龙 commune, Tang 唐 county.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the third of the five Hebei papers). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-08-25.china-leadership-8
        when: Aug. 25
        date: '1961-08-25'
        thread: china-leadership
        c: 'The Zhangjiakou 张家口 prefectural committee reports to Liu Zihou 刘子厚, the Hebei 河北 committee''s acting first secretary, on the trial of the "big contract" in distribution: at Guoleizhuang 郭磊庄 brigade, Huai''an 怀安 county, grain this year 889,467 jin, 26.93 percent up on last year, collective income 21.2 percent up; the members want the contracts renewed, for three years at least.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the fourth of the five Hebei papers). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-09-08.china-leadership-10
        when: Sept. 8
        date: '1961-09-08'
        thread: china-leadership
        c: 'The Baoding 保定 prefectural committee reports to the Hebei 河北 committee on the "big contract" in distribution found in some brigades while the Sixty Articles were carried down: where it is used the "five winds" are slight, output rises year by year; it gives the team more economic power and avoids levelling between teams, within the three-level ownership based on the brigade.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 709 n.5 (the second of the five Hebei papers). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-09-25.china-leadership-9
        when: Sept. 25
        date: '1961-09-25'
        thread: china-leadership
        c: 'The Hubei 湖北 committee asks the Central-South Bureau, and through it the Center and Mao, to try the production team as the basic accounting unit: with the brigade as the unit the levelling between poor and rich teams cannot be solved; trials by the Xiaogan 孝感 prefectural and Jingmen 荆门 county committees since the June three-level conference show it raises the teams'' and members'' zeal; the committee finds the case sound.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (the report summarized, with the Xiaogan work group''s report of Aug. 12 on Jinxiu brigade and the Jingmen work group''s material on Jinshan 金山 brigade). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-10-05.china-leadership-17
        when: Oct. 5
        date: '1961-10-05'
        thread: china-leadership
        c: 'The Shandong 山东 committee reports on "three contracts and one reward", after a forum of the prefectural and city first secretaries: since the Canton conference, with the brigade the accounting unit and pooling, levelling between teams and concealed output; the three contracts do not hold. All but Yantai 烟台 prefecture find handing the accounting unit down to the team inevitable.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 742–743 n.3 (one of the two Shandong papers the Center sent with its directive of Oct. 7). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - cite: {id: cal.1961-10-07.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 738–743 (the directive printed in full, with the Handan record of Sept. 27 attached; sent with five Hebei papers, the Hubei report of Sept. 25 and its two enclosures, two Shandong papers and the Guangdong investigation group''s report of March on the Lixi brigade)'}
  - cite: {id: cal.1961-10-04.china-leadership-4, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 707–708 n.3 (the Hubei committee''s report of Sept. 25 summarized)'}
  - cite: {id: cal.1961-03-16.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 710 n.11 (Tao Zhu''s report of Mar. 15, on which Mao wrote his comment: the Lixi brigade, Dali commune, Nanhai county, after rectification fixes each team''s quota to the brigade, the teams keeping all above it)'}
  - cite: {id: cal.1961-07-17.china-leadership-10, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 714 (the State Planning Commission''s national planning conference, July 17–Aug. 12, as its report of Sept. 29 gives it)'}
  - add:
      entry:
        id: cal.1961-10-06.china-leadership-12
        when: Oct. 6
        date: '1961-10-06'
        thread: china-leadership
        c: 'The Center 中共中央 agrees in the main with the State Planning Commission Party group''s 国家计委党组 report of Sept. 29, "On the supplementary plan (control figures) for the last two years of the second five-year plan" 《关于第二个五年计划后两年补充计划（控制数字）的报告》, and sends it down: the regions, offices and ministries to draft their 1962 plans from below, by Nov. 15. The report, after the national planning conference of July 17–Aug. 12 and the Lushan conference: steel this year about 8.5 million tons, in 1962 7.5 million; pig iron 12 and 10.7 million.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 712–737 (the Center''s comment, Oct. 6, and the report, Sept. 29; the tables left out, 737 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-07-17.china-leadership-10]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-10-07.china-leadership-11
        when: Oct. 7
        date: '1961-10-07'
        thread: china-leadership
        c: 'The Center 中共中央 agrees in principle with the State Planning Commission Party group''s 国家计委党组 "Some rules for improving planning work" 《关于改进计划工作的几项规定》 of September, to be sent to the planning organs at every level and tried.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 744–754 (the Center''s comment, Oct. 7, and the rules, September 1961; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-10-28.china-leadership-3
        when: Oct. 28
        date: '1961-10-28'
        thread: china-leadership
        c: 'The Center 中共中央 forwards, and agrees with, the report of Sept. 27 of the United Front 中央统战部, Organization 中央组织部 and Propaganda 中央宣传部 Departments on the national conference on remolding rightists 《关于全国改造右派分子工作会议的报告》. Its directive: the bourgeois rightists, though handled as an internal matter, stand in an antagonistic contradiction with the working people; the united front departments now in charge of them; labels removed by the standard of 1959, "those who qualify, removed", leniency meaning a batch of those who nearly qualify too. The report: about 100,000 labels removed in 1959 and 1960; over 80 percent of the rest behave well or fairly well; but many units treat them roughly, as if under control or in labor camps, beat and insult them, and discriminate against their families.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 755–762 (the Center''s directive, Oct. 28, and the report, Sept. 27; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-08-28.china-leadership-6]].'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-08-28.china-leadership-6
        when: Aug. 28
        date: '1961-08-28'
        thread: china-leadership
        c: 'The national conference on the work of remolding rightists 全国改造右派分子工作会议 opens, to Sept. 11, with cadres of the Center''s regional bureaus and of the provinces.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 756 (the departments'' report of Sept. 27). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-09-11.china-leadership-6, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 756 (the conference, Aug. 28–Sept. 11, as the departments'' report of Sept. 27 gives it)'}
  - add:
      entry:
        id: cal.1961-11-08.china-leadership-8
        when: Nov. 8
        date: '1961-11-08'
        thread: china-leadership
        c: 'The Center 中共中央 decides to set up the National Defense Industry Office 国防工业办公室 as a "line" of the State Council, answering in the Party to the Secretariat and the Military Commission, to manage the work of the Second and Third Ministries of Machine Building 二机部、三机部 and the National Defense Science Commission: conventional arms, the "sophisticated" weapons, research, cadres, production and building planned as one.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 763–764 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-10-06.china-leadership-9]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-11-14.china-leadership-2, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 765–771 (the "Directive on socialist education in the villages" 《关于在农村进行社会主义教育的指示》, dated Nov. 13, printed in full: the villages better this year than last, the autumn harvests mostly above last year''s, sidelines and handicrafts restored, pigs and poultry growing; the Sixty Articles to be carried further)'}
  - variant: {id: cal.1961-11-14.china-leadership-2, unit: A, witness: w.jianguo-yilai-zhongyao-wenxian, reads: 'the directive dated Nov. 13 (一九六一年十一月十三日)', at: 'XIV, 765'}
  - add:
      entry:
        id: cal.1961-11-17.china-leadership-8
        when: Nov. 17
        date: '1961-11-17'
        thread: china-leadership
        c: 'The Center 中共中央, replying to the Military Commission and the General Political Department 总政治部, approves the four regulations the army political work conference adopted, for the company political instructor, the company Party branch, the Youth League branch and the revolutionary soldiers'' committee, with Xiao Hua''s 肖华 report on carrying out the enlarged Military Commission''s resolution and the "four-good companies", and the conference''s report of Nov. 10. The army''s political work this past year has done well; the deviations of a time are in the main put right.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 772–794 (the Center''s reply, Nov. 17, the conference''s report to the Military Commission and the Center, Nov. 10, and the four regulations; Xiao Hua''s report left out, 794 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-10-18.china-leadership-6]].'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-10-18.china-leadership-6
        when: Oct. 18
        date: '1961-10-18'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The General Political Department 总政治部 opens the all-army political work conference 全军政治工作会议, to Nov. 4: 184 political department heads of the military regions, services, arms and higher schools, the army-level political commissars and some divisions'', on the enlarged Military Commission''s resolution on political work, the "four-good companies" and the companies'' political work.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 773 (the conference''s report of Nov. 10). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-11-01.china-leadership-5, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 773 (the all-army political work conference, Oct. 18–Nov. 4, in Peking, as its report of Nov. 10 gives it)'}
  - add:
      entry:
        id: cal.1961-11-23.china-leadership-7
        when: Nov. 23
        date: '1961-11-23'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Directive on timber production and afforestation" 《关于木材生产和造林问题的指示》: timber in 1961 and the plan for 1962, 24.5 million cubic meters, below the average of 1958–60, 40.73 million; pit props, sleepers and paper wood short, coal and paper down with them, rotten sleepers slowing the trains.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 795–797 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-11-23.china-leadership-5]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-11.china-leadership, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 798–803 (the Center''s comment of Nov. 23, "very good", to go down to the prefectures, counties and communes for reference; each provincial first secretary to spend ten days in the villages by Deng''s method before Dec. 20; and Deng Zihui''s report of Nov. 9, from Longyan, to the Center and the Chairman, printed in full: trials at Baitu, Houtian and other brigades and at Beicun, Lianchenger; cadres and masses all for handing the accounting unit down)'}
  - add:
      entry:
        id: cal.1961-10-24.china-leadership-6
        when: Oct. 24–28
        date: '1961-10-24'
        place: [peking, longyan]
        thread: china-leadership
        c: 'Deng Zihui 邓子恢 leaves Peking 北京 for the south; at Zhengzhou 郑州 and Nanchang 南昌 he hears the Henan and Jiangxi rural work departments on the trials of the basic accounting unit; he reaches Longyan 龙岩, Fujian, the evening of Oct. 28.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 799 (his report of Nov. 9). The words: 二十八日晚 (799). Made public: 1997. See [[cal.1961-11.china-leadership]].'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1961-11-23.china-leadership-3, item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 804–805 (Deng Xiaoping''s speech at the Secretariat on the metallurgical industry''s seven-year plan, printed from *Deng Xiaoping wenxuan*, I, as "Promote young technical cadres in large numbers" 《大批提拔年轻的技术干部》: too little care for technical cadres; graduates still trainees after years; promote men in their twenties and thirties)'}
  - check: {id: cal.1961-11-23.china-leadership-3, text: 'Check: Made public: [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (1989) may print Deng''s speech, which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 804–805 prints from *Deng Xiaoping wenxuan*, I.'}
  - add:
      entry:
        id: cal.1961-11-26.china-leadership-2
        when: Nov. 26
        date: '1961-11-26'
        thread: china-leadership
        c: 'The Center 中共中央 agrees with the Organization Department''s 中央组织部 report of Nov. 8, "On strengthening the education and management of Party members" 《关于加强对党员的教育管理工作的报告》: with the cadres taught afresh, the members too; no large intake of new members, quality first. The report: at the end of June 1961 the Party had 17.38 million members in 1.33 million basic organizations; 6.42 million members and 500,000 organizations added since 1958.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 806–814 (the Center''s comment, Nov. 26, and the report, Nov. 8; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-12-05.china-leadership-7
        when: Dec. 5
        date: '1961-12-05'
        thread: china-leadership
        c: 'The Center 中共中央, answering the Northeast Bureau''s 东北局 telegram, agrees that Shenyang 沈阳 may take 5 percent of the profits of its state industry, retail trade and public utilities as funds for city building, on trial from 1962; railways, posts, banks and first-grade wholesale stations excepted; the money for water, drains, roads, bridges, flood works, city buses and gas.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 815–816 (to the Northeast Bureau and the Planning Commission, the Finance Ministry and the Ministry of Building; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-12-06.china-leadership-6
        when: Dec. 6
        date: '1961-12-06'
        thread: china-leadership
        c: 'The Center 中共中央 approves and forwards the "Minutes of the first nationalities work conference of the Northwest" 《西北地区第一次民族工作会议纪要》 the Northwest Bureau 西北局 sent Oct. 30: the experience of the Tibetan areas of Qinghai 青海 and Gansu 甘肃 shows again that to neglect the nationalities question in the socialist revolution and construction is wrong. The minutes: grave errors in the Qinghai and Gansu Tibetan areas since 1958; Han chauvinism; the pastoral communes to be small, set up by the old tribes, the team the accounting unit; Tibetans who still hold some religious belief may be admitted to the Party there, by the Center''s reply of Feb. 14.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 817–844 (the Center''s comment, Dec. 6, and the minutes, Aug. 4; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-07-11.china-leadership-4]].'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-07-11.china-leadership-4
        when: July 11
        date: '1961-07-11'
        place: lanzhou
        thread: china-leadership
        c: 'Lanzhou 兰州. The Northwest Bureau 西北局 opens the first nationalities work conference of the Northwest, to Aug. 4: the pastoral areas and their communes since 1958, and the carrying out of the Party''s nationality and religious policies.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 819 (the conference''s minutes of Aug. 4). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-02-14.china-leadership-9
        when: Feb. 14
        date: '1961-02-14'
        thread: china-leadership
        c: 'The Center 中共中央 replies to the Tibet Work Committee''s 西藏工委 "Opinions on some questions of policy in building the Party in society" 《对社会上建党工作中一些带政策界限问题的意见》: Tibetan working people and revolutionary intellectuals who ask to join the Party may be admitted though they keep some religious belief and feeling, if otherwise fit, loyal and disciplined, and are then to be educated out of it.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 840–841 (named and its rule given in the Northwest minutes of Aug. 4, 1961). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc', 'ok:fields-place']
  - add:
      entry:
        id: cal.1961-12-11.china-leadership-5
        when: Dec. 11
        date: '1961-12-11'
        thread: china-leadership
        c: 'The Center 中共中央 and the State Council 国务院 approve and issue the Ministry of National Defense''s 国防部 "Regulations on militia work" 《民兵工作条例》 of July 13, and give notice that, as the Military Commission''s militia work group has become its People''s Armed Forces Committee 人民武装委员会, the militia work groups at the county level and above become people''s armed forces committees, with committees set up under the Party committees of communes and large factories and mines.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 845–857 (the notice, Dec. 11, and the regulations, July 13; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-12-18.china-leadership-5
        when: Dec. 18
        date: '1961-12-18'
        thread: china-leadership
        c: 'The Center 中共中央 agrees with the Ministry of Water Conservancy and Electric Power Party group''s 水利电力部党组 report of Nov. 25, "On present water conservancy work" 《关于当前水利工作的报告》, and its ten points on water management: water and fertilizer still the means of more output for some years; the unfinished new works to be completed and matched, the resettled people''s problems settled, management strengthened. The report: irrigable land 240 million mu in 1949 and 450 million in 1957; over a billion counted in 1960, 670 million effective by the provinces'' first check.'
        n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 858–865 (the Center''s comment, Dec. 18, and the report, Nov. 25; the ten points left out, 865 n.1; printed from the Central Committee''s document). Made public: 1997.'
        tags: ['polity:prc', 'vis:only:prc']
