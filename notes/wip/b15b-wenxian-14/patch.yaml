- edit:
    id: cal.1961-03-13.china-leadership
    base: 863124d6
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 42–43 (Mao''s letter on the two egalitarianisms); [[w.jianguo-yilai-mao-zedong]], XV, 501–503 (Mar. 13, 1961; Mao''s letter of Mar. 13, 8 a.m., Canton, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Peking conference, carried by Tao Zhu, who goes and returns the next day; Liao Luyan to go north in a few days; the conference of three days too short, five to seven needed; printed from the Center''s document (with the manuscript)); [[w.deng-xiaoping-nianpu-1904]], III, 1622 (Mar. 13, 1961; Mao''s letter to Liu, Zhou, Chen Yun, Deng, Peng Zhen and the Three North conference: the two egalitarianisms, between teams and within the team, "extremely grave"; Deng and Peng Zhen to spend ten days after the meeting at Miyun, Shunyi and Huairou, each level apart; "busy with routine", no typical inquiry in person; Tao Zhu to come to Peking (footnote 1: Tao, then first secretary of the Central-South Bureau and in Guangdong)); [[w.mao-zedong-zhuan]], V, ch. 67 n.26 (Mar. 13, early morning, the letter to Liu Shaoqi and the others: to study the two egalitarianisms, among teams of a brigade and among members of a team; Tao Zhu sent to the Peking meeting; Deng Xiaoping and Zhou Enlai propose joining the two meetings, Mao agrees, at Canton, and Tao Zhu does not go). [[w.peng-zhen-nianpu-1902]], IV, 112 (Mar. 13, 1961; Peng Zhen receives Mao''s letter on the two egalitarianisms, between teams within a brigade and between persons within a team, "两个极端严重的大问题"; Deng and Peng to take some ten days after the meeting to investigate at Miyun, Shunyi, Huairou and elsewhere, level by level, not all together); [[w.chen-yun-nianpu-xiuding]], III, 78 (Mao''s letter on egalitarianism in the communes, routine and investigation, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, moving them to Canton). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 440–41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24a); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24b); [[w.jin-1949-1989-niande-zhongguo]], 376 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 904–05 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24d); Mao Zedong 毛泽东, letter to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the comrades at the Peking meeting, Mar. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 250 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.26). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Tao Zhu.'
