- add:
    entry:
      id: cal.1960-12-30.china-leadership-9
      when: Dec. 30
      date: '1960-12-30'
      thread: china-leadership
      c: 'The Ministry of Light Industry Party group 轻工业部党组 reports to the Center 中共中央 and the Chairman, "On the urgent arrangement of the production of daily-use industrial goods (chiefly small goods)" 《关于紧急安排日用工业品（主要是小商品）生产的报告》: pots, basins, bowls, chopsticks, needles, salt and matches short since the second quarter of 1960, some sold out, the ministry owning its share of the blame; salt, matches, pottery and small hardware given emergency arrangement, 7,500 tons of rolled steel for small hardware in eleven key areas.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 12–18 (printed after the Center''s comment of Jan. 7, 1961; from the Central Committee''s document). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-12-31.china-leadership-9
      when: Dec. 31
      date: '1960-12-31'
      thread: china-leadership
      c: 'The Ministry of Finance Party group 财政部党组 reports to the Center 中共中央, "On improving the financial system and strengthening financial management" 《关于改进财政体制、加强财政管理的报告》: the provinces'' financial powers, profit retention and lump-sum building budgets widened since 1958; financial power now to be gathered to the Center, the regional bureaus and the provinces.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 48–58 (printed after the Center''s comment of Jan. 15, 1961). Made public: 1997. Sent on: [[cal.1961-01-15.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
