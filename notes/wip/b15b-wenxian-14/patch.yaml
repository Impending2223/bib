      thread: china-leadership
      c: 'The Liaoning Fine Arts Publishing House 辽宁美术出版社 publishes *Xiongxin zhuangzhi* 《雄心壮志》: Xu Zhi 徐志, physician of the Lüda 旅大 Second Hospital, treats cancer by Mao Zedong Thought, giving medicine by "guerrilla tactics," two days on and two days off.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 218 (the Propaganda Department''s report of Feb. 23, 1961, which names it among the faults in the propaganda of Mao Zedong Thought).'
