- cite:
    id: cal.1961-01-01.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 1–10 (the editorial printed in full: in 1960 China opened relations with Cuba, Ghana, Mali and Somalia, and signed treaties of friendship and non-aggression or of peace and friendship with Burma, Nepal, Afghanistan, Guinea and Cambodia)'
- add:
    entry:
      id: cal.1961-01-07.china-leadership-15
      when: Jan. 7
      date: '1961-01-07'
      thread: china-leadership
      c: 'The Center 中共中央 forwards to the regional bureaus and the provincial committees the Ministry of Light Industry Party group''s 轻工业部党组 report of Dec. 30, 1960, "On the urgent arrangement of the production of daily-use industrial goods (chiefly small goods)" 《关于紧急安排日用工业品（主要是小商品）生产的报告》. Its comment: in many places salt, matches, pots, basins, bowls and chopsticks cannot be bought; the shortage comes mainly from the leadership''s failure to arrange, not from the bad harvests. The report: small goods to be written into the state and local plans, their materials supplied, their factories fixed. Sent down to the county and regiment level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 11–18 (the Center''s comment, Jan. 7, 1961, and the report, Dec. 30, 1960; printed from the Central Committee''s document). Made public: 1997. See [[cal.1960-12-30.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 19–46 (Li Fuchun''s report of Jan. 14 to the plenum, "Opinions on arranging the national economic plan for 1961" 《关于安排一九六一年国民经济计划的意见》, printed in full: industrial output in 1960 214 billion yuan, 4 billion over the plan, 26 percent over 1959''s actual figure; for 1961 coal 436 million tons, iron 27.5 million, steel 19 million; industrial output about 231 billion yuan, 8 percent up)'
- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 75–77 (the plenum''s resolution of Jan. 18 on setting up the Center''s bureaus 《关于成立中央局的决议》, printed in full: the Politburo''s decision of 1960 approved; six bureaus, North China, the Northeast, East China, the Central-South, the Southwest and the Northwest, each to build a fairly complete economic system for its region; sent to the provincial and municipal committees'' secretariats and the central departments'' Party groups)'
- cite:
    id: cal.1961-01-15.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 47–58 (the Center''s comment and the Finance Ministry Party group''s report of Dec. 31, 1960, "On improving the financial system and strengthening financial management" 《关于改进财政体制、加强财政管理的报告》, printed in full: financial power gathered to the Center, the regional bureaus and the provinces, "the whole country one chessboard"; no working funds for capital construction, no bank credit for fiscal spending; the measures not to be changed by any region or department on its own)'
- cite:
    id: cal.1961-01-15.china-leadership-9
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 59–66 (the Center''s comment and the Grain Price Small Group''s 粮价问题小组 report of Jan. 9, printed in full: the group set up under Chen Yun during the work conference; purchase prices up 20 percent from the summer harvest and the 5 percent bonus of 1960 kept, 25 percent in all, sale prices not raised for now; meat, eggs, oil, cotton, tobacco, hemp, tea, sugar, timber and bamboo to follow in two years; 150,000 tons more rolled steel and 10 million dollars more foreign exchange for the market; the document not to go down as written, the figures of the currency issued struck out)'
- cite:
    id: cal.1961-01-09.china-leadership-13
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 60–66 (the report, "On raising the purchase price of grain" 《关于提高粮食收购价格问题的报告》, Jan. 9, 1961, to the Chairman and the Center, printed in full with the Center''s comment of Jan. 15)'
- add:
    entry:
      id: cal.1961-01-15.china-leadership-10
      when: Jan. 15
      date: '1961-01-15'
      thread: china-leadership
      c: 'The Center 中共中央 issues its "Provisions on some questions of policy in the present procurement of farm products" 《关于目前农产品收购工作中几个政策问题的规定》: estimates too high, quotas too big, too much bought and too little left, a root of the "communist wind" and commandism. Farm products in three classes: grain, cotton and edible oil bought and sold by the state alone; a second class bought by contract; the rest bought and sold freely. Surplus over the quota may be sold at the rural markets the state names; the rural markets to be led and managed, no buying to resell.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 67–74 (printed from the Central Committee''s document, with its table of the three classes). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-01-19.china-leadership-8
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 78–82 (printed in full as "In arranging the market, leave one side of the net open" 《安排市场要网开一面》, from *Chen Yun wenxuan*, III; the note: Chen Yun''s speech to the Central Work Conference)'
- cite:
    id: cal.1961-01-21.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 83–88 (the communiqué 《中国共产党第八届中央委员会第九次全体会议公报》, dated Jan. 20, printed from *Renmin ribao* of Jan. 21: the plenum met in Peking Jan. 14–18, Mao presiding; 83 members and 87 alternates; 23 others attended)'
- add:
    entry:
      id: cal.1961-01-20.china-leadership-13
      when: Jan. 20
      date: '1961-01-20'
      thread: china-leadership
      c: 'The Center 中共中央 issues the "Minutes of the Central Work Conference''s discussion of rural rectification and some questions of policy" 《中央工作会议关于农村整风整社和若干政策问题的讨论纪要》. The conference, opened at Peking Dec. 24, 1960, finds the rural situation "very good": about 80 percent of counties, communes and brigades good or basically good, about 20 percent with grave problems; over 90 percent of cadres good or basically good, nearly 7 percent with grave or fairly grave errors, about 3 percent "five-category elements" or degenerates. Xinyang''s 信阳 experience shows a bad area can be turned round in a few months.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 89–101 (printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-13.china-leadership-4]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- cite:
    id: cal.1961-01-20.china-leadership-12
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 102–105 (printed in full: by "great power concentrated, small power dispersed", economic power to the Center, the regional bureaus and the provinces, for two or three years more to the Center and the bureaus; the powers over men, money, trade and industry handed down since 1958 wrongly taken back)'
- cite:
    id: cal.1961-01-20.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 102–105 (the "Provisional regulations on adjusting the system of management" 《关于调整管理体制的若干暂行规定》, printed in full)'
- cite:
    id: cal.1961-01-20.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 (the letter printed in full, from *Mao Zedong shuxin xuanji*)'
- add:
    entry:
      id: cal.1961-01-21.china-leadership-11
      when: Jan. 21
      date: '1961-01-21'
      thread: china-leadership
      c: 'The Center 中共中央 forwards Nie Rongzhen''s 聂荣臻 report of Jan. 7, to Li Fuchun 李富春 and Deng Xiaoping 邓小平 and the Secretariat, "On the arrangement of science and technology work in 1961 and 1962" 《关于一九六一、一九六二年科学技术工作安排的报告》, with his outline: the ministries and regions to write science and technology into the economic plan. Sent down to the province and army level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 108–120 (the Center''s comment, the report and the outline; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-07.china-leadership-16]]. Names: Nie Rongzhen, Li Fuchun, Deng Xiaoping.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:nie-rongzhen
      - name:li-fuchun
      - name:deng-xiaoping
- cite:
    id: cal.1961-01-23.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 121–125 (the decision of the Center and the State Council 《关于进一步压缩社会集团购买力的决定》, printed in full: from about 8 billion yuan in 1960 to about 5 or 4 billion, a cut of 40 to 50 percent; a year''s ban on buying sofas, carpets, cars, motorcycles, bicycles, television sets, cameras, typewriters, fans and other non-productive goods)'
- cite:
    id: cal.1961-01-31.china-leadership-8
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 126–143 (the Center''s comment and the Hubei committee''s report of Jan. 25 to the Central-South Bureau, the Center and the Chairman, printed in full; the comment: the report very good, to be read several times; sent down to the county and regiment level)'
- add:
    entry:
      id: cal.1961-01-31.china-leadership-14
      when: Jan. 31
      date: '1961-01-31'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the report of Nov. 15, 1960 of the Party group of the former State Capital Construction Commission 国家基本建设委员会, "On saving land in capital construction" 《关于基本建设节约用地问题的报告》: from 1953 to 1959 construction took 94.65 million mu of farmland, water conservancy over 64.8 million of it (68 percent); too much taken, too early, good land for bad. Its comment: every building and land department to check its land; land not used, or not used for now, to be given back before the spring ploughing.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 144–150 (the Center''s comment and the report; printed from the Central Committee''s document; the summary of eight provinces'' reports on wasted land, named in the report, left out, 150 n.1). Made public: 1997. See [[cal.1960-11-15.china-leadership-17]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-02-01.china-leadership-5
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 151–161 (the Center''s comment and the report of Jan. 20, printed in full: the report "very good, very important"; first secretaries to take charge; edema and the malnutrition of women and children to be checked in two or three months, so that healthy labor goes into the spring ploughing; disease work among the Party''s most important tasks this year, Party committees to take it up at least four times, the disaster areas once a month; the report follows the national meeting of health department and bureau heads at Peking, Jan. 5–15)'
- add:
    entry:
      id: cal.1961-02-04.china-leadership-12
      when: Feb. 4
      date: '1961-02-04'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Ministry of Railways Party group''s 铁道部党组 report of Jan. 26, "On setting up political work departments in the railway system and improving the railway management system" 《关于在铁路系统建立政治工作部门和改进铁路管理体制的报告》, to be carried out. Its comment: the railways, the economy''s great artery and half military, are to be wholly under the ministry, in production, materials, funds, equipment and cadres; the ministry''s Party group becomes a Party committee; its political department, the Center''s organ for Party work in the railways, under that committee; the bureaus'' Party committees and political departments under the ministry''s and the regional and provincial committees'' dual leadership, the ministry''s first.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 162–167 (the Center''s comment, Feb. 4, and the report, Jan. 26; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-26.china-leadership-8]], [[cal.1961-02-02.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-07.china-leadership-10
      when: Feb. 7
      date: '1961-02-07'
      thread: china-leadership
      c: 'The Center 中共中央 approves the Finance and Trade Office''s 财贸办公室 report of Jan. 18, "Request for instructions on some questions of foreign trade in 1961" 《关于一九六一年对外贸易若干问题的请示报告》, and its foreign trade plan for 1961: purchases 7.31 billion yuan, exports 5.67 billion, imports 4.924 billion. Its comment: only by squeezing out goods for export can grain, fertilizer, pesticides, medicines and steel be imported; imports in order of need, grain first.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 180–187 (the Center''s comment, Feb. 7, and the report, Jan. 18; two attachments left out, 187 nn.1–2; printed from the Central Committee''s document). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-01.china-leadership-14
      when: Mar. 1
      date: '1961-03-01'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the experience of rectification at Tanzhou 坦洲 commune, Zhongshan 中山 county, Guangdong 广东, with the Central-South Bureau''s 中南局 comment of Feb. 9 to the Guangdong, Hunan, Hubei, Henan and Guangxi committees, "A fairly successful experience" 《一个比较成功的经验》: for the communes of the first and second class a fuller and healthier experience, a guiding document. The rectification to go deep, not in haste; with the spring ploughing begun, production first, rectification in the slack. Sent down to the county and regiment level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 188–214 (the Center''s comment, Mar. 1, the bureau''s comment, Feb. 9, and the commune''s experience; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-01-31.china-leadership-8]], [[cal.1961-02-09.china-leadership-8]]; the comment as Liu Shaoqi drafted it, [[cal.1961-02-26.china-leadership-3]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- cite:
    id: cal.1961-03-13.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216 (the letter printed in full, signed 8 a.m., Mar. 13, Canton; the notes: the Peking meeting the conference of the North China, Northeast and Northwest bureaus and provinces that Liu Shaoqi and Zhou Enlai had called, the "Three North" conference; Mao at Canton with the Central-South, Southwest and East China, the "Three South"; Tao Zhu sent that day to report)'
- add:
    entry:
      id: cal.1961-03-25.china-leadership-6
      when: Mar. 25
      date: '1961-03-25'
      thread: china-leadership
      c: Mao's 毛泽东 letter of Mar. 13 on the two egalitarianisms is printed and sent to the provincial committees' standing committees, the ministers of the Center's departments and the secretaries of the central state organs' Party groups.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 216 n.1. Made public: 1997. See [[cal.1961-03-13.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1961-03-15.china-leadership-11
      when: Mar. 15
      date: '1961-03-15'
      thread: china-leadership
      c: 'The Center 中共中央 forwards, and agrees with, the Propaganda Department''s 中央宣传部 report of Feb. 23, "On some problems in the propaganda of Mao Zedong Thought and of the leader''s revolutionary deeds" 《关于毛泽东思想和领袖革命事迹宣传中一些问题的检查报告》: Mao Zedong Thought vulgarized, a table-tennis player''s and a doctor''s methods put down to it; untrue stories of the leader printed; too many trifles of his life. Sent down to the county and regiment level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 217–220 (the Center''s comment, Mar. 15, and the report, Feb. 23; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-02-23.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-03-22.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 221–224 (the Center''s letter of Mar. 22 to all comrades 《关于讨论〈农村人民公社工作条例（草案）〉给全党同志的信》, printed in full: the draft sent to every rural branch and to all commune members; the problems: egalitarianism between teams and between members, communes too big in many places; the note: the draft adopted by the work conference Mar. 22, revised by the conference of May 21–June 12, and the revised draft approved by Mao June 15)'
- cite:
    id: cal.1961-03-23.china-leadership-3
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 225–227 (the letter printed in full: Mao''s "On investigation work" of spring 1930, newly found, to be studied by the Party''s higher and middle cadres; the note: the essay is "Oppose book worship", left out, and gives Mao''s comment on it of Mar. 11)'
- cite:
    id: cal.1961-03-11.china-leadership
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 227 n.1 (Mao''s comment printed in full: an old essay against dogmatism in the Red Army, then called "book worship"; written about spring 1930, unseen thirty years, found in January 1961 at the Central Revolutionary Museum, which had it from the Longyan prefectural committee in Fujian; some copies to be printed for comrades)'
- add:
    entry:
      id: cal.1961-04-03.china-leadership-15
      when: Apr. 3
      date: '1961-04-03'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the report of Mar. 25 of the Party groups of the State Planning Commission 国家计委 and the State Economic Commission 国家经委 on saving coal, to be carried out at once. Its comment: the want of fuel the most glaring problem in the economy; in the long run more oil, water power and other fuels and less coal; for now better coal, rational supply, lower coal norms. The departments and provinces to set saving targets, the Planning Commission to balance them.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 228–233 (the Center''s comment, Apr. 3, and the report, Mar. 25; the editors'' note corrects the report''s figure for thermal power to 543 kg of standard coal per 1,000 kWh, from the Coal Ministry''s policy research office, 233 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-03-25.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-03.china-leadership-16
      when: Apr. 3
      date: '1961-04-03'
      thread: china-leadership
      c: 'The Center 中共中央 issues its "Directive on grain rewards in the purchase of important industrial crops" 《关于收购重要经济作物实行粮食奖励的指示》: with grain short and the villages on "low rations, melons and vegetables in place of grain", peasants who grow the important industrial crops are to be rewarded in grain. Brigades growing them chiefly are assured the rations of the nearby surplus-grain teams, and besides receive reward grain, paid for at the state sale price, by the amount they sell: cotton, the main oil-seeds, flue-cured tobacco, hemp, tea, silkworm cocoons, sugar crops and some export fruit, medicinal herbs and local products, for the grain year July 1961–June 1962.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 234–237 (printed from the Central Committee''s document; the two tables of reward grain by province and of reference norms left out, 237 n.1). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-04-03.china-leadership-5
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 238–253 (an extract of the report, "Some tasks in our present construction" 《当前建设中的几项任务》, printed from [[w.zhou-enlai-jingji-wenxuan]]: first to pass the barrier of agriculture, the base of the economy, with over 500 million in the villages)'
- add:
    entry:
      id: cal.1961-04-09.china-leadership-8
      when: Apr. 9
      date: '1961-04-09'
      thread: china-leadership
      c: 'The Center 中共中央 approves the 1961 capital construction plan the State Planning Commission''s 国家计划委员会 Party group redrew after the Ninth Plenum and forwards its report of Apr. 2, "On arranging the capital construction plan for 1961" 《关于安排一九六一年基本建设计划的报告》, to be carried out at once: investment 12.9 billion yuan, 21.6 billion less than the 34.5 billion of the 1960 state plan; 771 large and medium projects under way and 325 kept on a small scale, 1,096 in all, 739 fewer than in 1960. Every unit, building, kept or stopped, to explain the reasons to its people; the Planning Commission, the provinces and the big central departments to set up command organs for capital construction in April. Sent down to the province level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 254–273 (the Center''s comment, Apr. 9, and the report, Apr. 2; eight enclosures left out, 273 n.1; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-02.china-leadership-8]], [[cal.1961-04-06.china-leadership-2]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-09.china-leadership-9
      when: Apr. 9
      date: '1961-04-09'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the report of Apr. 4 of its five-man group on cutting cadres and arranging labor 中央精简干部和安排劳动力五人小组, "On adjusting rural labor and cutting and sending down staff" 《关于调整农村劳动力和精简下放职工问题的报告》, and agrees with it: more labor for farming, more staff cut and sent down, the cities'' population pressed down. The report: the provinces plan to cut 5.28 million staff from September 1960 to the end of 1961, 2.28 million of them sent home to the villages without pay and 3 million down to the villages with pay; 4,106,000 cut by the end of February or mid-March. Sent down to the province level.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 274–287 (the Center''s comment, Apr. 9, and the report, Apr. 4; printed from the Central Committee''s document). Made public: 1997. See [[cal.1961-04-04.china-leadership-12]], [[cal.1961-04-07.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- cite:
    id: cal.1961-04.china-leadership-10
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 288–298 (the Center''s "Directive on the guiding line of the work in Tibet" 《关于西藏工作方针的指示》, Apr. 21, to the Tibet Work Committee and the Southwest Bureau, printed in full: the rebellion of March 1959 put down and democratic reform done in the main in two years; for five years from 1961 no socialist transformation, no cooperatives, not even trials, still less communes; the peasants'' and herdsmen''s individual ownership to settle; against the "left" and haste)'
- cite:
    id: cal.1961-04-26.china-leadership-2
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–315 (the Center''s forwarding of Apr. 26, on Mao''s instruction, of Hu Qiaomu''s letter and four enclosures on the mess halls, for reference, the bureaus and committees to decide whether to pass them down, with Mao''s comment of Apr. 15; Hu''s letter of Apr. 14 to Mao, from Shaoshan 韶山: the Shaoshan brigade to meet Apr. 16 on mess halls, hills and woods, houses and quotas; at Xiangxiang 湘乡, three brigades of the former Dongjiao commune 707 dead from October 1958 to March 1961, 13.5 percent of their people, and in two brigades nearby the deaths over three years about 20 percent)'
