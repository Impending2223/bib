    entry:
      id: cal.1960-01-25.china-leadership-4
      when: Jan. 25
      date: '1960-01-25'
      thread: china-leadership
      c: '*Tiyu bao* 体育报 prints "Zhuang Jiafu forges ahead on the red and expert road" 《庄家富在红专道路上前进》: the table-tennis player''s plan for the Leap, to read through the *Selected Works*'' 毛泽东选集 parts on strategy and tactics and create a Chinese shakehand play.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 218 (the Propaganda Department''s report of Feb. 23, 1961, which names it among the faults in the propaganda of Mao Zedong Thought). To check: *Tiyu bao*, Jan. 25, 1960.'
      tags:
      - polity:prc
