      set:
        n: '[[w.yang-jisheng-mubei]], II, 760–761. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 310–315). To check: Hu Qiaomu 胡喬木 and others, "Guanyu zai Shaoshan gongshe jiejue shitang wenti de baogao" 《關於在韶山公社解決食堂問題的報告》, Apr. 10, 1961 (cited by [[w.yang-jisheng-mubei]], II, 742 n.9; I, 761 n.47, n.48). See [[cal.1961-04-15.china-leadership-5]].'
