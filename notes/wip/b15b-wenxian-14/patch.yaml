    base: 5121ce0f
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 30–31 (May 9, 1961); [[w.mao-zedong-zhuan]], V, ch. 68 n.11 (May 8, Hu Qiaomu''s letter: Shaoshan''s mess halls cut from 112 to 6, five of them soon to close, in three days; the people call it a second liberation; Mao sends it round at 3 a.m. May 9). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320). To check: Hu Qiaomu to Mao, May 8, 1961 (cited at [[w.jianguo-yilai-mao-zedong]], XVI, 30 n.1); Hu Qiaomu 胡乔木, letter to Mao Zedong (original 原件), May 8, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.11). Names: Mao Zedong, Hu Qiaomu. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
- edit:
    id: cal.1961-05-06.china-leadership-3
    base: 352137cc
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 24–25 (May 6, 1961); [[w.mao-zedong-zhuan]], V, ch. 68 n.9 (May 6, from Shanghai: Mao to Li Jingquan and Chen Zhengren, whose letter from a commune in Jianyang, Sichuan, pleased him; the Center''s list of topics sent Apr. 25, the May 4 notice putting the conference off to May 20; the first secretaries to go to the villages). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317). To check: Mao Zedong 毛泽东, letter to Li Jingquan 李井泉 and Chen Zhengren 陈正人 (manuscript 手稿), May 6, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.9). Names: Mao Zedong, Li Jingquan, Chen Zhengren. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 2023.'
- edit:
    id: cal.1961-03-11.china-leadership
    base: d50b6f23
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 11, 1961. [[w.jianguo-yilai-mao-zedong]], XV, 499–500 (Mar. 11, 1961; Mao''s note of Mar. 11 on ''Investigation work'': an old piece against dogmatism in the Red Army, called ''book worship'', written about spring 1930, unseen thirty years, found in January 1961 at the Central Revolutionary Museum, which had it from the Longyan prefectural committee in Fujian; copies to be printed; and his note to Lin Biao the same day; the editors (500 n.1): a lithographed copy given by a peasant of Shanghang county in 1957, sent to the museum in August 1959, lent to the Political Research Office at the end of 1960; printed from the manuscript); [[w.mao-zedong-zhuan]], V, ch. 67 n.25 (Mar. 11, the note printed for the Three South conference on "Investigation work" (about spring 1930), found in January at the Revolutionary Museum from Longyan, Fujian). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 227 n.1). To check: Mao Zedong 毛泽东, note on "Investigation work" 《调查工作》 (manuscript 手稿), Mar. 11, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.25). Names: Mao Zedong.'
