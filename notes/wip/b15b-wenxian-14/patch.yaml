      when: Jan. 25
      date: '1961-01-25'
      thread: china-leadership
      c: The Hubei 湖北 committee reports to the Central-South Bureau 中南局, the Center 中共中央 and the Chairman on the second stage of rectification at Tonghaikou 通海口 commune, Mianyang 沔阳 county 《关于沔阳县通海口公社整风整社第二阶段的总结报告》.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 126–143 (printed after the Center''s comment of Jan. 31). Made public: 1997. Sent on: [[cal.1961-01-31.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-11-15.china-leadership-17
      when: Nov. 15
      date: '1960-11-15'
      thread: china-leadership
      c: 'The Party group of the State Capital Construction Commission 国家基本建设委员会党组 reports to the Secretariat 中央书记处, on the Premier''s instruction, "On saving land in capital construction" 《关于基本建设节约用地问题的报告》: from 1953 to 1959 building took 94.65 million mu of farmland, water conservancy over 64.8 million of it (68 percent); in 1958 and 1959 alone 80.4 million, 5.7 times the First Plan''s; too much taken, too early, good land for bad.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 145–150 (printed after the Center''s comment of Jan. 31, 1961). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-01-26.china-leadership-8
      when: Jan. 26
      date: '1961-01-26'
      thread: china-leadership
      c: 'The Ministry of Railways Party group 铁道部党组 reports to Deng Xiaoping 邓小平 and the Secretariat 中央书记处, on Deng''s instruction, "On setting up political work departments in the railway system and improving the railway management system" 《关于在铁路系统建立政治工作部门和改进铁路管理体制的报告》: the railways'' political departments, abolished in 1957, to be set up again.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 163–167. Made public: 1997. Names: Deng Xiaoping.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:deng-xiaoping
- add:
    entry:
      id: cal.1961-02-09.china-leadership-8
      when: Feb. 9
      date: '1961-02-09'
      thread: china-leadership
      c: 'The Central-South Bureau 中南局 sends the Guangdong 广东, Hunan 湖南, Hubei 湖北 and Henan 河南 committees and the Guangxi 广西 committee, and the Center 中共中央 and the Chairman, its comment on the rectification at Tanzhou 坦洲 commune, Zhongshan 中山 county, "A fairly successful experience" 《一个比较成功的经验》: after Tonghaikou 通海口, the region''s fairly successful experience for communes of the first and second class; rectification to go deep, not in haste; Henan may take a year.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 189–190. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-23.china-leadership-9
      when: Feb. 23
      date: '1961-02-23'
      thread: china-leadership
      c: 'The Propaganda Department 中央宣传部 reports to the Center 中共中央 on its check of the propaganda of Mao Zedong Thought and the leader''s revolutionary deeds 《关于毛泽东思想和领袖革命事迹宣传中一些问题的检查报告》: works already printed, memoirs among them, to be checked, some withdrawn, some revised; such articles and books henceforth to pass the provincial committee or the central department.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 217–220. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-25.china-leadership-8
      when: Mar. 25
      date: '1961-03-25'
      thread: china-leadership
      c: 'The Party groups of the State Planning Commission 国家计划委员会 and the State Economic Commission 国家经济委员会 report to the Center 中共中央 on saving coal: in the Leap coal output rose nearly 100 million tons a year; production and supply strained since.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 229–233. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-02.china-leadership-8
      when: Apr. 2
      date: '1961-04-02'
      thread: china-leadership
      c: 'The State Planning Commission Party group 国家计划委员会党组 reports to the Center 中共中央, "On arranging the capital construction plan for 1961" 《关于安排一九六一年基本建设计划的报告》, redrawn after the Ninth Plenum: farming, light industry and heavy industry in that order; adjusting, consolidating, filling out and raising.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 257–273. Made public: 1997. See [[cal.1961-04-06.china-leadership-2]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-04.china-leadership-12
      when: Apr. 4
      date: '1961-04-04'
      thread: china-leadership
      c: 'The Center''s five-man group on cutting cadres and arranging labor 中央精简干部和安排劳动力五人小组 reports to the Center 中共中央, "On adjusting rural labor and cutting and sending down staff" 《关于调整农村劳动力和精简下放职工问题的报告》: by twenty-six provinces'' reports, 29.13 million workers drawn to the farming front from autumn 1960 to the end of November.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 275–286. Made public: 1997. See [[cal.1961-04-02.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-10.china-leadership-10
      when: Apr. 10
      date: '1961-04-10'
      thread: china-leadership
      place: shaoshan
      c: 'Shaoshan 韶山 commune''s briefing on its discussion of the draft Working Regulations for the Rural People''s Communes 《韶山人民公社讨论农村人民公社工作条例（草案）情况简报》: since the Central investigation group came, 80 to 90 percent of adult members in the talks; the "three contracts and one reward" welcomed, the shares of over-quota output disputed.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 310–315 (one of the four enclosures to Hu Qiaomu''s letter of Apr. 14). Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-14.china-leadership-11
      when: Apr. 14
      date: '1961-04-14'
      thread: china-leadership
      c: 'Hu Qiaomu 胡乔木 to Mao Zedong 毛泽东: he sends the investigation group''s report on the mess halls of Shaoshan 韶山 commune and three other papers; the Shaoshan brigade to meet Apr. 16 on mess halls, hills and woods, houses and quotas; at Xiangxiang 湘乡 three brigades of the former Dongjiao 东郊 commune lost 707 dead from October 1958 to March 1961, 13.5 percent of their people, two brigades nearby about 20 percent in three years, the county about 30,000 in three years.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 301–302 (printed in the Center''s forwarding of Apr. 26). Made public: 1997. Sent on: [[cal.1961-04-15.china-leadership-5]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1961-04-13.china-leadership-11
      when: Apr. 13
      date: '1961-04-13'
      thread: china-leadership
      c: 'The Ministry of Labor Party group 劳动部党组 proposes to the Center 中共中央 "On setting up and improving the system of fixed staff and fixed quotas in the rectification of enterprises" 《关于企业整风中建立和健全定员定额制度的建议》: grave waste of labor in the enterprises; every unit to know whom it employs for what (fixed staff) and what it does in a given time (fixed quotas), none to exceed its establishment without approval.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 348–349. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-07.china-leadership-13
      when: May 7
      date: '1961-05-07'
      thread: china-leadership
      place: handan
      c: 'Handan 邯郸. Zhou Enlai 周恩来, by telephone to Mao Zedong 毛泽东, on three days of reports at Handan and five at Boyan 伯延 commune, Wu''an 武安 county: nearly all members, women and single men too, want to cook at home; they are against the supply system and for keeping the "five guarantee" households; the work points of the higher cooperatives wanted back.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 (from *Zhou Enlai xuanji*, II). Made public: 1984 ([[w.enlai-zhou-enlai-xuanji-selected]], II (Renmin chubanshe, Nov. 1984, by CiNii Books NCID BA53138644), from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 prints it). Sent on: [[cal.1961-05-07.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:zhou-enlai
      - name:mao-zedong
- add:
    entry:
      id: cal.1961-05-08.china-leadership-14
      when: May 8
      date: '1961-05-08'
      thread: china-leadership
      place: changsha
      time: 1961-05-08T03:00Z
      time_zone: Asia/Shanghai
      c: 'Changsha 长沙, 11 a.m. Hu Qiaomu 胡乔木 to Mao Zedong 毛泽东 on the Hunan investigation group: with the Hunan committee it has proposed changes to the Sixty Articles; he, Wang Li 王力 and Zhang Chao 张超 go to Liuyang 浏阳 to see the new handicraft cooperatives; Tao Zhu 陶铸 to Taoyuan 桃源 on forestry.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320–323 (printed with Mao''s comment of May 9). Made public: 1997. Sent on: [[cal.1961-05-09.china-leadership-7]]. Names: Mao Zedong, Tao Zhu.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - name:tao-zhu
- add:
    entry:
      id: cal.1961-05-13.china-leadership-10
      when: May 13
      date: '1961-05-13'
      thread: china-leadership
      place: liuyang
      time_range:
      - 1961-05-12T22:00Z
      - 1961-05-13T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      c: 'Wenjiashi 文家市, Liuyang 浏阳, morning. Zhang Pinghua 张平化 to Mao Zedong 毛泽东 on his group''s inquiry since May 2 at Dajiang 大江 brigade of Wenjiashi commune, a third-class brigade: the members welcome the Sixty Articles and the small freedoms; an undercurrent for "dividing the fields to the households" 分田到户, among upper-middle, lower-middle and poor peasants and team cadres alike.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336 (printed with Mao''s comment of May 14). Made public: 1997. Sent on: [[cal.1961-05-14.china-leadership-2]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1961-05-19.china-leadership-8
      when: May 19
      date: '1961-05-19'
      thread: china-leadership
      c: 'The Party groups of the State Planning Commission 国家计划委员会 and the Ministry of Finance 财政部 ask the Center''s 中共中央 instructions on "Measures for dealing with stopped projects" 《关于停建项目的处理办法》, under its comment of Apr. 9: more projects stopped this year than ever; the work to be done in the main by the end of June.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 351–355. Made public: 1997. See [[cal.1961-04-09.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-19.china-leadership-9
      when: May 19
      date: '1961-05-19'
      thread: china-leadership
      c: 'The Propaganda Department 中央宣传部 reports to the Center 中共中央 "On the teaching line of the liberal arts in the higher schools and the compiling of textbooks" 《关于高等学校文科教学方针和教材编选工作的报告》: after the conference of Apr. 11–25, the teaching plans of seven liberal-arts and seven art specialties revised; 297 textbooks planned for 224 courses, 126 for the liberal arts, 171 for the arts.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 419–428. Made public: 1997. See [[cal.1961-04-11.china-leadership-11]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-17.china-leadership-8
      when: June 17
      date: '1961-06-17'
      thread: china-leadership
      c: 'The Ministry of Finance Party group 财政部党组 reports to the Center 中共中央 "On adjusting the burden of the agricultural tax" 《关于调整农业税负担的报告》: the tax not cut for the poor harvests of 1959 and 1960, the burden uneven between regions and heavier in the high-yield grain areas; tax and local surcharge to average no more than 10 percent of farm income.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 492–495. Made public: 1997.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-20.china-leadership-8
      when: June 20
      date: '1961-06-20'
      thread: china-leadership
      c: Nie Rongzhen 聂荣臻 asks the Center's 中共中央 instructions on some questions of policy in present natural science work 《关于当前自然科学工作中若干政策问题的请示报告》.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 517–546 (printed after the Center''s comment of July 19). Made public: 1997. Sent on: [[cal.1961-07-19.china-leadership]]. Names: Nie Rongzhen.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:nie-rongzhen
