      when: Jan. 20
      date: '1961-01-20'
      thread: china-leadership
      c: The Ministry of Health Party group 卫生部党组 reports to the Center 中共中央, "On treating and preventing the main diseases of the day" 《关于防治当前主要疾病的报告》, on its national meeting of Jan. 5–15.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 152–161 (printed after the Center''s comment of Feb. 1). Made public: 1997. See [[cal.1961-01-05.china-leadership-20]]. Sent on: [[cal.1961-02-01.china-leadership-5]].'
