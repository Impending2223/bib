  - edit:
      id: cal.1961-01-20.china-leadership
      base: e466c3df
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 20, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 39–40 (the three teams, their leaders and members); [[w.jianguo-yilai-mao-zedong]], XV, 479–480 (Jan. 20, 1961; Mao''s letter to Tian Jiaying, 4 p.m. Jan. 20: ''On investigation work'' to Chen Boda and Hu Qiaomu for revision; three groups, each of six and its leader, formed in three days, all of high level; Tian to Zhejiang, Hu to Hunan, Chen to Guangdong; one team to the worst production team, one to the best, ten to fifteen days; then to Canton to report to him, a month on industry there; the Spring Festival in Guangdong; the letter to be read by all twenty-one; printed from the manuscript); [[w.mao-zedong-zhuan]], V, ch. 67 n.10 (Jan. 20, 4 p.m., the letter to Tian Jiaying on three survey groups, Chen Boda to Guangdong, Hu Qiaomu to Hunan, Tian to Zhejiang, six members each, each split in two, a worst and a best production team, ten to fifteen days, then to Canton to report and a month in the city on industry, two months in all; the groups'' twenty-one members to read the letter). Made public: 1983 ([[w.mao-zedong-shuxin-xuanji]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107 prints it). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. Check: [[w.yang-jisheng-mubei]], II, 763, prints a photograph of the letter, its caption dated Oct. 20, 1961. To check: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 902 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 421 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2a); [[w.bian-mao-zedong-he-tade]], 41–42, 107, 177 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2b); [[w.mao-zedong-shuxin-xuanji]], 574–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2c); [[w.zhongguo-gongchan-dang-liushi]], 483 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2d); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 219 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 39 n.2e); [[w.xinhua-yuebao]], No. 10, 1992, 77–79 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5a); [[w.hu-qiaomu-wenji]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5b); [[w.rong-fengyun-renwu-jianwen-lu]], 69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5c); [[w.jizhi-mao-zedong-yu-hu]], 81–86 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.5d); [[w.weiyuanhui-zhonggong-renming-lu]], 850 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6b); [[w.institute-whos-who-in-communist]], 271–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6c); [[w.board-whos-who-in-china]], 526–27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.6d); [[w.1961-nian-guangdong-nongcun]], 62–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 40 n.7b); Mao Zedong 毛泽东, letter to Tian Jiaying 田家英 on organizing the survey groups (manuscript 手稿), Jan. 20, 1961, 4 p.m.; in [[w.mao-zedong-wenji]], VIII, 239–240 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.10). Names: Mao Zedong, Tian Jiaying, Chen Boda, Hu Qiaomu.'
  - edit:
      id: cal.1961-01-31.china-leadership-8
      base: aff66ada
      set:
        n: '[[w.yang-jisheng-mubei]], II, 1141–1142; [[w.yang-jisheng-tiandi-fanfu]], I, 82 (the case document: the work team in the villages from Dec. 20, 1960; the members call the cadres "local emperors," "living Kings of Hell," "new tyrants," "new landlords," "new baozhang"). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 126–143). To check: Zhongyang pizhuan Hubei shengwei guanyu Mianyang Tonghaikou gongshe zhengfeng zhengshe dier jieduan zongjie baogao 《中央批轉湖北省委關於沔陽通海口公社整風整社第二階段總結報告》, Jan. 31, 1961 (cited by [[w.yang-jisheng-mubei]], II, 1141 n.64). See [[cal.1961-01-29.china-leadership]].'
  - edit:
      id: cal.1961-02-01.china-leadership-5
      base: 01320faf
      set:
        n: '[[w.yang-jisheng-mubei]], I, 212. Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 151–161). To check: Ministry of Health party group 衛生部黨組, "Guanyu fangzhi dangqian zhuyao jibing de baogao" 《關於防治當前主要疾病的報告》, Feb. 1, 1961, forwarded by the Central Committee the same day (cited by [[w.yang-jisheng-mubei]], I, 212 n.55). Check: the note gives Feb. 1, 1961 as the date of the Ministry''s report; the text, as the date of the Center''s forwarding.'
  - edit:
      id: cal.1961-03-13.china-leadership
      base: 863124d6
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 42–43 (Mao''s letter on the two egalitarianisms); [[w.jianguo-yilai-mao-zedong]], XV, 501–503 (Mar. 13, 1961; Mao''s letter of Mar. 13, 8 a.m., Canton, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Peking conference, carried by Tao Zhu, who goes and returns the next day; Liao Luyan to go north in a few days; the conference of three days too short, five to seven needed; printed from the Center''s document (with the manuscript)); [[w.deng-xiaoping-nianpu-1904]], III, 1622 (Mar. 13, 1961; Mao''s letter to Liu, Zhou, Chen Yun, Deng, Peng Zhen and the Three North conference: the two egalitarianisms, between teams and within the team, "extremely grave"; Deng and Peng Zhen to spend ten days after the meeting at Miyun, Shunyi and Huairou, each level apart; "busy with routine", no typical inquiry in person; Tao Zhu to come to Peking (footnote 1: Tao, then first secretary of the Central-South Bureau and in Guangdong)); [[w.mao-zedong-zhuan]], V, ch. 67 n.26 (Mar. 13, early morning, the letter to Liu Shaoqi and the others: to study the two egalitarianisms, among teams of a brigade and among members of a team; Tao Zhu sent to the Peking meeting; Deng Xiaoping and Zhou Enlai propose joining the two meetings, Mao agrees, at Canton, and Tao Zhu does not go). [[w.peng-zhen-nianpu-1902]], IV, 112 (Mar. 13, 1961; Peng Zhen receives Mao''s letter on the two egalitarianisms, between teams within a brigade and between persons within a team, "两个极端严重的大问题"; Deng and Peng to take some ten days after the meeting to investigate at Miyun, Shunyi, Huairou and elsewhere, level by level, not all together); [[w.chen-yun-nianpu-xiuding]], III, 78 (Mao''s letter on egalitarianism in the communes, routine and investigation, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, moving them to Canton). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 440–41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24a); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24b); [[w.jin-1949-1989-niande-zhongguo]], 376 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 904–05 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24d); Mao Zedong 毛泽东, letter to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the comrades at the Peking meeting, Mar. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 250 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.26). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Tao Zhu.'
  - edit:
      id: cal.1961-04-10.china-leadership-6
