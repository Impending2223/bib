      item: '[[w.pu-weihua-zalan-jiu-shijie]], 171 (quoting Mao''s words of 1939: "the truths of Marxism are many, but in the end one sentence: to rebel is justified"; aimed at the *Zhongguo qingnian bao* editorial and at the work group)'
