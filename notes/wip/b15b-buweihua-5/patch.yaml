  - add:
      entry:
        id: cal.1966-08-23.china-leadership-15
        when: Aug. 23
        date: '1966-08-23'
        place: peking
        thread: china-leadership
        c: 'Peking. Mao 毛泽东, at the Central Work Conference 中央工作会议: Peking''s disorder is not serious; the students held a rally of 100,000, caught the "murderers," panicked; Peking is too civilized, issuing appeals; hooligans are few; do not interfere now; the League''s Central Committee to be reorganized, but not yet; decisions in haste cost much: work groups, struggling rightists, the rally of 100,000, appeals, "opposing the new Peking committee is opposing the Center," all in haste.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 219 n.53. Made public: 2008. Names: Mao Zedong.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 219 n.53: all'
        tags: [polity:prc, vis:only:prc, name:mao-zedong]
