        date: '1967-01-18'
        place: peking
        thread: china-leadership
        c: 'Peking. The first issue of the *Zhongxue wenge bao* 中学文革报 prints "On family background" 〈出身论〉 by "the Peking study group on family background," the young worker Yu Luoke 遇罗克, written early in the Cultural Revolution, against the blood line: unlike America''s blacks, India''s sudras, Japan''s outcasts? It stirs the whole country; many copy and pass it on.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 216, 216 n.48.'
