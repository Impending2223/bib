  - cite:
      id: cal.1966-07-29.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 181–183, 182 n.131 (Li Xuefeng: the new committee asked for the work groups; sending them proved unsuitable and obstructed the movement; the masses rightly dismissed Zhang Chengxian, Sun Youyu, Zhou Jie; Guo Yingqiu removed as the committee''s secretary for culture and education; Deng, "for the Center": the Center agreed to sending the groups; Zhou: the groups were sent in haste; Liu: how to make the cultural revolution "I do not know either"; classes stopped for half a year; at the close Mao comes from backstage to receive all the delegates; afterward the recordings of the four speeches are played in the big cities and the work groups withdrawn across the country)'
