patch: 2026-11-21-b15b-buweihua-5
by: Claude (batch 15b, Bu Weihua, *Zalan jiu shijie* (2008), run 5), Nov. 21, 2026
ops:
  - add:
      entry:
        id: cal.1966-07-04.china-leadership-7
        when: July 4
        date: '1966-07-04'
        place: peking
        thread: china-leadership
        c: 'Peking, the Tsinghua middle school 清华附中. The work group 工作组 reports: over 20,000 posters up; on its entry the left students were 101, 8 percent, now three times as many, 13.9 percent; left teachers two, 1.7 percent of the staff; on June 8 over three hundred from other schools who came to back the left were kept outside the gate ten hours, the university''s guard team and the Haidian 海淀 police branch''s plainclothes called in; on June 4 the two sent by the Youth League''s Central Committee 团中央 were tailed and overheard; seventeen cadres'' children founded the Red Guards 红卫兵 on their own; in over twenty days no beating, corporal punishment or damage to property.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 168–169, 169 n.116. Made public: 2008. To check: 《清華附中工作組的匯報材料》 (July 4, 1966) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 169 n.116).'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 168–169: all'
            - 'via x.1966-07-04.qinghua-fuzhong-work-group-report-material: all'
        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-06-21.china-leadership-10
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 169, 169 n.117 (the congress of the school''s teachers'' and students'' representatives; the work group wants the committee broadly representative, some left students outside the Red Guards in it; the Red Guards call that "press-ganging" 拉夫 and a "burden"; at their insistence all the committee''s members are Red Guards; the work group''s report in the League''s *Wenge jianxun* (169 n.117))'
  - to-check:
      id: cal.1966-06-21.china-leadership-10
      add: 清華附中工作組, 〈清華附中左派學生中出現的一些問題和解決情況〉, in 共青團中央, 《文革簡訊》, no. 10 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 169 n.117)
  - add:
      entry:
        id: cal.1966-06.china-leadership-58
        when: June, around the 21st
        date: 1966-06
        at: after 1966-06-21
        place: peking
        thread: china-leadership
        c: 'the Tsinghua middle school 清华附中, Peking. Friction between the Red Guards and the work group: some Red Guards set aside the study and discussion the work group lays down; some classes, against its dissuasion, hold meetings to "fix" right students; some revolutionary committee members talk openly of their quarrel with it. A rumor goes round: the League''s Central Committee 团中央 is in trouble, "the three Hus are finished" (Hu Yaobang 胡耀邦, Hu Keshi 胡克实, Hu Qili 胡启立).'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 169–170, 170 n.118–119. See [[cal.1966-06-21.china-leadership-10]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 169–170: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-07-14.china-leadership-2
        when: July 14
        date: '1966-07-14'
        thread: china-leadership
        c: 'Liu Shaoqi 刘少奇, in an instruction on the first middle school attached to Peking Normal University 北京师大一附中: the Red Guards are a secret organization, and an illegal one.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 170. Made public: 2008. Names: Liu Shaoqi.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 170: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place, name:liu-shaoqi]
  - add:
      entry:
        id: cal.1966-07.china-leadership-35
        when: July, after the 14th
        date: 1966-07
        at: after 1966-07-14
        thread: china-leadership
        c: 'Middle-school Red Guards treated as illegal: the Red Guards of the Geological Institute''s middle school 地质附中 and the Dongfeng 东风 of No. 25 middle school 二十五中 are ordered to disband; many others not disbanded are criticized and censured by their work groups.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 170. See [[cal.1966-07-14.china-leadership-2]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 170: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-07.china-leadership-36
        when: July, after the 14th
        date: 1966-07
        at: after 1966-07-14
        place: peking
        thread: china-leadership
        c: 'the Tsinghua middle school 清华附中, Peking. The work group and the Red Guards at odds: the group would first strike the very few ox-demons and snake-spirits, the Red Guards sweep away all of them and all old thought; the group would unite over 95 percent of cadres and masses, the Red Guards call it impossible; the group holds that the Party leads through it, the Red Guards set up the absolute authority of Mao Zedong Thought, which the group calls "no leadership by the work group, a Red Guard dictatorship."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 170. See [[cal.1966-06.china-leadership-58]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 170: all'
        tags: [polity:prc]
  - cite:
      id: cal.1966-06-23.china-leadership-9
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 170 (the editorial reviewed by Deng Xiaoping, stressing "unite the majority"; the Tsinghua middle school Red Guards think it all unity and no struggle, its tone too low, eclectic)'
  - cite:
      id: cal.1966-06-24.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 170, 170 n.120 (the Tsinghua middle school Red Guards post two posters, "The glorious duty of left students is thorough revolution" 〈左派學生的光榮責任是徹底鬧革命〉, against the *Zhongguo qingnian bao* editorial of June 23, and "Long live the revolutionary rebel spirit" 〈革命的造反精神萬歲〉: "revolution is rebellion, the soul of Mao Zedong Thought is rebellion"; "the more chaos the better"; *Hongqi* no. 11 of Aug. 21, 1966 printed it and the second under new titles (170 n.120))'
  - add:
      entry:
