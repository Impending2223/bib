      item: '[[w.pu-weihua-zalan-jiu-shijie]], 171, 171 n.121 (Hu Keshi, from Liu Shaoqi''s and Deng Xiaoping''s talks, proposes restoring the Party and League organizations at once and "dissolving" the Red Guards; the work group owns the Red Guards left but finds them too independent to steer)'
  - add:
