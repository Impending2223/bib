        when: 1966, June–July
        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: Hu Keshi 胡克实, of the Youth League's Central Committee 团中央, which leads the Tsinghua middle school 清华附中's work group, has Liu Jin 刘晋, deputy head of the Haidian 海淀 district work team stationed there, telephone him at nine every evening; he reports to Li Fuchun 李富春 at eleven.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. The words: 每天晚上九點鐘, 十一點 (171). Made public: 2008. Names: Li Fuchun.'
