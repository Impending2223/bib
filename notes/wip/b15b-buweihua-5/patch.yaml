        n: '[[w.pu-weihua-zalan-jiu-shijie]], 220, 220 n.55. Made public: 1997 (Xu Haoyuan''s memoir). To check: 徐浩淵, 〈我的反思〉, 《世界日報》 (U.S.), Mar. 31, 1997 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 220 n.55).'
