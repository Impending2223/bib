  - cite:
      id: cal.1966-06.china-leadership-30
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 171, 171 n.121 (Hu Keshi, from Liu Shaoqi''s and Deng Xiaoping''s talks, proposes restoring the Party and League organizations at once and "dissolving" the Red Guards; the work group owns the Red Guards left but finds them too independent to steer)'
  - add:
      entry:
        id: cal.1966.china-leadership-111
        when: 1966, June–July
        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: Hu Keshi 胡克实 instructs the Tsinghua middle school 清华附中's work group to catch the bad people among the Red Guards. The group, unwilling to break with them openly, works to steer them; the Red Guards seek its support; until it withdraws neither side breaks openly.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. Made public: 2008. See [[cal.1966-06.china-leadership-30]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 171: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place]
