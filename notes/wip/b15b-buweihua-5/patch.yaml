      item: '[[w.pu-weihua-zalan-jiu-shijie]], 189 (the mornings of Aug. 2 and 3 the plenum meets in groups; each speaks of his understanding and examines himself for not keeping up with the Chairman; the mood tense; no one offers a systematic view of how to carry on the Cultural Revolution)'
