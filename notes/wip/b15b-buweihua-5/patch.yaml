        place: peking
        thread: china-leadership
        c: Peking, the middle school attached to Peking University 北大附中. The Red Flag group 红旗小组, all but stripped of its standing, falls from over three hundred members to over a hundred.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. See [[cal.1966-07-11.china-leadership-9]].'
