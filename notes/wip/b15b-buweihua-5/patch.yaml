        when: Aug. 9
        date: '1966-08-09'
        place: peking
        thread: china-leadership
        c: 'Peking. Qi Benyu 戚本禹, at the Eleventh Plenum''s North China group 华北组: to bombard the headquarters is to bombard the revisionist headquarters, the royalists in the Center''s leading core; rebel against them and seize their power.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 195. Made public: 2008.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 195: all'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-08-10.china-leadership-9
        when: Aug. 10, morning
        date: '1966-08-10'
        place: peking
        thread: china-leadership
        c: 'Peking. Zhang Chunqiao 张春桥, at the Eleventh Plenum''s East China group 华东组: the resistance to the criticism of *Hai Rui baguan* 海瑞罢官 was not Peng Zhen''s alone; the Five-Man Group''s outline passed the Standing Committee; from *Qinggong mishi* 清宫秘史 to *Hai Rui baguan*, where did "this comrade of the Center" stand; reading in 1964 the record of his attack on investigation and research he was shocked, the first leader of the Center to attack the Chairman openly, in the tone of Khrushchev''s secret speech. Kang Sheng interjects: he attacked the Chairman''s whole thought.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 195. The words: 8月10日上午 (195). Made public: 2008. Names: Zhang Chunqiao, Peng Zhen, Kang Sheng, Mao Zedong.'
