      item: '[[w.pu-weihua-zalan-jiu-shijie]], 189 (the mornings of Aug. 2 and 3 the plenum meets in groups; each speaks of his understanding and examines himself for not keeping up with the Chairman; the mood tense; no one offers a systematic view of how to carry on the Cultural Revolution)'
      units: A
  - add:
      entry:
        id: cal.1966-08-02.china-leadership-11
        when: Aug. 2, afternoon
        date: '1966-08-02'
        place: peking
        thread: china-leadership
        c: 'Peking. Li Xuefeng 李雪峰, at the plenary session in the East Hall of the Great Hall of the People 人民大会堂东大厅, Liu Shaoqi 刘少奇 presiding, criticizes himself: he said right students fought the left for the leadership, called for "removing interference," held that right students made trouble, proposed too early restoring the Party''s organizations; in over a month Peking "made a grave error of orientation," a right-opportunist line, "fear" first.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 189, 189 n.8. The words: 8月2日下午 (189). Made public: 2001 ([[w.zhongguo-gongchandang-beijing-lishi]], 221–222). To check: [[w.zhongguo-gongchandang-beijing-lishi]], 221–222 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 189 n.8). Names: Liu Shaoqi.'
        src:
