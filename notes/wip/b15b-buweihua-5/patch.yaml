        thread: china-leadership
        c: Chen Boda 陈伯达 rounds on Hu Yaobang 胡耀邦 for "false reports of the military situation" over the beating of the work groups. A Red Guard tabloid of the time has it that Hu reported the beating of the Central League School's teachers to Deng Xiaoping 邓小平 at the door of the Great Hall of the People 人民大会堂, Deng told Mao, Jiang Qing had it checked and found "nothing," and Mao lost his temper at Deng.
