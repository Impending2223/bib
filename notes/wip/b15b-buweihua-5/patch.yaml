      base: a69b5a00
      set:
        n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966); [[w.deng-xiaoping-nianpu-1904]], III, 1928 (Aug. 4, 1966; afternoon, 下午; Deng with Liu Shaoqi at the Central-South group of the Eleventh Plenum, Tao Zhu presiding and conveying Mao''s repeated instructions; Deng makes a self-criticism in his speech); [[w.yang-jisheng-tiandi-fanfu]], I, 221 (that afternoon Liu speaks in the Central-South group and withdraws his note on Bulletin no. 9 of Peking University on the June 18 incident but still holds to catching rightists: "now the rightists make trouble and seize the leadership, do not be afraid, let them lead for a time and it will be clear, and then counter-revolutionaries can be caught"). Made public: 1996. Names: Liu Shaoqi, Mao Zedong.'
