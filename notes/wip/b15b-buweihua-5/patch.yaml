  - cite:
      id: cal.1966-08-04.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 190–192, 191 n.10 (the plenary set for the afternoon is turned into group meetings; that afternoon the enlarged Standing Committee meets in the Fujian Hall of the Great Hall; Mao: under the Qing, the Beiyang armies and the Guomindang students were suppressed, and now the Communist Party; the Center broke its own order; a question of direction and line; the Nie poster a manifesto of the Peking Commune; Li Xuefeng''s "inside and outside differ"; Liu: "I bear the main responsibility"; Mao: you ran a dictatorship in Peking; Liu: at worst stepping down, the "five not-afraids" (191 n.10: Liu later examined himself for it); Ye Jianying''s millions of troops; Mao: "the ox-demons and snake-spirits are among those present"; Mao ends the day''s plenary; the groups to hear it conveyed)'
      units: B, C, E, F, G, H, I, J, K, L
