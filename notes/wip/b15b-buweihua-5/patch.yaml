      item: '[[w.pu-weihua-zalan-jiu-shijie]], 212, 212 n.39 (the Center and the State Council issue it; carry out the Party''s class line: children of workers, poor and lower-middle peasants, revolutionary cadres, soldiers and martyrs and other working people, if qualified, chosen first for college; those of exploiting-class families strictly examined)'
