        thread: china-leadership
        c: Chongqing 重庆. The city committee 重庆市委, forced, recalls its work group from Chongqing University 重庆大学 and sends in a new and larger one.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 172. Made public: 2008. See [[cal.1966-06-18.china-leadership-11]].'
