      item: '[[w.pu-weihua-zalan-jiu-shijie]], 173 (Mao lets Zhou and Wang Renzhong, Hubei''s first secretary, read the letter; Zhou proposes talking with Lin Biao; Mao agrees; July 14 Zhou flies from Shanghai to Dalian; Lin accepts and will revise his speech of May 18 on his return to Peking)'
  - cite:
