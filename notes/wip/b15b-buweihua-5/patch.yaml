        n: '[[w.pu-weihua-zalan-jiu-shijie]], 192. Made public: 2008. See [[cal.1966-08-04.china-leadership]]. Names: Zhou Enlai, Chen Yi, Xie Fuzhi, Tao Zhu, Mao Zedong.'
