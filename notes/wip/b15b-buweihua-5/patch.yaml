        n: '[[w.pu-weihua-zalan-jiu-shijie]], 216–217, 217 n.49. To check: 戚本禹張春橋謝富治接見北京中學代表時的講話 (Apr. 14, 1967) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 217 n.49). See [[cal.1967-01-18.china-leadership-10]]. Names: Zhang Chunqiao, Xie Fuzhi.'
