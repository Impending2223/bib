        date: '1966-11-18'
        place: peking
        thread: china-leadership
        c: 'Peking. Wang Li 王力, of the Cultural Revolution Group, speaking to the students the Soviet Union ordered home: Tan Lifu''s 谭力夫 speech of Aug. 20, against the Sixteen Points, is printed, broadcast and carried out everywhere: Tsinghua printed 20,000, the Shijingshan steelworks one a man, Fujian''s Xinhua bookshop for Hui''an county''s Red Guards; he openly opposes Chairman Mao and praises the work groups.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 215, 215 n.46. To check: 王力接見被蘇聯勒令回國的留學生時的講話 (Nov. 18, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 215 n.46). See [[cal.1966-08-20.china-leadership-5]].'
