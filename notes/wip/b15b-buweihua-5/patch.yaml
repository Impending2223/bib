        date: '1966-08-04'
        place: peking
        thread: china-leadership
        c: 'Peking. Deng Xiaoping 邓小平, in the plenum''s Central-South group 中南组: at the Seven Thousand Cadres Conference of 1962 the Chairman spoke chiefly of democracy, of trusting and setting the masses free; without democracy officials become lords, the Hegemon King; the dictatorship of the proletariat, highly centralized, can turn into its opposite, a fascist dictatorship; "we did not much understand, and that, I fear, is where we stood."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 192. Made public: 2008. See [[cal.1966-08-04.china-leadership-5]]. Names: Deng Xiaoping.'
        src:
