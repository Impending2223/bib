        when: Aug. 8, evening
        date: '1966-08-08'
        place: peking
        thread: china-leadership
        c: Peking. The night the Decision is published, workers, peasants, students and cadres stream to the seat of the Center 中共中央 and to the new Peking committee 北京新市委 with good news and pledges, red flags, portraits of Mao and quotation boards; gongs, drums and firecrackers at the Center's reception post. Like scenes in every large and middle city, and in many county towns.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 198, 198 n.16. See [[cal.1966-08-08.china-leadership-8]]. Names: Mao Zedong.'
