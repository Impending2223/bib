        date: '1966-08-02'
        place: peking
        thread: china-leadership
        c: 'Peking. Li Xuefeng 李雪峰, at the plenary session in the East Hall of the Great Hall of the People 人民大会堂东大厅, Liu Shaoqi 刘少奇 presiding, criticizes himself: he said right students fought the left for the leadership, called for "removing interference," held that right students made trouble, proposed too early restoring the Party''s organizations; in over a month Peking "made a grave error of orientation," a right-opportunist line, "fear" first.'
