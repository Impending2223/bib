        date: '1966-06-18'
        place: chongqing
        thread: china-leadership
        c: Chongqing 重庆. Students of Chongqing University 重庆大学, against the city committee's work group, which upholds the school's Party committee, rally and openly raise the slogans "no confidence in the work group" and "until the Center and Chairman Mao send someone, organize ourselves to make revolution."
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 172.'
        src:
