      item: '[[w.pu-weihua-zalan-jiu-shijie]], 210–212, 211 n.38, 212 n.40 (the Peking middle-school Red Guards'' meeting; Jiang Qing does not wholly agree with the couplet: no strength to be spent on side issues; the great majority keep it; Kang Sheng attacks the Youth League''s Central Committee: some there side with the bourgeoisie in suppressing the revolution; Peng Xiaomeng was right to accuse Zhang Chengxian; the Red Guards and Red Flag groups to be the backbone of remaking the League, which has been like a "people''s corps"; on the class line, "I admire you")'
