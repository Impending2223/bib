        n: '[[w.pu-weihua-zalan-jiu-shijie]], 212, 212 n.41. To check: 周恩來在接見北京三十一中「七一」赤衛隊隊員時的談話 (Aug. 18, 1966) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 212 n.41). Names: Zhou Enlai.'
