        place: peking
        thread: china-leadership
        c: 'Peking, the middle school attached to Peking University 北大附中. Zhang Dehua 张德华, deputy head of the Peking University work group, at a forum: the Red Flag group 红旗小组 has "errors of orientation"; he proposes breaking it by splitting the middle, winning the masses and isolating the few.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. Made public: 2008.'
