      item: '[[w.pu-weihua-zalan-jiu-shijie]], 174, 174 n.123 (Bu''s reading: what made Mao uneasy was Lin Biao''s excess of praise; a study of 1995 reads the letter as unease before a decisive battle (174 n.123))'
  - to-check:
      id: cal.1966-07-08.china-leadership
      add: 劉林元, 〈決戰前的憂慮和不安心態的坦露——毛澤東1966年7月8日給江青的信解讀〉, 《南京社會科學:經濟哲學版》, 1995, no. 11, 24–31 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 174 n.123)
  - cite:
      id: cal.1966-07-18.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 174 (from Wuhan; hears Jiang Qing, Kang Sheng, Chen Boda and others; reads the materials of the work groups at Peking University, Peking Normal, Tsinghua and People''s University; displeased, but says nothing yet on the work groups)'
  - cite:
      id: cal.1966-07-19.china-leadership
