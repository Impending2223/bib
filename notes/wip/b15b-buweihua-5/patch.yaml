  - add:
      entry:
        id: cal.1966-08-03.china-leadership-14
        when: Aug. 3, afternoon
        date: '1966-08-03'
        place: peking
        thread: china-leadership
        c: 'Peking. Wei Wenbo 魏文伯, at the plenary session in the East Hall of the Great Hall of the People 人民大会堂东大厅, Zhou Enlai 周恩来 presiding: early in June the East China Bureau''s secretariat 华东局书记处 decided to send work groups only as each case required, but as committees collapsed or froze and calls came from everywhere it sent many; only after July 25, in Peking, did they begin to see. Mao asks how schools without work groups ran the movement; Wei: under their Party committees; groups went only where committees had fallen or were paralyzed.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 190. Made public: 2008. Names: Mao Zedong, Zhou Enlai.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 190: all'
        tags: [polity:prc, vis:only:prc, name:mao-zedong, name:zhou-enlai]
