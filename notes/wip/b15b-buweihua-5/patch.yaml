        c: 'Peking. Tao Zhu 陶铸, receiving students from the Central-South region in Peking: the Red Guards are a revolutionary organization and look set to spread over the whole country; in Peking they have played a great part; in the schools perhaps thirty, forty, fifty percent will join. On the class line: class origin first, but against "origin only"; second, political conduct; the well-born may all join the Red Guards, those of bad birth who do especially well may be taken in too; he himself is of a fallen landlord family; Peng Zhen spoke only of conduct, a revisionist twisting of the class line.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 208, 208 n.33, 213, 213 n.42. To check: 陶鑄在接見中南地區在京同學時的講話 (Aug. 25, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 208 n.33, 213 n.42). Names: Tao Zhu, Peng Zhen.'
