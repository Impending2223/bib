        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: The girls' middle school attached to Peking Normal University 北京师大女附中 and other schools restore Party activity, setting up a temporary Party branch, a temporary League branch and like bodies.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171 n.121. Made public: 2008.'
