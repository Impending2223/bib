        c: 'Peking University 北京大学. A "debate rally" of ten thousand, Kang Sheng 康生, Chen Boda 陈伯达 and Jiang Qing 江青 present: some students charge the work group with turning the "June 18" revolutionary incident into a counter-revolutionary one and with errors of orientation and line; Peng Xiaomeng 彭小蒙, of the middle school''s Red Flag fighting group, denounces it; when she calls Chairman Mao "the red sun in our hearts," Jiang Qing: "You are the sun, the sun at eight or nine in the morning." Most speakers deny the work group erred: it is "Yan''an," not "Xi''an." Kang Sheng: "Chairman Mao sent not a single work group."'
