      item: '[[w.pu-weihua-zalan-jiu-shijie]], 198–199, 199 n.17 (the evening; "the supreme commander of this Cultural Revolution is our Chairman Mao"; the bourgeois "authorities" to be struck down and made to lose face, turned upside down, so that the bourgeoisie cannot sleep; then a milder form; he praises the Group''s members; his speech conveyed to the plenum)'
