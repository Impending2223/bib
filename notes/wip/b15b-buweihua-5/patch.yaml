        when: Aug. 23
        date: '1966-08-23'
        place: peking
        thread: china-leadership
        c: 'Peking. All of the Peking Geological Institute''s East Is Red 地质东方红 march to the Ministry of Geology 地质部 and demand Zou Jiayou 邹家尤, vice-minister, once head of the institute''s work group, to take back to the school for struggle; the ministry''s Party committee refuses and the students sit in. With Li Fuchun 李富春 and the Cultural Revolution Group backing them, Zou agrees to come back to the school next day to hear criticism: "the first entry into the Ministry of Geology, bombarding the He family shop" (He Changgong 何长工, the ministry''s Party secretary).'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 221, 221 n.56–57. Names: Li Fuchun.'
        src:
          rows:
