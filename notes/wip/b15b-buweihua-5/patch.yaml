        id: cal.1966-08-03.china-leadership-13
        when: Aug. 3, afternoon
        date: '1966-08-03'
        place: peking
        thread: china-leadership
        c: 'Peking. Li Jingquan 李井泉, at the plenary session in the East Hall of the Great Hall of the People 人民大会堂东大厅, Zhou Enlai 周恩来 presiding: why did we all agree so readily to send work groups? Seeing in the papers that Peking University''s committee was suspended and a work group took its place, they thought of it; the Center gave no order, and they did it anyway.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 190. Made public: 2008. Names: Li Jingquan, Zhou Enlai.'
