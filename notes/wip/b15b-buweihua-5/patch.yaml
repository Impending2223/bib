        when: Aug., from the 23rd
        date: 1966-08
        at: after 1966-08-22
        thread: china-leadership
        c: 'Li Fuchun 李富春, five instructions to the Peking Geological Institute''s East Is Red 地质东方红: they may set up a liaison post at the Ministry of Geology 地质部, which is to receive them; Zhou Rongxin 周荣鑫 to hand over the work group''s files on teachers, students and cadres, or a list of those destroyed; Zou Jiayou to stay and debate; the East Is Red is no counter-revolutionary body, its verdict to be reversed, He Changgong to say so to the whole ministry; the vice-minister Zhuo Xiong 卓雄 may be called back; at the next struggle meeting He Changgong and four others to attend.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 221 n.56. Made public: 2001 (Wang Li 王力, *Wang Li fansilu* 《王力反思錄》, II, 689). To check: 王力, 《王力反思錄》, II, 689 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 221 n.56). See [[cal.1966-08-23.china-leadership-16]]. Names: Li Fuchun.'
        src:
