        when: Aug. 21
        date: '1966-08-21'
        place: peking
        thread: china-leadership
        c: '*Hongqi* 红旗, no. 11, prints the Tsinghua middle school Red Guards'' posters "Long live the revolutionary rebel spirit" and its sequel, retitled "Long live the proletarian revolutionary rebel spirit" 〈无产阶级的革命造反精神万岁〉 and "Long live the proletarian revolutionary rebel spirit, again" 〈再论无产阶级的革命造反精神万岁〉.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 170 n.120. See [[cal.1966-06-24.china-leadership-6]].'
