        date: '1966-07-11'
        place: peking
        thread: china-leadership
        c: Peking, the middle school attached to Peking University 北大附中. Zhang Chengxian 张承先, head of the Peking University work group, at a forum of some teachers and students, criticizes the Red Flag group 红旗小组 for "closed-doorism" and "sectarianism."
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. Made public: 2008. See [[cal.1966-07-03.china-leadership-11]].'
