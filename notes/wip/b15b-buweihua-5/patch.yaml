  - add:
      entry:
        id: cal.1966.china-leadership-110
        when: 1966, June–July
        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: Hu Keshi 胡克实, of the Youth League's Central Committee 团中央, which leads the Tsinghua middle school 清华附中's work group, has Liu Jin 刘晋, deputy head of the Haidian 海淀 district work team stationed there, telephone him at nine every evening; he reports to Li Fuchun 李富春 at eleven.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. The words: 每天晚上九點鐘, 十一點 (171). Made public: 2008. Names: Li Fuchun.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 171: all'
        tags: [polity:prc, vis:only:prc, ok:fields-time, ok:fields-place, name:li-fuchun]
  - cite:
      id: cal.1966-06.china-leadership-30
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 171, 171 n.121 (Hu Keshi, from Liu Shaoqi''s and Deng Xiaoping''s talks, proposes restoring the Party and League organizations at once and "dissolving" the Red Guards; the work group owns the Red Guards left but finds them too independent to steer)'
  - add:
      entry:
        id: cal.1966.china-leadership-111
        when: 1966, June–July
        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: Hu Keshi 胡克实 instructs the Tsinghua middle school 清华附中's work group to catch the bad people among the Red Guards. The group, unwilling to break with them openly, works to steer them; the Red Guards seek its support; until it withdraws neither side breaks openly.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. Made public: 2008. See [[cal.1966-06.china-leadership-30]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 171: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place]
  - add:
      entry:
        id: cal.1966.china-leadership-112
        when: 1966, June–July
        date: '1966'
        at: before 1966-06
        thread: china-leadership
        c: The girls' middle school attached to Peking Normal University 北京师大女附中 and other schools restore Party activity, setting up a temporary Party branch, a temporary League branch and like bodies.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171 n.121. Made public: 2008.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 171 n.121: all'
