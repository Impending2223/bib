      item: '[[w.pu-weihua-zalan-jiu-shijie]], 214, 214 n.44 (Tan Lifu, head of the third department''s cultural revolution group, later of the Paris Commune Red Guards; holding to the class line he points out the couplet''s one-sidedness and proposes adding "father revolutionary, son carries on; father reactionary, son betrays; it should be so": the first couplet "basically so," materialism; the second the way forward, dialectics; many youths take it)'
      units: A
  - variant:
      id: cal.1966-08-12.china-leadership-6
      unit: B
      witness: w.pu-weihua-zalan-jiu-shijie
      reads: points out the couplet's one-sided reasoning, holding to the class line, and proposes a second couplet to go with it
      at: '214'
  - cite:
      id: cal.1966-08-20.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 214–215, 215 n.45 (most old cadres and children of workers, peasants and cadres are good; "old revolutionaries meeting new problems"; against attacking cadres at random; "what are you glad about when a Communist cadre errs?"; the work group head Du Wanrong of the General Staff''s chemical defense department: "I like Du Wanrong"; against dogma: "nothing in the world is a hundred percent right; Mao Zedong Thought too must develop"; widely spread, opposed by the Cultural Revolution Group and the rebels)'
      units: A, B
  - cite:
      id: cal.1966-10-16.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 215 (in his report Chen Boda names Tan Lifu''s views and criticizes him severely; afterward Chen Boda, Jiang Qing, Kang Sheng, Zhang Chunqiao, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu and Xie Fuzhi criticize him by name on various occasions)'
