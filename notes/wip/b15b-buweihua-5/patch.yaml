        when: Aug. 9, morning
        date: '1966-08-09'
        place: peking
        thread: china-leadership
        c: 'Peking. Jiang Qing 江青, at the Eleventh Plenum''s North China group 华北组: Peking has two headquarters, one suppressing the revolution, one the Chairman''s revolutionary one; the one the Chairman bombards has long held everything; he never reported to the Chairman, not after the Chairman''s return of July 18; at the report meetings he ran, Chen Boda and Kang Sheng attended four times and were not heeded.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 195. The words: 8月9日上午 (195). Made public: 2008. Names: Jiang Qing, Chen Boda, Kang Sheng.'
        src:
          rows:
