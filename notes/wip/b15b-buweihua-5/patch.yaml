        when: June 25
        date: '1966-06-25'
        place: peking
        thread: china-leadership
        c: Peking. Some of the Tsinghua middle school 清华附中's Red Guards copy their posters to Tsinghua University 清华大学, in support of Kuai Dafu 蒯大富, who opposes the work group there.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171.'
        src:
