        date: 1966-06
        at: after 1966-06-25
        place: peking
        thread: china-leadership
        c: Peking. Many Tsinghua University 清华大学 students who back its work group, angered, post posters at the Tsinghua middle school 清华附中 against the Red Guards; some demand the work group "arrest the anti-Party, anti-socialist small clique, the Red Guards."
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 171. See [[cal.1966-06-25.china-leadership-7]].'
