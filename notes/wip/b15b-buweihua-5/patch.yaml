      item: '[[w.pu-weihua-zalan-jiu-shijie]], 176–177 (the morning; the meeting goes on, the Center''s regional first secretaries in Peking for the plenum''s preparatory meeting joining; Mao: the work groups made much trouble and obstructed; no surrounding of papers, provincial committees or the State Council; in his first four days back he leaned to keeping Zhang Chengxian; "split if you must"; Nie Yuanzi "fired the first shot")'
