        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44 (Aug. 2, 1966); [[w.jian-zhou-enlai]], 549 (Zhou, just back from a meeting at Mao''s: from Yao''s essay to the poster and "the chairman''s decision to recall all work teams," "The political line" at the center; "the determination to rebel by joining the masses to make revolution"; it may "temporarily bring Beijing into a chaotic situation," but "to fear is not compatible with the chairman''s thought"; his self-criticism for the decision to send work teams in early June, to "preserve the old order"). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 45). To check: [[w.zhou-enlai-nianpu-1949]], III, 45 (cited by [[w.jian-zhou-enlai]], 549 n.26a); [[w.jin-chongji-liu-shaoqi-zhuan]], 1033–1034 (cited by [[w.jian-zhou-enlai]], 549 n.26b); [[w.xie-xuegong-diary-on-the-eleventh-plenum]], 52–53 (cited by [[w.jian-zhou-enlai]], 549 n.26c). Names: Zhou Enlai, Mao Zedong, Nie Yuanzi.'
