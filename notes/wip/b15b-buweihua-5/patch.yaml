      item: '[[w.pu-weihua-zalan-jiu-shijie]], 210, 210 n.37 (early on Aug. 5 by Bu, at the mass meeting at Tsinghua: "I hear you at Tsinghua have formed an association of the children of workers, poor and lower-middle peasants and revolutionary cadres and drafted its rules; this morning the Secretariat and the Cultural Revolution Group talked of it; that is not the Party''s policy in the schools"; unite 95 percent of the masses and cadres)'
