        date: '1966-08-10'
        place: peking
        thread: china-leadership
        c: 'Peking. Kang Sheng 康生, at the Eleventh Plenum''s East China group 华东组: when the May 16 Notice was drafted, the Chairman added that revisionists sleep beside us, some found, some not; then they thought only of Peng Zhen, and neither thought nor dared think of the successor.'
