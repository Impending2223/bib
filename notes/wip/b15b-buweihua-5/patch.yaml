        id: cal.1966-06-28.china-leadership-10
        when: June 28
        date: '1966-06-28'
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Some Zhejiang University 浙江大学 students draft a telegram to Mao 毛泽东 and the Center, signed by 14,861: the provincial committee 省委 sent the work group to hold down the movement; withdraw it. They march to the committee''s compound and sit in, asking it to forward the telegram.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 172, 172 n.122. To check: [[w.zhongguo-gongchandang-zhejiang-lishi]], 148 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 172 n.122). Names: Mao Zedong.'
        src:
