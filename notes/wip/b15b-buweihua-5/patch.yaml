  - cite:
      id: cal.1966-08-01.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 186–189, 187 n.5, 188 n.6, 189 n.7 (Aug. 1 to 12, in Peking; 141 members and alternates present of 195, eleven dead, forty-three absent, among them the fallen (Peng Dehuai, Huang Kecheng, Zhang Wentian, Xi Zhongxun, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Ulanfu and others); forty-seven non-voting, among them teachers and students of the capital (187 n.5: Cao Yi''ou, Zhang Chengxian, Nie Yuanzi, Kong Dan and others); of the Standing Committee Chen Yun absent; Lin Biao, ill, comes back from Dalian Aug. 6; the afternoon of Aug. 1 Mao presides in the East Hall of the Great Hall; Deng gives the agenda (the Decision; the measures since the Tenth Plenum; the personnel changes, Tao Zhu to the Secretariat''s standing secretary, Ye Jianying a secretary; a communiqué); Liu tells of Chen Boda''s proposal and the majority against it, and takes the chief responsibility for the work groups; his speech never printed; Mao''s interjections; Chen Boda: the work groups did what Lu Ping dared not; Mao: necessity hides in chance; a decision is to be made (the record, 189 n.7))'
      units: A, B, C, D, E, F, G
