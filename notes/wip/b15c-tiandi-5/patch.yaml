      date: '1969-04-14'
      place: peking
      thread: china-leadership
      c: 'Huang Yongsheng 黃永勝 to the Ninth Congress: the decades of the Party''s and the army''s struggle prove that away from the leadership of Mao Zedong 毛澤東, his Thought and his line
        "the revolution goes back, fails, loses everything"; following him close, "it advances, wins, has everything."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 717. Made public: 2016. See [[cal.1969-04-14.china-leadership]]. Names: Huang Yongsheng, Mao Zedong.'
