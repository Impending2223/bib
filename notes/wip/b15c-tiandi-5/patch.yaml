- add:
    entry:
      id: cal.1967-01-19.china-leadership-9
      when: Jan. 19
      date: '1967-01-19'
      place: peking
      thread: china-leadership
      c: 'Peking 北京, the Jingxi Hotel 京西賓館. A small meeting of the Military Commission 中央軍委, the Cultural Revolution Group 中央文革 and the All-Army Cultural Revolution Group 全軍文革. Chen
        Boda 陳伯達 attacks Xiao Hua 肖華: "a bourgeois politician" who has led the army''s political work onto the bourgeois track; the army''s Cultural Revolution, all rules and bans, kept
        cold and cheerless, the army on the edge of revisionism; Sanzuomen 三座門, the Commission''s seat, "a hall of the King of Hell," "we none of us go in."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 731. Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008), 651–656 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        II, 731 n.39). Names: Chen Boda. Check: the day: Wu Faxian, as Yang gives him (II, 731), puts the meeting in mid-February 1967; Yang''s own I, 387 and the Zhou chronology put
        the enlarged Military Commission meeting at which Chen Boda and Jiang Qing moved against Xiao Hua on Jan. 19 (see [[cal.1967-01-19.china-leadership-3]]).'
      src:
        c: 778f1a83
        rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 731: all'
        - 'via w.yang-jisheng-tiandi-fanfu II, 731 n.39: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:chen-boda
- cite:
    id: cal.1967-01.china-leadership-26
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 731 (by Wu Faxian''s account: Ye Jianying reports to Lin Biao the morning after the Jingxi Hotel meeting, 第二天上午, Chen Boda''s attack on
      Xiao Hua and the raid on Xiao''s house; the meeting put there in mid-February 1967)'
- cite:
    id: cal.1967-01.china-leadership-27
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 731 (by Wu Faxian''s account: Lin has a secretary telephone for Jiang Qing and rails at her: they hate the army and its leaders; abusing
      Xiao Hua, stirring up the raid on his house and the seizure of files, going round the Military Commission to break the General Political Department; he will resign and ask the
      Chairman to relieve him of every post; he calls for a car to go with her to Mao; Ye Qun, weeping, kneels and holds his legs; Jiang apologizes: he may criticize or curse her, why
      go to the Chairman?; the chain dated there from a meeting of mid-February 1967)'
- add:
    entry:
      id: cal.1967-01.china-leadership-32
      when: Jan., after the 22nd
      date: 1967-01
      at: after 1967-01-22
      thread: china-leadership
      c: 'Lin Biao 林彪, the day after he rails at Jiang Qing 江青, tells Ye Jianying 葉劍英 and Xu Xiangqian 徐向前 to hold a Military Commission meeting that evening, Chen Boda 陳伯達, Jiang and
        Kang Sheng 康生 of the Cultural Revolution Group to attend and Xiao Hua 肖華 himself, to relay Mao''s view on Xiao: seizing him, raiding his house and taking his files were wrong;
