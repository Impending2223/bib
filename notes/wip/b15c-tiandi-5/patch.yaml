      when: Feb., mid-
      date: 1967-02
      at: before 1967-02-10
      thread: china-leadership
      c: 'Lin Biao 林彪, enraged, has a secretary telephone for Jiang Qing 江青 and, when she comes, rails at her: they hate the army and its leaders; abusing Xiao Hua, stirring up the raid
        on his house and the seizure of files, going round the Military Commission to break the General Political Department; he will resign, go to the Chairman and ask to be relieved
        of every post. He calls for a car to go with her to Mao; Ye Qun 葉群, weeping, kneels and holds his legs; Jiang apologizes: he may criticize or curse her, why go to the Chairman?'
      n: '[[w.yang-jisheng-tiandi-fanfu]], II, 731. Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008), 651–656 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        II, 731 n.39). Names: Lin Biao, Jiang Qing, Ye Qun, Mao Zedong. Check: the month: the tree puts the enlarged Military Commission meeting at which Jiang Qing and Chen Boda moved
        against Xiao Hua, and the raid on his house, on Jan. 19, 1967 ([[cal.1967-01-19.china-leadership-3]], [[cal.1967-01-19.china-leadership-8]]).'
      src:
        c: 739aa0e4
        rows:
