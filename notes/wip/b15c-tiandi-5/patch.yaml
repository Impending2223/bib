- cite:
    id: cal.1969-04-01.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 715–716 (the opening at 5 p.m., 下午 5 時, not 9 a.m.; the presidium of 176, its list given out beforehand, passed by applause and hands;
      Mao proposes Lin Biao as the presidium''s chairman, Lin turns it back to him; Mao chairman, Lin vice-chairman, Zhou Enlai secretary-general, each by hands; Mao''s opening speech,
      under 800 characters as the secretariat edited it, broken dozens of times by slogans)'
