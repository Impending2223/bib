      item: '[[w.pu-weihua-zalan-jiu-shijie]], 152 (the evening of June 3 the Central People''s Broadcasting Station broadcasts the news of the work group''s entry into Peking University, a dispatch Zhou Enlai drafted on the standing members'' decision; the work group, sent in the North China Bureau''s name, now "decided by the newly reorganized Peking committee"; Mao reads it and agrees)'
  - add:
      entry:
        id: cal.1966-06-05.china-leadership-7
        when: June 5
        date: '1966-06-05'
        place: peking
        thread: china-leadership
        c: 'The new Peking committee 北京新市委, quickening the pace, begins sending work groups in its own name (to mid-June) to 51 colleges and 304 middle schools of the Peking area: the colleges'' from the departments of the Center and the State Council, the middle schools'' from the Youth League''s Central Committee.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 152. Made public: 2008. See [[cal.1966-06-03.china-leadership-9]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 152: all'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-06.china-leadership-49
        when: June
        date: 1966-06
        place: peking
        thread: china-leadership
        c: 'The Youth League''s Central Committee 团中央, on the enlarged Standing Committee''s decision, sets up a work corps for the Cultural Revolution in Peking''s middle schools 北京市中学文化大革命工作团, Hu Keshi 胡克实 and Hui Shuchang 惠庶昌 of its Secretariat its head and deputy: over 1,800 League cadres from across the country, in more than 300 teams in eight brigades, enter the middle schools of the city''s eight districts.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 152. Made public: 2008. See [[cal.1966-06-03.china-leadership-2]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 152: all'
        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-06.china-leadership-11
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 153 (no Central decision or document orders work groups everywhere, but most provinces and cities follow Peking; Shanghai sends work groups to 29 universities and 11 half-work, half-study universities and over 160 to middle schools, and liaison men to schools without one)'
      units: A
