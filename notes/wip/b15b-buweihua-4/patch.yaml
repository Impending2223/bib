        c: 'Mao 毛泽东 talks with Wang Hairong 王海容, studying at the Peking Foreign Languages Institute 北京外国语学院: keeping the school''s rules "shows no spirit"; he urges students to break school discipline and rebel against the school. The talk later leaks out and passes quietly among Peking''s colleges and middle schools.'
