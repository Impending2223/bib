        c: 'Wuhan University 武汉大学. Zhang Tixue 张体学, second secretary of the Hubei 湖北 committee, back from the Eleventh Plenum, conveys Mao''s two points on Li Da 李达: Li is of no more use; the university''s revolutionary teachers and students surely will not go too far with him. Zhang adds: no need to struggle him more; a "landlord element" cap is enough; hand him to the committee, which will give him only a bowl of rice and keep him as a negative example.'
