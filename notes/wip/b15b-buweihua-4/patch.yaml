      item: '[[w.pu-weihua-zalan-jiu-shijie]], 162 (that afternoon Liu Shaoqi calls in the work group, has it organize discussion of the posters against it and rouse the masses to hit back; to Gou Deyuan: "it is good that they attack you; the enemy has come out, the snake has left its hole, and is easier to destroy; discuss this poster well, then struggle"; the *Liu Shaoqi zhuan* (162 n.108))'
