        c: 'Wuhan University 武汉大学. Li Da 李达, the president, under criticism, writes "My confession" 〈我的坦白〉 (first headed "My examination and defense," then "My confession and defense"): he admits some views against Mao Zedong Thought 毛泽东思想, full responsibility as president for the university''s errors, and an "anti-Party error" in resisting the committee over cadres, but denies point by point that he denied Mao Zedong Thought the summit of Marxism-Leninism. He writes too a defense denying any "Li Da Three-Family Village."'
