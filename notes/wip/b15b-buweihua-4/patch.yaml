        when: Aug. 1
        date: '1966-08-01'
        place: peking
        thread: china-leadership
        c: 'Chen Boda 陈伯达, at the Eleventh Plenum 八届十一中全会: when the Chairman was at Hangzhou he told us that sending work groups early was no good for the cultural revolution.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 154 n.100. Made public: 2008. See [[cal.1966-06-12.china-leadership]]. Names: Chen Boda.'
