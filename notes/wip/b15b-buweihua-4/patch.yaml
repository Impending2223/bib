        when: Oct. 22
        date: '1968-10-22'
        place: peking
        thread: china-leadership
        c: 'Li Dazhang 李大章, at the fourth group of the Twelfth Plenum 八届十二中全会第四组: at the Hangzhou meeting of June 12, 1966, he himself heard the Chairman''s instruction not to send work groups to the colleges, to send few, to send late.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 154 n.100. Made public: 2008. See [[cal.1966-06-12.china-leadership]].'
        src:
          rows:
