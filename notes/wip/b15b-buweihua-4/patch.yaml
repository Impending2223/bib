  - cite:
      id: cal.1966-06-23.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 165 (June 23, Liu, forwarding the Central-South and Northwest bureaus'' reports: when the ox-demons and snake-spirits come out to attack, no haste to strike back; tell the left to hold firm; the leaders to judge the heat; when most are exposed, organize the counterattack in time; anti-Party, anti-socialist students among college and middle-school students to be dragged out; some graduating senior-middle students, with the city committee''s approval, criticized, struggled and capped)'
      units: A, B, C, D
  - cite:
      id: cal.1966-06-23.china-leadership-7
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 165 (June 23, Li Xuefeng''s report at the Peking Hotel: most against the work groups a contradiction among the people, but bad men contest the leadership with them; Mao''s "one carp, three waves"; the situation excellent, reaction come out in every school; "counter-revolutionaries are nothing: arrest them and be done"; the rightists who drive out the work groups to be cleaned up; if Communists do not stand up, Nagy will come to power (165 n.111 on Nagy); "resist interference"; Party and League life to be restored, 95 percent of members good)'
      units: A, B, C, D, F, G
