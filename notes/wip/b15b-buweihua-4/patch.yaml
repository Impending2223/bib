  - add:
      entry:
        id: cal.1966.china-leadership-84
        when: '1966'
        date: '1966'
        place: shandong
        thread: china-leadership
        c: 'Shandong 山东. The committee''s standing committee 省委常委会议 finds the articles and speeches of 1960–62 of Yu Xiu 余修, vice-governor, Li Jingchun 李景春, deputy head of the committee''s Party school, and Ding Xiusheng 丁秀生, deputy head of the *Dazhong ribao*''s 大众日报 culture and education department, very grave: linked with Deng Tuo 邓拓 and Wu Han 吴晗 in thought and in organization, a Shandong branch of the "Three-Family Village" black shop, anti-Party and anti-socialist. It decides to criticize the three.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 132. Made public: 2008.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 132: all'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-06-21.china-leadership-14
        when: June 21
        date: '1966-06-21'
        place: taiyuan
        thread: china-leadership
        c: Taiyuan 太原. Zhao Zongfu 赵宗复, a standing member of the Shanxi political consultative conference and president and deputy Party secretary of the Taiyuan Institute of Technology 太原工学院, after days of struggle and insult by students, kills himself, aged fifty-one. After his death he is branded the agent in Shanxi of Wu Han, Deng Tuo and Liao Mosha's "Three-Family Village" and boss of its "Shanxi branch"; his essays are called anti-Party.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 132. [[w.shanxi-tongshi]], I, 407 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 132 n.77).'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 132: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-05.china-leadership-45
        when: May, after the Notice
        date: 1966-05
        at: after 1966-05-16
        thread: china-leadership
        c: Liu Lantao 刘澜涛, first secretary of the Northwest Bureau 中共中央西北局, raises at a meeting of the Bureau the question of a Northwest "Three-Family Village" 三家村, meaning to make one of Hu Yaobang 胡耀邦, Zhao Shouyi 赵守一, second secretary of the Shaanxi 陕西 committee, and Li Qiming 李启明, a secretary of the committee and governor.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 132. Made public: 2001 ([[w.huainian-yaobang-vol-4]]). To check: 〈胡耀邦主政陝西的兩百天〉, in [[w.huainian-yaobang-vol-4]], 125 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 132 n.78).'
        src:
