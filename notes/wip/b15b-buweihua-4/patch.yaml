        thread: china-leadership
        c: 'Chen Boda 陈伯达 sends Liu Shaoqi 刘少奇 and the other leaders of the first line, in his name, "Two proposals of the Central Cultural Revolution Group" 〈中央文革小组的两项建议〉: cultural revolution groups in the schools and offices, chosen by the masses; work groups sent only where most needed, vetted, of proletarian revolutionaries, not bourgeois royalists, following the mass line; the army as the Center approves.'
