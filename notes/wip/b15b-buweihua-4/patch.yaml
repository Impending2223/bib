        thread: china-leadership
        c: Shaanxi 陕西. Hu Yaobang 胡耀邦, in charge of the committee, decides to suspend seizures of power, the "double expulsions" 双开 (from the Party and from public posts) and arrests in the socialist education movement.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 133. Made public: 2000 ([[w.zhongguo-gongchandang-zuzhishi-ziliao]]). To check: [[w.zhongguo-gongchandang-zuzhishi-ziliao]], V, 770–771 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 133 n.79).'
