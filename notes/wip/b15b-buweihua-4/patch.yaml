        thread: china-leadership
        c: 'The Peking Institute of Posts and Telecommunications 北京邮电学院. Rebels drive out the work group, four days in the institute, for shielding the Party committee: the first expulsion of a work group in Peking. A new work group, in under four days, is about to be driven out too.'
