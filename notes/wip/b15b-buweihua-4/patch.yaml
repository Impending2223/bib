      item: '[[w.pu-weihua-zalan-jiu-shijie]], 158 (the morning of June 18, while the work group holds a meeting of all its members, from about 9 o''clock seizures and struggles break out in the chemistry, biology, Eastern languages, Western languages, Chinese and radio departments; a "ghost-struggling platform" before building 38; over sixty cadres and teachers struggled, tall hats, ink on their faces, posters on their bodies, kneeling, hair pulled, clothes torn, beaten and kicked, paraded; women indecently assaulted)'
