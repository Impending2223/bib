  - add:
      entry:
        id: cal.1966-05-27.china-leadership-6
        when: May 27
        date: '1966-05-27'
        place: peking
        thread: china-leadership
        c: The *Wenhua geming jianbao* 文化革命简报, an internal bulletin the editorial offices of *Hongqi* 红旗 and the *Guangming ribao* 光明日报 have put out since early 1966, prints in full, in its no. 13, the poster of Nie Yuanzi 聂元梓 and the others.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129. Made public: 2008. See [[cal.1966-05-25.china-leadership]].'
        src:
