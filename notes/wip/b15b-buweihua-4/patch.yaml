  - cite:
      id: cal.1966-07-13.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 166, 166 n.112 (July 13, the college group of the Peking culture and education system, from its preliminary sorting of twenty-four colleges (named in 166 n.112): of 99,323 staff and students, 31,877 left (32 percent), 57,235 middle (57.9 percent), 10,211 right (10.1 percent); the colleges'' Cultural Revolution committees formed in the "resist interference" time mostly for the work groups; Kuai Dafu expelled from the League and held eighteen days; over a hundred Peking students branded counter-revolutionaries)'
      units: A
  - cite:
      id: cal.1966-07-13.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 167 (the work groups rate the colleges'' Party committees and leaders gravely: over nine-tenths of the twenty-four committees in class 3 or 4 (none in class 1, 2 in class 2, 14 in class 3, 8 in class 4), and over six-tenths of the cadres from teaching-section head up; the four classes those of the Twenty-three Articles, class 4 then generally taken for an antagonistic contradiction (167 n.113))'
