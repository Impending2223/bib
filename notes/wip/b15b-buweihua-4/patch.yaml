      item: '[[w.pu-weihua-zalan-jiu-shijie]], 156 (the evening of June 8 the work group enters Tsinghua; Zhou Chiping, its deputy head, former deputy minister of the metallurgical industry, tells Liu Bing and the committee''s other acting heads that from now the work group leads the school and the committee stops work; Liu Bing''s memoir (156 n.102))'
