        when: Aug. 8
        date: '1966-08-08'
        place: peking
        thread: china-leadership
        c: 'Zhao Ziyang 赵紫阳, at the Central-South group of the Eleventh Plenum 八届十一中全会中南组: Mao at the Hangzhou meeting had already said "do not fear disorder," "let it be chaotic for a while, then divide one into two," "do not hurry to send work groups."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 154 n.100. Made public: 2008. See [[cal.1966-06-12.china-leadership]]. Names: Mao Zedong.'
