  - add:
      entry:
        id: cal.1966.china-leadership-107
        when: '1966'
        date: '1966'
        place: hunan
        thread: china-leadership
        c: Hunan 湖南. Fu Jiafen 伏家芬, head of the classical literature section of the Hunan Normal College 湖南师范学院, Lin Zengping 林增平, deputy head of its history department, and Ma Jigao 马积高, a teacher of its Chinese department, are made Hunan's "Three-Family Village" 三家村.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 132. Made public: 2008.'
        src:
          rows:
