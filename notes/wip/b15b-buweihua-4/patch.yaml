  - cite:
      id: cal.1966-06-03.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 152 (June 3, Liu Shaoqi presides over the enlarged Standing Committee on the movement in Peking; Li Xuefeng, first secretary of the new committee, puts eight demands: posters inside the schools; meetings not to hinder work or teaching; no marches in the streets; inside and outside apart, no foreign visitors, foreign students out of the movement; no going to the homes of those struggled against; secrecy; no beating or insulting; active leadership, each at his post; and work groups where a school''s leadership is paralyzed, the League and the Organization Department helping; the meeting agrees; Liu: the cultural revolution at its height, order in the schools, the students organized quickly)'
      units: B, C, D, E, F, G, H, I
