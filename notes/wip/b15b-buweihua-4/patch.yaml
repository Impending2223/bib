  - cite:
      id: cal.1966-06-21.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 164 (June 21, Liu Shaoqi at the enlarged Standing Committee: some schools drive out the work groups and seize power from them, wanting files, guns and broadcasting; no seizing of power at will; bad work groups may be withdrawn, but to break off the Party''s leadership is bad, most committees are good; counter-revolutionaries appear in "left" and right guise; no beating, insulting or disguised corporal punishment, by the Twenty-three Articles; Liu and Deng saw a counter-current, the Center decided to back the work groups against interference; the *Liu Shaoqi zhuan*, II, 1025 (164 n.110))'
  - to-check:
