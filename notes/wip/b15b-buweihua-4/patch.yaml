      item: '[[w.pu-weihua-zalan-jiu-shijie]], 157 (June 7, 8 and 9, the departments hold struggle meetings large and small against the "sharp ones," Li Shiying and others paraded in tall hats; at noon on the 9th Li tries to kill himself and fails; Mao later calls him a "student leader"; the reporters'' account (157 n.103))'
