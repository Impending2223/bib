        when: Nov. 16
        date: '1964-11-16'
        thread: china-leadership
        c: The Center decides that Hu Yaobang 胡耀邦, first secretary of the Youth League's Central Committee 共青团中央, is to act as first secretary of the Shaanxi 陕西 committee while its first secretary, Zhang Desheng 张德生, is ill. He keeps the League post.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 133. Made public: 2000 ([[w.zhongguo-gongchandang-zuzhishi-ziliao]]). To check: [[w.zhongguo-gongchandang-zuzhishi-ziliao]], V, 770–771 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 133 n.79).'
