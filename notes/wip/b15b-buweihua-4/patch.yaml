        thread: china-leadership
        c: 'The *Renmin ribao* 人民日报 prints the news that Nanjing University''s revolutionary teachers and students have dragged out the anti-Party, anti-socialist counter-revolutionary Kuang Yaming 匡亚明, with the editorial "Rouse the masses boldly, overthrow the counter-revolutionary black gangs thoroughly" 〈放手发动群众，彻底打倒反革命黑帮〉. Peking University''s students take fire: Lu Ping''s 陆平 case is graver and named by the Center, yet he has not been struggled.'
