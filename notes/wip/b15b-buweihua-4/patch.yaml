  - cite:
      id: cal.1966-05-29.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 150–151 (May 29, Liu Shaoqi, Zhou Enlai and Deng Xiaoping, meeting, decide to send Chen Boda, just named head of the Central Cultural Revolution Group, with a work group to the *Renmin ribao*, and Zhang Chengxian 张承先, former secretary of the Hebei committee''s Secretariat, then being moved to deputy minister of higher education (150 n.94), with one to Peking University; Zhou at once telephones Mao at Hangzhou and gets his consent; their joint letter of May 30, quoted: the paper''s standing fallen, a temporary work group under Chen Boda to hold the daily pages and guide Xinhua''s and the radio''s foreign news, entering May 31; the list of its members: Mu Xin 穆欣, Qian Dixian 钱抵千, Shang Like 尚力科, Zhu Yuepeng 朱悦鹏, Yang Ding 杨丁, with Lu Ying 鲁瑛 and Shao Yihua 邵以华 from Shanghai later; Mao writes on it "agree to do so"; Chen Boda and the others enter the paper that evening; the Wengao, XII, 61 (151 n.95))'
      units: B, C
