        date: '1966-08-01'
        place: peking
        thread: china-leadership
        c: 'Liu Shaoqi 刘少奇, at the Eleventh Plenum 八届十一中全会, on Chen Boda''s two written proposals: in the discussion most still wanted work groups; he too spoke for them, convenient to send and to withdraw; with some Peking schools'' organizations paralyzed, to break off the Party''s leadership would be bad.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 164. [[w.liu-shaoqi-zhuan]], II, 1033 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 164 n.109). Made public: 1998 ([[w.liu-shaoqi-zhuan]]). See [[cal.1966-06-20.china-leadership-23]]. Names: Liu Shaoqi, Chen Boda.'
