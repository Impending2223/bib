        date: '1966-06-22'
        thread: china-leadership
        c: 'Bo Yibo 薄一波, commenting for the Peking Geological Institute''s 北京地质学院 work group: tell the students plainly that Director Li (Li Renlin 李人林) was right; the work group, sent by the Party committee above, represents the Party; it cannot be withdrawn at will; driving it out is seizing the Party''s leadership; its faults may be corrected, but it is not to be called a "royalist party."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 164–165. Made public: 2008. See [[cal.1966-06-21.china-leadership-17]]. Names: Bo Yibo.'
