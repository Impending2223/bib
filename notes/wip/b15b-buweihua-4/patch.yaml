  - add:
      entry:
        id: cal.1966-06-20.china-leadership-17
        when: June 20
        date: '1966-06-20'
        thread: china-leadership
        c: 'The Center forwards, with its approval, the Ministry of Culture''s 文化部 "Request report on struggling to root out thoroughly the black line against the Party, socialism and Mao Zedong Thought" 〈文化部为彻底干净搞掉反党反社会主义反毛泽东思想的黑线而斗争的请示报告〉: for decades the ministry under the dictatorship of a black line headed by Zhou Yang 周扬; the struggle aimed at the bourgeoisie''s representatives and "authorities"; them and all hidden counter-revolutionaries to be cleaned out, "a thorough sweeping of the courtyard."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 130–131. Made public: 2008. Printed for internal circulation: [[w.wenhua-dageming-yanjiu-ziliao]], I, 53 (1988). To check: 〈文化部為徹底乾淨搞掉反黨反社會主義反毛澤東思想的黑線而鬥爭的請示報告〉, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 53 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 131 n.76).'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 130–131: all'
            - 'via x.1966-06-20.ministry-of-culture-request-report-black-line-zhou-yang: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place]
  - cite:
      id: cal.1966-06-23.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 131 (the Center forwards the Central-South Bureau''s "Request report on the situation of the cultural revolution and views" 〈關於文化大革命的情況和意見的請示報告〉: the report names those already pulled out as anti-Party, anti-socialist figures, among them Qin Mu 秦牧, Ke Lin 柯麟 and Liu Zhiming 劉志明 of the Zhongshan Medical College, Li Da 李達, He Dinghua 何定華 and Zhu Shaotian 朱劭天 of Wuhan University, Cheng Yun 程雲 and Wu Keren 武克仁 of Wuhan, Kang Zhuo 康濯 of Hunan, Guo Xiaotang 郭曉棠 of Zhengzhou University and Lu Di 陸地 of Guangxi; Liu''s note not given)'
  - add:
      entry:
        id: cal.1966-06-21.china-leadership-13
        when: June 21
        date: '1966-06-21'
        thread: china-leadership
        c: 'The East China Bureau 中共中央华东局, in its "Report on the situation of the cultural revolution" 〈关于文化大革命情况的报告〉, names many: Zhou Gucheng 周谷城, Li Pingxin 李平心, Zhou Yutong 周予同, Gu Jiguang 谷霁光, Sun Shuping 孙叔平 and Luo Ergang 罗尔纲 as bourgeois "scholars" and "experts"; Qu Baiyin 瞿白音, He Luting 贺绿汀 and Shi Linghe 石凌鹤 as "authorities" and "notables" of the art of the 1930s; Zhou Xinfang 周信芳 and Li Junmin 李俊民 criticized by name; Xia Zhengnong 夏征农, Li Fanfu 李凡夫, Yu Xiu 余修, Tao Bai 陶白 and Kuang Yaming 匡亚明 as "representatives of the bourgeoisie."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 131. Made public: 2008.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 131: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place]
  - cite:
      id: cal.1966-06-13.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 132 (Wuhan University''s "Three-Family Village" of Li Da 李達, He Dinghua 何定華 and Zhu Shaotian 朱劭天, among the most noted of the local "Three-Family Villages"; undated)'
