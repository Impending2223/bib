  - add:
      entry:
        id: cal.1966-05.china-leadership-42
        when: May, before the 25th
        date: 1966-05
        at: before 1966-05-25
        thread: china-leadership
        c: 'Zhou Enlai 周恩来 instructs that Peking University 北京大学 has foreign students from dozens of countries: the movement there is to be handled with great care, inside and outside kept apart.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129. Made public: 2008. See [[cal.1966-05-25.china-leadership]]. Names: Zhou Enlai.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 129: all'
        tags: [polity:prc, vis:only:prc, ok:fields-place, name:zhou-enlai]
  - cite:
      id: cal.1966-05-25.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 129 (the day the poster goes up, Jiang Nanxiang 蒋南翔, Minister of Higher Education and secretary and president of Tsinghua University, Zhang Yan 张彦, deputy director of the State Council''s Foreign Affairs Office, and Li Xuefeng 李雪峰, first secretary of the North China Bureau, already chosen as first secretary of the new Peking committee, come one after another to the university and restate the Center''s line: posters to keep Party and state discipline, inside and outside apart, the movement under leadership; who sent them not given)'
  - add:
      entry:
        id: cal.1966-05-25.china-leadership-9
        when: May 25, evening
        date: '1966-05-25'
        place: peking
        thread: china-leadership
        c: Peking University 北京大学. The Party committee 党委 meets that night in emergency session and criticizes Nie Yuanzi 聂元梓 and the others for putting up their poster, as against keeping inside and outside apart; the poster's content is not criticized. At the standing committee that evening Ge Hua 戈华, first deputy secretary, and Cui Xiongkun 崔雄昆, a standing member, argue for firm support of the mass movement and of the poster.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129, 129 n.73. The words: 連夜召開緊急會議 (129); 5月25日晚 (129 n.73). Made public: 1998 ([[w.beijing-daxue-jishi-1898]]). See [[cal.1966-05-25.china-leadership]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 129: all'
            - 'w.pu-weihua-zalan-jiu-shijie 129 n.73: all'
        tags: [polity:prc, vis:only:prc]
        time_range:
          - 1966-05-25T11:00Z
          - 1966-05-25T14:00Z
        time_band: evening
        time_zone: Asia/Shanghai
  - add:
      entry:
        id: cal.1966-05-29.china-leadership-4
        when: May 29
        date: '1966-05-29'
        place: peking
        thread: china-leadership
        c: Peking University 北京大学. Ge Hua 戈华, first deputy secretary of the Party committee, and Cui Xiongkun 崔雄昆, a standing member, put in a formal report on "Lu Ping's 陆平 crimes of suppressing the revolution," asking the Center and the North China Bureau 华北局 to send a work group to lead the cultural revolution at the university.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129 n.73. Made public: 1998 ([[w.beijing-daxue-jishi-1898]]). To check: [[w.beijing-daxue-jishi-1898]], 642–643 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 129 n.73).'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 129 n.73: all'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-05.china-leadership-43
        when: May, after the 25th
        date: 1966-05
        at: after 1966-05-25
        place: peking
        thread: china-leadership
        c: Yang Keming 杨克明, the poster's chief writer, under political pressure after it goes up, goes with Zhang Enci 张恩慈 to Cao Yi'ou 曹轶欧 at the Xiyi Hotel 西颐宾馆; she tells them there is nothing wrong with it. Yang leaves the draft with her.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129. Made public: 2008. See [[cal.1966-05-25.china-leadership]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 129: all'
        tags: [polity:prc, vis:only:prc]
