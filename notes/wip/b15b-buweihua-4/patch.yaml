  - cite:
      id: cal.1966-06-06.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 153 (June 6, the Secretariat decides to send a work group into the Propaganda Department; Xiao Wangdong 萧望东, former second political commissar of the Nanjing Military Region, newly made deputy minister and Party secretary of the Ministry of Culture, with the consent of the Military Commission''s leaders, sends work groups of army cadres into the units of the Ministry of Culture system, 300 drawn from the General Political Department and 500 straight from the Nanjing Military Region)'
  - variant:
      id: cal.1966-06-06.china-leadership-3
      unit: A
      witness: w.pu-weihua-zalan-jiu-shijie
      reads: Xiao Wangdong's army work groups go to the units of the Ministry of Culture system, 300 from the General Political Department and 500 from the Nanjing Military Region; the Secretariat's work group to the Propaganda Department is another decision of the same day
      at: '153'
  - cite:
      id: cal.1966-06-09.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 153–154 (June 9–12, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda and Kang Sheng go to Hangzhou to report to Mao and discuss the cultural revolution under him; Liu: in the schools some to seize power, some to criticize the academic authorities, then reform of the school system, examinations and textbooks; in the factories and villages whether to join it to the Four Cleanups; no clear view on whether to send work groups)'
      units: A, B
  - cite:
      id: cal.1966-06-12.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 154, 154 n.100 (Mao in the discussion: "sending work groups too fast is not good; there is no preparation; better let it be chaotic, a free-for-all, and send them when things are clear"; the talk not published, its gist known from later accounts: Li Dazhang heard at the Hangzhou meeting of June 12 Mao''s instruction not to send, to send few, to send late; Jiang Weiqing''s memoir relays the points of Mao''s talks of June 10 and 12: the schools to seize power, the universities first; a blow at 5 percent is not few; no hurry to send work groups, let a free-for-all run for some months (154 n.100))'
      units: F, G, H
  - to-check:
      id: cal.1966-06-12.china-leadership
      add: '[[w.jiang-weiqing-qishi-nian-zhengcheng]], 515 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 154 n.100)'
