        date: 1966-06
        at: after 1966-06-18
        place: peking
        thread: china-leadership
        c: 'Peking University 北京大学. The work group, in handling the June 18 incident, goes chiefly after four "bad men": Liu Jiabin 刘佳宾, a worker of the general affairs section, once a Guomindang captain, who led beatings; Chen Yingfu 陈应复, of the Eastern languages department, who led beatings and molested women; Xia Linhan 夏林翰, a radio student, who stripped a woman struggled in the biology department; and Xiu Zhicai 修治才, dismissed in 1962 for theft, who led beatings. It finds no tie to the "black gang."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 160. Made public: 2008.'
