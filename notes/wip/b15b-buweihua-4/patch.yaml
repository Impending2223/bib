        tags: [polity:prc, vis:only:prc]
        gloss:
          title: Estimates
          text:
            - Bu Weihua puts at over 60,000 the working households across the province misclassified as landlords and rich peasants in the "make-up lessons" ([[w.pu-weihua-zalan-jiu-shijie]], 133).
  - add:
      entry:
        id: cal.1966-06-01.china-leadership-13
        when: June 1
        date: '1966-06-01'
        place: xian
        thread: china-leadership
        c: 'Xi''an 西安. The Northwest Bureau 中共中央西北局 opens its enlarged third plenum 扩大的第三次全体会议 (to July 11), later widened to the leaders of the five northwestern provinces and regions down to the county secretaries. Barred from naming Hu Yaobang 胡耀邦, a cadre under the Center, it calls openly for exposing the "black line of Peng (Dehuai), Gao (Gang) and Xi (Zhongxun) 习仲勋 in the Northwest," with Zhao Shouyi 赵守一 and Li Qiming 李启明 as their agents and Hu as head: the Northwest "Three-Family Village."'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 134. Made public: 2008.'
