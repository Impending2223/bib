        place: shaanxi
        thread: china-leadership
        c: Shaanxi 陕西 begins the socialist education movement 社会主义教育运动 across the province.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 133. To check: [[w.zhongguo-gongchandang-zuzhishi-ziliao]], V, 770–771 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 133 n.79).'
