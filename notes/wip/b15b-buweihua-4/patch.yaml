        when: May, after the 25th
        date: 1966-05
        at: after 1966-05-25
        place: peking
        thread: china-leadership
        c: Yang Keming 杨克明, the poster's chief writer, under political pressure after it goes up, goes with Zhang Enci 张恩慈 to Cao Yi'ou 曹轶欧 at the Xiyi Hotel 西颐宾馆; she tells them there is nothing wrong with it. Yang leaves the draft with her.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 129. Made public: 2008. See [[cal.1966-05-25.china-leadership]].'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 129: all'
        tags: [polity:prc, vis:only:prc]
