        tags: [polity:prc, vis:only:prc]
  - cite:
      id: cal.1966-06-01.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 129–130 (at noon Mao comments on the *Jianbao* no. 13: to Kang Sheng and Boda, Xinhua may broadcast it in full and the papers everywhere print it, "most necessary"; the reactionary fortress of Peking University can from now begin to be broken; "please act"; the Central People''s Broadcasting Station broadcasts it at 8 p.m. that evening; the *Renmin ribao* of June 2 prints it in full on its front page, under "Seven comrades of Peking University expose a big plot in a poster," with the commentator''s article "Hail Peking University''s poster"; the Wengao, XII, 62 (130 n.74))'
      units: A, B, C
  - to-check:
      id: cal.1966-06-01.china-leadership
      add: '[[w.zedong-jianguo-yilai-mao-zedong]], XII, 62 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 130 n.74)'
  - add:
      entry:
        id: cal.1966-06-01.china-leadership-12
        when: June 1
        date: '1966-06-01'
        place: hangzhou
        thread: china-leadership
        c: 'Mao 毛泽东 telephones Kang Sheng 康生 and Chen Boda 陈伯达: the Peking University poster is the manifesto of a Peking commune of the 1960s, of greater meaning than the Paris Commune.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 130. Made public: 2008. See [[cal.1966-06-01.china-leadership]]. Names: Mao Zedong, Kang Sheng, Chen Boda.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 130: all'
        tags: [polity:prc, vis:only:prc, name:mao-zedong, name:kang-sheng, name:chen-boda]
  - cite:
      id: cal.1965-06-29.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 130 (Peng Zhen to the Peking University socialist education work team and the university''s Party cadres: "in studying the Peking University question I said Comrade Lu Ping is a good man who has erred, speaking of the nature of the error; the Chairman said at once, a good man who has made some errors": Mao minding the measure of the errors; Gong Yuzhi (130 n.75))'
      units: E
