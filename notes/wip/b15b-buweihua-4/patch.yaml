        c: 'Peking, the first middle school attached to Peking Normal University 北京师大一附中. Chen Yongkang 陈永康, He Fangfang 何方方 and others post "Drag out the ox-demons and snake-spirits who have crept in among us": since the work group came on June 9 the left is held down; Gou Deyuan 勾德元, its head, and his like use the Party''s name for anti-Party, anti-socialist deeds and strike at the proletarian left as at enemies.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 162. See [[cal.1966-06-20.china-leadership-6]].'
