        when: June 7
        date: '1966-06-07'
        place: peking
        thread: china-leadership
        c: Tsinghua University 清华大学, the "June 7 incident" 六七事件. Some students post against Jiang Nanxiang 蒋南翔 and the university's Party committee; most Party members and others are indignant and debate them. Rebels from Peking University, ignoring their work group, come to back them and expose Jiang's praise of Deng Tuo 邓拓 at the opening of Peking University's half-work, half-study history class; Tsinghua sends men to see them out, called "escorting them out under guard."
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 156.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 156: all'
        tags: [polity:prc]
