  - add:
      entry:
        id: cal.1966-06-02.china-leadership-13
        when: June 2
        date: '1966-06-02'
        place: peking
        thread: china-leadership
        c: 'Peking Polytechnic University 北京工业大学. Three of the new Peking committee''s work group arrive; students ask where they come from, the new committee or the old, and why they carry no letter of introduction; when they say they will send for one some cry "they mean to run away!" That day the work group and the university''s Party committee are surrounded; the committee declares itself paralyzed. To June 6 the students'' distrust goes on: they record the group''s words, tape its speeches, rebut them line by line, and take the tapes to the new committee and the Center.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 155.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 155: all'
        tags: [polity:prc]
  - add:
      entry:
        id: cal.1966-06-07.china-leadership-17
        when: June 7
        date: '1966-06-07'
        place: peking
        thread: china-leadership
        c: 'Peking University 北京大学, the "closed gate" incident 关门事件. The work group rules that people from other schools may not freely come in; a notice at the gate: delegations backing the poster are to be received at the gate''s reception room; the posters inside are being sorted and not open for now. Many radical students resent it; Mao later criticizes it sharply.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 155. Names: Mao Zedong.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 155: all'
        tags: [polity:prc, name:mao-zedong]
