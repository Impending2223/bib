      entry:
        id: cal.1966-03.china-leadership-19
        when: Mar.
        date: 1966-03
        place: shaanxi
        thread: china-leadership
        c: 'The Shaanxi 陕西 committee''s fourth plenum of its fourth term 四届四次全委会议 adopts "Views on the summary of the work of recent years and the main tasks ahead" 〈关于近几年工作总结和今后主要任务的意见〉 and a "Resolution on several questions of the socialist education movement" 〈关于社会主义教育运动几个问题的决议〉: the Four Cleanups 四清 in town and country to be finished in about three years, settling in them the incomplete land reform, the incomplete suppression of counter-revolutionaries and the impure organizations, and completing the "make-up lessons of the democratic revolution" 民主革命补课.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 133. Made public: 2008.'
