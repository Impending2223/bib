      c: 'Chen Yi 陈毅 speaks at the national conference on the remolding of rightists 全国改造右派分子工作会议: the biases in the work to be corrected; unity as well as struggle, not struggle without end; this is not the struggle of 1957. He agrees with the conference''s course: more rightists'' caps to come off, rest and enough food for them, reading, no labor beyond light auxiliary work, paid; let them see their wives and children.'
      n: '[[w.chen-yi-nianpu]], 890. Made public: 1995. Names: Chen Yi.'
