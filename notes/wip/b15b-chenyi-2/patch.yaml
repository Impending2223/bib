      c: 'Chen Yi 陈毅 speaks at the reception of 凯谢尔·巴哈杜尔, the Nepalese Ambassador, and his wife for Rishikesh Shaha: the United States fans the Sino-Indian conflict; Macmillan''s welcome of the cease-fire is good, but Britain''s military mission and arms to India look like egging India on to fight; the boundary can be settled only by peace.'
