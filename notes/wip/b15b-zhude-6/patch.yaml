        c: 'Peking 北京. Zhu De 朱德 attends the capital''s public memorial for Li Genyuan 李根源 and is chief mourner. The nianpu''s note: Li Genyuan died in Peking on July 6, 1965, a member of the National Committee of the CPPCC 政协全国委员会.'
