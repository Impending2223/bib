        id: cal.1965-12-25.china-leadership-5
        when: Dec. 25
        date: '1965-12-25'
        thread: china-leadership
        c: Zhu De 朱德, with Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and others, receives those at the specialized conferences held in Peking 北京 by the Supreme People's Court 最高人民法院, the Ministries of Food 粮食部, the Second Light Industry 第二轻工业部, State Farms and Land Reclamation 农垦部, Commerce 商业部, Building Materials 建筑材料工业部 and the Fourth Ministry of Machine Building 第四机械工业部, the State Council's Finance and Trade Office 国务院财贸办公室, the Ministry of Culture 文化部, the People's Bank 人民银行, the Center's North China Bureau 中共中央华北局, the Air Force 空军 and others; with them the cadre trainees in politics and law, water and power, and food studying in Peking, the Ulan Muqi 乌兰牧骑 touring troupe of Inner Mongolia 内蒙古, the song and dance troupe of Hotan prefecture 和田专区, Xinjiang 新疆, and the Guangdong Cantonese Opera Theatre 广东粤剧院.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1945. Names: Zhu De, Zhou Enlai, Deng Xiaoping.'
        tags: ['polity:prc', 'name:zhu-de', 'name:zhou-enlai', 'name:deng-xiaoping']
