  - cite: {id: cal.1966-05-04.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1952–1953 (May 4–26, 1966; Zhu De 朱德 at the enlarged Politburo meeting in Peking 北京, which wrongly criticizes the so-called "anti-Party group of Peng Zhen 彭真, Luo Ruiqing 罗瑞卿, Lu Dingyi 陆定一 and Yang Shangkun 杨尚昆"; on Mao Zedong''s 毛泽东 advice it suspends Peng Zhen, Luo Ruiqing and Lu Dingyi as secretaries of the Secretariat, removes Peng Zhen as first secretary of the Peking committee and mayor and Lu Dingyi as head of the Propaganda Department, suspends Yang Shangkun as alternate secretary, dissolves the Five-Man Group and sets up the Cultural Revolution Group 文化革命小组 (later the Central Cultural Revolution Group 中央文革小组) under the Politburo Standing Committee)'}
  - cite: {id: cal.1966-05-16.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1952 (May 16, 1966; the enlarged Politburo meeting adopts the Central Committee''s Notice 《中国共产党中央委员会通知》 (the "May 16 Notice" 五一六通知))'}
  - cite: {id: cal.1966-05-18.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1952 (May 18, 1966; Lin Biao 林彪 speaks at the meeting, pressing the cult of Mao Zedong''s person and, gathering cases ancient and modern, Chinese and foreign, making up the lie that some are plotting a coup)'}
