        date: '1965-08-06'
        place: beidaihe
        thread: china-leadership
        c: 'Beidaihe 北戴河. Zhu De 朱德 hears Pan Fusheng 潘复生, director of the council of the All-China Federation of Supply and Marketing Cooperatives 中华全国供销合作总社. His remarks: the cooperatives'' chief task is not the profit they hand up but to support production; only with more production will state and people grow rich; they are to be the bridge between the state and the peasants and one of the state''s economic strongholds in the countryside.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1937. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
