  - cite: {id: cal.1965-12-08.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1944 (Dec. 8–15, 1965; Zhu De 朱德 at the enlarged Politburo Standing Committee Mao Zedong 毛泽东 calls at Shanghai 上海; those attending learn only at the meeting that it is to criticize Luo Ruiqing 罗瑞卿; Ye Qun 叶群, Lin Biao''s 林彪 wife, speaks three times, some ten hours, inventing how Luo pressed Lin Biao to "yield his place"; Luo, called to Shanghai on Dec. 11, is given no chance to answer at the meeting; Lin Biao, Wu Faxian 吴法宪, commander of the Air Force, Li Zuopeng 李作鹏, political commissar of the Navy, and others charge him with "usurping the army and opposing the Party," opposing "giving prominence to politics" and the "living study and living use" of Mao Zedong Thought; Zhu De says at the meeting that Mao Zedong Thought cannot be called the summit of Marxism-Leninism, for a summit cannot develop further; the nianpu''s note: from Sept. 1959, when he took over the Ministry of Defense and the Military Commission''s work, Lin Biao had often trumpeted Mao Zedong Thought as "the summit of Marxism-Leninism of our time")'}
