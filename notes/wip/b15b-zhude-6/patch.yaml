  - cite: {id: cal.1966-06-10.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1954 (June 10, 1966; Mao Zedong 毛泽东, at Hangzhou 杭州, talks with Hồ Chí Minh 胡志明: revisionism has appeared in China too; Peng Zhen 彭真, Luo Ruiqing 罗瑞卿, Lu Dingyi 陆定一 and Yang Shangkun 杨尚昆 are friends of his and of Mao''s; Peking was an independent kingdom no one could question; this time hundreds or thousands, great and small, may be brought down, in learning, education, the press, publishing, literature and art, and the universities and schools)'}
