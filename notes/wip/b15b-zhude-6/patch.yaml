  - cite: {id: cal.1966-05-23.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1953 ("in the days after" May 12, 1966, the day not given; at the meeting Lin Biao 林彪, Kang Sheng 康生 and others attack Zhu De 朱德, making his objection to calling Mao Zedong Thought the summit of Marxism-Leninism into "using Marxism against Chairman Mao," and calling him "ambitious," "wanting the yellow robe put on him," "a time bomb in the Party")'}
