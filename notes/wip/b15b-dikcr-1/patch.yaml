- cite:
    id: cal.1966-08-20.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 115 n.2 (Tan Lifu''s speech of Aug. 20 on keeping those not born red out of the Red Guards; millions of copies printed at every level of government)'
- cite:
    id: cal.1966-10-01.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 116 n.4 (the editorial, edited by Chen Boda: the power holders taking the capitalist road "a small bunch of counter-revolutionary revisionists" who "raise the red flag in order to fight the red flag"; the "bourgeois reactionary line"; the text has it published Oct. 3, its note gives *Hongqi*, no. 13, Oct. 1, 1966)'
- cite:
    id: cal.1966-10-16.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 116 n.5 (Chen Boda names Liu Shaoqi and Deng Xiaoping the main targets, sets their "bourgeois reactionary line" against Mao''s line, and savages Tan Lifu''s bloodline couplet; the talk widely disseminated on Mao''s instructions)'
- cite:
    id: cal.1966-11-09.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 125 n.24, n.25 (the Red Workers inaugurated on Cultural Plaza; Cao Diqiu calls them the "dregs of humanity"; 20,000 march to city hall in the rain; a rumoured telegram from Zhou; over a thousand board a train for Peking, shunted to a siding; the line to Nanjing blocked thirty hours until Zhang Chunqiao arrives by military plane)'
- cite:
    id: cal.1966-12-26.china-leadership-9
    item: '[[w.dikotter-cultural-revolution]], 124 n.22, n.23 (Jiang Qing to the temporary workers'' alliance: "Chairman Mao is backing you!"; all workers fired since June 1 for criticizing their leaders to be reinstated with back pay; the minister of labour denounced; Yao Wenyuan: "Let him become a temporary worker!")'
- cite:
    id: cal.1966-12-26.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 124 n.23 (that evening, with the Cultural Revolution Group, Mao''s toast: "To the unfolding of a nationwide civil war!")'
- cite:
    id: cal.1966-12-30.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 126 n.26 (on Kangping Road 100,000 rebels with iron pipes, clubs and bamboo poles assault 20,000 guarding the city committee; Wang Hongwen leads the charge; close to a hundred casualties; on Zhang Chunqiao''s orders Scarlet Guard offices ransacked and several hundred leaders rounded up)'
- cite:
    id: cal.1967-01-11.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 127 n.28 (Mao''s congratulatory telegram to the Red Workers: the nation to learn from Shanghai and seize power)'
- cite:
    id: cal.1967-01-22.china-leadership-2
    item: '[[w.dikotter-cultural-revolution]], 127 (the "January Storm": "If you have power, you have everything ... Seize power! Seize power!! Seize power!!!")'
