      id: cal.1962-02.china-leadership-11
      when: Feb., early
      date: '1962-02'
      at: before 1962-02-11
      thread: china-leadership
      place: peking
      c: 'Seven Thousand Cadres Conference, Peking: Wang Renzhong 王任重, first secretary of Hubei 湖北, confesses that his province misled the Center by inflating its output figures.'
      n: '[[w.dikotter-cultural-revolution]], 13–14 n.19 (the conference in the Great Hall, Peking, 3). Made public: 2006 ([[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], the earliest printing the note names). To check: [[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], 176–183 (cited by [[w.dikotter-cultural-revolution]], 14 n.19a); [[w.macfarquhar-origins-of-the-cultural]], III, 172 (cited by [[w.dikotter-cultural-revolution]], 14 n.19b). See [[cal.1962-02.china-leadership-3]]. Check: the day; the book sets the confessions after Mao''s speech of Jan. 30 and before the close of Feb. 7.'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: c66d8afe
        rows:
        - 'w.dikotter-cultural-revolution 13–14: all'
