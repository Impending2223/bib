    id: cal.1966-06-01.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 57 n.12 (Kang sends Mao a copy of the poster of May 25; Mao: "even more significant than the manifesto of the Paris commune"; broadcast that evening)'
- cite:
    id: cal.1966-05-25.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 57 n.12 (Nie, nudged by Kang Sheng, who sent his wife to the campus, puts up her poster: the university under the bourgeoisie, its leaders "a bunch of Khrushchev-type revisionist elements"; thousands of posters the next day)'
- cite:
    id: cal.1966-06-03.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 57–58 n.13 (the new committee inaugurated; Mao''s portraits and red flags over the headquarters, arc lamps, lorries of delegations; the demonstration tapers off at 8 the next morning)'
- cite:
    id: cal.1966-05-07.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 59–60 n.18 (the army to be a great school: military and educational, agricultural, industrial and civilian work; the letter widely distributed in the following weeks)'
- cite:
    id: cal.1966-06-09.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 60 n.20 (Liu and Deng fly to Hangzhou to seek Mao''s consent to the work teams; he remains evasive; to his doctor afterwards: "Let them handle the problems of the movement by themselves")'
- cite:
    id: cal.1966-06-09.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 60 (the largest work team, more than 500, Wang Guangmei among them, enters Tsinghua on June 9)'
- cite:
    id: cal.1966-06-21.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 64 n.29 (Kuai Dafu asks whether the work team''s power represents us; Wang Guangmei: "the rightist student Kuai Dafu wants to seize power"; a few days later he is denounced, humiliated before the student body and locked in his dormitory)'
- cite:
    id: cal.1966-06-13.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 64 n.30 (Bo Yibo instructs his work team to "trick the snakes into leaving their pit")'
- cite:
    id: cal.1966-06-20.china-leadership-6
    item: '[[w.dikotter-cultural-revolution]], 64 n.30 (Liu to the work team he guides at the middle school attached to Peking Normal University: pick the right moment, wait until most of the monsters have exposed themselves, then counter-attack)'
- cite:
    id: cal.1966-06-18.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 64 (scores condemned as counter-revolutionaries for parading and humiliating the university''s president on June 18)'
- cite:
    id: cal.1966-06-07.china-leadership-11
    item: '[[w.dikotter-cultural-revolution]], 65 n.31 (after a schoolmate is condemned as a rightist for calling the president a "capitalist roader," students hunger-strike three days opposite the provincial Party headquarters; students of other universities join; Zhou Enlai intervenes)'
