      when: Aug. 23
      date: '1966-08-23'
      thread: china-leadership
      also:
      - china
      place: peking
      c: 'The *Jiefangjun bao*, under Lin Biao 林彪''s hand, to the Red Guards: "What you did was right, and you did it well!"'
      n: '[[w.dikotter-cultural-revolution]], 83 n.8. To check: Lu Hong, *Junbao neibu xiaoxi* (2006), 109–110 (cited by [[w.dikotter-cultural-revolution]], 83 n.8). Names: Lin Biao.'
      tags:
      - polity:prc
