      when: Feb. 27
      date: '1968-02-27'
      thread: china-leadership
      place: wuhan
      c: 'As a Hubei 湖北 report has it: in Wuhan 武汉 20,000 homes were raided; the loot 319,933 silver dollars, over 3 million yuan in deposits, 560,130 yuan in cash, 91,000 pieces of porcelain, 971.1 kilos of gold, 1,717 kilos of silver, 22 rifles, 8 Nationalist flags; across the province 1 percent of households raided, the seized assets put at 200 million yuan, over 4 tonnes of gold; in the unguarded stores most of the plunder since stolen or ruined.'
      n: '[[w.dikotter-cultural-revolution]], 89–91 n.30, n.38. Made public: 2016. To check: Hubei Provincial Archives, Feb. 27, 1968, SZ139-6-49, pp. 54–55 (cited by [[w.dikotter-cultural-revolution]], 90 n.30); the same (cited by [[w.dikotter-cultural-revolution]], 91 n.38).'
