      n: '[[w.dikotter-cultural-revolution]], 88 n.24. To check: Nien Cheng, *Life and Death in Shanghai* (Penguin, 2008), 70–82, 105–107 (cited by [[w.dikotter-cultural-revolution]], 88 n.24). See [[cal.1966-08-30.china]]. Check: the day ("a couple of weeks later").'
