- add:
    entry:
      id: cal.1964.china-leadership-41
      when: 1964, Sept.–Nov.
      date: '1964'
      at: before 1964-09
      thread: china-leadership
      place: guizhou
      c: 'Guizhou 贵州: the work team denounces the whole provincial leadership as "rightist," Guiyang 贵阳 a "nest of counter-revolutionaries," a "small Taiwan"; it searches homes, sets people to denounce each other and holds public trials; In the two months after the team''s head takes over the province, in September, up to a quarter of the Party members of some counties vanish from view, some warned, some arrested or sent to the camps.'
      n: '[[w.dikotter-cultural-revolution]], 24 n.30. Made public: 2006 (Gao Hua in *Ershiyi shiji*, the earliest printing the note names). To check: Gao Hua, "Zai Guizhou ''siqing yundong'' de beihou," *Ershiyi shiji*, no. 93 (Feb. 2006), 75–89 (cited by [[w.dikotter-cultural-revolution]], 24 n.30a); Yan Lebin, *Wo suo jingli de nage shidai* (2012), 90–91 (cited by [[w.dikotter-cultural-revolution]], 24 n.30b). See [[cal.1964-10.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Luo Bing: over 5 million Party members punished in the socialist education campaign Liu Shaoqi conducted, more than 77,000 hounded to their deaths, most of them innocent ([[w.dikotter-cultural-revolution]], 24 n.31).'
        - 'Estimates. Yang Jisheng gives Luo Bing''s figures: 77,560 driven to death, 5,327,350 rectified, 5,760 cliques, 276,256 enemies and 558,220 more treated as among the people; Bu Weihua doubts them ([[w.yang-jisheng-tiandi-fanfu]], I, 87).'
      src:
        c: afaba240
        rows:
        - 'w.dikotter-cultural-revolution 24: all'
        - 'via w.dikotter-cultural-revolution 24 n.30a: all'
        - 'via w.dikotter-cultural-revolution 24 n.30b: all'
- cite:
    id: cal.1963-03.china-leadership-6
    item: '[[w.dikotter-cultural-revolution]], 22 n.24 (Peking sends a team 1,500 strong; it scrutinizes the Baiyin Silver and Non-Ferrous Metals Company, interrogates, denounces in public meetings and tortures some 2,000 of its employees; hundreds accused, from "speculation" to "moral decadence"; fourteen commit suicide; announced: "power had been seized by counter-revolutionaries"; Mao likes the report and the inquiry is widened to the whole city)'
