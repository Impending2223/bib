      thread: china-leadership
      place: canton
      c: 'Canton 广州: the city Party committee takes over the Sacred Heart Cathedral, vandalized by Red Guards, as the sorting house for confiscated goods: furniture, books and clothes in the nave, silver and gold bars in the gatekeepers'' rooms, more than a hundred musical boxes.'
      n: '[[w.dikotter-cultural-revolution]], 89 n.29. To check: David Tsui, interview, July 26, 2012 (cited by [[w.dikotter-cultural-revolution]], 89 n.29). Check: the day.'
