      date: '1965-11'
      at: after 1965-11-10
      thread: china-leadership
      c: 'Zhou Enlai telephones Peng Zhen: the Chairman himself is behind Yao Wenyuan''s polemic. Peng, who had forbidden the Peking papers to reprint it, gives way, holding that the link between Hai Rui and Peng Dehuai is a purely academic matter.'
