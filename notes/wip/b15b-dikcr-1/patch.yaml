- add:
    entry:
      id: cal.1966-08-19.china
      when: Aug. 19
      date: '1966-08-19'
      thread: china
      place: peking
      c: 'Peking 北京: Red Guards put up posters declaring war on the old world: barbers, tailors, photographers, book pedlars at the service of the bourgeoisie no exception; high heels, fancy haircuts, short skirts, jeans, bad books to go at once. The printers of the *Zhongguo qingnian bao* run off thousands of copies.'
      n: '[[w.dikotter-cultural-revolution]], 81–82 n.4. To check: Theo Peters, "The Cultural Revolution Stage III," Sept. 19, 1966, FO 371/186982, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 82 n.4a); Huang Yanmin, "Posijiu yundong de fazhan mailuo," *Ershiyi shiji*, no. 137 (June 2013), 71–82 (cited by [[w.dikotter-cultural-revolution]], 82 n.4b).'
      tags:
      - polity:prc
      src:
        c: 23d3220e
        rows:
        - 'w.dikotter-cultural-revolution 81–82: all'
        - 'via w.dikotter-cultural-revolution 82 n.4a: all'
        - 'via w.dikotter-cultural-revolution 82 n.4b: all'
