- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 13 (Mao''s token apology: as Chairman of the Party he is at least in part accountable)'
- cite:
    id: cal.1962-02-07.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 13 n.18 (Zhou takes on himself the excessive procurements, the inflated figures, the draining of grain from the provinces and the growing food exports: the faults came where the general line and Mao''s instructions were contravened)'
