      place: peking
      c: 'As Leonard Appleyard of the British mission reports it ("Manifestations of the Mao Cult"): all records for slogans broken, every clean stretch of wall with its quotation or tribute to Mao; brick structures with slogans at key points of Peking 北京; quotations on buses and lorries, Mao''s photograph on the engines of trains, cards on bicycles.'
      n: '[[w.dikotter-cultural-revolution]], 96–97 n.9. Made public: 2016. To check: Leonard Appleyard to John Benson, "Manifestations of the Mao Cult," Sept. 28, 1966, FO 371/186983, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 97 n.9).'
