      place: shanghai
      c: 'Shanghai 上海: Red Guards from Peking 北京 and Tianjin 天津 besiege the Party headquarters, demanding to see Cao Diqiu 曹荻秋, the mayor, a "capitalist roader."'
      n: '[[w.dikotter-cultural-revolution]], 104 n.6. To check: K. Godwin, "Letter from Shanghai," Aug. 29, 1966, FO 371/186982 (cited by [[w.dikotter-cultural-revolution]], 104 n.6a); Wang Duanyang, *Yige hongweibing de riji* (2007), 63 (cited by [[w.dikotter-cultural-revolution]], 104 n.6b).'
