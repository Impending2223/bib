      when: Aug. 22
      date: '1966-08-22'
      thread: china
      place: peking
      c: Xinhua 新华社 hails the Red Guards as "Mao's little generals," sweeping away the old culture; the Central People's Radio carries it to the country in a special broadcast.
      n: '[[w.dikotter-cultural-revolution]], 81–82 n.4. To check: Theo Peters, "The Cultural Revolution Stage III," Sept. 19, 1966, FO 371/186982 (cited by [[w.dikotter-cultural-revolution]], 82 n.4a); Huang Yanmin, "Posijiu yundong de fazhan mailuo," *Ershiyi shiji*, no. 137 (June 2013), 71–82 (cited by [[w.dikotter-cultural-revolution]], 82 n.4b). See [[cal.1966-08-20.china-leadership-4]].'
