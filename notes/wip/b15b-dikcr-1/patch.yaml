      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: xian
      c: 'Xi''an 西安: a "Red Terror Brigade" douses a teacher in petrol and sets him alight.'
      n: '[[w.dikotter-cultural-revolution]], 80 n.2. To check: Dong Shengli, "Guanyu Xi''an hongse kongbudui de koushu huiyi," *Jiyi*, no. 10 (Dec. 2008), 47–49 (cited by [[w.dikotter-cultural-revolution]], 80 n.2c). Check: the day.'
      tags:
