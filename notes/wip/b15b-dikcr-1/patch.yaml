      date: '1963-04'
      at: before 1963-04-09
      thread: china-leadership
      place: anhui
      c: 'As *Neibu cankao* reports it: the Anhui 安徽 countryside is recollectivized within half a year, countless production teams made to surrender their land to the communes; villagers working on their own at the communes'' margins are accused of undermining the collective economy.'
      n: '[[w.dikotter-cultural-revolution]], 19 n.15. Made public: 2016. To check: *Neibu cankao*, Mar. 1, 1963, 7–9; Apr. 5, 1963, 6–9; Apr. 9, 1963, 2–5 (cited by [[w.dikotter-cultural-revolution]], 19 n.15a–c). Check: the day; the note gives three reports for the paragraph.'
      tags:
