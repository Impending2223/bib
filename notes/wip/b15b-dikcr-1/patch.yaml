- add:
    entry:
      id: cal.1962-03.china-leadership-9
      when: Mar.
      date: '1962-03'
      thread: china-leadership
      place: baiyin
      c: 'Baiyin 白银, Gansu 甘肃: the local Party committee criticizes not only Zhang Zhongliang 張仲良, the provincial first secretary, but Liu Shaoqi, Zhou Enlai and Mao himself: "If Chairman Mao is not examined and corrected, he will commit the same errors as the later Stalin."'
      n: '[[w.dikotter-cultural-revolution]], 22 n.24. Made public: 2007 (Dai Yushan in *Zhengming*, the printing the note names). To check: Dai Yushan, "Siqing dayuan''an de zhenxiang," *Zhengming*, Jan. 2007, 82–83 (cited by [[w.dikotter-cultural-revolution]], 22 n.24). Names: Liu Shaoqi, Zhou Enlai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:mao-zedong
      src:
        c: 24b6f641
        rows:
        - 'w.dikotter-cultural-revolution 22: all'
        - 'via w.dikotter-cultural-revolution 22 n.24: all'
- add:
    entry:
      id: cal.1963-03.china-leadership-11
      when: Mar.
      date: '1963-03'
      thread: china-leadership
      place: baiyin
      c: 'Baiyin 白银: Peking sends a team 1,500 strong. It interrogates, denounces in public meetings and tortures some 2,000 employees of the Baiyin Silver and Non-Ferrous Metals Company; hundreds accused, of "speculation" to "moral decadence"; fourteen commit suicide. Announced: "power had been seized by counter-revolutionaries."'
      n: '[[w.dikotter-cultural-revolution]], 22 n.24. Made public: 2007 (Dai Yushan in *Zhengming*, the printing the note names). To check: Dai Yushan, "Siqing dayuan''an de zhenxiang," *Zhengming*, Jan. 2007, 82–83 (cited by [[w.dikotter-cultural-revolution]], 22 n.24). See [[cal.1962-03.china-leadership-9]]. Check: the year; the calendar has the Center forwarding Gao Yangwen''s report on the Baiyin company on Dec. 19, 1964 ([[cal.1964-12-19.china-leadership-7]]).'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: ac71b5dc
        rows:
        - 'w.dikotter-cultural-revolution 22: all'
        - 'via w.dikotter-cultural-revolution 22 n.24: all'
- add:
    entry:
      id: cal.1963-04.china-leadership-14
      when: Apr., by the 9th
      date: '1963-04'
      at: before 1963-04-09
      thread: china-leadership
      c: 'As *Neibu cankao* reports it: in the Xingtai region of Hebei 河北, many thousands of committees of poor and middle peasants, set up for the socialist education, are turned on "capitalists" and "go-it-aloners"; they demand back every holding larger than the private plots allowed since 1960.'
      n: '[[w.dikotter-cultural-revolution]], 18–19 n.15. Made public: 2016. To check: *Neibu cankao*, Mar. 1, 1963, 7–9; Apr. 5, 1963, 6–9; Apr. 9, 1963, 2–5 (cited by [[w.dikotter-cultural-revolution]], 19 n.15a–c). Check: the day; the note gives three reports for the paragraph.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 9d39c1a9
        rows:
        - 'w.dikotter-cultural-revolution 18–19: all'
        - 'via w.dikotter-cultural-revolution 19 n.15a: all'
        - 'via w.dikotter-cultural-revolution 19 n.15b: all'
        - 'via w.dikotter-cultural-revolution 19 n.15c: all'
- add:
