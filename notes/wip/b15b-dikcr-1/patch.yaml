      c: 'Canton 广州: a teacher is made to drink a bottle of ink and kicked in the stomach until he brings it up with blood; he later kills himself.'
      n: '[[w.dikotter-cultural-revolution]], 80 n.2. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 80 n.2a); Chen Yinan, *Qingchun wuhen* (2006), ch. 2 (cited by [[w.dikotter-cultural-revolution]], 80 n.2b). Check: the day.'
