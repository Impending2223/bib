      date: '1964-10'
      at: before 1964-10-10
      thread: china-leadership
      place: hunan
      c: 'As Hunan 湖南 reports have it: the work teams find up to 80 percent of the province''s rural cadres corrupt, in league with people of bad class background; the slogan "class struggle is a struggle to the death"; in every commune several victims beaten to death.'
      n: '[[w.dikotter-cultural-revolution]], 21 n.22. Made public: 2016. To check: Hunan Provincial Archives, May 6, 1964, 146-1-743, pp. 103–108 (cited by [[w.dikotter-cultural-revolution]], 21 n.22a); Hunan Provincial Archives, Oct. 10, 1964, 146-1-776, p. 163 (cited by [[w.dikotter-cultural-revolution]], 21 n.22b); Xie Chengnian, "Wo qinli de ''siqing'' yundong naxie shi," *Wenshi tiandi*, no. 6 (June 2012), 8–9, the slogan (cited by [[w.dikotter-cultural-revolution]], 21 n.22c). Check: the day; the note gives two reports, of May 6 and Oct. 10, 1964.'
