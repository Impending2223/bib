      id: cal.1964.china-leadership-39
      when: 1964, summer
      date: '1964'
      at: before 1964-06-21
      thread: china-leadership
      c: 'Liu Shaoqi, touring the provinces in charge of the socialist education, tells their leaders that the fight against revisionism abroad is to be tied to its suppression at home; Mao may have been too cautious: "It may well be more than a third."'
      n: '[[w.dikotter-cultural-revolution]], 23 n.28. Made public: 2005 (Guo Dehong and Lin Xiaobo, *Siqing yundong shilu*, the earliest printing the note names). To check: Guo Dehong and Lin Xiaobo, *Siqing yundong shilu* (2005), 130–132 (cited by [[w.dikotter-cultural-revolution]], 23 n.28a); Gao Hua, "Zai Guizhou ''siqing yundong'' de beihou," *Ershiyi shiji*, no. 93 (Feb. 2006), 83 (cited by [[w.dikotter-cultural-revolution]], 23 n.28b). See [[cal.1964-06-08.china-leadership]]. Names: Liu Shaoqi, Mao Zedong. Check: the day.'
      tags:
