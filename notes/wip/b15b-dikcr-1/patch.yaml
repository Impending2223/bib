      c: 'The Center''s document Zhongfa (63) 368: opium is being grown again, fields from Heilongjiang 黑龙江 to Shanxi 山西; in Zunyi 遵义, Guizhou, dozens of opium dens operate with impunity.'
      n: '[[w.dikotter-cultural-revolution]], 19 n.17. Made public: 2016. To check: Zhongfa (63) 368, May 26, 1963, Shandong Provincial Archives, A1-2-1157, pp. 11–14 (cited by [[w.dikotter-cultural-revolution]], 19 n.17).'
