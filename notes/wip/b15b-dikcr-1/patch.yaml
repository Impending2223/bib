    item: '[[w.dikotter-cultural-revolution]], 65 n.33 (Wang Hongwen, head of security at the mill of 8,000, denounces piece rates; at the end of June a work team counter-attacks: several hundred workers denounced as "anti-party elements," Wang a "self-seeking careerist")'
