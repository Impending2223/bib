      n: '[[w.dikotter-cultural-revolution]], 99–100 n.20. Made public: 2016. To check: Shanghai Municipal Archives, May 7 and July 16, 1967, B182-2-8, pp. 2–4, 9–11 (cited by [[w.dikotter-cultural-revolution]], 100 n.20a); Shanghai Municipal Archives, July 10, 1968, B182-3-66, pp. 30–33 (cited by [[w.dikotter-cultural-revolution]], 100 n.20b). Check: the day.'
