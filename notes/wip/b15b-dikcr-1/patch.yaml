- add:
    entry:
      id: cal.1966-08-24.china-leadership-13
      when: Aug. 24
      date: '1966-08-24'
      thread: china-leadership
      also:
      - china
      place: peking
      c: 'The *Jiefangjun bao*, another editorial: the army will stand resolutely behind the Red Guards; "Learn from the Red Guards! Respect the Red Guards!"'
      n: '[[w.dikotter-cultural-revolution]], 83 n.8. To check: Lu Hong, *Junbao neibu xiaoxi* (2006), 109–110 (cited by [[w.dikotter-cultural-revolution]], 83 n.8). See [[cal.1966-08-23.china-leadership-11]].'
      tags:
      - polity:prc
      src:
        c: 190e3ebc
        rows:
        - 'w.dikotter-cultural-revolution 83: all'
        - 'via w.dikotter-cultural-revolution 83 n.8: all'
- add:
    entry:
      id: cal.1966-08.china-9
      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: zhengding
      c: 'Zhengding 正定: the middle-school Red Guards rename streets, tear down shop signs, make an old woman with bound feet stand four hours in the sun as a "prostitute," pull down an ancient archway with ropes and crowbars, and, hundreds of them, the onion dome of the mosque; its old watchman made to wear a pig''s tail.'
      n: '[[w.dikotter-cultural-revolution]], 82 n.5. To check: [[w.yuan-born-red]], 92 (cited by [[w.dikotter-cultural-revolution]], 82 n.5). Check: the day.'
      tags:
      - polity:prc
      src:
        c: 8950c15a
        rows:
        - 'w.dikotter-cultural-revolution 82: all'
- add:
    entry:
      id: cal.1966-08.china-10
      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: xiamen
      c: 'Xiamen 厦门: Red Guard teams, with addresses from the street committees, destroy brass knockers, shop signs and temple cornices, cut the hair of returned overseas students and long braids, slit trousers too narrow for two bottles, slice off high heels.'
      n: '[[w.dikotter-cultural-revolution]], 82–83 n.6. To check: Ken Ling, *The Revenge of Heaven* (1972), 36–38 (cited by [[w.dikotter-cultural-revolution]], 83 n.6). Check: the day.'
      tags:
      - polity:prc
      src:
        c: '02219540'
        rows:
        - 'w.dikotter-cultural-revolution 82–83: all'
        - 'via w.dikotter-cultural-revolution 83 n.6: all'
- add:
    entry:
      id: cal.1966-08-29.china
      when: Aug. 29
      date: '1966-08-29'
      thread: china
      place: shanghai
      c: 'As K. Godwin reports it from Shanghai 上海: Red Guards chip, drill and burn the ornaments off the Bund''s buildings, the Bund now Revolutionary Boulevard; curio and flower shops smashed; mattresses, silk, velvet and cosmetics carted away; old people frogmarched barefoot to the railway station, placards round their necks.'
      n: '[[w.dikotter-cultural-revolution]], 83, 92–93 n.7, n.43. Made public: 2016. To check: K. Godwin, letter from Shanghai ("Report from Shanghai"), Aug. 29, 1966, FO 371/186982, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 83 n.7a); Nien Cheng, *Life and Death in Shanghai* (Penguin, 2008), 62–63 (cited by [[w.dikotter-cultural-revolution]], 83 n.7b); the same, FO 371/186982 (cited by [[w.dikotter-cultural-revolution]], 93 n.43a).'
      tags:
      - polity:prc
      - vis:only:uk
      - polity:uk
      - form:state
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after MacFarquhar and Schoenhals: by a conservative estimate 400,000 victims exiled from the cities in the country as a whole ([[w.dikotter-cultural-revolution]], 93 n.43).'
      src:
        c: db4dcaa9
        rows:
        - 'w.dikotter-cultural-revolution 83, 92–93: all'
        - 'via w.dikotter-cultural-revolution 83 n.7a: all'
        - 'via w.dikotter-cultural-revolution 83 n.7b: all'
        - 'via w.dikotter-cultural-revolution 93 n.43a: all'
- add:
    entry:
      id: cal.1966-08.china-11
      when: Aug., after the 23rd
      date: '1966-08'
      at: after 1966-08-23
      thread: china
      place: xiamen
      c: 'Xiamen 厦门: a book burning, the flames three storeys high on sixty litres of kerosene; onlookers bring chairs and crowd the roofs.'
      n: '[[w.dikotter-cultural-revolution]], 83–84 n.9. To check: Ken Ling, *The Revenge of Heaven* (1972), 46–47 (cited by [[w.dikotter-cultural-revolution]], 84 n.9). Check: the day.'
      tags:
      - polity:prc
      src:
        c: 4152a7b5
        rows:
        - 'w.dikotter-cultural-revolution 83–84: all'
        - 'via w.dikotter-cultural-revolution 84 n.9: all'
- add:
    entry:
      id: cal.1966-08-28.china-leadership-11
      when: Aug. 28
      date: '1966-08-28'
      thread: china-leadership
      also:
      - china
      place: shanghai
      c: 'As a Shanghai 上海 report has it: Red Guards destroy thousands of books of the Zikawei Library (over 200,000 volumes, begun by the Jesuits in 1847); in Huangpu district lorries carry books round the clock to the paper mill; in a few days eighteen listed monuments are pulled down, among them Xu Guangqi''s tomb, the Longhua Pagoda (its 3,000 scriptures burned) and the Confucius Temple; St Ignatius Cathedral''s spires, ceiling and windows smashed.'
      n: '[[w.dikotter-cultural-revolution]], 84 n.10, n.11. Made public: 2016. To check: Shanghai Municipal Archives, Aug. 28, 1966, B3-2-198, pp. 41–44 (cited by [[w.dikotter-cultural-revolution]], 84 n.10a); the same (cited by [[w.dikotter-cultural-revolution]], 84 n.11a); Shanghai Municipal Archives, May 29 and Oct. 13, 1967, B172-3-5, pp. 20–21, 31–36 (cited by [[w.dikotter-cultural-revolution]], 84 n.11b).'
