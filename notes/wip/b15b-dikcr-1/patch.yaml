      when: Sept. 28
      date: '1966-09-28'
      thread: china
      place: peking
      c: 'As John Boyd of the British mission reports it ("Invasion of Peking"): Red Guards from the provinces pour into Peking 北京 by bus and train, as many as thirty coaches from Shanxi 山西 alone parked on the main boulevard at once.'
      n: '[[w.dikotter-cultural-revolution]], 104–105 n.7. Made public: 2016. To check: Boyd to Wilson, "Invasion of Peking," Sept. 28, 1966, FO 371/186982, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 105 n.7).'
