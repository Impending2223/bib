      n: '[[w.dikotter-cultural-revolution]], 80 n.2. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 80 n.2a); Chen Yinan, *Qingchun wuhen: Yige zaofanpai gongren de shinian wenge* (2006), ch. 2 (cited by [[w.dikotter-cultural-revolution]], 80 n.2b). Names: Mao Zedong. Check: the day.'
