- add:
    entry:
      id: cal.1964-10.china-leadership-14
      when: Oct., by the 10th
      date: '1964-10'
      at: before 1964-10-10
      thread: china-leadership
      place: hunan
      c: 'As Hunan 湖南 reports have it: the work teams find up to 80 percent of the province''s rural cadres corrupt, in league with people of bad class background; in every commune several victims beaten to death. The slogan of the day, by Xie Chengnian''s later account: "class struggle is a struggle to the death."'
      n: '[[w.dikotter-cultural-revolution]], 21 n.22. Made public: 2016. To check: Hunan Provincial Archives, May 6, 1964, 146-1-743, pp. 103–108 (cited by [[w.dikotter-cultural-revolution]], 21 n.22a); Hunan Provincial Archives, Oct. 10, 1964, 146-1-776, p. 163 (cited by [[w.dikotter-cultural-revolution]], 21 n.22b); Xie Chengnian, "Wo qinli de ''siqing'' yundong naxie shi," *Wenshi tiandi*, no. 6 (June 2012), 8–9, the slogan (cited by [[w.dikotter-cultural-revolution]], 21 n.22c). Check: the day; the note gives two reports, of May 6 and Oct. 10, 1964.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 6855d83b
        rows:
        - 'w.dikotter-cultural-revolution 21: all'
        - 'via w.dikotter-cultural-revolution 21 n.22a: all'
        - 'via w.dikotter-cultural-revolution 21 n.22b: all'
        - 'via w.dikotter-cultural-revolution 21 n.22c: all'
- add:
    entry:
      id: cal.1964.china-leadership-39
      when: 1964, summer
      date: '1964'
      at: before 1964-06-21
      thread: china-leadership
      c: 'Liu Shaoqi 刘少奇, touring the provinces in charge of the socialist education, tells their leaders that the fight against revisionism abroad is to be tied to its suppression at home; Mao may have been too cautious: "It may well be more than a third."'
      n: '[[w.dikotter-cultural-revolution]], 23 n.28. Made public: 2005 (Guo Dehong and Lin Xiaobo, *Siqing yundong shilu*, the earliest printing the note names). To check: Guo Dehong and Lin Xiaobo, *Siqing yundong shilu* (2005), 130–132 (cited by [[w.dikotter-cultural-revolution]], 23 n.28a); Gao Hua, "Zai Guizhou ''siqing yundong'' de beihou," *Ershiyi shiji*, no. 93 (Feb. 2006), 83 (cited by [[w.dikotter-cultural-revolution]], 23 n.28b). See [[cal.1964-06-08.china-leadership]]. Names: Liu Shaoqi, Mao Zedong. Check: the day.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
      - name:mao-zedong
      src:
