      c: 'As the Shanghai 上海 Office for Finance and Trade reports it: shops renamed Red Flag, Red Guard, The East is Red, Workers, Peasants and Soldiers; more than a hundred called Red Guard; of 230 pharmacies 200 share a name; their windows all alike, Mao''s portrait in the middle.'
      n: '[[w.dikotter-cultural-revolution]], 96 n.8. Made public: 2016. To check: Report from the Office for Finance and Trade, Shanghai Municipal Archives, Sept. 21, 1966, B6-1-130, pp. 195–196 (cited by [[w.dikotter-cultural-revolution]], 96 n.8a); Goodwin to Wilson, Sept. 19, 1966, FO 371/186982, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 96 n.8b).'
