      id: cal.1967-01-04.china-leadership-14
      when: Jan. 4
      date: '1967-01-04'
      thread: china-leadership
      place: shanghai
      c: 'As the Shanghai 上海 People''s Congress reports it: the city needs 3,500 tonnes of grain a day, and by New Year''s Eve its provisions do not cover a week; coal for no more than five days; around the city only women and the old left to till some fields.'
      n: '[[w.dikotter-cultural-revolution]], 126–127 n.27. Made public: 2016. To check: Shanghai Municipal Archives, Jan. 1966 [sic], B250-1-1, pp. 33–38 (cited by [[w.dikotter-cultural-revolution]], 127 n.27a); Report by the People''s Congress, Jan. 4, 1967, Shanghai Municipal Archives, B248-2-4, pp. 1–3 (cited by [[w.dikotter-cultural-revolution]], 127 n.27b).'
