- add:
    entry:
      id: cal.1966-11-09.china-leadership-8
      when: Nov. 9
      date: '1966-11-09'
      thread: china-leadership
      place: shanghai
      c: 'As reports of the Shanghai 上海 People''s Congress have it: visitors squat on sitting toilets; cleaners who refuse to go on for the stench are told that "what stinks is not so much the excrement as your own ideology."'
      n: '[[w.dikotter-cultural-revolution]], 107 n.13. Made public: 2016. To check: Reports from the People''s Congress, Nov. 1 and 9, 1966, Shanghai Municipal Archives, B172-5-1085, pp. 15, 20 (cited by [[w.dikotter-cultural-revolution]], 107 n.13).'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
