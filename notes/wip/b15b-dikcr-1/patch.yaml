- cite:
    id: cal.1962-01-29.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 12 n.14 (Lin Biao hails the Great Leap as unprecedented: the Chairman''s thoughts always correct; whenever his ideas were not respected or suffered interference, there were problems)'
- src:
    id: cal.1962-01-29.china-leadership
    rows:
    - 'via w.dikotter-cultural-revolution 12 n.14: ?'
- cite:
    id: cal.1962-01-11.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 13 n.16 (in the small groups a few provincial leaders hold the whole famine man-made; others compare their provinces'' dead; one: "Chairman Mao should assume responsibility"; one points out that the communes were the Chairman''s idea)'
