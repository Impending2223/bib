      thread: china-leadership
      place: shaanxi
      c: 'As the Shaanxi 陕西 propaganda office reports it: plays inspired by the West performed in the cities, feudal opera reviving in the countryside; tutors in private schools of the Wei River valley return to the Confucian classics; in Xi''an 西安 counter-revolutionary publications, some following Hu Feng, some praising Chiang Kai-shek, openly on sale at bookstalls; units order reading from abroad, the Xi''an Foreign Language Institute subscribing to scores of foreign papers; at Hanzhong University the first English lesson is "The United States'' Today is Our Tomorrow."'
      n: '[[w.dikotter-cultural-revolution]], 30–31 n.9. Made public: 2016. To check: Report from the Shaanxi Office for Propaganda, June 16, 1963, Shandong Provincial Archives, A1-2-1153, pp. 74–88 (cited by [[w.dikotter-cultural-revolution]], 31 n.9b).'
