      c: 'As a Shanghai 上海 report has it: Red Guards order the racing pigeons (some 30,000 kept by the association''s members, 20,000 more unlicensed) destroyed within two days and smash racks and lofts; the authorities arrest hundreds of breeders.'
      n: '[[w.dikotter-cultural-revolution]], 86–87 n.22. Made public: 2016. To check: Shanghai Municipal Archives, Nov. 30, 1966, B326-5-531, pp. 24–26 (cited by [[w.dikotter-cultural-revolution]], 87 n.22a); Shanghai Municipal Archives, Mar. 26, 1968, B248-2-41, pp. 12–13 (cited by [[w.dikotter-cultural-revolution]], 87 n.22b); Shanghai Municipal Archives, June 21 and 26, 1968, B248-2-54, pp. 1–22 (cited by [[w.dikotter-cultural-revolution]], 87 n.22c). Check: the day.'
