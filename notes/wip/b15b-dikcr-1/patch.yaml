      date: '1966-12'
      at: before 1966-12-24
      thread: china-leadership
      place: shanghai
      c: 'As Shanghai 上海 reports have it: except for a few revolutionary martyrs'' graves, all the tombstones of the city''s sixty-nine cemeteries (400,000 graves, 20,000 of them foreigners'') overturned or smashed; at the Ji''an Cemetery, where guards protected some graves, the Party orders all pre-liberation tombstones levelled as "symbols of imperialism."'
      n: '[[w.dikotter-cultural-revolution]], 85 n.15. Made public: 2016. To check: Shanghai Municipal Archives, Dec. 24, 1966, B257-1-4714, pp. 46–49 (cited by [[w.dikotter-cultural-revolution]], 85 n.15a); Shanghai Municipal Archives, Oct. 20, 1966, B168-2-89, pp. 27–32 (cited by [[w.dikotter-cultural-revolution]], 85 n.15b). Check: the day; the note gives two reports, of Oct. 20 and Dec. 24.'
