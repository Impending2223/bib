        - 'via w.dikotter-cultural-revolution 112 n.28b: all'
- add:
    entry:
      id: cal.1967-02.china-leadership-45
      when: Feb.
      date: '1967-02'
      thread: china-leadership
      c: Meningitis, spread by the travelling Red Guards since August 1966, now epidemic along the railways; antibiotics so short that the government buys several hundred tonnes of medicine from firms in Western Europe and Asia; control centres set up.
      n: '[[w.dikotter-cultural-revolution]], 114 n.31. Made public: 2014 (Fan Ka Wai). To check: Fan Ka Wai, "Epidemic Cerebrospinal Meningitis during the Cultural Revolution," *Extrême-Orient, Extrême-Occident* 37 (Sept. 2014), 197–232 (cited by [[w.dikotter-cultural-revolution]], 114 n.31). Check: the day.'
      tags:
