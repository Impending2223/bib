      n: '[[w.dikotter-cultural-revolution]], 80 n.1. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 80 n.1). Check: the day.'
