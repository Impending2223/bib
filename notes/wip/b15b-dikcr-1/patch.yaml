      n: '[[w.dikotter-cultural-revolution]], 58–59 n.16, n.17 (the text has him travelling along the Yangtze; the report''s title, the Yellow River valley). Made public: 2016. To check: Alan E. Donald, "A Journey in the Yellow River Valley," June 21, 1966, FO 371/186986, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 58 n.16, 59 n.17).'
