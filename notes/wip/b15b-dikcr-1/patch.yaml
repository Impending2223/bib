        - 'via w.dikotter-cultural-revolution 113 n.29a: all'
        - 'via w.dikotter-cultural-revolution 113 n.29b: all'
- add:
    entry:
      id: cal.1967-01-06.china-leadership-17
      when: Jan. 6
      date: '1967-01-06'
      thread: china-leadership
      place: jiangxi
      c: 'As the Jiangxi 江西 provincial committee reports it: by December more than 60,000 Red Guards a day reach Jinggangshan 井岡山, a month later thirty times more visitors than locals; the army drops food and medicine by helicopter and sends a hundred lorries to evacuate the area.'
      n: '[[w.dikotter-cultural-revolution]], 112 n.28. Made public: 2016. To check: Report from the Jiangxi Provincial Party Committee, Jan. 6, 1967, Shanghai Municipal Archives, B243-2-754, p. 2 (cited by [[w.dikotter-cultural-revolution]], 112 n.28a); [[w.heng-son-of-the-revolution]], 109–110 (cited by [[w.dikotter-cultural-revolution]], 112 n.28b).'
      tags:
