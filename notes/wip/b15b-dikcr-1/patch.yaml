      c: 'Peking 北京, the middle school attached to Tsinghua University 清华大学: three days after Mao''s letter, the students make the principal and vice-principal wear labels as "Heads of a Black Gang"; over the following days Red Guards take turns beating them with clubs, whips and copper-buckled belts; the vice-principal''s hair is burned.'
      n: '[[w.dikotter-cultural-revolution]], 73 n.18. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 73 n.18). See [[cal.1966-07-31.china-leadership]]. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      src:
        c: 36c2b9d9
        rows:
        - 'w.dikotter-cultural-revolution 73: all'
- add:
    entry:
      id: cal.1966-08.china-4
      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: peking
      c: 'Peking 北京, the middle school attached to the Peking Teachers'' College: a biology teacher is knocked down, beaten and dragged by her legs down the steps; she dies after hours of torment, and the other teachers are made to take turns beating her body.'
      n: '[[w.dikotter-cultural-revolution]], 75 n.22. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 75 n.22). Check: the day.'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-08.china-6
      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: peking
      c: Tian Han 田汉, the dramatist, is dragged again and again on to an improvised stage with a heavy placard round his neck, made to kneel and beaten, the crowd cheering "Down with Tian Han!"
      n: '[[w.dikotter-cultural-revolution]], 76 n.24. To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 76 n.24). See [[cal.1964-01.china-leadership-7]]. Check: the day and the place.'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1966-08.china-7
      when: Aug., after the 18th
      date: '1966-08'
      at: after 1966-08-18
      thread: china
      place: peking
      c: 'Peking 北京: Red Guards, on the street committee''s denunciation, track down the family of Nan Baoshan, one of the "hooligans" paraded at the Workers'' Stadium 工人体育场; the old man is clubbed to death in the street; his second son, beaten and locked in at home, dies of thirst days later.'
      n: '[[w.dikotter-cultural-revolution]], 76–77 n.26. To check: Wang Youqin, "Da ''xiao liumang'' he Nan Baoshan fuzi zhi si," Chinese Holocaust Memorial (cited by [[w.dikotter-cultural-revolution]], 77 n.26). See [[cal.1966-08-13.china-leadership-5]]. Check: the day.'
      tags:
      - polity:prc
      src:
        c: f25055c3
        rows:
        - 'w.dikotter-cultural-revolution 76–77: all'
        - 'via w.dikotter-cultural-revolution 77 n.26: all'
- add:
    entry:
      id: cal.1966-08-31.china
      when: Aug. 31
      date: '1966-08-31'
      thread: china
      place: peking
      c: 'As John Boyd of the British mission reports it: an old man shuffles out of a covered market the Red Guards have made a prison, a denunciation hanging to his knees, his face blackened, blood on his shirt; "a close second to this spectacle was the sight of two old ladies being stoned by small children."'
      n: '[[w.dikotter-cultural-revolution]], 77 n.27. Made public: 2016. To check: John D. I. Boyd to David Wilson, letter, Aug. 31, 1966, FO 371/186982, The National Archives, London (cited by [[w.dikotter-cultural-revolution]], 77 n.27).'
      tags:
      - polity:prc
      - vis:only:uk
      - polity:uk
      - form:state
      src:
        c: a0d6f557
        rows:
        - 'w.dikotter-cultural-revolution 77: all'
        - 'via w.dikotter-cultural-revolution 77 n.27: all'
- add:
    entry:
      id: cal.1966-08-29.china-leadership-14
      when: Aug. 29
      date: '1966-08-29'
      thread: china-leadership
      also:
      - china
      place: peking
      c: 'As an internal Party document reports it: Red Guards in Peking 北京 kill 126 people on Aug. 26, 228 on the 27th, 184 on the 28th, 200 on the 29th.'
      n: '[[w.dikotter-cultural-revolution]], 78–79 n.33. Made public: 2001 (Wang Youqin in *Issues and Studies*, the printing the note names). To check: Wang Youqin, "Student Attacks against Teachers: The Revolution of 1966," *Issues and Studies* 37, no. 2 (Mar. 2001), 29–79 (cited by [[w.dikotter-cultural-revolution]], 79 n.33). Check: the document''s date.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      gloss:
        title: Estimates
        text:
        - 'Dikötter: in late August more than a hundred killed in Peking every day; by a conservative estimate at least 1,770 dead by late September, as the first wave abated, not counting those massacred in the outskirts ([[w.dikotter-cultural-revolution]], 78–79).'
- cite:
    id: cal.1966-08-17.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 74 n.20 (more than ten teachers made to crawl on a path of coal cinders until their knees and palms are burned; the book: "in the following days," after Aug. 13)'
- cite:
    id: cal.1966-08-19.china-leadership-11
    item: '[[w.dikotter-cultural-revolution]], 75 n.22 (the principal beaten to death; the dean hangs herself; after the rally of Aug. 18)'
- cite:
    id: cal.1966-08-25.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 75 n.22 (at a middle school near Peking Normal University the principal is made to stand under the hot sun while Red Guards pour boiling water over him)'
- cite:
    id: cal.1966-07-16.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 66 n.1 (an hour downstream, "with ruddy cheeks"; broadcast all over the country; parades; 8,000 swim at the Summer Palace)'
- cite:
    id: cal.1966-07-24.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 67 n.6 (Mao, in white pyjamas, on the ground floor of his Diaoyutai residence, scolds the leaders for fearing the masses and suppressing the students, and demands the work teams be dismissed)'
- cite:
    id: cal.1966-07.china-leadership-8
    item: '[[w.dikotter-cultural-revolution]], 67 n.5 (sent by Chen Boda to Kuai Dafu, still detained at Tsinghua, "on 21 July": a snub to Wang Guangmei)'
- cite:
    id: cal.1966-07-22.china-leadership-9
    item: '[[w.dikotter-cultural-revolution]], 67 n.5 (Jiang Qing and Chen Boda at Peking University, "on the orders of the Chairman" to learn from the students; they overturn the work team''s verdict on the students condemned a month earlier; the book: "two days later," July 23)'
- cite:
    id: cal.1966-07-29.china-leadership-2
    item: '[[w.dikotter-cultural-revolution]], 68 n.8 (more than 10,000 students; Kuai Dafu brought by car, feted; Liu and Deng''s self-criticisms; Mao behind the curtain: "Old counter-revolutionaries is more like it"; he steps on stage, "Long Live Chairman Mao!"; Zhou trails behind)'
- cite:
    id: cal.1966-08-01.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 68–69 n.9 (Mao accuses Liu of "running a dictatorship"; Lin Biao called back Aug. 6: the movement to "turn the world upside down"; on the last day the new Standing Committee of eleven by secret ballot, Lin number two)'
- cite:
    id: cal.1966-08-08.india-and-china
    item: '[[w.dikotter-cultural-revolution]], 69–70 n.10 (the Decision, the "Sixteen Articles," read out on the radio Aug. 8: the main target "those in power within the party taking the capitalist road"; no measures against students)'
- cite:
    id: cal.1966-08-05.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 70 n.11 ("Bombard the Headquarters": the "reactionary stand of the bourgeoisie," a reign of "white terror"; not published for a year, leaked almost at once)'
- cite:
    id: cal.1966-06-12.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 70 n.14 (in August, at the No. 17 mill, many workers side with the leadership and the work team stays)'
- cite:
    id: cal.1966-07-31.china-leadership
    item: '[[w.dikotter-cultural-revolution]], 71 n.15 ("on 1 August," a personal note of support: "To Rebel is Justified!")'
- cite:
    id: cal.1966-08-05.china-leadership-10
    item: '[[w.dikotter-cultural-revolution]], 73 n.18 (the afternoon of Aug. 5: five administrators accused as a "Black Gang," splashed with ink, made to kneel, beaten with nail-spiked clubs; Bian unconscious, dumped in a garbage cart, dead at the hospital two hours later)'
- cite:
    id: cal.1966-08-13.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 74 n.20 (five citizens who had threatened Red Guards paraded as "hooligans," beaten and whipped; Zhou Enlai and Wang Renzhong, presiding, make no move to stop it)'
- cite:
    id: cal.1966-08-18.china-leadership-5
    item: '[[w.dikotter-cultural-revolution]], 75 n.21 (Song Binbin pins the armband on Mao''s sleeve; Mao: "be martial," Yaowu)'
- cite:
    id: cal.1966-08-18.india-and-china-cultural-revolution
    item: '[[w.dikotter-cultural-revolution]], 74 (over a million students on the square before daybreak; Mao in a baggy army uniform mingles with the crowd; Lin Biao: destroy the "four olds")'
- cite:
    id: cal.1966-08-23.china-leadership-8
    item: '[[w.dikotter-cultural-revolution]], 76 n.25 (Lao She and twenty others taken by lorry to the Temple of Confucius, beaten through a corridor of schoolgirls of the Eighth Middle School, placards hung on them, for hours)'
- cite:
    id: cal.1966-08-24.china-leadership-7
    item: '[[w.dikotter-cultural-revolution]], 76 n.25 (his body found in the shallow end of a lake near his childhood home, Mao''s poems in his pocket; the circumstances in doubt)'
- cite:
    id: cal.1966-08-18.china-leadership-9
    item: '[[w.dikotter-cultural-revolution]], 78 n.29 (an estimated 77,000, just under 2 percent of the population, sent to the countryside)'
- cite:
    id: cal.1966-08-26.china-leadership-14
    item: '[[w.dikotter-cultural-revolution]], 78 n.30, n.31 (the local cadres order all landlords and bad elements and their offspring killed, on a rumour of revenge; a night of butchery across several communes, more than 300 killed; a PLA officer telephones Peking, a report goes at once to the Cultural Revolution Group; nobody lifts a finger)'
- cite:
    id: cal.1966-08-26.china-leadership-9
    item: '[[w.dikotter-cultural-revolution]], 78 n.32 (Xie Fuzhi to the police: "We must support the Red Guards ... If in anger they beat someone to death, then so be it"; widely circulated; the book: a week before Daxing)'
- cite:
    id: cal.1966-08-20.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 81, 87 (81: from the evening of Aug. 20 bands of Red Guards rove the streets of Peking, renaming streets and attacking tailors and barbers; by the morning of Aug. 22 they cut people''s hair in the streets, slash narrow trousers and chop off high heels; 87: the house searches, the targets'' names, ages and addresses passed to the Red Guards by the police or the street committees; the book: they "started on 23 August and peaked in the following days")'
- cite:
    id: cal.1966-11-28.china-leadership-4
    item: '[[w.dikotter-cultural-revolution]], 84–85 n.14 (the Qufu authorities had repelled the local Red Guards; more than 200 Red Guards from Peking desecrate the tombs; five well-preserved female corpses tied together and hung from a tree)'
- cite:
    id: cal.1966-11.china-leadership-3
    item: '[[w.dikotter-cultural-revolution]], 85 n.14 (Chen Boda wires his instructions: the graves may be dug up, the main edifice kept as a "museum of class education")'
- add:
