- add:
    entry:
      id: cal.1963-04-02.china-4
      when: Apr. 2
      date: '1963-04-02'
      thread: china
      c: 'As *Neibu cankao* reports it: over 2,000 merchants in Xi''an 西安 trade on their own, some lending at higher interest than the state; Shenyang 沈阳 has 20,000 private entrepreneurs; in Wuhan 武汉 3,000 profiteers buy rationed goods at state prices with cadres'' help and sell them on the black market; some Guangdong 广东 communes send agents round the country by plane; underground factories, construction teams and transport corps.'
      n: '[[w.dikotter-cultural-revolution]], 19 n.16. Made public: 2016. To check: *Neibu cankao*, Apr. 2, 1963, 2–3 (cited by [[w.dikotter-cultural-revolution]], 19 n.16).'
