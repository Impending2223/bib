      when: Nov. 1
      date: '1966-11-01'
      thread: china
      place: fuzhou
      c: 'Fuzhou 福州: the rebels seize the provincial Party headquarters; Ken Ling and his friends storm Ye Fei 叶飞''s residence as he is served breakfast; he is paraded through the streets in the following days and appeals to Han Xianchu 韩先楚, the army commander, who refuses to step in.'
      n: '[[w.dikotter-cultural-revolution]], 117–118 n.7. To check: Shui Luzhou, *Wenge jianlun*, web version, ch. 46 (cited by [[w.dikotter-cultural-revolution]], 118 n.7a); Ken Ling, *The Revenge of Heaven* (1972), 135 (cited by [[w.dikotter-cultural-revolution]], 118 n.7b); Wang Shengze, "''Wenge'' fengbao zhong de Ye Fei shangjiang," *Dangshi bolan*, no. 12 (Dec. 2008), 41–46 (cited by [[w.dikotter-cultural-revolution]], 118 n.7c).'
      tags:
