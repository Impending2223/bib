- add:
    entry:
      id: cal.1966-09.china-3
      when: Sept.
      date: '1966-09'
      thread: china
      c: 'Wang Rongfen, nineteen, a student of German at the Foreign Languages Institute, writes to Mao: "the Cultural Revolution is not a mass movement. It is one man with a gun manipulating the people." She is arrested and imprisoned for thirteen years.'
      n: '[[w.dikotter-cultural-revolution]], 109 n.19. Made public: 2006 (the *New York Times*). To check: Howard W. French, "Hearts Still Scarred 40 Years after China''s Upheaval," *New York Times*, June 10, 2006 (cited by [[w.dikotter-cultural-revolution]], 109 n.19a); Yu Xiguang, *Weibei weigan wang youguo* (cited by [[w.dikotter-cultural-revolution]], 109 n.19b). Names: Mao Zedong. Check: the day ("a month later" than Aug. 18).'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      src:
        c: d87aff1d
        rows:
        - 'w.dikotter-cultural-revolution 109: all'
        - 'via w.dikotter-cultural-revolution 109 n.19a: all'
        - 'via w.dikotter-cultural-revolution 109 n.19b: all'
- add:
    entry:
      id: cal.1966-11-26.china
      when: Nov. 26
      date: '1966-11-26'
      thread: china
      place: peking
      c: 'The last rally, at an airfield outside Peking 北京, ends in a stampede: 2 million rush for the only exit, flatten wheat fields and mud huts; a wooden bridge collapses; many lose their shoes in the cold; army lorries carry clothes, and some carry mutilated bodies.'
      n: '[[w.dikotter-cultural-revolution]], 110 n.23. To check: Ken Ling, *The Revenge of Heaven* (1972), 179–180 (cited by [[w.dikotter-cultural-revolution]], 110 n.23). See [[cal.1966-11-25.china-leadership-2]].'
      tags:
      - polity:prc
      src:
        c: 4499863c
        rows:
        - 'w.dikotter-cultural-revolution 110: all'
        - 'via w.dikotter-cultural-revolution 110 n.23: all'
- add:
    entry:
      id: cal.1966-10-22.china-leadership-7
      when: Oct. 22
      date: '1966-10-22'
      thread: china-leadership
      place: peking
      c: The Cultural Revolution Group 中央文革小组 encourages Red Guards to travel on foot in Long March teams, to relieve the railways.
      n: '[[w.dikotter-cultural-revolution]], 112–113 n.29. To check: [[w.heng-son-of-the-revolution]], 104 (cited by [[w.dikotter-cultural-revolution]], 113 n.29a); Wong Siu Kuan, "Why the Cultural Revolution?," *Eastern Horizon* 6, no. 2 (Feb. 1967), 15 (cited by [[w.dikotter-cultural-revolution]], 113 n.29b).'
      tags:
