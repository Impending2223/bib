- add:
    entry:
      id: cal.1964.china-leadership-41
      when: 1964, Sept.–Nov.
      date: '1964'
      at: before 1964-09
      thread: china-leadership
      place: guizhou
      c: 'Guizhou 贵州: the work team denounces the whole provincial leadership as "rightist," Guiyang 贵阳 a "nest of counter-revolutionaries," a "small Taiwan"; it searches homes, sets people to denounce each other and holds public trials; Zhou Lin 周林 is purged. In the two months after the team''s head takes over the province, in September, up to a quarter of the Party members of some counties vanish from view, some warned, some arrested or sent to the camps.'
      n: '[[w.dikotter-cultural-revolution]], 24 n.30. Made public: 2006 (Gao Hua in *Ershiyi shiji*, the earliest printing the note names). To check: Gao Hua, "Zai Guizhou ''siqing yundong'' de beihou," *Ershiyi shiji*, no. 93 (Feb. 2006), 75–89 (cited by [[w.dikotter-cultural-revolution]], 24 n.30a); Yan Lebin, *Wo suo jingli de nage shidai* (2012), 90–91 (cited by [[w.dikotter-cultural-revolution]], 24 n.30b). See [[cal.1964-10.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Luo Bing: over 5 million Party members punished in the socialist education campaign Liu Shaoqi conducted, more than 77,000 hounded to their deaths, most of them innocent ([[w.dikotter-cultural-revolution]], 24 n.31).'
      src:
        c: afaba240
        rows:
        - 'w.dikotter-cultural-revolution 24: all'
        - 'via w.dikotter-cultural-revolution 24 n.30a: all'
        - 'via w.dikotter-cultural-revolution 24 n.30b: all'
