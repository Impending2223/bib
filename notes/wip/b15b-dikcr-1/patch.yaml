    item: '[[w.dikotter-cultural-revolution]], 11–12 n.13 (Liu, before a packed audience: the farmers of Hunan hold the disaster 70 percent man-made, 30 percent natural; "man-made disaster" (renhuo); successes to setbacks seven to three, not nine fingers to one; Mao interrupts: not a small number of regions at all, in Hebei only 20 percent of regions fell in output, in Jiangsu 30 percent rose year after year)'
