      when: June 15
      date: '1964-06-15'
      thread: china-leadership
      place: daoxian
      c: 'As a Hunan 湖南 report has it: in Daoxian 道縣 county one cadre in ten has gone the capitalist way; "many people have no understanding of the meaning of class or class struggle"; clan and lineage hold sway.'
      n: '[[w.dikotter-cultural-revolution]], 21–22 n.23. Made public: 2016. To check: Hunan Provincial Archives, June 15, 1964, 146-1-751, pp. 56–62, 75–82 (cited by [[w.dikotter-cultural-revolution]], 22 n.23).'
