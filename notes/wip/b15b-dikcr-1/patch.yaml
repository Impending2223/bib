      when: Nov. 1
      date: '1966-11-01'
      thread: china-leadership
      also:
      - china
      place: peking
      c: 'The *Hongqi* editorial "Victory for the Proletarian Revolutionary Line Represented by Chairman Mao": leading Party members treat the masses as ignorant and incapable, turn the spearhead on them, brand them "anti-party elements" and "rightists"; the work teams'' dossiers to be destroyed and their verdicts overturned.'
      n: '[[w.dikotter-cultural-revolution]], 118, 122 n.8, n.17. To check: "Yi Mao zhuxi daibiao de wuchanjieji geming luxian de shengli," *Hongqi*, no. 14, Nov. 1, 1966, 1–3 (cited by [[w.dikotter-cultural-revolution]], 118 n.8); the same (cited by [[w.dikotter-cultural-revolution]], 122 n.17a).'
      tags:
      - polity:prc
      src:
        c: 28ccb20a
        rows:
        - 'w.dikotter-cultural-revolution 118, 122: all'
        - 'via w.dikotter-cultural-revolution 118 n.8: all'
        - 'via w.dikotter-cultural-revolution 122 n.17a: all'
- add:
    entry:
      id: cal.1966-07.china-leadership-26
      when: July, by the 17th
      date: '1966-07'
      at: before 1966-07-17
      thread: china-leadership
      place: shanghai
      c: 'As Shanghai 上海 reports have it: at the Guangming Watch Factory the Party secretary finds posters in every corridor accusing him of corruption and nepotism; elsewhere leaders called "despotic emperors"; workers form Combat Teams, link up with other factories, raid offices for evidence against their leaders.'
      n: '[[w.dikotter-cultural-revolution]], 121 n.15. Made public: 2016. To check: Shanghai Municipal Archives, July 2, 14 and 17, 1966, A36-2-757, pp. 7–9, 13–14, 33 (cited by [[w.dikotter-cultural-revolution]], 121 n.15a); [[w.perry-proletarian-power]], 31 (cited by [[w.dikotter-cultural-revolution]], 121 n.15b). Check: the day.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 1f492f01
        rows:
        - 'w.dikotter-cultural-revolution 121: all'
        - 'via w.dikotter-cultural-revolution 121 n.15a: all'
- add:
    entry:
      id: cal.1966-08.china-leadership-59
      when: Aug.
      date: '1966-08'
      thread: china-leadership
      place: shanghai
      c: 'As a Shanghai 上海 report has it: on a single day more than 400 factory cadres are paraded through the streets in dunces'' caps; over a million workers take part in the Cultural Revolution over the summer.'
      n: '[[w.dikotter-cultural-revolution]], 121 n.16. Made public: 2016. To check: Shanghai Municipal Archives, Aug. 1966, A36-2-757, pp. 103–112 (cited by [[w.dikotter-cultural-revolution]], 121 n.16). Check: the day.'
