        - 'via w.dikotter-cultural-revolution 121 n.16: all'
- add:
    entry:
      id: cal.1966-11.china-2
      when: Nov., after the 1st
      date: '1966-11'
      at: after 1966-11-01
      thread: china
      place: shanghai
      c: 'Shanghai 上海: some 40,000 workers sent to the countryside return to show their discontent; some occupy Shanghai Mansions 上海大厦, kept for the leaders since 1949; others hunger-strike before the Labour Bureau; many join the siege of the city Party committee.'
      n: '[[w.dikotter-cultural-revolution]], 122–123 n.19. To check: Shanghai Municipal Archives, Aug. 7, 1975, B127-4-77, pp. 1–5 (cited by [[w.dikotter-cultural-revolution]], 123 n.19). Check: the day.'
      tags:
      - polity:prc
      src:
        c: 3b40f90b
        rows:
        - 'w.dikotter-cultural-revolution 122–123: all'
        - 'via w.dikotter-cultural-revolution 123 n.19: all'
- add:
    entry:
      id: cal.1966-12.china-leadership-27
      when: Dec.
      date: '1966-12'
      thread: china-leadership
      place: nanjing
      c: 'As a Nanjing 南京 report has it: scuffles across all industry; officials telephone and petition the higher authorities about plots and losses, rebel workers send delegations against their leaders; from the Nanjing Machine Tool and Electrical Apparatus Factory alone a third of its 185 workers had gone to Peking 北京 by the end of October.'
      n: '[[w.dikotter-cultural-revolution]], 123 n.21. Made public: 2016. To check: Report from the Nanjing Municipal Revolutionary Committee, Dec. 1966, Nanjing Municipal Archives, 5020-2-8, pp. 111–122 (cited by [[w.dikotter-cultural-revolution]], 123 n.21). Check: the day.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 6d67d505
        rows:
        - 'w.dikotter-cultural-revolution 123: all'
        - 'via w.dikotter-cultural-revolution 123 n.21: all'
- add:
    entry:
      id: cal.1967-01.china-3
      when: Jan., early
      date: '1967-01'
      at: before 1967-01-01
      thread: china
      place: shanghai
      c: 'Shanghai 上海: factory administrations buy off the rebels with bonuses, wage rises and travel vouchers; some 38 million yuan, nearly twice the usual, withdrawn from the banks in the first week of January; a run on the banks, a spree, then panic buying of briquettes and cooking oil.'
      n: '[[w.dikotter-cultural-revolution]], 126 n.26. To check: Jiang Hongsheng, "The Paris Commune in Shanghai" (2010), 281 (cited by [[w.dikotter-cultural-revolution]], 126 n.26a); Yiching Wu, *The Cultural Revolution at the Margins* (2014), 110 (cited by [[w.dikotter-cultural-revolution]], 126 n.26b).'
      tags:
