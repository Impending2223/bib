      when: Apr., by the 9th
      date: '1963-04'
      at: before 1963-04-09
      thread: china-leadership
      c: 'As *Neibu cankao* reports it: in the Xingtai region of Hebei 河北, many thousands of committees of poor and middle peasants, set up for the socialist education, are turned on "capitalists" and "go-it-aloners"; they demand back every holding larger than the private plots allowed since 1960.'
      n: '[[w.dikotter-cultural-revolution]], 18–19 n.15. Made public: 2016. To check: *Neibu cankao*, Mar. 1, 1963, 7–9; Apr. 5, 1963, 6–9; Apr. 9, 1963, 2–5 (cited by [[w.dikotter-cultural-revolution]], 19 n.15a–c). Check: the day; the note gives three reports for the paragraph.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
