  - add:
      entry:
        id: cal.1963-09-10.china-leadership-9
        when: Sept. 10
        date: '1963-09-10'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the Northwest group 西北组 of the Central Work Conference 中共中央工作会议: more output not to forget thrift, or the gain is wasted; Xinjiang 新疆 has much to export; with floods or drought in several provinces and grain still tight, more exports to earn foreign exchange and buy grain, the localities'' share of the exchange raised; in the border lands and hills, handicrafts to grow, the craftsmen sent up to the hills and down to the villages, small works set up; a great country of over six hundred million cannot do without handicrafts.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1882. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1963-09-18.china-leadership-5
        when: Sept. 18
        date: '1963-09-18'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the East China group 华东组 of the Central Work Conference 中共中央工作会议, on the line for industry: he backs "unified and centralized, rationally laid out" 统一集中，合理布局, but the country is so big that unifying everything will cause trouble and the state cannot carry it; unify what should be unified, not the rest; what the masses can do for themselves, scattered, not all taken on by the state; China''s handicrafts well developed, the makers of many exports and a chief source of funds, using local stuff, helping the teams'' many lines and farming, and giving work: handicrafts a question of their own in the document.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1882–1883. Made public: 2016. Names: Zhu De.'
