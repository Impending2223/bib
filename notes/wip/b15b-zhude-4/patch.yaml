  - add:
      entry:
        id: cal.1963-05-13.china-leadership-6
        when: May 13
        date: '1963-05-13'
        thread: china-leadership
        c: 'Zhu De 朱德 to Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, by letter, on his inspection of Sichuan 四川, Shaanxi 陕西, Henan 河南 and other provinces: in Sichuan, water first, lifting water to the hill terraces by power and machine pumps, the root of sure and higher harvests; the spring crops to be early ripening (broad beans, peas, barley, rape), less wheat, so the rice is planted in time; cash crops and the collectives and the members household sidelines far below their old level, and the village crafts, to be restored, the hills many lines (bamboo, wood, palm, silk, tea, tung oil, mountain goods, herbs) above all; they lag because goods go unbought, prices are low and short-haul carrying is blocked; sidelines, short-haul transport and livelier rural fairs 集市贸易 to go together, the cooperatives to buy more; Sichuans wooden-boat transport by the teams and cooperatives to be restored.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1875–1876. Made public: 2016. Names: Zhu De, Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:deng-xiaoping', 'vis:only:prc']
