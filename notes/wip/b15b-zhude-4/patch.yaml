        place: chongqing
        thread: china-leadership
        c: Chongqing 重庆. Zhu De 朱德 visits the Jinyun Mountain 缙云山 and the Northern Hot Springs 北温泉. He talks with the heads of the Beibei district committee 中共重庆市北碚区委.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1871. Made public: 2016. Names: Zhu De.'
