        when: Oct. 15
        date: '1963-10-15'
        thread: china-leadership
        c: 'Zhu De 朱德 to Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, by letter: most coal enterprises still produce at a loss; coal the base of industry''s fuel and raw stuff, to have a fair price; the low price hurts output and above all quality, and poor coal is great waste and raises other industries'' costs; coal to make a profit, not a loss; how to use the law of value in growing output an important question, some people to study it and sum up experience, and in the three years of adjustment a price policy fitter to the facts and to output to be worked out step by step.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1886. Made public: 2016. Names: Zhu De, Zhou Enlai, Deng Xiaoping.'
