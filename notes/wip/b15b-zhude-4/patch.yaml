  - cite: {id: cal.1963-05-18.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1877 (May 18, 1963; Zhu De 朱德 at the Politburo 中共中央政治局会议 on the draft decision on some current questions in rural work 《中共中央关于目前农村工作中若干问题的决定（草案）》 (the "First Ten Points" 前十条), and speaks: the rules for the communes 《农村人民公社工作条例》 not yet passed down in places, in others only read out at a meeting, a gust of wind and gone, to be checked level by level and carried out; the peasants trust the Party, but our laws being unsound we ran things by administrative order, one order cancelling another, so the peasants did not know what to do; "a political movement in the villages must raise output")'}
