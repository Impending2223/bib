        date: '1963-04-02'
        place: luzhou
        thread: china-leadership
        c: 'Luzhou 泸州, Sichuan 四川. Zhu De 朱德 inspects the distillery 曲酒厂 of the Luohanchang commune 罗汉场人民公社, Plant 25 二五厂 (so printed) and the Luzhou medical college 泸州医学专科学校, and writes an inscription for the college: inherit the motherland''s medical legacy, learn modern medical science well, serve the broad people.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1870. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
