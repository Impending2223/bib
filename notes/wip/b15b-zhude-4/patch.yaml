  - add:
      entry:
        id: cal.1963-10-29.china-leadership-5
        when: Oct. 29
        date: '1963-10-29'
        thread: china-leadership
        c: 'Zhu De 朱德 to Mao Zedong 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and others, by letter, on fighting the floods and relief in Hebei 河北, Henan 河南, Jiangsu 江苏, Anhui 安徽 and Shandong 山东: after two months and more the victims are settling; their chief needs grain rations and medicines, quinine above all; dried vegetables to be sent from the neighboring provinces, medicines by the Ministry of Health 卫生部; the supply and marketing cooperatives 供销社 to supply the stricken areas sidelines and buy their goods, link them with other places and lend to communes and teams short of funds. On water and farming: the floods and droughts of the North China plain 华北平原 to be cured at the root, making it a base of grain and cash crops, water stored in the hills upstream and led off in the middle and lower reaches; ground water for irrigation, the plain''s rain scant but falling in storms; farming and many lines by local conditions, plans fitted to nature''s changes, the masses'' planting ways not lightly changed.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1889–1890. Made public: 2016. Names: Zhu De, Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:deng-xiaoping', 'vis:only:prc']
  - add:
      entry:
        id: cal.1963-10-30.china-leadership-5
        when: Oct. 30
        date: '1963-10-30'
        thread: china-leadership
        c: 'Zhu De 朱德 speaks to the meeting of cadres of bureau rank and above of the Third Department of the PLA General Staff 解放军总参谋部三部: stay long and content in the work, study hard, be unknown heroes; raise the skill, learn science and foreign languages, sum up experience, master the technique to its finest; train cadres, so the many newcomers learn it soon.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1890. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
