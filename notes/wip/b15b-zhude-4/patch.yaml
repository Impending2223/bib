  - add:
      entry:
        id: cal.1963-04-12.china-leadership-8
        when: Apr. 12
        date: '1963-04-12'
        place: chongqing
        thread: china-leadership
        c: 'Chongqing 重庆. Zhu De 朱德 hears his secretaries on what the Chongqing city committee 重庆市委 told them of industry and foreign trade, and says: Sichuan 四川 to solve its water problem, more pressing there than in East or North China; railways to be built, the Chengdu–Kunming 成昆线 and Neijiang–Kunming 内昆线 lines, without fear of too little freight; Chongqing a gathering point of exports, chiefly animal and farm products, oil-pressing, feathers, sweets and pastries, and 水菜 (so printed) a staple; steel not to be made there, but rolling, with steel brought in; Sichuans handicrafts, using local stuff, to serve farming long; the supply and marketing cooperatives 供销社, well run, the direction.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1872. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1963-04-13.china-leadership-12
        when: Apr. 13
        date: '1963-04-13'
        place: chongqing
        thread: china-leadership
        c: 'Chongqing 重庆. Zhu De 朱德 hears Ren Baige 任白戈, a secretary of the Sichuan committees Secretariat 中共四川省委书记处 and first secretary of the Chongqing city committee 重庆市委, and others on their work. Told that the great exports of Yunnan 云南, Guizhou 贵州 and Sichuan 四川 (bristles, casings, hides, feathers, tung oil, medicinal herbs, silk, tea) were once processed and packed at Chongqing, he says: the old technicians and craftsmen to be gathered, the old trades restored, training classes held; pork not by lowering purchase prices, the whole pig used, fair prices to the peasants; vegetables good quality at good prices, no subsidy; shrub forest planted on the hills to hold water. His four points: farmings recovery can be quicker, by solving water, not by machines, more power-driven irrigation; more cash crops, for the peasants to grow rich; the supply and marketing cooperatives to be restored, private traders not simply banned, private carriers still needed in remote hills; Chongqing, a gathering point of exports in history, to become one again, more exports each year, of good quality and well packed, to earn foreign exchange.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1872–1873. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
