        thread: china-leadership
        c: 'Zhu De 朱德, passing the old battlefield of Naxi 纳溪 in the National Protection War 护国战争, writes a poem on it: the National Protection Army 护国军 fighting at Naxi beyond the Cotton Slope 棉花坡, half a year of hard fighting, Yuans 袁氏 crown fallen under the horses hooves.'
