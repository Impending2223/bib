  - cite: {id: cal.1963-10-25.china-leadership-7, item: '[[w.zhu-de-nianpu-xinbian]], III, 1888–1889 (Oct. 25, 1963; Zhu De 朱德, with Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真, Chen Yi 陈毅, He Long 贺龙, Li Xiannian 李先念, Tan Zhenlin 谭震林, Kang Sheng 康生, Bo Yibo 薄一波, Nie Rongzhen 聂荣臻 and others, receives those at the second congress of members'' delegates of the national handicraft cooperatives 中华全国手工业合作社第二次社员代表大会 and at a dozen other conferences of the army and the ministries, and the students of the national supply and marketing cooperatives cadre school)'}
