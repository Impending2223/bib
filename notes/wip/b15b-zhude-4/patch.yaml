  - add:
      entry:
        id: cal.1963-04-01.china-leadership-8
        when: Apr. 1
        date: '1963-04-01'
        place: naxi
        thread: china-leadership
        c: 'Zhu De 朱德, passing the old battlefield of Naxi 纳溪 in the National Protection War 护国战争, writes a poem on it: the National Protection Army 护国军 fighting at Naxi beyond the Cotton Slope 棉花坡, half a year of hard fighting, Yuan''s 袁氏 crown fallen under the horses'' hooves.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1870. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
