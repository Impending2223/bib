        when: Feb. 5
        date: '1964-02-05'
        place: nanchang
        thread: china-leadership
        c: 'Nanchang 南昌. Zhu De 朱德 hears Yang Shangkui 杨尚奎, first secretary of the Jiangxi committee 中共江西省委, on Jiangxi 江西. Told that the many lines have been too little pressed and the peasants'' income has fallen, he says: the masses are keener on the many lines than the cadres; the cadres must turn round and push them hard.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1899. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@B-D']
  - add:
      entry:
        id: cal.1964-02-05.china-leadership-7
        when: Feb. 5
        date: '1964-02-05'
        thread: china-leadership
        c: 'Zhu De 朱德 cables the Center 中共中央 and Mao Zedong 毛泽东: in Zhejiang 浙江 and Fujian 福建, from leading cadres to the masses, great drive and confidence for a big harvest in 1964; the masses everywhere want the many lines, and the leaders are taking it up with some effective measures; Fujian has over two million abroad, and good work among their families at home is not only a matter of remittances but more of widening our political influence; the families'' supply, chiefly of better goods and food, short, to be helped by the departments concerned.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1899. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
