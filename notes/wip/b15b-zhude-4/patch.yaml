        c: Leshan county 乐山县, Sichuan 四川. Zhu De 朱德 arrives and inspects the Leshan mulberry orchard 乐山桑园 and silkworm-egg farm 蚕种场. He hears the heads of the Leshan county committee 中共乐山县委.
