  - add:
      entry:
        id: cal.1963-04-27.china-leadership-5
        when: Apr. 27
        date: '1963-04-27'
        place: chengdu
        thread: china-leadership
        c: 'Chengdu 成都. Zhu De 朱德 hears Du Xinyuan 杜心源 and Chen Gang 陈刚, secretaries of the Sichuan committees Secretariat 中共四川省委书记处, and says: Sichuan 四川 was rich; why poor these years? Natural disasters, and faults of policy besides: since the "Great Leap Forward" 大跃进 this forbidden and that forbidden, too tightly bound, purchase prices unfair; production not against the objective laws of the economy, but strictly by them, by local conditions, hills unfit for grain to grow cash crops; the hills chief need lifting water to irrigate; more export goods, and some places opened to tourists, for foreign exchange.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1874. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
