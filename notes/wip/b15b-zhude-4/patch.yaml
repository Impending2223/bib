  - add:
      entry:
        id: cal.1963-04-04.china-leadership-6
        when: Apr. 4
        date: '1963-04-04'
        place: qijiang
        thread: china-leadership
        c: 'Qijiang county 綦江县, Sichuan 四川. On his way to Chongqing 重庆, Zhu De 朱德 inspects the county''s Sanjiang iron and steel works 三江钢铁厂, wire-drawing works 拉丝厂 and steelmaking works 炼钢厂. He hears the heads of the Qijiang county committee 中共綦江县委 on their work. Told that more than 1,500 of the county have gone up to the hills and down to the villages and settled, he says: the peasants to be reassured; if the villages are unsettled, the cities cannot be settled; not into the cities but down to the villages.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1871. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-F']
