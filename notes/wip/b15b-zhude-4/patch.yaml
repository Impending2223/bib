  - add:
      entry:
        id: cal.1963-04-24.china-leadership-16
        when: Apr. 24
        date: '1963-04-24'
        place: leshan
        thread: china-leadership
        c: 'Leshan 乐山. Zhu De 朱德 visits the Erya Terrace 尔雅台 outside the Zhengjue Temple 正觉寺 on the Wuyou Hill 乌尤山 and writes the poem "Climbing the Erya Terrace" 《登尔雅台》: the three rivers meeting at Leshan, on the terrace he remembers an old friend, Mount Emei 峨眉 far off in the clouds, Moruo''s 沫若 grace.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1873. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1963-04-25.china-leadership-16
        when: Apr. 25
        date: '1963-04-25'
        place: meishan
        thread: china-leadership
        c: 'Meishan county 眉山县, Sichuan 四川. Zhu De 朱德 visits the Three Su Park 三苏公园, with its Three Su Shrine 三苏祠 to the Song 宋代 writers Su Xun 苏洵 and his sons Su Shi 苏轼 and Su Zhe 苏辙, and writes the poem "The Three Su Park" 《三苏公园》: a father and two sons, all great writers, their poems to last a thousand years.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1874. Names: Zhu De.'
