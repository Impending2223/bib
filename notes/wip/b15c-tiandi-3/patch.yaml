    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 534 (that morning Zhou is holding the Group''s liaison meeting at the Diaoyutai when Yang Chengwu''s urgent call comes; Zhou: move the
      Chairman to a safe place as need be; he will settle Peking''s business and fly at once to Wuhan; Wu Faxian''s memoir puts the meeting the night of Zhou''s return, the Zhou chronology
      on the 20th, which Yang follows)'
