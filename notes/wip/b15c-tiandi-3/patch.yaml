    add: 'Song Bolin 宋柏林, *Hongweibing xingshuai lu: Qinghua fuzhong hongweibing shouji* 《紅衛兵興衰錄——清華附中紅衛兵手記》 (Desai chuban gongsi 德賽出版公司, Hong Kong, 2006), 124 (cited by [[w.yang-jisheng-tiandi-fanfu]],
      I, 255 n.19)'
