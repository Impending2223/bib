    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 392–393 (Zhou presides; seven "Politburo life meetings" at Huairen Hall 懷仁堂 from Feb. 25 to Mar. 18; Chen Yi by day at his foreign affairs,
      by night criticized; Kang Sheng: "the proletariat''s anger," "the gravest anti-Party incident since the Eleventh Plenum," "a rehearsal for a coup"; Jiang Qing: a "bourgeois restoration
      current"; the veterans examine themselves one by one; the Standing Committee''s liaison meeting that Zhou held for the daily work stops, the Group''s liaison meeting takes its
      place, Zhou presiding; Zhou to Jiang Qing and Zhang Chunqiao: "from now you decide, I do the work for you")'
