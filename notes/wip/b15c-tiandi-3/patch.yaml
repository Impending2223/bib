    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 387 (at the Military Commission''s meeting Jiang Qing and Chen Boda charge Xiao Hua 蕭華, head of the General Political Department, with
      the army''s lagging movement, call him a "bourgeois politician" and order him to make self-criticism that night before the 100,000 at the Workers'' Stadium 工人體育場; Ye Jianying and
      Nie Rongzhen leave early in protest; Zhou: without my order Xiao Hua does not go; Zhou and Ye go together to Mao and the rally is stopped (the day not given))'
