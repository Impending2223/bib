    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 388–390 (Zhou presides at Huairen Hall 懷仁堂; present Tan Zhenlin, Chen Yi, Li Xiannian, Ye Jianying, Li Fuchun, Xu Xiangqian, Nie Rongzhen,
