        n.36); Wang Liaoli 王料力 and Yuan Xunhui 袁訓會, interview with Xu Youyu 徐友漁, Sept. 24, 2012 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 403 n.37). See [[cal.1967-02-17.china-leadership-4]].'
