- add:
    entry:
      id: cal.1968-03-23.china-leadership-4
      when: Mar. 23
      date: '1968-03-23'
      place: peking
      time: 1968-03-23T02:00Z
      time_zone: Asia/Shanghai
      time_approx: true
      thread: china-leadership
      c: 'About 10 a.m. Lin Biao 林彪 and Zhou Enlai 周恩來, with the whole of the Group''s liaison meeting, talk to Yang Chengwu 楊成武: his errors mountain-stronghold factionalism and the
        distorting of Marxism; with Fu Chongbi against Xie Fuzhi, with Yu Lijin against Wu Faxian; Mao held four meetings and he is removed as acting chief of staff and first secretary
        of its Party committee; he is to stay at the Great Hall, then go with his family to the East Lake at Wuhan. Huang Yongsheng 黃永勝 arrives with Wu Faxian at the Great Hall; Zhou
        has Yang brought in: "hand your work to Huang Yongsheng"; Yang: "yes."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 445. The words: 23日上午10時左右 (I, 445). Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd
        ed., 2008), 725 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 445 n.62); Huang Zheng 黃正, *Junren Yongsheng* 《軍人永勝》, vol. 2 (2011), 235 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 445 n.63). See [[cal.1968-03-23.china-leadership-3]]. Names: Lin Biao, Zhou Enlai, Xie Fuzhi, Wu Faxian, Huang Yongsheng.'
      src:
