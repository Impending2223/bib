    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 535 (Zhou flies back to Wuhan in the afternoon, his movements known: over a hundred of the independent division and Million Heroes trucks
      burst into the Wangjiadun airfield, armed, "we want the Premier"; by Wu Faxian, told by Liu Feng of the trucks, he had the plane land at Shanpo, 60 km away; by Zhou''s doctor Zhang
      Zuoliang 張佐良, two more planes carry men of Unit 8341; after circling over the crowd at Wangjiadun they land at Shanpo about 5, later fly to Wangjiadun, and after dark Zhou, in
      plain clothes and dark glasses, goes by two jeeps to the East Lake guesthouse, Baihua No. 1, to arrange Mao''s leaving; the 15th Airborne Army''s Eighth Company of Shangganling
      guards Mao to his train at the Hankou airfield siding)'
