      when: Aug. 29–Sept. 3
      date: '1966-08-29'
      place: shanghai
      thread: china-leadership
      c: 'Shanghai 上海. The city''s first great house raid, with the tacit consent of the Shanghai committee 上海市委, in fact its organizer behind the scenes: the Public Security Bureau
        公安局 supplies the lists of households, gathered by district and handed back down by district with 1:50,000 military maps of Shanghai for the Red Guards to find the addresses.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 260. Made public: 2015. To check: Li Xun 李遜, *Geming zaofan niandai: Shanghai wenge yundong shigao* 《革命造反年代——上海文革運動史稿》 (Oxford University
        Press, Hong Kong, 2015), 108, 110 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 260 n.33).'
      src:
