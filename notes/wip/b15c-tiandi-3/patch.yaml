      Tan Zhenlin and Xu Xiangqian his deputies, bring back Wang Ming and Zhang Guotao, invite America and the Soviet Union too; the Politburo to meet on it, if need be for two months;
      the Group''s errors one, two or three percent, 97 right; Zhou makes self-criticism; "life meetings" decided for Chen Yi, Tan Zhenlin and Xu Xiangqian, the three to "ask leave and
      examine themselves"; Kang Sheng afterward: never in all his years seen the Chairman so angry)'
