    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 393 (the letter to Chen Yi, Zhenlin, Xiannian, Qiuli and Gu Mu, copy to Fuchun, signed Zhou Enlai, May 5, 1967: May Day unity must not
      give the five the illusion to deny the February adverse current, press down the rebels, back the conservatives and take revenge, or there will be a new swing; "a warning, lest
      it be said I did not tell you before")'
