- cite:
    id: cal.1967-01-21.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 431 (the Anhui rebels, seizing the power of Li Baohua, call a rally of 10,000 and ask the army to guard it; on the Nanjing Military Region''s
      request Mao writes on Jan. 21: "Comrade Lin Biao, the PLA should support the broad masses of the left ... the so-called non-involvement is false; it has long been involved; a new
      order should be issued, the earlier ones void")'
- cite:
    id: cal.1967-01-23.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 431–432 (Lin Biao acts at once, and the next day the Military Commission''s enlarged meeting adopts the "Decision on the PLA resolutely
      supporting the revolutionary left masses," Zhongfa [67] 27 中發〔67〕27號: the orders on non-involvement void; troops to go to the true left when it asks; counter-revolutionaries against
      the left suppressed; no shelter for capitalist-roaders; the army educated in Mao''s line; relayed to every soldier)'
