      current"; the veterans examine themselves one by one; the Standing Committee''s liaison meeting that Zhou held for the daily work stops, the Group''s liaison meeting takes its
      place, Zhou presiding; Zhou to Jiang Qing and Zhang Chunqiao: "from now you decide, I do the work for you")'
