      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peking, the Great Hall, Anhui Hall 人大會堂安徽廳. From the evening to 2:30 a.m. Zhou Enlai 周恩來 presides over the meeting on the "2.23 incident," the third investigation, with Zhao
        Yongfu 趙永夫, Zhang Xiaochuan 張曉川, the mass organizations'' delegates and Peking Red Guards who had gone to Qinghai: "8.18" is found to have had no guns. Zhou announces the Center''s
        decision on Qinghai and calls out: "Comrades of the Liberation Army, take the three of them away!" Soldiers tear off the badges of Zhao, Zhang and Wang Zhao 王昭 and lead them
        off; Wang cries at the door that he has nothing to do with them.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 400. The words: 3月24日晚至25日凌晨2時半 (I, 400). Made public: 2008. To check: Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu
        haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese University Press, Hong Kong, 2008), 462 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 400 n.32). See [[cal.1967-03-24.china-leadership-2]].
        Names: Zhou Enlai. The time is the first day''s.'
      src:
        c: d1114e15
        rows:
