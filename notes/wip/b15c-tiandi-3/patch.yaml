- add:
    entry:
      id: cal.1967-02.china-leadership-30
      when: Feb., after the 17th
      date: 1967-02
      at: after 1967-02-17
      place: chengdu
      thread: china-leadership
      c: Chengdu 成都. Truckloads of soldiers with live ammunition go to the rebels' units; with the "Industrial Army" 產業軍, the Chengdu Military Region and the local police, procuracy
        and courts arrest great numbers of the Chengdu Workers' Rebel Corps' heads and activists; the Corps is declared reactionary and by mid-March has fallen apart; many leaders and
        core members of the Sichuan University 8.26 Fighting Corps are seized. By Fan Shuo's 范碩 count (I, 403 n.36), in Sichuan over 1,100 rebel bodies are banned and over 80,000 heads
        and core members arrested, over 33,000 in the Chengdu area; by Xu Youyu 徐友漁 (n.37), Chengdu's prisons overflow, and temples are made prisons.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 402–403. To check: Fan Shuo 范碩, 〈三支兩軍的起緣與「七二零」事件的暴發〉, *Zhonghua ernü* 《中華兒女》, 2001, no. 2 (cited by Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua
