    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 394 (to steady the army after the masses it held down stormed it, the Military Commission issues its "eight orders" on Jan. 28: "resolutely
      oppose the right; take dictatorial measures against counter-revolutionary organizations and counter-revolutionaries on firm evidence"; the orders become the armies'' warrant for
