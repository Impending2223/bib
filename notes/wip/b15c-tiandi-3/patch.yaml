- cite:
    id: cal.1967-04-01.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 408–409 (Apr. 1, the Center''s decision on Anhui and its annex, Zhongfa [67] 117 中發〔67〕117號: mass bodies not to be declared counter-revolutionary
      at will, nor the masses branded so; no arrests at will; those branded for storming the district or for their views on the seizure to be cleared, the arrested freed, warrants withdrawn;
      "revolution is no crime"; the army to back the left and not one left body against another; Mao''s added passage on the students who stormed Zhongnanhai and the Ministry of Defense
      unrebuked; by Yang, the "February suppression" is checked after it)'
