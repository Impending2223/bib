- cite:
    id: cal.1967-04.china-leadership-14
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 567 (Yao Dengshan, expelled by Indonesia on Apr. 22, reaches Peking on Apr. 30, met at the plane by Zhou, Jiang Qing, Chen Boda, Kang Sheng,
      Li Fuchun, Chen Yi and Li Xiannian; on the evening of May 1 Zhou has him on the Tiananmen rostrum for the fireworks; Mao receives him and is photographed with him, the photograph
      in the next day''s *Renmin ribao*; he joins the Liaison Station as its adviser; Zhou later names him a "May 16" counter-revolutionary, struggled before 10,000 at the Workers''
      Stadium and jailed nine years at Qincheng)'
