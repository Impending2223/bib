- cite:
    id: cal.1967-07-18.china-leadership-4
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 524–525 (the afternoon of July 18, to the Military Region''s division and second-level department heads: the Feb. 8 Statement wrong in
      views but right in its direction of seizure; the Million Heroes the armed department''s and the Zhuaban''s, its mobilization order of June 8 a city-wide counterattack; eight points:
      the Region to admit of itself its errors of direction and line, above all dissolving the Workers'' Headquarters, and rehabilitate it; the "three steel" and "three new" the left
      and the core of the alliance; no mass body to be banned, even conservative; the Million Heroes conservative; no peasants into the towns; Yang Chengwu took Zhou''s outline to Mao
      the night of the 17th and Mao returned it, "agreed, let him speak"; Chen Zaidao, angry: "Zhou the bearded, what is so great about you ... if the Chairman truly signed your outline,
      we carry it out"; Zhou bangs the table: "do not think we can do nothing with you")'
