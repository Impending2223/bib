      when: Aug. 25
      date: '1966-08-25'
      place: peking
      thread: china-leadership
      c: Peking. Members of Tsinghua's "Aug. 8" faction (the Mao Zedong Thought Red Guards 毛澤東思想紅衛兵) go to the Center's reception station at 22 Xi'anmen Street 西安門大街22號 to report He
        Pengfei's 賀鵬飛 "red terror" at Tsinghua; Zhou Rongxin 周榮鑫, secretary-general of the State Council, puts them off and criticizes nothing.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 255. Made public: 2016.'
      src:
        c: faf1d39d
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 255: all'
