      when: Mar. 19
      date: '1967-03-19'
      thread: china-leadership
      c: 'The Military Commission 中央軍委, on Mao''s instruction, issues the "Decision on concentrating forces to carry out support of the left, of agriculture, of industry, military control
        and military training" 〈關於集中力量執行支左、支農、支工、軍管、軍訓的決定〉, one of the 17 documents of its enlarged meeting: the "four bigs" in the general departments and services to pause about the
