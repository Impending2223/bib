    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 409 (the Military Commission''s "ten orders": no arrests at will, still less in numbers; no mass body to be declared reactionary and banned
      at will; no pursuit of those who stormed army organs, left, middle or right; taken by all as correcting the "eight orders")'
