      c: Peking. The Cultural Revolution Group, in answer to the marshals' two rallies, prepares a rally of the same size at the Capital Workers' Gymnasium 首都工人體育館, mostly of local student
        rebels, to which Chen Yi 陳毅, Ye Jianying 葉劍英 and other marshals and army leaders are summoned to be struggled; by Yu Ruxin's materials Chen, Ye, Wu Faxian 吳法憲, Qiu Huizuo 邱會作
        and Li Zuopeng 李作鵬 were to be named. That night Zhou Enlai 周恩來, Kang Sheng 康生, Jiang Qing 江青, Xiao Hua 蕭華 and Yang Chengwu 楊成武 receive the rally's preparatory staff and try to
        dissuade them, turning them toward the All-Army Group and Liu Zhijian 劉志堅. The marshals do not come and the rally is called off; the students wait a day hungry, and posters to
        bring down Chen and Ye multiply.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 421–422. Made public: 2016. To check: materials supplied by Yu Ruxin 余汝信 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 422 n.13b). Names:
        Chen Yi, Ye Jianying, Wu Faxian, Qiu Huizuo, Li Zuopeng, Zhou Enlai, Kang Sheng, Jiang Qing. Check: the day: Yang sets it after the rally of Nov. 29 and before the meeting of
        Dec. 31.'
