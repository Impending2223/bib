- cite:
    id: cal.1967-01-24.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 426 (late in January, the army''s leading organs stormed and leaders seized, Lin Biao urgently calls Ye Jianying, Xu Xiangqian, Nie Rongzhen
      and Yang Chengwu: "the army cannot go on so; we need a set of rules"; he dictates to his secretary a seven-article "Military Commission order," and those present agree; at the
      Commission''s enlarged meeting Jiang Qing and some of the Group oppose it)'
