      date: '1967-07-20'
      place: peking
      time: 1967-07-20T08:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peking, the Great Hall. At 4 p.m. Qiu Huizuo 邱會作 is called to Lin Biao 林彪; Ye Qun 葉群: Wang Dongxing and Zhang Yaoci report "the counter-revolutionaries are breaking in, nearly
        at the Chairman''s quarters"; Jiang Qing has begged Lin and Ye in tears to go to Wuhan. Lin''s letter urging Mao to leave Wuhan, revised by Qi Benyu, Chen Boda and Guan Feng,
        is signed in Jiang Qing''s name; Lin sends Qiu with it by plane: report the country''s situation, propose that the Chairman move, "the Chairman''s safety is the Party''s"; if
        Chen Zaidao will not obey, hold Wuchang and await help; if he cannot reach Zhou, set up a command post at the Wangjiadun airfield; the 29th Division and the airborne army are
        ready. Qiu lands at Wangjiadun about 11 p.m., with a medical team of the PLA General Hospital.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 534–535. The words: 20日下午4點 (I, 534); 晚11時左右 (I, 535). Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社,
        Hong Kong, 2011), 533 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 534 n.47, 535 n.49); Qian Sijie 錢嗣傑 and Gu Baozi 顧保孜, *Mao Zedong zhengzhi Shenzhou youshi shi 1964–1968*
        《毛澤東正值神州有事時1964-1968》 (Renmin wenxue chubanshe, 2013), 259 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 534 n.48); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong
        Kong, 3rd ed., 2011), 687 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 535 n.50b). Names: Qiu Huizuo, Lin Biao, Ye Qun, Jiang Qing, Chen Boda, Zhou Enlai, Mao Zedong. Check:
        Qiu''s arrival: about 11 p.m. (Qiu); after 2 p.m. (Wu Faxian, 687), I, 535 n.50.'
      src:
