      date: '1967-01-29'
      thread: china-leadership
      c: 'Ye Jianying 葉劍英 relays the "eight articles" 軍委八條 to the Military Commission''s enlarged meeting, elated and angry: at "whoever would throw the army into confusion will come
        to no good" he strikes the table so hard that he breaks a bone at the edge of his right hand.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 426. Made public: 2011. To check: *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 566 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 426 n.24a); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2011), 652 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 426 n.24b). Names: Ye Jianying.
        Check: Yang (I, 426 n.24) gives three accounts of the broken hand: here (Li Zuopeng); at the Jingxi Hotel, arguing with Chen Boda (Wu Faxian, 652); at Huairen Hall; Dai Qing
        could not settle it.'
