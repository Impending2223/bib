      when: May 13
      date: '1967-05-13'
      place: peking
      time_range:
      - 1967-05-13T11:00Z
      - 1967-05-13T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Peking, the theater of the Peking Exhibition Hall 北京展覽館劇場. The "old three armies" 老三軍 perform in the evening; Xiao Jingguang 蕭勁光, Wang Hongkun 王宏坤, Yu Lijin 余立金, Cao Lihuai
        曹裏懷, Li Tianhuan 李天煥, Wu Lie 吳烈, Xiong Botao 熊伯濤 and Fu Chongbi 傅崇碧 gather in a building east of the theater, and the garrison sends two companies to stop a fight. The "new three
        armies" 新三軍 storm it; by Li Zuopeng 李作鵬 they never get in and some tens are hurt; by one of the storming side they reach the stage, are surrounded and break out; a broadcast
        relays Lin Biao''s office: storming the performance is wrong, Vice-Chairman Lin backs it; the colleges'' bodies withdraw and the show goes on.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 429. The words: 5月13日晚 (I, 429). Made public: 2011. To check: *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2011),
        538 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 429 n.29a); Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese University
        Press, Hong Kong, 2008), 51 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 429 n.29b); Bai Erqiang 白而強, 〈我策劃了衝擊三軍演出事件〉, *Yanhuang chunqiu* 《炎黃春秋》, 2011, no. 2 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 429 n.30). See [[cal.1967-05-13.china-leadership-3]]. Names: Li Zuopeng, Lin Biao. Check: the injured: some tens (Li Zuopeng); over 200, tens of them badly (Bu Weihua, 51,
