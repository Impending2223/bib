      Fuchun 李富春, Tan Zhenlin 譚震林, Li Xiannian 李先念, Yu Qiuli 餘秋裏, Wang Renzhong 王任重, Liao Chengzhi 廖承志 and many veteran cadres; Zhou Enlai sends Zhou Rongxin 周榮鑫, secretary-general of
      the State Council, and Yong Wentao 雍文濤, deputy secretary-general, to guide the Pickets, and tells Zhou Rongxin to help them with rooms, transport and printing)'
