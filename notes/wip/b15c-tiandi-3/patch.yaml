      thread: china-leadership
      c: 'Ye Jianying 葉劍英 relays the "eight articles" 軍委八條 to the Military Commission''s enlarged meeting, elated and angry: at "whoever would throw the army into confusion will come
        to no good" he strikes the table so hard that he breaks a bone at the edge of his right hand. The Commission decides on discipline for all the army''s rebels.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 426. Made public: 2011. To check: *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 566 (cited by [[w.yang-jisheng-tiandi-fanfu]],
