- add:
    entry:
      id: cal.1968-03-24.china-leadership-4
      when: Mar. 24
      date: '1968-03-24'
      place: peking
      thread: china-leadership
      c: 'Peking. Before the meeting Zhou Enlai 周恩來 has Wang Xinting 王新亭 replace the guards at Yang Chengwu''s home with the Central Guard Regiment, and sends Qiu Huizuo 邱會作 to bring
        Yang to the Great Hall "for a meeting"; Yang, unshaven and gray: "where are you taking me?"; his family cry out; Wang Xinting searches the house and seals the papers. At the
        house next door Xu Xiangqian''s 徐向前 secretary, alarmed, holds the marshal and takes the keys of his files.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 444. Made public: 2011. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 556–557 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 444 n.60); *Li Zuopeng huiyilu* 《李作鵬回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 614 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 444 n.61a); Cheng Guang 程光, *Xinling
        de duihua: Qiu Huizuo yu erzi tan wenhua dageming* 《心靈的對話——邱會作與兒子談文化大革命》, vol. 1 (Beixing chubanshe 北星出版社, Hong Kong, 2011), 177 (cited by [[w.yang-jisheng-tiandi-fanfu]], I,
        444 n.61b). Names: Zhou Enlai, Qiu Huizuo, Xu Xiangqian. Check: the day: Yang puts it "before the meeting of Mar. 24"; Lin and Zhou talked to Yang Chengwu at the Great Hall the
        morning of the 23rd (I, 445).'
      src:
        c: 09b11a0c
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 444: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 444 n.60: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 444 n.61a: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:zhou-enlai
      - name:qiu-huizuo
      - name:xu-xiangqian
