    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 391–392 (before dawn of Feb. 19 Mao calls a meeting: Zhou, Ye Qun for Lin Biao, Kang Sheng, Li Fuchun, Ye Jianying, Li Xiannian, Xie Fuzhi,
