      when: Dec. 31
      date: '1966-12-31'
      place: peking
      thread: china-leadership
      c: 'Peking, the Jingxi Hotel 京西賓館. The Cultural Revolution Group holds a meeting of 2,000, Liu Zhijian 劉志堅 presiding, at which Ye Jianying 葉劍英 is named to make self-criticism,
        on Mao''s instruction to "examine and close the case," for his speeches at the two rallies of 100,000; before he finishes the students besiege him. Lin Biao 林彪 reports to Mao,
        who says he knew nothing of the meeting beforehand: "this must be looked into." The Group puts the blame on Liu Zhijian.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 422. Made public: 2011. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2011), 625–627 (cited by [[w.yang-jisheng-tiandi-fanfu]],
