        Check: Yang (I, 426 n.24) gives three accounts of the broken hand: here (Li Zuopeng); at the Jingxi Hotel, arguing with Chen Boda (Wu Faxian, 652); at Huairen Hall; Dai Qing
        could not settle it.'
