      time_zone: Asia/Shanghai
      thread: china-leadership
      c: Hohhot 呼和浩特, the Inner Mongolia Military District's compound 內蒙古軍區大院. At noon several hundred rebel students and workers sit in at the south gate against the District's repression
        of the rebels, machine guns on the main building's roof. At 12:15 p.m. Liu Qing 柳青, deputy head of the District's training department, comes out and shoots twice the student
        leading the slogans, Han Tong 韓桐, a fourth-year student of foreign languages at the Inner Mongolia Normal College 內蒙古師範學院 and a member of the "Third Headquarters of Hohhot" 呼三司;
        he dies three hours later.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 402. The words: 中午12時15分 (I, 402). Made public: 2002. To check: 〈「文革」中軍隊向學生開的第一槍〉, *Dangdai Zhongguo yanjiu* 《當代中國研究》, 2002, no. 3 (cited
        by [[w.yang-jisheng-tiandi-fanfu]], I, 402 n.35).'
