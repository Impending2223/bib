    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 530–532 (at 0:30 on the 20th fourteen of the "Wuhan Public Security" 武漢公安 of the Million Heroes drive to the East Lake guesthouse''s north
      gate near Mao''s Meiling lodge with a letter from a regiment''s political head: "we want Xie Fuzhi and Wang Li"; the Region''s security chief Wang Zhenying 王振英 stops them; Wang
      Dongxing sends Zhang Gencheng 張根成 of the Group''s staff; Zhong Hanhua, asleep, does not answer; about 3 a.m. a platoon of the 29th Division comes; the "Horticulture Army" leads
      a truck into Baihua No. 2; Xie: "I am Xie Fuzhi ... would you kidnap us?"; at 5:10, 21 trucks, 6 propaganda vans, 3 jeeps and a car of Unit 8201 and 41 Million Heroes vehicles
      and 3 fire engines burst in; soldiers with submachine guns at Xie and Wang; Chen Zaidao clubbed down: "I am Chen Zaidao, not Wang Li!"; about 6 Wang Li is put in a truck, Zhang
      Gencheng and two Beihang students taken; Niu Huailong at the west gate: "put the machine guns away"; Wang Dongxing tells the code clerks Xie Jingyi 謝靜宜 and Fan Yimin 樊一民 to be
