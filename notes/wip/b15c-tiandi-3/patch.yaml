- cite:
    id: cal.1966-08-25.china-leadership-4
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 272–277 (its founding declaration: the Pickets "a revolutionary rebel corps, a tool of the proletarian dictatorship," with the right to
      suppress the landlords, rich peasants, counter-revolutionaries, bad elements, rightists and the bourgeoisie''s "filial sons," to annul propaganda and bans, inspect every unit''s
      Red Guards and hold false Red Guards; in a month and more it issues ten general orders (1–10, undated on the page): Mao''s works on sale, leaders'' cars and homes not to be searched,
      raids only through the Red Guard headquarters with the police station and the residents'' committee, "fight with words, not force," the "four kinds" to leave Peking, foreign guests
      protected, the link-up welcomed; order no. 8 taking back much of nos. 5–7; by a member of the Capital Work Group it guarded the homes of Song Qingling, Guo Moruo, Li Zongren and
      other figures)'
