- add:
    entry:
      id: cal.1966-08-25.china-leadership-8
      when: Aug. 25
      date: '1966-08-25'
      place: peking
      thread: china-leadership
      c: 'Tsinghua University 清華大學, Peking. The middle-school Red Guards march through the university and drag "black gang" members from their homes to struggle them; "black gang" members,
        the "five black categories" and middle cadres are made to carry bricks from the Second Gate 二校門 again under the belts; posters go up: "The Aug. 24 action is very good!", "Red
        terror it must be".'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 255. Made public: 2016.'
      src:
        c: a383c512
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 255: all'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-25.china-leadership-9
      when: Aug. 25
      date: '1966-08-25'
      place: peking
      thread: china-leadership
      c: Peking. Members of Tsinghua's "Aug. 8" faction (the Mao Zedong Thought Red Guards 毛澤東思想紅衛兵) go to the Center's reception station at 22 Xi'anmen Street 西安門大街22號 to report He
        Pengfei's 賀鵬飛 "red terror" at Tsinghua; Zhou Rongxin 周榮鑫, secretary-general of the State Council, puts them off and criticizes nothing.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 255. Made public: 2016.'
      src:
        c: faf1d39d
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 255: all'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1967-04.china-leadership-16
      when: Apr., the eve of May Day
      date: 1967-04
      at: after 1967-04-21
      place: peking
      thread: china-leadership
      c: 'Tsinghua University 清華大學, Peking. Kuai Dafu''s 蒯大富 Jinggangshan Red Guard Headquarters 清華井崗山紅衛兵總部 completes a giant statue of Mao on the site of the Second Gate 二校門, the first
        Mao statue of the Cultural Revolution; at Kuai''s request Lin Biao 林彪 gives the inscription cut on its base: "Great teacher, great leader, great commander, great helmsman, long
        live Chairman Mao!"'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 255–256. Made public: 2016. Names: Lin Biao.'
      src:
