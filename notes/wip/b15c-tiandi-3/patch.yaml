      date: '1968-03-08'
      place: peking
      thread: china-leadership
      c: 'Peking, the Diaoyutai 釣魚臺, building no. 16 of the Cultural Revolution Group. Fu Chongbi 傅崇碧, commander of the Peking garrison, on a task from Jiang Qing 江青 of Mar. 5 to find
        lost manuscripts of Lu Xun''s letters, comes with his secretary unannounced to report; Yang Chengwu 楊成武 comes too. Jiang Qing: "who let you in?"; she quarrels with Yang and bangs
        the table, calls in Zhou Enlai, Chen Boda, Kang Sheng, Zhang Chunqiao, Yao Wenyuan and Wang Dongxing, and charges the two with storming the Group: the "storming of the Cultural
        Revolution Group."'
