      id: cal.1967-02-22.china-leadership-3
      when: Feb. 22
      date: '1967-02-22'
      place: wanxian
      thread: china-leadership
      c: 'Wanxian 萬縣, Sichuan. The loudspeaker teams of the Wanxian Military Subdistrict 萬縣軍分區 declare the "Main Force Army" 主力軍 counter-revolutionary and the "Red Flag" 赤旗 its accomplice,
        and martial law in some quarters. Students, then cadres and townspeople, march in protest. Soldiers burst into the Main Force Army''s quarters at the Zhenyuan Tang 真元堂, a former
        church, and fire, killing 5; as more try to reach the bodies an officer orders fire again: 18 more killed, and one more in the street, 24 dead. The rebels carry 18 bodies through
        the city: the "Feb. 22" suppression. Arrests follow in nearly every unit.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 403–404. Made public: 2013. To check: Liu Guoping 劉國平, 〈萬州的「二月鎮反」和「六三事件」〉, *Yanhuang chunqiu* 《炎黃春秋》, 2013, no. 1 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 404 n.40a); *Wanxian zhi* 《萬縣志》, chronicle (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 404 n.40b). Check: the dead: 24 (Liu Guoping); 33 (*Wanxian zhi*, I, 404 n.40b).'
