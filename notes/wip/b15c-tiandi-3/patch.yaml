      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 447. Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2008), 724 (cited by [[w.yang-jisheng-tiandi-fanfu]],
