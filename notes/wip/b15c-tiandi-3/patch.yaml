      c: 'Mao, talking with Yang Chengwu 楊成武, Zhang Chunqiao 張春橋, Wang Dongxing 汪東興 and Yu Lijin 余立金: "beware the black hands and counter-revolutionaries stirring ultra-left acts"; "the
