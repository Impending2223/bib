    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 493 (the Center''s opinions on the Chongqing question, Zhongfa [67] 159 中發〔67〕159號, approved by Mao (the "red five articles"): the army
      that supported the left has great achievements, but in February and March wrongly backed one side and the police''s wrong arrests; the bodies wrongly banned to be cleared and the
