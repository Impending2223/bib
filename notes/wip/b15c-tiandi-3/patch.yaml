- cite:
    id: cal.1966-08-24.china-leadership-8
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 253–255 (that evening the Red Guards hold the cadres in an interrogation room; He Pengfei 賀鵬飛 comes to inspect and treads on the head of
      Luo Zhengqi 羅征啟, head of the committee''s propaganda department, as Luo recalls; the next day the cadres are made to thank Mao for their food and are beaten, Qian Weichang 錢偉長
      among them; Song Bolin''s diary of the day records the twelve schools'' raid and the Second Gate pulled down)'
