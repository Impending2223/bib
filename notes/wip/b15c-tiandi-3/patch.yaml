- cite:
    id: cal.1968-03-24.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 442–444 (the meeting of 10,000 cadres of regiment level and above of the army organs, units and academies in Peking in the Great Hall''s
      auditorium, waiting from 9 p.m. and beginning after midnight; Yang Chengwu removed as acting chief of staff, Yu Lijin arrested, Fu Chongbi removed as garrison commander; Lin, on
      Mao''s three points (against factionalism, against double-dealing, the relative and the absolute): "a matter neither large nor small"; Yang with Yu to bring down Wu Faxian, with
      Fu to bring down Xie Fuzhi; praise of Jiang Qing; Zhou: a new "February adverse current," praise of Jiang Qing in the thirties, and leads the cry "down with whoever opposes Comrade
      Jiang Qing"; Jiang Qing, Chen Boda and Kang Sheng speak; Mao appears on the platform)'
