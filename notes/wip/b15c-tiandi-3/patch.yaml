    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 426 (Lin Biao takes Xu Xiangqian to Mao; Mao agrees to the seven articles and adds an eighth, "strengthen the education of children"; he
      writes "the eight articles as fixed, very good, issue"; Lin: "Chairman, with your signature, long live, long live!"; the order: "resolute dictatorial measures against counter-revolutionary
      organizations and counter-revolutionaries on firm evidence"; the army''s readiness and secrecy systems not to be stormed nor linked up with)'
