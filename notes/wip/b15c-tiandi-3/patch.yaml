- cite:
    id: cal.1967-11-05.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 436 (in winter 1967 Yang Chengwu publishes under his name "Greatly and especially establish the absolute authority of the great commander
      Chairman Mao ...," written by the General Staff''s criticism group and revised many times at his order; he has a Fuzhou soldier who criticized it examined and discharged; after
      Sept. 13, 1971 he says Lin Biao''s people wrote it and made him sign; days after, Mao: "I read only the title; the title is wrong, metaphysical"; his comment: "absolute authority"
      improper, all authority relative; authority grows of itself in struggle, not by "great establishing")'
