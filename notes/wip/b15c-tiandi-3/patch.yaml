      - name:zhou-enlai
- cite:
    id: cal.1967-03-24.china-leadership-4
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 400–401 (the decision of the Center, State Council, Military Commission and Cultural Revolution Group on Qinghai, Mar. 24, Zhongfa [67]
      110: on Mao''s and Lin Biao''s instructions of Mar. 11, the Qinghai District''s affair "a counter-revolutionary coup"; Zhao Yongfu usurped the army''s power, with Zhang Xiaochuan
      put down "8.18" by arms, over 300 dead and wounded, nearly 10,000 arrested; "8.18" had no guns; the Military Commission orders Liu Xianquan to handle Qinghai with full powers,
      with Lanzhou''s help; "8.18" declared revolutionary; the dead to be honored, the arrested freed, the verdicts reversed)'
