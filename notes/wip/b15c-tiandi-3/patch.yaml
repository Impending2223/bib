- add:
    entry:
      id: cal.1968-03-23.china-leadership-3
      when: Mar. 23
      date: '1968-03-23'
      time: 1968-03-22T17:00Z
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'At 1 a.m. Wu Faxian 吳法憲 is called to a meeting at Mao''s, already begun: Mao, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Xie Fuzhi,
        Ye Qun, Wang Dongxing. Mao to Wu: "you are right, Yang Chengwu wrong"; Yang to be removed; Lin proposes Huang Yongsheng 黃永勝 as chief of staff, and Mao agrees, without "acting";
        Yu Lijin 余立金, by Xu Shiyou''s materials a traitor, to be arrested and tried; on Jiang Qing''s proposal Fu Chongbi 傅崇碧 moved to deputy commander at Shenyang, Wen Yucheng 溫玉成 in
        his place. Mao and Lin leave Zhou to carry it out.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 442, 445. The words: 3月23日淩晨一點 (I, 442). Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong,
        3rd ed., 2008), 722–723 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 442 n.56). See [[cal.1968-03-22.china-leadership-2]]. Names: Wu Faxian, Lin Biao, Zhou Enlai, Chen Boda,
        Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Xie Fuzhi, Ye Qun, Huang Yongsheng, Xu Shiyou, Mao Zedong.'
      src:
        c: 2a013ad3
        rows:
