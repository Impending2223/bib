- add:
    entry:
      id: cal.1967-02.china-leadership-27
      when: Feb., early
      date: 1967-02
      at: before 1967-02-01
      thread: china-leadership
      c: 'Mao''s instruction on the army stormed: no right-wing mass organization may storm the army, but it is to be handled with care, persuasion first; if they take the first floor,
        the troops fall back to the second; the second, to the third; if they try for the third, the troops may fire in self-defense, only on the right-wing leaders. Lin Biao 林彪 has
        his secretary Zhang Yunsheng 張云生 take it to Ye Jianying 葉劍英, secretary-general of the Military Commission, who relays it at once to the Commission''s enlarged meeting: the Chairman
        takes great care for the army''s stability.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 394. Made public: 1988. To check: [[w.yunsheng-maojiawan-jishi]], 86–89 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 394 n.23). Names:
        Lin Biao, Ye Jianying, Mao Zedong.'
