      when: Aug. 22
      date: '1964-08-22'
      thread: china-leadership
      c: 'Liu Shaoqi 劉少奇 on the labor system: only one system now, fixed workers with labor insurance, hard to dismiss; from now not one system only, but temporary and contract workers
        as far as possible; he opposed making temporary workers regular; add no fixed workers, or few, and revise labor insurance. From 1964 the localities take on great numbers of temporary
        and contract workers.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 368–369. Made public: 1985. To check: Liu Shaoqi 劉少奇, 〈關于固定工和合同工并存的勞動制〉, Aug. 22, 1964, [[w.shaoqi-liu-shaoqi-xuanji-selected]], 470–472
        (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 369 n.1). Names: Liu Shaoqi.'
