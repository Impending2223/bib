      time_band: night
      time_zone: Asia/Shanghai
      thread: china-leadership
      c: 'Late at night Zhou Enlai 周恩來 telephones Huang Yongsheng 黃永勝, commander of the Canton Military Region: come to Peking at once, with his wife, Wu Faxian 吳法憲 has sent a special
        plane; asked why, Zhou: to discuss the Hunan revolutionary committee''s members.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 445. The words: 深夜 (I, 445). Made public: 2011. To check: Huang Zheng 黃正, *Junren Yongsheng* 《軍人永勝》, vol. 2 (Xin shiji chubanshe 新世紀出版社,
        Hong Kong, 2011), 235 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 445 n.63). Names: Zhou Enlai, Huang Yongsheng, Wu Faxian.'
      src:
