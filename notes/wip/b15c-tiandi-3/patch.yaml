      thread: china-leadership
      c: 'Wuhan 武漢, Unit 8201 (the independent division). After Zhou Enlai''s 周恩來 departure, Zhong Hanhua 鐘漢華, against Zhou''s repeated charge that his talk not be passed down, lets
        the division relay it; its commissar Cai Bingchen 蔡炳臣 relays it at once to regiment level, the next day to platoons and men and to its representatives in the units, who pass
        it to the mass bodies; he adds that Zhou and Wang Li would not hear the Region''s report; Cai and the commander Niu Huailong 牛懷龍: "do not say outside it was the Premier," turning
        it on Wang Li; Niu: "Wang Li is a Guomindang member." By Zhong''s later self-criticism, "the first fire of the July 20 riot I lit."'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 527–528. Made public: 2010. To check: Zhong Hanhua 鐘漢華, self-criticisms at the Hubei study class, Nov. 30 and Dec. 1, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 527 n.23); Xu Hailiang 徐海亮, 〈武漢「7·20事件」——至今爭論不休的史實觀點〉, in Song Yongyi 宋永毅, ed., *Wenhua dageming: lishi zhenxiang he jiti jiyi* 《文化大革命：歷史真相和集體記憶》 (Tianyuan shuwu 田園書屋, 2010),
        466 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 528 n.24). Names: Zhou Enlai. The time is the first day''s.'
