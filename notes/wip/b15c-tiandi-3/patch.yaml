      thread: china-leadership
      c: 'Xining 西寧. Liu Xianquan 劉賢權, in the afternoon, to the heads of the Qinghai military control groups and the organ cadres: after "2.23" the District carried out "great arrests,
        great beatings, great struggles, great raids"; 10,157 arrested, detained, watched or held at home, 4,331 arrested; forced confessions, families and children implicated; whole
        groups made to kneel and "plead guilty" four or five hours.'
