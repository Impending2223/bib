      thread: china-leadership
      c: 'Peking, the Great Hall. In the afternoon Lin Biao 林彪 and the Cultural Revolution Group, Zhou Enlai 周恩來 coming later, take up Wuhan: a document in the names of the Center and
        the Group to say the Wuhan Military Region erred in direction and line in supporting the left and must change its stand; the general departments and services to declare for the
        Wuhan rebels and ring their units in Wuhan; Wu Faxian 吳法憲 rings the Wuhan air force''s Fu Chuanzuo, Xiao Qian and Liu Feng; the navy''s sailors on the ships at Wuhan to land,
        and the 15th Airborne Army to enter the city.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 534. The words: 下午 (I, 534). Made public: 2011. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2011),
