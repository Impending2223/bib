      date: 1967-05
      at: before 1967-05-11
      thread: china-leadership
      c: 'Liu Suyuan 劉素媛, a singer of the Air Force political department''s troupe and head of its conservative faction, tells Mao the Peking army troupes want a joint performance for
        the 25th anniversary of the Yan''an Talks; Mao: talk to Ye Qun 葉群, and has his secretary Xu Yefu 徐業夫 tell Lin Biao''s office to back it. Ye Qun at once receives Liu and others:
