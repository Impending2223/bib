      when: Feb. 17
      date: '1967-02-17'
      place: peking
      thread: china-leadership
      c: 'Ye Jianying 葉劍英 signs the Military Commission''s open letter to the Chengdu Workers'' Rebel Corps 成都工人造反兵團 and the Sichuan University 8.26 Fighting Corps 四川大學8.26戰鬥團, who have
        sat in at and stormed the Chengdu Military Region for its backing of the conservative "Industrial Army" 產業軍: it rebukes them and warns the Corps'' heads that they bear all the
