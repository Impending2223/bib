- cite:
    id: cal.1966-10-05.china-leadership
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 420 (the Center forwards the Emergency Instruction 〈中央軍委、總政治部關於軍隊院校無產階級文化大革命的緊急指示〉, Zhongfa (66) 515 中發(66)515號: on Lin Biao''s proposal
      the frames binding the movement in the academies discarded, the academies to follow the Sixteen Points as the local colleges do, with the four bigs; those branded at the start
      of the movement cleared; the army and academies not to take part in the localities'' movement; by Qiu Huizuo the All-Army Group''s work (Liu Zhijian, Yang Mancun, Xie Tangzhong);
      by Wang Li, Lin dictated it after Tao Zhu''s daughter Tao Siliang and another cadre''s child told him of the academies'' repression; by Yu Ruxin, Lin Doudou brought him the matter;
      the students pour into Peking and the leaderships of over 100 academies are paralyzed; Mao: "yaoyaoyao" (111 academies), "there are indeed demons")'
