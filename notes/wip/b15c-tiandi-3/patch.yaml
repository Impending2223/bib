- add:
    entry:
      id: cal.1966-11.china-leadership-23
      when: Nov.
      date: 1966-11
      place: chongqing
      thread: china-leadership
      c: Chongqing 重慶, the Jiangling Machine Works 江陵機器廠. The technician Gao De'an 高德安, in the technical section's office, sees on the desk of the branch secretary Zhang Jiaoguang 張角光
        the section's secret "ranking" of its people in four classes, himself in the fourth, "to be struck." The next afternoon he and four others demand an account; they form the "Sharp
        Knife Fighting Team" 尖刀戰鬥隊, and Zhang says the factory committee ordered the ranking. Workshop after workshop hands its lists to the branches and burns them in public.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 315–316. Made public: 2016. To check: He Shu 何蜀, ed., 〈李木森回憶〉, *Wangshi* 《往事》, no. 32 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 316
        n.11).'
