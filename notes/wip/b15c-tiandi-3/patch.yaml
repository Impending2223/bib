- cite:
    id: cal.1967-02-23.china-leadership-4
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 398–399 (at 8 a.m. martial law over Xining; the garrison command orders "8.18" banned and its leaders arrested; thirteen companies of the
      District''s independent division and regiment surround the paper and cut its communications and the roads to Lanzhou and the Hexi corridor; Zhao Yongfu commands from a nearby hotel,
      machine guns on the heights; at 11:10 a.m. the troops shoot up the 8.18 loudspeakers; at 2 p.m. flares from the hotel and the bridge behind the paper, and in some ten minutes hundreds
      fall: 347 masses dead and wounded, 169 dead, 178 wounded; a woman of the paper''s staff, warned the night before by an acquaintance in the District''s political department, hears
      the firing begin about 10 a.m.)'
