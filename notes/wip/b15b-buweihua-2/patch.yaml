      id: cal.1966-02-12.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61 (as a document of the Center, to the whole Party, every level to "act on it")'
      units: A
  - cite:
      id: cal.1966-02-12.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61 (the same day Peng Zhen gives Shanghai notice: the Standing Committee discussed the Outline, Chairman Mao agreed, the problem is solved)'
  - cite:
      id: cal.1966-02-13.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61 (Peng has Hu Sheng tell Zhang Chunqiao: Wu Han not to be called anti-Party and anti-socialist, not to be linked to the Lushan meeting)'
      units: A, B
  - cite:
      id: cal.1966-01.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61 n.81 (late January, Guan Feng goes to Shanghai expressly to be received by Jiang Qing, who tells him the criticism of *Hai Rui* is not academic alone but the counterattack on Peng Dehuai''s bid to reverse his verdict)'
      units: A
  - cite:
      id: cal.1966-05-06.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61–62 (Zhang Chunqiao, as Bu quotes him: the Outline bound our hands without a sound and turned the movement right; Yao Wenyuan''s and Guan Feng''s articles on the crux held back; "scholar-tyrant" meant not Yao or the Shanghai committee but Mao, "arbitrary" Mao''s linking of the play with Lushan; the day not given, May 1966)'
  - cite:
      id: cal.1966-05-05.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 62 (Lin Mohan''s recollection, the day not given: at the meeting that passed the May 16 Circular Kang Sheng said Jiang Qing had complained to Mao that Peng Zhen suppressed her, and Mao answered that he could topple Peng with a little finger, Kang being there; and that Mao had told him to tell Jiang Qing and Zhang Chunqiao not to worry)'
  - to-check:
