      item: '[[w.pu-weihua-zalan-jiu-shijie]], 70 (Peng asks Mao''s secretary Xu Yefu for a meeting, "only twenty minutes"; Mao takes no notice; the day not given)'
      units: B, C
  - cite:
      id: cal.1966-04-20.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 70 (Liu Shaoqi and Chen Yi, back at Kunming from Pakistan, Afghanistan and Burma on Apr. 19, are called by the General Office''s long-distance telephone to the meeting; Liu reaches Hangzhou Apr. 20)'
  - cite:
      id: cal.1966-04-22.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 70 (the day not given: Peking''s air oppressive, he would rather live in Shanghai; not Wu Han alone, a struggle touching the soul; "people in the court", in the Center, the regions, provinces and cities, the army; revisionism not in culture alone but in Party, government and army, chiefly Party and army; schools and places each to criticize a few; no breaking, no building; the notice open to discussion, even its rejection)'
      units: A, B, H
