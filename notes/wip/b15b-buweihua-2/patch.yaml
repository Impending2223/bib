  - cite:
      id: cal.1966-03-18.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 65 (at a small meeting, the day not given: the *Renmin ribao* printed much muck, promoted ghost plays and praised Hai Rui; like Chiang Kai-shek with his *Zhongyang ribao*, Mao does not read it, nothing in it; its *Xueshu yanjiu* was his idea; Wu Lengxi half a Marxist; its editors print only a third or a quarter Marxism; no paper is without errors; to learn from them, correct them)'
      units: L
  - cite:
      id: cal.1966-03-22.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 65 n.88 (the letter: "cannot send a delegation to your congress"; Mao had said at the Hangzhou meeting "we will not go")'
      units: A
  - cite:
      id: cal.1966-03-28.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 66–67 (Kang Sheng reports in Shanghai on the 23rd Congress and the JCP communique; Mao vetoes both: they agree to go, I do not; whether to go is a big matter; told of Xu Liqun''s call to Yang Yongzhi, Kang: "this is aimed at the Chairman"; Mao: without a cultural revolution old, middle and young will all be purged; his points, as Kang gave them to the enlarged Politburo May 5–6: the Outline wrong, he said nothing then, thinking the Standing Committee had discussed it; the Propaganda Department and the Peking committee to be dissolved if they shield bad men; why not tie Wu Han to Lushan; Deng Tuo a traitor, Jian Bozan to be named, Lu Ping unfit to lead Peking University; they to criticize themselves in public or he will; the Department "the King of Hell''s palace"; Xu Liqun''s call wrong, Peng to apologize to Shanghai; the mass line, the spirit of 1958 without its negation of everything; Kang to sound Wei Wenbo, Zhang Chunqiao and Yang Yongzhi on Peng)'
      units: A, B, C, D
  - cite:
      id: cal.1966-03-30.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 67–68 (the afternoon of Mar. 30; Mao to Kang Sheng, Jiang Qing, Zhao Yimin, Wei Wenbo and Zhang Chunqiao: why must Yao Wenyuan''s article be cleared with the Propaganda Department and Peng Zhen; who shields anti-Communist intellectuals is a scholar-tyrant; overthrow the King of Hell, free the little devils; the "Center" that turns revisionist means every organ that shields bad men, the Five-Man Group too to be dissolved; more Monkey Kings to raise havoc in the heavenly palace; Qi Benyu, Guan Feng, Yin Da, Mu Xin, Yao Wenyuan and Sun Daren to be protected; Guo Moruo and Fan Wenlan to be kept; tell Enlai and Peng Zhen to be on guard against bourgeois intellectuals; the words: 3月30日下午)'
      units: A, B, C, D, E, F
  - cite:
      id: cal.1966-03-31.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 68 (Kang Sheng, back in Peking, relays the Shanghai talks to Zhou Enlai and Peng Zhen)'
      units: A
  - cite:
      id: cal.1966-03-31.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 68 (the second strong Xingtai earthquake, stronger than that of Mar. 8; Zhou, having heard Kang Sheng, flies at once to the quake zone)'
  - cite:
      id: cal.1966-04-02.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 68 (from Handan: he means to give himself to drought and relief in Hebei, back in Peking every ten days, Peng Zhen to call him back if need be; "fully agree with Chairman Mao''s instructions"; the Five-Man Group''s Outline wrong; a Secretariat meeting to discuss the instructions)'
      units: A, C
