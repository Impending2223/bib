      add: 〈一九六五年九月到一九六六年五月文化戰線上兩條道路鬥爭大事記〉 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76a); the written statements of Lu Dingyi 陸定一, Wu Lengxi 吳冷西, Hu Sheng 胡繩 and Fan Ruoyu 范若愚, 1979 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76c); [[w.xichen-shi-wuqianliede-niandai]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76d)
  - cite:
      id: cal.1966-02-04.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 58 (drafted by Xu Liqun and Yao Zhen from the meeting''s discussion, settled by Peng Zhen: "Outline report of the Five-Man Group for the Cultural Revolution on the present academic discussion")'
      units: A
  - cite:
      id: cal.1966-02-04.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 58–59 (the Outline''s content: the criticism has enlivened thought, a great struggle of Marxism-Leninism and Mao Zedong Thought against bourgeois thought, part of the struggle of the two roads, bound to spread to other fields; to break the old intellectuals'' monopoly of learning; facts and reasoning, truth before which all are equal, not like scholar-tyrants; naming in the press with care, some names to be approved; an office for academic criticism under Xu Liqun, with Hu Sheng, Wu Lengxi, Yao Zhen, Wang Li and Fan Ruoyu, Hu Sheng over its academic side)'
  - to-check:
      id: cal.1966-02-04.china-leadership-3
      add: '[[w.sheng-zhongguo-gongchan-dangde-qishi]], 486 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 59 n.77)'
  - cite:
      id: cal.1966-02-05.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 59 (Liu Shaoqi calls the standing members in Peking, who discuss and pass the Outline Peng Zhen put up and decide that Peng and others go to Wuhan to report to Mao in person)'
      units: B
  - cite:
      id: cal.1966-02-08.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 60 (Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and Tian Jiaying report; Mao objects to nothing; twice he asks whether Wu Han can be called anti-socialist; Peng: political errors, but no tie to Peng Dehuai; Mao: Wu Han need not be dismissed, he may stay vice-mayor; rectifying the left, three years on; Guan Feng''s essays: no harm, he had read He Ming''s; on the Outline only two points, no conclusion even in two months, and Guo Moruo and Fan Wenlan to make some self-criticism)'
      units: B, C, D, F
  - cite:
      id: cal.1966-05-21.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 60 n.79 (Zhou Enlai, as Bu quotes him: the Outline of Feb. 7, Mao caught it within five days; asked of the localities at last year''s work conference whether they would rebel if revisionism appeared at the Center; the "four great families" have taken many of our positions; the passage not in the *Wenku*''s text of the speech, from another version circulated in the Cultural Revolution)'
  - to-check:
