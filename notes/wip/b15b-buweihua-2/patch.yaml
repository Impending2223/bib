      item: '[[w.pu-weihua-zalan-jiu-shijie]], 77 (by Kang Sheng''s account: the sessions of Apr. 9, 11 and 12; Peng Zhen asks to speak first, he never opposed the Chairman, shielded Deng Tuo, not Wu Han, his error "letting go"; then Kang against him, from September 1965 to March 1966; then Chen Boda on his past)'
      units: B
