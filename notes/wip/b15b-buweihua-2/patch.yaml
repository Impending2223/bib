  - add:
      entry:
        id: cal.1966-01-17.china-leadership-4
        when: Jan. 17
        date: '1966-01-17'
        place: peking
        thread: china-leadership
        c: Peking 北京. Xu Liqun 许立群 calls the heads of six papers and journals, the *Renmin ribao* 人民日报, *Beijing ribao* 北京日报, *Guangming ribao* 光明日报, *Hongqi* 红旗, *Qianxian* 前线 and *Xin jianshe* 新建设, on the *Hai Rui* discussion. All will follow Mao's 毛泽东 word, but ask how to treat Wu Han's 吴晗 political errors, how far and when to print pieces on the crux, what to do as more are drawn in. Xu has a bulletin made, revises it himself, and puts the questions to the Five-Man Group 五人小组 as the six papers' views.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 55. Made public: 2008. Names: Mao Zedong.'
        src:
          rows:
          - 'w.pu-weihua-zalan-jiu-shijie 55: all'
        tags: ['polity:prc', 'vis:only:prc', 'name:mao-zedong']
  - add:
      entry:
        id: cal.1966-01-31.china-leadership-4
        when: Jan. 31
        date: '1966-01-31'
        thread: china-leadership
        c: 'Xu Liqun 许立群 sends Peng Zhen 彭真 the papers with a long letter: the criticism has done much; Peking''s 北京 papers have printed one or two pieces each on the crux; but how far to go on political error in print, Guan Feng''s 关锋 and Qi Benyu''s 戚本禹 unprinted articles tying Wu Han 吴晗 to Peng Dehuai 彭德怀 and Lushan 庐山; many want Guo Moruo 郭沫若 and Fan Wenlan 范文澜 criticized, the papers told not to; some of Wu Han''s critics, Guan Feng and Deng Tuo 邓拓, wrote essays insinuating against the Center in 1962; the plays *Hai Rui shangshu* 海瑞上疏 and *Hai Rui beiguan* 海瑞背纤 of 1959 little criticized; actors'' self-criticisms in print; fewer and better positive articles. He asks for instructions.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 56–57. Made public: 2000 ([[w.huishou-wenge-2-vols]]). To check: Gong Yuzhi 龔育之, 〈「二月提綱」和東湖之行〉, in [[w.huishou-wenge-2-vols]], I, 286–287 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 56 n.75). See [[cal.1966-01.china-leadership-3]]. Names: Peng Zhen, Peng Dehuai.'
        src:
          rows:
          - 'w.pu-weihua-zalan-jiu-shijie 56–57: all'
          - 'via x.2007.gong-yuzhi-erye-tigang-he-donghu-zhi-xing: all'
        tags: ['ok:fields-place', 'polity:prc', 'vis:only:prc', 'name:peng-zhen', 'name:peng-dehuai']
