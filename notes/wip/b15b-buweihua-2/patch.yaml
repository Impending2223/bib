  - cite:
      id: cal.1966-01-21.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 41 (as Jiang Qing tells it at the forum: wanting to talk with army men, she asked Mao, who said she had no post in the army and should go through Lin Biao first; at the Spring Festival she went to Suzhou and put her views to Lin, who agreed in full)'
      units: C
  - cite:
      id: cal.1966-02-02.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 41–42 (thirteen group showings of films and three of plays, twenty-one films of her choosing; three talks with the director, cameraman and some actors of the *Nanhai changcheng* sample; no notes allowed, only Chen Yading''s record afterward; her words, as Liu Zhijian, Li Manchun and Chen Yading recalled them: a black line opposed to Mao''s thought has held power over the arts for seventeen years and must go, the army to lead; Zhou Enlai''s "separate first, then merge" for national music wrong; the Peking committee, Zhou Yang, Lin Mohan and Xia Yan attacked; *The East Is Red* criticized)'
      units: B
  - cite:
      id: cal.1966-02-20.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 43 (at the forum''s close Liu Zhijian, with Xie Tangzhong, Li Manchun and Chen Yading, has the talks put in an outline to report to the Party committee and pass on: recorded by Li Ming of *Xinghuo liaoyuan*, revised by Chen Yading, done the evening of Feb. 20, about 3,000 characters, 〈江青同志召集的部隊文藝工作座談會紀要〉, in three parts; the words: 2月20日晚)'
  - to-check:
      id: cal.1966-02-20.china-leadership-3
      add: 〈江青同志召集的部隊文藝工作座談會紀要〉, the first draft, Feb. 20, 1966 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 43 n.63)
  - src:
      id: cal.1966-02-20.china-leadership-3
      rows:
        - 'via x.1966-02-20.army-forum-summary-first-draft: A'
  - cite:
      id: cal.1966-02.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 44 (Jiang Qing, displeased, has her secretary telephone Liu Zhijian: no good at all, it distorts her meaning; not to be passed on or sent down; he is to send men to Shanghai for her to help revise it; she has told Mao, who wants Chen Boda, Zhang Chunqiao and Yao Wenyuan to join)'
  - cite:
      id: cal.1966-03.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 45 (after Mao''s first revisions Jiang Qing, Chen Boda and Zhang Chunqiao revise it again, Liu Zhijian and Chen Yading called to Shanghai to join; done on the 14th, from 5,500 characters to about 10,000)'
      units: A
  - place:
      id: cal.1966-03.china-leadership-2
      at: shanghai
      basis: n
  - cite:
      id: cal.1966-03-14.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 45–46 (the second revision done on the 14th; Jiang Qing sends it to Mao again, the day not given)'
  - cite:
      id: cal.1966-03-17.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 46 (Mao''s ten or so small changes to the second draft: "everyone agreed it was a short training course" cut; the army''s "leading role" in the cultural revolution made "an important role"; one "Chairman Mao" made "the Party Center"; a line on holding high the great red banner cut; a closing line added, the record for leading comrades'' reference only; his comment of Mar. 17 quoted)'
      units: A
  - cite:
      id: cal.1966-03-19.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 46 (Jiang Qing writes Lin Biao asking him to examine and approve the summary)'
      units: A
  - cite:
      id: cal.1966-03-22.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 46–47 (Lin Biao''s letter quoted, to He Long, Nie Rongzhen, Chen Yi, Liu Bocheng, Xu Xiangqian and Ye Jianying, dated Mar. 22, 1966: a very good document, revised by the Chairman himself; to be carried out resolutely; it is to go to the Center for approval)'
      units: A
  - to-check:
      id: cal.1966-03-22.china-leadership-5
      add: Lin Biao 林彪, letter to the Military Commission's standing members, Mar. 22, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 47 n.66)
  - src:
      id: cal.1966-03-22.china-leadership-5
      rows:
        - 'via x.1966-03-22.lin-biao-letter-marshals-army-forum-summary-mar-22: A'
  - cite:
      id: cal.1966-03-30.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 47 (the vice-chairmen having all ringed it, Liu Zhijian drafts the request in the Commission''s name to the Center and Mao; the same day the request, the summary, Jiang Qing''s letter of Mar. 19 and Lin Biao''s letter go up, to Peng Zhen, the Secretariat''s standing secretary, Deng Xiaoping being away on the third front)'
      units: A
  - cite:
      id: cal.1966-04-01.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 48 (Apr. 1, to Mao, Zhu De, Zhou Enlai and Deng Xiaoping, Liu Shaoqi being abroad, and besides to Chen Boda and Kang Sheng; Mao''s comment the same day quoted)'
      units: A, B
  - cite:
      id: cal.1966-04-10.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 47–48 (the comment as Liu Zhijian''s men drafted it Mar. 31, quoted, 47; issued Apr. 10 as Zhongfa (66) 211 中發(66)211號, to Party committees down to county and regiment level, 48)'
      units: A
  - cite:
      id: cal.1966-04-16.china-leadership-8
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 48–49 (on his way to the enlarged Standing Committee at Hangzhou, in Shanghai, Zhou finds Liu Zhijian and Chen Yading and, the Center''s document of Apr. 10 in hand, tells them its comment rates the summary too low and must be rewritten, and dictates the points; the new comment nearly three times as long, stressing that the summary went through "three revisions by Chairman Mao himself"; issued after the recall of May 2 under the old number and date)'
      units: A, B
  - place:
      id: cal.1966-04-16.china-leadership-8
      at: shanghai
      basis: n
  - cite:
      id: cal.1966-04-18.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 51 (proposed by the paper''s heads Tang Pingzhu and Hu Chi, approved by Liu Zhijian, drafted by Chen Yading, revised by Liu and approved by Xiao Hua; title, "Hold high the great red banner of Mao Zedong Thought, actively take part in the great socialist cultural revolution"; it names an anti-Party, anti-socialist black line opposed to Mao''s thought in the arts and copies phrases of the summary)'
  - cite:
      id: cal.1966-04-19.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 51 (the *Renmin ribao* reprints it in full on its front page)'
  - add:
      entry:
        id: cal.1966-02-01.china-leadership-7
        when: Feb. 1
        date: '1966-02-01'
        thread: china-leadership
        c: 'Xiao Hua 萧华, head of the General Political Department 总政治部, to the men going to Jiang Qing''s 江青 forum, the day before they leave: she has lived, worked and studied with the Chairman for decades; her views embody his thought; listen humbly and carry them out.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 43 n.63. Made public: 2008. To check: 〈江青同志召集的部隊文藝工作座談會紀要〉, the first draft, Feb. 20, 1966 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 43 n.63). Names: Jiang Qing.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 43 n.63: all'
            - 'via x.1966-02-20.army-forum-summary-first-draft: all'
        tags: [polity:prc, vis:only:prc, name:jiang-qing]
  - add:
      entry:
        id: cal.1966-02.china-leadership-9
        when: Feb., during the forum
        date: 1966-02
        at: after 1966-02-02
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Yang Chengwu 杨成武, acting chief of the General Staff, passing through, to the forum''s army men: Jiang Qing 江青 is strong in politics and in art; do as she says; a rare chance; come when she calls.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 43 n.63. Made public: 2008. To check: 〈江青同志召集的部隊文藝工作座談會紀要〉, the first draft, Feb. 20, 1966 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 43 n.63). See [[cal.1966-02-02.china-leadership]]. Names: Jiang Qing.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 43 n.63: all'
            - 'via x.1966-02-20.army-forum-summary-first-draft: all'
        tags: [polity:prc, vis:only:prc, name:jiang-qing]
  - add:
      entry:
        id: cal.1966-02-26.china-leadership-3
        when: Feb. 26–28
        date: '1966-02-26'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Boda 陈伯达, Jiang Qing 江青, Zhang Chunqiao 张春桥 and Chen Yading 陈亚丁 revise the forum''s summary. Chen Boda: put in the 1930s, the black line coming from the Shanghai underground Party''s Wang Ming line; and a passage on the arts'' achievements, Jiang Qing''s model operas and ballets. Jiang Qing praises him. The summary grows to over 5,500 characters, with much not said at the forum; its plan and title unchanged.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 44. Made public: 2008. See [[cal.1966-02-02.china-leadership]]. Names: Chen Boda, Jiang Qing, Zhang Chunqiao.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 44: all'
        tags: [polity:prc, vis:only:prc, name:chen-boda, name:jiang-qing, name:zhang-chunqiao]
  - add:
      entry:
        id: cal.1966-03-01.china-leadership-7
        when: Mar. 1
        date: '1966-03-01'
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yading 陈亚丁 brings back the summary as Jiang Qing 江青 approved it and reports the revision to Liu Zhijian 刘志坚 and the others, who find it well done, the 1930s making the black line clearer, and decide to pass it down in that form.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 44–45. Made public: 2008. See [[cal.1966-02-02.china-leadership]]. Names: Jiang Qing.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 44–45: all'
        tags: [polity:prc, vis:only:prc, name:jiang-qing]
  - add:
      entry:
        id: cal.1966-03.china-leadership-11
        when: Mar., before the 14th
        date: 1966-03
        at: before 1966-03-14
        thread: china-leadership
        c: Jiang Qing 江青, without asking Liu Zhijian 刘志坚 and the others, has the revised summary printed and sent to Mao 毛泽东.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 45. Made public: 2008. See [[cal.1966-02-02.china-leadership]]. Names: Jiang Qing, Mao Zedong.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 45: all'
        tags: [polity:prc, vis:only:prc, name:jiang-qing, name:mao-zedong]
  - add:
      entry:
        id: cal.1966-03.china-leadership-12
        when: Mar., before the 14th
        date: 1966-03
        at: before 1966-03-14
        thread: china-leadership
        c: 'Mao 毛泽东 revises the summary in eleven places. To its title he adds "entrusted by Comrade Lin Biao" 林彪同志委托. He adds that once this black line is gone others will come and must be fought, and that the Party had grasped single questions, not the whole, leaving the ground to the black line; he cuts praise of himself, his works "enough for several hundred years" made "for a long time", "Marxism-Leninism and" put before "Mao Zedong Thought". Then: let Comrade Boda 伯达 take part, and fill it out.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 45. Made public: 1989. To check: Jiang Qing 江青, letter to Lin Biao 林彪, Mar. 19, 1966, as Liu Zhijian 劉志堅, 〈《部隊文藝工作座談會紀要》產生前後〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 30 (1989), 25, quotes it (cited by [[w.pu-weihua-zalan-jiu-shijie]], 45 n.64); Gong Yuzhi 龔育之, 〈幾番風雨憶周揚〉, in [[w.yi-zhou-yang]], 248 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 45 n.65). See [[cal.1966-03.china-leadership-11]]. Names: Mao Zedong, Lin Biao, Chen Boda.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 45: all'
            - 'via x.1966-03-19.jiang-qing-letter-lin-biao-army-forum-summary-mar-19: all'
        tags: [polity:prc, vis:only:prc, name:mao-zedong, name:lin-biao, name:chen-boda]
  - add:
      entry:
        id: cal.1966-03.china-leadership-13
        when: Mar., after the 17th
        date: 1966-03
        at: after 1966-03-17
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Jiang Qing 江青, Mao''s comment in hand, calls Liu Zhijian 刘志坚, Li Manchun 李曼村, Xie Tangzhong 谢镗忠 and Chen Yading 陈亚丁 back and goes over the final text with Zhang Chunqiao 张春桥. Liu asks that "organize anew the ranks of art" read "rectify" 整顿 for "organize" 组织, the army''s ranks being sound; she refuses: the Chairman has agreed.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 46. Made public: 2008. See [[cal.1966-03-17.china-leadership-2]]. Names: Jiang Qing, Zhang Chunqiao.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 46: all'
        tags: [polity:prc, vis:only:prc, name:jiang-qing, name:zhang-chunqiao]
  - add:
      entry:
        id: cal.1966-03-31.china-leadership-7
        when: Mar. 31
        date: '1966-03-31'
        thread: china-leadership
        c: 'Peng Zhen''s 彭真 office asks the General Political Department 总政治部 to draft the Center''s comment forwarding the army forum''s summary. Liu Zhijian 刘志坚, with Li Manchun 李曼村, Xie Tangzhong 谢镗忠 and Chen Yading 陈亚丁, drafts it and sends it to Peng at once: a very good, very important document; it holds high Mao Zedong Thought; its principles fit not the army alone but the localities and the whole front of art; every Party committee to study and carry it out.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 47. Made public: 1989. To check: Liu Zhijian 劉志堅, 〈《部隊文藝工作座談會紀要》產生前後〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 30 (1989), 34 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 47 n.67). See [[cal.1966-03-30.china-leadership-3]]. Names: Peng Zhen.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 47: all'
            - 'via x.1989.liu-zhijian-budui-wenyi-gongzuo-zuotanhui-jiyao-chansheng-qianhou: all'
        tags: [polity:prc, vis:only:prc, name:peng-zhen]
  - add:
      entry:
        id: cal.1966-04-03.china-leadership-6
        when: Apr. 3
        date: '1966-04-03'
        thread: china-leadership
        c: Liu Zhijian 刘志坚 and the others, finding their comment too general, draft a second in the Center's name, adding the meaning of the socialist cultural revolution, Mao's long attention to class struggle on the cultural front, and his thought on art as the revolution's direction.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 48. Made public: 1996 ([[w.fengyu-zhengcheng]]). To check: [[w.fengyu-zhengcheng]], 240 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 48 n.68). See [[cal.1966-03-31.china-leadership-7]]. Names: Mao Zedong.'
        src:
          rows:
            - 'w.pu-weihua-zalan-jiu-shijie 48: all'
        tags: [polity:prc, vis:only:prc]
  - add:
      entry:
        id: cal.1966-04-04.china-leadership-12
        when: Apr. 4
        date: '1966-04-04'
        thread: china-leadership
        c: The second draft comment on the army forum's summary goes to Peng Zhen 彭真, who holds it back and does not use it.
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 48. Made public: 1996 ([[w.fengyu-zhengcheng]]). To check: [[w.fengyu-zhengcheng]], 240 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 48 n.68). See [[cal.1966-04-03.china-leadership-6]]. Names: Peng Zhen.'
        src:
