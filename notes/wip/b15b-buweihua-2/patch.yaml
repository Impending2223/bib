      item: '[[w.pu-weihua-zalan-jiu-shijie]], 73–74 (Mao''s words quoted: Marx and Engels did not foresee their party taken by their heirs, nor Lenin Khrushchev; who knows the day revisionism takes Peking, those who back us now may turn; a second possibility, a partial split; "we are at dusk", so while he has breath he will deal with bourgeois restoration)'
