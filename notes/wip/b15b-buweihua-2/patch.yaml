        when: July 7
        date: '1966-07-07'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京, the Wutaishan stadium 五台山体育场. Jiang Weiqing 江渭清, at a rally said to be fifty thousand, reports "Hold high the great red banner of Mao Zedong Thought" 高举毛泽东思想伟大红旗，把无产阶级文化大革命更加广阔、更加深入地开展起来: the cultural revolution the best school of class struggle; leaders not to fear disorder, to break the "bourgeois order", to drag out the bourgeois inside the Party and all monsters and demons.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 96. To check: [[w.jiang-weiqing-qishi-nian-zhengcheng]], 517–519 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 96 n.25). See [[cal.1966-07.china-leadership-29]].'
