  - cite:
      id: cal.1966-03-11.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 61–62 (the evening of Mar. 11 Xu Liqun asks Peng Zhen how to answer the questions of Yang Yongzhi, head of the Shanghai committee''s propaganda department, sent by Zhang Chunqiao to sound out Peking: whom "scholar-tyrant" means, Peng: no one in particular, whoever has the scabs; whether Shanghai may criticize films, *Nü tiaoshui duiyuan* among them, Peng: ask Zhang Chunqiao and Yang Yongzhi; whether weighty articles go to the Department, Peng: Shanghai printed Yao Wenyuan''s article without a word, where was its Party spirit; Zhang, told: the Outline aims at Yao Wenyuan, that is, at Chairman Mao; the words: 3月11日晚)'
      units: A, B
  - cite:
      id: cal.1966-03-11.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 62 (Xu Liqun telephones Peng''s answers to Yang Yongzhi that night, 連夜; Yang returns at once to Shanghai to report)'
      units: A
  - cite:
      id: cal.1966-03-08.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 62–63 (the earthquake at 5:29 a.m., magnitude 6.8, intensity about 9 at the epicenter)'
  - cite:
      id: cal.1966-03-17.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 63–64 (of the seven standing members Mao, Liu Shaoqi, Zhou Enlai and Lin Biao attend, Deng Xiaoping on leave in the third front; Politburo members, the six regional secretaries and Center department heads; no agenda given beforehand, only whether to send a delegation to the CPSU''s Twenty-third Congress; no formal report, chiefly Mao''s talk: not to attend the congress, a letter instead; the Center "a figurehead republic", to hold policy only, the factories taken up to go back to the localities; the meeting tense, Li Xuefeng recalls; Luo Ruiqing exposed, Yang Shangkun and Lu Dingyi named)'
      units: A, C
