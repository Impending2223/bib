        date: '1965-11'
        at: after 1965-11-10
        thread: china-leadership
        c: 'Zhou Yang 周扬, after Yao Wenyuan''s 姚文元 article, has the Propaganda Department''s 中宣部 science office 科学处 organize three articles against Wu Han 吴晗, and joins in settling them: one on *Hai Rui baguan* 海瑞罢官 by Gong Yuzhi 龚育之 and others of the office; one on Wu Han''s view of history by Qi Benyu 戚本禹 of *Hongqi* 红旗''s history group; one on his inheritance of morality by Guan Feng 关锋 of *Hongqi*''s editorial board.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 54. Made public: 2008. Names: Yao Wenyuan.'
