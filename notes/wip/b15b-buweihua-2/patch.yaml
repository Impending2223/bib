  - add:
      entry:
        id: cal.1966-05-24.china-leadership-3
        when: May 24
        date: '1966-05-24'
        thread: china-leadership
        c: 'The Center 中共中央 issues its "Explanation of the errors of Comrades Lu Dingyi and Yang Shangkun" 关于陆定一同志和杨尚昆同志错误问题的说明: Lu Dingyi 陆定一 closely tied to the anonymous letters of the "active counter-revolutionary" Yan Weibing 严慰冰; he opposed Mao Zedong Thought, called its study pragmatism, vulgarization, oversimplification; on the cultural revolution at one with Peng Zhen 彭真. Of Yang Shangkun 杨尚昆: he set up listening devices behind the Center''s back and taped Mao and the standing members; gave out secret files to be copied; was close to Luo Ruiqing 罗瑞卿. It calls Lin Biao 林彪 "Comrade Mao Zedong''s closest comrade-in-arms".'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 92–93. Made public: 2008. Printed for internal circulation: [[w.wenhua-dageming-yanjiu-ziliao]] (1988). To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 24–25 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 93 n.23). See [[cal.1966-05-23.china-leadership]]. Names: Lu Dingyi, Peng Zhen, Luo Ruiqing, Lin Biao, Mao Zedong.'
        src:
          rows:
          - 'w.pu-weihua-zalan-jiu-shijie 92–93: all'
        tags: ['polity:prc', 'vis:only:prc', 'name:lu-dingyi', 'name:peng-zhen', 'name:luo-ruiqing', 'name:lin-biao', 'name:mao-zedong']
