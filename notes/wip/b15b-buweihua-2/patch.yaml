        c: 'Shanghai 上海. Jiang Qing 江青, Mao''s 毛泽东 comment in hand, calls Liu Zhijian 刘志坚, Li Manchun 李曼村, Xie Tangzhong 谢镗忠 and Chen Yading 陈亚丁 back and goes over the final text with Zhang Chunqiao 张春桥. Liu asks that "organize anew the ranks of art" read "rectify" 整顿 for "organize" 组织, the army''s ranks being sound; she refuses: the Chairman has agreed.'
