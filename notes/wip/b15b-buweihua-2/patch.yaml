        date: '1966'
        at: before 1966-08
        thread: china-leadership
        c: 'As a count of the time has it, by Jiang Weiqing''s 江渭清 account: in Jiangsu 江苏, after the Wutaishan rally, 57 of the province''s 65 offices in the movement, 400,000 posters up, Wu Tianshi 吴天石, head of the education department, and others named bourgeois; all 32 colleges have had their power seized, 648 senior and technical middle schools stopped classes to "rebel", 404 struggled in Nanjing''s 南京 19 colleges; the 13 counties, over 280 communes and over 650 units in the four cleanups turned to the cultural revolution.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 96–97. Made public: 1996 ([[w.jiang-weiqing-qishi-nian-zhengcheng]]). To check: [[w.jiang-weiqing-qishi-nian-zhengcheng]], 520–521 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 97 n.26). See [[cal.1966-07-07.china-leadership-7]].'
