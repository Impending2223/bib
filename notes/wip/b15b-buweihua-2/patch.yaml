  - cite:
      id: cal.1966-03-20.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 63–64 (the day not given: since liberation the intellectuals taken in whole, for good and ill; learning and education in fact held by the bourgeoisie and petty bourgeoisie; Wu Han and Jian Bozan Party members against the Party, in truth Guomindang; *Qianxian* their front; who holds the schools, papers and publishers; Guo Moruo and Fan Wenlan to be kept, no others; young men to challenge them by name; Yao Wenyuan, Qi Benyu and Yin Da the new authorities; the Propaganda Department not to become the Rural Work Department)'
      units: B, F, G
