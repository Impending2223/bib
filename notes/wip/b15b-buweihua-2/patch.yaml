  - edit:
      id: cal.1966-03-11.china-leadership-3
      base: 8528cddf
      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 456–57; [[w.yang-jisheng-tiandi-fanfu]], I, 123 (Mar. 11: Yang Yongzhi 楊永直, head of the Shanghai committee''s propaganda department, telephones Xu Liqun 許立群 to ask whom the Outline is aimed at and who the leftists are; Zhang Chunqiao 張春橋, told of the answer, says the Propaganda Department and the Peking committee oppose Yao Wenyuan''s article, the Outline''s point being Mao); [[w.peng-zhen-nianpu-1902]], IV, 472–473 (Mar. 11, 1966, evening; Xu Liqun reports that Yang Yongzhi 杨永直, head of the Shanghai propaganda department, came to ask whom the "scholar-tyrants" of the outline meant; Peng by telephone: no one in particular, like Ah Q, whoever has the scar; why did the *Wenhui bao* print Yao''s article without a word to the Propaganda Department or the Five-Man Group? where was the Shanghai committee''s Party spirit? Xu passes it on to Yang by telephone). Made public: 1997. To check: *Yijiuliuwu nian jiuyue dao yijiuliuliu nian wuyue wenhua zhanxian shang liang tiao daolu douzheng dashiji* 《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》 (annex to the Circular of May 16, 1966 「五一六通知」) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 123 n.39). Names: Peng Zhen, Zhang Chunqiao, Yao Wenyuan, Mao Zedong. Check: the day; the text has early March, the table Mar. 11 (III, 456–57).'
        time_range:
          - 1966-03-11T11:00Z
          - 1966-03-11T14:00Z
        time_band: evening
        time_zone: Asia/Shanghai
