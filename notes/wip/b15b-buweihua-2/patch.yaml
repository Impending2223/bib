        when: Mar. 1
        date: '1966-03-01'
        thread: china-leadership
        c: 'Xu Liqun 许立群, of Guan Feng''s 关锋 questions: certainly not to be tied to Lushan 庐山; the Chairman nodded to it face to face. Hu Sheng 胡绳: Guan Feng should ask himself why the Chairman, having said Wu Han 吴晗 must be dismissed, said on second thought he need not be; the Chairman stands high; Guan Feng thinks too sharply.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 61. Made public: 2000 ([[w.huishou-wenge-2-vols]]). To check: Gong Yuzhi 龔育之, 〈「二月提綱」和東湖之行〉, in [[w.huishou-wenge-2-vols]], I, 305 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 61 n.82). See [[cal.1966-02.china-leadership-10]].'
        src:
