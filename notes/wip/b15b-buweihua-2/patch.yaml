        date: '1963'
        at: before 1963-12
        thread: china-leadership
        c: 'Zhou Yang 周扬, by his account, tells Mao 毛泽东 the cultural work has many problems. Mao: "I am to blame too, for not grasping it"; he has grasped one matter after another, not the whole; "I will grasp it!" "Better to get it wrong and put it right."'
