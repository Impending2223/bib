        c: 'The Center 中共中央 reissues the army forum''s summary with its new comment, under the old number, Zhongfa (66) 211 中发(66)211号, still dated Apr. 10. The comment: the arts a front of the struggle of two classes and two roads; Mao has always led it; most committees have grasped it poorly; the summary, "revised three times by Chairman Mao himself", a very good, very important document; to the army down to regiment committees, the localities to county committees and the cultural organs.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 48–50. Made public: 1989. To check: Liu Zhijian 劉志堅, 〈《部隊文藝工作座談會紀要》產生前後〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 30 (1989), 36–37 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 50 n.69). See [[cal.1966-05-02.china-leadership-4]]. Names: Mao Zedong.'
