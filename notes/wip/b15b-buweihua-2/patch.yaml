      item: '[[w.pu-weihua-zalan-jiu-shijie]], 53–54 (the request of Aug. 14, made at Kang Sheng''s demand, "On showing and criticizing in public *Beiguo jiangnan* and *Zaochun eryue*"; Mao''s comment quoted: shown not only in some big cities but in tens to over a hundred middle cities, these revisionist materials made public; perhaps there are others to be criticized)'
      units: B
  - cite:
      id: cal.1964-12.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 54 n.74 (by Wu Lengxi''s account: at the end of 1964 Jiang Qing calls Zhou Yang, Xu Liqun, Lin Mohan, Yao Zhen and Wu Lengxi and asks the Department to have the press criticize ten films, *Buye cheng* and *Linjia puzi* among them; they do not agree; she goes to Shanghai, the Shanghai papers criticize them, others follow, and under that pressure the Department has the *Renmin ribao* criticize the two; Bu doubts the account, the Department having reported in August on showing "poisonous weeds")'
      units: A, B
