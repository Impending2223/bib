  - cite:
      id: cal.1966-04-09.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 68–69 (Apr. 9 to 12, Peking: Kang Sheng conveys Mao''s talks of late March; Peng Zhen says he never has opposed, does not and will not oppose Chairman Mao; Kang goes through Peng''s conduct in the academic criticism, Chen Boda his line from the democratic revolution on; Zhou Enlai and Deng Xiaoping: Peng''s wrong line opposed to Mao''s thought, against Mao; decided, a Party notice withdrawing and criticizing the Outline, and a drafting group for the cultural revolution''s documents)'
      units: B, C
  - cite:
      id: cal.1966-04-14.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 69 (Mao, not content with a technical notice, wants a political one; Kang Sheng, Chen Boda and the drafting group to go to Shanghai and draft it with Jiang Qing and Zhang Chunqiao; the group, Chen Boda its head, Kang Sheng, Jiang Qing, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Wu Lengxi, Yin Da, Mu Xin and Chen Yading; each draft sent to Hangzhou, revised by Mao and sent back, seven times from Apr. 14 to the month''s end)'
  - cite:
      id: cal.1966-04-10.china-leadership-5
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 69 (from Apr. 10 to 15 Peng Zhen calls the Peking committee''s standing members again and again, conveys Mao''s criticism of the Outline and of the committee, says the "bad men" shielded include the Three-Family Village, and has the city''s Party bodies criticize Wu Han, Deng Tuo and Liao Mosha)'
      units: A
  - cite:
      id: cal.1966-04-16.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 69 (three pages of material on the Three-Family Village and *Yanshan yehua*, with an editors'' note of *Qianxian* and the *Beijing ribao* settled by Peng Zhen: Wu Han''s reactionary core "dismissal" and "returning land"; Liao Mosha a leading general against the Party; Deng Tuo using the past against the present; the note''s self-criticism, the papers having printed the pieces and not criticized them in time)'
      units: A
  - cite:
      id: cal.1966-04-19.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 70 (the capital''s papers not to reprint the *Beijing ribao*''s note and material, the Peking committee''s self-criticism being false; the colleges, offices and units to stop the measures it had set going)'
      units: A
  - cite:
      id: cal.1966-04-16.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 70–71 (the second Hangzhou meeting, "to lift the lid on Peng Zhen"; Liu Shaoqi, back at Kunming Apr. 19, called by the General Office, reaches Hangzhou Apr. 20 and presides, Zhou Enlai in fact chairing; decided, the Outline and the Five-Man Group withdrawn, a new Cultural Revolution Group set up)'
      units: A, B, C
  - cite:
