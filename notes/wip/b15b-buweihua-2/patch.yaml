        date: '1966-04-08'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The General Political Department 总政治部 opens the all-army conference on creative work 全军创作工作会议 (to June 11). On Jiang Qing''s 江青 Shanghai model, "watch films, find the black line": sixty-four films criticized, *Zhuang zhuangding*, *Bing lin chengxia*, *Hong ri*, *Nifeng qianli* and *Nuchao* among them, as beautifying class enemies, playing up the sufferings of war, writing the wrong line. Six who doubted or resisted the summary criticized in the full meetings, fifty-six more in small ones.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 50. Made public: 2008. Names: Jiang Qing.'
