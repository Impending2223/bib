  - cite:
      id: cal.1966-04-28.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 71 (Mao''s two talks of Apr. 28 and 29 with Kang Sheng and others, their gist: not a needle gets into Peking; Peng would remake the Party to his own thought and has made his own fall; Monkey to raise havoc in the heavenly palace; Communists who guard the Jade Emperor; attack his errors to the end; such men fall at a flick of the little finger; tell the Shanghai comrades not to worry; his nature hidden thirty years)'
      units: B, C, D, E
  - cite:
      id: cal.1966-05-05.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 72 n.91 (the "peeling of bamboo shoots": two possibilities, a counter-revolutionary dictatorship and restoration, or peeling layer by layer, the bad cut away; from 1921 to 1966, forty-six years, scores of Central Committee members cast out, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Zhang Wentian, Gao Gang, Rao Shushi, Peng Dehuai, Luo Ruiqing, Peng Zhen and others, and some still beside us not found out)'
