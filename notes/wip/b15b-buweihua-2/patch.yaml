  - edit:
      id: cal.1966-04-02.china-leadership
      base: b3f1a157
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 2, 1966. [[w.macfarquhar-maos-last-revolution]], 32 (Kang Sheng''s report of Mar. 31; Zhou telephones Mao); [[w.yang-jisheng-tiandi-fanfu]], I, 124 (Zhou Enlai 周恩來 writes Mao from Handan 邯鄲 that he entirely agrees with Mao''s instructions, that the Group''s outline is wrong, and that he will call a Secretariat meeting to discuss them); [[w.peng-zhen-nianpu-1902]], IV, 478 (Apr. 2, 1966, evening; Zhou''s letter to Mao and the Secretariat: agreed with Peng Zhen and Kang Sheng, a Secretariat meeting to raise high the banner of the proletarian cultural revolution, criticize reactionary thought in literature, history and philosophy and expose those authorities'' bourgeois stand, a Center notice to be drafted for Mao; the Five-Man Group''s report wrong, an enlarged meeting of the group with Shanghai and Peking comrades to revise it thoroughly or rewrite it); [[w.jian-zhou-enlai]], 537 (on the evening of Apr. 2, two days on, Zhou busy with the Xingtai earthquake: "by consulting with Peng Zhen and Kang Sheng" he will "follow the chairman''s instructions and hold high the banner of proletarian cultural revolution"; "a question concerning the seizure of the leadership position in the cultural sphere"; the Group of Five''s report "is wrong," to be replaced by another Center notice for Mao''s approval). Made public: 2006. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 10–11 (cited by [[w.macfarquhar-maos-last-revolution]], 32 n.3). Names: Zhou Enlai, Mao Zedong, Kang Sheng, Peng Zhen.'
