        thread: china-leadership
        c: 'The Center reissues the army forum''s summary with its new comment, under the old number, Zhongfa (66) 211 中发(66)211号, still dated Apr. 10. The comment: the arts a front of the struggle of two classes and two roads; Mao has always led it; most committees have grasped it poorly; the summary, "revised three times by Chairman Mao himself", a very good, very important document; to the army down to regiment committees, the localities to county committees and the cultural organs.'
