  - cite:
      id: cal.1966-03-10.china-leadership-4
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 65–66 (the standing members in Peking take up again whether to send a delegation to the CPSU''s Twenty-third Congress; Liu Shaoqi: the CPSU''s own congress, not a meeting of fraternal parties, to go or not no great matter, a courtesy; Bu has the meeting after the Hangzhou meeting of Mar. 17–20 and finds the order hard to explain, the Center having written the CPSU on Mar. 22 that it would send none, 65 n.88)'
  - variant: {id: cal.1966-03-10.china-leadership-4, unit: E, witness: w.pu-weihua-zalan-jiu-shijie, reads: 'Kang Sheng against going, Peng Zhen for; their telegram to Mao inclines to going (the meeting after the Hangzhou meeting of Mar. 17–20)', at: 65–66}
  - add:
      entry:
        id: cal.1966-03.china-leadership-18
        when: Mar., after the 20th
        date: '1966-03'
        at: after 1966-03-20
        thread: china-leadership
        c: 'The standing members in Peking 北京, differing with the Japanese Communist Party''s 日本共产党 delegation under Miyamoto Kenji 宫本显治 over naming the CPSU in the joint communique 联合公报, would meet its difficulties: the communique to speak only of opposing revisionism together. They send Kang Sheng 康生 to Shanghai 上海 to report to Mao 毛泽东 on this and on the Twenty-third Congress.'
        n: '[[w.pu-weihua-zalan-jiu-shijie]], 66. Made public: 2008. See [[cal.1966-03-10.china-leadership-4]]. Names: Kang Sheng, Mao Zedong.'
        src:
          rows:
          - 'w.pu-weihua-zalan-jiu-shijie 66: all'
        tags: ['polity:prc', 'vis:only:prc', 'name:kang-sheng', 'name:mao-zedong', 'ok:fields-place']
  - cite:
      id: cal.1966-03-27.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 66 (at Shanghai, after Kang Sheng''s report, Mao reads the draft of the joint communique with the Japanese Communist Party 日本共产党: "a notice with no head" 无头告示, afraid of ghosts, the banner unclear, neither painful nor itching; he revises it himself, naming the CPSU and making the fight against modern revisionism centered on the CPSU''s leaders the chief task; the communique falls through)'
      units: A
  - variant:
