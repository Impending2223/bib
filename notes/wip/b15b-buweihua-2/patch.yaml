  - cite:
      id: cal.1966-05-04.china-leadership
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 74 (May 4 to 26, Peking; Mao away, the meeting run on the Hangzhou meeting''s plan and his directions on its agenda and papers; to give the Cultural Revolution legal standing; Liu Shaoqi presiding, Kang Sheng reporting to Mao; Politburo members and alternates, heads of departments and the drafting group, the regional and provincial heads hardly any; the first three days a briefing forum, chiefly Kang Sheng, Zhang Chunqiao and Chen Boda)'
      units: A, B, C
  - cite:
      id: cal.1966-05-05.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 75–77 (the afternoon of May 5 and the morning of May 6, eight hours; the time is the first day''s; Mao''s directions since September 1962 and November 1965 on Peng Zhen and Lu Dingyi and on dissolving the Propaganda Department and the Peking committee; the Notice''s drafting; Lin Biao calls it the most important document since liberation; by Kang''s account: Shanghai under Ke Qingshi from 1962 against Peking and the Department; Mao''s letter of Dec. 12, 1963 to Peng Zhen and Liu Ren; Peng''s "hard resistance" Nov. 10 to Dec. 20, 1965; Peng alone with Mao Dec. 23; four days at Mao''s, Feb. 7 to 10, Wang Renzhong there; a night with Zhou Enlai before Shanghai, three talks with Mao there; the Secretariat Apr. 9, 11 and 12; a meeting at Mao''s Apr. 22)'
      units: A, B
