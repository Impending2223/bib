  - cite:
      id: cal.1965-12-29.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 54–55 (organized by the Propaganda Department, guided and approved by Zhou Yang; it brands Wu Han "anti-Marxist" and "anti-socialist" and *On Hai Rui* and the play a portrait and paean of right opportunists dismissed from office; it criticizes Tian Han and Meng Chao in passing; written by Gong Yuzhi, Lin Ganquan, Xing Bisi and Dai Yi)'
  - cite:
      id: cal.1966-01.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 55 (Xu Liqun, not daring to publish the "crux" pieces at once, Fang Qiu''s, Qi Benyu''s on *Hai Rui scolds the emperor* and *Hai Rui baguan*, Guan Feng''s with Lin Jie, and Guan Feng''s on moral inheritance, has excerpts made and sends them to the Five-Man Group for instructions, with a letter to Peng Zhen, Lu Dingyi, Kang Sheng and Wu Lengxi; Guan Feng had refused to cut his likening of Wu Han to Chiang Kai-shek''s New Life Movement, and the Department sent up his earlier essay on moral inheritance, signed He Ming 何明)'
      units: A
  - cite:
      id: cal.1966-01-31.china-leadership-3
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 56 (Guo Moruo''s letter, to Zhang Jingfu, the Academy''s party secretary: deaf, his sight failing, he has not been worthy of his posts and long meant to resign all of them, president of the Academy, head of its philosophy and social science division, director of the Institute of History, president of the University of Science and Technology; among the papers Xu Liqun sent Peng, with the Department''s note that many ask that Guo Moruo, Fan Wenlan and others be criticized)'
  - cite:
      id: cal.1966-02-01.china-leadership-6
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 58 (Peng Zhen sends Xu Liqun''s letter and the seven papers to Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Lu Dingyi, Kang Sheng and Wu Lengxi, with a note: the Five-Man Group to meet the day after next and then put its views to the Center)'
  - cite:
      id: cal.1966-02-05.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 58 (Mao to Jiang Qing: "Having read these papers, keep them with you for now.")'
  - cite:
      id: cal.1966-02-03.china-leadership-2
      item: '[[w.pu-weihua-zalan-jiu-shijie]], 58 (Peking; present, Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Yao Zhen, Wang Li, Fan Ruoyu, Liu Ren and Zheng Tianxiang; Peng, presiding: inquiry shows Wu Han had no tie to Peng Dehuai, nor the play; his question academic; criticism not to go too far; he rejects Guan Feng''s charges against Deng Tuo, with Liu Ren and Zheng Tianxiang as witnesses; the left too to be rectified, not to be "scholar-tyrants"; Lu Dingyi on the lessons of Stalin''s time; Kang Sheng voices no difference; the chronicle of the May 16 Circular''s claim of two opposed views at the meeting exaggerated, by Lu Dingyi''s, Wu Lengxi''s, Hu Sheng''s and Fan Ruoyu''s statements of 1979, 58 n.76)'
  - to-check:
