        thread: china-leadership
        c: 'Hangzhou 杭州. Mao 毛泽东 likens bringing down Luo Ruiqing 罗瑞卿, Peng Zhen 彭真 and the others to peeling bamboo shoots: a "peeling policy", the outer leaves stripped and a good shoot left; leaders at every level to be peeled layer by layer, batch by batch.'
