  - edit:
      id: cal.1966-02-02.china-leadership
      base: fcf572be
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 2, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 9 (Feb. 2–20, 1966; the forum; Jiang Qing''s attack on Zhou''s call for "separate first, then merge" and on *The East Is Red*; the summary and its issue Apr. 10, note 1); [[w.macfarquhar-maos-last-revolution]], 30–31 (the forum and its summary); [[w.macfarquhar-origins-of-the-cultural]], III, 451 (Liu Zhijian and colleagues fly to Shanghai Feb. 2; eight talks with Liu, four group discussions, thirteen films and three operas; the table has the forum Feb. 2–10 and 16–20); [[w.mao-zedong-zhuan]], VI, ch. 74 n.27 (Jiang Qing 江青, with Lin Biao''s 林彪 consent, Feb. 2 to 20 at Shanghai, the forum on army literary and artistic work: few attended, besides films and plays chiefly Jiang''s talk; the summary written up after, Jiang unhappy with the first draft, given to Zhang Chunqiao 张春桥 to revise, Chen Boda 陈伯达 joining, then sent to Mao; its claim of a ''black line'' ruling the cultural front for sixteen years and call for a socialist revolution on that front, n.27). [[w.yang-jisheng-tiandi-fanfu]], I, 128 (Jiang Qing''s forum on army literary and artistic work held in Shanghai 上海 at Lin Biao''s 林彪 commission, Feb. 2 to 30 as the page prints it 2月2日到30日; Mao has Chen Boda go to Shanghai to revise the summary with Zhang Chunqiao; Mao revises it three times and adds passages; it says the arts have since the founding largely not carried out Mao''s line, a black line ruling them, and calls for a socialist revolution on the cultural front); [[w.peng-zhen-nianpu-1902]], IV, 465 (Feb. 2–20, 1966; Jiang Qing, with Lin Biao''s consent, holds the forum on army literature and art at Shanghai); [[w.jian-zhou-enlai]], 533 (the summary, revised with Mao''s input: since 1949 "fierce class struggles on the cultural front," "an anti-Party and antisocialist black line"; "a great socialist revolution on the cultural front"; Lin Biao no part in it); [[w.pu-weihua-zalan-jiu-shijie]], 40 (Feb. 2 to 20, with Lin Biao''s support; Liu Zhijian, deputy head of the General Political Department, Li Manchun, Xie Tangzhong and Chen Yading there; by Liu''s account Jiang Qing alone decided everything; she talks with Liu alone eight times, with the group four times). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). Check: the forum''s end; Yang prints "Feb. 2 to 30" (I, 128). To check: Summary of the Army Forum on Literature and Art Work called by Jiang Qing at the behest of Lin Biao (Zhongfa [1966] 211), in [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 604–610 (cited by [[w.macfarquhar-maos-last-revolution]], 31 n.69); [[w.jin-1949-1989-niande-zhongguo]], 618–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.120); [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 604 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.121); Mao Zedong 毛泽东, words added in revising the draft summary of the forum on army literary and artistic work convened by Comrade Jiang Qing 《江青同志召开的部队文艺工作座谈会纪要》 (manuscript 手稿), Mar. 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.27); [[w.zhongguo-gongchandang-lishi-dashiji]], 307 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 40 n.62); Liu Zhijian 劉志堅, 〈《部隊文藝工作座談會紀要》產生前後〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 30 (1989), 1–44; Ge Hengjun 葛恒軍, 〈1966年部隊文藝工作座談會及其會議紀要考析〉, in [[w.zhongguo-gongchandang-zhongda-shishi]], IV, 1936–1943 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 39 n.61a, n.61b). Names: Jiang Qing, Lin Biao, Zhang Chunqiao, Chen Boda.'
  - edit:
      id: cal.1966-03-19.china-leadership-2
      base: 7a60caeb
      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 456; [[w.yang-jisheng-tiandi-fanfu]], I, 128 (Mar. 19: Jiang Qing writes Lin Biao asking him to approve the summary 請林彪審批; Lin writes the Military Commission''s vice-chairmen praising it highly, the day not given). Made public: 1997. Names: Jiang Qing, Lin Biao.'
  - edit:
      id: cal.1966-04-10.china-leadership
      base: 1397d9f5
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, early Apr. 1966 (the entry "4月上旬", which gives the issue, Apr. 10) and note 22. [[w.macfarquhar-maos-last-revolution]], 30–31 (issued Apr. 10 as Zhongfa [1966] 211); [[w.jianguo-yilai-mao-zedong]], XVIII, 230, 234 (Apr. 1966; Mao''s note, "Read, agreed. Back to Peng Zhen," on Peng''s draft of the Center''s instruction forwarding the summary, sent Apr. 1; note 1: the Center forwarded the summary Apr. 10; withdrawn May 3, 1979, at the General Political Department''s request; not the wording of the Center''s note); [[w.macfarquhar-origins-of-the-cultural]], III, 451–52 (the summary: a sharp struggle in the arts, a black line since 1949, ten points for the General Political Department); [[w.mao-zedong-zhuan]], VI, ch. 74 (on Mao''s approval the Center transmits the forum summary Apr. 10, asking every committee to study it closely and carry it out). [[w.yang-jisheng-tiandi-fanfu]], I, 128 (Apr. 10, the summary issued as a Central Committee document, Zhongfa [66] no. 211 中發〔66〕211號, down to county and regiment level 縣團級). Made public: 2006. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: Summary of the Army Forum on Literature and Art Work called by Jiang Qing at the behest of Lin Biao (Zhongfa [1966] 211), in [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 604–610 (cited by [[w.macfarquhar-maos-last-revolution]], 31 n.69); Peng Zhen, submission to Mao Zedong of the draft Central Committee instruction forwarding the army forum summary, Apr. 1, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 234 n.1b); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 604–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.123); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 607 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 452 n.124); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 610 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 452 n.125). Names: Mao Zedong, Jiang Qing, Lin Biao.'
