    item: '[[w.peng-zhen-nianpu-1902]], IV, 9 (Mar. 19, 1960; Peng Zhen, with Zhou Enlai, Chen Yi and others, meets the visitors from the Soviet Union, Bulgaria, the GDR, India, Japan, Cyprus and other countries)'
