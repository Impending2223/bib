    at: IV, 29
- cite:
    id: cal.1960-05-23.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 23, 1960, afternoon; Peng Zhen at the meeting of the Politburo members and the Secretariat hearing Deng Xiaoping relay the talks of Mao, Liu Shaoqi, Zhou Enlai and others with Kim Il Sung at Hangzhou on the 21st on the situation after the summit''s failure, and Mao''s speech at his Hangzhou meeting that day)'
- cite:
    id: cal.1960-05-25.china-leadership-11
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 25, 1960; the 188th meeting; Peng Zhen there; ten more, Luo Ruiqing among them, to attend the enlarged Politburo of early June; material gathered on industrial accidents and on edema and starvation deaths in the villages, to study with the first secretaries at the meeting and learn from; Zheng Senyu (the page''s note: deputy secretary-general of the Chinese People''s Committee for World Peace) to attend the World Peace Council)'
- cite:
    id: cal.1960-05-27.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 27, 1960, morning; Peng Zhen, with Zhu De, Deng Xiaoping and others, at the airport to see Zhou and Chen Yi off to Mongolia)'
