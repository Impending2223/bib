- cite:
    id: cal.1960-03-30.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 12 (Mar. 30, 1960; Peng Zhen receives Mao''s draft; Mao on it: amend it if need be; to go out by telegram by Apr. 5; "请尚昆办")'
