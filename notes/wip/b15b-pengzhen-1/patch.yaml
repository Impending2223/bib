    item: '[[w.peng-zhen-nianpu-1902]], IV, 4–5 (Feb. 29, 1960; the 169th meeting; Peng Zhen there; Bo Yibo, Tan Zhenlin and Li Xiannian on industrial and agricultural production and finance and trade, and decisions taken; Peng asks after the public mess halls in the villages of several provinces)'
