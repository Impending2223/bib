    id: cal.1961-01-17.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 17, 1961; Peng Zhen at the banquet)'
- cite:
    id: cal.1961-01-17.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 17, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing the groups)'
- cite:
    id: cal.1961-01-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 18, 1961; Peng Zhen at the closing session)'
