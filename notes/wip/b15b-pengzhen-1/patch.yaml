    id: cal.1961-03-27.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 27, 1961, morning; the 242nd meeting; Peng Zhen: the Secretariat did much, but the root trouble no serious investigation; to find problems and go to the base, the two things that make a good assistant to the Chairman and the Standing Committee; each department to keep in touch with model points; the two egalitarianisms show the Chairman investigates more than we; "一阵风来了随着转")'
- cite:
    id: cal.1961-03-27.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 27, 1961, afternoon; Peng Zhen with Zhou Enlai, Deng Xiaoping, Yang Shangkun and others on Laos)'
