    id: cal.1960-04-06.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 16 (Apr. 6, 1960, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping and others, at Mao''s meeting in the Yinian Tang on Zhou Enlai''s visits to Burma, India and Nepal)'
- cite:
    id: cal.1960-04-07.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 16 (Apr. 7, 1960; Peng Zhen, Liu Shaoqi and Deng Xiaoping receive the Center''s forwarding of the Jiangsu report and Mao''s comment: the cadres learned that commune-level economy must rest on brigade-level economy, "one levelling, two transfers" and the "communist wind" will not do; Mao: "干部会议开得很好", to go to the provinces by telegram through Yang Shangkun)'
- cite:
    id: cal.1960-04-08.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 16 (Apr. 8, 1960, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping and others, at Mao''s meeting on the papers for Zhou Enlai''s journey to India and other countries and the press text of Zhou''s report to the Congress on the international situation)'
