- cite:
    id: cal.1961-02-26.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 107 (Feb. 26, 1961, afternoon; Peng Zhen, with Zhou Enlai and others, at the United Front Department''s symposium of the democratic parties'' leaders and non-party democrats)'
- cite:
    id: cal.1961-03-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 109 (Mar. 3, 1961, afternoon; Peng Zhen, with Deng Xiaoping and others, hears Zhou on his tour)'
