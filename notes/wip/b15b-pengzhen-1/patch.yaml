    item: '[[w.peng-zhen-nianpu-1902]], IV, 133 (June 10, 1961; the 258th meeting; Peng Zhen there; Liu Shaoqi''s speech for the fortieth anniversary and college admissions)'
- cite:
    id: cal.1961-06-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133 (June 12, 1961; Peng Zhen at the plenary; Mao on summing up experience and educating cadres)'
