    id: cal.1960-06-30.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 43 (June 30, 1960, afternoon, Zhongnanhai, the Huairen Tang; Peng Zhen, with Kang Sheng and Wu Xiuquan, reports on the Bucharest meeting of the socialist countries'' parties to the enlarged Politburo, Liu Shaoqi presiding)'
