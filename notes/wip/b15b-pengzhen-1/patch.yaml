      c: 'The Mentougou 门头沟 coal mines, Peking. Peng Zhen 彭真, with Liu Ren 刘仁 and Zheng Tianxiang 郑天翔, looks into production: tunneling behind cutting, tools poor, repairs behind, 7,000 of 12,000 miners'' lamps faulty; cutting and tunneling together, "精兵主义," a lamp and a tool for every man; the miners fixed and equipped, the rear cut, the unfit sent to farming; new pits to follow the old.'
