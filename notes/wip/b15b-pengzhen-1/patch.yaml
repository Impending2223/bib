- cite:
    id: cal.1960-04-18.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 19 (Apr. 18, 1960; Peng Zhen, with Zhu De, Lin Biao, Song Qingling, Dong Biwu, Deng Xiaoping and others, at the opening)'
