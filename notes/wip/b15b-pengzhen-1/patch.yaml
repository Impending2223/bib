    id: cal.1960-04-16.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18 (Apr. 16, 1960, afternoon; Peng Zhen at Deng Xiaoping''s meeting on the draft, prepared under Lu Dingyi, of the speech for the Lenin anniversary meeting, "Unite under Lenin''s Banner")'
- cite:
    id: cal.1960-04-18.china-leadership-11
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18 (Apr. 18, 1960, evening, Zhongnanhai, the Jurentang; Peng Zhen at Deng Xiaoping''s meeting on the draft to be printed Apr. 22 under the *Renmin ribao* editors'' name, "Forward along the Path of the Great Lenin")'
- cite:
    id: cal.1960-04-18.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 19 (Apr. 18, 1960; Peng Zhen, with Zhu De, Lin Biao, Song Qingling, Dong Biwu, Deng Xiaoping and others, at the opening)'
- cite:
    id: cal.1960-04-22.china-leadership-12
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960, morning; the 180th meeting; Peng Zhen there; Zhang Jingwu on work in Tibet, decisions taken; on the Tibet Work Committee''s request for more cadres, Peng: not too many)'
- cite:
    id: cal.1960-04-22.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960, afternoon, the Great Hall of the People; Peng Zhen presides; Zhu De, Lin Biao, Deng Xiaoping, Song Qingling, Lin Boqu, Dong Biwu and 10,000 cadres and others there; Lu Dingyi''s report)'
- cite:
    id: cal.1960-04-22.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960; with *Hongqi*''s "Long Live Leninism," as Peng Zhen''s chronology has it under that day)'
