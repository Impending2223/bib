    id: cal.1961-03-25.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 25, 1961, morning; Peng Zhen flies back to Peking from Wuhan with Zhou Enlai, Deng Xiaoping and others)'
