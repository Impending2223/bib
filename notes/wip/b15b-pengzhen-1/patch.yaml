      c: 'Peking 北京. Peng Zhen 彭真 with Liu Ren 刘仁, Zheng Tianxiang 郑天翔, Chen Kehan 陈克寒 and others on Peking''s rural work: 1,500 jin of grain a head and a pig a mu would bring the rest along; eleven suburban communes already owned at commune level, no more without the municipal committee''s approval, no big push for it now; communes to run industry; farming to be mechanized, each county on its own.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 7. Made public: 2012. Names: Peng Zhen.'
