- cite:
    id: cal.1960-05-09.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 25 (May 9, 1960, afternoon; Peng Zhen, with Deng Xiaoping and others, at the demonstration and rally of more than a million against the Japanese–American military alliance treaty; Guo Moruo presiding)'
- cite:
    id: cal.1960-05-11.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 26 (May 11, 1960, afternoon, Zhongnanhai, the Jurentang; Peng Zhen, with Luo Ruiqing and Liao Chengzhi, at Deng Xiaoping''s meeting)'
- cite:
    id: cal.1960-05-12.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 26 (May 12 and 13, 1960; the 185th meeting; Peng Zhen there; open criticism of modern revisionism and semi-revisionism to go on; Li Fuchun''s main points of the 1960–62 plan agreed in the main; Peng: organs and plans grown ever larger go against "more, faster, better, more economically"; a section on location in the plan, the big works (Baotou, Shanghai steel) to have their frames)'
- cite:
    id: cal.1960-05-16.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 27 (May 16, 1960; the 186th meeting; Peng Zhen there; the Korean Workers'' Party''s request agreed, China to give material support should north–south trade become possible; Luo Ruiqing, Yang Shangkun and the Peking committee to plan the leading organs'' shelters and an underground railway in Peking; Peng: university entry standards not lowered this year; the masses'' inventions not to be doused with cold water, nor puffed)'
- cite:
    id: cal.1960-05-17.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 28 (May 17, 1960, morning; Peng Zhen, with Song Qingling, Zhu De, Lin Biao, Deng Xiaoping and others, at the airport to welcome Zhou Enlai and Chen Yi back from Burma, India, Nepal, Cambodia and Vietnam; afternoon, Peng at Deng''s meeting of the Politburo members and the Secretariat on the international situation and Zhou''s report of the visits)'
- cite:
    id: cal.1960-05-17.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 28 (May 17, 1960, morning; Peng Zhen, with Lu Dingyi, Wang Jiaxiang, Wu Lengxi and others, at Deng Xiaoping''s meeting on the four-power summit (the page''s note: the Paris meeting of May 16, Khrushchev walking out when Eisenhower would not apologize for the U-2) and Zhou''s visits)'
- cite:
    id: cal.1960-05-19.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 19, 1960, about midnight; Peng Zhen receives Yang Shangkun''s call from Nanchang relaying Mao''s instruction for mass meetings across the country backing the Soviet stand on the four-power summit)'
- cite:
    id: cal.1960-05-20.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 20, 1960; the 187th meeting; Peng Zhen there; Zhang Zhizhong to write to Chiang Kai-shek on the Center''s Taiwan policy (the page''s note: Taiwan better in the Chiangs'' hands than America''s; after return all military and political power and appointments left to Chiang, Chen Cheng and Chiang Ching-kuo used as he wishes, the shortfall paid by the Center, social reform deferred until Chiang agrees, neither side to send agents); Deng Xiaoping''s speech for the afternoon''s rally revised)'
- cite:
    id: cal.1960-05-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 20, 1960, afternoon; Peng Zhen, with Zhou Enlai, Zhu De, Song Qingling, Lin Biao, Deng Xiaoping and others, at the rally on Tiananmen Square and its branch places backing the Soviet Union and against America''s wrecking of the four-power summit; Deng speaks)'
- variant:
    id: cal.1960-05-20.china-leadership
    unit: A
    witness: w.peng-zhen-nianpu-1902
