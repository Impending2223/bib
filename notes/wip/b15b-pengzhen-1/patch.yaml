- cite:
    id: cal.1960-10-06.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 63 (Oct. 6, 1960, evening; Peng Zhen and Deng Xiaoping meet Miyamoto Kenji, after Kapo)'
- cite:
    id: cal.1960-10-07.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 63–64 (Oct. 7, 1960, 10 a.m., at the Embassy; the Cuban delegation proposes that the two parties go on talking, the general debate being no help, a small committee of the two and one party each of Europe, Asia and Latin America to study the draft)'
- cite:
    id: cal.1960-10-07.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 7, 1960, afternoon; Peng Zhen at the fifth session; the Romanian, Argentine, Syrian, Brazilian, Japanese, Korean and American delegates; the secretariat to start on Monday the 11th)'
- cite:
    id: cal.1960-10-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 7, 1960; the Center cables the delegation that Khrushchev''s speech at the UN General Assembly of Oct. 1 will be printed in *Renmin ribao* the next day)'
- cite:
    id: cal.1960-10-08.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 8, 1960, noon; Peng Zhen at the sixth session; after the Australian, the Cuban and Suslov, the chair closes the debate, three parties left for Monday; Deng at once asks a second speech for the Chinese)'
- cite:
    id: cal.1960-10-09.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 9, 1960, evening; the delegation at the Embassy on Deng''s second speech)'
- cite:
    id: cal.1960-10-10.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 10, 1960, morning; Peng Zhen at the seventh session; the Indian, Indonesian and Bulgarian delegates; on a second speech no agreement; Deng: the Chinese need to state their view again but will hand it in writing if the others wish; Suslov: views in writing, the secretariat to meet that day and the next)'
- cite:
    id: cal.1960-10-11.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64 (Oct. 11, 1960, 11 a.m. to 1 p.m.; Peng Zhen, with Deng Xiaoping and Yang Shangkun, calls on the French, Italian, Australian, Cuban and Albanian delegations at the CPSU''s guesthouse)'
- cite:
    id: cal.1960-10-11.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 64–65 (Oct. 11, 1960, 6 p.m.; Peng Zhen, with Deng and Yang, to the dacha outside Moscow to see the Vietnamese delegation)'
- cite:
    id: cal.1960-10-12.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 12, 1960, 10:30 a.m.; Peng Zhen, with Deng and Yang, visits Duclos of the French party''s Secretariat at the Barvikha sanatorium, in bed with heart disease over a month)'
- cite:
    id: cal.1960-10-12.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 12, 1960, evening, at the Embassy; Peng Zhen hears Kang Sheng and Hu Qiaomu on the secretariat''s revision: the epoch and "going it alone" hotly argued; Albania, Vietnam, Japan, Indonesia, Korea and Australia with the Chinese)'
- cite:
    id: cal.1960-10-12.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 12, 1960; the delegation cables the Center the secretariat''s two days)'
- cite:
    id: cal.1960-10-13.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 13, 1960, evening, at the Embassy; Peng Zhen hears Kang Sheng and Hu Qiaomu: all views out, two armies facing each other, evenly matched, the Soviet side on the defensive; before the session the Soviets offered to strike "going it alone" and "national communism" but keep the passage on Yugoslavia aimed at China; refused; the Soviet supporters more restrained; reported to the Center)'
- cite:
    id: cal.1960-10-14.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 14, 1960, evening, at the Embassy; Peng Zhen hears Hu Qiaomu on the fight over the danger of war, the horror of nuclear arms and disarmament; some see the Bucharest days gone; the CPSU, seeking compromise, forms a small committee of six (the Soviet Union, China, Japan, West Germany and others) and talks between the two parties)'
- cite:
    id: cal.1960-10-14.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65 (Oct. 14, 1960; Khrushchev back in Moscow from the UN at 5 p.m.; the delegation cables the Center for instructions)'
- cite:
    id: cal.1960-10-15.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 65–66 (Oct. 15, 1960, evening, at the Embassy; Peng Zhen hears Kang Sheng: the nationalist states hotly argued; someone says what the secretariat cannot pass may go to the committee or to November)'
- cite:
    id: cal.1960-10-16.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 66 (Oct. 16, 1960, morning, at the Embassy; the delegation: the fifth part''s wording on peaceful transition, Yugoslavia, revisionism, dogmatism and factions not to be let pass; wary of the Soviets'' nine-man small committee; the full revised draft to be asked for; speeches for the secretariat''s close, the committee and November)'
- cite:
    id: cal.1960-10-17.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 66 (Oct. 17, 1960, morning; Deng decides Lu Dingyi, Hu Sheng, Fan Ruoyu and others go home first to report and prepare for November, on the Wednesday (19th) evening plane)'
- cite:
    id: cal.1960-10-19.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 66 (Oct. 19, 1960, 11 a.m.; the Soviet side has said the secretariat will not meet that morning; the delegation at the Embassy on Deng''s last speech to the committee)'
- cite:
    id: cal.1960-10-19.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 66 (Oct. 19, 1960; word again: no secretariat in the afternoon either)'
- cite:
    id: cal.1960-10-19.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 19, 1960, evening; the delegation receives from the Soviet side the first four parts of the draft as revised in the secretariat, the fifth to be settled the next day)'
- cite:
    id: cal.1960-10-20.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 20, 1960, morning; Peng Zhen at the Embassy reads the revised introduction and parts one to four; many of the delegation''s views taken in, the fight has paid; the secretariat goes on with part five)'
- cite:
    id: cal.1960-10-20.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 20, 1960, afternoon, the delegation''s meeting at the Embassy; Liu Xiao: word from two Academy institutes that Khrushchev may go to Peking to win Mao''s presence in November; reported to the Center)'
- cite:
    id: cal.1960-10-20.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 20, 1960, 11 p.m.; Peng Zhen hears those at the secretariat: twelve hours, meeting within meeting; on rooting war out of human society, dogmatism and revisionism, the Twentieth and Twenty-first Congresses, the fight at its height, no agreement)'
- cite:
    id: cal.1960-10-21.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 21, 1960; the secretariat ends; agreement reached by setting aside four questions: removing war from human life; full approval of the Twentieth and Twenty-first Congresses; "group" and "factional" activity; equality and consultation among parties)'
- cite:
    id: cal.1960-10-21.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67 (Oct. 21, 1960; Peng Zhen talks with Kapo of the Albanian Party of Labor)'
- cite:
    id: cal.1960-10-22.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 67–68 (Oct. 22, 1960, noon to 1:30 p.m.; Peng Zhen at the last session, Suslov presiding; Ponomarev: a draft of twenty-six, chapters one, two and four agreed, some paragraphs of three and five not (war''s elimination: China, Albania, Indonesia, Korea; the two Congresses; the "cult of the individual"; Yugoslavia, China proposing "bourgeois nationalism" for "national communism"; "factional activity"); after Deng speaks the report adopted, the draft sent to the November meeting, the CPSU to report there)'
- cite:
    id: cal.1960-10-22.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 68 (Oct. 22, 1960, 3 to 5:30 p.m.; Peng Zhen and Deng Xiaoping lead the delegation at the Presidium''s banquet in St. George''s Hall; Suslov and Deng toast; near the end Khrushchev, rising, coarsely: who opposes him opposes the Central Committee, he does not want to "lead," he will leave any party that would make revolution by war between states; Deng: no party holds that, the Soviet lead was formed by history, no discussion at a banquet)'
- cite:
    id: cal.1960-10-22.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 68 (Oct. 22, 1960, 7 to 9 p.m.; Deng Xiaoping meets the Japanese, Peng Zhen the Australian party''s delegates, each on the committee''s work)'
- cite:
    id: cal.1960-10-23.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 68 (Oct. 23, 1960, 10 p.m.; the delegation flies from Moscow; back in Peking at 1:40 p.m., Peking time, on the 24th, Peng Zhen and Deng leading it, Zhou Enlai, Zhu De and others at the airport)'
- cite:
    id: cal.1960-10-24.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 68–69 (Oct. 24, 1960, evening, the Yinian Tang; Peng Zhen at Mao''s meeting of the Standing Committee, the Secretariat and the first secretaries of North and Central-South China, hearing Deng, Peng and others on the drafting committee)'
- cite:
    id: cal.1960-10-25.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69 (Oct. 25, 1960, evening; Peng Zhen, with Zhou Enlai, Zhu De and others, at the Korean Embassy''s reception for the tenth anniversary of the Chinese People''s Volunteers'' war)'
- cite:
    id: cal.1960-10-27.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69 (Oct. 27, 1960, afternoon; Peng Zhen at the Politburo, Liu Shaoqi presiding, hearing Deng''s report; Liu to lead the delegation to the November meeting at Moscow)'
- cite:
    id: cal.1960-10-28.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69 (Oct. 28, 1960, morning, Diaoyutai; Peng Zhen, with Lu Dingyi, Chen Boda, Kang Sheng and others, at Deng''s meeting on the Moscow meeting)'
- cite:
    id: cal.1960-10-31.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69 (Oct. 31, 1960, 6 p.m. to 2 a.m.; Peng Zhen at Liu Shaoqi''s meeting revising Liu''s speech for the Moscow meeting)'
- cite:
    id: cal.1960-11-01.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69 (Nov. 1, 1960, morning; Yang Shangkun gives Chervonenko the list of the Party and government delegation to the October Revolution''s forty-third anniversary: Liu Shaoqi leader, Deng Xiaoping deputy, Peng Zhen, Li Jingquan, Lu Dingyi, Kang Sheng, Yang Shangkun, Hu Qiaomu, Liu Xiao, Liao Chengzhi and Liu Ningyi members; Xinhua releases the list on the 4th)'
- cite:
    id: cal.1960-11-02.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 69–70 (Nov. 2, 1960, afternoon; Peng Zhen, with Zhou Enlai, Zhu De, Deng Xiaoping and others, at the airport to welcome Hồ Chí Minh on his way to Moscow)'
- cite:
    id: cal.1960-11-02.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 2, 1960, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and others, at Mao''s meeting with Hồ Chí Minh in the Qinzheng Hall)'
- cite:
    id: cal.1960-11-02.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 2, 1960, evening; Peng Zhen at Mao''s enlarged Standing Committee in the Qinzheng Hall on Liu Shaoqi''s delegation to Moscow)'
- cite:
    id: cal.1960-11-04.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 4, 1960, morning; Peng Zhen, with Li Jingquan, Lu Dingyi, Liao Chengzhi, Liu Ningyi and others, the delegation''s first group, flies for Moscow, seen off by Zhou Enlai, Zhu De, Deng Xiaoping and others; the weather changing, by train from Sverdlovsk, at Moscow 11:20 a.m. Moscow time on the 6th; Liu Xiao already there)'
- cite:
    id: cal.1960-11-06.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 6, 1960, 11:20 a.m. Moscow time; Peng Zhen and the first group reach Moscow by train from Sverdlovsk)'
- cite:
    id: cal.1960-11-05.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 5, 1960, morning; Liu Shaoqi and Deng Xiaoping lead the second group (Kang Sheng, Yang Shangkun, Hu Qiaomu and others), seen off by Zhou Enlai, Zhu De, Lin Biao; at Moscow 4:45 p.m. Moscow time, Khrushchev, Brezhnev and Suslov at the airport)'
- cite:
    id: cal.1960-11-06.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 6, 1960; the whole delegation calls on Khrushchev in the Kremlin and attends the Presidium''s banquet)'
- cite:
    id: cal.1960-11-06.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 6, 1960; Peng Zhen and the whole delegation at the Presidium''s banquet)'
- cite:
    id: cal.1960-11-06.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 6, 1960, evening; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, calls on Brezhnev, member of the Presidium and Chairman of the Presidium of the Supreme Soviet, in the Kremlin)'
- cite:
    id: cal.1960-11-07.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70 (Nov. 7, 1960, morning to 1 p.m.; Peng Zhen, with Liu Shaoqi and others, at the anniversary on Red Square, the military parade and the march; Deng Xiaoping, Kang Sheng and Hu Qiaomu not there)'
- cite:
    id: cal.1960-11-07.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 70–71 (Nov. 7, 1960; the CPSU''s answer of Nov. 5 to the Reply of Sept. 10, over 80,000 characters, 91 pages in Chinese, handed by Andropov to Liu Xiao after the parade; Andropov: let it not be tied to the meeting (the 81 parties'', so the page''s note), "the meeting is the meeting, the answer is the answer"; that afternoon Liu Shaoqi has the delegation read it)'
- cite:
    id: cal.1960-11-07.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 7, 1960, 4 to 7 p.m.; Peng Zhen at the reception of over a thousand in St. George''s Hall; only Khrushchev toasts, no guest speaks)'
- cite:
    id: cal.1960-11-07.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 7, 1960, evening, at the Embassy; the answer attacks several of Mao''s theses; the delegation holds it must be answered openly at the meeting; whether Liu Shaoqi or Deng Xiaoping should answer, and the revision of the prepared speech, referred to the Center by cable)'
- cite:
    id: cal.1960-11-07.soviet-union-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 7, 1960; Peng Zhen, with Deng Xiaoping and Yang Shangkun, meets Alia, secretary of the Albanian Party of Labor''s Central Committee, tells him of the call on Khrushchev and exchanges views on the meeting)'
- cite:
    id: cal.1960-11-08.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 8, 1960, morning, the Embassy; Peng Zhen, with Deng Xiaoping and Yang Shangkun, meets Lukman, first deputy chairman, and Aidit, general secretary, of the PKI)'
- cite:
    id: cal.1960-11-08.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 8, 1960, noon; the Chinese Party and government delegation lays wreaths at the Lenin and Stalin mausoleum)'
- cite:
    id: cal.1960-11-08.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 71 (Nov. 8, 1960, afternoon; Peng Zhen, with Yang Shangkun, meets Sharkey, general secretary of the Australian party, at the Embassy)'
- cite:
    id: cal.1960-11-08.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72 (Nov. 8, 1960, evening, the delegation at the Embassy; the answer attacks Mao''s "the east wind prevails over the west wind," "imperialism is a paper tiger," "the sinification of Marxism," and his views on China and India and on war; unanswered it would sow confusion; to leave room, Deng to speak)'
- cite:
    id: cal.1960-11-08.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72 (Nov. 8, 1960; the proposal that Deng speak cabled to the Center)'
- cite:
    id: cal.1960-11-09.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72 (Nov. 9, 1960, morning; Peng Zhen and Deng Xiaoping at the Vietnamese delegation''s residence with Hồ Chí Minh and Lê Duẩn on the CPSU''s answer)'
- cite:
    id: cal.1960-11-09.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 72 (Nov. 9, 1960, 5 p.m., at Liu Shaoqi''s lodging; Suslov, Kozlov, Mikoyan, Ponomarev and Andropov: sent by their Central Committee to say the meeting is to remove differences; Khrushchev''s speech constructive, without polemic, not touching the Reply; the differences to be discussed later; Mikoyan: aid will go on, experts may be sent again, trade requests refused by "the departments" can be settled; Liu Shaoqi, Deng Xiaoping and Peng Zhen in turn: they came to speak for unity, the hundred-page answer has destroyed it, the talk of unity untrue; an answer at the meeting unavoidable, the quarrel theirs)'
- cite:
    id: cal.1960-11-10.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 10, 1960, afternoon; the Chinese delegation at the first plenary in St. George''s Hall, Khrushchev presiding and welcoming; a secretariat of one from each of thirty parties)'
- cite:
    id: cal.1960-11-10.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 10, 1960; Khrushchev explains the draft statement part by part; "led by the Soviet Union" wrong, yet all to "set their watches" by it (the page''s note: his words at the Hungarian party''s seventh congress, Dec. 3, 1959); the majority to be respected, national traits not overstressed; the hall applauds, the whole Chinese delegation and staff sit still)'
- cite:
    id: cal.1960-11-11.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 11, 1960, all day; Peng Zhen at the second plenary; the delegates of Canada, Argentina, Bulgaria, Iraq, Cyprus, Lebanon, Switzerland, Uruguay, Denmark, Mexico and the Netherlands praise Khrushchev and fault the Chinese)'
- cite:
    id: cal.1960-11-12.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 73 (Nov. 12, 1960, 10 a.m. to 1:30 p.m.; Peng Zhen at the third plenary; the delegates of Hungary, Colombia, Luxembourg, Greece, Nepal, South Africa and Venezuela; the Colombian proposes a permanent international body, like the Canadian''s standing committee to settle disputes; delegations ask when the Chinese will speak and with what view)'
- cite:
    id: cal.1960-11-12.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74 (Nov. 12, 1960, evening, at the Embassy; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, on Deng''s speech for the 14th; the Center puts Liu in the second line, Deng and Peng in the first)'
- cite:
    id: cal.1960-11-14.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74 (Nov. 14, 1960; Peng Zhen at the fourth plenary; after the Korean party, Deng speaks four hours in five parts: the differences started by the CPSU, the surprise attack, ideology carried into state relations, the experts withdrawn, agreements torn up, the quarrel made public first; Khrushchev''s praise of Eisenhower, the "yellow peril" to Adenauer; "division of labor" and "equal consultation" untrue, "setting watches" his baton; the hall silent, tense)'
- variant:
    id: cal.1960-11-14.soviet-union-2
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: Deng speaks at the morning session ("上午 ... 继朝鲜劳动党代表发言后，邓小平发言")
    at: IV, 74
- cite:
    id: cal.1960-11-14.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74 (Nov. 14, 1960, evening; Peng Zhen meets Alia, secretary of the Albanian Party of Labor: Deng''s speech substantial, clear, firm)'
- cite:
    id: cal.1960-11-15.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74 (Nov. 15, 1960, all day; Peng Zhen at the fifth plenary; eight speakers praise Khrushchev and besiege the Chinese party, the East German and Czechoslovak by name for factionalism; that evening the delegation cables the Center: unless the draft is changed in principle it will not sign, and will make a statement, to steady the left, win the middle, strike the right)'
- cite:
    id: cal.1960-11-15.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74–75 (Nov. 15, 1960; at the Embassy Peng Zhen, with Deng Xiaoping, meets Wilcox, general secretary of the New Zealand party)'
- cite:
    id: cal.1960-11-15.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 74–75 (Nov. 15, 1960; Peng Zhen and Deng Xiaoping at the Embassy talk with Wilcox, general secretary, and Jackson, chairman, of the New Zealand party)'
- cite:
    id: cal.1960-11-16.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 16, 1960; Peng Zhen at the sixth plenary, eight speakers in the morning, four in the afternoon; Hoxha sharply criticizes Khrushchev)'
- cite:
    id: cal.1960-11-16.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 16, 1960; the delegation receives Zhou''s reply (a cable, so the page): the Standing Committee agrees with the delegation''s request of the day before, all to be planned for the worst, the delegation to decide with full powers; the Politburo to meet the next day)'
- cite:
    id: cal.1960-11-17.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 17, 1960, all day; Peng Zhen at the seventh plenary, six speakers; the Polish delegate abuses the Albanians, the Soviet delegates lead the applause; not clapping: China, Albania, Korea, Vietnam, South Africa, Britain, Indonesia, Burma, Malaya, Thailand, India, Japan, Australia)'
- cite:
    id: cal.1960-11-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 17, 1960; the Center''s cable to the delegation: wholly agreed on the signature, all planned for the worst, not signing is not a split)'
- cite:
    id: cal.1960-11-17.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75 (Nov. 17, 1960; Liu Shaoqi calls on Hồ Chí Minh and on Prestes of Brazil to explain the delegation''s stand; Deng talks with the heads of the Burmese, Malayan and Thai delegations and meets Alia, telling them its position on signing)'
- cite:
    id: cal.1960-11-18.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 75–76 (Nov. 18, 1960, all day; Peng Zhen at the eighth plenary, ten speakers (morning Romania, Belgium, Paraguay, Turkey, Guatemala; afternoon Jordan, Iran, New Zealand, West Germany, Sudan); Wilcox of New Zealand: Khrushchev''s "no arms, no armies, no war" spreads illusions; peaceful transition in the capitalist centers doubtful; "factional activity" better left out, China not warlike; differences to be settled by consultation)'
- cite:
    id: cal.1960-11-19.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 76 (Nov. 19, 1960, all day; Peng Zhen at the ninth plenary; Panama, Indonesia, Finland, San Marino, Northern Ireland, Guadeloupe, Honduras; Lukman of Indonesia: strike "factional activity" and the Twentieth and Twenty-first Congresses, drop "national communism," the socialist countries'' parties alone to sign, as in 1957; the attacks on China and Albania milder, signing much discussed; Khrushchev and Hoxha absent)'
- cite:
    id: cal.1960-11-19.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 76 (Nov. 19, 1960; the Center''s letter to Liu Shaoqi, Deng Xiaoping and Peng Zhen: "同意你们对于不提苏联为首为中心问题所采取的立场")'
- cite:
    id: cal.1960-11-20.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 76 (Nov. 20, 1960, afternoon; Liu Shaoqi, with Peng Zhen, Yang Shangkun, Li Jingquan and Lu Dingyi, at his lodging with Gomułka and others of the Polish delegation; the Poles: the Twentieth Congress in the draft in the Moscow Declaration''s words, not the Twenty-first; "factional group activity" kept, in the future tense; Liu: no party''s congress to be a common norm, even the Twentieth alone not agreed; "factional group activity" plainly aimed at the Chinese party, the delegation will not sign it; Gomułka, without answer, leaves)'
- cite:
    id: cal.1960-11-21.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 77 (Nov. 21, 1960, all day; Peng Zhen at the tenth plenary; Bolivia, Burma, Costa Rica, Malaya, India, Thailand, Ecuador, Algeria; Thakin Than Tun of Burma: the "three noes" possible only after socialism wins the world; the Twentieth Congress''s peaceful transition split the Burmese party in armed struggle, its leaders defecting, its guerrillas deserting; the Burmese, Thai and Malayan parties wrote to the CPSU in 1957; "group factions" and "national communism" to go)'
- cite:
    id: cal.1960-11-21.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 77 (Nov. 21, 1960, 10 p.m.; the delegation at the Embassy on the meeting and its line of struggle)'
- cite:
    id: cal.1960-11-22.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 77 (Nov. 22, 1960, all day; Peng Zhen at the eleventh plenary; Japan, the Dominican Republic, Ceylon, Australia, Nicaragua, Haiti, Peru; Hakamada Satomi of Japan: what is not agreed to stay out of the paper, differences not to be carried abroad or into the mass organizations, no standing committee yet; when the speeches end in the afternoon the chair closes the general debate, Khrushchev to speak the next morning; the Chinese at once ask to speak a second time)'
- variant:
    id: cal.1960-11-22.soviet-union
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: 'the eleventh plenary sits all day, the general debate closing when the speeches end in the afternoon ("全天出席 ... 下午发言完毕时，会议主席宣布: 一般性讨论结束")'
    at: IV, 77
- cite:
    id: cal.1960-11-23.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 78 (Nov. 23, 1960, morning; Peng Zhen at the twelfth plenary; Khrushchev, his tone lowered, calls Deng''s speech "不知分寸," a slander on the CPSU, presses for the Twentieth Congress and "against group factional activity" in the statement, says many Chinese views wrong, hints at Mao; one hour forty minutes; organized applause, all rising; the Chinese sit, as do Korea, Albania, India, Indonesia, Japan, Burma, Thailand, "Manila" (so the page) and New Zealand; the Chinese ask to speak, Khrushchev proposes the next day, Deng agrees)'
- variant:
    id: cal.1960-11-23.soviet-union
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: Khrushchev speaks one hour and forty minutes ("讲话共一小时四十分钟")
    at: IV, 78
- cite:
    id: cal.1960-11-23.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 78 (Nov. 23, 1960; back at the Embassy the delegation on Deng''s second speech till 2 a.m.)'
- cite:
    id: cal.1960-11-24.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 78 (Nov. 24, 1960, morning; Peng Zhen at the thirteenth plenary; Deng''s second speech, about forty minutes, on two questions: who kept to the Moscow Declaration, and whose stand guards unity; the whole Soviet Presidium present; in the break the Soviets rally speakers; after it Ghosh of India and the Burmese, Thai, Malayan, Nicaraguan, New Zealand, Irish and Canadian delegates ask to end the debate; Khrushchev: let all speak; twenty-five speakers, morning to afternoon)'
- variant:
    id: cal.1960-11-24.soviet-union
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: Deng speaks about forty minutes ("发言约四十分钟")
    at: IV, 78
- cite:
    id: cal.1960-11-24.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 24, 1960; Lukman of Indonesia: majority against minority not right, it means an international center; "against group activity" means a center giving orders; the danger is not differences but improper ways of settling them; what is not agreed left out for later; the hall shaken; Liu Shaoqi and Deng Xiaoping absent in the afternoon)'
- cite:
    id: cal.1960-11-24.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 24, 1960; the delegation, meeting at the Embassy, cables the Center for instructions on signing the draft)'
- cite:
    id: cal.1960-11-25.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 25, 1960, morning; Peng Zhen leads Kang Sheng, Hu Qiaomu and Liu Ningyi at the drafting committee''s first sitting; all day on whether the Twentieth Congress goes into the paper, no agreement)'
- cite:
    id: cal.1960-11-25.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 25, 1960, evening; the delegation cables the Center: Hồ Chí Minh has had the Japanese, Korean, Indian, Indonesian, Australian, British, Cuban and other delegations to talk; they will write to Khrushchev and Liu Shaoqi asking to be received, and propose the two meet, for unity; instructions asked)'
- cite:
    id: cal.1960-11-26.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79 (Nov. 26, 1960, morning; Peng Zhen at the second sitting; the first four parts done, the fifth left; the delegation telephones Zhou, who says the Center will discuss signing that afternoon and answer after consulting the regional bureaus'' secretaries)'
- cite:
    id: cal.1960-11-26.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 79–80 (Nov. 26, 1960, 4 p.m., at Liu Shaoqi''s lodging; Peng Zhen, with Liu, Deng Xiaoping and Yang Shangkun, talks with Mikoyan and Kozlov; the invitation to visit after the meeting stands; Liu: the visit depends on the result; the letter of Nov. 5 handed round, the siege inside and outside the meeting, a wrong line now at the edge; with "national communism," "group factional activity," the two Congresses and an internal resolution condemning China, no signature; the Soviets: "national communism" may go or be rewritten, "factional activity" rewritten or an internal decision, but leaving out the Twentieth Congress would mean its condemnation; three hours)'
- variant:
    id: cal.1960-11-26.soviet-union-2
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the talk at Liu Shaoqi's lodging, 4 p.m., Liu Shaoqi, Deng Xiaoping, Peng Zhen and Yang Shangkun with Mikoyan and Kozlov, Liu speaking for the Chinese, three hours
    at: IV, 79
- cite:
    id: cal.1960-11-27.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 80 (Nov. 27, 1960, 3 p.m., at the Embassy; Peng Zhen, with Liu Shaoqi, Deng Xiaoping, Li Jingquan, Lu Dingyi and Yang Shangkun, meets Hồ Chí Minh and Lê Duẩn, Ghosh of India, Sharkey of Australia, Kim Chang-man and Kim Il of Korea, Lukman of Indonesia and Hakamada Satomi of Japan: they hope the two parties unite, Khrushchev and Liu meet, a way found to a common resolution, a split avoided; three hours)'
- cite:
    id: cal.1960-11-28.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 80 (Nov. 28, 1960, morning; Peng Zhen at the third sitting; "national communism" struck, the other disputes hung up; Liu absent; Suslov: the disputes to go to the heads of delegations, the committee to meet when called)'
- cite:
    id: cal.1960-11-28.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 80 (Nov. 28, 1960, evening; the Center''s answer to the delegation: do all that kindness and duty ask, consolidate the left, win the middle, expose the right; ground may be given on the Twentieth Congress, never on "group factionalism" or an internal resolution)'
- cite:
    id: cal.1960-11-29.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 80–81 (Nov. 29, 1960; Peng Zhen, with Kang Sheng and Hu Qiaomu, at the fourth sitting; the Pole: keep the two Congresses; the Cuban: rewrite "group factionalism"; no result; Suslov proposes a small committee of thirteen; China''s request for one or two more parties refused, Peng: from Asia only the Chinese party, we refuse to take part; the air tense)'
- cite:
    id: cal.1960-11-29.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 81 (Nov. 29, 1960; Peng Zhen takes Kozlov to another room: if you want a break, say so openly and we will condemn you; on Kozlov''s denial, a gentlemen''s agreement: no internal resolution, nothing aimed at China ("national communism," "factional activity"), the principle of agreement by consultation written in, the Twentieth Congress in amended words; Kozlov: the Twentieth Congress in, in the 1957 words or others agreed, the Twenty-first may go, "factional activity" struck, the cult of the individual perhaps, consultation in, no internal resolution; Peng: agreed "before Lenin''s portrait," each to report; the committee and the thirteen not to meet till the two settle in writing, Khrushchev and Liu to meet; about an hour; the committee adjourns; back at the Embassy at 7 p.m.)'
- cite:
    id: cal.1960-11-29.soviet-union-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 81 (Nov. 29, 1960, evening; the Soviet side telephones: Khrushchev will receive Liu Shaoqi and whomever Liu brings at his office at 10 the next morning)'
- cite:
    id: cal.1960-11-30.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 81–82 (Nov. 30, 1960, morning; Peng Zhen, with Liu Shaoqi and Deng Xiaoping, talks with Khrushchev, Kozlov and Suslov; both wish the quarrel ended and relations as before 1957; Liu: Sino-Soviet unity and the twelve countries'' unity most important; Liu''s state visit settled at five days to a week, with Yang Shangkun, Li Jingquan, Lu Dingyi, Liu Ningyi and Liu Xiao, subject to the Center)'
- cite:
    id: cal.1960-11-30.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Nov. 30, 1960, 3 p.m.; Peng Zhen at the drafting committee, which settles the disputed paragraphs at last)'
- cite:
    id: cal.1960-12-01.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 1, 1960, 11 a.m.; Peng Zhen at the closing plenary in the Kremlin; the communiqué, the Statement (the "Moscow Statement") and the Appeal to the Peoples of the World adopted and signed; Liu Shaoqi speaks and signs for the Chinese delegation)'
- cite:
    id: cal.1960-12-01.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 1, 1960, 4 p.m.; Peng Zhen, with Deng Xiaoping, Li Jingquan and Yang Shangkun, meets Kapo and Alia of the Albanian party at the Embassy)'
- cite:
    id: cal.1960-12-02.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 2, 1960, evening; Peng Zhen and Deng Xiaoping lead part of the delegation out of Moscow in two Soviet planes, Hồ Chí Minh and the Vietnamese delegation with them, Liu Shaoqi staying on his state visit; Dec. 3, 1:30 p.m. Peking time, back in Peking, Hồ''s delegation on the same plane)'
- cite:
    id: cal.1960-12-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 3, 1960, afternoon; Peng Zhen, with Deng Xiaoping, Kang Sheng, Hu Qiaomu and Liao Chengzhi, reports on the 81 parties'' meeting to Mao, Zhou Enlai, Zhu De and others in the Qinzheng Hall)'
- cite:
    id: cal.1960-12-03.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 3, 1960, 5:30 p.m.; Peng Zhen accompanies Mao, Zhou Enlai, Zhu De and others in meeting and dining Hồ Chí Minh and the Vietnamese delegation; a performance after)'
- cite:
    id: cal.1960-12-06.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 82–83 (Dec. 6, 1960, morning; Peng Zhen, with Zhou Enlai, Zhu De, Deng Xiaoping, Li Fuchun and others, at the airport to see off the Vietnamese Party and government delegation)'
- cite:
    id: cal.1960-12-04.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 83 (Dec. 4, 1960, evening, the Yinian Tang; Peng Zhen, with Zhou Enlai, Deng Xiaoping, Li Fuchun, Chen Yi, He Long, Chen Boda, Kang Sheng, Lin Biao and others, at Mao''s meeting hearing Xiao Hua (the page''s note: deputy secretary-general of the Military Commission and deputy director of the General Political Department) and Luo Ruiqing on the rectification in the General Political Department, to 1:40 a.m.)'
- cite:
    id: cal.1960-12-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 83 (Dec. 7, 1960, afternoon; Peng Zhen at the Politburo, Zhou Enlai presiding, hearing Deng Xiaoping on the delegation''s work at the 81 parties'' meeting)'
- cite:
    id: cal.1960-12-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 83 (Dec. 9, 1960, afternoon; Peng Zhen, with Mao, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Li Fuchun and others, at the capital airport to meet Liu Shaoqi''s delegation, Li Jingquan, Lu Dingyi, Yang Shangkun and Liu Ningyi on the same plane)'
- cite:
    id: cal.1960-12-12.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 83 (Dec. 12, 1960, 10:10 p.m. to 1 a.m.; Peng Zhen sits in at Mao''s Standing Committee hearing Zhou Enlai and Li Fuchun on the 1961 plan)'
- cite:
    id: cal.1960-12-15.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 15, 1960, morning, at the Peking station; Peng Zhen, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai and others, meets Prince Sihanouk; in the afternoon with them meets the prince and his party)'
- cite:
    id: cal.1960-12-16.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 16, 1960, morning; Peng Zhen, with Deng Xiaoping, Chen Yi and others, at Zhou''s meeting on Laos)'
- cite:
    id: cal.1960-12-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 16, 1960, 10 p.m. to 12:40 a.m.; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Yi, Luo Ruiqing and Wei Guoqing (the page''s note: first secretary of Guangxi), at Mao''s meeting on Wei''s going to Vietnam)'
- cite:
    id: cal.1960-12-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 17, 1960, afternoon; Peng Zhen accompanies Mao, Liu Shaoqi, Zhu De, Zhou Enlai and others in meeting the prince in the Qinzheng Hall)'
- cite:
    id: cal.1960-12-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 18, 1960, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Dong Biwu, Zhu De and others, at Sihanouk''s banquet)'
- cite:
    id: cal.1960-12-19.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 19, 1960, afternoon; Peng Zhen takes part in Liu Shaoqi''s talks with Sihanouk)'
- cite:
    id: cal.1960-12-19.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 84–85 (Dec. 19, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai and others, at the rally of more than 10,000; Peng speaks, hailing the treaty of friendship and mutual non-aggression signed by the two governments)'
- cite:
    id: cal.1960-12-19.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 85 (Dec. 19, 1960, evening; Peng Zhen, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai and others, at the cocktail party of the China–Cambodia Friendship Association and the Women''s Federation for the prince and his wife in the Great Hall of the People; Chinese and Cambodian artists perform)'
- cite:
    id: cal.1960-12-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 85 (Dec. 20, 1960, morning; Peng Zhen at the station to see Zhou off with Prince Sihanouk to the provinces)'
- cite:
    id: cal.1960-12-19.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 85 (Dec. 19, 1960, 9:50 p.m. to 2 a.m., the Yinian Tang; Peng Zhen at Mao''s enlarged Standing Committee on the 1961 plan)'
- cite:
    id: cal.1960-12-22.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 85–86 (Dec. 22, 1960; the 223rd meeting; Peng Zhen there; putting industry in order and preparing the work conference of the 24th; Peng: back home, he feels the pressure of the difficulties; the twelve-article urgent directive (the page''s note: the Center''s urgent letter of Nov. 3, 1960, on present policy in the rural communes) gave agriculture a policy, industry needs one too; plans too big, no rest in two years, routine work crowding out political work, in Henan, Anhui and Hubei too; the provinces squeezed from both ends; "不要一面倒": when Chairman Mao speaks, the localities rush in regardless; seek truth from facts and the mass line; summarize, write papers, try them, then proceed)'
- cite:
    id: cal.1960-12-22.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86 (Dec. 22, 1960, afternoon; Peng Zhen and Deng Xiaoping with Guo Moruo and others on Guo''s leading a Chinese friendship delegation to the second anniversary of the Cuban revolution)'
- cite:
    id: cal.1960-12-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86 (Dec. 23, 1960, evening, the Yinian Tang; Peng Zhen, with Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Tan Zhenlin and others, at Mao''s meeting with the regional bureaus'' secretaries, hearing reports on rural livelihood and the rectification of the communes and on how to hold the work conference)'
- cite:
    id: cal.1960-12-24.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86 (Dec. 24, 1960–Jan. 13, 1961; Peng Zhen attends; the 1961 plan; the summary on rectifying the communes and certain policies; in 1961 every commune and brigade to rectify on the key link of the twelve articles, the "five winds" (communism, exaggeration, blind command, cadre privilege, coercion) corrected, the "levelling and transfers" (so the page''s note) reckoned and repaid; Mao: a wave of investigation, 1961 a year of seeking truth from facts)'
- cite:
    id: cal.1960-12-26.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86–87 (Dec. 26, 1960; the 224th meeting; Peng Zhen there; grain transfers and foreign trade; Peng: concealed output is the provinces keeping something back to arrange livelihood; no new tricks, grain buying in hand; the grain the masses "steal" home declared theirs; surplus found in clearing stores left to them; county papers to every three or five days for want of paper, provincial papers to go on)'
- cite:
    id: cal.1960-12-27.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 87 (Dec. 27, 1960, afternoon; Peng Zhen, with Chen Yun, Deng Xiaoping, He Long, Li Fuchun, Li Xiannian, Bo Yibo and others, at Zhou''s meeting on the State Council''s organization and staff)'
- cite:
    id: cal.1960-12-27.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 87 (Dec. 27, 1960, evening, the Yinian Tang; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries, hearing the work conference''s groups)'
- cite:
    id: cal.1960-12-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 88 (Dec. 29, 1960, 10:10 p.m. to 1:45 a.m.; Peng Zhen at Mao''s enlarged Standing Committee on Laos and on cadres; Luo Ruiqing and Wei Guoqing there)'
- cite:
    id: cal.1960-12-30.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 88 (Dec. 30, 1960, morning; Peng Zhen at the airport to see Zhou off with the friendship delegation to Burma)'
- cite:
    id: cal.1960-12-30.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 88 (Dec. 30, 1960, afternoon, the Yinian Tang; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries, hearing Song Renqiong (the page''s note: first secretary of the Northeast Bureau) and Li Xuefeng (first secretary of the North China Bureau) on the Northeast and North China groups)'
- cite:
    id: cal.1960-12-31.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 89 (Dec. 31, 1960; Peng Zhen, with Luo Ronghuan and Li Fuchun, at Deng Xiaoping''s meeting on the handling of certain cadres)'
- cite:
    id: cal.1961-01-03.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (Jan. 3, 1961, evening; Peng Zhen accompanies Mao in meeting Llanusa)'
- cite:
    id: cal.1961-01-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (Jan. 3, 1961, 10:20 p.m. to 1:30 a.m.; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries, hearing Li Fuchun on the 1961 plan)'
- cite:
    id: cal.1961-01-04.china-leadership-11
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (Jan. 4, 1961, morning; the 225th meeting; Peng Zhen there; Li Weihan on Tibet)'
- cite:
    id: cal.1961-01-04.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (Jan. 4, 1961, afternoon; Peng Zhen at the work conference''s plenary, Liu Shaoqi presiding, hearing Li Fuchun''s report on the 1961 plan)'
- cite:
    id: cal.1961-01-05.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (Jan. 5, 1961; Peng Zhen at the Secretariat hearing Yang Jingren on work in Tibet)'
- cite:
    id: cal.1961-01-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90 (received by Peng Zhen Jan. 6, 1961; Mao''s addition "一边抓群众生活" and his comment: "这是一个好文件，全国三类社都应照此执行")'
- cite:
    id: cal.1961-01-09.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 90–91 (Jan. 9, 1961; Peng Zhen at the Secretariat on the work conference''s papers)'
- cite:
    id: cal.1961-01-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91 (Jan. 9, 1961, afternoon; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries, hearing the bureaus and discussing the draft "Three main rules of discipline and eight points for attention for Party and government cadres" and the Ninth Plenum)'
- cite:
    id: cal.1961-01-12.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91 (Jan. 12, 1961, morning; the 229th meeting; Peng Zhen there; Deng''s draft report to the Ninth Plenum on the Moscow meeting adopted, the plenum''s agenda arranged; Peng: steel set at 19 million tons this year, Bo Yibo (so the page''s note) to see to it without hurting agriculture, coal too; Stalin''s error of confusing the two kinds of contradiction)'
- cite:
    id: cal.1961-01-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91 (Jan. 12, 1961, evening; Peng Zhen at Mao''s meeting of the Standing Committee and the plenum''s group heads on the plenum''s arrangements, hearing Zhou on his visit to Burma and on Laos)'
- cite:
    id: cal.1961-01-13.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91 (Jan. 13, 1961, morning; Peng Zhen at the plenary hearing Mao on investigation and seeking truth from facts; when Mao says industry should seek quality, specifications and variety, not quantity, Peng interjects: productivity low for three reasons, too many non-productive staff, too many trainees and apprentices, the low technique of the "small native and foreign groups")'
- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91–92 (Jan. 14–18, 1961; Peng Zhen attends; Deng''s report on the Moscow meeting adopted; Li Fuchun''s report on the 1960 plan and the main 1961 targets; the eight-character line, "adjust, consolidate, fill out, raise"; capital construction cut, heavy industry slowed, agriculture strengthened; the twelve-article letter carried out; the six regional bureaus (so the page''s note) approved; on the 18th Mao calls for investigation, 1961 a year of investigation; Liu Shaoqi on the Moscow meeting, Chen Yun on markets and grain)'
- cite:
    id: cal.1961-01-15.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 92 (Jan. 15, 1961, evening; Peng Zhen, with Liu Shaoqi and Deng Xiaoping, meets and dines Sharkey, general secretary of the Australian party)'
- cite:
    id: cal.1961-01-15.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 92 (Jan. 15, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing the plenum''s groups)'
- cite:
    id: cal.1961-01-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 92–93 (Jan. 16, 1961; the 230th meeting; Peng Zhen there, Zhou Enlai and Chen Yun attending; the Finance and Trade Office''s request on grain contracting for 1961–62; Peng: contracts must rest on a middling harvest; last year a disaster, a few liang a day now, contracting on present levels would be too low and broken after autumn; the twelve articles, against the "five winds," repayment, private plots up to 7 percent: if these are honored it will be well; grit the teeth a few months, steady the communes'' production)'
- cite:
    id: cal.1961-01-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 17, 1961, afternoon; Peng Zhen, with Zhou, meets Spiro Koleka, First Deputy Chairman of the Council of Ministers, and the Albanian government economic delegation)'
