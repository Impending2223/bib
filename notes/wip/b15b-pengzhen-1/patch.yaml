    id: cal.1960-10-04.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 63 (Oct. 4, 1960, evening; the delegation at the Embassy on Deng''s speech for the next day; the Center''s instruction: the errors in the Soviet draft to be refuted forcefully before counter-proposals)'
- cite:
    id: cal.1960-10-05.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 63 (Oct. 5, 1960, 2 p.m.; Peng Zhen at the third session; after Lê Duẩn, Deng speaks seventy minutes; then the Czechoslovak and Polish delegates)'
- cite:
    id: cal.1960-10-05.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 63 (Oct. 5, 1960, 8 p.m. to 1 a.m.; Peng Zhen, with Deng Xiaoping and Yang Shangkun, talks with Escalante, executive secretary of Cuba''s Popular Socialist Party)'
