      thread: china-leadership
      c: 'Peking 北京. Peng Zhen 彭真, with Yang Shangkun 杨尚昆, hears Li Weihan 李维汉, Xu Bing 徐冰 and Ping Jiesan 平杰三 on the united front forum: the national bourgeoisie, Chairman Mao says, mostly reformable; in the disaster years no meat, little cloth, too little care, but they did not make trouble; relations improved at once, material care after the harvest; posts kept or raised, the wrongly treated restored, their children to the army on their merits; unpaid fixed interest paid; a symposium on the 1911 Revolution''s fiftieth anniversary at Wuhan, not academic only; the Socialist Institute kept, some lamas taken.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 142. Made public: 2012. See [[cal.1961-06-15.china-leadership-12]]. Names: Peng Zhen.'
