    id: cal.1962-05-05.china-leadership
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the meeting an enlarged Politburo Standing Committee, Liu Shaoqi presiding ("出席刘少奇主持的中共中央政治局常委扩大会议")
    at: IV, 194
- cite:
    id: cal.1962-05-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 194–195 (May 7–11, 1962 (the "May conference"); Peng Zhen attends; the Central Finance and Economics Group''s draft report on the 1962 adjustment plan; the decision to carry out the eight-character line by a sweeping adjustment, agriculture, light and heavy industry in order, the industrial front shortened, town population and staff cut, the market supplied, inflation stopped; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Li Fuchun, Li Xiannian, Yao Yilin and Deng Zihui speak)'
- cite:
    id: cal.1962-05-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 195 (May 12, 1962, afternoon; the 320th meeting; Peng Zhen there, Zhou attending; Liu Lantao on the flight of Xinjiang''s border minorities into the Soviet Union and the line for handling it; Li Fuchun and Li Xiannian to relay the May conference to central cadres of division head and up)'
- cite:
    id: cal.1962-05-15.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 196 (May 15, 1962, afternoon; the 321st meeting; Peng Zhen there; state farms, supply and marketing cooperatives, fishing)'
- cite:
    id: cal.1962-05-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 196 (May 17, 1962, afternoon; the 322nd meeting; Peng Zhen there, Zhou attending; the united front and nationalities work conferences reported; the United Front Department to write a report and draft comment; Ulanhu''s, Li Weihan''s, Xu Bing''s and Liu Chun''s (the page''s note: deputy head of the United Front Department and vice-chairman of the Nationalities Commission) report agreed; the pastoral communes'' rules revised; Xie Fuzhi to settle the placing and return of those drifted into Qinghai; Peng: autonomous prefectures and counties not lightly abolished; dead rightists who reformed well to have the label removed, the living too)'
- cite:
    id: cal.1962-05-21.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 196 (May 21, 1962, afternoon; the 323rd meeting; Peng Zhen there, Zhou attending; the notice on propaganda for cutting staff and town population revised and adopted, the Propaganda Department to draft the points for cadres and peasants; on the Education Ministry''s report Peng: good; few of the very big schools run well, rules needed; quality raised, teachers examined)'
- cite:
    id: cal.1962-05-22.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 196–197 (May 22, 1962, afternoon; the 324th meeting; Peng Zhen there, Zhou attending; the Education Ministry''s report agreed, the decision on cutting staff and town population adopted, Ma Wenrui to revise it for Zhou; Peng: why count teachers'' service only from 1949? Zhou: it should count)'
- cite:
    id: cal.1962-05-23.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 197 (May 23, 1962; Peng Zhen at Liu Shaoqi''s meeting with the political and legal group; Peng: the lesson of these years the failure to keep the two kinds of contradiction apart; public security, procuracy and courts each to its duty, under the law)'
- cite:
    id: cal.1962-05-26.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 197 (May 26 and 28, 1962, afternoons; the 325th meeting; Peng Zhen there; the state farm regulations; Peng: farms of fixed type and staff, "精兵主义," the surplus in collective ownership and specialized teams)'
- cite:
    id: cal.1962-05-28.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 197 (May 28, 1962; the 325th meeting continued, Peng Zhen there)'
- cite:
    id: cal.1962-05-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 198–199 (May 29, 1962, afternoon; the 326th meeting; Peng Zhen there; preparing the talks with the Albanian party''s delegation; a Chinese delegation of six, Deng Xiaoping leader, Peng Zhen, Wang Jiaxiang, Liu Ningyi, Wu Xiuquan and Luo Shigao (the page''s note: Ambassador to Albania))'
- cite:
    id: cal.1962-06-03.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 199 (June 3, 1962; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, in the talks with Hồ Chí Minh; Liu on the lessons of economic construction; views exchanged on the North''s economy, South Vietnam, Laos and the international movement)'
- cite:
    id: cal.1962-06-06.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 200 (June 6, 1962, afternoon; Peng Zhen at the Politburo, Liu Shaoqi presiding, hearing Lin Biao on the military situation)'
- cite:
    id: cal.1962-06-08.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 200 (June 8, 1962, afternoon; Peng Zhen, with Deng Xiaoping, at the airport to meet the Albanian Party of Labor''s delegation led by Hysni Kapo, member of its Politburo and secretary of its Central Committee)'
- cite:
    id: cal.1962-06-11.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 200 (June 11–15, 1962; Peng Zhen, a member of the Chinese delegation, with Deng and others in several talks with Kapo''s delegation on international questions, Soviet–Albanian and Sino-Soviet relations)'
- cite:
    id: cal.1962-06-17.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 201 (June 17, 1962, afternoon; Peng Zhen, with Song Qingling, Dong Biwu, Zhu De, Deng Xiaoping and others, at Liu Shaoqi''s meeting with and banquet for the delegation)'
- cite:
    id: cal.1962-06-21.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 202 (June 21, 1962, afternoon; at Wuhan; Peng Zhen accompanies Mao in meeting and giving a banquet for all the members of the Korean Supreme People''s Assembly''s delegation)'
- cite:
    id: cal.1962-06-22.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 202 (June 22, 1962; Peng Zhen receives Mao''s letter; to stay at Wuhan to the month''s end, seven to ten days of swimming the Yangtze, then straight back to Peking; the Pakistani ambassador and Kapo''s delegation to be talked with at Wuchang; Peng to arrange (the page''s note: the Pakistani ambassador Rashidi 拉希迪 and the Albanian Party of Labor''s delegation under Hysni Kapo))'
- cite:
    id: cal.1962-06-25.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203 (June 25, 1962, evening; the meeting of more than 10,000 of the capital at the Peking Workers'' Gymnasium; Peng Zhen presides and opens it (the peoples of the world, united against U.S. imperialism''s policies of aggression and war, will win); Chen Yi and Pak Kum Chol, head of the Korean delegation, speak)'
- cite:
    id: cal.1962-06-27.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203 (June 27, 1962; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, meets the Albanian Party of Labor''s delegation; views exchanged on opposing revisionism)'
- cite:
    id: cal.1962-06-28.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203 (June 28, 1962, afternoon; Peng Zhen accompanies Zhou Enlai in meeting and giving a banquet for all the members of the Korean delegation)'
- cite:
    id: cal.1962-07-02.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203 (July 2, 1962; Peng Zhen, a member of Long Yun''s funeral committee, with Zhou Enlai at Long Yun''s home to pay condolence; Long Yun died June 27 (the page''s note: Long Yun, 1884–1962, member of the CPPCC Standing Committee and of the Kuomintang Revolutionary Committee''s Central Standing Committee))'
- cite:
    id: cal.1962-06-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 203 (June 29, 1962, evening; Peng Zhen, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping and others, at the farewell banquet given by Pak Kum Chol)'
- cite:
    id: cal.1962-07-02.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 204 (July 2, 1962, afternoon; the Secretariat''s 328th meeting; rehabilitation of cadres, the Youth League, streamlining, restoring farm output; Peng Zhen: judge cadres by their whole history and the key questions, not details; many decisions of these years made too fast; even the Chairman''s word "也不那么灵了", many questions decided under pressure without his study; the Secretariat not to throw out ideas without investigation; the grain levy at a fixed price, the price gap on purchases to be settled or the collective economy will collapse; talk of difficulties and shortcomings to stop here and turn to the positive; Deng Xiaoping: "我倾向这样")'
- cite:
    id: cal.1962-07-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 204 (July 3, 1962, afternoon; Peng Zhen at the enlarged Politburo Standing Committee, Liu Shaoqi presiding, hearing Zhou Enlai on streamlining in the Northeast, grain purchases and big enterprises'' farm and sideline production)'
- cite:
    id: cal.1962-07-06.china
    item: '[[w.peng-zhen-nianpu-1902]], IV, 204 (July 6, 1962, morning; Peng Zhen at the 56th (enlarged) session of the second NPC Standing Committee, Zhu De presiding; the resolution supporting the Korean Supreme People''s Assembly''s letter to the world''s parliaments)'
- cite:
    id: cal.1962-07-09.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 204 (July 9, 1962, afternoon; the Secretariat''s 329th meeting; Peng Zhen there; preparing the Central Work Conference of late July; a drafting committee of nine under Chen Boda, on Mao''s instruction, for the decision on consolidating the communes'' collective economy; Li Xiannian to draft the papers on market prices, grain and the system)'
- cite:
    id: cal.1962-07-09.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 9, 1962, afternoon; Peng Zhen to Yang Shangkun''s to talk)'
- cite:
    id: cal.1962-07-09.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 9, 1962, evening; Diaoyutai; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Yang Shangkun and others, at the farewell for Hồ Chí Minh, leaving the next morning)'
- cite:
    id: cal.1962-07-10.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 10, 1962, afternoon; the CPPCC auditorium; Peng Zhen, with Zhou Enlai, Deng Xiaoping and others, at the capital''s meeting for the treaty''s first anniversary)'
- cite:
    id: cal.1962-07-12.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 12, 1962, evening; the Peking Hotel; Peng Zhen, with Zhou Enlai, Deng Xiaoping and others, at the Korean Ambassador Han Ik-su''s banquet for the treaty''s anniversary)'
- cite:
    id: cal.1962-07-11.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 11–13, 1962, afternoons; Peng Zhen at the meeting Deng Xiaoping chairs, hearing Sun Zhiyuan, Zhang Liankui and Wang Bingzhang on war industry; Zhou Enlai, Lin Biao, Li Fuchun, He Long, Yang Shangkun and others there (the page''s notes: Sun, deputy director of the State Council''s National Defense Industry Office; Zhang, Vice-Minister of the Third Ministry of Machine Building; Wang, deputy commander of the air force and first deputy head of the Fifth Academy))'
- cite:
    id: cal.1962-07-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205 (July 16, 1962, morning; Peng Zhen, with Zhou Enlai, Luo Ruiqing, Xi Zhongxun and others, at the airport seeing off Chen Yi''s government delegation to the Geneva conference on Laos)'
- cite:
    id: cal.1962-07-17.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 205–206 (July 17, 1962; Peng Zhen at the Secretariat on the first draft of the decision on further strengthening the centralized unity of commercial work; July 18 and 19, at the Secretariat on the State Council Finance and Trade Office''s and the National Price Commission''s report on the market and prices)'
- cite:
    id: cal.1962-07-19.china-leadership-10
    item: '[[w.peng-zhen-nianpu-1902]], IV, 206 (July 19, 1962; the Center''s urgent notice not to advertise "output by household" and the like in the press)'
- cite:
    id: cal.1962-07-22.china-leadership-10
    item: '[[w.peng-zhen-nianpu-1902]], IV, 206 (July 22 and 23, 1962; Mao orders two papers printed for the coming Central Work Conference: the record of the symposium on consolidating the production teams'' collective economy (the page''s note: held by Tao Zhu and Wang Renzhong at Longsheng county, Guilin prefecture, Guangxi, June 7, 1962) and the draft decision on consolidating the communes'' collective economy)'
- cite:
    id: cal.1962-07-22.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 206–207 (July 22, 1962, afternoon; the Secretariat''s 330th meeting; Peng Zhen there; Deng Xiaoping relays Mao''s talk of July 19 at the Standing Committee against the central departments'' dispersionism; decided: each department a monthly report to Mao and the Standing Committee, July to December, written by its head, not a secretary, the first to the General Office by the month''s end, handwritten; important questions to them at any time by letter or note, not by bulletins; the Secretariat''s meetings a bulletin to them besides the minutes; for now no debate on policy in the open press)'
- variant:
    id: cal.1962-07-22.china-leadership-6
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the Secretariat's 330th meeting in the afternoon ("下午"), after Peng Zhen's report to the graduates in the morning
    at: IV, 206
- cite:
    id: cal.1962-07-23.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 207 (July 23, 1962, afternoon; the Secretariat''s 331st meeting; Peng Zhen there, Zhou Enlai attending; the Finance and Trade Office''s draft report on grain for the Central Work Conference; Peng Zhen: grain policy not to make honest men lose, not to whip the fast ox; streamlining of some cities'' townspeople to be pressed)'
- cite:
    id: cal.1962-07-26.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 207 (July 26, 1962, afternoon; the Secretariat''s 332nd meeting; Peng Zhen there; the Central Work Conference''s agenda)'
- cite:
    id: cal.1962-07-28.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 208 (July 28, 1962, afternoon; Peng Zhen at the meeting Mao chairs, of the Standing Committee, the regional bureaus'' first secretaries, Wang Renzhong, Chen Boda, Luo Ruiqing and others; Mao: the common question at home and abroad, whether the proletariat or the bourgeoisie leads; after the Seven Thousand, signs of the right in the Party, "output by household" among them, some sound, some "牛鬼蛇神"; signs of the right in foreign work too)'
- cite:
    id: cal.1962-07-28.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 208 (July 28, 1962, afternoon; Peng Zhen at the meeting Deng Xiaoping chairs, Zhou Enlai, Li Fuchun, Li Xiannian and others there, on the Finance and Trade Office''s revised report on grain for the Central Work Conference)'
- cite:
    id: cal.1962-07-30.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 208–209 (July 30–Aug. 24, 1962; Peng Zhen helps Zhou Enlai run the city work conference, called by the Politburo: the heads of seven State Council departments and of eight great cities (Peking, Tianjin, Shanghai, Wuhan, Canton, Chongqing, Shenyang, Xi''an), 25 in all; drafts the Center''s directive on current questions of city work, ten points: save grain, cut workers, withdraw currency, cut spending, cut losses, settle arrears, restore output, reduce stocks, more goods, better living; July 31, morning, it hears Wan Xiaotang on Tianjin (the page''s note: secretary of the Hebei committee''s Secretariat and first secretary of the Tianjin committee))'
- cite:
    id: cal.1962-07-30.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 208 (July 30, 1962, evening; Peng Zhen sits in at Mao''s Standing Committee, hearing Chen Yi on the Geneva conference on Laos and his meeting with Menon)'
- cite:
    id: cal.1962-08-01.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 209 (Aug. 1 and 2, 1962, mornings; Peng Zhen at the city work conference, hearing Liu Ren on Peking''s industry and commerce: a loss of 56.61 million yuan in the first half, allocated materials dearer and products not, the state not making it good; Peng Zhen breaks in: prices to be studied whole, set by the law of value; "these years our relations with the workers have been tense"; the Party cut off from workers and peasants and soldiers'' families, the consequences grave)'
- cite:
    id: cal.1962-08-03.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 209 (Aug. 3, 1962, evening; Peng Zhen, with Chen Boda and Yang Shangkun, sits in at Mao''s Standing Committee on how to run the Central Work Conference; a central (core) group of 22 set up: Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Tan Zhenlin, Chen Yi, Chen Boda, Luo Ruiqing, Xie Fuzhi, Gu Mu, Lu Dingyi, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Song Renqiong, Li Xuefeng, Liu Lantao)'
