- cite:
    id: cal.1961-06-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 136 (June 29, 1961; Peng Zhen at the Politburo, Liu Shaoqi presiding, on Liu''s speech for the fortieth anniversary)'
- cite:
    id: cal.1961-06-30.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 136–137 (June 30, 1961, evening; Peng Zhen, with Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and others, at the rally of more than 10,000; Liu speaks)'
- cite:
    id: cal.1961-07-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 137 (July 3, 1961; the 261st meeting; Peng Zhen there, Zhou attending; Li Fuchun on cutting staff and the town population; enterprises put in order, cadres retrained; Peng: prices to be steady, not to follow the free market)'
- cite:
    id: cal.1961-07-03.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 137 (July 3, 1961, evening; Peng Zhen, with Yang Shangkun, receives Chervonenko: the CPSU''s telegram asks that Chen Yi, passing through Moscow from Geneva, stop a day or two to exchange views on France, Laos and other questions)'
- cite:
    id: cal.1961-07-03.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 137 (July 3, 1961; Peng Zhen asks Zhou and Mao, agrees with the Soviet side, and cables Chen Yi)'
- cite:
    id: cal.1961-07-06.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 137 (July 6, 1961, afternoon; Peng Zhen at the Politburo, Liu Shaoqi presiding, on Nie Rongzhen''s report on the present work of the natural science research institutions and the draft "Fourteen points" of the State Science Commission and the Academy of Sciences Party groups)'
- cite:
    id: cal.1961-07-10.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 10, 1961, morning, Peng Zhen at the airport with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others to welcome Kim Il Sung''s Party and government delegation; afternoon, with Deng, accompanies Liu and Zhou in meeting it, then at the talks of Liu''s delegation with Kim''s, with Zhou, Deng, Chen Yi, Li Fuchun, He Long and Luo Ruiqing; July 11, afternoon, at the signing of the treaty of friendship, cooperation and mutual assistance)'
- cite:
    id: cal.1961-07-10.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 10, 1961, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, at the banquet)'
