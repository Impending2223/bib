- cite:
    id: cal.1961-05-02.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 125 (May 2, 1961, afternoon; the 252nd meeting; Peng Zhen there, Zhou attending; the Geneva conference and Laos; the Center''s village investigation groups to be back in Peking by May 8 to give material to the regulations'' drafting committee)'
- cite:
    id: cal.1961-05-04.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 125 (May 4, 1961; at Shunyi Peng Zhen and Deng Xiaoping hear the Center''s five investigation groups)'
- cite:
    id: cal.1961-05-04.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 125–126 (May 4, 1961; with the Peking committee''s group, Liu Ren, Li Qi (the page''s note: head of the committee''s propaganda department) and the county secretaries; on the supply system Peng: two views, aid only for "five guarantee" and needy households, or keep supply at three to seven or two to eight; Liu Ren on Dahongmen 大红门 brigade, 1960: of 151 households 19 landlords and rich peasants and 55 who seldom worked took most of the 190,000 yuan; aid to three and three households would cost 1,500 yuan and raise the work point from 0.8 to over 1.3 yuan; Deng: supply against the class line, dropped; on mess halls Peng: "完全自由，完全自愿", 2 percent of the vegetable land to the mess hall, its accounts separate)'
- cite:
    id: cal.1961-05-10.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 128 (May 10, 1961; Peng Zhen and Deng Xiaoping to Miyun county on the ownership of hills and quicker afforestation)'
- cite:
    id: cal.1961-05-10.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 128–129 (May 10, 1961; a letter; the communes and teams near Peking adjusted, communes of about 10,000, brigades by village, teams of about fifty households; grain bought nine tenths of the contract and four tenths of the surplus; the supply system "带有平均主义性质，害处很多", aid only for the "five guarantee" and needy; teams keeping "three contracts and a bonus" gained output every year; mess halls wholly voluntary, their accounts apart; tools and, at a price, animals to the teams; handicrafts, sidelines and supply cooperatives restored)'
- cite:
    id: cal.1961-05-13.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 129 (May 13, 1961; Mao''s comment: send the letter to the regional bureaus and the provincial committees for reference)'
- cite:
    id: cal.1961-05-13.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 129 (May 13, 1961, morning; the 254th meeting; Peng Zhen there; preparations for the Party''s fortieth anniversary, the revision of the draft commune regulations, rectification in industry)'
- cite:
    id: cal.1961-05-14.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 130 (May 15, 1961, afternoon, the 255th meeting, hearing Chen Guodong on grain, Zhou and Chen Yun attending; May 17, the 256th, hearing the ten village investigation groups sent to Henan, Gansu, Shandong and Heilongjiang; Peng Zhen at both)'
- cite:
    id: cal.1961-05-15.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 130 (May 15, 1961, afternoon; Peng Zhen at Mao''s enlarged Standing Committee on the villages and the government delegation to the Geneva conference on Laos)'
- cite:
    id: cal.1961-05-20.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 130 (May 20, 1961, morning; the 257th meeting; Peng Zhen there, Zhou attending; Bo Yibo on the industry and transport symposium)'
- cite:
    id: cal.1961-05-21.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 130 (May 21–June 12, 1961; Peng Zhen attends; the regulations revised and adopted on the leaders'' investigation, the supply system ended, mess halls "完全由社员讨论决定," voluntary, self-run, free to leave; the revised draft regulations, the "Forty Articles" on commerce and the "Thirty-five Articles" on handicrafts; nine measures to cut the urban population by over 20 million in three years, 10 million this year; this year''s steel cut from 18 million tons to 11 million; Peng meanwhile on coal and rectification with those concerned)'
- cite:
    id: cal.1961-05-21.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 131 (May 21, 1961, noon; Peng Zhen gives a lunch for the Algerian Communist Party''s delegation)'
