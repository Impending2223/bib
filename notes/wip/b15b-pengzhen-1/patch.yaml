- cite:
    id: cal.1961-06-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 134 (June 16, 1961, evening; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, accompanies Mao in meeting and dining Aidit and the PKI delegation)'
- cite:
    id: cal.1961-06-17.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 134–135 (June 17, 1961; the 259th meeting; Peng Zhen there, Zhou attending; adjusting industry, shortening its front, cutting the town population, coal; Peng: these years advance and retreat without an overall plan; heavy industry overdone, agriculture and light industry to rise, but heavy industry''s retreat planned, not rash; many light industries have no raw materials; in coal not labor but equipment short)'
- cite:
    id: cal.1961-06-19.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 135 (June 19, 1961, morning; the 260th meeting; Peng Zhen there; adopted: the revised draft commune regulations, the handicraft and commerce regulations, the nine measures on cutting the town population and its grain, the provisions on correcting "levelling and transfer" and repaying, on forest rights, a directive on Kangda-style political schools and the notice on placing the 1961 school graduates; Peng: prices set by value and by supply and demand, not raised at will; not every primary graduate to middle school, still less every senior graduate to university, universal junior middle school a matter of five to ten years; for the Japanese Communist Party Diet members'' request for a joint communiqué, an NPC delegation to talk and sign, Peng to handle it)'
- cite:
    id: cal.1961-06-20.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 136 (June 20, 1961, noon; Peng Zhen, with Liu Shaoqi, Zhu De, Deng Xiaoping and Dong Biwu, meets and dines the Japanese Communist Diet members'' delegation)'
