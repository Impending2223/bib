    item: '[[w.peng-zhen-nianpu-1902]], IV, 10 (Mar. 22, 1960, at 8:30 p.m., after the meeting at the Jurentang; Peng Zhen presides at the telephone conference and explains to the leaders of the provinces, municipalities and autonomous regions how the Congress will be held and the speeches prepared)'
- variant:
    id: cal.1960-03-22.china-leadership-8
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the telephone conference opens at 8:30 p.m. ("于八时三十分")
    at: IV, 10
- cite:
    id: cal.1960-03-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 10 (Mar. 23, 1960; the 174th meeting; Peng Zhen there; the supplementary plan for the last three years of the Second Five-Year Plan (1960–62) and the steel industry''s construction plan for the next three years; Zhou Enlai and Bo Yibo attend)'
