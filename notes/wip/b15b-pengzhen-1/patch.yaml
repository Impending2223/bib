    item: '[[w.peng-zhen-nianpu-1902]], IV, 115 (Mar. 29–31, 1961; Peng Zhen at the General Office''s report meeting in the Huairen Tang hearing Deng relay the Canton work conference)'
- cite:
    id: cal.1961-04-03.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 116 (Apr. 3, 1961, morning; the 243rd meeting; ten work groups to the Northeast, North China, the Northwest, Henan, Shandong, Sichuan and elsewhere; Deng and Peng to Shunyi and Huairou in the Peking suburbs; Peng: the two egalitarianisms and the style of work, as pupils, not doing the cadres'' work for them)'
- cite:
    id: cal.1961-04-03.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 116–117 (Apr. 3, 1961; Peng Zhen at the NPC Standing Committee''s thirty-seventh enlarged session hearing Zhou on the situation; the treaty of friendship with Indonesia ratified)'
