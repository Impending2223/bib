    item: '[[w.peng-zhen-nianpu-1902]], IV, 132 (June 6, 1961, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Dong Biwu and others, meets and dines Aidit and his party)'
- cite:
    id: cal.1961-06-06.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 132 (June 6, 1961, morning; Peng Zhen at the plenary on Zhou''s nine measures on grain: grain contracts flexible, lest the Party break faith after autumn; imported grain not to be counted on, foreign exchange spent on it crowding out alloy steel; the farms short of labor not, but of the Sixty Articles carried out; industry overstaffed, one mine designed for 2,000 now 11,000; Deng interjects: hold down staff and the wage bill; the 21 million industrial workers alone cannot give the cut; cutting people will anger heaven and men, but must be done)'
- cite:
    id: cal.1961-06-08.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133 (June 8, 1961; Peng Zhen at Mao''s enlarged Standing Committee with the regional first secretaries; Mao on understanding socialism)'
