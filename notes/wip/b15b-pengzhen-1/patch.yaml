    id: cal.1961-04-07.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 118 (Apr. 7, 1961, morning; the 245th meeting; Peng Zhen there; Gu Mu on industry in the second quarter, Li Xiannian on foreign trade and grain)'
