      date: '1961-02-19'
      place: peking
      thread: china-leadership
      c: 'Peng Zhen 彭真 to the Politburo Standing Committee, by written report, on industry, the market, finance and banking, "very bad ... hiding danger": grain extremely tight to the summer harvest, imports no answer; the idle to eat less for the workers, grain for the draft animals; January revenue half last year''s, the cash gap 1.2 billion yuan, the note issue at its ceiling, retail sales down 2.3 billion; two years of disaster and "man-made calamity" in places; light industry to be pressed with coal; coal up by mid-March.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 104–105. "现在的工业生产和市场、财政、金融情况很不好，也可以说是潜藏着危险的" (IV, 104). Made public: 2012. Names: Peng Zhen.'
