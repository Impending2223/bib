      c: 'The Peking municipal committee 北京市委 reports to the Center and Mao Zedong 毛泽东 on the urban people''s communes: 25 set up; 260,000 of the 330,000 street residents out of work or school (79 percent) organized in production; 220,000 in mess halls, 110,000 children in nurseries; members'' pay about 23 yuan a month, new members 15; output 170 million yuan in the first quarter; the rest to be brought in, to 90 and then about 95 percent.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 19–20. Made public: 2012. To check: 中共北京市委关于城市人民公社工作情况的报告 (Apr. 20, 1960; named by [[w.peng-zhen-nianpu-1902]], IV, 19–20). Names: Mao Zedong.'
