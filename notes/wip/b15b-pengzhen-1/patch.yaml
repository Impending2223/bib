    at: IV, 43
- cite:
    id: cal.1960-07-01.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 43 (July 1, 1960; Peng Zhen and Deng Xiaoping meet Ruslan, the Indonesian delegate to the WFTU council and a member of the PKI''s Politburo, and tell him of the Bucharest meeting and the Sino-Soviet differences)'
- cite:
    id: cal.1960-07-01.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 43–44 (July 1, 1960, afternoon; Peng Zhen at the Secretariat on the answer to the CPSU''s "Notification" of June 21 (so the page''s note))'
- cite:
    id: cal.1960-07-02.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 44 (July 2, 1960, afternoon; Peng Zhen at the Secretariat on answering the CPSU''s proposal of a drafting committee for the parties'' meeting)'
- cite:
    id: cal.1960-07-02.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 44 (July 2, 1960, evening; Peng Zhen, with Chen Yi, Chen Boda, Kang Sheng and others, to Tianjin, and reports to Mao on the special train on the Bucharest meeting)'
- cite:
    id: cal.1960-07-04.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 44 (July 4, 1960, morning; the 196th meeting; Peng Zhen there; Deng Xiaoping on the situation abroad and at home and the latest in the two parties'' differences; the secretaries of the central organs'' Party groups sitting in)'
- cite:
    id: cal.1960-07-05.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 44–45 (July 5–Aug. 10, 1960; Peng Zhen attends; the measures for industrial production in the third quarter, the Center''s directives on agriculture and grain and on economy centered on grain and steel adopted; capital construction cut; no more "two books" of the plan, nothing outside it; the notice on telling Party members of Bucharest; the regional bureaus; July 5, afternoon, at Mao''s enlarged Standing Committee, Peng reports on Bucharest; Mao: the quarrel abroad settled by the work at home; industry and agriculture not through the pass; shorten the front, a battle of annihilation, three to five years)'
- cite:
    id: cal.1960-07-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 45 (July 7, 1960, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Ke Qingshi, Li Jingquan, Tao Zhu and others, at Mao''s meeting on the world and Sino-Soviet relations)'
- cite:
    id: cal.1960-07-08.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 45–46 (July 8, 1960, afternoon; Peng Zhen''s report on the talks and the Bucharest meeting: the Center''s line, unity through criticism or struggle to a new unity, "后发制人，留有余地"; reconnaissance turned into an encounter battle; three steps: objection, refutation with their own view, the facts; Khrushchev''s "father party" shown; the Center''s three last moves: amendments, a signature with reservations, a statement; the struggle long and hard, a contradiction among the people, to be waged "有理、有利、有节")'
- cite:
    id: cal.1960-07-10.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46 (July 10, 1960, evening; Peng Zhen sits in at Mao''s Standing Committee, which hears Ke Qingshi, Li Jingquan and Tao Zhu on the group discussions and takes up the world and Indonesia''s anti-Chinese acts; Zhou to report on the Comintern and the Chinese party)'
- cite:
    id: cal.1960-07-14.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46 (July 14–16, 1960; Peng Zhen at the plenary sessions hearing Zhou''s report on the Comintern and the Chinese Communist Party, its history from 1919 to 1943 and its influence on the Chinese revolution)'
- cite:
    id: cal.1960-07.china
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46 (July 16, 1960; Sudarikov, the Soviet chargé d''affaires, hands Zhang Hanfu, Vice Foreign Minister, the Soviet government''s note recalling its experts and advisers, the military among them)'
- cite:
    id: cal.1960-07.china
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46–47 (on July 25, 1960, without waiting for China''s answer, the Soviet side gives notice that all its experts will leave between July 28 and Sept. 1; the page''s note: from July 28 to Sept. 1, 1,390 experts recalled, over 900 not sent, 343 contracts and supplements torn up, 257 scientific and technical projects ended)'
- cite:
    id: cal.1960-07-25.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 46–47 (July 25, 1960; the notice given before China answers; all experts to leave between July 28 and Sept. 1)'
- cite:
    id: cal.1960-07-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 18, 1960, afternoon; Peng Zhen at the plenary hearing Li Fuchun on the economic plan)'
- cite:
    id: cal.1960-07-19.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 19, 1960; the 197th meeting; Peng Zhen there; Zhou Yang''s draft report to the Third Congress of Writers and Artists and the draft list of its presidium adopted in the main)'
- cite:
    id: cal.1960-07-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 20, 1960, afternoon; Peng Zhen at Mao''s enlarged Standing Committee hearing the work conference''s groups on this year''s output and discussing the world and production)'
- cite:
    id: cal.1960-07-22.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 22, 1960, morning; Peng Zhen at the Secretariat on Lu Dingyi''s greetings for the Center and the State Council to the Third Congress of Writers and Artists)'
- cite:
    id: cal.1960-07-22.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 22, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Song Qingling, Deng Xiaoping and others, at the opening; with them receives the presidium)'
- cite:
    id: cal.1960-07-23.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 47 (July 23, 1960, afternoon; Peng Zhen accompanies Mao, Liu Shaoqi, Zhu De, Deng Xiaoping and others in receiving all the delegates)'
