    id: cal.1961-07-12.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 11, 1961; Peng Zhen, with Zhou Enlai, Deng Xiaoping and others, accompanies the Korean delegation at the opera evening of the Culture Ministry and the China–Korea Friendship Association)'
- variant:
    id: cal.1961-07-12.china-leadership-3
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the opera evening on July 11, after the treaty's signing ("十一日下午 ... 又和周恩来、邓小平等陪同朝鲜党政代表团出席文化部和中朝友好协会举行的歌剧晚会")
    at: IV, 139
- cite:
    id: cal.1961-07-12.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 12, 1961, morning; Peng Zhen, with Zhou Enlai, Deng Xiaoping and others, at the meeting of more than 10,000 in the Great Hall welcoming Kim Il Sung and celebrating the treaty, and speaks: the treaty the crystal of the two peoples'' unity and fighting friendship, a new milestone)'
- cite:
    id: cal.1961-07-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 12, 1961, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, at the Korean chargé d''affaires'' banquet)'
- cite:
    id: cal.1961-07-13.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139 (July 13, 1961, early morning; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, at the airport to see Kim off to the provinces)'
- cite:
    id: cal.1961-07-12.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 139–140 (July 12, 1961, afternoon; the 262nd meeting; Peng Zhen there, Zhou attending; making sure two thirds of the Anshan steel works'' smelting equipment works, and the coal allotment, coal output having fallen to 400,000-odd tons a day; Peng: the high targets were not seeking truth from facts, and planning by agriculture, light and heavy industry must be so too)'
- cite:
    id: cal.1961-07-13.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 140 (July 13, 1961, morning; the 263rd meeting; Peng Zhen there; adjusting the colleges; Peng: train teachers, better textbooks; key schools are about quality, not numbers, Tsinghua may take fewer; key schools need not have every specialty; the new teachers not yet past the old in learning, the old to lead, the young''s pride corrected; research by individual effort, fewer collective activities, labor as punishment illegal, time to read)'
- cite:
    id: cal.1961-07-18.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 140–141 (July 18, 1961, afternoon; the 264th meeting, Peng Zhen presiding; propaganda for the revised commune regulations and political departments in the Communications Ministry''s water transport; Peng: some errors in agriculture fundamental, ownership unsettled by the "communist wind" and "levelling and transfer," the size of communes and the supply system; others particular, pig raising, mess halls; the commune itself affirmed; some faults the Center''s rules, some in carrying them out, "一平二调" not the Politburo''s; the regulations carried out by three-level cadre meetings, not the press, as land reform and the opium ban were never in the papers; the revised draft not published, the basic policies may be explained)'
- cite:
    id: cal.1961-07-20.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 141–142 (July 20, 1961; Peng Zhen, with Yang Shangkun, hears Qian Ying on the central control work forum; Peng: reviews for cadres who erred in work, not for degenerates (the page''s note: the work conference''s summary on rectifying communes treats landlords, rich peasants, counterrevolutionaries, bad elements and degenerates as enemies); production the center of work in the villages, control work to serve it; the central commission''s cases as models, the rest for the regional bureaus and provinces; laws and rules, not too rigid for so large a country)'
- cite:
    id: cal.1961-07-20.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 142 (July 20, 1961, continued; Peng: a few principles rather than rigid rules; reviews to cover the last few years, some cases of 1957 and 1958 among them; the "left" and "right" labels on cadres not off production removed and no more pinned; the chief contradiction now between bourgeoisie and proletariat, without the "three antis" and the anti-rightist struggle the country would be lost; control cadres upright, clear-headed, of strong Party spirit)'
- cite:
    id: cal.1961-07-21.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 143 (July 21, 1961, afternoon; Peng Zhen, with Tan Zhenlin and Yang Shangkun, hears the Party group of the Federation of Trade Unions on the provincial union chairmen''s meeting and receives the chairmen; no unions in the communes'' collective enterprises, seasonal, lest the peasants be split; the enterprises'' political departments not merged with the unions, which are independent and elected; "supervision by the masses," not unions supervising the administration; the talk of "the withering away of the unions" in the leap and their absorption into the urban communes a confusion, the Secretariat''s fault; production, livelihood, education)'
- cite:
    id: cal.1961-07-23.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 143 (July 23, 1961, evening; Peng Zhen and Yang Shangkun to Zhou''s to talk of work)'
- cite:
    id: cal.1961-07-24.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 143 (July 24, 1961; Peng Zhen, with Yang Shangkun, receives Chervonenko, who hands over the draft CPSU program for the Twenty-second Congress with a Chinese translation)'
- cite:
    id: cal.1961-07-25.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 143 (July 25, 1961; the 265th meeting; Peng Zhen there; Deng on his tour of the Northeast, July 14–23; industry, farming and grain; Zhou on the international situation)'
- cite:
    id: cal.1961-07-28.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 144–145 (July 28, 1961, afternoon; the 267th meeting; Peng Zhen there; Bo Yibo explains the draft regulations on the management of state industrial enterprises (the "Seventy Articles on industry"); current industry)'
- cite:
    id: cal.1961-07-29.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 145 (July 29, 1961, afternoon; the 268th meeting; Peng Zhen there; Jiang Nanxiang explains the first draft of the provisional regulations for the colleges under the Education Ministry (the "Sixty Articles on higher education"))'
- cite:
    id: cal.1961-07-26.china-leadership
