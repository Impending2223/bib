      c: 'The Great Hall of the People 人民大会堂, Peking 北京. Peng Zhen 彭真 speaks to more than 20,000 of the year''s graduates of Peking''s colleges and technical schools: choose the socialist road, work for the 650 million; study Marxism-Leninism and Mao Zedong Thought, join the workers and peasants, become intellectuals of the working class; personal wishes and the country''s needs; take history''s necessary road.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 206. Printed in the *Selected Works of Peng Zhen* 《彭真文选》 as "Take history''s necessary road of one''s own accord" 《自觉地走历史必由之路》 (IV, 206). The words: 上午 (IV, 206). Names: Peng Zhen.'
