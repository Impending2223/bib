      c: 'Peking 北京. Peng Zhen 彭真 reports on agriculture and the villages to the Peking municipal committee''s 北京市委 work conference: repayment of the "levelling and transfer" by the masses, not by state loans, "否则''六十条''是空的"; the suburbs'' 17,000 square kilometers and 2.8 million people, first 800 jin of grain and a pig a head, the hills afforested, 230 dry rivers dredged; investigation and the mass line, his inaugural editorial for *Qianxian* 《前线》 of 1958 reprinted for the meeting; the first secretary a member of the collective leadership, great matters decided together.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 138–139. The third part printed in the *Selected Works of Peng Zhen* 《彭真文选》 as "Keep to investigation and the mass line" 《坚持调查研究和群众路线》 (IV, 139). The words: 上午 (IV, 138–139). Made public: 2012. Names: Peng Zhen.'
