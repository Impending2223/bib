    id: cal.1961-05-21.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 131 (May 21, 1961, evening; Peng Zhen tells Yang Shangkun by telephone that the Standing Committee has decided that for three days from the 22nd the conference reads papers in the morning and meets in groups in the afternoon)'
- cite:
    id: cal.1961-05-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 131 (May 23, 1961; Peng Zhen at Mao''s enlarged Standing Committee with the regional first secretaries; Mao on full repayment)'
