    id: cal.1960-04-22.china-leadership-12
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960, morning; the 180th meeting; Peng Zhen there; Zhang Jingwu on work in Tibet, decisions taken; on the Tibet Work Committee''s request for more cadres, Peng: not too many)'
- cite:
    id: cal.1960-04-22.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960, afternoon, the Great Hall of the People; Peng Zhen presides; Zhu De, Lin Biao, Deng Xiaoping, Song Qingling, Lin Boqu, Dong Biwu and 10,000 cadres and others there; Lu Dingyi''s report)'
