    id: cal.1961-03-04.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 109 (Mar. 4, 1961; Peng Zhen and Deng Xiaoping fly to Canton with Zhou to report to Mao at the Xiaodao guesthouse (the nianpu: in the morning))'
- cite:
    id: cal.1961-03-04.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 109 (Mar. 4, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee on the world, the drafting of the commune regulations and the Soviet offer of grain on loan and Cuban sugar)'
- cite:
    id: cal.1961-03-05.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 109 (Mar. 5, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing Zhou on industry and supply and Mao on the commune system; regulations to be drafted, communes and accounting units made smaller; the three southern bureaus to meet at Canton, the three northern at Peking)'
