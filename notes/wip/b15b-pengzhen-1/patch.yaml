    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: 'the editorial printed June 27, 1960 (under that day: "《人民日报》发表题为《高举莫斯科宣言的马克思列宁主义革命旗帜》的社论")'
    at: IV, 42
- cite:
    id: cal.1960-06-28.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 42 (June 28, 1960; Peng Zhen leads the delegation back to Peking; Deng Xiaoping, Li Fuchun and others at the airport)'
