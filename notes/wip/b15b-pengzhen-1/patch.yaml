    id: cal.1960-09-22.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 60–61 (Sept. 22, 1960, 5:30 p.m., the St. Catherine Hall of the Kremlin; the Soviet delegation''s dinner for the Chinese, ended at 8; at 11 p.m. the delegation flies home)'
