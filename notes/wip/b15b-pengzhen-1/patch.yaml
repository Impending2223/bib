      c: 'Peking 北京. Peng Zhen 彭真 reports to the national conference on nationalities work: religious freedom and the freedom to keep or reform customs are in the constitution, some places have fallen short; those coerced into the rebels to be taught, the target in democratic reform not too wide; feudal privileges of the monasteries ended, freedom of belief and unbelief kept; minority cadres wrongly struggled against rehabilitated; unity of all nationalities, a core of leaders, democratic centralism; food and clothing for 600 to 700 million need a thousand jin of grain a head, not three or five years'' work; an independent, complete modern economy.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 197–198. Printed in the *Selected Works of Peng Zhen* 《彭真文选》 as "All nationalities unite to build socialism" 《各民族团结起来建设社会主义》 (IV, 198). Made public: 2012. Names: Peng Zhen.'
