    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 29, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Song Qingling, Deng Xiaoping and others, takes leave of Lin Boqu''s remains at the Peking Hospital)'
