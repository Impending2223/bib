    id: cal.1960-04-15.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18 (Apr. 15, 1960, evening; Peng Zhen, with Deng Xiaoping and others, at the Soviet Ambassador Chervonenko''s film evening for Lenin''s ninetieth anniversary)'
