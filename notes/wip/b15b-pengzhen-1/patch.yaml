    id: cal.1961-04-10.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 118 (Apr. 10, 1961, afternoon; the 246th meeting; Peng Zhen there; the Center''s work in the coming weeks and rectification in the enterprises)'
- cite:
    id: cal.1961-04-14.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 119 (Apr. 14, 1961, afternoon; the 247th meeting; Peng Zhen there; Sino-Soviet economic relations, military aid to Albania, the labor cut from capital construction; Peng: the villages do not lack labor, the egalitarianism is the problem)'
- cite:
    id: cal.1961-04-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 120 (Apr. 18, 1961, afternoon; the 248th meeting; Peng Zhen there, Zhou attending; Deng on Shunyi and Tan Zhenlin on Liling; rallies at Peking, Tianjin, Shanghai, Wuhan and other cities for Cuba against the American-hired invaders)'
- cite:
    id: cal.1961-04-21.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 121–122 (Apr. 21, 1961, afternoon; Peng Zhen, with Zhou Enlai and others, at the rally in the Workers'' Stadium backing the Cuban people against American armed aggression, and speaks: the Cubans under Prime Minister Castro have wiped out the American hirelings who landed; their struggle is China''s own)'
- variant:
    id: cal.1961-04-21.china-leadership-3
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the rally in the Workers' Stadium 100,000 strong ("首都各界十万人"), 600,000 in all at the day's demonstrations and rallies ("当日，首都共有六十万人参加示威和集会")
    at: IV, 121
- cite:
    id: cal.1961-04-23.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 122 (Apr. 23, 1961; the 249th meeting; Peng Zhen there; industry, agriculture, grain, education and the trial of the draft commune regulations)'
- cite:
    id: cal.1961-04-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 122 (Apr. 23, 1961, afternoon; Peng Zhen, with Zhou Enlai, Chen Yi and others, at the meeting of more than 10,000 in the Great Hall of the People welcoming Prince Souvanna Phouma and Prince Souphanouvong; his speech: China backs the Lao people''s fight for independence, peace and neutrality against American wrecking of the Geneva agreements; Laos to be independent, free and prosperous)'
- cite:
    id: cal.1961-04-23.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 122 (Apr. 23, 1961, evening; Peng Zhen at Zhou''s banquet in the Great Hall welcoming the two princes and the other Lao guests)'
- cite:
    id: cal.1961-04-26.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 124 (Apr. 26, 1961, afternoon; the 251st meeting; Peng Zhen there, Zhou and Chen Yun attending; Deng relays Mao''s instruction on a work conference and revising the Sixty Articles; the conference set for Peking on May 15)'
- cite:
    id: cal.1961-04-28.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 125 (Apr. 28, 1961, afternoon; Peng Zhen at Deng''s, at his invitation, hearing Yang Shangkun on his investigation at Xushui and Anguo, Hebei)'
