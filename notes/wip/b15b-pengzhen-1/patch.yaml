    id: cal.1961-04-04.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 117 (Apr. 4, 1961, morning; the 244th meeting; Peng Zhen there, Zhou attending; the Planning Commission Party group''s report on the 1961 capital construction plan and the Center''s directive on the line in Tibet)'
- cite:
    id: cal.1961-04-04.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 117 (Apr. 4, 1961, afternoon; Peng Zhen, with Zhou Enlai, Deng Xiaoping, He Long and others, at the opening of the 26th World Table Tennis Championships; receives the foreign friends)'
