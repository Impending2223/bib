      c: 'Peking 北京. Peng Zhen 彭真 speaks to the Peking municipal committee''s 北京市委 enlarged meeting: unity through criticism to new unity, but too little clash of views, the old lesson that leaders would not hear dissent; gains first, faults second, the committee chiefly responsible; most for holding the "three red banners" high, reservations allowed; new cadres to be raised, of virtue and ability; agriculture, light and heavy industry in that order; socialist construction to be learned anew by old and new cadres alike.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 187–188. A part printed in the *Selected Works of Peng Zhen* 《彭真文选》 as "Take care to train and promote new cadres" 《要注意培养提拔新干部》 (IV, 188). The words: 下午 (IV, 187–188). Made public: 2012. Names: Peng Zhen.'
