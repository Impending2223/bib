- cite:
    id: cal.1960-03-22.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 10 (Mar. 22, 1960; the 173rd meeting; Peng Zhen there; Lenin''s ninetieth anniversary, his selected works and his writings on related subjects; Lu Dingyi''s questions at the provincial culture and education secretaries'' conference (academic criticism, teaching reform, children''s education and books); Peng: pupils to have free time to read; the keys of reform the textbooks and the teachers; the last two years of a nine- or ten-year schooling might be divided by subject)'
- cite:
