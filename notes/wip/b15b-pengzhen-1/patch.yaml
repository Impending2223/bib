    id: cal.1960-04-22.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 20 (Apr. 22, 1960; with *Hongqi*''s "Long Live Leninism," as Peng Zhen''s chronology has it under that day)'
