- cite:
    id: cal.1961-03-21.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 113 (Mar. 21, 1961, afternoon; Peng Zhen sits in at Mao''s Standing Committee on the third draft of the regulations)'
- cite:
    id: cal.1961-03-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 113 (Mar. 23, 1961, afternoon; Peng Zhen at the plenary hearing Mao on investigation)'
- cite:
    id: cal.1961-03-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 113–114 (Mar. 23, 1961; that day the conference prints Mao''s "On investigation work" (the page''s note: written May 1930, later in the *Selected Readings* of 1964 and the second edition of the *Selected Works*, 1991, as "Oppose book worship"))'
- cite:
    id: cal.1961-03-24.china-leadership-4
