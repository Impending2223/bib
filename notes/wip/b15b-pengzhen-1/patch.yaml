- cite:
    id: cal.1960-04-12.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 17 (Apr. 12, 1960; the 179th meeting; Peng Zhen there, Zhou Enlai attending; Zhou''s line for the production and allocation of cotton, cotton yarn, cloth and knitwear in 1960 and after agreed; grain for the next fifty days; on the rural "three antis" set for August, Peng: none in the busy season)'
- cite:
    id: cal.1960-04-13.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18 (Apr. 13, 1960, morning; Peng Zhen, with Song Qingling, Dong Biwu, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping and others, at the airport to see Zhou off to Burma, India and Nepal)'
- cite:
    id: cal.1960-04-14.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 18 (Apr. 14, 1960, morning; Peng Zhen at Deng Xiaoping''s meeting on the selection of Lenin''s words on imperialism and against revisionism)'
