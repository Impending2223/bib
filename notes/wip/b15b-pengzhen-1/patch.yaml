    id: cal.1960-09-28.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 61 (Sept. 28, 1960, morning; Peng Zhen at Deng''s meeting on the draft "Statement of the meeting of representatives of the communist and workers'' parties"; Zhou attending)'
- cite:
    id: cal.1960-09-30.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 61–62 (Sept. 30, 1960, morning; Peng Zhen, deputy leader, with Deng Xiaoping, leader, Kang Sheng, Yang Shangkun, Hu Qiaomu and Liao Chengzhi, flies to Moscow to prepare the twenty-six parties'' meeting, seen off by Zhou Enlai, Zhu De and others; Li Jingquan, Lu Dingyi, Liu Ningyi and others left at 11 a.m. on the 29th; at Moscow 4:30 p.m. Moscow time)'
- cite:
    id: cal.1960-09-30.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 62 (Sept. 30, 1960, 6:30 p.m.; Peng Zhen, with Deng Xiaoping and Yang Shangkun, at the CPSU building at Suslov''s and Kozlov''s invitation; Suslov: the CPSU has a draft Statement, to unite on principle; the meeting opens tomorrow, a Soviet welcome, the 2nd and 3rd for study, general debate from the 4th; a secretariat of the drafting committee, one or two from each side; the draft handed over with a Chinese translation)'
- cite:
    id: cal.1960-09-30.china-leadership-6
