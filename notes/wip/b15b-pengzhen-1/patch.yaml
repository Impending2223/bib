      date: '1960-04-28'
      thread: china-leadership
      c: 'The Center 中共中央 issues its directive on the bourgeoisie''s high salaries, pay on sick leave and "retirement": high salaries kept, cuts since the second half of 1958 restored and repaid; sick pay by the State Council''s rule of May 31, 1957, 50 to 70 percent for private owners with shares over 2,000 yuan in need; the old and ill given leave, not retired, on full pay; Liu Shaoqi 刘少奇 has announced it to the bourgeoisie''s representatives at the congresses of the Democratic National Construction Association 民建会 and the Federation of Industry and Commerce 工商联.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 18–19. The three measures from the page''s note (IV, 19). Made public: 2012. See [[cal.1960-04-18.china-leadership-13]]. Names: Liu Shaoqi.'
