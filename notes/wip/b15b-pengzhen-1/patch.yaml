- cite:
    id: cal.1961-03-06.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 109–110 (Mar. 6, 1961, noon, from Canton to Yang Shangkun in Peking: at the Chairman''s it is settled to make the communes'' and teams'' accounting units smaller and to hold at once, north and south, meetings of the regional bureaus'' and provincial leaders, the three northern bureaus'' at Peking, Yang to give notice first)'
- cite:
    id: cal.1961-03-06.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 110 (Mar. 6, 1961, afternoon; Peng Zhen back in Peking on the same plane as Zhou Enlai and Deng Xiaoping)'
- cite:
    id: cal.1961-03-06.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 110 (Mar. 6, 1961, evening; Peng Zhen sits in at Liu Shaoqi''s Standing Committee, and with Zhou and Deng reports the Canton meeting; the three northern bureaus'' meeting discussed)'
- cite:
    id: cal.1961-03-07.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 110 (Mar. 7, 1961, afternoon; the 241st meeting; Peng Zhen there, Zhou and Chen Yun attending; current work, industry and supply, foreign and domestic trade parted; Deng relays Mao: Khrushchev''s letter of Feb. 27 offering a million tons of wheat on loan and 500,000 tons of Cuban sugar, the grain refused, the sugar accepted; communes and teams made smaller; a two-year and a seven-year plan; rectification in industry; fewer papers, more investigation; the Chairman dissatisfied with the Secretariat''s and the departments'' work; the North China, Northeast and Northwest bureaus and their provinces'' first secretaries to meet on the 11th)'
- cite:
    id: cal.1961-03-11.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 111 (Mar. 11–13, 1961; Peng Zhen attends; the reports and discussion on making the communes smaller and the regulations; Mao''s Three South conference at Canton on the same; from the 15th the two merged at Canton as the Central Work Conference)'
- cite:
    id: cal.1961-03-13.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 112 (Mar. 13, 1961; Peng Zhen receives Mao''s letter on the two egalitarianisms, between teams within a brigade and between persons within a team, "两个极端严重的大问题"; Deng and Peng to take some ten days after the meeting to investigate at Miyun, Shunyi, Huairou and elsewhere, level by level, not all together)'
