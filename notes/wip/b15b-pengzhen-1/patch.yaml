      thread: china-leadership
      c: 'The Peking committee of the Party 中共北京市委 asks Mao, the Center 中共中央 and the North China Bureau 华北局 for help with industry: streamlining has unsettled people and there is no money for the techniques of quality and variety; industrial output in the first half 24.7 percent below the year before, local industry''s 28 percent; 10 million yuan asked, to bring tens of millions in output that year; the projects to the State Planning Commission 国家计委.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 207. Under Peng Zhen''s day; his part in the report is not stated. Made public: 2012. Names: Peng Zhen.'
