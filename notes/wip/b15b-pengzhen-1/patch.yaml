    id: cal.1961-01-20.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 20, 1961; Peng Zhen, with Li Fuchun, Liu Lantao, Hu Qiaomu, Bo Yibo, Chen Boda, Wu Lengxi and others, at Deng''s meeting revising the plenum''s communiqué and hearing Wang Enmao on Xinjiang; Zhou comes for the communiqué)'
- cite:
    id: cal.1961-01-23.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 93 (Jan. 23, 1961, morning; the 231st meeting; Peng Zhen there, Zhou attending; work after the plenum and relaying it; liaison: Zhou the Metallurgy and Labor ministries, Chen Yun Chemical Industry, Deng Petroleum and Railways, Peng Zhen Coal and Forestry, Li Fuchun the machine-building ministries)'
- cite:
    id: cal.1961-01-23.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 94 (Jan. 23, 1961; while Deng Xiaoping is away on his tour, Peng Zhen to run the Secretariat''s daily work; Peng: no fresh crop of papers repeating the conference, work and measures the key; timber and coal allotted by the Center; the Economic Commission''s work all under Bo Yibo, routine matters sent down directly without the Center''s approval)'
- cite:
    id: cal.1961-01-25.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 94 (Jan. 25, 1961, morning; the 232nd meeting; Peng Zhen there; college textbooks, strengthening the theory corps, rail transport; Peng: rules in industry set up before the old are broken, textbooks too; Jiang Nanxiang (the page''s note: Vice-Minister of Education) told, in science no new books issued, the old not dropped; democratic figures and old cadres to help write; Hu Sheng to write the philosophy text, approved by the end of March, Peng to arrange printing; on putting off the fifth and sixth volumes of Mao''s *Selected Works*: some of his talks are settled views, some thoughts on the way; not to be spread about, to protect the Chairman)'
- cite:
    id: cal.1961-01-25.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 95 (Jan. 25, 1961, evening; Peng Zhen sits in at Mao''s Standing Committee on the work while Mao is away and hearing Zhou on the talks with the GDR''s trade delegation; Mao leaves Peking for the south at midnight)'
- cite:
    id: cal.1961-01-26.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 95 (Jan. 26, 1961, afternoon; Peng Zhen at Deng Xiaoping''s meeting hearing Yu Qiuli on oil; Deng: the Secretariat to command industry as an army, a secretariat drawn from the Planning, Economic and Military Commissions to follow steel, chemicals, machinery, oil, rail and coal for Peng''s reference; the order of transport grain and small farm tools, coal and timber, exports and market goods; Peng: some on the industrial front are cowed by the difficulties; output to rise in the first quarter, not in May, or 19 million tons of steel, even 18.4, will be in doubt)'
- cite:
    id: cal.1961-01-27.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 95–96 (Jan. 27, 1961, afternoon; the 233rd meeting; Peng Zhen there, Zhou attending; Peng on timber: 3 million cubic meters waiting in the north; the 72 forestry bureaus sent down in 1958, now under the Center and the provinces jointly, later back to the Center; pit props first; on coal: 710,000 tons a day in the first quarter of last year, 570,000 now, attendance 70 to 80 percent; the 61 big mines'' coal allotted by the Center; the Petroleum Ministry to plan 15 million tons from the Songliao plain by 1964, and the natural gas of southern Sichuan used)'
- cite:
    id: cal.1961-01-28.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 96 (Jan. 28, 1961, afternoon; Peng Zhen, with Deng Xiaoping and Yang Shangkun, hears Guo Moruo and Xia Yan (the page''s note: Vice-Minister of Culture and vice-chairman of the Federation of Literary and Art Circles) on the friendship delegation''s visit to Cuba)'
- cite:
    id: cal.1961-01-30.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 97 (Jan. 30, 1961; the day Peng Zhen presides at the NPC Standing Committee''s thirty-fifth session)'
- cite:
    id: cal.1961-02-04.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 99 (Feb. 4, 1961, morning; Peng Zhen at the Secretariat, Zhou presiding; recalling China''s great natural disasters, he proposes: a Center paper calling on all to save grain and tighten belts, the half-able eating a little less so the workers can hold on; from province to village a secretary for grain and livelihood; the stock-taking and weighing of grain at the base stopped; no high hopes of imported grain)'
- cite:
    id: cal.1961-02-13.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 102 (Feb. 13, 1961, afternoon; Peng Zhen, with Zhou Enlai, Chen Yi and others, at the rally in the Great Hall of the People for the treaty''s eleventh anniversary and the performance after)'
- cite:
    id: cal.1961-02-13.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 102 (Feb. 13, 1961, evening; Peng Zhen, with Zhou Enlai, Chen Yun, Chen Yi and others, at the Soviet Embassy''s reception)'
- cite:
    id: cal.1961-02-14.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 102–103 (Feb. 14, 1961, afternoon; the 238th meeting, Peng Zhen presiding, Zhou attending; coal for February and March: if 500,000 tons a day in late February, allot nine-tenths of it; the Datong mines supplied, attendance only 70 percent; drive, cutting and tunneling together, supply, allotment at nine-tenths; warnings to the metallurgy, railway and machinery ministries; Zhou on the grain shortage in the provinces; Tan Zhenlin to draft a paper on squeezing grain from the non-working and light workers for the workers, no hope in imported grain)'
- cite:
    id: cal.1961-02-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 104 (Feb. 18, 1961, afternoon; Peng Zhen, with Zhou Enlai and others, at the capital''s rallies against the murder of Lumumba, Prime Minister of the Congo, by American and Belgian imperialism and their agents)'
