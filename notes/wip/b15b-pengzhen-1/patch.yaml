- add:
    entry:
      id: cal.1960-03-01.china-leadership-7
      when: Mar. 1
      date: '1960-03-01'
      place: peking
      thread: china-leadership
      c: 'Peking 北京. Peng Zhen 彭真 at the Peking municipal committee''s 北京市委 Standing Committee: Mao Zedong Thought 毛泽东思想 not to be defined, placed or ranked ("the greatest Marxism–Leninism of our day" improper); schooling not by overtime, the pupils'' load lightened, more teachers; last year 600 million mu struck by disaster, the suburban peasants'' grain 370 jin a head; city mess halls step by step, none forced; municipal cadres rotated with the front line, young cadres promoted.'
      n: '[[w.peng-zhen-nianpu-1902]], IV, 5–6. Peng: "不妥当，不科学" (IV, 5), of ranking Mao''s thought. Made public: 2012. Names: Peng Zhen, Mao Zedong.'
