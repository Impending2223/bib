    id: cal.1960-03-31.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 12 (Mar. 31, 1960; the 175th meeting; Peng Zhen there; *Lenin''s Selected Works* to be published in four volumes, Peng proposing a piece of Lenin''s on the commune be included; the provincial committees'' industrial departments, the Party''s control commissions, overcoming the "five too many" (meetings, papers and returns, sitting in offices, routine business, general calls, so the page''s note) and scientific secrecy)'
- cite:
    id: cal.1960-04-02.china-leadership-2
