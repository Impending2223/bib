    id: cal.1961-09-15.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 151 (Sept. 15, 1961, 10 p.m. to 1 a.m.; Peng Zhen calls Liu Lantao, Zhang Desheng, Wang Enmao, Zeng Di (the page''s note: a secretary of the Xinjiang committee) and others on Xinjiang)'
- cite:
    id: cal.1961-09-17.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 151 (Sept. 17, 1961, afternoon; Peng Zhen leaves Lushan, by boat from Jiujiang to Nanjing and on by air; back in Peking at noon on the 19th)'
- cite:
    id: cal.1961-09-20.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 151–152 (Sept. 20, 1961; the 283rd meeting; Peng Zhen there, Zhou attending; a national coal conference, relaying Lushan, informing the democratic parties; Peng: the heads of the 61 big mines to meet on tunneling, cutting, roadway repair, transport and miners'' life, a leading group of Gu Mu (head), Zhang Linzhi, Luo Yuchuan, Cheng Zihua, Wang Heshou, Duan Junyi, Yao Yilin and Song Yangchu, two weeks; Zhou: a forum of democratic figures before National Day, Zhou to speak, Yang Shangkun and Xu Bing to draw the list; Lushan relayed by the Secretariat to the Politburo and Secretariat members and marshals absent, by Peng to the departments'' Party groups)'
- cite:
    id: cal.1961-09-22.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 152 (Sept. 22, 1961, morning; Peng Zhen, with Liu Shaoqi and others, at the airport to welcome Dr. Osvaldo Dorticós Torrado, President of Cuba, the first Latin American head of state to visit China; afternoon at the talks of Liu, Zhou, Dong Biwu and Zhu De with Dorticós)'
- cite:
    id: cal.1961-09-23.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 152–153 (Sept. 23, 1961, afternoon; Peng Zhen at the General Office''s report meeting relays Lushan to the central departments'' heads of division and up and the state organs'' Party groups: in three years fourteen basic products reached the Second Plan''s targets two years early, a great victory; but too wide a front, high targets, urban workers doubled; the masses'' doubts to be heard; no experience, too little investigation; Deng at Lushan: "我们书记处是两条: 第一检讨，第二改"; Mao named Deng and Peng to investigate; a year lost on the high targets after the 1960 line; coal and steel "两马出头," 15 million tons of steel and 500 million of coal in the supplementary plan; 20 million out of the towns, no grain imports after the autumn of 1963)'
- cite:
    id: cal.1961-09-26.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 26, 1961, morning; Peng Zhen, with Zhu De, Li Fuchun and others, at the airport to meet Deng Xiaoping''s delegation back from the Korean Workers'' Party''s fourth congress and its visit)'
- cite:
    id: cal.1961-09-27.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 27, 1961; the 284th meeting; Peng Zhen there; coal, light industry''s products and the speech for the CPSU''s Twenty-second Congress in mid-October)'
- cite:
    id: cal.1961-09-28.china
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 28, 1961, evening; Peng Zhen accompanies Zhu De in meeting and dining the delegation led by the deputy chairman, Vass Istvánné)'
- cite:
    id: cal.1961-09-29.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 29, 1961; the 285th meeting; Peng Zhen there; the delegation''s speech and the greetings to the CPSU''s congress; *Renmin ribao*''s National Day editorial, "Hold high the great banner of the general line and strive for new victories!")'
- cite:
    id: cal.1961-09-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 29, 1961; Peng Zhen accompanies Liu Shaoqi in meeting King Mahendra Bir Bikram Shah Deva of Nepal, the Queen and their party)'
- cite:
    id: cal.1961-09-30.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 30, 1961; the 286th meeting; Peng Zhen there; the coal conference reported; Peng: the Coal Ministry to see above all to carrying out the draft working regulations for state industrial enterprises)'
- cite:
    id: cal.1961-09-30.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154 (Sept. 30, 1961, evening; Peng Zhen at Zhou''s National Day reception in the banquet hall of the Great Hall, for the twelfth anniversary)'
- cite:
    id: cal.1961-10-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 154–155 (Oct. 1, 1961, morning; Peng Zhen at the rally of 500,000 soldiers and civilians on Tiananmen Square, and speaks: under the general line the main industrial targets of the Second Five-Year Plan met in 1960, two years early; three years of natural disaster brought grave difficulty, the people united advance in the struggle against it)'
- cite:
    id: cal.1961-10-02.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 2, 1961, evening; Peng Zhen at the signing of the joint communiqué by Liu Shaoqi and Dorticós)'
- cite:
    id: cal.1961-10-03.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 3, 1961, morning; Peng Zhen, with Liu Shaoqi and others, at the airport to see Dorticós off)'
- cite:
    id: cal.1961-10-03.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 3, 1961; the 287th meeting; Mao''s greetings to the Twenty-second Congress, the delegation''s speech and its members adopted: Zhou Enlai leader, Peng Zhen, Kang Sheng, Tao Zhu and Liu Xiao)'
- cite:
    id: cal.1961-10-04.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 4, 1961, morning; Mao to Deng and Peng: Ke Qingshi, Li Jingquan, Liu Lantao and Song Renqiong to come on the 5th to settle "the team as the base"; if all agree to investigate, the provinces, prefectures and counties to talk it over within two months, a decision in December)'
- cite:
    id: cal.1961-09-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Sept. 29, 1961; Mao''s letter: "三级所有、队为基础," the basic accounting unit the team, not the brigade; "六年之久的糊涂日子," time to wake in the seventh)'
- cite:
    id: cal.1961-10-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 155 (Oct. 7, 1961; Mao to Peng Zhen: print the Center''s directive on the basic accounting unit in the villages to the regional bureaus and provincial committees, for investigation and trials, reports by the end of November)'
- cite:
    id: cal.1961-10-04.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156 (Oct. 4, 1961; Peng Zhen, with Deng Xiaoping and others, meets and dines Sharkey and his party)'
- cite:
    id: cal.1961-10-05.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156 (Oct. 5, 1961, afternoon; Peng Zhen, with Zhou Enlai and others, at the signing of the boundary treaty by Liu Shaoqi and King Mahendra)'
- cite:
    id: cal.1961-10-05.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156 (Oct. 5, 1961; Peng Zhen at the rally of 100,000 welcoming the King and Queen and celebrating the treaty, and speaks: last year''s treaty of peace and friendship and this boundary treaty fix lasting peace and traditional friendship in law)'
- cite:
    id: cal.1961-10-08.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156 (Oct. 8, 1961; Peng Zhen, with Zhu De, Deng Xiaoping and others, meets and dines the delegation of Cuba''s Integrated Revolutionary Organizations led by Augusto Martínez Sánchez)'
- cite:
    id: cal.1961-10-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156 (Oct. 9, 1961, evening; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Song Qingling and others, at the meeting of more than 10,000 in the Great Hall)'
- cite:
    id: cal.1961-10-10.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 156–157 (Oct. 10, 1961; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, at the airport to meet Hồ Chí Minh and Lê Duẩn on their way to the CPSU''s congress)'
- cite:
    id: cal.1961-10-12.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 157 (Oct. 12, 1961, afternoon; Peng Zhen, with Zhou, talks with Hồ Chí Minh and Lê Duẩn)'
- cite:
    id: cal.1961-10-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 157 (Oct. 12, 1961, evening; Peng Zhen, with Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping and others, meets and dines Hồ Chí Minh and Lê Duẩn)'
- cite:
    id: cal.1961-10-14.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 157 (Oct. 14, 1961, morning; Peng Zhen, with Zhu De and Deng Xiaoping, at the airport to see off Hồ Chí Minh and Lê Duẩn)'
- cite:
    id: cal.1961-10-15.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 157 (Oct. 15, 1961; Peng Zhen leaves for Moscow with the delegation, Zhou leader, Kang Sheng, Tao Zhu, and Liu Xiao already in Moscow, at the CPSU''s invitation)'
- cite:
    id: cal.1961-10-15.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 157 (Oct. 15–Nov. 1, 1961; Peng Zhen a member of the delegation; Oct. 19, Zhou''s speech and Mao''s greetings: publicly airing differences between parties (the page''s note: Khrushchev''s report attacking the Albanian party) not a serious Marxist–Leninist attitude; talks with Hồ Chí Minh, Kim Il Sung and others on three rules (unity against the enemy, no interference in a party''s affairs, internal matters settled inside); Oct. 21, wreaths at the Lenin and Stalin mausoleum; Oct. 22, over nine hours with Khrushchev, Kozlov, Mikoyan, Andropov and others on Albania, the Twentieth Congress, Stalin and the "anti-Party group"; Oct. 23, evening, Zhou leaves, Peng acting leader)'
- cite:
    id: cal.1961-11-01.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 158 (Nov. 1, 1961, afternoon; Peng Zhen leads the delegation back to Peking; Zhou Enlai, Zhu De, Deng Xiaoping and others at the airport)'
- cite:
    id: cal.1961-11-02.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 158 (Nov. 2, 1961, evening; Peng Zhen reports to Mao''s Standing Committee on the Twenty-second Congress after Zhou''s return; Zhou to report on the congress, the world and the Party''s foreign line to central cadres of grade 17 and up)'
- cite:
    id: cal.1961-11-05.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 158–159 (Nov. 5, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee with the regional first secretaries; their meeting from the 6th to take up the team as the base of the communes, grain procurement, the Twenty-second Congress and whether to put off the NPC''s third session)'
- cite:
    id: cal.1961-11-06.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 6, 1961, the meeting under Liu Shaoqi on the commune system, the market and grain; on contracting grain for 1962 Peng: once grain is contracted, the peasants will hand over the 18 billion jin the Center wants; all agree to full contracting; Nov. 8, Peng hears Zhou and Li Xiannian on grain)'
- cite:
    id: cal.1961-11-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 9 and 10, 1961; Peng Zhen at the meeting in the Great Hall)'
- cite:
    id: cal.1961-11-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 12, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing Deng and others on the first secretaries'' meeting; the NPC''s third session put off; a work conference at Peking on Dec. 20, then a four-level meeting of county, prefecture, province and bureau)'
- cite:
    id: cal.1961-11-13.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 13, 1961, afternoon; the 297th meeting; Peng Zhen there; the seven-year plan and the Sixty Articles; Deng relays Mao on grain procurement, the Sino-Soviet dispute and the work conference)'
- cite:
    id: cal.1961-11-14.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 14, 1961; Peng Zhen, with Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others, meets and dines Hồ Chí Minh on his way home from the congress)'
- cite:
    id: cal.1961-11-17.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 17, 1961, morning; Peng Zhen at the public memorial for Peng Tao in the Zhongshan Tang, a member of the funeral committee (the page''s note: Peng Tao, 1913–1961, alternate member of the Central Committee, Minister of Chemical Industry and vice-chairman of the Planning Commission; died Nov. 14))'
- cite:
    id: cal.1961-11-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 20, 1961, morning; the 298th meeting; Peng Zhen there; Liao Luyan on the outline of the rural seven-year plan (the page''s note: the plan for 1963–69 Mao told the Secretariat to make in the winter of 1961))'
- cite:
    id: cal.1961-11-21.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 21, 1961, morning; the 299th meeting; Peng Zhen there; the seven-year plans of fuel and power: coal, electricity, oil)'
- cite:
    id: cal.1961-11-21.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 21, 1961, afternoon; Peng Zhen, with Deng Xiaoping and Yang Shangkun, meets the Thai, Malayan and Burmese parties'' delegations, come after the Twenty-second Congress, and gives them dinner)'
- cite:
    id: cal.1961-11-22.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 22, 1961, morning; the 300th meeting; Peng Zhen there; the Light Industry and Textile ministries'' seven-year plans and the market)'
- cite:
    id: cal.1961-11-23.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 23, 1961, morning; the 301st meeting; Peng Zhen there; Wang Heshou on the Metallurgy Ministry''s seven-year plan)'
- cite:
    id: cal.1961-11-23.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160 (Nov. 23, 1961, afternoon; the 302nd meeting; Peng Zhen there; Luo Yuchuan on the forestry conference of ten southern provinces)'
- cite:
    id: cal.1961-11.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 160–161 (Nov. 23, 1961; Peng Zhen receives Mao''s comment forwarding Deng Zihui''s report of Nov. 9 on trials of the basic accounting unit: "这个报告很好"; investigation and concrete analysis "马克思主义的灵魂"; the provincial first secretaries to take work groups to the villages for ten days in Deng Zihui''s way; for Zhou, Deng, Peng and Tan Zhenlin to read, then by telegram through Yang Shangkun)'
- cite:
    id: cal.1961-11-24.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 24, 1961; Peng Zhen, with Zhou Enlai, Deng Xiaoping, Yang Shangkun and others, accompanies Mao in meeting the students of the Brazilian, Ecuadorian, Bolivian and Salvadoran Communist parties and the Panamanian People''s Party come to study in China)'
- cite:
    id: cal.1961-11-27.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 27, 1961; Peng Zhen at the Secretariat on organizing theoretical articles criticizing revisionism)'
- cite:
    id: cal.1961-11-28.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 28, 1961, morning; the 303rd meeting; Peng Zhen there; Duan Junyi on the First Machine-Building Ministry''s seven-year plan)'
- cite:
    id: cal.1961-11-29.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 29, 1961, morning; the 304th meeting; Peng Zhen there; Wu Jingtian (the page''s note: Vice-Minister of Railways) on the railways'' seven-year plan)'
- cite:
    id: cal.1961-11-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 29, 1961, evening; Peng Zhen, with Zhou Enlai and others, at the reception of Reiz Malile, the Albanian Ambassador, for Albania''s seventeenth liberation anniversary)'
- cite:
    id: cal.1961-11-30.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Nov. 30, 1961; the 305th meeting; Peng Zhen there; the Second and Third Machine-Building ministries and the Defense Science Commission on their seven-year plans)'
- cite:
    id: cal.1961-12-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 161 (Dec. 1, 1961, before the session; Peng Zhen presides at a forum of NPC Standing Committee members on putting off this year''s Congress, proposing a joint meeting of the NPC and the CPPCC in January 1962)'
- cite:
    id: cal.1961-12-16.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 16, 1961; Peng Zhen at the Secretariat on preparing the work conference and on the Secretariat''s report to Mao and the Standing Committee on a selection of the Center''s documents since 1958 and "Comrade Mao Zedong on the general line of socialist construction and the struggle between the two lines")'
- cite:
    id: cal.1961-12-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 16, 1961; the Secretariat''s report, discussed at its meeting with Peng Zhen there)'
- cite:
    id: cal.1961-12-19.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 19, 1961; Peng Zhen at the forty-eighth enlarged session hearing Zhou''s preliminary government work report on the situation at home and abroad)'
- cite:
    id: cal.1961-12-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 164 (Dec. 20, 1961–Jan. 10, 1962; Peng Zhen attends; the world, the home situation, the 1962 and long-term plans, commerce, the basic accounting unit, Party work; to prepare the enlarged work conference)'
- cite:
    id: cal.1961-12-21.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 165 (Dec. 21, 1961; Peng Zhen at the plenary hearing Deng relay Mao''s estimate of the situation, and Deng''s long speech)'
- cite:
    id: cal.1961-12-28.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 165 (Dec. 28, 1961; Peng Zhen at the plenary hearing Zhou''s report on the situation and the work of 1962)'
- cite:
    id: cal.1961-12-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 165 (Dec. 29, 1961, morning; Peng Zhen at the Secretariat on *Renmin ribao*''s New Year editorial for 1962 and other articles)'
- cite:
    id: cal.1962-01-08.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 166 (Jan. 8, 1962; the 311th meeting; Peng Zhen there; Yang Shangkun''s arrangements for the enlarged work conference opening on the 11th agreed; the Center''s statement condemning the American government''s anti-Communist outrages and backing the American Communist Party (the page''s note: the Supreme Court''s ruling of June 1961 that the party is a "foreign agent," to register from Feb. 1, 1962, which it refuses))'
- cite:
    id: cal.1962-01-11.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 166–167 (Jan. 11–Feb. 7, 1962; Peng Zhen attends; 7,118 present from the regional bureaus, the central departments, the provincial, prefectural and county committees, key enterprises and the army (the "Seven Thousand"); Liu Shaoqi''s written report of Jan. 27, the Center taking responsibility; Mao speaks on the 30th; Liu, Lin Biao, Mao, Zhou, Zhu De, Deng and Chen Yun speak in plenary or in the provincial groups; Peng at the Secretariat, the drafting committee and the Zhejiang group)'
- cite:
    id: cal.1962-01-11.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 167 (Jan. 11, 1962; the 312th meeting; Deng on the groups'' reactions to Liu''s draft report and Mao''s instruction of the 10th: not to hurry with the report, consult the majority, revise, then report; Peng: the report good; these years'' bad luck from targets too high and boasting; after Lushan in 1959 the fight against the "left" should have gone on; "dispersionism" mostly blindness, high targets and blind command, not all bourgeois; the responsibility first the Secretariat''s, then some of the Standing Committee''s; he agrees with Chairman Mao that Mao''s own share not be dodged; to name the leaders'' faults raises, not lowers, their prestige; the "three no''s" (the page''s note: no pigtails grabbed, no clubs, no labels))'
- cite:
    id: cal.1962-01-17.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 168 (Jan. 17–24, 1962; Peng Zhen at the drafting committee revising Liu''s report)'
- cite:
    id: cal.1962-01-18.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 168–169 (Jan. 18, 1962; Peng: the gains told fully, the errors thoroughly; "dispersionism" first the Center''s, its departments'' many kinds, then the localities''; not all bourgeois, as Peking''s processing for others (the page''s note: the Peking No. 1 Machine Tool Works'' work on others'' materials, wrongly called "bourgeois thinking" in the draft); 1960 a year of high targets, estimates, procurement and exports; the eight-character line of early 1961 without measures, a year late; the Secretariat first responsible; the errors of Chairman Mao, Shaoqi and the Standing Committee included where due; the three-to-five-year transition and the mess halls approved by Mao; Mao''s prestige if not Everest then Mount Tai, a few tons of earth taken away it is as high; not to examine even one percent, one thousandth, of his errors would leave a bad mark)'
- cite:
    id: cal.1962-01-19.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 169 (Jan. 19, 1962, afternoon; Chen Boda: Peng Zhen''s words on Mao "值得研究"; must Mao answer for all the mess? Peng at once: the impression must not be given that all may be criticized but Chairman Mao)'
- cite:
    id: cal.1962-01-25.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 169 (Jan. 25, 1962, afternoon; Peng Zhen at the enlarged Politburo, Liu Shaoqi presiding, which in the main approves the revised report; Mao: "赞成这个方向")'
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 169 (Jan. 27, 1962, afternoon; Peng Zhen at the plenary, Mao presiding; on Mao''s view Liu''s written report printed and Liu explains it orally: three years'' fall in farm output large, industry down over 40 percent in 1961, "a great saddle"; natural disasters and errors since 1958, in some areas the errors chief)'
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 169–170 (Jan. 27, 1962; Liu: "三分天灾，七分人祸" as Hunan peasants say of some places; the "three red banners" kept, to be judged after five or ten years; wrong slogans such as "人有多大胆，地有多高产" and "conditions-only theory" corrected; Mao arranges the coming days)'
- cite:
    id: cal.1962-01-28.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 28, 1962, morning; Peng Zhen at the Secretariat on Deng''s speech to the conference)'
- cite:
    id: cal.1962-01-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 29, 1962, afternoon; Peng Zhen at the plenary, Mao presiding; Lin Biao: the difficulties came from not acting on Mao''s instructions, warnings and thought, work goes well when Mao''s thought is not interfered with; Mao: "a very good speech," to be put in order; Mao extends the conference over the Spring Festival for "venting" meetings, the prefectural and county cadres being afraid to speak of the provincial leaders)'
- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 30, 1962, afternoon; Mao''s speech on democratic centralism and the laws of socialist construction, taking responsibility for the errors; Peng Zhen there)'
- cite:
    id: cal.1962-02-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 171 (Feb. 1, 1962, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing the North China, Northeast and East China regions on their "venting" meetings; the conference extended past the Spring Festival)'
- cite:
    id: cal.1962-02-02.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 171 (Feb. 2, 1962, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing the Northwest, Central-South and Southwest; Peng and Deng propose easing the tension in Party life, no "venting" meetings below the county; Mao accepts; the provincial leaders to make self-criticisms on Feb. 3 to end this stage)'
- cite:
    id: cal.1962-02-05.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 171–172 (Feb. 5, 1962, morning; the 313th meeting; Peng Zhen there; the main points of Zhou''s and Deng''s speeches agreed; Peng: the conference let the leaders above the county criticize the Center freely and the Center took the blame; in relaying it, no "venting" at the county, spring sowing near and landlords and rich peasants might use it; on Zhou''s outline, staff cuts after investigation under the "five fixes" (the page''s note: product and scale, staff and organs, consumption and supply of materials, fixed and working capital, cooperation), the central administration cut too; imported grain given up as early as possible)'
- cite:
    id: cal.1962-02-05.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 172 (Feb. 5, 1962, evening; Peng Zhen at the General Political Department''s gala in the Great Hall for support of the government and the people)'
- cite:
    id: cal.1962-02-06.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 172 (Feb. 6, 1962, afternoon; Peng Zhen at the plenary, Mao presiding, hearing Deng on the Secretariat''s responsibility and the Party''s good tradition)'
- cite:
    id: cal.1962-02-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 173 (Feb. 7, 1962, afternoon; Peng Zhen at the plenary, Mao presiding, hearing Zhou on the difficulties and how to overcome them; the resolution on Liu Shaoqi''s report adopted, the conference closes)'
- cite:
    id: cal.1962-02-12.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 173–174 (Feb. 12, 1962, afternoon; the 314th meeting; Peng Zhen there, Zhou attending; work after the conference, cutting the town population and livelihood; Peng: high-priced goods help a little, but state shops not to compete with the free market; the worker-peasant alliance rests on exchange of products, industrial goods to the villages to take back currency; the cadres below the county do the real work, but in each campaign their faults are totted up and they are dealt with by batches, wives and children too; no more of it)'
- cite:
    id: cal.1962-02-11.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 174 (Feb. 13, 1962, morning; Peng Zhen, with Zhou Enlai, Chen Yun, Deng Xiaoping, Dong Biwu and more than 2,500 of the capital, at the public memorial for Li Kenong in the Zhongshan Tang; earlier, with Zhou, Yang Shangkun and others, at the Union Hospital to take leave of his body (the page''s note: Li Kenong, 1899–1962, member of the Central Committee, head of its Investigation Department and a deputy chief of the General Staff; died Feb. 9))'
- cite:
    id: cal.1962-02-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 174 (Feb. 18, 1962; Peng Zhen receives Zhou''s letter to Deng and Peng on the Foreign Ministry''s telegram: since the CPSU''s Twenty-second Congress the railway staff at the border stations stiff toward the Soviets, anti-Soviet feeling, anti-Soviet pictures found on trains; the four border provinces told by telephone; check groups led by public security to Qiqihar, Manzhouli, Suifenhe, Dalian, Erlian and Jining for a month)'
- cite:
    id: cal.1962-02-21.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 175 (Feb. 21–23, 1962; Peng Zhen at Liu Shaoqi''s enlarged Standing Committee in the Xilou (the "Xilou meeting") on the 1962 budget and the economy: farm output down, the market tight, prices up, inflation, a deficit of over 3 billion yuan, worse than thought at the Seven Thousand; an extraordinary time, agriculture first; ten years, first adjustment and recovery, then growth; Chen Yun speaks on the 23rd; Chen Yun, Li Fuchun and Li Xiannian to relay it to the State Council''s Party groups)'
- cite:
    id: cal.1962-02-22.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 175 (Feb. 22, 1962, morning; the 315th meeting; Peng Zhen there, Zhou attending; adopted: the streamlining group''s proposals for state organs, democratic parties and mass bodies; the finance and trade staff cut; the foreign affairs office''s report; a central streamlining group of eight under Yang Shangkun, Xi Zhongxun among them; a state organs establishment group of seven under Tan Zhenlin; Deng Zihui''s report on state farms forwarded; Peng: in hard times the leading organs not to throw out ideas without investigation; staff cut to raise productivity; old and weak cadres placed with care, "天怒人怨" otherwise (Deng: in many ways))'
- cite:
    id: cal.1962-02-24.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 175–176 (Feb. 24, 1962, afternoon; Peng Zhen, with Zhou Enlai, Chen Yun, Deng Xiaoping, Li Fuchun, Li Xiannian, Chen Boda, Kang Sheng, Yang Shangkun and others, at Liu Shaoqi''s meeting settling his written and oral reports)'
- cite:
    id: cal.1962-02-28.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 176 (Feb. 28, 1962, afternoon; the 316th meeting; Peng Zhen there; the Central Control Commission and the Organization Department to draft a decision on strengthening the Party''s control work; the Planning and Economic Commissions to see to support of agriculture and the "Seventy Articles on industry"; Xinhua''s domestic branches under the head office; more copies of *Renmin ribao*; Peng: Party committees on line, policy and plan, government work strengthened; production the key to town–country and worker–peasant tensions; a Party committee meeting each quarter, as Chairman Mao says; control work on new problems, the past endless)'
- cite:
    id: cal.1962-03-03.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 177 (Mar. 3, 1962, afternoon; Peng Zhen at Liu Shaoqi''s meeting on the CPSU''s letter on Soviet–Chinese relations and the answer to the PKI''s letter, both to be drafted by the International Liaison Department; a Foreign Ministry paper on Laos; Zhou, back that day from Canton, on the Military Commission''s Standing Committee meeting there)'
- cite:
    id: cal.1962-03-05.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 177 (Mar. 5, 1962, afternoon; Peng Zhen, with Kang Sheng, Wang Jiaxiang and Yang Shangkun, at Deng''s meeting on the Center''s draft reply to the PKI Central Committee)'
- cite:
    id: cal.1962-03-09.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 178 (Mar. 9, 1962, afternoon; the 317th meeting; Peng Zhen there, Zhou attending; Xu Bing''s list of those sitting in at the CPPCC and Zhang Su''s plan for the NPC session agreed; Peng: a secretary from each province to come to answer questions, the ministries to answer for their own; Li Fuchun to lead a work group to Changchun on streamlining and the Seventy Articles)'
- cite:
    id: cal.1962-03-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 178 (Mar. 10, 1962; Peng Zhen at the Secretariat again; Zhou''s proposal agreed, Tan Zhenlin to Zhengzhou to work with Tao Zhu on Henan''s alkaline soil, water disputes and Yellow River floods)'
- cite:
    id: cal.1962-03-12.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 178–179 (Mar. 12 and 13, 1962, afternoons; Peng Zhen at Liu Shaoqi''s enlarged Standing Committee on the Center''s urgent directive on getting through the spring famine and the grain shortage and its urgent rules on economy, and the comment forwarding the speeches of Chen Yun, Li Xiannian and Li Fuchun to the State Council''s Party groups on Feb. 26 (the page''s note, which prints the year as 1961: Chen Yun''s "The present financial and economic situation and some ways of overcoming the difficulties," Li Xiannian''s on finance, credit and the market, Li Fuchun''s on industry and the speed of construction); on the 13th the Central Finance and Economics Group recast, Chen Yun its head, Li Fuchun deputy, on Liu''s proposal; Liu: Mao away, to be reported to him at once)'
- cite:
    id: cal.1962-03-18.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 179 (Mar. 18, 1962; the papers issued after Liu, Zhou and Deng reported to Mao at Wuhan on the 16th; Mao agrees that the three speeches go to the province and army level and that Chen Yun head the group)'
- cite:
    id: cal.1962-03-15.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 179 (Mar. 15, 1962, morning; Peng Zhen at the Secretariat, Zhou and others attending, on the first draft of the Center''s reply to the CPSU''s letter of Feb. 22)'
- cite:
    id: cal.1962-03-19.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 180 (Mar. 19, 1962, afternoon; Peng Zhen at Liu Shaoqi''s meeting of the Standing Committee and the Secretariat on the NPC presidium, its secretaries-general and the CPPCC''s executive chairmen and staff)'
- cite:
    id: cal.1962-03-21.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 180 (Mar. 21, 1962, morning; Peng Zhen presides at the meeting of the Party members of the NPC and the CPPCC)'
- cite:
    id: cal.1962-03-21.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 180 (Mar. 21, 1962, afternoon; Peng Zhen at the eighteenth Supreme State Conference, Liu Shaoqi presiding: Liu on the enlarged work conference, Zhou on his government work report; Liu proposes the capitalists'' fixed interest be extended three years)'
- cite:
    id: cal.1962-03-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 181 (Mar. 23–Apr. 18, 1962; Peng Zhen at the CPPCC''s session)'
- cite:
    id: cal.1962-03-26.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 182 (Mar. 26, 1962, afternoon; Peng Zhen at the Politburo on Zhou''s draft government work report, the 1961 plan''s results and the main statistics for 1961)'
- cite:
    id: cal.1962-03-27.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 183 (Mar. 27–Apr. 16, 1962; Peng Zhen attends; on the 27th, afternoon, with Mao, Liu Shaoqi, Song Qingling, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping and others at the opening, one of the executive chairmen; Zhou''s report, its part on the world and foreign policy; on the 28th the part on the home situation; after the groups and the plenary speeches the session closes the afternoon of Apr. 16)'
- cite:
    id: cal.1962-03-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 183–184 (Mar. 29, 1962, morning; the 318th meeting; after Chen Zhengren on Henan''s salinization: the agricultural sector''s conclusion on the damage of Yellow River irrigation in Henan, Shandong and Hebei agreed, channels filled in by the communes'' choice to regain land; grain and money for Henan; Henan committee''s staffing by Li Fuchun and the Central-South Bureau; past errors for lessons, not pursued, those since the enlarged conference strictly dealt with; Henan''s cases reversed in the army''s way, all but the clearly right; Party discipline by the rules of cadre management, legal punishment by the higher courts, as Liu Shaoqi says; Peng: rehabilitation by the mass line; no more "venting" meetings in any trade during the NPC)'
- cite:
    id: cal.1962-04-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 184 (Apr. 1, 1962; the page''s note: Zhou tells Wu Zhipu, first secretary of the Henan committee, the Center will give 390 million jin of grain and 20 million yuan of relief before the end of June)'
- cite:
    id: cal.1962-03-31.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 184–185 (Mar. 31, 1962, afternoon; Peng Zhen at Liu Shaoqi''s enlarged Standing Committee on the Finance and Trade Office''s report on finance and credit in 1961 and the Center''s line for 1962, "balance within the year, some currency withdrawn")'
- cite:
    id: cal.1962-04-05.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 186 (Apr. 5, 1962, afternoon; Peng Zhen sits in at Liu Shaoqi''s Standing Committee on the draft replies to the CPSU and to the Indonesian, Vietnamese, Swedish, British and New Zealand parties)'
- cite:
    id: cal.1962-04-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 186 (Apr. 7, 1962, afternoon; Peng Zhen at Liu Shaoqi''s enlarged Politburo, which adopts the replies to the CPSU and to the PKI)'
- cite:
    id: cal.1962-04-09.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 187 (Apr. 9, 1962; Peng Zhen at the second meeting of the eighteenth Supreme State Conference on Liu Shaoqi''s report of Mar. 21 on the Seven Thousand; Mao: the conference made a first summing-up of errors, gains and lessons, "究竟正确不正确，要在今后的实践中去考验")'
- cite:
    id: cal.1962-04-15.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 188 (Apr. 15, 1962; Peng Zhen, with Zhou Enlai, Shen Junru, Li Weihan, Xi Zhongxun, Yang Shangkun and others, at the public memorial for Ma Xiwu at the Jiaxing Temple, Peking (the page''s note: Ma Xiwu, 1889–1962, Vice-President of the Supreme People''s Court and member of the CPPCC; died Apr. 10))'
- cite:
    id: cal.1962-04-16.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 189 (Apr. 16, 1962, afternoon; Peng Zhen, with Mao, Liu Shaoqi, Song Qingling, Dong Biwu, Zhu De, Zhou Enlai and others, at the closing, Zhu De presiding; after Zhou''s answers the report adopted unanimously; Cai Tingkai appointed a vice-chairman of the National Defense Council)'
- cite:
    id: cal.1962-04-17.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 189 (Apr. 17 and 18, 1962; the 319th meeting; rehabilitating cadres wrongly criticized in the campaigns against right deviation, "pulling up white flags" and the democratic revolution''s "make-up lessons"; Peng: the localities slow, the cases varied; of over 10,000 cadres under the Center and the Peking committee over 80 criticized these years, of the 800 at the enlarged meeting some ten most aggrieved; wholly wrong, wholly reversed; partly, partly; those who would exploit it, though rightly treated, to be criticized)'
- cite:
    id: cal.1962-04-23.china
    item: '[[w.peng-zhen-nianpu-1902]], IV, 191–193 (Apr. 22–May 3, 1962; Peng Zhen leads the NPC delegation (Chen Shutong and Zhang Zhizhong deputy heads; Yang Mingxuan, Li Zhuchen, Zhang Su, Liu Lanbo, Wang Ping and Yang Zhihua members; Yao Qin secretary-general) to Korea; Kim Il Sung, Premier and chairman of the Korean Workers'' Party, receives it at noon on Apr. 24 and gives it lunch)'
- cite:
    id: cal.1962-05-05.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 194 (May 5, 1962, afternoon; Peng Zhen at the meeting hearing Gu Mu on the regional economic commission directors'' meeting; his outline and the views on materials management to be printed for the coming work conference)'
