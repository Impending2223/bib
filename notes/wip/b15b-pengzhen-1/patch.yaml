      c: 'Peking 北京. Peng Zhen 彭真 with the leaders of the Peking Women''s Federation 北京市妇联 in the city districts on collectivizing the production and life of urban residents: the street residents the only ones not yet organized (over a thousand private doctors among them); production first, at set wages and prices, then mess halls and nurseries; none made to eat in the mess halls; no press, no drums; a part-time management committee.'
