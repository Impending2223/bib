- cite:
    id: cal.1961-08-05.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 145–146 (Aug. 5, 1961; Peng Zhen, with Deng Xiaoping, Lu Dingyi and Kang Sheng, writes to Mao and the Standing Committee, sending the draft regulations and the draft directive on discussing and carrying them out, with how they were made and their chief points)'
- cite:
    id: cal.1961-08-07.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 146 (Aug. 7, 1961, afternoon, the 270th meeting: Zhou on the world, grain and the market; the notice of the August work conference adopted; Aug. 8–11, afternoons, the 271st and 272nd: Li Fuchun on the planning conference and the supplementary plans for 1961 and 1962, Luo Ruiqing on military production, Li Xiannian on grain, Yao Yilin on prices and currency; Peng Zhen at all)'
- cite:
    id: cal.1961-08-10.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 146 (Aug. 10, 11, 12 and 14, 1961, afternoons; the 273rd meeting; Peng Zhen there; the draft regulations for state industrial enterprises discussed article by article, Bo Yibo, Li Xuefeng and others to revise them; a letter from Deng, Peng, Li Fuchun and Bo Yibo to Mao and the Standing Committee to be drafted and printed with them for the August work conference)'
- variant:
    id: cal.1961-08-10.china-leadership-2
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the Secretariat's 273rd meeting on the industrial regulations sits in the afternoons of Aug. 10, 11, 12 and 14 ("下午")
    at: IV, 146
- cite:
    id: cal.1961-08-15.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 146 (Aug. 15, 1961, afternoon; the 274th meeting adopts the draft regulations; that day the General Office prints them, with the letter, for those at the coming work conference)'
- cite:
    id: cal.1961-08-15.china-leadership-10
    item: '[[w.peng-zhen-nianpu-1902]], IV, 146–147 (Aug. 15, 1961; the letter: the regulations deal with enterprises'' internal problems, made by eleven work groups of the Secretariat and the Planning and Economic Commissions in plants at Peking, Shanghai, Tianjin, Taiyuan, Jilin and elsewhere, two months mostly, some four or five; eight main problems, the worst targets too high, tasks unsettled and materials short, responsibility gone and equipment damaged, science and the old workers slighted, management too dispersed; eighty articles; to be revised at the conference, then tried in the key enterprises as a draft)'
- cite:
    id: cal.1961-08-16.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 147–148 (Aug. 16, 1961, afternoon; the 275th meeting; Peng Zhen there; the letter of Deng, Peng, Li Fuchun and Bo Yibo adopted; the first draft of the Center''s directive on present industrial questions discussed, for the Lushan conference)'
- cite:
    id: cal.1961-08-17.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 148 (Aug. 17, 1961, evening; Peng Zhen at the reception of Sukarni Kartodiwirjo, the Indonesian Ambassador, for the sixteenth anniversary of Indonesia''s independence)'
- cite:
    id: cal.1961-08-18.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 148 (Aug. 18, 1961, afternoon; Peng Zhen at the signing of the joint communiqué by Liu Shaoqi and President Kwame Nkrumah and of the treaty of friendship by Zhou and Nkrumah, and of the agreements on economic and technical cooperation, trade and payments, and cultural cooperation)'
- cite:
    id: cal.1961-08-18.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 148 (Aug. 18, 1961; Peng Zhen, with Liu Shaoqi, Zhou Enlai and others, at the rally of 100,000 in the Workers'' Stadium welcoming Nkrumah, and speaks: Ghana the first independent state south of the Sahara, the Accra conferences a great encouragement; the treaty a new stage; China always with the African peoples)'
- cite:
    id: cal.1961-08-19.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 148–149 (Aug. 19, 1961, morning; Peng Zhen, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai and others, at the airport to see Nkrumah off to Moscow)'
- cite:
    id: cal.1961-08-23.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 149 (Aug. 23–Sept. 16, 1961; Peng Zhen attends; industry, grain, finance and trade, education; the directive on present industrial questions revised under Deng; the draft regulations for state industrial enterprises; Zhou''s rules for grain in 1961–62; the provisional regulations for the colleges; the decision on retraining cadres)'
- cite:
    id: cal.1961-08-23.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 149 (Aug. 23, 24 and 27, 1961; the 278th, 279th and 280th meetings; Peng Zhen there; the draft directive on present industrial questions and the Center''s rules on grain)'
- cite:
    id: cal.1961-08-28.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 150 (Aug. 28, 1961, afternoon; Peng Zhen at the plenary, Mao presiding, hearing Li Xiannian on the market and prices)'
- cite:
    id: cal.1961-09-02.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 150 (Sept. 2, 1961, afternoon; Peng Zhen at the plenary hearing Li Fuchun on the industrial plan)'
- cite:
    id: cal.1961-09-03.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 150 (Sept. 3, 1961, morning; Peng Zhen calls Kang Sheng, Hu Sheng, Wu Lengxi and others on the CPSU program for the Twenty-second Congress)'
- cite:
    id: cal.1961-09-14.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 150 (Sept. 14, 1961, afternoon; the 282nd meeting, Peng Zhen presiding; the directive on present industrial questions adopted, with the State Economic Commission''s report on coal allotment for September and the fourth quarter and the Center''s draft comment; Zhou''s views on grain, cotton, coal, cutting staff and the plan agreed)'
- cite:
    id: cal.1961-09-15.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 150–151 (Sept. 14, 1961; Peng Zhen sends Mao the three papers on industry, the colleges'' regulations and retraining cadres, adopted that afternoon by the enlarged Secretariat, the regional first secretaries and the Premier there; Sept. 15, Mao: "即送彭真同志照办")'
- cite:
    id: cal.1961-09-17.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 151 (Sept. 17, 1961, 3 a.m.; Mao returns the directive and general principles to Peng Zhen: very good, small changes in the directive (the page''s note: chiefly "用毛泽东思想" struck from the sentence on summing up the experience of leading industry); the papers revised and sent to the regional bureaus, the provincial committees and the State Council''s Party groups, dated Sept. 16)'
- cite:
    id: cal.1961-09-15.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 151 (Sept. 15, 1961, afternoon; Peng Zhen at Mao''s enlarged Standing Committee; Mao on ownership and distribution)'
