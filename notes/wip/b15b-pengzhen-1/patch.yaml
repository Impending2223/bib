    id: cal.1960-04-22.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 21 (Apr. 22, 1960, 10:30 p.m.; Peng Zhen, with Deng Xiaoping, Yang Shangkun and Wu Xiuquan, to Mao''s at Diaoyutai on Cuba, Algeria and Vietnam; they report the plan for May Day this year, celebrated in many places, without a parade)'
- cite:
    id: cal.1960-04-23.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 21 (Apr. 23, 1960; the 181st meeting; Peng Zhen there; Bo Yibo''s report on the provincial committees'' industrial secretaries'' conference heard and agreed; Peng: let the masses judge piece wages turned into time wages; too many meetings, the cadres cannot get down to work; the rural "three antis" this winter and next spring, the provinces trying models first before September or October)'
- cite:
    id: cal.1960-04-23.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 21 (Apr. 23, 1960, afternoon, Zhongnanhai, the Huairen Tang; Peng Zhen with Mao, Zhu De, Lin Biao, Deng Xiaoping, Song Qingling, Dong Biwu and others receives the militia delegates)'
- cite:
    id: cal.1960-04-23.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 21 (Apr. 23, 1960, afternoon, Zhongnanhai, the Jurentang; Xu Bing and Ping Jiesan report on the united front work forum to Peng Zhen; Peng: a change of class stand and world view is no easy thing, time to be given those willing to remold; the proletarian intellectuals not yet dominant; tension and relaxation in class struggle a law, the bourgeoisie now behind the times, "跟" not "反"; held tight in the main, relaxed in the minor)'
- cite:
    id: cal.1960-04-24.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 21 (Apr. 24, 1960, afternoon; Peng Zhen, with Deng Xiaoping and others, at the airport to welcome Blas Roca, general secretary of the Popular Socialist Party of Cuba, his wife and party)'
- cite:
    id: cal.1960-04-26.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 22 (Apr. 26, 1960, afternoon, Diaoyutai; Peng Zhen at Mao''s meeting on the publication of the fourth volume of his *Selected Works*)'
- cite:
    id: cal.1960-04-27.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 22 (Apr. 27, 1960, afternoon; Peng Zhen, with Deng Xiaoping, Kang Sheng, Yang Shangkun, Hu Qiaomu, Wu Lengxi and others, to Mao''s to talk)'
- cite:
    id: cal.1960-04-28.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 22 (Mao leaves Peking for Tianjin at 2 a.m. on Apr. 28, 1960)'
- cite:
    id: cal.1960-05-03.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 23 (May 3, 1960, afternoon; Peng Zhen, with Nie Rongzhen, He Long, Luo Ronghuan, Kang Sheng and others, at Deng Xiaoping''s meeting on the notes to the military part of the fourth volume of Mao''s *Selected Works*)'
- cite:
    id: cal.1960-05-04.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 23 (May 4, 1960, morning; Peng Zhen, with Tan Zhenlin, Kang Sheng, Hu Qiaomu, Luo Ruiqing and others, at Deng Xiaoping''s meeting, continuing on the notes to the fourth volume)'
- cite:
    id: cal.1960-05-05.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 23–24 (May 5, 1960, morning; the 182nd meeting; Peng Zhen there; the comment on the Public Security Ministry Party group''s report on a campaign of secrecy checks adopted; the Central Secrecy Committee to be Xie Fuzhi (chairman), Yang Shangkun, Song Renqiong, Zhao Erlu, Han Guang, Xiao Hua and Yang Qiqing; two thirds of the central organs'' scientific and technical journals to be stopped; Peng to call the leaders of the central and Peking organs, with the journals'' chief editors, to relay the Center''s instruction; Peng: the Young Pioneers to have nine hours'' sleep a day)'
- cite:
    id: cal.1960-05-07.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 24 (May 7, 1960; the 183rd meeting; Peng Zhen there; a *Renmin ribao* editorial to back the Supreme Soviet''s fifth session in condemning the American plane''s intrusion; the State Economic Commission Party group''s request on supplies and a materials management office agreed)'
- cite:
    id: cal.1960-05-09.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 25 (May 9, 1960; the 184th meeting; Peng Zhen there; the Center''s directives on the rural "three antis," on distribution in the rural communes, on grain distribution and on rural labor adopted; Peng: the "three antis" to use the slack farm season; at that night''s grain telephone conference it must be stressed that edema be wiped out this month, "无论如何不能再死人了" (no more may die, whatever it takes))'
- cite:
    id: cal.1960-05-09.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 25 (May 9, 1960, afternoon; Peng Zhen, with Deng Xiaoping and others, at the demonstration and rally of more than a million against the Japanese–American military alliance treaty; Guo Moruo presiding)'
- cite:
    id: cal.1960-05-11.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 26 (May 11, 1960, afternoon, Zhongnanhai, the Jurentang; Peng Zhen, with Luo Ruiqing and Liao Chengzhi, at Deng Xiaoping''s meeting)'
- cite:
    id: cal.1960-05-12.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 26 (May 12 and 13, 1960; the 185th meeting; Peng Zhen there; open criticism of modern revisionism and semi-revisionism to go on; Li Fuchun''s main points of the 1960–62 plan agreed in the main; Peng: organs and plans grown ever larger go against "more, faster, better, more economically"; a section on location in the plan, the big works (Baotou, Shanghai steel) to have their frames)'
- cite:
    id: cal.1960-05-16.china-leadership-9
    item: '[[w.peng-zhen-nianpu-1902]], IV, 27 (May 16, 1960; the 186th meeting; Peng Zhen there; the Korean Workers'' Party''s request agreed, China to give material support should north–south trade become possible; Luo Ruiqing, Yang Shangkun and the Peking committee to plan the leading organs'' shelters and an underground railway in Peking; Peng: university entry standards not lowered this year; the masses'' inventions not to be doused with cold water, nor puffed)'
- cite:
    id: cal.1960-05-17.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 28 (May 17, 1960, morning; Peng Zhen, with Song Qingling, Zhu De, Lin Biao, Deng Xiaoping and others, at the airport to welcome Zhou Enlai and Chen Yi back from Burma, India, Nepal, Cambodia and Vietnam; afternoon, Peng at Deng''s meeting of the Politburo members and the Secretariat on the international situation and Zhou''s report of the visits)'
- cite:
    id: cal.1960-05-17.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 28 (May 17, 1960, morning; Peng Zhen, with Lu Dingyi, Wang Jiaxiang, Wu Lengxi and others, at Deng Xiaoping''s meeting on the four-power summit (the page''s note: the Paris meeting of May 16, Khrushchev walking out when Eisenhower would not apologize for the U-2) and Zhou''s visits)'
- cite:
    id: cal.1960-05-19.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 19, 1960, about midnight; Peng Zhen receives Yang Shangkun''s call from Nanchang relaying Mao''s instruction for mass meetings across the country backing the Soviet stand on the four-power summit)'
- cite:
    id: cal.1960-05-20.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 20, 1960; the 187th meeting; Peng Zhen there; Zhang Zhizhong to write to Chiang Kai-shek on the Center''s Taiwan policy (the page''s note: Taiwan better in the Chiangs'' hands than America''s; after return all military and political power and appointments left to Chiang, Chen Cheng and Chiang Ching-kuo used as he wishes, the shortfall paid by the Center, social reform deferred until Chiang agrees, neither side to send agents); Deng Xiaoping''s speech for the afternoon''s rally revised)'
- cite:
    id: cal.1960-05-20.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 29 (May 20, 1960, afternoon; Peng Zhen, with Zhou Enlai, Zhu De, Song Qingling, Lin Biao, Deng Xiaoping and others, at the rally on Tiananmen Square and its branch places backing the Soviet Union and against America''s wrecking of the four-power summit; Deng speaks)'
- variant:
    id: cal.1960-05-20.china-leadership
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the rally on Tiananmen Square and at branch places 3,200,000 strong ("三百二十万人")
    at: IV, 29
- cite:
    id: cal.1960-05-23.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 23, 1960, afternoon; Peng Zhen at the meeting of the Politburo members and the Secretariat hearing Deng Xiaoping relay the talks of Mao, Liu Shaoqi, Zhou Enlai and others with Kim Il Sung at Hangzhou on the 21st on the situation after the summit''s failure, and Mao''s speech at his Hangzhou meeting that day)'
- cite:
    id: cal.1960-05-25.china-leadership-11
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 25, 1960; the 188th meeting; Peng Zhen there; ten more, Luo Ruiqing among them, to attend the enlarged Politburo of early June; material gathered on industrial accidents and on edema and starvation deaths in the villages, to study with the first secretaries at the meeting and learn from; Zheng Senyu (the page''s note: deputy secretary-general of the Chinese People''s Committee for World Peace) to attend the World Peace Council)'
- cite:
    id: cal.1960-05-27.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30 (May 27, 1960, morning; Peng Zhen, with Zhu De, Deng Xiaoping and others, at the airport to see Zhou and Chen Yi off to Mongolia)'
- cite:
    id: cal.1960-05-28.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 30–31 (May 28, 1960; the 189th meeting; Peng Zhen there; the State Planning Commission Party group''s report proposing the supplementary plan for the last three years of the Second Five-Year Plan and the other papers to be printed at once for those attending the enlarged Politburo)'
- cite:
    id: cal.1960-05-28.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 28, 1960; Peng Zhen receives the draft of the Center''s "Urgent directive on the transport of grain" and asks Deng Xiaoping and Li Fuchun to review it before it goes out)'
- cite:
    id: cal.1960-05-29.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 29, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Song Qingling, Deng Xiaoping and others, takes leave of Lin Boqu''s remains at the Peking Hospital)'
- cite:
    id: cal.1960-05-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 29, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Song Qingling, Deng Xiaoping and others, at the Peking Hospital)'
- cite:
    id: cal.1960-05-31.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 31, 1960, afternoon; Peng Zhen keeps vigil at Lin Boqu''s bier at the Working People''s Cultural Palace)'
- cite:
    id: cal.1960-06-02.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (June 2, 1960; Peng Zhen at the capital''s memorial of 10,000 for Lin Boqu)'
- cite:
    id: cal.1960-05-29.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 29, 1960, afternoon; Peng Zhen, with Deng Xiaoping and others, at Liu Shaoqi''s meeting on the eleventh session of the WFTU General Council, to be held at Peking)'
- cite:
    id: cal.1960-05-30.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (May 30, 1960; the 191st meeting; Peng Zhen there; the State Planning Commission Party group''s report proposing the supplementary plan adopted in the main)'
- cite:
    id: cal.1960-06-01.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (June 1, 1960, morning; Peng Zhen, with Zhu De, Song Qingling, Deng Xiaoping and others, at the airport to welcome Zhou and Chen Yi back from Mongolia)'
- cite:
    id: cal.1960-06-01.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (June 1, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Song Qingling, Dong Biwu, Deng Xiaoping and others, at the national congress of advanced units and workers of socialist construction in education, culture, health, sport and the press; with them receives its presidium)'
- cite:
    id: cal.1960-06-02.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (June 2, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Song Qingling, Dong Biwu and others, at the airport to welcome Haxhi Lleshi, Chairman of the Presidium of the Albanian People''s Assembly)'
- cite:
    id: cal.1960-06-02.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 31 (June 2, 1960, evening; Peng Zhen accompanies Liu Shaoqi in meeting Lleshi)'
- cite:
    id: cal.1960-06-03.china-leadership-7
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32 (June 3, 1960; the 192nd meeting; the arrangements for the enlarged Politburo at Shanghai in June; Peng Zhen to stay in Peking during the meeting and run the Secretariat''s daily work)'
- cite:
    id: cal.1960-06-03.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32 (June 3, 1960, evening; Peng Zhen at Liu Shaoqi''s banquet welcoming Lleshi)'
- cite:
    id: cal.1960-06-04.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32 (June 4, 1960; Peng Zhen at the Secretariat on the CPSU''s letter of June 2 proposing a meeting of the socialist countries'' parties at Bucharest during the Romanian party''s third congress; agreed, but not in June: about the October Revolution''s anniversary, in August at the earliest, with a joint Sino-Soviet drafting group; the reply to be settled after the Shanghai meeting)'
- cite:
    id: cal.1960-06-04.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 32–33 (June 4, 1960, afternoon; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De and others, at the rally of more than 10,000 in the Great Hall of the People welcoming Lleshi and the Albanian guests; his speech: American imperialism, having wrecked the summit, talks of "peace efforts" and of more talks with the Soviet Union while making tension everywhere and arming madly)'
- cite:
    id: cal.1960-06-05.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 33 (June 5, 1960, morning; Yang Shangkun from Hangzhou to Deng Xiaoping: Mao proposes the world parties'' meeting be put off to Nov. 7, the Chinese being busy in June and July; if agreed, delegates to the Soviet Union in August to draft together; to be settled at the Shanghai meeting)'
- cite:
    id: cal.1960-06-08.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 33 (June 8, 1960; Peng Zhen telephones Yang Shangkun at Shanghai: the CPSU Central Committee has written again on the 6th, the meeting it proposed put off, asking the Chinese Center''s view)'
- cite:
    id: cal.1960-06-06.china-leadership-6
    item: '[[w.peng-zhen-nianpu-1902]], IV, 33 (June 6, 1960; Peng Zhen''s comment issuing Li Xiannian''s telegram on moving grain urgently to Peking, Tianjin, Shanghai and Liaoning)'
- cite:
    id: cal.1960-06-06.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 33 (June 6, 1960; Peng Zhen telephones Yang Shangkun at Hangzhou on the WFTU council (the page''s note: Grishin''s draft report putting the communes, the leap and the steel drive in quotation marks))'
- cite:
    id: cal.1960-06-06.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 33–34 (June 6, 1960, evening; Peng Zhen, with Li Xiannian, Xi Zhongxun, Liu Lantao, Lin Feng and others, at Zhou Enlai''s banquet for the council''s delegates)'
- cite:
    id: cal.1960-06-09.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 34 (June 9, 1960, evening; Yang Shangkun telephones from Shanghai: Mao and the Standing Committee decide Peng Zhen, Kang Sheng and Wang Jiaxiang shall attend the Romanian Workers'' Party''s third congress and the brother parties'' meeting at Bucharest)'
- cite:
    id: cal.1960-06-11.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 34–35 (June 11, 1960; Peng Zhen, with Wang Jiaxiang and others, reaches Shanghai and attends Mao''s meeting on the delegation to the Romanian congress and its meeting with the brother parties; Mao: Khrushchev may attack or may court them, be ready for both; the Soviet delegation''s leader at the WFTU meeting in Peking was bad; Mao''s six phrases: hold to unity, hold to principle, learn the facts, strike after the other side, argue with reason, leave room)'
- cite:
    id: cal.1960-06-14.china-leadership-4
    item: '[[w.peng-zhen-nianpu-1902]], IV, 35 (June 14, 1960, evening; Peng Zhen learns by Yang Shangkun''s call from Shanghai that Wang Jiaxiang, ill, cannot go; Wu Xiuquan to go instead)'
- cite:
    id: cal.1960-06-16.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 35–36 (June 17, 1960, 3 to 11:20 p.m. Moscow time, at the CPSU Central Committee''s building; Peng Zhen''s delegation with Kozlov and other Presidium members, Liu Xiao there; the Soviet side wants "the mutual relations of the two parties" discussed and faults the Chinese line on the epoch, war and peace, coexistence, peaceful transition, relations between parties, domestic policy, the "hundred flowers," the economy and India; Peng answers point by point; over eight hours; Peng at the end: the two parties should and can unite, and should exchange views often)'
- variant:
    id: cal.1960-06-16.soviet-union
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the talks with Kozlov and the other Presidium members on June 17, 1960, from 3 p.m. to 11:20 p.m., Moscow time, at the CPSU Central Committee's building, Ambassador Liu Xiao present; the delegation reached Moscow June 16
    at: IV, 35
- cite:
    id: cal.1960-06-20.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 36 (June 20, 1960, 9 a.m. local time; Peng Zhen leads the delegation at the congress; the delegations or representatives of the parties of forty-six countries invited)'
- cite:
    id: cal.1960-06-22.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 37 (June 22, 1960, evening; Peng Zhen''s talk with Khrushchev, six hours, most of it Khrushchev''s charges against the Chinese party; asked how the meeting of the 24th is to go, Khrushchev: the Soviet delegation has a paper of views on the Chinese party to hand round there, and will propose a short communiqué or resolution; Peng: too hurried)'
- cite:
    id: cal.1960-06-23.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 37–38 (June 23, 1960, 3 p.m.; Andropov, head of the CPSU Central Committee''s liaison department, hands the delegation at its lodging the CPSU''s letter to Mao and the "Notification to Comrade Mao Zedong of the CCP Central Committee," its Chinese copy 84 pages, on the *Renmin ribao* and *Hongqi* Lenin articles, Lu Dingyi''s speech and the Chinese at the WFTU council; dated June 21, delivered two days later)'
- variant:
    id: cal.1960-06-23.soviet-union
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: the letter and the "Notification" handed to the delegation at its lodging by Andropov, head of the CPSU Central Committee's liaison department, at 3 p.m. on June 23 ("下午三时")
    at: IV, 37
- cite:
    id: cal.1960-06-24.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 38–39 (June 24, 1960; Peng Zhen leads the delegation at the first meeting of the twelve parties'' delegations, Gheorghiu-Dej presiding, Khrushchev leading the Soviet delegation; Peng asks whether it is to exchange views as the CPSU''s letter of June 7 proposed or to condemn the Chinese party; Khrushchev: views; after the Bulgarian and Czech speakers Peng names five differences (the epoch; war and peace, disarmament no line for revolution; peaceful transition; unity on Marxism–Leninism; the Indian border and the WFTU council), "one finger of ten" but not trivial; a surprise attack, the delegation not authorized to sign; when Khrushchev calls the ten others by name, Peng: no vote possible today, not their responsibility; asks two or three days more, at least forty-eight hours, to ask the Center)'
- cite:
    id: cal.1960-06-25.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 39 (June 25, 1960, morning; Peng Zhen at the first meeting of the fifty-one parties at the congress; after twenty capitalist countries'' parties speak, he explains the dispute at the WFTU council (the report attacking China''s domestic policy; seventeen brother parties'' leaders invited to settle it inside), the Chinese party''s view of peace, war and revolution, and, the translator reading out the CPSU''s letter of June 7 (views exchanged, no decision), that the meeting condemns the Chinese party and demands a signature against the agreement; the delegation will not sign without the Center''s authority; the communiqué adopted, they reserve the right to speak later)'
- cite:
    id: cal.1960-06-25.china-leadership-8
    item: '[[w.peng-zhen-nianpu-1902]], IV, 40 (June 25, 1960; Peng Zhen telephones Yang Shangkun in Peking)'
- cite:
    id: cal.1960-06-25.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 40 (June 25, 1960; Peng Zhen, Kang Sheng and Wu Xiuquan receive the Center''s letter with the revised draft communiqué, the delegation''s statement and Zhou''s draft letter; the delegation may sign once the two papers are handed out; the course proposed by Deng Xiaoping''s Secretariat on the morning of the 24th, decided by Mao, Liu Shaoqi, Zhou and Chen Yun at Shanghai)'
- cite:
    id: cal.1960-06-26.soviet-union-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 40 (June 26, 1960, 2 to 4:30 a.m.; Peng Zhen calls on Gheorghiu-Dej, first secretary of the Romanian Workers'' Party: the Center''s amendments and statement; a meeting of the socialist countries'' parties asked; the delegation will sign for unity, Mao having told it to hold to unity and to principle; the amended draft handed to him to give round; Gheorghiu-Dej: right, for the sake of the whole; Peng: the Chinese party obeys only the truth, "可以被压成粉末，但是，绝不会被压扁" (may be ground to powder, but never flattened))'
- cite:
    id: cal.1960-06-26.soviet-union
    item: '[[w.peng-zhen-nianpu-1902]], IV, 40–41 (June 26, 1960, 10:50 a.m., the second meeting of the twelve; Peng: authorized to sign for unity, but the draft silent on the great questions and on the chief danger in the labor movement, so "不能接受这个草案" as it stands; amendments handed round; failing agreement, a drafting committee of the twelve socialist parties and fourteen of capitalist countries, at Moscow, this autumn, called by the CPSU)'
- cite:
    id: cal.1960-06-29.china-leadership
    item: '[[w.peng-zhen-nianpu-1902]], IV, 42 (under June 27, 1960)'
- variant:
    id: cal.1960-06-29.china-leadership
    unit: A
    witness: w.peng-zhen-nianpu-1902
    reads: 'the editorial printed June 27, 1960 (under that day: "《人民日报》发表题为《高举莫斯科宣言的马克思列宁主义革命旗帜》的社论")'
    at: IV, 42
- cite:
    id: cal.1960-06-28.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 42 (June 28, 1960; Peng Zhen leads the delegation back to Peking; Deng Xiaoping, Li Fuchun and others at the airport)'
- cite:
    id: cal.1960-06-29.china-leadership-3
    item: '[[w.peng-zhen-nianpu-1902]], IV, 42 (June 29, 1960, morning; Peng Zhen, with Deng Xiaoping, meets Lê Duẩn, secretary of the Lao Động''s Secretariat)'
- cite:
    id: cal.1960-06-29.china-leadership-5
    item: '[[w.peng-zhen-nianpu-1902]], IV, 42 (June 29, 1960, evening; Peng Zhen, Kang Sheng, Wu Xiuquan and the whole delegation at the dinner given by Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and others; after it a Peking opera evening in the Huairen Tang)'
