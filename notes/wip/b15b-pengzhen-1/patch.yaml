    item: '[[w.peng-zhen-nianpu-1902]], IV, 9 (Mar. 20, 1960, 10 p.m. to midnight; Peng Zhen, with Zhou Enlai, Deng Xiaoping and others, at Liu Shaoqi''s meeting on the Sino-Nepalese boundary and economic aid agreements and the joint communiqué)'
- cite:
