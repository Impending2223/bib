    item: '[[w.peng-zhen-nianpu-1902]], IV, 61 (Sept. 27, 1960, afternoon, and Sept. 28, afternoon; Peng Zhen at Mao''s enlarged Standing Committee in the Yinian Tang on preparing the draft declaration of the twenty-six parties; Chen Yi, Kang Sheng, Lu Dingyi, Li Jingquan, Yang Shangkun and Hu Qiaomu there)'
