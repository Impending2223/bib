    item: '[[w.peng-zhen-nianpu-1902]], IV, 134 (June 15, 1961, afternoon; Peng Zhen, with Zhou Enlai and others, at the meeting in the Great Hall of the People welcoming Phạm Văn Đồng, and speaks: the Chinese people wholly back the Vietnamese against American aggression and for peaceful reunification; Vietnam will surely be one)'
- cite:
    id: cal.1961-06-16.china-leadership-4
