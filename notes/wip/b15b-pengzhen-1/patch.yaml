    id: cal.1961-03-25.china-leadership-2
    item: '[[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 25, 1961, afternoon; Peng Zhen, with Zhou Enlai, Lin Biao, Deng Xiaoping and others, at the public memorial for Chen Geng in Zhongshan Park (the page''s note: Chen Geng, 1903–1961, member of the Central Committee and the Military Commission and Vice-Minister of National Defense; died at Shanghai Mar. 16))'
