  - add:
      entry:
        id: cal.1961-07-17.china-leadership-11
        when: July 17
        date: '1961-07-17'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 holds a forum of the heads of Suzhou prefecture 苏州专区 and of Wu 吴县, Wujiang 吴江, Changshu 常熟 and Kunshan 昆山 counties on double-cropped rice, private plots and grain purchase: of the prefecture''s 1,000,000-odd mu, only 10,000 were double-cropped when they were urged, and this year''s more in Wu county is 2.8 percent, "enlightened gentry" who know too much double-cropping means no rice; calling it a struggle of two roads is too big a hat; broad beans, food and vegetable both, earn more abroad than wheat; give the members more private plots, whose four and a half hours a day yield better than seven on the collective''s; the nation''s grain was 360 billion jin in 1957 and is put at 290 billion this year, 10 billion imported, five times the Nationalists'' 国民党 imports; the surplus districts must sell more; their ration of 370–380 jin to go first to 430, then to 506.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 97–98. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-18.china-leadership-8
        when: July 18
        date: '1961-07-18'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 holds a forum with some brigade Party branch secretaries of Suzhou prefecture 苏州专区 on crops, private plots and pigs: double-cropped rice to eke out rations, not too much of it; more broad beans, less wheat, beans exported and wheat imported; vegetables not crowded out by grain; the Shanghai 上海 vegetable trade along the Shanghai–Nanjing 沪宁 and Shanghai–Hangzhou 沪杭 lines and the manure that came back are cut off; early indica rice next year; private plots 6 percent of the land, 4 in fields and 2 by the houses; the sows to go to the members at once.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 98–99. Made public: 2015. To check: 《陈云文集》, where the nianpu says it is collected, as 《同苏州部分生产大队党支部书记座谈时的讲话》. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-18.china-leadership-9
        when: July 18
        date: '1961-07-18'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 talks with Wang Rensan 王人三, secretary of the Suzhou 苏州 city committee, Fan Yi 凡一, Zhu Xiafei 朱霞飞, head of the second troupe of the Suzhou Pingtan Troupe 苏州评弹团, Zhou Liang 周良, Pan Boying 潘伯英 and the pingtan 评弹 writer Qiu Xiaopeng 邱肖鹏 on revising *The Pearl Pagoda* 《珍珠塔》: all to set to work, several versions to be compared; the troupes to play often in the north, to widen their name and their learning, and see the Palace Museum 故宫, the Great Wall 长城 and paintings; Suzhou''s and Shanghai''s 上海 pingtan to work together to train more and better players.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 99. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07.china-leadership-11
        when: July, after the 18th
        date: 1961-07
        at: after 1961-07-18
        place: suzhou
        thread: china-leadership
        c: Suzhou 苏州. The Suzhou culture bureau 苏州文化局, with the consent of the Jiangsu 江苏 provincial and Suzhou city committees, begins to prepare a Suzhou Pingtan School 苏州评弹学校, after Chen Yun's 陈云 talk of July 18.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 99. See [[cal.1961-07-18.china-leadership-9]]. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1961-07.china-leadership-12
        when: July, at Shanghai, between the 19th and the 25th
        date: 1961-07
        at: after 1961-07-19
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云, resting there July 19–25, tells the heads of the Shanghai city committee 中共上海市委 of the Qingpu 青浦 inquiry and its findings. On pigs, Ke Qingshi 柯庆施 objects to private raising as the main course; Chen Yun answers that pigs are better kept privately: the state spends nothing and the peasants know how; the collective keeps more, but so thin there is no meat.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 99. Made public: 2015. Names: Chen Yun, Ke Qingshi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:ke-qingshi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-25.china-leadership-9
        when: July 25
        date: '1961-07-25'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 writes his opinions on jokes, light items and the traditional story episodes 《目前关于噱头、轻松节目、传统书回处理的意见》 of pingtan 评弹: jokes, but not loosed at will; light items, but not low ones; dig out the traditional episodes, but also revise and play new middle-length and short pieces fit to keep; doubtful old pieces to be tried and discussed inside before they are played in public, and looked at again after a time.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 99. Made public: 2015. To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-25.china-leadership-10
        when: July 25
        date: '1961-07-25'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团 on treating the traditional repertoire rightly: not all let out at once, back to the old road; where unsure, slower is better than wrong; hear opposing views, right or wrong: they are a guarantee of fewer mistakes.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 99–100. Made public: 2015. To check: 《陈云文集》, where the nianpu says it is collected, as 《正确对待传统书目》. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-26.china-leadership-12
        when: July 26
        date: '1961-07-26'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Chen Yun 陈云 tells the heads of the Jiangsu 江苏 provincial committee the ten questions of Qingpu 青浦 and their findings: in fifteen days at home he heard four complaints of the peasants: they go hungry; the cadres boast of high targets, work little and live apart; the cadres do not criticize themselves (double-cropping, draining ponds, wheat for broad beans, close planting, the mess halls, the collective pigs left unexplained); the collective''s work is badly organized. The province, the city and the Center share the blame: "I am in the Center, and I have made mistakes too." Ke Qingshi 柯庆施, at Shanghai 上海, would have wheat, which goes up, not broad beans, which the peasants eat; but a mu of beans sells for 360 yuan, and eaten they go into the peasants'' bellies, not Eisenhower''s or Kennedy''s.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 100–101. Made public: 2015. To check: 《陈云文集》, where the nianpu says it is collected, as 《同江苏省委负责人谈农村问题》. Names: Chen Yun, Ke Qingshi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:ke-qingshi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-07-27.china-leadership-9
        when: July 27
        date: '1961-07-27'
        place: tianjin
        thread: china-leadership
        c: 'Tianjin 天津. Chen Yun 陈云 tells the heads of the Hebei 河北 provincial committee of the Qingpu 青浦 inquiry: privately kept sows do better (two days of meetings on it; given back, the dying ones lived and the thin grew fat), and pig manure is the main way out while chemical fertilizer is short; double-cropped rice is worse than single in places, and the north too should not blow away the people''s old ways; private plots are as little as 2 or 3 percent in some southern counties and communes, and without them, and grain to the household, democracy is empty; own the mistakes to the people, which raises the cadres'' standing.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 101. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-07-24.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 101 (July: the Anhui 安徽 provincial committee''s report to the Center 《关于试行田间管理责任制加奖励办法的报告》, stressing that the contract system is neither household contracting nor going it alone)'}
  - cite: {id: cal.1961-07-08.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 101 (before the Anhui report of July, Zeng Xisheng 曾希圣 reports to Mao, passing Bengbu 蚌埠 by train, on the responsibility fields, and has his consent to spread them; undated)'}
  - cite: {id: cal.1961-11-14.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 101 (the Center issues the directive on socialist education in the villages 《关于在农村进行社会主义教育的指示》 on Nov. 13: household contracting and disguised going it alone not in keeping with the collective economy, the peasants to be led away from them step by step)'}
