  - cite: {id: cal.1962-01-11.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 119–120 (Chen Yun attends, Jan. 11–Feb. 7; the leading cadres of the Center, the regional bureaus, the provincial, prefectural and county committees, the key works and the army; first stage, Liu Shaoqi''s written report discussed and revised, Liu: three fingers to seven, in places "three parts natural disaster, seven parts man-made"; second, at Mao''s call, a meeting to vent grievances, Zhou and Deng examining themselves for the State Council and the Secretariat, Lin Biao: the difficulties came of not doing as Mao said; Chen Yun does not speak)'}
  - cite: {id: cal.1962-01-30.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 119–120 (Mao: in socialist construction still much blindness, a realm of necessity not yet known; he does not understand much of industry and commerce; Liu Shaoqi, Zhou Enlai and Deng Xiaoping understand more; "Comrade Chen Yun understands more"; his method is inquiry, and till he has looked into a thing he will not speak: "This time I asked him to speak, and he said he would not. I asked, what year will you speak? He said, in half a year"; over a hundred years to catch up with the most advanced capitalist countries)'}
  - cite: {id: cal.1962-01.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 120 (as Mao tells it in his speech of Jan. 30: asked to speak, Chen Yun said he would not, and would speak in half a year)'}
  - cite: {id: cal.1962.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 120 (as Mao tells it in his speech of Jan. 30, 1962: asked to speak, Chen Yun said he would not, and would speak in half a year)'}
  - cite: {id: cal.1962-01-17.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 120 (Jan. 17: Chen Yun at the first meeting of the drafting committee, called by Liu Shaoqi; its nineteen members Liu, Zhou, Deng, Chen Yun, Li Fuchun, Li Xiannian, Bo Yibo and others)'}
  - cite: {id: cal.1962-02-05.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 120 (evening: Chen Yun with Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Dong Biwu, Lin Biao, Deng Xiaoping and others at the General Political Department''s Spring Festival gala in the Great Hall of the People 人民大会堂)'}
  - cite: {id: cal.1962-02-08.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 120–122 (Feb. 8, morning: Chen Yun addresses the whole Shaanxi 陕西 delegation: a great victory, not to be underrated; the blame first the Center''s; Party life abnormal these years, men saying "only three parts of what they think"; fear not wrong words but silence; heed contrary views; to know rightly, "exchange, compare, repeat": over 90 percent of the time on inquiry, every plan compared with the present, the past and abroad, then weighed again later; the Guanzhong 关中 plain''s grain at best 6.9 billion jin, 5.4 billion a year, 3.8 billion last year; four ways out: grow more, import, cut the towns, eat less; more cannot be grown soon, imports are limited (10 billion jin last year), cut people the sooner the better, and eat less for three to five years, telling the peasants so)'}
  - to-check: {id: cal.1962-02-08.china-leadership-3, add: '[[w.chen-yun-wenxuan-1956]] (part, as 《怎样才能使我们的认识更正确些》) and 《陈云文集》 (part, as 《解决当前困难的几条办法》), where the Chen Yun nianpu says the speech is collected ([[w.chen-yun-nianpu-xiuding]], III, 122).'}
  - add:
      entry:
        id: cal.1962-02-08.china-leadership-6
        when: Feb. 8
        date: '1962-02-08'
        time_range: ['1962-02-08T04:00Z', '1962-02-08T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 at the Central Work Conference 中共中央工作会议 on grain, finance, the market, the staff cuts and the relaying of the Seven Thousand Cadres Conference 七千人大会, and speaks. To balance the year''s budget: 500 million yuan more off administration and education; the 700 million of IOUs to the peasants for goods taken put off three years; 400 million from grain bonus prices and the provinces'' own crop prices; 500–600 million of bond and fixed-interest payments put off; the peasants to buy co-operative shares, a yuan each; construction held to 6 billion. The market: buying power 57.5 billion, goods 57 billion, but grain, cotton and oil alone 7 billion under 1957 and prices up 20 percent, so the gap is 2.5 to 3 billion; 1 to 1.5 billion more goods, and 10 million paid workers off the towns, not 7 million, saving 2.5 billion in notes this year, 5 the next (1957: 370 billion jin of grain, 27 million dan of cotton, under 100 million townspeople, a wage bill of 15.6 billion; now 300 billion, 17 million, 120 million and 23.3 billion). Sugar: 875,000 tons at fixed price and 265,000 at high price last year, 3.35 billion yuan drawn back; 350,000 tons grown, 1.75 million imported; the fixed ration halved, high-priced sugar kept. Either print money and collapse, or cut the towns and grow slowly. For the towns, beans: 3 jin a month each, 3 billion of the 12 billion jin crop.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 122–124. The words: 下午 (122–124). Made public: 2015. To check: 《陈云文集》, where the nianpu says it is collected, as 《当前财政和人民生活方面的几个问题》. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1962-02-11.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 124 (Feb. 11: Chen Yun with Liu Shaoqi, Zhou and Deng at the Peking Hospital 北京医院 to take leave of Li Kenong''s 李克农 body; Feb. 13, at the capital''s memorial, Zhou presiding, Chen Yun, Deng and Dong Biwu with him; Li died on the 9th)'}
  - add:
      entry:
        id: cal.1962-02-15.china-leadership-7
        when: Feb. 15
        date: '1962-02-15'
        thread: china-leadership
        c: 'Chen Yun 陈云 forwards to the heads of the Ministry of Chemical Industry 化工部 the First Ministry of Machine Building''s 一机部 report asking the Ministry of Metallurgy 冶金部 to make special steel strip for the fertilizer plants'' big high-pressure vessels, with a comment: try first, then act; nothing made before the state tests it; the trial material cannot come from Metallurgy, only from abroad; new proposals are to be heeded and encouraged, but handled with great care, nothing done without certainty.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 124. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
