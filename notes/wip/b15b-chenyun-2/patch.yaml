        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡, on raising the new pingtan 评弹 stories: the new long pieces seldom use the Yu tune 俞调 (Yu Xiushan''s 俞秀山, lyrical, for women''s parts), which should be kept; the Chen tune 陈调 (Chen Yuqian''s 陈遇乾, for old men) is used widely and well; turning roles from Peking and Kun opera 京、昆剧 into spoken-drama roles takes time; one or two long pieces first, done well. He asks how the audiences changed with the new stories, what the old players do now, and how the collectively owned troupes divide their income.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 145. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]] (as 《关于新书的提高问题》); [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1964-04-30.china-leadership-12
        when: Apr. 30
        date: '1964-04-30'
        place: suzhou
        thread: china-leadership
        c: 'Suzhou 苏州. Chen Yun 陈云 answers Wu Zongxi 吴宗锡, thanking him for his account of the pingtan 评弹 world: on the collectively owned troupes'' funds, shares and the players'' pensions he can offer no views, having read no Party documents for two years and no newspapers for one.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 145. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1964-05-10.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 146 (May 10 and 11: Mao hears the Planning Commission''s leading group on the Third Five-Year Plan: industry to serve farming; do what money allows; not by our life spans but by objective laws; leave room; he misses Comrade Chen Yun, who in the Great Leap, when all heads were hot, argued many times for lower targets; the lessons of high targets, high procurement and boasting never to be forgotten or repeated)'}
  - cite: {id: cal.1964-05-15.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 146 (May 15–June 17: on the preliminary ideas for the Third Five-Year Plan (1966–70), farm plans, the rural socialist education movement and against revisionism; Mao: planning learned from the Soviets, steel first, to be changed, farming the base and industry the lead, grain and cotton first, then fertilizer and steel; the country in first, second and third lines, the third line to be built; a third of the basic levels'' leadership not in true Communists'' hands; Chen Yun absent, ill)'}
