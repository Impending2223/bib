  - add:
      entry:
        id: cal.1966-07-26.china-leadership-6
        when: July 26
        date: '1966-07-26'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, by letter to Zhou Enlai 周恩来, on his health: his nerves better, but the dizziness not cured, a low fever in the mornings, his strength poor, a walk of a thousand-odd meters a day; he has read the important cables and papers since June last year, and would like to see the papers of the agriculture group of the eight northern provinces 北方八省农业小组 (set up Mar. 7, 1966, Zhou its head, for Shanxi 山西, Hebei 河北, Shandong 山东, Henan 河南, Shaanxi 陕西, Inner Mongolia 内蒙古, Liaoning 辽宁 and Peking).'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 154. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - cite: {id: cal.1966-08-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 154–155 (Chen Yun attends, Aug. 1–12, Mao presiding; Liu Shaoqi takes responsibility for the work teams; after Mao''s poster the plenum turns to exposing and criticizing Liu, and Zhu De, Chen Yun, Deng Zihui, Bo Yibo and others are criticized in varying degree; no chairman or vice-chairmen re-elected, Lin Biao alone afterward called vice-chairman, the vice-chairmanships of Liu, Zhou, Zhu De and Chen Yun no more mentioned)'}
  - cite: {id: cal.1966-08-04.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 154 (Mao sharply calls the work teams'' sending a suppression of the student movement, a question of direction and a line error: "the ghosts and monsters are among those sitting here")'}
  - cite: {id: cal.1966-08-05.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 154–155 (Mao''s poster: some leading comrades from the Center to the provinces have for fifty-odd days struck down the vigorous Cultural Revolution, a white terror; "linked to the right tendency of 1962 and the ''left'' in form but right in essence tendency of 1964")'}
  - cite: {id: cal.1966-08-08.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 155 (the Sixteen Points: a revolution that touches the soul; the movement''s stress the power-holders in the Party taking the capitalist road; dare, rouse the masses boldly; big-character posters and great debates)'}
  - cite: {id: cal.1966-08-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 155 (on Mao''s proposal the Standing Committee widened from seven to eleven: Mao, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun)'}
  - add:
      entry:
        id: cal.1966-08-06.china-leadership-8
        when: Aug. 6
        date: '1966-08-06'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, by letter to Mao Zedong 毛泽东 and the Center 中共中央: he has read the decision on the Great Proletarian Cultural Revolution 《关于无产阶级文化大革命的决定》 (the revision of Aug. 3), wholly agrees with rousing the masses boldly and with its policies, and wholly supports the course of Chairman Mao and the Center.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 155. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-08-07.china-leadership-9
        when: Aug. 7
        date: '1966-08-07'
        time_range: ['1966-08-07T11:00Z', '1966-08-07T14:00Z']
        time_band: evening
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhou Enlai 周恩来 and Tao Zhu 陶铸 tell Chen Yun 陈云 of Mao''s proposed order for the Politburo Standing Committee; they talk. Zhou asks why, resting all these years at Canton 广州, Hangzhou 杭州, Suzhou 苏州 and Shanghai 上海, he never called on Lin Biao 林彪; Chen Yun: "I did not know where he lived"; Zhou urges him to seek Lin out.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 155. See [[cal.1966-08-05.china-leadership-8]]. The words: 晚 (155). Made public: 2015. Names: Chen Yun, Zhou Enlai, Tao Zhu, Lin Biao.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:zhou-enlai', 'name:tao-zhu', 'name:lin-biao', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-08.china-leadership-65
        when: Aug., at the new Standing Committee's first meeting, after the 12th
        date: 1966-08
        at: after 1966-08-12
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yun 陈云, at the first meeting of the new Politburo Standing Committee 中央政治局常委, asks Lin Biao 林彪 to his face for a talk; Lin agrees, but the talk never comes.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 155. See [[cal.1966-08-07.china-leadership-9]]. Made public: 2015. Names: Chen Yun, Lin Biao.'
        tags: ['polity:prc', 'name:chen-yun', 'name:lin-biao', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-08-10.china-leadership-7
        when: Aug. 10
        date: '1966-08-10'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Kang Sheng 康生, at the East China group 华东组 of the Eleventh Plenum 中共八届十一中全会, attacks Chen Yun 陈云: his thinking has long opposed Chairman Mao''s 毛泽东; he sets up as the economic expert, his economics above Mao''s; read his report of 1962: all economics and no politics, a capitalist merchant''s economy.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 155–156. See [[cal.1966-08-01.china-leadership]]. Made public: 2015. Names: Kang Sheng, Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:kang-sheng', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1966-08-18.china-leadership-12, item: '[[w.chen-yun-nianpu-xiuding]], III, 156 (Chen Yun at the capital''s rally of a million in Tiananmen Square celebrating the Cultural Revolution, and talks briefly with Mao in the hall of the Tiananmen gate; Mao meets the Red Guards for the first time)'}
  - cite: {id: cal.1966-08-31.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 156 (Chen Yun at Mao''s second reception of the Red Guards and teachers and students)'}
  - add:
      entry:
        id: cal.1966-08-31.china-leadership-11
        when: Aug. 31
        date: '1966-08-31'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 answers the students of the Tianjin Engineering Institute 天津工学院 on the history of Yuan Xuezu 袁血卒, its vice-president and deputy Party secretary (a Party member from 1927, a leader of the Ningdu rising 宁都起义 of 1931, twice jailed in 1935 and 1936 without betraying the Party): twenty-five or twenty-six years ago, in the Organization Department 中共中央组织部 at Yan''an 延安, he settled Yuan''s case, but no longer recalls the verdict; after Liberation the Organization Department settled it again, he heard.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 156. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-09-02.china-leadership-8
        when: Sept. 2
        date: '1966-09-02'
        place: peking
        thread: china-leadership
        c: 'Peking 北京, the Great Hall of the People 人民大会堂. Chen Yun 陈云 receives the students of the Tianjin Engineering Institute 天津工学院 come to look into Yuan Xuezu''s 袁血卒 past: "black gang" is not a word to use lightly; he settled Yuan''s history twenty-odd years ago and forgets the verdict, but that Yuan surrendered and betrayed the Party and the country he does not accept: how would the Center make such a man deputy Party secretary? Yuan''s file is in the Organization Department; better not to read it; let Yuan take it to the Center late in the movement. The students, who came to bring Yuan down, come to ask that he be made a revolutionary leading cadre.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 156–157. See [[cal.1966-08-31.china-leadership-11]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1966-09-15.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun at the third reception; Mao asks after his health: "In the Cultural Revolution I have not struck you down; rest and get well, and work later")'}
  - cite: {id: cal.1966-09-30.china-leadership-6, item: '[[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun at the banquet in the Great Hall of the People for the seventeenth anniversary)'}
  - cite: {id: cal.1966-10-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun at the capital''s rally at Tiananmen for the seventeenth anniversary and at Mao''s fourth reception of the Red Guards)'}
  - cite: {id: cal.1966-10-09.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun attends, Oct. 9–28, Mao presiding; Lin Biao and Chen Boda name Liu Shaoqi and Deng Xiaoping for a bourgeois line; Liu, in his self-criticism, ties it to his "right errors" of 1962, among them backing Chen Yun''s report and proposing him for head of the Central Finance and Economics Small Group: he learned only later that Mao did not agree; Mao: the first and second lines meant his views could not be carried out in Peking; "I lit this fire"; not all Liu''s and Deng''s fault; Zhou on the last day on relaying the conference)'}
  - cite: {id: cal.1966-10-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 158 (Chen Yun at the fifth reception, in one car with Zhu De, Dong Biwu and Li Fuchun; he asks Zhu De about Kang Keqing 康克清, taken by Red Guards to be paraded, and advises him to go out as little as he can)'}
  - add:
      entry:
        id: cal.1966-10-30.china-leadership-5
        when: Oct. 30
        date: '1966-10-30'
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yun 陈云 gives the Central Work Conference 中共中央工作会议 a written self-criticism of his "grave errors" before and after Liberation, his "right errors" of 1962 among them.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 157–158. See [[cal.1966-10-09.china-leadership]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1966-12.china-leadership-30
        when: Dec.
        date: 1966-12
        thread: china-leadership
        c: 'As the *Chen Yun nianpu* reports it: after the work conference the attack on the "bourgeois reactionary line" rises to its height, and from December crowds marching in many places, stirred by the Central Cultural Revolution Group 中央文革小组, shout "Down with Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平."'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 157–158. Names: Liu Shaoqi, Deng Xiaoping.'
        tags: ['polity:prc', 'form:state', 'name:liu-shaoqi', 'name:deng-xiaoping']
  - cite: {id: cal.1966-11-03.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 158 (Chen Yun at the sixth reception)'}
  - cite: {id: cal.1967-01-04.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 159 (Chen Boda, Kang Sheng and Jiang Qing, receiving rebel representatives, attack Tao Zhu as a firm executor of the Liu–Deng line; from then he is cruelly persecuted)'}
  - add:
      entry:
        id: cal.1969-11.china-leadership-12
        when: Nov.
        date: 1969-11
        place: hefei
        thread: china-leadership
        c: Hefei 合肥. Tao Zhu 陶铸 dies, wronged, persecuted since January 1967.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 159. See [[cal.1967-01-04.china-leadership-2]]. Names: Tao Zhu.'
        tags: ['polity:prc', 'name:tao-zhu']
  - cite: {id: cal.1967-01-06.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 159 (the Shanghai rebels, planned and led by Zhang Chunqiao and Yao Wenyuan, seize the Shanghai Party and government power, the storm of the "January Revolution")'}
  - cite: {id: cal.1967-01-22.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 159 (the editorial "Proletarian revolutionaries unite and seize power from the capitalist-roaders!"; the wind of seizing power sweeps the country, beating, smashing, looting and armed fights spread, "great disorder under heaven")'}
  - cite: {id: cal.1967-01-11.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 159 (the Politburo decides that Liu Shaoqi, Deng Xiaoping, Tao Zhu, Chen Yun and He Long are no longer to be told of its meetings)'}
  - add:
      entry:
        id: cal.1967-01.china-leadership-43
        when: Jan., mid-month
        date: 1967-01
        at: before 1967-01-11
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Boda 陈伯达, at a rally of the Peking colleges' rebels, says that among the capitalist-roaders in the Center "at least one more figure has not been dragged out"; soon slogans, posters and "great criticism" articles attacking Chen Yun 陈云 appear in Peking's streets and the rebels' papers.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 159. Names: Chen Boda, Chen Yun.'
        tags: ['polity:prc', 'name:chen-boda', 'name:chen-yun']
  - add:
      entry:
        id: cal.1967-01.china-leadership-44
        when: Jan., mid-month
        date: 1967-01
        at: before 1967-01-11
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yun 陈云, against the worst, sends his secretary to clear the papers from his home on Beichang Street 北长街 to the Xinliusuo 新六所, and has some papers of the Party's and the state's secrets burned.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 159. See [[cal.1967-01.china-leadership-43]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1967-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 159–160 (Jan. 19, at midnight, Peking colleges'' and visiting rebels, stirred by the Central Cultural Revolution Group, break into Chen Yun''s home on Beichang Street to search it and carry off the safe of his office and his pingtan tapes and records; Zhang Yaoci 张耀祠, head of the Center''s guard regiment, fails to stop them; Tong Xiaopeng 童小鹏, deputy head of the General Office, comes on Zhou''s order: Chen Yun is of the Standing Committee and his files the Party''s and the state''s, pingtan is no "old thing" to smash; he telephones Qi Benyu, and the rebels leave; Zhou has Chen Yun moved that night from the Xinliusuo to the International Liaison Department''s guesthouse No. 18 十八所; woken, he says calmly, let them search, there is little left; told of it later by his second daughter: if the Red Guards seize me, I shall reason with them)'}
  - variant: {id: cal.1967-01.china-leadership, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'the rebels break into Chen Yun''s home at midnight on Jan. 19, and Chen Yun is moved that night to the International Liaison Department''s guesthouse No. 18; Zhang Yaoci and Tong Xiaopeng sent', at: 'III, 159–160'}
  - add:
      entry:
        id: cal.1967-01-20.china-leadership-9
        when: Jan. 20
        date: '1967-01-20'
        place: peking
        thread: china-leadership
        c: Peking 北京. Zhang Yaoci 张耀祠, sent by Zhou Enlai 周恩来, calls on Chen Yun 陈云; they talk.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 160. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-01-21.china-leadership-9
        when: Jan. 21
        date: '1967-01-21'
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yun 陈云 sends his secretary to move the few unimportant papers left at his home on Beichang Street 北长街 to the Xinliusuo 新六所.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 160. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1967-01-21.china-leadership-10
        when: Jan. 21
        date: '1967-01-21'
        time_range: ['1967-01-21T11:00Z', '1967-01-21T14:00Z']
        time_band: evening
        time_zone: Asia/Shanghai
        place: peking
        thread: china-leadership
        c: Peking 北京. Rebels climb the wall into Chen Yun's 陈云 home again to search it, and find nothing.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 160. The words: 当晚 (160). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1967-01-25.china-leadership-11
        when: Jan. 25
        date: '1967-01-25'
        place: peking
        thread: china-leadership
        c: Peking 北京. Rebels of the Peking colleges and the finance and trade system set up the "Liaison Station for Thoroughly Criticizing Chen Yun" 彻底批判陈云联络站.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 160. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - cite: {id: cal.1967-02-16.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 160 (Feb. 11 and 16, at the Center''s liaison meeting, Tan Zhenlin, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen and other Politburo members and Military Commission leaders criticize the Central Cultural Revolution Group to its face; branded the "February adverse current"; thereafter the Group in effect replaces the Politburo)'}
  - cite: {id: cal.1967-02-11.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 160 (Feb. 11: the Politburo members and Military Commission leaders criticize the Cultural Revolution Group to its face (with Feb. 16, the "February adverse current"))'}
  - cite: {id: cal.1967-01-19.china-leadership-9, item: '[[w.chen-yun-nianpu-xiuding]], III, 160 (before February, at the enlarged Military Commission meeting of Jan. 19, the Military Commission leaders quarrel hotly with Jiang Qing, Chen Boda and Kang Sheng over the army''s stability)'}
  - add:
      entry:
        id: cal.1967-03.china-leadership-43
        when: Mar., before the 10th
        date: 1967-03
        at: before 1967-03-10
        place: peking
        thread: china-leadership
        c: 'Peking 北京. The "Liaison Station for Thoroughly Criticizing Chen Yun" 彻底批判陈云联络站 applies four times in writing to the Premier''s office 国务院总理办公室 for the Workers'' Stadium 北京工人体育馆; without an answer it fixes its rally for Mar. 10. The State Council''s duty office 国务院值班室 telephones: by the Center''s notice no rally may be held in the Workers'' Stadium, and the meeting of the 10th may not be held.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 161. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1967-03-10.china-leadership-7
        when: Mar. 10
        date: '1967-03-10'
        place: peking
        thread: china-leadership
        c: 'Peking 北京, Peking Normal University 北京师范大学. The "Liaison Station for Thoroughly Criticizing Chen Yun" 彻底批判陈云联络站 holds a rally to criticize Chen Yun''s 陈云 so-called counter-revolutionary revisionist crimes; its "presiding chairman": the great criticism of Chen Yun is part of the great struggle to smash the Liu–Deng black headquarters.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 160–161. See [[cal.1967-03.china-leadership-43]]. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1967-03-13.china-leadership-5
        when: Mar. 13
        date: '1967-03-13'
        place: peking
        thread: china-leadership
        c: Peking 北京. The "Liaison Station for Criticizing Chen Yun" 批判陈云联络站 of the Central Institute of Finance and Economics 中央财经学院 questions Zhang Wentian 张闻天 on Chen Yun's 陈云 history.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 161. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1967-03-20.china-leadership-6
        when: Mar. 20
        date: '1967-03-20'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhang Wentian 张闻天 hands the rebels his "Views and recollections of Chen Yun" 《对陈云的看法和回忆》: Chen Yun works soundly, with resource, careful and steady, good at uniting and using cadres, "my impression of Chen Yun is good"; their economic thought is at bottom the same: the people''s material needs, growth, material incentives, central management from above, technical measures, balance, steady advance.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 161. See [[cal.1967-03-13.china-leadership-5]]. Made public: 2015. Names: Chen Yun.'
