        when: Mar. 31
        date: '1964-03-31'
        place: canton
        thread: china-leadership
        c: 'Canton 广州. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡: the recording of the pingtan 评弹 *Seizing the Seal* 《夺印》 delights him; old pieces bear endless hearing for their craft; he has heard nearly all the "second-class stories" 二类书 of recent years and wished to hear none again, but most of *Seizing the Seal* he would, a work that sums up the old, the second-class and the new long stories and carries on pingtan''s good tradition of centuries.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 144–145. Made public: 2015. Names: Chen Yun.'
