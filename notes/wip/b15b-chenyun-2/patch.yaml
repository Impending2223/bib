  - add:
      entry:
        id: cal.1962-03.china-leadership-11
        when: Mar.–Apr., at Hangzhou, after the 10th
        date: 1962-03
        at: after 1962-03-10
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 reads the papers on Anhui''s 安徽 responsibility fields 责任田, which fit what he saw in the villages and his own way to restore farming, and tells his staff: an extraordinary measure for an extraordinary time; call it dividing the fields to households 分田到户 or fixing output by household 包产到户, the state, hit by such disasters natural and man-made, must rouse all the peasants, as the *Internationale* 《国际歌》 says, "by ourselves alone," to restore output fast.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-03.china-leadership-12
        when: Mar.–Apr., at Hangzhou, after the 10th
        date: 1962-03
        at: after 1962-03-10
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Chen Yun 陈云 twice asks Yao Yilin 姚依林 to Hangzhou and talks with him on fixing the state's grain purchase for good, the surplus to the peasants; on dividing the fields to households 分田到户 as things stand; and on putting it to Mao Zedong 毛泽东.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-03-10.china-leadership-8
        when: Mar. 10
        date: '1962-03-10'
        thread: china-leadership
        c: Liu Shaoqi 刘少奇 orders the speeches of Chen Yun 陈云, Li Xiannian 李先念 and Li Fuchun 李富春 to the enlarged State Council 国务院 printed for the Politburo Standing Committee, the Secretariat and the Central Finance and Economics Small Group, and proposes that, discussed and revised at a central meeting, they go to the provincial committees and the central departments' Party groups.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. See [[cal.1962-02-26.china-leadership-3]]. Made public: 2015. Names: Liu Shaoqi, Chen Yun, Li Xiannian, Li Fuchun.'
        tags: ['polity:prc', 'name:liu-shaoqi', 'name:chen-yun', 'name:li-xiannian', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1962-03-13.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Mar. 12–13: the meeting adopts the Center''s comment forwarding the three speeches; Liu proposes that Chen Yun still head the Central Finance and Economics Small Group, Li Fuchun his deputy; Li Fuchun: Chen Yun is the fittest, I shall be his assistant; so decided. Chen Yun, away, hearing of it, says the head had better not change; Liu: all agree, so you head it; I support you to the end)'}
  - variant: {id: cal.1962-02-21.china-leadership-4, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'Liu Shaoqi proposes Chen Yun as head of the Central Finance and Economics Small Group, Li Fuchun his deputy, at the enlarged Standing Committee of Mar. 12–13, not at the Xilou meeting; Chen Yun, away, would have the head unchanged; Liu: all agree, he supports him to the end', at: 'III, 131'}
  - cite: {id: cal.1962-03-16.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Liu Shaoqi, Zhou and Deng fly to Wuhan 武汉 to report to Mao on the enlarged Standing Committee)'}
  - cite: {id: cal.1962-03-17.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Mao, having read with care the edited texts of the speeches of Chen Yun, Li Xiannian and Li Fuchun, calls Liu, Zhou, Deng and others the next day: the speeches to go out in the Center''s name to provincial and army level; Chen Yun to head the Central Finance and Economics Small Group)'}
  - cite: {id: cal.1962-03-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (the Center''s directive forwarding the speeches of Chen Yun and others 《关于批发陈云等同志讲话的指示》: the next ten years in two stages, adjustment (chiefly recovery, some growth), then growth; that the first is chiefly recovery not to be said outside, in or out of the Party, but called the adjustment stage. The provinces ask to relay the speeches more widely; Chen Yun''s above all help all see the whole and face the difficulties)'}
  - add:
      entry:
        id: cal.1962-04-26.china-leadership-11
        when: Apr. 26
        date: '1962-04-26'
        thread: china-leadership
        c: The Center 中共中央, by a supplementary notice, widens the relaying of the three speeches of Chen Yun 陈云, Li Xiannian 李先念 and Li Fuchun 李富春 to the prefectures and cities.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 131. See [[cal.1962-03-18.china-leadership]]. Made public: 2015. Names: Chen Yun, Li Xiannian, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1962-04-19.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (the General Office''s notice of the Center''s decision: Chen Yun head, Li Fuchun and Li Xiannian deputies; Zhou Enlai, Tan Zhenlin, Bo Yibo, Luo Ruiqing, Cheng Zihua, Gu Mu, Yao Yilin, Xue Muqiao and others members)'}
  - cite: {id: cal.1962-03-22.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 131–132 (Mao to the members of Tian Jiaying''s 田家英 team for the Shaoshan 韶山 villages of Hunan: he knows farming still, not industry; there he is not as good as Comrade Chen Yun)'}
  - cite: {id: cal.1962-04-02.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 132 (Apr. 2–4, the enlarged meeting of the Central Finance and Economics Small Group on the Planning Commission''s report on adjusting the 1962 plan; Zhou: grave imbalance everywhere; strive for fast and prepare for slow, strive for good and prepare for poor; the plan to be cut deeply)'}
  - add:
