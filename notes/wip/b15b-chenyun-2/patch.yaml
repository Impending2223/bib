  - cite: {id: cal.1962-09-24.china, item: '[[w.chen-yun-nianpu-xiuding]], III, 138 (Sept. 24–27; its preparatory meeting Aug. 25–Sept. 23 on the draft decision on the collective economy and the revised Sixty Articles, attacking Deng Zihui''s "go-it-alone wind" and the "reversal wind" of Peng Dehuai and Xi Zhongxun; the plenum adopts the rural papers, puts Peng and Xi under special review, removes Huang Kecheng and Tan Zheng from the Secretariat; Mao: class struggle every year, every month; Liu Shaoqi''s three attitudes to the difficulties; Mao backs Liu''s proposal to relay the plenum only to cadres of grade 17 and above, and work comes first; Chen Yun absent, ill)'}
  - cite: {id: cal.1962-10.china, item: '[[w.chen-yun-nianpu-xiuding]], III, 138 (Oct. 1–Dec. 6: the army and people of the Guangdong 广东 coast wipe out nine bands of Nationalist armed agents landed by sea or dropped by air)'}
