        c: 'Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡, on the teaching plan of the Suzhou Pingtan School 苏州评弹学校 being set up: its course of study to be outlined first and settled by experience.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 107. Made public: 2015. Names: Chen Yun.'
