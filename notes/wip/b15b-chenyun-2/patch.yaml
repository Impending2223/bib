        thread: china-leadership
        c: Chen Yun 陈云, with Li Fuchun 李富春, Li Xiannian 李先念, Bo Yibo 薄一波, Tan Zhenlin 谭震林 and others, goes to Zhou Enlai 周恩来 to talk.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 116. The words: 上午 (116). Made public: 2015. Names: Chen Yun, Li Fuchun, Li Xiannian, Bo Yibo, Tan Zhenlin, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-fuchun', 'name:li-xiannian', 'name:bo-yibo', 'name:tan-zhenlin', 'name:zhou-enlai', 'vis:only:prc']
  - cite: {id: cal.1961-12-06.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 116–117 (Dec. 6–11: Chen Yun with Zhou, Deng Xiaoping, Li Fuchun and others hears the Planning Commission on the 1962 plan, and speaks: next year the peasants better off, the towns worse, the state''s goods tighter; the real adjustment next year; 8 million fewer townspeople, a hard task; no raises but for apprentices and graduates; three years of poor nourishment for the 60 million of the big and middle cities: beans the answer, 3 jin a month each for eight months, 1.2 billion jin, half a jin of bean curd a day, to persons, not units; the plan''s stress adjustment, not the Seven-Year Plan (1963–69); steel, timber and coal targets held; 50,000 tons more synthetic ammonia, 200,000 tons more fertilizer, 4 million dan more cotton)'}
  - cite: {id: cal.1961-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 116–117 (the Planning Commission''s report on the 1962 plan heard Dec. 6–11 by Zhou, Chen Yun, Deng Xiaoping, Li Fuchun and others; the beans, 3 jin a month for eight months, Chen Yun''s proposal in his speech)'}
  - to-check: {id: cal.1961-12-06.china-leadership-2, add: '[[w.chen-yun-wenji]], III, where the Chen Yun nianpu says Chen Yun''s speech is printed, as 《对一九六二年国民经济计划安排的意见》 ([[w.chen-yun-nianpu-xiuding]], III, 117).'}
  - cite: {id: cal.1961-12-20.china-leadership-11, item: '[[w.chen-yun-nianpu-xiuding]], III, 117 (Chen Yun at Mao''s meeting; Mao: the detours are first the Center''s to answer for; the high targets, estimates, procurement and distribution and the great drives in water works, transport and pig farms were all the Center''s decisions and all wrong, and also a precious asset; knowledge takes time, ours was slow)'}
  - cite: {id: cal.1961-12-20.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 117–118 (Chen Yun attends the work conference, Dec. 20–Jan. 10, on the world and home situation, the plan, commerce and Party building, preparing the enlarged work conference; at its opening Deng Xiaoping relays Mao''s view: the situation on the whole good, the good done in the Great Leap''s three years basic, the faults there, the blame first the Center''s, then the provinces''; at its end the groups discuss the first draft of Liu Shaoqi''s written report)'}
