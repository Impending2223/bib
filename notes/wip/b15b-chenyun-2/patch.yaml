  - add:
      entry:
        id: cal.1961-09-27.china-leadership-8
        when: Sept. 27
        date: '1961-09-27'
        thread: china-leadership
        c: 'Chen Yun 陈云 presides over the Central Small Group on Industry Supporting Agriculture 中共中央工业支援农业小组 (set up in June under the Secretariat 书记处, Liao Luyan 廖鲁言, Minister of Agriculture, its head) and speaks: next year''s farm-machinery industry to put its material and capacity chiefly into spare parts for repairs, new machines only with what is left; support to differ by district and look decades, even a century, ahead; to feed so many, reclaim land and raise yields, improve fields and seed, and look to the hills and the sea; afforestation a hundred-year task; good seed and chemical fertilizer, as in America, studied and planned by the central organs now that blind command is barred. The group hears Li Yu 黎玉, vice-minister of farm machinery, and asks the Forestry, Aquatic Products and Agriculture ministries to study the hills, the sea, the fields and the seed.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 107. Made public: 2015. To check: 《陈云文集》, where the nianpu says it is collected, as 《工业支援农业应该区分不同地区》. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-09-29.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun receives Mao''s letter to the Standing Committee and others: the production team, not the brigade, to be the basic accounting unit, "three-level ownership, the team the foundation"; six muddled years since the higher co-operatives; the "three contracts and one bonus" 三包一奖 set brigade and team quarrelling)'}
  - cite: {id: cal.1961-09-30.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (evening: Chen Yun at Zhou''s National Day reception in the Great Hall of the People 人民大会堂)'}
  - cite: {id: cal.1961-10-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun at the capital''s celebration of the twelfth anniversary at Tiananmen 天安门)'}
  - cite: {id: cal.1961-10-07.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun, with Mao Zedong, Liu Shaoqi, Zhu De, Lin Biao, Deng Xiaoping and others, receives the minority nationalities'' National Day delegations of Inner Mongolia, Xinjiang, Tibet and other provinces, cities and regions and the delegations of the PLA and the People''s Armed Police)'}
  - add:
      entry:
        id: cal.1961-10-08.china-leadership-6
        when: Oct. 8, 10 and 11
        date: '1961-10-08'
        time_range: ['1961-10-07T22:00Z', '1961-10-08T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Chen Yun 陈云, three mornings, hears the Party group of the First Ministry of Machine Building 第一机械工业部 on the machine industry, and arranges a machine-industry forum for January: economic work rests on reckoning; in the First Five-Year Plan the Soviet Union 苏联 supplied the machines and China played walk-on parts, now it must play the lead, from copying to creating, independent, complete sets, advanced; fix each works'' line; count materials, the key ones above all, for the short-line equipment; plans to shrink to the materials; first the matters outside the works, then those inside; on quality, responsibility for upkeep (his clock, older than he, still runs; in an office it would have been written off); a planned economy needs unity, both people''s livelihood and construction, and the provinces'' zeal too.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 108–110. The words: 上午 (108–110). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
