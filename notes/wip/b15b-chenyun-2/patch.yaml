  - add:
      entry:
        id: cal.1962.china-leadership-67
        when: '1962'
        date: '1962'
        thread: china-leadership
        c: 'As the *Chen Yun nianpu* reports it, for 1962, after the eight-character policy centered on adjustment: town workers and staff 8.6 million fewer, rural labor 15 million more; draft animals rising after years of decline; more chemical fertilizer, tractors and irrigation machines; grain 25 billion jin more, 320 billion; pigs near 100 million, after four years'' fall; steel 6.67 million tons, over 2 million less; capital construction 7.1 billion yuan, 44.1 percent less; light industry 47 percent of industrial output, from 42; revenue over outlay by 830 million yuan; currency in circulation 1.92 billion less at the year''s end, fair prices 35 percent lower; consumption per head up 11 jin of grain, 1 jin 6 liang of pork, 2 chi 5 cun of cotton cloth.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 139.'
        tags: ['polity:prc', 'form:state']
