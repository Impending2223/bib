        c: 'Peking 北京. Chen Yun 陈云 answers the Guangdong No. 1 Workers'' Sanatorium 广东省第一工人疗养院 again on Wu Huayou 吴华友: to refuse to vouch for what he knows, or to vouch untruly for what he does not know or recall, would not be a Communist''s duty, and he will never do so; on Wu he can say only what he has said.'
