  - cite: {id: cal.1965-09-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 150 (Sept. 18–Oct. 12, on the 1966 plan and the long-term plans; Mao, during it, raises again revisionism at the Center: if the Center goes revisionist the provinces may rebel, and wrong orders from the Center, the bureaus or the provincial committees need not be carried out; Chen Yun absent, ill)'}
  - cite: {id: cal.1965-09-30.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 150 (Mao on the draft list of the preparatory committee for the centenary of Sun Yat-sen''s birth: "Chen Yun is not on it; he should be added"; Chen Yun is put on it)'}
  - cite: {id: cal.1965-11-10.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 150–151 (Mao approved the article''s publication and had it reprinted nationwide; under Jiang Qing and Zhang Chunqiao the attack soon grew into a campaign in literature and art, the prelude and fuse of the Cultural Revolution)'}
  - cite: {id: cal.1965-11-18.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 151 (Nov. 17 or 18: Chen Yun talks with Yang Shangkun; Yang then tells Zhou Enlai of the talk in person and writes to Mao, the letter given to Tian Jiaying to deliver)'}
