        c: Hangzhou 杭州. Xue Muqiao 薛暮桥 brings Chen Yun 陈云 the Central Finance and Economics Small Group's 中央财经小组 draft report on discussing the 1962 adjustment plan 《关于讨论一九六二年调整计划的报告（草稿）》, which analyzes the grave difficulties and the measures; Chen Yun agrees to it.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. See [[cal.1962-04-02.china-leadership-2]]. Made public: 2015. Names: Chen Yun.'
