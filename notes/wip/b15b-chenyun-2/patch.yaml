  - cite: {id: cal.1965-02-21.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 149 (Mao interjects, on the steel target of 1959: in January 1959 he talked with a few, and Chen Yun was right to want a lower published figure, 17 million tons; Mao agreed, but Chen took it that he did not, and later, asked to speak, criticized himself; back in Peking, on June 13, it came down to 13 million tons; lessons never to be forgotten; Zhou to tell Chen Yun at Shanghai that Mao agrees with him (Zhou goes to Shanghai Mar. 7–10 on foreign business))'}
