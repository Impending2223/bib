  - cite: {id: cal.1962-03-07.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 128–130 (Mar. 7: no ten-year plan now, a five-year plan first, recovery the present task; no haste over targets for the Third Five-Year Plan; this year''s plan adjusted much and then left alone, not "a year''s plan, planned all year"; industry and construction slowed for farming and the market: steel for motor junks, half a jin of fish a month in the big and middle cities, half a jin of pork, a political question; agriculture and the market a matter of the people''s livelihood, to be a state policy; "cut to the sinew and bone" in heavy industry and construction; overall balance from the start, by the short line; materials more centralized in recovery; the Planning and Economic Commissions and the Agriculture Office 农办 to study farming and turn to it; in the early years he cut construction to what the state could bear and allowed no new hands without materials; different views to be encouraged. Zhou interjects the couplet)'}
  - cite: {id: cal.1962-03-07.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 129 (Zhou interjects during Chen Yun''s speech of Mar. 7: a couplet, first food, clothing and use, then agriculture, light and heavy industry, across it overall balance)'}
  - cite: {id: cal.1962-03-08.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 128 (Chen Yun at the group''s meetings of Mar. 7 and 8, which study the adjustment further)'}
