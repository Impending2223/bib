  - add:
      entry:
        id: cal.1967-12.china-leadership-11
        when: Dec., the year's end
        date: 1967-12
        at: after 1967-12-21
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 to his son Chen Yuan 陈元: the Center, it seems, will not let him work again, and he will give his time to reading, on a five-year plan: Lenin''s 列宁 *Collected Works* 《列宁全集》 from the volume of the February Revolution on, then the earlier ones. From then, but for his "squatting" in a works, he reads Marx, Engels, Lenin, Stalin and Mao Zedong 毛泽东 piece by piece by his plan.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 162. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
