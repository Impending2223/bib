        thread: china-leadership
        c: 'As the *Chen Yun nianpu* reports it, for 1964, the economy better on all fronts: grain 375 billion jin, 35 billion more, near 1957''s; cotton 33.25 million dan, nearly 10 million more; steel 9.64 million tons, 26 percent more; chemical fertilizer 5 million tons, 36 percent more; revenue and outlay in balance, a small surplus.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 148.'
        tags: ['polity:prc', 'form:state']
