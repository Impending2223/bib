  - cite: {id: cal.1961-08-23.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 104 (Chen Yun attends, Aug. 23–Sept. 1, only the first half for illness; the conference ends Sept. 16; its directive on industry 《关于当前工业问题的指示》: the eight-character policy a year old without targets lowered to the facts, a year lost; three years with adjustment at the center, targets cut to safe levels, retreat where we must, and enough; Mao: we have retreated to the valley floor and now rise day by day; the Seventy Articles on industry and the Sixty on the higher schools adopted)'}
  - cite: {id: cal.1961-08.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 104 (during the Central Work Conference, which Chen Yun attends Aug. 23–Sept. 1, he asks Mao whether American grain may be bought through France; Mao agrees)'}
  - cite: {id: cal.1961-08-25.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 104 (Mao to Hu Qiaomu 胡乔木: rest, no haste to work; "your illness is like Comrades Chen Yun''s, Lin Biao''s and Kang Sheng''s"; Lin and Kang recovered with long rest, Chen is better)'}
  - cite: {id: cal.1961-09-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 104–106 (Chen Yun speaks at the report meeting of the regional bureaus'' first secretaries: construction and targets to retreat enough, to a safe footing, the test being an economy that moves; coal and steel to lead only within an overall balance, not alone, or the old errors of saving steel and coal return; add to the directive''s third article that the key points are kept to enliven the economy; inquiry by work groups and by small forums of five or six units, old workers, technicians, cadres, left, center and right, no hats, pigtails or clubs; six matters first: coal, metallurgy, machinery, the third-class goods, allocation, the Center and the provinces (too centralized before, too scattered now); overall balance its own article, five of the eight touching it; the Planning Commission to turn from construction to balance in production; iron capacity counted by what can be allocated. Mao interjects at the second point: "I agree with Comrade Chen Yun''s method, chiefly small meetings"; at the third: "well said; let Chen Yun write an article on overall balance for the industrial directive")'}
  - add:
