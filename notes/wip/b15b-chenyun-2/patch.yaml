        when: '1963'
        date: '1963'
        thread: china-leadership
        c: 'As the *Chen Yun nianpu* reports it, for 1963, the adjustment carried on: farming and industry further restored, the economy turning for the better on all fronts; grain 340 billion jin, 20 billion more; cotton 24 million dan, 60 percent more; steel back to 7.62 million tons after two years'' fall; the other crops, industry, capital construction and retail sales up; revenue over outlay by 270 million yuan; exports over imports by 380 million dollars.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 143.'
        tags: ['polity:prc', 'form:state']
