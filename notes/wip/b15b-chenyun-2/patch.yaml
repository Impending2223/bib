  - add:
      entry:
        id: cal.1961-09-27.china-leadership-8
        when: Sept. 27
        date: '1961-09-27'
        thread: china-leadership
        c: 'Chen Yun 陈云 presides over the Central Small Group on Industry Supporting Agriculture 中共中央工业支援农业小组 (set up in June under the Secretariat 书记处, Liao Luyan 廖鲁言, Minister of Agriculture, its head) and speaks: next year''s farm-machinery industry to put its material and capacity chiefly into spare parts for repairs, new machines only with what is left; support to differ by district and look decades, even a century, ahead; to feed so many, reclaim land and raise yields, improve fields and seed, and look to the hills and the sea; afforestation a hundred-year task; good seed and chemical fertilizer, as in America, studied and planned by the central organs now that blind command is barred. The group hears Li Yu 黎玉, vice-minister of farm machinery, and asks the Forestry, Aquatic Products and Agriculture ministries to study the hills, the sea, the fields and the seed.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 107. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III (as 《工业支援农业应该区分不同地区》). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-09-29.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun receives Mao''s letter to the Standing Committee and others: the production team, not the brigade, to be the basic accounting unit, "three-level ownership, the team the foundation"; six muddled years since the higher co-operatives; the "three contracts and one bonus" 三包一奖 set brigade and team quarrelling)'}
  - cite: {id: cal.1961-09-30.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (evening: Chen Yun at Zhou''s National Day reception in the Great Hall of the People 人民大会堂)'}
  - cite: {id: cal.1961-10-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun at the capital''s celebration of the twelfth anniversary at Tiananmen 天安门)'}
  - cite: {id: cal.1961-10-07.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 108 (Chen Yun, with Mao Zedong, Liu Shaoqi, Zhu De, Lin Biao, Deng Xiaoping and others, receives the minority nationalities'' National Day delegations of Inner Mongolia, Xinjiang, Tibet and other provinces, cities and regions and the delegations of the PLA and the People''s Armed Police)'}
  - add:
      entry:
        id: cal.1961-10-08.china-leadership-6
        when: Oct. 8, 10 and 11
        date: '1961-10-08'
        time_range: ['1961-10-07T22:00Z', '1961-10-08T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Chen Yun 陈云, three mornings, hears the Party group of the First Ministry of Machine Building 第一机械工业部 on the machine industry, and arranges a machine-industry forum for January: economic work rests on reckoning; in the First Five-Year Plan the Soviet Union 苏联 supplied the machines and China played walk-on parts, now it must play the lead, from copying to creating, independent, complete sets, advanced; fix each works'' line; count materials, the key ones above all, for the short-line equipment; plans to shrink to the materials; first the matters outside the works, then those inside; on quality, responsibility for upkeep (his clock, older than he, still runs; in an office it would have been written off); a planned economy needs unity, both people''s livelihood and construction, and the provinces'' zeal too.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 108–110. The words: 上午 (108–110). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-10-14.china-leadership-11
        when: Oct. 14
        date: '1961-10-14'
        thread: china-leadership
        c: Duan Junyi 段君毅, vice-minister of the First Ministry of Machine Building 第一机械工业部, submits to Chen Yun 陈云 and Li Fuchun 李富春 the plan for the machine-industry forum.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 110. See [[cal.1961-10-08.china-leadership-6]]. Made public: 2015. Names: Duan Junyi, Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:duan-junyi', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1961-10-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 110 (evening: Chen Yun, with Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping and Peng Zhen, with Mao meets and gives a banquet for Hồ Chí Minh and Lê Duẩn 黎笋, passing through for the Soviet Twenty-second Congress)'}
  - cite: {id: cal.1961-10.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 110–112 (Oct. 14–Nov. 3, at the Fragrant Hills 香山, Peking: Chen Yun presides over the coal industry forum 煤炭工业座谈会, the heads of the ministries and commissions attending; it hears and discusses the Ministry of Coal and the six big mining bureaus (Jixi 鸡西, Fushun 抚顺, Kailuan 开滦, Yangquan 阳泉, Zibo 淄博, Pingdingshan 平顶山). He opens: a forum of inquiry, deciding nothing, the mines'' own matters and coal''s ties with other trades and the provinces. In the sessions: three years of quarrels to be summed up fairly; coal traded by the Ministry of Commerce with the peasants for goods; with 50 billion jin of grain, 20 million dan of cotton and 4 billion jin of meat in hand the state could turn the corner; the Center and the provinces each a sphere, "well water not to trespass on river water." Closing: why output rose three years and fell this year; targets by conditions, not wishes, in proportion over five, ten, twenty years, reckoned and cut till they stop falling; construction with its investment, material and equipment, the north first for coal; piece wages for miners, extra grain ("one jin more for each ton more"), safety, housing, miners'' sons hired; old technicians given posts and power; strong managers, the Party committee to drop its faults and restore the rules wrongly scrapped)'}
  - to-check: {id: cal.1961-10.china-leadership-2, add: '[[w.chen-yun-wenji]], III, where the Chen Yun nianpu says his interjections are printed, as 《在煤炭座谈会上的插话》 ([[w.chen-yun-nianpu-xiuding]], III, 112).'}
  - cite: {id: cal.1961-10-15.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 112 (the Congress''s opening printed under Oct. 15; Zhou leads the Chinese Communist Party''s delegation, in his speech criticizes the CPSU''s laying bare the differences among brother parties and countries, calls at the Lenin and Stalin mausoleum and leaves for home early; afterward Khrushchev puts more pressure on China)'}
  - cite: {id: cal.1961-11-03.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 112–113 (Chen Yun at Liu Shaoqi''s forum on the market, and speaks: unlike 1956, when goods were plenty and private traders no danger, the town people now buy in the villages; forbid the traders and they deal in secret, allow them and they deal big, and the state may fail to buy farm produce; more goods, loosen; fewer, control; no price rises in the towns, Taiyuan''s 太原 way (coupons by wage) better; at 20 billion jin more grain a year, the towns'' ration would still be under 1957''s in 1965, so mend and patch, real adjustment taking years. Liu interjects: the question is how to live a bit better these years; think of something. Chen Yun: I am thinking; grain is the key)'}
  - add:
      entry:
        id: cal.1961-11-07.china-leadership-5
        when: Nov. 7
        date: '1961-11-07'
        time_range: ['1961-11-07T11:00Z', '1961-11-07T14:00Z']
        time_band: evening
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'Chen Yun 陈云 talks with Qin Zhongda 秦仲达, deputy head of the equipment department of the Ministry of Chemical Industry 化工部, on its request to adjust and add to the imported materials for nitrogen fertilizer: materials left out of the orders for the five nitrogen plants and special steel for overhauling the big plants may be ordered, but not materials for oil cracking and synthetic alcohol, the fertilizer imports having been reported to the Center for that use alone; the 16 million dollars reckoned was too little and is to be explained and made up; materials are easy to import, making and installing equipment hard.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 113. The words: 晚 (113). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-11-26.china-leadership
        when: Nov. 26
        date: '1961-11-26'
        thread: china-leadership
        c: Chen Yun 陈云 approves the Ministry of Chemical Industry's 化工部 report on ordering the materials left out with the fertilizer plants' special foreign exchange.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 113. See [[cal.1961-11-07.china-leadership-5]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1961-11-06.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 113–114 (Nov. 10: Chen Yun at Liu Shaoqi''s meeting of the regional bureaus'' first secretaries, on grain and the market: grain, that is farming, is the key to turning the economy round, the aims to get through and not to rely on foreigners; what the provinces send up depends on what is bought from the peasants; this year''s 72 billion jin too little, next year 20 billion more grown, 10 billion of it bought, 82 billion; the peasants'' life to improve a little, not too much; the first move more purchase, the second fewer townspeople, 10 million sent down by the end of October; the rural markets in chaos, 3.5 billion yuan taken by the peasants for produce worth 0.5 to 1 billion; he has always been for free markets, but how far to open them now needs thought; high-priced sweets and bicycles to draw the money back)'}
  - to-check: {id: cal.1961-11-06.china-leadership, add: '[[w.chen-yun-wenji]], III, where the Chen Yun nianpu says Chen Yun''s speech of Nov. 10 is printed, as 《粮食问题与市场问题》 ([[w.chen-yun-nianpu-xiuding]], III, 114).'}
  - add:
      entry:
        id: cal.1961-11.china-leadership-10
        when: Nov., before the forum of the 24th
        date: 1961-11
        at: before 1961-11-24
        thread: china-leadership
        c: 'Chen Yun 陈云 to the heads of the Ministry of Metallurgy 冶金部 who call on him: all want to push iron and steel up, and mean well; but how much can be done must be weighed against what is possible, or good intentions do foolish and bad things.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 116. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-11-24.china-leadership-5
        when: Nov. 24–Dec. 17
        date: '1961-11-24'
        thread: china-leadership
        c: 'Chen Yun 陈云 presides over the metallurgical industry forum 冶金工业座谈会, to Dec. 17, in twelve sittings, steel and iron first, then the nonferrous metals; Bo Yibo 薄一波, Yuan Baohua 袁宝华, vice-chairman of the State Economic Commission 国家经委, and the Ministry of Metallurgy''s 冶金部 Wang Heshou 王鹤寿, Lü Dong 吕东 and Gao Yangwen 高扬文 attend. He opens: a forum to learn and study, deciding nothing, no hats; the level reached in steel, iron and special steel, the problems, the prospects. In the reports he says: iron ore falls, the peasants no longer dig it and the key mines'' machines are worn, their men fewer and underfed; next year''s 130 million yuan for the iron mines against 200 million needed to keep up 60 million tons; upkeep counted as investment and costs as profit, both false, perhaps a Soviet 苏联 reckoning; concrete for 70,000 cubic meters of pit timber; forests a fifty- or hundred-year cycle; people''s strength falls year by year: grain, vegetables, beans and eggs first, then meat and milk; complete plants imported only when farming recovers (360 billion jin of grain in 1957, 280 last year, 300 this year, three years more to recover), and the 800 or 900 million dollars owed the Soviet Union paid; in steel, variety the key: the poorer, the less economical.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 114–116. Made public: 2015. Names: Chen Yun, Bo Yibo.'
        tags: ['polity:prc', 'name:chen-yun', 'name:bo-yibo', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-11-27.china-leadership-6
        when: Nov. 27
        date: '1961-11-27'
        thread: china-leadership
        c: 'Li Xiannian 李先念, on the 1962 budget, to Wu Bo 吴波, Wang Xueming 王学明 and Ding Dongfang 丁冬放, vice-ministers of finance: Chen Yun 陈云 telephoned to ask whether it is in deficit or balance, and if balanced, whether the losses of enterprises and the wages of idle workers are in it; if not, it is a deficit; think again.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 116. Made public: 2015. Names: Li Xiannian, Chen Yun.'
        tags: ['polity:prc', 'name:li-xiannian', 'name:chen-yun', 'vis:only:prc']
