  - cite: {id: cal.1967-03-21.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 161 (to the rebels'' demands to criticize Chen Yun and put the posters against Li Xiannian in the streets: I cannot answer; the Standing Committee''s own matters are the Center''s to decide, and it has not decided to bring out material criticizing Chen Yun; posters not on the streets; Li Xiannian is vice-premier, and the Center trusts him; what Mao has not decided, Zhou must protect; searching homes, beating, smashing, looting, seizing not allowed)'}
  - add:
      entry:
        id: cal.1967-03.china-leadership-44
        when: Mar.
        date: 1967-03
        thread: china-leadership
        c: The Center's General Office 中共中央办公厅 stops sending Zhu De 朱德, Chen Yun 陈云 and Li Fuchun 李富春 documents, Xinhua's *Cankao ziliao* 《参考资料》 and *Cankao xiaoxi* 《参考消息》, and all papers but the *Renmin ribao* 《人民日报》. Chen Yun then subscribes to *Cankao xiaoxi* at his own cost.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 162. Made public: 2015. Names: Zhu De, Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:zhu-de', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
