        n: '[[w.chen-yun-nianpu-xiuding]], III, 128. Made public: 2015. Names: Liu Shaoqi, Zhou Enlai, Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
