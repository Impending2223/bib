  - add:
      entry:
        id: cal.1961-09-07.china-leadership-9
        when: Sept. 7
        date: '1961-09-07'
        place: nanjing
        thread: china-leadership
        c: 'Nanjing 南京. Chen Yun 陈云, passing through, talks with the heads of the Jiangsu provincial public security department 江苏省公安厅 who see him off, on markets and speculation: "lively but not disorderly, managed but not stifled" cannot yet be had; managed by political means the market dies, only economic means work, if the state could sell eggs at 1 jiao against the speculator''s 5; goods are short: buying power is some 70 billion yuan, and pork and cotton cloth alone leave a gap of 12 to 13 billion that daily wares cannot fill; agriculture and grain are the key, 7 million tons of grain to be imported this year and more the next two, and the towns'' population must be cut hard.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 106–107. See [[cal.1961-09-07.china-leadership-8]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
