  - cite: {id: cal.1966-05-04.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 152–153 (May 4–26, Liu Shaoqi presiding: Kang Sheng relays Mao''s views on criticizing Peng Zhen and Lu Dingyi and dissolving the Propaganda Department and the Peking committee; Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun wrongly denounced; the Standing Committee sets up a special committee on their "anti-Party clique"; Zhu De criticized for doubting that Mao''s thought is the summit of Marxism-Leninism; on the last day Liu Shaoqi criticizes himself; the meeting marks the Cultural Revolution''s launch; Chen Yun absent, ill)'}
  - cite: {id: cal.1966-05-16.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 152–153 (the notice drafted under Chen Boda and revised several times by Mao: the February Outline withdrawn, the Cultural Revolution Group set up anew under the Standing Committee; the leadership of scholarship, education, art and the press not in proletarian hands; bourgeois representatives in the Center and the provinces who would seize power, some trusted as our successors, "people like Khrushchev ... sleeping beside us")'}
  - cite: {id: cal.1966-05-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (Lin Biao''s long speech: Peng Zhen, Luo Ruiqing, Lu Dingyi and others plotted a coup and subversion; Mao''s genius; "whoever opposes him the whole Party will punish, the whole country attack")'}
  - cite: {id: cal.1966-05-28.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (the Center''s notice setting up the Central Cultural Revolution Group: Chen Boda head, Kang Sheng adviser, Jiang Qing, Zhang Chunqiao and others deputies, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan and others members; it came to replace the Politburo and the Secretariat)'}
  - cite: {id: cal.1966-06-01.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (*Renmin ribao*''s editorial "Sweep away all ghosts and monsters" 《横扫一切牛鬼蛇神》)'}
  - cite: {id: cal.1966-06-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (that evening the Central People''s Broadcasting Station broadcasts, with Mao''s approval, the poster of Nie Yuanzi 聂元梓 and six others falsely charging the Peking University Party committee and the Peking committee)'}
  - cite: {id: cal.1966-06-04.china-leadership-7, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (June 4: *Renmin ribao* announces the Center''s reorganization of the Peking committee and the new committee''s reorganization of the Peking University Party committee; students in many cities rise to "rebel")'}
  - cite: {id: cal.1966-06-03.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 153 (early June, under Liu Shaoqi and Deng Xiaoping, the Standing Committee decides to send work teams to the colleges and middle schools and draws up eight requirements to keep the movement led and orderly)'}
  - cite: {id: cal.1966-07-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 153–154 (mid-July, Mao back in Peking sharply charges the work teams with "a bad role, obstructing the movement")'}
  - cite: {id: cal.1966-07-28.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 154 (July 28: the Center decides to withdraw the work teams)'}
