  - cite: {id: cal.1961-06-19.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 94 (Zhou on Chen Yun: his view is reasonable; he is weak and very tired and needs another setting to rest in, listening to pingtan 评弹, so as to do more for the Party; pingtan teaches too; Zhou prefers the northern quyi, the Suzhou dialect being hard for him, but each takes what he needs; art replaced by politics is no art)'}
  - add:
      entry:
        id: cal.1961-06.china-leadership-15
        when: June, mid-month, at Shanghai, after the 17th
        date: 1961-06
        at: after 1961-06-17
        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. Chen Yun 陈云 calls together Xue Muqiao 薛暮桥, vice-chairman of the State Planning Commission 国家计委, Gu Fusheng 顾复生 and Lu Quan 陆铨 (both of Qingpu 青浦, who took part in the Xiaozheng 小蒸 peasant rising he led in 1928) and others, and sends them with peasants of his home district ahead to Xiaozheng commune 小蒸公社, Qingpu county 青浦县, to prepare his inquiry. He has come south to learn how farming in the Lake Tai 太湖 basin truly stands; double-cropped rice is spreading, but in Jiaxing 嘉兴 prefecture, double-cropped on 60 percent of the land last year, output fell; it must be looked into with care, with grain, clothing and cash all in view; hear the cadres, read the records, meet the people, hold small forums question by question, then compare notes with the other districts of the basin; refuse cigarettes, tea, meals and gifts, the people being in hard times.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 94–95. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-06-27.china-leadership-7
        when: June 27–July 11
        date: '1961-06-27'
        place: qingpu
        thread: china-leadership
        c: 'Qingpu 青浦. Chen Yun 陈云 makes his inquiry at Xiaozheng commune 小蒸公社, to July 11, eating and lodging in peasants'' homes: he hears the commune''s Party committee twice and holds ten forums of cadres and members (sows kept by the collective or privately, the crops, private plots, the return of goods taken by the communes 平调退赔, rural trade, commune industry and handicrafts, grain quotas and purchases, the peasants'' zeal, cadres'' ways, petty theft), visits homes, the pig farm, the mess hall, the works, the supply and marketing co-operative and the granaries. In the forums he says: private plots, the collective holding over 90 percent of the land, shake nothing and are a needed supplement, the peasants asking not "socialism or capitalism" but "rice or gruel"; before the grain quota, the peasants first, then the workers, and the towns'' people cut; the cadres to return what was taken, by village committees of the victims, cadres and fair men, in kind where they can; small traders allowed, and the purchase shares (three to seven) honored; for petty theft the cadres to own their part, the people to make pacts, the habitual and big thieves to go to the county.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 95–96. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc@C-G']
