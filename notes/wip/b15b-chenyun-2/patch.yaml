  - add:
      entry:
        id: cal.1963-07-08.china-leadership-6
        when: July 8
        date: '1963-07-08'
        place: suzhou
        thread: china-leadership
        c: 'Chen Yun 陈云 writes an inscription for the campaign to learn from Lei Feng 雷锋: "Comrade Lei Feng is a good son of the Chinese people; let all learn from him." Mao Zedong''s 毛泽东, Liu Shaoqi''s 刘少奇, Zhou Enlai''s 周恩来, Zhu De''s 朱德 and Deng Xiaoping''s 邓小平 inscriptions had appeared in the papers before. (The nianpu''s note: the Ministry of National Defense 国防部 named a squad of an engineer unit of the Shenyang 沈阳 forces the "Lei Feng Squad" on Jan. 21, 1963; on Feb. 7 *Renmin ribao* 《人民日报》 reported Liaoning''s 辽宁 campaign, with Lei Feng''s deeds, extracts of his diary and the commentator''s article "A great ordinary soldier.")'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 141. Names: Chen Yun, Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:chen-yun', 'name:mao-zedong', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:zhu-de', 'name:deng-xiaoping']
