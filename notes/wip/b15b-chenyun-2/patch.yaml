  - add:
      entry:
        id: cal.1961-08-08.china-leadership-9
        when: Aug. 8
        date: '1961-08-08'
        place: beidaihe
        thread: china-leadership
        c: 'Beidaihe 北戴河. Chen Yun 陈云 sends Deng Xiaoping 邓小平 three reports of his inquiry at Xiaozheng commune 小蒸公社, Qingpu 青浦, with a letter: where he worked in the peasant movement in 1927 and has kept in touch, so the peasants dare to speak; they do not eat their fill, the cadres boast and live apart, do not criticize themselves and organize the collective''s work badly, yet they say they are much better off than under the Nationalists 国民党. The reports: sows should go to the peasants to keep (privately kept sows bear more and more piglets live); double-cropped rice is worse than broad beans and single-cropped rice (220 jin more a mu, 310–330 jin lost; crops to suit the place, old ways not lightly changed); private plots enough by the Center''s rule (3 percent of the land in the higher co-operatives, all taken at communization, 300 mu given back after the Zhengzhou 郑州 conference and taken again that autumn, now 0.5 percent in field land; 6 percent proposed, 3.5 of it field land).'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 102–103. Made public: 1986. To check: [[w.chen-yun-wenxuan-1956]], where the nianpu says the letter and the three reports are collected, as 《青浦农村调查》. Names: Chen Yun, Deng Xiaoping.'
        tags: ['polity:prc', 'name:chen-yun', 'name:deng-xiaoping', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-08-12.china-leadership-12
