        n: '[[w.chen-yun-nianpu-xiuding]], III, 128. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - cite: {id: cal.1962-03-07.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 128–130 (Mar. 7: no ten-year plan now, a five-year plan first, recovery the present task; no haste over targets for the Third Five-Year Plan; this year''s plan adjusted much and then left alone, not "a year''s plan, planned all year"; industry and construction slowed for farming and the market: steel for motor junks, half a jin of fish a month in the big and middle cities, half a jin of pork, a political question; agriculture and the market a matter of the people''s livelihood, to be a state policy; "cut to the sinew and bone" in heavy industry and construction; overall balance from the start, by the short line; materials more centralized in recovery; the Planning and Economic Commissions and the Agriculture Office 农办 to study farming and turn to it; in the early years he cut construction to what the state could bear and allowed no new hands without materials; different views to be encouraged. Zhou interjects the couplet)'}
  - cite: {id: cal.1962-03-07.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 129 (Zhou interjects during Chen Yun''s speech of Mar. 7: a couplet, first food, clothing and use, then agriculture, light and heavy industry, across it overall balance)'}
  - cite: {id: cal.1962-03-08.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 128 (Chen Yun at the group''s meetings of Mar. 7 and 8, which study the adjustment further)'}
  - cite: {id: cal.1962-03-08.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 130 (Mar. 9: Chen Yun leaves Peking for the south to rest; at Hangzhou 杭州 Mar. 10–Apr. 17)'}
  - variant: {id: cal.1962-03-08.china-leadership-3, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'Chen Yun leaves Peking on Mar. 9, for Hangzhou, where he rests from Mar. 10 to Apr. 17, and goes to Shanghai Apr. 18', at: 'III, 130'}
  - add:
      entry:
        id: cal.1962-03-10.china-leadership-7
        when: Mar. 10–Apr. 17
        date: '1962-03-10'
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Chen Yun 陈云 rests, to Apr. 17.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - add:
      entry:
        id: cal.1962-03.china-leadership-11
        when: Mar.–Apr., at Hangzhou, after the 10th
        date: 1962-03
        at: after 1962-03-10
        place: hangzhou
        thread: china-leadership
        c: 'Hangzhou 杭州. Chen Yun 陈云 reads the papers on Anhui''s 安徽 responsibility fields 责任田, which fit what he saw in the villages and his own way to restore farming, and tells his staff: an extraordinary measure for an extraordinary time; call it dividing the fields to households 分田到户 or fixing output by household 包产到户, the state, hit by such disasters natural and man-made, must rouse all the peasants, as the *Internationale* 《国际歌》 says, "by ourselves alone," to restore output fast.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-03.china-leadership-12
        when: Mar.–Apr., at Hangzhou, after the 10th
        date: 1962-03
        at: after 1962-03-10
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Chen Yun 陈云 twice asks Yao Yilin 姚依林 to Hangzhou and talks with him on fixing the state's grain purchase for good, the surplus to the peasants; on dividing the fields to households 分田到户 as things stand; and on putting it to Mao Zedong 毛泽东.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-03-10.china-leadership-8
        when: Mar. 10
        date: '1962-03-10'
        thread: china-leadership
        c: Liu Shaoqi 刘少奇 orders the speeches of Chen Yun 陈云, Li Xiannian 李先念 and Li Fuchun 李富春 to the enlarged State Council 国务院 printed for the Politburo Standing Committee, the Secretariat and the Central Finance and Economics Small Group, and proposes that, discussed and revised at a central meeting, they go to the provincial committees and the central departments' Party groups.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 130. See [[cal.1962-02-26.china-leadership-3]]. Made public: 2015. Names: Liu Shaoqi, Chen Yun, Li Xiannian, Li Fuchun.'
        tags: ['polity:prc', 'name:liu-shaoqi', 'name:chen-yun', 'name:li-xiannian', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1962-03-13.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Mar. 12–13: the meeting adopts the Center''s comment forwarding the three speeches; Liu proposes that Chen Yun still head the Central Finance and Economics Small Group, Li Fuchun his deputy; Li Fuchun: Chen Yun is the fittest, I shall be his assistant; so decided. Chen Yun, away, hearing of it, says the head had better not change; Liu: all agree, so you head it; I support you to the end)'}
  - variant: {id: cal.1962-02-21.china-leadership-4, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'Liu Shaoqi proposes Chen Yun as head of the Central Finance and Economics Small Group, Li Fuchun his deputy, at the enlarged Standing Committee of Mar. 12–13, not at the Xilou meeting; Chen Yun, away, would have the head unchanged; Liu: all agree, he supports him to the end', at: 'III, 131'}
  - cite: {id: cal.1962-03-16.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Liu Shaoqi, Zhou and Deng fly to Wuhan 武汉 to report to Mao on the enlarged Standing Committee)'}
  - cite: {id: cal.1962-03-17.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (Mao, having read with care the edited texts of the speeches of Chen Yun, Li Xiannian and Li Fuchun, calls Liu, Zhou, Deng and others the next day: the speeches to go out in the Center''s name to provincial and army level; Chen Yun to head the Central Finance and Economics Small Group)'}
  - cite: {id: cal.1962-03-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (the Center''s directive forwarding the speeches of Chen Yun and others 《关于批发陈云等同志讲话的指示》: the next ten years in two stages, adjustment (chiefly recovery, some growth), then growth; that the first is chiefly recovery not to be said outside, in or out of the Party, but called the adjustment stage. The provinces ask to relay the speeches more widely; Chen Yun''s above all help all see the whole and face the difficulties)'}
  - add:
      entry:
        id: cal.1962-04-26.china-leadership-11
        when: Apr. 26
        date: '1962-04-26'
        thread: china-leadership
        c: The Center 中共中央, by a supplementary notice, widens the relaying of the three speeches of Chen Yun 陈云, Li Xiannian 李先念 and Li Fuchun 李富春 to the prefectures and cities.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 131. See [[cal.1962-03-18.china-leadership]]. Made public: 2015. Names: Chen Yun, Li Xiannian, Li Fuchun.'
        tags: ['polity:prc', 'name:chen-yun', 'name:li-xiannian', 'name:li-fuchun', 'vis:only:prc']
  - cite: {id: cal.1962-04-19.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 131 (the General Office''s notice of the Center''s decision: Chen Yun head, Li Fuchun and Li Xiannian deputies; Zhou Enlai, Tan Zhenlin, Bo Yibo, Luo Ruiqing, Cheng Zihua, Gu Mu, Yao Yilin, Xue Muqiao and others members)'}
  - cite: {id: cal.1962-03-22.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 131–132 (Mao to the members of Tian Jiaying''s 田家英 team for the Shaoshan 韶山 villages of Hunan: he knows farming still, not industry; there he is not as good as Comrade Chen Yun)'}
  - cite: {id: cal.1962-04-02.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 132 (Apr. 2–4, the enlarged meeting of the Central Finance and Economics Small Group on the Planning Commission''s report on adjusting the 1962 plan; Zhou: grave imbalance everywhere; strive for fast and prepare for slow, strive for good and prepare for poor; the plan to be cut deeply)'}
  - add:
      entry:
        id: cal.1962-04.china-leadership-7
        when: Apr., at Hangzhou, after the 4th
        date: 1962-04
        at: after 1962-04-04
        place: hangzhou
        thread: china-leadership
        c: Hangzhou 杭州. Xue Muqiao 薛暮桥 brings Chen Yun 陈云 the Central Finance and Economics Small Group's 中央财经小组 draft report on discussing the 1962 adjustment plan 《关于讨论一九六二年调整计划的报告（草稿）》, which analyzes the grave difficulties and the measures; Chen Yun agrees to it.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. See [[cal.1962-04-02.china-leadership-2]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-04.china-leadership-8
        when: Apr., late
        date: 1962-04
        at: before 1962-04-21
        thread: china-leadership
        c: The Central Finance and Economics Small Group 中央财经小组 sends the Center 中共中央 its report on discussing the 1962 adjustment plan.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. See [[cal.1962-04.china-leadership-7]]. Made public: 2015.'
        tags: ['polity:prc', 'vis:only:prc']
  - cite: {id: cal.1962-04-16.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 132 (the letter, Deng Liqun 邓力群 the one sent for Chen Yun''s views; in mid-April Mao reads Chen Yun''s speech of Mar. 7 and marks its main passages)'}
  - add:
      entry:
        id: cal.1962-04.china-leadership-9
        when: Apr., before the 16th
        date: 1962-04
        at: before 1962-04-16
        thread: china-leadership
        c: Chen Yun 陈云, away, hearing that Liu Shaoqi 刘少奇 is having his speeches and writings since the socialist transformation compiled, objects several times, and above all to their printing; Liu answers that they will not be widely printed, only for the Politburo Standing Committee and the Central Finance and Economics Small Group 中央财经小组.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. Made public: 2015. Names: Chen Yun, Liu Shaoqi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:liu-shaoqi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-04.china-leadership-10
        when: Apr., mid-month
        date: 1962-04
        at: before 1962-04-11
        thread: china-leadership
        c: Mao Zedong 毛泽东 reads Chen Yun's 陈云 speech of Mar. 7 to the Central Finance and Economics Small Group, and marks its main passages.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. See [[cal.1962-03-07.china-leadership-3]]. Made public: 2015. Names: Mao Zedong, Chen Yun.'
        tags: ['polity:prc', 'name:mao-zedong', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-04-18.china-leadership-6
        when: Apr. 18–June 23
        date: '1962-04-18'
        place: shanghai
        thread: china-leadership
        c: Shanghai 上海. Chen Yun 陈云 rests, to June 23.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 132. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun']
  - cite: {id: cal.1962-05.china-leadership-7, item: '[[w.chen-yun-nianpu-xiuding]], III, 132 (during his rest at Shanghai, Apr. 18–June 23, Chen Yun receives Tian Jiaying''s report on the villages of Shaoshan 韶山 and elsewhere in Hunan, with the cadres'' and the people''s call for fixing output by household and dividing the fields to households, and praises its "clear-cut views")'}
  - cite: {id: cal.1962-05.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 132–133 (May 16: Tian Jiaying reports to Mao, in Shanghai, on his inquiry; Mao: "we follow the mass line, but at times we cannot wholly heed the masses; if they want household contracting, for one, we cannot")'}
  - cite: {id: cal.1962-05-07.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 133 (May 7–11: the conference agrees with the group''s analysis and decides on an all-round, sweeping adjustment, agriculture, light and heavy industry in order, the industrial front shortened, workers and townspeople cut, the market supplied, inflation stopped; Deng Xiaoping at the close: two central tasks, 20 million fewer townspeople and better work in the teams; the group revises the report after, and with Mao''s approval it goes out May 26)'}
  - cite: {id: cal.1962-05-26.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 133 (the Central Finance and Economics Small Group''s report, revised after the work conference, goes out to the whole country with Mao''s approval)'}
  - cite: {id: cal.1962-05-27.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 133 (the decision: the nation''s workers and staff to be cut by a further 10.56 to 10.72 million from the end of last year, the town population by 20 million)'}
  - add:
      entry:
        id: cal.1962-05.china-leadership-17
        when: May
        date: 1962-05
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团 on revising the long traditional tanci 弹词 *The Jade Dragonfly* 《玉蜻蜓》: the old repertoire is not to be revised apart from its times, nor the ancients asked to be moderns; the feudal, superstitious and lewd have been well cut these years, but what is "feudal" needs thought, and class views narrowly used would cut the work off from the people.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 133. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]] (as 《关于〈玉蜻蜓〉》); [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-06-03.china-leadership-4
        when: June 3
        date: '1962-06-03'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云, by letter to Zhou Liang 周良: nearly a year since they parted at Suzhou 苏州; the pingtan 评弹 research materials he sent hold much of value, useful work, to be carried on.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 134. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]] (as 《做好评弹资料的搜集工作》); [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-05-21.china-leadership-8
        when: May 21
        date: '1962-05-21'
        thread: china-leadership
        c: Zhou Jianren 周建人, Governor of Zhejiang 浙江省省长 and vice-chairman of the China Association for Promoting Democracy 中国民主促进会, by letter to Chen Yun 陈云 and Liu Shaoqi 刘少奇, tells of the peasants' hard life and proposes that the IOUs given them for goods taken be honored on time.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 134. Made public: 2015. Names: Chen Yun, Liu Shaoqi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:liu-shaoqi', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-06-04.china-leadership-6
        when: June 4
        date: '1962-06-04'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 answers Zhou Jianren 周建人: the Center knows the peasants'' hardship, but must hold back the money sent to the villages; the currency in circulation is nearly twice 1957''s, the towns'' share down from two-thirds to one-third, the villages'' up from one-third to two; the IOUs put off three years and the grain bonus prices ended to that end, since peasants with money will not sell to the state and the northern provinces have few goods to trade them; the peasants are to be told why.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 134. See [[cal.1962-05-21.china-leadership-8]]. Made public: 2005 ([[w.chen-yun-wenji]], where the nianpu says it is printed). To check: [[w.chen-yun-wenji]], III. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-06-04.china-leadership-7
        when: June 4
        date: '1962-06-04'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 sends Zhou Jianren''s 周建人 letter on to Liu Shaoqi 刘少奇, with a note that he has answered him: the Center knows the peasants'' hardship, and the money to the villages must be held back.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 134. See [[cal.1962-06-04.china-leadership-6]]. Made public: 2015. Names: Chen Yun, Liu Shaoqi.'
        tags: ['polity:prc', 'name:chen-yun', 'name:liu-shaoqi', 'vis:only:prc']
  - cite: {id: cal.1962-06-10.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 134 (the Center''s directive to prepare to crush the Nationalist forces'' incursion on the southeast coast; since the year''s start the Taiwan authorities have set up a supreme organ for counterattacking the mainland; the army''s, the coastal people''s and the militia''s readiness and Xinhua''s exposure make Chiang Kai-shek''s forces give up the adventure)'}
  - cite: {id: cal.1962-06-24.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 134 (*Renmin ribao*''s commentary of June 24, "The Chiang bandit gang, backed by American imperialism, vainly tries to invade the mainland" 《蒋匪帮在美帝国主义支持下妄图窜犯大陆》)'}
  - cite: {id: cal.1962-06.china-leadership-17, item: '[[w.chen-yun-nianpu-xiuding]], III, 135 (June 24: Chen Yun returns from Shanghai to Peking)'}
  - cite: {id: cal.1962-06.china-leadership-11, item: '[[w.chen-yun-nianpu-xiuding]], III, 135 (late June to early July, in Peking: Chen Yun exchanges views separately with Liu Shaoqi, Zhou Enlai, Lin Biao and Deng Xiaoping on redividing the land to rouse the peasants and restore farm output, and finds them broadly agreed; Deng: dividing the fields to households is one way, and many ways may be used)'}
  - cite: {id: cal.1962-06-30.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 135 (morning: Zhou calls on Chen Yun at his home; they talk)'}
  - cite: {id: cal.1962-07-06.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 135 (morning, Mao just back to Peking that morning from his inspection: Tian Jiaying, at his own request, puts his view of household contracting and dividing the fields, a temporary expedient, the peasants to be led back to the collective when output recovers; Mao: is your stand chiefly the collective or the individual economy? Your own view, or others''?)'}
  - cite: {id: cal.1962-07-06.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 135 (1 p.m., Chen Yun to Mao, just back that morning: better than when he fell ill, but weak, two or three months more to recover; he has thought of ways to restore farming and would talk with Mao, an hour enough; he can walk to Mao''s. Some had urged him not to hurry; he answered that leading the nation''s economic work he must answer to the Party and the people, and with the way found, how could he lose the moment. 4 p.m., at Mao''s, he proposes redividing the fields to rouse the peasants and restore output; Mao says nothing then)'}
  - cite: {id: cal.1962-07-07.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 135–136 (some days after Chen Yun''s talk, Mao at a small meeting says he very much disagrees with Chen Yun''s view, but Chen Yun, a Standing Committee member, did no organizational wrong in putting it to the Party''s Chairman; Mao criticizes Deng Zihui and Tian Jiaying: their "dividing the fields to go it alone" breaks up the collective economy)'}
  - cite: {id: cal.1962-07-08.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (Mao calls Liu, Zhou, Deng, Chen Boda and Tian Jiaying: the summer harvests of Henan and Shandong, things not so bad; he is against household contracting and proposes a Center decision on strengthening the communes'' collective economy and farm output, for the work conference)'}
  - cite: {id: cal.1962-07-09.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (midday: Zhou calls on Chen Yun at his home; they talk)'}
  - cite: {id: cal.1962-07-15.china-leadership-9, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (Chen Yun leaves Peking for Beidaihe 北戴河 to rest)'}
  - cite: {id: cal.1962-07-17.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (Deng Zihui at Mao''s urges the responsibility fields, in fact a production responsibility system with pay by output; Mao does not state a view)'}
  - cite: {id: cal.1962-07-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (Mao to Yang Shangkun: the collective road or the individual economy? Yang''s diary: "I feel the matter is very grave!! Most uneasy!")'}
  - cite: {id: cal.1962-07-20.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 136 (Mao to the regional bureaus'' first secretaries: some want household contracting, even dividing the fields, over the whole country; some say farming needs eight years to recover, four with household contracting; is recovery so hard?)'}
  - cite: {id: cal.1962-07-25.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 136–137 (Chen Yun receives the article "The socialization of Polish agriculture" 《波兰农业社会化》, from *Xiongdi guojia he xiongdi dang baokan ziliao* 《兄弟国家和兄弟党报刊资料》 no. 1110, which Mao sends for him, Deng Zihui and Tian Jiaying to read: Poland to use collective farming more widely, the cheapest road to co-operatives and state farms through farming groups)'}
  - cite: {id: cal.1962-07.china-leadership-8, item: '[[w.chen-yun-nianpu-xiuding]], III, 137 (July 28: Chen Yun to Deng Xiaoping, for Mao: he has read the draft decision of July 24 on strengthening the communes'' collective economy and farm output, and wholly agrees; his heart is very bad, and to avoid another attack of angina or an infarction he asks leave from all the Beidaihe meetings)'}
  - cite: {id: cal.1962-07-28.china-leadership-7, item: '[[w.chen-yun-nianpu-xiuding]], III, 137 (Deng Xiaoping sends Chen Yun''s letter on to Mao)'}
  - cite: {id: cal.1962-07-31.china-leadership-6, item: '[[w.chen-yun-nianpu-xiuding]], III, 137 (Mao: "Agreed; to Liu, Zhou, Zhu and Chen to read, then to Shangkun to keep")'}
  - cite: {id: cal.1962-08-06.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 137–138 (Aug. 6–24, its preparatory meeting from July 25; meant for farming, grain, commerce and support of agriculture, it turns to class struggle and the attack on the "dark wind" and the "go-it-alone wind"; Mao: some see all dark these two years; five or eight years to recover leaves no hope; strive for fast, prepare for slow; going it alone means polarization in a year, Khrushchev dares not openly dissolve the collective farms; Deng Zihui and Tian Jiaying named)'}
  - add:
      entry:
        id: cal.1962-08.china-leadership-12
        when: Aug., after the work conference of the 6th–24th
        date: 1962-08
        at: after 1962-08-24
        thread: china-leadership
        c: 'Mao Zedong 毛泽东 says again that Chen Yun''s 陈云 view was wrong, but that he has a sense of organization and keeps discipline: he put it to the Standing Committee 中央常委 and did not spread it abroad.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 138. See [[cal.1962-08-06.china-leadership]]. Made public: 2015. Names: Mao Zedong, Chen Yun.'
        tags: ['polity:prc', 'name:mao-zedong', 'name:chen-yun', 'vis:only:prc']
