        date: '1961-07-14'
        place: xiaoshan
        thread: china-leadership
        c: Xiaoshan 萧山. Chen Yun 陈云 goes to Xiaoshan county 萧山县 and holds a forum with its heads on why their double-cropped rice yields well.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 97. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
