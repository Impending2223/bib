        thread: china-leadership
        c: The Center 中共中央 weighs restoring the Central Finance and Economics Small Group 中央财经小组. Liu Shaoqi 刘少奇 and Zhou Enlai 周恩来 want Chen Yun 陈云 to head it; he says he is not well enough to head it, but may be a member. Li Fuchun 李富春 is settled on as its head, Zhou, Chen Yun and others members.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 128. Made public: 2015. Names: Liu Shaoqi, Zhou Enlai, Chen Yun, Li Fuchun.'
        tags: ['polity:prc', 'name:liu-shaoqi', 'name:zhou-enlai', 'name:chen-yun', 'name:li-fuchun', 'vis:only:prc']
