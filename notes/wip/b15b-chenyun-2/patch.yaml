  - add:
      entry:
        id: cal.1962-02-18.china-leadership-9
        when: Feb. 18
        date: '1962-02-18'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡 and Li Qingfu 李庆福: Tang Gengliang 唐耿良, Zhang Hongsheng 张鸿声 and Zhang Xiaosheng 张效声, storytellers of the Shanghai People''s Pingtan Troupe 上海市人民评弹团, playing *Tracks in the Snowy Forest* 《林海雪原》 together do far better than singly; several fine players working a new story together raise it fast; to be tried with other new stories.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 124. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1962-02-21.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 124–125 (Feb. 21–23, the Xilou 西楼 meeting, the enlarged Standing Committee under Liu Shaoqi on the 1962 budget and the economy: after the Seven Thousand Cadres Conference a deficit of 3 billion found, more with the water squeezed from 1958–61''s revenue; a recovery period needed. Feb. 23, Chen Yun speaks: five signs (farm output much down; construction beyond the state''s means; deficits met by printing money, inflation; serious speculation; the towns'' living standards down) and six measures (the ten-year plan, 1963–72, in a recovery and a growth stage; fewer townspeople; every means against inflation; the towns'' minimum needs met; every force to farming; the planners to turn from industry and transport to farming and inflation). Liu: the conference did not sound the difficulties, men feared to say all black; an extraordinary period, extraordinary measures; he proposes a full State Council meeting for Chen Yun to speak more; Chen Yun agrees and asks that it take in the ministries'' Party groups, he, Li Fuchun and Li Xiannian to relay the meeting)'}
  - cite: {id: cal.1962-02-23.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 125 (Chen Yun speaks on the 23rd, the five signs of the difficulties and six measures; Liu Shaoqi, in interjections and his conclusion, asks for a full State Council meeting for Chen Yun to speak more; Chen Yun agrees, asking that the ministries'' Party group members attend)'}
  - cite: {id: cal.1962-02-24.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 125 (Chen Yun with Zhou, Deng, Peng Zhen, Li Fuchun, Li Xiannian, Chen Boda, Kang Sheng, Yang Shangkun and others at Liu''s meeting settling his written and oral reports)'}
  - cite: {id: cal.1962-02-26.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 125–128 (Chen Yun''s speech to the enlarged State Council, the ministries'' and commissions'' Party group members attending, 《目前财政经济情况和克服困难的若干办法》: all agree there are difficulties, not on how great or how long, and the difference not to be hidden. Difficulties: grain some 80 billion jin under 1957, 10 billion imported last year and 8 billion this; 100 million mu of land lost net; construction too big even in a normal year; inflation, stocks, gold, silver and foreign exchange drawn and 6–7 billion yuan printed; 3 billion yuan in notes to the villages for goods worth 1 billion; the towns'' living down. In our favor: the peasants'' zeal since the Twelve and Sixty Articles; grain, poultry and pigs rising; the enlarged capacity; the people with us; the leaders'' experience. Ways: the ten-year plan in two stages, recovery about five years from 1960, then growth; fewer staff and townspeople, the sooner the better; against inflation, cash control, materials to light industry, imports, a few high-priced goods (the villages this year), the fight on speculation; 3 jin of beans a month, nylon socks from 4 million dollars of imports, 40–50 million yuan of delicacies for high-priced restaurants; every force to farming, more bonus grain for cotton growers, fertilizer, steel and timber for tools; the Planning and Economic Commissions to put food, clothing, the market and inflation first; test, then spread, "steady and sure")'}
  - to-check: {id: cal.1962-02-26.china-leadership-3, add: '[[w.chen-yun-wenxuan-1956]], where the Chen Yun nianpu says the speech is collected ([[w.chen-yun-nianpu-xiuding]], III, 128).'}
