      base: b5cdb082
      set: {place: peking, n: '[[w.macfarquhar-origins-of-the-cultural]], III, 192–94; [[w.mao-zedong-zhuan]], V, ch. 69 (Feb. 26: the State Council meeting of the ministries'' Party group members, Chen Yun speaking on the finances and economy and the way out; Li Xiannian on credit and the market and Li Fuchun on industry; the Center forwards the three speeches Mar. 18). [[w.yang-jisheng-mubei]], II, 1174 (the State Council''s enlarged meeting of Feb. 26, 1962, one of the meetings that framed a set of measures to adjust the economy further); [[w.yang-jisheng-mubei]], II, 1118–1119 n.17 (Chen Yun''s talk of Feb. 26 gathers the grim situation in five points: the great fall in farm output; capital construction beyond the state''s means; too many notes printed, inflation; city notes flowing to the countryside and speculation; falling living standards in the cities). Made public: 1986 ([[w.chen-yun-wenxuan-1956]]). To check: [[w.liqun-xiang-chen-yun-tongzhi]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 192 n.30a); [[w.jin-1949-1989-niande-zhongguo]], 416 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 192 n.30b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1052 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 194 n.34). Names: Chen Yun, Li Fuchun.'}
  - edit:
      id: cal.1962-03-07.china-leadership-3
      base: 0bccecef
      set: {place: peking, n: '[[w.macfarquhar-origins-of-the-cultural]], III, 197–99; [[w.mao-zedong-zhuan]], V, ch. 69 n.29 (Mar. 7: Chen Yun to the Central Finance and Economics Small Group: recovery now, the plan for 1962 much adjusted, the weight on farming and the market; short lines, not long, to be the basis of balance). [[w.jian-zhou-enlai]], 464 (the group''s March meeting: Chen Yun for cutting heavy industry and construction in the 1962 budget and plan). Made public: 1986 ([[w.chen-yun-wenxuan-1956]]). To check: [[w.chen-yun-tongzhi-wengao]], 173 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43a); [[w.lardy-chen-yuns-strategy-for]], 202 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43b); [[w.chen-yun-wenxuan-1956]], 198 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1054 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.43d); [[w.lardy-chen-yuns-strategy-for]], 202–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.44a); [[w.macfarquhar-origins-of-the-cultural]], I, 57–58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.44b); [[w.liqun-xiang-chen-yun-tongzhi]], 82 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.45a); [[w.chen-yun-yu-xin]], 514–28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.45b); [[w.lardy-chen-yuns-strategy-for]], 206 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.46a); [[w.macfarquhar-origins-of-the-cultural]], II, 165–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 197 n.46b); [[w.lardy-chen-yuns-strategy-for]], 206–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 198 n.47); [[w.lardy-chen-yuns-strategy-for]], 204–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.50a); [[w.chen-yun-tongzhi-wengao]], 175 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 199 n.50b); Chen Yun 陈云, speech at the Central Finance and Economics Small Group 中央财经小组, Mar. 7, 1962; [[w.chen-yun-wenxuan-1956]] (the note cites vol. 3 of the 1995 ed., 207–215) (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.29); [[w.chen-yun-nianpu-1905]], III, 133–135 (cited by [[w.jian-zhou-enlai]], 464 n.94). Names: Chen Yun.'}
