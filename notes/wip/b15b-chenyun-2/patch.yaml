  - add:
      entry:
        id: cal.1961-09-05.china-leadership-7
        when: Sept. 5
        date: '1961-09-05'
        place: shanghai
        thread: china-leadership
        c: 'Shanghai 上海. Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团 and the opera section of the Shanghai People''s Broadcasting Station 上海人民广播电台: what the public likes is not always good; ask whether most like it and whether it serves their lasting good; the old dance halls and brothels would draw people again if reopened; the obscene matter of the old repertoire sold well and would again, but no such tradition is to be dug up, however popular: on this no ground is to be given.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 106. Made public: 2015. To check: 《陈云同志关于评弹的谈话和通信（增订本）》, where the nianpu says it is collected, as 《衡量一个节目的好坏，要看对人民是否有利》 (the first edition, [[w.chen-yun-tongzhi-guanyu]], 1983). Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
