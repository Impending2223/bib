        when: '1963'
        date: '1963'
        thread: china-leadership
        c: 'Chen Yun 陈云, by letter to He Zhanchun 何占春: of the stories he heard this year, twelve were new to him, all by players of smaller pingtan 评弹 troupes; storytelling is not theater, often one player or a married pair on small river towns, far from any control, so that training them is hard; he would like more such recordings.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 143. Made public: 2015. Names: Chen Yun.'
