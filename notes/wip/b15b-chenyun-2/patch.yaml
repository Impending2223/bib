  - cite: {id: cal.1964-12-15.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 147 (Dec. 15–Jan. 14, 1965, Mao presiding: the Twenty-three Articles, the movement aimed at those in authority in the Party taking the capitalist road; Mao criticizes Liu Shaoqi''s "four clean and four unclean" and the overlapping contradictions, and the two "independent kingdoms" in Peking, the Secretariat and the Planning Commission; Chen Yun absent, ill)'}
  - cite: {id: cal.1964-12-21.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 147–148 (Zhou''s Government Work Report: the task of adjusting the economy basically done; from the Third Five-Year Plan two steps, an independent, fairly complete industrial and economic system, then the four modernizations)'}
  - cite: {id: cal.1965-01-03.china-leadership-5, item: '[[w.chen-yun-nianpu-xiuding]], III, 147 (the Congress (Dec. 21–Jan. 4) elects Liu Shaoqi Chairman and Zhu De chairman of its Standing Committee)'}
  - cite: {id: cal.1965-01-04.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 147 (the Congress keeps Zhou Enlai Premier and names Lin Biao, Chen Yun, Deng Xiaoping and others, sixteen, vice-premiers)'}
  - add:
      entry:
        id: cal.1964.china-leadership-53
