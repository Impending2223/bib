        id: cal.1969-01.china-leadership-11
        when: Jan.
        date: 1969-01
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 fills in his delegate''s registration form for the Ninth National Congress of the Communist Party of China 中国共产党第九次全国代表大会; under schooling he writes: a private school to the higher primary, six years in all.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 167. See [[cal.1969-01.china-leadership-10]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1969-03-02.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 167 (Mar. 2: Soviet border troops intrude on the Zhenbao Island area of Heilongjiang province, making a grave bloody incident; China''s border troops are forced to hit back in self-defense; thereafter Sino-Soviet relations worsen further)'}
  - add:
