  - cite: {id: cal.1969-03-31.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 167–168 (Mar. 31: Mao''s minute on Zhou Enlai''s report on the make-up of the Ninth Congress''s presidium: "Agreed. At tomorrow''s opening there should not be too few on the platform; Boda, Kang Sheng, Old Dong, Bocheng, Zhu De, Chen Yun and a few others should be on it; please consider and decide")'}
  - cite: {id: cal.1969-04-01.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 168 (the next day (Apr. 1) Zhou writes Mao and Lin Biao proposing a list of twelve for the platform, among them Dong Biwu, Liu Bocheng, Zhu De and Chen Yun)'}
