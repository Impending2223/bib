  - add:
      entry:
        id: cal.1968-07-21.china-leadership-6
        when: July 21
        date: '1968-07-21'
        thread: china-leadership
        c: Kang Sheng 康生, by letter to Jiang Qing 江青 on the personnel of the Ninth Congress 中共九大, sends a list he has drawn up himself sorting and labeling the members and alternates of the Eighth Central Committee 八届中央委员、候补中央委员; Zhu De 朱德, Chen Yun 陈云 and others, eighteen in all, are put in the class of those with errors or whose history needs examining.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 163. Made public: 2015. Names: Kang Sheng, Jiang Qing, Zhu De, Chen Yun.'
        tags: ['polity:prc', 'name:kang-sheng', 'name:jiang-qing', 'name:zhu-de', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-09-04.china-leadership-3
        when: Sept. 4
        date: '1968-09-04'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云 answers the Anhui Revolutionary Committee 安徽省革命委员会 on the history of Wang Zhong 王中, member of the Anhui Party committee''s standing committee and vice-governor: there was a Wang Zhong in Moscow 莫斯科, who went to Yan''an 延安 after the war of resistance began; a shop assistant of the Shanghai 上海 silk and cotton trade; sent back from Moscow to the White areas 白区 with others, all told to find jobs and work alone, since in 1936 the White-area Party''s people had been arrested, lost or called back to Moscow, and the Party delegation in Moscow judged little organized underground Party left; so those sent back were not to link with old members, but to find jobs and work alone to keep their strength.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 163–164. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1968-09-05.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 164 (September: twenty months after the "January storm", all twenty-nine provinces, municipalities and autonomous regions have set up revolutionary committees)'}
  - cite: {id: cal.1968-09-07.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 164 (September: the *Renmin ribao* editorial: "the whole movement has entered, all over the country, the stage of struggle, criticism, transformation"; the nianpu''s note: 斗、批、改 first meant struggling down the capitalist-roaders, criticizing bourgeois academic authorities and all exploiting-class ideology, and reforming education, the arts and the superstructure; after the Ninth Congress a stage of the Cultural Revolution: three-in-one revolutionary committees, great criticism, cleaning the class ranks, Party rectification, cutting down organs, reforming irrational rules, sending office staff down)'}
  - cite: {id: cal.1968-10-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 164 (Chen Yun at the capital''s army and people''s rally at Tiananmen for the nineteenth anniversary)'}
  - cite: {id: cal.1968-10-05.china, item: '[[w.chen-yun-nianpu-xiuding]], III, 164 (Oct. 5: the *Renmin ribao*, in the editors'' note to its report ''The Liuhe May Seventh Cadre School gives new experience for the revolutionization of organs'' 《柳河"五七"干校为机关革命化提供了新的经验》, prints Mao''s instruction on cadres going down to labor; thereafter May Seventh cadre schools set up everywhere, and great numbers of cadres and intellectuals sent down to them to study and labor)'}
  - add:
      entry:
        id: cal.1968-10-08.china-leadership-3
        when: Oct. 8
        date: '1968-10-08'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, by letter to Zhou Enlai 周恩来: his elder daughter is about to give birth, and she and her husband have no housing at their work units; to help them, he asks to move from his temporary lodging in Peking''s western suburbs 北京西郊 back to his old home on Beichang Street 北长街 in the city.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 164. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-10-09.china-leadership-5
        when: Oct. 9
        date: '1968-10-09'
        thread: china-leadership
        c: Zhou Enlai 周恩来, on Chen Yun's 陈云 letter of Oct. 8, minutes the departments concerned to see to his move.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 164. See [[cal.1968-10-08.china-leadership-3]]. Made public: 2015. Names: Zhou Enlai, Chen Yun.'
        tags: ['polity:prc', 'name:zhou-enlai', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-10.china-leadership-27
        when: Oct., soon after the 9th
        date: 1968-10
        at: after 1968-10-09
        place: peking
        thread: china-leadership
        c: Peking 北京. Chen Yun 陈云 moves back to his home on Beichang Street 北长街.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 164. See [[cal.1968-10-09.china-leadership-5]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1968-10-13.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 164 (Oct. 13–31: Chen Yun attends the Twelfth Plenum of the Eighth Central Committee 中共八届十二中全会, Mao presiding)'}
  - cite: {id: cal.1968-10-31.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 164–165 (the plenum, "in a wholly abnormal state", adopts the ''Report on the examination of the crimes of the traitor, hidden enemy and scab Liu Shaoqi'' 《关于叛徒、内奸、工贼刘少奇罪行的审查报告》, written by Jiang Qing, Kang Sheng and others on false evidence, and expels Liu Shaoqi from the Party for ever, stripping him of all posts in and out of it; it adopts the decision to convene the Ninth Congress, the ''Decision on electing the delegates to the Ninth Congress'' 《关于九大代表产生的决定》 and the ''Decision on the draft constitution of the Communist Party of China'' 《关于中国共产党章程（草案）的决定》)'}
  - cite: {id: cal.1968-10.china-leadership-25, item: '[[w.chen-yun-nianpu-xiuding]], III, 165 (at the plenum Kang Sheng, Jiang Qing, Yao Wenyuan, Xie Fuzhi and others, on the pretext of discussing Mao''s question whether the Cultural Revolution was needed, besiege in the groups Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen and others of the so-called "February adverse current", and organize attacks on the "consistently rightist" Zhu De, Chen Yun, Deng Zihui and others)'}
  - add:
      entry:
        id: cal.1968-10.china-leadership-28
        when: Oct., at the Twelfth Plenum, the 13th to the 31st
        date: 1968-10
        at: after 1968-10-13
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Xie Fuzhi 谢富治, at the Twelfth Plenum of the Eighth Central Committee 中共八届十二中全会, attacks Chen Yun 陈云: at the Seven Thousand Cadres Conference 七千人大会 the Chairman three times asked him to speak, and he said that without investigation he had no right to speak; less than a month later he made a "black report" against Chairman Mao 毛泽东, the Great Leap 大跃进 and the general line 总路线; Li Xiannian 李先念 and Li Fuchun 李富春 played their part then too and must be thoroughly criticized; Liu Shaoqi 刘少奇 and Deng Xiaoping 邓小平, Zhu De 朱德 and Chen Yun all made revisionism; Liu brought out Chen Yun with the economic group to clear up the "wreckage", which was revisionism, and the Chairman did not approve of Chen Yun''s coming out; Chen Yun made money selling printed cloth, stir-fried pork slices and high-priced goods; he has always opposed Chairman Mao, and did no good while resting; all this must be settled.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 165. See [[cal.1968-10.china-leadership-25]]. Made public: 2015. Names: Xie Fuzhi, Chen Yun, Mao Zedong, Li Xiannian, Li Fuchun, Liu Shaoqi, Deng Xiaoping, Zhu De.'
        tags: ['polity:prc', 'name:xie-fuzhi', 'name:chen-yun', 'name:mao-zedong', 'name:li-xiannian', 'name:li-fuchun', 'name:liu-shaoqi', 'name:deng-xiaoping', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-10.china-leadership-29
        when: Oct., at the Twelfth Plenum, the 13th to the 31st
        date: 1968-10
        at: after 1968-10-13
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, at the Twelfth Plenum of the Eighth Central Committee 中共八届十二中全会, forced to it, criticizes himself several times, orally and in writing, for his so-called "line errors" 路线错误 before and after Liberation. Of his "error" of not speaking at the Seven Thousand Cadres Conference 七千人大会 of 1962 when Chairman Mao 毛泽东 asked him to: he would not spread his rightist views at so large a meeting, so did not speak; had he spoken, he could only have given the rightist views he then held; such silence was in fact another way of taking the stand of right opportunism.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 165. See [[cal.1968-10.china-leadership-28]]. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-11-19.china-leadership-3
        when: Nov. 19
        date: '1968-11-19'
        place: tianjin
        thread: china-leadership
        c: 'Tianjin 天津. The Tianjin Revolutionary Committee 天津市革命委员会 reports to the Center 中共中央 and the Central Cultural Revolution Group 中央文革 on the progress of the examination of Yuan Xuezu 袁血卒: he has grave historical problems; Chen Yun 陈云 has asked about his case many times, above all in the Cultural Revolution 文化大革命, writing three times to the Institute''s mass organizations and receiving them himself to state his view, and Yuan uses this to resist examination. An attachment sets out the course of it in detail.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 165 n.1. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1968-11-25.china-leadership
        when: Nov. 25
        date: '1968-11-25'
        thread: china-leadership
        c: 'Kang Sheng 康生 sends Mao Zedong 毛泽东 the Tianjin Revolutionary Committee''s 天津市革命委员会 report on Yuan Xuezu 袁血卒, and attacks in his covering letter: only from the attachment has he learned that Chen Yun 陈云 has once more shielded Yuan Xuezu, and in the Great Proletarian Cultural Revolution at that.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 165. See [[cal.1968-11-19.china-leadership-3]]. Made public: 2015. Names: Kang Sheng, Mao Zedong, Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:kang-sheng', 'name:mao-zedong', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1968-12-22.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 166 (Dec. 22: the *Renmin ribao*''s editors'' note to its report ''Some townspeople of Huining county, Gansu, settle in the countryside'' 《甘肃会宁县部分城镇居民到农村安家落户》 quotes Mao''s latest instruction that educated youth go to the countryside to be re-educated by the poor and lower-middle peasants; from then the movement of educated youth up to the mountains and down to the villages spreads over the country)'}
  - cite: {id: cal.1968-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 166 (December: in the Center''s list of delegates to the Ninth Congress and provisional list, Chen Yun is put in the "list of Central Committee members and alternates who may be proposed as delegates only after discussion and the approval of the Chairman and Vice-Chairman Lin")'}
  - cite: {id: cal.1969-01-25.china-leadership-2, item: '[[w.chen-yun-nianpu-xiuding]], III, 167 (Chen Yun, with Zhou Enlai, Zhu De, Li Xiannian and others, accompanies Mao in receiving over 40,000 PLA commanders, local cadres and mass delegates from all over the country in Peking''s Mao Zedong Thought study classes, and the delegates to the "three supports, two militaries" work conference and the defense industry and metallurgical industry conferences; the nianpu''s note: 三支 and 两军, the army''s supporting the left, industry and agriculture, military control and military training in the Cultural Revolution)'}
  - add:
      entry:
        id: cal.1969-01.china-leadership-10
        when: Jan., or before, ahead of his registration
        date: 1969-01
        thread: china-leadership
        c: The consultative meeting of the organs directly under the Center 中共中央直属机关产生九大代表协商会议 for choosing delegates to the Ninth Congress 中共九大, though it holds that Chen Yun 陈云 does not meet the conditions for a delegate, "agrees unanimously to the decision of the proletarian headquarters headed by Chairman Mao 毛泽东 with Vice-Chairman Lin Biao 林彪 as its deputy".
        n: '[[w.chen-yun-nianpu-xiuding]], III, 167. Made public: 2015. Names: Chen Yun, Mao Zedong, Lin Biao.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'name:lin-biao', 'vis:only:prc']
