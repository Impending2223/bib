  - cite: {id: cal.1969-04-11.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 168 (while the Central Committee list is being settled, Mao tells the Congress secretariat and some of the conveners of the large groups: I propose that some old comrades be elected, Zhu De, Chen Yun, Deng Zihui, Zhang Dingcheng, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi; my speech at the opening meant this; the nianpu gives no day)'}
  - cite: {id: cal.1969-04-24.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 168 (the Congress elects a new Central Committee, of whose members fewer than a fifth were members or alternates of the Eighth; Chen Yun is still elected a member)'}
  - cite: {id: cal.1969-04-28.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 168–169 (Chen Yun attends the First Plenum of the Ninth Central Committee; Mao presides and speaks: most of those who led the factories were good people, but followed Liu Shaoqi''s line, material incentives, putting profit in command, not promoting proletarian politics, bonuses and the like; some things are not yet finished and must go on, struggle, criticism, transformation for one; the plenum elects Mao chairman, Lin Biao vice-chairman, Zhou Enlai, Chen Boda and Kang Sheng to the Politburo Standing Committee, and Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Li Zuopeng, Qiu Huizuo, Xie Fuzhi and others to the Politburo; for the first time since 1931 Chen Yun is left out of the Politburo)'}
  - cite: {id: cal.1969-05-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 169 (Chen Yun at the capital''s army and people''s May Day gala at Tiananmen)'}
