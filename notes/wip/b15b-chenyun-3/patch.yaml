      set: {n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 18, 1969); [[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 18, 1969; Zhou Enlai telephones Cheng Huiyuan 程惠远 (footnote: then head of the office of the core group of the Jiangxi revolutionary committee), asking Jiangxi to settle Chen Yun, Wang Zhen and Deng Xiaoping properly, to look after their living, and to report the arrangement to the Center). Made public: 2009 ([[w.deng-xiaoping-nianpu-1904]]). Names: Zhou Enlai, Chen Yun, Deng Xiaoping.'}
  - edit:
      id: cal.1969-04-01.china-leadership-2
      base: d59ecaa6
      set: {n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969); [[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Apr. 1, 1969; Zhou''s letter to Mao; Ye Jianying 叶剑英 among the front-row executive chairmen of the presidium Zhou proposes, with Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian and Nie Rongzhen). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]]). Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'}
  - cite: {id: cal.1968-03-22.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 163 (March: Lin Biao and Jiang Qing together make the "Yang, Yu, Fu incident", falsely charging Yang Chengwu, Fu Chongbi and Yu Lijin with "reversing the verdict on the February adverse current" and the like; the three removed from their army posts; Huang Yongsheng made chief of the General Staff and head of the Military Commission''s Office Group; the nianpu''s note: Yang then acting chief of the General Staff, a member of the Military Commission''s Standing Committee and head of its Office Group, Yu political commissar of the air force, Fu commander of the Peking Garrison)'}
  - cite: {id: cal.1968-03-25.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 163 (March: Huang Yongsheng made head of the Military Commission''s Office Group; from then the Office Group in effect replaces the Commission''s Standing Committee)'}
  - cite: {id: cal.1967-09.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 163 n.2 (the nianpu''s note: the Military Commission''s Office Group set up in August 1967 to handle the Commission''s daily work, answerable to its Standing Committee; Yang Chengwu head, Wu Faxian deputy head, its members Ye Qun, Li Zuopeng, Qiu Huizuo and others)'}
