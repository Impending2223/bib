        c: Peking 北京. Chen Yun 陈云 at the Ninth Congress's preparatory meeting 中共九大准备工作会议; he is listed among the members of the Congress's presidium 大会主席团.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 167. Made public: 2015. Names: Chen Yun.'
