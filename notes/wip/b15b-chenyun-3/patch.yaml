  - cite: {id: cal.1969-04-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 168 (Apr. 1–24: Chen Yun attends the Ninth National Congress of the Communist Party of China and sits at the front of the platform on the right at its opening session; Mao gives the opening speech; the Congress adopts the political report Lin Biao makes for the Center and the revised constitution; the nianpu: the report makes the wrong thought centered on class struggle "the Party''s basic line for the whole historical stage of socialism" and calls "the theory of continuing revolution under the dictatorship of the proletariat" the newest development of Mao Zedong Thought; the new constitution writes Lin Biao into its general program as "Mao Zedong''s successor"; the Congress made the Cultural Revolution''s theory and practice lawful and strengthened Lin Biao''s and Jiang Qing''s places in the Center)'}
  - add:
