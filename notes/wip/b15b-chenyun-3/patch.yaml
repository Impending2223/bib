        when: May 28 (to early October)
        date: '1969-05-28'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, by Mao Zedong''s 毛泽东 instruction that some old comrades go to factories and mines to "squat" 蹲点 and investigate, begins squatting at the Peking Xinhua Printing Works 北京新华印刷厂 (by the nianpu''s note one of the eight pilot units of struggle, criticism, transformation 斗、批、改 that Mao took in hand himself through the Center''s guard regiment, Unit 8341 中共中央警卫团（即8341部队）), to early October: half a day each morning; first seven days touring the main shops, then over fifty meetings of the workers'' struggle-criticism-transformation study classes.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 169. See [[cal.1969-02.china-leadership-14]]. Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 980–981, Ye Jianying''s, which has Chen Yun squatting at the works too). Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-time', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1969-02.china-leadership-14, item: '[[w.chen-yun-nianpu-xiuding]], III, 169 (Chen Yun, squatting at the works from May 28 to early October, with Ye Jianying, Tan Qilong, Huang Huoqing, Yang Shangkui and Huo Shilian, also squatting there, holds over ten forums to learn from the workers: the works'' history before Liberation, its seventeen years to the Cultural Revolution, its three years of Cultural Revolution, its plant and capacity, the great alliance and three-in-one, the revolutionary committee''s way of work, cleaning the class ranks, Party and League rectification, work with workers'' families, the pros and cons of the rule on earmarked funds, the living study of Mao Zedong Thought and the training of apprentices; the nianpu''s note: Tan, Huang, Yang and Huo before the Cultural Revolution secretaries of the Shandong, Liaoning, Jiangxi and Shaanxi Party committees)'}
  - add:
      entry:
        id: cal.1969-09-14.china-leadership-2
        when: Sept. 14
        date: '1969-09-14'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Chen Yun 陈云, by letter to Ye Jianying 叶剑英 for Zhou Enlai 周恩来, and to be reported to Mao Zedong 毛泽东 and Lin Biao 林彪, reports on his squatting at the Peking Xinhua Printing Works 北京新华印刷厂 and what he has learned: some rules and regulations must be reformed, or they hinder production, but some that should not have been scrapped have been swept away too; safety rules cannot go, such as the alarm bell before a machine worked by several men is started, so that they stand at safe posts; he proposes that each works first sort its rules by its own conditions and propose changes, and the State Council''s ministries 国务院各部 then draft new regulations for discussion below. He means to spend two weeks at the workers'' daily hour-long meetings after the afternoon shift, and to sit in on a few meetings of the works'' revolutionary committee.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 169–170. See [[cal.1969-05-28.china-leadership-2]]. Made public: 2015. Names: Chen Yun, Ye Jianying, Zhou Enlai, Mao Zedong, Lin Biao.'
        tags: ['polity:prc', 'ok:fields-time', 'name:chen-yun', 'name:ye-jianying', 'name:zhou-enlai', 'name:mao-zedong', 'name:lin-biao', 'vis:only:prc']
  - cite: {id: cal.1969-09-11.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 170 (Sept. 11: Zhou at the capital airport with Kosygin, chairman of the Soviet Council of Ministers, passing through Peking on his way home from Hồ Chí Minh''s funeral; four points agreed, chiefly that the Sino-Soviet disputes of theory and principle should not affect state relations and that until a solution is found the status quo on the border be kept and armed clashes avoided)'}
  - cite: {id: cal.1969-09.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 170 (before National Day, Mao, reading the draft ''Slogans for the twentieth anniversary of the founding of the People''s Republic of China'' 《庆祝中华人民共和国成立二十周年口号》, adds one: peoples of the world unite against any war of aggression by imperialism or social-imperialism, above all one with atom bombs as weapons; if such a war comes, the peoples of the world should wipe it out by revolutionary war, and prepare from now on)'}
  - cite: {id: cal.1969-10-01.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 170 (Chen Yun at the capital''s army and people''s rally at Tiananmen for the twentieth anniversary)'}
  - add:
      entry:
        id: cal.1969-10-14.china-leadership-4
        when: Oct. 14
        date: '1969-10-14'
        time_range: ['1969-10-14T11:00Z', '1969-10-14T14:00Z']
        time_band: evening
        time_zone: Asia/Shanghai
        thread: china-leadership
        c: 'The Center 中共中央, on Mao Zedong''s 毛泽东 estimate that the Soviet Union might use the Sino-Soviet boundary talks for a surprise attack on China, above all a nuclear one, sends out a notice: the old comrades in Peking 北京 are all to disperse for war readiness before Oct. 20.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 170. See [[cal.1969-10-14.china-leadership]]. The words: 当晚 (170). Made public: 2015. Names: Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1969-10-18.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 170 (Oct. 18: Lin Biao, without Mao''s approval, dictates an instruction putting the whole army on emergency war readiness; that evening Huang Yongsheng and others issue it formally to the whole army as "Vice-Chairman Lin''s instruction (the first order)")'}
  - cite: {id: cal.1969-10-17.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 170 (afternoon: Chen Yun, by the arrangement of the Center''s General Office, watches the athletes'' display at the Capital Gymnasium)'}
  - variant: {id: cal.1969-10-17.china-leadership-4, unit: A, witness: w.chen-yun-nianpu-xiuding, reads: 'afternoon (下午)', at: 'III, 170'}
  - cite: {id: cal.1969-10-17.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 170–171 (after the display Chen Yun, with Dong Biwu, Zhu De, Ye Jianying, Chen Yi, Deng Zihui, Li Fuchun, Zhang Dingcheng and others, at the meeting Zhou calls in the Gymnasium; Zhou announces Mao''s and the Center''s decision on dispersal for war readiness: "The Chairman, by the present situation, has decided that some comrades disperse from Peking to other places before or a little after the 20th, and has named each one''s place; I will see to the arrangements in each place by telephone, and the Center''s General Office will ready special planes or trains"; Dong Biwu, Zhu De and Ye Jianying to Guangdong, Chen Yun, Deng Xiaoping and Wang Zhen to Jiangxi, Chen Yi to Shijiazhuang, Nie Rongzhen to Handan, Xu Xiangqian to Kaifeng)'}
  - cite: {id: cal.1969-10-18.china-leadership-4, item: '[[w.chen-yun-nianpu-xiuding]], III, 171 (the next day Zhou himself telephones the head of the office of the Jiangxi Revolutionary Committee''s core group to settle Chen Yun, Deng Xiaoping and Wang Zhen properly, and says above all that Chen Yun is not well and his house must have heating; having squatted at a factory, he may go on squatting at a factory in Jiangxi)'}
  - add:
      entry:
        id: cal.1969-10.china-leadership-16
        when: Oct., before the 18th
        date: 1969-10
        at: before 1969-10-18
        thread: china-leadership
        c: 'Mao Zedong 毛泽东 to Wang Dongxing 汪东兴, head of the Center''s General Office 中共中央办公厅: "Put Chen Yun 陈云, Wang Zhen 王震 and the others along the lines of communication, so they can come and go easily. If war comes, when I need them I cannot do without these people. These people can still be used; I still want them."'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 171. Made public: 2015. Names: Mao Zedong, Chen Yun.'
        tags: ['polity:prc', 'name:mao-zedong', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-10-20.china-leadership-8
        when: Oct. 20
        date: '1969-10-20'
        place: [peking, nanchang]
        thread: china-leadership
        c: 'Chen Yun 陈云 and Wang Zhen 王震 leave together in one official railway car for Nanchang 南昌, Jiangxi 江西. Before leaving he has his staff pack Marx and Engels''s *Collected Works* 《马克思恩格斯全集》 and *Selected Works* 《马克思恩格斯选集》, *Capital* 《资本论》, Lenin''s *Collected Works* 《列宁全集》 and *Selected Works* 《列宁选集》, Stalin''s *Collected Works* 《斯大林全集》, Mao''s *Selected Works* 《毛泽东选集》, Lu Xun''s *Complete Works* 《鲁迅全集》 and others, two iron trunks and a wooden box, to go on reading in Jiangxi. None of his family goes with him: his wife Yu Ruomu 于若木 is at the Academy of Sciences'' 中国科学院 May Seventh cadre school at Hengdong 衡东, Hunan 湖南; of their five children one is at a May Seventh school, one at university awaiting assignment, one teaching at a village school outside Peking 北京, one assigned to the army in Tibet 西藏, one a worker in a Peking factory.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 171. See [[cal.1969-10-17.china-leadership]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-10-22.china-leadership-4
        when: Oct. 22
        date: '1969-10-22'
        time_range: ['1969-10-21T22:00Z', '1969-10-22T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云 arrives, and stays for the time at the Jiangxi Party committee's Binjiang Guesthouse 中共江西省委滨江招待所.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 171. See [[cal.1969-10-20.china-leadership-8]]. The words: 上午 (171). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-10-28.china-leadership-2
        when: Oct. 28
        date: '1969-10-28'
        time_range: ['1969-10-28T04:00Z', '1969-10-28T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: nanchang
        thread: china-leadership
        c: 'Nanchang 南昌, the Binjiang Guesthouse 滨江招待所. Chen Yun 陈云 receives Cheng Shiqing 程世清, chairman of the Jiangxi Revolutionary Committee 江西省革命委员会, come to see him. Cheng faults Chen Yun''s past running of the economy, badly done and too slow: Jiangxi means to make sixty or seventy thousand motor vehicles a year and to deliver ten billion jin of grain a year to the state.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 171–172. The words: 下午 (171–172). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-11.china-leadership-13
        when: Nov., before the 3rd
        date: 1969-11
        at: before 1969-11-03
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. The departments concerned, by Zhou Enlai's 周恩来 instruction, install heating at Chen Yun's 陈云 new lodging, and decide that he shall squat at the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂, two li from it.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 172. Made public: 2015. Names: Chen Yun, Zhou Enlai.'
        tags: ['polity:prc', 'name:chen-yun', 'name:zhou-enlai', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-11-03.china-leadership
        when: Nov. 3
        date: '1969-11-03'
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云, by the Jiangxi Revolutionary Committee's 江西省革命委员会 arrangement, moves from the city to the Fuzhou Military Region's cadres' sanatorium 福州军区干部休养所 at Qingyunpu 青云谱, in the western suburbs; for secrecy he goes in Jiangxi by the name Chen Yuanfang 陈元方.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 172. See [[cal.1969-11.china-leadership-13]]. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-11-12.china-leadership-2
        when: Nov. 12
        date: '1969-11-12'
        time_range: ['1969-11-11T22:00Z', '1969-11-12T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: nanchang
        thread: china-leadership
        c: 'Nanchang 南昌. Chen Yun 陈云 goes to the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂 (by the nianpu''s note made in the Cultural Revolution the 28th Regiment of the Jiangxi Production and Construction Corps 江西生产建设兵团第28团, with 10 companies, or shops, and over 100 squads) and tells its heads who come out to meet him: "I am a man who has made big mistakes, come to your works to be re-educated by the working class." After hearing their account of the works he says he will squat company by company and squad by squad, attending the squads'' production meetings and political study, and with them visits each of its sections and offices. From then he goes to the works each morning and reads at his lodging in the afternoons and evenings.'
        n: '[[w.chen-yun-nianpu-xiuding]], III, 172. See [[cal.1969-11-03.china-leadership]]. The words: 上午 (172). Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - cite: {id: cal.1969-11-12.china-leadership, item: '[[w.chen-yun-nianpu-xiuding]], III, 172 (Liu Shaoqi, wronged, dies at Kaifeng, Henan, aged seventy-one)'}
  - add:
      entry:
        id: cal.1969-11-13.china-leadership-3
        when: Nov. 13
        date: '1969-11-13'
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云, at the head office of the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂, hears its cadres of company (shop) level and above report on "grasping revolution, promoting production" 抓革命，促生产.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 172. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-11-17.china-leadership-3
        when: Nov. 17
        date: '1969-11-17'
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云 watches the workers at work in the metalworking, casting and forging, and vessel shops 金工、铸锻、容器车间 of the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 172–173. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-11.china-leadership-14
        when: Nov., late
        date: 1969-11
        at: before 1969-11-21
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云 begins to go in turn to each shop of the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂 for the squads' political study meetings and "five-good" 五好 appraisal meetings (by the nianpu's note good in political thought, military skill, the "three-eight" style, the fulfilling of tasks and physical training, an army campaign spread in the Cultural Revolution to factories and schools), and talks one by one with cadres, workers and technicians on the works' production and the staff's life.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 173. Made public: 2015. Names: Chen Yun.'
        tags: ['polity:prc', 'name:chen-yun', 'vis:only:prc']
  - add:
      entry:
        id: cal.1969-12-06.china-leadership-2
        when: Dec. 6
        date: '1969-12-06'
        place: nanchang
        thread: china-leadership
        c: Nanchang 南昌. Chen Yun 陈云 at the political study meeting of the wood-pattern squad of the foundry shop 铸工车间木模班 of the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂; at the workers' repeated request he signs the *Quotations from Chairman Mao* 《毛主席语录》 and *Selected Works of Mao Zedong* 《毛泽东选集》 just handed out to them.
        n: '[[w.chen-yun-nianpu-xiuding]], III, 173. Made public: 2015. Names: Chen Yun, Mao Zedong.'
        tags: ['polity:prc', 'name:chen-yun', 'name:mao-zedong', 'vis:only:prc']
  - cite: {id: cal.1970-01-01.china-leadership-3, item: '[[w.chen-yun-nianpu-xiuding]], III, 174 (Jan. 1: the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* New Year editorial sets two tasks for 1970: to rectify and build the Party on the basis of cleaning the class ranks; to grasp revolution and promote production, work and war readiness)'}
