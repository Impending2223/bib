- amend: x.1965-08-24.bundy-memo-to-president
  set:
    read: true
  add_copies:
  - FRUS 1964–68, XXX, doc. 98
  why: 'FRUS 1964–68, XXX, doc. 98 prints Bundy to Johnson, Aug. 24, 1965, 9:45 a.m., "Paul Dudley White and Mainland China," from Memos to the President, McGeorge Bundy, vol. 13: the file and the matter Chang cites at 271 n.38d (box 4, vol. 13, 8/65; White''s wish to visit China). Read, Chang run 2, Nov. 21, 2026.'
- amend: x.1966-09-01.jenkins-to-rostow
  set:
    read: true
  add_copies:
  - FRUS 1964–68, XXX, doc. 178
  why: 'FRUS 1964–68, XXX, doc. 178 prints Jenkins to Rostow, Sept. 1, 1966, "DOD Interest in ChiRep," from the Country File, China, vol. VII: the paper Chang cites at 273 n.42b (Country File, China, box 240, Memos (7)) for the Defense Department''s move toward a two-China policy. Read, Chang run 2, Nov. 21, 2026.'
- amend: x.1963-08-15.memo-for-record-rusk-jcs
  set:
    read: true
  add_copies:
  - FRUS 1961–63, VII, doc. 362
  why: 'FRUS 1961–63, VII, doc. 362 prints the memorandum for the record of Rusk''s meeting with the Joint Chiefs on the test ban, Aug. 13, 1963, 11 a.m., drafted by U. Alexis Johnson on Aug. 15, with LeMay''s question on the treaty''s political advantages: the memorandum Chang cites at 249 n.43c. Read, Chang run 2, Nov. 21, 2026.'
- amend: x.1965-12-03.mcgeorge-bundy-to-johnson-at-the
  absorbs: x.1965-12-03.bundy-to-johnson
  why: 'One record: Bundy to Johnson, Dec. 3, 1965, in the NSF Memos to the President (Chang, 270 n.34a: NSF, Aides, box 5, Bundy Memos to President (17) 11/20/65–12/31/65) is the telegram to the Ranch already registered here with its FRUS print (FRUS 1964–68, III, doc. 214), whose paragraph 3 gives the two Secretaries'' "increasing concern about possible Chinese involvement," the matter Chang cites it for. Absorbed by Chang run 2, Nov. 21, 2026; Chang''s edge goes to this row.'
- amend: x.1963-07-24.rusk-to-harriman
  set:
    read: true
  add_copies:
  - FRUS 1961–63, VII, doc. 351
  why: 'FRUS 1961–63, VII, doc. 351 prints Rusk to Harriman, telegram 321, July 24, 1963, 9:44 p.m. (Department of State, Central Files, DEF 18-4), whose words "If your analysis is correct that the Soviet Union is seeking in the test ban treaty to obtain leverage on Peking" are those Chang quotes from the cable he cites at 246 n.37a. Read, audit of Chang run 2, Nov. 21, 2026.'
