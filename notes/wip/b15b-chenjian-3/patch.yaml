  - cite:
      id: cal.1967-07-18.china-leadership
      item: '[[w.jian-zhou-enlai]], 576 (after Zhou flies back that evening, Mao, delighted, tells his associates that after the Cultural Revolution ends "next spring" the Ninth Congress will meet, and the purged "veteran comrades," He Long and Deng Xiaoping among them, be reelected to the Central Committee)'
  - cite:
      id: cal.1967-07-19.china-leadership-4
      item: '[[w.jian-zhou-enlai]], 576 (Chen Zaidao and Zhong Hanhua go with Xie Fuzhi and Wang Li to the conference of commanders above the division level and make self-criticism; Wang''s long speech calls the One Million Heroes a "conservative organization" with "directional mistakes")'
  - to-check:
      id: cal.1967-07-19.china-leadership-4
      add: Xie Fuzhi and Wang Li's instruction at a conference of officers of the Wuhan Military Command above division level, July 19, 1967, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 576 n.45a); Xie Fuzhi and Wang Li's speech at the Wuhan Water Works and Electricity College, July 19, 1967, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 576 n.45b).
  - src:
      id: cal.1967-07-19.china-leadership-4
      rows:
        - 'via x.1967-07-19.xie-fuzhi-wang-li-instruction-wuhan-officers-above-division: ?'
        - 'via x.1967-07-19.xie-fuzhi-wang-li-speech-wuhan-water-works-electricity-college: ?'
  - cite:
      id: cal.1967-07-20.china-leadership
      item: '[[w.jian-zhou-enlai]], 576 (members of the One Million Heroes and many officers and soldiers backing them surround and break into the East Lake Guest House, search room by room for Wang Li and drag him off to denounce and torture him; Mao, in a nearby room, "frightened"; Lin Biao and Jiang Qing, told by Zhou, write Mao to leave Wuhan at once)'
  - cite:
      id: cal.1967-07-20.china-leadership-2
      item: '[[w.jian-zhou-enlai]], 576 (Zhou, shocked that Mao "was almost attacked," reports at once to Lin Biao and Jiang Qing; he flies back to Wuhan on the afternoon of July 20 and arranges Mao''s evacuation)'
  - to-check:
      id: cal.1967-07-20.china-leadership-2
      add: '[[w.zhou-enlai-nianpu-1949]], III, 171 (cited by [[w.jian-zhou-enlai]], 576 n.48b).'
  - place:
