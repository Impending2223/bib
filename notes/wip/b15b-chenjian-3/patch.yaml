      basis: n
      note: 'Chen Jian, 576: Zhou flies back to Wuhan; the entry''s meeting at Lin Biao''s in Peking first'
  - cite:
      id: cal.1967-07-21.china-leadership
      item: '[[w.jian-zhou-enlai]], 576 (early the next morning Mao hurriedly leaves Wuhan, flying to Shanghai from a military airport dozens of miles away; he stays at Shanghai until mid-September)'
