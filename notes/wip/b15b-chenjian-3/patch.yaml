      item: '[[w.jian-zhou-enlai]], 577 (Shanghai''s mainstream "revolutionary organizations," backed by Zhang Chunqiao and Yao Wenyuan, send hundreds of thousands of workers against the United Headquarters; by the day''s end it surrenders, and the citywide alliance behind it collapses)'
