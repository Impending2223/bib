      item: '[[w.jian-zhou-enlai]], 578 (Wang Li''s speech at the ministry backs Qi''s views as Yao conveyed them and the rebels'' "seizure of power," their attacks on Chen Yi included; Zhou, greatly offended, does not act at once)'
