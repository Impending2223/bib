      item: '[[w.jian-zhou-enlai]], 582–583 (Yang flies back to Shanghai and at nine in the morning conveys Zhou''s report; at 9:00 a.m. on Aug. 26 Mao summons him: Wang Li, Guan Feng and Qi Benyu "not good people," Wang and Guan to be arrested at once, Qi on probation; Yang to fly back and report to Zhou directly; the time is the first day''s)'
