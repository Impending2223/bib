patch: '2026-11-14-b16-lskc-1'
by: 'Claude (batch 16, reader 4: Lịch sử kháng chiến chống Mỹ, cứu nước, vols. I–III, 1960 to July 1965), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1960-04.vietnam-hanoi
      when: Apr.
      date: '1960-04'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh signs the decree promulgating the Military Service Law, passed by the National Assembly Dec. 31, 1959: conscription in place of voluntary enlistment, after trials from early 1958 in Vĩnh Phúc, Phú Thọ, Nghệ An, Hải Dương and Sơn La.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 182–83. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1960-05.vietnam-hanoi
      when: May
      date: '1960-05'
      thread: vietnam-hanoi
      c: Elections to the Second National Assembly across the North. More deputies of the workers and of the minorities than in the First; the South's deputies kept in their seats.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 159–60.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-07-15.vietnam-hanoi
      when: July 15
      date: '1960-07-15'
      thread: vietnam-hanoi
      c: Hanoi. The Second National Assembly's first session closes (July 7–15). Hồ Chí Minh President, Tôn Đức Thắng Vice President, Trường Chinh chairman of the Standing Committee, Phạm Văn Đồng Premier; a National Defense Council elected. Laws on the organization of the Assembly, the Council of Government, the Supreme People's Procuracy and the Supreme People's Court.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 160; 152 (the law on the Council of Government). Check: the history gives the session, not the day of the elections within it. Names: Hồ Chí Minh, Tôn Đức Thắng, Trường Chinh, Phạm Văn Đồng.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - name:ton-duc-thang
      - name:truong-chinh
      - name:pham-van-dong
- add:
    entry:
      id: cal.1960-10-20.vietnam-hanoi
      when: Oct. 20–23
      date: '1960-10-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Kon Tum. Interzone V''s sappers with the province''s forces take the posts at Măng Đen and Măng Bút, the nights of Oct. 20–23, and ambush the relief on Route 5: seven military vehicles and a company destroyed. Oct. 20, a platoon of the provincial military school and five of the zone''s sappers take Đắk Tả, a Civil Guard company''s post in Đắk Lây district; 45 killed.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 375–76.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-01.vietnam-hanoi
      when: Jan.
      date: '1961-01'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The General Military Commission''s directive setting up the South Vietnam Liberation Army, "a part of the Vietnam People''s Army": main forces, local troops, militia and guerrillas, the concentrated units first.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 36–37 (the directive, from the Institute of Military History''s archive). Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-01.vietnam-hanoi-2
      when: Jan.
      date: '1961-01'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Committee decides to set up the Central Office for South Vietnam (COSVN), a part of the Central Committee, the Politburo directing it for the Committee, to lead all the Party's work in the South. Nguyễn Văn Linh, the Nam Bộ secretary, its secretary; Trần Lương (Trần Nam Trung), Phan Văn Đáng, Nguyễn Văn Xô, Võ Chí Công, Võ Văn Kiệt, Phạm Thái Bường and Trần Văn Quang members.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 37–38. Made public: 2013. See [[cal.1961-01-24.vietnam-hanoi]]. Names: Nguyễn Văn Linh, Trần Lương, Phan Văn Đáng, Nguyễn Văn Xô, Võ Chí Công, Võ Văn Kiệt, Phạm Thái Bường, Trần Văn Quang.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-02.vietnam-hanoi-2
      when: Feb.
      date: '1961-02'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Politburo directs the coastal provinces of Nam Bộ to send boats north for arms. Bến Tre, Cà Mau, Trà Vinh and Bà Rịa send six motor junks, their crews as fishermen; four reach the North, one Macao, one Hainan.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 145–46. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-02-15.vietnam-hanoi
      when: Feb. 15
      date: '1961-02-15'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: War Zone D. The South's armed forces unified as the South Vietnam Liberation Army, its first parade. Trần Văn Quang over its military work, Trần Lương its political. About the same time Nam Bộ divided into four military regions (Eastern, Central, Western Nam Bộ, Saigon–Gia Định), Nguyễn Hữu Xuyến, Lê Quốc Sản, Cao Hoài Phô and Trần Hải Phụng their commanders.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 36 n.4, 43. Names: Trần Văn Quang, Trần Lương, Nguyễn Hữu Xuyến, Lê Quốc Sản, Cao Hoài Phô, Trần Hải Phụng.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-03-03.vietnam-hanoi
      when: Mar. 3
      date: '1961-03-03'
      thread: vietnam-hanoi
      c: Hồ Chí Minh's decree no. 09/SL names Lt. Gen. Song Hào head of the People's Army's General Political Department.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 40. Names: Hồ Chí Minh, Song Hào.'
      tags:
      - polity:drv
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1961-03-23.vietnam-hanoi
      when: Mar. 23
      date: '1961-03-23'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Military Commission''s standing members on support for the South. Men: cadres and staff, units as cadre frames or whole, to build its forces. Materiel: weapons first, then medicine. Routes: by land in three directions (inside Vietnam, along the Lao border, deep into Laos), by air (drops, and Laos''s Xê Pôn airfield), by sea. Soviet and Chinese aid and captured arms, their markings removed; all in strict secrecy.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 40–42 (from the Central Military Commission''s file 259, the Defense Ministry''s archive). Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-04-20.vietnam-hanoi
      when: Apr. 20
      date: '1961-04-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Lê Duẩn to "Mười Cúc" (Nguyễn Văn Linh) and the Nam Bộ Committee: the first years a rising of the masses that took the villages; the enemy''s army almost intact, the war to widen; armed struggle from now on more and more decisive. Main forces of zone and region to be built, with local troops and guerrillas.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 35–36. Made public: Lê Duẩn, *Thư vào Nam* (1985), by the history''s note (III, 35 n.3). See [[cal.1961-02-07.vietnam-hanoi]]. Names: Lê Duẩn, Nguyễn Văn Linh.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
- add:
    entry:
      id: cal.1961-04.vietnam-hanoi-3
      when: Apr., late
      date: '1961-04'
      thread: vietnam-hanoi
      also:
      - laos
      c: 'The People''s Army with the Pathet Lao opens the Central Laos campaign along Route 9: Cha Ky, Ban Dong, Xê Pôn and Muong Phine taken, the base in central and southern Laos widened; the Lao Party agrees to the strategic supply road''s moving west of the Trường Sơn. Before it, Campaign 128, Military Region 4''s battalions with the Pathet Lao along Route 12 to Nadu and Nhommarath.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 129. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-05-05.vietnam-hanoi
      when: May 5
      date: '1961-05-05'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Xuân Mai. The first large group of military cadres for the South, 500, mostly middle and senior officers under Maj. Gen. Trần Văn Quang, sets out by the western Trường Sơn route for the far south of Trung Bộ and Nam Bộ: the "Phương Đông" group, after the Soviet spaceship. It reaches Hill 300 in Bình Long July 28.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 42–43. Made public: 2013. Names: Trần Văn Quang.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-06-01.vietnam-hanoi-2
      when: June 1
      date: '1961-06-01'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The second group of military cadres for the South, 400, under Nguyễn Hoàng Lâm (Nguyễn Văn Bứa) and Lê Quốc Sản, sets out; it arrives early in September.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 43. Made public: 2013. See [[cal.1961-05-05.vietnam-hanoi]]. Names: Nguyễn Hoàng Lâm, Lê Quốc Sản.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-06-12.vietnam-hanoi
      when: June 12
      date: '1961-06-12'
      thread: vietnam-hanoi
      c: 'The Central Military Commission opens an army-wide campaign to build the army "fast, strong and steady" toward a regular, modern force, after the "Three Bests" emulation: fighting will, class stand, technique; discipline and regulations; production and thrift, against graft and waste; security.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 89.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-07-27.vietnam-hanoi
      when: July 27
      date: '1961-07-27'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The commands of Military Regions 5 and 6 set up, Interzone V divided. Region 5, Quảng Trị to Phú Yên with Kon Tum and Gia Lai, under the Central Committee: Võ Chí Công Party secretary, Nguyễn Đôn commander and political commissar. Region 6, Khánh Hòa to Bình Thuận with the southern Highlands, under COSVN: Trần Lê secretary, Y Blok acting commander.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 43–44 (the dates after *50 năm Quân đội nhân dân Việt Nam: Biên niên sự kiện* (1995), 169, 173). Made public: 2013. Names: Võ Chí Công, Nguyễn Đôn, Trần Lê, Y Blok.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1961-07.vietnam-hanoi-4
      when: July
      date: '1961-07'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN sets up the Region''s first main-force regiment, code name Q761: two infantry battalions, support units, staff, political and supply offices; Tăng Kim Thiên (Hoàng Đình Chương) commander, Lê Văn Nhỏ political commissar. Its battalions had paraded Feb. 9 at Dương Minh Châu, Tây Ninh; the regiment, full strength, parades as the First Infantry Regiment Feb. 9, 1962.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 47. Made public: 2013. Names: Tăng Kim Thiên, Lê Văn Nhỏ.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-06.vietnam-hanoi
      when: June
      date: '1962-06'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Military Commission to the South''s armed forces: the central task for now to step up military action with the political struggle, keep and grow the forces, break the strategic hamlets. COSVN sends its members down to the provinces.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 176. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-08.vietnam-hanoi
      when: Aug.
      date: '1962-08'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s resolution on breaking the strategic hamlets: a rising of the masses inside them, the Party built among the people there, the forces inside first with those outside; the control apparatus broken with the fences, against their rebuilding, from loosening to the posts'' destruction and the villages'' full liberation.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 195. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-08-03.vietnam-hanoi
      when: Aug. 3
      date: '1962-08-03'
      thread: vietnam-hanoi
      also:
      - soviet-union
      c: The Soviet Afro-Asian Solidarity Committee and the National Liberation Front sign a joint statement condemning the American aggression and backing the South's struggle.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 97.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1962-09-06.vietnam-hanoi
      when: Sept. 6
      date: '1962-09-06'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Gen. Võ Nguyên Giáp, commander in chief, cables Military Region 5 and Nam Bộ, after the fight at Nà Niêu, western Quảng Ngãi, in August (twelve helicopters by its count): the lessons to be spread to the local forces, to defeat the enemy''s helicopter and armored tactics.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 180–82 (cable no. 68/6, the Defense Ministry to Military Region 5 and Nam Bộ, Sept. 6, 1962, 182 n.1). Made public: 2013. Names: Võ Nguyên Giáp.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:vo-nguyen-giap
- add:
    entry:
      id: cal.1962-10-11.vietnam-hanoi-2
      when: Oct. 11–16
      date: '1962-10-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The first arms ship by sea for the South, the wooden *Phương Đông 1*, thirty tons, under Lê Văn Một and Bông Văn Dĩa, leaves Đồ Sơn, Hải Phòng, Oct. 11; it lands at Vàm Lũng, Cà Mau, Oct. 16.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 204–05. Made public: 2013. Names: Lê Văn Một, Bông Văn Dĩa.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1962-11.vietnam-hanoi
      when: Nov.
      date: '1962-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN and the Region''s Military Command hold the first guerrilla conference of all Nam Bộ, at the Dương Minh Châu base: the districts and villages strong in guerrilla war report; Út Tịch and Tạ Thị Kiều among those praised.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 199. Made public: 2013. Names: Út Tịch, Tạ Thị Kiều.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1963-02-10.vietnam-hanoi
      when: Feb. 10
      date: '1963-02-10'
      thread: vietnam-hanoi
      also:
      - soviet-union
      - china
      c: 'The Politburo''s statement: the fraternal parties asked to stop attacking one another in the press and on the radio, and to meet to settle their differences.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 98.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1963-05-14.vietnam-hanoi-2
      when: May 14
      date: '1963-05-14'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The National Liberation Front''s statement on the shooting of unarmed demonstrators at Huế May 8: a crime against the people and the Buddhists, exposing the Diệm government''s claim to respect freedom of belief.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 311.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1963-08.vietnam-hanoi
      when: Aug.
      date: '1963-08'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Military Commission and the Defense Ministry hand transport by sea to the South to the navy.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 206 (in October the General Staff meets the Naval Department and Group 759 to carry it out). Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1963-10.vietnam-hanoi-4
      when: Oct.
      date: '1963-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo and the Central Military Commission set up the Region''s Military Party Committee and Military Command: Nguyễn Văn Linh, COSVN''s secretary, secretary of the committee; Lt. Gen. Trần Văn Trà, deputy chief of the General Staff, sent south as commander.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 243, 343. Made public: 2013. Names: Nguyễn Văn Linh, Trần Văn Trà.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:tran-van-tra
- add:
    entry:
      id: cal.1964-01.vietnam-hanoi-2
      when: Jan.
      date: '1964-01'
      thread: vietnam-hanoi
      c: 'The General Staff, for the government, holds the people''s air defense conference of the whole North: ministries, provinces, military regions and services. People''s air defense organized everywhere after it; patrols on the coast, at the demarcation line and along the western border stepped up.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 338–39.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-01.vietnam-hanoi-3
      when: Jan.
      date: '1964-01'
      thread: vietnam-hanoi
      c: The Defense Ministry sets up the Navy Command; the navy a service of the army.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 111, 207. See [[cal.1964-01-09.vietnam-hanoi]].'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-01-29.vietnam-hanoi
      when: Jan. 29
      date: '1964-01-29'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Defense Ministry renames Group 759, the sea transport group, Group 125, of regimental rank, under the new Navy Command.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 207. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-03.vietnam-hanoi-2
      when: Mar.
      date: '1964-03'
      thread: vietnam-hanoi
      c: The Defense Ministry puts every unit of the army on its wartime establishment, the standing army to 300,000 in 1964. The Air Defense–Air Force and some naval units from peace to war readiness.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 134. Made public: 2013. See [[cal.1963-12.vietnam]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-04-26.vietnam-hanoi
      when: Apr. 26
      date: '1964-04-26'
      thread: vietnam-hanoi
      c: The General Staff orders the air defense forces to combat readiness.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 339 (the order extended to all the North''s armed forces June 1). Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-05-01.vietnam-hanoi
      when: May 1
      date: '1964-05-01'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Highlands front, code name B3, set up, with the 101st and 320th Regiments from the North: Col. Nguyễn Chánh, deputy commander of Region 5, its commander; Col. Đoàn Khuê, Region 5''s deputy political commissar, its political commissar.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 343–44. Made public: 2013. Names: Nguyễn Chánh, Đoàn Khuê.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-06.vietnam-hanoi-2
      when: June
      date: '1964-06'
      thread: vietnam-hanoi
      c: 'The Politburo''s directive to raise combat readiness and defeat the enemy air force''s provocations and attacks on the North: beaten in the South and in Laos, the Americans will sooner or later strike the North by sea and air; active fighting with protective measures, the air defense forces at the core.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 339–40. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1964-10-11.vietnam-hanoi
      when: Oct. 11
      date: '1964-10-11'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Military Commission and the High Command direct the fronts to open a campaign across the South: part of the Saigon army''s main forces destroyed, the strategic hamlets broken, the liberated zone widened, the political struggle pressed. Nam Bộ and Region 5 plan the autumn–winter campaign, to beat the Saigon army before American expeditionary troops come.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 375. Made public: 2013. See [[cal.1964-09.vietnam]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-04-27.vietnam-hanoi
      when: Apr. 27
      date: '1965-04-27'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Military Commission and the High Command, after the eleventh plenum, direct the fronts in the South: the main forces'' fighting stepped up, campaigns on several fronts at once with risings of the masses, to hasten the Saigon army''s and government''s collapse and be ready to beat a "local war" should the Americans widen it.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 416–17. Made public: 2013. See [[cal.1965-03-28.vietnam]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1965-07-22.vietnam-hanoi
      when: July 22
      date: '1965-07-22'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Đồng Xoài campaign, opened May 10–11 at Phước Long, ends. By the Region's count four battalions and 24 companies put out of action, 4,459 men, 73 American advisers among them; 1,652 weapons taken, 60 military vehicles and 34 aircraft destroyed. In Phước Long province 56,000 of 67,000 people won from the strategic hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 416–36. See [[cal.1965-05-11.vietnam-operations]], [[cal.1965-06-09.vietnam-operations]].'
      tags:
      - polity:drv
