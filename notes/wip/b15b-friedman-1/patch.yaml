      c: 'Conakry. Liu Ningyi 刘宁一 and Liao Chengzhi 廖承志 to Zhou Enlai 周恩来, Chen Yi 陈毅, the Liaison Department and the Chinese Peace Committee, from the conference, to open Apr. 11: the delegation, there early, meets as many delegations as it can; the Algerian FLN''s delegation tells them "only China truly supports and aids the Algerian people''s liberation struggle."'
      n: '[[w.friedman-shadow-cold-war]], 46. Made public: 2015. To check: Liu Dingyi and Liao Chengzhi to Zhou Enlai, Chen Yi, Liaison Department, Chinese Peace Committee, report from Second AAPSO Conference, April 10, 1960, CFMA doc. 108-0010601, 43 (cited by [[w.friedman-shadow-cold-war]], 46 n.77). Names: Zhou Enlai, Chen Yi.'
      src:
        c: 7bda6c54
        rows:
        - 'w.friedman-shadow-cold-war 46: all'
        - 'via x.1960-04-10.liu-dingyi-liao-chengzhi-zhou-enlai-chen: ?'
      tags:
      - polity:prc
      - polity:algeria
      - vis:only:prc
      - name:zhou-enlai
      - name:chen-yi
- cite:
    id: cal.1960-04-11.china
    item: '[[w.friedman-shadow-cold-war]], 46 (the conference from Apr. 11; the Egyptian delegation led by Anwar Sadat, the Indian by Nehru''s wife, Lumumba, Kasavubu, Tom Mboya and Oginga Odinga among the Africans; no endorsement of peace and disarmament; support of the Algerian armed struggle; resolutions to Chinese specifications; the Soviets, opposed by African delegations, ask the Chinese for help; Liu Ningyi''s report: with colonialism "there is no peaceful coexistence")'
