      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-10.china-leadership-7
      when: Mar. 10
      date: '1960-03-10'
      place: cairo
      thread: china-leadership
      also:
      - africa
      c: 'Zhu Ziqi, China''s new representative at the Afro-Asian solidarity secretariat in Cairo, to the Chinese Peace Committee: the Chinese fight the Indian and Egyptian push to invite South Vietnam and South Korea, and have Yusuf al-Sibai, the secretary general, add "anticolonialism" and "anti-imperialism" to the secretariat''s slogans of "independence, equality, and peace"; the delegation to make connections and invite Africans to China.'
      n: '[[w.friedman-shadow-cold-war]], 45, 47. Made public: 2015. To check: Zhu Ziqi to Chinese Peace Committee, March 10, 1960, CFMA doc. 108-0010601, 8 (cited by [[w.friedman-shadow-cold-war]], 45 n.71); Zhu Ziqi to Chinese Peace Committee, March 10, 1960, CFMA doc. 108-0010601, 8 (cited by [[w.friedman-shadow-cold-war]], 47 n.82).'
      src:
        c: 4840a877
        rows:
        - 'w.friedman-shadow-cold-war 45, 47: all'
        - 'via x.1960-03-10.zhu-ziqi-chinese-peace-committee-march-10: ?'
      tags:
      - polity:prc
      - polity:uar
      - vis:only:prc
- add:
