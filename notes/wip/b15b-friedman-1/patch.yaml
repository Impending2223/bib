      c: 'Conakry. Sékou Touré, President of Guinea, to the Chinese Afro-Asian Solidarity Committee''s delegation: many in the ruling party grew up in the French Communist Party and believe in Marxist principles; he is building a "People''s Democracy," which he cannot proclaim publicly.'
      n: '[[w.friedman-shadow-cold-war]], 47. Made public: 2015. To check: Conversation of Sekou Touré with Chinese Afro-Asian Solidarity Committee delegation, April 18, 1960, CFMA doc. 108-00106-03, 3 (cited by [[w.friedman-shadow-cold-war]], 47 n.83). Names: Touré.'
