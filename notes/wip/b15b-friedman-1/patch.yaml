    item: '[[w.friedman-shadow-cold-war]], 47–48 (the People''s Friendship University created in February 1960, later named for Lumumba; its council the Soviet Afro-Asian Solidarity Committee, with the dominant say on admissions, and the All-Union Central Council of Trade Unions; 550 students from developing countries enrolled in its first year, of some 2,671 in the USSR by spring 1961)'
