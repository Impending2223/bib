- add:
    entry:
      id: cal.1964-02-14.soviet-union-leadership
      when: Feb. 14
      date: '1964-02-14'
      place: moscow
      thread: soviet-union-leadership
      also:
      - china
      c: 'The CPSU Central Committee''s plenum. Suslov''s speech against the Chinese: "contemporary Trotskyites," like the old Socialist Revolutionaries and the "Workers'' Opposition" of 1921; they would de-center the working class and know only armed struggle; they make the national liberation movements the area "where supposedly the fate of humanity is being decided," and play on mistrust of Europeans, "igniting nationalist and even racial prejudices." Khrushchev interrupts to list the arms given Indonesia in the West Irian crisis and those now given covertly for Egypt in Yemen: "we are the true, so to speak, Christians"; left out of the versions sent abroad.'
      n: '[[w.friedman-shadow-cold-war]], 106–107. Made public: 2015. To check: Speech of Mikhail Suslov at Communist Party plenum, February 14, 1964, RGANI f.2 o.1 d.720, 116, 126–27 (cited by [[w.friedman-shadow-cold-war]], 107 n.22); Khrushchev could not bear to let the Chinese charges of Soviet failure to support armed struggle go unchallenged, even when they came out of the mouth of Suslov. He interrupted Suslov’s speech to list the types of weapons the Soviets had provided to Indonesia during the course of the West Irian crisis as well as the arms they were currently providing covertly in support of the Egyptian effort in Yemen, declaring curiously, “You see, we are the true, so to speak, Christians, who observe the commandments of Christ.” Needless to say, this part was not included in the versions of Suslov’s speech that were exported. Ibid., 67–69 (cited by [[w.friedman-shadow-cold-war]], 107 n.23); Khrushchev could not bear to let the Chinese charges of Soviet failure to support armed struggle go unchallenged, even when they came out of the mouth of Suslov. He interrupted Suslov’s speech to list the types of weapons the Soviets had provided to Indonesia during the course of the West Irian crisis as well as the arms they were currently providing covertly in support of the Egyptian effort in Yemen, declaring curiously, “You see, we are the true, so to speak, Christians, who observe the commandments of Christ.” Needless to say, this part was not included in the versions of Suslov’s speech that were exported. Ibid., 18 (cited by [[w.friedman-shadow-cold-war]], 107 n.24); Khrushchev could not bear to let the Chinese charges of Soviet failure to support armed struggle go unchallenged, even when they came out of the mouth of Suslov. He interrupted Suslov’s speech to list the types of weapons the Soviets had provided to Indonesia during the course of the West Irian crisis as well as the arms they were currently providing covertly in support of the Egyptian effort in Yemen, declaring curiously, “You see, we are the true, so to speak, Christians, who observe the commandments of Christ.” Needless to say, this part was not included in the versions of Suslov’s speech that were exported. Ibid., 57 (cited by [[w.friedman-shadow-cold-war]], 107 n.25); Khrushchev could not bear to let the Chinese charges of Soviet failure to support armed struggle go unchallenged, even when they came out of the mouth of Suslov. He interrupted Suslov’s speech to list the types of weapons the Soviets had provided to Indonesia during the course of the West Irian crisis as well as the arms they were currently providing covertly in support of the Egyptian effort in Yemen, declaring curiously, “You see, we are the true, so to speak, Christians, who observe the commandments of Christ.” Needless to say, this part was not included in the versions of Suslov’s speech that were exported. Ibid., 63 (cited by [[w.friedman-shadow-cold-war]], 107 n.26). Names: Suslov, Khrushchev.'
