      n: '[[w.friedman-shadow-cold-war]], 55. Made public: 2015. To check: SCSCAA Presidium Session, April 25, 1960, GARF f.9540 o.1 d.60, 117 (cited by [[w.friedman-shadow-cold-war]], 55 n.118).'
