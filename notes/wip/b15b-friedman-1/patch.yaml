      - soviet-union
      c: 'Zhu Ziqi to the Chinese Peace Committee: the Soviet addition "directly waters down and shifts the anti-imperialist struggle"; for months the Soviets have given up anti-imperialism for disarmament.'
      n: '[[w.friedman-shadow-cold-war]], 45–46. Made public: 2015. To check: Zhu Ziqi to Chinese Peace Committee, March 24, 1960, CFMA doc. 108-0010601, 20 (cited by [[w.friedman-shadow-cold-war]], 45 n.75).'
