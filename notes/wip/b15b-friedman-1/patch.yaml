      when: Feb.
      date: 1963-02
      place: moshi
      thread: africa
      also:
      - china
      - soviet-union
      - south-asia
      - cuba
      - latin-america
      c: 'Moshi, Tanganyika. The third Afro-Asian People''s Solidarity conference. The Chinese to the Soviet delegation: "Why did you come? There is nothing for you to do here." India presses for a stand on the border conflict; the Chinese refuse any resolution; India leaves; under Tanganyikan pressure the Chinese accept a mild "recommendation" after the chairman reprimands India. On the tricontinental conference Castro''s Ambassador to Mali brings an invitation to Havana, backed by the Chinese; the Soviets fly in uninvited Latin American Communists for Brazil under the World Peace Council, and send the Brazilian delegate to threaten the Cuban, José Carrillo. The conference backs Havana; the Latin Americans kept out of the small committees.'
