      c: 'Cairo, the Afro-Asian solidarity secretariat. The Soviets put forward a two-page addition to al-Sibai''s speech for the conference, on peaceful coexistence and disarmament, with other Soviet issues: what the peoples of Africa and Asia care about most. They ask the Chinese to support it; Zhu Ziqi agrees.'
      n: '[[w.friedman-shadow-cold-war]], 45. Made public: 2015. To check: Zhu Ziqi to Chinese Peace Committee, March 24, 1960, CFMA doc. 108-0010601, 20 (cited by [[w.friedman-shadow-cold-war]], 45 n.75).'
      src:
        c: 2da71b94
        rows:
