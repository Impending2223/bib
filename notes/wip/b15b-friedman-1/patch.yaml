      c: The Chinese Peace Committee to the Central Committee, its report on the Conakry conference. The Soviets now the main opponent; toward India and Egypt a policy of "yida yila," attack and attract. Strengthen work in Africa, widen exchanges, support the nationalist movements "using great force," publicize Mao Zedong thought.
      n: '[[w.friedman-shadow-cold-war]], 46. Made public: 2015. To check: Chinese Peace Committee to CC CCP, report on Second AAPSO Conference, June 22, 1960, CFMA doc. 108-0010601, 57 (cited by [[w.friedman-shadow-cold-war]], 46 n.76); Chinese Peace Committee to CC CCP, report on Second AAPSO Conference, June 22, 1960, CFMA doc. 108-0010601, 59 (cited by [[w.friedman-shadow-cold-war]], 46 n.81).'
