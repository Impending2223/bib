      id: cal.1960-08.china-leadership-17
      when: Aug.
      date: 1960-08
      thread: china-leadership
      also:
      - africa
      c: 'Deng Xiaoping 邓小平, by top-secret letter to the Central Committee, on Africans asking to come to China to study the revolution: the new states want expertise and are "ideologically and politically immature." Take those who want to come, warmly; teach them Mao Zedong 毛泽东''s thought and China''s revolutionary experience, the widest class coalition, a long and perhaps violent struggle; a select few to be taught Marxist theory in depth, as nuclei of Marxist parties; the training by the trade unions, the youth and women''s organizations, six months at most.'
      n: '[[w.friedman-shadow-cold-war]], 50. Made public: 2015. To check: Liaison Department, distributing “Report to CC on Black African Personnel Coming to China to Study Revolutionary Experience,” October 6, 1960, CFMA doc. 108-00223-06, 2 (cited by [[w.friedman-shadow-cold-war]], 50 n.95); Liaison Department, distributing “Report to CC on Black African Personnel Coming to China to Study Revolutionary Experience,” October 6, 1960, CFMA doc. 108-00223-06, 1–3 (cited by [[w.friedman-shadow-cold-war]], 50 n.96). Names: Deng Xiaoping.'
