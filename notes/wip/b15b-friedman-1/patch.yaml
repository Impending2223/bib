      c: 'The cultural office of the Chinese Embassy at Moscow to the Foreign Ministry, on the Soviet interest in Africa: the Soviet-African friendship society, the Institute of Africa, the journal *Problemy Vostokovedeniia*. A conversation with the deputy head of the Soviet State Committee on Cultural Ties: he stresses Soviet daily life, socialist construction and peaceful coexistence, nothing of Africans rising against imperialism, "a reflection of the Soviet Union''s entire policy."'
