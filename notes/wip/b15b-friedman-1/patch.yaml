      - south-asia
      c: 'Zhu Ziqi to the Chinese Peace Committee, on al-Sibai''s draft speech for the conference, point by point: put out in the UAR''s name, written mainly by India, "the Soviet comrades" advising on some questions; India and Egypt, having failed to make neutrality the movement''s policy, push opposition to blocs and nonalignment, "under the cover of anti-imperialism engage in anti-socialism."'
      n: '[[w.friedman-shadow-cold-war]], 45. Made public: 2015. To check: Zhu Ziqi to Chinese Peace Committee, March 23, 1960, CFMA doc. 108-0010601, 15 (cited by [[w.friedman-shadow-cold-war]], 45 n.72); Embassy Cairo to Chinese Peace Committee and Politburo CC CCP, report on preparatory work for Second AAPSO Conference, March 6, 1960, CFMA doc. 108-0010601, 4 (cited by [[w.friedman-shadow-cold-war]], 45 n.74a); Zhu Ziqi to Chinese Peace Committee, March 23, 1960, CFMA doc. 108-0010601, 15 (cited by [[w.friedman-shadow-cold-war]], 45 n.74b).'
      src:
        c: 662489a4
        rows:
        - 'w.friedman-shadow-cold-war 45: all'
        - 'via x.1960-03-23.zhu-ziqi-chinese-peace-committee-march-23: ?'
