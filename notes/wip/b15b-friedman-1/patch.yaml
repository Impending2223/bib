      date: '1962-01-08'
      thread: soviet-union
      also:
      - africa
      c: 'The presidium of the Soviet Afro-Asian Solidarity Committee. Safronov reports on the solidarity organization''s executive committee at Gaza: an angry Algerian delegation, "somebody is confusing them about our position"; the Chinese and their allies call the World Peace Council "not an anticolonial, anti-imperialist organization"; even African students in the USSR think Soviet disarmament means disarming the movements in Algeria and Angola. Members: Chinese propaganda floods Africa, Mao''s works found even in Conakry; incidents of racial intolerance against African students as common in Moscow or Tashkent as in Georgia; calls again for *Aziia i Afrika Segodnia* in English and French.'
