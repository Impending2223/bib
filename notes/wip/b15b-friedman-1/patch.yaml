    item: '[[w.friedman-shadow-cold-war]], 111–112 (Khrushchev''s first trip to Africa, May 1964, for the first stage of the Aswan High Dam, announced just after Zhou Enlai''s African tour and the Jakarta meeting that left the USSR out: a new loan of 252 million rubles (about $300 million); talks with Ben Bella, come from Algeria; Nasser to build "socialism"; Khrushchev calls the UAR a "democratic socialist country," Nasser "comrade," and makes him a Hero of the Soviet Union; *Izvestiia*: the reception makes the Chinese leaders look "pathetic")'
