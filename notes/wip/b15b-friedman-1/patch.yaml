- add:
    entry:
      id: cal.1960-01-08.soviet-union-3
      when: Jan. 8
      date: '1960-01-08'
      thread: soviet-union
      also:
      - africa
      c: 'The presidium of the Soviet Committee of Solidarity with the Countries of Asia and Africa, preparing for the Conakry conference. E. M. Zhukov: not everyone abroad sees what the easing of tension means for the struggle of Asia and Africa; some think détente disrupts solidarity. Vice chairman Anatoly Safronov: Africans ask for every kind of aid, arms too; "we cannot help with any arms."'
      n: '[[w.friedman-shadow-cold-war]], 44. Made public: 2015. To check: Stenogram of Session of Presidium of Soviet Committee of Solidarity with the Countries of Asia and Africa (SKSSAA), January 8, 1960, State Archive of the Russian Federation (GARF) f.9540 o.1 d.60, 35 (cited by [[w.friedman-shadow-cold-war]], 44 n.69); Stenogram of Session of Presidium of Soviet Committee of Solidarity with the Countries of Asia and Africa (SKSSAA), January 8, 1960, State Archive of the Russian Federation (GARF) f.9540 o.1 d.60, 39 (cited by [[w.friedman-shadow-cold-war]], 44 n.70).'
      src:
