      c: Tunis. The second All-African People's Conference, successor to the Accra meeting of a year before. No word of peace or disarmament in its resolutions; it endorses the armed struggle in Algeria.
      n: '[[w.friedman-shadow-cold-war]], 44. To check: Report from Zhu Ziqi, Chinese representative at AAPSO secretariat in Cairo to Chinese Peace Committee, March 24, 1960, CFMA doc. 108-00106-01, 21 (cited by [[w.friedman-shadow-cold-war]], 44 n.68a); [[w.documents-on-international-affairs-1964]] (cited by [[w.friedman-shadow-cold-war]], 44 n.68b).'
      src:
