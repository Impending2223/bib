      when: Dec. 31
      date: '1960-12-31'
      thread: china-leadership
      c: 'Kunming. Zhou Enlai, on the way to Burma, by telephone with Chen Yun and others in Peking: the grain to be imported raised from 1.5 to 2.5 million tons.'
      n: '[[w.jian-zhou-enlai]], 457. Made public: 1987. To check: [[w.chen-yun-nianpu-1905]], III, 55 (cited by [[w.jian-zhou-enlai]], 457 n.66); [[w.bujinde-sinian]], 254 (Lei Renmin, "Recalling the Premier''s Care and Instruction of Foreign Trade Work") (cited by [[w.jian-zhou-enlai]], 457 n.66). See [[cal.1960-12-30.china-leadership-2]]. Names: Zhou Enlai, Chen Yun. Check: the day: [[w.jian-zhou-enlai]], 457, has the call "a few hours" after the airport meeting of Dec. 30; the Zhou chronology has Zhou at Wuhan that day and at Kunming on Dec. 31 ([[cal.1960-12-31.china-leadership-2]]).'
