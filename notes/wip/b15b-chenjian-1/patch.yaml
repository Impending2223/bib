      when: Apr. 12
      date: '1960-04-12'
      thread: china-leadership
      c: 'A document of the Center on grain: some fifty days remain before the new grain reaches the market, the crucial time for procuring, shipping and selling grain while securing the people''s livelihood.'
      n: '[[w.jian-zhou-enlai]], 454 (the document of Apr. 12). Made public: 2011. To check: [[w.weizhen-li-xiannian-nianpu]], III, 226 (cited by [[w.jian-zhou-enlai]], 454 n.46).'
