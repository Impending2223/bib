      c: Zhou Enlai has photographs taken of Chiang Kai-shek's family houses at Fenghua, his ancestors' tombs among them, and sent to Chiang by indirect channels. On the back of one he writes that the Chiang family tombs are intact, the flowers and grass as before.
      n: '[[w.jian-zhou-enlai]], 460–461. Made public: 1994. To check: [[w.xinwen-zhou-enlai-and-the]], 35 (cited by [[w.jian-zhou-enlai]], 461 n.80). Names: Zhou Enlai, Chiang Kai-shek.'
