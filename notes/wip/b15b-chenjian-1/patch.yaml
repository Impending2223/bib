    set:
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("随后", after Mao''s meetings); [[w.jian-zhou-enlai]], 482 (at midnight, after Mao''s note of Nov. 18; Zhou alone: he agrees with Radhakrishnan, talks to resume at once; "I have been to New Delhi four times. I am willing to go there a fifth time"; Banerjee to report to Nehru at once). [[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 19, 1962: Zhou Enlai and Chen Yi receive Banerjee, India''s chargé d''affaires: for all the strain the two countries should stay friends and look far and deep; China has confidence and will not lose a thread of hope; he has been to Delhi four times and will go a fifth); [[w.zhou-enlai-waijiao-huodong]], 341 (Nov. 19, 1962; 晚8时, 中南海西花厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 255 (Nov. 19, 1962; Zhou and Chen Yi receive the Indian embassy''s chargé d''affaires, Banerjee (班纳吉), and talk with him about the present border conflict; the book gives no words). Made public: Check (1990 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 169; [[w.banerjee-my-peking-memoire-of]], 72 (cited by [[w.jian-zhou-enlai]], 482 n.86c). See [[cal.1962-11-19.south-asia]]. Names: Zhou Enlai, Chen Yi. Check: the day (Chen: midnight, after Nov. 18).'
