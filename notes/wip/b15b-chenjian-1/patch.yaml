patch: 2026-11-20-b15b-chenjian-1
by: 'Claude (batch 15b, Chen Jian, Zhou Enlai: A Life, run 1), Nov. 20–21, 2026'
ops:
- edit:
    id: cal.1962-09-16.japan
    base: a7706997
    set:
      n: '[[w.jian-zhou-enlai]], 504–05 (Chen''s translation; "that month," the month of the Tenth Plenum); [[w.zhou-enlai-nianpu-1949]], II, 496 (Sept. 16–19, 1962: Sept. 16: restoring relations by a "promotional and gradual" method, politics and economy not separable, the three political principles kept, the right to criticize the Japanese government on great issues kept; Sept. 17: the three political principles and the three trade principles explained, the political ones the measure of friendly exchange; of the few in Japan who would revive militarism, those who suffered in the war cannot fail to care, and China, after fifty years, still less; Sept. 19: differences of view do not matter if a common way is sought). Made public: Check. To check: Zhou''s and Chen Yi''s conversations with Matsumura, Sept. 16–19, 1962, 105-01152-04, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 505 n.49). Names: Zhou Enlai. Check: the day (Chen''s text has "that month"; his note dates the conversations, Zhou''s and Chen Yi''s, Sept. 16–19).'
- edit:
    id: cal.1962-09-24.china
    base: 916d8a54
    set:
      n: '[[w.mao-zedong-zhuan]], V, ch. 70 (the plenum Sept. 24–27; Mao''s speech, then Chen Boda''s, the same day); [[w.jian-zhou-enlai]], 504 (Mao''s words at the Tenth Plenum, in Chen''s translation; not the day; Chen places the plenum "in the spring of 1962"). [[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1962 (the plenum opens, Mao presiding and speaking; Chen Boda''s explanation of the draft decision after). [[w.zhou-enlai-nianpu-1949]], II, 497 (Sept. 24–27, 1962: Zhou Enlai at the Tenth Plenum, which adopts the decisions on the communes'' collective economy and farm production, the revised draft of the communes'' work regulations, and on commercial work; Mao''s speech on class, the situation, contradictions and unity in the Party); [[w.macfarquhar-origins-of-the-cultural]], III, 283 (Mao opens the plenum at 10 a.m. in the Huairentang, Zhongnanhai, and makes the first speech: classes exist in socialist countries and class struggle undoubtedly exists; talk of it "every year, every month, every day"); [[w.yang-shangkun-riji]], II, 211 (Sept. 24, 1962; 10 a.m. to 1 p.m., called at 8 a.m. by Mao; Mao speaks, then Chen Boda explains the decision on agriculture; no afternoon sitting); [[w.deng-xiaoping-nianpu-1904]], III, 1725–1726 (Sept. 24–27, 1962; Deng attends; adopted, the decisions on the communes'' collective economy, on commerce, on exchanging leading cadres, on the control organs, and the revised Working Regulations; Mao on classes, the situation, contradictions and unity, class struggle "every year, every month"; the go-it-alone, reversal and dark winds; Peng Dehuai and Xi Zhongxun under special review; Huang Kecheng and Tan Zheng out of the Secretariat, Lu Dingyi, Kang Sheng and Luo Ruiqing in; at Liu''s proposal the plenum relayed only to grade 17 and above; work first); [[w.mao-zedong-zhuan]], V, ch. 70 n.55 (Sept. 24: Mao interjects at Chen Boda''s explanation of the draft decision on the communes: Japan sells us fertilizer, special steel, pesticides, and is to sell the world''s best vinylon plant, while the socialist countries do not; use the capitalist countries'' technology; the first deferred-payment vinylon contract signed with Japan in June 1963). [[w.yang-jisheng-mubei]], II, 1175 (the Tenth Plenum of the Eighth Central Committee, Sept. 24–27, 1962; its communiqué on classes and class struggle); [[w.yang-jisheng-mubei]], I, 335 (the plenum calls on the whole Party never to forget class struggle; Anhui''s responsibility fields are criticized as a "go-it-alone wind" and a "restoration of capitalism"); [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (Sept. 24–27; Mao raises class struggle again). Made public: Check (2003 at the latest). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 211) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. To check: *Mao Zedong zhuan, 1949–1976* (2003), 1256 (cited by [[w.jian-zhou-enlai]], 504 n.44); [[w.jin-1949-1989-niande-zhongguo]], 509 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.128); Mao Zedong, speech of Sept. 24, 1962, opening the Tenth Plenum, in [[w.schram-mao-tse-tung-unrehearsed]], 189–90 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.130a); [[w.schram-maos-road-to-power]], xvii (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 283 n.130b); Mao Zedong 毛泽东, interjection at Chen Boda''s 陈伯达 explanation at the Tenth Plenum, Sept. 24, 1962 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.55). Names: Mao Zedong, Chen Boda.'
- edit:
    id: cal.1962-09-26.china
    base: b217d5db
    set:
      n: '[[w.jian-zhou-enlai]], 483; [[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1962 (the plenum''s session; Zhou Enlai speaks in the afternoon, his words not given). [[w.zhou-enlai-nianpu-1949]], II, 498 (Sept. 26, 1962: Zhou Enlai''s speech: in the adjustment there was right and wrong; in May the difficulties were somewhat overstated, but the course remained to push hard against them; in an anti-Right drive guard against the Left, learn from the anti-Rightist excesses, no campaign; "the chance is not to be lost," unite the Party; on India: military coexistence, long struggle, struggle and unity, fighting and negotiating; unite India''s people; the struggle has reason, advantage, restraint, to answer after the other strikes, never to shoot first or attack unless it must be; the army''s task now is to watch the Indian troops, throw back their attacks, cut their retreat, force them back, and still to hold talks); [[w.yang-shangkun-riji]], II, 211 (Sept. 26, 1962; the plenum, 10 a.m. to 1:30 p.m. and 4 to 6 p.m.; Liu Shaoqi, Deng Xiaoping and Zhou Enlai speak). Made public: Check. To check: Zhou''s speech at the Tenth Plenum of the Eighth Central Committee, Sept. 26, 1962, 855-6-2008-14, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 483 n.87). See [[cal.1962-09-24.china]]. Names: Zhou Enlai. Check: the day (Chen''s text has "At the Tenth Plenum"; his note dates the speech Sept. 26). Check: Chen cites the same speech (764 n.89) for words he places "when the war began" (483): "this war, first and foremost, is a political battle."'
- edit:
    id: cal.1962-09.south-asia-3
    base: 176a9948
    set:
      n: '[[w.jian-zhou-enlai]], 479; [[w.macfarquhar-origins-of-the-cultural]], III, 305 (the Chinese appraisal: India, checked in Aksai Chin, decided in September to push forward north of the McMahon Line; the General Staff decided to match the Indians man for man). Made public: Check (1997 at the latest). Check: Zhou''s nianpu (II, 496 n.) says only that the troops of both sides stood face to face at Chedong until Sept. 8; it does not give the Central Military Commission''s order, so the cite does not bear it out. To check: [[w.zhongyin-bianjie-ziwei-fanji]], 159–60; [[w.zhou-enlai-nianpu-1949]], II, 496 n. (cited by [[w.jian-zhou-enlai]], 479 n.67b); [[w.palit-war-in-high-himalaya]], 178–81, 183, 187 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 305 n.48a). Check: the day.'
- edit:
    id: cal.1962-10-05.vietnam-hanoi
    base: 466a5420
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1962. [[w.jian-zhou-enlai]], 494 (Mao and Zhou with Giap; Mao, in Chen''s translation: "in the past years, we have not thought much about the offensives by the imperialists. We now should give some good attention to it"; the Vietnamese have "caught one of the Americans'' five fingers"; "it is not an easy decision for the United States to intervene"; China "will pay very close attention to the situation in South Vietnam and Laos"; not the place, the hour, the others present or the fleas); [[w.zhou-enlai-nianpu-1949]], II, 501 (Oct. 5, 1962: Zhou Enlai with Mao and Võ Nguyên Giáp: the mutual support of China and Vietnam is all-round, not military only but political and economic); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 561 (Oct. 5, 1962; Liu, with Mao, Zhou Enlai, Zhu De and Deng Xiaoping, meets the Vietnamese military delegation headed by Võ Nguyên Giáp); [[w.deng-xiaoping-nianpu-1904]], III, 1728 (Oct. 5, 1962; afternoon; Deng with Mao, Zhou, Liu, Zhu De and others; Giáp, Minister of Defense). Made public: Check (the words; 2013 at the latest). To check: [[w.jian-maos-china-and-the]], 207; Mao''s conversation with Giap, Oct. 5, 1962, Chinese Central Archive (cited by [[w.jian-zhou-enlai]], 494 n.11a). Names: Mao Zedong, Võ Nguyên Giáp, Zhou Enlai.'
- edit:
    id: cal.1962-10-05.south-asia
    base: b422e9d0
    set:
      n: '[[w.jian-zhou-enlai]], 479 (Chen''s translation); [[w.zhou-enlai-nianpu-1949]], II, 500 (Oct. 5, 1962: the General Staff''s report from AP and AFP: India stepping up war preparations, an attack likely within days, "the first real fighting in three years of border conflict," India "resolved to drive the Chinese back"; Zhou''s comment: if the enemy moves in the east, besides a hard blow there some of his strongholds in the west can be wiped out at the same time; he orders Luo Ruiqing, Chief of the General Staff, to hasten the deployments; a note: by Oct. 20 India had set up 43 posts on Chinese ground in the western sector). Made public: Check (1997 at the latest). To check: [[w.zhou-enlai-zhuan-1949]], 699 (cited by [[w.jian-zhou-enlai]], 479 n.69a). Names: Zhou Enlai, Luo Ruiqing.'
- edit:
    id: cal.1962-10-08.south-asia-3
    base: 870d969f
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1962. [[w.jian-zhou-enlai]], 479 (India might launch a large-scale offensive; "If they indeed attack us, we will surely take action in self-defense"; not the helicopters); [[w.zhou-enlai-nianpu-1949]], II, 502 (Oct. 8, 1962: Zhou Enlai to Chervonenko: India may open a large war in the east; China holds only to defense, has never fired first, and will defend itself if attacked; Indian use of Soviet helicopters and transports to supply the front); [[w.zhou-enlai-waijiao-huodong]], 337 (Oct. 8, 1962; 下午3时, 中南海西花厅); [[w.lengxi-shinian-lunzhan-1956-1966]], 497 (Wu: on Oct. 8 the Chinese government tells the Soviet ambassador that India has massed troops on the border and seems to mean war, and asks the Soviet government to use its influence and to persuade Nehru to turn back from the cliff''s edge; the Indian prime minister, in spite of seven strong protests, had not stopped the advance and had said in Parliament that China''s troops on the border must be cleared out); [[w.macfarquhar-origins-of-the-cultural]], III, 312 (a Chinese leader, said to be Zhou Enlai, tells the Soviet ambassador that China has information that India is about to launch a massive attack and that China would resolutely defend itself, and that Soviet-made helicopters and transport planes used by India for airdropping and transporting military supplies make a bad impression on the frontier guards). Made public: Check (2013 at the latest). To check: Zhou''s conversation with the Soviet Ambassador, Chervonenko, Oct. 8, 1962, 109-03804-01, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 479 n.73); Zhou Enlai (?), talk with the Soviet ambassador, Oct. 8, 1962, in [[w.xiao-chushi-sulian-banian-ambassador]], 121, 122 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 312 n.89); Zhou Enlai (?), talk with the Soviet ambassador, Oct. 8, 1962, in [[w.gittings-survey-of-the-sino]], 178 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 312 n.90a); Renmin Ribao, Nov. 2, 1963 (the account of the Oct. 8, 1962 talk with the Soviet ambassador), in [[w.gittings-survey-of-the-sino]], 178 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 312 n.90b). See [[cal.1962-10-08.south-asia]]. Names: Zhou Enlai.'
- edit:
    id: cal.1962-10-08.south-asia-4
    base: 7066d536
    set:
      n: '[[w.jian-zhou-enlai]], 479 ("immediately"). Made public: Check (2014 at the latest). To check: [[w.zishen-yang-chengwu-nianpu-chronological]], 368 (cited by [[w.jian-zhou-enlai]], 479 n.72). See [[cal.1962-10-08.south-asia]]. Names: Luo Ruiqing, Mao Zedong.'
- edit:
    id: cal.1962-10-13.soviet-union
    base: 446698da
    set:
      n: '[[w.jian-zhou-enlai]], 479–80 (it surprises Mao and Zhou); [[w.lengxi-shinian-lunzhan-1956-1966]], 497–498 (Wu: Oct. 13, Khrushchev himself calls in the Chinese ambassador, Liu Xiao, and says the USSR supports China''s stand for a peaceful settlement and would, in China''s place, protest as strongly to India; Wu ties it to the American–Soviet tension over Cuba, when Khrushchev needed China''s support); [[w.macfarquhar-origins-of-the-cultural]], III, 312–13 (in the week after the Oct. 8 conversation, Khrushchev gives Ambassador Liu Xiao, about to return home after eight years, a two-hour tour d''horizon at his parting call and on Oct. 14 summons the whole Presidium to a farewell dinner; the Soviet Union is on China''s side on the border, the Presidium''s unanimous position, and would proclaim it the next day if the Chinese wished; MiG-21 sales to India should be postponed until the dispute is settled; ''If the Soviet Union were placed in China''s position it would select the same measures''). Made public: Check (1986 at the latest). Check: the book places Khrushchev''s dinner for Liu Xiao Oct. 14; this entry is dated Oct. 13. To check: Khrushchev''s conversation with Liu Xiao, Oct. 13, 1962, 109-03809-06, and his talk at the farewell banquet for Liu Xiao, Oct. 14, 1962, 109-03809-04, Chinese Foreign Ministry Archive; [[w.xiao-chushi-sulian-banian-ambassador]], 121 (cited by [[w.jian-zhou-enlai]], 480 n.74c); [[w.floyd-mao-against-khrushchev]], 158–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 313 n.93); [[w.gittings-survey-of-the-sino]], 178 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 313 n.94b). See [[cal.1962-10-08.south-asia-3]]; [[cal.1962-10-11.south-asia]]. Names: Khrushchev, Zhou Enlai, Chervonenko. Check: the day and the setting: Chen''s text has only "a few days later" than Oct. 8; his n.74 (763) dates the conversation Oct. 13 and Khrushchev''s talk at the farewell banquet Oct. 14; his n.98 (764) puts the conversation at Liu''s farewell banquet, Oct. 13.'
- edit:
    id: cal.1962-10-15.china-2
    base: 3e48ba86
    set:
      n: '[[w.jian-zhou-enlai]], 480 (Zhou and the other leaders take it for Nehru''s intent to open a big offensive, and a reason to act). To check: [[w.maxwell-indias-china-war]], 369–71 (the 1972 ed.); *Statesman*, Oct. 13, 1962 (Nehru''s words; cited by [[w.jian-zhou-enlai]], 480 n.75b); *Renmin ribao*, Oct. 15, 1962 (cited by [[w.jian-zhou-enlai]], 480 n.76). Names: Nehru. Check: the day (Chen''s text dates no report; his note cites the issue of Oct. 15).'
- edit:
    id: cal.1962-10-17.south-asia
    base: 5bd75b0a
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 17, 1962 ("同日"). [[w.jian-zhou-enlai]], 480 (1:30 p.m., "a final round of discussion"; Luo Ruiqing: "now it seems that there is no way out for us unless we wage a war of self-defense. We should act immediately"; Mao: "Can we win the war?" Luo: "Yes, we can." Mao: "You must wait for the order from the supreme command to fire the first shot. After firing that shot, how to fight the war will be entirely your responsibility"; both sectors, east and west, decided on; not all those present); [[w.mao-zedong-zhuan]], V, ch. 71 (Mao calls the meeting and it decides on the counterattack; not the hour or those present). [[w.deng-xiaoping-nianpu-1904]], III, 1730 (Oct. 17, 1962; 1:30 p.m. (下午一时三十分); Deng at Mao''s meeting on the counterattack in self-defense). Made public: Check (2013 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 165; [[w.yingfu-zai-zuigao-tongshuaibu-dang]], 209–10 (Lei dates the meeting Oct. 18; Chen calls it wrong) (cited by [[w.jian-zhou-enlai]], 480 n.77c). See [[cal.1962-10-08.south-asia]]. Names: Mao Zedong, Zhou Enlai.'
- edit:
    id: cal.1962-10-18.south-asia-2
    base: 18a10988
    set:
      n: '[[w.jian-zhou-enlai]], 480 ("The next afternoon," after Mao Zedong signed the order of Oct. 17). Made public: Check (1994 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 165; [[w.zhongyin-bianjie-ziwei-fanji]], 179–80 (cited by [[w.jian-zhou-enlai]], 480 n.78b). See [[cal.1962-10-17.south-asia-2]]. Check: whether this is the order that put the attack back a day, to Oct. 20.'
- edit:
    id: cal.1962-10-22.soviet-union-4
    base: ccc2d835
    set:
      n: '[[w.jian-zhou-enlai]], 485–86. Made public: Check. To check: Memorandum of the Soviet government to the Chinese government, Oct. 22, 1962, 109-03801-02, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 486 n.97). See [[cal.1962-10-18.south-asia]].'
- edit:
    id: cal.1962-10-24.south-asia
    base: 4a3fa844
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 24, 1962. [[w.jian-zhou-enlai]], 481 (drafted under Zhou''s guidance; Chen''s three: a peaceful settlement, an end to the conflict and a withdrawal, renewed talks; "the Line of Actual Control existing between them on November 7, 1959," each side twenty kilometers back; not the east, middle and west, or the Prime Ministers'' meeting); [[w.mao-zedong-zhuan]], V, ch. 71, and n.2 (the boundary to be settled by talks, not "three proposals"; the line of actual control of Nov. 7, 1959, along the whole border; the two Prime Ministers to meet again, not where). [[w.zhou-enlai-nianpu-1949]], II, 504 (Oct. 24, 1962: the statement and its three proposals; India rejected them the day it received them); [[w.lengxi-shinian-lunzhan-1956-1966]], 498–499 (Wu: the government''s statement of Oct. 24 proposes an end to the conflict, new talks and a peaceful settlement; both armies to withdraw 20 kilometers and break contact, the Chinese in the east to north of the line of actual control, in the middle and western sectors neither side to cross the customary line; India refuses); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 249 (Oct. 24, 1962; the government''s statement: three proposals, the boundary to be settled by negotiation; both sides to respect the actual line of control along the whole boundary and pull their forces back 20 kilometers each; if India agrees, China willing to withdraw its frontier forces in the east to north of the line, the two sides in the middle and western sectors pledging not to cross it; the two prime ministers to meet again). To check: the statement''s published text; *Renmin ribao*, Oct. 25, 1962 (cited by [[w.jian-zhou-enlai]], 481 n.81). See [[cal.1962-10-23.south-asia-2]]. Names: Nehru.'
- edit:
    id: cal.1962-10-26.china-2
    base: 06901a7b
    set:
      n: '[[w.jian-zhou-enlai]], 485 ("immediately after the war began"; letters to the leaders of dozens of countries); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 249–250 (Oct. 26, 1962; Liu Shaoqi and Zhou each send letters or cables to the leaders of 13 Asian and African countries, among them Ceylon, Cambodia and Ghana, hoping they will help bring about the three proposals of the Oct. 24 statement for a peaceful settlement of the boundary question). Made public: Check. To check: Zhou to President Nasser and other leaders of Asian and African countries, Oct. 26, 1962, 107-00528-11, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 485 n.95). Names: Zhou Enlai, Nasser. Check: the day (Chen''s text dates none; his note dates this letter Oct. 26).'
- edit:
    id: cal.1962-10-28.china
    base: 6a13d34f
    set:
      n: '[[w.jian-zhou-enlai]], 486; [[w.zhou-enlai-waijiao-huodong]], 339 (Oct. 28, 1962; 下午, 人民大会堂); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 250 (Oct. 28, 1962; a mass rally in the capital firmly supports the Cuban people against the U.S. war provocation; the book has Zhou and Deng Xiaoping among the leaders attending and Peng Zhen, Vice-Chairman of the Standing Committee, giving the speech); [[w.deng-xiaoping-nianpu-1904]], III, 1730 (Oct. 28, 1962; afternoon; Deng there with Zhou and Peng Zhen). To check: *Renmin ribao*, Oct. 29, 1962 (cited by [[w.jian-zhou-enlai]], 486 n.99). Names: Zhou Enlai, Castro.'
- edit:
    id: cal.1962-10-30.china
    base: cdfb24bc
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 3, 1962 (the report, of Oct. 30, as Mao Zedong read it). [[w.jian-zhou-enlai]], 515 (Luo to Zhou, Oct. 10: a special committee under the Center''s direct leadership, Zhou to lead it, the first test slated for 1964; not the Second Ministry, the members or Liu Shaoqi''s agreement); [[w.jianguo-yilai-mao-zedong]], XVI, 428–429 (Oct. 30, 1962; note 1 to Mao''s note of Nov. 3: the report of Oct. 30 to Mao and the Center; the proposal made at the Defense Industry Office''s report to the Standing Committee on Oct. 19, which Liu Shaoqi approved in principle; on Liu''s instruction Zhou Enlai in overall charge, with He Long, Li Fuchun, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Zhang Aiping, Liu Jie, Sun Zhiyuan, Duan Junyi and Gao Yang). Made public: Check (2013 at the latest). Check: the day, or an earlier proposal: Chen Jian, 515, has Luo''s proposal to Zhou on Oct. 10 (Mao''s approval Nov. 3). To check: [[w.yao-luo-ruiqing-zhuan-a]], 393–94; [[w.zhou-enlai-zhuan-1949]], 788–89 (cited by [[w.jian-zhou-enlai]], 515 n.99b); Luo Ruiqing, report to Mao Zedong and the Central Committee on setting up a special committee to strengthen the leadership of the atomic industry, Oct. 30, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 428 n.1). Names: Zhou Enlai.'
- edit:
    id: cal.1962-11-09.japan
    base: 4fbad341
    set:
      n: '[[w.jian-zhou-enlai]], 505; [[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 9, 1962: Liao Chengzhi and Takasaki sign the memorandum on Sino-Japanese private trade and related papers, with Zhou Enlai and Chen Yi at the signing); [[w.zhou-enlai-waijiao-huodong]], 340 (Nov. 9, 1962; 晚11时50分; Zhou Enlai present at the signing); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 251 (Nov. 9, 1962; Liao Chengzhi, chairman of the Chinese Afro-Asian Solidarity Committee, and Takasaki sign at Peking a memorandum on Sino-Japanese non-governmental trade: on the basis of equality and mutual benefit, by the method of gradual accumulation, to develop non-governmental trade further). To check: [[w.zhonghua-renmin-gongheguo-jingji]], 432–33, 469–71 (cited by [[w.jian-zhou-enlai]], 505 n.50a). See [[cal.1962-10.japan]].'
- edit:
    id: cal.1962-11-14.china
    base: d0337d5d
    set:
      n: '[[w.jian-zhou-enlai]], 484; [[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1962 (the notice, drafted by Zhou Enlai on Mao''s instruction of Nov. 13 and approved by Mao). [[w.zhou-enlai-nianpu-1949]], II, 511 (Nov. 14, 1962: Zhou Enlai drafts the Central Committee''s notice on the border clashes and relations with India: if India makes a new attack China will strike harder in self-defense, will take no step of its own to worsen relations, and will seek chances to stop the clash and reopen talks). Made public: Check. To check: the Central Committee''s Notice on the Chinese-Indian Border Clashes and Questions Concerning Chinese-Indian Relations, Nov. 14, 1962, 855-6-2288-4, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 484 n.91).'
- edit:
    id: cal.1962-11-17.china
    base: fd3f8086
    set:
      n: '[[w.jian-zhou-enlai]], 516 (it meets three times before the month is out); [[w.zhou-enlai-nianpu-1949]], II, 512 (Nov. 17, 1962: Zhou Enlai presides at the first meeting of the Central Special Committee, set up under the Central Committee''s direct leadership with Zhou chairman and fifteen members; to Oct. 16, 1964 he held nine meetings of it and several small ones and settled over a hundred major problems of production, research and construction). Made public: Check (2013 at the latest). To check: [[w.zhonggong-zhongyang-wenjian-xuanji]], XLI, 426–27 (cited by [[w.jian-zhou-enlai]], 516 n.101). See [[cal.1962-11-03.china-2]]. Names: Zhou Enlai.'
- edit:
    id: cal.1962-11-19.south-asia
    base: 7fae0f95
    set:
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("同一天下午"); [[w.jian-zhou-enlai]], 482 (Nov. 18; the President, Radhakrishnan, alone; Chen''s translation: "Why suddenly talk so loudly about a peaceful settlement? Please read this. The Foreign Ministry should study whether other Indian leaders have made similar comments in the past several days"). [[w.jianguo-yilai-mao-zedong]], XVI, 435–436 (Nov. 19, 1962; part one, Mao''s note "To the Premier to read," the Foreign Ministry to study whether India''s leaders had talked so in the past few days, dated 4 p.m. the 19th, signed "Mao"; part two, beside Nehru''s National Defense Volunteers'' Day speech and Radhakrishnan''s: "suddenly talking big of a peaceful settlement"; beside the Cairo *al-Gumhuriya*''s call for an unconditional cease-fire: "the Soviet line, but the last paragraph means to warn Nehru"; printed from the manuscript; notes 1–3); [[w.mao-zedong-zhuan]], V, ch. 71 n.3 (Nov. 19: Mao sees in *Cankao ziliao* no. 5406 that India''s prime minister and president on Nov. 18 spoke for a peaceful settlement; his note "突然大谈和平解决" (suddenly they talk peace) for Zhou Enlai and the Foreign Ministry). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 71). Check: the Wengao dates the note 4 p.m. Nov. 19 (XVI, 435), against Chen''s Nov. 18. To check: Mao''s note on *Cankao ziliao*, no. 5406, manuscript, Nov. 19, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.3); [[w.zedong-mao-zedong-nianpu]], V, 169 (cited by [[w.jian-zhou-enlai]], 482 n.84); Xinhua, Cankao ziliao no. 5406, Nov. 19, 1962, with Nehru''s speech on National Defense Volunteers'' Day, Radhakrishnan''s speech, and al-Gumhuriya''s call for an unconditional Sino-Indian cease-fire (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 436 n.1); Mao Zedong 毛泽东, comment on *Cankao ziliao* 《参考资料》 no. 5406 (manuscript 手稿), Nov. 19, 1962: "suddenly a great deal of talk of a peaceful settlement" (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.3). See [[cal.1962-11-19.china]]. Names: Mao Zedong. Check: the day: Chen has Nov. 18.'
- edit:
    id: cal.1962-11-19.south-asia-2
