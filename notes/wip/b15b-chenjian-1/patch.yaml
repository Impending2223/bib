      when: May
      date: 1960-05
      thread: china-leadership
      also:
      - china
      c: 'A Politburo meeting sets a new line on Taiwan: better in the hands of Chiang and his son than of the Americans; no haste, liberation perhaps for the next generation. The "four concrete measures" for a reunion: Chiang to keep all military and political power and personnel (diplomacy to Peking); shortfalls in Taiwan''s military, government and economic budgets met by the Center; social reform deferred until conditions suit and Chiang agrees; neither side to send agents or sap the other''s unity.'
      n: '[[w.jian-zhou-enlai]], 460. Made public: 1994. To check: [[w.liao-xinwen-zhou-enlai-and-the]], 35 (cited by [[w.jian-zhou-enlai]], 460 n.79). Names: Chiang Kai-shek.'
