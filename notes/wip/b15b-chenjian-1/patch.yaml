- add:
    entry:
      id: cal.1960-05.china-leadership-21
      when: May
      date: 1960-05
      thread: china-leadership
      also:
      - china
      c: 'A Politburo meeting sets a new line on Taiwan: better in the hands of Chiang and his son than of the Americans; no haste, liberation perhaps for the next generation. The "four concrete measures" for a reunion: Chiang to keep all military and political power and personnel (diplomacy to Peking); shortfalls in Taiwan''s military, government and economic budgets met by the Center; social reform deferred until conditions suit and Chiang agrees; neither side to send agents or sap the other''s unity.'
      n: '[[w.jian-zhou-enlai]], 460. Made public: 1994. To check: [[w.xinwen-zhou-enlai-and-the]], 35 (cited by [[w.jian-zhou-enlai]], 460 n.79). Names: Chiang Kai-shek.'
      src:
        c: 718d8794
        rows:
        - 'w.jian-zhou-enlai 460: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:chiang-kai-shek
      - ok:fields-place
- add:
    entry:
      id: cal.1960-06-14.china-leadership-8
      when: June 14
      date: '1960-06-14'
      thread: china-leadership
      c: 'Shanghai, the enlarged Politburo. Zhou Enlai, asked by Mao to speak on agriculture: the general situation very good, but high targets have done farming serious harm; the initiative may be lost and the plans for 1962 fail. He proposes much lower targets for grain, cotton and meat, not for steel.'
      n: '[[w.jian-zhou-enlai]], 455 (Mao''s request; Zhou''s speech). Made public: 1998. To check: Zhou''s speech at a Politburo enlarged meeting, June 14, 1960 (cited by [[w.jian-zhou-enlai]], 455 n.50); [[w.zhou-enlai-zhuan-1949]], I, 583–584 (cited by [[w.jian-zhou-enlai]], 455 n.50). Names: Zhou Enlai, Mao Zedong.'
      src:
        c: d8dd34ee
        rows:
        - 'w.jian-zhou-enlai 455: all'
        - 'via x.1960-06-14.zhou-speech-enlarged-politburo-shanghai: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:zhou-enlai
      - name:mao-zedong
      place: shanghai
