        when: July 8
        date: '1967-07-08'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 speaks to the forum of the anti-aircraft artillery units sent into Vietnam 入越高炮部队座谈会: the situation at home and abroad; the defense industry''s failings since the founding, in anti-aircraft arms above all; the hydrogen bomb has shaken the world, the high technology to be pressed on, conventional arms (anti-aircraft guns, radar, directors, optics) to be changed in the Third Five-Year Plan. Five measures: research reorganized into academies, Vice-Chairman Nie 聂副主席 directing; use, research and production joined; the Vietnam battlefield, "the best testing ground," used for research; specialists to learn from the troops'' inventions; new anti-aircraft arms of China''s own.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 967–968. Made public: 2007. Names: Ye Jianying, Nie Rongzhen.'
