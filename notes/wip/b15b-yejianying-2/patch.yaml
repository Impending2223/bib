        when: Feb. 26–Mar. 25
        date: '1967-02-26'
        thread: china-leadership
        c: 'Ye Jianying 叶剑英 presides at the all-army conference of cadres of army rank and above 全军军以上干部会议: the army''s help to spring plowing, military training of college and middle-school teachers and students, the seizures of power. At its preparatory meeting and in the groups he asks the cadres to set aside their worries and tell the troops'' true state (positive education, training, the "three supports and two militaries" 三支两军, relations with the localities, organs stormed and the counterstorms); later several speeches: the Party, government, army and cadres at every level not to be denied wholesale; to act by Chairman Mao''s strategy, not rashly; unity and discipline in the army; war readiness.'
        n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 961–962. At the conference, by this page, Zhou Enlai 周恩来 speaks twice (industry, military control, spring plowing); Chen Boda 陈伯达 and Kang Sheng 康生 attack Liu Shaoqi 刘少奇 by name; Lin Biao 林彪 speaks. Made public: 2007. Names: Ye Jianying, Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Liu Shaoqi, Lin Biao.'
