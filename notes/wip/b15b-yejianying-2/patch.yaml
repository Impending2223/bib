  - cite:
      id: cal.1967-01-19.china-leadership-9
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 955–956 (Jan. 19, 1967; Ye Jianying 叶剑英 at the enlarged liaison meeting of the Military Commission 军委扩大的碰头会议, against the Cultural Revolution Group''s 中央文革 call for the "four bigs" 四大 in the army: the army may not have them; the pillar of the dictatorship, heavy war-readiness duties; the Party''s absolute leadership; discipline; with the "four bigs", anarchy, and how could it fight?)'
  - cite:
      id: cal.1967-01-19.china-leadership-3
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 19, 1967; after the meeting Ye Jianying 叶剑英 reports it to Zhou Enlai 周恩来; Zhou''s telephone call on Jiang Qing''s 江青 and Chen Boda''s 陈伯达 rally of 100,000 that night: without my order Xiao Hua 萧华 not to go to it)'
  - cite:
      id: cal.1967-01-19.china-leadership-8
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 19, 1967; that night 当晚 rebels of the Peking Military Region''s Zhanyou troupe 北京军区战友文工团 and other units raid Xiao Hua''s 萧华 quarters; he flees by the back door to Ye Jianying''s 叶剑英 residence in the Western Hills 西山)'
  - cite:
      id: cal.1967-01-20.china-leadership-5
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 20, 1967; asked where Xiao Hua had hidden, Ye Jianying 叶剑英 rises and bangs the table: he came to me at midnight, I took him in, "if there is a crime of harboring, I bear it"; the blow breaks a bone of his right hand)'
  - cite:
      id: cal.1967-01-21.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 21, 1967; Mao''s comment to Lin Biao 林彪: the army to back the broad left masses, a new order to be issued, the earlier ones void)'
  - cite:
