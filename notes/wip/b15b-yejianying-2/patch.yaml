      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 23, 1967; the Center, State Council, Military Commission and Cultural Revolution Group issue the Decision that the PLA firmly supports the revolutionary left)'
  - cite:
      id: cal.1967-01-22.china-leadership
      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 956 (Jan. 22, 1967; noon 中午; Ye Jianying 叶剑英 with Mao Zedong 毛泽东 in room 118 of the Great Hall of the People 人民大会堂一一八室, receiving those at the enlarged liaison meeting of the Military Commission; photographed together)'
