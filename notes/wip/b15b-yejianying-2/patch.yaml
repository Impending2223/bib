patch: 2026-11-21-b15b-yejianying-2
by: Claude (batch 15b, Ye Jianying nianpu, run 2), Nov. 21, 2026
ops:
  - edit:
      id: cal.1967-01-03.china-leadership-3
      base: 5cae4428
      set:
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 105 (Jan. 3, 4, 1967); [[w.chen-yi-nianpu]], 1180 (early January 1967; students of more than forty military academies come to Peking, angered by Jiang Qing 江青 and Guan Feng 关锋 at the old marshals'' speeches of Nov. 13 and 29, form a "preparatory office to criticize the bourgeois reactionary line" and set a rally for Jan. 5 to make Chen Yi and Ye Jianying attend "to be educated"; on Zhou''s dissuasion it is not held). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 954). Names: Zhou Enlai, Ye Jianying, Chen Yi.'
  - edit:
      id: cal.1967-01-06.china-leadership-3
      base: 3866f5c3
      set:
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 106 (Jan. 6, 1967); [[w.macfarquhar-maos-last-revolution]], 165 (the rally in People''s Square: 100,000 gather; of the committee''s 56 members and alternates 45 are thrown out; the first struggle rally shown live on television); [[w.mao-zedong-zhuan]], VI, ch. 76 n.4 (Jan. 6 the Workers'' General Headquarters and other rebel bodies hold in the People''s Square at Shanghai the meeting to overthrow thoroughly the Shanghai committee headed by Chen Pixian and Cao Diqiu; Chen, Cao, Wei Wenbo, Yang Xiguang and other Shanghai and East China leaders are denounced; afterwards the committee''s and the municipal government''s offices are made to stop work and the rebels'' headquarters ''for grasping revolution and promoting production'' take over their functions, real power at Shanghai passing to Zhang Chunqiao and Yao Wenyuan, n.4). [[w.jian-zhou-enlai]], 562 (the next day, a rally of a hundred thousand with Zhang and Yao''s blessing strips the Shanghai committee and government of power, the first seizure of a provincial or municipal authority; Mao and the *Renmin ribao* silent); [[w.chen-yi-nianpu]], 1181 (Jan. 6, 1967; the Shanghai rebels under Wang Hongwen 王洪文, planned and directed by Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元, seize the city''s Party and government power, the "January storm"). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 954). To check: [[w.jingxian-shinian-yimeng]], 22, 36 (cited by [[w.macfarquhar-maos-last-revolution]], 165 n.51); [[w.dangdai-zhongguode-shanghai-2]], I, 279 (cited by [[w.macfarquhar-maos-last-revolution]], 165 n.55); [[w.zhenzhi-zhongguo-dianshi-dashiji-1955]], 178–179 (cited by [[w.macfarquhar-maos-last-revolution]], 165 n.56a); [[w.perry-proletarian-power]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30b); [[w.walder-chang-chun-chiao-and]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30c); [[w.white-policies-of-chaos]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30d); [[w.cheng-life-and-death-in]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30e); [[w.hunter-shanghai-journal]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30f); [[w.knight-window-on-shanghai]] (cited by [[w.macfarquhar-maos-last-revolution]], 161 n.30g); Orders Nos. 1–3 issued by the mass rally in Shanghai''s People''s Square, Jan. 6, 1967 (the book: the Third Order 《第三号通令》 of the meeting "to overthrow thoroughly the Shanghai committee headed by Chen Pixian and Cao Diqiu") (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.4); [[w.li-xun-geming-zaofan-niandai]], 580–606, 606 (cited by [[w.jian-zhou-enlai]], 562 n.79, n.80). Names: Zhou Enlai, Wang Hongwen, Zhang Chunqiao, Yao Wenyuan.'
  - edit:
      id: cal.1967-01-14.china-leadership-4
      base: a55b08f4
      set:
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 111 (Jan. 14, 1967, the item after); [[w.mao-zedong-zhuan]], VI, ch. 76 n.17 (the Notice of Jan. 14 on not pointing the struggle at the army, n.17). [[w.teiwes-tragedy-of-lin-biao]], 73 (the Center''s circular of Jan. 14 forbidding "directing the spearhead of struggle against the armed forces," which Mao surely approved; Xu Xiangqian, new head of the army''s Cultural Revolution Group, taking the lead). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 955). To check: the notice, as issued; Central Committee, Notice that the spearhead of the struggle must not be pointed at the army 《中共中央关于不得把斗争锋芒指向军队的通知》, Jan. 14, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.17); [[w.nianyi-da-dongluande-niandai]], 195 (cited by [[w.teiwes-tragedy-of-lin-biao]], 74 n.32a); [[w.yunsheng-maojiawan-jishi]], 176 (cited by [[w.teiwes-tragedy-of-lin-biao]], 74 n.32b); [[w.xu-xiangqian-zhuan]], 523 (cited by [[w.teiwes-tragedy-of-lin-biao]], 74 n.32c); [[w.ke-wenhua-dageming-zhongde-renmin]], 39 (cited by [[w.teiwes-tragedy-of-lin-biao]], 74 n.32d); [[w.barnouin-ten-years-of-turbulence]], 135–137, 227 (cited by [[w.teiwes-tragedy-of-lin-biao]], 74 n.32e). Names: Zhou Enlai, Ye Jianying.'
  - edit:
      id: cal.1967-01-19.china-leadership-3
      base: fbc3b2fb
      set:
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 112 (Jan. 19, 1967, the item after); [[w.macfarquhar-maos-last-revolution]], 176 (the enlarged session of the Military Commission meets Jan. 19–20); [[w.yang-jisheng-tiandi-fanfu]], I, 387 (at the Military Commission''s meeting Jiang Qing and Chen Boda charge Xiao Hua 蕭華, head of the General Political Department, with the army''s lagging movement, call him a "bourgeois politician" and order him to make self-criticism that night before the 100,000 at the Workers'' Stadium 工人體育場; Ye Jianying and Nie Rongzhen leave early in protest; Zhou: without my order Xiao Hua does not go; Zhou and Ye go together to Mao and the rally is stopped (the day not given)); [[w.jian-zhou-enlai]], 567 (Zhou intervenes: Xiao Hua need not attend the rally to be denounced). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 956). To check: [[w.lin-biao-1959-nian]], 171–187 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.35a); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 190–206 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.35b); [[w.zhou-enlai-nianpu-1949]], III, 115 (cited by [[w.jian-zhou-enlai]], 567 n.6). Names: Zhou Enlai, Ye Jianying, Xiao Hua, Jiang Qing, Chen Boda.'
  - edit:
      id: cal.1967-01-19.china-leadership-8
      base: d03fcc94
      set:
        n: '[[w.yang-jisheng-tiandi-fanfu]], I, 387. Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 956). Names: Ye Jianying, Mao Zedong. Check: the day: Yang dates the raid only "that night," after the meeting that ordered Xiao Hua to the stadium rally (the tree''s Jan. 19).'
  - edit:
      id: cal.1967-01-20.china-leadership-5
      base: f551b0d0
      set:
        n: '[[w.yang-jisheng-tiandi-fanfu]], I, 387–388; [[w.jian-zhou-enlai]], 567 (Jan. 20, the army''s leaders at the Jingxi Hotel on whether Xiao Hua should be denounced at a rally, as Jiang Qing and the Group want; Ye Jianying, slamming his palm on a table in the quarrel with Jiang, hurts a finger). Made public: 2007 ([[w.liu-jixian-ye-jianying-nianpu]], II, 956). To check: 一位知情者 (an informed person), 〈讀李曉航文〉, *Jiyi* 《記憶》, no. 21 (Apr. 30, 2009) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 388 n.4); [[w.liu-jixian-ye-jianying-nianpu]], II, 956 (cited by [[w.jian-zhou-enlai]], 567 n.5a); [[w.xu-xiangqian-nianpu]], II, 185 (cited by [[w.jian-zhou-enlai]], 567 n.5b). Names: Huang Yongsheng, Jiang Qing, Ye Jianying, Mao Zedong. Check: the day: Yang has "the next day" after the meeting of Xiao Hua''s summons; an informed person (n.4) says Ye''s blow was aimed at Xu Xiangqian; Yang (I, 426 n.24) gives three accounts of the broken hand: Jan. 29, the Jingxi Hotel with Chen Boda, Huairen Hall.'
