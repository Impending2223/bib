        c: 'Ye Jianying 叶剑英, with Zhou Enlai 周恩来, Nie Rongzhen 聂荣臻 and others, receives the delegates of the officers transferred to civilian work 转业干部 come to Peking 北京, and speaks for the Military Commission at their meeting: relays Zhou''s instruction (no organization of their own; those in Peking to be persuaded home; no return to the army; work reassigned where unsuitable); the transfer of officers to civilian work the army''s tradition and a set system; some errors in placing them possible; the liaison office, leaflets and bulletins of a very few wrong; take the Premier''s instruction home.'
