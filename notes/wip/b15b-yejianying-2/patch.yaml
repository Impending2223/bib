      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 959–960 (Feb. 11, 1967; Huairen Hall 怀仁堂, Zhongnanhai 中南海; Ye Jianying 叶剑英 with Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻 and others against the Cultural Revolution Group 中央文革; to Chen Boda 陈伯达 and Zhang Chunqiao 张春桥: you have thrown the Party, the government, the factories and villages into confusion, and must throw the army too; the Shanghai seizure renamed the Shanghai Commune without the Politburo''s discussion; to Chen Boda, in mockery: we do not read books or papers, nor know the Paris Commune''s principles; explain them)'
