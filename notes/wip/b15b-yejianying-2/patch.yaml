      item: '[[w.liu-jixian-ye-jianying-nianpu]], II, 954–955 (Jan. 11, 1967; Ye Jianying 叶剑英 at the Politburo: "the more disorder in the localities, the steadier the army must be"; seven of the thirteen military regions in the movement, and all 157 army schools; the General Logistics Department 总后 paralyzed, the General Political Department 总政 nearly so, the General Staff 总参 in part, the Navy and Air Force too; the Air Force''s command moved into war shelters; the meeting passes the notice against economism and the message to the Shanghai rebel bodies)'
