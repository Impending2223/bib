    id: cal.1964-12-20.china-leadership
    item: '[[w.jian-zhou-enlai]], 518 (at "another meeting of top leaders in late December," Liu asks whether the essence of the contradictions is a mixture of those among the people and those between us and the enemy; Mao: "anticapitalist in essence"; the day not given, the note citing the Mao chronology, V, 452–453)'
