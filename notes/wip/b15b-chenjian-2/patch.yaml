    item: '[[w.jian-zhou-enlai]], 537 ("In late March," Mao summons Kang Sheng to Shanghai and talks with him three days running: the Peking committee and the Propaganda Department "protected the bad guys," "stood on the side of revisionism," to be dissolved; "if revisionism has emerged at the Party Center, rebellions against it should arise everywhere")'
