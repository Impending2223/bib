    item: '[[w.jian-zhou-enlai]], 519 (Jiang Qing arranges the banquet on Mao''s behalf, on his list of three dozen; Qian Xuesheng, Chen Yonggui, Dong Jiageng and Xing Yanzi at Mao''s table, Liu, Deng and Zhou at the other two; Mao: "We should not just eat but should also talk"; the contradictions inside and outside the Party "not Marxism"; "the danger of revisionism emerging within the party," and "dead silence")'
