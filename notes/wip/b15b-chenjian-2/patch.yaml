    item: '[[w.jian-zhou-enlai]], 518 (at the conference Liu speaks on the movement and Mao interrupts him again and again: "bourgeois" in "new bourgeois elements" the peasants do not understand; against Liu''s wish to drop "rectifying the Party," Mao supports it, millions of members "not true Communists"; Zhou silent; not the day)'
