      thread: china-leadership
      c: 'Zhou Enlai, to a meeting of army commanders of army level and above: with revolutionary committees set up in more provinces the Cultural Revolution would be near a victorious end; military rule to pave the way for "the great unity of the revolutionaries through ''grasping revolution and promoting production''"; "the necessity of creating opportunities for the revolutionary cadres to split with the capitalist roaders."'
      n: '[[w.jian-zhou-enlai]], 570–571 (the note dating the speech). Made public: Check (the speech in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]], undated; [[w.wu-qingtong-zhou-enlai-zai-wenhua-dageming-zhong]], 2013). To check: Zhou''s speech at a meeting of commanders of army level and above, March 13, 1967, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 571 n.26a, n.28); [[w.wu-qingtong-zhou-enlai-zai-wenhua-dageming-zhong]], 92 (cited by [[w.jian-zhou-enlai]], 571 n.26b). Names: Zhou Enlai.'
