- cite:
    id: cal.1966-04-02.china-leadership
    item: '[[w.jian-zhou-enlai]], 537 (on the evening of Apr. 2, two days on, Zhou busy with the Xingtai earthquake: "by consulting with Peng Zhen and Kang Sheng" he will "follow the chairman''s instructions and hold high the banner of proletarian cultural revolution"; "a question concerning the seizure of the leadership position in the cultural sphere"; the Group of Five''s report "is wrong," to be replaced by another Center notice for Mao''s approval)'
