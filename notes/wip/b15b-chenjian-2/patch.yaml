    item: '[[w.jian-zhou-enlai]], 519 (two days after the banquet, "at a Politburo meeting," so Chen: Mao brings the PRC constitution and the Party charter; "Am I a party member? Am I a citizen?"; barred from one meeting and not invited to speak at another; the movement to "expose those capitalist roaders in power"; Liu and Deng at a loss for words)'
