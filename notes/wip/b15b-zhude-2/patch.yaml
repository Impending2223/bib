      entry:
        id: cal.1962-03-04.china-leadership-5
        when: Mar. 4
        date: '1962-03-04'
        place: jinggangshan
        thread: china-leadership
        c: Jinggangshan 井冈山. Zhu De 朱德 meets the old Red Guards 老赤卫队员 of those years, sits with them and asks of their work and life, urging them to carry on the revolutionary tradition and win greater glory. At a forum with the local people he urges handicrafts besides grain.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1828. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C']
  - add:
      entry:
        id: cal.1962-03-04.china-leadership-6
        when: Mar. 4
        date: '1962-03-04'
        time_range: ['1962-03-04T11:00Z', '1962-03-04T14:00Z']
        time_band: evening
        time_zone: Asia/Shanghai
        place: jinggangshan
        thread: china-leadership
        c: 'Jinggangshan 井冈山. Zhu De 朱德, recalling the fighting of those years, in his notebook 笔记本: the forces joined at Jinggangshan in late April 1928 and left it in January 1929; thirty-three years since; the hills opened now as a scenic and an economic area, the traces of battle.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1828. The words: 晚 (1828). Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1962-03-04.china-leadership-7
        when: Mar. 4
        date: '1962-03-04'
        place: jinggangshan
        thread: china-leadership
        c: Jinggangshan 井冈山. Zhu De 朱德 writes the poem "Answering Comrade Chen Qihan's 'On the orchid'" 《答陈奇涵同志〈咏兰〉》 (the hidden orchid of Jinggangshan). Chen Qihan 陈奇涵, general of the People's Liberation Army 中国人民解放军, was with him on the Jiangxi tour and up Jinggangshan (the nianpu's note).
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1828. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1962-03-05.china-leadership-11
        when: Mar. 5
        date: '1962-03-05'
        time_range: ['1962-03-04T22:00Z', '1962-03-05T04:00Z']
        time_band: morning
        time_zone: Asia/Shanghai
        place: jinggangshan
        thread: china-leadership
        c: 'Jinggangshan 井冈山. Zhu De 朱德 visits Mao Zedong''s 毛泽东 old residence at Dajing 大井 and the site of the Red Army''s 红军 clinic. When those with him propose to set his own old room in order for display: no need to restore his room; Chairman Mao''s old home to be well kept and Chairman Mao made known.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1828–1829. The words: 上午 (1828–1829). Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc@C-D']
  - add:
      entry:
        id: cal.1962-03-05.china-leadership-12
        when: Mar. 5
        date: '1962-03-05'
        time_range: ['1962-03-05T04:00Z', '1962-03-05T10:00Z']
        time_band: afternoon
        time_zone: Asia/Shanghai
        place: jinggangshan
        thread: china-leadership
        c: 'Jinggangshan 井冈山. Zhu De 朱德 visits the Jinggangshan revolutionary museum 井冈山革命博物馆. Asked where the Zhu–Mao junction 朱毛会师 took place: at Longshi 砻市, the junction gathering the risings of three provinces at Jinggangshan. At the display of the Red Army''s 红军 "three attacks on Yongxin" 三打永新: the material to be filled out; the attacks destroyed Zhu Peide''s 朱培德 main force and the divisions of Yang Chisheng 杨池生 and Yang Ruxuan 杨如轩, after which the other Nationalist 国民党 forces dared not join in, the key to the base''s and the Red Army''s growth and to the victories over the first three "encirclements." With the museum staff after: a history of Jinggangshan should take in the southern Hunan rising 湘南暴动; after the main force left in 1929 the local forces on the Hunan–Jiangxi border 湘赣边 formed the Twentieth Red Army 红二十军, later the Sixth Army Group 红六军团; he and Mao fought through southern Jiangxi 赣南 and western Fujian 闽西 and made the Central base 中央革命根据地; this to be got clear.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1829. The words: 下午 (1829). Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-I']
  - add:
      entry:
        id: cal.1962-03-05.china-leadership-13
        when: Mar. 5
        date: '1962-03-05'
        place: jinggangshan
        thread: china-leadership
        c: Jinggangshan 井冈山. At the museum's request Zhu De 朱德 writes its name, "Jinggangshan Revolutionary Museum" 井冈山革命博物馆, and the words "the first mountain under heaven" 天下第一山.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1829. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1962-03-06.china-leadership-8
        when: Mar. 6
        date: '1962-03-06'
        place: [jinggangshan, ninggang]
        thread: china-leadership
        c: 'Zhu De 朱德 comes down Jinggangshan 井冈山 from Ciping 茨坪, by Huangyangjie 黄洋界, one of its five passes, where he looks at the pass and the place where grain carried up the hill was rested; reaching Maoping 茅坪, Ninggang 宁冈, he sees the old residence and calls on the widow of the martyr Yuan Wencai 袁文才 and other old revolutionaries. The nianpu''s note: Yuan, of Ninggang, joined the Communist Party 中国共产党 in the first civil war and led the peasants'' self-defense forces; when Mao came up the hill with the Autumn Harvest forces 秋收起义部队 he accepted their reorganization and led the second regiment of the Workers'' and Peasants'' Revolutionary Army 工农革命军; later head of the 32nd regiment of the Fourth Red Army 红四军, chairman of the Hunan–Jiangxi border government 湘赣边界工农兵政府 and chief of staff of the Fourth Red Army; killed January 1930.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1829. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
  - add:
      entry:
        id: cal.1962-03-06.china-leadership-9
        when: Mar. 6
        date: '1962-03-06'
        place: ninggang
        thread: china-leadership
        c: 'Maoping 茅坪, Ninggang 宁冈. Zhu De 朱德 at a forum with local cadres and people, urging handicrafts besides grain: Jinggangshan all bamboo and leaves for rain hats and bamboo goods to be sold; the supply cooperatives to organize the making of local goods as well as buying and selling; opening Jinggangshan of economic value and of great political weight, as the first revolutionary base, made by Chairman Mao.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1829–1830. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@B-D']
  - add:
      entry:
        id: cal.1962-03-06.china-leadership-10
        when: Mar. 6
        date: '1962-03-06'
        place: ninggang
        thread: china-leadership
        c: 'Longshi 砻市, the seat of Ninggang county 宁冈县. Zhu De 朱德 sees the plank bridge of the Zhu–Mao junction, the Longjiang academy 龙江书院 and the junction square, and receives the county''s Party, government and army heads, asking closely about output and the people''s life. He says: work from the facts, seek truth from facts, answer to the people, stand history''s test; to ignore the masses, part from the facts and boast harms Party, state and people, and the boaster too.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-D']
