        c: 'Peking 北京. Zhu De 朱德, at the forty-third session of the National People''s Congress Standing Committee 全国人大常委会: the Central Handicrafts Administration''s 中央手工业管理总局 chief task to manage the collectively owned economy, which has far to grow, its output worth some hundreds of millions; collectives managed not as state concerns but chiefly by themselves; "walking on two legs" 两条腿走路, state-owned industry and collectively owned handicraft cooperatives both, the cooperatives making all the things the people need; the collective economy to last a long time.'
