  - cite: {id: cal.1961-11-07.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1819 (Nov. 7, 1961; Zhu De 朱德, with Yang Shangkun 杨尚昆, Xi Zhongxun 习仲勋 and others, at the reception of Chervonenko 契尔沃年科, the Soviet Ambassador, for the forty-fourth anniversary of the October Revolution)'}
  - add:
      entry:
        id: cal.1961-11-13.china-leadership-6
        when: Nov. 13
        date: '1961-11-13'
        thread: china-leadership
        c: 'Zhu De 朱德 inscribes for the thirtieth anniversary of the death of Deng Yanda 邓演达 (Zesheng 择生): his hard struggle in the Great Revolution 大革命 and his brave death fighting Chiang Kai-shek''s 蒋介石 reactionary clique to be remembered. The nianpu''s note: a democratic revolutionary, of the Tongmenghui 同盟会, dean of the Whampoa academy 黄埔军校 from 1926 and head of the political department of the National Revolutionary Army''s headquarters 国民革命军总司令部政治部; in Europe after the coup of Apr. 12, 1927; founder in 1930 of the Provisional Action Committee of the Guomindang 中国国民党临时行动委员会, forerunner of the Peasants'' and Workers'' Democratic Party 中国农工民主党; seized at Shanghai 上海 in August 1931 and secretly killed at Nanjing 南京 in November.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1819. Names: Zhu De, Chiang Kai-shek.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:chiang-kai-shek']
  - add:
      entry:
        id: cal.1961-11-21.china-leadership-7
        when: Nov. 21
        date: '1961-11-21'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央 and Mao Zedong 毛泽东, sending the material of an inquiry into carrying out the Thirty-five Articles on handicrafts 手工业"三十五条", with proposals: where they were carried out firmly and fast, handicraft output much up, quality rising fast, the members in high spirits; growth uneven over the nation, with resistance in some places; the readjustment of handicrafts to be pressed; in 1958 many skilled handicraftsmen wrongly classed as small proprietors, to be set right; the market towns below the county bound to the villages, their seventy-two trades vital to the peasants; houses fallen in these years to be repaired, and thatch made tile; the towns, their builders and their brick, tile and building materials to be restored; the towns the knot of handicraft and farming; of those cut from the cities, some fit to be sent to the towns'' handicrafts.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1819–1820. Made public: 2016. Names: Zhu De, Deng Xiaoping, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'name:mao-zedong', 'vis:only:prc']
