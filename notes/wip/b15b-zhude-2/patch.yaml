        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 hears the heads of the National Handicrafts Administration 国家手工业管理总局: handicrafts gathered chiefly in the market towns, and only as the towns'' handicrafts grow will the nation''s raw materials all be used; art goods not to be held too tight, family skills allowed and sold by their makers; a ton of grain exported brings only a hundred yuan, a stone figure some hundreds; the cooperatives to bear their own profit and loss and pay a fixed share of profit to the state, the state not taking it all, so that their capital grows.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1818–1819. Made public: 2016. Names: Zhu De.'
