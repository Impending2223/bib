        c: 'Chengdu 成都. Zhu De 朱德 hears Yang Chao 杨超, deputy secretary of the Sichuan committee''s Secretariat 中共四川省委书记处, on Sichuan''s foreign trade and handicrafts: some countries'' handicrafts never matched ours, and capitalism''s growth crushed them; handicrafts are China''s strength, with good craft traditions; craft goods to be developed and exported for foreign exchange, a good bargain.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
