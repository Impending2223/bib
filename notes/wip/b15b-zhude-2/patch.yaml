        when: Mar. 13
        date: '1961-03-13'
        place: canton
        thread: china-leadership
        also: [china]
        c: 'Canton 广州. Zhu De 朱德 at the conference on exports to Hong Kong and Macao 对港、澳出口工作会议, in a speech: of late more trade with the socialist countries, less with the capitalist, which should grow; Hong Kong and Macao 港、澳, free ports near at hand, a good position for exports to the capitalist countries, to be held; mind "import to feed export" 以进养出 and "export to bring imports" 以出带进, both decided by the Center; trade for the long run, with lasting positions; the goods'' sizes and quality to the buyers'' wants; six hundred million pairs of hands can work any wonder.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1800. Made public: 2016. Names: Zhu De.'
