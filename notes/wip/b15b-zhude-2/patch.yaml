        c: 'Neijiang 内江. Zhu De 朱德 hears the heads of the Neijiang prefectural committee 中共内江地委 on their work and on the natural gas reserves of southern Sichuan 川南: Sichuan has many people and many medicinal herbs, and old handicraft trades, bamboo weaving and straw hats; handicrafts and a many-sided economy, sericulture 蚕丝业 among them, to be grown.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1802. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
