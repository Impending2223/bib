        c: 'Neijiang 内江. Zhu De 朱德 inspects the second team of the second brigade of the Zhumu People''s Commune 株木人民公社. At a forum with the peasants: thanks for speaking the truth; a good meeting, no blockade of news, much said from the heart, much learned that is true.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
