        id: cal.1962-03-13.china-leadership-6
        when: Mar. 13
        date: '1962-03-13'
        place: shangrao
        thread: china-leadership
        c: 'Shangrao 上饶. Zhu De 朱德 hears in turn the heads of the Maojialing brigade 茅家岭大队 of the Maojialing People''s Commune 茅家岭人民公社 and of the Shangrao prefectural committee 中共上饶地委. To the prefectural heads: the reclamation farms stay collective and self-supporting, the state only buying their goods; the communes tied to them not to become whole-people ownership nor carry schooling, the old and the young and housing again, but run their own welfare and build their own bridges and roads; Jingdezhen''s kiln firewood to be assured, gathered on the spot in small scattered ways; handicrafts not too concentrated, their traditions kept.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1831. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
