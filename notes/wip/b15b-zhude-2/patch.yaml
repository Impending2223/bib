        c: 'Chengdu 成都. Zhu De 朱德 inspects the Chengdu measuring and cutting tools works 成都量具刃具厂, his third visit there since 1957. On the visit: the country in a time of difficulty from natural calamities and other causes; some take the chance to seize us by the throat, press for debts, blockade, bring pressure, making it harder; the Chinese people are not to be bullied, the greater the pressure the harder they strive; hard struggle the family heirloom; we can learn the lessons and overcome every difficulty.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1801–1802. Made public: 2016. Names: Zhu De.'
