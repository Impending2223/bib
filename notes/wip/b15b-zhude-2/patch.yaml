  - add:
      entry:
        id: cal.1962-04-16.china-leadership-12
        when: Apr. 16
        date: '1962-04-16'
        thread: china-leadership
        c: 'Zhu De 朱德 to Zhou Enlai 周恩来: since the supply and marketing cooperatives 供销合作社 were restored the village economy has livened and goods are bought up faster; the peasants eager to buy shares and run them as their own, a good sign; state commerce and the cooperatives divided not by goods but by ownership, whole-people against collective, trading as equals by contract and rule, on their own accounts, not to be mixed; in a land so wide and peopled, its hill country hard to reach, state commerce alone will not do; only a growing collective economy can lighten the state''s load and make state commerce better.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1834–1835. Made public: 2016. Names: Zhu De, Zhou Enlai.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:zhou-enlai', 'vis:only:prc']
