        c: 'Nanchang 南昌. Zhu De 朱德 talks with the heads of the Party committee of the Damaoshan reclamation farm 中共大茅山垦殖场党委: many-sided operation, which alone can meet the people''s material and cultural needs.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
