  - cite: {id: cal.1962-03-21.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1832–1833 (Mar. 21, 1962; Zhu De 朱德 at the Supreme State Conference 最高国务会议 Liu Shaoqi 刘少奇 chairs on the coming third session of the National People''s Congress; Liu: great economic difficulties, from three years of natural calamities and from faults in work and style, too little investigation, reports too readily believed, democratic centralism not well practiced; difficulties and the bright future both to be seen)'}
  - cite: {id: cal.1962-03-22.china-leadership-10, item: '[[w.zhu-de-nianpu-xinbian]], III, 1833 (Mar. 22, 1962; Zhu De 朱德 presides at the preparatory meeting of the Second National People''s Congress''s third session 第二届全国人大第三次会议预备会议, which elects its presidium and secretary-general and adopts its agenda and the motions committee''s chairman and members)'}
  - cite: {id: cal.1962-03-26.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1833 (Mar. 26, 1962; Zhu De 朱德 at the Politburo 中共中央政治局 on Zhou Enlai''s 周恩来 draft Government Work Report 《政府工作报告》, the carrying out of the 1961 plan and its chief statistics)'}
  - add:
      entry:
        id: cal.1962-03-26.china-leadership-11
        when: Mar. 26
        date: '1962-03-26'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, on his inspection of Jiangxi 江西: Jiangxi has taken the hilltops, hundreds of "Nanniwan" 南泥湾 in the province, a good experience joining the mountains'' resources for the cities, their long working, the training of farm and forest technicians and the settling of workers sent down; the reclamation farms best run as large collectives: the state gave them little, loans of some hundreds of thousands of yuan each, and they now hold ten or twenty million in goods and over 100,000 square meters of buildings, to be let "roll" and grow, their profits not drawn off; large collective ownership fits present output and rouses the workers; the workers feed themselves, no longer count as town people or eat state-sold grain, and supply much farm produce; own accounts, own profit and loss, pay by work, no state guarantee of wages and welfare, their produce bought by contract, not allocated.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1833. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
  - cite: {id: cal.1962-03-27.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1834 (Mar. 27–Apr. 16, 1962; Zhu De 朱德 at the third session of the Second National People''s Congress 第二届全国人大第三次会议 at Peking 北京, presiding at its opening and its closing; it adopts the resolutions on the Government Work Report and on the Standing Committee''s work report)'}
