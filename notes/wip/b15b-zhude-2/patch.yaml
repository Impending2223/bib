        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center''s 中央 departments, proposing support for the Yaohua glass works 耀华玻璃厂 at Qinhuangdao 秦皇岛 as a key producer: he saw it in late July; well founded in plant and skill, but short of some raw materials, its main products will fall far below last year''s; under the eight-character policy, works to be stopped, cut, kept or raised as the case is, and this one to be kept and raised, its goods exports wanted at home and abroad, the soda ash, borax and other materials it needs hard to get but small in amount.'
