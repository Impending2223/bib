        c: 'Nanchang 南昌. Zhu De 朱德 inspects the Red Flag agricultural experimental farm of the Jiangxi People''s Council 江西省人民委员会红旗农业试验场. On the visit: the organs'' production is not ownership by the whole people; its own accounts, its own profit and loss, owned by who invests, unlike the state farms and state commerce, one bargain for all.'
