        when: Mar. 6
        date: '1961-03-06'
        thread: china-leadership
        also: [china]
        c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, a report on Fujian 福建 and Jiangxi 江西: where the Center''s urgent letter of directives on the communes'' present policy 《关于农村人民公社当前政策问题的紧急指示信》 was truly carried out and the rectification of work style and of the communes 整风整社 done, the masses'' zeal much higher, farm output much changed, the members content; Jiangxi''s great gains in opening and building the mountain areas; the southern provinces'' wide and rich mountain areas to be developed, of great political and economic weight for the old base areas and the nation''s building.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1799. Made public: 2016. Names: Zhu De, Mao Zedong.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:mao-zedong', 'vis:only:prc']
