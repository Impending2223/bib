        when: Feb. 10
        date: '1961-02-10'
        place: fuzhou
        thread: china-leadership
        c: Fuzhou 福州. Zhu De 朱德 calls on Chen Shaokuan 陈绍宽, deputy to the Second National People's Congress 第二届全国人大 and vice-governor of Fujian 福建省, once the Nationalists' Minister of the Navy 国民党海军部部长 and commander-in-chief of the navy, who declared for the Communists 中国共产党 on the eve of Fuzhou's fall (the nianpu's note).
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1796–1797. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
