        c: Nanchang 南昌. Zhu De 朱德 hears the heads of the Jiangxi committee 中共江西省委 and of the Jiangxi commerce department 江西省商业厅 on commerce.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1826. Made public: 2016. Names: Zhu De.'
