        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 meets Koba Prea 普莱亚, Mali''s first Ambassador to China. He says: our two countries have established relations and begun trade, and will be good friends, helping and learning from each other; Africa is revolutionary, a great base of national revolution, against imperialism and building its own countries; free now to establish diplomatic and trade relations, you can break imperialism''s unequal trade.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1807–1808. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'polity:mali', 'name:zhu-de', 'vis:only:prc+mali@C-E']
