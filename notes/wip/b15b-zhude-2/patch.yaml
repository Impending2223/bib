        date: '1962-03-10'
        place: nanchang
        thread: china-leadership
        c: 'Nanchang 南昌. Zhu De 朱德 talks with the heads of the Jiangxi committee 中共江西省委: the peasants'' household goods must be rebuilt, an urgent matter; how can they live, or settle in the villages, without them?'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1831. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
