        place: peking
        thread: china-leadership
        also: [china]
        c: 'Peking 北京. Zhu De 朱德 gives a banquet for the Burmese parliamentary delegation. In his speech: the boundary protocol the two Prime Ministers signed at Peking lately a great event, settling the boundary and a shining example of peaceful coexistence and the peaceful settlement of disputes between states of different systems; American imperialism plotting to stir Chiang Kai-shek''s 蒋介石 remnants on the border to sabotage, to intervene in arms in Laos and South Vietnam and rekindle civil war in Laos; the two peoples will smash it.'
