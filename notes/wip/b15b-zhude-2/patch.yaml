        place: longchang
        thread: china-leadership
        c: Longchang 隆昌, Sichuan 四川. Zhu De 朱德 inspects the Longchang natural gas field 隆昌天然气矿. Told that the gas, besides fuel, power and carbon black, can be made into fertilizer, rubber, man-made fiber and other chemical goods, he asks them to produce as much gas as they can and use it fully.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C']
