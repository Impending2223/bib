  - cite: {id: cal.1961-05-09.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1804–1805 (May 9, 1961; Zhu De 朱德 to Mao Zedong 毛泽东 on his inspection of Sichuan, Shaanxi, Henan and Hebei 四川、陕西、河南、河北, with proposals: since the urgent letter and the draft Sixty Articles the masses'' zeal high and household sidelines spreading, their chief fear the policy not kept; Henan better, but over two million still with oedema and disease and many animals dead; the mess halls Sichuan''s "two smokes" 两道烟 and Shaanxi''s "five bads" (short rations, labor and time wasted, no meals in the rain, mush all year); in eastern Henan 豫东 oedema down 40 to 50 percent within a month of letting members cook at home; the three provinces for restoring handicrafts, made state-owned too widely in 1958; the fairs lively, speculation with them, state commerce to lead; blockades between counties and communes to be broken; the ban on long-distance trading to be weighed case by case, peddlers being useful; farming, handicrafts and supply cooperatives one whole)'}
  - variant: {id: cal.1961-05-09.china-leadership, unit: A, witness: w.zhu-de-nianpu-xinbian, reads: 'Zhu De to Mao on his inspection of four provinces, Sichuan, Shaanxi, Henan and Hebei', at: 'III, 1804'}
