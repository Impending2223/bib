        thread: china-leadership
        c: 'Chengdu 成都. Zhu De 朱德 inspects the Qianjin brigade 前进大队 of the Yingmenkou People''s Commune 营门口人民公社, Jinniu district 金牛区. At its bonsai garden, to the local heads: people love beauty, and flower growing has a future; but first the members must eat their fill, and labor be protected.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1803. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-D']
  - add:
