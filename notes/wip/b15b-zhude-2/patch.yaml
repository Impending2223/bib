        c: Nanchang 南昌. Zhu De 朱德 inspects the Jiangxi textile mill 江西纺织厂, the Jiangxi silkworm and mulberry reclamation farm 江西蚕桑垦殖场 and the Nanchang No. 310 works 南昌三一〇厂.
