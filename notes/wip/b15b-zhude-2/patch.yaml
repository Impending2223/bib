      entry:
        id: cal.1961-10-21.china-leadership-6
        when: Oct. 21
        date: '1961-10-21'
        thread: china-leadership
        c: 'Zhu De 朱德 hears Wang Zhen 王震 on output in the Mudanjiang 牡丹江 reclamation area. Told of low yields and many managers: not a question of cutting staff but of output; account on the large scale; more people, not fewer, households enlarged, people fed and goods brought out, surplus managers turned to production. Told that the families may farm odd plots: those who wish to cook for themselves may; the families'' sideline output matters, two-fifths of the people being families; mechanization cannot come at once.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1817–1818. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
