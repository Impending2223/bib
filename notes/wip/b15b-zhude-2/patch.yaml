        when: Mar. 11
        date: '1962-03-11'
        place: jingdezhen
        thread: china-leadership
        c: 'Jingdezhen 景德镇, Jiangxi 江西. Zhu De 朱德 arrives and inspects the Jingdezhen porcelain research institute 景德镇瓷业研究所. To its head: so long as they sell, common wares pay better; fine pieces too, but not many; the institute''s chief task to develop export goods and earn foreign exchange.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1831. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc@C-E']
