        when: Jan. 7
        date: '1962-01-07'
        thread: china-leadership
        c: 'Zhu De 朱德 to Deng Xiaoping 邓小平, for the Center 中共中央, on the production of the organs directly under the Center 中直机关生产: despite difficulties it grows, with large gains; a good joining of town and country, worker and peasant, mental and manual labor; the staff''s spare-time work betters their life and eases the market, and may even supply it; its bases a rear for evacuated people in war.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1823. Made public: 2016. Names: Zhu De, Deng Xiaoping.'
        tags: ['polity:prc', 'name:zhu-de', 'name:deng-xiaoping', 'vis:only:prc']
  - cite: {id: cal.1962-01-11.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1823–1825 (Jan. 11–Feb. 7, 1962; Zhu De 朱德 at the enlarged Central Work Conference 中共中央扩大的工作会议 (the "Seven Thousand Cadres Conference" 七千人大会) at Peking 北京, 7,118 leading cadres of the bureaus, the Center''s departments, the provinces, prefectures, counties, key works and the army, to sum up experience, unify thinking, strengthen democratic centralism, correct the errors since the Great Leap Forward and readjust the economy)'}
  - cite: {id: cal.1962-02-03.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1824–1825 (Feb. 3, 1962; Zhu De 朱德 at the Shandong group 山东组: inner-Party struggle overextended these years, too many hit and hurt, at times confused with clearing out counterrevolutionaries; rehabilitation now to be done well; in mass movements a bias, once begun, runs further, and the "left" is hard to see and to stop; oppose "left" where there is "left," right where there is right, nothing where there is nothing; gentle breeze and mild rain; zeal turned to farming, industry and handicrafts, not by sending hundreds of thousands into battle at once; the peasants to live in peace and work content; the order agriculture, light industry, heavy industry from what we have, not a big plan from above; objective laws not to be broken; contradictions among the people not to be solved as those with the enemy, nor vigilance overdone)'}
