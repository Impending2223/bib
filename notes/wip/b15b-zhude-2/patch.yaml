        c: 'Zhu De 朱德, in his notes 笔记 on the Sichuan 四川 inspection: a full month in Sichuan; since the Center''s "Twelve Articles" 十二条 were relayed, Sichuan moved fast, its handicrafts, private plots and rural fairs restored early; small goods, vegetables and food not short; the fairs lively, the peasants happiest; a market more prosperous than before quite possible, and more handicraft and farm side products could make every peasant household well off.'
