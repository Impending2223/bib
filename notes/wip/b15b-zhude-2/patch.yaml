  - add:
      entry:
        id: cal.1961-10-10.china-leadership-8
        when: Oct. 10
        date: '1961-10-10'
        thread: china-leadership
        c: '*Renmin ribao* 《人民日报》 prints Zhu De''s 朱德 "Recollections of the 1911 Revolution" 《辛亥革命回忆》: a fuller bourgeois-democratic revolution than any before, which overthrew the last dynasty of two thousand years of monarchy, but did not do the anti-imperialist and anti-feudal tasks, the Republic soon a name only under the Beiyang warlords and then the Guomindang; its failure, beside the strength of imperialism and reaction, from the weakness of its bourgeois leadership, the Tongmenghui 同盟会 an alliance of many tendencies, even Sun Yat-sen''s 孙中山 wing not seeing imperialism as the chief enemy nor relying on the masses; a bourgeois republic shown impossible in China; only the proletariat could lead; he himself came to the new revolutionary road under the October Revolution''s influence.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1815–1817. To check: [[w.de-zhu-de-xuanji-selected]] (the nianpu: the article is collected in *Zhu De xuanji* 《朱德选集》). Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de']
