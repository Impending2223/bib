        c: Peking 北京. Zhu De 朱德 presides at the forty-seventh session of the Second National People's Congress Standing Committee 第二届全国人大常委会第四十七次会议, which takes up the State Council's 国务院 proposal and decides on a special pardon for the war criminals of the Chiang Kai-shek 蒋介石 clique and of Manchukuo 伪满洲国 truly reformed after a period of remolding.
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1820. Names: Zhu De, Chiang Kai-shek.'
        tags: ['polity:prc', 'name:zhu-de', 'name:chiang-kai-shek']
  - add:
      entry:
        id: cal.1961-12-16.china-leadership-9
        when: Dec. 16
        date: '1961-12-16'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, at the forty-seventh session of the National People''s Congress Standing Committee 全国人大常委会: the Party has been lenient with war criminals for over ten years; some call it "boundless leniency," wrongly; for war criminals as for other prisoners, education and remolding first, to change their thought and conduct; once changed, the people should forgive them.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1820. See [[cal.1961-12-16.china-leadership-8]]. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1961-12-19.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1820–1821 (Dec. 19, 1961; Zhu De 朱德 presides at the forty-eighth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第四十八次会议, which hears Zhou Enlai 周恩来 on the world situation)'}
  - cite: {id: cal.1961-12-20.china-leadership-11, item: '[[w.zhu-de-nianpu-xinbian]], III, 1821 (Dec. 20, 1961; Zhu De 朱德 at Mao Zedong''s 毛泽东 meeting of the Politburo Standing Committee and the bureaus'' first secretaries, which hears Zhou Enlai 周恩来 and Deng Xiaoping 邓小平 on the coming work conference; Mao: the detours chiefly the Center''s fault, the high targets, estimates, procurement and distribution and the great drives in water works, transport and pig farms all its decisions and all wrong, and a precious asset)'}
  - cite: {id: cal.1961-12-20.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1821 (Dec. 20, 1961–Jan. 10, 1962; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 on the situation at home and abroad, the 1962 plan and the long-term plans and Party work, preparing the enlarged work conference)'}
  - add:
      entry:
        id: cal.1961-12-22.china-leadership-5
        when: Dec. 22
        date: '1961-12-22'
        place: peking
        thread: china-leadership
        also: [china]
        c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference''s 中共中央工作会议 East China and Northeast groups 华东、东北组: in building socialism the fraternal countries should exchange and help each other; China''s help to others always selfless, and of great use to Asia, Africa and Latin America; helping the weak strikes the strong, imperialism to be beaten only as the colonies and semicolonies stand up; China now to rely wholly on itself, still seeking foreign aid; walking on two legs; foreign trade a weighty question, the factories idle for want of raw materials; "import to feed export" 以进养出 on a large scale, 100,000 tons of cotton and rayon imported this year and woven for sale would earn back the money for wheat; five million handicraft workers restored would make some tens of billions of yuan a year, to make up the shortage of foreign exchange.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1821. See [[cal.1961-12-20.china-leadership]]. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - cite: {id: cal.1961-12-23.china-leadership-2, item: '[[w.zhu-de-nianpu-xinbian]], III, 1822 (Dec. 23, 1961; Zhu De 朱德 replies to Trường Chinh 长征, Chairman of the DRV National Assembly''s Standing Committee, wholly backing the stand of the Assembly''s appeal of Oct. 27, 1961 to the world''s parliaments, for unifying Vietnam and against America''s armed intervention in the South)'}
  - cite: {id: cal.1961-12-25.china-leadership-9, item: '[[w.zhu-de-nianpu-xinbian]], III, 1822 (Dec. 25, 1961; Zhu De 朱德 presides at the forty-ninth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第四十九次会议, which discusses the deputies'' visits to the villages and the cities and sets the Congress''s third session for Mar. 5, 1962, at Peking 北京)'}
  - add:
      entry:
        id: cal.1961-12-26.china-leadership-7
        when: Dec. 26
        date: '1961-12-26'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, interjecting in the Central Work Conference''s 中共中央工作会议 discussion: China''s light industry and handicrafts have a base and can grow, supplying the home market and exporting for foreign exchange; with every peasant bringing out one thing there would be plenty; to say China cannot be rich makes no sense; the peasants to bring out goods and we ours, in equal exchange and fair trade; expropriating the peasants will not do.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1821–1822. See [[cal.1961-12-20.china-leadership]]. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
