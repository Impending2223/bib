        c: 'Baoji 宝鸡, Shaanxi 陕西省. Zhu De 朱德 arrives and inspects the 212 instrument works 二一二仪表厂. Told that the workers, in technical innovation, made a "one cutter, many edges" 一刀多刃 tool and a "many-headed drill" 多头钻 and turned out "top products" 尖端产品, he says: by your own strength you broke through in hard times and made top products; remarkable.'
