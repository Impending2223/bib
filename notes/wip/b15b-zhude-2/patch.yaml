  - cite: {id: cal.1961-05-21.china-leadership, item: '[[w.zhu-de-nianpu-xinbian]], III, 1806 (May 21–June 12, 1961; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "Peking work conference" 北京工作会议), which draws up the revised draft Sixty Articles 《农村人民公社工作条例（修正草案）》, the "Forty Articles on commerce" 商业四十条, the "Thirty-five Articles on handicrafts" 手工业三十五条 and the nine measures to cut the town population and town grain sales 《关于减少城镇人口和压缩城镇粮食销量的九条办法》; the supply cooperatives to keep their own accounts, cooperative shops and peddlers restored, rural fairs opened, purchase contracts for farm products; the town population cut by over 20 million in three years, 10 million this year; the year''s steel cut from 20 million tons to 11 million; Mao Zedong 毛泽东, closing, criticizes himself, the fight on the right should not have been carried to the masses, and those wrongly criticized and punished after Lushan to be reviewed and cleared)'}
  - add:
      entry:
        id: cal.1961-05-31.china-leadership-5
        when: May 31
        date: '1961-05-31'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 speaks at the Central Work Conference 中共中央工作会议 on restoring the economy: the peasants look back fondly on 1957, when the higher cooperatives'' work was on track; after 1958 things were thrown into disorder; the chief question now grain; works and cooperatives wrongly merged to be restored, works taken by levelling and transfer returned; the market towns'' teahouses, wine shops and eating houses, which the peasants much need, to be reopened; the peasants'' surplus grain not to be bought up by the state but left to meet the towns'' own needs.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1806. See [[cal.1961-05-21.china-leadership]]. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-06-06.china-leadership-12
        when: June 6
        date: '1961-06-06'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference 中共中央工作会议, on farming and cutting the town population: the conference has found a good way with grain, quotas fixed below with a margin, so that output grows and the peasants have hope; grain to the household, members cooking for themselves, saves grain; the buying of farm and side products too rigid and too narrow, and its prices unreasonable, the year''s fruit crop up but little of it bought; two years of wheat and rice for the cities, which clash in the south, so some coarse grains to be grown; draft animals and tools lost, the forces of production damaged; the market towns'' smiths and masons to be organized fast to help the peasants set up house; the villages to take in the 20 or even 30 million sent down from the towns, a great political task, ownership to be set right and those sent down well settled, or there will be trouble in town and country.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1806–1807. See [[cal.1961-05-21.china-leadership]]. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
  - add:
      entry:
        id: cal.1961-05-26.china-leadership-6
        when: May 26
        date: '1961-05-26'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 meets Josef Hegen 墨根 (so printed), the new Ambassador of the German Democratic Republic. In the talk the Ambassador: the Long March moved the young revolutionaries of his day, and Zhu De''s name was a banner of their movement. Zhu De, on farm cooperation: cooperatives to be run democratically, and the peasants will run them well; with the peasants'' life bettered, output steadies and the state gets more farm products.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1807. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'polity:gdr', 'name:zhu-de', 'vis:only:prc+gdr@C-E']
  - add:
