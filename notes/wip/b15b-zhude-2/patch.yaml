  - cite: {id: cal.1961-12-01.china-leadership-4, item: '[[w.zhu-de-nianpu-xinbian]], III, 1820 (Dec. 1, 1961; Zhu De 朱德 presides at the forty-sixth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第四十六次会议, which puts off the Congress''s third session to 1962)'}
