        date: '1961-05-27'
        place: peking
        thread: china-leadership
        c: 'Peking 北京. Zhu De 朱德 meets Kobina Kesse 克西, Ghana''s first Ambassador to China. He says: Africa is being liberated, a great advance; your independence helps us; our experience in winning independence and liberation can be passed on to you; after so many years of imperialist rule Africa''s people will rise against it; unity is strength, Africa''s people should unite.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1807. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'polity:ghana', 'name:zhu-de', 'vis:only:prc+ghana@C-G']
