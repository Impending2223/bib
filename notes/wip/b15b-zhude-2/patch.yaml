  - cite: {id: cal.1961-07-29.china-leadership-5, item: '[[w.zhu-de-nianpu-xinbian]], III, 1811 (July 29, 1961; Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, sending the material of an inquiry into handicrafts in Peking''s suburbs 《关于北京市郊区手工业情况的调查材料》: the villages'' handicrafts and sidelines of great promise, if labor is well placed and pay fair, the key small contracts for jobs and household responsibility in farming 小段包工和家庭责任制, to free time for them; the Peking urban communes'' enterprises, on unified accounts and sharing profit and loss, repeat the "levelling and transfer" 一平二调 error, separate accounts better, the communes taking 10 to 15 percent of a profitable works'' earnings as a building fund; their wages and welfare in disorder, which separate accounts would let each works set right)'}
