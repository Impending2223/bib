      entry:
        id: cal.1962-03-08.china-leadership-9
        when: Mar. 8
        date: '1962-03-08'
        place: jian
        thread: china-leadership
        c: 'Ji''an 吉安. Zhu De 朱德 hears the heads of the Ji''an prefectural committee 中共吉安地委 and interjects: "heaven makes all things to feed man"; with people there is food, nature''s dialectic; vegetables and rice together feed best, no need of meat; the towns to have food for sale; grain must pass muster; at Jinggangshan no more land to be opened, chiefly timber worked into half-made and made goods, and medicinal herbs gathered; collective and whole-people ownership kept apart.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'name:zhu-de', 'vis:only:prc']
