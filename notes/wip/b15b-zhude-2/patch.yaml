        date: '1962-02-22'
        place: nanchang
        thread: china-leadership
        c: 'Nanchang 南昌. Zhu De 朱德 inspects the farm of the Liantang agricultural research institute 南昌莲塘农业科学研究所农场 and the Jiangxi general reclamation farm 江西垦殖总场. To the head of the Liantang farm: more handicrafts; only handicrafts joined to farming make output grow, as handicrafts have always served farming.'
