        id: cal.1962-03-12.china-leadership-5
        when: Mar. 12
        date: '1962-03-12'
        thread: china-leadership
        c: 'Zhu De 朱德 inspects the Damaoshan reclamation farm 大茅山垦殖场, Jiangxi 江西. Told that the cadres have reaped a double harvest of thought and output: cadres must be able to go up and down, be officials and plain people, and be both lettered and soldierly; he urges them to make the farm a socialist commodity base of the state.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1831. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc@B-C']
