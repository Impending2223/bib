  - add:
      entry:
        id: cal.1961-06-23.china-leadership-9
        when: June 23
        date: '1961-06-23'
        thread: china-leadership
        also: [china]
        c: 'Zhu De 朱德 to Zhou Enlai 周恩来 and Chen Yun 陈云, for the departments concerned, on the North China Pharmaceutical Works 华北制药厂 at Shijiazhuang 石家庄 and the Baoding chemical fiber works 保定化学纤维厂: the pharmaceutical works short above all of maize and wrapping paper, needing 85,000 tons of maize this year and allotted 35,000; its heads say 3,000 tons of maize made into medicines and glucose for export buy back 18,000 tons; maize imported by the import corporation and worked up for export would keep the works going and earn foreign exchange, an "import to feed export" 以进养出 trade, its by-products for the home market; the fiber works trying rayon from cotton-stalk bark, which if it succeeds could give 2 million tons a year from the nation''s stalks; small rough pulp mills in the mountain areas for the fiber and paper works; the big cities'' industrial grain, at Shanghai 上海, Tianjin 天津, Peking 北京 and in Guangdong 广东, may be dealt with the same way.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1809–1810. Made public: 2016. Names: Zhu De, Zhou Enlai, Chen Yun.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'name:zhou-enlai', 'name:chen-yun', 'vis:only:prc']
