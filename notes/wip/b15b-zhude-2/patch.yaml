        c: 'Zhu De 朱德, passing Anfu county 安福县 on the way to Ji''an, hears the heads of its committee 中共安福县委. On medicinal herbs: the state cannot handle them all; pharmacies to be set up in the brigades, selling medicines and buying herbs.'
        n: '[[w.zhu-de-nianpu-xinbian]], III, 1830. Made public: 2016. Names: Zhu De.'
        tags: ['polity:prc', 'ok:fields-place', 'name:zhu-de', 'vis:only:prc']
