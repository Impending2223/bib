    set:
      time: 1965-05-28T08:20Z
      time_zone: Asia/Shanghai
      n: '[[w.zhou-enlai-nianpu-1949]], II, 732–33 (May 28–29, 1965); [[w.zhou-enlai-waijiao-huodong]], 456 (May 28, 1965; afternoon, by special plane from Peking with Chen Yi to Guangzhou; 6:20 p.m., Baiyunshan Hotel (白云山宾馆), the first talks with Subandrio, with Chen Yi; 10 p.m. to 3:20 a.m., Baiyunshan Hotel, the second talks, Zhou on the Americans'' lack of preparation, "gradual escalation" and Taylor and Johnson as pragmatists); [[w.zhou-enlai-waijiao-huodong]], 457 (May 29, 1965; 9 a.m., Baiyunshan Hotel, the third talks with Subandrio; on the second Asian–African conference (the book''s words: all despised the first, now all want in; difficult but of high market value; a great struggle inside and outside the U.N.)); [[w.zhonghua-renmin-gongheguo-waijiao]], 30 (May 28–29, 1965; Subandrio''s visit, May 28–29; Zhou and Chen Yi''s talks with him); [[w.zhonghua-renmin-gongheguo-waijiao]], 30 (May 28–29, 1965; Zhou''s four points on Vietnam and his remarks on the second Afro-Asian Conference); [[w.77-conversations-between-chinese]], [85–86](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=83) (doc. 11; Guangzhou, May 28, 1965, no hour: Zhou to Subandrio, the U.S. rushing in unprepared, its ''gradual escalation'', Taylor and Johnson as ''extreme pragmatists''; 14 million South Vietnamese facing 200,000 Americans, China fifty times as many; the four-sentence statement of Maowu (Bogor) repeated; 85 n.130, 86 n.131). Made public: 1993. The time is the first day''s. Names: Zhou Enlai, Chen Yi, Subandrio.'
