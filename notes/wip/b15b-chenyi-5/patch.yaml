      c: 'The memorial tower to the martyrs of the Huaihai campaign 淮海战役烈士纪念塔 at Xuzhou 徐州, Jiangsu 江苏, is finished (it opens on Nov. 6, the campaign''s seventeenth anniversary). Its inscription is Chen Yi''s 陈毅: the campaign of Nov. 6, 1948, to Jan. 10, 1949, around Xuzhou, sixty-five days of fighting, five army groups, twenty-two armies and fifty-six divisions of the enemy, over 555,000 men, destroyed.'
      n: '[[w.chen-yi-nianpu]], 1126. Names: Chen Yi. Check: the day the tower was finished: the nianpu enters it under Oct. 1, 1965, without its own date.'
