      c: At the Foreign Ministry's Red Guard meeting in the ministry's small auditorium, Peking 北京, Chen Yi 陈毅 says he has spoken much since the Politburo's enlarged meeting in May and will go on; he is ready to be dismissed, removed, jailed; he has written no wall poster; one poster cannot settle him; posters say his words do not match the *Renmin ribao* 人民日报 editorials, and he does not change his view; as Foreign Minister he lives by judging the situation, but this Cultural Revolution he did not foresee and does not understand.
      n: '[[w.chen-yi-nianpu]], 1174–1175. Names: Chen Yi.'
