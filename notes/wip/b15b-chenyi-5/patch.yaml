      n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "Recently, Algeria sent Yazid to visit China"; Chen Yi''s account of his words to Yazid, on dollars and the United States). See [[cal.1965-06-05.china-leadership-5]]. The time is the first day''s. Names: Chen Yi, Yazid, Ben Bella, Zhou Enlai, Hồ Chí Minh. Check: the day; the record has only "recently" on June 15, and Liu Shaoqi received Yazid June 5. Check: the year the Archive posted the document.'
