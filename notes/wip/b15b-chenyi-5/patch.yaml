      when: Aug. 23
      date: '1966-08-23'
      thread: china-leadership
      c: The Politburo meets, Mao Zedong 毛泽东 presiding. When the Central Cultural Revolution Group's members press for Liu Shaoqi 刘少奇 to go to Tsinghua University 清华大学 to "explain his problems" to the students, Chen Yi 陈毅 rises to say that Liu's errors can be settled within the Politburo, and that sending him to Tsinghua would leave him no way down; when Liu agrees to go and asks Wang Renzhong 王任重 to help draft his speech, Chen Yi rises again to oppose it.
      n: '[[w.chen-yi-nianpu]], 1162. The account is Bo Yibo''s 薄一波, present (the nianpu''s note: Bo Yibo, "Huiyi Chen Yi tongzhi de er san shi" 《回忆陈毅同志的二三事》, *Renmin ribao* 人民日报, June 30, 1988, p. 5). Made public: 1988 (Bo Yibo''s article). To check: Bo Yibo, "Huiyi Chen Yi tongzhi de er san shi" 《回忆陈毅同志的二三事》, *Renmin ribao*, June 30, 1988, p. 5 (cited by [[w.chen-yi-nianpu]], 1162 n.1). Names: Chen Yi, Mao Zedong, Liu Shaoqi, Bo Yibo.'
      tags:
      - polity:prc
      - name:chen-yi
      - name:mao-zedong
      - name:liu-shaoqi
      - name:bo-yibo
