      when: Oct., after the 28th
      date: 1966-10
      at: after 1966-10-28
      thread: china-leadership
      c: After the Central Work Conference, Chen Yi 陈毅 has the leading men of the East China provinces and cities, Chen Pixian 陈丕显, Ye Fei 叶飞, Li Baohua 李葆华, Wei Wenbo 魏文伯, Tan Qilong 谭启龙 and others, to dinner at his home, and tells them to hold to principle whatever the difficulty, not to be grass on a wall bending with the wind; Marx had his Bernstein, Stalin his Khrushchev; now some praise Chairman Mao so high, when his prestige needs no such praising; history repeats itself, and if he (the nianpu names no one) does not turn traitor, Chen Yi's name is not Chen.
      n: '[[w.chen-yi-nianpu]], 1168–1169. Made public: 1995. Names: Chen Yi, Mao Zedong, Khrushchev.'
