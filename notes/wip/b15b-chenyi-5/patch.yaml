      id: cal.1966-09.china-leadership-28
      when: Sept., late
      date: 1966-09
      at: before 1966-09-21
      thread: china-leadership
      c: 'At the State Council''s summing-up meeting, reporting on the movement in the foreign affairs system, Chen Yi 陈毅 gives his understanding of the Cultural Revolution: like earlier movements, to clear up thinking and reform unsound systems for a rich country and a strong army; in the foreign affairs system he pressed criticism and self-criticism, posters against the leaders, himself first, to help them "wash and come downstairs"; the Party groups'' members, himself among them, made self-criticisms; not one leading cadre overthrown, all can pass.'
      n: '[[w.chen-yi-nianpu]], 1166. Made public: 1995. Names: Chen Yi.'
      tags:
      - polity:prc
      - name:chen-yi
      - ok:fields-place
      - vis:only:prc
- add:
    entry:
      id: cal.1966-09.china-leadership-29
      when: Sept.
      date: 1966-09
      thread: china-leadership
      c: 'At a meeting of all the staff of the Foreign Affairs Office, Chen Yi 陈毅 asks sharply where those who would "negate everything" put Chairman Mao''s leadership and line; to "overthrow everything," every Party committee above the county, leaves no great, glorious and correct Party: some want to wreck the Party; beware the plot.'
      n: '[[w.chen-yi-nianpu]], 1166. Made public: 1995. Names: Chen Yi.'
      tags:
      - polity:prc
      - name:chen-yi
      - name:mao-zedong
