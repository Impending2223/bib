      n: '[[w.teiwes-tragedy-of-lin-biao]], 187 ("early (?) this year"). Made public: 1993 ([[w.lin-biao-1959-nian]]; [[w.weixun-wo-suo-zhidaode-ye]]). To check: [[w.lin-biao-1959-nian]], 135 (cited by [[w.teiwes-tragedy-of-lin-biao]], 187 n.48a); [[w.weixun-wo-suo-zhidaode-ye]], 223 (cited by [[w.teiwes-tragedy-of-lin-biao]], 187 n.48b) (Mao''s blessing). See [[cal.1960.china-leadership-3]]. Names: Ye Qun, Lin Biao, Mao Zedong. Check: the time of year; the book queries "early."'
