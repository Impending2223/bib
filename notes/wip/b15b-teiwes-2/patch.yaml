      when: '1960'
      date: '1960'
      thread: china-leadership
      c: Mao Zedong 毛泽东 singles out Lin Biao 林彪 and Deng Xiaoping 邓小平 as future successors.
      n: '[[w.teiwes-tragedy-of-lin-biao]], 187 ("about this year"; the authors take it to mean after the older Liu Shaoqi). Made public: 1996 ([[w.teiwes-tragedy-of-lin-biao]], from an interview). To check: a Party historian specializing on Lin Biao, interview by Teiwes and Sun, as they report it (cited by [[w.teiwes-tragedy-of-lin-biao]], 187 n.47). See [[cal.1965.china-leadership-23]]. Names: Mao Zedong, Lin Biao, Deng Xiaoping.'
