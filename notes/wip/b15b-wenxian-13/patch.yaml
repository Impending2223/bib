- add:
    entry:
      id: cal.1960-09-03.china-leadership-7
      when: Sept. 3
      date: '1960-09-03'
      thread: china-leadership
      c: 'Xi Zhongxun 习仲勋 to Deng Xiaoping 邓小平 and the Center 中共中央, a report on the organs and staff of the Center''s departments and their streamlining 《关于中央各部门机构编制情况和精简意见的报告》: the departments, parties and bodies 401,000 staff, 241,000 of them in Peking 北京, up 147,000, 58 percent, since the streamlining of 1957; a streamlining group of the central state organs under him; to finish early in October.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 572–580 (a passage left out by the editors, n.1; printed with the Center''s comment of Sept. 14, 1960; printed from the Center''s document). Made public: 1996. Names: Deng Xiaoping.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:deng-xiaoping
      - ok:fields-place
- add:
    entry:
      id: cal.1960-09-11.china-leadership-10
      when: Sept. 11
      date: '1960-09-11'
      thread: china-leadership
      c: 'The State Planning Commission''s and the Labor Ministry''s Party groups 国家计划委员会党组、劳动部党组 to the Center 中共中央 and Mao 毛泽东, a report on the present arrangement of labor in town and country and on workers'' wages 《关于当前劳动力安排和职工工资问题的报告》: the great fault in the use of labor too little of it in farming, above all in grain.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 592–607 (printed with the Center''s directive of Sept. 26, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1960-10-10.china-leadership-7
      when: Oct. 10
      date: '1960-10-10'
      thread: china-leadership
      c: 'The national conference of finance and trade secretaries 全国财贸书记会议, its minutes on doing the autumn and winter grain work firmly 《关于坚决做好秋冬粮食工作的讨论纪要》: from July 1 to the end of September the state bought 29.5 billion jin of grain, 11.7 billion less than a year before, and sold 24 billion, 1.2 billion more, where the plan called for 4 billion less; stocks 33.6 billion jin, 16.7 billion below last September''s.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 644–648 (printed with the Center''s comment of Oct. 16, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-15.china-leadership-9
      when: Oct. 15
      date: '1960-10-15'
      thread: china-leadership
      c: 'The Building Ministry''s Party group 建筑工程部党组 to the Center 中共中央 and Mao 毛泽东, a report on solving the cities'' housing problem 《关于解决城市住宅问题的报告》: the state''s housing since liberation 163 million square meters of floor by the end of 1959; Peking''s 北京 new housing 11 million, almost as much as it had before.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 656–659 (printed with the Center''s comment of Oct. 28, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
      - ok:fields-place
- add:
    entry:
      id: cal.1960-11-10.china-leadership-13
      when: Nov. 10
      date: '1960-11-10'
      thread: china-leadership
      c: 'The Center''s five-man group on cutting cadres and arranging labor 中央精简干部和安排劳动力五人小组, a report on the central organs'' sending down ten thousand cadres to the basic levels 《关于中央一级机关抽调万名干部下放基层情况的报告》: by Nov. 9 10,176 named, 7.33 percent of the central organs'' 138,000-odd cadres; 1,673 Party cadres of grade 17 and above, 9.95 percent.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 697–701 (printed with Mao''s comment of Nov. 15, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-11-12.china-leadership-8
      when: Nov. 12
      date: '1960-11-12'
      thread: china-leadership
      c: 'The Liaoning committee 辽宁省委, an urgent directive to its city and county committees and the provincial Party groups, reported to the Center 中共中央, on arranging the present market 《关于安排好当前市场的紧急指示》: the market good on the whole, but with many problems that will anger the masses unless settled at once.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 723–728 (printed with the Center''s comment of Nov. 24, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-11-25.china-leadership-10
      when: Nov. 25
      date: '1960-11-25'
      thread: china-leadership
      c: 'The Gansu committee 甘肃省委 to the Center 中共中央 and the Northwest Bureau 西北局, its fourth report on carrying out the Emergency Directive Letter 《关于贯彻中央紧急指示信的第四次报告》: its three-level cadre conference dug at the roots of the "communist wind" that kept returning; the committee''s own errors examined, as in July and early October.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 730–741 (printed with the Center''s comment of Nov. 28, 1960; printed from the Center''s document). Made public: 1996. See [[cal.1960-11-20.china-leadership-2]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-12-13.china-leadership-10
      when: Dec. 13
      date: '1960-12-13'
      thread: china-leadership
      c: 'The Hunan committee 湖南省委 to the Central-South Bureau 中南局, the Center 中共中央 and Mao 毛泽东, a request to change the size of the basic accounting unit 《关于改变基本核算单位规模的请示》: at its three-level cadre conference the counties called the brigades too big; of 16,254 brigades over 6,800 have more than 500 households; those over 300 to 400 households, or scattered, may be made smaller, as most members wish.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 784–786 (printed with the Center''s reply of Dec. 21, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
