      n: '[[w.zhou-enlai-nianpu-1949]], II, 339 (Aug. 10, 1960); [[w.dikotter-maos-great-famine]], 108 n.1 (Zhou Enlai, Li Fuchun and Li Xiannian put in charge of foreign trade almost at once after the recall of the Soviet experts in July 1960); [[w.jian-zhou-enlai]], 455 (Aug. 10, the Center''s two instructions, one for foreign trade and farming); [[w.jian-zhou-enlai]], 459 (Beidaihe, August 1960: a three-person foreign trade command, Zhou, Li Fuchun and Li Xiannian, under Zhou; Zhou proposes shifting trade from the Soviet bloc to the West and Japan). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 512–515). To check: Jin Chongji, ed., Zhou Enlai zhuan, 1398 (cited by [[w.dikotter-maos-great-famine]], 108 n.1); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 516–526, 512–515, 527–536 (cited by [[w.jian-zhou-enlai]], 455 n.54). Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
