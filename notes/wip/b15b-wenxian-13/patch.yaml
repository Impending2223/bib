      date: '1960-03-22'
      thread: china-leadership
      c: 'The Shandong committee 山东省委 forwards the Licheng 历城 county committee''s report to its prefectural, city and county committees and communes, and to the Center 中共中央: "very good, worth reading twice"; the "five many" and "five few" a bureaucratic, routinist style found everywhere; leaders to spend four months a year below.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 145–146 (printed with the Center''s directive of Mar. 30, 1960; printed from the Center''s document). Made public: 1996. See [[cal.1960-03-14.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
