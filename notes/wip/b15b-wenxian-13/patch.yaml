      date: '1960-02-02'
      thread: china-leadership
      c: 'The Agriculture Ministry''s Party group 农业部党组 to the Center''s Rural Work Department 中央农村工作部, the Center 中共中央 and Mao 毛泽东, a report on the national agricultural science research conference 《关于全国农业科学研究工作会议的报告》 the Chinese Academy of Agricultural Sciences 中国农业科学院 held Dec. 1–20, 1959: of 3,825 research projects of 1959, 3,326 done by the end of October, 87 percent.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 53–58 (printed with the Center''s comment of Mar. 8, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
