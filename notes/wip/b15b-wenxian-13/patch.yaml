      when: Feb. 18
      date: '1960-02-18'
      thread: china-leadership
      c: 'Li Xiannian 李先念 to the Center 中共中央, a report on shipping grain, oil and cotton at once and setting up a shipping command 《关于立即突击调运粮油棉和成立调运指挥部的报告》: the disaster areas and the big cities short of grain, the stocks of Peking 北京, Tianjin 天津, Shanghai 上海 and Liaoning 辽宁 thin; a shock drive, grain first on the railways and waterways.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 29–31 (printed with the Center''s comment of Feb. 21, 1960; printed from the Center''s document). Made public: 1996. See [[cal.1960-02-15.china-leadership-7]]. Names: Li Xiannian.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-xiannian
