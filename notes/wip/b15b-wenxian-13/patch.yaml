- edit:
    id: cal.1960-03-22.china-leadership
    base: 9d5ff6ea
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 105–108 (the Center''s comment of Mar. 22, from Mao''s draft, printed from the Central Committee document: Anshan, the largest enterprise in the country with over 100,000 staff, held before 1958 that it was modern and needed no technical revolution, opposed mass movements and the "two participations, one reform, three-in-one", favored one-man management and held the "Magnitogorsk constitution" sacred; in 1959 it began to doubt; its report of July 1959, which Mao had printed for the Lushan meeting, backed the Leap and the fight on Rightism; its report of Mar. 1960 is the third stage, an "Anshan constitution" for the Far East; to be passed to big and medium enterprises and city committees and studied through 1960); [[w.mao-zedong-zhuan]], V, ch. 66 n.6 (Anshan''s report on technical innovation and technical revolution forwarded; manuscript of Mar. 22). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 109–124). Check: the wengao gives no place for the comment; the Center issued it as a document dated Mar. 22. To check: Anshan Municipal Committee, report of Mar. 11, 1960, via the Liaoning Provincial Committee, on the movement for technical innovation and technical revolution on the industrial front (cited by [[w.jianguo-yilai-mao-zedong]], XV, 106 n.1); Anshan Municipal Committee, report of July 25, 1959 on Anshan steel''s current production, the mass movement and the August work plan (cited by [[w.jianguo-yilai-mao-zedong]], XV, 108 n.5); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Anshan municipal committee''s report on the technical innovation and technical revolution movement (manuscript 手稿), Mar. 22, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.6). Names: Mao Zedong.'
- edit:
    id: cal.1960-03-22.china-leadership-2
    base: d3fd1539
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 255–258 (the comment on the Pakistan embassy''s telegram, written two days before the Tianjin meeting; 5 percent, at most 10 percent; the Delhi pavilion''s 3.5 million visitors; given to those on the train); [[w.jianguo-yilai-mao-zedong]], XV, 109–113 (Mar. 22, 1960; the comment with its two annexes: of 2.7 billion people some 270 million are against China; of China''s 650 million at most 65 million against the Party; over 3.5 million visited the pavilion at New Delhi; Mao puts the anti-China chorus at ten years or more, perhaps the last forty years of the century); [[w.mao-zedong-zhuan]], V, ch. 66 n.11 ("On the anti-China question": about 5 percent, 10 at most, anti-China; the rest of the world for China or not against or briefly deceived; manuscript of Mar. 22; Mao says later (n.12) the Pakistan fair gave him the idea). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 125–128). To check: Chinese Embassy in Pakistan, report of Mar. 14, 1960 to the Foreign Ministry, the Foreign Trade Ministry and the International Trade Promotion Committee on China''s part in the East Pakistan industrial and agricultural exhibition (50,000 visitors by that day) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2a); Renmin ribao, Mar. 17, 1960, the correspondent''s dispatch on the closing of the China pavilion at the New Delhi world agricultural fair (Feb. 29; 81 days, over three million visitors) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2b); Mao Zedong 毛泽东, "On the anti-China question" 《关于反华问题》 (manuscript 手稿), Mar. 22, 1960; in [[w.mao-zedong-wenji]], VIII, 181, 188–189 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.11). Names: Mao Zedong.'
- edit:
    id: cal.1960-03-23.china-leadership-3
    base: f9331c08
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 116–120 (Mar. 23, 1960, printed from the Central Committee document, with Mao''s manuscript); [[w.mao-zedong-zhuan]], V, ch. 66 n.2 (the Center''s circular drafted by Mao forwarding the Shandong six-level cadre conference bulletin: its problems surely in every province; the Zhengzhou resolution and the Shanghai meeting''s eighteen points forgotten; "levelling and transfers" repaid in full, the worst removed, big embezzlers prosecuted; most communes good; manuscript of Mar. 23). [[w.yang-jisheng-mubei]], I, 443 (Mao''s comment on bulletin no. 2, quoted from the Mao wengao vol. 9; n.10); [[w.yang-jisheng-mubei]], II, 1139 n.60 (the Center''s comment of Mar. 23 on the Shandong six-level cadre conference and its directive of Mar. 30 against bureaucratism, after which some areas begin the "three antis" in the villages, as the Center''s directive of May 15, 1960 recounts them, n.60 citing [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378–383); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378 (the Center''s directive of May 15, 1960 on the "three antis" names the comment of Mar. 23 on the Shandong six-level cadre conference); [[w.yang-jisheng-tiandi-fanfu]], I, 81 (the Center''s comment on the Shandong six-level cadre meeting). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 129–139). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong six-level cadre conference secretariat, Huiyi qingkuang no. 2, Mar. 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 118 n.3); Zhengzhou huiyi jilu (record of the enlarged Politburo meeting at Zhengzhou, Feb. 27-Mar. 5, 1959: the meeting summary, Mao''s speech, and the draft regulations on the management system of the people''s communes) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 119 n.4); Minutes of the enlarged Politburo meeting at Shanghai, Mar. 25-Apr. 1, 1959, "Eighteen questions on the people''s communes", adopted at the Seventh Plenum of the Eighth Central Committee, Apr. 2–5, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 120 n.5); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Shandong Provincial Committee''s bulletin on its six-level cadre conference (manuscript 手稿), Mar. 23, 1960; in [[w.mao-zedong-wenji]], VIII, 163–164 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.2). See [[cal.1960-03-22.china-leadership-5]]. Names: Mao Zedong.'
- edit:
    id: cal.1960-03-30.china-leadership-2
    base: 0e13b1f6
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 30, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 136–139 (the directive printed from Mao''s manuscript, with his covering note of 2 a.m., Mar. 30, to Liu, Zhou, Zhu De, Peng Zhen, Yang Shangkun, Xi Zhongxun, Tan Zhenlin, Liu Lantao, Li Fuchun, Bo Yibo, Li Xiannian and Lu Dingyi, for changes, to go out by telegram by Apr. 5; the Licheng county report of Mar. 14: 184 meetings, 56 telephone conferences, 1,074 documents and 599 returns in the 70 days from Jan. 1 to Mar. 10; the Center to issue a directive on the "three antis" in early April; the Center itself to answer for the "five many, five few"); [[w.yang-jisheng-mubei]], II, 1139 n.60 (the directive of Mar. 30 against bureaucratism, after the comment of Mar. 23 on Shandong''s six-level conference, as the Center''s directive of May 15, 1960 recounts them, n.60 citing [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378–383); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378 (the Center''s directive of May 15, 1960 on the "three antis" names the directive of Mar. 30 against bureaucratism); [[w.yang-jisheng-tiandi-fanfu]], I, 81 (the directive against bureaucratism; parts of the country begin the "three antis" in the villages); [[w.peng-zhen-nianpu-1902]], IV, 12 (Mar. 30, 1960; Peng Zhen receives Mao''s draft; Mao on it: amend it if need be; to go out by telegram by Apr. 5; "请尚昆办"). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 143–150). To check: Licheng County Committee, report of Mar. 14, 1960 to the Jinan Municipal and Shandong Provincial Committees on carrying out the provincial committee''s instruction on six-level cadres meeting in the fields (cited by [[w.jianguo-yilai-mao-zedong]], XV, 139 n.4); Shandong Provincial Committee, circular of Mar. 22, 1960 forwarding the Licheng report to all localities (cited by [[w.jianguo-yilai-mao-zedong]], XV, 139 n.5). Names: Mao Zedong.'
