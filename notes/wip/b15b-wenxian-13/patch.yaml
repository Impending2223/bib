      when: Aug. 1
      date: '1960-08-01'
      thread: china-leadership
      c: 'The Center''s General Office 中共中央办公厅 sends Qi Yanming''s 齐燕铭 report on favoring senior cadres and senior intellectuals in Peking 北京 with non-staple foods to the Center''s departments, the State Council''s organs, the courts, the Academy of Sciences 中国科学院 and the Peking committee 北京市委: the Secretariat 中央书记处 agrees, to be carried out at once.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 686 n.1. Made public: 1996. See [[cal.1960-07-30.china-leadership-6]].'
