    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XV, 355 (Oct. 12, 1960; the directive, quoted and dated by the Wengao''s note, 355 n.4, after Mao''s 毛泽东 reading). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 639–642). To check: Secretariat, draft directive forwarding the Hubei and Fujian Party committees'' two documents, issued by the Center Oct. 12, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 355 n.4). See [[cal.1960-10-12.china-leadership-3]]. Check: whether the first edition''s notes (vol. 9, 1996) give it; the directive''s number and recipients.'
- edit:
    id: cal.1960-11-09.china-leadership-6
    base: dcde2550
    set:
      n: '[[w.yang-jisheng-mubei]], II, 1171 (the book''s chronology, in its entry of July 30); [[w.yang-jisheng-mubei]], I, 625 (the Center''s forwarding Nov. 9 of Qi Yanming''s report of July 30, with the comment that its plan and views apply in principle everywhere; the Center''s change of "care in non-staple supply" to "special supply"). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 682–686). To check: Central Committee document of Nov. 9, 1960 forwarding an extract of Qi Yanming''s report of July 30 (quoted by [[w.yang-jisheng-mubei]], II, 1171; no note). See [[cal.1960-07-30.china-leadership-6]].'
