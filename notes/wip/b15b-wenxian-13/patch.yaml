      n: '[[w.yang-jisheng-mubei]], II, 732. Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 59–79). To check: Central Committee, "Guanyu chengshi renmin gongshe wenti de zhishi" 《關於城市人民公社問題的指示》, Mar. 9, 1960; All-China Federation of Trade Unions party group 全國總工會黨組, "Guanyu Haerbin shi Xiangfang renmin gongshe fazhan qingkuang de baogao" 《關於哈爾濱市香坊人民公社發展情況的報告》, Feb. 22, 1960; Henan Provincial Committee 河南省委, "Guanyu chengshi renmin gongshe gonggu he fazhan qingkuang de baogao" 《關於城市人民公社鞏固和發展情況的報告》, Feb. 28, 1960 (all three named by [[w.yang-jisheng-mubei]], II, 732; the reports'' days as [[w.jianguo-yilai-mao-zedong]], XV, 70 n.2, gives them). See [[cal.1960-03-08.china-leadership]]. Check: Made public: [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 481 (1996), as [[cal.1960-03-08.china-leadership]] cites it, gives the directive''s issue on Mar. 9.'
- edit:
    id: cal.1960-03-18.china-leadership-5
    base: 00435fd8
    set:
      n: '[[w.yang-jisheng-mubei]], II, 1169–1170 (the book''s chronology of the famine). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 80–89). To check: Central Committee document of Mar. 18, 1960 sending out "The rural public mess halls of eight provinces," "The rural public mess halls of Henan province" and "The public mess halls of the whole country at the end of 1959," with Mao''s note (named by [[w.yang-jisheng-mubei]], II, 1169–1170; no note). Check: the book gives the day only, and the Center''s text is not in it. See [[cal.1960-03-15.china-leadership-2]] (Mao''s comment, dated Mar. 15). Names: Mao Zedong.'
- edit:
    id: cal.1960-11-14.china-leadership-3
    base: 5eeaf2af
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 369 (Nov. 14, 1960); [[w.yang-jisheng-mubei]], II, 1172 (the directive of Nov. 14 on gathering and making food substitutes, which followed the national conference of Nov. 10); [[w.yang-jisheng-mubei]], II, 960 (the Center sends the Academy of Sciences party group''s proposal of Nov. 9 out to the country on Nov. 14); [[w.chen-yun-nianpu-xiuding]], III, 53 (the directive: rations and meat and oil reduced in two years; the new substitutes, maize-root flour, wheat-root flour, maize-stalk flour, acorn flour, leaf protein, artificial meat extract, chlorella, scenedesmus; leaves, grasses, wild plants, stalks and roots to be gathered and stored). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 687–692). Names: Zhou Enlai, Li Fuchun, Li Xiannian, Tan Zhenlin.'
- edit:
    id: cal.1960-11-15.china-leadership-2
    base: 068697dc
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.macfarquhar-origins-of-the-cultural]], III, 12 (the "five styles" directive); [[w.jianguo-yilai-mao-zedong]], XV, 401–405 (Nov. 15, 1960; the directive, dated by the Center Nov. 15, from Mao''s manuscript: Wang Renzhong''s report, Mianyang 沔阳 county''s summary and the Tonghaikou commune report sent for reference; the ''five winds'' to be corrected within months, the ''communist wind'' first; the Center to call the secretaries in early or mid-December; and Mao''s note of the same day: to Zhou, Zhu De, Li Fuchun, Tan Zhenlin, Li Xiannian and Chen Boda, then Li Fuchun to handle; too long to telegraph, to be printed and sent at once, not to Tibet or Xinjiang); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao drafts for the Center the directive to the bureaus and committees with Wang Renzhong''s papers on Hubei and Mianyang: the five winds, the communist wind first, to be put right in a few months). [[w.yang-jisheng-mubei]], II, 806 n.58 (Mao drafts the directive Nov. 15, sending Wang Renzhong''s report, the Mianyang county summary and the Tonghaikou commune''s report on its new state; the five winds to be put right within months, the "communist wind" first; the provinces to be called to report in early or mid-December). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 693–694). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 66), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.zhongguo-baike-nianjian-1981]], 563 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.10); Wang Renzhong, second secretary of the Central-South Bureau and first secretary of the Hubei Party committee, report of Nov. 12, 1960 to Tao Zhu and Mao Zedong, "On correcting the ''five winds''" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 402 n.1); Mianyang County Party Committee, "Summary of the first stage of carrying out policy", Nov. 3, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 403 n.2); Ma Jie 马杰, first secretary of the Mianyang County Party Committee, report of Nov. 9, 1960, "The changes in Tonghaikou commune after carrying out the policy" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 404 n.3). Names: Mao Zedong, Wang Renzhong.'
- edit:
    id: cal.1960-11-15.china-leadership
    base: 1bfe940f
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 398–400 (Nov. 15, 1960; Mao''s comment to Zhou Enlai, the morning of Nov. 15 (十五日晨), on the report of Nov. 10 of the Center''s five-man group: 10,176 cadres of the central organs to be sent down, 7.33 percent, for three years as a rule; those who go must have the will not to fear hardship, else they must not go; Zhou to decide; printed from the manuscript); [[w.macfarquhar-origins-of-the-cultural]], III, 403 (in November 1960 Mao lays the poor conditions of a third of the countryside to bad elements); [[w.yang-jisheng-mubei]], II, 834–835 (Nov. 10, the five-man group''s report on drawing ten thousand cadres from the central organs; Nov. 15, Mao''s comment on it, and his note on the same report to Zhou: for a time speak at length of the bad third of the country; bad men in power, beating and killing, grain down, hunger, the democratic revolution not complete, feudal forces); [[w.mao-zedong-zhuan]], V, ch. 66 n.62 (Nov. 15, Mao''s letter to Zhou Enlai on the ten thousand cadres, with the notes on the report: one third of the country bad, to be told; five months to turn it; the harvest of 1961). [[w.yang-jisheng-mubei]], II, 1138 n.59 (Mao''s comment of Nov. 15, 1960 on the report on sending ten thousand cadres down: for a stretch to speak at length of the bad third of the places, with bad men in power, beatings and deaths, grain down, hunger, the democratic revolution not finished and feudal forces rampant); [[w.yang-jisheng-tiandi-fanfu]], I, 82 ("a time to speak much of the bad situation in a third of the places: bad men in power, beatings and deaths, grain down, hunger, the democratic revolution not finished, the feudal forces at work"). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 695–701). Check: Mao''s second comment on the report, under ''speak at length of the situation'' (XV, 398–399): the fine situation in two-thirds of the country, a bad one in a third; within five months the whole to be turned around, for a great harvest in 1961; it is not in `c`. Check: Li Jian''s account, as Yang Jisheng gives it, has Mao write the comment "in the investigation report" on Nov. 15 (I, 74); Yang''s own text puts it on the Nov. 10 report on sending down the central cadres (II, 834), which [[w.jianguo-yilai-mao-zedong]], XV, 398–400, also gives. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 66), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: Central Committee five-man group on cutting staff and placing labor, report of Nov. 10, 1960, "On the central organs'' drawing of ten thousand cadres to be sent down to the basic levels" (10,176 settled by Nov. 9, 7.33 percent of the central organs'' cadres) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 399 n.1); [[w.jin-1949-1989-niande-zhongguo]], 534–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 403 n.26); Mao Zedong 毛泽东, letter to Zhou Enlai 周恩来 and notes on the report on sending 10,000 cadres of the central organs down (manuscript 手稿), Nov. 15, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.62); [[w.zedong-jianguo-yilai-mao-zedong]], IX, 349 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 82 n.104). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Xiao Hua.'
