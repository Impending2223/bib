      when: Mar. 11
      date: '1960-03-11'
      thread: china-leadership
      c: 'The Anshan 鞍山 municipal committee, a report on the movement for technical innovation and technical revolution on the industrial front 《关于工业战线上的技术革新和技术革命运动开展情况的报告》: the movement now led and planned, aimed at the key problems of output, from semi-mechanization and mechanization toward automation, and at precision and advanced products.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 110–124 (printed with the Center''s comment of Mar. 22, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
