      when: July 15
      date: '1960-07-15'
      thread: china-leadership
      c: 'Li Fuchun 李富春 and Bo Yibo 薄一波, "Main measures for industrial and transport output in the third quarter of 1960" 《关于一九六〇年第三季度工业交通生产中的主要措施》: to reverse the fall in the main products since the second quarter; the "loose" and "scattered" in industrial management to end; capital construction cut, output kept; steel, iron, coal and transport pushed up.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 498–511 (printed with the Center''s approval of Aug. 5, 1960; printed from the Center''s document). Made public: 1996. Names: Li Fuchun, Bo Yibo.'
