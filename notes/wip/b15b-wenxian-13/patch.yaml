      date: '1960-11-03'
      thread: china-leadership
      c: 'The Center''s directive on carrying out the Emergency Directive Letter 《中共中央关于贯彻执行“紧急指示信”的指示》: the key to raise the thinking of the cadres, above all at county and commune level, and their grasp of economic theory and policy, the three red banners held high.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 677–681 (printed from the Center''s document). Made public: 1996. See [[cal.1960-11-03.china-leadership]].'
