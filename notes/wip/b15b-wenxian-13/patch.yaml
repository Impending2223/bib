      when: Mar. 28
      date: '1960-03-28'
      thread: china-leadership
      c: 'The Shanghai 上海 municipal committee to the Center 中共中央 and Mao 毛泽东, a report on the movement for technical innovation and technical revolution on the industrial front 《关于工业战线技术革新、技术革命运动的情况报告》: since January a mass movement centered on mechanization and semi-mechanization, fast, wide and deep, from new tools to new techniques, materials and precision products.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 219–237 (printed with the Center''s comment of Apr. 10, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
