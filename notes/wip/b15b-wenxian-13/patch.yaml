    base: a003c235
    set:
      n: '[[w.mao-zedong-zhuan]], V, ch. 66 n.24 (the directive''s date; the note to Mao''s wish, Apr. 30, that it go out in early May). [[w.yang-jisheng-mubei]], II, 1139 n.60 (the directive, unnamed in the text: since the Center''s comment of Mar. 23 on Shandong''s six-level cadre conference and its directive of Mar. 30 against bureaucratism, some areas have begun the "three antis" in the villages; the struggle is an important aspect of the struggle between the two roads); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378–383 (the directive, dated May 15, 1960, as printed; read at 378–379). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378–383). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Check: the directive''s text; the book gives its title and date only.'
