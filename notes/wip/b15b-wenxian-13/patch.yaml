      when: Apr. 29
      date: '1960-04-29'
      thread: china-leadership
      c: The Center 中共中央 approves the minutes of the industrial secretaries' conference on ten questions of industry and transport and sends them to the Shanghai Bureau 上海局, the cooperation regions' committees 各协作区委员会, the provincial committees and the Center's departments, to be carried out at once.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 355 n.1. Made public: 1996. See [[cal.1960-04-24.china-leadership-14]].'
