      date: '1960-04-17'
      thread: china-leadership
      c: 'The State Council Finance and Trade Office 国务院财贸办公室 to the Center 中共中央, a report on emergency measures for shipping grain 《关于紧急调运粮食的几项措施的报告》, settled with the Grain, Railways and Communications ministries on the 14th to carry out the Center''s forwarding of Apr. 12: a national telephone conference on the 15th; the second quarter''s grain shipments for Peking 北京, Tianjin 天津, Shanghai 上海, Liaoning 辽宁 and the disaster areas; other goods to give way.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 304–306 (printed with the Center''s comment of Apr. 19, 1960; printed from the Center''s document). Made public: 1996. See [[cal.1960-04-12.china-leadership-7]].'
