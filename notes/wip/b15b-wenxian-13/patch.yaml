      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 4, 1960, and notes 23–24. [[w.jianguo-yilai-mao-zedong]], XV, 55–57 (the Center''s comment on the Guizhou report, written Mar. 4 in the draft, issued Mar. 6); [[w.jianguo-yilai-mao-zedong]], XV, 62–63 (Mao to Liu and Deng, 4 a.m., Mar. 4, with the three drafts); [[w.yang-jisheng-mubei]], II, 1169 (Mao''s comment of Mar. 4 on the Guizhou committee''s mess-hall report, sent out as a Central document Mar. 6 with "all the country to copy it, no exception"); [[w.mao-zedong-zhuan]], V, ch. 66 n.7 (the Guizhou report forwarded, the Center''s comment for all to copy without exception and a large conference on the mess halls in the spring; manuscript of Mar. 4). [[w.yang-jisheng-mubei]], I, 568 (the Center''s comment of Mar. 4 forwarding Guizhou''s report, quoted from the Mao wengao vol. 9; the book''s "copy it nationwide without exception"; n.9). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 43–44). Check: note 2 (XV, 57) says the Center forwarded the Guizhou report on Feb. 26; Mao''s draft comment is dated Mar. 4 and the note at 56 says it issued Mar. 6. To check: Guizhou Provincial Committee, report of Feb. 24, 1960 on the present state of the rural public mess halls (cited by [[w.jianguo-yilai-mao-zedong]], XV, 56 n.2a); Central Committee, circular of Feb. 26, 1960 forwarding the Guizhou report to provincial, municipal and regional committees (as the note states) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 57 n.2b); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Guizhou Provincial Committee''s report on the rural public mess halls (manuscript 手稿), Mar. 4, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.7). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
