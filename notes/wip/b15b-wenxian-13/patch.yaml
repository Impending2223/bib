      when: Aug. 15
      date: '1960-08-15'
      thread: china-leadership
      c: 'The State Planning and Capital Construction Commissions'' Party groups 国家计划委员会党组、国家基本建设委员会党组 to the Center 中共中央 and Mao 毛泽东, measures for shortening the front of capital construction to secure output 《关于缩短基本建设战线保证生产的措施》: the front too long, plans with gaps, projects outside the plan, no room left; the projects to stop or wait stopped at once.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 539–543 (printed with the Center''s approval of Aug. 19, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
