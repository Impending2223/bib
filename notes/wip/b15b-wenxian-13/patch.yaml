      date: '1960-08-23'
      thread: china-leadership
      c: The Textile Industry Ministry's Party group 纺织工业部党组 to the Center 中共中央 and Mao 毛泽东, a request on the course of the textile industry 《关于纺织工业发展方针的请示报告》, after the national meeting of textile department and bureau heads in May, at which Li Xiannian 李先念 spoke.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 558–564 (printed with the Center''s comment of Sept. 1, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong, Li Xiannian.'
