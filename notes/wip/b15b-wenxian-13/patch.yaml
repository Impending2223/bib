      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 18, 1960; [[w.jianguo-yilai-mao-zedong]], XV, 247–252 (June 18, 1960; Mao''s 毛泽东 text ''Ten-Year Summary'' 十年总结, dated 8 a.m. June 18, written in two hours, he says, for his talk that afternoon at the Shanghai 上海 meeting; printed from the typeset copy in the Central Archives (a manuscript exists)); [[w.yang-jisheng-mubei]], II, 1170–1171 (during the Shanghai meeting Mao writes the "Ten-Year Summary" 《十年總結》, beginning to own the error of the high targets of the years before); [[w.mao-zedong-zhuan]], V, ch. 66 n.40 (Mao writes the "Ten-Year Summary" early on June 18, in two hours: eight years of copying the foreign, and from the "Ten Great Relationships" of 1956 a line of China''s own; the book also gives judgments of it the editors call wrong). [[w.jian-zhou-enlai]], 454 ("Ten Year Summary," handed out on the last day: "I myself have committed many mistakes"; the Second Five-Year Plan''s goals, set under Zhou, leave three years'' room); [[w.chen-yun-nianpu-xiuding]], III, 38 (the "Ten-Year Summary": the Peking meeting of January 1959, called to cut the steel target again, left Mao and Chen Yun uneasy; 30 million tons at Beidaihe in August 1958, 20 million at Wuchang in December, 16.5 million at Shanghai in April 1959, 13 million at Peking in May). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 418–421). To check: *Jianguo yilai Mao Zedong wengao*, the "Ten-Year Summary"; Mao Zedong 毛泽东, "Ten-Year Summary" 《十年总结》 (manuscript 手稿), June 18, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.40); [[w.zedong-jianguo-yilai-mao-zedong]], IX, 213–216 (cited by [[w.jian-zhou-enlai]], 454 n.49). Names: Mao Zedong.'
