    entry:
      id: cal.1960-02-25.china-leadership-6
      when: Feb. 25
      date: '1960-02-25'
      thread: china-leadership
      c: 'The Guangdong committee 广东省委, an instruction to the Canton 广州 and Hainan 海南 committees and the prefectures, cities and counties, reported to the Center 中共中央 and Mao 毛泽东, on some problems in present commune work 《关于当前人民公社工作中几个问题的指示》: after Tao Zhu''s 陶铸 and Hu Qiaomu''s 胡乔木 inspection of Shunde 顺德 county and the provincial agriculture office''s survey of nineteen communes, the communes sound, but problems of the passage to commune ownership, the commune-level economy, distribution and the cadres'' style.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 34–42 (printed with the Center''s comment of Mar. 5, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong, Tao Zhu.'
