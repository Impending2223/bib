- add:
    entry:
      id: cal.1960-01-14.china-leadership-3
      when: Jan. 14
      date: '1960-01-14'
      thread: china-leadership
      c: 'The State Council 国务院 decides on strengthening comprehensive financial planning 《国务院关于加强综合财政计划工作的决定》: the budget and the funds outside it, credit and cash brought into one comprehensive financial plan and balanced; each province, autonomous region and city under the Center to draw one up with its 1960 economic plan.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 12–14 (printed from the State Council''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-16.china-leadership-6
      when: Jan. 16
      date: '1960-01-16'
      thread: china-leadership
      c: 'The Center and the State Council 中共中央、国务院 notify the setting up of a Spare-Time Education Committee 业余教育委员会 the State Council''s organ guiding spare-time education 《关于建立业余教育委员会的通知》: Lin Feng 林枫 its chairman; Zhang Jichun 张际春, Liao Luyan 廖鲁言 and Li Jiebo 李颉伯 vice-chairmen; 18 members.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 15–16 (printed from the *Renmin ribao* of Feb. 23, 1960). Made public: [[w.renmin-ribao]], Feb. 23, 1960.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-16.china-leadership-7
      when: Jan. 16
      date: '1960-01-16'
      thread: china-leadership
      c: 'The Center approves the State Science and Technology Commission Party group''s 国家科委党组 report on the 1960 science and technology plan and sends it out for action 《中共中央对国家科委党组〈关于一九六〇年科学技术发展计划的报告〉的批示》: the plan part of the economic plan, to be fulfilled and exceeded; the Commission to review the long-range plan in the first half of the year and set the tasks for 1961–62 and the Third Five-Year Plan.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 17–18 (printed from the Center''s document; the report not printed, n.1). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-18.china-leadership-5
      when: Feb. 18
      date: '1960-02-18'
      thread: china-leadership
      c: 'The Center and the State Council 中共中央、国务院 direct on vegetable work 《关于当前蔬菜工作的指示》: 1959 a great victory, the cities and mining districts mostly self-sufficient in vegetables; spring vegetables now to be pressed, their sown area kept, with water, manure, specialist teams and better tools, and the whole year''s supply arranged.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 21–23 (printed from the *Renmin ribao* of Feb. 18, 1960).'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1960-03-19.china-leadership-11
      when: Mar. 19
      date: '1960-03-19'
      thread: china-leadership
      c: 'The Center forwards the Agriculture Ministry Party group''s 农业部党组 report on the national agricultural work conference 《中共中央转发农业部党组〈关于全国农业工作会议的报告〉》 and agrees with it: the committees to press the fight against drought, the care of the wheat fields and the spring sowing.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 95–101 (the forwarding note, 95; the report, 95–101; printed from the Center''s document). Made public: 1996. See [[cal.1960-03-07.china-leadership-12]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-19.china-leadership-12
      when: Mar. 19
      date: '1960-03-19'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Building Ministry Party group''s 建筑工程部党组 report of Mar. 9 on the harm of industrial waste water 《关于工业废水危害情况和加强处理利用的报告》 to the committees of the industrial and mining districts'' small and middle cities: badly handled it fouls the waters and harms health and fish; well handled it gives back oil, phenol, cyanide and alkali.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 102–108 (the comment, 102–103; the report of Mar. 9, after a field conference at Wuhan 武汉 late in 1959 with the Health and Agriculture ministries, 103–108; printed from the Center''s document). Made public: 1996. See [[cal.1960-03-09.china-leadership-14]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1960-05-27.china-leadership-13
      when: May 27
      date: '1960-05-27'
      thread: china-leadership
      c: The Center 中共中央 forwards the Finance Ministry Party group's 财政部党组 report on adjusting the 1960 budget and pressing revenue and economy, 《关于调整一九六〇年国家预算和大力组织国家收入、节约不必要的支出的报告》, and agrees to set the budget at 78.1 billion yuan, for every region to carry out.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 213 n.2. Made public: 1996. To check: the Finance Ministry Party group''s report and the Center''s forwarding (cited by [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 213 n.2). See [[cal.1960-03-30.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-04-02.china-leadership-9
      when: Apr. 2
      date: '1960-04-02'
      thread: china-leadership
      c: 'The Center approves the Education Ministry Party group''s 教育部党组 report of Mar. 4 on rural literacy and spare-time education in the last four months and sends it out 《中共中央对教育部党组关于农村扫盲、业余教育情况和今后工作方针任务报告的批示》. The report: by February 132 million in the villages in literacy and spare-time study, 66 percent of the young and middle-aged, against 50 million in October 1959.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 214–216 (the comment, 214–215; the report in summary, 215–216 n.1; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-04-10.china-leadership-6
      when: Apr. 10
      date: '1960-04-10'
      thread: china-leadership
      c: 'The Center forwards the Shanghai municipal committee''s 上海市委 report of Mar. 28 on the technical innovation and technical revolution movement in industry 《中共中央批转上海市委〈关于工业战线技术革新、技术革命运动的情况报告〉》: a good summing-up, its problems general, its tasks fit for every region; to go on to every city and enterprise committee.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 217–237 (the comment, 217–218; the report, 219–237; printed from the Center''s document). Made public: 1996. See [[cal.1960-03-28.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1960-04-19.china-leadership-9
      when: Apr. 19
      date: '1960-04-19'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the State Council Finance and Trade Office''s 国务院财贸办公室 report of Apr. 17 on emergency measures for shipping grain 《关于紧急调运粮食的几项措施的报告》, to be carried out at once: in the fifty days to two months before the new grain, 5.6 billion jin to be shipped in the second quarter, 2.4 billion by the end of April; other goods to give way to grain.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 303–306 (the comment, 303; the report, 304–306; printed from the Center''s document). Made public: 1996. See [[cal.1960-02-21.china-leadership-5]]. See [[cal.1960-04-17.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-04-24.china-leadership-14
      when: Apr. 24
      date: '1960-04-24'
      thread: china-leadership
      c: 'Peking 北京. The conference of the provincial, municipal and regional Party committees'' industrial secretaries 省、市、区党委工业书记会议, Apr. 11–24, with 31 cities'' secretaries and the State Council''s 国务院 industry and transport Party groups, closes. Its minutes on ten questions of industry and transport 《关于当前工业交通战线上的十个问题》: half the year''s output in the first half; new techniques; coal, iron and transport by the "small native groups"; industry to support farming; labor and wages; cadres; management; four such conferences a year. Bo Yibo''s 薄一波 report for the State Economic Commission''s Party group 国家经济委员会党组 agreed to.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 355–375 (printed from the Center''s document). Made public: 1996. See [[cal.1960-04-23.china-leadership-4]]. Names: Bo Yibo.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:bo-yibo
      place: peking
- add:
    entry:
