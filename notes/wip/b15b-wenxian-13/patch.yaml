      when: July 24
      date: '1960-07-24'
      thread: china-leadership
      c: 'Yilong 仪陇, night. Zhou Yi 周颐, for the Sichuan committee 四川省委, reports by telephone on rural labor and the "three antis" at Nanbu 南部 and Yilong, which he passed through that day 《关于南部、仪陇两地农村劳动力问题和“三反”情况的电话报告》: labor drawn off the fields into commune plants, service trades and grain stations, cadres'' kin placed there; after the clearing, in one management district of Jianxing 建兴, Nanbu, farm labor up from 56 to 76 percent.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 547–550 (printed with the Center''s directive of Aug. 20, 1960; printed from the Center''s document). Made public: 1996.'
