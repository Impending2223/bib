      when: May 10
      date: '1960-05-10'
      thread: china-leadership
      c: 'The State Planning, Capital Construction and Economic Commissions'' Party groups 国家计划委员会党组、国家基本建设委员会党组、国家经济委员会党组 to the Center 中共中央 and Mao 毛泽东, a report on the "second account" of the 1960 plans for industry, transport and capital construction 《关于一九六〇年工业生产、交通运输、基本建设计划第二本帐安排的报告》: in fact the Party''s first account, for use within; steel 20.4 million tons.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 407–414 (printed with the Center''s agreement of May 30, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
