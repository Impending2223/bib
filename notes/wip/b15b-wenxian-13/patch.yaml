      when: Feb. 13
      date: '1960-02-13'
      thread: china-leadership
      c: 'The Petroleum Industry Ministry''s Party group 石油工业部党组 to the Premier, Vice-Premiers Li and Bo and the Center 中共中央, a report on the Songliao 松辽 exploration 《关于东北松辽地区石油勘探情况和今后工作部署问题的报告》: a great oilfield of 200 square kilometers proved at Daqing 大庆 (once Datong 大同镇), Zhaozhou 肇州 county, Heilongjiang 黑龙江; recoverable reserves put at over 100 million tons, about Karamay''s 克拉玛依; the wells some 12 tons a day each.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 25–28 (printed with the Center''s comment of Feb. 20, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
