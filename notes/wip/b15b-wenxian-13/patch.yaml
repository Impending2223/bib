      when: Feb. 22
      date: '1960-02-22'
      thread: china-leadership
      c: 'The All-China Federation of Trade Unions'' urban people''s commune group 全总城市人民公社组, "The development of the Xiangfang people''s commune of Harbin" 《哈尔滨市香坊人民公社的发展情况》, from its survey in January: an industrial district of Harbin 哈尔滨, its commune built round the Harbin bearing plant and other large factories since September 1958; three state factories, fifteen local state factories and forty-two commune factories.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 61–78 (sent to the Center by the Federation''s Party group 中华全国总工会党组 Feb. 23, and printed with the Center''s comment of Mar. 9, 1960; printed from the Center''s document). Made public: 1996.'
