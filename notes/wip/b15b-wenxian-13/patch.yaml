      when: Mar. 14
      date: '1960-03-14'
      thread: china-leadership
      c: 'The Licheng 历城 county committee to the Jinan 济南 committee and the Shandong committee 山东省委, a report on carrying out Shu Tong''s 舒同 call for six levels of cadres to meet in the fields 《关于贯彻执行省委六级干部会师到田指示的报告》: its own "five many, five few": many meetings, few visits to the masses; many documents and forms, few summings-up; much sitting in offices, little investigation; much routine, little study; many general calls, little detailed organization.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 147–150 (printed with the Shandong committee''s forwarding of Mar. 22 and the Center''s directive of Mar. 30, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
