      when: Mar. 9
      date: '1960-03-09'
      thread: china-leadership
      c: 'The Building Ministry''s Party group 建筑工程部党组 to the Center 中共中央, a report on the harm of industrial waste water 《关于工业废水危害情况和加强处理利用的报告》, after a field conference at Wuhan 武汉 late in 1959 with the Health 卫生部 and Agriculture 农业部 ministries: phenol in the river at Fulaerji 富拉尔基 24 milligrams a liter, against a hundredth for fish; on the lower Nen 嫩江 fishermen took up over 1.2 million jin of dead fish in five days last spring.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 103–108 (printed with the Center''s comment of Mar. 19, 1960; printed from the Center''s document). Made public: 1996.'
