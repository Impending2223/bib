      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1960-05-15.china-leadership-9
      when: May 15
      date: '1960-05-15'
      thread: china-leadership
      c: 'The Center''s directive on arranging rural labor 《中共中央关于农村劳动力安排的指示》: the young and strong drawn too far into capital construction, the fields left short; Hebei''s 河北 winter rule (a third each to the fields and manure, to forestry, side lines, commune industry and haulage, to water works) for all; over the year at least 60 to 65 percent of full labor to farming and herding, 80 percent in the busy seasons; eight hours'' sleep and four for meals and rest kept.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 384–387 (printed from the Center''s document). Made public: 1996. See [[cal.1960-05-09.china-leadership-5]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-15.china-leadership-10
      when: May 15
      date: '1960-05-15'
      thread: china-leadership
      c: 'The Center''s directive on distribution in the rural people''s communes 《中共中央关于农村人民公社分配工作的指示》: the 1959 distribution in line with policy, the communes'' and teams'' common funds 8 billion yuan, about 80 percent above 1958; 103 million households, 86.87 percent, with more income; but many communes short of the rule that over 90 percent of members gain, grain and cash not paid in full; to be put right.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 388–392 (printed from the Center''s document). Made public: 1996. See [[cal.1960-05-09.china-leadership-5]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-15.china-leadership-11
      when: May 15
      date: '1960-05-15'
      thread: china-leadership
      c: 'The Center''s directive on the distribution of grain 《中共中央关于做好粮食分配工作的指示》: from the summer harvest on, with the state''s summer procurement met, the villages'' ration, seed and fodder grain to be arranged in full, the output first made clear, so that no shortage come again in next spring''s lean season.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 393–399 (printed from the Center''s document). Made public: 1996. See [[cal.1960-05-09.china-leadership-5]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-16.china-leadership-13
      when: May 16
      date: '1960-05-16'
      thread: china-leadership
      c: 'The Center''s directive on pressing the production of small commodities 《中共中央关于抓紧生产小商品的指示》: daily wares, small hardware and small farm and side-line goods, by rough estimate 30 to 40 percent of retail trade, to be pressed.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 400–401 (printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-16.china-leadership-14
      when: May 16
      date: '1960-05-16'
      thread: china-leadership
      c: 'The Center sends out the Metallurgy Ministry Party group''s 冶金工业部党组 report on continuing the "small foreign groups" 小洋群 of steel and raising their grade 《中共中央对冶金工业部党组〈关于继续大办钢铁“小洋群”和“小洋群”升级问题的报告〉的批示》, for each province to arrange by its plans: small modern plants have great vitality and spread industry over the country.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 402–403 (printed from the Center''s document; the report not printed, n.1). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-05-26.china-leadership-12
      when: May 26
      date: '1960-05-26'
      thread: china-leadership
      c: 'The Center''s comment on two papers on teachers, students and scientists going into the factories for the technical revolution 《中共中央关于师生、科技人员下厂参加技术革命两个材料的批示》: school, laboratory and factory joined, worth reading. The papers: over 30,000 teachers and students of more than 90 Zhejiang 浙江 colleges and technical schools in 709 factories and over 200 communes; over 900 Shanghai 上海 scientists and technicians.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 404–405 (the comment, 404; the papers in summary, 404–405 n.1; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1960-06-12.china-leadership-8
      when: June 12
      date: '1960-06-12'
      thread: china-leadership
      c: 'The Center''s directive on water conservancy 《中共中央关于水利建设问题的指示》: it agrees with the Water Conservancy and Power Ministry Party group''s 水利电力部党组 report on the forum of Hebei 冀, Shandong 鲁, Henan 豫, Anhui 皖, Jiangsu 苏 and Hubei 鄂 and its outline for the coming winter and spring: only works under way and their complements, no new works.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 415–417 (printed from the Center''s document; the report and the outline not printed, n.1). Made public: 1996. See [[cal.1960-06.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-06-28.china-leadership-9
      when: June 28
      date: '1960-06-28'
      thread: china-leadership
      c: 'The Center''s directive on fighting drought and preparing against famine 《中共中央关于抗旱备荒的指示》: the first half-year''s weather very abnormal, 600 million mu under drought in the north and southwest; rain in the center, Hunan 湖南 alone losing 180 million jin of early-rice seed; typhoons on the Guangdong 广东, Fujian 福建 and south Zhejiang 浙江 coasts; the Yellow River''s 黄河 flow down to a third of normal.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 422–426 (printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
      - ok:fields-place
- add:
    entry:
      id: cal.1960-07-04.china-leadership-13
      when: July 4
      date: '1960-07-04'
      thread: china-leadership
      c: 'The Center''s directive on strengthening the people''s communes'' financial work 《中共中央关于加强农村人民公社财务工作的指示》: each commune a great enterprise of thousands of laborers and millions of yuan a year; thrift and democratic management, a sound system of accounts and cost-keeping.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 427–437 (printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-08-05.china-leadership-6
      when: Aug. 5
      date: '1960-08-05'
      thread: china-leadership
      c: 'The Center''s directive on sharply cutting the buying power of institutions 社会集团购买力 《中共中央关于大力紧缩社会集团购买力的指示》: every office, body, army unit, school and enterprise to cut the goods it buys from public funds by about 20 percent over the next five months, 500 million yuan in all; frugality, no waste.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 494–496 (printed from the Center''s document; the table of quotas not printed, n.1). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-08-05.china-leadership-7
      when: Aug. 5
      date: '1960-08-05'
      thread: china-leadership
      c: 'The Center 中共中央 approves Li Fuchun''s 李富春 and Bo Yibo''s 薄一波 main measures of July 15 for industrial and transport output in the third quarter of 1960 《关于一九六〇年第三季度工业交通生产中的主要措施》, to go to the major plants and mines: the front of capital construction shortened, output secured, industry centered on steel, coal and transport pushed up quickly.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 497–511 (the approval, 497; the measures, 498–511; printed from the Center''s document). Made public: 1996. See [[cal.1960-07-15.china-leadership-4]]. Names: Li Fuchun, Bo Yibo.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-fuchun
      - name:bo-yibo
- add:
    entry:
      id: cal.1960-08-19.china-leadership-10
      when: Aug. 19
      date: '1960-08-19'
      thread: china-leadership
      c: The Center 中共中央 agrees to the State Planning and Capital Construction Commissions' Party groups' 国家计委党组、国家建委党组 measures for shortening the front of capital construction to secure output 《关于缩短基本建设战线保证生产的措施》 and approves the plan for capital construction in the second half of 1960.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 538–544 (the approval, 538; the measures of Aug. 15, 539–543; printed from the Center''s document; the annexes, the adjusted plan and the lists of large projects to build and to stop, not printed, n.1). Made public: 1996. See [[cal.1960-08-15.china-leadership-14]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-08-22.china-leadership-6
      when: Aug. 22
      date: '1960-08-22'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the State Economic Commission Party group''s 国家经委党组 report on judging industrial enterprises'' economic work as a whole and correcting the one-sided pursuit of output value 《关于全面考核工业企业的经济工作，纠正片面追求工业产值现象的报告》: timely and necessary.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 551–556 (printed from the Center''s document). Made public: 1996. See [[cal.1960-08-06.china-leadership-7]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-09-01.china-leadership-10
      when: Sept. 1
      date: '1960-09-01'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Textile Ministry Party group''s 纺织工业部党组 request of Aug. 23 on the course of the textile industry 《关于纺织工业发展方针的请示报告》 and agrees with it: natural and chemical fibers, cultivated and wild fibers, specialized and diversified production developed together.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 557–564 (the comment, 557; the request, 558–564; printed from the Center''s document). Made public: 1996. See [[cal.1960-08-23.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-09-14.china-leadership-7
      when: Sept. 14
      date: '1960-09-14'
      thread: china-leadership
      c: 'The Center 中共中央 forwards and agrees with Xi Zhongxun''s 习仲勋 report of Sept. 3 on the organs and staff of the Center''s departments and their streamlining 《关于中央各部门机构编制情况和精简意见的报告》: organs to be cut and staff reduced in every department.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 571–580 (the comment, 571; the report, 572–580, a passage left out by the editors, n.1; printed from the Center''s document). Made public: 1996. See [[cal.1960-09-03.china-leadership-7]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-05.china-leadership-11
      when: Mar. 5
      date: '1960-03-05'
      thread: china-leadership
      c: 'The Center forwards the Guangdong committee''s 广东省委 instruction of Feb. 25 on some problems in present commune work 《中共中央批转广东省委〈关于当前人民公社工作中几个问题的指示〉》: a very good document; its five problems are in every province, each of which is to issue a plain instruction of its own on its model.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 32–42 (the comment, 32–33; the Guangdong instruction, 34–42; printed from the Center''s document). Made public: 1996. See [[cal.1960-03-03.china-leadership-5]]. See [[cal.1960-02-25.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-18.china-leadership-8
      when: Mar. 18
      date: '1960-03-18'
      thread: china-leadership
      c: 'The Center''s directive on health work 《中共中央关于卫生工作的指示》: most provincial first secretaries have not read the Jishan 稷山 conference report approved Feb. 2; the patriotic health campaign, slack in two years of the leap, to be revived, with marked results in 1960–62; sparrows no longer to be killed, bedbugs in their place: "rats, bedbugs, flies and mosquitoes".'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 90–94 (printed from the Center''s document). Made public: 1996. See [[cal.1960-03-16.china-leadership]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-02-02.china-leadership-5
      when: Feb. 2
      date: '1960-02-02'
      thread: china-leadership
      c: 'The Center 中共中央 approves the Health Ministry Party group''s 卫生部党组 report on the national rural health work field conference at Jishan 稷山, Shanxi 山西, with its opinions on health work in the people''s communes 《关于人民公社卫生工作几个问题的意见》: a clinic in each commune, a station in each brigade; Chinese and Western medicine together; a collective health-care system, a yearly fee from each member and drugs paid at the visit ("cooperative medical care" 合作医疗).'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 90 (the approval and its day, named in the Center''s directive of Mar. 18, 1960), 92–94 n.1 (the report and the opinions in summary). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-04.china-leadership-10
      when: Mar. 4
      date: '1961-03-04'
      thread: china-leadership
      c: The State Council 国务院 issues its notice promulgating the provisional regulations on the protection and care of cultural relics 《关于发布文物保护管理暂行条例的通知》 to the provinces, regions and cities under it, its ministries and commissions and the Academy of Sciences 中国科学院, to be carried out.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 709 n.1. See [[cal.1960-11-17.china-leadership-4]].'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1960-11-18.china-leadership-10
      when: Nov. 18
      date: '1960-11-18'
      thread: china-leadership
      c: 'Li Fuchun 李富春, to the Ninth National Planning Conference 第九次全国计划会议, on ten lessons of economic work 《经济工作的十条经验教训》: agriculture the base, its relation to industry the most basic proportion; labor saved and arranged as a whole; the whole country one chessboard; capital construction concentrated; quality first; the system of management improved; a rational layout; production and livelihood both; the mass line.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 710–721 (part of his report to the conference, n.*; printed from *Li Fuchun xuanji* 李富春选集). Made public: 1992 (*Li Fuchun xuanji* 李富春选集, Peking: Zhongguo jihua chubanshe, 1992, the source [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 721, names). Names: Li Fuchun.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-fuchun
- add:
    entry:
      id: cal.1960-11-24.china-leadership-11
      when: Nov. 24
      date: '1960-11-24'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Liaoning committee''s 辽宁省委 urgent directive on arranging the present market 《关于安排好当前市场的紧急指示》, timely and correct; every committee to secure the people''s minimum needs as Liaoning does: salt, coal, matches, bulbs, window paper, needles, stovepipes, eye drops, pots, bowls and chopsticks run out, and people queue for repairs, haircuts and baths.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 722–728 (the comment, 722–723; the directive, 723–728; printed from the Center''s document). Made public: 1996. See [[cal.1960-11-12.china-leadership-8]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-20.china-leadership-13
      when: Oct. 20
      date: '1960-10-20'
      thread: china-leadership
      c: The enlarged meeting of the Military Commission 军委扩大会议 adopts its resolution on strengthening political and ideological work in the army 《关于加强军队政治思想工作的决议》.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 742 (the resolution so dated in the Center''s comment of Dec. 21, 1960), 743–782 (the resolution, dated at Peking 北京, Oct. 20, 1960, 743, the meeting held there Sept. 14 to Oct. 20). Made public: 1996. See [[cal.1960-09-14.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
      place: peking
- add:
    entry:
      id: cal.1960-12-21.china-leadership-6
      when: Dec. 21
      date: '1960-12-21'
      thread: china-leadership
      c: 'The Center 中共中央 to the Hunan committee 湖南省委 and the Central-South Bureau 中南局, on its request of Dec. 13 to change the size of the basic accounting unit 《关于改变基本核算单位规模的请示》: agreed, but to be done in the last stage of the rectification of the communes, so as not to hinder it. The request: of the province''s 16,254 brigades over 6,800 have more than 500 households; those of over 300 to 400, or scattered, may be made smaller, as most members wish.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 783–786 (the reply, 783; the request, 784–786; printed from the Center''s document). Made public: 1996. See [[cal.1960-12-13.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-09-18.china-leadership-7
      when: Sept. 18
      date: '1960-09-18'
      thread: china-leadership
      c: 'The Center 中共中央 approves the State Economic Commission Party group''s 国家经委党组 report on emergency measures for more output and economy centered on steel 《关于以保钢为中心的增产节约的紧急措施的报告》: since the directive of Aug. 14 a new high tide of the campaign has come, steel''s daily output rising.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 581–584 (printed from the Center''s document; the report not printed, n.1). Made public: 1996. See [[cal.1960-08-14.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-09-23.china-leadership-5
      when: Sept. 23
      date: '1960-09-23'
      thread: china-leadership
      c: 'The Center''s directive on cutting the sale of edible oil and strengthening its purchase 《中共中央关于压缩食油销量和加强油脂收购的指示》: after grave natural disasters and less peanut sown, oil output about 3.8 billion jin, over 20 percent below last year; over 400 million jin drawn from the working stocks in two years, which on Sept. 10 stood at 670 million jin, the lowest since unified purchase and sale; sales in town and country to be cut hard.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 585–588 (printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-09-26.china-leadership-13
      when: Sept. 26
      date: '1960-09-26'
      thread: china-leadership
      c: The Center 中共中央 forwards the State Planning Commission and Labor Ministry Party groups' 国家计委党组、劳动部党组 report on the present arrangement of labor and workers' wages 《关于当前劳动力安排和职工工资问题的报告》, its measures correct, and calls for a mass campaign to save labor on every front.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 589–607 (printed from the Center''s document). Made public: 1996. Check: the directive is dated Sept. 26, 1960 in [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 589; Zhou Enlai sends its draft to Liu Shaoqi for issue on Sept. 27 by [[w.zhou-enlai-nianpu-1949]], II, 351. See [[cal.1960-09-11.china-leadership-10]].'
      tags:
      - polity:prc
      - vis:only:prc
