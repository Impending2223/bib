    base: f2796f9d
    set:
      n: '[[w.yang-jisheng-mubei]], II, 1171 (the book''s chronology); [[w.yang-jisheng-mubei]], I, 621 (the directive''s title, "The Center''s directive on lowering the ration standards of country and town," sent Sept. 7); [[w.chen-yun-nianpu-xiuding]], III, 42 (the directive: over 900 million mu struck by disaster in 1960; summer wheat procurement 5.1 billion jin below last year''s; edema, unnatural deaths and flight continuing; stocks 10 billion jin below last year''s; rural rations 360 jin of unhusked grain a head a year south of the Huai, about 300 north of it; town rations cut about 2 jin a month). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 565–570). To check: Central Committee, "Directive on lowering the grain-ration standards of the countryside and the cities," Sept. 7, 1960 (named by [[w.yang-jisheng-mubei]], II, 1171; no note). Check: the Secretariat discussed the draft Sept. 6 ([[cal.1960-09-06.china-leadership]]) and Zhou settled its text Sept. 7 ([[cal.1960-09-07.china-leadership-2]]).'
