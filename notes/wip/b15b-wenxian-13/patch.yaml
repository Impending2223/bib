      when: Aug. 6
      date: '1960-08-06'
      thread: china-leadership
      c: 'The State Economic Commission''s Party group 国家经济委员会党组, a report on judging industrial enterprises'' economic work as a whole and correcting the one-sided pursuit of output value 《关于全面考核工业企业的经济工作，纠正片面追求工业产值现象的报告》: gross output value counts unfinished goods and past labor, much of it twice, and is not to be the main test of an enterprise.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 552–556 (printed with the Center''s comment of Aug. 22, 1960; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
