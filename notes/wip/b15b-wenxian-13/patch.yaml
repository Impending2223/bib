      when: Oct. 28
      date: '1960-10-28'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Building Ministry Party group''s 建筑工程部党组 report of Oct. 15 on solving the cities'' housing problem 《关于解决城市住宅问题的报告》, very good: eleven years'' building great, but with the last few years'' growth the cities'' housing has grown short.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 655–659 (the comment, 655; the report, 656–659; printed from the Center''s document). Made public: 1996. See [[cal.1960-10-15.china-leadership-9]].'
      tags:
      - polity:prc
      - vis:only:prc
