      when: Mar. 7
      date: '1960-03-07'
      thread: china-leadership
      c: 'The Agriculture Ministry''s Party group 农业部党组 to the Center 中共中央 and Mao 毛泽东, a report on the national agricultural work conference 《关于全国农业工作会议的报告》, Peking 北京, Feb. 8–22, of the provinces'' agriculture and animal husbandry heads, Tan Zhenlin 谭震林 and Li Xiannian 李先念 speaking, Liao Luyan 廖鲁言 reporting: the published targets to leave room, farm output, grain and cotton up about 10 percent as the state''s first account, the provinces'' pledges its second.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 95–101 (printed with the Center''s comment of Mar. 19, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong, Tan Zhenlin, Li Xiannian.'
