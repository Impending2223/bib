      when: Oct. 4
      date: '1960-10-04'
      thread: china-leadership
      c: The Center's directive on developing the system of "two participations, one reform, three combinations" 两参一改三结合 and improving enterprise management 《中共中央关于发展“两参一改三结合”制度提高企业管理工作的指示》, with the Heilongjiang 黑龙江 committee's report and the Qinghua 庆华 tool plant's model, for the committees of the large and middle enterprises.
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 626–638 (printed from the Center''s document; the plant''s material not printed, n.1). Made public: 1996. See [[cal.1960-07-09.china-leadership-6]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-16.china-leadership-7
      when: Oct. 16
      date: '1960-10-16'
      thread: china-leadership
      c: 'The Center 中共中央 forwards and agrees with the minutes of the national finance and trade secretaries'' conference on doing the autumn and winter grain work firmly 《关于坚决做好秋冬粮食工作的讨论纪要》: grain sales in many provinces not yet cut; the villages to finish procurement with the people''s living arranged, and unreasonable sales to be cut.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 643–648 (the comment, 643–644; the minutes of Oct. 10, 644–648; printed from the Center''s document); [[w.yang-jisheng-mubei]], II, 1172 (the book''s chronology, under Nov. 16, 1960). Made public: 1996. See [[cal.1960-10-10.china-leadership-7]].'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-10-22.china-leadership-12
      when: Oct. 22
      date: '1960-10-22'
      thread: china-leadership
      c: 'The Center decides to add to the national key institutions of higher learning 《中共中央关于增加全国重点高等学校的决定》, the twenty named in March 1959 being too few: 64 in all, with the Education Ministry''s provisional rules for them 《中华人民共和国教育部关于全国重点高等学校暂行管理办法》.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 649–654 (the decision, 649–651; the rules, of the same day, 652–654; printed from the Center''s document). Made public: 1996.'
      tags:
      - polity:prc
      - vis:only:prc
