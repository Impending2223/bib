      n: '[[w.yang-jisheng-mubei]], II, 1172 (the book''s chronology). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 702–703). To check: Central Committee, "Notice on pressing at once the shipping of grain," Nov. 17, 1960 (named by [[w.yang-jisheng-mubei]], II, 1172; no note).'
