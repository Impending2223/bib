      date: '1960-04-06'
      thread: china-leadership
      c: 'The Shanxi committee 山西省委 to the Center 中共中央 and Mao 毛泽东, a report on its six-level cadre conference 《关于六级干部会议情况的报告》: the documents studied from the 24th to the 28th; on the passage to commune ownership the commune cadres in three camps, the steady, those rushing ahead and those waiting.'
      n: '[[w.jianguo-yilai-zhongyao-wenxian]], XIII, 238–251 (printed with the Center''s comment of Apr. 10, 1960; printed from the Center''s document). Made public: 1996. Names: Mao Zedong.'
