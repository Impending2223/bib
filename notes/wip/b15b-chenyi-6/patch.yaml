    item: '[[w.chen-yi-nianpu]], 1194 (Aug. 7, 1967; Wang Li 王力 of the Central Cultural Revolution Group, receiving the Foreign Ministry''s rebels, openly urges that the ministry''s power may be seized, "Wang''s Aug. 7 talk")'
- cite:
    id: cal.1967-08-07.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1194 (Aug. 7, 1967; Zhou goes under the noon sun to the Foreign Ministry''s small auditorium for the rebels'' meeting to criticize Chen Yi; finding the banner "Down with the three-anti element Chen Yi," he stops at the door and stands for an hour on the steps in the sun until the rebels take it down)'
- cite:
    id: cal.1967-08-09.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1194 (Aug. 9, 1967; Chen Yi present)'
- cite:
    id: cal.1967-08-11.china-leadership-5
    item: '[[w.chen-yi-nianpu]], 1194 (Aug. 11, 1967; the meeting to criticize Chen Yi at the Great Hall of the People, set on foot by the Central Cultural Revolution Group; the rebels, against Zhou''s instructions and the agreement not to shout "Down with Chen Yi," hang a great banner with those words from the second floor, and some try to rush the rostrum to seize him; Zhou orders the guards to protect Chen Yi and leaves in anger)'
- cite:
    id: cal.1967-08-14.china-leadership-5
    item: '[[w.chen-yi-nianpu]], 1194 (Aug. 14, 1967, afternoon; Chen Yi at the signing of the agreement on Chinese economic aid to Mali)'
- cite:
    id: cal.1967-08-16.china-leadership-6
    item: '[[w.chen-yi-nianpu]], 1194–1195 (Aug. 16, 1967; the Foreign Ministry''s rebels, backed by Wang Li and others, declare a formal seizure of power, seal the ministry''s Party committee and Political Department and raise the adverse current against Zhou and for the overthrow of Chen Yi, throwing China''s diplomacy into confusion)'
- cite:
    id: cal.1967-08-17.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (Aug. 17, 1967, evening; Chen Yi present at Zhou''s reception and banquet for 富里萨拉)'
- cite:
    id: cal.1967-08-22.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1195 (Aug. 22, 1967; the rebels'' burning of the British chargé d''affaires'' office)'
- cite:
    id: cal.1967-08-27.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (Aug. 27, 1967, before dawn; Zhou''s warning to the rebels that he will stand at the door and let them walk over him)'
- cite:
    id: cal.1967-08-25.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1195 (late August 1967; Zhou sends Mao the record of Wang Li''s Aug. 7 talk; Mao writes on it "a great, great, great poisonous weed"; soon Wang Li, Guan Feng 关锋 and Qi Benyu 戚本禹 are arrested and the Foreign Ministry begins the movement to "criticize the ultra-left and seize the bad men")'
- cite:
    id: cal.1967-08-31.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (Aug. 31, 1967; Zhou sharply criticizes the rebel leader acting as "acting minister" after the "seizure of power" and restates that power over foreign affairs belongs to the Center)'
- cite:
    id: cal.1967-10-01.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (Oct. 1, 1967; Chen Yi on the Tiananmen gate tower at the celebration of the PRC''s eighteenth anniversary, and in the evening at the National Day evening there)'
- cite:
    id: cal.1967-11-06.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (under Oct. 6, 1967 (so printed), afternoon; Chen Yi at the capital''s meeting for the fiftieth anniversary of the October Revolution)'
- cite:
    id: cal.1967-11-06.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1195 (under Oct. 6, 1967 (so printed), afternoon; Chen Yi at the airport to welcome the 412 aid experts and technicians back from Burma)'
- cite:
    id: cal.1967-11-14.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1196 (under Oct. 14, 1967 (so printed), evening; Mao and others, Chen Yi among them, receive the cadres and masses'' representatives at the Mao Zedong Thought study classes, the delegates of mass organizations of some provinces and cities come to Peking for meetings, PLA and local cadres, the diplomats lately back from Indonesia and the aid experts back from Burma)'
- cite:
    id: cal.1967-11-27.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1196 (under Oct. 27, 1967 (so printed); Chen Yi receives all the members of the delegation led by 林毅 (so printed))'
- cite:
    id: cal.1967-11-30.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1196 (under Oct. 30, 1967 (so printed); Chen Yi cables the Foreign Minister of the People''s Republic of South Yemen that the Chinese government has decided to recognize it)'
- cite:
    id: cal.1967-12-17.china-leadership-8
    item: '[[w.chen-yi-nianpu]], 1197 (under Nov. 17, 1967 (so printed), evening; Chen Yi and Li Xiannian receive the delegation led by 阿赫默德; then, at the welcoming banquet of Fang Yi 方毅, head of the Commission for Economic Relations with Foreign Countries, Chen Yi toasts China–Pakistan friendship and economic and technical cooperation)'
- cite:
    id: cal.1967-12-19.china-leadership-6
    item: '[[w.chen-yi-nianpu]], 1197 (under Nov. 19, 1967 (so printed), afternoon, the Great Hall of the People; Chen Yi at the capital''s rally for the Front''s seventh anniversary)'
- cite:
    id: cal.1967-12-19.china-leadership-5
    item: '[[w.chen-yi-nianpu]], 1197 (under Nov. 19, 1967 (so printed); Zhou and others, Chen Yi among them, receive all the members of the delegation, with its deputy heads 黎氏芝 and 山禄)'
- cite:
    id: cal.1967-12-21.china-leadership
    item: '[[w.chen-yi-nianpu]], 1197 (under Nov. 21, 1967 (so printed); Chen Yi present)'
- cite:
    id: cal.1967-12-30.china-leadership
    item: '[[w.chen-yi-nianpu]], 1198 (under Nov. 30, 1967 (so printed), afternoon; Chen Yi receives the mission led by 松冈信夫)'
- cite:
    id: cal.1966-12-18.china-leadership
    item: '[[w.chen-yi-nianpu]], 1198 (under Dec. 18, 1967 (so printed), the rally of 100,000 of the capital against the American bombing of Hanoi and for the Front''s sixth anniversary; Chen Yi''s speech, that 700 million Chinese are the Vietnamese people''s firm backing and China''s vast land their reliable rear, and that the Chinese will fight with them till the American aggressors are driven from Vietnam)'
- cite:
    id: cal.1967-12-31.china-leadership
    item: '[[w.chen-yi-nianpu]], 1198 (Dec. 31, 1967; Mao and others, Chen Yi among them, receive the PLA cadres and local Party and government cadres and masses'' representatives at the Mao Zedong Thought study classes in Peking, the delegates to the activists'' congress of the air force''s units directly under it, the members of the conference on publishing Mao''s works and of other conferences, the delegates of mass organizations of some provinces and regions, and the members of the National Defense Science and Technology Commission''s meeting)'
- cite:
    id: cal.1968-01-15.china-leadership
    item: '[[w.chen-yi-nianpu]], 1199 (Jan. 15, 1968; Chen Yi among those receiving the members of the ensemble led by 阮春鸿)'
- cite:
    id: cal.1968-02-03.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1199 (Feb. 3, 1968; Chen Yi and Zhou receive Ngô Minh Loan 吴明鸾, the DRV''s Ambassador, and, in a second item, Nguyễn Minh Phương 阮明芳, acting head of the Front''s permanent mission)'
- cite:
    id: cal.1968-02-13.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1199–1200 (Feb. 13, 1968; the poster of 91 heads of departments and ambassadors, setting out that Chen Yi is a loyal and steadfast fighter of the Party and asking that he come back soon to direct the ministry''s work)'
- cite:
    id: cal.1968-03-03.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1200 (Mar. 3, 1968, 8 p.m., the Fujian Hall of the Great Hall of the People; Chen Yi and Zhou receive 杜马)'
- cite:
    id: cal.1968-03-23.china-leadership
    item: '[[w.chen-yi-nianpu]], 1201 (Mar. 23, 1968, evening; Chen Yi''s speech at the reception of Sultan Mohammad Khan 苏尔坦·穆罕默德·汗: praises Pakistan''s tradition against imperialism and colonialism; the failure of the American war in Vietnam brings grave economic consequences and the shadow of crisis over the capitalist world; the modern revisionists, imperialism''s accomplices, are at the end of their road, the "February black meeting" exposing them)'
- cite:
    id: cal.1968-03-22.china-leadership
    item: '[[w.chen-yi-nianpu]], 1201 (March 1968; Lin Biao and Jiang Qing make up the "Yang Chengwu, Yu Lijin, Fu Chongbi affair," charging the three with an armed assault on the Central Cultural Revolution Group and a reversal of the "February adverse current"; on the 22nd the Center, State Council, Military Commission and the Group order Yang removed as acting chief of the General Staff and from the Commission''s Standing Committee, Yu as air force political commissar and arrested as a "traitor," Fu as commander of the Peking Garrison; Huang Yongsheng 黄永胜 named chief of the General Staff, Wen Yucheng 温玉成 also commander of the garrison)'
- cite:
    id: cal.1968-03-24.china-leadership
    item: '[[w.chen-yi-nianpu]], 1201 (Mar. 24, 1968; the meeting of 10,000 of the organs and units in Peking at the Great Hall of the People announcing the order)'
- cite:
    id: cal.1968-03-25.china-leadership
    item: '[[w.chen-yi-nianpu]], 1201 (Mar. 25, 1968; the Military Commission''s Office Group reorganized under Huang Yongsheng in Yang Chengwu''s place, giving Lin Biao''s group much of the Commission''s power)'
- cite:
    id: cal.1968-03-28.china-leadership
    item: '[[w.chen-yi-nianpu]], 1201 (March 1968, "soon after" Mar. 25; on Mao''s view the Military Commission''s Standing Committee is to meet no more, the Office Group in effect replacing it)'
- cite:
    id: cal.1968-04-26.china-leadership-5
    item: '[[w.chen-yi-nianpu]], 1202 (Apr. 26, 1968, evening; Chen Yi speaks at the reception: praises China–Tanzania friendship; the Asian, African and Latin American national democratic revolution joins the fight of the oppressed peoples of Europe and North America against imperialism and colonialism; the Chinese people will better bear their internationalist duty)'
- cite:
    id: cal.1968-05-08.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1202 (May 8, 1968; Mao and others, Chen Yi among them, receive the PLA commanders and fighters, local Party and government cadres and masses'' representatives at the Mao Zedong Thought study classes in Peking, the workers'' delegates and military control heads at the national railway and communications conference and the members of other conferences)'
- cite:
    id: cal.1968-05-20.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1203 (May 20, 1968; Mao and others, Chen Yi among them, receive people come to Peking from all over the country)'
- cite:
    id: cal.1968-05-24.china-leadership
    item: '[[w.chen-yi-nianpu]], 1203 (May 24, 1968, afternoon; Chen Yi present at Mao''s and Lin Biao''s reception of Ousmane Ba, Béavogui and all the delegation''s members)'
