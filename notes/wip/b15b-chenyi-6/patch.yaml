    id: cal.1967-06-12.china-leadership-3
    item: '[[w.chen-yi-nianpu]], 1191–1192 (June 12, 1967; Chen Yi''s speech at the reception of 伦迪尔·苏巴, Nepal''s Ambassador, for King Mahendra''s birthday: praises China–Nepal friendship and, on the Middle East, restates China''s support of the Arab people against American, British and Israeli aggression and denounces the Soviet revisionists'' "sham support, real betrayal")'
- cite:
