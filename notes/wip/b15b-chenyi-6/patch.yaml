- cite:
    id: cal.1967-08-25.china-leadership-2
    item: '[[w.chen-yi-nianpu]], 1195 (late August 1967; Zhou sends Mao the record of Wang Li''s Aug. 7 talk; Mao writes on it "a great, great, great poisonous weed"; soon Wang Li, Guan Feng 关锋 and Qi Benyu 戚本禹 are arrested and the Foreign Ministry begins the movement to "criticize the ultra-left and seize the bad men")'
- cite:
    id: cal.1967-08-31.china-leadership
    item: '[[w.chen-yi-nianpu]], 1195 (Aug. 31, 1967; Zhou sharply criticizes the rebel leader acting as "acting minister" after the "seizure of power" and restates that power over foreign affairs belongs to the Center; Chen Yi again appears often in public as Vice-Premier and Foreign Minister)'
