      when: Mar. 14
      date: '1960-03-14'
      place: phnom-penh
      thread: vietnam-diplomacy
      c: 'Phnom Penh. Sihanouk''s editorial in the *Nationalist*, broadcast in full over Phnom Penh radio: he has documents to prove the Pracheachon Party and the communist paper *L''Observateur* in league with Hanoi to end "the feudal regime of the princes."'
      n: '[[w.guan-vietnamese-communists-relations-with]], 135–136 ("mid-March"; the broadcast of Mar. 14). To check: Phnom Penh in French, 14 March 1960, SWB/FE/286/B/4-6 (cited by [[w.guan-vietnamese-communists-relations-with]], 136 n.10). Names: Sihanouk.'
      src:
