      c: 'As the State Department has it, by the British embassy in Washington: in the battle for Vientiane Soviet Il-14s flew in 105-mm howitzers, ammunition, gasoline, rations; North Vietnamese military personnel landed and parachuted to reinforce Kong Le outside the city; Soviet heavy transports through China to Hanoi and Haiphong backed the airlift. Since Kong Le''s withdrawal on Dec. 15, at least 180 sorties seen around Vang Vieng, Phong Hong, Sam Neua and Xieng Khouang, war matériel and many North Vietnamese parachuted in.'
      n: '[[w.guan-vietnamese-communists-relations-with]], 172, 176. Made public: 1997. To check: FO 371/159813, DF 1015/21, 3 January 1961, from Washington to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 172 n.88). Names: Kong Le.'
