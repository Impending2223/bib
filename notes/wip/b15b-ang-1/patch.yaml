- cite:
    id: cal.1960-05.china
    item: '[[w.guan-vietnamese-communists-relations-with]], 147–148 (by a Chinese source, the leaders meet in mid-May first in Hanoi, then in Peking: Zhou to Phạm Văn Đồng, the South must be liberated; Zhou and Deng, political and military struggle together, the political first in the cities, the military in the countryside; Đồng agrees. Perhaps the point in 1960 of Hoàng Văn Hoan''s account: the Chinese, fully briefed, own they were less well informed, now see the Vietnamese right on armed struggle in the South and will fully support it)'
