      id: cal.1960-03-28.vietnam-hanoi
      when: Mar. 28
      date: '1960-03-28'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Regional Party Committee (Nam Bộ), urgently, to all Party branches in the South: no premature step-up of the military struggle. The line stays "strongly pushing the political struggle ahead and combining it to the right degree with armed activities"; the time not ripe to overthrow Diệm.'
      n: '[[w.guan-vietnamese-communists-relations-with]], 135. To check: [[w.vietnam-1979]], II, 59–70 (cited by [[w.guan-vietnamese-communists-relations-with]], 135 n.8a); The Regional Party Committee (Nam Bộ) to the Party branches in the South, letter, Mar. 28, 1960 (Race document 1044, in Vietnamese) (cited by [[w.guan-vietnamese-communists-relations-with]], 135 n.8b); [[w.state-working-paper-on-north]], Appendices, item 34 (cited by [[w.guan-vietnamese-communists-relations-with]], 135 n.8c). Made public: 1968 ([[w.state-working-paper-on-north]], the earliest printing the note names).'
      src:
        rows:
        - 'via x.1960-03-28.nam-bo-regional-committee-letter-party-branches: ?'
      tags:
      - polity:drv
      - vis:only:drv
