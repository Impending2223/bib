- cite:
    id: cal.1960-01-17.vietnam-hanoi
    item: '[[w.guan-vietnamese-communists-relations-with]], 133–134 (the week of Jan. 17–24 of risings in Bến Tre: 47 villages of Mỏ Cày, Giồng Trôm, Châu Thành, Ba Tri and Thạnh Phú at once, held by Jan. 19; the arms taken at Bình Khánh arm three squads; the first company, the 264th; by the army''s history the first use of political and armed struggle together)'
- to-check:
    id: cal.1960-01-17.vietnam-hanoi
    add:
    - '[[w.lich-su-quan-doi]], 107–115 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1a)'
    - '[[w.no-other-road-to]], 59–77 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1b)'
    - '[[w.lich-su-quan-doi]], 114 (cited by [[w.guan-vietnamese-communists-relations-with]], 134 n.2)'
- add:
    entry:
      id: cal.1960-01-21.vietnam-hanoi-3
      when: Jan. 21
      date: '1960-01-21'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Saigon sends an amphibious battalion into Phước Hiệp to retake Định Thủy and Bình Khánh. The 264th Company and the armed squads of the three villages surround it; a number of the marines killed, their weapons taken.
      n: '[[w.guan-vietnamese-communists-relations-with]], 133. To check: [[w.lich-su-quan-doi]], 107–115 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1a); [[w.no-other-road-to]], 59–77 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1b). See [[cal.1960-01-17.vietnam-hanoi]].'
      tags:
      - polity:rvn
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-6
      when: Feb.
      date: '1960-02'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The provincial committee gathers all its armed men at Bảo Island (Giồng Trôm, Ba Tri and Châu Thành districts) and forms its second company, the 269th.
      n: '[[w.guan-vietnamese-communists-relations-with]], 133. To check: [[w.lich-su-quan-doi]], 107–115 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1a); [[w.no-other-road-to]], 59–77 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1b). See [[cal.1960-01-17.vietnam-hanoi]].'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-04.vietnam-hanoi
      when: Feb. 4
      date: '1960-02-04'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The provincial committee and the Mỏ Cày district committee organize 200 women of Phước Hiệp and 5,000 of the villages around into resistance groups.
      n: '[[w.guan-vietnamese-communists-relations-with]], 133. To check: [[w.lich-su-quan-doi]], 107–115 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1a); [[w.no-other-road-to]], 59–77 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1b). See [[cal.1960-01-17.vietnam-hanoi]].'
      tags:
      - polity:drv
- cite:
    id: cal.1960-03-07.vietnam
    item: '[[w.guan-vietnamese-communists-relations-with]], 134 (guerrilla action and terror, once seen by the Country Team as a long-term threat, now South Vietnam''s "number-one problem")'
