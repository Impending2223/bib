      n: '[[w.guan-vietnamese-communists-relations-with]], 135 (VINA, Mar. 27). To check: VINA, 27 March 1960, SWB/FE/296/B/1 (cited by [[w.guan-vietnamese-communists-relations-with]], 135 n.9).'
