- add:
    entry:
      id: cal.1960-09-02.vietnam-diplomacy
      when: Sept. 2
      date: '1960-09-02'
      thread: vietnam-diplomacy
      also:
      - soviet-union
      c: 'As the State Department''s Information Brief no. 319 reports it: Soviet aid''s effect on North Vietnam''s economy substantial, though probably exceeded by China''s; hard to measure, information scarce and several projects shared with Eastern Europe; China''s help fits the backward economy better than the complex Soviet plants of the 1955 grant and the 1959 credit, and China knows tropical farming.'
