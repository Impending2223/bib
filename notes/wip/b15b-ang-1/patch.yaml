      n: '[[w.guan-vietnamese-communists-relations-with]], 135–136 ("mid-March"; the broadcast of Mar. 14). To check: Phnom Penh in French, 14 March 1960, SWB/FE/286/B/4-6 (cited by [[w.guan-vietnamese-communists-relations-with]], 136 n.10). Names: Sihanouk.'
