      - laos
      c: 'Hanoi, the Second National Assembly''s first session opens; Giáp not reported present. Phạm Văn Đồng''s report on the government''s work in the first half of 1960: no quick victory in the struggle for reunification, imperialism''s collapse sure under the Soviet Union and China; the 1957 Moscow Declaration, reaffirmed at Bucharest; support for Cambodia''s peace and neutrality; Laos a threat to the DRV and to peace in Indochina; reunification a sacred task, the United States the enemy; the anti-Diệm struggle in the South not begun by the North.'
      n: '[[w.guan-vietnamese-communists-relations-with]], 151; 151 n.79 (Giáp not reported at the opening). To check: VNA, 7 July 1960, SWB/FE/381/B/1-8 (cited by [[w.guan-vietnamese-communists-relations-with]], 151 n.78). Names: Phạm Văn Đồng, Võ Nguyên Giáp.'
