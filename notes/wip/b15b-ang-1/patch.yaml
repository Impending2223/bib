      c: 'Moscow. Khrushchev receives Hồ Chí Minh, a "cordial and friendly conversation" as reported. By Khrushchev''s memoir, with the Chinese refusing to sign over one point, Hồ asks him to give way: China a big country, a big party, no schism to be allowed. Khrushchev: the Soviet Union no small country. Hồ: "For us, it is doubly difficult. Don''t forget, China is our neighbor."'
