      n: '[[w.guan-vietnamese-communists-relations-with]], 138 (by British sources). To check: FO 371/152325, DF 1015/111, 18 March 1960, from Vientiane to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 138 n.18). See [[cal.1960-03-08.laos]]. Names: Souphanouvong.'
