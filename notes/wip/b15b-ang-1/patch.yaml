      c: Hanoi. Võ Nguyên Giáp and Nguyễn Chí Thanh at the Soviet military attaché's reception for Soviet Army Day. No word of Giáp after it until Apr. 16.
      n: '[[w.guan-vietnamese-communists-relations-with]], 135. Names: Võ Nguyên Giáp, Nguyễn Chí Thanh.'
