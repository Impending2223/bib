      when: Jan. 26
      date: '1960-01-26'
      place: hanoi
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: Hanoi, afternoon. The GDR government delegation visits the Army Museum, received by Maj. Gen. Nguyễn Văn Vịnh, deputy minister of national defense; Giáp absent throughout the visit.
      n: '[[w.guan-vietnamese-communists-relations-with]], 134 ("the afternoon of 26 January"). Names: Võ Nguyên Giáp.'
      time_range:
      - '1960-01-26T05:00Z'
      - '1960-01-26T11:00Z'
      time_band: afternoon
      time_zone: Asia/Bangkok
      tags:
      - polity:drv
      - polity:gdr
      - name:vo-nguyen-giap
- cite:
    id: cal.1960-02-04.soviet-union
    item: '[[w.guan-vietnamese-communists-relations-with]], 134–135, 140–141 (the Political Consultative Committee, Feb. 4–5; the Vietnamese delegation headed by Trường Chinh, Võ Nguyên Giáp there by NCNA, not VINA; Kang Sheng''s speech, extremely anti-Soviet, says nothing of the struggle in the South, a brief word on U.S. support for the reactionaries in Laos; the Declaration urges all to help the coming East-West talks)'
