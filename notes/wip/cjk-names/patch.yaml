      c: 'Deng Xiaoping 邓小平 meets the departing Czechoslovak ambassador, Josef Sedivy. On China''s economy and prospects: 1959–61 were hard years, with natural disasters, ignorance of the laws of socialist construction, and the Soviet withdrawal of experts and tearing up of contracts, which upset the plans and forced readjustment; from the second half of 1961 the Chinese began to readjust, thinking and solving problems themselves; in recent years the harvest is larger than in the ten before; industry, agriculture, heavy and light industry are on normal tracks; they mean to build for twenty years, agriculture as base, industry as leading factor, in the order agriculture, light, heavy, finally the four modernizations.'
