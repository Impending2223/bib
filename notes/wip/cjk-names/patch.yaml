    id: cal.1960-07-30.china-leadership-7
    base: c2b08fd6
    set:
      c: Chen Yi 陈毅 speaks at the banquet of *Jiao Wen* 叫温, the Burmese Ambassador, for Aung Gyi's 昂季 delegation to the boundary commission's second session; praises the friendly and sincere attitude of both countries' leaders and delegations in the talks.
