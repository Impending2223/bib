- edit:
    id: cal.1960-07-26.china-leadership-5
    base: 84d24b1d
    set:
      c: 'Chen Yi 陈毅 receives four Japanese delegations: the China Research Institute''s 中国研究所, led by Hirano Yoshitarō 平野义太郎; the national metal miners'' union''s, led by *Zetian Zhengzhi* 泽田政治; the National Relief Association''s 国民救援会, led by *Gangben Guangxiong* 冈本光雄; the fishery workers'', led by *Liyuan Qianhe* 笠原千鹤; the Japanese people''s just struggle heartens the world; the imperialists'' charge that China "instigates" their anti-American struggle a fabrication.'
