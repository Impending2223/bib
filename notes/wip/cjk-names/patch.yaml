    base: ab63df9b
    set:
      c: Chen Yi 陈毅 speaks at the reception of Sharab, the Mongolian Ambassador, for the 39th anniversary of the revolution; condemns American intervention against Cuba, American backing of Belgium in the Congo and of the Netherlands against Indonesia and its holding of West Irian; praises Mongolia's socialist construction.
