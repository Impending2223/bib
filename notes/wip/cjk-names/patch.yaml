    set:
      c: 'Chen Yi 陈毅 receives three men of Cuba''s July 26 Movement: Fernando López Muñoz 费尔南多·洛佩斯·穆尼奥, head of secondary education in the Education Ministry; *Fei''ernanduo Luyisi* 费尔南多·路易斯, mayor of Santiago de Cuba; and *Mannu''ai''er Susa''erdi* 曼努埃尔·苏萨耳迪, the movement''s finance secretary.'
