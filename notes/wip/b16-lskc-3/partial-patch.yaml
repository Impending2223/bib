- add:
    entry:
      id: cal.1969-03-29.vietnam-hanoi
      when: Mar. 29
      date: '1969-03-29'
      thread: vietnam-hanoi
      c: 'COSVN''s directive no. 81/CTNT to the battlefields and localities: strike the cities and towns harder and without letup, Đà Nẵng, Huế and Saigon above all; press the political struggle and troop proselytizing; build up the armed and the political forces.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 90–91. Made public: 1985. To check: *Những sự kiện lịch sử Đảng*, II (Thông tin lý luận, 1985), 470 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 91 n.).'
      tags:
      - 'polity:drv'
      - 'place:da-nang'
      - 'place:hue'
      - 'place:saigon'
      - 'vis:only:drv'
