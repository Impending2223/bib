- add:
    entry:
      id: cal.1969-08-11.vietnam-hanoi
      when: Aug. 11
      date: '1969-08-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The autumn offensive opens across the South under the resolution of COSVN''s ninth conference, its first high point: infantry, artillery and sappers strike 140 targets, more than 30 towns, 61 district seats, 49 headquarters, 27 airfields, 3 ports and 14 depots. In eastern Nam Bộ, the main blow toward Bình Long: the 9th Division and the 1st Regiment of the 1st Division, the Liberation Army command''s reserve, attack the American 11th Armored Cavalry''s base on Route 13 west of Lộc Ninh.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 131–33.'
      tags:
      - 'polity:drv'
      - 'province:binh-long'
      - 'place:loc-ninh'
- add:
    entry:
      id: cal.1969-09-04.vietnam-hanoi-3
      when: Sept. 4
      date: '1969-09-04'
      thread: vietnam-hanoi
      c: The Defense Ministry forms the Technical Department of the Air Defense–Air Force Service.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 197. Made public: 2013. See [[cal.1969-07-29.vietnam-hanoi]].'
