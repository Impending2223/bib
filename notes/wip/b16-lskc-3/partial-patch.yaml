patch: 2026-11-14-b16-lskc-3
by: 'Claude (batch 16, reader 6: Lịch sử kháng chiến chống Mỹ cứu nước, vol. VI, to Dec. 31, 1969), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1969-02-03.vietnam-hanoi
      when: Feb. 3
      date: '1969-02-03'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh, as "T.L.," in *Nhân Dân*, for the Party''s thirty-ninth anniversary: "Nâng cao đạo đức cách mạng, quét sạch chủ nghĩa cá nhân" (Raise revolutionary morality, sweep away individualism). Most cadres brave and exemplary; a few still individualist, shirking hardship, embezzling, wasteful. The Party to teach communist ideals, its line and a member''s duties; criticism and self-criticism, the masses'' criticism welcomed; cell life, discipline and inspection strict.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 167–69. To check: Hồ Chí Minh, *Toàn tập*, XII (Chính trị quốc gia, 2000), 439 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 169 n.). Names: Hồ Chí Minh.'
      tags:
      - 'polity:drv'
      - 'name:ho-chi-minh'
- add:
    entry:
      id: cal.1969-02-22.vietnam-hanoi
      when: Feb. 22–23
      date: '1969-02-22'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The night of Feb. 22–23: the spring offensive opens across the South. Artillery, infantry, guerrillas and sappers strike more than 400 targets in 36 cities and towns, 100 district seats and towns, 35 headquarters of regiment or above, 38 airfields and 17 logistic bases; the weight on Saigon, Đà Nẵng, Quảng Nam, Quảng Ngãi, Cam Ranh, Pleiku, Phước Long, Mỹ Tho, Bến Tre, Trà Vinh, Rạch Giá and Châu Đốc. Under the Politburo''s directive to the Party in the South, the year''s offensives to be pressed, spring and summer first, and COSVN''s Standing Committee''s directive no. 71/TVTWC on the tasks of the spring: the general offensive and uprising pressed in all three zones, the "accelerated pacification" broken. In Region V the phase runs to Mar. 31.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 102–5. Made public: 2013. To check: *Chỉ thị số 71/TVTWC về nhiệm vụ xuân 1969*, in the Institute of Military History (cited by [[w.lich-su-khang-chien-chong-my]], VI, 103 n.).'
      tags:
