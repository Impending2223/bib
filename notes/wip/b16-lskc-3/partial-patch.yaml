      when: Apr. 6
      date: '1969-04-06'
      thread: vietnam-hanoi
      c: 'COSVN''s directive on meeting the enemy''s sweeps actively and holding the base areas along the Cambodian border: the tasks of its agencies, branches, mass bodies, units and localities.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 91. Made public: 2013. Check: the history gives the directive no issuer of its own; COSVN by its context, after COSVN''s of Mar. 29.'
