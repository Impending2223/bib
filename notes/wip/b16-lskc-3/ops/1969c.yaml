- cite:
    id: 'cal.1969-01-13.vietnam-hanoi'
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 166–67 (the Secretariat''s directive on cultivating and holding up good people and good deeds, "bước vào năm 1969" (at the start of 1969): prompt praise, booklets, propaganda and study; not its number or day, or Hồ Chí Minh''s badge)'
    units: 'A, C'
- cite:
    id: 'cal.1969-05-08.vietnam-hanoi'
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 83–90 (the Politburo''s session of May 10 on the situation and the new tasks and its resolution, after *Văn kiện Đảng toàn tập*, XXX, 128–32: the Americans forced to de-escalate and "Vietnamize," the aims to make them withdraw and the Saigon army collapse; not the plenum, the diplomatic outline or Lê Duẩn''s speech)'
    units: 'B, C'
- variant:
    id: 'cal.1969-05-08.vietnam-hanoi'
    unit: 'B'
    witness: 'w.lich-su-khang-chien-chong-my'
    reads: 'the Politburo met "ngày 10-5-1969" (May 10, 1969), VI, 83–84; elsewhere its resolution "tháng 4-1969" (of April 1969), VI, 128, 159, 190, 222'
    at: 'VI, 83–84'
- cite:
    id: 'cal.1969-07.vietnam-hanoi'
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 128–30 (the conference, July 1969, on the Politburo''s resolution "of April 1969"; its findings, the tasks and the directions, military attack first; and, not in `c`, COSVN''s reorganization of the battlefields there: a Military Region 7 of Subregion 4, Biên Hòa, Bà Rịa, Long Khánh and the Rừng Sác special zone; the inner Saigon districts joined again under Nguyễn Văn Linh, the city committee''s secretary; Võ Văn Kiệt secretary of the Region 9 committee, Lê Đức Anh its commander)'
    units: 'B-E'
- cite:
    id: 'cal.1969-09-02.vietnam-hanoi'
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 133–34 (9:47 a.m., Sept. 2, 1969, in Hanoi; not the cause, his age or the day announced)'
    units: 'A'
- variant:
    id: 'cal.1969-09-04.vietnam-hanoi'
    unit: 'A'
    witness: 'w.lich-su-khang-chien-chong-my'
    reads: 'the special communiqué the Politburo''s, broadcast by the Voice of Vietnam the night of Sept. 3'
    at: 'VI, 134'
