      when: Apr. 28
      date: '1969-04-28'
      thread: vietnam-hanoi
      c: 'The State issues the abridged statute of the higher-level farm cooperatives, after the lower-level statute of 1959: their nature and tasks, the members'' collective mastery, better management. Its foreword by Hồ Chí Minh, who read and corrected it.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 176. To check: Hồ Chí Minh, *Toàn tập*, XII (2000), 454 (the foreword; cited by [[w.lich-su-khang-chien-chong-my]], VI, 176 n.). Names: Hồ Chí Minh.'
