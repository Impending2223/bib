- add:
    entry:
      id: cal.1969-05.vietnam-hanoi
      when: May
      date: '1969-05'
      thread: vietnam-hanoi
      c: 'Hanoi. A class for the army''s middle and senior cadres, of the Defense Ministry, the military regions, services, arms and divisions, on the situation and tasks of the war''s new stage. Hồ Chí Minh''s letter to it: resolve to fight the Americans to final victory, orders carried out whatever happens; good tactics, each action''s lessons learned; responsibility, hardship shared with the men; weapons cared for, every round and grain of rice saved.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 191–92. To check: Hồ Chí Minh, *Toàn tập*, XII (2000), 465–66 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 192 n.). Names: Hồ Chí Minh. Check: whether the letter was printed at the time.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      - place:hanoi
- add:
    entry:
      id: cal.1969-05-08.vietnam-hanoi-2
      when: May 8
      date: '1969-05-08'
      thread: vietnam-hanoi
      also: [vietnam-paris]
      c: 'Paris, the conference''s sixteenth plenary session. The Front''s delegate puts forward an overall solution in ten points: Vietnam''s independence, sovereignty, unity and territory respected; all American and allied troops, military personnel and weapons withdrawn without conditions; the Vietnamese armed forces in the South a question for the Vietnamese parties; the South''s affairs its people''s, a provisional coalition government formed by negotiation, general elections; peace and neutrality abroad; reunification step by step and by peaceful means; neither zone in a military alliance or with foreign bases; prisoners negotiated, Washington responsible for the war''s damage; international supervision of the withdrawals.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 223–24.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1969-05-11.vietnam-hanoi
      when: May 11
      date: '1969-05-11'
      thread: vietnam-hanoi
      also: [vietnam-operations]
      c: 'By the common plan, the summer offensive opens across the South: more than 800 targets, 57 bases and headquarters of regiment or above and 41 airfields among them. In the Central Highlands the B3 Front''s Đắk Tô 2 campaign, from the night of May 10–11: the joint base at Đắk Tô, the Kon Tum airfield, the 42d Regiment''s headquarters and Tân Cảnh attacked, Plây Cần besieged; the 66th and 28th Infantry and 40th Artillery Regiments on the main axis. The Front ends it June 26: 4,135 of the enemy put out of action, nine of twelve battalions hard hit, by its count. The offensive runs to June 20.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 115–22, 127.'
      tags:
      - polity:drv
      - place:dak-to
      - place:kontum
      - province:kon-tum
- add:
    entry:
      id: cal.1969-06-06.vietnam-hanoi
      when: June 6–8
      date: '1969-06-06'
      thread: vietnam-hanoi
      also: [vietnam-paris]
      c: 'War Zone D, at COSVN''s base: the Congress of People''s Representatives of the South, 88 delegates of parties, nationalities, religions, classes and the armed forces and 72 guests. It adopts a program of action, and the five-point position as the basis at Paris, and elects the Provisional Revolutionary Government of the Republic of South Vietnam: Huỳnh Tấn Phát, vice chairman of the Front''s Central Committee, its chairman; Nguyễn Hữu Thọ chairman and Trịnh Đình Thảo vice chairman of its Advisory Council; Trần Nam Trung Defense, Nguyễn Thị Bình Foreign Affairs, Cao Văn Bổn Economy and Finance.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 93–95. Names: Huỳnh Tấn Phát, Nguyễn Hữu Thọ, Trịnh Đình Thảo, Trần Nam Trung, Nguyễn Thị Bình, Cao Văn Bổn.'
      tags:
      - polity:drv
      - name:nguyen-huu-tho
      - name:nguyen-thi-binh
- add:
    entry:
      id: cal.1969-06-12.vietnam-hanoi
      when: June 12
      date: '1969-06-12'
      thread: vietnam-hanoi
      also: [vietnam-paris]
      c: 'The Government''s statement on the Provisional Revolutionary Government: the fruit of the South''s military, political and diplomatic victories, above all since early 1968; chosen by the Congress of People''s Representatives, the lawful government and true representative of the South''s people; its line and program warmly welcomed.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 95–96. To check: Trần Văn Giàu, *Miền Nam giữ vững thành đồng*, V (Khoa học xã hội, 1978), 238–39 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 96 n.). See [[cal.1969-06-06.vietnam-hanoi]].'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1969-06-23.vietnam-hanoi
      when: June 23–24
      date: '1969-06-23'
      thread: vietnam-hanoi
      also: [laos]
      c: 'Laos, the night of June 23–24: Vietnamese and Lao forces open the Mường Sủi (Muong Soui) campaign against Vang Pao''s mobile forces, to hold the Plain of Jars and threaten Sam Thong and Long Tieng. On the Vietnamese side the 316th Division less a part, three sapper battalions, two of 120-mm mortars, two of 12.7-mm antiaircraft guns, two tank companies; on the Lao, two infantry battalions and others. By 6 a.m. June 24 the Muong Soui airfield under their guns; June 28 to July 1 the whole of Muong Soui taken.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 239–40. Names: Vang Pao.'
      tags:
      - polity:drv
      - polity:laos
      - polity:pathet-lao
      - place:plain-of-jars
