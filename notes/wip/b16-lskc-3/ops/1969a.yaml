      c: 'The North elects its district and village people''s councils and their equivalents: 99.08 percent of the voters; some 160,000 delegates to 298 councils of wards, districts and towns and 5,851 of villages and townships.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 173.'
