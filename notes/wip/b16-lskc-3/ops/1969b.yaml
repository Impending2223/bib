      c: 'The command of the South''s Liberation Armed Forces: a cease-fire across the battlefield for three days, from 0:00 Sept. 8 to 0:00 Sept. 11, for the memorials to Hồ Chí Minh.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 135. Names: Hồ Chí Minh. Check: the day of the order; the history gives only the cease-fire''s.'
