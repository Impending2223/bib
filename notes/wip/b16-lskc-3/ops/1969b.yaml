- add:
    entry:
      id: cal.1969-09-04.vietnam-hanoi-4
      when: Sept. 4–5
      date: '1969-09-04'
      thread: vietnam-hanoi
      also: [vietnam-operations]
      c: 'The night of Sept. 4–5, the autumn offensive''s second high point, from Trị–Thiên to the Mekong Delta: at Huế, the rear base of the American 1st Cavalry Division attacked; in Quảng Nam, the Special Forces base at An Hòa; in Bình Long, from Cây Cay to Chơn Thành, sappers on an American mechanized group, the rear base of the Saigon 9th Regiment and the Chơn Thành subsector, 400 put out of action and 32 vehicles destroyed, by their count. The offensive ends Sept. 15.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 136–37. See [[cal.1969-08-11.vietnam-hanoi]]. Check: the 1st Cavalry Division had left northern I Corps for III Corps by mid-November 1968 ([[cal.1968-10.vietnam-operations]]); the history''s unit at Huế.'
      tags:
      - polity:drv
      - place:hue
      - province:quang-nam
      - province:binh-long
