- add:
    entry:
      id: cal.1969-10.vietnam-hanoi
      when: Oct., late
      date: '1969-10'
      thread: vietnam-hanoi
      also: [vietnam-operations]
      c: 'The Liberation forces open the winter–spring offensive of 1969–70: to strike hard and draw the enemy out, destroy part of his forces, loosen the defenses around Saigon, help the guerrillas against pacification and push the cities'' struggle. In eastern Nam Bộ the 5th, 7th and 9th Divisions, with the 320th Regiment from the Highlands: blows northeast and southwest of Saigon, to draw the enemy out to Bình Long and Tây Ninh.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 137–38.'
      tags:
      - polity:drv
      - place:saigon
      - province:binh-long
      - province:tay-ninh
- add:
    entry:
      id: cal.1969-10-25.vietnam-hanoi
      when: Oct. 25
      date: '1969-10-25'
      thread: vietnam-hanoi
      also: [laos]
      c: 'Laos. Vietnamese and Lao forces open Campaign 139, the counteroffensive for the Plain of Jars and Xieng Khouang, Vang Pao''s Kou Kiet having taken the plain by September: its first phase, to build up the position, through the rains and the bombing. On the Vietnamese side the 312th and 316th Divisions, two battalions of the 866th Regiment, the 16th Artillery and the 45th Engineer Regiments, a tank company and the 20th, 25A and 25B Sapper Battalions; on the Lao, ten infantry battalions and others. Vũ Lập commander, Huỳnh Đắc Hương political commissar. The campaign runs to Apr. 25, 1970: 6,668 of the enemy put out of action and the plain retaken, by its count.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 241–46. Names: Vang Pao, Vũ Lập, Huỳnh Đắc Hương.'
      tags:
      - polity:drv
      - polity:laos
      - polity:pathet-lao
      - place:plain-of-jars
      - place:xieng-khouang
- add:
    entry:
      id: cal.1969-10-29.vietnam-hanoi
      when: Oct. 29
      date: '1969-10-29'
      thread: vietnam-hanoi
      also: [vietnam-operations]
      c: 'Quảng Đức. At dawn the Central Highlands Front''s artillery opens the Bu Prăng–Đức Lập campaign on Ka Te, Hill 936, the 66th Regiment closing round it. Its object the defense line of more than 80 kilometers along Route 14 by the Cambodian border: 11 battalions, three of the American 4th Division and eight of the Saigon 23d Division''s 45th and 53d Regiments. The Front''s force the 66th and 28th Infantry Regiments, the 20th and 37th Sapper Battalions, the 394th Infantry Battalion, the 40th Artillery Regiment and the forces of Region 10 and Quảng Đức. Ka Te taken Nov. 2, Bu Prăng Nov. 30; the campaign ends Dec. 5.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 149–52. To check: Viện Lịch sử quân sự Việt Nam, *Tóm tắt các chiến dịch trong kháng chiến chống Mỹ, cứu nước (1954–1975)* (Quân đội nhân dân, 2001), 256 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 152 n.).'
      tags:
      - polity:drv
      - province:quang-duc
- add:
    entry:
      id: cal.1969-11-03.vietnam-hanoi
      when: Nov. 3
      date: '1969-11-03'
      thread: vietnam-hanoi
      also: [vietnam-operations]
      c: 'The Liberation Army command opens the Phước Bình–Bù Đốp campaign in Phước Long and Bình Long: the 7th Division (the 209th, 165th and 141st Regiments), an artillery regiment, the 18th Sapper and 94th Engineer Battalions, under Đàm Văn Ngụy, the division''s commander; to destroy forces, cut Routes 13 and 14 and help the people against pacification. The Bù Đốp subsector besieged. The command ends the campaign Dec. 10: more than 1,000 of the enemy put out of action, by its count.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 138–39. To check: *Tóm tắt các chiến dịch* (2001), 259, 261 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 138 n.). Names: Đàm Văn Ngụy.'
      tags:
      - polity:drv
      - province:phuoc-long
      - province:binh-long
- add:
    entry:
      id: cal.1969-11-06.vietnam-hanoi
      when: Nov. 6
      date: '1969-11-06'
      thread: vietnam-hanoi
      also: [vietnam-paris]
      c: 'The Government''s statement on Nixon''s Vietnamization: the "change of policy" he praises means more war and holding on to the South, no right settlement at Paris; Vietnamese made to fight Vietnamese; American troops withdrawn drop by drop with no date for all, combat infantry only, the rest to stay; the war prolonged without limit.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 36–37. Names: Nixon.'
      tags:
      - polity:drv
      - polity:us
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1969-11-07.vietnam-hanoi
      when: Nov. 7
      date: '1969-11-07'
      thread: vietnam-hanoi
      also: [vietnam-paris]
      c: 'The Provisional Revolutionary Government''s statement: Nixon''s "Vietnamization" a policy of Vietnamese fighting Vietnamese, to prolong the war, keep the new colonialism in the South and divide Vietnam for good; the withdrawals by drops to calm American opinion.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 37. See [[cal.1969-11-06.vietnam-hanoi]]. Names: Nixon.'
      tags:
      - polity:drv
      - polity:us
      - name:nixon-richard-m
