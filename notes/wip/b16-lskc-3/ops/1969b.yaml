      id: cal.1969-12.vietnam-hanoi
      when: Dec., early
      date: '1969-12'
      thread: vietnam-hanoi
      c: 'The National Assembly''s Standing Committee approves splitting the Ministry of Heavy Industry into a Ministry of Power and Coal, a Ministry of Engineering and Metals and a General Department of Chemicals, and new Ministries of Food and of Materials and a Government Inspection Committee.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 173.'
