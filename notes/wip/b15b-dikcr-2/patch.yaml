- add:
    entry:
      id: cal.1967-01.china-leadership-41
      when: Jan., late
      date: '1967-01'
      at: before 1967-01-21
      thread: china-leadership
      place: shanghai
      c: 'Shanghai 上海: Zhang Chunqiao 张春桥, stressing discipline and obedience and reading out Lin Biao''s instructions, turns on his former allies: raids on them; a detachment of soldiers sent to Fudan University to occupy the offices of a rival organization; a run of directives ordering members of revolutionary organizations back to work.'
      'n': '[[w.dikotter-cultural-revolution]], 131 n.9. To check: [[w.hunter-shanghai-journal]], 232–243 (cited by [[w.dikotter-cultural-revolution]], 131 n.9). Names: Zhang Chunqiao, Lin Biao. Check: the day.'
      tags:
      - polity:prc
      - name:zhang-chunqiao
      - name:lin-biao
      src:
        c: a4c1513f
        rows:
        - 'w.dikotter-cultural-revolution 131: all'
- add:
    entry:
      id: cal.1967-01.china-5
      when: Jan., by the 31st
      date: '1967-01'
      at: before 1967-01-31
      thread: china
      place: shihezi
      c: 'Shihezi 石河子, Xinjiang 新疆: the military, siding with the old order, assaults rebel organizations it portrays as remnants of the Nationalist party and bad elements; by the end of January dozens mown down by machine guns.'
      'n': '[[w.dikotter-cultural-revolution]], 133 n.14. To check: Song Yongyi, "Chronology of Mass Killings during the Chinese Cultural Revolution (1966–1976)," *Online Encyclopedia of Mass Violence*, Aug. 25, 2011 (cited by [[w.dikotter-cultural-revolution]], 133 n.14). Check: the day.'
      tags:
      - polity:prc
      src:
        c: 01cfff7b
        rows:
        - 'w.dikotter-cultural-revolution 133: all'
        - 'via w.dikotter-cultural-revolution 133 n.14: all'
- add:
    entry:
      id: cal.1967.china-3
      when: 1967, early
      date: '1967'
      at: before 1967-01
      thread: china
      place: hunan
      c: 'As Dikötter has it: the Xiang River Group (Xiangjiang Fenglei), a loose coalition of rebel bodies formed after Mao''s call of October to "educate and liberate themselves," agitating for those branded counter-revolutionaries and rightists at Changsha in August 1966, claims a membership of 1 million all over Hunan 湖南: workers, teachers, shop assistants, government employees, local cadres.'
      'n': '[[w.dikotter-cultural-revolution]], 133 n.15. To check: Yiching Wu, *The Cultural Revolution at the Margins* (2014), 151–152 (cited by [[w.dikotter-cultural-revolution]], 133 n.15a); Wang Guangyu, *Qingshi nanyin* (2011), 142 (cited by [[w.dikotter-cultural-revolution]], 133 n.15b); Chen Yinan, *Qingchun wuhen* (2006), 97–108 (cited by [[w.dikotter-cultural-revolution]], 133 n.15c); Yu Xiguang, "Hunan," in *Wenge zaofan duoquan dadian*, web text (cited by [[w.dikotter-cultural-revolution]], 133 n.15d). See [[cal.1967-02.china-leadership-31]].'
      tags:
      - polity:prc
      - form:state
      src:
        c: 3b38d134
        rows:
        - 'w.dikotter-cultural-revolution 133: all'
        - 'via w.dikotter-cultural-revolution 133 n.15a: all'
        - 'via w.dikotter-cultural-revolution 133 n.15b: all'
        - 'via w.dikotter-cultural-revolution 133 n.15c: all'
        - 'via w.dikotter-cultural-revolution 133 n.15d: all'
- add:
    entry:
      id: cal.1967.china-7
      when: 1967, early
      date: '1967'
      at: before 1967-01
      thread: china
      place: fujian
      c: 'Fujian 福建: some mass organizations, until now in close touch with the military command under Han Xianchu, denounce it as an adherent of the bourgeois reactionary line and demand that Han step down; rumours that Chen Boda is secretly encouraging them.'
      'n': '[[w.dikotter-cultural-revolution]], 134 n.16. To check: Ken Ling, *The Revenge of Heaven* (1972), 254–298 (cited by [[w.dikotter-cultural-revolution]], 134 n.16a); Shui Luzhou, *Wenge jianlun*, web version, ch. 46 (cited by [[w.dikotter-cultural-revolution]], 134 n.16b). Names: Chen Boda. Check: the month.'
      tags:
      - polity:prc
      - name:chen-boda
      src:
        c: f44a0e82
        rows:
        - 'w.dikotter-cultural-revolution 134: all'
        - 'via w.dikotter-cultural-revolution 134 n.16a: all'
        - 'via w.dikotter-cultural-revolution 134 n.16b: all'
- add:
    entry:
      id: cal.1967.china-4
      when: 1967, early
      date: '1967'
      at: before 1967-01
      thread: china
      place: xiamen
      c: 'Xiamen 厦门: after the call to seize power Ken Ling and the rebels beat the municipal Party committee and its defenders and set up the Xiamen People''s Commune, on Shanghai''s lead; within days whole sections of the local government hand power over to them.'
      'n': '[[w.dikotter-cultural-revolution]], 134 n.16. To check: Ken Ling, *The Revenge of Heaven* (1972), 254–298 (cited by [[w.dikotter-cultural-revolution]], 134 n.16a); Shui Luzhou, *Wenge jianlun*, web version, ch. 46 (cited by [[w.dikotter-cultural-revolution]], 134 n.16b). Check: the month.'
      tags:
      - polity:prc
      src:
        c: a798b0b3
        rows:
        - 'w.dikotter-cultural-revolution 134: all'
        - 'via w.dikotter-cultural-revolution 134 n.16a: all'
        - 'via w.dikotter-cultural-revolution 134 n.16b: all'
- add:
    entry:
      id: cal.1967.china-5
      when: 1967, early
      date: '1967'
      at: before 1967-01
      thread: china
      place: xiamen
      c: 'Xiamen 厦门: rebels, rebel workers and local gangs storm the three-storey Public Security Bureau, held by the royalists with the local police behind them, ripping off the policemen''s badges; more than a hundred injured.'
      'n': '[[w.dikotter-cultural-revolution]], 134 n.16. To check: Ken Ling, *The Revenge of Heaven* (1972), 254–298 (cited by [[w.dikotter-cultural-revolution]], 134 n.16a); Shui Luzhou, *Wenge jianlun*, web version, ch. 46 (cited by [[w.dikotter-cultural-revolution]], 134 n.16b). See [[cal.1967.china-4]]. Check: the month.'
      tags:
      - polity:prc
      src:
        c: dfcd3d8b
        rows:
        - 'w.dikotter-cultural-revolution 134: all'
        - 'via w.dikotter-cultural-revolution 134 n.16a: all'
        - 'via w.dikotter-cultural-revolution 134 n.16b: all'
- add:
    entry:
      id: cal.1967.china-6
      when: 1967, early
      date: '1967'
      at: before 1967-01
      thread: china
      place: xiamen
      c: 'Xiamen 厦门: Han Xianchu and the provincial military command condemning the attack on the Public Security Bureau, the military in Xiamen orders the rebels to surrender; hundreds arrested and tried in public on the square before the Workers'' Palace of Culture, the rebels'' headquarters. Ken Ling, on a blacklist, flees the province.'
      'n': '[[w.dikotter-cultural-revolution]], 134 n.16. To check: Ken Ling, *The Revenge of Heaven* (1972), 254–298 (cited by [[w.dikotter-cultural-revolution]], 134 n.16a); Shui Luzhou, *Wenge jianlun*, web version, ch. 46 (cited by [[w.dikotter-cultural-revolution]], 134 n.16b). See [[cal.1967.china-4]]. Check: the month.'
      tags:
      - polity:prc
      src:
        c: a9e6b792
        rows:
        - 'w.dikotter-cultural-revolution 134: all'
        - 'via w.dikotter-cultural-revolution 134 n.16a: all'
        - 'via w.dikotter-cultural-revolution 134 n.16b: all'
- add:
    entry:
      id: cal.1967-02.china-2
      when: Feb., after the 23rd
      date: '1967-02'
      at: after 1967-02-23
      thread: china
      place: qinghai
      c: 'Qinghai 青海: in the week after the army''s assault on the *Qinghai Daily* some 10,000 people arrested, many of them tried as counter-revolutionaries and sent off to the camps.'
      'n': '[[w.dikotter-cultural-revolution]], 135 n.17. To check: Ding Shu, "L''Événement du 23 février au Qinghai," in Song Yongyi, *Les Massacres de la Révolution Culturelle* (2009), 67–88 (cited by [[w.dikotter-cultural-revolution]], 135 n.17a); Liu Guokai, *A Brief Analysis of the Cultural Revolution* (1987), 61 (cited by [[w.dikotter-cultural-revolution]], 135 n.17b). See [[cal.1967-02-23.china-leadership-4]].'
      tags:
