- add:
    entry:
      id: cal.1969-12.china-2
      when: Dec., by the 30th
      date: '1969-12'
      at: before 1969-12-30
      thread: china
      c: 'As Garside reports it: the war scare used to speed the removal of millions to the countryside; those back from the countryside without leave hunted out; the wives and children of men sent to May Seventh cadre schools, and the families of those resettled, banished in their turn; in Guangdong and Fujian 福建 long lines of refugees with baskets, mosquito nets, washbasins and cooking pots.'
      'n': '[[w.dikotter-cultural-revolution]], 210 n.9. Made public: 2016. To check: Roger Garside, "War Preparations: Peking," Dec. 30, 1969, FCO 21-483, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 210 n.9a); "China: War Scare," Nov. 28, 1969, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 210 n.9b).'
      tags:
      - polity:prc
      - form:state
      - ok:fields-place
      - polity:uk
      - vis:only:uk
      src:
        c: 475b8cd3
        rows:
        - 'w.dikotter-cultural-revolution 210: all'
        - 'via w.dikotter-cultural-revolution 210 n.9a: all'
        - 'via w.dikotter-cultural-revolution 210 n.9b: all'
- add:
    entry:
      id: cal.1969-12.china-3
      when: Dec., by the 2nd
      date: '1969-12'
      at: before 1969-12-02
      thread: china
      place: shanghai
      c: 'As Garside reports it: in Shanghai 上海 booklets handed out on the flight of bombs thrown forward by aircraft, cover from a nuclear strike, digging trenches, shooting at aircraft with rifles, first aid and fire-fighting; hoardings with the silhouettes of Soviet and American aircraft; on the Bund cartoons of Brezhnev behind a flowery screen at peace talks, a match in his hand and a rocket between his toes, and of Nixon egging him on while caressing a globe.'
      'n': '[[w.dikotter-cultural-revolution]], 210 n.10, n.11. Made public: 2016. To check: Roger Garside, "War Preparations: Shanghai," Dec. 2, 1969, FCO 21-483, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 210 n.10a); George Walden, "Preparations against War," Jan. 27, 1970, FCO 21-683, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 210 n.10b); Roger Garside, "War Preparations: Shanghai," Dec. 2, 1969, FCO 21-483, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 210 n.11).'
      tags:
      - polity:prc
      - form:state
      - polity:uk
      - vis:only:uk
      src:
        c: 461f4463
        rows:
        - 'w.dikotter-cultural-revolution 210: all'
        - 'via w.dikotter-cultural-revolution 210 n.10a: all'
        - 'via w.dikotter-cultural-revolution 210 n.10b: all'
        - 'via w.dikotter-cultural-revolution 210 n.11: all'
- add:
    entry:
      id: cal.1969-12.china-leadership-7
      when: Dec., by the 30th
      date: '1969-12'
      at: before 1969-12-30
      thread: china-leadership
      place: hebei
      c: 'As Hebei 河北 reports have it: in the war scare some at Handan 邯郸 wonder at the fuss over a few shots; others panic, some fleeing to the countryside, some selling all they own for a last feast; villagers elsewhere slaughter their pigs against another requisition; panic buying of batteries and candles; counter-revolutionary slogans foretelling the Party''s fall; in one county an underground group calls on the people to "co-ordinate our movements with the United States and the Soviet Union in our attack on Beijing!"; flares go up; Feng Guiyuan: "When troops from the Soviet Union come, I will go out there and welcome them"; in Wanquan county Ma Yue, a landlord''s wife, takes her children to see the house taken from them in the land reform.'
      'n': '[[w.dikotter-cultural-revolution]], 210–211 n.12. Made public: 2016. To check: Hebei Provincial Archives, Dec. 6, 1969, 919-1-295 (cited by [[w.dikotter-cultural-revolution]], 211 n.12a); Hebei Provincial Archives, Dec. 26, 1969, 919-1-295 (cited by [[w.dikotter-cultural-revolution]], 211 n.12b); Hebei Provincial Archives, Dec. 30, 1969, 919-1-295 (the three papers pp. 27–28, 72, 114–115) (cited by [[w.dikotter-cultural-revolution]], 211 n.12c); Hebei Provincial Archives, Dec. 26, 1969, 919-1-294, p. 124 (cited by [[w.dikotter-cultural-revolution]], 211 n.12d).'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 5d7b5631
        rows:
        - 'w.dikotter-cultural-revolution 211: all'
        - 'via w.dikotter-cultural-revolution 211 n.12a: all'
        - 'via w.dikotter-cultural-revolution 211 n.12b: all'
        - 'via w.dikotter-cultural-revolution 211 n.12c: all'
        - 'via w.dikotter-cultural-revolution 211 n.12d: all'
- add:
    entry:
      id: cal.1969-12.china-4
      when: Dec., by the 30th
      date: '1969-12'
      at: before 1969-12-30
      thread: china
      c: 'As British reports have it: workers, officials and schoolchildren trained in civil defence; in Shanghai 上海 children marching in formation drop to the ground at a whistle and cover their eyes, others drill with dummy rifles; in Peking 北京 young people stage mock street battles with wooden guns, papers on their chests for friend and foe; recruits taught firearms; searchlight practice in the evenings.'
      'n': '[[w.dikotter-cultural-revolution]], 211 n.14. Made public: 2016. To check: Public Record Office, "Shanghai," Nov. 4, 1969, FCO 21-513 (cited by [[w.dikotter-cultural-revolution]], 211 n.14a); Roger Garside, "War Preparations: Peking," Dec. 30, 1969, FCO 21-483, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 211 n.14b); George Walden, "Preparations against War," Jan. 27, 1970, FCO 21-683, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 211 n.14c).'
      tags:
      - polity:prc
      - form:state
      - ok:fields-place
      - ok:fields-time
      - polity:uk
      - vis:only:uk
      src:
        c: 6123e516
        rows:
        - 'w.dikotter-cultural-revolution 211: all'
        - 'via w.dikotter-cultural-revolution 211 n.14a: all'
        - 'via w.dikotter-cultural-revolution 211 n.14b: all'
        - 'via w.dikotter-cultural-revolution 211 n.14c: all'
