      when: Jan. 13
      date: '1968-01-13'
      thread: china-leadership
      place: shaanxi
      c: 'As a Shaanxi report has it: at the county seat of Yaoxian over 10,000 people go to market each day, rationed goods sold against the state monopoly, some 2.5 tonnes of sweet potatoes and several hundred kilos of peanuts a day, up to eighty bicycles changing hands a market day, dozens of pedlars without permits; in Fuping county some markets wholly unregulated, unlicensed doctors, itinerant dentists and private butchers at work, a lively trade in joss paper, outlawed in 1966; black marketeers openly resist arrest, inspectors overwhelmed by crowds.'
      'n': '[[w.dikotter-cultural-revolution]], 224–225 n.8. Made public: 2016. To check: Shaanxi Provincial Archives, Jan. 13, 1968, 215-1-1363, p. 190 (cited by [[w.dikotter-cultural-revolution]], 224 n.8).'
