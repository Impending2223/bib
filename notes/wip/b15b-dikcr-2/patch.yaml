      when: '1968'
      date: '1968'
      thread: china
      place: chengdu
      c: 'Chengdu 成都: an ancient palace gate in the city''s center blown up with dynamite to make room for a giant statue of Mao 毛泽东; white marble shipped from the mountains in "loyalty lorries" dressed in red silk; at the quarry the workers put aside the machinery to work with their bare hands.'
      'n': '[[w.dikotter-cultural-revolution]], 169 n.18. To check: [[w.chang-wild-swans]], 520–521 (cited by [[w.dikotter-cultural-revolution]], 169 n.18). Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      src:
        c: eafceba3
        rows:
        - 'w.dikotter-cultural-revolution 169: all'
- add:
    entry:
      id: cal.1968.china-leadership-117
      when: '1968'
      date: '1968'
      thread: china-leadership
      place: shanghai
      c: 'As Shanghai 上海 reports have it: more than 600,000 statues of Mao 毛泽东 in Shanghai''s institutions in 1968, of plaster, reinforced concrete, aluminium, tinplate and marble, from three to fifteen meters; 900 tonnes of tinplate used in the year; the Steel Institute''s monument in stainless steel at 100,000 yuan; one unit diverting close to 40 tonnes of concrete meant for a storeroom.'
      'n': '[[w.dikotter-cultural-revolution]], 169 n.19. Made public: 2016. To check: Shanghai Municipal Archives, July 11, 1967, B103-4-1, pp. 1–3 (cited by [[w.dikotter-cultural-revolution]], 169 n.19a); Shanghai Municipal Archives, Dec. 9, 1969, B98-5-100, pp. 10–11 (cited by [[w.dikotter-cultural-revolution]], 169 n.19b); Shanghai Municipal Archives, Aug. 1, 1968, B109-4-80, p. 31 (cited by [[w.dikotter-cultural-revolution]], 169 n.19c); Jin Dalu, *Feichang yu zhengchang* (2011), II, 198–228 (cited by [[w.dikotter-cultural-revolution]], 169 n.19d). Names: Mao Zedong.'
      tags:
