- add:
    entry:
      id: cal.1965-06.china-leadership-8
      when: June
      date: '1965-06'
      thread: china-leadership
      c: 'Mao 毛泽东 proposes shelters dug under the houses, about a metre deep, every house joined by tunnels and every household digging its own: "the state will not have to incur any expenses."'
      'n': '[[w.dikotter-cultural-revolution]], 211–212 n.15. Made public: 2016. To check: Shanghai Municipal Archives, List of Quotations by Mao Zedong on Air Raids Dating from 1964 to 1974, B105-9-638, pp. 15–16 (cited by [[w.dikotter-cultural-revolution]], 212 n.15). Names: Mao Zedong. Check: the day.'
