      when: June
      date: '1967-06'
      thread: china-leadership
      c: 'As a State Council 国务院 report has it: freight workers and longshoremen no longer turn up in the main ports from Dalian 大连 to Guangzhou 广州; of an average of 138 ships a day to be berthed and unloaded, more than half wait a month at anchorage; in Manchuria scores of factories that rely on shipping stop production; in Shanghai 上海 the revolutionary committee turns schools, temples and other public spaces into storage as hundreds of lorries clear 400,000 tonnes of abandoned freight; at Chongqing 重庆 the army tackles the backlog in the inland port.'
      'n': '[[w.dikotter-cultural-revolution]], 147 n.1. Made public: 2016. To check: Report by the State Council, June 1967, Guangdong Provincial Archives, 235-2-261, pp. 39–41 (cited by [[w.dikotter-cultural-revolution]], 147 n.1a); Guangdong Provincial Archives, May 29, 1967, 235-2-261, pp. 24–28 (cited by [[w.dikotter-cultural-revolution]], 147 n.1b). Check: the day.'
