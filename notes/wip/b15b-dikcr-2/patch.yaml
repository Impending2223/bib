- add:
    entry:
      id: cal.1967-03.china-2
      when: Mar.
      date: '1967-03'
      thread: china
      place: peking
      c: 'Peking: a military team arrives at Zhai Zhenhua''s school and, holding no meeting with the Red Guards, tells the gathered students that the Red Guards helped the work teams push the bourgeois reactionary line, persecuting students of bad class background instead of the capitalist roaders; the students are told to rise against them, the Red Guards made to confess their errors in class; a new set of student leaders under a platoon leader.'
      'n': '[[w.dikotter-cultural-revolution]], 139 n.25. To check: [[w.zhenhua-red-flower-of-china]], 119 (cited by [[w.dikotter-cultural-revolution]], 139 n.25). Check: the day.'
      tags:
      - polity:prc
      src:
        c: 8485e718
        rows:
        - 'w.dikotter-cultural-revolution 139: all'
- add:
    entry:
      id: cal.1967.china-8
      when: 1967, spring
      date: '1967'
      at: before 1967-03-21
      thread: china
      place: zhengding
      c: 'Zhengding: thirty-six soldiers with backpacks march into Gao Yuan''s school; the students, back in one room for the first time since September, drilled on the sports field each day from before dawn; much time given to Mao Zedong Thought.'
      'n': '[[w.dikotter-cultural-revolution]], 139 n.26. To check: [[w.yuan-born-red]], 200–202 (cited by [[w.dikotter-cultural-revolution]], 139 n.26). Check: the month.'
      tags:
      - polity:prc
      - ok:fields-time
      src:
        c: 8f660fdc
        rows:
        - 'w.dikotter-cultural-revolution 139: all'
- add:
    entry:
      id: cal.1967.china-9
      when: 1967, spring
      date: '1967'
      at: before 1967-03-21
      thread: china
      place: peking
      c: 'As Fokkema reports it: in the capital posters and slogans taken off the buses and shop windows scraped clean; a few young couples walk hand in hand; people sit in the sun on their doorsteps, a few play badminton in the side streets.'
      'n': '[[w.dikotter-cultural-revolution]], 139 n.27. To check: Douwe W. Fokkema, *Report from Peking* (1971), 79–80 (cited by [[w.dikotter-cultural-revolution]], 139 n.27).'
      tags:
      - polity:prc
      - form:state
      src:
        c: dd5648aa
        rows:
        - 'w.dikotter-cultural-revolution 139: all'
        - 'via w.dikotter-cultural-revolution 139 n.27: all'
- add:
    entry:
      id: cal.1967-03.china-leadership-41
      when: Mar., by the 21st
      date: '1967-03'
      at: before 1967-03-21
      thread: china-leadership
      place: shanghai
      c: 'As Shanghai reports have it: less than half of the city''s schools escaped major destruction and one in five must be written off; classes, where resumed, intermittent, some schools open two or three hours a week; at the Ningbo Road and Nanjing East Road Primary Schools gangs of pupils ("Tokyo," "Field Army") steal light bulbs, telephones, microphones, bicycles, locks, windowpanes and cables, and beat people up for a fee, 10 yuan a victim in March; teachers spat at, excrement thrown on them from the upper floors.'
      'n': '[[w.dikotter-cultural-revolution]], 139–140 n.28. Made public: 2016. To check: Shanghai Municipal Archives, Mar. 4, 16 and 21, 1967, B105-4-58, pp. 1–3, 36–37 and 74–76 (cited by [[w.dikotter-cultural-revolution]], 140 n.28). Check: the day.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 5897a290
        rows:
        - 'w.dikotter-cultural-revolution 140: all'
        - 'via w.dikotter-cultural-revolution 140 n.28: all'
