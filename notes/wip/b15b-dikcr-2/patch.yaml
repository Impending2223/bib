      'n': '[[w.dikotter-cultural-revolution]], 196 n.13. Made public: 2016. To check: Report on Market Conditions, Nanjing, Mar. 18, 1966, Nanjing Municipal Archives, 5003-3-1139, pp. 78–86 (cited by [[w.dikotter-cultural-revolution]], 196 n.13).'
