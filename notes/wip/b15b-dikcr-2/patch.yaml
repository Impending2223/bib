        - 'w.dikotter-cultural-revolution 145: all'
- add:
    entry:
      id: cal.1967-03.china-leadership-42
      when: Mar.
      date: '1967-03'
      thread: china-leadership
      c: Zhang Xiting and Liu Jieting, expelled from the Party in 1965, appeal to Chen Boda, who introduces them to Jiang Qing; they are rehabilitated and empowered to organize a Sichuan Revolutionary Committee.
      'n': '[[w.dikotter-cultural-revolution]], 145 n.39. Made public: 1991 at the latest. To check: [[w.chang-wild-swans]], 435 (cited by [[w.dikotter-cultural-revolution]], 145 n.39). See [[cal.1965.china-leadership-30]]. Names: Chen Boda, Jiang Qing. Check: the day.'
