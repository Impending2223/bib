      c: 'Peking 北京: the Ministry of Defense''s banquet for the army''s fortieth anniversary. Yang Chengwu 杨成武, the acting chief of staff, in the evening''s speech calls Peng Dehuai 彭德怀 and Luo Ruiqing 罗瑞卿 counter-revolutionary revisionists; weary applause from the top brass. Jiang Qing 江青, in uniform, rises with Ye Qun 叶群 to walk among the younger delegates, glass in hand, toasting the rebels and young cadets.'
