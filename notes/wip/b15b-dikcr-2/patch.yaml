- add:
    entry:
      id: cal.1967-01-04.china-leadership-15
      when: Jan. 4–5
      date: '1967-01-04'
      thread: china-leadership
      place: peking
      c: 'Peking 北京, the Workers'' Stadium: Luo Ruiqing 罗瑞卿, unable to walk since his attempt at suicide, his left leg bandaged, carried in a basket before two days of Red Guard delegations voicing their hatred on the stage. Photographs of Luo, held in the jet-plane position by two soldiers, widely disseminated.'
      'n': '[[w.dikotter-cultural-revolution]], 128–129 n.1. To check: Wang Chenglin, *Chongqing zalan gong, jian, fa qinli ji* (2003), 20–40 (cited by [[w.dikotter-cultural-revolution]], 129 n.1a); [[w.fokkema-report-from-peking]], 62 (cited by [[w.dikotter-cultural-revolution]], 129 n.1b). The time is the first day''s. Names: Luo Ruiqing. Check: whether one meeting with Peng Zhen''s at the Workers'' Gymnasium the same day ([[cal.1967-01-04.china-leadership-12]]).'
      tags:
      - polity:prc
      - name:luo-ruiqing
      src:
        c: 7c5a489e
        rows:
        - 'w.dikotter-cultural-revolution 128–129: all'
        - 'via w.dikotter-cultural-revolution 129 n.1a: all'
- add:
    entry:
      id: cal.1967-01-20.china-leadership-8
      when: Jan. 20
      date: '1967-01-20'
      thread: china-leadership
      c: 'Shanxi 山西: the provincial military commander who backed Liu Geping''s 劉格平 big-character poster announcing a rebel seizure of power at Taiyuan 太原, the two facing opposition from their colleagues, writes to Lin Biao 林彪 for his support.'
      'n': '[[w.dikotter-cultural-revolution]], 129 n.3. Made public: 2016 at the latest. To check: Zhang Guanghua, *Zhenshi de huiyi* (2010), 232 (cited by [[w.dikotter-cultural-revolution]], 129 n.3a); Liu Zuneng, *Wo de gushi* (2011), 351–353 (cited by [[w.dikotter-cultural-revolution]], 129 n.3b); [[w.macfarquhar-maos-last-revolution]], 170–171 (cited by [[w.dikotter-cultural-revolution]], 129 n.3c). See [[cal.1967-01-12.china-leadership-7]]. Names: Lin Biao.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:lin-biao
      - ok:fields-place
      src:
        c: d35ce3bf
        rows:
        - 'w.dikotter-cultural-revolution 129: all'
        - 'via w.dikotter-cultural-revolution 129 n.3a: all'
        - 'via w.dikotter-cultural-revolution 129 n.3b: all'
