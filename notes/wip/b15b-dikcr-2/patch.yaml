- add:
    entry:
      id: cal.1967-09.china
      when: Sept., late
      date: '1967-09'
      at: before 1967-09-21
      thread: china
      place: peking
      c: 'As Hopson reports it: in Peking 北京 posters scraped from walls, windows and pavements for National Day, the walls almost clean after days of scrubbing; only official slogans allowed, on unity, work and support for the army; on the campuses loudspeakers day after day: "Unite Together!", "Among Workers There Can Be No Fundamental Contradictions!"'
      'n': '[[w.dikotter-cultural-revolution]], 164 n.4. Made public: 2016. To check: Donald C. Hopson, "Letter from Beijing," Oct. 7, 1967, FCO 21-41, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 164 n.4a); [[w.daiyun-to-the-storm]], 225 (cited by [[w.dikotter-cultural-revolution]], 164 n.4b). Check: the day.'
