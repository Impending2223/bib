      date: '1967-08'
      at: after 1967-08-10
      thread: china
      place: changsha
      c: 'As Liang Heng has it: in Changsha 长沙 the rebels, empowered overnight, storm their opponents'' strongholds, burn papers and beat captives with leather belts; then fall out among themselves over which military faction to back and over seats on the provisional committee; the guns of the Forty-Seventh Army no longer suffice, and they steal from the militias, break into arsenals and attack military bases for grenades, machine guns, cannon and anti-aircraft missiles; a curfew; stray mortar shells on roofs and roads; windows taped against the blasts.'
