      at: after 1967-03-08
      thread: china-leadership
      c: Ye Jianying 叶剑英 and Xu Xiangqian 徐向前, Mao 毛泽东 having turned against the suppression in Qinghai 青海, are made to write self-criticisms accepting that their handling of Qinghai was a serious error.
      'n': '[[w.dikotter-cultural-revolution]], 138 n.23. Made public: 2009 at the latest. To check: Ding Shu, "L''Événement du 23 février au Qinghai," in Song Yongyi, *Les Massacres de la Révolution Culturelle* (2009), 86–87 (cited by [[w.dikotter-cultural-revolution]], 138 n.23a); Xue Tingchen, *Wuhui rensheng* (2011), 180–193 (cited by [[w.dikotter-cultural-revolution]], 138 n.23b). See [[cal.1967-03-11.china-leadership]]. Names: Ye Jianying, Xu Xiangqian, Mao Zedong. Check: the day.'
