      place: heilongjiang
      c: 'Heilongjiang 黑龙江, two years to the day after Mao''s 毛泽东 letter to Lin Biao 林彪 of May 7, 1966: the province sets up the "May Seventh Cadre School," a labour farm in the countryside where "capitalist roaders," "revisionists" and other wayward officials are to work, live and reform themselves.'
