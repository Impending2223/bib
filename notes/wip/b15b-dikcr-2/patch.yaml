- edit:
    id: cal.1967-03-19.china-leadership-4
    base: '39783177'
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter: over the following months some 2.8 million soldiers left their barracks to occupy key positions across the country, shadowing the Party and state ([[w.dikotter-cultural-revolution]], 138–139).'
- edit:
    id: cal.1967-03-16.china-leadership-2
    base: a2459985
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Barnouin and Yu: in the months after Mao''s change of mind in March 1967 Red Guards investigated some 5,000 cadres for hidden traitors; several were hounded to their deaths ([[w.dikotter-cultural-revolution]], 156, citing [[w.barnouin-ten-years-of-turbulence]], 185–186).'
- edit:
    id: cal.1968-07-03.china-leadership
    base: e75b3007
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter: across Guangxi as many as 80,000 people were killed in the summer of 1968, the local militia joining the army to hunt down alleged rebels and outcasts ([[w.dikotter-cultural-revolution]], 176).'
- edit:
    id: cal.1968-09-23.china-leadership-5
    base: be289db0
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Bu Weihua: in the campaign in Shanghai, thirty-nine enemy organizations uncovered, more than 3,600 detained and persecuted; some 170,000 harassed in all; more than 5,400 committed suicide, were beaten to death or were executed; of the twenty leading officials of the city committee before the Cultural Revolution all but three denounced as "traitors, spies and capitalist roaders" ([[w.dikotter-cultural-revolution]], 185, citing [[w.pu-weihua-zalan-jiu-shijie]], 677).'
- edit:
    id: cal.1968-01-21.china-leadership-2
    base: 9aae311b
    set:
      place: peking
      gloss:
        title: Estimates
        text:
        - 'Dikötter: by 1969 the witch-hunt across Yunnan that began here had caused 17,000 deaths and left 61,000 crippled for life ([[w.dikotter-cultural-revolution]], 189).'
- edit:
    id: cal.1965-11-10.china-leadership
    base: 78263edf
    set:
      gloss:
        title: Estimates
        text:
        - Estimates of the Cultural Revolution's dead (the thread's matter, set on its first entry, Yao Wenyuan's article, by the owner's rule of Nov. 21, 2026).
        - 'Yang Jisheng: the cleansing of the class ranks, the "one strike, three anti" and the hunt for the "May 16" elements together cost over 2 million abnormal deaths, twenty times the cadres who died abnormally in the Cultural Revolution; those killed in mass slaughters by the authorities not fewer than 300,000 ([[w.yang-jisheng-tiandi-fanfu]], II, 633, 685). In Guangxi, of the 89,700 dead with names and addresses reported in 1984, 79,000 killed in organized massacres; on a total of 100,000, 80,000 massacred (II, 676).'
        - 'The estimates Yang gives: Ding Shu, 30 million struggled in the cleansing and 500,000 dead; Andrew Walder and Su Yang, from over 1,500 county gazetteers, some 36 million persecuted in the countryside, 750,000 to 1.5 million killed, as many maimed; the official history, 100 million implicated ([[w.yang-jisheng-tiandi-fanfu]], II, 600). For the "one strike, three anti": Wang Rui, 20,000 to 30,000 killed; Ding Shu, 100,000, or 150,000 to 200,000 (II, 632).'
        - 'Dikötter, after Ding Shu and Jonathan Unger: in the cleansing of the class ranks, in the great majority of the more than 2,000 counties more than a hundred people beaten to death or driven to suicide, in some four to five hundred; in Guangdong, by one estimate, 40,000 unnatural deaths ([[w.dikotter-cultural-revolution]], 189). After Su Yang: in the Cultural Revolution more than 400,000 people systematically exterminated in villages across the country, neighbours killing neighbours (223). The hunt for the "May Sixteenth" elements, from 1967, may alone have implicated as many as 3.5 million (235, 240).'
- edit:
    id: cal.1968-12-21.china-leadership-3
    base: 6d35c11d
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter: every year a million young students sent into exile; from 1962 to 1978 some 18 to 20 million banished from the cities in all ([[w.dikotter-cultural-revolution]], 200).'
