- add:
    entry:
      id: cal.1967-04.china-3
      when: Apr.–May
      date: '1967-04'
      thread: china
      place: chengdu
      c: 'Chengdu 成都: hundreds wounded in battles between the two factions; Jung Chang sees processions of tens of thousands of rebels carrying the bloody corpses of the dead; in the city of the arms industry some workers fight with hand grenades, automatic rifles, mortars and rocket-propelled grenade launchers.'
      'n': '[[w.dikotter-cultural-revolution]], 145. Check: the days.'
