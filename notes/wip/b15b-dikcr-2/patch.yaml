      date: '1967'
      at: before 1967-09-23
      thread: china-leadership
      place: changsha
      c: 'Changsha 长沙: the military having ended the summer''s fighting, batch after batch of suspect cadres sent to the city''s Party school for Mao Zedong Thought study classes while their cases are investigated.'
