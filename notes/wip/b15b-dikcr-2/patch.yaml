      when: Apr. 7
      date: '1967-04-07'
      thread: china
      place: peking
      c: 'Peking 北京: the *Beijing ribao* opens fire on Liu Shaoqi 刘少奇, under house arrest since August 1966.'
      'n': '[[w.dikotter-cultural-revolution]], 141 n.32. To check: Wang Guangyu, *Qingshi nanyin* (2011), 144–147 (cited by [[w.dikotter-cultural-revolution]], 141 n.32a); [[w.zhenhua-red-flower-of-china]], 126 (cited by [[w.dikotter-cultural-revolution]], 141 n.32b); Ken Ling, *The Revenge of Heaven* (1972), 214–215 (cited by [[w.dikotter-cultural-revolution]], 141 n.32c). See [[cal.1967-04.china-leadership-2]]. Names: Liu Shaoqi.'
