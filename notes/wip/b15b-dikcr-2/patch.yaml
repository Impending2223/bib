- add:
    entry:
      id: cal.1968-03-18.china-leadership-4
      when: Mar. 18
      date: '1968-03-18'
      thread: china-leadership
      place: peking
      c: 'Peking 北京, the Great Hall: Jiang Qing 江青, flanked by Ye Qun 叶群, Kang Sheng 康生, Chen Boda 陈伯达 and Wu Faxian 吴法宪, receives the delegates from Zhejiang 浙江: "rightist splittism has raised its head from last winter to the present." Kang Sheng: the big task of the Cultural Revolution is to drag out the traitors and agents hidden in the Party; Liu Shaoqi 刘少奇 a traitor to the Nationalists and the Japanese; Wang Guangmei 王光美 an agent of the United States, Japan and the Nationalists; Peng Zhen 彭真 a big renegade; Peng Dehuai 彭德怀 a spy and traitor; Luo Ruiqing 罗瑞卿 an agent never in the Party; He Long 贺龙 a bandit; Lu Dingyi 陆定一 in Chiang Kai-shek''s pay; Tan Zhenlin 谭震林 a turncoat. Jiang Qing leans forward: "Down with Deng Xiaoping!"; Kang adds that Deng was a deserter.'
      'n': '[[w.dikotter-cultural-revolution]], 172, 184 n.26, n.2. To check: "Zhongyang shouzhang jiejian Zhejiang sheng fujing daibiaotuan shi de zhongyao jianghua," Mar. 18, 1968, Cultural Revolution Database (cited by [[w.dikotter-cultural-revolution]], 172 n.26e); [[w.milton-wind-will-not-subside]], 315 (cited by [[w.dikotter-cultural-revolution]], 184 n.2a); Zhou Enlai, Kang Sheng and Jiang Qing, "Zhongyang shouzhang jiejian Zhejiang sheng fujing daibiaotuan shi de zhongyao jianghua," Mar. 18, 1968, Cultural Revolution Database (cited by [[w.dikotter-cultural-revolution]], 184 n.2b). See [[cal.1968-03-15.china-leadership]]. Names: Jiang Qing, Ye Qun, Kang Sheng, Chen Boda, Wu Faxian, Liu Shaoqi, Peng Zhen, Peng Dehuai, Luo Ruiqing, He Long, Lu Dingyi, Tan Zhenlin, Deng Xiaoping.'
      tags:
      - polity:prc
