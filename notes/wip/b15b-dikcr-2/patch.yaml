      thread: china-leadership
      c: Zhang Xiting 張西挺 and her husband Liu Jieting 刘结挺, cadres at Yibin 宜宾, Sichuan 四川, who used their posts for persecutions and vendettas and caused starvation across the county, silencing critics of the famine, are expelled from the Party.
