      'n': '[[w.dikotter-cultural-revolution]], 172 n.26. To check: [[w.milton-wind-will-not-subside]], 309–311 (cited by [[w.dikotter-cultural-revolution]], 172 n.26a). See [[cal.1967.china-leadership-150]]. Names: Jiang Qing. Check: the day.'
