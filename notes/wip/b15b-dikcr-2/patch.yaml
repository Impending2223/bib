      when: July, by the 9th
      date: '1968-07'
      at: before 1968-07-09
      thread: china-leadership
      place: hunan
      c: 'As Hunan 湖南 reports have it: between a quarter and half of the students given their orders to go to the countryside feign ignorance; parents plead with cadres, pull strings and find their children jobs, four in ten in Qiangyang county; papers doctored, names faked; one parent: "if you want my daughter to leave for the countryside you will have to clear my name"; old mass organizations hide students in the city; some cadres refuse outright: "I will never send young students to the countryside"; a rebel: "Alive I will not go to the countryside, dead on a stretcher I will."'
      'n': '[[w.dikotter-cultural-revolution]], 193–194 n.7. Made public: 2016. To check: Hunan Provincial Archives, June 25, 1968, 182-2-44 (cited by [[w.dikotter-cultural-revolution]], 194 n.7a); Hunan Provincial Archives, June 30, 1968, 182-2-44 (cited by [[w.dikotter-cultural-revolution]], 194 n.7b); Hunan Provincial Archives, July 5, 1968, 182-2-44 (cited by [[w.dikotter-cultural-revolution]], 194 n.7c); Hunan Provincial Archives, July 9, 1968, 182-2-44 (the four papers, pp. 2–3, 6, 9 and 41–45) (cited by [[w.dikotter-cultural-revolution]], 194 n.7d). Check: the day.'
      tags:
