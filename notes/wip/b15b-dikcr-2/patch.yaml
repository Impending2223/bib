- add:
    entry:
      id: cal.1967-07.china-5
      when: July, mid
      date: '1967-07'
      at: before 1967-07-11
      thread: china
      place: zhengding
      c: 'Zhengding: Gao Yuan''s faction, backed by a missile-engineering institute under the General Staff, besieges its opponents, backed by the military command at Shijiazhuang, in a building of the Public Security Bureau, with catapults shooting bricks into the compound; a schoolmate of Gao''s on the other side throws herself from a third-floor window wrapped in her organization''s red flag, shouting "Long live Chairman Mao!" A white flag goes up; the resistance ends.'
      'n': '[[w.dikotter-cultural-revolution]], 143–144 n.37. To check: [[w.yuan-born-red]], 251 (cited by [[w.dikotter-cultural-revolution]], 144 n.37). Check: the day; by mid-July the opposition had been driven into the building.'
      tags:
      - polity:prc
      src:
        c: 13d3a581
        rows:
        - 'w.dikotter-cultural-revolution 144: all'
- add:
    entry:
      id: cal.1965.china-leadership-30
      when: '1965'
      date: '1965'
      thread: china-leadership
      c: Zhang Xiting and her husband Liu Jieting, cadres at Yibin, Sichuan, who used their posts for persecutions and vendettas and caused starvation across the county, silencing critics of the famine, are expelled from the Party.
      'n': '[[w.dikotter-cultural-revolution]], 144–145 n.39. Made public: 1991 at the latest. To check: [[w.chang-wild-swans]], 435 (cited by [[w.dikotter-cultural-revolution]], 145 n.39).'
