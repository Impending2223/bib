      c: 'As Shaanxi reports have it: in a survey of thirty counties more than two-thirds of the local markets run without supervision; at Yinzhen and Sanqiao, by the provincial capital, the black market in timber alone some 30,000 yuan a day, windows, doors and coffins sold so briskly that the trade blocks traffic; teams of up to a hundred villagers fell trees in the mountains outside the plan, a trade begun in the summer of 1966.'
