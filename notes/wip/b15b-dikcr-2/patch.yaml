- add:
    entry:
      id: cal.1968.china-leadership-120
      when: 1968, early
      date: '1968'
      at: before 1968-01
      thread: china-leadership
      place: inner-mongolia
      c: 'Inner Mongolia 内蒙古: Kang Sheng 康生 and Xie Fuzhi 谢富治, reviving the case of Ulanfu 烏蘭夫, launch a campaign of terror against former members of the Inner Mongolian People''s Party, founded by Ulanfu in the 1930s, now suspected as spies and traitors, most of them Mongol farmers and herdsmen; torture chambers across the province: tongues torn out, teeth pulled with pliers, eyes gouged, flesh branded, women sexually abused, men whipped to the bone, a few burned alive. Teng Haiqing 滕海清, the general heading the revolutionary committee, the chief instigator.'
      'n': '[[w.dikotter-cultural-revolution]], 190–191 n.17, n.18. Made public: 1995 at the latest. To check: Tumen and Zhu Dongli, *Kang Sheng yu "Neirendang" yuan''an* (1995), 202–203 (cited by [[w.dikotter-cultural-revolution]], 190 n.17); Ba Yantai, *Nei Menggu wasu zainan shilu* (1999) (cited by [[w.dikotter-cultural-revolution]], 191 n.18a); Yang Haiying, "Yi ''routi de xiaomie'' shixian ''minzu de xiaowang''," *Minzu xuebao*, no. 29 (Dec. 2009), 1–23 (cited by [[w.dikotter-cultural-revolution]], 191 n.18b); Gao Shuhua and Cheng Tiejun, *Nei Meng wenge fenglei* (2007) (cited by [[w.dikotter-cultural-revolution]], 191 n.18c). Names: Kang Sheng, Xie Fuzhi. Check: the month.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:kang-sheng
      - name:xie-fuzhi
      gloss:
        title: Estimates
        text:
        - 'Dikötter: around 800,000 people incarcerated, interrogated and denounced in the province; the Mongols, less than 10 percent of the population, more than 75 percent of the victims; at the Hohhot railway bureau all but two of the 446 Mongol employees persecuted; the estimates of the dead range from 16,000 to 23,000 ([[w.dikotter-cultural-revolution]], 190–191).'
      src:
        c: 208212e6
        rows:
        - 'w.dikotter-cultural-revolution 190–191: all'
