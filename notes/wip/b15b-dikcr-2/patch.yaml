- add:
    entry:
      id: cal.1968-03.china-leadership-22
      when: Mar.
      date: '1968-03'
      thread: china-leadership
      c: 'The campaign of the Three Loyalties and Four Boundless Loves is launched: absolute loyalty to Mao 毛泽东, his thought and his proletarian revolutionary line; altars to the Chairman in schools, offices and factories, "The Red Sun in Our Hearts" in red paper over his picture; morning readings from the Little Red Book and the three wishes of ten thousand years to Mao and good health to Lin Biao 林彪.'
      'n': '[[w.dikotter-cultural-revolution]], 168 n.15. To check: Pamela Tan, *The Chinese Factor* (2008), 131 (cited by [[w.dikotter-cultural-revolution]], 168 n.15). Names: Mao Zedong, Lin Biao. Check: the day.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - ok:fields-place
      - ok:fields-time
      src:
        c: b27bf562
        rows:
        - 'w.dikotter-cultural-revolution 168: all'
        - 'via w.dikotter-cultural-revolution 168 n.15: all'
- add:
    entry:
      id: cal.1968-06.china
      when: June, by the 3rd
      date: '1968-06'
      at: before 1968-06-03
      thread: china
      place: peking
      c: 'As Cradock reports it: in Peking 北京 miniature shrines on sale, a triptych with Mao''s 毛泽东 portrait in the center and quotations on the panels, in place of the old family altar; a loyalty dance, arms moving from the heart to the Chairman''s portrait to the song "Beloved Chairman Mao"; whole evenings of ritual song and dance on television, a giant bust at the center of the stage throbbing with electric light.'
      'n': '[[w.dikotter-cultural-revolution]], 168–169 n.17. Made public: 2016. To check: Percy Cradock, "Letter from Peking," June 3, 1968, FCO 21-19, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 169 n.17). Names: Mao Zedong.'
      tags:
      - polity:prc
      - form:state
      - polity:uk
      - vis:only:uk
      - name:mao-zedong
      src:
        c: 86558d3f
        rows:
