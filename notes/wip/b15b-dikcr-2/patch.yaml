      when: Apr., by the 7th
      date: '1969-04'
      at: before 1969-04-07
      thread: china-leadership
      place: qiuxian
      c: 'As Hebei 河北 reports have it: in Qiuxian county more than a thousand people, about 1 percent of the population, locked up, forty houses in the main town taken over as jails, many accused of belonging to a "New Nationalist Party" run from Taipei; torture chambers across the county; hundreds of homes ransacked, floors torn up and walls pulled down; the head of the revolutionary committee: "Kill a batch, arrest a batch and handle a batch"; more than 700 hounded to their deaths, 1,316 crippled or maimed for life; half the people in abject poverty as farming is neglected.'
      'n': '[[w.dikotter-cultural-revolution]], 188 n.11. Made public: 2016. To check: Hebei Provincial Archives, Apr. 7, 1969, 919-1-288, pp. 142–143 (cited by [[w.dikotter-cultural-revolution]], 188 n.11a); Report to Xie Fuzhi, 1969, Hebei Provincial Archives, 919-1-274 (cited by [[w.dikotter-cultural-revolution]], 188 n.11b). Check: the day.'
