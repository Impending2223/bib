      when: Jan.
      date: '1967-01'
      thread: china
      place: shanghai
      c: 'Shanghai 上海: the army takes over the Shanghai Radio Station, less than a week after rebel workers stormed it.'
      'n': '[[w.dikotter-cultural-revolution]], 131 n.8. To check: P. M. Hewitt, "Letter from Shanghai," Jan. 31, 1967, FCO 21-8, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 131 n.8). See [[cal.1967-01-22.china]]. Check: the day.'
