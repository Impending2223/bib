      when: Feb., after the 16th
      date: '1967-02'
      at: after 1967-02-16
      thread: china-leadership
      c: Mao, having won Lin Biao over against the marshals, orders the Cultural Revolution Group to stop circulating any document critical of Zhou Enlai.
      'n': '[[w.dikotter-cultural-revolution]], 137 n.20. Made public: 2007 at the latest. To check: Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 159 (cited by [[w.dikotter-cultural-revolution]], 137 n.20). See [[cal.1967-02-16.china-leadership]]. Names: Mao Zedong, Lin Biao, Zhou Enlai. Check: the day.'
