      - form:state
      src:
        c: dd5648aa
        rows:
        - 'w.dikotter-cultural-revolution 139: all'
- add:
    entry:
      id: cal.1967-03.china-leadership-41
      when: Mar., by the 21st
      date: '1967-03'
      at: before 1967-03-21
      thread: china-leadership
      place: shanghai
      c: 'As Shanghai 上海 reports have it: less than half of the city''s schools escaped major destruction and one in five must be written off; classes, where resumed, intermittent, some schools open two or three hours a week; at the Ningbo Road and Nanjing East Road Primary Schools gangs of pupils ("Tokyo," "Field Army") steal light bulbs, telephones, microphones, bicycles, locks, windowpanes and cables, and beat people up for a fee, 10 yuan a victim in March; teachers spat at, excrement thrown on them from the upper floors.'
      'n': '[[w.dikotter-cultural-revolution]], 139–140 n.28. Made public: 2016. To check: Shanghai Municipal Archives, Mar. 4, 16 and 21, 1967, B105-4-58, pp. 1–3, 36–37 and 74–76 (cited by [[w.dikotter-cultural-revolution]], 140 n.28). Check: the day.'
      tags:
      - polity:prc
      - vis:only:prc
      - form:state
      src:
        c: 2203ceff
        rows:
        - 'w.dikotter-cultural-revolution 140: all'
        - 'via w.dikotter-cultural-revolution 140 n.28: all'
