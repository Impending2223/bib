- add:
    entry:
      id: cal.1967-03.china-2
      when: Mar.
      date: '1967-03'
      thread: china
      place: peking
      c: 'Peking 北京: a military team arrives at Zhai Zhenhua''s school and, holding no meeting with the Red Guards, tells the gathered students that the Red Guards helped the work teams push the bourgeois reactionary line, persecuting students of bad class background instead of the capitalist roaders; the students are told to rise against them, the Red Guards made to confess their errors in class; a new set of student leaders under a platoon leader.'
      'n': '[[w.dikotter-cultural-revolution]], 139 n.25. To check: [[w.zhenhua-red-flower-of-china]], 119 (cited by [[w.dikotter-cultural-revolution]], 139 n.25). Check: the day.'
