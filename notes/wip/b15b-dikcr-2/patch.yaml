- add:
    entry:
      id: cal.1967-07.china-5
      when: July, mid
      date: '1967-07'
      at: before 1967-07-11
      thread: china
      place: zhengding
      c: 'Zhengding: Gao Yuan''s faction, backed by a missile-engineering institute under the General Staff, besieges its opponents, backed by the military command at Shijiazhuang 石家庄, in a building of the Public Security Bureau, with catapults shooting bricks into the compound; a schoolmate of Gao''s on the other side throws herself from a third-floor window wrapped in her organization''s red flag, shouting "Long live Chairman Mao!" A white flag goes up; the resistance ends.'
      'n': '[[w.dikotter-cultural-revolution]], 143–144 n.37. To check: [[w.yuan-born-red]], 251 (cited by [[w.dikotter-cultural-revolution]], 144 n.37). Names: Mao Zedong. Check: the day.'
