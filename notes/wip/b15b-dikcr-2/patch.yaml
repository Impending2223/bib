      at: before 1969-01
      thread: china
      place: peking
      c: 'As Roger Garside has it: in Peking 北京 columns of students march to the railway station, banners waving, brass bands playing; the station crowded with students, parents and friends; loudspeakers play Mao''s 毛泽东 words from the Little Red Book: "The world is yours, and also ours ... You are our hope."'
