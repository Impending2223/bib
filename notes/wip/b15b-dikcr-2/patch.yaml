- add:
    entry:
      id: cal.1967-01-22.china
      when: Jan. 22
      date: '1967-01-22'
      thread: china
      place: shanghai
      c: 'Shanghai 上海, by revolutionary decree: all parks closed, against their use by counter-revolutionaries; the cinemas shut; the museum closed; the Great World amusement arcade, renamed East is Red, locked.'
      'n': '[[w.dikotter-cultural-revolution]], 131 n.8. To check: P. M. Hewitt, "Letter from Shanghai," Jan. 31, 1967, FCO 21-8, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 131 n.8).'
      tags:
      - polity:prc
      src:
        c: c3f54629
        rows:
        - 'w.dikotter-cultural-revolution 131: all'
        - 'via w.dikotter-cultural-revolution 131 n.8: all'
- add:
    entry:
      id: cal.1967-01-24.china
      when: Jan. 24
      date: '1967-01-24'
      thread: china
      place: shanghai
      c: 'Shanghai 上海: more than a dozen lorries loaded with soldiers chanting slogans and waving the Little Red Book roll down Nanjing Road.'
      'n': '[[w.dikotter-cultural-revolution]], 131 n.8. To check: P. M. Hewitt, "Letter from Shanghai," Jan. 31, 1967, FCO 21-8, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 131 n.8). See [[cal.1967-01-22.china]].'
      tags:
      - polity:prc
      src:
        c: c1e1173b
        rows:
        - 'w.dikotter-cultural-revolution 131: all'
        - 'via w.dikotter-cultural-revolution 131 n.8: all'
- add:
    entry:
      id: cal.1967-01-27.china-2
      when: Jan. 27
      date: '1967-01-27'
      thread: china
      place: shanghai
      c: 'Shanghai 上海: pamphlets airdropped over the city: the People''s Liberation Army the most important tool of the Cultural Revolution; all genuine revolutionaries to support it.'
      'n': '[[w.dikotter-cultural-revolution]], 131 n.8. To check: P. M. Hewitt, "Letter from Shanghai," Jan. 31, 1967, FCO 21-8, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 131 n.8). See [[cal.1967-01-22.china]].'
      tags:
      - polity:prc
      src:
        c: 2666701d
        rows:
        - 'w.dikotter-cultural-revolution 131: all'
        - 'via w.dikotter-cultural-revolution 131 n.8: all'
