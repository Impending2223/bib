      when: '1968'
      date: '1968'
      thread: china
      place: peking
      c: 'Peking University 北京大学: twenty-three people commit suicide in the cleansing of the ranks, one by insecticide, one from a window, most by hanging; in the History Department a Marxist historian and his wife take an overdose of sleeping pills together; a lecturer in ancient history accused of spying found dead in an office, covered in lacerations.'
