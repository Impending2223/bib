- edit:
    id: cal.1964-05-27.china-leadership
    base: 8fe1b381
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Naughton and White: about 1,800 factories set up in the hinterland for the Third Front, which took about two-thirds of the state''s industrial investment from 1964 to 1971; the first steel at Panzhihua in July 1970, three other mills still building in the 1980s, the Jiuquan mill producing steel only after twenty-seven years and over a billion yuan; hundreds of billions in output forgone ([[w.dikotter-cultural-revolution]], 218).'
- edit:
    id: cal.1965-01-19.china-leadership-2
    base: f8c16a6b
    set:
      gloss:
        title: Estimates
        text:
        - 'Dikötter, after Shapiro: of the more than 80,000 villagers of the communes brought into the new city of Panzhihua in 1965 the mortality rate reached 13 percent ([[w.dikotter-cultural-revolution]], 216).'
