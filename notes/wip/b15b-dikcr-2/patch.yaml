      when: Jan. 13
      date: '1968-01-13'
      thread: china-leadership
      place: zhejiang
      c: 'Zhejiang 浙江: the military, in charge of the province from January, orders it to learn from Dazhai, "to thoroughly smash the evil plot by China''s Khrushchev to restore capitalism in the countryside"; the Twentieth Army sends a hundred cadres to learn from Chen Yonggui in Shanxi 山西.'
      'n': '[[w.dikotter-cultural-revolution]], 227 n.15, n.16. Made public: 2016. To check: Keith Forster, *Rebellion and Factionalism in a Chinese Province: Zhejiang, 1966–1976* (1990) (cited by [[w.dikotter-cultural-revolution]], 227 n.15); Directive from the Military (Directive about Learning from Dazhai), Jan. 13, 1968, Zhejiang Provincial Archives, J116-25-60, pp. 20–29 (cited by [[w.dikotter-cultural-revolution]], 227 n.16).'
      tags:
      - polity:prc
      - vis:only:prc
      gloss:
        title: Estimates
        text:
        - 'Dikötter: in the next two years a further 30,000 cadres and farmers sent to Dazhai at the state''s expense; by the end of 1969 more than 200 villages in Zhejiang hailed as model collectives ([[w.dikotter-cultural-revolution]], 227).'
      src:
        c: c5724ad7
        rows:
        - 'w.dikotter-cultural-revolution 227: all'
        - 'via w.dikotter-cultural-revolution 227 n.15: all'
