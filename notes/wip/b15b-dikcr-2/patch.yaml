- add:
    entry:
      id: cal.1967-03.china-leadership-39
      when: Mar.
      date: '1967-03'
      thread: china-leadership
      c: 'Zhou Enlai to Jiang Qing, the marshals'' opposition broken and the Cultural Revolution Group running the show: "From now on you make all the decisions, and I will make sure that they are carried out."'
      'n': '[[w.dikotter-cultural-revolution]], 138 n.22. Made public: 2007 at the latest. To check: Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 164 (cited by [[w.dikotter-cultural-revolution]], 138 n.22). See [[cal.1967-02-25.china-leadership-5]]. Names: Zhou Enlai, Jiang Qing. Check: the day.'
