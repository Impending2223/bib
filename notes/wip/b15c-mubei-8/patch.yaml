      c: 'The Gansu 甘肅 provincial committee sends the Northwest Bureau 西北局 its report forwarding the Tongwei 通渭 county committee''s historical lessons of Tongwei 《甘肅省委報送「通渭歷史經驗教訓」的報告》. On the causes it finds that many departments and communes had fallen into bad people''s hands: of 152 leading cadres of commune head and above, 24, 15.2 percent, had been backbones of the puppet party, league, army, police and gendarmerie, spies or Yiguandao 一貫道 members; of 30 county committee members and alternates, 8 had political or historical problems.'
