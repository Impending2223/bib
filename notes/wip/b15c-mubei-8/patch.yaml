      c: Wu 吳 county, Jiangsu 江蘇, Dongqiao 東橋 commune. Li 李, member of the commune party committee and party secretary of its 1st brigade, under the slogan "wipe out small freedoms" searches 44 households, takes 77 percent of the households' cooking pots, punishes 51 and struggles against 10; 4 are driven to kill themselves, 2 of them saved. Cha Xiaomei 查小妹, a "five-good" member in whose house is found a little rice saved from her ration for her child, hangs herself; the child, with no one to care for it, soon dies.
      n: '[[w.yang-jisheng-mubei]], I, 380–381 n.31. The words: 1960年1月 (I, 381). Made public: 2008. To check: Lu Jing 盧敬, letter to the Jiangsu committee, "Why coercion and lawlessness are so serious in Dongqiao commune, Wu county" 《吳縣東橋公社強迫命令違法亂紀為甚麼這麼嚴重》, Sept. 5, 1960, a draft with a reviser''s cuts, which the book quotes in part, cuts included (cited by [[w.yang-jisheng-mubei]], I, 381 n.31).'
