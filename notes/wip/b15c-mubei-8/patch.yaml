      c: 'The Jintang 金堂 county committee 縣委, Sichuan 四川, sends its districts, communes and management districts an urgent notice on controlling and clearing up the outflow of population 《關於控制和清理人口外流的緊急通知》: the families of laborers who have gone out are to write and fetch them back; those not back by the set day see to their own meals and grain, the commune taking no part.'
      n: '[[w.yang-jisheng-mubei]], I, 226 n.90. Made public: 2008. To check: Sichuan Provincial Committee rectification corps, Wenjiang work corps 省委溫江工作團, report on the cadres'' serious breaking of law and discipline exposed at the Jintang county five-level cadre meeting 《金堂縣五級幹部會議揭發出有關幹部嚴重違法亂紀情況的報告》, Jan. 16, 1961, Sichuan committee general office receipt [61] no. 447, Sichuan Provincial Archives, file 2617 (cited by [[w.yang-jisheng-mubei]], I, 223 n.84; I, 226 n.90).'
