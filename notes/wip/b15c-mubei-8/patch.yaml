      c: Nanxiong 南雄 county, Guangdong 廣東, Shixing 始興 commune. At the worst of the grain shortage Zhu 朱, the commune party committee's first secretary, decides on his own to stop the whole commune's rations for a month, keeping back 80,000 dan, and tells the members to fend for themselves. To a committee member who asks that the county be asked for grain he says whoever has no shame may go and ask.
      n: '[[w.yang-jisheng-mubei]], I, 416 n.18, 419. The words: 1959冬和1960春之間，糧食最緊張時 (I, 419). Made public: 2008. To check: Zheng Qun 鄭群, Cheng Jiaying 成家英 and Zhang Lemin 張樂民, investigation report on the serious illegal conduct and mass deaths in Shixing commune, Nanxiong county 《關於南雄縣始興公社嚴重違法亂紀和大量死人事件的調查報告》, July 31, 1960, the source of the section''s matter unless noted (cited by [[w.yang-jisheng-mubei]], I, 416 n.18).'
