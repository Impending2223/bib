      c: Hechuan 合川 county, Sichuan 四川, Nanping 南屏 commune. With the members, from hunger, widely eating the green crops, the commune's first party secretary, Tan 譚, tells the cadres of work-group head and above to hang, beat and fine anyone caught stealing, and has six beaten, at meetings first in Zhongnan 中南 and then in Bailu 白鹿 districts, as an example. At the meetings he says there is labor enough and a few dead do not matter. He sets fines of 1 yuan for a broad-bean plant or an ear of corn and 5 yuan for a sweet potato.
      n: '[[w.yang-jisheng-mubei]], I, 224–225 n.86. The words: 1960年2、3月份 (I, 224). Made public: 2008. To check: Qiao Zhimin 喬志敏, report on the rectification of Nanping commune, Hechuan 《喬志敏同志關於合川南屏公社整頓情況的報告》, Nov. 29 (the note prints 1961), circulated by the Sichuan committee general office secretariat Dec. 2, 1960 (cited by [[w.yang-jisheng-mubei]], I, 225 n.86; I, 225 n.87, 同上).'
      src:
        c: 6cd293d9
        rows:
        - 'w.yang-jisheng-mubei I, 224–225: all'
        - 'via w.yang-jisheng-mubei I, 225 n.86: all'
