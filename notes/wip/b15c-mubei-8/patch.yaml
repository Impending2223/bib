      c: Luhe 六合 county, Jiangsu 江蘇, Guabu 瓜埠 commune, Baojiang 保江 brigade, Qinlao 勤勞 team. Zhang Changrong 張昌榮, 60, a blind stockman whom the team head, Guo 郭, put to field work to give the post to his own brother-in-law, withholding his family's meals when he did not go and beating him at the mess hall over ten times, and beating him again when he stole from the team, dies on the eve of the lunar New Year in a ditch by the river bank, having gone begging in Guabu.
      n: '[[w.yang-jisheng-mubei]], I, 381–382 n.32. The words: 1959年大年三十晚上 (I, 381). Made public: 2008. To check: research group of the Guabu commune rectification work group 瓜埠公社整社工作組調查研究小組, preliminary investigation of the cadres'' style at Guabu commune, Luhe county 《關於六合縣瓜埠公社幹部作風問題的初步調查》, Apr. 1961, printed by the Navy Political Department''s political theory teaching office (cited by [[w.yang-jisheng-mubei]], I, 382 n.32). Check: the date: the book''s 1959年大年三十 is read as the last day of the lunar year 1959, the eve of the Spring Festival of 1960; if the eve of the Spring Festival of 1959 is meant, it falls before the calendar''s span.'
