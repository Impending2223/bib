      c: Hechuan 合川 county, Sichuan 四川, Taiping 太平 district. Tang 唐, deputy secretary of the district committee ("King Tang of Hell" to the peasants), in the drive to "storm the backward" orders the 178 households of the courtyards he deems backward to move house; the 66 households who refuse are struggled against, 19 of them as chief targets, and 8 people are bound. Zhong Xiangcheng 鍾相成, a member, drowns himself on the spot.
      n: '[[w.yang-jisheng-mubei]], I, 225 n.87 (同上: the note before, Qiao Zhimin''s report). The words: 1960年2月至3月 (I, 225). Made public: 2008. To check: Qiao Zhimin 喬志敏, report on the rectification of Nanping commune, Hechuan 《喬志敏同志關於合川南屏公社整頓情況的報告》, Nov. 29 (the note prints 1961), circulated by the Sichuan committee general office secretariat Dec. 2, 1960 (cited by [[w.yang-jisheng-mubei]], I, 225 n.86; I, 225 n.87, 同上).'
