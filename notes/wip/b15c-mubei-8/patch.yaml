      c: Dianjiang 墊江 county, Sichuan 四川, Chengxi 城西 commune, Chunhua 春花 management district. Xu Jianmin 徐建民, the mess-hall manager, hangs and beats 18 members one after another from Dec. 1959 to Apr. 1960; Xu Wenpu 徐文普, a member who ate two sweet potatoes on the sly, dies five days after his beating. The district runs a labor-reform team 勞改隊 for those who have taken food, a month or two at a time, with night shifts and no going home.
      n: '[[w.yang-jisheng-mubei]], I, 225–226 n.89. The words: 從1959年12月到1960年4月 (I, 225). Made public: 2008. To check: Li Lin 李林, report to the provincial committee and Secretary Liao 《給省委並廖書記》, Jan. 31, 1961 (cited by [[w.yang-jisheng-mubei]], I, 226 n.89). Check: the day of Xu Wenpu''s death.'
