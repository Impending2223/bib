      c: 'The Central work group 中央工作組 led by Qian Ying 錢瑛, deputy secretary of the Central Control Commission 中央監委, reports to the Center on the grave persecution of great numbers of cadres in the struggle against rightism in Tianshui 天水 prefecture, Gansu 甘肅 《關於甘肅省天水地區反右傾鬥爭中大批幹部遭受嚴重迫害的情況》. From the winter of 1959 to April 1960 bad elements had seized the Party''s leadership there and made false cases: 103 counterrevolutionary cliques with over 700 members, that of Yuwen Rong 宇文榮, first secretary of Qin''an 秦安 county, 103; all were found false.'
      n: '[[w.yang-jisheng-mubei]], I, 125 (no note). Made public: 2008. To check: Central work group (Qian Ying), report to the Center on the grave persecution of cadres in the anti-rightist struggle in Tianshui prefecture, Jan. 5, 1961 (named by [[w.yang-jisheng-mubei]], I, 125; no note).'
