      c: Nanxiong 南雄 county, Guangdong 廣東, Shixing 始興 commune. Of the 43,337 dan of grain the county issues in February the commune keeps back 3,646 dan of the members' rations. With 1,000 dan kept back in Sept. 1959 and 419 dan in December, it has kept back 5,065 dan in all.
