      c: Qingshui 清水 county, Gansu 甘肅. With the mess halls out of grain, Zhangshuyi 張樹驛 commune sends Xu Xiaorui 徐效瑞, deputy secretary of its party committee, to Songhe 松河 brigade to rouse the masses against concealed grain. He searches the members' houses and reports to the commune 110,920 jin found, enough at 22 jin a head a month to the end of June with over 50,000 jin to spare for procurement, and has the general branch secretary, Mao Wenqing 毛文清, and the team head make up a register, putting the members' thumbprints on it for them. In the last ten days of January 44 of the brigade starve to death.
