      c: Yongchuan 永川 county, Sichuan 四川, Shuinian 水碾 commune. A meeting chaired by the commune's party secretary, Ye 葉, also head of the county's agriculture and water bureau, decides that cadres who have hidden output and divided it privately, and members who pilfer, are all to be moved to other management districts, and draws up a plan to move 60 households. Under him 60 percent of the commune's households are searched, 48 people hung, beaten or bound and 76 households' meals withheld; Ye, then head of a county committee work group, hangs and beats 7 himself.
      n: '[[w.yang-jisheng-mubei]], I, 227–228 n.93. The words: 1960年9月 (I, 227). Made public: 2008. To check: Liu Wenzhen 劉文珍, inspection report on the guiding thought of the three-level Party committees'' rectification in Jiangjin, Hechuan, Jiangbei, Yongchuan, Rongchang and other counties, districts and communes 《關於江津、合川、江北、永川、榮昌等五個縣、區、公社三級黨委整風整社指導思想的檢查報告》, Jan. 22, 1961 (cited by [[w.yang-jisheng-mubei]], I, 228 n.93).'
