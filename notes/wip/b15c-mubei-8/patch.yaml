      c: 'The work group the Center sent to Linxia 臨夏 city, Gansu 甘肅, reports: in 1959 and 1960 the city lost 41,381 dead, 8.7 percent of its people, over 15 percent in four communes, Maji 馬集, Hanji 韓集, Hongtai 紅台 and a fourth; 388 households died out, leaving over 100 orphans. In 41 teams of the city''s 10 communes 588 people ate 337 bodies; in Hongtai commune alone 170 people ate 125 bodies and 5 living people.'
      n: '[[w.yang-jisheng-mubei]], I, 146–147 n.26 (the report as Li Lei''s memoir gives it). Made public: 2008. Printed privately: [[w.li-lei-youyou-suiyue]] (1999, at her own cost: I, 145). To check: [[w.li-lei-youyou-suiyue]], 122–150 (cited by [[w.yang-jisheng-mubei]], I, 147 n.26); the Central work group in Linxia city, report, Mar. 18, 1961 (named by [[w.yang-jisheng-mubei]], I, 146; no note). See [[cal.1960-01-09.china-leadership-6]]. Check: whether the list of some fifty cases of [[cal.1961-03.china-leadership-22]] belongs to this report.'
