      c: Jintang 金堂 county, Sichuan 四川, Shuangliu 雙流 commune. Wu 吳, a member of the commune's general branch committee and branch secretary of Qianjin 前進 district, in the course of the year drives two members to death, puts over 10 through the "washing of taro" 洗毛芋子 (a ring of others shoving the punished back and forth), withholds the meals of over 300, and fines or sentences to hard labor over 20.
      n: '[[w.yang-jisheng-mubei]], I, 223 n.84, 224 (a case of the Wenjiang work corps'' report on Jintang). The words: 在1960年一年內 (I, 224). Made public: 2008. To check: Sichuan Provincial Committee rectification corps, Wenjiang work corps 省委溫江工作團, report on the cadres'' serious breaking of law and discipline exposed at the Jintang county five-level cadre meeting 《金堂縣五級幹部會議揭發出有關幹部嚴重違法亂紀情況的報告》, Jan. 16, 1961, Sichuan committee general office receipt [61] no. 447, Sichuan Provincial Archives, file 2617 (cited by [[w.yang-jisheng-mubei]], I, 223 n.84; I, 226 n.90).'
