      c: Meitan 湄潭 county, Guizhou 貴州, Suiyang 綏陽 commune. With the provincial and prefectural work group in the county, the commune's party leaders, besides driving people into the hills away from the group, shut up the gravely sick and the orphans; six die in one tobacco-curing house. The commune has the dead thrown into the sinkholes 消洞 behind it, some still breathing; the people call them the "ten-thousand-person pit."
      n: '[[w.yang-jisheng-mubei]], I, 573 (no note). The words: 1960年4月 (I, 573). Made public: 2008. To check: [[w.dikotter-maos-great-famine]], 314 n.21. See [[cal.1960-04.china-leadership-15]].'
