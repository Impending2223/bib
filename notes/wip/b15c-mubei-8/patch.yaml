      c: The Gansu 甘肅 provincial committee decides to take the Tao River project 引洮工程 down for good. By official figures the book quotes, it has cost 60 million yuan in three years, with state investment of 160 million, and moved 160 million cubic meters of earth and stone, 8 percent of the plan, watering not one mu.
