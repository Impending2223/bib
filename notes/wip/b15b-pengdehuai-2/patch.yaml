- add:
    entry:
      id: cal.1968-09-18.china-leadership-5
      when: Sept. 18
      date: '1968-09-18'
      thread: china-leadership
      c: 'The case group 专案组 sends up its "Report on the examination of the question of Peng Dehuai 彭德怀s illicit relations with foreign countries" 《关于彭德怀里通外国问题的审查报告》: in 1959 Peng and Khrushchev 赫鲁晓夫 colluded directly, by design, at Tirana 地拉那; in his talk with Khrushchev Peng viciously attacked the Partys Three Red Banners 三面红旗 and bared his anti-Party ambition to the Khrushchev revisionists 赫修; Khrushchev attacked our Party and backed Peng to take its leaders place; Peng has confessed that he opposed Chairman Mao 毛主席 abroad to make international opinion and win the Khrushchev revisionist cliques backing, to usurp the Party and the state, seize Chairman Maos power, overthrow the dictatorship of the proletariat and restore capitalism.'
      n: '[[w.peng-dehuai-nianpu]], 819. Made public: 1998. Names: Peng Dehuai, Khrushchev, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:khrushchev-nikita-s
      - name:mao-zedong
- add:
    entry:
