      date: '1968-02-05'
      thread: china-leadership
      c: 'The head of the case group 专案组负责人, in his work notebook 工作手册: Peng Dehuai 彭德怀s present attitude: he stalls where he can and denies where he can; admits only what is put before him, not wishing to confess; admits only the few labels the Center 中央 has pinned on him, and resents the charges of subversion and usurping the Party and the state; Peng says: when they check it some day, some of it will prove false.'
