ops:
- add:
    entry:
      id: cal.1968-01-01.china-leadership-3
      when: Jan. 1
      date: '1968-01-01'
      thread: china-leadership
      c: 'The case group 专案组 meets on the interrogation of Peng Dehuai 彭德怀: eight sessions from Sept. 29 to Dec. 22, 1967; what he admits he retracts at once, what he confesses he may disown, as on the anti-Party question; a crafty old liar, it finds, who builds monuments to himself and would set his history beside Chairman Maos 毛主席. It decides on a surprise interrogation 突击审讯.'
      n: '[[w.peng-dehuai-nianpu]], 815. Made public: 1998. Names: Peng Dehuai, Mao Zedong.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:mao-zedong
