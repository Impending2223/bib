      - '1968-01-10T10:00Z'
      time_band: afternoon
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 is interrogated on his "illicit relations with foreign countries" 里通外国. The case groups head 专案组负责人 notes it a surprise attack, Peng unready, his history having been the matter till now; Peng asked whether the history was done before they took up the foreign question. The session is on his talk of over three hours with Khrushchev 赫鲁晓夫 in 1955: Peng protests that he said nothing to harm the Party or the country, saw Khrushchev only at his asking, and on his return reported it by word of mouth to the Chairman 主席 and Premier Zhou 周总理.'
      n: '[[w.peng-dehuai-nianpu]], 815. The words: 下午 (815). Made public: 1998. Names: Peng Dehuai, Khrushchev, Mao Zedong, Zhou Enlai.'
      tags:
