      date: '1968-01-21'
      time: '1968-01-21T11:10:00Z'
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 is interrogated from 7:10 p.m. to 3 a.m. The case groups 专案组 four insist that he admit he spoke up of his own accord for Gao Gangs 高岗 merits before Khrushchev 赫鲁晓夫, "reversing the verdict for Gao Gang" 为高岗翻案, "colluding with Khrushchev against our Partys Center" 勾结赫鲁晓夫反对我党中央; when he exposes their design, an interrogator pounds the table: utterly shameless, a scoundrel through and through; his tricks will get him nowhere; his case can never be reversed.'
      n: '[[w.peng-dehuai-nianpu]], 816. The words: 晚7点10分 (7:10 p.m.); 第二天凌晨3点 (3 a.m. the next day) (816). Made public: 1998. Names: Peng Dehuai, Khrushchev.'
