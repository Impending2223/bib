      c: 'The case group 专案组 sends men to Hunan 湖南 and Hubei 湖北 for outside inquiries 外调 and to the Ministry of Public Security 公安部 to read the enemy and puppet archives 敌伪档案, gathering evidence to brand Peng Dehuai 彭德怀 a "traitor" 叛徒 and "spy" 特务: the first of two such days.'
      n: '[[w.peng-dehuai-nianpu]], 819. Made public: 1998. Names: Peng Dehuai.'
