      when: Oct. 4
      date: '1968-10-04'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 studies Maos works 毛著 and reads the papers. In his copy of *Chairman Maos Poems* 《毛主席诗词》 is a slip: hold "loyalty" 忠 at heart; criticize "revisionism" 修 hard; struggle hard against "self" 私; establish the "public" 公 greatly.'
      n: '[[w.peng-dehuai-nianpu]], 819. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
