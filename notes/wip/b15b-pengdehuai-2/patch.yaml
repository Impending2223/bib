      when: Nov. 1
      date: '1968-11-01'
      time: '1968-11-01T18:00:00Z'
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀, awake all night, at 2 a.m. hears the broadcast of the enlarged Twelfth Plenum of the Eighth Central Committee 中共八届扩大的十二中全会.
      n: '[[w.peng-dehuai-nianpu]], 819–820. 820 n.1 (the plenum, Oct. 13–30, 1968, Peking). The words: 一夜未合眼。至2点 (awake all night; at 2) (819–820). Made public: 1998. Names: Peng Dehuai.'
