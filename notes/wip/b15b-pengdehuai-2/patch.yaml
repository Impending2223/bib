      when: Nov. 3–25
      date: '1968-11-03'
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 studies the *Selected Works of Lenin* 《列宁选集》 and the *Selected Works of Mao Zedong* 《毛泽东选集》 and reads the papers every day; often he lies with his eyes wide open, sleepless all night.
      n: '[[w.peng-dehuai-nianpu]], 820. Made public: 1998. Names: Peng Dehuai.'
