      when: Nov. 27–30
      date: '1968-11-27'
      place: peking
      thread: china-leadership
      c: The Su Zhenhua 苏振华 case group and the Rao Zhengxi 饶正锡 case group 专案组 interrogate Peng Dehuai 彭德怀 four times on his visit to the Soviet Union 苏联. After the sessions he writes his material, his head in his hands, slumped on the table, sighing; three days without a moments sleep.
      n: '[[w.peng-dehuai-nianpu]], 820. Made public: 1998. Names: Peng Dehuai.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
- add:
    entry:
      id: cal.1968-12.china-leadership-14
      when: Dec.
      date: '1968-12'
      place: peking
      thread: china-leadership
      c: Peng Dehuai 彭德怀 is interrogated ten times, once each by the Bo Yibo 薄一波, Yang Yong 杨勇 and Ma Mingfang 马明方 case groups 专案组. He writes his material every day and reads the *Selected Works of Lenin* 《列宁选集》 and others; his sleep disordered, ten nights without closing his eyes, little sleep the others; at night he often weeps.
      n: '[[w.peng-dehuai-nianpu]], 820. Made public: 1998. Names: Peng Dehuai, Bo Yibo.'
