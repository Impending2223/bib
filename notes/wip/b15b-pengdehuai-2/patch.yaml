- add:
    entry:
      id: cal.1968-11-02.china-leadership-4
      when: Nov. 2
      date: '1968-11-02'
      place: peking
      thread: china-leadership
      c: 'Peng Dehuai 彭德怀 reads the communique 公报 of the enlarged Twelfth Plenum 中共八届扩大的十二中全会: it approved the so-called "Report on the examination of the crimes of the traitor, hidden traitor and scab Liu Shaoqi" 《关于叛徒、内奸、工贼刘少奇罪行的审查报告》 and expelled Liu Shaoqi 刘少奇 from the Party for ever, stripping him of all his posts. After reading it he sits without moving, never so unhappy; thinking he will come to the same end, he does not sleep all night.'
      n: '[[w.peng-dehuai-nianpu]], 820. Made public: 1998. Names: Peng Dehuai, Liu Shaoqi.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:peng-dehuai
      - name:liu-shaoqi
- add:
