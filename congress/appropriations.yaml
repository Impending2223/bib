# Each session's appropriation bills against the President's estimates, 86th Cong., 2d sess., to the 90th, 2d: kept by
# hand from the tables printed in the bound Congressional Record at or near each session's end (found by the Record's
# Index, under "Appropriations", "Tables"), every figure read off the page image on govinfo. Rendered by tools/bib/appropriations.py under the calendar entry tagged `appropriations:<Congress>-<session>`
# (the session's adjournment); `check` fails on a row whose estimate and change do not make its amount, a column that
# does not add to its printed total, a figure that is not whole dollars, an entry that answers nothing.
#
#   date, chamber, page, rec   the Record's day, chamber, printed page(s) and govinfo granule of the table
#   head                       the table's heading as printed (or the Index's, where so marked)
#   by                         who prepared it, where the table says
#   est, final, chg            the source's own heads of the three columns used (others it prints are left out)
#   chg_sign: saving           the source prints the change as a positive saving; the data hold it negative
#   est_computed               the source prints no estimate: the block shows the amount less the change, marked
#   entry                      the calendar entry that carries the table (also tagged appropriations:<key>)
#   groups                     as the table groups its bills (by fiscal year, supplementals): name, bills, total
#   bills                      bill (as printed), title, est, final, chg (whole dollars, as printed); paren: printed in
#                              parentheses (loan and contract authority, memoranda) and not counted in the totals;
#                              sub: a line under the bill before it, indented; note (shown under the table); misprint (the source's own figures disagree: shown, and
#                              the arithmetic check passes it)
#   total                      the table's printed total for the group or the session, misprint as above
