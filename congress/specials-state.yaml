1963-10-22-h-ND-1:
  cite: 'N.D. State Board of Canvassers, *Abstract of Votes*, special election, Oct. 22, 1963'
  source: North Dakota, Secretary of State, Statement of the Findings of the State Board of Canvassers, Special Election Held October 22, 1963 (abstract of votes for Representative in Congress, First District)
  where: single page, abstract by county, certified Nov. 1, 1963
  url: https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-10-22-special.pdf
  rounds:
  - date: '1963-10-22'
    label: special election
    cands:
    - [Mark Andrews, R, 47062]
    - [John Hove, Dem, 42470]
    - [John W. Scott, Conservative Republican, 5995]
    - [Thomas W. Dewey, Independent, 337]
  checked: 'The PDF''s visible page is ABBYY''s rendering of its OCR text layer; the scan underneath is a 1-bit CCITT image of 1.5 KB that holds only rules, so no photographic page image exists to read
    against. Every column of the 23 county rows sums to the printed TOTAL line (precincts 1,075; total votes cast 96,627; Andrews 47,062; Hove 42,470; Dewey 337; Scott 5,995), so the digits are consistent.
    The candidates sum to 95,864, not to the printed ''Total Votes Cast'' of 96,627 (ballots cast, it seems): 763 more; in Ramsey County the candidates exceed the total votes cast by 20.'
  differs_from_wikipedia: Wikipedia leaves out Dewey (Independent, 337, 0.35%). The other three match exactly as shares of the four-candidate vote (Andrews 49.09, Hove 44.30, Scott 6.25). As shares of the
    printed 96,627 they would be 48.70, 43.95, 6.20.
  remarks: Column heads print 'MARK ANDREWS Rep', 'JOHN HOVE Dem', 'THOMAS W DEWEY Independent', 'JOHN W SCOTT Conservative Republican'. The printed 'Total Votes Cast', 96,627, is left out of `total` because
    it is not the sum of the candidates. The State Board of Canvassers certified Andrews of Mapleton as elected.
  verified: true
