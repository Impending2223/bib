# A bill's course, step by step, from its introduction to its approval: kept by hand from the bound Congressional
# Record's History of Bills and Resolutions (the year's Index part on govinfo), each page turned to its day by the bound
# Record's daily granules, and the roll calls from Voteview. Rendered by tools/bib/bills.py under the calendar entry
# tagged `bill:<key>` (the signing); `check` fails on a step out of order, a malformed roll call or granule, an entry or
# a bill key that answers nothing.
#
#   history   where the History of Bills prints the bill: [year, Record part, granule]
#   steps     date (the day the Record bears), chamber (House, Senate, or none for the President), what (the step, in
#             the series' prose), page (the Record's page as the History prints it), rec (the granule of the day's
#             proceedings), votes ([chamber letter, Congress, roll number, yeas, nays, what]), entry (the calendar entry
#             that tells it), until (the last day of a span), note
bills:
  revenue-1964:
    title: Revenue Act of 1964
    bill: H.R. 8363
    congress: 88
    pl: 88-272
    stat: '78|19'
    granule: STATUTE-78-Pg19
    history: [[1963, 20, GPO-CRECB-1963-pt20-2], [1964, 19, GPO-CRECB-1964-pt19-2]]
    steps:
      - {date: '1963-01-24', what: Tax message, entry: cal.1963-01-24.economy}
      - {date: '1963-02-06', until: '1963-03-27', chamber: House, what: Ways and Means hearings on the message, entry: cal.1963-02-06.economy}
      - {date: '1963-09-10', chamber: House, what: Introduced by Mills; referred to Ways and Means, page: 16728, rec: GPO-CRECB-1963-pt12-13-2}
      - {date: '1963-09-16', chamber: House, what: 'Reported, H. Rept. 749', page: 17014, rec: GPO-CRECB-1963-pt13-2-1}
      - {date: '1963-09-24', chamber: House, what: 'Closed rule, H. Res. 527, adopted; debate opens', page: 17900, rec: GPO-CRECB-1963-pt13-8-2,
         votes: [[H, 88, 67, 324, 67, rule]]}
      - {date: '1963-09-25', chamber: House, what: Byrnes's motion to recommit refused; passed, page: 18119, rec: GPO-CRECB-1963-pt13-9-2,
         votes: [[H, 88, 68, 199, 226, recommittal], [H, 88, 69, 271, 155, passage]], entry: cal.1963-09-25.economy}
      - {date: '1963-09-30', chamber: Senate, what: Referred to Finance, page: 18359, rec: GPO-CRECB-1963-pt13-11-2}
      - {date: '1964-01-28', chamber: Senate, what: 'Reported with amendments, S. Rept. 830', page: 1275, rec: GPO-CRECB-1964-pt1-14-2}
      - {date: '1964-01-30', until: '1964-02-07', chamber: Senate, what: Debated, page: 1435, rec: GPO-CRECB-1964-pt2-1-1}
      - {date: '1964-02-03', until: '1964-02-07', chamber: Senate, what: 'Twenty-five roll calls on amendments, first and last linked',
         votes: [[S, 88, 239, 56, 25, Finance's amendment on capital gains], [S, 88, 263, 34, 61, McClellan's amendment]]}
      - {date: '1964-02-07', chamber: Senate, what: Amended and passed; conference asked, page: 2393, rec: GPO-CRECB-1964-pt2-8-1,
         votes: [[S, 88, 264, 77, 21, passage]], entry: cal.1964-02-07.economy}
      - {date: '1964-02-08', chamber: House, what: Senate amendments disagreed to; conference agreed to, page: 2547, rec: GPO-CRECB-1964-pt2-9-1}
      - {date: '1964-02-25', chamber: House, what: 'Conference report, H. Rept. 1149, agreed to', page: 3541, rec: GPO-CRECB-1964-pt3-8-2,
         votes: [[H, 88, 131, 326, 83, conference report]]}
      - {date: '1964-02-26', chamber: Senate, what: Conference report agreed to, page: 3692, rec: GPO-CRECB-1964-pt3-9-2,
         votes: [[S, 88, 267, 74, 19, conference report]]}
      - {date: '1964-02-26', what: Approved, stat: true, entry: cal.1964-02-26.economy}
