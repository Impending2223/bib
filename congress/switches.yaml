# Members of Congress who changed party in office, 87th to 93rd Congresses. Kept by hand; the rosters at
# each opening note them under the member, with the date. Sources: Wikipedia, "List of United States senators
# who switched parties" and "List of United States representatives who switched parties"; the Biographical
# Directory of the United States Congress. "Check" marks a detail to verify.
# Per entry: cong, ch (h|s), st, seat (district; Senate class), name, date, from, to, note.
- {cong: 88, ch: s, st: SC, seat: 2, name: Strom Thurmond, date: '1964-09-16', from: D, to: R}
- {cong: 89, ch: h, st: SC, seat: 2, name: Albert Watson, date: '1965-06-15', from: D, to: R,
   note: 'Resigned Feb. 1, 1965, after the House Democrats stripped his seniority for supporting Goldwater; re-elected as a Republican at a special election, June 15, 1965.'}
- {cong: 91, ch: s, st: VA, seat: 1, name: Harry F. Byrd Jr., date: '1970-03-17', from: D, to: I,
   note: 'Left the Democratic Party; kept his seniority and committee seats through the Democrats, but did not attend their caucus. Check the date.'}
- {cong: 92, ch: h, st: NY, seat: 26, name: Ogden Reid, date: '1972-03-22', from: R, to: D}
- {cong: 93, ch: h, st: MI, seat: 7, name: Donald W. Riegle Jr., date: '1973-02-27', from: R, to: D}
