# Special elections to Congress, read from Congressional Quarterly's *Guide to U.S. Elections*, 6th ed. (2010), vol. 2,
# "House Elections", by year (kept by hand). Laid over the generated congress/specials.yaml where the State's own
# returns (congress/specials-state.yaml) are not read: the race shows these votes and CQ's printed shares, and cites
# the page. The State's returns stay the source to check ("pending" in specials-state.yaml).
#
# <key in specials.yaml>:
#   cite: 'CQ Guide 6th (2010) 1266' (the page; the full title is given with the block's sources)
#   source, where: as in specials-state.yaml (the page)
#   rounds: [{date, label (as CQ heads it), cands [[name, party, votes, share]]}]: names, party letters and shares
#     as printed; CQ's shares count the votes of candidates it does not print, so they are shown as printed.
#     A round's date as 'YYYY' where CQ gives only the year.
#   unopposed: [name, party] where CQ prints a check mark and no vote
#   note: shown with the race     remarks: not shown (CQ's '#': figures "obtained from a source other than the
#     ICPSR")
# ./bib check fails on a key not in specials.yaml, a winner missing from the last round, or a round whose votes and
# shares cannot come from one total.

