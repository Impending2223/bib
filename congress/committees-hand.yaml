# Kept by hand: what tools/congress/make_committees.py takes besides Garrison Nelson's committee files. Edit this,
# then rerun the script; never edit congress/committees.yaml.
#
# icpsr: Nelson's ICPSR id -> the Bioguide id, where congress-legislators carries another ICPSR id for the member;
#   each with its reason.
# leaders: the party leaders Nelson's files do not code, by Congress and chamber: the House's (its file has no
#   non-committee block) and the Senate's President pro tempore and conference chairmen. Each holder: office, who
#   ([surname, first given name, State], found in congress-legislators), from and to where the office changed during
#   the Congress (else the Congress's opening and close), why (the change, as the source states it), src (a key of
#   `sources` below). The Senate's floor leaders and whips come from Nelson's block (code 620); `senate_pages` holds the
#   Senate Historical Office's lists of them, read Oct. 21, 2026, and the script stops where Nelson disagrees.
# rows: corrections to Nelson's rows, by Congress, chamber code, committee code and ICPSR id: set fields, with the
#   reason (none yet).
sources:
  house-speakers: [History, Art & Archives, U.S. House, "Speakers of the House", 'https://history.house.gov/People/Office/Speakers-List/']
  house-majority-leaders: [History, Art & Archives, U.S. House, "Majority Leaders", 'https://history.house.gov/People/Office/Majority-Leaders/']
  house-minority-leaders: [History, Art & Archives, U.S. House, "Minority Leaders", 'https://history.house.gov/People/Office/Minority-Leaders/']
  house-democratic-whips: [History, Art & Archives, U.S. House, "Democratic Whips", 'https://history.house.gov/People/Office/Democratic-Whips/']
  house-republican-whips: [History, Art & Archives, U.S. House, "Republican Whips", 'https://history.house.gov/People/Office/Republican-Whips/']
  house-democratic-caucus: [History, Art & Archives, U.S. House, "Democratic Caucus Chairmen", 'https://history.house.gov/People/Office/Democratic-Caucus-Chairmen/']
  house-republican-conference: [History, Art & Archives, U.S. House, "Republican Conference Chairmen", 'https://history.house.gov/People/Office/Republican-Conference-Chairmen/']
  senate-pro-tempore: [U.S. Senate, "Presidents Pro Tempore", 'https://www.senate.gov/about/officers-staff/president-pro-tempore/presidents-pro-tempore.htm']
  senate-leaders: [U.S. Senate, "Majority and Minority Leaders", 'https://www.senate.gov/senators/majority-minority-leaders.htm']
