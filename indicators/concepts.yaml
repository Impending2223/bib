# Indicators: concepts and sources. The master statement, kept by hand: the one text of what each series of the
# calendar's monthly tables measures, then and today, and where its figures come from. tools/bib/concepts.py reads it
# (its docstring and STYLE notes): the Indicators page (build/indicators.html) prints all of it; each calendar page
# writes, after the month where a series first appears on it, a servant: only that page's series, and of each only
# what concerns the periods the page files (the owner's rule, Oct. 21, 2026).
#
# general: the paragraph on all the tables; series: one text a series, by its id (indicators/<id>.yaml).
# vars: {NAME} in a text is replaced by vars[NAME] (a URL, or a sentence several series share) before anything else.
# Spans: {{SPAN|text}} keeps text only where the page shows a row of the series whose period ends within SPAN;
#   {{not SPAN|text}} only where it shows none. The master keeps every {{SPAN|...}} and drops every {{not ...}}: a
#   "not" text restates, for one page, what its positive twin says in full. SPAN: 1961, 1961-03, 1961Q2, FY1962, a
#   range a..b (either end may be open: ..1961-09, 1963..), several joined by commas. Spans nest. Put a piece's
#   separator ("; ", ", ") inside its braces; a separator left at an opening or a close is dropped.
# Quotation marks straight, as typed; the build curls them.
