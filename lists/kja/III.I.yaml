  - id: kja.who.bissell-richard-m-jr
    s: Bissell, Richard M., Jr.
    r: Deputy Director for Plans, CIA, to Feb. 1962
    n: 'Ran the Bay of Pigs. Voice: memoir (II.G.6).'
  - id: kja.who.campbell-judith
    s: Campbell, Judith
    r: Later Exner. Acquainted with Kennedy and with Giancana
  - id: kja.who.clark-ramsey
    s: Clark, Ramsey
    r: Deputy Attorney General, 1965–67; Attorney General, 1967–69
    n: 'Voice: *Crime in America* (II.G.6).'
  - id: kja.who.deloach-cartha-d
    s: DeLoach, Cartha D.
    r: FBI liaison to the Johnson White House
    n: Also in the 1968 list.
  - id: kja.who.doar-john
    s: Doar, John
    r: Civil Rights Division
    n: Oxford, 1962; Jackson, June 1963; Neshoba prosecutions.
  - id: kja.who.donovan-james-b
    s: Donovan, James B.
    r: New York lawyer; Abel's counsel; negotiated the Powers–Abel exchange and the Bay of Pigs prisoners' release
  - id: kja.who.dulles-allen-w
    s: Dulles, Allen W.
    r: Director of Central Intelligence to Nov. 1961
    n: 'Then the Warren Commission. Voice: *The Craft of Intelligence* (II.E).'
  - id: kja.who.giancana-sam
    s: Giancana, Sam
    r: Chicago Outfit boss
  - id: kja.who.harvey-william-k
    s: Harvey, William K.
    r: CIA; Task Force W
    n: Mongoose's operations chief; the Castro plots.
  - id: kja.who.helms-richard
    s: Helms, Richard
    r: Deputy Director for Plans, 1962–65; DCI from 1966
    n: Also Adm. and the 1968 list.
  - id: kja.who.hoover-j-edgar
    s: Hoover, J. Edgar
    r: Director, FBI
    n: 'Voice: tapes. Also in the 1968 list.'
  - id: kja.who.katzenbach-nicholas-deb
    s: Katzenbach, Nicholas deB.
    r: Office of Legal Counsel, 1961–62; Deputy Attorney General, 1962–64; Attorney General, 1964–66; Under Secretary of State, 1966–69
    n: 'At Oxford and the schoolhouse door. Voice: memoir (II.G.6). Also in the 1968 list.'
  - id: kja.who.marshall-burke
    s: Marshall, Burke
    r: Assistant Attorney General, Civil Rights Division, 1961–65
    n: 'Voice: *Federalism and Civil Rights* (II.C); oral history.'
  - id: kja.who.mccone-john-a
    s: McCone, John A.
    r: Director of Central Intelligence, 1961–65
    n: The August 1962 cables predicting missiles in Cuba.
  - id: kja.who.powers-francis-gary
    s: Powers, Francis Gary
    r: CIA U-2 pilot; shot down over the Soviet Union, May 1, 1960
  - id: kja.who.pryor-frederic-l
    s: Pryor, Frederic L.
    r: American student held in East Berlin, 1961–62
  - id: kja.who.raborn-william-f-jr
    s: Raborn, William F., Jr.
    r: Director of Central Intelligence, 1965–66
  - id: kja.who.seigenthaler-john
    s: Seigenthaler, John
    r: Administrative assistant to the Attorney General
    n: Clubbed at the Montgomery station, May 20, 1961. Cal.
  - id: kja.who.sullivan-william-c
    s: Sullivan, William C.
    r: FBI assistant director, domestic intelligence
    n: 'Voice: *The Bureau* (II.G.6). Also Adm.'
  - id: kja.who.white-byron-r
    s: White, Byron R.
    r: Deputy Attorney General, 1961–62
    n: Commanded the marshals at Montgomery. See K–J Cong. III.H.
