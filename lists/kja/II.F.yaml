# K–J Adm. II.F Dallas and the transition
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.F
entries:
  - id: kja.white-for-president-kennedy-2
    c: 'Theodore H. White, *For President Kennedy: An Epilogue* (1963)'
    n: See I.C.
  - id: kja.epstein-inquest-the-warren
    c: 'Edward Jay Epstein, *Inquest: The Warren Commission and the Establishment of Truth* (1966)'
    n: The commission's working, from interviews with its members and staff. Began as a Cornell thesis.
  - id: kja.manchester-death-of-a
    c: 'William Manchester, *The Death of a President: November 20–November 25, 1963* (1967)'
    n: Commissioned by the family, then fought by them in court before publication. Johnson's people appear as usurpers.
  - id: kja.zelizer-covering-the-body
    c: 'Barbie Zelizer, *Covering the Body: The Kennedy Assassination, the Media, and the Shaping of Collective Memory* (1992)'
    n: The press's coverage, and its authority over the story.
  - id: kja.holland-kennedy-assassination-tapes
    c: 'Max Holland, *The Kennedy Assassination Tapes: The White House Conversations of Lyndon B. Johnson Regarding the Assassination, the Warren Commission, and the Aftermath* (2004)'
    n: Johnson recruiting Russell and Warren by telephone.
  - id: kja.mcknight-breach-of-trust
    c: 'Gerald D. McKnight, *Breach of Trust: How the Warren Commission Failed the Nation and Why* (2005)'
    n: From the commission's records. Argues it settled on Oswald alone early and did not test it.
  - id: kja.bugliosi-reclaiming-history-the
    c: 'Vincent Bugliosi, *Reclaiming History: The Assassination of President John F. Kennedy* (2007)'
    n: Argues Oswald alone, claim by claim against the critics.
  - id: kja.gillon-kennedy-assassination-24
    c: 'Steven M. Gillon, *The Kennedy Assassination—24 Hours After: Lyndon Johnson''s Pivotal First Day as President* (2009)'
  - id: kja.caro-passage-of-power
    c: Robert A. Caro, *The Passage of Power* (2012)
    n: See II.A.
  - id: kja.shenon-cruel-and-shocking
    c: 'Philip Shenon, *A Cruel and Shocking Act: The Secret History of the Kennedy Assassination* (2013)'
    n: The commission and its staff.
  - id: kja.willens-history-will-prove
    c: 'Howard P. Willens, *History Will Prove Us Right: Inside the Warren Commission Report on the Assassination of John F. Kennedy* (2013)'
    n: By a member of the commission's staff. Holds by the findings.
