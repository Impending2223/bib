  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Eleven sections, from the most digested to the least: A. The presidents and the White House. B. Domestic policy and the economy. C. Civil rights: the executive. D. National security. E. Justice, intelligence, and the FBI. F. Dallas and the transition. G. Memoirs and biographies. H. Documents. I. Recordings. J. The tapes. K. Archives. Sections A through F are chronological by first publication.'
    sections:
      - id: p2a
        num: II.A
        title: The presidents and the White House
        logic:
          - Biographies and general histories. Memoirs are in II.G. Start with Reeves for Kennedy's days and Caro and Dallek for Johnson; Matusow for the decade's argument.
        file: II.A.yaml
      - id: p2b
        num: II.B
        title: Domestic policy and the economy
        logic:
          - The program, the economists, the poverty war, Medicare, schools, space, trade, the dollar, and monetary policy. The legislative side is in K–J Cong. II.B.
        file: II.B.yaml
      - id: p2c
        num: II.C
        title: 'Civil rights: the executive'
        logic:
          - The Justice Department, the White House, and the movement as seen from Washington. The bills are in K–J Cong. II.C; the movement is in K–J Cong. II.F.
        file: II.C.yaml
      - id: p2d
        num: II.D
        title: National security
        logic:
          - Cuba, Berlin, Laos, the missile crisis, arms control, Vietnam decisions, Latin America, the Congo, the Dominican Republic, the Six-Day War, the *Pueblo*. For the war after 1965, the Vietnam bibliography.
        file: II.D.yaml
      - id: p2e
        num: II.E
        title: Justice, intelligence, and the FBI
        logic:
          - Robert Kennedy's department, organized crime, the CIA's covert side, and Hoover. Civil rights enforcement is in II.C.
        file: II.E.yaml
      - id: p2f
        num: II.F
        title: Dallas and the transition
        logic:
          - Under the Dallas rule. The commission's report and the later official inquiries are in II.H.3.
        file: II.F.yaml
      - id: p2g
        num: II.G
        title: Memoirs and biographies
        logic:
          - 'Books that preserve a person''s voice. Seven groups: 1. The Kennedys. 2. The Kennedy White House. 3. Johnson and his court. 4. National security and the military. 5. The cabinet and the domestic side. 6. Justice and intelligence. 7. Abroad. Alphabetical by subject within each.'
