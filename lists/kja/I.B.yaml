# K–J Adm. I.B Stage, film, and television
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: I.B
entries:
  - id: kja.primary
    c: '*Primary* (Robert Drew dir., 1960)'
    n: Wisconsin, 1960. The prologue. Also in the 1968 list.
  - id: kja.adventures-on-the-new-frontier
    c: '*Adventures on the New Frontier* (Robert Drew dir., ABC 1961)'
    n: Drew's cameras in the White House in the first months.
  - id: kja.pt-109
    c: '*PT 109* (Leslie H. Martinson dir., 1963)'
    n: Cliff Robertson. Released in June 1963.
  - id: kja.crisis-behind-a-presidential-commitment
    c: '*Crisis: Behind a Presidential Commitment* (Robert Drew dir., ABC 1963)'
    n: The Kennedys, Katzenbach, and Wallace in June 1963, filmed in the Oval Office and at Hickory Hill. The best footage of the administration at work. Aired Oct. 21.
  - id: kja.dr-strangelove-or-how-i
    c: '*Dr. Strangelove or: How I Learned to Stop Worrying and Love the Bomb* (Stanley Kubrick dir., 1964)'
    n: The war room. Released in January 1964.
  - id: kja.fail-safe
    c: '*Fail Safe* (Sidney Lumet dir., 1964)'
  - id: kja.garson-macbird
    c: Barbara Garson, *MacBird!* (1966)
    n: Johnson as Macbeth, Robert Kennedy as Macduff. Off-Broadway, 1967.
  - id: kja.the-missiles-of-october
    c: '*The Missiles of October* (ABC 1974)'
    n: From Robert Kennedy's *Thirteen Days*. William Devane, Martin Sheen.
  - id: kja.lbj
    c: '*LBJ* (PBS American Experience 1991)'
    n: Also in the 1968 list.
  - id: kja.thirteen-days
    c: '*Thirteen Days* (Roger Donaldson dir., 2000)'
    n: O'Donnell inflated into the hero.
  - id: kja.path-to-war
    c: '*Path to War* (HBO 2002)'
    n: Johnson and his advisers, 1965–68. Michael Gambon. Frankenheimer's last film.
  - id: kja.the-fog-of-war
    c: '*The Fog of War* (Errol Morris dir., 2003)'
    n: McNamara at eighty-five.
  - id: kja.schenkkan-all-the-way
    c: Robert Schenkkan, *All the Way* (2012) & *The Great Society* (2014)
    n: 'Plays: 1963–64, then 1965–68. The first filmed by HBO (2016). Also in the 1968 list.'
  - id: kja.selma
    c: '*Selma* (Ava DuVernay dir., 2014)'
    n: Johnson as obstacle. Califano and others disputed the portrait.
  - id: kja.lbj-2
    c: '*LBJ* (Rob Reiner dir., 2016)'
    n: Also in the 1968 list.
