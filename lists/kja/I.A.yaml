# K–J Adm. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: I.A
entries:
  - id: kja.lederer-ugly-american
    c: William J. Lederer & Eugene Burdick, *The Ugly American* (1958)
    n: Before the period, and part of its furniture. The New Frontier's counterinsurgents and Peace Corps planners cited it.
  - id: kja.knebel-seven-days-in
    c: Fletcher Knebel & Charles W. Bailey II, *Seven Days in May* (1962)
    n: Kennedy encouraged the film. Also in the 1968 list.
  - id: kja.burdick-fail-safe
    c: Eugene Burdick & Harvey Wheeler, *Fail-Safe* (1962)
    n: An accidental bomber run on Moscow; the President on the hot line. Serialized in October 1962.
  - id: kja.mailer-american-dream
    c: Norman Mailer, *An American Dream* (1965)
    n: The narrator, a war hero and former congressman, double-dated with "Jack" in 1946. Serialized in *Esquire*, 1964.
  - id: kja.oconnor-all-in-the
    c: Edwin O'Connor, *All in the Family* (1966)
    n: An Irish political family in New England; the brother who runs for governor. The Kennedys under a thin coat.
  - id: kja.condon-winter-kills
    c: Richard Condon, *Winter Kills* (1974)
    n: A murdered President and a monstrous father. Also in the 1968 list.
  - id: kja.mccarry-tears-of-autumn
    c: Charles McCarry, *The Tears of Autumn* (1974)
    n: Dallas traced to the Diem coup. Inside the Saigon station and the White House of 1963. Also in the 1968 list.
  - id: kja.ellroy-american-tabloid
    c: James Ellroy, *American Tabloid* (1995)
    n: 1958–63. Hoover, the Kennedys, Hoffa, the Bay of Pigs exiles. Also in the 1968 list.
  - id: kja.ellroy-cold-six-thousand
    c: James Ellroy, *The Cold Six Thousand* (2001)
    n: 1963–68. Also in the 1968 list.
  - id: kja.follett-edge-of-eternity
    c: Ken Follett, *Edge of Eternity* (2014)
    n: A fictional aide in Robert Kennedy's Justice Department; the Freedom Rides and the missile crisis. Also in the 1968 list.
