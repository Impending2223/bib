# K–J Adm. II.K Archives
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.K
entries:
  - id: kja.org-3
    c: American Archive of Public Broadcasting [americanarchive.org](https://americanarchive.org)
    n: NET public affairs, 1961–68.
  - id: kja.edu
    c: American Presidency Project [presidency.ucsb.edu](https://www.presidency.ucsb.edu)
    n: The Public Papers, searchable. The calendar's citations to messages and speeches can be found here by title and date. Also Gallup's presidential approval readings, tabulated by president.
  - id: kja.org-loh-2
    c: 'DiscoverLBJ: Oral Histories [discoverlbj.org/loh/av/audio](https://discoverlbj.org/loh/av/audio)'
    n: Most of Part III gave one. Also in the 1968 list.
  - id: kja.library-boston-jfklibrary-org
    c: John F. Kennedy Presidential Library, Boston [jfklibrary.org](https://www.jfklibrary.org)
    n: The President's Office Files, National Security Files, the oral history program, Robert Kennedy's papers, the press conferences on film. Much digitized.
  - id: kja.library-austin
    c: LBJ Presidential Library, Austin
    n: The White House Central Files, the NSF, Tom Johnson's notes, the daily diary.
  - id: kja.org-4
    c: Mary Ferrell Foundation [maryferrell.org](https://www.maryferrell.org)
    n: Under the Dallas rule, cited only for its searchable copies of the Church Committee and the released agency files.
  - id: kja.collection
    c: 'National Archives: JFK Assassination Records Collection'
    n: Includes much on Mongoose and the CIA's Cuban operations.
  - id: kja.edu-2
    c: National Security Archive [nsarchive.gwu.edu](https://nsarchive.gwu.edu)
    n: Electronic briefing books on the Bay of Pigs, Berlin, the missile crisis, Tonkin Gulf.
  - id: kja.library-manuscripts-and-archives
    c: New York Public Library, Manuscripts and Archives
    n: Schlesinger's papers. Check.
  - id: kja.historian-u-s-department
    c: Office of the Historian, U.S. Department of State [history.state.gov](https://history.state.gov)
    n: FRUS.
  - id: kja.library-university-of-georgia
    c: Richard B. Russell Library, University of Georgia
    n: The Rusk oral history. Also in the 1968 list.
  - id: kja.archive
    c: Vanderbilt Television News Archive
    n: Begins August 1968. For earlier broadcasts, the networks and the presidential libraries.
  - id: kja.org-5
    c: Wilson Center Digital Archive [digitalarchive.wilsoncenter.org](https://digitalarchive.wilsoncenter.org)
    n: Soviet, East German, Cuban, and Chinese documents in translation.
