# K–J Adm. II.J The tapes
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.J
entries:
  - id: kja.the-kennedy-tapes-inside-the
    c: '*The Kennedy Tapes: Inside the White House During the Cuban Missile Crisis* (Ernest R. May & Philip D. Zelikow eds., 1997)'
    n: Stern (II.D) found errors in the first edition; later editions corrected many.
  - id: kja.the-presidential-recordings-john-f
    c: '*The Presidential Recordings: John F. Kennedy: The Great Crises* (Timothy Naftali, Philip D. Zelikow & Ernest R. May eds., 2001)'
    n: Three volumes, July to October 1962.
  - id: kja.listening-in-the-secret-white
    c: '*Listening In: The Secret White House Recordings of John F. Kennedy* (Ted Widmer ed., 2012)'
    n: A selection, with two CDs.
  - id: kja.taking-charge
    c: '*Taking Charge* & *Reaching for Glory* (Michael R. Beschloss ed., 1997, 2001)'
    n: See II.G.3.
  - id: kja.the-presidential-recordings-lyndon-b
    c: '*The Presidential Recordings: Lyndon B. Johnson* (Miller Center eds., 2005–)'
    n: Annotated transcripts, November 1963 onward. Check how far the series has reached.
  - id: kja.miller-center-presidential-recordings-millercenter
    c: 'Miller Center: Presidential Recordings [millercenter.org](https://millercenter.org)'
    n: Audio and transcripts, call by call. Also in the 1968 list.
  - id: kja.lbjtapes-org-lbjtapes-org
    c: LBJTapes.org [lbjtapes.org](https://lbjtapes.org)
    n: Selected conversations with scrolling transcripts. Also in the 1968 list.
  - id: kja.fraser-federal-reserve-bank-of
    c: FRASER, Federal Reserve Bank of St. Louis [fraser.stlouisfed.org](https://fraser.stlouisfed.org)
    n: Heller's statements and speeches; Martin's papers; the *Federal Reserve Bulletin*; BLS *Employment and Earnings* as published; the Economic Reports. The figures as people saw them at the time.
  - id: kja.fred-federal-reserve-bank-of
    c: FRED, Federal Reserve Bank of St. Louis [fred.stlouisfed.org](https://fred.stlouisfed.org)
    n: 'The revised monthly series: unemployment, prices, output, rates.'
  - id: kja.discoverlbj-telephone-conversations-discoverlbj-org
    c: 'DiscoverLBJ: Telephone Conversations [discoverlbj.org/loh/telecon](https://discoverlbj.org/loh/telecon)'
    n: The full collection. Also in the 1968 list.
