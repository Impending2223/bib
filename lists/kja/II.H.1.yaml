  - id: kja.meredith-v-fair
    c: '*Meredith v. Fair*, [305 F.2d 343](https://static.case.law/f2d/305/case-pdfs/0343-01.pdf) (5th Cir. 1962)'
    n: Wisdom orders Meredith admitted. Ben Cameron's stays followed; Black vacated them.
  - id: kja.united-states-v-barnett
    c: '*United States v. Barnett*, [376 U.S. 681](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376681/usrep376681.pdf) (1964)'
    n: Criminal contempt for Oxford. No jury required. The charges were dropped in 1965.
  - id: kja.aptheker-v-secretary-of-state
    c: '*Aptheker v. Secretary of State*, [378 U.S. 500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378500/usrep378500.pdf) (1964)'
    n: Passports for Communists.
  - id: kja.zemel-v-rusk
    c: '*Zemel v. Rusk*, [381 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381001/usrep381001.pdf) (1965)'
    n: The Cuba travel ban upheld.
  - id: kja.lamont-v-postmaster-general
    c: '*Lamont v. Postmaster General*, [381 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381301/usrep381301.pdf) (1965)'
    n: Postal screening of "communist political propaganda" struck. Often called the first federal statute held to violate the First Amendment.
  - id: kja.united-states-v-guest
    c: '*United States v. Guest*, [383 U.S. 745](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383745/usrep383745.pdf) (1966)'
    n: The murder of Lemuel Penn. Federal power over private conspiracies.
  - id: kja.united-states-v-price
    c: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966)'
    n: The Neshoba County murders of 1964.
  - id: kja.united-states-v-obrien
    c: '*United States v. O''Brien*, [391 U.S. 367](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391367/usrep391367.pdf) (1968)'
    n: The 1965 draft-card statute upheld.
