# K–J Adm. II.G.7 Abroad
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.G.7
entries:
  - id: kja.adenauer-konrad
    s: Adenauer, Konrad
    c: '*Erinnerungen 1959–1963: Fragmente* (1968)'
    n: The unfinished last volume. Berlin 1961 and his distrust of Kennedy. Not translated; only the first volume, as *Memoirs 1945–53* (1966).
  - id: kja.brandt-willy
    s: Brandt, Willy
    c: '*Begegnungen und Einsichten: Die Jahre 1960–1975* (1976)'
    n: Mayor of West Berlin in August 1961. Translated as *People and Politics* (1978). Also Adm.
  - id: kja.de-gaulle-charles
    s: de Gaulle, Charles
    c:
      - '*Mémoires d''espoir* (1970–71)'
      - Alain Peyrefitte, *C'était de Gaulle* (1994–2000)
    n: 'The memoirs stop in 1962; translated as *Memoirs of Hope: Renewal and Endeavour* (1971). Peyrefitte''s three volumes record the General''s talk, Kennedy and the multilateral force included. No English translation that I know of.'
  - id: kja.dobrynin-anatoly
    s: Dobrynin, Anatoly
    c: '*In Confidence: Moscow''s Ambassador to America''s Six Cold War Presidents* (1995)'
    n: 'Ambassador from 1962. Russian: *Sugubo doveritel''no* Сугубо доверительно (1996). Also Adm.'
  - id: kja.emminger-otmar
    s: Emminger, Otmar
    c: '*D-Mark, Dollar, Währungskrisen: Erinnerungen eines ehemaligen Bundesbankpräsidenten* (1986)'
    n: On the Bundesbank's directorate in March 1961; the revaluation from inside. No translation known to me. Cal.
  - id: kja.khrushchev-nikita-s
    s: Khrushchev, Nikita S.
    c:
      - '*Vremya. Lyudi. Vlast''* Время. Люди. Власть. (1999)'
      - 'Sergei Khrushchev, *Nikita Khrushchev: krizisy i rakety* Никита Хрущев: кризисы и ракеты (1994)'
    n: The dictations complete, in four volumes. The earlier English books, *Khrushchev Remembers* (1970) and *The Last Testament* (1974), were cut and arranged by others; the complete English is *Memoirs of Nikita Khrushchev* (Sergei Khrushchev ed., 2004–07). The son's book was expanded in translation as *Nikita Khrushchev and the Creation of a Superpower* (2000). Check the son's Russian date, and expanded or abridged.
  - id: kja.macmillan-harold
    s: Macmillan, Harold
    c:
      - '*At the End of the Day, 1961–1963* (1973)'
      - '*The Macmillan Diaries: Prime Minister and After, 1957–66* (Peter Catterall ed., 2011)'
    n: Kennedy as the younger man he steered.
  - id: kja.rueff-jacques
    s: Rueff, Jacques
    c: '*Le Péché monétaire de l''Occident* (1971)'
    n: De Gaulle's monetary adviser against the gold-exchange standard. Collects pieces from 1961 on, the first in *Le Monde*, June 1961. Translated as *The Monetary Sin of the West* (1972).
  - id: kja.wilson-harold
    s: Wilson, Harold
    c: '*The Labour Government, 1964–1970: A Personal Record* (1971)'
    n: Vietnam, and the sterling devaluation of 1967.
