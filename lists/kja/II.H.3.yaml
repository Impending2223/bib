# K–J Adm. II.H.3 Reports and memoranda
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.H.3
entries:
  - id: kja.economy-prospects-and-policies
    c: President-elect's Task Force on the State of the American Economy, *Prospects and Policies for the 1961 American Economy* (Jan. 1961)
    n: Samuelson's report. Check the title and date. Cal.
  - id: kja.bundesbank-monatsbericht
    c: Deutsche Bundesbank, *Monatsbericht* (März 1961) [bundesbank.de](https://www.bundesbank.de/en/publications/reports/monthly-reports/monthly-report-march-1961-704686)
    n: The revaluation explained by the bank that had resisted it. English edition, *Monthly Report*. Cal.
  - id: kja.president-economics-of-the
    c: Memorandum from Walter W. Heller to the President, *The Economics of the Second-Stage Recovery Program* (Mar. 17, 1961) [sechistorical.org](https://www.sechistorical.org/collection/papers/1960/1961_0317_HellerRecoveryT.pdf)
    n: With "A Second Look at Economic Policy for 1961." Cal.
  - id: kja.memorandum-from-maxwell-d-taylor
    c: Memorandum from Maxwell D. Taylor to the President (June 13, 1961)
    n: 'The Cuba Study Group''s report on Zapata. Published as *Operation Zapata: The "Ultrasensitive" Report and Testimony of the Board of Inquiry on the Bay of Pigs* (1981). Cal.'
  - id: kja.lyman-b-kirkpatrick-jr-inspector
    c: Lyman B. Kirkpatrick Jr., Inspector General's Survey of the Cuban Operation (Oct. 1961)
    n: The CIA's own indictment. Declassified 1998; printed in *Bay of Pigs Declassified* (Peter Kornbluh ed., 1998).
  - id: kja.memorandum-from-maxwell-d-taylor-2
    c: Memorandum from Maxwell D. Taylor to the President (Nov. 3, 1961)
    n: The Taylor–Rostow report. Troops proposed as flood relief.
  - id: kja.advisers-annual-report
    c: Council of Economic Advisers, *Annual Report* (Jan. 1962), in *Economic Report of the President*
    n: 'The new economics stated as doctrine: the gap, the 4 percent goal, the guideposts.'
  - id: kja.women-american-women
    c: President's Commission on the Status of Women, *American Women* (1963)
  - id: kja.participation-report-of-the
    c: '*Report of the President''s Commission on Registration and Voting Participation* (1963)'
    n: Scammons commission. Cal.
  - id: kja.advisers-annual-report-2
    c: Council of Economic Advisers, *Annual Report* (Jan. 1964)
    n: Chapter 2, "The Problem of Poverty in America." The poverty line's first appearance.
  - id: kja.scope-and-distribution-of
    c: Committee to Strengthen the Security of the Free World, *The Scope and Distribution of United States Military and Economic Assistance Programs* (1963)
    n: The Clay report, Mar. 20, 1963.
  - id: kja.report-of-the-presidents-commission
    c: '*Report of the President''s Commission on the Assassination of President Kennedy* (1964)'
    n: With twenty-six volumes of hearings and exhibits. Also in the 1968 list.
  - id: kja.research-negro-family-the
    c: 'Office of Policy Planning and Research, U.S. Department of Labor, *The Negro Family: The Case for National Action* (1965)'
    n: The Moynihan Report. Lee Rainwater & William L. Yancey, *The Moynihan Report and the Politics of Controversy* (1967), prints it with the quarrel.
  - id: kja.the-pentagon-papers
    c: '*The Pentagon Papers* (Gravel ed., 1971)'
    n: Four volumes and an index. Kennedy and Johnson years in full. Also Adm.
  - id: kja.s-rep-no-94-465
    c: S. Rep. No. 94-465 (1975)
    n: The Church Committee's *Alleged Assassination Plots Involving Foreign Leaders*. Castro, Trujillo, Lumumba, Diem. Mongoose in detail.
  - id: kja.s-rep-no-94-755
    c: S. Rep. No. 94-755, Book V (1976)
    n: 'The Church Committee''s *The Investigation of the Assassination of President John F. Kennedy: Performance of the Intelligence Agencies*. The Schweiker–Hart report: what the CIA and FBI did not tell the Warren Commission.'
  - id: kja.h-r-rep-no-95
    c: H.R. Rep. No. 95-1828 (1979)
    n: The House Select Committee on Assassinations. Under the Dallas rule, cited for its review of the agencies, not its acoustics.
  - id: kja.board-final-report
    c: Assassination Records Review Board, *Final Report* (1998)
    n: What the 1992 act released, and where.
  - id: kja.foreign-relations-of-the-united
    c:
      - '*Foreign Relations of the United States, 1961–1963* (25 vols.)'
      - '*Foreign Relations of the United States, 1964–1968* (34 vols.)'
    n: Online at [history.state.gov](https://history.state.gov). The Cuba, Berlin, Laos, Vietnam, and Congo volumes carry the meetings and cables.
  - id: kja.public-papers-of-the-presidents
    c:
      - '*Public Papers of the Presidents of the United States: John F. Kennedy* (3 vols., 1962–64)'
      - '*Public Papers of the Presidents of the United States: Lyndon B. Johnson* (10 vols., 1965–70)'
    n: Speeches, messages, press conferences.
