# K–J Adm. II.A The presidents and the White House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: kja
section: II.A
entries:
  - id: kja.neustadt-presidential-power-the
    c: 'Richard E. Neustadt, *Presidential Power: The Politics of Leadership* (1960)'
    n: Kennedy read it. Neustadt wrote the transition memos.
  - id: kja.evans-lyndon-b-johnson-2
    c: 'Rowland Evans Jr. & Robert D. Novak, *Lyndon B. Johnson: The Exercise of Power* (1966)'
    n: See I.C.
  - id: kja.goldman-tragedy-of-lyndon
    c: Eric F. Goldman, *The Tragedy of Lyndon Johnson* (1969)
    n: By the scholar in residence, 1964–66. Bitter and observant.
  - id: kja.kearns-lyndon-johnson-and
    c: Doris Kearns, *Lyndon Johnson and the American Dream* (1976)
    n: Johnson's monologues at the ranch, as she recorded them. Also in the 1968 list.
  - id: kja.wills-kennedy-imprisonment-a
    c: 'Garry Wills, *The Kennedy Imprisonment: A Meditation on Power* (1982)'
  - id: kja.caro-years-of-lyndon
    c:
      - 'Robert A. Caro, *The Years of Lyndon Johnson: The Path to Power* (1982)'
      - '*Means of Ascent* (1990)'
      - '*Master of the Senate* (2002)'
      - '*The Passage of Power* (2012)'
    n: 'The first three are prologue. *Passage* covers 1958–64: the vice presidency, Dallas, the first months. Also in the 1968 list.'
  - id: kja.parmet-jfk-the-presidency
    c: 'Herbert S. Parmet, *JFK: The Presidency of John F. Kennedy* (1983)'
  - id: kja.bornet-presidency-of-lyndon
    c: Vaughn Davis Bornet, *The Presidency of Lyndon B. Johnson* (1983)
  - id: kja.matusow-unraveling-of-america
    c: 'Allen J. Matusow, *The Unraveling of America: A History of Liberalism in the 1960s* (1984)'
    n: The case against the liberals' competence, made from the left. The best single book on the policy record.
  - id: kja.conkin-big-daddy-from
    c: 'Paul K. Conkin, *Big Daddy from the Pedernales: Lyndon Baines Johnson* (1986)'
  - id: kja.bernstein-promises-kept-john
    c: 'Irving Bernstein, *Promises Kept: John F. Kennedy''s New Frontier* (1991)'
  - id: kja.giglio-presidency-of-john
    c: James N. Giglio, *The Presidency of John F. Kennedy* (1991)
  - id: kja.dallek-lone-star-rising
    c:
      - 'Robert Dallek, *Lone Star Rising: Lyndon Johnson and His Times, 1908–1960* (1991)'
      - '*Flawed Giant: Lyndon Johnson and His Times, 1961–1973* (1998)'
  - id: kja.reeves-president-kennedy-profile
    c: 'Richard Reeves, *President Kennedy: Profile of Power* (1993)'
    n: Day by day, from the documents. The best source for scene.
  - id: kja.bernstein-guns-or-butter
    c: 'Irving Bernstein, *Guns or Butter: The Presidency of Lyndon Johnson* (1996)'
  - id: kja.patterson-grand-expectations-the
    c: 'James T. Patterson, *Grand Expectations: The United States, 1945–1974* (1996)'
  - id: kja.hersh-dark-side-of
    c: Seymour M. Hersh, *The Dark Side of Camelot* (1997)
    n: Use with care. A set of documents offered to him proved forged; he dropped them, but other parts rest on single witnesses.
  - id: kja.shesol-mutual-contempt-lyndon
    c: 'Jeff Shesol, *Mutual Contempt: Lyndon Johnson, Robert Kennedy, and the Feud That Defined a Decade* (1997)'
  - id: kja.dallek-unfinished-life-john
    c: 'Robert Dallek, *An Unfinished Life: John F. Kennedy, 1917–1963* (2003)'
    n: The medical records.
  - id: kja.woods-lbj-architect-of
    c: 'Randall B. Woods, *LBJ: Architect of American Ambition* (2006)'
  - id: kja.logevall-jfk-coming-of
    c: 'Fredrik Logevall, *JFK: Coming of Age in the American Century, 1917–1956* (2020)'
    n: First of two volumes. Ends before the period.
