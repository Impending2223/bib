# Opp. I.C Reportage
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: I.C
entries:
  - id: opp.mailer-in-the-red
    c: 'Norman Mailer, *In the Red Light: A History of the Republican Convention in 1964*, [Esquire](https://classic.esquire.com), Nov. 1964'
    n: Collected in *Cannibals and Christians* (1966). The Cow Palace as theatre. The best prose on 1964.
  - id: opp.rovere-goldwater-caper
    c: Richard H. Rovere, *The Goldwater Caper* (1965)
    n: New Yorker pieces. Dry, exact.
  - id: opp.kempton-underestimation-of-dwight
    c: Murray Kempton, *The Underestimation of Dwight D. Eisenhower*, [Esquire](https://classic.esquire.com), Sept. 1967
    n: Ike as the cunning one. The revisionism started here.
  - id: opp.mailer-miami-and-the
    c: Norman Mailer, *Miami and the Siege of Chicago* (1968)
    n: 'The first half is Miami Beach: Nixon, Rockefeller, Reagan, the delegates.'
  - id: opp.didion-many-mansions
    c: Joan Didion, *Many Mansions*, in *The White Album* (1979)
    n: The governor's mansion built for the Reagans and never lived in.
