# Opp. II.I Recordings
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: II.I
entries:
  - id: opp.goldwater-speech-to-the
    c: Barry Goldwater, speech to the Republican National Convention, Chicago (July 27, 1960)
    n: '"Let''s grow up, conservatives." The start of the draft.'
  - id: opp.nixon-press-conference-beverly
    c: Richard M. Nixon, press conference, Beverly Hilton, Los Angeles (Nov. 7, 1962)
    n: '"You won''t have Nixon to kick around anymore."'
  - id: opp.smith-announcement-of-candidacy
    c: Margaret Chase Smith, announcement of candidacy, Women's National Press Club (Jan. 27, 1964)
  - id: opp.dirksen-speech-on-cloture
    c: Everett M. Dirksen, speech on cloture (June 10, 1964)
    n: '"An idea whose time has come."'
  - id: opp.rockefeller-speech-on-extremism
    c: Nelson A. Rockefeller, speech on extremism, Republican National Convention, San Francisco (July 14, 1964)
    n: Booed down.
  - id: opp.eisenhower-speech-republican-national
    c: Dwight D. Eisenhower, speech, Republican National Convention (July 14, 1964)
    n: The line on "sensation-seeking columnists" set the hall on the press gallery.
  - id: opp.goldwater-acceptance-speech-july
    c: Barry Goldwater, acceptance speech (July 16, 1964)
    n: '"Extremism in the defense of liberty is no vice." The line is Harry Jaffa''s.'
  - id: opp.reagan-time-for-choosing
    c: Ronald Reagan, *A Time for Choosing* (NBC Oct. 27, 1964)
    n: Paid time. His political debut.
  - id: opp.dirksen-joint-press-conferences
    c: Everett M. Dirksen & Gerald R. Ford, joint press conferences (1965–68)
    n: The "Ev and Jerry Show." Before that, Ev and Charlie.
  - id: opp.dirksen-gallant-men
    c: Everett McKinley Dirksen, *Gallant Men* (1966)
    n: Spoken-word album. Also in the 1968 list.
  - id: opp.buckley-firing-line
    c: William F. Buckley Jr., *Firing Line* (1966–)
    n: Early guests include Reagan and the Birchers' critics.
  - id: opp.kennedy-town-meeting-of
    c: Robert F. Kennedy & Ronald Reagan, *Town Meeting of the World* (CBS May 15, 1967)
    n: Also in the 1968 list.
  - id: opp.romney-interview-with-lou
    c: George Romney, interview with Lou Gordon (WKBD Detroit Sept. 4, 1967)
    n: '"Brainwashing." Taped days earlier.'
  - id: opp.rockefeller-press-conference-withdrawing
    c: Nelson A. Rockefeller, press conference withdrawing (Mar. 21, 1968)
  - id: opp.convention-miami-beach-aug
    c: Republican National Convention, Miami Beach (Aug. 5–8, 1968)
    n: Nixon's acceptance, Aug. 8. The Vanderbilt archive began taping the network news that week.
  - id: opp.nixon-rowan-and-martins
    c: Richard M. Nixon, *Rowan & Martin's Laugh-In* (NBC Sept. 16, 1968)
    n: '"Sock it to me?"'
