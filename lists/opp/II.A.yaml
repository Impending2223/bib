# Opp. II.A The party
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: II.A
entries:
  - id: opp.jones-republican-party-in
    c: Charles O. Jones, *The Republican Party in American Politics* (1965)
    n: The party after the 1964 defeat, by a political scientist.
  - id: opp.novak-agony-of-the
    c: Robert D. Novak, *The Agony of the G.O.P. 1964* (1965)
    n: Novak's first book. The seizure of the party, from its own reporters' desk.
  - id: opp.hess-republican-establishment-the
    c: 'Stephen Hess & David S. Broder, *The Republican Establishment: The Present and Future of the G.O.P.* (1967)'
    n: Portraits of the governors and senators of 1967. Read for who was thought to matter.
  - id: opp.phillips-emerging-republican-majority
    c: Kevin P. Phillips, *The Emerging Republican Majority* (1969)
    n: The theory, written in 1967–68. Also Adm.
  - id: opp.rae-decline-and-fall
    c: 'Nicol C. Rae, *The Decline and Fall of the Liberal Republicans: From 1952 to the Present* (1989)'
  - id: opp.gould-grand-old-party
    c: 'Lewis L. Gould, *Grand Old Party: A History of the Republicans* (2003)'
  - id: opp.gifford-center-cannot-hold
    c: 'Laura Jane Gifford, *The Center Cannot Hold: The 1960 Presidential Election and the Rise of Modern Conservatism* (2009)'
    n: The prologue.
  - id: opp.kabaservice-rule-and-ruin
    c: 'Geoffrey Kabaservice, *Rule and Ruin: The Downfall of Moderation and the Destruction of the Republican Party, from Eisenhower to the Tea Party* (2012)'
    n: The moderates' side of the war. Most of the book is 1960–68.
  - id: opp.mason-republican-party-and
    c: Robert Mason, *The Republican Party and American Politics from Hoover to Reagan* (2012)
    n: The party as a minority seeking a majority.
  - id: opp.richardson-to-make-men
    c: 'Heather Cox Richardson, *To Make Men Free: A History of the Republican Party* (2014)'
  - id: opp.rosenfeld-polarizers-postwar-architects
    c: 'Sam Rosenfeld, *The Polarizers: Postwar Architects of Our Partisan Era* (2018)'
    n: Activists in both parties who wanted clear sides. Goldwater's people among them.
