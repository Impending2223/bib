# Opp. II.G.2 The House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: II.G.2
entries:
  - id: opp.anderson-john-b
    s: Anderson, John B.
    c: '*Between Two Worlds: A Congressman''s Choice* (1970)'
    n: The Rockford conservative's turn, and the 1968 open-housing vote.
  - id: opp.bush-george-h-w
    s: Bush, George H.W.
    c: 'Jon Meacham, *Destiny and Power: The American Odyssey of George Herbert Walker Bush* (2015)'
    n: The 1964 Senate race and the House years draw on his diaries. Also Adm.
  - id: opp.dole-bob
    s: Dole, Bob
    c: 'Richard Ben Cramer, *What It Takes: The Way to the White House* (1992)'
    n: The Russell, Kansas chapters. Also Cong.
  - id: opp.ford-gerald-r
    s: Ford, Gerald R.
    c:
      - '*A Time to Heal: The Autobiography of Gerald R. Ford* (1979)'
      - 'James Cannon, *Time and Chance: Gerald Ford''s Appointment with History* (1994)'
      - 'Richard Norton Smith, *An Ordinary Man: The Surprising Life and Historic Presidency of Gerald R. Ford* (2023)'
    n: Cannon and Smith give the House years their due; Ford's own book does not. Also Adm., Cong., Wg.
  - id: opp.halleck-charles-a
    s: Halleck, Charles A.
    c: 'Henry Z. Scheele, *Charlie Halleck: A Political Biography* (1966)'
    n: Published the year after his fall.
  - id: opp.laird-melvin-r
    s: Laird, Melvin R.
    c:
      - '*A House Divided: America''s Strategy Gap* (1962)'
      - '*The Conservative Papers* (Melvin R. Laird ed., 1964)'
      - 'Dale Van Atta, *With Honor: Melvin Laird in War, Peace, and Politics* (2008)'
    n: The second collects papers by conservative intellectuals commissioned by House Republicans. Also Adm.
  - id: opp.rhodes-john-j
    s: Rhodes, John J.
    c: John J. Rhodes with Dean Smith, *I Was There* (1995)
    n: Check the title. Also Cong. and Wg.
  - id: opp.rumsfeld-donald
    s: Rumsfeld, Donald
    c: '*Known and Unknown: A Memoir* (2011)'
    n: The House chapters and the 1965 coup against Halleck. Also Adm.
