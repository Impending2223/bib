    r: Governor of Rhode Island, 1963–69
    n: Also Adm., as Navy Secretary.
  - id: opp.who.evans-daniel-j
    s: Evans, Daniel J.
    r: Governor of Washington from 1965
    n: Keynoter at Miami Beach. Also Cong.
  - id: opp.who.kirk-claude-r-jr
    s: Kirk, Claude R., Jr.
    r: Governor of Florida, 1967–71
    n: Also Cong.
