# Opp. I.B Screen
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: I.B
entries:
  - id: opp.advise-and-consent
    c: '*Advise and Consent* (Otto Preminger dir., 1962)'
    n: The Senate in the round. Dirksen-era chamber manners.
  - id: opp.the-manchurian-candidate
    c: '*The Manchurian Candidate* (John Frankenheimer dir., 1962)'
    n: Senator Iselin, a McCarthyite puppet, at the convention. Party unnamed; the coding is plain.
  - id: opp.seven-days-in-may
    c: '*Seven Days in May* (John Frankenheimer dir., 1964)'
    n: The right-wing general as the Goldwater-year fear.
  - id: opp.the-best-man
    c: '*The Best Man* (Franklin J. Schaffner dir., 1964)'
    n: Vidal's convention play filmed. Cantwell is Nixon and McCarthy together. Released during the Goldwater campaign.
  - id: opp.slatterys-people
    c: '*Slattery''s People* (CBS 1964–65)'
    n: Richard Crenna as minority leader of a state House. Almost the only network drama set in a legislature.
  - id: opp.choice
    c: '*Choice* (Mothers for a Moral America 1964)'
    n: The Goldwater campaign's film on national decay. Withdrawn before broadcast at Goldwater's order.
  - id: opp.the-making-of-the-president
    c: '*The Making of the President 1964* (David L. Wolper prod., 1965)'
    n: From White's book. Convention footage. CBS. Check the air date.
