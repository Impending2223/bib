# Opp. III.A Senate leadership
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: III.A
entries:
  - id: opp.who.dirksen-everett-m
    s: Dirksen, Everett M.
    r: Senator, Illinois, 1951–69; Minority Leader, 1959–69
    n: 'Johnson''s partner and foil. Died Sept. 7, 1969. Voice: tapes; the Ev and Jerry show (II.I); *Gallant Men*.'
  - id: opp.who.hickenlooper-bourke-b
    s: Hickenlooper, Bourke B.
    r: Senator, Iowa, to 1969; Policy Committee chairman, 1962–69
  - id: opp.who.kuchel-thomas-h
    s: Kuchel, Thomas H.
    r: Senator, California, 1953–69; Whip, 1959–69
    n: Floor manager for the 1964 act with Humphrey. Lost the 1968 primary to Rafferty.
  - id: opp.who.saltonstall-leverett
    s: Saltonstall, Leverett
    r: Senator, Massachusetts, to 1967; Conference chairman, 1957–67
  - id: opp.who.smith-margaret-chase
    s: Smith, Margaret Chase
    r: Senator, Maine; Conference chairman from 1967
    n: 'Voice: her 1964 announcement (II.I); *Declaration of Conscience* (II.G.1). Also Cong.'
