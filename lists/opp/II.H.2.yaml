# Opp. II.H.2 Statutes, amendments, and votes
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: II.H.2
entries:
  - id: opp.civil-rights-act-of-1964
    c: Civil Rights Act of 1964, [Pub. L. No. 88-352, 78 Stat. 241](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg241.pdf)
    n: Cloture June 10, 1964, 71–29; Republicans 27–6 for. Goldwater voted against passage.
  - id: opp.tonkin-gulf-resolution-pub-l
    c: Tonkin Gulf Resolution, [Pub. L. No. 88-408, 78 Stat. 384](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg384.pdf) (1964)
    n: Unanimous in the House.
  - id: opp.voting-rights-act-of-1965
    c: Voting Rights Act of 1965, [Pub. L. No. 89-110, 79 Stat. 437](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg437.pdf)
  - id: opp.s-j-res-2-89th
    c: S.J. Res. 2, 89th Cong. (1965)
    n: Dirksen's reapportionment amendment. Voted on as S.J. Res. 66, amended; failed Aug. 4, 1965, [57–39](https://voteview.com/rollcall/RS0890177), short of two-thirds ([111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf)). Tried again as S.J. Res. 103; failed Apr. 20, 1966, [55–38](https://voteview.com/rollcall/RS0890289) ([112 Cong. Rec., Senate, Apr. 20, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt7/pdf/GPO-CRECB-1966-pt7-2-2.pdf)).
  - id: opp.s-j-res-148-89th
    c: S.J. Res. 148, 89th Cong. (1966)
    n: Dirksen's school-prayer amendment. Voted on as S.J. Res. 144, amended; failed Sept. 21, 1966, [49–37](https://voteview.com/rollcall/RS0890451), short of two-thirds ([112 Cong. Rec., Senate, Sept. 21, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-7-2.pdf)).
  - id: opp.u-s-const-amend-xxv
    c: U.S. Const. amend. XXV (ratified 1967)
    n: Vice-presidential vacancies. Used twice within seven years. Also Cong.
  - id: opp.civil-rights-act-of-1968
    c: Civil Rights Act of 1968, [Pub. L. No. 90-284, 82 Stat. 73](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg73.pdf)
    n: Open housing. Dirksen's switch made cloture possible.
