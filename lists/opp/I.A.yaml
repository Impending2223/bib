# Opp. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: I.A
entries:
  - id: opp.drury-shade-of-difference
    c: Allen Drury, *A Shade of Difference* (1962)
    n: Second of the *Advise and Consent* sequence. The UN and race. Drury's parties are coded, not named.
  - id: opp.burdick-480
    c: Eugene Burdick, *The 480* (1964)
    n: A computer model of 480 voter types used to engineer a convention draft. Built on Simulmatics. The candidate is a Republican.
  - id: opp.knebel-convention
    c: Fletcher Knebel & Charles W. Bailey II, *Convention* (1964)
    n: 'A Republican convention in Chicago and an attempt to buy the nomination: a labor boss, a manufacturer, a computer file on the delegates. Published in the Goldwater summer. Known to me mainly by reputation.'
  - id: opp.drury-capable-of-honor
    c: Allen Drury, *Capable of Honor* (1966)
    n: A convention, and a columnist modeled on Lippmann. Drury's case against the liberal press.
  - id: opp.drury-preserve-and-protect
    c: Allen Drury, *Preserve and Protect* (1968)
    n: A president dies; the convention must choose. Rioting outside.
