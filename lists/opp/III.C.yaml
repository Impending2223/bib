  - id: opp.who.arends-leslie-c
    s: Arends, Leslie C.
    r: Representative, Illinois; Whip, 1943–74
    n: Also Cong.
  - id: opp.who.byrnes-john-w
    s: Byrnes, John W.
    r: Representative, Wisconsin; Policy Committee chairman to 1965; ranking on Ways and Means
    n: Medicare's Republican alternative, the "Byrnes bill," became Part B.
  - id: opp.who.ford-gerald-r
    s: Ford, Gerald R.
    r: Representative, Michigan; Conference chairman, 1963–65; Minority Leader from 1965
    n: 'Beat Halleck 73–67 on Jan. 4, 1965. Voice: the Ev and Jerry show (II.I); tapes. Also Adm., Cong., Wg.'
  - id: opp.who.halleck-charles-a
    s: Halleck, Charles A.
    r: Representative, Indiana; Minority Leader, 1959–65
    n: 'Voice: tapes; the Ev and Charlie show.'
  - id: opp.who.hoeven-charles-b
    s: Hoeven, Charles B.
    r: Representative, Iowa; Conference chairman to 1963
    n: Unseated by Ford in the first of the young members' revolts.
  - id: opp.who.laird-melvin-r
    s: Laird, Melvin R.
    r: Representative, Wisconsin; Conference chairman, 1965–69; platform chairman, 1964
    n: Also Adm.
  - id: opp.who.rhodes-john-j
    s: Rhodes, John J.
    r: Representative, Arizona; Policy Committee chairman from 1965
    n: Also Cong.
  - id: opp.who.wilson-bob
    s: Wilson, Bob
    r: Representative, California; NRCC chairman from 1961
