# Opp.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Republican Opposition, 1961–1969: Bibliography'
h1: 'The Republican opposition, 1961–1969: working bibliography'
lede: 'Sources, portrayals, and names for the Republican Party out of the White House, from Kennedy''s inauguration to Nixon''s: the congressional parties, the national party, and the states.'
logic:
  - 'First of four lists, built like the 1968 bibliography. This one is Opp. The others: Nixon and his administration, 1969–74 (Adm.); Congress, the nation, and the states, 1969–74 (Cong.); and Watergate (Wg.). Cross-references give list and section. Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.'
  - The 1968 campaign belongs here, since the party was still out of power. Nixon's own wilderness years are here too; his presidency starts in Adm.
sections:
  - id: p1
    num: I.
    title: Portrayals
    logic:
      - 'Thin. The novel of the period imagined the party through conventions and conspiracies, and rarely named it. Three sections: A. Fiction. B. Screen. C. Reportage, for the set pieces the novels did not write.'
    sections:
      - id: p1a
        num: I.A
        title: Fiction
        logic:
          - Chronological by first publication.
        file: I.A.yaml
      - id: p1b
        num: I.B
        title: Screen
        logic:
          - Film and television. Chronological by release.
        file: I.B.yaml
      - id: p1c
        num: I.C
        title: Reportage
        logic:
          - Set pieces. Chronological.
        file: I.C.yaml
  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Ten sections, from the most digested to the least: A. The party. B. The right. C. The moderates. D. The congressional parties. E. The campaigns. F. The South and the states. G. Memoirs and biographies. H. Documents. I. Recordings. J. Archives. Sections A through F are chronological by first publication.'
    sections:
      - id: p2a
        num: II.A
        title: The party
        logic:
          - The party as a whole, and its factional war. Start with Kabaservice, then Hess and Broder for the view from 1967.
