# Opp. III.D House members
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: opp
section: III.D
entries:
  - id: opp.who.anderson-john-b
    s: Anderson, John B.
    r: Representative, Illinois
    n: His 1968 Rules Committee vote sent open housing to the floor.
  - id: opp.who.ashbrook-john-m
    s: Ashbrook, John M.
    r: Representative, Ohio
    n: A founder of the draft. Also Cong.
  - id: opp.who.bush-george-h-w
    s: Bush, George H.W.
    r: Chairman, Harris County Republicans; Senate nominee, 1964; Representative, Texas, from 1967
    n: Also Adm.
  - id: opp.who.callaway-howard-h-bo
    s: Callaway, Howard H. (Bo)
    r: Representative, Georgia, 1965–67; candidate for governor, 1966
    n: See *Fortson v. Morris* (II.H.1).
  - id: opp.who.curtis-thomas-b
    s: Curtis, Thomas B.
    r: Representative, Missouri
    n: Ways and Means. Much respected; lost the 1968 Senate race.
  - id: opp.who.dole-bob
    s: Dole, Bob
    r: Representative, Kansas, 1961–69; Senator from 1969
    n: Also Cong.
  - id: opp.who.goodell-charles-e
    s: Goodell, Charles E.
    r: Representative, New York; appointed Senator Sept. 1968
    n: A Ford lieutenant in 1965. Also Cong.
  - id: opp.who.gross-h-r
    s: Gross, H.R.
    r: Representative, Iowa
    n: The House's objector.
  - id: opp.who.lindsay-john-v
    s: Lindsay, John V.
    r: Representative, New York, to 1965; Mayor from 1966
    n: Also Cong.
  - id: opp.who.mcculloch-william-m
    s: McCulloch, William M.
    r: Representative, Ohio; ranking on Judiciary
    n: Held Kennedy to his word on the 1964 bill. The Whalens' book (II.D) is largely his.
  - id: opp.who.rumsfeld-donald
    s: Rumsfeld, Donald
    r: Representative, Illinois, 1963–69
    n: Organized for Ford in 1965. Also Adm.
