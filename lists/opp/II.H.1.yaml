list: opp
section: II.H.1
entries:
  - id: opp.baker-v-carr
    c: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962)'
    n: Apportionment justiciable. The start of the reapportionment decade.
  - id: opp.engel-v-vitale
    c: '*Engel v. Vitale*, [370 U.S. 421](https://tile.loc.gov/storage-services/service/ll/usrep/usrep370/usrep370421/usrep370421.pdf) (1962)'
    n: School prayer. Led to the Becker and Dirksen amendments.
  - id: opp.gray-v-sanders
    c: '*Gray v. Sanders*, [372 U.S. 368](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372368/usrep372368.pdf) (1963)'
    n: Georgia's county-unit system struck. "One person, one vote."
  - id: opp.abington-school-district-v-schempp
    c: '*Abington School District v. Schempp*, [374 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep374/usrep374203/usrep374203.pdf) (1963)'
  - id: opp.wesberry-v-sanders
    c: '*Wesberry v. Sanders*, [376 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376001/usrep376001.pdf) (1964)'
    n: Congressional districts.
  - id: opp.reynolds-v-sims
    c: '*Reynolds v. Sims*, [377 U.S. 533](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377533/usrep377533.pdf) (1964)'
    n: Both houses of a state legislature by population. Dirksen's amendment was the answer.
  - id: opp.wmca-inc-v-lomenzo
    c: '*WMCA, Inc. v. Lomenzo*, [377 U.S. 633](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377633/usrep377633.pdf) (1964)'
    n: New York.
  - id: opp.lucas-v-forty-fourth-general
    c: '*Lucas v. Forty-Fourth General Assembly*, [377 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377713/usrep377713.pdf) (1964)'
    n: Colorado voters had approved an unequal senate. Struck anyway.
  - id: opp.south-carolina-v-katzenbach
    c: '*South Carolina v. Katzenbach*, [383 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383301/usrep383301.pdf) (1966)'
    n: The Voting Rights Act upheld.
  - id: opp.mulkey-v-reitman
    c: '*Mulkey v. Reitman*, [64 Cal. 2d 529](https://static.case.law/cal-2d/64/case-pdfs/0529-01.pdf) (1966)'
    n: Proposition 14, the repeal of the Rumford fair-housing act, struck by the California Supreme Court. Reagan ran against Rumford that fall.
  - id: opp.fortson-v-morris
    c: '*Fortson v. Morris*, [385 U.S. 231](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385231/usrep385231.pdf) (1966)'
    n: Callaway won a plurality for governor of Georgia; the legislature chose Maddox. Upheld.
  - id: opp.reitman-v-mulkey
    c: '*Reitman v. Mulkey*, [387 U.S. 369](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387369/usrep387369.pdf) (1967)'
    n: Affirmed.
  - id: opp.williams-v-rhodes
    c: '*Williams v. Rhodes*, [393 U.S. 23](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393023/usrep393023.pdf) (1968)'
    n: Wallace's party on the Ohio ballot.
  - id: opp.goldwater-v-ginzburg
    c: '*Goldwater v. Ginzburg*, [414 F.2d 324](https://static.case.law/f2d/414/case-pdfs/0324-01.pdf) (2d Cir. 1969)'
    n: Goldwater's libel verdict against *Fact* magazine for its 1964 psychiatrists' poll. Upheld. The origin of the Goldwater rule.
