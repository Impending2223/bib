# Viet. II.I.1 Cases
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.I.1
entries:
  - id: vn.bond-v-floyd
    c: '*Bond v. Floyd*, 385 U.S. 116 (1966)'
    n: Bond's Georgia House seat, refused over SNCC's statement against the war. Also K–J Cong.
  - id: vn.mora-v-mcnamara
    c: '*Mora v. McNamara*, 389 U.S. 934 (1967)'
    n: Three soldiers ask whether the war is lawful. Certiorari denied; Stewart and Douglas dissent.
  - id: vn.united-states-v-obrien
    c: '*United States v. O''Brien*, 391 U.S. 367 (1968)'
    n: Draft-card burning unprotected. Also K–J Adm.
  - id: vn.oestereich-v-selective-service-system
    c: '*Oestereich v. Selective Service System Local Board No. 11*, 393 U.S. 233 (1968)'
    n: Hershey's reclassification of protesters struck down. Check.
  - id: vn.tinker-v-des-moines-independent
    c: '*Tinker v. Des Moines Independent Community School District*, 393 U.S. 503 (1969)'
    n: 'Armbands against the war, in school: protected.'
  - id: vn.welsh-v-united-states
    c: '*Welsh v. United States*, 398 U.S. 333 (1970)'
    n: Conscientious objection need not be religious.
  - id: vn.massachusetts-v-laird
    c: '*Massachusetts v. Laird*, 400 U.S. 886 (1970)'
    n: Massachusetts's statute against service in an undeclared war. Not heard; Douglas dissents.
  - id: vn.gillette-v-united-states
    c: '*Gillette v. United States*, 401 U.S. 437 (1971)'
    n: No objection to one war only.
  - id: vn.orlando-v-laird
    c: '*Orlando v. Laird*, 443 F.2d 1039 (2d Cir. 1971)'
    n: Appropriations and draft extensions authorization enough. Check.
  - id: vn.clay-v-united-states
    c: '*Clay v. United States*, 403 U.S. 698 (1971)'
    n: Ali's conviction for refusing induction reversed, unanimously.
  - id: vn.new-york-times-co-v
    c: '*New York Times Co. v. United States*, 403 U.S. 713 (1971)'
    n: The Pentagon Papers. Also Adm.
  - id: vn.holtzman-v-schlesinger
    c: '*Holtzman v. Schlesinger*, 484 F.2d 1307 (2d Cir. 1973)'
    n: The Cambodia bombing. Also Cong.
  - id: vn.calley-v-callaway
    c: '*Calley v. Callaway*, 519 F.2d 184 (5th Cir. 1975)'
    n: Habeas grant reversed en banc. Calley paroled anyway. Check the history.
  - id: vn.snepp-v-united-states
    c: '*Snepp v. United States*, 444 U.S. 507 (1980)'
    n: Prepublication agreement enforced against *Decent Interval* (II.D).
