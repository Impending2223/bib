# Viet. III.H North Vietnam and the Front
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.H
entries:
  - id: vn.who.bui-tin
    s: Bui Tin
    r: Colonel; deputy editor of the army newspaper
    n: 'Voice: memoir (II.H.3).'
  - id: vn.who.ho-chi-minh
    s: Ho Chi Minh
    r: President of the Democratic Republic of Vietnam to 1969
    n: Died Sept. 2, 1969. See II.H.3.
  - id: vn.who.le-duan
    s: Le Duan
    r: First Secretary of the Workers' Party from 1960
    n: The southerner who ran the war from Hanoi, more than Ho. See Nguyen, *Hanoi's War* (II.E).
  - id: vn.who.le-duc-tho
    s: Le Duc Tho
    r: Politburo; Hanoi's negotiator in Paris
    n: Declined the 1973 Nobel Peace Prize he shared with Kissinger. See Adm. III.J.
  - id: vn.who.nguyen-chi-thanh
    s: Nguyen Chi Thanh
    r: General; commander in the South, 1965–67
    n: Advocate of big-unit war. Died in July 1967; the plan for Tet followed.
  - id: vn.who.nguyen-huu-tho
    s: Nguyen Huu Tho
    r: Chairman, National Liberation Front
  - id: vn.who.nguyen-thi-binh
    s: Nguyen Thi Binh
    r: Foreign minister of the Provisional Revolutionary Government
    n: Signed the Paris agreement for the PRG.
  - id: vn.who.pham-van-dong
    s: Pham Van Dong
    r: Prime minister of the Democratic Republic of Vietnam
    n: His four points of April 1965.
  - id: vn.who.tran-van-tra
    s: Tran Van Tra
    r: General; commander of the B2 front
    n: 'Voice: memoir (II.H.3).'
  - id: vn.who.truong-chinh
    s: Truong Chinh
    r: Politburo; chairman of the National Assembly's standing committee
  - id: vn.who.truong-nhu-tang
    s: Truong Nhu Tang
    r: Founder of the Front; PRG minister of justice
    n: 'Voice: memoir (II.H.3).'
  - id: vn.who.van-tien-dung
    s: Van Tien Dung
    r: General; chief of the general staff
    n: 'Commanded the 1975 offensive. Voice: memoir (II.H.3).'
  - id: vn.who.vo-nguyen-giap
    s: Vo Nguyen Giap
    r: Defense minister and commander of the People's Army
    n: Dien Bien Phu. Doubted the general offensive of 1968. See II.H.3.
  - id: vn.who.xuan-thuy
    s: Xuan Thuy
    r: Head of Hanoi's delegation at the Paris talks from 1968
