# Viet. II.J Recordings and the tapes
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.J
entries:
  - id: vn.john-f-kennedy-oval-office
    c: John F. Kennedy, Oval Office recordings on Vietnam (Aug.–Nov. 1963)
    n: The coup meetings, August and October; his Nov. 4 dictation on Diem's death. Miller Center; FRUS vols. 3–4 (II.I.3). Also K–J Adm.
  - id: vn.john-f-kennedy-interview-with
    c: John F. Kennedy, interview with Walter Cronkite (CBS Sept. 2, 1963)
    n: '"In the final analysis, it is their war." Diem to change policies, perhaps personnel.'
  - id: vn.john-f-kennedy-interview-with-2
    c: John F. Kennedy, interview with Chet Huntley and David Brinkley (NBC Sept. 9, 1963)
    n: The domino theory affirmed.
  - id: vn.lyndon-b-johnson-telephone-conversations
    c: Lyndon B. Johnson, telephone conversations with McGeorge Bundy and Richard Russell (May 27, 1964)
    n: '"I don''t think it''s worth fighting for and I don''t think we can get out." In Beschloss, *Taking Charge* (K–J Adm. II.J).'
  - id: vn.lyndon-b-johnson-address-on
    c: Lyndon B. Johnson, address on the Tonkin Gulf (Aug. 4, 1964)
    n: Also K–J Adm.
  - id: vn.lyndon-b-johnson-address-at
    c: Lyndon B. Johnson, address at Johns Hopkins University (Apr. 7, 1965)
    n: Also K–J Adm.
  - id: vn.lyndon-b-johnson-press-conference
    c: Lyndon B. Johnson, press conference (July 28, 1965)
    n: Also K–J Adm.
  - id: vn.morley-safer-report-from-cam
    c: Morley Safer, report from Cam Ne (CBS Aug. 5, 1965)
    n: Marines burn huts with Zippo lighters. Johnson calls Stanton the next morning.
  - id: vn.j-william-fulbright-hearings-on
    c: J. William Fulbright, hearings on Vietnam, Senate Foreign Relations Committee (Feb. 1966)
    n: 'Televised. Kennan and Gavin against; Rusk and Taylor for. Kennan: K–J Cong. II.K.'
  - id: vn.martin-luther-king-jr-beyond
    c: Martin Luther King Jr., Beyond Vietnam, Riverside Church (Apr. 4, 1967)
    n: Also K–J Cong.
  - id: vn.walter-cronkite-report-from-vietnam
    c: 'Walter Cronkite, Report from Vietnam: Who, What, When, Where, Why? (CBS Feb. 27, 1968)'
    n: '"Mired in stalemate." Johnson''s "If I''ve lost Cronkite" rests on later recollection.'
  - id: vn.lyndon-b-johnson-address-to
    c: Lyndon B. Johnson, address to the nation (Mar. 31, 1968)
    n: Also K–J Adm.
  - id: vn.richard-m-nixon-address-on
    c: Richard M. Nixon, address on Vietnam (Nov. 3, 1969)
    n: Also Adm.
  - id: vn.richard-m-nixon-address-on-2
    c: Richard M. Nixon, address on Cambodia (Apr. 30, 1970)
    n: Also Adm.
  - id: vn.winter-soldier-investigation-detroit-jan
    c: Winter Soldier Investigation, Detroit (Jan. 31–Feb. 2, 1971)
    n: 'Veterans on atrocities; VVAW. Film: *Winter Soldier* (1972).'
  - id: vn.richard-m-nixon-white-house
    c: Richard M. Nixon, White House tapes on Vietnam (1971–73)
    n: 'Hughes, *Fatal Politics* (Adm. II.B): the decent interval. Audio at the Nixon Library and the Miller Center.'
  - id: vn.john-kerry-testimony-senate-foreign
    c: John Kerry, testimony, Senate Foreign Relations Committee (Apr. 22, 1971)
    n: Also Cong.
  - id: vn.richard-m-nixon-address-on-3
    c: Richard M. Nixon, address on Vietnam and the Paris agreement (Jan. 23, 1973)
    n: Also Adm.
  - id: vn.gerald-r-ford-address-at
    c: Gerald R. Ford, address at Tulane University (Apr. 23, 1975)
    n: '"A war that is finished as far as America is concerned."'
