# Viet. III.D The military command
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.D
entries:
  - id: vn.who.abrams-creighton-w
    s: Abrams, Creighton W.
    r: Deputy commander, MACV, 1967–68; commander, 1968–72
    n: See the 1968 list III.G; Adm. III.E.
  - id: vn.who.calley-william-l-jr
    s: Calley, William L., Jr.
    r: Platoon leader, Company C, 1st Battalion, 20th Infantry, Americal Division
    n: My Lai, Mar. 16, 1968. Convicted of murder Mar. 29, 1971; served about three and a half years, mostly under house arrest.
  - id: vn.who.denton-jeremiah-a-jr
    s: Denton, Jeremiah A., Jr.
    r: Navy pilot; prisoner, 1965–73
    n: Blinked TORTURE in Morse code during a filmed interview in Hanoi, May 1966.
  - id: vn.who.felt-harry-d
    s: Felt, Harry D.
    r: Commander in Chief, Pacific, 1958–64
  - id: vn.who.harkins-paul-d
    s: Harkins, Paul D.
    r: Commander, MACV, 1962–64
    n: The optimist. Reported Ap Bac a victory. See K–J Adm. III.F.
  - id: vn.who.krulak-victor-h
    s: Krulak, Victor H.
    r: Special assistant for counterinsurgency to the Joint Chiefs, 1962–64; commander, Fleet Marine Force Pacific, 1964–68
    n: 'Voice: memoir (II.H.2).'
  - id: vn.who.mcgarr-lionel-c
    s: McGarr, Lionel C.
    r: Chief, Military Assistance Advisory Group, Vietnam, 1960–62
  - id: vn.who.moore-harold-g
    s: Moore, Harold G.
    r: Commander, 1st Battalion, 7th Cavalry
    n: 'Ia Drang, Nov. 14–16, 1965. Voice: Moore & Galloway (II.C).'
  - id: vn.who.peers-william-r
    s: Peers, William R.
    r: Lieutenant general; head of the My Lai inquiry, 1969–70
    n: See II.I.3.
  - id: vn.who.sharp-u-s-grant
    s: Sharp, U.S. Grant
    r: Commander in Chief, Pacific, 1964–68
    n: Pressed for heavier bombing. See the 1968 list III.G.
  - id: vn.who.stockdale-james-b
    s: Stockdale, James B.
    r: Navy pilot over the Tonkin Gulf, 1964; prisoner, 1965–73
    n: 'Voice: memoir (II.H.2).'
  - id: vn.who.thompson-hugh-jr
    s: Thompson, Hugh, Jr.
    r: Army helicopter pilot
    n: Landed between the soldiers and the villagers at My Lai and took survivors out.
  - id: vn.who.walt-lewis-w
    s: Walt, Lewis W.
    r: Commander, III Marine Amphibious Force, 1965–67
    n: The combined action platoons.
  - id: vn.who.westmoreland-william-c
    s: Westmoreland, William C.
    r: Commander, MACV, 1964–68
    n: 'Attrition and the body count. Told the National Press Club in November 1967 that the end was coming into view. Voice: memoir (II.H.2).'
  - id: vn.who.weyand-frederick-c
    s: Weyand, Frederick C.
    r: Last commander, MACV, 1972–73; Army Chief of Staff, 1974–76
    n: Sent to Saigon in March 1975 to report on what aid could do.
