# Viet. I.C Reportage
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: I.C
entries:
  - id: vn.fall-street-without-joy
    c: Bernard B. Fall, *Street Without Joy* (1961)
    n: The French war, by the scholar who walked it. Later editions extend the subtitle. Fall killed on the same road, February 1967.
  - id: vn.warner-last-confucian
    c: Denis Warner, *The Last Confucian* (1963)
    n: Diem's Vietnam, by an Australian correspondent.
  - id: vn.browne-new-face-of
    c: Malcolm W. Browne, *The New Face of War* (1965)
    n: By the AP man who photographed Thich Quang Duc.
  - id: vn.halberstam-making-of-a
    c: David Halberstam, *The Making of a Quagmire* (1965)
    n: Saigon, 1962–63, from the *Times* bureau. Harkins against the Delta advisers; Ap Bac; the Buddhists.
  - id: vn.higgins-our-vietnam-nightmare
    c: Marguerite Higgins, *Our Vietnam Nightmare* (1965)
    n: For Diem, against the young correspondents. By the *Herald Tribune*'s veteran.
  - id: vn.schell-village-of-ben
    c: Jonathan Schell, *The Village of Ben Suc* (1967)
    n: One village emptied and razed, Operation Cedar Falls, January 1967. First in *The New Yorker*.
  - id: vn.mccarthy-vietnam
    c: Mary McCarthy, *Vietnam* (1967)
    n: Followed by *Hanoi* (1968).
  - id: vn.salisbury-behind-the-lines
    c: Harrison E. Salisbury, *Behind the Lines—Hanoi, December 23, 1966–January 7, 1967* (1967)
    n: The bombing seen from the North. His *Times* dispatches contradicted the Pentagon on civilian damage.
  - id: vn.just-to-what-end
    c: 'Ward Just, *To What End: Report from Vietnam* (1968)'
    n: By the *Washington Post*'s correspondent, 1965–67.
  - id: vn.schell-military-half-an
    c: 'Jonathan Schell, *The Military Half: An Account of Destruction in Quang Ngai and Quang Tin* (1968)'
  - id: vn.arlen-living-room-war
    c: Michael J. Arlen, *Living-Room War* (1969)
    n: Television's war, reviewed weekly in *The New Yorker*.
  - id: vn.lang-casualties-of-war
    c: Daniel Lang, *Casualties of War* (1969)
    n: Source of the film (I.B).
  - id: vn.hersh-my-lai-4
    c: 'Seymour M. Hersh, *My Lai 4: A Report on the Massacre and Its Aftermath* (1970)'
    n: 'The November 1969 dispatches. Sequel: *Cover-Up* (II.D).'
  - id: vn.fitzgerald-fire-in-the
    c: 'Frances FitzGerald, *Fire in the Lake: The Vietnamese and the Americans in Vietnam* (1972)'
    n: The war as a collision of societies. Pulitzer Prize; National Book Award.
  - id: vn.emerson-winners-and-losers
    c: 'Gloria Emerson, *Winners and Losers: Battles, Retreats, Gains, Losses, and Ruins from the Vietnam War* (1976)'
    n: By the *Times* correspondent of 1970–72. National Book Award.
  - id: vn.herr-dispatches
    c: Michael Herr, *Dispatches* (1977)
    n: Khe Sanh, Hue, and the press corps, 1967–68. Mostly first in *Esquire*.
  - id: vn.arnett-live-from-the
    c: Peter Arnett, *Live from the Battlefield* (1994)
    n: 'AP, 1962 to the end. Ben Tre, February 1968: "It became necessary to destroy the town to save it."'
  - id: vn.reporting-vietnam-american-journalism-1959
    c: '*Reporting Vietnam: American Journalism, 1959–1975* (Library of America, 2 vols., 1998)'
    n: The dispatches, selected. Start here.
