# Viet. III.B Washington, 1969–1975
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.B
entries:
  - id: vn.who.ford-gerald-r
    s: Ford, Gerald R.
    r: President, 1974–77
    n: Asked Congress for $722 million for Saigon in April 1975 and was refused.
  - id: vn.who.haig-alexander-m-jr
    s: Haig, Alexander M., Jr.
    r: Kissinger's deputy, 1970–73
    n: Carried Nixon's letters and pledges to Thieu in November 1972 and January 1973.
  - id: vn.who.kissinger-henry-a
    s: Kissinger, Henry A.
    r: Assistant for national security affairs, 1969–75; Secretary of State, 1973–77
    n: The secret talks with Le Duc Tho from February 1970. See Adm. III.D.
  - id: vn.who.laird-melvin-r
    s: Laird, Melvin R.
    r: Secretary of Defense, 1969–73
    n: Named Vietnamization and pressed the withdrawals. See Adm. III.E.
  - id: vn.who.lord-winston
    s: Lord, Winston
    r: NSC staff
    n: Kissinger's aide at the Paris talks. See Adm. III.D.
  - id: vn.who.nixon-richard-m
    s: Nixon, Richard M.
    r: President, 1969–74
    n: See Adm. II.B.
  - id: vn.who.rogers-william-p
    s: Rogers, William P.
    r: Secretary of State, 1969–73
    n: Kept out of the secret talks. See Adm. III.D.
  - id: vn.who.schlesinger-james-r
    s: Schlesinger, James R.
    r: Secretary of Defense, 1973–75
