# Viet. II.K Archives
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.K
entries:
  - id: vn.center-of-military-history-u
    c: Center of Military History, U.S. Army [history.army.mil](https://history.army.mil)
    n: The Army's official histories (II.I.3), free to read. The Air Force, Navy, and Marine Corps historical offices publish theirs.
  - id: vn.cia-foia-electronic-reading-room
    c: CIA FOIA Electronic Reading Room [cia.gov/readingroom](https://www.cia.gov/readingroom)
    n: Estimates, the Ahern histories, Ford's *Three Episodes*. Searchable.
  - id: vn.gerald-r-ford-presidential-library
    c: Gerald R. Ford Presidential Library, Ann Arbor
    n: The evacuation of April 1975 and the last aid requests.
  - id: vn.john-f-kennedy-presidential-library
    c: John F. Kennedy Presidential Library, Boston [jfklibrary.org](https://www.jfklibrary.org)
    n: The National Security Files for Vietnam, 1961–63, and the Hilsman and Forrestal papers. Also K–J Adm.
  - id: vn.lbj-presidential-library-austin
    c: LBJ Presidential Library, Austin
    n: The NSF country file for Vietnam, the meeting notes, the telephone calls. Also K–J Adm.
  - id: vn.library-of-congress-veterans-history
    c: Library of Congress, Veterans History Project [loc.gov/vets](https://www.loc.gov/vets)
    n: Oral histories and letters. Thousands for Vietnam.
  - id: vn.national-archives-college-park
    c: National Archives, College Park
    n: Record Group 472 (U.S. Forces in Southeast Asia) for MACV and the units; RG 59 for State; the Vietnam War casualty files. Check the record groups.
  - id: vn.national-archives-pentagon-papers-archives
    c: 'National Archives: Pentagon Papers [archives.gov/research/pentagon-papers](https://www.archives.gov/research/pentagon-papers)'
    n: The whole study as released in 2011, as PDFs.
  - id: vn.national-security-archive-nsarchive-gwu
    c: National Security Archive [nsarchive.gwu.edu](https://nsarchive.gwu.edu)
    n: Electronic briefing books on Tonkin, the Diem coup, and the Paris talks. Also K–J Adm.
  - id: vn.office-of-the-historian-u
    c: Office of the Historian, U.S. Department of State [history.state.gov](https://history.state.gov)
    n: FRUS (II.I.3), searchable. Also K–J Adm.
  - id: vn.richard-nixon-presidential-library-yorba
    c: Richard Nixon Presidential Library, Yorba Linda
    n: The NSC files and the tapes.
  - id: vn.swarthmore-college-peace-collection
    c: Swarthmore College Peace Collection
    n: The records of the antiwar organizations, the Mobilization committees among them.
  - id: vn.trung-tam-luu-tru-quoc
    c: Trung tâm Lưu trữ Quốc gia II and III (Vietnam National Archives Centres II and III)
    n: Centre II in Ho Chi Minh City holds the Republic of Vietnam's records; Centre III in Hanoi the Democratic Republic's state records. Party and army archives are separate and mostly closed. Miller and Asselin (II.B) describe access.
  - id: vn.vietnam-center-and-sam-johnson
    c: Vietnam Center and Sam Johnson Vietnam Archive, Texas Tech University [vva.vietnam.ttu.edu](https://vva.vietnam.ttu.edu)
    n: The Virtual Vietnam Archive. Douglas Pike's collection, captured documents, unit records, and the oral history project. The largest single collection, mostly online.
  - id: vn.wilson-center-digital-archive-digitalarchive
    c: Wilson Center Digital Archive [digitalarchive.wilsoncenter.org](https://digitalarchive.wilsoncenter.org)
    n: Translations from the Chinese, Soviet, East European, and Vietnamese archives. Also K–J Adm.
