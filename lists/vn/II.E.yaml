section: II.E
entries:
  - id: vn.pike-viet-cong-the
    c: 'Douglas Pike, *Viet Cong: The Organization and Techniques of the National Liberation Front of South Vietnam* (1966)'
    n: By the USIA's specialist, from captured documents and defectors. The Front as the northern Party's instrument; Hanoi's later histories (*Victory in Vietnam*, this section) say the same.
  - id: vn.race-war-comes-to
    c: 'Jeffrey Race, *War Comes to Long An: Revolutionary Conflict in a Vietnamese Province* (1972)'
    n: 'Long An, 1954–65: the Party''s organization against the government''s. Interviews with both sides, defectors among them.'
  - id: vn.khanh-vietnamese-communism-1925
    c: Huynh Kim Khanh, *Vietnamese Communism, 1925–1945* (1982)
  - id: vn.thayer-war-by-other
    c: 'Carlyle A. Thayer, *War by Other Means: National Liberation and Revolution in Viet-Nam, 1954–60* (1989)'
  - id: vn.brigham-guerrilla-diplomacy-the
    c: 'Robert K. Brigham, *Guerrilla Diplomacy: The NLF''s Foreign Relations and the Viet Nam War* (1999)'
  - id: vn.topmiller-lotus-unleashed-the
    c: 'Robert Topmiller, *The Lotus Unleashed: The Buddhist Peace Movement in South Vietnam, 1964–1966* (2002)'
  - id: vn.vietnam-victory-in-vietnam
    c: 'Military History Institute of Vietnam, *Victory in Vietnam: The Official History of the People''s Army of Vietnam, 1954–1975* (Merle L. Pribbenow trans., 2002)'
    n: Hanoi's official history, translated whole by Merle Pribbenow. The Party's account and figures.
  - id: vn.guan-vietnam-war-from
    c: 'Ang Cheng Guan, *The Vietnam War from the Other Side: The Vietnamese Communists'' Perspective* (2002)'
  - id: vn.elliott-vietnamese-war-revolution
    c: 'David W.P. Elliott, *The Vietnamese War: Revolution and Social Change in the Mekong Delta, 1930–1975* (2 vols., 2003)'
    n: The RAND interviews, Dinh Tuong province. The revolution's gains and losses there, year by year, from its own cadres. Two volumes; abridged 2007.
  - id: vn.brigham-arvn-life-and
    c: 'Robert K. Brigham, *ARVN: Life and Death in the South Vietnamese Army* (2006)'
  - id: vn.wiest-vietnams-forgotten-army
    c: 'Andrew Wiest, *Vietnam''s Forgotten Army: Heroism and Betrayal in the ARVN* (2008)'
    n: 'Two officers, one class: one stayed, one went over.'
  - id: vn.nguyen-hanois-war-an
    c: 'Lien-Hang T. Nguyen, *Hanoi''s War: An International History of the War for Peace in Vietnam* (2012)'
    n: Le Duan, Le Duc Tho, and the decisions for the 1968 and 1972 offensives. Also Adm.
  - id: vn.vu-vietnams-communist-revolution
    c: 'Tuong Vu, *Vietnam''s Communist Revolution: The Power and Limits of Ideology* (2017)'
  - id: vn.veith-drawn-swords-in
    c: 'George J. Veith, *Drawn Swords in a Distant Land: South Vietnam''s Shattered Dreams* (2021)'
