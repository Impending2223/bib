entries:
  - id: vn.who.adams-eddie
    s: Adams, Eddie
    r: AP photographer
    n: Loan shooting a prisoner, Nguyen Van Lem, a Front officer, Saigon, Feb. 1, 1968. Pulitzer Prize.
  - id: vn.who.arnett-peter
    s: Arnett, Peter
    r: AP, 1962–75
    n: 'Voice: memoir (I.C).'
  - id: vn.who.bigart-homer
    s: Bigart, Homer
    r: New York Times, Saigon, 1962
    n: '"Sink or swim with Ngo Dinh Diem."'
  - id: vn.who.browne-malcolm-w
    s: Browne, Malcolm W.
    r: AP bureau chief, Saigon, 1961–65
    n: 'Photographed Thich Quang Duc, June 11, 1963. Voice: I.C.'
  - id: vn.who.fall-bernard-b
    s: Fall, Bernard B.
    r: Historian and correspondent
    n: Killed by a mine with the Marines near Hue, Feb. 21, 1967. See I.C; II.A.
  - id: vn.who.faas-horst
    s: Faas, Horst
    r: AP photographer and photo editor, Saigon, 1962–74
  - id: vn.who.halberstam-david
    s: Halberstam, David
    r: New York Times, Saigon, 1962–63
    n: 'Kennedy asked the *Times* to move him; refused. Voice: I.C; *The Best and the Brightest* (K–J Adm. II.D).'
  - id: vn.who.herr-michael
    s: Herr, Michael
    r: Esquire, 1967–68
    n: 'Voice: *Dispatches* (I.C).'
  - id: vn.who.hersh-seymour-m
    s: Hersh, Seymour M.
    r: Dispatch News Service
    n: My Lai, November 1969. See Cong. III.M.
  - id: vn.who.higgins-marguerite
    s: Higgins, Marguerite
    r: New York Herald Tribune
    n: 'Diem''s defender against the Saigon press corps, 1963. Voice: I.C.'
  - id: vn.who.mohr-charles
    s: Mohr, Charles
    r: Time, Saigon
    n: Resigned, 1963, when *Time*'s editors attacked the Saigon correspondents.
  - id: vn.who.pham-xuan-an
    s: Pham Xuan An
    r: Reuters, then Time, Saigon
    n: 'Sources everywhere in Saigon; a communist agent throughout. Larry Berman, *Perfect Spy: The Incredible Double Life of Pham Xuan An* (2007).'
  - id: vn.who.safer-morley
    s: Safer, Morley
    r: CBS
    n: Cam Ne, Aug. 5, 1965 (II.J).
  - id: vn.who.salisbury-harrison-e
    s: Salisbury, Harrison E.
    r: New York Times
    n: 'Hanoi, December 1966. Voice: I.C.'
  - id: vn.who.sheehan-neil
    s: Sheehan, Neil
    r: UPI, Saigon, 1962–64; New York Times
    n: 'Voice: *A Bright Shining Lie* (II.B.10). See Cong. III.M.'
  - id: vn.who.sully-francois
    s: Sully, François
    r: Newsweek, Saigon
    n: Expelled by Diem, September 1962. Killed in a helicopter crash, 1971.
  - id: vn.who.ut-nick
    s: Ut, Nick
    r: AP photographer
    n: The napalmed girl, Trang Bang, June 8, 1972. Pulitzer Prize.
