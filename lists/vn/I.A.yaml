# Viet. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: I.A
entries:
  - id: vn.greene-quiet-american
    c: Graham Greene, *The Quiet American* (1955)
    n: Saigon, 1951–52. Pyle, the American with a theory of a Third Force; Fowler, the English reporter. Lansdale taken for Pyle; Greene denied it.
  - id: vn.lederer-ugly-american
    c: William J. Lederer & Eugene Burdick, *The Ugly American* (1958)
    n: Sarkhan is invented; read for Vietnam. Also K–J Adm.
  - id: vn.larteguy-les-centurions
    c: Jean Lartéguy, *Les Centurions* (1960)
    n: French paratroopers, Dien Bien Phu to Algeria. Translated as *The Centurions* (1962). Check. Read by American officers for revolutionary war.
  - id: vn.west-ambassador
    c: Morris L. West, *The Ambassador* (1965)
    n: An ambassador in Saigon, a Catholic president, a coup permitted. Lodge and Diem.
  - id: vn.moore-green-berets
    c: Robin Moore, *The Green Berets* (1965)
    n: Moore's months with Special Forces, as fiction. Source of the 1968 film (I.B).
  - id: vn.halberstam-one-very-hot
    c: David Halberstam, *One Very Hot Day* (1967)
    n: 'One Delta patrol, 1963: an American adviser and his ARVN unit. By the author of *The Making of a Quagmire* (I.C).'
  - id: vn.mailer-why-are-we
    c: Norman Mailer, *Why Are We in Vietnam?* (1967)
    n: A bear hunt in Alaska. The war arrives in the last line.
  - id: vn.mccarry-tears-of-autumn
    c: Charles McCarry, *The Tears of Autumn* (1974)
    n: Dallas traced to the Diem coup. Also K–J Adm.
  - id: vn.stone-dog-soldiers
    c: Robert Stone, *Dog Soldiers* (1974)
    n: Heroin from Saigon to California. National Book Award.
  - id: vn.heinemann-close-quarters
    c: Larry Heinemann, *Close Quarters* (1977)
  - id: vn.carre-honourable-schoolboy
    c: John le Carré, *The Honourable Schoolboy* (1977)
    n: Hong Kong, Laos, Phnom Penh under siege, 1974–75.
  - id: vn.webb-fields-of-fire
    c: James Webb, *Fields of Fire* (1978)
    n: A Marine platoon, An Hoa basin, 1969. Webb later Navy Secretary.
  - id: vn.obrien-going-after-cacciato
    c: Tim O'Brien, *Going After Cacciato* (1978)
    n: A soldier walks away from the war toward Paris. National Book Award.
  - id: vn.hasford-short-timers
    c: Gustav Hasford, *The Short-Timers* (1979)
    n: Parris Island and Hue. Source of *Full Metal Jacket* (I.B).
  - id: vn.vecchio-13th-valley
    c: John M. Del Vecchio, *The 13th Valley* (1982)
  - id: vn.wright-meditations-in-green
    c: Stephen Wright, *Meditations in Green* (1983)
  - id: vn.mason-in-country
    c: Bobbie Ann Mason, *In Country* (1985)
    n: Kentucky, 1984. A girl whose father died in the war; her uncle who came back.
  - id: vn.heinemann-pacos-story
    c: Larry Heinemann, *Paco's Story* (1986)
    n: A firebase's lone survivor, afterward, in a small town. National Book Award.
  - id: vn.obrien-things-they-carried
    c: Tim O'Brien, *The Things They Carried* (1990)
  - id: vn.ninh-noi-buon-chien
    c: Bảo Ninh, *Nỗi buồn chiến tranh* (1990)
    n: The war from the North, by a veteran of the 27th Youth Brigade. First published under another title. Translated as *The Sorrow of War* (1993). Check the dates.
  - id: vn.huong-tieu-thuyet-vo
    c: Dương Thu Hương, *Tiểu thuyết vô đề* (1991)
    n: A northern soldier's ten years in the South. Banned in Vietnam. Translated as *Novel Without a Name* (1995). Check the date of the original.
  - id: vn.butler-good-scent-from
    c: Robert Olen Butler, *A Good Scent from a Strange Mountain* (1992)
    n: Stories of Vietnamese in Louisiana. Pulitzer Prize.
  - id: vn.obrien-in-the-lake
    c: Tim O'Brien, *In the Lake of the Woods* (1994)
    n: A Minnesota politician's part at My Lai comes out in a primary.
  - id: vn.johnson-tree-of-smoke
    c: Denis Johnson, *Tree of Smoke* (2007)
    n: CIA psychological operations, 1963–70. National Book Award.
  - id: vn.marlantes-matterhorn
    c: Karl Marlantes, *Matterhorn* (2010)
    n: A Marine company on a hilltop near the DMZ, 1969.
  - id: vn.nguyen-sympathizer
    c: Viet Thanh Nguyen, *The Sympathizer* (2015)
    n: A communist agent on a southern general's staff, Saigon to Los Angeles. Pulitzer Prize.
