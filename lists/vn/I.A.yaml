  - id: vn.webb-fields-of-fire
    c: James Webb, *Fields of Fire* (1978)
    n: A Marine platoon, An Hòa, 1969. Webb later Navy Secretary.
  - id: vn.obrien-going-after-cacciato
    c: Tim O'Brien, *Going After Cacciato* (1978)
    n: A deserter walks toward Paris.
  - id: vn.hasford-short-timers
    c: Gustav Hasford, *The Short-Timers* (1979)
    n: Parris Island and Huế. Source of *Full Metal Jacket* (I.B).
  - id: vn.vecchio-13th-valley
    c: John M. Del Vecchio, *The 13th Valley* (1982)
  - id: vn.wright-meditations-in-green
    c: Stephen Wright, *Meditations in Green* (1983)
  - id: vn.mason-in-country
    c: Bobbie Ann Mason, *In Country* (1985)
    n: Kentucky, 1984. A dead soldier's daughter.
  - id: vn.heinemann-pacos-story
    c: Larry Heinemann, *Paco's Story* (1986)
    n: A firebase's lone survivor, afterward.
  - id: vn.obrien-things-they-carried
    c: Tim O'Brien, *The Things They Carried* (1990)
  - id: vn.ninh-noi-buon-chien
    c: Bảo Ninh, *Nỗi buồn chiến tranh* (1990)
    n: The war from the North. Translated as *The Sorrow of War* (1993).
  - id: vn.huong-tieu-thuyet-vo
    c: Dương Thu Hương, *Tiểu thuyết vô đề* (1991)
    n: Banned in Vietnam. Translated as *Novel Without a Name* (1995).
  - id: vn.butler-good-scent-from
