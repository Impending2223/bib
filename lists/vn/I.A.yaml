# Viet. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: I.A
entries:
  - id: vn.greene-quiet-american
    c: Graham Greene, *The Quiet American* (1955)
    n: Lansdale taken for Pyle; Greene denied it.
