# Viet. I.B Stage, film, and television
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: I.B
entries:
  - id: vn.the-quiet-american
    c: '*The Quiet American* (Joseph L. Mankiewicz dir., 1958)'
    n: Greene's story turned around, the American made the hero. Lansdale advised. Audie Murphy.
  - id: vn.the-ugly-american
    c: '*The Ugly American* (George Englund dir., 1963)'
    n: Marlon Brando as the ambassador to Sarkhan.
  - id: vn.la-317e-section
    c: '*La 317e Section* (Pierre Schoendoerffer dir., 1965)'
    n: A French platoon's retreat in 1954, filmed by a veteran of Dien Bien Phu. Released in English as *The 317th Platoon*.
  - id: vn.the-anderson-platoon
    c: '*The Anderson Platoon* (Pierre Schoendoerffer dir., 1967)'
    n: Six weeks with a platoon of the 1st Cavalry Division under Lieutenant Joseph Anderson. Shown on CBS; Academy Award for documentary. Check the year of the award.
  - id: vn.in-the-year-of-the
    c: '*In the Year of the Pig* (Emile de Antonio dir., 1968)'
    n: The case against the war, from newsreel and interviews.
  - id: vn.the-green-berets
    c: '*The Green Berets* (John Wayne & Ray Kellogg dirs., 1968)'
    n: Made with the Pentagon's help, at Fort Benning. The war's only Hollywood endorsement while it lasted.
  - id: vn.rabe-sticks-and-bones
    c: David Rabe, *Sticks and Bones* (1971)
    n: A blinded veteran comes home to a television family. Tony Award.
  - id: vn.hearts-and-minds
    c: '*Hearts and Minds* (Peter Davis dir., 1974)'
    n: Westmoreland's "The Oriental doesn't put the same high price on life." Academy Award for documentary.
  - id: vn.rabe-streamers
    c: David Rabe, *Streamers* (1976)
    n: An army barracks in Virginia, 1965, the men waiting for orders.
  - id: vn.coming-home
    c: '*Coming Home* (Hal Ashby dir., 1978)'
    n: Jon Voight and Jane Fonda. The veterans' hospital.
  - id: vn.the-deer-hunter
    c: '*The Deer Hunter* (Michael Cimino dir., 1978)'
  - id: vn.apocalypse-now
    c: '*Apocalypse Now* (Francis Ford Coppola dir., 1979)'
    n: Conrad's *Heart of Darkness* moved up the river into Cambodia. Script by John Milius; narration by Michael Herr.
  - id: vn.vietnam-a-television-history
    c: '*Vietnam: A Television History* (WGBH/PBS 1983)'
    n: Thirteen hours, with interviews on every side. Karnow's book (II.A) is the companion.
  - id: vn.platoon
    c: '*Platoon* (Oliver Stone dir., 1986)'
    n: Stone served in the 25th Infantry Division in 1967–68.
  - id: vn.full-metal-jacket
    c: '*Full Metal Jacket* (Stanley Kubrick dir., 1987)'
    n: From Hasford (I.A). Hue built in London's Docklands.
  - id: vn.hamburger-hill
    c: '*Hamburger Hill* (John Irvin dir., 1987)'
    n: The 101st Airborne at Ap Bia, May 1969.
  - id: vn.good-morning-vietnam
    c: '*Good Morning, Vietnam* (Barry Levinson dir., 1987)'
    n: Armed Forces Radio in Saigon, 1965.
  - id: vn.born-on-the-fourth-of
    c: '*Born on the Fourth of July* (Oliver Stone dir., 1989)'
    n: From Kovic (II.H.2).
  - id: vn.casualties-of-war
    c: '*Casualties of War* (Brian De Palma dir., 1989)'
    n: From Daniel Lang's *New Yorker* account (1969) of a squad's kidnapping and murder of a village girl in 1966.
  - id: vn.boublil-miss-saigon
    c: Alain Boublil & Claude-Michel Schönberg, *Miss Saigon* (1989)
    n: '*Madama Butterfly* moved to April 1975. London, then Broadway in 1991.'
  - id: vn.a-bright-shining-lie
    c: '*A Bright Shining Lie* (Terry George dir., HBO 1998)'
    n: From Sheehan (II.A). Bill Paxton as Vann.
  - id: vn.path-to-war
    c: '*Path to War* (John Frankenheimer dir., HBO 2002)'
    n: Johnson from the 1964 election to March 1968. Michael Gambon as Johnson, Alec Baldwin as McNamara, Donald Sutherland as Clifford.
  - id: vn.the-quiet-american-2
    c: '*The Quiet American* (Phillip Noyce dir., 2002)'
    n: Michael Caine and Brendan Fraser. Closer to Greene.
  - id: vn.we-were-soldiers
    c: '*We Were Soldiers* (Randall Wallace dir., 2002)'
    n: Ia Drang, from Moore & Galloway (II.C).
  - id: vn.the-fog-of-war
    c: '*The Fog of War* (Errol Morris dir., 2003)'
    n: McNamara on camera, with the tapes. Also K–J Adm.
  - id: vn.last-days-in-vietnam
    c: '*Last Days in Vietnam* (Rory Kennedy dir., 2014)'
    n: The evacuation of April 1975, with the Americans who ran it and the Vietnamese who got out or did not.
  - id: vn.the-vietnam-war
    c: '*The Vietnam War* (Ken Burns & Lynn Novick dirs., PBS 2017)'
    n: Ten episodes, eighteen hours. The companion book is Ward & Burns (II.A).
  - id: vn.da-5-bloods
    c: '*Da 5 Bloods* (Spike Lee dir., 2020)'
    n: Four Black veterans go back for a friend's remains and buried gold.
  - id: vn.the-sympathizer
    c: '*The Sympathizer* (HBO 2024)'
    n: From Nguyen (I.A). Park Chan-wook directed the first episodes.
