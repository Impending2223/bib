# Viet.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Vietnam, 1945–1975: Bibliography'
h1: 'Vietnam and the American war, 1945–1975: working bibliography'
lede: 'Sources, portrayals, and names for the war in Vietnam, the French war to the fall of Saigon. Weighted to the American years: the decisions, the field, the Vietnamese on every side, the war at home.'
logic:
  - 'Ninth list in the series. This one is Viet. The war and its historiography. The decisions stay where they were: K–J Adm. II.D and II.H for Kennedy and Johnson; Adm. II.B for Nixon; the Senate in K–J Cong. II.D; war powers in Cong. II.C; March 1968 in the 1968 list. The calendar (Cal.) dates the Kennedy years. Cross-references give list and section. Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.'
  - Overlaps. A book about the war is listed here even when another list holds it, marked "Also K–J Adm." or the like. A book that only touches the war is cited from its own list.
  - 'Vietnamese names. Family name first, and alphabetized so: Ngô Đình Diệm under N. In the text, Diệm, Thiệu, Kỳ, Giáp, as Americans called them. Diacritics throughout, except where a quotation, a title, or a byline prints none. Saigon, Hanoi, Haiphong, Vietnam, Viet Cong, Viet Minh, the Ho Chi Minh Trail, as English writes them.'
