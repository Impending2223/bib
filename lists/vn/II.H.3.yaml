# Viet. II.H.3 Vietnamese
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.H.3
entries:
  - id: vn.bui-diem
    s: Bui Diem
    c: Bui Diem & David Chanoff, *In the Jaws of History* (1987)
    n: Ambassador in Washington, 1967–72. Also in the 1968 list for the Chennault affair.
  - id: vn.bui-tin
    s: Bui Tin
    c: '*Following Ho Chi Minh: The Memoirs of a North Vietnamese Colonel* (1995)'
    n: The army newspaper's editor, present at the palace on Apr. 30, 1975. Later in exile in Paris.
  - id: vn.duong-van-mai-elliott
    s: Duong Van Mai Elliott
    c: '*The Sacred Willow: Four Generations in the Life of a Vietnamese Family* (1999)'
    n: A family divided between Hanoi and Saigon. She worked on the RAND interviews (Elliott, II.E).
  - id: vn.ho-chi-minh
    s: Ho Chi Minh
    c: William J. Duiker, *Ho Chi Minh* (2000)
    n: 'The standard life. Jean Lacouture''s *Ho Chi Minh* (1967) was the one Americans read during the war; Pierre Brocheux''s (2003; English 2007) is shorter; Sophie Quinn-Judge''s *Ho Chi Minh: The Missing Years, 1919–1941* (2002) covers the Comintern years.'
  - id: vn.le-ly-hayslip
    s: Le Ly Hayslip
    c: 'Le Ly Hayslip & Jay Wurts, *When Heaven and Earth Changed Places: A Vietnamese Woman''s Journey from War to Peace* (1989)'
    n: A peasant girl in Quang Nam caught between the Front and the government. Oliver Stone's *Heaven & Earth* (1993).
  - id: vn.ngo-dinh-diem
    s: Ngo Dinh Diem
    c: See Jacobs and Miller in II.B.
  - id: vn.nguyen-cao-ky
    s: Nguyen Cao Ky
    c: '*Twenty Years and Twenty Days* (1976)'
    n: 'Later, with Marvin J. Wolf, *Buddha''s Child: My Fight to Save Vietnam* (2002).'
  - id: vn.nguyen-van-thieu
    s: Nguyen Van Thieu
    c: See Hung & Schecter, *The Palace File* (Adm. II.B).
  - id: vn.thich-nhat-hanh
    s: Thich Nhat Hanh
    c: '*Vietnam: Lotus in a Sea of Fire* (1967)'
    n: The Buddhist case for peace, written for Americans.
  - id: vn.tran-le-xuan-madame-nhu
    s: Tran Le Xuan (Madame Nhu)
    c: 'Monique Brinson Demery, *Finding the Dragon Lady: The Mystery of Vietnam''s Madame Nhu* (2013)'
  - id: vn.tran-van-don
    s: Tran Van Don
    c: '*Our Endless War: Inside Vietnam* (1978)'
    n: One of the generals of November 1963, on the coup.
  - id: vn.tran-van-tra
    s: Tran Van Tra
    c: '*Vietnam: History of the Bulwark B2 Theatre*, vol. 5, *Concluding the 30-Years War* (1982)'
    n: By the southern commander. Withdrawn in Hanoi for its account of 1968 and 1975; translated by the Foreign Broadcast Information Service. Check the date of the translation.
  - id: vn.truong-nhu-tang
    s: Truong Nhu Tang
    c: Truong Nhu Tang, David Chanoff & Doan Van Toai, *A Vietcong Memoir* (1985)
    n: A founder of the Front and minister of justice in its government, who fled by boat in 1979.
  - id: vn.van-tien-dung
    s: Van Tien Dung
    c: '*Our Great Spring Victory: An Account of the Liberation of South Vietnam* (1977)'
    n: The 1975 campaign by its commander. First serialized in Hanoi in 1976.
  - id: vn.vo-nguyen-giap
    s: Vo Nguyen Giap
    c: 'Cecil B. Currey, *Victory at Any Cost: The Genius of Viet Nam''s Gen. Vo Nguyen Giap* (1997)'
    n: Giap's own *People's War, People's Army* (1961) was translated in Hanoi and reprinted by Praeger in 1962. Check.
