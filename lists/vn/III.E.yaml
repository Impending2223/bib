# Viet. III.E Critics and the movement
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.E
entries:
  - id: vn.who.aiken-george-d
    s: Aiken, George D.
    r: Senator, Vermont
    n: '"Declare victory and get out," as remembered; the words of October 1966 differ. See Opp. III.B.'
  - id: vn.who.ali-muhammad
    s: Ali, Muhammad
    r: Heavyweight champion
    n: Refused induction, Houston, Apr. 28, 1967. Stripped of his title. See *Clay v. United States* (II.I.1).
  - id: vn.who.berrigan-daniel-berrigan-philip
    s: Berrigan, Daniel; Berrigan, Philip
    r: Catholic priests; the Catonsville Nine
    n: 'Catonsville, Maryland, May 17, 1968: draft files burned with napalm.'
  - id: vn.who.church-frank
    s: Church, Frank
    r: Senator, Idaho
    n: See K–J Cong. III.B; Cooper–Church (II.I.2).
  - id: vn.who.coffin-william-sloane-jr
    s: Coffin, William Sloane, Jr.
    r: Chaplain, Yale University
    n: Indicted with Spock, 1968, for counseling draft resistance.
  - id: vn.who.dellinger-david
    s: Dellinger, David
    r: Chairman, the Mobilization committees; Chicago Seven defendant
  - id: vn.who.fulbright-j-william
    s: Fulbright, J. William
    r: Chairman, Senate Foreign Relations Committee
    n: Managed the Tonkin resolution, 1964; hearings, 1966. See K–J Cong. III.B.
  - id: vn.who.gruening-ernest
    s: Gruening, Ernest
    r: Senator, Alaska
    n: Against the Tonkin resolution, with Morse. See K–J Cong. III.B.
  - id: vn.who.hayden-tom
    s: Hayden, Tom
    r: SDS; went to Hanoi in December 1965
    n: See K–J Cong. III.H; Cong. III.K.
  - id: vn.who.kerry-john
    s: Kerry, John
    r: Navy swift boat officer, 1968–69; Vietnam Veterans Against the War
    n: See Cong. III.K.
  - id: vn.who.king-martin-luther-jr
    s: King, Martin Luther, Jr.
    r: President, SCLC
    n: Riverside Church, Apr. 4, 1967 (II.J). See K–J Cong. III.H.
  - id: vn.who.lowenstein-allard-k
    s: Lowenstein, Allard K.
    r: Organizer of the Dump Johnson movement, 1967
  - id: vn.who.mansfield-mike
    s: Mansfield, Mike
    r: Senate Majority Leader
    n: Diem's early patron. His December 1962 report turned against the policy. See K–J Cong. III.A.
  - id: vn.who.mccarthy-eugene-j
    s: McCarthy, Eugene J.
    r: Senator, Minnesota
    n: See the 1968 list.
  - id: vn.who.morse-wayne
    s: Morse, Wayne
    r: Senator, Oregon
    n: Against the Tonkin resolution. See K–J Cong. III.B.
  - id: vn.who.muste-a-j
    s: Muste, A.J.
    r: Pacifist; elder of the movement
    n: Hanoi, January 1967; met Ho. Died a month later.
  - id: vn.who.russell-richard-b
    s: Russell, Richard B.
    r: Chairman, Senate Armed Services Committee
    n: Doubted the war from 1954; supported it once fought. Johnson's confidant on it (II.J). See K–J Cong. III.B.
  - id: vn.who.spock-benjamin
    s: Spock, Benjamin
    r: Pediatrician
    n: Convicted, 1968, with Coffin and two others; reversed, 1969.
