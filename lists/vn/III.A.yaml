# Viet. III.A Washington, 1961–1969
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.A
entries:
  - id: vn.who.ball-george-w
    s: Ball, George W.
    r: Under Secretary of State, 1961–66
    n: 'The dissenter inside. Voice: memoir (K–J Adm. II.G.4); memoranda in the Pentagon Papers.'
  - id: vn.who.bundy-mcgeorge
    s: Bundy, McGeorge
    r: Special assistant for national security affairs, 1961–66
    n: 'February 1965, from Pleiku: "sustained reprisal." Voice: Bird (II.H.1); Goldstein (K–J Adm. II.D).'
  - id: vn.who.bundy-william-p
    s: Bundy, William P.
    r: Defense (ISA), 1961–64; Assistant Secretary of State for East Asia, 1964–69
    n: Drafted a congressional resolution months before Tonkin.
  - id: vn.who.clifford-clark-m
    s: Clifford, Clark M.
    r: Secretary of Defense, 1968–69
    n: See the 1968 list III.E.
  - id: vn.who.cooper-chester-l
    s: Cooper, Chester L.
    r: NSC staff; Harriman's assistant on negotiations
    n: 'Voice: memoir (II.H.1).'
  - id: vn.who.ellsberg-daniel
    s: Ellsberg, Daniel
    r: McNaughton's assistant, 1964–65; Lansdale's team in Saigon, 1965–67; RAND
    n: Copied the Pentagon Papers from October 1969; to the *Times*, 1971.
  - id: vn.who.forrestal-michael-v
    s: Forrestal, Michael V.
    r: NSC staff for Vietnam, 1962–65
    n: To Vietnam with Hilsman at the turn of 1963. With him and Harriman, the Aug. 24, 1963 cable.
  - id: vn.who.gilpatric-roswell-l
    s: Gilpatric, Roswell L.
    r: Deputy Secretary of Defense, 1961–64
    n: Chaired the spring 1961 task force. See K–J Adm. III.F.
  - id: vn.who.harriman-w-averell
    s: Harriman, W. Averell
    r: Assistant Secretary of State for the Far East, 1961–63; Under Secretary for Political Affairs, 1963–65; negotiator in Paris, 1968–69
    n: The 1962 Laos settlement. Against Diệm by 1963.
  - id: vn.who.hilsman-roger
    s: Hilsman, Roger
    r: Director of Intelligence and Research, State, 1961–63; Assistant Secretary for the Far East, 1963–64
    n: 'Voice: memoir (K–J Adm. II.G.4).'
  - id: vn.who.johnson-lyndon-b
    s: Johnson, Lyndon B.
    r: Vice President, 1961–63; President, 1963–69
    n: 'Voice: tapes (II.J); memoir (K–J Adm. II.G.3).'
  - id: vn.who.kattenburg-paul-m
    s: Kattenburg, Paul M.
    r: Chairman, State's Vietnam working group, 1963
    n: 'Voice: memoir (II.H.1).'
  - id: vn.who.kennedy-john-f
    s: Kennedy, John F.
    r: President, 1961–63
    n: 'Voice: the September 1963 interviews; the tapes (II.J).'
  - id: vn.who.komer-robert-w
    s: Komer, Robert W.
    r: NSC staff, 1961–65; White House pacification chief, 1966–67; deputy for CORDS in Saigon, 1967–68
    n: '"Blowtorch Bob." See Jones (II.H.1).'
  - id: vn.who.mccone-john-a
    s: McCone, John A.
    r: Director of Central Intelligence, 1961–65
    n: Against the coup. Resigned 1965, unheard on the bombing. See K–J Adm. III.I.
  - id: vn.who.mcnamara-robert-s
    s: McNamara, Robert S.
    r: Secretary of Defense, 1961–68
    n: 'In Vietnam often from 1962. Against the bombing by 1967. Voice: memoir (II.H.1); *The Fog of War* (I.B).'
  - id: vn.who.mcnaughton-john-t
    s: McNaughton, John T.
    r: Assistant Secretary of Defense (ISA), 1964–67
    n: 'March 1965: the aims, 70 percent to avoid humiliating defeat. Killed in an air crash, July 1967.'
  - id: vn.who.rostow-walt-w
    s: Rostow, Walt W.
    r: Policy Planning, 1961–66; special assistant for national security affairs, 1966–69
    n: With Taylor to Saigon, 1961. A hawk throughout. See the 1968 list III.E.
  - id: vn.who.rusk-dean
    s: Rusk, Dean
    r: Secretary of State, 1961–69
    n: 'SEATO the obligation; Munich the lesson. Voice: memoir (K–J Adm. II.G.4).'
  - id: vn.who.taylor-maxwell-d
    s: Taylor, Maxwell D.
    r: Military Representative of the President, 1961–62; Chairman, Joint Chiefs, 1962–64; Ambassador to Saigon, 1964–65
    n: 'Led the October 1961 mission. Voice: memoir (II.H.1).'
  - id: vn.who.thomson-james-c-jr
    s: Thomson, James C., Jr.
    r: East Asia aide at State and the NSC, 1961–66
    n: 'Voice: his *Atlantic* essay (II.H.1).'
  - id: vn.who.wheeler-earle-g
    s: Wheeler, Earle G.
    r: Army Chief of Staff, 1962–64; Chairman, Joint Chiefs, 1964–70
    n: See K–J Adm. III.F.
