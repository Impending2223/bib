# Viet. III.G South Vietnam
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.G
entries:
  - id: vn.who.bui-diem
    s: Bui Diem
    r: Ambassador to Washington, 1967–72
    n: 'Voice: memoir (II.H.3). See the 1968 list III.H.'
  - id: vn.who.duong-van-minh
    s: Duong Van Minh
    r: General; leader of the November 1963 coup; head of state, Nov. 1963–Jan. 1964; last president, Apr. 28–30, 1975
    n: '"Big Minh." Surrendered Saigon.'
  - id: vn.who.huynh-van-cao
    s: Huynh Van Cao
    r: Commander, ARVN 7th Division, 1962; then of IV Corps
    n: Diem's loyalist; casualties to be avoided. Vann's counterpart, 1962; corps commander at Ap Bac. Check the date of the change.
  - id: vn.who.ngo-dinh-can
    s: Ngo Dinh Can
    r: Diem's brother; ruled central Vietnam from Hue
    n: Executed in 1964.
  - id: vn.who.ngo-dinh-diem
    s: Ngo Dinh Diem
    r: Prime minister, 1954–55; President of the Republic of Vietnam, 1955–63
    n: Killed with Nhu after the coup, Nov. 2, 1963. See K–J Adm. III.J.
  - id: vn.who.ngo-dinh-nhu
    s: Ngo Dinh Nhu
    r: Diem's brother and political counselor
    n: The Can Lao party, the special forces, the strategic hamlets. Ordered the pagoda raids, Aug. 21, 1963. Killed with Diem.
  - id: vn.who.ngo-dinh-thuc
    s: Ngo Dinh Thuc
    r: Archbishop of Hue; Diem's brother
  - id: vn.who.nguyen-cao-ky
    s: Nguyen Cao Ky
    r: Air force commander; prime minister, 1965–67; vice president, 1967–71
    n: 'Voice: memoirs (II.H.3).'
  - id: vn.who.nguyen-khanh
    s: Nguyen Khanh
    r: General; took power Jan. 30, 1964; forced out Feb. 1965
  - id: vn.who.nguyen-ngoc-loan
    s: Nguyen Ngoc Loan
    r: National police chief
    n: Adams's photograph (III.F).
  - id: vn.who.nguyen-van-thieu
    s: Nguyen Van Thieu
    r: Head of state, 1965–67; President, 1967–75
    n: See Adm. III.J and the 1968 list III.H.
  - id: vn.who.ngo-quang-truong
    s: Ngo Quang Truong
    r: General; commander, I Corps, 1972–75
    n: Held Hue, 1972. I Corps to the end.
  - id: vn.who.thich-quang-duc
    s: Thich Quang Duc
    r: Buddhist monk
    n: Burned himself to death at a Saigon intersection, June 11, 1963.
  - id: vn.who.thich-tri-quang
    s: Thich Tri Quang
    r: Buddhist leader in Hue
    n: Led the 1963 protests. Refuge in the American embassy after the pagoda raids. The 1966 Struggle Movement.
  - id: vn.who.tran-le-xuan-madame-nhu
    s: Tran Le Xuan (Madame Nhu)
    r: Nhu's wife; official hostess for Diem
    n: The burning monks a "barbecue." Abroad at the coup. See II.H.3.
  - id: vn.who.tran-van-don
    s: Tran Van Don
    r: General; a leader of the November 1963 coup
    n: 'Voice: memoir (II.H.3).'
  - id: vn.who.tran-van-huong
    s: Tran Van Huong
    r: Prime minister, 1964–65, 1968–69; President, Apr. 21–28, 1975
