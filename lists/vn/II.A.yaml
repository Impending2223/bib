# Viet. II.A General histories
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.A
entries:
  - id: vn.fall-two-viet-nams
    c: 'Bernard B. Fall, *The Two Viet-Nams: A Political and Military Analysis* (1963)'
    n: The standard account when the Americans arrived. Revised 1964, 1967.
  - id: vn.lewy-america-in-vietnam
    c: Guenter Lewy, *America in Vietnam* (1978)
    n: 'The conduct of the war: tactics, casualties, refugees, the law of war, the atrocity charges. From MACV and service records opened to him.'
  - id: vn.herring-americas-longest-war
    c: 'George C. Herring, *America''s Longest War: The United States and Vietnam, 1950–1975* (1979)'
    n: One volume, Truman to the fall. Containment misapplied to a nationalist revolution. The textbook; use the latest edition.
  - id: vn.gelb-irony-of-vietnam
    c: 'Leslie H. Gelb with Richard K. Betts, *The Irony of Vietnam: The System Worked* (1979)'
    n: The presidents knew the odds and chose not to lose. Gelb ran the Pentagon Papers study.
  - id: vn.summers-on-strategy-a
    c: 'Harry G. Summers Jr., *On Strategy: A Critical Analysis of the Vietnam War* (1982)'
    n: The war through Clausewitz. Hanoi's main force the threat, met as if it were an insurgency; no declared aim, no mobilization. By a colonel at the Army War College.
  - id: vn.karnow-vietnam-a-history
    c: 'Stanley Karnow, *Vietnam: A History* (1983)'
    n: Companion to the PBS series (I.B). Interviews with Giap and Pham Van Dong.
  - id: vn.kolko-anatomy-of-a
    c: 'Gabriel Kolko, *Anatomy of a War: Vietnam, the United States, and the Modern Historical Experience* (1985)'
    n: Marxist. The Party's revolution and its social base; the American war as an imperial economy's. Sympathetic to Hanoi.
  - id: vn.turley-second-indochina-war
    c: 'William S. Turley, *The Second Indochina War: A Short Political and Military History, 1954–1975* (1986)'
    n: Short; exact on the communist side. Revised 2009.
  - id: vn.sheehan-bright-shining-lie
    c: 'Neil Sheehan, *A Bright Shining Lie: John Paul Vann and America in Vietnam* (1988)'
    n: Vann's war, Ap Bac to his death, 1972, in Vann's terms and the Saigon correspondents'. On the Delta, superseded by Elliott (II.E); on Ap Bac, compare Toczek (II.B).
  - id: vn.young-vietnam-wars-1945
    c: Marilyn B. Young, *The Vietnam Wars, 1945–1990* (1991)
    n: The American war as aggression against a revolution. By a historian active in the antiwar movement.
  - id: vn.schulzinger-time-for-war
    c: 'Robert D. Schulzinger, *A Time for War: The United States and Vietnam, 1941–1975* (1997)'
  - id: vn.the-columbia-guide-to-the
    c: '*The Columbia Guide to the Vietnam War* (David L. Anderson ed., 2002)'
    n: Essays, a chronology, and an annotated bibliography.
  - id: vn.moyar-triumph-forsaken-the
    c: 'Mark Moyar, *Triumph Forsaken: The Vietnam War, 1954–1965* (2006)'
    n: 1954–65. Diem's government viable; the coup Washington's error; the Saigon press corps its instrument. Communist and Vietnamese sources. Sequel below.
  - id: vn.lawrence-vietnam-war-a
    c: 'Mark Atwood Lawrence, *The Vietnam War: A Concise International History* (2008)'
  - id: vn.prados-vietnam-the-history
    c: 'John Prados, *Vietnam: The History of an Unwinnable War, 1945–1975* (2009)'
    n: Unwinnable throughout, as the title says. By a National Security Archive analyst.
  - id: vn.logevall-embers-of-war
    c: 'Fredrik Logevall, *Embers of War: The Fall of an Empire and the Making of America''s Vietnam* (2012)'
    n: '1940 to 1959: the French war, and Washington''s choices to take it up. Read before II.B.'
  - id: vn.goscha-vietnam-a-new
    c: 'Christopher Goscha, *Vietnam: A New History* (2016)'
    n: 'Vietnam''s history; the war one chapter. British edition: *The Penguin History of Modern Vietnam*.'
  - id: vn.ward-vietnam-war-an
    c: 'Geoffrey C. Ward & Ken Burns, *The Vietnam War: An Intimate History* (2017)'
    n: Companion to the PBS series (I.B).
  - id: vn.asselin-vietnams-american-war
    c: 'Pierre Asselin, *Vietnam''s American War: A History* (2018)'
    n: The war from Hanoi's side, from its histories and archives. Second edition, 2024.
  - id: vn.hastings-vietnam-an-epic
    c: 'Max Hastings, *Vietnam: An Epic Tragedy, 1945–1975* (2018)'
    n: The soldiers of every army.
  - id: vn.moyar-triumph-regained-the
    c: 'Mark Moyar, *Triumph Regained: The Vietnam War, 1965–1968* (2022)'
    n: Sequel to *Triumph Forsaken*.
  - id: vn.the-cambridge-history-of-the
    c: '*The Cambridge History of the Vietnam War* (3 vols., 2024)'
    n: Lien-Hang T. Nguyen, general editor. Volumes edited by Miller, Preston, Asselin.
