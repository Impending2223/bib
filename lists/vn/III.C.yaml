# Viet. III.C Saigon: the embassy and the station
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: III.C
entries:
  - id: vn.who.bunker-ellsworth
    s: Bunker, Ellsworth
    r: Ambassador to Saigon, 1967–73
    n: See the 1968 list III.F.
  - id: vn.who.colby-william-e
    s: Colby, William E.
    r: CIA station chief, Saigon, 1959–62; chief of the Far East Division, 1962–67; head of CORDS, 1968–71; Director of Central Intelligence, 1973–76
    n: 'Phoenix was his. Voice: memoirs (II.H.1).'
  - id: vn.who.conein-lucien
    s: Conein, Lucien
    r: CIA officer
    n: The embassy's liaison to the generals. At their headquarters through the coup of Nov. 1, 1963, with money for them.
  - id: vn.who.durbrow-elbridge
    s: Durbrow, Elbridge
    r: Ambassador to Saigon, 1957–61
    n: Pressed Diem to reform. Diem wanted him gone.
  - id: vn.who.johnson-u-alexis
    s: Johnson, U. Alexis
    r: Deputy Under Secretary of State, 1961–64; deputy ambassador in Saigon, 1964–65
  - id: vn.who.lansdale-edward-g
    s: Lansdale, Edward G.
    r: Pentagon special operations, 1957–63; senior liaison officer in Saigon, 1965–68
    n: Diem's sponsor in 1954–55; kept from Saigon under Kennedy by Rusk and McNamara. Mongoose's chief of operations. See II.H.2.
  - id: vn.who.lodge-henry-cabot
    s: Lodge, Henry Cabot
    r: Ambassador to Saigon, 1963–64, 1965–67
    n: 'Arrived Aug. 22, 1963, in the middle of the pagoda raids. Voice: Blair (II.H.1).'
  - id: vn.who.martin-graham-a
    s: Martin, Graham A.
    r: Ambassador to Saigon, 1973–75
    n: Delayed the evacuation; left by helicopter from the embassy roof on Apr. 30, 1975, with the flag.
  - id: vn.who.mecklin-john
    s: Mecklin, John
    r: Public affairs officer, Saigon, 1962–64
    n: 'Voice: memoir (II.B).'
  - id: vn.who.nolting-frederick-e-jr
    s: Nolting, Frederick E., Jr.
    r: Ambassador to Saigon, 1961–63
    n: 'Away on leave for much of the Buddhist crisis, June–July 1963. Voice: memoir (II.H.1).'
  - id: vn.who.phillips-rufus
    s: Phillips, Rufus
    r: Rural affairs, U.S. aid mission, 1962–63
    n: 'Told Kennedy on Sept. 10, 1963 that the war was being lost in the Delta. Voice: memoir (II.H.1).'
  - id: vn.who.polgar-thomas
    s: Polgar, Thomas
    r: CIA station chief, Saigon, 1972–75
  - id: vn.who.richardson-john-h
    s: Richardson, John H.
    r: CIA station chief, Saigon, 1962–63
    n: Close to Nhu. Recalled in October 1963 after his name was printed.
  - id: vn.who.snepp-frank
    s: Snepp, Frank
    r: CIA analyst, Saigon, 1969–75
    n: 'Voice: *Decent Interval* (II.D).'
  - id: vn.who.trueheart-william-c
    s: Trueheart, William C.
    r: Deputy chief of mission, Saigon, 1961–64
    n: Ran the embassy between Nolting's departure and Lodge's arrival, and broke with Nolting's line.
  - id: vn.who.vann-john-paul
    s: Vann, John Paul
    r: Adviser to the ARVN 7th Division, 1962–63; civilian pacification official from 1965; senior adviser, II Corps, 1971–72
    n: Fed the reporters after Ap Bac. Killed in a helicopter crash June 9, 1972. See Sheehan (II.A).
