    n: Ford's clemency for draft evaders and deserters.
  - id: vn.proclamation-no-4483-42-fed
    c: '[Proclamation No. 4483](https://www.presidency.ucsb.edu/documents/proclamation-4483-granting-pardon-for-violations-the-selective-service-act-august-4-1964), [42 Fed. Reg. 4391](https://www.govinfo.gov/app/details/FR-1977-01-24) (Jan. 21, 1977)'
