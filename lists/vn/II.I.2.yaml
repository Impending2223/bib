  - id: vn.war-powers-resolution-pub-l
    c: War Powers Resolution, [Pub. L. No. 93-148, 87 Stat. 555](https://www.govinfo.gov/content/pkg/STATUTE-87/pdf/STATUTE-87-Pg555.pdf) (1973)
