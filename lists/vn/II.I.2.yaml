# Viet. II.I.2 Treaties, resolutions, statutes, and directives
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.I.2
entries:
  - id: vn.final-declaration-of-the-geneva
    c: Final Declaration of the Geneva Conference on the Problem of Restoring Peace in Indo-China (July 21, 1954)
    n: Partition at the 17th parallel; elections promised for July 1956. The United States took note; did not sign.
  - id: vn.southeast-asia-collective-defense-treaty
    c: Southeast Asia Collective Defense Treaty, Sept. 8, 1954, 6 U.S.T. 81
    n: SEATO. A protocol covered Cambodia, Laos, and "the free territory under the jurisdiction of the State of Vietnam." Rusk's obligation.
  - id: vn.nsam-no-52-may-11
    c: NSAM No. 52 (May 11, 1961)
    n: Also K–J Adm.
  - id: vn.nsam-no-111-nov-22
    c: NSAM No. 111 (Nov. 22, 1961)
    n: '"First Phase of Vietnam Program": advisers, helicopters, support units; no combat troops. See Cal.'
  - id: vn.declaration-on-the-neutrality-of
    c: Declaration on the Neutrality of Laos, July 23, 1962, 14 U.S.T. 1104
    n: Laos settled. Hanoi's troops stayed; the Trail stayed open.
  - id: vn.nsam-no-263-oct-11
    c: NSAM No. 263 (Oct. 11, 1963)
    n: A thousand advisers out by year's end. Also K–J Adm.
  - id: vn.nsam-no-273-nov-26
    c: NSAM No. 273 (Nov. 26, 1963)
    n: Also K–J Adm.
  - id: vn.nsam-no-288-mar-17
    c: NSAM No. 288 (Mar. 17, 1964)
    n: 'McNamara''s March 1964 report adopted. Objective: an independent, non-communist South Vietnam.'
  - id: vn.tonkin-gulf-resolution-pub-l
    c: Tonkin Gulf Resolution, Pub. L. No. 88-408, 78 Stat. 384 (1964)
    n: Also K–J Cong.
  - id: vn.nsam-no-328-apr-6
    c: NSAM No. 328 (Apr. 6, 1965)
    n: Also K–J Adm.
  - id: vn.exec-order-no-11-497
    c: Exec. Order No. 11,497, 34 Fed. Reg. 19,019 (Nov. 26, 1969)
    n: Draft lottery. First drawing Dec. 1, 1969.
  - id: vn.repeal-of-the-tonkin-gulf
    c: Repeal of the Tonkin Gulf Resolution, Pub. L. No. 91-672, § 12, 84 Stat. 2053, 2055 (1971)
    n: In a foreign military sales bill, signed Jan. 12, 1971.
  - id: vn.special-foreign-assistance-act-of
    c: Special Foreign Assistance Act of 1971, Pub. L. No. 91-652, 84 Stat. 1942
    n: Cooper–Church. Also Cong.
  - id: vn.agreement-on-ending-the-war
    c: Agreement on Ending the War and Restoring Peace in Viet-Nam, Jan. 27, 1973, 24 U.S.T. 1
    n: The Paris agreement. Check the treaty citation.
  - id: vn.case-church-amendment-pub-l
    c: Case–Church amendment, Pub. L. No. 93-52, § 108, 87 Stat. 130 (1973)
    n: Also Cong.
  - id: vn.war-powers-resolution-pub-l
    c: War Powers Resolution, Pub. L. No. 93-148, 87 Stat. 555 (1973)
    n: Also Cong.
  - id: vn.proclamation-no-4313-39-fed
    c: Proclamation No. 4313, 39 Fed. Reg. 33,293 (Sept. 16, 1974)
    n: Ford's clemency for draft evaders and deserters.
  - id: vn.proclamation-no-4483-42-fed
    c: Proclamation No. 4483, 42 Fed. Reg. 4391 (Jan. 21, 1977)
    n: Carter's pardon for draft evaders, his first full day.
