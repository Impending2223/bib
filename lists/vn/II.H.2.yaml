# Viet. II.H.2 In the field
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.H.2
entries:
  - id: vn.abrams-creighton-w
    s: Abrams, Creighton W.
    c: See the 1968 list II.B.
    n: Sorley's *Thunderbolt* and the Abrams tapes.
  - id: vn.alvarez-everett-jr
    s: Alvarez, Everett, Jr.
    c: Everett Alvarez Jr. & Anthony S. Pitch, *Chained Eagle* (1989)
    n: Shot down Aug. 5, 1964, in the Tonkin reprisal raids. Held in the North eight and a half years, longer than any other prisoner there.
  - id: vn.caputo-philip
    s: Caputo, Philip
    c: '*A Rumor of War* (1977)'
    n: A Marine lieutenant from the Da Nang landing of March 1965 to a murder charge. The best of the memoirs.
  - id: vn.hackworth-david-h
    s: Hackworth, David H.
    c: 'David H. Hackworth & Julie Sherman, *About Face: The Odyssey of an American Warrior* (1989)'
  - id: vn.herrington-stuart-a
    s: Herrington, Stuart A.
    c: '*Silence Was a Weapon: The Vietnam War in the Villages* (1982)'
    n: An intelligence adviser with Phoenix in Hau Nghia, 1971–72.
  - id: vn.kovic-ron
    s: Kovic, Ron
    c: '*Born on the Fourth of July* (1976)'
  - id: vn.krulak-victor-h
    s: Krulak, Victor H.
    c: '*First to Fight: An Inside View of the U.S. Marine Corps* (1984)'
    n: The Marine general who argued for pacification against Westmoreland. His September 1963 trip with Mendenhall gave Kennedy the two reports on one war.
  - id: vn.lansdale-edward-g
    s: Lansdale, Edward G.
    c: 'Max Boot, *The Road Not Taken: Edward Lansdale and the American Tragedy in Vietnam* (2018)'
    n: 'His memoir is in K–J Adm. II.G.4. Cecil B. Currey, *Edward Lansdale: The Unquiet American* (1988), came first.'
  - id: vn.mason-robert
    s: Mason, Robert
    c: '*Chickenhawk* (1983)'
    n: A helicopter pilot with the 1st Cavalry Division, 1965–66.
  - id: vn.mccain-john
    s: McCain, John
    c: John McCain & Mark Salter, *Faith of My Fathers* (1999)
    n: Five and a half years a prisoner; his father commanded in the Pacific.
  - id: vn.obrien-tim
    s: O'Brien, Tim
    c: '*If I Die in a Combat Zone, Box Me Up and Ship Me Home* (1973)'
    n: The Americal Division in Quang Ngai, 1969.
  - id: vn.puller-lewis-b-jr
    s: Puller, Lewis B., Jr.
    c: '*Fortunate Son: The Healing of a Vietnam Vet* (1991)'
    n: The son of Chesty Puller, maimed by a mine in 1968. Pulitzer Prize.
  - id: vn.stockdale-james-b
    s: Stockdale, James B.
    c: 'Jim & Sybil Stockdale, *In Love and War: The Story of a Family''s Ordeal and Sacrifice During the Vietnam Years* (1984)'
    n: The senior naval prisoner, and the wife who organized the families. He flew over the Tonkin Gulf on Aug. 4, 1964, and saw nothing.
  - id: vn.van-devanter-lynda
    s: Van Devanter, Lynda
    c: '*Home Before Morning: The Story of an Army Nurse in Vietnam* (1983)'
  - id: vn.vann-john-paul
    s: Vann, John Paul
    c: See Sheehan in II.A.
  - id: vn.westmoreland-william-c
    s: Westmoreland, William C.
    c: '*A Soldier Reports* (1976)'
    n: 'Lewis Sorley, *Westmoreland: The General Who Lost Vietnam* (2011), is the case against.'
