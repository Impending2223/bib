# Viet. II.I.3 Reports, papers, and official histories
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: vn
section: II.I.3
entries:
  - id: vn.memorandum-from-maxwell-d-taylor
    c: Memorandum from Maxwell D. Taylor to the President (Nov. 3, 1961)
    n: The Taylor–Rostow mission's report. Also K–J Adm.
  - id: vn.state-threat-to-the
    c: 'U.S. Department of State, *A Threat to the Peace: North Viet-Nam''s Effort to Conquer South Viet-Nam* (Dec. 1961)'
    n: The first white paper. The case for the November decisions.
  - id: vn.al-vietnam-and-southeast
    c: Mike Mansfield et al., *Vietnam and Southeast Asia*, report to the Senate Committee on Foreign Relations (Feb. 1963)
    n: Public version of the report Mansfield gave Kennedy privately in December 1962. Check the citation. See Cal.
  - id: vn.report-of-mcnamara-and-taylor
    c: Report of McNamara and Taylor to the President (Oct. 2, 1963)
    n: The basis of NSAM 263. In FRUS 1961–63, vol. 4.
  - id: vn.state-aggression-from-the
    c: 'U.S. Department of State, *Aggression from the North: The Record of North Viet-Nam''s Campaign to Conquer South Viet-Nam* (Feb. 1965)'
    n: The second white paper, issued with Rolling Thunder. I.F. Stone's rebuttal ran in his *Weekly* in March.
  - id: vn.army-report-of-the
    c: Department of the Army, *Report of the Department of the Army Review of the Preliminary Investigations into the My Lai Incident* (1970)
    n: The Peers report, made public in 1974. Check.
  - id: vn.united-states-vietnam-relations-1945
    c: '*United States–Vietnam Relations, 1945–1967* (12 books, 1971)'
    n: The Pentagon's study, printed by the House Armed Services Committee. The National Archives released it entire, with the negotiating volumes, in June 2011.
  - id: vn.the-pentagon-papers-gravel-ed
    c: The Pentagon Papers (Gravel ed., 1971)
    n: Also K–J Adm.
  - id: vn.the-pentagon-papers-as-published
    c: '*The Pentagon Papers as Published by The New York Times* (Neil Sheehan et al. eds., 1971)'
    n: Also Adm.
  - id: vn.spector-advice-and-support
    c: 'Ronald H. Spector, *Advice and Support: The Early Years, 1941–1960* (1983)'
    n: The first of the Army's official histories.
  - id: vn.herring-secret-diplomacy-of
    c: 'George C. Herring, *The Secret Diplomacy of the Vietnam War: The Negotiating Volumes of the Pentagon Papers* (1983)'
  - id: vn.foreign-relations-of-the-united
    c: '*Foreign Relations of the United States, 1961–1963*, vols. 1–4, *Vietnam* (1988–91)'
    n: Online at [history.state.gov](https://history.state.gov). Vol. 1 is 1961; vol. 2, 1962; vols. 3–4, 1963. The calendar cites them.
  - id: vn.hammond-public-affairs-the
    c: 'William M. Hammond, *Public Affairs: The Military and the Media, 1962–1968* (1988)'
    n: With a second volume for 1968–1973 (1996).
  - id: vn.clarke-advice-and-support
    c: 'Jeffrey J. Clarke, *Advice and Support: The Final Years, 1965–1973* (1988)'
  - id: vn.foreign-relations-of-the-united-2
    c: '*Foreign Relations of the United States, 1964–1968*, vols. 1–7, *Vietnam* (1992–2003)'
    n: Vols. 6–7 are also in the 1968 list.
  - id: vn.ford-cia-and-the
    c: 'Harold P. Ford, *CIA and the Vietnam Policymakers: Three Episodes, 1962–1968* (1998)'
    n: The agency's analysts were more pessimistic than their readers.
  - id: vn.carland-combat-operations-stemming
    c: 'John M. Carland, *Combat Operations: Stemming the Tide, May 1965 to October 1966* (2000)'
  - id: vn.ahern-cia-and-the
    c: 'Thomas L. Ahern Jr., *CIA and the House of Ngo: Covert Action in South Vietnam, 1954–63* (2000)'
    n: The agency's internal history, declassified with deletions in 2009. Ahern wrote others on the CIA in Vietnam and Laos. Check the dates.
  - id: vn.cosmas-macv-the-joint
    c: 'Graham A. Cosmas, *MACV: The Joint Command in the Years of Escalation, 1962–1967* (2006)'
    n: Its sequel covers 1968–1973 (2007).
  - id: vn.foreign-relations-of-the-united-3
    c: '*Foreign Relations of the United States, 1969–1976*, vols. 6–10, *Vietnam* (2006–10)'
    n: From January 1969 to July 1975. Check the years of publication.
  - id: vn.the-joint-chiefs-of-staff
    c: '*The Joint Chiefs of Staff and the War in Vietnam* (Office of Joint History)'
    n: The Chiefs' own history, written in the 1970s, declassified and published in parts. Check which.
