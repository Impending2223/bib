        file: I.B.yaml
  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Eleven sections, from the most digested to the least: A. The institution and the parties. B. The agenda, bill by bill. C. War powers and the purse. D. The elections of 1970 and 1972. E. The nation. F. The Court. G. The states. H. Memoirs and biographies. I. Documents. J. Recordings. K. Archives and reference. Sections A through G are chronological by first publication.'
