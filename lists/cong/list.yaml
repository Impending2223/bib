# Cong.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Congress, the Nation, and the States, 1969–1974: Bibliography'
h1: 'Congress, the nation, and the states, 1969–1974: working bibliography'
lede: Sources, portrayals, and names for the 91st, 92d, and 93d Congresses, the elections of 1970 and 1972, the country's movements and backlash, the Court, and the states, less Watergate.
logic:
  - 'Third of four lists. This one is Cong. The others: the Republican opposition, 1961–69 (Opp.); Nixon and his administration (Adm.); and Watergate (Wg.). Cross-references give list and section. Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.'
  - 'The Watergate rule is the one stated in Adm. The Ervin Committee, the House Judiciary Committee''s impeachment inquiry, and the tapes cases are in Wg. alone. What Congress did in the same months on other grounds stays here: war powers, the budget act, impoundment, Agnew''s resignation, Ford''s confirmation. A person whose part was only Watergate appears only in Wg.'
sections:
