# Cong. II.I.1 Cases
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cong
section: II.I.1
entries:
  - id: cong.powell-v-mccormack
    c: '*Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf) (1969)'
    n: The House could not exclude Adam Clayton Powell. Among Warren's last opinions.
  - id: cong.oregon-v-mitchell
    c: '*Oregon v. Mitchell*, [400 U.S. 112](https://tile.loc.gov/storage-services/service/ll/usrep/usrep400/usrep400112/usrep400112.pdf) (1970)'
    n: Congress could lower the voting age for federal but not state elections. The Twenty-sixth Amendment followed within months.
  - id: cong.swann-v-charlotte-mecklenburg-board
    c: '*Swann v. Charlotte-Mecklenburg Board of Education*, [402 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep402/usrep402001/usrep402001.pdf) (1971)'
    n: Also Adm.
  - id: cong.new-york-times-co-v
    c: '*New York Times Co. v. United States*, [403 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep403/usrep403713/usrep403713.pdf) (1971)'
    n: Also Adm.
  - id: cong.serrano-v-priest
    c: '*Serrano v. Priest*, [5 Cal. 3d 584](https://static.case.law/cal-3d/5/case-pdfs/0584-01.pdf) (1971)'
    n: California's property-tax school finance struck under the state and federal constitutions.
  - id: cong.people-v-anderson
    c: '*People v. Anderson*, [6 Cal. 3d 628](https://static.case.law/cal-3d/6/case-pdfs/0628-01.pdf) (1972)'
    n: The death penalty struck under the state constitution. Proposition 17 restored it that November.
  - id: cong.gravel-v-united-states
    c: '*Gravel v. United States*, [408 U.S. 606](https://tile.loc.gov/storage-services/service/ll/usrep/usrep408/usrep408606/usrep408606.pdf) (1972)'
    n: Senator Gravel read the Pentagon Papers into a subcommittee record. The Speech or Debate Clause did not cover the private republication.
  - id: cong.united-states-v-brewster
    c: '*United States v. Brewster*, [408 U.S. 501](https://tile.loc.gov/storage-services/service/ll/usrep/usrep408/usrep408501/usrep408501.pdf) (1972)'
    n: A senator's bribery prosecutable.
  - id: cong.branzburg-v-hayes
    c: '*Branzburg v. Hayes*, [408 U.S. 665](https://tile.loc.gov/storage-services/service/ll/usrep/usrep408/usrep408665/usrep408665.pdf) (1972)'
    n: No reporter's privilege before a grand jury.
  - id: cong.furman-v-georgia
    c: '*Furman v. Georgia*, [408 U.S. 238](https://tile.loc.gov/storage-services/service/ll/usrep/usrep408/usrep408238/usrep408238.pdf) (1972)'
  - id: cong.obrien-v-brown
    c: '*O''Brien v. Brown*, [409 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep409/usrep409001/usrep409001.pdf) (1972)'
    n: The California delegation fight before the Democratic convention.
  - id: cong.byrn-v-new-york-city
    c: '*Byrn v. New York City Health & Hospitals Corp.*, [31 N.Y.2d 194](https://static.case.law/ny-2d/31/case-pdfs/0194-01.pdf) (1972)'
    n: New York's 1970 abortion law upheld against a guardian for the unborn.
  - id: cong.roe-v-wade
    c: '*Roe v. Wade*, [410 U.S. 113](https://tile.loc.gov/storage-services/service/ll/usrep/usrep410/usrep410113/usrep410113.pdf) (1973)'
  - id: cong.san-antonio-independent-school-district
    c: '*San Antonio Independent School District v. Rodriguez*, [411 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep411/usrep411001/usrep411001.pdf) (1973)'
    n: No federal right; the school-finance fight returned to the states.
  - id: cong.robinson-v-cahill
    c: '*Robinson v. Cahill*, [62 N.J. 473](https://static.case.law/nj/62/case-pdfs/0473-01.pdf) (1973)'
    n: New Jersey school finance struck under the state constitution.
  - id: cong.state-highway-commission-of-missouri
    c: '*State Highway Commission of Missouri v. Volpe*, [479 F.2d 1099](https://static.case.law/f2d/479/case-pdfs/1099-01.pdf) (8th Cir. 1973)'
    n: Highway impoundment unlawful. One of dozens of impoundment suits.
  - id: cong.holtzman-v-schlesinger
    c: '*Holtzman v. Schlesinger*, [484 F.2d 1307](https://static.case.law/f2d/484/case-pdfs/1307-01.pdf) (2d Cir. 1973)'
    n: A congresswoman sues to stop the Cambodia bombing. Justice Douglas's stay was overridden within hours.
  - id: cong.mitchell-v-laird
    c: '*Mitchell v. Laird*, [488 F.2d 611](https://static.case.law/f2d/488/case-pdfs/0611-01.pdf) (D.C. Cir. 1973)'
    n: Members of Congress sue over the war. Standing, then the political question.
  - id: cong.scheuer-v-rhodes
    c: '*Scheuer v. Rhodes*, [416 U.S. 232](https://tile.loc.gov/storage-services/service/ll/usrep/usrep416/usrep416232/usrep416232.pdf) (1974)'
    n: The Kent State suits may proceed against the governor.
  - id: cong.kennedy-v-sampson
    c: '*Kennedy v. Sampson*, [511 F.2d 430](https://static.case.law/f2d/511/case-pdfs/0430-01.pdf) (D.C. Cir. 1974)'
    n: A Christmas-recess pocket veto held invalid.
  - id: cong.milliken-v-bradley
    c: '*Milliken v. Bradley*, [418 U.S. 717](https://tile.loc.gov/storage-services/service/ll/usrep/usrep418/usrep418717/usrep418717.pdf) (1974)'
    n: No busing across Detroit's suburban lines.
  - id: cong.cousins-v-wigoda
    c: '*Cousins v. Wigoda*, [419 U.S. 477](https://tile.loc.gov/storage-services/service/ll/usrep/usrep419/usrep419477/usrep419477.pdf) (1975)'
    n: The Daley delegation unseated at the 1972 convention. The party's rules prevailed over state law.
