# Cong. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cong
section: I.A
entries:
  - id: cong.updike-rabbit-redux
    c: John Updike, *Rabbit Redux* (1971)
    n: Summer 1969 in Brewer, Pennsylvania. The moon shot, a Vietnam veteran, a runaway, a fire. The silent majority from inside one of its houses.
  - id: cong.just-congressman-who-loved
    c: Ward Just, *The Congressman Who Loved Flaubert and Other Washington Stories* (1973)
    n: The title story is the best short fiction about a member of Congress. A liberal who votes his district.
  - id: cong.pynchon-vineland
    c: Thomas Pynchon, *Vineland* (1990)
    n: Set in 1984; the backstory is the Nixon-era federal war on the counterculture.
  - id: cong.trudeau-doonesbury
    c: Garry Trudeau, *Doonesbury* (1970–)
    n: The daily strip. Congressional races, the campus, Walden commune, Vietnam. The Watergate strips are in Wg.
