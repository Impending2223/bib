# Cong. II.H.2 The House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cong
section: II.H.2
entries:
  - id: cong.abzug-bella
    s: Abzug, Bella
    c: '*Bella! Ms. Abzug Goes to Washington* (Mel Ziegler ed., 1972)'
    n: Her first-year diary. Loud and funny.
  - id: cong.albert-carl
    s: Albert, Carl
    c: 'Carl Albert with Danney Goble, *Little Giant: The Life and Times of Speaker Carl Albert* (1990)'
    n: Speaker from 1971. Next in line for the presidency while the vice presidency stood empty, October–December 1973.
  - id: cong.chisholm-shirley
    s: Chisholm, Shirley
    c:
      - '*Unbought and Unbossed* (1970)'
      - '*The Good Fight* (1973)'
    n: The second is her 1972 campaign.
  - id: cong.mccormack-john-w
    s: McCormack, John W.
    c: 'Garrison Nelson, *John William McCormack: A Political Biography* (2017)'
    n: Speaker to 1971.
  - id: cong.mills-wilbur-d
    s: Mills, Wilbur D.
    c: See Zelizer in II.B.
  - id: cong.oneill-thomas-p-jr
    s: O'Neill, Thomas P., Jr.
    c:
      - 'Tip O''Neill with William Novak, *Man of the House: The Life and Political Memoirs of Speaker Tip O''Neill* (1987)'
      - John A. Farrell, *Tip O'Neill and the Democratic Century* (2001)
    n: Whip, then Majority Leader from 1973. Also Wg.
  - id: cong.riegle-donald-w-jr
    s: Riegle, Donald W., Jr.
    c: Donald Riegle with Trevor Armbrister, *O Congress* (1972)
    n: A Republican's diary of 1971–72. Unusually candid.
