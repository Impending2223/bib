# Cong. II.B The agenda, bill by bill
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cong
section: II.B
entries:
  - id: cong.marmor-politics-of-medicare
    c: Theodore R. Marmor, *The Politics of Medicare* (1973)
    n: The last chapter carries the story into national health insurance under Nixon.
  - id: cong.jones-clean-air-the
    c: 'Charles O. Jones, *Clean Air: The Policies and Politics of Pollution Control* (1975)'
    n: Muskie and Nixon outbidding each other in 1970.
  - id: cong.derthick-policymaking-for-social
    c: Martha Derthick, *Policymaking for Social Security* (1979)
    n: The 1972 benefit increase and indexing, passed in an election year.
  - id: cong.mansbridge-why-we-lost
    c: Jane J. Mansbridge, *Why We Lost the ERA* (1986)
    n: Passed by Congress in March 1972; stalled in the states.
  - id: cong.conlan-new-federalism-intergovernmental
    c: 'Timothy J. Conlan, *New Federalism: Intergovernmental Reform from Nixon to Reagan* (1988)'
    n: Revenue sharing and block grants. The states' side of Adm. II.D.
  - id: cong.zelizer-taxing-america-wilbur
    c: 'Julian E. Zelizer, *Taxing America: Wilbur D. Mills, Congress, and the State, 1945–1975* (1998)'
    n: Mills and the Family Assistance Plan; Mills and revenue sharing.
  - id: cong.rome-genius-of-earth
    c: 'Adam Rome, *The Genius of Earth Day: How a 1970 Teach-In Unexpectedly Made the First Green Generation* (2013)'
    n: Gaylord Nelson's idea and what it produced.
