    c: Gerald R. Ford, confirmation hearings, Senate Rules Committee (Nov. 1973)
  - id: cong.meet-the-press
    c: '*Meet the Press*, *Face the Nation*, and *Issues and Answers* (1969–74)'
    n: Listed out of date order. The Sunday programs were the members' television. Check what survives at the networks and at the Vanderbilt archive.
