# Cong. I.B Screen
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cong
section: I.B
entries:
  - id: cong.medium-cool
    c: '*Medium Cool* (Haskell Wexler dir., 1969)'
    n: Chicago 1968, shot in the streets. The prologue to this list.
  - id: cong.joe
    c: '*Joe* (John G. Avildsen dir., 1970)'
    n: A factory worker's rage at the young. Released in July 1970, two months after the hardhat riot.
  - id: cong.the-senator
    c: '*The Senator* (NBC 1970–71)'
    n: Hal Holbrook as a first-term senator. Part of *The Bold Ones*. Serious, short-lived.
  - id: cong.all-in-the-family
    c: '*All in the Family* (CBS 1971–)'
    n: Archie Bunker as the Nixon voter the networks had not shown.
  - id: cong.the-selling-of-the-pentagon
    c: '*The Selling of the Pentagon* (CBS Feb. 23, 1971)'
    n: Documentary on military public relations. Staggers's committee subpoenaed the outtakes; the House refused to cite Stanton for contempt.
  - id: cong.the-candidate
    c: '*The Candidate* (Michael Ritchie dir., 1972)'
    n: A California Senate race. Jeremy Larner, McCarthy's speechwriter, wrote it.
  - id: cong.hearts-and-minds
    c: '*Hearts and Minds* (Peter Davis dir., 1974)'
    n: Vietnam at home and abroad.
  - id: cong.chisholm-72-unbought-and-unbossed
    c: '*Chisholm ''72: Unbought & Unbossed* (Shola Lynch dir., 2004)'
    n: Her campaign, with the footage.
