# Adm. I.B Stage and opera
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: I.B
entries:
  - id: adm.vidal-evening-with-richard
    c: Gore Vidal, *An Evening with Richard Nixon* (1972)
    n: Assembled largely from Nixon's own words. Broadway, April 1972.
  - id: adm.freed-secret-honor
    c: Donald Freed & Arnold M. Stone, *Secret Honor* (1983)
    n: One man, one night, a tape recorder. Filmed by Altman (I.C).
  - id: adm.adams-nixon-in-china
    c: John Adams & Alice Goodman, *Nixon in China* (Houston Grand Opera 1987)
    n: Libretto in couplets. Mao, Zhou, Chiang Ch'ing, Kissinger. The banquet toasts are close to the record.
  - id: adm.lees-nixons-nixon
    c: Russell Lees, *Nixon's Nixon* (1995)
    n: Nixon and Kissinger on the night of August 7, 1974. Mostly foreign policy, reenacted as a game.
  - id: adm.morgan-frost-nixon
    c: Peter Morgan, *Frost/Nixon* (2006)
    n: The 1977 interviews. The Watergate session is the climax; the rest is Cambodia and the man.
