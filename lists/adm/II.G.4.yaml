# Adm. II.G.4 The cabinet and the economy
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.G.4
entries:
  - id: adm.burns-arthur-f
    s: Burns, Arthur F.
    c: '*Inside the Nixon Administration: The Secret Diary of Arthur Burns, 1969–1974* (Robert H. Ferrell ed., 2010)'
    n: The Fed chairman's diary. Nixon leaning on him before 1972.
  - id: adm.connally-john
    s: Connally, John
    c: 'John Connally & Mickey Herskowitz, *In History''s Shadow: An American Odyssey* (1993)'
    n: Treasury and August 15, 1971. Also in the 1968 list.
  - id: adm.hickel-walter-j
    s: Hickel, Walter J.
    c: '*Who Owns America?* (1971)'
    n: Fired in November 1970 after his letter on Kent State.
  - id: adm.richardson-elliot-l
    s: Richardson, Elliot L.
    c:
      - '*The Creative Balance: Government, Politics, and the Individual in America''s Third Century* (1976)'
      - '*Reflections of a Radical Moderate* (1996)'
    n: Three cabinet posts under Nixon. Also Wg.
  - id: adm.rumsfeld-donald
    s: Rumsfeld, Donald
    c: '*Known and Unknown: A Memoir* (2011)'
    n: OEO, the Cost of Living Council, NATO. Also Opp.
  - id: adm.shultz-george-p
    s: Shultz, George P.
    c: George P. Shultz & Kenneth W. Dam, *Economic Policy Beyond the Headlines* (1977)
  - id: adm.stein-herbert
    s: Stein, Herbert
    c: '*Presidential Economics: The Making of Economic Policy from Roosevelt to Reagan and Beyond* (1984)'
    n: By the chairman of the Council of Economic Advisers. Dry wit.
  - id: adm.train-russell-e
    s: Train, Russell E.
    c: '*Politics, Pollution, and Pandas: An Environmental Memoir* (2003)'
    n: CEQ, then EPA.
  - id: adm.volcker-paul-a
    s: Volcker, Paul A.
    c: 'Paul A. Volcker & Toyoo Gyohten, *Changing Fortunes: The World''s Money and the Threat to American Leadership* (1992)'
    n: 'The closing of the gold window. Gyohten gives Tokyo''s side. Japanese edition: *Tomi no kōbō* 富の興亡 (1992). Check.'
  - id: adm.weinberger-caspar-w
    s: Weinberger, Caspar W.
    c: '*In the Arena: A Memoir of the 20th Century* (2001)'
    n: OMB and HEW.
