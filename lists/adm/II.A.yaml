# Adm. II.A The man and the White House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.A
entries:
  - id: adm.wills-nixon-agonistes-the
    c: 'Garry Wills, *Nixon Agonistes: The Crisis of the Self-Made Man* (1970)'
    n: The 1968 campaign and the first year. Also in the 1968 list.
  - id: adm.evans-nixon-in-the
    c: 'Rowland Evans Jr. & Robert D. Novak, *Nixon in the White House: The Frustration of Power* (1971)'
    n: The first two years, from the columnists' sources.
  - id: adm.drury-courage-and-hesitation
    c: 'Allen Drury, *Courage and Hesitation: Notes and Photographs on the Nixon Administration* (1971)'
    n: With photographs by Fred Maroon. Access journalism by a sympathizer; the access is the value.
  - id: adm.barber-presidential-character-predicting
    c: 'James David Barber, *The Presidential Character: Predicting Performance in the White House* (1972)'
    n: Active-negative. The prediction published before the break-in.
  - id: adm.mazlish-in-search-of
    c: 'Bruce Mazlish, *In Search of Nixon: A Psychohistorical Inquiry* (1972)'
  - id: adm.schlesinger-imperial-presidency
    c: Arthur M. Schlesinger Jr., *The Imperial Presidency* (1973)
    n: The frame the Congress adopted. Also Cong.
  - id: adm.nathan-plot-that-failed
    c: 'Richard P. Nathan, *The Plot That Failed: Nixon and the Administrative Presidency* (1975)'
    n: The second-term plan to run the government through loyalists in the departments.
  - id: adm.schell-time-of-illusion
    c: Jonathan Schell, *The Time of Illusion* (1976)
    n: The whole presidency as one argument about power and image. The last third is Watergate.
  - id: adm.brodie-richard-nixon-the
    c: 'Fawn M. Brodie, *Richard Nixon: The Shaping of His Character* (1981)'
    n: Psychobiography. Hostile.
  - id: adm.ambrose-nixon
    c: Stephen E. Ambrose, *Nixon* (1987–91)
    n: Three volumes; the second and third cover these years.
  - id: adm.parmet-richard-nixon-and
    c: Herbert S. Parmet, *Richard Nixon and His America* (1990)
  - id: adm.wicker-one-of-us
    c: 'Tom Wicker, *One of Us: Richard Nixon and the American Dream* (1991)'
    n: A liberal's appreciation of the domestic record.
  - id: adm.greene-limits-of-power
    c: 'John Robert Greene, *The Limits of Power: The Nixon and Ford Administrations* (1992)'
  - id: adm.aitken-nixon-a-life
    c: 'Jonathan Aitken, *Nixon: A Life* (1993)'
    n: Friendly. Aitken had interviews and papers others did not.
  - id: adm.hoff-nixon-reconsidered
    c: Joan Hoff, *Nixon Reconsidered* (1994)
    n: The domestic record argued up, the foreign record argued down.
  - id: adm.small-presidency-of-richard
    c: Melvin Small, *The Presidency of Richard Nixon* (1999)
  - id: adm.reeves-president-nixon-alone
    c: 'Richard Reeves, *President Nixon: Alone in the White House* (2001)'
    n: Day by day, from the documents and tapes. The best source for scene.
  - id: adm.mason-richard-nixon-and
    c: Robert Mason, *Richard Nixon and the Quest for a New Majority* (2004)
  - id: adm.black-richard-m-nixon
    c: 'Conrad Black, *Richard M. Nixon: A Life in Full* (2007)'
    n: Long and admiring.
  - id: adm.perlstein-nixonland-the-rise
    c: 'Rick Perlstein, *Nixonland: The Rise of a President and the Fracturing of America* (2008)'
    n: 1965–72. The country more than the White House. Also Cong.
  - id: adm.a-companion-to-richard-m
    c: '*A Companion to Richard M. Nixon* (Melvin Small ed., 2011)'
    n: Historiographical essays by subject. Useful for finding the monographs.
  - id: adm.thomas-being-nixon-a
    c: 'Evan Thomas, *Being Nixon: A Man Divided* (2015)'
  - id: adm.weiner-one-man-against
    c: 'Tim Weiner, *One Man Against the World: The Tragedy of Richard Nixon* (2015)'
    n: War and secrecy. Much of it Watergate.
  - id: adm.farrell-richard-nixon-the
    c: 'John A. Farrell, *Richard Nixon: The Life* (2017)'
    n: The standard one-volume life. Chennault documented.
