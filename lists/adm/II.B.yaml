# Adm. II.B Vietnam, Cambodia, and Laos
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.B
entries:
  - id: adm.shawcross-sideshow-kissinger-nixon
    c: 'William Shawcross, *Sideshow: Kissinger, Nixon and the Destruction of Cambodia* (1979)'
    n: The secret bombing and the 1970 invasion. Kissinger's reply is in *Years of Upheaval*.
  - id: adm.hung-palace-file
    c: Nguyen Tien Hung & Jerrold L. Schecter, *The Palace File* (1986)
    n: Nixon's private promises to Thiệu, with the letters.
  - id: adm.loi-le-duc-tho
    c: Lưu Văn Lợi & Nguyễn Anh Vũ, *Le Duc Tho–Kissinger Negotiations in Paris* (1996)
    n: Hanoi's official account, published in Hanoi in English. Check the Vietnamese original.
  - id: adm.kimball-nixons-vietnam-war
    c: Jeffrey Kimball, *Nixon's Vietnam War* (1998)
    n: The madman theory taken seriously.
  - id: adm.sorley-better-war-the
    c: 'Lewis Sorley, *A Better War: The Unexamined Victories and Final Tragedy of America''s Last Years in Vietnam* (1999)'
  - id: adm.berman-no-peace-no
    c: 'Larry Berman, *No Peace, No Honor: Nixon, Kissinger, and Betrayal in Vietnam* (2001)'
  - id: adm.asselin-bitter-peace-washington
    c: 'Pierre Asselin, *A Bitter Peace: Washington, Hanoi, and the Making of the Paris Agreement* (2002)'
    n: From Vietnamese sources.
  - id: adm.kissinger-ending-the-vietnam
    c: 'Henry Kissinger, *Ending the Vietnam War: A History of America''s Involvement in and Extrication from the Vietnam War* (2003)'
    n: Extracted from his memoirs, with additions.
  - id: adm.kimball-vietnam-war-files
    c: 'Jeffrey Kimball, *The Vietnam War Files: Uncovering the Secret History of Nixon-Era Strategy* (2004)'
    n: Documents with commentary.
  - id: adm.nguyen-hanois-war-an
    c: 'Lien-Hang T. Nguyen, *Hanoi''s War: An International History of the War for Peace in Vietnam* (2012)'
    n: Lê Duẩn's war. Vietnamese archives.
  - id: adm.hughes-fatal-politics-the
    c: 'Ken Hughes, *Fatal Politics: The Nixon Tapes, the Vietnam War, and the Casualties of Reelection* (2015)'
    n: The "decent interval" timed to the 1972 election, from the tapes.
