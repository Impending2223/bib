# Adm. II.C The world
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.C
entries:
  - id: adm.szulc-illusion-of-peace
    c: 'Tad Szulc, *The Illusion of Peace: Foreign Policy in the Nixon Years* (1978)'
  - id: adm.destler-textile-wrangle-conflict
    c: 'I.M. Destler, Haruhiro Fukui & Hideo Sato, *The Textile Wrangle: Conflict in Japanese-American Relations, 1969–1971* (1979)'
    n: Okinawa for textiles, as Tokyo understood it and Washington remembered it.
  - id: adm.hersh-price-of-power
    c: 'Seymour M. Hersh, *The Price of Power: Kissinger in the Nixon White House* (1983)'
    n: The case against, with the wiretaps.
  - id: adm.garthoff-detente-and-confrontation
    c: 'Raymond L. Garthoff, *Détente and Confrontation: American-Soviet Relations from Nixon to Reagan* (1985; rev. ed. 1994)'
    n: By a SALT negotiator. Encyclopedic.
  - id: adm.isaacson-kissinger-a-biography
    c: 'Walter Isaacson, *Kissinger: A Biography* (1992)'
  - id: adm.tasaku-nakarishi-o
    c: Wakaizumi Kei 若泉敬, *Tasaku nakarishi o shinzemu to hossu* 他策ナカリシヲ信ゼムト欲ス (1994)
    n: Sato's secret envoy on the 1969 Okinawa agreement and its nuclear minute. Translated as *The Best Course Available* (2002).
  - id: adm.the-kissinger-transcripts-the-top
    c: '*The Kissinger Transcripts: The Top Secret Talks with Beijing and Moscow* (William Burr ed., 1998)'
  - id: adm.jian-maos-china-and
    c: Chen Jian, *Mao's China and the Cold War* (2001)
    n: The rapprochement from Beijing.
  - id: adm.kornbluh-pinochet-file-a
    c: 'Peter Kornbluh, *The Pinochet File: A Declassified Dossier on Atrocity and Accountability* (2003)'
    n: Track II and the coup of 1973.
  - id: adm.hanhimaki-flawed-architect-henry
    c: 'Jussi M. Hanhimäki, *The Flawed Architect: Henry Kissinger and American Foreign Policy* (2004)'
  - id: adm.dallek-nixon-and-kissinger
    c: 'Robert Dallek, *Nixon and Kissinger: Partners in Power* (2007)'
  - id: adm.macmillan-nixon-and-mao
    c: 'Margaret MacMillan, *Nixon and Mao: The Week That Changed the World* (2007)'
  - id: adm.bass-blood-telegram-nixon
    c: 'Gary J. Bass, *The Blood Telegram: Nixon, Kissinger, and a Forgotten Genocide* (2013)'
    n: Bangladesh, 1971, and the tilt.
