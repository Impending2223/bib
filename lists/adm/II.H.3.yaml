# Adm. II.H.3 Reports and memoranda
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.H.3
entries:
  - id: adm.16-1970
    c: Memorandum from Daniel P. Moynihan to the President (Jan. 16, 1970)
    n: '"Benign neglect." Leaked in March.'
  - id: adm.the-report-of-the-presidents
    c: '*The Report of the President''s Commission on an All-Volunteer Armed Force* (1970)'
    n: The Gates Commission.
  - id: adm.1970
    c: Memorandum from Tom Charles Huston to H.R. Haldeman (July 1970)
    n: The Huston Plan and its cover note. Approved and withdrawn within weeks. Printed in the Church Committee record.
  - id: adm.the-report-of-the-presidents-2
    c: '*The Report of the President''s Commission on Campus Unrest* (1970)'
    n: The Scranton Commission. Kent State and Jackson State.
  - id: adm.the-pentagon-papers-as-published
    c: '*The Pentagon Papers as Published by The New York Times* (Neil Sheehan et al. eds., 1971)'
    n: The Gravel edition (1971) is fuller.
  - id: adm.abuse-marihuana-a-signal
    c: 'National Commission on Marihuana and Drug Abuse, *Marihuana: A Signal of Misunderstanding* (1972)'
    n: 'The Shafer Commission''s first report. Recommended decriminalizing possession. Nixon rejected it. *Drug Use in America: Problem in Perspective* (1973) is the second.'
  - id: adm.foreign-relations-of-the-united
    c: '*Foreign Relations of the United States, 1969–1976* (2003–)'
    n: Online at [history.state.gov](https://history.state.gov). The China, Vietnam, South Asia, Chile, and 1973 war volumes carry memoranda of conversation and telephone transcripts.
  - id: adm.soviet-american-relations-the-detente
    c: '*Soviet-American Relations: The Détente Years, 1969–1972* (Edward C. Keefer, David C. Geyer & Douglas E. Selvage eds., 2007)'
    n: American and Soviet records of the same meetings, side by side.
  - id: adm.public-papers-of-the-presidents
    c: '*Public Papers of the Presidents of the United States: Richard Nixon* (1969–74)'
    n: Six volumes. Speeches, press conferences, messages.
