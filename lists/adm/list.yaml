  - id: p2
    num: II.
    title: Sources
    logic:
      - 'Works and records to draw facts and voices from. Eleven sections, from the most digested to the least: A. The man and the White House. B. Vietnam, Cambodia, and Laos. C. The world. D. The home front. E. Law, the Court, and domestic security. F. The vice presidents. G. Memoirs and biographies. H. Documents. I. Recordings. J. The tapes. K. Archives. Sections A through F are chronological by first publication.'
