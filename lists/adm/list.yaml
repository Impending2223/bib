# Adm.: page text and outline. Entries live in the files named by 'file'.
page_title: 'Nixon Administration, 1969–1974: Bibliography'
h1: 'Richard Nixon and his administration, 1969–1974: working bibliography'
lede: Sources, portrayals, and names for the Nixon presidency, from the inauguration of January 20, 1969, to the resignation of August 9, 1974, less Watergate.
logic:
  - 'Second of four lists. This one is Adm. The others: the Republican opposition, 1961–69 (Opp.); Congress, the nation, and the states, 1969–74 (Cong.); and Watergate (Wg.). Cross-references give list and section. Part I lists portrayals, Part II sources, Part III names. Unless a section says otherwise, entries run in chronological order. Where my knowledge is thin, the entry says so. "Check" marks a detail to verify.'
  - 'The Watergate rule. Wg. holds what exists only because of the scandal: the break-in of June 17, 1972; the covert operations from the White House and the Committee to Re-elect that led to it (the Plumbers, the Fielding break-in, Gemstone, Segretti); and everything that followed its discovery, through the pardon. Nothing of that kind appears here. What stands on its own stays here even where the investigators swept it in: the Kissinger wiretaps, the Huston Plan, ITT, the milk fund, the President''s taxes, Agnew. General works stay here too; where Watergate is most of a general book, the note says so. A person whose part in the period was only Watergate appears only in Wg.; one with another part appears in both.'
