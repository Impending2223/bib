# Adm. I.C Film and television
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: I.C
entries:
  - id: adm.antonio-millhouse-a-white
    c: 'Emile de Antonio, *Millhouse: A White Comedy* (1971)'
    n: Documentary collage, from the Checkers speech to the first term.
  - id: adm.washington-behind-closed-doors
    c: '*Washington: Behind Closed Doors* (ABC 1977)'
    n: Miniseries from *The Company*. Jason Robards as Monckton.
  - id: adm.secret-honor
    c: '*Secret Honor* (Robert Altman dir., 1984)'
    n: Philip Baker Hall.
  - id: adm.kissinger-and-nixon
    c: '*Kissinger and Nixon* (TNT 1995)'
    n: The Paris negotiations. Ron Silver and Beau Bridges.
  - id: adm.nixon
    c: '*Nixon* (Oliver Stone dir., 1995)'
    n: Anthony Hopkins. Conspiracy-minded; the family scenes are the best of it.
  - id: adm.the-pentagon-papers
    c: '*The Pentagon Papers* (FX 2003)'
    n: James Spader as Ellsberg.
  - id: adm.frost-nixon
    c: '*Frost/Nixon* (Ron Howard dir., 2008)'
    n: Frank Langella.
  - id: adm.nixons-the-one
    c: '*Nixon''s the One* (Sky Arts 2008)'
    n: Harry Shearer performs tape transcripts verbatim. Check the year.
  - id: adm.our-nixon
    c: '*Our Nixon* (Penny Lane dir., 2013)'
    n: Home movies shot by Haldeman, Ehrlichman, and Chapin, seized in 1973.
  - id: adm.nixon-by-nixon-in-his
    c: '*Nixon by Nixon: In His Own Words* (HBO 2014)'
    n: The tapes, cut together.
  - id: adm.elvis-and-nixon
    c: '*Elvis & Nixon* (Liza Johnson dir., 2016)'
    n: December 21, 1970. Krogh's book (II.G.2) is the record.
  - id: adm.the-post
    c: '*The Post* (Steven Spielberg dir., 2017)'
    n: The Pentagon Papers from the *Washington Post* side, which was the lesser side.
  - id: adm.tricky-dick
    c: '*Tricky Dick* (CNN 2019)'
    n: Documentary series. Four parts; the tapes and the archival footage are well chosen.
