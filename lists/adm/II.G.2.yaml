# Adm. II.G.2 The White House
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.G.2
entries:
  - id: adm.buchanan-patrick-j
    s: Buchanan, Patrick J.
    c: '*Nixon''s White House Wars: The Battles That Made and Broke a President and Divided America Forever* (2017)'
    n: The Agnew speeches and the right-flank memos. Opp. II.E for the comeback.
  - id: adm.butterfield-alexander-p
    s: Butterfield, Alexander P.
    c: Bob Woodward, *The Last of the President's Men* (2015)
    n: The office outside the Oval Office. The taping system's revelation is in Wg.
  - id: adm.chapin-dwight-l
    s: Chapin, Dwight L.
    c: '*The President''s Man: The Memoirs of Nixon''s Trusted Aide* (2022)'
    n: The China advance work. Also Wg.
  - id: adm.ehrlichman-john-d
    s: Ehrlichman, John D.
    c: '*Witness to Power: The Nixon Years* (1982)'
    n: Sharp portraits. The domestic side from its chief.
  - id: adm.garment-leonard
    s: Garment, Leonard
    c: '*Crazy Rhythm: My Journey from Brooklyn, Jazz, and Wall Street to Nixon''s White House, Watergate, and Beyond* (1997)'
    n: The liberal in the house. Civil rights, the arts, Indian affairs.
  - id: adm.haldeman-h-r
    s: Haldeman, H.R.
    c: '*The Haldeman Diaries: Inside the Nixon White House* (1994)'
    n: Daily from January 1969. The published book is an abridgment; the complete text came out on CD-ROM. *The Ends of Power* is in Wg.
  - id: adm.klein-herbert-g
    s: Klein, Herbert G.
    c: '*Making It Perfectly Clear* (1980)'
    n: Director of communications.
  - id: adm.krogh-egil
    s: Krogh, Egil
    c: '*The Day Elvis Met Nixon* (1994)'
    n: Also Wg.
  - id: adm.moynihan-daniel-patrick
    s: Moynihan, Daniel Patrick
    c: '*Daniel Patrick Moynihan: A Portrait in Letters of an American Visionary* (Steven R. Weisman ed., 2010)'
    n: His memos to Nixon are the best prose the administration produced.
  - id: adm.price-raymond-k-jr
    s: Price, Raymond K., Jr.
    c: '*With Nixon* (1977)'
    n: The speechwriter who wrote the resignation speech.
  - id: adm.safire-william
    s: Safire, William
    c: '*Before the Fall: An Inside View of the Pre-Watergate White House* (1975)'
    n: The speechwriter's book. Anecdotal and fair.
