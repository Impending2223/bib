    s: Rehnquist, William H.
    r: Assistant attorney general, Office of Legal Counsel, 1969–71; Justice from 1972
    n: Defended the administration's surveillance position before Senator Ervin. Also Cong.
  - id: adm.who.sullivan-william-c
    s: Sullivan, William C.
