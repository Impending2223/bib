    s: Kleindienst, Richard G.
    r: Deputy Attorney General; Attorney General, 1972–73
    n: 'Voice: memoir (II.G.5). Also Wg.'
  - id: adm.who.mitchell-john-n
    s: Mitchell, John N.
    r: Attorney General, 1969–72; campaign manager, 1972
    n: 'Voice: tapes; Rosen (II.G.5). Also Wg.'
