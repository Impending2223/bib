# Adm. I.A Fiction
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: I.A
entries:
  - id: adm.roth-our-gang-starring
    c: Philip Roth, *Our Gang (Starring Tricky and His Friends)* (1971)
    n: Trick E. Dixon on abortion and the rights of the unborn. Written in 1971, before the break-in.
  - id: adm.ehrlichman-company
    c: John Ehrlichman, *The Company* (1976)
    n: 'President Richard Monckton and a CIA director who knows too much. Adapted as *Washington: Behind Closed Doors* (I.C).'
  - id: adm.agnew-canfield-decision
    c: Spiro T. Agnew, *The Canfield Decision* (1976)
    n: A vice president's novel by a vice president. Known to me only as a bibliographic fact.
  - id: adm.safire-full-disclosure
    c: William Safire, *Full Disclosure* (1977)
    n: By a Nixon speechwriter. Also in the 1968 list.
  - id: adm.coover-public-burning
    c: Robert Coover, *The Public Burning* (1977)
    n: The Rosenberg executions, narrated in part by Vice President Nixon. The Nixon of 1953; the voice is all there.
  - id: adm.ehrlichman-china-card
    c: John Ehrlichman, *The China Card* (1986)
    n: The opening to China as a thriller, by a man who was in the room for some of it.
