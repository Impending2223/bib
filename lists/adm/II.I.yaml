    n: Live by satellite.
  - id: adm.richard-m-nixon-address-to
    c: Richard M. Nixon, address to a joint session on the Moscow summit (June 1, 1972)
  - id: adm.richard-m-nixon-address-on-4
    c: Richard M. Nixon, address on Vietnam and the Paris agreement (Jan. 23, 1973)
  - id: adm.spiro-t-agnew-address-to
    c: Spiro T. Agnew, address to the nation on his resignation (Oct. 15, 1973)
  - id: adm.richard-m-nixon-address-on-5
    c: Richard M. Nixon, address on the energy emergency (Nov. 7, 1973)
    n: Project Independence.
  - id: adm.nixon-nixon-interviews
    c: Richard M. Nixon & David Frost, *The Nixon Interviews* (1977)
    n: Four broadcasts; the full tapes are longer. Watergate is one of the four.
  - id: adm.richard-m-nixon-and-frank
    c: Richard M. Nixon & Frank Gannon, interviews (1983)
    n: About thirty hours, unedited. Check. At the University of Georgia.
