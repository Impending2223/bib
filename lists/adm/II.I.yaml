    c: Spiro T. Agnew, speech on television news, Des Moines (Nov. 13, 1969)
    n: Carried live by the networks it attacked. Written by Buchanan.
  - id: adm.richard-m-nixon-address-on-2
    c: Richard M. Nixon, address on Cambodia (Apr. 30, 1970)
  - id: adm.richard-m-nixon-visit-to
    c: Richard M. Nixon, visit to protesters at the Lincoln Memorial (May 9, 1970)
    n: Before dawn. Known from Nixon's own memo and from Krogh.
  - id: adm.richard-m-nixon-address-on-3
    c: Richard M. Nixon, address on the economy (Aug. 15, 1971)
    n: The freeze and the gold window. Preempted *Bonanza*.
  - id: adm.richard-m-nixon-announcement-of
    c: Richard M. Nixon, announcement of the China trip, Burbank (July 15, 1971)
