    c: Richard M. Nixon, first inaugural address (Jan. 20, 1969)
    n: '"To lower our voices."'
  - id: adm.richard-m-nixon-remarks-guam
    c: Richard M. Nixon, remarks, Guam (July 25, 1969)
    n: The Nixon Doctrine, given as background to reporters.
  - id: adm.richard-m-nixon-address-on
    c: Richard M. Nixon, address on Vietnam (Nov. 3, 1969)
    n: '"The great silent majority."'
