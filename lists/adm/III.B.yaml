# Adm. III.B White House staff
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: III.B
entries:
  - id: adm.who.buchanan-patrick-j
    s: Buchanan, Patrick J.
    r: Speechwriter and adviser
    n: 'Wrote for Agnew and for the right. Voice: memoirs (II.G.2); *Firing Line*; decades on television.'
  - id: adm.who.butterfield-alexander-p
    s: Butterfield, Alexander P.
    r: Deputy assistant, 1969–73
    n: 'Installed the taping system. Voice: Woodward (II.G.2). Also Wg.'
  - id: adm.who.chapin-dwight-l
    s: Chapin, Dwight L.
    r: Appointments secretary
    n: Also Wg.
  - id: adm.who.colson-charles-w
    s: Colson, Charles W.
    r: Special counsel, 1969–73
    n: Liaison to labor and the ethnic vote; the hardhats. Also Wg.
  - id: adm.who.dean-john-w-iii
    s: Dean, John W., III
    r: Associate deputy attorney general, 1969–70; Counsel to the President from July 1970
    n: 'Worked the crime bills at Justice before the White House. Voice: tapes; *The Rehnquist Choice* (II.E). Also Wg.'
  - id: adm.who.ehrlichman-john-d
    s: Ehrlichman, John D.
    r: Counsel, 1969; assistant for domestic affairs, 1969–73
    n: 'Voice: memoir (II.G.2); tapes. Also Wg.'
  - id: adm.who.garment-leonard
    s: Garment, Leonard
    r: Special consultant; Counsel from 1973
    n: 'Voice: memoir (II.G.2). Also Wg.'
  - id: adm.who.haig-alexander-m-jr
    s: Haig, Alexander M., Jr.
    r: Kissinger's deputy; Army vice chief of staff; chief of staff from May 1973
    n: 'Voice: memoir (II.G.3); tapes. Also Wg.'
  - id: adm.who.haldeman-h-r
    s: Haldeman, H.R.
    r: Chief of staff, 1969–73
    n: 'Voice: diaries (II.G.2); home movies (*Our Nixon*); tapes. Also Wg.'
  - id: adm.who.harlow-bryce-n
    s: Harlow, Bryce N.
    r: Congressional liaison; counselor
    n: 'Eisenhower''s man on the Hill. Voice: oral histories.'
  - id: adm.who.huebner-lee-w
    s: Huebner, Lee W.
    r: Speechwriter
    n: Ripon's first generation in the White House. Also Opp.
  - id: adm.who.huston-tom-charles
    s: Huston, Tom Charles
    r: Staff assistant
    n: Former YAF chairman. The 1970 plan bears his name.
  - id: adm.who.klein-herbert-g
    s: Klein, Herbert G.
    r: Director of communications
    n: 'Voice: memoir (II.G.2).'
  - id: adm.who.moynihan-daniel-patrick
    s: Moynihan, Daniel Patrick
    r: Assistant for urban affairs; Counselor, 1969–70
    n: 'Voice: letters (II.G.2); decades in the Senate.'
  - id: adm.who.price-raymond-k-jr
    s: Price, Raymond K., Jr.
    r: Chief speechwriter
    n: 'Voice: *With Nixon* (II.G.2).'
  - id: adm.who.safire-william
    s: Safire, William
    r: Speechwriter, 1969–73
    n: 'Voice: *Before the Fall*; the *New York Times* column from 1973.'
  - id: adm.who.whitaker-john-c
    s: Whitaker, John C.
    r: Cabinet secretary; environmental policy
    n: 'Voice: *Striking a Balance* (II.D).'
  - id: adm.who.ziegler-ronald-l
    s: Ziegler, Ronald L.
    r: Press secretary
    n: 'Voice: briefings on the network news. Also Wg.'
