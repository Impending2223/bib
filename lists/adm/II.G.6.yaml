  - id: adm.bui-diem
    s: Bui Diem
    c: Bui Diem with David Chanoff, *In the Jaws of History* (1987)
    n: Saigon's ambassador in Washington to 1972.
  - id: adm.dobrynin-anatoly
    s: Dobrynin, Anatoly
    c: '*In Confidence: Moscow''s Ambassador to America''s Six Cold War Presidents* (1995)'
    n: 'The back channel from the other end. Russian: *Sugubo doveritel''no* Сугубо доверительно (1996).'
  - id: adm.gromyko-andrei
    s: Gromyko, Andrei
    c: '*Pamyatnoe* Памятное (1988)'
    n: Translated as *Memories* (1989).
  - id: adm.huang-hua
    s: Huang Hua 黄华
    c: '*Qinli yu jianwen* 亲历与见闻 (2007)'
    n: The first PRC ambassador to the UN, 1971. Translated as *Memoirs* (2008). Check the Chinese date.
  - id: adm.rabin-yitzhak
    s: Rabin, Yitzhak
    c: '*Pinkas sherut* פנקס שירות (1979)'
    n: Ambassador in Washington, 1968–73. Translated as *The Rabin Memoirs* (1979).
  - id: adm.sadat-anwar
    s: Sadat, Anwar
    c: '*al-Baḥth ʻan al-dhāt* البحث عن الذات (1978)'
    n: Translated as *In Search of Identity* (1978). 1973 and the Kissinger shuttles.
  - id: adm.sato-eisaku
    s: Satō Eisaku 佐藤榮作
    c: '*Satō Eisaku nikki* 佐藤榮作日記 (1997–99)'
    n: Six volumes. Okinawa, the textile wrangle, and the Nixon shocks from the prime minister's desk.
  - id: adm.zhou-enlai
    s: Zhou Enlai 周恩来
    c: '*Zhou Enlai nianpu 1949–1976* 周恩来年谱 1949–1976 (Zhonggong zhongyang wenxian yanjiushi 中共中央文献研究室 ed., 1997)'
    n: Three volumes. The Kissinger and Nixon meetings, day by day, from the Party's side. *Mao Zedong nianpu 1949–1976* 毛泽东年谱 1949–1976 (2013) does the same for Mao.
