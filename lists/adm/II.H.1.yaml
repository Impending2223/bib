# Adm. II.H.1 Cases
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: adm
section: II.H.1
entries:
  - id: adm.alexander-v-holmes-county-board
    c: '*Alexander v. Holmes County Board of Education*, [396 U.S. 19](https://tile.loc.gov/storage-services/service/ll/usrep/usrep396/usrep396019/usrep396019.pdf) (1969)'
    n: The administration asked for delay in Mississippi. The Court ordered desegregation "at once."
  - id: adm.contractors-assn-of-eastern-pennsylvania
    c: '*Contractors Ass''n of Eastern Pennsylvania v. Secretary of Labor*, [442 F.2d 159](https://static.case.law/f2d/442/case-pdfs/0159-01.pdf) (3d Cir. 1971)'
    n: The Philadelphia Plan upheld.
  - id: adm.swann-v-charlotte-mecklenburg-board
    c: '*Swann v. Charlotte-Mecklenburg Board of Education*, [402 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep402/usrep402001/usrep402001.pdf) (1971)'
    n: Busing as a remedy. Nixon's answer was a moratorium bill. Also Cong.
  - id: adm.new-york-times-co-v
    c: '*New York Times Co. v. United States*, [403 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep403/usrep403713/usrep403713.pdf) (1971)'
    n: The Pentagon Papers. Nine opinions. Also Cong.
  - id: adm.united-states-v-u-s
    c: '*United States v. U.S. District Court*, [407 U.S. 297](https://tile.loc.gov/storage-services/service/ll/usrep/usrep407/usrep407297/usrep407297.pdf) (1972)'
    n: The *Keith* case. No warrantless wiretaps for domestic security. Decided two days after the break-in.
  - id: adm.laird-v-tatum
    c: '*Laird v. Tatum*, [408 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep408/usrep408001/usrep408001.pdf) (1972)'
    n: Army surveillance of civilians. No standing.
  - id: adm.halperin-v-kissinger
    c: '*Halperin v. Kissinger*, [606 F.2d 1192](https://static.case.law/f2d/606/case-pdfs/1192-01.pdf) (D.C. Cir. 1979)'
    n: The NSC aide wiretapped from 1969 sues. Affirmed by an equally divided Court, [452 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep452/usrep452713/usrep452713.pdf) (1981).
  - id: adm.nixon-v-administrator-of-general
    c: '*Nixon v. Administrator of General Services*, [433 U.S. 425](https://tile.loc.gov/storage-services/service/ll/usrep/usrep433/usrep433425/usrep433425.pdf) (1977)'
    n: The papers and tapes kept by statute. Why the tapes are public.
  - id: adm.nixon-v-fitzgerald
    c: '*Nixon v. Fitzgerald*, [457 U.S. 731](https://tile.loc.gov/storage-services/service/ll/usrep/usrep457/usrep457731/usrep457731.pdf) (1982)'
    n: Absolute immunity from damages. Fitzgerald, the Air Force analyst who testified on C-5A overruns, was fired in 1970.
