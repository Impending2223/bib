  - id: adm.musto-quest-for-drug
    c: 'David F. Musto & Pamela Korsmeyer, *The Quest for Drug Control: Politics and Federal Policy in a Period of Increasing Substance Abuse, 1963–1981* (2002)'
    n: From the White House files. The drafting of the Controlled Substances Act and the Shafer Commission.
  - id: adm.bonastia-knocking-on-the
    c: 'Christopher Bonastia, *Knocking on the Door: The Federal Government''s Attempt to Desegregate the Suburbs* (2006)'
