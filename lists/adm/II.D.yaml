  - id: adm.moynihan-politics-of-a
    c: 'Daniel P. Moynihan, *The Politics of a Guaranteed Income: The Nixon Administration and the Family Assistance Plan* (1973)'
    n: By its author, on its defeat.
  - id: adm.burke-nixons-good-deed
    c: 'Vincent J. Burke & Vee Burke, *Nixon''s Good Deed: Welfare Reform* (1974)'
  - id: adm.whitaker-striking-a-balance
    c: 'John C. Whitaker, *Striking a Balance: Environment and Natural Resources Policy in the Nixon-Ford Years* (1976)'
    n: By the White House staffer who ran it.
  - id: adm.epstein-agency-of-fear
    c: 'Edward Jay Epstein, *Agency of Fear: Opiates and Political Power in America* (1977)'
    n: The drug war as an instrument of domestic control. Argued, not proved.
  - id: adm.matusow-nixons-economy-booms
    c: 'Allen J. Matusow, *Nixon''s Economy: Booms, Busts, Dollars, and Votes* (1998)'
