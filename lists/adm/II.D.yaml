  - id: adm.massing-fix
    c: Michael Massing, *The Fix* (1998)
    n: Nixon's drug policy spent most of its money on treatment. Jaffe's program at the center.
  - id: adm.flippen-nixon-and-the
    c: J. Brooks Flippen, *Nixon and the Environment* (2000)
  - id: adm.kotlowski-nixons-civil-rights
    c: 'Dean J. Kotlowski, *Nixon''s Civil Rights: Politics, Principle, and Policy* (2001)'
