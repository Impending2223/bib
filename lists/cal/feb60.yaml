# Cal. III February 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: III
entries:
  - id: cal.1960-02-01.sit-ins
    when: Feb. 1–13
    date: '1960-02-01'
    thread: sit-ins
    also: [civil-rights-organizations]
    c: 'Four freshmen of North Carolina A&T sit at the Woolworth''s lunch counter in Greensboro and are not served. They return each day with more; Kress''s too. Feb. 8–13: sit-ins in Durham, Winston-Salem, Charlotte, Raleigh; Hampton; Rock Hill, S.C.; Nashville.'
    n: 'Check: the dates of the other cities. [[w.chafe-civilities-and-civil-rights]]; [[w.schmidt-sit-ins]]; [[w.morris-origins-of-the-civil]]; [[w.halberstam-children]]; [[w.carson-in-struggle]]; [[w.branch-parting-the-waters]]; [[w.lewis-walking-with-the-wind]]; [[w.meier-core]]; [[w.anderson-movement-and-the-sixties]].'
  - id: cal.1960-02-02.states-and-cities
    when: Feb. 2
    date: '1960-02-02'
    thread: states-and-cities
    also: [voting-rights]
    c: 'Senate passes S.J. Res. 39, [70–18](https://voteview.com/rollcall/RS0860222): governors to fill House vacancies by temporary appointment; with Holland''s amendment barring the poll tax in federal elections, [72–16](https://voteview.com/rollcall/RS0860219), and Keating''s giving the District of Columbia electors for President, [63–25](https://voteview.com/rollcall/RS0860221).'
    n: 'S.J. Res. 39, 86th Cong., as finally passed: [74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf). [[w.kyvig-explicit-and-authentic-acts]]; [[w.lawson-black-ballots]]. Names: Keating (Opp. III.B).'
    tags: [name:holland-spessard-l, name:keating-kenneth-b]
  - id: cal.1960-02-04.school-aid
    when: Feb. 4
    date: '1960-02-04'
    thread: school-aid
    c: 'Senate passes S. 8, school construction grants, [51–34](https://voteview.com/rollcall/RS0860230). Feb. 3: an amendment for construction or teachers'' salaries fails [44–44](https://voteview.com/rollcall/RS0860225); Nixon''s vote breaks the tie on Dirksen''s motion to table reconsideration, [44–44](https://voteview.com/rollcall/RS0860226). Feb. 4: Clark''s amendment, construction or salaries for two years, carried, [54–35](https://voteview.com/rollcall/RS0860227); Morse''s loans to private schools beaten, [37–49](https://voteview.com/rollcall/RS0860228).'
    n: 'S. 8, 86th Cong. [[w.munger-national-politics-and-federal]]; [[w.sundquist-politics-and-policy]]; [[w.graham-uncertain-triumph]]. Names: Nixon (Opp. III.E); Dirksen (Opp. III.A); Clark, Morse (K–J Cong. III.B).'
    tags: [name:nixon-richard-m, name:dirksen-everett, name:clark-joseph-s, name:morse-wayne]
  - id: cal.1960-02-04.elections-1960
    when: Feb. 4
    date: '1960-02-04'
    thread: elections-1960
    c: Kennedy to enter the West Virginia primary against Humphrey.
    n: '[West Virginia Primary Announcement](https://www.jfklibrary.org/node/13481) (Feb. 4, 1960), JFK Library. [[w.fleming-kennedy-vs-humphrey-west]]. See [[cal.1960-01-14.elections-1960]]. Names: Kennedy (Viet. III.A); Humphrey (K–J Cong. III.A).'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h]
  - id: cal.1960-02-04.cuba
    when: Feb. 4–13
    date: '1960-02-04'
    thread: cuba
    also: [soviet-union]
    c: 'Mikoyan in Havana, opening the Soviet exhibition. Feb. 13: Soviet–Cuban trade agreement; $100 million in credits; five million tons of sugar. Dulles to the NSC, Feb. 18: the Soviet Union has taken up Castro.'
    n: '[FRUS 1958–60, VI, doc. 456](https://history.state.gov/historicaldocuments/frus1958-60v06/d456) (NSC, Feb. 18). Check: the sugar''s term in years. [[w.fursenko-one-hell-of-a]]; [[w.paterson-contesting-castro]]; [[w.fursenko-khrushchevs-cold-war]]. Names: Mikoyan, Castro (K–J Adm. III.J); Dulles (K–J Adm. III.I).'
    tags: [name:mikoyan-anastas, name:castro-fidel, name:dulles-allen-w]
  - id: cal.1960-02-05.voting-rights
    when: Feb. 5
    date: '1960-02-05'
    thread: voting-rights
    c: 'Rogers to the Senate Rules Committee for the administration''s voting referees: federal courts, finding a pattern of discrimination, to appoint referees to register qualified Negroes for federal and state elections. Against the Civil Rights Commission''s registrars named by the President.'
    n: '[Testimony of Attorney General William P. Rogers before the Senate Rules and Administration Committee](https://www.justice.gov/sites/default/files/ag/legacy/2011/09/12/02-05-1960.pdf) (Feb. 5, 1960). Eisenhower on the plan: [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-242) (Jan. 26, 1960). [[w.berman-bill-becomes-a-law]]; [[w.caro-master-of-the-senate]]; [[w.mann-walls-of-jericho]]; [[w.finley-delaying-the-dream]]; [[w.burk-eisenhower-administration-and-black]]; [[w.nichols-matter-of-justice]]; [[w.lawson-black-ballots]]; [[w.graham-civil-rights-era]]; [[w.wawro-filibuster]]; [[w.dallek-lone-star-rising]]. Names: Rogers (Adm. III.D).'
    tags: [name:rogers-william-p]
  - id: cal.1960-02-07.program
    when: Feb. 7
    date: '1960-02-07'
    thread: program
    c: 'The President''s Commission on National Goals named, under the American Assembly, Wriston chairman: goals for the next decade. Privately financed. Its report, *Goals for Americans*, in November.'
    n: '[Memorandum Concerning the Commission on National Goals](https://www.presidency.ucsb.edu/documents/memorandum-concerning-the-commission-national-goals); [Letter to Dr. Henry Wriston](https://www.presidency.ucsb.edu/documents/letter-dr-henry-wriston-his-acceptance-the-chairmanship-the-commission-national-goals) (released Feb. 7, 1960). [[w.goals-goals-for-americans]]. Check: the American Assembly and the private funds. See [[cal.1960-01-07.program]]. Names: Eisenhower (Opp. III.E); Wriston (K–J Cong. III.K).'
    tags: [name:eisenhower-dwight-d, name:wriston-henry-m]
  - id: cal.1960-02-09.farm
    when: Feb. 9
    date: '1960-02-09'
    thread: farm
    c: Farm message. $3.5 billion tied up in wheat. Wheat allotments and quotas to end with the 1961 crop, supports to follow market prices; the Conservation Reserve to 60 million acres. Any sound plan of Congress's own to be approved.
    n: '[Special Message to the Congress on Agriculture](https://www.presidency.ucsb.edu/documents/special-message-the-congress-agriculture-2) (Feb. 9, 1960). [[w.benson-cross-fire]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:benson-ezra-taft]
  - id: cal.1960-02-11.testing
    when: Feb. 11
    date: '1960-02-11'
    thread: testing
    c: At Geneva the United States proposes a ban on tests in the atmosphere, the oceans, the parts of space that can be policed, and underground above a threshold, 4.75 on the seismic scale; smaller underground tests left to joint research. Eisenhower reads it at his press conference.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-215) (Feb. 11, 1960). FRUS 1958–60, III, docs. [242](https://history.state.gov/historicaldocuments/frus1958-60v03/d242), [243](https://history.state.gov/historicaldocuments/frus1958-60v03/d243) (Feb. 2–3, the threshold and the British). Check: the threshold figure. [[w.divine-blowing-on-the-wind]]; [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.kistiakowsky-scientist-at-the-white]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-02-13.testing
    when: Feb. 13
    date: '1960-02-13'
    thread: testing
    also: [europe-and-the-alliance]
    c: France's first atomic test, at Reggane in the Algerian Sahara. About 70 kilotons. De Gaulle's message, "Hurrah for France!"
    n: 'Check: the yield and the message''s words. [[w.kohl-french-nuclear-diplomacy]]. Names: de Gaulle (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles]
  - id: cal.1960-02-15.voting-rights
    when: Feb. 15–16
    date: '1960-02-15'
    thread: voting-rights
    c: 'Johnson calls up a House bill leasing an Army post to the school district of Stella, Mo., and invites civil rights amendments; Dirksen offers the administration''s. The Southern Democrats begin talking. Feb. 16: Russell''s motion to postpone beaten, [28–61](https://voteview.com/rollcall/RS0860231); Morse''s to discharge the Judiciary Committee, [4–68](https://voteview.com/rollcall/RS0860232).'
    n: 'Check: the bill''s number (H.R. 8315). See [[cal.1960-02-05.voting-rights]]. Names: Johnson (K–J Adm. III.D); Dirksen (Opp. III.A); Russell, Morse (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:dirksen-everett, name:russell-richard-b, name:morse-wayne]
  - id: cal.1960-02-16.foreign-aid
    when: Feb. 16–18
    date: '1960-02-16'
    thread: foreign-aid
    c: 'Mutual security message: $4.175 billion, of it $2 billion for military aid, in the defense budget. Feb. 18: the International Development Association''s articles sent up, membership asked.'
    n: '[Special Message to the Congress on the Mutual Security Program](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-mutual-security-program) (Feb. 16, 1960); [Special Message to the Congress Recommending U.S. Participation in the International Development Association](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-us-participation-the-international-development) (Feb. 18, 1960). The association proposed by S. Res. 264, 85th Cong. (1958), Monroney''s. [[w.kaufman-trade-and-aid]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:monroney-almer-s]
  - id: cal.1960-02-17.king
    when: Feb. 17
    date: '1960-02-17'
    thread: king
    c: An Alabama grand jury in Montgomery indicts King for perjury on his Alabama income tax returns for 1956 and 1958. Arrested in Atlanta, his new home; out on bond.
    n: 'Check: the years of the returns. [[w.branch-parting-the-waters]]; [[w.garrow-bearing-the-cross]]; [[w.lewis-make-no-law]], on the advertisement for his defense. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr]
  - id: cal.1960-02-17.cuba
    when: Feb. 17
    date: '1960-02-17'
    thread: cuba
    c: 'Gray brings Eisenhower a proposal before the 5412 group for an action in Cuba. Eisenhower: why so narrow; find assets for a program across the board, "even possibly things that might be drastic." Nothing to be done until the group has reviewed it and he has approved.'
    n: '[FRUS 1958–60, VI, doc. 454](https://history.state.gov/historicaldocuments/frus1958-60v06/d454) (Gray''s memorandum, Feb. 19). Made public: *Foreign Relations of the United States, 1958–1960*, vol. VI (1991). [[w.bissell-reflections-of-a-cold]]; [[w.paterson-contesting-castro]]; [[w.bohning-castro-obsession]]. The program: [[cal.1960-03-17.cuba]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:gray-gordon]
  - id: cal.1960-02-22.conservation
    when: Feb. 22–25
    date: '1960-02-22'
    thread: conservation
    c: Eisenhower vetoes Blatnik's bill raising grants for sewage plants from $50 million to $90 million a year. Water pollution "a uniquely local blight." Feb. 25, the House fails to override, [249–157](https://voteview.com/rollcall/RH0860092).
    n: '[Veto of Bill To Amend the Federal Water Pollution Control Act](https://www.presidency.ucsb.edu/documents/veto-bill-amend-the-federal-water-pollution-control-act) (Feb. 22, 1960). H.R. 3610, 86th Cong. [[w.milazzo-unlikely-environmentalists]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:blatnik-john-a]
  - id: cal.1960-02-23.latin-america
    when: Feb. 23–Mar. 7
    date: '1960-02-23'
    thread: latin-america
    c: 'Eisenhower in South America: Brazil, Argentina, Chile, Uruguay. Declaration with Kubitschek at Brasília, Feb. 23; addresses to the Congresses of Brazil and Argentina; the Declaration of San Carlos de Bariloche with Frondizi, Feb. 28; Alessandri in Santiago, Feb. 29. In Montevideo, Mar. 2, police tear gas against students on the route. Back by Puerto Rico, Mar. 7.'
    n: '[Radio and Television Address to the American People on the Eve of South American Trip](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-american-people-the-eve-south-american-trip) (Feb. 21, 1960); [Joint Statement of the President and President Kubitschek of Brazil](https://www.presidency.ucsb.edu/documents/joint-statement-the-president-and-president-kubitschek-brazil) (Feb. 23); [The Declaration of San Carlos de Bariloche](https://www.presidency.ucsb.edu/documents/the-declaration-san-carlos-de-bariloche-joint-declaration-the-president-and-president) (Feb. 28). FRUS 1958–60, V, docs. [282](https://history.state.gov/historicaldocuments/frus1958-60v05/d282)–[287](https://history.state.gov/historicaldocuments/frus1958-60v05/d287) (Brazil), [205](https://history.state.gov/historicaldocuments/frus1958-60v05/d205)–[214](https://history.state.gov/historicaldocuments/frus1958-60v05/d214) (Argentina). Check: Montevideo. [[w.rabe-eisenhower-and-latin-america]]; [[w.eisenhower-wine-is-bitter]]; [[w.eisenhower-white-house-years]]; [[w.mcpherson-yankee-no]]. Names: Eisenhower (Opp. III.E); Frondizi (K–J Adm. III.J).'
    tags: [name:eisenhower-dwight-d, name:kubitschek-juscelino, name:frondizi-arturo, name:alessandri-rodriguez-jorge]
  - id: cal.1960-02-23.court
    when: Feb. 23
    date: '1960-02-23'
    thread: court
    also: [civil-rights-organizations]
    c: '*Bates v. City of Little Rock*, [361 U.S. 516](https://tile.loc.gov/storage-services/service/ll/usrep/usrep361/usrep361516/usrep361516.pdf). Arkansas cities may not demand the NAACP''s membership lists under a license tax: freedom of association protected against the States. Convictions reversed, without dissent.'
    n: 'Check: without dissent. The Court''s 1960 decisions: [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]; [[w.greenberg-crusaders-in-the-courts]].'
  - id: cal.1960-02-25.sit-ins
    when: Feb. 25
    date: '1960-02-25'
    thread: sit-ins
    also: [alabama]
    c: Alabama State College students sit at the snack bar of the Montgomery County courthouse. Patterson calls on the State Board of Education to expel the leaders.
    n: 'Check: the number of students and the date of Patterson''s demand. [[w.branch-parting-the-waters]]. See [[cal.1960-02-01.sit-ins]]. Names: Patterson (K–J Cong. III.F).'
    tags: [name:patterson-john]
  - id: cal.1960-02-27.sit-ins
    when: Feb. 27
    date: '1960-02-27'
    thread: sit-ins
    c: Nashville. White youths beat sit-in students at the downtown counters; police arrest 81 of the students, none of the attackers. Lewis and Nash among them.
    n: 'Check: the count, and Nash. [[w.halberstam-children]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1960-02-01.sit-ins]]. Names: Lewis, Nash (K–J Cong. III.H).'
    tags: [name:lewis-john, name:nash-diane]
  - id: cal.1960-02-29.voting-rights
    when: Feb. 29
    date: '1960-02-29'
    thread: voting-rights
    c: Round-the-clock sessions begin; Johnson's motion to adjourn at 5 p.m. on Feb. 29 beaten Feb. 26, [10–67](https://voteview.com/rollcall/RS0860235). The Southern Democrats speak in relays.
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1960-02-29.court
    when: Feb. 29
    date: '1960-02-29'
    thread: court
    also: [voting-rights]
    c: '*United States v. Raines*, [362 U.S. 17](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362017/usrep362017.pdf): the Attorney General''s suits under the Civil Rights Act of 1957 upheld against Terrell County, Ga., registrars. *United States v. Thomas*, [362 U.S. 58](https://tile.loc.gov/storage-services/service/ll/usrep/usrep362/usrep362058/usrep362058.pdf): Negroes purged from the rolls of Washington Parish, La., restored.'
    n: See [[cal.1960-02-23.court]].
