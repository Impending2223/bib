  - id: cal.1965-11-06.china-leadership
    when: Nov. 6
    date: '1965-11-06'
    thread: china-zhou
    c: Zhou attends the enlarged Politburo meeting on half-work, half-study.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 762–63 (Nov. 6, 1965); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 627–628 (Nov. 6, 1965; Liu presides at the enlarged Politburo meeting on the system of urban half-work, half-study education and speaks: national education has three forms, full-time, spare-time and half-work, half-study (half-farming, half-study); half-work schools are to train a new kind of worker with socialist consciousness, culture, science and technique and practical skill, the goal being men able to be cadres, technicians and engineers but also workers and peasants; intellectuals are too few, not too many, and more are needed, and the villages need many technicians for the "four modernizations"; the course for the cities is "universal junior-middle education by full-time and half-work, half-study schools walking on two legs"; the trials are to be kept up five years and spread in ten; the three fundamental measures against revisionism and a capitalist restoration are the socialist-education movement carried through, the reform of the education system with half-work, half-study, and cadres'' taking part in labor); [[w.yang-shangkun-riji]], II, 685 (Nov. 6, 1965; the Politburo, an hour and a half, on education half at work and half at study; Yang there; Zhou not named; the words: 参加了1小时半的政治局会议(讨论亦工亦学教育问题)); [[w.peng-zhen-nianpu-1902]], IV, 447 (Nov. 6, 1965; Peng Zhen at the enlarged Politburo under Liu Shaoqi on half-work, half-study education in the cities); [[w.zhu-de-nianpu-xinbian]], III, 1942 (Nov. 6, 1965; Zhu De 朱德 at the Politburo 中共中央政治局 meeting on the half-work, half-study system of education in the cities 城市半工半读教育制度; Liu Shaoqi 刘少奇 speaks: five years of trial and ten of spreading it; three basic measures against revisionism and a capitalist restoration, the socialist education campaign carried through, the reform of the school system, and cadres in labor; with them China may avoid it, or may not). Made public: 1996. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
