    c: 'Katzenbach''s second opinion, "lapse" read as "to pass ... gradually": no need to name anyone by Nov. 9; the first opinion destroyed. Weaver to Califano: "embarrassing, downright humiliating"; he would resign. Johnson, at the Ranch, that evening: "Let him resign." By Califano''s account.'
