        - 'via w.kabaservice-rule-and-ruin 155 n.143: B-C'
    tags: [name:lindsay-john-v, name:beame-abraham-d, name:buckley-william-f-jr, state:ny, city:nyc]
    short: Lindsay over Beame and Buckley
