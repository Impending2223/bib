  - id: cal.1965-11-24.china-leadership
    when: Nov. 24
    date: '1965-11-24'
    place: shanghai
    thread: china-mao-foreign
    also: [indonesia, vietnam, china-foreign]
    c: 'Mao, Shanghai, Jinjiang Hotel, afternoon: with Anna Louise Strong, on her 80th birthday, and with Frank Coe, Israel Epstein, Sidney Rittenberg, George Hatem and others; Jiang Qing, Liao Chengzhi, Wu Lengxi present. Strong sees the world changed since the U.S. bombing of North Vietnam in February and the Indonesian events of Sept. 30–Oct. 1. Mao: new things lately, American students demonstrating in crowds and the Indonesian right''s counter-revolutionary coup; seen in one moment, the sky looks black; with right policy and line the people wake and stand with us; no matter how many Khrushchevs or Indonesian rightists, the people''s tide cannot be turned, only delayed.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 24, 1965. Made public: 2013. Names: Mao Zedong, Jiang Qing, Liao Chengzhi, Wu Lengxi, Anna Louise Strong, George Hatem, Khrushchev, Frank Coe, Israel Epstein, Sidney Rittenberg.'
    tags: [name:mao-zedong, name:jiang-qing, name:khrushchev-nikita-s, polity:indonesia, polity:prc, vis:only:prc, name:anna-louise-strong, name:frank-coe, name:george-hatem, name:israel-epstein, name:liao-chengzhi, name:sidney-rittenberg, name:wu-lengxi]
  - id: cal.1965-11-24.china-leadership-2
    when: Nov. 24
    date: '1965-11-24'
    thread: china-zhou-foreign
    c: 'Zhou receives delegates to the national conference on machinery design. Designers are production workers, not "non-productive"; have the Labor Ministry and Statistical Bureau change it. Leaders must be revolutionary and lead by example, ask the masses first; to be a chief takes Mao Zedong Thought, practice and the three great revolutionary movements, self-criticism first. Trivial rules and regulations come from idealism and metaphysics, from Soviet dogmatism, but we have our own too: it takes five or six ministers'' circles to send a paper out, feudal ceremony and habit; we dare not change, lacking revolutionary spirit. Study foreign good experience for our use; rules fit the place, not complete. Study philosophy, Mao''s four essays.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 766 (Nov. 24, 1965). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
