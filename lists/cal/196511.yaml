    c: 'Higher Education Act signed at Southwest Texas State College, San Marcos, his own, [79 Stat. 1219](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1219.pdf): Educational Opportunity Grants to needy undergraduates, up to $1,000 a year;{1} insured student loans; work-study; aid to libraries, community service, and developing colleges; a National Teacher Corps.{2} The Senate passed it Sept. 2, [79–3](https://voteview.com/rollcall/RS0890215);{3} the House kept the Teacher Corps, [152–226](https://voteview.com/rollcall/RH0890196) against recommittal, and adopted the conference report Oct. 20, [313–63](https://voteview.com/rollcall/RH0890197).{4}'
