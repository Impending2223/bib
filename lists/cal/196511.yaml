    when: Nov. 1
    date: '1965-11-01'
    thread: vietnam-operations
    c: 'Silver Bayonet, the 1st Cavalry Division''s first offensive mission: its 1st Brigade, in contact with a large force, pursues the enemy west of Plei Me along the Cambodian border. In the pursuit, 216 of the enemy killed, 117 captured; 55 Americans killed, 194 wounded.'
    n: '[[w.macv-command-history-1965]], 168, 481. See [[cal.1965-10-26.vietnam]].'
