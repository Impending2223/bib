  - id: cal.1965-11-02.students
    when: Nov. 2
    date: '1965-11-02'
    place: washington
    thread: students
    also: [vietnam]
    c: 'Norman Morrison, a Quaker, 31, burns himself to death at the Pentagon, below McNamara''s office, his year-old daughter with him.{1} Nov. 6, Union Square: five men burn their draft cards.{2} Nov. 9, Roger LaPorte, 22, of the Catholic Worker, sets himself afire before the United Nations;{3} dead the next day.{4}'
    n: '[[w.gibbons-u-s-government-and]], IV, 92–93 (Morrison; LaPorte); [[w.branch-at-canaans-edge]], 358–62; [[w.mcnamara-in-retrospect]], ch. 8 at n.13 (twilight, within forty feet of McNamara''s window; Morrison of the Stoney Run Friends Meeting, Baltimore; the child thrown clear, unhurt). [[w.bernstein-guns-or-butter]], 382 (five men in Union Square, "a few days later" than Oct. 15–16, before 1,500; LaPorte at Bellevue: "I''m a Catholic Worker. I''m against the war, all wars."); [[w.wells-war-within]], 58 (Morrison at the Pentagon''s river entrance, near McNamara''s window, his infant daughter released; LaPorte at the UN the next week, dead after many hours); [[w.zaroulis-who-spoke-up]], 1, 3–4, 61–62 (Morrison at the Pentagon, his daughter with him; Union Square; LaPorte at the United Nations, dead the next day); [[w.debenedetti-american-ordeal]], 129–30 (Morrison at the river entrance, some fifty yards from McNamara''s office; Union Square, 1,500 there; LaPorte at Hammarskjöld Plaza, dead thirty-three hours later); [[w.lich-su-khang-chien-chong-my]], V, 305–06 (Norman Morrison, 31, a young Quaker, burns himself before the window of the Secretary of Defense, with his 18-month-old daughter set down on the ground). Check: Zaroulis and Sullivan, 1, 3, give Morrison as thirty-two, his daughter Emily fifteen months, some hundred yards from McNamara''s office; LaPorte twenty-one. Check: DeBenedetti, 129, gives Morrison 32 and his daughter eighteen months. To check: *New York Times*, [Nov. 3](https://timesmachine.nytimes.com/timesmachine/1965/11/03/issue.html), [Nov. 7](https://timesmachine.nytimes.com/timesmachine/1965/11/07/issue.html), [Nov. 10](https://timesmachine.nytimes.com/timesmachine/1965/11/10/issue.html), and [Nov. 11, 1965](https://timesmachine.nytimes.com/timesmachine/1965/11/11/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 93 n.47). See [[cal.1965-03-24.students]]; [[cal.1965-08-30.students]]. Check: Gibbons gives Morrison''s age as 32, and "Robert Allen La Porte," dead Nov. 10. Names: Morrison, LaPorte, McNamara.'
