  - id: cal.1965-11-16.civil-rights-the-executive
    when: Nov. 16–17
    date: '1965-11-16'
    place: washington
    thread: civil-rights-the-executive
    also: [desegregation-schools]
    c: 'Planning session for the White House Conference "To Fulfill These Rights," the conference itself put off to June 1–2, 1966.{1} Randolph honorary chairman; Abram and Coleman chairmen.{2} Johnson, in the East Room, Nov. 16: 200,000 Negroes newly registered under the Voting Rights Act.{3} Nov. 17, he asks the Civil Rights Commission (Hannah) to study racial isolation in the schools, North and South.{4}'
