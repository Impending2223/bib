    time: 1965-11-09T22:16Z
    thread: states-and-cities
    c: 'The Northeast blackout. 5:16 p.m.: a relay on a line from the Sir Adam Beck station, Queenston, Ontario, trips; in minutes the interconnected systems of Ontario, New York, and New England fail. Some 30 million people without power, New York City into the next morning. Johnson orders the Federal Power Commission (Swidler) to investigate. Its report, Dec. 6.'
    n: 'Memorandum Concerning the Power Failure in the Northeastern United States, [1965 Pub. Papers 1109](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=583) (Nov. 9, 1965); Statement by the President in Response to Federal Power Commission Report on the Northeastern Electric Power Blackout, [1965 Pub. Papers 1138](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=612) (Dec. 6, 1965). Thread: none nearer. To check: [[w.commission-northeast-power-failure-november]]. Names: Johnson, Swidler.'
    tags: [name:johnson-lyndon-b, name:swidler-joseph-c]
    short: the Northeast blackout
