    n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1965. Published: *Wenhui bao*, Nov. 10, 1965. [[w.macfarquhar-maos-last-revolution]], 18 (the publication); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 10, 1965; the book says Yao Wenyuan''s article, in the Shanghai *Wenhui bao*, on the historical play *Hai Rui Dismissed from Office* "opened the prelude to the Cultural Revolution"; footnote 1 (628) names Yao as then a member of the editorial board of *Jiefangjun bao* and of the writing group of the Shanghai committee); [[w.macfarquhar-origins-of-the-cultural]], III, 249, 252 (Yao''s article, dated and titled; it is the first target on the eve of the Cultural Revolution, Wu Han, whom Mao had admired); [[w.macfarquhar-origins-of-the-cultural]], III, 445 (the article in the Shanghai *Wenhui bao*, kept secret from the Peking committee); [[w.deng-xiaoping-nianpu-1904]], III, 1880 (Nov. 10, 1965; the Shanghai Wenhui bao prints Yao Wenyuan 姚文元''s article ''On the new historical play *Hai Rui Dismisses the Official*''; the nianpu (footnote 2: Yao then editorial-board member of the Jiefang ribao and a member of the Shanghai Party committee''s writing group): the article was planned by Jiang Qing at Shanghai and approved by Mao before publication; it ties the play''s ''returning the land'' and ''redressing wrongs'' to the so-called ''go-it-alone wind'' and ''reversal wind'' of 1962, charges the author Wu Han 吴晗 (footnote 3: then vice-mayor of Peking) with wishing to pull down the people''s communes and restore the landlords'' and rich peasants'' rule, shocked the country and became the fuse of the Cultural Revolution); [[w.mao-zedong-zhuan]], VI, ch. 74 (Nov. 10 the Wenhui bao prints Yao Wenyuan''s article on Hai Rui Dismissed from Office, written at Jiang Qing''s planning; Mao saw it and agreed to its printing (Mao to foreign guests, 1967: Peking could not organize it, Shanghai did) (n.14)). [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (planned by Mao, the fuse of the Cultural Revolution); [[w.peng-zhen-nianpu-1902]], IV, 447 (Nov. 10, 1965; *Wenhui bao* prints Yao Wenyuan''s article; the play''s author the historian and Peking vice-mayor Wu Han 吴晗, charged with speaking up through Hai Rui for the overthrown, "a poisonous weed"; planned by Jiang Qing with Zhang Chunqiao and Yao in Shanghai early in 1965 and written in secret); [[w.jian-zhou-enlai]], 529–530 (Yao Wenyuan''s essay in the *Wenhui bao*; the play by Wu Han, vice mayor of Peking); [[w.dikotter-cultural-revolution]], 48–49 n.16 (Yao, on Jiang Qing''s advice in a sanatorium for the summer; nine drafts, three edited by Mao; 10,000 words; Mao in Shanghai for it; printed in two local papers); [[w.pu-weihua-zalan-jiu-shijie]], 7; [[w.liu-jixian-ye-jianying-nianpu]], II, 932 (Nov. 10, 1965; Yao Wenyuan''s 姚文元 article in Shanghai''s 上海 *Wenhui bao* 文汇报, by this book the opening of the "Cultural Revolution"); [[w.chen-yun-nianpu-xiuding]], III, 150–151 (Mao approved the article''s publication and had it reprinted nationwide; under Jiang Qing and Zhang Chunqiao the attack soon grew into a campaign in literature and art, the prelude and fuse of the Cultural Revolution); [[w.zhu-de-nianpu-xinbian]], III, 1942 (Nov. 10, 1965; Shanghai''s *Wenhui bao* 《文汇报》 prints Yao Wenyuan''s 姚文元 "On the new historical play *Hai Rui Dismissed from Office*" 《评新编历史剧〈海瑞罢官〉》; worked by Jiang Qing 江青 and Zhang Chunqiao 张春桥, it grows into a campaign of criticism and becomes the fuse of the "Cultural Revolution"); [[w.peng-dehuai-nianpu]], 792 (Nov. 10, 1965: Shanghai''s *Wenhui bao* 《文汇报》 prints Yao Wenyuan''s 姚文元 "On the new historical play *Hai Rui Dismissed from Office*" 《评新编历史剧〈海瑞罢官〉》, which ties the play''s "returning the land" and "redressing wrongs" to the "go-it-alone wind" and the "wind of reversing verdicts," and those to Lushan 庐山 and Peng Dehuai 彭德怀); [[w.teiwes-tragedy-of-lin-biao]], 209 (prepared in secret with Mao''s blessing). To check: [[w.fangeming-xiuzhengzhuyi-fenzi-fan]], 18 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.11); Yao Wenyuan, "On the new historical play *The Dismissal of Hai Rui*," [[w.wenhui-bao]], Nov. 10, 1965 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 249 n.1a); Mao Zedong 毛泽东, talk with Cabo 卡博 and Baluku 巴卢库, Feb. 3, 1967 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.14). Names: Yao Wenyuan, Wu Han.'
