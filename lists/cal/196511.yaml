    n: '[[w.wells-war-within]], 61. To check: Ropa memorandum on the Nov. 1, 1965, meeting of the PAPCV, NSFCFV, box 197, LBJ Library (cited by [[w.wells-war-within]], 61 n.162). See [[cal.1965-08-30.vietnam-support]]. Names: Bundy.'
