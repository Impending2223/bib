    n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1965. [[w.zhou-enlai-nianpu-1949]], II, 765 (Nov. 10, 1965 (noted at Nov. 19): the Central Committee''s notice relieves Yang Shangkun as director of its General Office and appoints Wang Dongxing); [[w.macfarquhar-maos-last-revolution]], 19 (Zhongfa [1965] 644); [[w.macfarquhar-origins-of-the-cultural]], III, 447 (Yang Shangkun dismissed the day Yao''s article appears; Wang Dongxing, head of the 8341 guard unit, in his place); [[w.mao-zedong-zhuan]], VI, ch. 74 (Nov. 10 the Center relieves Yang Shangkun as director of the General Office, Wang Dongxing succeeding; known to few at the time). [[w.peng-zhen-nianpu-1902]], IV, 445 (Nov. 10, 1965; the Center''s notice relieving Yang Shangkun as director of its General Office and moving him to be a secretary of the Guangdong provincial committee); [[w.jian-zhou-enlai]], 532 ("Around the same time" Yang Shangkun dismissed as head of the General Office at Mao''s behest; Wang Dongxing, long head of Mao''s bodyguards, his successor; Zhou, Liu, Deng and the others silent); [[w.dikotter-cultural-revolution]], 45, 48 (Yang Shangkun removed, replaced by Wang Dongxing, on the day Yao''s article appears); [[w.pu-weihua-zalan-jiu-shijie]], 21; [[w.zhu-de-nianpu-xinbian]], III, 1942 (Nov. 10, 1965; the Center''s 中共中央 notice relieving Yang Shangkun 杨尚昆 as director of its General Office 中共中央办公厅 and naming Wang Dongxing 汪东兴 director); [[w.teiwes-tragedy-of-lin-biao]], 209 (and his replacement by Mao''s chief bodyguard, Wang Dongxing). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). Check: MacFarquhar (19 n.19) has Yang Shangkun told of his dismissal on Oct. 29 by Zhou Enlai, Deng Xiaoping and Peng Zhen. To check: Yang Shangkun, diary entry of Oct. 29, 1965 (told of his dismissal by Zhou Enlai, Deng Xiaoping and Peng Zhen), printed in Yang Shangkun riji, in [[w.shangkun-yang-shangkun-riji-2]] (cited by [[w.macfarquhar-maos-last-revolution]], 19 n.19); [[w.lieberthal-central-docum