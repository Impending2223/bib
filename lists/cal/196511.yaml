        - 'via w.kabaservice-rule-and-ruin 159 n.160: C'
    tags: [name:godwin-mills-e-jr, name:holton-linwood, name:hughes-richard-j, name:dumont-wayne-jr, state:va, state:nj, name:story-william-j-jr]
  - id: cal.1965-11-02.specials
    when: Nov. 2
    date: '1965-11-02'
    thread: specials
    c: Ohio 7th, special. Clarence J. Brown Jr. (R) holds his father's seat over Berry (D), 70,573 to 47,830, 59.6 percent; the elder Brown died Aug. 23. Swing 2.8 to R. Sworn Jan. 10, 1966.
    n: 'Votes: CQ Guide 6th (2010) 1276. Check: *Ohio Election Statistics*, 1965–70. [112 Cong. Rec. (1966)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (Brown sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Clarence J. Brown, Clarence J. Brown Jr., Berry. Check: the page.'
    tags: [special:1965-11-02-h-OH-7, name:brown-clarence-j-jr, name:brown-clarence-j, name:berry-james-a]
  - id: cal.1965-11-02.students
    when: Nov. 2
    date: '1965-11-02'
    thread: students
    also: [vietnam]
    c: 'Norman Morrison, a Quaker, 31, burns himself to death at the Pentagon, below McNamara''s office, his year-old daughter with him. Nov. 6, Union Square: five men burn their draft cards. Nov. 9, Roger LaPorte, 22, of the Catholic Worker, sets himself afire before the United Nations; dead the next day.'
    n: '[[w.gibbons-u-s-government-and]], IV, 92–93 (Morrison; LaPorte); [[w.branch-at-canaans-edge]], 358–62; [[w.mcnamara-in-retrospect]], ch. 8 at n.13 (twilight, within forty feet of McNamara''s window; Morrison of the Stoney Run Friends Meeting, Baltimore; the child thrown clear, unhurt). [[w.bernstein-guns-or-butter]], 382 (five men in Union Square, "a few days later" than Oct. 15–16, before 1,500; LaPorte at Bellevue: "I''m a Catholic Worker. I''m against the war, all wars."). To check: [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; *New York Times*, Nov. 3, 7, 10 and 11, 1965 (cited by [[w.gibbons-u-s-government-and]], IV, 93 n.47). See [[cal.1965-03-24.students]]; [[cal.1965-08-30.students]]. Check: Gibbons gives Morrison''s age as 32, and "Robert Allen La Porte," dead Nov. 10. Names: Morrison, LaPorte, McNamara.'
    src:
      c: 5fab9f62
      rows:
        - 'w.gibbons-u-s-government-and IV, 92–93: A, C-D'
        - 'via w.gibbons-u-s-government-and IV, 93 n.47: A, C-D'
        - 'w.branch-at-canaans-edge 358–62: A-D'
        - 'w.mcnamara-in-retrospect ch. 8 at n.13: A'
        - 'w.bernstein-guns-or-butter 382: B-D'
    tags: [name:morrison-norman-r, name:laporte-roger-allen, name:mcnamara-robert-s]
  - id: cal.1965-11-02.legislatures-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: state-legislatures
    also: [elections-1965, legislatures]
    c: 'New York. The legislature elected again, under the plan of December 1964, for one year, the only legislative election in an odd year since 1937: Republicans 37 of the Senate''s 65, Democrats a majority of the Assembly''s 165 (Check the counts). Brydges (R) the Senate''s leader from Jan. 5; Travia Speaker again.'
    n: '[Wikipedia, "176th New York State Legislature"](https://en.wikipedia.org/wiki/176th_New_York_State_Legislature); ["1965 New York state election"](https://en.wikipedia.org/wiki/1965_New_York_state_election). Check: the *Legislative Manual*, 1966. See [[cal.1965-04-14.legislatures-ny]]. Names: Brydges, Travia.'
    tags: [state:ny, name:brydges-earl-w, name:travia-anthony-j]
    short: New York's odd-year election
  - id: cal.1965-11-02.state-constitutions-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: state-constitutions
    also: [conservation, elections-1965]
    c: New York's voters call a constitutional convention for 1967, and approve a bond issue of $1 billion for sewage treatment, Rockefeller's Pure Waters program. Check the votes.
    n: 'Check: the *Legislative Manual*, 1966. To check: [[w.dullea-charter-revision-in-the]]; [[w.nunez-new-york-state-constitutional]]; [[w.connery-rockefeller-of-new-york]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
    short: New York's convention called
  - id: cal.1965-11-02.mayors-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: 'New York''s cities upstate. Buffalo: Sedita (D) elected mayor again. Syracuse: Walsh (R) reelected. Albany, N.Y.: Corning (D) elected to a seventh term. Check the votes.'
    n: '[Wikipedia, "Frank A. Sedita"](https://en.wikipedia.org/wiki/Frank_A._Sedita); ["William F. Walsh"](https://en.wikipedia.org/wiki/William_F._Walsh); ["Erastus Corning 2nd"](https://en.wikipedia.org/wiki/Erastus_Corning_2nd). Check: the county boards of elections'' canvasses. See [[cal.1961-11-07.mayors-ny]]. Names: Sedita, Walsh, Corning.'
    tags: [state:ny, city:buffalo, city:syracuse, city:albany, name:sedita-frank-a, name:walsh-william-f, name:corning-erastus]
  - id: cal.1965-11-02.mayors-detroit
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: Detroit. Cavanagh re-elected over Walter Shamie, 295,409 to 144,852, 67.1 percent, by the unofficial count. A second Negro member elected to the Common Council.
    n: '*Pontiac Press*, [Nov. 3, 1965](https://our.oakland.edu/bitstreams/5d588ef0-748d-4bd1-9a0c-712e8b7e7406/download), p. 1 (Check: the city clerk''s canvass). To check: [[w.fine-violence-in-the-model]]. See [[cal.1961-11-07.mayors-detroit]]. Names: Cavanagh, Shamie.'
    tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:shamie-walter-c]
    short: Cavanagh re-elected
  - id: cal.1965-11-02.mayors-cleveland
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965]
    c: Cleveland. Locher (D) re-elected over Carl Stokes, a Negro State representative running as an independent, 87,858 to 87,716, 36.7 percent, a 142-vote margin; Ralph Perk (R) 41,045, 17.2 percent; a fourth 22,650, 9.5 percent.
    n: 'Votes: [Wikipedia, "1965 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1965_Cleveland_mayoral_election), from Our Campaigns (Check: the Cuyahoga County Board of Elections; the margin). To check: [[w.moore-carl-b-stokes-and]]; [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.stradling-where-the-river-burned]]. See [[cal.1963-11-05.mayors-cleveland]]. Names: Locher, Stokes, Perk.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s, name:stokes-carl-b, name:perk-ralph-j]
    short: Locher over Stokes
  - id: cal.1965-11-02.state-constitutions-tx
    when: Nov. 2
    date: '1965-11-02'
    thread: state-constitutions
    also: [welfare, health]
    c: 'Texas votes on ten amendments. Adopted: assistance and medical care for the needy aged, disabled, blind and children, the State to join the federal programs and accept their funds, 347,218 to 148,097, 70.1 percent; student loans, the Texas Opportunity Plan; retirement of district and appellate judges and a Judicial Qualifications Commission; teacher retirement; building at State colleges. Refused: four-year terms for the governor and other State officers, 225,987 to 277,892, 44.8 percent, and for State representatives, 141,184 to 343,236, 29.1 percent; legislators'' pay; the Veterans'' Land Fund; a tax exemption for charity hospitals.'
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 2, 1965](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1965-11-02). To check: [[w.david-with-dignity]]; [[w.may-texas-state-constitution]]. See [[cal.1964-11-03.state-constitutions-tx]]; [[cal.1965-07-30.medicare]].'
    tags: [state:tx]
