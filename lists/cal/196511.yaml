    when: Nov. 7
    date: '1965-11-07'
    thread: vietnam-air-war
    c: 'The largest one-day Air Force and Navy assault of the war. Navy aircraft on the Me Xa highway bridge find two SAM installations north of Thanh Hoa, damage a van and two missiles; eighteen missiles escape; a Skyhawk downed, its pilot saved. Afternoon, fifteen F-4Cs on the Phu Ly bridge; twenty jets on two SAM sites near the Guoi Bo bridge. Nov. 5–7: five fixed-wing aircraft and two helicopters downed, seven crewmen missing; no restrike authorized.'
