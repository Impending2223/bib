  - id: cal.1965-11-14.vietnam
    when: Nov. 14–16
    date: '1965-11-14'
    place: lz-x-ray
    thread: vietnam-operations
    c: Ia Drang.{1} Moore's 1st Battalion, 7th Cavalry, of the 1st Cavalry Division (Airmobile), lands by helicopter at LZ X-Ray, under the Chu Pong massif, Nov. 14, and holds three days against North Vietnamese regulars, with B-52s striking the massif from Nov. 15;{2} 79 Americans killed.{3} The first battle between American and North Vietnamese regulars.{4} Check the counts.{5}
    n: 'FRUS 1964–68, III, doc. [212](https://history.state.gov/historicaldocuments/frus1964-68v03/d212). [[w.drea-mcnamara-clifford-and-the-2011]], 118 (the battle, Nov. 14–19, the first between American and North Vietnamese troops); [[w.cosmas-joint-chiefs-of-staff-2012]], 345 (X-Ray, Nov. 14; the B-52s; for the campaign, the 1st Cavalry''s claim of more than 1,200 of the enemy killed for 217 of its own); [[w.branch-at-canaans-edge]], 378–79 (the landing and the three days; the count); [[w.westmoreland-soldier-reports]], 157–58 (Moore''s battalion; B-52s in direct support for the first time; Westmoreland at the battalion''s critique, Moore for the M-16); [[w.mcnamara-in-retrospect]], ch. 8 at nn.18–19 (Nov. 14–19, the Ia Drang Valley; the first major battle between American and North Vietnamese forces). [[w.vietnam-victory-in-vietnam]], 159 (the battle under the Chu Pong, Nov. 14–19; the B-52s); [[w.gibbons-u-s-government-and]], IV, 100–102 (the battles; 1,200 to 3,000 North Vietnamese and 300 Americans killed by his count); [[w.berman-lyndon-johnsons-war]], 12 (the 1st Cavalry Division against North Vietnamese regiments; about 1,200 of the enemy killed and 200 Americans, the whole battle); [[w.drea-mcnamara-clifford-and-the-2011]], 118 (the first major battle with North Vietnamese troops, Nov. 14–19); [[w.zaroulis-who-spoke-up]], 62 (mid-November, the battle in the Ia Drang Valley between North Vietnamese and American troops); [[w.lich-su-khang-chien-chong-my]], IV, 57–58 (Ia Đrăng: Battalion 9, Regiment 66 meets the landing Nov. 14; Nov. 15 Nguyễn Hữu An''s order; Nov. 16, 4:30 a.m., the positions taken). [[w.macv-command-history-1965]], 8, 168 (the 3d Brigade from Nov. 14, against the 32d and 66th North Vietnamese Regiments, to Nov. 18). Check: Westmoreland gives six days of fighting, Nov. 14–19, and more than 1,300 enemy dead (157). Check: McNamara counts over 1,300 North Vietnamese dead and 300 Americans killed, Nov. 14–19 (ch. 8). To check: [[w.cash-fight-at-ia-drang]]; [[w.coleman-pleiku]]; [[w.moore-we-were-soldiers-once]]; [[w.pribbenow-fog-of-war]]. See [[cal.1965-07-28.vietnam]]. Names: Moore. Check: *Victory in Vietnam* counts, for the Plei Me campaign, Oct. 19–Nov. 19, 1,700 Americans and 1,270 South Vietnamese put out of action and 59 helicopters shot down; the 66th Regiment and part of the 33d at Ia Drang, Nov. 14–19 (159). Check: MACV''s history, 168, has the B-52 strikes Westmoreland asked delivered Nov. 16, and for the whole of Silver Bayonet''s second phase 1,286 of the enemy and 217 Americans killed.'
    src:
