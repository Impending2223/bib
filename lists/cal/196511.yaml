  - id: cal.1965-11-01.vietnam-operations
    when: Nov. 1
    date: '1965-11-01'
    thread: vietnam-operations
    c: 'Silver Bayonet, the 1st Cavalry Division''s first offensive mission: its 1st Brigade, in contact with a large force, pursues the enemy west of Plei Me along the Cambodian border.{1} In the pursuit, 216 of the enemy killed, 117 captured; 55 Americans killed, 194 wounded.{2}'
    n: '[[w.macv-command-history-1965]], 168, 481; [[w.lich-su-khang-chien-chong-my]], IV, 56 (Regiment 33 meets the Americans landing at Mùi village and Ia Mơ, Oct. 31; they withdraw to Pleiku Nov. 9). See [[cal.1965-10-26.vietnam]].'
    src:
      c: d45b69b4
      rows:
        - 'w.macv-command-history-1965 168, 481: 1, 2'
        - 'w.lich-su-khang-chien-chong-my IV, 56: 1'
