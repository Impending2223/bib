  - id: cal.1965-11-01.vietnam-hanoi
    when: Nov. 1
    date: '1965-11-01'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam-diplomacy, comecon]
    c: 'Hanoi. Trần Quốc Hoàn, the DRV''s Minister of Public Security, to Erich Mielke, the GDR''s Minister for State Security: thanks for receiving Nguyen Minh Tien of the Technical Main Department and Châu Diệu Ái, and asks that they study the Stasi''s technical institutes. He asks that its technical staff advise on the DRV ministry''s list of machines and devices, drawn up from the GDR''s recent aid, and help negotiate their shipment with the Ministry of Foreign Trade. He writes that the American agents have many modern devices.'
    n: '"[Letter from DRV Minister of Public Security Tran Quoc Hoan to GDR Minister of State Security Erich Mielke](https://digitalarchive.umd.edu/document/120862)" (Nov. 1, 1965), BStU MfS Abt. X 652, 24–26, trans. Sean O''Grady, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim; the German original is signed "Minister of State Security of the DRV". The Archive prints the Vietnamese names without marks but for Châu Diệu Ái. Check: the year the Archive posted the document; its page gives none. Names: Trần Quốc Hoàn.'
    src:
      c: 5eee5e16
      rows:
        - 'https://digitalarchive.umd.edu/document/120862: all'
    tags: [polity:drv, polity:gdr, vis:only:drv+gdr, name:tran-quoc-hoan]
