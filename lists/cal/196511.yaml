  - id: cal.1965-11-01.economy
    when: Nov. 1
    date: '1965-11-01'
    thread: economy
    c: 'Monday, 10:51 a.m. Johnson to Califano on the *Times*''s "JOHNSON, ANGRY, MOVES TO RETAIN ALUMINUM PRICE": "I am not now, never in my life have been, and I never will be sputtering mad!" The release to be presented as for the war''s needs and the balance of payments, any design on the price denied. By Califano''s account.'
    n: '[[w.califano-triumph-and-tragedy-of]], 99–100; [[w.bernstein-guns-or-butter]], 362 (the *Times*: "sputtering mad"; Johnson to Califano). To check: Califano, "Draft Memorandum for the Record," Nov. 1, 1965, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 100 n.47). Names: Johnson, Califano.'
    src:
      c: ce82c7b8
      rows:
        - 'w.califano-triumph-and-tragedy-of 99–100: all'
        - 'via w.califano-triumph-and-tragedy-of 99 n.45: A'
        - 'via w.califano-triumph-and-tragedy-of 100 n.47: B'
        - 'w.bernstein-guns-or-butter 362: B'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr]
    time_range:
      - 1965-11-01T15:51Z
      - 1965-11-01T16:51Z
  - id: cal.1965-11-01.voting-rights
    when: Nov. 1
    date: '1965-11-01'
    thread: voting-rights
    c: 'Macy, chairman of the Civil Service Commission, to Johnson after inspecting the examiners in late October: "skill and efficiency"; applicants, Montgomery aside, at a "very low level," for the cotton picking, the students gone back, apathy and fear; a fifth to a third of those registered at Greenwood and Belzoni, Miss., illiterate; no charge of intimidation substantiated.'
    n: '[[w.bernstein-guns-or-butter]], 242. To check: Macy to Johnson, Nov. 1; Katzenbach to Johnson, Nov. 2, 1965, HU 2-7 File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 242 n.7). See [[cal.1965-08-10.voting-rights]]. Names: Macy.'
    src:
      c: 43d13f86
      rows:
        - 'w.bernstein-guns-or-butter 242: all'
        - 'via x.1965-11-01.macy-to-johnson-examiners: all'
    tags: [name:macy-john-w-jr]
