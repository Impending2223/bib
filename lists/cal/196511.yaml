  - id: cal.1965-11-01.economy
    when: Nov. 1
    date: '1965-11-01'
    thread: economy
    c: 'Monday, 10:51 a.m. Johnson to Califano on the *Times*''s "JOHNSON, ANGRY, MOVES TO RETAIN ALUMINUM PRICE": "I am not now, never in my life have been, and I never will be sputtering mad!" The release to be presented as for the war''s needs and the balance of payments, any design on the price denied. By Califano''s account.'
    n: '[[w.califano-triumph-and-tragedy-of]], 99–100. To check: Califano, "Draft Memorandum for the Record," Nov. 1, 1965, Califano''s papers (cited by [[w.califano-triumph-and-tragedy-of]], 100 n.47). Names: Johnson, Califano.'
    src:
      c: ce82c7b8
      rows:
        - 'w.califano-triumph-and-tragedy-of 99–100: all'
        - 'via w.califano-triumph-and-tragedy-of 99 n.45: A'
        - 'via w.califano-triumph-and-tragedy-of 100 n.47: B'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr]
  - id: cal.1965-11-01.voting-rights
    when: Nov. 1
    date: '1965-11-01'
    thread: voting-rights
    c: 'Macy, chairman of the Civil Service Commission, to Johnson after inspecting the examiners in late October: "skill and efficiency"; applicants, Montgomery aside, at a "very low level," for the cotton picking, the students gone back, apathy and fear; a fifth to a third of those registered at Greenwood and Belzoni, Miss., illiterate; no charge of intimidation substantiated.'
    n: '[[w.bernstein-guns-or-butter]], 242. To check: Macy to Johnson, Nov. 1; Katzenbach to Johnson, Nov. 2, 1965, HU 2-7 File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 242 n.7). See [[cal.1965-08-10.voting-rights]]. Names: Macy.'
    src:
      c: 43d13f86
      rows:
        - 'w.bernstein-guns-or-butter 242: all'
        - 'via x.1965-11-01.macy-to-johnson-examiners: all'
    tags: [name:macy-john-w-jr]
  - id: cal.1965-11-02.states-and-cities
    when: Nov. 2
    date: '1965-11-02'
    thread: mayors
    also: [elections-1965, conservative-movement]
    c: New York City. Lindsay, Republican and Liberal, elected mayor over Beame, Democrat, 1,149,106 to 1,046,699, 45.0 percent; Buckley, Conservative, 341,226, 13.4 percent. The first Republican elected mayor since 1941.
    n: 'Figures: Wikipedia; check against the Board of Elections'' canvass. [[w.kabaservice-rule-and-ruin]], 154–56 (Lindsay over Beame and Buckley; 42 percent of the Negro vote, 43 of the Jewish; Buckley''s 341,000). Check: Kabaservice, 155, gives Lindsay 43.3 percent, Beame 39.5, Buckley 12.9 (*Newsweek*). To check: [[w.cannato-ungovernable-city]]; [[w.buckley-unmaking-of-a-mayor]]; "Mayor John Lindsay: New GOP Hope?," *Newsweek*, Nov. 15, 1965 (cited by [[w.kabaservice-rule-and-ruin]], 155 n.143). See [[cal.1965-06-10.states-and-cities]]. Names: Lindsay, Beame, Buckley.'
    src:
      c: 7c21c2ea
      rows:
        - 'w.kabaservice-rule-and-ruin 154–56: B-C'
        - 'via w.kabaservice-rule-and-ruin 155 n.143: B-C'
    tags: [name:lindsay-john-v, name:beame-abraham-d, name:buckley-william-f-jr, state:ny, city:nyc]
    short: Lindsay over Beame and Buckley
  - id: cal.1965-11-02.states-and-cities-2
