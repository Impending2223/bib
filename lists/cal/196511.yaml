n; the 66th Regiment and part of the 33d at Ia Drang, Nov. 14–19 (159). Check: MACV''s history, 168, has the B-52 strikes Westmoreland asked delivered Nov. 16, and for the whole of Silver Bayonet''s second phase 1,286 of the enemy and 217 Americans killed.'
