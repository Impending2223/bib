  - id: cal.1965-11-01.china-leadership
    when: Nov. 1
    date: '1965-11-01'
    thread: china-zhou
    also: [china-agriculture]
    c: 'Zhou receives the delegates to the first national obstetrics and gynecology conference of the Chinese Medical Association on family planning and health work for the countryside. Weight to the villages; within five years three kinds of rural health workers: a part-time medic in every production team; half-time workers in brigades and some communes; full-time doctors for communes or districts. Urban, factory, office, school and army medical staff in teams by turns to the countryside to treat and train. Keep some old experienced men in research and teaching to write down their experience; "like the silkworm, spin the last thread". Communism will take not decades but centuries, one country cannot enter alone with imperialism and capitalism around: utopian. On family planning: hold net population growth to one percent a year within the twentieth century.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 761–62 (Nov. 1, 1965). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
