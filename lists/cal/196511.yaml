    c: 'Deng Xiaoping 邓小平 inspects the Liuzhi coal mine 六枝煤矿 and hears Zhong Ziyun 钟子云, Fan Wencai 范文彩, Ding Dan 丁丹 and others of the Southwest Coal Mine Construction Command on the Liupanshui mining area. Deng: seeing coal and iron in the Southwest he is at ease, for otherwise many plants would be useless; with coal and iron, the two big Southwest combines have hope; he affirms their proposal that the northern coal not go south, and that when the Liupanshui base is built at 40 million tons a year, 20 million go east, 10 million to the Panzhihua 攀枝花 steel base and 10 million stay in Guizhou: the southern coal base is in Guizhou. He writes the name of Guanzhai station, a small station on the Liuzhi–Shuicheng section of the Guiyang 贵阳–Kunming 昆明 railway; in the afternoon returns to Guiyang.'
