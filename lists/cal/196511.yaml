  - id: cal.1965-11-15.china-leadership-4
    when: Nov. 15–18
    date: '1965-11-15'
    thread: china-zhou
    c: 'Zhou attends the enlarged Politburo meeting, Nov. 15–18, on the 1966 plan, construction priorities and half-work, half-study.{1} Nov. 16: not to let anyone take half-work half-study as meaning now to abolish the three great differences; the direction is firm but abolition takes a long time; it is a matter of policy and direction; the aim of education: serve the proletariat''s politics, join production and labor, and half-work half-study will train young people with socialist awareness and learning.{2} Nov. 17–18, on the national economic plan: the Third Plan took nine months to feel out, has a first summing up, nearer reality, now firm it up;{3} "prepare for war, prepare for famine, for the people" is both strategic line and present work; farming central to it: rely on peasants, the collective, science; war preparation and third-front building do not mean neglecting farming; spend less, do more. Proposes the Center approve. The meeting decides to push trials and spread half-work half-study and half-farm half-study schooling, and agrees with Liu''s "five years'' trial, ten years'' spread, a little more trial if needed", and approves the 1966 capital construction plan in principle.{4}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 764–65 (Nov. 15–18, 1965); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 15 and 16, 1965; Liu presides at the enlarged Politburo meeting again on the system of urban half-work, half-study education and says the industrial departments are both production teams and teaching teams and must attend to education, and that young people at labor need care for health, with hours not too long or heavy; some half-work, half-study schools have heavy labor and heavy lessons too); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628–629 (Nov. 17 and 18, 1965; Liu presides at the enlarged Politburo meeting, which hears Yu Qiuli on the national planning conference, Gu Mu on capital construction, Zhao Erlu on the defense industry and Wu Bo on finance, and in principle approves the 1966 national economic plan); [[w.peng-zhen-nianpu-1902]], IV, 448 (Nov. 15–18, 1965; Peng Zhen at the enlarged Politburo under Liu Shaoqi, again on half-work, half-study in the cities and on the 1966 plan and the priorities of construction); [[w.zhu-de-nianpu-xinbian]], III, 1943 (Nov. 15–16, 1965; Zhu De 朱德 at the enlarged Politburo meeting 中共中央政治局扩大会议, again on half-work, half-study in the cities; Nov. 17–18, at the enlarged Politburo meeting, which hears Yu Qiuli 余秋里, first deputy chairman of the State Planning Commission 国家计委, on the national planning conference, Gu Mu 谷牧, chairman of the State Construction Commission 国家建委, on capital construction, Zhao Erlu 赵尔陆, standing deputy director of the National Defense Industry Office 国防工办, on the defense industry, and Wu Bo 吴波, Vice-Minister of Finance 财政部副部长, on the finances, and approves in principle the 1966 plan and its construction priorities). Made public: 1996. Names: Zhou Enlai, Liu Shaoqi.'
