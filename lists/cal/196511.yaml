  - id: cal.1965-11-13.china-leadership
    when: Nov. 13
    date: '1965-11-13'
    thread: china-third-front
    also: [china-zhou]
    c: 'Zhou reports on planning to the State Council''s conference on planning, capital construction, finance and other trades. At the Central Work Conference the line for the Third Plan and the 1966 plan was set, drafted from the Center''s and Mao''s repeated instructions of last year and this; more grounded, more real, and a first summing up of the past decade; a good plan; now carry it out, relying on two things: Mao Zedong Thought in command and the masses; wisdom comes from the masses, in working people are teachers everywhere. The plan is not rigid; small changes, frequent change not allowed, but plans must be adjusted. Five priorities: farming, defense, aid abroad, the large and small third fronts, basic industry. Control population; improve living on more output and family planning. Imports must be urgent, good, not duplicated, timely and politically allowed.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 763 (Nov. 13, 1965); [[w.jian-zhou-enlai]], 526 (agriculture "the first area to protect," preparing for famine set beside preparing for war; the note, n.31, prints the speech "November 23, 1965" and the archive "HBPA" for the file 855-8-3113-3 that 528 n.40 gives as Nov. 13, HPA); [[w.jian-zhou-enlai]], 528 (Sukarno''s word to the embassy of early November; the leaders, Zhou among them, still hope "the ICP and left-wing forces would amass their strength" and counterattack; the note cites this speech). Made public: 1997. To check: Zhou''s speech at a planning conference, November 13, 1965 (so 528 n.40; "November 23," 526 n.31), 855-8-3113-3, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 526 n.31, 528 n.40). Names: Zhou Enlai.'
    src:
      c: 264a98df
      rows:
        - 'w.zhou-enlai-nianpu-1949 II, 763: ?'
        - 'w.jian-zhou-enlai 526: ?'
        - 'via x.1965-11-13.zhou-speech-planning-conference-hpa-855-8-3113-3: ?'
        - 'w.jian-zhou-enlai 528: ?'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1965-11-13.china-leadership-2
    when: Nov. 13
    date: '1965-11-13'
    thread: china-third-front
    also: [china-models, china-zhou, china-agriculture]
    follows:
      - cal.1965-11-13.china-leadership
    c: 'Zhou, evening, hearing Yu Qiuli on the planning conference, on whether defense or farming comes first: his outline said defense first, but seeing provincial comrades he turned it round, not to let farming be slighted. Defense, war preparation and large and small third-front projects are settled, he fears farming neglected; for 700 million people defense and third front are the work of a few; farming is war preparation, war, famine and farming cannot be parted. Farm: great potential; Dazhai spirit, self-reliance; mainly local, Center aiding; mainly small; mainly collective; mainly self-run with help; fit the place; act early, fast, hard; county and commune both on farming; no season lost.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 13, 1965). Made public: 1997. The order: after [[cal.1965-11-13.china-leadership]], the printed order alone ([[w.zhou-enlai-nianpu-1949]], II, 763). Names: Zhou Enlai, Yu Qiuli.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc, name:yu-qiuli]
