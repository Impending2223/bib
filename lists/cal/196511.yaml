    c: Ohio 7th, special. Clarence J. Brown Jr. (R) holds his father's seat over Berry (D), 70,573 to 47,830, 59.6 percent; the elder Brown died Aug. 23. Swing 2.8 to R. Sworn Jan. 10, 1966.
    n: 'Votes: CQ Guide 6th (2010) 1276. Check: *Ohio Election Statistics*, 1965–70. [112 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (1966) (Brown sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Clarence J. Brown, Clarence J. Brown Jr., Berry. Check: the page.'
    tags: [special:1965-11-02-h-OH-7, name:brown-clarence-j-jr, name:brown-clarence-j, name:berry-james-a]
  - id: cal.1965-11-02.students
    when: Nov. 2
    date: '1965-11-02'
    thread: students
    also: [vietnam]
    c: 'Norman Morrison, a Quaker, 31, burns himself to death at the Pentagon, below McNamara''s office, his year-old daughter with him. Nov. 6, Union Square: five men burn their draft cards. Nov. 9, Roger LaPorte, 22, of the Catholic Worker, sets himself afire before the United Nations; dead the next day.'
    n: '[[w.gibbons-u-s-government-and]], IV, 92–93 (Morrison; LaPorte); [[w.branch-at-canaans-edge]], 358–62; [[w.mcnamara-in-retrospect]], ch. 8 at n.13 (twilight, within forty feet of McNamara''s window; Morrison of the Stoney Run Friends Meeting, Baltimore; the child thrown clear, unhurt). [[w.bernstein-guns-or-butter]], 382 (five men in Union Square, "a few days later" than Oct. 15–16, before 1,500; LaPorte at Bellevue: "I''m a Catholic Worker. I''m against the war, all wars."); [[w.wells-war-within]], 58 (Morrison at the Pentagon''s river entrance, near McNamara''s window, his infant daughter released; LaPorte at the UN the next week, dead after many hours); [[w.zaroulis-who-spoke-up]], 1, 3–4, 61–62 (Morrison at the Pentagon, his daughter with him; Union Square; LaPorte at the United Nations, dead the next day); [[w.debenedetti-american-ordeal]], 129–30 (Morrison at the river entrance, some fifty yards from McNamara''s office; Union Square, 1,500 there; LaPorte at Hammarskjöld Plaza, dead thirty-three hours later). Check: Zaroulis and Sullivan, 1, 3, give Morrison as thirty-two, his daughter Emily fifteen months, some hundred yards from McNamara''s office; LaPorte twenty-one. Check: DeBenedetti, 129, gives Morrison 32 and his daughter eighteen months. To check: *New York Times*, Nov. 3, 7, 10 and 11, 1965 (cited by [[w.gibbons-u-s-government-and]], IV, 93 n.47). See [[cal.1965-03-24.students]]; [[cal.1965-08-30.students]]. Check: Gibbons gives Morrison''s age as 32, and "Robert Allen La Porte," dead Nov. 10. Names: Morrison, LaPorte, McNamara.'
    src:
      c: 5fab9f62
      rows:
        - 'w.gibbons-u-s-government-and IV, 92–93: A, C-D'
        - 'via w.gibbons-u-s-government-and IV, 93 n.47: A, C-D'
        - 'w.branch-at-canaans-edge 358–62: A-D'
        - 'w.mcnamara-in-retrospect ch. 8 at n.13: A'
        - 'w.bernstein-guns-or-butter 382: B-D'
        - 'w.wells-war-within 58: A, C-D'
        - 'w.zaroulis-who-spoke-up 1, 3–4, 61–62: B, D'
        - 'w.debenedetti-american-ordeal 129–30: A-D'
        - 'via w.debenedetti-american-ordeal 129 n.114: A'
        - 'via w.debenedetti-american-ordeal 130 n.117: C-D'
    tags: [name:morrison-norman-r, name:laporte-roger-allen, name:mcnamara-robert-s]
  - id: cal.1965-11-02.legislatures-ny
    when: Nov. 2
    date: '1965-11-02'
    thread: state-legislatures
    also: [elections-1965, legislatures]
    c: 'New York. The legislature elected again, under the plan of December 1964, for one year, the only legislative election in an odd year since 1937: Republicans 37 of the Senate''s 65, Democrats a majority of the Assembly''s 165 (Check the counts). Brydges (R) the Senate''s leader from Jan. 5; Travia Speaker again.'
    n: '[Wikipedia, "176th New York State Legislature"](https://en.wikipedia.org/wiki/176th_New_York_State_Legislature); ["1965 New York state election"](https://en.wikipedia.org/wiki/1965_New_York_state_election). Check: the *Legislative Manual*, 1966. See [[cal.1965-04-14.legislatures-ny]]. Names: Brydges, Travia.'
    tags: [state:ny, name:brydges-earl-w, name:travia-anthony-j]
    short: New York's odd-year election
