  - id: cal.1967-12-09.draft
    when: Dec. 9
    date: '1967-12-09'
    thread: draft
    also: [war-opposition, students]
    c: 'Hershey and Clark''s joint statement, after Hershey''s letter of Oct. 26 to local boards: Justice to give priority to prosecuting those who unlawfully obstruct the draft (Check its terms).'
    n: 'To check: [[w.foley-confronting-the-war-machine]]; [[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]. See [[cal.1967-03-06.draft]]. Check: the statement''s text. Names: Hershey, Clark.'
    tags: [name:hershey-lewis-b, name:clark-ramsey]
  - id: cal.1967-12-10.opinion
    when: Dec. 10
    date: '1967-12-10'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 16–21: if Hanoi shows signs of giving in, China will send many troops: will 49 percent, will not 36. How the war will end: all-out victory 19, a compromise settlement 64, defeat 4. Oct. 27–Nov. 2, the ground war extended into North Vietnam: favor 39, oppose 44.'
    n: '[[w.gallup-poll]], III, 2093–94.'
  - id: cal.1967-12-10.robert-kennedy
    when: Dec. 10
    date: '1967-12-10'
    thread: robert-kennedy
    also: [elections-1968, democratic-party]
    c: 'New York, a Sunday lunch at vanden Heuvel''s: Robert Kennedy''s council on 1968, with Edward Kennedy, Sorensen, Goodwin, Dutton, Salinger, Schlesinger. Schlesinger and Goodwin for running; Edward Kennedy and Sorensen for waiting until 1972. Robert Kennedy: Johnson "would die and make Hubert President rather than let me get it"; he supposes he will do nothing; no decision for some weeks. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 832–33. To check: Schlesinger, journal, Dec. 10, 1967 (cited by [[w.schlesinger-robert-kennedy-and-his]], 833 n.46). Names: Robert Kennedy, vanden Heuvel, Edward Kennedy, Sorensen, Goodwin, Dutton, Salinger, Schlesinger, Johnson, Humphrey.'
    src:
      c: e0b904d6
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 832–33: all'
        - 'via w.schlesinger-robert-kennedy-and-his 833 n.46: all'
    tags: [name:kennedy-robert-f, name:vanden-heuvel-william-j, name:kennedy-edward-m, name:sorensen-theodore-c, name:goodwin-richard-n, name:dutton-frederick-g, name:salinger-pierre, name:schlesinger-arthur-m-jr, name:johnson-lyndon-b, name:humphrey-hubert-h, state:ny, city:nyc]
  - id: cal.1967-12-11.draft
    when: Dec. 11
    date: '1967-12-11'
    thread: draft
    also: [war-opposition]
    c: 'Hershey, after two hours with Clark: a board may still reclassify a registrant who disrupts the system.'
    n: 'Check: the press account. See [[cal.1967-12-09.draft]]. Names: Hershey, Clark.'
    tags: [name:hershey-lewis-b, name:clark-ramsey]
