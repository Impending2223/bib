  - id: cal.1967-12-23.vietnam-2
    when: Dec. 23
    date: '1967-12-23'
    thread: vietnam-prisoners
    c: 'The Vatican, the Pope''s library. Johnson with Paul VI: Hanoi believes "the U.S. will tire and fail just like France did"; "My right hand keeps the pressure steady and with my left hand we seek negotiations." He asks the Pope to persuade Thiệu to talk informally with the NLF, and to send a representative to the prisoners North and South; the Pope: "I think I can do something," and asks the Christmas truce extended. An aide-mémoire: no halt, for every past cessation "has been used by the other side to accelerate the movement of supplies and men." Johnson gives him a bust of himself.'
    n: '[[w.berman-lyndon-johnsons-war]], 114, 124–25, 137; [[w.branch-at-canaans-edge]], 665–66 ("My right hand keeps the pressure steady"; the Pope, "I can never agree to war"; the sentence removed from the statement). To check: transcript of the meeting with the Pope, Dec. 23, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 137 n.11); Notes, "Meeting of the Pope and the President," Dec. 23, 1967, Meeting Notes File, Box 2, p. 2, LBJ (cited by [[w.branch-at-canaans-edge]], 665); Notes, "Meeting of the Pope and the President," Dec. 23, 1967, Meeting Notes File, Box 2, p. 2, LBJ (cited by [[w.branch-at-canaans-edge]], 665); Valenti, *Norton, 1975; Pocket Books, 1977, 1976.* (n.d.), 228–32 (cited by [[w.branch-at-canaans-edge]], 665); "Johnson Confers with Pope Paul on Vietnam War," NYT, Dec. 24, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 666); Valenti, *Norton, 1975; Pocket Books, 1977, 1976.* (n.d.), 232–38 (cited by [[w.branch-at-canaans-edge]], 666). Check: Berman''s epigraph dates the meeting Dec. 22, the text the day before Christmas. See [[cal.1967-12-19.vietnam]]. Names: Johnson, Paul VI, Nguyễn Văn Thiệu.'
