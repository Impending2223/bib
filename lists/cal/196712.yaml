    c: 'Monday evening. Califano to Johnson, against Fowler''s cuts: repackage the tax increase for more revenue, drop obsolete programs like school milk for suburban children, new programs in housing and jobs, "Let the Congress chop it up"; Mills "wants either (or both) (1) to force you to your knees ... or (2) to dismantle great hunks of the Great Society."'
    n: '[[w.califano-triumph-and-tragedy-of]], 253–54. Names: Califano, Johnson, Fowler, Mills.'
