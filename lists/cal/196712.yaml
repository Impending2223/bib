  - id: cal.1967-12-03.opinion
    when: Dec. 3
    date: '1967-12-03'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 16–21: Johnson 47 percent, Nixon 43, undecided 10. With Wallace as a third party''s candidate: Johnson 44, Nixon 36, Wallace 12, undecided 8. South: Johnson 40, Wallace 32, Nixon 25.'
    n: '[[w.gallup-poll]], III, 2092–93. Names: Johnson, Nixon, Wallace.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:wallace-george-c]
  - id: cal.1967-12-03.europe-and-the-alliance-cyprus
    when: Dec. 3–4
    date: '1967-12-03'
    thread: cyprus
    c: 'Cyprus. Agreement: Greek forces beyond the 1960 treaty''s numbers withdrawn, Turkey''s mobilization undone (Check the terms).'
    n: 'FRUS 1964–68, XVI, doc. [340](https://history.state.gov/historicaldocuments/frus1964-68v16/d340) (Belcher, Dec. 3). Check: the text. See [[cal.1967-11-15.europe-and-the-alliance]].'
  - id: cal.1967-12-04.king
    when: Dec. 4
    date: '1967-12-04'
    thread: king
    also: [poverty]
    c: 'Atlanta, Ebenezer Baptist Church. King announces the Poor People''s Campaign: the poor, black and white, to Washington from April, to stay until Congress and the President act on jobs and income; civil disobedience if need be. The SCLC''s staff had agreed on it at Frogmore, S.C., late November (Check).'
    n: '[[w.garrow-bearing-the-cross]], 580–83. To check: [[w.mcknight-last-crusade]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]; "Tentative Schedule, SCLC Staff Retreat, 11/27-12/1/67", Gary Massoni Papers; King, "The State of the Movement," Nov. 28, 1967, King Papers, King Center (cited by [[w.garrow-bearing-the-cross]], 580 n.11); SCLC Staff Workshop transcript, Nov. 29, 1967, King Center (cited by [[w.garrow-bearing-the-cross]], 581 n.12); King, press conference, Dec. 4, 1967, King Papers, King Center; New York Times, Dec. 5, 1967, 1; Atlanta Constitution, Dec. 5, 1967, 1; Washington Post, Dec. 5, 1967, A2 (cited by [[w.garrow-bearing-the-cross]], 582 n.13). See [[cal.1966-08-26.open-housing]]. Check: Garrow, 580, 582, has the Frogmore retreat Nov. 27–Dec. 1 and the press conference two days after. Names: King.'
    src:
      c: d43d00fd
      rows:
        - 'w.garrow-bearing-the-cross 580–83: all'
        - 'via w.garrow-bearing-the-cross 580 n.11a: D'
        - 'via w.garrow-bearing-the-cross 580 n.11b: D'
        - 'via w.garrow-bearing-the-cross 581 n.12: D'
        - 'via w.garrow-bearing-the-cross 582 n.13a: A-C'
        - 'via w.garrow-bearing-the-cross 582 n.13b: A-C'
    tags: [name:king-martin-luther-jr, state:ga, city:atlanta]
  - id: cal.1967-12-04.war-opposition
    when: Dec. 4–8
    date: '1967-12-04'
    thread: war-opposition
    also: [draft]
    c: 'Stop the Draft Week, New York. Dec. 5, at the Whitehall Street induction center before dawn: 264 arrested, Spock among them, by the *Times*''s count. Some 585 arrested in the week (Check).'
    n: 'To check: [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Spock.'
    tags: [name:spock-benjamin, city:nyc, state:ny]
  - id: cal.1967-12-04.opinion
    when: Dec. 4
    date: '1967-12-04'
    thread: opinion
    c: 'Harris, in the *Washington Post*: Johnson''s handling of the war, positive 34 percent, negative 66, late November; late October 23 and 77; September 31 and 69; August 33 and 67; June 46 and 54.'
    n: '[[w.gibbons-u-s-government-and]], IV, 900. To check: *Washington Post*, Dec. 4, 1967. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-04.vietnam
    when: Dec. 4
    date: '1967-12-04'
    thread: vietnam
    c: 'Katzenbach to Rusk on JCSM-663-67: "a course of ever-expanding military objectives," maybe "a direct war against North Vietnam"; York II "a ''firebreak'' issue," the patrols a similar problem. Instead: decelerate search and destroy near the borders, "make the enemy come to us," the ARVN a larger part.'
    n: '[[w.gibbons-u-s-government-and]], IV, 936–37 (State, Central File, Pol 27 Viet S). See [[cal.1967-11-27.vietnam]]. Names: Katzenbach, Rusk.'
    tags: [name:katzenbach-nicholas, name:rusk-dean]
  - id: cal.1967-12-04.elections-1968
    when: Dec. 4
    date: '1967-12-04'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'Roche to Johnson: "Bobby Kennedy is sponsoring a ''War of Liberation'' against you and your Administration," so far random guerrilla attacks; he has not made up his mind to go further.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 833–34. To check: Roche to Johnson, Dec. 4, 1967, Johnson Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 834 n.47). Names: Roche, Johnson, Robert Kennedy.'
