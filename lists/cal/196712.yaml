    also: [war-opposition]
    c: 'The Army''s Civil Disturbance Plan approved: "continuous counterintelligence investigations are required to obtain factual information on the participation of subversive personalities, groups or organizations" in civil rights or antiwar activity that could lead to disturbances. A "domestic war room" in the Pentagon, 150 people, watch teams around the clock, able to direct 25 task forces of 1,000 men at once.'
