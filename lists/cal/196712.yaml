    date: '1967-12-26'
    thread: crime-and-hijacking
    also: [civil-disorders]
    c: 'Miami. Police Chief Headley announces patrols of shotguns and dogs in the Negro districts against "young hoodlums": "When the looting starts, the shooting starts." "We don''t mind being accused of police brutality."'
    n: 'AP, "Big City Police Deciding to Be Tough on Rioters Next Summer," [*San Bernardino Sun*, Dec. 30, 1967](https://cdnc.ucr.edu/?a=d&d=SBS19671230.1.2). Check: the second quotation. To check: [[w.dunn-black-miami-in-the]]. Names: Headley.'
    tags: [state:fl, city:miami, name:headley-walter-e]
  - id: cal.1967-12-27.crime-and-hijacking
    when: Dec. 27
    date: '1967-12-27'
    thread: crime-and-hijacking
    also: [states-and-cities]
    c: 'District of Columbia crime act signed, [81 Stat. 734](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg734.pdf), the Senate having passed it [67–9](https://voteview.com/rollcall/RS0900305): citations for misdemeanors; an antiriot law; a review of the District''s criminal code. Johnson objects to two provisions: minimum sentences, "a backward step"; three hours of questioning before an arrested person is taken to a judicial officer.'
    n: '[Statement by the President Upon Signing the District of Columbia Crime Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-district-columbia-crime-bill) (Dec. 27, 1967). To check: [[w.clark-crime-in-america]]. See [[cal.1966-11-13.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, city:washington]
  - id: cal.1967-12-28.vietnam-support
    when: Dec. 28
    date: '1967-12-28'
    thread: vietnam-support
    c: 'Fred Panzer to Johnson, on the polls: "All in all it looks like the public has greater understanding of what the Administration is trying to do in Vietnam—and accepts it." "Thus, Vietnam is well in hand."'
    n: '[[w.gibbons-u-s-government-and]], IV, 902 (LBJ Library, C.F. PR 16). See [[cal.1967-12-23.opinion]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-29.vietnam
    when: Dec. 29
    date: '1967-12-29'
    thread: vietnam
    c: 'Nguyễn Duy Trinh at a reception for a Mongolian delegation, broadcast by Radio Hanoi Jan. 1: after the United States unconditionally ends the bombing and other acts of war, "the DRV will talk" with it; before, talks "could" follow.'
    n: 'FRUS 1964–68, V, doc. [451](https://history.state.gov/historicaldocuments/frus1964-68v05/d451). To check: [[w.herring-secret-diplomacy-of-the]]. See [[cal.1967-01-28.vietnam]]. Names: Nguyễn Duy Trinh.'
    tags: [name:nguyen-duy-trinh]
  - id: cal.1967-12-30.africa
    when: Dec. 30
    date: '1967-12-30'
    thread: africa
    c: 'Humphrey leaves for Africa, to Jan. 11: Ivory Coast; Liberia, for Tubman''s inauguration; Ghana; the Congo; Zambia; Ethiopia; Somalia; Kenya; Tunisia. Thurgood Marshall and Marks of the USIA with him.'
    n: 'FRUS 1964–68, XXIV, doc. [231](https://history.state.gov/historicaldocuments/frus1964-68v24/d231) (his report, Jan. 12, 1968). To check: [[w.solberg-hubert-humphrey]]; [[w.lyons-keeping-africa-off-the]]. Names: Humphrey, Tubman, Marshall, Marks.'
    tags: [name:humphrey-hubert-h, name:tubman-william-v-s, name:marshall-thurgood, name:marks-leonard-h]
  - id: cal.1967-12-31.vietnam-buttercup
    when: Dec. 31
    date: '1967-12-31'
    thread: vietnam-buttercup
    c: 'Buttercup. The emissary back: the other side "surprised and pleased" at the American answer; the channel open.'
    n: 'FRUS 1964–68, V, docs. [449](https://history.state.gov/historicaldocuments/frus1964-68v05/d449), [452](https://history.state.gov/historicaldocuments/frus1964-68v05/d452). Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-29.vietnam-buttercup]].'
  - id: cal.1967-12.court-us
    when: Dec.
    date: 1967-12
    thread: court
    also: [states-and-cities, legislatures, amendments]
    c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: 32 legislatures have applied since 1963, by the Article V Library''s count; 34 needed. New in 1967: Colorado, Illinois, Indiana, North Dakota.'
    n: 'The applications in 113 Cong. Rec. [6384](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt5/pdf/GPO-CRECB-1967-pt5-5-2.pdf#page=4), [8004](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-6-1.pdf#page=2), [11,175](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-1-2.pdf#page=3), [18,007](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt14/pdf/GPO-CRECB-1967-pt14-1-2.pdf#page=30) (1967), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them. To check: [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]. See [[cal.1966-12.court-us]]. Names: Dirksen.'
    tags: [name:dirksen-everett, state:co, state:il, state:in, state:nd]
  - id: cal.1967-12.vietnam
    when: Dec.
    date: 1967-12
    thread: vietnam
    c: 'The year''s American dead in Southeast Asia, by the Defense Department''s file: 11,363, 9,662 of hostile causes; 20,048 since 1961. As printed in 1968: 9,378 battle deaths. Forces in South Vietnam, Dec. 31: 485,600 (486,600 as printed in 1968).'
    n: '[NARA, Defense Casualty Analysis System, Vietnam Conflict Extract Data File, as of Apr. 29, 2008](https://catalog.archives.gov/id/2240992); [*Statistical Abstract of the United States, 1968*](https://www.census.gov/library/publications/1968/compendia/statab/89ed.html), table 373, p. 258; [*Selected Manpower Statistics*, FY-74](https://archive.org/details/DTIC_ADA043053), p. 63. See [[cal.1964-12.vietnam]].'
    tags: [wardead:1967]
  - id: cal.1967-12.oil
    when: Dec.
    date: 1967-12
    thread: oil
    c: 'The world''s crude oil output in 1967, as the Bureau of Mines first counted it: 35.3 million barrels a day. The United States 8.81, the Soviet Union 5.80, Venezuela 3.54, Iran 2.61, Saudi Arabia 2.60. Libya 1.74; Nigeria 0.32, from 0.42.'
    n: Bureau of Mines, [*Minerals Yearbook 1967*, I–II, Table 60, p. 947](https://archive.org/details/pub_usgov-minerals-yearbook_1967_12/page/n956) (1968). See [[cal.1960-12.oil]].
    tags: [oilworld:1967]
