    n: 'Statement by the President After Signing Joint Resolution Providing for Continuing Appropriations, Fiscal Year 1968, [1967 Pub. Papers 1174](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=566) (Dec. 19, 1967). Statute (K–J Cong. II.J.2). See [[cal.1967-11-29.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
