  - id: cal.1967-12-12.specials
    when: Dec. 12
    date: '1967-12-12'
    thread: specials
    also: [war-opposition]
    c: 'California 11th, special run-off. McCloskey (R), a lawyer of Portola Valley who ran against the war, takes the seat of Younger (R), who died June 20, over Archibald (D), 66,385 to 44,319, 57.7 percent; Shirley Temple Black, write-in, 4,064, 3.5 percent. The special primary, Nov. 14: McCloskey over Black, 52,882 to 34,521, 34.4 percent; Draper (R) 19,566, 12.7 percent; Archibald 15,069, 9.8 percent; no majority.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 5, 1968, p. 8](https://archive.org/details/californiastate196668cali/page/n185). To check: [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-04-11.specials]]. Names: McCloskey, Younger, Shirley Temple Black.'
    tags: [special:1967-12-12-h-CA-11, name:mccloskey-paul-n-jr, name:younger-jesse-a, name:black-shirley-temple, state:ca]
  - id: cal.1967-12-12.europe-and-the-alliance
    when: Dec. 12–14
    date: '1967-12-12'
    thread: europe-and-the-alliance
    c: 'Brussels, the North Atlantic Council''s first ministerial meeting at its new seat. The Harmel report, "The Future Tasks of the Alliance," adopted: defense and détente together; a study of balanced force reductions. Rusk: results satisfactory, the meeting "partly overshadowed by Greek crisis." Dec. 12, Rusk with the British Foreign Secretary on Britain''s entry to the Common Market.'
    n: 'FRUS 1964–68, XIII, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v13/d280), [281](https://history.state.gov/historicaldocuments/frus1964-68v13/d281). [[w.drea-mcnamara-clifford-and-the-2011]], 386, 391 (the ministers at Brussels, Dec. 12); [[w.schwartz-lyndon-johnson-and-europe]], 212–13 (the Harmel report). To check: [[w.haftendorn-nato-and-the-nuclear]]; [[w.wenger-crisis-and-opportunity]]; ISA paper, "Nuclear Defense Affairs Committee (NDAC) and Nuclear Planning Group (NPG)," Sept. 24, 1968, SecDef Subject Decimal files, Acc 73A-1304 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 386 n.38). See [[cal.1966-12-14.europe-and-the-alliance]]. Names: Harmel, Rusk.'
    src:
      c: 8934aec7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d280: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 386: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 391: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 386 n.38a: A'
        - 'w.schwartz-lyndon-johnson-and-europe 212–13: ?'
    tags: [name:harmel-pierre-c-j-m, name:rusk-dean]
  - id: cal.1967-12-12.open-housing-milwaukee
    when: Dec. 12
    date: '1967-12-12'
    thread: open-housing
    also: [states-and-cities]
    c: Milwaukee. The Common Council passes an alderman's compromise open housing ordinance, modeled on the State's law of 1965, covering a third of the city's housing. Phillips's ordinance, covering all of it, still refused; the Youth Council's marches go on.
    n: '[Milwaukee Public Library, "200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches). Check: the Common Council''s *Proceedings*, Dec. 12, 1967. See [[cal.1967-08-28.open-housing-milwaukee]]. Names: Phillips.'
    tags: [state:wi, city:milwaukee, name:phillips-vel]
  - id: cal.1967-12-13.europe-and-the-alliance
    when: Dec. 13–14
    date: '1967-12-13'
    thread: europe-and-the-alliance
    c: 'Greece. Constantine moves against the junta: tells Talbot at Tatoi, Dec. 13, he will fly north to Kavala, take command of the armed forces and call for the government''s resignation; asks the President''s endorsement. The army stays with the junta; the King, his family and Kollias fly to Rome, Dec. 14. Papadopoulos Prime Minister; a regent named (Check).'
    n: 'FRUS 1964–68, XVI, docs. [344](https://history.state.gov/historicaldocuments/frus1964-68v16/d344), [349](https://history.state.gov/historicaldocuments/frus1964-68v16/d349). To check: [[w.keeley-colonels-coup-and-the]]; [[w.miller-united-states-and-the]]. See [[cal.1967-04-21.europe-and-the-alliance]]. Names: Constantine, Talbot, Kollias, Papadopoulos.'
    tags: [name:constantine-ii, name:talbot-phillips, name:kollias-constantine, name:papadopoulos-george]
  - id: cal.1967-12-13.antisubversion
    when: Dec. 13
    date: '1967-12-13'
    thread: antisubversion
    also: [congress]
    c: 'The House adopts the conference report on the Subversive Activities Control Act amendments, [276–114](https://voteview.com/rollcall/RH0900240): registration, which the courts had struck down, dropped; the Board, on the Attorney General''s petition, to determine and publish which organizations are Communist-action or Communist-front and who are their members. Proxmire''s amendment, modified: the Board to expire unless proceedings are under way and reported to Congress by Jan. 10, 1969. Signed Jan. 2, 1968, [81 Stat. 765](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg765.pdf), without a statement (Check).'
    n: 'Statute (K–J Cong. II.J.2). To check: [[w.goldstein-political-repression-in-modern]]. See [[cal.1967-10-23.antisubversion]]; [[cal.1965-11-15.court]]. Names: Proxmire.'
    tags: [name:proxmire-william]
  - id: cal.1967-12-13.open-housing-louisville
    when: Dec. 13
    date: '1967-12-13'
    thread: open-housing
    also: [mayors, elections-1967]
    c: 'Louisville. The Board of Aldermen, Democrats elected Nov. 7 on a promise to pass it, adopts an open housing ordinance, 9–3: a fine of $100 for refusing to sell or rent for race, religion or national origin; owner-occupied buildings of four units or fewer exempt. Mayor Schmied neither signs nor vetoes it; it takes effect without him.'
    n: '[Ordinance No. 4522, Series 1967](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/2286) (a copy, in the Ivan Allen Jr. mayoral records); [*Carolina Times*, Dec. 23, 1967](https://newspapers.digitalnc.org/lccn/sn83045120/1967-12-23/ed-1/seq-1/). Check: the date of the vote. See [[cal.1967-04-11.open-housing-louisville]]. Names: Schmied.'
    tags: [state:ky, city:louisville, name:schmied-kenneth-a]
  - id: cal.1967-12-13.draft
    when: Dec. 13
    date: '1967-12-13'
    thread: draft
    also: [war-opposition, congress]
    c: Eight House Democrats ask Hershey's resignation. Edward Kennedy offers a bill to leave cases of registrants who obstruct the draft to the federal courts.
    n: 'The Representatives'' statement, inserted by Kastenmeier: [113 Cong. Rec. 36495](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt27/pdf/GPO-CRECB-1967-pt27-1-2.pdf#page=169). Kennedy''s bill, S. 2773: [113 Cong. Rec. 36184](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt27/pdf/GPO-CRECB-1967-pt27-1-1.pdf#page=10). Check: the signers. See [[cal.1967-12-09.draft]]. Names: Hershey, Edward Kennedy.'
    tags: [name:hershey-lewis-b, name:kennedy-edward-m]
  - id: cal.1967-12-13.welfare
    when: Dec. 13
    date: '1967-12-13'
    thread: welfare
    also: [health]
    c: 'Social Security Amendments. The conference: benefits up 13 percent, the minimum $55. The House''s limits on aid to dependent children kept: federal matching frozen at the proportion of children in each State on the rolls by reason of a parent''s absence, Jan. 1968; adults and older children referred to work or training, the work incentive program. The House adopts the report, [390–3](https://voteview.com/rollcall/RH0900239). Check the terms.'
    n: 'Check: the conference report and the Record''s page. See [[cal.1967-11-22.welfare]].'
  - id: cal.1967-12-13.opinion
    when: Dec. 13
    date: '1967-12-13'
    thread: opinion
    also: [middle-east]
    c: 'Gallup, Nov. 16–21, nations rated from plus 5 to minus 5, highly favorable and highly unfavorable: Canada 65 percent, none; England 36 and 3; Israel 23 and 4; France 10 and 19; Egypt 5 and 17.'
    n: '[[w.gallup-poll]], III, 2094.'
  - id: cal.1967-12-14.consumers
    when: Dec. 14
