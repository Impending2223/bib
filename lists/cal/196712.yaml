    n: '[[w.schlesinger-robert-kennedy-and-his]], 833–34; [[w.shesol-mutual-contempt]], 408 ("I still don''t think he knows what he is doing"; "Bobby is no more decisive than you are when torn by conflicting sentiments"). Check: Shesol''s note, 408 n., gives Roche to Johnson, Jan. 26, 1968, Watson Files, box 25, for the "War of Liberation". To check: Roche to Johnson, Dec. 4, 1967, Johnson Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 834 n.47). Names: Roche, Johnson, Robert Kennedy. Check: Palermo, 86 n.46, cites Watson to Johnson, Dec. 5, 1967, with Roche of Dec. 11.'
