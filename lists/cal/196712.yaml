  - id: cal.1967-12-05.europe-and-the-alliance-cyprus
    when: Dec. 5
    date: '1967-12-05'
    thread: cyprus
    c: 'Cyprus. Johnson''s statement: "peace has emerged the victor."'
    n: 'Statement by the President on the Preservation of Peace in Cyprus, [1967 Pub. Papers 1100](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=492) (Dec. 5, 1967). FRUS 1964–68, XVI, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v16/d342). See [[cal.1967-11-15.europe-and-the-alliance]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-05.vietnam
    when: Dec. 5
    date: '1967-12-05'
    thread: vietnam
    c: 'Johnson on taking the American resolution to the Security Council: the British may ask a bombing halt with nothing in return. No decision. Westmoreland''s two proposals: the raid into Laos, on Base Area 607, approved; the attack across the Cambodian border taken up again at 6:02 p.m., Wheeler, Clifford and Fortas joining. Rusk: "a significant act of war against Cambodia"; McNamara: "I am scared to death"; Clifford "unalterably opposed." Johnson: Westmoreland to explore "other means of getting at the enemy."'
    n: 'FRUS 1964–68, V, doc. [428](https://history.state.gov/historicaldocuments/frus1964-68v05/d428); XXVII, docs. [214](https://history.state.gov/historicaldocuments/frus1964-68v27/d214), [216](https://history.state.gov/historicaldocuments/frus1964-68v27/d216) (Laos and Cambodia). [[w.gibbons-u-s-government-and]], IV, 922, 937–39 (Tom Johnson''s notes). See [[cal.1967-11-30.vietnam]]. Names: Johnson, Westmoreland, Wheeler, Clifford, Fortas, Rusk, McNamara.'
    tags: [name:johnson-lyndon-b, name:westmoreland-william, name:wheeler-earle, name:clifford-clark, name:fortas-abe, name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1967-12-06.opinion
    when: Dec. 6
    date: '1967-12-06'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 16–21: have read or heard of Eugene McCarthy, 42 percent. Of all asked, in a State primary between McCarthy as a peace candidate and Johnson: Johnson 24, McCarthy 11, undecided 7.'
    n: '[[w.gallup-poll]], III, 2093. Names: McCarthy, Johnson.'
    tags: [name:mccarthy-eugene-j, name:johnson-lyndon-b]
  - id: cal.1967-12-07.vietnam-congress
    when: Dec. 7
    date: '1967-12-07'
    thread: vietnam-congress
    c: 'McPherson to Mansfield: support the President on the procedural question of Rusk''s testimony. Mansfield: "I think he''s wrong, but I''ll try to support him. But you ought to be aware that this could develop into a Constitutional crisis."'
    n: 'McPherson to Johnson, Dec. 7, [FRUS 1964–68, V: Vietnam, 1967, doc. 431](https://history.state.gov/historicaldocuments/frus1964-68v05/d431). [[w.gibbons-u-s-government-and]], IV, 915. See [[cal.1967-11-30.vietnam-congress]]. Names: McPherson, Mansfield, Rusk.'
    tags: [name:mcpherson-harry, name:mansfield-mike, name:rusk-dean]
  - id: cal.1967-12-08.vietnam-congress
    when: Dec. 8
    date: '1967-12-08'
    thread: vietnam-congress
    c: 'Rusk to Fulbright, cleared by McPherson: the matters "should be fully discussed only in executive session"; he will testify in one at any time.'
    n: 'McPherson to Johnson, Dec. 7, [FRUS 1964–68, V: Vietnam, 1967, doc. 431](https://history.state.gov/historicaldocuments/frus1964-68v05/d431), n. 4 (Rusk''s letter, dated Dec. 7, "sent the next day after approval by the President"; McPherson''s memorandum transmitting it). [[w.gibbons-u-s-government-and]], IV, 915. See [[cal.1967-12-07.vietnam-congress]]. Names: Rusk, Fulbright, McPherson.'
    tags: [name:rusk-dean, name:fulbright-j-william, name:mcpherson-harry]
