    when: Dec. 3–4
    date: '1967-12-03'
    thread: cyprus
    c: 'Cyprus. Agreement: Greek forces beyond the 1960 treaty''s numbers withdrawn, Turkey''s mobilization undone (Check the terms).'
    n: 'FRUS 1964–68, XVI, doc. [340](https://history.state.gov/historicaldocuments/frus1964-68v16/d340) (Belcher, Dec. 3). Check: the text. See [[cal.1967-11-15.europe-and-the-alliance]].'
  - id: cal.1967-12-04.king
    when: Dec. 4
    date: '1967-12-04'
    thread: king
    also: [poverty]
    c: 'Atlanta, Ebenezer Baptist Church. King announces the Poor People''s Campaign: the poor, black and white, to Washington from April, to stay until Congress and the President act on jobs and income; civil disobedience if need be. The SCLC''s staff had agreed on it at Frogmore, S.C., late November (Check).'
    n: '[[w.garrow-bearing-the-cross]], 580–83; [[w.branch-at-canaans-edge]], 655–56 ("waves of the nation''s poor and disinherited"; three thousand to begin; "Dr. King Planning to Disrupt Capital in Drive for Jobs"). To check: [[w.mcknight-last-crusade]]; [[w.fairclough-to-redeem-the-soul]]; "Tentative Schedule, SCLC Staff Retreat, 11/27-12/1/67", Gary Massoni Papers; King, "The State of the Movement," Nov. 28, 1967, King Papers, King Center (cited by [[w.garrow-bearing-the-cross]], 580 n.11); SCLC Staff Workshop transcript, Nov. 29, 1967, King Center (cited by [[w.garrow-bearing-the-cross]], 581 n.12); King, press conference, Dec. 4, 1967, King Papers, King Center; New York Times, Dec. 5, 1967, 1; Atlanta Constitution, Dec. 5, 1967, 1; Washington Post, Dec. 5, 1967, A2 (cited by [[w.garrow-bearing-the-cross]], 582 n.13). See [[cal.1966-08-26.open-housing]]. Check: Garrow, 580, 582, has the Frogmore retreat Nov. 27–Dec. 1 and the press conference two days after. Names: King.'
