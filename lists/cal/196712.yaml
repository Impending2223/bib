    when: Dec. 2
    date: '1967-12-02'
    thread: vietnam-packers
    c: 'Harriman to Johnson on his trip: all said the Russians would increase their aid to Hanoi to offset any American escalation.'
    n: 'FRUS 1964–68, V, doc. [425](https://history.state.gov/historicaldocuments/frus1964-68v05/d425). See [[cal.1967-11-21.vietnam]]. Names: Harriman, Johnson.'
