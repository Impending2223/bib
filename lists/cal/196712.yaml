  - id: cal.1967-12-19.vietnam
    when: Dec. 19–24
    date: '1967-12-19'
    thread: vietnam
    also: [korea]
    c: 'Johnson to Holt''s memorial service: Honolulu, Dec. 19; Pago Pago; Canberra, Dec. 21; Melbourne, Dec. 22. At Canberra with Thiệu: his government ready to talk with individuals of the NLF, not with the Front as an organization; with Park, McEwen and Holyoake on more allied troops. Dec. 23: Khorat, Thailand; Cam Ranh Bay; Karachi, Ayub Khan; Rome, Saragat, Moro and Fanfani, and the Vatican, Paul VI, with an aide-mémoire: "We would be willing to stop the bombing and proceed promptly to serious and productive discussions." Home Dec. 24.'
    n: 'The President''s Remarks Upon Arrival in Honolulu at the Beginning of His Round-the-World Trip, [1967 Pub. Papers 1173](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=565) (Dec. 19, 1967); Joint Statement Following Discussions in Canberra With President Thieu of Vietnam, [1967 Pub. Papers 1180](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=572) (Dec. 21, 1967); Statement by the President Following His Meeting at the Vatican With Pope Paul VI, [1967 Pub. Papers 1189](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=581), and Statement by the President Upon His Departure From Italy, [1967 Pub. Papers 1189](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=581) (Dec. 23, 1967). FRUS 1964–68, V, doc. [442](https://history.state.gov/historicaldocuments/frus1964-68v05/d442); XXVII, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v27/d34), [35](https://history.state.gov/historicaldocuments/frus1964-68v27/d35); XXIX, pt. 1, doc. [140](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d140); XXIX, pt. 1, doc. [139](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d139) (Rostow from Canberra, Dec. 21); XXV, doc. [475](https://history.state.gov/historicaldocuments/frus1964-68v25/d475); XII, docs. [309](https://history.state.gov/historicaldocuments/frus1964-68v12/d309), [310](https://history.state.gov/historicaldocuments/frus1964-68v12/d310). [[w.drea-mcnamara-clifford-and-the-2011]], 494 (Johnson and Park at Canberra, Dec. 21, the light division); [[w.johnson-vantage-point]], 378–80 (Canberra, Thiệu, Karachi, the Vatican); [[w.dallek-flawed-giant]], 500–501 (the trip, Dec. 20–24 by Dallek; Cam Ranh Bay; Thiệu and the NLF; the Pope). Johnson dates his leaving Washington Dec. 19 (378), and names no Italian: "a prearranged rendezvous in the country to meet the leaders of the Italian government" (379). To