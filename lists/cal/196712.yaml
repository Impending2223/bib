      c: 29d00cbd
      rows:
        - 'w.gibbons-u-s-government-and IV, 893 n.110: all'
        - 'via x.1968-01-17.the-bermuda-paper-new-york-times: all'
    tags: [name:ridgway-matthew-b, name:gilpatric-roswell-l, name:kistiakowsky-george-b]
