  - id: cal.1967-12-01.vietnam
    when: Dec. 1–3
    date: '1967-12-01'
    thread: vietnam
    c: 'Bermuda. A meeting of 24 prominent Americans sponsored by the Carnegie Endowment for International Peace, Ridgway, Gilpatric, Kistiakowsky, John Cowles and Hedley Donovan among them. Their statement: "a serious danger that the momentum of the Vietnam conflict may carry hostilities to disproportionate and even perilous levels"; ground probes into Laos and Cambodia would lead to an invasion of the North; policy should aim at moderating the level of hostilities.'
    n: '[[w.gibbons-u-s-government-and]], IV, 893 n.110. To check: the "Bermuda paper," *New York Times*, Jan. 17, 1968 (cited by [[w.gibbons-u-s-government-and]], IV, 893 n.110). Names: Ridgway, Gilpatric, Kistiakowsky.'
