# Cal. CII April 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CII
entries:
  - id: cal.1968-04-01.vietnam
    when: Apr. 1–2
    date: '1968-04-01'
    thread: vietnam
    also: [congress]
    c: 'Apr. 1, a strike near Thanh Hóa, some 200 miles north of the zone (Check the distance). Apr. 2, Fulbright in the Senate: the limitation "not a significant change at all"; Mansfield on the President''s "inexact language." Johnson, Apr. 2, with Clifford, Katzenbach, Helms, Wheeler and Rostow: Congress to be briefed, the line the 20th parallel; "We stopped hitting 90% of the population and we have nothing in return."'
    n: 'FRUS 1964–68, VI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v06/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v06/d173). [Johnson and Fulbright, 4:03 p.m., Apr. 1](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-april-1-1968), Conversation WH6804-01-12901 (Miller Center). [*New York Times*, Apr. 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/03/issue.html). See [[cal.1968-03-31.elections-1968]]. Names: Fulbright, Mansfield, Johnson, Clifford, Katzenbach, Helms, Wheeler, Rostow.'
    tags: [name:fulbright-j-william, name:mansfield-mike, name:johnson-lyndon-b, name:clifford-clark, name:katzenbach-nicholas, name:helms-richard, name:wheeler-earle, name:rostow-walt-w]
  - id: cal.1968-04-01.court
    when: Apr. 1
    date: '1968-04-01'
    thread: court
    also: [states-and-cities]
    c: '*Avery v. Midland County*, [390 U.S. 474](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390474/usrep390474.pdf): one person, one vote holds for a local government of general powers. The commissioners court of Midland County, Tex., elected from four districts, one of them, the city of Midland, with some 95 percent of the county''s people (Check the share).'
    n: 'Opinion. [[w.powe-warren-court-and-american]]; [[w.baker-reapportionment-revolution]]. See [[cal.1964-06-15.court]].'
    tags: [state:tx]
  - id: cal.1968-04-01.vietnam-2
    when: Apr. 1–8
    date: '1968-04-01'
    thread: vietnam
    c: 'Khe Sanh relieved. Operation Pegasus, from Apr. 1: the 1st Cavalry Division and Marines west along Route 9; the base reached Apr. 8 (Check the day). Johnson to the forces in Southeast Asia, Apr. 8: "Now the siege of Khe Sanh is lifted."'
    n: '[Message to U.S. Armed Forces in Southeast Asia on the Lifting of the Siege of Khe Sanh](https://www.presidency.ucsb.edu/documents/message-us-armed-forces-southeast-asia-the-lifting-the-siege-khe-sanh) (Apr. 8, 1968). See [[cal.1968-01-21.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-02.elections-1968
    when: Apr. 2
    date: '1968-04-02'
    thread: elections-1968
    c: 'Wisconsin primary. Republican: Nixon 79.7 percent, Reagan 10.4. Democratic: McCarthy 56.2 percent, Johnson 34.6.'
    n: '[*1969 Wisconsin Book*, 234–243](https://asset.library.wisc.edu/1711.dl/GMDNMSNXDGTAN8A/E/file-73e4e.pdf#page=242). CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Johnson, Nixon, Reagan.'
    tags: [primary:1968-04-02, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:nixon-richard-m, name:reagan-ronald]
  - id: cal.1968-04-02.economy
    when: Apr. 2
    date: '1968-04-02'
    thread: economy
    also: [congress]
    c: 'The Senate adopts the Smathers–Williams amendment to H.R. 15414, the surcharge and the cuts in spending, [54–35](https://voteview.com/rollcall/RS0900385), and passes the bill, [57–31](https://voteview.com/rollcall/RS0900386). Ways and Means, Mills its chairman, to decide whether to go to conference (Check).'
    n: '[[w.zelizer-taxing-america]]. See [[cal.1968-03-26.economy]]. Names: Smathers, Williams, Mills.'
    tags: [name:smathers-george-a, name:williams-john-j, name:mills-wilbur-d]
  - id: cal.1968-04-02.crime-and-hijacking
    when: Apr. 2
    date: '1968-04-02'
    thread: crime-and-hijacking
    c: 'The House refuses to disapprove Reorganization Plan No. 1 of 1968, [190–200](https://voteview.com/rollcall/RH0900287): Treasury''s Bureau of Narcotics and HEW''s Bureau of Drug Abuse Control merged into a Bureau of Narcotics and Dangerous Drugs in the Department of Justice. In effect Apr. 8.'
    n: '[[w.epstein-agency-of-fear]]. See [[cal.1968-02-07.crime-and-hijacking]].'
  - id: cal.1968-04-03.vietnam
    when: Apr. 3–4
    date: '1968-04-03'
    thread: vietnam
    c: 'Hanoi''s statement, broadcast: the limitation "a defeat and at the same time a shrewd trick," but the government of North Vietnam "declares its readiness to appoint its representatives to contact the United States representative with a view to determining with the American side the unconditional cessation of the United States bombing raids and all other acts of war against the Democratic Republic of Vietnam so that talks may start." Johnson: "we will establish contact with the representatives of North Vietnam." The American note, through Vientiane: Geneva. Apr. 4, Johnson with U Thant at the UN.'
    n: '[Statement by the President Following Hanoi''s Declaration of Readiness To Begin Discussions](https://www.presidency.ucsb.edu/documents/statement-the-president-following-hanois-declaration-readiness-begin-discussions) (Apr. 3, 1968). FRUS 1964–68, VI, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v06/d175), [178](https://history.state.gov/historicaldocuments/frus1964-68v06/d178), [181](https://history.state.gov/historicaldocuments/frus1964-68v06/d181). [[w.herring-secret-diplomacy-of-the]]; [[w.nguyen-hanois-war]]; [[w.asselin-vietnams-american-war]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-03-31.elections-1968]]. Names: Johnson, U Thant.'
    tags: [name:johnson-lyndon-b, name:u-thant]
  - id: cal.1968-04-03.robert-kennedy
    when: Apr. 3
    date: '1968-04-03'
    thread: robert-kennedy
    also: [elections-1968]
    c: 'Robert Kennedy and Sorensen with Johnson at the White House, at Kennedy''s asking. Would Johnson oppose his candidacy, or mobilize forces against him? Johnson: but for a few fund-raising dinners he plans to keep out of campaign politics; he "does not wish to forego his options."'
    n: 'FRUS 1964–68, VI, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v06/d176). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Sorensen, Johnson.'
    tags: [name:kennedy-robert-f, name:sorensen-theodore-c, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1968-04-03.king
    when: Apr. 3
    date: '1968-04-03'
    thread: king
    c: 'Memphis. The federal district court bars a second march, on the city''s petition (Check). King at Mason Temple, at night: "I may not get there with you. But I want you to know tonight, that we, as a people, will get to the promised land."'
    n: '[*New York Times*, Apr. 4, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/04/issue.html). See [[cal.1968-03-18.king]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:tn, city:memphis]
  - id: cal.1968-04-04.king
    when: Apr. 4
    date: '1968-04-04'
    thread: king
    c: 'Memphis. King, on the balcony of the Lorraine Motel, shot at 6:01 p.m. by a rifleman from a rooming house on South Main Street; dead at St. Joseph''s Hospital, 7:05 p.m. Johnson, 9:07 p.m.: "I ask every citizen to reject the blind violence that has struck Dr. King, who lived by nonviolence"; his trip to Hawaii put off. Apr. 19, the FBI: the man sought, "Eric Starvo Galt," is James Earl Ray, escaped from the Missouri State Penitentiary in 1967 (Check).'
    n: '[Statement by the President on the Assassination of Dr. Martin Luther King, Jr.](https://www.presidency.ucsb.edu/documents/statement-the-president-the-assassination-dr-martin-luther-king-jr) (Apr. 4, 1968). [Johnson, Ivan Allen and Lady Bird Johnson, 11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ivan-allen-and-lady-bird-johnson-april-5-1968), Conversation WH6804-01-12908 (Miller Center). [*New York Times*, Apr. 5, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/05/issue.html); [Apr. 20, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/20/issue.html). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]; [[w.honey-going-down-jericho-road]]; [[w.beifuss-at-the-river-i]]; [[w.posner-killing-the-dream]]; [[w.sides-hellhound-on-his-trail]]; [[w.garrow-fbi-and-martin-luther]]; [[w.kotz-judgment-days]]. See [[cal.1967-12-04.king]]. Names: King, Johnson, Ray.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, name:ray-james-earl, name:allen-ivan-jr, state:tn, city:memphis]
  - id: cal.1968-04-04.robert-kennedy
    when: Apr. 4
    date: '1968-04-04'
    thread: robert-kennedy
    also: [king]
    c: 'Indianapolis. Robert Kennedy, from a flatbed truck at a rally in a Negro neighborhood, tells the crowd that King has been killed: "For those of you who are black and are tempted to be filled with hatred and distrust at the injustice of such an act, against all white people, I can only say that I feel in my own heart the same kind of feeling. I had a member of my family killed, but he was killed by a white man."'
    n: '[*New York Times*, Apr. 5, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/05/issue.html). [[w.clarke-last-campaign]]; [[w.thomas-robert-kennedy]]; [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, King.'
    tags: [name:kennedy-robert-f, name:king-martin-luther-jr, state:in, city:indianapolis]
  - id: cal.1968-04-04.civil-disorders
    when: Apr. 4–11
    date: '1968-04-04'
    thread: civil-disorders
    also: [king]
    c: 'Riots after King''s death, in more than a hundred cities (Check). Washington, from 14th and U Streets, Apr. 4 at night; Apr. 5, Proclamation 3840 and Executive Order 11403: federal troops and the District''s Guard, some 13,600 in all (Check), a curfew. Chicago''s West Side, Apr. 5–7: Acting Governor Shapiro asks for troops, Apr. 6; Executive Order 11404, Apr. 7. Baltimore, from Apr. 6: Agnew asks for troops; Executive Order 11405, Apr. 7. Dead: Washington 12, Chicago 11, Baltimore 6 (Check the counts).'
    n: '[Executive Order 11403](https://www.presidency.ucsb.edu/documents/executive-order-11403-providing-for-the-restoration-law-and-order-the-washington); [Proclamation 3840](https://www.presidency.ucsb.edu/documents/proclamation-3840-law-and-order-the-washington-metropolitan-area) (Apr. 5, 1968); [Telegram to the Acting Governor of Illinois](https://www.presidency.ucsb.edu/documents/telegram-the-acting-governor-illinois-response-his-request-for-federal-troops-chicago) (Apr. 6, 1968); [Executive Order 11404](https://www.presidency.ucsb.edu/documents/executive-order-11404-providing-for-the-restoration-law-and-order-the-state-illinois); [Telegram to the Governor of Maryland](https://www.presidency.ucsb.edu/documents/telegram-the-governor-maryland-response-his-request-for-federal-troops-baltimore); [Executive Order 11405](https://www.presidency.ucsb.edu/documents/executive-order-11405-providing-for-the-restoration-law-and-order-the-state-maryland) (Apr. 7, 1968). [Johnson and Daley, 5:19 p.m., Apr. 6](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-april-6-1968), Conversation WH6804-01-12910 (Miller Center). [[w.risen-nation-on-fire]]; [[w.gilbert-ten-blocks-from-the]]; [[w.baltimore-68]]; [[w.cohen-american-pharaoh]]; [[w.witcover-white-knight]]. See [[cal.1967-07-27.civil-disorders]]. Names: Shapiro, Agnew, Johnson.'
    tags: [name:shapiro-samuel-h, name:agnew-spiro-t, name:johnson-lyndon-b, name:daley-richard-j, name:washington-walter-e, state:dc, city:washington, state:il, city:chicago, state:md, city:baltimore]
  - id: cal.1968-04-05.king
    when: Apr. 5–7
    date: '1968-04-05'
    thread: king
    also: [open-housing]
    c: 'Johnson meets Negro leaders, members of Congress and others at the White House, then speaks to the nation: "America shall not be ruled by the bullet, but only by the ballot of free and of just men." Proclamation 3839: Apr. 7 a day of mourning, the flag at half-staff until the burial. To the Speaker: "We should pass the Fair Housing law when the Congress convenes next week." Reynolds, Under Secretary of Labor, sent to Memphis to settle the strike (Check the day).'
    n: '[Address to the Nation Upon Proclaiming a Day of Mourning Following the Death of Dr. King](https://www.presidency.ucsb.edu/documents/address-the-nation-upon-proclaiming-day-mourning-following-the-death-dr-king); [Proclamation 3839](https://www.presidency.ucsb.edu/documents/proclamation-3839-death-martin-luther-king-jr); [Letter to the Speaker of the House Urging Enactment of the Fair Housing Bill](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-urging-enactment-the-fair-housing-bill) (Apr. 5, 1968). See [[cal.1968-04-04.king]]. Names: Johnson, Reynolds.'
    tags: [name:johnson-lyndon-b, name:reynolds-james-j, name:mccormack-john-w]
  - id: cal.1968-04-06.vietnam
    when: Apr. 6–9
    date: '1968-04-06'
    thread: vietnam
    c: 'Westmoreland at the White House, Apr. 6–7, the meeting at Honolulu put off: "Since Tet enemy has suffered colossal military defeat. He has lost 60,000 men and 18,000 weapons"; Harriman "will be negotiating from position of strength." Apr. 9, Camp David: Johnson with Bunker, Rusk, Wheeler and others, then Harriman and William Bundy.'
    n: 'FRUS 1964–68, VI, docs. [185](https://history.state.gov/historicaldocuments/frus1964-68v06/d185), [186](https://history.state.gov/historicaldocuments/frus1964-68v06/d186), [189](https://history.state.gov/historicaldocuments/frus1964-68v06/d189). [Remarks to the Press With General Westmoreland](https://www.presidency.ucsb.edu/documents/remarks-the-press-with-general-westmoreland-following-the-generals-report-the-situation) (Apr. 7, 1968); [Remarks to the Press at Camp David With Ambassador Bunker](https://www.presidency.ucsb.edu/documents/remarks-the-press-camp-david-with-ambassador-bunker-following-the-ambassadors-report-the) (Apr. 9, 1968). See [[cal.1968-03-22.vietnam]]. Names: Westmoreland, Harriman, Johnson, Bunker, Rusk, Wheeler, Bundy.'
    tags: [name:westmoreland-william, name:harriman-w-averell, name:johnson-lyndon-b, name:bunker-ellsworth, name:rusk-dean, name:wheeler-earle, name:bundy-william]
  - id: cal.1968-04-08.vietnam
    when: Apr. 8–11
    date: '1968-04-08'
    thread: vietnam
    c: 'The site. Hanoi''s answer, through Vientiane, received Apr. 8: Phnom Penh for the contacts. The United States: Geneva, or four Asian capitals, Vientiane, Rangoon, Djakarta and New Delhi. Hanoi, Apr. 11: Warsaw, Hà Văn Lâu its representative there, the contacts to begin Apr. 18. Johnson to Harriman, Apr. 11: "as long as I am President we are not going to Warsaw."'
    n: '[Remarks to the Press Announcing Receipt of a Message From Hanoi](https://www.presidency.ucsb.edu/documents/remarks-the-press-announcing-receipt-message-from-hanoi) (Apr. 8, 1968). FRUS 1964–68, VI, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v06/d187), [190](https://history.state.gov/historicaldocuments/frus1964-68v06/d190), [191](https://history.state.gov/historicaldocuments/frus1964-68v06/d191), [195](https://history.state.gov/historicaldocuments/frus1964-68v06/d195), [197](https://history.state.gov/historicaldocuments/frus1964-68v06/d197). [Johnson and Harriman, 11:46 a.m., Apr. 11](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-averell-harriman-april-11-1968), Conversation WH6804-01-12917 (Miller Center). See [[cal.1968-04-03.vietnam]]. Names: Hà Văn Lâu, Johnson, Harriman.'
    tags: [name:ha-van-lau, name:johnson-lyndon-b, name:harriman-w-averell]
  - id: cal.1968-04-08.king
    when: Apr. 8–9
    date: '1968-04-08'
    thread: king
    c: 'Memphis, Apr. 8: Coretta Scott King, Abernathy and the union''s leaders at the head of a silent march to City Hall, some 40,000 (Check). Atlanta, Apr. 9: the funeral at Ebenezer Baptist Church; the coffin on a farm wagon drawn by mules to Morehouse College. Humphrey there for the President; Robert Kennedy, McCarthy, Nixon and Rockefeller among the mourners.'
    n: '[*New York Times*, Apr. 9, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/09/issue.html); [Apr. 10, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/10/issue.html). See [[cal.1968-04-04.king]]. Names: Coretta Scott King, Abernathy, Humphrey, Kennedy, McCarthy, Nixon, Rockefeller.'
    tags: [name:king-coretta-scott, name:abernathy-ralph-david, name:humphrey-hubert-h, name:kennedy-robert-f, name:mccarthy-eugene-j, name:nixon-richard-m, name:rockefeller-nelson, state:tn, city:memphis, state:ga, city:atlanta]
  - id: cal.1968-04-08.court
    when: Apr. 8
    date: '1968-04-08'
    thread: court
    also: [crime-and-hijacking]
    c: '*United States v. Jackson*, [390 U.S. 570](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390570/usrep390570.pdf): the Federal Kidnaping Act''s death penalty, open only on a jury''s recommendation, unconstitutional; it needlessly burdens the rights to plead not guilty and to a jury trial. The rest of the act stands.'
    n: 'Opinion. [[w.powe-warren-court-and-american]].'
  - id: cal.1968-04-10.open-housing
    when: Apr. 10–11
    date: '1968-04-10'
    thread: open-housing
    also: [civil-disorders, congress]
    c: 'House, Apr. 10: H. Res. 1100, the Senate''s bill taken without a conference; the previous question ordered, [229–195](https://voteview.com/rollcall/RH0900294); adopted, [250–172](https://voteview.com/rollcall/RH0900295). Apr. 11, the Civil Rights Act of 1968 signed, [82 Stat. 73](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg73.pdf). Title VIII: discrimination in the sale or rental of housing barred by stages to 1970; exempt, the owner selling his own house without a broker, and the owner-occupied house of four units or fewer. Title I: federal crimes of interference with civil rights, and interstate travel to incite a riot. Titles II–VII: the rights of American Indians. Title X: teaching or carrying firearms and explosives for a civil disorder. Johnson: "the voice of justice speaks again."'
    n: '[Broadcast Statement by the President Following the Passage of the Civil Rights Act](https://www.presidency.ucsb.edu/documents/broadcast-statement-the-president-following-the-passage-the-civil-rights-act) (Apr. 10, 1968); [Remarks Upon Signing the Civil Rights Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-civil-rights-act) (Apr. 11, 1968). Statute (K–J Cong. II.J.2). [[w.kotz-judgment-days]]; [[w.bonastia-knocking-on-the-door]]. See [[cal.1967-02-15.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-10.vietnam
    when: Apr. 10–11
    date: '1968-04-10'
    thread: vietnam
    also: [defense]
    c: 'News conference, Apr. 10: Abrams to succeed Westmoreland; Goodpaster his deputy; McCain to succeed Sharp in the Pacific Command. Executive Order 11406: the Secretary of Defense to order units of the Ready Reserve to active duty. Apr. 11, Clifford: some 24,500 reservists called up, about 10,000 of them for Vietnam; the ceiling there 549,500 (Check the figures).'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1206) (Apr. 10, 1968); [Executive Order 11406](https://www.presidency.ucsb.edu/documents/executive-order-11406-assigning-authority-with-respect-ordering-units-the-ready-reserve). [*New York Times*, Apr. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/12/issue.html). [[w.sorley-thunderbolt]]. See [[cal.1968-03-22.vietnam]]. Names: Abrams, Westmoreland, Goodpaster, McCain, Sharp, Clifford, Johnson.'
    tags: [name:abrams-creighton, name:westmoreland-william, name:goodpaster-andrew-j, name:mccain-john-s-jr, name:sharp-u-s-grant, name:clifford-clark, name:johnson-lyndon-b]
  - id: cal.1968-04-10.transition-and-staff
    when: Apr. 10–26
    date: '1968-04-10'
    thread: transition-and-staff
    c: 'News conference, Apr. 10: O''Brien''s resignation as Postmaster General accepted; Watson, the Appointments Secretary, named to succeed him; Jim Jones and Larry Temple to take Watson''s work. Apr. 25, Goldberg resigns as Representative to the United Nations, to stay until June; Ball named. Apr. 26, Watson sworn in.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1206) (Apr. 10, 1968); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1207) (Apr. 25, 1968); [Remarks at the Swearing In of W. Marvin Watson as Postmaster General](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-w-marvin-watson-postmaster-general) (Apr. 26, 1968). [[w.christian-president-steps-down]]. See [[cal.1968-03-22.transition-and-staff]]. Names: O''Brien, Watson, James R. Jones, Temple, Goldberg, Ball, Johnson.'
    tags: [name:obrien-lawrence-f, name:watson-w-marvin, name:jones-james-r, name:temple-larry, name:goldberg-arthur-j, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1968-04-11.civil-disorders
    when: Apr. 11
    date: '1968-04-11'
    thread: civil-disorders
    c: 'Baltimore. Agnew, to some hundred of the city''s Negro leaders called to the State Office Building: they had not spoken out against the rioters and the "circuit-riding, Hanoi-visiting, caterwauling, riot-inciting, burn-America-down type of leader" (Check the words). Most of them walk out.'
    n: '[*New York Times*, Apr. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/12/issue.html). [[w.witcover-white-knight]]; [[w.baltimore-68]]. See [[cal.1968-04-04.civil-disorders]]. Names: Agnew.'
    tags: [name:agnew-spiro-t, state:md, city:baltimore]
  - id: cal.1968-04-15.civil-disorders
    when: Apr. 15–17
    date: '1968-04-15'
    thread: civil-disorders
    c: 'Chicago. Daley, at a news conference: he has told the police superintendent to issue orders "to shoot to kill any arsonist or anyone with a Molotov cocktail in his hand" and "to shoot to maim or cripple anyone looting" (Check the words). Apr. 17, he says no policeman was ordered to shoot to kill (Check).'
    n: '[*New York Times*, Apr. 16, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/16/issue.html). [[w.cohen-american-pharaoh]]. See [[cal.1968-04-04.civil-disorders]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-04-15.japan-and-korea
    when: Apr. 15–17
    date: '1968-04-15'
    thread: japan-and-korea
    also: [vietnam]
    c: 'Honolulu. Johnson with Park Chung Hee. Joint statement, Apr. 17: the attack on the presidential residence at Seoul and the *Pueblo*''s seizure reviewed; further aggression from the North "a most grave threat to peace," the two governments then to determine at once the action to be taken under the Mutual Defense Treaty; the modernization of Korea''s forces to continue; the defense ministers to meet in Washington in May.'
    n: '[Joint Statement Following Discussions With President Park of Korea](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-park-korea-0) (Apr. 17, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [192](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d192), [194](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d194). [[w.lerner-pueblo-incident]]; [[w.park-chung-hee-era]]. See [[cal.1968-01-23.japan-and-korea]]. Names: Johnson, Park Chung Hee.'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1968-04-16.king
    when: Apr. 16
    date: '1968-04-16'
    thread: king
    also: [jobs-and-wages]
    c: 'Memphis. The sanitation strike settled, Reynolds mediating: the City Council recognizes the union, AFSCME''s Local 1733; dues deducted through the workers'' credit union; raises from May 1 and Sept. 1 (Check the terms).'
    n: '[*New York Times*, Apr. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/17/issue.html). See [[cal.1968-03-18.king]]. Names: Reynolds.'
    tags: [name:reynolds-james-j, state:tn, city:memphis]
  - id: cal.1968-04-18.defense
    when: Apr. 18–19
    date: '1968-04-18'
    thread: defense
    c: 'Senate, S. 3293, military procurement for fiscal 1969. An amendment barring funds to deploy the antiballistic missile until it is practicable and its cost can be known, refused, [28–31](https://voteview.com/rollcall/RS0900397), Apr. 18; a cut of about 3 percent, [45–13](https://voteview.com/rollcall/RS0900401); passed, [54–3](https://voteview.com/rollcall/RS0900402), Apr. 19.'
    n: '[[w.bundy-danger-and-survival]]. See [[cal.1967-09-18.defense]].'
  - id: cal.1968-04-20.vietnam
    when: Apr. 20–30
    date: '1968-04-20'
    thread: vietnam
    c: 'The site. Apr. 20, Gronouski told to make it clear to the Poles that Warsaw is not acceptable. Apr. 22–23, Rusk''s proposal approved: a message through Vientiane, the two sides'' ambassadors to meet there to agree on a site (Check the terms). Bucharest weighed. Johnson to Rusk, Apr. 30: "can''t we do something on Bucharest before we get another proposal from them?"'
    n: 'FRUS 1964–68, VI, docs. [201](https://history.state.gov/historicaldocuments/frus1964-68v06/d201), [203](https://history.state.gov/historicaldocuments/frus1964-68v06/d203), [204](https://history.state.gov/historicaldocuments/frus1964-68v06/d204), [205](https://history.state.gov/historicaldocuments/frus1964-68v06/d205), [215](https://history.state.gov/historicaldocuments/frus1964-68v06/d215), [216](https://history.state.gov/historicaldocuments/frus1964-68v06/d216). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-04-08.vietnam]]. Names: Gronouski, Rusk, Johnson.'
    tags: [name:gronouski-john-a, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-04-22.court
    when: Apr. 22
    date: '1968-04-22'
    thread: court
    c: 'Obscenity. *Ginsberg v. New York*, [390 U.S. 629](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390629/usrep390629.pdf): a State may bar the sale to minors under seventeen of material "harmful to minors" that adults may buy. *Interstate Circuit, Inc. v. City of Dallas*, [390 U.S. 676](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390676/usrep390676.pdf): Dallas''s ordinance classifying films "not suitable for young persons" void for vagueness.'
    n: 'Opinions. [[w.powe-warren-court-and-american]]. See [[cal.1966-03-21.court]].'
    tags: [state:tx, city:dallas]
  - id: cal.1968-04-22.states-and-cities
    when: Apr. 22
    date: '1968-04-22'
    thread: states-and-cities
    also: [school-aid]
    c: 'District of Columbia Elected Board of Education Act signed, [82 Stat. 101](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg101.pdf): the board, appointed by the District''s judges, to be elected (Check the number of members and the first election). Through the House, Sept. 25, 1967, [326–3](https://voteview.com/rollcall/RH0900141). Mar. 13, Johnson''s message on the District, "The Nation''s First City."'
    n: '[Remarks Upon Signing the District of Columbia Elected Board of Education Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-district-columbia-elected-board-education-act) (Apr. 22, 1968); [Special Message to the Congress on the District of Columbia: "The Nation''s First City"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-district-columbia-the-nations-first-city) (Mar. 13, 1968). See [[cal.1967-08-09.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1968-04-23.elections-1968
    when: Apr. 23
    date: '1968-04-23'
    thread: elections-1968
    c: 'Pennsylvania primary. Republican: Nixon (write-in) 59.7 percent, Rockefeller (write-in) 18.4. Democratic: McCarthy 71.7 percent, Kennedy (write-in) 11.0.'
    n: 'CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Rockefeller, Nixon, Kennedy.'
    tags: [primary:1968-04-23, name:mccarthy-eugene-j, name:rockefeller-nelson, name:nixon-richard-m, name:kennedy-robert-f]
  - id: cal.1968-04-23.students
    when: Apr. 23–30
    date: '1968-04-23'
    thread: students
    also: [war-opposition]
    c: 'New York. Columbia. Apr. 23, SDS, Rudd its chapter''s chairman, and the Students'' Afro-American Society rally against the university''s gymnasium in Morningside Park and its ties to the Institute for Defense Analyses; Hamilton Hall held, the acting dean kept in his office a day; from Apr. 24 the black students hold it alone. Low Library, with Kirk''s offices, then Avery, Fayerweather and Mathematics taken. Apr. 25, work on the gymnasium suspended. Apr. 30, from about 2:30 a.m., the city''s police clear the five buildings: some 700 arrested, nearly 150 hurt (Check the counts).'
    n: '[*New York Times*, Apr. 24, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/24/issue.html); [May 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/01/issue.html). [[w.disturbances-crisis-at-columbia]]; [[w.avorn-up-against-the-ivy]]; [[w.sale-sds]]; [[w.bradley-harlem-vs-columbia-university]]; [[w.rogers-black-campus-movement]]. Names: Rudd, Kirk.'
    tags: [name:rudd-mark, name:kirk-grayson, state:ny, city:nyc]
  - id: cal.1968-04-26.war-opposition
    when: Apr. 26–27
    date: '1968-04-26'
    thread: war-opposition
    also: [students]
    c: 'Apr. 26, a student strike against the war and the draft, called by the Student Mobilization Committee (Check the numbers). Apr. 27, New York, the Sheep Meadow in Central Park: a rally against the war, Coretta Scott King speaking (Check the numbers).'
    n: '[*New York Times*, Apr. 27, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/27/issue.html); [Apr. 28, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/28/issue.html). [[w.debenedetti-american-ordeal]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. See [[cal.1967-10-21.war-opposition]]. Names: Coretta Scott King.'
    tags: [name:king-coretta-scott, state:ny, city:nyc]
  - id: cal.1968-04-27.elections-1968
    when: Apr. 27
    date: '1968-04-27'
    thread: elections-1968
    c: 'Washington, the Shoreham Hotel. Humphrey announces for the Democratic nomination, Harris and Mondale the co-chairmen of his campaign: "the politics of happiness, the politics of purpose, the politics of joy" (Check the words). The primaries'' filing dates mostly past (Check).'
    n: '[Remarks Declaring Candidacy for the Democratic Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-declaring-candidacy-for-the-democratic-presidential-nomination) (Apr. 27, 1968). [Johnson and Humphrey, 8:46 a.m., Apr. 24](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-april-24-1968), Conversation WH6804-02-12922 (Miller Center). [[w.solberg-hubert-humphrey]]; [[w.humphrey-education-of-a-public-1976]]; [[w.eisele-almost-to-the-presidency]]; [[w.johns-price-of-loyalty]]; [[w.gould-1968]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]. Names: Humphrey, Harris, Mondale.'
    tags: [name:humphrey-hubert-h, name:harris-fred-r, name:mondale-walter-f]
  - id: cal.1968-04-29.king
    when: Apr. 29–May 1
    date: '1968-04-29'
    thread: king
    also: [poverty]
    c: 'Washington. Abernathy and the Poor People''s Campaign''s "Committee of 100" put their demands to members of the Cabinet, the Secretaries of Agriculture, Labor, and Housing and Urban Development among them: jobs, income, food, housing (Check the officials and the demands).'
    n: '[*New York Times*, Apr. 30, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/30/issue.html). [[w.mcknight-last-crusade]]; [[w.fairclough-to-redeem-the-soul]]. See [[cal.1967-12-04.king]]. Names: Abernathy.'
    tags: [name:abernathy-ralph-david, name:freeman-orville-l, name:wirtz-w-willard, name:weaver-robert-c, state:dc, city:washington]
  - id: cal.1968-04-30.elections-1968
    when: Apr. 30
    date: '1968-04-30'
    thread: elections-1968
    c: 'Massachusetts primary. Republican: Rockefeller (write-in) 30.0 percent, Volpe 29.5. Democratic: McCarthy 49.3 percent, Kennedy (write-in) 27.6.'
    n: 'Mass., [*Election Statistics*, 1968 (Pub. Doc. No. 43), 45, 80](https://archive.org/details/electionstatisti19671968mass/page/n115). CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Volpe, Rockefeller, Kennedy.'
    tags: [primary:1968-04-30, name:mccarthy-eugene-j, name:volpe-john-a, name:rockefeller-nelson, name:kennedy-robert-f]
  - id: cal.1968-04-30.elections-1968-2
    when: Apr. 30
    date: '1968-04-30'
    thread: elections-1968
    c: 'Rockefeller announces he will seek the Republican nomination. The same day, Massachusetts''s Republican primary: the most write-in votes his.'
    n: '[*New York Times*, May 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/01/issue.html). See [[cal.1968-03-21.elections-1968]]; [[cal.1968-04-30.elections-1968]]. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-04-30.economy
    when: Apr. 30
    date: '1968-04-30'
    thread: economy
    also: [trade]
    c: 'Message on the international monetary system: Congress to approve the amendment to the International Monetary Fund''s Articles creating Special Drawing Rights, a new reserve asset. The amendment agreed by the Group of Ten at Stockholm, Mar. 29–30, France reserving its position.'
    n: '[Special Message to the Congress: "Strengthening the International Monetary System"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-strengthening-the-international-monetary-system) (Apr. 30, 1968). FRUS 1964–68, VIII, doc. [193](https://history.state.gov/historicaldocuments/frus1964-68v08/d193). See [[cal.1967-08-26.economy]]; [[cal.1968-03-14.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
