    c: The Zhou Huan 周桓 case group 专案组 of the Shenyang Military Region 沈阳军区 and the Song Renqiong 宋任穷 case group interrogate Peng Dehuai 彭德怀.
    n: '[[w.peng-dehuai-nianpu]], 825. Made public: 1998. Names: Peng Dehuai.'
