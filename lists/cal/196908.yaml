  - id: cal.1969-08-08.china-leadership
    when: Aug. 8
    date: '1969-08-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai revises the draft Center notice on strictly controlling those coming to Peking, adding that by the Ninth Congress's spirit all petitioners, investigators outside, visitors, those on errands, those seeking treatment and those who have drifted out are to return to their own localities and units, achieve great alliance and three-in-one, do struggle-criticism-reform well and truly "grasp revolution, promote production, work and war preparation".
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-08.china
    when: Aug. 8
    date: '1969-08-08'
    place: khabarovsk
    thread: china
    also: [soviet-union]
    c: The 15th regular session of the China–Soviet joint commission on navigation of the boundary rivers, held since June 18, ends on Aug. 8 at Khabarovsk. China's delegation, in a spirit of making it succeed and settling questions, has patiently consulted the Soviet side; they agree on some particular points of navigation on the boundary rivers and sign the minutes of the session.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 219 (Aug. 8, 1969).'
    src:
      c: 548b595c
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 219: all'
    tags: [polity:prc, polity:ussr]
  - id: cal.1969-08-08.china-leadership-2
    when: Aug. 8
    date: '1969-08-08'
    place: peking
    thread: china-leadership
    c: The Li Jukui 李聚奎 case group 专案组 of the General Logistics Department 总后 interrogates Peng Dehuai 彭德怀 on his talk at Shenyang 沈阳 in 1952, passing through on his way from Korea 朝鲜 to Peking 北京 to have a tumor removed, and on the meeting at Gao Gang's 高岗.
    n: '[[w.peng-dehuai-nianpu]], 825. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1969-08-09.vietnam-hanoi
    when: Aug. 9
    date: '1969-08-09'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Politburo''s resolution reorganizes the Council of Ministers'' economic bodies: Heavy Industry split into a Ministry of Power and Coal, a Ministry of Engineering and Metals and a General Department of Chemicals; a Ministry of Food; Materials a ministry; a Government Inspection Committee; the Prime Minister''s industry, agriculture and finance offices merged into one Economic Office. Đỗ Mười Deputy Prime Minister and its head; Trần Danh Tuyên Materials, Nguyễn Hữu Mai Power and Coal, Đinh Đức Thiện Engineering and Metals, Ngô Minh Loan, from the Peking embassy, Food; Nguyễn Thanh Bình the Inspection Committee.'
    n: '*Nghị quyết của Bộ Chính trị số 1733-NQ/TW* (so printed), *ngày 9 tháng 8 năm 1969, Về việc sửa đổi và thành lập một số tổ chức mới thuộc Hội đồng Chính phủ*, signed for the Politburo by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXX, 222–24. Made public: 2004. Check: the number, 1733, beside nos. 187–194 of 1969. Names: Đỗ Mười, Trần Danh Tuyên, Nguyễn Hữu Mai, Đinh Đức Thiện, Ngô Minh Loan, Nguyễn Thanh Bình.'
    tags: [polity:drv, vis:only:drv, name:le-duc-tho, name:ngo-minh-loan]
  - id: cal.1969-08-09.china-leadership
    when: Aug. 9
    date: '1969-08-09'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai presides over the conference on cutting-edge defense research with the heads of the National Defense Industry Office, the National Defense Science and Technology Commission and the Second Ministry. Since some experts and engineers cannot work freely to break the technical barriers, he announces: Qian Xuesen is to be commander and Yang Guoyu political commissar, the two responsible; Yang is the political guarantee, and if Qian or other experts are seized and cannot work normally he will hold Yang to account. He approves a list of several hundred engineers and technicians to be specially protected, all of the best in defense research, even those not directly on a project: to be protected chiefly politically, none to be molested or seized, and if anyone means to fight or seize them, by force of arms if need be.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-09.china-leadership-2
    when: Aug. 9
    date: '1969-08-09'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai announces, for the Center and the State Council, the order sending down over 9,600 people of the Seventh Ministry and its systems, and takes responsibility for the leadership's having failed in two years and more to persuade the two factions to overcome factionalism and stop the "civil war".
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 9, 1969). Made public: 2020. See [[cal.1969-07-25.china-leadership]]. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-09.china-leadership-3
    when: Aug. 9
    date: '1969-08-09'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Jiang Qing writes Lin Biao on the present literary and art work and on popularizing the "revolutionary model operas", asking that her views be sent to all places. The Politburo members in Peking agree to forward it, on Lin's note of Aug. 15; Zhou Enlai and Jiang Qing then agree to ask Mao first, and the paper is shelved.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 9, 1969). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Lin Biao, Mao Zedong. Check: the day; the nianpu places the item at Aug. 9 yet cites Lin''s note of the 15th.'
    tags: [polity:prc, name:zhou-enlai, name:jiang-qing, name:lin-biao, name:mao-zedong, vis:only:prc]
  - id: cal.1969-08-11.vietnam-hanoi-2
    when: Aug. 11
    date: '1969-08-11'
    place: loc-ninh
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Eastern Nam Bộ, the autumn offensive's first night. The 7th Division's artillery hits a Saigon ranger camp at Lộc Ninh, 100 out of action, by the history's count; the command's sappers hit the Chơn Thành subsector and the Tếch Ních base of the Saigon 9th Regiment; the 5th Division's sappers the Bù Na ranger training camp and then the Bù Đăng subsector, three strategic hamlets broken. At Tây Ninh the 88th Regiment attacks an airborne group and fails, with heavy losses; sappers of the 1st Division's 2d Regiment take the Lôvêa cluster from the Saigon 2d Battalion, 8th Airborne, which falls back to Suối Dây.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 131–32. See [[cal.1969-08-11.vietnam-hanoi]].'
    tags: [polity:drv]
    time_range:
      - 1969-08-11T14:00Z
      - 1969-08-11T16:00Z
    time_band: night
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-08-11.vietnam-hanoi-3
    when: Aug. 11
    date: '1969-08-11'
    place: song-mao
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Bình Thuận, Region 6. Forces raid the Sông Mao base and badly hurt a battalion of the Saigon 44th Regiment; Saigon moves its reserves to Bình Thuận, and local forces ambush vehicles on Routes 1 and 20.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 132–33. See [[cal.1969-08-11.vietnam-hanoi]].'
    tags: [polity:drv]
  - id: cal.1969-08-11.vietnam-hanoi
    when: Aug. 11
    date: '1969-08-11'
    place: loc-ninh
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The autumn offensive opens across the South under the resolution of COSVN''s ninth conference, its first high point: infantry, artillery and sappers strike 140 targets, more than 30 towns, 61 district seats, 49 headquarters, 27 airfields, 3 ports and 14 depots. In eastern Nam Bộ, the main blow toward Bình Long: the 9th Division and the 1st Regiment of the 1st Division, the Liberation Army command''s reserve, attack the American 11th Armored Cavalry''s base on Route 13 west of Lộc Ninh.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 131–33.'
    tags: [polity:drv, province:binh-long, place:loc-ninh]
    time_range:
      - 1969-08-11T14:00Z
      - 1969-08-11T16:00Z
    time_band: night
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-08-12.china-leadership
    when: Aug. 12
    date: '1969-08-12'
    thread: china-leadership
    also: [defense, china]
    c: 'Zhou Enlai presides over the 20th meeting of the Central Special Committee. Learning from the Second Ministry that Lin Biao on July 2 at the conference of the "three norths" (Northeast, North, Northwest) ordered the atomic energy plants in Gansu and Inner Mongolia moved wholly to the Third Front in 1970, he instructs, to avoid a break in nuclear fuel production: the first-line plants are not to move, but to go on, speed up, produce more and store more, while for war preparation the Third Front plants are rushed up.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 12, 1969). Made public: 2020. Names: Zhou Enlai, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:lin-biao, vis:only:prc]
  - id: cal.1969-08-12.china-leadership-2
    when: Aug. 12
    date: '1969-08-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on a paper on street propaganda at Guiyang, notes: some loudspeakers disturbing the propaganda of the July 23 notice are to be stopped, and factional acts excluded when the Center''s notice is propagated.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 12, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-12.vietnam-hanoi
    when: Aug. 12
    date: '1969-08-12'
    place: an-loc
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Route 13, Bình Long. At night Liberation forces ambush the Saigon 15th Armored Cavalry Regiment, many vehicles destroyed, six prisoners, by the history's count; the same day they destroy an American motorized group at Tân Khai and fight several ambushes west of Hớn Quản, three mechanized companies badly hurt.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 131. See [[cal.1969-08-11.vietnam-hanoi]]. The words: "đêm 12-8-1969" (the night of Aug. 12, 1969).'
    tags: [polity:drv, polity:us]
    time_range:
      - 1969-08-12T14:00Z
      - 1969-08-12T16:00Z
    time_band: night
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-08-12.vietnam-hanoi-2
    when: Aug. 12–16
    date: '1969-08-12'
    place: ben-tre
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Bến Tre. The people and forces of Giồng Trôm, Mỏ Cày and Châu Thành combine attack and uprising, destroy pacification support forces and break some strategic hamlets. In the delta the artillery raids Mỹ Tho, Cai Lậy, Cái Bè, An Hữu and the Bình Đức base, and the Mỹ Tho commandos hit the Saigon 6th Armored Regiment's base. The history judges the phase's early stage weak.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 133. See [[cal.1969-08-11.vietnam-hanoi]]. Check: the days of the Mỹ Tho actions; the history gives the phase only.'
    tags: [polity:drv]
  - id: cal.1969-08-12.intelligence
    when: Aug. 12
    date: '1969-08-12'
    thread: intelligence
    also: [soviet-union, china]
    c: 'A National Intelligence Estimate: the Soviet proposal for collective security in Asia "an effort to capitalize on an anticipated reduction in Western presence" and to forestall Chinese gains.'
    n: '[[w.khoo-collateral-damage]], 63. Made public: 2004 ([[w.council-tracking-the-dragon]], 543). To check: [[w.council-tracking-the-dragon]], 543 (cited by [[w.khoo-collateral-damage]], 63 n.147).'
    tags: [polity:us, vis:only:us]
  - id: cal.1969-08-13.china-leadership
    when: Aug. 13
    date: '1969-08-13'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the delegates to the national conference on building county farm-machinery repair and manufacturing stations and speaks: the time has come to grasp farm mechanization and it can be put off no more; machines are wanted from conventional to advanced for harvest, processing, transport, electric power, pest killing and plastic film. Every county is to have such a station, its tasks in time of peace and war both to repair and make, repair first, and later to join repair and making; they are to create every type of farm machine for the soils, transport and irrigation of China and for cotton and other crops as well as grain.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 13, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-13.china
    when: Aug. 13
    date: '1969-08-13'
    thread: china
    also: [soviet-union]
    c: 'Foreign Ministry note to the Soviet embassy: strong protest at the new bloody incident in which Soviet servicemen, with helicopters, tanks, armored cars and several hundred armed men, entered the Tielekti area of Yumin county, Xinjiang, and without cause fired on the Chinese border guards on routine patrol, killing and wounding several on the spot.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 219–220 (Aug. 13, 1969); [[w.macfarquhar-maos-last-revolution]], 313 (a very serious border clash in Xinjiang). To check: [[w.kuisong-mao-zedong-yu-mosikede]], 496–498 (cited by [[w.macfarquhar-maos-last-revolution]], 313 n.24).'
    src:
      c: a0ed2043
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 219–220: all'
        - 'w.macfarquhar-maos-last-revolution 313: A'
    tags: [polity:prc, polity:ussr]
  - id: cal.1969-08-13.china-2
    when: Aug. 13
    date: '1969-08-13'
    place: yumin
    thread: china
    also: [soviet-union]
    c: The Tielekti 鐵列克提 area of Yumin county 裕民縣, Xinjiang 新疆, on the western stretch of the Sino-Soviet border, in dispute. Soviet helicopters, tanks and armored cars fall on a Chinese border patrol of 38, carrying light arms; all are killed.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 736 n.60; [[w.khoo-collateral-damage]], 57 (the most serious clash, at Lake Zhalanashkol on the border with Kazakhstan, Aug. 13); [[w.jian-zhou-enlai]], 596 ("in August," Soviet troops eliminate a squadron of Chinese soldiers at a border garrison in Xinjiang); [[w.jian-zhou-enlai]], 620 ("In late summer," Soviet troops slaughter a Chinese border squadron of thirty soldiers in Xinjiang); [[w.dikotter-cultural-revolution]], 208 n.6 (in the middle of August more than 300 Soviet soldiers with two helicopters and dozens of armoured vehicles strike deep and wipe out a Chinese frontier squadron). Check: the count; the Foreign Ministry''s note of the day speaks of several killed and wounded on the spot (see [[cal.1969-08-13.china]]). To check: [[w.gobarev-soviet-policy-toward-china]], 46 (cited by [[w.khoo-collateral-damage]], 57 nn.90, 91a); [[w.xie-yixian-zhongguo-dangdai-waijiaoshi]], 246–247 (cited by [[w.khoo-collateral-damage]], 57 n.91b); [[w.xu-yan-chinese-soviet-border-clash-of-1969]], 10 (cited by [[w.jian-zhou-enlai]], 620 n.20); [[w.jianguo-yilai-mao-zedong-junshi-wengao]], III, 357 (cited by [[w.jian-zhou-enlai]], 620 n.21); Christian F. Ostermann, "East German Documents on the Border Conflict, 1969," *Cold War International History Project Bulletin*, nos. 6–7 (Winter 1995), 187 (cited by [[w.dikotter-cultural-revolution]], 208 n.6a); Harvey W. Nelsen, *Power and Insecurity: Beijing, Moscow and Washington, 1949–1988* (1989), 72–73 (cited by [[w.dikotter-cultural-revolution]], 208 n.6b).'
    src:
      c: a0d768be
      rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 736 n.60: all'
        - 'w.khoo-collateral-damage 57: ?'
