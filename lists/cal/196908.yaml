  - id: cal.1969-08-02.vietnam-hanoi
    when: Aug. 2
    date: '1969-08-02'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the tenth congress of the Romanian Communist Party: greetings on Romania''s industry and agriculture; thanks for its support.'
    n: '*Thư của Ban chấp hành Trung ương Đảng Lao động Việt Nam, ngày 2 tháng 8 năm 1969, gửi Đại hội lần thứ X Đảng Cộng sản Rumani* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, polity:romania, vis:only:drv+romania]
  - id: cal.1969-08-02.china
    when: Aug. 2
    date: '1969-08-02'
    thread: china
    c: Nixon, on his world tour, asks Romania's Ceaușescu to convey the same belief to the Chinese leaders.
    n: '[FRUS 1969–76, XVII, doc. 20](https://history.state.gov/historicaldocuments/frus1969-76v17/d20) (the editorial note, the volume''s p. 52, the book''s n.44: on Aug. 2 Nixon tells Ceausescu that "we would welcome your playing a mediating role between us and China," citing the memorandum of conversation of Aug. 2–3; not the book''s words); [[w.jian-zhou-enlai]], 625 ("During his world tour in summer 1969"). Made public: Check (FRUS XVII''s editorial note, the earliest printing named; its year not on the card). To check: Memorandum of conversation, Nixon and Ceausescu, Aug. 2–3, 1969, Nixon Presidential Materials, NSC Files, Box 1023 (cited by [FRUS 1969–76, XVII, doc. 20](https://history.state.gov/historicaldocuments/frus1969-76v17/d20)). See [[cal.1969-08.china]]. Names: Nixon, Ceaușescu.'
    src:
      c: 4a77af80
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1969-76v17/d20: ?'
        - 'w.jian-zhou-enlai 625: all'
    tags: [polity:us, polity:romania, name:nixon-richard-m, name:ceausescu-nicolae, vis:only:us+romania, ok:fields-place]
  - id: cal.1969-08-03.china-leadership
    when: Aug. 3, 6
    date: '1969-08-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives reporters of Xinhua and its Guizhou branch: besides hearing both sides'' views they are to hear third parties, report the situation truly to the Center and let it judge, and check the facts; "we trust you so much, you must tell us the facts."'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 3, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-08-05.china-leadership
    when: Aug. 5
    date: '1969-08-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on learning that a rebel group in Guizhou means to attack the political-legal building at Guiyang, instructs Wu Faxian to telephone Li Zaihan: the military region must send troops into the building to protect the files, none to be lost.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 307 (Aug. 5, 1969). Made public: 2020. Names: Zhou Enlai, Wu Faxian.'
    tags: [polity:prc, name:zhou-enlai, name:wu-faxian, vis:only:prc]
