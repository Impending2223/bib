    c: '*Renmin ribao* 人民日报, *Hongqi* 红旗 and *Jiefangjun bao* 解放军报 print the joint editorial "The people''s army is invincible: for the forty-second anniversary of the birth of the Chinese People''s Liberation Army" (Renmin jundui suoxiang wudi 人民军队所向无敌), its title as Mao 毛泽东 shortened it.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 457 n.1 (Aug. 1, 1969). To check: *Renmin ribao*, Aug. 1, 1969, the joint editorial (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 457 n.1b). See [[cal.1969-07.china-leadership-3]]. Names: Mao Zedong.'
