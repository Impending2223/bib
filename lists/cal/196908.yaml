entries:
  - id: cal.1969-08-02.soviet-union-leadership
    when: Aug. 2
    date: '1969-08-02'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Crimea. On leave at Yalta, Brezhnev meets in the afternoon Svoboda, President of Czechoslovakia, and Husák, First Secretary of its party, on their arrival.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 354 (Aug. 2). Names: Brezhnev, Svoboda, Husák.'
    tags: [name:brezhnev-leonid, name:svoboda-ludvik, name:husak-gustav, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-08-21.china-leadership
    when: Aug. 21 or 22
    date: '1969-08-21'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads the Military Commission Office Group''s draft instruction of Aug. 16 on strengthening discipline in the army, against anarchism, bourgeois factionalism, and the doctrine of many centers; discipline training; punish the incorrigible. Mao: approved.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 21 or 22, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-08-22.china-leadership
    when: Aug. 22–28
    date: '1969-08-22'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves the Center''s order of nine points (dated Aug. 28, the "Aug. 28" order) on stabilizing the border regions, sent by Zhou Enlai, Chen Boda and Kang Sheng after the July 23 Notice: watch the enemy and be ready to destroy invaders; against splitting and factionalism; border troops to hold their posts; groups organized by trade and system.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, late Aug. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, vis:only:prc]
  - id: cal.1969-08-27.china-leadership
    when: Aug. 27
    date: '1969-08-27'
    thread: china-leadership
    also: [soviet-union]
    c: The Center and the Military Commission forward the Office Group's report on strengthening civil air defense, setting up a national leading group and provincial ones.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 27, 1969. Made public: 2013.'
    tags: [polity:prc, vis:only:prc]
  - id: cal.1969-08-31.china-leadership
    when: Aug. 31
    date: '1969-08-31'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Jiang Qing''s letter of Aug. 28 asks to rename the model opera *Taking Tiger Mountain by Strategy* (*Zhiqu Weihushan*) *Zhiqu Feigushan* and its hero Yang Zirong Liang Zhitong, as the author wrote of himself, true persons and facts. Mao: too much trouble; at least for now do not change the opera''s name or leading characters or place names; criticism of the novel''s author put off. Also approves 10,000 delegates for the twentieth National Day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 31, 1969. Made public: 2013. Names: Mao Zedong, Jiang Qing.'
    tags: [polity:prc, name:mao-zedong, name:jiang-qing, vis:only:prc]
