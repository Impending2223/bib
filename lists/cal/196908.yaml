  - id: cal.1969-08-28.china-leadership-4
    when: Aug. 28
    date: '1969-08-28'
    thread: china-leadership
    also: [soviet-union]
    c: 'The Center 中共中央 issues its order (the "Aug. 28" order, Ba''erba mingling 八二八命令) to the revolutionary committees of the border provinces, cities and regions, their peoples and the troops on the border: be ready to destroy invaders and to smash armed provocations by the American imperialists and the Soviet revisionists; unity of army and people; border troops to hold their posts; cross-trade mass organizations dissolved; the July 23 notice carried out, armed fighting stopped; no attacks on the army; communications protected; those away from work to return; counterrevolutionaries suppressed.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 461–463 n.1 (Aug. 28, 1969); [[w.macfarquhar-maos-last-revolution]], 317 (Zhongfa [1969] 55, after the Xinjiang clash of Aug. 13: rival factions and leftist guerrilla bands to stop fighting at once); [[w.mao-zedong-zhuan]], VI, ch. 78 (late in August Mao approves the Center''s order of Aug. 28, ''Ba''erba'' 《“八·二八”命令》, which requires the army and people of the frontier regions ''to be ready at any moment to smash armed provocations of American imperialism and Soviet revisionism and to prevent their surprise attack''; the book gives no other points of the order). [[w.khoo-collateral-damage]], 57 (the "Order for General Mobilization in Border Provinces and Regions," nine articles, the "August 28 Order"); [[w.jian-zhou-enlai]], 596 (on Aug. 28 Peking orders a general mobilization of the provinces and regions bordering the Soviet Union and Outer Mongolia; the note prints "August 28, 1968"); [[w.jian-zhou-enlai]], 621 ("Five days later" the Center orders all provinces and regions bordering the Soviet Union and Outer Mongolia into a state of war alertness); [[w.dikotter-cultural-revolution]], 209 n.8 (the Central Committee orders a military mobilization in the provinces and regions on the Soviet and Mongolian borders: the country on red alert against a large-scale Soviet invasion). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 78); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, order of Aug. 28, 1969 on further stabilizing the border regions (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 461 n.1b); [[w.kuisong-mao-zedong-yu-mosikede]], 504 (cited by [[w.macfarquhar-maos-last-revolution]], 317 n.39); [[w.lewis-imagined-enemies]], 56 (cited by [[w.khoo-collateral-damage]], 57 nn.96–97); CCP Central Committee''s order for general mobilization in the border provinces and regions, Aug. 28, 1969 (cited by [[w.jian-zhou-enlai]], 596 n.13); CCP Central Committee''s order for general mobilization in the border provinces and regions, Aug. 28, 1969 (cited by [[w.jian-zhou-enlai]], 621 n.23); "The CCP Central Committee''s Order for General Mobilization in Border Provinces and Regions," Aug. 28, 1969, *Cold War International History Project Bulletin*, no. 11 (Winter 1998), 168–169 (cited by [[w.dikotter-cultural-revolution]], 209 n.8). See [[cal.1969-08-22.china-leadership]]. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
