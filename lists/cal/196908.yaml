  - id: cal.1969-08-14.vietnam-hanoi
    when: Aug. 14
    date: '1969-08-14'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 240-TT/TW on the 24th anniversary of the August Revolution and National Day (Sept. 2): to hold to Hồ Chí Minh''s appeal to fight on until every American soldier is driven out and the puppet army and regime fall; to review the North''s gains and faults; the autumn crop, the winter-spring crop and the 1969 plan. Rallies in Hanoi, Haiphong and the Quảng Ninh mines, at wartime hours and in wartime numbers; meetings at the bases elsewhere; an emulation drive.'
    n: '*Thông tri của Ban Bí thư số 240-TT/TW, ngày 14-8-1969, Về việc kỷ niệm lần thứ 24 Cách mạng Tháng Tám và Quốc khánh 2-9*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 225–27. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, polity:us, name:ho-chi-minh, vis:only:drv]
  - id: cal.1969-08-15.china-leadership
    when: Aug. 15
    date: '1969-08-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the members of the leading group of the national health work conference and some delegates: health work is first for the countryside, second for factories and mines, third for cities, first of all for workers, peasants and soldiers; it must treat the commonest diseases of the broadest working people, train doctors for the villages, spread Chinese herbs and fit rural medical equipment; Western and Chinese medicine alike are to be accepted critically, theory joined to practice and Western medicine to traditional Chinese, with the ambition to create a new China''s medicine. On policy he repeats that, but for present counterrevolutionaries, anyone whose historical problems are explained clearly and who has a skill, in Chinese or Western medicine, can be placed and used.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 308 (Aug. 15, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
