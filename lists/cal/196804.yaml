  - id: cal.1968-04-02.vietnam
    when: Apr. 2
    date: '1968-04-02'
    thread: vietnam
    also: [congress]
    c: 'Fulbright in the Senate: the limitation "not a significant change at all"; Mansfield on the President''s "inexact language." Johnson with Clifford, Katzenbach, Helms, Wheeler and Rostow: Congress to be briefed, the line the 20th parallel; "We stopped hitting 90% of the population and we have nothing in return." Fulbright: if the restriction is limited, "it is a great tragedy." Morse: one of Johnson''s great speeches.'
    n: 'FRUS 1964–68, VI, docs. [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v06/d173). [*New York Times*, Apr. 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/03/issue.html). [[w.mann-grand-delusion]], 602, 604; [[w.clifford-counsel-to-the-president-2]], 529 (the meeting of Apr. 2; the bombing to be held to the 19th parallel). [[w.mcpherson-political-education]], 439 (Fulbright''s attack). See [[cal.1968-04-01.vietnam]]. Names: Fulbright, Mansfield, Johnson, Clifford, Katzenbach, Helms, Wheeler, Rostow, Morse. Check: Mann, 602, has Morse call it one of Johnson''s "great speeches" (114 Cong. Rec. 8575, Apr. 2).'
    src:
      c: df355925
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d172: A-D'
