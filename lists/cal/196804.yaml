    thread: robert-kennedy-campaign
    also: [elections-1968]
    c: 'Robert Kennedy and Sorensen with Johnson at the White House, at Kennedy''s asking. Would Johnson oppose his candidacy, or mobilize forces against him? Johnson: but for a few fund-raising dinners he plans to keep out of campaign politics; he "does not wish to forego his options."'
    n: 'FRUS 1964–68, VI, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v06/d176). [[w.schlesinger-robert-kennedy-and-his]], 868–69 (the meeting; Kennedy''s question; Johnson to stay out; not D); [[w.dallek-flawed-giant]], 531; [[w.shesol-mutual-contempt]], 441–43 (from Rostow''s memorandum of the meeting, 10 a.m.). [[w.longley-lbjs-1968]], 138–40 (the meeting, by Murphy''s notes; Johnson to stay out but for fund-raising dinners); [[w.palermo-in-his-own-right]], 156–58 (the meeting, Rostow and Murphy with Johnson; Kennedy''s question, "Are you opposed to my effort and will you marshal forces against me?"; Johnson to "stay out of pre-convention politics"). To check: Murphy''s notes of the meeting, Apr. 3, 1968, Diary Backup, LBJ Library; the Daily Diary, Apr. 3, 1968, LBJ Library (not among the Catalog''s scanned days) (cited by [[w.dallek-flawed-giant]], 531). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Sorensen, Johnson.'
    src:
      c: a767dc47
      rows:
