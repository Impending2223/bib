  - id: cal.1968-04-01.vietnam
    when: Apr. 1
    date: '1968-04-01'
    time: 1968-04-01T21:03Z
    thread: vietnam
    also: [congress, vietnam-congress]
    c: 'A strike near Thanh Hóa, 205 nautical miles north of the zone by Wheeler''s count, Apr. 2. Fulbright, Lee Williams urging him, to Johnson by telephone: "a very great and unselfish act of statesmanship"; he offers to help start the peace talks, and Johnson accepts. Johnson: Dobrynin told, Mar. 31, of the limitation.'
    n: 'FRUS 1964–68, VI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v06/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172) (Apr. 2). [Johnson and Fulbright, 4:03 p.m., Apr. 1](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-april-1-1968), Conversation WH6804-01-12901 (Miller Center). [[w.clifford-counsel-to-the-president-2]], 528 (Thanh Hóa, 205 miles north of the DMZ; Fulbright, told the day before of the 20th parallel); [[w.woods-j-william-fulbright-vietnam]], 173–74 (Fulbright''s call, Lee Williams urging; the offer); [[w.cosmas-joint-chiefs-of-staff]], 175 (the UPI story of Apr. 1 on the strike at Thanh Hóa, more than two hundred miles from the DMZ, below the 20th parallel); [[w.rusk-as-i-saw-it-1990]], 483 (American planes strike just south of the twentieth parallel, Apr. 1, "prompting charges that we had misled the public"; not Thanh Hóa, the distance or Fulbright). To check: Memo for the Files, Apr. 1, 1968, Williams Papers (cited by [[w.woods-j-william-fulbright-vietnam]], 174 n.54). See [[cal.1968-03-31.elections-1968]]. Names: Wheeler, Fulbright, Johnson, Dobrynin.'
