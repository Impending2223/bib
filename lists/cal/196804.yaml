    c: 'Hanoi''s statement, broadcast: the limitation "a defeat and at the same time a shrewd trick," but the government of North Vietnam "declares its readiness to appoint its representatives to contact the United States representative with a view to determining with the American side the unconditional cessation of the United States bombing raids and all other acts of war against the Democratic Republic of Vietnam so that talks may start." Johnson: "we will establish contact with the representatives of North Vietnam." The American note, through Vientiane: Geneva.'
    n: 'Statement by the President Following Hanoi''s Declaration of Readiness To Begin Discussions, [1968–69 Pub. Papers 492](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=570) (Apr. 3, 1968). FRUS 1964–68, VI, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v06/d175), [178](https://history.state.gov/historicaldocuments/frus1964-68v06/d178). [[w.cosmas-joint-chiefs-of-staff]], 176, 178; [[w.drea-mcnamara-clifford-and-the-2011]], 225 (Hanoi''s announcement of Apr. 3); [[w.nguyen-hanois-war]], 117 (Hanoi''s announcement). [[w.clifford-counsel-to-the-president-2]], 529–30 (Hanoi''s statement; Johnson: "It''s easier to satisfy Ho Chi Minh than Bill Fulbright"; the statement drafted by Katzenbach and Clifford, read in the West Lobby after 5 p.m.). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-vietnams-american-war]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
