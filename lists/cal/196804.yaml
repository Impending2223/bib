  - id: cal.1968-04-03.vietnam
    when: Apr. 3
    date: '1968-04-03'
    thread: vietnam-paris
    c: 'Hanoi''s statement, broadcast: the limitation "a defeat and at the same time a shrewd trick," but the government of North Vietnam "declares its readiness to appoint its representatives to contact the United States representative with a view to determining with the American side the unconditional cessation of the United States bombing raids and all other acts of war against the Democratic Republic of Vietnam so that talks may start." Johnson: "we will establish contact with the representatives of North Vietnam." The American note, through Vientiane: Geneva.'
    n: 'Statement by the President Following Hanoi''s Declaration of Readiness To Begin Discussions, [1968–69 Pub. Papers 492](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=570) (Apr. 3, 1968). FRUS 1964–68, VI, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v06/d175), [178](https://history.state.gov/historicaldocuments/frus1964-68v06/d178). [[w.cosmas-joint-chiefs-of-staff]], 176, 178; [[w.drea-mcnamara-clifford-and-the-2011]], 225 (Hanoi''s announcement of Apr. 3); [[w.nguyen-hanois-war]], 117 (Hanoi''s announcement); [[w.califano-triumph-and-tragedy-of]], 271 (Hanoi''s readiness to talk, taken up at once); [[w.branch-at-canaans-edge]], 749–50 ("This is a defeat"). [[w.clifford-counsel-to-the-president-2]], 529–30 (Hanoi''s statement; Johnson: "It''s easier to satisfy Ho Chi Minh than Bill Fulbright"; the statement drafted by Katzenbach and Clifford, read in the West Lobby after 5 p.m.). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-vietnams-american-war]]; [[w.abramson-spanning-the-century]]; "Stocks Spurred to Sales Record," NYT, April 4, 1968, pal: "This is a defeat": FRUS, Vol. 6, pp. 510–11 (cited by [[w.branch-at-canaans-edge]], 749); New York Times, April 4, 1968, p. 16 (cited by [[w.branch-at-canaans-edge]], 749). See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
