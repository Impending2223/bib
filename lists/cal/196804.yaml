# Cal. CII April 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CII
entries:
  - id: cal.1968-04-01.vietnam
    when: Apr. 1
    date: '1968-04-01'
    thread: vietnam
    also: [congress]
    c: 'A strike near Thanh Hóa, 205 nautical miles north of the zone by Wheeler''s count, Apr. 2. Fulbright to Johnson by telephone: "a very great and unselfish act of statesmanship." Johnson: Dobrynin told, Mar. 31, of the limitation.'
    n: 'FRUS 1964–68, VI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v06/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172) (Apr. 2). [Johnson and Fulbright, 4:03 p.m., Apr. 1](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-april-1-1968), Conversation WH6804-01-12901 (Miller Center). See [[cal.1968-03-31.elections-1968]]. Names: Wheeler, Fulbright, Johnson, Dobrynin.'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b, name:dobrynin-anatoly, place:thanh-hoa, name:wheeler-earle]
  - id: cal.1968-04-01.court
    when: Apr. 1
    date: '1968-04-01'
    thread: court
    also: [states-and-cities, legislatures]
    c: '*Avery v. Midland County*, [390 U.S. 474](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390474/usrep390474.pdf): one person, one vote holds for a local government of general powers. The commissioners court of Midland County, Tex., elected from four districts, one of them, the city of Midland, with some 95 percent of the county''s people (Check the share).'
    n: Opinion. [[w.powe-warren-court-and-american]]; [[w.baker-reapportionment-revolution]]. See [[cal.1964-06-15.court]].
    tags: [state:tx]
  - id: cal.1968-04-01.vietnam-2
    when: Apr. 1
    date: '1968-04-01'
    thread: vietnam-khe-sanh
    c: 'Operation Pegasus: the 1st Cavalry Division and Marines west along Route 9 toward Khe Sanh.'
    n: 'See [[cal.1968-01-21.vietnam]]. Check: *Victory in Vietnam*: 17 American and South Vietnamese battalions; the relief force withdrawn Apr. 16, the siege kept (222–23, 467 n.21).'
    tags: [place:khe-sanh]
  - id: cal.1968-04-02.vietnam
    when: Apr. 2
    date: '1968-04-02'
    thread: vietnam
    also: [congress]
    c: 'Fulbright in the Senate: the limitation "not a significant change at all"; Mansfield on the President''s "inexact language." Johnson with Clifford, Katzenbach, Helms, Wheeler and Rostow: Congress to be briefed, the line the 20th parallel; "We stopped hitting 90% of the population and we have nothing in return."'
    n: 'FRUS 1964–68, VI, docs. [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v06/d173). [*New York Times*, Apr. 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/03/issue.html). See [[cal.1968-04-01.vietnam]]. Names: Fulbright, Mansfield, Johnson, Clifford, Katzenbach, Helms, Wheeler, Rostow.'
    tags: [name:fulbright-j-william, name:mansfield-mike, name:johnson-lyndon-b, name:clifford-clark, name:katzenbach-nicholas, name:helms-richard, name:wheeler-earle, name:rostow-walt-w]
  - id: cal.1968-04-02.elections-1968
    when: Apr. 2
    date: '1968-04-02'
    thread: elections-1968
    c: 'Wisconsin primary. Republican: Nixon 79.7 percent, Reagan 10.4. Democratic: McCarthy 56.2 percent, Johnson 34.6.'
    n: '[*1969 Wisconsin Book*, 234–243](https://asset.library.wisc.edu/1711.dl/GMDNMSNXDGTAN8A/E/file-73e4e.pdf#page=242). CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Johnson, Nixon, Reagan.'
    tags: [primary:1968-04-02, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:nixon-richard-m, name:reagan-ronald]
  - id: cal.1968-04-02.economy
    when: Apr. 2
    date: '1968-04-02'
    thread: economy-surcharge
    also: [congress]
    c: The Senate adopts the Smathers–Williams amendment to H.R. 15414, the surcharge and the cuts in spending, [54–35](https://voteview.com/rollcall/RS0900385), and passes the bill, [57–31](https://voteview.com/rollcall/RS0900386). Ways and Means, Mills its chairman, to decide whether to go to conference (Check).
    n: '[[w.zelizer-taxing-america]]. See [[cal.1968-03-26.economy]]. Names: Smathers, Williams, Mills.'
    tags: [name:smathers-george-a, name:williams-john-j, name:mills-wilbur-d]
  - id: cal.1968-04-02.crime-and-hijacking
    when: Apr. 2
    date: '1968-04-02'
    thread: crime-and-hijacking
    c: 'The House refuses to disapprove Reorganization Plan No. 1 of 1968, [190–200](https://voteview.com/rollcall/RH0900287): Treasury''s Bureau of Narcotics and HEW''s Bureau of Drug Abuse Control merged into a Bureau of Narcotics and Dangerous Drugs in the Department of Justice. In effect Apr. 8.'
    n: '[[w.epstein-agency-of-fear]]. See [[cal.1968-02-07.crime-and-hijacking]].'
  - id: cal.1968-04-02.mayors-milwaukee
    when: Apr. 2
    date: '1968-04-02'
    thread: mayors
    also: [elections-1968]
    c: Milwaukee. Maier re-elected mayor for a third term, 86 percent, carrying every ward.
    n: '[Wikipedia, "Henry Maier"](https://en.wikipedia.org/wiki/Henry_Maier); [Encyclopedia of Milwaukee, "Henry W. Maier"](https://emke.uwm.edu/entry/henry-w-maier/). Check: the day, and the Board of Election Commissioners'' canvass. [[w.jones-selma-of-the-north]]; [[w.maier-challenge-to-the-cities]]. See [[cal.1967-12-12.open-housing-milwaukee]]. Names: Maier.'
    tags: [state:wi, city:milwaukee, name:maier-henry-w]
  - id: cal.1968-04-03.vietnam
    when: Apr. 3
    date: '1968-04-03'
    thread: vietnam-paris
    c: 'Hanoi''s statement, broadcast: the limitation "a defeat and at the same time a shrewd trick," but the government of North Vietnam "declares its readiness to appoint its representatives to contact the United States representative with a view to determining with the American side the unconditional cessation of the United States bombing raids and all other acts of war against the Democratic Republic of Vietnam so that talks may start." Johnson: "we will establish contact with the representatives of North Vietnam." The American note, through Vientiane: Geneva.'
    n: 'Statement by the President Following Hanoi''s Declaration of Readiness To Begin Discussions, [1968–69 Pub. Papers 492](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=570) (Apr. 3, 1968). FRUS 1964–68, VI, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v06/d175), [178](https://history.state.gov/historicaldocuments/frus1964-68v06/d178). [[w.herring-secret-diplomacy-of-the]]; [[w.nguyen-hanois-war]]; [[w.asselin-vietnams-american-war]]; [[w.abramson-spanning-the-century]]; [[w.cosmas-joint-chiefs-of-staff]], 176, 178; [[w.drea-mcnamara-clifford-and-the-2011]], 225. See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-03.congress
    when: Apr. 3
    date: '1968-04-03'
    thread: congress
    c: 'The House makes the Committee on Standards of Official Conduct a standing committee, [406–1](https://voteview.com/rollcall/RH0900288) (Check: the House''s code adopted the same day).'
    n: See [[cal.1968-03-20.congress]].
  - id: cal.1968-04-03.robert-kennedy
    when: Apr. 3
    date: '1968-04-03'
    thread: robert-kennedy
    also: [elections-1968]
    c: 'Robert Kennedy and Sorensen with Johnson at the White House, at Kennedy''s asking. Would Johnson oppose his candidacy, or mobilize forces against him? Johnson: but for a few fund-raising dinners he plans to keep out of campaign politics; he "does not wish to forego his options."'
    n: 'FRUS 1964–68, VI, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v06/d176). [[w.schlesinger-robert-kennedy-and-his]], 868–69. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Sorensen, Johnson.'
    tags: [name:kennedy-robert-f, name:sorensen-theodore-c, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1968-04-03.king
    when: Apr. 3
    date: '1968-04-03'
    thread: king-memphis
    c: 'Memphis. The federal district court bars a second march, on the city''s petition (Check). King at Mason Temple, at night: "I may not get there with you. But I want you to know tonight, that we, as a people, will get to the promised land."'
    n: '[*New York Times*, Apr. 4, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/04/issue.html). See [[cal.1968-03-18.king]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:tn, city:memphis]
  - id: cal.1968-04-03.opinion
    when: Apr. 3
    date: '1968-04-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 15–20: Hanoi has said it will agree to peace negotiations if the bombing stops: should not stop 51 percent, should stop 40. Men 58 and 35; women 44 and 45; East 43 and 48. The Government to decide that the best thing is to stop the bombing and the fighting and gradually withdraw: approve 56, disapprove 34.'
    n: '[[w.gallup-poll]], III, 2115–16.'
  - id: cal.1968-04-03.vietnam-2
    when: Apr. 3
    date: '1968-04-03'
    thread: vietnam
    c: 'The bombing of the North held south of the 19th parallel, short of the 20th of Clifford''s order of Mar. 31 (Check the day). Clifford, Apr. 9: "We feel comfortable with the 19th to avoid mistakes."'
    n: 'FRUS 1964–68, VI, docs. [172](https://history.state.gov/historicaldocuments/frus1964-68v06/d172) (Apr. 2), [189](https://history.state.gov/historicaldocuments/frus1964-68v06/d189) (Apr. 9). [[w.frankum-like-rolling-thunder]], 61: Apr. 3; [[w.cosmas-joint-chiefs-of-staff]], 176–177. See [[cal.1968-03-31.elections-1968]]. Names: Clifford.'
    tags: [name:clifford-clark]
  - id: cal.1968-04-04.vietnam-paris
    when: Apr. 4
    date: '1968-04-04'
    thread: vietnam-paris
    c: New York. Johnson with U Thant at the United Nations.
    n: 'FRUS 1964–68, VI, doc. [181](https://history.state.gov/historicaldocuments/frus1964-68v06/d181). [President''s Daily Diary, Apr. 4, 1968](https://catalog.archives.gov/id/192476), image 8 (LBJ Library; National Archives Catalog). See [[cal.1968-04-03.vietnam]]. Names: Johnson, U Thant.'
    tags: [name:johnson-lyndon-b, name:u-thant]
  - id: cal.1968-04-04.king
    when: Apr. 4
    date: '1968-04-04'
    thread: king
    c: 'Memphis. King, on the balcony of the Lorraine Motel, shot at 6:01 p.m. by a rifleman from a rooming house on South Main Street; dead at St. Joseph''s Hospital, 7:05 p.m. Johnson, 9:07 p.m.: "I ask every citizen to reject the blind violence that has struck Dr. King, who lived by nonviolence"; his trip to Hawaii put off. Apr. 19, the FBI: the man sought, "Eric Starvo Galt," is James Earl Ray, escaped from the Missouri State Penitentiary in 1967 (Check).'
    n: 'Statement by the President on the Assassination of Dr. Martin Luther King, Jr., [1968–69 Pub. Papers 493](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=571) (Apr. 4, 1968). [Johnson, Ivan Allen and Lady Bird Johnson, 11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ivan-allen-and-lady-bird-johnson-april-5-1968), Conversation WH6804-01-12908 (Miller Center). [*New York Times*, Apr. 5, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/05/issue.html); [Apr. 20, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/20/issue.html). [President''s Daily Diary, Apr. 4, 1968](https://catalog.archives.gov/id/192476), images 11, 12, 13, 15 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]; [[w.honey-going-down-jericho-road]]; [[w.beifuss-at-the-river-i]]; [[w.posner-killing-the-dream]]; [[w.sides-hellhound-on-his-trail]]; [[w.garrow-fbi-and-martin-luther]]; [[w.kotz-judgment-days]]. See [[cal.1967-12-04.king]]. Names: King, Johnson, Ray.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, name:ray-james-earl, name:allen-ivan-jr, state:tn, city:memphis]
  - id: cal.1968-04-04.robert-kennedy
    when: Apr. 4
    date: '1968-04-04'
    thread: robert-kennedy
    also: [king]
    c: 'Indianapolis. Robert Kennedy, from a flatbed truck at a rally in a Negro neighborhood, tells the crowd that King has been killed: "For those of you who are black and are tempted to be filled with hatred and distrust at the injustice of such an act, against all white people, I can only say that I feel in my own heart the same kind of feeling. I had a member of my family killed, but he was killed by a white man."'
    n: '[*New York Times*, Apr. 5, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/05/issue.html). [[w.clarke-last-campaign]]; [[w.thomas-robert-kennedy]]; [[w.schlesinger-robert-kennedy-and-his]], 873–75. See [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, King.'
    tags: [name:kennedy-robert-f, name:king-martin-luther-jr, state:in, city:indianapolis]
  - id: cal.1968-04-04.civil-disorders
    when: Apr. 4
    date: '1968-04-04'
    thread: civil-disorders-king
    also: [king]
    c: 'Washington, from 14th and U Streets, at night: the riots after King''s death begin; more than a hundred cities in the week after (Check).'
    n: '[[w.risen-nation-on-fire]]; [[w.gilbert-ten-blocks-from-the]]; [[w.baltimore-68]]; [[w.cohen-american-pharaoh]]; [[w.witcover-white-knight]]. See [[cal.1967-07-27.civil-disorders]]. Names: King.'
    tags: [state:dc, city:washington, name:king-martin-luther-jr]
  - id: cal.1968-04-05.civil-disorders
    when: Apr. 5
    date: '1968-04-05'
    thread: civil-disorders-king
    c: 'Washington. Proclamation 3840 and Executive Order 11403: federal troops and the District''s Guard, some 13,600 in all (Check), a curfew. The dead in Washington, 12 (Check the count).'
    n: '[Executive Order 11403](https://www.presidency.ucsb.edu/documents/executive-order-11403-providing-for-the-restoration-law-and-order-the-washington); [Proclamation 3840](https://www.presidency.ucsb.edu/documents/proclamation-3840-law-and-order-the-washington-metropolitan-area) (Apr. 5, 1968). See [[cal.1968-04-04.civil-disorders]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:washington-walter-e, state:dc, city:washington]
  - id: cal.1968-04-05.soviet-union-czechoslovakia
    when: Apr. 5
    date: '1968-04-05'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: Prague. The Central Committee under Dubček adopts the Action Program.
    n: 'See [[cal.1968-03-22.soviet-union]]. Names: Dubček.'
    tags: [name:dubcek-alexander]
  - id: cal.1968-04-05.king
    when: Apr. 5
    date: '1968-04-05'
    thread: king
    also: [open-housing]
    c: 'Johnson meets Negro leaders, members of Congress and others at the White House, then speaks to the nation: "America shall not be ruled by the bullet, but only by the ballot of free and of just men." Proclamation 3839: Apr. 7 a day of mourning, the flag at half-staff until the burial. To the Speaker: "We should pass the Fair Housing law when the Congress convenes next week." Reynolds, Under Secretary of Labor, sent to Memphis to settle the strike (Check the day).'
    n: 'Address to the Nation Upon Proclaiming a Day of Mourning Following the Death of Dr. King, [1968–69 Pub. Papers 493](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=571); [Proclamation 3839](https://www.presidency.ucsb.edu/documents/proclamation-3839-death-martin-luther-king-jr); Letter to the Speaker of the House Urging Enactment of the Fair Housing Bill, [1968–69 Pub. Papers 496](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=574) (Apr. 5, 1968). [President''s Daily Diary, Apr. 5, 1968](https://catalog.archives.gov/id/192477), images 3, 4, 5, 6 (LBJ Library; National Archives Catalog). See [[cal.1968-04-04.king]]. Names: Johnson, Reynolds.'
    tags: [name:johnson-lyndon-b, name:reynolds-james-j, name:mccormack-john-w]
  - id: cal.1968-04-06.vietnam
    when: Apr. 6–7
    date: '1968-04-06'
    thread: vietnam
    c: 'Westmoreland at the White House, the meeting at Honolulu put off: "Since Tet enemy has suffered colossal military defeat. He has lost 60,000 men and 18,000 weapons"; Harriman "will be negotiating from position of strength."'
    n: 'FRUS 1964–68, VI, docs. [185](https://history.state.gov/historicaldocuments/frus1964-68v06/d185), [186](https://history.state.gov/historicaldocuments/frus1964-68v06/d186). Remarks to the Press With General Westmoreland, [1968–69 Pub. Papers 498](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=576) (Apr. 7, 1968). [President''s Daily Diary, Apr. 6, 1968](https://catalog.archives.gov/id/192478), images 1, 3; [Apr. 7](https://catalog.archives.gov/id/192479), images 3, 4, 5 (LBJ Library; National Archives Catalog). See [[cal.1968-03-22.vietnam]]. Names: Westmoreland, Harriman, Johnson.'
    tags: [name:westmoreland-william, name:harriman-w-averell, name:johnson-lyndon-b]
  - id: cal.1968-04-06.civil-disorders-chicago
    when: Apr. 6–7
    date: '1968-04-06'
    thread: civil-disorders-king
    c: Chicago's West Side, rioting from Apr. 5. Acting Governor Shapiro asks for troops, Apr. 6; Executive Order 11404, Apr. 7. The dead in Chicago, 11 (Check the count).
    n: 'Telegram to the Acting Governor of Illinois, [1968–69 Pub. Papers 497](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=575) (Apr. 6, 1968); [Executive Order 11404](https://www.presidency.ucsb.edu/documents/executive-order-11404-providing-for-the-restoration-law-and-order-the-state-illinois) (Apr. 7, 1968). [Johnson and Daley, 5:19 p.m., Apr. 6](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-april-6-1968), Conversation WH6804-01-12910 (Miller Center). [President''s Daily Diary, Apr. 6, 1968](https://catalog.archives.gov/id/192478), images 4, 5 (LBJ Library; National Archives Catalog). See [[cal.1968-04-04.civil-disorders]]. Names: Shapiro, Daley, Johnson.'
    tags: [name:shapiro-samuel-h, name:daley-richard-j, name:johnson-lyndon-b, state:il, city:chicago]
  - id: cal.1968-04-06.civil-disorders-baltimore
    when: Apr. 6–7
    date: '1968-04-06'
    thread: civil-disorders-king
    c: Baltimore, rioting from Apr. 6. Agnew asks for troops; Executive Order 11405, Apr. 7. The dead in Baltimore, 6 (Check the count).
    n: 'Telegram to the Governor of Maryland, [1968–69 Pub. Papers 498](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=576); [Executive Order 11405](https://www.presidency.ucsb.edu/documents/executive-order-11405-providing-for-the-restoration-law-and-order-the-state-maryland) (Apr. 7, 1968). See [[cal.1968-04-04.civil-disorders]]. Names: Agnew, Johnson.'
    tags: [name:agnew-spiro-t, name:johnson-lyndon-b, state:md, city:baltimore]
  - id: cal.1968-04-07.opinion
    when: Apr. 7
    date: '1968-04-07'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 22–27, by age: a great deal of interest in politics, 18 percent in each group. Have done work for a party or candidate: 21 to 29, 17; 50 and over, 21. Willing to work as a volunteer for one''s party this campaign: 21 to 29, 41; 30 to 49, 38; 50 and over, 26. To give $5 to its campaign fund: 42, 49 and 39.'
    n: '[[w.gallup-poll]], III, 2116–17.'
  - id: cal.1968-04-08.vietnam
    when: Apr. 8
    date: '1968-04-08'
    thread: vietnam-paris
    c: 'The site. Hanoi''s answer, through Vientiane: Phnom Penh for the contacts. The United States: Geneva, or four Asian capitals, Vientiane, Rangoon, Djakarta and New Delhi.'
    n: 'Remarks to the Press Announcing Receipt of a Message From Hanoi, [1968–69 Pub. Papers 500](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=578) (Apr. 8, 1968). FRUS 1964–68, VI, doc. [187](https://history.state.gov/historicaldocuments/frus1964-68v06/d187). See [[cal.1968-04-03.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-08.vietnam-khe-sanh
    when: Apr. 8
    date: '1968-04-08'
    thread: vietnam-khe-sanh
    c: 'Khe Sanh relieved: Pegasus reaches the base (Check the day). Johnson to the forces in Southeast Asia: "Now the siege of Khe Sanh is lifted."'
    n: 'Message to U.S. Armed Forces in Southeast Asia on the Lifting of the Siege of Khe Sanh, [1968–69 Pub. Papers 499](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=577) (Apr. 8, 1968). See [[cal.1968-01-21.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, place:khe-sanh]
  - id: cal.1968-04-08.king
    when: Apr. 8
    date: '1968-04-08'
    thread: king-memphis
    c: 'Memphis: Coretta Scott King, Abernathy and the union''s leaders at the head of a silent march to City Hall, some 40,000 (Check).'
    n: '[*New York Times*, Apr. 9, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/09/issue.html). See [[cal.1968-03-18.king]]. Names: Coretta Scott King, Abernathy.'
    tags: [name:king-coretta-scott, name:abernathy-ralph-david, state:tn, city:memphis]
  - id: cal.1968-04-08.court
    when: Apr. 8
    date: '1968-04-08'
    thread: court
    also: [crime-and-hijacking]
    c: '*United States v. Jackson*, [390 U.S. 570](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390570/usrep390570.pdf): the Federal Kidnaping Act''s death penalty, open only on a jury''s recommendation, unconstitutional; it needlessly burdens the rights to plead not guilty and to a jury trial. The rest of the act stands.'
    n: Opinion. [[w.powe-warren-court-and-american]].
  - id: cal.1968-04-08.vietnam-operations
    when: Apr. 8
    date: '1968-04-08'
    thread: vietnam-operations
    c: 'Toàn Thắng follows Quyết Thắng, out from the districts around Saigon to most of III Corps: some seventy-nine allied maneuver battalions; the South Vietnamese 18th Division and the Australian task force in it.'
    n: '[[w.villard-united-states-army-in]], 464–466. See [[cal.1968-03-11.vietnam-operations]].'
    tags: [province:long-khanh, province:binh-tuy]
  - id: cal.1968-04-09.vietnam-paris
    when: Apr. 9
    date: '1968-04-09'
    thread: vietnam-paris
    c: 'Camp David: Johnson with Bunker, Rusk, Wheeler and others, then Harriman and William Bundy.'
    n: 'FRUS 1964–68, VI, doc. [189](https://history.state.gov/historicaldocuments/frus1964-68v06/d189). Remarks to the Press at Camp David With Ambassador Bunker, [1968–69 Pub. Papers 501](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=579) (Apr. 9, 1968). See [[cal.1968-04-03.vietnam]]. Names: Johnson, Bunker, Rusk, Wheeler, Harriman, Bundy.'
    tags: [name:johnson-lyndon-b, name:bunker-ellsworth, name:rusk-dean, name:wheeler-earle, name:harriman-w-averell, name:bundy-william]
  - id: cal.1968-04-09.king
    when: Apr. 9
    date: '1968-04-09'
    thread: king
    c: 'Atlanta: the funeral at Ebenezer Baptist Church; the coffin on a farm wagon drawn by mules to Morehouse College. Humphrey there for the President; Robert Kennedy, McCarthy, Nixon and Rockefeller among the mourners.'
    n: '[*New York Times*, Apr. 10, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/10/issue.html). See [[cal.1968-04-04.king]]. Names: Humphrey, Kennedy, McCarthy, Nixon, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:kennedy-robert-f, name:mccarthy-eugene-j, name:nixon-richard-m, name:rockefeller-nelson, state:ga, city:atlanta]
  - id: cal.1968-04-09.cities-and-housing-ny
    when: Apr. 9–10
    date: '1968-04-09'
    thread: cities-and-housing
    also: [states-and-cities]
    c: 'New York. The legislature, the week of King''s funeral, passes Rockefeller''s Urban Development Corporation Act (ch. 174, Laws of 1968), the Assembly after first refusing it (Check the votes): a public corporation to build housing and redevelop the cities, with its own bonds, the power to condemn, and power to override local zoning and building codes. Signed Apr. 10 (Check). Logue, of Boston''s Redevelopment Authority, its head.'
    n: '[Wikipedia, "Empire State Development Corporation"](https://en.wikipedia.org/wiki/Empire_State_Development_Corporation); [Wikipedia, "Edward J. Logue"](https://en.wikipedia.org/wiki/Edward_J._Logue). Check: *Laws of New York*, 1968, ch. 174. [[w.cohen-saving-americas-cities]]; [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1968-04-04.king]]. Names: Rockefeller, Logue, King.'
    tags: [state:ny, name:rockefeller-nelson, name:logue-edward-j, name:king-martin-luther-jr]
  - id: cal.1968-04-09.georgia-ga
    when: Apr. 9
    date: '1968-04-09'
    thread: georgia
    also: [king]
    c: Atlanta. King's funeral. Maddox, who had refused King lying in state at the Capitol and did not close the State's offices, has 160 State troopers ring the Capitol; he does not attend.
    n: '[Wikipedia, "Lester Maddox"](https://en.wikipedia.org/wiki/Lester_Maddox). Check: the troopers'' number, from the *Atlanta Constitution*, Apr. 9–10, 1968. [[w.short-everything-is-pickrick]]; [[w.tuck-beyond-atlanta]]. See [[cal.1968-04-08.king]]. Names: Maddox, King.'
    tags: [state:ga, city:atlanta, name:maddox-lester, name:king-martin-luther-jr]
  - id: cal.1968-04-09.states-and-cities-wilmington-de
    when: Apr. 9
    date: '1968-04-09'
    thread: states-and-cities
    also: [civil-disorders-king]
    c: Wilmington, Del. Looting and fires after King's death, Apr. 9–10; the mayor declares an emergency and a curfew. Governor Terry sends in the National Guard, some 2,800. Within a week the mayor asks it withdrawn; Terry refuses. The Guard patrols the city's Negro neighborhoods through the year, into 1969.
    n: 'Check: the Guard''s numbers and the dates of the mayor''s requests, from the *Wilmington Evening Journal* and the Guard''s records. [Wikipedia, "Wilmington riot of 1968"](https://en.wikipedia.org/wiki/Wilmington_riot_of_1968). [[w.hoffecker-corporate-capital]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-04.civil-disorders]]. Names: Terry, King.'
    tags: [state:de, city:wilmington-de, name:terry-charles-l-jr, name:king-martin-luther-jr]
  - id: cal.1968-04-10.open-housing
    when: Apr. 10
    date: '1968-04-10'
    thread: open-housing
    also: [congress]
    c: 'House, H. Res. 1100, the Senate''s bill taken without a conference: the previous question ordered, [229–195](https://voteview.com/rollcall/RH0900294); adopted, [250–172](https://voteview.com/rollcall/RH0900295). Johnson: "the voice of justice speaks again."'
    n: 'Broadcast Statement by the President Following the Passage of the Civil Rights Act, [1968–69 Pub. Papers 507](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=585) (Apr. 10, 1968). [[w.kotz-judgment-days]]; [[w.bonastia-knocking-on-the-door]]. See [[cal.1968-02-06.open-housing]]; [[cal.1967-02-15.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-10.vietnam
    when: Apr. 10
    date: '1968-04-10'
    thread: vietnam-abrams
    also: [defense]
    c: 'News conference: Abrams to succeed Westmoreland; Goodpaster his deputy; McCain to succeed Sharp in the Pacific Command.'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 504](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=582) (Apr. 10, 1968). [[w.sorley-thunderbolt]]; [[w.cosmas-joint-chiefs-of-staff]], 204; [[w.drea-mcnamara-clifford-and-the-2011]], 194. See [[cal.1968-03-22.vietnam]]. Names: Abrams, Westmoreland, Goodpaster, McCain, Sharp, Johnson.'
    tags: [name:abrams-creighton, name:westmoreland-william, name:goodpaster-andrew-j, name:mccain-john-s-jr, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1968-04-10.vietnam-205000
    when: Apr. 10–11
    date: '1968-04-10'
    thread: vietnam-205000
    also: [defense]
    c: 'Executive Order 11406: the Secretary of Defense to order units of the Ready Reserve to active duty. Apr. 11, Clifford: some 24,500 reservists called up, about 10,000 of them for Vietnam; the ceiling there 549,500 (Check the figures).'
    n: '[Executive Order 11406](https://www.presidency.ucsb.edu/documents/executive-order-11406-assigning-authority-with-respect-ordering-units-the-ready-reserve) (Apr. 10, 1968). [*New York Times*, Apr. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/12/issue.html). See [[cal.1968-02-27.vietnam]]; [[cal.1968-03-31.elections-1968]]. Names: Clifford, Johnson.'
    tags: [name:clifford-clark, name:johnson-lyndon-b]
  - id: cal.1968-04-10.transition-and-staff
    when: Apr. 10
    date: '1968-04-10'
    thread: transition-and-staff
    c: 'News conference: O''Brien''s resignation as Postmaster General accepted; Watson, the Appointments Secretary, named to succeed him; Jim Jones and Larry Temple to take Watson''s work.'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 504](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=582) (Apr. 10, 1968). [[w.christian-president-steps-down]]. See [[cal.1968-03-22.transition-and-staff]]. Names: O''Brien, Watson, James R. Jones, Temple, Johnson.'
    tags: [name:obrien-lawrence-f, name:watson-w-marvin, name:jones-james-r, name:temple-larry, name:johnson-lyndon-b]
  - id: cal.1968-04-10.opinion
    when: Apr. 10
    date: '1968-04-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 22–27: those 21 to 29 who consider themselves Republicans 22 percent, Democrats 38, independents 40; 50 and over, 30, 46 and 24. Non-whites 21 to 29: Democrats 67. Of those 21 to 29, registered to vote where they live: yes 48, no 52; 21 to 24, 34; 25 to 29, 58.'
    n: '[[w.gallup-poll]], III, 2117–19.'
  - id: cal.1968-04-11.open-housing
    when: Apr. 11
    date: '1968-04-11'
    thread: open-housing
    also: [civil-disorders]
    c: 'The Civil Rights Act of 1968 signed, [82 Stat. 73](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg73.pdf). Title VIII: discrimination in the sale or rental of housing barred by stages to 1970; exempt, the owner selling his own house without a broker, and the owner-occupied house of four units or fewer. Title I: federal crimes of interference with civil rights, and interstate travel to incite a riot. Titles II–VII: the rights of American Indians. Title X: teaching or carrying firearms and explosives for a civil disorder.'
    n: 'Remarks Upon Signing the Civil Rights Act, [1968–69 Pub. Papers 509](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=587) (Apr. 11, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-04-10.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, bill:civil-rights-1968]
  - id: cal.1968-04-11.vietnam-paris
    when: Apr. 11
    date: '1968-04-11'
    thread: vietnam-paris
    c: 'Hanoi: Warsaw, Hà Văn Lâu its representative there, the contacts to begin Apr. 18. Johnson to Harriman: "as long as I am President we are not going to Warsaw."'
    n: 'FRUS 1964–68, VI, docs. [190](https://history.state.gov/historicaldocuments/frus1964-68v06/d190), [191](https://history.state.gov/historicaldocuments/frus1964-68v06/d191), [195](https://history.state.gov/historicaldocuments/frus1964-68v06/d195), [197](https://history.state.gov/historicaldocuments/frus1964-68v06/d197). [Johnson and Harriman, 11:46 a.m., Apr. 11](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-averell-harriman-april-11-1968), Conversation WH6804-01-12917 (Miller Center). See [[cal.1968-04-03.vietnam]]. Names: Hà Văn Lâu, Johnson, Harriman.'
    tags: [name:ha-van-lau, name:johnson-lyndon-b, name:harriman-w-averell]
  - id: cal.1968-04-11.civil-disorders
    when: Apr. 11
    date: '1968-04-11'
    thread: civil-disorders-king
    c: 'Baltimore. Agnew, to some hundred of the city''s Negro leaders called to the State Office Building: they had not spoken out against the rioters and the "circuit-riding, Hanoi-visiting, caterwauling, riot-inciting, burn-America-down type of leader" (Check the words). Most of them walk out.'
    n: '[*New York Times*, Apr. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/12/issue.html). [[w.witcover-white-knight]]; [[w.baltimore-68]]. See [[cal.1968-04-04.civil-disorders]]. Names: Agnew.'
    tags: [name:agnew-spiro-t, state:md, city:baltimore]
  - id: cal.1968-04-14.opinion
    when: Apr. 14
    date: '1968-04-14'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Apr. 4–9, Democrats'' choice for the nomination: Robert Kennedy 35 percent, Humphrey 31, McCarthy 23, undecided 11. Of two: Kennedy 46, McCarthy 37; Kennedy 45, Humphrey 41; Humphrey 48, McCarthy 37.'
    n: '[[w.gallup-poll]], III, 2120–21. Names: Kennedy, Humphrey, McCarthy.'
    tags: [name:kennedy-robert-f, name:humphrey-hubert-h, name:mccarthy-eugene-j]
  - id: cal.1968-04-15.civil-disorders
    when: Apr. 15
    date: '1968-04-15'
    thread: civil-disorders-king
    c: 'Chicago. Daley, at a news conference: he has told the police superintendent to issue orders "to shoot to kill any arsonist or anyone with a Molotov cocktail in his hand" and "to shoot to maim or cripple anyone looting" (Check the words).'
    n: '[*New York Times*, Apr. 16, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/16/issue.html). [[w.cohen-american-pharaoh]]. See [[cal.1968-04-04.civil-disorders]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-04-15.japan-and-korea
    when: Apr. 15–17
    date: '1968-04-15'
    thread: korea
    also: [vietnam]
    c: 'Honolulu. Johnson with Park Chung Hee. Joint statement, Apr. 17: the attack on the presidential residence at Seoul and the *Pueblo*''s seizure reviewed; further aggression from the North "a most grave threat to peace," the two governments then to determine at once the action to be taken under the Mutual Defense Treaty; the modernization of Korea''s forces to continue; the defense ministers to meet in Washington in May.'
    n: 'Joint Statement Following Discussions With President Park of Korea, [1968–69 Pub. Papers 516](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=594) (Apr. 17, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [192](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d192), [194](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d194). [[w.lerner-pueblo-incident]]; [[w.park-chung-hee-era]]; [[w.drea-mcnamara-clifford-and-the-2011]], 495; [[w.poole-joint-chiefs-of-staff-2012]], 244. See [[cal.1968-01-23.japan-and-korea]]. Names: Johnson, Park Chung Hee.'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1968-04-16.king
    when: Apr. 16
    date: '1968-04-16'
    thread: king-memphis
    also: [labor-disputes]
    c: 'Memphis. The sanitation strike settled, Reynolds mediating: the City Council recognizes the union, AFSCME''s Local 1733; dues deducted through the workers'' credit union; raises from May 1 and Sept. 1 (Check the terms).'
    n: '[*New York Times*, Apr. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/17/issue.html). See [[cal.1968-03-18.king]]. Names: Reynolds.'
    tags: [name:reynolds-james-j, state:tn, city:memphis]
  - id: cal.1968-04-17.civil-disorders
    when: Apr. 17
    date: '1968-04-17'
    thread: civil-disorders-king
    c: 'Chicago. Daley: no policeman was ordered to shoot to kill (Check).'
    n: 'Check: *New York Times*, Apr. 18, 1968. See [[cal.1968-04-15.civil-disorders]]. Names: Daley.'
    tags: [name:daley-richard-j, state:il, city:chicago]
  - id: cal.1968-04-17.opinion
    when: Apr. 17
    date: '1968-04-17'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey: Johnson''s decision to stop the bombing of North Vietnam: approve 64 percent, disapprove 26. Apr. 4–9, his handling of his job: approve 49, disapprove 40.'
    n: '[[w.gallup-poll]], III, 2121. See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-18.defense
    when: Apr. 18–19
    date: '1968-04-18'
    thread: defense
    c: Senate, S. 3293, military procurement for fiscal 1969. An amendment barring funds to deploy the antiballistic missile until it is practicable and its cost can be known, refused, [28–31](https://voteview.com/rollcall/RS0900397), Apr. 18; a cut of about 3 percent, [45–13](https://voteview.com/rollcall/RS0900401); passed, [54–3](https://voteview.com/rollcall/RS0900402), Apr. 19.
    n: '[[w.bundy-danger-and-survival]]. See [[cal.1967-09-18.defense]].'
  - id: cal.1968-04-19.vietnam-operations
    when: Apr. 19
    date: '1968-04-19'
    thread: vietnam-operations
    c: 'Delaware: the 1st Cavalry Division into the A Shau Valley, with the 101st Airborne pushing west along Route 547. Two battalions and a battery flown into the north of the valley; 23 aircraft hit the first day, 10 of them down or too damaged to fly; 4 killed, 20 wounded.'
    n: '[[w.villard-united-states-army-in]], 517–527; [[w.phillips-shau]]; [[w.vietnam-victory-in-vietnam]], 229; [[w.cosmas-joint-chiefs-of-staff]], 205. Check: *Victory in Vietnam* gives almost 1,000 American and South Vietnamese casualties, Apr. 19–May 16 (229).'
    tags: [place:a-shau-valley, province:thua-thien]
  - id: cal.1968-04-20.vietnam
    when: Apr. 20–21
    date: '1968-04-20'
    thread: vietnam-paris
    c: The site. Gronouski told to make it clear to the Poles that Warsaw is not acceptable.
    n: 'FRUS 1964–68, VI, doc. [201](https://history.state.gov/historicaldocuments/frus1964-68v06/d201). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-04-08.vietnam]]. Names: Gronouski.'
    tags: [name:gronouski-john-a]
  - id: cal.1968-04-21.opinion
    when: Apr. 21
    date: '1968-04-21'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Apr. 4–9, with Wallace as a third party''s candidate: Nixon 41 percent, McCarthy 38, Wallace 10. Nixon 41, Robert Kennedy 38, Wallace 10. Nixon 43, Humphrey 34, Wallace 9. Democrats: McCarthy 56, Kennedy 61, Humphrey 59.'
    n: '[[w.gallup-poll]], III, 2121–22. Names: Nixon, McCarthy, Wallace, Kennedy, Humphrey.'
    tags: [name:nixon-richard-m, name:mccarthy-eugene-j, name:wallace-george-c, name:kennedy-robert-f, name:humphrey-hubert-h]
  - id: cal.1968-04-22.court
    when: Apr. 22
    date: '1968-04-22'
    thread: court
    c: 'Obscenity. *Ginsberg v. New York*, [390 U.S. 629](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390629/usrep390629.pdf): a State may bar the sale to minors under seventeen of material "harmful to minors" that adults may buy. *Interstate Circuit, Inc. v. City of Dallas*, [390 U.S. 676](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390676/usrep390676.pdf): Dallas''s ordinance classifying films "not suitable for young persons" void for vagueness.'
    n: Opinions. [[w.powe-warren-court-and-american]]. See [[cal.1966-03-21.court]].
    tags: [state:tx, city:dallas]
  - id: cal.1968-04-22.states-and-cities
    when: Apr. 22
    date: '1968-04-22'
    thread: states-and-cities
    also: [school-aid]
    c: 'District of Columbia Elected Board of Education Act signed, [82 Stat. 101](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg101.pdf): the board, appointed by the District''s judges, to be elected (Check the number of members and the first election). Through the House, Sept. 25, 1967, [326–3](https://voteview.com/rollcall/RH0900141). Mar. 13, Johnson''s message on the District, "The Nation''s First City."'
    n: 'Remarks Upon Signing the District of Columbia Elected Board of Education Act, [1968–69 Pub. Papers 519](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=597) (Apr. 22, 1968); Special Message to the Congress on the District of Columbia: "The Nation''s First City", [1968–69 Pub. Papers 383](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=461) (Mar. 13, 1968). See [[cal.1967-08-09.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1968-04-22.vietnam-paris
    when: Apr. 22–23
    date: '1968-04-22'
    thread: vietnam-paris
    c: 'The site. Rusk''s proposal approved: a message through Vientiane, the two sides'' ambassadors to meet there to agree on a site (Check the terms). Bucharest weighed.'
    n: 'FRUS 1964–68, VI, docs. [203](https://history.state.gov/historicaldocuments/frus1964-68v06/d203), [204](https://history.state.gov/historicaldocuments/frus1964-68v06/d204), [205](https://history.state.gov/historicaldocuments/frus1964-68v06/d205). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-04-08.vietnam]]. Names: Rusk, Johnson.'
    tags: [name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-04-22.vietnam-order-of-battle
    when: Apr. 22
    date: '1968-04-22'
    thread: vietnam-order-of-battle
    c: 'Wheeler to Clifford on the order of battle. CIA''s analysts about to put the enemy at 480,000–615,000, the political infrastructure counted, twice the agreed figures; MACV will not count the "insurgency base," the self-defense forces and the like, 210,000–230,000 in CIA''s count. With Westmoreland: airing the figures would be "contrary to our national interest."'
    n: 'FRUS 1964–68, VI, doc. [202](https://history.state.gov/historicaldocuments/frus1964-68v06/d202) (CM-3230-68), and Wheeler''s covering note to Helms, Apr. 22. Made public: FRUS 1964–68, VI (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Wheeler, Clifford, Westmoreland, Helms.'
    tags: [name:wheeler-earle, name:clifford-clark, name:westmoreland-william, name:helms-richard]
  - id: cal.1968-04-23.elections-1968
    when: Apr. 23
    date: '1968-04-23'
    thread: elections-1968
    c: 'Pennsylvania primary. Republican: Nixon (write-in) 59.7 percent, Rockefeller (write-in) 18.4. Democratic: McCarthy 71.7 percent, Kennedy (write-in) 11.0.'
    n: 'CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Rockefeller, Nixon, Kennedy.'
    tags: [primary:1968-04-23, name:mccarthy-eugene-j, name:rockefeller-nelson, name:nixon-richard-m, name:kennedy-robert-f]
  - id: cal.1968-04-23.students
    when: Apr. 23–24
    date: '1968-04-23'
    thread: students-columbia
    also: [war-opposition]
    c: New York. Columbia. Apr. 23, SDS, Rudd its chapter's chairman, and the Students' Afro-American Society rally against the university's gymnasium in Morningside Park and its ties to the Institute for Defense Analyses; Hamilton Hall held, the acting dean kept in his office a day; from Apr. 24 the black students hold it alone. Low Library, with Kirk's offices, then Avery, Fayerweather and Mathematics taken (Check the days).
    n: '[*New York Times*, Apr. 24, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/24/issue.html). [[w.disturbances-crisis-at-columbia]]; [[w.avorn-up-against-the-ivy]]; [[w.sale-sds]]; [[w.bradley-harlem-vs-columbia-university]]; [[w.rogers-black-campus-movement]]. Names: Rudd, Grayson Kirk.'
    tags: [name:rudd-mark, name:kirk-grayson, state:ny, city:nyc]
  - id: cal.1968-04-23.state-constitutions-pa
    when: Apr. 23
    date: '1968-04-23'
    thread: state-constitutions
    also: [legislatures]
    c: 'Pennsylvania''s voters, at the primary, approve the convention''s proposals (Check the votes on each): the Senate of fifty districts and the House of 203, drawn after each census by a commission of the four floor leaders and a chairman; a unified judicial system under the Supreme Court, the justices of the peace replaced by district justices; home rule for local governments; limits on the State''s debt.'
    n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention) (the *Tabulation of Votes Cast on Constitutional Proposals, Presidential Primary Election of April 23, 1968*, with the *Debates*); [the Constitution of 1968, as amended](https://www.paconstitution.org/texts-of-the-constitution/1968-2/). Check: the *Pennsylvania Manual*, vol. 99. [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1968-02-29.state-constitutions-pa]].'
    tags: [state:pa]
  - id: cal.1968-04-24.opinion
    when: Apr. 24
    date: '1968-04-24'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Apr. 4–9: the Johnson Administration pushing integration too fast 39 percent, about right 25, not fast enough 21. Whites 42, 24 and 20. Southern whites 66, 17 and 7. Outside the South 34, 27 and 24.'
    n: '[[w.gallup-poll]], III, 2122. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-25.transition-and-staff
    when: Apr. 25
    date: '1968-04-25'
    thread: transition-and-staff
    c: 'News conference: Goldberg resigns as Representative to the United Nations, to stay until June; Ball named.'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 537](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=615) (Apr. 25, 1968). See [[cal.1968-04-10.transition-and-staff]]. Names: Goldberg, Ball, Johnson.'
    tags: [name:goldberg-arthur-j, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1968-04-25.students-columbia
    when: Apr. 25
    date: '1968-04-25'
    thread: students-columbia
    c: New York. Columbia suspends work on the gymnasium in Morningside Park.
    n: See [[cal.1968-04-23.students]].
    tags: [state:ny, city:nyc]
  - id: cal.1968-04-26.transition-and-staff
    when: Apr. 26
    date: '1968-04-26'
    thread: transition-and-staff
    c: Watson sworn in as Postmaster General.
    n: 'Remarks at the Swearing In of W. Marvin Watson as Postmaster General, [1968–69 Pub. Papers 543](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=621) (Apr. 26, 1968). See [[cal.1968-04-10.transition-and-staff]]. Names: Watson, Johnson.'
    tags: [name:watson-w-marvin, name:johnson-lyndon-b]
  - id: cal.1968-04-26.war-opposition
    when: Apr. 26–27
    date: '1968-04-26'
    thread: war-opposition
    also: [students]
    c: 'Apr. 26, a student strike against the war and the draft, called by the Student Mobilization Committee (Check the numbers). Apr. 27, New York, the Sheep Meadow in Central Park: a rally against the war, Coretta Scott King speaking (Check the numbers).'
    n: '[*New York Times*, Apr. 27, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/27/issue.html); [Apr. 28, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/28/issue.html). [[w.debenedetti-american-ordeal]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. See [[cal.1967-10-21.war-opposition]]. Names: Coretta Scott King.'
    tags: [name:king-coretta-scott, state:ny, city:nyc]
  - id: cal.1968-04-26.testing-nv
    when: Apr. 26
    date: '1968-04-26'
    thread: testing
    also: [states-and-cities]
    c: 'Nevada Test Site, Pahute Mesa. Boxcar, an underground test of 1.3 megatons. Howard Hughes, in the Desert Inn, had pressed the government to put it off (Check: his appeal to Johnson).'
    n: 'Department of Energy, Nevada Field Office, [*United States Nuclear Tests, July 1945 through September 1992*, DOE/NV-209, Rev. 16 (2015), 61](https://www.osti.gov/servlets/purl/1351809#page=58): Boxcar, Apr. 26, 1968, 1.3 Mt. [Wikipedia, "Operation Crosstie"](https://en.wikipedia.org/wiki/Operation_Crosstie). [[w.drosnin-citizen-hughes]]; [[w.elliott-history-of-nevada]]. See [[cal.1967-03-22.states-and-cities-nv]]. Names: Hughes, Johnson.'
    tags: [state:nv, city:las-vegas, name:hughes-howard-r-jr, name:johnson-lyndon-b]
  - id: cal.1968-04-27.elections-1968
    when: Apr. 27
    date: '1968-04-27'
    thread: elections-1968
    c: 'Washington, the Shoreham Hotel. Humphrey announces for the Democratic nomination, Harris and Mondale the co-chairmen of his campaign: "the politics of happiness, the politics of purpose, the politics of joy" (Check the words). The primaries'' filing dates mostly past (Check).'
    n: '[Remarks Declaring Candidacy for the Democratic Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-declaring-candidacy-for-the-democratic-presidential-nomination) (Apr. 27, 1968). [Johnson and Humphrey, 8:46 a.m., Apr. 24](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-april-24-1968), Conversation WH6804-02-12922 (Miller Center). [[w.solberg-hubert-humphrey]]; [[w.humphrey-education-of-a-public-1976]]; [[w.eisele-almost-to-the-presidency]]; [[w.johns-price-of-loyalty]]; [[w.gould-1968]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]. Names: Humphrey, Harris, Mondale.'
    tags: [name:humphrey-hubert-h, name:harris-fred-r, name:mondale-walter-f]
  - id: cal.1968-04-28.opinion
    when: Apr. 28
    date: '1968-04-28'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Apr. 4–9, the Democratic convention''s choice among three (the release names no group asked): McCarthy 33 percent, Robert Kennedy 28, Humphrey 25, undecided 14. Those 21 to 29: Kennedy 41, McCarthy 32, Humphrey 16. College-educated: McCarthy 44, Humphrey 26, Kennedy 18. Those who approve of Johnson''s policies: Humphrey 35, Kennedy 29, McCarthy 25; who disapprove: McCarthy 45, Kennedy 27, Humphrey 13.'
    n: '[[w.gallup-poll]], III, 2123–24. Names: McCarthy, Kennedy, Humphrey, Johnson.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1968-04-29.king
    when: Apr. 29–May 1
    date: '1968-04-29'
    thread: king-poor-peoples
    also: [poverty]
    c: 'Washington. Abernathy and the Poor People''s Campaign''s "Committee of 100" put their demands to members of the Cabinet, the Secretaries of Agriculture, Labor, and Housing and Urban Development among them: jobs, income, food, housing (Check the officials and the demands).'
    n: '[*New York Times*, Apr. 30, 1968](https://timesmachine.nytimes.com/timesmachine/1968/04/30/issue.html). [[w.mcknight-last-crusade]]; [[w.fairclough-to-redeem-the-soul]]. See [[cal.1967-12-04.king]]. Names: Abernathy.'
    tags: [name:abernathy-ralph-david, name:freeman-orville-l, name:wirtz-w-willard, name:weaver-robert-c, state:dc, city:washington]
  - id: cal.1968-04-30.students-columbia
    when: Apr. 30
    date: '1968-04-30'
    thread: students-columbia
    c: 'New York. Columbia. From about 2:30 a.m., the city''s police clear the five buildings: some 700 arrested, nearly 150 hurt (Check the counts).'
    n: '[*New York Times*, May 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/01/issue.html). See [[cal.1968-04-23.students]].'
    tags: [state:ny, city:nyc]
  - id: cal.1968-04-30.elections-1968
    when: Apr. 30
    date: '1968-04-30'
    thread: elections-1968
    c: 'Massachusetts primary. Republican: Rockefeller (write-in) 30.0 percent, Volpe 29.5. Democratic: McCarthy 49.3 percent, Kennedy (write-in) 27.6.'
    n: 'Mass., [*Election Statistics*, 1968 (Pub. Doc. No. 43), 45, 80](https://archive.org/details/electionstatisti19671968mass/page/n115). CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Volpe, Rockefeller, Kennedy.'
    tags: [primary:1968-04-30, name:mccarthy-eugene-j, name:volpe-john-a, name:rockefeller-nelson, name:kennedy-robert-f]
  - id: cal.1968-04-30.elections-1968-2
    when: Apr. 30
    date: '1968-04-30'
    thread: elections-1968
    c: 'Rockefeller announces he will seek the Republican nomination. The same day, Massachusetts''s Republican primary: the most write-in votes his.'
    n: '[*New York Times*, May 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/01/issue.html). See [[cal.1968-03-21.elections-1968]]; [[cal.1968-04-30.elections-1968]]. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-04-30.economy
    when: Apr. 30
    date: '1968-04-30'
    thread: economy
    also: [trade]
    c: 'Message on the international monetary system: Congress to approve the amendment to the International Monetary Fund''s Articles creating Special Drawing Rights, a new reserve asset. The amendment agreed by the Group of Ten at Stockholm, Mar. 29–30, France reserving its position.'
    n: 'Special Message to the Congress: "Strengthening the International Monetary System", [1968–69 Pub. Papers 545](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=623) (Apr. 30, 1968). FRUS 1964–68, VIII, doc. [193](https://history.state.gov/historicaldocuments/frus1964-68v08/d193). See [[cal.1967-08-26.economy]]; [[cal.1968-03-14.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-04-30.open-housing-milwaukee
    when: Apr. 30
    date: '1968-04-30'
    thread: open-housing
    also: [states-and-cities]
    c: 'Milwaukee. The Common Council refuses Phillips''s ordinance covering all housing, 12–7, then passes one drafted in Maier''s office on the model of the federal act, amended by Phillips to except only owner-occupied buildings of two units or fewer: 15–4. Maier signs May 8; in force May 10.'
    n: '[Milwaukee Public Library, "200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches). Check: the Common Council''s *Proceedings*, Apr. 30, 1968. See [[cal.1967-12-12.open-housing-milwaukee]]. Names: Phillips, Maier.'
    tags: [state:wi, city:milwaukee, name:phillips-vel, name:maier-henry-w]
  - id: cal.1968-04-30.vietnam-paris
    when: Apr. 30
    date: '1968-04-30'
    thread: vietnam-paris
    c: 'The site. Johnson to Rusk: "can''t we do something on Bucharest before we get another proposal from them?"'
    n: 'FRUS 1964–68, VI, docs. [215](https://history.state.gov/historicaldocuments/frus1964-68v06/d215), [216](https://history.state.gov/historicaldocuments/frus1964-68v06/d216). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-04-08.vietnam]]. Names: Johnson, Rusk.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1968-04-30.vietnam-operations
    when: Apr. 30–May 2
    date: '1968-04-30'
    thread: vietnam-operations
    c: 'The 320th North Vietnamese Division strikes north of Đông Hà, the 3d Marine Division''s command post and base. The fight for the Dai Do hamlets, Apr. 30–May 2: the Marines'' BLT 2/4 loses 81 dead and nearly 300 wounded.'
    n: '[[w.shulimson-u-s-marines-in-1997]], 291–304. Check: the hamlet''s Vietnamese form.'
    tags: [place:dong-ha, province:quang-tri]
