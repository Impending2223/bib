  - id: cal.1968-04-01.vietnam-congress
    when: Apr. 1
    date: '1968-04-01'
    thread: vietnam-congress
    c: 'Senators on Johnson''s address of Mar. 31. McGovern: his "finest hour"; "the most imaginative and significant action of his Administration." Russell: proof of "the sincerity of his overwhelming desire to end the war." Byrd: "an act of selfless devotion to duty." Mansfield: "I hope there will be no question raised in this country about the credibility of Lyndon B. Johnson in this or any other respect."'
    n: '[114 Cong. Rec. 8414, 8417](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt7/pdf/GPO-CRECB-1968-pt7-3-2.pdf#page=6) (1968) (Mansfield; Byrd). [[w.mann-grand-delusion]], 602–03. [[w.mann-walls-of-jericho]], 488 (Russell). To check: McGovern, statement, Apr. 1, 1968, Speeches, Box 35, McGovern Papers (cited by [[w.mann-grand-delusion]], 602 n.49); Russell, statement, Apr. 1, 1968, III, Speech/Media, B, Media, Box 22, Russell Library (cited by [[w.mann-grand-delusion]], 602 n.50). See [[cal.1968-04-01.vietnam]]. Names: Johnson, McGovern, Russell, Byrd, Mansfield.'
