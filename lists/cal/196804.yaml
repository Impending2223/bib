    c: 'After Robert Kennedy, Humphrey with Johnson: Johnson withdrew because he "simply could not function on these great issues if he were subjected every day to attacks from Nixon, McCarthy, and Robert Kennedy." Humphrey has been in touch with Daley and Governor Richard Hughes; Johnson thinks they may go with Kennedy. By Rostow''s memorandum. Johnson urges Humphrey to announce at once: the heart of the matter not the South but New Jersey, Pennsylvania, Illinois, Michigan, Ohio and Indiana.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 869; [[w.palermo-in-his-own-right]], 158 (Daley and Hughes; E; not Johnson''s reasons); [[w.branch-at-canaans-edge]], 750 (no mandate for Humphrey); [[w.shesol-mutual-contempt]], 437 (he could not function if attacked every day by Nixon, McCarthy and Kennedy); [[w.thomas-robert-kennedy]], 365, 471 (after Kennedy, Johnson with Humphrey: he would not help, then advises him how to campaign, "at the Vice President''s disposal at any time of the day or night"). [[w.solberg-hubert-humphrey]], 325–26 (after Kennedy, Humphrey with Johnson; Johnson''s reasons; Daley and Hughes; the six Northern States; Johnson''s grades, Humphrey an A plus Vice President, himself a B plus). Order: after Kennedy''s meeting. To check: W. W. Rostow, memorandum of conversation with the President, the Vice President and Charles Murphy, Apr. 3, 1968, Johnson Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 869 n.58); Humphrey, *The Education of aPublic Man* (1976), 360–61 (cited by [[w.branch-at-canaans-edge]], 750); Walt Rostow notes of LBJ, HHH meeting, 12:29-1:29 p.m., April 3, 1968, Diary Back-up, Box 94, LBJ (cited by [[w.branch-at-canaans-edge]], 750). See [[cal.1968-04-03.robert-kennedy]]. Names: Humphrey, Johnson, Nixon, Eugene McCarthy, Robert Kennedy, Daley, Richard Hughes. Check: Solberg, 326, from Rostow''s memorandum: on announcing, Johnson said only that it was up to Humphrey.'
