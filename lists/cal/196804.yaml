    c: 'Rusher, of *National Review*, with members of the Ripon Society, by one member''s notes, on Reagan''s strategy: with White as broker, a tacit alliance with Rockefeller''s people to stop Nixon on the first two ballots; at the third, a Reagan-Percy ticket, Nixon Secretary of State; "If I could be convinced that Ed Brooke could deliver a portion of the Negro vote, we would take him." At Miami Reagan to "do everything possible to appear moderate, humane, and compassionate." Were Rockefeller nominated, Rusher would bolt to a new party.'
