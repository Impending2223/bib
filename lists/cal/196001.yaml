    also: [china]
    c: 'By the account of Jiang Weiqing 江渭清, first secretary of Jiangsu 江蘇, Mao Zedong 毛澤東, on his special train to Hangzhou 杭州, calls the secretaries of the six regional bureaus and others aboard to study rural work. On the mess halls most present are for them. Pressed by Mao, who promises no reprisals, Jiang names three faults: a year''s grain eaten in half a year; no pigs raised; bowls broken, chopsticks lost and the trees cut for fuel. Mao to Zhou Enlai 周恩來: "Premier, he is right!" Zhou nods.'
    n: '[[w.yang-jisheng-mubei]], II, 763 n.50 (Jiang Weiqing''s account). Made public: 1996 (Jiang Weiqing''s memoir, as [[w.yang-jisheng-mubei]], II, 763 n.50 cites it). To check: [[w.jiang-weiqing-qishi-nian-zhengcheng]], 454–456 (Nanjing: Jiangsu renmin chubanshe, 1996, as [[w.yang-jisheng-mubei]], II, 763 n.50 gives it). Names: Mao Zedong, Zhou Enlai, Jiang Weiqing. Check: the day; the six regional bureaus were set up by the Ninth Plenum in January 1961 (the calendar, Jan. 21, 1961), and the winter may be that of January–February 1961; the calendar has Mao on the train at Nanjing hearing Jiang Weiqing and the Jiangsu committee on Jan. 29, 1961.'
