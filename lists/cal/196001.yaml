    c: 'Zhou Enlai receives Chervonenko, the Soviet Ambassador, and asks him to tell the Soviet Party and Khrushchev: India began the incident and China holds the right of it; if Soviet leaders on their visit to India say they will take a hand, India will use it and China must take a different stand, to the harm of Soviet interests and the two parties'' unity. The Soviet Union should answer Indonesia''s anti-Chinese talk. The Japan–U.S. security treaty revision means Japan''s militarism revived; the two sides should exchange views.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 280 (Jan. 19, 1960). Made public: 1997. Names: Zhou Enlai, Chervonenko, Khrushchev.'
