    time_zone: America/New_York
  - id: cal.1960-01-06.china-leadership
    when: Jan. 6
    date: '1960-01-06'
    place: shanghai
    thread: china-leadership
    c: 'Shanghai, the Culture Club, afternoon. Mao presides at an enlarged meeting of the Politburo Standing Committee on the agenda of the enlarged Politburo meeting: it opens Jan. 7. Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Wang Renzhong, Ouyang Qin, Lin Tie and Zhang Zhongliang present.'
