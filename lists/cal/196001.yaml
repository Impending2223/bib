    c: 'Zhou Enlai with Chen Yi sees Chervonenko: surprise at the Soviet "strict neutrality" in the Sino-Indian border dispute; among socialist states one brother attacked by a bourgeois-led country and another neutral is new, and in substance defends India. The Soviet Union should not state the two parties'' differences publicly; China must analyze the Soviet Central Committee''s reply in full; yielding to Nehru will not keep him from turning right.'
