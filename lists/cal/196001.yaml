  - id: cal.1960-01.conservative-movement
    when: Jan.
    date: 1960-01
    thread: conservative-movement
    also: [goldwater, elections-1960]
    c: 'Chicago, the Union League Club. Twenty-nine members of Manion''s Goldwater for President committee meet. Wannamaker, South Carolina''s new Republican chairman: its thirteen delegates ready for Goldwater, though they might back Nixon in public for a time. Manion''s plan for Goldwater''s book: his own imprint, Victor Publishing, 50,000 copies in March, bulk sales to friendly businesses. Bozell: Goldwater will not be nominated, but as few as fifty delegates for him would serve notice and lay the ground for 1964; money for a national appeal and three or four speakers on tour.'
    n: '[[w.perlstein-before-the-storm]], 61. [[w.gifford-center-cannot-hold]], 114 (Bozell; a Goldwater for President meeting at Chicago, Jan. 23). To check: Manion to the committee''s members, Mar. 11, 1960, Clarence Manion Papers, Chicago Historical Society (cited by [[w.perlstein-before-the-storm]], 61 n.1, for the meeting); "Abstract of Minutes Taken at Goldwater Meeting," Jan. 23, 1960, Chicago, Barry Goldwater Papers, Arizona Historical Foundation (cited by [[w.gifford-center-cannot-hold]], 114 n.59). Check: the date; Perlstein sets the meeting after Jan. 23 and does not date it; Gifford, 114, dates a Goldwater for President meeting at Chicago Jan. 23 by its minutes. Check: Gifford, 150, 153, has Shorey State chairman, 1956–62, and Wannamaker elected national committeeman at the State convention of Mar. 26. Names: Manion, Goldwater, Nixon, Bozell.'
