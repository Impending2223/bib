entries:
  - id: cal.1960-01-06.congress
    when: Jan. 6
    date: '1960-01-06'
    thread: congress
    c: 86th Congress, second session, convenes. Senate 65 D–35 R; House 280 D–153 R, four seats vacant. Nixon presides over the Senate. Johnson and Mansfield lead the Senate Democrats, Dirksen and Kuchel the Republicans; Rayburn Speaker, McCormack majority leader, Halleck minority leader.
    n: '[106 Cong. Rec. 1](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt1/pdf/GPO-CRECB-1960-pt1-1-1.pdf) (1960). Check: the House count, from the changes since the opening of 1959. To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.evans-lyndon-b-johnson]]; [[w.hardeman-rayburn]]. Names: Nixon, Johnson, Mansfield, Dirksen, Kuchel, Rayburn, McCormack, Halleck.'
    tags: [executive:1957-01-20, name:nixon-richard-m, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett, name:kuchel-thomas-h, name:rayburn-sam, name:mccormack-john-w, name:halleck-charles-a]
    short: the 86th's second session
  - id: cal.1960-01-07.program
    when: Jan. 7
    date: '1960-01-07'
    thread: program
    c: 'Eisenhower''s State of the Union, in person. A balanced budget for fiscal 1961: expenditures $79.8 billion, a surplus of $4.2 billion for the debt. Atlas operational; Polaris submarines this year. Again asks for the voting proposals of 1959, a farm bill, and an end to the interest ceiling on bonds.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). To check: [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.pach-presidency-of-dwight-d]]; [[w.greenstein-hidden-hand-presidency]]; [[w.hitchcock-age-of-eisenhower]]; [[w.smith-eisenhower-in-war-and]]; [[w.hughes-ordeal-of-power]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
    short: State of the Union
    to:
      - steel
      - economy
      - voting-rights
      - farm
  - id: cal.1960-01-07.steel
    when: Jan. 7
    date: '1960-01-07'
    thread: steel
    also: [labor-disputes]
    c: 'The State of the Union on the steel settlement of Jan. 4, which ended the 116-day strike, Nixon and Labor Secretary Mitchell its brokers: the rise in employment costs, in percent, the lowest of any settlement since the war; several producers to raise no prices "at this time." Labor and management asked to hold prices by gains in productivity.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). [[w.nixon-six-crises]], 304 (the settlement of Jan. 4, Nixon and Mitchell its mediators, by Nixon''s account; the average increase under 3 percent). To check: [[w.gellman-president-and-the-apprentice]] (on Nixon''s part); [[w.metzgar-striking-steel]]; [[w.hoerr-and-the-wolf-finally]]; [[w.tiffany-decline-of-american-steel]]. Names: Nixon, Eisenhower, Mitchell.'
    src:
      c: 6a0b1898
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55: all'
        - 'w.nixon-six-crises 304: A'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m, name:mitchell-james-p]
    short: the long steel strike settled
  - id: cal.1960-01-07.defense
    when: Jan. 7
    date: '1960-01-07'
    thread: defense
    c: 'The 430th meeting of the NSC. Eisenhower''s approval of Gates''s recommendations noted: the ICBM program raised from 20 squadrons (9 Atlas, 11 Titan) to 27 (13 Atlas, 14 Titan); Polaris submarines from 9 to 12, three more begun in fiscal 1961, and long-lead items for three more.'
    n: '[FRUS 1958–60, III, doc. 82](https://history.state.gov/historicaldocuments/frus1958-60v03/d82) (the action, NSC Action 2168, approved Jan. 13). [[w.watson-into-the-missile-age]], 345 (the meeting, the squadrons). To check: [[w.roman-eisenhower-and-the-missile]]. Names: Eisenhower, Gates. Check: Watson has Eisenhower approve the program at the meeting; the record notes an approval already given, its action approved Jan. 13.'
    src:
      c: 86a6b290
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d82: all'
        - 'w.watson-into-the-missile-age 345: A, B'
        - 'via w.watson-into-the-missile-age 345 n.106: B, C'
    tags: [name:eisenhower-dwight-d, name:gates-thomas-s-jr]
  - id: cal.1960-01-08.cuba
    when: Jan. 8
    date: '1960-01-08'
    thread: cuba
    c: 'State and the Joint Chiefs at the Pentagon, 11:30 a.m. Merchant: Cuba "extremely grave": the base at Guantanamo; a Soviet satellite at the doorstep; some 8,000 Americans on the island. Castro''s sudden disappearance might bring worse leaders; "a scalpel is called for; not a meat axe."'
    n: '[FRUS 1958–60, VI, doc. 419](https://history.state.gov/historicaldocuments/frus1958-60v06/d419). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 15–16. Bibliography: [[cal.1960-01-20.cuba]]. Names: Merchant, Castro.'
    src:
      c: 129f1aef
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d419: all'
        - 'w.jones-bay-of-pigs 15–16: all'
        - 'via w.jones-bay-of-pigs 16 n.15a: all'
    tags: [name:merchant-livingston-t, name:castro-fidel, ok:thread-first]
  - id: cal.1960-01-08.berlin-and-vienna
    when: Jan. 8
    date: '1960-01-08'
    thread: berlin-and-vienna
    c: 'Moscow. Kroll, the West German Ambassador, to Khrushchev: Bonn could accept a number of concessions, recognition of East Germany and the Oder-Neisse line among them, never the loss of West Berlin. "Berlin is our historical capital and Bonn is only temporary."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 457–58 (by Khrushchev''s record of 1962 quoting it). To check: memorandum of conversation, Khrushchev and Kroll, Jan. 8, 1960, 0757, 7/33/2, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 458 n.57). Names: Kroll, Khrushchev.'
    src:
      c: a39b73c4
      rows:
        - 'w.fursenko-khrushchevs-cold-war 457–58: all'
        - 'via x.2006.kcw-p457-58: all'
    tags: [name:kroll-hans-s, name:khrushchev-nikita-s]
  - id: cal.1960-01-09.elections-1960
    when: Jan. 9
    date: '1960-01-09'
    thread: elections-1960
    c: Nixon, on his forty-seventh birthday, announces for the Republican nomination; his name to go on the New Hampshire ballot. Rockefeller out since Dec. 26.
    n: '[[w.kallina-kennedy-v-nixon]], 85 (Rockefeller''s withdrawal, Dec. 26); [[w.white-making-of-the-president]], 75–76 (Rockefeller''s withdrawal: the statement drafted Thursday, Dec. 24, issued "on a Friday afternoon in Albany"). Check: the form of the announcement. Check: White, 76, has the statement issued "on a Friday afternoon"; Dec. 26, 1959, was a Saturday. To check: [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; New York Times, Dec. 27, 1959 (cited by [[w.kallina-kennedy-v-nixon]], 85 n.9). Names: Nixon, Rockefeller.'
    src:
      c: 0d0f079a
      rows:
        - 'w.kallina-kennedy-v-nixon 85: C'
        - 'via w.kallina-kennedy-v-nixon 85 n.9: C'
        - 'w.white-making-of-the-president 75–76: C'
    tags: [name:nixon-richard-m, name:rockefeller-nelson]
    short: Nixon announces
  - id: cal.1960-01-09.governors-la
    when: Jan. 9
    date: '1960-01-09'
    thread: governors
    also: [elections-1960]
    c: 'Louisiana''s Democratic runoff for governor: Davis, governor 1944–48, over Morrison, mayor of New Orleans, 487,681 to 414,110, 54.1 percent. First primary, Dec. 5: Morrison over Davis, 278,956 to 213,551, 33.1 percent; a segregationist State senator 143,095, 17.0 percent, who then endorses Davis. The runoff fought over Morrison''s Negro vote.'
    n: 'The figures as [Wikipedia](https://en.wikipedia.org/wiki/1960_Louisiana_gubernatorial_election) gives them. Check: La. Secretary of State, *Primary Election Returns*, 1959–60 (HathiTrust, search only). To check: [[w.fairclough-race-and-democracy]]; [[w.haas-delesseps-s-morrison-and]]; [[w.liebling-earl-of-louisiana]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-elections]]. Names: Jimmie Davis, deLesseps Morrison.'
    tags: [name:davis-jimmie-h, name:morrison-delesseps-s, state:la, city:new-orleans]
    short: Davis over Morrison
