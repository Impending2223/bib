  - id: cal.1960-01-09.elections-1960-nomination
    when: Jan. 9
    date: '1960-01-09'
    thread: elections-1960-nomination
    c: 'Washington, Saturday, 5 p.m., "his magnificent new leader''s office" (the journal does not name him), to Schlesinger: the election lost already, Clark and Proxmire having given the party''s picture as one of "wasters, spenders and wild men"; in Texas Nixon could beat any Democrat except Johnson. "The country wants to be comfortable. It doesn''t want to be stirred up." Of his leadership: "We sought the best and did the possible." Of his candidacy he implies he has not made up his mind: "I would support Stevenson with enthusiasm. I would support Humphrey with enthusiasm. [Pause] I would support Kennedy. I would support Symington."'
    n: '[[w.schlesinger-journals]], 64–65. Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Johnson, Nixon, Stevenson, Humphrey, Kennedy, Symington. Check: the speaker; the journal names him only by "his magnificent new leader''s office," the Texas remark and "his candidacy," which point to Johnson.'
    tags: [name:johnson-lyndon-b, name:schlesinger-arthur-m-jr, name:nixon-richard-m, name:stevenson-adlai-e, name:humphrey-hubert-h, name:kennedy-john-f, city:washington, name:symington-william-s]
