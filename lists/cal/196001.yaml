  - id: cal.1960-01-07.congress
    when: Jan. 7
    date: '1960-01-07'
    place: washington
    thread: congress
    also: [democratic-party]
    c: 'Senate Democrats in conference, Johnson in the chair, 3:30 to 5:12 p.m. Clark moves that the conference meet every two weeks or on the request of fifteen members; Russell: it "would destroy the Conference system after the second week." Clark withdraws it. Gore moves that Policy Committee vacancies be filled by the conference, and withdraws it until the next meeting. Hayden: Cannon has called him; Rayburn wants to adjourn July 2.'
    n: '[[w.ritchie-minutes-of-the-senate]], 515–22 (the meeting; the motions; Russell''s words, 517; Hayden''s report, 522; no vote taken). Names: Johnson, Clark, Russell, Gore, Hayden, Cannon, Rayburn.'
    tags: [name:johnson-lyndon-b, name:clark-joseph-s, name:russell-richard-b, name:gore-albert-sr, name:hayden-carl, name:rayburn-sam, name:cannon-clarence]
    time_range:
      - 1960-01-07T20:30Z
      - 1960-01-07T22:12Z
    time_zone: America/New_York
  - id: cal.1960-01-07.soviet-union-leadership
    when: Jan. 7
    date: '1960-01-07'
    place: moscow
    thread: soviet-union-leadership
    c: 'The Presidium on Kazakhstan. Brezhnev reports the Secretariat''s review of the republic''s leadership. Belyayev: "Критика в мой адрес правильна, с выводами согласен" (the criticism of me is right, I agree with the conclusions); the republic''s leaders against him: no collegiality, the grain left under the snow. Khrushchev: Belyayev overrated. In the continuation: his report untruthful, his conduct wrong in the Temirtau events; if Brezhnev is not sent, Kunaev first secretary, Rodionov second. Resolved: a plenum of the Kazakh Central Committee, Brezhnev to attend.'
    n: 'Protocol 258, item I. [[w.prezidium-tsk-kpss-1954]], I, 415–18 (Malin''s notes and the continuation of Jan. 7), 1068–69 nn.1–3, 8 (the editors: the Kazakh plenum of Jan. 19 relieved Belyayev, Kunaev elected first secretary, Rodionov second, Brezhnev there); III, 71 (P 258/I). Made public: 2003. Names: Brezhnev, Belyayev, Khrushchev, Kunaev, Rodionov.'
    tags: [name:brezhnev-leonid, name:belyayev-nikolai-i, name:khrushchev-nikita-s, polity:ussr, name:kunaev]
  - id: cal.1960-01-07.china-leadership
    when: Jan. 7
    date: '1960-01-07'
    place: shanghai
    thread: china-leadership
    c: 'Shanghai. The enlarged Politburo opens (to Jan. 17), Mao presiding: the Politburo, the provinces'' first secretaries, the central departments. Reports: Li Fuchun, the 1960 plan and the three- and eight-year projections (approved); Lin Biao, defense; Nie Rongzhen, science; Lu Dingyi, education. 1960 to be another leap: steel 18.4 million tons, grain 600 billion jin; Britain overtaken by 1962; in eight years, the four modernizations and the passage to ownership by the whole people. Mess halls, urban communes. Mao''s opening, Jan. 7: the plan above all; the "frontier" weapons to be had in eight years, "kept, not used"; against the Soviet textbook''s stress on material incentives.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 7, 1960 (the entries for Jan. 7–17 and Jan. 7). [[w.zhou-enlai-nianpu-1949]], II, 277, Jan. 7–17, 1960 (Zhou attends; the plan for 1960, the three- and eight-year projections, steel and grain targets). [[w.lengxi-shinian-lunzhan-1956-1966]], 236–237 (Jan. 7–17, the Jinjiang Hotel; the first secretaries and ministers attending; the plan and defense strategy, then Khrushchev); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 476 (Jan. 7–17, 1960; Liu attends the enlarged Politburo meeting in Shanghai; the 1960 plan and the three- and eight-year projections; steel 18.4 million tons, grain 600 billion jin); [[w.yang-shangkun-riji]], I, 468 (Jan. 7, 1960; the enlarged Politburo opens, 11:30 a.m. to 2 p.m.; Li Fuchun''s report on the 1960 plan and the three- and eight-year projections); [[w.yang-jisheng-mubei]], II, 838 (Jan. 7–17: Mao presides over the enlarged Politburo meeting at Shanghai and says production has risen every month since Lushan and the year will be no worse; the meeting approves the State Planning Commission''s report on the 1960 plan, with projections for three and eight years; 1960 another leap year, steel 18.4 million tons, grain 600 billion jin; in eight years the four modernizations and the passage to ownership by the whole people; mess halls to be run in numbers, urban communes tried); [[w.yang-jisheng-mubei]], II, 1169 (the Shanghai meeting, Jan. 7–17, calls 1960 a leap year; sets eight years to move the communes from basic ownership by the team to basic ownership by the commune, three to complete the forty-article agricultural program, five to catch Britain; urban communes to be begun at once); [[w.deng-xiaoping-nianpu-1904]], III, 1525–1526 (Jan. 7–17, 1960; Deng attends; the reports of Li Fuchun, Lin Biao, Nie Rongzhen and Lu Dingyi; Li''s approved; mess halls in the communes and urban communes); [[w.mao-zedong-zhuan]], V, ch. 65 (Jan. 7–17, the enlarged Politburo meeting at Shanghai, Mao presiding: Li Fuchun on the 1960 plan on the first day, with the three-year and eight-year projections; Lin Biao on defense, Nie Rongzhen on science, Lu Dingyi on education; the plan and international questions chiefly discussed, the Soviet textbook also taken up; 1960 a leap year again, steel 18.4 million tons, grain 600 billion jin; the eight-year aim of the four modernizations; mess halls and urban communes to be set up and spread in the year; Mao reached Shanghai at dawn on Jan. 5). [[w.chen-yi-nianpu]], 800 (Jan. 7–17, 1960; Chen Yi attends the enlarged Politburo at Shanghai; it sets the 1960 economic plan); [[w.jian-zhou-enlai]], 442 (January, the Politburo at Shanghai: Mao sets the tone, a greater leap than 1959''s; Li Fuchun presents the plans for 1960 and the next three and eight years, Zhou listening; the goals of overtaking Britain in three years and a "comprehensive industrial system" in eight reconfirmed); [[w.jian-zhou-enlai]], 451 (January 1960, the Politburo at Shanghai: Mao calls Khrushchev a revisionist; the Soviet Union may go the way of revisionism); [[w.peng-zhen-nianpu-1902]], IV, 2 (Jan. 7–17, 1960; Peng Zhen attends; Lin Biao''s report on defense the 14th, Nie Rongzhen''s on science planning and Lu Dingyi''s on education the 15th; Mao speaks the afternoon of the 17th); [[w.guan-vietnamese-communists-relations-with]], 141 (by MacFarquhar, the first of three work conferences on foreign affairs in the year''s first quarter, at Shanghai in January); [[w.zhu-de-nianpu-xinbian]], III, 1760 (Jan. 7–17, 1960; Zhu De 朱德 at the enlarged Politburo 中共中央政治局扩大会议 at Shanghai 上海; the 1960 plan''s high targets; the three- and eight-year projections; the four modernizations to be achieved in the main by 1967; public mess halls and urban communes); [[w.chen-yun-nianpu-xiuding]], III, 29–30 (Chen Yun absent through illness; the 1960 targets: output 306 billion yuan, steel 18.4 million tons, grain 600 billion jin; the 1959 grain crop in fact 340 billion jin); [[w.teiwes-tragedy-of-lin-biao]], 188 (the enlarged Politburo at Shanghai; Lin''s report on national defense). Made public: 1996. Check: Made public: the diary printed the day in 2001 ([[w.shangkun-yang-shangkun-riji-2]]; reprinted [[w.yang-shangkun-riji]], I, 468), before the year the note gives. Check: units D–F: the diary has Lin Biao''s report on defense Jan. 14 and Nie Rongzhen''s and Lu Dingyi''s Jan. 15 ([[w.yang-shangkun-riji]], I, 470); entered on their days. To check: Mao''s talk at the Shanghai conference, January 17, 1960 (cited by [[w.jian-zhou-enlai]], 442 n.4); [[w.fang-weizhong-li-fuchun-zhuan]], 536 (cited by [[w.jian-zhou-enlai]], 442 n.5); [[w.macfarquhar-origins-of-the-cultural]], II, 264, 269–270 (cited by [[w.guan-vietnamese-communists-relations-with]], 141 n.32a); [[w.lieberthal-research-guide-to-central]] (cited by [[w.guan-vietnamese-communists-relations-with]], 141 n.32b). Names: Mao Zedong, Li Fuchun, Lin Biao, Nie Rongzhen, Lu Dingyi.'
