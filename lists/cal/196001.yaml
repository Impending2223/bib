  - id: cal.1960-01-15.china-leadership-5
    when: Jan. 15
    date: '1960-01-15'
    thread: china-leadership
    c: 'The Center 中共中央 approves the request of the party committees of the Central Organs 中央直屬機關黨委 and the Central State Organs 中央國家機關黨委 on handling comrades who erred in the rectification of the anti-Right struggle, with their paper on the standards and rules for classing Rightist opportunists, and sends the six standards out as the nation''s one measure. Any one, without self-criticism and repentance, may class a man a Rightist opportunist: open systematic Rightist talk against the general line, the Leap and the communes; active support for the program of the Peng Dehuai 彭德懷 group and open defense of it; forming a faction and exaggerating and twisting the faults of socialist work against the Party and the Center; refusing a major Central policy or line and making a show of independence; repeated errors in the past, now using criticism of the Leap''s faults to attack the Party; consistent serious Rightism, with serious Rightist words and acts since 1958 and the wrong views kept after the Eighth Plenum''s documents. The two committees'' count from mid-Aug. 1959 to mid-Jan. 1960: 1,900 made chief targets of criticism, 3 percent of their members, 287 of them of bureau rank and above; 2,714 chief targets of help; 224 labelled Rightist opportunists, 61 of them of bureau rank.'
    n: '[[w.yang-jisheng-mubei]], II, 912–913 n.138–139. Made public: 2008. To check: Central Committee, approving the request of the Central Organs and Central State Organs party committees on handling comrades who erred in the rectification of the anti-Right struggle and the paper on the standards and principles for classing Rightist opportunists, Jan. 15, 1960 (cited by [[w.yang-jisheng-mubei]], II, 913 n.138; n.139, "ibid."). Names: Peng Dehuai.'
