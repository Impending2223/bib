  - id: cal.1960-01-17.vietnam-hanoi
    when: Jan. 17–24
    date: '1960-01-17'
    time: 1960-01-17T00:00Z
    place: ben-tre
    thread: vietnam-hanoi
    also: [vietnam-operations, vietnam]
    c: Bến Tre. The rising (Đồng Khởi) begins in three communes, Định Thủy, Phước Hiệp and Bình Khánh, as the enlarged provincial committee, called by Nguyễn Thị Định Jan. 1 at Tân Huề, Mỏ Cày, had decided. Định Thủy up at 8 a.m. Jan. 17, Phước Hiệp free Jan. 19, Bình Khánh at 2 a.m. Jan. 20. By Jan. 24, 47 communes of five districts are up, 22 cleared of the Saigon administration.
    n: '[[w.lich-su-khang-chien-chong-my]], II, 318–23; [[w.guan-vietnamese-communists-relations-with]], 133–134 (the week of Jan. 17–24 of risings in Bến Tre: 47 villages of Mỏ Cày, Giồng Trôm, Châu Thành, Ba Tri and Thạnh Phú at once, held by Jan. 19; the arms taken at Bình Khánh arm three squads; the first company, the 264th; by the army''s history the first use of political and armed struggle together). The time is the first day''s, Định Thủy. To check: [[w.lich-su-quan-doi]], 107–115 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1a); [[w.no-other-road-to]], 59–77 (cited by [[w.guan-vietnamese-communists-relations-with]], 133 n.1b). Names: Nguyễn Thị Định.'
