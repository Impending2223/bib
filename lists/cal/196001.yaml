    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-14.soviet-union
    when: Jan. 14
    date: '1960-01-14'
    thread: soviet-union
    also: [defense]
    c: 'Khrushchev to the Supreme Soviet: the armed forces cut by 1.2 million men, to 2,423,000. Rockets to replace the air force; bomber production stopped. Dulles reports it to the NSC that morning.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 140](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140) (NSC, Jan. 14). *Current Digest of the Soviet Press*, Feb. 10, 1960, 3–16, 23, for the text. [[w.fursenko-khrushchevs-cold-war]], 252–53 (the cut, 1.2 million; Dulles at the NSC that day). Check: Fursenko and Naftali have Eisenhower call it "[a] very tough speech" against Dulles (252, citing the NSC record, n.37); the record gives Dulles the words, the President the view that it "did not appear at first glance to be a very tough speech" (FRUS 1958–60, X, pt. 1, doc. 140). To check: [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]. Names: Khrushchev, Dulles.'
    src:
      c: 2767a69a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140: all'
        - 'w.fursenko-khrushchevs-cold-war 252–53: A, D'
        - 'via w.fursenko-khrushchevs-cold-war 252 n.37: D'
