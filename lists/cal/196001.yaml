    c: 'Mao on the *Qingbao jianxun* of Dec. 23, 1959, for Liu, Zhou, Zhu, Lin, Deng and Peng "to discuss international questions": America''s new moves on China after the Soviet–American talks; its effort to lower Chiang''s standing. Mao: Chiang fights to join international bodies; China, for three, five, ten years, indifferent to them all: "America comes to us, not we to America."'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 6, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 3–4 (Jan. 6, 1960). Made public: 2013. To check: Qingbao jianxun, no. 45, Dec. 23, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 4 n.1a); Qingbao jianxun no. 45, "Some new trends in U.S. China policy after the Soviet-American talks" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 4 n.1d); Qingbao jianxun no. 45, "The U.S. tries to lower the Chiang clique''s international standing and tighten its economic control of Taiwan" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 4 n.1e). Names: Mao Zedong.'
