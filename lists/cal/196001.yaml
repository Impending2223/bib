    c: 'Washington National Airport, the Butler Aviation terminal, a cold January night. Sorensen and Goodwin meet Kennedy, back from a trip, with the draft of his speech on the Presidency for the National Press Club. He reads every page closely: "I don''t mind sticking it to old Ike." Warned that it will be read as an attack on Eisenhower, he does not look up from the draft.'
