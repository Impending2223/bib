    time: 1960-01-25T16:15Z
    place: washington
    thread: cuba
    c: 'Eisenhower with Herter, Rubottom, Bonsal, Persons and Goodpaster, 11:15 a.m., Bonsal called home. Eisenhower: Castro "begins to look like a mad man"; Bonsal: an extreme leftist, strongly anti-American. The best course the OAS''s restraint of Castro; Rubottom doubts the votes. Eisenhower, should things grow worse: "we could quarantine Cuba. If they (the Cuban people) are hungry, they will throw Castro out"; Bonsal against punishing the whole people. Eisenhower to make "a friendly but firm statement."'
    n: '[FRUS 1958–60, VI, doc. 436](https://history.state.gov/historicaldocuments/frus1958-60v06/d436) (Goodpaster''s memorandum, drafted Jan. 26). Made public: FRUS 1958–60, VI (1991). [[w.bissell-reflections-of-a-cold]], 152–53 (the "mad man"; the quarantine); [[w.watson-into-the-missile-age]], 763 (Jan. 25: Eisenhower "told his advisers that Castro was beginning to behave like a ''madman''"; Watson''s words, not Goodpaster''s; not who was there, Bonsal, the OAS or the quarantine). The statement: [[cal.1960-01-26.cuba]]. See [[cal.1960-01-20.cuba]]. Names: Eisenhower, Herter, Rubottom, Bonsal, Persons, Goodpaster, Castro.'
    src:
      c: 1212b98d
      rows:
