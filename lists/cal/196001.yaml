  - id: cal.1960-01-13.soviet-union-leadership
    when: Jan. 13
    date: '1960-01-13'
    thread: soviet-union-leadership
    c: 'The Presidium on Gosplan. Back to the proposal of two planning bodies: the Committee (Kuzmin) the long-term plan, Gosplan the annual; Kosygin: the Committee unfit for such work as it stands. Khrushchev''s proposals on planning approved, a commission under Kozlov to propose measures within a month. Out of the protocol, on housing: Voroshilov: the houses badly built, the flats left empty; Khrushchev defends the Central Committee''s decision, the others with him; Kozlov: Voroshilov''s conduct and words "нетоварищескими, нелояльными и возмутительными" (uncomradely, disloyal and outrageous).'
    n: 'Protocol 259. [[w.prezidium-tsk-kpss-1954]], I, 420–21 (Malin''s notes), 1070 nn.1, 3; III, 74–75 (P 259/I). Made public: 2003. Names: Kuzmin, Kosygin, Khrushchev, Kozlov, Voroshilov.'
