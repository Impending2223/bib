  - id: cal.1960-01-08.republican-party-congress
    when: Jan. 8
    date: '1960-01-08'
    thread: republican-party-congress
    c: The Senate Republicans' Committee on Committees, Schoeppel chairman, 10:20 to 11:20 a.m., on the seats Langer's death leaves on Foreign Relations, Judiciary and Post Office. Javits's letter asking for Commerce would upset the proposed slate; Allott and Scott propose rules to spread the major committees. Recessed for further consultation.
    n: '[[w.wolff-minutes-of-the-senate]], 852–54 (the Committee on Committees'' minutes, printed with the conference''s). Names: Schoeppel, Langer, Javits, Allott, Scott.'
