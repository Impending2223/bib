  - id: cal.1960-01-19.defense
    when: Jan. 19
    date: '1960-01-19'
    place: washington
    thread: defense
    c: 'Senate Armed Services, Russell in the chair, opens executive hearings on the defense posture: Gates, Secretary-designate, and Twining. Their case, by Fursenko and Naftali: the Soviets may have more ICBMs, but American bombers and submarines carry more nuclear firepower; a missile gap, no deterrence gap. Russell: "I can''t accept the statement that there is no missile gap. I think there is."'
