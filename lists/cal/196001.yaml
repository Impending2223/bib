  - id: cal.1960-01-06.republican-party-congress
    when: Jan. 6
    date: '1960-01-06'
    thread: republican-party-congress
    c: 'Senate Republican conference, Saltonstall chairman, thirty-four present, 2:38 to 4:07 p.m.; condolences for Langer and for Thurmond''s wife; the floor leader''s and the whip''s seats made permanent. Dirksen on the session: aid to education the likely first bill, civil rights about Feb. 15, a minimum wage bill early. Javits asks for a conference before the civil rights bill; Dirksen reports the Revenue Service ruling that a sitting Senator''s contributions are tax free.'
    n: '[[w.wolff-minutes-of-the-senate]], 846–50 (the meeting; Dirksen''s report, 847–50; exhibits, 850–52). Names: Saltonstall, Langer, Thurmond, Dirksen, Javits.'
    tags: [name:saltonstall-leverett, name:dirksen-everett, name:javits-jacob-k, name:thurmond-strom, name:langer-william-l]
  - id: cal.1960-01-07.program
    when: Jan. 7
    date: '1960-01-07'
    thread: program
    c: 'Eisenhower''s State of the Union, in person. A balanced budget for fiscal 1961: expenditures $79.8 billion, a surplus of $4.2 billion for the debt. Atlas operational; Polaris submarines this year. Again asks for the voting proposals of 1959, a farm bill, and an end to the interest ceiling on bonds.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). The House sat from noon to 3:34 p.m.: [Daily Digest, D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=2), [D5](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=3). To check: [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.pach-presidency-of-dwight-d]]; [[w.greenstein-hidden-hand-presidency]]; [[w.hitchcock-age-of-eisenhower]]; [[w.smith-eisenhower-in-war-and]]; [[w.hughes-ordeal-of-power]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
    short: State of the Union
    to:
      - steel
      - economy
      - voting-rights
      - farm
    time_range:
      - 1960-01-07T17:00Z
      - 1960-01-07T20:34Z
    time_zone: America/New_York
  - id: cal.1960-01-07.steel
    when: Jan. 7
    date: '1960-01-07'
    thread: steel
    also: [labor-disputes]
    c: 'The State of the Union on the steel settlement of Jan. 4, which ended the 116-day strike, Nixon and Labor Secretary Mitchell its brokers: the rise in employment costs, in percent, the lowest of any settlement since the war; several producers to raise no prices "at this time." Labor and management asked to hold prices by gains in productivity.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). [[w.nixon-six-crises]], 304 (the settlement of Jan. 4, Nixon and Mitchell its mediators, by Nixon''s account; the average increase under 3 percent). The House sat from noon to 3:34 p.m.: [Daily Digest, D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=2), [D5](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=3). To check: [[w.gellman-president-and-the-apprentice]] (on Nixon''s part); [[w.metzgar-striking-steel]]; [[w.hoerr-and-the-wolf-finally]]; [[w.tiffany-decline-of-american-steel]]. Names: Nixon, Eisenhower, Mitchell.'
    src:
      c: 6a0b1898
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55: all'
        - 'w.nixon-six-crises 304: A'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m, name:mitchell-james-p]
    short: the long steel strike settled
    time_range:
      - 1960-01-07T17:00Z
      - 1960-01-07T20:34Z
    time_zone: America/New_York
  - id: cal.1960-01-07.defense
    when: Jan. 7
    date: '1960-01-07'
    thread: defense
    c: 'The 430th meeting of the NSC. Eisenhower''s approval of Gates''s recommendations noted: the ICBM program raised from 20 squadrons (9 Atlas, 11 Titan) to 27 (13 Atlas, 14 Titan); Polaris submarines from 9 to 12, three more begun in fiscal 1961, and long-lead items for three more.'
    n: '[FRUS 1958–60, III, doc. 82](https://history.state.gov/historicaldocuments/frus1958-60v03/d82) (the action, NSC Action 2168, approved Jan. 13). [[w.watson-into-the-missile-age]], 345 (the meeting, the squadrons). To check: [[w.roman-eisenhower-and-the-missile]]. Names: Eisenhower, Gates. Check: Watson has Eisenhower approve the program at the meeting; the record notes an approval already given, its action approved Jan. 13.'
    src:
      c: 86a6b290
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d82: all'
        - 'w.watson-into-the-missile-age 345: A, B'
        - 'via w.watson-into-the-missile-age 345 n.106: B, C'
    tags: [name:eisenhower-dwight-d, name:gates-thomas-s-jr]
