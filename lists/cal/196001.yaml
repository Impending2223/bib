    when: Jan. 22
    date: '1960-01-22'
    thread: voting-rights
    also: [republican-party-congress, elections-1960]
    c: 'Wilkins to Nixon by telegram: the House Republican leaders hold back from the discharge petition to bring the civil rights bill out of the Rules Committee, "Halleckism"; "this performance [is] not calculated to generate love for the Republican Party and its candidates among Negro voters."'
    n: '[[w.gifford-center-cannot-hold]], 65. To check: Wilkins to Nixon, telegram, Jan. 22, 1960, Series 320, Box 820, "Wilkins, Roy," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 65 n.22). Names: Wilkins, Nixon, Halleck.'
