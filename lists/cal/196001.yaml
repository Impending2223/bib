  - id: cal.1960-01-17.china-leadership
    when: Jan. 17
    date: '1960-01-17'
    place: shanghai
    thread: china-leadership
    also: [soviet-union]
    c: 'Shanghai, the enlarged Politburo''s last session; Mao speaks. One decision, the plan: steel 18.35 million tons for the National People''s Congress, 20 million the second account. The center''s departments and the provinces to read the Soviet *Textbook of Political Economy*, critically. Khrushchev''s trip to America good and bad; Sino-Soviet unity to be kept; "peaceful transition" opportunist, to be answered in articles; Lenin''s ninetieth anniversary, Apr. 22 (Deng). War inevitable while the bourgeoisie lasts, avoidable for a long time.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 17, 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 242–246 (Mao''s closing speech, five points: the plan the one decision; the two Soviet books to be read; the United States and Khrushchev''s trip; unity; no world war now, war not called avoidable while imperialism lasts); [[w.yang-shangkun-riji]], I, 471 (Jan. 17, 1960; 4 p.m., the plenary: Ke Qingshi, Li Jingquan and Tao Zhu report the groups'' views on international questions; Mao speaks last; the meeting closes); [[w.deng-xiaoping-nianpu-1904]], III, 1526 (Jan. 17, 1960; afternoon; Deng at the plenary, which hears Ke Qingshi, Li Jingquan and Tao Zhu on the groups'' views of international questions); [[w.mao-zedong-zhuan]], V, ch. 65 n.27 (Mao closes the meeting: the 1960 plan the one decision, steel 18.35 million tons for the National People''s Congress and 20 million as the second account; central departments and provinces to read the Soviet textbook, critically; Khrushchev''s American trip good and bad; unity with the CPSU; "peaceful transition" opportunist, the Moscow Declaration''s third anniversary to be used, Deng Xiaoping adds Lenin''s ninetieth anniversary on Apr. 22; war unavoidable while the bourgeoisie lasts, avoidable for a considerable time). [[w.jian-zhou-enlai]], 442 (Mao: the Lushan Conference good; output up month by month since; a still greater leap this year). Made public: 1999. Check: Made public: the diary printed the day in 2001 ([[w.shangkun-yang-shangkun-riji-2]]; reprinted [[w.yang-shangkun-riji]], I, 471), before the year the note gives. To check: Mao Zedong 毛泽东, speech at the enlarged Politburo meeting 中共中央政治局扩大会议, Shanghai, Jan. 17, 1960 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 65 n.27); Mao''s talk at the Shanghai conference, January 17, 1960 (cited by [[w.jian-zhou-enlai]], 442 n.4). Names: Mao Zedong, Deng Xiaoping, Khrushchev.'
