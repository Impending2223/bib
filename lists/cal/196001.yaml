    thread: defense
    c: 'The missile gap. Gates''s testimony read as moving the intelligence estimates from Soviet capabilities to Soviet intentions. Eisenhower''s news conference: better estimates, not a new method; the bomber gap of 1956 recalled.'
    n: 'The President''s News Conference, [1960–61 Pub. Papers 125](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=177) (Jan. 26, 1960). [[w.watson-into-the-missile-age]], 350–51. Check: Watson gives the testimony as Gates''s before the House Appropriations subcommittee, Jan. 13 (349–50), and to Senators, Jan. 21 (350). To check: [[w.roman-eisenhower-and-the-missile]]; [[w.preble-john-f-kennedy-and]]; [[w.bottome-missile-gap]]; [[w.divine-sputnik-challenge]]; [[w.kaplan-wizards-of-armageddon]]; [[w.kistiakowsky-scientist-at-the-white]]; House Appropriations Committee, *Department of Defense Appropriations for 1961: Hearings*, pt. 1, 23 (cited by [[w.watson-into-the-missile-age]], 350 n.130); *Public Statements of Secretary of Defense Gates, 1959–60*, I, 254–55 (cited by [[w.watson-into-the-missile-age]], 350 n.132). Names: Gates, Eisenhower.'
