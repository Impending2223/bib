entries:
  - id: cal.1960-01-06.congress
    when: Jan. 6
    date: '1960-01-06'
    thread: congress
    c: 86th Congress, second session, convenes. Senate 65 D–35 R; House 280 D–153 R, four seats vacant. Nixon presides over the Senate. Johnson and Mansfield lead the Senate Democrats, Dirksen and Kuchel the Republicans; Rayburn Speaker, McCormack majority leader, Halleck minority leader.
    n: '[106 Cong. Rec. 1](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt1/pdf/GPO-CRECB-1960-pt1-1-1.pdf). Check: the House count, from the changes since the opening of 1959. To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.evans-lyndon-b-johnson]]; [[w.hardeman-rayburn]]; [[w.mcpherson-political-education]]. Names: Nixon, Johnson, Mansfield, Dirksen, Kuchel, Rayburn, McCormack, Halleck.'
    tags: [executive:1957-01-20, name:nixon-richard-m, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett, name:kuchel-thomas-h, name:rayburn-sam, name:mccormack-john-w, name:halleck-charles-a]
  - id: cal.1960-01-07.program
    when: Jan. 7
    date: '1960-01-07'
    thread: program
    c: 'Eisenhower''s State of the Union, in person. A balanced budget for fiscal 1961: expenditures $79.8 billion, a surplus of $4.2 billion for the debt. Atlas operational; Polaris submarines this year. Again asks for the voting proposals of 1959, a farm bill, and an end to the interest ceiling on bonds.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). To check: [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.pach-presidency-of-dwight-d]]; [[w.greenstein-hidden-hand-presidency]]; [[w.hitchcock-age-of-eisenhower]]; [[w.smith-eisenhower-in-war-and]]; [[w.hughes-ordeal-of-power]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
    short: State of the Union
    to:
      - steel
      - economy
      - voting-rights
      - farm
  - id: cal.1960-01-07.steel
    when: Jan. 7
    date: '1960-01-07'
    thread: steel
    also: [labor-disputes]
    c: 'The State of the Union on the steel settlement of Jan. 4, which ended the 116-day strike, Nixon and Labor Secretary Mitchell its brokers: the rise in employment costs, in percent, the lowest of any settlement since the war; several producers to raise no prices "at this time." Labor and management asked to hold prices by gains in productivity.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). [[w.gellman-president-and-the-apprentice]], on Nixon''s part. To check: [[w.metzgar-striking-steel]]; [[w.hoerr-and-the-wolf-finally]]; [[w.tiffany-decline-of-american-steel]]. Names: Nixon, Eisenhower, Mitchell.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m, name:mitchell-james-p]
  - id: cal.1960-01-07.defense
    when: Jan. 7
    date: '1960-01-07'
    thread: defense
    c: 'The 430th meeting of the NSC. Eisenhower''s approval of Gates''s recommendations noted: the ICBM program raised from 20 squadrons (9 Atlas, 11 Titan) to 27 (13 Atlas, 14 Titan); Polaris submarines from 9 to 12, three more begun in fiscal 1961, and long-lead items for three more.'
    n: '[FRUS 1958–60, III, doc. 82](https://history.state.gov/historicaldocuments/frus1958-60v03/d82) (the action, NSC Action 2168, approved Jan. 13). [[w.watson-into-the-missile-age]], 345 (the meeting, the squadrons). To check: [[w.roman-eisenhower-and-the-missile]]. Names: Eisenhower, Gates. Check: Watson has Eisenhower approve the program at the meeting; the record notes an approval already given, its action approved Jan. 13.'
    src:
      c: 86a6b290
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d82: all'
        - 'w.watson-into-the-missile-age 345: A, B'
        - 'via w.watson-into-the-missile-age 345 n.106: B, C'
    tags: [name:eisenhower-dwight-d, name:gates-thomas-s-jr]
  - id: cal.1960-01-09.elections-1960
    when: Jan. 9
    date: '1960-01-09'
    thread: elections-1960
    c: Nixon, on his forty-seventh birthday, announces for the Republican nomination; his name to go on the New Hampshire ballot. Rockefeller out since Dec. 26.
    n: '[[w.kallina-kennedy-v-nixon]], 85 (Rockefeller''s withdrawal, Dec. 26). Check: the form of the announcement. To check: [[w.white-making-of-the-president]]; [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; New York Times, Dec. 27, 1959 (cited by [[w.kallina-kennedy-v-nixon]], 85 n.9). Names: Nixon, Rockefeller.'
    src:
      c: 0d0f079a
      rows:
        - 'w.kallina-kennedy-v-nixon 85: C'
        - 'via w.kallina-kennedy-v-nixon 85 n.9: C'
    tags: [name:nixon-richard-m, name:rockefeller-nelson]
  - id: cal.1960-01-09.governors-la
    when: Jan. 9
    date: '1960-01-09'
    thread: governors
    also: [elections-1960]
    c: 'Louisiana''s Democratic runoff for governor: Davis, governor 1944–48, over Morrison, mayor of New Orleans, 487,681 to 414,110, 54.1 percent. First primary, Dec. 5: Morrison over Davis, 278,956 to 213,551, 33.1 percent; a segregationist State senator 143,095, 17.0 percent, who then endorses Davis. The runoff fought over Morrison''s Negro vote.'
    n: 'The figures as [Wikipedia](https://en.wikipedia.org/wiki/1960_Louisiana_gubernatorial_election) gives them. Check: La. Secretary of State, *Primary Election Returns*, 1959–60 (HathiTrust, search only). To check: [[w.fairclough-race-and-democracy]]; [[w.haas-delesseps-s-morrison-and]]; [[w.liebling-earl-of-louisiana]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-elections]]. Names: Jimmie Davis, deLesseps Morrison.'
    tags: [name:davis-jimmie-h, name:morrison-delesseps-s, state:la, city:new-orleans]
  - id: cal.1960-01-12.economy
    when: Jan. 12
    date: '1960-01-12'
    thread: economy
    c: Special message asks again that the 4¼ percent ceiling on new Treasury bonds be removed, as in June 1959. Short-term borrowing costs the highest in decades. Not removed.
    n: 'Special Message to the Congress on Removal of the Interest Rate Ceiling on Government Bonds, [1960–61 Pub. Papers 21](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=73) (Jan. 12, 1960). Check: the ceiling''s rate, 4¼ percent. To check: [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-12.european-community
    when: Jan. 12–14
    date: '1960-01-12'
    thread: european-community
    also: [trade]
    c: 'Paris. Dillon to the Special Economic Committee, thirteen governments and the EEC Commission, set up by the Western heads of government Dec. 21, 1959. The American aims, all agreed: the OEEC remade, the United States and Canada full members; a committee, the United States in it, on the trade of the Six and the Seven; a group of capital-exporting countries on aid. The Seven had signed the Stockholm Convention, the European Free Trade Association, Jan. 4.'
    n: 'FRUS 1958–60, VII, pt. 1, docs. [95](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d95), [97](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d97), [98](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d98) (Dillon to Eisenhower, Jan. 14). Dillon''s address: [[w.department-of-state-bulletin]], [Feb. 1, 1960, 140–145](https://archive.org/details/departmentofstat421960unit/page/140/mode/1up). To check: [[w.camps-britain-and-the-european]]; [[w.lundestad-empire-by-integration]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.giauque-grand-designs-and-visions]]; [[w.ball-discipline-of-power]]. Names: Dillon.'
    tags: [name:dillon-c-douglas]
  - id: cal.1960-01-12.elections-1960
    when: Jan. 12
    date: '1960-01-12'
    thread: elections-1960
    also: [voting-rights]
    c: 'Nixon puts off Wilkins, who asked on Jan. 6 to bring twenty to twenty-five heads of civil rights organizations, Randolph, King and Reuther among them, to see him on Jan. 14. Don Hughes of his staff to say he is booked that week, then that he has commitments in Florida until after Jan. 27, when, Rogers has told him, Wilkins cannot gather the group: "I think we can get out of it this way."'
    n: '[[w.gifford-center-cannot-hold]], 64–65. Names: Nixon, Wilkins, Randolph, Martin Luther King, Reuther, Rogers.'
    src:
      c: 6b4d602e
      rows:
        - 'w.gifford-center-cannot-hold 64–65: all'
    tags: [name:nixon-richard-m, name:wilkins-roy, name:randolph-a-philip, name:king-martin-luther-jr, name:reuther-walter, name:rogers-william-p]
  - id: cal.1960-01-14.soviet-union
    when: Jan. 14
    date: '1960-01-14'
    thread: soviet-union
    also: [defense]
    c: 'Khrushchev to the Supreme Soviet: the armed forces cut by 1.2 million men, to 2,423,000. Rockets to replace the air force; bomber production stopped. Dulles reports it to the NSC that morning.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 140](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140) (NSC, Jan. 14). *Current Digest of the Soviet Press*, Feb. 10, 1960, 3–16, 23, for the text. To check: [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]; [[w.fursenko-khrushchevs-cold-war]]. Names: Khrushchev, Dulles.'
    tags: [name:khrushchev-nikita-s, name:dulles-allen-w]
  - id: cal.1960-01-14.space
    when: Jan. 14
    date: '1960-01-14'
    thread: space
    c: The Army Ballistic Missile Agency's Development Operations Division, at Huntsville, to NASA, with the Saturn booster; NASA given sole charge of boosters of very high thrust. A second message asks that the Space Act be amended.
    n: 'Special Message to the Congress on Transfers From the Department of Defense to the National Aeronautics and Space Administration, [1960–61 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=84); Special Message to the Congress Recommending Amendments to the National Aeronautics and Space Act, [1960–61 Pub. Papers 34](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=86); Letter to T. Keith Glennan, [1960–61 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89) (all Jan. 14, 1960). To check: [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]; [[w.bilstein-stages-to-saturn]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:glennan-thomas-k-jr]
  - id: cal.1960-01-14.elections-1960
    when: Jan. 14
    date: '1960-01-14'
    thread: elections-1960
    c: 'Kennedy, a declared candidate since Jan. 2, to the National Press Club on the Presidency: the next President must "place himself in the very thick of the fight" and be "the Chief Executive in every sense of the word."'
    n: '[The Presidency in 1960, National Press Club](https://www.presidency.ucsb.edu/documents/the-presidency-1960-national-press-club-washington-dc) (Jan. 14, 1960); [the announcement](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-announcing-his-candidacy-for-the-presidency-the-united) (Jan. 2). To check: [[w.parmet-jack]]; [[w.dallek-unfinished-life]]; [[w.sorensen-kennedy]]; [[w.odonnell-johnny-we-hardly-knew]]. See [[cal.1960-01-09.elections-1960]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1960-01-18.economy
    when: Jan. 18
    date: '1960-01-18'
    thread: economy
    also: [defense]
    c: 'Budget for fiscal 1961: receipts $84 billion, expenditures $79.8 billion, a surplus of $4.2 billion. Defense: new appropriations of $40.6 billion, expenditures of $41 billion.'
    n: 'Annual Budget Message to the Congress: Fiscal Year 1961, [1960–61 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89) (Jan. 18, 1960). [[w.watson-into-the-missile-age]], 348–49; [[w.stein-fiscal-revolution-in-america]], 349, 357–58 (the receipts, expenditures and surplus). To check: [[w.morgan-eisenhower-versus-the-spenders]]; [[w.sundquist-politics-and-policy]]; *The Budget of the United States Government for the Fiscal Year Ending June 30, 1961*, M4–M6, M16, M20–M23, 440–42 (cited by [[w.watson-into-the-missile-age]], 349 n.126). Names: Eisenhower.'
    src:
      c: cbf98f9d
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89: all'
        - 'w.watson-into-the-missile-age 348–49: all'
        - 'w.stein-fiscal-revolution-in-america 349, 357–58: A'
        - 'via w.watson-into-the-missile-age 349 n.126: all'
    tags: [name:eisenhower-dwight-d, budget:1961]
  - id: cal.1960-01-19.japan-and-korea
    when: Jan. 19
    date: '1960-01-19'
    thread: japan-and-korea-treaty
    c: 'Treaty of Mutual Cooperation and Security with Japan signed at the White House, Herter and Kishi among the signers, [11 U.S.T. 1632](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=340), [373 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20373/v373.pdf#page=195). For the treaty of 1951; ten years; prior consultation on major changes in American forces in Japan. Jan. 20: Eisenhower to visit Japan about June 20.'
    n: 'Joint Statement Following Discussions With Prime Minister Kishi of Japan, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165); Remarks at the Signing, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (Jan. 19, 1960). FRUS 1958–60, XVIII, docs. [132](https://history.state.gov/historicaldocuments/frus1958-60v18/d132)–[146](https://history.state.gov/historicaldocuments/frus1958-60v18/d146). The status of forces agreement signed the same day, [11 U.S.T. 1652](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=360). To check: [[w.packard-protest-in-tokyo]]; [[w.kapur-japan-at-the-crossroads]]; [[w.schaller-altered-states]]; [[w.lafeber-clash]]; [[w.eisenhower-white-house-years]]. Names: Eisenhower, Herter, Kishi.'
    tags: [name:eisenhower-dwight-d, name:kishi-nobusuke, name:herter-christian-a, name:macarthur-douglas-ii, name:fujiyama-aiichiro]
  - id: cal.1960-01-19.congress
    when: Jan. 19
    date: '1960-01-19'
    thread: congress
    also: [elections-1960]
    c: Senate, on Hennings's bill to revise the Corrupt Practices Act. His and Keating's amendment for reports of contributions and spending in primaries and conventions, [50–39](https://voteview.com/rollcall/RS0860216).
    n: 'S. 2436, 86th Cong. To check: [[w.heard-costs-of-democracy]]. Names: Hennings, Keating.'
    tags: [name:keating-kenneth-b, name:hennings-thomas-c-jr]
  - id: cal.1960-01-20.economy
    when: Jan. 20
    date: '1960-01-20'
    thread: economy
    c: Economic Report. Output in the fourth quarter of 1959 at an annual rate of $482 billion, despite the steel strike; employment a record 66.2 million. The surplus to retire debt; prices and wages to be held by "informed public opinion," not controls.
    n: 'Annual Message Presenting the Economic Report to the Congress, [1960–61 Pub. Papers 117](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=169) (Jan. 20, 1960). *Economic Report of the President, 1960*, on FRASER. See [[cal.1960-01-18.economy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-20.cuba
    when: Jan. 20–21
    date: '1960-01-20'
    thread: cuba
    c: Castro on television attacks the United States, Nixon and Ambassador Bonsal. Bonsal called home, Jan. 21.
    n: 'FRUS 1958–60, VI, docs. [429](https://history.state.gov/historicaldocuments/frus1958-60v06/d429) (Bonsal, Jan. 21), [433](https://history.state.gov/historicaldocuments/frus1958-60v06/d433). To check: [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]]; [[w.bohning-castro-obsession]]. Names: Castro, Nixon, Bonsal.'
    tags: [name:castro-fidel, name:bonsal-philip-w, name:nixon-richard-m]
  - id: cal.1960-01-21.elections-1960
    when: Jan. 21
    date: '1960-01-21'
    thread: elections-1960
    c: Kennedy, in Milwaukee, enters the Wisconsin primary against Humphrey, a declared candidate since Dec. 30.
    n: '[Statement of Senator John F. Kennedy, Milwaukee, Wisconsin](https://www.jfklibrary.org/node/365976) (Jan. 21, 1960), JFK Library. To check: [[w.humphrey-education-of-a-public-1976]]. See [[cal.1960-01-14.elections-1960]]. Names: Kennedy, Humphrey.'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h]
