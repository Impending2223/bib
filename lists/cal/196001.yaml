    short: Khrushchev's troop cut
  - id: cal.1960-01-14.space
    when: Jan. 14
    date: '1960-01-14'
    thread: space
    c: The Army Ballistic Missile Agency's Development Operations Division, at Huntsville, to NASA, with the Saturn booster; NASA given sole charge of boosters of very high thrust. A second message asks that the Space Act be amended.
    n: 'Special Message to the Congress on Transfers From the Department of Defense to the National Aeronautics and Space Administration, [1960–61 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=84); Special Message to the Congress Recommending Amendments to the National Aeronautics and Space Act, [1960–61 Pub. Papers 34](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=86); Letter to T. Keith Glennan, [1960–61 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89) (all Jan. 14, 1960). To check: [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]; [[w.bilstein-stages-to-saturn]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:glennan-thomas-k-jr]
    short: Huntsville to NASA
