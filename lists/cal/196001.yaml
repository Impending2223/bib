# Cal. II January 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: II
entries:
  - id: cal.1960-01-06.congress
    when: Jan. 6
    date: '1960-01-06'
    thread: congress
    c: 86th Congress, second session, convenes. Senate 65 D–35 R; House 280 D–153 R, four seats vacant. Nixon presides over the Senate. Johnson and Mansfield lead the Senate Democrats, Dirksen and Kuchel the Republicans; Rayburn Speaker, McCormack majority leader, Halleck minority leader.
    n: '[106 Cong. Rec. 1](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt1/pdf/GPO-CRECB-1960-pt1-1-1.pdf). [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.evans-lyndon-b-johnson]]; [[w.hardeman-rayburn]]; [[w.mcpherson-political-education]]. Check: the House count, from the changes since the opening of 1959. Names: Nixon, Johnson, Mansfield, Dirksen, Kuchel, Rayburn, McCormack, Halleck.'
    tags: [executive:1957-01-20, name:nixon-richard-m, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett, name:kuchel-thomas-h, name:rayburn-sam, name:mccormack-john-w, name:halleck-charles-a]
  - id: cal.1960-01-07.program
    when: Jan. 7
    date: '1960-01-07'
    thread: program
    c: 'Eisenhower''s State of the Union, in person. A balanced budget for fiscal 1961: expenditures $79.8 billion, a surplus of $4.2 billion for the debt. Atlas operational; Polaris submarines this year. Again asks for the voting proposals of 1959, a farm bill, and an end to the interest ceiling on bonds.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.pach-presidency-of-dwight-d]]; [[w.greenstein-hidden-hand-presidency]]; [[w.hitchcock-age-of-eisenhower]]; [[w.smith-eisenhower-in-war-and]]; [[w.hughes-ordeal-of-power]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
    short: State of the Union
    to:
      - steel
      - economy
      - voting-rights
      - farm
  - id: cal.1960-01-07.steel
    when: Jan. 7
    date: '1960-01-07'
    thread: steel
    also: [labor-disputes]
    c: 'The State of the Union on the steel settlement of Jan. 4, which ended the 116-day strike, Nixon and Labor Secretary Mitchell its brokers: the rise in employment costs, in percent, the lowest of any settlement since the war; several producers to raise no prices "at this time." Labor and management asked to hold prices by gains in productivity.'
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=55) (Jan. 7, 1960). [[w.metzgar-striking-steel]]; [[w.hoerr-and-the-wolf-finally]]; [[w.tiffany-decline-of-american-steel]]; [[w.gellman-president-and-the-apprentice]], on Nixon''s part. Names: Nixon, Eisenhower, Mitchell.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m, name:mitchell-james-p]
  - id: cal.1960-01-09.elections-1960
    when: Jan. 9
    date: '1960-01-09'
    thread: elections-1960
    c: Nixon, on his forty-seventh birthday, announces for the Republican nomination; his name to go on the New Hampshire ballot. Rockefeller out since Dec. 26.
    n: 'Check: the form of the announcement. [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.rorabaugh-real-making-of-the]]; [[w.donaldson-first-modern-campaign]]; [[w.pietrusza-1960]]; [[w.matthews-kennedy-and-nixon]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]. Names: Nixon, Rockefeller.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson]
  - id: cal.1960-01-09.governors-la
    when: Jan. 9
    date: '1960-01-09'
    thread: governors
    also: [elections-1960]
    c: 'Louisiana''s Democratic runoff for governor: Davis, governor 1944–48, 54.1 percent; Morrison, mayor of New Orleans, 45.9. First primary, Dec. 5: Morrison 33.1, Davis 25.3, a segregationist State senator 17.0, who then endorses Davis. The runoff fought over Morrison''s Negro vote.'
    n: 'The figures as [Wikipedia](https://en.wikipedia.org/wiki/1960_Louisiana_gubernatorial_election) gives them. Check: La. Secretary of State, *Primary Election Returns*, 1959–60 (HathiTrust, search only). [[w.fairclough-race-and-democracy]]; [[w.haas-delesseps-s-morrison-and]]; [[w.liebling-earl-of-louisiana]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-elections]]. Names: Jimmie Davis, deLesseps Morrison.'
    tags: [name:davis-jimmie-h, name:morrison-delesseps-s, state:la, city:new-orleans]
  - id: cal.1960-01-12.economy
    when: Jan. 12
    date: '1960-01-12'
    thread: economy
    c: Special message asks again that the 4¼ percent ceiling on new Treasury bonds be removed, as in June 1959. Short-term borrowing costs the highest in decades. Not removed.
    n: 'Special Message to the Congress on Removal of the Interest Rate Ceiling on Government Bonds, [1960–61 Pub. Papers 21](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=73) (Jan. 12, 1960). [[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]]. Check: the ceiling''s rate, 4¼ percent. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-12.european-community
    when: Jan. 12–14
    date: '1960-01-12'
    thread: european-community
    also: [trade]
    c: 'Paris. Dillon to the Special Economic Committee, thirteen governments and the EEC Commission, set up by the Western heads of government Dec. 21, 1959. The American aims, all agreed: the OEEC remade, the United States and Canada full members; a committee, the United States in it, on the trade of the Six and the Seven; a group of capital-exporting countries on aid. The Seven had signed the Stockholm Convention, the European Free Trade Association, Jan. 4.'
    n: 'FRUS 1958–60, VII, pt. 1, docs. [95](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d95), [97](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d97), [98](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d98) (Dillon to Eisenhower, Jan. 14). Dillon''s address: [[w.department-of-state-bulletin]], [Feb. 1, 1960, 140–145](https://archive.org/details/departmentofstat421960unit/page/140/mode/1up). [[w.camps-britain-and-the-european]]; [[w.lundestad-empire-by-integration]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.giauque-grand-designs-and-visions]]; [[w.ball-discipline-of-power]]. Names: Dillon.'
    tags: [name:dillon-c-douglas]
  - id: cal.1960-01-14.soviet-union
    when: Jan. 14
    date: '1960-01-14'
    thread: soviet-union
    also: [defense]
    c: 'Khrushchev to the Supreme Soviet: the armed forces cut by 1.2 million men, to 2,423,000. Rockets to replace the air force; bomber production stopped. Dulles reports it to the NSC that morning.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 140](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140) (NSC, Jan. 14). *Current Digest of the Soviet Press*, Feb. 10, 1960, 3–16, 23, for the text. [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]; [[w.fursenko-khrushchevs-cold-war]]. Names: Khrushchev, Dulles.'
    tags: [name:khrushchev-nikita-s, name:dulles-allen-w]
  - id: cal.1960-01-14.space
    when: Jan. 14
    date: '1960-01-14'
    thread: space
    c: The Army Ballistic Missile Agency's Development Operations Division, at Huntsville, to NASA, with the Saturn booster; NASA given sole charge of boosters of very high thrust. A second message asks that the Space Act be amended.
    n: 'Special Message to the Congress on Transfers From the Department of Defense to the National Aeronautics and Space Administration, [1960–61 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=84); Special Message to the Congress Recommending Amendments to the National Aeronautics and Space Act, [1960–61 Pub. Papers 34](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=86); Letter to T. Keith Glennan, [1960–61 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89) (all Jan. 14, 1960). [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]; [[w.bilstein-stages-to-saturn]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:glennan-thomas-k-jr]
  - id: cal.1960-01-14.elections-1960
    when: Jan. 14
    date: '1960-01-14'
    thread: elections-1960
    c: 'Kennedy, a declared candidate since Jan. 2, to the National Press Club on the Presidency: the next President must "place himself in the very thick of the fight" and be "the Chief Executive in every sense of the word."'
    n: '[The Presidency in 1960, National Press Club](https://www.presidency.ucsb.edu/documents/the-presidency-1960-national-press-club-washington-dc) (Jan. 14, 1960); [the announcement](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-announcing-his-candidacy-for-the-presidency-the-united) (Jan. 2). [[w.parmet-jack]]; [[w.dallek-unfinished-life]]; [[w.sorensen-kennedy]]; [[w.odonnell-johnny-we-hardly-knew]]. See [[cal.1960-01-09.elections-1960]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1960-01-18.economy
    when: Jan. 18
    date: '1960-01-18'
    thread: economy
    also: [defense]
    c: 'Budget for fiscal 1961: receipts $84 billion, expenditures $79.8 billion, a surplus of $4.2 billion. Defense: new appropriations of $40.6 billion, expenditures of $41 billion.'
    n: 'Annual Budget Message to the Congress: Fiscal Year 1961, [1960–61 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=89) (Jan. 18, 1960). [[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]]; [[w.sundquist-politics-and-policy]]; [[w.watson-into-the-missile-age]], 345, 348. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, budget:1961]
  - id: cal.1960-01-19.japan-and-korea
    when: Jan. 19
    date: '1960-01-19'
    thread: japan-and-korea-treaty
    c: 'Treaty of Mutual Cooperation and Security with Japan signed at the White House, Herter and Kishi among the signers, [11 U.S.T. 1632](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=340), [373 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20373/v373.pdf#page=195). For the treaty of 1951; ten years; prior consultation on major changes in American forces in Japan. Jan. 20: Eisenhower to visit Japan about June 20.'
    n: 'Joint Statement Following Discussions With Prime Minister Kishi of Japan, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165); Remarks at the Signing, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (Jan. 19, 1960). FRUS 1958–60, XVIII, docs. [132](https://history.state.gov/historicaldocuments/frus1958-60v18/d132)–[146](https://history.state.gov/historicaldocuments/frus1958-60v18/d146). The status of forces agreement signed the same day, [11 U.S.T. 1652](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=360). [[w.packard-protest-in-tokyo]]; [[w.kapur-japan-at-the-crossroads]]; [[w.schaller-altered-states]]; [[w.lafeber-clash]]; [[w.eisenhower-white-house-years]]. Names: Eisenhower, Herter, Kishi.'
    tags: [name:eisenhower-dwight-d, name:kishi-nobusuke, name:herter-christian-a, name:macarthur-douglas-ii, name:fujiyama-aiichiro]
  - id: cal.1960-01-19.congress
    when: Jan. 19
    date: '1960-01-19'
    thread: congress
    also: [elections-1960]
    c: Senate, on Hennings's bill to revise the Corrupt Practices Act. His and Keating's amendment for reports of contributions and spending in primaries and conventions, [50–39](https://voteview.com/rollcall/RS0860216).
    n: 'S. 2436, 86th Cong. [[w.heard-costs-of-democracy]]. Names: Hennings, Keating.'
    tags: [name:keating-kenneth-b, name:hennings-thomas-c-jr]
  - id: cal.1960-01-20.economy
    when: Jan. 20
    date: '1960-01-20'
    thread: economy
    c: Economic Report. Output in the fourth quarter of 1959 at an annual rate of $482 billion, despite the steel strike; employment a record 66.2 million. The surplus to retire debt; prices and wages to be held by "informed public opinion," not controls.
    n: 'Annual Message Presenting the Economic Report to the Congress, [1960–61 Pub. Papers 117](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=169) (Jan. 20, 1960). *Economic Report of the President, 1960*, on FRASER. See [[cal.1960-01-18.economy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-20.cuba
    when: Jan. 20–21
    date: '1960-01-20'
    thread: cuba
    c: Castro on television attacks the United States, Nixon and Ambassador Bonsal. Bonsal called home, Jan. 21.
    n: 'FRUS 1958–60, VI, docs. [429](https://history.state.gov/historicaldocuments/frus1958-60v06/d429) (Bonsal, Jan. 21), [433](https://history.state.gov/historicaldocuments/frus1958-60v06/d433). [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]]; [[w.bohning-castro-obsession]]. Names: Castro, Nixon, Bonsal.'
    tags: [name:castro-fidel, name:bonsal-philip-w, name:nixon-richard-m]
  - id: cal.1960-01-21.elections-1960
    when: Jan. 21
    date: '1960-01-21'
    thread: elections-1960
    c: Kennedy, in Milwaukee, enters the Wisconsin primary against Humphrey, a declared candidate since Dec. 30.
    n: '[Statement of Senator John F. Kennedy, Milwaukee, Wisconsin](https://www.jfklibrary.org/node/365976) (Jan. 21, 1960), JFK Library. [[w.humphrey-education-of-a-public-1976]]. See [[cal.1960-01-14.elections-1960]]. Names: Kennedy, Humphrey.'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h]
  - id: cal.1960-01-23.cuba
    when: Jan. 23
    date: '1960-01-23'
    thread: cuba
    c: Eisenhower to Herter. Have a friend raise Castro in the OAS; pushed too hard, the United States might blockade the island.
    n: 'FRUS 1958–60, VI, doc. [434](https://history.state.gov/historicaldocuments/frus1958-60v06/d434). Made public: the conference, in part, *Declassified Documents*, 1981. See [[cal.1960-01-20.cuba]]. Names: Eisenhower, Herter, Castro.'
    tags: [name:eisenhower-dwight-d, name:herter-christian-a, name:castro-fidel]
  - id: cal.1960-01-25.congress
    when: Jan. 25
    date: '1960-01-25'
    thread: congress
    also: [elections-1960]
    c: Senate passes Hennings's bill to revise the Corrupt Practices Act, [59–22](https://voteview.com/rollcall/RS0860218). No House action. Check.
    n: 'S. 2436, 86th Cong. See [[cal.1960-01-19.congress]]. Names: Hennings.'
    tags: [name:hennings-thomas-c-jr]
  - id: cal.1960-01-26.cuba
    when: Jan. 26
    date: '1960-01-26'
    thread: cuba
    c: The President's statement on Cuba. Nonintervention; Cuba's right to its reforms; Americans' claims to be pressed, and taken to international bodies if not settled.
    n: 'Statement by the President Restating United States Policy Toward Cuba, [1960–61 Pub. Papers 134](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=186) (Jan. 26, 1960). FRUS 1958–60, VI, docs. [436](https://history.state.gov/historicaldocuments/frus1958-60v06/d436) (Jan. 25), [440](https://history.state.gov/historicaldocuments/frus1958-60v06/d440) (Dorticós''s reply, Jan. 27). See [[cal.1960-01-20.cuba]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:dorticos-torrado-osvaldo]
  - id: cal.1960-01-26.defense
    when: Jan. 26
    date: '1960-01-26'
    thread: defense
    c: 'The missile gap. Gates''s testimony read as moving the intelligence estimates from Soviet capabilities to Soviet intentions. Eisenhower''s news conference: better estimates, not a new method; the bomber gap of 1956 recalled.'
    n: 'The President''s News Conference, [1960–61 Pub. Papers 125](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=177) (Jan. 26, 1960). Check: the committee and date of Gates''s testimony. [[w.roman-eisenhower-and-the-missile]]; [[w.preble-john-f-kennedy-and]]; [[w.bottome-missile-gap]]; [[w.divine-sputnik-challenge]]; [[w.kaplan-wizards-of-armageddon]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.watson-into-the-missile-age]], 350–351. Names: Gates, Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:gates-thomas-s-jr]
  - id: cal.1960-01-26.vietnam
    when: Jan. 26
    date: '1960-01-26'
    thread: vietnam
    c: 'Viet Cong overrun a South Vietnamese regiment''s post near Tây Ninh and carry off its arms. In Bến Tre a rising since Jan. 17. Feb. 12, Diệm to Durbrow: the guerrilla war now the first danger; 10,000 reservists to be recalled and trained against guerrillas.'
    n: '[FRUS 1958–60, I, doc. 104](https://history.state.gov/historicaldocuments/frus1958-60v01/d104) (Durbrow, Feb. 16). [[w.spector-united-states-army-in]]; [[w.anderson-trapped-by-success]]; [[w.thayer-war-by-other-means]]; [[w.elliott-vietnamese-war]]; [[w.miller-misalliance]], 205; [[w.jacobs-cold-war-mandarin]]; [[w.carter-inventing-vietnam]]; [[w.vietnam-victory-in-vietnam]], 59–63. Names: Diệm, Durbrow.'
    tags: [name:ngo-dinh-diem, name:durbrow-elbridge, place:tay-ninh, province:kien-hoa]
