    tags: [name:gray-gordon]
  - id: cal.1960-01-12.economy
    when: Jan. 12
    date: '1960-01-12'
    thread: economy
    c: Special message asks again that the 4¼ percent ceiling on new Treasury bonds be removed, as in June 1959. Short-term borrowing costs the highest in decades. Not removed.
    n: 'Special Message to the Congress on Removal of the Interest Rate Ceiling on Government Bonds, [1960–61 Pub. Papers 21](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=73) (Jan. 12, 1960). Check: the ceiling''s rate, 4¼ percent. To check: [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-01-12.european-community
    when: Jan. 12–14
    date: '1960-01-12'
    thread: european-community
    also: [trade]
    c: 'Paris. Dillon to the Special Economic Committee, thirteen governments and the EEC Commission, set up by the Western heads of government Dec. 21, 1959. The American aims, all agreed: the OEEC remade, the United States and Canada full members; a committee, the United States in it, on the trade of the Six and the Seven; a group of capital-exporting countries on aid. The Seven had signed the Stockholm Convention, the European Free Trade Association, Jan. 4.'
    n: 'FRUS 1958–60, VII, pt. 1, docs. [95](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d95), [97](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d97), [98](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d98) (Dillon to Eisenhower, Jan. 14). Dillon''s address: [[w.department-of-state-bulletin]], [Feb. 1, 1960, 140–145](https://archive.org/details/departmentofstat421960unit/page/140/mode/1up). To check: [[w.camps-britain-and-the-european]]; [[w.lundestad-empire-by-integration]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.giauque-grand-designs-and-visions]]; [[w.ball-discipline-of-power]]. Names: Dillon.'
    tags: [name:dillon-c-douglas]
    short: the OEEC remade
  - id: cal.1960-01-12.elections-1960
    when: Jan. 12
    date: '1960-01-12'
    thread: elections-1960-nixon
    also: [voting-rights]
    c: 'Nixon puts off Wilkins, who asked on Jan. 6 to bring twenty to twenty-five heads of civil rights organizations, Randolph, King and Reuther among them, to see him on Jan. 14. Don Hughes of his staff to say he is booked that week, then that he has commitments in Florida until after Jan. 27, when, Rogers has told him, Wilkins cannot gather the group: "I think we can get out of it this way."'
    n: '[[w.gifford-center-cannot-hold]], 64–65. Names: Nixon, Wilkins, Randolph, Martin Luther King, Reuther, Rogers.'
    src:
      c: 6b4d602e
      rows:
        - 'w.gifford-center-cannot-hold 64–65: all'
    tags: [name:nixon-richard-m, name:wilkins-roy, name:randolph-a-philip, name:king-martin-luther-jr, name:reuther-walter, name:rogers-william-p]
  - id: cal.1960-01-13.cuba-bay-of-pigs
    when: Jan. 13
    date: '1960-01-13'
    thread: cuba-bay-of-pigs
    c: 'The Special Group, in what is apparently its first talk of a covert program to overthrow Castro. Dulles: over the long run the United States may not be able to tolerate the regime; covert contingency planning for its fall "might be in order." To State''s warning on timing: "we do not have in mind a quick elimination of Castro," but actions to give responsible opposition leaders a foothold.'
    n: '[S. Rep. No. 94-465, 93 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=104). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.jones-bay-of-pigs]], 16. Bibliography: [[cal.1960-03-17.cuba]]. Names: Dulles, Castro. Check: Bissell has the Special Group decide formally that the regime "must be overthrown" (Reflections, 153).'
    src:
      c: 63d2f338
      rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=104: all'
        - 'w.jones-bay-of-pigs 16: B-D'
        - 'via w.jones-bay-of-pigs 16 n.17a: B-D'
    tags: [name:dulles-allen-w, name:castro-fidel, ok:thread-first]
  - id: cal.1960-01-13.voting-rights
    when: Jan. 13
    date: '1960-01-13'
    thread: voting-rights
    c: 'News conference. Eisenhower on the Civil Rights Commission''s plan for federal registrars: "I don''t even know whether it is constitutional." His bill of 1959 to be acted on first.'
    n: 'The President''s News Conference of January 13, 1960, [1960–61 Pub. Papers 21](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=73) (Jan. 13, 1960). [[w.sundquist-politics-and-policy]], 245–46. Names: Eisenhower.'
