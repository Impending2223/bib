  - id: cal.1960-01-26.cuba
    when: Jan. 26
    date: '1960-01-26'
    thread: cuba
    c: The President's statement on Cuba. Nonintervention; Cuba's right to its reforms; Americans' claims to be pressed, and taken to international bodies if not settled.
    n: 'Statement by the President Restating United States Policy Toward Cuba, [1960–61 Pub. Papers 134](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=186) (Jan. 26, 1960). FRUS 1958–60, VI, docs. [436](https://history.state.gov/historicaldocuments/frus1958-60v06/d436) (Jan. 25), [440](https://history.state.gov/historicaldocuments/frus1958-60v06/d440) (Dorticós''s reply, Jan. 27). See [[cal.1960-01-20.cuba]]. Names: Eisenhower.'
