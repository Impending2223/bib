  - id: cal.1960-01-07.elections-1960-rockefeller
    when: Jan. 7
    date: '1960-01-07'
    thread: elections-1960-rockefeller
    c: 'Hinman to Oren Root: with Bloom, the Pennsylvania chairman, an invitation for Rockefeller to a county Lincoln Day dinner near Harrisburg, the way to the State''s finance dinner; the Governor to appear "laboring in the political vineyard for the good of the party," without "any appearance of continued interest in candidacy."'
    n: '[[w.gifford-center-cannot-hold]], 41 (quoting it). To check: Hinman to Oren Root, Jan. 7, 1960, RG 15, Series 22, Subseries 4, Box 50, Folder 1211, Rockefeller Archives (cited by [[w.gifford-center-cannot-hold]], 41 n.53). Names: Hinman, Rockefeller.'
    src:
      c: c1c01309
      rows:
        - 'w.gifford-center-cannot-hold 41: all'
        - 'via w.gifford-center-cannot-hold 41 n.53: all'
    tags: [name:hinman-george-l, name:rockefeller-nelson]
  - id: cal.1960-01-07.congress
    when: Jan. 7
    date: '1960-01-07'
    thread: congress
    also: [democratic-party]
    c: 'Senate Democrats in conference, Johnson in the chair, 3:30 to 5:12 p.m. Clark moves that the conference meet every two weeks or on the request of fifteen members; Russell: it "would destroy the Conference system after the second week." Clark withdraws it. Gore moves that Policy Committee vacancies be filled by the conference, and withdraws it until the next meeting. Hayden: Cannon has called him; Rayburn wants to adjourn July 2.'
    n: '[[w.ritchie-minutes-of-the-senate]], 515–22 (the meeting; the motions; Russell''s words, 517; Hayden''s report, 522; no vote taken). Names: Johnson, Clark, Russell, Gore, Hayden, Cannon, Rayburn.'
    tags: [name:johnson-lyndon-b, name:clark-joseph-s, name:russell-richard-b, name:gore-albert-sr, name:hayden-carl, name:rayburn-sam, name:cannon-clarence]
  - id: cal.1960-01-07.soviet-union-leadership
    when: Jan. 7
    date: '1960-01-07'
    thread: soviet-union-leadership
    c: 'The Presidium on Kazakhstan. Brezhnev reports the Secretariat''s review of the republic''s leadership. Belyayev: "Критика в мой адрес правильна, с выводами согласен" (the criticism of me is right, I agree with the conclusions); the republic''s leaders against him: no collegiality, the grain left under the snow. Khrushchev: Belyayev overrated. In the continuation: his report untruthful, his conduct wrong in the Temirtau events; if Brezhnev is not sent, Kunaev first secretary, Rodionov second. Resolved: a plenum of the Kazakh Central Committee, Brezhnev to attend.'
    n: 'Protocol 258, item I. [[w.prezidium-tsk-kpss-1954]], I, 415–18 (Malin''s notes and the continuation of Jan. 7), 1068–69 nn.1–3, 8 (the editors: the Kazakh plenum of Jan. 19 relieved Belyayev, Kunaev elected first secretary, Rodionov second, Brezhnev there); III, 71 (P 258/I). Made public: 2003. Names: Brezhnev, Belyayev, Khrushchev, Kunaev, Rodionov.'
    tags: [name:brezhnev-leonid, name:belyayev-nikolai-i, name:khrushchev-nikita-s, polity:ussr]
  - id: cal.1960-01-08.cuba
    when: Jan. 8
    date: '1960-01-08'
    time: 1960-01-08T16:30Z
    thread: cuba
    c: 'State and the Joint Chiefs at the Pentagon, 11:30 a.m. Merchant: Cuba "extremely grave": the base at Guantanamo; a Soviet satellite at the doorstep; some 8,000 Americans on the island. Castro''s sudden disappearance might bring worse leaders; "a scalpel is called for; not a meat axe."'
    n: '[FRUS 1958–60, VI, doc. 419](https://history.state.gov/historicaldocuments/frus1958-60v06/d419). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 15–16. Bibliography: [[cal.1960-01-20.cuba]]. Names: Merchant, Castro.'
