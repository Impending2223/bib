  - id: cal.1960-01-23.cuba
    when: Jan. 23
    date: '1960-01-23'
    thread: cuba
    c: Eisenhower to Herter. Have a friend raise Castro in the OAS; pushed too hard, the United States might blockade the island.
    n: 'FRUS 1958–60, VI, doc. [434](https://history.state.gov/historicaldocuments/frus1958-60v06/d434). Made public: the conference, in part, *Declassified Documents*, 1981. See [[cal.1960-01-20.cuba]]. Names: Eisenhower, Herter, Castro.'
