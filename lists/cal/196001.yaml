    c: 'Kentucky''s sales tax. The House passes HB 75 by committee substitute, 84–9: a 3 percent sales and use tax, the "Veterans'' Bonus Sales and Use Tax Law," and bonds for the veterans'' bonus.'
    n: 'Ky. *House Journal*, 1960, [218](https://archive.org/details/jhouseky1960v1/page/218/mode/1up) (the roll call); Ky. *Senate Journal*, 1960, [143](https://archive.org/details/jsencoky1960/page/143/mode/1up) (the bill as the House sent it, Article I), [xxxvi](https://archive.org/details/jsencoky1960/page/n1581/mode/1up) (the index: "Provides three per cent sales tax and sale of bonds to finance Veterans'' bonus"). 1960 Ky. Acts ch. 5, Art. I (the history of [KRS 139.200](https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=58186)). Check: the day Combs approved it; the Journals do not record it.'
