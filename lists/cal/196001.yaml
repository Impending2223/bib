  - id: cal.1960-01-11.cuba
    when: Jan. 11
    date: '1960-01-11'
    thread: cuba
    c: The NSC Planning Board on policy toward Cuba and the Dominican Republic, for the Council of Jan. 14, by Packard's memorandum. Gordon Gray asks whether Cuba's nickel, open to the Soviet Union or China, is a strategic problem for the Council; it is not.
    n: '[FRUS 1958–60, VI, doc. 421](https://history.state.gov/historicaldocuments/frus1958-60v06/d421). Made public: FRUS 1958–60, VI (1991). [[w.jones-bay-of-pigs]], 17 (the papers of January). See [[cal.1960-01-08.cuba]]. Names: Gordon Gray.'
