  - id: cal.1960-01-06.congress
    when: Jan. 6
    date: '1960-01-06'
    thread: congress
    c: 86th Congress, second session, convenes. Senate 65 D–35 R; House 280 D–153 R, four seats vacant. Nixon presides over the Senate. Johnson and Mansfield lead the Senate Democrats, Dirksen and Kuchel the Republicans; Rayburn Speaker, McCormack majority leader, Halleck minority leader.
    n: '[106 Cong. Rec. 1](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt1/pdf/GPO-CRECB-1960-pt1-1-1.pdf) (1960). The Senate sat from noon to 12:24 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=1). The House sat from noon to 3 p.m.: [Daily Digest, D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=2). Check: the House count, from the changes since the opening of 1959. To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.evans-lyndon-b-johnson]]; [[w.hardeman-rayburn]]. Names: Nixon, Johnson, Mansfield, Dirksen, Kuchel, Rayburn, McCormack, Halleck.'
    tags: [executive:1957-01-20, name:nixon-richard-m, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett, name:kuchel-thomas-h, name:rayburn-sam, name:mccormack-john-w, name:halleck-charles-a]
    short: the 86th's second session
    time_range:
