  - id: cal.1960-01-26.vietnam
    when: Jan. 26
    date: '1960-01-26'
    thread: vietnam
    c: 'Viet Cong overrun a South Vietnamese regiment''s post near Tây Ninh and carry off its arms. In Bến Tre a rising since Jan. 17. Feb. 12, Diệm to Durbrow: the guerrilla war now the first danger; 10,000 reservists to be recalled and trained against guerrillas.'
    n: '[FRUS 1958–60, I, doc. 104](https://history.state.gov/historicaldocuments/frus1958-60v01/d104) (Durbrow, Feb. 16); [doc. 121](https://history.state.gov/historicaldocuments/frus1958-60v01/d121) (Williams to Myers, Mar. 20: the regimental camp attacked at 2:30 a.m., Jan. 26). [[w.miller-misalliance]], 205 (the attack; the rising in Bến Tre, mid-January); [[w.vietnam-victory-in-vietnam]], 59, 61–62 (Tua Hai, Jan. 26, by its count 500 killed or captured, 1,500 weapons; Bến Tre from Jan. 17); [[w.asselin-hanois-road-to-the]], 73 (the rising in Bến Tre, from Jan. 17); [[w.moyar-triumph-forsaken]], 87–89 (the rising in Bến Tre from Jan. 17; the attack near Tây Ninh, Jan. 26, forty of the regiment killed and some six hundred firearms taken). To check: [[w.spector-united-states-army-in]]; [[w.anderson-trapped-by-success]]; [[w.thayer-war-by-other-means]]; [[w.elliott-vietnamese-war]]; [[w.jacobs-cold-war-mandarin]]; [[w.carter-inventing-vietnam]]; the Bến Tre provincial committee''s outline of a talk on the rising of 1960, undated [1976?], Vietnam National Archives Center 3 (cited by [[w.asselin-hanois-road-to-the]], 73 n.2, for the rising); An Bao Minh, "Uprising in Ben Tre," TTU, Pike Collection, Unit 2, box 1 (cited by [[w.moyar-triumph-forsaken]], 88 n.1); Saigon to State, May 10, 1960, NA II, RG 59, C0092, reel 11 (cited by [[w.moyar-triumph-forsaken]], 88 n.1); Saigon to State, July 12, 1960, NA II, RG 59, C0092, reel 11 (cited by [[w.moyar-triumph-forsaken]], 88 n.1); U.S. News and World Report, May 2, 1960 (cited by [[w.moyar-triumph-forsaken]], 89 n.3). Names: Diệm, Durbrow.'
