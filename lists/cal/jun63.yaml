    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, May 23–28: Republicans'' choice for 1964: Goldwater 38, Rockefeller 28, Romney 16; others, no preference 18. Independents: Rockefeller 29, Goldwater 28.'
    n: '[[w.gallup-poll]], III, 1826. Names: Goldwater, Nelson Rockefeller, Romney.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w]
