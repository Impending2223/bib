# Cal. XLIII June 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIII
entries:
  - id: cal.1963-06.civil-rights-organizations
    when: June
    date: 1963-06
    thread: civil-rights-organizations
    c: McDew resigns as SNCC's chairman, for his health. An emergency meeting of the coordinating committee elects Lewis to finish the term. Check the date.
    n: 'Lewis to Emily Stoper, 1967, [interview](https://www.crmvet.org/nars/lewisj.htm), in [[w.stoper-student-nonviolent-coordinating-committee]]. [[w.lewis-walking-with-the-wind]]; [[w.carson-in-struggle]]. SNCC Digital Gateway (K–J Cong. II.L). Names: Lewis, McDew.'
    tags: [name:lewis-john, name:mcdew-charles]
  - id: cal.1963-06-03.court
    when: June 3
    date: '1963-06-03'
    thread: court
    also: [desegregation-schools]
    c: '*Goss v. Board of Education*, [373 U.S. 683](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373683/usrep373683.pdf). Knoxville''s transfer plan, letting a pupil leave a school where his race is in the minority, struck down. Clark for a unanimous Court.'
    n: '[[w.powe-warren-court-and-american]].'
  - id: cal.1963-06-04.civil-rights-the-executive
    when: June 4
    date: '1963-06-04'
    thread: civil-rights-the-executive
    c: 'Statement: apprenticeship programs to admit without regard to race; federal construction reviewed for discrimination in hiring; an order to come extending the equal employment committee to federally aided building.'
    n: '[Statement by the President on Equal Employment Opportunity in Federal Apprenticeship and Construction Programs](https://www.presidency.ucsb.edu/documents/statement-the-president-equal-employment-opportunity-federal-apprenticeship-and) (June 4, 1963). [[w.graham-civil-rights-era]]; [[w.sugrue-affirmative-action-from-below]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Wirtz.'
    tags: [name:kennedy-john-f, name:wirtz-w-willard]
  - id: cal.1963-06-05.transportation
    when: June 5–14
    date: '1963-06-05'
    thread: transportation
    c: 'Air Force Academy commencement, Colorado Springs: a program with industry for the prototype of a commercial supersonic transport, faster than Mach 2, by the end of the decade; the Vice President''s committee had recommended it. To Congress, June 14: development could cost $1 billion over six years; the makers to pay at least 25 percent, the airlines royalties; the government''s share not over $750 million.'
    n: '[Remarks in Colorado Springs to the Graduating Class of the U.S. Air Force Academy](https://www.presidency.ucsb.edu/documents/remarks-colorado-springs-the-graduating-class-the-us-air-force-academy) (June 5, 1963); [Letter to the President of the Senate and to the Speaker of the House on Development of a Civil Supersonic Air Transport](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-development-civil-supersonic-air) (June 14, 1963). [[w.horwitch-clipped-wings]]. Names: Johnson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1963-06-05.middle-east
    when: June 5–7
    date: '1963-06-05'
    thread: middle-east
    c: 'Iran. Khomeini arrested at Qom; riots in Tehran and the provincial cities, June 5; martial law; the troops fire into the crowds. About 200 killed by the State Department''s count; about 125 by the Shah''s. Talbot to Rusk, June 6: the Shia hierarchy "has in essence launched a civil war against the regime," against land reform and women''s rights; no evidence of a foreign hand.'
    n: 'FRUS 1961–63, XVIII, docs. [263](https://history.state.gov/historicaldocuments/frus1961-63v18/d263), [279](https://history.state.gov/historicaldocuments/frus1961-63v18/d279). [[w.abrahamian-iran-between-two-revolutions]]; [[w.moin-khomeini]]; [[w.milani-shah]]. Names: Khomeini, Pahlavi, Talbot, Rusk.'
    tags: [name:khomeini-ruhollah, name:pahlavi-mohammed-reza, name:talbot-phillips, name:rusk-dean]
  - id: cal.1963-06-09.civil-rights-the-executive-us
    when: June 9
    date: '1963-06-09'
    thread: civil-rights-the-executive
    also: [states-and-cities]
    c: 'Kennedy to the U.S. Conference of Mayors at Honolulu: race relations "a national problem." Five steps for every city: a biracial human relations committee; ordinances and practices in accord with the Court''s rulings; Negroes hired at every level of city government; equal opportunity ordinances on jobs, housing and public accommodations; a summer drive against school dropouts.'
    n: '[Address in Honolulu Before the United States Conference of Mayors](https://www.presidency.ucsb.edu/documents/address-honolulu-before-the-united-states-conference-mayors) (June 9, 1963). See [[cal.1963-06-04.civil-rights-the-executive]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-10.program
    when: June 10
    date: '1963-06-10'
    thread: women
    c: Equal Pay Act signed, [77 Stat. 56](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg56.pdf). Equal pay for equal work regardless of sex, under the Fair Labor Standards Act; in force in a year. Women's wages, 60 percent of men's.
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Equal Pay Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-equal-pay-act) (June 10, 1963). [[w.harrison-on-account-of-sex]]; [[w.zelman-women-work-and-national]]; [[w.kessler-harris-in-pursuit-of-equity]]; [[w.cobble-other-womens-movement]]; [[w.peterson-restless]]. See [[cal.1961-12-14.program]]. Names: Peterson, Green.'
    tags: [name:kennedy-john-f, name:peterson-esther, name:green-edith]
  - id: cal.1963-06-10.testing
    when: June 10
    date: '1963-06-10'
    thread: testing
    c: American University. "Not a Pax Americana enforced on the world by American weapons of war." Talks in Moscow on a test ban, agreed with Khrushchev and Macmillan; no American tests in the atmosphere while others hold off.
    n: '[Commencement Address at American University in Washington](https://www.presidency.ucsb.edu/documents/commencement-address-american-university-washington) (June 10, 1963). Recording (K–J Adm. II.I). Treaty (K–J Cong. II.J.2). [FRUS 1961–63, VII](https://history.state.gov/historicaldocuments/frus1961-63v07). [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.cousins-improbable-triumvirate]]; [[w.beschloss-crisis-years]]; [[w.oliver-kennedy-macmillan-and-the]]; [[w.mastny-1963-nuclear-test-ban]]; [[w.sachs-to-move-the-world]]; [[w.terchek-making-of-the-test]]; [[w.abramson-spanning-the-century]]; [[w.bundy-danger-and-survival]]; [[w.sorensen-kennedy]]. See [[cal.1962-12-19.testing]]; [[cal.1963-04-24.testing]]; [[cal.1963-05-08.testing]]. Names: Khrushchev, Macmillan.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:macmillan-harold]
  - id: cal.1963-06-11.alabama
    when: June 11
    date: '1963-06-11'
    thread: alabama
    also: [desegregation-schools]
    c: The schoolhouse door. Wallace bars Katzenbach at Foster Auditorium, Tuscaloosa. The Alabama Guard federalized; that afternoon Wallace stands aside. Vivian Malone and James Hood registered.
    n: '[Proclamation No. 3542](https://www.presidency.ucsb.edu/documents/proclamation-3542-unlawful-obstructions-justice-and-combinations-the-state-alabama). [Exec. Order No. 11,111](https://www.presidency.ucsb.edu/documents/executive-order-11111-providing-assistance-for-the-removal-obstructions-justice-and), [28 Fed. Reg. 5709](https://www.govinfo.gov/app/details/FR-1963-06-12) (1963). [Telegram to Governor Wallace Concerning the Admission of Negro Students to the University of Alabama](https://www.presidency.ucsb.edu/documents/telegram-governor-wallace-concerning-the-admission-negro-students-the-university-alabama) (June 10, 1963). [[w.crisis]]. Wallace, University of Alabama (K–J Cong. II.K). [[w.carter-politics-of-rage-1995]]; [[w.clark-schoolhouse-door]]; [[w.lesher-george-wallace]]; [[w.katzenbach-some-of-it-was]]; [[w.schlesinger-robert-kennedy-and-his]]. Names: Wallace, Katzenbach, Malone, Hood.'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:katzenbach-nicholas, name:malone-vivian, name:hood-james-a]
  - id: cal.1963-06-11.civil-rights-bill
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: Address on civil rights, 8 p.m., partly extemporized. "A moral issue," "as old as the scriptures and as clear as the American Constitution." Congress to be asked for a law.
    n: '[Radio and Television Report to the American People on Civil Rights](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-civil-rights) (June 11, 1963). Address on civil rights (K–J Adm. II.I). [[w.berman-bill-becomes-a-law]]; [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.mann-walls-of-jericho]]; [[w.civil-rights-act-of]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.kotz-judgment-days]]; [[w.levingston-kennedy-and-king]]; [[w.rosenberg-kennedy-johnson-and-the]], "The Bill and the March"; [[w.sorensen-kennedy]]; [[w.robert-kennedy-in-his]]; [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1963-06-11.alabama]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-11.vietnam
    when: June 11
    date: '1963-06-11'
    thread: vietnam
    c: Thích Quảng Đức burns himself to death at a Saigon intersection, ringed by monks. Browne's photograph.
    n: 'FRUS 1961–63, III, docs. [163](https://history.state.gov/historicaldocuments/frus1961-63v03/d163), [164](https://history.state.gov/historicaldocuments/frus1961-63v03/d164). [[w.browne-new-face-of-war]]; [[w.browne-muddy-boots-and-red]]; [[w.prochnau-once-upon-a-distant]]; [[w.king-they-who-burned-themselves]]; [[w.biggs-dying-without-killing]]. See [[cal.1963-05-08.vietnam]]. Names: Thích Quảng Đức, Browne.'
    tags: [name:thich-quang-duc, name:browne-malcolm-w]
  - id: cal.1963-06-11.specials
    when: June 11
    date: '1963-06-11'
    thread: specials
    c: California 23d, special. Del Clawson (R) takes Clyde Doyle's seat, 53.2 to 35.4 over Carley Porter (D), four other Democrats running. Swing 24.2 to R.
    n: '[Cal. *Statement of Vote*, Nov. 3, 1964, p. 28](https://archive.org/details/castatem196264cali/page/n177). See [[cal.1961-04-04.states-and-cities]]. Names: Clawson, Doyle, Porter.'
    tags: [special:1963-06-11-h-CA-23, name:clawson-delwin-m, name:doyle-clyde-g, name:porter-carley-v]
  - id: cal.1963-06-11.state-and-city-finance-nv
    when: June 11
    date: '1963-06-11'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Nevada, special election on the legislature''s act raising the sales and use tax from 2 percent to 3, to take effect July 1: yes 17,506, no 34,906. The act refused.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 508](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=514). [[w.elliott-history-of-nevada]].'
    tags: [state:nv]
  - id: cal.1963-06-11.mayors-minneapolis
    when: June 11
    date: '1963-06-11'
    thread: mayors
    also: [elections-1963]
    c: Minneapolis re-elects Naftalin (DFL) over Peterson (R), mayor before him.
    n: '[Wikipedia, "P. Kenneth Peterson"](https://en.wikipedia.org/wiki/P._Kenneth_Peterson) (Check: the vote, from the city''s canvass). See [[cal.1961-06-13.mayors-minneapolis]]. Names: Naftalin, Peterson.'
    tags: [state:mn, city:minneapolis, name:naftalin-arthur, name:peterson-p-kenneth]
  - id: cal.1963-06-11.middle-east
    when: June 11
    date: '1963-06-11'
    thread: middle-east
    c: 'Security Council, Resolution 179, 10–0, the Soviet Union abstaining: an observation mission in Yemen to certify the disengagement. Observers in place by mid-July.'
    n: '[Resolution 179 (1963)](https://undocs.org/S/RES/179(1963)). FRUS 1961–63, XVIII, docs. [286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286), [295](https://history.state.gov/historicaldocuments/frus1961-63v18/d295). See [[cal.1963-04-01.middle-east]].'
  - id: cal.1963-06-12.mississippi
    when: June 12
    date: '1963-06-12'
    thread: mississippi
    c: Evers shot in his driveway in Jackson, after midnight; dies within the hour. Byron De La Beckwith, of Greenwood, arrested by the FBI, June 22. Buried at Arlington, June 19.
    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/html/0547-01.html) (Miss. 1997). [[w.evers-for-us-the-living]]; [[w.autobiography-of-medgar-evers]]; [[w.williams-medgar-evers]]; [[w.dittmer-local-people]]; [[w.nossiter-of-long-memory]]; [[w.vollers-ghosts-of-mississippi]]. See [[cal.1963-05-28.mississippi]]. Names: Evers, Beckwith.'
    tags: [name:evers-medgar, name:beckwith-byron-de-la]
  - id: cal.1963-06-12.program
    when: June 12
    date: '1963-06-12'
    thread: jobs-and-wages
    c: House rejects the area redevelopment amendments, [204–209](https://voteview.com/rollcall/RH0880036).
    n: '[Statement by the President Following Defeat of the Area Redevelopment Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-defeat-the-area-redevelopment-bill) (June 13, 1963). [[w.levitan-federal-aid-to-depressed]]. See [[cal.1961-05-01.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-13.middle-east
    when: June 13–July 1
    date: '1963-06-13'
    thread: middle-east
    c: 'Kennedy approves Hard Surface, June 13: eight F-100D fighters and a transport to Saudi Arabia, on condition that Saudi aid to the royalists end. June 14, Faisal, after Celler''s statement on the sending of Jewish servicemen, asks Washington to denounce it and bars American servicemen until it does; the movement halted June 15. June 29, the State Department: Saudi visa policy on persons of the Jewish faith unchanged, American policy one of nondiscrimination; the unit announced as a training mission. July 1, Kennedy to Faisal: the unit dispatched.'
    n: 'FRUS 1961–63, XVIII, docs. [268](https://history.state.gov/historicaldocuments/frus1961-63v18/d268), [270](https://history.state.gov/historicaldocuments/frus1961-63v18/d270) (editorial note), [272](https://history.state.gov/historicaldocuments/frus1961-63v18/d272), [286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286). [[w.hart-saudi-arabia-and-the]]; [[w.bass-support-any-friend]]. See [[cal.1963-03-01.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Celler.'
    tags: [name:kennedy-john-f, name:faisal-ibn-abd-al-aziz-al-saud, name:celler-emanuel]
  - id: cal.1963-06-16.opinion
    when: June 16
    date: '1963-06-16'
    thread: opinion
    also: [desegregation-public-places, alabama]
    c: 'Gallup, May 23–28: the Kennedy administration pushing integration too fast, 36 percent; not fast enough, 18; about right, 32. Southern whites, 62 too fast.'
    n: '[[w.gallup-poll]], III, 1823.'
  - id: cal.1963-06-17.court
    when: June 17
    date: '1963-06-17'
    thread: court
    c: '*Abington School District v. Schempp*, [374 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep374/usrep374203/usrep374203.pdf). Bible reading and the Lord''s Prayer in public schools struck down, 8–1; Clark writing, Stewart dissenting. Same day, *Sherbert v. Verner*, [374 U.S. 398](https://tile.loc.gov/storage-services/service/ll/usrep/usrep374/usrep374398/usrep374398.pdf): a Sabbatarian''s unemployment benefits; Brennan for the Court, Harlan and White dissenting.'
    n: Opinions (K–J Cong. II.J.1; Opp. II.H.1). [[w.solomon-ellerys-protest]]; [[w.dierenfield-battle-over-school-prayer]]; [[w.powe-warren-court-and-american]]. See [[cal.1962-06-25.court]].
  - id: cal.1963-06-18.desegregation-schools-boston
    when: June 18
    date: '1963-06-18'
    thread: desegregation-schools
    also: [states-and-cities]
    c: 'Boston. The Stay Out for Freedom. In June the School Committee, Hicks its chairman, had met the NAACP''s demands, read by Batson, all but two: it would not acknowledge de facto segregation or discrimination in hiring teachers. Two to three thousand junior and senior high school students out, by the organizers'' count; Freedom Schools in Roxbury.'
    n: '[[w.napier-boston-freedom-schools-as]]; [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.delmont-why-busing-failed]]. Names: Hicks, Batson.'
    tags: [state:ma, city:boston, name:hicks-louise-d, name:batson-ruth]
  - id: cal.1963-06-19.civil-rights-bill
    when: June 19
    date: '1963-06-19'
    thread: civil-rights-bill
    also: [desegregation-schools, desegregation-public-places]
    c: Civil rights message. Public accommodations; school suits by the Attorney General; a Community Relations Service; no federal funds for discrimination; in voting suits, a sixth-grade education presumed literacy. Fair employment backed, not asked. Celler's bill, H.R. 7152, June 20.
    n: '[Special Message to the Congress on Civil Rights and Job Opportunities](https://www.presidency.ucsb.edu/documents/special-message-the-congress-civil-rights-and-job-opportunities) (June 19, 1963). [[w.graham-civil-rights-era]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler.'
    tags: [name:kennedy-john-f, name:celler-emanuel]
  - id: cal.1963-06-19.cuba
    when: June 19
    date: '1963-06-19'
    thread: cuba
    c: Kennedy approves the CIA's program against Cuba, sabotage raids mounted from outside the island. The first in the dark of the moon in July.
    n: '[FRUS 1961–63, XI, doc. 348](https://history.state.gov/historicaldocuments/frus1961-63v11/d348). [S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf) (1975) (K–J Adm. II.H.3). [[w.bohning-castro-obsession]]. See [[cal.1961-11-30.cuba]]; [[cal.1963-01-08.cuba]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-19.opinion
    when: June 19
    date: '1963-06-19'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 23–28: serious racial trouble here in the next two or three years, likely 22 percent, not likely 69; in the South, 29 likely. A local interracial council, 67 for, 18 against.'
    n: '[[w.gallup-poll]], III, 1823.'
  - id: cal.1963-06-19.civil-rights-organizations
    when: June 19
    date: '1963-06-19'
    thread: civil-rights-organizations
    c: 'New York, the Carlyle. Currier, of the Taconic Foundation, gives the leaders a breakfast for corporations and foundations. A Council for United Civil Rights Leadership to divide the money: the NAACP, the Legal Defense Fund, the Urban League, CORE, SCLC, the National Council of Negro Women; SNCC later. July 2, $800,000 in hand of $1,500,000 sought. July 17, $565,000 divided, SNCC $15,000. Check.'
    n: '[[w.garrow-bearing-the-cross]]; [[w.farmer-lay-bare-the-heart]]; [[w.forman-making-of-black-revolutionaries]]; [[w.dickerson-militant-mediator]]; [[w.weiss-whitney-m-young-jr]]. Names: Currier.'
    tags: [name:currier-stephen-r]
  - id: cal.1963-06-20.testing
    when: June 20
    date: '1963-06-20'
    thread: testing
    c: Hot line. A memorandum signed at Geneva, [14 U.S.T. 825](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-14-1/lltreaties-14-1.pdf#page=837), [472 U.N.T.S. 163](https://treaties.un.org/doc/Publication/UNTS/Volume%20472/volume-472-I-6839-English.pdf), sets up a direct teletype link between Washington and Moscow.
    n: '[White House Announcement of Agreement To Link Washington and Moscow by Direct Telecommunications Facilities](https://www.presidency.ucsb.edu/documents/white-house-announcement-agreement-link-washington-and-moscow-direct-telecommunications) (June 20, 1963). See [[cal.1963-06-10.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-21.opinion
    when: June 21
    date: '1963-06-21'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, May 23–28: white parents who would object to a school where a few of the children are Negro, 10 percent outside the South, 61 in the South; where half are, 33 and 78; more than half, 53 and 86.'
    n: '[[w.gallup-poll]], III, 1824.'
  - id: cal.1963-06-21.open-housing-ca
    when: June 21
    date: '1963-06-21'
    thread: open-housing
    also: [legislatures]
    c: 'California. The Rumford Fair Housing Act, Rumford''s A.B. 1240, passes the Senate in the session''s last hours and is signed by Brown: discrimination by race, religion or national origin barred in the sale and rental of publicly assisted housing and of private dwellings of more than four units, the Fair Employment Practice Commission to enforce it. Check the day passed, the day signed, and the coverage.'
    n: 'Cal. Stats. 1963, ch. 1853 (Health & Saf. Code §§ 35700–35744) (Check). [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]; [[w.self-american-babylon]]; [[w.rarick-california-rising]]. Names: Rumford, Brown.'
    tags: [state:ca, name:rumford-william-byron, name:brown-edmund-g]
  - id: cal.1963-06-22.civil-rights-bill
    when: June 22
    date: '1963-06-22'
    thread: civil-rights-bill
    also: [king, civil-rights-organizations]
    c: Kennedy meets some thirty civil rights leaders, King, Randolph, Wilkins, Young, Farmer, and Lewis among them. He asks them to call off the march on Washington; they decline. Before it, in the Rose Garden, he tells King to drop Levison and O'Dell.
    n: '[[w.branch-parting-the-waters]]; [[w.garrow-bearing-the-cross]]; [[w.garrow-fbi-and-martin-luther]]; [[w.levingston-kennedy-and-king]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Martin Luther King, Randolph, Wilkins, Young, Farmer, Lewis, Levison, O''Dell.'
    tags: [name:kennedy-john-f, name:king-martin-luther-jr, name:randolph-a-philip, name:wilkins-roy, name:young-whitney-m-jr, name:farmer-james, name:lewis-john, name:levison-stanley-d, name:odell-jack-h]
  - id: cal.1963-06-22.civil-rights-the-executive
    when: June 22
    date: '1963-06-22'
    thread: civil-rights-the-executive
    c: 'Executive order: the equal employment committee''s reach extended to federally aided construction. Same day, letters on the Gesell committee''s first report: segregation in the communities off military bases; McNamara to report in thirty days.'
    n: '[Exec. Order No. 11,114](https://www.presidency.ucsb.edu/documents/executive-order-11114-extending-the-authority-the-presidents-committee-equal-employment), [28 Fed. Reg. 6485](https://www.govinfo.gov/app/details/FR-1963-06-25) (1963). [Letters to the Secretary of Defense and to the Chairman, Committee on Equal Opportunity in the Armed Forces](https://www.presidency.ucsb.edu/documents/letters-the-secretary-defense-and-the-chairman-committee-equal-opportunity-the-armed) (June 22, 1963). [[w.graham-civil-rights-era]]; [[w.macgregor-integration-of-the-armed]]. See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Gesell, McNamara.'
    tags: [name:kennedy-john-f, name:gesell-gerhard-a, name:mcnamara-robert-s]
  - id: cal.1963-06-23.europe-and-the-alliance
    when: June 23–July 2
    date: '1963-06-23'
    thread: europe-and-the-alliance
    also: [european-community]
    c: 'Kennedy in Europe. Cologne and Bonn, with Adenauer; Frankfurt, the Paulskirche, June 25: "Atlantic partnership"; "The United States will risk its cities to defend yours." Berlin, June 26. Ireland, June 26–29. Macmillan at Birch Grove, June 29–30: the test ban talks and the multilateral force. Rome and Naples, July 1–2.'
    n: '[Address in the Assembly Hall at the Paulskirche in Frankfurt](https://www.presidency.ucsb.edu/documents/address-the-assembly-hall-the-paulskirche-frankfurt) (June 25, 1963). [Joint Statement Following Discussions in Bonn With Chancellor Adenauer](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-bonn-with-chancellor-adenauer) (June 24, 1963). [Address Before the Irish Parliament in Dublin](https://www.presidency.ucsb.edu/documents/address-before-the-irish-parliament-dublin) (June 28, 1963). FRUS 1961–63, VII, docs. [305](https://history.state.gov/historicaldocuments/frus1961-63v07/d305), [306](https://history.state.gov/historicaldocuments/frus1961-63v07/d306). [[w.trachtenberg-constructed-peace]]; [[w.mayer-adenauer-and-kennedy]]; [[w.daum-kennedy-in-berlin]]; [[w.tubridy-jfk-in-ireland]]; [[w.macmillan-at-the-end-of]]. See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Adenauer, Macmillan.'
    tags: [name:kennedy-john-f, name:adenauer-konrad, name:macmillan-harold]
  - id: cal.1963-06-23.opinion
    when: June 23
    date: '1963-06-23'
    thread: opinion
    c: 'Gallup, May 23–28, whites: would move if Negroes came to live next door, definitely 20 percent, might 25, would not 55. If they came in great numbers, definitely 49, might 29.'
    n: '[[w.gallup-poll]], III, 1824.'
  - id: cal.1963-06-23.king-detroit
    when: June 23
    date: '1963-06-23'
    thread: king
    also: [civil-rights-organizations]
    c: 'Detroit. The Walk to Freedom, called by the Detroit Council for Human Rights of the Reverends C. L. Franklin and Albert Cleage, on the twentieth anniversary of the riot of 1943: 125,000 or more down Woodward Avenue to Cobo Hall, King, Reuther, Cavanagh and Swainson at the head. Romney, keeping the Sabbath, sends a representative. King at Cobo Hall: "And so this afternoon, I have a dream."'
    n: '[Wikipedia, "Detroit Walk to Freedom"](https://en.wikipedia.org/wiki/Detroit_Walk_to_Freedom). Recording: *The Great March to Freedom* (Gordy, 1963) (Check). [[w.dillard-faith-in-the-city]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.joseph-waiting-til-the-midnight]]; [[w.garrow-bearing-the-cross]]; [[w.branch-parting-the-waters]]. See [[cal.1963-08-28.march-on-washington]]. Names: Martin Luther King, Reuther, Cavanagh, Swainson, Romney, Franklin, Cleage.'
    tags: [state:mi, city:detroit, name:king-martin-luther-jr, name:reuther-walter, name:cavanagh-jerome-p, name:swainson-john-b, name:romney-george-w, name:franklin-c-l, name:cleage-albert-b-jr]
  - id: cal.1963-06-24.peace-corps
    when: June 24
    date: '1963-06-24'
    thread: peace-corps
    also: [europe-and-the-alliance]
    c: Bonn. Kennedy, with Lübke and Adenauer, at the signing of the charter of a German Peace Corps. Nine thousand Americans to be serving abroad by year's end.
    n: '[Remarks in Bonn at the Signing of a Charter Establishing the German Peace Corps](https://www.presidency.ucsb.edu/documents/remarks-bonn-the-signing-charter-establishing-the-german-peace-corps) (June 24, 1963). See [[cal.1963-04-10.peace-corps]]; [[cal.1963-06-23.europe-and-the-alliance]]. Names: Lübke, Adenauer.'
    tags: [name:kennedy-john-f, name:lubke-heinrich, name:adenauer-konrad]
  - id: cal.1963-06-26.berlin-and-vienna
    when: June 26
    date: '1963-06-26'
    thread: berlin-and-vienna
    c: 'Kennedy in West Berlin, with Brandt and Adenauer. The wall seen from a platform. Rudolph Wilde Platz: "Ich bin ein Berliner"; "Lass'' sie nach Berlin kommen." The Free University the same afternoon.'
    n: '[Remarks in the Rudolph Wilde Platz, Berlin](https://www.presidency.ucsb.edu/documents/remarks-the-rudolph-wilde-platz-berlin) (June 26, 1963). [Address at the Free University of Berlin](https://www.presidency.ucsb.edu/documents/address-the-free-university-berlin) (June 26, 1963). Remarks, Rudolph Wilde Platz (K–J Adm. II.I). [[w.daum-kennedy-in-berlin]]. See [[cal.1963-06-23.europe-and-the-alliance]]. [[w.brandt-begegnungen-und-einsichten]]. See [[cal.1961-08-13.berlin-and-vienna]]. Names: Brandt, Adenauer.'
    tags: [name:kennedy-john-f, name:brandt-willy, name:adenauer-konrad]
  - id: cal.1963-06-26.opinion
    when: June 26
    date: '1963-06-26'
    thread: opinion
    c: 'Gallup, May 23–28: some group treated unfairly by the Kennedy administration, 20 percent; the Negroes named by 5 percent of all, the whites by 4.'
    n: '[[w.gallup-poll]], III, 1825.'
  - id: cal.1963-06-26.antisubversion-nc
    when: June 26
    date: '1963-06-26'
    thread: antisubversion
    also: [students]
    c: 'North Carolina. In the session''s last hours, without hearings, the General Assembly passes the Act to Regulate Visiting Speakers: no college or university receiving State funds to let its facilities be used for speaking by a known member of the Communist Party, one known to advocate overthrow of the federal or State constitution, or one who has pleaded the Fifth Amendment on Communist or subversive connections. Three readings in the House in four minutes. The governor has no veto; Sanford opposed the bill.'
    n: '[N.C. Sess. Laws 1963, ch. 1207, pp. 1687–88](https://archive.org/details/sessionlawsresol1963nort/page/n1738) (H.B. 1395, ratified June 26, 1963). [[w.billingsley-communists-on-campus]]; [[w.link-william-friday]]. Names: Sanford.'
    tags: [state:nc, name:sanford-terry]
  - id: cal.1963-06-26.desegregation-public-places-ky
    when: June 26
    date: '1963-06-26'
    thread: desegregation-public-places
    c: 'Kentucky. Combs''s executive order, the Fair Services Code: no discrimination by race in the State''s public accommodations, and none in State contracts (Check: the date). Nunn, the Republican nominee for governor, calls it "rule by executive decree."'
    n: 'Check: the order and its date. [[w.harrison-new-history-of-kentucky]], 390; [[w.pearce-divide-and-dissent]]. Names: Combs, Nunn.'
    tags: [state:ky, name:combs-bert-t, name:nunn-louie-b]
  - id: cal.1963-06-27.vietnam
    when: June 27
    date: '1963-06-27'
    thread: vietnam
    c: Lodge named ambassador to Saigon, to succeed Nolting.
    n: '[FRUS 1961–63, III, doc. 187](https://history.state.gov/historicaldocuments/frus1961-63v03/d187). [[w.blair-lodge-in-vietnam]]; [[w.nichter-last-brahmin]]; [[w.lodge-storm-has-many-eyes]]; [[w.nolting-from-trust-to-tragedy]]. See [[cal.1963-05-08.vietnam]]. Names: Lodge, Nolting.'
    tags: [name:lodge-henry-cabot, name:nolting-frederick-e-jr, name:kennedy-john-f]
