    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, May 23–28, the tickets: Kennedy–Johnson 56, Rockefeller–Goldwater 38, undecided 6. South: Rockefeller–Goldwater 47, Kennedy–Johnson 45.'
    n: '[[w.gallup-poll]], III, 1826. Names: Johnson, Nelson Rockefeller, Goldwater.'
