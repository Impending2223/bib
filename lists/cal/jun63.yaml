# Cal. XXXII June 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXII
entries:
  - id: cal.1963-06-03.court
    when: June 3
    date: '1963-06-03'
    thread: court
    c: '*Goss v. Board of Education*, [373 U.S. 683](https://tile.loc.gov/storage-services/service/ll/usrep/usrep373/usrep373683/usrep373683.pdf). Knoxville''s transfer plan, letting a pupil leave a school where his race is in the minority, struck down. Clark for a unanimous Court.'
    n: 'Powe (see [[cal.1963-05-20.court]]). Names: Clark (K–J Cong. III.G).'
    tags: [name:clark-tom-c]
  - id: cal.1963-06-04.civil-rights-the-executive
    when: June 4
    date: '1963-06-04'
    thread: civil-rights-the-executive
    c: 'Statement: apprenticeship programs to admit without regard to race; federal construction reviewed for discrimination in hiring; an order to come extending the equal employment committee to federally aided building.'
    n: '[Statement by the President on Equal Employment Opportunity in Federal Apprenticeship and Construction Programs](https://www.presidency.ucsb.edu/documents/statement-the-president-equal-employment-opportunity-federal-apprenticeship-and) (June 4, 1963). Graham, *The Civil Rights Era* (K–J Adm. II.C). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Wirtz (K–J Adm. III.G).'
    tags: [name:kennedy-john-f, name:wirtz-w-willard]
  - id: cal.1963-06-10.program
    when: June 10
    date: '1963-06-10'
    thread: program
    c: Equal Pay Act signed. Equal pay for equal work regardless of sex, under the Fair Labor Standards Act; in force in a year. Women's wages, 60 percent of men's.
    n: '[Pub. L. No. 88-38, 77 Stat. 56](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg56.pdf) (K–J Cong. II.J.2). [Remarks Upon Signing the Equal Pay Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-equal-pay-act) (June 10, 1963). Harrison, *On Account of Sex* (K–J Adm. II.B). Peterson, *Restless* (K–J Adm. II.G.5). See [[cal.1961-12-14.program]]. Names: Peterson (K–J Adm. III.G); Green (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:peterson-esther, name:green-edith]
  - id: cal.1963-06-10.testing
    when: June 10
    date: '1963-06-10'
    thread: testing
    c: 'American University. "Not a Pax Americana enforced on the world by American weapons of war." Talks in Moscow on a test ban, agreed with Khrushchev and Macmillan; no American tests in the atmosphere while others hold off.'
    n: '[Commencement Address at American University in Washington](https://www.presidency.ucsb.edu/documents/commencement-address-american-university-washington) (June 10, 1963). Recording (K–J Adm. II.I). Treaty (K–J Cong. II.J.2). [FRUS vol. 7](https://history.state.gov/historicaldocuments/frus1961-63v07). Seaborg, *Kennedy, Khrushchev, and the Test Ban*; Beschloss, *The Crisis Years* (K–J Adm. II.D). Abramson, *Spanning the Century* (K–J Adm. II.G.4). Bundy, *Danger and Survival*; Sorensen, *Kennedy* (K–J Adm. II.G.2). Jeffrey D. Sachs, *To Move the World: JFK''s Quest for Peace* (2013). See [[cal.1962-12-19.testing]]; [[cal.1963-04-24.testing]]; [[cal.1963-05-08.testing]]. Names: Khrushchev, Macmillan (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:macmillan-harold]
  - id: cal.1963-06-11.alabama
    when: June 11
    date: '1963-06-11'
    thread: alabama
    c: 'The schoolhouse door. Wallace bars Katzenbach at Foster Auditorium, Tuscaloosa. The Alabama Guard federalized; that afternoon Wallace stands aside. Vivian Malone and James Hood registered.'
    n: '[Proclamation No. 3542](https://www.presidency.ucsb.edu/documents/proclamation-3542-unlawful-obstructions-justice-and-combinations-the-state-alabama). [Exec. Order No. 11,111](https://www.presidency.ucsb.edu/documents/executive-order-11111-providing-assistance-for-the-removal-obstructions-justice-and), [28 Fed. Reg. 5709](https://www.govinfo.gov/app/details/FR-1963-06-12) (1963). [Telegram to Governor Wallace Concerning the Admission of Negro Students to the University of Alabama](https://www.presidency.ucsb.edu/documents/telegram-governor-wallace-concerning-the-admission-negro-students-the-university-alabama) (June 10, 1963). *Crisis* (K–J Adm. I.B). Wallace, University of Alabama (K–J Cong. II.K). Carter, *The Politics of Rage* (K–J Cong. II.H). Katzenbach, *Some of It Was Fun* (K–J Adm. II.G.6). E. Culpepper Clark, *The Schoolhouse Door: Segregation''s Last Stand at the University of Alabama* (1993). Names: Wallace (K–J Cong. III.F); Katzenbach (K–J Adm. III.I); Malone, Hood (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:wallace-george-c, name:katzenbach-nicholas, name:malone-vivian, name:hood-james-a]
  - id: cal.1963-06-11.civil-rights-bill
    when: June 11
    date: '1963-06-11'
    thread: civil-rights-bill
    c: 'Address on civil rights, 8 p.m., partly extemporized. "A moral issue," "as old as the scriptures and as clear as the American Constitution." Congress to be asked for a law.'
    n: '[Radio and Television Report to the American People on Civil Rights](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-civil-rights) (June 11, 1963). Address on civil rights (K–J Adm. II.I). Berman, *A Bill Becomes a Law*; Whalen, *The Longest Debate*; Loevy, *To End All Segregation*; Mann, *The Walls of Jericho*; Risen, *The Bill of the Century*; Purdum, *An Idea Whose Time Has Come* (K–J Cong. II.C). Brauer, *Second Reconstruction*; Bryant, *The Bystander*; Kotz, *Judgment Days* (K–J Adm. II.C). Sorensen, *Kennedy* (K–J Adm. II.G.2). See [[cal.1963-06-11.alabama]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-11.vietnam
    when: June 11
    date: '1963-06-11'
    thread: vietnam
    c: Thich Quang Duc burns himself to death at a Saigon intersection, ringed by monks. Browne's photograph.
    n: 'FRUS 1961–63, III, docs. [163](https://history.state.gov/historicaldocuments/frus1961-63v03/d163), [164](https://history.state.gov/historicaldocuments/frus1961-63v03/d164). Browne, *The New Face of War* (Viet. I.C). See [[cal.1963-05-08.vietnam]]. Names: Thich Quang Duc (Viet. III.G); Browne (Viet. III.F).'
    tags: [name:thich-quang-duc, name:browne-malcolm-w]
  - id: cal.1963-06-11.specials
    when: June 11
    date: '1963-06-11'
    thread: specials
    c: California 23d, special. Del Clawson (R) takes Clyde Doyle's seat, 53.2 to 35.4 over Carley Porter (D), four other Democrats running. Swing 24.2 to R.
    n: '[Cal. *Statement of Vote*, Nov. 3, 1964, p. 28](https://archive.org/details/castatem196264cali/page/n177). See [[cal.1961-04-04.states-and-cities]]. Names: Porter (K–J Cong. III.K).'
    tags: [special:1963-06-11-h-CA-23, name:clawson-delwin-m, name:doyle-clyde-g, name:porter-carley-v]
  - id: cal.1963-06-12.mississippi
    when: June 12
    date: '1963-06-12'
    thread: mississippi
    c: Evers shot in his driveway in Jackson, after midnight; dies within the hour. Byron De La Beckwith, of Greenwood, arrested by the FBI, June 22. Buried at Arlington, June 19.
    n: '*Beckwith v. State*, [707 So. 2d 547](https://static.case.law/so2d/707/html/0547-01.html) (Miss. 1997). Myrlie B. Evers with William Peters, *For Us, the Living* (1967). Adam Nossiter, *Of Long Memory: Mississippi and the Murder of Medgar Evers* (1994). Dittmer, *Local People* (K–J Cong. II.F). See [[cal.1963-05-28.mississippi]]. Names: Evers (K–J Cong. III.H); Beckwith (K–J Cong. III.K).'
    tags: [name:evers-medgar, name:beckwith-byron-de-la]
  - id: cal.1963-06-12.program
    when: June 12
    date: '1963-06-12'
    thread: program
    c: House rejects the area redevelopment amendments, [204–209](https://voteview.com/rollcall/RH0880036).
    n: '[Statement by the President Following Defeat of the Area Redevelopment Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-defeat-the-area-redevelopment-bill) (June 13, 1963). Levitan, *Federal Aid to Depressed Areas* (K–J Cong. II.B). See [[cal.1961-05-01.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-17.court
    when: June 17
    date: '1963-06-17'
    thread: court
    c: '*Abington School District v. Schempp*, [374 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep374/usrep374203/usrep374203.pdf). Bible reading and the Lord''s Prayer in public schools struck down, 8–1; Clark writing, Stewart dissenting. Same day, *Sherbert v. Verner*, [374 U.S. 398](https://tile.loc.gov/storage-services/service/ll/usrep/usrep374/usrep374398/usrep374398.pdf): a Sabbatarian''s unemployment benefits; Brennan for the Court, Harlan and White dissenting.'
    n: 'Opinions (K–J Cong. II.J.1; Opp. II.H.1). Powe (see [[cal.1963-05-20.court]]). See [[cal.1962-06-25.court]]. Names: Clark, Stewart, Brennan, Harlan, White (K–J Cong. III.G).'
    tags: [name:clark-tom-c, name:stewart-potter, name:brennan-william-j-jr, name:harlan-john-marshall, name:white-byron-r]
  - id: cal.1963-06-19.civil-rights-bill
    when: June 19
    date: '1963-06-19'
    thread: civil-rights-bill
    c: 'Civil rights message. Public accommodations; school suits by the Attorney General; a Community Relations Service; no federal funds for discrimination; in voting suits, a sixth-grade education presumed literacy. Fair employment backed, not asked. Celler''s bill, H.R. 7152, June 20.'
    n: '[Special Message to the Congress on Civil Rights and Job Opportunities](https://www.presidency.ucsb.edu/documents/special-message-the-congress-civil-rights-and-job-opportunities) (June 19, 1963). See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:celler-emanuel]
  - id: cal.1963-06-19.cuba
    when: June 19
    date: '1963-06-19'
    thread: cuba
    c: Kennedy approves the CIA's program against Cuba, sabotage raids mounted from outside the island. The first in the dark of the moon in July.
    n: '[FRUS 1961–63, XI, doc. 348](https://history.state.gov/historicaldocuments/frus1961-63v11/d348). See [[cal.1961-11-30.cuba]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-20.testing
    when: June 20
    date: '1963-06-20'
    thread: testing
    c: Hot line. A memorandum signed at Geneva sets up a direct teletype link between Washington and Moscow.
    n: '[White House Announcement of Agreement To Link Washington and Moscow by Direct Telecommunications Facilities](https://www.presidency.ucsb.edu/documents/white-house-announcement-agreement-link-washington-and-moscow-direct-telecommunications) (June 20, 1963). See [[cal.1963-06-10.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-06-22.civil-rights-bill
    when: June 22
    date: '1963-06-22'
    thread: civil-rights-bill
    c: 'Kennedy meets some thirty civil rights leaders, King, Randolph, Wilkins, Young, Farmer, and Lewis among them. He asks them to call off the march on Washington; they decline. Before it, in the Rose Garden, he tells King to drop Levison and O''Dell.'
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Garrow, *Bearing the Cross* (K–J Cong. II.F). Garrow, *The FBI and Martin Luther King, Jr.* (K–J Adm. II.C). See [[cal.1963-06-11.civil-rights-bill]]. Names: King, Randolph, Wilkins, Young, Farmer, Lewis (K–J Cong. III.H); Levison, O''Dell (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:king-martin-luther-jr, name:randolph-a-philip, name:wilkins-roy, name:young-whitney-m-jr, name:farmer-james, name:lewis-john, name:levison-stanley-d, name:odell-jack-h]
  - id: cal.1963-06-22.civil-rights-the-executive
    when: June 22
    date: '1963-06-22'
    thread: civil-rights-the-executive
    c: 'Executive order: the equal employment committee''s reach extended to federally aided construction. Same day, letters on the Gesell committee''s first report: segregation in the communities off military bases; McNamara to report in thirty days.'
    n: '[Exec. Order No. 11,114](https://www.presidency.ucsb.edu/documents/executive-order-11114-extending-the-authority-the-presidents-committee-equal-employment), [28 Fed. Reg. 6485](https://www.govinfo.gov/app/details/FR-1963-06-25) (1963). [Letters to the Secretary of Defense and to the Chairman, Committee on Equal Opportunity in the Armed Forces](https://www.presidency.ucsb.edu/documents/letters-the-secretary-defense-and-the-chairman-committee-equal-opportunity-the-armed) (June 22, 1963). Graham, *The Civil Rights Era* (K–J Adm. II.C). Morris J. MacGregor Jr., *Integration of the Armed Forces, 1940–1965* (1981). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Gesell (Wg. III.E); McNamara (K–J Adm. III.F).'
    tags: [name:kennedy-john-f, name:gesell-gerhard-a, name:mcnamara-robert-s]
  - id: cal.1963-06-23.europe-and-the-alliance
    when: June 23–July 2
    date: '1963-06-23'
    thread: europe-and-the-alliance
    c: 'Kennedy in Europe. Cologne and Bonn, with Adenauer; Frankfurt, the Paulskirche, June 25: "Atlantic partnership"; "The United States will risk its cities to defend yours." Berlin, June 26. Ireland, June 26–29. Macmillan at Birch Grove, June 29–30: the test ban talks and the multilateral force. Rome and Naples, July 1–2.'
    n: '[Address in the Assembly Hall at the Paulskirche in Frankfurt](https://www.presidency.ucsb.edu/documents/address-the-assembly-hall-the-paulskirche-frankfurt) (June 25, 1963). [Joint Statement Following Discussions in Bonn With Chancellor Adenauer](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-bonn-with-chancellor-adenauer) (June 24, 1963). [Address Before the Irish Parliament in Dublin](https://www.presidency.ucsb.edu/documents/address-before-the-irish-parliament-dublin) (June 28, 1963). FRUS 1961–63, VII, docs. [305](https://history.state.gov/historicaldocuments/frus1961-63v07/d305), [306](https://history.state.gov/historicaldocuments/frus1961-63v07/d306). Trachtenberg, *A Constructed Peace* (K–J Adm. II.D). Macmillan, *At the End of the Day* (K–J Adm. II.G.7). Andreas W. Daum, *Kennedy in Berlin* (2008). See [[cal.1962-12-18.europe-and-the-alliance]]. Names: Adenauer, Macmillan (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:adenauer-konrad, name:macmillan-harold]
  - id: cal.1963-06-26.berlin-and-vienna
    when: June 26
    date: '1963-06-26'
    thread: berlin-and-vienna
    c: 'Kennedy in West Berlin, with Brandt and Adenauer. The wall seen from a platform. Rudolph Wilde Platz: "Ich bin ein Berliner"; "Lass'' sie nach Berlin kommen." The Free University the same afternoon.'
    n: '[Remarks in the Rudolph Wilde Platz, Berlin](https://www.presidency.ucsb.edu/documents/remarks-the-rudolph-wilde-platz-berlin) (June 26, 1963). [Address at the Free University of Berlin](https://www.presidency.ucsb.edu/documents/address-the-free-university-berlin) (June 26, 1963). Remarks, Rudolph Wilde Platz (K–J Adm. II.I). Daum (see [[cal.1963-06-23.europe-and-the-alliance]]). Brandt, *Begegnungen und Einsichten* (K–J Adm. II.G.7). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Brandt, Adenauer (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:brandt-willy, name:adenauer-konrad]
  - id: cal.1963-06-27.vietnam
    when: June 27
    date: '1963-06-27'
    thread: vietnam
    c: Lodge named ambassador to Saigon, to succeed Nolting.
    n: '[FRUS 1961–63, III, doc. 187](https://history.state.gov/historicaldocuments/frus1961-63v03/d187). See [[cal.1963-05-08.vietnam]]. Names: Lodge, Nolting (K–J Adm. III.E; Viet. III.C).'
    tags: [name:lodge-henry-cabot, name:nolting-frederick-e-jr, name:kennedy-john-f]
