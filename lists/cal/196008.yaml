    when: Aug. 10
    date: '1960-08-10'
    thread: china-leadership
    also: [trade]
    c: 'The Center''s urgent directive on a Party-wide campaign of foreign-trade buying and exports: a three-man group under Zhou Enlai with Li Fuchun and Li Xiannian forms a foreign-trade command with full power over buying, exports and shipping of the whole country and strict control of imports; no new import this year without the group''s approval; the next year''s foreign-trade plan its own.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 339 (Aug. 10, 1960); [[w.dikotter-maos-great-famine]], 108 n.1 (Zhou Enlai, Li Fuchun and Li Xiannian put in charge of foreign trade almost at once after the recall of the Soviet experts in July 1960); [[w.jian-zhou-enlai]], 455 (Aug. 10, the Center''s two instructions, one for foreign trade and farming); [[w.jian-zhou-enlai]], 459 (Beidaihe, August 1960: a three-person foreign trade command, Zhou, Li Fuchun and Li Xiannian, under Zhou; Zhou proposes shifting trade from the Soviet bloc to the West and Japan); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 512–515 (the directive in full, Aug. 10, 1960: in seven months foreign-trade buying and exports far behind and imports ahead, a great deficit in foreign exchange; to July 25 export buying 43.3 percent of the year''s target, exports 38 percent; printed from the Center''s document). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 512–515). To check: Jin Chongji, ed., Zhou Enlai zhuan, 1398 (cited by [[w.dikotter-maos-great-famine]], 108 n.1). Names: Zhou Enlai, Li Fuchun, Li Xiannian.'
