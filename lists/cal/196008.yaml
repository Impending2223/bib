    c: 'Zhou Enlai receives Chervonenko, who hands over two letters of the Soviet Central Committee: its reply to the Chinese delegation''s statement handed out at Bucharest, and a proposal that the two parties confer before the Moscow meeting of November 1960. Chervonenko: the aim is to settle the differences, on the basis of the two parties'' unity. Zhou agrees with the spirit, but unity must rest on Marxism–Leninism, the Moscow Declaration of 1957 and proletarian internationalism.'
