  - id: cal.1960-08-10.china-leadership-2
    when: Aug. 10
    date: '1960-08-10'
    time: 1960-08-10T03:00Z
    place: beidaihe
    thread: china-leadership
    also: [soviet-union]
    c: 'Beidaihe, 11 a.m. The work conference''s last plenary session; Mao speaks. Hồ Chí Minh''s peacemaking "basically" welcome, his order of steps (the two parties, a preparatory committee, all the parties) the best of it. Ninety percent good people. At home: grain, autumn sowing wide and thin as well as close, come what may ("the mother marries when she will"), all rests on China.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 10, 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 339–343 (Mao''s closing words: the Sino-Soviet matter neither large nor small; 90 percent of Soviet people and experts good, to be seen off well; hold out ten years; then Deng (a year to catch breath, 2 billion rubles of exports next year, six regional bureaus of the Center) and Liu Shaoqi (revisionism a stage of Leninism''s growth)); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 492 (Aug. 10, 1960; Liu presides at the plenary session and speaks, summing up: the capital construction line compressed, agriculture put first for some years at least and industry to serve it; cadres'' labor, education joined to labor and a small gap between top and bottom pay to be kept up and handed down); [[w.yang-shangkun-riji]], I, 533 (Aug. 10, 1960; 11 a.m. to 3:30 p.m.; the conference ends; Mao speaks); [[w.deng-xiaoping-nianpu-1904]], III, 1570 (Aug. 10, 1960; Deng at the closing plenary: a year of difficulty, grain above all; no Party congresses in the provinces this year, as the local comrades wish; the Center''s strength on the international struggle, the localities'' on agriculture, industry, the market, the three antis; regional bureaus of the Center 中央局 set up, six strategic regions); [[w.mao-zedong-zhuan]], V, ch. 66 n.48 (Aug. 10: Mao''s last speech, an hour: 90 percent of the people good, Soviet people included; on the Soviet side hold out; at home, grain first, the field management, the autumn harvest and sowing; Deng Xiaoping announces his rest; at the close Deng Xiaoping announces that Mao is to stop work for a time, Liu Shaoqi presiding, Mao to look over only the reply to the CPSU''s notice; Mao agrees and asks to see fewer papers; Kang Sheng asks when Mao will read the added notes to the fourth volume of the *Selected Works*, Peng Zhen and Deng: no need). [[w.peng-zhen-nianpu-1902]], IV, 49–50 (Aug. 10, 1960, morning; Peng Zhen at the plenary, Mao presiding; Liu Shaoqi''s summing-up: capital construction cut, agriculture''s front line strengthened, industry, but for the advanced, to serve agriculture; Mao speaks, the conference ends); [[w.zhu-de-nianpu-xinbian]], III, 1779 (Aug. 10, 1960; Zhu De 朱德 speaks to the plenary session). Made public: 1996. To check: Liu Shaoqi 刘少奇 and others, remarks at the Beidaihe Central Work Conference 北戴河中央工作会议, Aug. 10, 1960 (record 讲话记录): Deng Xiaoping''s announcement that Mao will rest, with Mao, Kang Sheng and Peng Zhen replying (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.48). Names: Mao Zedong, Hồ Chí Minh.'
