  - id: cal.1960-08-10.china-leadership-4
    when: Aug. 10
    date: '1960-08-10'
    thread: china-leadership
    also: [farm, china]
    c: 'The Center issues the directive "Everyone in the Party to farm, to farm grain." Grain output targets set too high, harvests overestimated, consumption badly arranged and management weak left a tight supply in 1958 and 1959 between harvests; in 1960 after the wheat harvest, buying slow, stocks falling. Eight points: labor to farming and grain; farm water works cut from 70 million laborers to 10 million that winter and spring, continuing works only; autumn crops; cotton and oil crops; all trades to put farming first; grain to be well used; grain shipping first among transport; bureaucracy and feasting ended.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 338–39 (Aug. 10, 1960); [[w.jianguo-yilai-mao-zedong]], XV, 314 (Aug. 1960; Mao''s 毛泽东 note on the draft adds a sentence: the "three antis" to be finished, in the slack season, not in farming time; the directive issued Aug. 10 carries it at p. 8, line 10 of the draft, 314 n.2); [[w.jian-zhou-enlai]], 455 (Aug. 10, the Center''s two instructions, one for foreign trade and farming); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 516–526 (the directive in full, Aug. 10, 1960: agriculture the base of the economy, grain the base of the base; printed from the Center''s document). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 516–526). Names: Zhou Enlai.'
    src:
      c: 90e23943
      rows:
