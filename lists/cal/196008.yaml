    when: Aug. 10
    date: '1960-08-10'
    thread: republican-party
    also: [voting-rights, elections-1960]
    c: 'Lefkowitz, New York''s attorney general, in a statement of the State Republican Party: the Democrats "talked big about a Fair Employment Practices Act," and with the chance to bar discrimination in government contracts "brought out their biggest guns to kill the measure."'
    n: '[[w.gifford-center-cannot-hold]], 79–80. To check: New York State Republican Party, press release, Aug. 10, 1960, Series 320, Box 445, "Lefkowitz, Louis J.," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 80 n.74). See [[cal.1960-08-09.voting-rights]]. Names: Lefkowitz.'
