    c: 'At the Swiss Ambassador''s national day reception, Zhou Enlai says China will live in peace with all states and keep world peace, and proposes that the states of Asia and the Pacific coast, the United States included, sign a nonaggression peace pact and make the whole region free of nuclear weapons: a long-term aim, to be worked for.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 337 (Aug. 1, 1960); [[w.zhou-enlai-waijiao-huodong]], 285 (Aug. 1, 1960; 下午); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 155 (Aug. 1, 1960; Zhou at the Swiss ambassador''s national-day reception: aggressive military blocs such as SEATO, which includes the United States, encircle China; China opposes it but still seeks peaceful coexistence; it proposes a mutual non-aggression pact of the Asian and Pacific coastal states, the United States included, and a nuclear-free region); [[w.chen-yi-nianpu]], 828 (Aug. 1, 1960, afternoon; the reception of 纳维义, the Swiss Ambassador; Chen Yi speaks, on neutral Switzerland''s efforts to ease tension); [[w.guan-vietnamese-communists-relations-with]], 159 (China''s fear of encirclement by a hostile bloc, SEATO; the pact of mutual nonaggression among the states of Asia and the Pacific, the United States among them, the region free of nuclear weapons). To check: NCNA, 1 August 1960, SWB/FE/400/A1/1 (cited by [[w.guan-vietnamese-communists-relations-with]], 159 n.23). Names: Zhou Enlai.'
