    also: [china]
    c: 'Beijing reports on the kindergartens of the suburbs: in Daxing county a dozen of 475 boarding kindergartens have rudimentary equipment, children eat and sleep on the floor, and in one several children of three and four cannot walk. The Women''s Federation calls a third of the suburbs'' kindergartens "backward."'
