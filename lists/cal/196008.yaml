entries:
  - id: cal.1960-08.legislatures
    when: Aug.
    date: 1960-08
    thread: legislatures
    c: 'Census Bureau, preliminary counts for the States: 179,000,000 for the fifty States and the District, up 27.7 million from 1950''s 151,325,798, a record. Florida from the twentieth State to the tenth.'
    n: '[*1960 Census of Population, Preliminary Reports: Population Counts for States*, PC(P1)-1, United States](https://www2.census.gov/library/publications/decennial/1960/population-pc-p1/15611091ch1.pdf) (Aug. 1960). Check the day of release. See [[cal.1960-03-15.legislatures]].'
  - id: cal.1960-08-01.defense-soviet-forces
    when: Aug. 1
    date: '1960-08-01'
    thread: defense-soviet-forces
    c: NIE 11-8-60, Soviet Capabilities for Long Range Attack Through Mid-1965. No direct evidence of the ICBM program's pace. Three illustrative programs, 400, 700 or 200 operational launchers by mid-1963; Dulles takes the first, Air Force intelligence the second. 135 heavy and 1,100 medium bombers in mid-1960.
    n: '[FRUS 1958–60, III, doc. 111](https://history.state.gov/historicaldocuments/frus1958-60v03/d111). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1958–60, III (1996). Names: Dulles.'
    tags: [name:dulles-allen-w]
  - id: cal.1960-08-02.governors-mi
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Michigan, Democratic primary for governor, Williams retiring after six terms: Swainson, lieutenant governor, over Hare, secretary of state, 274,743 to 205,086, 50.8 percent; a Detroit councilman 60,895, 11.3 percent. The Republican nominee of 1958 again, unopposed.'
    n: 'Votes: [Wikipedia, "1960 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1960_Michigan_gubernatorial_election), from the [*Michigan Manual 1961–1962*, pp. 399–400](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179231&view=1up&seq=471) (Check: not read here). To check: [[w.glazer-wounded-warrior]]; [[w.noer-soapy]]. Names: Swainson, Hare, Williams.'
    tags: [state:mi, name:swainson-john-b, name:hare-james-m, name:williams-g-mennen]
  - id: cal.1960-08-02.governors-mo
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Missouri, governor. Democratic primary: Dalton, the attorney general, over four others, 466,984 to 73,533, 86.4 percent. Republican: Farmer over two others, 107,637 to 91,341, 54.1 percent.'
    n: '[*Official Manual, State of Missouri, 1961–1962*, 1212–1213](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/34903). To check: [[w.peirce-great-plains-states-of]]. Names: Dalton, Farmer.'
    tags: [state:mo, name:dalton-john-m, name:farmer-edward-g]
  - id: cal.1960-08-02.governors-ks
    when: Aug. 2
    date: '1960-08-02'
    thread: governors
    also: [elections-1960]
    c: 'Kansas, governor. Republican primary: Anderson, the attorney general, over Boyd, 128,081 to 116,725, 48.7 percent; one other 18,169, 6.9 percent. Governor Docking renominated, unopposed.'
    n: 'Votes: Kan. Secretary of State, [*Election Statistics, 1960*, 23–24](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/57/download#page=23): Anderson 128,081, Boyd 116,725, Addington 18,169; Docking 150,961, unopposed. To check: [[w.socolofsky-kansas-governors]]; [[w.peirce-great-plains-states-of]]. Names: Anderson, George Docking, Boyd.'
    tags: [state:ks, name:anderson-john-jr, name:boyd-mcdill, name:docking-george]
  - id: cal.1960-08-02.elections-1960
    when: Aug. 2
    date: '1960-08-02'
    thread: elections-1960
    c: 'Kennedy''s campaign sets up a Civil Rights Section: Marjorie McKenzie Lawson director; Shriver, Wofford, Dawson, Frank Reeves and Louis Martin among its members.'
    n: 'Statement of Senator John F. Kennedy on Civil Rights Section, Hyannis, MA, [APP](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-civil-rights-section-hyannis-ma) (Aug. 2, 1960). [[w.kallina-kennedy-v-nixon]], 147. To check: [[w.bryant-bystander]], 166. Names: Kennedy, Shriver, Wofford, Dawson, Reeves. Check: Kallina gives August (147); the day is the statement''s.'
    src:
      c: 1f0d26cf
      rows:
        - 'https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-civil-rights-section-hyannis-ma: all'
        - 'w.kallina-kennedy-v-nixon 147: all'
    tags: [name:kennedy-john-f, name:shriver-r-sargent, name:wofford-harris, name:dawson-william-l, name:reeves-frank-d]
  - id: cal.1960-08-03.desegregation-schools-houston
    when: Aug. 3
    date: '1960-08-03'
    thread: desegregation-schools
    c: 'Houston. Judge Ben C. Connally finds the school board''s plan "a subterfuge designed only to accomplish further evasion and delay" and orders his own: desegregation a grade a year, from the first grade in September 1960, complete in 1972. Aug. 12, the plan set out grade by grade.'
    n: '*Ross v. Dyer*, [312 F.2d 191](https://static.case.law/f2d/312/case-pdfs/0191-01.pdf), 192 (5th Cir. 1962), recites the orders of Apr. 8, Aug. 3 and Aug. 12, 1960. To check: [[w.kellar-make-haste-slowly]]; [[w.feagin-free-enterprise-city]]. Names: Ben C. Connally.'
    tags: [state:tx, city:houston, name:connally-ben-c]
  - id: cal.1960-08-04.middle-east
    when: Aug. 4
    date: '1960-08-04'
    thread: middle-east
    c: 'Herter to Ben Gurion: no Hawks. A defensive missile in Israel would bring the neighbors missiles, surface-to-surface perhaps, against which the Hawk is no defense. The electronic equipment offered May 23 stands.'
    n: 'FRUS 1958–60, XIII, doc. [163](https://history.state.gov/historicaldocuments/frus1958-60v13/d163). See [[cal.1960-03-10.middle-east]]. Names: Herter, Ben Gurion.'
    tags: [name:herter-christian-a, name:ben-gurion-david]
  - id: cal.1960-08-06.cuba
    when: Aug. 6
    date: '1960-08-06'
    thread: cuba
    c: 'Castro, under Law 851, nationalizes 26 American companies: 36 sugar mills, the oil refineries, the electric and telephone companies.'
    n: 'FRUS 1958–60, VI, docs. [570](https://history.state.gov/historicaldocuments/frus1958-60v06/d570) (Bonsal, Aug. 2), [571](https://history.state.gov/historicaldocuments/frus1958-60v06/d571) (the Mexican offer of good offices, Aug. 3). Check the counts. To check: [[w.morley-imperial-state-and-revolution]]. See [[cal.1960-07-06.cuba-2]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1960-08-06.republican-party
    when: Aug. 6
    date: '1960-08-06'
    thread: republican-party
    also: [south-carolina]
    c: 'Columbia. The State Republican convention in reconvened session. Wannamaker, the national committeeman: the party still a small minority, organized in 24 of the 46 counties at the March convention, with no one to contest local races; candidates for Congress must be raised "from pups" or won from the Democrats. Meanwhile, he proposes, nominate the Democrats'' congressional nominees as the party''s own. Called "me-tooism"; voted down.'
    n: '[[w.gifford-center-cannot-hold]], 159–60. To check: Minutes of the 1960 Republican State Convention, Columbia, S.C., Mar. 26, 1960, William D. Workman Jr. Papers, South Caroliniana Library (cited by [[w.gifford-center-cannot-hold]], 159 n.60); "Minutes of the Reconvened Session of the 1960 Annual Convention of the South Carolina Republican Party," Hotel Jefferson, Columbia, S.C., Aug. 6, 1960, William D. Workman Jr. Papers, South Caroliniana Library (cited by [[w.gifford-center-cannot-hold]], 160 n.61).'
    src:
      c: 32ff1d24
      rows:
        - 'w.gifford-center-cannot-hold 159–60: all'
        - 'via w.gifford-center-cannot-hold 159 n.60: C'
        - 'via w.gifford-center-cannot-hold 160 n.61: all'
    tags: [state:sc, city:columbia-sc]
  - id: cal.1960-08-08.congress
    when: Aug. 8
    date: '1960-08-08'
    thread: congress
    also: [program]
    c: 'Congress back after the conventions, as Johnson and Rayburn planned; both Democratic nominees in the Senate. Eisenhower''s message: the mutual security cuts restored, $600 million for Latin America, school construction, medical care for the aged, the minimum wage, area assistance, forty judgeships, the Antarctic Treaty; "we cannot adjourn the public interest."'
    n: 'Special Message to the Congress Upon Its Reconvening, [1960–61 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=664); [Joint Statement of Senator John F. Kennedy and Senator Lyndon B. Johnson](https://www.presidency.ucsb.edu/documents/joint-statement-senator-john-f-kennedy-and-senator-lyndon-b-johnson) (July 30). [[w.caro-passage-of-power]], 94, 144 (the plan, 94). [[w.kallina-kennedy-v-nixon]], 98 (the session, Johnson''s). To check: [[w.dallek-lone-star-rising]]; [[w.hardeman-rayburn]]; [[w.sundquist-politics-and-policy]]; [[w.morgan-eisenhower-versus-the-spenders]]; Bryce Harlow, memorandum for the record of a meeting between Eisenhower and Rayburn, May 10, 1960, Eisenhower Library; Time, Sept. 5, 1960, 12 (cited by [[w.kallina-kennedy-v-nixon]], 98 n.2). Names: Johnson, Rayburn, Eisenhower. Check: Kallina, 98, has Rayburn against the session, wanting Congress adjourned before Los Angeles.'
    src:
      c: d84abf16
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=664: C-D'
        - 'https://www.presidency.ucsb.edu/documents/joint-statement-senator-john-f-kennedy-and-senator-lyndon-b-johnson: B'
        - 'w.caro-passage-of-power 94: A'
        - 'w.kallina-kennedy-v-nixon 98: A'
        - 'via w.kallina-kennedy-v-nixon 98 n.2a: A'
        - 'via w.kallina-kennedy-v-nixon 98 n.2c: A'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, name:eisenhower-dwight-d]
  - id: cal.1960-08-09.voting-rights
    when: Aug. 9
    date: '1960-08-09'
    thread: voting-rights
    c: 'Senate tables, [54–28](https://voteview.com/rollcall/RS0860388), on Clark''s motion, Dirksen''s bill of the two proposals left out of the act of May: a commission on equal job opportunity under government contracts, aid to districts desegregating schools. Kennedy and Johnson for tabling, Dirksen and Javits against. Kennedy: the Republicans would use civil rights to block school aid, housing, medical care and the minimum wage.'
    n: 'S. 3823, 86th Cong. [Statement by Senator John F. Kennedy, on Use of Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-use-civil-rights-legislation). See [[cal.1960-02-15.voting-rights]]. Names: Clark, Dirksen, Javits, Kennedy, Johnson.'
    tags: [name:clark-joseph-s, name:dirksen-everett, name:javits-jacob-k, name:kennedy-john-f, name:johnson-lyndon-b]
