  - id: cal.1960-08-30.elections-1960-rockefeller
    when: Aug. 30
    date: '1960-08-30'
    thread: elections-1960-rockefeller
    c: 'Lunch. Kissinger to Schlesinger: he saw Rockefeller at Seal Harbor the week before to say he could not help in the fall campaign, and will do nothing that might aid Nixon; Rockefeller "appeared low and sunk," disappointed by the response in Chicago. Of the Nixon–Rockefeller talks, Nixon came "armed with polls" to argue him into the Vice Presidential nomination, offering the platform, "complete control over foreign policy" and New York State patronage; Rockefeller turned it all down: "He loathes Nixon."'
    n: '[[w.schlesinger-journals]], 84. Made public: [[w.schlesinger-journals]] (2007). Names: Kissinger, Schlesinger, Rockefeller, Nixon.'
    tags: [name:kissinger-henry-a, name:schlesinger-arthur-m-jr, name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1960-08-30.elections-1960-kennedy-3
    when: Aug. 30
    date: '1960-08-30'
    thread: elections-1960-kennedy
    c: 'Kennedy at dinner with Phil and Katharine Graham and Johnson, by Graham''s account to Schlesinger the next day. Over cocktails the talk is of the South. At table Graham raises the northern liberals, "the other and more important part" of the coalition. Kennedy: "The trouble with the northern liberals is that they want their arses kissed all the time.... But I can''t spend all my time doing it." Graham: he has not been drafted and must be prepared to act himself; Kennedy "wearily agreed."'
    n: '[[w.schlesinger-journals]], 84–85. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Katharine Graham, Johnson, Schlesinger.'
    tags: [name:kennedy-john-f, name:graham-katharine, name:johnson-lyndon-b, name:schlesinger-arthur-m-jr]
