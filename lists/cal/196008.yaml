        - 'via w.gifford-center-cannot-hold 80 n.74: all'
    tags: [name:lefkowitz-louis-j, state:ny]
  - id: cal.1960-08-11.defense
    when: Aug. 11
    date: '1960-08-11'
    thread: defense
    c: 'Gates to Eisenhower, the Joint Chiefs split on targeting: a national target policy and a single integrated plan, drawn by a Director of Strategic Target Planning, the commander of SAC at Omaha, as an added duty. Burke appeals against it. Eisenhower: the first strike "must be simultaneous"; Gates to go ahead and bring the plan back in December.'
    n: '[FRUS 1958–60, III, doc. 113](https://history.state.gov/historicaldocuments/frus1958-60v03/d113) (Burke''s paper attached); microfiche supp., doc. [259](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d259) (Gates''s draft directive, tabled with the Chiefs Aug. 10). The first plan, SIOP-62, approved in December. [[w.watson-into-the-missile-age]], 486–88. Check when the decision was made public. To check: [[w.rosenberg-origins-of-overkill]]; [[w.kaplan-wizards-of-armageddon]]; [[w.roman-eisenhower-and-the-missile]]; [[w.kistiakowsky-scientist-at-the-white]]. Names: Gates, Eisenhower, Burke.'
    src:
      c: d70962fb
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d113: all'
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d259: A'
        - 'w.watson-into-the-missile-age 486: A, D'
        - 'w.watson-into-the-missile-age 487–88: A-D'
        - 'via w.watson-into-the-missile-age 486 n.48: A, D'
        - 'via w.watson-into-the-missile-age 488 n.50: B'
        - 'via w.watson-into-the-missile-age 488 n.51: all'
    tags: [name:gates-thomas-s-jr, name:eisenhower-dwight-d, name:burke-arleigh-a]
