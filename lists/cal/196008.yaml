  - id: cal.1960-08-18.congo-2
    when: Aug. 18
    date: '1960-08-18'
    time: 1960-08-18T13:00Z
    place: newport
    thread: congo-lumumba
    c: 'NSC on the Congo. Dillon: Lumumba serves the Soviets; Dulles: he is in Soviet pay. Eisenhower: the UN to stay in the Congo even if European troops must be asked for. Robert H. Johnson, the note-taker, testifies in 1975 that he heard the President say something he took as an order to kill Lumumba; the minutes record none.'
    n: '[FRUS 1958–60, XIV, doc. 180](https://history.state.gov/historicaldocuments/frus1958-60v14/d180) and its first note. [S. Rep. No. 94-465, 13–16, 55–60 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=24) (K–J Adm. II.H.3). [[w.fursenko-khrushchevs-cold-war]], 313 (the NSC: Western troops under the UN flag "even if such action was used by the Soviets as the basis for starting a fight"; Lumumba on the Soviet payroll); [[w.schlesinger-robert-kennedy-and-his]], 485 (in the Lumumba case Eisenhower "said something in a meeting of the National Security Council that at least one person present understood as an assassination order"; the day and the person not given); [[w.sen-church-alleged-assassination-plots]], 55–58 (the NSC minutes quoted: Dillon, Lumumba "was working to serve the purposes of the Soviets," Dulles, "Lumumba was in Soviet pay"; the President, "the possibility that the U.N. would be forced out was simply inconceivable," to keep the UN in the Congo "even if we had to ask for European troops to do it"; the memorandum "clearly does not contain an order"; Johnson, 55–57, testified in 1975 that at an NSC meeting that summer the President said something that "came across to me as an order for the assassination of Lumumba," and could not tell Aug. 18 from Sept. 7, the report judging Aug. 18 "most likely"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: [[w.kalb-congo-cables]]; [[w.weissman-american-foreign-policy-in]]; [[w.mahoney-jfk]]; [[w.namikas-battleground-africa]]; [[w.devlin-chief-of-station-congo]]; [[w.witte-de-moord-op-lumumba]]; [[w.gerard-death-in-the-congo]]. Names: Dillon, Dulles, Lumumba, Eisenhower, Robert H. Johnson.'
    src:
      c: 7c3cc9c1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v14/d180: all'
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=24: all'
        - 'w.fursenko-khrushchevs-cold-war 313: all'
