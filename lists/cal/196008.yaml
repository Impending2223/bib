  - id: cal.1960-08-12.republican-party
    when: Aug. 12
    date: '1960-08-12'
    thread: republican-party
    also: [voting-rights, elections-1960]
    c: 'Val Washington, for the National Committee: Kennedy has led the Democrats in making civil rights "second-class legislation." He told the Leadership Conference on Civil Rights he was ready to vote for civil rights, and "on Tuesday, the very next day," led his colleagues against it. "Republicans believe civil rights legislation has first priority and their Senate performance proves it."'
    n: '[[w.gifford-center-cannot-hold]], 80. To check: Republican National Committee, press release, Aug. 12, 1960, Series 320, Box 801, "Washington," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 80 n.75). See [[cal.1960-08-09.voting-rights]]. Names: Kennedy.'
