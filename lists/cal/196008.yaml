    c: 'Des Moines, Iowa. The Kennedy–Johnson Midwest Farm Conference, Loveless its organizer, Humphrey presiding; Johnson, Symington, Kefauver and Freeman there. Kennedy: farm purchasing power cut some 20 percent in Nixon''s eight years; the family farm "the No. 1 domestic issue"; "I would rather be accused of breaking precedents than breaking promises."'
