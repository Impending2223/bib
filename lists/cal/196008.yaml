    when: Aug. 9
    date: '1960-08-09'
    thread: laos
    c: Kong Le's paratroop battalion takes Vientiane, the night of Aug. 8–9, the cabinet away at Luang Prabang.
    n: 'FRUS 1958–60, XVI, docs. [355](https://history.state.gov/historicaldocuments/frus1958-60v16/d355), [359](https://history.state.gov/historicaldocuments/frus1958-60v16/d359) (NSC, Aug. 12), [361](https://history.state.gov/historicaldocuments/frus1958-60v16/d361). [[w.vietnam-victory-in-vietnam]], 86–87, 456 n.20 (the coup); [[w.watson-into-the-missile-age]], 650 (the coup, Aug. 9); [[w.marolda-united-states-navy-and]], 46 (the coup, Aug. 9); [[w.anthony-war-in-northern-laos]], 28–29. To check: [[w.rust-before-the-quagmire]]; [[w.jacobs-universe-unraveling]]; [[w.dommen-conflict-in-laos]]; [[w.fall-anatomy-of-a-crisis]]; [[w.stevenson-end-of-nowhere]]; [[w.conboy-shadow-war]]; msg, AmEmb Vientiane to SECSTATE, 266, Aug 12, 1960 (cited by [[w.anthony-war-in-northern-laos]], 29 n.59a); memo, Dept of State (PA to PAI), subj: Visit to Vientiane, Sep 30, 1960, n.d., ca Oct 60 (cited by [[w.anthony-war-in-northern-laos]], 29 n.59b); rprt, AIRA Saigon, Semi-annual FWAIS Capabilities—Laos, Mar 22, 1961 (cited by [[w.anthony-war-in-northern-laos]], 29 n.59c); the Army attaché''s telegram 237 from Vientiane, 091715Z Aug. 1960, and the JUSMAG Thailand''s 7715, 101955Z Aug. 1960, OSD Hist. (cited by [[w.watson-into-the-missile-age]], 650 n.126). Names: Kong Le.'
