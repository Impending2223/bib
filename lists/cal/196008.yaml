    c: 'Senate passes Kennedy''s minimum wage bill, [62–34](https://voteview.com/rollcall/RS0860402): $1.25 by the third year; coverage to about four million more workers, after hotels, motels, restaurants, and auto and farm implement dealers are excluded, [87–8](https://voteview.com/rollcall/RS0860400). The House bill of June 30, Kitchin''s substitute: $1.15, [341–72](https://voteview.com/rollcall/RH0860163).'
    n: 'H.R. 12677, 86th Cong. [Press Release of Senator John F. Kennedy, on Minimum Wage Bill](https://www.presidency.ucsb.edu/documents/press-release-senator-john-f-kennedy-minimum-wage-bill-washington-dc). The Senate sat from noon to 9:49 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=1), [D448](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=446). [[w.communications-freedom-of-communications-part]], 23–24, 38 (Kennedy''s release on the Senate''s vote of 62 to 34: $1.15, $1.20, then $1.25; coverage of about four million more employees; the exemptions voted for hotels, motels, restaurants, and automobile and farm equipment dealers, not the vote of 87–8 or the House bill; Kennedy at 38: "I brought to the floor and passed a bill for $1.25 minimum wage"). To check: [[w.kallina-kennedy-v-nixon]]. Names: Kennedy, Kitchin.'
