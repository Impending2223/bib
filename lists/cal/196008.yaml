  - id: cal.1960-08-18.cuba
    when: Aug. 18
    date: '1960-08-18'
    time: 1960-08-18T15:05Z
    place: washington
    thread: cuba-bay-of-pigs
    c: 'Dulles and Bissell report to Eisenhower on the Cuba program: the exile front in Mexico, the Swan Island radio, some 500 Cubans to be trained in Guatemala. Eisenhower approves funds from the reserve, "so long as the Joint Chiefs, Defense, State and the CIA think we have a good chance of being successful."'
    n: '[FRUS 1958–60, VI, doc. 577](https://history.state.gov/historicaldocuments/frus1958-60v06/d577) (Gray''s memorandum). [[w.jones-bay-of-pigs]], 20 (the meeting; some five hundred Cubans; the budget approved); [[w.fursenko-khrushchevs-cold-war]], 313–14 (the CIA''s update that afternoon: an opposition, black propaganda, 500 exiles trained in Guatemala for infiltration in groups of 75; a landing on the Isle of Pines in reserve); [[w.watson-into-the-missile-age]], 764 (Aug. 18: Eisenhower "approved a budget of approximately $13 million for the operation and the use of personnel and equipment supplied by DoD," and "wanted no U.S. military personnel used in a combat role"; not the reserve, the condition on the Joint Chiefs, State and the CIA, or the report of Dulles and Bissell). To check: Hurwitch, oral history, 164, Kennedy Library (cited by [[w.jones-bay-of-pigs]], 20 n.27). See [[cal.1960-03-17.cuba]]. Made public: FRUS 1958–60, VI (1991). Check for an earlier release. Names: Dulles, Bissell, Eisenhower. Check: Jones gives the budget approved as $13 million (20).'
