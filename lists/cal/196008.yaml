  - id: cal.1960-08-09.congo
    when: Aug. 9
    date: '1960-08-09'
    thread: congo
    c: 'Security Council: Belgium to take its troops out of Katanga, the UN force to enter it, and to take no part in any internal conflict; 9–0, France and Italy abstaining.'
    n: '[S.C. Res. 146](https://docs.un.org/S/RES/146%281960%29). FRUS 1958–60, XIV, docs. [168](https://history.state.gov/historicaldocuments/frus1958-60v14/d168), [169](https://history.state.gov/historicaldocuments/frus1958-60v14/d169) (Lodge). See [[cal.1960-06-30.congo]].'
    tags: [name:lodge-henry-cabot]
  - id: cal.1960-08-09.oil
    when: Aug. 9
    date: '1960-08-09'
    thread: oil
    also: [middle-east]
    c: 'Esso Export cuts its posted prices for Middle East crude 4 to 14 cents a barrel: Arabian light at Ras Tanura $1.90 to $1.76, Kuwait $1.67 to $1.58, Iranian at Abadan $1.81 to $1.69. Its reasons: discounts below the postings, and Soviet offers.'
    n: '[*The Oil and Gas Journal*, Aug. 15, 1960, 83](https://archive.org/details/sim_oil-gas-journal_1960-08-15_58_33/page/n94), the postings; the day: CIA, [*Central Intelligence Bulletin*, Aug. 16, 1960](https://archive.org/details/cia-readingroom-document-03185153), and [*Current Intelligence Weekly Summary*, Aug. 18, 1960](https://archive.org/details/cia-readingroom-document-02967359). To check: [[w.adelman-world-petroleum-market]]; [[w.sampson-seven-sisters]]; [[w.skeet-opec]]; [[w.yergin-prize]]; [[w.garavini-rise-and-fall-of]].'
    tags: [oilprice:ras-tanura]
  - id: cal.1960-08-09.republican-party
    when: Aug. 9
    date: '1960-08-09'
    thread: republican-party
    also: [elections-1960]
    c: 'Hermann, head of the National Committee''s Nationalities Division, to Nixon, Hall, Bassett, Finch and Morton: the division twice its size of 1956. Six hundred nationality leaders met at the Conrad Hilton during the convention, told Nixon could not see them. Meetings with him, photographs, notice in the industrial towns, the foreign-language press: "A strong Nationalities vote for the Vice President could be the balance of power in the industrial States."'
    n: '[[w.gifford-center-cannot-hold]], 174, 179–80. To check: A. B. Hermann to Nixon and others, Aug. 9, 1960, Series 320, Box 37, "ANNL," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 174 n.18, 180 n.31). Names: Nixon, Finch, Morton.'
    src:
      c: 3db62031
      rows:
        - 'w.gifford-center-cannot-hold 174: A'
        - 'w.gifford-center-cannot-hold 179–80: all'
        - 'via w.gifford-center-cannot-hold 174 n.18: A'
        - 'via w.gifford-center-cannot-hold 180 n.31: all'
    tags: [name:nixon-richard-m, name:finch-robert-h, name:morton-thruston-b]
  - id: cal.1960-08-10.testing
    when: Aug. 10
    date: '1960-08-10'
    thread: testing
    c: 'Senate approves the Antarctic Treaty, [12 U.S.T. 794](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-12-1/lltreaties-12-1.pdf#page=816), [402 U.N.T.S. 71](https://treaties.un.org/doc/Publication/UNTS/Volume%20402/volume-402-I-5778-English.pdf), [66–21](https://voteview.com/rollcall/RS0860390), Engle''s motion to put it off to January refused, [29–56](https://voteview.com/rollcall/RS0860389). Antarctica for peaceful purposes only: no bases, maneuvers or nuclear explosions; the parties'' observers free to inspect. Eisenhower ratifies Aug. 18.'
    n: 'Signed at Washington, Dec. 1, 1959, by the twelve; in force June 23, 1961. To check: [[w.beck-international-politics-of-antarctica]]. Names: Engle, Eisenhower.'
    tags: [name:engle-clair, name:eisenhower-dwight-d]
