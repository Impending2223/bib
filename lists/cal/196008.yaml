    c: 'Moscow''s statement on the Congo: should the aggression go on, "the Soviet government will not hesitate to take resolute measures to rebuff the aggressors," encouraged by "all the colonialist powers of NATO." A Soviet ambassador to the Congo named. Aug. 2: Hammarskjöld says the UN force will enter Katanga Aug. 6.'
