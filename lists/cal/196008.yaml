  - id: cal.1960-08-01.farm
    when: Aug. 1
    date: '1960-08-01'
    place: hyannis-port
    thread: farm
    also: [elections-1960-kennedy]
    c: 'Hyannis Port, Mass. Five Midwestern Democratic Governors (Loveless, Docking, Herseth, Nelson, Freeman) and three Senators (Burdick, Proxmire, Humphrey) issue from Kennedy''s headquarters a joint statement on farm policy: Nixon, "in the short span of 48 hours since his nomination," has "repudiated two key parts" of the administration''s program, defense and Benson''s farm policy. Kennedy adds a statement of his own on the same subject.'
    n: '[[w.communications-freedom-of-communications-part]], 1–3. Names: Kennedy, Humphrey, Freeman, Loveless, Docking, Herseth, Nelson, Burdick, Proxmire, Nixon, Benson.'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h, name:freeman-orville-l, name:loveless-herschel-c, name:docking-george, name:herseth-ralph, name:nelson-gaylord-a, name:burdick-quentin-n, name:proxmire-william, name:nixon-richard-m, name:benson-ezra-taft, state:ma]
  - id: cal.1960-08-01.intelligence
    when: Aug. 1
    date: '1960-08-01'
    thread: intelligence
    c: 'Lansdale to Douglas, "Missing NSA Personnel," a summary of the case of Mitchell and Martin. It expects the Mexico City and Havana aspects to come from press contacts with the local police, "and possibly with either the families or Congressman May": "It has the potential of a sensational story, if the press starts speculating." Mitchell and Martin have been "administratively relieved of all duties at NSA, pending further information."'
    n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 1–4 (the summary; the expected press contacts, the "sensational story," the relief from duties, 4; not the security estimate, the personal details or the FBI''s doubts about jurisdiction, 2–3). The memo writes "Congressman Edith Nourse May in Yakima, Washington"; the member from Yakima in 1960 was Catherine D. May. Made public: 2002. Names: Lansdale, Douglas, May.'
    tags: [name:lansdale-edward-g, name:douglas-james-h-jr, name:may-catherine-d]
  - id: cal.1960-08-01.intelligence-2
    when: Aug. 1
    date: '1960-08-01'
    thread: intelligence
    c: The Defense Department announces that two employees of the National Security Agency have failed to return from a vacation trip they took together.
    n: '[[w.huac-security-practices-nsa]], 1–2 (the announcement of Aug. 1, 1960: two NSA employees "failed to return from a supposed vacation trip which they had taken together"; the names not given there). [[w.mowry-betrayers-of-the-trust]], 2 (on Aug. 1 the department "announced their unauthorized absence"). [[w.durant-congress-and-countersubversion-in]], 76 (the department "announced that Martin and Mitchell were missing"). To check: *New York Times*, Aug. 2, 1960.'
