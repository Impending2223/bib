    also: [vietnam-hanoi, soviet-union]
    c: 'Beidaihe, the beach, 6 a.m. Mao with Hồ Chí Minh, Hoàng Văn Hoan and Nguyễn Xuân Thủy; a swim at eight; breakfast; Liu Shaoqi, Zhou Enlai, Deng Xiaoping present. Hồ''s points "basically good," he a "messenger of peace." At Bucharest a communique to be signed unchanged: "father and son." Revisionism to be fought; China''s own, a tenth, could make "a Chinese Khrushchev" in twenty or forty years: "if so, fight us."'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 10, 1960. [[w.zhou-enlai-nianpu-1949]], II, 339, Aug. 10, 1960 (Zhou with Mao and Hồ). [[w.lengxi-shinian-lunzhan-1956-1966]], 345–348 (Mao, a night without sleep, came to the beach early morning, talked with Hồ and swam; Liu, Zhou and Deng sent for; Hồ''s points "basically good"; Mao declines to meet Khrushchev himself, Liu, Deng or Peng could; lunch at the bathing place, Hồ asks Liu to visit Vietnam in spring); [[w.yang-shangkun-riji]], I, 533 (Aug. 10, 1960; Mao calls Yang to the beach at 8 a.m.; talk and breakfast with Hồ and the others); [[w.deng-xiaoping-nianpu-1904]], III, 1570 (Aug. 10, 1960; morning; Deng, with Liu and Zhou, at Mao''s talks with Hồ on the Sino-Soviet differences). Made public: 1997. Names: Mao Zedong, Hồ Chí Minh, Hoàng Văn Hoan, Nguyễn Xuân Thủy, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Yang Shangkun.'
