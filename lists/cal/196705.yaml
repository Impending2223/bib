    c: 'Noon, Great Hall room 118. Mao receives the Congo (Brazzaville) government''s security delegation under Bindi, Zhou Enlai and Xie Fuzhi present.{1} On the disorder of the Cultural Revolution: very great, the Red Guards everywhere; the posters, the Red Guards, the bombarding of this and that the masses'' creation, not his; where the government, the Center and the Ministry of Public Security could do nothing, the Red Guards and the masses found a way, and made plain what was not known for decades.{2} It will be disorderly one or two years;{3} the sky will not fall.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 16, 1967; [[w.zhou-enlai-waijiao-huodong]], 512 (May 16, 1967; noon, Room 118, Great Hall of the People; Zhou accompanies Mao in receiving the head of the Congo (Brazzaville)''s state security department and its government security delegation); [[w.zhonghua-renmin-gongheguo-waijiao]], 154 (May 16, 1967; Mao and Zhou receive the security delegation of the Congo (Brazzaville) government, led by the head of its security service); [[w.mao-zedong-zhuan]], VI, ch. 76 n.40 (May 16 Mao''s talk with the security delegation of the Congo (Brazzaville) government, n.40: ''very disorderly, the Red Guards make trouble everywhere; not my creation, the masses'' creation; the posters, the Red Guards, bombarding this and that, overthrowing this and that''; ''there is no way for our government, the Center, the Ministry of Public Security; with the Red Guards and the masses it is done; what for decades we did not know, the Red Guards'' stir made clear''; ''disorder comes of class struggle; it is nothing serious, the sky will not fall''; to other foreign friends he said that the sky will not fall, the grass and trees on the mountains grow as before, the fish swim, the women bear children). Made public: 1993. To check: Mao Zedong 毛泽东, talk with the security delegation of the government of the Congo (Brazzaville) 刚果（布）政府保安代表团 (record 谈话记录), May 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.40). Names: Mao Zedong, Bindi, Zhou Enlai, Xie Fuzhi. Check: the head''s name (the nianpu''s 宾迪). Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
