  - id: cal.1967-05-13.china-leadership-4
    when: May 13
    date: '1967-05-13'
    place: peking
    thread: china-foreign
    also: [vietnam-hanoi, soviet-union]
    c: 'Beijing. Deputy Foreign Minister Qiao Guanhua to the Vietnamese ambassador Ngô Minh Loan: China agrees to Vietnam''s plan to move 24 Soviet MiG-17s and MiG-21s, due in May and June, by rail in two shipments of 12, and refuses the Soviet plan to fly them over China in AN-12s from May 16 to 24. The Soviets mean to boast of their aid to the U.S., reveal secrets and control Vietnam; the proposal is a conspiracy and a chauvinist act; China does not impose its view.'
    n: 'Qiao Guanhua with Ngô Minh Loan, Beijing, May 13, 1967, doc. 29, [[w.77-conversations-between-chinese]], [119–120](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=117) (an excerpt; 119 nn.189–190: Nghiêm Bá Đức and Phạm Thanh Hà, who told Beijing and Hanoi on May 6 and 9; no hour). [[w.khoo-collateral-damage]], 35 (Qiao Guanhua to Ngô Minh Loan, May 13, 1967: the Soviet proposal for air transport "a conspiracy"). Made public: 1998. To check: [[w.77-conversations-between-chinese]], 123, 122 (cited by [[w.khoo-collateral-damage]], 35 n.185). Names: Qiao Guanhua, Ngô Minh Loan.'
    tags: [name:qiao-guanhua, name:ngo-minh-loan, polity:prc, polity:drv, vis:only:prc+drv]
