    c: 'Dinner at the White House, Johnson, Russell, Mrs.{1} Johnson and McPherson.{2} Johnson''s three choices: more bombing in the North; the DMZ alone; the 17th to the 20th parallel made "a desert."{3} Russell: "We''ve just got to finish it soon," blockade the ports.{4} Johnson: that would bring war sooner than anything;{5} of the Hanoi power plant, half a mile from Hồ''s headquarters, "Suppose we missed."{6} Russell, by his notes, McNamara for the strike, Rusk against: all such targets incidental now; only an invasion of the North would be decisive. McPherson offers to inspect the war in the South.{7}'
