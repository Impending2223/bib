  - id: cal.1967-05-22.vietnam-air-war
    when: May 22
    date: '1967-05-22'
    thread: vietnam-air-war
    also: [soviet-union]
    c: The bombing around Hanoi and Haiphong cut back, in part to move Moscow to bring Hanoi to talks.
    n: 'Rostow to Johnson, May 19, [FRUS 1964–68, V: Vietnam, 1967, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v05/d176), n. 3 ("Within 3 days all strikes within the Hanoi restricted zone were prohibited"). [[w.gibbons-u-s-government-and]], IV, 651–52. Check: the order''s terms and day; FRUS''s note names Hanoi''s zone alone. See [[cal.1967-05-19.vietnam-2]].'
  - id: cal.1967-05-22.vietnam-support
    when: May 22
    date: '1967-05-22'
    thread: vietnam-support
    c: Luncheon at the White House, Johnson with sixteen "intellectuals" of his own administration, Gardner, Schultze, Ackley, Okun, Brzezinski, Enthoven, Harold Brown and Roche among them, on his trouble reaching the intellectuals. By the *Times*'s account, puzzled by their alienation; perhaps they want him "to agonize about his problems in public."
    n: '[[w.gibbons-u-s-government-and]], IV, 700. To check: *New York Times*, May 22, 1967 (Max Frankel). Names: Johnson, Gardner, Schultze, Ackley, Okun, Brzezinski, Enthoven, Harold Brown, Roche.'
    tags: [name:johnson-lyndon-b, name:gardner-john-w, name:schultze-charles-l, name:ackley-gardner, name:okun-arthur-m, name:brzezinski-zbigniew, name:enthoven-alain-c, name:brown-harold, name:roche-john-p]
  - id: cal.1967-05-23.governors-ky
    when: May 23
    date: '1967-05-23'
    thread: governors
    also: [elections-1967]
    c: 'Kentucky primaries for governor. Democratic: Ward, the highway commissioner, over Chandler, governor 1935–39 and 1955–59, 207,797 to 111,782, 52.4 percent; Lieutenant Governor Waterfield 42,583, 10.7 percent; seven others. Republican: Nunn, the 1963 nominee, over Marlow Cook, Jefferson County judge, 90,216 to 86,397, 50.4 percent, a 3,819-vote margin.'
    n: '[Ky. *Statement of the Official Vote*, Democratic primary, May 23, 1967](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=1); [Republican](https://elect.ky.gov/results/1973-1979/Documents/1967.pdf#page=2). [[w.harrison-new-history-of-kentucky]], 413. The totals: [Wikipedia, "1967 Kentucky gubernatorial election"](https://en.wikipedia.org/wiki/1967_Kentucky_gubernatorial_election). To check: [[w.peirce-border-south-states]]. Names: Ward, Chandler, Waterfield, Nunn, Cook.'
    tags: [state:ky, name:ward-henry, name:chandler-a-b, name:waterfield-harry-lee, name:nunn-louie-b, name:cook-marlow-w]
  - id: cal.1967-05-23.middle-east
    when: May 23
    date: '1967-05-23'
    thread: middle-east-six-day-war
    c: 'Johnson on radio and television, 6:10 p.m.: the gulf "an international waterway"; a blockade of Israeli shipping "illegal and potentially disastrous to the cause of peace"; the United States "firmly committed to the support of the political independence and territorial integrity of all the nations of the area." U Thant in Cairo, May 23–24. The Security Council meets May 24.'
    n: 'Statement by the President on Rising Tensions in the Near East, [1967 Pub. Papers 561](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=629) (May 23, 1967). See [[cal.1967-05-16.middle-east]]. Names: U Thant, Johnson.'
    tags: [name:u-thant, name:johnson-lyndon-b]
  - id: cal.1967-05-23.vietnam-congress
    when: May 23
    date: '1967-05-23'
    thread: vietnam-congress
    c: 'Morton in the Senate, after the Harris Survey: what "total military victory" would mean, pacification by Americans, half a million to two million men, the North invaded, China. "An unhealthy and unproductive war fever is mounting"; "there is going to be hell to pay if we settle for anything less."'
    n: '[113 Cong. Rec., Senate, May 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf), 13534–35 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 686–87. See [[cal.1967-05-17.opinion-2]]. Names: Morton.'
    tags: [name:morton-thruston-b]
  - id: cal.1967-05-23.vietnam-congress-2
    when: May 23
    date: '1967-05-23'
    thread: vietnam-congress
    c: 'Pell in the Senate: "cool it down, to slow down." Stop the bombing and hold the troops; curtail search and destroy; then free elections open to all, eventual withdrawal, an amnesty, pacification back to civilians; talks with the Viet Cong; a neutralized Southeast Asia. Mansfield, Morse and Gore praise it.'
    n: '[113 Cong. Rec., Senate, May 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf), 13498–502 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 687–89. Names: Pell, Mansfield, Morse, Gore.'
    tags: [name:pell-claiborne-d, name:mansfield-mike, name:morse-wayne, name:gore-albert-sr]
  - id: cal.1967-05-24.school-aid
    when: May 24
    date: '1967-05-24'
    thread: school-aid
    c: 'The House passes the Elementary and Secondary Education Amendments, H.R. 7819, [294–122](https://voteview.com/rollcall/RH0900061); recommittal lost, [180–236](https://voteview.com/rollcall/RH0900060). Amendments carried: Title I''s money by the national average expenditure per pupil, [222–194](https://voteview.com/rollcall/RH0900058); Title III''s supplementary centers through the State departments of education, not to the localities direct, [230–185](https://voteview.com/rollcall/RH0900059).'
    n: 'To check: [[w.graham-uncertain-triumph]]. See [[cal.1965-01-12.school-aid]].'
  - id: cal.1967-05-24.vietnam-program-5
    when: May 24
    date: '1967-05-24'
    thread: vietnam-program-5
    c: 'Wheeler to McNamara, CM-2377-67: the reserves needed.'
    n: 'FRUS 1964–68, V, doc. [187](https://history.state.gov/historicaldocuments/frus1964-68v05/d187). [[w.gibbons-u-s-government-and]], IV, 611 n.18, 652. See [[cal.1967-05-19.vietnam]]. Names: Wheeler, McNamara.'
    tags: [name:wheeler-earle, name:mcnamara-robert-s]
  - id: cal.1967-05-25.program
    when: May 25
    date: '1967-05-25'
    thread: program
    also: [elections-1968]
    c: 'Special message on election reform. An Election Reform Act: every contribution, loan and expense over $100 reported, by every candidate and committee for federal office; $5,000 the most from one person and his family to one candidate; the ceilings on campaign spending repealed. Appropriated funds, in place of Long''s check-off, to reimburse the parties'' expenses in the presidential campaign after the nominations. A Residency Voting Act: a citizen resident in a State by Sept. 1 may vote there for President.'
    n: 'Special Message to the Congress on Election Reform: The Political Process in America, [1967 Pub. Papers 565](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=633) (May 25, 1967). To check: [[w.mann-legacy-to-power]]. See [[cal.1966-10-12.program]]. Names: Long, Johnson.'
    tags: [name:johnson-lyndon-b, name:long-russell-b]
  - id: cal.1967-05-25.middle-east
    when: May 25–26
    date: '1967-05-25'
    thread: middle-east-six-day-war
    c: 'Eban in Washington from Paris and London; with Rusk May 25. May 26, Johnson and his advisers, 1:30 p.m.: Wheeler, Israel 55 to 65 percent mobilized, some 50,000 Egyptian troops in Sinai. Eban with Johnson, 7:15 to 8:40 p.m.: what will the United States do to keep the Strait open? Johnson: Israel must not be responsible for starting hostilities; the maritime powers to act, on the British plan; and twice, "Israel will not be alone unless it decides to go it alone."'
    n: 'FRUS 1964–68, XIX, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v19/d72), [77](https://history.state.gov/historicaldocuments/frus1964-68v19/d77). See [[cal.1967-05-16.middle-east]]. Names: Eban, Rusk, Wheeler, Johnson.'
    tags: [name:eban-abba-s, name:rusk-dean, name:wheeler-earle, name:johnson-lyndon-b, name:harman-avraham]
  - id: cal.1967-05-25.states-and-cities-mn
    when: May 25
    date: '1967-05-25'
    thread: states-and-cities
    c: 'Minnesota. The Metropolitan Council Act approved: a council of fifteen, named by the governor, for the seven counties of Minneapolis and St. Paul. In force July 1. LeVander names its members Aug. 8.'
    n: '[Laws of Minnesota 1967, ch. 896](https://www.revisor.mn.gov/laws/1967/0/896). [Wikipedia, "Metropolitan Council (Minnesota)"](https://en.wikipedia.org/wiki/Metropolitan_Council_(Minnesota)). To check: [[w.peirce-great-plains-states-of]]. Names: LeVander.'
    tags: [state:mn, city:minneapolis, name:levander-harold]
  - id: cal.1967-05-27.middle-east
    when: May 27
    date: '1967-05-27'
    thread: middle-east-six-day-war
    also: [soviet-union]
    c: 'Kosygin to Johnson: if Israel attacks, "we will render aid to those countries that are subjected to aggression."'
    n: 'FRUS 1964–68, XIX, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v19/d84). See [[cal.1967-05-16.middle-east]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1967-05-28.middle-east
    when: May 28
    date: '1967-05-28'
    thread: middle-east-six-day-war
    c: Israel's cabinet decides to wait.
    n: 'Barbour''s telegram 3834 from Tel Aviv, May 28, in FRUS 1964–68, XIX, doc. [89](https://history.state.gov/historicaldocuments/frus1964-68v19/d89), n. 3: the Cabinet''s decision "to postpone military action for few weeks." Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-05-16.middle-east]].'
  - id: cal.1967-05-28.opinion
    when: May 28
    date: '1967-05-28'
    thread: opinion
    also: [students, vietnam, draft]
    c: 'Gallup, special survey of college students: on Vietnam a hawk 49 percent, a dove 35; men 56 and 30, women 38 and 42. A student found taking drugs, marijuana or LSD, expelled: yes 33, no 61. College students drafted in the same proportion as youth not in college: yes 30, no 66.'
    n: '[[w.gallup-poll]], III, 2065.'
  - id: cal.1967-05-29.court
    when: May 29
    date: '1967-05-29'
    thread: court
    also: [open-housing]
    c: '*Reitman v. Mulkey*, [387 U.S. 369](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387369/usrep387369.pdf): California''s Proposition 14, the amendment to its constitution leaving owners free to refuse to sell or rent to whom they choose, denies the equal protection of the laws; the State has made itself a party to private discrimination. White for the Court, 5–4; Douglas concurring; Harlan, with Black, Clark and Stewart, dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]. See [[cal.1964-11-03.cities-and-housing]]; [[cal.1966-05-10.open-housing-ca]].'
    tags: [state:ca]
  - id: cal.1967-05-29.court-2
    when: May 29
    date: '1967-05-29'
    thread: court
    c: '*Afroyim v. Rusk*, [387 U.S. 253](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387253/usrep387253.pdf): Congress may not take away a citizen''s citizenship without his assent; the Fourteenth Amendment protects it. A naturalized American who voted in Israel''s election of 1951 keeps his. *Perez v. Brownell* (1958) overruled. Black for the Court, 5–4; Harlan, with Clark, Stewart and White, dissenting.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1967-05-30.africa
    when: May 30–31
    date: '1967-05-30'
    thread: africa
    c: 'Enugu, early May 30. Ojukwu, Military Governor of Eastern Nigeria, proclaims the Republic of Biafra. Gowon: an "act of rebellion"; the blockade of the East reimposed, the federal army mobilized. He asks the American and British ambassadors for military help; refused. State to posts, May 30: Nigeria''s problem the Nigerians'', Africa''s and the Commonwealth''s; relations kept with the Federal Military Government.'
    n: 'FRUS 1964–68, XXIV, docs. [386](https://history.state.gov/historicaldocuments/frus1964-68v24/d386), [387](https://history.state.gov/historicaldocuments/frus1964-68v24/d387). To check: [[w.stremlau-international-politics-of-the]]. Names: Ojukwu, Gowon.'
    tags: [name:ojukwu-chukwuemeka-odumegwu, name:gowon-yakubu]
  - id: cal.1967-05-30.middle-east
    when: May 30
    date: '1967-05-30'
    thread: middle-east-six-day-war
    c: 'Hussein flies to Cairo and signs a defense pact with Nasser. Rusk and McNamara to Johnson: a declaration of the maritime powers that the Strait and the gulf are international waterways, and plans to test Egypt''s interference with passage.'
    n: 'FRUS 1964–68, XIX, doc. [103](https://history.state.gov/historicaldocuments/frus1964-68v19/d103). See [[cal.1967-05-16.middle-east]]. Names: Hussein ibn Talal, Nasser, Rusk, McNamara, Johnson.'
    tags: [name:hussein-ibn-talal, name:nasser-gamal-abdel, name:rusk-dean, name:mcnamara-robert-s, name:johnson-lyndon-b]
