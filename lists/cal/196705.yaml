    c: 'Executive Order 11356: an emergency board in another of the carriers'' disputes.'
    n: '[Executive Order 11356](https://www.presidency.ucsb.edu/documents/executive-order-11356-creating-emergency-board-investigate-disputes-between-the-carriers) (May 30, 1967). See [[cal.1967-05-01.railroads]]. Check: which unions. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-05-31.middle-east
    when: May 31
    date: '1967-05-31'
    thread: middle-east-six-day-war
    c: 'Robert B. Anderson with Nasser in Cairo: Mohieddin to come to Washington.'
    n: 'FRUS 1964–68, XIX, doc. [106](https://history.state.gov/historicaldocuments/frus1964-68v19/d106). See [[cal.1967-05-16.middle-east]]. Names: Anderson, Nasser, Mohieddin.'
    tags: [name:anderson-robert-b, name:nasser-gamal-abdel, name:mohieddin-zakaria]
