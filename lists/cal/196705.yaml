  - id: cal.1967-05-02.vietnam-2
    when: May 2
    date: '1967-05-02'
    thread: vietnam-air-war
    c: 'Tuesday lunch, 1:27 to 2:50 p.m., Johnson with Rusk, McNamara, Rostow and Christian. On the agenda McNamara''s proposal: finish the major targets, the power plants of Hanoi and Haiphong; then shift the bombing south of the 20th parallel, the Russians "quietly notified"; and Mansfield''s U.N. approach, put off at least to June, by Sisco''s memorandum of May 12. No notes.'
