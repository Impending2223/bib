  - id: cal.1967-05-01.vietnam-program-5
    when: May 1
    date: '1967-05-01'
    place: washington
    thread: vietnam-program-5
    c: 'William Bundy to Katzenbach: against a large increase and a call-up, whose debate "could only encourage Hanoi";{1} against mining Haiphong;{2} "totally against" invading the North, a 75–25 chance of bringing China in. A steady program for nine months: the "very jerky and impatient impression" given Hanoi since December.{3}'
    n: 'FRUS 1964–68, V, doc. [154](https://history.state.gov/historicaldocuments/frus1964-68v05/d154). [[w.gibbons-u-s-government-and]], IV, 622–23. Made public: [[w.pentagon-papers]] (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: William Bundy, Katzenbach.'
    src:
