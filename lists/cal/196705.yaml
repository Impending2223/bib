  - id: cal.1967-05.china-leadership
    when: May
    date: 1967-05
    thread: china-wuhan
    also: [china-mao-cr, china-foreign]
    c: 'Mao receives a foreign military delegation and explains the Cultural Revolution, Lin Biao and others present. It began, he says, with Yao Wenyuan''s critique of *Hai Rui* in the winter of 1965;{1} the capital was held by revisionists, "not a drop of water in, not a needle";{2} Jiang Qing had it organized in Shanghai; he read the text three times. By policy and tactics four stages: from Yao''s article to the Eleventh Plenum, launching; from the Plenum to the January storm, turning the course; from the seizure to the great alliance and three-in-one; from Qi Benyu''s *Patriotism or National Betrayal?* and the critique of *Self-Cultivation*, the fourth.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1967 (no day); [[w.macfarquhar-maos-last-revolution]], 170–171 (to visiting Albanian officers: the original idea was to pick some successors from the intellectuals; the Peking Revolutionary Committee was "not necessarily appropriate" and there has to be a reorganization); [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.64 (Mao to an Albanian military delegation: Peking under Peng Zhen let in no needle, no drop of water); [[w.mao-zedong-zhuan]], VI, ch. 76 n.45 (May 1967 by the note, Mao''s talk with a foreign military delegation (the entry''s delegation), of which the book quotes a passage on the intellectuals: he had thought to rear some successors among them and it has turned out far from ideal; the criticism of the bourgeois reactionary line was raised by intellectuals and young students, but the January storm''s seizure of power and thorough revolution must be finished by the workers, peasants and soldiers, the masters of the age; intellectuals change fast and sense things quickly but are limited by their instincts, short of thorough revolutionary spirit and often speculative; the book gives no other point of the entry, n.45). Made public: [[w.jin-1949-1989-niande-zhongguo]], 611 (1989; copyright page seen: priced, ISBN, Xinhua, no 内部 mark). Circulated in China: [[w.zheng-fa-hong-qi]], Oct. 17, 1967, 5 (a Red Guard paper; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.64a). Check: MacFarquhar (50) has Mao tell a visiting Albanian delegation in 1967 that it would have been "unsafe" to walk Peking''s streets before May 1966, and that two divisions were added to the garrison when the reorganization of the Peking committee was announced; whether this talk. Check: the day; the book dates the talk by its audience ("a delegation of visiting Albanian officers") only; the entry has "a foreign military delegation" in May. To check: [[w.nianyi-guanyu-he-long-yuanande]], 3 (cited by [[w.macfarquhar-maos-last-revolution]], 50 n.85); Minutes of Mao Zedong''s conversation with Albanian visitors, transcript in Chinese diary no. 10, in the authors'' possession (cited by [[w.macfarquhar-maos-last-revolution]], 171 n.3); [[w.zheng-fa-hong-qi]], Oct. 17, 1967, 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.64a); Mao Zedong, remarks to an Albanian military delegation, May 1967, quoted in [[w.jin-1949-1989-niande-zhongguo]], 611 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.64b); Mao Zedong 毛泽东, talk with a foreign military delegation 外国军事代表团 (record 谈话记录), May 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.45). Names: Mao Zedong, Lin Biao, Yao Wenyuan, Jiang Qing, Qi Benyu. Check: the delegation and the day; the nianpu gives only "5月."'
    src:
      c: a8102a9f
      rows:
