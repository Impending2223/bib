entries:
  - id: cal.1967-05-01.railroads
    when: May 1–2
    date: '1967-05-01'
    thread: railroads
    c: 'The shop crafts'' dispute: six unions, 137,000 men who maintain the rolling stock, against nearly all the major railroads, mainly on wages. H.J. Res. 543, the no-strike period extended to June 19: House, [302–56](https://voteview.com/rollcall/RH0900049); Senate, [72–2](https://voteview.com/rollcall/RS0900077); signed May 2, [81 Stat. 13](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg13-3.pdf).'
    n: 'Statute (K–J Cong. II.J.2). Check: the Record''s pages. See [[cal.1967-01-28.railroads]]; [[cal.1967-04-28.railroads]].'
  - id: cal.1967-05-01.vietnam
    when: May 1
    date: '1967-05-01'
    thread: vietnam
    also: [congress, republican-party-congress]
    c: 'The Senate Republican Policy Committee''s staff paper, "The War in Vietnam," made public: American policy in Indochina since 1945, no alternative offered; what the American interest in Southeast Asia is, and how much further the party and the nation will go for it. Prepared after the committee''s meeting of late March, at Javits''s suggestion. The leadership shelves it.'
    n: 'The paper''s text, inserted by Findley, May 9: [113 Cong. Rec. 12030](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-1.pdf#page=55)–41 (its "two basic questions": "What precisely is our national interest in Thailand, Cambodia, Vietnam, and Laos?" and "To what further lengths are we prepared to go in support of this interest?"). Miller, May 2: [113 Cong. Rec. 11437](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-3-2.pdf#page=27) ("released to the press media yesterday"). [[w.johns-vietnams-second-front]], 150. To check: [[w.gibbons-u-s-government-and]], IV, 672–74 (released by Hickenlooper, the committee''s chairman); Congressional Quarterly Fact Sheet, May 31, 1967, Democratic National Committee Series I, box 131, LBJ Library; *Wall Street Journal*, May 11, 1967 (cited by [[w.johns-vietnams-second-front]], 150 n.115, for the release and the shelving). Names: Javits.'
    src:
      c: 6f88ea6a
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-3-2.pdf#page=27: A'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-1.pdf#page=55: A-B'
        - 'w.johns-vietnams-second-front 150: all'
        - 'via w.johns-vietnams-second-front 150 n.115a: A, D'
        - 'via w.johns-vietnams-second-front 150 n.115b: A, D'
    tags: [name:javits-jacob-k]
  - id: cal.1967-05-01.vietnam-program-5
    when: May 1
    date: '1967-05-01'
    thread: vietnam-program-5
    c: 'William Bundy to Katzenbach: against a large increase and a call-up, whose debate "could only encourage Hanoi"; against mining Haiphong; "totally against" invading the North, a 75–25 chance of bringing China in. A steady program for nine months: the "very jerky and impatient impression" given Hanoi since December.'
    n: 'FRUS 1964–68, V, doc. [154](https://history.state.gov/historicaldocuments/frus1964-68v05/d154). [[w.gibbons-u-s-government-and]], IV, 622–23. Made public: [[w.pentagon-papers]] (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: William Bundy, Katzenbach.'
    tags: [name:bundy-william, name:katzenbach-nicholas]
  - id: cal.1967-05-01.vietnam-program-5-2
    when: May 1
    date: '1967-05-01'
    thread: vietnam-program-5
    c: 'Enthoven to McNamara, "Increase of Southeast Asia Forces": an enemy that "just may have found a dangerously clever strategy for licking the United States," holding its losses to what it can bear while waiting for American opinion to turn. More combat forces "a step in the wrong direction."'
    n: 'FRUS 1964–68, V, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v05/d155) (editorial note). [[w.gibbons-u-s-government-and]], IV, 627–29. Made public: [[w.pentagon-papers]], IV, 463–68 (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: Enthoven, McNamara.'
    tags: [name:enthoven-alain-c, name:mcnamara-robert-s]
  - id: cal.1967-05-01.vietnam-congress
    when: May 1
    date: '1967-05-01'
    thread: vietnam-congress
    c: Breakfast, 8:30 to 10:03 a.m., Johnson with Mansfield and Morse on the U.N. approach; Rusk, Rostow, Katzenbach, Goldberg and Califano with him. No record.
    n: 'Rostow to Johnson, Apr. 30, [FRUS 1964–68, V: Vietnam, 1967, doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v05/d152), n. 3 (the breakfast, off the record, on the U.N. approach). [[w.gibbons-u-s-government-and]], IV, 678. Check: FRUS''s note names Mansfield, Morse, Rusk, Katzenbach, Goldberg and Califano, not Rostow, and gives no hours. See [[cal.1967-04-29.vietnam-congress]]. Names: Johnson, Mansfield, Morse, Rusk, Rostow, Katzenbach, Goldberg, Califano.'
    src:
      c: 8d757419
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d152: A-C'
        - 'w.gibbons-u-s-government-and IV, 678: all'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, name:morse-wayne, name:rusk-dean, name:rostow-walt-w, name:katzenbach-nicholas, name:goldberg-arthur-j, name:califano-joseph-a-jr]
  - id: cal.1967-05-02.mayors-gary
    when: May 2
    date: '1967-05-02'
    thread: mayors
    also: [elections-1967]
    c: Gary, Democratic primary for mayor. Richard Hatcher, a Negro member of the city council, over Mayor Katz, 18,227 to 16,107, 39.3 percent; a third 12,092, 26.0 percent.
    n: 'Votes: [Wikipedia, "1967 Gary, Indiana, mayoral election"](https://en.wikipedia.org/wiki/1967_Gary,_Indiana,_mayoral_election), from Our Campaigns. Check: the Lake County canvass. To check: [[w.poinsett-black-power-gary-style]]; [[w.nelson-electing-black-mayors]]. Names: Hatcher, Katz.'
    tags: [state:in, city:gary, name:hatcher-richard-g, name:katz-a-martin]
  - id: cal.1967-05-02.black-nationalism-oakland
    when: May 2
    date: '1967-05-02'
    thread: black-nationalism
    also: [crime-and-hijacking]
    c: Sacramento. Armed Black Panthers from Oakland, some thirty, led by Seale, at the Capitol against Mulford's bill to forbid carrying loaded guns in public; Seale reads the party's "Executive Mandate Number One" on the steps; the group enters the Assembly's chamber. Seale and others arrested.
    n: 'A.B. 1591 (Mulford), 1967 Regular Session. To check: [[w.bloom-black-against-empire]]; [[w.seale-seize-the-time]]; [[w.newton-revolutionary-suicide]]; [[w.winkler-gunfight]]. See [[cal.1966-10-15.black-nationalism]]. Names: Seale, Mulford. Check: the number and the arrests.'
    tags: [state:ca, city:oakland, name:seale-bobby, name:mulford-don]
  - id: cal.1967-05-02.mississippi
    when: May 2
    date: '1967-05-02'
    thread: mississippi
    also: [voting-rights]
    c: 'Sunflower, Sunflower County. The town election held again under the Fifth Circuit''s order: an all-Negro slate for mayor and five aldermen, Negroes 185 of the 339 registered. Every Negro candidate loses, by some seventy votes on the average, federal observers present; whites photograph the Negro voters in line.'
    n: '*Hamer v. Campbell*, [358 F.2d 215](https://static.case.law/f2d/358/case-pdfs/0215-01.pdf) (5th Cir. 1966). [[w.dittmer-local-people]], 411–13. To check: [[w.parker-black-votes-count]].'
    tags: [state:ms]
  - id: cal.1967-05-02.vietnam
    when: May 2
    date: '1967-05-02'
    thread: vietnam
    also: [congress, republican-party-congress]
    c: 'Tower on the Policy Committee''s paper: "neither party policy nor a Senate Republican party position. It was simply a ''think piece.''" Reagan, at a press conference: "our goal should be to win."'
    n: '[[w.johns-vietnams-second-front]], 150–51. To check: Tower, statement, May 2, 1967, box 25/12, Tower Papers (cited by [[w.johns-vietnams-second-front]], 150 n.116). See [[cal.1967-05-01.vietnam]]. Names: Tower, Reagan.'
    src:
      c: '55614758'
      rows:
        - 'w.johns-vietnams-second-front 150–51: all'
        - 'via w.johns-vietnams-second-front 150 n.116: A'
    tags: [name:tower-john-g, name:reagan-ronald]
  - id: cal.1967-05-02.vietnam-2
    when: May 2
    date: '1967-05-02'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Tuesday lunch, 1:27 to 2:50 p.m., Johnson with Rusk, McNamara, Rostow and Christian. On the agenda McNamara''s proposal: finish the major targets, the power plants of Hanoi and Haiphong; then shift the bombing south of the 20th parallel, the Russians "quietly notified"; and Mansfield''s U.N. approach, put off at least to June, by Sisco''s memorandum of May 12. No notes.'
    n: '[[w.gibbons-u-s-government-and]], IV, 631, 678–79. To check: the agenda (LBJ Library, NSF Files of Walt W. Rostow); Sisco to Rusk, May 12, 1967 (State, Central File, Pol 27 Viet S). Names: Johnson, Rusk, McNamara, Rostow, Christian, Mansfield, Sisco.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:christian-george, name:mansfield-mike, name:sisco-joseph-j]
  - id: cal.1967-05-03.opinion
    when: May 3
    date: '1967-05-03'
    thread: opinion
    also: [congress]
    c: 'Gallup, Apr. 19–24: members of Congress required to make public a record of their financial assets and holdings every year: favor 69 percent, oppose 20. Republicans 69, Democrats 70, independents 69 in favor.'
    n: '[[w.gallup-poll]], III, 2062.'
  - id: cal.1967-05-03.vietnam-program-5
    when: May 3
    date: '1967-05-03'
    thread: vietnam-program-5
    c: 'McGeorge Bundy to Johnson: more troops and escalation "inevitable, in the framework of strictly military analysis," but a mistake; tactical bombing yes, the power plants no, hit "because we have ''run out'' of other targets"; a publicly proclaimed limit, Norstad and Bradley to rally the generals. "The present issue is not ''negotiation.'' It is ''escalation.''" The *New York Times* the same day reports Westmoreland''s request.'
    n: 'FRUS 1964–68, V, doc. [157](https://history.state.gov/historicaldocuments/frus1964-68v05/d157). [[w.gibbons-u-s-government-and]], IV, 623–26, 631 (the *Times*). Made public: [[w.pentagon-papers]], IV, 157–60 (1971). To check: *New York Times*, May 3 and 4, 1967. See [[cal.1967-04-24.vietnam-program-5]]. Names: McGeorge Bundy, Johnson, Norstad, Bradley, Westmoreland.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:norstad-lauris, name:bradley-omar-n, name:westmoreland-william]
  - id: cal.1967-05-03.vietnam-congress
    when: May 3
    date: '1967-05-03'
    thread: vietnam-congress
    c: 'A second breakfast, 8:30 to 9:55 a.m., Johnson with Mansfield, Morse, Rusk, Rostow, Katzenbach and Goldberg. No notes. Mansfield to Johnson after it, on Katzenbach''s word "phony": he wants "no part of any ''phony'' proposal"; a bona fide one could be taken for one by its tone, a new military enterprise beside it, or leaks.'
    n: 'Rostow to Johnson, Apr. 30, [FRUS 1964–68, V: Vietnam, 1967, doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v05/d152), n. 3 (the breakfast of May 3, Rostow in Califano''s place; Mansfield''s memorandum of May 3 on Katzenbach''s "phony"). [[w.gibbons-u-s-government-and]], IV, 679–80. To check: Mansfield to Johnson, May 3, 1967 (LBJ Library, NSF Country File, Vietnam, Mansfield Memo & Reply, by FRUS). Check: FRUS''s note quotes the proposal as seen phony only through "some unwitting action or ineptitude," not the entry''s tone, new military enterprise or leaks. See [[cal.1967-05-01.vietnam-congress]]. Names: Johnson, Mansfield, Morse, Rusk, Rostow, Katzenbach, Goldberg.'
    src:
      c: 0fd7265c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d152: A, C'
        - 'w.gibbons-u-s-government-and IV, 679–80: all'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, name:morse-wayne, name:rusk-dean, name:rostow-walt-w, name:katzenbach-nicholas, name:goldberg-arthur-j]
  - id: cal.1967-05-03.vietnam
    when: May 3
    date: '1967-05-03'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Tower to Hickenlooper, the Policy Committee''s chairman: he regrets the paper "made public to the press before the originally planned conference was held on it"; Hanoi may read it as a sign that one party is "on the verge of withdrawing support to the President in the war."'
    n: '[[w.johns-vietnams-second-front]], 150. To check: Tower to Hickenlooper, May 3, 1967, box 25/12, Tower Papers (cited by [[w.johns-vietnams-second-front]], 150 n.117). See [[cal.1967-05-01.vietnam]]. Names: Tower, Hickenlooper.'
    src:
      c: 2299f1b5
      rows:
        - 'w.johns-vietnams-second-front 150: all'
        - 'via w.johns-vietnams-second-front 150 n.117: all'
    tags: [name:tower-john-g, name:hickenlooper-bourke-b]
  - id: cal.1967-05-04.railroads
    when: May 4
    date: '1967-05-04'
    thread: railroads
    c: 'The shop crafts'' dispute. Johnson''s message: a Special Board of five public members, a further 90 days without strike or lockout, its terms binding if the parties do not agree.'
    n: 'Special Message to the Congress Recommending Procedures To Complete Collective Bargaining in the Railway Labor Dispute, [1967 Pub. Papers 506](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=574) (May 4, 1967). See [[cal.1967-05-01.railroads]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-05-04.vietnam
    when: May 4
    date: '1967-05-04'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Lunch, 1:32 to 3:00 p.m., Johnson with Rusk, McNamara, Rostow, McPherson and Christian: the power plants of Hanoi and Haiphong, and the cutback to follow. Put off, by Rostow''s note on his agenda.'
    n: '[[w.gibbons-u-s-government-and]], IV, 631. To check: the agenda (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-05-02.vietnam-2]]. Names: Johnson, Rusk, McNamara, Rostow, McPherson, Christian.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:mcpherson-harry, name:christian-george]
  - id: cal.1967-05-04.vietnam-congress
    when: May 4
    date: '1967-05-04'
    thread: vietnam-congress
    c: 'Johnson, by an unsigned note passed to Christian: Christian should one day have a statement that the President "is not going to argue with Fulbright"; "This man is doing everything he can to create problems for the President." Fulbright had asked Rusk, Apr. 27, to testify in public; Rusk, May 2: in executive session.'
    n: '[[w.gibbons-u-s-government-and]], IV, 680–81. To check: the note, May 4, 1967 (LBJ Library, Ex FG 1 ND 19/CO 312); Rusk to Fulbright, May 2, 1967 (State, Lot File 74 D 164). Names: Johnson, Christian, Fulbright, Rusk.'
    tags: [name:johnson-lyndon-b, name:christian-george, name:fulbright-j-william, name:rusk-dean]
  - id: cal.1967-05-05.vietnam-operations
    when: May 5
    date: '1967-05-05'
    thread: vietnam-operations
    c: 'The Marines take Hill 881 North, 2:45 p.m. The first battle for Khe Sanh, Apr. 24–May 11: reported, 940 of the enemy killed; 155 Marines dead, 425 wounded. The 26th Marines take over the base and the hills, May 11–13.'
    n: '[[w.telfer-u-s-marines-in]], 44–46. See [[cal.1967-04-24.vietnam-operations]].'
    tags: [place:khe-sanh]
  - id: cal.1967-05-06.vietnam
    when: May 6
    date: '1967-05-06'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Rostow, "U.S. Strategy in Vietnam," to Johnson, Rusk, Vance, Katzenbach, McNaughton, William Bundy and Helms: strike the Hanoi power plant, but not "the top of the funnel," the ports and the railways to China; then shift the bombing south of the 20th parallel, with strikes in the north as needed.'
    n: 'FRUS 1964–68, V, doc. [162](https://history.state.gov/historicaldocuments/frus1964-68v05/d162). [[w.gibbons-u-s-government-and]], IV, 632–33. Made public: FRUS 1964–68, V (2002). See [[cal.1967-05-02.vietnam-2]]. Names: Rostow, Johnson, Rusk, Vance, Katzenbach, McNaughton, William Bundy, Helms.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:rusk-dean, name:vance-cyrus, name:katzenbach-nicholas, name:mcnaughton-john-t, name:bundy-william, name:helms-richard]
  - id: cal.1967-05-07.opinion
    when: May 7
    date: '1967-05-07'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 19–24: Johnson''s handling of Vietnam: approve 43 percent, disapprove 42. Republicans 34 and 52; Democrats 52 and 34; independents 40 and 46.'
    n: '[[w.gallup-poll]], III, 2062–63. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-05-09.vietnam
    when: May 9–11
    date: '1967-05-09'
    thread: vietnam
    c: 'NSAM 362: American support of pacification ("Revolutionary Development") put under one manager, Westmoreland, "under the overall authority of the Ambassador." The Office of Civil Operations becomes part of MACV; Komer to be Westmoreland''s Deputy for Pacification, with the personal rank of ambassador. Bunker announces it in Saigon May 11. Civil Operations and Revolutionary Development Support (CORDS).'
    n: 'FRUS 1964–68, V, doc. [167](https://history.state.gov/historicaldocuments/frus1964-68v05/d167) (NSAM 362). [[w.cosmas-joint-chiefs-of-staff]], 108 (the decision; Komer; CORDS). To check: [[w.scoville-reorganizing-for-pacification-support]]; [[w.jones-blowtorch]]; [[w.hunt-pacification]]; [[w.komer-bureaucracy-at-war]]; [[w.schaffer-ellsworth-bunker]]. Names: Westmoreland, Komer, Bunker, Johnson.'
    src:
      c: 1fe6eb49
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d167: all'
        - 'w.cosmas-joint-chiefs-of-staff 108: A-C, E'
        - 'via w.cosmas-joint-chiefs-of-staff 108 n.11a: A-C, E'
        - 'via w.cosmas-joint-chiefs-of-staff 108 n.11b: A-C, E'
    tags: [name:johnson-lyndon-b, name:westmoreland-william, name:komer-robert-w, name:bunker-ellsworth, place:saigon]
  - id: cal.1967-05-09.vietnam-congress
    when: May 9
    date: '1967-05-09'
    thread: vietnam-congress
    c: 'Senators against invading the North. Morton: "I do not know of any member of this body who wants an invasion of North Vietnam"; Cooper with him. Symington: more troops, more casualties, a clash with China; "The results of such action on our part, therefore, are incalculable."'
    n: '[113 Cong. Rec., Senate, May 9, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-2.pdf), 12113 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 617. Gibbons puts it "toward the end of May"; his page is in the Senate''s day of May 9. See [[cal.1967-04-27.vietnam-program-5]]. Names: Morton, Cooper, Symington.'
    tags: [name:morton-thruston-b, name:cooper-john-sherman, name:symington-william-s]
  - id: cal.1967-05-10.opinion
    when: May 10
    date: '1967-05-10'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Apr. 19–24: the Democratic convention''s choice between Robert Kennedy and Johnson: Johnson 49 percent, Kennedy 37, undecided 14. On a scale from plus 5 to minus 5: Kennedy highly favorable 30, highly unfavorable 13; Johnson 34 and 8.'
    n: '[[w.gallup-poll]], III, 2063. Names: Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1967-05-11.mississippi
    when: May 11
    date: '1967-05-11'
    thread: mississippi
    also: [students]
    c: 'Jackson. On the second night of protest at Jackson State College, police fire on the crowd: Ben Brown, a movement worker since the Freedom Rides, killed, shot in the back and the back of the head; several wounded. The police: a bystander caught in a crossfire.'
    n: '[[w.dittmer-local-people]], 413–14. Names: Brown.'
    tags: [state:ms, city:jackson, name:brown-ben]
  - id: cal.1967-05-11.vietnam-congress
    when: May 11
    date: '1967-05-11'
    thread: vietnam-congress
    c: 'Morton in the Senate, on pacification put under Westmoreland: American troops in pacification "could very well become another step in the Americanization of the entire conflict"; the war "an almost unbroken series of promising programs followed by disappointing results followed by increased U.S. involvement."'
    n: '[113 Cong. Rec., Senate, May 11, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-9-2.pdf), 12494 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 684–85. See [[cal.1967-05-09.vietnam]]. Names: Morton, Westmoreland.'
    tags: [name:morton-thruston-b, name:westmoreland-william]
  - id: cal.1967-05-12.civil-rights-organizations
    when: May 12
    date: '1967-05-12'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: Atlanta. SNCC's central committee chooses H. Rap Brown, 23, its Alabama project director, chairman for Carmichael. Check the date and the meeting.
    n: 'To check: [[w.carson-in-struggle]]; [[w.brown-die-nigger-die]]; [[w.carmichael-ready-for-revolution]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-05-16.civil-rights-organizations]]. Names: Brown, Carmichael.'
    tags: [name:brown-h-rap, name:carmichael-stokely]
  - id: cal.1967-05-12.states-and-cities-fl
    when: May 12
    date: '1967-05-12'
    thread: states-and-cities
    c: 'Florida. Kirk signs the act creating the Reedy Creek Improvement District, for the Walt Disney Company''s land southwest of Orlando: a district with powers of its own over planning, building codes, roads, water, drainage and utilities, governed by its landowners; two cities within it.'
    n: 'Laws of Fla. 1967, [ch. 67-764](https://edocs.dlis.state.fl.us/fldocs/leg/actsflorida/1967/LOF1967V1Pt2Ch0614-1068.pdf) (Check: the bill). To check: [[w.kallina-claude-kirk-and-the]]. See [[cal.1967-01.crime-and-hijacking-fl]]. Names: Kirk.'
    tags: [state:fl, name:kirk-claude-r-jr]
  - id: cal.1967-05-12.vietnam-congress
    when: May 12
    date: '1967-05-12'
    thread: vietnam-congress
    also: [vietnam-air-war]
    c: 'Dinner at the White House, Johnson, Russell, Mrs. Johnson and McPherson. Johnson''s three choices: more bombing in the North; the DMZ alone; the 17th to the 20th parallel made "a desert." Russell: "We''ve just got to finish it soon," blockade the ports. Johnson: that would bring war sooner than anything; of the Hanoi power plant, half a mile from Hồ''s headquarters, "Suppose we missed."'
    n: '[[w.gibbons-u-s-government-and]], IV, 685–86 (notes typed on the Daily Diary for May 12 by a secretary present). To check: the Daily Diary, May 12, 1967 (LBJ Library). Names: Johnson, Russell, Lady Bird Johnson, McPherson, Hồ Chí Minh.'
    tags: [name:johnson-lyndon-b, name:russell-richard-b, name:johnson-lady-bird, name:mcpherson-harry, name:ho-chi-minh]
  - id: cal.1967-05-14.opinion
    when: May 14
    date: '1967-05-14'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 19–24: go all out for a military victory, using atom bombs and weapons: agree 26 percent, disagree 64. The United States made a mistake in sending troops: yes 37, no 50. Our part in the war morally justified: yes 59, no 26.'
    n: '[[w.gallup-poll]], III, 2063. [[w.gibbons-u-s-government-and]], IV, 692.'
  - id: cal.1967-05-14.vietnam-operations
    when: May 14
    date: '1967-05-14'
    thread: vietnam-operations
    c: 'Junction City ends at midnight, the largest offensive operation of the war to that time. Its final totals: 2,728 of the enemy killed, 34 prisoners, 139 ralliers; 100 crew-served and 491 individual weapons, over 810 tons of rice. American losses 282 killed, 1,576 wounded.'
    n: '[[w.rogers-cedar-falls-junction-city]], 149–151. See [[cal.1967-02-22.vietnam]].'
    tags: [place:junction-city, place:war-zone-c]
  - id: cal.1967-05-15.court
    when: May 15
    date: '1967-05-15'
    thread: court
    also: [crime-and-hijacking]
    c: '*In re Gault*, [387 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep387/usrep387001/usrep387001.pdf): a boy of 15 committed by a juvenile court in Gila County, Ariz., to the State Industrial School until 21 for an obscene telephone call, for which an adult could be fined $50 or jailed two months. A juvenile in proceedings that may end in commitment has a right to notice of the charges, to counsel, to confront and cross-examine witnesses, and against self-incrimination. Fortas for the Court; Black and White concurring; Harlan concurring in part and dissenting in part; Stewart dissenting.'
    n: 'To check: [[w.tanenhaus-constitutional-rights-of-children]]; [[w.kalman-abe-fortas]]; [[w.powe-warren-court-and-american]]. Names: Fortas.'
    tags: [name:fortas-abe]
  - id: cal.1967-05-15.robert-kennedy
    when: May 15
    date: '1967-05-15'
    thread: robert-kennedy
    also: [elections-1968, vietnam]
    c: 'CBS, *Town Meeting of the World*: Robert Kennedy and Reagan on the war, answering students in Europe by satellite (Check where).'
    n: 'To check: [[w.kennedy-town-meeting-of-the]]; [[w.cannon-governor-reagan]]. Names: Robert Kennedy, Reagan.'
    tags: [name:kennedy-robert-f, name:reagan-ronald]
  - id: cal.1967-05-15.trade
    when: May 15–16
    date: '1967-05-15'
    thread: trade
    also: [european-community, farm]
    c: 'Geneva, late May 15: general agreement in the Kennedy Round, Roth and Blumenthal for the United States. Concessions on $7½ to $8 billion of American exports and as much of imports; industrial tariffs cut 33 to 35 percent on average, short of the 50 percent sought; a grains arrangement, wheat at no less than $1.73 a bushel, and 4½ million tons of food aid a year; chemicals, apart from a separate package on the American Selling Price. May 16, Humphrey, Rusk and Freeman brief 23 members of Congress; Johnson''s statement: "a final agreement covering billions of dollars worth of trade among more than 50 countries."'
    n: 'FRUS 1964–68, VIII, docs. [357](https://history.state.gov/historicaldocuments/frus1964-68v08/d357), [359](https://history.state.gov/historicaldocuments/frus1964-68v08/d359), [360](https://history.state.gov/historicaldocuments/frus1964-68v08/d360), [361](https://history.state.gov/historicaldocuments/frus1964-68v08/d361), [362](https://history.state.gov/historicaldocuments/frus1964-68v08/d362). Statement by the President on the General Agreement Reached in the Kennedy Round Trade Negotiations at Geneva, [1967 Pub. Papers 540](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=608) (May 16, 1967). [[w.schwartz-lyndon-johnson-and-europe]], 168–71 (the last bargaining; the American Selling Price). To check: [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]; [[w.zeiler-american-trade-and-power]]; [[w.coppolaro-making-of-a-world]]. See [[cal.1964-05-04.trade]]. Names: Roth, Blumenthal, Humphrey, Rusk, Freeman, Johnson. Check: Schwartz, 171, after a later study, gives average cuts of 36 to 39 percent.'
    tags: [name:roth-william-m, name:blumenthal-w-michael, name:humphrey-hubert-h, name:rusk-dean, name:freeman-orville-l, name:johnson-lyndon-b]
  - id: cal.1967-05-15.vietnam-congress
    when: May 15
    date: '1967-05-15'
    thread: vietnam-congress
    c: 'Cooper in the Senate: more force may shut off talks and bring in China and the Soviet Union, "the dread possibility" of a third world war. Confine the bombing to the southern panhandle; if Hanoi shows interest, stop it. Milton Young finds "much merit"; Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson and Morse with him.'
    n: '[113 Cong. Rec., Senate, May 15, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-1.pdf), 12578–610 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 683–85. To check: *New York Times*, May 16, 1967. Names: Cooper, Young, Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson, Morse.'
    tags: [name:cooper-john-sherman, name:young-milton-r, name:morton-thruston-b, name:mccarthy-eugene-j, name:mansfield-mike, name:church-frank, name:aiken-george-d, name:fulbright-j-william, name:pell-claiborne-d, name:carlson-frank, name:morse-wayne]
  - id: cal.1967-05-16.middle-east
    when: May 16
    date: '1967-05-16'
    thread: middle-east-six-day-war
    c: 'Egypt''s troops into Sinai from May 14, on Soviet reports of Israeli forces massed against Syria. 10 p.m., a letter from Mohammed Fawzi, the UAR''s chief of staff, to Rikhye, commanding the UN Emergency Force: withdraw UNEF''s troops from the observation posts on the border. U Thant: a request must come to him from the government, and he would then withdraw the whole force from Gaza and Sinai.'
    n: 'FRUS 1964–68, XIX, doc. [6](https://history.state.gov/historicaldocuments/frus1964-68v19/d6). [[w.drea-mcnamara-clifford-and-the-2011]], 428 (Egypt''s mobilization May 14 on the Soviet report; the demand of May 16 for UNEF''s partial withdrawal); [[w.poole-joint-chiefs-of-staff-2012]], 169 (the troops; the demand); [[w.johnson-vantage-point]], 290 (Egypt asks for UNEF withdrawn; U Thant). To check: [[w.parker-politics-of-miscalculation-in]]; [[w.six-day-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.oren-six-days-of-war]]; [[w.ferris-nassers-gamble]]; [[w.segev-1967]]; [[w.spiegel-other-arab-israeli-conflict]]; Saunders, "The President in the Middle East Crisis, May 12–June 19, 1967," Dec. 19, 1968, NSC History of Middle East Crisis, NSF, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 428 n.8). Names: Mohammed Fawzi, Rikhye, U Thant.'
    src:
      c: 198961f7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v19/d6: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 428: A-B'
        - 'via w.drea-mcnamara-clifford-and-the-2011 428 n.8a: A'
        - 'w.johnson-vantage-point 290: ?'
        - 'w.poole-joint-chiefs-of-staff-2012 169: A-B'
    tags: [name:fawzi-mohammed, name:rikhye-indar-jit, name:u-thant, name:nasser-gamal-abdel]
  - id: cal.1967-05-16.mayors-philadelphia
    when: May 16
    date: '1967-05-16'
    thread: mayors
    also: [elections-1967]
    c: 'Philadelphia primaries for mayor. Democratic: Mayor Tate over Hemphill, the city controller, the city chairman''s choice, 152,949 to 81,238, 63.8 percent. Republican: Specter, the district attorney, nominated.'
    n: 'Votes: *Philadelphia Inquirer*, May 18, 1967, 4, as [Wikipedia, "1967 Philadelphia mayoral election"](https://en.wikipedia.org/wiki/1967_Philadelphia_mayoral_election) gives them. Check: the County Board of Elections'' returns. To check: [[w.clark-rally-and-relapse-1946]]; [[w.specter-passion-for-truth]]; [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1963-11-05.mayors-philadelphia]]. Names: Tate, Hemphill, Specter.'
    tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:hemphill-alexander, name:specter-arlen]
  - id: cal.1967-05-16.state-constitutions-pa
    when: May 16
    date: '1967-05-16'
    thread: state-constitutions
    also: [legislatures]
    c: 'Pennsylvania''s voters, at the primary, call a constitutional convention of limited powers under the act of Mar. 15: taxation and finance, the judiciary, the legislature''s apportionment, local government. 163 members: three delegates from each Senate district, to be chosen in November, and the legislature''s leaders. Check the vote.'
    n: '[Act of Mar. 15, 1967, P.L. 2, No. 2](https://www.legis.state.pa.us/WU01/LI/LI/US/PDF/1967/0/0002..PDF), with the compiler''s note of the vote. Check: the *Pennsylvania Manual*, vol. 98. To check: [[w.beers-pennsylvania-politics-today-and]].'
    tags: [state:pa]
  - id: cal.1967-05-16.electoral-college
    when: May 16–18
    date: '1967-05-16'
    thread: electoral-college
    also: [amendments, congress]
    c: 'Bayh''s subcommittee resumes on the election of the President, eleven resolutions of the 90th Congress before it. Bayh: "antiquated, really undemocratic," and "dangerous"; "I have changed my mind since the first day." May 17, the Bar Association''s president and Storey and his commission for direct election. May 18, Clarence Mitchell for the NAACP: no division of a State''s electoral votes by its popular vote.'
    n: '*Election of the President* hearings, [245–46](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=253), [316–18](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=326), [427](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=437). See [[cal.1967-01-11.electoral-college]]. Names: Bayh, Storey, Mitchell.'
    tags: [name:bayh-birch, name:storey-robert-g, name:mitchell-clarence-jr]
  - id: cal.1967-05-16.vietnam
    when: May 16
    date: '1967-05-16'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Tuesday lunch, 1:10 to 3:05 p.m., Johnson with Humphrey, Rusk, McNamara, Rostow, Helms, Wheeler and Christian, on bombing the Hanoi power plant. No notes. Kohler to Rusk the same day: drop it for good, inconsistent with seeking Moscow''s help toward talks.'
    n: 'William Bundy''s memorandum, May 16, [FRUS 1964–68, V: Vietnam, 1967, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v05/d174), n. 5 (the lunch, those present, no notes found) and n. 2 (Kohler to Rusk, May 16: the power plant "dropped permanently from the approved list"). [[w.gibbons-u-s-government-and]], IV, 636. To check: the agenda (LBJ Library, Files of Walt W. Rostow). Check: FRUS''s note, by the Daily Diary, has the lunch from 1:10 to 3:25 p.m. See [[cal.1967-05-02.vietnam-2]]. Names: Johnson, Humphrey, Rusk, McNamara, Rostow, Helms, Wheeler, Christian, Kohler.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:helms-richard, name:wheeler-earle, name:christian-george, name:kohler-foy-d]
  - id: cal.1967-05-17.cities-and-housing
    when: May 17
    date: '1967-05-17'
    thread: cities-and-housing
    c: 'The House on the HUD and independent offices appropriation, H.R. 9960: the $10 million for rent supplements struck, [233–171](https://voteview.com/rollcall/RH0900054); recommittal to cut Model Cities from $225 million for operations to $12 million for planning lost, [193–213](https://voteview.com/rollcall/RH0900055); passed, [347–56](https://voteview.com/rollcall/RH0900056).'
    n: 'To check: [[w.haar-between-the-idea-and]]. See [[cal.1966-01-26.cities-and-housing]]; [[cal.1966-05-13.cities-and-housing]].'
  - id: cal.1967-05-17.opinion
    when: May 17
    date: '1967-05-17'
    thread: opinion
    also: [congress, amendments, electoral-college]
    c: 'Gallup, Jan. 26–31: a constitutional amendment to abolish the Electoral College and elect the President by the national popular vote: approve 58 percent, disapprove 22. Republicans 63, Democrats 53, independents 67 approve.'
    n: '[[w.gallup-poll]], III, 2063–64.'
  - id: cal.1967-05-17.states-and-cities-tn
    when: May 17
    date: '1967-05-17'
    thread: states-and-cities
    c: 'Tennessee repeals the Butler Act of 1925, which forbade teaching that man descended from a lower order of animals: passed May 13, approved by Ellington, in force Sept. 1. Gary Scott, a teacher at Jacksboro, Tenn., dismissed under it, had sued in federal court at Nashville.'
    n: 'Tenn. Pub. Acts 1967, ch. 237 (H.B. 48), [text](http://law2.umkc.edu/faculty/projects/ftrials/scopes/tennstat.htm). [Wikipedia, "Butler Act"](https://en.wikipedia.org/wiki/Butler_Act). To check: [[w.larson-summer-for-the-gods]]. Names: Ellington.'
    tags: [state:tn, name:ellington-buford]
  - id: cal.1967-05-17.vietnam-congress
    when: May 17
    date: '1967-05-17'
    thread: vietnam-congress
    c: 'Sixteen Senators led by Church, the text coordinated with State, "A Plea for Realism": for a negotiated settlement, but "steadfastly opposed to any unilateral withdrawal"; no "misconceptions in Hanoi." Cooper and Hatfield the Republicans; eighteen House Democrats with them.'
    n: '[113 Cong. Rec., Senate, May 17, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-3-1.pdf), 13011–13 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 686. To check: *New York Times*, May 17 and 18, 1967. Names: Church, Cooper, Hatfield.'
    tags: [name:church-frank, name:cooper-john-sherman, name:hatfield-mark-o]
  - id: cal.1967-05-17.vietnam-support
    when: May 17
    date: '1967-05-17'
    thread: vietnam-support
    c: 'Rowe to Johnson, "Vietnam and a ''Third Force,''" with McPherson and Roche, at Louis Martin''s instigation: a committee of independents, Republicans and intellectuals as a "rally ground"; "It is elementary that this is an unpopular war." Califano: "This looks like a great idea to me."'
    n: '[[w.gibbons-u-s-government-and]], IV, 701–02. To check: Rowe to Johnson, May 17, 1967 (LBJ Library, C.F. ND 19/CO 312). See [[cal.1967-03-17.vietnam-support]]. Names: Rowe, Johnson, McPherson, Roche, Califano.'
    tags: [name:rowe-james-h-jr, name:johnson-lyndon-b, name:mcpherson-harry, name:roche-john-p, name:califano-joseph-a-jr]
  - id: cal.1967-05-17.war-opposition
    when: May 17–19
    date: '1967-05-17'
    thread: war-opposition
    c: 'Spock, Coretta King and Bevel of the Spring Mobilization at the White House gate, asking to see Johnson; a petition read. May 18, Bevel''s letter asking him to address their conference. Johnson: "Walt. Have Moose reply." May 19, Moose declines and hears out their speakers.'
    n: '[[w.gibbons-u-s-government-and]], IV, 699. To check: the documents (LBJ Library, NSF Country File, Vietnam). Names: Spock, Coretta King, Johnson, Rostow, Moose.'
    tags: [name:spock-benjamin, name:king-coretta-scott, name:johnson-lyndon-b, name:rostow-walt-w, name:moose-richard-m]
  - id: cal.1967-05-17.opinion-2
    when: May 17
    date: '1967-05-17'
    thread: opinion
    also: [vietnam]
    c: 'Harris Survey: "total military victory" 45 percent, 43 in February; withdrawal of both sides'' forces under U.N. supervision 41, 44 in February. A long war 81. Johnson''s handling of the war approved 70; the bombing helping to win it 55, 61 in February.'
    n: '[[w.gibbons-u-s-government-and]], IV, 692. To check: *New York Times*, May 17, 1967. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-05-18.middle-east
    when: May 18
    date: '1967-05-18'
    thread: middle-east-six-day-war
    c: Egypt's request to withdraw UNEF; U Thant orders the withdrawal.
    n: 'FRUS 1964–68, XIX, doc. [11](https://history.state.gov/historicaldocuments/frus1964-68v19/d11) (Goldberg with Thant, May 18), [19](https://history.state.gov/historicaldocuments/frus1964-68v19/d19) (Thant''s report). Check: the UN''s record of the request and the order. See [[cal.1967-05-16.middle-east]]. Names: U Thant.'
    tags: [name:u-thant]
  - id: cal.1967-05-18.vietnam
    when: May 18
    date: '1967-05-18'
    thread: vietnam
    also: [vietnam-congress]
    c: 'News conference. On the United Nations, after Mansfield''s speeches: "we will welcome any constructive action that they could take or get our adversaries to take"; "our objectives are the same and our determination is just as strong as it has ever been."'
    n: 'The President''s News Conference, [1967 Pub. Papers 541](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=609) (May 18, 1967). [[w.gibbons-u-s-government-and]], IV, 680 (and Mansfield''s speeches of May 15, 18 and 24, 113 Cong. Rec. 12593–94, 13213–14, 13728). See [[cal.1967-04-29.vietnam-congress]]. Names: Johnson, Mansfield.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike]
  - id: cal.1967-05-18.vietnam-congress
    when: May 18
    date: '1967-05-18'
    thread: vietnam-congress
    c: 'Fulbright at lunch with Russell, on Marcy''s points: the two committees'' duty to advise on the national interest; a joint subcommittee of five each to hold public hearings on Vietnam; a sense-of-the-Senate resolution; a joint call on Johnson. No notes.'
    n: '[[w.gibbons-u-s-government-and]], IV, 681–83. To check: Marcy to Fulbright, May 16 and 18, 1967 (National Archives, RG 46, Marcy Chron File). Names: Fulbright, Russell, Marcy, Johnson.'
    tags: [name:fulbright-j-william, name:russell-richard-b, name:marcy-carl, name:johnson-lyndon-b]
  - id: cal.1967-05-19.vietnam
    when: May 19
    date: '1967-05-19'
    thread: vietnam-program-5
    c: 'McNamara''s draft presidential memorandum, "Future Actions in Vietnam," drafted by McNaughton. Westmoreland and Sharp ask 200,000 more men; that would mean the reserves, some 500,000 more in the forces, $10 billion more in fiscal 1968, and pressure to carry the war into Laos, Cambodia and the North. "The war in Vietnam is acquiring a momentum of its own that must be stopped." Course B: no more than 30,000 more men, about 500,000 by the end of 1968; the bombing concentrated on the routes of infiltration south of 20°.'
    n: 'FRUS 1964–68, V, doc. [177](https://history.state.gov/historicaldocuments/frus1964-68v05/d177). Made public: [[w.pentagon-papers]], IV, 477–489 (1971). [[w.drea-mcnamara-clifford-and-the-2011]], 138–39, 209–10 (the memorandum, McNaughton''s draft; the reserves; Course B; the momentum; the bombing south of 20°); [[w.gibbons-u-s-government-and]], IV, 640–50. To check: [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.berman-lyndon-johnsons-war]]; [[w.barrett-uncertain-warriors]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1967-03-18.vietnam]]. Names: McNamara, McNaughton, Westmoreland, Sharp.'
    src:
      c: be6ae88d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d177: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 138: A, C'
        - 'w.drea-mcnamara-clifford-and-the-2011 139: E-F'
        - 'w.drea-mcnamara-clifford-and-the-2011 209: A, D, F'
        - 'w.drea-mcnamara-clifford-and-the-2011 210: F'
        - 'via w.drea-mcnamara-clifford-and-the-2011 139 n.79b: E-F'
        - 'via w.drea-mcnamara-clifford-and-the-2011 209 n.25a: A, D, F'
        - 'w.gibbons-u-s-government-and IV, 640–50: all'
    tags: [name:mcnamara-robert-s, name:mcnaughton-john-t, name:westmoreland-william, name:sharp-u-s-grant]
  - id: cal.1967-05-19.vietnam-2
    when: May 19
    date: '1967-05-19'
    thread: vietnam
    also: [vietnam-air-war, middle-east-six-day-war]
    c: 'Johnson with Rusk, McNamara, Rostow and Christian, 5:38 to 6:59 p.m., chiefly on the Hanoi power plant and a shift south of the 20th parallel. Rostow''s memorandum, 3 p.m.: "dangerously strong feelings in your official family"; strike the plant, then cut back around Hanoi and Haiphong for some weeks while Moscow has its chance to "deliver something." Accepted, by Gibbons''s reading. The Middle East: Bohlen and Bruce to ask the French and British what they will do, to revive "as much of the tripartite as we can."'
    n: 'FRUS 1964–68, V, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v05/d176) (Rostow''s memorandum); XIX, doc. [22](https://history.state.gov/historicaldocuments/frus1964-68v19/d22) (the hour; the Middle East, from Rostow''s notes). [[w.gibbons-u-s-government-and]], IV, 650–52 (the war). Made public: FRUS 1964–68, V (2002). To check: [[w.cooper-lost-crusade]], 375 (Cooper''s account, cited by Gibbons, IV, 651). See [[cal.1967-05-19.vietnam]]; [[cal.1967-05-16.middle-east]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Bohlen, Bruce.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:christian-george, name:bohlen-charles-e, name:bruce-david-k-e]
    aliases: [cal.1967-05-19.middle-east]
  - id: cal.1967-05-19.vietnam-air-war
    when: May 19
    date: '1967-05-19'
    thread: vietnam-air-war
    c: The Hanoi thermal power plant, a mile from the center of the city, struck.
    n: 'Rostow to Johnson, May 19, [FRUS 1964–68, V: Vietnam, 1967, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v05/d176), n. 3 (the plant, "only a mile from Hanoi''s center, was bombed on May 19"). [[w.gibbons-u-s-government-and]], IV, 651. Check: Gibbons has Johnson approving the strike May 16 (IV, 568) and the strike after the meeting of May 19 (IV, 651); FRUS (n. 2) presumes the decision taken at the meeting of the evening of May 18. To check: [[w.cooper-lost-crusade]], 375 (many more strikes before it was out of operation; cited by Gibbons, IV, 651). See [[cal.1967-05-19.vietnam-2]].'
  - id: cal.1967-05-19.vietnam-congress
    when: May 19
    date: '1967-05-19'
    thread: vietnam-congress
    c: 'Fulbright to Russell, with Marcy''s draft for joint hearings: the American interest in Southeast Asia; what it would bear in men and materiel; China and Russia. Witnesses: Rusk, McNamara, Rostow, Taylor, Wheeler; Bradley, Commager, Fairbank. By hand: the hearings would make the executive "examine their premises." None held.'
    n: '[[w.gibbons-u-s-government-and]], IV, 682–83. To check: Fulbright to Russell, May 19, 1967 (National Archives, RG 46). See [[cal.1967-05-18.vietnam-congress]]. Names: Fulbright, Russell, Marcy, Rusk, McNamara, Rostow, Taylor, Wheeler, Bradley, Fairbank.'
    tags: [name:fulbright-j-william, name:russell-richard-b, name:marcy-carl, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:taylor-maxwell, name:wheeler-earle, name:bradley-omar-n, name:fairbank-john-k]
