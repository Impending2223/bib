    c: 'McGeorge Bundy to Johnson: more troops and escalation "inevitable, in the framework of strictly military analysis," but a mistake;{1} tactical bombing yes, the power plants no, hit "because we have ''run out'' of other targets";{2} a publicly proclaimed limit, Norstad and Bradley to rally the generals.{3} "The present issue is not ''negotiation.'' It is ''escalation.''" The *New York Times* the same day reports Westmoreland''s request.{4}'
