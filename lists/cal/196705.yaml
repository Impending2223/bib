  - id: cal.1967-05-14.china-leadership
    when: May 14
    date: '1967-05-14'
    thread: china-wuhan
    also: [china-mao-cr, china-army]
    c: 'Mao reads the Lanzhou Military Region committee''s telegram of May 13 asking leave to back Gansu''s rebels and form Gansu''s revolutionary committee: to Lin and Zhou, the view has reason; confer with Zhang, Xian and Zhan Danan; Hu Jizong and others have stood forth with the region and strongly back the Third Headquarters; why not skip military control and, after some work, form the provincial revolutionary committee as the region says? On July 30 he reads the memorandum on Gansu: "very good, do it": no military control, a preparatory group directly.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 14, 1967; [[w.zhou-enlai-nianpu-1949-2020]], III, 148 (May 14, 1967; Mao''s May 14 note on military control in Gansu: could it be skipped, following the Region''s view, with a provincial revolutionary committee formed after a period of work); [[w.jianguo-yilai-mao-zedong]], XIX, 72–74 (May 14, 1967; Mao''s note of 3 a.m. May 14 to Lin Biao and Zhou Enlai, and of July 30 (''Back to Lin Biao: read; very good; do as proposed''); the telegram is the Lanzhou Military Region Party committee''s of noon May 13, asking to back the Gansu Red Rebels'' Third Headquarters (Hongsansi 红三司)). Made public: 2013. To check: Lanzhou Military Region Party Committee, telegram of 12 noon May 13, 1967 to the Military Commission, the All-Army Cultural Revolution Group and the Cultural Revolution Group: request for instructions on a statement backing the Gansu Red Rebels'' United Third Headquarters (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 73 n.1b); Central Committee, State Council, Military Commission and Cultural Revolution Group, notice of July 29, 1967 forwarding the ''Minutes of the meeting on the Gansu problem'': Gansu to have no military control, a preparatory group for the revolutionary committee at once (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 73 n.1c); Minutes of the meeting on the Gansu problem (Guanyu Gansu wenti zuotan jiyao 关于甘肃问题座谈纪要), held at Peking after Mao''s note of May 14 with over twenty leaders of the Lanzhou Military Region and the Gansu military district, Xian Henghan, Zhan Danan and Hu Jizong (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 74 n.1). Names: Mao Zedong, Lin Biao, Zhou Enlai, Zhang Dazhi, Xian Henghan, Zhan Danan, Hu Jizong.'
