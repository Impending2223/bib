    when: May 31
    date: '1967-05-31'
    thread: opinion
    also: [students, elections-1968-polls]
    c: 'Gallup, special survey of college students: Republican 29 percent, Democrat 29, independent 42. The Republican convention''s choice: Romney 58, Nixon 31. Johnson''s handling of his job: approve 38, disapprove 53.'
    n: '[[w.gallup-poll]], III, 2065. Names: Romney, Nixon, Johnson.'
