    also: [european-community, farm]
    c: 'Geneva, late May 15: general agreement in the Kennedy Round, Roth and Blumenthal for the United States.{1} Concessions on $7½ to $8 billion of American exports and as much of imports; industrial tariffs cut 33 to 35 percent on average, short of the 50 percent sought; a grains arrangement, wheat at no less than $1.73 a bushel, and 4½ million tons of food aid a year;{2} chemicals, apart from a separate package on the American Selling Price.{3} May 16, Humphrey, Rusk and Freeman brief 23 members of Congress; Johnson''s statement: "a final agreement covering billions of dollars worth of trade among more than 50 countries."{4}'
