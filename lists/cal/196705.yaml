        - 'w.gibbons-u-s-government-and IV, 623: B-D'
        - 'via w.gibbons-u-s-government-and IV, 622 n.55: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d154: all'
    tags: [name:bundy-william, name:katzenbach-nicholas]
  - id: cal.1967-05-01.vietnam-program-5-2
    when: May 1
    date: '1967-05-01'
    thread: vietnam-program-5
    c: 'Enthoven to McNamara, "Increase of Southeast Asia Forces": an enemy that "just may have found a dangerously clever strategy for licking the United States," holding its losses to what it can bear while waiting for American opinion to turn. More combat forces "a step in the wrong direction."'
    n: 'FRUS 1964–68, V, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v05/d155) (editorial note). [[w.gibbons-u-s-government-and]], IV, 627–29; [[w.berman-lyndon-johnsons-war]], 36–37 (Enthoven: "we can''t hurt them so badly as to destroy their society or, more to the point, their hope"; "Hanoi is betting that we''ll lose public support in the United States before we can build a nation in South Vietnam"; 200,000 more men, 400 more enemy losses a week, "In theory, we''d then wipe them out in 10 years"); [[w.drea-mcnamara-clifford-and-the-2011]], 138 (hold to Program 4''s 470,000). Check: Berman (36–37, 209 n.11) quotes this memorandum and Enthoven''s of May 4 without telling them apart. To check: Enthoven to McNamara, May 1, 1967, Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 627 n.60). Made public: [[w.pentagon-papers]], IV, 463–68 (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: Enthoven, McNamara.'
    src:
      c: 07f79eb3
      rows:
