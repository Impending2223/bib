        - 'w.drea-mcnamara-clifford-and-the-2011 138: ?'
    tags: [name:enthoven-alain-c, name:mcnamara-robert-s]
  - id: cal.1967-05-01.vietnam-congress
    when: May 1
    date: '1967-05-01'
    thread: vietnam-congress
    c: 'Breakfast, 8:30 to 10:03 a.m., Johnson with Mansfield and Morse on the U.N. approach; Rusk, Rostow, Katzenbach, Goldberg and Califano with him. No record. By Mansfield''s memorandum for the file: the country "on a road to a direct confrontation with China"; Johnson: "Would it make us look weaker and more foolish than we are?"'
    n: 'Rostow to Johnson, Apr. 30, [FRUS 1964–68, V: Vietnam, 1967, doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v05/d152), n. 3 (the breakfast, off the record, on the U.N. approach). [[w.gibbons-u-s-government-and]], IV, 678. [[w.mann-grand-delusion]], 541–42 (Mansfield''s memorandum). To check: Mansfield, memorandum for the file, May 1, 1967, XXII, 105, Mansfield Papers (cited by [[w.mann-grand-delusion]], 542 nn.2, 3). Check: FRUS''s note names Mansfield, Morse, Rusk, Katzenbach, Goldberg and Califano, not Rostow, and gives no hours. See [[cal.1967-04-29.vietnam-congress]]. Names: Johnson, Mansfield, Morse, Rusk, Rostow, Katzenbach, Goldberg, Califano. Check: Mann, 541–42, from Mansfield''s memorandum for the file, against "No record."'
