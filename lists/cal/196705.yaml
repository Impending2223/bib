  - id: cal.1967-05-14.china-leadership-2
    when: May 14
    date: '1967-05-14'
    thread: china-wuhan
    also: [china-army]
    c: 'For the Center''s note forwarding the Guangdong military control commission''s report of May 13 and the Hunan military district''s of May 12, Mao drafts the note to the whole army (Center, Military Commission, Cultural Revolution Group, army Cultural Revolution Group): mistakes must be mended outright, or they sink deeper and cost more in the end; do not waver; do not believe what wives and children bring from the "protect" bodies;{1} bear criticism from workers, peasants, students, soldiers and cadres, accept the good, explain the wrong; the great majority are good, the bad no more than one, two, three percent.{2} "To Zhou and Lin, the liaison meeting, issue."{3} Sent May 15.{4}'
