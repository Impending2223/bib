  - id: cal.1967-05-21.opinion
    when: May 21
    date: '1967-05-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Apr. 19–24: Republicans'' choice for 1968: Nixon 43 percent, Romney 28, Rockefeller 7, Reagan 7, Percy 5, Hatfield 3, Lindsay 3. Independents: Nixon 28, Romney 23, Rockefeller 17, Reagan 10, Percy 9. Republican county chairmen: Nixon 1,272, Romney 348, Reagan 243, Percy 122, Rockefeller 71.'
    n: '[[w.gallup-poll]], III, 2064. Names: Nixon, Romney, Rockefeller, Reagan, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
