  - id: cal.1967-05-19.vietnam
    when: May 19
    date: '1967-05-19'
    thread: vietnam-program-5
    c: 'McNamara''s draft presidential memorandum, "Future Actions in Vietnam," drafted by McNaughton. Westmoreland and Sharp ask 200,000 more men; that would mean the reserves, some 500,000 more in the forces, $10 billion more in fiscal 1968, and pressure to carry the war into Laos, Cambodia and the North. "The war in Vietnam is acquiring a momentum of its own that must be stopped." Course B: no more than 30,000 more men, about 500,000 by the end of 1968; the bombing concentrated on the routes of infiltration south of 20°.'
    n: 'FRUS 1964–68, V, doc. [177](https://history.state.gov/historicaldocuments/frus1964-68v05/d177). Made public: [[w.pentagon-papers]], IV, 477–489 (1971). [[w.drea-mcnamara-clifford-and-the-2011]], 138–39, 209–10 (the memorandum, McNaughton''s draft; the reserves; Course B; the momentum; the bombing south of 20°); [[w.gibbons-u-s-government-and]], IV, 640–50 (the memorandum and its courses; not the momentum); [[w.herring-lbj-and-vietnam]], 52–53 (shown Johnson May 19, not McNaughton''s draft; the request it answers; the momentum; 30,000 more, then a ceiling; the bombing cut back to the 20th parallel); [[w.mcnamara-in-retrospect]], ch. 9 at nn.33–34 (the memorandum quoted at length; Rostow: "dangerously strong feelings"). [[w.barrett-uncertain-warriors]], 86 (the memorandum; the 30,000; the bombing south of 20°); [[w.branch-at-canaans-edge]], 614–15 ("1,000 noncombatants a week"; the CIA, May 22, on the bombing''s effects); [[w.berman-lyndon-johnsons-war]], 43–46 (Westmoreland''s request renewed; "no attractive course of action"; "choose among imperfect alternatives"; the reserves, 500,000 men, $10 billion; the total in Vietnam 670,000, in the area 770,000; "There is rot in the fabric"; no more than 30,000, about 500,000). Check: Gibbons gives a $12 billion increase and some 600,000 more in the forces (IV, 643). To check: [[w.shapley-promise-and-power]]; [[w.gravel-political-odyssey]], 169–77 (cited by [[w.branch-at-canaans-edge]], 614); [[w.mcnamara-in-retrospect]], 266–71 (cited by [[w.branch-at-canaans-edge]], 614); [[w.langguth-our-vietnam]], 445 (cited by [[w.branch-at-canaans-edge]], 614); supplementary CIA reports cited in ibid., pp. 442–44 (cited by [[w.branch-at-canaans-edge]], 614); Powers, *The WaratHome* (1973), 170 (cited by [[w.branch-at-canaans-edge]], 615). See [[cal.1967-03-18.vietnam]]. Names: McNamara, McNaughton, Westmoreland, Sharp.'
