  - id: cal.1967-05-01.railroads
    when: May 1–2
    date: '1967-05-01'
    thread: railroads
    c: 'The shop crafts'' dispute: six unions, 137,000 men who maintain the rolling stock, against nearly all the major railroads, mainly on wages. H.J. Res. 543, the no-strike period extended to June 19: House, [302–56](https://voteview.com/rollcall/RH0900049); Senate, [72–2](https://voteview.com/rollcall/RS0900077); signed May 2, [81 Stat. 13](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg13-3.pdf).'
    n: 'Statute (K–J Cong. II.J.2). Check: the Record''s pages. See [[cal.1967-01-28.railroads]]; [[cal.1967-04-28.railroads]].'
  - id: cal.1967-05-01.vietnam
    when: May 1
    date: '1967-05-01'
    thread: vietnam
    also: [congress, republican-party-congress]
    c: 'The Senate Republican Policy Committee''s staff paper, "The War in Vietnam," made public: American policy in Indochina since 1945, no alternative offered; what the American interest in Southeast Asia is, and how much further the party and the nation will go for it. Prepared after the committee''s meeting of late March, at Javits''s suggestion. The leadership shelves it.'
    n: 'The paper''s text, inserted by Findley, May 9: [113 Cong. Rec. 12,030](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-1.pdf#page=55) (1967)–41 (its "two basic questions": "What precisely is our national interest in Thailand, Cambodia, Vietnam, and Laos?" and "To what further lengths are we prepared to go in support of this interest?"). Miller, May 2: [113 Cong. Rec. 11,437](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-3-2.pdf#page=27) (1967) ("released to the press media yesterday"). [[w.johns-vietnams-second-front]], 150; [[w.gibbons-u-s-government-and]], IV, 672–74 (released by Hickenlooper, the committee''s chairman; the meeting of late March and Javits; not the shelving). To check: [*New York Times*, May 2, 1967](https://timesmachine.nytimes.com/timesmachine/1967/05/02/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 674 n.5); Congressional Quarterly Fact Sheet, May 31, 1967, Democratic National Committee Series I, box 131, LBJ Library; *Wall Street Journal*, May 11, 1967 (cited by [[w.johns-vietnams-second-front]], 150 n.115, for the release and the shelving). Names: Javits.'
