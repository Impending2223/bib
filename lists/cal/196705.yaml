  - id: cal.1967-05-13.elections-1968-johnson
    when: May 13
    date: '1967-05-13'
    place: washington
    thread: elections-1968-johnson
    c: 'Queen''s Sitting Room, a little past 3, an hour and a half: Lady Bird Johnson and Abe Fortas on "how to get out and when." She has set March 1968 "in my own mind" as the time for Johnson to say he will not be a candidate. Fortas: if the war has improved, he could announce it then; if not, he "simply could not withdraw," and must try for the nomination; he must make no decision or announcement before March, which "would hamstring—almost immobilize—the war effort and Lyndon''s domestic program."'
    n: '[[w.johnson-white-house-diary]], 518–19 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Fortas, Johnson.'
    tags: [name:johnson-lady-bird, name:fortas-abe, name:johnson-lyndon-b]
  - id: cal.1967-05-13.china-leadership
    when: May 13
    date: '1967-05-13'
    thread: china-wuhan
    also: [china-mao-cr, china-army]
    c: 'Mao reads a letter of Apr. 21 from Qin Houde, an army man at Jinan on the left-support work: the support has gone to the conservatives, not the left; some propaganda teams deal roughly with "counter-revolutionary" bodies; the provincial revolutionary committee and the Jinan Military Region''s headquarters for guarding the Cultural Revolution are at opposite poles. Mao: to the Group''s office, to be printed as a *Kuaibao*; a common problem, much to be noted; the Jinan air force (May 5) and the region (May 6) have publicly backed the provincial committee and the army has reported to the Center, so it begins to be solved; in other provinces and cities some solved, some not.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 13, 1967; [[w.jianguo-yilai-mao-zedong]], XIX, 75–76 (May 13, 1967; Mao''s two notes on Qin Houde''s letter of Apr. 21 to Chen Boda, Kang Sheng and Jiang Qing: the first at its head, the second at its end; he added the title ''A letter from a comrade of the Jinan army'' and the date). Made public: 2013. To check: Qin Houde 秦厚德, cadre of the Jinan Military Region, letter of Apr. 21, 1967 to Chen Boda, Kang Sheng and Jiang Qing, forwarded to Mao, on the PLA''s left-supporting work at Jinan: seven faults, among them the support of the conservatives and the opposition between the provincial revolutionary committee and the region''s headquarters for guarding the Cultural Revolution (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 76 n.1). Names: Mao Zedong, Qin Houde.'
