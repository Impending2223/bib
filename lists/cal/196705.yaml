    c: 'Jiang Qing forwards to Lin Biao, Zhou Enlai and Kang Sheng a notice faked by the Kuomintang in 1932 papers, "the Wuhao and others leave the Communist Party," which Nankai University''s rebels found, with a letter: they had found an anti-Communist notice headed by Wuhao (Zhou xx) and wanted to talk. May 19 Zhou notes on her letter: forged by the enemy; writes Mao with a chronology of 1931–32; the forgeries were made after he left for Jiangxi. Mao: "To the Group: read and file."'
