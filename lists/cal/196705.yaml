    c: 'Mao three times reads Chen Boda''s draft, by Wang Li and Guan Feng, "The Essence of *Self-Cultivation* Is Betrayal of the Proletarian Dictatorship" (Liu Shaoqi''s *On the Self-Cultivation of a Communist*).{1} May 4: his views written into the text; after revision, to the Group and the Standing Committee liaison meeting. May 6: a few lines added on page 7, if right; a clean proof for him. May 7: "print so." He adds two paragraphs, on the book''s picture of communist society, all good with no dark side, no contradiction, no opposite, society''s growth ended; and on how any thing, any person, divides in two.{2}'
