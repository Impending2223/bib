  - id: cal.1967-05-19.china-leadership
    when: May 19
    date: '1967-05-19'
    thread: china-zhou-foreign
    c: 'Zhou Enlai writes on Jiang Qing''s letter that the "Wu Hao and others leave the Communist Party" notice is an enemy forgery: he was then in the Central Soviet area, and Kang Sheng and Chen Yun in Shanghai knew it and took steps. The same day he writes Mao, with a chronicle of the events of 1931–32: the notice is the forgery of Feb. 1932, made after he reached Jiangxi. Mao: "to the Group''s comrades to read; keep."'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 151 (May 19, 1967); [[w.jian-zhou-enlai]], 573 (Zhou tells Jiang it is a rumor "made up and circulated by the enemy"; with his aides he searches *Shenbao* of February 1932, finds the statement and its rebuttal, compiles a chronology and sends it all to Mao with a note: it appeared after he had left Shanghai for Jiangxi; Mao: "convey the materials to the comrades of the CCRG for reading, and keep them in the file"); [[w.dikotter-cultural-revolution]], 160 n.28 (Zhou appeals to Mao with a lengthy dossier showing the item a hoax planted by his enemies of the time). Made public: 2020. To check: [[w.zhou-enlai-nianpu-1949]], III, 154–155, 155 (cited by [[w.jian-zhou-enlai]], 573 n.35, n.36b); Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 169–170 (cited by [[w.dikotter-cultural-revolution]], 160 n.28a); Jin Chongji, ed., *Zhou Enlai zhuan* (as cited, 1989), 1732–1734 (cited by [[w.dikotter-cultural-revolution]], 160 n.28b); Barbara Barnouin and Yu Changgen, *Zhou Enlai: A Political Life* (2009), 236–237 (cited by [[w.dikotter-cultural-revolution]], 160 n.28c). Names: Zhou Enlai, Jiang Qing, Kang Sheng, Chen Yun, Mao Zedong.'
