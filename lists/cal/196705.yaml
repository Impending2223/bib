  - id: cal.1967-05.china-leadership-2
    when: May
    date: 1967-05
    thread: china-mao
    c: 'Mao sends Wang Dongxing to see Deng Xiaoping with three points: be patient, do not hurry; Liu and Deng can be separated; if need be, write to him.{1} Deng asks to talk with Mao, saying many poster charges are untrue. One night Mao has Xu Yefu fetch Deng to his home; Deng reports in detail on 1931 (he left the Seventh Red Army for Shanghai to report) and accepts Mao''s criticism of his and Liu''s work groups. If Deng has business, Mao says, go to Wang Dongxing or write him.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1967 (no day); [[w.deng-xiaoping-nianpu-1904]], III, 1937 (May 1967; Deng, at home, receives Wang Dongxing 汪东兴, sent by Mao, who conveys Mao''s three views: first, to endure and not be anxious; second, Liu and Deng can be separated; third, if there is anything he may write to Mao; Deng says that many questions in the big-character posters outside do not accord with fact, and asks to talk with Mao in person; Wang reports the request to Mao; then, one night late, Mao''s secretary Xu Yefu 徐业夫 fetches Deng to Mao, and they talk till near dawn: Deng reports how in the thirties he left the Seventh Red Army for Shanghai to report to the Center, and accepts Mao''s criticism of the work teams; asked whom to report to, Mao says Wang Dongxing or a letter to himself; asked his view of Lin Biao, Deng does not answer; the words: 一天深夜); [[w.yang-jisheng-tiandi-fanfu]], II, 847 (by Mao Mao''s account, Mao just back in Peking from outside; Yang''s note: by the Mao chronology Mao did not leave Peking before July 14, 1967, and Mao Mao may have the time wrong; soon after, Mao sees Deng once). Made public: 2013. Names: Mao Zedong, Wang Dongxing, Deng Xiaoping, Liu Shaoqi, Xu Yefu. Check: the days; the nianpu has only "同月" and "一天深夜."'
    src:
      c: e691e95c
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, May 1967: ?'
        - 'w.deng-xiaoping-nianpu-1904 III, 1937: 1'
        - 'w.yang-jisheng-tiandi-fanfu II, 847: ?'
    tags: [name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, polity:prc, vis:only:prc, name:wang-dongxing, name:xu-yefu]
