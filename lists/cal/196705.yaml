    thread: vietnam-program-5
    c: 'Rostow on McNamara''s draft: an "intermediate strategy."'
    n: 'FRUS 1964–68, V, doc. [181](https://history.state.gov/historicaldocuments/frus1964-68v05/d181) (the CIA''s estimates of May 23 and 26). Check: Rostow''s memorandum and its date. [[w.gibbons-u-s-government-and]], IV, 657–58 (the memorandum''s dates). See [[cal.1967-05-19.vietnam]]. Names: Rostow, McNamara. Check: Gibbons dates Rostow''s memorandum to the President May 20, its copy to Vance, Helms and William Bundy May 22 (IV, 657 n.114).'
