    when: May 22
    date: '1967-05-22'
    thread: middle-east-six-day-war
    c: 'Nasser at Bir Gafgafa, Sinai, at night: the Strait of Tiran closed to Israeli ships and to strategic cargo for Israel.'
    n: 'FRUS 1964–68, XIX, doc. [49](https://history.state.gov/historicaldocuments/frus1964-68v19/d49). See [[cal.1967-05-16.middle-east]]. Names: Nasser.'
