    c: 'Mao, 2:30 a.m., reads and corrects the *Hongqi*–*Renmin ribao* editorial "A Great Historic Document," for the publication of the Circular. His paragraph: after the means of production are socialized, are there still classes and class struggle; does it all turn on seizing power; under proletarian dictatorship is revolution still needed, against whom and how? Marx and Engels could not solve it; Lenin saw the defeated bourgeois stronger than the proletariat and bent on restoration; Mao''s thought answers it. Mao to Wang Li: back at once; changed a little; the Group to decide.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 18, 1967; [[w.jianguo-yilai-mao-zedong]], XIX, 82–86 (May 18, 1967; Mao''s note at 2:30 a.m. to Wang Li; his changes to a passage of the draft and his paragraph at its end, on the Cultural Revolution being only the first; the draft is the editorial of the *Renmin ribao* and *Hongqi* for the publication of the Circular of May 16, 1966, sent for review by Chen Boda May 17); [[w.mao-zedong-zhuan]], VI, ch. 76 n.34 (May 17 the *Renmin ribao* publicly prints the Circular of May 16, 1966; next day the Cultural Revolution Group sends Mao the editorial of the *Hongqi* and the *Renmin ribao*, ''A great historic document'', for review; in revising it Mao adds a passage: the present cultural revolution is only the first, others must follow; who wins and who loses will take a long historical period to settle; if it is badly done, capitalist restoration may come at any time, n.34). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Chen Boda, report of May 17, 1967 sending Mao for review the draft editorial ''A great historic document'' (Weida de lishi wenjian 伟大的历史文件) for the Hongqi and Renmin ribao, on the publication of the Central Committee''s Circular of May 16, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 84 n.1); Mao Zedong 毛泽东, revision of the draft of the editorial "A great historic document" 《伟大的历史文件》 (manuscript 手稿), May 18, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.34). Names: Mao Zedong, Wang Li.'
