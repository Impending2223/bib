  - id: cal.1976-06-01.elections-1976
    when: June 1
    date: '1976-06-01'
    thread: elections-1976
    c: 'Primaries in Montana, Rhode Island and South Dakota. Republican: Reagan in Montana and South Dakota; Ford in Rhode Island. Democratic: Church in Montana; unpledged delegates in Rhode Island; Carter in South Dakota.'
    n: '[*Report of the Official Canvass of the Vote Cast at the Primary Election in the State of Montana, June 1, 1976*](https://archive.org/details/primaryofficial1976montrich/page/n2); [*Official Election Returns and Registration Figures for South Dakota, Primary Election, June 1, 1976*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1976P.pdf#page=2). CQ Guide 6th (2010) 421. See [[cal.1976-02-24.elections-1976]]. Names: Church, Ford, Carter, Reagan.'
    tags: [primary:1976-06-01, name:church-frank, name:ford-gerald-r, name:carter-jimmy, name:reagan-ronald]
  - id: cal.1976-06-08.elections-1976
    when: June 8
    date: '1976-06-08'
    thread: elections-1976
    c: 'Primaries in California, New Jersey and Ohio. Republican: Reagan in California; Ford in New Jersey and Ohio. Democratic: Brown in California; Carter in New Jersey and Ohio.'
    n: 'Cal., [*Statement of Vote, Primary Election, June 8, 1976*, 7–12](https://archive.org/details/statementofvote1976cali/page/n15); N.J., [*Results of the Primary Election Held June 8, 1976*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1976-primary-election.pdf#page=9). CQ Guide 6th (2010) 421–422. See [[cal.1976-02-24.elections-1976]]. Names: Ford, Carter, Reagan.'
    tags: [primary:1976-06-08, name:brown-edmund-g, name:ford-gerald-r, name:carter-jimmy, name:reagan-ronald]
