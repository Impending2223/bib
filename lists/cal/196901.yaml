    tags: [polity:ussr, polity:gdr, polity:bulgaria, polity:hungary, polity:czechoslovakia, polity:poland, polity:mongolia, vis:only:ussr+gdr+bulgaria+hungary+czechoslovakia+poland+mongolia]
  - id: cal.1969-01-29.china-leadership
    when: Jan. 29, Feb. 7
    date: '1969-01-29'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, china]
    c: Zhou Enlai twice calls the military representatives, cadres and mass delegates of the Ministries of Posts and Telecommunications and Railways and of the Meteorological Bureau and hears their reports on communications and weather. Both the Fourth Ministry and the Posts and Telecommunications Ministry are backward in wired and wireless communication; the Central Meteorological Bureau and the Ministry are to plan together; cable and microwave are to be caught up from the first quarter, underground cable built at once, military and civil in one plan. China should have its own weather satellite and weather rockets and break the enemy's blockade by every means, building on its own strength and also listening to foreign broadcasts. Meteorologists are to see on the spot what weather means to the people's life, sea voyages and rail transport; the work serves the working people first.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 272–273 (Jan. 29, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-01-30.china-leadership
    when: Jan. 30
    date: '1969-01-30'
    place: peking
    thread: china-leadership
    also: [china]
    c: Li Zongren dies in Peking. Before his death he wrote Mao and Zhou Enlai that the road he took in 1965, returning from abroad to the homeland, was right, and that in his last moments he thought of the Kuomintang men left on Taiwan and overseas and all patriotic intellectuals, whose only road was to return to the homeland as he did.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Jan. 30, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
