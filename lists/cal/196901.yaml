    thread: soviet-union
    also: [china, students]
    c: 'East Berlin. The second Interkit meeting, of the international departments of the Bulgarian, Hungarian, East German, Czechoslovak, Polish, Mongolian and Soviet parties, on China: its appeal in the West; the student movement, open to anarchist, Trotskyite and other ultra-left voices, "can be used by Beijing" to spread its influence; China has called a conference of pro-Chinese youth in Albania for later in the year.'
    n: '[[w.friedman-shadow-cold-war]], 173. Made public: 2015. To check: Meeting of International Departments Communist Parties of Bulgaria, Hungary, East Germany, Czechoslovakia, Poland, Mongolia, and USSR on China in Berlin, January 28-31, 1969, SAPMO-BArch DY 30/11929, 46 (cited by [[w.friedman-shadow-cold-war]], 173 n.120); Meeting of International Departments Communist Parties of Bulgaria, Hungary, East Germany, Czechoslovakia, Poland, Mongolia, and USSR on China in Berlin, January 28-31, 1969, SAPMO-BArch DY 30/11929, 47–48 (cited by [[w.friedman-shadow-cold-war]], 173 n.121). See [[cal.1967-12-14.soviet-union]].'
