  - id: cal.1969.vietnam-hanoi
    when: '1969'
    date: '1969'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Supreme Command moves the 1st Division (Regiments 95C, 101C and 209) and Regiments 33, 174, 10 and 20 from the Highlands front and Region V into eastern Nam Bộ.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 93 and n. 1; 105 n. 1. Made public: 2013. To check: *Lịch sử Quân đội nhân dân Việt Nam*, II (Quân đội nhân dân, 1994), 337 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 105 n. 1). Check: the day; the history dates it to 1969 and gives the division moved from the Highlands.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969.vietnam-hanoi-2
    when: '1969'
    date: '1969'
    thread: vietnam-hanoi
    also: [vietnam-operations, laos]
    c: 'The North''s support for the year: 81,090 cadres and soldiers to the South, among them artillery, engineer and signal units, 13 infantry battalions, 99 infantry companies and 35 sapper platoons; 52,424 tons of arms, supplies, food and medicine; $34,888,629. To Laos 40,200 volunteer troops, 28,701 tons and 41,300,488 Vietnamese đồng.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 93 and n. 1. Made public: 2013. To check: *Thống kê số liệu về cuộc kháng chiến chống Mỹ, cứu nước (1954–1975)*, in the Ministry of Defense archive (cited by [[w.lich-su-khang-chien-chong-my]], VI, 93 n.).'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969.vietnam-saigon
    when: 1969, mid
    date: '1969'
    at: before 1969-05
    thread: vietnam-saigon
    also: [vietnam-hanoi]
    c: The Saigon–Gia Định Party Committee moves the lawyer Trần Ngọc Liễng, a sympathizer, to found the Progressive National Force, of Saigon officials weary of war and not hostile to the revolution, to press Thiệu to end the war.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 158. Made public: 2013. Names: Thiệu. Check: the day; the history says "giữa năm 1969".'
    tags: [polity:drv, vis:only:drv, ok:fields-place, name:nguyen-van-thieu]
  - id: cal.1969.vietnam-hanoi-3
    when: 1969, early
    date: '1969'
    at: before 1969-01
    thread: vietnam-hanoi
    c: 'Hồ Chí Minh''s Tết letter to the people and fighters of the whole country: the strategic direction of the war in the new stage, "Đánh cho Mỹ cút, đánh cho ngụy nhào" (strike so the Americans go, strike so the puppets fall).'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 163–64. Names: Hồ Chí Minh. Check: the day; the history says "đầu năm 1969, nhân dịp Tết Nguyên đán". Tết Nguyên đán fell on Feb. 17, 1969 (tools/calendar/chinese_calendar.py, the Chinese calendar).'
    tags: [polity:drv, name:ho-chi-minh]
  - id: cal.1969.vietnam-hanoi-4
    when: 1969, summer
    date: '1969'
    at: before 1969-06-21
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Central Military Party Committee orders the army to tighten organization, raise quality and trim the standing forces. The 377th and 375th Air Defense Divisions, the 269th Bridge and Ferry Engineer Regiment and the 268th and 278th SAM Regiments are dissolved to reinforce the guard of key places, the fighting in southern Military Region 4 and Route 559; the Navy and the northern regions and schools cut staff and send over 13,000 to the fighting units. Group 500, from the south bank of the Gianh to the 17th parallel, with seven truck, eight engineer and two 37 mm battalions, a pipeline battalion and its stations, is folded into Group 559.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 194–95, 212. Made public: 2013. Check: the day; the history says "từ mùa hè năm 1969" for the order (p. 194) and "giữa năm 1969" for Group 500 (p. 212).'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969.vietnam-hanoi-5
    when: 1969, early
    date: '1969'
    at: before 1969-01
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Route 559. Group 559, with Group 500, clears the main pass sectors on Routes 12 and 20 and opens branches 20c, 20d and bypasses; the General Staff adds engineers to open Route 18, a new crossing toward Route 9; Quảng Bình mobilizes 20,000 laborers to build Route 10 to join Routes 18 and 16; river stretches are used to float cargo down.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 211. Check: the days; the history gives "những tháng đầu của năm 1969".'
    tags: [polity:drv]
  - id: cal.1969.vietnam-hanoi-6
    when: '1969'
    date: '1969'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Fuel pipeline across the Trường Sơn. After a survey from mid-1968, Construction Site 18 lays the first stretch, 42 km through Vinh, Nam Đàn and Linh Cảm, the center of a line run north and south. By 1971 nearly 1,000 km is laid and working, in two branches, one over the Cổng Trời pass along Route 12 into Laos, one across the Gianh by Routes 10 and 18 to north of Route 9.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 216–17. Made public: 2013. Check: the day; the history gives the three years 1969–71.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1969.vietnam-hanoi-8
    when: '1969'
    date: '1969'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Route 559 carries 170,000 tons of cargo into the South, 29 percent more than in 1968: hundreds of thousands of rifles, B-40 and B-41 rockets and recoilless guns, hundreds of millions of rounds, thousands of radios. Over 80,000 troops march south over the Trường Sơn to the fronts. In the dry season of 1968–69 the tankers had brought in only about 90 tons of fuel against a need of 500.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 218–19. See [[cal.1969.vietnam-hanoi-2]]. Made public: 2013. Check: the day; the history gives the year and its own tonnages, which differ from the 52,424 tons of p. 93.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969.vietnam-pacification
    when: 1969, early
    date: '1969'
    at: before 1969-01
    thread: vietnam-pacification
    also: [vietnam-hanoi]
    c: 'Nixon puts a three-phase pacification and development plan into force in the South. Phase 1, building pacification, runs from the start of 1969 to June 1970; phase 2, special pacification, July 1970–June 1971; phase 3, community self-defense and rural development, from July 1971. The 1969 target: kill 30 percent of the 98,763 local revolutionary cadres the enemy has found; by mid-1970, secure 60 percent of the land. The history dates "accelerated pacification" Nov. 1968–June 1969 and the "rural development" phase July 1969–June 1970.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 52, 74–75 and n. 1. Names: Nixon. Check: the plan''s day and its phases; the history''s two datings of the first stages differ (p. 52 against p. 74 n. 1).'
    tags: [polity:us, name:nixon-richard-m]
  - id: cal.1969.vietnam-hanoi-7
    when: 1969, mid
    date: '1969'
    at: before 1969-05
    thread: vietnam-hanoi
    c: 'The Navy Command, which is also the Northeast Military Region''s, reorganizes the naval force: some units are split off or merged into battalions directly under the command, to fight alone or with others in assigned waters, ready the field for the Navy''s mobile force and help in coastal militia building. In 1970 the Central Military Party Committee''s standing body separates the Navy from the Northeast Military Region.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 205–6. Made public: 2013. Check: the day; the history says "từ giữa năm 1969". The Navy''s separation, "bước sang năm 1970" (at the turn of 1970, VI, 206), is an act of its own, within the calendar''s span only if before Jan. 20, 1970.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969.vietnam-hanoi-9
    when: 1969, first half
    date: '1969'
    at: before 1969-01
    place: quang-ngai-province
    thread: vietnam-hanoi
    also: [vietnam-pacification]
    c: Ba Làng An, Quảng Ngãi. 6,000 villagers forced by the Saigon side into a concentration area press the struggle until they are sent back to their old villages.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 127–28 and n. 1. To check: Viện Nghiên cứu chủ nghĩa Mác–Lênin và Tư tưởng Hồ Chí Minh, *Lịch sử Đảng Cộng sản Việt Nam, 1954–1975* (Chính trị quốc gia, 1995), II, 440–41 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 128 n.). Check: the day; the history gives it among the results of the spring and summer phases of 1969.'
    tags: [polity:drv]
  - id: cal.1969.vietnam-hanoi-10
    when: '1969'
    date: '1969'
    place: hanh-thong-tay
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Hạnh Thông Tây, Gò Vấp. The Mai Dinh sapper team of Saigon–Gia Định Battalion 4 slips into the depot, sets charges and destroys 35,000 tons of munitions, by the history's count. Mai Dinh is later named a Hero of the Liberation Armed Forces.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 140 and n. 1. Check: the day and the year; the history gives the raid in its account of the autumn and winter fighting round Saigon.'
    tags: [polity:drv]
  - id: cal.1969.vietnam-hanoi-11
    when: '1969'
    date: '1969'
    place: nhi-binh
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Nhị Bình. Battalion 2 of the Quyết Thắng Regiment shoots down 15 helicopters in beating a sweep, by the history's count.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 140. Check: the district, which the history prints "Gò Môn"; the day and the year, which it gives with the Saigon-area fighting of 1969.'
    tags: [polity:drv]
  - id: cal.1969.vietnam-hanoi-12
    when: '1969'
    date: '1969'
    place: rung-sat
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Rừng Sác. Group 10, the sappers, fights encircled through the year with 300 killed, cut off from supply and from its contacts among the people; makes its own arms, finds a way to attack ships, and raids the Nhà Bè fuel depot and the Thành Tuy Hạ bomb depot. By early 1970 170 are left.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 140 and n. 2. See [[cal.1969-05-19.vietnam-hanoi]]. Check: the days of the raids; the history gives the year.'
    tags: [polity:drv]
