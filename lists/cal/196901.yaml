    when: Jan. 19
    date: '1969-01-19'
    place: washington
    thread: transition-and-staff
    c: 'The White House and the National City Christian Church, Sunday. Returning from church with the Johnsons, Billy Graham tells them of Nixon''s plan to hold religious services in the East Room, a different minister each Sunday, himself to conduct the first next Sunday; Graham: it would let the Nixons "invite many people to the White House who would, otherwise, perhaps never come."'
    n: '[[w.johnson-white-house-diary]], 771 (Lady Bird Johnson''s account). Graham''s account to Mrs. Johnson; the East Room services are Nixon''s plan, not recorded here as begun. See [[cal.1969-01-19.transition-and-staff]]. Names: Graham, Nixon, Johnson, Lady Bird Johnson.'
