  - id: cal.1969-01-28.china-leadership-3
    when: Jan. 28
    date: '1969-01-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, after the meeting at Mao''s at which Mao affirms the Tsinghua propaganda team''s report on "re-educating" and "giving a way out" to intellectuals, drafts the Center''s and the Group''s forwarding comment: the report is very good, and without the team''s near half year of practice and struggle since entering Tsinghua on July 27 it could not have been written; it is forwarded for reference. The document goes out Jan. 29.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 272 (Jan. 28, 1969). Made public: 2020. See [[cal.1969-01-28.china-leadership-2]]. Names: Zhou Enlai, Mao Zedong.'
