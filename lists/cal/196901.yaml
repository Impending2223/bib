  - id: cal.1969-01-14.program
    when: Jan. 14
    date: '1969-01-14'
    time: 1969-01-15T02:05Z
    thread: program
    c: 'State of the Union, to a joint session, "for the sixth and the last time." Asked: social security up at least 13 percent, the minimum from $55 to $80 a month; medical care for expectant mothers and infants; the poverty program reorganized, not crippled; the Voting Rights Act''s main provisions extended five years; the full $300 million for the Safe Streets grants; licensing and registration of firearms; the postal system reorganized on the Kappel report; Members pay $42,500, not the commission''s $50,000; the draft by random selection. A surplus of $2.4 billion in fiscal 1969, $3.4 billion in 1970, the surtax extended, Nixon agreeing. The nonproliferation treaty ratified; the missile talks resumed. "At least it will be said that we tried." Of Russell, the President pro tempore: "I am sure that I have avoided many dangerous pitfalls by the good commonsense counsel" of Russell.'
    n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 1263](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=573) (Jan. 14, 1969). [[w.johnson-vantage-point]], 565 (the closing words); [[w.dallek-flawed-giant]], 597–98 (the address in person; the closing words); [[w.mann-walls-of-jericho]], 498–99 (Russell); [[w.califano-triumph-and-tragedy-of]], 333–34 (his tribute to Russell; "at least it will be said that we tried"; "Auld Lang Syne"); [[w.bernstein-guns-or-butter]], 305 (the ad-lib: "and there is more that will be set aside before this administration ends"); [[w.graham-uncertain-triumph]], 200–201. [[w.longley-lbjs-1968]], 259–60 (the address; Christian''s count of the applause). [[w.mcpherson-political-education]], 451. See [[cal.1968-01-17.program]]. Names: Johnson, Kappel, Nixon, Russell.'
