  - id: cal.1969-01-06.students-san-francisco
    when: Jan. 6
    date: '1969-01-06'
    thread: students-sf-state
    also: [labor-disputes]
    c: 'San Francisco State. The American Federation of Teachers'' local strikes, sanctioned by the San Francisco Labor Council: grievance procedures, amnesty for the strikers, the students'' demands settled, the trustees'' ten rules rescinded. Hayakawa: "a militant minority of the faculty has hitchhiked onto the militant, violence-ridden student strike for a vicious power grab."'
    n: '[[w.orrick-shut-it-down]], 62–63. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
    tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
