    c: Deng Xiaoping's 邓小平 situation eases; his children are allowed to visit. Told of Deng Pufang's disabled state, Deng urges Zhuo Lin 卓琳 to find some way for Pufang to be treated.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (1969). The words: 夏 (III, 1948). The nianpu gives only the summer. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
