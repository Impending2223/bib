    date: '1969-01-14'
    time: 1969-01-15T02:05Z
    place: washington
    thread: program
    c: 'State of the Union, to a joint session, "for the sixth and the last time." Asked: social security up at least 13 percent, the minimum from $55 to $80 a month; medical care for expectant mothers and infants; the poverty program reorganized, not crippled; the Voting Rights Act''s main provisions extended five years; the full $300 million for the Safe Streets grants; licensing and registration of firearms; the postal system reorganized on the Kappel report; Members pay $42,500, not the commission''s $50,000; the draft by random selection. A surplus of $2.4 billion in fiscal 1969, $3.4 billion in 1970, the surtax extended, Nixon agreeing. The nonproliferation treaty ratified; the missile talks resumed. "At least it will be said that we tried." Of Russell, the President pro tempore: "I am sure that I have avoided many dangerous pitfalls by the good commonsense counsel" of Russell.'
    n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 1263](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=573) (Jan. 14, 1969). [[w.johnson-vantage-point]], 565 (the closing words); [[w.dallek-flawed-giant]], 597–98 (the address in person; the closing words); [[w.mann-walls-of-jericho]], 498–99 (Russell); [[w.califano-triumph-and-tragedy-of]], 333–34 (his tribute to Russell; "at least it will be said that we tried"; "Auld Lang Syne"); [[w.bernstein-guns-or-butter]], 305 (the ad-lib: "and there is more that will be set aside before this administration ends"); [[w.graham-uncertain-triumph]], 200–201; [[w.schwartz-lyndon-johnson-and-europe]], 223 (the last State of the Union address, in person, January 1969, closing "I believe it will be said that we tried"; not the day or the entry''s "At least" line); [[w.johnson-white-house-diary]], 764–68 (Jan. 14: Mrs. Johnson in the House gallery with Lynda and Luci; "they began to rise and applaud and broke out into cheering on both sides, Republican and Democrat"; Johnson, at the Speaker''s stand, "paused a full several moments to receive and absorb the ovation"; the Cabinet, "a special wave of applause as Dean Rusk came in"; "President-elect Nixon in the days ahead will need your understanding, just as I did"; thirty-eight years since he first stood in the Chamber "as a doorkeeper in the Gallery"; the tribute to the men in Vietnam, "I have been honored to be their Commander in Chief"; the ending "But I believe that at least it will be said that we tried"; Patrick Lyn''s disruption of the gallery omitted here; the diary has no figures); [[w.schlesinger-journals]], 305 (Johnson''s "last State of the Union message tonight," Schlesinger watching; not the joint session or the words); [[w.obrien-no-final-victories]], 210 (Johnson endorses the postal corporation plan in his final State of the Union message, January 1969; not the day or the rest). [[w.longley-lbjs-1968]], 259–60 (the address; Christian''s count of the applause). [[w.mcpherson-political-education]], 451. See [[cal.1968-01-17.program]]. Names: Johnson, Kappel, Nixon, Russell.'
