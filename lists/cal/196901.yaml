    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 680. To check: Zhou Kang 周康, 〈駭人聽聞的雲南沙甸慘案〉, *Yanhuang chunqiu* 《炎黃春秋》, 2007, no. 7 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 678 n.20).'
