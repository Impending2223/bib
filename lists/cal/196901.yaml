  - id: cal.1969-01-03.congress
    when: Jan. 3
    date: '1969-01-03'
    thread: congress
    also: [rules, democratic-party]
    c: 'The 91st Congress convenes. Senate 57 D–43 R; House 243 D–192 R. Jan. 2, the House Democratic caucus: McCormack over Udall for Speaker, 178–58. McCormack Speaker over Ford, [241–187](https://voteview.com/rollcall/RH0910001). Powell, re-elected in November: the previous question on seating him without conditions refused, [176–248](https://voteview.com/rollcall/RH0910002); a special committee refused, [131–291](https://voteview.com/rollcall/RH0910004); H. Res. 2 adopted, [254–158](https://voteview.com/rollcall/RH0910006): sworn, fined $25,000, $1,150 a month taken from his salary until it is paid, his seniority from the oath.'
    n: '[115 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-2.pdf) (1969); [115 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-1.pdf) (1969). To check: [[w.nelson-john-william-mccormack]]; [[w.udall-too-funny-to-be]]; [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]. See [[cal.1967-01-10.rules]]; [[cal.1967-04-11.specials]]. Names: McCormack, Udall, Ford, Powell. Check: the pages.'
    tags: [congress:91, name:mccormack-john-w, name:udall-morris-k, name:ford-gerald-r, name:powell-adam-clayton-jr, committees:91]
    time_range:
      - 1969-01-03T17:00Z
      - 1969-01-04T01:14Z
    time_zone: America/New_York
