    when: Jan. 1
    date: '1969-01-01'
    thread: vietnam-paris
    c: 'The Politburo to Thọ and Thủy: Nixon has no choice but to de-escalate. At the four-party talks the aim all American forces out of the South; the delegation to seem cooperative, not eager; the military struggle against Thiệu''s government still first.'
