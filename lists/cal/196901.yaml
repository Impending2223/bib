    date: '1969-01-28'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: approves the Center''s forwarding of the Capital Workers'' and PLA Mao Zedong Thought Propaganda Team at Tsinghua''s report on re-educating intellectuals and "giving a way out": most intellectuals wish to make revolution; capitalist-roader errors forgiven when aware; bourgeois authorities criticized, then given a way out; counterrevolutionaries judged case by case. Issued Jan. 29.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 28, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 272 (Jan. 28–29, 1969; the Tsinghua report, its five points (note 1), the forwarding comment); [[w.jianguo-yilai-mao-zedong]], XIX, 395 (Jan. 28, 1969; Mao''s note ''Issue as it is'' on the report of Jan. 20 of the capital workers'' and PLA Mao Zedong Thought propaganda team at Tsinghua University on carrying out the policy of ''re-educating'' the intellectuals and ''giving a way out'', five points; the Center and the Group forwarded it Jan. 29). Made public: 2013. To check: Capital workers'' and PLA Mao Zedong Thought propaganda team at Tsinghua University, report of Jan. 20, 1969 on carrying out firmly the policy of ''re-education'' and ''giving a way out'' for the intellectuals (Guanyu jianjue guanche zhixing dui zhishifenzi ''zai jiaoyu'' ''gei chulu'' zhengce de baogao 关于坚决贯彻执行对知识分子“再教育”“给出路”政策的报告): five points; forwarded by the Center and the Cultural Revolution Group Jan. 29 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 395 n.1). Names: Mao Zedong.'
