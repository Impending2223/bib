    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 607. Made public: 1999. To check: [[w.longjia-kang-sheng-yu-zhao]], 179–180 (printed "199–180") (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 607 n.59).'
