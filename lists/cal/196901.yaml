      c: 249dd52d
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Jan. 31, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 273: A, B'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-01-31.china-leadership-2
    when: Jan. 31
    date: '1969-01-31'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai, reviewing the funeral report for Li Zongren, changes the farewell ceremony from "to be presided over by Fu Zuoyi, vice-chairman of the Political Consultative Conference" to "by Zhou Enlai, chairman", asks that Hong Kong's Ta Kung Pao and Wen Wei Po print Li's photograph with the news of his death, and adds Xie Fuzhi and Guo Moruo to those attending the farewell. Mao approves the revised report.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Jan. 31, 1969). Made public: 2020. See [[cal.1969-01-31.china-leadership]]. Names: Zhou Enlai, Xie Fuzhi, Mao Zedong.'
