    c: 'The White House, evening. The Johnsons'' farewell dinner for the Cabinet, honoring Hubert and Muriel Humphrey; every Cabinet member there. Johnson''s toasts to Humphrey, to Rusk, to all the Cabinet; Rusk responds. Humphrey speaks, "cheerful, looking ahead." Mrs. Johnson, from Dickens: "It was the best of times, it was the worst of times," and "a once-in-a-lifetime thing, and we are fortunate to have known it." Luci Nugent toasts the Cabinet "for our generation and for those that are coming on."'
    n: '[[w.johnson-white-house-diary]], 762 (Lady Bird Johnson''s account). The toasts as Mrs. Johnson gives them. Names: Johnson, Humphrey, Rusk, Lady Bird Johnson.'
