  - id: cal.1969-01-03.china-leadership
    when: Jan. 3
    date: '1969-01-03'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads the Military Commission Office Group''s papers on Xu Xiangqian''s recent conduct; his note to Huang Yongsheng: all old comrades tied to the "February countercurrent", and their families, are not to be criticized; relations to be mended.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 267 (Dec. 29, 1968; Mao''s note of Jan. 3, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 391–392 (Jan. 3, 1969; Mao''s note on the envelope (''there is a note inside; Huang Yongsheng to handle'') and his note, ''All the old comrades connected with the February counter-current and their families are not to be criticized; relations are to be mended'', on the Military Commission Office Group''s report of Dec. 26, 1968 with the papers on Xu Xiangqian''s recent conduct); [[w.mao-zedong-zhuan]], VI, ch. 77 n.58 (Jan. 3, on a paper sent by the Military Commission''s Office Group, Mao writes: all the old comrades tied to the ''February counter-current'' and their families are not to be criticized, relations are to be put right; the book does not name Huang Yongsheng or Xu Xiangqian, n.58). [[w.chen-yi-nianpu]], 1212 (Jan. 3, 1969; Mao''s note on a briefing on the old comrades'' thinking: none of the old comrades tied to the "February adverse current," nor their families, to be criticized, relations to be mended; "send to Lin (Biao), Zhou (Enlai)"). Made public: 1995. To check: Military Commission Office Group, report of Dec. 26, 1968 with the material on Xu Xiangqian''s recent conduct (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 391 n.1); Mao Zedong 毛泽东, comment on a paper sent by the Military Commission''s Office Group 军委办事组 (manuscript 手稿), Jan. 3, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.58). Names: Mao Zedong, Xu Xiangqian, Huang Yongsheng.'
    src:
      c: 74191f82
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Jan. 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 267: B, C'
        - 'w.jianguo-yilai-mao-zedong XIX, 391–392: A-C'
        - 'via w.jianguo-yilai-mao-zedong XIX, 391 n.1: all'
        - 'w.mao-zedong-zhuan VI, ch. 77 n.58: C'
        - 'via w.mao-zedong-zhuan VI, ch.77 n.58: C'
        - 'w.chen-yi-nianpu 1212: ?'
    tags: [polity:prc, name:mao-zedong, name:xu-xiangqian, name:huang-yongsheng, vis:only:prc]
  - id: cal.1969-01-03.china
    when: Jan. 3
    date: '1969-01-03'
    thread: china
    also: [south-asia]
    c: 'Foreign Ministry note to the Indian embassy: strong protest at the incident on the morning of Dec. 30, 1968, when several hundred Indian thugs and members of the Tibetan clique, carrying anti-Chinese placards and shouting anti-Chinese slogans, with knives and clubs, burst into the Chinese embassy in India, wrecked its buildings and cars, and beat the staff, wounding many.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 208 (Jan. 3, 1969).'
    src:
      c: 561fc213
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 208: all'
    tags: [polity:prc, polity:india, polity:roc]
  - id: cal.1969-01-04.china-leadership
    when: Jan. 4
    date: '1969-01-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao sees Xu Shiyou on the factionalism of the Zhejiang garrison in the "three supports, two militaries"; has Wang Dongxing tell Zhou Enlai and Kang Sheng to see Xu again that night and fix the means. Zhou reports that evening an eleven-man list to come to Peking Jan. 5 or 6 for a meeting to settle Zhejiang. Mao: "as proposed".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 4, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 269 (Jan. 4, 1969; the talk with Xu Shiyou and the list). Made public: 2013. Names: Mao Zedong, Xu Shiyou, Zhou Enlai, Kang Sheng, Wang Dongxing.'
    src:
      c: 2a1cb6b8
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Jan. 4, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 269: C'
    tags: [polity:prc, name:mao-zedong, name:xu-shiyou, name:zhou-enlai, name:kang-sheng, vis:only:prc]
  - id: cal.1969-01-04.china-leadership-2
    when: Jan. 4
    date: '1969-01-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai talks with Xu Shiyou, and they agree to settle Zhejiang's problem first; afterward he sends Mao the account of the talk and the list, drawn up with Xu, of people from Zhejiang's revolutionary committee and military district and the Nanjing Military Region to come to Peking for a meeting.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 269 (Jan. 4, 1969). Made public: 2020. Names: Zhou Enlai, Xu Shiyou, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:xu-shiyou, name:mao-zedong, vis:only:prc]
  - id: cal.1969-01-04.china
    when: '1969'
    date: '1969'
    thread: china
    c: The Foreign Ministry spokesman, on orders, makes the 466th to the 472nd serious warnings against U.S. warships and military aircraft entering Chinese waters and airspace off Guangdong and Fujian. The chronology gives the run as Jan. 4 to Dec. 4.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 208 (Jan. 4–Dec. 4, 1969). Check: the day of each warning; the chronology gives only the span here.'
    src:
