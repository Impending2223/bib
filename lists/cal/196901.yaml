    c: Lin Biao 林彪, by the account of Li Genqing 李根清, his office's keeper of secrets, studies the map of the "three norths" 三北, standing on it or with a magnifying glass; he has Li find Irkutsk 伊爾庫茨克 and measure its distance from Peking, to reckon a missile's flight, nine minutes to Tiananmen.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 816 (by Li Genqing''s account). Made public: 2016. To check: Shu Yun 舒雲, notes of her interview with Li Genqing, Dec. 25, 2011, in Shu Yun, *Lin Biao shijian wanzheng diaocha* 《林彪事件完整調查》 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 816 n.97). Names: Lin Biao.'
