    c: 'The Secretariat (Lê Duẩn, Tố Hữu, Nguyễn Côn), with the Minister of the Prime Minister''s Office, central branches and Bình Phương, deputy secretary of the Tây Bắc Zone Committee, hears the Standing Committees of Sơn La, Nghĩa Lộ and Lai Châu on their seven-year and two-year plans. The Northwest to become a great region of industrial crops, oil crops above all, of livestock and of forest: settlement of shifting cultivators; about 1.5 million hectares replanted or regenerated; the rice plains of Điện Biên, Nghĩa Lộ, Quang Huy and Than Uyên; local industry and roads.'
    n: '*Thông báo số 06-TB/TW, ngày 20-3-1969, ý kiến của Ban Bí thư Về phương hướng phát triển kinh tế, văn hoá của ba tỉnh Sơn La, Nghĩa Lộ, Lai Châu*, signed for the Central Office by Phạm Chung, its deputy chief. [[w.van-kien-dang-toan]], XXX, 42–47. Made public: 2004. The sittings: "Ngày 17, 18 và 27-1-1969" (Jan. 17, 18 and 27); the notice is dated Mar. 20. Names: Lê Duẩn, Tố Hữu, Nguyễn Côn, Bình Phương.'
