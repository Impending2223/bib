  - id: cal.1969-01-25.vietnam-saigon
    when: Jan. 25
    date: '1969-01-25'
    place: saigon
    thread: vietnam-saigon
    also: [vietnam-hanoi]
    c: Saigon. More than 10,000 people of different classes, parties and religions march to demand that the United States end the war and withdraw its and its allies' troops, that Thiệu, Kỳ and Hương resign, and that a peace government be formed. Seminars and petitions follow in Saigon, Đà Nẵng, Huế, Cần Thơ and other towns.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 155–56. Names: Thiệu, Kỳ, Hương. Check: the day and the number; the history gives them in its own account, with no Saigon or American source.'
    tags: [polity:rvn, name:nguyen-van-thieu, name:nguyen-cao-ky, name:tran-van-huong]
