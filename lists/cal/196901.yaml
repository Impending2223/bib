    n: 'Agnew, Farewell Address to Maryland General Assembly, Annapolis, Jan. 7, 1969, *Executive Records, Governor Spiro T. Agnew, 1967–1969* (Archives of Maryland, vol. 83), [pp. 995–1001](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--995.html) (the resignation, at the address''s end); his news conference, Dec. 17, 1968, [p. 993](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000083/html/am83--993.html) (to resign at noon, Jan. 7). *Maryland Manual*, 1969–70, [pp. 7–8](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--7.html) (Mandel chosen by the General Assembly, Jan. 7, 1969, sworn in within hours; Speaker of the House of Delegates). [Wikipedia, "Marvin Mandel"](https://en.wikipedia.org/wiki/Marvin_Mandel). Check: the vote of the joint session, from the *Journal of Proceedings*. Check: the *Manual* has Mandel elected Speaker in 1963. To check: [[w.callcott-maryland-and-america-1940]]; [[w.witcover-white-knight]]. Names: Agnew, Mandel.'
