    date: '1969-01-26'
    place: shanghai
    thread: china-leadership
    c: 'As a Shanghai 上海 report has it: some 600 confiscated pianos given to kindergartens; of the 5 million books that escaped the flames many dumped in an attic over a wet market on Fuzhou Road, a million rare volumes stacked to the ceiling on Huqiu Road, prey to vermin; in Fengxian, where a crematorium opened in September 1966, scrolls and paintings rot on a storeroom floor.'
    n: '[[w.dikotter-cultural-revolution]], 91 n.35. Made public: 2016. To check: Shanghai Municipal Archives, Jan. 26, 1969, B105-4-325, p. 3 (cited by [[w.dikotter-cultural-revolution]], 91 n.35a); Shanghai Municipal Archives, Sept. 5, 1972, B105-4-953, pp. 107–108 (cited by [[w.dikotter-cultural-revolution]], 91 n.35b); Shanghai Municipal Archives, May 29, 1967, B172-3-5, pp. 20–21 (cited by [[w.dikotter-cultural-revolution]], 91 n.35c). Check: which of the three reports gives each figure.'
