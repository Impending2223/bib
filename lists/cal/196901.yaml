  - id: cal.1969-01-01.china-leadership
    when: Jan. 1–4
    date: '1969-01-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai drafts a report to Mao, Lin Biao, the Center and the Cultural Revolution Group: of the State Council''s 62 units, all but a very few achieved great alliance long ago. For the 1969 national economic plan he proposes to strive to reach ahead of time the main production targets set for 1970 in the Third Five-Year Plan. Two oral contraceptives have been trial-made, 99.9 percent effective, to be sold cheap from this year.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 269 (Jan. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-01-03.congress
    when: Jan. 3
    date: '1969-01-03'
    place: washington
    thread: congress
    also: [rules, democratic-party]
    c: 'The 91st Congress convenes. Senate 57 D–43 R; House 243 D–192 R. Jan. 2, the House Democratic caucus: McCormack over Udall for Speaker, 178–58. McCormack Speaker over Ford, [241–187](https://voteview.com/rollcall/RH0910001). Powell, re-elected in November: the previous question on seating him without conditions refused, [176–248](https://voteview.com/rollcall/RH0910002); a special committee refused, [131–291](https://voteview.com/rollcall/RH0910004); H. Res. 2 adopted, [254–158](https://voteview.com/rollcall/RH0910006): sworn, fined $25,000, $1,150 a month taken from his salary until it is paid, his seniority from the oath.'
    n: '[115 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-2.pdf) (1969); [115 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-1.pdf) (1969). [[w.albert-little-giant-1990]], 310 (at the organizational caucus Udall challenges McCormack''s reelection as Speaker; McCormack wins 178 to 58; the page has only "In 1969"). To check: [[w.nelson-john-william-mccormack]]; [[w.udall-too-funny-to-be]]; [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]. See [[cal.1967-01-10.congress-4]]; [[cal.1967-04-11.specials]]. Names: McCormack, Udall, Ford, Powell. Check: the pages.'
    src:
      c: 7402c8bc
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-2.pdf: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-1-1.pdf: all'
