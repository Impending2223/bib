    when: Jan. 19, evening
    date: '1969-01-19'
    place: washington
    thread: transition-and-staff
    c: 'The White House, the last evening. Johnson to Califano, in the corner of the living room by the elevator: of Califano''s memoranda for new programs, "It''s too late to get them back"; "Nixon''s going to accuse you of being the socialist in the White House." Of Nixon in the McCarthy years and Helen Gahagan Douglas: "She was a fine person ... and he destroyed her." Advice: invest in land, "This Nixon knows nothing about the economy and it''s going to go to hell"; pay $500 more in income tax: "It''s not enough for Nixon to win. He''s going to have to put some people in jail."'
    n: '[[w.califano-triumph-and-tragedy-of]], 337–38. See [[cal.1969-01-19.transition-and-staff]]. Names: Johnson, Califano, Nixon.'
