  - id: cal.1969-01-24.vietnam-hanoi
    when: Jan. 24
    date: '1969-01-24'
    place: co-ca-va
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Cô Ca Va, west of Trị–Thiên. The 9th Marines, 3d Marine Division, and five battalions of the Saigon 1st Division, some 7,000 men with air and artillery, open Dewey Canyon against the Route 559 depots and roads. The 5th Regiment, the 3d Sapper Battalion, the way stations and the western guerrillas hold them. After 18 days: 2,863 out of action, 49 aircraft shot down or destroyed, six guns, by the history''s count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 100–101. Check: the end of the fighting and the figures; the history gives 18 days.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-01-25.china-leadership
    when: Jan. 25
    date: '1969-01-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai revises the Center, Cultural Revolution Group, State Council and Military Commission''s notice on the schools'' winter holiday: colleges and middle schools have none this year, urban primary schools keep it, shortened. He adds that primary schools have mostly gone to the communes, brigades or factory and street revolutionary committees, whose managers are to decide on holiday by town or country, climate and farm season, with no uniform rule.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 271 (Jan. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-01-25.china-leadership-2
    when: Jan. 25
    date: '1969-01-25'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai accompanies Mao in receiving the PLA commanders, local cadres and mass delegates in Peking's Mao Zedong Thought study classes and the delegates to the conferences on the "three supports and two militaries", the defense industry and the metallurgical industry.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 271 (Jan. 25, 1969); [[w.chen-yi-nianpu]], 1212 (Jan. 25, 1969; Mao and others, Chen Yi among them, receive the PLA commanders, revolutionary cadres and masses'' representatives at the Mao Zedong Thought study classes in Peking, the delegates to the congresses of four-good companies of the General Staff, the General Logistics Department, the navy, air force, artillery, armored forces, railway troops, signal corps, chemical defense troops and the Peking units and to the "three supports, two militaries" work conference, the defense industry''s study class, the metallurgical industry''s conference, the study class of the Defense Science and Technology Commission and the Seventh Ministry of Machine Building, and some specialized conferences). Made public: 1995. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-01-25.vietnam-paris
    when: Jan. 25
    date: '1969-01-25'
    place: paris
    thread: vietnam-paris
    also: [vietnam-hanoi]
    c: 'Paris. The first plenary session of the four-party conference opens: the DRV, the Front, the United States, Saigon. Xuân Thủy heads the DRV, Lê Đức Thọ special adviser; Trần Bửu Kiếm the Front, Nguyễn Thị Bình and Trần Hoài Nam deputies; Nguyễn Cao Kỳ Saigon, Phan Đăng Lâm deputy.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 101–2 and n. 1. [[w.lich-su-khang-chien-chong-my]], V, 342 (the first formal session of the four sides, opened at 10:25 a.m., the day printed "25-11-1969"). See [[cal.1969-01-18.vietnam-paris]]. Names: Xuân Thủy, Lê Đức Thọ, Nguyễn Thị Bình, Nguyễn Cao Kỳ, Trần Bửu Kiếm, Trần Hoài Nam, Phan Đăng Lâm. Check: the history says the United States was admitted to treat the Front as an official and lawful party; its note names Harriman at the head of the American side, where Lodge had been named Jan. 5 (see [[cal.1969-01-05.vietnam]]).'
    src:
      c: 9e1344b1
      rows:
        - 'w.lich-su-khang-chien-chong-my VI, 101–2 and n. 1: all'
        - 'w.lich-su-khang-chien-chong-my V, 342: A-B'
