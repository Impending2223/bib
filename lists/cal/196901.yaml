  - id: cal.1969-01-20.conservation
    when: Jan. 20
    date: '1969-01-20'
    thread: conservation
    c: 'Johnson''s last proclamations: Marble Canyon National Monument, Arizona, established; Arches and Capitol Reef in Utah and Katmai in Alaska enlarged. Udall''s further proposals, over 7 million acres, the Sonoran Desert and Alaska among them, sent to Congress''s Interior committees instead: their taking "would strain the Antiquities Act far beyond its intent."'
    n: 'Statement by the President Upon Signing Five Proclamations Adding Lands to the National Park System, [1968–69 Pub. Papers 1369](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=679) (Jan. 20, 1969); [Proclamation 3889—Establishing Marble Canyon National Monument, Arizona](https://www.presidency.ucsb.edu/documents/proclamation-3889-establishing-marble-canyon-national-monument-arizona) (Jan. 20, 1969); [Proclamation 3887—Enlarging the Arches National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3887-enlarging-the-arches-national-monument-utah) (Jan. 20, 1969); [Proclamation 3888—Enlarging the Capitol Reef National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3888-enlarging-the-capitol-reef-national-monument-utah) (Jan. 20, 1969); [Proclamation 3890—Enlarging the Katmai National Monument, Alaska](https://www.presidency.ucsb.edu/documents/proclamation-3890-enlarging-the-katmai-national-monument-alaska) (Jan. 20, 1969). [[w.longley-lbjs-1968]], 260–62 (the proclamations chosen, by Johnson''s account); [[w.shesol-mutual-contempt]], 463 (the small grants signed, the large refused, a million acres in Arizona among them; Udall: "If I had named the stadium after Lyndon Johnson, I would have had all seven million acres"); [[w.bernstein-guns-or-butter]], 305 (the big proposals would "strain" the law); [[w.dallek-flawed-giant]], 599 (in his last official act before Nixon''s inaugural Johnson signs five proclamations adding lands to the national park system, the last establishing a "Franklin Delano Roosevelt Memorial Park"; not Marble Canyon or the others by name); [[w.johnson-white-house-diary]], 771–72 (Jan. 19: "One of these was what to do about setting aside seven million acres of land for National Parks that Stew Udall had recommended. The conservationist in Lyndon was excited by the idea, but the old Congressman of twenty-four years'' tenure withdrew from it. He really doesn''t believe in government by executive order, but in a mutual working together of the Congress and the President"; the diary gives no proclamations and no Marble Canyon). Before noon, when his term ended (U.S. Const. amend. XX, § 1). Check: Bernstein, 305, has Johnson sign three orders, some 300 acres in the Sonoran Desert, Mt. McKinley enlarged, a new park above the Arctic Circle. Check: Dallek, 599, gives five proclamations, the last establishing a "Franklin Delano Roosevelt Memorial Park"; the entry has four, none of them that. To check: [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. Names: Johnson, Udall.'
