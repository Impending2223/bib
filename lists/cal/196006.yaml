    c: 'Zhou Enlai receives the Polish Ambassador, and at his request describes the visit to India: India''s stand on the boundary, no wish to settle; Nehru would use it to control the right at home and strike the left.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 324 (June 3, 1960); [[w.zhou-enlai-waijiao-huodong]], 283 (June 5, 1960; 下午6时, 中南海西花厅; the new Polish Ambassador); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 146–147 (June 5, 1960; Zhou receives the Polish ambassador (克诺泰) and describes the talks with Nehru: the trip was chiefly to show the Indian people that China wished to settle the questions; China took the initiative by going and made many proposals, all refused). Made public: 1993. Names: Zhou Enlai.'
