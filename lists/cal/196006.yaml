    range_basis: kind
  - id: cal.1960-06-02.elections-1960
    when: June 2
    date: '1960-06-02'
    thread: elections-1960-nomination
    c: 'Williams, governor of Michigan, for Kennedy, after Kennedy''s visit to his summer home on Mackinac Island, Mich.: 42 more of the State''s 51 votes. Before it, Sorensen with Williams and the State''s Democratic leaders, at the State convention in May; a questionnaire in forty-one parts for Kennedy to answer in writing.'
    n: '[[w.sorensen-kennedy]], 148–49; [[w.white-making-of-the-president]], 138–39 (Kennedy from San Francisco, June 1, and the Textile Workers'' endorsement in Chicago the morning of June 2; Mackinac Island; Williams''s announcement on the ferry). Names: Williams, Kennedy, Sorensen. Check: the day of the Michigan convention.'
    src:
      c: b0f2953c
      rows:
        - 'w.sorensen-kennedy 148–49: all'
        - 'w.white-making-of-the-president 138–39: all'
    tags: [name:williams-g-mennen, name:kennedy-john-f, name:sorensen-theodore-c]
  - id: cal.1960-06-02.soviet-union
    when: June 2
    date: '1960-06-02'
    thread: soviet-union
    also: [china]
    c: 'By poll, the Presidium approves a letter to the parties of the socialist camp: a meeting of their representatives at Bucharest at the end of June, on the situation since the Americans wrecked the summit, with a session there of the Warsaw Pact''s Political Consultative Committee, Peking, Pyongyang and Ulan Bator as observers. Khrushchev, out of the protocol: discipline one for all, the Chinese representative having published his speech; perhaps the Chinese invited for talks, a number of measures held back; Mao''s remarks on Kim Il Sung to be given Kim to read.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 443 (Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 128–31 (the resolution; the letter, signed by Khrushchev; the instructions to the ambassadors); [[w.zedong-mao-zedong-nianpu]], IV, June 5, 1960 (the letter as Peking read it); [[w.lengxi-shinian-lunzhan-1956-1966]], 273 (the CPSU Central Committee''s letter of June 2 proposes a Bucharest meeting of socialist parties during the Rumanian congress). Made public: 2003, 2008. Names: Khrushchev, Mao.'
    src:
      c: 591505d3
      rows:
        - 'w.prezidium-tsk-kpss-1954 I, 443: B-D'
        - 'w.prezidium-tsk-kpss-1954 III, 128–31: A'
        - 'via x.1960-06-02.presidium-protocol-284: B-D'
        - 'via x.1960-06-02.cc-letter-to-socialist-camp-parties: A'
        - 'w.zedong-mao-zedong-nianpu IV, June 5, 1960: A'
        - 'w.lengxi-shinian-lunzhan-1956-1966 273: A'
    tags: [name:khrushchev-nikita-s, name:mao-zedong]
  - id: cal.1960-06-02.civil-rights-the-executive
    when: June 2
    date: '1960-06-02'
    thread: civil-rights-the-executive
    c: 'DeLoach to Mohr, on Archibald Carey of Chicago, judge, alderman and AME pastor, whom the FBI had cultivated since 1957: "the Director was considerably embarrassed over the failure of our photographer in Chicago to take pictures of the Director and Dr. Carey''s sister." Carey has pressed the Bureau on its lack of Negro agents.'
    n: '[[w.branch-pillar-of-fire]], 533–34. To check: DeLoach to Mohr, June 2, 1960, FAC-82 (cited by [[w.branch-pillar-of-fire]], 534). Made public: [[w.branch-pillar-of-fire]] (1998). Names: DeLoach.'
    src:
      c: 7bd19edb
      rows:
        - 'w.branch-pillar-of-fire 533–34: all'
        - 'via x.1960-06-02.deloach-to-mohr-june-2-1960-fac: all'
    tags: [name:deloach-cartha]
  - id: cal.1960-06-02.vietnam-hanoi
    when: June 2
    date: '1960-06-02'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat, Hanoi: directive no. 208-CT/TW on floods and typhoons in 1960. Since the peace 64 million cubic meters of earth, 1,200,000 of stone, 205,000 of concrete on the dikes; some still low. Command boards at every level, youth and militia the core of the dike guards, strict discipline.'
    n: '*Chỉ thị của Ban Bí thư số 208-CT/TW về công tác phòng và chống lụt bão năm 1960*, signed for the Secretariat by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXI, 344–48. Made public: 2002.'
    tags: [polity:drv]
