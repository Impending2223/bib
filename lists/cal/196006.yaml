  - id: cal.1960-06-07.elections-1960
    when: June 7
    date: '1960-06-07'
    thread: elections-1960
    c: 'Primaries in California and South Dakota. Republican: Nixon in California; unpledged delegates in South Dakota. Democratic: Brown in California; Humphrey in South Dakota.'
    n: 'Cal. *Statement of Vote*, June 7, 1960, [pp. 4–6](https://archive.org/details/stateofcaliforn195262cali/page/n295); [S.D. *Official Vote by Counties, Primary Election, June 7, 1960*, p. 208](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1960P.pdf). CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey, Nixon, Brown.'
