    c: 'Zhou Enlai to Koirala, by letter, on learning that on June 28 a PLA unit took Nepalese crossing the border for Tibetan rebels, fired and killed one and took ten: the government is deeply concerned and is finding out the facts at once; if a Nepalese was killed, China will express deep regret; any Nepalese held will be freed promptly.'
