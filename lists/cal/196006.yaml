# Cal. VII June 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VII
entries:
  - id: cal.1960-06-02.economy
    when: June 2
    date: '1960-06-02'
    thread: economy
    c: The Federal Reserve eases. The discount rate cut from 4 to 3½ percent at Philadelphia and San Francisco, Martin's Board approving. In effect June 3; New York and eight others June 10.
    n: '[*Federal Reserve Bulletin*, July 1960, 756](https://fraser.stlouisfed.org/files/docs/publications/FRB/1960s/frb_071960.pdf#page=32) (the rates in effect, by Bank). To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.friedman-monetary-history-of-the]]. Names: Martin.'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1960-06-06.governors-ia
    when: June 6
    date: '1960-06-06'
    thread: governors
    also: [elections-1960]
    c: 'Iowa, governor; Loveless running for the Senate. Republican primary: Erbe, the attorney general, 36.3 percent, Schroeder 33.5, Nicholas 30.2. Democratic: Lieutenant Governor McManus 61.7, Hughes, of the Commerce Commission, 38.3.'
    n: '[*Summary of Official Canvass of Votes Cast in Iowa Primary Election, June 6, 1960*](https://sos.iowa.gov/elections/pdf/results/60s/1960primcanv.pdf); figures for Schroeder, Nicholas and Hughes from [Wikipedia, "1960 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1960_Iowa_gubernatorial_election) (the canvass''s scan illegible there). To check: [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. Names: Erbe, Loveless, Harold Hughes, Jack Schroeder, Nicholas, McManus.'
    tags: [state:ia, name:erbe-norman-a, name:schroeder-jack, name:nicholas-william-h, name:mcmanus-edward-j, name:hughes-harold-e, name:loveless-herschel-c]
  - id: cal.1960-06-07.elections-1960
    when: June 7
    date: '1960-06-07'
    thread: elections-1960
    c: 'Primaries in California and South Dakota. Republican: Nixon in California; unpledged delegates in South Dakota. Democratic: Brown in California; Humphrey in South Dakota.'
    n: 'Cal. *Statement of Vote*, June 7, 1960, [pp. 4–6](https://archive.org/details/stateofcaliforn195262cali/page/n295); [S.D. *Official Vote by Counties, Primary Election, June 7, 1960*, p. 208](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1960P.pdf). CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey, Nixon, Brown.'
    tags: [primary:1960-06-07, name:brown-edmund-g, name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1960-06-07.mississippi-ms
    when: June 7
    date: '1960-06-07'
    thread: mississippi
    also: [state-constitutions, jobs-and-wages]
    c: 'Special election: Mississippi ratifies a right-to-work amendment, Section 198-A: no one to be denied work for membership or nonmembership in a union. Proposed by the legislature Apr. 28 by two-thirds of each house.'
    n: '*Barnes v. Ladner*, [241 Miss. 606](https://static.case.law/miss/241/case-pdfs/0606-01.pdf), 131 So. 2d 458 (1961). Check: the vote.'
    tags: [state:ms]
  - id: cal.1960-06-07.governors-mt
    when: June 7
    date: '1960-06-07'
    thread: governors
    also: [elections-1960]
    c: 'Montana''s primary, for governor. Republican: Nutter, once the Republican State chairman, 33,099, 50.4 percent; D''Ewart, once U.S. Representative, 32,538. Democratic: Cannon 44,690, 34.9; Toole 40,537, 31.6; Kuchera 33,216, 25.9.'
    n: 'Votes: [Wikipedia, "1960 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1960_Montana_gubernatorial_election); Check: [Mont. *Report of the Official Canvass of the Vote Cast at the Primary Election, June 7, 1960*](https://archive.org/details/primaryofficial1960montrich). To check: [[w.malone-montana]]; [[w.peirce-mountain-states-of-america]]. Names: Nutter, D''Ewart, Paul Cannon, Toole, Kuchera.'
    tags: [state:mt, name:nutter-donald-g, name:dewart-wesley-a, name:cannon-paul, name:toole-jack, name:kuchera-mike]
  - id: cal.1960-06-08.elections-1960
    when: June 8
    date: '1960-06-08'
    thread: elections-1960
    c: 'Rockefeller, in a statement: those taking control of the Republican Party have not made clear where it is heading. A program of his own, defense first; Nixon asked to state his.'
    n: 'Check the wording against the text (*New York Times*, June 9, 1960). To check: [[w.smith-on-his-own-terms]]; [[w.persico-imperial-rockefeller]]; [[w.kabaservice-rule-and-ruin]]; [[w.gellman-president-and-the-apprentice]]; [[w.white-making-of-the-president]]. Names: Rockefeller, Nixon.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1960-06-08.economy-debt-limit
    when: June 8
    date: '1960-06-08'
    thread: economy-debt-limit
    c: 'House passes the Public Debt and Tax Rate Extension Act, H.R. 12381: the debt limit $8 billion over the permanent $285 billion for fiscal 1961; the corporate rate and the excises extended a year. Closed rule, [204–181](https://voteview.com/rollcall/RH0860143); passed, [223–174](https://voteview.com/rollcall/RH0860144).'
    n: '[106 Cong. Rec., House, June 8, 1960](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt9/pdf/GPO-CRECB-1960-pt9-9-2.pdf). The thirteen acts, 1960–69: [OMB, *Historical Tables*, Table 7.3](https://www.govinfo.gov/content/pkg/BUDGET-2025-TAB/xls/BUDGET-2025-TAB-8-3.xlsx). To check: [[w.morgan-eisenhower-versus-the-spenders]]; [[w.morgan-deficit-government]].'
    tags: [debt-limits]
  - id: cal.1960-06-09.economy
    when: June 9
    date: '1960-06-09'
    thread: economy
    c: Eight more Reserve Banks cut the discount rate to 3½ percent. Three-month bills at 2.29 percent, June 13.
    n: Federal Open Market Committee, [minutes, June 14, 1960](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19600614.pdf). See [[cal.1960-06-02.economy]].
  - id: cal.1960-06-10.japan-and-korea
    when: June 10
    date: '1960-06-10'
    thread: japan-and-korea-treaty
    c: Hagerty, at Haneda to prepare the President's visit, rides into Tokyo with MacArthur. Demonstrators stop the car and beat on it; a Marine helicopter lifts them out.
    n: 'FRUS 1958–60, XVIII, docs. [173](https://history.state.gov/historicaldocuments/frus1958-60v18/d173) (MacArthur to Goodpaster), [176](https://history.state.gov/historicaldocuments/frus1958-60v18/d176). See [[cal.1960-01-19.japan-and-korea]]. Names: Hagerty, MacArthur, Eisenhower.'
    tags: [name:hagerty-james-c, name:macarthur-douglas-ii, name:eisenhower-dwight-d]
  - id: cal.1960-06-11.europe-and-the-alliance-turkey
    when: June 11
    date: '1960-06-11'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: Eisenhower's letter to Gursel, at the new government's request for a statement of solidarity.
    n: 'FRUS 1958–60, X, pt. 2, doc. [367](https://history.state.gov/historicaldocuments/frus1958-60v10p2/d367). See [[cal.1960-05-27.europe-and-the-alliance]]. Names: Eisenhower, Gursel.'
    tags: [name:eisenhower-dwight-d, name:gursel-cemal]
  - id: cal.1960-06-12.japan-and-korea
    when: June 12–16
    date: '1960-06-12'
    thread: japan-and-korea-far-east
    c: 'Eisenhower to the Far East, by way of Anchorage. Manila, June 14–16: Garcia; the Philippine Congress.'
    n: 'Statement by the President Recorded Before Leaving for the Far East, [1960–61 Pub. Papers 470](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=522) (June 12, 1960); Joint Statement Following Discussions With President Garcia, [1960–61 Pub. Papers 499](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=551) (June 16). To check: [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.packard-protest-in-tokyo]]; [[w.schaller-altered-states]]. Names: Eisenhower, Garcia.'
    tags: [name:eisenhower-dwight-d, name:garcia-carlos-p]
  - id: cal.1960-06-14.elections-1960
    when: June 14
    date: '1960-06-14'
    thread: elections-1960
    also: [soviet-union]
    c: 'Kennedy in the Senate, after Paris: the failure lies in long-range planning, not in the U-2 or its timing. A program by points: the deterrent, forces for limited war, NATO, aid to the poorer nations, Latin America, the Middle East, Africa.'
    n: '[Remarks of Senator John F. Kennedy in the Senate](https://www.jfklibrary.org/archives/other-resources/john-f-kennedy-speeches/united-states-senate-u-2-incident-19600614) (June 14, 1960), reprinted in [[w.strategy-of-peace]]. To check: [[w.preble-john-f-kennedy-and]]; [[w.dallek-unfinished-life]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1960-06-14.states-and-cities
    when: June 14–16
    date: '1960-06-14'
    thread: states-and-cities
    also: [amendments, electoral-college]
    c: 'Twenty-third Amendment through Congress. The House passes Judiciary''s text, June 14, by voice. June 16: the Senate puts it into S.J. Res. 39 and adopts it, by voice. Electors for the District, no more than the least populous State''s. The Senate''s poll-tax ban and emergency appointments to the House dropped.'
    n: '[S.J. Res. 39, 74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf) (1960). H.J. Res. 757, 86th Cong. See [[cal.1960-02-02.states-and-cities]].'
  - id: cal.1960-06-15.japan-and-korea
    when: June 15–16
    date: '1960-06-15'
    thread: japan-and-korea-treaty
    c: 'Tokyo. Zengakuren students force their way into the Diet''s grounds; a woman student, Kanba Michiko, killed, some 600 hurt. June 16: Kishi''s cabinet asks that the President''s visit be put off. Eisenhower, in Manila, agrees.'
    n: 'FRUS 1958–60, XVIII, docs. [181](https://history.state.gov/historicaldocuments/frus1958-60v18/d181), [182](https://history.state.gov/historicaldocuments/frus1958-60v18/d182), [183](https://history.state.gov/historicaldocuments/frus1958-60v18/d183), [184](https://history.state.gov/historicaldocuments/frus1958-60v18/d184) (Eisenhower to Kishi). See [[cal.1960-01-19.japan-and-korea]]. Names: Kishi, Eisenhower, Kanba.'
    tags: [name:kishi-nobusuke, name:eisenhower-dwight-d, name:kanba-michiko]
  - id: cal.1960-06-18.japan-and-korea-far-east
    when: June 18–19
    date: '1960-06-18'
    thread: japan-and-korea-far-east
    c: 'Eisenhower in Taipei: Chiang. Quemoy shelled during the visit.'
    n: 'Joint Statement Following Discussions With President Chiang Kai-shek, [1960–61 Pub. Papers 509](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=561) (June 19, 1960). FRUS 1958–60, XIX, docs. [336](https://history.state.gov/historicaldocuments/frus1958-60v19/d336), [337](https://history.state.gov/historicaldocuments/frus1958-60v19/d337). See [[cal.1960-06-12.japan-and-korea]]. Names: Eisenhower, Chiang Kai-shek.'
    tags: [name:eisenhower-dwight-d, name:chiang-kai-shek]
  - id: cal.1960-06-19.japan-and-korea-far-east
    when: June 19–20
    date: '1960-06-19'
    thread: japan-and-korea-far-east
    also: [korea]
    c: 'Okinawa, June 19: demonstrators for reversion. Seoul, June 19–20: Prime Minister Huh Chung; the National Assembly.'
    n: 'Joint Statement Following Discussions With Prime Minister Huh Chung, [1960–61 Pub. Papers 521](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=573) (June 20, 1960). FRUS 1958–60, XVIII, [doc. 323](https://history.state.gov/historicaldocuments/frus1958-60v18/d323). See [[cal.1960-06-12.japan-and-korea]]. Names: Huh Chung.'
    tags: [name:eisenhower-dwight-d, name:huh-chung]
  - id: cal.1960-06-20.court
    when: June 20
    date: '1960-06-20'
    thread: court
    c: '*Hannah v. Larche*, [363 U.S. 420](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363420/usrep363420.pdf): the Civil Rights Commission may hear complaints against Louisiana registrars without naming the complainants or allowing cross-examination. *Flemming v. Nestor*, [363 U.S. 603](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363603/usrep363603.pdf): Congress may end the Social Security benefits of an alien deported for past Communist membership, 5–4. The Steelworkers trilogy, [363 U.S. 564](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363564/usrep363564.pdf): the courts to send grievances under labor contracts to arbitration.'
    n: 'The Court''s 1960 decisions: [[w.schwartz-super-chief]]. On *Hannah*: [[w.dulles-civil-rights-commission-1957]]. To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1960-06-20.economy-debt-limit
    when: June 20
    date: '1960-06-20'
    thread: economy-debt-limit
    c: Senate passes H.R. 12381, [84–0](https://voteview.com/rollcall/RS0860364). The Finance Committee's amendments repealing the 10 percent taxes on local telephone service and on passenger transportation rejected, [30–54](https://voteview.com/rollcall/RS0860355), [29–55](https://voteview.com/rollcall/RS0860356); McCarthy's, repealing the 4 percent dividend credit, adopted, [42–41](https://voteview.com/rollcall/RS0860357).
    n: '[106 Cong. Rec., Senate, June 20, 1960](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt10/pdf/GPO-CRECB-1960-pt10-6-1.pdf). See [[cal.1960-06-08.economy-debt-limit]]. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j]
  - id: cal.1960-06-22.japan-and-korea
    when: June 22–23
    date: '1960-06-22'
    thread: japan-and-korea-treaty
    c: 'Senate consents to the security treaty with Japan, [11 U.S.T. 1632](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=340), [373 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20373/v373.pdf#page=195), [90–2](https://voteview.com/rollcall/RS0860367). In Japan the Diet''s approval complete June 19, the upper house not having voted. June 23: ratifications exchanged in Tokyo, the treaty in force; Kishi announces he will resign.'
    n: 'Senate Exec. E, 86th Cong., 2d Sess. [FRUS 1958–60, XVIII, doc. 190](https://history.state.gov/historicaldocuments/frus1958-60v18/d190) (MacArthur, June 24). See [[cal.1960-01-19.japan-and-korea]]. Names: Kishi.'
    tags: [name:kishi-nobusuke]
  - id: cal.1960-06-22.school-aid
    when: June 22
    date: '1960-06-22'
    thread: school-aid
    c: 'Rules, Smith''s committee, refuses 7–5 to send the school bill to conference: the four Republicans and three Southern Democrats. School aid dead for the session.'
    n: 'See [[cal.1960-02-04.school-aid]]. Names: Smith.'
    tags: [name:smith-howard-w]
  - id: cal.1960-06-22.cuba
    when: June 22
    date: '1960-06-22'
    thread: cuba-bay-of-pigs
    c: Mexico City. Five anti-Castro groups declare against Castro as the Democratic Revolutionary Front (FRD), the program's exile front.
    n: 'FRUS 1961–63, X–XII, microfiche supp., doc. [232](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d232) (the briefing papers of Nov. 18); X, docs. [24](https://history.state.gov/historicaldocuments/frus1961-63v10/d24) (Dulles, Jan. 22, 1961), [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 4. Made public, the CIA''s part: *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1960-03-17.cuba]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1960-06-23.medicare
    when: June 23
    date: '1960-06-23'
    thread: medicare
    c: 'House passes the Social Security amendments, H.R. 12580, [381–23](https://voteview.com/rollcall/RH0860150). Mills''s plan: federal grants to the States for medical care of the needy aged; no insurance under Social Security.'
    n: 'See [[cal.1960-03-31.medicare]]. Names: Mills.'
    tags: [name:mills-wilbur-d]
  - id: cal.1960-06-23.states-and-cities-us
    when: June 23
    date: '1960-06-23'
    thread: states-and-cities
    also: [amendments]
    c: Hawaii's legislature ratifies the Twenty-third Amendment, the first State, a week after Congress proposed it. Massachusetts second, Aug. 22.
    n: House Manual (116th Cong.), [116](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg116.htm); [CONAN (2017), Amend. XXIII n.15](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=18). See [[cal.1960-06-14.states-and-cities]].
    tags: [state:hi, state:ma]
  - id: cal.1960-06-24.latin-america
    when: June 24
    date: '1960-06-24'
    thread: latin-america
    c: Caracas. A car bomb burns Betancourt and kills the head of his military household. Venezuela charges Trujillo's government.
    n: '[FRUS 1958–60, V, microfiche supp., doc. VE–44](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/ve_d44). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.crassweller-trujillo]]; [[w.diederich-trujillo]]. Names: Betancourt, Trujillo.'
    tags: [name:betancourt-romulo, name:trujillo-rafael]
  - id: cal.1960-06-25.specials
    when: June 25
    date: '1960-06-25'
    thread: specials
    c: North Carolina 12th, special. Roy A. Taylor (D) to Hall's seat, 98.6 percent.
    n: '[N.C. *Manual*, 1961, p. 246](https://archive.org/details/northcarolinaman1961nort/page/n259). Shares: Wikipedia. See [[cal.1960-03-08.specials]]. Names: Taylor.'
    tags: [special:1960-06-25-h-NC-12, name:taylor-roy-a]
  - id: cal.1960-06-25.governors-nc
    when: June 25
    date: '1960-06-25'
    thread: governors
    also: [elections-1960]
    c: 'North Carolina, Democratic runoff for governor: Sanford 352,133, 56.1 percent; Lake 275,905.'
    n: 'Votes: [N.C. *Manual*, 1961, p. 242](https://archive.org/details/northcarolinaman1961nort/page/n255). See [[cal.1960-05-28.governors-nc]]. Names: Sanford, Lake.'
    tags: [state:nc, name:sanford-terry, name:lake-i-beverly]
  - id: cal.1960-06-27.japan-and-korea-far-east
    when: June 27
    date: '1960-06-27'
    thread: japan-and-korea-far-east
    c: 'Home by Honolulu, June 26. Eisenhower''s report on the trip, radio and television: the disorders in Tokyo "Communist-inspired."'
    n: 'Radio and Television Report to the American People on the Trip to the Far East, [1960–61 Pub. Papers 529](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=581) (June 27, 1960). See [[cal.1960-06-12.japan-and-korea]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-06-27.court
    when: June 27
    date: '1960-06-27'
    thread: court
    c: '*Elkins v. United States*, [364 U.S. 206](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364206/usrep364206.pdf): evidence state officers seize unlawfully not admissible in a federal court, 5–4. The "silver platter" ends.'
    n: See [[cal.1960-06-20.court]].
  - id: cal.1960-06-27.testing
    when: June 27
    date: '1960-06-27'
    thread: testing
    c: Geneva. The five Communist delegations walk out of the Ten-Nation Disarmament Committee before the American plan is tabled.
    n: '[FRUS 1958–60, III, microfiche supp., doc. 587](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d587) (the delegation''s report). [[w.watson-into-the-missile-age]], 725. To check: [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]].'
  - id: cal.1960-06-27.states-and-cities-us
    when: June 27–29
    date: '1960-06-27'
    thread: states-and-cities
    also: [medicare]
    c: 'Governors'' Conference at Glacier National Park, Mont. Eisenhower''s recorded message, June 27. June 29: a resolution for health insurance for the aged "financed principally through" Social Security, adopted 30–13; Rockefeller and Brown for, Hollings against.'
    n: 'Remarks Recorded for the Governors Conference at Glacier National Park, Montana, [1960–61 Pub. Papers 526](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=578) (June 27, 1960). [*Proceedings of the Governors'' Conference, 1960*, 156–157](https://www.nga.org/wp-content/uploads/2026/03/1960_Annual_Meeting-compressed.pdf#page=171). To check: [[w.david-with-dignity]]. See [[cal.1960-06-23.medicare]]. Names: Eisenhower, Rockefeller, Brown, Hollings.'
    tags: [name:eisenhower-dwight-d, name:rockefeller-nelson, name:brown-edmund-g, name:hollings-ernest-f]
  - id: cal.1960-06-28.specials
    when: June 28
    date: '1960-06-28'
    thread: specials
    c: North Dakota, Senate, special, for Langer's seat. Burdick (D) over Governor John E. Davis (R), 104,593 to 103,475.
    n: '[N.D. *Official Abstract*, June 28, 1960, p. 3](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06-28-special.pdf). See [[cal.1960-03-08.specials]]. Names: Burdick, Davis.'
    tags: [special:1960-06-28-s-ND-1, name:burdick-quentin-n, name:davis-john-e]
  - id: cal.1960-06-28.governors-nd
    when: June 28
    date: '1960-06-28'
    thread: governors
    also: [elections-1960]
    c: 'North Dakota, governor. Republican primary: Lieutenant Governor Dahl 77.6 percent, one other 22.4. Guy the Democratic nominee unopposed.'
    n: '[*Official Abstract of Votes Cast at the Primary Election Held June 28, 1960*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06028-primary.pdf). To check: [[w.peirce-great-plains-states-of]]. Names: Guy, Dahl.'
    tags: [state:nd, name:dahl-clarence-p, name:guy-william-l]
  - id: cal.1960-06-28.state-constitutions-nd
    when: June 28
    date: '1960-06-28'
    thread: state-constitutions
    also: [legislatures]
    c: North Dakota, with the primary, approves an amendment reapportioning the House, 84,002 to 66,529; also a Department of Labor, 82,114 to 79,112, and the State's mineral rights reserved in school lands sold, 84,348 to 72,088.
    n: '[*Official Abstract of Votes Cast at the Primary Election Held June 28, 1960*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06028-primary.pdf), statement of the Board of Canvassers. To check: [[w.peirce-great-plains-states-of]].'
    tags: [state:nd]
  - id: cal.1960-06-28.economy-debt-limit
    when: June 28
    date: '1960-06-28'
    thread: economy-debt-limit
    c: Senate adopts the conference report on H.R. 12381, [61–32](https://voteview.com/rollcall/RS0860375).
    n: '[106 Cong. Rec., Senate, June 28, 1960](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt11/pdf/GPO-CRECB-1960-pt11-5-1.pdf). See [[cal.1960-06-08.economy-debt-limit]].'
  - id: cal.1960-06-29.cuba
    when: June 29
    date: '1960-06-29'
    thread: cuba
    c: Cuba seizes Texaco's refinery at Santiago. It would not refine Soviet crude; nor would Esso's or Shell's, on Washington's advice.
    n: 'FRUS 1958–60, VI, docs. [527](https://history.state.gov/historicaldocuments/frus1958-60v06/d527) (the companies at State, June 7), [532](https://history.state.gov/historicaldocuments/frus1958-60v06/d532) (special NSC meeting, June 22), [536](https://history.state.gov/historicaldocuments/frus1958-60v06/d536) (economic pressures, June 27), [537](https://history.state.gov/historicaldocuments/frus1958-60v06/d537) (Dillon to the President, June 27). Check: the advice, and whose. To check: [[w.paterson-contesting-castro]]; [[w.bonsal-cuba-castro-and-the]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.fursenko-one-hell-of-a]].'
  - id: cal.1960-06-30.congo
    when: June 30
    date: '1960-06-30'
    thread: congo
    c: 'The Congo independent, at Léopoldville. Kasavubu President, Lumumba Prime Minister. King Baudouin praises the work of Leopold II; Lumumba answers with the colonial humiliations. Murphy heads the American delegation: an embassy, 300 scholarships. Tshombe has told the consul Katanga will secede; Washington tells him to keep to the Congo.'
    n: 'Message to President Kasavubu, [1960–61 Pub. Papers 544](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=596) (June 30, 1960). FRUS 1958–60, XIV, docs. [103](https://history.state.gov/historicaldocuments/frus1958-60v14/d103) (to Tshombe, June 23), [105](https://history.state.gov/historicaldocuments/frus1958-60v14/d105), [106](https://history.state.gov/historicaldocuments/frus1958-60v14/d106). [[w.watson-into-the-missile-age]], 761. To check: [[w.kalb-congo-cables]]; [[w.namikas-battleground-africa]]; [[w.weissman-american-foreign-policy-in]]; [[w.hoskyns-congo-since-independence]]; [[w.mahoney-jfk]]; [[w.devlin-chief-of-station-congo]]; [[w.witte-de-moord-op-lumumba]]; [[w.gerard-death-in-the-congo]]. Names: Kasavubu, Lumumba, Tshombe, Murphy, Baudouin.'
    tags: [name:lumumba-patrice, name:kasavubu-joseph, name:tshombe-moise, name:murphy-robert-d, name:eisenhower-dwight-d, name:baudouin]
  - id: cal.1960-06-30.jobs-and-wages
    when: June 30
    date: '1960-06-30'
    thread: jobs-and-wages
    c: 'House passes a minimum wage bill, H.R. 12677, [341–72](https://voteview.com/rollcall/RH0860163), after taking Kitchin''s narrower substitute, [211–203](https://voteview.com/rollcall/RH0860162): $1.15 an hour for those covered; interstate retail chains brought in at $1, without overtime.'
    n: 'To check: [[w.sundquist-politics-and-policy]]. Names: Kitchin.'
    tags: [name:kitchin-alvin-p]
  - id: cal.1960-06-30.jobs-and-wages-2
    when: June 30–July 1
    date: '1960-06-30'
    thread: jobs-and-wages
    c: 'Veto of the federal pay raise, H.R. 9883: "indefensible by any light"; three-quarters of a billion dollars a year. Overridden July 1: House [345–69](https://voteview.com/rollcall/RH0860165), Senate [74–24](https://voteview.com/rollcall/RS0860382).'
    n: 'Veto of a Bill To Increase the Salaries of Federal Employees, [1960–61 Pub. Papers 544](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=596) (June 30, 1960). To check: [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-06-30.economy
    when: June 30
    date: '1960-06-30'
    thread: economy-debt-limit
    c: 'Public Debt and Tax Rate Extension Act signed, [74 Stat. 290](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg290.pdf): the debt limit raised $8 billion for fiscal 1961; the corporate rate and the excises extended a year.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1960-06-08.economy-debt-limit]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-06.mississippi-ms
    when: June
    date: 1960-06
    thread: mississippi
    also: [antisubversion]
    c: The State Sovereignty Commission, Barnett its chairman, votes $20,000 to the Citizens' Council Forum and monthly grants to the Council; by December 1964, $193,500 of State money.
    n: 'Mississippi Department of Archives and History, [Sovereignty Commission Online, "Agency History"](https://da.mdah.ms.gov/sovcom/scagencycasehistory). Made public: the Commission''s files, unsealed by order of the federal district court, Mar. 17, 1998. To check: [[w.katagiri-mississippi-state-sovereignty-commission]]; [[w.mcmillen-citizens-council]]; [[w.johnston-mississippis-defiant-years-1953]]. Names: Barnett.'
    tags: [state:ms, name:barnett-ross-r]
  - id: cal.1960-06-30.state-and-city-finance-us
    when: June 30
    date: '1960-06-30'
    thread: state-and-city-finance
    c: Fiscal 1960 closes in forty-six States. The fifty State governments' taxes for the year $18.0 billion, $100.64 a head; federal aid $6.4 billion; long-term debt $18.1 billion (Census).
    n: 'Census, [*Compendium of State Government Finances in 1960*](https://www2.census.gov/programs-surveys/gov-finances/datasets/historical/1900-1992%20State%20Government%20Finance.zip) (G-SF60-No. 2, 1961), tables 3, 4, 5, 12, 25, 35, 37. To check: [[w.bureau-data-base-on-historical]]; [[w.bureau-data-base-on-historical-2010]]; [[w.relations-tax-overlapping-in-the]]; [[w.maxwell-financing-state-and-local]].'
