  - id: cal.1960-06-09.elections-1960-3
    when: June 9
    date: '1960-06-09'
    thread: elections-1960
    c: 'Rauh with Kennedy in a taxi back to the Senate, after a luncheon for McGovern. Kennedy asks him to tell the *New York Post* he is healthy; for second place, "It will be Hubert Humphrey or another Midwestern liberal." Rauh: that relieves his fears about Johnson. Kennedy: "There''s no need for fears." By Rauh''s account, his notes made that day.'
    n: '[[w.mann-walls-of-jericho]], 268–69; [[w.solberg-hubert-humphrey]], 212 ("It will be Hubert or another midwestern liberal"). To check: Joseph L. Rauh Jr., oral history, LBJ Library (cited by [[w.mann-walls-of-jericho]], 268). Names: Rauh, Kennedy, McGovern, Humphrey, Johnson.'
