    c: 'Liu Shaoqi writes the editor''s note for the article of the Chengdu measuring and cutting tools plant''s Party committee, "A new-type system of socialist enterprise management," for *Renmin ribao*, and sends the paper with a letter to Li Jingquan and Li Xuefeng. The note: the "two participations, one reform, three combinations" has made important progress these two years, a very welcome thing; plants and mines able to are to spread the Chengdu experience and others to create the conditions; two conditions: cadres follow the mass line and take part in labor, and workers'' political awareness lets them treat state enterprises as masters. Note and article appear in *Renmin ribao* June 24.'
