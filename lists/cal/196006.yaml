  - id: cal.1960-06-02.elections-1960
    when: June 2
    date: '1960-06-02'
    thread: elections-1960
    c: 'Williams, governor of Michigan, for Kennedy, after Kennedy''s visit to his summer home on Mackinac Island, Mich.: 42 more of the State''s 51 votes. Before it, Sorensen with Williams and the State''s Democratic leaders, at the State convention in May; a questionnaire in forty-one parts for Kennedy to answer in writing.'
    n: '[[w.sorensen-kennedy]], 148–49; [[w.white-making-of-the-president]], 138–39 (Kennedy from San Francisco, June 1, and the Textile Workers'' endorsement in Chicago the morning of June 2; Mackinac Island; Williams''s announcement on the ferry). Names: Williams, Kennedy, Sorensen. Check: the day of the Michigan convention.'
