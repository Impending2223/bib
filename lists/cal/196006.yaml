    c: 'Jackie Robinson''s column prints, with Nixon''s leave, Nixon''s letter to him on civil rights: no party may take the Negro vote "for granted"; a strong stand "not only for the clear-cut moral considerations involved" but for the country''s standing abroad; to deny the struggle "the full talent and energies of 17 million Negro Americans" would be "stupidity of the greatest magnitude." Rockefeller''s challenge a "healthy stimulus."'
    n: '[[w.gifford-center-cannot-hold]], 74–75. To check: New York Post, June 10, 1960, 96 (cited by [[w.gifford-center-cannot-hold]], 75 n.55). See [[cal.1960-05-11.elections-1960]]. Names: Jackie Robinson, Nixon, Rockefeller.'
