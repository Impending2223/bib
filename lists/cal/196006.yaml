  - id: cal.1960-06-15.china-leadership
    when: June 15
    date: '1960-06-15'
    thread: china-leadership
    c: 'Mao 毛泽东, on four documents to be read at the enlarged Politburo meeting at Shanghai 上海 and returned: things develop by their own laws, whatever imperialists, reactionaries, revisionists and ''semi-revisionists'' 半修正主义者 will; those who find the laws and unite all they can will win; class struggle is so, production struggle also. ''All the world''s victories are ours.'' The four: Huan Xiang''s 宦乡 report of June 9 on the SEATO foreign ministers'' meeting; the embassy in Moscow''s of June 12 on the Soviet press''s counterattack, marking Lenin''s "Left-Wing" Communism; the embassy in Bucharest''s of June 10; the embassy in Prague''s of June 11.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 244–246 (June 15, 1960; Mao''s comment of June 15; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Huan Xiang, Chinese chargé d''affaires in Britain, report of June 9, 1960, "On the SEATO foreign ministers'' meeting" (the meeting reassessed China; the U.S. for military action; Britain, France, Canada and others opposed) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 245 n.1a); Chinese embassy in the Soviet Union, report of June 12, 1960, "New current trends in the Soviet Union" (Soviet press of June 10 and 12 on the 40th anniversary of Lenin''s "Left-Wing" Communism) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 245 n.1b); Chinese embassy in Romania, report of June 10, 1960, on the Romanian party''s *Lupta de clasă* no. 5 reprinting in full the Soviet *Kommunist* no. 8 article "On the old positions of revisionism", and *Scînteia*''s commentary of June 5 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 246 n.1c); Chinese embassy in Czechoslovakia, report of June 11, 1960, "A few scattered reactions to three articles" (Polish attaché and Czechoslovak officials on the Chinese articles for Lenin''s anniversary) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 246 n.1d). Names: Mao Zedong, Huan Xiang.'
