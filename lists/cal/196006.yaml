  - id: cal.1960-06-14.elections-1960
    when: June 14
    date: '1960-06-14'
    thread: elections-1960
    also: [soviet-union]
    c: 'Kennedy in the Senate, "A Time of Decision," after Paris: the real issue not "the ill-considered timing of the U-2" but "the lack of long-range preparation, the lack of policy planning." A program in twelve points: the deterrent, forces for limited war, NATO, aid to the poorer nations with Western Europe and Japan, Latin America, the Middle East, Africa, Berlin, Eastern Europe, China, arms control, a stronger America. Mansfield, Humphrey, Gore, Church, Capehart and Gruening in colloquy.'
    n: 'Kennedy, "A Time of Decision," [106 Cong. Rec. 12522–29 (1960)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt10/pdf/GPO-CRECB-1960-pt10-1-1.pdf#page=26) (Senate, June 14, 1960) (the speech, 12522–26; the colloquy, 12526–29). [[w.sorensen-kennedy]], 149–50 (the speech, on foreign policy). To check: [Remarks of Senator John F. Kennedy in the Senate](https://www.jfklibrary.org/archives/other-resources/john-f-kennedy-speeches/united-states-senate-u-2-incident-19600614) (June 14, 1960), JFK Library; [[w.strategy-of-peace]] (the speech reprinted); [[w.preble-john-f-kennedy-and]]; [[w.dallek-unfinished-life]]. Names: Kennedy, Mansfield, Humphrey, Gore, Church, Capehart, Gruening.'
