    when: June 3
    date: '1960-06-03'
    thread: china-leadership
    c: 'The provincial committee''s inspection team for Taolin 桃林 commune, Huangchuan 潢川 county, reports on the deaths there: 34,897 people in 7,645 households in Sept. 1959, 29,438 in 6,953 in May 1960; 5,459 dead, 15.64 percent, and 692 households wiped out.'
    n: '[[w.yang-jisheng-mubei]], I, 50 n.26. Made public: 2008. To check: Henan Provincial Committee, inspection team, Taolin commune team, "Report of inspection of the deaths at Taolin commune, Huangchuan county, from unsuitable arrangements for livelihood," June 3, 1960 (cited by [[w.yang-jisheng-mubei]], I, 46 n.18, 50 n.26).'
