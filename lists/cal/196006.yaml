    date: '1960-06-30'
    thread: china-leadership
    also: [soviet-union]
    c: 'Politburo meeting, Mao presiding, Peng Zhen reporting on the Bucharest delegation. Taken as a surprise attack and an encounter; Mao: Khrushchev decided on June 2 to bring China to heel, the June 7 letter a deceit; a counter-encirclement, to stop short, as in the Central Soviet''s campaigns. The first round; a hard fight expected at the parties'' meeting in November. The Beidaihe work conference in July to take up Sino-Soviet relations; a circular to senior cadres on Bucharest; no polemic in print, unsigned or not, until the November meeting, current commentary on America and the nationalist states going on.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 298–300; [[w.yang-shangkun-riji]], I, 523 (June 30, 1960; 4 p.m., in the rear hall of the Huairen Tang, to 9; Peng Zhen and Kang Sheng report); [[w.deng-xiaoping-nianpu-1904]], III, 1563 (June 30, 1960; afternoon; Deng at the enlarged Politburo, which hears Peng Zhen, Kang Sheng and Wu Xiuquan on Bucharest). Made public: 1999. Check: the *Mao zedong zhuan* has Mao on the road from Shanghai June 29 to Tianjin July 2 and Peng Zhen and Kang Sheng reporting to him on the train at Tianjin that evening, not at Peking June 30. See [[cal.1960-07-02.china-leadership-8]]. Names: Mao Zedong, Peng Zhen. Check: the place: Mao was at Shanghai late June; Wu gives none.'
