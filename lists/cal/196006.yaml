    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou Enlai drafts for the Center a letter to Peng Zhen, Kang Sheng and Wu Xiuquan at the Bucharest meeting of communist and workers'' parties (June 24–26): steps and means for handing out China''s own statement outside the sessions, as its corrections to the communiqué.'
