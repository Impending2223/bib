    also: [china]
    c: 'Shanghai. Liu Shaoqi presides at the symposium of the regions'', provinces'', cities'' and central departments'' chief officials. He opens: in the last half-year the work has had serious problems, in grain, dropsy, abnormal deaths, accidents and the fulfillment of the plan. Everyone wants more and faster, a bigger plate, more construction; the plan has been too high, the demands too urgent, the press too loud, and the Center is included. The Lushan meeting meant to sum this up, but the Peng Dehuai affair pushed it aside. If not corrected the problems, now one finger, may grow to two or three.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 488–489 (June 10, 1960); [[w.yang-shangkun-riji]], I, 517 (June 10, 1960; morning and afternoon, unfinished); [[w.deng-xiaoping-nianpu-1904]], III, 1558 (June 10, 1960; Deng attends; Bo Yibo, Tan Zhenlin, Li Xiannian and Li Fuchun on industry and communications, agriculture, grain and livelihood, and the supplementary plan. Deng: those present are the ones in charge; not to forget the "one finger" or less; heads hot but cooler; some comrades have lost the Party''s tradition of seeking truth from facts; for the three-year plan "right opportunism" better, with room to spare). Made public: 1996. Names: Liu Shaoqi, Peng Dehuai.'
