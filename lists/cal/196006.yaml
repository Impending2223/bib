  - id: cal.1960-06-03.china-leadership
    when: June 3
    date: '1960-06-03'
    place: peking
    thread: china-leadership
    also: [middle-east]
    c: 'Zhou Enlai receives Iraq''s Ambassador, Abd al-Haqq Fadil: tension with neighbors is bad but may help unity at home; a good leader joins the anti-imperialist and democratic forces against outside enemies; gaps at home let in plotters; the other danger is a leader who cannot unite his people and pushes them into opposition. He sends good wishes to Qassim.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 324 (June 3, 1960); [[w.zhou-enlai-waijiao-huodong]], 283 (June 5, 1960; 下午, 中南海); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 146 (June 5, 1960; Zhou receives the Iraqi ambassador (法迪尔) and says a good leader unites the anti-imperialist and democratic forces against outside enemies; gaps at home let plotters in; the other danger is a leader who cannot unite people and drives them into opposition). Made public: 1993. Names: Zhou Enlai.'
    src:
      c: f8847166
      rows:
        - 'w.zhou-enlai-nianpu-1949 II, 324: ?'
        - 'w.zhou-enlai-waijiao-huodong 283: A'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 146: B-D'
    tags: [polity:prc, polity:iraq, name:zhou-enlai, vis:only:prc+iraq]
    variants:
