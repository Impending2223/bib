    c: 'The Center, by Mao''s 毛泽东 draft, to the Shanghai 上海 Bureau and the Party committees of the provinces, cities and autonomous regions: encloses two Guangdong 广东 papers on the ''three antis'' 三反 in the countryside; the Center finds the questions raised and their handling correct, for other places to consult. The papers: Tao Zhu 陶铸''s opinions of May 21 from Shantou 汕头 and the provincial committee''s report of June 4. Tao proposes provincial committee members four months a year below, prefectural six, county secretaries seven, and, from then to 1962, the ''three togethers'' 三同 with cadres and masses restored at once.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 241–243 (June 14, 1960; the Center''s comment of June 14, 1960; printed from Mao''s manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Tao Zhu, "Opinions on doing the rural ''three antis'' well and thoroughly improving cadres'' work style", written at Shantou, May 21, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 241 n.1a); Guangdong Provincial Party Committee, report "The rural ''three antis'' must win a great victory", June 4, 1960 (cadres to eat in the mess halls and farm; twelve rules for rural cadres; mess halls the center of reform; coarse grains to be planted) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 241 n.1b). Names: Mao Zedong, Tao Zhu.'
