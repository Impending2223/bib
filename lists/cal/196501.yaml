    when: Jan. 11
    date: '1965-01-11'
    thread: state-legislatures
    c: 'Iowa''s 61st General Assembly meets, Democratic for the first time in thirty years: Senate 34–25, House 101–23.'
    n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 107–110. To check: [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. See [[cal.1964-02-24.legislatures-ia]].'
