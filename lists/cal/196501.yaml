  - id: cal.1965-01-04.legislatures-mo
    when: Jan. 4
    date: '1965-01-04'
    thread: legislatures
    c: Missouri. A three-judge federal court holds the congressional districts of 1961 unconstitutional, on a suit of voters of the 2nd and 3rd Districts.
    n: '*Preisler v. Secretary of State of Missouri*, [238 F. Supp. 187](https://static.case.law/f-supp/238/case-pdfs/0187-01.pdf) (W.D. Mo. 1965). See [[cal.1964-02-17.court]].'
    tags: [state:mo]
  - id: cal.1965-01-04.mayors-providence
    when: Jan. 4
    date: '1965-01-04'
    thread: mayors
    also: [elections-1964]
    c: Providence. Doorley, 34, of the City Council, sworn as mayor, the youngest in the city's history. McGarry, the Democratic city chairman, had backed him in 1964 against Reynolds, mayor since 1951.
    n: '[Wikipedia, "Joseph A. Doorley Jr."](https://en.wikipedia.org/wiki/Joseph_A._Doorley_Jr.); [Wikipedia, "Walter H. Reynolds"](https://en.wikipedia.org/wiki/Walter_H._Reynolds). Check the primary and the November vote in the *Providence Journal*. To check: [[w.moakley-rhode-island-politics-and]]. Names: Doorley, Reynolds, McGarry.'
    tags: [state:ri, city:providence, name:doorley-joseph-a-jr, name:reynolds-walter-h, name:mcgarry-lawrence-p]
