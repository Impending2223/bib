  - id: cal.1965-01-11.legislatures-tx
    when: Jan. 11
    date: '1965-01-11'
    thread: legislatures
    c: A three-judge court holds the Texas Constitution's apportionment of both houses, and the statutes under it, void under the equal protection clause, on the suit of William Kilgarlin and others, filed July 15, 1963. The Legislature given until Aug. 2.
    n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/case-pdfs/0404-01.pdf) (S.D. Tex. 1966), recites the summary judgment of Jan. 11, 1965 (Tex. Const. art. III, §§ 25, 26a). To check: [[w.davidson-race-and-class-in]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Kilgarlin.'
    tags: [state:tx, name:kilgarlin-william-w]
