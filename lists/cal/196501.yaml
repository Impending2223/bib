    c: 'Chicago. The Republican National Committee elects Bliss chairman, unanimously; Burch to stay until April, by the terms settled with Goldwater at his home in Phoenix. The committee approves Laird''s plan for a Republican Coordinating Committee. Its members, by Hess and Broder''s account: Eisenhower, five of the Senate''s Republican leaders, seven of the House''s, five governors, the four living defeated nominees, five of the national committee, one State legislator. Bliss to the committee: "I am no modern miracle man, but I will work hard and try to do a job for you." Goldwater introduces Nixon, by Nixon''s account: the man "who worked harder than any one person for the ticket." Nixon master of ceremonies at the luncheon before the vote.'
