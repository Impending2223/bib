  - id: cal.1965-01-04.congress
    when: Jan. 4
    date: '1965-01-04'
    thread: congress
    also: [rules]
    c: '89th Congress convenes. Senate 68 D–32 R; House 295 D–140 R. McCormack Speaker over Ford, [289–139](https://voteview.com/rollcall/RH0890001). The five Mississippians seated over the Freedom Democrats'' challenge, Ryan objecting: the previous question, [276–149](https://voteview.com/rollcall/RH0890002). New rules, [224–202](https://voteview.com/rollcall/RH0890003) on the previous question: the 21-day rule restored; a bill sent to conference by majority vote.'
    n: 'H.R. Res. 1, H.R. Res. 8, 89th Cong. [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf). [[w.dittmer-local-people]], 339–40 (the Mississippians seated over Ryan''s objection). CQ Almanac 1965. To check: [[w.robinson-house-rules-committee]]; [[w.macneil-forge-of-democracy]]; [[w.bolling-house-out-of-order]]; [[w.zelizer-on-capitol-hill]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.congress-and-the-nation-1969]] (K–J Cong. II.L); *New York Times*, Jan. 6, 1965 (cited by [[w.dittmer-local-people]], 340 n.5). See [[cal.1963-01-09.congress]]; [[cal.1963-01-09.rules]]. Names: McCormack, Ford, Ryan.'
