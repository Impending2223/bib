  - id: cal.1965-01-27.vietnam
    when: Jan. 27
    date: '1965-01-27'
    thread: vietnam-saigon
    c: 'Saigon. The Armed Forces Council withdraws its confidence from Hương''s government and charges Khánh with the crisis: an alliance of Khánh and the Buddhist Institute, Taylor reports. Oánh acting Prime Minister. In Washington that morning, McGeorge Bundy and McNamara to Johnson: present policy "can lead only to disastrous defeat"; of two courses, military power "to force a change of Communist policy" or negotiation, they favor the first. Rusk dissents. Bundy to go to Saigon; American dependents to be withdrawn.'
    n: 'Denney to Rusk, Jan. 27: [FRUS 1964–68, II, doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v02/d40) (the Armed Forces Council''s communiqué; Khánh and the Buddhists). [FRUS 1964–68, II, doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v02/d41); [doc. 42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42); [doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v02/d43); [doc. 44](https://history.state.gov/historicaldocuments/frus1964-68v02/d44); [doc. 47](https://history.state.gov/historicaldocuments/frus1964-68v02/d47). [[w.gibbons-u-s-government-and]], III, 45–46 (Hương removed, Jan. 26–27; Oánh acting; Alexis Johnson''s report of Khánh''s alliance with the Buddhists); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 528–29 (Khánh''s takeover; the memorandum; Rusk; Bundy''s mission); [[w.cosmas-joint-chiefs-of-staff-2012]], 207 (the memorandum); [[w.moyar-triumph-forsaken]], 351–52; [[w.westmoreland-soldier-reports]], 96 (the council ousts Hương''s government at Khánh''s bidding, Taylor away; Oánh acting). [[w.rusk-as-i-saw-it-1990]], 447 (Rusk''s position, as Bundy''s memorandum gives it). To check: [[w.goldstein-lessons-in-disaster]]; [[w.bird-color-of-truth]]; [[w.mcnamara-in-retrospect]]. See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-20.vietnam]]. Names: Trần Văn Hương, Nguyễn Khánh, Nguyễn Xuân Oánh, Taylor, McGeorge Bundy, McNamara, Rusk, Johnson.'
