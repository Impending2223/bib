    c: 'State of the Union: "the Great Society." Education, $1.5 billion the first year; hospital care under Social Security; the war on poverty doubled; "every remaining obstacle" to the vote removed; immigration by a man''s work, not his birthplace; a Department of Housing and Urban Development; excise taxes cut. Vietnam: "We will not break it now."'
    n: 'Annual Message to the Congress on the State of the Union, [1965 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=77) (Jan. 4, 1965). [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf) (1965). [[w.johnson-vantage-point]], 214 (hospital care); [[w.dallek-flawed-giant]], 193–94; [[w.califano-triumph-and-tragedy-of]], 154 ("the explosion in world population and the growing scarcity in world resources"); [[w.branch-pillar-of-fire]], 556; [[w.zelizer-fierce-urgency-of-now]], 184 (the day''s call for health care for the aged); [[w.kotz-judgment-days]], 260 (the program: education, disease, the city, rivers and air, "every remaining obstacle to the right and the opportunity to vote"); [[w.bernstein-guns-or-butter]], 309 ("As pledged in our 1960 and 1964 Democratic platforms, I will propose to Congress changes in the Taft-Hartley Act, including Section 14(b)"). [[w.sundquist-politics-and-policy]], 271 (the vote). To check: NYT, Jan. 5, 1965, p. 16 (cited by [[w.branch-pillar-of-fire]], 556); Dave Waters to LBJ, Jan. 13, 1965, Box 367, WHCEF-PR, LBJ (cited by [[w.branch-pillar-of-fire]], 556). After Moyers''s briefing before it: [[cal.1965-01-04.voting-rights-2]]. See [[cal.1964-01-08.program]]; [[cal.1964-05-22.program]]. Check: the page.'
