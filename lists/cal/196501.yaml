    date: '1965-01-27'
    thread: vietnam
    c: 'Johnson with Rusk, McNamara and McGeorge Bundy, 11:30 a.m., on Bundy''s memorandum. Johnson, by Bundy''s notes: "Stable government or no stable government, we''ll do what we have to do.... We will move strongly. Khanh is our boy." The dependents to be evacuated, "clearing decks for further decisions"; the destroyer patrols in the Gulf of Tonkin to resume.'
    n: '[FRUS 1964–68, II, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v02/d43) (State to Taylor, 8:48 p.m.: the meeting "at highest levels"; the evacuation, "clearing decks"); doc. [42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42) n.2 (McNamara: the views given Johnson "in a mtg with Dean Rusk"). [[w.logevall-choosing-war]], 318–19 (the meeting; Johnson''s words; the patrols, 319). Johnson to Taylor, 9:46 p.m.: [FRUS 1964–68, II, doc. 44](https://history.state.gov/historicaldocuments/frus1964-68v02/d44). To check: MB meeting notes, Jan. 27, 1965, NSF MPB, LBJ Library (cited by [[w.logevall-choosing-war]], 318 n.32). See [[cal.1965-01-27.vietnam-2]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Nguyễn Khánh.'
