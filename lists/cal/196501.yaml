# Cal. LXII January 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXII
entries:
  - id: cal.1965-01-02.congress
    when: Jan. 2
    date: '1965-01-02'
    thread: congress
    also: [south-carolina, mississippi]
    c: House Democratic caucus. McCormack renominated for Speaker. Watson of South Carolina and Williams of Mississippi, who backed Goldwater, stripped of their seniority.
    n: '[111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf) (McCormack: "on Saturday last"). [[w.peabody-leadership-in-congress]]; [[w.zelizer-on-capitol-hill]]. See [[cal.1964-11-03.elections-1964]]. Names: McCormack, Goldwater, Williams, Watson.'
    tags: [name:mccormack-john-w, name:watson-albert-w, name:williams-john-b, name:goldwater-barry-m]
  - id: cal.1965-01-02.voting-rights
    when: Jan. 2
    date: '1965-01-02'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. King at Brown Chapel, against a State court's injunction on meetings. The campaign to register Dallas County's Black citizens begins.
    n: '[[w.garrow-protest-at-selma]]; [[w.lawson-black-ballots]]; [[w.may-bending-toward-justice]]; [[w.branch-pillar-of-fire]]; [[w.kotz-judgment-days]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1964-12-10.voting-rights]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-01-03.opinion
    when: Jan. 3
    date: '1965-01-03'
    thread: opinion
    also: [medicare]
    c: 'Gallup, Dec. 11–16, 1964: a compulsory program of hospital and nursing home insurance for the elderly, paid for by higher Social Security taxes: approve 63 percent, disapprove 28. Know why the American Medical Association opposes it: 52.'
    n: '[[w.gallup-poll]], III, 1915.'
  - id: cal.1965-01-04.congress-2
    when: Jan. 4
    date: '1965-01-04'
    thread: congress
    also: [elections-1964]
    c: House Republicans, in conference, choose Ford over Halleck for minority leader, 73–67.
    n: '[Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf#page=6). [[w.peabody-ford-halleck-minority-leadership]]; [[w.peabody-leadership-in-congress]]; [[w.jones-minority-party-in-congress]]; [[w.ford-time-to-heal]]; [[w.scheele-charlie-halleck]]. See [[cal.1963-01-09.congress]]. Names: Ford, Halleck.'
    tags: [name:ford-gerald-r, name:halleck-charles-a]
  - id: cal.1965-01-04.congress
    when: Jan. 4
    date: '1965-01-04'
    thread: congress
    also: [rules]
    c: '89th Congress convenes. Senate 68 D–32 R; House 295 D–140 R. McCormack Speaker over Ford, [289–139](https://voteview.com/rollcall/RH0890001). The five Mississippians seated over the Freedom Democrats'' challenge, Ryan objecting: the previous question, [276–149](https://voteview.com/rollcall/RH0890002). New rules, [224–202](https://voteview.com/rollcall/RH0890003) on the previous question: the 21-day rule restored; a bill sent to conference by majority vote.'
    n: 'H.R. Res. 1, H.R. Res. 8, 89th Cong. [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf). [[w.robinson-house-rules-committee]]; [[w.macneil-forge-of-democracy]]; [[w.bolling-house-out-of-order]]; [[w.zelizer-on-capitol-hill]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.dittmer-local-people]], 339–40. CQ Almanac 1965; [[w.congress-and-the-nation-1969]] (K–J Cong. II.L). See [[cal.1963-01-09.congress]]; [[cal.1963-01-09.rules]]. Names: McCormack, Ford, Ryan.'
    tags: [congress:89, name:mccormack-john-w, name:ford-gerald-r, name:ryan-william-f, committees:89]
  - id: cal.1965-01-04.program
    when: Jan. 4
    date: '1965-01-04'
    thread: program
    c: 'State of the Union: "the Great Society." Education, $1.5 billion the first year; hospital care under Social Security; the war on poverty doubled; "every remaining obstacle" to the vote removed; immigration by a man''s work, not his birthplace; a Department of Housing and Urban Development; excise taxes cut. Vietnam: "We will not break it now."'
    n: Annual Message to the Congress on the State of the Union, [1965 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=77) (Jan. 4, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf). [[w.zelizer-fierce-urgency-of-now]]; [[w.sundquist-politics-and-policy]]; [[w.dallek-flawed-giant]]; [[w.johnson-vantage-point]]. See [[cal.1964-01-08.program]]; [[cal.1964-05-22.program]].
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - medicare: cal.1965-01-07.medicare
      - health: cal.1965-01-07.medicare
      - school-aid: cal.1965-01-12.school-aid
      - immigration: cal.1965-01-13.immigration
  - id: cal.1965-01-04.legislatures-mo
    when: Jan. 4
    date: '1965-01-04'
    thread: legislatures
    c: Missouri. A three-judge federal court holds the congressional districts of 1961 unconstitutional, on a suit of voters of the 2nd and 3rd Districts.
    n: '*Preisler v. Secretary of State of Missouri*, [238 F. Supp. 187](https://static.case.law/f-supp/238/case-pdfs/0187-01.pdf) (W.D. Mo. 1965). See [[cal.1964-02-17.court]].'
    tags: [state:mo]
  - id: cal.1965-01-04.mayors-providence
    when: Jan. 4
    date: '1965-01-04'
    thread: mayors
    also: [elections-1964]
    c: Providence. Doorley, 34, of the City Council, sworn as mayor, the youngest in the city's history. McGarry, the Democratic city chairman, had backed him in 1964 against Reynolds, mayor since 1951.
    n: '[Wikipedia, "Joseph A. Doorley Jr."](https://en.wikipedia.org/wiki/Joseph_A._Doorley_Jr.); [Wikipedia, "Walter H. Reynolds"](https://en.wikipedia.org/wiki/Walter_H._Reynolds). Check the primary and the November vote in the *Providence Journal*. [[w.moakley-rhode-island-politics-and]]. Names: Doorley, Reynolds, McGarry.'
    tags: [state:ri, city:providence, name:doorley-joseph-a-jr, name:reynolds-walter-h, name:mcgarry-lawrence-p]
  - id: cal.1965-01-05.state-constitutions-ct
    when: Jan. 5
    date: '1965-01-05'
    thread: state-constitutions
    also: [legislatures]
    c: 'Connecticut. The General Assembly, in the special session called in November, calls a constitutional convention to meet at Hartford July 1, Public Act No. 1: 84 delegates, fourteen from each congressional district, no more than seven of a party; a two-thirds vote for any final action; its work done by Oct. 30.'
    n: '[Conn. *Register and Manual*, 1966, p. 46](https://archive.org/details/register66conn/page/n49). The federal court had put off its final judgment for a convention. [[w.horton-connecticut-state-constitution]]. See [[cal.1964-06-22.legislatures-ct]].'
    tags: [state:ct]
  - id: cal.1965-01-06.legislatures-ny
    when: Jan. 6
    date: '1965-01-06'
    thread: state-legislatures
    also: [robert-kennedy]
    c: Albany, N.Y. The session opens. The Democratic majorities split, Wagner's men against those of Robert Kennedy and the Brooklyn leaders; neither house organized.
    n: '[*New York Times*, Jan. 7, 1965](https://www.nytimes.com/1965/01/07/archives/session-is-opened-two-attempts-to-elect-officers-fail-both-houses.html). [[w.connery-rockefeller-of-new-york]]. See [[cal.1964-11-03.legislatures-ny]]. Names: Wagner, Robert Kennedy.'
    tags: [state:ny, name:wagner-robert-f-jr, name:kennedy-robert-f, city:nyc]
  - id: cal.1965-01-06.electoral-college
    when: Jan. 6
    date: '1965-01-06'
    thread: electoral-college
    also: [elections-1964, congress]
    c: Electoral votes counted in joint session, Hayden, President pro tempore, presiding, the Vice Presidency vacant. No objection made. Johnson 486, Goldwater 52; for Vice President, Humphrey 486, Miller 52. The electors had voted Dec. 14.
    n: '[111 Cong. Rec. 136–37](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-1.pdf) (1965). [[w.peirce-peoples-president]]. See [[cal.1964-11-03.elections-1964]]; [[cal.1961-01-06.elections-1960]]. Names: Hayden, Johnson, Goldwater, Humphrey, Miller.'
    tags: [name:hayden-carl, name:johnson-lyndon-b, name:goldwater-barry-m, name:humphrey-hubert-h, name:miller-william-e]
  - id: cal.1965-01-07.medicare
    when: Jan. 7
    date: '1965-01-07'
    thread: medicare
    also: [health]
    c: 'Health message. Hospital insurance for those over 65 under Social Security: hospital and post-hospital care, home nursing, outpatient diagnosis; for those outside Social Security, from the administrative budget. Regional centers against heart disease, cancer, and stroke. The King–Anderson bill: H.R. 1, Jan. 4; S. 1, Jan. 6.'
    n: 'Special Message to the Congress: "Advancing the Nation''s Health", [1965 Pub. Papers 12](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=88) (Jan. 7, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-2.pdf). See [[cal.1961-02-09.medicare]]; [[cal.1964-12-09.health]]. Names: King, Anderson.'
    tags: [name:johnson-lyndon-b, name:king-cecil-r, name:anderson-clinton-p]
  - id: cal.1965-01-10.opinion
    when: Jan. 10
    date: '1965-01-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Dec. 11–16, 1964: Republicans'' first choice to lead the party: Nixon 27, Lodge 18, Goldwater 15, Romney 14, Scranton 8, Rockefeller 6, Taft 4, Hatfield 3, Percy 2. Independents: Lodge 21, Romney 19, Nixon 18, Goldwater 14. Nov. 20–25, 1964: Romney over Goldwater for the leadership, 51 to 34.'
    n: '[[w.gallup-poll]], III, 1916–17. Names: Lodge, Nixon, Goldwater, Hatfield, Percy, Romney, Scranton, Rockefeller, Taft.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:rockefeller-nelson, name:taft-robert-jr, name:hatfield-mark-o, name:percy-charles-h]
  - id: cal.1965-01-11.legislatures-tx
    when: Jan. 11
    date: '1965-01-11'
    thread: legislatures
    c: A three-judge court holds the Texas Constitution's apportionment of both houses, and the statutes under it, void under the equal protection clause, on the suit of William Kilgarlin and others, filed July 15, 1963. The Legislature given until Aug. 2.
    n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/case-pdfs/0404-01.pdf) (S.D. Tex. 1966), recites the summary judgment of Jan. 11, 1965 (Tex. Const. art. III, §§ 25, 26a). [[w.davidson-race-and-class-in]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Kilgarlin.'
    tags: [state:tx, name:kilgarlin-william-w]
  - id: cal.1965-01-11.legislatures-ia
    when: Jan. 11
    date: '1965-01-11'
    thread: state-legislatures
    c: 'Iowa''s 61st General Assembly meets, Democratic for the first time in thirty years: Senate 34–25, House 101–23.'
    n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 107–110. [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. See [[cal.1964-02-24.legislatures-ia]].'
    tags: [state:ia]
  - id: cal.1965-01-12.school-aid
    when: Jan. 12
    date: '1965-01-12'
    thread: school-aid
    c: Education message. $1 billion to schools serving children of low-income families, paid through the States by the census count of such families in each district; books for children in public and private schools; supplementary centers; regional laboratories; college scholarships and loans. H.R. 2362 (Perkins) and S. 370 (Morse) introduced the same day.
    n: 'Special Message to the Congress: "Toward Full Educational Opportunity", [1965 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=101) (Jan. 12, 1965). [111 Cong. Rec., House, Jan. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-7-2.pdf); [111 Cong. Rec., Senate, Jan. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-7-1.pdf). [[w.eidenberg-act-of-congress]]; [[w.bailey-esea]]; [[w.graham-uncertain-triumph]]. See [[cal.1961-02-20.school-aid]]. Names: Perkins, Morse.'
    tags: [name:johnson-lyndon-b, name:perkins-carl-d, name:morse-wayne]
  - id: cal.1965-01-12.elections-1964
    when: Jan. 12
    date: '1965-01-12'
    thread: elections-1964
    also: [goldwater]
    c: Burch to leave the Republican national chairmanship Apr. 1, after meeting Goldwater in Phoenix; Bliss, the Ohio chairman, to succeed him. Check the date.
    n: '[[w.kabaservice-rule-and-ruin]]; [[w.rae-decline-and-fall-of]]. See [[cal.1964-11-04.elections-1964]]. Names: Burch, Bliss, Goldwater.'
    tags: [name:burch-dean, name:bliss-ray-c, name:goldwater-barry-m]
  - id: cal.1965-01-12.japan-and-korea
    when: Jan. 12–13
    date: '1965-01-12'
    thread: japan
    c: 'Satō in Washington. Johnson: if Japan needs the American nuclear deterrent, the United States will provide it. Satō: the Ryukyuans'' and the Japanese wish for the islands'' return; a wider Japanese part in them. China: Japan keeps relations with Taipei and trade with the mainland, politics apart from economics. Before it, Dec. 29, to Reischauer: if the other fellow has nuclear weapons, common sense to have them oneself.'
    n: 'Remarks of Welcome at the White House to Prime Minister Sato of Japan, [1965 Pub. Papers 23](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=99); The President''s Toast at a Dinner in Honor of Prime Minister Sato, [1965 Pub. Papers 36](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=112) (Jan. 12, 1965); Joint Statement Following Meetings With the Prime Minister of Japan, [1965 Pub. Papers 40](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=116) (Jan. 13, 1965). FRUS 1964–68, XXIX, pt. 2, docs. [37](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d37), [40](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d43), [44](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d44). Made public: FRUS 1964–68, XXIX, pt. 2 (2006). [[w.schaller-altered-states]]; [[w.lafeber-clash]]; [[w.maga-hands-across-the-sea]]; [[w.sato-eisaku-nikki]]. See [[cal.1964-11-09.japan-and-korea]]; [[cal.1964-10-16.testing]]. Names: Satō, Johnson, Reischauer.'
    tags: [name:sato-eisaku, name:johnson-lyndon-b, name:reischauer-edwin-o]
  - id: cal.1965-01-13.immigration
    when: Jan. 13
    date: '1965-01-13'
    thread: immigration
    c: Immigration message. The national-origins quotas ended over five years; preference by skill and by kinship to citizens and resident aliens; no country more than 10 percent of the numbers; the Asia-Pacific Triangle abolished.
    n: Special Message to the Congress on Immigration, [1965 Pub. Papers 37](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=113) (Jan. 13, 1965). [[w.tichenor-dividing-lines]]; [[w.zolberg-nation-by-design]]; [[w.reimers-still-the-golden-door]]; [[w.yang-one-mighty-and-irresistible]]. See [[cal.1963-07-23.program]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01-15.opinion
    when: Jan. 15
    date: '1965-01-15'
    thread: opinion
    c: 'Gallup, special mail survey of 1,395 Republican county chairmen: Burch to stay as national chairman, 46 percent; to go, 43. South 66 stay; West 53; Midwest 43; East 26 stay, 63 go.'
    n: '[[w.gallup-poll]], III, 1917–18. Names: Burch.'
    tags: [name:burch-dean]
  - id: cal.1965-01-15.vietnam
    when: Jan. 15
    date: '1965-01-15'
    thread: vietnam
    c: 'McGovern in the Senate: the war not being won; to widen it "an act of folly." Pressure on the North by South Vietnamese infiltration, then negotiation.'
    n: '[111 Cong. Rec. 784–86](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-10-1.pdf) (1965). [[w.gibbons-u-s-government-and]], II, 395. See [[cal.1964-12-01.vietnam]]. Names: McGovern. Check: Gibbons prints vol. 110.'
    tags: [name:mcgovern-george]
  - id: cal.1965-01-16.trade
    when: Jan. 16
    date: '1965-01-16'
    thread: trade
    c: 'Johnson and Pearson sign the automotive products agreement at the LBJ Ranch, [17 U.S.T. 1372](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-17-1/lltreaties-17-1.pdf#page=1384): new cars and original parts free of duty between the two countries, for the manufacturers. In force provisionally that day. U.N.T.S. cite: check.'
    n: 'Remarks With Prime Minister Pearson Upon Signing U.S.-Canadian Trade Agreement on Automotive Products, [1965 Pub. Papers 52](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=128) (Jan. 16, 1965). T.I.A.S. No. 6093. See [[cal.1963-10-09.trade]]. Names: Johnson, Pearson.'
    tags: [name:johnson-lyndon-b, name:pearson-lester-b]
  - id: cal.1965-01-17.opinion
    when: Jan. 17
    date: '1965-01-17'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, the same county chairmen, their own first choice to lead the party: Nixon 29, Goldwater 28, Scranton 13, Romney 11, Hatfield 5, Taft 3, Percy 3, Rockefeller 3, Lodge 2. The strongest candidate if the election were held now: Nixon 47, Romney 18, Scranton 11, Goldwater 8.'
    n: '[[w.gallup-poll]], III, 1918. Names: Lodge, Nixon, Goldwater, Hatfield, Percy, Scranton, Romney, Rockefeller, Taft.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:scranton-william-w, name:romney-george-w, name:hatfield-mark-o, name:taft-robert-jr, name:percy-charles-h, name:rockefeller-nelson, name:lodge-henry-cabot]
  - id: cal.1965-01-18.georgia-ga
    when: Jan. 18
    date: '1965-01-18'
    thread: georgia
    also: [court, state-constitutions, legislatures]
    c: '*Fortson v. Toombs*, [379 U.S. 621](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379621/usrep379621.pdf), per curiam: the district court''s bar on putting Georgia''s new constitution to the voters until the legislature is reapportioned vacated and remanded, the 1964 elections having changed the legislature.'
    n: Opinion. See [[cal.1964-06-30.states-and-cities]].
    tags: [state:ga]
  - id: cal.1965-01-20.transition-and-staff
    when: Jan. 20
    date: '1965-01-20'
    thread: transition-and-staff
    c: 'Inauguration. Johnson sworn by Warren, Humphrey by McCormack. The address: a covenant "conceived in justice, written in liberty, bound in union"; the Great Society "the excitement of becoming." The cabinet: Rusk, Dillon, McNamara, Katzenbach acting at Justice, Gronouski, Udall, Freeman, Connor, Wirtz, Celebrezze.'
    n: 'The President''s Inaugural Address, [1965 Pub. Papers 71](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=147) (Jan. 20, 1965). [111 Cong. Rec., Senate, Jan. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-13-2.pdf). [President''s Daily Diary, Jan. 20, 1965](https://catalog.archives.gov/id/192449), image 4 (LBJ Library; National Archives Catalog). [[w.dallek-flawed-giant]]; [[w.johnson-white-house-diary]]. See [[cal.1961-01-20.transition-and-staff]]. Names: Johnson, Humphrey, Warren, McCormack, Rusk, Dillon, McNamara, Katzenbach, Gronouski, Udall, Freeman, Connor, Wirtz, Celebrezze.'
    tags: [executive:1965-01-20, name:johnson-lyndon-b, name:humphrey-hubert-h, name:warren-earl, name:mccormack-john-w, name:rusk-dean, name:dillon-c-douglas, name:mcnamara-robert-s, name:katzenbach-nicholas, name:gronouski-john-a, name:udall-stewart-l, name:freeman-orville-l, name:connor-john-t, name:wirtz-w-willard, name:celebrezze-anthony-j]
  - id: cal.1965-01-21.testing
    when: Jan. 21
    date: '1965-01-21'
    thread: testing
    c: 'Gilpatric''s Committee on Nuclear Proliferation reports to Johnson and his advisers in the Cabinet Room. The spread of nuclear weapons a growing threat; the world "fast approaching a point of no return"; India and Japan may follow China, and others them. Its counsel: agreements against the spread, pressure on nations near the threshold, arms control with the Soviet Union. Jan. 23, Bundy: the report to be shown no one outside the Committee of Principals without the President''s approval.'
    n: 'Statement by the President to the Members of the Committee on Nuclear Proliferation, [1965 Pub. Papers 74](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=150) (Jan. 21, 1965). [FRUS 1964–68, XI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v11/d64). [[w.brands-rethinking-nonproliferation]]; [[w.gavin-blasts-from-the-past]]. See [[cal.1964-10-16.testing]]. Names: Gilpatric, Johnson, Bundy.'
    tags: [name:gilpatric-roswell-l, name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1965-01-21.states-and-cities-ok
    when: Jan. 21
    date: '1965-01-21'
    thread: states-and-cities
    c: 'Oklahoma City. State Representative G. T. Blankenship reads to the House a summary of the sworn statement of N. S. Corn, a former justice convicted in 1964 of tax evasion: he, Justice Earl Welch and Justice N. B. Johnson of the State Supreme Court took bribes to decide cases. Mar. 18, the House begins impeachment; Welch resigns. Johnson convicted by the Senate and removed. Check the date.'
    n: '[Wikipedia, "1965 Oklahoma Supreme Court scandal"](https://en.wikipedia.org/wiki/1965_Oklahoma_Supreme_Court_scandal); Check: the *House Journal* and the record of the Senate''s trial. [[w.morgan-oklahoma-politics-and-policies]]. Names: Blankenship, Corn, Welch, Johnson.'
    tags: [state:ok, name:blankenship-g-t, name:corn-n-s, name:welch-earl, name:johnson-n-b]
  - id: cal.1965-01-21.middle-east
    when: Jan. 21
    date: '1965-01-21'
    thread: middle-east
    c: Tehran. Mansur shot at the Majlis, arriving to present the new oil agreements; the assassin carrying a Koran and Khomeini's picture, by the first reports.
    n: '[FRUS 1964–68, XXII, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v22/d66). [[w.abrahamian-iran-between-two-revolutions]]; [[w.afkhami-life-and-times-of]]; [[w.milani-shah]]. See [[cal.1964-10-13.middle-east]]. Names: Mansur, Khomeini.'
    tags: [name:mansur-hasan-ali, name:khomeini-ruhollah]
  - id: cal.1965-01-21.vietnam
    when: Jan. 21
    date: '1965-01-21'
    thread: vietnam
    c: Johnson with the congressional leaders of both parties, 10:07 a.m.–12:45 p.m., Russell and Fulbright not asked. A stable government in Saigon first. More American forces not needed "short of a decision to go to full-scale war."
    n: '[FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30) (Gibbons: Jan. 22). [[w.gibbons-u-s-government-and]], III, 39–41. See [[cal.1964-12-01.vietnam]]. Names: Johnson, Russell, Fulbright.'
    tags: [name:johnson-lyndon-b, name:russell-richard-b, name:fulbright-j-william]
  - id: cal.1965-01-22.voting-rights
    when: Jan. 22
    date: '1965-01-22'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. Black schoolteachers, some hundred, march on the Dallas County courthouse to register; Sheriff Clark's men push them from the steps three times. Check the count.
    n: 'Check: the record. [[w.garrow-protest-at-selma]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]. Names: Clark.'
    tags: [name:clark-james-g-jr]
  - id: cal.1965-01-22.legislatures-ct
    when: Jan. 22
    date: '1965-01-22'
    thread: legislatures
    also: [state-constitutions]
    c: Connecticut. Public Act No. 2 of the special session reapportions both houses.
    n: '[Conn. *Register and Manual*, 1966, p. 46](https://archive.org/details/register66conn/page/n49). See [[cal.1965-01-05.state-constitutions-ct]].'
    tags: [state:ct]
  - id: cal.1965-01-24.europe-and-the-alliance
    when: Jan. 24
    date: '1965-01-24'
    thread: europe-and-the-alliance
    c: Churchill dies in London, at ninety. Johnson, in Bethesda Naval Hospital with a cold, orders flags at half-staff until the burial. Check the dates of Johnson's stay in hospital.
    n: 'Statement by the President on the Death of Winston Churchill, [1965 Pub. Papers 82](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=158) (Jan. 24, 1965); [Executive Order 11193—Winston Spencer Churchill](https://www.presidency.ucsb.edu/documents/executive-order-11193-winston-spencer-churchill) (Jan. 24, 1965), [30 Fed. Reg. 821](https://www.govinfo.gov/app/details/FR-1965-01-27). [[w.gilbert-never-despair]]. Names: Churchill, Johnson.'
    tags: [name:churchill-winston-s, name:johnson-lyndon-b]
  - id: cal.1965-01-25.economy
    when: Jan. 25
    date: '1965-01-25'
    thread: economy
    c: Budget for fiscal 1966. Expenditures $99.7 billion, $2.2 billion over 1965, under 15 percent of GNP; receipts $94.4 billion; deficit $5.3 billion, $1 billion under 1965's. Defense $51.6 billion, down $600 million; health, labor, education, housing and the poverty program up $3.6 billion. Excise taxes to be cut $1.75 billion a year from July 1; Social Security benefits up 7 percent, with hospital insurance.
    n: Annual Budget Message to the Congress, Fiscal Year 1966, [1965 Pub. Papers 82](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=158) (Jan. 25, 1965). [[w.morgan-deficit-government]]. See [[cal.1964-01-21.economy]].
    tags: [name:johnson-lyndon-b, budget:1966]
  - id: cal.1965-01-25.voting-rights-selma
    when: Jan. 25
    date: '1965-01-25'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. King leads a line to the courthouse. Judge Thomas has ordered that a hundred may wait there unhindered; Clark arrests those beyond, and clubs a woman in the line who struck him. Check the date and counts.
    n: 'Check: the record. See [[cal.1965-01-02.voting-rights]]. Names: King, Thomas, Clark.'
    tags: [name:king-martin-luther-jr, name:thomas-daniel-h, name:clark-james-g-jr]
  - id: cal.1965-01-26.foreign-aid
    when: Jan. 26
    date: '1965-01-26'
    thread: foreign-aid
    also: [middle-east]
    c: House writes a ban on Food for Peace sales to the United Arab Republic into the supplemental farm appropriation, on Michel's motion to recommit, [204–177](https://voteview.com/rollcall/RH0890005).
    n: '[111 Cong. Rec., House, Jan. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt1-17-1.pdf). [FRUS 1964–68, XVIII, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v18/d127) (editorial note). See [[cal.1964-10-08.foreign-aid]], [[cal.1964-12-23.middle-east]]. Names: Michel.'
    tags: [name:michel-robert-h]
  - id: cal.1965-01-26.peace-corps
    when: Jan. 26
    date: '1965-01-26'
    thread: peace-corps
    c: Humphrey to chair the Peace Corps' National Advisory Council in Johnson's place, and to call a conference of returned volunteers about Mar. 1, the fourth anniversary (held Mar. 5–7; Check). Over 3,000 back; nearly 10,000 serving in 46 countries; the Peace Corps to grow to 20,000.
    n: 'Letter to the Vice President Asking Him To Serve as Chairman, National Advisory Council of the Peace Corps, [1965 Pub. Papers 99](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=175) (Jan. 26, 1965). See [[cal.1964-11-02.peace-corps]]. Names: Humphrey, Johnson.'
    tags: [name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1965-01-26.japan-and-korea
    when: Jan. 26
    date: '1965-01-26'
    thread: japan-and-korea-korean-troops
    also: [vietnam]
    c: Korea's National Assembly approves the dispatch of noncombat units to South Vietnam, Yun Po-sun and his party walking out.
    n: '[FRUS 1964–68, XXIX, pt. 1, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d32) (editorial note). See [[cal.1964-12-19.japan-and-korea]]. Names: Yun.'
    tags: [name:yun-po-sun]
  - id: cal.1965-01-26.middle-east
    when: Jan. 26
    date: '1965-01-26'
    thread: middle-east
    c: Mansur dies. Hoveyda, his Finance Minister, Prime Minister. The Shah against the "black reactionaries"; the reforms to go on.
    n: '[FRUS 1964–68, XXII, doc. 67](https://history.state.gov/historicaldocuments/frus1964-68v22/d67) (Jan. 28). See [[cal.1965-01-21.middle-east]]. Names: Mansur, Hoveyda, Pahlavi.'
    tags: [name:mansur-hasan-ali, name:hoveyda-amir-abbas, name:pahlavi-mohammed-reza]
  - id: cal.1965-01-27.vietnam
    when: Jan. 27
    date: '1965-01-27'
    thread: vietnam-saigon
    c: 'Saigon. The Armed Forces Council withdraws its confidence from Hương''s government and charges Khánh with the crisis: an alliance of Khánh and the Buddhist Institute, Taylor reports. Oánh acting Prime Minister. In Washington that morning, McGeorge Bundy and McNamara to Johnson: present policy "can lead only to disastrous defeat"; of two courses, military power "to force a change of Communist policy" or negotiation, they favor the first. Rusk dissents. Bundy to go to Saigon; American dependents to be withdrawn.'
    n: 'FRUS 1964–68, II, docs. [41](https://history.state.gov/historicaldocuments/frus1964-68v02/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v02/d43), [44](https://history.state.gov/historicaldocuments/frus1964-68v02/d44), [47](https://history.state.gov/historicaldocuments/frus1964-68v02/d47). [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.bird-color-of-truth]]; [[w.mcnamara-in-retrospect]]; [[w.gibbons-u-s-government-and]], III, 45–46. See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-20.vietnam]]. Names: Trần Văn Hương, Nguyễn Khánh, Nguyễn Xuân Oánh, Taylor, McGeorge Bundy, McNamara, Rusk, Johnson.'
    tags: [name:tran-van-huong, name:nguyen-khanh, name:nguyen-xuan-oanh, name:taylor-maxwell, name:bundy-mcgeorge, name:mcnamara-robert-s, name:rusk-dean, name:johnson-lyndon-b, place:saigon]
  - id: cal.1965-01-28.economy
    when: Jan. 28
    date: '1965-01-28'
    thread: economy
    c: Economic Report. GNP $622 billion in 1964; for 1965, $660 billion, the midpoint of a $10 billion range. Unemployment 5.0 percent at the year's end, to average under 1964's 5.2. The guideposts restated. The gold reserve against Federal Reserve deposits to be repealed; the growth of notes and deposits could absorb the margin over the 25 percent cover "within two years or less."
    n: 'Annual Message to the Congress: The Economic Report of the President, [1965 Pub. Papers 103](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=179) (Jan. 28, 1965). [*Economic Report*, Jan. 1965](https://www.govinfo.gov/app/details/SERIALSET-12702_00_00-002-0028-0000). [[w.okun-political-economy-of-prosperity]]; [[w.stein-fiscal-revolution-in-america]]. See [[cal.1964-01-20.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01-28.succession
    when: Jan. 28
    date: '1965-01-28'
    thread: succession
    also: [amendments, electoral-college]
    c: 'Special message on presidential disability. Johnson asks Congress to pass S.J. Res. 1 (Bayh) and H.J. Res. 1 (Celler): the Vice President to act when the President is unable; a vacancy in the Vice Presidency filled by the President''s nominee. A second amendment proposed: each State''s electoral votes cast for the candidates who carry it, "and for no one else"; the Vice President-elect to become President if the President-elect dies before the term begins.'
    n: 'Special Message to the Congress on Presidential Disability and Related Matters, [1965 Pub. Papers 100](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=176) (Jan. 28, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt1-1-2.pdf). [[w.bayh-one-heartbeat-away]]; [[w.feerick-twenty-fifth-amendment]]. See [[cal.1964-09-28.succession]]. Names: Johnson, Bayh, Celler.'
    tags: [name:johnson-lyndon-b, name:bayh-birch, name:celler-emanuel]
  - id: cal.1965-01-28.conservation
    when: Jan. 28
    date: '1965-01-28'
    thread: conservation
    c: 'Senate passes Muskie''s water quality bill, S. 4, [68–8](https://voteview.com/rollcall/RS0890005): a Federal Water Pollution Control Administration in HEW; standards of quality for interstate waters, set by the Secretary where the States have not set them.'
    n: '[111 Cong. Rec., Senate, Jan. 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-1-2.pdf). [[w.milazzo-unlikely-environmentalists]]. See [[cal.1963-12-17.program]]. Names: Muskie.'
    tags: [name:muskie-edmund-s]
  - id: cal.1965-01-28.legislatures-ar
    when: Jan. 28
    date: '1965-01-28'
    thread: legislatures
    also: [court]
    c: 'Arkansas. *Yancey v. Faubus*: the three-judge court holds the apportionment of both houses invalid under *Reynolds v. Sims* and directs the Board of Apportionment, Faubus, the secretary of state and the attorney general, to make a valid one by June 15; the General Assembly, in session, may act itself.'
    n: '*Yancey v. Faubus*, [238 F. Supp. 290](https://static.case.law/f-supp/238/case-pdfs/0290-01.pdf) (E.D. Ark. 1965). [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1964-06-15.court]]. Names: Faubus.'
    tags: [state:ar, name:faubus-orval-e]
  - id: cal.1965-01-29.succession
    when: Jan. 29
    date: '1965-01-29'
    thread: succession
    also: [amendments]
    c: Bayh's Subcommittee on Constitutional Amendments hears S.J. Res. 1 and four other resolutions on presidential inability and a vacancy in the Vice Presidency, one day. Katzenbach, Acting Attorney General; Brownell; Marion Folsom; Lewis Powell, the American Bar Association's president-elect.
    n: '*Presidential Inability and Vacancies in the Office of Vice President: Hearing Before the Subcomm. on Constitutional Amendments of the S. Comm. on the Judiciary*, 89th Cong. [(1965)](https://www.govinfo.gov/app/details/CHRG-89shrg42688). See [[cal.1965-01-28.succession]]. Names: Bayh, Katzenbach, Brownell, Marion Folsom, Lewis Powell.'
    tags: [name:bayh-birch, name:katzenbach-nicholas, name:brownell-herbert-jr, name:folsom-marion-b, name:powell-lewis-f-jr]
  - id: cal.1965-01-30.europe-and-the-alliance
    when: Jan. 30
    date: '1965-01-30'
    thread: europe-and-the-alliance
    c: 'Churchill''s funeral at St Paul''s: Warren, Eisenhower and Ambassador Bruce for the United States; Rusk, in London, too ill to attend; Humphrey not sent.'
    n: 'The delegation: The President''s News Conference, [1965 Pub. Papers 131](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=207) (Feb. 4, 1965), [6]. See [[cal.1965-01-24.europe-and-the-alliance]]. Names: Churchill, Warren, Eisenhower, Bruce, Rusk, Humphrey.'
    tags: [name:churchill-winston-s, name:warren-earl, name:eisenhower-dwight-d, name:bruce-david-k-e, name:rusk-dean, name:humphrey-hubert-h]
  - id: cal.1965-01-31.opinion
    when: Jan. 31
    date: '1965-01-31'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Jan. 7–12: the United States should have become involved with its military forces in Southeast Asia, 50 percent; should not, 28. Johnson to call a conference with the leaders of Southeast Asia and China to seek a peace agreement: favor 81, oppose 11.'
    n: '[[w.gallup-poll]], III, 1921–22. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01.jobs-and-wages-in
    when: Jan.
    date: 1965-01
    thread: jobs-and-wages
    c: Indiana. The right-to-work law of 1957 repealed, the first act of the session, the Democrats holding both houses; Branigin signs. Check the day.
    n: '*Muncie Star*, January 1965 (Check). [Indiana governors'' history, "Roger D. Branigin"](https://secure.in.gov/governorhistory/2338.htm). [[w.peirce-great-lakes-states-of]]. Names: Branigin.'
    tags: [state:in, name:branigin-roger-d]
