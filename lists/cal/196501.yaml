  - id: cal.1965-01-05.republican-party-congress
    when: Jan. 5
    date: '1965-01-05'
    thread: republican-party-congress
    also: [medicare]
    c: 'Bow (R-Ohio), to his Republican colleagues: "Unless something is done in the immediate future, the Democratic party will soon be pointing with pride to a new program of hospital care for the aged and the Republican party once again will be cast in the role of the blind, reactionary opposition." His own plan: voluntary private insurance for the aged, tax credits, help for those who cannot pay.'
    n: '[[w.kabaservice-rule-and-ruin]], 142–43. To check: Frank T. Bow to "Dear Republican Colleague," Jan. 5, 1965, Charles McC. Mathias Papers, Johns Hopkins University, I-1–36 (cited by [[w.kabaservice-rule-and-ruin]], 142 n.100); Frank T. Bow, "The Alternative—Free, Voluntary, Private," *Advance* 2:1 (June 1962), 15–17 (cited by [[w.kabaservice-rule-and-ruin]], 143 n.101). Names: Bow.'
    src:
      c: 0137262d
      rows:
        - 'w.kabaservice-rule-and-ruin 142–43: all'
        - 'via w.kabaservice-rule-and-ruin 142 n.100: A'
        - 'via w.kabaservice-rule-and-ruin 143 n.101: B'
    tags: [name:bow-frank-t]
  - id: cal.1965-01-06.legislatures-ny
    when: Jan. 6
    date: '1965-01-06'
    thread: state-legislatures
    also: [robert-kennedy]
    c: Albany, N.Y. The session opens. The Democratic majorities split, Wagner's men against those of Robert Kennedy and the Brooklyn leaders; neither house organized.
    n: '[*New York Times*, Jan. 7, 1965](https://www.nytimes.com/1965/01/07/archives/session-is-opened-two-attempts-to-elect-officers-fail-both-houses.html). To check: [[w.connery-rockefeller-of-new-york]]. See [[cal.1964-11-03.legislatures-ny]]. Names: Wagner, Robert Kennedy.'
    tags: [state:ny, name:wagner-robert-f-jr, name:kennedy-robert-f, city:nyc]
  - id: cal.1965-01-06.electoral-college
    when: Jan. 6
    date: '1965-01-06'
    thread: electoral-college
    also: [elections-1964, congress]
    c: Electoral votes counted in joint session, Hayden, President pro tempore, presiding, the Vice Presidency vacant. No objection made. Johnson 486, Goldwater 52; for Vice President, Humphrey 486, Miller 52. The electors had voted Dec. 14.
    n: '[111 Cong. Rec. 136–37](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-1.pdf) (1965). To check: [[w.peirce-peoples-president]]. See [[cal.1964-11-03.elections-1964]]; [[cal.1961-01-06.elections-1960]]. Names: Hayden, Johnson, Goldwater, Humphrey, Miller.'
    tags: [name:hayden-carl, name:johnson-lyndon-b, name:goldwater-barry-m, name:humphrey-hubert-h, name:miller-william-e]
  - id: cal.1965-01-06.vietnam
    when: Jan. 6
    date: '1965-01-06'
    thread: vietnam
    c: 'Taylor to Johnson, Saigon 2052 and 2055 through 2058, five sections, answering his CAP 64375 of Dec. 30: "We are faced here with a seriously deteriorating situation." Graduated air attacks on the North the one course with a chance of success; "to take no positive action now is to accept defeat in the fairly near future." Dependents to stay for now; guarding American installations with American troops would take 34 battalion equivalents, some 75,000 men. Section V, Westmoreland''s analysis, Taylor concurring: of three ways to bring in American ground forces, none recommended now.'
    n: '[FRUS 1964–68, II, doc. 9](https://history.state.gov/historicaldocuments/frus1964-68v02/d9); [doc. 10](https://history.state.gov/historicaldocuments/frus1964-68v02/d10); [doc. 11](https://history.state.gov/historicaldocuments/frus1964-68v02/d11); [doc. 13](https://history.state.gov/historicaldocuments/frus1964-68v02/d13); Johnson''s cable, [FRUS 1964–68, I, doc. 477](https://history.state.gov/historicaldocuments/frus1964-68v01/d477). [[w.westmoreland-soldier-reports]], 113–14 (the reply framed with Alexis Johnson and Westmoreland). See [[cal.1964-12-24.vietnam]]. Names: Taylor, Johnson, Westmoreland, U. Alexis Johnson.'
    src:
      c: 43a18795
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d9: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d10: C'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d11: C'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d13: D'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d477: A'
        - 'w.westmoreland-soldier-reports 113–14: A-D'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b, name:westmoreland-william, name:johnson-u-alexis]
  - id: cal.1965-01-06.vietnam-2
    when: Jan. 6
    date: '1965-01-06'
    thread: vietnam
    c: 'Cooper''s paper on bombing the North: reprisal in kind for major terror, "with or without a stable government in Saigon"; attacks on infiltration targets only with one; large-scale bombing not at all. "We should not underestimate the risk of bombing the North"; "the war must still be fought and victories achieved in South Vietnam."'
    n: '[FRUS 1964–68, II, doc. 16](https://history.state.gov/historicaldocuments/frus1964-68v02/d16). [[w.preston-war-council]], 164, 167 (Bundy''s mission). Names: Chester Cooper.'
    src:
      c: 96944deb
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d16: all'
        - 'w.preston-war-council 164: all'
    tags: [name:cooper-chester-l]
  - id: cal.1965-01-07.medicare
    when: Jan. 7
    date: '1965-01-07'
    thread: medicare
    also: [health]
    c: 'Health message. Hospital insurance for those over 65 under Social Security: hospital and post-hospital care, home nursing, outpatient diagnosis; for those outside Social Security, from the administrative budget. Regional centers against heart disease, cancer, and stroke. The King–Anderson bill: H.R. 1, Jan. 4; S. 1, Jan. 6.'
    n: 'Special Message to the Congress: "Advancing the Nation''s Health", [1965 Pub. Papers 12](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=88) (Jan. 7, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-2.pdf). [[w.zelizer-taxing-america]], 232–33 (the bill of Jan. 4). To check: Charles Mohr, "Johnson Health Program Gives Medicare Priority; Regional Centers Sought," *New York Times*, Jan. 8, 1965 (cited by [[w.zelizer-taxing-america]], 232 n.86); House Committee on Ways and Means, Medical Care For the Aged: Executive Hearings, 89th Cong., 1st sess. (1965), 2-15 (cited by [[w.zelizer-taxing-america]], 232 n.85). See [[cal.1961-02-09.medicare]]; [[cal.1964-12-09.health]]. Names: King, Anderson.'
    src:
      c: '43698211'
      rows:
