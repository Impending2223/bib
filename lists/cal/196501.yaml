  - id: cal.1965-01-04.vietnam
    when: Jan. 4
    date: '1965-01-04'
    thread: vietnam
    c: 'Bundy to Johnson, on McNamara''s worry that the State of the Union''s words on Vietnam are stronger than the policy: "it is absolutely essential to maintain a posture of firmness today. I believe that without firm U.S. language, the danger of further erosion in Saigon is bound to grow."'
    n: '[FRUS 1964–68, II, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v02/d5). [[w.preston-war-council]], 163. Names: Bundy, Johnson, McNamara.'
    src:
      c: be7c02ba
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d5: all'
        - 'w.preston-war-council 163: all'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1965-01-04.vietnam-2
    when: Jan. 4
    date: '1965-01-04'
    thread: vietnam-force-levels
    also: [vietnam]
    c: 'Bundy to Johnson, with a report on Vietnam: "our personnel policies in Vietnam are wrong"; the Army runs it "in a regulation way," too much staff and rotation, "not enough action." McNamara against larger American forces, but more responsive than before to a plan for volunteer fighting forces.'
    n: '[FRUS 1964–68, II, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v02/d2). Names: Bundy, Johnson, McNamara.'
    src:
      c: ec538f27
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d2: all'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1965-01-05.state-constitutions-ct
    when: Jan. 5
    date: '1965-01-05'
    thread: state-constitutions
    also: [legislatures]
    c: 'Connecticut. The General Assembly, in the special session called in November, calls a constitutional convention to meet at Hartford July 1, Public Act No. 1: 84 delegates, fourteen from each congressional district, no more than seven of a party; a two-thirds vote for any final action; its work done by Oct. 30.'
    n: '[Conn. *Register and Manual*, 1966, p. 46](https://archive.org/details/register66conn/page/n49). The federal court had put off its final judgment for a convention. To check: [[w.horton-connecticut-state-constitution]]. See [[cal.1964-06-22.legislatures-ct]].'
    tags: [state:ct]
  - id: cal.1965-01-05.king
    when: Jan. 5
    date: '1965-01-05'
    thread: king
    c: 'Atlanta. Coretta King opens a box received at SCLC a month before: a tape from the FBI''s microphones, the Willard''s and others, with an anonymous letter: "King, there is only one thing left for you to do. You know what this is." Made up at Sullivan''s direction two days after Hoover''s attack; mailed from Miami Nov. 21.'
    n: '[[w.garrow-bearing-the-cross]], 372–74. To check: SAC Atlanta to Director, Jan. 5 and 6, 1965, FBI file 100-106670-715, 716; Robert G. Murphy, "Martin Luther King, Jr.," report to J. Stanley Pottinger, Mar. 31, 1976, 44-45, Civil Rights Division FOIA (cited by [[w.garrow-bearing-the-cross]], 374 n.17). Check: the day. See [[cal.1964-11-18.civil-rights-the-executive]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Coretta Scott King, Sullivan, Hoover, Martin Luther King.'
    src:
      c: d625fd75
      rows:
        - 'w.garrow-bearing-the-cross 373–74: all'
        - 'via w.garrow-bearing-the-cross 374 n.17a: B'
        - 'via w.garrow-bearing-the-cross 374 n.17b: B-D'
        - 'via w.garrow-bearing-the-cross 374 n.17c: B'
    tags: [name:king-coretta-scott, name:sullivan-william-c, name:hoover-j-edgar, name:king-martin-luther-jr, state:ga, city:atlanta]
