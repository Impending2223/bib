    thread: medicare
    c: 'Mills to Johnson, the day after the State of the Union: prompt consideration of Medicare by Ways and Means, guaranteed.'
    n: '[[w.johnson-vantage-point]], 214, by Johnson''s account. See [[cal.1964-12-02.medicare]]. Names: Mills, Johnson.'
