    n: 'H.R. Res. 1, H.R. Res. 8, 89th Cong. [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf) (1965); [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf) (1965). [[w.dittmer-local-people]], 339–40 (the Mississippians seated over Ryan''s objection); [[w.branch-pillar-of-fire]], 555; [[w.zelizer-fierce-urgency-of-now]], 172–73 (the twenty-one-day rule, 224–201, sixteen Republicans for; the committee ratios two to one, Ways and Means 17–8). CQ Almanac 1965. To check: [[w.robinson-house-rules-committee]]; [[w.macneil-forge-of-democracy]]; [[w.bolling-house-out-of-order]]; [[w.zelizer-on-capitol-hill]]; [[w.congress-and-the-nation-1969]] (K–J Cong. II.L); [*New York Times*, Jan. 6, 1965](https://timesmachine.nytimes.com/timesmachine/1965/01/06/issue.html) (cited by [[w.dittmer-local-people]], 340 n.5); NYT, Jan. 5, 1965, p. 1 (cited by [[w.branch-pillar-of-fire]], 555); Kinoy, Rights on Trial (1983), 272–75 (cited by [[w.branch-pillar-of-fire]], 555); [[w.mills-this-little-light-of]], 152–54 (cited by [[w.branch-pillar-of-fire]], 555). See [[cal.1963-01-09.congress]]; [[cal.1963-01-09.rules]]. Names: McCormack, Ford, Ryan. Check: the pages.'
