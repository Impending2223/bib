  - id: cal.1965-01-04.program
    when: Jan. 4
    date: '1965-01-04'
    thread: program
    c: 'State of the Union: "the Great Society." Education, $1.5 billion the first year; hospital care under Social Security; the war on poverty doubled; "every remaining obstacle" to the vote removed; immigration by a man''s work, not his birthplace; a Department of Housing and Urban Development; excise taxes cut. Vietnam: "We will not break it now."'
    n: 'Annual Message to the Congress on the State of the Union, [1965 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=77) (Jan. 4, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf). [[w.johnson-vantage-point]], 214 (hospital care); [[w.dallek-flawed-giant]], 193–94. To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.sundquist-politics-and-policy]]. See [[cal.1964-01-08.program]]; [[cal.1964-05-22.program]].'
    src:
      c: 786001e6
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=77: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf: all'
        - 'w.johnson-vantage-point 214: A, C'
        - 'w.dallek-flawed-giant 193–94: A, H'
