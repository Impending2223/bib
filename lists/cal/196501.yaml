    n: 'Statement by the President to the Members of the Committee on Nuclear Proliferation, [1965 Pub. Papers 74](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=150) (Jan. 21, 1965). [FRUS 1964–68, XI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v11/d64). [[w.drea-mcnamara-clifford-and-the-2011]], 318 (the report presented Jan. 21, its threat and its counsel; Jan. 23, the Committee of Principals); [[w.schwartz-lyndon-johnson-and-europe]], 53 (the report; Rusk''s caution). Made public: the report, *New York Times*, July 1, 1965 ([[w.schwartz-lyndon-johnson-and-europe]], 56). To check: [[w.brands-rethinking-nonproliferation]]; [[w.gavin-blasts-from-the-past]]. See [[cal.1964-10-16.testing]]. Names: Gilpatric, Johnson, Bundy.'
