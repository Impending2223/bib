    n: '[[w.schlesinger-robert-kennedy-and-his]], 676. To check: [111 Cong. Rec., Senate, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf). See [[cal.1964-11-03.robert-kennedy]]. Names: Robert Kennedy, Edward Kennedy.'
