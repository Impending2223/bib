  - id: cal.1969-05-19.vietnam-hanoi-3
    when: May 19
    date: '1969-05-19'
    place: hanoi
    thread: vietnam-hanoi
    c: 'Hồ Chí Minh, receiving a delegation of the army cadres'' class come to wish him long life on his 79th birthday, speaks on the strength of the war: a one-kilogram weight, set at an advantage, lifts a hundred; the Americans lose by their position, though still stubborn. His charge: the rear to do better for the front, first of all; build forces of high quality, vigilant and ready, and spare men, arms and rice; the troops to help the people and strengthen the rear.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 192 and n. 1–2. See [[cal.1969-05.vietnam-hanoi]]. To check: Hồ Chí Minh, *Toàn tập*, XII (2000), 455, 465–66 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 192 n.). Names: Hồ Chí Minh. Check: the day; the history gives the occasion, his 79th birthday, and its own date for the birthday is May 19 (VI, 117).'
    tags: [polity:drv, name:ho-chi-minh]
