        - 'w.zhou-enlai-nianpu-1949-2020 III, 292: A, B'
        - 'w.mao-zedong-zhuan VI, ch. 78 n.9: C'
        - 'via w.mao-zedong-zhuan VI, ch.78 n.9: C'
