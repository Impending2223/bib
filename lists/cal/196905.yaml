  - id: cal.1969-05-03.china-leadership-2
    when: May 3
    date: '1969-05-03'
    place: peking
    thread: china-leadership
    also: [china]
    c: Deng Xiaoping, under house arrest in Zhongnanhai, having read of the congress in the Party press, writes Mao, Lin Biao and the Center "in support of the resolutions passed by the Congress."
    n: '[[w.macfarquhar-maos-last-revolution]], 291–292; [[w.deng-xiaoping-nianpu-1904]], III, 1948 (May 3, 1969; Deng writes to Wang Dongxing, asking him to pass the letter to Mao Zedong, Lin Biao and the Central Committee: the Ninth Congress is over and he awaits the Party''s decision; his greatest wish is to stay in the Party and do what work he is given or labour within his powers). Made public: 2002 ([[w.rong-deng-xiaoping-and-the]], 101). To check: [[w.rong-deng-xiaoping-and-the]], 101 (cited by [[w.macfarquhar-maos-last-revolution]], 292 n.40). Names: Deng Xiaoping, Mao Zedong, Lin Biao. Check: the Mao chronology has Mao read Deng''s letter of May 3 on May 5, its matter Deng''s waiting for the Party''s decision on his case.'
    src:
      c: 7d39ccd7
      rows:
        - 'w.macfarquhar-maos-last-revolution 291–292: all'
        - 'w.deng-xiaoping-nianpu-1904 III, 1948: ?'
    tags: [polity:prc, name:deng-xiaoping, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-05-04.china-leadership
    when: May 4
    date: '1969-05-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, in a letter passing on to the military representatives at the National People''s Congress and the Political Consultative Conference what the State Council''s directly attached sector''s representatives were told: the military representatives sent to the democratic parties'' organs should be "spoken to on policy"; the task of the organs'' rebels is to clean up the ranks of the organs'' cadres, not to struggle against the parties'' leaders, their Central and provincial and municipal committee members; should a present counterrevolutionary appear among them it is another matter, but the military representatives are first to be told and action taken only when the Center or the provincial or municipal committee agrees; the organs'' cadres in the cleaning of ranks are to be treated by case and not held to the Communist Party''s standard.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-04.china-leadership-2
    when: May 4
    date: '1969-05-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the disorder in prison management and on prisoners deprived of the political and living treatment due them, instructs the departments concerned: specially held prisoners are to have more nourishing food, to keep them from wasting to death; the messing is to be checked. On May 31 he adds: those in danger of life are to go to a hospital, and all prisoners are to be given books and papers; the Central Case Group''s Second and Third Offices are to follow it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-05.china-leadership
    when: May 5
    date: '1969-05-05'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Wang Dongxing forwards Deng Xiaoping''s letter of May 3: the Ninth Congress is over, he waits for the Party''s decision on his case. Mao to Lin Biao, Zhou Enlai and the Politburo members in Peking: "read".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 5, 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 444 (May 5, 1969; Mao''s note on Deng Xiaoping''s 邓小平 letter of May 3 to Wang Dongxing 汪东兴, to be passed to Mao, Lin Biao and the Center: for Lin, Zhou and the Politburo members in Peking to read, then back to Wang to keep; the book gives no place); [[w.deng-xiaoping-nianpu-1904]], III, 1948 (May 5, 1969; Mao reads the letter and passes it to Lin Biao, Zhou Enlai and the Politburo members in Peking to read). Made public: 2013. To check: Deng Xiaoping, letter of May 3, 1969 to Wang Dongxing for Mao Zedong, Lin Biao and the Center (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 444 n.1). Names: Mao Zedong, Deng Xiaoping, Lin Biao, Zhou Enlai, Wang Dongxing.'
    src:
