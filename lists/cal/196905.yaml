    when: May 19
    date: '1969-05-19'
    place: long-tau-river
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Lòng Tàu River. For Hồ Chí Minh's birthday, Group 10, the Rừng Sác sappers, sink two tankers, of 7,000 and 15,000 tons, in 30 minutes, by the history's count. The group, cut off and encircled, feeds itself and makes its own arms.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 117. Names: Hồ Chí Minh.'
