    date: '1969-05-24'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Politburo''s resolution no. 191-NQ/TW on planning the building and reconstruction of Hanoi after the victory over the Americans: since 1954 Hanoi a city of industry, economy and culture. The new capital''s area the hills of Tam Dương and Bình Xuyên districts; the old city, nearly a thousand years old, to be rebuilt.'
    n: '*Nghị quyết của Bộ Chính trị số 191-NQ/TW, ngày 24 tháng 5 năm 1969, Về nhiệm vụ của Quy hoạch xây dựng và cải tạo Thủ đô Hà Nội sau ngày chiến thắng giặc Mỹ xâm lược*, signed for the Politburo by Phạm Văn Đồng. [[w.van-kien-dang-toan]], XXX, 179–87. Made public: 2004.'
    tags: [polity:drv, vis:only:drv, name:pham-van-dong]
  - id: cal.1969-05-24.china-leadership
    when: May 24
    date: '1969-05-24'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on Liu Geping and Xie Zhenhua''s May 21 report on Jiexiu, proposes that Huang Yongsheng call Xie Fuzhi, Zheng Weishan and Chen Xianrui to the Military Commission''s Office Group today: if a regiment can be sent to Jiexiu and Fenxi to strike while the iron is hot, bare-handed, to preach the July 3 and July 24 notices and press for union and the handing in of arms, with Liu, Xie and Chen Yonggui guaranteeing neither side will be discriminated against, it should surely change the long deadlock of armed fights and stopped trains in central and southern Shanxi. This is the Shanxi leaders'' first joint call and should be actively supported.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 293 (May 24, 1969). Made public: 2020. Names: Zhou Enlai, Huang Yongsheng, Xie Fuzhi.'
    tags: [polity:prc, name:zhou-enlai, name:huang-yongsheng, name:xie-fuzhi, vis:only:prc]
  - id: cal.1969-05-24.china-leadership-2
    when: May 24
    date: '1969-05-24'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'The Chinese government issues a statement on the Soviet government''s statement of Mar. 29 on the Sino-Soviet boundary, setting out the facts and China''s consistent position: responsibility for the state the boundary question has reached lies wholly with the Soviet side; China is still ready to settle the whole boundary question by peaceful negotiation and opposes recourse to force; it proposes that the two sides agree through diplomatic channels the date and place of boundary talks.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 293 (May 24, 1969); [[w.zhonghua-renmin-gongheguo-waijiao]], 214 (May 24, 1969; the government''s statement on the Sino-Soviet boundary: the state the question has reached is not China''s responsibility; China is ready to settle it all by peaceful talks; the unequal treaties as base; a new equal treaty in their place; the proposals to keep the status quo). See [[cal.1969-05-19.china-leadership-3]]. Names: Zhou Enlai.'
    src:
