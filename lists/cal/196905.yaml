  - id: cal.1969-05-08.vietnam-hanoi-3
    when: May 8–9
    date: '1969-05-08'
    place: suoi-tam-bung
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Suối Tầm Bung and Route 20. Regiment 5 of the 5th Division attacks the Saigon 18th Division's task forces 43 and 52 and beats their sweep. The 5th Division then keeps on the 18th in Bà Rịa and Long Khánh and hurts Task Force 52 badly.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 116–17.'
    tags: [polity:drv]
  - id: cal.1969-05-08.vietnam-hanoi-2
    when: May 8
    date: '1969-05-08'
    place: paris
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'Paris, the conference''s sixteenth plenary session. The Front''s delegate puts forward an overall solution in ten points: Vietnam''s independence, sovereignty, unity and territory respected; all American and allied troops, military personnel and weapons withdrawn without conditions; the Vietnamese armed forces in the South a question for the Vietnamese parties; the South''s affairs its people''s, a provisional coalition government formed by negotiation, general elections; peace and neutrality abroad; reunification step by step and by peaceful means; neither zone in a military alliance or with foreign bases; prisoners negotiated, Washington responsible for the war''s damage; international supervision of the withdrawals.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 223–24.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-05-08.africa
    when: May 8
    date: '1969-05-08'
    thread: africa
    also: [china, soviet-union]
    c: 'The Soviet Embassy in Uganda, on Ugandan–Chinese relations: the Chinese ambassador recalled, the embassy''s staff cut from twelve to two, the second secretary and a translator.'
    n: '[[w.friedman-shadow-cold-war]], 154. Made public: 2015. To check: Report of embassy Uganda on Ugandan-Chinese relations, May 8, 1969, AVPRF f.100 o.56 papka 240 d.36, 43 (cited by [[w.friedman-shadow-cold-war]], 154 n.26). Check: the day of the recall; the text gives none, the note the report''s (154 n.26).'
    src:
      c: bad4fc4f
      rows:
        - 'w.friedman-shadow-cold-war 154: all'
        - 'via x.1969-05-08.embassy-uganda-ugandan-chinese-relations-may-8-1969: ?'
    tags: [polity:ussr, polity:uganda, polity:prc, vis:only:ussr, ok:fields-place]
  - id: cal.1969-05-09.china-leadership
    when: May 9
    date: '1969-05-09'
    thread: china-leadership
    c: The Center 中共中央 sends out to the provinces Mao's 毛泽东 speeches of Apr. 1 at the Ninth Congress and of Apr. 28 at the First Plenum of the Ninth Central Committee, to be read to the members of revolutionary committees of factories, communes, schools and offices and above, and to army cadres of platoon level and above, studied and carried out.
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 439 n.1 (May 9, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, document of May 9, 1969 sending out the two speeches (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 439 n.1). See [[cal.1969-04-28.china-leadership]]. Names: Mao Zedong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
    src:
      c: 4feb2bf9
      rows:
        - 'via w.jianguo-yilai-mao-zedong XIX, 439 n.1: all'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-10.vietnam-hanoi
    when: May 10
    date: '1969-05-10'
    thread: vietnam-hanoi
    c: 'Hồ Chí Minh dates the last part of his testament May 10, 1969: the war against the Americans will be won; then he will go through North and South, and thank the fraternal and friendly countries. He is 79. The volume prints his drafts whole (May 15, 1965, witnessed by Lê Duẩn: cremation, the ashes buried on a hill, some sent to the South; the pages of 1968: cremation, the ashes in three urns; May 10, 1969) and, apart, the testament as published in 1969, dated May 10, 1969, which has no request for cremation.'
    n: '*Di chúc của Chủ tịch Hồ Chí Minh*, the drafts printed whole, "các bản in nguyên văn bản thảo di chúc" (the 1965 text, witnessed by Lê Duẩn, 256–59; May 1968, 260–64; May 10, 1969, 265), [[w.van-kien-dang-toan]], XXX, 253–65; the testament as published in 1969, 313–20. Made public: 1969, the published text; the drafts, 2004. Check: whether the drafts were first published with the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989 (XXX, 228 n.). See [[cal.1968-05.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-05-10.vietnam-hanoi-2
    when: May 10
    date: '1969-05-10'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat''s directive no. 170-CT/TW: patriotic emulation pressed toward the fifth congress of heroes and emulation fighters; four years of emulation summed up and new drives begun; emulation conferences from the base to the Center, mostly done by the end of the third quarter.'
    n: '*Chỉ thị của Ban Bí thư số 170-CT/TW, ngày 10 tháng 5 năm 1969, Về việc đẩy mạnh phong trào thi đua yêu nước, tiến tới Đại hội Anh hùng, chiến sĩ thi đua lần thứ V*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 72–75. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-05-10.china-leadership
    when: May 10
    date: '1969-05-10'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the Politburo''s forum on Shandong, on Tan Qilong: the provincial secretaries were all brought to Peking by Mao in hope that they would reflect, and Tan was let go back to Shandong to criticize himself with Mao''s agreement; he is fairly honest and they are asked to unite. The meeting decides to remove Wang Xiaoyu from leadership and put Yang Dezhi in charge of Shandong. Of the votes for the Ninth Central Committee: after the election some groups'' delegates were "extremely indignant" that Jiang Qing and others of the Cultural Revolution Group did not get every vote and that some put an "X" on the names of Chen Boda, Jiang Qing, Zhang Chunqiao and Yao Wenyuan, and called it a new trend of class struggle; after asking Mao, Zhou did not circulate those groups'' bulletins. At the Politburo he says: a few votes short is nothing, why haggle over a vote or two; what are a few "X"s over a head?'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290 (May 10, 1969). Made public: 2020. Names: Zhou Enlai, Jiang Qing, Chen Boda, Zhang Chunqiao, Yao Wenyuan, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:jiang-qing, name:chen-boda, name:zhang-chunqiao, name:yao-wenyuan, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-10.china
    when: May 10
    date: '1969-05-10'
    thread: china
    also: [south-asia]
    c: A responsible official of the Foreign Ministry's First Asian department asks India's chargé d'affaires to call and makes a strong protest at the Indian government's slanders against China and its provocations on the China–Sikkim and Sino-Indian borders.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 213 (May 10, 1969).'
    src:
      c: 270b405a
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 213: all'
    tags: [polity:prc, polity:india]
  - id: cal.1969-05-10.vietnam-hanoi-3
    when: May 10–11
    date: '1969-05-10'
    place: a-bia
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'A Lưới–A Bia valley, west of Huế. The American and Saigon commands decide on Apache Snow: five battalions, the 1st, 2d and 3d of the 187th Brigade, 101st Airborne, and two of the Saigon 1st Division. The 3d Battalion, Lt. Col. Weldon Honeycutt, searches round A Bia from posts at Hills 337 and 1,087, and is ambushed on the saddle north of the mountain: dozens out of action, by the history''s count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 123–24 and n. 1. Check: the day of the decision, May 10, and of the ambush, May 10–11; the history gives "ngày 10-5-1969" for the first and "các ngày 10 và 11-5" for the second.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-05-11.china-leadership
    when: May 11
    date: '1969-05-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the Center''s meeting on Guizhou: they had asked to stay after the Ninth Congress to talk; Guizhou''s alliance by trade has run two years and has been less steady since last year, so after Zhejiang''s problem was settled they were called in. Yunnan and Guizhou, with Sichuan, are the nation''s great rear, the Third Front. Everything divides in two, and so it does with views of the rebels: some do not advance, some may be bad; capitalist-roaders are of the repentant and the unrepentant; nothing is absolute but developing; the few who have not united must unite wherever there are masses.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290–291 (May 11, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-11.vietnam-hanoi-2
    when: May 11
    date: '1969-05-11'
    place: an-loc
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Eastern Nam Bộ, the summer offensive's first day. The 7th Division and sappers hurt the American 11th Armored Cavalry west and southwest of Hớn Quản and raid the 3d Brigade, 1st Airmobile Cavalry, at Tếch Ních; the town and Route 13 are threatened and eight airborne battalions sent up. In Tây Ninh the 9th Division hits bases around the Holy See and Vườn Điều; the strategic reserve and the American 25th's 1st Brigade come to relieve.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 116. See [[cal.1969-05-11.vietnam-hanoi]].'
    tags: [polity:drv, polity:us]
  - id: cal.1969-05-11.vietnam-hanoi-3
    when: May 11
    date: '1969-05-11'
    place: kontum
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Kon Tum. Under the Đắk Tô 2 attack Saigon opens operation Dân Quyền northwest of the town with eight infantry battalions and three armored squadrons, to stretch the attackers. The enemy avoids contact and holds hilltops; the Front's command sends staff down to the units to carry out a new plan, pursuing day and night and surrounding each force found.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 120–21. See [[cal.1969-05-11.vietnam-hanoi]]. Check: the day; the history puts it after the night of May 10–11.'
    tags: [polity:drv]
  - id: cal.1969-05-11.vietnam-hanoi
    when: May 11
    date: '1969-05-11'
    place: dak-to
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'By the common plan, the summer offensive opens across the South: more than 800 targets, 57 bases and headquarters of regiment or above and 41 airfields among them. In the Central Highlands the B3 Front''s Đắk Tô 2 campaign, from the night of May 10–11: the joint base at Đắk Tô, the Kon Tum airfield, the 42d Regiment''s headquarters and Tân Cảnh attacked, Plây Cần besieged; the 66th and 28th Infantry and 40th Artillery Regiments on the main axis. The Front ends it June 26: 4,135 of the enemy put out of action, nine of twelve battalions hard hit, by its count. The offensive runs to June 20.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 115–22, 127. The history adds (VI, 121–22, 127): 88 vehicles and 103 aircraft destroyed, hundreds of prisoners; the tactic of continuous encirclement and attack, "bao vây tiến công liên tục", first used here; over the summer phase, May 11–June 20, 29 battalions and equivalents put out of action; over the spring and summer phases, in Central Trung Bộ, 150 strategic hamlets and 90 resettlement areas broken, 200,000 people freed; all by its count.'
    tags: [polity:drv, place:dak-to, place:kontum, province:kon-tum]
    time_range:
      - 1969-05-10T16:00Z
      - 1969-05-10T22:00Z
    time_band: predawn
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-05-12.vietnam-hanoi
    when: May 12
    date: '1969-05-12'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat''s directive no. 171-CT/TW: a round of political study within the Party for Hồ Chí Minh''s 79th birthday, on the recovery of production, the reform of economic and financial management and of the apparatus, and the revolutionary morality of cadres and members, with criticism and self-criticism; the main text the article by "T.L.," Hồ''s pen name, for the Party''s anniversary.'
    n: '*Chỉ thị của Ban Bí thư số 171-CT/TW, ngày 12 tháng 5 năm 1969, Về đợt sinh hoạt chính trị nội bộ nhân dịp mừng thọ Hồ Chủ tịch 79 tuổi*, signed for the Secretariat by Lê Văn Lương; "T.L.," the editors'' note (173 n.). [[w.van-kien-dang-toan]], XXX, 171–76. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh]
  - id: cal.1969-05-12.china-leadership
    when: May 12
    date: '1969-05-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the seizure of command at the Chengdu-Kunming railway''s construction headquarters, armed fights at the sites and the flight of many workers that have paralyzed the line, rules: "southwest railway building is under the unified command of the Railway Corps." In early December he orders that the whole Chengdu-Kunming line open by July 1, 1970, and work then resumes quickly.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291 (May 12, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-12.vietnam-hanoi-2
    when: May 12
    date: '1969-05-12'
    place: son-tra
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Region V, at night. Sappers and mortar teams strike the missile position at Sơn Trà, Đà Nẵng, the 1st Marine Regiment's headquarters at Hầm Xẻ, the 11th Brigade at Gò Hội, Quảng Ngãi, and the 5th Marine Regiment at An Hòa, Quảng Đà.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 117–18. See [[cal.1969-05-11.vietnam-hanoi]]. The words: "đêm 12-5-1969" (the night of May 12, 1969).'
    tags: [polity:drv, polity:us]
    time_range:
      - 1969-05-12T14:00Z
      - 1969-05-12T16:00Z
    time_band: night
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-05-12.vietnam-hanoi-3
    when: May 12
    date: '1969-05-12'
    place: a-bia
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: A Bia. In the morning B-52s and other bombers carpet the mountain. Three companies of the 3d Battalion, 187th, move north in several columns into Regiment 8's prepared positions; heavy rain and mud. Company C loses 37; Company B is drawn into a second ambush.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 124. The words: "Sáng 12-5-1969" (the morning of May 12, 1969).'
    tags: [polity:drv, polity:us]
    time_range:
      - 1969-05-11T22:00Z
      - 1969-05-12T04:00Z
    time_band: morning
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-05-13.china-leadership
    when: May 13
    date: '1969-05-13'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'With Mao''s agreement Zhou Enlai from May 13 talks four whole nights running with the Party, government and army heads of Inner Mongolia: since Nov. 1968 the core group''s chief leaders of the region''s revolutionary committee had confused two kinds of contradiction in cleaning the class ranks and digging out the "Inner Mongolian People''s Revolutionary Party", with much forced confession, harming cadres and masses and national unity; he asks them to unite, correct the errors and steady the situation.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291 (May 13, 1969); [[w.yang-jisheng-tiandi-fanfu]], II, 625 (May 13 and 16, with the approval of Mao and Lin Biao; Teng Haiqing, Wu Tao, Gao Jinming 高錦明, Quan Xingyuan 權星垣, Li Shude and Li Zhi 李質 called to Peking; the hunt for the "Inner Mongolian People''s Party" studied). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:kang-sheng, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-14.china-leadership
    when: May 14
    date: '1969-05-14'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai at the meeting of cadres of the central state organs conveys the spirit of the Ninth Congress and Mao's speeches during it, stressing the carrying out of Mao's call to prepare for war, sum up experience and implement policy; in speaking of Party history he says that the present cleaning of class ranks must guard against enlargement.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 292 (May 14, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-14.vietnam-paris
    when: May 14
    date: '1969-05-14'
    thread: vietnam-paris
    also: [vietnam-hanoi]
    c: 'Nixon''s eight-point address on Vietnam: American troops to leave on conditions, both sides, the United States and the DRV, to de-escalate and withdraw together from the South, the Saigon government to stay as it is. The history sets it against the Front''s ten points.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 225. See [[cal.1969-05-08.vietnam-hanoi-2]]. To check: Nixon, *Public Papers* (1969), the address of May 14. Names: Nixon. Check: the points; the history gives no detail and the American record should be read.'
    tags: [polity:us, name:nixon-richard-m, ok:fields-place]
  - id: cal.1969-05-15.china-leadership
    when: May 15
    date: '1969-05-15'
    place: ganzhou
    thread: china-leadership
    c: Ganzhou 贛州. Li Jiulian 李九蓮 is arrested as a current counter-revolutionary; in her seized diaries are criticisms of Lin Biao 林彪.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 886. Names: Lin Biao.'
    tags: [polity:prc, name:lin-biao]
  - id: cal.1969-05-16.soviet-union-leadership
    when: May 16
    date: '1969-05-16'
    time: 1969-05-16T08:00Z
    place: moscow
    thread: soviet-union-leadership
    c: Moscow. Brezhnev meets the Romanian party-government delegation led by Ceaușescu at Vnukovo, 11 a.m., and negotiates with them, 12 to 7:30; sees them off at 9 p.m., with the leaders leaving for the international meeting.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 337 (May 16). Names: Brezhnev, Ceaușescu. Check: The record''s last line is cut off.'
    tags: [name:brezhnev-leonid, name:ceausescu-nicolae, polity:ussr, polity:romania]
  - id: cal.1969-05-16.china-leadership
    when: May 16
    date: '1969-05-16'
    thread: china-leadership
    also: [south-asia, china]
    c: 'Zhou Enlai, on the Foreign Economic Liaison Commission''s military control group''s request of May 10 for raw materials for military projects for Pakistan, notes: agree to supply Pakistan, and by strict inspection assure the quality. The same day he receives Pakistan''s ambassador, Kaiser.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 292 (May 16, 1969); [[w.zhou-enlai-waijiao-huodong]], 535 (May 16, 1969; 9 p.m., Great Hall of the People; Pakistan''s ambassador Kaiser). Made public: 1993. Names: Zhou Enlai.'
    src:
      c: 1f8ff5c3
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 292: ?'
        - 'w.zhou-enlai-waijiao-huodong 535: B'
    tags: [polity:prc, polity:pakistan, name:zhou-enlai, vis:only:prc+pakistan]
  - id: cal.1969-05-16.china-leadership-2
    when: May 16
    date: '1969-05-16'
    time: 1969-05-16T12:00Z
    place: peking
    thread: china-leadership
    also: [europe-and-the-alliance, china]
    c: 'Zhou Enlai receives Romania''s departing ambassador, Duma: relations between the two countries develop in friendship.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 292 (May 16, 1969); [[w.zhou-enlai-waijiao-huodong]], 535 (May 16, 1969; 8 p.m., Jiangsu Hall, Great Hall of the People). Made public: 1993. Names: Zhou Enlai.'
