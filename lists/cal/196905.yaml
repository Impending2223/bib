    place: a-bia
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: A Bia. Lt. Gen. Melvin Zais, the 101st Airborne's commander, orders the 2d Battalions of the 501st and 502d and the 2d Battalion, 3d Regiment, Saigon 1st Division, to encircle the mountain from northeast, southeast and southwest, to cut supply and retreat.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 124–25. Names: Zais.'
