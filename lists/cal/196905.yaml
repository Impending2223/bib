  - id: cal.1969-05-08.vietnam-hanoi
    when: May 8–10
    date: '1969-05-08'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam, vietnam-paris]
    c: 'The Sixteenth Plenum. The Politburo''s resolution no. 188-NQ/TW on the situation and tasks, of May 10: the Americans, their will shaken, de-escalating step by step and "de-Americanizing" the war. The task: to press the general offensive and uprising with the diplomatic attack, defeat the design of ending the war from strength and "de-Americanization," force the Americans to withdraw and the Saigon army to collapse, a decisive victory. Lê Duẩn on the South''s revolution; an outline on the diplomatic front: the halt and the four-party conference forced from Washington, the overall solution to be put forward.'
    n: '*Nghị quyết của Bộ Chính trị số 188-NQ/TW, ngày 10 tháng 5 năm 1969, Về tình hình và nhiệm vụ*, [[w.van-kien-dang-toan]], XXX, 118–43 (the task, 134); *Đề cương báo cáo Về tình hình và nhiệm vụ trên mặt trận đấu tranh ngoại giao*, the plenum''s, "May 8–10, 1969" (76 n.), 76–117; *Bài nói của đồng chí Lê Duẩn ... tại Hội nghị Trung ương lần thứ 16, tháng 5 năm 1969, Về nhiệm vụ cách mạng miền Nam*, from the tape, not revised by him (144 n.), 144–70. [[w.lich-su-khang-chien-chong-my]], VI, 83–90 (the Politburo''s session of May 10 on the situation and the new tasks and its resolution, after *Văn kiện Đảng toàn tập*, XXX, 128–32: the Americans forced to de-escalate and "Vietnamize," the aims to make them withdraw and the Saigon army collapse; not the plenum, the diplomatic outline or Lê Duẩn''s speech). Made public: 2004. See [[cal.1968-08-29.vietnam-hanoi]]. Names: Lê Duẩn.'
    src:
      c: ad4bc52e
      rows:
        - 'w.lich-su-khang-chien-chong-my VI, 83–90: B, C'
    tags: [polity:drv, polity:us, polity:rvn, vis:only:drv, name:le-duan]
    variants:
      - unit: B
        witness: w.lich-su-khang-chien-chong-my
        reads: the Politburo met "ngày 10-5-1969" (May 10, 1969), VI, 83–84; elsewhere its resolution "tháng 4-1969" (of April 1969), VI, 128, 159, 190, 222
        at: VI, 83–84
  - id: cal.1969-05-08.china-leadership
