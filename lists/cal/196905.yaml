    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai with Chen Boda and Kang Sheng drafts the report to Mao and Lin Biao on settling Shandong: after many talks with the leaders who came to Peking, Wang Xiaoyu has made a self-criticism and the men he relied on have come forward to expose him, so Shandong''s problem is turning for the better. Next day he again sees the heads of the Jinan Military Region and the Shandong revolutionary committee and hears their self-criticisms.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 294 (May 25, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Mao Zedong, Lin Biao.'
