    time_zone: Asia/Shanghai
  - id: cal.1969-05-17.china-leadership
    when: May 17
    date: '1969-05-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai reports in writing to Mao what was said in his talks with the Inner Mongolian leaders.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291 (May 17, 1969). Made public: 2020. See [[cal.1969-05-13.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-17.vietnam-hanoi
    when: May 17–23
    date: '1969-05-17'
    place: ngoc-do-lang
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Ngọc Dơ Lang range. In Đắk Tô 2, the Front's forces surround and badly hurt the Saigon 22d Ranger Battalion.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 121. See [[cal.1969-05-11.vietnam-hanoi]].'
    tags: [polity:drv]
  - id: cal.1969-05-17.vietnam-hanoi-2
    when: May 17
    date: '1969-05-17'
    place: a-bia
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: A Bia. The American command sends the 1st Battalion, 506th, up to take Hill 900; the rain holds it, and the attack stops again.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 124.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-05-19.china-leadership
    when: May 19
    date: '1969-05-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, afternoon, with Li Xiannian, Ye Jianying and others: Zhou Enlai''s account of the Center''s means for Inner Mongolia, Shandong and Guizhou, where factionalism and a widened cleaning of class ranks continue. He condemns the chiefs of those regions for broadening, acting alone, favoring one side; at least half of the special case groups'' material cannot be believed; at Peking University men were beaten crippled ("kill the monkey, slaughter the ox, stew the sheep") for criticizing leaders. Asks whether Tao Zhu''s illness is better: he may not be refused treatment for his errors.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 292 (May 19, 1969; Zhou''s account and Mao''s criticism of the regions'' chiefs); [[w.mao-zedong-zhuan]], VI, ch. 78 n.9 (about ten days before he goes to Wuhan Mao says in a talk: ''at least half of what the special case groups have cannot be believed''; the record in n.9 is of a talk of May 19, 1969, no addressee or place named). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 78), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, talk (record 谈话记录), May 19, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.9). Names: Mao Zedong, Zhou Enlai, Li Xiannian, Ye Jianying, Tao Zhu, Hou Hanqing, Niu Huilin, Yang Keming.'
