  - id: cal.1969-05.vietnam-hanoi-2
    when: May
    date: 1969-05
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Region 6. Sappers hit the Saigon 44th Regiment at Sông Mao, Bình Thuận, a ranger camp at Lương Sơn and the subsector and gun position at Kim Ngọc. On Routes 1, 8 and 11 and north and south of Hòa Đa, the regional forces and local units stop Task Force 1/5, a Saigon mechanized infantry group: hundreds out of action, by the history''s count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 118. Check: the days; the history gives the month.'
    tags: [polity:drv, ok:fields-place]
  - id: cal.1969-05-31.vietnam-hanoi
    when: May 31
    date: '1969-05-31'
    place: hill-875
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Hill 875. In Đắk Tô 2, the 66th Regiment and Battalion 3 of the 28th close round the Saigon 11th and 23d Ranger Battalions on the hill and attack in turn; hundreds out of action, by the history's count. The Saigon command pulls back to call air and artillery, the attackers close up each time. The history notes that Regiment 174 beat the American 173d Airborne's 2d Battalion on the same hill, Nov. 1967.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 121–22. See [[cal.1969-05-11.vietnam-hanoi]].'
    tags: [polity:drv]
