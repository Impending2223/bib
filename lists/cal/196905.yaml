# Cal. CXV May 1969
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CXV
entries:
  - id: cal.1969-05-01.china-leadership
    when: May 1
    date: '1969-05-01'
    thread: china-leadership
    c: Mao at the Tiananmen rostrum, 8 p.m., for the fireworks with other leaders, Congress delegates and some foreign envoys. He tells the envoys China will improve and extend relations with all states; ambassadors begin to be sent out again to restore the missions' work.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1, 1969. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong]
  - id: cal.1969-05-03.china-leadership
    when: May 3
    date: '1969-05-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao in a talk, on the cleaning of class ranks and the "May 16" investigation: other than killers, arsonists and poisoners none killed, most not arrested; the poison he means is food poison, not political.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 3, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-05.china-leadership
    when: May 5
    date: '1969-05-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Wang Dongxing forwards Deng Xiaoping''s letter of May 3: the Ninth Congress is over, he waits for the Party''s decision on his case. Mao to Lin Biao, Zhou Enlai and the Politburo members in Peking: "read".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 5, 1969. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Lin Biao, Zhou Enlai, Wang Dongxing.'
    tags: [polity:prc, name:mao-zedong, name:deng-xiaoping, name:lin-biao, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-08.soviet-union-leadership
    when: May 8
    date: '1969-05-08'
    thread: soviet-union-leadership
    also: [defense]
    c: 'Moscow. The Defense Council, 5 to 10 p.m., Brezhnev presiding: Kosygin, Podgorny, Grechko, Povaly, Ustinov and Serbin present.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 335 (May 8). Made public: 2016. Names: Brezhnev, Kosygin, Podgorny, Grechko, Povaly, Ustinov, Serbin. Check: The record gives no agenda.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, name:podgorny-nikolai-v, name:grechko-andrei-a, name:ustinov-dmitriy-f, polity:ussr, vis:only:ussr]
  - id: cal.1969-05-16.soviet-union-leadership
    when: May 16
    date: '1969-05-16'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev meets the Romanian party-government delegation led by Ceaușescu at Vnukovo, 11 a.m., and negotiates with them, 12 to 7:30; sees them off at 9 p.m., with the leaders leaving for the international meeting.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 337 (May 16). Names: Brezhnev, Ceaușescu. Check: The record''s last line is cut off.'
    tags: [name:brezhnev-leonid, name:ceausescu-nicolae, polity:ussr, polity:romania]
  - id: cal.1969-05-19.china-leadership
    when: May 19
    date: '1969-05-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, afternoon, with Li Xiannian, Ye Jianying and others: Zhou Enlai''s account of the Center''s means for Inner Mongolia, Shandong and Guizhou, where factionalism and a widened cleaning of class ranks continue. He condemns the chiefs of those regions for broadening, acting alone, favoring one side; at least half of the special case groups'' material cannot be believed; at Peking University men were beaten crippled ("kill the monkey, slaughter the ox, stew the sheep") for criticizing leaders. Asks whether Tao Zhu''s illness is better: he may not be refused treatment for his errors.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Xiannian, Ye Jianying, Tao Zhu, Hou Hanqing, Niu Huilin, Yang Keming.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:li-xiannian, name:ye-jianying, vis:only:prc, name:tao-zhu]
  - id: cal.1969-05-19.china-leadership-2
    when: May 19
    date: '1969-05-19'
    thread: china-leadership
    c: 'Mao talks with the geologist Li Siguang, the waiting room of the Great Hall: from the origin of the stars to the origin of life; he doubts Schmidt on the solar system and rates Kant and Laplace; asks Li for his books and for scientific material gathered at home and abroad, in Chinese, as he reads no English.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1969. See [[cal.1969-05-19.china-leadership]]. Made public: 2013. Names: Mao Zedong, Li Siguang.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-19.china-leadership-3
    when: May 19–20
    date: '1969-05-19'
    thread: china-leadership
    also: [soviet-union]
    c: Mao reads Zhou Enlai's draft of the Chinese government's statement on the Sino-Soviet boundary, answering the Soviet government's statement of Mar. 29, and returns it as usable. He adds to the last paragraph the lines of not attacking, but of striking back if attacked; the statement states China's position, puts blame on the Soviet side, and proposes that the two sides agree through diplomatic channels the date and place of boundary talks. Issued May 24.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19–20, 1969. See [[cal.1969-05-19.china-leadership]]. Made public: 2013. To check: the government statement of May 24, 1969 and Zhou Enlai''s covering note (cited by [[w.zedong-mao-zedong-nianpu]], VI, May 19 or 20, 1969). Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05.china-leadership
    when: May, middle
    date: 1969-05
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s draft reply to the Soviet Foreign Ministry''s note of May 4, which charged Chinese border provocation at the Tasti River in Yumin county, Xinjiang, and threatened measures; the reply tells of Soviet intrusion into the Barluk range and air space May 2–3. Mao: if anything new happens in May, add it.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-May 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the day within the middle ten days.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-05-23.china-leadership
    when: May 23
    date: '1969-05-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s covering note to the opinion of Guizhou''s revolutionary committee and military district on carrying out the Ninth Congress, and the district''s five measures to settle Guizhou: end factionalism and strengthen unity for third-front building. Issued May 24.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 23, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-25.china-leadership
    when: May 25
    date: '1969-05-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves the Center''s reply to the Shandong revolutionary committee''s report of May 24 from Wang Xiaoyu, Yang Dezhi and Yuan Shengping, which confesses the error of the "against restoration" campaign (*fan fujiu*) and gives ten remedies: the error one of direction.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 25, 1969. Made public: 2013. Names: Mao Zedong, Wang Xiaoyu (the chronology''s Wang Xiaoyu is 王效禹), Yang Dezhi, Yuan Shengping.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-26.china-leadership
    when: May 26
    date: '1969-05-26'
    thread: china-leadership
    c: 'Mao, Hall 118, afternoon, chairs the Politburo Standing Committee and hears the Military Commission''s Office Group. It decides: a new Commission general office and a small General Political Department; the provincial districts and revolutionary committees to see to city air defense; no more army quota, the room kept to expand the navy, air force and Second Artillery; the defense industries and the Third, Fourth, Fifth and Sixth Ministries of Machine Building under the army. Other matters: local forces, field army rotations, senior transfers, graduates'' placement, the Selected Works''s fifth and sixth volumes.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 26, 1969. Made public: 2013. Names: Mao Zedong, Huang Yongsheng.'
    tags: [polity:prc, name:mao-zedong, name:huang-yongsheng, vis:only:prc]
  - id: cal.1969-05-27.china-leadership
    when: May 27
    date: '1969-05-27'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao approves Zhou Enlai, Chen Boda and Kang Sheng''s draft Center instruction on the Hubei revolutionary committee''s report of May 25, which confesses the "against restoration" campaign at Wuhan: it aimed at the committees, the army and the cadres, and set the three representative congresses above everything, against the unity of the three-in-one and unified leadership. Eight remedies.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 27, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, vis:only:prc]
  - id: cal.1969-05-29.china-leadership
    when: May 29
    date: '1969-05-29'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon: Zhou Enlai''s plan to reorganize the State Council''s working group, merge, cut and abolish its ministries and set up revolutionary committees, and to reform the Party''s central organs; Mao: as discussed, but the group''s membership to await Ji Dengkui and Li Desheng, whose duties are settled first. That evening he leaves Peking by train for Wuhan (arrives May 31), Changsha, Nanchang, Hangzhou.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 29, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Ji Dengkui, Li Desheng.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
