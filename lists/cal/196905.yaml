    when: May 19
    date: '1969-05-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai reports orally to Mao on the Inner Mongolian talks; the same day several Inner Mongolian leaders jointly write the Center "A few views on firmly carrying out the Center's instruction on Inner Mongolia's present work", admitting that the main side of their past errors was "left", that Mao's proletarian policies must be carried out quickly and firmly, that the hunt for the "Inner Mongolian People's Revolutionary Party" be stopped at once and the good people wrongly hurt fully rehabilitated.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291–292 (May 19, 1969). Made public: 2020. See [[cal.1969-05-13.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
