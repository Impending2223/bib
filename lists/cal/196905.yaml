  - id: cal.1969-05-05.china-leadership-3
    when: May 5
    date: '1969-05-05'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai that evening presides over a meeting of the Politburo''s members in Peking on a paper Mao sent, on a Peking northern-suburb lumber yard''s firm carrying out of the Party''s policies toward the national bourgeoisie and the petty bourgeoisie: capitalists are to be told from small owners and independent workers; in the 1956 high tide of socialist transformation private industrialists and merchants were all called "private side" or capitalists, and some of them are now to be set apart and treated as small owners.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289–290 (May 5, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1 (May 7, 1969; Zhou Enlai''s report of May 7: the paper Mao handed down read and discussed the evening of the 5th, to be checked and sent out by the Center for reference, with trials in the chief cities; the Center forwards it May 8; the report says only that "we" read and discussed it, not who presided). Made public: 2020. Zhou''s report of May 7: [[cal.1969-05-07.china-leadership-2]]. To check: Zhou Enlai, report of May 7, 1969 to the Center sending the draft instruction forwarding the Peking northern-suburb lumber mill''s paper (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1a). Names: Zhou Enlai, Mao Zedong.'
    src:
      c: 523943b2
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 289–290: ?'
        - 'w.jianguo-yilai-mao-zedong XIX, 445 n.1: A'
        - 'via w.jianguo-yilai-mao-zedong XIX, 445 n.1a: A'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-05-05.vietnam-hanoi
    when: May 5
    date: '1969-05-05'
    place: dong-pan
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Đồng Pan. Regiment 174 of the 5th Division attacks the base and hurts the battalion holding it; the rest falls back to Bầu Cỏ, Tây Ninh. The same day Regiment 141 of the 7th Division hits Tà Tê and north of Route 13 without success, the American 1st Cavalry's two brigades keeping the road.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 115–16.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-05-07.vietnam-hanoi
    when: May 7
    date: '1969-05-07'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'The Secretariat''s cable no. 130 to the zone, city and provincial committees: by the Politburo''s decision the Front''s delegation will put forward at the next Paris session its "principles and main content of an overall solution to the South Vietnam problem," the Government''s delegation to support it in full; a diplomatic and political blow from strength. To be explained from *Nhân Dân*''s reports; neither "peace is near" nor "too many concessions"; the plan kept secret until then.'
    n: '*Điện của Ban Bí thư số 130, ngày 7 tháng 5 năm 1969, Về vấn đề tiến công ngoại giao*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 62–64. Made public: 2004.'
    tags: [polity:drv, polity:us, vis:only:drv]
  - id: cal.1969-05-07.china-leadership
    when: May 7, 9, 10
    date: '1969-05-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai receives the heads of the joint leading group of the National Defense Industry Office, the National Defense Science and Technology Commission and the Seventh Ministry and hears the report on the work of the workers' and PLA Mao Zedong Thought propaganda teams in the ministry. While affirming the teams' results since last August he stresses that they must persuade by reason and not force, without impatience or feeling, or they lose their temper and speak wrongly and hurt feelings; the working class leading everything is not suppressing everything. He asks that factionalism's disruption be removed, national honor cherished and research and production pressed, and criticizes mass organizations that aim at Li Fuchun, Su Yu and others.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 290 (May 7, 1969). Made public: 2020. Names: Zhou Enlai, Li Fuchun.'
    tags: [polity:prc, name:zhou-enlai, name:li-fuchun, vis:only:prc]
  - id: cal.1969-05-07.china-leadership-2
    when: May 7
    date: '1969-05-07'
    thread: china-leadership
    c: 'Zhou Enlai 周恩来 reports to Mao 毛泽东 on the paper of the Peking northern-suburb lumber mill (Beijing shi Beijiao mucaichang 北京市北郊木材厂): read and discussed the evening of the 5th; to be checked, revised and sent out by the Center 中共中央 for reference, with trials in the chief cities; the Center''s draft instruction and the paper sent for Mao''s approval.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1 (May 7, 1969). [[w.zhou-enlai-nianpu-1949-2020]], III, 289–290 (May 5, 1969; the report to Mao of May 7 only). Made public: 2020. To check: Zhou Enlai, report of May 7, 1969 to the Center sending the draft instruction forwarding the Peking northern-suburb lumber mill''s paper (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1a). See [[cal.1969-05-05.china-leadership-3]]. Names: Zhou Enlai, Mao Zedong.'
    src:
