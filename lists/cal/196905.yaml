    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai submits to Mao the Inner Mongolian Party core group''s views on carrying out the Center''s instruction and the Center''s instruction itself; Mao writes: do it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 291–292 (May 20, 1969); [[w.macfarquhar-maos-last-revolution]], 258 (as early as 1969 the Center criticizes the regional revolutionary committee''s leaders for carrying the cleansing too far and creating "serious interethnic tensions"). Made public: 2020. To check: [[w.woody-cultural-revolution-in-inner]], i–vi, 30–35 (cited by [[w.macfarquhar-maos-last-revolution]], 258 n.22). See [[cal.1969-05-13.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
