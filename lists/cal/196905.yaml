  - id: cal.1969-05-05.china-leadership-2
    when: May 5
    date: '1969-05-05'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai receives the delegations of patriotic Hong Kong and Macao compatriots who came for the May Day celebrations.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 5, 1969); [[w.zhou-enlai-waijiao-huodong]], 535 (May 5, 1969; with Li Xiannian, the delegations of Hong Kong and Macao patriotic compatriots at the May Day celebrations); [[w.zhonghua-renmin-gongheguo-waijiao]], 213 (May 5, 1969; Zhou and Li Xiannian receive the Hong Kong and Macao delegation). Made public: 1993. Names: Zhou Enlai.'
