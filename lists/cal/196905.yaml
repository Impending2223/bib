  - id: cal.1969-05-19.china-leadership-5
    when: May 19
    date: '1969-05-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai receives some standing members of the Hubei Province and Wuhan revolutionary committees and Ninth Congress delegates and says that the Wuhan Workers' Congress's "resolution on certain problems of the proletarian cultural revolution in the Hubei-Wuhan area", of May 11, misjudged the situation, and that the Workers' Congress's moving into the city committee on May 17 was wrong. On May 11 the Congress's full committee had decided to send a "workers' investigation group" to the Wuhan committee; on the 16th the group's notice charged the committee with wrecking "unified leadership" and "restoring the old"; on the 17th it moved into the committee.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 292 (May 19, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
