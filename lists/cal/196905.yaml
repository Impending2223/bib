    c: Mao at the Tiananmen rostrum, 8 p.m., for the fireworks with other leaders, Congress delegates and some foreign envoys. He tells the envoys China will improve and extend relations with all states; ambassadors begin to be sent out again to restore the missions' work.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 289 (May 1, 1969; Zhou at the fireworks); [[w.zhonghua-renmin-gongheguo-waijiao]], 213 (May 1, 1969; Mao on the rostrum with some foreign envoys); [[w.yang-jisheng-tiandi-fanfu]], I, 464 (on the Tiananmen rostrum Mao asks Yang Dezhi to "achieve unity"); [[w.yang-jisheng-tiandi-fanfu]], II, 1101 (on the Tiananmen rostrum Mao meets some ambassadors in friendly talk: a sign that China wants better relations); [[w.chen-yi-nianpu]], 1213 (May 1, 1969, evening; Chen Yi on the Tiananmen rostrum at the May Day evening). Names: Mao Zedong.'
