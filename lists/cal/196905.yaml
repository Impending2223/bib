    c: 'Of Lin Biao''s saying that one sentence of Chairman Mao''s is worth ten thousand, Mao tells the staff: how can one man''s sentence be worth ten thousand, one sentence is one sentence; it is neither materialism nor dialectics, it would make him a god.'
