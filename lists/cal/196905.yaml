    c: 'Kang Sheng and Chen Boda speak to a gathering of Zhongnanhai staff on the spirit of the Ninth Congress and Mao''s latest words. Kang, whose remarks are printed and sent out more widely: even after a great victory, "We must never forget class struggle!"'
    n: '[[w.macfarquhar-maos-last-revolution]], 285–286 ("a month after the end of the congress"). Made public: 2006. To check: Kang Sheng, "Kang Sheng tongzhi zai zhongzhi jiguan chuanda ''jiuda'' jingshen dahui shangde zhongyao jianghua," May 23, 1969, 13, copy in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 286 n.5). Names: Kang Sheng, Chen Boda, Mao Zedong. Check: the day is that of Kang Sheng''s speech in its title (286 n.5), "to central organs"; the book (285) gives Chen''s and Kang''s talks to Zhongnanhai staff a month after the congress.'
