    c: Zhou Enlai, on the Tiananmen rostrum at the May Day fireworks, talks with the leaders of Shandong, Jiangsu, Shanghai, Hubei, Sichuan, Guizhou, Yunnan, the northwest's Third Front area and North China, and with those concerned on reform of the textile and machinery industries' systems.
