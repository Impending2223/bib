    date: '1969-05-31'
    place: wuhan
    thread: china-leadership
    c: 'Mao, hearing Zeng Siyu report the victory over the 1968 Yangtze flood and the early rice promising a good harvest, says: people must eat and wear; Hubei is a land of fish and rice; agriculture is the base of the national economy and grain the base of the base; Hubei is rich in grain and cotton, hold fast to them.'
    n: '[[w.mao-zedong-zhuan]], VI, ch. 78 n.8 (Zeng Siyu''s 曾思玉 recollection in Mao Zedong zai Hubei, ''the summer of 1969'' in Hubei; the day and place of the talk not given; the book adds that Mao asked about the Three Gorges and the Jiaozuo–Zhicheng railway in the stay). Made public: 1993 ([[w.mao-zedong-zai-hubei]], 39, cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.8). To check: [[w.mao-zedong-zai-hubei]], 39 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.8). See [[cal.1969-05-31.china-leadership-2]]. Names: Mao Zedong, Zeng Siyu. Check: the day and the place of the talk.'
