    c: Mao, out of Peking for the first time in more than a year, goes south by special train to Wuhan; from May 31 he stays at Meiling No. 1 of the East Lake guesthouse, Wuchang, to June 26.
    n: '[[w.mao-zedong-zhuan]], VI, ch. 78 n.5 (the stay''s days as the book gives them; the book puts his leaving Peking in the last ten days of May, no day; on his last day, June 26, he says to Hubei''s Zeng Siyu 曾思玉 and others that he came not to talk work but to rest, being busy at Peking; while there he hears the heads of Hubei on farming, water works (he suggests Zeng go and see the Three Gorges), the Jiaozuo–Zhicheng railway and the Jianghan oilfield, and reads papers on technical innovation, the Bohai earthquake and flood control in North China, n.5; the book names no day for any of them). [[w.yang-jisheng-tiandi-fanfu]], II, 736 (at the Meiling No. 1 residence Mao has the quotations and his photographs taken down). Made public: 1993 (Guan Xiang 官祥 and others, in [[w.mao-zedong-zai-hubei]], 323, cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.5). To check: Guan Xiang 官祥 and others, ''Zai Donghu de rizi li'' 《在东湖的日子里》, in [[w.mao-zedong-zai-hubei]], 323 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.5); Qian Sijie 錢嗣傑 and Gu Baozi 顧保孜, *Mao Zedong zhengzhi shenzhou youshi shi* (Renmin wenxue chubanshe, 2013), 308 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 736 n.58). Names: Mao Zedong.'
