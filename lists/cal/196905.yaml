  - id: cal.1969-05-08.vietnam-hanoi
    when: May 8–10
    date: '1969-05-08'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam, vietnam-paris]
    c: 'The Sixteenth Plenum. The Politburo''s resolution no. 188-NQ/TW on the situation and tasks, of May 10: the Americans, their will shaken, de-escalating step by step and "de-Americanizing" the war. The task: to press the general offensive and uprising with the diplomatic attack, defeat the design of ending the war from strength and "de-Americanization," force the Americans to withdraw and the Saigon army to collapse, a decisive victory. Lê Duẩn on the South''s revolution; an outline on the diplomatic front: the halt and the four-party conference forced from Washington, the overall solution to be put forward.'
    n: '*Nghị quyết của Bộ Chính trị số 188-NQ/TW, ngày 10 tháng 5 năm 1969, Về tình hình và nhiệm vụ*, [[w.van-kien-dang-toan]], XXX, 118–43 (the task, 134); *Đề cương báo cáo Về tình hình và nhiệm vụ trên mặt trận đấu tranh ngoại giao*, the plenum''s, "May 8–10, 1969" (76 n.), 76–117; *Bài nói của đồng chí Lê Duẩn ... tại Hội nghị Trung ương lần thứ 16, tháng 5 năm 1969, Về nhiệm vụ cách mạng miền Nam*, from the tape, not revised by him (144 n.), 144–70. Made public: 2004. See [[cal.1968-08-29.vietnam-hanoi]]. Names: Lê Duẩn.'
    tags: [polity:drv, polity:us, polity:rvn, vis:only:drv, name:le-duan]
  - id: cal.1969-05-08.china-leadership
    when: May 8
    date: '1969-05-08'
    thread: china-leadership
    c: 'Mao 毛泽东, on Zhou Enlai''s 周恩来 report of May 7 sending the Center''s draft instruction forwarding the paper of the Peking northern-suburb lumber mill (Beijing shi Beijiao mucaichang 北京市北郊木材厂) on carrying out the Party''s policies toward the national bourgeoisie and the petty bourgeoisie: "Issue as is." He changes the draft''s "Shanghai 上海, Tianjin 天津, Wuhan 武汉, Guangzhou 广州 and other places" to "... and the other large and medium cities".'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 445 (May 8, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Zhou Enlai, report of May 7, 1969 to the Center sending the draft instruction forwarding the Peking northern-suburb lumber mill''s paper (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 445 n.1a). See [[cal.1969-05-05.china-leadership-3]]. Names: Mao Zedong, Zhou Enlai. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
    src:
      c: 3233d43e
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 445: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 445 n.1a: all'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
