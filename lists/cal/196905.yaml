  - id: cal.1969-05-03.china-leadership
    when: May 3
    date: '1969-05-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao in a talk, on the cleaning of class ranks and the "May 16" investigation: other than killers, arsonists and poisoners none killed, most not arrested; the poison he means is food poison, not political.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 3, 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 442 (May 3, 1969; the first of two instructions on the cleaning of class ranks and the "May 16" (Wuyaoliu 五一六) investigation, printed from the Center''s forwarding of Sept. 7, 1972 of the summary of the forum on the Center''s guard work (Zhongyang jingwei gongzuo zuotanhui jiyao 中央警卫工作座谈会纪要); the second is of Feb. 1970). Made public: 2013. To check: Central Committee, forwarding of Sept. 7, 1972 of the summary of the forum on the Center''s guard work, which quotes the instruction (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 442 n.1a). Names: Mao Zedong.'
    src:
