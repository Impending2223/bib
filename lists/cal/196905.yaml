  - id: cal.1969-05-26.china-leadership
    when: May 26
    date: '1969-05-26'
    thread: china-leadership
    c: 'Mao, Hall 118, afternoon, chairs the Politburo Standing Committee and hears the Military Commission''s Office Group. It decides: a new Commission general office and a small General Political Department; the provincial districts and revolutionary committees to see to city air defense; no more army quota, the room kept to expand the navy, air force and Second Artillery; the defense industries and the Third, Fourth, Fifth and Sixth Ministries of Machine Building under the army. Other matters: local forces, field army rotations, senior transfers, graduates'' placement, the Selected Works''s fifth and sixth volumes.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 26, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 294 (May 26, 1969; the army''s takeover of the defense industry); [[w.mao-zedong-zhuan]], VI, ch. 78 n.10 (May 26 Mao hears the Military Commission''s Office Group report to the Politburo''s Standing Committee and says: in the work on special cases much is unreliable, hearsay; investigating inside and outside has brought out nothing in a long time; some students have no experience, some have factionalism, and one side lays out the other; ''do not push the responsibility down, do not blame those below, who told us not to run it''; the book gives no hall, hour or the decisions of the entry, n.10). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 294 (May 26, 1969), has Mao at the meeting also criticize the "against restoration" slogan some regions raised. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 78), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, remarks on hearing the Military Commission''s Office Group 军委办事组 report to the Standing Committee of the Politburo (record 讲话记录), May 26, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.10). Names: Mao Zedong, Huang Yongsheng.'
