  - id: cal.1969-05-19.china-leadership-3
    when: May 19–20
    date: '1969-05-19'
    thread: china-leadership
    also: [soviet-union]
    c: Mao reads Zhou Enlai's draft of the Chinese government's statement on the Sino-Soviet boundary, answering the Soviet government's statement of Mar. 29, and returns it as usable. He adds to the last paragraph the lines of not attacking, but of striking back if attacked; the statement states China's position, puts blame on the Soviet side, and proposes that the two sides agree through diplomatic channels the date and place of boundary talks. Issued May 24.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19–20, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 293 (May 24, 1969; the statement as issued); [[w.jianguo-yilai-mao-zedong]], XIX, 8–9, 18 (May 19, 1969; the draft sent for review May 19; Mao adds ''and place'' after ''date'' in the proposal that the two sides fix the date of the boundary talks through diplomatic channels, and changes ''not easy to provoke'' to ''not easy to bully'', adding ''if people do not attack me I do not attack them; if they attack me I will certainly attack them''). See [[cal.1969-05-19.china-leadership]]. Made public: 2013. To check: the government statement of May 24, 1969 and Zhou Enlai''s covering note (cited by [[w.zedong-mao-zedong-nianpu]], VI, May 19 or 20, 1969); Draft statement of the government of the People''s Republic of China, sent to Mao for review by Zhou Enlai May 19, 1969, in reply to the Soviet government''s statement of Mar. 29 (the issued statement of May 24, printed in the Renmin ribao May 25) (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 18 n.21). Names: Mao Zedong, Zhou Enlai.'
    src:
