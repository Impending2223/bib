    c: 'Beijing. Zhou to Phạm Văn Đồng and Hoàng Tùng: why do Vietnamese papers print documents on the aggressions of Chinese feudal dynasties? Tùng: none; institutes are studying the theme. Zhou: use the Ho Chi Minh trail through Laos, the Cambodian road and the sea route; the Chinese forces for air defense, railways and roads are logistical, not volunteer combat troops, and to call them volunteers would bring requests from Cuba, Algeria and the Soviet Union to send theirs; fight a protracted war in the South and be patient; he proposes 100 Chinese command, logistics, chemical, engineering and political staff, in four or five groups, for South Vietnam as far as Tri Thien, the Central Highlands, Saigon''s suburbs and the Mekong delta.'
