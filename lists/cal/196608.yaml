        - 'via w.gibbons-u-s-government-and IV, 396 n.35a: all'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:moyers-bill, name:johnson-lyndon-b, name:lodge-henry-cabot, name:nguyen-cao-ky]
