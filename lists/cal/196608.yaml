    when: Aug. 10
    date: '1966-08-10'
    thread: vietnam
    c: 'Lodge''s weekly telegram to Johnson, "Smell of victory": "We are not losing; we cannot lose ... never have things been going so well"; victory needs no defining, only "the ''smell of victory''"; open roads from Cà Mau to Quảng Trị would mean more than battles won. "There is something tremendously effective about sheer mass": "more" coming in "quicker." Westmoreland to leave nearly all search and destroy to American forces. Bowles, visiting, "impressed with our entire operation." For the election, things to "put the people in a good humor."'
