    place: daxing
    thread: china-leadership
    also: [china]
    follows:
      - cal.1966-08-31.china-leadership-5
    c: 'That night the killing begins in Daxinzhuang and over the next few days spreads across Daxing county: local militiamen and activists kill landlord, rich peasant, reactionary and bad elements and their families, throwing corpses into a dry well or burying them in ditches. The toll reaches 325 dead in thirteen communes and forty-eight brigades, the oldest eighty, the youngest thirty-eight days; some twenty-two households are wiped out.'
    n: '[[w.macfarquhar-maos-last-revolution]], 129. Made public: 2003. See [[cal.1966-08-31.china-leadership-5]]. Check: the year made public is that of Yu Luowen''s investigation of the massacre ([[w.luowen-beijing-daxing-xian-canan]], 2003), which the book cites for the aftermath (131 n.59); the days; the book says "that night" and "over the next few days" (129); no source named; Red Guards from the city were apparently not involved.'
    src:
