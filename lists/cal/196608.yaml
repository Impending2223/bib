# Cal. LXXXII August 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXII
entries:
  - id: cal.1966-08.jobs-and-wages-farm-workers
    when: Aug.
    date: 1966-08
    thread: jobs-and-wages-farm-workers
    also: [states-and-cities]
    c: Connally meets the Texas farm workers' march at New Braunfels, Tex.
    n: 'Richard Bailey, ["Starr County Strike,"](https://www.tshaonline.org/handbook/entries/starr-county-strike) *Handbook of Texas Online*. Check the day. See [[cal.1966-07-04.jobs-and-wages-tx]]. Names: Connally.'
    tags: [state:tx, name:connally-john]
  - id: cal.1966-08-01.crime-and-hijacking
    when: Aug. 1–2
    date: '1966-08-01'
    thread: crime-and-hijacking
    c: 'Austin. Charles Whitman, a student and former Marine, having killed his wife and his mother in the night, fires from the University of Texas tower for about an hour and a half: 14 killed, some 30 wounded, before police kill him. Aug. 2, Johnson: Congress to pass the gun bill, Dodd''s S. 1592, reported by the Senate Judiciary Committee Mar. 22, "before further loss of life that might be prevented by its passage."'
    n: 'Statement by the President on the Need for Firearms Control Legislation, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966); Telegram to the Chancellor of the University of Texas Following the Mass Shooting on the University Campus, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966). To check: [[w.lavergne-sniper-in-the-tower]]; [[w.zimring-firearms-and-federal-law]]. See [[cal.1965-03-08.crime-and-hijacking]]. Names: Dodd, Whitman, Johnson.'
    tags: [name:johnson-lyndon-b, name:dodd-thomas-j, name:whitman-charles-j]
  - id: cal.1966-08-01.amendments
    when: Aug. 1–5
    date: '1966-08-01'
    thread: amendments
    also: [court, congress]
    c: 'Bayh''s Subcommittee on Constitutional Amendments on Dirksen''s S.J. Res. 148, the prayer amendment: hearings Aug. 1–5, and a last day Aug. 8. The Judiciary Committee reports no resolution.'
    n: '*School Prayer: Hearings on S.J. Res. 148 before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 89th Cong., 2d sess. (1966) ([Monthly Catalog](https://mocat.library.unt.edu/catalog/862-16191); Y 4.J 89/2:P 89/966; Check: a digitized copy, and the witnesses). History of Bills, 1966, [S.J. Res. 148](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt22/pdf/GPO-CRECB-1966-pt22-2.pdf#page=47). See [[cal.1966-03-22.amendments]]. Names: Bayh, Dirksen.'
    tags: [name:bayh-birch, name:dirksen-everett]
  - id: cal.1966-08-01.vietnam
    when: Aug. 1
    date: '1966-08-01'
    thread: vietnam
    c: 'Krulak, commanding the Fleet Marine Force, Pacific, with Johnson, forty minutes, arranged by Greene: the Marines'' case against attrition, for protecting the people and for striking the North''s ports. By Krulak''s account, when he came to mining the ports Johnson "got to his feet, put his arm around my shoulder, and propelled me firmly toward the door."'
    n: '[[w.gibbons-u-s-government-and]], IV, 198–99. Krulak''s account: [[w.krulak-first-to-fight]], 202 (To check). Names: Krulak, Johnson, Greene.'
    tags: [name:krulak-victor-h, name:johnson-lyndon-b, name:greene-wallace-m-jr]
  - id: cal.1966-08-02.elections-1966
    when: Aug. 2
    date: '1966-08-02'
    thread: elections-1966
    c: 'Michigan, Democratic Senate primary: Williams, governor 1949–61, lately Assistant Secretary of State for African Affairs, defeats Cavanagh, mayor of Detroit, 437,438 to 290,465, 60.1 percent. Griffin, appointed in May to Patrick McNamara''s seat, the Republican.'
    n: 'Votes: Wikipedia, from Our Campaigns (Check: *Michigan Manual 1967–1968*, pp. 409–412). To check: [[w.noer-soapy]]. Names: Cavanagh, Griffin, Williams, Patrick McNamara.'
    tags: [name:williams-g-mennen, name:cavanagh-jerome-p, name:griffin-robert-p, name:mcnamara-patrick-v, state:mi]
  - id: cal.1966-08-02.vietnam
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    c: 'Harriman, charged by Johnson in July with the search for a settlement, holds the first of the weekly meetings of his "Negotiations Committee," with U. Alexis Johnson, Thompson, and Unger: secret talks between Saigon and the NLF to be explored, with an amnesty; more intelligence on the Front''s leaders. The same day Kissinger, back from Vietnam, tells Harriman the Viet Cong''s political organization is untouched and pacification has made little progress.'
    n: 'FRUS 1964–68, IV, docs. [196](https://history.state.gov/historicaldocuments/frus1964-68v04/d196), [197](https://history.state.gov/historicaldocuments/frus1964-68v04/d197). [[w.gibbons-u-s-government-and]], IV, 388–89, 395–96, 384–85 (Kissinger). Gibbons dates Harriman''s appointment to the search for a settlement May 1966 (IV, 388); FRUS''s editors, July (doc. 197 n. 1). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]. Names: Harriman, Thompson, Unger, U. Alexis Johnson, Kissinger, Johnson.'
    tags: [name:harriman-w-averell, name:johnson-u-alexis, name:thompson-llewellyn-e, name:unger-leonard, name:kissinger-henry-a, name:johnson-lyndon-b]
  - id: cal.1966-08-02.governors-id
    when: Aug. 2
    date: '1966-08-02'
    thread: governors
    also: [elections-1966]
    c: 'Idaho''s primary. Republican, for governor: Samuelson, a State senator, over Smylie, governor since 1955, 52,891 to 33,753, 61.0 percent. Democratic: Herndon over Andrus, 28,926 to 27,649, 40.8 percent; Dee 14,409, 20.3 percent.'
    n: 'Votes: [Wikipedia, "1966 Idaho gubernatorial election"](https://en.wikipedia.org/wiki/1966_Idaho_gubernatorial_election), from CQ''s *Guide to U.S. Elections*; Check: Idaho''s abstract of votes. To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1962-06-05.governors-id]]. Names: Samuelson, Smylie, Herndon, Andrus, Dee.'
    tags: [state:id, name:samuelson-don, name:smylie-robert-e, name:herndon-charles, name:andrus-cecil-d, name:dee-william-j]
  - id: cal.1966-08-02.governors-ks
    when: Aug. 2
    date: '1966-08-02'
    thread: governors
    also: [elections-1966]
    c: 'Kansas, governor. Democratic primary: Robert Docking, the late governor''s son, over one other, 96,414 to 16,385, 85.5 percent. Republican: Governor Avery over one other, 144,842 to 48,051, 75.1 percent.'
    n: 'Votes: Kan. Secretary of State, *Election Statistics, 1966*, [21–22](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/60/download#page=20): Docking 96,414, Hart 16,385; Avery 144,842, Crozier 48,051. To check: [[w.socolofsky-kansas-governors]]. Names: Robert Docking, Avery.'
    tags: [state:ks, name:docking-robert, name:avery-william-h]
  - id: cal.1966-08-02.middle-east-iran-arms
    when: Aug. 2
    date: '1966-08-02'
    thread: middle-east-iran-arms
    c: 'Johnson sends Hoopes to Tehran: deliveries sped, the research and development costs taken off the Hawks.'
    n: '[FRUS 1964–68, XXII, doc. 168](https://history.state.gov/historicaldocuments/frus1964-68v22/d168). See [[cal.1966-06-29.middle-east]]. Names: Johnson, Hoopes.'
    tags: [name:johnson-lyndon-b, name:hoopes-townsend-w]
  - id: cal.1966-08-03.vietnam-operations
    when: Aug. 3
    date: '1966-08-03'
    thread: vietnam-operations
    c: 'Hastings ends, one battalion left in its area. Some 8,000 Marines and 3,000 South Vietnamese engaged against elements of all three regiments of the 324B Division. Marines: 126 killed, 448 wounded; South Vietnamese: 21 killed, 40 wounded. Reported: over 700 of the enemy killed, 17 captured.'
    n: '[[w.shulimson-u-s-marines-in-1982]], 175–176. See [[cal.1966-07-15.vietnam-operations]].'
    tags: [place:operation-hastings]
  - id: cal.1966-08-04.jobs-and-wages
    when: Aug. 4
    date: '1966-08-04'
    thread: jobs-and-wages-airlines
    c: Senate passes S.J. Res. 186, on the airline strike, [54–33](https://voteview.com/rollcall/RS0890383); the day before, an amendment for compulsory arbitration if the 180 days the resolution allows for negotiation run out refused, [6–81](https://voteview.com/rollcall/RS0890380).
    n: 'Check: the Record''s pages. See [[cal.1966-07-08.jobs-and-wages]].'
  - id: cal.1966-08-04.steel
    when: Aug. 4
    date: '1966-08-04'
    thread: steel
    also: [economy]
    c: 'Inland Steel raises prices on major products; four more companies follow. Ackley had wired twelve producers to act only after talking with the Government. His statement: the companies'' action "can only be characterized as irresponsible."'
    n: 'Ackley''s statement, as printed with The President''s News Conference, [1966 Pub. Papers 804](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=178) (Aug. 9, 1966). To check: [[w.sheahan-wage-price-guideposts]]; [[w.exhortation-and-controls]]. See [[cal.1965-12-31.steel]]. Names: Ackley.'
    tags: [name:ackley-gardner]
  - id: cal.1966-08-04.india-and-china
    when: Aug. 4
    date: '1966-08-04'
    thread: indonesia
    c: 'NSC on Indonesia. Johnson recalls the Council''s decision of a year before to cut off most aid. Rusk: the reversal of Indonesia''s course "abrupt"; its debts to be rescheduled.'
    n: '[FRUS 1964–68, XXVI, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v26/d217). To check: [[w.simpson-economists-with-guns]]. See [[cal.1966-03-11.india-and-china]]. Names: Rusk, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1966-08-04.elections-1966
    when: Aug. 4
    date: '1966-08-04'
    thread: elections-1966
    c: 'Tennessee, Democratic Senate primary: Clement, the governor, defeats Bass, 384,322 to 366,079, 51.2 percent; Bass had won the last two years of Kefauver''s term in 1964. Howard H. Baker Jr. the Republican nominee, 112,617 to 36,043, 75.7 percent.'
    n: 'Votes: CQ Guide 6th (2010) 1540. To check: [[w.greene-lead-me-on]]. Names: Kefauver, Bass, Baker, Clement.'
    tags: [name:bass-ross, name:baker-howard-h-jr, name:kefauver-estes, name:clement-frank-g]
  - id: cal.1966-08-04.governors-tn
    when: Aug. 4
    date: '1966-08-04'
    thread: governors
    also: [elections-1966]
    c: 'Tennessee, Democratic primary for governor: Ellington, governor 1959–63, over John Jay Hooker, a Nashville lawyer, 413,950 to 360,105, 53.5 percent. No Republican nominee.'
    n: 'Votes: Wikipedia, ["1966 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1966_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. Clement and Bass the same day: [[cal.1966-08-04.elections-1966]]. To check: [[w.greene-lead-me-on]]. Names: Hooker, Ellington.'
    tags: [state:tn, name:ellington-buford, name:hooker-john-jay]
  - id: cal.1966-08-05.open-housing
    when: Aug. 5
    date: '1966-08-05'
    thread: open-housing
    also: [king]
    c: 'Chicago. The marches into the white neighborhoods of the Southwest Side, from late July. Aug. 5, Marquette Park: King struck on the head by a rock; bottles and bricks thrown at the marchers. King: "I have seen many demonstrations in the south but I have never seen anything so hostile and so hateful as I''ve seen here today."'
    n: '"Dr. King Is Felled by Rock," *Chicago Tribune*, Aug. 6, 1966. [[w.garrow-bearing-the-cross]], 499–500. See [[cal.1966-07-10.open-housing]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1966-08-05.legislatures-mo
    when: Aug. 5
    date: '1966-08-05'
    thread: legislatures
    c: Missouri. The three-judge court holds the congressional redistricting act of 1965 unconstitutional too; the 1966 elections to go ahead under it, the legislature to draw new districts before 1968.
    n: '*Preisler v. Secretary of State*, [257 F. Supp. 953](https://static.case.law/f-supp/257/case-pdfs/0953-01.pdf) (W.D. Mo. 1966). See [[cal.1965-01-04.legislatures-mo]].'
    tags: [state:mo]
  - id: cal.1966-08-08.india-and-china
    when: Aug. 8
    date: '1966-08-08'
    thread: india-and-china-cultural-revolution
    c: Peking. The Central Committee's plenum, Aug. 1–12, adopts the Sixteen Points on the Great Proletarian Cultural Revolution; Lin Biao second to Mao.
    n: 'Check: the decision''s text. See [[cal.1966-07-28.india-and-china-cultural-revolution]]. Names: Lin Biao, Mao Zedong.'
    tags: [name:mao-zedong, name:lin-biao]
  - id: cal.1966-08-08.vietnam
    when: Aug. 8
    date: '1966-08-08'
    thread: vietnam
    c: 'The *New York Times*: a Pentagon study puts victory eight years off, or five with 750,000 men, partial mobilization and the reserves called. The source Greene, the Marine Commandant, in a backgrounder in Saigon; by Greene''s recollection, Johnson by telephone demands what he meant. Denials follow.'
    n: '[[w.gibbons-u-s-government-and]], IV, 380–81. To check: *New York Times*, Aug. 8, 1966; [[w.herring-lbj-and-vietnam]], 50. Names: Greene, Johnson.'
    tags: [name:greene-wallace-m-jr, name:johnson-lyndon-b]
  - id: cal.1966-08-08.economy
    when: Aug. 8
    date: '1966-08-08'
    thread: economy
    also: [vietnam]
    c: 'Johnson with the congressional leaders on an income tax increase. By Califano''s account: Ford, "You''d have trouble getting more than fifteen votes"; Albert, "You wouldn''t even get that many!" Russell Long and Mills against any increase, but they might go along with suspending the investment credit.'
    n: '[[w.gibbons-u-s-government-and]], IV, 425–26. To check: [[w.califano-triumph-and-tragedy-of]], 148. Names: Johnson, Ford, Albert, Russell Long, Mills, Califano.'
    tags: [name:johnson-lyndon-b, name:ford-gerald-r, name:albert-carl, name:long-russell-b, name:mills-wilbur-d, name:califano-joseph-a-jr]
  - id: cal.1966-08-09.open-housing
    when: Aug. 9
    date: '1966-08-09'
    thread: open-housing
    c: 'House passes the civil rights bill, H.R. 14765, [259–157](https://voteview.com/rollcall/RH0890293). Title IV, fair housing, kept: recommittal to strike it lost, [190–222](https://voteview.com/rollcall/RH0890292); a broker may follow an exempt owner''s written instruction to discriminate, [237–176](https://voteview.com/rollcall/RH0890289). Added: a federal crime to travel or use the mails to incite a riot, [389–25](https://voteview.com/rollcall/RH0890290); suits to desegregate schools only on a written complaint, [214–201](https://voteview.com/rollcall/RH0890291). The rule taken July 25, [200–180](https://voteview.com/rollcall/RH0890288). Aug. 10, Johnson: the House "has barred bigotry in all new housing and in apartment houses"; the provision "not as comprehensive as that we proposed and sought."'
    n: 'Statement by the President Following House Approval of the Civil Rights Bill, [1966 Pub. Papers 814](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=188) (Aug. 10, 1966). See [[cal.1966-04-28.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-08-09.vietnam-prisoners
    when: Aug. 9
    date: '1966-08-09'
    thread: vietnam-prisoners
    c: The president of the International Committee of the Red Cross speaks of Hanoi's "moderation" in postponing the airmen's trials.
    n: '[FRUS 1964–68, IV, doc. 207](https://history.state.gov/historicaldocuments/frus1964-68v04/d207). See [[cal.1966-07-06.vietnam]].'
  - id: cal.1966-08-09.elections-1966
    when: Aug. 9
    date: '1966-08-09'
    thread: elections-1966
    also: [governors]
    c: 'Arkansas, the Democratic runoff for governor: Jim Johnson 210,543, Holt 195,442.'
    n: 'Ark., [*Historical Report of the Secretary of State* (2018), 412–413](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). Votes: Wikipedia, from Our Campaigns (Check: Ark. Secretary of State). See [[cal.1966-07-26.elections-1966]]. Names: James Johnson, Frank Holt.'
    tags: [state:ar, name:johnson-james-d, name:holt-frank]
  - id: cal.1966-08-09.steel
    when: Aug. 9
    date: '1966-08-09'
    thread: steel
    also: [economy, jobs-and-wages-airlines]
    c: 'News conference. Johnson on the steel prices: some $50 million a year more for the companies after taxes; "We urged them to reconsider that decision, but we have not been effective." The airline increases "could not be kept within 3.2"; the leadership recommended 4.3, and the union rejected it.'
    n: 'The President''s News Conference, [1966 Pub. Papers 804](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=178) (Aug. 9, 1966). See [[cal.1966-08-04.steel]]; [[cal.1966-07-08.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    aliases: [cal.1966-08-09.jobs-and-wages-airlines]
  - id: cal.1966-08-09.vietnam
    when: Aug. 9
    date: '1966-08-09'
    thread: vietnam
    also: [elections-1966]
    c: 'The Republican National Committee''s paper on the war and the administration''s word: "a steady diet of rosy predictions and misleading statements"; the people "never know what they don''t know."'
    n: '[[w.johns-vietnams-second-front]], 114. To check: the report, Aug. 9, 1966 (Johns: box 198, May Papers).'
  - id: cal.1966-08-10.space
    when: Aug. 10
    date: '1966-08-10'
    thread: space
    c: Lunar Orbiter 1 launched, to photograph possible landing sites for Apollo.
    n: '[NASA, *Lunar Orbiter I: Photographic Mission Summary*, NASA CR-782 (1967)](https://ntrs.nasa.gov/api/citations/19670012120/downloads/19670012120.pdf). To check: [[w.byers-destination-moon]].'
  - id: cal.1966-08-10.middle-east-iran-arms
    when: Aug. 10
    date: '1966-08-10'
    thread: middle-east-iran-arms
    c: 'Hoopes and Meyer with the Shah: the F-4s conditional on how far he goes with Moscow; no Soviet missiles, by their reckoning.'
    n: '[FRUS 1964–68, XXII, doc. 172](https://history.state.gov/historicaldocuments/frus1964-68v22/d172). See [[cal.1966-06-29.middle-east]]. Names: Hoopes, Meyer, Pahlavi.'
    tags: [name:hoopes-townsend-w, name:meyer-armin-h, name:pahlavi-mohammed-reza]
  - id: cal.1966-08-11.india-and-china-indonesia
    when: Aug. 11
    date: '1966-08-11'
    thread: indonesia
    c: 'Djakarta. Malik and Razak sign the Bangkok accord: Indonesia''s confrontation of Malaysia ended, "hostile acts" to cease; diplomatic relations, by secret letters, after elections in Sabah and Sarawak.'
    n: '[FRUS 1964–68, XXVI, doc. 218](https://history.state.gov/historicaldocuments/frus1964-68v26/d218). See [[cal.1966-03-11.india-and-china]]. Names: Malik, Razak.'
    tags: [name:malik-adam, name:razak-tun-abdul]
  - id: cal.1966-08-12.opinion
    when: Aug. 12
    date: '1966-08-12'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, July 29–Aug. 3: Johnson too friendly to labor unions, 25 percent; not friendly enough, 10; about right, 35. Union members: too friendly 14, not friendly enough 17.'
    n: '[[w.gallup-poll]], III, 2022. See [[cal.1966-07-08.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-08-13.vietnam
    when: Aug. 13–14
    date: '1966-08-13'
    thread: vietnam
    c: 'Westmoreland, from Honolulu, at the Ranch; he and Johnson talk until early morning. Johnson to the press, Aug. 14: a Communist military takeover in South Vietnam "no longer just improbable ... it is impossible"; "there will be no quick victory, but the world must know that we will not quit." Westmoreland takes questions.'
    n: 'Remarks to the Press at the LBJ Ranch Following a Report on Vietnam by General Westmoreland, [1966 Pub. Papers 821](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=195) (Aug. 14, 1966). [[w.gibbons-u-s-government-and]], IV, 381. To check: [[w.westmoreland-soldier-reports]]. Names: Westmoreland, Johnson.'
    tags: [name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1966-08-14.opinion
    when: Aug. 14
    date: '1966-08-14'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, July 29–Aug. 3: the party one would like to see win the congressional district: Democratic 54 percent, Republican 46.'
    n: '[[w.gallup-poll]], III, 2023.'
  - id: cal.1966-08-14.space
    when: Aug. 14
    date: '1966-08-14'
    thread: space
    c: Lunar Orbiter 1 in orbit about the moon, the first American craft there.
    n: '[NASA, *Lunar Orbiter I: Photographic Mission Summary*, NASA CR-782 (1967)](https://ntrs.nasa.gov/api/citations/19670012120/downloads/19670012120.pdf). See [[cal.1966-08-10.space]].'
  - id: cal.1966-08-15.middle-east-iran-arms
    when: Aug. 15
    date: '1966-08-15'
    thread: middle-east-iran-arms
    c: 'The Shah''s reply to Johnson''s letter: their cooperation in military matters "cordial and to the interest of both countries."'
    n: '[FRUS 1964–68, XXII, doc. 173](https://history.state.gov/historicaldocuments/frus1964-68v22/d173). See [[cal.1966-06-29.middle-east]]. Names: Pahlavi, Johnson.'
    tags: [name:pahlavi-mohammed-reza, name:johnson-lyndon-b]
  - id: cal.1966-08-15.vietnam-congress
    when: Aug. 15
    date: '1966-08-15'
    thread: vietnam-congress
    c: 'Marcy to Fulbright, Mansfield and Aiken: accept Sihanouk''s invitation to send three Senators to Cambodia, under Mansfield, Fulbright or Morse, with the President''s tacit approval; the real purpose to give the NLF or Hanoi "a chance to talk." Failing that, the fallout in Johnson''s favor.'
    n: '[[w.gibbons-u-s-government-and]], IV, 394. To check: Marcy''s memorandum, Aug. 15, 1966 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, Mansfield, Aiken, Sihanouk, Morse, Johnson.'
    tags: [name:marcy-carl, name:fulbright-j-william, name:mansfield-mike, name:aiken-george-d, name:norodom-sihanouk, name:morse-wayne, name:johnson-lyndon-b]
  - id: cal.1966-08-16.students
    when: Aug. 16–19
    date: '1966-08-16'
    thread: students
    also: [vietnam]
    c: 'House Un-American Activities Committee, hearings on Pool''s bill, H.R. 12047, and others: aid to an enemy in an undeclared war punishable by $20,000, twenty years, or both. Witnesses from the Progressive Labor Party and the Berkeley Vietnam Day Committee. Kinoy, counsel to witnesses, carried from the room by marshals (Check the day); Rubin in the uniform of a soldier of the Revolution. Arrests in the hall and outside (Check).'
    n: 'Daily Digest, [112 Cong. Rec. D434](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=432), [112 Cong. Rec. D439](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=437), [112 Cong. Rec. D443](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=441). House Committee on Un-American Activities, *Hearings on H.R. 12047, H.R. 14925, H.R. 16175, H.R. 17140, and H.R. 17194—Bills to Make Punishable Assistance to Enemies of U.S. in Time of Undeclared War*, 89th Cong., 2d Sess. (Aug. 16–23, 1966), pts. [1](https://archive.org/details/hearingsonhr120401unit), [2](https://archive.org/details/hearingsonhr120402unit). [[w.gibbons-u-s-government-and]], IV, 428–29 (the hearings; Kinoy; Rubin). To check: [[w.goodman-committee]]; [[w.wells-war-within]]. Names: Rubin, Kinoy, Pool.'
    tags: [name:pool-joe-r, name:rubin-jerry, name:kinoy-arthur]
  - id: cal.1966-08-17.transportation
    when: Aug. 17
    date: '1966-08-17'
    thread: transportation-auto-safety
    c: 'House passes the National Traffic and Motor Vehicle Safety Act, H.R. 13228, [371–0](https://voteview.com/rollcall/RH0890304): federal safety standards for new cars; an advisory council named by the President, not the Secretary of Commerce, refused, [168–205](https://voteview.com/rollcall/RH0890303).'
    n: 'Check: the Record''s page. To check: [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]. See [[cal.1966-03-02.transportation]]; [[cal.1966-06-24.transportation]].'
  - id: cal.1966-08-17.defense
    when: Aug. 17–18
    date: '1966-08-17'
    thread: defense
    also: [vietnam]
    c: 'Senate, the defense appropriation. The Russell–Saltonstall amendment: the President may order to active duty, for up to 24 months, a member of the Ready Reserve who has served on active duty only for training, [66–21](https://voteview.com/rollcall/RS0890417); a wider call, by units, refused, [26–62](https://voteview.com/rollcall/RS0890416). Aug. 18, the bill passes, [86–0](https://voteview.com/rollcall/RS0890422).'
    n: '[[w.gibbons-u-s-government-and]], IV, 413–14 (the Russell amendment; the bill, Aug. 18; Clark''s and McGovern''s amendments). To check: [[w.fite-richard-b-russell-jr]]; [[w.flynn-draft-1940-1973]]. Names: Russell, Saltonstall.'
    tags: [name:russell-richard-b, name:saltonstall-leverett]
  - id: cal.1966-08-17.opinion
    when: Aug. 17
    date: '1966-08-17'
    thread: opinion
    also: [cities-and-housing]
    c: 'Gallup, July 29–Aug. 3: Negro families in the smaller towns and cities of the North have a better life than those in the biggest cities, 62 percent; Northern whites seven in ten; Negroes 3 to 1. Of those saying better, about evenly divided on encouraging Negroes to move out of the big cities.'
    n: '[[w.gallup-poll]], III, 2023.'
  - id: cal.1966-08-18.india-and-china-cultural-revolution
    when: Aug. 18
    date: '1966-08-18'
    thread: india-and-china-cultural-revolution
    c: Peking. Mao reviews the Red Guards at Tiananmen.
    n: '[*New York Times*, Aug. 19, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/19/issue.html). See [[cal.1966-07-28.india-and-china-cultural-revolution]]. Names: Mao Zedong.'
    tags: [name:mao-zedong]
  - id: cal.1966-08-18.transportation-auto-safety
    when: Aug. 18
    date: '1966-08-18'
    thread: transportation-auto-safety
    c: 'House passes the Highway Safety Act, H.R. 13290, [318–3](https://voteview.com/rollcall/RH0890306): grants for the States'' safety programs.'
    n: 'Check: the Record''s page. See [[cal.1966-08-17.transportation]].'
  - id: cal.1966-08-19.cities-and-housing
    when: Aug. 19
    date: '1966-08-19'
    thread: cities-and-housing
    c: 'Senate passes the demonstration cities bill, S. 3708, [53–22](https://voteview.com/rollcall/RS0890425); an amendment to strike all its money but $24 million for planning lost, [26–55](https://voteview.com/rollcall/RS0890423). Muskie the bill''s manager. July 27, Johnson on the subcommittee''s report: "good news for the future of our cities."'
    n: 'Statement by the President Following Senate Committee Action on the Demonstration Cities Bill, [1966 Pub. Papers 787](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=161) (July 27, 1966). See [[cal.1966-01-26.cities-and-housing]]. Names: Muskie, Johnson.'
    tags: [name:muskie-edmund-s, name:johnson-lyndon-b]
  - id: cal.1966-08-19.japan-and-korea
    when: Aug. 19
    date: '1966-08-19'
    thread: japan
    c: Reischauer leaves Tokyo for Harvard; he resigned in April. U. Alexis Johnson, nominated July 28, confirmed Aug. 31, in Tokyo from Nov. 8.
    n: '[Edwin Oldfather Reischauer](https://history.state.gov/departmenthistory/people/reischauer-edwin-oldfather); [Ural Alexis Johnson](https://history.state.gov/departmenthistory/people/johnson-ural-alexis) (Office of the Historian). [FRUS 1964–68, XXIX, pt. 2, doc. 77](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d77). To check: [[w.reischauer-my-life-between-japan]]; [[w.johnson-right-hand-of-power]]. See [[cal.1961-04-27.japan-and-korea]]. Names: Reischauer, Johnson.'
    tags: [name:reischauer-edwin-o, name:johnson-u-alexis]
  - id: cal.1966-08-19.jobs-and-wages-airlines
    when: Aug. 19
    date: '1966-08-19'
    thread: jobs-and-wages-airlines
    c: The machinists ratify a three-year contract with a cost-of-living clause; the airline strike ends.
    n: Remarks on Announcing an Agreement in the Airline Strike, [1966 Pub. Papers 792](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=166) (July 29, 1966), its note. See [[cal.1966-07-08.jobs-and-wages]].
  - id: cal.1966-08-21.opinion
    when: Aug. 21
    date: '1966-08-21'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, July 29–Aug. 4: Robert Kennedy 55 percent, Romney 39. Democrats'' choice for 1968: Kennedy 40, Johnson 38, Humphrey 6, McNamara 6. Independents: Kennedy 38, Johnson 24, McNamara 13, Humphrey 5.'
    n: '[[w.gallup-poll]], III, 2023. Names: Robert Kennedy, Romney, Johnson, Humphrey, McNamara.'
    tags: [name:kennedy-robert-f, name:romney-george-w, name:johnson-lyndon-b, name:humphrey-hubert-h, name:mcnamara-robert-s]
  - id: cal.1966-08-23.space
    when: Aug. 23
    date: '1966-08-23'
    thread: space
    c: Lunar Orbiter 1 takes the first picture of the earth from the moon.
    n: '[NASA, *Lunar Orbiter I: Photographic Mission Summary*, NASA CR-782 (1967)](https://ntrs.nasa.gov/api/citations/19670012120/downloads/19670012120.pdf). See [[cal.1966-08-10.space]].'
  - id: cal.1966-08-23.governors-ak
    when: Aug. 23
    date: '1966-08-23'
    thread: governors
    also: [elections-1966]
    c: 'Alaska''s primary. Democratic, for governor: Governor Egan over Kay, 19,801 to 12,660, 61.0 percent of the party''s vote. Republican: Hickel over Kendall, 10,580 to 4,511, 55.3 percent; Stepovich 4,039, 21.1 percent.'
    n: 'Votes: [Alaska, *Official Returns by Election Precinct, Primary Election (August 23, 1966)*, 6](https://www.elections.alaska.gov/Core/Archive/66PRIM/66prim.pdf#page=8) (statewide totals; persons voting 53,667). To check: [[w.naske-alaska]]. See [[cal.1962-08-14.governors-ak]]. Names: Egan, Hickel. Check: whether Stepovich is Mike Stepovich.'
    tags: [state:ak, name:egan-william-a, name:hickel-walter-j]
  - id: cal.1966-08-23.elections-1966
    when: Aug. 23
    date: '1966-08-23'
    thread: elections-1966
    also: [vietnam]
    c: Nixon, after a meeting with Republican Senators that Morton arranged, for an all-Asian peace conference, China and North Vietnam in it; the war to go on meanwhile; the European allies to join an embargo on North Vietnam.
    n: '[[w.johns-vietnams-second-front]], 114–15. To check: [[w.gibbons-u-s-government-and]], IV, 391–93. Names: Nixon, Morton.'
    tags: [name:nixon-richard-m, name:morton-thruston-b]
  - id: cal.1966-08-23.europe-and-the-alliance
    when: Aug. 23
    date: '1966-08-23'
    thread: europe-and-the-alliance
    c: 'Johnson''s meeting, 6:30 p.m., on the German offset and the British and American forces in Germany: how to keep Britain from sharp cuts in its forces there, and what to do about the American offset agreement, which runs out in June 1967. McNamara and Fowler for holding Bonn to full offset; Ball for a softer line; State and Bator for talks of the three governments, McCloy the American. Johnson approves the talks.'
    n: '[FRUS 1964–68, XIII, doc. 197](https://history.state.gov/historicaldocuments/frus1964-68v13/d197) (Bator''s briefing). [[w.schwartz-lyndon-johnson-and-europe]], 123–25 (the meeting, by Bator''s papers). Schwartz, 124, has the meeting at the Ranch, "in late August"; Bator''s briefing is dated Washington, Aug. 23, 4 p.m., for the meeting "this afternoon at 6:30," and Johnson held his news conference at the White House the next day (The President''s News Conference of August 24, 1966, [1966 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=250)). Names: McNamara, Fowler, Ball, Bator, McCloy, Johnson.'
    src:
      c: 2f4ed86f
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d197: all'
        - 'w.schwartz-lyndon-johnson-and-europe 123–25: ?'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=250: A'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:fowler-henry-h, name:ball-george-w, name:bator-francis-m, name:mccloy-john-j]
  - id: cal.1966-08-24.opinion
    when: Aug. 24
    date: '1966-08-24'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: Johnson''s handling of Vietnam: approve 43 percent, disapprove 39.'
    n: '[[w.gallup-poll]], III, 2024. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-08-24.vietnam-congress
    when: Aug. 24
    date: '1966-08-24'
    thread: vietnam-congress
    c: 'Harriman at lunch with Fulbright, to sound him out for Rusk or the President. By Harriman''s memorandum: Fulbright evades the question of how to start talks, but names two obstacles, no place for the NLF and Hanoi''s disbelief that the United States will ever withdraw; he himself does not believe it. Harriman: the President means to withdraw if North Vietnam does. Fulbright: Congress "more warlike than the President." He speaks slightingly of the coming elections in the South.'
    n: '[[w.gibbons-u-s-government-and]], IV, 394–95, 412. To check: Harriman, memorandum of conversation, Aug. 24, 1966 (Library of Congress, Harriman Papers, Fulbright File). Names: Harriman, Fulbright, Rusk, Johnson.'
    tags: [name:harriman-w-averell, name:fulbright-j-william, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1966-08-25.civil-rights-the-executive
    when: Aug. 25
    date: '1966-08-25'
    thread: civil-rights-the-executive
    c: 'Randolph and Heineman bring the report of the White House Conference "To Fulfill These Rights," held June 1–2, to the Cabinet. Johnson: "an agenda for debate and action for years to come." McPherson and Clifford Alexander to chair a committee of officials, its interim report within 30 days. Copies to every governor, and through Humphrey to the mayors of more than 500 cities.'
    n: 'Statement by the President in Response to Final Report of White House Conference "To Fulfill These Rights.", [1966 Pub. Papers 894](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=268) (Aug. 25, 1966); Remarks to the Press Following a Cabinet Meeting on Foreign and Military Policy, [1966 Pub. Papers 893](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=267) (Aug. 25, 1966). To check: [[w.graham-civil-rights-era]]. See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph, McPherson, Alexander, Humphrey, Johnson, Heineman.'
    tags: [name:randolph-a-philip, name:mcpherson-harry, name:alexander-clifford-l-jr, name:humphrey-hubert-h, name:johnson-lyndon-b, name:heineman-ben-w]
  - id: cal.1966-08-25.elections-1966
    when: Aug. 25
    date: '1966-08-25'
    thread: elections-1966
    also: [vietnam]
    c: 'The Republican congressional leadership''s release: "encouragement and endorsement of the proposal of an all-Asian Peace Conference," Percy''s; the Republicans "the party of peace." Dirksen doubtful.'
    n: '[[w.johns-vietnams-second-front]], 121. To check: the release, Aug. 25, 1966 (Johns: Republican Congressional Leadership File, folder 69, Dirksen Papers). See [[cal.1966-08-23.elections-1966]]. Names: Percy, Dirksen.'
    tags: [name:percy-charles-h, name:dirksen-everett]
  - id: cal.1966-08-25.europe-and-the-alliance
    when: Aug. 25–26
    date: '1966-08-25'
    thread: europe-and-the-alliance
    c: 'Johnson to Erhard, Aug. 25, before his cabinet''s budget meeting, and to Wilson, Aug. 26: the three governments to explore together "this entire range of issues: force levels, deployments and the sharing of the foreign exchange burden," finance ministers with foreign and defense. To Wilson: "it would be foolish to run down our assets vis-a-vis Moscow without some quid-pro-quo." To Erhard: the present offset agreement to be met.'
    n: '[FRUS 1964–68, XIII, doc. 198](https://history.state.gov/historicaldocuments/frus1964-68v13/d198) (to Wilson; the letter to Erhard, its note). [[w.schwartz-lyndon-johnson-and-europe]], 123–25. See [[cal.1966-08-23.europe-and-the-alliance]]. Names: Erhard, Wilson, Johnson.'
    tags: [name:johnson-lyndon-b, name:erhard-ludwig, name:wilson-harold]
  - id: cal.1966-08-26.open-housing
    when: Aug. 26
    date: '1966-08-26'
    thread: open-housing
    also: [king, states-and-cities]
    c: 'Chicago. The summit, from Aug. 17: Daley and the city, the Real Estate Board, the Housing Authority, churches, business, and labor with the Freedom Movement; Aug. 26, an agreement at the Palmer House. The Commission on Human Relations to enforce the city''s fair-housing ordinance; the Real Estate Board to drop its opposition to open occupancy (Check the terms); public housing scattered and low; mortgages without regard to race. The marches suspended, the one into Cicero called off. King: "the first step in a 1,000-mile journey."'
    n: '[Report of the subcommittee to the summit meeting on fair housing](https://www.crmvet.org/docs/66chiagm.htm) (Aug. 26, 1966); King, [Statement on Open Housing Made at the Palmer House](https://okra.stanford.edu/link/document660826-000) (King Papers Project). [[w.chicago-1966]], which prints the agreement (Check). [[w.garrow-bearing-the-cross]], 503–07, 518–24. See [[cal.1966-07-10.open-housing]]. Names: King, Daley.'
    tags: [name:king-martin-luther-jr, name:daley-richard-j, state:il, city:chicago]
  - id: cal.1966-08-26.jobs-and-wages
    when: Aug. 26
    date: '1966-08-26'
    thread: jobs-and-wages
    c: 'Senate passes the Fair Labor Standards Amendments, H.R. 13712, [57–17](https://voteview.com/rollcall/RS0890438): the minimum wage to $1.40 Feb. 1, 1967, $1.60 a year later; coverage to farm workers and others not covered before (Check the classes). Keeping $1.40 two years lost, Aug. 25, [40–42](https://voteview.com/rollcall/RS0890427); the newly covered farm workers kept in, [37–51](https://voteview.com/rollcall/RS0890429). The House passed its bill May 26, [303–93](https://voteview.com/rollcall/RH0890261).'
    n: 'To check: [[w.nordlund-quest-for-a-living]].'
  - id: cal.1966-08-26.opinion
    when: Aug. 26
    date: '1966-08-26'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, July 29–Aug. 3: can name their Congressman, 46 percent. Men 54; women 40. Republicans 61; independents 46; Democrats 40.'
    n: '[[w.gallup-poll]], III, 2024.'
  - id: cal.1966-08-28.economy
    when: Aug. 28–29
    date: '1966-08-28'
    thread: economy
    c: 'Truman, from Kansas City, Aug. 28: "A drastic increase in interest rates has been imposed on the American economy"; a "serious depression" possible; of the Federal Reserve: "Is it being so administered now? Is it in the true sense a Federal system?" Johnson, Aug. 29: concerned at the rise, but "I cannot agree ... that our economy is in danger of recession or depression"; tight money "symptoms of strength, not weakness"; "better ways to restrain inflationary pressures" to be found than high interest rates.'
    n: 'Statement by the President in Response to President Truman''s Statement on the Effect of Rising Interest Rates, [1966 Pub. Papers 933](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=307) (Aug. 29, 1966), with Truman''s statement. To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1965-12-05.economy]]; [[cal.1966-07-19.economy]]. Names: Truman, Johnson.'
    tags: [name:truman-harry-s, name:johnson-lyndon-b]
  - id: cal.1966-08-28.opinion
    when: Aug. 28
    date: '1966-08-28'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, July 29–Aug. 3: no strike to last more than seven days, a committee appointed by the Government then to decide: favor 54 percent, oppose 36; union families 46 and 47. Unions covering whole industries brought under the antitrust laws: agree 45, disagree 25. A right to sue the union or the employer for damage suffered in a strike: favor 39, oppose 45.'
    n: '[[w.gallup-poll]], III, 2024–25. See [[cal.1966-07-08.jobs-and-wages]].'
  - id: cal.1966-08-29.vietnam-support
    when: Aug. 29
    date: '1966-08-29'
    thread: vietnam-support
    c: 'Ball to Johnson on Bertrand Russell''s war crimes tribunal: an interagency group under Ball "quietly exploring with the British and French available legal steps"; articles to be stimulated on the "unsavory and leftwing background" of the organizers. The CIA to make dossiers on the tribunal''s members and staff.'
    n: '[[w.gibbons-u-s-government-and]], IV, 432–34. To check: Ball, "Items for Evening Reading," Aug. 29, 1966, and Ball to Johnson, Sept. 16 (State, Lot File 74 D 164); the assignments memorandum, Aug. 25 (State, Central File, Pol 27 Viet S). Names: Ball, Johnson.'
    tags: [name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1966-08-30.transportation
    when: Aug. 30
    date: '1966-08-30'
    thread: transportation
    c: House passes the Department of Transportation bill, H.R. 15963, [336–42](https://voteview.com/rollcall/RH0890318). The Maritime Administration left out, [261–117](https://voteview.com/rollcall/RH0890316); air accident investigation kept in, recommittal lost, [143–238](https://voteview.com/rollcall/RH0890317).
    n: See [[cal.1966-03-02.transportation]].
  - id: cal.1966-08-31.opinion
    when: Aug. 31
    date: '1966-08-31'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup, special survey in Britain: the United States to continue its efforts in South Vietnam, 37 percent; pull out, 40. British troops sent to fight there: approve 8, disapprove 81. The United States to agree to peace talks even at the risk of a Communist South Vietnam: should 72, should not 13. Most important for Britain: to support the Americans 9, to get peace talks going 81.'
    n: '[[w.gallup-poll]], III, 2025.'
  - id: cal.1966-08.governors-wy
    when: Aug.
    date: 1966-08
    thread: governors
    also: [elections-1966]
    c: 'Wyoming''s primary, for governor, Hansen running for the Senate. Republican: Hathaway over Joe Burke, 26,110 to 19,815, 55.2 percent. Democratic: Wilkerson over Bill Nation, 13,145 to 9,834, 31.1 percent; Gage, governor 1961–63, 8,661, 20.5 percent. Check the day.'
    n: 'Votes: [Wikipedia, "1966 Wyoming gubernatorial election"](https://en.wikipedia.org/wiki/1966_Wyoming_gubernatorial_election); Check: *1967 Wyoming Official Directory and 1966 Election Returns*, 72–74. To check: [[w.peirce-mountain-states-of-america]]. Names: Gage, Burke, Wilkerson, Nation, Hathaway, Hansen.'
    tags: [state:wy, name:hathaway-stanley-k, name:burke-joe, name:wilkerson-ernest, name:nation-bill, name:gage-jack-r, name:hansen-clifford-p]
  - id: cal.1966-08.desegregation-public-places-milwaukee
    when: Aug.
    date: 1966-08
    thread: desegregation-public-places
    also: [civil-rights-organizations]
    c: Milwaukee. Groppi and the NAACP Youth Council picket the Fraternal Order of Eagles, which admits only whites, and the homes of judges and officials who belong to it. On and off into 1967.
    n: '[Wikipedia, "James Groppi"](https://en.wikipedia.org/wiki/James_Groppi) (Check: the month the pickets began). To check: [[w.jones-selma-of-the-north]]. Names: Groppi.'
    tags: [state:wi, city:milwaukee, name:groppi-james]
  - id: cal.1966-08-31.transportation-auto-safety
    when: Aug. 31
    date: '1966-08-31'
    thread: transportation-auto-safety
    c: House agrees to the conference reports on the traffic safety bill, S. 3005, [365–0](https://voteview.com/rollcall/RH0890320), and the highway safety bill, S. 3052, [360–3](https://voteview.com/rollcall/RH0890321).
    n: 'Check: the Record''s page. See [[cal.1966-08-17.transportation]].'
  - id: cal.1966-08-31.europe-and-the-alliance
    when: Aug. 31
    date: '1966-08-31'
    thread: europe-and-the-alliance
    also: [congress]
    c: 'Senate. Mansfield and others offer S. Res. 300: with present techniques and logistics, a substantial reduction of American forces in Europe can be made without harm to the commitments to NATO; where it conflicts with S. Res. 99 of Apr. 4, 1951, it controls.'
    n: '[Daily Digest, D473](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=471) (Aug. 31, 1966). [FRUS 1964–68, XIII, doc. 199](https://history.state.gov/historicaldocuments/frus1964-68v13/d199) (MacArthur to Rusk, Sept. 1: Kuchel and Dirksen). [[w.schwartz-lyndon-johnson-and-europe]], 121–22 (twelve cosponsors). Names: Mansfield. Check: the resolution''s page in the Record.'
    tags: [name:mansfield-mike]
  - id: cal.1966-08-31.vietnam
    when: Aug. 31
    date: '1966-08-31'
    thread: vietnam
    c: 'Rostow to Johnson, on Taylor''s warning of Aug. 30 that Westmoreland''s concept of operations would make an "open-ended requirement" for American forces: McNamara wants no review in Washington but a reorganization of pacification in Vietnam, his task for his October trip. Johnson approves, and wants word sent to Westmoreland "so that he will not assume that we have approved."'
    n: 'FRUS 1964–68, IV, docs. [221](https://history.state.gov/historicaldocuments/frus1964-68v04/d221) (Taylor), [223](https://history.state.gov/historicaldocuments/frus1964-68v04/d223) (Rostow). [[w.gibbons-u-s-government-and]], IV, 405–06. Names: Rostow, Johnson, Taylor, Westmoreland, McNamara.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:taylor-maxwell, name:westmoreland-william, name:mcnamara-robert-s]
