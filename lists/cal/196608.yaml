    n: '[FRUS 1964–68, IV, doc. 202](https://history.state.gov/historicaldocuments/frus1964-68v04/d202). [[w.gibbons-u-s-government-and]], IV, 396. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-08-02.vietnam]]. Names: Rusk, Lodge, Unger.'
