        - 'w.bird-color-of-truth 378: ?'
        - 'via w.bird-color-of-truth 378 n.11: all'
    tags: [name:bundy-mcgeorge, name:friendly-fred-w]
  - id: cal.1966-08-02.elections-1966
    when: Aug. 2
    date: '1966-08-02'
    thread: elections-1966
    c: 'Michigan, Democratic Senate primary: Williams, governor 1949–61, lately Assistant Secretary of State for African Affairs, defeats Cavanagh, mayor of Detroit, 437,438 to 290,465, 60.1 percent. Griffin, appointed in May to Patrick McNamara''s seat, the Republican.'
    n: 'Votes: Wikipedia, from Our Campaigns (Check: *Michigan Manual 1967–1968*, pp. 409–412). To check: [[w.noer-soapy]]. Names: Cavanagh, Griffin, Williams, Patrick McNamara.'
    tags: [name:williams-g-mennen, name:cavanagh-jerome-p, name:griffin-robert-p, name:mcnamara-patrick-v, state:mi]
  - id: cal.1966-08-02.vietnam
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    c: 'Harriman, charged by Johnson in July with the search for a settlement, holds the first of the weekly meetings of his "Negotiations Committee," with U. Alexis Johnson, Thompson, and Unger: secret talks between Saigon and the NLF to be explored, with an amnesty; more intelligence on the Front''s leaders. The same day Kissinger, back from Vietnam, tells Harriman the Viet Cong''s political organization is untouched and pacification has made little progress.'
    n: 'FRUS 1964–68, IV, docs. [196](https://history.state.gov/historicaldocuments/frus1964-68v04/d196), [197](https://history.state.gov/historicaldocuments/frus1964-68v04/d197). [[w.gibbons-u-s-government-and]], IV, 384–85, 388–89, 396 (Kissinger, 384–85, 396; the committee, 396, but the amnesty); [[w.herring-lbj-and-vietnam]], 102–03 (Harriman "ambassador for peace," nothing in writing; his Negotiations Committee, weekly; his weekly memorandum to Rusk and Johnson). Gibbons dates Harriman''s appointment to the search for a settlement May 1966 (IV, 388); FRUS''s editors, July (doc. 197 n. 1). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]; memorandum of a meeting, Aug. 11, 1966; Harriman to Rusk and Johnson, Aug. 18, 1966; Harriman''s notes of a meeting with Fulbright, Aug. 24, 1966; memorandum, Sept. 30, 1966, Harriman Papers, Library of Congress (cited by [[w.herring-lbj-and-vietnam]], 103 n.42). Names: Harriman, Thompson, Unger, U. Alexis Johnson, Kissinger, Johnson. Check: Herring dates the appointment August 1966 (102).'
    src:
      c: d3c7566b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d196: all'
        - 'w.gibbons-u-s-government-and IV, 396: A'
        - 'w.gibbons-u-s-government-and IV, 384–85: C'
        - 'via w.gibbons-u-s-government-and IV, 396 n.37: A'
        - 'via w.gibbons-u-s-government-and IV, 396 n.36: C'
        - 'w.herring-lbj-and-vietnam 102–03: A'
        - 'via w.herring-lbj-and-vietnam 103 n.42a: A'
        - 'via w.herring-lbj-and-vietnam 103 n.42b: A'
        - 'via w.herring-lbj-and-vietnam 103 n.42c: A'
        - 'via w.herring-lbj-and-vietnam 103 n.42d: A'
    tags: [name:harriman-w-averell, name:johnson-u-alexis, name:thompson-llewellyn-e, name:unger-leonard, name:kissinger-henry-a, name:johnson-lyndon-b]
  - id: cal.1966-08-02.governors-id
    when: Aug. 2
    date: '1966-08-02'
    thread: governors
    also: [elections-1966]
    c: 'Idaho''s primary. Republican, for governor: Samuelson, a State senator, over Smylie, governor since 1955, 52,891 to 33,753, 61.0 percent. Democratic: Herndon over Andrus, 28,926 to 27,649, 40.8 percent; Dee 14,409, 20.3 percent.'
    n: 'Votes: [Wikipedia, "1966 Idaho gubernatorial election"](https://en.wikipedia.org/wiki/1966_Idaho_gubernatorial_election), from CQ''s *Guide to U.S. Elections*; Check: Idaho''s abstract of votes. To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1962-06-05.governors-id]]. Names: Samuelson, Smylie, Herndon, Andrus, Dee.'
    tags: [state:id, name:samuelson-don, name:smylie-robert-e, name:herndon-charles, name:andrus-cecil-d, name:dee-william-j]
  - id: cal.1966-08-02.governors-ks
    when: Aug. 2
    date: '1966-08-02'
    thread: governors
    also: [elections-1966]
    c: 'Kansas, governor. Democratic primary: Robert Docking, the late governor''s son, over one other, 96,414 to 16,385, 85.5 percent. Republican: Governor Avery over one other, 144,842 to 48,051, 75.1 percent.'
    n: 'Votes: Kan. Secretary of State, [*Election Statistics, 1966*, 21–22](https://kgi.contentdm.oclc.org/digital/api/collection/p16884coll129/id/60/download#page=20): Docking 96,414, Hart 16,385; Avery 144,842, Crozier 48,051. To check: [[w.socolofsky-kansas-governors]]. Names: Robert Docking, Avery.'
    tags: [state:ks, name:docking-robert, name:avery-william-h]
  - id: cal.1966-08-02.middle-east-iran-arms
    when: Aug. 2
    date: '1966-08-02'
    thread: middle-east-iran-arms
    c: 'Johnson sends Hoopes to Tehran: deliveries sped, the research and development costs taken off the Hawks.'
    n: '[FRUS 1964–68, XXII, doc. 168](https://history.state.gov/historicaldocuments/frus1964-68v22/d168). See [[cal.1966-06-29.middle-east]]. Names: Johnson, Hoopes.'
    tags: [name:johnson-lyndon-b, name:hoopes-townsend-w]
  - id: cal.1966-08-02.vietnam-2
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    also: [china]
    c: 'Rostow to Johnson on intelligence of July 29 and Aug. 2 that Chinese ground forces may have entered North Vietnam: not conclusive, no cause for alarm; he has asked Clifford, chairman of the Foreign Intelligence Advisory Board, "quietly" to see whether the agencies are doing their utmost to find out.'
    n: '[[w.gibbons-u-s-government-and]], IV, 379. To check: Rostow to Johnson, Aug. 2, 1966, with intelligence reports of July 29 and Aug. 2, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 379 n.85). Names: Rostow, Johnson, Clifford.'
    src:
      c: 9d48dc06
      rows:
        - 'w.gibbons-u-s-government-and IV, 379: all'
        - 'via w.gibbons-u-s-government-and IV, 379 n.85: all'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:clifford-clark]
  - id: cal.1966-08-02.vietnam-3
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    c: 'Tuesday lunch, Rusk, McNamara, Rostow, Moyers, 1:24 to 3:30 p.m. Johnson: State to follow up Lodge''s report of his talk with Nguyễn Đình Thuần on contacts with the Viet Cong; the Saigon government to "see what contacts can be made covertly with VC"; Kỳ, "instead of sounding off about going to North," to launch a peace campaign.'
    n: '[[w.gibbons-u-s-government-and]], IV, 395–96. Read''s account, by Rostow''s notes of their call. To check: Rostow, "Notes on a telephone conversation [with Read] on August 2, 1966 re Lunch meeting with President", Files of Walt W. Rostow, Meetings with the President, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 396 n.35). See [[cal.1966-07-30.vietnam-3]]. Names: Rusk, McNamara, Rostow, Moyers, Johnson, Lodge, Nguyễn Cao Kỳ.'
    src:
      c: 3dd93542
      rows:
