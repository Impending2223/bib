  - id: cal.1966-08.china-leadership-34
    when: Aug., after the 7th
    date: 1966-08
    at: after 1966-08-07
    thread: china-leadership
    c: 'One night during the plenum Zhou Enlai 周恩來 calls many of the army''s delegates and reads them Mao''s poster, and reads it a second time because they may not have heard. He says: Liu Shaoqi 劉少奇 will not do, he has failed the Chairman; Lin Biao 林彪 has supported the Chairman for ten years, and the Chairman has called on the whole country to learn from the army; nothing of the meeting is to go out. Qiu Huizuo 邱會作, who goes with Yang Chengwu 楊成武, and Wu Faxian 吳法憲 both give it, Wu in words that the Center decides to bring Lin to Peking to take Liu''s place.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 223–224. Made public: 2008. To check: *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xinshiji chubanshe 新世紀出版社, Hong Kong, 2011), 446 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 223 n.13); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008, 3rd ed.), 596 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 223 n.14). Names: Zhou Enlai, Liu Shaoqi, Lin Biao, Qiu Huizuo, Wu Faxian, Mao Zedong.'
    src:
      c: 49f6b811
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 223–224: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 223 n.13: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 223 n.14: all'
    tags: [polity:prc, vis:only:prc, name:zhou-enlai, name:liu-shaoqi, name:lin-biao, name:qiu-huizuo, name:wu-faxian, name:mao-zedong, ok:fields-place]
  - id: cal.1966-08.china-leadership-35
