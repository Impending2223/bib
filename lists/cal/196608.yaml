    also: [soviet-union]
    c: 'Zhou Enlai, told that Red Guards of a Peking middle school will rename Yangwei Road, before the Soviet embassy, "Anti-Revisionist Road" and hold a naming meeting on the spot, calls an emergency meeting at 2 a.m. and talks them round: the renaming is allowed, but no anti-revisionist wall posters on the embassy or its wall, and no cursing at it. After the meeting he has Fu Chongbi send a battalion of the garrison, unarmed, to the spot to prevent the embassy being stormed, and tells the duty secretary to report at once any emergency.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 51–52 (Aug. 29, 1966); [[w.macfarquhar-maos-last-revolution]], 115 (Zhou allows the road to be renamed Anti-Revisionism Street as the Red Guards ask, warns them against attacking the embassy or posting big-character posters on its walls, and sends extra garrison troops to enforce his orders at the renaming ceremony, which foreign journalists specially invited estimate close to 100,000 Red Guards attended). Made public: 2006. Check: the book''s note 65 cites the Zhou chronology as "2: 53"; its 1966 is vol. III (see the book''s 118 n.10, "3: 53–54"). MacFarquhar (115) dates neither the renaming nor the ceremony. To check: [[w.zhou-enlai-nianpu-1949]], III, 53 (cited by [[w.macfarquhar-maos-last-revolution]], 115 n.65); Cankao xiaoxi (Reference News), Aug. 31, 1966 (cited by [[w.macfarquhar-maos-last-revolution]], 115 n.66). Names: Zhou Enlai, Fu Chongbi.'
