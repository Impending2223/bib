've seen in Chicago" (396). To check: *Chicago Tribune*, Aug. 1, 1966, at 1; *New York Times*, [Aug. 1 at 1](https://timesmachine.nytimes.com/timesmachine/1966/08/01/issue.html) and [Aug. 2, 1966, at 12](https://timesmachine.nytimes.com/timesmachine/1966/08/02/issue.html) (cited by [[w.garrow-bearing-the-cross]], 499 n.27); *Chicago Tribune*, Aug. 6, 1966, at 1; [*New York Times*, Aug. 6, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/06/issue.html), at 1; *Chicago Daily News*, Aug. 6, 1966, at 1 (cited by [[w.garrow-bearing-the-cross]], 500 n.28); Oates, *Let the Trumpet Sound* (1982), 414 (cited by [[w.branch-at-canaans-edge]], 509); Citizen King, a Roja Production for The American Experience, PBS, 2004 (cited by [[w.branch-at-canaans-edge]], 510); Blackstone Productions, Inc., Eyes on the Prize II, America at the Racial Crossroads—1965 to 1985, Vol. 2, "Two Societies (1965—68)." (cited by [[w.branch-at-canaans-edge]], 510); Gene Roberts, "Rock Hits Dr. King as Whites Attack March in Chicago," [*New York Times*, Aug. 6, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/06/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 510); Investigator''s report dated Aug. 8, 1966, for Aug. 5 incident, File 940, RS, CHS (cited by [[w.branch-at-canaans-edge]], 510); [*New York Times*, Aug. 6, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/06/issue.html), at 52 (cited by [[w.branch-at-canaans-edge]], 511); Investigators'' reports dated Aug. 5 and 9, 1966, for Aug. 5 incident, File 940, RS, CHS (cited by [[w.branch-at-canaans-edge]], 511); *Jet*, Aug. 25, 1966, at 14–23 (cited by [[w.branch-at-canaans-edge]], 511); [*New York Times*, Aug. 7, 1966](https://timesmachine.nytimes.com/timesmachine/1966/08/07/issue.html), at 47 (cited by [[w.branch-at-canaans-edge]], 511); Rabbi Robert Marx letter, Aug. 5, 1966, CCCO papers, box 3–14, MLK Library (cited by [[w.ralph-northern-protest]], 123 n.90); *Baltimore Sun*, Aug. 6, 1966, at 1, 5 (cited 