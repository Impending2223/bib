    when: Aug. 1
    date: '1966-08-01'
    thread: press-and-broadcasting
    c: 'McGeorge Bundy, president of the Ford Foundation, proposes a satellite system to support noncommercial television, worked out with Fred Friendly: the first public broadcasting network in view.'
    n: '[[w.branch-at-canaans-edge]], 565–66; [[w.bird-color-of-truth]], 378 (the plan before the Federal Communications Commission, Aug. 1, 1966; Friendly''s part). Check: the day. To check: [[w.friendly-due-to-circumstances-beyond]], 302, 308–25 (cited by [[w.branch-at-canaans-edge]], 566); Kabaservice, *The Guardians* (2004), 276–77 (cited by [[w.branch-at-canaans-edge]], 566); [[w.dallek-flawed-giant]], 296 (cited by [[w.branch-at-canaans-edge]], 566). Names: McGeorge Bundy, Friendly.'
    src:
