  - id: cal.1966-08-31.china-leadership-3
    when: Aug. 31
    date: '1966-08-31'
    thread: china-leadership
    c: 'Zhou Enlai reviews the draft Center and State Council notice on specific problems in the Cultural Revolution, written by Tao Zhu''s staff on his instruction: key and secret organs and units, from the armed forces and public security to Xinhua, the radio, archives, airfields, ports and banks, to be firmly protected. He adds the *Renmin ribao*, *Jiefangjun bao* and *Hongqi* and sends it to Mao, Lin Biao and others; Jiang Qing proposes the Standing Committee discuss it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 53 (Aug. 31, 1966). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong, Lin Biao, Jiang Qing.'
