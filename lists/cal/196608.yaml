    date: 1966-08
    at: after 1966-08-06
    thread: china-leadership
    c: Delegates ask Tao Zhu 陶鑄 why he has risen to fourth in the Standing Committee's order; he says he too was taken aback by the list. He asks Mao at once to move him down; Mao answers that the list is fixed and will not be changed.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 225. Made public: 1999. To check: Ma Encheng 馬恩成, 〈陶鑄在1966〉, *Bainian chao* 《百年潮》 1999 no. 11 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 225 n.22). See [[cal.1966-08-06.china-leadership]]. Names: Tao Zhu, Mao Zedong.'
