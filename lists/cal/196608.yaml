  - id: cal.1966-08-09.open-housing
    when: Aug. 9
    date: '1966-08-09'
    place: washington
    thread: open-housing
    c: 'House passes the civil rights bill, H.R. 14765, [259–157](https://voteview.com/rollcall/RH0890293). Title IV, fair housing, kept: recommittal to strike it lost, [190–222](https://voteview.com/rollcall/RH0890292); a broker may follow an exempt owner''s written instruction to discriminate, [237–176](https://voteview.com/rollcall/RH0890289). Added: a federal crime to travel or use the mails to incite a riot, [389–25](https://voteview.com/rollcall/RH0890290); suits to desegregate schools only on a written complaint, [214–201](https://voteview.com/rollcall/RH0890291). The rule taken July 25, [200–180](https://voteview.com/rollcall/RH0890288). Aug. 10, Johnson: the House "has barred bigotry in all new housing and in apartment houses"; the provision "not as comprehensive as that we proposed and sought."'
    n: '[112 Cong. Rec. 18,739](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt14/pdf/GPO-CRECB-1966-pt14-5-2.pdf#page=40) (1966) (House, Aug. 9: passage, yeas 259, nays 157). Statement by the President Following House Approval of the Civil Rights Bill, [1966 Pub. Papers 814](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=188) (Aug. 10, 1966). [[w.zelizer-fierce-urgency-of-now]], 245 (259–157; Democrats 183, Republicans 76; the Moore amendment beaten 222–190); [[w.kotz-judgment-days]], 368; [[w.bernstein-guns-or-butter]], 391–92 (259 to 157; the "Mrs. Murphy" exemption); [[w.ralph-northern-protest]], 177, 192 (the House passes the bill Aug. 9, 259–157); [[w.mann-walls-of-jericho]], 481 (the bill passes the House); [[w.dallek-flawed-giant]], 326 (the House approves the bill on Aug. 9 with limits on what constituted housing discrimination; the President''s statement praises the action and puts the best face on the fair housing provision; not the vote or the bill''s number). The House sat from noon to 7:57 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1), [D417](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=415). Check: Zelizer, 245, dates the passage Aug. 13. See [[cal.1966-04-28.open-housing]]. Names: Johnson.'
