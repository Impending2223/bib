  - id: cal.1966-08-04.china-leadership-5
    when: Aug. 4
    date: '1966-08-04'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi speaks at the discussion of the Central-South group of the Eleventh Plenum. During the stretch the Chairman was away, he presided over the work and will not evade responsibility; the central question is standing on the bourgeois standpoint and opposing the mass movement. When the movement surged, the comrades of the Standing Committee and the Secretariat, those of the Peking committee too, agreed to and approved the sending of work groups. In this cultural revolution the masses rise to be masters and the Chairman backs them so strongly that those in between are squeezed from above and pressed from below: does one back the masses? To revolutionize others'' lives is allowed, but not ours? The resolve to revolutionize one''s own life is to be made; at worst it is stepping down, and people like us can step down; if they do not let others be revolutionized, they will have to step down.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648 (Aug. 4, 1966); [[w.deng-xiaoping-nianpu-1904]], III, 1928 (Aug. 4, 1966; afternoon, 下午; Deng with Liu Shaoqi at the Central-South group of the Eleventh Plenum, Tao Zhu presiding and conveying Mao''s repeated instructions; Deng makes a self-criticism in his speech); [[w.yang-jisheng-tiandi-fanfu]], I, 221 (that afternoon Liu speaks in the Central-South group and withdraws his note on Bulletin no. 9 of Peking University on the June 18 incident but still holds to catching rightists: "now the rightists make trouble and seize the leadership, do not be afraid, let them lead for a time and it will be clear, and then counter-revolutionaries can be caught"). Made public: 1996. To check: Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese University Press, Hong Kong, 2008), 191–192 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 221 n.9). Names: Liu Shaoqi, Mao Zedong.'
    tags: [polity:prc, name:liu-shaoqi, name:mao-zedong, vis:only:prc]
    time_range:
      - 1966-08-04T04:00Z
      - 1966-08-04T10:00Z
