  - id: cal.1966-08.vietnam-hanoi
    when: Aug.
    date: 1966-08
    thread: vietnam-hanoi
    also: [vietnam]
    c: The Central Office and the Military Party Committee call the second conference on political work in the South's liberation armed forces.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 224. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-08.vietnam-hanoi-2
    when: Aug.
    date: 1966-08
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: The Western Highlands Front's command, for want of supplies to keep divisions massed and on the needs of the field, dissolves the 325B Division. The Front's mobile main force is left the 1st Division (Regiments 66, 320 and 88) and the independent Regiment 101, four artillery and mortar battalions and antiaircraft machine guns; Regiment 24 goes to Kon Tum, Regiment 95B to Gia Lai and Regiment 33 to Đắk Lắk as local main force.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 220. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-08.vietnam-hanoi-3
    when: Aug.
    date: 1966-08
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Region 5's command puts Regiment 31, just in from the North, into the 2d Division to strengthen it; Regiment 20 goes into Khánh Hòa and with Regiment 10 in Phú Yên forms the Region's main force in the Southern Sub-region; the Region builds up the 368B Artillery Regiment (120 mm mortars, rockets, A12).
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 221. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
