  - id: cal.1966-08-12.china-leadership
    when: Aug. 12
    date: '1966-08-12'
    place: peking
    thread: china-leadership
    c: 'The plenum''s last session, Mao present. It adds to the Politburo Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying; as alternates Li Xuefeng, Song Renqiong and Xie Fuzhi; and enlarges the Standing Committee from seven to eleven: Mao, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun (new: Tao, Chen Boda, Kang, Li Fuchun). It elects no chairman or vice-chairmen; Liu''s, Zhou''s, Zhu''s and Chen Yun''s vice-chairmanships are no longer mentioned, Lin''s alone is. It confirms the May removals from the Secretariat and Tao Zhu''s and Ye Jianying''s appointments, and adds Xie Fuzhi and Liu Ningyi as secretaries. Mao, closing: the Ninth Congress, eight years after the second session of the Eighth, to meet next year at a suitable time, the Politburo and its Standing Committee to prepare it; whether the Decision is right, practice will say; some will not carry it out, and the new Politburo and Standing Committee are a guarantee; the erring to be given a way out and allowed to mend.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 12, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 47–48 (Aug. 12, 1966; Zhou at the closing session under Lin Biao: the Standing Committee enlarged from seven to eleven, the order as given, the Vice-Chairmen other than Lin no longer mentioned; Zhou speaks on the personnel changes and on farm mechanization); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 12, 1966; on Mao''s proposal the plenum reorganizes the central leadership and re-elects the Politburo Standing Committee; Liu falls from second place to eighth and Lin Biao, second, becomes Mao''s successor; the plenum elects no vice-chairmen but Lin alone goes on being called vice-chairman, and Liu''s vice-chairmanship is no longer mentioned); [[w.macfarquhar-maos-last-revolution]], 94 (the afternoon of Aug. 12, a session added late to the agenda, Lin Biao presiding: the election by secret ballot of a new eleven-member Standing Committee, only the 74 full members voting; all vote for Mao, Lin Biao, Deng Xiaoping and Kang Sheng, all but one for Zhou Enlai, Chen Boda and Tao Zhu; Li Fuchun 70, Zhu De 68, Liu Shaoqi 65, Chen Yun 58; Li Xiannian, not on the ballot, 1; Mao''s order, decided with Lin Biao, Zhou Enlai and Jiang Qing, prevails over the vote''s; the vice-chairman''s title no longer used of Liu, Zhou, Zhu or Chen Yun, Lin Biao the only vice chairman); [[w.jianguo-yilai-mao-zedong]], XVIII, 313–315 (Aug. 12, 1966; Mao''s closing speech, printed from a Central Committee document (his revised copy held): a party outside the Party and factions inside it, always so; without this plenum things would have gone much worse in a few months; note 3: Liu Shaoqi from second to eighth in the Standing Committee); [[w.macfarquhar-origins-of-the-cultural]], III, 462–64 (the new Politburo and Standing Committee: Lin Biao second, Liu Shaoqi eighth, Deng Xiaoping one place higher; Peng Zhen and Lu Dingyi out); [[w.macfarquhar-maos-last-revolution]], 286 (Mao tells the Central Committee in August 1966 that the Ninth Congress should probably be held "some time next year"); [[w.deng-xiaoping-nianpu-1904]], III, 1930 (Aug. 12, 1966; Deng at the closing session of the Eleventh Plenum Lin Biao presides over; on Mao''s view the Central leadership is reorganized: the order of the Politburo Standing Committee becomes Mao Zedong, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun and Chen Yun; no new election of chairman and vice-chairmen, but except Lin Biao the vice-chairman posts of Liu, Zhou, Zhu and Chen Yun are no longer mentioned, Lin in fact becoming Mao''s ''successor''; Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying are added to the Politburo, Li Xuefeng, Song Renqiong and Xie Fuzhi as alternates; the Secretariat is reorganized, Peng Zhen, Luo Ruiqing and Lu Dingyi removed as secretaries and Yang Shangkun as alternate, Xie Fuzhi and Liu Ningyi elected; Mao in his closing speech: comrades who err are to be given a way out, allowed to correct errors, the policy being ''learn from past mistakes to avoid future ones, cure the sickness to save the patient''; after the meeting the Secretariat that had handled the Center''s daily business since the Eighth Congress of 1956 in the main stops work; in late August, with Mao''s agreement, a system of ''head-bumping'' (碰头会) meetings of the Standing Committee (enlarged) with all members of the Cultural Revolution Group is set up, generally under Zhou Enlai); [[w.mao-zedong-zhuan]], VI, ch. 74 n.61 (Aug. 12 the Plenum closes; on its last day it elects six more members and three alternates of the Politburo and a Standing Committee enlarged to eleven, in the order Mao Zedong, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun, Lin Biao second and Liu eighth; no vice-chairmen are re-elected, and thereafter only Lin is called vice-chairman, not Liu, Zhou, Zhu or Chen Yun; two more secretaries of the Secretariat are elected; Mao''s closing speech: the Ninth Congress to be got ready, ''perhaps next year at a suitable time''; whether the Plenum''s decisions are right will be seen in practice, and they are to be carried out by those present and absent; the reshuffle of the Politburo, its Standing Committee, the Secretariat guarantees it; the erring to be given a way out; there are parties outside the Party and cliques inside it; had the plenum not been held, matters would have been much worse; n.61). [[w.yang-jisheng-tiandi-fanfu]], I, 225–226 (Aug. 12, the last day; in the afternoon Lin Biao presides over the session; the elections: Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian 徐向前, Nie Rongzhen and Ye Jianying added to the Politburo; the eleven candidates for the Standing Committee all elected; full votes for Mao, Lin, Deng and Kang Sheng, one short for Zhou, Tao Zhu and Chen Boda, the others over half; Liu from second place to eighth, Lin from sixth to second; no new chairman or vice-chairmen elected, and after the plenum Liu, Zhou, Zhu and Chen Yun are no longer named vice-chairmen in documents, Lin alone being called vice-chairman of the Central Committee). Made public: 1996. To check: Wang Nianyi, interview by Michael Schoenhals, Beijing, Jan. 20, 1993 (cited by [[w.macfarquhar-maos-last-revolution]], 94 n.35); [[w.zhou-enlai-nianpu-1949]], III, 46 (cited by [[w.macfarquhar-maos-last-revolution]], 94 n.36); [[w.zhonggong-ba-da-shi]], 137 (cited by [[w.macfarquhar-maos-last-revolution]], 94 n.37); [[w.li-wang-li-fansi-lu]], II, 617 (cited by [[w.macfarquhar-maos-last-revolution]], 94 n.38); [[w.yonglie-chen-boda-qiren]], 263–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 462 n.table); [[w.xin-zhongguo-yaoshi-shuping]], 319 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 464 n.9a); Mao Zedong 毛泽东, speech at the closing session of the Eleventh Plenum of the Eighth Central Committee 中共八届十一中全会闭幕会 (record 讲话记录), Aug. 12, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.61); Wang Nianyi 王年一, 〈漫談文革〉, *Ershiyi shiji* 《二十一世紀》, Oct. 2006 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 226 n.23). Names: Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Li Xuefeng, Song Renqiong, Xie Fuzhi, Mao Zedong, Lin Biao, Zhou Enlai, Deng Xiaoping, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun, Liu Ningyi.'
