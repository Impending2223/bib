        - 'via w.gibbons-u-s-government-and IV, 357 n.9: all'
    tags: [name:mcpherson-harry, name:moyers-bill, name:johnson-lyndon-b]
  - id: cal.1966-08-04.vietnam
    when: Aug. 4
    date: '1966-08-04'
    thread: vietnam
    also: [china]
    c: 'SNIE 13-66, "Current Chinese Communist Intentions in the Vietnam Situation": no change in China''s basic policy from the oil strikes; more manpower for logistics and engineering, perhaps infantry for the first time against an invasion; Peking "would almost certainly intervene if North Vietnam were invaded or if the collapse of the Communist regime seemed likely." Some 25,000 to 40,000 Chinese military personnel in the North.'
    n: '[FRUS 1964–68, IV, doc. 201](https://history.state.gov/historicaldocuments/frus1964-68v04/d201) (the conclusions). [[w.gibbons-u-s-government-and]], IV, 379. Made public: FRUS 1964–68, IV (1998).'
