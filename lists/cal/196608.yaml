    thread: china-leadership
    also: [china]
    c: The West City Pickets, an elite Red Guard organization of cadres' children enforcing the repatriation, are funded through the State Council's Department of Administrative Affairs and have the free use of office space, two government trucks, two jeeps, one motorcycle and many bicycles and bullhorns.
    n: '[[w.macfarquhar-maos-last-revolution]], 122. Made public: 1967. To check: [[w.wuchanjieji-wenhua-dageming-cankao-1967]], III, 7 (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.25a); [[w.zhonghua-renmin-gongheguo-zuzhi]], 204–205 (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.25b); [[w.wuchanjieji-wenhua-dageming-cankao-1967]], III, 7 (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.26a); [[w.zalan-liandong]], 31–33 (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.26b). The No. 4 Middle School''s order of Aug. 24: [[cal.1966-08-24.china-leadership-4]]. Check: the days; the book gives no date for the arrangements; the unit is the Department''s funding, the support of the State Council General Secretariat and the municipal authorities being the book''s (122).'
