    c: 'Mao reads Zhang Shizhao''s letter of that morning: his house was searched the night before; to the Premier to deal with; Zhang to be protected. Zhou Enlai orders the goods returned, two soldiers posted and Zhang moved secretly to Hospital 301, and writes out a list of leaders and democratic figures to be protected: Soong Ching Ling, Guo Moruo, Zhang Shizhao, Cheng Qian, He Xiangning, Fu Zuoyi, Zhang Zhizhong, Cai Tingkai, Shao Lizi, Li Zongren and others. Mao answers Zhang Sept. 1.'
