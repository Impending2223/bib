  - id: cal.1966-08-08.china-leadership-2
    when: Aug. 8
    date: '1966-08-08'
    thread: china-leadership
    c: 'Zhou Enlai presides over the plenary session of the Eleventh Plenum. It adopts the Decision on the Great Proletarian Cultural Revolution, the Sixteen Points. In the discussion Zhou, after consulting Tao Zhu, strikes out "black gang" and "black line" and adds limits: sharply separate the two kinds of contradiction, treat cadres by case, unite over 95 percent of cadres and masses, do not set the movement against production, argument not force, protect scientists and technicians; these were taken in.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 46 (Aug. 8, 1966); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 649 (Aug. 8, 1966; the plenum adopts the Decision of the Central Committee on the Great Proletarian Cultural Revolution (the Sixteen Points)); [[w.macfarquhar-maos-last-revolution]], 92–93 (the text adopted is the thirty-first draft produced by the Cultural Revolution Group, at work on it since at least June; Mao to Chen Boda: "Excellent revisions; please print and distribute"); [[w.deng-xiaoping-nianpu-1904]], III, 1929 (Aug. 8, 1966; morning, 上午; Deng at the plenary session of the Eleventh Plenum Zhou Enlai presides over, which adopts the Decision of the Central Committee on the great proletarian cultural revolution (the ''Sixteen Points'' 十六条), drafted on Mao''s view; its aim is to overthrow those in power taking the capitalist road, criticize bourgeois reactionary academic ''authorities'' and the ideology of the bourgeoisie and all exploiting classes; its emphasis is to set in order those in the Party in power taking the capitalist road); [[w.mao-zedong-zhuan]], VI, ch. 74 (Aug. 8 the plenum adopts the Decision on the Great Proletarian Cultural Revolution 《关于无产阶级文化大革命的决定》, the Sixteen Points: the movement''s aim to bring down those in power in the Party taking the capitalist road, to criticize the reactionary academic ''authorities'' and bourgeois ideology; dare, trust the masses, ''no fear of disorder''; struggle by argument, not force; the key points the cities'' cultural and educational units and the leading Party and government organs; ''grasp revolution, promote production''). Made public: 1996. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 81 (cited by [[w.macfarquhar-maos-last-revolution]], 92 n.26). See [[cal.1966-08-01.china-leadership]]. Names: Zhou Enlai, Tao Zhu.'
