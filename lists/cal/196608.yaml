  - id: cal.1966-08-03.vietnam-operations
    when: Aug. 3
    date: '1966-08-03'
    thread: vietnam-operations
    c: 'Hastings ends, one battalion left in its area. Some 8,000 Marines and 3,000 South Vietnamese engaged against elements of all three regiments of the 324B Division. Marines: 126 killed, 448 wounded; South Vietnamese: 21 killed, 40 wounded. Reported: over 700 of the enemy killed, 17 captured.'
    n: '[[w.shulimson-u-s-marines-in-1982]], 175–176. See [[cal.1966-07-15.vietnam-operations]].'
    tags: [place:operation-hastings]
  - id: cal.1966-08-03.vietnam-force-levels
    when: Aug. 3
    date: '1966-08-03'
    thread: vietnam-force-levels
    c: 'Emrick, CINCPAC''s chief of staff, to Westmoreland: resistance in Washington to the forces for 1967; the Joint Chiefs "loathe to recommend approval of these requirements without additional rationale."'
    n: '[[w.gibbons-u-s-government-and]], IV, 403–04. To check: Emrick to Westmoreland, 032207Z Aug. 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 404 n.68). See [[cal.1966-06-18.vietnam-force-levels]]. Names: Westmoreland.'
    src:
      c: 591ca00a
      rows:
        - 'w.gibbons-u-s-government-and IV, 403–04: all'
        - 'via w.gibbons-u-s-government-and IV, 404 n.68: all'
    tags: [name:westmoreland-william]
  - id: cal.1966-08-04.jobs-and-wages
    when: Aug. 4
    date: '1966-08-04'
    thread: jobs-and-wages-airlines
    c: Senate passes S.J. Res. 186, on the airline strike, [54–33](https://voteview.com/rollcall/RS0890383); the day before, an amendment for compulsory arbitration if the 180 days the resolution allows for negotiation run out refused, [6–81](https://voteview.com/rollcall/RS0890380).
    n: 'Check: the Record''s pages. See [[cal.1966-07-08.jobs-and-wages]].'
  - id: cal.1966-08-04.steel
    when: Aug. 4
    date: '1966-08-04'
    thread: steel
    also: [economy]
    c: 'Inland Steel raises prices on major products; four more companies follow. Ackley had wired twelve producers to act only after talking with the Government. His statement: the companies'' action "can only be characterized as irresponsible."'
    n: 'Ackley''s statement, as printed with The President''s News Conference, [1966 Pub. Papers 804](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=178) (Aug. 9, 1966). To check: [[w.sheahan-wage-price-guideposts]]; [[w.exhortation-and-controls]]. See [[cal.1965-12-31.steel]]. Names: Ackley.'
    tags: [name:ackley-gardner]
  - id: cal.1966-08-04.india-and-china
    when: Aug. 4
    date: '1966-08-04'
    thread: indonesia
    c: 'NSC on Indonesia. Johnson recalls the Council''s decision of a year before to cut off most aid. Rusk: the reversal of Indonesia''s course "abrupt"; its debts to be rescheduled.'
    n: '[FRUS 1964–68, XXVI, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v26/d217). To check: [[w.simpson-economists-with-guns]]. See [[cal.1966-03-11.india-and-china]]. Names: Rusk, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1966-08-04.elections-1966
    when: Aug. 4
    date: '1966-08-04'
    thread: elections-1966
    c: 'Tennessee, Democratic Senate primary: Clement, the governor, defeats Bass, 384,322 to 366,079, 51.2 percent; Bass had won the last two years of Kefauver''s term in 1964. Howard H. Baker Jr. the Republican nominee, 112,617 to 36,043, 75.7 percent.'
    n: 'Votes: CQ Guide 6th (2010) 1540. To check: [[w.greene-lead-me-on]]. Names: Kefauver, Bass, Baker, Clement.'
    tags: [name:bass-ross, name:baker-howard-h-jr, name:kefauver-estes, name:clement-frank-g]
  - id: cal.1966-08-04.governors-tn
    when: Aug. 4
    date: '1966-08-04'
    thread: governors
    also: [elections-1966]
    c: 'Tennessee, Democratic primary for governor: Ellington, governor 1959–63, over John Jay Hooker, a Nashville lawyer, 413,950 to 360,105, 53.5 percent. No Republican nominee.'
    n: 'Votes: Wikipedia, ["1966 Tennessee gubernatorial election"](https://en.wikipedia.org/wiki/1966_Tennessee_gubernatorial_election), from CQ''s *Guide to U.S. Elections*. Check: Tenn. *Blue Book*. Clement and Bass the same day: [[cal.1966-08-04.elections-1966]]. To check: [[w.greene-lead-me-on]]. Names: Hooker, Ellington.'
    tags: [state:tn, name:ellington-buford, name:hooker-john-jay]
  - id: cal.1966-08-04.vietnam-support
    when: Aug. 4
    date: '1966-08-04'
    thread: vietnam-support
    c: 'McPherson to Moyers, after a vacation in Rhode Island among Republicans of means: "Nobody was affirmative about Vietnam. It is an extremely unpopular war"; all wanted peaceful overtures, "for cooperation with the Russians, chiefly"; the internationalist middle class''s support "vital, and we don''t have much of it right now."'
    n: '[[w.gibbons-u-s-government-and]], IV, 357 n.9. Moyers sent a summary to Johnson the same day. Names: McPherson, Moyers, Johnson.'
    src:
      c: 2e24026e
      rows:
