    also: [china]
    c: Red Guards, or people claiming to be, loot the homes of 33,695 families in Peking in August and September; in a little over a month they confiscate 103,000 liang of gold (about 5.7 tons), 345,200 liang of silver, 55,459,900 yuan in cash and 613,600 antique or jade pieces.
