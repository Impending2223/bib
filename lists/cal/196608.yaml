    n: '[[w.branch-at-canaans-edge]], 512–13. To check: WLBT news film, August 3—4, 1966, Tapes 3225—36/F2274, MDAH (cited by [[w.branch-at-canaans-edge]], 512). Names: Paul Johnson, Eastland, Hoover, Daley.'
