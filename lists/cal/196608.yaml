  - id: cal.1966-08-29.vietnam-congress
    when: Aug. 29
    date: '1966-08-29'
    place: washington
    thread: vietnam-congress-mansfield
    c: 'Mansfield in the Senate on de Gaulle''s visit to Sihanouk: may it bring "a close-up review" of the war; a meeting of de Gaulle and Johnson, perhaps at Guadeloupe. On the Assembly elections: "I think they [the Viet Cong] should be allowed to vote to show how strong or weak they are." Fulbright: the administration''s peace offensive reduces to "the other side must stop doing what it is doing"; "it means surrender." Mansfield: not unconditional surrender.'
