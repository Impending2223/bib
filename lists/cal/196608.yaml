        - 'via w.macfarquhar-origins-of-the-cultural III, 462 n.table: B'
        - 'w.deng-xiaoping-nianpu-1904 III, 1927: A-C'
        - 'w.mao-zedong-zhuan VI, ch. 74 n.57: B, C, D, E, F, G'
        - 'via w.mao-zedong-zhuan VI, ch.74 n.57: B, C, D, E, F, G'
