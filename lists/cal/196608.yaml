  - id: cal.1966-08-04.china-leadership-4
    when: Aug. 4
    date: '1966-08-04'
    place: peking
    thread: china-leadership
    c: Zhou Enlai speaks that evening at the Tsinghua all-staff-and-student debate meeting, Li Xuefeng presiding. He comes as a Center worker to learn and to support carrying the Cultural Revolution through; Mao and the Standing Committee had him look into it at Tsinghua. He criticizes the work groups "errors" and clears Kuai Dafu; most of the group are old revolutionaries meeting new problems. Forming associations of workers, poor peasants and cadres' children in the schools is wrong; unite 90 percent of the masses and 95 percent of the cadres.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 44–45 (Aug. 4, 1966); [[w.macfarquhar-maos-last-revolution]], 88 (around midnight, at the mobilization rally on the Tsinghua campus where the departing work team''s head has just made a public self-criticism, Zhou says of the three young comrades from the attached middle school: "I salute you"); [[w.deng-xiaoping-nianpu-1904]], III, 1928 (Aug. 4, 1966; 晚八时; Deng, with Zhou Enlai 周恩来, Dong Biwu 董必武, Li Fuchun 李富春, Tao Zhu 陶铸, Chen Boda 陈伯达 and others, goes to Tsinghua University 清华大学 and attends the meeting of the whole university''s teachers, students and staff, hearing criticism of the new Peking 北京 municipal committee and the work team, and makes a short speech); [[w.yang-jisheng-tiandi-fanfu]], I, 221–222 (that evening nearly 20,000 gather at the East Field of Tsinghua; Zhou Enlai, Dong Biwu 董必武, Deng Xiaoping, Li Fuchun, Chen Boda, Li Xuefeng, Tao Zhu, Wang Renzhong and the Cultural Revolution Group''s members attend, on low stools below the stage; Li Xuefeng presides and says the work group erred in direction and line; Ye Lin 葉林 makes a self-criticism that the students find evasive; nine students speak, two views opposed; at 1 a.m. 凌晨1點 Zhou speaks at length: "I come to this meeting at the Party Center''s and Chairman Mao''s wish to look into Tsinghua''s cultural revolution," and "from today a new Tsinghua is born"). Check: the day of Zhou''s speech; Yang gives it as 1 a.m., which is Aug. 5 (I, 221). To check: the speech as circulated at Tsinghua; [[w.wuchanjieji-wenhua-dageming-ziliao-1966]], II, 29 (cited by [[w.macfarquhar-maos-last-revolution]], 88 n.10). Names: Zhou Enlai, Li Xuefeng, Kuai Dafu.'
