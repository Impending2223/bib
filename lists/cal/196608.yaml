  - id: cal.1966-08-05.china-leadership
    when: Aug. 5
    date: '1966-08-05'
    thread: china-leadership
    c: 'Mao writes on a copy of the *Beijing ribao* of June 2 "Bombard the Headquarters: My Wall Poster": the first Marxist-Leninist poster and the commentator''s article well written; for fifty-odd days some leaders from the Center to the localities did the reverse, on a reactionary bourgeois standpoint, ran a bourgeois dictatorship, beat down the movement, spread terror; recalls the right deviation of 1962 and the "left in form, right in essence" of 1964. A plenum document, to county and regiment level Aug. 17; printed Aug. 5, 1967.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 5, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 45–46 (Aug. 7, 1966; the plenum circulates Mao''s "Bombard the Headquarters", which calls the Nie Yuanzi poster the country''s first Marxist-Leninist one and charges that for fifty-odd days from early June leaders from the Center down stood on the reactionary bourgeois side and ran a bourgeois dictatorship); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648–649 (Aug. 5 and 7, 1966; the book says Mao writes, aimed chiefly at Liu, the poster "Bombard the Headquarters: My Wall Poster," charging that certain leading comrades from the Center to the localities have "gone the opposite way," taken a reactionary bourgeois stand and enforced bourgeois dictatorship, beating down the proletarian cultural revolution; Aug. 7 the plenum issues it to its members, after which the plenum turns to exposing and criticizing Liu Shaoqi and Deng Xiaoping); [[w.macfarquhar-maos-last-revolution]], 90–91 (Mao writes the text on a two-month-old copy of the Beijing Daily, his secretary copies it onto a blank sheet, and two days later he has it distributed to the plenum; it leaks almost instantaneously; published in the People''s Daily a year later); [[w.macfarquhar-origins-of-the-cultural]], III, 281 (in ''Bombard the Headquarters'' Mao describes what happened in 1962 as a ''rightist deviation''; the term youqing may be shorthand for youqing jihuizhuyi, right opportunism); [[w.jianguo-yilai-mao-zedong]], XVIII, 304–305 (Aug. 5, 1966; Mao''s text, written on the *Beijing ribao* of June 2 and twice revised, printed from the manuscript; note 1: the title added at the first revision; issued to county and regiment level by the Center General Office Aug. 17, 1966; printed in *Renmin ribao* Aug. 5, 1967; the Fifth Plenum''s resolution of Feb. 29, 1980 rehabilitating Liu Shaoqi denies any "bourgeois reactionary line"); [[w.deng-xiaoping-nianpu-1904]], III, 1929 (Aug. 5, 1966; Mao writes ''Bombard the Headquarters: my big-character poster'' 《炮打司令部——我的一张大字报》, attacking without naming Liu Shaoqi and Deng Xiaoping and others: for over fifty days some leaders from the Center to the localities did the reverse, took the reactionary bourgeois standpoint, carried out a bourgeois dictatorship, struck down the proletariat''s cultural revolution, reversed right and wrong, encircled the revolutionaries, suppressed differing views and practised white terror; on the 7th the plenum distributes it to those attending; after that the plenum turns to the exposure and criticism of Liu and Deng); [[w.mao-zedong-zhuan]], VI, ch. 74 n.60 (the next day Mao writes the passage later headed ''Bombard the Headquarters: My Big-Character Poster'': the first Marxist-Leninist poster and the commentator''s article, how fine; for over fifty days leaders from the Center to the localities did the reverse, on the reactionary bourgeois side, a dictatorship of the bourgeoisie, beating down the proletarian movement, white terror; recalls the right deviation of 1962 and the ''left in form, right in essence'' of 1964; the text printed in the *Renmin ribao*, Aug. 5, 1967, n.60). [[w.yang-jisheng-tiandi-fanfu]], I, 222–223 (Mao''s text, in pencil on the *Beijing ribao* of June 2, which carried Nie Yuanzi''s poster and the *Renmin ribao* commentator''s article, dated Aug. 5, 1966 and printed in full on I, 222; the title and the date "3 a.m. Aug. 7" were added to the fair copy brushed by his secretary Xu Yefu 徐業夫; the document issued to county and regiment level Aug. 17; published a year later, Aug. 5, 1967, in the *Renmin ribao*; Mao: the past two months it was I who was struck, and I hit back, the Group right in this period and not the Center); [[w.yang-jisheng-mubei]], II, 1137 (the book traces "in 1964 left in form, right in essence" in Mao''s poster of Aug. 5, 1966 to Liu''s conduct of the four cleans in 1964). Made public: Aug. 5, 1967 (*Renmin ribao*). To check: *Paoda siling bu: wo de yizhang dazibao* (炮打司令部——我的一张大字报), the text as the nianpu prints it, Aug. 5, 1966; [[w.nianyi-da-dongluande-niandai]], 54–55 (cited by [[w.macfarquhar-maos-last-revolution]], 90 n.18a); [[w.wenhua-dageming-yanjiu-ziliao]], I, 70 (cited by [[w.macfarquhar-maos-last-revolution]], 90 n.18b); [[w.zhenhua-red-flower-of-china]], 71 (cited by [[w.macfarquhar-maos-last-revolution]], 91 n.19a); [[w.mao-zedong-xuexi-wenxuan]], 113 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 281 n.115); Beijing ribao, June 2, 1966, reprinting the Nie Yuanzi poster and the Renmin ribao commentator''s article (the copy on which Mao wrote) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 304 n.1a); *Renmin ribao* 《人民日报》, Aug. 5, 1967, printing "Bombard the Headquarters: My Big-Character Poster" 《炮打司令部——我的一张大字报》 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.60); Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese University Press, Hong Kong, 2008), 194 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 223 n.12). Names: Mao Zedong.'
