  - id: cal.1966-08-28.china-leadership
    when: Aug. 28
    date: '1966-08-28'
    thread: china-leadership
    c: Mao, at the pool, hears Tao Zhu, Kang Sheng and Zhang Pinghua on the Cultural Revolution. Students from outside Peking already number 140,000; let them all come, in batches. Students no longer care for "fight, criticize, reform," his own phrase; they want to sweep the "monsters" in society. The Revolution will run past year's end, to the Spring Festival at least. Science students to study a little, arts students not; let them link up and give them all letters of introduction, left or right.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 28, 1966. [[w.mao-zedong-zhuan]], VI, ch. 75 n.7 (Aug. 28, in a talk with Tang Pingzhu 唐平铸 and Hu Chi 胡痴, who had just gone to take charge of the *Renmin ribao*, n.7: students no longer care for ''fight, criticize, reform'', which he said himself, their hearts are out of school, they want to sweep away the ox-demons in society; to let those who wish to go go, leaving a few in turn to mind the schools, and to give out letters of introduction to all, left or right; food for those from outside; the movement to last past the year''s end, to the Spring Festival first; 140,000 students from outside had come to Peking by this day). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: Mao Zedong 毛泽东, talk with Tang Pingzhu 唐平铸 and Hu Chi 胡痴 (record 谈话记录), Aug. 28, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.7). Names: Mao Zedong, Tao Zhu, Kang Sheng, Zhang Pinghua.'
    src:
      c: dead99d9
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Aug. 28, 1966: all'
        - 'w.mao-zedong-zhuan VI, ch. 75 n.7: B, D, E, F, H'
        - 'via w.mao-zedong-zhuan VI, ch.75 n.7: B, D, E, F, H'
