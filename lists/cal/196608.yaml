    tags: [name:mao-zedong, name:deng-xiaoping, name:liu-shaoqi, name:chen-boda, polity:prc, vis:only:prc]
    variants:
      - unit: H
        witness: w.macfarquhar-maos-last-revolution
        reads: Mao aggressively interrupts Liu Shaoqi while he delivers the opening-day report, and when Liu takes responsibility for sending in the work teams asserts that 90 percent of them made mistakes of line, stood on the side of the bourgeoisie and opposed the proletarian revolution
        at: '87'
