    n: '[[w.zelizer-fierce-urgency-of-now]], 243. To check: Lyn Shepard, "Congress Wary of Title IV," *Christian Science Monitor*, Aug. 2, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]], 243 n.42). Check: the day of the remark. Names: King.'
