  - id: cal.1966-08-01.press-and-broadcasting-2
    when: Aug. 1
    date: '1966-08-01'
    thread: press-and-broadcasting
    also: [vietnam]
    c: 'Johnson with Sherrod of *Time-Life*, forty minutes, for Sherrod''s memorandum. The war: "It looks pretty good, improving all the time, but we''ve got a long way to go"; of 14,000 villages "maybe a hundred" taken care of; 700,000 men or a million, "we are going to do the job." Half the interview against the press, the *Times*, Lippmann, Reston, Halberstam.'
    n: '[[w.dallek-flawed-giant]], 378–79 (Sherrod''s memorandum). To check: Sherrod to George P. Hunt, Oct. 1, 1966, LBJ Files, Robert Sherrod Papers, NASA Archives (cited by [[w.dallek-flawed-giant]], 379 n.122). See [[cal.1966-08-01.vietnam]]. Names: Johnson, Lippmann, Reston, Halberstam.'
    src:
      c: ef3e1bf9
      rows:
        - 'w.dallek-flawed-giant 378–79: all'
    tags: [name:johnson-lyndon-b, name:lippmann-walter, name:reston-james, name:halberstam-david]
  - id: cal.1966-08-01.jobs-and-wages-airlines
    when: Aug. 1
    date: '1966-08-01'
    place: washington
    thread: jobs-and-wages-airlines
    c: 'The White House, evening. Johnson with Califano; legislation on the Hill "had gone very badly"; Congress, determined to do something, will direct the President to "use his discretion" to end the strike, leaving him to sign or veto. Mrs. Johnson: "a sharp and skillful knife to insert between the President and Labor."'
    n: '[[w.johnson-white-house-diary]], 402 (Lady Bird Johnson''s account). See [[cal.1966-07-31.jobs-and-wages-airlines]]. Made public: 1970. Names: Johnson, Califano.'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr]
  - id: cal.1966-08-01.white-house
    when: Aug. 1
    date: '1966-08-01'
    time: 1966-08-01T21:00Z
    place: washington
    thread: white-house
    also: [soviet-union]
    c: Washington, the Harrimans' house, from 5 p.m. Averell and Marie Harriman's party for Luci Johnson and Pat Nugent. Sevilla-Sacasa, Dean of the Diplomatic Corps, presents the Corps' joint gift, a silver tea service, from all 114 members; nearly every country represented, chargés if the Ambassadors are away, all the Soviet bloc among them, Harriman says. Johnson comes a little before 7.
    n: '[[w.johnson-white-house-diary]], 401–02 (Lady Bird Johnson''s account). Names: Harriman, Johnson, Lady Bird Johnson.'
    tags: [name:harriman-w-averell, name:johnson-lyndon-b, name:johnson-lady-bird, city:washington]
