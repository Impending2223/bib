    c: At a meeting with members of the Central Cultural Revolution Group Lin Biao expresses total support for Mao's vision of the Cultural Revolution. He urges them to "turn the world upside down, be noisy and boisterous, blow tempests and make big waves."
    n: '[[w.macfarquhar-maos-last-revolution]], 91–92; [[w.mao-zedong-zhuan]], VI, ch. 74 (the same day Lin Biao, receiving members of the Cultural Revolution Group, ''heats it further'': the world to be turned upside down, with uproar, great winds and waves, so that the bourgeoisie cannot sleep for half a year, nor the proletariat). [[w.yang-jisheng-tiandi-fanfu]], I, 225 (that evening Lin Biao receives the members of the Cultural Revolution Group and declares his firm support for the cultural revolution Mao started: "the supreme commander of this cultural revolution is our Chairman Mao"; the bourgeois reactionary authorities are to be put down and made to lose face, "turn heaven and earth upside down, with a great stir, with great winds and waves, with great noise," so that the bourgeoisie cannot sleep and the proletariat cannot sleep). Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 58 (cited by [[w.macfarquhar-maos-last-revolution]], 92 n.25). Names: Lin Biao, Mao Zedong. Check: the remarks were distributed to the plenum''s conferees with his May 18 speech.'
