    c: 'Peking. Mao presides over an enlarged Standing Committee meeting: the Revolution goes into society, by argument, not force. Agrees with the Group that most work-team members are good and not every head bad; those who sent the teams to bear the blame; the State Council''s department heads to apologize to the masses; the name "royalist" to go. Red Guards in organs not to be disbanded, nor encouraged; the army is itself Red Guard. Some provincial, large-city and middle-city committees will fall. On Li Fuchun''s ten points (his Aug. 28 note): not one needed.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 50 (Aug. 23, 29, 1966; Mao, at the enlarged Standing Committee meeting of Aug. 29, on the ten points of the State Council''s branches: "not one; why ten, when there are the Sixteen Points"); [[w.jianguo-yilai-mao-zedong]], XVIII, 331 (Aug. 29, 1966; note 1: at the enlarged Standing Committee meeting of Aug. 29 Mao says not one of Li Fuchun''s ten points is needed; why ten; let it run its course; there are the Sixteen Points); [[w.mao-zedong-zhuan]], VI, ch. 75 n.8 (Aug. 29 Mao presides over the enlarged Standing Committee meeting, opening: the cultural revolution has come out into society, ''fight, criticize, reform'' there, by argument and not by force, and Lin Biao adds that all would be well but for beating; most work-team members good, few bad, not every team head bad; those who sent teams to bear responsibility; the heads of State Council branches to go to the masses and make self-criticisms; the name ''royalist'' to be dropped; some provincial, big-city and middle-city committees will fall, and Li Fuchun''s ten points for the eight Center branches: ''not one'', n.8). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: *Bayue ershijiu ri changwei kuoda hui jiyao* 《八月二十九日常委扩大会纪要》, minutes of the enlarged meeting of the Standing Committee 常委扩大会, Aug. 29, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.8). Names: Mao Zedong, Li Fuchun.'
