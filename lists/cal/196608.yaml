  - id: cal.1966-08-01.crime-and-hijacking
    when: Aug. 1–2
    date: '1966-08-01'
    place: austin
    thread: crime-and-hijacking
    c: 'Austin. Charles Whitman, a student and former Marine, having killed his wife and his mother in the night, fires from the University of Texas tower for about an hour and a half: 14 killed, some 30 wounded, before police kill him. Aug. 2, Johnson: Congress to pass the gun bill, Dodd''s S. 1592, reported by the Senate Judiciary Committee Mar. 22, "before further loss of life that might be prevented by its passage."'
    n: 'Statement by the President on the Need for Firearms Control Legislation, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966); Telegram to the Chancellor of the University of Texas Following the Mass Shooting on the University Campus, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966). [[w.peirce-great-plains-states-of]], 322 (14 killed, a summer day of 1966). To check: [[w.lavergne-sniper-in-the-tower]]; [[w.zimring-firearms-and-federal-law]]. See [[cal.1965-03-08.crime-and-hijacking]]. Names: Dodd, Whitman, Johnson.'
    src:
      c: 13caa907
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169: all'
        - 'w.peirce-great-plains-states-of 322: B'
    tags: [name:johnson-lyndon-b, name:dodd-thomas-j, name:whitman-charles-j]
