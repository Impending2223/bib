  - id: cal.1966-08-01.crime-and-hijacking
    when: Aug. 1–2
    date: '1966-08-01'
    thread: crime-and-hijacking
    c: 'Austin. Charles Whitman, a student and former Marine, having killed his wife and his mother in the night, fires from the University of Texas tower for about an hour and a half: 14 killed, some 30 wounded, before police kill him. Aug. 2, Johnson: Congress to pass the gun bill, Dodd''s S. 1592, reported by the Senate Judiciary Committee Mar. 22, "before further loss of life that might be prevented by its passage."'
    n: 'Statement by the President on the Need for Firearms Control Legislation, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966); Telegram to the Chancellor of the University of Texas Following the Mass Shooting on the University Campus, [1966 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=169) (Aug. 2, 1966). To check: [[w.lavergne-sniper-in-the-tower]]; [[w.zimring-firearms-and-federal-law]]. See [[cal.1965-03-08.crime-and-hijacking]]. Names: Dodd, Whitman, Johnson.'
    tags: [name:johnson-lyndon-b, name:dodd-thomas-j, name:whitman-charles-j]
  - id: cal.1966-08-01.amendments
    when: Aug. 1–5
    date: '1966-08-01'
    thread: amendments
    also: [court, congress]
    c: 'Bayh''s Subcommittee on Constitutional Amendments on Dirksen''s S.J. Res. 148, the prayer amendment: hearings Aug. 1–5, and a last day Aug. 8. The Judiciary Committee reports no resolution.'
    n: '*School Prayer: Hearings on S.J. Res. 148 before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 89th Cong., 2d sess. (1966) ([Monthly Catalog](https://mocat.library.unt.edu/catalog/862-16191); Y 4.J 89/2:P 89/966; Check: a digitized copy, and the witnesses). History of Bills, 1966, [S.J. Res. 148](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt22/pdf/GPO-CRECB-1966-pt22-2.pdf#page=47). See [[cal.1966-03-22.amendments]]. Names: Bayh, Dirksen.'
    tags: [name:bayh-birch, name:dirksen-everett]
  - id: cal.1966-08-01.vietnam
    when: Aug. 1
    date: '1966-08-01'
    thread: vietnam
    c: 'Krulak, commanding the Fleet Marine Force, Pacific, with Johnson, forty minutes, arranged by Greene: the Marines'' case against attrition, for protecting the people and for striking the North''s ports. By Krulak''s account, when he came to mining the ports Johnson "got to his feet, put his arm around my shoulder, and propelled me firmly toward the door."'
    n: '[[w.gibbons-u-s-government-and]], IV, 198–99. Krulak''s account: [[w.krulak-first-to-fight]], 202 (To check). To check: Krulak, "A Strategic Appraisal, Vietnam," December 1965, copy provided to Gibbons by Krulak (cited by [[w.gibbons-u-s-government-and]], IV, 198 n.88). Names: Krulak, Johnson, Greene.'
    src:
      c: 71ea8a53
      rows:
        - 'w.gibbons-u-s-government-and IV, 198–99: all'
        - 'via w.gibbons-u-s-government-and IV, 198 n.88: A'
    tags: [name:krulak-victor-h, name:johnson-lyndon-b, name:greene-wallace-m-jr]
  - id: cal.1966-08-02.elections-1966
    when: Aug. 2
    date: '1966-08-02'
    thread: elections-1966
    c: 'Michigan, Democratic Senate primary: Williams, governor 1949–61, lately Assistant Secretary of State for African Affairs, defeats Cavanagh, mayor of Detroit, 437,438 to 290,465, 60.1 percent. Griffin, appointed in May to Patrick McNamara''s seat, the Republican.'
    n: 'Votes: Wikipedia, from Our Campaigns (Check: *Michigan Manual 1967–1968*, pp. 409–412). To check: [[w.noer-soapy]]. Names: Cavanagh, Griffin, Williams, Patrick McNamara.'
    tags: [name:williams-g-mennen, name:cavanagh-jerome-p, name:griffin-robert-p, name:mcnamara-patrick-v, state:mi]
  - id: cal.1966-08-02.vietnam
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    c: 'Harriman, charged by Johnson in July with the search for a settlement, holds the first of the weekly meetings of his "Negotiations Committee," with U. Alexis Johnson, Thompson, and Unger: secret talks between Saigon and the NLF to be explored, with an amnesty; more intelligence on the Front''s leaders. The same day Kissinger, back from Vietnam, tells Harriman the Viet Cong''s political organization is untouched and pacification has made little progress.'
    n: 'FRUS 1964–68, IV, docs. [196](https://history.state.gov/historicaldocuments/frus1964-68v04/d196), [197](https://history.state.gov/historicaldocuments/frus1964-68v04/d197). [[w.gibbons-u-s-government-and]], IV, 384–85, 388–89, 396 (Kissinger, 384–85, 396; the committee, 396, but the amnesty); [[w.herring-lbj-and-vietnam]], 102–03 (Harriman "ambassador for peace," nothing in writing; his Negotiations Committee, weekly; his weekly memorandum to Rusk and Johnson). Gibbons dates Harriman''s appointment to the search for a settlement May 1966 (IV, 388); FRUS''s editors, July (doc. 197 n. 1). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]; memorandum of a meeting, Aug. 11, 1966; Harriman to Rusk and Johnson, Aug. 18, 1966; Harriman''s notes of a meeting with Fulbright, Aug. 24, 1966; memorandum, Sept. 30, 1966, Harriman Papers, Library of Congress (cited by [[w.herring-lbj-and-vietnam]], 103 n.42). Names: Harriman, Thompson, Unger, U. Alexis Johnson, Kissinger, Johnson. Check: Herring dates the appointment August 1966 (102).'
    src:
      c: d3c7566b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d196: all'
        - 'w.gibbons-u-s-government-and IV, 396: A'
        - 'w.gibbons-u-s-government-and IV, 384–85: C'
        - 'via w.gibbons-u-s-government-and IV, 396 n.37: A'
        - 'via w.gibbons-u-s-government-and IV, 396 n.36: C'
        - 'w.herring-lbj-and-vietnam 102–03: A'
        - 'via w.herring-lbj-and-vietnam 103 n.42a: A'
