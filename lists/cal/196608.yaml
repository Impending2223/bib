    also: [china]
    c: In Peking's western district alone, in little more than two weeks, the violence leaves close to one hundred teachers, school officials and educational cadres dead; the number injured is "too large to be calculated."
    n: '[[w.macfarquhar-maos-last-revolution]], 126. Made public: 1991. To check: [[w.jian-wenhua-dageming-shiqi-beijing]], 23 (cited by [[w.macfarquhar-maos-last-revolution]], 126 n.45). See [[cal.1966-08.china-leadership-25]]. Check: the dates of the two weeks.'
