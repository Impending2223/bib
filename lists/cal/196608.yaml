  - id: cal.1966-08.jobs-and-wages-farm-workers
    when: Aug.
    date: 1966-08
    thread: jobs-and-wages-farm-workers
    also: [states-and-cities]
    c: Connally meets the Texas farm workers' march at New Braunfels, Tex.
    n: 'Richard Bailey, ["Starr County Strike,"](https://www.tshaonline.org/handbook/entries/starr-county-strike) *Handbook of Texas Online*. Check the day. See [[cal.1966-07-04.jobs-and-wages-tx]]. Names: Connally.'
