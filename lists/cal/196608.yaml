  - id: cal.1966-08-01.china-leadership
    when: Aug. 1–12
    date: '1966-08-01'
    place: peking
    thread: china-leadership
    c: 'Peking, Great Hall. The Eleventh Plenum of the Eighth Central Committee, Mao presiding. Agenda, from Deng Xiaoping: the Decision on the Cultural Revolution; the major decisions since the Tenth Plenum; the personnel changes of May; a communiqué. Liu Shaoqi reports the Center''s work since the Tenth Plenum and takes responsibility for the work groups. Mao, during Chen Boda''s speech: over 90 percent of the work groups wholly wrong, under 10 percent good; they are to be withdrawn; they suppressed the movement.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 1, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 43 (Aug. 1, 1966; Zhou at the opening; Deng gives the agenda; Liu Shaoqi''s report and his taking responsibility for the work groups; Chen Boda charges the groups with wrong); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 647 (Aug. 1–12, 1966; Liu attends the Eleventh Plenum of the Eighth Central Committee; Aug. 1 he reports to it the policies of the Politburo on international and domestic work since the Tenth Plenum and takes the responsibility for the work-group practice after the "Cultural Revolution" began: lately the Chairman was away and he presided over the Standing Committee''s work at home; when the Chairman returned he found the sending of work groups wrong, and the responsibility is chiefly his; Mao, interjecting, charges that the work groups made errors of direction and line, "actually standing on the bourgeois standpoint and opposing the proletarian revolution"); [[w.macfarquhar-maos-last-revolution]], 86–87 (141 of the 173 Central Committee members and alternates elected in 1956 and 1958 attend, with 47 others, among them members of the Cultural Revolution Group and Nie Yuanzi and a junior colleague; Deng''s opening speech sets the agenda; Liu''s report not properly scripted, the Decision not ready); [[w.macfarquhar-origins-of-the-cultural]], III, 462–63 (the Eleventh Plenum, Aug. 1–12, the first in four years); [[w.deng-xiaoping-nianpu-1904]], III, 1927 (Aug. 1–12, 1966; Deng attends the Eleventh Plenum of the Eighth Central Committee; on the afternoon of Aug. 1, at the opening Mao presides over, he announces the agenda: (1) adopt the Central Committee''s decision on the proletarian cultural revolution; (2) discuss and approve the Center''s major measures at home and abroad since the Tenth Plenum; (3) complete the formalities for the personnel changes of the May Politburo meeting; (4) adopt the communiqué; Liu Shaoqi reports on the Center''s work since the Tenth Plenum and takes responsibility for the sending of work teams); [[w.mao-zedong-zhuan]], VI, ch. 74 n.57 (Aug. 1 the Eleventh Plenum opens at Peking, Mao presiding; Deng Xiaoping announces the agenda in four items, a decision on the proletarian cultural revolution; the major decisions and measures since the Tenth Plenum; the formal confirmation of the May Politburo meeting''s personnel changes; the communiqué; the session first set for five days; Liu Shaoqi reports on the Center''s work and again takes the responsibility for the work teams; Chen Boda''s speech; Mao''s interjections that necessity hides in accident, that the poster of Nie Yuanzi and its broadcast brought the disorder, and that the decision should be made, to be overturned only at the next plenum, n.57). [[w.yang-jisheng-tiandi-fanfu]], I, 220–221 (Aug. 1–12 in Peking; 141 members and alternates of the Central Committee and 47 non-voting attend; Deng Xiaoping announces four items: the resolution on the proletarian cultural revolution; the Center''s major measures since the Tenth Plenum in domestic and foreign matters, to be discussed and approved; the plenum communiqué; the formal approval of the May decisions on personnel; Liu reports the measures, and says that Peking''s cultural revolution made mistakes, especially over the work groups, "for which the responsibility is mainly mine"; "in the cultural revolution Peking reported to the Chairman once a week"). Made public: 1989. Check: MacFarquhar (86 n.4) has Lin Biao appear to chair the session in a photograph of the proceedings. To check: [[w.wenhua-dageming-bowuguan-2]], I, 210–211 (cited by [[w.macfarquhar-maos-last-revolution]], 86 n.4); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 273 (cited by [[w.macfarquhar-maos-last-revolution]], 87 n.6); [[w.xin-zhongguo-biannianshi-1949]], 276 (cited by [[w.macfarquhar-maos-last-revolution]], 87 n.7); [[w.yonglie-chen-boda-qiren]], 263–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 462 n.table); Record of the Eleventh Plenum of the Eighth Central Committee 中共八届十一中全会记录, Aug. 1, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.57); Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 99 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 221 n.6). Names: Mao Zedong, Deng Xiaoping, Liu Shaoqi, Chen Boda.'
    src:
      c: 4f24c99c
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Aug. 1, 1966: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 43: ?'
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 647: B, G, H, I, J'
        - 'w.macfarquhar-maos-last-revolution 86–87: B, C, D, E, F, G'
