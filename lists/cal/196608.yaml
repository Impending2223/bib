  - id: cal.1966-08-31.opinion
    when: Aug. 31
    date: '1966-08-31'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup, special survey in Britain: the United States to continue its efforts in South Vietnam, 37 percent; pull out, 40. British troops sent to fight there: approve 8, disapprove 81. The United States to agree to peace talks even at the risk of a Communist South Vietnam: should 72, should not 13. Most important for Britain: to support the Americans 9, to get peace talks going 81.'
    n: '[[w.gallup-poll]], III, 2025.'
