  - id: cal.1966-08-03.vietnam-operations
    when: Aug. 3
    date: '1966-08-03'
    thread: vietnam-operations
    c: 'Hastings ends, one battalion left in its area. Some 8,000 Marines and 3,000 South Vietnamese engaged against elements of all three regiments of the 324B Division. Marines: 126 killed, 448 wounded; South Vietnamese: 21 killed, 40 wounded. Reported: over 700 of the enemy killed, 17 captured.'
    n: '[[w.shulimson-u-s-marines-in-1982]], 175–176. See [[cal.1966-07-15.vietnam-operations]].'
    tags: [place:operation-hastings]
  - id: cal.1966-08-03.vietnam-force-levels
    when: Aug. 3
    date: '1966-08-03'
    thread: vietnam-force-levels
    c: 'Emrick, CINCPAC''s chief of staff, to Westmoreland: resistance in Washington to the forces for 1967; the Joint Chiefs "loathe to recommend approval of these requirements without additional rationale."'
    n: '[[w.gibbons-u-s-government-and]], IV, 403–04. To check: Emrick to Westmoreland, 032207Z Aug. 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 404 n.68). See [[cal.1966-06-18.vietnam-force-levels]]. Names: Westmoreland.'
