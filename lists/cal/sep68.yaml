list: cal
section: CVII
entries:
  - id: cal.1968-09.elections-1968
    when: Sept.
    date: 1968-09
    thread: elections-1968
    c: 'Agnew in the campaign: Humphrey "squishy soft on communism," a phrase he later withdraws; "Polack"; "the fat Jap," of a reporter on his plane. Check the days and places.'
    n: '[[w.witcover-white-knight]]; [[w.lippman-spiro-agnews-america]]; [[w.holden-republican-populist]]. See [[cal.1968-09-02.elections-1968]]. Names: Agnew, Humphrey.'
    tags: [name:agnew-spiro-t, name:humphrey-hubert-h]
  - id: cal.1968-09-02.elections-1968
    when: Sept. 2–12
    date: '1968-09-02'
    thread: elections-1968
    also: [vietnam]
    c: 'The campaign opens. Labor Day, Sept. 2: Humphrey in New York''s parade (Check). Sept. 4, Chicago: Nixon''s motorcade through the Loop. Sept. 9, Philadelphia: Humphrey, some American units might be withdrawn from Vietnam late in 1968 or early in 1969; at Denver the same day, the convention''s majority and minority planks on Vietnam not far apart. Sept. 10, New Orleans, Johnson to the American Legion: "We yearn for the day when our men can come home. No man can predict when that day will come." Sept. 12, Clifford to Johnson, at lunch: the Vice President "has had three flubs": the withdrawal of troops, the planks, a Marine unit coming home.'
    n: '[Remarks in New Orleans Before the 50th Annual National Convention of the American Legion](https://www.presidency.ucsb.edu/documents/remarks-new-orleans-before-the-50th-annual-national-convention-the-american-legion) (Sept. 10, 1968). FRUS 1964–68, VII, doc. [12](https://history.state.gov/historicaldocuments/frus1964-68v07/d12). [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.gould-1968]]; [[w.witcover-year-the-dream-died]]; [[w.nelson-resilient-america]]; [[w.lafeber-deadly-bet]]; [[w.johns-price-of-loyalty]]; [[w.solberg-hubert-humphrey]]; [[w.perlstein-nixonland-2008]]. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-08-26.elections-1968]]. Names: Humphrey, Nixon, Johnson, Clifford.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:johnson-lyndon-b, name:clifford-clark, state:il, city:chicago, state:pa, city:philadelphia, state:la, city:new-orleans]
  - id: cal.1968-09-06.court
    when: Sept. 6–17
    date: '1968-09-06'
    thread: court
    also: [confirmations]
    c: 'Fortas. Sept. 6, Johnson, at a news conference, after meeting Mansfield and Dirksen: "There has never been a single case where the Senate failed to act on a nomination because of the filibuster." The Judiciary Committee''s hearings resume, Sept. 13: Fortas paid $15,000, raised from private donors, for nine summer seminars at American University''s law school; he declines to appear again (Check the days). Sept. 17, the Committee reports the nomination favorably, 11–6.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1212) (Sept. 6, 1968). See [[cal.1968-06-26.court]]. Names: Fortas, Johnson, Mansfield, Dirksen.'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1968-09-07.vietnam
    when: Sept. 7–21
    date: '1968-09-07'
    thread: vietnam
    c: 'Paris. Harriman and Vance meet Lê Đức Thọ and Xuân Thủy in private, Sept. 7, 12, 15 and 20; what is said to stay secret. Sept. 7, Thọ''s three hours on the war. Sept. 15, the Americans on mutual withdrawal, the DMZ, and "our side–your side" for talks after a halt. Sept. 20, Saigon''s place: an understanding on it "could be a major factor" in a decision to stop the bombing; Thọ: only "could be." Sept. 21, Harriman and Vance to Rusk: let them say "would be the major factor."'
    n: 'FRUS 1964–68, VII, docs. [7](https://history.state.gov/historicaldocuments/frus1964-68v07/d7), [14](https://history.state.gov/historicaldocuments/frus1964-68v07/d14), [24](https://history.state.gov/historicaldocuments/frus1964-68v07/d24), [26](https://history.state.gov/historicaldocuments/frus1964-68v07/d26), [27](https://history.state.gov/historicaldocuments/frus1964-68v07/d27). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy, Rusk.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:le-duc-tho, name:xuan-thuy, name:rusk-dean]
  - id: cal.1968-09-07.women
    when: Sept. 7
    date: '1968-09-07'
    thread: women
    c: 'Atlantic City. New York Radical Women and others picket the Miss America Pageant on the Boardwalk: a "Freedom Trash Can" for girdles, bras, false eyelashes and copies of *Playboy*; a sheep crowned. Inside the hall, during the broadcast, a banner: "Women''s Liberation." The first Miss Black America pageant the same night, nearby (Check).'
    n: '[[w.echols-daring-to-be-bad]]; [[w.rosen-world-split-open]].'
    tags: [state:nj, city:atlantic-city]
  - id: cal.1968-09-08.black-nationalism-oakland
    when: Sept. 8
    date: '1968-09-08'
    thread: black-nationalism
    c: 'Oakland. The jury convicts Newton of voluntary manslaughter in the death of an Oakland policeman, Oct. 28, 1967. Sept. 27, sentenced to two to fifteen years. Check the day of the verdict.'
    n: '*People v. Newton*, [8 Cal. App. 3d 359](https://static.case.law/cal-app-3d/8/html/0359-01.html) (1970), the appeal. See [[cal.1967-10-28.black-nationalism-oakland]]. Names: Newton.'
    tags: [name:newton-huey-p, state:ca, city:oakland]
  - id: cal.1968-09-09.soviet-union
    when: Sept. 9–Oct. 6
    date: '1968-09-09'
    thread: soviet-union
    also: [testing, vietnam]
    c: 'The summit, put off by the invasion of Czechoslovakia, sought again. Sept. 9, at his home, Rostow to Dobrynin, on Johnson''s instructions: "The President does not wish to launch the missile talks at a meeting lower than the Kosygin-Johnson level." Dobrynin: "Now that the Democratic Convention is over, the offensive may subside." Sept. 16, an American memorandum on the meeting. Oct. 2, New York: Gromyko hands Rusk Moscow''s answer: basic principles for limiting and then reducing strategic arms to be set at the meeting; on Vietnam, nothing new. Oct. 6, Rusk to Gromyko, alone, after dinner: let Moscow press Hanoi on Saigon''s presence at the talks.'
    n: 'FRUS 1964–68, XI, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v11/d280), [287](https://history.state.gov/historicaldocuments/frus1964-68v11/d287); XIV, docs. [294](https://history.state.gov/historicaldocuments/frus1964-68v14/d294), [299](https://history.state.gov/historicaldocuments/frus1964-68v14/d299), [307](https://history.state.gov/historicaldocuments/frus1964-68v14/d307), [310](https://history.state.gov/historicaldocuments/frus1964-68v14/d310); VII, doc. [9](https://history.state.gov/historicaldocuments/frus1964-68v07/d9). [[w.newhouse-cold-dawn]]; [[w.garthoff-detente-and-confrontation]]. Made public: FRUS 1964–68, XI (1997) and XIV (2001) (Check the years). See [[cal.1968-06-21.testing]]. Names: Rostow, Dobrynin, Johnson, Kosygin, Gromyko, Rusk.'
    tags: [name:rostow-walt-w, name:dobrynin-anatoly, name:johnson-lyndon-b, name:kosygin-aleksei, name:gromyko-andrei, name:rusk-dean]
  - id: cal.1968-09-11.transition-and-staff
    when: Sept. 11
    date: '1968-09-11'
    thread: transition-and-staff
    c: 'Johnson to the candidates, under the Presidential Transition Act of 1963: the departments and agencies to plan for the transfer of the executive power on Jan. 20, 1969; Charles Murphy the coordinator in the White House Office; each candidate may name a representative to work with him.'
    n: '[Letter to Presidential Candidates Concerning Plans for an Orderly Transfer of Executive Power](https://www.presidency.ucsb.edu/documents/letter-presidential-candidates-concerning-plans-for-orderly-transfer-executive-power) (Sept. 11, 1968). [[w.brauer-presidential-transitions]]; [[w.christian-president-steps-down]]. Names: Murphy, Johnson.'
    tags: [name:murphy-charles-s, name:johnson-lyndon-b]
  - id: cal.1968-09-11.jobs-and-wages
    when: Sept. 11
    date: '1968-09-11'
    thread: jobs-and-wages
    c: 'Johnson to the Speaker and the President of the Senate, proposing a Federal Coal Mine Health and Safety Act: since the act of 1952, over 5,500 miners killed on the job, 250,000 seriously disabled; at least one active miner in ten, one retired miner in five, with a serious respiratory disease. Not enacted in the session (Check).'
    n: '[Letter to the President of the Senate and to the Speaker of the House Proposing the Federal Coal Mine Health and Safety Act](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-proposing-the-federal-coal-mine) (Sept. 11, 1968). [[w.derickson-black-lung]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-16.elections-1968
    when: Sept. 16
    date: '1968-09-16'
    thread: elections-1968
    also: [press-and-broadcasting]
    c: 'NBC, *Rowan & Martin''s Laugh-In*: Nixon, on tape, a few seconds: "Sock it to *me*?"'
    n: '[[w.nixon-rowan-and-martins-laugh]]. [[w.perlstein-nixonland-2008]]. See [[cal.1968-09-02.elections-1968]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1968-09-16.crime-and-hijacking
    when: Sept. 16–18
    date: '1968-09-16'
    thread: crime-and-hijacking
    c: 'Senate, the gun bill, S. 3633. Sept. 17, Dodd''s stricter qualifications for licensed dealers refused, [42–45](https://voteview.com/rollcall/RS0900551). Sept. 18: the registration and licensing of firearms refused, [31–55](https://voteview.com/rollcall/RS0900553); no licenses after 1970 to dealers in States without effective firearms laws, [35–48](https://voteview.com/rollcall/RS0900554); a national firearms inventory, [31–53](https://voteview.com/rollcall/RS0900555); the licensing of concealable weapons, [35–49](https://voteview.com/rollcall/RS0900556). The House''s bill, H.R. 17735, passed, its text replaced by S. 3633''s, [70–17](https://voteview.com/rollcall/RS0900558): the mail-order and interstate sale of rifles, shotguns and ammunition stopped.'
    n: '[[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Dodd.'
    tags: [name:dodd-thomas-j]
  - id: cal.1968-09-17.testing
    when: Sept. 17–Oct. 11
    date: '1968-09-17'
    thread: testing
    c: 'The nonproliferation treaty. Sept. 17, the Foreign Relations Committee recommends consent, 13–3–3. Foster to Dobrynin the same day: done in spite of Czechoslovakia; should there be "further similar events in Romania and Yugoslavia," the treaty and the rest "might just as well be forgotten." The Senate does not take it up before it adjourns (Check). Oct. 11, Johnson: "Now it is before our Senate for ratification"; the danger would multiply "as additional fingers were placed on nuclear triggers."'
    n: 'FRUS 1964–68, XI, doc. [283](https://history.state.gov/historicaldocuments/frus1964-68v11/d283). [Statement by the President Urging Ratification by the Senate of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/statement-the-president-urging-ratification-the-senate-the-nuclear-nonproliferation-treaty) (Oct. 11, 1968). [[w.seaborg-stemming-the-tide]]. See [[cal.1967-08-24.testing]]. Names: Foster, Dobrynin, Johnson.'
    tags: [name:foster-william-c, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1968-09-17.japan-and-korea
    when: Sept. 17–Oct. 31
    date: '1968-09-17'
    thread: japan-and-korea
    c: 'Panmunjom, the *Pueblo*. Woodward and Pak Chung Kuk in closed meetings, Sept. 17, Oct. 10, 23 and 31 among them. The "overwrite": Woodward to write on the North Korean document of admission and apology that he acknowledges receipt of the crew, and sign that. Sept. 30, Pak''s document presented again (Check). Oct. 23, Pak calls the proposal a "petty stratagem." Oct. 31, Pak: a settlement depends on the United States signing the document of Sept. 30.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [313](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d313), [315](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d315), [317](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d317), [319](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d319), [321](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d321), [323](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d323). See [[cal.1968-01-23.japan-and-korea]]. Names: Woodward, Pak Chung Kuk.'
    tags: [name:woodward-gilbert-h, name:pak-chung-kuk]
  - id: cal.1968-09-17.economy
    when: Sept. 17–23
    date: '1968-09-17'
    thread: economy
    c: 'Sept. 17, Johnson: Chrysler''s increase on its 1969 models, announced the day before, "excessive"; the Cabinet Committee on Price Stability finds "absolutely no excuse" for it; followed through the industry, three-quarters of a billion dollars from American families. Sept. 23: General Motors'' prices; if the industry follows them, about $350 million saved.'
    n: '[Statement by the President on Prices of New Automobiles](https://www.presidency.ucsb.edu/documents/statement-the-president-prices-new-automobiles) (Sept. 17, 1968); [Statement by the President on Prices of New Automobiles](https://www.presidency.ucsb.edu/documents/statement-the-president-prices-new-automobiles-0) (Sept. 23, 1968). [[w.bernstein-guns-or-butter]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-26.transition-and-staff
    when: Sept. 26
    date: '1968-09-26'
    thread: transition-and-staff
    also: [elections-1968]
    c: 'Ball resigns as Representative to the UN, to work for Humphrey; Johnson: it "has nothing to do with public policy but does have something to do with domestic politics." Wiggins, editor of the *Washington Post*, named in his place; sworn Oct. 4.'
    n: '[Remarks Upon Announcing Resignation of George W. Ball and Intention To Nominate J. Russell Wiggins as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-upon-announcing-resignation-george-w-ball-and-intention-nominate-j-russell-wiggins) (Sept. 26, 1968); [Remarks at the Swearing In of J. Russell Wiggins as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-j-russell-wiggins-us-representative-the-united-nations) (Oct. 4, 1968). [[w.ball-past-has-another-pattern]]. See [[cal.1968-09-02.elections-1968]]. Names: Ball, Humphrey, Wiggins, Johnson.'
    tags: [name:ball-george-w, name:humphrey-hubert-h, name:wiggins-james-r, name:johnson-lyndon-b]
  - id: cal.1968-09-30.elections-1968
    when: Sept. 30
    date: '1968-09-30'
    thread: elections-1968
    also: [vietnam]
    c: 'Salt Lake City, taped for NBC, broadcast that evening: Humphrey, as President, would stop the bombing of the North "as an acceptable risk for peace," since it could lead to success in the negotiations; before it, "key importance" on evidence, "direct or indirect, by word or deed," of Communist willingness to restore the DMZ; the bombing resumed on a showing of bad faith. Nixon to Johnson by telephone, 6:45 p.m.: any change in policy? Johnson: none; he has not read the speech. Humphrey to Johnson, 7:30, minutes before the broadcast. Johnson to Ball, 8:15: "they would have to give me direct or indirect, word or deed."'
    n: '[Johnson and Nixon, 6:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-september-30-1968), Conversation WH6809-04-13433 (Miller Center); [Johnson and Humphrey, 7:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-and-office-secretary-september), Conversation WH6809-04-13435 (Miller Center); [Johnson and Ball, 8:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-ball-october-1-1968), Conversation WH6809-04-13436 (Miller Center). FRUS 1964–68, VII, docs. [38](https://history.state.gov/historicaldocuments/frus1964-68v07/d38), [39](https://history.state.gov/historicaldocuments/frus1964-68v07/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v07/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v07/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v07/d42) (Johnson to Dirksen, Oct. 1). *New York Times*, [Oct. 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/10/01/issue.html) (the text). [[w.johns-price-of-loyalty]]. See [[cal.1968-09-02.elections-1968]]. Names: Humphrey, Nixon, Johnson, Ball.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:johnson-lyndon-b, name:ball-george-w, state:ut, city:salt-lake-city]
  - id: cal.1968-09-30.jobs-and-wages
    when: Sept. 30
    date: '1968-09-30'
    thread: jobs-and-wages
    c: 'Executive Order 11431, under the Taft-Hartley Act: a Board of Inquiry, David Cole its chairman, into the disputes between the International Longshoremen''s Association and the shipping and stevedoring employers of the Atlantic and Gulf ports; a strike there would "imperil the national health and safety." Johnson to Ball that evening: "We''ve got the damn longshoremen out tonight." The injunction followed (Check the day).'
    n: '[Executive Order 11431](https://www.presidency.ucsb.edu/documents/executive-order-11431-creating-board-inquiry-report-certain-labor-disputes-affecting-the) (Sept. 30, 1968). FRUS 1964–68, VII, doc. [41](https://history.state.gov/historicaldocuments/frus1964-68v07/d41). See [[cal.1965-02-10.jobs-and-wages]]. Names: Cole, Johnson.'
    tags: [name:cole-david-l, name:johnson-lyndon-b]
  - id: cal.1968-09-30.conservation
    when: Sept. 30
    date: '1968-09-30'
    thread: conservation
    c: 'Colorado River Basin Project Act signed, [82 Stat. 885](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg885-3.pdf): the Central Arizona Project, the Colorado''s water to central and southern Arizona; no dams on the river between Glen Canyon and Hoover Dam without Congress (Check the terms). Johnson, with Hayden, Jackson, Aspinall and the Udalls: "Next to the air we breathe, water is our most precious resource." The National Water Commission created three days before.'
    n: '[Remarks Upon Signing the Colorado River Basin Project Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-colorado-river-basin-project-act) (Sept. 30, 1968). Statute (K–J Cong. II.J.2). [[w.johnson-central-arizona-project-1918]]; [[w.reisner-cadillac-desert]]. Names: Hayden, Jackson, Aspinall, Stewart Udall, Morris Udall, Johnson.'
    tags: [name:hayden-carl, name:jackson-henry-m, name:aspinall-wayne-n, name:udall-stewart-l, name:udall-morris-k, name:johnson-lyndon-b]
