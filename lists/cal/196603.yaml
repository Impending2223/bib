  - id: cal.1966-03-02.robert-kennedy
    when: Mar. 2
    date: '1966-03-02'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy to the *Christian Science Monitor*: his statement of Feb. 19 meant only "public enlightenment to the realities involved in bringing about negotiations." Will he speak out again? "I have made the point."'
    n: '[[w.palermo-in-his-own-right]], 26–27. To check: "Dialogue on Vietnam," *Christian Science Monitor*, Mar. 2, 1966, 3 (cited by [[w.palermo-in-his-own-right]], 27 n.95). See [[cal.1966-02-19.vietnam]]. Names: Robert Kennedy. Check: the day of the interview; printed Mar. 2.'
