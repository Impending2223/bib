    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam
    also: [vietnam-congress, republican-party-congress]
    c: 'The House Republican Policy Committee (Check) on the Democrats'' division over the war: it prolongs the war, undermines "the morale of our fighting men" and encourages "the Communist aggressor." The President to "disavow" the dissenters and "take command of his party."'
    n: '[[w.johns-vietnams-second-front]], 108. To check: statement, Republican Policy Committee, Mar. 2, 1966, 89th Congress, box 37/6, Rhodes Papers (cited by [[w.johns-vietnams-second-front]], 108 n.124). Names: Johnson. Check: Johns names the Republican Policy Committee; his source is in Rhodes''s papers, Rhodes the chairman of the House''s.'
