    date: '1966-03-01'
    thread: vietnam-supplemental
    c: 'Fulbright in the Senate, as the debate ends: a neutralized Southeast Asia, the United States and China both withdrawing their military power; to bring China to it, enclaves on the coast as Gavin proposed. Mar. 19, he writes Johnson to consider such a plan.'
    n: '[112 Cong. Rec. 4379](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf) (1966). [*New York Times*, Mar. 2, 1966](https://timesmachine.nytimes.com/timesmachine/1966/03/02/issue.html). [[w.gibbons-u-s-government-and]], IV, 259; [[w.woods-fulbright]], 412 (a "general accommodation" with China). The Senate sat from noon to 6:33 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1), [D74](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=72). Names: Fulbright, Gavin, Johnson.'
