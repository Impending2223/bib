  - id: cal.1966-03-01.vietnam-congress-2
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-congress
    c: 'The Senate''s debate on Morse''s amendment. Russell: "By instinct and inclination ... I am an isolationist," and "a congressional man," but the resolution was "a very great grant of power"; "I am going to throw the rope"; a vote against repeal reaffirms it. Javits: the resolution "not juridically necessary," the President''s power constitutional; if he abuses it, "deny him the money." Fulbright: the motion forces a reaffirmation "of policies which I do not wish to reaffirm." Mansfield moves to table: "We are in too deep now."'
    n: '[112 Cong. Rec. 4370–84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=48) (Senate, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 257–58. [[w.mann-grand-delusion]], 504–05. Check: each speaker''s page (Russell about 4370, Javits 4375, Mansfield 4377, Fulbright 4384). See [[cal.1966-03-01.vietnam]]. Names: Russell, Javits, Fulbright, Mansfield, Morse.'
    src:
      c: 4f04e664
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=48: all'
        - 'w.gibbons-u-s-government-and IV, 257–58: all'
        - 'w.mann-grand-delusion 504–05: G-H'
        - 'via w.mann-grand-delusion 505 n.26: H'
    tags: [name:russell-richard-b, name:javits-jacob-k, name:fulbright-j-william, name:mansfield-mike, name:morse-wayne]
  - id: cal.1966-03-01.vietnam-congress-3
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-congress
    c: 'Nelson and McGovern, critics of the war, vote to table and for the bill: Nelson, withdrawing the commitment not in the national interest, nor should it be broadened; McGovern, "since we have sent 300,000 men to southeast Asia, we have no practical alternative." McCarthy, against tabling, would have voted against repeal too: such resolutions "should not be approved in the future," the Senate no "kind of garden club."'
    n: '[112 Cong. Rec. 4404, 4409, 4412](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82) (Senate, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 258–59. Check: Nelson''s page. See [[cal.1966-03-01.vietnam-congress-2]]. Names: Nelson, McGovern, McCarthy.'
    src:
      c: ea33181f
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82: all'
        - 'w.gibbons-u-s-government-and IV, 258–59: all'
    tags: [name:nelson-gaylord-a, name:mcgovern-george, name:mccarthy-eugene-j]
  - id: cal.1966-03-01.vietnam-congress-4
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-congress
    c: 'House. Cohelan presents a statement of 78 members, Democrats, nearly all liberals: they will vote for the authorization, which the troops require, but "reject any contention that approval of this legislation will constitute a mandate for unrestrained or indiscriminate enlargement of the military effort."'
    n: '[112 Cong. Rec. 4431](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-2.pdf#page=18) (House, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 259–60 n.129. See [[cal.1966-03-01.vietnam]].'
    src:
      c: b08e4c87
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-2.pdf#page=18: all'
        - 'w.gibbons-u-s-government-and IV, 259–60: A'
        - 'via w.gibbons-u-s-government-and IV, 260 n.129: all'
  - id: cal.1966-03-02.transportation
    when: Mar. 2
    date: '1966-03-02'
    thread: transportation
    c: 'Message on transportation. A Cabinet Department of Transportation: the Federal Aviation Agency whole; the Coast Guard from the Treasury; the Bureau of Public Roads; the Maritime Administration; the safety work of the ICC and the CAB; the St. Lawrence Seaway corporation, the Alaska Railroad. Almost 100,000 employees, almost $6 billion. A Traffic Safety Act: $700 million over six years for State programs under federal standards; safety standards for new cars, voluntary for two years, then, if need be, prescribed. The tire safety bill, S. 2669, urged. "50,000 highway deaths this year."'
    n: 'Special Message to the Congress on Transportation, [1966 Pub. Papers 250](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=326) (Mar. 2, 1966). To check: [[w.davis-department-of-transportation]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.eastman-styling-vs-safety]]. See [[cal.1965-07-13.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-02.transition-and-staff
    when: Mar. 2–4
    date: '1966-03-02'
    thread: transition-and-staff
    c: 'NSAM 341: the Secretary of State given "overall direction, coordination and supervision" of interdepartmental activities overseas, forces under an area commander excepted. A Senior Interdepartmental Group, the Under Secretary of State its executive chairman, with Defense, AID, the CIA, the Joint Chiefs, USIA, and the national security assistant; Interdepartmental Regional Groups under the Assistant Secretaries. The SIG takes over the Special Group (Counterinsurgency). Taylor''s design. Announced Mar. 4.'
    n: 'NSAM 341, FRUS 1964–68, XXXIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v33/d56), [58](https://history.state.gov/historicaldocuments/frus1964-68v33/d58). [[w.herring-lbj-and-vietnam]], 12–13 (Taylor''s design, worked out with U. Alexis Johnson; the SIG and its members; the regional groups). To check: [[w.taylor-swords-and-plowshares]]; [[w.johnson-right-hand-of-power]]; Bromley Smith''s oral history, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 13 n.35). Names: Taylor.'
    src:
      c: a66628bb
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v33/d56: all'
        - 'w.herring-lbj-and-vietnam 12–13: A-C, E'
        - 'via w.herring-lbj-and-vietnam 13 n.35: A-C, E'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1966-03-02.press-and-broadcasting-ca
    when: Mar. 2
    date: '1966-03-02'
    thread: press-and-broadcasting
    also: [state-constitutions]
    c: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf): the California Supreme Court holds the "Free Television Act," Proposition 15, an abridgment of free speech under the State and federal Constitutions; void. 6–1, Mosk dissenting.'
    n: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf) (1966). See [[cal.1964-11-03.state-constitutions-ca]].'
    tags: [state:ca]
  - id: cal.1966-03-02.vietnam-congress
    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam-congress
    c: 'Humphrey meets the Foreign Relations Committee informally in Mansfield''s office, Johnson having refused to let him testify: Fulbright presses him on his pledge to Thailand and on the NLF; Humphrey, by Cooper''s account, near tears. Fulbright at the end: "You know we all love you."'
    n: '[[w.gibbons-u-s-government-and]], IV, 236–37. Made public: the Historical Series, 1993. [[w.mann-grand-delusion]], 502 (by one account, Humphrey in tears). To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 411–67 (1993); CRS Interview with Chester Cooper, Apr. 10, 1979, Congressional Research Service (cited by [[w.gibbons-u-s-government-and]], IV, 237 n.73). Names: Humphrey, Mansfield, Johnson, Fulbright, Cooper.'
