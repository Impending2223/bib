  - id: cal.1966-03-02.vietnam-3
    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam
    c: 'Lodge''s weekly telegram, 3159: Kỳ writing Robert Kennedy against his thesis; North Vietnamese prisoners "sure there would be no U.S. or GVN invasion." "Might it not be well to take some action which would make Hanoi think we were planning an invasion?"'
    n: '[FRUS 1964–68, IV, doc. 88](https://history.state.gov/historicaldocuments/frus1964-68v04/d88). [[w.gibbons-u-s-government-and]], IV, 197 (the invasion). Made public: FRUS 1964–68, IV (1998). Names: Lodge, Nguyễn Cao Kỳ, Robert Kennedy.'
