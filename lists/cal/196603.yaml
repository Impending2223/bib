  - id: cal.1966-03-02.vietnam
    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam
    also: [vietnam-congress]
    c: 'McPherson to Johnson, "For what it''s worth": Fulbright''s nephew Teasdale writes that the Senator bears the President no personal feeling and a reconciliation might be managed. Johnson: "Pursue this." Moyers, on Teasdale''s next letter: reconciliation is being sought "through other personal channels."'
    n: '[[w.gibbons-u-s-government-and]], IV, 237–39. To check: McPherson to Johnson, Mar. 2, 1966, with Teasdale''s letters (LBJ Library, Office Files of Harry McPherson); McPherson to Moyers, with Teasdale to McPherson and Teasdale to Mrs. Fulbright, Feb. 28, 1966; Moyers''s reply, Office Files of Harry McPherson, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 238 n.75). Names: McPherson, Johnson, Fulbright, Moyers.'
