    tags: [name:nguyen-chanh-thi, name:nguyen-cao-ky, name:lodge-henry-cabot]
  - id: cal.1966-03-10.india-and-china
    when: Mar. 10
    date: '1966-03-10'
    thread: china
    c: 'The China hearings: Fairbank of Harvard.'
    n: 'Daily Digest, [112 Cong. Rec. D104](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=102). *U.S. Policy with Respect to Mainland China* (1966) (Check the pages). See [[cal.1966-03-08.india-and-china]]. Names: Fairbank.'
    tags: [name:fairbank-john-k]
  - id: cal.1966-03-10.vietnam-supplemental
    when: Mar. 10
    date: '1966-03-10'
    thread: vietnam-supplemental
    c: The Senate passes the supplemental foreign assistance authorization, H.R. 12169, [82–2](https://voteview.com/rollcall/RS0890281), Morse and Gruening against.
    n: '[112 Cong. Rec., Senate, Mar. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-1-1.pdf), 5563. [[w.gibbons-u-s-government-and]], IV, 263. See [[cal.1966-02-24.vietnam-supplemental]]. Names: Morse, Gruening.'
    tags: [name:morse-wayne, name:gruening-ernest]
  - id: cal.1966-03-11.india-and-china
    when: Mar. 11–12
    date: '1966-03-11'
    thread: indonesia
    c: 'Djakarta. Sukarno, after weeks of student demonstrations and with army units about the capital, signs an order of Mar. 11 giving Suharto authority to restore order. Mar. 12, Suharto dissolves and bans the PKI. The embassy: "its own peculiar form of military coup"; Sukarno kept as a figurehead. Komer to Johnson: follow through with "a few thousand tons of surplus wheat or rice."'
    n: 'FRUS 1964–68, XXVI, docs. [199](https://history.state.gov/historicaldocuments/frus1964-68v26/d199), [200](https://history.state.gov/historicaldocuments/frus1964-68v26/d200), [201](https://history.state.gov/historicaldocuments/frus1964-68v26/d201), [203](https://history.state.gov/historicaldocuments/frus1964-68v26/d203). To check: [[w.simpson-economists-with-guns]]; [[w.roosa-pretext-for-mass-murder]]; [[w.robinson-killing-season]]. See [[cal.1965-10-01.india-and-china]]. Names: Komer, Sukarno, Suharto, Johnson.'
    tags: [name:sukarno, name:suharto, name:komer-robert-w, name:johnson-lyndon-b]
  - id: cal.1966-03-11.opinion
    when: Mar. 11
    date: '1966-03-11'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Feb. 10–15: Robert Kennedy 54 percent, Nixon 41, undecided 5. Independents: Nixon 52, Kennedy 39. South: 46 and 46. College-educated: Nixon 53, Kennedy 43. Catholics: Kennedy 67, Nixon 29; Protestants: Nixon 48, Kennedy 47.'
    n: '[[w.gallup-poll]], III, 1993–94. Names: Robert Kennedy, Nixon.'
    tags: [name:kennedy-robert-f, name:nixon-richard-m]
  - id: cal.1966-03-11.europe-and-the-alliance-france
    when: Mar. 11
    date: '1966-03-11'
    thread: europe-and-the-alliance-france
    c: 'The French aide-mémoire to the United States: the alliance''s organization no longer answers, as far as France is concerned, to conditions "fundamentally different from those of 1949."'
    n: FRUS 1964–68, XIII, docs. [141](https://history.state.gov/historicaldocuments/frus1964-68v13/d141), [142](https://history.state.gov/historicaldocuments/frus1964-68v13/d142). [[w.current-documents-1966]], 317–323 (Check the page). See [[cal.1966-03-07.europe-and-the-alliance]].
  - id: cal.1966-03-11.vietnam-struggle
    when: Mar. 11
    date: '1966-03-11'
    thread: vietnam-struggle
    c: Rallies for Thi at Đà Nẵng; strikes and closed schools spread to Huế.
    n: '[*New York Times*, Mar. 12, 1966](https://timesmachine.nytimes.com/timesmachine/1966/03/12/issue.html). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Chánh Thi.'
    tags: [name:nguyen-chanh-thi, place:da-nang, place:hue]
  - id: cal.1966-03-12.vietnam-us
    when: Mar. 12
    date: '1966-03-12'
    thread: vietnam
    also: [states-and-cities]
    c: 'The governors at the White House, briefed on Vietnam by Rusk, McNamara, Taylor, Wheeler and Humphrey. A resolution of Rhodes''s, adopted unanimously by those present, read by Reed of Maine, the conference''s chairman: they "wholeheartedly support and endorse the policies and programs in Vietnam." Hatfield absent.'
    n: 'The President''s News Conference Held at the Close of the Governors'' Conference, [1966 Pub. Papers 310](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=386) (Mar. 12, 1966). See [[cal.1965-07-28.vietnam-us]]. Names: Rusk, McNamara, Taylor, Wheeler, Humphrey, Rhodes, Reed, Hatfield.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:wheeler-earle, name:humphrey-hubert-h, name:rhodes-james-a, name:reed-john-h, name:hatfield-mark-o]
  - id: cal.1966-03-12.vietnam-struggle
    when: Mar. 12
    date: '1966-03-12'
    thread: vietnam-struggle
    c: 'The Unified Buddhist Church, Tâm Châu presiding: civilian government, a National Assembly, generals back to their military duties.'
    n: 'FRUS 1964–68, IV, docs. [94](https://history.state.gov/historicaldocuments/frus1964-68v04/d94), [95](https://history.state.gov/historicaldocuments/frus1964-68v04/d95). See [[cal.1966-03-10.vietnam]]. Names: Tâm Châu.'
    tags: [name:tam-chau]
  - id: cal.1966-03-13.opinion
    when: Mar. 13
    date: '1966-03-13'
    thread: opinion
    also: [foreign-aid, vietnam]
    c: 'Gallup, Feb. 10–15: foreign aid in general: for 53 percent, against 35. The kinds favored: training teachers and building schools 65; better farming methods 61; hospitals, doctors and nurses, medicine 61; birth control information 43; surplus food 41; factories and industries 33; highways and railroads 21; military strength 18. A country receiving aid that fails to support the United States in a major decision such as Vietnam: continue the aid 16, reduce it 30, cut it off 45.'
    n: '[[w.gallup-poll]], III, 1995.'
  - id: cal.1966-03-13.india-and-china
    when: Mar. 13
    date: '1966-03-13'
    thread: china
    c: 'Humphrey on *Meet the Press*: toward China, containment "without necessarily isolation" (Check the words).'
    n: 'Check: the transcript. See [[cal.1966-03-08.india-and-china]]. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1966-03-13.vietnam
    when: Mar. 13
    date: '1966-03-13'
    thread: vietnam
    c: 'Johnson has Nixon to the White House on the war, by Nixon''s account: Nixon for stronger action to bring Hanoi to the table; his criticism in the campaign not "directed personally at you." Check the date.'
    n: '[[w.johns-vietnams-second-front]], 220. To check: [[w.nixon-rn]]. Names: Johnson, Nixon.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1966-03-14.vietnam-support
    when: Mar. 14
    date: '1966-03-14'
    thread: vietnam-support
    also: [vietnam-congress]
    c: 'Johnson with DeLoach: the FBI to report the contacts of members of Congress and others with foreign embassies, the Soviet above all; the protest and the hearings stirred by foreign officials; six Senators, Fulbright, Morse, Robert Kennedy, Gruening, Clark and Aiken, had been to the Soviet embassy or seen its ambassador. A 67-page list follows, Mar. 22, and reports every two weeks to 1969.'
    n: '[[w.gibbons-u-s-government-and]], IV, 228. Made public: the Church Committee''s report, 1976; Theoharis, 1978. To check: DeLoach''s report, as printed in Athan G. Theoharis, *Spying on Americans*, 177–78 (1978). Names: Johnson, DeLoach, Fulbright, Morse, Robert Kennedy, Gruening, Clark, Aiken.'
    tags: [name:johnson-lyndon-b, name:deloach-cartha, name:fulbright-j-william, name:morse-wayne, name:kennedy-robert-f, name:gruening-ernest, name:clark-joseph-s, name:aiken-george-d]
  - id: cal.1966-03-15.economy
    when: Mar. 15
    date: '1966-03-15'
    thread: economy-tax-adjustment
    also: [welfare]
    c: 'Tax Adjustment Act signed at night, [80 Stat. 38](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg38.pdf): some $6 billion over fifteen months, Johnson says. The excise cuts of Jan. 1 undone to Apr. 1, 1968: new cars back to 7 percent, telephone service to 10. Graduated withholding from May 1; corporations'' estimated tax paid sooner; self-employment tax in the individual''s estimate. $35 a month to some 370,000 persons 72 and over outside Social Security, from Prouty''s amendment, adopted in the Senate Mar. 8, [45–40](https://voteview.com/rollcall/RS0890275). No deduction for advertising in party convention programs. The Senate passed it Mar. 9, [79–9](https://voteview.com/rollcall/RS0890279); the conference report Mar. 15: House, [288–102](https://voteview.com/rollcall/RH0890221); Senate, [72–5](https://voteview.com/rollcall/RS0890284). An estimate in the Record, the Treasury''s or the Joint Committee''s, of the revenue gained in the year after enactment: $5.0 billion, 0.60 percent of GDP.'
    n: 'Statement by the President Upon Signing the Tax Adjustment Act of 1966, [1966 Pub. Papers 326](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=402) (Mar. 15, 1966). [[w.tempalski-revenue-effects-of-major]], Table 1, p. 15; [[w.zelizer-taxing-america]], 257 (corporate payments speeded). To check: [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]]. Names: Johnson, Prouty.'
    tags: [name:johnson-lyndon-b, name:prouty-winston-l, bill:tax-adjustment-1966]
  - id: cal.1966-03-15.vietnam-supplemental
    when: Mar. 15
    date: '1966-03-15'
    thread: vietnam-supplemental
    also: [defense]
    c: Supplemental military authorization signed, [80 Stat. 36](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg36.pdf). The appropriation, some $13 billion, before Congress later the same day.
    n: Remarks at the Signing of the Supplemental Military Authorization Bill, [1966 Pub. Papers 321](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=397) (Mar. 15, 1966). See [[cal.1966-01-19.vietnam]]; [[cal.1966-03-15.congress]] (the House's vote).
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-15.congress
    when: Mar. 15
    date: '1966-03-15'
    thread: congress
    also: [vietnam-supplemental]
    c: The House passes the supplemental defense appropriation, H.R. 13546, [389–3](https://voteview.com/rollcall/RH0890222), Burton, Conyers and Ryan against.
    n: '[112 Cong. Rec., House, Mar. 15, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-3-1.pdf), 5802–23. [[w.gibbons-u-s-government-and]], IV, 263. Names: Burton, Conyers, Ryan.'
    tags: [name:burton-phillip, name:conyers-john-jr, name:ryan-william-f]
  - id: cal.1966-03-16.space
    when: Mar. 16
    date: '1966-03-16'
    thread: space
    c: 'Gemini 8: Armstrong and Scott dock with an Agena target some six and a half hours after launch, the first docking in orbit. A thruster sticks open; the joined craft tumble; Armstrong casts off the Agena and steadies the capsule with the reentry thrusters. Down in the western Pacific after some ten and a half hours, the flight cut short.'
    n: 'Statement by the President Following the Safe Return of the Gemini 8 Astronauts, [1966 Pub. Papers 331](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=407) (Mar. 16, 1966). To check: [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]. Names: Armstrong, Scott.'
    tags: [name:armstrong-neil-a, name:scott-david-r]
  - id: cal.1966-03-16.foreign-aid
    when: Mar. 16
    date: '1966-03-16'
    thread: foreign-aid
    c: 'Asian Development Bank Act signed, [80 Stat. 71](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg71.pdf): American membership, and $200 million for 20,000 shares of the bank''s capital. Johnson: "This billion dollar bank."'
    n: 'Remarks at the Signing of the Asian Development Bank Act, [1966 Pub. Papers 327](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=403) (Mar. 16, 1966). See [[cal.1965-04-07.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-16.jobs-and-wages-ca
    when: Mar. 16
    date: '1966-03-16'
    thread: jobs-and-wages-farm-workers
    also: [robert-kennedy]
    c: The Senate's Subcommittee on Migratory Labor at Delano, Cal.; Robert Kennedy questions the Kern County sheriff on the arrests of pickets.
    n: 'Check: the hearing''s record. [[w.schlesinger-robert-kennedy-and-his]], 790–91. To check: [[w.pawel-crusades-of-cesar-chavez]]; [[w.bardacke-trampling-out-the-vintage]]. See [[cal.1965-09-08.jobs-and-wages-ca]]. Names: Robert Kennedy.'
    tags: [state:ca, name:kennedy-robert-f]
  - id: cal.1966-03-16.vietnam-struggle
    when: Mar. 16
    date: '1966-03-16'
    thread: vietnam-struggle
    c: 'Johnson''s view, by cable to Lodge for Trí Quang and the other Buddhist leaders: "this is not the time to overturn everything"; if they persist in their "irresponsible and destructive course," they lose American sympathy and may bring "chaos and anarchy," in which American support could no longer be effective.'
    n: 'FRUS 1964–68, IV, docs. [96](https://history.state.gov/historicaldocuments/frus1964-68v04/d96), [97](https://history.state.gov/historicaldocuments/frus1964-68v04/d97) (Smith''s note to Johnson). [[w.gibbons-u-s-government-and]], IV, 271–72. See [[cal.1966-03-10.vietnam]]. Names: Johnson, Lodge, Thích Trí Quang.'
    tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:thich-tri-quang]
  - id: cal.1966-03-17.middle-east
    when: Mar. 17
    date: '1966-03-17'
    thread: middle-east
    c: 'Aircraft for Israel and Jordan. Harman''s letter: Israel to buy 48 A-4 Skyhawks, and its policy not to be the first to develop nuclear weapons in the region. Jordan buys aircraft too.'
    n: '[FRUS 1964–68, XVIII, doc. 271](https://history.state.gov/historicaldocuments/frus1964-68v18/d271). Made public: the State Department, May 1966 (Check the date). To check: [[w.spiegel-other-arab-israeli-conflict]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.levey-united-states-skyhawk-sale]]. See [[cal.1965-02-25.middle-east]]. Names: Harman.'
    tags: [name:harman-avraham]
  - id: cal.1966-03-17.jobs-and-wages-farm-workers
    when: Mar. 17
    date: '1966-03-17'
    thread: jobs-and-wages-farm-workers
    c: Chavez and the grape strikers set out from Delano on foot for Sacramento.
    n: '[*New York Times*, Mar. 18, 1966](https://timesmachine.nytimes.com/timesmachine/1966/03/18/issue.html). See [[cal.1966-03-16.jobs-and-wages-ca]]. Names: Chavez.'
    tags: [state:ca, name:chavez-cesar]
  - id: cal.1966-03-17.vietnam-struggle
    when: Mar. 17
    date: '1966-03-17'
    thread: vietnam-struggle
    c: 'Lodge with Trí Quang, two hours, and gives him Johnson''s view. Trí Quang: no coup, no sudden change; a national convention as soon as possible; not government by the military. By Lodge''s account he answers that a change of government now would make Vietnam seem "unfit for self-government."'
    n: '[[w.gibbons-u-s-government-and]], IV, 272–73. To check: Saigon to Washington 3371, Mar. 17, 1966 (State, Central File, Pol 27 Viet S). See [[cal.1966-03-10.vietnam]]. Names: Lodge, Thích Trí Quang, Johnson.'
    tags: [name:lodge-henry-cabot, name:thich-tri-quang, name:johnson-lyndon-b]
  - id: cal.1966-03-18.europe-and-the-alliance-france
    when: Mar. 18
    date: '1966-03-18'
    thread: europe-and-the-alliance-france
    c: 'The Declaration of the Fourteen: the treaty and the organization under it both essential (Check the words).'
    n: '[[w.department-of-state-bulletin]], [Apr. 4, 1966, 536](https://archive.org/details/departmentofstat5466unit/page/536/mode/1up). [[w.current-documents-1966]], 317–323 (Check the page). See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-03-18.india-and-china-indonesia
    when: Mar. 18
    date: '1966-03-18'
    thread: indonesia
    c: Djakarta. Subandrio and other ministers arrested (Check).
    n: 'Check: the day. See [[cal.1966-03-11.india-and-china]]. Names: Subandrio.'
    tags: [name:subandrio]
  - id: cal.1966-03-18.open-housing
    when: Mar. 18
    date: '1966-03-18'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Johnson with the civil rights leaders, King among them: a new civil rights bill, on juries, violence against civil rights workers, and discrimination in selling and renting housing. Katzenbach: the housing title "particularly difficult," though "not impossible," Dirksen likely against it.'
    n: '[[w.garrow-bearing-the-cross]], 467. The message: [[cal.1966-04-28.open-housing]]. Names: Johnson, King, Katzenbach, Dirksen.'
    tags: [name:johnson-lyndon-b, name:king-martin-luther-jr, name:katzenbach-nicholas, name:dirksen-everett]
  - id: cal.1966-03-19.vietnam-struggle
    when: Mar. 19
    date: '1966-03-19'
    thread: vietnam-struggle
    c: The strikes reach Saigon. The Struggle Movement holds Đà Nẵng and Huế.
    n: FRUS 1964–68, IV, docs. [99](https://history.state.gov/historicaldocuments/frus1964-68v04/d99), [100](https://history.state.gov/historicaldocuments/frus1964-68v04/d100). See [[cal.1966-03-10.vietnam]].
    tags: [place:saigon, place:da-nang, place:hue]
  - id: cal.1966-03-20.opinion
    when: Mar. 20
    date: '1966-03-20'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Mar. 3–8: the party one would like to see win the congressional district, by region: South, Democratic 74 percent, Republican 26; East 56 and 44; Midwest 51 and 49; West 50 and 50.'
    n: '[[w.gallup-poll]], III, 1996.'
  - id: cal.1966-03-20.japan-and-korea
    when: Mar. 20
    date: '1966-03-20'
    thread: korea
    also: [vietnam]
    c: Korea's National Assembly approves a second division and a regiment for Vietnam, 95–27, 3 abstaining, after a night's debate. Before it, Brown's letters to the Foreign Minister on the American commitment to Korea's defense (the Brown memorandum, Mar. 7; check the date), and Johnson's letter of thanks to Park, Mar. 11.
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [77](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d77), [78](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d78), [81](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d81). To check: [[w.blackburn-mercenaries-and-lyndon-johnsons]]. See [[cal.1966-02-22.vietnam-humphrey]]; [[cal.1965-08-13.japan-and-korea]]. Names: Brown, Johnson, Park.'
    tags: [name:brown-winthrop-g, name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1966-03-21.court
    when: Mar. 21
    date: '1966-03-21'
    thread: court
    c: 'Obscenity. *Memoirs v. Massachusetts*, [383 U.S. 413](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383413/usrep383413.pdf): *Fanny Hill* not obscene; Brennan''s plurality: a book must be "utterly without redeeming social value"; Clark, Harlan, White dissent. *Ginzburg v. United States*, [383 U.S. 463](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383463/usrep383463.pdf): Ginzburg''s conviction for mailing *Eros*, *Liaison*, and *The Housewife''s Handbook on Selective Promiscuity* affirmed, 5–4, for "pandering"; Brennan for the Court; Black, Douglas, Harlan, Stewart dissent. *Mishkin v. New York*, [383 U.S. 502](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383502/usrep383502.pdf): affirmed, 6–3.'
    n: 'To check: [[w.grazia-girls-lean-back-everywhere]]; [[w.powe-warren-court-and-american]]. Names: Ginzburg, Brennan.'
    tags: [name:ginzburg-ralph, name:brennan-william-j-jr]
  - id: cal.1966-03-21.program
    when: Mar. 21
    date: '1966-03-21'
    thread: program
    c: 'Message on consumer interests: truth in lending, the price of credit stated; fair packaging and labeling; hazardous household substances and children''s toys banned; warnings on drugs, cosmetics, and food in pressurized cans; more for the Food and Drug Administration.'
    n: 'Special Message to the Congress on Consumer Interests, [1966 Pub. Papers 336](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=412) (Mar. 21, 1966). See [[cal.1964-02-05.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-22.transportation
    when: Mar. 22
    date: '1966-03-22'
    thread: transportation-auto-safety
    c: 'Ribicoff''s Subcommittee on Executive Reorganization. Roche, president of General Motors: GM, through its lawyers, had private detectives look into Nader, author of *Unsafe at Any Speed*; he apologizes. GM had owned to an inquiry Mar. 9, after press reports that Nader was followed (Check). Nader testifies the same day.'
    n: 'Daily Digest, [112 Cong. Rec. D128](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=126). *Federal Role in Traffic Safety: Hearings before the Subcommittee on Executive Reorganization of the Senate Committee on Government Operations*, 89th Cong., 2d sess. (1966) (Check the part). To check: [[w.mccarry-citizen-nader]]; [[w.martin-nader]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]. See [[cal.1966-03-02.transportation]]. See [[cal.1965-11-30.transportation]]. Names: Ribicoff, Nader, Roche.'
    tags: [name:ribicoff-abraham, name:nader-ralph, name:roche-james-m]
  - id: cal.1966-03-22.economy
    when: Mar. 22
    date: '1966-03-22'
    thread: economy
    c: 'Inflation. News conference: economists urge a tax increase; Johnson cites slowing signs (retail sales, durable orders, housing starts at a three-year low) and watches.'
    n: 'The President''s News Conference, [1966 Pub. Papers 343](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=419) (Mar. 22, 1966). To check: [[w.okun-political-economy-of-prosperity]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1966-03-15.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-22.legislatures-ny
    when: Mar. 22
    date: '1966-03-22'
    thread: legislatures
    also: [court]
    c: 'New York. The Court of Appeals adopts the districts drawn by its commission of five, Marden of the American Bar Association chairman, named Feb. 23 when the Republican Senate and the Democratic Assembly could not agree: a Senate of 57, an Assembly of 150, in force without the legislature''s vote.'
    n: '*Matter of Orans*, [17 N.Y.2d 107](https://static.case.law/ny-2d/17/case-pdfs/0107-01.pdf) (1966). [*New York Times*, Mar. 15, 1966](https://www.nytimes.com/1966/03/15/archives/commission-ends-redistricting-job-legislators-await-details-of-plan.html). [[w.dullea-charter-revision-in-the]], 79. See [[cal.1965-11-02.legislatures-ny]].'
    tags: [state:ny]
  - id: cal.1966-03-22.amendments
    when: Mar. 22
    date: '1966-03-22'
    thread: amendments
    also: [court, congress]
    c: 'Dirksen introduces S.J. Res. 148, for himself and sixteen others: an amendment to permit voluntary prayer in the public schools. "Nothing contained in this Constitution shall prohibit the authority administering any school ... from providing for or permitting the voluntary participation by students or others in prayer." No authority to prescribe a prayer''s form or content. Thirty-nine cosponsors by the session''s end.'
    n: '[112 Cong. Rec. 6477](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-7-1.pdf#page=42) (1966); History of Bills, 1966, [S.J. Res. 148](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt22/pdf/GPO-CRECB-1966-pt22-2.pdf#page=47). To check: [[w.dierenfield-battle-over-school-prayer]]; [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1962-06-25.court]]; [[cal.1965-08-04.court]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-03-22.vietnam-supplemental
    when: Mar. 22
    date: '1966-03-22'
    thread: vietnam-supplemental
    also: [defense]
    c: The Senate passes the supplemental defense appropriation, H.R. 13546, [87–2](https://voteview.com/rollcall/RS0890286).
    n: 'Check: the Record''s page. [[w.gibbons-u-s-government-and]], IV, 263. See [[cal.1966-01-19.vietnam]].'
