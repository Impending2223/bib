        - 'w.gibbons-u-s-government-and IV, 257–58: all'
        - 'w.mann-grand-delusion 504–05: G-H'
        - 'via w.mann-grand-delusion 505 n.26: H'
    tags: [name:russell-richard-b, name:javits-jacob-k, name:fulbright-j-william, name:mansfield-mike, name:morse-wayne]
