# Cal. LXXVII March 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXVII
entries:
  - id: cal.1966-03-01.vietnam
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: 'The war''s supplemental authorization. The Senate tables Morse''s amendment to repeal the Southeast Asia resolution of Aug. 1964, [92–5](https://voteview.com/rollcall/RS0890270): Morse, Gruening, Fulbright, McCarthy, Young of Ohio the five. Gruening''s, to keep draftees from Southeast Asia''s combat areas without Congress''s consent, tabled [94–2](https://voteview.com/rollcall/RS0890271). The authorization, $4.8 billion for aircraft, missiles, and construction, passes, [93–2](https://voteview.com/rollcall/RS0890272); the House''s, [393–4](https://voteview.com/rollcall/RH0890216).'
    n: 'Check: the Record''s pages. [FRUS 1964–68, IV, doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v04/d87) (Johnson to Mansfield by telephone, 9:42 a.m.: the motion to table must not "imply any dilution" of the resolution). [[w.gibbons-u-s-government-and]], IV, 251–59. To check: [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]. See [[cal.1966-01-19.vietnam]]; [[cal.1966-02-04.vietnam]]. Names: Morse, Gruening, Fulbright, McCarthy, Young.'
    tags: [name:morse-wayne, name:gruening-ernest, name:fulbright-j-william, name:mccarthy-eugene-j, name:young-stephen-m]
  - id: cal.1966-03-01.welfare-ca
    when: Mar. 1
    date: '1966-03-01'
    thread: welfare
    also: [health]
    c: 'California. Medi-Cal begins: medical care for those on public assistance and the medically needy, under Title XIX of the Social Security Act, enacted in the Legislature''s special session of 1965. Check the date, the act and its signing.'
    n: '[Cal. Stats. 1965, 2d Ex. Sess., ch. 4, 103](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1966/66Vol1_65secondextra.pdf#page=101) (approved Nov. 12, 1965). To check: [[w.stevens-welfare-medicine-in-america]]; [[w.rarick-california-rising]]. See [[cal.1965-07-30.medicare]].'
    tags: [state:ca]
  - id: cal.1966-03-01.vietnam-2
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Ball lunches with McGovern, Clark, Ribicoff and Tydings, at McGovern''s asking, before the vote; the "dissenting Senators" offer a "Gavin-Kennan" policy, "staying where we are with what we have on the ground"; Ball: "totally unrealistic."'
    n: '[[w.gibbons-u-s-government-and]], IV, 258 n.127. To check: Ball to Johnson, Mar. 1, 1966 (State, Lot File 74 D 272). Names: Ball, McGovern, Clark, Ribicoff, Tydings.'
    tags: [name:ball-george-w, name:mcgovern-george, name:clark-joseph-s, name:ribicoff-abraham, name:tydings-joseph-d]
  - id: cal.1966-03-01.vietnam-congress
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-congress
    c: 'Fulbright in the Senate, as the debate ends: a neutralized Southeast Asia, the United States and China both withdrawing their military power; to bring China to it, enclaves on the coast as Gavin proposed. Mar. 19, he writes Johnson to consider such a plan.'
    n: '[112 Cong. Rec., Senate, Mar. 1, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf), 4379 ff. *New York Times*, Mar. 2, 1966. [[w.gibbons-u-s-government-and]], IV, 259. Names: Fulbright, Gavin, Johnson.'
    tags: [name:fulbright-j-william, name:gavin-james-m, name:johnson-lyndon-b]
  - id: cal.1966-03-02.transportation
    when: Mar. 2
    date: '1966-03-02'
    thread: transportation
    c: 'Message on transportation. A Cabinet Department of Transportation: the Federal Aviation Agency whole; the Coast Guard from the Treasury; the Bureau of Public Roads; the Maritime Administration; the safety work of the ICC and the CAB; the St. Lawrence Seaway corporation, the Alaska Railroad. Almost 100,000 employees, almost $6 billion. A Traffic Safety Act: $700 million over six years for State programs under federal standards; safety standards for new cars, voluntary for two years, then, if need be, prescribed. The tire safety bill, S. 2669, urged. "50,000 highway deaths this year."'
    n: 'Special Message to the Congress on Transportation, [1966 Pub. Papers 250](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=326) (Mar. 2, 1966). To check: [[w.davis-department-of-transportation]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mashaw-struggle-for-auto-safety]]; [[w.eastman-styling-vs-safety]]. See [[cal.1965-07-13.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-02.transition-and-staff
    when: Mar. 2–4
    date: '1966-03-02'
    thread: transition-and-staff
    c: 'NSAM 341: the Secretary of State given "overall direction, coordination and supervision" of interdepartmental activities overseas, forces under an area commander excepted. A Senior Interdepartmental Group, the Under Secretary of State its executive chairman, with Defense, AID, the CIA, the Joint Chiefs, USIA, and the national security assistant; Interdepartmental Regional Groups under the Assistant Secretaries. The SIG takes over the Special Group (Counterinsurgency). Taylor''s design. Announced Mar. 4.'
    n: 'NSAM 341, FRUS 1964–68, XXXIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v33/d56), [58](https://history.state.gov/historicaldocuments/frus1964-68v33/d58). To check: [[w.taylor-swords-and-plowshares]]; [[w.johnson-right-hand-of-power]]. Names: Taylor.'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1966-03-02.press-and-broadcasting-ca
    when: Mar. 2
    date: '1966-03-02'
    thread: press-and-broadcasting
    also: [state-constitutions]
    c: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf): the California Supreme Court holds the "Free Television Act," Proposition 15, an abridgment of free speech under the State and federal Constitutions; void. 6–1, Mosk dissenting.'
    n: '*Weaver v. Jordan*, [64 Cal. 2d 235](https://static.case.law/cal-2d/64/case-pdfs/0235-01.pdf) (1966). See [[cal.1964-11-03.state-constitutions-ca]].'
    tags: [state:ca]
  - id: cal.1966-03-02.vietnam-congress
    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam-congress
    c: 'Humphrey meets the Foreign Relations Committee informally in Mansfield''s office, Johnson having refused to let him testify: Fulbright presses him on his pledge to Thailand and on the NLF; Humphrey, by Cooper''s account, near tears. Fulbright at the end: "You know we all love you."'
    n: '[[w.gibbons-u-s-government-and]], IV, 236–37. Made public: the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 411–67 (1993). Names: Humphrey, Mansfield, Johnson, Fulbright, Cooper.'
    tags: [name:humphrey-hubert-h, name:mansfield-mike, name:johnson-lyndon-b, name:fulbright-j-william, name:cooper-chester-l]
  - id: cal.1966-03-02.vietnam
    when: Mar. 2
    date: '1966-03-02'
    thread: vietnam
    also: [vietnam-congress]
    c: 'McPherson to Johnson, "For what it''s worth": Fulbright''s nephew Teasdale writes that the Senator bears the President no personal feeling and a reconciliation might be managed. Johnson: "Pursue this." Moyers, on Teasdale''s next letter: reconciliation is being sought "through other personal channels."'
    n: '[[w.gibbons-u-s-government-and]], IV, 237–39. To check: McPherson to Johnson, Mar. 2, 1966, with Teasdale''s letters (LBJ Library, Office Files of Harry McPherson). Names: McPherson, Johnson, Fulbright, Moyers.'
    tags: [name:mcpherson-harry, name:johnson-lyndon-b, name:fulbright-j-william, name:moyers-bill]
  - id: cal.1966-03-03.school-aid
    when: Mar. 3
    date: '1966-03-03'
    thread: school-aid
    also: [vietnam]
    c: 'Veterans'' Readjustment Benefits Act signed in the East Room, [80 Stat. 12](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg12.pdf), the "Cold War GI Bill": for service after Jan. 31, 1955, schooling at $100 a month, $125 with one dependent, $150 with more; home loans; medical care. Yarborough its author in the Senate; Teague''s committee reported it in the House.'
    n: 'Remarks Upon Signing the "Cold War GI Bill" (Veterans'' Readjustment Benefits Act of 1966), [1966 Pub. Papers 263](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=339) (Mar. 3, 1966). To check: [[w.cox-ralph-w-yarborough-the]]. Names: Yarborough, Teague.'
    tags: [name:johnson-lyndon-b, name:yarborough-ralph, name:teague-olin-e]
  - id: cal.1966-03-03.vietnam-congress
    when: Mar. 3
    date: '1966-03-03'
    thread: vietnam-congress
    c: 'McNamara before Foreign Relations in executive session, having refused an open one. To Fulbright''s "They haven''t given up for 20 years": nor have they faced such force; as they expand, "we must continue to expand ours," until they can increase no further.'
    n: 'Daily Digest, [112 Cong. Rec. D84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=82). [[w.gibbons-u-s-government-and]], IV, 248. Made public: the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 499–500 (1993). Names: McNamara, Fulbright.'
    tags: [name:mcnamara-robert-s, name:fulbright-j-william]
  - id: cal.1966-03-04.opinion
    when: Mar. 4
    date: '1966-03-04'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, Jan. 21–26: a worker in a unionized plant required to join the union: should 42 percent, should not 49. A law making all strikes illegal: favor 27, oppose 61. Unions covering whole industries brought under the antitrust laws: agree 43, disagree 26. The laws regulating unions: not strict enough 40, too strict 11, about right 25. Those regulating business: not strict enough 20, too strict 20, about right 32.'
    n: '[[w.gallup-poll]], III, 1992–93. The union-shop question''s field dates printed 1/21-26/65 (survey 723-K).'
  - id: cal.1966-03-06.opinion
    when: Mar. 6
    date: '1966-03-06'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 10–15: bombing industrial plants and factories in North Vietnam: favor 61 percent, oppose 26. Bombing big cities in North Vietnam: favor 28, oppose 60.'
    n: '[[w.gallup-poll]], III, 1993.'
  - id: cal.1966-03-06.vietnam-congress
    when: Mar. 6
    date: '1966-03-06'
    thread: vietnam-congress
    c: 'Rusk to Fulbright, against the amendments before the committee: the President acting "fully within his constitutional powers"; the resolution and the vote of 92 to 5; the amendments would "make our enemies more obdurate."'
    n: '[[w.gibbons-u-s-government-and]], IV, 262. To check: Rusk to Fulbright, Mar. 6, 1966 (State, Lot File 70 D 207). Names: Rusk, Fulbright.'
    tags: [name:rusk-dean, name:fulbright-j-william]
  - id: cal.1966-03-07.court
    when: Mar. 7
    date: '1966-03-07'
    thread: court
    also: [voting-rights, south-carolina]
    c: '*South Carolina v. Katzenbach*, [383 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383301/usrep383301.pdf): the Voting Rights Act upheld under the Fifteenth Amendment''s enforcement clause: the coverage formula, the suspension of literacy tests, the federal examiners, the review of new voting laws. Warren for the Court; Black dissents from the review of new State laws alone.'
    n: 'Opinion (K–J Cong. II.J.1). Also Opp. II.H.1. To check: [[w.lawson-black-ballots]]; [[w.landsberg-enforcing-civil-rights]]; [[w.katzenbach-some-of-it-was]]; [[w.powe-warren-court-and-american]]. See [[cal.1965-08-07.voting-rights]].'
  - id: cal.1966-03-07.europe-and-the-alliance
    when: Mar. 7
    date: '1966-03-07'
    thread: europe-and-the-alliance-france
    c: 'De Gaulle to Johnson, by hand: France stays party to the North Atlantic Treaty but will recover "the entire exercise of her sovereignty over her territory," end her part in the integrated commands, and no longer put her forces at NATO''s disposal.'
    n: 'FRUS 1964–68, XIII, docs. [136](https://history.state.gov/historicaldocuments/frus1964-68v13/d136), [137](https://history.state.gov/historicaldocuments/frus1964-68v13/d137). [[w.drea-mcnamara-clifford-and-the-2011]], 376 (the letter of Mar. 7, France out of the integrated command); [[w.schwartz-lyndon-johnson-and-europe]], 100–02. To check: [[w.bozo-two-strategies-for-europe]]; [[w.priest-kennedy-johnson-and-nato]]; [[w.jackson-de-gaulle]]; [[w.bohlen-witness-to-history-1929]]. See [[cal.1965-12-20.europe-and-the-alliance]]. See [[cal.1964-04-27.europe-and-the-alliance]]. Names: de Gaulle, Johnson.'
    src:
      c: 7d5152a1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d136: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 376: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 376 n.5a: A'
        - 'w.schwartz-lyndon-johnson-and-europe 100–02: all'
    tags: [name:de-gaulle-charles, name:johnson-lyndon-b]
  - id: cal.1966-03-07.vietnam-congress
    when: Mar. 7
    date: '1966-03-07'
    thread: vietnam-congress
    also: [vietnam-supplemental]
    c: 'Foreign Relations, executive session, orders the supplemental aid bill reported, 18–1, Morse against. Fulbright''s amendment, that aid is no commitment to defend with American forces, fails 6–13: Fulbright, Morse, Gore, Church, Clark and Pell for it. McGovern''s, offered by Church, that the bill ratifies no decision on Vietnam, fails 5–14. McCarthy, by the press account, red-faced over Rusk''s letter.'
    n: 'Daily Digest, [112 Cong. Rec. D91](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=89). S. Rep. No. 89-1060 (1966). *New York Times*, Mar. 8, 1966. [[w.gibbons-u-s-government-and]], IV, 260–62. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 609–41 (1993). See [[cal.1966-03-06.vietnam-congress]]. Names: Morse, Fulbright, Gore, Church, Clark, Pell, McGovern, McCarthy, Rusk.'
    tags: [name:morse-wayne, name:fulbright-j-william, name:gore-albert-sr, name:church-frank, name:clark-joseph-s, name:pell-claiborne-d, name:mcgovern-george, name:mccarthy-eugene-j, name:rusk-dean]
  - id: cal.1966-03-07.vietnam-support
    when: Mar. 7
    date: '1966-03-07'
    thread: vietnam-support
    also: [vietnam-congress]
    c: 'DeLoach of the FBI, at the President''s request, gives Dirksen, in confidence, information on Fulbright and Morse; Dirksen: both "very much obligated to communist interests"; the China hearings "obviously" instigated. Hickenlooper told Mar. 8.'
    n: '[[w.gibbons-u-s-government-and]], IV, 229. Made public: Theoharis, 1991. To check: DeLoach to Tolson, Mar. 7, 1966, in Athan Theoharis, ed., *From the Secret Files of J. Edgar Hoover*, 237–38 (1991). Names: DeLoach, Johnson, Dirksen, Fulbright, Morse, Hickenlooper.'
    tags: [name:deloach-cartha, name:johnson-lyndon-b, name:dirksen-everett, name:fulbright-j-william, name:morse-wayne, name:hickenlooper-bourke-b]
  - id: cal.1966-03-08.india-and-china
    when: Mar. 8
    date: '1966-03-08'
    thread: china
    c: 'The Senate Foreign Relations Committee, Fulbright presiding, hears scholars on policy toward mainland China, to Mar. 30. A. Doak Barnett of Columbia, the first: "containment but not isolation."'
    n: 'Daily Digest, [112 Cong. Rec. D94](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=92). *U.S. Policy with Respect to Mainland China: Hearings before the Senate Committee on Foreign Relations*, 89th Cong., 2d sess. (1966). [[w.gibbons-u-s-government-and]], IV, 264–66 (the hearings; their origin in Fulbright''s talk with Whiting). To check: [[w.foot-practice-of-power]]; [[w.kusnitz-public-opinion-and-foreign]]; [[w.goh-constructing-the-u-s]]; [[w.woods-fulbright]]. Names: Fulbright, Barnett.'
    tags: [name:fulbright-j-william, name:barnett-a-doak]
  - id: cal.1966-03-08.electoral-college
    when: Mar. 8–10
    date: '1966-03-08'
    thread: electoral-college
    also: [amendments, congress]
    c: 'Katzenbach to Bayh''s subcommittee for the administration''s S.J. Res. 58, "substantially identical" to Senator Kennedy''s of 1957: the office of elector abolished, a State''s electoral votes cast for its winner without electors; with no majority, the Senate and House together, each member a vote, to choose among the three highest; the death of a President-elect provided for. Edward Kennedy for it the same day; Robert Kennedy, Mar. 9. Mar. 10, the last day, the subcommittee adjourns to the call of the chair.'
    n: '*Election of the President* hearings, [151–52](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=159), [173](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=181), [179–80](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=187). See [[cal.1966-02-28.electoral-college]]. Names: Katzenbach, Bayh, John F. Kennedy, Edward Kennedy, Robert Kennedy.'
    tags: [name:katzenbach-nicholas, name:bayh-birch, name:kennedy-john-f, name:kennedy-edward-m, name:kennedy-robert-f]
  - id: cal.1966-03-09.crime-and-hijacking
    when: Mar. 9
    date: '1966-03-09'
    thread: crime-and-hijacking
    c: 'Message on crime and law enforcement: a year at college for selected police officers; control of the interstate traffic in firearms, S. 1592; a commission to revise the federal criminal code by 1968; bail reform; the federal prisons, parole, and probation joined in the Justice Department. For the District: higher police pay, a pistol registration act.'
    n: 'Special Message to the Congress on Crime and Law Enforcement, [1966 Pub. Papers 291](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=367) (Mar. 9, 1966). See [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-09.opinion
    when: Mar. 9
    date: '1966-03-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 10–15: Johnson''s handling of Vietnam: approve 50 percent, disapprove 33.'
    n: '[[w.gallup-poll]], III, 1993. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-03-09.vietnam-operations
    when: Mar. 9–10
    date: '1966-03-09'
    thread: vietnam-operations
    c: A Shau. The 95th Regiment of the 325th North Vietnamese Division attacks the Special Forces camp in the A Shau Valley, western Thừa Thiên; the final assaults the early morning of Mar. 10; the camp overrun. Marine helicopters fly 131 sorties, Mar. 9–12, and bring out 161 of the 186 survivors. Of a garrison of 434, 248 dead or missing.
    n: 'Remarks Upon Presenting the Medal of Honor to Maj. Bernard F. Fisher, USAF, [1967 Pub. Papers 28](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=96) (Jan. 19, 1967). [[w.def-u-s-viet-rels-iv-c-6-a]], 46–47; [[w.shulimson-u-s-marines-in-1982]], 56–64; [[w.vietnam-victory-in-vietnam]], 180; [[w.cosmas-joint-chiefs-of-staff-2012]], 477 (the camp overrun); [[w.schlight-united-states-air-force]], 199 (the attack, Mar. 9). Check: *Victory in Vietnam* credits the camp''s capture to province and district local forces, in breaking a South Vietnamese sweep of Feb. 17–Mar. 3 (180). Check: Cosmas, 477, quoting the Chiefs'' memorandum of Apr. 6, gives "the 9 March overrunning" of the camp. To check: [[w.phillips-shau]].'
    src:
      c: e89fce8c
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=96: all'
        - 'w.def-u-s-viet-rels-iv-c-6-a 46–47: all'
        - 'w.shulimson-u-s-marines-in-1982 56–64: all'
        - 'w.vietnam-victory-in-vietnam 180: all'
        - 'w.schlight-united-states-air-force 199: A-B'
        - 'w.cosmas-joint-chiefs-of-staff-2012 477: A, D'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 477 n.43a: A, D'
    tags: [place:a-shau-valley, province:thua-thien]
  - id: cal.1966-03-10.vietnam
    when: Mar. 10
    date: '1966-03-10'
    thread: vietnam-struggle
    c: The Directorate relieves Thi of the I Corps command; Kỳ had told Lodge Mar. 9 of Thi's insubordination, Lodge answering that it was an internal affair.
    n: '[FRUS 1964–68, IV, doc. 91](https://history.state.gov/historicaldocuments/frus1964-68v04/d91). [[w.gibbons-u-s-government-and]], IV, 268–71; [[w.staaveren-gradual-failure]], 250 (Thi dismissed, Mar. 10). To check: [[w.topmiller-lotus-unleashed]]; [[w.minh-vietnamese-engaged-buddhism]]; [[w.luu-buddhist-crises-in-vietnam]]; [[w.moyar-political-monks]]; [[w.kahin-intervention]]; [[w.fitzgerald-fire-in-the-lake]]; [[w.ky-twenty-years-and-twenty]]; [[w.blair-lodge-in-vietnam]]. Names: Nguyễn Chánh Thi, Nguyễn Cao Kỳ, Lodge.'
    src:
      c: bda77256
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d91: all'
