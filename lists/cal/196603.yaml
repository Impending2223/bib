  - id: cal.1966-03-01.vietnam
    when: Mar. 1
    date: '1966-03-01'
    thread: vietnam-supplemental
    also: [congress, defense]
    c: 'The war''s supplemental authorization. The Senate tables Morse''s amendment to repeal the Southeast Asia resolution of Aug. 1964, [92–5](https://voteview.com/rollcall/RS0890270): Morse, Gruening, Fulbright, McCarthy, Young of Ohio the five. Gruening''s, to keep draftees from Southeast Asia''s combat areas without Congress''s consent, tabled [94–2](https://voteview.com/rollcall/RS0890271). The authorization, $4.8 billion for aircraft, missiles, and construction, passes, [93–2](https://voteview.com/rollcall/RS0890272); the House''s, [393–4](https://voteview.com/rollcall/RH0890216).'
    n: 'The vote to table: [112 Cong. Rec. 4404](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82) (Senate, Mar. 1, 1966). [[w.mann-grand-delusion]], 504–05 (Johnson to Mansfield; the votes). Check: the pages of the other votes. [FRUS 1964–68, IV, doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v04/d87) (Johnson to Mansfield by telephone, 9:42 a.m.: the motion to table must not "imply any dilution" of the resolution). [[w.gibbons-u-s-government-and]], IV, 251–59. To check: [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]. See [[cal.1966-01-19.vietnam]]; [[cal.1966-02-04.vietnam]]. Names: Morse, Gruening, Fulbright, McCarthy, Young.'
