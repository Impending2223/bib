  - id: cal.1962-09-27.mississippi
    when: Sept. 27–30
    date: '1962-09-27'
    thread: mississippi
    also: [robert-kennedy]
    c: 'Kennedy–Barnett calls, recorded. A staged confrontation agreed, then called off. Sept. 30: Meredith flown to Oxford; marshals at the Lyceum; riot overnight. Guihard, a French reporter, and Gunter, a local man, killed. Kennedy on television during it.'
    n: '[Meeting on the Crisis at the University of Mississippi, 1:18 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-crisis-university-mississippi), Tape 24 (Miller Center), Sept. 29; [Meeting on Civil Rights, 10:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-civil-rights), Tapes 26 and 26A (Miller Center), Sept. 30; [Robert Kennedy and Vance, 12:40 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-oval-office-between-robert-kennedy-and-cyrus), Dictabelt 4F3, Cassette A (Miller Center), Oct. 1. [Radio and Television Report to the Nation on the Situation at the University of Mississippi](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-nation-the-situation-the-university-mississippi) (Sept. 30, 1962). [Proclamation No. 3497](https://www.presidency.ucsb.edu/documents/proclamation-3497-obstructions-justice-the-state-mississippi), [27 Fed. Reg. 9681](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). [Exec. Order No. 11,053](https://www.presidency.ucsb.edu/documents/executive-order-11053-providing-assistance-for-the-removal-unlawful-obstructions-justice), [27 Fed. Reg. 9693](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). Tapes (K–J Adm. II.J). Address on Mississippi (K–J Adm. II.I). [[w.doyle-american-insurrection]]. See [[cal.1962-06-25.mississippi]]. Names: Barnett (K–J Cong. III.F); Meredith (K–J Cong. III.H); Guihard (K–J Cong. III.J); Gunter (K–J Cong. III.K); Robert F. Kennedy (K–J Adm. III.A); Katzenbach, Marshall (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:barnett-ross-r, name:meredith-james-h, name:guihard-paul, name:gunter-ray, name:kennedy-robert-f]
  - id: cal.1962-09-27.georgia-ga
    when: Sept. 27–Oct. 23
    date: '1962-09-27'
    thread: georgia
    also: [legislatures]
    c: 'Special session, on *Toombs v. Fortson*. The General Assembly reapportions the Senate''s 54 seats, many to the cities; the Senate passes the plan Oct. 5, 43–4. Nominations already made void: special primaries Oct. 16, runoffs Oct. 23. Counties of several districts to elect their senators at large; Oct. 15, a Fulton Superior Court judge holds that void in Fulton.'
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 5 and 16, 1962. Check: the act, Ga. Laws 1962, Extra Sess. [[w.bartley-creation-of-modern-georgia]]; [[w.carter-turning-point]]. See [[cal.1962-05-25.georgia-ga]]. Names: Vandiver (K–J Cong. III.F).'
    tags: [name:vandiver-s-ernest-jr, state:ga]
