# Cal. XXIII September 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXIII
entries:
  - id: cal.1962-09-04.missile-crisis
    when: Sept. 4
    date: '1962-09-04'
    thread: missile-crisis
    c: Statement on Cuba. No offensive weapons found; were there, "the gravest issues would arise." Dobrynin assures Robert Kennedy the same day.
    n: '[FRUS 1961–63, X, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v10/d411). Statement by the President on Cuba (Sept. 4, 1962). Dobrynin, *In Confidence* (K–J Adm. II.G.7). See [[cal.1962-05-24.missile-crisis]]. Names: Dobrynin (K–J Adm. III.J).'
    tags: [name:dobrynin-anatoly, name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1962-09-07.missile-crisis
    when: Sept. 7
    date: '1962-09-07'
    thread: missile-crisis
    c: Kennedy asks standby authority to call 150,000 reservists.
    n: '[Letter to the President of the Senate and to the Speaker of the House Transmitting Bill Authorizing Mobilization of the Ready Reserve](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-bill-authorizing) (Sept. 7, 1962). See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-10.mississippi
    when: Sept. 10–13
    date: '1962-09-10'
    thread: mississippi
    c: 'Black, as circuit justice, vacates Cameron''s stays. Sept. 13: Barnett proclaims interposition.'
    n: 'Doyle, *An American Insurrection* (K–J Adm. II.C). Silver, *Mississippi: The Closed Society* (K–J Cong. II.H). See [[cal.1962-06-25.mississippi]]. Names: Black (K–J Cong. III.G); Barnett (K–J Cong. III.F).'
    tags: [name:black-hugo-l, name:cameron-ben-f, name:barnett-ross-r]
  - id: cal.1962-09-11.missile-crisis
    when: Sept. 11
    date: '1962-09-11'
    thread: missile-crisis
    c: 'TASS: no Soviet need for missiles outside Soviet territory.'
    n: '[FRUS 1961–63, X, doc. 422](https://history.state.gov/historicaldocuments/frus1961-63v10/d422). [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-179) (Sept. 13, 1962). Fursenko & Naftali (K–J Adm. II.D). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-09-11.confirmations
    when: Sept. 11
    date: '1962-09-11'
    thread: confirmations
    also: [civil-rights-the-executive]
    c: Thurgood Marshall confirmed to the Second Circuit, [54–16](https://voteview.com/rollcall/RS0870379), a year after his nomination.
    n: '[108 Cong. Rec., Senate, Sept. 11, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt14/pdf/GPO-CRECB-1962-pt14-7-1.pdf). See [[cal.1961-09-23.civil-rights-the-executive]]; [[cal.1961-03-07.confirmations]]. Names: Marshall (K–J Cong. III.G).'
    tags: ['name:marshall-thurgood']
  - id: cal.1962-09-12.space
    when: Sept. 12
    date: '1962-09-12'
    thread: space
    c: Rice Stadium. "We choose to go to the moon in this decade."
    n: '[Address at Rice University in Houston on the Nation''s Space Effort](https://www.presidency.ucsb.edu/documents/address-rice-university-houston-the-nations-space-effort) (Sept. 12, 1962). Logsdon, *John F. Kennedy and the Race to the Moon* (K–J Adm. II.B). See [[cal.1961-04-12.space]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-13.missile-crisis
    when: Sept. 13
    date: '1962-09-13'
    thread: missile-crisis
    c: Press conference. The warning repeated.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-179) (Sept. 13, 1962). See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-14.program
    when: Sept. 14
    date: '1962-09-14'
    thread: jobs-and-wages
    c: Public Works Acceleration Act signed, [Pub. L. No. 87-658, 76 Stat. 541](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg541.pdf). $900 million for areas of high unemployment.
    n: 'See [[cal.1961-02-02.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-18.elections-1962
    when: Sept. 18
    date: '1962-09-18'
    thread: elections-1962
    c: Massachusetts primary. Edward Kennedy over McCormack, better than two to one. George Cabot Lodge the Republican.
    n: '[Mass. *Election Statistics*, 1962 (P.D. 43), pp. 150–155](https://archive.org/details/electionstatisti19611963mass/page/n227). See [[cal.1962-08-27.elections-1962]].'
    tags: [name:kennedy-edward-m, name:lodge-george-c, name:mccormack-edward-j-jr]
  - id: cal.1962-09-19.trade
    when: Sept. 19
    date: '1962-09-19'
    thread: trade
    c: Senate passes the trade bill, [78–8](https://voteview.com/rollcall/RS0870392).
    n: See [[cal.1962-01-25.trade]].
  - id: cal.1962-09-19.missile-crisis
    when: Sept. 19
    date: '1962-09-19'
    thread: missile-crisis
    c: 'SNIE 85-3-62: offensive missiles in Cuba unlikely. McCone, on his honeymoon, dissents by cable.'
    n: '[FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). Robarge (K–J Adm. II.G.6). See [[cal.1962-05-24.missile-crisis]]. Names: McCone (K–J Adm. III.I).'
    tags: [name:mccone-john-a]
  - id: cal.1962-09-20.school-aid
    when: Sept. 20
    date: '1962-09-20'
    thread: school-aid
    c: House recommits the college aid conference report, [214–186](https://voteview.com/rollcall/RH0870210), with instructions to strike the student loans and scholarships. Dead.
    n: '[Voteview](https://voteview.com/rollcall/RH0870210). McAndrews, *Broken Ground* (K–J Adm. II.B). See [[cal.1961-02-20.school-aid]]. Names: Green (K–J Cong. III.D).'
  - id: cal.1962-09-20.mississippi
    when: Sept. 20–26
    date: '1962-09-20'
    thread: mississippi
    c: Barnett, as special registrar, refuses Meredith at Oxford. Again at Jackson, Sept. 25. Lieutenant Governor Johnson at the gate, Sept. 26.
    n: '*United States v. Barnett*, [376 U.S. 681](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376681/usrep376681.pdf) (1964) (K–J Adm. II.H.1). See [[cal.1962-06-25.mississippi]]. Names: Barnett, Johnson (K–J Cong. III.F).'
    tags: [name:barnett-ross-r, name:johnson-paul-b-jr, name:meredith-james-h]
  - id: cal.1962-09-26.missile-crisis
    when: Sept. 26
    date: '1962-09-26'
    thread: missile-crisis
    c: House passes the Cuba resolution; the Senate, Sept. 20. Signed Oct. 3, [Pub. L. No. 87-733, 76 Stat. 697](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg697.pdf).
    n: 'See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-27.program
    when: Sept. 27
    date: '1962-09-27'
    thread: farm
    c: Food and Agriculture Act of 1962 signed, [Pub. L. No. 87-703, 76 Stat. 605](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg605-2.pdf). Feed grain program extended; wheat controls to a 1963 referendum.
    n: 'See [[cal.1962-06-21.program]]. Names: Freeman (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-09-27.mississippi
    when: Sept. 27–30
    date: '1962-09-27'
    thread: mississippi
    c: 'Kennedy–Barnett calls, recorded. A staged confrontation agreed, then called off. Sept. 30: Meredith flown to Oxford; marshals at the Lyceum; riot overnight. Guihard, a French reporter, and Gunter, a local man, killed. Kennedy on television during it.'
    n: '[Radio and Television Report to the Nation on the Situation at the University of Mississippi](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-nation-the-situation-the-university-mississippi) (Sept. 30, 1962). [Proclamation No. 3497](https://www.presidency.ucsb.edu/documents/proclamation-3497-obstructions-justice-the-state-mississippi), [27 Fed. Reg. 9681](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). [Exec. Order No. 11,053](https://www.presidency.ucsb.edu/documents/executive-order-11053-providing-assistance-for-the-removal-unlawful-obstructions-justice), [27 Fed. Reg. 9693](https://www.govinfo.gov/app/details/FR-1962-10-02) (1962). Tapes (K–J Adm. II.J). Address on Mississippi (K–J Adm. II.I). Doyle (K–J Adm. II.C). See [[cal.1962-06-25.mississippi]]. Names: Robert F. Kennedy (K–J Adm. III.A); Katzenbach, Marshall (K–J Adm. III.I); Barnett (K–J Cong. III.F).'
    tags: [name:kennedy-john-f, name:barnett-ross-r, name:meredith-james-h, name:guihard-paul, name:gunter-ray]
