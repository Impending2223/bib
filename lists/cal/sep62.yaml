  - id: cal.1962-09-17.governors-ny
    when: Sept. 17–19
    date: '1962-09-17'
    thread: governors
    also: [elections-1962]
    c: 'New York''s conventions. Democrats at Syracuse, Sept. 17: Morgenthau, United States Attorney in Manhattan, nominated for governor on the second ballot, over O''Connor, Stratton, Samuels, Beame and others. Sept. 18: Donovan for the Senate against Javits; Edward R. Dudley, Manhattan''s borough president, a Negro, for attorney general. Sept. 19, Republicans at Buffalo renominate Rockefeller and Javits; the Liberals endorse the Democrats'' ticket.'
    n: '[*New York Times*, Sept. 18, 1962](https://select.nytimes.com/gst/abstract.html?res=FB0610FA355C137A93CAA81782D85F468685F9); [Sept. 19](https://www.nytimes.com/1962/09/19/archives/democrats-name-dudley-a-negro-to-state-ticket-donovan-to-oppose.html); [Sept. 20](https://www.nytimes.com/1962/09/20/archives/governor-vows-hard-campaign-is-renominated-cheering-republican.html). [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.underwood-governor-rockefeller-in-new]]. Names: Morgenthau (K–J Cong. III.K); O''Connor (K–J Cong. III.F); Stratton, Samuels, Beame (K–J Cong. III.K); Donovan (K–J Adm. III.I); Javits (K–J Cong. III.E); Dudley (K–J Cong. III.F); Rockefeller (Opp. III.H).'
    tags: [state:ny, name:morgenthau-robert-m, name:oconnor-frank-d, name:stratton-samuel-s, name:samuels-howard-j, name:beame-abraham-d, name:donovan-james-b, name:javits-jacob-k, name:dudley-edward-r, name:rockefeller-nelson]
