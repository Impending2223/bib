# Cal. C February 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: C
entries:
  - id: cal.1968-02-01.vietnam
    when: Feb. 1
    date: '1968-02-01'
    thread: vietnam-tet
    also: [press-and-broadcasting]
    c: Saigon. General Nguyễn Ngọc Loan, the national police chief, shoots a bound Viet Cong prisoner in the street; photographed by Adams of the Associated Press, filmed by an NBC crew. The photograph on front pages Feb. 2; the film on NBC's evening news (Check the day).
    n: 'See [[cal.1968-01-30.vietnam]]. Names: Nguyễn Ngọc Loan, Adams.'
    tags: [name:nguyen-ngoc-loan, name:adams-eddie, place:saigon]
  - id: cal.1968-02-01.elections-1968
    when: Feb. 1–2
    date: '1968-02-01'
    thread: elections-1968
    c: Nixon announces for the Republican nomination in a letter to New Hampshire's voters, Feb. 1; at Manchester, Feb. 2, his first news conference of the campaign.
    n: '[[w.witcover-resurrection-of-richard-nixon]]; [[w.nixon-rn]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.gould-1968]]; [[w.perlstein-nixonland-2008]]. See [[cal.1967-01-07.elections-1968]]. Names: Nixon.'
    tags: [name:nixon-richard-m, state:nh]
  - id: cal.1968-02-01.consumers
    when: Feb. 1
    date: '1968-02-01'
    thread: consumers
    c: 'The House passes H.R. 11601, Sullivan''s Consumer Credit Protection Act, [383–4](https://voteview.com/rollcall/RH0900250): the cost of credit disclosed as an annual percentage rate. Adopted first, [383–5](https://voteview.com/rollcall/RH0900249), an amendment making loan-sharking a federal crime. To conference with the Senate''s S. 5. Johnson: "the consumers'' Congress."'
    n: '[Statement by the President Following Passage of the Truth-in-Lending Bill by the House of Representatives](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-truth-lending-bill-the-house-representatives) (Feb. 1, 1968). [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-07-11.consumers]]. Names: Sullivan, Johnson.'
    tags: [name:sullivan-leonor-k, name:johnson-lyndon-b]
  - id: cal.1968-02-01.economy
    when: Feb. 1
    date: '1968-02-01'
    thread: economy
    c: 'Economic Report: growth in 1967 a little over 1 percent a year in the first half, about 4½ in the second; with the surcharge, GNP up some $60 billion in 1968, about 7¾ percent; the 10 percent surcharge asked again.'
    n: '[Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-16) (Feb. 1, 1968). [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-01-29.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-02-02.vietnam-tet
    when: Feb. 2
    date: '1968-02-02'
    thread: vietnam-tet
    c: 'News conference. Johnson on the offensive: its first object, military success, "a complete failure"; the second, a psychological victory, not to be won.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1202) (Feb. 2, 1968). See [[cal.1968-01-30.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-02-02.japan-and-korea
    when: Feb. 2
    date: '1968-02-02'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the Neutral Nations Supervisory Commission''s conference room, 11 a.m.: the first private meeting on the *Pueblo* of the Military Armistice Commission''s senior members, Rear Admiral Smith and Major General Pak Chung Kuk. Rostow to Johnson: the North Korean "obviously instructed to stonewall."'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [247](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d247), [254](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d254). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Smith, Pak Chung Kuk, Rostow, Johnson.'
    tags: [name:smith-john-v, name:pak-chung-kuk, name:rostow-walt-w, name:johnson-lyndon-b]

  - id: cal.1968-02-02.jobs-and-wages-nyc
    when: Feb. 2
    date: '1968-02-02'
    thread: labor-disputes
    also: [states-and-cities]
    c: 'New York City. The Uniformed Sanitationmen''s Association, its members rejecting a tentative contract, strikes, against the Taylor Law. Garbage piles in the streets.'
    n: '[Harvard Kennedy School case 774.0, "Labor Relations, Politics and Public Opinion: The New York City Sanitation Strike of 1968"](https://case.hks.harvard.edu/labor-relations-politics-and-public-opinion-the-new-york-city-sanitation-strike-of-1968). [[w.cannato-ungovernable-city]]; [[w.connery-rockefeller-of-new-york]]; [[w.freeman-working-class-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1967-09-11.states-and-cities-nyc]].'
    tags: [state:ny, city:nyc]

  - id: cal.1968-02-04.opinion
    when: Feb. 4
    date: '1968-02-04'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Jan. 4–9, Democrats, the convention''s choice narrowed to two: Johnson 71 percent, McCarthy 18, no opinion 11. Johnson 52, Robert Kennedy 40, no opinion 8.'
    n: '[[w.gallup-poll]], III, 2104. Names: McCarthy, Johnson, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:johnson-lyndon-b, name:kennedy-robert-f]
  - id: cal.1968-02-05.japan-and-korea-blue-house
    when: Feb. 5
    date: '1968-02-05'
    thread: japan-and-korea-blue-house
    c: 'Park to Johnson: a plea for retaliation against the raids.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d155). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-21.japan-and-korea]]. Names: Park, Johnson.'
    tags: [name:park-chung-hee, name:johnson-lyndon-b]

  - id: cal.1968-02-05.school-aid
    when: Feb. 5
    date: '1968-02-05'
    thread: school-aid
    c: Message on education, "The Fifth Freedom." Head Start and Follow Through from $340 million to $380 million; $5 million to begin bilingual education; the handicapped from $53 million to $85 million; $30 million for a Stay in School program; Upward Bound for 30,000; Title I funded before the school year; a Partnership for Learning and Earning Act and a Networks for Knowledge Act.
    n: '[Special Message to the Congress on Education: "The Fifth Freedom"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-education-the-fifth-freedom) (Feb. 5, 1968). [[w.graham-uncertain-triumph]]. See [[cal.1968-01-17.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-06.consumers
    when: Feb. 6
    date: '1968-02-06'
    thread: consumers
    c: 'Message, "To Protect the Consumer Interest," an eight-point program: a Deceptive Sales Act, new powers for the Federal Trade Commission; a study of automobile insurance by the Secretary of Transportation; a Hazardous Radiation Act, for television sets and other electronic products; a Wholesome Poultry Products Act; a Wholesome Fish and Fishery Products Act. The truth-in-lending conference to give "a strong Truth-in-Lending law."'
    n: '[Special Message to the Congress: "To Protect the Consumer Interest"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-protect-the-consumer-interest) (Feb. 6, 1968). See [[cal.1968-01-17.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-06.middle-east
    when: Feb. 6
    date: '1968-02-06'
    thread: middle-east
    c: 'Rusk and McNamara to Johnson: an arms package for Jordan, after General Khammash''s talks in Washington from Jan. 17: $82 million over fiscal 1968–70, 18 F-104s and 88 M-48 tanks in it, against Hussein''s request for $200 million; without it the King may take Soviet arms. McNamara the same day: a decision on Israel''s request for fifty Phantoms by Dec. 31, 1968, for deliveries from January 1970, about four a month.'
    n: 'FRUS 1964–68, XX, docs. [69](https://history.state.gov/historicaldocuments/frus1964-68v20/d69), [71](https://history.state.gov/historicaldocuments/frus1964-68v20/d71), [72](https://history.state.gov/historicaldocuments/frus1964-68v20/d72). Made public: FRUS 1964–68, XX (2001). See [[cal.1968-01-07.middle-east]]. Names: Rusk, McNamara, Khammash, Hussein, Johnson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:khammash-amer, name:hussein-ibn-talal, name:johnson-lyndon-b]
  - id: cal.1968-02-06.open-housing
    when: Feb. 6
    date: '1968-02-06'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Senate, H.R. 2516, the bill against interference with civil rights. Ervin''s amendment, narrowing it to rights under the commerce clause and in federally aided programs, tabled, [54–29](https://voteview.com/rollcall/RS0900317). Mondale and Brooke offer fair housing as a new title (Check the day).'
    n: '[[w.mann-walls-of-jericho]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.macneil-dirksen]]; [[w.kotz-judgment-days]]; [[w.graham-civil-rights-era]]. See [[cal.1967-08-16.open-housing]]; [[cal.1968-01-24.open-housing]]. Names: Ervin, Mondale, Brooke.'
    tags: [name:ervin-sam-j-jr, name:mondale-walter-f, name:brooke-edward-w]

  - id: cal.1968-02-06.governors-la
    when: Feb. 6
    date: '1968-02-06'
    thread: governors
    also: [elections-1968]
    c: 'Louisiana''s general election. McKeithen (D), renominated Nov. 4, 1967, re-elected governor unopposed: no Republican filed. The first governor the constitution lets succeed himself, by the amendment of 1966.'
    n: '[Wikipedia, "1967 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1967_Louisiana_gubernatorial_election). Check: the Secretary of State''s *General Election Returns*, Feb. 6, 1968, and the vote. See [[cal.1967-11-04.governors-la]]. Names: McKeithen.'
    tags: [governors:1968-02-06, state:la, name:mckeithen-john-j]
  - id: cal.1968-02-07.vietnam
    when: Feb. 7
    date: '1968-02-07'
    thread: vietnam-khe-sanh
    c: Lang Vei, the Special Forces camp west of Khe Sanh, overrun before dawn by North Vietnamese infantry with PT-76 tanks, their first armor in the South (Check the losses).
    n: 'Wheeler to the National Security Council, Feb. 7: FRUS 1964–68, VI, doc. [60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60). See [[cal.1968-01-21.vietnam]].'
    tags: [place:lang-vei]
  - id: cal.1968-02-07.press-and-broadcasting
    when: Feb. 7
    date: '1968-02-07'
    thread: press-and-broadcasting
    also: [vietnam-tet]
    c: 'Bến Tre, a province capital in the Mekong Delta, retaken after Tet by American and South Vietnamese troops with air strikes and artillery. Arnett''s Associated Press dispatch quotes an American major: "It became necessary to destroy the town to save it."'
    n: 'See [[cal.1968-01-30.vietnam]]. Names: Arnett.'
    tags: [name:arnett-peter, place:ben-tre]
  - id: cal.1968-02-07.crime-and-hijacking
    when: Feb. 7
    date: '1968-02-07'
    thread: crime-and-hijacking
    c: 'Message on crime, "To Insure the Public Safety." The Safe Streets and Crime Control Act, $100 million for fiscal 1969; gun control; a Federal Anti-Riot Act against the agitator who crosses State lines; the Juvenile Delinquency Prevention Act; an Alcoholic Rehabilitation Act. Reorganization Plan No. 1: the Treasury''s Bureau of Narcotics and HEW''s Bureau of Drug Abuse Control joined in the Justice Department as the Bureau of Narcotics and Dangerous Drugs. Executive Order 11396: the Attorney General to coordinate the federal programs against crime.'
    n: '[Special Message to the Congress on Crime and Law Enforcement: "To Insure the Public Safety"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-crime-and-law-enforcement-insure-the-public-safety); [Special Message to the Congress Transmitting Reorganization Plan 1 of 1968 Relating to Narcotics and Drug Abuse Control](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-1-1968-relating-narcotics); [Executive Order 11396](https://www.presidency.ucsb.edu/documents/executive-order-11396-providing-for-the-coordination-the-attorney-general-federal-law) (Feb. 7, 1968). [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1968-01-17.program]]; [[cal.1967-08-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-07.opinion
    when: Feb. 7
    date: '1968-02-07'
    thread: opinion
    also: [soviet-union, vietnam]
    c: 'Gallup, special survey, 28 nations rated on a scale from plus 5 to minus 5, favorable: Canada 94 percent, Switzerland 90, Australia 89, England 85, West Germany 75, Israel 74, Japan 72, India 62, South Vietnam 62, France 49, Egypt 39, Russia 19, North Vietnam 7, Cuba 6, Communist China 5.'
    n: '[[w.gallup-poll]], III, 2104–05.'
  - id: cal.1968-02-08.south-carolina
    when: Feb. 8
    date: '1968-02-08'
    thread: south-carolina
    also: [students, civil-disorders]
    c: Orangeburg, the night of Feb. 8. Highway patrolmen fire on Negro students on the campus of South Carolina State College; three killed, two students and a high school student, and some 27 wounded (Check). Protests since Feb. 5 against a bowling alley that refused Negroes. The patrolmen and the National Guard there on McNair's orders (Check).
    n: '[[w.nelson-orangeburg-massacre]]. Names: McNair.'
    tags: [name:mcnair-robert-e, state:sc]
  - id: cal.1968-02-08.elections-1968
    when: Feb. 8
    date: '1968-02-08'
    thread: elections-1968
    c: Washington. Wallace announces for President, outside the two parties; in California the American Independent Party, his, already qualified for the ballot by registration (Check).
    n: '[[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]; [[w.chester-american-melodrama]]; [[w.gould-1968]]. Names: Wallace.'
    tags: [name:wallace-george-c, state:ca]
  - id: cal.1968-02-08.robert-kennedy
    when: Feb. 8
    date: '1968-02-08'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Chicago, the Book and Author Luncheon. Robert Kennedy on the war: the enemy, striking across the South, "has finally shattered the mask of official illusion with which we have concealed our true circumstances, even from ourselves."'
    n: '[[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. See [[cal.1968-01-30.robert-kennedy]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f, city:chicago]
  - id: cal.1968-02-08.foreign-aid
    when: Feb. 8
    date: '1968-02-08'
    thread: foreign-aid
    c: 'Message on foreign aid, "To Build the Peace": an economic aid appropriation of $2.5 billion; $412 million in callable capital for the Inter-American Development Bank; agriculture half of AID''s development aid, about $800 million; $35 million for family planning abroad in 1968.'
    n: '[Special Message to the Congress on the Foreign Assistance Programs: "To Build the Peace"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-foreign-assistance-programs-build-the-peace) (Feb. 8, 1968). See [[cal.1968-01-17.program]]; [[cal.1967-12-14.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-09.vietnam
    when: Feb. 9
    date: '1968-02-09'
    thread: vietnam-tet
    c: 'Wheeler to Westmoreland, Feb. 7 and 9: if more troops are needed, ask; make the request urgent. Westmoreland to Wheeler and Sharp, Feb. 9: the enemy''s plan in three phases; he "would welcome reinforcements at any time they can be made available."'
    n: 'FRUS 1964–68, VI, doc. [63](https://history.state.gov/historicaldocuments/frus1964-68v06/d63). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Westmoreland, Sharp.'
    tags: [name:wheeler-earle, name:westmoreland-william, name:sharp-u-s-grant]

  - id: cal.1968-02-10.japan-and-korea
    when: Feb. 10–15
    date: '1968-02-10'
    thread: korea
    c: 'Vance, Johnson''s envoy, in Seoul. His aims: no independent military action by the South against the North; the agitation for reprisals damped; consent to the private talks with the North Koreans on the *Pueblo*. Joint communiqué, Feb. 15. To Johnson that evening: Park took the raid as a personal affront; "a very strong danger of unilateral action by Pak."'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [180](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d180). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-21.japan-and-korea]]; [[cal.1968-01-23.japan-and-korea]]. Names: Vance, Johnson, Park.'
    tags: [name:vance-cyrus, name:johnson-lyndon-b, name:park-chung-hee]

  - id: cal.1968-02-10.jobs-and-wages-nyc
    when: Feb. 10
    date: '1968-02-10'
    thread: labor-disputes
    also: [states-and-cities]
    c: 'New York City. The sanitation men return to work. Lindsay had asked Rockefeller for the National Guard; refused. Rockefeller had proposed that the State take over the Department of Sanitation (Check the day). The legislature does not pass the takeover; the dispute to arbitration (Check).'
    n: 'Check: *Public Papers of Nelson A. Rockefeller*, 1968. See [[cal.1968-02-02.jobs-and-wages-nyc]]. Names: Lindsay, Rockefeller.'
    tags: [state:ny, city:nyc, name:lindsay-john-v, name:rockefeller-nelson]

  - id: cal.1968-02-11.opinion
    when: Feb. 11
    date: '1968-02-11'
    thread: opinion
    also: [japan-and-korea-pueblo]
    c: 'Gallup, Feb. 1–6: the North Korean situation involving the *Pueblo* likely to lead to war: is 45 percent, is not 41. What the United States should do: get the ship back, using force if necessary, 40; negotiate as at present 21; negotiate to a point, then use force, 6; apologize for spying 2. Johnson''s handling of it: approve 47, disapprove 33.'
    n: '[[w.gallup-poll]], III, 2105. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-12.vietnam-tet
    when: Feb. 12
    date: '1968-02-12'
    thread: vietnam-tet
    c: 'Westmoreland: the enemy''s third phase, to take Quảng Trị and Thừa Thiên, begun; he asks for reinforcements now. Johnson with his advisers: a brigade of the 82d Airborne, 3,800 men, and Marines, 6,500, to Vietnam; the Joint Chiefs had asked that a reserve call-up come first.'
    n: 'FRUS 1964–68, VI, docs. [68](https://history.state.gov/historicaldocuments/frus1964-68v06/d68), [70](https://history.state.gov/historicaldocuments/frus1964-68v06/d70). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]. Names: Westmoreland, Johnson.'
    tags: [name:westmoreland-william, name:johnson-lyndon-b]

  - id: cal.1968-02-12.king
    when: Feb. 12
    date: '1968-02-12'
    thread: king-memphis
    also: [labor-disputes]
    c: 'Memphis. The city''s sanitation workers, some 1,300, nearly all Negroes, strike for recognition of their union, Local 1733 of AFSCME, after two of them were crushed in a garbage truck''s compactor, Feb. 1. Loeb: the strike illegal; no recognition.'
    n: '[[w.honey-going-down-jericho-road]]; [[w.beifuss-at-the-river-i]]; [[w.garrow-bearing-the-cross]]. See [[cal.1967-11-02.mayors-memphis]]; [[cal.1967-12-04.king]]. Names: Loeb.'
    tags: [name:loeb-henry, state:tn, city:memphis]

  - id: cal.1968-02-13.state-and-city-finance-seattle
    when: Feb. 13
    date: '1968-02-13'
    thread: state-and-city-finance
    also: [transportation, cities-and-housing]
    c: Seattle and King County vote on Forward Thrust's twelve bond propositions, each needing 60 percent. Seven carry, among them parks, $118 million, 64.7 percent; a domed stadium, $40 million, 62.3; arterial highways, $81.6 million, 62.2. Rapid transit, $385 million with $765 million federal, fails, 50.8 percent; low-income housing, $3 million, 57.9.
    n: 'Votes: [Wikipedia, "Forward Thrust"](https://en.wikipedia.org/wiki/Forward_Thrust), from HistoryLink; Check: the King County canvass, Feb. 13, 1968. [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1964-03-10.mayors-seattle]].'
    tags: [state:wa, city:seattle]
  - id: cal.1968-02-14.opinion
    when: Feb. 14
    date: '1968-02-14'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 1–6: Johnson''s handling of Vietnam: approve 35 percent, disapprove 50. Describing oneself: hawk 61, dove 23. A bombing halt or continued bombing the better chance for meaningful peace talks: continue 70, halt 15. The war to end in an all-out victory 20, a compromise peace settlement 61, a defeat 5.'
    n: '[[w.gallup-poll]], III, 2105–06. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-14.transition-and-staff
    when: Feb. 14
    date: '1968-02-14'
    thread: transition-and-staff
    also: [cities-and-housing]
    c: 'Johnson: Gardner to be chairman of the Urban Coalition.'
    n: '[Statement by the President on Secretary Gardner''s Decision To Serve as Chairman of the Urban Coalition](https://www.presidency.ucsb.edu/documents/statement-the-president-secretary-gardners-decision-serve-chairman-the-urban-coalition) (Feb. 14, 1968). See [[cal.1968-01-25.transition-and-staff]]. Names: Gardner, Johnson.'
    tags: [name:gardner-john-w, name:johnson-lyndon-b]

  - id: cal.1968-02-15.economy
    when: Feb. 15
    date: '1968-02-15'
    thread: economy
    also: [transition-and-staff]
    c: 'Okun named chairman of the Council of Economic Advisers, Ackley''s successor; Peck sworn in as a member.'
    n: '[Remarks at the Swearing In of Merton J. Peck as a Member, Council of Economic Advisers, and Upon Designating Arthur M. Okun as Chairman](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-merton-j-peck-member-council-economic-advisers-and-upon-designating) (Feb. 15, 1968). See [[cal.1968-02-01.economy]]. Names: Okun, Ackley, Peck, Johnson.'
    tags: [name:johnson-lyndon-b, name:okun-arthur-m, name:ackley-gardner, name:peck-merton-j]

  - id: cal.1968-02-16.draft
    when: Feb. 16
    date: '1968-02-16'
    thread: draft
    also: [students]
    c: 'The National Security Council''s advice to Hershey, Director of Selective Service: no more deferments for graduate study but in medicine, dentistry and allied fields, students beyond their first year to finish (Check); the lists of essential activities and critical occupations suspended, each case to the local board.'
    n: '[[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]; [[w.baskir-chance-and-circumstance]]. See [[cal.1967-06-30.draft]]. Names: Hershey.'
    tags: [name:hershey-lewis-b]
  - id: cal.1968-02-16.transition-and-staff
    when: Feb. 16
    date: '1968-02-16'
    thread: transition-and-staff
    c: 'News conference: Trowbridge resigns as Secretary of Commerce, from Mar. 1, for his health; C. R. Smith, chairman of American Airlines, to succeed him. Crooker for Murphy at the Civil Aeronautics Board.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1040); [Letter Accepting Resignation of Alexander B. Trowbridge as Secretary of Commerce](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-alexander-b-trowbridge-secretary-commerce) (Feb. 16, 1968). See [[cal.1968-01-25.transition-and-staff]]. Names: Trowbridge, Smith, Crooker, Murphy, Johnson.'
    tags: [name:trowbridge-alexander-b, name:smith-c-r, name:crooker-john-h-jr, name:murphy-charles-s, name:johnson-lyndon-b]
  - id: cal.1968-02-17.vietnam-tet
    when: Feb. 17–18
    date: '1968-02-17'
    thread: vietnam-tet
    c: 'Johnson sees the paratroopers off at Fort Bragg, N.C., and Marines at El Toro, Cal.; Feb. 18, aboard the *Constellation*.'
    n: '[Remarks at Fort Bragg, North Carolina](https://www.presidency.ucsb.edu/documents/remarks-fort-bragg-north-carolina); [Remarks at El Toro Marine Corps Air Station, California](https://www.presidency.ucsb.edu/documents/remarks-el-toro-marine-corps-air-station-california) (Feb. 17, 1968). See [[cal.1968-01-30.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-02-19.open-housing
    when: Feb. 19
    date: '1968-02-19'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Johnson to Hart, on H.R. 2516: "Both conscience and reason insist that it be passed."'
    n: '[Letter to Senator Hart Expressing His Views on Pending Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/letter-senator-hart-expressing-his-views-pending-civil-rights-legislation) (Feb. 19, 1968). See [[cal.1968-02-06.open-housing]]. Names: Hart, Johnson.'
    tags: [name:hart-philip-a, name:johnson-lyndon-b]

  - id: cal.1968-02-19.school-aid-fl
    when: Feb. 19–Mar.
    date: '1968-02-19'
    thread: school-aid
    also: [state-and-city-finance, labor-disputes]
    c: 'Florida. The teachers'' statewide walkout, called by the Florida Education Association: at its height 25,712, some 40 percent of the State''s teachers, by resignations; schools closed in about two-thirds of the counties. The special session Kirk called in January had raised taxes for the schools; the FEA calls the sums too small. Kirk and the legislature give no more. By the end of March most teachers back.'
    n: '[Wikipedia, "Florida statewide teachers'' strike of 1968"](https://en.wikipedia.org/wiki/Florida_statewide_teachers%27_strike_of_1968). Check: the taxes enacted in the special session (the sales tax to 4 percent) and whether Kirk signed them, from the *Laws of Florida*, 1968, Extraordinary Session. [[w.kallina-claude-kirk-and-the]]; [[w.colburn-floridas-gubernatorial-politics-in]]. See [[cal.1967-01.crime-and-hijacking-fl]]. Names: Kirk.'
    tags: [state:fl, name:kirk-claude-r-jr]
  - id: cal.1968-02-20.specials
    when: Feb. 20
    date: '1968-02-20'
    thread: specials
    also: [war-opposition]
    c: 'New York 13th, Brooklyn. Podell (D), an assemblyman, takes the seat of Multer (D), who resigned Dec. 31 for the State Supreme Court: Podell 49.7 percent; the New Leadership Party''s candidate, against the war, 38.4; the Republican 6.7; the Conservative 5.2.'
    n: 'Shares: [Wikipedia, "1968 United States House of Representatives elections"](https://en.wikipedia.org/wiki/1968_United_States_House_of_Representatives_elections). Check: the State''s canvass, the *Legislative Manual*, 1968. See [[cal.1967-12-12.specials]]. Names: Podell, Multer.'
    tags: [special:1968-02-20-h-NY-13, name:podell-bertram-l, name:multer-abraham-j, state:ny, city:nyc]
  - id: cal.1968-02-20.vietnam
    when: Feb. 20
    date: '1968-02-20'
    thread: vietnam
    c: 'The Senate Foreign Relations Committee, in closed session, on the Gulf of Tonkin attacks of August 1964: McNamara and Wheeler before Fulbright''s committee. McNamara: the second attack, Aug. 4, took place. The text released, censored, Feb. 24 (Check).'
    n: '*The Gulf of Tonkin, the 1964 Incidents: Hearing Before the Senate Committee on Foreign Relations*, 90th Cong., 2d Sess. (1968). [[w.moise-tonkin-gulf-and-the]]; [[w.woods-fulbright]]; [[w.goulden-truth-is-the-first]]. See [[cal.1964-08-04.vietnam]]. Names: McNamara, Wheeler, Fulbright.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:fulbright-j-william]
  - id: cal.1968-02-20.japan-and-korea
    when: Feb. 20
    date: '1968-02-20'
    thread: korea
    c: 'Vance''s report to Johnson: a review of policy toward Korea.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [181](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d181), [211](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d211) (the review, Dec. 23). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-02-10.japan-and-korea]]. Names: Vance, Johnson.'
    tags: [name:vance-cyrus, name:johnson-lyndon-b]

  - id: cal.1968-02-20.open-housing
    when: Feb. 20
    date: '1968-02-20'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Senate, H.R. 2516: cloture refused, [55–37](https://voteview.com/rollcall/RS0900318), short of two-thirds.'
    n: 'See [[cal.1968-02-06.open-housing]].'

  - id: cal.1968-02-21.economy
    when: Feb. 21
    date: '1968-02-21'
    thread: economy-gold
    also: [trade]
    c: 'The House, H.R. 14743: the 25 percent gold reserve behind Federal Reserve notes ended. Recommittal refused, [189–205](https://voteview.com/rollcall/RH0900257); passed, [199–190](https://voteview.com/rollcall/RH0900258). Fowler to Johnson, Feb. 7: talk in the City of London of a new international financial crisis in March.'
    n: 'FRUS 1964–68, VIII, doc. [180](https://history.state.gov/historicaldocuments/frus1964-68v08/d180). [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]. See [[cal.1968-01-01.economy]]. Names: Fowler, Johnson.'
    tags: [name:fowler-henry-h, name:johnson-lyndon-b]
  - id: cal.1968-02-21.vietnam
    when: Feb. 21
    date: '1968-02-21'
    thread: vietnam
    c: U Thant with Johnson, after talks in New Delhi and Paris. Hanoi, through the French, takes "the appropriate time" after a halt to mean the time needed to show the halt effective; officially told of a halt, it would talk at once. "They want to talk."
    n: 'FRUS 1964–68, VI, doc. [81](https://history.state.gov/historicaldocuments/frus1964-68v06/d81). [[w.thant-view-from-the-un]]; [[w.herring-secret-diplomacy-of-the]]. Made public: FRUS 1964–68, VI (2002). See [[cal.1967-12-29.vietnam]]. Names: U Thant, Johnson.'
    tags: [name:u-thant, name:johnson-lyndon-b]
  - id: cal.1968-02-21.opinion
    when: Feb. 21
    date: '1968-02-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 1–6: Republicans'' choice for 1968: Nixon 51 percent, Rockefeller 25, Reagan 8, Romney 7, Percy 3, Hatfield 2, Lindsay 2, Gavin 1; no preference 1. Independents: Nixon 34, Rockefeller 26, Reagan 13, Romney 11, Percy 5.'
    n: '[[w.gallup-poll]], III, 2106. Names: Nixon, Rockefeller, Reagan, Romney, Percy, Hatfield, Lindsay, Gavin.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:romney-george-w, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v, name:gavin-james-m]
  - id: cal.1968-02-21.open-housing
    when: Feb. 21
    date: '1968-02-21'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Senate, H.R. 2516: a motion to table the Mondale amendment, fair housing, fails, [34–58](https://voteview.com/rollcall/RS0900319).'
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Mondale.'
    tags: [name:mondale-walter-f]

  - id: cal.1968-02-22.cities-and-housing
    when: Feb. 22
    date: '1968-02-22'
    thread: cities-and-housing
    c: 'Message on the cities, "The Crisis of the Cities." A Housing and Urban Development Act of 1968: 26 million homes and apartments to be built in ten years, 6 million of them for low- and middle-income families (Check); 300,000 assisted starts in fiscal 1969; home ownership for needy families; rent supplements, $65 million; flexible interest ceilings on FHA mortgages; the Federal National Mortgage Association''s secondary market to private hands; the antipoverty program at its authorized $2.18 billion.'
    n: '[Special Message to the Congress on Urban Problems: "The Crisis of the Cities"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-urban-problems-the-crisis-the-cities) (Feb. 22, 1968). [[w.haar-between-the-idea-and]]. See [[cal.1968-01-17.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-23.economy
    when: Feb. 23
    date: '1968-02-23'
    thread: economy
    c: 'A Cabinet Committee on Price Stability: the Secretaries of the Treasury, Commerce and Labor and the Budget Director, the Council of Economic Advisers'' chairman to coordinate it.'
    n: '[Memorandum Establishing the Cabinet Committee on Price Stability](https://www.presidency.ucsb.edu/documents/memorandum-establishing-the-cabinet-committee-price-stability) (Feb. 23, 1968). See [[cal.1968-02-01.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]

  - id: cal.1968-02-23.king-memphis
    when: Feb. 23
    date: '1968-02-23'
    thread: king-memphis
    also: [labor-disputes]
    c: 'Memphis. Police use Mace on ministers and strikers marching down Main Street.'
    n: 'See [[cal.1968-02-12.king]].'
    tags: [state:tn, city:memphis]

  - id: cal.1968-02-24.vietnam
    when: Feb. 24–25
    date: '1968-02-24'
    thread: vietnam-tet
    c: Huế retaken. South Vietnamese troops of Trưởng's 1st Division raise the Republic's flag over the Citadel, Feb. 24, after Marines and South Vietnamese had fought for the city from Feb. 1. Graves of civilians killed during the occupation found in the weeks after (Check the count).
    n: 'The flag-raising at the Citadel, Lansdale to Bunker, Feb. 27: FRUS 1964–68, VI, doc. [88](https://history.state.gov/historicaldocuments/frus1964-68v06/d88). See [[cal.1968-01-30.vietnam]]. Names: Ngô Quang Trưởng.'
    tags: [name:ngo-quang-truong, place:hue]
  - id: cal.1968-02-25.opinion
    when: Feb. 25
    date: '1968-02-25'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 1–6: Johnson 42 percent, Nixon 42, undecided 16. With Wallace as a third party''s candidate (the book prints Feb. 1–5): Johnson 39, Nixon 39, Wallace 11, undecided 11.'
    n: '[[w.gallup-poll]], III, 2106–07. Names: Johnson, Nixon, Wallace.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:wallace-george-c]
  - id: cal.1968-02-26.open-housing
    when: Feb. 26–28
    date: '1968-02-26'
    thread: open-housing
    c: Senate, H.R. 2516. Feb. 26, cloture refused again, [56–36](https://voteview.com/rollcall/RS0900320). Dirksen, after talks with the Justice Department and the bill's managers, offers a substitute with fair housing in it, a single-family house sold or rented by its owner without a broker exempted (Check). Feb. 28, the modified Mondale amendment tabled, [83–5](https://voteview.com/rollcall/RS0900321), the Dirksen substitute, No. 554, in its place.
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Dirksen, Mondale.'
    tags: [name:dirksen-everett, name:mondale-walter-f]
  - id: cal.1968-02-26.defense-thule
    when: Feb. 26
    date: '1968-02-26'
    thread: defense-thule
    also: [europe-and-the-alliance]
    c: 'Ronne''s note to Rusk: Denmark takes the American assurances that no nuclear weapons are in Greenland and none fly over it.'
    n: 'FRUS 1964–68, XII, doc. [11](https://history.state.gov/historicaldocuments/frus1964-68v12/d11). See [[cal.1968-01-21.defense]]. Names: Ronne, Rusk.'
    tags: [name:ronne-torben, name:rusk-dean]
  - id: cal.1968-02-27.press-and-broadcasting
    when: Feb. 27
    date: '1968-02-27'
    thread: press-and-broadcasting
    also: [vietnam]
    c: 'CBS, *Report from Vietnam: Who, What, When, Where, Why?* Cronkite, back from Saigon and Huế: "it seems now more certain than ever that the bloody experience of Vietnam is to end in a stalemate"; the rational way out, to negotiate, "not as victors, but as an honorable people who lived up to their pledge to defend democracy, and did the best they could."'
    n: '[[w.brinkley-cronkite]]; [[w.cronkite-reporters-life]]; [[w.campbell-getting-it-wrong]]; [[w.hallin-uncensored-war-the-media]]; [[w.braestrup-big-story]]. Names: Cronkite.'
    tags: [name:cronkite-walter, place:saigon, place:hue]
  - id: cal.1968-02-27.vietnam
    when: Feb. 27
    date: '1968-02-27'
    thread: vietnam-205000
    also: [defense]
    c: 'Wheeler, back from Saigon, to Johnson: the enemy''s first attack "nearly succeeded in a dozen places"; Westmoreland asks for 205,000 more men, 105,000 by May 1. At State, McNamara: a reserve call-up of at least 150,000 needed, $10 billion more in fiscal 1969; "I do not understand what the strategy is in putting in 205,000 men."'
    n: 'FRUS 1964–68, VI, docs. [89](https://history.state.gov/historicaldocuments/frus1964-68v06/d89), [90](https://history.state.gov/historicaldocuments/frus1964-68v06/d90). [[w.schandler-unmaking-of-a-president]]; [[w.clifford-counsel-to-the-president-2]]; [[w.hoopes-limits-of-intervention]]; [[w.isaacson-wise-men]]. Made public: the request, *New York Times*, Mar. 10, 1968; the meetings, the Pentagon Papers (1971) and FRUS 1964–68, VI (2002). See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Westmoreland, McNamara, Johnson.'
    tags: [name:wheeler-earle, name:westmoreland-william, name:mcnamara-robert-s, name:johnson-lyndon-b, place:saigon]

  - id: cal.1968-02-27.farm
    when: Feb. 27
    date: '1968-02-27'
    thread: farm
    c: 'Message on agriculture, "Prosperity and Progress for the Farmer and Rural America," a seven-point plan: Food for Freedom extended three years, to Dec. 31, 1971; the food stamp authorization for 1969 from $225 million to $245 million; a security reserve of commodities; bargaining power for farmers (Check).'
    n: '[Special Message to the Congress: "Prosperity and Progress for the Farmer and Rural America"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-prosperity-and-progress-for-the-farmer-and-rural-america) (Feb. 27, 1968). See [[cal.1968-01-17.program]]; [[cal.1967-09-27.farm]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-28.elections-1968
    when: Feb. 28
    date: '1968-02-28'
    thread: elections-1968
    c: Washington. Romney withdraws from the race for the Republican nomination, two weeks before the New Hampshire primary (Check the place).
    n: '[[w.johns-achilles-heel]]; [[w.white-making-of-the-president-1969]]; [[w.witcover-resurrection-of-richard-nixon]]; [[w.chester-american-melodrama]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-11-18.elections-1968]]. Names: Romney.'
    tags: [name:romney-george-w]
  - id: cal.1968-02-28.vietnam-205000
    when: Feb. 28–29
    date: '1968-02-28'
    thread: vietnam-205000
    c: 'Johnson''s meeting on Wheeler''s report. Clifford to head a review of the request; his group, Rusk, McNamara, Katzenbach, Bundy, Nitze, Warnke, Taylor, Helms, Wheeler and Fowler among it, meets that day. Rostow, Feb. 29, for granting it.'
    n: 'FRUS 1964–68, VI, docs. [91](https://history.state.gov/historicaldocuments/frus1964-68v06/d91), [92](https://history.state.gov/historicaldocuments/frus1964-68v06/d92), [93](https://history.state.gov/historicaldocuments/frus1964-68v06/d93). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Johnson, Wheeler, Clifford, Rusk, McNamara, Katzenbach, Bundy, Nitze, Warnke, Taylor, Helms, Fowler, Rostow.'
    tags: [name:johnson-lyndon-b, name:wheeler-earle, name:clifford-clark, name:rusk-dean, name:mcnamara-robert-s, name:katzenbach-nicholas, name:bundy-william, name:nitze-paul, name:warnke-paul, name:taylor-maxwell, name:helms-richard, name:fowler-henry-h, name:rostow-walt-w]

  - id: cal.1968-02-28.defense
    when: Feb. 28–29
    date: '1968-02-28'
    thread: defense-clifford
    c: 'McNamara''s last days at Defense. Feb. 28, the East Room: Johnson gives him the Medal of Freedom. Feb. 29, the farewell ceremony at the Pentagon. To the World Bank.'
    n: '[Remarks Upon Presenting the Medal of Freedom to Robert S. McNamara](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-medal-freedom-robert-s-mcnamara) (Feb. 28, 1968); [Remarks at a Farewell Ceremony at the Pentagon Honoring Secretary McNamara](https://www.presidency.ucsb.edu/documents/remarks-farewell-ceremony-the-pentagon-honoring-secretary-mcnamara) (Feb. 29, 1968). See [[cal.1968-01-19.defense]]. Names: McNamara, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1968-02-28.states-and-cities-us
    when: Feb. 28–Mar. 1
    date: '1968-02-28'
    thread: states-and-cities
    c: 'Washington. The National Governors'' Conference''s first Mid-Year Meeting, on federal-state relations, set by its 59th Annual Meeting: its eleven committees with the administration''s and Congress''s leaders on pending federal bills. Johnson opens it, Feb. 29.'
    n: '[Remarks Opening the Midyear Conference of Governors of the States and Territories](https://www.presidency.ucsb.edu/documents/remarks-opening-the-midyear-conference-governors-the-states-and-territories) (Feb. 29, 1968). National Governors'' Conference, [*Summary of the Mid-Year Meeting on Federal-State Relations, February 28–March 1, 1968*, 1](https://www.nga.org/wp-content/uploads/2021/03/1968NGAWinterMeeting.pdf). [[w.sabato-goodbye-to-good-time]]. See [[cal.1967-10-16.states-and-cities-us]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-28.opinion
    when: Feb. 28
    date: '1968-02-28'
    thread: opinion
    also: [crime-and-hijacking, vietnam, civil-disorders]
    c: 'Gallup, two releases. Jan. 4–9: the most important problem facing the country: the Vietnam war, 53 percent; of the domestic problems, in order, crime and lawlessness (riots, looting, juvenile delinquency included), civil rights, the high cost of living, poverty, general unrest. Feb. 1–6: the most important problem facing this community: crime and lawlessness, named nearly twice as often as any other. Have called upon the police in the last twelve months, 19 percent; theft and robbery the reason most often named. Aug. 3–8, 1967: an area within a mile where one would be afraid to walk alone at night: yes 31; men 16, women 44; cities of 500,000 and over 40.'
    n: '[[w.gallup-poll]], III, 2107–08.'
  - id: cal.1968-02-29.civil-disorders
    when: Feb. 29
    date: '1968-02-29'
    thread: civil-disorders-kerner
    c: 'The National Advisory Commission on Civil Disorders, Kerner its chairman, Lindsay vice chairman, reports: "Our nation is moving toward two societies, one black, one white—separate and unequal"; white society "deeply implicated in the ghetto." Proposed: 2 million jobs in three years; 6 million units of decent housing in five years, 600,000 in the first; a national system of income supplementation; a federal open housing law (Check).'
    n: '[[w.report-of-the-national]]; [[w.gillon-separate-and-unequal]]; [[w.barnhart-kerner]]. See [[cal.1967-07-27.civil-disorders]]. Names: Kerner, Lindsay.'
    tags: [name:kerner-otto, name:lindsay-john-v]
  - id: cal.1968-02.states-and-cities-nj
    when: Feb.
    date: 1968-02
    thread: states-and-cities
    also: [civil-disorders]
    c: 'New Jersey. The Governor''s Select Commission on Civil Disorder, Lilley its chairman, named by Hughes Aug. 8, 1967, reports, *Report for Action*: no evidence of a conspiracy to organize the disorders of July in Newark and Plainfield; "excessive and unjustified force" by police and Guard against Negro citizens; ninety-nine recommendations. For Newark, a five-man Board of Police Commissioners named by the mayor to hear complaints against the police. Check the day.'
    n: '[*Report for Action*](https://www.ojp.gov/pdffiles1/Digitization/69748NCJRS.pdf) (Governor''s Select Commission on Civil Disorder, State of New Jersey, Feb. 1968), iii, 142–143, 164. [Rutgers, "Governor Richard Hughes and the Newark Report"](https://governors.rutgers.edu/governor-richard-hughes-and-the-newark-report/). [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]. See [[cal.1967-07-12.civil-disorders]]. Names: Lilley, Hughes.'
    tags: [state:nj, city:newark, name:lilley-robert-d, name:hughes-richard-j]
  - id: cal.1968-02-29.state-constitutions-pa
    when: Feb. 29
    date: '1968-02-29'
    thread: state-constitutions
    also: [legislatures]
    c: 'Harrisburg. Pennsylvania''s constitutional convention adjourns, its proposals adopted for the ballot of Apr. 23: the legislature''s apportionment; the judiciary; local government; taxation and State finance.'
    n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention) (the *Journal* and *Debates* run to Feb. 29). Check: *Constitutional Proposals Adopted by the Convention, 1967–68*. See [[cal.1967-12-01.state-constitutions-pa]].'
    tags: [state:pa]
  - id: cal.1968-02.states-and-cities-ar
    when: Feb.
    date: 1968-02
    thread: states-and-cities
    also: [crime-and-hijacking]
    c: 'Arkansas. Thomas Murton, Rockefeller''s superintendent at the Cummins prison farm, digs up three skeletons on its grounds, early February, after an inmate''s word of prisoners killed and buried as "escapees." Rockefeller: no point in "washing dirty linen for weeks on end as each body is dug up." A report on the Tucker farm that Faubus had ordered and kept back, released by Rockefeller in 1967, had told of floggings and the "Tucker telephone."'
    n: '[Wikipedia, "Tom Murton"](https://en.wikipedia.org/wiki/Tom_Murton), from *Time*, Feb. 1968. Check: the dates of the digging, from the *Arkansas Gazette*. [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. Names: Murton, Rockefeller, Faubus.'
    tags: [state:ar, name:murton-thomas-o, name:rockefeller-winthrop, name:faubus-orval-e]

