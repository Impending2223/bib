# Cal. LXII January 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXII
entries:
  - id: cal.1965-01-02.congress
    when: Jan. 2
    date: '1965-01-02'
    thread: congress
    also: [south-carolina, mississippi]
    c: House Democratic caucus. McCormack renominated for Speaker. Watson of South Carolina and Williams of Mississippi, who backed Goldwater, stripped of their seniority.
    n: '[111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf) (McCormack: "on Saturday last"). [[w.peabody-leadership-in-congress]]; [[w.zelizer-on-capitol-hill]]. See [[cal.1964-11-03.elections-1964]]. Names: McCormack (K–J Cong. III.C); Goldwater (Opp. III.B).'
    tags: [name:mccormack-john-w, name:watson-albert-w, name:williams-john-b, name:goldwater-barry-m]
  - id: cal.1965-01-02.voting-rights
    when: Jan. 2
    date: '1965-01-02'
    thread: voting-rights
    also: [alabama, king]
    c: Selma. King at Brown Chapel, against a State court's injunction on meetings. The campaign to register Dallas County's Black citizens begins.
    n: '[[w.garrow-protest-at-selma]]; [[w.lawson-black-ballots]]; [[w.may-bending-toward-justice]]; [[w.branch-pillar-of-fire]]; [[w.kotz-judgment-days]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1964-12-10.voting-rights]]. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-01-03.opinion
    when: Jan. 3
    date: '1965-01-03'
    thread: opinion
    also: [medicare]
    c: 'Gallup, Dec. 11–16, 1964: a compulsory program of hospital and nursing home insurance for the elderly, paid for by higher Social Security taxes: approve 63 percent, disapprove 28. Know why the American Medical Association opposes it: 52.'
    n: '[[w.gallup-poll]], III, 1915.'
  - id: cal.1965-01-04.congress-2
    when: Jan. 4
    date: '1965-01-04'
    thread: congress
    also: [elections-1964]
    c: House Republicans, in conference, choose Ford over Halleck for minority leader, 73–67.
    n: '[[w.peabody-ford-halleck-minority-leadership]]; [[w.peabody-leadership-in-congress]]; [[w.jones-minority-party-in-congress]]; [[w.ford-time-to-heal]]; [[w.scheele-charlie-halleck]]. See [[cal.1963-01-09.congress]]. Names: Ford, Halleck (K–J Cong. III.C; Opp. III.C).'
    tags: [name:ford-gerald-r, name:halleck-charles-a]
  - id: cal.1965-01-04.congress
    when: Jan. 4
    date: '1965-01-04'
    thread: congress
    also: [rules]
    c: '89th Congress convenes. Senate 68 D–32 R; House 295 D–140 R. McCormack Speaker over Ford, [289–139](https://voteview.com/rollcall/RH0890001). The five Mississippians seated over the Freedom Democrats'' challenge, Ryan objecting: the previous question, [276–149](https://voteview.com/rollcall/RH0890002). New rules, [224–202](https://voteview.com/rollcall/RH0890003) on the previous question: the 21-day rule restored; a bill sent to conference by majority vote.'
    n: 'H.R. Res. 1, H.R. Res. 8, 89th Cong. [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf). [[w.robinson-house-rules-committee]]; [[w.macneil-forge-of-democracy]]; [[w.bolling-house-out-of-order]]; [[w.zelizer-on-capitol-hill]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.dittmer-local-people]]. CQ Almanac 1965; [[w.congress-and-the-nation-1969]] (K–J Cong. II.L). See [[cal.1963-01-09.congress]]; [[cal.1963-01-09.rules]]. Names: McCormack, Ford (K–J Cong. III.C).'
    tags: [congress:89, name:mccormack-john-w, name:ford-gerald-r, name:ryan-william-f]
  - id: cal.1965-01-04.program
    when: Jan. 4
    date: '1965-01-04'
    thread: program
    c: 'State of the Union: "the Great Society." Education, $1.5 billion the first year; hospital care under Social Security; the war on poverty doubled; "every remaining obstacle" to the vote removed; immigration by a man''s work, not his birthplace; a Department of Housing and Urban Development; excise taxes cut. Vietnam: "We will not break it now."'
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-26) (Jan. 4, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf). [[w.zelizer-fierce-urgency-of-now]]; [[w.sundquist-politics-and-policy]]; [[w.dallek-flawed-giant]]; [[w.johnson-vantage-point]]. See [[cal.1964-01-08.program]]; [[cal.1964-05-22.program]].'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - medicare: cal.1965-01-07.medicare
      - health: cal.1965-01-07.medicare
      - school-aid: cal.1965-01-12.school-aid
      - immigration: cal.1965-01-13.immigration
  - id: cal.1965-01-07.medicare
    when: Jan. 7
    date: '1965-01-07'
    thread: medicare
    also: [health]
    c: 'Health message. Hospital insurance for those over 65 under Social Security: hospital and post-hospital care, home nursing, outpatient diagnosis; for those outside Social Security, from the administrative budget. Regional centers against heart disease, cancer, and stroke. The King–Anderson bill: H.R. 1, Jan. 4; S. 1, Jan. 6.'
    n: '[Special Message to the Congress: "Advancing the Nation''s Health"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-advancing-the-nations-health) (Jan. 7, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-2.pdf); [111 Cong. Rec., Senate, Jan. 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-3-2.pdf). See [[cal.1961-02-09.medicare]]; [[cal.1964-12-09.health]]. Names: Anderson (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:king-cecil-r, name:anderson-clinton-p]
  - id: cal.1965-01-10.opinion
    when: Jan. 10
    date: '1965-01-10'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Dec. 11–16, 1964: Republicans'' first choice to lead the party: Nixon 27, Lodge 18, Goldwater 15, Romney 14, Scranton 8, Rockefeller 6, Taft 4, Hatfield 3, Percy 2. Independents: Lodge 21, Romney 19, Nixon 18, Goldwater 14. Nov. 20–25, 1964: Romney over Goldwater for the leadership, 51 to 34.'
    n: '[[w.gallup-poll]], III, 1916–17. Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Romney, Scranton, Rockefeller (Opp. III.H).'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:rockefeller-nelson, name:taft-robert-jr, name:hatfield-mark-o, name:percy-charles-h]
  - id: cal.1965-01-12.school-aid
    when: Jan. 12
    date: '1965-01-12'
    thread: school-aid
    c: Education message. $1 billion to schools serving children of low-income families, paid through the States by the census count of such families in each district; books for children in public and private schools; supplementary centers; regional laboratories; college scholarships and loans. H.R. 2362 (Perkins) and S. 370 (Morse) introduced the same day.
    n: '[Special Message to the Congress: "Toward Full Educational Opportunity"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-toward-full-educational-opportunity) (Jan. 12, 1965). [111 Cong. Rec., House, Jan. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-7-2.pdf); [111 Cong. Rec., Senate, Jan. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-7-1.pdf). [[w.eidenberg-act-of-congress]]; [[w.bailey-esea]]; [[w.graham-uncertain-triumph]]. See [[cal.1961-02-20.school-aid]]. Names: Perkins (K–J Cong. III.D); Morse (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:perkins-carl-d, name:morse-wayne]
  - id: cal.1965-01-12.elections-1964
    when: Jan. 12
    date: '1965-01-12'
    thread: elections-1964
    also: [goldwater]
    c: Burch to leave the Republican national chairmanship Apr. 1, after meeting Goldwater in Phoenix; Bliss, the Ohio chairman, to succeed him. Check the date.
    n: '[[w.kabaservice-rule-and-ruin]]; [[w.rae-decline-and-fall-of]]. See [[cal.1964-11-04.elections-1964]]. Names: Burch, Bliss (Opp. III.E); Goldwater (Opp. III.B).'
    tags: [name:burch-dean, name:bliss-ray-c, name:goldwater-barry-m]
  - id: cal.1965-01-13.immigration
    when: Jan. 13
    date: '1965-01-13'
    thread: immigration
    c: Immigration message. The national-origins quotas ended over five years; preference by skill and by kinship to citizens and resident aliens; no country more than 10 percent of the numbers; the Asia-Pacific Triangle abolished.
    n: '[Special Message to the Congress on Immigration](https://www.presidency.ucsb.edu/documents/special-message-the-congress-immigration-0) (Jan. 13, 1965). [[w.tichenor-dividing-lines]]; [[w.zolberg-nation-by-design]]; [[w.reimers-still-the-golden-door]]; [[w.yang-one-mighty-and-irresistible]]. See [[cal.1963-07-23.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01-15.opinion
    when: Jan. 15
    date: '1965-01-15'
    thread: opinion
    c: 'Gallup, special mail survey of 1,395 Republican county chairmen: Burch to stay as national chairman, 46 percent; to go, 43. South 66 stay; West 53; Midwest 43; East 26 stay, 63 go.'
    n: '[[w.gallup-poll]], III, 1917–18. Names: Burch (Opp. III.E).'
    tags: [name:burch-dean]
  - id: cal.1965-01-16.trade
    when: Jan. 16
    date: '1965-01-16'
    thread: trade
    c: 'Johnson and Pearson sign the automotive products agreement at the LBJ Ranch, [17 U.S.T. 1372](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-17-1/lltreaties-17-1.pdf#page=1384): new cars and original parts free of duty between the two countries, for the manufacturers. In force provisionally that day. U.N.T.S. cite: check.'
    n: '[Remarks With Prime Minister Pearson Upon Signing U.S.-Canadian Trade Agreement on Automotive Products](https://www.presidency.ucsb.edu/documents/remarks-with-prime-minister-pearson-upon-signing-us-canadian-trade-agreement-automotive) (Jan. 16, 1965). T.I.A.S. No. 6093. See [[cal.1963-10-09.trade]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:pearson-lester-b]
  - id: cal.1965-01-17.opinion
    when: Jan. 17
    date: '1965-01-17'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, the same county chairmen, their own first choice to lead the party: Nixon 29, Goldwater 28, Scranton 13, Romney 11, Hatfield 5, Taft 3, Percy 3, Rockefeller 3, Lodge 2. The strongest candidate if the election were held now: Nixon 47, Romney 18, Scranton 11, Goldwater 8.'
    n: '[[w.gallup-poll]], III, 1918. Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Hatfield, Percy (Opp. III.B); Scranton, Romney, Rockefeller (Opp. III.H).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:scranton-william-w, name:romney-george-w, name:hatfield-mark-o, name:taft-robert-jr, name:percy-charles-h, name:rockefeller-nelson, name:lodge-henry-cabot]
  - id: cal.1965-01-20.transition-and-staff
    when: Jan. 20
    date: '1965-01-20'
    thread: transition-and-staff
    c: 'Inauguration. Johnson sworn by Warren, Humphrey by McCormack. The address: a covenant "conceived in justice, written in liberty, bound in union"; the Great Society "the excitement of becoming." The cabinet: Rusk, Dillon, McNamara, Katzenbach acting at Justice, Gronouski, Udall, Freeman, Connor, Wirtz, Celebrezze.'
    n: '[The President''s Inaugural Address](https://www.presidency.ucsb.edu/documents/the-presidents-inaugural-address) (Jan. 20, 1965). [111 Cong. Rec., Senate, Jan. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-13-2.pdf). [[w.dallek-flawed-giant]]; [[w.johnson-white-house-diary]]. See [[cal.1961-01-20.transition-and-staff]]. Names: Johnson, Humphrey (K–J Adm. III.D); Warren (K–J Cong. III.G); McCormack (K–J Cong. III.C); Rusk (K–J Adm. III.E); Dillon (K–J Adm. III.H); McNamara (K–J Adm. III.F); Katzenbach (K–J Adm. III.I); Gronouski, Udall, Freeman, Connor, Wirtz, Celebrezze (K–J Adm. III.G).'
    tags: [executive:1965-01-20, name:johnson-lyndon-b, name:humphrey-hubert-h, name:warren-earl, name:mccormack-john-w, name:rusk-dean, name:dillon-c-douglas, name:mcnamara-robert-s, name:katzenbach-nicholas, name:gronouski-john-a, name:udall-stewart-l, name:freeman-orville-l, name:connor-john-t, name:wirtz-w-willard, name:celebrezze-anthony-j]
  - id: cal.1965-01-21.testing
    when: Jan. 21
    date: '1965-01-21'
    thread: testing
    c: 'Gilpatric''s Committee on Nuclear Proliferation reports to Johnson and his advisers in the Cabinet Room. The spread of nuclear weapons a growing threat; the world "fast approaching a point of no return"; India and Japan may follow China, and others them. Its counsel: agreements against the spread, pressure on nations near the threshold, arms control with the Soviet Union. Jan. 23, Bundy: the report to be shown no one outside the Committee of Principals without the President''s approval.'
    n: '[Statement by the President to the Members of the Committee on Nuclear Proliferation](https://www.presidency.ucsb.edu/documents/statement-the-president-the-members-the-committee-nuclear-proliferation) (Jan. 21, 1965). [FRUS 1964–68, XI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v11/d64). [[w.brands-rethinking-nonproliferation]]; [[w.gavin-blasts-from-the-past]]. See [[cal.1964-10-16.testing]]. Names: Gilpatric (K–J Adm. III.F); Johnson (K–J Adm. III.D); Bundy (K–J Adm. III.E).'
    tags: [name:gilpatric-roswell-l, name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1965-01-22.voting-rights
    when: Jan. 22–25
    date: '1965-01-22'
    thread: voting-rights
    also: [alabama, king]
    c: Selma. Jan. 22, Black schoolteachers, some hundred, march on the Dallas County courthouse to register; Sheriff Clark's men push them from the steps three times. Jan. 25, King leads a line to the courthouse. Judge Thomas has ordered that a hundred may wait there unhindered; Clark arrests those beyond, and clubs a woman in the line who struck him. Check the dates and counts.
    n: '[[w.garrow-protest-at-selma]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]. Names: Clark, Thomas (K–J Cong. III.K); King (K–J Cong. III.H).'
    tags: [name:clark-james-g-jr, name:thomas-daniel-h, name:king-martin-luther-jr]
  - id: cal.1965-01-24.europe-and-the-alliance
    when: Jan. 24–30
    date: '1965-01-24'
    thread: europe-and-the-alliance
    c: 'Churchill dies in London, at ninety. Johnson, in Bethesda Naval Hospital with a cold, orders flags at half-staff until the burial. The funeral at St Paul''s, Jan. 30: Warren, Eisenhower and Ambassador Bruce for the United States; Rusk, in London, too ill to attend; Humphrey not sent. Feb. 4, Johnson: "I may have made a mistake." Check the dates of Johnson''s stay in hospital.'
    n: '[Statement by the President on the Death of Winston Churchill](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-winston-churchill) (Jan. 24, 1965); [Executive Order 11193—Winston Spencer Churchill](https://www.presidency.ucsb.edu/documents/executive-order-11193-winston-spencer-churchill) (Jan. 24, 1965), [30 Fed. Reg. 821](https://www.govinfo.gov/app/details/FR-1965-01-27); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1035) (Feb. 4, 1965). [[w.gilbert-never-despair]]. Names: Johnson, Humphrey (K–J Adm. III.D); Warren (K–J Cong. III.G); Eisenhower (Opp. III.E); Rusk (K–J Adm. III.E).'
    tags: [name:churchill-winston-s, name:johnson-lyndon-b, name:warren-earl, name:eisenhower-dwight-d, name:bruce-david-k-e, name:rusk-dean, name:humphrey-hubert-h]
  - id: cal.1965-01-25.economy
    when: Jan. 25
    date: '1965-01-25'
    thread: economy
    c: Budget for fiscal 1966. Expenditures $99.7 billion, $2.2 billion over 1965, under 15 percent of GNP; receipts $94.4 billion; deficit $5.3 billion, $1 billion under 1965's. Defense $51.6 billion, down $600 million; health, labor, education, housing and the poverty program up $3.6 billion. Excise taxes to be cut $1.75 billion a year from July 1; Social Security benefits up 7 percent, with hospital insurance.
    n: '[Annual Budget Message to the Congress, Fiscal Year 1966](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1966) (Jan. 25, 1965). [[w.morgan-deficit-government]]. See [[cal.1964-01-21.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01-26.foreign-aid
    when: Jan. 26–Feb. 11
    date: '1965-01-26'
    thread: foreign-aid
    c: 'House writes a ban on Food for Peace sales to the United Arab Republic into the supplemental farm appropriation, on Michel''s motion to recommit, [204–177](https://voteview.com/rollcall/RH0890005). Feb. 3, the Senate allows sales the President finds in the national interest, [44–38](https://voteview.com/rollcall/RS0890012); Feb. 4, Johnson asks the House to accept it; Feb. 8, the House declines to insist on the ban, [165–241](https://voteview.com/rollcall/RH0890006). Signed Feb. 11, [79 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg4.pdf): sales to the UAR only under the agreement of 1962 and as the President so finds.'
    n: '[111 Cong. Rec., House, Jan. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt1-17-1.pdf); [111 Cong. Rec., Senate, Feb. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-5-2.pdf); [111 Cong. Rec., House, Feb. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-7-1.pdf). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1035) (Feb. 4, 1965). FRUS 1964–68, XVIII, docs. [127](https://history.state.gov/historicaldocuments/frus1964-68v18/d127), [133](https://history.state.gov/historicaldocuments/frus1964-68v18/d133). See [[cal.1964-10-08.foreign-aid]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:michel-robert-h, name:johnson-lyndon-b]
  - id: cal.1965-01-27.vietnam
    when: Jan. 27
    date: '1965-01-27'
    thread: vietnam
    c: 'Saigon. The Armed Forces Council withdraws its confidence from Hương''s government and charges Khánh with the crisis: an alliance of Khánh and the Buddhist Institute, Taylor reports. Oánh acting Prime Minister. In Washington that morning, McGeorge Bundy and McNamara to Johnson: present policy "can lead only to disastrous defeat"; of two courses, military power "to force a change of Communist policy" or negotiation, they favor the first. Rusk dissents. Bundy to go to Saigon; American dependents to be withdrawn.'
    n: 'FRUS 1964–68, II, docs. [41](https://history.state.gov/historicaldocuments/frus1964-68v02/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v02/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v02/d43), [44](https://history.state.gov/historicaldocuments/frus1964-68v02/d44), [47](https://history.state.gov/historicaldocuments/frus1964-68v02/d47). [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.bird-color-of-truth]]; [[w.mcnamara-in-retrospect]]. See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-20.vietnam]]. Names: Hương, Khánh (Viet. III.G); Taylor, McGeorge Bundy, McNamara, Rusk (Viet. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:tran-van-huong, name:nguyen-khanh, name:nguyen-xuan-oanh, name:taylor-maxwell, name:bundy-mcgeorge, name:mcnamara-robert-s, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1965-01-28.economy
    when: Jan. 28
    date: '1965-01-28'
    thread: economy
    c: Economic Report. GNP $622 billion in 1964; for 1965, $660 billion, the midpoint of a $10 billion range. Unemployment 5.0 percent at the year's end, to average under 1964's 5.2. The guideposts restated. The gold reserve against Federal Reserve deposits to be repealed; the growth of notes and deposits could absorb the margin over the 25 percent cover "within two years or less."
    n: '[Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-11) (Jan. 28, 1965). [*Economic Report*, Jan. 1965](https://www.govinfo.gov/app/details/SERIALSET-12702_00_00-002-0028-0000). [[w.okun-political-economy-of-prosperity]]; [[w.stein-fiscal-revolution-in-america]]. See [[cal.1964-01-20.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-01-28.succession
    when: Jan. 28
    date: '1965-01-28'
    thread: succession
    c: 'Special message on presidential disability. Johnson asks Congress to pass S.J. Res. 1 (Bayh) and H.J. Res. 1 (Celler): the Vice President to act when the President is unable; a vacancy in the Vice Presidency filled by the President''s nominee. A second amendment proposed: each State''s electoral votes cast for the candidates who carry it, "and for no one else"; the Vice President-elect to become President if the President-elect dies before the term begins.'
    n: '[Special Message to the Congress on Presidential Disability and Related Matters](https://www.presidency.ucsb.edu/documents/special-message-the-congress-presidential-disability-and-related-matters) (Jan. 28, 1965). [111 Cong. Rec., House, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt1-1-2.pdf). [[w.bayh-one-heartbeat-away]]; [[w.feerick-twenty-fifth-amendment]]. See [[cal.1964-09-28.succession]]. Names: Johnson (K–J Adm. III.D); Bayh (Cong. III.B); Celler (K–J Cong. III.D).'
    tags: [name:johnson-lyndon-b, name:bayh-birch, name:celler-emanuel]
  - id: cal.1965-01-28.conservation
    when: Jan. 28
    date: '1965-01-28'
    thread: conservation
    c: 'Senate passes Muskie''s water quality bill, S. 4, [68–8](https://voteview.com/rollcall/RS0890005): a Federal Water Pollution Control Administration in HEW; standards of quality for interstate waters, set by the Secretary where the States have not set them.'
    n: '[111 Cong. Rec., Senate, Jan. 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-1-2.pdf). [[w.milazzo-unlikely-environmentalists]]. See [[cal.1963-12-17.program]]. Names: Muskie (K–J Cong. III.B).'
