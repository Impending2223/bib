# Cal. LII September 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LII
entries:
  - id: cal.1964-09-02.cities-and-housing
    when: Sept. 2
    date: '1964-09-02'
    thread: cities-and-housing
    c: Housing Act of 1964 signed, [78 Stat. 769](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg769.pdf). Housing and urban renewal programs funded to Sept. 30, 1965; rehabilitation loans in renewal areas; aid to code enforcement; rental housing for farmworkers. Conference report, House Aug. 19, [310–70](https://voteview.com/rollcall/RH0880218).
    n: '[Remarks Upon Signing the Housing Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-housing-act-0) (Sept. 2, 1964). Gelfand, *A Nation of Cities* (K–J Cong. II.B). See [[cal.1964-01-27.cities-and-housing]]; [[cal.1961-06-30.program]]. Names: Sparkman (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:sparkman-john, name:rains-albert-m]
  - id: cal.1964-09-02.economy
    when: Sept. 2
    date: '1964-09-02'
    thread: economy
    c: 'Interest Equalization Tax Act signed, [78 Stat. 809](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg809.pdf): the tax on Americans'' purchases of foreign stocks and bonds, from 2.75 to 15 percent of value, on acquisitions after July 18, 1963, through 1965.'
    n: See [[cal.1963-07-18.economy]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-02.medicare
    when: Sept. 2
    date: '1964-09-02'
    thread: medicare
    c: 'Senate adds hospital insurance for the aged to the Social Security bill, H.R. 11865: Gore''s amendment, [49–44](https://voteview.com/rollcall/RS0880509). Passed Sept. 3, [60–28](https://voteview.com/rollcall/RS0880511), with a $7 monthly rise in benefits. The House conferees will not take Medicare; the bill dies in conference at adjournment, Oct. 3.'
    n: '[110 Cong. Rec., Senate, Sept. 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf). [Statement by the President Following Senate Passage of the Medicare Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-passage-the-medicare-bill) (Sept. 2, 1964): "the first time either House of Congress has endorsed health care for the aged under the social security system." Marmor, *The Politics of Medicare*; Harris, *A Sacred Trust*; David, *With Dignity*; Zelizer, *Taxing America* (K–J Cong. II.B). Blumenthal & Morone, *The Heart of Power* (K–J Adm. II.B). See [[cal.1964-07-29.medicare]]; [[cal.1961-02-09.medicare]]. Names: Gore (K–J Cong. III.B).'
    tags: [name:gore-albert-sr, name:johnson-lyndon-b]
  - id: cal.1964-09-03.conservation
    when: Sept. 3
    date: '1964-09-03'
    thread: conservation
    c: 'Wilderness Act, [78 Stat. 890](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg890.pdf), and Land and Water Conservation Fund Act, [78 Stat. 897](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg897.pdf), signed. Wilderness: 9.1 million acres of national forest in 54 areas; no permanent roads or commercial enterprise; mining claims allowed through 1983; more by act of Congress. The fund, from park fees, surplus property sales, and the motorboat fuel tax, for federal and State recreation lands. Senate on the fund, Aug. 12, [92–1](https://voteview.com/rollcall/RS0880500).'
    n: 'Wilderness Act (K–J Cong. II.J.2). [Remarks Upon Signing the Wilderness Bill and the Land and Water Conservation Fund Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-wilderness-bill-and-the-land-and-water-conservation-fund-bill) (Sept. 3, 1964). Harvey, *Wilderness Forever*; Allin, *The Politics of Wilderness Preservation* (K–J Cong. II.B). Nash, *Wilderness and the American Mind* (K–J Cong. II.F). See [[cal.1964-07-30.conservation]]. Names: Anderson, Jackson (K–J Cong. III.B); Udall (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:anderson-clinton-p, name:jackson-henry-m, name:udall-stewart-l, name:aspinall-wayne-n]
  - id: cal.1964-09-03.transition-and-staff
    when: Sept. 3
    date: '1964-09-03'
    thread: transition-and-staff
    also: [elections-1964, robert-kennedy]
    c: Robert Kennedy resigns as Attorney General, nominated on Sept. 1 by New York's Democratic convention, on the first ballot, to run for the Senate against Keating. Katzenbach Acting Attorney General from Sept. 4.
    n: '[Johnson, Robert Kennedy, O''Donnell and Valenti](https://prde.upress.virginia.edu/conversations/4002922), Conversation WH6409-04-5453-5457-5458 (PRDE). [Letter Accepting Resignation of Robert F. Kennedy as Attorney General](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-robert-f-kennedy-attorney-general) (Sept. 3, 1964). Katzenbach, *Some of It Was Fun* (K–J Adm. II.G.6). See [[cal.1964-08-25.elections-1964]]. Names: Robert Kennedy (K–J Adm. III.A); Keating (Opp. III.B); Katzenbach (K–J Adm. III.I).'
    tags: [name:kennedy-robert-f, name:keating-kenneth-b, name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1964-09-03.goldwater
    when: Sept. 3
    date: '1964-09-03'
    thread: goldwater
    also: [elections-1964]
    c: Prescott, Arizona. Goldwater opens his campaign from the north steps of the Yavapai County Courthouse, where he had begun each race for national office.
    n: 'Shadegg, *What Happened to Goldwater?*; Perlstein, *Before the Storm* (Opp. II.B). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1964-07-15.elections-1964]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-09-04.latin-america
    when: Sept. 4
    date: '1964-09-04'
    thread: latin-america
    c: 'Chile. Frei, the Christian Democrat, elected President with 56 percent; Allende, of the Popular Action Front, 39. The CIA had given Frei money and organization, and run propaganda against Allende. Johnson, Sept. 5: "an internal matter in which the people of Chile were the only judges."'
    n: '[FRUS 1964–68, XXXI, docs. 269](https://history.state.gov/historicaldocuments/frus1964-68v31/d269), [270](https://history.state.gov/historicaldocuments/frus1964-68v31/d270). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1019) (Sept. 5, 1964). S. Select Comm. to Study Governmental Operations with Respect to Intelligence Activities, *Covert Action in Chile, 1963–1973*, 94th Cong. (Comm. Print 1975). Rabe, *The Killing Zone* (K–J Adm. II.D).'
    tags: [name:frei-montalva-eduardo, name:allende-gossens-salvador, name:johnson-lyndon-b]
  - id: cal.1964-09-04.opinion
    when: Sept. 4
    date: '1964-09-04'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Aug. 27–Sept. 1: the party more likely to keep the country out of World War III: Democratic 44 percent, Republican 20, no difference 20. To keep it prosperous: Democratic 53, Republican 21, no difference 12.'
    n: '*The Gallup Poll*, III, 1900 (K–J Cong. II.E).'
  - id: cal.1964-09-07.elections-1964
    when: Sept. 7
    date: '1964-09-07'
    thread: elections-1964
    also: [testing, goldwater]
    c: 'Labor Day. Johnson opens his campaign in Cadillac Square, Detroit: "There is no such thing as a conventional nuclear weapon." That night on NBC, the Democrats'' "Daisy": a girl counting petals, a countdown, a bomb; shown once. Seattle, Sept. 16: the release of nuclear weapons "by Presidential decision alone."'
    n: '[Remarks in Cadillac Square, Detroit](https://www.presidency.ucsb.edu/documents/remarks-cadillac-square-detroit) (Sept. 7, 1964); [Remarks in Seattle on the Control of Nuclear Weapons](https://www.presidency.ucsb.edu/documents/remarks-seattle-the-control-nuclear-weapons) (Sept. 16, 1964). Mann, *Daisy Petals and Mushroom Clouds* (K–J Cong. II.E). White, *The Making of the President 1964*; Lamb & Smith, *Campaign Decision-Making* (Opp. II.E). Perlstein, *Before the Storm* (Opp. II.B). Dallek, *Flawed Giant* (K–J Adm. II.A). See [[cal.1964-08-26.elections-1964]]; [[cal.1964-07-15.elections-1964]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-10.vietnam
    when: Sept. 10
    date: '1964-09-10'
    thread: vietnam
    c: NSAM 314, after the Sept. 9 meeting with Taylor. Destroyer patrols in the Gulf of Tonkin to resume, well beyond twelve miles; then the South's 34A raids. Talks with Laos on operations into the corridor. Ready to respond to any attack on American units. First, to strengthen the Saigon government.
    n: '[NSAM No. 314](https://history.state.gov/historicaldocuments/frus1964-68v01/d345) (Sept. 10, 1964); [FRUS 1964–68, I, doc. 343](https://history.state.gov/historicaldocuments/frus1964-68v01/d343). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1024) (Sept. 9, 1964). *The Pentagon Papers* (K–J Adm. II.H.3). Logevall, *Choosing War*; McMaster, *Dereliction of Duty*; Preston, *The War Council*; Goldstein, *Lessons in Disaster* (K–J Adm. II.D). Taylor, *Swords and Plowshares* (Viet. II.H.1). See [[cal.1964-08-07.vietnam]]. Names: Taylor (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:taylor-maxwell, name:bundy-mcgeorge]
  - id: cal.1964-09-10.court
    when: Sept. 10
    date: '1964-09-10'
    thread: court
    also: [congress]
    c: 'Senate refuses cloture on the Dirksen–Mansfield rider to the foreign aid bill, [30–63](https://voteview.com/rollcall/RS0880512): stays of court orders to reapportion State legislatures. Northern liberals filibustering. Sept. 24, Mansfield''s substitute, a sense of Congress that the courts may give legislatures six months, [44–38](https://voteview.com/rollcall/RS0880522); the bill passes, [45–16](https://voteview.com/rollcall/RS0880527). Dropped in conference.'
    n: '[110 Cong. Rec., Senate, Sept. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-2-2.pdf); [Sept. 24, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-13-2.pdf). Dixon, *Democratic Representation* (Opp. II.F). Cortner, *The Apportionment Cases* (K–J Cong. II.G). See [[cal.1964-08-19.court]]; [[cal.1964-06-15.court]]. Names: Dirksen, Mansfield (K–J Cong. III.A).'
    tags: [name:dirksen-everett, name:mansfield-mike]
  - id: cal.1964-09-10.baker
    when: Sept. 10
    date: '1964-09-10'
    thread: baker
    c: Senate, [75–3](https://voteview.com/rollcall/RS0880519), has the Rules Committee reopen its inquiry into Senate employees' business, on charges of an overpayment for the D.C. Stadium. Williams's substitute, to give it to Government Operations, loses [37–50](https://voteview.com/rollcall/RS0880514).
    n: '[110 Cong. Rec., Senate, Sept. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-2-2.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). See [[cal.1964-07-24.baker]]; [[cal.1963-10-07.baker]]. Names: Williams (Opp. III.B).'
    tags: [name:williams-john-j]
  - id: cal.1964-09-13.vietnam
    when: Sept. 13–14
    date: '1964-09-13'
    thread: vietnam
    c: Saigon. Generals Lâm Văn Phát and Dương Văn Đức bring troops into the city before dawn and announce Khánh's overthrow. Washington refuses Khánh's request for American help. No support; the troops withdraw on the 14th.
    n: 'FRUS 1964–68, I, docs. [347](https://history.state.gov/historicaldocuments/frus1964-68v01/d347), [352](https://history.state.gov/historicaldocuments/frus1964-68v01/d352). Shaplen, *The Lost Revolution*; Ahern, *The CIA and the Generals*; Lam, *The History of South Vietnam* (Viet. II.E.5). Johnson, *The Right Hand of Power*; Taylor, *Swords and Plowshares* (Viet. II.H.1). Nguyen Cao Ky, *Twenty Years and Twenty Days* (Viet. II.H.3). Kahin, *Intervention* (K–J Adm. II.D). See [[cal.1964-08-16.vietnam]]. Names: Khánh (Viet. III.G).'
    tags: [name:lam-van-phat, name:duong-van-duc, name:nguyen-khanh]
  - id: cal.1964-09-16.elections-1964
    when: Sept. 16
    date: '1964-09-16'
    thread: elections-1964
    also: [goldwater]
    c: 'Thurmond, on South Carolina television, leaves the Democratic party for the Republican, to campaign for Goldwater: "The Democratic Party has abandoned the people."'
    n: 'The address: [110 Cong. Rec., Senate, Sept. 17, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-7-1.pdf), printed by Simpson. Crespino, *Strom Thurmond''s America* (Opp. II.F). Bass & Thompson, *Strom* (Opp. II.G.1). Cosman, *Five States for Goldwater* (Opp. II.E). See [[cal.1964-09-07.elections-1964]]. Names: Thurmond (K–J Cong. III.B); Goldwater (Opp. III.B).'
    tags: [name:thurmond-strom, name:goldwater-barry-m]
  - id: cal.1964-09-18.vietnam
    when: Sept. 18–19
    date: '1964-09-18'
    thread: vietnam
    c: Gulf of Tonkin, night of Sept. 18. The destroyers Morton and Richard S. Edwards, on patrol, fire on radar contacts. Johnson doubts the evidence; strikes on the North prepared, then called off. No attack proven.
    n: '[FRUS 1964–68, I, doc. 356](https://history.state.gov/historicaldocuments/frus1964-68v01/d356). Moïse, *Tonkin Gulf and the Escalation of the Vietnam War* (Viet. II.C.2). See [[cal.1964-08-02.vietnam]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rusk-dean, name:bundy-mcgeorge]
  - id: cal.1964-09-18.opinion
    when: Sept. 18
    date: '1964-09-18'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Aug. 27–Sept. 1, by region: East, Johnson 73, Goldwater 21; Midwest, Johnson 69, Goldwater 25; South, Goldwater 47, Johnson 46; West, Johnson 66, Goldwater 30.'
    n: '*The Gallup Poll*, III, 1902 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-09-22.latin-america
    when: Sept. 22
    date: '1964-09-22'
    thread: latin-america
    c: 'Sea-level canal study signed, [78 Stat. 990](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg990.pdf): a commission of five to choose a site for a canal at sea level across the isthmus. House, Sept. 1, [320–23](https://voteview.com/rollcall/RH0880222).'
    n: '[Statement by the President Upon Approving Bill Providing for a Site Study for a New Interoceanic Canal](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-approving-bill-providing-for-site-study-for-new-interoceanic) (Sept. 24, 1964). See [[cal.1964-01-09.latin-america]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-24.assassination
    when: Sept. 24
    date: '1964-09-24'
    thread: assassination
    c: 'Warren gives Johnson the Commission''s report: Oswald fired the shots, alone; Ruby acted alone; no evidence of a conspiracy, foreign or domestic. 888 pages; made public Sept. 27. Twenty-six volumes of hearings and exhibits follow in November.'
    n: '[Letter to the Chief Justice Upon Receipt of the Warren Commission Report](https://www.presidency.ucsb.edu/documents/letter-the-chief-justice-upon-receipt-the-warren-commission-report) (Sept. 24, 1964). *Report of the President''s Commission on the Assassination of President Kennedy* (K–J Adm. II.H.3), [govinfo](https://www.govinfo.gov/content/pkg/GPO-WARRENCOMMISSIONREPORT/pdf/GPO-WARRENCOMMISSIONREPORT.pdf). See [[cal.1963-11-29.assassination]]. Names: Warren (K–J Cong. III.G); Oswald, Ruby (K–J Cong. III.K).'
    tags: [name:warren-earl, name:johnson-lyndon-b, name:oswald-lee-harvey, name:ruby-jack]
  - id: cal.1964-09-25.latin-america
    when: Sept. 25
    date: '1964-09-25'
    thread: latin-america
    c: Johnson and López Mateos at El Paso mark the Chamizal settlement. "Let Chamizal stand as a symbol to all the world that the most troublesome of problems can yield to the tools of peace."
    n: '[Remarks in El Paso at a Ceremony Marking the Settlement of the Chamizal Dispute](https://www.presidency.ucsb.edu/documents/remarks-el-paso-ceremony-marking-the-settlement-the-chamizal-dispute) (Sept. 25, 1964). Liss, *A Century of Disagreement* (K–J Adm. II.D). See [[cal.1963-12-17.latin-america]].'
    tags: [name:johnson-lyndon-b, name:lopez-mateos-adolfo]
  - id: cal.1964-09-25.jobs-and-wages
    when: Sept. 25
    date: '1964-09-25'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Senate passes the Appalachian Regional Development Act, S. 2782, [45–13](https://voteview.com/rollcall/RS0880528): $1.06 billion for the eleven States of the region. The House does not act.'
    n: '[110 Cong. Rec., Senate, Sept. 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-14-1.pdf). See [[cal.1961-05-01.program]].'
  - id: cal.1964-09-25.opinion
    when: Sept. 25
    date: '1964-09-25'
    thread: opinion
    also: [elections-1964, goldwater]
    c: 'Gallup, Aug. 27–Sept. 1, the words to describe each. Johnson: well-qualified 63 percent, experienced 62, intelligent 56, good judgment 46, honest 42. Goldwater: intelligent 33, forceful 31, poor judgment 26, not well-qualified 25, honest 24, reckless 24.'
    n: '*The Gallup Poll*, III, 1902–03 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-09-26.states-and-cities
    when: Sept. 26
    date: '1964-09-26'
    thread: states-and-cities
    c: 'Hoover''s report on the summer''s riots, Harlem to Philadelphia, made public: no pattern from city to city, no national organization; communities "with economic and social problems crying out for solution." Riot training for police from the FBI and the Army.'
    n: '[Statement by the President Upon Making Public an FBI Report on the Recent Urban Riots](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-making-public-fbi-report-the-recent-urban-riots) (Sept. 26, 1964). See [[cal.1964-07-18.states-and-cities]]; [[cal.1964-07-24.states-and-cities]]. Names: Hoover (K–J Adm. III.I).'
    tags: [name:hoover-j-edgar, name:johnson-lyndon-b]
  - id: cal.1964-09-28.succession
    when: Sept. 28–29
    date: '1964-09-28'
    thread: succession
    c: Senate passes Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 139, by voice vote. On Stennis's motion, again Sept. 29, [65–0](https://voteview.com/rollcall/RS0880530), so the record shows two-thirds. The House does not act.
    n: '[110 Cong. Rec., Senate, Sept. 29, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-1-1.pdf). See [[cal.1963-11-22.succession]]. Names: Bayh (Cong. III.B); Stennis (K–J Cong. III.B).'
    tags: [name:bayh-birch, name:stennis-john-c]
  - id: cal.1964-09.goldwater
    when: Sept.
    date: 1964-09
    thread: goldwater
    also: [elections-1964]
    c: '*Fact*, September–October issue: "The Unconscious of a Conservative: A Special Issue on the Mind of Barry Goldwater." Its poll of 12,356 psychiatrists: 2,417 answer; 1,189 call him unfit for the Presidency, 657 fit, 571 cannot say. Advertised in mid-September. Sept. 1965, Goldwater sues the magazine, its publisher Ginzburg and its managing editor for libel.'
    n: '*Goldwater v. Ginzburg*, [414 F.2d 324](https://static.case.law/f2d/414/html/0324-01.html) (2d Cir. 1969). *Goldwater v. Ginzburg* (Opp. II.H.1). Perlstein, *Before the Storm* (Opp. II.B). Names: Goldwater (Opp. III.B); Ginzburg (K–J Cong. III.K).'
    tags: [name:goldwater-barry-m, name:ginzburg-ralph]
