  - id: cal.1969-09-26.china-leadership
    when: Sept. 26
    date: '1969-09-26'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Kosygin, replying to Zhou''s letter of Sept. 18, says the Soviet side has taken practical steps to normalize the border on the assumption that China will take like measures, appoints a delegation under Kuznetsov for talks and proposes that boundary talks begin in Peking from Oct. 10. On Sept. 29 Qiao Guanhua, in an "oral notice", approved by Zhou, to the Soviet chargé Yelizavetin: Kosygin''s letter is being studied, the talks are put off to begin Oct. 20, and the Soviet statement of June 13 will be answered publicly after National Day. On Oct. 14 Kosygin writes again that the delegation will reach Peking before Oct. 20.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 26, 1969); [[w.yang-jisheng-tiandi-fanfu]], II, 737 (Kosygin''s letter to Zhou proposing that the boundary talks begin in Peking, no day given); [[w.khoo-collateral-damage]], 58–59 (Kosygin''s letter of Sept. 26 proposes the talks resume Oct. 10, no word of the measures agreed at the airport; on Sept. 29 the Foreign Ministry asks that they open Oct. 20, not Oct. 10, the forces not yet repositioned). Made public: 2020. To check: [[w.lewis-imagined-enemies]], 60 (cited by [[w.khoo-collateral-damage]], 58 nn.104–105). See [[cal.1969-09-17.china-leadership]]. Names: Zhou Enlai, Kosygin.'
    tags: [polity:prc, polity:ussr, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
