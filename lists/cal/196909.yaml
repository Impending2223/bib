    tags: [name:brezhnev-leonid, name:ho-chi-minh, polity:ussr, polity:drv]
  - id: cal.1969-09-04.vietnam-hanoi
    when: Sept. 4
    date: '1969-09-04'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The special communiqué of the Central Committee, the National Assembly''s Standing Committee, the Council of Ministers and the Fatherland Front''s presidium: Hồ Chí Minh dead. A state funeral; seven days of mourning, Sept. 4–10; a solemn memorial; a State Funeral Committee of 26, Lê Duẩn its head, Tôn Đức Thắng, Trường Chinh and Phạm Văn Đồng his deputies.'
    n: '*Thông cáo đặc biệt*, Hanoi, Sept. 4, 1969, from *Nhân Dân*, Sept. 5, 1969, [[w.van-kien-dang-toan]], XXX, 228–31; the committee''s list, from *Nhân Dân*, Sept. 5, 237–39. See [[cal.1969-09-03.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn, Tôn Đức Thắng, Trường Chinh, Phạm Văn Đồng.'
    tags: [polity:drv, name:ho-chi-minh, name:le-duan, name:ton-duc-thang, name:truong-chinh, name:pham-van-dong]
    variants:
      - unit: A
        witness: w.lich-su-khang-chien-chong-my
        reads: the special communiqué the Politburo's, broadcast by the Voice of Vietnam the night of Sept. 3
        at: VI, 134
  - id: cal.1969-09-04.vietnam-hanoi-2
    when: Sept. 4
    date: '1969-09-04'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Politburo''s directive no. 172-CT/TW on the state funeral: the State Funeral Committee to run it at the center, the provinces at home; no feasts, receptions, shows, sports or films Sept. 4–10; grief turned to action, vigilance against the enemy. With it four slogans, the rules of mourning, the flags and armbands, and the committee''s programs, of Sept. 5, for the lying in state at Ba Đình Hall from Sept. 6 and the memorial.'
    n: '*Chỉ thị của Bộ Chính trị số 172-CT/TW, ngày 4 tháng 9 năm 1969, Về việc tổ chức Lễ quốc tang Hồ Chủ tịch*, signed for the Politburo by Lê Duẩn; the attached papers, 245–52. [[w.van-kien-dang-toan]], XXX, 240–52. Made public: 2004. See [[cal.1969-09-04.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-09-04.china-leadership
    when: Sept. 4
    date: '1969-09-04'
    place: hanoi
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Zhou Enlai, reaching Hanoi in the morning, talks that afternoon with Lê Duẩn, Trường Chinh, Phạm Văn Đồng and Võ Nguyên Giáp on the condolences: "we came in haste but were still late"; the news of Hồ''s death brought deep grief to China''s Party, government, army and people; Hồ''s lifelong struggle won an immortal service for the Vietnamese people and a great one for the international proletariat; his tie to the Chinese revolution and Party was specially close, and as for himself he was Hồ''s oldest comrade in arms. He asks that a farewell ceremony before Hồ''s portrait be arranged, and says the Party will send another delegation to the formal memorial service.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 312–313 (Sept. 4, 1969); [[w.zhou-enlai-waijiao-huodong]], 538 (Sept. 4, 1969; morning, by special plane with the Chinese Party delegation to Hanoi to condole on Hồ Chí Minh''s death, met at the airport by Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp and Nguyễn Duy Trinh; 3 p.m., the Presidential Palace, Zhou saying to the Vietnamese Party, government and army leaders that China came hurriedly yet late); [[w.zhonghua-renmin-gongheguo-waijiao]], 221 (Sept. 4, 1969; Zhou, leading the Chinese party delegation to Hanoi for Hồ Chí Minh''s death, and his talk with the Vietnamese party, government and army leaders: "we came in haste but still late"; Hồ''s tie to the Chinese revolution and Party); [[w.khoo-collateral-damage]], 58 (Zhou and Ye Jianying go at once to Hanoi and do not stay the night). Made public: 1993. Names: Zhou Enlai, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp.'
    src:
      c: 1ba0bb2f
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 312–313: ?'
        - 'w.zhou-enlai-waijiao-huodong 538: A-E'
        - 'w.zhonghua-renmin-gongheguo-waijiao 221: A'
        - 'w.khoo-collateral-damage 58: ?'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:le-duan, name:truong-chinh, name:pham-van-dong, name:vo-nguyen-giap, vis:only:prc+drv]
  - id: cal.1969-09-04.china-leadership-2
    when: Sept. 4
    date: '1969-09-04'
    place: hanoi
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Zhou Enlai leads the Chinese delegation to the lying-in-state hall set up in the main hall of the Presidential Palace and lays a wreath before Hồ Chí Minh's portrait, stands in silence and writes in the book of condolence. That night he goes with Ye Jianying to the hospital to view Hồ's remains, then leaves Hanoi for home.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 4, 1969); [[w.zhou-enlai-waijiao-huodong]], 538 (Sept. 4, 1969; 5 p.m., the lying-in-state hall in the main hall of the Presidential Palace, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp, Lê Thanh Nghị and Hoàng Văn Hoan accompanying; 7 p.m., with Ye Jianying, to the hospital to view Hồ Chí Minh''s remains; 8 p.m., by plane from Hanoi for home). See [[cal.1969-09-04.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh, Ye Jianying.'
    src:
      c: e4b64091
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 313: ?'
        - 'w.zhou-enlai-waijiao-huodong 538: A-B'
    tags: [polity:prc, name:zhou-enlai, name:ho-chi-minh, name:ye-jianying]
  - id: cal.1969-09-04.vietnam-hanoi-5
    when: Sept. 4
    date: '1969-09-04'
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'The Provisional Revolutionary Government, its Advisory Council, the National Liberation Front''s Central Committee and the Alliance of National, Democratic and Peace Forces hold a joint conference on the memorial and mourning for Hồ Chí Minh. It cables the Party''s Central Committee: the South pledges to fight on until the Americans leave and the Saigon regime falls.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 134–35 and n. 1. See [[cal.1969-09-02.vietnam-hanoi]]. To check: the Provisional Revolutionary Government''s cable to the Central Committee of the Vietnam Workers'' Party, Sept. 1969 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 135 n. 1). Names: Hồ Chí Minh.'
    tags: [polity:drv, name:ho-chi-minh, ok:fields-place]
