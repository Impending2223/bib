  - id: cal.1969-09-02.vietnam-hanoi
    when: Sept. 2
    date: '1969-09-02'
    time: 1969-09-02T02:47Z
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: Hồ Chí Minh dies at 9:47 a.m., National Day, of a heart attack, at 79. The Politburo announces it as Sept. 3, so that the day of his death should not fall on the nation's day of celebration.
    n: '[[w.van-kien-dang-toan]], XXX, 228–29 n. (the editors'' note, from the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989, on the testament and the day of the death). [[w.jianguo-yilai-mao-zedong]], XIX, 467 n.1 (Sept. 2, 1969; the death in Hanoi and the age only); [[w.lich-su-khang-chien-chong-my]], VI, 133–34 (9:47 a.m., Sept. 2, 1969, in Hanoi; not the cause, his age or the day announced). Made public: 1989. Names: Hồ Chí Minh.'
