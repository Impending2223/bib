  - id: cal.1969-09-18.china-leadership-2
    when: Sept. 18
    date: '1969-09-18'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Zhou Enlai writes Kosygin: at the airport meeting in Peking on Sept. 11 they agreed that the long-unsettled Sino-Soviet boundary question should be settled by peaceful negotiation free of any threat, and that before it is settled both take interim measures to keep the border as it is and avoid armed conflict; if Kosygin confirms them by letter they will take effect at once as an agreement between the two governments, which he believes will ease the border situation and help the holding of boundary talks. The nianpu''s note gives the five measures: strictly keep the border as it is; avoid armed conflict; disengage forces in disputed areas; settle border disputes by consultation between the border authorities, and failing that through diplomatic channels; none to prejudice either side''s position on the boundary or the ownership of disputed areas. The Politburo had discussed and revised the letter on Sept. 16.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 18, 1969); [[w.zhonghua-renmin-gongheguo-waijiao]], 223 (Sept. 18, 1969; Zhou''s letter to Kosygin asking the Soviet government to confirm the oral agreement of the Sept. 11 meeting); [[w.jianguo-yilai-mao-zedong]], XIX, 471 n.1 (Sept. 18, 1969; the letter, settled by the Politburo, restates the four interim measures of the airport talk and adds the fifth; sent Sept. 18; not the letter''s words); [[w.yang-jisheng-tiandi-fanfu]], II, 736 (afterward China asks that the two governments exchange notes confirming the understanding Zhou and Kosygin reached; the page has the Soviet Union refuse, no day given); [[w.khoo-collateral-damage]], 58 (Zhou''s secret message to Kosygin proposing a nonaggression agreement). Made public: 2002. To check: Zhou Enlai''s letter to Kosygin, Sept. 18, 1969, in [[w.zhou-enlai-waijiao-wenxuan]], 462–464 (cited by [[w.khoo-collateral-damage]], 58 n.103a); [[w.jian-all-under-the-heaven]], 171–172 (cited by [[w.khoo-collateral-damage]], 58 n.103b). See [[cal.1969-09-17.china-leadership]]. Names: Zhou Enlai, Kosygin.'
    src:
