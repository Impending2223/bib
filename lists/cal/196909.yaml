    place: u-minh-thuong
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: U Minh Thượng, Region 9. Saigon opens a sweep with 23 battalions, the long sweeps of Bà Hòn, Chương Thiện and U Minh Thượng aimed at the border, the supply corridor and the Region's preparations for spring 1970. Fifty guerrilla teams, 200 men, ambush river craft on the Ông Đốc; hundreds out of action, dozens of boats sunk or badly hurt, by the history's count.
