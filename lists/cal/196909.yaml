    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: the Politburo''s draft slogans for the twentieth anniversary of the PRC: "added a line" for approval: peoples of the world unite against aggressive war launched by any imperialism or social-imperialism, above all atomic war; if it comes, to end it by revolutionary war, and prepare from now.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Sept. 1969. [[w.jianguo-yilai-mao-zedong]], XIX, 468–469 (Sept. 1969; on the draft slogans discussed by the Politburo and sent by Zhou Enlai and others Sept. 8, Mao writes "added a slogan, please decide" and adds it after the 21st of 28, as the 22nd; printed Sept. 17; the book gives no place); [[w.macfarquhar-maos-last-revolution]], 314 (the day after the Politburo meets, Sept. 17 by the book, Mao adds to the injunctions for the twentieth anniversary: the peoples of the world to unite against any aggressive war by imperialism or social imperialism, above all one with nuclear weapons). Made public: 2013. Printed in *Renmin ribao*, Sept. 17, 1969 ([[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 17, 1969; the slogans as printed)): [[cal.1969-09-17.china-leadership-2]]. Check: the book (314) dates Mao''s addition Sept. 17, the day the *Renmin ribao* printed the slogans. To check: Zhou Enlai and others, draft "Slogans for the twentieth anniversary of the founding of the People''s Republic of China", discussed by the Politburo, sent to Mao Sept. 8, 1969 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 468 n.1a); [[w.kuisong-mao-zedong-yu-mosikede]], 501 (cited by [[w.macfarquhar-maos-last-revolution]], 314 n.30a); [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 66 (cited by [[w.macfarquhar-maos-last-revolution]], 314 n.30b). Names: Mao Zedong.'
