    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Renmin ribao prints the slogans for the 20th anniversary of the People''s Republic, 29 in all, supplemented and revised before printing by Zhou Enlai and others and passed by the Politburo, among them: "Do struggle-criticism-reform well! Consolidate the dictatorship of the proletariat further!", "Prepare for war, prepare against famine, for the people!", "Raise vigilance, defend the motherland, be ready at any time to wipe out invaders!".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 17, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 468 n.1 (Sept. 17, 1969; the printing and the number, 29, only); [[w.mao-zedong-zhuan]], VI, ch. 78 n.17 (the evening of Sept. 16 Xinhua issues the Slogans for celebrating the twentieth anniversary of the People''s Republic 《庆祝中华人民共和国成立二十周年口号》, 29 in all, as approved by Mao; the 22nd is Mao''s own addition: ''peoples of the whole world, unite, oppose any war of aggression launched by imperialism or social-imperialism, above all oppose a war of aggression with the atom bomb as its weapon; should such a war break out, the peoples of the whole world should meet it with revolutionary war and wipe out the war of aggression, start preparing now''; the book dates the issue Sept. 16 and does not say the *Renmin ribao* printed it, n.17). To check: Mao Zedong 毛泽东, a slogan added in reviewing the draft Slogans for celebrating the twentieth anniversary of the People''s Republic (manuscript 手稿), Sept. 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.17). Names: Zhou Enlai.'
