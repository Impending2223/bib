  - id: cal.1969-09-30.china-leadership-2
    when: Sept. 30
    date: '1969-09-30'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai speaks at the reception for the 20th anniversary of the People''s Republic: in twenty years the socialist revolution and building in China, under the Communist Party, has won victory after victory; the motherland has been changed from a poor, backward, bullied, semi-feudal, semi-colonial country into a socialist country that keeps its independence and has gained a first prosperity.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 30, 1969). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-09-30.china-leadership-3
    when: Sept. 30
    date: '1969-09-30'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: Late at night Zhou Enlai learns by telephone from Huang Yongsheng that Lin Biao, to guard against enemy bombing at the holiday breaching the Miyun reservoir's dam, proposes letting the reservoir's water out. Zhou opposes it, as it would drown people downstream; at dawn he calls the heads of the Ministry of Water Resources to a meeting, which overrules Lin's proposal.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 30, 1969). Made public: 2020. Names: Zhou Enlai, Lin Biao, Huang Yongsheng.'
    tags: [polity:prc, name:zhou-enlai, name:lin-biao, name:huang-yongsheng, vis:only:prc]
