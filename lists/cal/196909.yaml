section: '196909'
entries:
  - id: cal.1969-09-01.china-leadership
    when: Sept. 1
    date: '1969-09-01'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Mao, Lin Biao and Zhou Enlai telegraph Hồ Chí Minh and other Vietnamese leaders on the DRV''s twenty-fourth anniversary: Nixon''s two-handed counterrevolution, political fraud and "de-Americanizing" the war to hold the South for ever; China counts supporting Vietnam an internationalist duty.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Hồ Chí Minh, Nixon.'
    tags: [polity:prc, polity:drv, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ho-chi-minh, name:nixon-richard-m]
  - id: cal.1969-09-02.vietnam-hanoi
    when: Sept. 2
    date: '1969-09-02'
    thread: vietnam-hanoi
    also: [vietnam]
    c: Hồ Chí Minh dies at 9:47 a.m., National Day, of a heart attack, at 79. The Politburo announces it as Sept. 3, so that the day of his death should not fall on the nation's day of celebration.
    n: '[[w.van-kien-dang-toan]], XXX, 228–29 n. (the editors'' note, from the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989, on the testament and the day of the death). Made public: 1989. Names: Hồ Chí Minh.'
    tags: [polity:drv, name:ho-chi-minh]
  - id: cal.1969-09-02.china-leadership
    when: Sept. 2
    date: '1969-09-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai receives the members of the Mao Zedong Thought study classes run by the Center and people from Inner Mongolia, Tibet and Guizhou in Peking and says that the struggle-criticism-reform stage has begun, its aim to consolidate the dictatorship of the proletariat, raise the Party Center's prestige and bring in unified collective leadership by the revolutionary committees; Party leadership is to be shown, policies carried out and care taken not to confuse the two kinds of contradiction; the army is the pillar of the dictatorship and there must be no more seizing of arms and no more besieging or beating of PLA men, any such act being counterrevolutionary and to be met by encirclement and political disintegration. The nianpu's note gives the stage's content, after the Ninth Congress, as three-in-one revolutionary committees, great criticism, cleaning class ranks, Party rectification, cutting organs, reforming unreasonable rules and sending staff down.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 311–312 (Sept. 2, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-02.china-leadership-2
    when: Sept. 2
    date: '1969-09-02'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: Zhou Enlai talks with Wu Jieping and Liang Feng, back from Hanoi, and hears their report on Hồ Chí Minh's illness; after discussion it is decided to send Wu and Liang again with other doctors, carrying medicine and equipment, to try to save him.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 312 (Sept. 2, 1969). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:ho-chi-minh, vis:only:prc+drv]
  - id: cal.1969-09-03.china-leadership
    when: Sept. 3
    date: '1969-09-03'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Hồ Chí Minh dies in Hanoi. The Chinese Central Committee, the NPC Standing Committee and the State Council wire condolences to the Vietnam Workers' Party Central Committee, the National Assembly Standing Committee and the government; that night Zhou Enlai leaves Peking at the head of a Party delegation to pay condolences at Hanoi.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 312 (Sept. 3, 1969). Check: Hồ Chí Minh died Sept. 2, 1969, at 9:47 a.m.; the Politburo announced it as Sept. 3 (its notice no. 151-TB/TW of Aug. 19, 1989, quoted in [[w.van-kien-dang-toan]], XXX, 229 n.). See [[cal.1969-09-02.vietnam-hanoi]]. Names: Zhou Enlai, Hồ Chí Minh.'
    src:
      c: 421c69a1
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 312: A, B, C'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:ho-chi-minh]
  - id: cal.1969-09-03.vietnam-hanoi
    when: Sept. 3
    date: '1969-09-03'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Central Committee''s call to cadres, Party members, soldiers, the people and Vietnamese abroad: Hồ Chí Minh dead, after an illness and a severe heart attack, "at 9:47 a.m., Sept. 3," in Hanoi (the day announced; he died Sept. 2). Grief to be turned into revolutionary action; his line, his thought and his ways followed: "Nothing is more precious than independence and freedom"; the war and socialist construction carried to complete victory.'
    n: '*Lời kêu gọi của Ban Chấp hành Trung ương Đảng lao động Việt Nam*, Sept. 3, 1969, from *Nhân Dân*, Sept. 5, 1969. [[w.van-kien-dang-toan]], XXX, 232–36. See [[cal.1969-09-02.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, name:ho-chi-minh]
  - id: cal.1969-09-03.china-leadership-2
    when: Sept. 3
    date: '1969-09-03'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, defense]
    c: 'Zhou Enlai drafts the Center''s notice: since the Center''s order of Aug. 28, local papers and radio stations have openly called for "prepare for war" and "everything for war", which is not fitting, and they are to stop at once such propaganda of these slogans.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 312 (Sept. 3, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-04.soviet-union-leadership
    when: Sept. 4
    date: '1969-09-04'
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev, with the Politburo's members and candidates and the Central Committee's secretaries, pays a visit of condolence to the embassy of the Democratic Republic of Vietnam on the death of Hồ Chí Minh.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 357 (Sept. 4). Names: Brezhnev, Hồ Chí Minh.'
    tags: [name:brezhnev-leonid, name:ho-chi-minh, polity:ussr, polity:drv]
  - id: cal.1969-09-04.vietnam-hanoi
    when: Sept. 4
    date: '1969-09-04'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The special communiqué of the Central Committee, the National Assembly''s Standing Committee, the Council of Ministers and the Fatherland Front''s presidium: Hồ Chí Minh dead. A state funeral; seven days of mourning, Sept. 4–10; a solemn memorial; a State Funeral Committee of 26, Lê Duẩn its head, Tôn Đức Thắng, Trường Chinh and Phạm Văn Đồng his deputies.'
    n: '*Thông cáo đặc biệt*, Hanoi, Sept. 4, 1969, from *Nhân Dân*, Sept. 5, 1969, [[w.van-kien-dang-toan]], XXX, 228–31; the committee''s list, from *Nhân Dân*, Sept. 5, 237–39. See [[cal.1969-09-03.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn, Tôn Đức Thắng, Trường Chinh, Phạm Văn Đồng.'
    tags: [polity:drv, name:ho-chi-minh, name:le-duan, name:ton-duc-thang, name:truong-chinh, name:pham-van-dong]
  - id: cal.1969-09-04.vietnam-hanoi-2
    when: Sept. 4
    date: '1969-09-04'
    thread: vietnam-hanoi
    c: 'The Politburo''s directive no. 172-CT/TW on the state funeral: the State Funeral Committee to run it at the center, the provinces at home; no feasts, receptions, shows, sports or films Sept. 4–10; grief turned to action, vigilance against the enemy. With it four slogans, the rules of mourning, the flags and armbands, and the committee''s programs, of Sept. 5, for the lying in state at Ba Đình Hall from Sept. 6 and the memorial.'
    n: '*Chỉ thị của Bộ Chính trị số 172-CT/TW, ngày 4 tháng 9 năm 1969, Về việc tổ chức Lễ quốc tang Hồ Chủ tịch*, signed for the Politburo by Lê Duẩn; the attached papers, 245–52. [[w.van-kien-dang-toan]], XXX, 240–52. Made public: 2004. See [[cal.1969-09-04.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-09-04.china-leadership
    when: Sept. 4
    date: '1969-09-04'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Zhou Enlai, reaching Hanoi in the morning, talks that afternoon with Lê Duẩn, Trường Chinh, Phạm Văn Đồng and Võ Nguyên Giáp on the condolences: "we came in haste but were still late"; the news of Hồ''s death brought deep grief to China''s Party, government, army and people; Hồ''s lifelong struggle won an immortal service for the Vietnamese people and a great one for the international proletariat; his tie to the Chinese revolution and Party was specially close, and as for himself he was Hồ''s oldest comrade in arms. He asks that a farewell ceremony before Hồ''s portrait be arranged, and says the Party will send another delegation to the formal memorial service.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 312–313 (Sept. 4, 1969). Made public: 2020. Names: Zhou Enlai, Lê Duẩn, Trường Chinh, Phạm Văn Đồng, Võ Nguyên Giáp.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:le-duan, name:truong-chinh, name:pham-van-dong, name:vo-nguyen-giap, vis:only:prc+drv]
  - id: cal.1969-09-04.china-leadership-2
    when: Sept. 4
    date: '1969-09-04'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Zhou Enlai leads the Chinese delegation to the lying-in-state hall set up in the main hall of the Presidential Palace and lays a wreath before Hồ Chí Minh's portrait, stands in silence and writes in the book of condolence. That night he goes with Ye Jianying to the hospital to view Hồ's remains, then leaves Hanoi for home.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 4, 1969). See [[cal.1969-09-04.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh, Ye Jianying.'
    tags: [polity:prc, name:zhou-enlai, name:ho-chi-minh, name:ye-jianying]
  - id: cal.1969-09-05.china-leadership
    when: Sept. 5
    date: '1969-09-05'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: Zhou Enlai flies back to Peking.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 5, 1969). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-09-06.china-leadership
    when: Sept. 6
    date: '1969-09-06'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Zhou Enlai leads leaders of the Party, government, army, National People's Congress and Political Consultative Conference to the Vietnamese embassy in Peking to condole on Hồ Chí Minh's death.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 6, 1969). Names: Zhou Enlai, Hồ Chí Minh.'
    tags: [polity:prc, name:zhou-enlai, name:ho-chi-minh]
  - id: cal.1969-09-07.china-leadership
    when: Sept. 7
    date: '1969-09-07'
    thread: china-leadership
    also: [europe-and-the-alliance, vietnam-paris, china]
    c: 'Zhou Enlai at night meets Ion Gheorghe Maurer, chairman of Romania''s Council of Ministers, passing through Peking to Hanoi for Hồ Chí Minh''s funeral. Though they differ, exchange of views is useful. Whether Vietnam goes on with the war or with the Paris talks is wholly the Vietnamese Party''s own business; China''s exchanges with the Vietnamese comrades are chiefly on the war against the Americans, to support them and learn from their experience of people''s war. On Sino-American relations: the key is Taiwan and the United Nations, which will one day be settled; China owes them no debt, they owe China. On Sino-Soviet relations: China agrees to reasonable negotiation, and before the questions are settled to keep the border as it is and avoid armed conflict.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 7, 1969). Made public: 2020. Names: Zhou Enlai, Ion Gheorghe Maurer, Hồ Chí Minh.'
    tags: [polity:prc, polity:romania, name:zhou-enlai, name:maurer-ion-gheorghe, name:ho-chi-minh, vis:only:prc+romania]
  - id: cal.1969-09-08.china-leadership
    when: Sept. 8
    date: '1969-09-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai, on the Letters and Visits Section of the Central General Office's secretariat's report of Aug. 26 on retaliation against masses who wrote to the Center, orders the General Office to draft on the Center's behalf an internal circular telegram to the revolutionary committees at every level in the provinces, municipalities and regions, to call the leaders' attention, offenders to be disciplined.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313–314 (Sept. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-08.china-leadership-2
    when: Sept. 8
    date: '1969-09-08'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai adds to the Center''s instruction on the report of the Tibet revolutionary committee and Tibet Military Region''s delegation to Peking: "overcome bourgeois factionalism, strengthen proletarian Party spirit."'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-09.vietnam-hanoi
    when: Sept. 9
    date: '1969-09-09'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The memorial for Hồ Chí Minh. Lê Duẩn reads the Central Committee''s eulogy: "Bidding you farewell, we swear," five oaths: to hold high the banner of national independence, fight on to victory over the Americans, liberate the South, defend the North and reunite the country; to strive for the ideals of socialism and communism; to guard the Party''s unity "like the pupil of our eye"; to restore and strengthen the unity of the socialist camp and the fraternal parties; to learn all their lives from his morals and ways.'
    n: '*Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, do đồng chí Lê Duẩn ... đọc tại Lễ truy điệu trọng thể Hồ Chủ tịch, ngày 9 tháng 9 năm 1969*. [[w.van-kien-dang-toan]], XXX, 321–27 (the oaths, 322–26). See [[cal.1969-09-04.vietnam-hanoi-2]]. Names: Hồ Chí Minh, Lê Duẩn.'
    tags: [polity:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-09-10.soviet-union-leadership
    when: Sept. 10
    date: '1969-09-10'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev negotiates with Husák at the guest house on the Lenin Hills, 11 to 7; sees him off at Vnukovo, 8 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 358 (Sept. 10). Names: Brezhnev, Husák.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-09-10.china-leadership
    when: Sept. 10, 11
    date: '1969-09-10'
    thread: china-leadership
    also: [korea-leadership, china]
    c: Zhou Enlai meets Choe Yong-gon, head of the North Korean Party and government delegation, passing through Peking home from Hồ Chí Minh's funeral at Hanoi. Choe conveys Kim Il Sung's wish to improve and develop Korean-Chinese relations, and they exchange views on it.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 10, 1969). Made public: 2020. Names: Zhou Enlai, Hồ Chí Minh.'
    tags: [polity:prc, polity:dprk, name:zhou-enlai, name:ho-chi-minh, vis:only:prc+dprk]
  - id: cal.1969-09-11.china-leadership
    when: Sept. 11
    date: '1969-09-11'
    thread: china-leadership
    also: [soviet-union]
    c: 'Peking airport VIP lounge. Zhou Enlai with Kosygin, who passes through on his way home from Hồ Chí Minh''s funeral. Zhou: theoretical and principled disputes should not hinder state relations; talks can find a way on the boundary; until then three interim measures: keep the border as it is, avoid armed clashes, disengage forces in disputed places. Kosygin adds a fourth: border authorities may consult beforehand. Agreed on the four; each to send a delegation for boundary talks soon.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 11, 1969; the airport talks). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 11, 1969), has Zhou''s first point, that disputes of theory and principle are not to hinder state relations, and adds that the two also discussed keeping and developing trade and restoring the exchange of ambassadors, Zhou ending that a good beginning had been made and the frank talk was useful to both. To check: the record of the talk (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969, as the Chinese government''s account). Names: Zhou Enlai, Kosygin, Hồ Chí Minh. Check: the Soviet record of the talk; the meeting announced the same day. Mao approves the record Sept. 13 (the chronology, under Sept. 11).'
    src:
      c: 557d81ef
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 11, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 314: A, B, C, D, E, F, H'
    tags: [polity:prc, polity:ussr, name:zhou-enlai, name:kosygin-aleksei, name:ho-chi-minh, vis:only:prc+ussr@C-H]
  - id: cal.1969-09-11.china-leadership-2
    when: Sept. 11
    date: '1969-09-11'
    thread: china-leadership
    also: [europe-and-the-alliance, china]
    c: 'Zhou Enlai again meets Maurer and his delegation. On the international communist movement: it has entered a period of independent development in each country, not of joint action; the world is in great upheaval, division and reorganization, and everywhere each Communist Party is tested on whether it can lead revolution, or each is tempered by itself, in parallel.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 11, 1969). Made public: 2020. Names: Zhou Enlai, Ion Gheorghe Maurer.'
    tags: [polity:prc, polity:romania, name:zhou-enlai, name:maurer-ion-gheorghe, vis:only:prc+romania]
  - id: cal.1969-09-13.china-leadership
    when: Sept. 13
    date: '1969-09-13'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Zhou Enlai reports the content of the Sino-Soviet talks to Mao and holds that it is the first contact of this kind between the two governments; China is to try for the four-point agreement on the border situation to be realized, to publish a diplomatic document and to promote the boundary negotiations. Mao: "agreed."'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 314–315 (Sept. 13, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-09-14.china-leadership
    when: Sept. 14, 16
    date: '1969-09-14'
    thread: china-leadership
    also: [soviet-union, china]
    c: Zhou Enlai calls the Foreign Ministry's responsible people to talk on Sino-Soviet questions and others.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 14, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-15.soviet-union-leadership
    when: Sept. 15–16
    date: '1969-09-15'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with the Czechoslovak leaders: he receives the secretaries of the party''s Central Committee Kempný and Lenárt, Sept. 15, 6 to 7 p.m.; Sept. 16, 11:10 to 3, with Kosygin, he negotiates with Černík in the new hall.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 359 (Sept. 15–16). Names: Brezhnev, Kempný, Lenárt, Hall, Kosygin, Černík.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, polity:ussr, polity:czechoslovakia, polity:us]
  - id: cal.1969-09-15.china-leadership
    when: Sept. 15, 17
    date: '1969-09-15'
    thread: china-leadership
    also: [defense, china]
    c: Zhou Enlai presides over meetings of the Central Special Committee.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 15, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-16.china-leadership
    when: Sept. 16, 18, 22
    date: '1969-09-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai attends meetings of the Party Politburo.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 16, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-17.china-leadership
    when: Sept. 17
    date: '1969-09-17'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves Zhou Enlai''s letter to Kosygin, settled by the Politburo, as sent Sept. 18: restates the four interim measures of the airport talk of Sept. 11 and adds a fifth, that they do not prejudice either side''s position on the boundary or the ownership of the disputed areas. Zhou: once sent, see Kosygin''s answer, then decide the date of a government statement.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 17, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 315–316 (Sept. 18, 1969; the letter and its Politburo revision). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
    src:
      c: 4bb37994
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 17, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 315–316: A, B'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
  - id: cal.1969-09-17.china-leadership-2
    when: Sept. 17
    date: '1969-09-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Renmin ribao prints the slogans for the 20th anniversary of the People''s Republic, 29 in all, supplemented and revised before printing by Zhou Enlai and others and passed by the Politburo, among them: "Do struggle-criticism-reform well! Consolidate the dictatorship of the proletariat further!", "Prepare for war, prepare against famine, for the people!", "Raise vigilance, defend the motherland, be ready at any time to wipe out invaders!".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 17, 1969). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-09-18.china-leadership
    when: Sept. 18
    date: '1969-09-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao on his southern tour: at Hangzhou he asks about the arts; the actors say the Yue opera has been altered until it is neither Peking nor Yue; Mao does not approve changing Yue opera into what it is not; when told Jiang Qing made the model operas, he says no, the plays existed and were improved by the workers of the arts.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 18, 1969. Made public: 2013. Names: Mao Zedong, Jiang Qing.'
    tags: [polity:prc, name:mao-zedong, name:jiang-qing, vis:only:prc]
  - id: cal.1969-09-18.china-leadership-2
    when: Sept. 18
    date: '1969-09-18'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Zhou Enlai writes Kosygin: at the airport meeting in Peking on Sept. 11 they agreed that the long-unsettled Sino-Soviet boundary question should be settled by peaceful negotiation free of any threat, and that before it is settled both take interim measures to keep the border as it is and avoid armed conflict; if Kosygin confirms them by letter they will take effect at once as an agreement between the two governments, which he believes will ease the border situation and help the holding of boundary talks. The nianpu''s note gives the five measures: strictly keep the border as it is; avoid armed conflict; disengage forces in disputed areas; settle border disputes by consultation between the border authorities, and failing that through diplomatic channels; none to prejudice either side''s position on the boundary or the ownership of disputed areas. The Politburo had discussed and revised the letter on Sept. 16.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 315 (Sept. 18, 1969). Made public: 2020. See [[cal.1969-09-17.china-leadership]]. Names: Zhou Enlai, Kosygin.'
    tags: [polity:prc, polity:ussr, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
  - id: cal.1969-09-19.china-leadership
    when: Sept. 19
    date: '1969-09-19'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao at Nanjing, evening, hears Xu Shiyou and Du Ping on war preparation: for the National Day neither local nor army leaders to go to Peking, lest the enemy strike at the center.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1969. Made public: 2013. Names: Mao Zedong, Xu Shiyou, Du Ping.'
    tags: [polity:prc, name:mao-zedong, name:xu-shiyou, vis:only:prc]
