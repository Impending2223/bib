    when: Sept. 30
    date: '1969-09-30'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai calls people from Shanghai, Nanjing, Peking and elsewhere to talk on meteorology.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 30, 1969). Made public: 2020. Names: Zhou Enlai.'
