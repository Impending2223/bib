  - id: cal.1969-09-28.china-leadership
    when: Sept. 28
    date: '1969-09-28'
    time: 1969-09-28T03:30Z
    thread: china-leadership
    also: [africa, china]
    c: 'Zhou Enlai in talks with Major Raoul, Prime Minister of Congo (Brazzaville), on Africa: China knows Africa much better now than in 1963 to 1965; the situation always develops and advances, and also twists, and reversals are hard to avoid; some African national revolutions and independence movements failed because their leaders did not see imperialism''s new plots and did not rouse the masses, and the deep lessons of history should be summed up and drawn. China had urged Gizenga not to leave his base, and he was jailed; Nkrumah, advised by Zhou not to leave his country, left for Peking and Vietnam in 1966 and Ghana was lost, the deepest lesson; Sékou Touré took it and does not leave Conakry; Keita, advised in 1964 to keep the army in hand, set up a people''s militia, and the discontented army overthrew him.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 28, 1969); [[w.zhou-enlai-waijiao-huodong]], 540 (Sept. 28, 1969; 11:30 a.m., talks with Major Raoul, prime minister of the Congo (Brazzaville)). Made public: 1993. Names: Zhou Enlai, Nkrumah, Touré, Keita.'
    src:
      c: 2af62def
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 318: ?'
        - 'w.zhou-enlai-waijiao-huodong 540: A-C, D-G'
    tags: [polity:prc, polity:congo-brazzaville, name:zhou-enlai, vis:only:prc+congo-brazzaville, name:nkrumah-kwame, name:toure-ahmed-sekou, name:keita-modibo]
    time_zone: Asia/Shanghai
    variants:
