  - id: cal.1969-09-24.china-leadership
    when: Sept. 24
    date: '1969-09-24'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s eleventh draft of the Chinese government statement. Moscow having given no answer to the letter of Sept. 18, kept secret, the Soviet statement of June 13 must be answered publicly and China''s whole case on the boundary and the clashes stated: history''s rights and wrongs, the unequal treaties as the basis, "disputed areas", the interim measures.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 316–317 (Sept. 24, 1969; Zhou''s report). Made public: 2013. To check: the government statement of Oct. 7, 1969 and Zhou Enlai''s covering report of Sept. 24 (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969). Names: Mao Zedong, Zhou Enlai. Check: Mao''s note not given in the chronology.'
    src:
      c: a3922c51
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 24, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 316–317: A, B'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-24.china-leadership-2
    when: Sept. 24
    date: '1969-09-24'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Zhou Enlai writes Mao and Lin Biao: the Soviet government''s statement of June 13 must be answered publicly by the Chinese government, setting out China''s whole position on the settling of the boundary question and the truth of the border clashes, to win the initiative; the day after the government statement is issued a Foreign Ministry paper on the Soviet statement of June 13 is to follow. The Soviet statement had said that the sharpening of Soviet-Chinese relations was wholly caused by China''s actions and that the Chinese statement of May 24 made baseless demands to add trouble to trouble.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 316–317 (Sept. 24, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-09-24.china-leadership-3
    when: Sept. 24
    date: '1969-09-24'
    thread: china-leadership
    also: [defense, china]
    c: 'Zhou Enlai, on the former Ministry of Grain''s and the Military Commission''s General Rear Services Department''s report on building grain depots for war on the coastal islands, notes: for islands guarded by the coast where people live, grain is to be stored both in caves and with the people, dispersed to suit the place, growing and changed yearly.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 24, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-25.soviet-union-leadership
    when: Sept. 25–26
    date: '1969-09-25'
    thread: soviet-union-leadership
    c: Moscow. Zhivkov. Brezhnev meets him at Vnukovo Sept. 25, 3 to 5 p.m.; negotiates Sept. 26, 2 to 3, Kosygin taking part; sees him off at 4:30.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 361–362 (Sept. 25–26). Names: Brezhnev, Zhivkov, Kosygin.'
    tags: [name:brezhnev-leonid, name:zhivkov-todor, name:kosygin-aleksei, polity:ussr, polity:bulgaria]
  - id: cal.1969-09-25.china-leadership
    when: Sept. 25
    date: '1969-09-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai goes to hospital for treatment before dawn.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-26.china-leadership
    when: Sept. 26
    date: '1969-09-26'
    thread: china-leadership
    also: [soviet-union, china]
    c: 'Kosygin, replying to Zhou''s letter of Sept. 18, says the Soviet side has taken practical steps to normalize the border on the assumption that China will take like measures, appoints a delegation under Kuznetsov for talks and proposes that boundary talks begin in Peking from Oct. 10. On Sept. 29 Qiao Guanhua, in an "oral notice", approved by Zhou, to the Soviet chargé Yelizavetin: Kosygin''s letter is being studied, the talks are put off to begin Oct. 20, and the Soviet statement of June 13 will be answered publicly after National Day. On Oct. 14 Kosygin writes again that the delegation will reach Peking before Oct. 20.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 26, 1969). Made public: 2020. See [[cal.1969-09-17.china-leadership]]. Names: Zhou Enlai, Kosygin.'
    tags: [polity:prc, polity:ussr, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
  - id: cal.1969-09-27.china-leadership
    when: Sept. 27
    date: '1969-09-27'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Center issues its instruction on Wuhan, whose problem has not been settled since the Center''s May meeting: the Center''s May 27 instruction, the July 23 notice and the Aug. 28 order must be carried out in all Hubei and all Wuhan firmly, unconditionally and in full; revolution is to be grasped and production pressed, labor discipline kept and anarchism opposed; proletarian Party spirit is to be strengthened and bourgeois factionalism overcome, all factional bodies of sects and mountaintops opposed; and the Center decides to open Mao Zedong Thought study classes in Peking for Hubei and Wuhan.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 317 (Sept. 27, 1969). Made public: 2020. Names: Zhou Enlai. Check: the day it was issued.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
