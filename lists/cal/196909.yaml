    when: Sept. 27
    date: '1969-09-27'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai accompanies Mao in receiving army cadres.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 27, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-09-28.china-leadership
    when: Sept. 28
    date: '1969-09-28'
    thread: china-leadership
    also: [africa, china]
    c: 'Zhou Enlai in talks with Major Raoul, Prime Minister of Congo (Brazzaville), on Africa: China knows Africa much better now than in 1963 to 1965; the situation always develops and advances, and also twists, and reversals are hard to avoid; some African national revolutions and independence movements failed because their leaders did not see imperialism''s new plots and did not rouse the masses, and the deep lessons of history should be summed up and drawn.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Sept. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, polity:congo-brazzaville, name:zhou-enlai, vis:only:prc+congo-brazzaville]
