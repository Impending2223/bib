    thread: china-leadership
    also: [india-and-china-cultural-revolution, defense]
    c: 'Zhou Enlai speaks at the army''s war preparation conference on the international and domestic situation: the international situation is tense, so China must prepare for war and above all guard against surprise attack and keep strict watch. On the new tasks after the Ninth Congress: the Party''s leadership is to be exercised; there is to be no more "seizing power"; every Party member is held to proletarian Party spirit; mass organizations are to protect the interests of the great majority, and "grasp revolution by trades", never again to set up mountaintops or fight. With the fourth quarter near, work is to be done well to open a new face, and the Fourth and Fifth Five-Year Plans fulfilled, to make China in the near future a great socialist power.'
