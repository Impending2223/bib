  - id: cal.1969-09-17.china-leadership-4
    when: Sept. 17
    date: '1969-09-17'
    thread: china-leadership
    also: [china]
    c: 'Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying send Zhou Enlai their last report. Since early June they have met sixteen times, for almost fifty hours, by the book''s count. Their reports play down the danger of a Soviet or an American attack: both talk against China but neither wants to attack, Europe their main rivalry; China should put off any war while it grows stronger.'
