    when: Sept. 19
    date: '1969-09-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai, on the Center's instruction agreeing to the 68th Army Party committee's report of Sept. 12 asking to set up Lianyungang's revolutionary committee, writes Chen Boda, Kang Sheng and Jiang Qing, with a copy for Mao and Lin Biao.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 316 (Sept. 19, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, name:mao-zedong, name:lin-biao, vis:only:prc]
