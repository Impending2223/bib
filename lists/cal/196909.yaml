    thread: china-leadership
    also: [soviet-union]
    c: 'Peking airport VIP lounge. Zhou Enlai with Kosygin, who passes through on his way home from Hồ Chí Minh''s funeral. Zhou: theoretical and principled disputes should not hinder state relations; talks can find a way on the boundary; until then three interim measures: keep the border as it is, avoid armed clashes, disengage forces in disputed places. Kosygin adds a fourth: border authorities may consult beforehand. Agreed on the four; each to send a delegation for boundary talks soon.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 11, 1969; the airport talks); [[w.zhou-enlai-waijiao-huodong]], 539 (Sept. 11, 1969; 10:50 a.m., VIP lounge of the capital airport, Kosygin returning through Peking from Hồ Chí Minh''s funeral); [[w.zhonghua-renmin-gongheguo-waijiao]], 223 (Sept. 11, 1969; Zhou and Kosygin at the Beijing airport, on the way back from Hồ''s funeral: the border, trade and other matters; agreement that the boundary be settled by peaceful talks, with interim measures to end contact of armed forces in disputed areas, avoid clashes and hold the status quo; an agreement to be signed first; principled disputes not to bar normal relations); [[w.jianguo-yilai-mao-zedong]], XIX, 470 n.1 (Sept. 11, 1969; the editors'' account of the talk in the VIP lounge of the capital airport); [[w.macfarquhar-maos-last-revolution]], 313 (Kosygin meets Zhou Enlai at the Peking airport; border talks agreed); [[w.mao-zedong-zhuan]], VI, ch. 78 n.16 (Sept. 11 Zhou Enlai and Kosygin, the chairman of the Soviet Council of Ministers, hold talks at Peking airport; they reach a provisional understanding to ''maintain the status quo of the border and avoid armed clashes''; in the talks Zhou sternly questions Kosygin on the recent Soviet nuclear threats and Kosygin has no answer; the book gives no ''VIP lounge'' and no four points, n.16). [[w.yang-jisheng-tiandi-fanfu]], II, 736 (the airport''s VIP room, a long talk); [[w.khoo-collateral-damage]], 58 (Zhou and Kosygin at the Peking airport, Sept. 11: conflict-reduction measures and a return to border talks; no date set); [[w.teiwes-tragedy-of-lin-biao]], 111–112 (Zhou and Kosygin at Peking airport on Sept. 11, followed by agreement in early October to revive the border talks broken off in 1964). Made public: 1993. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 314 (Sept. 11, 1969), has Zhou''s first point, that disputes of theory and principle are not to hinder state relations, and adds that the two also discussed keeping and developing trade and restoring the exchange of ambassadors, Zhou ending that a good beginning had been made and the frank talk was useful to both. To check: the record of the talk (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969, as the Chinese government''s account); Record of the talk of Zhou Enlai and Kosygin at the Peking airport, Sept. 11, 1969, sent to Mao Sept. 13 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 470 n.1b); [[w.zhou-enlai-nianpu-1949]], III, 320–321 (cited by [[w.macfarquhar-maos-last-revolution]], 313 n.26a); Chai Chengwen, "Zhou Enlai yu Zhong Su bianjie tanpan", in [[w.gongheguo-zhongda-shijian-he]], II, 659–671 (cited by [[w.macfarquhar-maos-last-revolution]], 313 n.26b); [[w.kuisong-mao-zedong-yu-mosikede]], 499 (cited by [[w.macfarquhar-maos-last-revolution]], 313 n.26c); [[w.galenovich-rossia-i-kitai-v]], 125–147 (cited by [[w.macfarquhar-maos-last-revolution]], 320 n.59b); [[w.lewis-imagined-enemies]], 57 (cited by [[w.khoo-collateral-damage]], 58 n.100); [[w.robinson-china-confronts-the-soviet]], 254–278 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.19). Names: Zhou Enlai, Kosygin, Hồ Chí Minh. Check: the Soviet record of the talk; the meeting announced the same day. Mao approves the record Sept. 13 (the chronology, under Sept. 11).'
