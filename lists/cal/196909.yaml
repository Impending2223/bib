    c: 'The Military Commission''s war-fighting conference: the commanders, political commissars and senior officers of the military regions and General Headquarters on combat readiness in the north, northeast and northwest.'
    n: '[[w.macfarquhar-maos-last-revolution]], 314 (Sept. 25–27); [[w.mao-zedong-zhuan]], VI, ch. 78 (in September an all-army conference on war-readiness work, which conveys Mao''s ''the army must not relax'' and Lin Biao''s order to view, check and carry out everything from the standpoint of war; the book does not give the days, Sept. 25–27, or the regions). [[w.teiwes-tragedy-of-lin-biao]], 113 (a September warfare conference of the three north China regions, among the war preparations under way before "Order Number One"). Made public: 1999 ([[w.kuisong-mao-zedong-yu-mosikede]], 501–502). To check: [[w.kuisong-mao-zedong-yu-mosikede]], 501–502 (cited by [[w.macfarquhar-maos-last-revolution]], 314 n.32); [[w.su-caiqing-wenhua-dageming-shishi-bianwu]], 79 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21a); [[w.yunsheng-maojiawan-jishi]], 106 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 320, 322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21c); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 25, 1984 (FBIS, Nov. 7, 1984, K24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21d); [[w.nianyi-da-dongluande-niandai]], 362 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21e); [[w.ke-wenhua-dageming-zhongde-renmin]], 125, 252 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21g); [[w.chen-yi-zhuan]], 615 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21h). Check: whether it is the conference Zhou Enlai addressed on Sept. 22 ([[cal.1969-09-22.china-leadership-2]]), or the all-army war preparation conference at which Lin Biao''s words were relayed ([[cal.1969-09.china-leadership-4]]), which the book (314) gives as his closing speech here.'
