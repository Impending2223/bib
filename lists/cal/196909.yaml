    c: 'Zhou Enlai at night meets Ion Gheorghe Maurer, chairman of Romania''s Council of Ministers, passing through Peking to Hanoi for Hồ Chí Minh''s funeral. Though they differ, exchange of views is useful. Whether Vietnam goes on with the war or with the Paris talks is wholly the Vietnamese Party''s own business; China''s exchanges with the Vietnamese comrades are chiefly on the war against the Americans, to support them and learn from their experience of people''s war. On Sino-American relations: the key is Taiwan and the United Nations, which will one day be settled; China owes them no debt, they owe China. On Sino-Soviet relations: China agrees to reasonable negotiation, and before the questions are settled to keep the border as it is and avoid armed conflict.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 313 (Sept. 7, 1969); [[w.zhou-enlai-waijiao-huodong]], 538–39 (Sept. 7, 1969; 11:40 p.m., Building 2, Xinliusuo (新六所) guesthouse, Zhou with Li Xiannian meeting Maurer''s delegation on its way to Hanoi for Hồ Chí Minh''s funeral; the book adds that Zhou says the Paris talks have never concerned China, Vietnam being the host and the Soviet Union having a hand, that the Soviet Union treats Vietnam, the Middle East, West Berlin and China as trumps against the U.S., that the key to Sino-American relations is Taiwan and the U.N., and that the border clashes of recent months were deliberately provoked by the Soviet Union to turn people''s eyes from its troubles, China agreeing to reasonable negotiation and, until settlement, to maintain the status quo of the border); [[w.zhonghua-renmin-gongheguo-waijiao]], 222 (Sept. 7, 1969; Zhou''s talk with Maurer on his way to Hanoi: differing views, exchange useful; Vietnam''s war or the Paris talks is Vietnam''s own affair; the U.S.–Soviet bargaining; U.S.–China ties turn on Taiwan and the U.N.; the border clashes the Soviet side''s deliberate provocation; talks agreed, status quo before settlement); [[w.khoo-collateral-damage]], 64 (Zhou to Maurer, Sept. 7: China has never intervened in the Paris talks, Hanoi deciding for itself and the Soviets having intervened; Moscow uses Vietnam, the Middle East, West Berlin and China as trump cards with the Americans). Made public: 1993. To check: [[w.qu-xing-zhongguo-waijiao-wushinian]], 426 (cited by [[w.khoo-collateral-damage]], 64 nn.159–160). Names: Zhou Enlai, Ion Gheorghe Maurer, Hồ Chí Minh.'
