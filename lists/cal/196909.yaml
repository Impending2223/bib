# Cal. CXIX September 1969
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CXIX
entries:
  - id: cal.1969-09-01.china-leadership
    when: Sept. 1
    date: '1969-09-01'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Mao, Lin Biao and Zhou Enlai telegraph Hồ Chí Minh and other Vietnamese leaders on the DRV''s twenty-fourth anniversary: Nixon''s two-handed counterrevolution, political fraud and "de-Americanizing" the war to hold the South for ever; China counts supporting Vietnam an internationalist duty.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Hồ Chí Minh, Nixon.'
    tags: [polity:prc, polity:drv, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ho-chi-minh, name:nixon-richard-m]
  - id: cal.1969-09-02.vietnam-hanoi
    when: Sept. 2
    date: '1969-09-02'
    thread: vietnam-hanoi
    also: [vietnam]
    c: Hồ Chí Minh dies at 9:47 a.m., National Day, of a heart attack, at 79. The Politburo announces it as Sept. 3, so that the day of his death should not fall on the nation's day of celebration.
    n: '[[w.van-kien-dang-toan]], XXX, 228–29 n. (the editors'' note, from the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989, on the testament and the day of the death). Made public: 1989. Names: Hồ Chí Minh.'
    tags: [polity:drv, name:ho-chi-minh]
  - id: cal.1969-09-03.china-leadership
    when: Sept. 3
    date: '1969-09-03'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: Hồ Chí Minh dies in Hanoi. The Chinese Central Committee, the NPC Standing Committee and the State Council wire condolences to the Vietnam Workers' Party Central Committee, the National Assembly Standing Committee and the government; that night Zhou Enlai leaves Peking at the head of a Party delegation to pay condolences at Hanoi.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 3, 1969. Check: Hồ Chí Minh died Sept. 2, 1969, at 9:47 a.m.; the Politburo announced it as Sept. 3 (its notice no. 151-TB/TW of Aug. 19, 1989, quoted in [[w.van-kien-dang-toan]], XXX, 229 n.). See [[cal.1969-09-02.vietnam-hanoi]]. Names: Zhou Enlai, Hồ Chí Minh.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:ho-chi-minh]
  - id: cal.1969-09-03.vietnam-hanoi
    when: Sept. 3
    date: '1969-09-03'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Central Committee''s call to cadres, Party members, soldiers, the people and Vietnamese abroad: Hồ Chí Minh dead, after an illness and a severe heart attack, "at 9:47 a.m., Sept. 3," in Hanoi (the day announced; he died Sept. 2). Grief to be turned into revolutionary action; his line, his thought and his ways followed: "Nothing is more precious than independence and freedom"; the war and socialist construction carried to complete victory.'
    n: '*Lời kêu gọi của Ban Chấp hành Trung ương Đảng lao động Việt Nam*, Sept. 3, 1969, from *Nhân Dân*, Sept. 5, 1969. [[w.van-kien-dang-toan]], XXX, 232–36. See [[cal.1969-09-02.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, name:ho-chi-minh]
  - id: cal.1969-09-04.soviet-union-leadership
    when: Sept. 4
    date: '1969-09-04'
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev, with the Politburo's members and candidates and the Central Committee's secretaries, pays a visit of condolence to the embassy of the Democratic Republic of Vietnam on the death of Hồ Chí Minh.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 357 (Sept. 4). Names: Brezhnev, Hồ Chí Minh.'
    tags: [name:brezhnev-leonid, name:ho-chi-minh, polity:ussr, polity:drv]
  - id: cal.1969-09-04.vietnam-hanoi
    when: Sept. 4
    date: '1969-09-04'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The special communiqué of the Central Committee, the National Assembly''s Standing Committee, the Council of Ministers and the Fatherland Front''s presidium: Hồ Chí Minh dead. A state funeral; seven days of mourning, Sept. 4–10; a solemn memorial; a State Funeral Committee of 26, Lê Duẩn its head, Tôn Đức Thắng, Trường Chinh and Phạm Văn Đồng his deputies.'
    n: '*Thông cáo đặc biệt*, Hanoi, Sept. 4, 1969, from *Nhân Dân*, Sept. 5, 1969, [[w.van-kien-dang-toan]], XXX, 228–31; the committee''s list, from *Nhân Dân*, Sept. 5, 237–39. See [[cal.1969-09-03.vietnam-hanoi]]. Names: Hồ Chí Minh, Lê Duẩn, Tôn Đức Thắng, Trường Chinh, Phạm Văn Đồng.'
    tags: [polity:drv, name:ho-chi-minh, name:le-duan, name:ton-duc-thang, name:truong-chinh, name:pham-van-dong]
  - id: cal.1969-09-04.vietnam-hanoi-2
    when: Sept. 4
    date: '1969-09-04'
    thread: vietnam-hanoi
    c: 'The Politburo''s directive no. 172-CT/TW on the state funeral: the State Funeral Committee to run it at the center, the provinces at home; no feasts, receptions, shows, sports or films Sept. 4–10; grief turned to action, vigilance against the enemy. With it four slogans, the rules of mourning, the flags and armbands, and the committee''s programs, of Sept. 5, for the lying in state at Ba Đình Hall from Sept. 6 and the memorial.'
    n: '*Chỉ thị của Bộ Chính trị số 172-CT/TW, ngày 4 tháng 9 năm 1969, Về việc tổ chức Lễ quốc tang Hồ Chủ tịch*, signed for the Politburo by Lê Duẩn; the attached papers, 245–52. [[w.van-kien-dang-toan]], XXX, 240–52. Made public: 2004. See [[cal.1969-09-04.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-09-09.vietnam-hanoi
    when: Sept. 9
    date: '1969-09-09'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The memorial for Hồ Chí Minh. Lê Duẩn reads the Central Committee''s eulogy: "Bidding you farewell, we swear," five oaths: to hold high the banner of national independence, fight on to victory over the Americans, liberate the South, defend the North and reunite the country; to strive for the ideals of socialism and communism; to guard the Party''s unity "like the pupil of our eye"; to restore and strengthen the unity of the socialist camp and the fraternal parties; to learn all their lives from his morals and ways.'
    n: '*Điếu văn của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, do đồng chí Lê Duẩn ... đọc tại Lễ truy điệu trọng thể Hồ Chủ tịch, ngày 9 tháng 9 năm 1969*. [[w.van-kien-dang-toan]], XXX, 321–27 (the oaths, 322–26). See [[cal.1969-09-04.vietnam-hanoi-2]]. Names: Hồ Chí Minh, Lê Duẩn.'
    tags: [polity:drv, name:ho-chi-minh, name:le-duan]
  - id: cal.1969-09-10.soviet-union-leadership
    when: Sept. 10
    date: '1969-09-10'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev negotiates with Husák at the guest house on the Lenin Hills, 11 to 7; sees him off at Vnukovo, 8 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 358 (Sept. 10). Names: Brezhnev, Husák.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-09-11.china-leadership
    when: Sept. 11
    date: '1969-09-11'
    thread: china-leadership
    also: [soviet-union]
    c: 'Peking airport VIP lounge. Zhou Enlai with Kosygin, who passes through on his way home from Hồ Chí Minh''s funeral. Zhou: theoretical and principled disputes should not hinder state relations; talks can find a way on the boundary; until then three interim measures: keep the border as it is, avoid armed clashes, disengage forces in disputed places. Kosygin adds a fourth: border authorities may consult beforehand. Agreed on the four; each to send a delegation for boundary talks soon.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969. Made public: 2013. To check: the record of the talk (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969, as the Chinese government''s account). Names: Zhou Enlai, Kosygin, Hồ Chí Minh. Check: the Soviet record of the talk; the meeting announced the same day. Mao approves the record Sept. 13 (the chronology, under Sept. 11).'
    tags: [polity:prc, polity:ussr, name:zhou-enlai, name:kosygin-aleksei, name:ho-chi-minh, vis:only:prc+ussr@C-H]
  - id: cal.1969-09-15.soviet-union-leadership
    when: Sept. 15–16
    date: '1969-09-15'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with the Czechoslovak leaders: he receives the secretaries of the party''s Central Committee Kempný and Lenárt, Sept. 15, 6 to 7 p.m.; Sept. 16, 11:10 to 3, with Kosygin, he negotiates with Černík in the new hall.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 359 (Sept. 15–16). Names: Brezhnev, Kempný, Lenárt, Hall, Kosygin, Černík.'
    tags: [name:brezhnev-leonid, name:kosygin-aleksei, polity:ussr, polity:czechoslovakia, polity:us]
  - id: cal.1969-09-17.china-leadership
    when: Sept. 17
    date: '1969-09-17'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves Zhou Enlai''s letter to Kosygin, settled by the Politburo, as sent Sept. 18: restates the four interim measures of the airport talk of Sept. 11 and adds a fifth, that they do not prejudice either side''s position on the boundary or the ownership of the disputed areas. Zhou: once sent, see Kosygin''s answer, then decide the date of a government statement.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 17, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
  - id: cal.1969-09-18.china-leadership
    when: Sept. 18
    date: '1969-09-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao on his southern tour: at Hangzhou he asks about the arts; the actors say the Yue opera has been altered until it is neither Peking nor Yue; Mao does not approve changing Yue opera into what it is not; when told Jiang Qing made the model operas, he says no, the plays existed and were improved by the workers of the arts.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 18, 1969. Made public: 2013. Names: Mao Zedong, Jiang Qing.'
    tags: [polity:prc, name:mao-zedong, name:jiang-qing, vis:only:prc]
  - id: cal.1969-09-19.china-leadership
    when: Sept. 19
    date: '1969-09-19'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao at Nanjing, evening, hears Xu Shiyou and Du Ping on war preparation: for the National Day neither local nor army leaders to go to Peking, lest the enemy strike at the center.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1969. Made public: 2013. Names: Mao Zedong, Xu Shiyou, Du Ping.'
    tags: [polity:prc, name:mao-zedong, name:xu-shiyou, vis:only:prc]
  - id: cal.1969-09-22.china-leadership
    when: Sept. 22
    date: '1969-09-22'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Mao, at midday on his train near Jinan, hears Yang Dezhi, Yuan Shengping and Wang Xiaoyu on mass organizations, words not weapons, production and policies.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 22, 1969. Made public: 2013. Names: Mao Zedong, Yang Dezhi, Yuan Shengping, Wang Xiaoyu.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-09-23.china-leadership
    when: Sept. 23
    date: '1969-09-23'
    thread: china-leadership
    also: [testing]
    c: China fires an underground nuclear test.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 23, 1969. Check: the Xinhua communique and its day.'
    tags: [polity:prc]
  - id: cal.1969-09-24.china-leadership
    when: Sept. 24
    date: '1969-09-24'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s eleventh draft of the Chinese government statement. Moscow having given no answer to the letter of Sept. 18, kept secret, the Soviet statement of June 13 must be answered publicly and China''s whole case on the boundary and the clashes stated: history''s rights and wrongs, the unequal treaties as the basis, "disputed areas", the interim measures.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969. Made public: 2013. To check: the government statement of Oct. 7, 1969 and Zhou Enlai''s covering report of Sept. 24 (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969). Names: Mao Zedong, Zhou Enlai. Check: Mao''s note not given in the chronology.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-09-25.soviet-union-leadership
    when: Sept. 25–26
    date: '1969-09-25'
    thread: soviet-union-leadership
    c: Moscow. Zhivkov. Brezhnev meets him at Vnukovo Sept. 25, 3 to 5 p.m.; negotiates Sept. 26, 2 to 3, Kosygin taking part; sees him off at 4:30.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 361–362 (Sept. 25–26). Names: Brezhnev, Zhivkov, Kosygin.'
    tags: [name:brezhnev-leonid, name:zhivkov-todor, name:kosygin-aleksei, polity:ussr, polity:bulgaria]
  - id: cal.1969-09-29.china-leadership
    when: Sept. 29
    date: '1969-09-29'
    thread: china-leadership
    also: [testing]
    c: China explodes a hydrogen bomb in the air over its western region.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 23, 1969. See [[cal.1969-09-23.china-leadership]]. Check: the Xinhua communique and its day.'
    tags: [polity:prc]
  - id: cal.1969-09-29.vietnam-hanoi
    when: Sept. 29
    date: '1969-09-29'
    thread: vietnam-hanoi
    c: 'The Politburo''s directive no. 173-CT/TW: a round of political study, "Learn from and follow President Hồ''s Testament." Party members and the people to discuss the testament, the Central Committee''s eulogy and its call; an emulation movement; committees to review their unity, democracy and leadership, members their morals; economic management and the Party''s building strengthened.'
    n: '*Chỉ thị của Bộ Chính trị số 173-CT/TW, ngày 29 tháng 9 năm 1969, Về đợt sinh hoạt chính trị "Học tập và làm theo Di chúc của Hồ Chủ tịch"*, signed for the Politburo by Trường Chinh. [[w.van-kien-dang-toan]], XXX, 330–36. Made public: 2004. See [[cal.1969-09-09.vietnam-hanoi]]. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh, name:truong-chinh]
  - id: cal.1969-09-30.soviet-union-leadership
    when: Sept. 30
    date: '1969-09-30'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'The Politburo. Brezhnev''s outline for it: Zhivkov''s visit of Sept. 25–26; his telephone talks of Sept. 29 and 30 with Husák, Biľak and Svoboda; a military delegation under Grechko to the Czechoslovak army''s twenty-fifth anniversary; talks at Berlin, at the GDR''s twentieth anniversary, on Soviet troops abroad and the Middle East; China, the next steps; the Polish delegation under Gomułka and Cyrankiewicz, Oct. 1–3; a meeting with the Romanians; aid to the UAR, Sudan and Libya; Phạm Văn Đồng''s coming; Brandt''s telegram.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 428–30 (№ 94, "Наброски... к заседанию Политбюро ЦК КПСС 30 сентября 1969 г." (sketches for the Politburo of Sept. 30, 1969)), 450–51 nn.251–263 (the editors: the Politburo of Sept. 30 heard Brezhnev on the talks with Zhivkov and the calls with Husák, Bilak and Svoboda, and decided on the Grechko delegation, the GDR delegation and the Polish visit; Tsarapkin''s telegram of Sept. 29 on Brandt). Made public: 2016. To check: the protocol of Sept. 30. Names: Husák, Bilak, Svoboda, Grechko, Zhivkov, Gomułka, Cyrankiewicz, Brandt, Brezhnev.'
    tags: [polity:ussr, name:brezhnev-leonid, name:husak-gustav, name:svoboda-ludvik, name:grechko-andrei-a, name:brandt-willy, name:zhivkov-todor, name:gomu-ka-w-adys-aw, name:cyrankiewicz-jozef, name:pham-van-dong, vis:only:ussr]
  - id: cal.1969-09.china-leadership
    when: Sept., middle
    date: 1969-09
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: the Politburo''s draft slogans for the twentieth anniversary of the PRC: "added a line" for approval: peoples of the world unite against aggressive war launched by any imperialism or social-imperialism, above all atomic war; if it comes, to end it by revolutionary war, and prepare from now. Printed Sept. 17 in *Renmin ribao*.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Sept. 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
