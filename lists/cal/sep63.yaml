# Cal. XXXV September 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXV
entries:
  - id: cal.1963-09-02.vietnam
    when: Sept. 2
    date: '1963-09-02'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Cronkite at Hyannis Port, for CBS''s first half-hour evening news. Vietnam: "In the final analysis, it is their war." Success possible "with changes in policy and perhaps with personnel." Withdrawal "a great mistake."'
    n: '[Transcript of Broadcast With Walter Cronkite Inaugurating a CBS Television News Program](https://www.presidency.ucsb.edu/documents/transcript-broadcast-with-walter-cronkite-inaugurating-cbs-television-news-program) (Sept. 2, 1963). [FRUS 1961–63, IV, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v04/d50). Cronkite, *A Reporter''s Life* (K–J Cong. II.I.4). See [[cal.1963-05-08.vietnam]]. Names: Cronkite (K–J Cong. III.J).'
    tags: [name:kennedy-john-f, name:cronkite-walter]
  - id: cal.1963-09-02.alabama
    when: Sept. 2–6
    date: '1963-09-02'
    thread: alabama
    c: 'Alabama''s schools open under court orders. Sept. 2: Wallace''s troopers close Tuskegee High. Sept. 4: two Black children enrolled in Birmingham; that night Shores''s house bombed; rioting, one man killed. Sept. 5: Birmingham''s schools closed at Wallace''s request. Sept. 6: troopers at the Huntsville schools.'
    n: '[Statement by the President on Desegregation in the Schools of Alabama](https://www.presidency.ucsb.edu/documents/statement-the-president-desegregation-the-schools-alabama) (Sept. 9, 1963). [Exec. Order No. 11,118](https://www.presidency.ucsb.edu/documents/executive-order-11118-providing-assistance-for-removal-unlawful-obstructions-justice-the), [28 Fed. Reg. 9863](https://www.govinfo.gov/app/details/FR-1963-09-11) (1963). Carter, *The Politics of Rage* (K–J Cong. II.H). McWhorter, *Carry Me Home* (K–J Cong. II.F). Marshall, *Federalism and Civil Rights*; Brauer, *John F. Kennedy and the Second Reconstruction* (K–J Adm. II.C). See [[cal.1963-06-11.alabama]]. Names: Wallace (K–J Cong. III.F); Shores (K–J Cong. III.K).'
    tags: [name:wallace-george-c, name:shores-arthur-d]
  - id: cal.1963-09-06.vietnam
    when: Sept. 6–10
    date: '1963-09-06'
    thread: vietnam
    c: 'Krulak and Mendenhall to Vietnam and back in four days. Before Kennedy, Sept. 10: Krulak, the war going well; Mendenhall, the government near collapse. Kennedy: "The two of you did visit the same country, didn''t you?"'
    n: 'FRUS 1961–63, IV, docs. [82](https://history.state.gov/historicaldocuments/frus1961-63v04/d82) (Krulak''s report), [83](https://history.state.gov/historicaldocuments/frus1961-63v04/d83). Krulak, *First to Fight* (Viet. II.H.2). Mecklin, *Mission in Torment* (Viet. II.G.4). Hilsman, *To Move a Nation* (K–J Adm. II.G.4). See [[cal.1963-08-24.vietnam]]. Names: Krulak (Viet. III.D).'
    tags: [name:krulak-victor-h, name:mendenhall-joseph-a, name:kennedy-john-f]
  - id: cal.1963-09-09.vietnam
    when: Sept. 9
    date: '1963-09-09'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Huntley and Brinkley, for NBC''s first half-hour news. The domino theory: "I believe it." A cut in aid to Saigon not "helpful at this time."'
    n: '[Transcript of Broadcast on NBC''s "Huntley-Brinkley Report."](https://www.presidency.ucsb.edu/documents/transcript-broadcast-nbcs-huntley-brinkley-report) (Sept. 9, 1963). See [[cal.1963-09-02.vietnam]]. Names: Huntley, Brinkley (K–J Cong. III.J).'
    tags: [name:kennedy-john-f, name:huntley-chet, name:brinkley-david]
  - id: cal.1963-09-09.alabama
    when: Sept. 9–10
    date: '1963-09-09'
    thread: alabama
    c: 'Alabama''s federal district judges, all of them, enjoin Wallace from blocking the schools, Sept. 9; he sends the Guard instead. Sept. 10: Kennedy federalizes the Alabama Guard and sends it from the schools. Black pupils enter in Birmingham and Mobile.'
    n: '[Statement by the President on Desegregation in the Schools of Alabama](https://www.presidency.ucsb.edu/documents/statement-the-president-desegregation-the-schools-alabama) (Sept. 9, 1963). [Proclamation 3554](https://www.presidency.ucsb.edu/documents/proclamation-3554-obstructions-justice-the-state-alabama); [Exec. Order No. 11,118](https://www.presidency.ucsb.edu/documents/executive-order-11118-providing-assistance-for-removal-unlawful-obstructions-justice-the), [28 Fed. Reg. 9863](https://www.govinfo.gov/app/details/FR-1963-09-11) (1963). See [[cal.1963-09-02.alabama]]. Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c, name:kennedy-john-f]
  - id: cal.1963-09-10.program
    when: Sept. 10
    date: '1963-09-10'
    thread: program
    c: House passes the mental retardation facilities and community mental health centers bill, $238 million over three years, [335–18](https://voteview.com/rollcall/RH0880065).
    n: '[109 Cong. Rec., House, Sept. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-13-2.pdf). Gerald N. Grob, *From Asylum to Community: Mental Health Policy in Modern America* (1991).'
  - id: cal.1963-09-11.testing
    when: Sept. 11
    date: '1963-09-11'
    thread: testing
    c: 'Letter to Mansfield and Dirksen: underground tests to go on, the laboratories kept up, atmospheric tests ready to resume, detection improved. Dirksen reads it in the Senate and comes out for the treaty.'
    n: '[Letter to Senate Leaders Restating the Administration''s Views on the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/letter-senate-leaders-restating-the-administrations-views-the-nuclear-test-ban-treaty) (Sept. 11, 1963). [109 Cong. Rec., Senate, Sept. 11, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-14-2.pdf). See [[cal.1963-06-10.testing]]. Names: Mansfield, Dirksen (K–J Cong. III.A).'
    tags: [name:kennedy-john-f, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1963-09-12.opinion
    when: Sept. 12–17
    date: '1963-09-12'
    thread: opinion
    c: 'Gallup: 56 percent approve, 29 disapprove, the low of the presidency. From 61 in late July and 62 in mid-August.'
    n: '[John F. Kennedy: Public Approval](https://www.presidency.ucsb.edu/statistics/data/john-f-kennedy-public-approval) (APP). *The Gallup Poll* (K–J Cong. II.E). See [[cal.1961-02-10.opinion]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-09-15.alabama
    when: Sept. 15
    date: '1963-09-15'
    thread: alabama
    c: 'Sunday morning. Dynamite at the Sixteenth Street Baptist Church, Birmingham. Four girls killed: Addie Mae Collins, Denise McNair, Carole Robertson, Cynthia Wesley. Two Black boys shot dead in the city that afternoon. Kennedy, Sept. 16: "public disparagement of law and order has encouraged violence." Marshall and FBI bomb men sent.'
    n: '[Statement by the President on the Sunday Bombing in Birmingham](https://www.presidency.ucsb.edu/documents/statement-the-president-the-sunday-bombing-birmingham) (Sept. 16, 1963). McWhorter, *Carry Me Home* (K–J Cong. II.F). Branch, *Parting the Waters* (K–J Adm. II.C). Garrow, *Bearing the Cross* (K–J Cong. II.F). Frank Sikora, *Until Justice Rolls Down: The Birmingham Church Bombing Case* (1991). See [[cal.1963-04-03.alabama]]. Names: Collins, McNair, Robertson, Wesley (K–J Cong. III.K); Marshall (K–J Adm. III.I).'
    tags: [name:collins-addie-mae, name:mcnair-denise, name:robertson-carole, name:wesley-cynthia, name:marshall-burke, name:kennedy-john-f]
  - id: cal.1963-09-16.trade
    when: Sept. 16
    date: '1963-09-16'
    thread: trade
    c: Canada sells the Soviet Union wheat worth about $500 million. Soviet buyers ask after American wheat. Kennedy's answer Oct. 9.
    n: '[FRUS 1961–63, IX, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v09/d330). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-09-18.cuba
    when: Sept. 18
    date: '1963-09-18'
    thread: cuba
    c: 'Attwood, at the UN mission, proposes a quiet approach to Lechuga, Cuba''s delegate: would Castro neutralize Cuba on American terms? Attwood and Lechuga meet at Lisa Howard''s, Sept. 23. Check the date.'
    n: '[FRUS 1961–63, XI, doc. 367](https://history.state.gov/historicaldocuments/frus1961-63v11/d367). William Attwood, *The Twilight Struggle: Tales of the Cold War* (1987). Fursenko & Naftali, *"One Hell of a Gamble"* (K–J Adm. II.D). William M. LeoGrande & Peter Kornbluh, *Back Channel to Cuba* (2014). See [[cal.1963-01-08.cuba]]. Names: Castro (K–J Adm. III.J); Lechuga (K–J Cong. III.K).'
    tags: [name:attwood-william, name:lechuga-carlos, name:castro-fidel, name:howard-lisa]
  - id: cal.1963-09-18.economy
    when: Sept. 18
    date: '1963-09-18'
    thread: economy
    also: [testing]
    c: Television address on the treaty and the tax bill, a week before the House votes on the bill.
    n: '[Radio and Television Address to the Nation on the Test Ban Treaty and the Tax Reduction Bill](https://www.presidency.ucsb.edu/documents/radio-and-television-address-the-nation-the-test-ban-treaty-and-the-tax-reduction-bill) (Sept. 18, 1963). See [[cal.1963-01-24.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-09-19.alabama
    when: Sept. 19–23
    date: '1963-09-19'
    thread: alabama
    c: 'Kennedy sees Birmingham''s Black leaders, King among them, Sept. 19; names Royall and Blaik to represent him in the city. Sept. 23: the city''s white leaders.'
    n: '[Further Statement by the President on the Sunday Bombing in Birmingham](https://www.presidency.ucsb.edu/documents/further-statement-the-president-the-sunday-bombing-birmingham) (Sept. 19, 1963). [Statement by the President Following Meetings With Civic Leaders and Members of the Clergy of Birmingham](https://www.presidency.ucsb.edu/documents/statement-the-president-following-meetings-with-civic-leaders-and-members-the-clergy) (Sept. 23, 1963). See [[cal.1963-09-15.alabama]]. Names: King (K–J Cong. III.H); Royall, Blaik (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:king-martin-luther-jr, name:royall-kenneth-c, name:blaik-earl-h]
  - id: cal.1963-09-20.space
    when: Sept. 20
    date: '1963-09-20'
    thread: space
    also: [testing]
    c: 'Address to the UN General Assembly. After the treaty: a ban on weapons of mass destruction in orbit, guards against surprise attack, and "a joint expedition to the moon."'
    n: '[Address Before the 18th General Assembly of the United Nations](https://www.presidency.ucsb.edu/documents/address-before-the-18th-general-assembly-the-united-nations) (Sept. 20, 1963). Logsdon, *John F. Kennedy and the Race to the Moon* (K–J Adm. II.B). See [[cal.1962-11-21.space]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-09-21.vietnam
    when: Sept. 21
    date: '1963-09-21'
    thread: vietnam
    c: 'Kennedy sends McNamara and Taylor to Vietnam for "the best possible on-the-spot appraisal" of the war. They leave Sept. 23; report Oct. 2.'
    n: '[FRUS 1961–63, IV, doc. 142](https://history.state.gov/historicaldocuments/frus1961-63v04/d142). McNamara, *In Retrospect*; Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). Novosejt, *"I Made Mistakes"* (K–J Adm. II.D). Selverstone, *The Kennedy Withdrawal*; Kaiser, *American Tragedy* (Viet. II.B.8). *The Pentagon Papers* (K–J Adm. II.H.3). See [[cal.1963-08-24.vietnam]]. Names: McNamara, Taylor (Viet. III.A).'
    tags: [name:kennedy-john-f, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1963-09-24.testing
    when: Sept. 24
    date: '1963-09-24'
    thread: testing
    c: 'Senate consents to the treaty, [80–19](https://voteview.com/rollcall/RS0880133). Against: eleven Democrats, Russell, Stennis, and Thurmond among them; eight Republicans, Goldwater and Margaret Chase Smith among them. Goldwater''s reservation on Cuba lost the day before, [17–75](https://voteview.com/rollcall/RS0880127).'
    n: '[109 Cong. Rec., Senate, Sept. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf). [Statement by the President Following the Senate Vote on the Nuclear Test Ban Treaty](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-senate-vote-the-nuclear-test-ban-treaty) (Sept. 24, 1963). [FRUS 1961–63, VII, doc. 366](https://history.state.gov/historicaldocuments/frus1961-63v07/d366). See [[cal.1963-06-10.testing]]. Names: Russell, Stennis, Thurmond (K–J Cong. III.B); Goldwater (Opp. III.B); Smith (Opp. III.A).'
    tags: [name:russell-richard-b, name:stennis-john-c, name:thurmond-strom, name:goldwater-barry-m, name:smith-margaret-chase, name:kennedy-john-f]
  - id: cal.1963-09-24.program
    when: Sept. 24
    date: '1963-09-24'
    thread: program
    c: Health Professions Educational Assistance Act signed. Grants to build medical, dental, and public health schools; loans to their students.
    n: '[Pub. L. No. 88-129, 77 Stat. 164](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg164-2.pdf) (1963). [Remarks Upon Signing the Health Professions Educational Assistance Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-health-professions-educational-assistance-act) (Sept. 24, 1963). Blumenthal & Morone, *The Heart of Power* (K–J Adm. II.B).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-09-24.program-2
    when: Sept. 24–28
    date: '1963-09-24'
    thread: program
    also: [testing]
    c: 'Conservation tour: eleven States in five days, Milford, Pennsylvania, to Las Vegas, with Udall. At the Mormon Tabernacle, Sept. 26, the treaty and the world beyond it.'
    n: '[Address at the Pinchot Institute for Conservation Studies, Milford, Pennsylvania](https://www.presidency.ucsb.edu/documents/address-the-pinchot-institute-for-conservation-studies-milford-pennsylvania) (Sept. 24, 1963). [Address in Salt Lake City at the Mormon Tabernacle](https://www.presidency.ucsb.edu/documents/address-salt-lake-city-the-mormon-tabernacle) (Sept. 26, 1963). Smith, *Stewart L. Udall* (K–J Adm. II.B). Udall, *The Quiet Crisis* (K–J Adm. II.G.5). Names: Udall (K–J Adm. III.G).'
    tags: [name:kennedy-john-f, name:udall-stewart-l]
  - id: cal.1963-09-25.economy
    when: Sept. 25
    date: '1963-09-25'
    thread: economy
    c: 'House passes Mills''s tax bill, [271–155](https://voteview.com/rollcall/RH0880069): Democrats 223–29, Republicans 48–126. Byrnes''s motion to recommit, the cut to wait on spending under $98 billion, fails [199–226](https://voteview.com/rollcall/RH0880068). Individual rates 14 to 70 percent, from 20 to 91; corporate 48, from 52.'
    n: '[109 Cong. Rec., House, Sept. 25, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-9-2.pdf). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1963-01-24.economy]]. Names: Mills (K–J Cong. III.D); Byrnes (Opp. III.C).'
    tags: [name:mills-wilbur-d, name:byrnes-john-w]
  - id: cal.1963-09-30.transition-and-staff
    when: Sept. 30
    date: '1963-09-30'
    thread: transition-and-staff
    c: Gronouski, Wisconsin's tax commissioner, sworn in as Postmaster General. The first Polish American in the cabinet.
    n: '[Remarks at the Swearing In of Postmaster General John A. Gronouski](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-postmaster-general-john-gronouski) (Sept. 30, 1963). See [[cal.1963-07-26.transition-and-staff]]. Names: Gronouski (K–J Adm. III.G).'
    tags: [name:gronouski-john-a, name:kennedy-john-f]
