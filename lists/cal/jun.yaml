  - id: cal.1961-06-26.transition-and-staff
    when: June 26
    date: '1961-06-26'
    thread: transition-and-staff
    c: Taylor named Military Representative of the President, from July 1. A general between Kennedy and the Joint Chiefs.
    n: '[FRUS 1961–63, I, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v01/d75). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D).'
