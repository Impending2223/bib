    c: Eugene Staley's economic mission in Saigon. Its program, approved in August, underwrites a larger army.
    n: '[FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01), docs. [72](https://history.state.gov/historicaldocuments/frus1961-63v01/d72), [93](https://history.state.gov/historicaldocuments/frus1961-63v01/d93), [114](https://history.state.gov/historicaldocuments/frus1961-63v01/d114), [118](https://history.state.gov/historicaldocuments/frus1961-63v01/d118). See [[cal.1961-01-28.vietnam]].'
