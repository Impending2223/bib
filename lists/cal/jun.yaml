  - id: cal.1961-06-30.program
    when: June 30
    date: '1961-06-30'
    thread: program
    c: Housing Act of 1961 and Social Security Amendments of 1961 signed. Moderate-income housing, urban renewal, open space; earlier retirement for men at sixty-two. LeMay becomes Air Force Chief of Staff.
    n: '[Pub. L. No. 87-70, 75 Stat. 149](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg149.pdf); [Pub. L. No. 87-64, 75 Stat. 131](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg131.pdf) (K–J Cong. II.J.2). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Pritchett (K–J Adm. II.G.5). Names: Weaver (K–J Adm. III.G); Sparkman (K–J Cong. III.B); LeMay (K–J Adm. III.F).'
    tags: [name:lemay-curtis-e, name:kennedy-john-f]
