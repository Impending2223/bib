    thread: court
    c: '*Mapp v. Ohio*, [367 U.S. 643](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367643/usrep367643.pdf); *Torcaso v. Watkins*, [367 U.S. 488](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367488/usrep367488.pdf); *Poe v. Ullman*, [367 U.S. 497](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367497/usrep367497.pdf). The last day of the Term.'
    n: 'See [[cal.1961-01-23.court]]. Names: Harlan (K–J Cong. III.G), dissenting in *Poe*.'
