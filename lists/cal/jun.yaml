# Cal. VIII June
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VIII
entries:
  - id: cal.1961-06-03.berlin-and-vienna
    when: June 3–4
    date: '1961-06-03'
    thread: berlin-and-vienna
    c: 'Vienna summit. Khrushchev hands over an aide-mémoire: a German peace treaty within six months, and an end to Western rights in Berlin. Kennedy to Reston afterward: the worst thing in his life. Laos the only agreement.'
    n: 'FRUS vols. 5 and 14 (the memoranda of conversation). Beschloss, *Crisis Years*; Kempe, *Berlin 1961*; Catudal; Harrison, *Driving the Soviets up the Wall*; Fursenko & Naftali, *Khrushchev''s Cold War*; Wilke, *Der Weg zur Mauer*; *Prezidium TsK KPSS* (K–J Adm. II.D). Khrushchev, *Vremya. Lyudi. Vlast''* (K–J Adm. II.G.7). Thompson & Thompson, *The Kremlinologist*; Bohlen, *Witness to History* (K–J Adm. II.G.4). Reston, *Deadline* (K–J Cong. II.I.4). Names: Khrushchev, Gromyko, Menshikov (K–J Adm. III.J); Thompson, Kohler (K–J Adm. III.E).'
  - id: cal.1961-06-05.berlin-and-vienna
    when: June 5
    date: '1961-06-05'
    thread: berlin-and-vienna
    c: London. Macmillan.
    n: Macmillan, *At the End of the Day*; *Macmillan Diaries* (K–J Adm. II.G.7).
  - id: cal.1961-06-05.court
    when: June 5
    date: '1961-06-05'
    thread: court
    c: '*Communist Party v. SACB*, [367 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367001/usrep367001.pdf), and *Scales v. United States*, [367 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367203/usrep367203.pdf). The McCarran registration order and the Smith Act membership clause upheld, both 5–4.'
    n: See [[cal.1961-01-23.court]]. Kennedy had to decide whether to enforce registration.
  - id: cal.1961-06-06.berlin-and-vienna
    when: June 6
    date: '1961-06-06'
    thread: berlin-and-vienna
    c: Report to the nation on Vienna. "A very sober two days."
    n: Radio and Television Report to the American People on Returning from Europe (June 6, 1961).
  - id: cal.1961-06-12.right-and-the-military
    when: June 12
    date: '1961-06-12'
    thread: right-and-the-military
    c: Walker admonished; his program found improper. He resigns in November. Check the date.
    n: See [[cal.1961-04-17.right-and-the-military]].
  - id: cal.1961-06-13.cuba
    when: June 13
    date: '1961-06-13'
    thread: cuba
    c: The Cuba Study Group reports. Blame shared; the CIA's covert role to be reduced; the Joint Chiefs to advise on such operations.
    n: Memorandum from Taylor to the President (K–J Adm. II.H.3); *Operation Zapata* (1981). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4).
  - id: cal.1961-06-15.berlin-and-vienna
    when: June 15
    date: '1961-06-15'
    thread: berlin-and-vienna
    c: Khrushchev repeats the deadline on Soviet television. Tower sworn in. Check Tower's date.
    n: See [[cal.1961-06-03.berlin-and-vienna]].
  - id: cal.1961-06-19.court
    when: June 19
    date: '1961-06-19'
    thread: court
    c: '*Mapp v. Ohio*, [367 U.S. 643](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367643/usrep367643.pdf); *Torcaso v. Watkins*, [367 U.S. 488](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367488/usrep367488.pdf); *Poe v. Ullman*, [367 U.S. 497](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367497/usrep367497.pdf). The last day of the Term.'
    n: 'See [[cal.1961-01-23.court]]. Names: Harlan (K–J Cong. III.G), dissenting in *Poe*.'
  - id: cal.1961-06-20.transition-and-staff
    when: June 20–21
    date: '1961-06-20'
    thread: transition-and-staff
    c: Ikeda Hayato in Washington. The partnership statement; a joint committee on trade. Check.
    n: 'Reischauer, *My Life Between Japan and America* (K–J Adm. II.G.4). FRUS vol. 22. Names: Ikeda (K–J Adm. III.J).'
  - id: cal.1961-06-26.transition-and-staff
    when: June 26
    date: '1961-06-26'
    thread: transition-and-staff
    c: Taylor named Military Representative of the President, from July 1. A general between Kennedy and the Joint Chiefs. Check the date.
    n: Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D).
  - id: cal.1961-06-28.cuba
    when: June 28
    date: '1961-06-28'
    thread: cuba
    c: NSAMs 55 and 57 apply the Study Group's lessons. Acheson's Berlin report, the hard line, reaches the President about this time. Check Acheson's date.
    n: NSAM No. 55 & No. 57 (K–J Adm. II.H.2). FRUS vol. 14 for Acheson. Kempe (K–J Adm. II.D).
  - id: cal.1961-06.civil-rights-the-executive
    when: June
    date: 1961-06
    thread: civil-rights-the-executive
    c: W. Harold Cox, Eastland's college roommate, appointed to the Southern District of Mississippi; the first Kennedy judge in the Deep South. Check the date.
    n: 'Navasky (K–J Adm. II.E). See [[cal.1961-05-19.civil-rights-the-executive]]. Names: Cox (K–J Cong. III.G).'
  - id: cal.1961-06.vietnam
    when: June–July
    date: 1961-06
    thread: vietnam
    c: Eugene Staley's economic mission in Saigon. Its program, approved in August, underwrites a larger army. Check.
    n: FRUS vol. 1. See [[cal.1961-01-28.vietnam]].
  - id: cal.1961-06-30.program
    when: June 30
    date: '1961-06-30'
    thread: program
    c: Housing Act of 1961 and Social Security Amendments of 1961 signed. Moderate-income housing, urban renewal, open space; earlier retirement for men at sixty-two. LeMay becomes Air Force Chief of Staff.
    n: 'Pub. L. No. 87-70; Pub. L. No. 87-64, 75 Stat. 131 (K–J Cong. II.J.2). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Pritchett (K–J Adm. II.G.5). Names: Weaver (K–J Adm. III.G); Sparkman (K–J Cong. III.B); LeMay (K–J Adm. III.F).'
  - id: cal.1961-06-30.economy
    when: June 30
    date: '1961-06-30'
    thread: economy
    c: The debt limit raised temporarily to $298 billion for the new fiscal year. Check the figure.
    n: Pub. L. No. 87-69 (K–J Cong. II.J.2). CQ Almanac 1961 (K–J Cong. II.L).
  - id: cal.1961-06.opinion
    when: June
    date: 1961-06
    thread: opinion
    c: 'Approval still near the April high: 82 percent in the survey closing June 6, by some compilations. Check.'
    n: See [[cal.1961-02-10.opinion]].
