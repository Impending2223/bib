    n: '[FRUS 1961–63, I, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v01/d75). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D).'
    tags: [name:taylor-maxwell, name:kennedy-john-f]
