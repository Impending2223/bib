    when: June 28
    date: '1961-06-28'
    thread: cuba
    c: NSAMs 55 and 57 apply the Study Group's lessons. Acheson's Berlin report, the hard line, reaches the President about this time.
    n: '[NSAM No. 55](https://history.state.gov/historicaldocuments/frus1961-63v08/d32) & [No. 57](https://history.state.gov/historicaldocuments/frus1961-63v08/d34) (K–J Adm. II.H.2). [FRUS vol. 14](https://history.state.gov/historicaldocuments/frus1961-63v14) for Acheson. Kempe (K–J Adm. II.D).'
    tags: [name:acheson-dean-g, name:kennedy-john-f]
  - id: cal.1961-06.civil-rights-the-executive
    when: June
    date: 1961-06
    thread: civil-rights-the-executive
    c: W. Harold Cox, Eastland's college roommate, appointed to the Southern District of Mississippi; the first Kennedy judge in the Deep South.
    n: '[Cong. Rec., Senate, June 27, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt9/pdf/GPO-CRECB-1961-pt9-2-1.pdf#page=32). Navasky (K–J Adm. II.E). See [[cal.1961-05-19.civil-rights-the-executive]]. Names: Cox (K–J Cong. III.G).'
    tags: [name:cox-w-harold, name:eastland-james-o, name:kennedy-john-f]
  - id: cal.1961-06.vietnam
    when: June–July
    date: 1961-06
    thread: vietnam
    c: Eugene Staley's economic mission in Saigon. Its program, approved in August, underwrites a larger army.
    n: '[FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01), docs. [72](https://history.state.gov/historicaldocuments/frus1961-63v01/d72), [93](https://history.state.gov/historicaldocuments/frus1961-63v01/d93), [114](https://history.state.gov/historicaldocuments/frus1961-63v01/d114), [118](https://history.state.gov/historicaldocuments/frus1961-63v01/d118). See [[cal.1961-01-28.vietnam]].'
    tags: [name:staley-eugene]
  - id: cal.1961-06-28.opinion
    when: June 28
    date: '1961-06-28'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: integration gradually, 61 percent; by every means in the near future, 23; never, 7. Sit-ins, freedom buses, and other demonstrations will hurt the Negro''s chances, 57; help, 27.'
    n: '*The Gallup Poll*, III, 1724 (K–J Cong. II.E).'
  - id: cal.1961-06-30.program
    when: June 30
    date: '1961-06-30'
    thread: cities-and-housing
    also: [welfare]
    c: Housing Act of 1961, [75 Stat. 149](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg149.pdf), and Social Security Amendments of 1961, [75 Stat. 131](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg131.pdf), signed. Moderate-income housing, urban renewal, open space; earlier retirement for men at sixty-two. LeMay becomes Air Force Chief of Staff.
    n: 'Statutes (K–J Cong. II.J.2). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Pritchett (K–J Adm. II.G.5). Names: Weaver (K–J Adm. III.G); Sparkman (K–J Cong. III.B); LeMay (K–J Adm. III.F).'
    tags: [name:lemay-curtis-e, name:kennedy-john-f]
