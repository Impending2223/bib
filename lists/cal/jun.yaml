list: cal
section: VIII
entries:
  - id: cal.1961-06-03.berlin-and-vienna
    when: June 3–4
    date: '1961-06-03'
    thread: berlin-and-vienna
    c: 'Vienna summit. Khrushchev hands over an aide-mémoire: a German peace treaty within six months, and an end to Western rights in Berlin. Kennedy to Reston afterward: the worst thing in his life. Laos the only agreement.'
    n: 'FRUS vols. [5](https://history.state.gov/historicaldocuments/frus1961-63v05) and [14](https://history.state.gov/historicaldocuments/frus1961-63v14) (the memoranda of conversation). Beschloss, *Crisis Years*; Kempe, *Berlin 1961*; Catudal; Harrison, *Driving the Soviets up the Wall*; Fursenko & Naftali, *Khrushchev''s Cold War*; Wilke, *Der Weg zur Mauer*; *Prezidium TsK KPSS* (K–J Adm. II.D). Khrushchev, *Vremya. Lyudi. Vlast''* (K–J Adm. II.G.7). Thompson & Thompson, *The Kremlinologist*; Bohlen, *Witness to History* (K–J Adm. II.G.4). Reston, *Deadline* (K–J Cong. II.I.4). Names: Khrushchev, Gromyko, Menshikov (K–J Adm. III.J); Thompson, Kohler (K–J Adm. III.E).'
    tags: [name:khrushchev-nikita-s, name:reston-james, name:kennedy-john-f]
  - id: cal.1961-06-05.berlin-and-vienna
    when: June 5
    date: '1961-06-05'
    thread: berlin-and-vienna
    c: London. Macmillan.
    n: '[Joint Statement Following Discussion With Prime Minister Macmillan](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussion-with-prime-minister-macmillan); [FRUS 1961–63, XIV, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v14/d34). Macmillan, *At the End of the Day*; *Macmillan Diaries* (K–J Adm. II.G.7).'
    tags: [name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1961-06-05.court
    when: June 5
    date: '1961-06-05'
    thread: court
    c: '*Communist Party v. SACB*, [367 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367001/usrep367001.pdf), and *Scales v. United States*, [367 U.S. 203](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367203/usrep367203.pdf). The McCarran registration order and the Smith Act membership clause upheld, both 5–4.'
    n: See [[cal.1961-01-23.court]]. Kennedy had to decide whether to enforce registration.
  - id: cal.1961-06-06.berlin-and-vienna
    when: June 6
    date: '1961-06-06'
    thread: berlin-and-vienna
    c: Report to the nation on Vienna. "A very sober two days."
    n: '[Radio and Television Report to the American People on Returning from Europe](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-returning-from-europe) (June 6, 1961).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-12.right-and-the-military
    when: June 12
    date: '1961-06-12'
    thread: right-and-the-military
    c: Walker admonished; his program found improper. He resigns [[cal.1961-11-02.right-and-the-military]].
    n: See [[cal.1961-04-17.right-and-the-military]].
    tags: [name:walker-edwin-a]
  - id: cal.1961-06-13.cuba
    when: June 13
    date: '1961-06-13'
    thread: cuba
    c: The Cuba Study Group reports. Blame shared; the CIA's covert role to be reduced; the Joint Chiefs to advise on such operations.
    n: 'FRUS 1961–63, X, docs. [230](https://history.state.gov/historicaldocuments/frus1961-63v10/d230), [233](https://history.state.gov/historicaldocuments/frus1961-63v10/d233), [234](https://history.state.gov/historicaldocuments/frus1961-63v10/d234). Memorandum from Taylor to the President (K–J Adm. II.H.3); *Operation Zapata* (1981). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4).'
  - id: cal.1961-06-13.confirmations
    when: June 13
    date: '1961-06-13'
    thread: confirmations
    c: Howard Morgan confirmed to the Federal Power Commission, [57–27](https://voteview.com/rollcall/RS0870076).
    n: '[107 Cong. Rec., Senate, June 13, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-3-2.pdf). See [[cal.1961-03-07.confirmations]].'
    tags: ['name:morgan-howard']
  - id: cal.1961-06-15.berlin-and-vienna
    when: June 15
    date: '1961-06-15'
    thread: berlin-and-vienna
    c: Khrushchev repeats the deadline on Soviet television. Tower sworn in.
    n: '[Cong. Rec., Senate, June 15, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-5-2.pdf#page=29). See [[cal.1961-06-03.berlin-and-vienna]].'
    tags: [name:khrushchev-nikita-s, name:tower-john-g]
