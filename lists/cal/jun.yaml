    when: June 18
    date: '1961-06-18'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: Kennedy right to send marshals to Montgomery, 70 percent; wrong, 13. In the South, 50 right, 29 wrong.'
    n: '*The Gallup Poll*, III, 1723 (K–J Cong. II.E).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-06-19.court
    when: June 19
    date: '1961-06-19'
    thread: court
    c: '*Mapp v. Ohio*, [367 U.S. 643](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367643/usrep367643.pdf); *Torcaso v. Watkins*, [367 U.S. 488](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367488/usrep367488.pdf); *Poe v. Ullman*, [367 U.S. 497](https://tile.loc.gov/storage-services/service/ll/usrep/usrep367/usrep367497/usrep367497.pdf). The last day of the Term.'
    n: 'See [[cal.1961-01-23.court]]. Names: Harlan (K–J Cong. III.G), dissenting in *Poe*.'
  - id: cal.1961-06-20.transition-and-staff
    when: June 20–22
    date: '1961-06-20'
    thread: transition-and-staff
    c: Ikeda Hayato in Washington. The partnership statement; a joint committee on trade.
    n: 'Reischauer, *My Life Between Japan and America* (K–J Adm. II.G.4). [FRUS vol. 22](https://history.state.gov/historicaldocuments/frus1961-63v22). Names: Ikeda (K–J Adm. III.J).'
    tags: [name:kennedy-john-f, name:ikeda-hayato]
  - id: cal.1961-06-21.opinion
    when: June 21
    date: '1961-06-21'
    thread: opinion
    also: [freedom-rides, desegregation-public-places]
    c: 'Gallup, May 28–June 2: the Supreme Court''s ruling against segregation on trains, buses, and in waiting rooms, 66 percent approve, 28 disapprove; in the South, 26 approve. 63 percent have heard of the freedom rides; of them, 24 approve of the riders, 64 disapprove.'
    n: '*The Gallup Poll*, III, 1723 (K–J Cong. II.E).'
  - id: cal.1961-06-23.opinion
    when: June 23
    date: '1961-06-23'
    thread: opinion
    also: [desegregation-schools, court]
    c: 'Gallup, May 28–June 2: the Supreme Court''s school desegregation decision, 62 percent approve, 33 disapprove. In the South, 24 approve, 69 disapprove.'
    n: '*The Gallup Poll*, III, 1723 (K–J Cong. II.E).'
  - id: cal.1961-06-25.opinion
    when: June 25
    date: '1961-06-25'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 28–June 2: race relations in the South in the coming year, better 29 percent, worse 53. In the South, worse 65.'
    n: '*The Gallup Poll*, III, 1723 (K–J Cong. II.E).'
