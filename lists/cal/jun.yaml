    thread: economy
    c: The debt limit raised temporarily to $298 billion for the new fiscal year.
    n: '[Pub. L. No. 87-69, 75 Stat. 148](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg148-2.pdf) (K–J Cong. II.J.2). CQ Almanac 1961 (K–J Cong. II.L).'
