    c: 'Mao leaves Shanghai by train in the morning for Hangzhou. At noon, on the train, he talks with the 20th Army''s commissar Nan Ping and the Air Force 5th Army''s commissar Chen Liyun, Yang Chengwu, Zhang Chunqiao, Yu Lijin and Wang Dongxing present. The movement''s first year gone, the second three months in, July to September; ten more provinces to settle, and by the Spring Festival the country will have an outline. Factions: two sides in one factory, one school, one family; each has a backer. The army has had two styles: democratic, with officers and men close; and the other, scolding, aloof, no democracy.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 16, 1967. [[w.macfarquhar-maos-last-revolution]], 217 (in September, on a brief visit, Mao tries to get Zhejiang''s rival groups to unite; his call goes unheeded); [[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 16, 1967; Mao Zedong 毛泽东, on his train stopped at Hangzhou 杭州, in talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (footnote 1: Nan, political commissar of the 20th Army and head of Zhejiang''s military control committee; Chen, political commissar of the Air Force''s 5th Army and deputy head), mentions that Deng Xiaoping 邓小平 and Liu Shaoqi 刘少奇 still differ). Made public: 2013. Check: the book (217) gives no day for Mao''s call to Zhejiang''s factions and names no source for it. Names: Mao Zedong, Nan Ping, Chen Liyun, Yang Chengwu, Zhang Chunqiao, Yu Lijin, Wang Dongxing.'
