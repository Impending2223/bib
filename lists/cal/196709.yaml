    c: 'Bunker''s weekly telegram to Johnson, on the elections: "the successful end of one process and the beginning of another important one"; Diệm officially 89.9 percent in 1961, "we can see how far the government of Vietnam has come in conducting a generally fair election"; "there are still plenty of potholes ahead."'
    n: '[[w.berman-lyndon-johnsons-war]], 77, 80. To check: Bunker to Johnson, Sept. 5, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 80 n.4). See [[cal.1967-09-03.vietnam]]. Names: Bunker, Johnson, Ngô Đình Diệm.'
