    c: 'South Vietnam elects a President, a Vice President and a Senate under the constitution of Apr. 1. Thiệu and Kỳ, 1,638,902 votes, 34.8 percent; Trương Đình Dzu, 17.2; Phan Khắc Sửu, 10.8; Trần Văn Hương, 10. Thiệu and Kỳ ahead in the countryside, the others in the large cities. Some 83 percent of the 5.85 million registered vote (Check). Two dozen American observers sent by Johnson, Governors, Senators, labor and business leaders, journalists, Hickenlooper among them; with Johnson Sept. 6. His letter to Thiệu, Sept. 8: "a milestone along the path."'
    n: 'FRUS 1964–68, V, docs. [303](https://history.state.gov/historicaldocuments/frus1964-68v05/d303) (the returns, the observers, the letter), [305](https://history.state.gov/historicaldocuments/frus1964-68v05/d305). Bunker''s report, Sept. 6: [[w.bunker-papers]], 147–159. Turnout: [[w.elections-in-asia-and]], II (Check). [[w.gibbons-u-s-government-and]], IV, 765, 772–74 (the returns, 35 percent, Dzu 17.2, Hương 10; not Sửu, the cities or the turnout; the observers, twenty-two, and their meeting with Johnson, Sept. 6); [[w.woods-j-william-fulbright-vietnam]], 158 (Thiệu and Kỳ "barely thirty-five percent"; Dzu''s showing, and his arrest after); [[w.berman-lyndon-johnsons-war]], 79–80 (Thiệu and Kỳ, 35 percent; Dzu second, over 800,000, for negotiations; Hương ahead in Saigon; the provinces delivered, "Chicago politics, but with circumspection"; 22 observers); [[w.dallek-flawed-giant]], 478–79 (the election of Sept. 3: Kỳ accepts the vice presidency; twenty-two American observers sent by Johnson report it "clean"; "Fifty-six percent of the electorate went to the polls," of the electorate, not of the registered voters of G; Patterson, an observer, says the Saigon government "had barred several popular candidates"; not the returns or the day of the meeting with Johnson). [[w.westmoreland-soldier-reports]], 219–20 (the Military Council''s choice of the Thiệu–Kỳ ticket, the last three days of June; the vote, 83 percent of close to six million registered; Thiệu and Kỳ 34.8 percent, Dzu 17; twenty Americans to observe, Westmoreland''s guests Governor Richard Hughes and Senator George Murphy). To check: the memorandum of the meeting of Sept. 6, Meetings Notes File, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 774 n.30). See [[cal.1967-06-28.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Trương Đình Dzu, Phan Khắc Sửu, Trần Văn Hương, Hickenlooper, Johnson.'
