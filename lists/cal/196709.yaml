    date: '1967-09-19'
    thread: china-leadership
    c: 'Evening, East Lake guesthouse. Mao to Yang Chengwu, Zhang Chunqiao, Yu Lijin and Wang Dongxing: to free a lot of cadres and use some boldly; most are good. On the Ninth Congress: to be held, he hopes, next autumn, or at the latest in Jan. 1969; the Central Committee is to be enlarged with "fresh blood," and so are the delegates. On Liu Shaoqi and Deng Xiaoping: there should be a difference; Deng fought; might he stay a member, and do they agree? He Long, he thinks, should perhaps be elected, "the head of the Second Front Army." Party organs and government organs should be cut down and slim; whether to call a National People''s Congress, and when; whether the revolutionary committee and the Party organ should be one body or two: think it over.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1967. [[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 19, 1967; evening, 晚; at Wuchang Mao tells Yang Chengwu, Zhang Chunqiao, Wang Dongxing and Yu Lijin 余立金 (footnote: then political commissar of the Air Force) of the convening of the Ninth Congress and says of choosing Central Committee members: of Liu Shaoqi and Deng Xiaoping there should be a difference; Deng fought). Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Yu Lijin, Wang Dongxing, Liu Shaoqi, Deng Xiaoping, He Long.'
