  - id: cal.1967-09-08.elections-1968
    when: Sept. 8
    date: '1967-09-08'
    thread: elections-1968
    c: 'The LBJ Ranch, eight hours: Johnson with Connally, Pickle and Mrs. Johnson on running again. Connally doubts he can be reelected; Johnson: out of the race, free to make peace; Pickle fears for the party''s seats in Congress; Mrs. Johnson, for his health. A decision not to run, tentative.'
    n: '[[w.dallek-flawed-giant]], 523–24 (from Mrs. Johnson''s diary and Pickle''s account; not the decision). To check: [[w.johnson-white-house-diary]]; Temple''s oral history, Aug. 15, 1970, LBJ Library (cited by [[w.dallek-flawed-giant]], 524). Names: Johnson, Connally, Pickle, Lady Bird Johnson.'
