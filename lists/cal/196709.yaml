    when: Sept. 2–4
    date: '1967-09-02'
    thread: war-opposition
    also: [king, black-nationalism]
    c: 'Chicago, the Palmer House. The National Conference for New Politics: about 3,000 from some 370 organizations, SANE, Negotiations Now! and Citizens for Kennedy among them; King the keynote speaker. By the FBI''s informants, support for a ticket of King and Spock.'
    n: '[[w.palermo-in-his-own-right]], 71. To check: [[w.garrow-bearing-the-cross]], 577 (cited by [[w.palermo-in-his-own-right]], 71 n.69); [[w.debenedetti-american-ordeal]], 191–93 (cited by [[w.palermo-in-his-own-right]], 71 n.66). Names: King, Spock. Check: the days (Palermo, 71: "the Labor Day weekend"; Labor Day Sept. 4).'
    src:
      c: 2d9a7334
      rows:
        - 'w.palermo-in-his-own-right 71: all'
    tags: [name:king-martin-luther-jr, name:spock-benjamin, city:chicago, state:il]
