    c: 'Tuesday lunch, 1:25 to 3:10 p.m., Johnson with Rusk, McNamara, Rostow, Christian, Harold Johnson and Jim Jones, on Hanoi''s rejection of Sept. 11. Is Kissinger "a dove and a critic of our policy"? Rusk: he "is for us." Johnson: "why shouldn''t we quit explaining so much and just say we will stop bombing, if a conference is arranged"? The words in question dropped; the channel kept. Of Mansfield''s plan for the UN, Rusk: "a nose count at the UN indicated that it just won''t work." Harold Johnson to have the Chiefs "search for imaginative ideas" to end the war, not more men or the atom bomb.'
    n: 'Jones''s notes, [FRUS 1964–68, V, doc. 317](https://history.state.gov/historicaldocuments/frus1964-68v05/d317). [[w.gibbons-u-s-government-and]], IV, 780–81, 917, 925; [[w.herring-lbj-and-vietnam]], 58, 116 (the acting chairman to "search for imaginative ideas," not more men or nuclear weapons; Kissinger a dove?); [[w.mcnamara-in-retrospect]], ch. 10 at n.30 (Johnson: why not stop the bombing if it led to prompt and productive discussions; Rusk: "Are we prepared to go through with a series of talks that may not be productive?"). Made public: FRUS 1964–68, V (2002). [[w.mann-grand-delusion]], 555 (the order); [[w.berman-lyndon-johnsons-war]], 78 ("search for imaginative ideas to put pressure to bring this war to a conclusion"; not more men, not "the Atom bomb"); [[w.gibbons-u-s-government-and]], IV, 925 (Johnson asks Harold Johnson to have the Joint Chiefs "search for imaginative ideas to put pressure to bring this war to a conclusion," not more men or "the atom bomb"); [[w.drea-mcnamara-clifford-and-the-2011]], 173 (Johnson tells Harold K. Johnson, the acting chairman, to bring imaginative new ideas to end the war); [[w.dallek-flawed-giant]], 480 (Sept. 12 Tuesday lunch, Kissinger''s advice to treat the message as a first step; Johnson: "Why shouldn''t we quit explaining so much . . . and just say we will stop bombing, if a conference is arranged"; not the hours, the attendees or the other units). See [[cal.1967-09-08.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Harold K. Johnson, Jim Jones, Kissinger, Mansfield.'
