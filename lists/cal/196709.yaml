        - 'w.woods-j-william-fulbright-vietnam 158: B-C'
        - 'w.berman-lyndon-johnsons-war 79–80: F, H'
        - 'via x.1967-09-04.braestrup-chicago-politics-benefited-thieu: F'
        - 'via x.1967-09-06.notes-of-meeting-with-vietnam-election-observers: H'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:truong-dinh-dzu, name:phan-khac-suu, name:tran-van-huong, name:hickenlooper-bourke-b, name:johnson-lyndon-b]
    short: Thiệu and Kỳ elected
  - id: cal.1967-09-03.opinion
    when: Sept. 3
    date: '1967-09-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 24–29: have heard of the South Vietnamese elections, 73 percent. Of them: the elections a true expression of the people''s wishes, will be 25, will not 54. A stable government possible whoever wins 26, not possible 56. Better a military man at the head of the government 37, a civilian 40. The campaign fairly conducted: yes 26, no 34, don''t know 40.'
    n: '[[w.gallup-poll]], III, 2078.'
  - id: cal.1967-09-04.elections-1968
    when: Sept. 4
    date: '1967-09-04'
    thread: elections-1968
    also: [vietnam]
    c: 'Romney, in a Detroit television interview taped Aug. 31 and broadcast Sept. 4: on his return from Vietnam in 1965 he had had "the greatest brainwashing that anybody can get," from the generals and the diplomats. He no longer believes it was necessary for the United States to go into South Vietnam to stop Communist aggression in Southeast Asia.'
    n: 'Lou Gordon''s program, WKBD-TV, Detroit. [[w.white-making-of-the-president-1969]], 58–60; [[w.johns-vietnams-second-front]], 163–64; [[w.califano-triumph-and-tragedy-of]], 222–23 (Roche for both barrels; Bailey to demand an apology for Westmoreland and Lodge; Hoff, Sanders, Burns and Bellmon lined up; Johnson reads their statements aloud at the Ranch, Sept. 7–8); [[w.smith-on-his-own-terms]], 497 (to a Detroit radio host, at the end of August: "the greatest brainwashing that anybody can get"; that day Kissinger leaves Romney''s staff, by Seidman''s account). [[w.kabaservice-rule-and-ruin]], 220–21 (Lou Gordon''s *Hot Seat*; the words, "the greatest brainwashing that anyone can get"; his changed mind). Check: Kabaservice, 220, puts the interview two days after the *Detroit Free Press*''s editorial of Aug. 28. Check: Smith, 497, has a Detroit radio host. To check: [[w.johns-achilles-heel]]; [[w.witcover-resurrection-of-richard-nixon]]; Romney, interview on WKBD, Aug. 31, 1967, Gubernatorial Series, box 245, Romney Papers (cited by [[w.johns-vietnams-second-front]], 163 n.17); "Republicans: The Brainwashed Candidate," *Time*, Sept. 15, 1967 (cited by [[w.kabaservice-rule-and-ruin]], 221 n.126). Names: Romney.'
    src:
      c: 0f21a89e
      rows:
        - 'w.white-making-of-the-president-1969 58–60: all'
        - 'w.johns-vietnams-second-front 163–64: all'
        - 'via w.johns-vietnams-second-front 163 n.17: all'
        - 'w.kabaservice-rule-and-ruin 220–21: A-B'
        - 'via w.kabaservice-rule-and-ruin 221 n.126: A-B'
