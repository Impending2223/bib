  - id: cal.1967-09.china-leadership-6
    when: Sept.
    date: 1967-09
    thread: china-leadership
    also: [china]
    c: 'The Zhongnanhai ''rebels'' and the Central Committee''s 中央 General Office send people to Deng Xiaoping''s 邓小平 home with an announcement: Deng''s children are to return to school at once, his stepmother Xia Bogen 夏伯根 to her old home at once; only the cook and the orderly stay. After the children protest, the children and the stepmother are put in two rooms in Fanghu Lane 方壶斋胡同 outside Xuanwumen. Deng and Zhuo Lin are cut off from the outside entirely.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1940 (Sept. 1967). The nianpu gives the month only, after its Sept. 24 item. Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
