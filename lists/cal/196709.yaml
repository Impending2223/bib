  - id: cal.1967-09-20.china-leadership
    when: Sept. 20
    date: '1967-09-20'
    thread: china-leadership
    c: 'Evening, East Lake guesthouse. Mao to Zeng Siyu, Liu Feng, Fang Ming and Zhang Chunqing: on the "Million Heroes," Wang Li and others hurried to the masses to take sides before the troops were told and made ready, took a wrong tilt and stirred a wasps'' nest; do not squeeze the "Million Heroes" so hard, most of them are good; do not squeeze the independent division, its men were taken in; always leave a way out for those who erred, Chen Zaidao too. No one has authorized the "jet plane," the placards, the tall hats; the Red Guards even quote his *Hunan Report* but that was meant for local tyrants. To train army cadres: nothing for eighteen years, my fault as Military Commission chairman.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 20, 1967. [[w.deng-xiaoping-nianpu-1904]], III, 1940 (Sept. 20, 1967; evening, 晚; at Wuchang Mao tells Zeng Siyu, Liu Feng, Fang Ming and Zhang Chunqing of the choosing of Central Committee members at the Ninth Congress: Deng Xiaoping may be protected, for three reasons, he fought battles, he is not a Kuomintang man, he has no ''black cultivation'' (footnote 2: Liu Shaoqi''s *On the Self-Cultivation of a Communist*); can he be elected to the Central Committee, discuss it; he is a ''model soldier''). Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Fang Ming, Zhang Chunqing, Chen Zaidao, Wang Li.'
    tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - id: cal.1967-09-20.china-leadership-2
    when: Sept. 20
    date: '1967-09-20'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai speaks at the mobilization meeting for the National Day preparations. Peking students linking up elsewhere are to return soon and correct the wrong estimates of "seizing power by arms" and the "third great linking up"; they are to drop beating, kidnapping, house-searching, seizing men, private courts, seizing archives, tapping telephones and private radio stations, make a good great alliance and meet National Day. The army made errors in supporting the Left because it long had no mass work and no experience, with too little understanding and so not effective or earnest: a question of understanding.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 186 (Sept. 20, 1967). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
