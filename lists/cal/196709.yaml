    when: Sept. 27
    date: '1967-09-27'
    thread: economy-surcharge
    also: [congress]
    c: The House sends a continuing resolution back to committee, [202–182](https://voteview.com/rollcall/RH0900145).
    n: 'Check: the Record''s page. See [[cal.1967-08-03.economy]].'
  - id: cal.1967-09-27.opinion
    when: Sept. 27
    date: '1967-09-27'
    thread: opinion
    c: 'Gallup, Aug. 24–29: in politics, Republican 27 percent, Democrat 42, independent 31. Non-whites: 10, 68 and 22. South: 17, 52 and 31.'
    n: '[[w.gallup-poll]], III, 2081–83.'
  - id: cal.1967-09-28.states-and-cities
    when: Sept. 28
    date: '1967-09-28'
    thread: states-and-cities
    c: 'Walter Washington sworn Commissioner of the District in the East Room; Johnson: "Washington''s first mayor."'
    n: 'Remarks at the Swearing In of Walter E. Washington and Thomas W. Fletcher, [1967 Pub. Papers 868](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=260) (Sept. 28, 1967). See [[cal.1967-09-06.states-and-cities]]. Names: Walter Washington, Johnson.'
    tags: [name:washington-walter-e, name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-09-28.states-and-cities-nyc
    when: Sept. 28
    date: '1967-09-28'
    thread: states-and-cities
    also: [labor-disputes]
    c: New York City. The teachers' strike settled (Check the day). Under the Taylor Law the union fined and Shanker sentenced to fifteen days, served in December.
    n: 'Check: the settlement''s terms. See [[cal.1967-09-11.states-and-cities-nyc]]. Names: Shanker.'
    tags: [state:ny, city:nyc, name:shanker-albert]
  - id: cal.1967-09-29.vietnam
    when: Sept. 29
    date: '1967-09-29'
    thread: vietnam
    c: 'San Antonio, to the National Legislative Conference: "The United States is willing to stop all aerial and naval bombardment of North Vietnam when this will lead promptly to productive discussions. We, of course, assume that while discussions proceed, North Vietnam would not take advantage of the bombing cessation or limitation." The terms already put to Hanoi in private, through Pennsylvania. "Why not negotiate now?" *Nhân Dân*, Oct. 3: refused.'
    n: 'Address on Vietnam Before the National Legislative Conference, San Antonio, Texas, [1967 Pub. Papers 876](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=268) (Sept. 29, 1967). FRUS 1964–68, V, doc. [340](https://history.state.gov/historicaldocuments/frus1964-68v05/d340). [[w.herring-lbj-and-vietnam]]; [[w.herring-secret-diplomacy-of-the]]; [[w.gibbons-u-s-government-and]], IV; [[w.johnson-vantage-point]]; [[w.dallek-flawed-giant]]; [[w.drea-mcnamara-clifford-and-the-2011]], 219; [[w.cosmas-joint-chiefs-of-staff]], 117. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-09-29.defense
    when: Sept. 29–30
    date: '1967-09-29'
    thread: defense
    c: 'The defense appropriation signed, Sept. 29, [81 Stat. 231](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg231-2.pdf): nearly $70 billion, $1.6 billion under the January budget. Johnson''s statement, Sept. 30: the cut "might well create an unavoidable requirement for additional defense funds"; the bar endangers an agreement with Britain on seven minesweepers.'
    n: 'Statement by the President Upon Signing the Department of Defense Appropriation Act, 1968, [1967 Pub. Papers 881](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=273) (Sept. 30, 1967). Statute (K–J Cong. II.J.2). See [[cal.1967-09-12.defense]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-09-30.vietnam-pennsylvania
    when: Sept. 30
    date: '1967-09-30'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. The day after San Antonio: Bộ''s government will not let him meet Kissinger.'
    n: 'FRUS 1964–68, V, docs. [334](https://history.state.gov/historicaldocuments/frus1964-68v05/d334), [337](https://history.state.gov/historicaldocuments/frus1964-68v05/d337), [340](https://history.state.gov/historicaldocuments/frus1964-68v05/d340). See [[cal.1967-09-08.vietnam]]. Names: Mai Văn Bộ, Kissinger.'
    tags: [name:mai-van-bo, name:kissinger-henry-a]
