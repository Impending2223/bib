    c: 'Zhou Enlai, on Mu Xin being secretly seized by rebels of the Central Drama Institute, writes Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi and others: Xie to investigate; after the facts are known it must be declared that such abductions after the June 6 general order are in no way allowed, and a public admission of error written, and if they refuse it will be announced across the country.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181–182 (Sept. 2, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Mu Xin, Chen Boda, Kang Sheng, Jiang Qing, Xie Fuzhi.'
