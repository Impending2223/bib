    c: 'Hatfield to Ford: the war "inevitably a major issue" in 1968; the party''s spokesmen to "sponsor the general concept of de-Americanization of the war" and so end the "divisive and pointless debate" between hawks and doves.'
    n: '[[w.johns-vietnams-second-front]], 172. To check: Hatfield to Ford, Sept. 8, 1967, Robert T. Hartmann Papers, box 103, Ford Library (cited by [[w.johns-vietnams-second-front]], 172 n.53). Reply: [[cal.1967-09-29.vietnam-congress]]. Names: Hatfield, Ford.'
    src:
