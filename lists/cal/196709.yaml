# Cal. XCV September 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCV
entries:
  - id: cal.1967-09.vietnam
    when: Sept.
    date: 1967-09
    thread: vietnam-operations
    c: 'Côn Thiên. The Marines'' combat base two miles below the DMZ under North Vietnamese artillery, rocket and mortar fire from north of the zone, and attacks across the Bến Hải, through the first three and a half weeks of the month: at least 200 rounds a day; some 1,200 on Sept. 25; over 3,000 Sept. 19–27. Answered by Marine and Navy guns and over 5,200 Marine and Air Force sorties. Check the figures.'
    n: FRUS 1964–68, V, doc. [358](https://history.state.gov/historicaldocuments/frus1964-68v05/d358) (State to Kissinger, Oct. 19). [[w.telfer-u-s-marines-in]]; [[w.coan-con-thien]]; [[w.long-hill-of-angels]].
    tags: [place:con-thien, place:dmz]
  - id: cal.1967-09-01.vietnam
    when: Sept. 1
    date: '1967-09-01'
    thread: vietnam-air-war
    also: [defense]
    c: 'News conference. The bombing of the North: of some 350 principal targets on the Joint Chiefs'' list that Johnson has considered, about 300 authorized, on all of which the civilians and the military agreed; the 50 left, in the port of Haiphong, Hanoi and the buffer zone, not yet decided. Between the Chiefs, the Secretary of Defense, the Secretary of State and the President, "no deep division." The Stennis subcommittee''s report of Aug. 31: "I don''t want to get in an argument with the Senate committee."'
    n: 'The President''s News Conference, [1967 Pub. Papers 816](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=208) (Sept. 1, 1967). FRUS 1964–68, V, doc. [305](https://history.state.gov/historicaldocuments/frus1964-68v05/d305) (the targets, Sept. 5). See [[cal.1967-08-09.vietnam]]. Names: Johnson, Stennis.'
    tags: [name:johnson-lyndon-b, name:stennis-john-c]
  - id: cal.1967-09-01.middle-east
    when: Sept. 1
    date: '1967-09-01'
    thread: middle-east-six-day-war-aftermath
    c: 'Khartoum. The Arab heads of state end their summit, begun Aug. 29. Resolution 3: their political efforts united "to eliminate the effects of the aggression" and to ensure the withdrawal of Israel''s forces from the lands occupied since June 5, within "no peace with Israel, no recognition of Israel, no negotiations with it, and insistence on the rights of the Palestinian people in their own country." Oil pumping to resume, its revenue to help the States that lost resources in the war.'
    n: FRUS 1964–68, XIX, doc. [434](https://history.state.gov/historicaldocuments/frus1964-68v19/d434) (State to Bergus, Sept. 8; Resolution 3). [[w.quandt-peace-process]]; [[w.oren-six-days-of-war]]. See [[cal.1967-06-05.middle-east]].
  - id: cal.1967-09-02.health-ca
    when: Sept. 2
    date: '1967-09-02'
    thread: health
    c: 'Reagan signs the Lanterman-Petris-Short Act, [Cal. Stats. 1967, ch. 1667](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol3_Chapters.pdf#page=185), rewriting the State''s law of mental health services and involuntary commitment: holds for evaluation and short treatment in place of indefinite commitment; conservatorship for the gravely disabled. In force July 1, 1969 (Check).'
    n: 'Statute, 4053. [[w.grob-from-asylum-to-community]]; [[w.grob-dilemma-of-federal-mental]]; [[w.cannon-governor-reagan]]. Names: Reagan. Check: the periods of the holds.'
    tags: [state:ca, name:reagan-ronald]
  - id: cal.1967-09-02.oil
    when: Sept. 2
    date: '1967-09-02'
    thread: oil
    c: 'Faisal, back from Khartoum: Saudi Arabia to resume oil shipments to all countries "without exception." Libya''s embargo unofficially lifted the same day.'
    n: 'FRUS 1964–68, XXXIV, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v34/d263) (editorial note; Jidda telegram 874). See [[cal.1967-06-06.oil]]; [[cal.1967-09-01.middle-east]]. Names: Faisal.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud]
  - id: cal.1967-09-03.vietnam
    when: Sept. 3
    date: '1967-09-03'
    thread: vietnam-elections
    c: 'South Vietnam elects a President, a Vice President and a Senate under the constitution of Apr. 1. Thiệu and Kỳ, 1,638,902 votes, 34.8 percent; Trương Đình Dzu, 17.2; Phan Khắc Sửu, 10.8; Trần Văn Hương, 10. Thiệu and Kỳ ahead in the countryside, the others in the large cities. Some 83 percent of the 5.85 million registered vote (Check). Two dozen American observers sent by Johnson, Governors, Senators, labor and business leaders, journalists, Hickenlooper among them; with Johnson Sept. 6. His letter to Thiệu, Sept. 8: "a milestone along the path."'
    n: 'FRUS 1964–68, V, docs. [303](https://history.state.gov/historicaldocuments/frus1964-68v05/d303) (the returns, the observers, the letter), [305](https://history.state.gov/historicaldocuments/frus1964-68v05/d305). Bunker''s report, Sept. 6: [[w.bunker-papers]], 147–159. Turnout: [[w.elections-in-asia-and]], II (Check). See [[cal.1967-06-28.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Trương Đình Dzu, Phan Khắc Sửu, Trần Văn Hương, Hickenlooper, Johnson.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:truong-dinh-dzu, name:phan-khac-suu, name:tran-van-huong, name:hickenlooper-bourke-b, name:johnson-lyndon-b]
  - id: cal.1967-09-03.opinion
    when: Sept. 3
    date: '1967-09-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 24–29: have heard of the South Vietnamese elections, 73 percent. Of them: the elections a true expression of the people''s wishes, will be 25, will not 54. A stable government possible whoever wins 26, not possible 56. Better a military man at the head of the government 37, a civilian 40. The campaign fairly conducted: yes 26, no 34, don''t know 40.'
    n: '[[w.gallup-poll]], III, 2078.'
  - id: cal.1967-09-04.elections-1968
    when: Sept. 4
    date: '1967-09-04'
    thread: elections-1968
    also: [vietnam]
    c: 'Romney, in a Detroit television interview taped Aug. 31 and broadcast Sept. 4: on his return from Vietnam in 1965 he had had "the greatest brainwashing that anybody can get," from the generals and the diplomats. He no longer believes it was necessary for the United States to go into South Vietnam to stop Communist aggression in Southeast Asia.'
    n: 'Lou Gordon''s program, WKBD-TV, Detroit. [[w.johns-achilles-heel]]; [[w.white-making-of-the-president-1969]], 58–60; [[w.witcover-resurrection-of-richard-nixon]]; [[w.johns-vietnams-second-front]]; [[w.kabaservice-rule-and-ruin]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi, city:detroit]
  - id: cal.1967-09-04.vietnam-operations
    when: Sept. 4
    date: '1967-09-04'
    thread: vietnam-operations
    c: Swift, in the Quế Sơn basin, out of a sweep to screen the polling places on election day. Before dawn, 4:30 a.m., the 2d North Vietnamese Division strikes Company D of the 5th Marines; the battalions of the 5th Marines committed. To Sept. 15.
    n: '[[w.telfer-u-s-marines-in]], 111–119.'
    tags: [province:quang-nam, province:quang-tin]
  - id: cal.1967-09-06.states-and-cities
    when: Sept. 6
    date: '1967-09-06'
    thread: states-and-cities
    c: Washington. Johnson names Walter E. Washington, chairman of the New York City Housing Authority, Commissioner of the District of Columbia, the single Commissioner of Reorganization Plan No. 3 of 1967, which put him and a council of nine, all appointed by the President, in place of the three Commissioners.
    n: 'Statement by the President on His Intention To Nominate Walter E. Washington and Thomas W. Fletcher as Commissioner and Assistant to the Commissioner, [1967 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=218) (Sept. 6, 1967). See [[cal.1967-08-09.states-and-cities]]. Names: Walter Washington, Johnson.'
    tags: [name:washington-walter-e, name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-09-07.vietnam
    when: Sept. 7
    date: '1967-09-07'
    thread: vietnam
    also: [defense]
    c: McNamara, at a news conference, announces an anti-infiltration system below the DMZ.
    n: '[[w.drea-mcnamara-clifford-and-the-2011]]; [[w.gibbons-u-s-government-and]], IV; [[w.prados-blood-road]]; [[w.shapley-promise-and-power]]. See [[cal.1966-10-10.vietnam]]. Check: the transcript. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-09-09.vietnam-order-of-battle
    when: Sept. 9
    date: '1967-09-09'
    thread: vietnam-order-of-battle
    c: 'The order-of-battle conference in Saigon. MACV''s intelligence staff briefs Carver''s delegation from the CIA, DIA and INR on its revised count: main and local forces 119,000, administrative services 29,000, guerrillas 65,000, political cadre 85,000; 298,000 in all. No figure for the self-defense militia. The draft national estimate: 121,000; 40,000–60,000; 60,000–100,000; 90,000; others 120,000.'
    n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314) (Carver to Helms, Sept. 11). [[w.adams-vietnam-cover-up]]; [[w.adler-reckless-disregard]]; [[w.wirtz-intelligence-to-please]]; [[w.wirtz-tet-offensive]]; [[w.adams-war-of-numbers]]; [[w.ford-cia-and-the-vietnam]]; [[w.allen-none-so-blind]]; [[w.hiam-who-the-hell-are]]; [[w.thayer-systems-analysis-view]], II, 7–10; [[w.vietnam-victory-in-vietnam]], 191–92, 211, 464 n.14 (Hanoi''s own count of its full-time forces in the South: 219,640 in 1966, 192; 204,000 at the end of 1966 and 278,000 at the end of 1967, 211). Made public: the dispute, [[w.adams-vietnam-cover-up]]; the cables, FRUS 1964–68, V (2002). Names: Carver.'
    tags: [name:carver-george-a-jr, place:saigon]
  - id: cal.1967-09-10.opinion
    when: Sept. 10
    date: '1967-09-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 24–29: Romney 45 percent, Johnson 41, Wallace as an independent 10, undecided 4. South: Johnson 39, Romney 29, Wallace 28.'
    n: '[[w.gallup-poll]], III, 2079. Names: Romney, Johnson, Wallace.'
    tags: [name:romney-george-w, name:johnson-lyndon-b, name:wallace-george-c]
  - id: cal.1967-09-10.vietnam-order-of-battle
    when: Sept. 10
    date: '1967-09-10'
    thread: vietnam-order-of-battle
    c: Second day in Saigon, the evidence on administrative services and guerrillas. Adams and Hyland present the draft estimate's case; Davidson rejects it. The draft counts 17,000 administrative services at district level, from documents covering 14 districts; MACV accepts 5,000, from three.
    n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Adams, Hyland, Davidson.'
    tags: [name:adams-samuel-a, name:hyland-william-g, name:davidson-phillip-b-jr, place:saigon]
  - id: cal.1967-09-08.vietnam
    when: Sept. 11
    date: '1967-09-11'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Hanoi''s ten-mile circle unbombed since late August. Paris: Mai Văn Bộ hands Marcovich Hanoi''s answer to the message of Aug. 25: the bombing illegal; the message, sent while Hanoi was threatened, an ultimatum; rejected.'
    n: 'FRUS 1964–68, V, docs. [308](https://history.state.gov/historicaldocuments/frus1964-68v05/d308), [315](https://history.state.gov/historicaldocuments/frus1964-68v05/d315). Made public: the Pentagon Papers'' negotiating volumes, [[w.herring-secret-diplomacy-of-the]]; FRUS 1964–68, V (2002). See [[cal.1967-08-17.vietnam]]. Names: Mai Văn Bộ, Marcovich.'
    tags: [name:mai-van-bo, name:marcovich-hebert]
  - id: cal.1967-09-11.vietnam
    when: Sept. 11
    date: '1967-09-11'
    thread: vietnam
    also: [defense]
    c: 'McNamara to Johnson, who had been surprised by the announcement of Sept. 7: press inquiries had forced a statement. Not a wall: an obstacle line across part of South Vietnam just south of the zone, six strongpoints in its first segment, and an air-supported interdiction effort, mostly in Laos.'
    n: 'FRUS 1964–68, V, doc. [313](https://history.state.gov/historicaldocuments/frus1964-68v05/d313). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-07.vietnam]]. Names: McNamara, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1967-09-11.states-and-cities-nyc
    when: Sept. 11
    date: '1967-09-11'
    thread: states-and-cities
    also: [labor-disputes]
    c: 'New York City. The United Federation of Teachers strikes the schools as they open, Shanker its president: pay, the size of classes, the removal of disruptive pupils (Check the day).'
    n: '[Tamiment Library, United Federation of Teachers records](https://findingaids.library.nyu.edu/tamwag/wag_022). [[w.kahlenberg-tough-liberal]]; [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]. See [[cal.1967-04-21.jobs-and-wages-ny]]. Names: Shanker.'
    tags: [state:ny, city:nyc, name:shanker-albert]
  - id: cal.1967-09-11.vietnam-order-of-battle
    when: Sept. 11
    date: '1967-09-11'
    thread: vietnam-order-of-battle
    c: 'Carver to Helms: the mission stalled. In his reading Westmoreland, with Komer''s encouragement, has in effect ordered that the enemy''s total not exceed 300,000.'
    n: 'FRUS 1964–68, V, doc. [314](https://history.state.gov/historicaldocuments/frus1964-68v05/d314), 0203Z. Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Carver, Helms, Westmoreland, Komer.'
    tags: [name:carver-george-a-jr, name:helms-richard, name:westmoreland-william, name:komer-robert-w]
  - id: cal.1967-09-12.congress
    when: Sept. 12
    date: '1967-09-12'
    thread: congress
    c: 'Senate passes the Election Reform Act, S. 1880, [87–0](https://voteview.com/rollcall/RS0900183): full disclosure of contributions to and spending by candidates for federal office and their committees; the limits on their spending removed, the limits on individual contributions kept; no member of a candidate''s family to give more than $5,000, [79–7](https://voteview.com/rollcall/RS0900182). Disclosure of candidates'' assets and liabilities refused, [42–46](https://voteview.com/rollcall/RS0900180); the Comptroller General to administer the act, refused, [30–56](https://voteview.com/rollcall/RS0900181).'
    n: '[113 Cong. Rec., Senate, Sept. 12, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-2-1.pdf). [[w.alexander-financing-the-1968-election]].'
  - id: cal.1967-09-12.defense
    when: Sept. 12
    date: '1967-09-12'
    thread: defense
    also: [vietnam]
    c: Department of Defense Appropriation Act, 1968. The House adopts the conference report, [366–4](https://voteview.com/rollcall/RH0900126), keeping its bar on building naval vessels in foreign yards, [145–232](https://voteview.com/rollcall/RH0900127) against receding.
    n: '[113 Cong. Rec., House, Sept. 12, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-2-2.pdf). [[w.drea-mcnamara-clifford-and-the-2011]].'
  - id: cal.1967-09-12.state-constitutions-md
    when: Sept. 12
    date: '1967-09-12'
    thread: state-constitutions
    c: 'Maryland''s constitutional convention opens at Annapolis: 142 delegates, elected June 13. Eney, chairman of the Constitutional Convention Commission, president. It sits until Jan. 10, 1968.'
    n: '[Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). Check: the convention''s *Proceedings* and the returns of June 13. [[w.callcott-maryland-and-america-1940]]. See [[cal.1967-03-24.state-constitutions-md]]. Names: Eney.'
    tags: [state:md, name:eney-h-vernon]
  - id: cal.1967-09-13.defense
    when: Sept. 13
    date: '1967-09-13'
    thread: defense
    c: The Senate adopts the conference report on the defense appropriation, [74–3](https://voteview.com/rollcall/RS0900185), receding on the bar to building naval vessels in foreign yards, [49–29](https://voteview.com/rollcall/RS0900186).
    n: '[113 Cong. Rec., Senate, Sept. 13, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-3-2.pdf). See [[cal.1967-09-12.defense]].'
  - id: cal.1967-09-13.vietnam-pennsylvania
    when: Sept. 13
    date: '1967-09-13'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. A further message through Kissinger: the proposal of Aug. 25 "contained neither conditions nor threats" and "remains open." Bộ will not meet Kissinger while the threat to bomb Hanoi stands; notes pass through Marcovich and Aubrac.'
    n: 'FRUS 1964–68, V, docs. [318](https://history.state.gov/historicaldocuments/frus1964-68v05/d318), [324](https://history.state.gov/historicaldocuments/frus1964-68v05/d324). See [[cal.1967-09-08.vietnam]]. Names: Kissinger, Mai Văn Bộ, Marcovich, Aubrac.'
    tags: [name:kissinger-henry-a, name:mai-van-bo, name:marcovich-hebert, name:aubrac-raymond]
  - id: cal.1967-09-13.vietnam-order-of-battle
    when: Sept. 13
    date: '1967-09-13'
    thread: vietnam-order-of-battle
    c: 'Carver with Westmoreland, Abrams, Komer and Sidle. The analysts then agree, Westmoreland endorsing: main and local forces 119,000; administrative services 35,000–40,000; guerrillas 70,000–90,000; military total 224,000–249,000; political cadre 75,000–85,000. Adams stays in Saigon on the political categories.'
    n: 'FRUS 1964–68, V, doc. [325](https://history.state.gov/historicaldocuments/frus1964-68v05/d325) (Carver to Helms, Sept. 13). Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Carver, Westmoreland, Abrams, Komer, Sidle, Adams.'
    tags: [name:carver-george-a-jr, name:westmoreland-william, name:abrams-creighton, name:komer-robert-w, name:sidle-winant, name:adams-samuel-a, place:saigon]
  - id: cal.1967-09-14.jobs-and-wages
    when: Sept. 14
    date: '1967-09-14'
    thread: jobs-and-wages
    also: [poverty]
    c: 'House passes the Appalachian Regional Development Act Amendments, S. 602, [189–168](https://voteview.com/rollcall/RH0900130); recommittal refused, [178–184](https://voteview.com/rollcall/RH0900129). Its title II, money for the regional commissions on Appalachia''s model under the Public Works and Economic Development Act, struck, [199–161](https://voteview.com/rollcall/RH0900128). The act signed Oct. 11, [81 Stat. 257](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg257.pdf), title II restored: $715 million for the development highways to June 1971; $170 million for the other programs to June 1969; $5 million to each regional commission to June 1968, $10 million for fiscal 1969.'
    n: '[113 Cong. Rec., House, Sept. 14, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-4-2.pdf). [[w.eller-uneven-ground]]. See [[cal.1965-03-09.jobs-and-wages]].'
  - id: cal.1967-09-15.railroads
    when: Sept. 15
    date: '1967-09-15'
    thread: railroads
    c: 'The Special Railroad Board, Morse its chairman, created by the joint resolution of July 17 on the shopcraft unions'' dispute with the railroads, reports to Johnson: its determination, unanimous, to have the effect of an agreement between the parties (Check its terms).'
    n: 'The President''s Remarks at a News Briefing by Members of the Special Railroad Board on Their Final Recommendations, [1967 Pub. Papers 841](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=233) (Sept. 15, 1967); "Report and Determination of the Special Railroad Board Established Pursuant to Public Law 90-54" (Sept. 15, 1967). See [[cal.1967-01-28.railroads]]; [[cal.1967-07-16.jobs-and-wages]]. Names: Morse, Johnson.'
    tags: [name:morse-wayne, name:johnson-lyndon-b]
  - id: cal.1967-09-17.opinion
    when: Sept. 17
    date: '1967-09-17'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 24–29, two releases: Rockefeller 48 percent, Johnson 46, undecided 6. Republicans'' choice for 1968, Romney not listed: Nixon 40, Rockefeller 20, Reagan 15, Percy 12, Lindsay 4, Hatfield 2; no preference 7. Rockefeller on a scale from plus 5 to minus 5: highly favorable 28, mildly favorable 52, mildly unfavorable 10, highly unfavorable 3.'
    n: '[[w.gallup-poll]], III, 2080. Names: Rockefeller, Johnson, Nixon, Reagan, Percy, Lindsay, Hatfield, Romney.'
    tags: [name:rockefeller-nelson, name:johnson-lyndon-b, name:nixon-richard-m, name:reagan-ronald, name:percy-charles-h, name:lindsay-john-v, name:hatfield-mark-o, name:romney-george-w]
  - id: cal.1967-09-18.defense
    when: Sept. 18
    date: '1967-09-18'
    thread: defense-abm
    also: [soviet-union, china]
    c: 'San Francisco. McNamara to United Press International''s editors and publishers: a light ABM system, "Chinese oriented," to be deployed, which would also defend the Minuteman sites, "at a modest cost"; a heavy defense against the Soviet Union refused: the Soviets would answer with more offensive forces. The NATO Council told in confidence Sept. 14. The cost some $5 billion (Check).'
    n: '[Remarks by Secretary of Defense Robert S. McNamara, September 18, 1967](https://doi.org/10.1080/00963402.1967.11455145), Bull. Atomic Scientists, Dec. 1967, at 26. FRUS 1964–68, X, docs. [190](https://history.state.gov/historicaldocuments/frus1964-68v10/d190), [192](https://history.state.gov/historicaldocuments/frus1964-68v10/d192); XI, doc. [210](https://history.state.gov/historicaldocuments/frus1964-68v11/d210). [[w.halperin-decision-to-deploy-the]]; [[w.yanarella-missile-defense-controversy]]; [[w.kaplan-wizards-of-armageddon]]; [[w.shapley-promise-and-power]]; [[w.drea-mcnamara-clifford-and-the-2011]], 368, 386. See [[cal.1966-12-06.defense]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-09-19.cities-and-housing
    when: Sept. 19–21
    date: '1967-09-19'
    thread: cities-and-housing
    c: Senate, the Independent Offices and HUD appropriation, H.R. 9960. Rent supplements, struck by the House, restored at the budget's $40 million, [59–31](https://voteview.com/rollcall/RS0900196), Lausche's $20 million refused, [33–56](https://voteview.com/rollcall/RS0900195); the money for model cities raised, [62–28](https://voteview.com/rollcall/RS0900194); passed, Sept. 21, [77–5](https://voteview.com/rollcall/RS0900200).
    n: '[113 Cong. Rec., Senate, Sept. 20, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-7-2.pdf); [113 Cong. Rec., Senate, Sept. 21, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-1-1.pdf). See [[cal.1966-05-13.cities-and-housing]]; [[cal.1966-10-14.cities-and-housing]]. Names: Lausche.'
    tags: [name:lausche-frank-j]
  - id: cal.1967-09-19.mayors-san-diego
    when: Sept. 19
    date: '1967-09-19'
    thread: mayors
    also: [elections-1967]
    c: San Diego's primary for mayor. Curran, the mayor, 52,355, 47.2 percent; Hitch, once of the City Council, 36,060, 32.5; Clayton 10.2; four others. A runoff.
    n: 'Votes: [City Clerk, *Election History: Mayor*](https://www.sandiego.gov/sites/default/files/legacy/city-clerk/pdf/mayorresults.pdf). See [[cal.1963-11-05.mayors-san-diego]]. Names: Curran, Hitch.'
    tags: [state:ca, city:san-diego, name:curran-frank, name:hitch-allen]
  - id: cal.1967-09-20.opinion
    when: Sept. 20
    date: '1967-09-20'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 24–29: South Vietnam to take on more of the fighting: yes 77 percent, no 11. Republicans and Democrats alike, 77 yes.'
    n: '[[w.gallup-poll]], III, 2080–81.'
  - id: cal.1967-09-21.press-and-broadcasting
    when: Sept. 21
    date: '1967-09-21'
    thread: press-and-broadcasting
    c: 'House passes the Public Broadcasting Act, H.R. 6736, [266–91](https://voteview.com/rollcall/RH0900140): more money for educational stations'' facilities; a Corporation for Public Broadcasting. Recommittal, to strike the Corporation and give $5 million to the existing educational broadcasters, refused, [167–193](https://voteview.com/rollcall/RH0900139).'
    n: '[113 Cong. Rec., House, Sept. 21, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-1-2.pdf). [[w.engelman-public-radio-and-television]].'
  - id: cal.1967-09-24.opinion
    when: Sept. 24
    date: '1967-09-24'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 24–29 and Sept. 14–19, Republicans'' choice before and after Romney''s statement that he had been "brainwashed" on Vietnam: Nixon 35 and 40 percent; Romney 24 and 14; Rockefeller 14 and 17; Reagan 11 and 16; Percy 6 and 9. Sept. 14–19, Republicans, Nixon or Romney: Nixon 66, Romney 31, from 52 and 38. Independents: Nixon 52, Romney 36.'
    n: '[[w.gallup-poll]], III, 2081. Names: Romney, Nixon, Rockefeller, Reagan, Percy.'
    tags: [name:romney-george-w, name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h]
  - id: cal.1967-09-25.states-and-cities
    when: Sept. 25
    date: '1967-09-25'
    thread: states-and-cities
    c: The District of Columbia. The House votes an elected Board of Education for the District, [326–3](https://voteview.com/rollcall/RH0900141).
    n: 'Check: the Record''s page. See [[cal.1967-09-06.states-and-cities]].'
    tags: [state:dc, city:washington]
  - id: cal.1967-09-26.vietnam
    when: Sept. 26
    date: '1967-09-26'
    thread: vietnam
    also: [congress]
    c: 'Senate. Case, citing McNamara''s testimony that bombing the North''s ports would not stop its supplies: the administration''s statements on the war have brought a "crisis of confidence"; the Tonkin Gulf resolution perverted (Check his words). Mansfield and Dirksen answer him. Morton, about the same days: the President misled by the generals and the military-industrial complex; stop the bombing (Johnson''s account to Dirksen, Oct. 4; Check Morton''s words and the date).'
    n: '[113 Cong. Rec., Senate, Sept. 26, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-4-1.pdf). FRUS 1964–68, V, docs. [336](https://history.state.gov/historicaldocuments/frus1964-68v05/d336), [344](https://history.state.gov/historicaldocuments/frus1964-68v05/d344). [[w.gibbons-u-s-government-and]], IV, 824–827; [[w.johns-vietnams-second-front]]. Names: Case, McNamara, Mansfield, Dirksen, Morton, Johnson.'
    tags: [name:case-clifford-p, name:mcnamara-robert-s, name:mansfield-mike, name:dirksen-everett, name:morton-thruston-b, name:johnson-lyndon-b]
  - id: cal.1967-09-26.poverty
    when: Sept. 26
    date: '1967-09-26'
    thread: poverty
    also: [jobs-and-wages]
    c: 'Senate, the Economic Opportunity Amendments, S. 2388. Head Start kept in the OEO, a transfer to HEW refused, [35–54](https://voteview.com/rollcall/RS0900204); the Job Corps kept, [30–49](https://voteview.com/rollcall/RS0900205). Clark''s title II, an emergency employment act, $2.8 billion: Prouty''s cut to $875 million refused, [42–47](https://voteview.com/rollcall/RS0900207) (Check the days).'
    n: 'Check: the Record''s pages. [[w.davies-from-opportunity-to-entitlement]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1966-09-29.poverty]]. Names: Clark, Prouty.'
    tags: [name:clark-joseph-s, name:prouty-winston-l]
  - id: cal.1967-09-26.state-constitutions-ny
    when: Sept. 26
    date: '1967-09-26'
    thread: state-constitutions
    also: [school-aid, welfare]
    c: 'New York''s constitutional convention adjourns. Its constitution to go to the voters as one question, as Travia wanted: the Blaine Amendment''s bar on State aid to church schools taken out; the State to take over the cost of welfare and the courts (Check the terms).'
    n: '[Wikipedia, "1967 New York state election"](https://en.wikipedia.org/wiki/1967_New_York_state_election); [WNYC, "The Convention to End All Conventions?"](https://wnyc.org/story/convention-end-all-conventions). See [[cal.1967-04-04.state-constitutions-ny]]. Names: Travia.'
    tags: [state:ny, name:travia-anthony-j]
  - id: cal.1967-09-26.mayors-boston
    when: Sept. 26
    date: '1967-09-26'
    thread: mayors
    also: [elections-1967]
    c: Boston's preliminary election for mayor, Collins not running. Hicks, of the School Committee, 43,722, 28.2 percent; White, secretary of the Commonwealth, 30,789, 19.8; Sears, a State representative, 23,924, 15.4; Logue, once of the Redevelopment Authority, 23,766, 15.3; six others. Hicks and White to the final.
    n: '[Boston, *Annual Report of the Election Department*, 1967 (City Document No. 10), 46](https://archive.org/details/annualreportofbo1967bost/page/n55/mode/1up). [[w.formisano-boston-against-busing]]; [[w.oconnor-building-a-new-boston]]; [[w.vrabel-peoples-history-of-the]]; [[w.cohen-saving-americas-cities]]. See [[cal.1963-11-05.mayors-boston]]. Names: Collins, Hicks, White, Sears, Logue.'
    tags: [state:ma, city:boston, name:collins-john-f, name:hicks-louise-d, name:white-kevin-h, name:sears-john-w, name:logue-edward-j]
  - id: cal.1967-09-27.farm
    when: Sept. 27
    date: '1967-09-27'
    thread: farm
    also: [poverty]
    c: 'Food stamp extension signed, [81 Stat. 228](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg228-3.pdf): $200 million for fiscal 1968, $225 million for 1969. The House had receded to the Senate''s two years, Sept. 19, [196–155](https://voteview.com/rollcall/RH0900134). Johnson: the program in 838 areas of 41 States, nearly 2 million fed; the Secretary of Agriculture asked to start commodity distribution in the 300 poorest counties with no food program.'
    n: 'Remarks Upon Signing Bill To Extend the Food Stamp Act of 1964, [1967 Pub. Papers 867](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=259) (Sept. 27, 1967). [[w.kotz-let-them-eat-promises]]. See [[cal.1964-08-31.farm]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
