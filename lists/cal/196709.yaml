    c: 'Johnson with McNamara, Katzenbach, Ramsey Clark, Udall and the administrator of General Services on the October march. McNamara: troops enough. Clark: a single command post, at Defense or Justice; Katzenbach: one, "and possibly preliminary steps taken to discourage attendance." Justice to supervise the preparations. Clark, McNamara and Katzenbach: he might be out of Washington that weekend. Fifteen minutes with Johnson on the FBI''s estimate of 40,000 to 50,000 marchers against the Capitol, the White House and the Pentagon; McNamara: troops to ring the Pentagon, marshals between them and the protesters, reserves in the courtyard; he, Wheeler and Christopher to watch from his office and the roof.'
