        - 'w.smith-on-his-own-terms 497: A'
    tags: [name:romney-george-w, state:mi, city:detroit]
    short: Romney's "brainwashing"
  - id: cal.1967-09-04.vietnam-operations
    when: Sept. 4
    date: '1967-09-04'
    thread: vietnam-operations
    c: Swift, in the Quế Sơn basin, out of a sweep to screen the polling places on election day. Before dawn, 4:30 a.m., the 2d North Vietnamese Division strikes Company D of the 5th Marines; the battalions of the 5th Marines committed. To Sept. 15.
    n: '[[w.telfer-u-s-marines-in]], 111–119.'
    tags: [province:quang-nam, province:quang-tin]
    short: Swift
  - id: cal.1967-09-04.vietnam-elections
    when: Sept. 4
    date: '1967-09-04'
    thread: vietnam-elections
    c: 'The American observers of the election, Lodge with them, find it free and fair. Governor Richard Hughes: "These were clean elections"; Edward Elson, "a noble political exercise." Hughes and George Murphy Westmoreland''s house guests.'
    n: '[[w.westmoreland-soldier-reports]], 220–21. Check: the day. See [[cal.1967-09-03.vietnam]]. Names: Lodge, Richard Hughes, George Murphy, Westmoreland.'
    src:
      c: b6ac2422
      rows:
