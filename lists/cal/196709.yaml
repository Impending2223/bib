  - id: cal.1967-09.vietnam
    when: Sept.
    date: 1967-09
    thread: vietnam-operations
    c: 'Côn Thiên. The Marines'' combat base two miles below the DMZ under North Vietnamese artillery, rocket and mortar fire from north of the zone, and attacks across the Bến Hải, through the first three and a half weeks of the month: at least 200 rounds a day; some 1,200 on Sept. 25; over 3,000 Sept. 19–27. Answered by Marine and Navy guns and over 5,200 Marine and Air Force sorties. Check the figures.'
    n: 'FRUS 1964–68, V, doc. [358](https://history.state.gov/historicaldocuments/frus1964-68v05/d358) (State to Kissinger, Oct. 19). [[w.westmoreland-soldier-reports]], 203 (the shelling; the first ground attack, two North Vietnamese battalions, 44 Marines killed); [[w.macv-command-history-1967]], 361 (Côn Thiên, under "the heaviest shelling of the war" in September; Sept. 19–27, 3,077 mortar, artillery and rocket rounds; some 35,000 North Vietnamese troops massed in the area). To check: [[w.telfer-u-s-marines-in]]; [[w.coan-con-thien]]; [[w.long-hill-of-angels]].'
    src:
      c: 5ea921e6
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d358: all'
        - 'w.westmoreland-soldier-reports 203: A'
        - 'w.macv-command-history-1967 361: A-B, D'
    tags: [place:con-thien, place:dmz]
    short: Côn Thiên
  - id: cal.1967-09-01.vietnam
    when: Sept. 1
    date: '1967-09-01'
    thread: vietnam-air-war
    also: [defense]
    c: 'News conference. The bombing of the North: of some 350 principal targets on the Joint Chiefs'' list that Johnson has considered, about 300 authorized, on all of which the civilians and the military agreed; the 50 left, in the port of Haiphong, Hanoi and the buffer zone, not yet decided. Between the Chiefs, the Secretary of Defense, the Secretary of State and the President, "no deep division." The Stennis subcommittee''s report of Aug. 31: "I don''t want to get in an argument with the Senate committee."'
    n: 'The President''s News Conference, [1967 Pub. Papers 816](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=208) (Sept. 1, 1967). FRUS 1964–68, V, doc. [305](https://history.state.gov/historicaldocuments/frus1964-68v05/d305) (the targets, Sept. 5). [[w.herring-lbj-and-vietnam]], 56 (no quarrels in the administration; the 300 of 350 targets, the civilians and the military agreed). See [[cal.1967-08-09.vietnam]]. Names: Johnson, Stennis. Check: Herring has the 300 struck (56); the transcript, authorized.'
    src:
      c: c57bbb90
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=208: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d305: all'
        - 'w.herring-lbj-and-vietnam 56: B, D'
        - 'via w.herring-lbj-and-vietnam 56 n.122: B, D'
    tags: [name:johnson-lyndon-b, name:stennis-john-c]
    short: the target list at the news conference
  - id: cal.1967-09-01.middle-east
    when: Sept. 1
    date: '1967-09-01'
    thread: middle-east-six-day-war-aftermath
    c: 'Khartoum. The Arab heads of state end their summit, begun Aug. 29. Resolution 3: their political efforts united "to eliminate the effects of the aggression" and to ensure the withdrawal of Israel''s forces from the lands occupied since June 5, within "no peace with Israel, no recognition of Israel, no negotiations with it, and insistence on the rights of the Palestinian people in their own country." Oil pumping to resume, its revenue to help the States that lost resources in the war.'
    n: 'FRUS 1964–68, XIX, doc. [434](https://history.state.gov/historicaldocuments/frus1964-68v19/d434) (State to Bergus, Sept. 8; Resolution 3). To check: [[w.quandt-peace-process]]; [[w.oren-six-days-of-war]]. See [[cal.1967-06-05.middle-east]].'
    short: Khartoum
  - id: cal.1967-09-01.vietnam-2
    when: Sept. 1
    date: '1967-09-01'
    thread: vietnam
