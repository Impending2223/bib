  - id: cal.1967-09-01.china-leadership
    when: Sept. 1
    date: '1967-09-01'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Mao, Lin Biao and Zhou Enlai cable Hồ Chí Minh and others on the DRV''s 22nd anniversary: U.S. imperialism''s defeat in Vietnam is because its war is naked aggression; the Vietnamese have used the people''s war and set a model, after the Second World War, of one country alone fighting and beating the aggression of U.S. imperialism.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 148–149 (Sept. 1, 1967; printed from the *Renmin ribao* of Sept. 2, 1967; addressed to Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng). Names: Mao Zedong, Lin Biao, Zhou Enlai, Hồ Chí Minh.'
    src:
      c: c46cdd7b
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 1, 1967: all'
        - 'w.jianguo-yilai-mao-zedong XIX, 148–149: A-B'
    tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ho-chi-minh, polity:prc, polity:drv]
  - id: cal.1967-09-01.vietnam-hanoi
    when: Sept. 1
    date: '1967-09-01'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 200-TT/TW on a review of Directive no. 149 on food: the spring crop''s grain work and the State''s taking over of distribution to be examined, provinces to report.'
    n: '*Thông tri của Ban Bí thư số 200-TT/TW, ngày 1-9-1967, Về sơ kết việc thực hiện Chỉ thị 149 tăng cường lãnh đạo công tác lương thực*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 394–397. Made public: 2003.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1967-09-01.china-leadership-2
    when: Sept. 1
    date: '1967-09-01'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai, before dawn, receives the Canton delegates in Peking: factionalism has reached its peak and must go no further. Whampoa harbor cannot unload, and each ship loses 500 pounds a day; if this goes on, Whampoa will be put under military control, which may use arms and arrest. That afternoon the two sides, on his instructions, agree to stop the armed fight, hand in arms and back the PLA.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (Sept. 1, 1967). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1967-09-01.china-leadership-5
    when: Sept. 1
    date: '1967-09-01'
    time: 1967-09-01T07:00Z
    thread: china-leadership
    also: [china]
    c: Zhou Enlai, at 3 p.m., receives the Center's investigation team to Canton and tells it to see that the two sides keep their agreement and to take no part in their struggle.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180 (under Sept. 1, 1967). Made public: 2020. See [[cal.1967-09-01.china-leadership-2]]. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1967-09-01.china-leadership-3
    when: Sept. 1
    date: '1967-09-01'
    place: peking
    thread: china-leadership
    c: 'Zhou Enlai tells the enlarged meeting of the Peking Revolutionary Committee that stopping armed fights, and the seizure of the PLA''s arms, is now the main task. Factional struggle has hampered production, transport is at its lowest, foreign ships cannot load. Some dig up things from his past years: help in good faith is welcome, but to use them as a threat for a plot he opposes.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 180–181 (Sept. 1, 1967, the item after). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
  - id: cal.1967-09-01.china-leadership-4
    when: Sept. 1
    date: '1967-09-01'
    thread: china-leadership
    also: [china]
    c: Because Chinese staff abroad, under extreme-Left influence, meddled in Cambodia's internal affairs, Sihanouk dissolves the Cambodia–China Friendship Association. Zhou Enlai criticizes the Chinese staff in Cambodia.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 181 (Sept. 1, 1967, the item after). Made public: 2020. Names: Zhou Enlai, Sihanouk. Check: the day of the dissolution; the chronology gives it after Sept. 1.'
    tags: [name:zhou-enlai, name:norodom-sihanouk, polity:prc, vis:only:prc+cambodia]
  - id: cal.1967-09-01.china
    when: Sept. 1
    date: '1967-09-01'
    thread: china
    also: [south-asia]
    c: 'Foreign Ministry note to the Burmese embassy: from concern for the overseas Chinese and to protect their rights, China decides to send an investigation and condolence mission from the Overseas Chinese Affairs Commission, for the Chinese government and people, carrying relief goods, to Burma in mid-September. It asks the Burmese government for a quick answer and arrangements.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 171 (Sept. 1, 1967).'
    src:
