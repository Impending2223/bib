  - id: cal.1967-09-06.states-and-cities
    when: Sept. 6
    date: '1967-09-06'
    thread: states-and-cities
    c: Washington. Johnson names Walter E. Washington, chairman of the New York City Housing Authority, Commissioner of the District of Columbia, the single Commissioner of Reorganization Plan No. 3 of 1967, which put him and a council of nine, all appointed by the President, in place of the three Commissioners.
    n: 'Statement by the President on His Intention To Nominate Walter E. Washington and Thomas W. Fletcher as Commissioner and Assistant to the Commissioner, [1967 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=218) (Sept. 6, 1967). [[w.califano-triumph-and-tragedy-of]], 235 (the nominations of Washington and Fletcher announced). See [[cal.1967-08-09.states-and-cities]]. Names: Walter Washington, Johnson.'
