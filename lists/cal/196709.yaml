        - 'via w.herring-lbj-and-vietnam 57 n.125: D'
        - 'w.berman-lyndon-johnsons-war 78: D'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:christian-george, name:helms-richard, name:johnson-harold-k, name:jones-jim]
