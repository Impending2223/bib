  - id: cal.1967-09-01.laos
    when: Sept. 1
    date: '1967-09-01'
    thread: laos
    c: 'State concurs in Sullivan''s decision: Souvanna, vexed by American "loose talk," has denied B-52 overflights of Laos, so the U Tapao bombers keep their circuitous route round Cambodia.'
