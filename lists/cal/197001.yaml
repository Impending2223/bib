    c: China and Albania sign, at Tirana, the 1970 protocol on exchange of goods and payments and the protocol on Albania's use of the Chinese loan in 1970.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 232 (Jan. 19, 1970).'
    src:
      c: 87ddef04
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 232: all'
    tags: [polity:prc, polity:albania]
  - id: cal.1970-01.china-leadership
    when: Jan., after the 14th
    date: 1970-01
    at: after 1970-01-14
    thread: china-leadership
    c: 'Mao 毛泽东, on the Foreign Ministry''s 外交部 telegram of instructions to Lei Yang 雷阳, chargé d''affaires in Poland, and the Chinese representative''s draft statement for the 135th Sino-American ambassadorial talks at Warsaw 华沙, sent by Zhou Enlai 周恩来 Jan. 15: "Do as proposed." The aim is to sound out the Americans'' intent and hand; the stand held, the manner flexible, room left to talk on. The draft: the American ambassador''s statement of the 8th offered wider exchanges and dialogue but said nothing of Taiwan, the key to the long dispute.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 486 (Jan. 1970). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Foreign Ministry, telegram of instructions to Lei Yang and the Chinese representative''s draft statement for the 135th ambassadorial talks, sent to Mao by Zhou Enlai Jan. 15, 1970 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 486 n.1). Zhou''s papers: [[cal.1970-01-15.china-leadership]]. Names: Mao Zedong, Lei Yang, Zhou Enlai. Check: the day; the book gives Jan. 1970, Zhou sent the papers Jan. 15, and the talks they were for were held Jan. 20: within the calendar''s span only if Mao wrote by Jan. 19. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
    src:
      c: c5dcf80b
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 486: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 486 n.1a: all'
    tags: [polity:prc, polity:us, name:mao-zedong, name:lei-yang, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01.china-leadership-2
    when: Jan., early
    date: 1970-01
    at: before 1970-01-01
    thread: china-leadership
    also: [china]
    c: Deng Xiaoping's 邓小平 younger son Deng Zhifang 邓质方, sent down in Xin county, Shanxi, visits at Nanchang. He and Deng Rong often talk at home of the disorder in society since the Cultural Revolution.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1952 (Jan. 1970). The words: 1月初 (III, 1952). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
