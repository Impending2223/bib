    tags: [polity:prc, name:deng-xiaoping, vis:only:prc]
  - id: cal.1970-01.china-leadership-3
    when: Jan.
    date: 1970-01
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping''s 邓小平 and Zhuo Lin''s pay is stopped and a living allowance paid instead: 120 yuan a month to Deng, 60 to Zhuo Lin, 25 to Xia Bogen, 205 in all. The unpaid part of the pay is kept for the time being by the Central Committee''s 中央 General Office.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1952 (Jan. 1970). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
    src:
      c: 234c3e8c
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1952: all'
    tags: [polity:prc, name:deng-xiaoping, vis:only:prc]
  - id: cal.1970-01.vietnam-hanoi
    when: Jan.
    date: 1970-01
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The Party Central Committee''s 18th plenum meets in Hanoi on the direction of the leadership of the revolution in the South in the new stage. It affirms the gains of 1968 and 1969, criticizes shortcomings, judges that Vietnamization will continue and the war may spread north, to Laos and Cambodia, and in the main agrees with the Politburo''s April 1969 estimate of two courses. The tasks: press the military and political attack with diplomacy; the countryside the main direction; build the rear, including the fuel pipeline; the North ready to fight and support the South, Laos and Cambodia.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 158–62; [[w.khoo-collateral-damage]], 61 (the Eighteenth Plenum, January 1970: diplomatic and political struggle put on a level with the military, the Paris talks stressed; Soviet officials told beforehand, which the Soviets took as a retreat from pro-Chinese positions). Made public: 2013. Check: the days; the history gives "tháng 1-1970". The calendar''s span ends Jan. 19, 1970. To check: [[w.guan-ending-the-vietnam-war]], 37–38 (cited by [[w.khoo-collateral-damage]], 61 n.135); [[w.morris-soviet-chinese-vietnamese-triangle]] (cited by [[w.khoo-collateral-damage]], 61 n.136); [[w.gaiduk-soviet-union-and-the]], 216 (cited by [[w.khoo-collateral-damage]], 61 nn.137–138).'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1970-01.china-leadership-4
    when: Jan.
    date: 1970-01
    thread: china-leadership
    c: The Center, that is Mao 毛泽东, endorses virtually word for word Lin Biao's 林彪 criterion "Everything according to preparing for war," and its application is extended to the whole economy.
    n: '[[w.teiwes-tragedy-of-lin-biao]], 119, 120 n.32 (the Center''s more formal zhanbei for war preparations, against Lin''s colloquial dazhang). Made public: 1984 ([[w.weizhong-zhonghua-renmin-gongheguo-jingji]]). To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 454–455, 461 (cited by [[w.teiwes-tragedy-of-lin-biao]], 120 n.32a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 326 (cited by [[w.teiwes-tragedy-of-lin-biao]], 120 n.32b). See [[cal.1969-06.china-leadership-4]]. Names: Mao Zedong, Lin Biao. Check: the day (the calendar''s span ends Jan. 19, 1970; the page gives the month).'
    src:
      c: 3744d1bb
      rows:
        - 'w.teiwes-tragedy-of-lin-biao 119, 120 n.32: all'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, vis:only:prc, ok:fields-place]
