section: '197001'
entries:
  - id: cal.1970-01-01.china-leadership
    when: Jan. 1
    date: '1970-01-01'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the request of Anhui, Jiangsu, Zhejiang and Shanghai of Dec. 30 on the East China power grid''s present state and problems, writes: the State Council''s business group is to meet East China''s first-quarter coal allocation as asked; the East China grid is to be allotted by Shanghai; whether the Xuzhou grid is allotted by Xuzhou, Jiangsu or Shanghai is for the business group to settle.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 1, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-01.china-leadership-2
    when: Jan. 1
    date: '1970-01-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on a paper on factional quarrels and unending armed fights in some places in Xinjiang that badly hurt local industry, farming and the people''s life, writes: where armed fights have not stopped, production does not rise and revolutionary committees cannot be set up, and repeated advice goes unheeded, "war-preparation military control is to be put in"; those who do not obey the military control order are to be brought to Peking to study.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 1, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-01.china-leadership-3
    when: Jan. 1
    date: '1970-01-01'
    thread: china-leadership
    also: [china]
    c: The Chinese press greets the New Year with somewhat less stress on defense, by the book's reading.
    n: '[[w.macfarquhar-maos-last-revolution]], 320; [[w.chen-yun-nianpu-xiuding]], III, 174 (Jan. 1: the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* New Year editorial sets two tasks for 1970: to rectify and build the Party on the basis of cleaning the class ranks; to grasp revolution and promote production, work and war readiness). To check: [[w.mann-about-face]], 23–28 (cited by [[w.macfarquhar-maos-last-revolution]], 321 n.62).'
    src:
      c: d6caf927
      rows:
        - 'w.macfarquhar-maos-last-revolution 320: all'
        - 'w.chen-yun-nianpu-xiuding III, 174: ?'
    tags: [polity:prc]
  - id: cal.1970-01-01.china-leadership-4
    when: Jan. 1
    date: '1970-01-01'
    place: peking
    thread: china-leadership
    c: Peng Dehuai 彭德怀, reading the poems of Mao Zedong 毛泽东, reads and sings, and sings as he moves about his room, "Sailing the Seas Depends on the Helmsman" 《大海航行靠舵手》 and "The East Is Red" 《东方红》; at times, talking under his breath, he laughs.
    n: '[[w.peng-dehuai-nianpu]], 827. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1970-01-02.china-leadership
    when: Jan. 2
    date: '1970-01-02'
    thread: china-leadership
    c: Two comrades telephoning at Ye Jianying's 叶剑英 office 叶办 say that five nerves of his second son Ye Xuanning's 叶选宁 wounded right arm are severed at the root, near the brain; any operation must be careful.
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 988–989. Ye Jianying to Ye Xuanning and Qian Lingzhi 钱铃芝, May 31, 1970, as the book prints it. Made public: 2007. Names: Ye Jianying.'
    tags: [polity:prc, name:ye-jianying, vis:only:prc, ok:fields-place]
  - id: cal.1970-01-03.china-leadership
    when: Jan. 3
    date: '1970-01-03'
    place: peking
    thread: china-leadership
    c: Peng Dehuai 彭德怀, in better spirits, sings *The Internationale* 《国际歌》 and hums tunes of his own, laughing and talking, joy on his face.
    n: '[[w.peng-dehuai-nianpu]], 827. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1970-01-05.china-leadership
    when: Jan. 5
    date: '1970-01-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai hears the report of a strong earthquake of 7.3 at 1 a.m. in the Yuxi and Honghe districts of Yunnan. On Jan. 7, on the telegram of Sichuan''s revolutionary committee and the Chengdu Military Region on sending a delegation to console and relieve the stricken area, he writes: the stress should be on raising high the great red banner of Mao Zedong Thought, rousing morale, strengthening medical care (fifty-odd is too few; Sichuan can send two hundred capable medical men, with medicine and instruments), self-reliance and rebuilding homes. The same day, on the Foreign Ministry''s paper on other countries'' reactions to the Yunnan earthquake, he proposes that Xinhua issue a short item on it, to answer well-meant inquiries.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335 (Jan. 5, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-06.china-leadership
    when: Jan. 6
    date: '1970-01-06'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai, on a letter about the conference on controlling schistosomiasis in south China, tells the departments concerned to draft for the Center a notice approving the Shanghai revolutionary committee's report, the list of the schistosomiasis control leading group and its work plan, to be passed to the thirteen provinces, municipalities and regions concerned to try, and to the other northern provinces for reference on endemic disease in the north.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 335–336 (Jan. 6, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-07.china-leadership
    when: Jan. 7
    date: '1970-01-07'
    place: peking
    thread: china-leadership
    c: The case group 专案组 interrogates Peng Dehuai 彭德怀; back, he laughs without stop, and asks for paper to write his confession material 交代材料.
    n: '[[w.peng-dehuai-nianpu]], 827. The words: 上午 (827). Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
    time_range:
      - 1970-01-06T22:00Z
      - 1970-01-07T04:00Z
    time_band: morning
    time_zone: Asia/Shanghai
  - id: cal.1970-01-08.china-leadership
    when: Jan. 8
    date: '1970-01-08'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on Shanghai No. 5 Steel Plant''s design and building of a five-ton vacuum refining furnace, writes Li Xiannian, Ji Dengkui and Yu Qiuli: "please congratulate Shanghai No. 5 Steel and ask them to write a report on the whole course of designing, building, installing and producing with the five-ton vacuum furnace refining high-temperature alloy steel, with a little of the product sent for me to see."'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 8, 1970). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
    tags: [polity:prc, name:zhou-enlai, name:li-xiannian, vis:only:prc]
  - id: cal.1970-01-08.china
    when: Jan. 8
    date: '1970-01-08'
    place: warsaw
    thread: china
    c: Warsaw. Lei Yang, the Chinese chargé, and Stoessel hold another "informal meeting," at the American embassy, the first there in the ambassadorial talks' history; they agree to resume the formal talks on Jan. 20, in the two embassies in turn.
    n: '[[w.jian-zhou-enlai]], 626. To check: Stoessel to Secretary of State, Jan. 8, 1970, Subject-Numeric Files, 1970–1973, Pol Chicom US, RG 59, National Archives (cited by [[w.jian-zhou-enlai]], 626 n.51). See [[cal.1969-12-11.china-leadership]]. Names: Lei Yang, Stoessel.'
    src:
      c: a9a1dd99
      rows:
        - 'w.jian-zhou-enlai 626: all'
        - 'via x.1970-01-08.stoessel-to-the-secretary-of-state: all'
    tags: [polity:prc, polity:us, name:lei-yang, name:stoessel-walter-j-jr]
  - id: cal.1970-01-09.china-leadership
    when: Jan. 9
    date: '1970-01-09'
    place: peking
    thread: china-leadership
    c: The Peking 北京 public security, procuracy and courts military control commission 北京市公檢法軍管會 sends the units a "notice" with an execution list of 20, Yu Luoke 遇羅克 among them.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 634. Made public: 2016.'
    src:
      c: 279c25d1
      rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 634: all'
    tags: [polity:prc, vis:only:prc]
  - id: cal.1970-01-12.china-leadership
    when: Jan. 12
    date: '1970-01-12'
    thread: china-leadership
    also: [china]
    c: 'Mao 毛泽东, on the Central Liaison Department''s copies of four letters, Mar.–Dec. 1969, from the general secretary of a Latin American communist party and others to the Center and Lin Biao 林彪, admitting that following the Soviet revisionists against China was an error and asking to restore party relations: to Lin Biao, the letters seem not ill-meant; they have been abandoned and are looking for a way out; pass them to Kang Sheng 康生 to consider whether to contact them.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 9 (Jan. 12, 1970). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: which party; the book does not name it. Names: Mao Zedong, Lin Biao, Kang Sheng.'
    src:
      c: 266e54d6
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 9: all'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:kang-sheng, vis:only:prc]
  - id: cal.1970-01-14.vietnam
    when: Jan. 14
    date: '1970-01-14'
    place: california
    thread: vietnam
    c: 'Laird, in a speech in California: of all the changes of policy in the administration''s first year none matters more than Vietnamization, the test of the wider Asian policy Nixon announced at Guam in July 1969.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 29 and n. 2. See [[cal.1969-07-25.vietnam]]. Names: Laird, Nixon. Check: the words and the place; the history quotes in Vietnamese and gives "Caliphoócnia".'
    tags: [polity:us, name:laird-melvin-r, name:nixon-richard-m]
  - id: cal.1970-01-15.china-leadership
    when: Jan. 15
    date: '1970-01-15'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai revises the Foreign Ministry's telegram to Lei Yang, the Chinese chargé in Poland, and the draft Chinese statement for the 135th Sino-American ambassadorial talks soon to be held, adding that if after China's statement the American side raises again its treaty relation with Taiwan, China is to answer that the "American-Chiang treaty" is not recognized by all the Chinese people, and if the American side asks what "higher-level talks or other channels" mean, China may answer that if the American government is interested it may put forward a plan, or one may be worked out between the two sides at the ambassadorial talks. The talks resume Jan. 20, after a break of over two years.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 15, 1970); [[w.jianguo-yilai-mao-zedong]], XIX, 486 n.1 (Jan. 15, 1970; Zhou Enlai sends the Foreign Ministry''s telegram to Lei Yang and the draft statement to Mao Jan. 15; the talks resume at Warsaw Jan. 20, the 135th; not the length of the break). Made public: 2020. Names: Zhou Enlai, Lei Yang.'
    src:
      c: 75557ebe
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 336: ?'
        - 'w.jianguo-yilai-mao-zedong XIX, 486 n.1: B'
        - 'via w.jianguo-yilai-mao-zedong XIX, 486 n.1a: B'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc, name:lei-yang]
  - id: cal.1970-01-15.china-leadership-2
    when: Jan. 15
    date: '1970-01-15'
    place: peking
    thread: china-leadership
    c: Peng Dehuai 彭德怀's clothes, packed in an old leather trunk, are put by his guards 监护人员 in the storeroom; he asks for them, the sentry 哨兵 refuses, and he flies into a rage.
    n: '[[w.peng-dehuai-nianpu]], 827. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1970-01-15.china-leadership-3
    when: Jan. 15
    date: '1970-01-15'
    thread: china-leadership
    c: 'The case group 专案组 considers Peng Dehuai 彭德怀''s dossier 立档: the autobiography he wrote, without the least admission of guilt and against objective history, should not go into the file; filed, it would build him a monument.'
    n: '[[w.peng-dehuai-nianpu]], 827. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1970-01-18.china-leadership
    when: Jan. 18
    date: '1970-01-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Central General Office''s letters and visits section''s investigation of big building and non-productive building at Xi''an and other places, orders the report printed and sent to all the Politburo''s members. Where the report says some who wrote of such extravagance were charged with "illegal activity", "going over heads", "having no regard for the city committee" and "breaking organizational principles", he writes in the margin: Li Ruishan is to be told by telephone to attend to correcting this abnormal act against the new Party constitution.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 18, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-18.china-leadership-2
    when: Jan. 18
    date: '1970-01-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai revises the Center''s draft notice against extravagance and waste, to be printed for the Politburo''s discussion: new, extended and rebuilt halls and hostels are strictly forbidden and those begun stopped; he adds that the provincial, municipal and regional committees are to turn them to other uses by local conditions and then reset the economical building plan and carry it out, and in the handling that "the very serious are to be given criminal punishment". The Politburo passes the draft Jan. 30 and the notice goes out Feb. 5.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 18, 1970). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1970-01-19.china-leadership
    when: Jan. 19
    date: '1970-01-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai writes Mao and Lin Biao reporting the factional struggles in Inner Mongolia and Sichuan, and the same day presides over a Politburo meeting to settle them.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 336 (Jan. 19, 1970). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
