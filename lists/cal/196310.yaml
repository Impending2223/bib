  - id: cal.1963-10-05.vietnam-2
    when: Oct. 5
    date: '1963-10-05'
    thread: vietnam
    also: [vietnam-force-levels]
    c: 'The Cabinet Room, a Saturday: Kennedy with Johnson, Rusk, McNamara, Harriman, Taylor, McCone, Bell, Bundy and Forrestal on the McNamara–Taylor report and Lodge''s instructions. The Commodity Import Program''s suspension weighed. No formal or public statement. The withdrawal of 1,000 advisers by December not raised formally with Diệm, but carried out "routinely." Kennedy, recorded: if the war is going badly, a formal announcement "would seem illogical"; do it "by rotation."'
    n: '[FRUS 1961–63, IV, doc. 179](https://history.state.gov/historicaldocuments/frus1961-63v04/d179) (Forrestal''s memorandum: 9:30 a.m.); [doc. 181](https://history.state.gov/historicaldocuments/frus1961-63v04/d181) (telegram 534 to Lodge). [John F. Kennedy, David E. Bell, McGeorge Bundy and others, 11 a.m.](https://prde.upress.virginia.edu/conversations/4022295), JFK Meeting Tape 114_A50.2 (PRDE only). [[w.selverstone-kennedy-withdrawal]], 184–86 (the meeting; the thousand by rotation, from the Miller Center''s draft transcript). [[w.reeves-president-kennedy]], 615–16 (the import program; no statement). Check: the hour (Forrestal gives 9:30 a.m., PRDE 11 a.m.); the recording not heard. Made public: FRUS 1961–63, IV (1991). See [[cal.1963-10-02.vietnam]]. Names: Kennedy, Johnson, Rusk, McNamara, Harriman, Taylor, McCone, Bell, Bundy, Forrestal, Lodge, Ngô Đình Diệm.'
