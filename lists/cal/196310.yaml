    c: Conein with Trần Văn Đôn, the night of Oct. 28, at Đôn's initiative. Lodge has vouched for Conein; the only way to win before the Americans leave in 1965 is to change the regime. The plans to Lodge perhaps only four hours before; nothing in the next 48 hours; Conein to stay home from the evening of Oct. 30. The units Đôn knows of; Đình watched, to be eliminated if he wavers.
