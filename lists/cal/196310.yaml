    c: 'McCone, Director of Central Intelligence, to Saigon: "we certainly cannot be in the position of stimulating, approving, or supporting assassination, but on the other hand, we are in no way responsible for stopping every such threat of which we might receive even partial knowledge. We certainly would not favor assassination of Diem." Best approach "hands off"; "we naturally interested in intelligence on any such plan."'
    n: '[[w.sen-church-alleged-assassination-plots]], 217, 221 (the cable, drafted for McCone by Colby, chief of the Far East Division, by Colby''s testimony of June 20, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Saigon, Oct. 5, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 221). See [[cal.1963-10-05.vietnam-saigon]]. Names: McCone, Diệm.'
