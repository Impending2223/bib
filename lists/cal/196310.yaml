    c: 'News conference. Would he want Johnson on the ticket in 1964, and does he expect him to be? "Yes, to both of those questions. That is correct." Goldwater''s charge of news managed to keep the administration in office: no reply this week, Goldwater having had "a busy week selling TVA," suggesting nuclear weapons for commanders overseas, attacking the President of Bolivia and involving himself in the Greek election. The six divisions in Germany kept "as long as they are required," and the units sent in 1961 "as long as there is a need for them"; no reduction in combat units, some in noncombat personnel: "we intend to keep our combat forces in Germany as they are today—that is, more than 6 combat divisions"; German purchases of arms "an offset to our gold losses." A reversal of the Cabinet''s ruling of Oct. 24 on the roundout units. On Vietnam: a thousand men expected out by the end of the year, the first contingent some 250 not in front-line operations.'
