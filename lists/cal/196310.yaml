  - id: cal.1963-10-01.china-leadership-2
    when: Oct. 1
    date: '1963-10-01'
    thread: china-leadership
    also: [soviet-union]
    c: Zhou Enlai, on repeated cases in Peking of crowds, children above all, shouting abuse at Soviet and other foreigners, asks Peng Zhen to have the Peking Party committee call every level for education on Sino-Soviet friendship, above all that the fight against the revisionist leading group must never be against the Soviet people. Most are children, but a trace of unhealthy national feeling shows and must be guarded against, lest bad men use it. He asks Chen Yi to have the Foreign Affairs Office draft a Central Committee notice for the whole country.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963). Made public: 1997. Names: Zhou Enlai, Peng Zhen, Chen Yi.'
    tags: [polity:prc, name:zhou-enlai, name:peng-zhen, name:chen-yi, vis:only:prc]
  - id: cal.1963-10-01.china-leadership-3
    when: Oct. 1
    date: '1963-10-01'
    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou Enlai "differs," on the International Liaison Department''s report that proposes to sort the greetings of fraternal parties on National Day into left, center and right: few fraternal parties will send greetings and few of those would curse China in public, though some might hint; to sort them so closely hands a handle to others; better print all, or all in extract, in the order received, and let readers judge, with no leaning. Deng Xiaoping to the Department: do it as the Premier says.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
    tags: [polity:prc, name:zhou-enlai, name:deng-xiaoping, vis:only:prc]
  - id: cal.1963-10-01.china-leadership-4
    when: Oct. 1
    date: '1963-10-01'
    time: 1963-10-01T09:00Z
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou Enlai receives Son Sann, Sihanouk''s private adviser and Governor of Cambodia''s National Bank, on China''s economic construction: the first Five-Year Plan could only copy the Soviet Union, with some gains and much unsuited to China; in the second China sought its own experience and made the general line; three lean years and the Soviet experts'' withdrawal forced self-reliance. The economy now recovers all round; so large a country needs time.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 583 (Oct. 1, 1963); [[w.zhou-enlai-waijiao-huodong]], 372 (Oct. 1, 1963; 下午5时, 钓鱼台宾馆2号楼, 设宴招待并进行了会谈); [[w.chen-yi-nianpu]], 988 (Oct. 1, 1963, evening; Chen Yi at Zhou''s banquet for Son Sann and his party). Continues 584. Made public: 1993. Names: Zhou Enlai, Son Sann.'
    src:
      c: b95622d4
      rows:
        - 'w.zhou-enlai-nianpu-1949 II, 583: ?'
        - 'w.zhou-enlai-waijiao-huodong 372: A'
        - 'w.chen-yi-nianpu 988: ?'
    tags: [polity:prc, polity:cambodia, name:zhou-enlai, name:son-sann, vis:only:prc+cambodia]
    time_zone: Asia/Shanghai
