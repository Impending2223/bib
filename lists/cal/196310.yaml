  - id: cal.1963-10-24.china-leadership-4
    when: Oct. 24
    date: '1963-10-24'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi continues to hear Bo Yibo. On renewal of equipment: part of the money may go to new capital construction but most is for existing enterprises; the depreciation of old enterprises was moved to new projects and is to be repaid; first renew equipment and keep up simple reproduction, then expand, and expansion too goes first to the old enterprises. Technical personnel are to be put in posts of responsibility, a number of engineers promoted and used boldly; enterprises need not have so many deputies; some university and senior-middle graduates with communist consciousness, men like Lei Feng, are to be sent to enterprises. On management: capitalist experience, especially of monopolies, is to be studied, and the Soviet; a national professional general company can be tried, for ministries as administrative organs are ill-suited to manage enterprises, which are to keep economic accounts; bureaus turned into companies would be organs of enterprises, nearer production. Companies too can breed bureaucracy. The present method, by which the ministries and the departments and bureaus of provinces and cities interfere in the economy, is over-economic and feudal, not capitalist.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 582–583 (Oct. 24, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
    tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
