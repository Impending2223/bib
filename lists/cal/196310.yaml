  - id: cal.1963-10-13.china-leadership-2
    when: Oct. 13
    date: '1963-10-13'
    time: 1963-10-13T06:30Z
    place: peking
    thread: china-leadership
    also: [indonesia]
    c: Zhou Enlai receives Sumarno, Indonesia's Minister for Central Bank Affairs, on economic and trade aid. Indonesia's economic trouble he thinks only temporary; the question is how to raise farm output and grain, how to take the enterprises back from imperialism, how to hold the state's foreign trade. Economic work is complex; the private economy cannot be cut off all at once, or one loses the thread; what matters is how the state controls it; economic questions need economic means, besides decrees, with an outlet for private industry and trade, else the economy suffers.
