    c: 'House Judiciary Committee approves the civil rights bill, 20–12: the Celler–McCulloch substitute, agreed with the Justice Department and Halleck, in place of the subcommittee''s broader bill. Part III dropped; an equal employment commission added. Kennedy: "comprehensive and fair." Check the vote.'
    n: 'Statement by the President Following Action on the Civil Rights Bill by the House Committee on the Judiciary, [1963 Pub. Papers 820](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=878) (Oct. 29, 1963). H.R. Rep. No. 88-914 (1963). [[w.reeves-president-kennedy]], 628–31 (the committee''s vote); [[w.sorensen-kennedy]], 500–01; [[w.sundquist-politics-and-policy]], 264–65 (the compromise in place of the subcommittee''s bill, beaten 19–15; the equal employment title); [[w.mann-walls-of-jericho]], 373–74 (the subcommittee''s bill set aside, the bipartisan bill reported); [[w.zelizer-fierce-urgency-of-now]], 59–60 (the subcommittee''s bill beaten 19–15; the substitute 23–11); [[w.whalen-longest-debate]], 47, 58, 64–66 (the substitute in place of the subcommittee''s bill; Title III''s suits cut back; Title VII''s commission to go to court; "a comprehensive and fair bill"); [[w.humphrey-education-of-a-public-1976]], 273 (McCulloch''s compromise, an equal employment commission enforcing through the courts); [[w.obrien-no-final-victories]], 143, 146 (the House Judiciary Committee''s approval in late October; Kennedy''s personal intervention; Halleck and McCulloch the key Republicans; not the vote of 20 to 12 or the day). Check: Sundquist, 265, has a broadened Part III in the compromise, the Attorney General to intervene in any civil rights suit brought by private parties. Check: Mann, 374, from CQ''s Almanac, gives 23–11. Check: Zelizer, 59, also gives 23–11, from the *Times* of Oct. 30 (60 n.62). Check: Whalen, 64–66, has Moore''s motion beaten, ten Democrats and nine Republicans against; Cramer''s appeal lost 22–11; the previous question 20–12; the substitute adopted 20–14 at the noon bell; the vote to report that afternoon, no count given. To check: [[w.rosenberg-kennedy-johnson-and-the]] ("The Bill Moves Forward"); [[w.loevy-to-end-all-segregation]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.risen-bill-of-the-century]]; [[w.scheele-