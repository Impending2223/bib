    date: 1963-10
    at: before 1963-10-22
    thread: china-leadership
    c: Chen Yi 陈毅 and his wife Zhang Qian 张茜, with the prefectural Party secretary and the manager, inspect the Xuan paper mill 宣纸厂 of Jing county 泾县, Anhui 安徽; finding the work primitive and hard, he tells the secretary it must change. Back in Peking 北京 he takes up with the Institute of Otolaryngology's doctors the paper workers' deafness and has their earplugs sent to the mill.
    n: '[[w.chen-yi-nianpu]], 991. The words: 10月22日左右……返北京后 (991). Made public: 1995. Names: Chen Yi.'
