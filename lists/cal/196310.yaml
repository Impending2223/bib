    c: '5:30 p.m. Jean Daniel of L''Express, on his way to Havana, with the President, at Bradlee''s and Attwood''s urging. By Daniel''s account, Kennedy: "I believe that we created, built and manufactured the Castro movement out of whole cloth and without realizing it"; but Castro has agreed "to be a Soviet agent in Latin America"; the blockade to go on as long as the subversion. "Come and see me on your return from Cuba."'
