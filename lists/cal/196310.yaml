  - id: cal.1963-10-02.vietnam-force-levels
    when: Oct. 2
    date: '1963-10-02'
    place: washington
    thread: vietnam-force-levels
    c: 'The 519th NSC, the Cabinet Room. Kennedy objects to "by the end of this year" for withdrawing the 1,000: if it is not done, a charge of over-optimism; McNamara: the sentence answers Fulbright and others who see the country bogged down for good, and shows a withdrawal plan. Both dates made the report''s, not the President''s. McNamara and Taylor''s basic presentation endorsed; Kennedy approves the public statement of policy.'
    n: 'Summary Record of the 519th Meeting of the National Security Council, FRUS 1961–63, IV, doc. [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169) (Oct. 2, 1963, 6 p.m., to 6:30 p.m. by the President''s Log); Record of Action No. 2472, doc. [170](https://history.state.gov/historicaldocuments/frus1961-63v04/d170) (the endorsement; the statement approved). White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963) (the endorsement; the approval). The meeting, recorded: [6:05 p.m.](https://prde.upress.virginia.edu/conversations/4022294), JFK Meeting Tape 114_A49.4 (PRDE only). [[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the NSC in the evening; Kennedy objects to "by the end of the year"); [[w.selverstone-kennedy-withdrawal]], 167–82 (the NSC, from the Miller Center''s draft transcript); [[w.schulimson-joint-chiefs-of-staff]], 379–81 (the meeting; the endorsement; the 1,000); [[w.futrell-united-states-air-force]], 190 (the NSC); [[w.taylor-swords-and-plowshares]], 299 (the NSC); [[w.sen-church-alleged-assassination-plots]], 220 (the findings to the NSC; the withdrawal of 1,000 by the end of the year to be announced, approved by the President); [[w.reeves-president-kennedy]], 611–14 (the NSC). Made public: the endorsement and the approval, by the statement, the same day; the summary record, FRUS 1961–63, IV (1991). See [[cal.1963-10-02.vietnam]]. Names: Kennedy, McNamara, Taylor, Fulbright.'
