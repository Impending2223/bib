  - id: cal.1963-10-29.civil-rights-bill
    when: Oct. 29
    date: '1963-10-29'
    place: washington
    thread: civil-rights-bill
    c: 'House Judiciary Committee approves the civil rights bill, 20–12: the Celler–McCulloch substitute, agreed with the Justice Department and Halleck, in place of the subcommittee''s broader bill. Part III dropped; an equal employment commission added. Kennedy: "comprehensive and fair." Check the vote.'
    n: 'Statement by the President Following Action on the Civil Rights Bill by the House Committee on the Judiciary, [1963 Pub. Papers 820](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=878) (Oct. 29, 1963). [[w.reeves-president-kennedy]], 628–31 (the committee''s vote); [[w.sorensen-kennedy]], 500–01; [[w.sundquist-politics-and-policy]], 264–65 (the compromise in place of the subcommittee''s bill, beaten 19–15; the equal employment title); [[w.mann-walls-of-jericho]], 373–74 (the subcommittee''s bill set aside, the bipartisan bill reported); [[w.zelizer-fierce-urgency-of-now]], 59–60 (the subcommittee''s bill beaten 19–15; the substitute 23–11); [[w.whalen-longest-debate]], 47, 58, 64–66 (the substitute in place of the subcommittee''s bill; Title III''s suits cut back; Title VII''s commission to go to court; "a comprehensive and fair bill"); [[w.humphrey-education-of-a-public-1976]], 273 (McCulloch''s compromise, an equal employment commission enforcing through the courts); [[w.obrien-no-final-victories]], 143, 146 (the House Judiciary Committee''s approval in late October; Kennedy''s personal intervention; Halleck and McCulloch the key Republicans; not the vote of 20 to 12 or the day); [[w.risen-bill-of-the-century]], 131–33 (the compromise''s terms, the FEPC to sue in court, 131; the committee called to order at 10:45; the Moore motion lost 15–19; Foley''s reading to 11:52 a.m.; Rodino''s motion; the vote; not Title III''s going); [[w.hr-rep-88-914]], 1–18 (the committee''s substitute, amendment No. 1, Titles I–X, 1–16; the title, amendment No. 2, 16; against the subcommittee''s eleven titles, the Community Relations Service title dropped and the rest kept, amended, 17–18); [[w.civil-rights-rules-hearings-hr-7152]], 39–88 (the substitute as printed in the reported bill, after the bill as introduced, 2–39); [[w.purdum-idea-whose-time-has-2014]], 141, 143–44 (the 56-page substitute, with the FEPC; Kennedy''s statement, "comprehensive and fair"; the vote, 20 to 14 at the noon bell, after Moore''s motion beaten 19–15 (ten Democrats, Willis the tenth, and nine Republicans)). Check: Sundquist, 265, has a broadened Part III in the compromise, the Attorney General to intervene in any civil rights suit brought by private parties. Check: Mann, 374, from CQ''s Almanac, gives 23–11. Check: Zelizer, 59, also gives 23–11, from the *Times* of Oct. 30 (60 n.62). Check: Whalen, 64–66, has Moore''s motion beaten, ten Democrats and nine Republicans against; Cramer''s appeal lost 22–11; the previous question 20–12; the substitute adopted 20–14 at the noon bell; the vote to report that afternoon, no count given. Check: [[w.hr-rep-88-914]], 16–17, has the substitute keep the Attorney General''s suits title, amended (suits on public facilities, intervention in equal protection suits), and drop the Community Relations Service title; not Part III dropped. To check: [[w.rosenberg-kennedy-johnson-and-the]] ("The Bill Moves Forward"); [[w.loevy-to-end-all-segregation]]; [[w.scheele-charlie-halleck]]; Nicholas Katzenbach, oral history, 159–69, Kennedy Library (cited by [[w.reeves-president-kennedy]], 629); Charles Halleck, oral history, 9–14, Kennedy Library (cited by [[w.reeves-president-kennedy]], 630); H. Comm. on the Judiciary, 88th Cong., H.R. 7152 (Comm. Print No. 2, Oct. 30, 1963) (the full committee''s substitute as printed; cited by Katzenbach, Dec. 2, 1963, in *Civil Rights*, Pt. IV, 2772). See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler, McCulloch, Halleck.'
