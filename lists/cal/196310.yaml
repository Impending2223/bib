  - id: cal.1963-10-05.king
    when: Oct. 5
    date: '1963-10-05'
    thread: king
    c: New York, the Park Sheraton. King sees Levison, against his promise to the Kennedys, on his book on Birmingham; Levison to oversee a new ghostwriter. The FBI, from its taps on Levison and Clarence Jones, tells Robert Kennedy they are in touch.
    n: '[[w.garrow-bearing-the-cross]], 299–300. The taps on King: [[cal.1963-10-10.king]]. To check: SAC New York to Director, Oct. 5, 7 and 9, 1963, FBI file 100-3-116-440, 402; FBI New York file 100-111180-7-567A and 568A, Oct. 7 and 8, 1963, FBI file 100-111180-7-567A, 568A (cited by [[w.garrow-bearing-the-cross]], 300 n.9). Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison, Robert F. Kennedy.'
