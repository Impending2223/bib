  - id: cal.1963-10-10.king
    when: Oct. 10
    date: '1963-10-10'
    thread: king
    also: [civil-rights-the-executive, robert-kennedy]
    c: Robert Kennedy signs Hoover's request of Oct. 7 for wiretaps on King, at his home "or at any future address," and on SCLC's New York office, citing "possible communist influence in the racial situation." Oct. 21, SCLC's Atlanta office. Installed Oct. 24 in New York, Nov. 8 in Atlanta.
    n: '[S. Rep. No. 94-755, Book III, 115–17 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=129) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 359–61 (the requests and the consents; not the installations); [[w.garrow-bearing-the-cross]], 303–04, 310 (the approval, and of a tap on Rustin; the taps in place by November). To check: [[w.garrow-fbi-and-martin-luther]]; [[w.branch-parting-the-waters]]. See [[cal.1963-06-22.civil-rights-bill]]. Made public: Drew Pearson and Jack Anderson''s column, May 1968, before the Oregon primary. Check the date. Names: Robert F. Kennedy, Hoover, Martin Luther King.'
