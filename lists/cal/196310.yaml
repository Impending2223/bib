    place: saigon
    thread: vietnam
    c: 'Taylor to Diệm, letter: the Viet Cong in the north and center "can be reduced to little more than sporadic incidents by the end of 1964"; the Delta by the end of 1965, if the conditions McNamara set are met.'
    n: '[Taylor to Diệm, Oct. 1, 1963, FRUS 1961–63, IV, doc. 163](https://history.state.gov/historicaldocuments/frus1961-63v04/d163). [[w.mcnamara-in-retrospect]], ch. 3 at n.35 (the dates; McNamara quotes "sporadic elements"). [[w.taylor-swords-and-plowshares]], 298–99 n. (an extract of the letter; delivered Oct. 2). See [[cal.1963-09-29.vietnam]]. Names: Taylor, Ngô Đình Diệm, McNamara.'
