    tags: [state:ms, city:jackson, name:henry-aaron]
  - id: cal.1963-10-07.baker
    when: Oct. 7
    date: '1963-10-07'
    thread: baker
    c: 'Bobby Baker resigns as secretary to the Senate majority, under charges of trading on his post. Oct. 10, Williams''s resolution, S. Res. 212, agreed to: the Rules Committee to inquire into the business interests of Senate employees and former employees.'
    n: '[109 Cong. Rec., Senate, Oct. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt14/pdf/GPO-CRECB-1963-pt14-7-1.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.dallek-flawed-giant]], 40–41 (the resignation). [[w.caro-passage-of-power]], 288–89. To check: [[w.baker-wheeling-and-dealing]]; Williams in the Senate, May 18, 1965, 111 Cong. Rec. 10845; New York Times, Oct. 11, 1963 (cited by [[w.caro-passage-of-power]], 288–89); Time, Oct. 18, 1963, pp. 29–30; Special Agent in Charge, Baltimore, to Hoover, July 27, 1962, Official and Confidential File, J. Edgar Hoover, FBI; Hoover to Special Agent in Charge, Baltimore, Aug. 2, 1962, Official and Confidential File, J. Edgar Hoover, FBI; DeLoach to Hoover, Jan. 20, 1964, Official and Confidential File, J. Edgar Hoover, FBI (cited by [[w.dallek-flawed-giant]], 41). Names: Robert Baker, Williams.'
