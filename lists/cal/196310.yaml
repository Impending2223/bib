  - id: cal.1963-10-21.china-leadership-2
    when: Oct. 21
    date: '1963-10-21'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hears Bo Yibo on industrial production. To shorten the industrial front is chiefly to shorten the capital-construction front: it was too long, with too many projects, demands too high and hasty, designs poor, the aim expanded reproduction and simple reproduction forgotten. In production only quantity was watched, not quality; targets were set beyond what the equipment allows, equipment meant for fifteen years was used up in five, overworked and not maintained. A manager of enterprises, a proletarian vanguard, must run them better than a capitalist; waste and loss are to be fought by every means, and one who is unmoved by waste is not a leader of the proletariat. The spirit of hard struggle is to be a test of cadres and Party members.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 581–582 (Oct. 21, 1963). Made public: 1996. Names: Liu Shaoqi, Bo Yibo.'
    tags: [polity:prc, name:liu-shaoqi, name:bo-yibo, vis:only:prc]
