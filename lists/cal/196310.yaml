  - id: cal.1963-10-23.china-leadership
    when: Oct. 23
    date: '1963-10-23'
    thread: china-leadership
    c: 'Zhou Enlai presides at the 137th plenary meeting of the State Council, on the features of the 1964 plan: keep capital-construction costs under strict control, examine every project, stress key ones and leave leeway. Raise the pay of real scholars and engineers of merit and improve their housing; the State Science Commission to bring a plan soon. Part of each department is to go down to study the carrying out of next year''s plan and, chiefly, the long-term plan.'
