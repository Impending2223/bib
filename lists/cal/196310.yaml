  - id: cal.1963-10-01.civil-rights-the-executive
    when: Oct. 1
    date: '1963-10-01'
    thread: civil-rights-the-executive
    c: Senate extends the Civil Rights Commission one year, [71–15](https://voteview.com/rollcall/RS0880144), as an amendment to a private bill. House agrees Oct. 7, [265–80](https://voteview.com/rollcall/RH0880072). Signed Oct. 17, [77 Stat. 271](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg271-2.pdf).
    n: 'To check: [[w.rights-1961-report]]; [[w.rights-civil-rights-63]]; [[w.graham-civil-rights-era]]; [[w.dulles-civil-rights-commission-1957]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-01.desegregation-public-places-cambridge
    when: Oct. 1
    date: '1963-10-01'
    thread: desegregation-public-places
    also: [state-constitutions]
    c: 'Cambridge, Md. The voters reject Charter Amendment No. 15, adopted by the council July 1 under the agreement of July 23 and petitioned to referendum: public accommodations open to all races. Richardson''s Cambridge Nonviolent Action Committee had urged Negroes not to vote. Check the figures.'
    n: '[SNCC, press release, Dec. 22, 1963](https://crmvet.org/docs/pr/631222_sncc_pr_md_protests.pdf). To check: [[w.levy-civil-war-on-race]]. See [[cal.1963-07-23.civil-rights-the-executive]]. Names: Richardson.'
    tags: [state:md, city:cambridge-md, name:richardson-gloria]
  - id: cal.1963-10-01.africa
    when: Oct. 1–2
    date: '1963-10-01'
    thread: africa
    c: 'Haile Selassie on a state visit. Kennedy raises Somalia; the Emperor: arms aid to Somalia encourages its irredentism. Aid to Ethiopia discussed Oct. 2.'
    n: 'Remarks of Welcome at Union Station to Haile Selassie, Emperor of Ethiopia, [1963 Pub. Papers 754](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=812) (Oct. 1, 1963); Joint Statement Following Discussions With the Emperor of Ethiopia, [1963 Pub. Papers 758](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=816) (Oct. 2, 1963). FRUS 1961–63, XXI, docs. [300](https://history.state.gov/historicaldocuments/frus1961-63v21/d300), [301](https://history.state.gov/historicaldocuments/frus1961-63v21/d301), [302](https://history.state.gov/historicaldocuments/frus1961-63v21/d302). To check: [[w.lefebvre-arms-for-the-horn]]. Names: Haile Selassie.'
    tags: [name:haile-selassie-i, name:kennedy-john-f]
  - id: cal.1963-10-01.vietnam-saigon
    when: Oct. 1
    date: '1963-10-01'
    thread: vietnam-saigon
    c: 'Taylor''s farewell call on Dương Văn Minh: by Taylor''s record, Minh sees ultimate success doubtful, no clear chain of command, responsibility divided; the Buddhist trouble a struggle for privilege; "no solution." It would be "tragic" to slow the war by cutting aid; he sees no opposition that might rally support.'
    n: '[FRUS 1961–63, IV, doc. 162](https://history.state.gov/historicaldocuments/frus1961-63v04/d162) (Taylor''s memorandum for the record; the tennis of Sept. 29 in its first note). [[w.moyar-triumph-forsaken]], 253–54 (the tennis; the second meeting). See [[cal.1963-09-29.vietnam]]. Names: Taylor, Dương Văn Minh.'
    src:
      c: 4e047b2f
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d162: all'
        - 'w.moyar-triumph-forsaken 253–54: A-B'
        - 'via w.moyar-triumph-forsaken 254 n.46: all'
    tags: [name:taylor-maxwell, name:duong-van-minh, place:saigon]
  - id: cal.1963-10-02.vietnam
    when: Oct. 2
    date: '1963-10-02'
    thread: vietnam
    also: [vietnam-force-levels]
    c: 'McNamara and Taylor report to Kennedy and the NSC. White House statement: the major part of the American military task done by the end of 1965; 1,000 men out by the end of 1963. The political situation "deeply serious."'
    n: 'White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963). FRUS 1961–63, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1961-63v04/d167), [169](https://history.state.gov/historicaldocuments/frus1961-63v04/d169); doc. [170](https://history.state.gov/historicaldocuments/frus1961-63v04/d170). Report of McNamara and Taylor to the President (Viet. II.I.3). The meetings, recorded: [11 a.m.](https://prde.upress.virginia.edu/conversations/4022293), JFK Meeting Tape 114_A49.2; [6:05 p.m.](https://prde.upress.virginia.edu/conversations/4022294), JFK Meeting Tape 114_A49.4 (PRDE only). [[w.miller-misalliance]], 300–02; [[w.gibbons-u-s-government-and]], II, 184–85; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 289 (the report; the 1,000 men); [[w.schulimson-joint-chiefs-of-staff]], 379–81 (the report, the meetings, the 1,000); [[w.futrell-united-states-air-force]], 190 (the report and the NSC; the war''s end in 1965; the thousand men); [[w.moyar-triumph-forsaken]], 254–55. [[w.selverstone-kennedy-withdrawal]], 167–82 (the report; the morning meeting and the NSC, from the Miller Center''s draft transcripts; the statement). [[w.reeves-president-kennedy]], 611–14 (the report; the statement). To check: [[w.selverstone-its-a-date]]; msgs, 2d AD to PACAF, Sep 29 and 30, 1963, and Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27b); PACAF to 2d AD, Oct 9, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27c); ltrs, Frederick W. Flott to Harbin, Oct 2, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27d); Wade to CHMAAGV, Sep 30, 1963 (cited by [[w.futrell-united-states-air-force]], 190 n.27e); William Sullivan, oral history 2, Kennedy Library (cited by [[w.reeves-president-kennedy]], 611); Salinger, press briefing, Oct. 2, 1963, National Security Files, box 314, Kennedy Library (cited by [[w.reeves-president-kennedy]], 614). See [[cal.1963-09-21.vietnam]]. Names: McNamara, Taylor.'
