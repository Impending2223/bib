    when: Oct. 9
    date: '1963-10-09'
    thread: vietnam
    c: 'CIA to Lodge, thoughts "discussed with President": "While we do not wish to stimulate coup, we also do not wish to leave impression that U.S. would thwart a change of government or deny economic and military assistance to a new regime if it appeared capable of increasing effectiveness of military effort ..."'
    n: '[FRUS 1961–63, IV, doc. 192](https://history.state.gov/historicaldocuments/frus1961-63v04/d192); [doc. 182](https://history.state.gov/historicaldocuments/frus1961-63v04/d182) (CAP 63560, Oct. 5: no active covert encouragement to a coup; contacts with possible alternative leadership). [[w.miller-misalliance]], 311. See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 769 (1971). Names: Lodge.'
