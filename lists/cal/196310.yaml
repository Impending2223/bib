  - id: cal.1963-10-02.opinion
    when: Oct. 2
    date: '1963-10-02'
    thread: opinion
    c: 'Gallup, Sept. 12–17: the most important problem, racial problems, 52 percent; international problems, 25; unemployment, 5; taxes, 5. The Democrats better able to handle it, 30; the Republicans, 20.'
    n: '[[w.gallup-poll]], III, 1842.'
  - id: cal.1963-10-03.latin-america
    when: Oct. 3
    date: '1963-10-03'
    thread: latin-america
    c: 'Honduras. The army ousts Villeda Morales; López Arellano takes power. Eight days after Bosch''s fall. Oct. 4, relations with both broken, aid and military assistance stopped. Kennedy, Oct. 9: "we are opposed to coups."'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 159](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d159); [FRUS 1961–63, XII, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v12/d359). The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825) (Oct. 9, 1963). To check: [[w.lafeber-inevitable-revolutions]]; [[w.morris-honduras]]; [[w.rabe-most-dangerous-area-in]]; [[w.rabe-killing-zone]]; [[w.martin-kennedy-and-latin-america]]. See [[cal.1962-12-20.latin-america]]; [[cal.1963-09-25.latin-america]]. Names: Villeda Morales, López Arellano, Bosch.'
    tags: [name:villeda-morales-jose-ramon, name:lopez-arellano-oswaldo, name:bosch-juan, name:kennedy-john-f]
  - id: cal.1963-10-04.opinion
    when: Oct. 4
    date: '1963-10-04'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified Catholic nominated for President by their party, 84 percent; would not, 13. In the South, 71 and 26.'
    n: '[[w.gallup-poll]], III, 1843.'
  - id: cal.1963-10-04.antisubversion-la
    when: Oct. 4
    date: '1963-10-04'
    thread: antisubversion
    c: New Orleans. State and city police, directed by the staff of the Joint Legislative Committee on Un-American Activities, raid the homes and offices of Dombrowski, executive director of the Southern Conference Educational Fund, and two lawyers; the three arrested under the Subversive Activities and Communist Control Law and the Communist Propaganda Control Law, their files seized. Later in October a State judge quashes the warrants.
    n: '*Dombrowski v. Pfister*, [380 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380479/usrep380479.pdf) (1965); Wisdom, dissenting, in [227 F. Supp. 556](https://static.case.law/f-supp/227/case-pdfs/0556-01.pdf) (E.D. La. 1964). To check: [[w.fairclough-race-and-democracy]]. Names: Dombrowski.'
    tags: [name:dombrowski-james-a, state:la, city:new-orleans]
  - id: cal.1963-10-05.vietnam
    when: Oct. 5
    date: '1963-10-05'
    thread: vietnam
    c: Conein with Dương Văn Minh at Minh's headquarters, cleared by Lodge. Minh must know the American position on a change of government; no support asked, only assurance it will not be thwarted. Three plans, the first the assassination of Nhu and Ngô Đình Cẩn, Diệm kept in office.
    n: '[FRUS 1961–63, IV, doc. 177](https://history.state.gov/historicaldocuments/frus1961-63v04/d177). [[w.miller-misalliance]], 311–12. See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 767–68 (1971). Names: Conein, Dương Văn Minh, Lodge, Nhu, Ngô Đình Cẩn, Diệm.'
    tags: [name:conein-lucien, name:duong-van-minh, name:lodge-henry-cabot, name:ngo-dinh-nhu, name:ngo-dinh-can, name:ngo-dinh-diem, place:saigon]
  - id: cal.1963-10-05.king
    when: Oct. 5
    date: '1963-10-05'
    thread: king
    c: New York, the Park Sheraton. King sees Levison, against his promise to the Kennedys, on his book on Birmingham; Levison to oversee a new ghostwriter. The FBI, from its taps on Levison and Clarence Jones, tells Robert Kennedy they are in touch.
    n: '[[w.garrow-bearing-the-cross]], 299–300. The taps on King: [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King, Levison, Robert F. Kennedy.'
    tags: [name:king-martin-luther-jr, name:levison-stanley-d, name:kennedy-robert-f, state:ny, city:nyc]
  - id: cal.1963-10-06.opinion-5
    when: Oct. 6
    date: '1963-10-06'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Sept. 12–17: Republicans'' choice for 1964: Goldwater 42, Rockefeller 26, Romney 15, Scranton 4; others, no preference 13. Independents: Goldwater 33, Rockefeller 27.'
    n: '[[w.gallup-poll]], III, 1843. Names: Goldwater, Nelson Rockefeller, Romney, Scranton.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1963-10-06.mississippi
    when: Oct. 6
    date: '1963-10-06'
    thread: mississippi
    also: [civil-rights-organizations]
    c: 'Jackson, the Masonic Temple. COFO''s convention opens the Freedom Ballot campaign: a platform against the literacy test, for a State farm loan program and a federal minimum wage of $1.25; Aaron Henry nominated for governor.'
    n: '[[w.dittmer-local-people]], 200–202. See [[cal.1963-08-06.mississippi-ms]]. Names: Henry.'
    tags: [state:ms, city:jackson, name:henry-aaron]
  - id: cal.1963-10-07.baker
    when: Oct. 7
    date: '1963-10-07'
    thread: baker
    c: 'Bobby Baker resigns as secretary to the Senate majority, under charges of trading on his post. Oct. 10, Williams''s resolution, S. Res. 212, agreed to: the Rules Committee to inquire into the business interests of Senate employees and former employees.'
    n: '[109 Cong. Rec., Senate, Oct. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt14/pdf/GPO-CRECB-1963-pt14-7-1.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.dallek-flawed-giant]], 40–41 (the resignation). [[w.caro-passage-of-power]], 288–89. To check: [[w.baker-wheeling-and-dealing]]. Names: Robert Baker, Williams.'
    tags: [name:baker-robert-g, name:williams-john-j]
  - id: cal.1963-10-07.testing
    when: Oct. 7
    date: '1963-10-07'
    thread: testing
    c: Kennedy signs the ratification of the test ban treaty, [14 U.S.T. 1313](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-14-2/lltreaties-14-2.pdf#page=57), [480 U.N.T.S. 43](https://treaties.un.org/doc/Publication/UNTS/Volume%20480/volume-480-I-6964-English.pdf). In force Oct. 10, on deposit of the instruments in Washington, London, and Moscow.
    n: Remarks at the Signing of the Nuclear Test Ban Treaty, [1963 Pub. Papers 765](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=823) (Oct. 7, 1963). Treaty Banning Nuclear Weapon Tests (K–J Cong. II.J.2). See [[cal.1963-06-10.testing]]; [[cal.1963-09-24.testing]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-08.africa
    when: Oct. 8
    date: '1963-10-08'
    thread: africa-algeria-morocco
    c: Algeria and Morocco at war over their desert border.
    n: '[FRUS 1961–63, XXI, doc. 6](https://history.state.gov/historicaldocuments/frus1961-63v21/d6) (Komer, Oct. 14). Made public: FRUS 1961–63, XXI (1995). To check: [[w.byrne-mecca-of-revolution]]. See [[cal.1962-10-15.africa]].'
  - id: cal.1963-10-09.trade
    when: Oct. 9
    date: '1963-10-09'
    thread: trade
    c: 'Press conference. Private dealers may sell surplus wheat to the Soviet Union and Eastern Europe, for cash or on normal credit, in American ships where available: 4 million tons, about $250 million. The NSC agreed. Report to Congress, Oct. 10: no action required.'
    n: 'The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825) (Oct. 9, 1963); Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the Soviet Union, [1963 Pub. Papers 776](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=834) (Oct. 10, 1963). Opinion: [42 Op. Att''y Gen. 229](https://archive.org/details/op-atty-gen/042/page/n253/mode/1up) (1963), Robert Kennedy to Rusk, Oct. 9: sales on normal commercial credit not loans under the Johnson Act; released with the letter, [[w.department-of-state-bulletin]], [Oct. 28, 1963, 661](https://archive.org/details/departmentofstat4963unit/page/661/mode/1up). [FRUS 1961–63, V, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v05/d359). To check: [[w.beschloss-crisis-years]]. See [[cal.1963-09-16.trade]]. Names: Freeman.'
    tags: [name:kennedy-john-f, name:freeman-orville-l]
  - id: cal.1963-10-09.vietnam
    when: Oct. 9
    date: '1963-10-09'
    thread: vietnam
    c: 'CIA to Lodge, thoughts "discussed with President": "While we do not wish to stimulate coup, we also do not wish to leave impression that U.S. would thwart a change of government or deny economic and military assistance to a new regime if it appeared capable of increasing effectiveness of military effort ..."'
    n: '[FRUS 1961–63, IV, doc. 192](https://history.state.gov/historicaldocuments/frus1961-63v04/d192); [doc. 182](https://history.state.gov/historicaldocuments/frus1961-63v04/d182) (CAP 63560, Oct. 5: no active covert encouragement to a coup; contacts with possible alternative leadership). [[w.miller-misalliance]], 311. See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 769 (1971). Names: Lodge.'
    tags: [name:lodge-henry-cabot, name:kennedy-john-f]
  - id: cal.1963-10-10.king
    when: Oct. 10
    date: '1963-10-10'
    thread: king
    also: [civil-rights-the-executive, robert-kennedy]
    c: Robert Kennedy signs Hoover's request of Oct. 7 for wiretaps on King, at his home "or at any future address," and on SCLC's New York office, citing "possible communist influence in the racial situation." Oct. 21, SCLC's Atlanta office. Installed Oct. 24 in New York, Nov. 8 in Atlanta.
    n: '[S. Rep. No. 94-755, Book III, 115–17 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=129) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 359–61; [[w.garrow-bearing-the-cross]], 303–04, 310 (the approval, and of a tap on Rustin; the taps in place by November). To check: [[w.garrow-fbi-and-martin-luther]]; [[w.branch-parting-the-waters]]. See [[cal.1963-06-22.civil-rights-bill]]. Made public: Drew Pearson and Jack Anderson''s column, May 1968, before the Oregon primary. Check the date. Names: Robert F. Kennedy, Hoover, Martin Luther King.'
    tags: [name:kennedy-robert-f, name:hoover-j-edgar, name:king-martin-luther-jr]
  - id: cal.1963-10-11.vietnam
    when: Oct. 11
    date: '1963-10-11'
    thread: vietnam
    c: NSAM 263. The report's military recommendations approved Oct. 5; the 1,000 to come out by the end of the year, without formal announcement. Lodge instructed to press Diệm by selective cuts in aid.
    n: '[NSAM No. 263](https://history.state.gov/historicaldocuments/frus1961-63v04/d194) (Oct. 11, 1963) (K–J Adm. II.H.2). FRUS 1961–63, IV, docs. [179](https://history.state.gov/historicaldocuments/frus1961-63v04/d179), [181](https://history.state.gov/historicaldocuments/frus1961-63v04/d181). [[w.miller-misalliance]], 312–13; [[w.gibbons-u-s-government-and]], II, 188; [[w.schulimson-joint-chiefs-of-staff]], 381–384. To check: [[w.newman-jfk-and-vietnam]]; [[w.chomsky-rethinking-camelot]]; [[w.logevall-vietnam-and-the-question]]; [[w.moise-jfk-and-the-myth]]; [[w.blight-vietnam-if-kennedy-had]]; [[w.selverstone-its-a-date]]; [[w.selverstone-kennedy-withdrawal]]. See [[cal.1963-09-21.vietnam]]. Names: McGeorge Bundy, Lodge, Ngô Đình Diệm.'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:lodge-henry-cabot, name:ngo-dinh-diem]
  - id: cal.1963-10-11.program
    when: Oct. 11
    date: '1963-10-11'
    thread: women
    also: [amendments]
    c: 'The Commission on the Status of Women reports, *American Women*. Child care, paid maternity leave, equal opportunity in hiring; the Fifth and Fourteenth Amendments, not an equal rights amendment. Nov. 1, E.O. 11126: a committee of officials and a citizens'' council to carry on.'
    n: 'Remarks at Presentation of the Final Report of the President''s Commission on the Status of Women, [1963 Pub. Papers 780](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=838) (Oct. 11, 1963); [Exec. Order No. 11,126](https://www.presidency.ucsb.edu/documents/executive-order-11126-establishing-committee-and-council-relating-the-status-women) (Nov. 1, 1963). To check: [[w.women-american-women]]; [[w.harrison-on-account-of-sex]]; [[w.zelman-women-work-and-national]]; [[w.cobble-other-womens-movement]]; [[w.peterson-restless]]. See [[cal.1961-12-14.program]]. Names: Peterson.'
    tags: [name:peterson-esther, name:kennedy-john-f]
  - id: cal.1963-10-11.opinion
    when: Oct. 11
    date: '1963-10-11'
    thread: opinion
    c: 'Gallup, July 18–23: satisfied with family income, whites 68 percent, nonwhites 38; with housing, 76 and 43; with their work, 90 and 54; with their children''s education, 69 and 42; with their prospects, 67 and 45.'
    n: '[[w.gallup-poll]], III, 1844.'
  - id: cal.1963-10-13.opinion
    when: Oct. 13
    date: '1963-10-13'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Sept. 12–17: the Kennedy administration pushing integration too fast, 50 percent; not fast enough, 11; about right, 27.'
    n: '[[w.gallup-poll]], III, 1844. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-14.defense
    when: Oct. 14
    date: '1963-10-14'
    thread: defense
    c: 'Korth resigns as Secretary of the Navy, effective Nov. 1. His letters in office for the Continental National Bank of Fort Worth, a lender to General Dynamics, the TFX''s builder, before McClellan''s subcommittee. Kennedy, Oct. 31: "no evidence" Korth acted improperly. Nitze sworn Nov. 29.'
    n: 'The President''s News Conference, [1963 Pub. Papers 826](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=884) (Oct. 31, 1963). To check: [[w.art-tfx-decision]]. See [[cal.1963-02-26.defense]]. Names: Korth, Nitze, McClellan.'
    tags: [name:korth-fred, name:mcclellan-john-l, name:nitze-paul, name:kennedy-john-f]
  - id: cal.1963-10-15.state-and-city-finance-or
    when: Oct. 15
    date: '1963-10-15'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: Oregon, special election. Ballot Measure 1, the legislature's Personal and Corporation Income Tax Bill, referred by petition, refused, 103,737 to 362,845, 22.2 percent.
    n: 'Votes: [Or. *Official Abstract of Votes, Special Election, October 15, 1963*](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411024/File/document). To check: [[w.peirce-pacific-states-of-america]].'
    tags: [state:or]
  - id: cal.1963-10-15.japan-and-korea
    when: Oct. 15
    date: '1963-10-15'
    thread: japan-and-korea-civilian-rule
    c: Korea's presidential election. Park 4,702,640; Yun Po-sun 4,546,614; three others 1,031,944. The voting orderly. The Assembly elected Nov. 26; Park inaugurated Dec. 17.
    n: 'FRUS 1961–63, XXII, docs. [314](https://history.state.gov/historicaldocuments/frus1961-63v22/d314), [315](https://history.state.gov/historicaldocuments/frus1961-63v22/d315), [316](https://history.state.gov/historicaldocuments/frus1961-63v22/d316). To check: [[w.brazinsky-nation-building-in-south]]; [[w.han-failure-of-democracy-in]]. See [[cal.1963-02-18.japan-and-korea]]. Names: Park, Yun.'
    tags: [name:park-chung-hee, name:yun-po-sun]
  - id: cal.1963-10-16.opinion-5
    when: Oct. 16
    date: '1963-10-16'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Sept. 12–17: Kennedy 55, Goldwater 39, undecided, others 6.'
    n: '[[w.gallup-poll]], III, 1844–45. Names: Goldwater.'
    tags: [name:kennedy-john-f, name:goldwater-barry-m]
  - id: cal.1963-10-17.europe-and-the-alliance
    when: Oct. 17
    date: '1963-10-17'
    thread: cyprus
    c: 'Cyprus. NSAM 266: Kennedy "concerned over reports that we may be headed for trouble in Cyprus"; State''s recommendations by Oct. 28.'
    n: '[NSAM No. 266](https://history.state.gov/historicaldocuments/frus1961-63v16/d290) (Oct. 17, 1963). [FRUS 1961–63, XVI, doc. 292](https://history.state.gov/historicaldocuments/frus1961-63v16/d292) (State''s reply, Oct. 28). To check: [[w.ball-past-has-another-pattern]]; [[w.nicolet-united-states-policy-towards]]; [[w.miller-united-states-and-the]]. See [[cal.1962-06-05.europe-and-the-alliance]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge]
  - id: cal.1963-10-18.defense-soviet-forces
    when: Oct. 18
    date: '1963-10-18'
    thread: defense-soviet-forces
    c: NIE 11-8-63, Soviet Capabilities for Strategic Attack. 18 ICBM complexes, about 220 launchers in all stages; 105–120 operational Oct. 1, about 20 in hard silos; 205–235 by mid-1964, 250–350 by mid-1965. About 50 ballistic missile submarines, 11 nuclear. Air Force intelligence, 145–160 now.
    n: '[FRUS 1961–63, VIII, doc. 144](https://history.state.gov/historicaldocuments/frus1961-63v08/d144). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
    tags: [name:mccone-john-a]
  - id: cal.1963-10-19.legislatures-tx
    when: Oct. 19
    date: '1963-10-19'
    thread: legislatures
    c: A three-judge court voids Texas's congressional districts, from 128 percent above the ideal to 48 below, on the suit of George Bush and others; the 1964 elections to be at large unless the Legislature redistricts. The order deferred for the State to seek a stay.
    n: '*Bush v. Martin*, [224 F. Supp. 499](https://static.case.law/f-supp/224/case-pdfs/0499-01.pdf) (S.D. Tex. 1963); *Bush v. Martin*, [251 F. Supp. 484](https://static.case.law/f-supp/251/case-pdfs/0484-01.pdf) (S.D. Tex. 1966), recites it. To check: [[w.dixon-democratic-representation]]; [[w.cortner-apportionment-cases]]. Names: Bush.'
    tags: [state:tx, name:bush-george-h-w]
  - id: cal.1963-10-20.africa-algeria-morocco
    when: Oct. 20
    date: '1963-10-20'
    thread: africa-algeria-morocco
    c: 'Hassan asks for American arms against Algeria. Komer to Kennedy, Oct. 21: stall.'
    n: '[FRUS 1961–63, XXI, doc. 13](https://history.state.gov/historicaldocuments/frus1961-63v21/d13). See [[cal.1963-10-08.africa]]. Names: Hassan II, Komer, Kennedy.'
    tags: [name:hassan-ii, name:komer-robert-w, name:kennedy-john-f]
  - id: cal.1963-10-22.specials
    when: Oct. 22
    date: '1963-10-22'
    thread: specials
    c: North Dakota 1st, special. Mark Andrews (R) holds Nygaard's seat over Hove (Democratic-NPL), 47,062 to 42,470, 49.1 percent; a conservative Republican 5,995, 6.3 percent.
    n: 'Votes: N.D. State Board of Canvassers, *Abstract of Votes*, special election, Oct. 22, 1963 ([sos.nd.gov](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-10-22-special.pdf)). See [[cal.1961-04-04.states-and-cities]]. Names: Mark Andrews, Nygaard, Hove.'
    tags: [special:1963-10-22-h-ND-1, name:andrews-mark, name:nygaard-hjalmar-c, name:hove-john]
  - id: cal.1963-10-22.desegregation-schools-chicago
    when: Oct. 22
    date: '1963-10-22'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: 'Chicago. "Freedom Day": the Coordinating Council of Community Organizations'' boycott of the public schools against Superintendent Willis, his mobile classrooms ("Willis Wagons") at Negro schools, and the schools'' segregation. Nearly half the city''s pupils stay out; some 10,000 march to the Board of Education. Willis had resigned in October over the board''s change to his transfer plan, and returned when the board gave way (Check the dates).'
    n: '[Wikipedia, "Chicago Public Schools boycott"](https://en.wikipedia.org/wiki/Chicago_Public_Schools_boycott) (Check: the Board of Education''s attendance figures). To check: [[w.anderson-confronting-the-color-line]]; [[w.danns-something-better-for-our]]; [[w.ralph-northern-protest]]; [[w.cohen-american-pharaoh]]. Names: Willis.'
    tags: [state:il, city:chicago, name:willis-benjamin-c]
  - id: cal.1963-10-23.opinion
    when: Oct. 23
    date: '1963-10-23'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified Jew nominated by their party, 77 percent; for a Negro, 47, against 45 who would not; for a woman, 55, against 41.'
    n: '[[w.gallup-poll]], III, 1846.'
  - id: cal.1963-10-24.program
    when: Oct. 24
    date: '1963-10-24'
    thread: health
    c: 'Maternal and Child Health and Mental Retardation Planning Amendments signed, [77 Stat. 273](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg273.pdf): prenatal and infant care for mothers at risk; grants for State plans against retardation.'
    n: 'Remarks Upon Signing the Maternal and Child Health and Mental Retardation Planning Bill, [1963 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=869) (Oct. 24, 1963). To check: [[w.shorter-kennedy-family-and-the]]; [[w.blumenthal-heart-of-power]]. See [[cal.1963-02-05.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-24.right-and-the-military
    when: Oct. 24
    date: '1963-10-24'
    thread: right-and-the-military
    c: Stevenson in Dallas for UN Day. Heckled, spat on, struck on the head with a placard. Walker's "U.S. Day" rally the night before.
    n: 'To check: [[w.minutaglio-dallas-1963]]; [[w.miller-nut-country]]; [[w.manchester-death-of-a-president]]; [[w.martin-adlai-stevenson-and-the]]. See [[cal.1961-03.right-and-the-military]]. Names: Stevenson, Walker.'
    tags: [name:stevenson-adlai-e, name:walker-edwin-a]
  - id: cal.1963-10-25.opinion
    when: Oct. 25
    date: '1963-10-25'
    thread: opinion
    also: [trade]
    c: 'Gallup, Oct. 11–16: selling surplus wheat to Russia, 60 percent approve, 31 disapprove; Republicans 51 and 42. More trade with Russia, 55 for, 33 against.'
    n: '[[w.gallup-poll]], III, 1847.'
  - id: cal.1963-10-27.opinion-5
    when: Oct. 27
    date: '1963-10-27'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Oct. 11–16: Kennedy 55, Goldwater 39, undecided, others 6. South, undecided excluded: Goldwater 55, Kennedy 45.'
    n: '[[w.gallup-poll]], III, 1847. Names: Goldwater.'
    tags: [name:kennedy-john-f, name:goldwater-barry-m]
  - id: cal.1963-10-27.vietnam
    when: Oct. 27
    date: '1963-10-27'
    thread: vietnam
    c: 'Lodge with Diệm, a Sunday, by plane and helicopter to Dalat. No idea of Lodge''s accepted; asked for one thing to reassure American opinion, Diệm offers nothing. Lodge: Diệm "cut off from present" and "simply unbelievably stubborn."'
    n: 'FRUS 1961–63, IV, docs. [221](https://history.state.gov/historicaldocuments/frus1961-63v04/d221) (Lodge, Oct. 28), [220](https://history.state.gov/historicaldocuments/frus1961-63v04/d220). [[w.miller-misalliance]], 316–17. See [[cal.1963-05-08.vietnam]]. Names: Lodge, Diệm.'
    tags: [name:lodge-henry-cabot, name:ngo-dinh-diem, place:dalat]
  - id: cal.1963-10-28.cities-and-housing-nyc
    when: Oct. 28
    date: '1963-10-28'
    thread: cities-and-housing
    c: New York. The Pennsylvania Railroad begins to pull down Pennsylvania Station's building above the tracks, for Madison Square Garden and two office towers; trains run on below.
    n: '[Wikipedia, "Pennsylvania Station (1910–1963)"](https://en.wikipedia.org/wiki/Pennsylvania_Station_(1910%E2%80%931963)). To check: [[w.wood-preserving-new-york]].'
    tags: [state:ny, city:nyc]
  - id: cal.1963-10-28.africa-algeria-morocco
    when: Oct. 28
    date: '1963-10-28'
    thread: africa-algeria-morocco
    c: Kennedy approves a $10 million supporting assistance loan to Morocco and ammunition already programmed, and concern at Cuban arms for Algeria.
    n: '[FRUS 1961–63, XXI, doc. 24](https://history.state.gov/historicaldocuments/frus1961-63v21/d24). See [[cal.1963-10-08.africa]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-10-28.baker
    when: Oct. 28
    date: '1963-10-28'
    thread: baker
    also: [robert-kennedy]
    c: 'After the weekend''s stories of Ellen Rometsch, deported in August, Robert Kennedy asks Hoover to have the Senate leaders keep sex out of the Rules Committee''s inquiry. Hoover sees Mansfield and Dirksen: nothing in it touches the national security.'
    n: '[[w.caro-passage-of-power]], 290–91. Check: the FBI''s record of the meeting. See [[cal.1963-10-07.baker]]. Names: Robert Kennedy, Hoover, Mansfield, Dirksen.'
    tags: [name:kennedy-robert-f, name:hoover-j-edgar, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1963-10-29.civil-rights-bill
    when: Oct. 29
    date: '1963-10-29'
    thread: civil-rights-bill
    c: 'House Judiciary Committee approves the civil rights bill, 20–12: the Celler–McCulloch substitute, agreed with the Justice Department and Halleck, in place of the subcommittee''s broader bill. Part III dropped; an equal employment commission added. Kennedy: "comprehensive and fair." Check the vote.'
    n: 'Statement by the President Following Action on the Civil Rights Bill by the House Committee on the Judiciary, [1963 Pub. Papers 820](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=878) (Oct. 29, 1963). H.R. Rep. No. 88-914 (1963). [[w.rosenberg-kennedy-johnson-and-the]], "The Bill Moves Forward". To check: [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.risen-bill-of-the-century]]; [[w.scheele-charlie-halleck]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler, McCulloch, Halleck.'
    tags: [name:celler-emanuel, name:mcculloch-william-m, name:halleck-charles-a, name:kennedy-john-f]
  - id: cal.1963-10-29.robert-kennedy
    when: Oct. 29
    date: '1963-10-29'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Meeting with the President on the generals'' plot. Robert Kennedy: Vietnam not Iraq or South America, where a coup is done quickly; to back one is to put the country''s future in the hands of a man little known; Diệm will not quit; the reporting thin. "My view is the minority view."'
    n: '[Kennedy, Johnson, Robert Kennedy and others, 4:25 p.m.](https://prde.upress.virginia.edu/conversations/4022297), JFK Meeting Tape 118_A54.3a-b (PRDE only). [FRUS 1961–63, IV, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234). [[w.gibbons-u-s-government-and]], II, 196–197. See [[cal.1963-09-06.vietnam]]. Made public: FRUS 1961–63, IV (1991). Names: Robert Kennedy, Ngô Đình Diệm.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:ngo-dinh-diem]
  - id: cal.1963-10-30.opinion
    when: Oct. 30
    date: '1963-10-30'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified divorced man nominated by their party, 78 percent; would not, 17. Rockefeller''s remarriage enough to turn them against him, 14.'
    n: '[[w.gallup-poll]], III, 1848. Names: Nelson Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-10-30.africa-algeria-morocco
    when: Oct. 30
    date: '1963-10-30'
    thread: africa-algeria-morocco
    c: A cease-fire agreed at Bamako (Check). Nov. 1, the State Department's support for it.
    n: '[FRUS 1961–63, XXI, doc. 28](https://history.state.gov/historicaldocuments/frus1961-63v21/d28) (circular, Nov. 1). See [[cal.1963-10-08.africa]].'
  - id: cal.1963-10-31.program
    when: Oct. 31
    date: '1963-10-31'
    thread: health
    c: Mental Retardation Facilities and Community Mental Health Centers Construction Act signed, [77 Stat. 282](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg282.pdf). Research centers and university clinics for the retarded; $150 million over three years toward community mental health centers. House conference report, Oct. 21, [299–13](https://voteview.com/rollcall/RH0880078).
    n: 'Remarks Upon Signing Bill for the Construction of Mental Retardation Facilities and Community Mental Health Centers, [1963 Pub. Papers 825](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=883) (Oct. 31, 1963). To check: [[w.foley-community-mental-health-legislation]]. See [[cal.1963-02-05.program]]; [[cal.1963-09-10.program]].'
    tags: [name:kennedy-john-f]
