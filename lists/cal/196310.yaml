  - id: cal.1963-10-25.china-leadership
    when: Oct. 25
    date: '1963-10-25'
    place: changsha
    thread: china-leadership
    c: 'Changsha. Mao drafts the Central Committee''s notice on printing and publicizing the rural socialist-education policies, and sends it to Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Xie Fuzhi, Luo Ruiqing, Chen Boda, Yang Shangkun and Tian Jiaying to discuss; and, with Wang Renzhong, takes up the revision of the document: educate the cadres. He talks also of his not being Party chairman and leader, of no life tenure.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 25, 1963 (the entries for Oct. 23 and 25). [[w.zhou-enlai-nianpu-1949]], II, 592 (Oct. 25 and 31, 1963: Mao''s instruction to Liu, Zhou, Zhu De and Deng to read the draft of the concrete policies of the rural socialist education movement and meet on it; Oct. 31 Zhou attends the Politburo, which basically adopts it, to be revised by the Standing Committee and sent down; it goes down Nov. 14 as "Provisions on Some Concrete Policies in the Rural Socialist Education Movement [Draft]"); [[w.jianguo-yilai-mao-zedong]], XVII, 80, 85 (Oct. 26, 1963; Mao''s note of Oct. 26 sending the draft to the ten readers (Liu, Zhou, Zhu, Deng, Peng, Xie Fuzhi, Luo Ruiqing, Chen Boda, Yang Shangkun, Tian Jiaying) to meet once on it: if it can be done, so; if not, talk again; the notice itself drafted Oct. 25 (note 1)); [[w.macfarquhar-origins-of-the-cultural]], III, 343 (Mao takes up the draft with East China and Central-South leaders, Wang Renzhong among them, and returns it to the Politburo with comments); [[w.mao-zedong-zhuan]], VI, ch. 72 (Oct. 25 Mao drafts the notice (n.22); Oct. 26 he sends the revised Latter Ten Points and the notice to Liu, Zhou, Zhu De, Deng, Peng Zhen, Luo Ruiqing, Chen Boda, Xie Fuzhi, Yang Shangkun and Tian Jiaying for a meeting: "if approved, so be it; if not, we will talk again" (n.23)). [[w.peng-zhen-nianpu-1902]], IV, 296 (Oct. 26, 1963; Mao settles the Center''s draft concrete policies of rural socialist education (the "Later Ten Points" 后十条), "an important paper," and drafts the notice printing and publicizing the two papers, for Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Luo Ruiqing, Chen Boda, Xie Fuzhi, Yang Shangkun and Tian Jiaying to discuss: if acceptable, act; if not, confer again). Made public: 1997. Check: the *Mao Zedong zhuan* has the notice drafted Oct. 25 (VI, ch. 72 n.22) and sent to Liu, Zhou, Zhu De, Deng and the others Oct. 26 (n.23). To check: Central Committee, Decision on some current problems in rural work (draft), the "First Ten Points," issued May 20, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 85 n.1a); Central Committee, Provisions on some concrete policies in the rural socialist education movement (draft), the "Later Ten Points," Sept. 1963 (first titled "Some concrete policy questions in the rural socialist education movement"; retitled Nov. 14, 1963) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 85 n.1b); Mao Zedong 毛泽东, note on the draft notice on printing and publicizing the two documents on the rural socialist education movement (manuscript 手稿), Oct. 26, 1963 (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.23). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Xie Fuzhi, Luo Ruiqing, Chen Boda, Yang Shangkun, Tian Jiaying, Wang Renzhong.'
