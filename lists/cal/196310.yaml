  - id: cal.1963-10-02.opinion
    when: Oct. 2
    date: '1963-10-02'
    thread: opinion
    c: 'Gallup, Sept. 12–17: the most important problem, racial problems, 52 percent; international problems, 25; unemployment, 5; taxes, 5. The Democrats better able to handle it, 30; the Republicans, 20.'
    n: '[[w.gallup-poll]], III, 1842.'
  - id: cal.1963-10-02.vietnam-saigon
    when: Oct. 2
    date: '1963-10-02'
    thread: vietnam-saigon
    c: 'Conein meets Trần Văn Đôn by chance at the Saigon airport, the CIA''s first contact with the generals since August. That night at Nha Trang, an hour alone, cleared by Trueheart, Conein to elicit information only: Dương Văn Minh wants to see him, Oct. 5 at the Joint General Staff; the generals "now have a plan."'
    n: '[FRUS 1961–63, IV, doc. 171](https://history.state.gov/historicaldocuments/frus1961-63v04/d171) (the station, Oct. 3). [[w.miller-misalliance]], 311 (the encounter, the first contact since August; the meeting that evening; Minh''s wish to see Conein; a new plan). To check: "Contacts with Vietnamese Generals, 23 August through 23 October 1963," Oct. 23, 1963, DDRS; Conein''s testimony before the Senate Select Committee on Intelligence Activities, June 20, 1975, box 47, Church Committee Records, NARA (both cited by [[w.miller-misalliance]], 311 n.109). See [[cal.1963-05-08.vietnam]]. Names: Conein, Trần Văn Đôn, Trueheart, Dương Văn Minh.'
    src:
      c: ced96bcb
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d171: all'
        - 'w.miller-misalliance 311: all'
        - 'via w.miller-misalliance 311 n.109a: all'
        - 'via w.miller-misalliance 311 n.109c: all'
    tags: [name:conein-lucien, name:tran-van-don, name:trueheart-william-c, name:duong-van-minh, place:saigon, place:nha-trang]
  - id: cal.1963-10-02.republican-party-congress
    when: Oct. 2
    date: '1963-10-02'
    thread: republican-party-congress
    also: [vietnam]
    c: 'Bob Wilson (R-Cal.), chairman of the Republican Congressional Committee, against the "Kennedy Klan": "We have done nothing but back down, give in, retreat and lose ground before Communism"; Southeast Asia "one of our most glaring failures."'
    n: '[[w.johns-vietnams-second-front]], 37. To check: the speech, Oct. 2, 1963, box 30/1, John J. Rhodes Papers (cited by [[w.johns-vietnams-second-front]], 37 n.103). Names: Wilson, Kennedy.'
    src:
      c: c715fa81
      rows:
        - 'w.johns-vietnams-second-front 37: all'
        - 'via w.johns-vietnams-second-front 37 n.103: all'
    tags: [name:wilson-bob, name:kennedy-john-f]
  - id: cal.1963-10-03.latin-america
    when: Oct. 3
    date: '1963-10-03'
    thread: latin-america
    c: 'Honduras. The army ousts Villeda Morales; López Arellano takes power. Eight days after Bosch''s fall. Oct. 4, relations with both broken, aid and military assistance stopped. Kennedy, Oct. 9: "we are opposed to coups."'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 159](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d159); [FRUS 1961–63, XII, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v12/d359). The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825) (Oct. 9, 1963). To check: [[w.lafeber-inevitable-revolutions]]; [[w.morris-honduras]]; [[w.rabe-most-dangerous-area-in]]; [[w.rabe-killing-zone]]; [[w.martin-kennedy-and-latin-america]]. See [[cal.1962-12-20.latin-america]]; [[cal.1963-09-25.latin-america]]. Names: Villeda Morales, López Arellano, Bosch.'
    tags: [name:villeda-morales-jose-ramon, name:lopez-arellano-oswaldo, name:bosch-juan, name:kennedy-john-f]
  - id: cal.1963-10-04.opinion
    when: Oct. 4
    date: '1963-10-04'
    thread: opinion
    c: 'Gallup, Aug. 15–20: would vote for a well-qualified Catholic nominated for President by their party, 84 percent; would not, 13. In the South, 71 and 26.'
    n: '[[w.gallup-poll]], III, 1843.'
  - id: cal.1963-10-04.antisubversion-la
    when: Oct. 4
    date: '1963-10-04'
    thread: antisubversion
    c: New Orleans. State and city police, directed by the staff of the Joint Legislative Committee on Un-American Activities, raid the homes and offices of Dombrowski, executive director of the Southern Conference Educational Fund, and two lawyers; the three arrested under the Subversive Activities and Communist Control Law and the Communist Propaganda Control Law, their files seized. Later in October a State judge quashes the warrants.
    n: '*Dombrowski v. Pfister*, [380 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380479/usrep380479.pdf) (1965); Wisdom, dissenting, in [227 F. Supp. 556](https://static.case.law/f-supp/227/case-pdfs/0556-01.pdf) (E.D. La. 1964). To check: [[w.fairclough-race-and-democracy]]. Names: Dombrowski.'
    tags: [name:dombrowski-james-a, state:la, city:new-orleans]
  - id: cal.1963-10-04.baker
    when: Oct. 4
    date: '1963-10-04'
    thread: baker
    c: 'Mansfield to reporters: Baker not asked to resign, nor offered to; no reason he should. "Bobby''s work in the Senate has been excellent"; Serv-U "affects his activities outside the Senate."'
    n: '[[w.caro-passage-of-power]], 288. To check: the *New York Times* and the *Washington Post*, Oct. 5, 1963 (cited by [[w.caro-passage-of-power]], 288). Names: Mansfield, Baker.'
    src:
      c: 5443b5e3
      rows:
        - 'w.caro-passage-of-power 288: all'
        - 'via w.caro-passage-of-power 288 n.bobbys-work: all'
    tags: [name:mansfield-mike, name:baker-robert-g]
  - id: cal.1963-10-05.vietnam
    when: Oct. 5
    date: '1963-10-05'
    thread: vietnam
    c: Conein with Dương Văn Minh at Minh's headquarters, cleared by Lodge. Minh must know the American position on a change of government; no support asked, only assurance it will not be thwarted. Three plans, the first the assassination of Nhu and Ngô Đình Cẩn, Diệm kept in office.
    n: '[FRUS 1961–63, IV, doc. 177](https://history.state.gov/historicaldocuments/frus1961-63v04/d177). [[w.miller-misalliance]], 311–12 (the meeting; the American position asked; assassination among the scenarios). To check: "Contacts with Vietnamese Generals, 23 August through 23 October 1963," Oct. 23, 1963, DDRS; Conein''s testimony before the Senate Select Committee on Intelligence Activities, June 20, 1975, box 47, Church Committee Records, NARA (both cited by [[w.miller-misalliance]], 311 n.109). See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 767–68 (1971). Names: Conein, Dương Văn Minh, Lodge, Nhu, Ngô Đình Cẩn, Diệm.'
    src:
      c: 52c85ac7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d177: all'
