  - id: cal.1963-10-09.trade
    when: Oct. 9
    date: '1963-10-09'
    time: 1963-10-09T22:00Z
    thread: trade
    also: [vietnam, space, testing, elections-1964, goldwater]
    c: 'Press conference. Private dealers may sell surplus wheat to the Soviet Union and Eastern Europe, for cash or on normal credit, in American ships where available: 4 million tons, about $250 million. The NSC agreed. Report to Congress, Oct. 10: no action required. On Vietnam: no "significant changes" in the month since he asked for changes of policy and personnel. On the reported agreement in principle to keep nuclear weapons out of space: "there is not an agreement." The United States will not put weapons in space; the Soviet Union says it does not intend to. "There is no way we can verify that, but we are glad to hear the intention." Asked if he expects Goldwater to be the nominee: "I think he can do it. I think it is possible for him to do it. But he has a long road to go." Goldwater "has made very clear what he is opposed to, what he is for. I have gotten the idea." From his trips: "we are going to have a hard, close fight in 1964."'
    n: 'The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825) (Oct. 9, 1963), at 769 (weapons in space), 771 (Goldwater); Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the Soviet Union, [1963 Pub. Papers 776](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=834) (Oct. 10, 1963). Opinion: [42 Op. Att''y Gen. 229](https://archive.org/details/op-atty-gen/042/page/n253/mode/1up) (1963), Robert Kennedy to Rusk, Oct. 9: sales on normal commercial credit not loans under the Johnson Act; released with the letter, [[w.department-of-state-bulletin]], [Oct. 28, 1963, 661](https://archive.org/details/departmentofstat4963unit/page/661/mode/1up). [FRUS 1961–63, V, doc. 359](https://history.state.gov/historicaldocuments/frus1961-63v05/d359). [[w.selverstone-kennedy-withdrawal]], 190 (Vietnam); [[w.sorensen-kennedy]], 742 (the decision). [[w.reeves-president-kennedy]], 619 (the wheat). [[w.ball-past-has-another-pattern]], 201–02 (the announcement; American ships). [[w.sorensen-kennedy]], 743 (the words). [[w.white-suite-3505]], 235 (Goldwater; the words, misquoted "a long way to go"). To check: [[w.beschloss-crisis-years]]. See [[cal.1963-09-16.trade]]. Names: Freeman, Kennedy, Goldwater.'
