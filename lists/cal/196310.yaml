        - 'via w.caro-passage-of-power 288 n.bobbys-work: all'
    tags: [name:mansfield-mike, name:baker-robert-g]
  - id: cal.1963-10-05.vietnam
    when: Oct. 5
    date: '1963-10-05'
    thread: vietnam
    c: Conein with Dương Văn Minh at Minh's headquarters, cleared by Lodge. Minh must know the American position on a change of government; no support asked, only assurance it will not be thwarted. Three plans, the first the assassination of Nhu and Ngô Đình Cẩn, Diệm kept in office.
    n: '[FRUS 1961–63, IV, doc. 177](https://history.state.gov/historicaldocuments/frus1961-63v04/d177). [[w.miller-misalliance]], 311–12 (the meeting; the American position asked; assassination among the scenarios); [[w.moyar-triumph-forsaken]], 255. [[w.reeves-president-kennedy]], 616–17. To check: "Contacts with Vietnamese Generals, 23 August through 23 October 1963," Oct. 23, 1963, DDRS; Conein''s testimony before the Senate Select Committee on Intelligence Activities, June 20, 1975, box 47, Church Committee Records, NARA (both cited by [[w.miller-misalliance]], 311 n.109). See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 767–68 (1971). Names: Conein, Dương Văn Minh, Lodge, Nhu, Ngô Đình Cẩn, Diệm.'
