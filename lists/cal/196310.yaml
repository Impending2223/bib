    when: Oct. 23
    date: '1963-10-23'
    time: 1963-10-23T03:00Z
    place: peking
    thread: china-leadership
    also: [china]
    c: Zhou Enlai receives Edgar Faure, former Prime Minister of France and representative of President de Gaulle, in talks on establishing Sino-French relations. The difficulty is France's relation with Taiwan, to be settled by a reasonable way. Before Taiwan is settled formal relations and an exchange of ambassadors cannot be had, but informal ones can, such as a trade office first, semi-official or private; and if France and China establish relations France should keep no diplomatic staff or office in Taiwan; Britain's way is unpleasant for both. Three months of talks on establishing relations followed.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 590 (Oct. 23, 1963); [[w.zhou-enlai-waijiao-huodong]], 374 (Oct. 23, 1963; 上午11时, 中南海西花厅, first talks); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 304 (Oct. 21–Nov. 5, 1963; Edgar Faure, former Prime Minister of France, and his wife visit China; Mao and Liu Shaoqi each receive him; Zhou and Chen Yi hold several earnest and frank talks with him); [[w.jian-zhou-enlai]], 506 (Faure back in China with de Gaulle''s letter (Oct. 21), in Peking Oct. 22; Zhou, the next morning: three options; Faure: France wants ambassadors); [[w.friedman-shadow-cold-war]], 116 (Faure, De Gaulle''s envoy, sent to China secretly in October 1963). Made public: 1993. To check: Zhou''s first conversation with Faure, October 23, 1963 (cited by [[w.jian-zhou-enlai]], 506 n.54); [[w.suri-power-and-protest]], 71–87 (cited by [[w.friedman-shadow-cold-war]], 116 n.65). Names: Zhou Enlai, Edgar Faure, De Gaulle.'
