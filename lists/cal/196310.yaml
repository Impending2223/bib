  - id: cal.1963-10-01.china-leadership-10
    when: Oct. 1
    date: '1963-10-01'
    thread: china-leadership
    also: [soviet-union]
    c: 'Deng Xiaoping 邓小平 reads the International Liaison Department''s report on handling the greetings and letters sent by fraternal parties for National Day by sorting them into left, center and right. Comment: handle it as the Premier''s opinion. Zhou Enlai 周恩来: not many parties will send greetings; of those that do, few will abuse China in the open, and any such would be oblique; having greeted China, they should not be sorted so clearly, which gives a handle; better print all, or the essentials of all, in the order received, leaving readers to judge.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1775 (Oct. 1, 1963). The words: 批示 (III, 1775). Deng: 即照总理意见办理 (III, 1775). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Zhou Enlai.'
    src:
      c: 5fcad425
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1775: all'
    tags: [polity:prc, name:deng-xiaoping, name:zhou-enlai, vis:only:prc]
