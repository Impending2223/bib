  - id: cal.1963-10-29.cuba
    when: Oct. 29
    date: '1963-10-29'
    thread: cuba
    c: FitzGerald, head of the CIA's Cuban operations, meets Rolando Cubela (AM/LASH) abroad, holding himself out, with Helms's assent, as Robert Kennedy's personal representative; Robert Kennedy not consulted. Cubela asks a means of killing Castro without being killed himself. By FitzGerald's account, the United States would back a coup but have "no part of an attempt on Castro's life"; the case officer does not recall it.
    n: '[S. Rep. No. 94-465, 87–88 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=98) ("late fall 1963"). [[w.schlesinger-robert-kennedy-and-his]], 547 (the day); [[w.thomas-robert-kennedy]], 271 (Oct. 29, a CIA safe house in Paris; Cubela asks a high-powered rifle with a sniper''s scope and a silencer); [[w.jones-bay-of-pigs]], 164–65 (Paris, Oct. 29: FitzGerald with Sanchez, as Robert Kennedy''s "personal representative"; Cubela asks for rifles, scopes and explosives); [[w.sen-church-alleged-assassination-plots]], 174–75 (Fitzgerald "met AM/LASH in October 1963," as the personal representative of Robert Kennedy, with "assurances of full support" should AM/LASH overthrow Castro; the I.G. Report, 88–89: Helms and Fitzgerald decided "it was not necessary to seek approval from Robert Kennedy"; Helms, 1975, no such recollection; not the day, C–E). Made public: the Church Committee''s interim report, Nov. 20, 1975. Check: Thomas puts the meeting in Paris (271). To check: S. Rep. No. 94-755, bk; Sanchez testimony, July 29, 1975; the contact plan quoted in Helms testimony, June 13, 1975, 116–17, Church Committee; [[w.thomas-very-best-men]], 299–300 (cited by [[w.jones-bay-of-pigs]], 165 n.29). V, 17, 74–75 (1976) (cited by [[w.schlesinger-robert-kennedy-and-his]], 547 n.60). Names: Helms, Robert Kennedy, Castro.'
