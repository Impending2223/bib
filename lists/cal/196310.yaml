  - id: cal.1963-10.china-leadership
    when: Oct.–Nov.
    date: 1963-10
    thread: china-leadership
    c: 'Mao''s changes to the draft Provisions on some concrete policies in the rural socialist education movement, the "Later Ten Points." Leaders of province, prefecture and county first to "wash hands and bathe" in the Five Antis; work teams to advise basic-level cadres and not take over; point and surface work joined, the point three months, the surface about twenty days. A charter for the poor and lower-middle peasants'' associations to be drafted in the first half of 1964. Of the four types of persons doing sabotage: none killed, over 95 percent not arrested; arrests only where the crime is great, the proof sure and most of the masses ask it; killing only with the Center''s approval.'
