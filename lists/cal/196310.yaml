    c: 'The White House, 11:05 a.m., recorded: Kennedy with McNamara, McCone, Robert Kennedy, McGeorge Bundy and others on the generals'' plot. By Moyar''s transcription, McNamara: the matter to be taken out of "very amateurish hands," Lodge''s and Conein''s, "a press-minded ambassador and an unstable Frenchman"; Kennedy, of Lodge: "he''s there, and because he''s there we can''t fire him."'
