  - id: cal.1963-10-12.china-leadership
    when: Oct. 12
    date: '1963-10-12'
    thread: china-leadership
    c: 'Zhou Enlai, report to the delegates of five specialized conferences of the Central Committee and State Council, on planning, city work, finance, finance and trade, and Sino-Soviet and Sino-Mongolian border defense. To build an independent economic system and the four modernizations China must find its own road; it has no full, successful set of experience yet. For the two years of adjustment the key is far-seeing field investigation in every branch, which will fix the direction and the fifteen-year plan; each commission to go down in batches, to over 800 key farm counties and over 100 key cities with over 80 percent of industrial output. The 1963 plan, set before the northern floods and southern drought, is now tight. Departments: overall balance, self-reliance and thrift, the mass line, work with the hands.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 586 (Oct. 12, 1963). Continues 587. Made public: 1997. Names: Zhou Enlai.'
