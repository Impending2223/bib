    n: '[[w.dittmer-local-people]], 200–202. To check: SNCC press release, "COFO Maps," and Edwin King, "Freedom Vote," unpublished manuscript, 1969, 40 (cited by [[w.dittmer-local-people]], 202 n.18). See [[cal.1963-08-06.mississippi-ms]]. Names: Henry.'
