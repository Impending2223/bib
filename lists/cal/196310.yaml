    thread: robert-kennedy
    also: [vietnam]
    c: 'Meeting with the President on the generals'' plot. Robert Kennedy: Vietnam not Iraq or South America, where a coup is done quickly; to back one is to put the country''s future in the hands of a man little known; Diệm will not quit; the reporting thin. "My view is the minority view."'
    n: '[Kennedy, Johnson, Robert Kennedy and others, 4:25 p.m.](https://prde.upress.virginia.edu/conversations/4022297), JFK Meeting Tape 118_A54.3a-b (PRDE only). [FRUS 1961–63, IV, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234). [[w.gibbons-u-s-government-and]], II, 196–97 (two meetings that day; Robert Kennedy''s words by Schlesinger''s reading of the summary: the future in the hands of "one man not now known to us," the reports "very thin"); [[w.moyar-triumph-forsaken]], 262–64; [[w.mcnamara-in-retrospect]], ch. 3 at n.43 (McNamara asks who in Saigon heads the coup planning; Taylor and McCone against a coup, McCone''s pitcher "in the box"; Rusk: with Diệm the war would deteriorate). [[w.reeves-president-kennedy]], 640–41 (the meeting; Robert Kennedy against); [[w.thomas-robert-kennedy]], 270 (the afternoon, recorded: "I may be in the minority"; "We''re putting the whole future of the country ... in the hands of somebody we don''t know very well"); [[w.schlesinger-robert-kennedy-and-his]], 721 (the National Security Council meets on Oct. 29; Robert Kennedy: "To support a coup," "would be putting the future of Vietnam and in fact all of Southeast Asia in the hands of one man not now known to us. A failure of a coup risks so much. The reports we have are very thin"; the President observes that, the pro-Diem and anti-Diem forces appearing about equal, an attempt to engineer a coup "would be silly" (n.99: the meeting, 4:20 p.m., RFK Papers); not Iraq or South America, Diệm''s refusal to quit or "the minority view"). To check: recording of meeting, Oct. 29, 1963, Tape No. 118/A54, JFKL, POF, Presidential Recordings (cited by [[w.moyar-triumph-forsaken]], 264 n.81); [FRUS 1961–63, IV, doc. 235](https://history.state.gov/historicaldocuments/frus1961-63v04/d235) (Smith, memorandum of conversation, Oct. 29, 1963; cited by [[w.moyar-triumph-forsaken]], 264 n.81); Mendenhall, memorandum of conversation, Oct. 29, 1963, JFKL, Hilsman Papers, box 4 (cited by [[w.moyar-triumph-forsaken]], 264 n.81); Bundy to Kennedy, Oct. 29, 1963, [FRUS 1961–63, IV, doc. 233](https://history.state.gov/historicaldocuments/frus1961-63v04/d233) (cited by [[w.reeves-president-kennedy]], 640). See [[cal.1963-09-06.vietnam]]. Made public: FRUS 1961–63, IV (1991). Names: Robert Kennedy, Ngô Đình Diệm.'
