  - id: cal.1963-10-09.china-leadership
    when: Oct. 9
    date: '1963-10-09'
    time: 1963-10-09T03:00Z
    place: peking
    thread: china-leadership
    also: [japan]
    c: 'Zhou Enlai receives Ishibashi Tanzan. On a peace treaty with Japan: America''s separate peace and the Japan–Taiwan treaty are the greatest obstacle; China works indirectly, gradually, to win that Japan voids that treaty and signs with it. Of three Japanese feelings for Taiwan, colonialist, militarist and economic, the first two are unjust and opposed; trade with Taiwan China does not oppose. Some in the ruling party set the new China and Taiwan against each other, which ends badly for both. He welcomes the straightforward way of Ishibashi, Matsumura and Takasaki.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 585 (Oct. 9, 1963); [[w.zhou-enlai-waijiao-huodong]], 373–74 (Oct. 9, 1963; 上午11时, 中南海西花厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 302 (Oct. 9, 1963; Zhou receives Ishibashi Tanzan, a former Prime Minister and chairman of the Japanese industrial exhibition society, and tells him of four possible ways to normalize Sino-Japanese relations: Japan voids the Japan–Taiwan treaty and formally signs a treaty with China; Japan does not void it but signs with China, which the Chinese people will not accept; Japan''s present responsible officials, the Prime Minister or Foreign Minister, visit China and declare that they recognize only the People''s Republic, an indirect way; or a former Prime Minister visits China and makes a statement recognizing it; China in fact takes the fourth way and strives for the first, and hopes Ishibashi will work for it). Continues 586. Made public: 1993. Names: Zhou Enlai, Ishibashi Tanzan, Matsumura Kenzo, Takasaki Tatsunosuke.'
