    c: Zhou Enlai and Chen Yi talk with Faure. Both sides should state their wish to establish relations, exchange ambassadors, France recognize the People's Republic and not recognize a second China. In the talks a tacit understanding must be reached beforehand, that France recognizes only one China and does not mean to make Taiwan a second China or an "independent state"; then a solution can sooner or later be found; China makes no bargain of principle on any international question.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 591 (Oct. 25, 1963); [[w.zhou-enlai-waijiao-huodong]], 374 (Oct. 25, 1963; 下午4时30分, 中南海西花厅, 会谈并设便宴); [[w.jian-zhou-enlai]], 506–507 (Oct. 25: Faure''s "personal proposal": France recognizes Peking, Peking answers that this means France has cut off Taiwan); [[w.chen-yi-nianpu]], 992 (Oct. 25, 1963, afternoon; Chen Yi at Zhou''s informal dinner for Faure and his wife). Continues 592. Made public: 1993. To check: Zhou and Chen Yi''s conversation with Faure, October 25, 1964 (so printed; 1963 by the text) (cited by [[w.jian-zhou-enlai]], 507 n.56). Names: Zhou Enlai, Chen Yi, Edgar Faure.'
