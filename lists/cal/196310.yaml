    c: 'White House statement, released by Salinger after the NSC. McNamara and Taylor''s judgment: the major part of the U.S. military task can be completed by the end of 1965; by the end of 1963, 1,000 U.S. military personnel can be withdrawn. The political situation "deeply serious." Kennedy to McNamara, by O''Donnell''s account: "And tell them that means all of the helicopter pilots, too."'
    n: 'White House Statement Following the Return of a Special Mission to South Viet-Nam, [1963 Pub. Papers 759](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=817) (Oct. 2, 1963). Record of Action No. 2472, FRUS 1961–63, IV, doc. [170](https://history.state.gov/historicaldocuments/frus1961-63v04/d170) (the statement, "later released to the press"; Bundy to Lodge, Oct. 3, n.3: "Statement issued after NSC meeting today"). [[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the statement released by Salinger); [[w.selverstone-kennedy-withdrawal]], 167–82 (the statement); [[w.gibbons-u-s-government-and]], II, 184–85 (the statement); [[w.futrell-united-states-air-force]], 190 (1965; the thousand); [[w.taylor-swords-and-plowshares]], 299 (the statement, the 1965 target and the reduction); [[w.zaroulis-who-spoke-up]], 13 (the statement, quoted in part; McNamara predicts most troops home by December 1965); [[w.odonnell-johnny-we-hardly-knew]], 17 (Kennedy''s words; he asks McNamara to announce the thousand and to say all American forces probably out by the end of 1965; McNamara "softened" it to the major part of the task "completed by the end of 1965"); [[w.schlesinger-robert-kennedy-and-his]], 716 (Kennedy''s words as "And tell them that means all the helicopter pilots too," after he took McNamara and Taylor into the Oval Office; the sentence on troop withdrawal deleted from the draft, then restored on McNamara''s direction; no day); [[w.reeves-president-kennedy]], 611–14 (the statement). Check: the day and hour of Kennedy''s words to McNamara (O''Donnell; Schlesinger gives no day). Made public: the same day. To check: William Sullivan, oral history 2, Kennedy Library (cited by [[w.reeves-president-kennedy]], 611); Salinger, press briefing, Oct. 2, 1963, National Security Files, box 314, Kennedy Library (cited by [[w.reeves-president-kennedy]], 614). See [[cal.1963-10-02.vietnam-force-levels]]. Names: Salinger, McNamara, Taylor, Kennedy, O''Donnell.'
