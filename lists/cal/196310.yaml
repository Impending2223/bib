    c: 'Zhu De 朱德 meets the delegation of the South West Africa National Union 西南非洲民族联盟 under its chairman, *Kezhangjiji* 科章吉济, and says: the world situation favors the fight against imperialism 帝国主义; if all Africa''s 非洲 peoples unite, they can settle Africa''s questions; revolution rests chiefly on oneself and on the masses; it cannot win at one stroke; fear no defeat, but sum up its lessons and fight again.'
