    date: 1963-10
    place: ba-dua
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Mỹ Tho. In the stretch of October to December Battalion 261 besieges the Ba Dừa strongpoint, south of Route 4, and its garrison surrenders. The posts of Long Trung, Long Khánh, Long Tiên, Tam Bình, Cẩm Sơn and Xuân Sơn are abandoned; the battalion goes on to free Đông Hòa and Hiệp Đức.
    n: '[[w.lich-su-khang-chien-chong-my]], III, 282. Check: the day.'
