    c: 'At the airport, 7 a.m., officials seeing off Diệm and Lodge: Trần Văn Đôn asks Lodge whether Conein speaks for him; yes. Đôn: it must be thoroughly Vietnamese, the United States not to interfere or stimulate a coup; the army has lost its drive; "we must win before you Americans leave." Lodge: the United States will not thwart; let me see your plans.'
