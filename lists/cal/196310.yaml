  - id: cal.1963-10-02.opinion
    when: Oct. 2
    date: '1963-10-02'
    thread: opinion
    c: 'Gallup, Sept. 12–17: the most important problem, racial problems, 52 percent; international problems, 25; unemployment, 5; taxes, 5. The Democrats better able to handle it, 30; the Republicans, 20.'
    n: '[[w.gallup-poll]], III, 1842.'
  - id: cal.1963-10-02.vietnam-saigon
    when: Oct. 2
    date: '1963-10-02'
    thread: vietnam-saigon
    c: 'Conein meets Trần Văn Đôn by chance at the Saigon airport, the CIA''s first contact with the generals since August. That night at Nha Trang, an hour alone, cleared by Trueheart, Conein to elicit information only: Dương Văn Minh wants to see him, Oct. 5 at the Joint General Staff; the generals "now have a plan."'
    n: '[FRUS 1961–63, IV, doc. 171](https://history.state.gov/historicaldocuments/frus1961-63v04/d171) (the station, Oct. 3). [[w.miller-misalliance]], 311 (the encounter, the first contact since August; the meeting that evening; Minh''s wish to see Conein; a new plan). To check: "Contacts with Vietnamese Generals, 23 August through 23 October 1963," Oct. 23, 1963, DDRS; Conein''s testimony before the Senate Select Committee on Intelligence Activities, June 20, 1975, box 47, Church Committee Records, NARA (both cited by [[w.miller-misalliance]], 311 n.109). See [[cal.1963-05-08.vietnam]]. Names: Conein, Trần Văn Đôn, Trueheart, Dương Văn Minh.'
    src:
