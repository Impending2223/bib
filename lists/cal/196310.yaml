  - id: cal.1963-10-09.china
    when: Oct. 9
    date: '1963-10-09'
    thread: china
    also: [south-asia]
    c: 'The Foreign Ministry sends a note to the Indian embassy, replying to India''s notes of Apr. 3 and Sept. 6. It points out that the five so-called constructive steps the Indian side proposes for settling the boundary differences aim to set up layer upon layer of obstacles and block negotiation. It exposes India''s false stand of accepting the Colombo proposals without reservation: India means to force its own interpretation of the proposals on others, which wholly violates the Colombo conference''s purpose and aim. The Sino-Indian boundary dispute involves the sovereignty of two states and can in no way be settled by international arbitration of any form. China restates its proposal that India at once accept the Colombo proposals on the basis of the principle of equality of the two sides and open direct talks, to stabilize the cease-fire, disengage and settle the boundary question peacefully.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 302–303 (Oct. 9, 1963).'
    src:
