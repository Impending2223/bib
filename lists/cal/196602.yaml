    when: Feb. 28
    date: '1966-02-28'
    thread: south-carolina
    also: [legislatures, court]
    c: '*O''Shields v. McNair*. A three-judge court, Haynsworth writing, upholds the House, 124 members apportioned among the counties by population, and approves, for the 1966 election only, the Act of Feb. 3: a Senate of fifty from 27 districts of whole counties, up to four a district, in place of one senator a county.'
