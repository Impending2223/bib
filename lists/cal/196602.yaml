    n: 'Daily Digest, [112 Cong. Rec. D34](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=32). *New York Times*, Feb. 4, 1966. [[w.gibbons-u-s-government-and]], IV, 223–24. Opened: [[cal.1966-02-04.vietnam]]. [[w.mann-grand-delusion]], 491. Names: Fulbright, Hickenlooper.'
