    c: 'Dutton to Robert Kennedy, against the trip to South Vietnam that Harriman, McNamara and Taylor urge on him: Vietnam "the indigestible lump in this country''s gut";{1} the invitation "an unconscious effort by McNamara, Taylor and Harriman to have you help pull their and President Johnson''s badly charred chestnuts out of a fire that they are all letting get out of control"; "a whole new mess." Let Fulbright and McCarthy "illuminate the problem," Kennedy then adding his support.{2} Kennedy does not go.{3}'
