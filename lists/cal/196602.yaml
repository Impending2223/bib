    when: Feb. 4
    date: '1966-02-04'
    thread: vietnam-hearings
    also: [congress, press-and-broadcasting]
    c: 'The Foreign Relations Committee, Fulbright in the chair, takes up the war in televised hearings on the $415 million of supplemental economic aid, mostly for Vietnam: Bell of AID the first witness on television. Rusk heard Jan. 28, not televised.'
    n: 'Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966). [FRUS 1964–68, IV, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v04/d64) (editorial note). [[w.gibbons-u-s-government-and]], IV, 222–230, 239–251. [[w.mann-grand-delusion]], 491–92. To check: [[w.vietnam-hearings]]; [[w.fry-debating-vietnam]]; [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.friendly-due-to-circumstances-beyond]]. Names: Fulbright, Rusk, Bell.'
