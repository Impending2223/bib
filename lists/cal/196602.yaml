    c: 'Mao approves the revised text of his Jan. 30, 1962 speech (Peng Zhen''s report of Feb. 11: discussed twice, Wang Renzhong joining; small changes): "all read; do as proposed."{1} Issued the same day to county and regiment Party committees.{2}'
