d elections). To check: [[w.karnow-vietnam]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1965-11-28.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Harriman, Wheeler, Freeman, Gardner, Bell, Lodge, Westmoreland, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
