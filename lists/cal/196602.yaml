    when: Feb. 5
    date: '1966-02-05'
    thread: china-hai-rui
    also: [china-mao]
    c: 'Mao to Jiang Qing, on seven papers Peng Zhen sent Feb. 1 about the *Hai Rui* question (editors'' meeting, Zhang Chunqiao''s telephoned views, Guan Feng''s drafts, a letter of Guo Moruo, Guan Feng''s and Deng Tuo''s essays of 1962, the Hai Rui memorials, the actors'' self-criticisms): keep them with you.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 5, 1966 ("同日"). [[w.jianguo-yilai-mao-zedong]], XVIII, 205–206 (Feb. 5, 1966; Mao''s note to Jiang Qing on the list of the seven materials on *Hai Rui*, which Peng Zhen sent Feb. 1 (Xu Liqun''s reports to Peng, Jan. 1966): read, kept with her for now; the seven are listed in note 2 (the six Peking editors'' meeting, Zhang Chunqiao''s telephoned views, Guan Feng and others'' four drafts, Guo Moruo''s letter, Guan Feng''s and Deng Tuo''s essays of 1962, and two more)); [[w.peng-zhen-nianpu-1902]], IV, 465 (Feb. 5, 1966; Mao on the table of contents: "Jiang Qing: these papers to stay with you after reading"); [[w.pu-weihua-zalan-jiu-shijie]], 58 (Mao to Jiang Qing: "Having read these papers, keep them with you for now."). Made public: 2013. To check: Peng Zhen, list of the seven materials on the *Hai Rui Dismissed from Office* question, sent to Mao Zedong Feb. 1, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 205 n.1); Xu Liqun, seven reports to Peng Zhen on the *Hai Rui* question (the editors'' symposium of six Peking papers; Zhang Chunqiao''s telephoned views; the political wording of four drafts of Guan Feng and others; Guo Moruo''s letter; Guan Feng''s and Deng Tuo''s essays of 1962; and two more), Jan. 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 205 n.2). Names: Mao Zedong, Jiang Qing, Peng Zhen, Zhang Chunqiao, Guan Feng, Guo Moruo, Deng Tuo.'
