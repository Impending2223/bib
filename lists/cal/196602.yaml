  - id: cal.1966-02-03.india-and-china-food
    when: Feb. 3
    date: '1966-02-03'
    time: 1966-02-03T18:30Z
    thread: india-and-china-food
    c: 'Califano to Johnson, 1:30 p.m., with Freeman''s compromise before Indira Gandhi''s visit: a stopgap shipment, then six million tons and two-thirds of five more. Johnson on the memorandum: "No, Hell no. Ask Freeman if he has lost his mind? No! No! No!"; by telephone: "Are you out of your fucking mind?"'
    n: '[[w.califano-triumph-and-tragedy-of]], 155. To check: Califano to Johnson, Feb. 3, 1966, 1:30 p.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 155 n.9). Names: Califano, Johnson, Freeman, Indira Gandhi.'
    src:
      c: caf657d7
