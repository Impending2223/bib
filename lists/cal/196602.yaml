    thread: china-third-front
    also: [vietnam-hanoi, china-zhou-foreign, china-liu]
    c: 'Zhou Enlai at the Politburo Standing Committee, Liu Shaoqi presiding, hears Yu Qiuli, back from the Southwest and Northwest, on Third Front construction. On air-raid safety of factories moved to the Third Front: concealment first, but also mountain sites and dispersal, the three combined; the Construction Commission to send someone to Vietnam to see how raids are met.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 12 (Feb. 12, 1966); [[w.deng-xiaoping-nianpu-1904]], III, 1894 (Feb. 12, 1966; afternoon, 下午; Deng with Liu Shaoqi and Zhou Enlai hears Yu Qiuli 余秋里 on his return from the Southwest; of ways of joining factory and commune he says the factory must help the commune bring politics and not let it lie on the state, with mutual aid, mutual benefit and exchange of equal values; of street and commune industry: Shanghai is formidable because its street industry is well developed, small plants, specialized, nimble, much invention; Jinzhou has many small things too; the experience is to be valued and some of the big plants'' production passed to small plants). Made public: 2020. Names: Zhou Enlai, Liu Shaoqi, Yu Qiuli.'
    tags: [name:zhou-enlai, name:liu-shaoqi, polity:prc, vis:only:prc, name:yu-qiuli]
