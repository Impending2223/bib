    also: [china-organization]
    c: 'The Cultural Revolution Five-Man Group meets on the academic criticism since the attack on Wu Han''s *Hai Rui Dismissed from Office*: Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and others, eleven in all;{1} Zhou Yang absent.{2} The draft "Outline Report on the Present Academic Discussion" (the February Outline) follows: the criticism is a long struggle, to go by argument and "letting go," with no hurried political verdicts;{3} Wu Han''s case not to be confined to politics.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 10 (Feb. 3, 1966; the Five-Man Group''s meeting and the Outline, with Peng Zhen and Lu Dingyi to Wuchang on the 8th); [[w.macfarquhar-maos-last-revolution]], 29 (the meeting and the proposal of an outline); [[w.macfarquhar-origins-of-the-cultural]], III, 453–54 (the enlarged meeting: no organizational tie of Wu Han to Peng Dehuai; Mao had approved the play; Liu Ren and another secretary for Deng Tuo; Kang Sheng silent; eleven present, of the group Zhou Yang missing); [[w.mao-zedong-zhuan]], VI, ch. 74 n.26 (early Feb. 1966, by Wu Lengxi''s 吴冷西 recollection: the group of five, Lu Dingyi 陆定一, Kang Sheng 康生, Zhou Yang 周扬 and Wu with Peng Zhen 彭真, met to study the academic discussion, resolved to put it under the Center''s leadership, cool it and make ''a hundred flowers'' real, and drafted the outline for the Standing Committee; day and members present not given). [[w.yang-jisheng-tiandi-fanfu]], I, 120 (Peng Zhen 彭真 convenes the enlarged meeting of the Group of Five 文化革命五人小組; those present besides the Group: Xu Liqun 許立群, Hu Sheng 胡繩, Yao Zhen 姚溱, Wang Li 王力, Fan Ruoyu 范若愚, Liu Ren 劉仁 and Zheng Tianxiang 鄭天翔; the leftists, Guan Feng 關鋒 and others, criticized; Peng stresses that Hai Rui Dismissed is not to be talked of in its political bearings, Wu Han 吳晗 having no tie to Peng Dehuai 彭德懷); [[w.peng-zhen-nianpu-1902]], IV, 466 (Feb. 3, 1966; Peng Zhen presides at the enlarged Five-Man Group: Lu Dingyi, Kang Sheng, Wu Lengxi (Zhou Yang ill), Xu Liqun, Hu Sheng, Yao Zhen, Wang Li, Fan Ruoyu, Liu Ren, Zheng Tianxiang, eleven in all; on the seven papers; Peng: Wu Han found to have no tie with Peng Dehuai, nor the play, so no mention of the Lushan meeting; even Guo Moruo now tense; criticism not to go too far; facts and reasoning; the left to rectify too, no "scholar-tyrants"; the outline then written by Xu Liqun and Yao Zhen); [[w.pu-weihua-zalan-jiu-shijie]], 58 (Peking; present, Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Yao Zhen, Wang Li, Fan Ruoyu, Liu Ren and Zheng Tianxiang; Peng, presiding: inquiry shows Wu Han had no tie to Peng Dehuai, nor the play; his question academic; criticism not to go too far; he rejects Guan Feng''s charges against Deng Tuo, with Liu Ren and Zheng Tianxiang as witnesses; the left too to be rectified, not to be "scholar-tyrants"; Lu Dingyi on the lessons of Stalin''s time; Kang Sheng voices no difference; the chronicle of the May 16 Circular''s claim of two opposed views at the meeting exaggerated, by Lu Dingyi''s, Wu Lengxi''s, Hu Sheng''s and Fan Ruoyu''s statements of 1979, 58 n.76). Made public: 1982 ([[w.kan-kang-sheng-pingzhuan]]). To check: *Wenhua geming wuren xiaozu guanyu dangqian xueshu taolun de huibao tigang (caoan)* (文化革命五人小组关于当前学术讨论的汇报提纲(草案)), the Outline; the Group''s membership as note 4 gives it (Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang, Wu Lengxi); Outline Report of the Group of Five (the "February Outline"), as sent to the Center, in [[w.mao-zhuxi-zuixin-zhishi]], 1057–58 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.65); [[w.jin-1949-1989-niande-zhongguo]], 616 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.136a); [[w.kan-kang-sheng-pingzhuan]], 177–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.136b); [[w.qingshan-kang-sheng-waizhuan]], 256–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.136c); [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 611 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.136d); [[w.lengxi-yi-mao-zhuxi-remembering]], 150 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.26); Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 71 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 120 n.34); 〈一九六五年九月到一九六六年五月文化戰線上兩條道路鬥爭大事記〉 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76a); the written statements of Lu Dingyi 陸定一, Wu Lengxi 吳冷西, Hu Sheng 胡繩 and Fan Ruoyu 范若愚, 1979 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76c); [[w.xichen-shi-wuqianliede-niandai]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 58 n.76d). Names: Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Zhou Yang, Wu Han. Check: whether [[w.kan-kang-sheng-pingzhuan]] (1982), on which the year rests, was printed for internal circulation; if so, Made public is the year of the next work cited ([[w.jin-1949-1989-niande-zhongguo]], 1989). Check: whether the Outline''s text in [[w.mao-zhuxi-zuixin-zhishi]] (1968), a revolutionary committee''s compilation, is an open printing.'
