    c: The Center circulates the Outline Report on the academic discussion.{1}
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 8, 1966 ("二月十二日，中共中央批转了这个提纲"). [[w.macfarquhar-maos-last-revolution]], 29–30 (Zhongfa [1966] 105); [[w.macfarquhar-origins-of-the-cultural]], III, 455–56 (the outline: a struggle in scholarship, not politics; everyone equal before the truth; Wu Han''s political errors admitted, criticism kept from politics; a scholarly criticism office); [[w.deng-xiaoping-nianpu-1904]], III, 1894 (Feb. 12, 1966; 批发; Deng approves and issues the Outline Report on the current academic discussion, asking all places and departments to carry it out accordingly. In keeping with its spirit the Propaganda Department and other departments limit the critical articles that push the academic questions concerning Wu Han 吴晗 and his new historical play *Hai Rui Dismisses the Official* 海瑞罢官 《海瑞罢官》 to the extreme); [[w.mao-zedong-zhuan]], VI, ch. 74 (the Center formally transmits the outline 《汇报提纲》 Feb. 12). [[w.yang-jisheng-tiandi-fanfu]], I, 123 (issued on Feb. 12 under Deng Xiaoping''s 鄧小平 signature as a Central Committee document to the whole Party, with the Center''s note "the Center agrees to the Group''s outline" and its call to seek truth from facts and be equal before truth); [[w.peng-zhen-nianpu-1902]], IV, 469 (Feb. 12, 1966; the Center forwards the outline to the regional bureaus, provinces, central departments, state organs'' party groups and the General Political Department, "to be carried out," relayed to those directing and doing academic work, Mao''s speech of March 1957 to the propaganda conference to be studied with it); [[w.jian-zhou-enlai]], 532–533 (the Outlines: the *Hai Rui* criticism "a big struggle in the sphere of ideology," "part of the struggles between socialism and capitalism," yet "all being equal before the truth"; relayed to the whole Party Feb. 12 after Deng signs it); [[w.pu-weihua-zalan-jiu-shijie]], 61 (as a document of the Center, to the whole Party, every level to "act on it"); [[w.zhu-de-nianpu-xinbian]], III, 1948 (under Feb. 7, 1966; the Center 中共中央 agrees to the Five-Man Group''s 文化革命五人小组 Outline 二月提纲 and circulates it on Feb. 12). Made public: 2006. Check: MacFarquhar (30) has the Standing Committee members in Peking endorse the printed text again on Feb. 12, and the General Office distribute it Feb. 13 as Zhongfa [1966] 105. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. Check: [[w.jian-zhou-enlai]], 533 n.60, cites the Outlines as "CCP CC Document (66), No. 267, February 12, 1966"; [[cal.1966-05-19.china-leadership-4]] gives Zhongfa [66] no. 267 to the May 16 Notice. To check: [[w.nianyi-da-dongluande-niandai-revised]], 50–52 (cited by [[w.macfarquhar-maos-last-revolution]], 30 n.67); Five-Man Group, "Outline report on the current academic discussion" (the February Outline), in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 611–13 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 455 n.149); Five-Man Group, "Outline report on the current academic discussion" (the February Outline), in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 612 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 455 n.150); Five-Man Group, "Outline report on the current academic discussion" (the February Outline), in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 612–13 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 456 n.151); *Yijiuliuwu nian jiuyue dao yijiuliuliu nian wuyue wenhua zhanxian shang liang tiao daolu douzheng dashiji* 《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》 (annex to the Circular of May 16, 1966 「五一六通知」) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 123 n.39); CCP CC Document (66), No. 267, February 12, 1966 (cited by [[w.jian-zhou-enlai]], 533 n.60); [[w.yang-shengqun-deng-xiaoping-zhuan-1904]], 1326 (cited by [[w.jian-zhou-enlai]], 533 n.63b). See [[cal.1966-02-08.china-leadership]].'
