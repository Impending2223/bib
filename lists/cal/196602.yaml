        - 'via w.gibbons-u-s-government-and IV, 167 n.155: all'
  - id: cal.1966-02-03.space
    when: Feb. 3
    date: '1966-02-03'
    thread: space
    also: [soviet-union]
    c: 'Luna 9, Soviet and unmanned, lands on the moon, the first soft landing, and sends back signals. Johnson to Podgorny: "all mankind applauds it."'
    n: 'Message of Congratulations Following the Landing on the Moon of the U.S.S.R.''s Luna 9, [1966 Pub. Papers 141](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=217) (Feb. 3, 1966). To check: [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson, Podgorny.'
    tags: [name:johnson-lyndon-b, name:podgorny-nikolai-v]
