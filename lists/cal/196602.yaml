  - id: cal.1966-02-06.vietnam
    when: Feb. 6–8
    date: '1966-02-06'
    thread: vietnam
    c: 'Honolulu, announced Feb. 4. Johnson, with Rusk, McNamara, Freeman, Gardner, Bell, Harriman, Lodge, Wheeler and Westmoreland; Thiệu and Kỳ with their ministers. Kỳ''s four goals: defeat the Viet Cong, eradicate social injustice, a viable economy, true democracy. Working groups on rural construction, the economy, health and education, diplomacy. The Declaration of Honolulu, Feb. 8: a constitution to be drafted, put to the people, ratified by secret ballot, and an elected government; the "war for the hearts of our people." Humphrey to go on to Saigon. Feb. 8, Johnson''s report at Los Angeles.'
    n: 'The Declaration of Honolulu, [1966 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=229); Joint Statement Following Discussions in Honolulu With the Chief of State and the Prime Minister of Vietnam, [1966 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=228) (Feb. 8, 1966); Remarks at the Los Angeles International Airport, [1966 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231) (Feb. 8, 1966). [FRUS 1964–68, IV, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v04/d69). [[w.drea-mcnamara-clifford-and-the-2011]], 122–123 (the conference, Feb. 7–8, and who attended); [[w.cosmas-joint-chiefs-of-staff-2012]], 442 (Thiệu and Kỳ; the goals for 1966); [[w.gibbons-u-s-government-and]], IV, 230–33 (the announcement; the conference; the Declaration; Humphrey; Johnson with Kỳ and Thiệu alone, Feb. 7, by Moyers''s summary); [[w.herring-lbj-and-vietnam]], 68 (the conference, called in haste; Johnson pressing health, education and democracy in the closed sessions; the communiqué "a kind of bible"). To check: [[w.berman-lyndon-johnsons-war]]; [[w.karnow-vietnam]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1965-11-28.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Harriman, Wheeler, Freeman, Gardner, Bell, Lodge, Westmoreland, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
