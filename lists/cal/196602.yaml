  - id: cal.1966-02-04.civil-rights-the-executive
    when: Feb. 4
    date: '1966-02-04'
    thread: civil-rights-the-executive
    c: Roger Wilkins, 34, sworn as Director of the Community Relations Service, Collins's successor.
    n: 'Remarks at the Swearing In of Roger Wilkins as Director, Community Relations Service, [1966 Pub. Papers 141](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=217) (Feb. 4, 1966). To check: [[w.wilkins-mans-life]]. See [[cal.1964-10-30.civil-rights-bill]]. Names: Collins, Wilkins.'
