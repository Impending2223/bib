    date: '1966-02-03'
    thread: vietnam
    also: [vietnam-hearings]
    c: 'Johnson to Rusk by telephone, 4:25 p.m., hours after the committee''s decision on hearings: "I don''t want any other human to know this," but he would like to go to Honolulu Saturday night; Freeman, Keppel and the Surgeon General with him, "as a cover."'
    n: '[FRUS 1964–68, IV, doc. 63](https://history.state.gov/historicaldocuments/frus1964-68v04/d63). [[w.mann-grand-delusion]], 491–92. See [[cal.1966-02-03.vietnam-congress]]. Names: Johnson, Rusk, Freeman, Keppel.'
