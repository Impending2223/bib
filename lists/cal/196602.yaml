    c: 'Foreign Ministry note to the Indonesian embassy: the strongest protest at the extremely grave incident of right-wing forces, with the Indonesian government''s connivance, wildly attacking the Chinese embassy in Indonesia: wantonly wrecking the building, wounding staff, smashing the national emblem, taking the brass plate, shouting anti-Chinese slogans and daubing slogans. China demands a public apology, punishment of the culprits and those who set them on, and a sure promise of no repeat, and reserves the right to ask further and to claim compensation for all losses.'
