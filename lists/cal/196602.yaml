  - id: cal.1966-02-13.vietnam-support
    when: Feb. 13
    date: '1966-02-13'
    thread: vietnam-support
    also: [war-opposition]
    c: 'The White House, evening. Johnson to Mrs. Johnson on Hawaii: impressed with Westmoreland, "rather impressed" with Kỳ; wounded to a hospital within three hours. The SEATO Treaty: Senate, February 1955, 82 to 1, Langer against; he at the Mayo Clinic, Kennedy absent with his back. "We are trying to carry out the contracts they made." Lafayette Park full of picketers; the White House picketed 166 times in 1965. "This thing is assuming dangerous proportions, dividing the country and giving our enemies the wrong idea of the will of this country to fight." Taylor "tremendous on TV"; the Johnsons call him: "I was just warming up for the Senate Committee."'
    n: '[[w.johnson-white-house-diary]], 359–60 (Lady Bird Johnson''s account). The vote and its day are Mrs. Johnson''s report of Johnson''s words. Made public: 1970. To check: the vote on the SEATO Treaty, Feb. 1, 1955. Names: Johnson, Westmoreland, Kỳ, Taylor, John Kennedy.'
