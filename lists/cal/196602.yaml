  - id: cal.1966-02-12.china
    when: Feb. 12
    date: '1966-02-12'
    thread: china
    also: [vietnam-hanoi]
    c: 'The Foreign Ministry''s statement severely condemns the U.S. and the South Vietnamese authorities for holding the Honolulu conference to plan a wider war in Vietnam. The conference once more shows the U.S. government''s war made to look like peace; its declaration and communique are good negative teaching for the world''s peoples. It tells that the U.S. means to hold on in Vietnam, to take South Vietnam at any cost and divide it forever: the Vietnamese will not accept that, nor will the peoples of the world.'
