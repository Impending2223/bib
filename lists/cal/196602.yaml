        - 'via w.gibbons-u-s-government-and IV, 223 n.33: all'
    tags: [name:fulbright-j-william]
  - id: cal.1966-02-01.vietnam-congress-2
    when: Feb. 1
    date: '1966-02-01'
    thread: vietnam-congress
    c: 'Hilsman before Zablocki''s subcommittee: the United States cannot desert South Vietnam, and he favored sending ground forces; but "if we over-Americanize the struggle ... the struggle itself will have been lost." Against bombing the North, for enclaves: "deescalate," "demilitarize," "de-Americanize"; a struggle of 10 to 15 years.'
    n: '[[w.gibbons-u-s-government-and]], IV, 226–27 n.42. To check: House Comm. on Foreign Affairs, Subcomm. on the Far East and the Pacific, *United States Policy Toward Asia: Hearings* (1966), 89th Cong., 2d Sess. (cited by [[w.gibbons-u-s-government-and]], IV, 226 n.42). See [[cal.1966-01-27.vietnam-congress-4]]. Names: Hilsman, Zablocki.'
    src:
      c: 56de6538
      rows:
        - 'w.gibbons-u-s-government-and IV, 227: all'
        - 'via w.gibbons-u-s-government-and IV, 226 n.42b: all'
    tags: [name:hilsman-roger, name:zablocki-clement-j]
  - id: cal.1966-02-02.legislatures-tx
    when: Feb. 2
    date: '1966-02-02'
    thread: legislatures
    c: The three-judge court upholds the Legislature's 1965 House apportionment, H.B. 195, a mix of single-member, multimember and flotorial districts, save its eleven flotorial districts, to be equalized by Aug. 1, 1967. Kilgarlin's plan of single-member districts refused, and the claim that the multimember districts cancel the votes of racial and political groups.
    n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/case-pdfs/0404-01.pdf) (S.D. Tex. 1966). See [[cal.1965-01-11.legislatures-tx]]. Names: Kilgarlin.'
    tags: [state:tx, name:kilgarlin-william-w]
  - id: cal.1966-02-02.vietnam-congress
    when: Feb. 2
    date: '1966-02-02'
    thread: vietnam-congress
    c: Javits and Randolph again propose that Congress replace the Southeast Asia resolution with one approving the war on its present scale and stating its aims.
    n: '[112 Cong. Rec., Senate, Feb. 2, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-5-2.pdf), 1892 ff. [[w.gibbons-u-s-government-and]], IV, 251. Names: Javits, Randolph.'
