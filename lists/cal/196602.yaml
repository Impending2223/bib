  - id: cal.1966-02-08.china-leadership-4
    when: Feb. 8
    date: '1966-02-08'
    thread: china-foreign
    c: 'Deng Xiaoping 邓小平 meets Basto 巴斯托, member of the Political Committee of the Communist Party of Peru (Marxist–Leninist), on a visit. On the experience of the Chinese revolution, what makes a party mature and firm: ties with the masses, isolating the enemy to the utmost, rousing the masses to the utmost and uniting them round the party, and an alliance, by the united-front form, with the left wing of the national bourgeoisie; the united front forms in waves with many turns; the struggle itself rises and falls, the masses won are sometimes taken back by the enemy; repressed in one place it rises in another, and the masses and the party draw lessons and experience from the repeated tests.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1894 (Feb. 8, 1966). The words: 下午 (III, 1894). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the guest''s name in Latin letters (the nianpu: 巴斯托).'
