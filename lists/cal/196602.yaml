    date: 1966-02
    place: phu-lam-phu-yen
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Phú Lâm district town. Thousands from Hòa Hiệp commune march on the town to denounce what the history charges as the Korean troops' killing of the people; by its account the Saigon army has to admit the guilt.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 103. See [[cal.1966-02-09.vietnam-hanoi]]. Check: the day; the history says "Feb. 1966". Check: the charge; no record read.'
    tags: [polity:drv, polity:rok, polity:rvn]
  - id: cal.1966-02.vietnam-hanoi-3
    when: Feb., early
    date: 1966-02
    at: before 1966-02-01
    place: tuy-duc
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Tuy Đức, Quảng Đức. The Region 6 forces, with Regiment 16 sent by the Liberation Army command, open fire without warning and destroy the post, then turn to Bu Prăng; Route 14 is cleared from southwest of Đức Lập to Bát Kiến Đức, and Phước Long's liberated area joins west Quảng Đức's.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 118. Check: the day; the history says "early February".'
    tags: [polity:drv, polity:rvn, polity:us]
  - id: cal.1966-02-28.vietnam-hanoi
    when: Feb. 28
    date: '1966-02-28'
    time: 1966-02-27T23:00Z
    place: tan-kim
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Tân Kim commune, Cam Lộ, Quảng Trị. A squad of ten under Bùi Ngọc Đủ guards an ammunition dump on a nameless hill by the La La stream, stocked for the coming battle in Quảng Trị. An American battalion with air and artillery support attacks it fifteen times from 7 a.m.; at dark it withdraws, by the history's count leaving nearly 200 dead. Two of the squad are killed.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 119–120. The song "Con suối La La" by Huy Thục is written for it. Check: the clock, whose it is. The figures are the history''s.'
    tags: [polity:drv, polity:us]
    time_zone: Asia/Ho_Chi_Minh
