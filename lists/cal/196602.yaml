  - id: cal.1966-02-10.vietnam-hearings
    when: Feb. 10
    date: '1966-02-10'
    place: washington
    thread: vietnam-hearings
    also: [congress]
    c: 'Kennan before the Foreign Relations Committee, televised, against widening the war: "great misgivings about any deliberate expansion of hostilities on our part directed to the achievement of something called victory."{1} Kennan: liquidate the involvement "as soon as this can be done without inordinate damage to our own prestige or to the stability" of the area, but no "precipitate and disorderly withdrawal."{2} Kennan: a Vietnam united under Communism "would be exploited mercilessly by the Chinese and North Vietnamese," but a lesser evil than the war.{3} Kennan: victory in the South only "at the cost of a degree of damage to civilian life and of civilian suffering, generally, for which I would not like to see this country responsible."{4} Kennan: the United States should not "shoulder the main burden of determining the political realities" of another country, least of all one so remote: "This is not only not our business, but I don''t think we can do it successfully."{5}'
    n: 'Daily Digest, [112 Cong. Rec. D47](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=45). [[w.gibbons-u-s-government-and]], IV, 239, 241–42; [[w.mann-grand-delusion]], 493; [[w.branch-at-canaans-edge]], 446; [[w.woods-fulbright]], 405 ("as soon as this could be done without inordinate damage to our prestige or stability in the area"); [[w.woods-j-william-fulbright-vietnam]], 117 (the same); [[w.berman-lyndon-johnsons-war]], 10; [[w.zaroulis-who-spoke-up]], 73–74 (the day not given). To check: Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam: Hearings* (1966); [[w.vietnam-hearings]], 107 ff. (cited by [[w.branch-at-canaans-edge]], 446); "Fulbright Fears U.S. Eliminating Chance for Peace," *Arkansas Gazette*, Feb. 11, 1966 (cited by [[w.woods-fulbright]], 405 n.42). See [[cal.1966-02-04.vietnam]]. Names: Kennan. Check: Woods gives Feb. 11 ([[w.woods-fulbright]], 405; [[w.woods-j-william-fulbright-vietnam]], 116).'
