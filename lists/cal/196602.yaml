  - id: cal.1966-02-18.vietnam-hearings
    when: Feb. 18
    date: '1966-02-18'
    place: washington
    thread: vietnam-hearings
    c: 'Rusk before the Foreign Relations Committee, televised, the hearings'' last day, Robert Kennedy at the back of the room.{1} McNamara has declined to testify in public.{2} Rusk: the commitment rests on the SEATO treaty, art. IV, which the Senate ratified 82 to 1.{3} Rusk: "If we don''t make clear where we stand, then the prospect for peace disappears."{4} Case: the Tonkin resolution "not a power of attorney irrevocably delegating all of the congressional authority to the President."{5} Fulbright: more a civil war than aggression, not worth "a vast escalation," and "there must be something wrong with our diplomacy." Rusk, in reply: "is it just possible that there is something wrong with them?"{6} Gore: he cannot understand "how three presidents could take this limited view of our commitment under SEATO."{7}'
    n: 'Daily Digest, [112 Cong. Rec. D59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=57). [[w.gibbons-u-s-government-and]], IV, 243–48; [[w.mann-grand-delusion]], 494–95; [[w.branch-at-canaans-edge]], 447 (Rusk on peace; Robert Kennedy in the room); [[w.woods-j-william-fulbright-vietnam]], 118; [[w.woods-fulbright]], 407 (Fulbright on "our diplomacy"; Rusk''s reply); [[w.zaroulis-who-spoke-up]], 73–74 (the SEATO claim; Rusk''s "This is Ho Chi Minh''s war," the day not given). To check: Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam: Hearings* (1966), 563–76, 618, 650 ff. (cited by [[w.gibbons-u-s-government-and]], IV, 244–47 nn.92, 95, 97); [*New York Times*, Feb. 19, 1966](https://timesmachine.nytimes.com/timesmachine/1966/02/19/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 447). See [[cal.1966-02-17.vietnam-hearings]]. Names: Rusk, Robert Kennedy, McNamara, Case, Fulbright, Gore.'
    src:
