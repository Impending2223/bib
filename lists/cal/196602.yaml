  - id: cal.1966-02-20.white-house
    when: Feb. 20
    date: '1966-02-20'
    thread: white-house
    c: 'St. Mark''s Church. Leaving, Johnson takes the hand of Coco McPherson, who has come up to him, and of her friend Janice, ten, a Negro member of the choir; they and Mrs. Johnson walk out hand in hand past Helen Thomas and the cameras. Johnson: "if you don''t watch out, she''ll be announcing your wedding." The four ride to the White House; the girls in Johnson''s office, pencils and keepsakes, then the dogs. Harry and Clay McPherson, Bill Baxter and his wife are asked to lunch.'
    n: '[[w.johnson-white-house-diary]], 360–61 (Lady Bird Johnson''s account). Names: Johnson, McPherson, Lady Bird Johnson.'
    tags: [name:johnson-lyndon-b, name:mcpherson-harry, name:johnson-lady-bird, city:washington]
