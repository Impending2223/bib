  - id: cal.1966-02-19.china-leadership
    when: Feb. 19
    date: '1966-02-19'
    thread: china-mao
    c: 'Mao reads the Hubei Party committee''s Feb. 5 plan to mechanize farming in the province in five, seven and ten years, by its own machines.{1} "Very good": to Liu Shaoqi, to issue to all provincial committees;{2} each to draw a five-, seven- and ten-year plan on its own resources, from a few trials outward, and mechanize in about twenty-five years; the last ten years were not well handled. The Center issues his note and the plan Apr. 10.{3} He leaves Wuhan that night for Changsha.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 19, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 212–215 (Feb. 19, 1966; Mao''s note of Feb. 19, to Wang Renzhong, on the Hubei committee''s plan of Feb. 5 (sent Feb. 14): read, very good; send it to Shaoqi to decide whether to send it to the provincial committees; each province to make a five-, seven- and ten-year plan on self-reliance, from a few trials outward, mechanizing basically in twenty-five years; the last ten years not well handled; note 1: the Center issued Mao''s note, Liu''s letter of Feb. 23 and the Hubei paper on Apr. 10). Made public: 2013. To check: Party committee of Hubei province, "Ideas on gradually realizing farm mechanization," Feb. 5, 1966 (five, seven and ten years; the way of Jinxing brigade, Xiaogan, and Dazhai; sent by Wang Renzhong Feb. 14) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 213 n.2); Liu Shaoqi, letter to Zhou Enlai and Deng Xiaoping of Feb. 23, 1966 proposing to send the Hubei paper and Mao''s note to the provincial committees (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 214 n.3a); Central Committee, comment of Apr. 10, 1966 forwarding the Hubei paper with Mao''s note and Liu''s letter (five-, seven- and ten-year plans, drafts to the Central Work Conference in Aug.–Sept.) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 214 n.3b). Names: Mao Zedong, Liu Shaoqi, Wang Renzhong.'
