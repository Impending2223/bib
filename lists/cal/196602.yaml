  - id: cal.1966-02-01.china-leadership
    when: Feb. 1
    date: '1966-02-01'
    place: suzhou
    thread: china-luo-ruiqing
    c: 'Lin Biao, Suzhou, has Ye Qun telephone Liu Zhijian, deputy director of the PLA General Political Department: Jiang Qing came the day before;{1} she is strong politically and expert in the arts; her views to be carried out in thought and in organization; the army''s art-and-literature papers to go to her.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 1, 1966. [[w.macfarquhar-origins-of-the-cultural]], III, 451 (a call from Ye Qun sends Liu Zhijian to Shanghai); [[w.teiwes-tragedy-of-lin-biao]], 58 (Lin orders the General Political Department to cooperate; the forum''s work done under Liu Zhijian, the department''s deputy head for propaganda); [[w.pu-weihua-zalan-jiu-shijie]], 40 (Lin''s instruction to those going to the forum, quoted: Jiang Qing talked with him yesterday; strong politically, expert in the arts; her views to be carried out in thought and organization; the army''s papers on the arts to go to her). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). To check: [[w.jin-1949-1989-niande-zhongguo]], 618–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.120). Names: Lin Biao, Ye Qun, Jiang Qing, Liu Zhijian.'
    src:
      c: c1a42553
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Feb. 1, 1966: 1, 2'
        - 'w.macfarquhar-origins-of-the-cultural III, 451: 1'
        - 'via w.macfarquhar-origins-of-the-cultural III, 451 n.120: 1'
        - 'w.teiwes-tragedy-of-lin-biao 58: ?'
        - 'via x.undated.teiwes-sun-oral-sources: ?'
