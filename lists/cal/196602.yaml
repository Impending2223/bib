    c: The Five-Man Group's outline is drafted, mainly by two deputy directors of the Propaganda Department.{1} Xu Liqun and Yao Zhen draft it from the discussion of the Group's enlarged meeting of Feb. 3, and Peng Zhen revises it; the title is "Outline report of the Five-Man Group for the Cultural Revolution on the present academic discussion."{2} The drafting is at the Diaoyutai, on Peng Zhen's view; the Outline limits the criticism to the academic and places it under the Party's leadership.{3}
    n: '[[w.macfarquhar-maos-last-revolution]], 29; [[w.macfarquhar-origins-of-the-cultural]], III, 454 (Xu Liqun and Yao Zhen draft the outline at once); [[w.deng-xiaoping-nianpu-1904]], III, 1893 (Feb. 4, 1966; Deng reads the draft of the Group of Five for the Cultural Revolution 中央文化革命五人小组 (footnote: set up in July 1964 on Mao''s proposal, of Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi), ''Outline Report on the current academic discussion'' 《关于当前学术讨论的汇报提纲》, to go to the Politburo (the ''February Outline'' 二月提纲), that Peng Zhen has passed on and which goes also to Liu Shaoqi, Zhou Enlai, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun 许立群 and Hu Sheng 胡绳; aimed at the ''leftist'' deviation in the academic discussion, the outline says: hold to seeking truth from facts, equality of all before truth, convince by reason, do not be arbitrary and overbearing like a scholar-tyrant); [[w.yang-jisheng-tiandi-fanfu]], I, 120 (on Feb. 4 Xu Liqun 許立群 and Yao Zhen 姚溱, on Peng Zhen''s view, draft the Outline 〈文化革命五人小組關於當前學術討論的匯報提綱〉 at the Diaoyutai 釣魚臺; the two men''s posts not given; the Outline limits the criticism to the academic and places it under the Party''s leadership); [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (drafted by Xu Liqun and others on Peng Zhen''s view: the criticism kept under the Party''s lead and within scholarship); [[w.pu-weihua-zalan-jiu-shijie]], 58 (drafted by Xu Liqun and Yao Zhen from the meeting''s discussion, settled by Peng Zhen: "Outline report of the Five-Man Group for the Cultural Revolution on the present academic discussion"); [[w.pu-weihua-zalan-jiu-shijie]], 58; [[w.yang-jisheng-tiandi-fanfu]], I, 120. Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). To check: Outline Report of the Group of Five (the "February Outline"), as sent to the Center, in [[w.mao-zhuxi-zuixin-zhishi]], 1057–58 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.65); [[w.jin-1949-1989-niande-zhongguo]], 615–16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.137); Xi Xuan 席宣 and Jin Chunming 金春明, *"Wenhua dageming" jianshi* 《「文化大革命」簡史》, newest enlarged ed. (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 71 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 120 n.34). See [[cal.1966-02-03.china-leadership-2]]. Names: Xu Liqun, Yao Zhen, Peng Zhen.'
