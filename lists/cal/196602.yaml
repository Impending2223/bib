        - 'via w.gibbons-u-s-government-and IV, 251 n.111: all'
    tags: [name:javits-jacob-k, name:randolph-jennings]
  - id: cal.1966-02-02.republican-party-congress
    when: Feb. 2
    date: '1966-02-02'
    thread: republican-party-congress
    also: [vietnam-congress]
    c: 'The *New York Times* reports the Republican leaders'' line on the war: the Democrats'' divisions and a widening land war "a winning political issue"; direct criticism of Johnson''s policy and the old "hard line" on the war''s conduct played down, the political and constitutional responsibility left "squarely on the President."'
    n: '[[w.gibbons-u-s-government-and]], IV, 166–67. To check: *New York Times*, Feb. 2, 1966 (cited by [[w.gibbons-u-s-government-and]], IV, 167 n.155). See [[cal.1966-01-31.vietnam-congress]]. Check: the leaders named in the report.'
    src:
