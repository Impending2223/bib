    c: 'Gallup, Jan. 21–26: can identify Romney, 43 percent; Republicans 56, independents 55, Democrats 33. Of all asked, a favorable opinion of him 30, unfavorable 3. Of those who can identify him, would like to see him President: yes 38, no 28.'
    n: '[[w.gallup-poll]], III, 1991. Names: Romney.'
