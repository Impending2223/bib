  - id: cal.1966-02-04.opinion
    when: Feb. 4
    date: '1966-02-04'
    thread: opinion
    also: [economy, vietnam]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: prices and wages frozen for as long as the war in Vietnam lasts: a good idea 45 percent, a poor idea 42.'
    n: '[[w.gallup-poll]], III, 1987.'
  - id: cal.1966-02-04.india-and-china-food
    when: Feb. 4
    date: '1966-02-04'
    thread: india-and-china-food
    also: [farm, foreign-aid]
    c: 'News conference: for India''s drought and famine, Johnson allots 2 million tons of wheat and 1 million of maize, to be shipped at once. Rusk, Jan. 28, had urged a new allocation "as soon as possible."'
    n: 'The President''s News Conference, [1966 Pub. Papers 143](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=219) (Feb. 4, 1966). [FRUS 1964–68, XXV, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v25/d286) (Rusk). To check: [[w.ahlberg-transplanting-the-great-society]]; [[w.brands-wages-of-globalism]]. See [[cal.1965-12-14.india-and-china]]. Names: Johnson, Rusk.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
