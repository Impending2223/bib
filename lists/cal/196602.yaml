    c: 'The Foreign Relations Committee, Fulbright in the chair, opens its televised hearings on the war, on the bill for $415 million more in foreign aid to Vietnam and Southeast Asia (S. 2793): Bell of AID the witness.{1} Rusk heard Jan. 28, not televised.{2} All three networks carry the hearing live;{3} they break away for Johnson''s announcement of the Honolulu conference.{4} At CBS, Friendly keeps it on through the morning and into the afternoon, *Captain Kangaroo* and the soap operas preempted. Johnson watches on television.{5} Bell declines the general policy questions, the military above all: for others to answer.{6} Morse: no spokesman of the government should "hide behind an alleged right to testify in secrecy," and he will attend no meeting "that sponsors government by secrecy"; Case and Mundt agree.{7}'
