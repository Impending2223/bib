    c: 'Saturday, the first meeting of the President''s Vietnam Group, 12:45 to 2:16 p.m., on the "other war" after Honolulu: a Washington "czar" for the nonmilitary programs to be picked within days (Komer).{1} Asked about a resolution, Johnson: "nothing more need be done now"; Morse''s motion to repeal to come to a vote, Russell''s to reaffirm not.{2} Moyers reads Harris''s figures, approval of the handling of the war down from 63 percent to 49: "First signs of American impatience with long war."{3} Johnson: the extremes ten percent doves and sixteen percent hawks, the cost of living "a major element."{4}'
    n: '[FRUS 1964–68, IV, doc. 85](https://history.state.gov/historicaldocuments/frus1964-68v04/d85) (Bromley Smith''s notes); [doc. 86](https://history.state.gov/historicaldocuments/frus1964-68v04/d86) (Valenti''s notes; Moyers). [[w.gibbons-u-s-government-and]], IV, 175, 232–33, 255; [[w.woods-fulbright]], 410 (Moyers: approval of the war''s handling down from 63 to 49 percent, Jan. 26 to Feb. 26; Komer on New York business); [[w.gibbons-u-s-government-and]], IV, 233 (the group meets every Saturday for some weeks, then stops). Made public: FRUS 1964–68, IV (1998). Check: FRUS''s two sets of notes (docs. 85, 86) head the meeting 1:10 p.m., not 12:45. See [[cal.1966-02-06.vietnam]]. Names: Johnson, Komer, Morse, Russell, Moyers, Harris.'
