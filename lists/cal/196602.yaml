  - id: cal.1966-02-01.vietnam-hanoi-2
    when: Feb. 1
    date: '1966-02-01'
    time: 1966-02-01T14:00Z
    place: east-berlin
    thread: vietnam-hanoi
    also: [comecon]
    c: East Berlin. Mielke with Nguyen Minh Tien, at the close of Tien's stay; Beater, Wolf, Schmid, Hanewald and Damm of the MfS present. Tien sums up the work on the DRV's technical operations sector and asks help with equipment lists, the plans of buildings and the training of cadres at the GDR's cost. Mielke says the GDR will pay for training and give what it buys with Western currency, but wants the cadres first; he proposes that two operational officers and two technical specialists go to the DRV, says a DRV military delegation is coming from Warsaw, and that 20 marks handed in at the border by a West Berlin informant of the Stasi were staged for propaganda, which Tien is not to tell the DRV embassy.
    n: '"[Note on a Meeting of Minister Erich Mielke with Nguyen Minh Tien on 1 February 1966](https://digitalarchive.umd.edu/document/120720)" (Feb. 10, 1966), BStU, MfS Abt X 652, 50–63, trans. Martin Grossheim, Wilson Center Digital Archive. Obtained for CWIHP by Martin Grossheim. Berlin, Feb. 10, 1966, five copies; the note gives the time as "from 15:00 until 17:00". The note prints "Schmidt"; the Archive''s notes name Günter Schmid and Markus Wolf. The note records Mielke saying the GDR''s population gave 272,000 marks for Vietnam at a radio concert two days before, 23,000 of them from MfS staff; its elisions are the Archive''s. At the end Tien receives a camera and another member of the delegation a microscope. See [[cal.1965-12-13.vietnam-hanoi]]. Check: the year the Archive posted the document; its page gives none.'
    src:
      c: 2b4f9e30
      rows:
        - 'https://digitalarchive.umd.edu/document/120720: all'
    tags: [polity:drv, polity:gdr, vis:only:drv+gdr]
    time_zone: Europe/Berlin
