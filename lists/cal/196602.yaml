  - id: cal.1966-02-02.legislatures-tx
    when: Feb. 2
    date: '1966-02-02'
    thread: legislatures
    c: The three-judge court upholds the Legislature's 1965 House apportionment, H.B. 195, a mix of single-member, multimember and flotorial districts, save its eleven flotorial districts, to be equalized by Aug. 1, 1967. Kilgarlin's plan of single-member districts refused, and the claim that the multimember districts cancel the votes of racial and political groups.
    n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/case-pdfs/0404-01.pdf) (S.D. Tex. 1966). See [[cal.1965-01-11.legislatures-tx]]. Names: Kilgarlin.'
