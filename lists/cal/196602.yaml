  - id: cal.1966-02-06.china-leadership
    when: Feb. 6
    date: '1966-02-06'
    thread: china-mao
    c: 'Mao to Peng Zhen, on Wang Renzhong''s request of Feb. 4 to print the 7,000-cadres speech: the standing members in Peking, with Kang Sheng, Lu Dingyi and Chen Boda, to revise it and consider printing it for county and regiment cadres at the Central-South Bureau''s request, there only, as a trial. Real democratic centralism needs education, trials, spread, and long repetition, else it stays a phrase.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 6, 1966. [[w.jianguo-yilai-mao-zedong]], XVI, 234–235 (Feb. 6, 1966; Mao''s note on Wang Renzhong''s letter of Feb. 4: Peng Zhen, with Kang Sheng, Lu Dingyi and Chen Boda, to revise it and consider printing for county and regiment cadres at the Central-South Bureau''s request, there only, as a trial; the sentence on education, trials and long repetition, note 1); [[w.jianguo-yilai-mao-zedong]], XVIII, 209–211 (Feb. 6, 1966; Mao''s note on Wang Renzhong''s letter of Feb. 4 (the speech to be reprinted for county-level committees, to be studied by cadres above commune secretary): Peng Zhen to consult the standing members in Peking and Kang Sheng, Lu Dingyi and Chen Boda, revise, and consider printing for county and regiment cadres at the Central-South Bureau''s request, there only, as a trial; real democratic centralism takes education, trial and spread and long repetition, else a mere phrase; note 3: Wang proposed six changes of wording); [[w.peng-zhen-nianpu-1902]], IV, 467 (Feb. 6, 1966; Peng Zhen receives Mao''s comment from Wuhan on Wang Renzhong''s 王任重 letter of Feb. 4: to revise the 7,000-cadres speech with the standing members in Peking and Kang Sheng, Lu Dingyi and Chen Boda, and consider printing it for county and regiment cadres in the Central-South Bureau only, as a trial; Mao had given Wang the text on the 3rd; Wang on the 4th: democratic centralism the guarantee of the upsurge, reprint it; Mao: a big question, to be realized by education, trials and spreading over long repetition, or an empty phrase). Made public: 2013. To check: Wang Renzhong, letter to Mao Zedong of Feb. 4, 1966 proposing that Mao''s speech at the 7,000-cadres conference be reprinted for county committees and studied by cadres above commune Party secretary, with six changes of wording (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 210 n.1a); Peng Zhen, submission to Mao Zedong of the revised text of the Jan. 30, 1962 speech, Feb. 11, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 210 n.1c). Names: Mao Zedong, Peng Zhen, Wang Renzhong, Kang Sheng, Lu Dingyi, Chen Boda.'
