  - id: cal.1966-02-21.china-leadership-2
    when: Feb. 21–22
    date: '1966-02-21'
    place: changsha
    thread: china-mao
    also: [china-army]
    c: Mao, Changsha, hears Ye Jianying, Yang Chengwu and others on military work. Luring the enemy deep worked against Japan, not now in Vietnam; the United States will not rush in; hold the first line some months, plan a second hand; defend coastal cities in depth, Stalingrad fashion;{1} keep the army's total strength; provincial public-security troops go under the military districts (a second force is a Soviet copy he never liked); agrees to Zhou Enlai's and Deng Xiaoping's plan to put industrial and construction units on a military footing in three to five years.{2} On Mar. 27 he approves Lin Biao's minute of the talk.{3}
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 21 afternoon and Feb. 22 morning, 1966 (the entry "2月21日下午、22日上午"). [[w.jianguo-yilai-mao-zedong]], XVIII, 216–218 (Feb. 21, 1966; the Wengao prints parts of Mao''s talks of Feb. 21 afternoon and Feb. 22 morning, hearing Ye Jianying and Yang Chengwu on military work, from the record in the Central Archives: luring the enemy deep worked against the Japanese and in Korea only in the first phase, not likely in Vietnam; the United States will not take Hitler''s or Japan''s road of a deep drive; hold the first line some months; prepare a second hand; defend coastal cities in several layers, Stalingrad fashion; note 1: Lin Biao sent the minute Mar. 24 and Mao approved it Mar. 27, "well recorded, as it stands"). Made public: 2013. Names: Mao Zedong, Ye Jianying, Yang Chengwu, Zhou Enlai, Deng Xiaoping, Lin Biao.'
