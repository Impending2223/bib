    date: 1966-02
    at: before 1966-02-01
    thread: china-four-cleanups
    c: 'Peng Zhen 彭真 asks Lu Dingyi 陸定一 to his house and gives him the Ministry of Public Security''s file of Yan Weibing''s 嚴慰冰 anonymous letters. Peng: a letter against Lin Biao 林彪, the Party''s vice-chairman, is a political matter; many are signed "Wang Guang-X" and give the nursery run by Wang Guangmei''s 王光美 mother as the sender''s address, so they are taken as setting the Standing Committee members against one another; many are on postcards, a public leaflet. Lu answers that he knew nothing of his wife''s letters.'
