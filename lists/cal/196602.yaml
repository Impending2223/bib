  - id: cal.1966-02-06.vietnam
    when: Feb. 6–8
    date: '1966-02-06'
    place: honolulu
    thread: vietnam
    c: 'Honolulu, announced Feb. 4.{1} Johnson, with Rusk, McNamara, Freeman, Gardner, Bell, Harriman, Lodge, Wheeler and Westmoreland;{2} Thiệu and Kỳ with their ministers.{3} Kỳ''s four goals: defeat the Viet Cong, eradicate social injustice, a viable economy, true democracy.{4} Working groups on rural construction, the economy, health and education, diplomacy.{5} The Declaration of Honolulu, Feb. 8: a constitution to be drafted, put to the people, ratified by secret ballot, and an elected government;{6} the "war for the hearts of our people."{7} Humphrey to go on to Saigon.{8} Feb. 8, Johnson''s report at Los Angeles.{9} McGeorge Bundy and Sharp there too; Thiệu and Kỳ at the head of a delegation of 28.{10} In the closed sessions Johnson presses health, education and democracy; the communiqué "a kind of bible"; results wanted, "coonskins on the wall."{11} Johnson agrees to raise American strength from 184,000 to 429,000 by the year''s end, Westmoreland to "nail the coonskin to the wall" by December; to Kỳ, a poker story: "I hope we don''t find out we only had one aces."{12}'
    n: 'The Declaration of Honolulu, [1966 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=229); Joint Statement Following Discussions in Honolulu With the Chief of State and the Prime Minister of Vietnam, [1966 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=228) (Feb. 8, 1966); Remarks at the Los Angeles International Airport, [1966 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231) (Feb. 8, 1966). [FRUS 1964–68, IV, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v04/d69). [[w.drea-mcnamara-clifford-and-the-2011]], 122–123 (the conference, Feb. 7–8, and who attended); [[w.cosmas-joint-chiefs-of-staff-2012]], 442 (Thiệu and Kỳ; the goals for 1966); [[w.gibbons-u-s-government-and]], IV, 230–33 (the announcement; the conference; the Declaration; Humphrey; Johnson with Kỳ and Thiệu alone, Feb. 7, by Moyers''s summary); [[w.herring-lbj-and-vietnam]], 68 (the conference, called in haste; Johnson pressing health, education and democracy in the closed sessions; the communiqué "a kind of bible"); [[w.berman-lyndon-johnsons-war]], 9–10 (the party; Thiệu and Kỳ at the head of a delegation of 28; Westmoreland to go from 184,000 to 429,000 by the year''s end, the "coonskin" nailed "to the wall" by December; "one aces"); [[w.johnson-white-house-diary]], 358–59 (Feb. 5, noon, the Diplomatic Reception Room: Johnson leaves for Hawaii to meet Thieu, Kỳ, the Ambassador and Westmoreland on "the non-military side of pacification and economic development"; Katherine Westmoreland, the General''s daughter, flies out with him; not the arrival); [[w.chang-friends-and-enemies]], 268 (Johnson embraces Kỳ at the highly publicized Honolulu conference of February 1966); [[w.berman-lyndon-johnsons-war]], 9–10; [[w.herring-lbj-and-vietnam]], 68; [[w.berman-lyndon-johnsons-war]], 10. [[w.westmoreland-soldier-reports]], 159–60 (Westmoreland''s 102 battalions, 429,000 men for 1966, first put to Sharp at Honolulu; Johnson to him privately: "I hope you don''t pull a MacArthur on me"; the three hours in Johnson''s suite the second evening; the pledge of a constitution and elections). To check: [[w.karnow-vietnam]]; [[w.topmiller-lotus-unleashed]]; [[w.kahin-intervention]], 417 (cited by [[w.chang-friends-and-enemies]], 269 n.29). See [[cal.1965-11-28.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Harriman, Wheeler, Freeman, Gardner, Bell, Lodge, Westmoreland, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, McGeorge Bundy, Sharp.'
