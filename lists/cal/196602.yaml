    when: Feb. 2
    date: '1966-02-02'
    thread: china
    also: [vietnam-hanoi]
    c: The Foreign Ministry's statement condemns the U.S. resumption of bombing of Vietnam. After its "bombing pause" the U.S. ordered bombing resumed Jan. 31 and at the same time put a "proposal" on Vietnam to the U.N. Security Council, in order to go on with its peace-talk plot through the U.N. The Vietnamese Foreign Ministry's statement of Feb. 1 condemned the bombing of the North and opposed the U.S. use of the U.N. to meddle; the Chinese government and people fully back the Vietnamese stand.
