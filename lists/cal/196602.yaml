    date: '1966-02-02'
    thread: vietnam-congress
    also: [press-and-broadcasting]
    c: 'Lodge invites Fulbright and Lippmann to Vietnam, McGeorge Bundy kept informed; both decline. Fulbright: his committee is holding hearings. Lippmann: "If I were 25 years younger, I would be tempted to accept ... But I would not expect to find out anything more than the stream of visiting journalists and VIPs bring back with them."'
