# Cal. LXXVI February 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXVI
entries:
  - id: cal.1966-02.vietnam
    when: Feb.
    date: 1966-02
    thread: vietnam
    c: 'Masher renamed White Wing: Bundy asks MACV for no provocative names; Wheeler passes it on, Masher his example; Westmoreland complies.'
    n: '[[w.carland-united-states-army-in]], 203. Check the day. See [[cal.1966-01-24.vietnam]]. Names: Bundy, Wheeler, Westmoreland.'
    tags: [name:bundy-mcgeorge, name:wheeler-earle, name:westmoreland-william]
  - id: cal.1966-02-01.foreign-aid
    when: Feb. 1
    date: '1966-02-01'
    thread: foreign-aid
    c: 'Foreign aid message: aid to those who help themselves; agriculture, education and health first, and help with population. For fiscal 1967, $550 million of supporting assistance for Vietnam; five-year authorizations for economic and military aid.'
    n: 'Special Message to the Congress on the Foreign Aid Program, [1966 Pub. Papers 117](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=193) (Feb. 1, 1966). To check: [[w.brands-wages-of-globalism]]. See [[cal.1964-10-08.foreign-aid]]; [[cal.1965-09-06.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-01.vietnam-congress
    when: Feb. 1
    date: '1966-02-01'
    thread: vietnam-congress
    c: Ten of the fifteen Senators who wrote against resuming the bombing meet privately with Fulbright; they agree to try to force the administration into a full discussion of its policy.
    n: '*New York Times*, Feb. 2, 1966. [[w.gibbons-u-s-government-and]], IV, 223. See [[cal.1966-01-29.vietnam-congress]]. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1966-02-02.legislatures-tx
    when: Feb. 2
    date: '1966-02-02'
    thread: legislatures
    c: The three-judge court upholds the Legislature's 1965 House apportionment, H.B. 195, a mix of single-member, multimember and flotorial districts, save its eleven flotorial districts, to be equalized by Aug. 1, 1967. Kilgarlin's plan of single-member districts refused, and the claim that the multimember districts cancel the votes of racial and political groups.
    n: '*Kilgarlin v. Martin*, [252 F. Supp. 404](https://static.case.law/f-supp/252/case-pdfs/0404-01.pdf) (S.D. Tex. 1966). See [[cal.1965-01-11.legislatures-tx]]. Names: Kilgarlin.'
    tags: [state:tx, name:kilgarlin-william-w]
  - id: cal.1966-02-02.vietnam-congress
    when: Feb. 2
    date: '1966-02-02'
    thread: vietnam-congress
    c: Javits and Randolph again propose that Congress replace the Southeast Asia resolution with one approving the war on its present scale and stating its aims.
    n: '[112 Cong. Rec., Senate, Feb. 2, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-5-2.pdf), 1892 ff. [[w.gibbons-u-s-government-and]], IV, 251. Names: Javits, Randolph.'
    tags: [name:javits-jacob-k, name:randolph-jennings]
  - id: cal.1966-02-03.space
    when: Feb. 3
    date: '1966-02-03'
    thread: space
    also: [soviet-union]
    c: 'Luna 9, Soviet and unmanned, lands on the moon, the first soft landing, and sends back signals. Johnson to Podgorny: "all mankind applauds it."'
    n: 'Message of Congratulations Following the Landing on the Moon of the U.S.S.R.''s Luna 9, [1966 Pub. Papers 141](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=217) (Feb. 3, 1966). To check: [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson, Podgorny.'
    tags: [name:johnson-lyndon-b, name:podgorny-nikolai-v]
  - id: cal.1966-02-03.vietnam-congress
    when: Feb. 3
    date: '1966-02-03'
    thread: vietnam-congress
    c: Foreign Relations, in closed session, agrees to hold public hearings on the war, the witnesses left to Fulbright and Hickenlooper, Hickenlooper still against open sessions.
    n: 'Daily Digest, [112 Cong. Rec. D34](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=32). *New York Times*, Feb. 4, 1966. [[w.gibbons-u-s-government-and]], IV, 223–24. Opened: [[cal.1966-02-04.vietnam]]. Names: Fulbright, Hickenlooper.'
    tags: [name:fulbright-j-william, name:hickenlooper-bourke-b]
  - id: cal.1966-02-04.vietnam
    when: Feb. 4
    date: '1966-02-04'
    thread: vietnam-hearings
    also: [congress, press-and-broadcasting]
    c: 'The Foreign Relations Committee, Fulbright in the chair, takes up the war in televised hearings on the $415 million of supplemental economic aid, mostly for Vietnam: Bell of AID the first witness on television. Rusk heard Jan. 28, not televised.'
    n: 'Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966). [FRUS 1964–68, IV, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v04/d64) (editorial note). [[w.gibbons-u-s-government-and]], IV, 222–230, 239–251. To check: [[w.vietnam-hearings]]; [[w.fry-debating-vietnam]]; [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.friendly-due-to-circumstances-beyond]]. Names: Fulbright, Rusk, Bell.'
    tags: [name:fulbright-j-william, name:rusk-dean, name:bell-david-e]
  - id: cal.1966-02-04.civil-rights-the-executive
    when: Feb. 4
    date: '1966-02-04'
    thread: civil-rights-the-executive
    c: Roger Wilkins, 34, sworn as Director of the Community Relations Service, Collins's successor.
    n: 'Remarks at the Swearing In of Roger Wilkins as Director, Community Relations Service, [1966 Pub. Papers 141](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=217) (Feb. 4, 1966). To check: [[w.wilkins-mans-life]]. See [[cal.1964-10-30.civil-rights-bill]]. Names: Collins, Wilkins.'
    tags: [name:johnson-lyndon-b, name:wilkins-roger-w, name:collins-leroy]
  - id: cal.1966-02-04.opinion
    when: Feb. 4
    date: '1966-02-04'
    thread: opinion
    also: [economy, vietnam]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: prices and wages frozen for as long as the war in Vietnam lasts: a good idea 45 percent, a poor idea 42.'
    n: '[[w.gallup-poll]], III, 1987.'
  - id: cal.1966-02-04.india-and-china-food
    when: Feb. 4
    date: '1966-02-04'
    thread: india-and-china-food
    also: [farm, foreign-aid]
    c: 'News conference: for India''s drought and famine, Johnson allots 2 million tons of wheat and 1 million of maize, to be shipped at once. Rusk, Jan. 28, had urged a new allocation "as soon as possible."'
    n: 'The President''s News Conference, [1966 Pub. Papers 143](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=219) (Feb. 4, 1966). [FRUS 1964–68, XXV, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v25/d286) (Rusk). To check: [[w.ahlberg-transplanting-the-great-society]]; [[w.brands-wages-of-globalism]]. See [[cal.1965-12-14.india-and-china]]. Names: Johnson, Rusk.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1966-02-04.republican-party-congress
    when: Feb. 4
    date: '1966-02-04'
    thread: republican-party-congress
    also: [vietnam-congress]
    c: Case to the New Jersey Chamber of Commerce, against the Mansfield–Aiken report's choice between a widening war and Hanoi's terms. Neither hawk nor dove; the people to be told what they face. "One voice, and one voice only, can speak for our Government."
    n: '[[w.johns-vietnams-second-front]], 103. To check: the speech, Feb. 4, 1966, box 34/97-L, Clifford Case Papers, Rutgers University (cited by [[w.johns-vietnams-second-front]], 103 n.103). Names: Case.'
    src:
      c: ccf0b6fb
      rows:
        - 'w.johns-vietnams-second-front 103: all'
        - 'via w.johns-vietnams-second-front 103 n.103: all'
    tags: [name:case-clifford-p, state:nj]
  - id: cal.1966-02-04.poverty
    when: Feb. 4
    date: '1966-02-04'
    thread: poverty
    also: [robert-kennedy]
    c: 'Robert Kennedy walks through Bedford-Stuyvesant and meets its community leaders under Judge Thomas R. Jones: "I''m weary of study, Senator. Weary of speeches, weary of promises that aren''t kept."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 786. To check: Thomas Johnston, oral history interview by L. J. Hackman, Jan. 21, 1970, 254, RFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 786 n.43); [[w.newfield-robert-kennedy]], 94 (cited by [[w.schlesinger-robert-kennedy-and-his]], 786 n.44). See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy.'
    src:
      c: 7f85b270
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 786: all'
        - 'via w.schlesinger-robert-kennedy-and-his 786 n.43: A'
    tags: [name:kennedy-robert-f, state:ny, city:nyc]
  - id: cal.1966-02-05.specials
    when: Feb. 5
    date: '1966-02-05'
    thread: specials
    c: North Carolina 1st, special. Walter B. Jones (D), a State senator, holds Bonner's seat over East (R), 21,773 to 14,308, 60.3 percent. Bonner died Nov. 7, 1965. Swing 22.2 to R.
    n: 'Votes: [N.C. *Manual*, 1967, p. 299](https://archive.org/details/northcarolinama1967nort/page/n316). See [[cal.1961-04-04.states-and-cities]]. Names: Jones, Bonner.'
    tags: [special:1966-02-05-h-NC-1, name:jones-walter-b-sr, name:bonner-herbert-c]
  - id: cal.1966-02-05.vietnam-hearings
    when: Feb. 5
    date: '1966-02-05'
    thread: vietnam-hearings
    also: [congress]
    c: '8:27 a.m., Johnson to O''Brien by telephone, the morning after the first day on television: the hearings "a very, very disastrous break."'
    n: '[FRUS 1964–68, IV, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v04/d64) (editorial note): LBJ Library, Recordings and Transcripts, Tape 66.04, PNO 1. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-02-04.vietnam]]. Names: Johnson, O''Brien.'
    tags: [name:johnson-lyndon-b, name:obrien-lawrence-f]
  - id: cal.1966-02-06.vietnam
    when: Feb. 6–8
    date: '1966-02-06'
    thread: vietnam
    c: 'Honolulu, announced Feb. 4. Johnson, with Rusk, McNamara, Freeman, Gardner, Bell, Harriman, Lodge, Wheeler and Westmoreland; Thiệu and Kỳ with their ministers. Kỳ''s four goals: defeat the Viet Cong, eradicate social injustice, a viable economy, true democracy. Working groups on rural construction, the economy, health and education, diplomacy. The Declaration of Honolulu, Feb. 8: a constitution to be drafted, put to the people, ratified by secret ballot, and an elected government; the "war for the hearts of our people." Humphrey to go on to Saigon. Feb. 8, Johnson''s report at Los Angeles.'
    n: 'The Declaration of Honolulu, [1966 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=229); Joint Statement Following Discussions in Honolulu With the Chief of State and the Prime Minister of Vietnam, [1966 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=228) (Feb. 8, 1966); Remarks at the Los Angeles International Airport, [1966 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231) (Feb. 8, 1966). [FRUS 1964–68, IV, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v04/d69). [[w.drea-mcnamara-clifford-and-the-2011]], 122–123 (the conference, Feb. 7–8, and who attended); [[w.cosmas-joint-chiefs-of-staff-2012]], 442 (Thiệu and Kỳ; the goals for 1966); [[w.gibbons-u-s-government-and]], IV, 230–33 (the conference; Johnson with Kỳ and Thiệu alone, Feb. 7, by Moyers''s summary); [[w.herring-lbj-and-vietnam]], 68 (the conference, called in haste; Johnson pressing health, education and democracy in the closed sessions; the communiqué "a kind of bible"). To check: [[w.berman-lyndon-johnsons-war]]; [[w.karnow-vietnam]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1965-11-28.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Harriman, Wheeler, Freeman, Gardner, Bell, Lodge, Westmoreland, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    src:
      c: 5aaf9a4f
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=229: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=228: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d69: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 122: A'
        - 'w.drea-mcnamara-clifford-and-the-2011 123: A-C'
        - 'w.gibbons-u-s-government-and IV, 230–33: ?'
        - 'w.cosmas-joint-chiefs-of-staff-2012 442: C'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 442 n.1a: C'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 442 n.1b: C'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 442 n.3: C'
        - 'w.herring-lbj-and-vietnam 68: A, E-F'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:freeman-orville-l, name:gardner-john-w, name:bell-david-e, name:harriman-w-averell, name:lodge-henry-cabot, name:wheeler-earle, name:westmoreland-william, name:nguyen-van-thieu, name:nguyen-cao-ky, name:humphrey-hubert-h]
  - id: cal.1966-02-06.opinion
    when: Feb. 6
    date: '1966-02-06'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Republicans'' best candidate for 1968: Nixon 33, Lodge 15, Goldwater 11, Romney 10, Scranton 5, Dirksen 5, Rockefeller 5, Lindsay 4, Taft 4, Reagan 3, Percy 2, Hatfield 1. Independents: Nixon 21, Lodge 15, Romney 12, Goldwater 10, Rockefeller 8, Dirksen 7. Democrats: Lodge 17, Nixon 14, Rockefeller 13, Scranton 11.'
    n: '[[w.gallup-poll]], III, 1987. Names: Nixon, Lodge, Goldwater, Percy, Hatfield, Romney, Scranton, Rockefeller, Dirksen, Lindsay, Taft, Reagan.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:dirksen-everett, name:rockefeller-nelson, name:lindsay-john-v, name:taft-robert-jr, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o]
  - id: cal.1966-02-08.specials
    when: Feb. 8
    date: '1966-02-08'
    thread: specials
    c: New York 17th, special. Kupferman (R), of the City Council, holds Lindsay's seat over Orin Lehman (D), 44,125 to 43,206, 46.4 percent, a 919-vote margin; Jeffrey St. John (Conservative) 7,796, 8.2 percent. Lindsay resigned Dec. 31, 1965, to be mayor. Swing 24.8 to D.
    n: 'Votes: CQ Guide 6th (2010) 1279. Check: *N.Y. Legislative Manual*, 1967. See [[cal.1961-04-04.states-and-cities]]; [[cal.1966-01-10.congress]]. Names: Lindsay, Kupferman.'
    tags: [special:1966-02-08-h-NY-17, name:kupferman-theodore-r, name:lindsay-john-v]
  - id: cal.1966-02-08.jobs-and-wages-14b
    when: Feb. 8
    date: '1966-02-08'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Cloture on the motion to take up the repeal of 14(b) refused, [51–48](https://voteview.com/rollcall/RS0890267), two-thirds needed.
    n: See [[cal.1966-01-24.jobs-and-wages]].
  - id: cal.1966-02-08.vietnam-hearings
    when: Feb. 8
    date: '1966-02-08'
    thread: vietnam-hearings
    also: [congress]
    c: Gavin before the Foreign Relations Committee, for holding enclaves on the coast.
    n: 'Daily Digest, [112 Cong. Rec. D40](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=38). Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966) (Check the pages). [[w.gibbons-u-s-government-and]], IV, 239–41. See [[cal.1966-02-04.vietnam]]. Names: Gavin.'
    tags: [name:gavin-james-m]
  - id: cal.1966-02-08.vietnam-humphrey
    when: Feb. 8
    date: '1966-02-08'
    thread: vietnam-humphrey
    c: 'Los Angeles International Airport, back from Honolulu: Humphrey, met there, to leave for Saigon and the Asian capitals with Freeman; missions to follow.'
    n: 'Remarks at the Los Angeles International Airport Following the President''s Return From Honolulu, [1966 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231) (Feb. 8, 1966). [[w.dallek-flawed-giant]], 355. See [[cal.1966-02-06.vietnam]]. Names: Humphrey, Freeman, Johnson.'
    src:
      c: eb0cf9e3
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=231: all'
        - 'w.dallek-flawed-giant 355: all'
    tags: [name:humphrey-hubert-h, name:freeman-orville-l, name:johnson-lyndon-b]
  - id: cal.1966-02-09.opinion
    when: Feb. 9
    date: '1966-02-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Jan. 21–26: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13. The United States to accept the UN''s decision, whatever it is: a good idea 49, a poor idea 37. Dec. 31, 1965–Jan. 5, 1966: the war to end in a clear-cut military victory 7; in a compromise settlement 69.'
    n: '[[w.gallup-poll]], III, 1987–88. See [[cal.1966-01-31.vietnam]].'
  - id: cal.1966-02-09.voting-rights-tx
    when: Feb. 9
    date: '1966-02-09'
    thread: voting-rights
    also: [court]
    c: Austin. A three-judge court holds the Texas poll tax, $1.75, void as a condition of voting under the due process clause, on the Attorney General's suit under § 10 of the Voting Rights Act. No violation of equal protection or of the Fifteenth Amendment found. Thornberry for the court.
    n: '*United States v. Texas*, [252 F. Supp. 234](https://static.case.law/f-supp/252/case-pdfs/0234-01.pdf) (W.D. Tex. 1966). To check: [[w.lawson-black-ballots]]; [[w.davidson-race-and-class-in]]. See [[cal.1965-08-06.voting-rights]]; [[cal.1963-11-09.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1966-02-10.vietnam
    when: Feb. 10–14
    date: '1966-02-10'
    thread: vietnam-humphrey
    c: Humphrey, with Harriman and Valenti, from Honolulu to Saigon, then Bangkok; Vientiane, four hours with Souvanna. A tour of Asia, Feb. 9–23, at Johnson's request.
    n: '[FRUS 1964–68, XXVIII, doc. 220](https://history.state.gov/historicaldocuments/frus1964-68v28/d220) (Humphrey to Johnson on Vientiane, Feb. 16). To check: [[w.solberg-hubert-humphrey]]; [[w.humphrey-education-of-a-public-1976]]; [[w.johns-price-of-loyalty]]. See [[cal.1966-02-06.vietnam]]. Names: Humphrey, Harriman, Valenti, Souvanna Phouma, Johnson.'
    tags: [name:humphrey-hubert-h, name:harriman-w-averell, name:valenti-jack, name:souvanna-phouma, name:johnson-lyndon-b, place:saigon, place:vientiane]
  - id: cal.1966-02-10.georgia
    when: Feb. 10
    date: '1966-02-10'
    thread: georgia-bond
    also: [students]
    c: 'Bond''s suit. A three-judge district court at Atlanta upholds the House, 2–1 (Check the date): the SNCC statement and his remarks a rational ground for doubting he could take the oath in good faith. Tuttle, dissenting: beyond the House''s power under the State constitution. Bond appeals.'
    n: '*Bond v. Floyd*, [251 F. Supp. 333](https://static.case.law/f-supp/251/case-pdfs/0333-01.pdf) (N.D. Ga. 1966), as given in *Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966) (K–J Cong. II.J.1). See [[cal.1966-01-10.georgia-bond]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-02-10.jobs-and-wages-14b
    when: Feb. 10
    date: '1966-02-10'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Cloture on the repeal of 14(b) refused again, [50–49](https://voteview.com/rollcall/RS0890268). Mansfield lays the bill aside.
    n: 'See [[cal.1966-01-24.jobs-and-wages]]. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1966-02-10.foreign-aid
    when: Feb. 10
    date: '1966-02-10'
    thread: foreign-aid
    also: [farm, south-asia]
    c: 'Food for Freedom message: food aid no longer governed by surpluses; shipments tied to self-help; sales for foreign currencies to give way to long-term dollar credits within five years.'
    n: 'Special Message to the Congress: Food for Freedom, [1966 Pub. Papers 163](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=239) (Feb. 10, 1966). To check: [[w.ahlberg-transplanting-the-great-society]]. See [[cal.1966-02-01.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-10.vietnam-hearings
    when: Feb. 10
    date: '1966-02-10'
    thread: vietnam-hearings
    also: [congress, press-and-broadcasting]
    c: Kennan before the Foreign Relations Committee, against widening the war. CBS shows reruns in place of his testimony.
    n: 'Daily Digest, [112 Cong. Rec. D47](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=45). Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966) (Check the pages). [[w.gibbons-u-s-government-and]], IV, 239, 241–42. See [[cal.1966-02-04.vietnam]]. Names: Kennan.'
    tags: [name:kennan-george-f]
  - id: cal.1966-02-10.civil-rights-the-executive
    when: Feb. 10
    date: '1966-02-10'
    thread: civil-rights-the-executive
    c: 'Reorganization Plan 1 of 1966: the Community Relations Service moved from Commerce to Justice.'
    n: 'Special Message to the Congress Transmitting Reorganization Plan 1 of 1966 Relating to the Community Relations Service, [1966 Pub. Papers 158](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=234) (Feb. 10, 1966). To check: [[w.levine-resolving-racial-conflict]]; [[w.graham-civil-rights-era]]. See [[cal.1966-02-04.civil-rights-the-executive]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-11.opinion
    when: Feb. 11
    date: '1966-02-11'
    thread: opinion
