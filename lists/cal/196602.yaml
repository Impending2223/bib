  - id: cal.1966-02-01.china
    when: Feb. 1
    date: '1966-02-01'
    thread: china-bomb
    also: [europe-and-the-alliance-britain]
    c: 'Foreign Ministry note to the British chargé d''affaires'' office: strong protest at Britain''s letting the U.S. aircraft carrier *Enterprise* and the nuclear-powered *Bainbridge* gather at Hong Kong. The note stresses that U.S. war preparations at Hong Kong bode grave consequences for it; Britain must stop them at once and end Hong Kong''s use as a base for U.S. aggression.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 82 (Feb. 1, 1966).'
