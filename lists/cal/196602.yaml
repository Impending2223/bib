    c: Zhou Enlai talks with the Northwest forestry officials and Forestry Ministry leaders at the national forestry conference. Tree planting is a hundred-year plan; plant as well as fell, on two legs, relying on the farmers; the masses first over state forests, tending over felling; Northwest planting to focus on the Yellow River's silt sources. He worries most that water control has gone wrong and the forests are overfelled; as Premier he cannot account for two things, the Yellow River and forestry.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 15 (Feb. 23, 1966). Made public: 2020. Names: Zhou Enlai.'
