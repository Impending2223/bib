  - id: cal.1966-02.vietnam-hanoi
    when: Feb.
    date: 1966-02
    thread: vietnam-hanoi
    also: [vietnam, vietnam-operations]
    c: 'The Central Military Party Committee meets on the situation in the South and resolves on the military task: raise action by the main force and by militia and guerrillas, to destroy and break up a large part of the American and Saigon forces, a few regiments and some American battalions; the forest and mountain theaters the ground for destroying the enemy, the Western Highlands and the Eastern Nam Bộ first; Region 5 pushed; Trị–Thiên made an important strategic direction. It sets six strategic modes of fighting: main-force campaigns; guerrilla war; attacks on bases, depots, airfields, ports and headquarters; cutting the enemy''s roads and waterways; action in the towns, from small attacks with political struggle to large attacks with uprising; and combat joined to political struggle and troop proselytizing, the Saigon army''s above all, on a strategic scale.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 76, 91–92. Made public: 2013. Check: the day; the history gives only "tháng 2-1966".'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-02.vietnam-hanoi-2
