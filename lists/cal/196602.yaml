  - id: cal.1966-02-03.vietnam
    when: Feb. 3
    date: '1966-02-03'
    thread: vietnam
    c: 'Kohler from Moscow to Thompson, on a landing at Vinh: the Soviets would feel compelled to counter it, with aircraft, heavy equipment and men to run their weapons, and to back a Chinese attempt to repulse it; it would mean "an early showdown with the Chinese."'
    n: '[[w.gibbons-u-s-government-and]], IV, 196. To check: Kohler to Thompson, Feb. 3, 1966 (excerpts, attached to Thompson to Rice, Feb. 9, 1966), Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 196 n.79). See [[cal.1965-12-15.vietnam-3]]. Names: Kohler, Thompson.'
    src:
      c: ddcadcde
      rows:
        - 'w.gibbons-u-s-government-and IV, 196: all'
        - 'via w.gibbons-u-s-government-and IV, 196 n.79: all'
    tags: [name:kohler-foy-d, name:thompson-llewellyn-e]
  - id: cal.1966-02-03.vietnam-force-levels
    when: Feb. 3
    date: '1966-02-03'
    thread: vietnam-force-levels
    c: 'JCSM-76-66, the Joint Chiefs to McNamara, "Consequences of an Enclave Strategy," answering his request of Jan. 17 and Gavin in *Harper''s*: by forfeiting the initiative and conceding land, the enclave strategy "in effect, abandons national objectives," leading to defeat or to abandoning Southeast Asia.'
    n: '[FRUS 1964–68, IV, doc. 61](https://history.state.gov/historicaldocuments/frus1964-68v04/d61). [[w.gibbons-u-s-government-and]], IV, 241. Made public: FRUS 1964–68, IV (1998). Names: McNamara, Gavin.'
