  - id: cal.1966-02-02.china-leadership
    when: Feb. 2
    date: '1966-02-02'
    place: shanghai
    thread: china-propaganda
    also: [china-army, china-mao]
    c: 'Shanghai.{1} Jiang Qing, with Lin Biao''s consent, holds a forum on army literary and artistic work (to Feb. 20) and does most of the talking.{2} The summary, revised by Zhang Chunqiao and Chen Boda and sent to Mao, says an anti-Party, anti-socialist black line opposed to Mao''s thought has ruled the arts for sixteen years, and calls for a socialist cultural revolution to root it out.{3} Liu Zhijian, deputy head of the General Political Department, Li Manchun, Xie Tangzhong and Chen Yading attend. Jiang Qing talks with Liu alone eight times and with the group four times; thirteen group showings of films and three of plays, twenty-one films of her choosing.{4} By the attendees'' later recollection she says: a black line opposed to Mao''s thought has held power over the arts for seventeen years and must go, the army to lead; Zhou Enlai''s "separate first, then merge" for national music is wrong; the Peking committee, Zhou Yang, Lin Mohan and Xia Yan are attacked; *The East Is Red* is criticized.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 2, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 9 (Feb. 2–20, 1966; the forum; Jiang Qing''s attack on Zhou''s call for "separate first, then merge" and on *The East Is Red*; the summary and its issue Apr. 10, note 1); [[w.macfarquhar-maos-last-revolution]], 30–31 (the forum and its summary); [[w.macfarquhar-origins-of-the-cultural]], III, 451 (Liu Zhijian and colleagues fly to Shanghai Feb. 2; eight talks with Liu, four group discussions, thirteen films and three operas; the table has the forum Feb. 2–10 and 16–20); [[w.mao-zedong-zhuan]], VI, ch. 74 n.27 (Jiang Qing 江青, with Lin Biao''s 林彪 consent, Feb. 2 to 20 at Shanghai, the forum on army literary and artistic work: few attended, besides films and plays chiefly Jiang''s talk; the summary written up after, Jiang unhappy with the first draft, given to Zhang Chunqiao 张春桥 to revise, Chen Boda 陈伯达 joining, then sent to Mao; its claim of a ''black line'' ruling the cultural front for sixteen years and call for a socialist revolution on that front, n.27). [[w.yang-jisheng-tiandi-fanfu]], I, 128 (Jiang Qing''s forum on army literary and artistic work held in Shanghai 上海 at Lin Biao''s 林彪 commission, Feb. 2 to 30 as the page prints it 2月2日到30日; Mao has Chen Boda go to Shanghai to revise the summary with Zhang Chunqiao; Mao revises it three times and adds passages; it says the arts have since the founding largely not carried out Mao''s line, a black line ruling them, and calls for a socialist revolution on the cultural front); [[w.peng-zhen-nianpu-1902]], IV, 465 (Feb. 2–20, 1966; Jiang Qing, with Lin Biao''s consent, holds the forum on army literature and art at Shanghai); [[w.jian-zhou-enlai]], 533 (the summary, revised with Mao''s input: since 1949 "fierce class struggles on the cultural front," "an anti-Party and antisocialist black line"; "a great socialist revolution on the cultural front"; Lin Biao no part in it); [[w.pu-weihua-zalan-jiu-shijie]], 40 (Feb. 2 to 20, with Lin Biao''s support; Liu Zhijian, deputy head of the General Political Department, Li Manchun, Xie Tangzhong and Chen Yading there; by Liu''s account Jiang Qing alone decided everything; she talks with Liu alone eight times, with the group four times); [[w.pu-weihua-zalan-jiu-shijie]], 41–42 (thirteen group showings of films and three of plays, twenty-one films of her choosing; three talks with the director, cameraman and some actors of the *Nanhai changcheng* sample; no notes allowed, only Chen Yading''s record afterward; her words, as Liu Zhijian, Li Manchun and Chen Yading recalled them: a black line opposed to Mao''s thought has held power over the arts for seventeen years and must go, the army to lead; Zhou Enlai''s "separate first, then merge" for national music wrong; the Peking committee, Zhou Yang, Lin Mohan and Xia Yan attacked; *The East Is Red* criticized); [[w.liu-jixian-ye-jianying-nianpu]], II, 934 (Feb. 2–20, 1966; the forum on army literary and artistic work 部队文艺工作座谈会 at Shanghai 上海, planned by Lin Biao 林彪 and Jiang Qing 江青, Jiang presiding); [[w.zhu-de-nianpu-xinbian]], III, 1948 (Feb. 2–20, 1966; Jiang Qing 江青, entrusted by Lin Biao 林彪, holds the forum on literature and art in the forces 部队文艺工作座谈会 at Shanghai 上海); [[w.pu-weihua-zalan-jiu-shijie]], 40–42; [[w.pu-weihua-zalan-jiu-shijie]], 41–42. Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). Check: the forum''s end; Yang prints "Feb. 2 to 30" (I, 128). To check: Summary of the Army Forum on Literature and Art Work called by Jiang Qing at the behest of Lin Biao (Zhongfa [1966] 211), in [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 604–610 (cited by [[w.macfarquhar-maos-last-revolution]], 31 n.69); [[w.jin-1949-1989-niande-zhongguo]], 618–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.120); [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 604 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.121); Mao Zedong 毛泽东, words added in revising the draft summary of the forum on army literary and artistic work convened by Comrade Jiang Qing 《江青同志召开的部队文艺工作座谈会纪要》 (manuscript 手稿), Mar. 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.27); [[w.zhongguo-gongchandang-lishi-dashiji]], 307 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 40 n.62); Liu Zhijian 劉志堅, 〈《部隊文藝工作座談會紀要》產生前後〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 30 (1989), 1–44; Ge Hengjun 葛恒軍, 〈1966年部隊文藝工作座談會及其會議紀要考析〉, in [[w.zhongguo-gongchandang-zhongda-shishi]], IV, 1936–1943 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 39 n.61a, n.61b). Names: Jiang Qing, Lin Biao, Zhang Chunqiao, Chen Boda, Liu Zhijian, Li Manchun, Xie Tangzhong, Chen Yading, Zhou Enlai, Zhou Yang, Lin Mohan, Xia Yan.'
