  - id: cal.1966-02-01.china-leadership-6
    when: Feb. 1
    date: '1966-02-01'
    thread: china-hai-rui
    follows:
      - cal.1966-02-01.china-leadership-5
    c: 'Peng Zhen 彭真 gathers the seven papers Xu Liqun 许立群 sent on Jan. 18, 22, 28 and 31 on the response to Yao Wenyuan''s 姚文元 article, with his letter, and sends them to Mao 毛泽东, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and the Five-Man Group''s Lu Dingyi 陆定一, Kang Sheng 康生 and Wu Lengxi 吴冷西: the group to meet on the 3rd and report to the Center. (The papers: Xu''s forum of Jan. 17 with six editorial boards; his letter of Jan. 26 on a telephone call with Zhang Chunqiao 张春桥 at the Spring Festival; passages of Guan Feng 关锋, Lin Jie 林杰 and Qi Benyu 戚本禹 linking *Hai Rui* with the Lushan meeting; Guo Moruo''s 郭沫若 resignation letter; essays of Guan Feng of 1962 and of Deng Tuo 邓拓; on the Shanghai plays *Hai Rui shang shu* and *Hai Rui bei qian*; the self-criticisms of the actors Ma Lianliang 马连良 and Tan Yuanshou 谭元寿.)'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 464–465; [[w.pu-weihua-zalan-jiu-shijie]], 58 (Peng Zhen sends Xu Liqun''s letter and the seven papers to Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Lu Dingyi, Kang Sheng and Wu Lengxi, with a note: the Five-Man Group to meet the day after next and then put its views to the Center). Made public: 2012. The order: after [[cal.1966-02-01.china-leadership-5]], the printed order alone ([[w.peng-zhen-nianpu-1902]], IV, 464–65). Names: Peng Zhen, Yao Wenyuan, Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Lu Dingyi, Kang Sheng, Zhang Chunqiao, Xu Liqun, Wu Lengxi, Guan Feng, Qi Benyu, Guo Moruo, Deng Tuo, Ma Lianliang.'
    src:
