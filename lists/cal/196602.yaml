  - id: cal.1966-02-19.china-leadership-2
    when: Feb. 19
    date: '1966-02-19'
    thread: china-zhou
    also: [china-liu]
    c: 'Zhou Enlai at the Politburo Standing Committee, Liu Shaoqi presiding, hears Bo Yibo and Tao Lujia on the national industry-and-transport work conference and its political work conference.{1} Transport, then power, go first; if they fail, nothing else rises. On support for farming: the norths eight provinces first.{2}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 14 (Feb. 19, 1966); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631–632 (Feb. 19, 1966; Liu says the results of 1965 are the accumulation of eight years and progress is great, but rousing the masses has only begun and the potential is large; to be at once full of drive and steady, with a clear head and a cool promoter; the leap forward was halved for some years, the adjustment halved again, and recently each year is better than the last; in any work the political meaning is to be made clear to those who do it; the highlight on politics means that people will not haggle over material gain, and work done better must also be paid by labor, not work harder and wages less; workers have practical difficulties including those of their families: first highlight politics, second solve the practical problems and guarantee their livelihood, a mass-line question); [[w.deng-xiaoping-nianpu-1904]], III, 1895–1896 (Feb. 19, 1966; afternoon, 下午; Deng at the Politburo Standing Committee meeting Liu Shaoqi presides over, which hears Bo Yibo and Tao Luke 陶鲁笳 on the national conferences on industry and communications and on political work; when they report that the adjustment period had many different views Deng says adjustment was necessary, Anshan then having neither coal nor ore; since the accounts were seen the ''eight-character policy'' was put forward; it includes raising, chiefly quality; the 1964 call to build the third front and strengthen war preparation roused every enterprise; the 70 Daqing-type enterprises recommended are good, but not Daqing alone, the provinces and cities to hold it and check it; on the First Ministry''s plan of 100,000 vehicles at Changchun: be careful with figures, state a production capacity, not an output, which follows the state plan; 1966''s output may exceed the plan with growth near 15 percent, yet always quality first; factory-commune pairing to be tried first, or state property is given away). Made public: 1996. Names: Zhou Enlai, Liu Shaoqi, Bo Yibo, Tao Lujia.'
    src:
      c: b3edce3c
      rows:
