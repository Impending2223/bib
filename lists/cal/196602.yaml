  - id: cal.1966-02-25.women
    when: Feb. 25
    date: '1966-02-25'
    thread: women
    also: [alabama, poverty]
    c: 'Tuscaloosa, Ala. Mrs. Johnson to the Leadership Conference of Women at the University of Alabama (the American Association of University Women, the State federations of business and professional women''s and of women''s clubs, the League of Women Voters), Frank Rose its host. Robert Shelton, the Klan''s imperial wizard, of Tuscaloosa, had objected to "Pinko tripe"; she arrives a day after Lurleen Wallace''s announcement. Signs: "We support LBJ on Vietnam" and "Draft Lady Bird for Governor of Alabama." Rose has a contract to train Head Start teachers for Alabama and adjoining States; the auditorium is where Wallace and Katzenbach faced each other. A chartered plane of newspaperwomen. The League of Women Voters has set up poll tax booths in supermarkets and school lobbies.'
