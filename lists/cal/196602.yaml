    thread: opinion
    c: 'Harris, early February, in the *Washington Post*: by 2 to 1 the war must be seen through. Disagree, carry the war more to the North, 16 percent; agree, but increase the military effort, 33; agree, but do more to negotiate, 34; disagree, pull out, 9; not sure, 8. Johnson''s handling of the war approved by 49 percent, down from 63 in January.'
