  - id: cal.1966-02-08.china-leadership
    when: Feb. 8
    date: '1966-02-08'
    place: wuhan
    thread: china-hai-rui
    also: [china-mao]
    follows:
      - cal.1966-02-08.china-leadership-3
    c: 'Mao, Wuchang, hears Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun and Hu Sheng on the Outline Report.{1} A conclusion in two months: not possible even then. Guo Moruo and Fan Wenlan to be asked for a little self-criticism, not attacked.{2} Wu Han may stay vice-mayor.{3} Guan Feng''s essay of 1962: a matter for three years on.{4} Told the Standing Committee has approved the Outline, he does not at once object.{5} The Center circulates it Feb. 12.{6} In the reception hall of Mao''s East Lake villa, the party having landed at Hankou at noon; Tian Jiaying with them; Wang Renzhong present.{7} Mao asks whether Wu Han is anti-Party and anti-socialist. Peng answers: political errors, no tie to Peng Dehuai.{8}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 8, 1966. [[w.macfarquhar-maos-last-revolution]], 29–30 (Peng Zhen presents the Outline; Wu Han may stay); [[w.lengxi-shinian-lunzhan-1956-1966]], 933–934 (Feb. 8: Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Hu Sheng, Xu Liqun, Tian Jiaying fly Peking to Wuhan, reach Hankou at noon and go to the East Lake villa; Wang Renzhong present; Peng, Lu, Xu and Hu report on the academic criticism, the "Outline"); [[w.macfarquhar-origins-of-the-cultural]], III, 454–55 (Mao lets the outline go out, or raises no objection; Wu Han may stay deputy mayor; the Lushan link Kang Sheng''s discovery); [[w.mao-zedong-zhuan]], VI, ch. 74 (Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi and others fly specially to Wuhan to report to Mao; told that the Standing Committee has discussed and approved the outline, he voices no objection at once, asks only whether Wu Han 吴晗 is anti-Party and anti-socialist, says Wu may go on as vice-mayor, and on the ''rectification of the left'' says: three years later; Peng and the others took Mao to agree; the Center transmitted the outline formally Feb. 12). [[w.yang-jisheng-tiandi-fanfu]], I, 122–123 (the report at Mao''s East Lake 東湖 residence: Mao asks Peng whether Wu Han is anti-Party and anti-socialist; Peng: yes, he stands with those dismissed; Mao: Wu Han is to be dismissed no more and goes on as before as mayor 市長; to Peng''s wish for a political conclusion, Mao: the struggle against bourgeois ideology is a long class struggle, not to be settled by a hasty conclusion; Peng raises Guan Feng 關鋒 and Qi Benyu 戚本禹 as leftists who also wrote allusive essays and whether to rectify them; Mao: three years on 三年以後再說; Yang gives these as Xu Liqun''s account to Gong Yuzhi 龔育之, broadly agreeing with the Dashiji; Mao neither opposed nor approved the Outline (the Dashiji), and did not even circle it (Wang Li)); [[w.peng-zhen-nianpu-1902]], IV, 468–469 (Feb. 8, 1966; Wuhan; Peng Zhen reports the outline; Mao voices no disagreement but asks whether Wu Han is anti-Party and anti-socialist; Peng: political errors, no tie to Peng Dehuai; Mao: Wu Han may stay vice-mayor; the political verdict in two months; the struggle with bourgeois ideology a long class struggle; two months not enough either; Guo Moruo and Fan Wenlan 范文澜 to make some self-criticism of their own; Guan Feng''s essay of 1962 (as He Ming) on moral inheritance not to be hurried into criticism, three years hence; Peng drafts the Center''s comment and wires it to Peking); [[w.jian-zhou-enlai]], 533 (Peng, Kang Sheng and Lu Dingyi report to Mao at Wuhan, Feb. 8; Mao: "Can Wu Han be considered an anti-Party and antisocialist figure?" Peng: "No, he cannot, but he has been very nervous"; Wu may stay vice mayor); [[w.dikotter-cultural-revolution]], 49 n.16 (the Group of Five at Mao''s villa on East Lake, Wuhan; Kang Sheng calls the play a "poisonous weed," Peng holds it a scholarly controversy; Mao: "You people work it out"); [[w.pu-weihua-zalan-jiu-shijie]], 20 n.38 (Mao: the "crux," the dismissal, was Kang Sheng''s invention); [[w.pu-weihua-zalan-jiu-shijie]], 60 (Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng and Tian Jiaying report; Mao objects to nothing; twice he asks whether Wu Han can be called anti-socialist; Peng: political errors, but no tie to Peng Dehuai; Mao: Wu Han need not be dismissed, he may stay vice-mayor; rectifying the left, three years on; Guan Feng''s essays: no harm, he had read He Ming''s; on the Outline only two points, no conclusion even in two months, and Guo Moruo and Fan Wenlan to make some self-criticism); [[w.lengxi-shinian-lunzhan-1956-1966]], 933; [[w.peng-zhen-nianpu-1902]], IV, 468–469. Made public: 1982 ([[w.kan-kang-sheng-pingzhuan]]). Check: Peng''s answer on Wu Han: Yang Jisheng, I, 122, by Xu Liqun''s account, has Peng say Wu Han stands with those the People''s Republic dismissed and may be called anti-Party and anti-socialist; Jian, 533, has him answer "No, he cannot, but he has been very nervous.". Check: Kang Sheng''s account in May (Pu Weihua, 76) has the group at Mao''s from Feb. 7, four days of talks to Feb. 10. To check: Outline Report of the Group of Five (the "February Outline"), as sent to the Center, in [[w.mao-zhuxi-zuixin-zhishi]], 1057–58 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.65); [[w.li-wang-li-fansi-lu]], II, 1051–52 (cited by [[w.macfarquhar-maos-last-revolution]], 30 n.66); [[w.lengxi-yi-mao-zhuxi-remembering]], 150–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144a); [[w.kan-kang-sheng-pingzhuan]], 178 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144b); [[w.qingshan-kang-sheng-waizhuan]], 258 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144c); [[w.xin-ban-guangming-ribao-shinian]], 278 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144d); [[w.ping-lian-yu-chunqiu-lu]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144e); [[w.jin-1949-1989-niande-zhongguo]], 616, 618 n.1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144f); [[w.al-zhongguo-gongchan-dang-zhizheng]], 268 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144g); [[w.zhonghua-renmin-gongheguo-fengyun]], 1, 1035 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 454 n.144h); Gong Yuzhi 龔育之, 〈「二月提綱」和東湖之行〉, in Zhang Hua et al., eds., *Huishou wenge* 《回首文革》 (Zhonggong dangshi chubanshe 中共黨史出版社, 2007), 286–287 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 122 n.36); *Yijiuliuwu nian jiuyue dao yijiuliuliu nian wuyue wenhua zhanxian shang liang tiao daolu douzheng dashiji* 《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》 (annex to the Circular of May 16, 1966 「五一六通知」) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 123 n.38a). See [[cal.1966-02-03.china-leadership-2]]. Names: Mao Zedong, Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi, Xu Liqun, Hu Sheng, Guo Moruo, Fan Wenlan, Wu Han, Guan Feng, Tian Jiaying, Wang Renzhong, Peng Dehuai. Check: whether [[w.kan-kang-sheng-pingzhuan]] (1982), on which the year rests, was printed for internal circulation; if so, Made public is the year of the next work cited ([[w.jin-1949-1989-niande-zhongguo]], 1989).'
