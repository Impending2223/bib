  - id: cal.1966-02-26.china-leadership
    when: Feb. 26
    date: '1966-02-26'
    thread: china-liu
    also: [china-organization]
    c: Liu Shaoqi talks with Liu Ningyi, Chairman of the All-China Federation of Trade Unions, on trade-union work. Lenin said unions are a school of communism, a link between the Party and the masses, and a prop of state power, though Lenin himself had no practice of it; the unions are the Party's belt to the masses and are to act as belt and conduit and report conditions. If Liu Ningyi has misgivings, that is counting personal gain and loss; the unions must take a stand and hold the class stand firm to report conditions; a wrong report is a mistake and nothing to fear; if right, though it offends and he is removed from his post, the masses will back him.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 633 (Feb. 26, 1966). Made public: 1996. Names: Liu Shaoqi, Liu Ningyi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc, name:liu-ningyi]
  - id: cal.1966-02-26.china-leadership-2
    when: Feb. 26
    date: '1966-02-26'
    thread: china-four-cleanups
    also: [china-economy]
    c: 'Deng Xiaoping 邓小平 gives the report to the national conferences on industry and communications and on political work in industry and communications. On estimating the situation: in a good situation be the more cool, a most important lesson of experience; the country is still ''poor and blank'' by population and level of output, only beginning to change; modernization of industry, agriculture, defense, science and technology is far off. On putting politics in command: politics commands business, but the result must come down to production, scientific experiment and class struggle; most important in each enterprise, especially after the ''four clean-ups'', is a revolutionized leading group with a good core man, or two, collective leadership and democratic centralism; enterprises run round the clock and workers'' eight hours are tense, women have housework, so labor and rest must be joined. ''We must always be promoters, cool promoters''; more, faster, better, cheaper with ''better'' first; quality first whatever the profit or the multiple of output. Of things sure in direction, factory–commune pairing, half-work half-study, narrowing the three differences, trusts, all lack experience, and Mao''s method is to try all, then spread. On learning and originality: the Chinese must be original, as in the theory of oil geology, when foreigners said China had no oil; but learn too from foreign results, predecessors and advanced enterprises; ''the imperialist'' and ''revisionist'' labels cannot be used, but their science and technology is useful.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1896–1897 (Feb. 26, 1966); [[w.teiwes-tragedy-of-lin-biao]], 59 (Deng''s remarks to the conference: politics must command business, but "politics in command" must result in production). The words: 上午 (III, 1896–1897). Deng: 我们要永远当促进派，要当冷静的促进派 (III, 1896). Made public: 2009 (the nianpu). To check: [[w.kau-lin-piao-affair]], 321–322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.6a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 264–265 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.6b). Names: Deng Xiaoping.'
