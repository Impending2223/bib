  - id: cal.1966-02.vietnam
    when: Feb.
    date: 1966-02
    thread: vietnam
    c: 'Masher renamed White Wing: Bundy asks MACV for no provocative names; Wheeler passes it on, Masher his example; Westmoreland complies.'
    n: '[[w.carland-united-states-army-in]], 203. Check the day. See [[cal.1966-01-24.vietnam]]. Names: Bundy, Wheeler, Westmoreland.'
    tags: [name:bundy-mcgeorge, name:wheeler-earle, name:westmoreland-william]
  - id: cal.1966-02-01.foreign-aid
    when: Feb. 1
    date: '1966-02-01'
    thread: foreign-aid
    c: 'Foreign aid message: aid to those who help themselves; agriculture, education and health first, and help with population. For fiscal 1967, $550 million of supporting assistance for Vietnam; five-year authorizations for economic and military aid.'
    n: 'Special Message to the Congress on the Foreign Aid Program, [1966 Pub. Papers 117](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=193) (Feb. 1, 1966). To check: [[w.brands-wages-of-globalism]]. See [[cal.1964-10-08.foreign-aid]]; [[cal.1965-09-06.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-02-01.vietnam-congress
    when: Feb. 1
    date: '1966-02-01'
    thread: vietnam-congress
    c: Ten of the fifteen Senators who wrote against resuming the bombing meet privately with Fulbright; they agree to try to force the administration into a full discussion of its policy.
    n: '*New York Times*, Feb. 2, 1966. [[w.gibbons-u-s-government-and]], IV, 223. See [[cal.1966-01-29.vietnam-congress]]. Names: Fulbright.'
    src:
      c: e42651d2
      rows:
