  - id: cal.1966-02-04.vietnam-air-war
    when: Feb. 4
    date: '1966-02-04'
    thread: vietnam-air-war
    c: 'SNIE 10-1-66, on heavier bombing of the North: it would greatly complicate the North''s war effort, but with a determined effort Hanoi could still move "substantially greater amounts than in 1965"; it would "almost certainly set a limit" to the growth of the main forces in the South, where, not to be estimated.'
    n: '[FRUS 1964–68, IV, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v04/d66). [[w.gibbons-u-s-government-and]], IV, 188–89. Made public: FRUS 1964–68, IV (1998).'
