    when: Feb. 20
    date: '1966-02-20'
    thread: vietnam-support
    c: 'The White House, dinner: the Bundys, the Cliffords, Mary Margaret Valenti, the Fowlers (a party of nine). Johnson on Vietnam, "about two thirds of what we talk about these days": "There''s not a mother in the world who cares more about it than I do, because I have two hundred thousand of them over there—and they think I am in charge, and if I am not, God help them—who the Hell is!" Mrs. Johnson tells Bundy how sad she is that he is leaving.'
