  - id: cal.1966-02-04.vietnam-air-war-2
    when: Feb. 4
    date: '1966-02-04'
    thread: vietnam-air-war
    c: 'Meeker, the Legal Adviser, to Rusk on mining the North''s harbors: lawful as collective defense, but "the real difficulty ... lies in the consequences with respect to Soviet, Chinese, and neutral shipping"; with no finding of the Security Council or a regional organization, "probably ... insufficient in the eyes of an impartial tribunal" to justify acts against third countries'' shipping.'
    n: '[[w.gibbons-u-s-government-and]], IV, 365 n.43. Names: Meeker, Rusk.'
