# Cal. LXXXVI December 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVI
entries:
  - id: cal.1966-12.civil-rights-organizations
    when: Dec.
    date: 1966-12
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: SNCC's staff meets at Peg Leg Bates's resort, Kerhonkson, N.Y. A vote to exclude whites from membership carried, 19–18, 24 abstaining (Check the count and the dates).
    n: 'To check: [[w.carson-in-struggle]]; [[w.hogan-many-minds-one-heart]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-12-01.vietnam
    when: Dec. 1
    date: '1966-12-01'
    thread: vietnam-marigold
    c: 'Marigold. Saigon, at the Italian ambassador D''Orlandi''s apartment: Lewandowski, the Polish member of the ICC, back from Hanoi, reads Lodge the ten points he gave Hanoi as the American position; the Poles will support a contact of the American and North Vietnamese ambassadors in Warsaw.'
    n: '[FRUS 1964–68, IV, doc. 322](https://history.state.gov/historicaldocuments/frus1964-68v04/d322). See [[cal.1966-06-29.vietnam-2]]. Names: Lewandowski, D''Orlandi, Lodge.'
    tags: [name:lewandowski-janusz, name:lodge-henry-cabot, name:dorlandi-giovanni, place:saigon]
  - id: cal.1966-12-01.europe-and-the-alliance
    when: Dec. 1
    date: '1966-12-01'
    thread: europe-and-the-alliance
    c: 'Bonn. Kiesinger, Minister-President of Baden-Württemberg, elected Chancellor by the Bundestag: a grand coalition of the CDU/CSU and the Social Democrats, Brandt Foreign Minister and Vice Chancellor. The Free Democrats had left Erhard''s cabinet Oct. 27; Kiesinger the CDU/CSU''s candidate Nov. 10; the coalition agreed Nov. 27; Erhard resigned Nov. 30.'
    n: 'FRUS 1964–68, XV, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v15/d184), [188](https://history.state.gov/historicaldocuments/frus1964-68v15/d188). [[w.schwartz-lyndon-johnson-and-europe]], 147, 149 (the Grand Coalition). Schwartz, 132, has the Free Democrats leave and Erhard resign "at the end of October"; FRUS''s editors, the entry''s dates (doc. 184 n. 2). To check: [[w.zimmermann-money-and-security]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Brandt, Kiesinger, Erhard.'
    tags: [name:kiesinger-kurt-georg, name:brandt-willy, name:erhard-ludwig]
  - id: cal.1966-12-02.europe-and-the-alliance
    when: Dec. 2–3
    date: '1966-12-02'
    thread: africa-rhodesia
    also: [europe-and-the-alliance]
    c: 'Wilson and Smith aboard HMS *Tiger* off Gibraltar: a working document on an independence constitution, a return to legality and an interim government.'
    n: 'FRUS 1964–68, XXIV, docs. [547](https://history.state.gov/historicaldocuments/frus1964-68v24/d547), [549](https://history.state.gov/historicaldocuments/frus1964-68v24/d549). To check: [[w.horne-from-the-barrel-of]]. See [[cal.1965-11-11.europe-and-the-alliance]]. See [[cal.1966-04-09.africa]]. Names: Wilson, Ian Smith.'
    tags: [name:wilson-harold, name:smith-ian-douglas]
  - id: cal.1966-12-02.vietnam-marigold
    when: Dec. 2
    date: '1966-12-02'
    thread: vietnam-marigold
    c: American aircraft strike the Văn Điển vehicle depot and the Yên Viên rail yards, five miles from Hanoi's center, targets authorized Nov. 10; again Dec. 4.
    n: '[FRUS 1964–68, IV, doc. 324](https://history.state.gov/historicaldocuments/frus1964-68v04/d324) (editorial note). [[w.frankum-like-rolling-thunder]], 53. See [[cal.1966-06-29.vietnam-2]].'
    tags: [place:van-dien, place:yen-vien]
  - id: cal.1966-12-03.vietnam-marigold
    when: Dec. 3
    date: '1966-12-03'
    thread: vietnam-marigold
    c: 'Lodge, on Johnson''s instructions: the embassy in Warsaw will see the North Vietnamese Dec. 6 and confirm that the ten points "broadly" reflect the American position, but "several specific points are subject to important differences of interpretation."'
    n: '[FRUS 1964–68, IV, doc. 325](https://history.state.gov/historicaldocuments/frus1964-68v04/d325) (the instructions, Dec. 2). See [[cal.1966-06-29.vietnam-2]]. Names: Lodge, Johnson.'
    tags: [name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-12-04.opinion
    when: Dec. 4
    date: '1966-12-04'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 10–15: Johnson''s handling of Vietnam: approve 43 percent, disapprove 40. The Johnson Administration''s program, the Great Society: favorable 32, unfavorable 44. South 20 and 54; Republicans 16 and 66; independents 27 and 50; Democrats 46 and 27.'
    n: '[[w.gallup-poll]], III, 2038–39. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-12-05.georgia
    when: Dec. 5
    date: '1966-12-05'
    thread: georgia-bond
    also: [students, court]
    c: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf): the House''s refusal to seat Bond for his statements on the war and the draft violated the First Amendment. Warren for a unanimous Court. Since January, Bond elected again in a special election, refused again when he would not recant, and elected a third time in the regular primary and general elections of 1966.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.neary-julian-bond]]; [[w.powe-warren-court-and-american]]. See [[cal.1966-01-06.students]]; [[cal.1966-01-10.georgia-bond]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-12-05.vietnam-marigold
    when: Dec. 5
    date: '1966-12-05'
    thread: vietnam-marigold
    c: 'Rapacki to Gronouski: the reservation puts the contact in doubt; and the bombing near Hanoi. The meeting of Dec. 6 not held.'
    n: '[FRUS 1964–68, IV, doc. 327](https://history.state.gov/historicaldocuments/frus1964-68v04/d327). See [[cal.1966-06-29.vietnam-2]]. Names: Rapacki, Gronouski.'
    tags: [name:rapacki-adam, name:gronouski-john-a]
  - id: cal.1966-12-05.africa-rhodesia
    when: Dec. 5
    date: '1966-12-05'
    thread: africa-rhodesia
    c: Smith's cabinet at Salisbury rejects the *Tiger* document (Check the date).
    n: 'Check: the record. See [[cal.1966-12-02.europe-and-the-alliance]]. Names: Ian Smith.'
    tags: [name:smith-ian-douglas]
  - id: cal.1966-12-06.defense
    when: Dec. 6
    date: '1966-12-06'
    thread: defense
    also: [soviet-union]
    c: 'Austin. Johnson with McNamara, Vance and the Joint Chiefs on the fiscal 1968 defense budget, five issues open between them. Wheeler for the Chiefs: deploy Nike-X, an area defense and a defense of 25 cities, $800 million in fiscal 1968, $10 billion in ten years; the Soviets deploying an ABM system around Moscow. McNamara and Vance against: the Soviets would answer with more offensive forces, each side spending $30–40 billion, neither better off. No decision; written views asked of State, the CIA and the science adviser, in by Dec. 10.'
    n: 'FRUS 1964–68, X, docs. [150](https://history.state.gov/historicaldocuments/frus1964-68v10/d150), [151](https://history.state.gov/historicaldocuments/frus1964-68v10/d151), [155](https://history.state.gov/historicaldocuments/frus1964-68v10/d155), [156](https://history.state.gov/historicaldocuments/frus1964-68v10/d156), [158](https://history.state.gov/historicaldocuments/frus1964-68v10/d158); XI, docs. [169](https://history.state.gov/historicaldocuments/frus1964-68v11/d169), [170](https://history.state.gov/historicaldocuments/frus1964-68v11/d170), [171](https://history.state.gov/historicaldocuments/frus1964-68v11/d171) (Dec. 10). The President''s News Conference at Austin, Texas, [1966 Pub. Papers 1432](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=806) (Dec. 6, 1966), with McNamara. [[w.drea-mcnamara-clifford-and-the-2011]], 168, 361–362 (the meeting at Austin, the five issues, no decision; the Chiefs for Nike-X and a defense of 25 cities, McNamara against; the replies of Dec. 10). Made public: the notes of the meeting, FRUS 1964–68, X (2001). To check: [[w.halperin-decision-to-deploy-the]]; [[w.shapley-promise-and-power]]. Names: McNamara, Vance, Wheeler, Johnson.'
    src:
      c: 8b2429e4
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v10/d150: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v11/d169: G'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=806: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 168: A-B, F'
