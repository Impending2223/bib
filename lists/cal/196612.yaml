        - 'via x.1966-12-06.new-york-lhm-dated-dec-6: all'
        - 'via x.1966-11-23.wiretap-transcript-of-telephone-conversation-between: all'
        - 'via x.1966-11-30.wiretap-transcript-of-telephone-conversation-between: all'
