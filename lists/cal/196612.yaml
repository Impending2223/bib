    date: '1966-12-26'
    thread: assassination
    c: 'Johnson to Moyers by telephone, 10:17 a.m., reading Manchester on the swearing-in: "He said, ''I hate to bother you at a time like this'' to Bobby. Now, I [never said] anything like this." Fearful the Communists were trying to take over.'
