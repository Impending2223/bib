  - id: cal.1966-12-05.georgia
    when: Dec. 5
    date: '1966-12-05'
    thread: georgia-bond
    also: [students, court]
    c: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf): the House''s refusal to seat Bond for his statements on the war and the draft violated the First Amendment. Warren for a unanimous Court. Since January, Bond elected again in a special election, refused again when he would not recant, and elected a third time in the regular primary and general elections of 1966.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.branch-at-canaans-edge]], 563 ("We are not persuaded by the state''s attempt to distinguish between an exclusion alleged to be on racial grounds and one alleged to violate the First Amendment"). To check: [[w.neary-julian-bond]]; [[w.powe-warren-court-and-american]]; Fred P. Graham, "Supreme Court Voids Refusal of Georgia House to Seat Bond," NYT, Dec. 6, 1966, p1 (cited by [[w.branch-at-canaans-edge]], 563); Bond v. Floyd (385 U.S. 116) (cited by [[w.branch-at-canaans-edge]], 563); Morgan, *One Man, One Voice* (1979), 160–61 (cited by [[w.branch-at-canaans-edge]], 563); "Supreme Court Upholds Bond," AC, Dec. 6, 1966, pale: (cited by [[w.branch-at-canaans-edge]], 563). See [[cal.1966-01-06.students]]; [[cal.1966-01-10.georgia-bond]]. Names: Bond.'
