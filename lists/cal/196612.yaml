    c: SNCC's staff meets at Peg Leg Bates's resort, Kerhonkson, N.Y. A vote to exclude whites from membership carried, 19–18, 24 abstaining (Check the count and the dates).
    n: '[[w.branch-at-canaans-edge]], 573–74 (three days on the Atlanta project''s motion against the last seven white staff members; Carmichael and Forman against it; nearly half the members gone before the vote). To check: [[w.carson-in-struggle]]; [[w.hogan-many-minds-one-heart]]; [[w.joseph-waiting-til-the-midnight]]; New York Times, April 5, 1967, pee conference in upstate New York: Forman, Making, pp. 475–79 (cited by [[w.branch-at-canaans-edge]], 573); Sellers, *The River of No Return* (1973), 178–82 (cited by [[w.branch-at-canaans-edge]], 573); Lyon, *Memories of the Southern Civil Rights Movement* (1992), 174–76 (cited by [[w.branch-at-canaans-edge]], 573); Fleming, *Soon We Will Not Cry* (n.d.), 178–81 (cited by [[w.branch-at-canaans-edge]], 573); Int. Dorothy Zellner, Dec. 12, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 573); Int. James Forman, Feb. 13, 2001 (Branch) (cited by [[w.branch-at-canaans-edge]], 573); Int. Jack Minnis, April 8, 2001 (Branch) (cited by [[w.branch-at-canaans-edge]], 573); Int. Ivanhoe Donaldson, June 30, 2000 (Branch) (cited by [[w.branch-at-canaans-edge]], 573); int. Jennifer Lawson, Noy. 13,2004 (cited by [[w.branch-at-canaans-edge]], 573); Int. Kwame Ture (Stokely Carmichael), Jan. 31, 1984 (Branch) (cited by [[w.branch-at-canaans-edge]], 573); [[w.carmichael-ready-for-revolution]], 566–71 (cited by [[w.branch-at-canaans-edge]], 573); Greenberg, *A Circle of Trust* (1998), 168–69 (cited by [[w.branch-at-canaans-edge]], 573); New York Times, Dec. 8, 1998, p. 28 (cited by [[w.branch-at-canaans-edge]], 574). See [[cal.1966-06-06.mississippi]].'
