  - id: cal.1966-12-01.vietnam
    when: Dec. 1
    date: '1966-12-01'
    thread: vietnam-marigold
    c: 'Marigold. Saigon, at the Italian ambassador D''Orlandi''s apartment: Lewandowski, the Polish member of the ICC, back from Hanoi, reads Lodge the ten points he gave Hanoi as the American position; the Poles will support a contact of the American and North Vietnamese ambassadors in Warsaw.'
    n: '[FRUS 1964–68, IV, doc. 322](https://history.state.gov/historicaldocuments/frus1964-68v04/d322). See [[cal.1966-06-29.vietnam-2]]. Names: Lewandowski, D''Orlandi, Lodge.'
    tags: [name:lewandowski-janusz, name:lodge-henry-cabot, name:dorlandi-giovanni, place:saigon]
    short: the ten points read to Lodge
  - id: cal.1966-12-01.europe-and-the-alliance
    when: Dec. 1
    date: '1966-12-01'
    thread: europe-and-the-alliance
    c: 'Bonn. Kiesinger, Minister-President of Baden-Württemberg, elected Chancellor by the Bundestag: a grand coalition of the CDU/CSU and the Social Democrats, Brandt Foreign Minister and Vice Chancellor. The Free Democrats had left Erhard''s cabinet Oct. 27; Kiesinger the CDU/CSU''s candidate Nov. 10; the coalition agreed Nov. 27; Erhard resigned Nov. 30.'
    n: 'FRUS 1964–68, XV, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v15/d184), [188](https://history.state.gov/historicaldocuments/frus1964-68v15/d188). [[w.schwartz-lyndon-johnson-and-europe]], 147, 149 (the Grand Coalition). Schwartz, 132, has the Free Democrats leave and Erhard resign "at the end of October"; FRUS''s editors, the entry''s dates (doc. 184 n. 2). [[w.gavin-gold-dollars-and-power]], 157. To check: [[w.zimmermann-money-and-security]]. See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Brandt, Kiesinger, Erhard.'
    src:
      c: e2b4adb7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v15/d184: all'
        - 'w.schwartz-lyndon-johnson-and-europe 147: B'
        - 'w.schwartz-lyndon-johnson-and-europe 149: B'
        - 'w.gavin-gold-dollars-and-power 157: B-C'
    tags: [name:kiesinger-kurt-georg, name:brandt-willy, name:erhard-ludwig]
    short: Kiesinger Chancellor
  - id: cal.1966-12-01.vietnam-2
    when: Dec. 1
    date: '1966-12-01'
    thread: vietnam
    also: [transition-and-staff]
    c: 'Komer to Johnson, on a successor to Lodge: "a top manager who can run a $20–25 billion show, make the military perform, and quietly lead [Saigon] by the nose"; "your choice for Vietnam might well be the single most important appointment you make in 1967–68." McGeorge Bundy first on his list.'
    n: '[[w.preston-war-council]], 235. To check: Komer to Johnson, Dec. 1, 1966, FRUS 1964–68, IV, 883 (cited by [[w.preston-war-council]], 235 n.67). Names: Komer, Johnson, Lodge, Bundy.'
    src:
      c: eb921b8e
      rows:
        - 'w.preston-war-council 235: all'
        - 'via w.preston-war-council 235 n.67: all'
    tags: [name:komer-robert-w, name:johnson-lyndon-b, name:lodge-henry-cabot, name:bundy-mcgeorge]
  - id: cal.1966-12-01.king
    when: Dec. 1
    date: '1966-12-01'
    thread: king
    also: [middle-east-samu]
    c: 'Andrew Young, back Nov. 30 from twelve days in Jordan and Israel, reports by telephone to Levison, the FBI''s wiretap: both governments want King''s pilgrimage, with a sermon to five thousand from a boat on the Sea of Galilee, but are "scared to death" of hostilities after Samu. King may cancel his visit in 1967.'
    n: '[[w.branch-at-canaans-edge]], 556–57; [[w.young-easy-burden]], 416–18 (Young and his wife to Tel Aviv and Jordan; the Mandelbaum Gate; an amphitheater on the Sea of Galilee, King to preach from the water; not the call). To check: Jet, Dec. 15, 1966, p. 5 (cited by [[w.branch-at-canaans-edge]], 556); Wiretap transcript of telephone conversation among Stanley Levison, Andrew Young, and Dora McDonald, 12:11 p.m., Dec. 1, 1966, FLNY-9-1140a (cited by [[w.branch-at-canaans-edge]], 557); New York LHM dated Dec. 6, 1966, FSC-1694 (cited by [[w.branch-at-canaans-edge]], 557); [[w.oren-six-days-of-war]], 33–35 (cited by [[w.branch-at-canaans-edge]], 557); Wiretap transcript of telephone conversation between Stanley Levison and Rev. Moore, 9:18 p.m., Nov. 23, 1966, FLNY-9-1132a (cited by [[w.branch-at-canaans-edge]], 557); wiretap transcript of telephone conversation between Stanley Levison and MLK, 7:48 p.m., Novy. 30, 1966, FLNY-9-1139a (cited by [[w.branch-at-canaans-edge]], 557). See [[cal.1966-11-13.middle-east]]. Names: Andrew Young, Levison, King.'
    src:
      c: 9ec889e3
      rows:
