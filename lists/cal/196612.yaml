        - 'w.drea-mcnamara-clifford-and-the-2011 362: G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 168 n.117a: A-B, F'
        - 'via w.drea-mcnamara-clifford-and-the-2011 361 n.55a: C-E'
        - 'via w.drea-mcnamara-clifford-and-the-2011 362 n.58b: G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 362 n.58c: G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 362 n.58d: G'
        - 'via w.drea-mcnamara-clifford-and-the-2011 362 n.59a: G'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:vance-cyrus, name:wheeler-earle]
  - id: cal.1966-12-07.opinion
    when: Dec. 7
    date: '1966-12-07'
    thread: opinion
    also: [economy]
    c: 'Gallup, Nov. 10–15, women: a basket of food costing $10 today to cost $12 in a year, $15 in five (medians). More to blame for higher prices: higher wages 42 percent, higher profits 44.'
    n: '[[w.gallup-poll]], III, 2039.'
  - id: cal.1966-12-08.space
    when: Dec. 8
    date: '1966-12-08'
    thread: space
    also: [soviet-union]
    c: 'Austin. Christian reads Johnson''s statement, on Goldberg''s report: agreement in the UN''s Outer Space Committee on a treaty for outer space, the moon and other celestial bodies; the "no bombs in orbit" resolution put in treaty form; access to all installations on celestial bodies. Johnson had asked for it May 7. "The most important arms control development since the Limited Test Ban Treaty of 1963." The General Assembly commends it Dec. 19 (Check).'
    n: 'Statement by the President Announcing the Reaching of an Agreement on an Outer Space Treaty, [1966 Pub. Papers 1441](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=815) (Dec. 8, 1966). To check: [[w.mcdougall-heavens-and-the-earth]]. See [[cal.1966-11-11.space]]. Names: Christian, Goldberg, Johnson.'
    tags: [name:johnson-lyndon-b, name:christian-george, name:goldberg-arthur-j]
  - id: cal.1966-12-08.africa-rhodesia
    when: Dec. 8
    date: '1966-12-08'
    thread: africa-rhodesia
    c: Britain asks the Security Council for selective mandatory sanctions on Rhodesia.
    n: 'Check: the Council''s record. See [[cal.1966-12-02.europe-and-the-alliance]].'
  - id: cal.1966-12-09.poverty-nyc
    when: Dec. 9
    date: '1966-12-09'
    thread: poverty
    also: [robert-kennedy]
    c: 'Brooklyn, P.S. 305. Robert Kennedy, with Lindsay and Javits, announces a program for Bedford-Stuyvesant: community corporations joined with private business. "The best of community action with the best of the private enterprise system."'
    n: '[Wikipedia, "Bedford Stuyvesant Restoration Corporation"](https://en.wikipedia.org/wiki/Bedford_Stuyvesant_Restoration_Corporation). [[w.schlesinger-robert-kennedy-and-his]], 786–88. Check: Schlesinger gives Dec. 10. To check: [[w.thomas-robert-kennedy]]. Names: Robert Kennedy, Lindsay, Javits.'
    tags: [state:ny, city:nyc, name:kennedy-robert-f, name:lindsay-john-v, name:javits-jacob-k]
  - id: cal.1966-12-09.elections-1968-us
    when: Dec. 9–10
    date: '1966-12-09'
    thread: elections-1968
    also: [elections-1966, states-and-cities]
    c: Republican governors and governors-elect at the Broadmoor, Colorado Springs. Love chairman of their association, Chafee vice chairman, to succeed him in Dec. 1967; Reagan and Kirk to its executive committee. Bliss's "unity," and a resolution of support for him; Reagan, asked by Love, recites the "Eleventh Commandment." Romney keeps the meeting off 1968. Check the days.
    n: '*Ripon Forum*, [Jan. 1967, 3–6](https://riponsociety.org/wp-content/uploads/2023/12/1967-01_Vol-III_No-1.pdf) (Check against the press). To check: [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-12-04.elections-1964-us]]; [[cal.1966-11-08.elections-1966]]. Names: Chafee, Reagan, Kirk, Romney, Love, Bliss.'
    tags: [name:love-john-a, name:chafee-john-h, name:reagan-ronald, name:kirk-claude-r-jr, name:bliss-ray-c, name:romney-george-w]
  - id: cal.1966-12-10.vietnam
    when: Dec. 10
    date: '1966-12-10'
    thread: vietnam
    c: 'Komer''s "Strategic Guidelines for 1967 in Vietnam," endorsed by Rostow, as a draft NSAM: a satisfactory outcome by December 1967, or at least "making it patently clear to all that the war is demonstrably being won"; nine programs, pacification first. Johnson: "I agree. It''s good." Sent to Rusk and McNamara Dec. 12; State, Defense, the Joint Chiefs, CINCPAC and MACV object, and it is never issued.'
    n: 'FRUS 1964–68, IV, doc. [336](https://history.state.gov/historicaldocuments/frus1964-68v04/d336). [[w.gibbons-u-s-government-and]], IV, 487–94. Made public: [[w.pentagon-papers]], IV, 390–400 (1971). Names: Komer, Rostow, Johnson, Rusk, McNamara.'
    tags: [name:komer-robert-w, name:rostow-walt-w, name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1966-12-11.opinion
    when: Dec. 11
    date: '1966-12-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 10–15, a plan: the United States to train the 1 to 1½ million South Vietnamese in the army or of draft age, and withdraw 100,000 of its troops as each 100,000 are trained, most if not all within a year; supplies and economic aid to go on, the fighting left to the South Vietnamese. Approve 58 percent, disapprove 24.'
    n: '[[w.gallup-poll]], III, 2039–40.'
  - id: cal.1966-12-12.georgia
    when: Dec. 12
    date: '1966-12-12'
    thread: georgia
    also: [court, elections-1966, legislatures, governors]
    c: '*Fortson v. Morris*, [385 U.S. 231](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385231/usrep385231.pdf), argued Dec. 5: reversed; the General Assembly may choose the governor. Black for the Court, 5–4: no provision of the federal Constitution prescribes how a State chooses its governor; the Assembly, though malapportioned, may act until May 1, 1968, under *Toombs v. Fortson*; the Democratic members'' oath to support their party''s nominees ended with the election. Douglas, with Warren, Brennan and Fortas, dissenting; Fortas, with Warren and Douglas.'
    n: Opinion (Opp. II.H.1). See [[cal.1966-11-17.georgia]].
    tags: [state:ga]
  - id: cal.1966-12-12.crime-and-hijacking
    when: Dec. 12
    date: '1966-12-12'
    thread: crime-and-hijacking
    also: [court]
    c: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf): the jury-tampering convictions of Chattanooga, 1964, affirmed. Stewart for the Court: Partin, the government''s paid informer in Hoffa''s company at the Nashville trial, violated none of his rights; Hoffa spoke to him of his own will. Warren dissenting; Clark, with Douglas, would dismiss the writs; White and Fortas took no part.'
    n: 'See [[cal.1964-03-04.crime-and-hijacking]]. Names: Hoffa, Partin.'
    tags: [name:hoffa-james-r, name:partin-edward-grady]
  - id: cal.1966-12-12.africa-rhodesia
    when: Dec. 12
    date: '1966-12-12'
    thread: africa-rhodesia
    c: Goldberg to the Security Council, for the sanctions on Rhodesia.
    n: '[FRUS 1964–68, XXIV, doc. 552](https://history.state.gov/historicaldocuments/frus1964-68v24/d552). See [[cal.1966-12-02.europe-and-the-alliance]]. Names: Goldberg.'
    tags: [name:goldberg-arthur-j]
  - id: cal.1966-12-13.vietnam
    when: Dec. 13–14
    date: '1966-12-13'
    thread: vietnam-marigold
    c: 'Dec. 9, Johnson with McNamara, Katzenbach, Vance, Humphrey and Wheeler: no new targets in the North for now; State to Gronouski, Dec. 10: the pattern unchanged. Dec. 13 and 14, the Văn Điển depot and the Yên Viên yards struck again. Hanoi, Dec. 14: the embassy quarter and suburbs hit, over 100 killed or wounded. Dec. 14, Rapacki to Gronouski: Hanoi asks that the conversations begun in Saigon end; "the whole responsibility for losing this chance of a peaceful solution" is the United States''.'
    n: 'FRUS 1964–68, IV, docs. [324](https://history.state.gov/historicaldocuments/frus1964-68v04/d324), [334](https://history.state.gov/historicaldocuments/frus1964-68v04/d334), [342](https://history.state.gov/historicaldocuments/frus1964-68v04/d342). See [[cal.1966-12-01.vietnam]]. Names: McNamara, Vance, Wheeler, Katzenbach, Humphrey, Johnson, Gronouski, Rapacki.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:katzenbach-nicholas, name:vance-cyrus, name:humphrey-hubert-h, name:wheeler-earle, name:gronouski-john-a, name:rapacki-adam, place:van-dien, place:yen-vien, place:hanoi]
  - id: cal.1966-12-13.vietnam-congress
    when: Dec. 13
    date: '1966-12-13'
    thread: vietnam-congress
    c: After the White House announces a 48-hour truce at Christmas, and perhaps others at New Year's and Tết, Mansfield proposes a cease-fire and a freeze on reinforcements from Christmas to Tết, to test Hanoi's interest in talks. Fulbright agrees.
    n: '[[w.gibbons-u-s-government-and]], IV, 497. To check: *New York Times*, Dec. 14, 1966. See [[cal.1966-12-24.vietnam]]. Names: Mansfield, Fulbright.'
    tags: [name:mansfield-mike, name:fulbright-j-william]
  - id: cal.1966-12-14.europe-and-the-alliance
    when: Dec. 14–16
    date: '1966-12-14'
    thread: europe-and-the-alliance
    c: Paris, the NATO ministers. The Fourteen, as the Defense Planning Committee, set up the Nuclear Defense Affairs Committee and its seven-member Nuclear Planning Group. The Council takes up Harmel's proposal, Belgium's, to study the alliance's future tasks; Couve de Murville does not object.
    n: 'FRUS 1964–68, XIII, docs. [225](https://history.state.gov/historicaldocuments/frus1964-68v13/d225), [229](https://history.state.gov/historicaldocuments/frus1964-68v13/d229) (Rusk to Johnson, Dec. 16), [232](https://history.state.gov/historicaldocuments/frus1964-68v13/d232). [[w.drea-mcnamara-clifford-and-the-2011]], 384 (the ministers at Paris; the Nuclear Defense Affairs Committee and the seven-member Nuclear Planning Group). To check: [[w.haftendorn-nato-and-the-nuclear]]; [[w.wenger-crisis-and-opportunity]]; [[w.priest-kennedy-johnson-and-nato]]; Paris to State, msg 9132, Dec. 15, 1966, SecDef Subject Decimal files, Acc 73-A-1304; the communiqué, [[w.current-documents-1966]], 376–77 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 384 n.30). See [[cal.1965-11-27.europe-and-the-alliance]]. Names: Harmel, Couve de Murville.'
    src:
      c: 4671da80
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d225: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 384: A-B'
        - 'via w.drea-mcnamara-clifford-and-the-2011 384 n.30d: B'
        - 'via w.drea-mcnamara-clifford-and-the-2011 384 n.30e: B'
    tags: [name:harmel-pierre-c-j-m, name:couve-de-murville-maurice]
  - id: cal.1966-12-15.king
    when: Dec. 15
    date: '1966-12-15'
    thread: king
    also: [cities-and-housing]
    c: 'King before Senators Ribicoff and Robert Kennedy, at Ribicoff''s hearings on the cities: forty-four pages, drafted with Levison. The war the main obstacle to the programs the cities need; open housing in Chicago not a reality "in the next year or two."'
    n: '[[w.garrow-bearing-the-cross]], 538–40. Check: the hearing''s record. Names: King, Ribicoff, Robert F. Kennedy, Levison.'
    tags: [name:king-martin-luther-jr, name:ribicoff-abraham, name:kennedy-robert-f, name:levison-stanley-d]
  - id: cal.1966-12-16.assassination
    when: Dec. 16
    date: '1966-12-16'
    thread: assassination
    also: [robert-kennedy]
    c: Jacqueline Kennedy sues William Manchester, Harper & Row and *Look* in the New York courts to stop publication of *The Death of a President*, the account the family had authorized, as written (Check the date).
    n: 'To check: [[w.corry-manchester-affair]]; [[w.manchester-death-of-a-president]]; [[w.shesol-mutual-contempt]]. See [[cal.1964-11-23.assassination]]. Names: Jacqueline Kennedy, Manchester.'
    tags: [name:kennedy-jacqueline, name:manchester-william]
  - id: cal.1966-12-16.elections-1966
    when: Dec. 16–17
    date: '1966-12-16'
    thread: elections-1966
    c: Eighteen of the twenty-four Democratic governors at White Sulphur Springs, W. Va., after the midterms.
    n: 'Check: a record. To check: [[w.savage-jfk-lbj-and-the]]. See [[cal.1966-11-08.elections-1966]].'
  - id: cal.1966-12-16.state-and-city-finance-us
    when: Dec. 16–17
    date: '1966-12-16'
    thread: state-and-city-finance
    also: [states-and-cities]
    c: National Governors' Conference, special interim meeting at White Sulphur Springs, W. Va., the first between annual meetings. It "specifically endorses the principle of tax sharing and the principle of block grants," consolidating the categorical grants; its committee on State and local revenue to draft a federal tax-sharing plan on the individual income tax.
    n: '[*Official Papers, Special Interim Meeting, National Governors'' Conference* (1966), 20–21](https://www.nga.org/wp-content/uploads/2021/03/1966NGAWinterMeeting.pdf#page=24). To check: [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1965-07-27.state-and-city-finance-us]]; [[cal.1966-12-16.elections-1966]].'
  - id: cal.1966-12-16.africa-rhodesia
    when: Dec. 16
    date: '1966-12-16'
    thread: africa-rhodesia
    also: [europe-and-the-alliance]
    c: 'Security Council, Resolution 232, 11–0, Bulgaria, France, Mali and the Soviet Union abstaining: members to stop imports of Rhodesia''s asbestos, iron ore, chrome, pig iron, sugar, tobacco, copper and animal products, and the sale to it of arms, aircraft and motor vehicles (Check the list).'
    n: Security Council Resolution [232 (1966)](https://undocs.org/S/RES/232(1966)). See [[cal.1966-12-02.europe-and-the-alliance]].
  - id: cal.1966-12-18.opinion
    when: Dec. 18
    date: '1966-12-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 21–26: after a peace and the withdrawal of American troops, a South Vietnamese government strong enough to withstand Communist pressure: yes 32 percent, no 44.'
    n: '[[w.gallup-poll]], III, 2040.'
  - id: cal.1966-12-20.india-and-china-food
    when: Dec. 20
    date: '1966-12-20'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: Poage, Dole and Jack Miller, sent to India, recommend 1.8 million tons of grain.
    n: '[FRUS 1964–68, XXV, doc. 404](https://history.state.gov/historicaldocuments/frus1964-68v25/d404). See [[cal.1966-11-10.india-and-china]]. Names: Poage, Dole, Miller.'
    tags: [name:poage-william-r, name:dole-bob, name:miller-jack-r]
  - id: cal.1966-12-21.opinion
    when: Dec. 21
    date: '1966-12-21'
    thread: opinion
    c: 'Gallup, Dec. 8–13: in politics, Republican 29 percent, Democrat 44, independent 27.'
    n: '[[w.gallup-poll]], III, 2040.'
  - id: cal.1966-12-21.elections-1966
    when: Dec. 21
    date: '1966-12-21'
    thread: elections-1966
    c: 'Nine Democratic governors at the ranch, Hughes of Iowa their chairman: the President''s policies "never in question"; problems with federal programs in their States, and with the national committee.'
    n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1447](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=821) (Dec. 21, 1966). See [[cal.1966-12-16.elections-1966]]. Names: Hughes.'
    tags: [name:hughes-harold-e, name:johnson-lyndon-b]
  - id: cal.1966-12-22.india-and-china-food
    when: Dec. 22
    date: '1966-12-22'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: Freeman announces 900,000 tons for India, half wheat, half sorghum, "on a low key basis."
    n: '[FRUS 1964–68, XXV, doc. 407](https://history.state.gov/historicaldocuments/frus1964-68v25/d407). See [[cal.1966-11-10.india-and-china]]. Names: Freeman.'
    tags: [name:freeman-orville-l, name:johnson-lyndon-b]
  - id: cal.1966-12-23.vietnam
    when: Dec. 23
    date: '1966-12-23'
    thread: vietnam-marigold
    c: 'With Johnson''s assent, the Joint Chiefs to CINCPAC: no attacks within ten nautical miles of Hanoi''s center until further notice.'
    n: '[FRUS 1964–68, IV, doc. 349](https://history.state.gov/historicaldocuments/frus1964-68v04/d349). See [[cal.1966-12-01.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-12-24.vietnam
    when: Dec. 24–26
    date: '1966-12-24'
    thread: vietnam
    c: 'Christmas truce, 48 hours, 0700 Dec. 24 to 0700 Dec. 26; no bombing of the North. Johnson to Paul VI, Nov. 30: Hanoi''s public offer of a truce had to be accepted "as soon as possible," because of "the propaganda implications," not at the time the Pope had discussed with Rowe.'
    n: 'FRUS 1964–68, XII, doc. [307](https://history.state.gov/historicaldocuments/frus1964-68v12/d307). [[w.gibbons-u-s-government-and]], IV, 497; [[w.cosmas-joint-chiefs-of-staff-2012]], 535–537. To check: [[w.herring-lbj-and-vietnam]]. Names: Rowe, Paul VI, Johnson.'
    tags: [name:johnson-lyndon-b, name:paul-vi, name:rowe-james-h-jr]
  - id: cal.1966-12-24.vietnam-marigold
    when: Dec. 24
    date: '1966-12-24'
    thread: vietnam-marigold
    c: 'Gronouski, back from Washington, to Rapacki: talks in Warsaw, or another third country, still wanted.'
    n: '[FRUS 1964–68, IV, doc. 351](https://history.state.gov/historicaldocuments/frus1964-68v04/d351). See [[cal.1966-12-01.vietnam]]. Names: Gronouski, Rapacki.'
    tags: [name:gronouski-john-a, name:rapacki-adam]
  - id: cal.1966-12-25.vietnam
    when: Dec. 25
    date: '1966-12-25'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'The *Times* prints the first of Salisbury''s dispatches from Hanoi, where he arrived Dec. 23: homes in Hanoi damaged by American bombs, civilians killed (Check). Fifteen from North Vietnam, to Jan. 9. Dec. 31, State to all posts: based largely on North Vietnam''s official information, with errors, but not to be "dismissed out of hand."'
    n: 'FRUS 1964–68, IV, doc. [352](https://history.state.gov/historicaldocuments/frus1964-68v04/d352). [[w.hammond-public-affairs]], 274–79; [[w.drea-mcnamara-clifford-and-the-2011]], 81 (the first of fifteen dispatches, Dec. 25). Gibbons has the series begin Dec. 26 (IV, 499); FRUS''s editors, Dec. 25, the first of fifteen (doc. 352). To check: [[w.salisbury-behind-the-lines-hanoi]]; [[w.salisbury-time-of-change]]. See [[cal.1966-12-13.vietnam]]. Names: Salisbury.'
    src:
      c: e4a841d5
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d352: all'
        - 'w.hammond-public-affairs 274–79: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 81: A-B'
        - 'via w.drea-mcnamara-clifford-and-the-2011 81 n.111a: A-B'
    tags: [name:salisbury-harrison-e, place:hanoi]
  - id: cal.1966-12-30.trade
    when: Dec. 30
    date: '1966-12-30'
    thread: trade
    c: 'Herter dies in Washington, 71: Special Representative for Trade Negotiations since 1962, leading the Kennedy Round at Geneva. The Trade Expansion Act''s authority to cut tariffs ends June 30, 1967.'
    n: 'Statement by the President on the Death of Christian A. Herter, [1966 Pub. Papers 1465](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=839) (Dec. 31, 1966). To check: [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1964-05-04.trade]]. Names: Herter.'
    tags: [name:herter-christian-a]
  - id: cal.1966-12-30.vietnam-marigold
    when: Dec. 30
    date: '1966-12-30'
    thread: vietnam-marigold
    c: 'Rapacki: the damage done in early December cannot be made up; "we have to consider our role at this stage as terminated."'
    n: '[FRUS 1964–68, IV, doc. 355](https://history.state.gov/historicaldocuments/frus1964-68v04/d355). See [[cal.1966-12-01.vietnam]]. Names: Rapacki.'
    tags: [name:rapacki-adam]
  - id: cal.1966-12-31.vietnam
    when: Dec. 31
    date: '1966-12-31'
    thread: vietnam
    also: [economy]
    c: 'New Year truce, 48 hours (Check the hours). News conference at the ranch: a representative ready to be named today, if Hanoi will name one; the British proposal of talks welcome; U Thant urged to take the lead. On Salisbury''s reports: "only military targets have been authorized." A tax increase for 1967: no decision. Not a mistake to have asked none in 1966: the act of Mar. 15 and the investment credit''s suspension took "several billions." The year''s deficit $2.3 billion, against $6.4 billion estimated, by his figures; the next not as low.'
    n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1458](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=832) (Dec. 31, 1966). [[w.zelizer-taxing-america]], 257 (no general increase asked in 1966). To check: [[w.bernstein-guns-or-butter]]. See [[cal.1966-12-24.vietnam]]; [[cal.1966-12-25.vietnam]]; [[cal.1966-11-29.economy]]. Names: U Thant, Salisbury.'
    tags: [name:johnson-lyndon-b, name:u-thant, name:salisbury-harrison-e]
    aliases: [cal.1966-12-31.economy]
  - id: cal.1966-12.court-us
    when: Dec.
    date: 1966-12
    thread: court
    also: [states-and-cities, legislatures, amendments]
    c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: applications from 28 legislatures since 1963, by the Article V Library''s count; 34 needed. New in 1965: Alabama, Arizona, Florida, Georgia, Kentucky, Louisiana, Maryland, Minnesota, Mississippi, Nebraska, New Hampshire, North Carolina, Tennessee and Utah; Virginia in 1964, New Mexico in 1966. Nine States of 1963 apply again in 1965.'
    n: 'The applications in 110–112 Cong. Rec. (1964–66), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them (Check each against the Record). To check: [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]; [[w.dixon-democratic-representation]]. See [[cal.1966-04-20.court]]; [[cal.1963-12.states-and-cities-us]]. Names: Dirksen.'
    tags: [name:dirksen-everett, state:nc, state:nh, state:ms, state:nm, state:la, state:mn, state:tn, state:ky, state:md, state:ne, state:va, state:al, state:az, state:fl, state:ga, state:ut]
  - id: cal.1966-12.health-us
    when: Dec.
    date: 1966-12
    thread: health
    also: [welfare]
    c: 'Medicaid at the year''s end: 29 States have begun programs. A State without one by 1970 to lose federal matching for medical payments under the old public assistance and Kerr–Mills programs.'
    n: '[[w.weikel-decade-of-medicaid]], 305. To check: [[w.stevens-welfare-medicine-in-america]]. See [[cal.1966-03-31.health-us]].'
  - id: cal.1966-12.vietnam
    when: Dec.
    date: 1966-12
    thread: vietnam
    c: 'The year''s American dead in Southeast Asia, by the Defense Department''s file: 6,350, 5,240 of hostile causes; 8,685 since 1961. As printed in 1967: 5,008 battle deaths. Forces in South Vietnam, Dec. 31: 385,300 (384,400 as printed in 1967).'
    n: '[NARA, Defense Casualty Analysis System, Vietnam Conflict Extract Data File, as of Apr. 29, 2008](https://catalog.archives.gov/id/2240992); [*Statistical Abstract of the United States, 1967*](https://www.census.gov/library/publications/1967/compendia/statab/88ed.html), table 372, p. 264; [*Selected Manpower Statistics*, FY-74](https://archive.org/details/DTIC_ADA043053), p. 63. See [[cal.1964-12.vietnam]].'
    tags: [wardead:1966]
  - id: cal.1966-12.oil
    when: Dec.
    date: 1966-12
    thread: oil
    c: 'The world''s crude oil output in 1966, as the Bureau of Mines first counted it: 32.9 million barrels a day. The United States 8.30, the Soviet Union 5.34, Venezuela 3.37, Saudi Arabia 2.39, Kuwait 2.28. Libya 1.51.'
    n: Bureau of Mines, [*Minerals Yearbook 1966*, I–II, Table 68, p. 911](https://archive.org/details/pub_usgov-minerals-yearbook_1966_12/page/n928) (1967). See [[cal.1960-12.oil]].
    tags: [oilworld:1966]
