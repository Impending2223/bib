  - id: cal.1966-12-02.vietnam-marigold
    when: Dec. 2
    date: '1966-12-02'
    thread: vietnam-marigold
    c: American aircraft strike the Văn Điển vehicle depot and the Yên Viên rail yards, five miles from Hanoi's center, targets authorized Nov. 10; again Dec. 4.
    n: '[FRUS 1964–68, IV, doc. 324](https://history.state.gov/historicaldocuments/frus1964-68v04/d324) (editorial note). [[w.frankum-like-rolling-thunder]], 53 (the two targets, inside the Hanoi circle; the Air Force on Văn Điển Dec. 4); [[w.mcnamara-in-retrospect]], ch. 9 at n.13 (raids around Hanoi Dec. 2 and 4, planned for Nov. 10 and put off for weather; the meeting at Warsaw set for Dec. 5). [[w.cosmas-joint-chiefs-of-staff]], 9 (Rolling Thunder 52, approved Nov. 11, twelve targets within ten miles of Hanoi and Haiphong, held back by the weather; strikes within five miles of the center Dec. 2 and 4; Rapacki''s complaint to Gronouski Dec. 5); [[w.drea-mcnamara-clifford-and-the-2011]], 80 (the strikes of Dec. 1–2, eight planes lost to SAMs and antiaircraft fire; Haiphong''s oil struck through Dec. 5). See [[cal.1966-06-29.vietnam-2]].'
