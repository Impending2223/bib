section: LXXV
entries:
  - id: cal.1966-01-10.india-and-china
    when: Jan. 10
    date: '1966-01-10'
    thread: south-asia
    c: 'Tashkent. Shastri and Ayub Khan, Kosygin their host since Jan. 4, sign a declaration: forces back to the positions held before Aug. 5, 1965, by Feb. 25; relations restored. Shastri dies at Tashkent within hours. Johnson: "a grievous blow to the hopes of mankind for peace and progress."'
    n: 'Statement by the President on the Death of Prime Minister Shastri of India, [1966 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=78) (Jan. 10, 1966). FRUS 1964–68, XXV, docs. [275](https://history.state.gov/historicaldocuments/frus1964-68v25/d275), [279](https://history.state.gov/historicaldocuments/frus1964-68v25/d279). Check the declaration''s terms against its text. See [[cal.1965-12-14.india-and-china]]. Names: Kosygin, Shastri, Ayub Khan, Johnson.'
    tags: [name:shastri-lal-bahadur, name:ayub-khan-mohammad, name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1966-01-10.congress
    when: Jan. 10
    date: '1966-01-10'
    thread: congress
    c: '89th Congress, second session, meets. House: 385 answer the call; Clarence J. Brown Jr. and Rees sworn; Lindsay''s resignation, from Dec. 30, laid before it. Senate: Harry F. Byrd Jr. sworn in his father''s seat. A joint session set for Jan. 12, 9 p.m., for the State of the Union.'
    n: '[112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf); [112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf). See [[cal.1965-01-04.congress]]; [[cal.1965-11-02.specials]]; [[cal.1965-11-10.congress]]; [[cal.1965-12-15.specials]]. Names: Lindsay, Brown, Rees, Byrd.'
    tags: [name:brown-clarence-j-jr, name:rees-thomas-m, name:lindsay-john-v, name:byrd-harry-f-jr]
  - id: cal.1966-01-10.mississippi
    when: Jan. 10
    date: '1966-01-10'
    thread: mississippi
    also: [civil-rights-organizations]
    c: Hattiesburg. Before dawn, Klansmen fire on and firebomb the house and store of Vernon Dahmer, president of the Forrest County NAACP, in the Kelly Settlement. He fires back while his wife and children escape; dies of his burns that day. He had kept a voter registration book at his store and offered on the radio to help pay the poll tax of those who could not.
    n: '[[w.dittmer-local-people]], 391 (the attack; his death). See [[cal.1964-12-04.mississippi]]. Names: Dahmer. Check: the day; the Kelly Settlement; his NAACP office; the registration book and the offer on the poll tax.'
    tags: [name:dahmer-vernon]
  - id: cal.1966-01-10.georgia-bond
    when: Jan. 10
    date: '1966-01-10'
    thread: georgia-bond
    also: [students]
    c: The House refuses Bond his seat, 184–12, for his endorsement of SNCC's statement.
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966), which gives the vote (K–J Cong. II.J.1). See [[cal.1966-01-06.students]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-01-10.vietnam-pause
    when: Jan. 10
    date: '1966-01-10'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor and Helms, 1:10 to 2:10 p.m.: resuming the bombing in a few days, or after Tet; Wheeler, "Every day makes a difference." Briefing Congress: Johnson would rather Rusk and McNamara appear "at as many hearings as possible"; Rusk proposes a luncheon for the leaders and the senior committee members, and Johnson agrees.'
    n: '[FRUS 1964–68, IV, doc. 14](https://history.state.gov/historicaldocuments/frus1964-68v04/d14) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-03.vietnam-pause]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor, Helms.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:wheeler-earle, name:taylor-maxwell, name:helms-richard]
  - id: cal.1966-01-11.legislatures-ca
    when: Jan. 11
    date: '1966-01-11'
    thread: legislatures
    c: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf): the California Supreme Court upholds the Legislature''s reapportionment, its drafting errors construed away; San Francisco''s and Alameda County''s senators at large no denial of equal protection.'
    n: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf) (1966). See [[cal.1965-10-21.legislatures-ca]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1966-01-11.vietnam-congress
    when: Jan. 11
    date: '1966-01-11'
    thread: vietnam-congress
    c: 'Foreign Relations, executive session: Mansfield and Aiken report on their trip to Asia with Muskie, Inouye and J. Caleb Boggs. Mansfield: the collapse prevented, the situation not reversed; "an open-end requirement of unpredictable dimensions," perhaps 700,000 men; "all the choices open to us are bad choices." Fulbright, by prearrangement with Hickenlooper, asks Mansfield to ask Johnson to meet the committee; Mansfield will think about it, and prefers closed hearings to open.'
    n: 'Daily Digest, [112 Cong. Rec. D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=2) (Jan. 12, 1966) (the session and the report). Ball to Johnson by telephone, Jan. 12: [FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the committee''s wish, put to Mansfield, to talk privately with the President; Mansfield had not promised it). The report: Mansfield, Muskie, Inouye, Aiken and Boggs, *The Vietnam Conflict: The Substance and the Shadow*, Comm. Print (Jan. 1966); Mansfield''s private report to Johnson, "Vietnam: The Situation and Outlook," printed in S. Doc. No. 93-11 (1973) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 136–37. Made public: the executive session, the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XVIII: 1966, 36 (1993). Names: Mansfield, Aiken, Muskie, Inouye, Fulbright, Hickenlooper, Johnson.'
    src:
      c: 0123efa3
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=2: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d19: E-F'
        - 'w.gibbons-u-s-government-and IV, 136–37: all'
    tags: [name:mansfield-mike, name:aiken-george-d, name:muskie-edmund-s, name:inouye-daniel-k, name:boggs-james-c, name:fulbright-j-william, name:hickenlooper-bourke-b, name:johnson-lyndon-b]
  - id: cal.1966-01-11.vietnam
    when: Jan. 11
    date: '1966-01-11'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Ball before House Foreign Affairs in the morning. At the White House, 1:05 to 2:05 p.m., Bell back from Vietnam: pacification the first problem; McNamara: "Don''t think there''s a single area pacified." Ball on the House committee: once "Gung Ho," now "looking for a way out." Johnson: "Senate will be worse than House."'
    n: '[FRUS 1964–68, IV, doc. 15](https://history.state.gov/historicaldocuments/frus1964-68v04/d15) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135–36. Made public: FRUS 1964–68, IV (1998). Names: Ball, Bell, McNamara, Johnson.'
    tags: [name:ball-george-w, name:bell-david-e, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1966-01-12.program
    when: Jan. 12
    date: '1966-01-12'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9 p.m. "I believe that we can continue the Great Society while we fight in Vietnam." Asked: health and education carried forward; the war on poverty pressed; a Department of Transportation and a Highway Safety Act; whole slum areas of several cities rebuilt; whole river basins cleaned; jury discrimination ended, crimes against civil rights workers made federal, discrimination in housing outlawed; 14(b) repealed; four-year terms for the House; truth in packaging and in lending; campaign finance reformed. For the war, the automobile and telephone excise cuts of Jan. 1 restored and taxes collected faster. Expenditures $112.8 billion, deficit $1.8 billion. Vietnam: "For 20 days now" no bombs on the North; "we will stay until aggression has stopped."'
    n: 'Annual Message to the Congress on the State of the Union, [1966 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79) (Jan. 12, 1966). [[w.dallek-flawed-giant]], 299–302. To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]. See [[cal.1965-01-04.program]]; [[cal.1965-12-24.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - economy-tax-adjustment: cal.1966-01-19.economy
      - jobs-and-wages-14b: cal.1966-01-24.jobs-and-wages
      - cities-and-housing: cal.1966-01-26.cities-and-housing
      - conservation: cal.1966-02-23.conservation
      - transportation
      - open-housing
      - amendments: cal.1966-01-20.amendments
  - id: cal.1966-01-12.opinion
    when: Jan. 12
    date: '1966-01-12'
    thread: opinion
    c: 'Gallup, Dec. 11–16, 1965: the policy Johnson should follow: more to the right, with business and conservative groups, 20 percent; more to the left, with labor and other liberal groups, 14; half-way between, 52.'
    n: '[[w.gallup-poll]], III, 1983. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-12.vietnam-congress
    when: Jan. 12
    date: '1966-01-12'
    thread: vietnam-congress
    c: 'Ball before Foreign Relations in executive session, over three hours. Johnson by telephone, before: tell them the door is open to their suggestions; after, Ball: the members "troubled," not unfriendly, "not convinced there is a way out"; Fulbright on his "familiar line." A meeting of the committee with the President would set every committee asking; Johnson agrees. Dirksen, the same day, warns against bombing Hanoi and Haiphong; he had called Johnson to say he was misquoted and met him two hours, unannounced.'
    n: '[FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the telephone call, 2:10 p.m.). *New York Times*, Jan. 12, 1966. [[w.gibbons-u-s-government-and]], IV, 136–37, 141. Made public: FRUS 1964–68, IV (1998). Check: the day of Dirksen''s meeting with Johnson. To check: Ball''s other calls (LBJ Library, Papers of George Ball, "Presidential Telecons"). See [[cal.1966-01-11.vietnam-congress]]; [[cal.1966-01-07.vietnam-congress]]. Names: Ball, Johnson, Fulbright, Dirksen.'
    tags: [name:ball-george-w, name:johnson-lyndon-b, name:fulbright-j-william, name:dirksen-everett]
  - id: cal.1966-01-13.cities-and-housing
    when: Jan. 13
    date: '1966-01-13'
    thread: cities-and-housing
    also: [civil-rights-the-executive]
    c: News conference. Johnson names Weaver, Housing and Home Finance Administrator since 1961, the first Secretary of Housing and Urban Development, the first Negro in the Cabinet; and Robert C. Wood, chairman of political science at MIT and of the task forces on the cities, Under Secretary.
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966). To check: [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1961-02-09.civil-rights-the-executive]]; [[cal.1965-09-09.cities-and-housing]]. Names: Johnson, Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-01-13.legislatures-nc
    when: Jan. 13–14
    date: '1966-01-13'
    thread: legislatures
    c: 'North Carolina''s General Assembly, in extra session, reapportions: the Senate, Jan. 13; the House, in 49 districts, and the congressional districts, Jan. 14.'
    n: '[N.C. Sess. Laws, Extra Sess. 1966, chs. 1, 5–7](https://archive.org/details/sessionlaws19656667nort). See [[cal.1965-11-30.legislatures-nc]].'
    tags: [state:nc]
  - id: cal.1966-01-13.jobs-and-wages-transit
    when: Jan. 13
    date: '1966-01-13'
    thread: jobs-and-wages-transit
    also: [states-and-cities]
    c: 'New York. The transit strike settled, some $60 million to $70 million in increased benefits. Johnson, at his news conference: "quite disturbed that essential services could be paralyzed for so long"; the settlement, the Council of Economic Advisers'' Chairman tells him, "violates our national guideposts."'
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966), which gives the figures. See [[cal.1966-01-01.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1966-01-13.vietnam-congress
    when: Jan. 13
    date: '1966-01-13'
    thread: vietnam-congress
    c: 'Luncheon at the State Department for the congressional leaders and senior committee members, Fulbright and Hickenlooper among them: Ball, Rusk away, and McNamara on Vietnam.'
    n: '[[w.gibbons-u-s-government-and]], IV, 137. To check: Ball''s report in the President''s "Evening Reading," Jan. 13, 1966 (State, Lot File 74 D 164). See [[cal.1966-01-10.vietnam-pause]]. Names: Fulbright, Hickenlooper, Ball, Rusk, McNamara.'
    tags: [name:fulbright-j-william, name:hickenlooper-bourke-b, name:ball-george-w, name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1966-01-14.opinion
    when: Jan. 14
    date: '1966-01-14'
    thread: opinion
    also: [congress, amendments]
    c: 'Gallup, Dec. 11–16, 1965: a four-year term for members of the House in place of two: favor 61 percent, oppose 24. Republicans 65 favor; Democrats 59; independents 65.'
    n: '[[w.gallup-poll]], III, 1983. See [[cal.1966-01-12.program]].'
  - id: cal.1966-01-14.legislatures-mn
    when: Jan. 14
    date: '1966-01-14'
    thread: legislatures
    c: 'Minnesota. The federal court declines to draw the districts: the governor and legislature "should do so."'
    n: '*Honsey v. Donovan*, [249 F. Supp. 987](https://static.case.law/f-supp/249/case-pdfs/0987-01.pdf) (D. Minn. 1966). See [[cal.1964-12-04.legislatures-mn]].'
    tags: [state:mn]
  - id: cal.1966-01-14.state-constitutions-mo
    when: Jan. 14
    date: '1966-01-14'
    thread: state-constitutions
    also: [legislatures]
    c: Missouri, special election. Three amendments adopted. No. 3, from the extra session, a House of 163, House and Senate districts drawn by bipartisan commissions, failing which by commissioners of the Supreme Court, 178,924 to 165,395, 52.0 percent. Also pensions for county and local employees, 217,116 to 127,461, 63.0 percent, and the St. Louis school tax, 195,798 to 148,519, 56.9 percent.
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1299–1301](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38205). See [[cal.1965-08-17.state-constitutions-mo]].'
    tags: [state:mo, city:st-louis]
  - id: cal.1966-01-15.state-and-city-finance-va
    when: Jan. 15–Mar.
    date: '1966-01-15'
    thread: state-and-city-finance
    c: 'Virginia. Godwin inaugurated governor, Jan. 15. The General Assembly enacts the Virginia Retail Sales and Use Tax Act, the State''s first general sales tax, with his support (Check: the rates, the localities'' share, the date approved).'
    n: '1966 Va. Acts c. 151 (the history note, Va. Code § 58.1-603). Check: *Acts of the General Assembly*, 1966. To check: [[w.atkinson-dynamic-dominion]]; [[w.wilkinson-harry-byrd-and-the]]. See [[cal.1965-11-02.states-and-cities-2]]. Names: Godwin.'
    tags: [state:va, name:godwin-mills-e-jr]
  - id: cal.1966-01-15.africa
    when: Jan. 15–16
    date: '1966-01-15'
    thread: africa
    c: Lagos. Army majors seize power, Jan. 15; Balewa, the Prime Minister, killed. Jan. 16, Ironsi, commander in chief of the army, head of a military government.
    n: 'FRUS 1964–68, XXIV, docs. [361](https://history.state.gov/historicaldocuments/frus1964-68v24/d361), [362](https://history.state.gov/historicaldocuments/frus1964-68v24/d362). To check: [[w.lyons-keeping-africa-off-the]]. See [[cal.1963-08-23.africa]]. Names: Balewa, Ironsi.'
    tags: [name:balewa-abubakar-tafawa, name:ironsi-johnson-aguiyi]
  - id: cal.1966-01-15.vietnam-congress
    when: Jan. 15
    date: '1966-01-15'
    thread: vietnam-congress
    c: 'Goldberg to Johnson on his talks with members: Fulbright approving the peace initiative and "anxious to ''make up'' with the President"; Mansfield and Aiken enthusiastic, troubled at escalation; Church and McGovern with them; Symington ambivalent, withdrawal or all-out war; Dirksen sympathetic, but asking sympathy for his "Republican" noises; Hickenlooper doubtful of the Communists; Morgan warmly appreciative.'
    n: '[[w.gibbons-u-s-government-and]], IV, 138. To check: Goldberg to Johnson, Jan. 15, 1966 (LBJ Library, C.F. ND 19/CO 312). Names: Goldberg, Johnson, Fulbright, Mansfield, Aiken, Church, McGovern, Symington, Dirksen, Hickenlooper, Morgan.'
    tags: [name:goldberg-arthur-j, name:johnson-lyndon-b, name:fulbright-j-william, name:mansfield-mike, name:aiken-george-d, name:church-frank, name:mcgovern-george, name:symington-william-s, name:dirksen-everett, name:hickenlooper-bourke-b, name:morgan-thomas-e]
  - id: cal.1966-01-16.opinion
    when: Jan. 16
    date: '1966-01-16'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Dec. 11–16, 1965: liked best about Nixon: his honesty 12 percent; sincerity 8; personality 8; experience 7. Least: personality 9; on the fence 8; his policies 7; a poor loser 5. Wants to be President, 77. Will win the nomination: yes 24, no 64. Would like to see him President: yes 31, no 57; Republicans 60, independents 33, Democrats 15.'
    n: '[[w.gallup-poll]], III, 1983–85. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1966-01-17.court
    when: Jan. 17
    date: '1966-01-17'
    thread: court
    also: [georgia, desegregation-public-places]
    c: '*Evans v. Newton*, [382 U.S. 296](https://tile.loc.gov/storage-services/service/ll/usrep/usrep382/usrep382296/usrep382296.pdf): Baconsfield, the park U.S. Senator Augustus O. Bacon left to Macon in 1911 for white people only, does not become private, and may not be kept white, when private trustees replace the city. A park is municipal in nature; the Fourteenth Amendment reaches it. Douglas for the Court, 6–3; White concurring in the result; Black, Harlan and Stewart dissenting.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1964-12-14.court]].'
  - id: cal.1966-01-17.defense
    when: Jan. 17
    date: '1966-01-17'
    thread: defense
    also: [europe-and-the-alliance]
    c: Palomares, Spain. A B-52 of the 68th Bomb Squadron, from Seymour Johnson Air Force Base, N.C., on airborne alert with four hydrogen bombs, collides with a KC-135 tanker while refueling; seven of the eleven crewmen killed. Three bombs fall on land, the high explosive of two detonating and scattering plutonium; the fourth falls into the sea, recovered Apr. 7. No nuclear yield. Spain's Foreign Ministry asks that American thanks for its help not be made public. Feb. 16, a Soviet aide-mémoire on the accident.
    n: 'FRUS 1964–68, XII, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v12/d189), [190](https://history.state.gov/historicaldocuments/frus1964-68v12/d190), [194](https://history.state.gov/historicaldocuments/frus1964-68v12/d194). [[w.current-documents-1966]], 911–912 (the aide-mémoire). [[w.drea-mcnamara-clifford-and-the-2011]], 484 (the collision, the four bombs, the plutonium, the bomb recovered from the sea Apr. 7). To check: [[w.szulc-bombs-of-palomares]]; [[w.lewis-one-of-our-h]]; [[w.moran-day-we-lost-the]]; "Draft Administrative History of the Department of Defense, 1963–1969," 7:2417, OSD Historical Office (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 484 n.3).'
    src:
      c: 20d97ec7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d189: all'
        - 'w.current-documents-1966 911–912: ?'
        - 'w.drea-mcnamara-clifford-and-the-2011 484: A-B, D-E'
        - 'via w.drea-mcnamara-clifford-and-the-2011 484 n.2b: A-B, D'
        - 'via w.drea-mcnamara-clifford-and-the-2011 484 n.3c: E'
  - id: cal.1966-01-17.transition-and-staff
    when: Jan. 17
    date: '1966-01-17'
    thread: transition-and-staff
    also: [peace-corps, poverty]
    c: Shriver, director of the Peace Corps and of the war on poverty at once since 1964, to give full time to the war on poverty. Vaughn, Assistant Secretary of State for Inter-American Affairs, once an associate director of the Peace Corps, to direct the Peace Corps.
    n: 'Remarks Upon Announcing Appointments in the Peace Corps and in the Department of Housing and Urban Development, [1966 Pub. Papers 24](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=100) (Jan. 17, 1966). To check: [[w.hoffman-all-you-need-is]]. See [[cal.1961-03-01.peace-corps]]. Names: Shriver, Vaughn.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent, name:vaughn-jack-h]
