    when: Jan. 22
    date: '1966-01-22'
    thread: vietnam-pause
    c: 'Johnson with his advisers, noon to 2:12 p.m.: all but Ball, Goldberg and Harriman for resuming. Johnson: "I''m of the mind to continue it anyway, but we''ve had no indication of any success"; "If we go back in, the pressure will be on us to go further." McGeorge Bundy, that morning: tell the leaders the pause has failed, through the weekly meeting; no "formal consultation" with Congress.'
