    c: 'Operation Masher begins: the 1st Cavalry Division, with ARVN and Korean troops, in Bình Định province, the Bồng Sơn plain and the An Lão valley; the Marines'' Double Eagle to the north. The largest search-and-destroy operation yet; to Mar. 6.'
