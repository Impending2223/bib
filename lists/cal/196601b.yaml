  - id: cal.1966-01-31.vietnam-congress
    when: Jan. 31
    date: '1966-01-31'
    thread: vietnam-congress
    c: 'Congress on the resumption. Aiken: "we have passed the point of no return"; taxes, "universal conscription," controls to come; his vote of Aug. 1964 never a grant "to wage war at will"; he will support the President. Morse and Cotton welcome the turn to the UN. Dirksen speaks for the decision. Laird, in the House: shifts of policy, no progress with 200,000 men, the Mansfield report a "stinging indictment"; he and Ford ask a debate, perhaps a new resolution. Aiken: "This $13 billion is only the first drop in the bucket."'
