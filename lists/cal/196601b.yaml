    when: Jan. 15–16
    date: '1966-01-15'
    thread: africa
    c: Lagos. Army majors seize power, Jan. 15; Balewa, the Prime Minister, killed. Jan. 16, Ironsi, commander in chief of the army, head of a military government.
    n: 'FRUS 1964–68, XXIV, docs. [361](https://history.state.gov/historicaldocuments/frus1964-68v24/d361), [362](https://history.state.gov/historicaldocuments/frus1964-68v24/d362). To check: [[w.lyons-keeping-africa-off-the]]. See [[cal.1963-08-23.africa]]. Names: Balewa, Ironsi.'
    tags: [name:balewa-abubakar-tafawa, name:ironsi-johnson-aguiyi]
