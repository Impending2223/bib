  - id: cal.1966-01-11.vietnam-congress
    when: Jan. 11
    date: '1966-01-11'
    thread: vietnam-congress-foreign-relations
    c: 'Foreign Relations, executive session: Mansfield and Aiken report on their trip to Asia with Muskie, Inouye and J. Caleb Boggs. Mansfield: the collapse prevented, the situation not reversed; "an open-end requirement of unpredictable dimensions," perhaps 700,000 men; "all the choices open to us are bad choices." Fulbright, by prearrangement with Hickenlooper, asks Mansfield to ask Johnson to meet the committee; Mansfield will think about it, and prefers closed hearings to open.'
    n: 'Daily Digest, [112 Cong. Rec. D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=2) (Jan. 12, 1966) (the session and the report). Ball to Johnson by telephone, Jan. 12: [FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the committee''s wish, put to Mansfield, to talk privately with the President; Mansfield had not promised it). The report: Mansfield, Muskie, Inouye, Aiken and Boggs, *The Vietnam Conflict: The Substance and the Shadow*, Comm. Print (Jan. 1966); Mansfield''s private report to Johnson, "Vietnam: The Situation and Outlook," printed in S. Doc. No. 93-11 (1973) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 136–37. Made public: the executive session, the Historical Series, 1993. [[w.mann-grand-delusion]], 491. To check: Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XVIII: 1966, 36 (1993). Check: by Gibbons''s note (IV, 136 n.67) the quotations are from Mansfield''s private report to Johnson ([[cal.1965-12-18.vietnam-congress]]), not the session. Names: Mansfield, Aiken, Muskie, Inouye, Fulbright, Hickenlooper, Johnson.'
