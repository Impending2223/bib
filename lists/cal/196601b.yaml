    when: Jan. 17–18
    date: '1966-01-17'
    thread: european-community
    c: Luxembourg. The Six's foreign ministers on the French boycott of the Council; adjourned to Jan. 28.
    n: 'Check: the communiqué. To check: [[w.newhouse-collision-in-brussels]]; [[w.moravcsik-choice-for-europe]]; [[w.ludlow-european-community-and-the]]. See [[cal.1965-06-30.european-community]].'
  - id: cal.1966-01-17.cities-and-housing
    when: Jan. 17–18
    date: '1966-01-17'
    thread: cities-and-housing
    also: [civil-rights-the-executive]
    c: Weaver and Wood confirmed, Jan. 17, unanimously; sworn Jan. 18.
    n: 'Remarks Upon Announcing Appointments in the Peace Corps and in the Department of Housing and Urban Development, [1966 Pub. Papers 24](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=100) (Jan. 17, 1966); Remarks at the Swearing In of Robert C. Weaver and Robert C. Wood, [1966 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=101) (Jan. 18, 1966). Check: the Record''s page. See [[cal.1966-01-13.cities-and-housing]]. Names: Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-01-17.vietnam-congress
    when: Jan. 17
    date: '1966-01-17'
    thread: vietnam-congress
    c: 'Dirksen, in the Republicans'' answer to the State of the Union: "Viet Nam is not our war. But we pledged ourselves"; let the peace efforts and the military effort go on, the latter "intensified if necessary"; "There is, after all, no substitute for victory."'
    n: '*New York Times*, Jan. 18, 1966. [[w.gibbons-u-s-government-and]], IV, 141. Check: the day. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-01-19.india-and-china
    when: Jan. 19
    date: '1966-01-19'
    thread: south-asia
    c: New Delhi. The Congress Party in Parliament chooses Indira Gandhi, Nehru's daughter, Shastri's Minister of Information, as its leader over Desai, 355–169 (Check). Prime Minister Jan. 24.
    n: 'FRUS 1964–68, XXV, docs. [282](https://history.state.gov/historicaldocuments/frus1964-68v25/d282), [283](https://history.state.gov/historicaldocuments/frus1964-68v25/d283). To check: [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. See [[cal.1966-01-10.india-and-china]]. Names: Nehru, Indira Gandhi, Shastri, Desai.'
    tags: [name:gandhi-indira, name:nehru-jawaharlal, name:shastri-lal-bahadur, name:desai-morarji-ranchhodji]
  - id: cal.1966-01-19.vietnam
    when: Jan. 19
    date: '1966-01-19'
    thread: vietnam-supplemental
    also: [defense]
    c: 'Supplemental appropriations for fiscal 1966 asked, $12.76 billion, chiefly for Vietnam: $12.3 billion for the military, about $8 billion of it for aircraft, ships and other items with long lead times, some $200 million of it for South Vietnamese and allied forces; $415 million for AID. "Until the aggression ends." The war''s added cost put at $4.7 billion in fiscal 1966 and $5.8 billion in 1967.'
    n: 'Letter to the Speaker Transmitting Proposed Supplemental Appropriations in Support of Operations in Southeast Asia, [1966 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=108) (Jan. 19, 1966); Letter to the Chairman, House Committee on Ways and Means, Urging Prompt Action on Pending Tax Proposals, [1966 Pub. Papers 31](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=107) (Jan. 19, 1966). [[w.drea-mcnamara-clifford-and-the-2011]], 101, 144 (the Defense Department''s request, $12.3 billion). To check: [[w.gibbons-u-s-government-and]], IV, 219–20; [[w.bernstein-guns-or-butter]]. See [[cal.1965-05-04.vietnam]].'
    src:
      c: 05722aaa
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=108: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=107: all'
