  - id: cal.1966-01-19.economy
    when: Jan. 19
    date: '1966-01-19'
    thread: economy-tax-adjustment
    c: 'Taxes for the war. Johnson to Mills: "A further stimulus to keep the economy on its rising path is no longer necessary." The Tax Adjustment Act, H.R. 12752: the excise taxes on automobiles and telephone service, cut Jan. 1, restored; graduated withholding on wages; corporate payments speeded; the self-employment tax paid quarterly. $1.2 billion in fiscal 1966, $4.8 billion in 1967.'
    n: 'Letter to the Chairman, House Committee on Ways and Means, Urging Prompt Action on Pending Tax Proposals, [1966 Pub. Papers 31](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=107) (Jan. 19, 1966); Annual Budget Message to the Congress, Fiscal Year 1967, [1966 Pub. Papers 47](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=123) (Jan. 24, 1966). [[w.zelizer-taxing-america]], 257 (corporate payments speeded). To check: [[w.collins-more]]; [[w.bernstein-guns-or-butter]]. See [[cal.1966-01-12.program]]. Names: Johnson, Mills.'
    tags: [name:johnson-lyndon-b, name:mills-wilbur-d]
  - id: cal.1966-01-19.vietnam-congress
    when: Jan. 19
    date: '1966-01-19'
    thread: vietnam-congress
    c: 'Valenti to Fulbright by telephone: "mischief makers" trying to promote a fight between the President and the chairman. Fulbright: newsmen spotlight a break for want of anything else to write; he intends to cooperate with the President.'
    n: '[[w.gibbons-u-s-government-and]], IV, 145 n.94. To check: Valenti to Johnson, Jan. 19, 1966 (LBJ Library, WHCF, Ex FG 431/F). Names: Valenti, Fulbright, Johnson.'
    tags: [name:valenti-jack, name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1966-01-20.amendments
    when: Jan. 20
    date: '1966-01-20'
    thread: amendments
    also: [congress, electoral-college]
    c: 'Special message: two amendments to the Constitution. Representatives elected for four years, with the President, from 1972 at the earliest; no Member of either House eligible for the other unless he resigns 30 days before the election. The electoral college reform of 1965 asked again: unpledged electors no longer free to throw the election into the House; in a contingent election, not one vote a State; President and Vice President chosen by the same body; the District a part in it; the death of a candidate or a President-elect provided for. The joint resolution printed as H. Doc. 364.'
    n: 'Special Message to the Congress Proposing Constitutional Amendments Relating to Terms for House Members and the Electoral College System, [1966 Pub. Papers 36](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=112) (Jan. 20, 1966); H.R. Doc. No. 89-364, [112 Cong. Rec. 794](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-8-2.pdf) (1966). To check: [[w.kyvig-explicit-and-authentic-acts]]; [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]. See [[cal.1966-01-12.program]]; [[cal.1965-01-28.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-20.india-and-china
    when: Jan. 20
    date: '1966-01-20'
    thread: south-asia
    c: Bowles gives Indira Gandhi Johnson's invitation to Washington.
    n: '[FRUS 1964–68, XXV, doc. 285](https://history.state.gov/historicaldocuments/frus1964-68v25/d285). See [[cal.1966-01-19.india-and-china]]. Names: Bowles, Indira Gandhi, Johnson.'
    tags: [name:bowles-chester, name:gandhi-indira, name:johnson-lyndon-b]
  - id: cal.1966-01-20.vietnam-pause
    when: Jan. 20
    date: '1966-01-20'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball and Harriman, 5:54 to 6:31 p.m.: McNamara to get a plan of military action from the Chiefs; Rusk to tell the press there has been no answer to the pause, "the peace jig is up."'
    n: '[FRUS 1964–68, IV, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v04/d32) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 153. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-10.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, Harriman.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:ball-george-w, name:harriman-w-averell]
  - id: cal.1966-01-20.vietnam-congress
    when: Jan. 20
    date: '1966-01-20'
    thread: vietnam-congress
    c: 'McGovern in the Senate, back from Vietnam: negotiation pursued, the forces held where they are, no new offensives, the bombing still suspended; a major war in Asia "could exhaust America''s blood and treasure for all our days."'
    n: '[112 Cong. Rec., Senate, Jan. 20, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-8-1.pdf), 775 ff. [[w.gibbons-u-s-government-and]], IV, 139–40. Names: McGovern.'
    tags: [name:mcgovern-george]
  - id: cal.1966-01-20.vietnam-supplemental
    when: Jan. 20
    date: '1966-01-20'
    thread: vietnam-supplemental
    also: [defense]
    c: 'Senate Armed Services and the defense subcommittee of Appropriations, Russell chairman of both, open joint hearings in executive session on the military authorization of the supplemental, $4.8 billion: McNamara and Wheeler. Ervin: "people are dying unlimitedly in a limited war"; Symington for bombing harbors and oil, or get out; McNamara: strategic bombing would not stop the infiltration.'
    n: 'Daily Digest, [112 Cong. Rec. D14](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=12). [[w.gibbons-u-s-government-and]], IV, 220–22 (the hearings, and the House Armed Services Committee''s after them). To check: Senate Comm. on Armed Services and Subcomm. on Dep''t of Defense of the Comm. on Appropriations, *Supplemental Military Procurement and Construction Authorizations, Fiscal Year 1966: Hearings*, 89th Cong., 2d Sess. (1966), 153–54. See [[cal.1966-01-19.vietnam]]. Names: Russell, McNamara, Wheeler, Ervin, Symington.'
    tags: [name:russell-richard-b, name:mcnamara-robert-s, name:wheeler-earle, name:ervin-sam-j-jr, name:symington-william-s]
  - id: cal.1966-01-20.vietnam
    when: Jan. 20
    date: '1966-01-20'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Javits to Johnson, back from Vietnam: "enough of a chance to realize freedom''s objective there to justify our military commitment"; doubts on South Vietnam''s long-term needs and on the political, social and economic effort.'
    n: '[[w.johns-vietnams-second-front]], 139. To check: Javits to Johnson, Jan. 20, 1966, WHCF, ND 19/CO 312, box 219, Johnson Library (cited by [[w.johns-vietnams-second-front]], 139 n.75). See [[cal.1966-01-20.vietnam-pause]]. Names: Javits, Johnson.'
    src:
      c: 831c84bc
      rows:
        - 'w.johns-vietnams-second-front 139: all'
        - 'via w.johns-vietnams-second-front 139 n.75: all'
    tags: [name:javits-jacob-k, name:johnson-lyndon-b]
  - id: cal.1966-01-22.vietnam-pause
    when: Jan. 22
    date: '1966-01-22'
    thread: vietnam-pause
    c: 'Johnson with his advisers, noon to 2:12 p.m.: all but Ball, Goldberg and Harriman for resuming. Johnson: "I''m of the mind to continue it anyway, but we''ve had no indication of any success"; "If we go back in, the pressure will be on us to go further." McGeorge Bundy, that morning: tell the leaders the pause has failed, through the weekly meeting; no "formal consultation" with Congress.'
    n: 'FRUS 1964–68, IV, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v04/d34) (Bundy), [35](https://history.state.gov/historicaldocuments/frus1964-68v04/d35) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 154. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-20.vietnam-pause]]. Names: Johnson, Ball, Goldberg, Harriman, McGeorge Bundy.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:goldberg-arthur-j, name:harriman-w-averell, name:bundy-mcgeorge]
  - id: cal.1966-01-23.opinion
    when: Jan. 23
    date: '1966-01-23'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the party one would like to see win the congressional district, by region: South, Democratic 71 percent, Republican 29; East 59 and 41; West 53 and 47; Midwest 52 and 48.'
    n: '[[w.gallup-poll]], III, 1985.'
  - id: cal.1966-01-24.economy
    when: Jan. 24
    date: '1966-01-24'
    thread: economy
    c: 'Budget for fiscal 1967. Administrative budget: expenditures $112.8 billion, up $6.4 billion; receipts $111.0 billion, $3.6 billion of the rise from the new taxes; deficit $1.8 billion. Consolidated cash budget: surplus $0.5 billion. Regular programs, Vietnam apart, up $0.6 billion. Defense $58.3 billion. New obligational authority $121.9 billion, $9.1 billion of it for Vietnam. GNP for 1966, $722 billion, plus or minus $5 billion.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1967, [1966 Pub. Papers 47](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=123) (Jan. 24, 1966). To check: [[w.morgan-deficit-government]]; [[w.bernstein-guns-or-butter]]. See [[cal.1965-01-25.economy]].'
    tags: [name:johnson-lyndon-b, budget:1967]
  - id: cal.1966-01-24.jobs-and-wages
    when: Jan. 24
    date: '1966-01-24'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Repeal of 14(b) again. Mansfield moves to take up H.R. 77; Dirksen and his allies hold the floor, first on the Journal.
    n: 'Mansfield''s motion: [112 Cong. Rec. 1018](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-9-2.pdf#page=72). Repeal of section 14(b) (K–J Cong. II.J.2). See [[cal.1965-10-11.jobs-and-wages]]. Names: Mansfield, Dirksen.'
    tags: [name:mansfield-mike, name:dirksen-everett]
  - id: cal.1966-01-24.states-and-cities-dc
    when: Jan. 24
    date: '1966-01-24'
    thread: states-and-cities
    also: [civil-rights-organizations]
    c: Washington. A one-day boycott of D.C. Transit's buses against a fare rise from 20 cents to 25, called by Barry of SNCC's Washington office; SNCC claims 130,000 riders stayed off. Check the figures.
    n: '[DC Preservation League, "Marion Barry and the Student Nonviolent Coordinating Committee"](https://historicsites.dcpreservation.org/items/show/968). To check: [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Barry.'
    tags: [state:dc, city:washington, name:barry-marion-s-jr]
  - id: cal.1966-01-24.vietnam-congress
    when: Jan. 24
    date: '1966-01-24'
    thread: vietnam-congress
    c: 'Rusk before Foreign Relations in executive session: Fulbright, Clark, John Williams, Pell and Case want the committee consulted before any new major decision; Rusk: the President "has the question of consultation in front of him." The NLF one group among many. To Johnson after: the members want "a chance to sit down with you on a give-and-take discussion basis." Fulbright to the press: consult the committee before resuming; the NLF a "proper party" to negotiations. Rusk before House Foreign Affairs the same day: 12 of 15 speaking for resuming.'
    n: 'Daily Digest, [112 Cong. Rec. D16](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=14). [FRUS 1964–68, IV, doc. 38](https://history.state.gov/historicaldocuments/frus1964-68v04/d38) (Rusk to Johnson). *Washington Post*, Jan. 25, 1966. [[w.gibbons-u-s-government-and]], IV, 143–44. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 139–40, 163–82 (1993). Names: Rusk, Fulbright, Clark, John Williams, Pell, Case, Johnson.'
    tags: [name:rusk-dean, name:fulbright-j-william, name:clark-joseph-s, name:williams-john-j, name:pell-claiborne-d, name:case-clifford-p, name:johnson-lyndon-b]
  - id: cal.1966-01-24.vietnam-pause
    when: Jan. 24
    date: '1966-01-24'
    thread: vietnam-pause
    also: [vietnam-congress]
    c: 'Johnson with the Democratic leaders, 4:35 to 5:46 p.m., McCormack, Albert, Hale Boggs, Mansfield and Long. Mansfield against resuming: "I''d think most seriously before final decision is made"; China "always conquers the conqueror." McCormack: "From now on you''ll look weak." Long: "Congress can appropriate—can''t fight the war." Johnson to his advisers after: "four for us and Mansfield against us."'
    n: '[FRUS 1964–68, IV, doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v04/d40) (the advisers, 6:30 p.m.). [[w.gibbons-u-s-government-and]], IV, 144–46. To check: McGeorge Bundy''s notes (LBJ Library, Papers of McGeorge Bundy). See [[cal.1966-01-22.vietnam-pause]]. Names: Johnson, McCormack, Albert, Hale Boggs, Mansfield, Long.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w, name:albert-carl, name:boggs-hale, name:mansfield-mike, name:long-russell-b]
  - id: cal.1966-01-24.vietnam
    when: Jan. 25
    date: '1966-01-25'
    thread: vietnam-operations
    c: 'Operation Masher begins: the 1st Cavalry Division, with ARVN and Korean troops, in Bình Định province, the Bồng Sơn plain and the An Lão valley; the Marines'' Double Eagle to the north. The largest search-and-destroy operation yet; to Mar. 6.'
    n: '[FRUS 1964–68, IV, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55) (the NSC briefed, Jan. 29). [[w.vietnam-victory-in-vietnam]], 178–79, 463 n.7 (the sweep in Bình Định, against the 3d Division); [[w.schlight-united-states-air-force]], 195–196 (the operation). To check: [[w.carland-united-states-army-in]]; [[w.stanton-anatomy-of-a-division]]. See [[cal.1965-11-14.vietnam]]. Check: *Victory in Vietnam* dates the sweep in Bình Định Jan. 28–Mar. 7: almost 8,000 of the enemy put out of action, 500 Americans and South Koreans among them, and 236 aircraft; a sapper raid on An Khê, 97 aircraft (178–79, 463 n.7). Schlight, 195, has Masher''s opening day Jan. 24; FRUS''s editors, Jan. 25 (doc. 55 n. 3).'
    src:
      c: dd8b7ad1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d55: all'
        - 'w.vietnam-victory-in-vietnam 178–79, 463 n.7: A'
        - 'w.schlight-united-states-air-force 195–196: A'
    tags: [place:operation-masher, place:bong-son]
  - id: cal.1966-01-25.africa
    when: Jan. 25
    date: '1966-01-25'
    thread: africa
    c: Press stories of a CIA part in the Ben Barka kidnapping. McCloskey, after checking with the CIA, denies any American involvement.
    n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). See [[cal.1965-10-29.africa]]. Names: McCloskey, Ben Barka.'
    tags: [name:mccloskey-robert-j, name:ben-barka-mehdi]
  - id: cal.1966-01-25.vietnam
    when: Jan. 25
    date: '1966-01-25'
    thread: vietnam
    also: [congress]
    c: 'The Cabinet Room, 5:30–7:40 p.m. Johnson, Rusk and McNamara with the bipartisan leadership and the ranking members of Appropriations, Armed Services and Foreign Affairs, on resuming the bombing. Ford: "If your advisers say bombing is necessary—I''m for it." Mansfield: continue the lull. Dirksen: "If we are not winning now, let''s do what is necessary to win." Hickenlooper: "Either get out or lick them." Russell: "Go all the way." Fulbright against too; while he speaks, by one account, Johnson turns to talk with Rusk. Johnson of the resolution: "you can take it away from me any time"; Saltonstall: "Keep that resolution in your pocket."'
    n: '[FRUS 1964–68, IV, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v04/d43) (Valenti''s notes). [[w.johns-vietnams-second-front]], 105 (Dirksen; Hickenlooper); [[w.gibbons-u-s-government-and]], IV, 146–47 (all but the snub of Fulbright). To check: [[w.macneil-dirksen]], 275 (the snub). See [[cal.1965-12-24.vietnam]]. Made public: FRUS 1964–68, IV (1998). Names: Johnson, Rusk, McNamara, Ford, Mansfield, Dirksen, Hickenlooper, Russell, Fulbright, Saltonstall.'
    src:
      c: 46df246c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d43: all'
        - 'w.johns-vietnams-second-front 105: B, E-F'
        - 'w.gibbons-u-s-government-and IV, 146–47: ?'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ford-gerald-r, name:mansfield-mike, name:dirksen-everett, name:hickenlooper-bourke-b, name:russell-richard-b, name:fulbright-j-william, name:saltonstall-leverett]
  - id: cal.1966-01-25.vietnam-congress
    when: Jan. 25
    date: '1966-01-25'
    thread: vietnam-congress
    c: 'The White House''s survey of Congress: Wilson, Jan. 21, of 251 of the 295 House Democrats, majority sentiment for the policy in all but nine districts, "but most districts reported a lot of uneasy people"; Manatos, Jan. 25, the 19 Democratic Senators up for reelection, and 12 more, all in support.'
    n: 'Manatos to Johnson, Jan. 25, 1966 (LBJ Library, Diary Backup); Jean P. Lewis, "President Johnson Surveys the Congress" (paper, Georgetown University, 1990), 16–17, 34 (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 147–48. Names: Wilson, Manatos.'
    tags: [name:wilson-henry-hall, name:manatos-mike-n]
  - id: cal.1966-01-26.cities-and-housing
    when: Jan. 26
    date: '1966-01-26'
    thread: cities-and-housing
    c: 'Cities message. A Demonstration Cities Program: qualifying cities, of every size, to rebuild whole blighted neighborhoods, with every federal program joined in a plan run by a single local authority; planning grants $12 million; supplemental grants over $2.3 billion over six years. Incentives for metropolitan planning. The plan from Wood''s task force.'
    n: 'Special Message to the Congress Recommending a Program for Cities and Metropolitan Areas, [1966 Pub. Papers 82](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=158) (Jan. 26, 1966). To check: [[w.haar-between-the-idea-and]]; [[w.pritchett-robert-clifton-weaver-and]]; [[w.gelfand-nation-of-cities]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]. See [[cal.1966-01-13.cities-and-housing]]. Names: Wood.'
    tags: [name:johnson-lyndon-b, name:wood-robert-c]
  - id: cal.1966-01-26.open-housing
    when: Jan. 26
    date: '1966-01-26'
    thread: open-housing
    also: [king]
    c: 'King moves into a flat on South Hamlin Avenue in Lawndale, on Chicago''s West Side: the Chicago Freedom Movement, SCLC with the Coordinating Council of Community Organizations, against the slums, announced Jan. 7. Check the dates.'
    n: '[[w.garrow-bearing-the-cross]], 455–60. To check: [[w.ralph-northern-protest]]; [[w.anderson-confronting-the-color-line]]; [[w.cohen-american-pharaoh]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-03-21.voting-rights]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:il, city:chicago]
  - id: cal.1966-01-26.opinion
    when: Jan. 26
    date: '1966-01-26'
    thread: opinion
    also: [congress, amendments]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Senators limited to two six-year terms: favor 50 percent, oppose 38.'
    n: '[[w.gallup-poll]], III, 1986.'
  - id: cal.1966-01-26.jobs-and-wages-14b
    when: Jan. 26
    date: '1966-01-26'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Ervin's amendment to put the day's prayer in the Journal tabled, [42–37](https://voteview.com/rollcall/RS0890265).
    n: 'See [[cal.1966-01-24.jobs-and-wages]]. Names: Ervin.'
    tags: [name:ervin-sam-j-jr]
  - id: cal.1966-01-26.vietnam-pause
    when: Jan. 26
    date: '1966-01-26'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Raborn and Ball on when to resume. Johnson: "If you understand Fulbright he wants us to get out. Mansfield wants us to hunker up"; Cooper, asked if he could deliver the Viet Cong for more time, could not answer. Ball: "What we need is a philosophy of the bombing." McNamara leaves to testify; Johnson: "something wrong with our system." McGeorge Bundy telephones Edward Kennedy to keep him from a speech for a longer pause.'
    n: '[FRUS 1964–68, IV, doc. 46](https://history.state.gov/historicaldocuments/frus1964-68v04/d46) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 155–56, 159 n.137. Made public: FRUS 1964–68, IV (1998). To check: McGeorge Bundy to Johnson, "Phone Conversation with Ted Kennedy," Jan. 26, 1966 (LBJ Library). See [[cal.1966-01-25.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Fulbright, Mansfield, Cooper, Edward Kennedy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:raborn-william-f-jr, name:ball-george-w, name:fulbright-j-william, name:mansfield-mike, name:cooper-john-sherman, name:kennedy-edward-m]
  - id: cal.1966-01-26.vietnam
    when: Jan. 26
    date: '1966-01-26'
    thread: vietnam
    also: [vietnam-congress]
    c: Cooper with Johnson in the Oval Office, against resuming the bombing. Johnson gives no assurance he will pursue a negotiated settlement in full.
    n: '[[w.johns-vietnams-second-front]], 102. To check: *Washington Post*, Jan. 27, 1966 (cited by [[w.johns-vietnams-second-front]], 102 n.97). See [[cal.1966-01-25.vietnam]]. Names: Cooper, Johnson.'
