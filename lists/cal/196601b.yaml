        - 'via w.gibbons-u-s-government-and IV, 138 n.72b: all'
    tags: [name:marcy-carl, name:fulbright-j-william, name:johnson-lyndon-b, name:mansfield-mike, name:aiken-george-d, name:russell-richard-b, name:mccarthy-eugene-j, name:reston-james]
  - id: cal.1966-01-10.mississippi-2
    when: Jan. 10
    date: '1966-01-10'
    thread: mississippi
    also: [civil-rights-the-executive]
    c: 'Hattiesburg. An hour after the attack, J. L. Martin of the FBI interviews the Dahmers at Forrest General Hospital. Before dawn, at the scene: a dropped pistol, and a Ford with two tires shot flat, registered to a Klansman of Laurel. That night Roy Moore, the FBI''s agent in charge in Mississippi, takes a block of Hattiesburg motel rooms for his agents.'
    n: '[[w.branch-pillar-of-fire]], 607–8. To check: Int. J. L. Martin, June 21, 1992 (cited by [[w.branch-pillar-of-fire]], 607); Whitehead, *Attack on Terror* (1970), 238 (cited by [[w.branch-pillar-of-fire]], 607). See [[cal.1966-01-10.mississippi]]. Names: Dahmer.'
