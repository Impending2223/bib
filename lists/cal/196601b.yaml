  - id: cal.1966-01-26.vietnam-congress
    when: Jan. 26
    date: '1966-01-26'
    thread: vietnam-congress
    c: 'Cooper in the Senate, the afternoon after his talk with Johnson: "Negotiations, not escalation, should be the dominant theme of our activity now." A cease-fire under the United Nations for as long as five years, then national elections.'
    n: '[[w.johns-vietnams-second-front]], 102. To check: 112 Cong. Rec. (Senate, Jan. 26, 1966); *Washington Post*, Jan. 27, 1966 (cited by [[w.johns-vietnams-second-front]], 102 n.97). See [[cal.1966-01-26.vietnam]]. Names: Cooper, Johnson.'
    src:
      c: c288118f
      rows:
        - 'w.johns-vietnams-second-front 102: all'
        - 'via w.johns-vietnams-second-front 102 n.97a: all'
