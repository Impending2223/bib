  - id: cal.1966-01-28.vietnam-congress
    when: Jan. 28
    date: '1966-01-28'
    thread: vietnam-supplemental
    c: 'Rusk before Foreign Relations in open session on the $415 million of supplemental aid, State having pressed for a closed one: "battered by questions" on the war. Fulbright: never so much apprehension over a military involvement; should Congress not give "its further approval of this changed situation?" Rusk: "I will have to take it under advisement." The commitment, Rusk says, rests on SEATO; Church doubts that intervention against every revolution is wise. Gore: "I certainly want to disassociate myself with any interpretation that this was a declaration of war."'
