  - id: cal.1966-01-10.india-and-china
    when: Jan. 10
    date: '1966-01-10'
    thread: south-asia
    c: 'Tashkent. Shastri and Ayub Khan, Kosygin their host since Jan. 4, sign a declaration: forces back to the positions held before Aug. 5, 1965, by Feb. 25; relations restored. Shastri dies at Tashkent within hours. Johnson: "a grievous blow to the hopes of mankind for peace and progress."'
    n: 'Statement by the President on the Death of Prime Minister Shastri of India, [1966 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=78) (Jan. 10, 1966). FRUS 1964–68, XXV, docs. [275](https://history.state.gov/historicaldocuments/frus1964-68v25/d275), [279](https://history.state.gov/historicaldocuments/frus1964-68v25/d279). Check the declaration''s terms against its text. See [[cal.1965-12-14.india-and-china]]. Names: Kosygin, Shastri, Ayub Khan, Johnson.'
    tags: [name:shastri-lal-bahadur, name:ayub-khan-mohammad, name:kosygin-aleksei, name:johnson-lyndon-b]
    short: Tashkent, Shastri's death
  - id: cal.1966-01-10.congress
    when: Jan. 10
    date: '1966-01-10'
    thread: congress
    c: '89th Congress, second session, meets. House: 385 answer the call; Clarence J. Brown Jr. and Rees sworn; Lindsay''s resignation, from Dec. 30, laid before it. Senate: Harry F. Byrd Jr. sworn in his father''s seat. A joint session set for Jan. 12, 9 p.m., for the State of the Union.'
    n: '[112 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (1966); [112 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf) (1966). See [[cal.1965-01-04.congress]]; [[cal.1965-11-02.specials]]; [[cal.1965-11-10.congress]]; [[cal.1965-12-15.specials]]. Names: Lindsay, Brown, Rees, Byrd. Check: the pages.'
    tags: [name:brown-clarence-j-jr, name:rees-thomas-m, name:lindsay-john-v, name:byrd-harry-f-jr]
  - id: cal.1966-01-10.mississippi
    when: Jan. 10
    date: '1966-01-10'
    thread: mississippi
    also: [civil-rights-organizations]
    c: Hattiesburg. Before dawn, Klansmen fire on and firebomb the house and store of Vernon Dahmer, president of the Forrest County NAACP, in the Kelly Settlement. He fires back while his wife and children escape; dies of his burns that day. He had kept a voter registration book at his store and offered on the radio to help pay the poll tax of those who could not.
    n: '[[w.dittmer-local-people]], 391 (the attack; his death); [[w.branch-pillar-of-fire]], 606–7 (after two that night; house and store burned; Dahmer firing as his family goes out a back window; not his NAACP office). Check: Branch: Dahmer died at 3:45 p.m. of smoke and fumes that seared his lungs (607), not of his burns; the book a poll-tax receipt book, signed out by Sheriff Gray, and the radio notice Saturday night, Jan. 8 (606). To check: Hattiesburg American, Jan. 10, 1966, p. 1 (cited by [[w.branch-pillar-of-fire]], 606); NYT, Jan. 11, 1966, p. 10 (cited by [[w.branch-pillar-of-fire]], 606); Int. Ellie, Harold, Dennis, and Bettie Dahmer, June 22, 1992 (cited by [[w.branch-pillar-of-fire]], 606); Whitehead, *Attack on Terror* (1970), 235–38 (cited by [[w.branch-pillar-of-fire]], 606); Hattiesburg American, Jan. 11, 1966, p. 1; Jan. 13, 1966, p. 1 (cited by [[w.branch-pillar-of-fire]], 607); Int. Ellie Dahmer, June 22, 1992 (cited by [[w.branch-pillar-of-fire]], 607). See [[cal.1964-12-04.mississippi]]. Names: Dahmer. Check: the day; the Kelly Settlement; his NAACP office; the registration book and the offer on the poll tax.'
    src:
