entries:
  - id: cal.1966-01-10.india-and-china
    when: Jan. 10
    date: '1966-01-10'
    thread: south-asia
    c: 'Tashkent. Shastri and Ayub Khan, Kosygin their host since Jan. 4, sign a declaration: forces back to the positions held before Aug. 5, 1965, by Feb. 25; relations restored. Shastri dies at Tashkent within hours. Johnson: "a grievous blow to the hopes of mankind for peace and progress."'
    n: 'Statement by the President on the Death of Prime Minister Shastri of India, [1966 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=78) (Jan. 10, 1966). FRUS 1964–68, XXV, docs. [275](https://history.state.gov/historicaldocuments/frus1964-68v25/d275), [279](https://history.state.gov/historicaldocuments/frus1964-68v25/d279). Check the declaration''s terms against its text. See [[cal.1965-12-14.india-and-china]]. Names: Kosygin, Shastri, Ayub Khan, Johnson.'
    tags: [name:shastri-lal-bahadur, name:ayub-khan-mohammad, name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1966-01-10.congress
    when: Jan. 10
    date: '1966-01-10'
    thread: congress
    c: '89th Congress, second session, meets. House: 385 answer the call; Clarence J. Brown Jr. and Rees sworn; Lindsay''s resignation, from Dec. 30, laid before it. Senate: Harry F. Byrd Jr. sworn in his father''s seat. A joint session set for Jan. 12, 9 p.m., for the State of the Union.'
    n: '[112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf); [112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf). See [[cal.1965-01-04.congress]]; [[cal.1965-11-02.specials]]; [[cal.1965-11-10.congress]]; [[cal.1965-12-15.specials]]. Names: Lindsay, Brown, Rees, Byrd.'
    tags: [name:brown-clarence-j-jr, name:rees-thomas-m, name:lindsay-john-v, name:byrd-harry-f-jr]
  - id: cal.1966-01-10.mississippi
    when: Jan. 10
    date: '1966-01-10'
    thread: mississippi
    also: [civil-rights-organizations]
    c: Hattiesburg. Before dawn, Klansmen fire on and firebomb the house and store of Vernon Dahmer, president of the Forrest County NAACP, in the Kelly Settlement. He fires back while his wife and children escape; dies of his burns that day. He had kept a voter registration book at his store and offered on the radio to help pay the poll tax of those who could not.
    n: '[[w.dittmer-local-people]], 391 (the attack; his death). See [[cal.1964-12-04.mississippi]]. Names: Dahmer. Check: the day; the Kelly Settlement; his NAACP office; the registration book and the offer on the poll tax.'
    src:
      c: 28cd8492
      rows:
        - 'w.dittmer-local-people 391: A-D'
    tags: [name:dahmer-vernon]
  - id: cal.1966-01-10.georgia-bond
    when: Jan. 10
    date: '1966-01-10'
    thread: georgia-bond
    also: [students]
    c: The House refuses Bond his seat, 184–12, for his endorsement of SNCC's statement.
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966), which gives the vote (K–J Cong. II.J.1). See [[cal.1966-01-06.students]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-01-10.vietnam-pause
    when: Jan. 10
    date: '1966-01-10'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor and Helms, 1:10 to 2:10 p.m.: resuming the bombing in a few days, or after Tet; Wheeler, "Every day makes a difference." Briefing Congress: Johnson would rather Rusk and McNamara appear "at as many hearings as possible"; Rusk proposes a luncheon for the leaders and the senior committee members, and Johnson agrees.'
    n: '[FRUS 1964–68, IV, doc. 14](https://history.state.gov/historicaldocuments/frus1964-68v04/d14) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-03.vietnam-pause]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor, Helms.'
    src:
      c: 23fb09d6
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d14: all'
        - 'w.gibbons-u-s-government-and IV, 135: all'
        - 'via w.gibbons-u-s-government-and IV, 135 n.64: all'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:wheeler-earle, name:taylor-maxwell, name:helms-richard]
  - id: cal.1966-01-10.vietnam-congress
    when: Jan. 10
    date: '1966-01-10'
    thread: vietnam-congress
    also: [vietnam-pause]
    c: 'Marcy to Fulbright: at lunch Reston urged that Johnson see more of Fulbright and talk informally with senior Senators, Mansfield, Aiken, Russell and McCarthy among them. And a memorandum: the pause "the last clear chance to stop short of unlimited escalation"; withdrawal under the UN rather than escalation; only by ending the war could the Democrats win in 1966 and 1968.'
    n: '[[w.gibbons-u-s-government-and]], IV, 137–38 n.72. To check: Marcy to Fulbright, Jan. 10, 1966, on lunch with Reston, and his memorandum of the same day, National Archives, RG 46, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], IV, 138 n.72). Names: Marcy, Fulbright, Johnson, Mansfield, Aiken, Russell, McCarthy, Reston.'
    src:
      c: 332b4516
      rows:
        - 'w.gibbons-u-s-government-and IV, 137–38: all'
        - 'via w.gibbons-u-s-government-and IV, 138 n.72b: all'
    tags: [name:marcy-carl, name:fulbright-j-william, name:johnson-lyndon-b, name:mansfield-mike, name:aiken-george-d, name:russell-richard-b, name:mccarthy-eugene-j, name:reston-james]
  - id: cal.1966-01-11.legislatures-ca
    when: Jan. 11
    date: '1966-01-11'
    thread: legislatures
    c: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf): the California Supreme Court upholds the Legislature''s reapportionment, its drafting errors construed away; San Francisco''s and Alameda County''s senators at large no denial of equal protection.'
    n: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf) (1966). See [[cal.1965-10-21.legislatures-ca]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1966-01-11.vietnam-congress
    when: Jan. 11
    date: '1966-01-11'
    thread: vietnam-congress
    c: 'Foreign Relations, executive session: Mansfield and Aiken report on their trip to Asia with Muskie, Inouye and J. Caleb Boggs. Mansfield: the collapse prevented, the situation not reversed; "an open-end requirement of unpredictable dimensions," perhaps 700,000 men; "all the choices open to us are bad choices." Fulbright, by prearrangement with Hickenlooper, asks Mansfield to ask Johnson to meet the committee; Mansfield will think about it, and prefers closed hearings to open.'
    n: 'Daily Digest, [112 Cong. Rec. D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=2) (Jan. 12, 1966) (the session and the report). Ball to Johnson by telephone, Jan. 12: [FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the committee''s wish, put to Mansfield, to talk privately with the President; Mansfield had not promised it). The report: Mansfield, Muskie, Inouye, Aiken and Boggs, *The Vietnam Conflict: The Substance and the Shadow*, Comm. Print (Jan. 1966); Mansfield''s private report to Johnson, "Vietnam: The Situation and Outlook," printed in S. Doc. No. 93-11 (1973) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 136–37. Made public: the executive session, the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XVIII: 1966, 36 (1993). Check: by Gibbons''s note (IV, 136 n.67) the quotations are from Mansfield''s private report to Johnson ([[cal.1965-12-18.vietnam-congress]]), not the session. Names: Mansfield, Aiken, Muskie, Inouye, Fulbright, Hickenlooper, Johnson.'
    src:
      c: 0123efa3
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=2: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d19: E-F'
        - 'w.gibbons-u-s-government-and IV, 136–37: all'
        - 'via w.gibbons-u-s-government-and IV, 136 n.67: B-D'
        - 'via w.gibbons-u-s-government-and IV, 137 n.70: E-F'
    tags: [name:mansfield-mike, name:aiken-george-d, name:muskie-edmund-s, name:inouye-daniel-k, name:boggs-james-c, name:fulbright-j-william, name:hickenlooper-bourke-b, name:johnson-lyndon-b]
  - id: cal.1966-01-11.vietnam
    when: Jan. 11
    date: '1966-01-11'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Ball before House Foreign Affairs in the morning. At the White House, 1:05 to 2:05 p.m., Bell back from Vietnam: pacification the first problem; McNamara: "Don''t think there''s a single area pacified." Ball on the House committee: once "Gung Ho," now "looking for a way out." Johnson: "Senate will be worse than House."'
    n: '[FRUS 1964–68, IV, doc. 15](https://history.state.gov/historicaldocuments/frus1964-68v04/d15) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135–36. Made public: FRUS 1964–68, IV (1998). Names: Ball, Bell, McNamara, Johnson.'
    src:
      c: c3496077
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d15: all'
        - 'w.gibbons-u-s-government-and IV, 135–36: all'
        - 'via w.gibbons-u-s-government-and IV, 135 n.65: B-E'
    tags: [name:ball-george-w, name:bell-david-e, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1966-01-11.robert-kennedy
    when: Jan. 11
    date: '1966-01-11'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy on NBC''s *Today*: his "reservations" about the course in Vietnam, the bombing of the North above all; neither the executive nor Congress has "satisfactorily discussed" what a negotiated settlement would require. Tom Johnson sends the President a transcript.'
    n: '[[w.palermo-in-his-own-right]], 17. To check: Tom Johnson to Johnson, Jan. 11, 1966, WHFN, LBJ Library (cited by [[w.palermo-in-his-own-right]], 17 n.45). Names: Robert Kennedy, Tom Johnson.'
    src:
      c: 429b4e0b
      rows:
        - 'w.palermo-in-his-own-right 17: all'
        - 'via w.palermo-in-his-own-right 17 n.45: all'
    tags: [name:kennedy-robert-f, name:johnson-tom]
  - id: cal.1966-01-12.program
    when: Jan. 12
    date: '1966-01-12'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9 p.m. "I believe that we can continue the Great Society while we fight in Vietnam." Asked: health and education carried forward; the war on poverty pressed; a Department of Transportation and a Highway Safety Act; whole slum areas of several cities rebuilt; whole river basins cleaned; jury discrimination ended, crimes against civil rights workers made federal, discrimination in housing outlawed; 14(b) repealed; four-year terms for the House; truth in packaging and in lending; campaign finance reformed. For the war, the automobile and telephone excise cuts of Jan. 1 restored and taxes collected faster. Expenditures $112.8 billion, deficit $1.8 billion. Vietnam: "For 20 days now" no bombs on the North; "we will stay until aggression has stopped."'
    n: 'Annual Message to the Congress on the State of the Union, [1966 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79) (Jan. 12, 1966). [[w.dallek-flawed-giant]], 299–302 (the address; poverty, cities, rivers, transportation, truth in lending, four-year terms; the deficit). To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]. See [[cal.1965-01-04.program]]; [[cal.1965-12-24.vietnam]]. Names: Johnson.'
    src:
      c: 09e77b9c
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79: all'
        - 'w.dallek-flawed-giant 299–302: A, D, F-G, J-K, N'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - economy-tax-adjustment: cal.1966-01-19.economy
      - jobs-and-wages-14b: cal.1966-01-24.jobs-and-wages
      - cities-and-housing: cal.1966-01-26.cities-and-housing
      - conservation: cal.1966-02-23.conservation
      - transportation
      - open-housing
      - amendments: cal.1966-01-20.amendments
  - id: cal.1966-01-12.opinion
    when: Jan. 12
    date: '1966-01-12'
    thread: opinion
    c: 'Gallup, Dec. 11–16, 1965: the policy Johnson should follow: more to the right, with business and conservative groups, 20 percent; more to the left, with labor and other liberal groups, 14; half-way between, 52.'
    n: '[[w.gallup-poll]], III, 1983. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-12.vietnam-congress
    when: Jan. 12
    date: '1966-01-12'
    thread: vietnam-congress
    c: 'Ball before Foreign Relations in executive session, over three hours. Johnson by telephone, before: tell them the door is open to their suggestions; after, Ball: the members "troubled," not unfriendly, "not convinced there is a way out"; Fulbright on his "familiar line." A meeting of the committee with the President would set every committee asking; Johnson agrees. Dirksen, the same day, warns against bombing Hanoi and Haiphong; he had called Johnson to say he was misquoted and met him two hours, unannounced.'
    n: '[FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the telephone call, 2:10 p.m.). *New York Times*, Jan. 12, 1966. [[w.gibbons-u-s-government-and]], IV, 136–37, 141. Made public: FRUS 1964–68, IV (1998). Check: the day of Dirksen''s meeting with Johnson. To check: Ball''s other calls (LBJ Library, Papers of George Ball, "Presidential Telecons"); Ball and Johnson, telephone conversation before the hearing, Jan. 12, 1966, Papers of George Ball, Presidential Telecons, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 137 n.69); Ball and Johnson, telephone conversation, Jan. 12, 1966, Papers of George Ball, Presidential Telecons, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 141 n.81). See [[cal.1966-01-11.vietnam-congress]]; [[cal.1966-01-07.vietnam-congress]]. Names: Ball, Johnson, Fulbright, Dirksen.'
    src:
      c: dac087ba
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d19: all'
        - 'w.gibbons-u-s-government-and IV, 136–37: A-F'
        - 'w.gibbons-u-s-government-and IV, 141: G-H'
        - 'via w.gibbons-u-s-government-and IV, 137 n.69: B'
        - 'via w.gibbons-u-s-government-and IV, 137 n.71: C-F'
        - 'via w.gibbons-u-s-government-and IV, 141 n.80: G'
        - 'via w.gibbons-u-s-government-and IV, 141 n.81: H'
    tags: [name:ball-george-w, name:johnson-lyndon-b, name:fulbright-j-william, name:dirksen-everett]
  - id: cal.1966-01-13.cities-and-housing
    when: Jan. 13
    date: '1966-01-13'
    thread: cities-and-housing
    also: [civil-rights-the-executive]
    c: News conference. Johnson names Weaver, Housing and Home Finance Administrator since 1961, the first Secretary of Housing and Urban Development, the first Negro in the Cabinet; and Robert C. Wood, chairman of political science at MIT and of the task forces on the cities, Under Secretary.
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966). To check: [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1961-02-09.civil-rights-the-executive]]; [[cal.1965-09-09.cities-and-housing]]. Names: Johnson, Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-01-13.legislatures-nc
    when: Jan. 13–14
    date: '1966-01-13'
    thread: legislatures
    c: 'North Carolina''s General Assembly, in extra session, reapportions: the Senate, Jan. 13; the House, in 49 districts, and the congressional districts, Jan. 14.'
    n: '[N.C. Sess. Laws, Extra Sess. 1966, chs. 1, 5–7](https://archive.org/details/sessionlaws19656667nort). See [[cal.1965-11-30.legislatures-nc]].'
    tags: [state:nc]
  - id: cal.1966-01-13.jobs-and-wages-transit
    when: Jan. 13
    date: '1966-01-13'
    thread: jobs-and-wages-transit
    also: [states-and-cities]
    c: 'New York. The transit strike settled, some $60 million to $70 million in increased benefits. Johnson, at his news conference: "quite disturbed that essential services could be paralyzed for so long"; the settlement, the Council of Economic Advisers'' Chairman tells him, "violates our national guideposts."'
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966), which gives the figures. See [[cal.1966-01-01.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1966-01-13.vietnam-congress
    when: Jan. 13
    date: '1966-01-13'
    thread: vietnam-congress
    c: 'Luncheon at the State Department for the congressional leaders and senior committee members, Fulbright and Hickenlooper among them: Ball, Rusk away, and McNamara on Vietnam.'
    n: '[[w.gibbons-u-s-government-and]], IV, 137. To check: Ball''s report in the President''s "Evening Reading," Jan. 13, 1966 (State, Lot File 74 D 164); Ball to Johnson, report of the luncheon of Jan. 13, 1966, in the President''s "Evening Reading", State Department, Lot File 74 D 164 (cited by [[w.gibbons-u-s-government-and]], IV, 137 n.72). See [[cal.1966-01-10.vietnam-pause]]. Names: Fulbright, Hickenlooper, Ball, Rusk, McNamara.'
