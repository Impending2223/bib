    date: '1966-01-25'
    thread: vietnam
    also: [congress]
    c: 'The Cabinet Room, 5:30–7:40 p.m. Johnson, Rusk and McNamara with the bipartisan leadership and the ranking members of Appropriations, Armed Services and Foreign Affairs, on resuming the bombing. Ford: "If your advisers say bombing is necessary—I''m for it." Mansfield: continue the lull. Dirksen: "If we are not winning now, let''s do what is necessary to win." Hickenlooper: "Either get out or lick them." Russell: "Go all the way." Fulbright against too; while he speaks, by one account, Johnson turns to talk with Rusk. Johnson of the resolution: "you can take it away from me any time"; Saltonstall: "Keep that resolution in your pocket."'
    n: '[FRUS 1964–68, IV, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v04/d43) (Valenti''s notes). [[w.johns-vietnams-second-front]], 105 (Dirksen; Hickenlooper); [[w.gibbons-u-s-government-and]], IV, 146–47 (all but the snub of Fulbright). To check: [[w.macneil-dirksen]], 275 (the snub). See [[cal.1965-12-24.vietnam]]. Made public: FRUS 1964–68, IV (1998). Names: Johnson, Rusk, McNamara, Ford, Mansfield, Dirksen, Hickenlooper, Russell, Fulbright, Saltonstall.'
