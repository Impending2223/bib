  - id: cal.1966-01-31.vietnam
    when: Jan. 31–Feb. 2
    date: '1966-01-31'
    thread: vietnam-air-war
    c: 'The bombing of the North resumed after 37 days. Before it: Jan. 21, 77 House members write for more effort through the United Nations; Jan. 27, 15 Senators, Hartke the first, against resuming. Johnson''s reply, Jan. 28: guided by the resolution of Aug. 10, 1964, "by a vote of 504 to 2." Hồ Chí Minh''s letter of Jan. 24 to heads of state. NSC, Jan. 29: the peace offensive, in the notes of Rusk''s report, "no runs, no hits, no errors." Jan. 31, 10 a.m., Johnson on television: aircraft "have resumed action in North Vietnam." The same day Goldberg asks the Security Council to meet, with a resolution for a conference to apply the Geneva accords. Feb. 2, the Council puts Vietnam on its agenda, 9–2 (Check), and adjourns for private consultations.'
    n: 'Statement by the President Announcing Resumption of Air Strikes on North Vietnam, [1966 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=190) (Jan. 31, 1966); Reply to a Letter From a Group of House Members, [1966 Pub. Papers 44](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=120) (Jan. 22, 1966); Reply to a Letter From a Group of Senators, [1966 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=188) (Jan. 28, 1966). [FRUS 1964–68, IV, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55); [doc. 56](https://history.state.gov/historicaldocuments/frus1964-68v04/d56); [doc. 57](https://history.state.gov/historicaldocuments/frus1964-68v04/d57); [doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v04/d59). [[w.gibbons-u-s-government-and]], IV, 140, 155–58, 163–64 (the House members'' letter, 140; the Senators'' letter and the reply, 155–58; the NSC and the resumption, 163–64); [[w.preston-war-council]], 227; [[w.califano-triumph-and-tragedy-of]], 121 (resumed Jan. 31; Hanoi and Haiphong still barred); [[w.branch-at-canaans-edge]], 433 (from the White House theater, 10 a.m.); [[w.cosmas-joint-chiefs-of-staff-2012]], 408 (the order to resume at 0001, Jan. 31, Saigon time, by armed reconnaissance of designated areas and routes); [[w.drea-mcnamara-clifford-and-the-2011]], 69 (after 37 days; rain, low visibility and a lower level of sorties). [[w.mann-grand-delusion]], 481–83 (the Senators'' letter; the reply; the resumption). [[w.rusk-as-i-saw-it-1990]], 466 (the resumption). To check: "Johnson Asks U.N. to Summon Vietnam Peace Conference/ Bombing in North Resumes," NYT, Feb. 1, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 433). See [[cal.1965-12-24.vietnam]]; [[cal.1966-01-03.vietnam]]. Made public, the NSC notes: FRUS 1964–68, IV (1998). Gibbons dates the NSC meeting Sunday, Jan. 30, the notes'' date of Jan. 29 an error (IV, 163 n.146); FRUS''s editors take its time, 1:20–2:30 p.m., Jan. 29, from the Daily Diary (doc. 55 n. 1). Names: Johnson, Hồ Chí Minh, Rusk, Goldberg, Hartke.'
