  - id: cal.1966-01-25.vietnam
    when: Jan. 25
    date: '1966-01-25'
    thread: vietnam
    also: [congress]
    c: 'The Cabinet Room, 5:30–7:40 p.m. Johnson, Rusk and McNamara with the bipartisan leadership and the ranking members of Appropriations, Armed Services and Foreign Affairs, on resuming the bombing. Ford: "If your advisers say bombing is necessary—I''m for it." Mansfield: continue the lull. Dirksen: "If we are not winning now, let''s do what is necessary to win." Hickenlooper: "Either get out or lick them." Russell: "Go all the way." Fulbright against too; while he speaks, by one account, Johnson turns to talk with Rusk. Johnson of the resolution: "you can take it away from me any time"; Saltonstall: "Keep that resolution in your pocket."'
    n: '[FRUS 1964–68, IV, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v04/d43) (Valenti''s notes). [[w.johns-vietnams-second-front]], 105 (Dirksen; Hickenlooper); [[w.gibbons-u-s-government-and]], IV, 146–47 (all but the snub of Fulbright); [[w.branch-at-canaans-edge]], 425 (Mansfield and Fulbright for enclaves and a plebiscite under the Geneva accords; Dirksen and Ford for bombing; Russell: "I''d rather kill them than have American boys die"; Bolton: "Can''t we fight?"; Johnson reads from Catton''s *Never Call Retreat*, Robert Kennedy''s gift); [[w.woods-fulbright]], 401 (Mansfield and Fulbright alone for continuing the pause); [[w.thomas-robert-kennedy]], 315 (Johnson quotes Catton to the congressional leaders). [[w.mann-grand-delusion]], 480–81 (Russell; Mansfield; Fulbright). To check: [[w.macneil-dirksen]], 275 (the snub); President''s Daily Diary, Jan. 25, 1966, pp. 6–7, LBJ (cited by [[w.branch-at-canaans-edge]], 425); Jack Valenti notes, "Meeting in Cabinet Room, 5:30 p.m.—7:40 p.m.," Jan. 25, 1966, Office of the President, Valenti Papers, Box WSL TB} (cited by [[w.branch-at-canaans-edge]], 425); Jack Valenti notes, "Meeting in Cabinet Room, 5:30 p.m.—7:40 p.m.," Jan. 25, 1966, Office of the President, Valenti Papers, Box WSL TB} (cited by [[w.branch-at-canaans-edge]], 425); "Johnson Stimulated by Lincoln in Agony of Decision Making," WP, Jan. 27, 1966, p. 14 (cited by [[w.branch-at-canaans-edge]], 425); [[w.karnow-vietnam]], 499 (cited by [[w.branch-at-canaans-edge]], 425); Schlesinger, Robert Kennedy, pa 7o2: (cited by [[w.branch-at-canaans-edge]], 425). See [[cal.1965-12-24.vietnam]]. Made public: FRUS 1964–68, IV (1998). Names: Johnson, Rusk, McNamara, Ford, Mansfield, Dirksen, Hickenlooper, Russell, Fulbright, Saltonstall.'
