  - id: cal.1966-01-10.vietnam-congress
    when: Jan. 10
    date: '1966-01-10'
    thread: vietnam-congress-foreign-relations
    also: [vietnam-pause]
    c: 'Marcy to Fulbright: at lunch Reston urged that Johnson see more of Fulbright and talk informally with senior Senators, Mansfield, Aiken, Russell and McCarthy among them. And a memorandum: the pause "the last clear chance to stop short of unlimited escalation"; withdrawal under the UN rather than escalation; only by ending the war could the Democrats win in 1966 and 1968.'
    n: '[[w.gibbons-u-s-government-and]], IV, 137–38 n.72. To check: Marcy to Fulbright, Jan. 10, 1966, on lunch with Reston, and his memorandum of the same day, National Archives, RG 46, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], IV, 138 n.72). Names: Marcy, Fulbright, Johnson, Mansfield, Aiken, Russell, McCarthy, Reston.'
