      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d20: all'
        - 'w.gibbons-u-s-government-and IV, 134: all'
        - 'via w.gibbons-u-s-government-and IV, 134 n.61: all'
    tags: [name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-01-14.opinion
    when: Jan. 14
    date: '1966-01-14'
    thread: opinion
    also: [congress, amendments]
    c: 'Gallup, Dec. 11–16, 1965: a four-year term for members of the House in place of two: favor 61 percent, oppose 24. Republicans 65 favor; Democrats 59; independents 65.'
    n: '[[w.gallup-poll]], III, 1983. See [[cal.1966-01-12.program]].'
  - id: cal.1966-01-14.legislatures-mn
    when: Jan. 14
    date: '1966-01-14'
    thread: legislatures
    c: 'Minnesota. The federal court declines to draw the districts: the governor and legislature "should do so."'
    n: '*Honsey v. Donovan*, [249 F. Supp. 987](https://static.case.law/f-supp/249/case-pdfs/0987-01.pdf) (D. Minn. 1966). See [[cal.1964-12-04.legislatures-mn]].'
    tags: [state:mn]
  - id: cal.1966-01-14.state-constitutions-mo
    when: Jan. 14
    date: '1966-01-14'
    thread: state-constitutions
    also: [legislatures]
    c: Missouri, special election. Three amendments adopted. No. 3, from the extra session, a House of 163, House and Senate districts drawn by bipartisan commissions, failing which by commissioners of the Supreme Court, 178,924 to 165,395, 52.0 percent. Also pensions for county and local employees, 217,116 to 127,461, 63.0 percent, and the St. Louis school tax, 195,798 to 148,519, 56.9 percent.
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1299–1301](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38205). See [[cal.1965-08-17.state-constitutions-mo]].'
