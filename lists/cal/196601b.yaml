  - id: cal.1966-01-12.program
    when: Jan. 12
    date: '1966-01-12'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9 p.m. "I believe that we can continue the Great Society while we fight in Vietnam." Asked: health and education carried forward; the war on poverty pressed; a Department of Transportation and a Highway Safety Act; whole slum areas of several cities rebuilt; whole river basins cleaned; jury discrimination ended, crimes against civil rights workers made federal, discrimination in housing outlawed; 14(b) repealed; four-year terms for the House; truth in packaging and in lending; campaign finance reformed. For the war, the automobile and telephone excise cuts of Jan. 1 restored and taxes collected faster. Expenditures $112.8 billion, deficit $1.8 billion. Vietnam: "For 20 days now" no bombs on the North; "we will stay until aggression has stopped."'
    n: 'Annual Message to the Congress on the State of the Union, [1966 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79) (Jan. 12, 1966). [[w.dallek-flawed-giant]], 299–302 (the address; poverty, cities, rivers, transportation, truth in lending, four-year terms; the deficit); [[w.califano-triumph-and-tragedy-of]], 117–20 (drafts Jan. 5–11; Goodwin will not go to the Capitol; the bedroom at 7:15 a.m., "cut by a third"; Clifford and Fortas that afternoon; the sentence on strikes, aimed at Lindsay; 59 interruptions, Watson to start the clapping; the four-year term, Celler on his hands); [[w.branch-at-canaans-edge]], 416–17 (59 ovations in the House, 417); [[w.zelizer-fierce-urgency-of-now]], 225–26 ("This nation is mighty enough . . . to pursue our goals in the rest of the world while still building a Great Society here at home"; a budget of $112.8 billion); [[w.bernstein-guns-or-butter]], 321–22 (the program asked; the day''s drafting: the "final" draft rejected by 7:15 a.m., Fortas and Clifford over it in the afternoon); [[w.bernstein-guns-or-butter]], 312; [[w.graham-uncertain-triumph]], 118. Check: Bernstein, 321, gives 9:04 p.m. To check: New York Times, Jan. 13, 1966, pp. 1, 14 (cited by [[w.branch-at-canaans-edge]], 416); Vital Speeches of the Day, Vol. 32, pp. 226–30 (cited by [[w.branch-at-canaans-edge]], 416); "Ban on Color Line in Housing Asked/ President Also Seeks Law for Federal Penalties in Civil Rights Murders," NYT, Jan. 13, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 416). See [[cal.1965-01-04.program]]; [[cal.1965-12-24.vietnam]]. Names: Johnson.'
