# Cal. LXXV January 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXV
entries:
  - id: cal.1966-01-10.india-and-china
    when: Jan. 10
    date: '1966-01-10'
    thread: south-asia
    c: 'Tashkent. Shastri and Ayub Khan, Kosygin their host since Jan. 4, sign a declaration: forces back to the positions held before Aug. 5, 1965, by Feb. 25; relations restored. Shastri dies at Tashkent within hours. Johnson: "a grievous blow to the hopes of mankind for peace and progress."'
    n: 'Statement by the President on the Death of Prime Minister Shastri of India, [1966 Pub. Papers 2](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=78) (Jan. 10, 1966). FRUS 1964–68, XXV, docs. [275](https://history.state.gov/historicaldocuments/frus1964-68v25/d275), [279](https://history.state.gov/historicaldocuments/frus1964-68v25/d279). Check the declaration''s terms against its text. See [[cal.1965-12-14.india-and-china]]. Names: Kosygin, Shastri, Ayub Khan, Johnson.'
    tags: [name:shastri-lal-bahadur, name:ayub-khan-mohammad, name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1966-01-10.congress
    when: Jan. 10
    date: '1966-01-10'
    thread: congress
    c: '89th Congress, second session, meets. House: 385 answer the call; Clarence J. Brown Jr. and Rees sworn; Lindsay''s resignation, from Dec. 30, laid before it. Senate: Harry F. Byrd Jr. sworn in his father''s seat. A joint session set for Jan. 12, 9 p.m., for the State of the Union.'
    n: '[112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf); [112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf). See [[cal.1965-01-04.congress]]; [[cal.1965-11-02.specials]]; [[cal.1965-11-10.congress]]; [[cal.1965-12-15.specials]]. Names: Lindsay, Brown, Rees, Byrd.'
    tags: [name:brown-clarence-j-jr, name:rees-thomas-m, name:lindsay-john-v, name:byrd-harry-f-jr]
  - id: cal.1966-01-10.mississippi
    when: Jan. 10
    date: '1966-01-10'
    thread: mississippi
    also: [civil-rights-organizations]
    c: Hattiesburg. Before dawn, Klansmen fire on and firebomb the house and store of Vernon Dahmer, president of the Forrest County NAACP, in the Kelly Settlement. He fires back while his wife and children escape; dies of his burns that day. He had kept a voter registration book at his store and offered on the radio to help pay the poll tax of those who could not.
    n: '[[w.dittmer-local-people]]. See [[cal.1964-12-04.mississippi]]. Names: Dahmer.'
    tags: [name:dahmer-vernon]
  - id: cal.1966-01-10.georgia-bond
    when: Jan. 10
    date: '1966-01-10'
    thread: georgia-bond
    also: [students]
    c: The House refuses Bond his seat, 184–12, for his endorsement of SNCC's statement.
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966), which gives the vote (K–J Cong. II.J.1). See [[cal.1966-01-06.students]]. Names: Bond.'
    tags: [name:bond-julian]
  - id: cal.1966-01-11.legislatures-ca
    when: Jan. 11
    date: '1966-01-11'
    thread: legislatures
    c: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf): the California Supreme Court upholds the Legislature''s reapportionment, its drafting errors construed away; San Francisco''s and Alameda County''s senators at large no denial of equal protection.'
    n: '*Silver v. Brown*, [63 Cal. 2d 841](https://static.case.law/cal-2d/63/case-pdfs/0841-01.pdf) (1966). See [[cal.1965-10-21.legislatures-ca]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1966-01-12.program
    when: Jan. 12
    date: '1966-01-12'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9 p.m. "I believe that we can continue the Great Society while we fight in Vietnam." Asked: health and education carried forward; the war on poverty pressed; a Department of Transportation and a Highway Safety Act; whole slum areas of several cities rebuilt; whole river basins cleaned; jury discrimination ended, crimes against civil rights workers made federal, discrimination in housing outlawed; 14(b) repealed; four-year terms for the House; truth in packaging and in lending; campaign finance reformed. For the war, the automobile and telephone excise cuts of Jan. 1 restored and taxes collected faster. Expenditures $112.8 billion, deficit $1.8 billion. Vietnam: "For 20 days now" no bombs on the North; "we will stay until aggression has stopped."'
    n: 'Annual Message to the Congress on the State of the Union, [1966 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=79) (Jan. 12, 1966). [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]; [[w.dallek-flawed-giant]]. See [[cal.1965-01-04.program]]; [[cal.1965-12-24.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - economy-tax-adjustment: cal.1966-01-19.economy
      - jobs-and-wages-14b: cal.1966-01-24.jobs-and-wages
      - cities-and-housing: cal.1966-01-26.cities-and-housing
      - conservation: cal.1966-02-23.conservation
      - transportation
      - open-housing
      - amendments: cal.1966-01-20.amendments
  - id: cal.1966-01-12.opinion
    when: Jan. 12
    date: '1966-01-12'
    thread: opinion
    c: 'Gallup, Dec. 11–16, 1965: the policy Johnson should follow: more to the right, with business and conservative groups, 20 percent; more to the left, with labor and other liberal groups, 14; half-way between, 52.'
    n: '[[w.gallup-poll]], III, 1983. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-13.cities-and-housing
    when: Jan. 13
    date: '1966-01-13'
    thread: cities-and-housing
    also: [civil-rights-the-executive]
    c: News conference. Johnson names Weaver, Housing and Home Finance Administrator since 1961, the first Secretary of Housing and Urban Development, the first Negro in the Cabinet; and Robert C. Wood, chairman of political science at MIT and of the task forces on the cities, Under Secretary.
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966). [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1961-02-09.civil-rights-the-executive]]; [[cal.1965-09-09.cities-and-housing]]. Names: Johnson, Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-01-13.legislatures-nc
    when: Jan. 13–14
    date: '1966-01-13'
    thread: legislatures
    c: 'North Carolina''s General Assembly, in extra session, reapportions: the Senate, Jan. 13; the House, in 49 districts, and the congressional districts, Jan. 14.'
    n: '[N.C. Sess. Laws, Extra Sess. 1966, chs. 1, 5–7](https://archive.org/details/sessionlaws19656667nort). See [[cal.1965-11-30.legislatures-nc]].'
    tags: [state:nc]
  - id: cal.1966-01-13.jobs-and-wages-transit
    when: Jan. 13
    date: '1966-01-13'
    thread: jobs-and-wages-transit
    also: [states-and-cities]
    c: 'New York. The transit strike settled, some $60 million to $70 million in increased benefits. Johnson, at his news conference: "quite disturbed that essential services could be paralyzed for so long"; the settlement, the Council of Economic Advisers'' Chairman tells him, "violates our national guideposts."'
    n: 'The President''s News Conference, [1966 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=90) (Jan. 13, 1966), which gives the figures. See [[cal.1966-01-01.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1966-01-14.opinion
    when: Jan. 14
    date: '1966-01-14'
    thread: opinion
    also: [congress, amendments]
    c: 'Gallup, Dec. 11–16, 1965: a four-year term for members of the House in place of two: favor 61 percent, oppose 24. Republicans 65 favor; Democrats 59; independents 65.'
    n: '[[w.gallup-poll]], III, 1983. See [[cal.1966-01-12.program]].'
  - id: cal.1966-01-14.legislatures-mn
    when: Jan. 14
    date: '1966-01-14'
    thread: legislatures
    c: 'Minnesota. The federal court declines to draw the districts: the governor and legislature "should do so."'
    n: '*Honsey v. Donovan*, [249 F. Supp. 987](https://static.case.law/f-supp/249/case-pdfs/0987-01.pdf) (D. Minn. 1966). See [[cal.1964-12-04.legislatures-mn]].'
    tags: [state:mn]
  - id: cal.1966-01-14.state-constitutions-mo
    when: Jan. 14
    date: '1966-01-14'
    thread: state-constitutions
    also: [legislatures]
    c: 'Missouri, special election. Three amendments adopted. No. 3, from the extra session: a House of 163; House and Senate districts drawn by bipartisan commissions, failing which by commissioners of the Supreme Court; 178,924 to 165,395. Also pensions for county and local employees, 217,116 to 127,461, and the St. Louis school tax, 195,798 to 148,519.'
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1299–1301](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38205). See [[cal.1965-08-17.state-constitutions-mo]].'
    tags: [state:mo, city:st-louis]
  - id: cal.1966-01-15.state-and-city-finance-va
    when: Jan. 15–Mar.
    date: '1966-01-15'
    thread: state-and-city-finance
    c: 'Virginia. Godwin inaugurated governor, Jan. 15. The General Assembly enacts the Virginia Retail Sales and Use Tax Act, the State''s first general sales tax, with his support (Check: the rates, the localities'' share, the date approved).'
    n: '1966 Va. Acts c. 151 (the history note, Va. Code § 58.1-603). Check: *Acts of the General Assembly*, 1966. [[w.atkinson-dynamic-dominion]]; [[w.wilkinson-harry-byrd-and-the]]. See [[cal.1965-11-02.states-and-cities-2]]. Names: Godwin.'
    tags: [state:va, name:godwin-mills-e-jr]
  - id: cal.1966-01-15.africa
    when: Jan. 15–16
    date: '1966-01-15'
    thread: africa
    c: Lagos. Army majors seize power, Jan. 15; Balewa, the Prime Minister, killed. Jan. 16, Ironsi, commander in chief of the army, head of a military government.
    n: 'FRUS 1964–68, XXIV, docs. [361](https://history.state.gov/historicaldocuments/frus1964-68v24/d361), [362](https://history.state.gov/historicaldocuments/frus1964-68v24/d362). [[w.lyons-keeping-africa-off-the]]. See [[cal.1963-08-23.africa]]. Names: Balewa, Ironsi.'
    tags: [name:balewa-abubakar-tafawa, name:ironsi-johnson-aguiyi]
  - id: cal.1966-01-16.opinion
    when: Jan. 16
    date: '1966-01-16'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Dec. 11–16, 1965: liked best about Nixon: his honesty 12 percent; sincerity 8; personality 8; experience 7. Least: personality 9; on the fence 8; his policies 7; a poor loser 5. Wants to be President, 77. Will win the nomination: yes 24, no 64. Would like to see him President: yes 31, no 57; Republicans 60, independents 33, Democrats 15.'
    n: '[[w.gallup-poll]], III, 1983–85. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1966-01-17.court
    when: Jan. 17
    date: '1966-01-17'
    thread: court
    also: [georgia, desegregation-public-places]
    c: '*Evans v. Newton*, [382 U.S. 296](https://tile.loc.gov/storage-services/service/ll/usrep/usrep382/usrep382296/usrep382296.pdf): Baconsfield, the park U.S. Senator Augustus O. Bacon left to Macon in 1911 for white people only, does not become private, and may not be kept white, when private trustees replace the city. A park is municipal in nature; the Fourteenth Amendment reaches it. Douglas for the Court, 6–3; White concurring in the result; Black, Harlan and Stewart dissenting.'
    n: '[[w.powe-warren-court-and-american]]. See [[cal.1964-12-14.court]].'
  - id: cal.1966-01-17.defense
    when: Jan. 17
    date: '1966-01-17'
    thread: defense
    also: [europe-and-the-alliance]
    c: Palomares, Spain. A B-52 of the 68th Bomb Squadron, from Seymour Johnson Air Force Base, N.C., on airborne alert with four hydrogen bombs, collides with a KC-135 tanker while refueling; seven of the eleven crewmen killed. Three bombs fall on land, the high explosive of two detonating and scattering plutonium; the fourth falls into the sea, recovered Apr. 7. No nuclear yield. Spain's Foreign Ministry asks that American thanks for its help not be made public. Feb. 16, a Soviet aide-mémoire on the accident.
    n: 'FRUS 1964–68, XII, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v12/d189), [190](https://history.state.gov/historicaldocuments/frus1964-68v12/d190), [194](https://history.state.gov/historicaldocuments/frus1964-68v12/d194). [[w.current-documents-1966]], 911–912 (the aide-mémoire). [[w.szulc-bombs-of-palomares]]; [[w.lewis-one-of-our-h]]; [[w.moran-day-we-lost-the]].'
  - id: cal.1966-01-17.transition-and-staff
    when: Jan. 17
    date: '1966-01-17'
    thread: transition-and-staff
    also: [peace-corps, poverty]
    c: Shriver, director of the Peace Corps and of the war on poverty at once since 1964, to give full time to the war on poverty. Vaughn, Assistant Secretary of State for Inter-American Affairs, once an associate director of the Peace Corps, to direct the Peace Corps.
    n: 'Remarks Upon Announcing Appointments in the Peace Corps and in the Department of Housing and Urban Development, [1966 Pub. Papers 24](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=100) (Jan. 17, 1966). [[w.hoffman-all-you-need-is]]. See [[cal.1961-03-01.peace-corps]]. Names: Shriver, Vaughn.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent, name:vaughn-jack-h]
  - id: cal.1966-01-17.european-community
    when: Jan. 17–18
    date: '1966-01-17'
    thread: european-community
    c: Luxembourg. The Six's foreign ministers on the French boycott of the Council; adjourned to Jan. 28.
    n: 'Check: the communiqué. [[w.newhouse-collision-in-brussels]]; [[w.moravcsik-choice-for-europe]]; [[w.ludlow-european-community-and-the]]. See [[cal.1965-06-30.european-community]].'
  - id: cal.1966-01-17.cities-and-housing
    when: Jan. 17–18
    date: '1966-01-17'
    thread: cities-and-housing
    also: [civil-rights-the-executive]
    c: Weaver and Wood confirmed, Jan. 17, unanimously; sworn Jan. 18.
    n: 'Remarks Upon Announcing Appointments in the Peace Corps and in the Department of Housing and Urban Development, [1966 Pub. Papers 24](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=100) (Jan. 17, 1966); Remarks at the Swearing In of Robert C. Weaver and Robert C. Wood, [1966 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=101) (Jan. 18, 1966). Check: the Record''s page. See [[cal.1966-01-13.cities-and-housing]]. Names: Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-01-19.india-and-china
    when: Jan. 19
    date: '1966-01-19'
    thread: south-asia
    c: New Delhi. The Congress Party in Parliament chooses Indira Gandhi, Nehru's daughter, Shastri's Minister of Information, as its leader over Desai, 355–169 (Check). Prime Minister Jan. 24.
    n: 'FRUS 1964–68, XXV, docs. [282](https://history.state.gov/historicaldocuments/frus1964-68v25/d282), [283](https://history.state.gov/historicaldocuments/frus1964-68v25/d283). [[w.kux-india-and-the-united]]; [[w.mcmahon-cold-war-on-the]]. See [[cal.1966-01-10.india-and-china]]. Names: Nehru, Indira Gandhi, Shastri, Desai.'
    tags: [name:gandhi-indira, name:nehru-jawaharlal, name:shastri-lal-bahadur, name:desai-morarji-ranchhodji]
  - id: cal.1966-01-19.vietnam
    when: Jan. 19
    date: '1966-01-19'
    thread: vietnam-supplemental
    also: [defense]
    c: 'Supplemental appropriations for fiscal 1966 asked, $12.76 billion, chiefly for Vietnam: $12.3 billion for the military, about $8 billion of it for aircraft, ships and other items with long lead times, some $200 million of it for South Vietnamese and allied forces; $415 million for AID. "Until the aggression ends." The war''s added cost put at $4.7 billion in fiscal 1966 and $5.8 billion in 1967.'
    n: 'Letter to the Speaker Transmitting Proposed Supplemental Appropriations in Support of Operations in Southeast Asia, [1966 Pub. Papers 32](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=108) (Jan. 19, 1966); Letter to the Chairman, House Committee on Ways and Means, Urging Prompt Action on Pending Tax Proposals, [1966 Pub. Papers 31](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=107) (Jan. 19, 1966). [[w.gibbons-u-s-government-and]]; [[w.bernstein-guns-or-butter]]. See [[cal.1965-05-04.vietnam]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-19.economy
    when: Jan. 19
    date: '1966-01-19'
    thread: economy-tax-adjustment
    c: 'Taxes for the war. Johnson to Mills: "A further stimulus to keep the economy on its rising path is no longer necessary." The Tax Adjustment Act, H.R. 12752: the excise taxes on automobiles and telephone service, cut Jan. 1, restored; graduated withholding on wages; corporate payments speeded; the self-employment tax paid quarterly. $1.2 billion in fiscal 1966, $4.8 billion in 1967.'
    n: 'Letter to the Chairman, House Committee on Ways and Means, Urging Prompt Action on Pending Tax Proposals, [1966 Pub. Papers 31](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=107) (Jan. 19, 1966); Annual Budget Message to the Congress, Fiscal Year 1967, [1966 Pub. Papers 47](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=123) (Jan. 24, 1966). [[w.zelizer-taxing-america]]; [[w.collins-more]]; [[w.bernstein-guns-or-butter]]. See [[cal.1966-01-12.program]]. Names: Johnson, Mills.'
    tags: [name:johnson-lyndon-b, name:mills-wilbur-d]
  - id: cal.1966-01-20.amendments
    when: Jan. 20
    date: '1966-01-20'
    thread: amendments
    also: [congress, electoral-college]
    c: 'Special message: two amendments to the Constitution. Representatives elected for four years, with the President, from 1972 at the earliest; no Member of either House eligible for the other unless he resigns 30 days before the election. The electoral college reform of 1965 asked again: unpledged electors no longer free to throw the election into the House; in a contingent election, not one vote a State; President and Vice President chosen by the same body; the District a part in it; the death of a candidate or a President-elect provided for. The joint resolution printed as H. Doc. 364.'
    n: 'Special Message to the Congress Proposing Constitutional Amendments Relating to Terms for House Members and the Electoral College System, [1966 Pub. Papers 36](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=112) (Jan. 20, 1966); H.R. Doc. No. 89-364, [112 Cong. Rec. 794](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-8-2.pdf) (1966). [[w.kyvig-explicit-and-authentic-acts]]; [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]]. See [[cal.1966-01-12.program]]; [[cal.1965-01-28.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-20.india-and-china
    when: Jan. 20
    date: '1966-01-20'
    thread: south-asia
    c: Bowles gives Indira Gandhi Johnson's invitation to Washington.
    n: '[FRUS 1964–68, XXV, doc. 285](https://history.state.gov/historicaldocuments/frus1964-68v25/d285). See [[cal.1966-01-19.india-and-china]]. Names: Bowles, Indira Gandhi, Johnson.'
    tags: [name:bowles-chester, name:gandhi-indira, name:johnson-lyndon-b]
  - id: cal.1966-01-23.opinion
    when: Jan. 23
    date: '1966-01-23'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the party one would like to see win the congressional district, by region: South, Democratic 71 percent, Republican 29; East 59 and 41; West 53 and 47; Midwest 52 and 48.'
    n: '[[w.gallup-poll]], III, 1985.'
  - id: cal.1966-01-24.economy
    when: Jan. 24
    date: '1966-01-24'
    thread: economy
    c: 'Budget for fiscal 1967. Administrative budget: expenditures $112.8 billion, up $6.4 billion; receipts $111.0 billion, $3.6 billion of the rise from the new taxes; deficit $1.8 billion. Consolidated cash budget: surplus $0.5 billion. Regular programs, Vietnam apart, up $0.6 billion. Defense $58.3 billion. New obligational authority $121.9 billion, $9.1 billion of it for Vietnam. GNP for 1966, $722 billion, plus or minus $5 billion.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1967, [1966 Pub. Papers 47](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=123) (Jan. 24, 1966). [[w.morgan-deficit-government]]; [[w.bernstein-guns-or-butter]]. See [[cal.1965-01-25.economy]].'
    tags: [name:johnson-lyndon-b, budget:1967]
  - id: cal.1966-01-24.jobs-and-wages
    when: Jan. 24
    date: '1966-01-24'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Repeal of 14(b) again. Mansfield moves to take up H.R. 77; Dirksen and his allies hold the floor, first on the Journal.
    n: 'Mansfield''s motion: [112 Cong. Rec. 1018](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-9-2.pdf#page=72). Repeal of section 14(b) (K–J Cong. II.J.2). See [[cal.1965-10-11.jobs-and-wages]]. Names: Mansfield, Dirksen.'
    tags: [name:mansfield-mike, name:dirksen-everett]
  - id: cal.1966-01-24.states-and-cities-dc
    when: Jan. 24
    date: '1966-01-24'
    thread: states-and-cities
    also: [civil-rights-organizations]
    c: Washington. A one-day boycott of D.C. Transit's buses against a fare rise from 20 cents to 25, called by Barry of SNCC's Washington office; SNCC claims 130,000 riders stayed off. Check the figures.
    n: '[DC Preservation League, "Marion Barry and the Student Nonviolent Coordinating Committee"](https://historicsites.dcpreservation.org/items/show/968). [[w.asch-chocolate-city]]; [[w.jaffe-dream-city]]. Names: Barry.'
    tags: [state:dc, city:washington, name:barry-marion-s-jr]
  - id: cal.1966-01-24.vietnam
    when: Jan. 25
    date: '1966-01-25'
    thread: vietnam
    c: 'Operation Masher begins: the 1st Cavalry Division, with ARVN and Korean troops, in Bình Định province, the Bồng Sơn plain and the An Lão valley; the Marines'' Double Eagle to the north. The largest search-and-destroy operation yet; to Mar. 6.'
    n: '[FRUS 1964–68, IV, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55) (the NSC briefed, Jan. 29). [[w.carland-united-states-army-in]]; [[w.stanton-anatomy-of-a-division]]. See [[cal.1965-11-14.vietnam]].'
    tags: [place:operation-masher, place:bong-son]
  - id: cal.1966-01-25.africa
    when: Jan. 25
    date: '1966-01-25'
    thread: africa
    c: Press stories of a CIA part in the Ben Barka kidnapping. McCloskey, after checking with the CIA, denies any American involvement.
    n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). See [[cal.1965-10-29.africa]]. Names: McCloskey, Ben Barka.'
    tags: [name:mccloskey-robert-j, name:ben-barka-mehdi]
  - id: cal.1966-01-26.cities-and-housing
    when: Jan. 26
    date: '1966-01-26'
    thread: cities-and-housing
    c: 'Cities message. A Demonstration Cities Program: qualifying cities, of every size, to rebuild whole blighted neighborhoods, with every federal program joined in a plan run by a single local authority; planning grants $12 million; supplemental grants over $2.3 billion over six years. Incentives for metropolitan planning. The plan from Wood''s task force.'
    n: 'Special Message to the Congress Recommending a Program for Cities and Metropolitan Areas, [1966 Pub. Papers 82](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=158) (Jan. 26, 1966). [[w.haar-between-the-idea-and]]; [[w.pritchett-robert-clifton-weaver-and]]; [[w.gelfand-nation-of-cities]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]. See [[cal.1966-01-13.cities-and-housing]]. Names: Wood.'
    tags: [name:johnson-lyndon-b, name:wood-robert-c]
  - id: cal.1966-01-26.open-housing
    when: Jan. 26
    date: '1966-01-26'
    thread: open-housing
    also: [king]
    c: 'King moves into a flat on South Hamlin Avenue in Lawndale, on Chicago''s West Side: the Chicago Freedom Movement, SCLC with the Coordinating Council of Community Organizations, against the slums, announced Jan. 7. Check the dates.'
    n: '[[w.ralph-northern-protest]]; [[w.anderson-confronting-the-color-line]]; [[w.cohen-american-pharaoh]]; [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-03-21.voting-rights]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:il, city:chicago]
  - id: cal.1966-01-26.opinion
    when: Jan. 26
    date: '1966-01-26'
    thread: opinion
    also: [congress, amendments]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Senators limited to two six-year terms: favor 50 percent, oppose 38.'
    n: '[[w.gallup-poll]], III, 1986.'
  - id: cal.1966-01-26.jobs-and-wages-14b
    when: Jan. 26
    date: '1966-01-26'
    thread: jobs-and-wages-14b
    also: [congress, rules]
    c: Ervin's amendment to put the day's prayer in the Journal tabled, [42–37](https://voteview.com/rollcall/RS0890265).
    n: 'See [[cal.1966-01-24.jobs-and-wages]]. Names: Ervin.'
    tags: [name:ervin-sam-j-jr]
  - id: cal.1966-01-27.economy
    when: Jan. 27
    date: '1966-01-27'
    thread: economy
    c: Economic Report. GNP up $47 billion in 1965, a record. Unemployment 4.1 percent in December, from 6.6 in December 1960. For 1966, $722 billion, plus or minus $5 billion. Production for Vietnam under 1½ percent of GNP. The guideposts to be followed; the Federal Reserve looked to for the credit a growing economy needs.
    n: 'Annual Message to the Congress: The Economic Report of the President, [1966 Pub. Papers 96](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=172) (Jan. 27, 1966). [[w.okun-political-economy-of-prosperity]]; [[w.collins-more]]. See [[cal.1965-01-28.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-27.africa
    when: Jan. 27
    date: '1966-01-27'
    thread: africa
    c: 'Nigeria. The State Department: relations with Ironsi''s military government continue.'
    n: 'Check: the Department''s statement ([[w.department-of-state-bulletin]]). See [[cal.1966-01-15.africa]]. Names: Ironsi.'
    tags: [name:ironsi-johnson-aguiyi]
  - id: cal.1966-01-28.european-community
    when: Jan. 28–29
    date: '1966-01-28'
    thread: european-community
    c: 'Luxembourg. The Six''s foreign ministers end the French boycott. Where a member''s very important interests are at stake, the Council to seek within a reasonable time a solution all can adopt; France: discussion to go on until all agree; the Six record that they differ on what follows if not. Rules for the Commission''s conduct.'
    n: '[FRUS 1964–68, XIII, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v13/d127) (Jan. 28). See [[cal.1966-01-17.european-community]].'
  - id: cal.1966-01-28.africa
    when: Jan. 28
    date: '1966-01-28'
    thread: africa
    c: 'Pompidou to Bohlen, off the record: no sign of any American intelligence service in the Ben Barka affair.'
    n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). See [[cal.1966-01-25.africa]]. Names: Pompidou, Bohlen, Ben Barka.'
    tags: [name:pompidou-georges-j-r, name:bohlen-charles-e, name:ben-barka-mehdi]
  - id: cal.1966-01-30.opinion
    when: Jan. 30
    date: '1966-01-30'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the $1.25 minimum wage: increase 66 percent, leave as is 33. The work week cut from 40 hours to 35: should 28, should not 65. Overtime at double time in place of time-and-a-half: favor 28, oppose 65. No strike to last more than seven days, a committee appointed by the Government then to decide: favor 58, oppose 29.'
    n: '[[w.gallup-poll]], III, 1986.'
  - id: cal.1966-01-31.vietnam
    when: Jan. 31–Feb. 2
    date: '1966-01-31'
    thread: vietnam
    c: 'The bombing of the North resumed after 37 days. Before it: Jan. 21, 77 House members write for more effort through the United Nations; Jan. 27, 15 Senators, Hartke the first, against resuming. Johnson''s reply, Jan. 28: guided by the resolution of Aug. 10, 1964, "by a vote of 504 to 2." Hồ Chí Minh''s letter of Jan. 24 to heads of state. NSC, Jan. 29: the peace offensive, in the notes of Rusk''s report, "no runs, no hits, no errors." Jan. 31, 10 a.m., Johnson on television: aircraft "have resumed action in North Vietnam." The same day Goldberg asks the Security Council to meet, with a resolution for a conference to apply the Geneva accords. Feb. 2, the Council puts Vietnam on its agenda, 9–2 (Check), and adjourns for private consultations.'
    n: 'Statement by the President Announcing Resumption of Air Strikes on North Vietnam, [1966 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=190) (Jan. 31, 1966); Reply to a Letter From a Group of House Members, [1966 Pub. Papers 44](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=120) (Jan. 22, 1966); Reply to a Letter From a Group of Senators, [1966 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=188) (Jan. 28, 1966). FRUS 1964–68, IV, docs. [55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55), [56](https://history.state.gov/historicaldocuments/frus1964-68v04/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v04/d57), [59](https://history.state.gov/historicaldocuments/frus1964-68v04/d59). See [[cal.1965-12-24.vietnam]]; [[cal.1966-01-03.vietnam]]. Made public, the NSC notes: FRUS 1964–68, IV (1998). Names: Johnson, Hồ Chí Minh, Rusk, Goldberg, Hartke.'
    tags: [name:johnson-lyndon-b, name:hartke-rupert-v, name:ho-chi-minh, name:rusk-dean, name:goldberg-arthur-j]
  - id: cal.1966-01-31.mississippi
    when: Jan. 31–Feb. 1
    date: '1966-01-31'
    thread: mississippi
    also: [poverty]
    c: Greenville Air Force Base. Some seventy Delta people (Check), plantation workers out of work and evicted, of the Mississippi Freedom Labor Union and the Poor People's Conference, occupy an empty barracks, asking for food, jobs and land. Air Police carry them out Feb. 1. The Delta Ministry with them.
    n: Poor People's Fund, [Emergency Appeal](https://www.crmvet.org/docs/660128_ppf_appeal.pdf); MFDP, [Situation in the Mississippi Delta](https://www.crmvet.org/docs/660210_mfdp_situation.pdf) (Feb. 10, 1966). [[w.dittmer-local-people]]; [[w.newman-divine-agitators]]. See [[cal.1965-09-17.mississippi]].
  - id: cal.1966-01-31.european-community
    when: Jan. 31
    date: '1966-01-31'
    thread: european-community
    c: 'State''s circular on the Luxembourg settlement: "extremely pleased."'
    n: The circular, as [FRUS 1964–68, XIII, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v13/d127) gives it. See [[cal.1966-01-17.european-community]].
