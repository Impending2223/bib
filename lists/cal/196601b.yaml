    c: 'Johnson with Rusk, McNamara, McGeorge Bundy and Wheeler, 6:20 to 8:20 p.m., the day of the fifteen Senators'' letter: "I don''t want to back out—and look like I''m reacting to the Fulbrights. ... We will lose a good part of the Senate"; "I thought of chucking that resolution back to them." "We don''t have anyone defending us" in the Senate; Douglas could. McNamara to see Robert Kennedy Saturday. Johnson: "If you let them run you out of your front yard, they''ll run you out of the house."'
