    c: 'Special message: two amendments to the Constitution. Representatives elected for four years, with the President, from 1972 at the earliest; no Member of either House eligible for the other unless he resigns 30 days before the election. The electoral college reform of 1965 asked again: unpledged electors no longer free to throw the election into the House; in a contingent election, not one vote a State; President and Vice President chosen by the same body; the District a part in it; the death of a candidate or a President-elect provided for. The joint resolution printed as H. Doc. 364.'
