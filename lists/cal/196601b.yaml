    c: 'Johnson with his advisers and four of the Wise Men, McCloy, Dulles, Dean and Clifford, 1:20 to 3:45 p.m.: "A year ago, by 504–2 the Congress told the President to do what was necessary in Vietnam," Johnson as Valenti noted it; the opposition now could muster perhaps 40 votes. McNamara for resuming: the people "will not long support a government which will not support, by bombing, 400,000 troops there." The Majority Leader and the Chairman of Foreign Relations "against the general policy of that resolution."'
    n: '[FRUS 1964–68, IV, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 160; [[w.preston-war-council]], 227 (Bundy: "we did not expect any serious response to the pause"); [[w.mcnamara-in-retrospect]], ch. 8 at n.34 (Clifford, Arthur Dean, Allen Dulles and McCloy for resuming the bombing and more troops). Made public: FRUS 1964–68, IV (1998). [[w.mann-grand-delusion]], 482; [[w.branch-at-canaans-edge]], 431–32 (Clifford: "We must fight the war where we are strongest ... in the air"; Humphrey: "Congress will run all over the lot"; Johnson: "not happy with Vietnam," "we cannot run out"). [[w.clifford-counsel-to-the-president-2]], 436–37 (McCloy, Dulles, Dean and Clifford, the "Wise Men" in Bundy''s record; McNamara for resuming; Clifford for resuming: "I want to get out of Vietnam"). To check: President''s Daily Diary, Jan. 28, 1966, p. 3, LBJ (cited by [[w.branch-at-canaans-edge]], 431); Jack Valenti notes, "Meeting in Cabinet Room," Jan. 28, 1966, Office of the President, Valenti Papers, Box 13, LBJ (cited by [[w.branch-at-canaans-edge]], 431). See [[cal.1966-01-27.vietnam-pause]]. Names: Johnson, McCloy, Dulles, Dean, Clifford, McNamara, Valenti, Mansfield, Fulbright.'
