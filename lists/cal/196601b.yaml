    thread: vietnam
    c: 'Rostow to Ball, acting Secretary: urgent to press Saigon to new political initiatives: "we must force the pace in Saigon of political consolidation and initiative on a wide front, at highest priority and sensitivity."'
    n: '[[w.gibbons-u-s-government-and]], IV, 231 n.53. See [[cal.1965-12-30.vietnam-2]]. Names: Rostow, Ball.'
