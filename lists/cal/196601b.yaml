    n: '[FRUS 1964–68, IV, doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v04/d40) (the advisers, 6:30 p.m.). [[w.gibbons-u-s-government-and]], IV, 144–46. To check: McGeorge Bundy''s notes (LBJ Library, Papers of McGeorge Bundy); McGeorge Bundy, notes of the meeting with the Democratic leaders, Jan. 24, 1966, McGeorge Bundy Papers, Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 145 n.92). See [[cal.1966-01-22.vietnam-pause]]. Names: Johnson, McCormack, Albert, Hale Boggs, Mansfield, Long.'
