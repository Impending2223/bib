  - id: cal.1966-01-27.economy
    when: Jan. 27
    date: '1966-01-27'
    thread: economy
    c: Economic Report. GNP up $47 billion in 1965, a record. Unemployment 4.1 percent in December, from 6.6 in December 1960. For 1966, $722 billion, plus or minus $5 billion. Production for Vietnam under 1½ percent of GNP. The guideposts to be followed; the Federal Reserve looked to for the credit a growing economy needs.
    n: 'Annual Message to the Congress: The Economic Report of the President, [1966 Pub. Papers 96](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=172) (Jan. 27, 1966). To check: [[w.okun-political-economy-of-prosperity]]; [[w.collins-more]]. See [[cal.1965-01-28.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-01-27.africa
    when: Jan. 27
    date: '1966-01-27'
    thread: africa
    c: 'Nigeria. The State Department: relations with Ironsi''s military government continue.'
    n: 'Check: the Department''s statement ([[w.department-of-state-bulletin]]). See [[cal.1966-01-15.africa]]. Names: Ironsi.'
    tags: [name:ironsi-johnson-aguiyi]
  - id: cal.1966-01-27.vietnam-pause
    when: Jan. 27
    date: '1966-01-27'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy and Wheeler, 6:20 to 8:20 p.m., the day of the fifteen Senators'' letter: "I don''t want to back out—and look like I''m reacting to the Fulbrights. ... We will lose a good part of the Senate"; "I thought of chucking that resolution back to them." "We don''t have anyone defending us" in the Senate; Douglas could. McNamara to see Robert Kennedy Saturday.'
    n: '[FRUS 1964–68, IV, doc. 50](https://history.state.gov/historicaldocuments/frus1964-68v04/d50) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 158–59. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-26.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Wheeler, Fulbright, Douglas, Robert Kennedy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:wheeler-earle, name:fulbright-j-william, name:douglas-paul-h, name:kennedy-robert-f]
  - id: cal.1966-01-27.vietnam-congress
    when: Jan. 27
    date: '1966-01-27'
    thread: vietnam-congress
    c: 'McCarthy''s first speech on the war, the day of the Senators'' letter: a national debate; a "moral commitment" asked to purposes "we do not clearly understand"; the bombing''s success not shown. That evening McCarthy, McGovern, Burdick and Hartke at Harriman''s house for a drink: their fear that the Chiefs and the Armed Services hawks will push the bombing to a clash with China. Harriman to McGeorge Bundy, Feb. 4: McCarthy might be brought to lead in support of the President.'
    n: '[112 Cong. Rec., Senate, Jan. 27, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-12-1.pdf), 1234. [[w.gibbons-u-s-government-and]], IV, 156 n.129, 158 n.133. McCarthy''s account: [[w.mccarthy-year-of-the-people]], 23–27 (To check). Check: the day of the drink, "that same afternoon" the letter went. To check: Harriman to McGeorge Bundy, Feb. 4, 1966 (Library of Congress, Harriman Papers). Names: McCarthy, McGovern, Burdick, Hartke, Harriman, McGeorge Bundy.'
    tags: [name:mccarthy-eugene-j, name:mcgovern-george, name:burdick-quentin-n, name:hartke-rupert-v, name:harriman-w-averell, name:bundy-mcgeorge]
  - id: cal.1966-01-28.european-community
    when: Jan. 28–29
    date: '1966-01-28'
    thread: european-community
    c: 'Luxembourg. The Six''s foreign ministers end the French boycott. Where a member''s very important interests are at stake, the Council to seek within a reasonable time a solution all can adopt; France: discussion to go on until all agree; the Six record that they differ on what follows if not. Rules for the Commission''s conduct.'
    n: '[FRUS 1964–68, XIII, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v13/d127) (Jan. 28). See [[cal.1966-01-17.european-community]].'
  - id: cal.1966-01-28.africa
    when: Jan. 28
    date: '1966-01-28'
    thread: africa
    c: 'Pompidou to Bohlen, off the record: no sign of any American intelligence service in the Ben Barka affair.'
    n: 'FRUS 1964–68, XXIV, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v24/d121) (editorial note). See [[cal.1966-01-25.africa]]. Names: Pompidou, Bohlen, Ben Barka.'
    tags: [name:pompidou-georges-j-r, name:bohlen-charles-e, name:ben-barka-mehdi]
  - id: cal.1966-01-28.vietnam-pause
    when: Jan. 28
    date: '1966-01-28'
    thread: vietnam-pause
    c: 'Johnson with his advisers and four of the Wise Men, McCloy, Dulles, Dean and Clifford, 1:20 to 3:45 p.m.: "A year ago, by 504–2 the Congress told the President to do what was necessary in Vietnam," Johnson as Valenti noted it; the opposition now could muster perhaps 40 votes. McNamara for resuming: the people "will not long support a government which will not support, by bombing, 400,000 troops there."'
    n: '[FRUS 1964–68, IV, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 160. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-27.vietnam-pause]]. Names: Johnson, McCloy, Dulles, Dean, Clifford, McNamara, Valenti.'
    tags: [name:johnson-lyndon-b, name:mccloy-john-j, name:dulles-allen-w, name:dean-arthur-h, name:clifford-clark, name:mcnamara-robert-s, name:valenti-jack]
  - id: cal.1966-01-28.vietnam
    when: Jan. 28
    date: '1966-01-28'
    thread: vietnam
    also: [vietnam-congress]
    c: 'Manatos to Johnson: Mansfield says the fifteen Senators avoided him and he told them it was not the proper approach; Johnson''s reply "perfectly proper"; drop the matter.'
    n: '[[w.gibbons-u-s-government-and]], IV, 157 n.131. To check: Manatos to Johnson, Jan. 28, 1966, as cited by Lewis, "President Johnson Surveys the Congress," 41. See [[cal.1966-01-31.vietnam]]. Names: Manatos, Mansfield, Johnson.'
    tags: [name:manatos-mike-n, name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1966-01-28.vietnam-congress
    when: Jan. 28
    date: '1966-01-28'
    thread: vietnam-congress
    c: 'Rusk before Foreign Relations in open session on the $415 million of supplemental aid, State having pressed for a closed one: "battered by questions" on the war. Fulbright: never so much apprehension over a military involvement; should Congress not give "its further approval of this changed situation?" Rusk: "I will have to take it under advisement." The commitment, Rusk says, rests on SEATO; Church doubts that intervention against every revolution is wise.'
    n: 'Daily Digest, [112 Cong. Rec. D26](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=24). [[w.gibbons-u-s-government-and]], IV, 222, 224–26 (MacArthur''s call to Marcy against an open session). To check: Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam: Hearings*, 89th Cong., 2d Sess., 2, 50–51, 61, 73–75 (1966). Names: Rusk, Fulbright, Church, MacArthur, Marcy.'
    tags: [name:rusk-dean, name:fulbright-j-william, name:church-frank, name:macarthur-douglas-ii, name:marcy-carl]
  - id: cal.1966-01-29.vietnam-congress
    when: Jan. 29
    date: '1966-01-29'
    thread: vietnam-congress
    c: Saturday. Senators not on the Foreign Relations Committee meet Fulbright to urge public hearings on the war.
    n: '[[w.gibbons-u-s-government-and]], IV, 223. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1966-01-30.opinion
    when: Jan. 30
    date: '1966-01-30'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the $1.25 minimum wage: increase 66 percent, leave as is 33. The work week cut from 40 hours to 35: should 28, should not 65. Overtime at double time in place of time-and-a-half: favor 28, oppose 65. No strike to last more than seven days, a committee appointed by the Government then to decide: favor 58, oppose 29.'
    n: '[[w.gallup-poll]], III, 1986.'
  - id: cal.1966-01-30.vietnam
    when: Jan. 30
    date: '1966-01-30'
    thread: vietnam
    c: 'Ball at Northwestern University, the State Department''s statement of the American case: to recognize the NLF "would do violence to the truth." Johnson, on the draft, Jan. 28: "Do we want to here refuse NLF?" The passage stands. Morse: "a dove in hawk''s feathers, unless he is a pigeon."'
    n: '*Washington Post*, Feb. 6, 1966 (the text). [112 Cong. Rec., Senate, Feb. 2, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-5-2.pdf), 2067 (Morse; Check the day). [[w.gibbons-u-s-government-and]], IV, 163–64. To check: The draft with Johnson''s note (LBJ Library, NSF Country File, Vietnam). Names: Ball, Johnson, Morse.'
    tags: [name:ball-george-w, name:johnson-lyndon-b, name:morse-wayne]
  - id: cal.1966-01-31.vietnam
    when: Jan. 31–Feb. 2
    date: '1966-01-31'
    thread: vietnam
    c: 'The bombing of the North resumed after 37 days. Before it: Jan. 21, 77 House members write for more effort through the United Nations; Jan. 27, 15 Senators, Hartke the first, against resuming. Johnson''s reply, Jan. 28: guided by the resolution of Aug. 10, 1964, "by a vote of 504 to 2." Hồ Chí Minh''s letter of Jan. 24 to heads of state. NSC, Jan. 29: the peace offensive, in the notes of Rusk''s report, "no runs, no hits, no errors." Jan. 31, 10 a.m., Johnson on television: aircraft "have resumed action in North Vietnam." The same day Goldberg asks the Security Council to meet, with a resolution for a conference to apply the Geneva accords. Feb. 2, the Council puts Vietnam on its agenda, 9–2 (Check), and adjourns for private consultations.'
    n: 'Statement by the President Announcing Resumption of Air Strikes on North Vietnam, [1966 Pub. Papers 114](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=190) (Jan. 31, 1966); Reply to a Letter From a Group of House Members, [1966 Pub. Papers 44](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=120) (Jan. 22, 1966); Reply to a Letter From a Group of Senators, [1966 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=188) (Jan. 28, 1966). FRUS 1964–68, IV, docs. [55](https://history.state.gov/historicaldocuments/frus1964-68v04/d55), [56](https://history.state.gov/historicaldocuments/frus1964-68v04/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v04/d57), [59](https://history.state.gov/historicaldocuments/frus1964-68v04/d59). [[w.gibbons-u-s-government-and]], IV, 155–58 (the Senators'' letter and the reply), 140 (the House members'' letter), 163–64 (the NSC; the resumption). See [[cal.1965-12-24.vietnam]]; [[cal.1966-01-03.vietnam]]. Made public, the NSC notes: FRUS 1964–68, IV (1998). Gibbons dates the NSC meeting Sunday, Jan. 30, the notes'' date of Jan. 29 an error (IV, 163 n.146); FRUS''s editors take its time, 1:20–2:30 p.m., Jan. 29, from the Daily Diary (doc. 55 n. 1). Names: Johnson, Hồ Chí Minh, Rusk, Goldberg, Hartke.'
    tags: [name:johnson-lyndon-b, name:hartke-rupert-v, name:ho-chi-minh, name:rusk-dean, name:goldberg-arthur-j]
  - id: cal.1966-01-31.mississippi
    when: Jan. 31–Feb. 1
    date: '1966-01-31'
    thread: mississippi
    also: [poverty]
    c: Greenville Air Force Base. Some seventy Delta people (Check), plantation workers out of work and evicted, of the Mississippi Freedom Labor Union and the Poor People's Conference, occupy an empty barracks, asking for food, jobs and land. Air Police carry them out Feb. 1. The Delta Ministry with them.
    n: 'Poor People''s Fund, [Emergency Appeal](https://www.crmvet.org/docs/660128_ppf_appeal.pdf); MFDP, [Situation in the Mississippi Delta](https://www.crmvet.org/docs/660210_mfdp_situation.pdf) (Feb. 10, 1966). [[w.dittmer-local-people]], 366–68. To check: [[w.newman-divine-agitators]]. See [[cal.1965-09-17.mississippi]]. Check: Dittmer, 366–67, gives about forty poor people and ten civil rights workers at 6:30 a.m., some fifteen more at noon, almost 100 by evening, and some 150 air policemen Feb. 1.'
  - id: cal.1966-01-31.european-community
    when: Jan. 31
    date: '1966-01-31'
    thread: european-community
    c: 'State''s circular on the Luxembourg settlement: "extremely pleased."'
    n: The circular, as [FRUS 1964–68, XIII, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v13/d127) gives it. See [[cal.1966-01-17.european-community]].
  - id: cal.1966-01-31.robert-kennedy
    when: Jan. 31
    date: '1966-01-31'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy in the Senate on the bombing''s resumption: "if we regard bombing as the answer in Vietnam—we are headed straight for disaster." The danger, the first of a series of steps "on a road from which there is no turning back."'
    n: '[112 Cong. Rec. 1602–03 (1966)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-2.pdf#page=28). [[w.schlesinger-robert-kennedy-and-his]], 734–35; [[w.gibbons-u-s-government-and]], IV, 160. See [[cal.1966-01-31.vietnam]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1966-01-31.vietnam-congress
    when: Jan. 31
    date: '1966-01-31'
    thread: vietnam-congress
    c: 'Congress on the resumption. Aiken: "we have passed the point of no return"; taxes, "universal conscription," controls to come; his vote of Aug. 1964 never a grant "to wage war at will"; he will support the President. Morse and Cotton welcome the turn to the UN. Dirksen speaks for the decision. Laird, in the House: shifts of policy, no progress with 200,000 men, the Mansfield report a "stinging indictment"; he and Ford ask a debate, perhaps a new resolution.'
    n: '[112 Cong. Rec., Senate, Jan. 31, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-2.pdf); [House](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-1.pdf), 1564–66 (Laird). Gibbons cites "1553 ff." for the comments (Check the pages). [[w.gibbons-u-s-government-and]], IV, 165–67. See [[cal.1966-01-31.vietnam]]. Names: Aiken, Morse, Cotton, Dirksen, Laird, Ford, Mansfield.'
    tags: [name:aiken-george-d, name:morse-wayne, name:cotton-norris-h, name:dirksen-everett, name:laird-melvin-r, name:ford-gerald-r, name:mansfield-mike]
