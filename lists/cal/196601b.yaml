  - id: cal.1966-01-10.vietnam-pause
    when: Jan. 10
    date: '1966-01-10'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor and Helms, 1:10 to 2:10 p.m.: resuming the bombing in a few days, or after Tet; Wheeler, "Every day makes a difference." Briefing Congress: Johnson would rather Rusk and McNamara appear "at as many hearings as possible"; Rusk proposes a luncheon for the leaders and the senior committee members, and Johnson agrees.'
    n: '[FRUS 1964–68, IV, doc. 14](https://history.state.gov/historicaldocuments/frus1964-68v04/d14) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135; [[w.drea-mcnamara-clifford-and-the-2011]], 68 (Wheeler disputes McNamara: a few more days do matter. The Chiefs had asked resumption within 48 hours of the Soviet visitor''s departure from Hanoi, Jan. 12). Made public: FRUS 1964–68, IV (1998). [[w.preston-war-council]], 229 (Bundy: to publicize the Communists'' use of the pause, to "clear the way for bombing resumption"). See [[cal.1966-01-03.vietnam-pause]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor, Helms.'
    src:
