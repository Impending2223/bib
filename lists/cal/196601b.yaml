    tags: [name:fulbright-j-william, name:hickenlooper-bourke-b, name:ball-george-w, name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1966-01-13.vietnam
    when: Jan. 13
    date: '1966-01-13'
    thread: vietnam
    c: 'Lodge to Johnson, Saigon 2514: the public will not bear a "hot war" of heavy casualties year in and year out, so the military side must "have its back broken within the year 1966": "extremely drastic action against everything that pertains to North Viet-Nam," pacification going on for years.'
    n: '[FRUS 1964–68, IV, doc. 20](https://history.state.gov/historicaldocuments/frus1964-68v04/d20). [[w.gibbons-u-s-government-and]], IV, 134. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-05.vietnam]]. Names: Lodge, Johnson.'
