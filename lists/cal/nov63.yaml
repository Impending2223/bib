# Cal. XXXVII November 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVII
entries:
  - id: cal.1963-11-01.vietnam
    when: Nov. 1–2
    date: '1963-11-01'
    thread: vietnam
    c: Coup in Saigon. The generals under Duong Van Minh and Tran Van Don take the city; Conein at their headquarters. Diem telephones Lodge, 4:30 p.m.; Lodge fears for his safety. Diem and Nhu leave the palace, are taken at a Cholon church the next morning, and are killed in an armored car.
    n: 'FRUS 1961–63, IV, docs. [234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234), [249](https://history.state.gov/historicaldocuments/frus1961-63v04/d249), [259](https://history.state.gov/historicaldocuments/frus1961-63v04/d259), [273](https://history.state.gov/historicaldocuments/frus1961-63v04/d273). Kennedy, Oval Office recordings on Vietnam (Viet. II.J). S. Rep. No. 94-465; *The Pentagon Papers* (K–J Adm. II.H.3). Ahern, *CIA and the House of Ngo* (Viet. II.I.3). Hammer, *A Death in November*; Prados, *JFK and the Diem Coup* (Viet. II.B.12). Winters, *The Year of the Hare*; Jones, *Death of a Generation*; Kaiser, *American Tragedy* (Viet. II.B.8). Kahin, *Intervention*; Jacobs, *Cold War Mandarin*; Moyar, *Triumph Forsaken*; Miller, *Misalliance* (Viet. II.B.7). Hoang Ngoc Thanh & Than Thi Nhan Duc, *Những ngày cuối cùng của Tổng thống Ngô Đình Diệm*; Ton That Dinh, *20 năm binh nghiệp*; Shaw, *The Lost Mandate of Heaven*; Ahern, *The CIA and the Generals* (Viet. II.E.5). Tran Van Don, *Our Endless War*; Tran Van Don, *Việt Nam nhân chứng*; Do Mau, *Việt Nam: Máu Lửa Quê Hương Tôi*; *Nhật Ký Đỗ Thọ*; Cao The Dung & Luong Khai Minh, *Làm Thế Nào Để Giết Một Tổng Thống* (Viet. II.H.3). Blair, *Lodge in Vietnam*; Nichter, *The Last Brahmin*; Nolting, *From Trust to Tragedy*; Colby, *Lost Victory* (Viet. II.H.1). Gnoinska, *Poland and Vietnam, 1963* (Viet. II.F.16). Maneli, *War of the Vanquished* (Viet. II.H.4). Asselin, *Hanoi''s Road to the Vietnam War* (Viet. II.E.1). See [[cal.1963-05-08.vietnam]]. Names: Duong Van Minh, Tran Van Don, Diem, Nhu (Viet. III.G); Conein, Lodge (Viet. III.C).'
    tags: [name:duong-van-minh, name:tran-van-don, name:conein-lucien, name:ngo-dinh-diem, name:lodge-henry-cabot, name:ngo-dinh-nhu]
  - id: cal.1963-11-05.states-and-cities
    when: Nov. 5
    date: '1963-11-05'
    thread: states-and-cities
    c: 'Off-year elections. Kentucky: Breathitt (D) governor over Nunn, 50.7 percent. Mississippi: Paul Johnson (D) over Phillips, the first Republican nominee for governor since 1947. Philadelphia: Tate (D) elected mayor by nine points; Kennedy spoke for him Oct. 30. San Francisco: Representative Shelley (D) mayor. Boston: Collins re-elected.'
    n: '[Remarks in Philadelphia at a Dinner Sponsored by the Democratic County Executive Committee](https://www.presidency.ucsb.edu/documents/remarks-philadelphia-dinner-sponsored-the-democratic-county-executive-committee) (Oct. 30, 1963). Bass & De Vries, *The Transformation of Southern Politics*; Pearce, *Divide and Dissent* (K–J Cong. II.H). Names: Paul Johnson (K–J Cong. III.F); Phillips (Opp. III.I); Breathitt, Nunn, Tate, Collins (K–J Cong. III.K).'
    tags: [name:breathitt-edward-t, name:nunn-louie-b, name:johnson-paul-b-jr, name:phillips-rubel, name:tate-james-h-j, name:shelley-john-f, name:collins-john-f, name:kennedy-john-f]
  - id: cal.1963-11-05.specials
    when: Nov. 5
    date: '1963-11-05'
    thread: specials
    c: Pennsylvania 23rd, special. Albert Johnson (R) holds Gavin's seat, 58.4 to 41.6 over Hagerty (D). Swing 0.7 to D.
    n: 'Votes: CQ Guide 6th (2010) 1271. See [[cal.1961-04-04.states-and-cities]]. Names: Hagerty (K–J Cong. III.K).'
    tags: [special:1963-11-05-h-PA-23, name:johnson-albert-w, name:gavin-leon-h, name:hagerty-william-t]
  - id: cal.1963-11-07.elections-1964
    when: Nov. 7
    date: '1963-11-07'
    thread: elections-1964
    c: Rockefeller announces for the Republican nomination, at Albany.
    n: 'Kramer & Roberts, *"I Never Wanted to Be Vice-President of Anything!"*; Persico, *The Imperial Rockefeller*; Smith, *On His Own Terms* (Opp. II.C). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H).'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-11-15.foreign-aid
    when: Nov. 15
    date: '1963-11-15'
    thread: foreign-aid
    c: Senate passes the foreign aid authorization, [63–17](https://voteview.com/rollcall/RS0880190), after the Mansfield–Dirksen cut of $460 million, [89–0](https://voteview.com/rollcall/RS0880168). Mundt withdraws his amendment against credit for grain sales to Communist countries, for a bill of his own.
    n: '[109 Cong. Rec., Senate, Nov. 15, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt16/pdf/GPO-CRECB-1963-pt16-10-1.pdf). Johnson, *Congress and the Cold War* (K–J Cong. II.D). See [[cal.1963-04-02.foreign-aid]]; [[cal.1963-08-23.foreign-aid]]; [[cal.1963-10-09.trade]]. Names: Mansfield, Dirksen (K–J Cong. III.A); Mundt (Opp. III.B).'
    tags: [name:mansfield-mike, name:dirksen-everett, name:mundt-karl-e]
  - id: cal.1963-11-20.vietnam
    when: Nov. 20
    date: '1963-11-20'
    thread: vietnam
    c: Honolulu. Rusk, McNamara, Bundy, and Taylor with Lodge and Harkins. Lodge hopeful of the generals; aid to resume.
    n: '[FRUS 1961–63, IV, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v04/d321). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War* (K–J Adm. II.D). *The Pentagon Papers* (K–J Adm. II.H.3). See [[cal.1963-11-01.vietnam]]. Names: Rusk, Bundy (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F); Lodge (Viet. III.C); Harkins (Viet. III.D).'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:taylor-maxwell, name:lodge-henry-cabot, name:harkins-paul-d]
  - id: cal.1963-11-22.assassination
    when: Nov. 22
    date: '1963-11-22'
    thread: assassination
    c: Dallas. Kennedy shot in Dealey Plaza at 12:30 p.m., riding with his wife and Governor Connally, who is wounded. Dead at Parkland Hospital, 1 p.m. Oswald, an employee of the Texas School Book Depository, kills Officer Tippit and is taken in the Texas Theatre.
    n: '[Remarks Prepared for Delivery at the Trade Mart in Dallas](https://www.presidency.ucsb.edu/documents/remarks-prepared-for-delivery-the-trade-mart-dallas) (Nov. 22, 1963). *Report of the President''s Commission on the Assassination of President Kennedy*; S. Rep. No. 94-755; H.R. Rep. No. 95-1828; Assassination Records Review Board, *Final Report* (K–J Adm. II.H.3). White, *For President Kennedy: An Epilogue*; Manchester, *The Death of a President*; Bugliosi, *Reclaiming History*; Shenon, *A Cruel and Shocking Act* (K–J Adm. II.F). O''Donnell & Powers, *"Johnny, We Hardly Knew Ye"* (K–J Adm. II.G.2). Minutaglio & Davis, *Dallas 1963*; Miller, *Nut Country* (Opp. II.B). National Archives: JFK Assassination Records Collection (K–J Adm. II.K). Names: Jacqueline Kennedy (K–J Adm. III.A); Connally (K–J Cong. III.F); Oswald, Tippit (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:kennedy-jacqueline, name:connally-john, name:oswald-lee-harvey, name:tippit-j-d]
  - id: cal.1963-11-22.succession
    when: Nov. 22
    date: '1963-11-22'
    thread: succession
    c: 'Johnson sworn in aboard Air Force One at Love Field, 2:38 p.m., by Judge Sarah Hughes, Mrs. Kennedy beside him. At Andrews: "I will do my best. That is all I can do."'
    n: '[Remarks Upon Arrival at Andrews Air Force Base](https://www.presidency.ucsb.edu/documents/remarks-upon-arrival-andrews-air-force-base-0) (Nov. 22, 1963). Dallek, *Flawed Giant*; Shesol, *Mutual Contempt* (K–J Adm. II.A). Manchester, *The Death of a President*; Holland, *The Kennedy Assassination Tapes*; Gillon, *The Kennedy Assassination—24 Hours After*; Caro, *The Passage of Power* (K–J Adm. II.F). Lady Bird Johnson, *A White House Diary*; Johnson, *The Vantage Point*; Valenti, *A Very Human President* (K–J Adm. II.G.3). *Taking Charge*; *The Presidential Recordings: Lyndon B. Johnson* (K–J Adm. II.J). Names: Johnson (K–J Adm. III.D); Jacqueline Kennedy (K–J Adm. III.A); Hughes (K–J Cong. III.K).'
    tags: [executive:1963-11-22, name:johnson-lyndon-b, name:kennedy-jacqueline, name:hughes-sarah-t]
  - id: cal.1963-11-22.baker
    when: Nov. 22
    date: '1963-11-22'
    thread: baker
    c: 'Don Reynolds, a Maryland insurance agent, before the Rules Committee''s staff in closed session: a stereo set for Johnson, and advertising bought on Johnson''s Austin television station, after he sold Johnson life insurance. Interrupted by the news from Dallas. Check.'
    n: 'See [[cal.1963-10-07.baker]]. Names: Reynolds (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:reynolds-don-b, name:johnson-lyndon-b]
  - id: cal.1963-11-24.assassination
    when: Nov. 24
    date: '1963-11-24'
    thread: assassination
    c: Ruby, a Dallas nightclub owner, shoots Oswald in the basement of police headquarters, 11:21 a.m., before live television; Oswald dead at Parkland, 1:07 p.m. Kennedy lies in state in the Capitol Rotunda.
    n: 'See [[cal.1963-11-22.assassination]]. Names: Ruby, Oswald (K–J Cong. III.K).'
    tags: [name:ruby-jack, name:oswald-lee-harvey, name:kennedy-john-f]
  - id: cal.1963-11-24.vietnam
    when: Nov. 24
    date: '1963-11-24'
    thread: vietnam
    also: [succession]
    c: Johnson's first meeting on Vietnam, with Lodge, Rusk, McNamara, Ball, Bundy, and McCone. Lodge hopeful; McCone less so. Johnson "not at all sure" the coup was right; Lodge in charge, no more division.
    n: '[FRUS 1961–63, IV, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v04/d330). Johnson, *The Vantage Point* (K–J Adm. II.G.3). VanDeMark, *Into the Quagmire*; Logevall, *Choosing War*; McMaster, *Dereliction of Duty* (K–J Adm. II.D). Dallek, *Flawed Giant* (Viet. II.H.1). See [[cal.1963-11-01.vietnam]]. Names: Johnson (K–J Adm. III.D); Lodge (Viet. III.C); Rusk, Ball, Bundy (K–J Adm. III.E); McNamara (K–J Adm. III.F); McCone (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:mccone-john-a]
  - id: cal.1963-11-25.assassination
    when: Nov. 25
    date: '1963-11-25'
    thread: assassination
    c: Funeral. Requiem mass at St. Matthew's; burial at Arlington. De Gaulle, Erhard, Haile Selassie, and Mikoyan among the mourners. A national day of mourning by proclamation. Johnson receives the governors.
    n: '[Proclamation 3561—National Day of Mourning for President Kennedy](https://www.presidency.ucsb.edu/documents/proclamation-3561-national-day-mourning-for-president-kennedy) (Nov. 23, 1963); [Remarks to State Governors After President Kennedy''s Funeral](https://www.presidency.ucsb.edu/documents/remarks-state-governors-after-president-kennedys-funeral) (Nov. 25, 1963). Zelizer, *Covering the Body* (K–J Adm. II.F). See [[cal.1963-11-22.assassination]]. Names: de Gaulle, Mikoyan (K–J Adm. III.J); Johnson (K–J Adm. III.D).'
    tags: [name:kennedy-john-f, name:de-gaulle-charles, name:erhard-ludwig, name:haile-selassie-i, name:mikoyan-anastas, name:johnson-lyndon-b]
  - id: cal.1963-11-26.vietnam
    when: Nov. 26
    date: '1963-11-26'
    thread: vietnam
    also: [succession]
    c: NSAM 273. The withdrawal objectives of Oct. 2 stand. The new government to be helped; no public criticism of one agency by another. Plans asked for stepped-up action against the North and for operations up to 50 kilometers into Laos.
    n: '[NSAM No. 273](https://history.state.gov/historicaldocuments/frus1961-63v04/d331) (Nov. 26, 1963) (K–J Adm. II.H.2). Newman, *JFK and Vietnam*; Moïse, *JFK and the Myth of Withdrawal*; Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War*; McMaster, *Dereliction of Duty* (K–J Adm. II.D). See [[cal.1963-11-01.vietnam]]. Names: Johnson (K–J Adm. III.D); Bundy (K–J Adm. III.E).'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge]
  - id: cal.1963-11-26.trade
    when: Nov. 26
    date: '1963-11-26'
    thread: trade
    also: [succession]
    c: Senate tables Mundt's bill to bar government guarantees of credit for sales to Communist countries, [57–35](https://voteview.com/rollcall/RS0880203). Johnson's first test in the Senate. Check.
    n: '[109 Cong. Rec., Senate, Nov. 26, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt17/pdf/GPO-CRECB-1963-pt17-7-1.pdf). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1963-10-09.trade]]. Names: Mundt (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [name:mundt-karl-e, name:johnson-lyndon-b]
  - id: cal.1963-11-27.succession
    when: Nov. 27
    date: '1963-11-27'
    thread: succession
    also: [civil-rights-bill, economy]
    c: 'Address to a joint session: "let us continue." The civil rights bill first, then the tax bill.'
    n: '[Address Before a Joint Session of the Congress](https://www.presidency.ucsb.edu/documents/address-before-joint-session-the-congress-0) (Nov. 27, 1963). Recording (K–J Adm. II.I). Caro, *The Passage of Power* (K–J Adm. II.F). Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). See [[cal.1963-11-22.succession]]; [[cal.1963-06-11.civil-rights-bill]]; [[cal.1963-01-24.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-11-29.assassination
    when: Nov. 29
    date: '1963-11-29'
    thread: assassination
    c: 'E.O. 11130: a commission to report on the assassination. Warren chairman; Senators Russell and Cooper, Representatives Boggs and Ford, Dulles, McCloy. Dec. 13, a joint resolution gives it subpoena power.'
    n: '[Exec. Order No. 11,130](https://www.presidency.ucsb.edu/documents/executive-order-11130-appointing-commission-report-upon-the-assassination-president-john-f) (K–J Adm. II.H.2); [White House Statement on the Appointment of a Special Commission To Investigate the Assassination of President Kennedy](https://www.presidency.ucsb.edu/documents/white-house-statement-the-appointment-special-commission-investigate-the-assassination) (Nov. 29, 1963); [Pub. L. No. 88-202, 77 Stat. 362](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg362.pdf) (1963). *Report of the President''s Commission on the Assassination of President Kennedy*; S. Rep. No. 94-755 (K–J Adm. II.H.3). Epstein, *Inquest*; Holland, *The Kennedy Assassination Tapes*; McKnight, *Breach of Trust*; Willens, *History Will Prove Us Right*; Shenon, *A Cruel and Shocking Act* (K–J Adm. II.F). See [[cal.1963-11-22.assassination]]. Names: Warren (K–J Cong. III.G); Russell (K–J Cong. III.B); Cooper (Opp. III.B); Boggs, Ford (K–J Cong. III.C); Dulles (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:warren-earl, name:russell-richard-b, name:cooper-john-sherman, name:boggs-hale, name:ford-gerald-r, name:dulles-allen-w, name:mccloy-john-j]
  - id: cal.1963-11-29.space
    when: Nov. 29
    date: '1963-11-29'
    thread: space
    c: E.O. 11129 names the launch facilities at Cape Canaveral the John F. Kennedy Space Center. The cape itself renamed Cape Kennedy, announced Nov. 28.
    n: '[Executive Order 11129—Designating Facilities in Florida as the John F. Kennedy Space Center](https://www.presidency.ucsb.edu/documents/executive-order-11129-designating-facilities-florida-the-john-f-kennedy-space-center) (Nov. 29, 1963); [The President''s Thanksgiving Day Address to the Nation](https://www.presidency.ucsb.edu/documents/the-presidents-thanksgiving-day-address-the-nation) (Nov. 28, 1963). See [[cal.1961-04-12.space]].'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
