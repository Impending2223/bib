entries:
  - id: cal.1963-11-01.vietnam
    when: Nov. 1–2
    date: '1963-11-01'
    thread: vietnam
    c: Coup in Saigon. The generals under Dương Văn Minh and Trần Văn Đôn take the city; Conein at their headquarters. Diệm telephones Lodge, 4:30 p.m.; Lodge fears for his safety. Diệm and Nhu leave the palace, are taken at a Cholon church the next morning, and are killed in an armored car.
    n: 'FRUS 1961–63, IV, docs. [234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234), [249](https://history.state.gov/historicaldocuments/frus1961-63v04/d249), [259](https://history.state.gov/historicaldocuments/frus1961-63v04/d259), [273](https://history.state.gov/historicaldocuments/frus1961-63v04/d273). Kennedy, Oval Office recordings on Vietnam (Viet. II.J). [S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf) (1975); [[w.pentagon-papers]] (K–J Adm. II.H.3). [[w.ahern-cia-and-the-house-2000]]; [[w.hammer-death-in-november]]; [[w.prados-jfk-and-the-diem]]; [[w.winters-year-of-the-hare]]; [[w.jones-death-of-a-generation]]; [[w.kaiser-american-tragedy]]; [[w.kahin-intervention]]; [[w.jacobs-cold-war-mandarin]]; [[w.moyar-triumph-forsaken]]; [[w.miller-misalliance]]; [[w.thanh-nhung-ngay-cuoi-cung]]; [[w.dinh-20-nam-binh-nghiep]]; [[w.shaw-lost-mandate-of-heaven-2015]]; [[w.ahern-cia-and-the-generals]]; [[w.don-our-endless-war]]; [[w.don-viet-nam-nhan-chung]]; [[w.mau-viet-nam]]; [[w.tho-nhat-ky-do-tho]]; [[w.dung-lam-the-nao-de]]; [[w.blair-lodge-in-vietnam]]; [[w.nichter-last-brahmin]]; [[w.nolting-from-trust-to-tragedy]]; [[w.colby-lost-victory]]; [[w.gnoinska-poland-and-vietnam-1963]]; [[w.maneli-war-of-the-vanquished]]; [[w.asselin-hanois-road-to-the]]; [[w.gibbons-u-s-government-and]], II, 199–202. See [[cal.1963-05-08.vietnam]]. Names: Dương Văn Minh, Trần Văn Đôn, Ngô Đình Diệm, Ngô Đình Nhu, Conein, Lodge.'
    tags: [name:duong-van-minh, name:tran-van-don, name:conein-lucien, name:ngo-dinh-diem, name:lodge-henry-cabot, name:ngo-dinh-nhu, place:saigon, place:cholon]
