    date: '1960-03-06'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi drafts for the Center the comment on the question of urban people''s communes: they are organized around workers'' families and other laboring people, with production at the center and collective welfare and services; the many in better-off families with doubts are not to be mobilized; the Center''s attitude to trials and spread is active, trials in the first half of the year, general spread in the second. Mao reads and approves it Mar. 8 and it issues as a Center document Mar. 9.'
