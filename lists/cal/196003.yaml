  - id: cal.1960-03-09.china-leadership-9
    when: Mar. 9
    date: '1960-03-09'
    thread: china-leadership
    c: 'The Center 中共中央 issues its directive on the question of urban people''s communes 關於城市人民公社問題的指示: an active attitude is to be taken to organizing, trying and spreading them. It sends with it two reports, the party group of the All-China Federation of Trade Unions 全國總工會黨組 on the Xiangfang 香坊 people''s commune of Harbin 哈爾濱 and the Henan 河南 provincial committee''s on consolidating and developing the urban communes. Each province is to send a secretary with a few cadres to Harbin, Tianjin 天津 and Zhengzhou 鄭州 to see and learn.'
    n: '[[w.yang-jisheng-mubei]], II, 732; [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 59–79 (the comment of Mar. 9, 1960, in full, with the ACFTU Party group''s covering report of Feb. 23 and its urban commune group''s study of Xiangfang 香坊, Harbin 哈尔滨, dated Feb. 22, 61; the Hebei and Heilongjiang reports already issued at the Shanghai conference; the Henan report not printed, n.1; printed from the Center''s document). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 59–79). To check: Henan Provincial Committee 河南省委, "Guanyu chengshi renmin gongshe gonggu he fazhan qingkuang de baogao" 《關於城市人民公社鞏固和發展情況的報告》, Feb. 28, 1960 (named by [[w.yang-jisheng-mubei]], II, 732; the report''s day as [[w.jianguo-yilai-mao-zedong]], XV, 70 n.2, gives it). See [[cal.1960-03-08.china-leadership]].'
