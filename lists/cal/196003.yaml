    c: 'Tianjin, the meeting''s evening session; Deng Xiaoping reports the morning''s talks on the seventeen questions. Mao: "dare to think, speak, act" not without limit; grain everywhere has wrecked forestry and fishing; steel short, so small plants: neither the center nor the provinces to "reach into" the other''s pocket.'
