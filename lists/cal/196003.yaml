  - id: cal.1960-03.economy
    when: Mar.
    date: 1960-03
    thread: economy
    c: Arthur F. Burns warns Nixon of a dip before the election, its low in October, unless credit is eased and defense spending raised soon. Nixon takes it to the cabinet. No action.
    n: '[[w.stein-fiscal-revolution-in-america]], 366–67, 370 (the warning, the Cabinet, the low in October; Stein has spending and tax reduction urged, not credit). [[w.kallina-kennedy-v-nixon]], 89–90 (the warning; Nixon for Burns''s remedy, the administration against). [[w.nixon-six-crises]], 309–10 (early March, Burns to Nixon in his Capitol office; Nixon to the President, who puts it before the Cabinet; no action). Made public: Nixon, *Six Crises* (1962). To check: [[w.morgan-eisenhower-versus-the-spenders]]. Check: Stein, 366, has Burns come to his view in February 1960. Names: Burns, Nixon.'
    src:
      c: d3d57471
      rows:
        - 'w.kallina-kennedy-v-nixon 89–90: A, C'
        - 'w.stein-fiscal-revolution-in-america 366: A'
