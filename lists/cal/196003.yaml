  - id: cal.1960-03-23.china-leadership-3
    when: Mar. 23
    date: '1960-03-23'
    thread: china-leadership
    c: 'The Center''s circular, drafted by Mao, forwarding Shandong''s bulletin no. 2 to the county committees: Shandong''s problems are surely in every province, differing little; in some counties and communes the Zhengzhou resolution of last March and the Shanghai conference''s eighteen questions of last April are forgotten, and the "communist wind", exaggeration and commandism are back; some commune staff act without approval; graft, waste and bureaucratism again. The Center believes most communes are good; the worst staff are to be removed, "levelling and transfers" repaid in full, big embezzlers prosecuted, and county committees that failed in their duty removed too; rectification every year, a six-level conference twice a year.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 116–120 (Mar. 23, 1960, printed from the Central Committee document, with Mao''s manuscript); [[w.mao-zedong-zhuan]], V, ch. 66 n.2 (the Center''s circular drafted by Mao forwarding the Shandong six-level cadre conference bulletin: its problems surely in every province; the Zhengzhou resolution and the Shanghai meeting''s eighteen points forgotten; "levelling and transfers" repaid in full, the worst removed, big embezzlers prosecuted; most communes good; manuscript of Mar. 23). [[w.yang-jisheng-mubei]], I, 443 (Mao''s comment on bulletin no. 2, quoted from the Mao wengao vol. 9; n.10); [[w.yang-jisheng-mubei]], II, 1139 n.60 (the Center''s comment of Mar. 23 on the Shandong six-level cadre conference and its directive of Mar. 30 against bureaucratism, after which some areas begin the "three antis" in the villages, as the Center''s directive of May 15, 1960 recounts them, n.60 citing [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378–383); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 378 (the Center''s directive of May 15, 1960 on the "three antis" names the comment of Mar. 23 on the Shandong six-level cadre conference); [[w.yang-jisheng-tiandi-fanfu]], I, 81 (the Center''s comment on the Shandong six-level cadre meeting); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 129–139 (the comment of Mar. 23, 1960, in full, with Shandong''s bulletin; printed from the Center''s document). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 129–139). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong six-level cadre conference secretariat, Huiyi qingkuang no. 2, Mar. 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 118 n.3); Zhengzhou huiyi jilu (record of the enlarged Politburo meeting at Zhengzhou, Feb. 27-Mar. 5, 1959: the meeting summary, Mao''s speech, and the draft regulations on the management system of the people''s communes) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 119 n.4); Minutes of the enlarged Politburo meeting at Shanghai, Mar. 25-Apr. 1, 1959, "Eighteen questions on the people''s communes", adopted at the Seventh Plenum of the Eighth Central Committee, Apr. 2–5, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 120 n.5); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Shandong Provincial Committee''s bulletin on its six-level cadre conference (manuscript 手稿), Mar. 23, 1960; in [[w.mao-zedong-wenji]], VIII, 163–164 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.2). See [[cal.1960-03-22.china-leadership-5]]. Names: Mao Zedong.'
