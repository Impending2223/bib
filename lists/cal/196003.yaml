    when: Mar. 22
    date: '1960-03-22'
    thread: china-leadership
    also: [south-asia]
    c: 'Mao''s comment "On the anti-China question," on the embassy''s report of China''s fair in East Pakistan and the crowds at its pavilion in New Delhi: the "great anti-China" chorus imperialists, reactionaries and revisionists, perhaps 5, at most 10 percent of mankind, and intermittent; when China''s output nears theirs America will have to recognize it and trade.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 255–258 (the comment on the Pakistan embassy''s telegram, written two days before the Tianjin meeting; 5 percent, at most 10 percent; the Delhi pavilion''s 3.5 million visitors; given to those on the train); [[w.jianguo-yilai-mao-zedong]], XV, 109–113 (Mar. 22, 1960; the comment with its two annexes: of 2.7 billion people some 270 million are against China; of China''s 650 million at most 65 million against the Party; over 3.5 million visited the pavilion at New Delhi; Mao puts the anti-China chorus at ten years or more, perhaps the last forty years of the century); [[w.mao-zedong-zhuan]], V, ch. 66 n.11 ("On the anti-China question": about 5 percent, 10 at most, anti-China; the rest of the world for China or not against or briefly deceived; manuscript of Mar. 22; Mao says later (n.12) the Pakistan fair gave him the idea). Made public: 1999. To check: Chinese Embassy in Pakistan, report of Mar. 14, 1960 to the Foreign Ministry, the Foreign Trade Ministry and the International Trade Promotion Committee on China''s part in the East Pakistan industrial and agricultural exhibition (50,000 visitors by that day) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2a); Renmin ribao, Mar. 17, 1960, the correspondent''s dispatch on the closing of the China pavilion at the New Delhi world agricultural fair (Feb. 29; 81 days, over three million visitors) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 112 n.2b); Mao Zedong 毛泽东, "On the anti-China question" 《关于反华问题》 (manuscript 手稿), Mar. 22, 1960; in *Mao Zedong wenji*, vol. 8, 181, 188-189 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.11). Names: Mao Zedong.'
