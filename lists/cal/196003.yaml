  - id: cal.1960-03-06.china-leadership-3
    when: Mar. 6
    date: '1960-03-06'
    thread: china-leadership
    c: 'Mao drafts the Center''s comment to the regional bureaus, provincial, municipal and regional committees and the Party groups of central bodies: the Jiangsu committee''s analysis of three problems in the rectification is correct; all are to take note and take concrete steps to settle the three big problems one by one. It rests on *Qingkuang jianbao* no. 103 of Mar. 1, which Mao retitles "Three big problems among cadres". The Jiangsu analysis: many Party members are unready for continuous revolution to the end of the socialist revolution, in the revolution of ownership (the spontaneous capitalism of small producers and better-off middle peasants), in building at high speed, and in the political and ideological revolution.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 66–67 (Mar. 6, 1960). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Qingkuang jianbao, no. 103, Mar. 1, 1960, "An important subject of the Party''s ideological building" (Central Committee General Office) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 66 n.1a). Names: Mao Zedong.'
