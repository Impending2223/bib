    thread: cuba-bay-of-pigs
    c: Eisenhower approves "A Program of Covert Action Against the Castro Regime," from the 5412 Committee. An exile opposition; radio from Swan Island; a network inside Cuba; a paramilitary force trained outside, eight months to form. No more than two or three Americans in touch with the groups. Nixon, Herter, Dulles, Bissell present. Bonsal to return to Havana.
    n: 'FRUS 1958–60, VI, docs. [481](https://history.state.gov/historicaldocuments/frus1958-60v06/d481) (the paper), [483](https://history.state.gov/historicaldocuments/frus1958-60v06/d483) (the NSC), [484](https://history.state.gov/historicaldocuments/frus1958-60v06/d484) (Bonsal), [486](https://history.state.gov/historicaldocuments/frus1958-60v06/d486) (the meeting, 2:30 p.m.); [474](https://history.state.gov/historicaldocuments/frus1958-60v06/d474) (the NSC, Mar. 10); [FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 3–4 (Taylor''s Memorandum No. 1, June 13, 1961: the paper approved Mar. 17, its four parts). Made public: in part, *Declassified Documents*, 1985 (FRUS''s source notes); in full, FRUS 1958–60, VI (1991). [[w.watson-into-the-missile-age]], 764 (the plan''s four parts; the President''s approval in principle); [[w.nixon-rn]], 203 (Nixon present at the meeting that authorized the training of exiles; no date); [[w.jones-bay-of-pigs]], 19 (the approval; the program''s four parts); [[w.bissell-reflections-of-a-cold]], 153 (the program presented; "only two or three governmental people"); [[w.nixon-six-crises]], 352 (early in 1960, by Nixon''s account at his urging: arms, ammunition and training for Cuban exiles); [[w.paterson-contesting-castro]], 258 (in March 1960 Eisenhower orders the CIA to train exiles for an invasion); [[w.fursenko-khrushchevs-cold-war]], 304 (the 5412 Committee''s program of Mar. 16: a "responsible, appealing and unified Cuban opposition"); [[w.poole-joint-chiefs-of-staff]], 108 (Mar. 17, 1960: Eisenhower approves a CIA "paramilitary" plan patterned on the Guatemala effort of 1954: exiles infiltrate Cuba, arms are airdropped, guerrilla bands grow; Guatemala''s president agrees that the exiles may train in his country; not the title, the 5412 Committee, the radio, the network or those present). [[w.fursenko-one-hell-of-a]], 43–44 (the approval; "Everyone must be prepared to swear that he has not heard of it"). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.bohning-castro-obsession]]; [[w.operation-zapata]]; [[w.rasenberger-brilliant-disaster]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.ambrose-eisenhower]]; [[w.wyden-bay-of-pigs]]; [[w.higgins-perfect-failure]]; [[w.gleijeses-ships-in-the-night]]; [[w.bay-of-pigs-declassified]]; [[w.pfeiffer-official-history-of-the]]; [[w.bay-of-pigs-invasion-playa-giron-chronology]]. Names: Eisenhower, Nixon, Herter, Bonsal, Dulles, Bissell, Castro.'
