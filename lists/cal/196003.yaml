    c: Montgomery. The State Board of Education, on the recommendation of Patterson, its chairman, expels nine Alabama State College students as "ring leaders" of the sit-in of Feb. 25 and the demonstrations after, Bernard Lee among them; twenty put on probation. No charges, no hearing.
    n: '*Dixon v. Alabama State Board of Education*, [294 F.2d 150](https://static.case.law/f2d/294/case-pdfs/0150-01.pdf), 154 (5th Cir. 1961), quoting the district court''s findings. [[w.branch-parting-the-waters]], 282 (the nine, Lee). To check: Bernard Lee affidavit, February 1961, A/SC60f10 (cited by [[w.branch-parting-the-waters]], 282 n.5). See [[cal.1960-02-25.sit-ins]]. Names: Patterson.'
