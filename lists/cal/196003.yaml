    date: '1960-03-28'
    thread: china-leadership
    c: 'Zhou Enlai presides at the State Council''s 98th plenary meeting, on the 1960 plan and budget drafts and the 1959 accounts. Urban communes now to be promoted with plan and leadership, entry voluntary, no rush. Foreign trade secondary to self-reliance. Bureaucratism growing: a fraud in his name on the People''s Bank, since solved; no office to be left without a minister or vice-minister at home.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 298 (Mar. 28, 1960). Made public: 1997. Names: Zhou Enlai.'
