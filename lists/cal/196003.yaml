  - id: cal.1960-03-15.china-leadership-2
    when: Mar. 15
    date: '1960-03-15'
    thread: china-leadership
    c: 'Mao''s comments for the Center on three reports, sent to Liu Shaoqi and Deng Xiaoping for the Central Committee: on the mess halls (to be "grasped hard" twice this year); Hunan''s on farming; Shandong''s on the hungry counties, cadres sent to twenty backward counties, and leaders who fail "removed at once."'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 76–77 (Mao to Liu and Deng, Mar. 15: the drafts enclosed are the Hunan, Shandong and Jiangsu comments, for the Central meeting to pass and to issue within seven to ten days to the first secretaries; the mess-hall comment came with his letter of Mar. 16, 97–98); [[w.jianguo-yilai-mao-zedong]], XV, 78–79 (the Hunan comment: the report on thirteen aspects of farm work is worth reading, with something new in it, showing the whole of agriculture; the report: by the end of February 880,000 water works new or repaired, 30,000 of them new reservoirs; seven million laborers out on manure; a plan of 40 million pigs); [[w.jianguo-yilai-mao-zedong]], XV, 80–81 (the Shandong comment; the report: 45,000 cadres sent out, 24 backward counties and cities, 260-odd cadres to sit in them); [[w.jianguo-yilai-mao-zedong]], XV, 82–89 (the mess-hall comment, dated Mar. 15 and issued Mar. 18: the three papers (eight provinces; Henan; the nation at the end of 1959) are pleasing; each province to "grasp hard" the question twice in the year, in each half, with a scientific summary on the Guizhou and Henan pattern; welfare committees at the four levels from province to commune, each under a secretary, and a management committee in every hall; the same in factories, mines, streets, offices, schools and the army. Mao''s inserts: the nation to aim at 80 percent of rural people eating in halls, seven provinces and cities (Henan, Hunan, Sichuan, Yunnan, Guizhou, Shanghai, Anhui) already over 90 percent, the rest not to be forced, two or three years; starch from plant stalks "a great invention"; third-class halls to be made first-class. The papers: Henan, 336,000 halls and 99 percent of rural people; the nation, 3,919,000 halls and 72.6 percent of commune members at the end of 1959); [[w.mao-zedong-zhuan]], V, ch. 66 n.8 (Mar. 15: the comment on the mess halls, forwarding the Guizhou and Henan materials, both "good, making one glad": the Henan committee''s of Mar. 5, 336,000 halls, 99 percent of the villagers eating in them; the mess halls "to be grasped hard twice in the year, first half and second", with a scientific summary as Guizhou and Henan have done). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). To check: Hunan Provincial Committee, comprehensive report on thirteen aspects of agricultural production, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 78 n.1); Shandong Provincial Committee, report of Feb. 27, 1960 to the Center and the Shanghai Bureau on living arrangements (cited by [[w.jianguo-yilai-mao-zedong]], XV, 80 n.1); Central Committee, circulars of Mar. 18, 1960 forwarding the Hunan, Shandong and Jiangsu reports with Mao''s three comments, issued unchanged after the Politburo passed them (cited by [[w.jianguo-yilai-mao-zedong]], XV, 77 n.4); Qingkuang jianbao no. 117, "The state of the rural public mess halls in eight provinces" (from telephone reports of Hebei, Henan, Shanxi, Shandong, Gansu, Liaoning, Jilin and Heilongjiang) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 86 n.2); Henan Provincial Committee Secretariat office, telephone report of Mar. 5, 1960, "The state of the rural public mess halls in Henan" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 87 n.3); State Statistical Bureau, January 1960, "The development of the rural public mess halls at the end of 1959" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 88 n.4); Central Committee, circular of Mar. 18, 1960 forwarding the three mess-hall papers with Mao''s comments (cited by [[w.jianguo-yilai-mao-zedong]], XV, 86 n.1b); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 on strengthening the leadership of the public mess halls (manuscript 手稿), Mar. 15, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.8). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
