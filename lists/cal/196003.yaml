    thread: china-leadership
    c: 'Mao drafts the Center''s directive on health work: the patriotic health campaign, slack in two years of the leap, revived, with results in 1960–62; and its comment on technical revolution, a great movement to be summed up by May. Both to Liu Shaoqi and Deng Xiaoping for issue.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 16, 1960. [[w.jianguo-yilai-mao-zedong]], XV, 90–92 (the technical-revolution comment, dated Mar. 16 and issued Mar. 18: the ACFTU Party group''s report on seven cities (Shanghai, Tianjin, Shenyang, Lüda, Harbin, Taiyuan, Chongqing) and the *Jingji xiaoxi* piece are important summaries, to go to all city, mine and commune committees; Wuhan, Canton, Xi''an, Lanzhou, the provincial capitals and hundreds of medium cities such as Tangshan, Shijiazhuang, Qingdao, Luoyang, Huangshi, Zhuzhou, Wuxi, Zhanjiang and Pingxiang to sum up and spread the work quickly, county and commune industry too, the investigating and summing up to be done in March, April and May with large field conferences; the First Ministry of Machine Building''s January field conference at Harbin, to which most cities were not invited, Wuhan and Canton among them, is faulted); [[w.jianguo-yilai-mao-zedong]], XV, 93–96 (the health instruction, dated Mar. 16 and issued Mar. 18: health work slack for two years in the rush of the Leap; the Center''s approval of Feb. 2 of the Health Ministry''s report on the Jishan conference was not heeded by most first secretaries; the patriotic health campaign to be revived and show results in 1960, 1961 and 1962; each Party committee, health department and mass organization to meet four times a year, once a quarter, the patriotic health campaign committees too; the four pests to be rats, bedbugs, flies and mosquitoes, sparrows no longer to be hit; sport and exercise urged); [[w.jianguo-yilai-mao-zedong]], XV, 97–98 (Mao to Liu and Deng, Mar. 16: the technical-revolution and mess-hall comments and a draft telegram on health work are sent, with a request that they gather the comrades concerned, and that the three of Mar. 15 were sent the day before); [[w.mao-zedong-zhuan]], V, ch. 66 n.9 (the directive on health work drafted Mar. 16: the patriotic health campaign to be started again, flies and the other pests; sparrows spared, bedbugs put in their place). [[w.yang-jisheng-mubei]], I, 212 (the directive''s passage on the patriotic health campaign, quoted; the book sets it beside the deaths of that spring; n.54); [[w.dikotter-maos-great-famine]], 188 n.80 (by April 1960 sparrows taken off the list of pests, bedbugs put in their place); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 90–92 (the health directive as issued, Mar. 18, 1960, in full; printed from the Center''s document). Made public: in part (the health directive), 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 90–92); the rest, [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 66). Check: the *Mao zedong zhuan* (V, ch. 66 n.4) prints 1963 for the manuscript of the comment on the technical revolution it dates Mar. 16, though its text puts the comments within Mar. 3–25, 1960. To check: All-China Federation of Trade Unions Party group, report of Mar. 5, 1960 to the Center on the present state of technical innovation and technical revolution (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.2); Jingji xiaoxi, no. 10, 1960, "The technical revolution movement reaps a harvest over a large area" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 92 n.3); Central Committee, circular of Mar. 18, 1960 forwarding the ACFTU report and the Jingji xiaoxi piece with Mao''s comment (cited by [[w.jianguo-yilai-mao-zedong]], XV, 91 n.1); Health Ministry Party group, report of Dec. 16, 1959 to the Central Committee Cultural and Educational Group and the Center on the national rural health field conference at Jishan county, Shanxi, Nov. 12–21, 1959 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 95 n.2); Mao Zedong 毛泽东, directive drafted for the Center 中共中央 on health work 关于卫生工作的指示, Mar. 16, 1960; in [[w.mao-zedong-wenji]], VIII, 150 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.9); Judith Shapiro, *Mao''s War against Nature* (2001), 88 (cited by [[w.dikotter-maos-great-famine]], 188 n.80). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
