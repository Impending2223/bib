    c: 'Wisconsin, early morning, a diner by a factory gate. Kennedy to his companion: "You think I''m out here to get votes ... Well, I am. But not just their votes. I''m trying to get the votes of a lot of people who are sitting right now in warm, comfortable homes all over the country ... hoping that young Jack will fall right on his face in the snow. Bastards." Then: "What the hell. They''ll take me if they have to. Let''s get started."'
