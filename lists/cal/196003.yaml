    c: 'Tianjin, after the session. Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping and Peng Zhen on Lenin''s anniversary and the propaganda of Mao''s thought. Deng: the press drops "Marxism–Leninism" and calls everything Mao''s thought; Mao: that is wrong.'
