  - id: cal.1960-03-09.china-leadership-11
    when: Mar. 9
    date: '1960-03-09'
    place:
      - nanchong
      - maanchang
    thread: china-leadership
    c: Zhu De 朱德 goes from Nanchong 南充 to Ma'anchang 马鞍场, Yilong county 仪陇县, Sichuan 四川, his birthplace, left more than fifty years before. On the way he inspects oil well 12 of Laojun 老君 at Dongguanchang 东观场 on the Jialing River 嘉陵江 and talks with the drillers; hears the Peng'an 蓬安 and Yingshan 营山 county committees (the state and province to help with machines for small hydropower stations; grain must pass the test, or no country could feed so many); visits an old people's home and a nursery in Yilong's Fuxing district 复兴区 (care by the state and the collective only for the widowed, orphaned, childless and disabled; families to keep their old); hears the Xincun district 新村区 committee (more commune industry, more sideline production).
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1765–1766. Made public: 2016. Names: Zhu De.'
    tags: [polity:prc, name:zhu-de, vis:only:prc@C-E]
