  - id: cal.1960-03-24.china-leadership
    when: Mar. 24
    date: '1960-03-24'
    place: tianjin
    thread: china-leadership
    c: 'Tianjin, on the train. Mao opens the Tianjin meeting: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Chen Boda, Bo Yibo, ministers, and the first secretaries of North and Northeast China, Hubei, Henan and Gansu. His seventeen questions (the fourteen of Hangzhou, the anti-China question and the main contradiction): urban communes everywhere, "now I am a leftist"; the five faults in the rural communes "rather serious."'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 24, 1960. [[w.zhou-enlai-nianpu-1949]], II, 296, Mar. 24, 1960 (Zhou present at the Tianjin meeting). [[w.lengxi-shinian-lunzhan-1956-1966]], 253–254, 258 (Wu, Hu Qiaomu, Chen Boda and Kang Sheng told the morning of Mar. 23 to go to Tianjin, by car to a railway siding by the airport outside the city, on Mao''s train; told on arrival the meeting was at 2 p.m.; the attendance in part (Liu, Zhou, Deng, Peng Zhen, Li Fuchun, Bo Yibo, Tan Zhenlin, Huang Huoqing); called on the communes, the urban ones above all, it turned to Sino-Soviet relations and the propaganda of Mao''s thought; in fact an enlarged Standing Committee, Mar. 24 and 25); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 481 (Mar. 24–25, 1960; Liu attends the work conference Mao convenes at Tianjin; Mao puts seventeen questions: the 1960 plan, urban and rural communes, public mess halls, industry and agriculture, education, saving and the comprehensive use of materials, the foreign and domestic situation; on the study of philosophy by workers, peasants and soldiers Liu says it has helped much and is a campaign to popularize philosophy); [[w.yang-jisheng-mubei]], II, 1170 (Mao presides over an enlarged Standing Committee meeting at Tianjin, Mar. 24–25, on seventeen questions, among them urban communes of every size everywhere; the meeting holds to the three red flags but opposes the communist wind); [[w.deng-xiaoping-nianpu-1904]], III, 1534 (Mar. 24, 1960; noon; Deng at Mao''s meeting, the Tianjin meeting, with the leaders of the center and the first secretaries of the five North China provinces, the three of the Northeast, Hubei, Henan and Gansu; Mao''s seventeen questions; at the close Mao names Deng to chair the next morning''s session. Footnotes 1–2: the four modernizations (mechanization, semi-mechanization, automation, semi-automation); the three antis (graft, waste, bureaucratism)); [[w.mao-zedong-zhuan]], V, ch. 66 nn.10, 15 (Mar. 24, the first of the two days of the Tianjin meeting, the Standing Committee enlarged: the list of those present; Mao''s seventeen questions, among them the four modernizations, mess halls and urban communes everywhere, the five problems of the rural communes "rather serious", the anti-China question and the principal contradiction). Made public: 1996. To check: Mao Zedong 毛泽东, speech at the Tianjin meeting 天津会议, Mar. 24, 1960 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.10); Record of the Tianjin meeting 天津会议记录, Mar. 24, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.15). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Chen Boda, Bo Yibo, Ulanhu, Lin Tie, Wang Renzhong, Wu Zhipu, Zhang Zhongliang.'
