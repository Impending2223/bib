  - id: cal.1960-03-02.china-leadership
    when: Mar. 2
    date: '1960-03-02'
    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou Enlai approves and sends on Hu Qiaomu''s February draft of the Center''s oral notice to the Soviet Central Committee on the Sino-Indian boundary dispute: the two parties differ; exchange is useful but argument should not go further now, each keeping its view and waiting for facts. Zhou''s comment: he agrees with the wording and content and asks that it go to Mao; to be settled at Mao''s report meeting the afternoon or evening of Mar. 3.'
