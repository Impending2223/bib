    n: 'Address Before a Joint Session of the National Congress of Uruguay, [1960–61 Pub. Papers 267](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=319) (Mar. 2, 1960); The Declaration of Montevideo, [1960–61 Pub. Papers 275](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=327) (Mar. 3). Check: Montevideo. See [[cal.1960-02-23.latin-america]]. Names: Eisenhower.'
