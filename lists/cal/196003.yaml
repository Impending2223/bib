    c: 'Zhou Enlai''s first talk with Koirala. Three principles for the boundary: the traditional customary line and actual jurisdiction, confirming the status quo; individual disputes adjusted by the maps (where the maps agree, the line is fixed; where they differ without dispute, a survey; where they differ and dispute, the joint commission if not settled now); a boundary agreement now and a treaty later, with the status quo and no attack until then. Tibetan rebels crossing the border to be dealt with by Nepal under its sovereignty and law: held, given refuge or returned.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 293 (Mar. 12, 1960); [[w.zhou-enlai-waijiao-huodong]], 271 (Mar. 12, 1960; 下午, 中南海武成殿); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 135 (Mar. 11–24, 1960; Koirala''s visit; Zhou''s three principles for the boundary, to which Nepal agreed). Made public: 1993. Names: Zhou Enlai, Koirala.'
