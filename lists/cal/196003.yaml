  - id: cal.1960-03-03.china-leadership-5
    when: Mar. 3
    date: '1960-03-03'
    thread: china-leadership
    c: 'Mao completes the Center''s instruction forwarding the Guangdong directive: a very good document; the same five problems must be in every province, and each is to issue a clear, plain instruction on the Guangdong model; the directive is to go to the prefecture, county and commune committees for several discussions. Each province is to hold a conference of four, five or six levels of cadres, ten to fourteen days, finished by Mar. 30, and a second in the year''s second half; Guangdong has called its own for early March. The instruction may go in the Party journals. It issues dated Mar. 5.'
