    n: '[[w.jianguo-yilai-mao-zedong]], XV, 49–54 (Mar. 2, 1960, 3 and 6 a.m.; notes at 51–54). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Guangdong Provincial Committee, directive of Feb. 25, 1960 on some problems in current people''s commune work, sent to the Canton and Hainan committees and all prefectural, municipal and county committees and to the Center and Mao (cited by [[w.jianguo-yilai-mao-zedong]], XV, 52 n.2a). See [[cal.1960-03-01.china-leadership-2]]. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Kang Sheng.'
