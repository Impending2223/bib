  - id: cal.1960-03-03.china-leadership-5
    when: Mar. 3
    date: '1960-03-03'
    thread: china-leadership
    c: 'Mao completes the Center''s instruction forwarding the Guangdong directive: a very good document; the same five problems must be in every province, and each is to issue a clear, plain instruction on the Guangdong model; the directive is to go to the prefecture, county and commune committees for several discussions. Each province is to hold a conference of four, five or six levels of cadres, ten to fourteen days, finished by Mar. 30, and a second in the year''s second half; Guangdong has called its own for early March. The instruction may go in the Party journals. It issues dated Mar. 5.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 50–52 (Mar. 3, 1960, with note 1 at 51–52); [[w.mao-zedong-zhuan]], V, ch. 66 n.1 (the Center''s comment: a very good document; the five problems in every province, to be met by a plain instruction on the Guangdong model, discussed several times at prefecture, county and commune committees; manuscript of Mar. 3). [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 32–33 (the instruction as issued, dated Mar. 5, 1960, in full). Made public: 1996 ([[w.jianguo-yilai-zhongyao-wenxian]], XIII, 32–33). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Guangdong Provincial Committee, directive of Feb. 25, 1960 on some problems in current people''s commune work, sent to the Canton and Hainan committees and all prefectural, municipal and county committees and to the Center and Mao (cited by [[w.jianguo-yilai-mao-zedong]], XV, 52 n.2a); Mao Zedong 毛泽东, comment drafted for the Center 中共中央 forwarding the Guangdong Provincial Committee''s directive of Feb. 25, 1960 on several questions in current commune work (manuscript 手稿), Mar. 3, 1960 (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.1). See [[cal.1960-03-02.china-leadership-2]]. Names: Mao Zedong.'
