  - id: cal.1960-03-04.cuba
    when: Mar. 4–5
    date: '1960-03-04'
    thread: cuba
    c: 'The French freighter *La Coubre*, unloading Belgian munitions in Havana harbor, explodes; a second blast among the rescuers. At least 75 dead. Castro at the funeral, Mar. 5: the United States to blame; "Patria o muerte."'
    n: '[FRUS 1958–60, VI: Cuba, doc. 469](https://history.state.gov/historicaldocuments/frus1958-60v06/d469) (Herter to the Cuban chargé, Mar. 7: the protest of Castro''s charge of Mar. 5; the explosion of Mar. 4 and the dead, 75 Cuban dockworkers and French crewmen, in the note). Check: the second blast, and the count of the dead (FRUS''s note: a number of French crewmen and 75 Cuban dockworkers). [[w.fursenko-one-hell-of-a]], 40 (the explosion; Castro at the funeral); [[w.fursenko-khrushchevs-cold-war]], 301 (La Coubre, French arms, more than a hundred killed; Mar. 5, Castro blames the United States; the denial). To check: [[w.schoultz-that-infernal-little-cuban]]; [[w.rabe-eisenhower-and-latin-america]]. Names: Castro. Check: Fursenko and Naftali give more than one hundred dead (40).'
