  - id: cal.1960-03-02.voting-rights
    when: Mar. 2
    date: '1960-03-02'
    place: washington
    thread: voting-rights
    c: 'Senate tables Long''s amendment to the bill''s first section, on Johnson''s motion, [64–8](https://voteview.com/rollcall/RS0860241): the Dirksen amendment on obstructing school desegregation orders not to bar speech advocating separation. The one substantive vote of the round-the-clock sessions.'
