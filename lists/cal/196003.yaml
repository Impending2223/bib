  - id: cal.1960-03-01.china-leadership-6
    when: Mar. 1
    date: '1960-03-01'
    thread: china-leadership
    c: Tongwei 通渭, the Culture Hall 文化堂. At a mass meeting the provincial and prefectural work group announces the decision that the county committee is a "current counterrevolutionary clique" 現行反革命集團. Seventeen county committee and government leaders, headed by the first secretary, Xi Daolong 席道隆, are arrested on the spot.
    n: '[[w.yang-jisheng-mubei]], I, 168. Made public: 2008. Check: the book gives no document for the decision; Wang Bingxiang''s report (I, 168–169) tells of the county meeting of Feb. 21 to Mar. 3.'
