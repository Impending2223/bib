# Cal. XXIX March 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXIX
entries:
  - id: cal.1963-03-04.railroads
    when: Mar. 4
    date: '1963-03-04'
    thread: railroads
    c: '*Locomotive Engineers v. Baltimore & Ohio Railroad*, [372 U.S. 284](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372284/usrep372284.pdf), per curiam: the Railway Labor Act''s procedures exhausted, the carriers may put their new work rules in force. Firemen on diesel freight and yard engines the chief issue since 1959.'
    n: Presidential Railroad Commission, *Report* (Feb. 1962); [Statement by the President Upon Receiving Report of the Presidential Railroad Commission](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-report-the-presidential-railroad-commission) (Feb. 28, 1962). Horowitz, *Manpower Utilization in the Railroad Industry*; Dunlop, *Manpower in Operating Classifications on the Railroads*; Kaufman, *The Railroad Labor Dispute*; Cullen, *National Emergency Strikes*; Comment, *Ad Hoc Compulsory Arbitration Statutes*; Cottrell, *Technological Change and Labor in the Railroad Industry*; Fisher & Kraft, *The Effect of the Removal of the Firemen on Railroad Accidents* (K–J Adm. II.B). CQ Almanac 1963; *Congress and the Nation*, vol. 1 (K–J Cong. II.L).
  - id: cal.1963-03-11.defense
    when: Mar. 11
    date: '1963-03-11'
    thread: defense
    c: House extends the draft four years, to July 1, 1967, [388–3](https://voteview.com/rollcall/RH0880006). Signed Mar. 28, [77 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg4.pdf).
    n: Flynn, *The Draft, 1940–1973* (K–J Adm. II.D). See [[cal.1961-02-06.defense]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-13.defense
    when: Mar. 13
    date: '1963-03-13'
    thread: defense
    c: House adds $363.7 million for the RS-70 to the President's request, Vinson's committee amendment, [226–179](https://voteview.com/rollcall/RH0880008). The procurement and research bill passes, [374–33](https://voteview.com/rollcall/RH0880010).
    n: 'H.R. 2440, 88th Cong. [109 Cong. Rec., House, Mar. 13, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-13-1.pdf). See [[cal.1962-03-21.defense]]. Names: Vinson (K–J Cong. III.D).'
    tags: [name:vinson-carl]
  - id: cal.1963-03-17.cuba
    when: Mar. 17–30
    date: '1963-03-17'
    thread: cuba
    c: 'Alpha 66 exiles fire on the Soviet freighter *Lvov* at Isabela de Sagua; another band hits the *Baku* at Caibarién, Mar. 27. Check the date. Moscow protests. Mar. 21: the raiders "do not have a connection with the United States Government." Mar. 30: State and Justice announce they will stop raids from American soil.'
    n: FRUS 1961–63, XI, docs. [303](https://history.state.gov/historicaldocuments/frus1961-63v11/d303), [304](https://history.state.gov/historicaldocuments/frus1961-63v11/d304). [The President's News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-169) (Mar. 21, 1963). See [[cal.1963-01-08.cuba]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-18.court
    when: Mar. 18
    date: '1963-03-18'
    thread: court
    c: '*Gideon v. Wainwright*, [372 U.S. 335](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372335/usrep372335.pdf). A State must give counsel to a poor defendant charged with a felony; *Betts v. Brady* overruled, unanimous. Black for the Court; Fortas argued for Gideon. Same day: *Douglas v. California*, counsel on the first appeal; *Fay v. Noia*, federal habeas widened.'
    n: 'Opinion (K–J Cong. II.J.1; 1968 II.D.1). *Douglas v. California*, [372 U.S. 353](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372353/usrep372353.pdf); *Fay v. Noia*, [372 U.S. 391](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372391/usrep372391.pdf). Lewis, *Gideon''s Trumpet*; Murphy, *Fortas* (K–J Cong. II.G). See [[cal.1961-06-19.court]]. Names: Black, Fortas (K–J Cong. III.G).'
    tags: [name:black-hugo-l, name:fortas-abe]
  - id: cal.1963-03-18.court-2
    when: Mar. 18
    date: '1963-03-18'
    thread: court
    also: [states-and-cities]
    c: '*Gray v. Sanders*, [372 U.S. 368](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372368/usrep372368.pdf). Georgia''s county-unit primary struck, 8–1: "one person, one vote." Douglas for the Court; Harlan dissents. Robert Kennedy argued for the United States, Jan. 17, his only case before the Court.'
    n: 'Opinions (K–J Cong. II.J.1; Opp. II.H.1). Smith, *On Democracy''s Doorstep*; Ansolabehere & Snyder, *The End of Inequality* (K–J Cong. II.H). Cortner, *The Apportionment Cases* (K–J Cong. II.G). Dixon, *Democratic Representation* (Opp. II.F). Navasky, *Kennedy Justice* (K–J Adm. II.C). See [[cal.1962-03-26.court]]. Names: Douglas, Harlan (K–J Cong. III.G); Robert F. Kennedy (K–J Adm. III.A).'
    tags: [name:douglas-william-o, name:harlan-john-marshall, name:kennedy-robert-f]
  - id: cal.1963-03-18.latin-america
    when: Mar. 18–20
    date: '1963-03-18'
    thread: latin-america
    c: 'Kennedy at San José with the presidents of the five Central American republics and Panama. The Declaration of Central America: economic integration, and measures against Cuban subversion.'
    n: '[Address at the Teatro Nacional in San Jose Upon Opening the Presidents'' Conference](https://www.presidency.ucsb.edu/documents/address-the-teatro-nacional-san-jose-upon-opening-the-presidents-conference) (Mar. 18, 1963). FRUS 1961–63, XII, docs. [59](https://history.state.gov/historicaldocuments/frus1961-63v12/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v12/d60). Rabe, *The Most Dangerous Area in the World*; Levinson & de Onís, *The Alliance That Lost Its Way*; LaFeber, *Inevitable Revolutions* (K–J Adm. II.D). Martin, *Kennedy and Latin America* (K–J Adm. II.G.4). See [[cal.1961-03-13.latin-america]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-22.voting-rights
    when: Mar. 22–30
    date: '1963-03-22'
    thread: voting-rights
    c: 'Telegram to the governors of States yet to act: 22 legislatures have ratified the poll tax amendment. Mar. 30: a Commission on Registration and Voting Participation, Scammon chairing; some 8 million kept from voting in 1960 by residence rules.'
    n: '[Telegram to Governors of States Having Yet To Act on the Anti-Poll Tax Amendment](https://www.presidency.ucsb.edu/documents/telegram-governors-states-having-yet-act-the-anti-poll-tax-amendment) (Mar. 22, 1963). [Executive Order 11100](https://www.presidency.ucsb.edu/documents/executive-order-11100-establishing-the-presidents-commission-registration-and-voting); [Statement by the President Upon Signing Order Establishing the Commission on Registration and Voting Participation](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-order-establishing-the-commission-registration-and) (Mar. 30, 1963). U.S. Const. amend. XXIV (K–J Cong. II.J.2). *Report of the President''s Commission on Registration and Voting Participation* (K–J Adm. II.H.3). Lawson, *Black Ballots* (K–J Cong. II.C). See [[cal.1962-08-27.voting-rights]].'
    tags: [name:kennedy-john-f, name:scammon-richard-m]
  - id: cal.1963-03-24.foreign-aid
    when: Mar. 24
    date: '1963-03-24'
    thread: foreign-aid
    c: 'The Clay Committee''s report, dated Mar. 20: "we are indeed attempting too much for too many." Its criteria would cut present programs about $500 million. Meany dissents. Kennedy''s reply released.'
    n: 'Committee to Strengthen the Security of the Free World, *The Scope and Distribution of United States Military and Economic Assistance Programs* (K–J Adm. II.H.3). [Letter to General Clay in Response to a Report on the U.S. Military and Economic Assistance Programs](https://www.presidency.ucsb.edu/documents/letter-general-clay-response-report-the-us-military-and-economic-assistance-programs) (Mar. 22, 1963). [FRUS 1961–63, IX, doc. 160](https://history.state.gov/historicaldocuments/frus1961-63v09/d160). Ruttan, *United States Development Assistance Policy* (K–J Adm. II.D). Smith, *Lucius D. Clay* (K–J Adm. II.G.4). See [[cal.1962-08-01.foreign-aid]]. Names: Clay (K–J Adm. III.E); Meany (K–J Cong. III.I).'
    tags: [name:clay-lucius-d, name:meany-george, name:kennedy-john-f]
  - id: cal.1963-03-25.court
    when: Mar. 25
    date: '1963-03-25'
    thread: court
    c: '*Gibson v. Florida Legislative Investigation Committee*, [372 U.S. 539](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372539/usrep372539.pdf). The committee may not compel the Miami NAACP''s membership list, 5–4. Goldberg for the Court; Harlan dissents.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Braukman, *Communists and Perverts under the Palms* (K–J Cong. II.H). Stebenne, *Arthur J. Goldberg* (K–J Adm. II.G.5). See [[cal.1963-01-14.court]]. Names: Goldberg, Harlan (K–J Cong. III.G).'
    tags: [name:goldberg-arthur-j, name:harlan-john-marshall]
  - id: cal.1963-03-27.mississippi
    when: Mar. 27–30
    date: '1963-03-27'
    thread: mississippi
    also: [voting-rights]
    c: 'Greenwood police set a dog on Black citizens walking home from the registrar; a minister bitten. SNCC workers jailed. Mar. 30: the Justice Department sues for their release and against intimidation of voters. Apr. 4: the restraining order dropped, the workers freed. Check the terms.'
    n: '[Justice Department memorandum](https://www.crmvet.org/docs/630408_rfk_memo.pdf) (Apr. 8, 1963). Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom*; Zinn, *SNCC* (K–J Cong. II.F). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). See [[cal.1963-02-28.mississippi]].'
  - id: cal.1963-03-31.press-and-broadcasting
    when: Mar. 31
    date: '1963-03-31'
    thread: press-and-broadcasting
    c: New York newspaper strike ends after 114 days. The papers back Apr. 1.
    n: '[*New York Times*, Apr. 1, 1963](https://timesmachine.nytimes.com/timesmachine/1963/04/01/issue.html). Talese, *The Kingdom and the Power*; Kluger, *The Paper* (K–J Cong. II.F). See [[cal.1962-12-08.press-and-broadcasting]].'
