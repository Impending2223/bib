    c: 'Gallup, Mar. 8–13: Republicans'' choice for 1964: Rockefeller 44, Goldwater 21, Romney 14, Scranton 9, Hatfield 2; no preference 10. Independents: Rockefeller 44, Goldwater 18. Democrats: Rockefeller 46, Goldwater 14.'
    n: '[[w.gallup-poll]], III, 1812. Names: Rockefeller, Romney, Scranton (Opp. III.H); Goldwater, Hatfield (Opp. III.B).'
