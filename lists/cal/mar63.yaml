    date: '1963-03-31'
    thread: press-and-broadcasting
    c: New York newspaper strike ends after 114 days. The papers back Apr. 1.
    n: '[*New York Times*, Apr. 1, 1963](https://timesmachine.nytimes.com/timesmachine/1963/04/01/issue.html). [[w.talese-kingdom-and-the-power]]; [[w.kluger-paper]]. See [[cal.1962-12-08.press-and-broadcasting]].'
