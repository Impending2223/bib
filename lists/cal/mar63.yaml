    when: Mar. 18–20
    date: '1963-03-18'
    thread: latin-america
    c: 'Kennedy at San José with the presidents of the five Central American republics and Panama. The Declaration of Central America: economic integration, and measures against Cuban subversion.'
    n: '[Address at the Teatro Nacional in San Jose Upon Opening the Presidents'' Conference](https://www.presidency.ucsb.edu/documents/address-the-teatro-nacional-san-jose-upon-opening-the-presidents-conference) (Mar. 18, 1963). FRUS 1961–63, XII, docs. [59](https://history.state.gov/historicaldocuments/frus1961-63v12/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v12/d60). [[w.rabe-most-dangerous-area-in]]; [[w.levinson-alliance-that-lost-its]]; [[w.lafeber-inevitable-revolutions]]; [[w.martin-kennedy-and-latin-america]]. See [[cal.1961-03-13.latin-america]].'
