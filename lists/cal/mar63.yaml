  - id: cal.1963-03-27.mississippi
    when: Mar. 27–30
    date: '1963-03-27'
    thread: mississippi
    also: [voting-rights]
    c: 'Greenwood police set a dog on Black citizens walking home from the registrar; a minister bitten. SNCC workers jailed. Mar. 30: the Justice Department sues for their release and against intimidation of voters. Apr. 4: the restraining order dropped, the workers freed. Check the terms.'
    n: '[Justice Department memorandum](https://www.crmvet.org/docs/630408_rfk_memo.pdf) (Apr. 8, 1963). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.zinn-sncc]]; [[w.landsberg-enforcing-civil-rights]]. See [[cal.1963-02-28.mississippi]].'
