  - id: cal.1963-03-22.voting-rights
    when: Mar. 22–30
    date: '1963-03-22'
    thread: voting-rights
    c: 'Telegram to the governors of States yet to act: 22 legislatures have ratified the poll tax amendment. Mar. 30: a Commission on Registration and Voting Participation, Scammon chairing; some 8 million kept from voting in 1960 by residence rules.'
    n: '[Telegram to Governors of States Having Yet To Act on the Anti-Poll Tax Amendment](https://www.presidency.ucsb.edu/documents/telegram-governors-states-having-yet-act-the-anti-poll-tax-amendment) (Mar. 22, 1963). [Executive Order 11100](https://www.presidency.ucsb.edu/documents/executive-order-11100-establishing-the-presidents-commission-registration-and-voting); [Statement by the President Upon Signing Order Establishing the Commission on Registration and Voting Participation](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-order-establishing-the-commission-registration-and) (Mar. 30, 1963). U.S. Const. amend. XXIV (K–J Cong. II.J.2). [[w.report-of-the-presidents]]; [[w.lawson-black-ballots]]. See [[cal.1962-08-27.voting-rights]].'
    tags: [name:kennedy-john-f, name:scammon-richard-m]
