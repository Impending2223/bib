  - id: cal.1963-03-24.foreign-aid
    when: Mar. 24
    date: '1963-03-24'
    thread: foreign-aid
    c: 'The Clay Committee''s report, dated Mar. 20: "we are indeed attempting too much for too many." Its criteria would cut present programs about $500 million. Meany dissents. Kennedy''s reply released.'
    n: '[[w.world-scope-and-distribution-of]]. [Letter to General Clay in Response to a Report on the U.S. Military and Economic Assistance Programs](https://www.presidency.ucsb.edu/documents/letter-general-clay-response-report-the-us-military-and-economic-assistance-programs) (Mar. 22, 1963). [FRUS 1961–63, IX, doc. 160](https://history.state.gov/historicaldocuments/frus1961-63v09/d160). [[w.ruttan-united-states-development-assistance]]; [[w.smith-lucius-d-clay]]. See [[cal.1962-08-01.foreign-aid]]. Names: Clay (K–J Adm. III.E); Meany (K–J Cong. III.I).'
    tags: [name:clay-lucius-d, name:meany-george, name:kennedy-john-f]
