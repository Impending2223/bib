  - id: cal.1963-03-13.defense
    when: Mar. 13
    date: '1963-03-13'
    thread: defense
    c: House adds $363.7 million for the RS-70 to the President's request, Vinson's committee amendment, [226–179](https://voteview.com/rollcall/RH0880008). The procurement and research bill passes, [374–33](https://voteview.com/rollcall/RH0880010).
    n: 'H.R. 2440, 88th Cong. [109 Cong. Rec., House, Mar. 13, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-13-1.pdf). See [[cal.1962-03-21.defense]]. Names: Vinson (K–J Cong. III.D).'
