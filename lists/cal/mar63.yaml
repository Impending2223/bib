# Cal. XL March 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XL
entries:
  - id: cal.1963-03-01.middle-east
    when: Mar. 1–11
    date: '1963-03-01'
    thread: middle-east
    c: 'Bunker, the President''s emissary, to Faisal with Kennedy''s letter of Mar. 1: an eight-point plan for disengagement, Saudi aid to the royalists suspended and the UAR''s troops withdrawn; an American air unit for Saudi Arabia once observers certify the suspension. Faisal agrees in principle, with six conditions. Mar. 4, Badeau gives Nasser Kennedy''s warning on the air attacks on Saudi Arabia. Mar. 11, Bunker reports to Kennedy.'
    n: 'FRUS 1961–63, XVIII, docs. [172](https://history.state.gov/historicaldocuments/frus1961-63v18/d172), [176](https://history.state.gov/historicaldocuments/frus1961-63v18/d176) (editorial note), [187](https://history.state.gov/historicaldocuments/frus1961-63v18/d187), [189](https://history.state.gov/historicaldocuments/frus1961-63v18/d189), [202](https://history.state.gov/historicaldocuments/frus1961-63v18/d202). [[w.badeau-middle-east-remembered]]; [[w.schaffer-ellsworth-bunker]]. Made public: FRUS 1961–63, XVIII (1995). See [[cal.1962-09-26.middle-east]]. Names: Bunker, Faisal ibn Abd al-Aziz Al Saud, Nasser, Badeau.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:badeau-john-s, name:kennedy-john-f]
  - id: cal.1963-03-04.railroads
    when: Mar. 4
    date: '1963-03-04'
    thread: railroads
    c: '*Locomotive Engineers v. Baltimore & Ohio Railroad*, [372 U.S. 284](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372284/usrep372284.pdf), per curiam: the Railway Labor Act''s procedures exhausted, the carriers may put their new work rules in force. Firemen on diesel freight and yard engines the chief issue since 1959.'
    n: '[[w.commission-report]]; [Statement by the President Upon Receiving Report of the Presidential Railroad Commission](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-receiving-report-the-presidential-railroad-commission) (Feb. 28, 1962). [[w.horowitz-manpower-utilization-in-the]]; [[w.dunlop-manpower-in-operating-classifications]]; [[w.kaufman-railroad-labor-dispute]]; [[w.cullen-national-emergency-strikes]]; [[w.comment-ad-hoc-compulsory-arbitration]]; [[w.cottrell-technological-change-and-labor]]; [[w.fisher-effect-of-the-removal]]. CQ Almanac 1963; [[w.congress-and-the-nation]] (K–J Cong. II.L).'
  - id: cal.1963-03-05.alabama-birmingham
    when: Mar. 5
    date: '1963-03-05'
    thread: alabama
    also: [mayors, elections-1963]
    c: 'Birmingham elects a mayor and nine councilmen. For mayor: Boutwell, former lieutenant governor, first; Connor second; Tom King third. Runoff Apr. 2 between Boutwell and Connor. Mar. 1, the State Supreme Court had upheld the November vote.'
    n: '*Reid v. City of Birmingham*, 274 Ala. 629, [150 So. 2d 735](https://static.case.law/ala/274/html/0629-01.html) (1963). Check: the returns. [[w.eskew-but-for-birmingham]]; [[w.thornton-dividing-lines]]; [[w.mcwhorter-carry-me-home]]. See [[cal.1962-11-06.alabama-birmingham]]. Names: Boutwell, Connor, Tom King.'
    tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene, name:king-tom]
  - id: cal.1963-03-05.mayors-baltimore
    when: Mar. 5
    date: '1963-03-05'
    thread: mayors
    also: [elections-1963]
    c: 'Baltimore primaries for mayor. Democratic: Goodman, mayor since December, 49.5 percent of 143,418, the nearest of eight others 27.0. Republican: McKeldin, mayor 1943–47 and governor 1951–59, 74.4.'
    n: '[Wikipedia, "1963 Baltimore mayoral election"](https://en.wikipedia.org/wiki/1963_Baltimore_mayoral_election), from Our Campaigns; check against the Board of Supervisors of Elections. [[w.durr-behind-the-backlash]]; [[w.callcott-maryland-and-america-1940]]. Names: Goodman, McKeldin.'
    tags: [state:md, city:baltimore, name:goodman-philip-h, name:mckeldin-theodore-r]
  - id: cal.1963-03-05.transportation
    when: Mar. 5
    date: '1963-03-05'
    thread: transportation
    c: 'Transportation bill sent to Congress, on the lines of the 1962 message: minimum-rate regulation lifted from all carriage of bulk and farm commodities, as it already is for much of it by water and truck; the antitrust laws against destructive competition.'
    n: '[Letter to the President of the Senate and to the Speaker of the House on Transportation Policy](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transportation-policy) (Mar. 5, 1963). [[w.friedlaender-dilemma-of-freight-transport]]. See [[cal.1962-04-05.transportation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-08.middle-east
    when: Mar. 8–11
    date: '1963-03-08'
    thread: middle-east
    c: Syria. Officers of the Ba'th and their allies take power at Damascus, Mar. 8. The United States recognizes the new regime Mar. 11.
    n: FRUS 1961–63, XVIII, doc. [185](https://history.state.gov/historicaldocuments/frus1961-63v18/d185). [[w.rabinovich-syria-under-the-bath]]; [[w.seale-asad-of-syria]]. See [[cal.1961-09-28.middle-east]].
  - id: cal.1963-03-10.opinion
    when: Mar. 10
    date: '1963-03-10'
    thread: opinion
    also: [europe-and-the-alliance]
    c: 'Gallup, Feb. 7–12: France a dependable ally, 32 percent; not, 35; no opinion, 33. The college-educated, 36 and 47.'
    n: '[[w.gallup-poll]], III, 1808.'
  - id: cal.1963-03-11.defense
    when: Mar. 11
    date: '1963-03-11'
    thread: defense
    c: House extends the draft four years, to July 1, 1967, [388–3](https://voteview.com/rollcall/RH0880006). Signed Mar. 28, [77 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg4.pdf).
    n: '[[w.flynn-draft-1940-1973]]. See [[cal.1961-02-06.defense]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-12.state-and-city-finance-in
    when: Mar. 12
    date: '1963-03-12'
    thread: state-and-city-finance
    c: 'Indiana. Welsh calls the General Assembly into special session on his "2-2-2" plan: the State''s first sales tax, 2 percent; income taxes of 2 percent on persons and on corporations. Passed in the House; the Senate ties, and Lieutenant Governor Ristine (R) votes for it.'
    n: '[Wikipedia, "Matthew E. Welsh"](https://en.wikipedia.org/wiki/Matthew_E._Welsh) (Check: the acts, *Laws of Indiana*, special session 1963, and the Senate''s vote and date). [[w.welsh-view-from-the-state]]; [[w.peirce-great-lakes-states-of]]. Names: Welsh, Ristine.'
    tags: [state:in, name:welsh-matthew-e, name:ristine-richard-o]
  - id: cal.1963-03-13.defense
    when: Mar. 13
    date: '1963-03-13'
    thread: defense
    c: House adds $363.7 million for the RS-70 to the President's request, Vinson's committee amendment, [226–179](https://voteview.com/rollcall/RH0880008). The procurement and research bill passes, [374–33](https://voteview.com/rollcall/RH0880010).
    n: 'H.R. 2440, 88th Cong. [109 Cong. Rec., House, Mar. 13, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-13-1.pdf). See [[cal.1962-03-21.defense]]. Names: Vinson.'
    tags: [name:vinson-carl]
  - id: cal.1963-03-13.opinion
    when: Mar. 13
    date: '1963-03-13'
    thread: opinion
    also: [europe-and-the-alliance]
    c: 'Gallup, Feb. 7–12: Britain a dependable ally, 63 percent; not, 12. West Germany, 58 and 13.'
    n: '[[w.gallup-poll]], III, 1809.'
  - id: cal.1963-03-15.governors-mn
    when: Mar. 15–25
    date: '1963-03-15'
    thread: governors
    also: [elections-1962]
    c: Minnesota. The three judges find Rolvaag ahead by 91 votes, 619,842 to 619,751, Mar. 15, and order him declared elected, Mar. 21. Andersen waives appeal, Mar. 23. Rolvaag sworn in, Mar. 25, 139 days after the election; Andersen governor through the legislative session's first months.
    n: 'Nathanson, ["Gubernatorial Election Recount, 1962"](https://www.mnopedia.org/event/gubernatorial-election-recount-1962), *MNopedia*; final figures, [Wikipedia, "1962 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1962_Minnesota_gubernatorial_election), from the Minnesota Historical Election Archive; [the Secretary of State''s supplemental statement on the recount](https://www.lrl.mn.gov/archive/sessions/electionresults/1962-11-06-g-man.pdf) (Minn. Legislative Reference Library). See [[cal.1962-11-06.governors-mn]]. Names: Rolvaag, Andersen.'
    tags: [state:mn, name:rolvaag-karl-f, name:andersen-elmer-l]
  - id: cal.1963-03-16.japan-and-korea
    when: Mar. 16–Apr. 8
    date: '1963-03-16'
    thread: japan-and-korea
    c: 'Park reverses himself: a referendum on four more years of military rule, announced Mar. 16. Washington objects. Mar. 29, the Korean ambassador brings Kennedy Park''s letter; Kennedy wants a timetable for civilian rule, and says Berger speaks for him. Apr. 8, the referendum put off to September.'
    n: 'FRUS 1961–63, XXII, docs. [294](https://history.state.gov/historicaldocuments/frus1961-63v22/d294), [295](https://history.state.gov/historicaldocuments/frus1961-63v22/d295), [297](https://history.state.gov/historicaldocuments/frus1961-63v22/d297), [298](https://history.state.gov/historicaldocuments/frus1961-63v22/d298), [299](https://history.state.gov/historicaldocuments/frus1961-63v22/d299), [300](https://history.state.gov/historicaldocuments/frus1961-63v22/d300). See [[cal.1963-02-18.japan-and-korea]]. Names: Park, Kennedy, Berger.'
    tags: [name:park-chung-hee, name:kennedy-john-f, name:berger-samuel-d]
  - id: cal.1963-03-17.cuba
    when: Mar. 17–30
    date: '1963-03-17'
    thread: cuba
    c: 'Alpha 66 exiles fire on the Soviet freighter *Lvov* at Isabela de Sagua; another band hits the *Baku* at Caibarién, Mar. 27. Check the date. Moscow protests. Mar. 21: the raiders "do not have a connection with the United States Government." Mar. 30: State and Justice announce they will stop raids from American soil.'
    n: FRUS 1961–63, XI, docs. [303](https://history.state.gov/historicaldocuments/frus1961-63v11/d303), [304](https://history.state.gov/historicaldocuments/frus1961-63v11/d304). [The President's News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-169) (Mar. 21, 1963). See [[cal.1963-01-08.cuba]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-17.opinion-5
    when: Mar. 17
    date: '1963-03-17'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Feb. 7–12: Kennedy 63, Rockefeller 32, undecided 5. Independents: Kennedy 56, Rockefeller 37.'
    n: '[[w.gallup-poll]], III, 1810. Names: Nelson Rockefeller.'
    tags: [name:kennedy-john-f, name:rockefeller-nelson]
  - id: cal.1963-03-18.court
    when: Mar. 18
    date: '1963-03-18'
    thread: court
    c: '*Gideon v. Wainwright*, [372 U.S. 335](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372335/usrep372335.pdf). A State must give counsel to a poor defendant charged with a felony; *Betts v. Brady* overruled, unanimous. Black for the Court; Fortas argued for Gideon. Same day: *Douglas v. California*, counsel on the first appeal; *Fay v. Noia*, federal habeas widened.'
    n: 'Opinion (K–J Cong. II.J.1; 1968 II.D.1). *Douglas v. California*, [372 U.S. 353](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372353/usrep372353.pdf); *Fay v. Noia*, [372 U.S. 391](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372391/usrep372391.pdf). [[w.lewis-gideons-trumpet]]; [[w.murphy-fortas]]. See [[cal.1961-06-19.court]]. Names: Fortas.'
    tags: [name:fortas-abe]
  - id: cal.1963-03-18.court-2
    when: Mar. 18
    date: '1963-03-18'
    thread: court
    also: [states-and-cities, robert-kennedy, georgia, legislatures]
    c: '*Gray v. Sanders*, [372 U.S. 368](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372368/usrep372368.pdf). Georgia''s county-unit primary struck, 8–1: "one person, one vote." Douglas for the Court; Harlan dissents. Robert Kennedy argued for the United States, Jan. 17, his only case before the Court.'
    n: 'Opinions (K–J Cong. II.J.1; Opp. II.H.1). [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]; [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]; [[w.navasky-kennedy-justice]]. See [[cal.1962-03-26.court]]. See [[cal.1962-04-28.georgia-ga]]. Names: Douglas, Robert F. Kennedy.'
    tags: [name:douglas-william-o, name:kennedy-robert-f, state:ga]
  - id: cal.1963-03-18.latin-america
    when: Mar. 18–20
    date: '1963-03-18'
    thread: latin-america
    c: 'Kennedy at San José with the presidents of the five Central American republics and Panama. The Declaration of Central America: economic integration, and measures against Cuban subversion.'
    n: '[Address at the Teatro Nacional in San Jose Upon Opening the Presidents'' Conference](https://www.presidency.ucsb.edu/documents/address-the-teatro-nacional-san-jose-upon-opening-the-presidents-conference) (Mar. 18, 1963). FRUS 1961–63, XII, docs. [59](https://history.state.gov/historicaldocuments/frus1961-63v12/d59), [60](https://history.state.gov/historicaldocuments/frus1961-63v12/d60). [[w.rabe-most-dangerous-area-in]]; [[w.levinson-alliance-that-lost-its]]; [[w.lafeber-inevitable-revolutions]]; [[w.martin-kennedy-and-latin-america]]. See [[cal.1961-03-13.latin-america]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-03-20.opinion-5
    when: Mar. 20
    date: '1963-03-20'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Feb. 7–12: Kennedy 67, Goldwater 27, undecided 6.'
    n: '[[w.gallup-poll]], III, 1810. Names: Goldwater.'
    tags: [name:kennedy-john-f, name:goldwater-barry-m]
  - id: cal.1963-03-22.voting-rights
    when: Mar. 22–30
    date: '1963-03-22'
    thread: voting-rights
    also: [amendments]
    c: 'Telegram to the governors of States yet to act: 22 legislatures have ratified the poll tax amendment. Mar. 30: a Commission on Registration and Voting Participation, Scammon chairing; some 8 million kept from voting in 1960 by residence rules.'
    n: '[Telegram to Governors of States Having Yet To Act on the Anti-Poll Tax Amendment](https://www.presidency.ucsb.edu/documents/telegram-governors-states-having-yet-act-the-anti-poll-tax-amendment) (Mar. 22, 1963). [Executive Order 11100](https://www.presidency.ucsb.edu/documents/executive-order-11100-establishing-the-presidents-commission-registration-and-voting); [Statement by the President Upon Signing Order Establishing the Commission on Registration and Voting Participation](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-order-establishing-the-commission-registration-and) (Mar. 30, 1963). U.S. Const. amend. XXIV (K–J Cong. II.J.2). [[w.report-of-the-presidents]]; [[w.lawson-black-ballots]]. See [[cal.1962-08-27.voting-rights]]. Names: Scammon.'
    tags: [name:kennedy-john-f, name:scammon-richard-m]
  - id: cal.1963-03-22.opinion
    when: Mar. 22
    date: '1963-03-22'
    thread: opinion
    also: [cuba]
    c: 'Gallup, Mar. 8–13: the administration''s handling of Cuba in recent weeks, 52 percent satisfied, 33 dissatisfied.'
    n: '[[w.gallup-poll]], III, 1810.'
  - id: cal.1963-03-24.foreign-aid
    when: Mar. 24
    date: '1963-03-24'
    thread: foreign-aid
    c: 'The Clay Committee''s report, dated Mar. 20: "we are indeed attempting too much for too many." Its criteria would cut present programs about $500 million. Meany dissents. Kennedy''s reply released.'
    n: '[[w.world-scope-and-distribution-of]]. [Letter to General Clay in Response to a Report on the U.S. Military and Economic Assistance Programs](https://www.presidency.ucsb.edu/documents/letter-general-clay-response-report-the-us-military-and-economic-assistance-programs) (Mar. 22, 1963). [FRUS 1961–63, IX, doc. 160](https://history.state.gov/historicaldocuments/frus1961-63v09/d160). [[w.ruttan-united-states-development-assistance]]; [[w.smith-lucius-d-clay]]. See [[cal.1962-08-01.foreign-aid]]. Names: Clay, Meany.'
    tags: [name:clay-lucius-d, name:meany-george, name:kennedy-john-f]
  - id: cal.1963-03-25.court
    when: Mar. 25
    date: '1963-03-25'
    thread: court
    c: '*Gibson v. Florida Legislative Investigation Committee*, [372 U.S. 539](https://tile.loc.gov/storage-services/service/ll/usrep/usrep372/usrep372539/usrep372539.pdf). The committee may not compel the Miami NAACP''s membership list, 5–4. Goldberg for the Court; Harlan dissents.'
    n: '[[w.powe-warren-court-and-american]]; [[w.braukman-communists-and-perverts-under]]; [[w.stebenne-arthur-j-goldberg]]. See [[cal.1963-01-14.court]].'
    tags: [state:fl]
  - id: cal.1963-03-27.mississippi
    when: Mar. 27–30
    date: '1963-03-27'
    thread: mississippi
    also: [voting-rights]
    c: 'Greenwood police set a dog on Black citizens walking home from the registrar; a minister bitten. SNCC workers jailed. Mar. 30: the Justice Department sues for their release and against intimidation of voters. Apr. 4: the restraining order dropped, the workers freed. Check the terms.'
    n: '[Justice Department memorandum](https://www.crmvet.org/docs/630408_rfk_memo.pdf) (Apr. 8, 1963). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.zinn-sncc]]; [[w.landsberg-enforcing-civil-rights]]. See [[cal.1963-02-28.mississippi]].'
  - id: cal.1963-03-27.africa
    when: Mar. 27–29
    date: '1963-03-27'
    thread: africa
    c: 'Hassan II of Morocco on a state visit. The joint statement: American forces to be withdrawn from Morocco before the end of 1963, as agreed in 1959; Kennedy to help Morocco "use these bases constructively."'
    n: '[Remarks of Welcome at Union Station to King Hassan II of Morocco](https://www.presidency.ucsb.edu/documents/remarks-welcome-union-station-king-hassan-ii-morocco) (Mar. 27, 1963); [Joint Statement Following Discussions With King Hassan II of Morocco](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-king-hassan-ii-morocco) (Mar. 29, 1963). FRUS 1961–63, XXI, docs. [147](https://history.state.gov/historicaldocuments/frus1961-63v21/d147), [148](https://history.state.gov/historicaldocuments/frus1961-63v21/d148), [149](https://history.state.gov/historicaldocuments/frus1961-63v21/d149), [151](https://history.state.gov/historicaldocuments/frus1961-63v21/d151) (doc. 151: NSAM 232, Apr. 5). [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1961-10-06.africa]]. Names: Hassan II.'
    tags: [name:hassan-ii, name:kennedy-john-f]
  - id: cal.1963-03-29.desegregation-public-places-md
    when: Mar. 29
    date: '1963-03-29'
    thread: desegregation-public-places
    c: 'Maryland. The General Assembly passes the public accommodations act, ch. 227: places of public accommodation not to refuse service for race, in Baltimore City and some of the counties, the others excepted; in force June 1. The Commission on Interracial Problems'' powers widened.'
    n: Acts 1963, ch. 227; *Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf) (1964). *Maryland Manual*, 1963–64, [p. 241](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--241.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1962-03-09.desegregation-public-places-md]].
    tags: [state:md]
  - id: cal.1963-03-31.press-and-broadcasting
    when: Mar. 31
    date: '1963-03-31'
    thread: press-and-broadcasting
    c: New York newspaper strike ends after 114 days. The papers back Apr. 1.
    n: 'The settlements, union by union: Bureau of Labor Statistics, [*Analysis of Work Stoppages, 1962*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1381_1963.pdf), Bull. No. 1381 (1963), 20. [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-172) (Apr. 3, 1963). [*New York Times*, Apr. 1, 1963](https://timesmachine.nytimes.com/timesmachine/1963/04/01/issue.html). [[w.talese-kingdom-and-the-power]]; [[w.kluger-paper]]. See [[cal.1962-12-08.press-and-broadcasting]].'
  - id: cal.1963-03-31.opinion-5
    when: Mar. 31
    date: '1963-03-31'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Mar. 8–13: Republicans'' choice for 1964: Rockefeller 44, Goldwater 21, Romney 14, Scranton 9, Hatfield 2; no preference 10. Independents: Rockefeller 44, Goldwater 18. Democrats: Rockefeller 46, Goldwater 14.'
    n: '[[w.gallup-poll]], III, 1812. Names: Nelson Rockefeller, Romney, Scranton, Goldwater, Hatfield.'
    tags: [name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:scranton-william-w, name:hatfield-mark-o]
  - id: cal.1963-03.mayors-kansas-city
    when: Mar.
    date: 1963-03
    thread: mayors
    also: [elections-1963]
    c: Kansas City, Mo., elects Davis mayor, the Citizens Association's candidate, over Brookfield, by 1,810 votes of nearly 110,000.
    n: '[Wikipedia, "Ilus W. Davis"](https://en.wikipedia.org/wiki/Ilus_W._Davis); Kansas City Parks, ["Ilus Davis Park"](https://kcparks.org/?p=7233) (Check: the day, and the vote from the Board of Election Commissioners). [[w.peirce-great-plains-states-of]]. Names: Ilus Davis, Brookfield.'
    tags: [state:mo, city:kansas-city, name:davis-ilus-w, name:brookfield-dutton]
