  - id: cal.1965-07-01.vietnam
    when: July 1
    date: '1965-07-01'
    thread: vietnam-july-decision
    c: 'Four papers for Johnson. McNamara: the Viet Cong winning; American and third-country forces to 44 battalions, some 100,000 reservists called up, a quarantine of the North by mining its harbors. Ball, "A Compromise Solution": hold at the 72,000 men announced, open talks, cut losses. William Bundy, a "middle way": 18 battalions, about 85,000 men, for two months. Rusk: Hanoi must not take the South by force.'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 36–37 (McNamara''s memorandum, the battalions, the reserves; the four papers); [[w.johnson-vantage-point]], 144–53 (the decision of July 20–28; the papers of July 1 not treated); [[w.gibbons-u-s-government-and]], III, 326–30, 340 (Ball''s, Rusk''s and McNamara''s papers of July 1; William Bundy''s "middle way," 340, not its figures); [[w.moyar-triumph-forsaken]], 406–08; [[w.rusk-as-i-saw-it-1990]], 450 (Rusk''s view); [[w.preston-war-council]], 203–05 (the four papers; Bundy''s covering memorandum: "listen hard to George Ball and then reject his proposal"); [[w.mcnamara-in-retrospect]], ch. 7 at nn.41–44 (Ball''s, William Bundy''s and McNamara''s papers to the White House the night of July 1; Rusk''s added, unknown to McNamara). [[w.ball-past-has-another-pattern]], 398–99 ("A Compromise Solution for South Vietnam"; Bundy''s covering note); [[w.bird-color-of-truth]], 334 (William Bundy''s middle way, drafted June 30); [[w.drea-mcnamara-clifford-and-the-2011]], 36–37 (the revised memorandum; 44 battalions, 34 American; Bundy presents it with Rusk''s, Ball''s and William Bundy''s); [[w.barrett-uncertain-warriors]], 30 (the four papers sent by Bundy; McNamara: "the VC are winning now"; William Bundy''s "middle way" named). [FRUS 1964–68, III, doc. 38](https://history.state.gov/historicaldocuments/frus1964-68v03/d38); [doc. 39](https://history.state.gov/historicaldocuments/frus1964-68v03/d39); [doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40); [doc. 41](https://history.state.gov/historicaldocuments/frus1964-68v03/d41); [doc. 42](https://history.state.gov/historicaldocuments/frus1964-68v03/d42). To check: [[w.goldstein-lessons-in-disaster]]; [[w.reaching-for-glory]]; [[w.gibbons-u-s-government-and]] (cited by [[w.bird-color-of-truth]], 334 n.81). See [[cal.1965-06-07.vietnam]]. Also [[w.mcmaster-dereliction-of-duty-1997]]. Check: Gibbons, III, 340, dates Bundy''s memorandum June 30 and titles it "Holding on in South Viet-Nam." Names: Johnson, McNamara, Ball, William Bundy, Rusk. Check: Rusk recalls a White House meeting of July 1, Johnson, both Bundys, McNamara and Ball among those there, at which he advised sending another hundred thousand men ([[w.rusk-as-i-saw-it-1990]], 450).'
