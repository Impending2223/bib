    c: 'Mao, Hall of the People, Fujian Hall, afternoon: receives a Vietnamese National Assembly delegation under Hoàng Văn Hoan; Liu Shaoqi, Peng Zhen, Guo Moruo present. Of the war: eat American troops a mouthful at a time, division by division; China, with three armies, nine divisions, never matched one American division''s fire; a counter-revolution cannot meet a people''s war: it is blind, the people have eyes; but mobilization takes time. Geneva was not kept; the U.S. escalates and so will Vietnam. First politics with the military subordinate, then both, then the military first and politics guarding it.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 16, 1965; [[w.peng-zhen-nianpu-1902]], IV, 426 (July 16, 1965; Peng Zhen accompanies Mao and Liu Shaoqi receiving Hoàng Văn Hoan and the Vietnamese National Assembly delegation). [[w.77-conversations-between-chinese]], [87](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=85) (doc. 13; Beijing, July 16, 1965, no hour: Mao to Hoàng Văn Hoan, Geneva believed in by the Vietnamese and not kept by the enemy; the military struggle grown from secondary to equal to main; destroy a platoon, a company, a battalion, a regiment or two, four or five battalions a campaign, "escalate step by step"; 87 n.132, the National Assembly delegation). Made public: 1998. Check: the record (doc. 13, 87) has the bites by platoon, company, battalion and regiment, where the chronology has division by division. Names: Mao Zedong, Liu Shaoqi, Peng Zhen, Hoàng Văn Hoan, Guo Moruo.'
