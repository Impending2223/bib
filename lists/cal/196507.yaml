  - id: cal.1965-07-29.china
    when: July 29
    date: '1965-07-29'
    thread: china
    also: [south-asia]
    c: 'Foreign Ministry note to the Indian embassy: strong protest at India''s frequent violations of Chinese territory and airspace in the first half of 1965, on the Sino-Indian border and the China–Sikkim border: 26 crossings of the line of actual control or the Sikkim border. Cited among them are Indian reconnaissance across the line in the eastern sector, ten crossings at the Dhaji pass and other places in May and June, the two Chinese women taken May 29 and not returned, and 12 sorties by Indian aircraft over Xinjiang and Tibet, to a depth of about 170 kilometers. To cut the number of notes and ease relations, China will now, except for specially grave cases, protest once every half year.'
