  - id: cal.1965-07-03.vietnam
    when: July 3
    date: '1965-07-03'
    thread: vietnam
    also: [soviet-union]
    c: 'Rusk and Dobrynin, before Dobrynin''s leave: has Moscow accepted Hanoi''s veto? Gromyko''s "You stop first, then we''ll see" to Kohler; every American attempt at a confidential channel to Hanoi has failed; war and peace in Soviet and American hands. Dobrynin, under instructions: American policy changed for the worse since Kennedy; Rusk hurt. In Moscow, the Politburo: relations with the United States the priority, Vietnam not vital, but "international solidarity." By Dobrynin''s account.'
    n: '[[w.dobrynin-in-confidence]], 144–45. Names: Rusk, Dobrynin, Gromyko, Kohler.'
