  - id: cal.1965-07-02.vietnam-july-decision-2
    when: July 2
    date: '1965-07-02'
    thread: vietnam-july-decision
    also: [republican-party]
    c: 'Johnson and Eisenhower, by telephone, morning. Eisenhower: "When you once appeal to force in an international situation involving military help for a nation, you have to go all out." Johnson, by the notes of Eisenhower''s secretary: "Do you really think we can beat the Viet Cong?" Eisenhower: build up as fast as possible; without the British "We would still have the Australians and the Koreans, and our own convictions."'
    n: '[[w.barrett-uncertain-warriors]], 41 (the call; the quotations, from the notes of Eisenhower''s secretary, Lillian Brown); [[w.moyar-triumph-forsaken]], 409 (the call; Eisenhower''s "go all out," which Moyar prints "go all out!"). Check: the Eisenhower Library''s memorandum has 10:55 a.m.; the recording, 11:02. To check: [Johnson and Eisenhower, 11:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-july-2-1965), Conversation WH6507-01-8303 (Miller Center); Memorandum of telephone conversation, 10:55 a.m., July 2, 1965, Eisenhower Library (cited by [[w.barrett-uncertain-warriors]], 41 n.101; by [[w.moyar-triumph-forsaken]], 409 n.39, as Brown''s memorandum, Eisenhower Post-Presidential Papers, Augusta Series, box 10). See [[cal.1965-06-16.vietnam-2]]. Names: Johnson, Eisenhower.'
    src:
      c: d1feddd0
      rows:
        - 'w.barrett-uncertain-warriors 41: all'
        - 'via w.barrett-uncertain-warriors 41 n.101: all'
        - 'w.moyar-triumph-forsaken 409: A, B'
        - 'via w.moyar-triumph-forsaken 409 n.39: A, B'
    tags: [name:johnson-lyndon-b, name:eisenhower-dwight-d]
  - id: cal.1965-07-02.vietnam
    when: July 2
    date: '1965-07-02'
    thread: vietnam
    also: [vietnam-july-decision, vietnam-congress]
    c: 'Johnson and McNamara by telephone, 8:41 a.m. By Beschloss''s transcript as Moyar quotes it, Johnson on the Tonkin Gulf resolution: "we know ourselves, in our own conscience, that when we asked for this resolution, we had no intention of committing this many ground troops. We''re doing so now, and we know it''s going to be bad."'
    n: '[Johnson and McNamara, 8:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-july-2-1965), Conversation WH6507.01-8302 (Miller Center; not heard). [[w.moyar-triumph-forsaken]], 416. To check: [[w.reaching-for-glory]], 381–83 (cited by [[w.moyar-triumph-forsaken]], 416 n.67). See [[cal.1964-08-10.vietnam]]. Names: Johnson, McNamara.'
    src:
      c: af627bdb
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-july-2-1965: A'
        - 'w.moyar-triumph-forsaken 416: all'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1965-07-06.succession
    when: July 6
    date: '1965-07-06'
    thread: succession
    also: [amendments]
    c: Senate adopts the conference report on Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 1, [68–5](https://voteview.com/rollcall/RS0890139); the House had agreed June 30 by a two-thirds division, without a roll call. To the States, [79 Stat. 1327](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1327.pdf). Nebraska ratifies first, July 12.
    n: '[111 Cong. Rec., Senate, July 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-10-1.pdf); [111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). To check: [[w.feerick-twenty-fifth-amendment]]. See [[cal.1964-09-28.succession]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1965-07-08.vietnam
    when: July 8
    date: '1965-07-08'
    thread: vietnam
    also: [transition-and-staff]
    c: Taylor resigns as Ambassador to South Vietnam, his year done; letter of July 7. Lodge to go back in his place. July 9, at a news conference, Johnson denies any difference of policy behind the change.
