    c: 'Rolling Thunder 22 and 23 (July 9–22): seven targets above the 20th parallel; up to 550 armed reconnaissance sorties in fourteen days; leftover ordnance on road segments in Laos. F-105s and F-4Cs strike four of the northernmost, the Yen Son and Yen Bai ordnance depots first, 65 and 70 miles northwest of Hanoi: five missions and seven, some 54 and 60 percent destroyed. The fourteen days'' sorties: Air Force 233, VNAF 28, Navy 471; two Navy planes downed.'
