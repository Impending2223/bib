    c: 'The NSC: troops to Vietnam, no reserves called, no emergency declared, money asked later. That evening, the congressional leaders; Mansfield reads a statement of his doubts. Present at the leaders'' meeting: Senators Mansfield, Dirksen, Hickenlooper, Smathers, Kuchel and Long, Representatives McCormack, Ford, Arends, Boggs and Albert. Long: "Should we put in more men or take a whipping? We''d better go in." Dirksen: make the country realize this is "dangerous, serious business." Mansfield''s statement, by his notes: "whatever the basic commitment, it was abrogated with the assassination of Diem"; "escalation begets escalation."'
    n: 'FRUS 1964–68, III, docs. [93](https://history.state.gov/historicaldocuments/frus1964-68v03/d93), [94](https://history.state.gov/historicaldocuments/frus1964-68v03/d94), [96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]], III, 424–31; [[w.drea-mcnamara-clifford-and-the-2011]], 46 (the NSC; the leaders); [[w.poole-joint-chiefs-of-staff-2012]], 43 (no reserves); [[w.cosmas-joint-chiefs-of-staff-2012]], 309 (the NSC''s decision); [[w.johnson-vantage-point]], 148–51; [[w.herring-lbj-and-vietnam]], 35, 129, 131 (the NSC: Wheeler''s nod; Johnson''s question on 600,000 men, Resor''s answer; "I don''t want to be dramatic and cause tension"). [[w.mann-grand-delusion]], 454–57 (the NSC; the leaders; Mansfield''s statement). To check: notes of the NSC meeting, July 27, 1965, Meeting Notes File, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 131 n.45); Mansfield, notes on Vietnam, July 28, 1965, XXII, 102, Mansfield Papers (cited by [[w.mann-grand-delusion]], 457 n.54). See [[cal.1965-07-01.vietnam]]. Names: Johnson, Mansfield, Dirksen, Hickenlooper, Smathers, Kuchel, Long, McCormack, Ford, Arends, Boggs, Albert. Check: Mann, 455, leaves Kuchel out.'
