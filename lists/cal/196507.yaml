  - id: cal.1965-07-01.civil-rights-organizations-2
    when: July 1
    date: '1965-07-01'
    thread: civil-rights-organizations
    also: [civil-rights-the-executive]
    c: 'After Abernathy''s word at Atlanta that SCLC checks its associates with "FBI men," DeLoach to Mohr: statements to the press that the claim is "absolutely untrue," "so as to give the lie to Martin Luther King and his ilk." Hoover: anyone furnishing information to SCLC "will be dismissed."'
    n: '[[w.branch-at-canaans-edge]], 249–50 (by DeLoach''s report). To check: DeLoach to Mohr, July 1, 1965, FBI file on SCLC, serial 391; Baumgardner to Sullivan, July 1, 1965, FBI file on SCLC, serial 408 (cited by [[w.branch-at-canaans-edge]], 249–50). Made public: Check. Names: Abernathy, DeLoach, Martin Luther King, Hoover.'
