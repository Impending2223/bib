    c: 'Mao to Kang Sheng 康生 and Wu Lengxi 吴冷西: read, written very well. The paper is the Central Committee''s and State Council''s reply of July 10 to the CPSU''s letter of Apr. 17: it rejects the charge that China opposed a three-way summit of Vietnam, China and the USSR, charges Soviet appeasement of the U.S. over Vietnam and great-power chauvinism, and refuses to lay differences aside for "joint action."'
