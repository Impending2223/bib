    n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "People''s Democratic Republic of Korea," Kim''s points 1–9). Three paragraphs of the draft, on a shipyard and a list of steel, rails and trucks, are struck and marked for deletion. The talk is after July 4: Kim cites the Soviet deputy premier''s absence from the "recent" American national-day party of that date; and after the delegation''s visit to the Soviet Union and Eastern Europe, which he praises. The report: [[cal.1965.vietnam-hanoi]]. Names: Kim Il Sung, Deng Xiaoping, Peng Zhen, Brezhnev. Check: the day.'
