  - id: cal.1965-07-29.china-leadership
    when: July 29–31
    date: '1965-07-29'
    place: shanghai
    thread: china-leadership
    c: 'Zhou goes with Ne Win to the Jiangnan paper mill and the industrial exhibition at Shanghai (July 29); to the PLA''s Shanghai garrison and militia display (July 30); July 31 flies with Ne Win and wife to Kunming and tours Lake Dian; back to Beijing Aug. 1. July 29 also hears presentations of the Shanghai Opera House design. On the way to the display, July 30, Zhou to Ne Win on negotiating with the United States: what is not won on the battlefield is not won at the table, and China has had three experiences, Marshall''s mediation after the Second World War, whose agreements were torn up within months while the U.S. moved Kuomintang troops; the Korean armistice, signed on the lines held; and the ambassadorial talks, where the U.S. refused agreements on peaceful coexistence and on leaving the Taiwan Strait.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 747 (July 29–31, 1965); [[w.zhou-enlai-waijiao-huodong]], 471 (July 30, 1965; morning, Shanghai, on the way to the display; the book''s "上次我曾同主席阁下谈过" ("I told you before") read as said to Ne Win); [[w.zhou-enlai-waijiao-huodong]], 471 (July 30, 1965; morning, the PLA garrison and Shanghai militia display, Zhou with Ne Win); [[w.zhou-enlai-waijiao-huodong]], 470 (July 29, 1965; afternoon, the Jiangnan paper mill and the industrial exhibition with Ne Win); [[w.zhou-enlai-waijiao-huodong]], 472 (July 31, 1965; morning, with Ne Win and his wife by special plane from Shanghai to Kunming; afternoon, Lake Dian; Aug. 1, early morning, the farewell at Kunming airport; the book then has Zhou at the Peking airport that afternoon). Made public: 1993. The time is the first day''s. Names: Zhou Enlai, Ne Win.'
