    n: '[111 Cong. Rec. 15,467](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-8-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 314; [[w.gibbons-u-s-government-and]], III, 314–15. The Senate sat from noon to 2:04 p.m.: [Daily Digest, D358](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=356). Names: Morse.'
