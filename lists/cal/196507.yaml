  - id: cal.1965-07-01.civil-rights-organizations
    when: July 1–5
    date: '1965-07-01'
    thread: civil-rights-organizations
    c: 'CORE''s convention, Durham: "The Negro Ghetto—An Awakening Giant." McKissick in the chair. A resolution against the government''s policy abroad tabled on Farmer''s plea: the civil rights and peace movements not to be merged. Check.'
