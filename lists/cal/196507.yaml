    also: [mississippi]
    c: 'McComb, Miss. After John Shaw of the town is killed in Vietnam, a leaflet by Joe Martin and Clint Hopson, "five reasons why Negroes should not be in any war fighting for America," printed in the Freedom Democrats'' newsletter: "Mothers should encourage their sons not to go." Guyot and Ed King: not the party''s policy.'
