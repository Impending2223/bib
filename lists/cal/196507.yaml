  - id: cal.1965-07-21.vietnam
    when: July 21
    date: '1965-07-21'
    time: 1965-07-21T14:40Z
    place: washington
    thread: vietnam-july-decision
    c: 'Johnson''s meetings on the McNamara report: the principals, Ball arguing for a compromise.'
    n: 'FRUS 1964–68, III, docs. [71](https://history.state.gov/historicaldocuments/frus1964-68v03/d71) (Valenti''s notes of the morning meeting), [72](https://history.state.gov/historicaldocuments/frus1964-68v03/d72) (Cooper''s record of the three sessions). [[w.gibbons-u-s-government-and]], III, 399–406 (the meetings of July 21; Ball''s case to "cut our losses," 401–404); [[w.johnson-vantage-point]], 146–47; [[w.dallek-flawed-giant]], 274; [[w.herring-lbj-and-vietnam]], 129 (Ball''s warning from Korea, with charts; Bundy: the country "in the mood to accept grim news"); [[w.moyar-triumph-forsaken]], 411–13; [[w.clifford-counsel-to-the-president-2]], 411–13 (Clifford called in at 3 p.m.: Ball, McGeorge Bundy, Rusk, Lodge, McNamara; Ball for withdrawal, not a compromise); [[w.preston-war-council]], 206–07 (Bundy against Ball: "a radical switch without evidence that it should be done"; "We need to make clear that this a somber matter"); [[w.mcnamara-in-retrospect]], ch. 7 at n.52 (the report, dated July 20, presented July 21). [[w.ball-past-has-another-pattern]], 399–402 (the morning meeting and the 2:30 p.m. meeting, Ball''s case, Bundy''s and Rusk''s answers); [[w.califano-triumph-and-tragedy-of]], 36 (Ball''s "cobalt to a terminal cancer case"; Bundy for McNamara''s program; Rusk; Johnson on nuclear weapons if China came in); [[w.barrett-uncertain-warriors]], 51–53 (the 11:30 a.m. meeting in the Cabinet Room on McNamara''s proposal; Ball for cutting losses, the others against him); [[w.mann-grand-delusion]], 449–50 (the morning meeting in the Cabinet Room and the 2:30 p.m. session: Johnson''s questions; McNamara and Wheeler; Ball, "We can''t win," "a perilous voyage," "if the decision is to go ahead, I''m committed"; Rusk, McNamara, Bundy, Lodge and Wheeler for going ahead; not a "compromise"); [[w.johnson-white-house-diary]], 304 (a meeting at 11 with McNamara, just back from Vietnam, Rusk and Bundy, their cars still there at 5; not Ball); [[w.valenti-very-human-president]], 319–36 (July 21: the meeting at 10:40 a.m. of fifteen advisers in the Cabinet Room, Johnson joining at 11:30; the afternoon session from 2:30, Johnson in before 2:40, Ball presenting "We cannot win, Mr. President"; Ball does not propose a compromise in this account). See [[cal.1965-07-01.vietnam]]. Names: Johnson, McNamara, Ball. Check: Dallek, 274–75, and Cooper''s record give Ball''s case at the meetings as cutting losses, not the compromise of his paper of July 1.'
