# Cal. LXVIII July 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXVIII
entries:
  - id: cal.1965-07-01.vietnam
    when: July 1
    date: '1965-07-01'
    thread: vietnam-july-decision
    c: 'Four papers for Johnson. McNamara: the Viet Cong winning; American and third-country forces to 44 battalions, some 100,000 reservists called up, a quarantine of the North by mining its harbors. Ball, "A Compromise Solution": hold at the 72,000 men announced, open talks, cut losses. William Bundy, a "middle way": 18 battalions, about 85,000 men, for two months. Rusk: Hanoi must not take the South by force.'
    n: 'FRUS 1964–68, III, docs. [38](https://history.state.gov/historicaldocuments/frus1964-68v03/d38), [39](https://history.state.gov/historicaldocuments/frus1964-68v03/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v03/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v03/d42). [[w.drea-mcnamara-clifford-and-the-2011]], 36–37; [[w.johnson-vantage-point]], 144–53 (the decision of July 20–28; the papers of July 1 not treated). To check: [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]; [[w.ball-past-has-another-pattern]]; [[w.clifford-counsel-to-the-president-2]]; [[w.reaching-for-glory]]. See [[cal.1965-06-07.vietnam]]. Also [[w.mcmaster-dereliction-of-duty-1997]]; [[w.gibbons-u-s-government-and]], III, 326–330. Names: Johnson, McNamara, Ball, William Bundy, Rusk.'
    tags: [name:mcnamara-robert-s, name:ball-george-w, name:bundy-william, name:rusk-dean, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1965-07-01.civil-rights-organizations
    when: July 1–5
    date: '1965-07-01'
    thread: civil-rights-organizations
    c: 'CORE''s convention, Durham: "The Negro Ghetto—An Awakening Giant." McKissick in the chair. A resolution against the government''s policy abroad tabled on Farmer''s plea: the civil rights and peace movements not to be merged. Check.'
    n: 'CORE, [1965 Convention Schedule](https://www.crmvet.org/docs/6507_core_conventionagenda.pdf). *Daily Tar Heel*, [July 8, 1965](https://newspapers.digitalnc.org/lccn/sn92073228/1965-07-08/ed-1/seq-4/), editorial. To check: [[w.meier-core]]; [[w.farmer-lay-bare-the-heart]]. Names: Farmer, McKissick.'
    tags: [name:farmer-james, name:mckissick-floyd-b]
  - id: cal.1965-07-01.antisubversion-fl
    when: July 1
    date: '1965-07-01'
    thread: antisubversion
    c: The Florida Legislative Investigation Committee, refused further funds by the 1965 session, goes out of existence. Its files, some 30,000 pages, kept sealed by the legislature.
    n: 'Made public: the files, the names blacked out but for the committee''s members, staff and public officials, in the Florida State Archives, by the legislature''s leave, 1993. [Wikipedia, "Florida Legislative Investigation Committee"](https://en.wikipedia.org/wiki/Florida_Legislative_Investigation_Committee). To check: [[w.braukman-communists-and-perverts-under]]. See [[cal.1964-01.antisubversion-fl]]. Names: Johns.'
    tags: [name:johns-charley-e, state:fl]
  - id: cal.1965-07-01.state-constitutions-ct
    when: July 1
    date: '1965-07-01'
    thread: state-constitutions
    c: Connecticut's constitutional convention, 42 Democrats and 42 Republicans, opens in the Old State House at Hartford. Baldwin, once governor, chairman; Grasso, Secretary of the State, and Alcorn floor leaders.
    n: '[Conn. *Register and Manual*, 1966, pp. 46–48](https://archive.org/details/register66conn/page/n49). To check: [[w.horton-connecticut-state-constitution]]. See [[cal.1965-01-05.state-constitutions-ct]]. Names: Baldwin, Grasso, Alcorn.'
    tags: [state:ct, name:baldwin-raymond-e, name:grasso-ella-t, name:alcorn-h-meade]
  - id: cal.1965-07-02.vietnam-july-decision
    when: July 2
    date: '1965-07-02'
    thread: vietnam-july-decision
    c: 'Johnson puts off the decisions to the end of the month: McNamara to Saigon in mid-July; Harriman to Moscow on a reconvened Geneva conference; Ball to explore contacts with Hanoi and the Viet Cong.'
    n: '[[w.dallek-flawed-giant]], 272 (from McGeorge Bundy''s manuscript history). See [[cal.1965-07-01.vietnam]]. Names: Johnson, McNamara, Harriman, Ball.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:harriman-w-averell, name:ball-george-w]
  - id: cal.1965-07-06.succession
    when: July 6
    date: '1965-07-06'
    thread: succession
    also: [amendments]
    c: Senate adopts the conference report on Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 1, [68–5](https://voteview.com/rollcall/RS0890139); the House had agreed June 30 by a two-thirds division, without a roll call. To the States, [79 Stat. 1327](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1327.pdf). Nebraska ratifies first, July 12.
    n: '[111 Cong. Rec., Senate, July 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-10-1.pdf); [111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). To check: [[w.feerick-twenty-fifth-amendment]]. See [[cal.1964-09-28.succession]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1965-07-08.vietnam
    when: July 8
    date: '1965-07-08'
    thread: vietnam
    also: [transition-and-staff]
    c: Taylor resigns as Ambassador to South Vietnam, his year done; letter of July 7. Lodge to go back in his place. July 9, at a news conference, Johnson denies any difference of policy behind the change.
    n: 'The President''s News Conference, [1965 Pub. Papers 725](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=199) (July 9, 1965). [[w.cosmas-joint-chiefs-of-staff-2012]], 306. To check: [[w.taylor-swords-and-plowshares]]. See [[cal.1964-06-23.vietnam]]; [[cal.1965-07-01.vietnam]]. Names: Taylor, Lodge, Johnson.'
    tags: [name:taylor-maxwell, name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1965-07-09.medicare
    when: July 9
    date: '1965-07-09'
    thread: medicare
    also: [welfare]
    c: Senate passes the Social Security amendments, H.R. 6675, hospital and medical insurance for the aged, [68–21](https://voteview.com/rollcall/RS0890151). An amendment to strike both, [26–64](https://voteview.com/rollcall/RS0890145); Prouty's, $35 a month in Social Security for all 72 and over not otherwise covered, tabled, [55–36](https://voteview.com/rollcall/RS0890144). To conference.
    n: '[111 Cong. Rec., Senate, July 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-3-1.pdf). Statement by the President Following Passage of the Medicare Bill by the Senate, [1965 Pub. Papers 730](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=204) (July 9, 1965). See [[cal.1965-01-07.medicare]]. Names: Prouty.'
    tags: [name:prouty-winston-l, name:johnson-lyndon-b]
  - id: cal.1965-07-09.voting-rights
    when: July 9
    date: '1965-07-09'
    thread: voting-rights
    c: House passes the voting rights bill, H.R. 6400, [333–85](https://voteview.com/rollcall/RH0890087), with a ban on the poll tax in State elections. The Republican substitute of Ford and McCulloch, H.R. 7896, lost on a motion to recommit, [171–248](https://voteview.com/rollcall/RH0890086). July 10, Johnson's statement names the House Republican leadership as having tried to weaken the bill.
    n: '[111 Cong. Rec., House, July 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-3-2.pdf). Statement by the President Following Passage of the Voting Rights Bill by the House of Representatives, [1965 Pub. Papers 731](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=205) (July 10, 1965). See [[cal.1965-03-15.voting-rights]]. Names: Ford, McCulloch, Celler, Johnson.'
    tags: [name:ford-gerald-r, name:mcculloch-william-m, name:celler-emanuel, name:johnson-lyndon-b]
  - id: cal.1965-07-12.european-community
    when: July 12
    date: '1965-07-12'
    thread: european-community
    c: 'Ball to Luns on the empty chair: an affair for the Six.'
    n: 'FRUS 1964–68, XIII, docs. [93](https://history.state.gov/historicaldocuments/frus1964-68v13/d93) (Ball and the Italian ambassador, July 6), [98](https://history.state.gov/historicaldocuments/frus1964-68v13/d98) (circular, July 15). Check: the record of the talk with Luns. See [[cal.1965-06-30.european-community]]. Names: Ball.'
    tags: [name:ball-george-w]
  - id: cal.1965-07-13.court
    when: July 13
    date: '1965-07-13'
    thread: court
    also: [civil-rights-the-executive]
    c: News conference. Thurgood Marshall, of the Second Circuit, named Solicitor General, the 33d; he leaves the bench. Cox goes back to Massachusetts. Confirmed Aug. 11, without a roll call; sworn Aug. 24.
    n: 'The President''s News Conference, [1965 Pub. Papers 735](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=209) (July 13, 1965); Remarks at the Swearing In of Judge Thurgood Marshall as Solicitor General, [1965 Pub. Papers 910](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=384) (Aug. 24, 1965). [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). To check: [[w.williams-thurgood-marshall]]. Names: Marshall, Cox.'
    tags: [name:johnson-lyndon-b, name:marshall-thurgood, name:cox-archibald]
  - id: cal.1965-07-13.transportation
    when: July 13
    date: '1965-07-13'
    thread: transportation
    c: 'Ribicoff''s Subcommittee on Executive Reorganization, on the federal role in traffic safety: Donner, chairman, and Roche, president, of General Motors. Robert Kennedy presses them on GM''s spending on safety research.'
    n: 'Daily Digest, [111 Cong. Rec. D378](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=376) (July 13, 1965). *Federal Role in Traffic Safety: Hearings before the Subcommittee on Executive Reorganization of the Senate Committee on Government Operations*, 89th Cong., 1st sess. (1965) (Check the part). To check: [[w.mashaw-struggle-for-auto-safety]]; [[w.eastman-styling-vs-safety]]. See [[cal.1964-03-23.transportation]]. Names: Ribicoff, Robert Kennedy, Donner, Roche.'
    tags: [name:ribicoff-abraham, name:donner-frederic-g, name:roche-james-m, name:kennedy-robert-f]
  - id: cal.1965-07-14.transition-and-staff
    when: July 14
    date: '1965-07-14'
    thread: transition-and-staff
    c: Stevenson dies in London, of a heart attack in the street. July 20, Goldberg named from the Court to the United Nations; sworn July 26.
    n: 'Statement by the President on the Death of Adlai Stevenson, [1965 Pub. Papers 748](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=222) (July 14, 1965); [Executive Order 11233—Adlai E. Stevenson](https://www.presidency.ucsb.edu/documents/executive-order-11233-adlai-e-stevenson) (July 14, 1965); Remarks Upon Announcing the Nomination of Arthur J. Goldberg as U.S. Representative to the United Nations, [1965 Pub. Papers 765](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=239) (July 20, 1965); Remarks at the Swearing In of Arthur J. Goldberg as U.S. Representative to the United Nations, [1965 Pub. Papers 786](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=260) (July 26, 1965). To check: [[w.martin-adlai-stevenson-and-the]]; [[w.stebenne-arthur-j-goldberg]]; [[w.murphy-fortas]]. Names: Stevenson, Goldberg.'
    tags: [name:stevenson-adlai-e, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1965-07-14.welfare
    when: July 14
    date: '1965-07-14'
    thread: welfare
    c: 'Older Americans Act signed, [79 Stat. 218](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg218.pdf): an Administration on Aging in HEW; grants to the States for community planning and services for the aged, research, and training. The Fogarty–McNamara bill; the House passed it Mar. 31, [396–1](https://voteview.com/rollcall/RH0890027).'
    n: 'Remarks at the Signing of the Older Americans Act, [1965 Pub. Papers 744](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=218) (July 14, 1965). To check: [[w.sundquist-politics-and-policy]]. Names: Fogarty, Patrick McNamara.'
    tags: [name:johnson-lyndon-b, name:fogarty-john-e, name:mcnamara-patrick-v]
  - id: cal.1965-07-16.vietnam-july-decision
    when: July 16
    date: '1965-07-16'
    thread: vietnam-july-decision
    c: 'Johnson to Vance: no supplemental request to Congress of more than $300 to $400 million before January; a larger one "will kill" the domestic program.'
    n: '[[w.dallek-flawed-giant]], 274. To check: [[w.vandemark-into-the-quagmire]]. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Vance.'
    tags: [name:johnson-lyndon-b, name:vance-cyrus]
  - id: cal.1965-07-18.opinion
    when: July 18
    date: '1965-07-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, June 24–29: those approving the Administration''s handling of Vietnam: Johnson knows the situation 40 percent; contain communism 24; we are committed 14. Those disapproving: none of our business 23; be more aggressive 18; too many boys killed 18. If South Vietnam stops fighting: the United States to go on alone 19, withdraw 65.'
    n: '[[w.gallup-poll]], III, 1951. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-18.mississippi
    when: July 18
    date: '1965-07-18'
    thread: mississippi
    c: Jackson, the Heidelberg Hotel. At the call of Claude Ramsey, president of the State AFL-CIO, some 125 moderates, three-fourths of them white, found the Mississippi Democratic Conference, to bring a loyal party back to the national Democrats; Robert Oswald of Pascagoula chairman, Charles Young vice chairman. The Freedom Democrats not invited.
    n: '[[w.dittmer-local-people]], 346–48. Names: Ramsey, Oswald, Young.'
    tags: [state:ms, city:jackson, name:ramsey-claude, name:oswald-robert, name:young-charles]
  - id: cal.1965-07-19.court
    when: July 19
    date: '1965-07-19'
    thread: court
    c: 'Fortas to Johnson, declining Goldberg''s seat "with a heart full of gratitude": he can serve the Johnsons and his firm better off the Court.'
    n: '[[w.dallek-flawed-giant]], 235 (Fortas to Johnson, July 19, 1965, WHCF: CF: EX/FG535, LBJ Library). See [[cal.1965-05-10.court]]. Names: Fortas, Johnson, Goldberg.'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:goldberg-arthur-j]
  - id: cal.1965-07-20.vietnam
    when: July 20
    date: '1965-07-20'
    thread: vietnam-july-decision
    c: 'McNamara, back from Saigon with Lodge and Wheeler, to Johnson: American battalions from 15 to 34 by October, about 175,000 men, perhaps 100,000 more early in 1966; some 235,000 reservists and guardsmen called up; the regular forces up 375,000; a supplemental appropriation. Taylor, Lodge, Westmoreland, Sharp, and Wheeler concur in the military recommendations.'
    n: '[FRUS 1964–68, III, doc. 67](https://history.state.gov/historicaldocuments/frus1964-68v03/d67). [[w.gibbons-u-s-government-and]], III, 380–387; [[w.drea-mcnamara-clifford-and-the-2011]], 40–43; [[w.poole-joint-chiefs-of-staff-2012]], 43; [[w.cosmas-joint-chiefs-of-staff-2012]], 308; [[w.johnson-vantage-point]], 145–46. See [[cal.1965-07-01.vietnam]]. Names: McNamara, Wheeler, Taylor, Westmoreland, Sharp, Lodge, Johnson.'
    tags: [name:mcnamara-robert-s, name:lodge-henry-cabot, name:wheeler-earle, name:taylor-maxwell, name:westmoreland-william, name:sharp-u-s-grant, name:johnson-lyndon-b, place:saigon]
  - id: cal.1965-07-21.vietnam
    when: July 21
    date: '1965-07-21'
    thread: vietnam-july-decision
    c: 'Johnson''s meetings on the McNamara report: the principals, Ball arguing for a compromise.'
    n: '[FRUS 1964–68, III, doc. 71](https://history.state.gov/historicaldocuments/frus1964-68v03/d71). [[w.gibbons-u-s-government-and]], III, 392–399; [[w.johnson-vantage-point]], 146–47; [[w.dallek-flawed-giant]], 274. See [[cal.1965-07-01.vietnam]]. Names: Johnson, McNamara, Ball.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:ball-george-w, name:rusk-dean, name:wheeler-earle, name:bundy-mcgeorge]
  - id: cal.1965-07-22.vietnam
    when: July 22
    date: '1965-07-22'
    thread: vietnam-july-decision
    c: Johnson with the Joint Chiefs and the service secretaries, then Clifford, McCloy, and Dean.
    n: 'FRUS 1964–68, III, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v03/d76), [78](https://history.state.gov/historicaldocuments/frus1964-68v03/d78). [[w.gibbons-u-s-government-and]], III, 400–413; [[w.drea-mcnamara-clifford-and-the-2011]], 13; [[w.poole-joint-chiefs-of-staff-2012]], 43; [[w.johnson-vantage-point]], 148. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Clifford, McCloy, Dean.'
    tags: [name:johnson-lyndon-b, name:clifford-clark, name:mccloy-john-j, name:dean-arthur-h, name:wheeler-earle]
  - id: cal.1965-07-23.economy
    when: July 23
    date: '1965-07-23'
    thread: economy
    c: Coinage Act signed, [79 Stat. 254](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg254.pdf). No silver in new dimes and quarters, clad copper-nickel on copper; the half dollar 40 percent silver. The silver dollar unchanged. The House passed it July 14, [255–154](https://voteview.com/rollcall/RH0890092), 40 percent silver in dimes and quarters refused, [187–218](https://voteview.com/rollcall/RH0890091).
    n: '[Remarks at the Signing of the Coinage Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-coinage-act) (July 23, 1965). [111 Cong. Rec., House, July 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-6-2.pdf). See [[cal.1965-06-03.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-23.crime-and-hijacking
    when: July 23
    date: '1965-07-23'
    thread: crime-and-hijacking
    c: 'Executive order: a President''s Commission on Law Enforcement and Administration of Justice, a final report within eighteen months. July 26, Katzenbach its chairman, eighteen members named.'
    n: '[Executive Order 11236—Establishing the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/executive-order-11236-establishing-the-presidents-commission-law-enforcement-and) (July 23, 1965), [30 Fed. Reg. 9349](https://www.govinfo.gov/app/details/FR-1965-07-27); Statement by the President on Establishing the President''s Commission on Law Enforcement and Administration of Justice, [1965 Pub. Papers 785](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=259) (July 26, 1965). To check: [[w.justice-challenge-of-crime-in]]; [[w.flamm-law-and-order]]. Names: Katzenbach.'
    tags: [name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-07-24.vietnam
    when: July 24
    date: '1965-07-24'
    thread: vietnam
    c: An F-4C, the first American plane lost to a SAM.
    n: '[FRUS 1964–68, III, doc. 84](https://history.state.gov/historicaldocuments/frus1964-68v03/d84). Check: the record. [[w.gibbons-u-s-government-and]], III, 419; [[w.vietnam-victory-in-vietnam]], 165, 167 (two battalions of the new missile force, at 3:53 p.m.: one F-4C down, a pilot captured); [[w.staaveren-gradual-failure]], 163. See [[cal.1965-03-02.vietnam]].'
  - id: cal.1965-07-25.opinion
    when: July 25
    date: '1965-07-25'
    thread: opinion
    also: [immigration]
    c: 'Gallup, June 24–29: in admitting immigrants, very important: occupational skills 71 percent; relatives who are citizens 55; country of birth 33. Immigration kept at its present level 39, decreased 33, increased 8. Admit those who escape communism, 64. Admission by skills instead of the quotas: favor 51, oppose 32.'
    n: '[[w.gallup-poll]], III, 1952–53.'
  - id: cal.1965-07-25.vietnam
    when: July 25–26
    date: '1965-07-25'
    thread: vietnam-july-decision
    c: Camp David, Johnson's meetings go on; Clifford against more troops.
    n: 'FRUS 1964–68, III, docs. [85](https://history.state.gov/historicaldocuments/frus1964-68v03/d85), [87](https://history.state.gov/historicaldocuments/frus1964-68v03/d87), [90](https://history.state.gov/historicaldocuments/frus1964-68v03/d90) (July 26). [[w.gibbons-u-s-government-and]], III, 416–418; [[w.johnson-vantage-point]], 148. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Clifford.'
    tags: [name:johnson-lyndon-b, name:clifford-clark]
  - id: cal.1965-07-26.confirmations
    when: July 26
    date: '1965-07-26'
    thread: confirmations
    also: [court]
    c: Senate confirms J. P. Coleman, governor of Mississippi 1956–60, to the Fifth Circuit, [76–8](https://voteview.com/rollcall/RS0890173).
    n: '[111 Cong. Rec., Senate, July 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-6-2.pdf). To check: [[w.bass-unlikely-heroes]]. Names: J. P. Coleman.'
    tags: [name:coleman-j-p]
  - id: cal.1965-07-26.vietnam
    when: July 26–Aug. 5
    date: '1965-07-26'
    thread: vietnam
    c: 'SIGMA II-65, the Joint Chiefs'' politico-military game at the Pentagon, senior officials reviewing it at the end: the Communist teams counted on the long run, "the 1968 U.S. elections, ten and even twenty years beyond"; the Viet Cong hard to "find and fix"; the bombing absorbed. Rostow to William Bundy: an indecisive war of many American troops "could produce political frustration in the U.S."'
    n: 'SIGMA II-65, Final Report, Aug. 20, 1965 (declassified for Gibbons; Check: not read); Rostow to William Bundy, Aug. 5, 1965 (State, S/P Chron File). [[w.gibbons-u-s-government-and]], IV, 17–19. Names: Rostow, William Bundy.'
    tags: [name:rostow-walt-w, name:bundy-william]
  - id: cal.1965-07-27.health
    when: July 27
    date: '1965-07-27'
    thread: health
    c: 'Federal Cigarette Labeling and Advertising Act signed, without ceremony, [79 Stat. 282](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg282.pdf). On every pack from Jan. 1, 1966, "Caution: Cigarette Smoking May Be Hazardous to Your Health." No other statement required on packs, and none in advertising, by any agency or State; the advertising clause to July 1, 1969. Conference report, House, July 13, [286–103](https://voteview.com/rollcall/RH0890090).'
    n: '[111 Cong. Rec., House, July 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-5-1.pdf). See [[cal.1965-06-16.health]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-27.transition-and-staff
    when: July 27
    date: '1965-07-27'
    thread: transition-and-staff
    also: [school-aid]
    c: Celebrezze to the Sixth Circuit. Gardner, president of the Carnegie Corporation, a Republican, to be Secretary of Health, Education, and Welfare; sworn Aug. 18.
    n: 'Remarks on Announcing the Nominations of Anthony J. Celebrezze as Judge, U.S. Court of Appeals, Sixth Circuit, and John W. Gardner as Secretary of Health, Education, and Welfare, [1965 Pub. Papers 788](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=262) (July 27, 1965); Remarks at the Swearing In of Dr. John W. Gardner as Secretary of Health, Education, and Welfare, [1965 Pub. Papers 892](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=366) (Aug. 18, 1965). See [[cal.1965-01-20.transition-and-staff]]. Names: Celebrezze, Gardner.'
    tags: [name:johnson-lyndon-b, name:celebrezze-anthony-j, name:gardner-john-w]
  - id: cal.1965-07-27.state-and-city-finance-us
    when: July 27
    date: '1965-07-27'
    thread: state-and-city-finance
    also: [states-and-cities, poverty]
    c: 'National Governors'' Conference at Minneapolis, July 25–29. July 27, on Sanders''s motion: for study of returning a share of federal tax revenues to the States "without federal controls," and a presidential task force with State and local members; grants-in-aid, $3.1 billion a decade before, now more than $13 billion. Against any cut in a governor''s veto under the Economic Opportunity Act, which the House has voted to let the director override.'
    n: '[*Proceedings of the National Governors'' Conference, 1965*, 268–271](https://www.nga.org/wp-content/uploads/2021/03/1965NGAAnnualMeeting.pdf#page=147). To check: [[w.dommel-politics-of-revenue-sharing]]. See [[cal.1964-10-28.state-and-city-finance-us]]; [[cal.1964-07-23.poverty]]. Names: Sanders.'
    tags: [name:sanders-carl-e]
  - id: cal.1965-07-27.vietnam
    when: July 27
    date: '1965-07-27'
    thread: vietnam-july-decision
    c: 'The NSC: troops to Vietnam, no reserves called, no emergency declared, money asked later. That evening, the congressional leaders; Mansfield reads a statement of his doubts.'
    n: 'FRUS 1964–68, III, docs. [93](https://history.state.gov/historicaldocuments/frus1964-68v03/d93), [94](https://history.state.gov/historicaldocuments/frus1964-68v03/d94), [96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]], III, 421–435; [[w.drea-mcnamara-clifford-and-the-2011]], 46; [[w.poole-joint-chiefs-of-staff-2012]], 43; [[w.johnson-vantage-point]], 148–51. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Mansfield.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike]
  - id: cal.1965-07-27.vietnam-2
    when: July 27
    date: '1965-07-27'
    thread: vietnam
    c: 'American planes strike two SAM sites in the North, west of Hanoi: six of the 54 aircraft lost, neither site occupied.'
    n: 'The decision, July 26: [FRUS 1964–68, III, doc. 90](https://history.state.gov/historicaldocuments/frus1964-68v03/d90); the F-4 lost July 24: [doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v03/d87), n. 2. [[w.frankum-like-rolling-thunder]], 31–32; [[w.vietnam-victory-in-vietnam]], 167 (decoy sites ringed with 120 guns: five aircraft destroyed of 48 sorties); [[w.staaveren-gradual-failure]], 164–167. See [[cal.1965-03-02.vietnam]].'
  - id: cal.1965-07-28.vietnam
    when: July 28
    date: '1965-07-28'
    thread: vietnam-july-decision
    c: 'News conference, the East Room, midday: "Why are we in Viet-Nam?" The Air Mobile Division and other forces ordered, from 75,000 men to 125,000 "almost immediately"; more later as asked. The monthly draft call from 17,000 to 35,000. Reserves not called now. Goldberg to carry a letter to U Thant.'
    n: 'The President''s News Conference, [1965 Pub. Papers 794](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=268) (July 28, 1965). [FRUS 1964–68, III, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v03/d97). [[w.gibbons-u-s-government-and]], III, 436–443; [[w.drea-mcnamara-clifford-and-the-2011]], 47; [[w.poole-joint-chiefs-of-staff-2012]], 43; [[w.cosmas-joint-chiefs-of-staff-2012]], 309. See [[cal.1965-07-01.vietnam]]; [[cal.1965-07-21.vietnam]]. Names: Goldberg, U Thant.'
    tags: [name:johnson-lyndon-b, name:goldberg-arthur-j, name:u-thant, name:westmoreland-william]
  - id: cal.1965-07-28.court
    when: July 28
    date: '1965-07-28'
    thread: court
    c: 'The same news conference: Fortas named to Goldberg''s seat, "the job has sought the man." Hearing Aug. 5; confirmed Aug. 11, without a roll call.'
    n: 'The President''s News Conference, [1965 Pub. Papers 794](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=268) (July 28, 1965). [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). [[w.dallek-flawed-giant]], 235. To check: [[w.murphy-fortas]]. See [[cal.1965-07-14.transition-and-staff]]. Names: Fortas, Goldberg.'
    tags: [name:johnson-lyndon-b, name:fortas-abe, name:goldberg-arthur-j]
  - id: cal.1965-07-28.jobs-and-wages
    when: July 28
    date: '1965-07-28'
    thread: jobs-and-wages
    c: House passes H.R. 77, repealing section 14(b) of the Taft-Hartley Act, the States' right-to-work laws, [221–203](https://voteview.com/rollcall/RH0890101); recommittal lost, [200–223](https://voteview.com/rollcall/RH0890100). The rule taken July 26, [248–171](https://voteview.com/rollcall/RH0890096). To the Senate.
    n: '[111 Cong. Rec., House, July 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-1-2.pdf). Repeal of section 14(b) (K–J Cong. II.J.2). To check: [[w.zelizer-fierce-urgency-of-now]].'
  - id: cal.1965-07-28.vietnam-us
    when: July 28
    date: '1965-07-28'
    thread: vietnam
    also: [states-and-cities]
    c: The governors at Minneapolis watch Johnson's news conference on television. Sanders moves their support of "the position of the President." Romney's motion to wait for the briefing at the White House the next day, seconded by Hatfield, lost by voice; Sanders's carried by voice, Hatfield's reservations on the record.
    n: '[*Proceedings of the National Governors'' Conference, 1965*, 91–96](https://www.nga.org/wp-content/uploads/2021/03/1965NGAAnnualMeeting.pdf#page=58). News Conference, [1965 Pub. Papers 794](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=268). [[w.gibbons-u-s-government-and]], III, 451–452. See [[cal.1965-07-28.vietnam]]. Names: Johnson, Sanders, Romney, Hatfield.'
    tags: [name:johnson-lyndon-b, name:sanders-carl-e, name:romney-george-w, name:hatfield-mark-o]
  - id: cal.1965-07-28.voting-rights
    when: July 28
    date: '1965-07-28'
    thread: voting-rights
    c: 'Cleveland. Katzenbach telephones King at his hotel: the House conferees Rodino and Donohue hold the voting bill on the poll tax ban. King lets him say the Senate''s milder language is acceptable. July 29, Katzenbach passes the word; the House conferees yield that afternoon.'
    n: '[[w.garrow-bearing-the-cross]], 435. Check: the conference committee''s record. See [[cal.1965-07-09.voting-rights]]. Names: Katzenbach, King, Rodino, Donohue.'
    tags: [name:katzenbach-nicholas, name:king-martin-luther-jr, name:rodino-peter-w-jr, name:donohue-harold-d, state:oh, city:cleveland]
  - id: cal.1965-07-29.medicare
    when: July 29
    date: '1965-07-29'
    thread: medicare
    c: 'Eleven officers of the American Medical Association at the White House. Johnson, quoting Byrnes: past quarrels done, the program to be made to work. He asks for doctors to serve Vietnam''s civilians by turns; they promise a program. Before the reporters Moyers calls in, the Association''s president: "we have every intention of obeying the new law."'
    n: '[[w.dallek-flawed-giant]], 210. To check: [[w.califano-triumph-and-tragedy-of]]; [[w.johnson-vantage-point]]. See [[cal.1965-01-07.medicare]]. Names: Johnson, Byrnes, Moyers. Check: Dallek''s text gives July 30, the day of the signing at Independence; his note, the Diary Backup of July 29 (210 n.73). The Daily Diary of July 30 shows no such meeting through 1:20 p.m. ([July 30, 1965](https://catalog.archives.gov/id/192456), images 1–2).'
    tags: [name:johnson-lyndon-b, name:byrnes-john-w, name:moyers-bill]
  - id: cal.1965-07-30.medicare
    when: July 30
    date: '1965-07-30'
    thread: medicare
    also: [welfare, health]
    c: Social Security Amendments of 1965 signed at the Truman Library, Independence, Truman beside him, [79 Stat. 286](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg286.pdf). Hospital insurance for those over 65 under Social Security, up to 90 days for each illness; a voluntary plan for doctors' fees, $3 a month matched by the Government; Medicaid, grants to the States for the medically needy. Benefits up 7 percent. Conference report, House, July 27, [307–116](https://voteview.com/rollcall/RH0890097); Senate, July 28, [70–24](https://voteview.com/rollcall/RS0890174).
    n: 'Remarks With President Truman at the Signing in Independence of the Medicare Bill, [1965 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=285) (July 30, 1965). [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, July 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-1-1.pdf). Statute (K–J Cong. II.J.2). [President''s Daily Diary, July 30, 1965](https://catalog.archives.gov/id/192456), images 4, 5, 6 (LBJ Library; National Archives Catalog). [[w.zelizer-taxing-america]], 247–52 (the act''s three parts, the conference, the votes). To check: [[w.harris-sacred-trust]]; [[w.corning-evolution-of-medicare]]; [[w.marmor-politics-of-medicare]]; [[w.david-with-dignity]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.blumenthal-heart-of-power]]; [[w.berkowitz-mr-social-security]]. See [[cal.1965-01-07.medicare]]; [[cal.1965-07-09.medicare]]. Names: Johnson, Truman.'
    tags: [name:johnson-lyndon-b, name:truman-harry-s, bill:medicare-1965]
  - id: cal.1965-07.war-opposition
    when: July
    date: 1965-07
    thread: war-opposition
    also: [mississippi]
    c: 'McComb, Miss. After John Shaw of the town is killed in Vietnam, a leaflet by Joe Martin and Clint Hopson, "five reasons why Negroes should not be in any war fighting for America," printed in the Freedom Democrats'' newsletter: "Mothers should encourage their sons not to go." Guyot and Ed King: not the party''s policy.'
    n: '[[w.dittmer-local-people]], 349–51 (the quotations, 350). Names: Ed King, Shaw, Martin, Hopson, Guyot.'
    tags: [state:ms, name:king-edwin, name:shaw-john, name:martin-joe, name:hopson-clint, name:guyot-lawrence]
