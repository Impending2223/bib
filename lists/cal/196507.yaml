  - id: cal.1965-07-08.vietnam-july-decision
    when: July 8
    date: '1965-07-08'
    thread: vietnam-july-decision
    c: 'The panel of former officials, Acheson, Bradley, Clifford, Gilpatric, McCloy and others, with Rusk and McNamara, then Johnson: the stakes "very high indeed"; no choice but to put in the forces needed and explain it to the country. Johnson laments; by William Bundy''s account, Acheson tells him to press on.'
    n: '[FRUS 1964–68, III, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v03/d55) (the panel''s highlights: Bradley, Gilpatric, Kistiakowsky, Larson and McCloy). [[w.dallek-flawed-giant]], 272–73. To check: William Bundy''s manuscript history, chap. 27, 15–21, LBJ Library (cited by [[w.dallek-flawed-giant]], 273). See [[cal.1965-07-01.vietnam]]. Names: Acheson, Bradley, Clifford, Gilpatric, McCloy, Rusk, McNamara, William Bundy, Johnson.'
    src:
