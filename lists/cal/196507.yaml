  - id: cal.1965-07-18.china-leadership-3
    when: July 18
    date: '1965-07-18'
    thread: china-leadership
    c: 'Mao to Zhang Shizhao 章士钊 (Hangyan 行严): received his letter and the second part of his *Liu wen zhiyao* 《柳文指要》, read once and to be read again. The great question is the materialist conception of history, chiefly class struggle, but it cannot be sought of old gentlemen whose worldview is fixed, so no change is needed; later historians may criticize him on it, he should be ready. Mao has read Gao Ershi''s 高二适 reply to Guo Moruo''s 郭沫若 article on the Lanting preface 《兰亭序》: that no true or running script could have been cut on steles, cursive surely not, the rest to be settled by excavation. A debate is right; Mao will persuade Guo Lao 郭老, Kang Sheng 康生 and Chen Boda 陈伯达 to agree to print Gao''s article.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 87–88 (July 18, 1965; Mao''s letter; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Gao Ershi, "A rebuttal on the authenticity of the Lanting preface," Guangming ribao, July 23, 1965 (a reply to Guo Moruo''s article) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 88 n.3a); Guo Moruo, "From the excavation of the Wang and Xie tomb inscriptions to the authenticity of the Lanting preface," Wenwu, 1965, no. 6 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 88 n.3b). Names: Mao Zedong, Zhang Shizhao, Kang Sheng, Chen Boda.'
