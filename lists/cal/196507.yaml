  - id: cal.1965-07-01.china-leadership
    when: July 1
    date: '1965-07-01'
    thread: china-leadership
    c: 'Yang Shangkun 杨尚昆 sends Mao Zedong 毛泽东, Liu Shaoqi 刘少奇 and the Central Committee the Niujiao 牛角 group''s summary report on the brigade''s socialist education (the editors'' note): 319 households, 1,677 people, 2,566 mu; before it, team no. 4 run by a missed landlord in the Party, team no. 8 indirectly, 30,000 jin of state grain resold each spring; since, the poor peasants'' association over 80 percent of the poor and lower-middle peasants; over 9,000 yuan and 9,000 jin recovered from cadres, over 80 percent of the cash and 60 percent of the grain returned; six landlord households and one rich peasant added, 2,500 yuan confiscated, 3,300 yuan of debts annulled; six new Party members; over 60 percent of the chief cadres re-elected; wheat expected up over 50 percent; a three-man group left behind.'
    n: '[[w.yang-shangkun-riji]], II, 599–602 (July 1, 1965). The words: 1965年7月1日，杨尚昆向毛泽东、刘少奇并中共中央报送了中办长安社教工作组牛角小组关于牛角大队社教工作的总结报告 (II, 599). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: the General Office''s Chang''an work team, Niujiao group, summary report, sent July 1, 1965 (cited by [[w.yang-shangkun-riji]], II, 599 n.1). Names: Yang Shangkun, Mao Zedong, Liu Shaoqi.'
