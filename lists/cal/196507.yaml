  - id: cal.1965-07-27.vietnam-july-decision-3
    when: July 27
    date: '1965-07-27'
    place: washington
    thread: vietnam-july-decision
    also: [vietnam-congress]
    c: 'Evening, the congressional leaders; Mansfield reads a statement of his doubts. Present: Senators Mansfield, Dirksen, Hickenlooper, Smathers, Kuchel and Long, Representatives McCormack, Ford, Arends, Boggs and Albert. Long: "Should we put in more men or take a whipping? We''d better go in." Dirksen: make the country realize this is "dangerous, serious business." Mansfield''s statement, by his notes: "whatever the basic commitment, it was abrogated with the assassination of Diem"; "escalation begets escalation." Mansfield to the leaders, by Woods: "We owe this government nothing ... We are going deeper into war. Escalation begets escalation. The best hope for salvation is quick stalemate and negotiations." He will support the President "as a Senator and Majority Leader."'
    n: 'FRUS 1964–68, III, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v03/d94) (6:30 p.m.). [[w.gibbons-u-s-government-and]], III, 424–31; [[w.johnson-vantage-point]], 148–51; [[w.drea-mcnamara-clifford-and-the-2011]], 46 (the leaders told); [[w.dallek-flawed-giant]], 276 (the meeting with the congressional leaders immediately after the NSC: Johnson repeats his determination to avoid dramatics and asks them not "to talk about what is going on"; "Let me appeal to you as Americans to show your patriotism by not talking to the press"; not Mansfield, Long or the others); [[w.valenti-very-human-president]], 354–55 (Tuesday, July 27, 6:35 p.m., the Cabinet Room: Mansfield, Dirksen, McCormack, Ford, Albert, Smathers, Long, Hickenlooper, Kuchel, Boggs, Arends; Mansfield alone opposes, speaking at the end, "Remember, escalation begets escalation"; not the words of Long or Dirksen); [[w.albert-little-giant-1990]], 298–99 (the leaders meet Johnson, with Lodge and his aides, on Vietnam; Johnson''s five courses, "hope Lodge can pull a rabbit out of the hat"; McCormack on Munich; "Without dissent, we each agreed to back him"; not the hour, Mansfield''s statement, or the others present). [[w.mann-grand-delusion]], 454–57 (the leaders; Mansfield''s statement); [[w.califano-triumph-and-tragedy-of]], 41–46 (the leaders, 6:45 p.m. to about 8:30, Califano''s notes: Johnson''s five choices, "the choice is between four and five"; Smathers, "Has our policy changed?"; Ford on 4 and 5; Dirksen, "peel off the dramatics," "this is serious business"; Mansfield, "abrogated with the assassination of Diem," no "tangible national interest"; Hickenlooper, "We win victories in war and lose in negotiations"); [[w.gibbons-u-s-government-and]], IV, 22 (the leaders, eleven: Mansfield the only dissenter; Hickenlooper dubious, for "supporting the President rather than approving"); [[w.barrett-uncertain-warriors]], 57–58 (the congressional leaders called in on July 27, all for the decision but Mansfield; his words, "We do not owe this present government in Saigon anything"). [[w.ball-past-has-another-pattern]], 403 (Mansfield at the leaders'' meeting); [[w.woods-fulbright]], 374 (Mansfield''s words, by Woods; his support). Check: Califano gives Long: "If we back out, they''d move somewhere else. ... I''m not ready to turn tail" (42); he names neither Kuchel, Arends, Boggs nor Albert. Check: the hour of Mansfield''s words; Woods has them that morning, before the meeting, in Mansfield''s office (374). To check: Mansfield, notes on Vietnam, July 28, 1965, XXII, 102, Mansfield Papers (cited by [[w.mann-grand-delusion]], 457 n.54); Congressional Leadership Meeting, July 27, 1965, Meeting Notes File, box 1, Johnson Papers (cited by [[w.woods-fulbright]], 374 n.47). See [[cal.1965-07-27.vietnam]]. Names: Mansfield, Dirksen, Hickenlooper, Smathers, Kuchel, Long, McCormack, Ford, Arends, Boggs, Albert. Check: Mann, 455, leaves Kuchel out.'
