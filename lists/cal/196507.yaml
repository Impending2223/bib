    tags: [name:abernathy-ralph-david, name:deloach-cartha, name:king-martin-luther-jr, name:hoover-j-edgar]
  - id: cal.1965-07-02.vietnam-july-decision
    when: July 2
    date: '1965-07-02'
    thread: vietnam-july-decision
    c: 'Johnson puts off the decisions to the end of the month: McNamara to Saigon in mid-July; Harriman to Moscow on a reconvened Geneva conference; Ball to explore contacts with Hanoi and the Viet Cong.'
    n: '[FRUS 1964–68, III, doc. 44](https://history.state.gov/historicaldocuments/frus1964-68v03/d44) (editorial note: the meeting of July 2, from the Daily Diary; the three errands, by William Bundy''s manuscript history). [[w.dallek-flawed-giant]], 272 (from William Bundy''s manuscript history); [[w.mcnamara-in-retrospect]], ch. 7 at n.45. See [[cal.1965-07-01.vietnam]]. Names: Johnson, McNamara, Harriman, Ball.'
