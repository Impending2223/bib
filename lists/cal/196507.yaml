  - id: cal.1965-07-14.vietnam-july-decision-4
    when: July 14
    date: '1965-07-14'
    thread: vietnam-july-decision
    c: 'A staff meeting. Johnson walks in, listens a while: "Don''t let me interrupt. But there''s one thing you ought to know. Vietnam is like being in a plane without a parachute, when all the engines go out. If you jump, you''ll probably be killed, and if you stay in, you''ll crash and probably burn. That''s what it is." He leaves without waiting for a reply.'
    n: '[[w.goodwin-remembering-america]], 403–4 (Goodwin''s account). Names: Johnson, Goodwin.'
