  - id: cal.1965-07-02.vietnam-july-decision-2
    when: July 2
    date: '1965-07-02'
    thread: vietnam-july-decision
    also: [republican-party]
    c: 'Johnson and Eisenhower, by telephone, morning. Eisenhower: "When you once appeal to force in an international situation involving military help for a nation, you have to go all out." Johnson, by the notes of Eisenhower''s secretary: "Do you really think we can beat the Viet Cong?" Eisenhower: build up as fast as possible; without the British "We would still have the Australians and the Koreans, and our own convictions."'
    n: '[[w.barrett-uncertain-warriors]], 41 (the call; the quotations, from the notes of Eisenhower''s secretary, Lillian Brown); [[w.moyar-triumph-forsaken]], 409 (the call; Eisenhower''s "go all out," which Moyar prints "go all out!"). [[w.clifford-counsel-to-the-president-2]], 407 (Eisenhower''s counsel, in other words: "As long as the enemy are putting men down there, do what you have to do!"). Check: the Eisenhower Library''s memorandum has 10:55 a.m.; the recording, 11:02. To check: [Johnson and Eisenhower, 11:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-july-2-1965), Conversation WH6507-01-8303 (Miller Center); Memorandum of telephone conversation, 10:55 a.m., July 2, 1965, Eisenhower Library (cited by [[w.barrett-uncertain-warriors]], 41 n.101; by [[w.moyar-triumph-forsaken]], 409 n.39, as Brown''s memorandum, Eisenhower Post-Presidential Papers, Augusta Series, box 10). See [[cal.1965-06-16.vietnam-2]]. Names: Johnson, Eisenhower.'
    src:
      c: d1feddd0
      rows:
        - 'w.barrett-uncertain-warriors 41: all'
        - 'via w.barrett-uncertain-warriors 41 n.101: all'
        - 'w.moyar-triumph-forsaken 409: A, B'
        - 'via w.moyar-triumph-forsaken 409 n.39: A, B'
        - 'w.clifford-counsel-to-the-president-2 407: A-B'
        - 'via w.clifford-counsel-to-the-president-2 407 n.3: A-B'
    tags: [name:johnson-lyndon-b, name:eisenhower-dwight-d]
  - id: cal.1965-07-02.vietnam
    when: July 2
    date: '1965-07-02'
    thread: vietnam
    also: [vietnam-july-decision, vietnam-congress]
    c: 'Johnson and McNamara by telephone, 8:41 a.m. By Beschloss''s transcript as Moyar quotes it, Johnson on the Tonkin Gulf resolution: "we know ourselves, in our own conscience, that when we asked for this resolution, we had no intention of committing this many ground troops. We''re doing so now, and we know it''s going to be bad."'
    n: '[Johnson and McNamara, 8:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-july-2-1965), Conversation WH6507.01-8302 (Miller Center; not heard). [[w.moyar-triumph-forsaken]], 416. To check: [[w.reaching-for-glory]], 381–83 (cited by [[w.moyar-triumph-forsaken]], 416 n.67). See [[cal.1964-08-10.vietnam]]. Names: Johnson, McNamara.'
    src:
      c: af627bdb
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-july-2-1965: A'
        - 'w.moyar-triumph-forsaken 416: all'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1965-07-02.vietnam-force-levels
    when: July 2
    date: '1965-07-02'
    thread: vietnam-force-levels
    c: 'Westmoreland to CINCPAC on where the Army''s combat units go: the 2d Brigade, 1st Infantry Division, to Biên Hòa, a battalion to Cam Ranh Bay; the 1st Brigade, 101st Airborne, to Đồng Ba Thìn near Nha Trang; the airmobile division to Qui Nhơn; the rest of the 1st Infantry Division to III Corps; the 173d at Biên Hòa, a reaction force for the whole country. CINCPAC and the Joint Chiefs concur.'
    n: '[[w.macv-command-history-1965]], 41. To check: COMUSMACV 12727, 020836Z Jul 65 (cited by [[w.macv-command-history-1965]], 41 n.76); CINCPAC, 022101Z Jul 65 (cited by [[w.macv-command-history-1965]], 41 n.77, for the concurrence); JCSM 515-65, July 2, 1965 (cited by [[w.macv-command-history-1965]], 41 n.78, for the concurrence). See [[cal.1965-06-27.vietnam-force-levels]]. Names: Westmoreland.'
    src:
