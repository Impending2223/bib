    c: 'News conference, the East Room, midday: "Why are we in Viet-Nam?" The Air Mobile Division and other forces ordered, from 75,000 men to 125,000 "almost immediately"; more later as asked. The monthly draft call from 17,000 to 35,000. Reserves not called now. Goldberg to carry a letter to U Thant. Fortas named to Goldberg''s seat: "the job has sought the man."'
    n: 'The President''s News Conference, [1965 Pub. Papers 794](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=268) (July 28, 1965). The war: [FRUS 1964–68, III, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v03/d97); [[w.gibbons-u-s-government-and]], III, 437–42 (the press conference; the letter to U Thant, 441–42); [[w.drea-mcnamara-clifford-and-the-2011]], 47 (the press conference; 125,000; the draft; no reserves now); [[w.poole-joint-chiefs-of-staff-2012]], 43 (the forces); [[w.cosmas-joint-chiefs-of-staff-2012]], 309–10 (the forces; the reserves); [[w.herring-lbj-and-vietnam]], 1–2, 131 (12:34 p.m., the East Room; 50,000 more, to 125,000, more to come; no reserves; 100,000 approved, 50,000 announced). [[w.dallek-flawed-giant]], 235 (Fortas); [[w.moyar-triumph-forsaken]], 414–16; [[w.westmoreland-soldier-reports]], 143 (the decision, the reserves not called; the announcement quoted); [[w.mcnamara-in-retrospect]], ch. 7 (the midday speech). [[w.clifford-counsel-to-the-president-2]], 422 (the announcement at a midday news conference, not a televised address, as Ball and Clifford had urged; 100,000 approved, 50,000 announced); [[w.califano-triumph-and-tragedy-of]], 47–49 (the opening statement, fifty thousand men, the draft calls doubled, "the flower of our youth"; Fortas and Chancellor named; Hatfield); [[w.kotz-judgment-days]], 346–47, 349 (12:30 p.m., the East Room; "It does not imply any change in policy whatever"; "the wasteful ravages of cruel wars"); [[w.bernstein-guns-or-butter]], 348 (at noon; "guns or butter": "I have not the slightest doubt but whatever it is necessary to face, the American people will face"); [[w.bernstein-guns-or-butter]], 534–35 ("Why must young Americans ... toil and suffer and sometimes die in such a remote place?"); [[w.graham-uncertain-triumph]], 130; [[w.berman-lyndon-johnsons-war]], 87 (Fortas nominated July 28, the day of the announcement on Vietnam); [[w.zaroulis-who-spoke-up]], 47 (July 28: U.S. troop strength in Vietnam raised to 125,000). To check: [[w.murphy-fortas]]; Fortas''s oral history, LBJ Library (cited by [[w.dallek-flawed-giant]], 235). After the morning''s briefing of the members: [[cal.1965-07-28.vietnam-congress]]. See [[cal.1965-07-01.vietnam]]; [[cal.1965-07-21.vietnam]]; [[cal.1965-07-14.transition-and-staff]]. Names: Goldberg, U Thant, Fortas.'
