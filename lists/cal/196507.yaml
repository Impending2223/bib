    c: 'Mao reads the Central Investigation Department''s request on Li Zongren''s return: whether he should issue a written statement on reaching the Beijing airport, or later. Zhou Enlai (July 9) agrees with the first plan (no statement on arrival). Mao to Zhou: the second plan better, a statement at once at the airport, the text agreed beforehand. July 15: Zhou to stay some days in Shanghai to agree the text with Li, fly back with him, and meet him at the airport.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1965; [[w.jianguo-yilai-mao-zedong]], XVIII, 81–83 (July 12, 1965; Mao''s note of July 12 on the Investigation Department''s opinion of July 9 (the second plan, the statement at once at the airport, better; the text agreed beforehand) and, early on July 15, to Zhou: stay in Shanghai some days to settle the statement with Li, fly back with him, and go to the airport to welcome him; note 1 gives Zhou''s inclination of July 9 to the first plan, no statement on arrival). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949]], II, 742 (July 9), has Zhou "propose to agree" with the Central Investigation Department''s opinion and Mao prefer "the second plan", which a note identifies as Cheng Siyuan''s: a written statement at the airport on entering and a press meeting; the entry says Zhou agreed with the first plan, no statement. To check: Central Committee Investigation Department, opinion on Li Zongren''s return (Cheng Siyuan reached Switzerland June 28; two plans for a statement on arrival; the Department favours the first), July 9, 1965, with Zhou Enlai''s endorsement of the first plan (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 82 n.1a). See [[cal.1965-02-03.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Li Zongren.'
