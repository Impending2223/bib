    date: '1965-07-22'
    place: cambridge-ma
    thread: vietnam-july-decision
    c: 'Galbraith to Johnson, under a note of July 22, "How to Take Ninety Percent of the Political Heat out of Vietnam": "much official crap to the contrary," Vietnam "of no great intrinsic importance." Officials to stop saying the future of mankind is being decided there; the bombing stopped or gradually suspended; areas that can be held held. "The whole place will go on the back burner"; the Republicans "will bleat."'
