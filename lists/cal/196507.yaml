  - id: cal.1965-07-21.china-leadership-3
    when: July 21
    date: '1965-07-21'
    thread: china-leadership
    c: 'Mao to Chen Yi 陈毅: asked to revise Chen''s poems, he cannot; he never learned the five-character regulated verse nor published one. Chen''s work is grand in spirit, a little short of regulated metre in form; on that path Chen, like Mao, has not entered. Ye Jianying 叶剑英 is good at seven-character verse, Dong Biwu 董必武 at five-character: ask them. He has changed one poem only, and is not satisfied with it. Poetry needs thinking in images; Han Yu''s 韩愈 prose-as-poetry is not as bad as some say; most Song poets did not understand this; new poetry may come from folk songs; Li He 李贺 is worth reading.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 94–96 (July 21, 1965; Mao''s letter; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). Names: Mao Zedong, Chen Yi, Ye Jianying, Dong Biwu.'
    src:
