    c: 'Liu Shaoqi drafts for the Central Committee the instruction on improving the method of leadership, forwarding nine materials on the socialist-education movement that Wang Renzhong reported to the Center. It says: leading cadres go to grassroots units, squat at points, learn the real situation and gain experience in solving problems, then lead the area by the points, points and area combined, to solve the area''s problems; this is an important method of leading the "four clean-ups" and all other work; every level of leadership must keep to it in all future work and change the subjectivist and bureaucratic method of leadership.'
