  - id: cal.1965-07-06.succession
    when: July 6
    date: '1965-07-06'
    thread: succession
    also: [amendments]
    c: Senate adopts the conference report on Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 1, [68–5](https://voteview.com/rollcall/RS0890139); the House had agreed June 30 by a two-thirds division, without a roll call. To the States, [79 Stat. 1327](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1327.pdf). Nebraska ratifies first, July 12.
    n: '[111 Cong. Rec., Senate, July 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-10-1.pdf); [111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). To check: [[w.feerick-twenty-fifth-amendment]]. See [[cal.1964-09-28.succession]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1965-07-08.vietnam
    when: July 8
    date: '1965-07-08'
    thread: vietnam
    also: [transition-and-staff]
    c: Taylor resigns as Ambassador to South Vietnam, his year done; letter of July 7. Lodge to go back in his place. July 9, at a news conference, Johnson denies any difference of policy behind the change.
    n: 'The President''s News Conference, [1965 Pub. Papers 725](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=199) (July 9, 1965). [FRUS 1964–68, III, doc. 49](https://history.state.gov/historicaldocuments/frus1964-68v03/d49) (Bundy to Johnson, July 4: Rusk to Taylor and Taylor''s reply; Lodge to succeed him, Taylor''s year''s commitment). [[w.cosmas-joint-chiefs-of-staff-2012]], 306 (the resignation; Lodge; the denial). To check: [[w.taylor-swords-and-plowshares]]. See [[cal.1964-06-23.vietnam]]; [[cal.1965-07-01.vietnam]]. Names: Taylor, Lodge, Johnson.'
