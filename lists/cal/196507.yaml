    when: July 5
    date: '1965-07-05'
    thread: china-leadership
    c: 'Zhou receives Shanghai educated youth in Xinjiang. On those from exploiter families or with complex ties: judge by present conduct and stand; birth cannot be chosen, the future can; draw a line from the old class and serve the proletarian cause wholly and there is a bright future. Urges them to put down roots on the border and do farm work well.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 742 (July 5, 1965). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc]
  - id: cal.1965-07-05.china-leadership-3
    when: July 5
    date: '1965-07-05'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hears the preparatory group of the forum on "four clean-up" trials in the national industrial and communications system report. He says there are three fundamental measures to keep capitalism from being restored and prevent peaceful evolution and revisionism: first, the socialist-education movement; second, half-work, half-study; third, cadres'' taking part in labor, which must become a habit and a system, not be seen as a small matter. Factory heads who have a secretary write their speeches: why do it? It is putting on airs; speak a little, speak what one can, and if one cannot, do not; hereafter this is to be stopped, and "to know is to know, not to know is not to know" encouraged.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 622 (July 5, 1965); [[w.deng-xiaoping-nianpu-1904]], III, 1867 (July 5, 1965; Deng, with Liu Shaoqi 刘少奇, Peng Zhen 彭真 and others, hears the report of the preparatory group of the symposium on the pilot ''four clean-ups'' in the industrial and communications system. Deng: in the movement a fairly good leading core is to be set up, workers'' congresses established, organs reformed, and cadres'' labor settled; for children of landlords and rich peasants, weigh the person''s own conduct; the 95 percent Mao speaks of includes them, which is the class policy); [[w.peng-zhen-nianpu-1902]], IV, 424 (July 5, 1965; Peng Zhen, with Liu Shaoqi, Deng Xiaoping and others, hears the preparatory group of the forum on four-clean-up trials in industry and communications). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
