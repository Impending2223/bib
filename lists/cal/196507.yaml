    when: July 16
    date: '1965-07-16'
    thread: vietnam-july-decision
    c: 'Johnson to Vance: no supplemental request to Congress of more than $300 to $400 million before January; a larger one "will kill" the domestic program.'
    n: '[FRUS 1964–68, III, doc. 61](https://history.state.gov/historicaldocuments/frus1964-68v03/d61) (Vance to McNamara, July 17: his three meetings with the President the day before). [[w.dallek-flawed-giant]], 274. To check: [[w.vandemark-into-the-quagmire]]. See [[cal.1965-07-01.vietnam]]. Names: Johnson, Vance.'
