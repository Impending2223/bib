    c: 'Johnson and Eisenhower, by telephone, morning. Eisenhower: "When you once appeal to force in an international situation involving military help for a nation, you have to go all out." Johnson, by the notes of Eisenhower''s secretary: "Do you really think we can beat the Viet Cong?" Eisenhower: build up as fast as possible; without the British "We would still have the Australians and the Koreans, and our own convictions."'
    n: '[[w.barrett-uncertain-warriors]], 41 (the call; the quotations, from the notes of Eisenhower''s secretary, Lillian Brown); [[w.moyar-triumph-forsaken]], 409 (the call; Eisenhower''s "go all out," which Moyar prints "go all out!"). [[w.clifford-counsel-to-the-president-2]], 407 (Eisenhower''s counsel, in other words: "As long as the enemy are putting men down there, do what you have to do!"). Check: the Eisenhower Library''s memorandum has 10:55 a.m.; the recording, 11:02. To check: [Johnson and Eisenhower, 11:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-july-2-1965), Conversation WH6507-01-8303 (Miller Center); Memorandum of telephone conversation, 10:55 a.m., July 2, 1965, Eisenhower Library (cited by [[w.barrett-uncertain-warriors]], 41 n.101; by [[w.moyar-triumph-forsaken]], 409 n.39, as Brown''s memorandum, Eisenhower Post-Presidential Papers, Augusta Series, box 10). See [[cal.1965-06-16.vietnam-2]]. Names: Johnson, Eisenhower.'
