    time: 1965-07-27T19:30Z
    place: washington
    thread: vietnam-congress
    c: 'At Fulbright''s call, Mansfield, Russell, Fulbright, Sparkman, Aiken and Cooper meet, 3:30 p.m. Mansfield''s report to Johnson, nineteen points: 150,000 men by the end of the year more likely than 100,000; the country behind him "primarily because he is President"; the bombing ill-advised; McNamara "a disappointment"; "we are deeply enmeshed in a place where we ought not to be."'
    n: '[FRUS 1964–68, III, doc. 96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]], III, 432–35; [[w.woods-j-william-fulbright-vietnam]], 94 (Mansfield''s office); [[w.woods-fulbright]], 374–75 (the five, the letter: "deeply enmeshed in a place where we ought not to be"); [[w.gibbons-u-s-government-and]], IV, 22 (Mansfield, Russell and Fulbright met; Mansfield''s summary: "deeply enmeshed in a place where we ought not to be"); [[w.barrett-uncertain-warriors]], 36 (Mansfield''s memorandum on a July meeting with Russell and four other Senators, no day: the country backing the President "primarily because he is President"; McNamara "a disappointment"; "deeply enmeshed in a place where we ought not to be"; Johnson passed the critiques but the last to McNamara, who answered for escalation). [[w.mann-grand-delusion]], 459–60. To check: Marcy to Fulbright, July 22, 1965, National Archives, RG 46, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], III, 432 n.133). See [[cal.1965-07-27.vietnam]]. Names: Fulbright, Mansfield, Russell, Sparkman, Aiken, Cooper, Johnson, McNamara.'
