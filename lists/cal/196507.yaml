  - id: cal.1965-07-01.vietnam
    when: July 1
    date: '1965-07-01'
    thread: vietnam-july-decision
    c: 'Four papers for Johnson. McNamara: the Viet Cong winning; American and third-country forces to 44 battalions, some 100,000 reservists called up, a quarantine of the North by mining its harbors. Ball, "A Compromise Solution": hold at the 72,000 men announced, open talks, cut losses. William Bundy, a "middle way": 18 battalions, about 85,000 men, for two months. Rusk: Hanoi must not take the South by force.'
    n: 'FRUS 1964–68, III, docs. [38](https://history.state.gov/historicaldocuments/frus1964-68v03/d38), [39](https://history.state.gov/historicaldocuments/frus1964-68v03/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v03/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v03/d42). [[w.drea-mcnamara-clifford-and-the-2011]], 36–37 (McNamara''s memorandum, the battalions, the reserves; the four papers); [[w.johnson-vantage-point]], 144–53 (the decision of July 20–28; the papers of July 1 not treated); [[w.gibbons-u-s-government-and]], III, 326–30, 340 (Ball''s, Rusk''s and McNamara''s papers of July 1; William Bundy''s "middle way," 340, not its figures); [[w.moyar-triumph-forsaken]], 406–08. To check: [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]; [[w.ball-past-has-another-pattern]]; [[w.clifford-counsel-to-the-president-2]]; [[w.reaching-for-glory]]. See [[cal.1965-06-07.vietnam]]. Also [[w.mcmaster-dereliction-of-duty-1997]]. Check: Gibbons, III, 340, dates Bundy''s memorandum June 30 and titles it "Holding on in South Viet-Nam." Names: Johnson, McNamara, Ball, William Bundy, Rusk.'
