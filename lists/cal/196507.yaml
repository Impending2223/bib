    c: Social Security Amendments of 1965 signed at the Truman Library, Independence, Truman beside him, [79 Stat. 286](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg286.pdf). Hospital insurance for those over 65 under Social Security, up to 90 days for each illness; a voluntary plan for doctors' fees, $3 a month matched by the Government; Medicaid, grants to the States for the medically needy. Benefits up 7 percent. Conference report, House, July 27, [307–116](https://voteview.com/rollcall/RH0890097); Senate, July 28, [70–24](https://voteview.com/rollcall/RS0890174).
    n: 'Remarks With President Truman at the Signing in Independence of the Medicare Bill, [1965 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=285) (July 30, 1965). [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, July 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-1-1.pdf). Statute (K–J Cong. II.J.2). [President''s Daily Diary, July 30, 1965](https://catalog.archives.gov/id/192456), images 4, 5, 6 (LBJ Library; National Archives Catalog). [[w.zelizer-taxing-america]], 247–52 (the act''s three parts, as the committee wrote them; the conference; not the votes). To check: [[w.harris-sacred-trust]]; [[w.corning-evolution-of-medicare]]; [[w.marmor-politics-of-medicare]]; [[w.david-with-dignity]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.blumenthal-heart-of-power]]; [[w.berkowitz-mr-social-security]]. See [[cal.1965-01-07.medicare]]; [[cal.1965-07-09.medicare]]. Names: Johnson, Truman.'
