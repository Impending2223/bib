  - id: cal.1965-07-02.program
    when: July 2
    date: '1965-07-02'
    thread: program
    c: 'Aboard Air Force One, New York to Austin, Johnson with Carl Albert, in the main cabin: "If Martin Luther King wants to catch up with me, he has got to get up early and march fast." Thurgood Marshall for Solicitor General, then perhaps the Court. Howard Smith in the way of the Area Redevelopment bill; Albert: "I want to wait a few more Thursdays." Johnson: "We can''t beat the Russians with Judge Smith in charge"; the program by Oct. 3, next year transportation, and out "before Easter." Of all he is glad to be the architect of: "putting the Catholics and the Protestants and the Jews together in the Education Bill."'
    n: '[[w.johnson-white-house-diary]], 294–95 (Mrs. Johnson''s account; Senator Morse and Ambassador Lodge aboard on the way up; the Area Redevelopment Administration Bill, as she names it). Made public: 1970. Names: Albert, King, Marshall, Smith, Johnson, Lady Bird Johnson.'
    tags: [name:johnson-lady-bird, name:johnson-lyndon-b, name:albert-carl, name:king-martin-luther-jr, name:marshall-thurgood, name:smith-howard-w]
