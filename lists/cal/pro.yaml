# Cal. II Prologue, January 3–19, 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: II
entries:
  - id: cal.1961-01-03.rules
    when: Jan. 3
    date: '1961-01-03'
    thread: rules
    c: 87th Congress convenes. Senate 65 D–35 R, Hickey (D) appointed in Wyoming for Keith Thomson (R), elected and dead in December; House 263–174. Rayburn Speaker; Mansfield and Humphrey lead the Senate Democrats. The conference lets Vice President-elect Johnson preside over it, 46–17, against loud protest; he never uses the role. Eisenhower breaks relations with Cuba.
    n: '[Cong. Rec., Senate, Jan. 3, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf). [House roll call 1](https://voteview.com/rollcall/RH0870001). [Statement by the President on Terminating Diplomatic Relations With Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-terminating-diplomatic-relations-with-cuba). Caro, *Passage of Power* (K–J Adm. II.A), on the conference vote. Hardeman & Bacon, *Rayburn* (K–J Cong. II.I.2). Names: K–J Cong. III.A, III.C.'
    tags: [congress:87, name:hickey-john-j, name:rayburn-sam, name:mansfield-mike, name:humphrey-hubert-h, name:johnson-lyndon-b, name:eisenhower-dwight-d, name:thomson-keith]
  - id: cal.1961-01-05.economy
    when: Jan. 5
    date: '1961-01-05'
    thread: economy
    c: 'Samuelson''s task force reports to the President-elect: a recession under way and a weak recovery ahead. Spend sooner on programs already wanted; hold a temporary tax cut in reserve.'
    n: 'President-elect''s Task Force on the State of the American Economy, *Prospects and Policies for the 1961 American Economy* (K–J Adm. II.H.3). The thread''s books: Stein, *Fiscal Revolution* and *Presidential Economics*; Heller, *New Dimensions*; Okun, *Political Economy of Prosperity*; Collins, *More*; Hargrove & Morley, *The President and the Council of Economic Advisers* (K–J Adm. II.B). The Fed: Meltzer, *History of the Federal Reserve*; Bremner, *Chairman of the Fed*; Garbade, *After the Accord* (K–J Adm. II.B). The dollar: Triffin, *Gold and the Dollar Crisis*; Gavin, *Gold, Dollars, and Power*; Roosa, *The Dollar and World Liquidity*; Solomon, *International Monetary System* (K–J Adm. II.B). Figures: FRASER for what was published at the time, FRED for the revised series (K–J Adm. II.K). Names: Samuelson (K–J Adm. III.H).'
    tags: [name:samuelson-paul-a, name:kennedy-john-f]
  - id: cal.1961-01-06.berlin-and-vienna
    when: Jan. 6
    date: '1961-01-06'
    thread: berlin-and-vienna
    c: Khrushchev's speech on wars of national liberation. Kennedy reads it to his staff and quotes it to the cabinet.
    n: '[FRUS 1961–63, V, doc. 15](https://history.state.gov/historicaldocuments/frus1961-63v05/d15) (Jan. 26, 1961). Beschloss, *Crisis Years* (K–J Adm. II.D); Fursenko & Naftali, *Khrushchev''s Cold War* (K–J Adm. II.D).'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1961-01-11.rules
    when: Jan. 11
    date: '1961-01-11'
    thread: rules
    c: Senate liberals' motion to change Rule XXII at the opening is referred to the Rules Committee, [50–46](https://voteview.com/rollcall/RS0870001).
    n: '[107 Cong. Rec., Senate, Jan. 11, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-7-1.pdf). S. Res. 4, 87th Cong. Finley, *Delaying the Dream* (K–J Cong. II.C).'
  - id: cal.1961-01-14.economy
    when: Jan. 14
    date: '1961-01-14'
    thread: economy
    c: Eisenhower's executive order bars Americans from holding gold abroad, after the October run on the London market.
    n: '[Exec. Order No. 10,905](https://www.presidency.ucsb.edu/documents/executive-order-10905-amendment-executive-order-6260-august-28-1933-amended), [26 Fed. Reg. 321](https://www.govinfo.gov/app/details/FR-1961-01-17) (K–J Adm. II.H.2). Triffin; Gavin (see [[cal.1961-01-05.economy]]).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-17.congo
    when: Jan. 17
    date: '1961-01-17'
    thread: congo
    c: Lumumba killed in Katanga. Not announced until Feb. 13. Eisenhower's farewell address the same day.
    n: '[FRUS 1961–63, XX, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v20/d8) (Jan. 20, 1961). [Farewell Radio and Television Address to the American People](https://www.presidency.ucsb.edu/documents/farewell-radio-and-television-address-the-american-people). Bibliography: [[cal.1961-02-13.congo]].'
    tags: [ok:thread-first, name:eisenhower-dwight-d, name:lumumba-patrice]
  - id: cal.1961-01-18.economy
    when: Jan. 18
    date: '1961-01-18'
    thread: economy
    c: Eisenhower's last Economic Report, two days after his last budget. Neither proposes measures against the recession.
    n: '[Annual Message Presenting the Economic Report to the Congress](https://www.presidency.ucsb.edu/documents/annual-message-presenting-the-economic-report-the-congress). [Annual Budget Message to the Congress: Fiscal Year 1962](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1962) (Jan. 16, 1961). *Economic Report of the President* (Jan. 1961), on FRASER (K–J Adm. II.K). The Joint Economic Committee''s report on it (K–J Cong. II.J.3).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-19.laos
    when: Jan. 19
    date: '1961-01-19'
    thread: laos
    c: Eisenhower–Kennedy transition meeting. Laos called the key to Southeast Asia; accounts of what Eisenhower advised conflict.
    n: Clifford's memorandum of the meeting, in [FRUS vol. 24](https://history.state.gov/historicaldocuments/frus1961-63v24); Clifford, *Counsel to the President* (K–J Adm. II.G.4). Fred I. Greenstein & Richard H. Immerman, *What Did Eisenhower Tell Kennedy About Indochina? The Politics of Misperception*, 79 [J. Am. Hist.](https://academic.oup.com/jah) 568 (1992), compares the five accounts. Check the pages.
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f]
