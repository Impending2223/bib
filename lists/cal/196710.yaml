  - id: cal.1967-10.elections-1968
    when: Oct.
    date: 1967-10
    thread: elections-1968
    also: [china]
    c: 'Nixon, "Asia After Viet Nam," in *Foreign Affairs*, October: "we simply cannot afford to leave China forever outside the family of nations."'
    n: '[[w.nixon-asia-after-viet-nam]], reprinted, [FRUS 1969–76, I, doc. 3](https://history.state.gov/historicaldocuments/frus1969-76v01/d3). [[w.jian-maos-china-and-the]], 245 (the quotation). To check: [[w.perlstein-nixonland-2008]]; [[w.ambrose-nixon]]; [[w.witcover-resurrection-of-richard-nixon]]. Names: Nixon.'
