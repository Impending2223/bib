    thread: vietnam-operations
    c: Lộc Ninh, Bình Long Province, near the Cambodian border. At about 1 a.m., the Viet Cong 9th Division's rockets and mortars on the Special Forces camp and the district headquarters; two battalions of the 273d Regiment break into the compound and are driven out by 4 a.m. Further attacks Oct. 31 and Nov. 1–2; the 273d's losses estimated at 600, Oct. 29–Nov. 2.
    n: '[[w.villard-united-states-army-in]], 48–60; [[w.vietnam-victory-in-vietnam]], 212 (the Lộc Ninh–Route 13 campaign). Check: *Victory in Vietnam* makes it the Lộc Ninh–Route 13 campaign, Oct. 26–Dec. 5: 60 battles; 4,700 of the enemy put out of action, 3,000 Americans among them (212).'
