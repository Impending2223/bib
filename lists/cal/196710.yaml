    c: 'Mao reads Chen Boda''s and Jiang Qing''s request of that day to pick *Liu Shaoqi''s Remarks* and the draft "Publishers'' Note": he changes the clause "he and Deng Xiaoping, another of the Party''s greatest capitalist-roaders" to "he and some other capitalist-roaders," and strikes Deng''s name from another place. Mao, for Lin, Zhou, then Chen: Deng Xiaoping to be left out of the note; whether to name the publisher, a meeting to settle. The three volumes appear as *The Counter-Revolutionary Revisionist Remarks of China''s Khrushchev, Liu Shaoqi*, "the People''s Publishing House data room," internal.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 9, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 169–170 (Oct. 9, 1967; Mao''s note of Oct. 9 for Lin Biao and Zhou Enlai, then Chen Boda; the book gives the four plans for the publisher of the report; the later title and the internal printing are in n.4); [[w.deng-xiaoping-nianpu-1904]], III, 1940 (Oct. 9, 1967; Mao, reading the draft publisher''s note to the selected *Remarks of Liu Shaoqi*, changes ''in league with the other biggest person in power in the Party taking the capitalist road, Deng Xiaoping'' to ''in league with some other persons in power taking the capitalist road'' and strikes out a second place where Deng''s name stands beside Liu''s; his note: ''Lin Biao and Enlai to read, then back to Chen Boda to handle. The note is not to mention Deng Xiaoping. Is that fitting? Decide as suits. Which body is to publish, settle at a meeting.''; the book appears internally under the name of the People''s Publishing House''s reference room, with no mention of Deng). Made public: 2013. To check: Chen Boda and Jiang Qing, report of Oct. 9, 1967 on selecting ''Liu Shaoqi''s Remarks'' (Liu Shaoqi yanlun 刘少奇言论) as material for criticizing ''China''s Khrushchev'', with the draft Publishers'' Note and four plans for the publisher (the Cultural Revolution Group''s office, the General Office, the Hongqi, the People''s Press) (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 169 n.1). Names: Mao Zedong, Chen Boda, Jiang Qing, Liu Shaoqi, Deng Xiaoping, Lin Biao, Zhou Enlai.'
