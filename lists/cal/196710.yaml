    c: Tiananmen, 10 a.m. Mao, with Lin Biao, Zhou Enlai and other leaders, at the rally of the PRC's 18th anniversary and the march; at night, on the gate tower, the fireworks.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1967. [[w.zhou-enlai-waijiao-huodong]], 517 (Oct. 1, 1967; morning, Tiananmen tower, with 500,000 of the capital''s soldiers and people and guests from abroad); [[w.chen-yi-nianpu]], 1195 (Oct. 1, 1967; Chen Yi on the Tiananmen gate tower at the celebration of the PRC''s eighteenth anniversary, and in the evening at the National Day evening there); [[w.dikotter-cultural-revolution]], 164 n.5 (half a million soldiers march across Tiananmen led by a huge silver plastic Mao; hundreds of thousands of citizens in mixed contingents of opposed factions; the rostrum packed with the army, Chen Yi, Xu Xiangqian and Ye Jianying beside Mao; Xu Shiyou beside him too (173)); [[w.liu-jixian-ye-jianying-nianpu]], II, 971 (Oct. 1, 1967; morning, the rally on the Tiananmen 天安门 rostrum; evening, the fireworks on the rostrum; Ye Jianying 叶剑英 at both); [[w.chen-yun-nianpu-xiuding]], III, 162 (Chen Yun at the capital''s rally at Tiananmen in the morning and the gala in the evening); [[w.zhu-de-nianpu-xinbian]], III, 1964 (Oct. 1, 1967; Zhu De 朱德 at the capital''s rally in Tiananmen Square 天安门广场 for the eighteenth anniversary of the People''s Republic, reviewing the parade). To check: Donald C. Hopson, "Letter from Beijing," Oct. 7, 1967, FCO 21-41, Public Record Office (cited by [[w.dikotter-cultural-revolution]], 164 n.5a); [[w.milton-wind-will-not-subside]], 295–299 (cited by [[w.dikotter-cultural-revolution]], 164 n.5b). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
