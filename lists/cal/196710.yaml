# Cal. XCVI October 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCVI
entries:
  - id: cal.1967-10.elections-1968
    when: Oct.
    date: 1967-10
    thread: elections-1968
    also: [china]
    c: 'Nixon, "Asia After Viet Nam," in *Foreign Affairs*, October: "we simply cannot afford to leave China forever outside the family of nations."'
    n: '[[w.nixon-asia-after-viet-nam]], reprinted, [FRUS 1969–76, I, doc. 3](https://history.state.gov/historicaldocuments/frus1969-76v01/d3). [[w.perlstein-nixonland-2008]]; [[w.ambrose-nixon]]; [[w.witcover-resurrection-of-richard-nixon]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1967-10-01.opinion
    when: Oct. 1
    date: '1967-10-01'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Sept. 14–19: Democrats'' choice for 1968: Robert Kennedy 39 percent, Johnson 37, Goldberg 8, Humphrey 6, McNamara 5; no preference 5. The convention''s choice between the two: Kennedy 51, Johnson 39, undecided 10. Those 21 to 29, Kennedy 66; 50 and over, 41.'
    n: '[[w.gallup-poll]], III, 2083–84. Names: Kennedy, Johnson, Goldberg, Humphrey, McNamara.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:goldberg-arthur-j, name:humphrey-hubert-h, name:mcnamara-robert-s]
  - id: cal.1967-10-02.court
    when: Oct. 2
    date: '1967-10-02'
    thread: court
    c: The October Term opens; Marshall, confirmed Aug. 30, takes his seat, the first Negro on the Court. Sept. 30, at the ranch, Johnson had named Erwin N. Griswold, dean of the Harvard Law School, Solicitor General in Marshall's place; sworn Oct. 23.
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-16) (Sept. 30, 1967); [Remarks at the Swearing In of Erwin N. Griswold as Solicitor General](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-erwin-n-griswold-solicitor-general-the-united-states) (Oct. 23, 1967). [[w.williams-thurgood-marshall]]. See [[cal.1967-06-13.court]]. Names: Marshall, Griswold, Johnson.'
    tags: [name:marshall-thurgood, name:griswold-erwin-n, name:johnson-lyndon-b]
  - id: cal.1967-10-02.vietnam
    when: Oct. 2
    date: '1967-10-02'
    thread: vietnam-elections
    c: 'Saigon. The Constituent Assembly validates the election of Thiệu and Kỳ shortly before midnight, 58–43, five ballots invalid. Sept. 28, four members of the Democratic Alliance Bloc on its Special Election Committee had sent Bunker their price for voting validation: Kỳ to name the Prime Minister and three ministers, and 300,000 piasters for each member of the Bloc. Bunker had it passed to Kỳ and warned he would make it public.'
    n: 'FRUS 1964–68, V, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v05/d342) (Bunker''s weekly telegram, Oct. 4). Made public: [[w.bunker-papers]], 185–195. See [[cal.1967-09-03.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:bunker-ellsworth, place:saigon]
  - id: cal.1967-10-03.economy
    when: Oct. 3
    date: '1967-10-03'
    thread: economy-surcharge
    c: 'Ways and Means sets the surcharge aside, 20–5 (Check the day and the vote), until the President and Congress agree on cuts in spending; Mills. The House orders the rule for another continuing resolution, [213–205](https://voteview.com/rollcall/RH0900151).'
    n: '[113 Cong. Rec., House, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-2.pdf). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1967-01-10.economy]]; [[cal.1967-08-03.economy]]. Names: Mills.'
    tags: [name:mills-wilbur-d]
  - id: cal.1967-10-03.mayors-cleveland
    when: Oct. 3
    date: '1967-10-03'
    thread: mayors
    also: [elections-1967]
    c: Cleveland's Democratic primary for mayor. Carl Stokes, a State representative, 110,769, 53.7 percent, over Mayor Locher, 92,033, 44.6; a third 1.7.
    n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.nelson-electing-black-mayors]]; [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]. See [[cal.1965-11-02.mayors-cleveland]]. Names: Stokes, Locher.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:locher-ralph-s]
  - id: cal.1967-10-04.opinion
    when: Oct. 4
    date: '1967-10-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 14–19: Rockefeller and Reagan 55 percent, Johnson and Humphrey 41, undecided 4. Democrats: Johnson–Humphrey 68, Rockefeller–Reagan 29. Independents: Rockefeller–Reagan 62, Johnson–Humphrey 30.'
    n: '[[w.gallup-poll]], III, 2084–85. Names: Rockefeller, Reagan, Johnson, Humphrey.'
    tags: [name:rockefeller-nelson, name:reagan-ronald, name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1967-10-04.poverty
    when: Oct. 4
    date: '1967-10-04'
    thread: poverty
    c: 'The Senate recommits S. 2388, the Economic Opportunity Amendments, to strike Clark''s title II, the emergency employment act, [54–28](https://voteview.com/rollcall/RS0900208).'
    n: '[113 Cong. Rec., Senate, Oct. 4, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-1-2.pdf). See [[cal.1967-09-26.poverty]]. Names: Clark.'
    tags: [name:clark-joseph-s]
  - id: cal.1967-10-05.economy-surcharge
    when: Oct. 5
    date: '1967-10-05'
    thread: economy-surcharge
    c: 'Johnson signs the continuing resolution, [81 Stat. 256](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg256.pdf), funds to Oct. 23. News conference: a $5 billion cut in fiscal 1968 spending would mean appropriations cut by up to $10 billion; let the House name the cuts, bill by bill; "the cruelest tax of all is the inflation tax."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1197) (Oct. 5, 1967). See [[cal.1967-10-03.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-05.poverty
    when: Oct. 5
    date: '1967-10-05'
    thread: poverty
    c: 'The Senate passes S. 2388, the Economic Opportunity Amendments, [60–21](https://voteview.com/rollcall/RS0900214). No aid for voter registration, [85–3](https://voteview.com/rollcall/RS0900213).'
    n: '[113 Cong. Rec., Senate, Oct. 5, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-2-2.pdf). See [[cal.1967-09-26.poverty]].'
  - id: cal.1967-10-06.vietnam
    when: Oct. 6
    date: '1967-10-06'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. A note for Bộ through Kissinger and Marcovich: the United States understands that upon the cessation of all bombardment of the North, "without expression of condition," the North would enter promptly into productive discussions; if so, it will give the date the bombing would stop and suggest a date and a place for talks.'
    n: 'FRUS 1964–68, V, doc. [349](https://history.state.gov/historicaldocuments/frus1964-68v05/d349). Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-21.vietnam]]. Names: Mai Văn Bộ, Kissinger, Marcovich.'
    tags: [name:mai-van-bo, name:kissinger-henry-a, name:marcovich-hebert]
  - id: cal.1967-10-08.opinion
    when: Oct. 8
    date: '1967-10-08'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, Aug. 24–29: in a better position to end the war, a Republican President 31 percent, a Democratic President 21; no difference, no opinion 48.'
    n: '[[w.gallup-poll]], III, 2085.'
  - id: cal.1967-10-09.latin-america
    when: Oct. 9
    date: '1967-10-09'
    thread: latin-america
    also: [cuba]
    c: 'Bolivia. Che Guevara, captured Oct. 8 by the Bolivian army''s Second Ranger Battalion, trained by Americans, is shot at La Higuera, 1:15 p.m., on orders from army headquarters at La Paz. Oct. 10, the army: dead of wounds received in battle. Rostow to Johnson, Oct. 11: "I regard this as stupid, but it is understandable from a Bolivian standpoint."'
    n: 'FRUS 1964–68, XXXI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v31/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v31/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v31/d173). Made public: FRUS 1964–68, XXXI (2004) (Check). [[w.anderson-che-guevara]]; [[w.rabe-killing-zone]]. Names: Guevara, Rostow, Johnson.'
    tags: [name:guevara-ernesto, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-10-10.space
    when: Oct. 10
    date: '1967-10-10'
    thread: space
    also: [soviet-union]
    c: 'The Outer Space Treaty, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf), in force, the ratifications of the United States, Britain and the Soviet Union deposited in Washington, London and Moscow; proclaimed the same day. Johnson, in the East Room, with Rusk, Dobrynin and the British ambassador: "the intention of 84 nations" that the exploration of space remain peaceful; no weapons of mass destruction in orbit, no bases on the moon, no weapons tested in space.'
    n: '[Remarks at Ceremony Marking the Entry Into Force of the Outer Space Treaty](https://www.presidency.ucsb.edu/documents/remarks-ceremony-marking-the-entry-into-force-the-outer-space-treaty) (Oct. 10, 1967). See [[cal.1967-01-27.space]]. Names: Johnson, Rusk, Dobrynin.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1967-10-11.opinion
    when: Oct. 11
    date: '1967-10-11'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, Sept. 14–19: have heard of the strike between Ford and the Auto Workers, 90 percent. Of them, sympathies with the company 40, the union 26. Labor unions in general: approve 66, disapprove 23.'
    n: '[[w.gallup-poll]], III, 2085.'
  - id: cal.1967-10-12.vietnam
    when: Oct. 12
    date: '1967-10-12'
    thread: vietnam
    also: [china]
    c: 'Rusk, at a news conference: Vietnam vital to the security of the United States; within a decade or two, "a billion Chinese on the mainland, armed with nuclear weapons," their attitude toward the rest of Asia uncertain (Check the words). McCarthy, Oct. 16: Rusk raising a "yellow peril."'
    n: '[*New York Times*, Oct. 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/13/issue.html); [Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html). FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.schoenbaum-waging-war-and-peace]]; [[w.rusk-as-i-saw-it-1990]]. Names: Rusk, McCarthy.'
    tags: [name:rusk-dean, name:mccarthy-eugene-j]
  - id: cal.1967-10-13.women
    when: Oct. 13
    date: '1967-10-13'
    thread: women
    c: 'Executive Order 11375: "sex" written into Executive Order 11246. Equal opportunity without discrimination because of sex in federal employment, in 30 days, and by federal contractors and subcontractors, in a year; the Civil Service Commission to hear complaints in federal employment.'
    n: '[Executive Order 11375](https://www.presidency.ucsb.edu/documents/executive-order-11375-amending-executive-order-no-11246-relating-equal-employment), [32 Fed. Reg. 14303](https://www.govinfo.gov/content/pkg/FR-1967-10-17/pdf/FR-1967-10-17.pdf#page=5) (Oct. 17, 1967). [[w.harrison-on-account-of-sex]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-15.opinion
    when: Oct. 15
    date: '1967-10-15'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey of independent voters: the Republican party, highly favorable 29 percent, highly unfavorable 3; the Democratic, 27 and 3. Best for keeping the nation out of war: Republican 28, Democratic 18. To keep it prosperous: Republican 25, Democratic 30.'
    n: '[[w.gallup-poll]], III, 2085–86.'
  - id: cal.1967-10-16.war-opposition
    when: Oct. 16–20
    date: '1967-10-16'
    thread: war-opposition
    also: [draft, students]
    c: 'Stop the Draft Week. Oct. 16, the Resistance''s day: draft cards turned in at rallies in some eighteen cities, Boston''s Arlington Street Church among them. Oakland: a sit-in at the induction center, Oct. 16, over a hundred arrested; the police clear the street with clubs, Oct. 17; some 10,000 hold the streets around the center, Oct. 20. Washington, Oct. 20: Coffin and Spock among those who bring the cards collected, some 990, to the Justice Department; not accepted. Check the counts.'
    n: '[*New York Times*, Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html); [Oct. 18, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/18/issue.html); [Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). FRUS 1964–68, V, docs. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.ferber-resistance]]; [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Coffin, Spock.'
    tags: [name:coffin-william-sloane-jr, name:spock-benjamin, state:ca, city:oakland, state:ma, city:boston, state:dc, city:washington]
  - id: cal.1967-10-16.states-and-cities-us
    when: Oct. 16
    date: '1967-10-16'
    thread: states-and-cities
    also: [elections-1968]
    c: 'The National Governors'' Conference, its 59th meeting, sails aboard the *Independence*, New York to the Virgin Islands and back, Oct. 16–24.'
    n: '*Proceedings of the National Governors'' Conference, 1967*. [[w.sabato-goodbye-to-good-time]]; [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-07-01.states-and-cities-us]].'
  - id: cal.1967-10-16.open-housing-mi
    when: Oct. 16
    date: '1967-10-16'
    thread: open-housing
    also: [states-and-cities]
    c: 'Michigan. Demonstrators against Romney''s open occupancy bill in the House gallery, some for Wallace.'
    n: '*Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download), 1. See [[cal.1967-10.open-housing-mi]]. Names: Romney, Wallace.'
    tags: [state:mi, name:romney-george-w, name:wallace-george-c]
  - id: cal.1967-10-17.vietnam-pennsylvania
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Bộ''s answer: while the United States escalates, Hanoi can neither receive Kissinger nor comment; talks only when the bombing has ended without condition.'
    n: 'Check: the record of the answer. See [[cal.1967-10-06.vietnam]]. Names: Mai Văn Bộ, Kissinger.'
    tags: [name:mai-van-bo, name:kissinger-henry-a]
  - id: cal.1967-10-18.students
    when: Oct. 18
    date: '1967-10-18'
    thread: students
    also: [war-opposition]
    c: Madison. Students sit in at the University of Wisconsin's Commerce Building against the recruiters of Dow Chemical, maker of napalm; the city's police, called in, clear it with clubs and tear gas; some seventy hurt (Check).
    n: '[*New York Times*, Oct. 19, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/19/issue.html). [[w.maraniss-they-marched-into-sunlight]].'
    tags: [state:wi, city:madison]
  - id: cal.1967-10-18.economy
    when: Oct. 18
    date: '1967-10-18'
    thread: economy-surcharge
    also: [congress]
    c: 'Continuing resolution, H.J. Res. 888. House: an amendment holding fiscal 1968 spending to fiscal 1967''s, Vietnam, the Post Office and some programs for persons excepted, [238–164](https://voteview.com/rollcall/RH0900166) (Check the exceptions); passed, [254–143](https://voteview.com/rollcall/RH0900168).'
    n: '[113 Cong. Rec., House, Oct. 18, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-1-2.pdf). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-10-03.economy]].'
  - id: cal.1967-10-18.vietnam-pennsylvania
    when: Oct. 18
    date: '1967-10-18'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Johnson with Kissinger, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor and Clifford: Bộ''s answer a rejection.'
    n: 'FRUS 1964–68, V, doc. [357](https://history.state.gov/historicaldocuments/frus1964-68v05/d357). See [[cal.1967-10-06.vietnam]]. Names: Johnson, Kissinger, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor, Clifford.'
    tags: [name:johnson-lyndon-b, name:kissinger-henry-a, name:rusk-dean, name:mcnamara-robert-s, name:katzenbach-nicholas, name:rostow-walt-w, name:fortas-abe, name:taylor-maxwell, name:clifford-clark]
  - id: cal.1967-10-18.opinion
    when: Oct. 18
    date: '1967-10-18'
    thread: opinion
    also: [economy]
    c: 'Gallup, Oct. 6–11: the most urgent problem facing oneself and one''s family: the high cost of living 60 percent; sickness, health 8; Vietnam 5; racial problems 4; employment 3; old age 3. No problems 16.'
    n: '[[w.gallup-poll]], III, 2086.'
  - id: cal.1967-10-20.mississippi
    when: Oct. 20
    date: '1967-10-20'
    thread: mississippi
    c: 'Meridian. *United States v. Price*: the jury convicts seven of conspiring against the rights of Chaney, Goodman and Schwerner, Deputy Price, Bowers, the White Knights'' Imperial Wizard, and Alton Wayne Roberts among them. Eight acquitted, Sheriff Rainey among them; no verdict on three, Killen among them. Judge Cox had sent the jury back with an *Allen* charge when it reported itself deadlocked.'
    n: '*Posey v. United States*, [416 F.2d 545](https://static.case.law/f2d/416/case-pdfs/0545-01.pdf) (5th Cir. 1969), the appeal. [*New York Times*, Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). [[w.ball-murder-in-mississippi]]; [[w.cagin-we-are-not-afraid]]; [[w.mars-witness-in-philadelphia]]. See [[cal.1964-12-04.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Bowers, Roberts, Rainey, Killen, Cox.'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r, name:bowers-sam, name:roberts-alton-wayne, name:rainey-lawrence-a, name:killen-edgar-ray, name:cox-w-harold]
  - id: cal.1967-10-20.opinion
    when: Oct. 20
    date: '1967-10-20'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Oct. 6–11: Republicans'' choice for 1968: Nixon 42 percent, Rockefeller 18, Reagan 14, Romney 13, Percy 6, Hatfield 3, Lindsay 1; no preference 3.'
    n: '[[w.gallup-poll]], III, 2086. Names: Nixon, Rockefeller, Reagan, Romney, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:romney-george-w, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1967-10-20.states-and-cities-us
    when: Oct. 20
    date: '1967-10-20'
    thread: states-and-cities
    also: [vietnam, elections-1968]
    c: 'The Governors aboard the *Independence*: a resolution on non-defense spending and inflation tabled, 22–13; Rampton''s resolution "committed to the successful conclusion of the struggle" in Southeast Asia refused consideration, 26–18, three-fourths needed, the Republicans present all against but Rhodes. Volpe elected chairman (Check the day).'
    n: '*Proceedings of the National Governors'' Conference, 1967*, [108–119](https://www.nga.org/wp-content/uploads/2021/03/1967NGAAnnualMeeting.pdf#page=121), 123. See [[cal.1967-10-16.states-and-cities-us]]. Names: Rampton, Rhodes, Volpe. Check: the White House''s message to Price Daniel on the resolution, made public aboard (press accounts).'
    tags: [name:rampton-calvin-l, name:volpe-john-a, name:rhodes-james-a]
  - id: cal.1967-10-20.vietnam-pennsylvania
    when: Oct. 20
    date: '1967-10-20'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Paris: Kissinger to Marcovich and Aubrac: Washington has nothing more to say.'
    n: 'FRUS 1964–68, V, docs. [358](https://history.state.gov/historicaldocuments/frus1964-68v05/d358), [360](https://history.state.gov/historicaldocuments/frus1964-68v05/d360). See [[cal.1967-10-06.vietnam]]. Names: Kissinger, Marcovich, Aubrac.'
    tags: [name:kissinger-henry-a, name:marcovich-hebert, name:aubrac-raymond]
  - id: cal.1967-10-21.war-opposition
    when: Oct. 21–23
    date: '1967-10-21'
    thread: war-opposition
    c: 'The March on the Pentagon, called by the National Mobilization Committee, Dellinger its chairman. A rally at the Lincoln Memorial, Spock among the speakers; some 30,000 to 35,000 go on to the Pentagon, many to stay the night; soldiers and marshals hold the building. Mailer among those arrested; 208 arrests by the *Times* of Oct. 23 (Check the final count). Johnson to McNamara and Ramsey Clark, Oct. 23: the troops and police acted "with restraint, firmness and professional skill."'
    n: '[Memorandum Following the Peace Demonstrations at the Lincoln Memorial and the Pentagon](https://www.presidency.ucsb.edu/documents/memorandum-following-the-peace-demonstrations-the-lincoln-memorial-and-the-pentagon) (Oct. 23, 1967). FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.mailer-armies-of-the-night]]; [[w.debenedetti-american-ordeal]]; [[w.small-antiwarriors]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. Names: Dellinger, Spock, Mailer, Johnson, McNamara, Clark.'
    tags: [name:dellinger-david, name:spock-benjamin, name:mailer-norman, name:johnson-lyndon-b, name:mcnamara-robert-s, name:clark-ramsey, state:dc, city:washington]
  - id: cal.1967-10-21.middle-east
    when: Oct. 21
    date: '1967-10-21'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Egyptian missile boats sink the Israeli destroyer *Eilat* off Port Said. Dobrynin delivers Kosygin''s letter of Oct. 20 to Johnson: no progress toward a political settlement; Israel still holds the Arab lands.'
    n: 'FRUS 1964–68, XIX, doc. [480](https://history.state.gov/historicaldocuments/frus1964-68v19/d480). [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-06-05.middle-east]]. Names: Kosygin, Dobrynin, Johnson.'
    tags: [name:kosygin-aleksei, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1967-10-22.opinion
    when: Oct. 22
    date: '1967-10-22'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Oct. 6–11: Nixon 49 percent, Johnson 45; Rockefeller 54, Johnson 40; Romney 48, Johnson 45. Robert Kennedy as the Democrat: Nixon 48, Kennedy 47; Rockefeller 47, Kennedy 46.'
    n: '[[w.gallup-poll]], III, 2086–87. Names: Johnson, Nixon, Rockefeller, Romney, Kennedy.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:rockefeller-nelson, name:romney-george-w, name:kennedy-robert-f]
  - id: cal.1967-10-23.antisubversion
    when: Oct. 23
    date: '1967-10-23'
    thread: antisubversion
    also: [court]
    c: 'Senate passes S. 2171, [65–10](https://voteview.com/rollcall/RS0900229): the Subversive Activities Control Board kept, its power to order members of Communist organizations to register taken away, after *Albertson*. A section ending the Board June 30, 1969, on a finding of the Attorney General, [74–2](https://voteview.com/rollcall/RS0900227) (Check its terms); its end Jan. 1, 1968, refused, [17–58](https://voteview.com/rollcall/RS0900228).'
    n: '[113 Cong. Rec., Senate, Oct. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-4-2.pdf). [[w.goldstein-political-repression-in-modern]]. See [[cal.1965-11-15.court]].'
  - id: cal.1967-10-23.middle-east
    when: Oct. 23
    date: '1967-10-23'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Johnson answers Kosygin''s letter of Oct. 20.'
    n: 'FRUS 1964–68, XIX, docs. [483](https://history.state.gov/historicaldocuments/frus1964-68v19/d483), [484](https://history.state.gov/historicaldocuments/frus1964-68v19/d484). See [[cal.1967-10-21.middle-east]]. Names: Kosygin, Johnson.'
