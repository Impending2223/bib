  - id: cal.1967-10-03.vietnam
    when: Oct. 3
    date: '1967-10-03'
    time: 1967-10-03T22:10Z
    place: washington
    thread: vietnam-pennsylvania
    also: [elections-1968]
    c: 'Johnson with Rusk, McNamara, Rostow, Helms, Christian and Tom Johnson, 6:10 to 9:32 p.m. Rusk, from the United Nations: no one can say what would follow a halt; Moscow has given up trying to move Hanoi. Johnson: no halt unless Hanoi agrees to meet promptly and push for a settlement. Rostow: the bombing costly to Hanoi; McNamara: "I do not agree." From the Friendly Five reports: all "think that we will lose the election if we do not do something about Vietnam quick." Of the march on the Pentagon: "They are not going to run me out of town." Nothing to leave the room: what would it do to the war if he announced he would not run? "If it were set either way today, the decision would be that he would not run." Rusk: "You must not go down."'
    n: 'FRUS 1964–68, V, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.gibbons-u-s-government-and]], IV, 784, 807–08, 861; [[w.johnson-vantage-point]], 428 (the question of not running); [[w.drea-mcnamara-clifford-and-the-2011]], 174 (McNamara: deployments can be quickened by cutting stateside training, MACV to give four weeks in the country; the next day he recommends them); [[w.drea-mcnamara-clifford-and-the-2011]], 219 (Rusk and Rostow against eliminating the restrictions; their views in writing asked, the origin of McNamara''s memorandum of Nov. 1); [[w.drea-mcnamara-clifford-and-the-2011]], 280 (Johnson to McNamara, after the leaders'' displeasure: "get going on plans to protect the White House, the Pentagon, and the Capitol"); [[w.dallek-flawed-giant]], 482 (Oct. 3 meeting: the Paris talks ("Pennsylvania"), the Shah''s initiative, Gromyko''s view; Johnson asks what effect his not running again would have on the war, Rusk urges him not to stand down; Johnson on four more years and "work my guts out"; congressional opinion convinced "we will lose the election if we do not do something about Vietnam quick"; not the hours, the attendees, the Pentagon march or the Friendly Five). Made public: Johnson''s memoir (1971), the question; the notes, FRUS 1964–68, V (2002). Check: Drea has it at a White House luncheon Oct. 3 (174). See [[cal.1967-08-21.vietnam-congress]]. Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian, Tom Johnson.'
