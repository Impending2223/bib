  - id: cal.1967-10-01.china-leadership-2
    when: Oct. 1
    date: '1967-10-01'
    thread: china-leadership
    c: 'Mao 毛泽东, on the General Political Department''s draft notice of Aug. 3 on carrying out mass revolutionary criticism in the whole army, sent by Lin Biao 林彪 Aug. 20: ''This paper is not to be used.'' The draft aims at ''the biggest handful of persons in power taking the capitalist road in the Party and the army'', names Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平, Peng Dehuai, He Long and others, and lists Peng, He, Luo Ruiqing, Huang Kecheng, Tan Zheng and Liu Zhijian as Liu''s agents in the army.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 166–168 (Oct. 1, 1967). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: PLA General Political Department, draft notice of Aug. 3, 1967 on carrying out mass revolutionary criticism in the whole army (Guanyu zai quan jun shenru kaizhan geming da pipan yundong de tongzhi 关于在全军深入开展革命大批判运动的通知), sent by Lin Biao Aug. 20 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 166 n.1). Names: Mao Zedong, Lin Biao, Liu Shaoqi, Deng Xiaoping, Peng Dehuai, He Long, Luo Ruiqing.'
    src:
      c: 6d016ce3
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 166–168: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 166 n.1: all'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:liu-shaoqi, name:deng-xiaoping, name:peng-dehuai, name:he-long, name:luo-ruiqing, vis:only:prc]
