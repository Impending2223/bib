  - id: cal.1967-10-20.war-opposition
    when: Oct. 20
    date: '1967-10-20'
    thread: war-opposition
    also: [draft]
    c: 'Night, after the cards are left at Justice. Johnson to Califano: "I want a memo to the Attorney General tonight. I want the FBI investigating." Before dinner he calls Hershey on punishing draft protesters, by Califano''s account. The memorandum goes to Clark, Hershey and Hoover. Troops on alert for the Pentagon, the Capitol and the White House, some in the Commerce Department''s basement.'
    n: '[[w.gibbons-u-s-government-and]], IV, 863–64 (from [[w.califano-triumph-and-tragedy-of]], 198–99; the memorandum, LBJ Library, WHCF, Ex ND 9-4). To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1967-10-16.war-opposition]]. Names: Johnson, Califano, Hershey, Clark, Hoover.'
    tags: [name:johnson-lyndon-b, name:califano-joseph-a-jr, name:hershey-lewis-b, name:clark-ramsey, name:hoover-j-edgar]
  - id: cal.1967-10-20.war-opposition-2
    when: Oct. 20
    date: '1967-10-20'
    thread: war-opposition
    c: 'Signed, 11:29 p.m.: S. 2310, the Capitol''s buildings and grounds, [81 Stat. 275](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg275-3.pdf). No parading, demonstrating or picketing in the buildings; loud, threatening or abusive language or disorderly conduct meant to disrupt a session or a hearing, a misdemeanor. The House had passed its bill, H.R. 13178, Oct. 19, [336–20](https://voteview.com/rollcall/RH0900169).'
    n: '[[w.gibbons-u-s-government-and]], IV, 864 (the signing, from the *New York Times*, Oct. 22, 1967). Check: Gibbons has Congress pass it that day; the House''s roll call on its bill is of Oct. 19; the Senate''s day not read. See [[cal.1967-10-20.war-opposition]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-21.war-opposition
    when: Oct. 21–23
    date: '1967-10-21'
    thread: war-opposition
    c: 'The March on the Pentagon, called by the National Mobilization Committee, Dellinger its chairman. A rally at the Lincoln Memorial, Spock among the speakers; some 30,000 to 35,000 go on to the Pentagon, many to stay the night; soldiers and marshals hold the building. Mailer among those arrested; 208 arrests by the *Times* of Oct. 23; 647 to 693 in all, by the later estimates. Johnson to McNamara and Ramsey Clark, Oct. 23: the troops and police acted "with restraint, firmness and professional skill."'
    n: 'Memorandum Following the Peace Demonstrations at the Lincoln Memorial and the Pentagon, [1967 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=328) (Oct. 23, 1967). FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 865–68 (the final count, from DeBenedetti and Chatfield, 198, 443 n. 21; Johnson''s weekend, from Califano). To check: [[w.mailer-armies-of-the-night]]; [[w.debenedetti-american-ordeal]]; [[w.small-antiwarriors]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. Names: Dellinger, Spock, Mailer, Johnson, McNamara, Clark. Check: Gibbons puts the crowd at the Lincoln Memorial at 50,000 to 100,000, at least half of it going on to the Pentagon (IV, 865–66).'
    tags: [name:dellinger-david, name:spock-benjamin, name:mailer-norman, name:johnson-lyndon-b, name:mcnamara-robert-s, name:clark-ramsey, state:dc, city:washington]
  - id: cal.1967-10-21.middle-east
