    when: Oct. 1
    date: '1967-10-01'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy-campaign]
    c: 'Gallup, Sept. 14–19: Democrats'' choice for 1968: Robert Kennedy 39 percent, Johnson 37, Goldberg 8, Humphrey 6, McNamara 5; no preference 5. The convention''s choice between the two: Kennedy 51, Johnson 39, undecided 10. Those 21 to 29, Kennedy 66; 50 and over, 41.'
    n: '[[w.gallup-poll]], III, 2083–84; [[w.shesol-mutual-contempt]], 385 (Kennedy 39, Johnson 37; between the two alone, Kennedy 51, Johnson 39). Names: Kennedy, Johnson, Goldberg, Humphrey, McNamara.'
