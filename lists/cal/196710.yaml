  - id: cal.1967-10-25.vietnam
    when: Oct. 25
    date: '1967-10-25'
    thread: vietnam
    also: [congress]
    c: 'Senate. Mansfield, with 54 cosponsors, offers S. Res. 180: the President to consider bringing the American resolution of Jan. 31, 1966, or another of equal purpose, before the Security Council. Oct. 10, the Senate had added to the State, Justice and Commerce appropriation the sense of Congress that the United States seek economic sanctions against North Vietnam in the UN, as against Rhodesia, [74–15](https://voteview.com/rollcall/RS0900224).'
    n: '[113 Cong. Rec., Senate, Oct. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-6-2.pdf); [113 Cong. Rec., Senate, Oct. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-5-1.pdf). FRUS 1964–68, V, doc. [373](https://history.state.gov/historicaldocuments/frus1964-68v05/d373). [[w.gibbons-u-s-government-and]], IV. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1967-10-25.economy-surcharge
    when: Oct. 25
    date: '1967-10-25'
    thread: economy-surcharge
    also: [congress]
    c: 'Senate, the continuing resolution, H.J. Res. 888: a ceiling of $131.5 billion on fiscal 1968 spending refused, [39–48](https://voteview.com/rollcall/RS0900230); 5 percent off each nonmilitary item, refused, [43–46](https://voteview.com/rollcall/RS0900231); all but the funds to Nov. 15 struck, [50–34](https://voteview.com/rollcall/RS0900233); passed, [59–26](https://voteview.com/rollcall/RS0900234).'
    n: '[113 Cong. Rec., Senate, Oct. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-6-2.pdf). See [[cal.1967-10-18.economy]].'
  - id: cal.1967-10-25.opinion
    when: Oct. 25
    date: '1967-10-25'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 6–11: the United States made a mistake in sending troops: yes 46 percent, no 44. The war may prevent World War III, 40; may start it, 40. The Johnson Administration telling the public all it should know about the war: is 21, is not 70. Troops to be sent to another situation like Vietnam: should 28, should not 57.'
    n: '[[w.gallup-poll]], III, 2087. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-26.latin-america
    when: Oct. 26–28
    date: '1967-10-26'
    thread: latin-america
    c: 'Díaz Ordaz at the White House, Oct. 26–27. Oct. 28, at 12:01 a.m., the boundary changes at El Paso and Ciudad Juárez: El Chamizal returned to Mexico under the convention of Aug. 29, 1963. Johnson and Díaz Ordaz proclaim it at the monument on the Mexican side and dedicate three bridges. Johnson the same day to the Mexican-American conference at El Paso.'
    n: '[Joint Statement Following Discussions With President Diaz Ordaz of Mexico](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-diaz-ordaz-mexico-0) (Oct. 27, 1967); [Text of the Chamizal Declaration](https://www.presidency.ucsb.edu/documents/text-the-chamizal-declaration-recognizing-the-transfer-lands-between-the-united-states-and) (Oct. 28, 1967); [Remarks at the Chamizal Ceremony, Juarez, Mexico](https://www.presidency.ucsb.edu/documents/remarks-the-chamizal-ceremony-juarez-mexico) (Oct. 28, 1967); [Remarks to the Delegates to the Mexican-American Conference, El Paso, Texas](https://www.presidency.ucsb.edu/documents/remarks-the-delegates-the-mexican-american-conference-el-paso-texas) (Oct. 28, 1967). [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1963-07-18.latin-america]]. Names: Díaz Ordaz, Johnson.'
    tags: [name:diaz-ordaz-gustavo, name:johnson-lyndon-b, state:tx, city:el-paso]
  - id: cal.1967-10-28.black-nationalism-oakland
    when: Oct. 28
    date: '1967-10-28'
    thread: black-nationalism
    c: 'Oakland. Before dawn, a traffic stop: one policeman killed, another wounded; Newton wounded, charged with murder. "Free Huey" the party''s campaign.'
    n: '*People v. Newton*, [8 Cal. App. 3d 359](https://static.case.law/cal-app-3d/8/case-pdfs/0359-01.pdf) (1970), the appeal. [[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.self-american-babylon]]. See [[cal.1967-05-02.black-nationalism-oakland]]. Names: Newton.'
    tags: [state:ca, city:oakland, name:newton-huey-p]
  - id: cal.1967-10-29.opinion
    when: Oct. 29
    date: '1967-10-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 6–11, plans to end the war. The South Vietnamese to draft and train more men, 100,000 Americans home as each 100,000 are trained: favor 71 percent, oppose 20. The whole problem to the UN, both sides bound in advance, even to an American withdrawal: 60 and 32. Bombing of selected targets kept up until Hanoi agrees to reduce its efforts and talk: 55 and 35. The military to run the war as it sees fit, Haiphong bombed, atomic weapons if the military believes we should: 42 and 48. Withdraw now: 35 and 56. A long bombing pause without promise from Hanoi, and economic aid to win Communists in the South to a peace: 24 and 65.'
    n: '[[w.gallup-poll]], III, 2087–88.'
  - id: cal.1967-10-30.king
    when: Oct. 30
    date: '1967-10-30'
    thread: king
    also: [alabama]
    c: Birmingham. King and Abernathy, with others of the petitioners, go to jail to serve the five days for contempt of the injunction of Apr. 10, 1963, upheld in *Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (Check who went with them, and the day of release).
    n: '[*New York Times*, Oct. 31, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/31/issue.html). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1963-04-12.alabama]]. Names: King, Abernathy.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david, state:al, city:birmingham]
  - id: cal.1967-10-30.amendments
    when: Oct. 30–31
    date: '1967-10-30'
    thread: amendments
    also: [court, congress]
    c: 'Senate Judiciary''s Subcommittee on Separation of Powers on Ervin''s S. 2307, the convention bill: hearings Oct. 30 and 31. No bill reported in the 90th Congress.'
    n: '*Federal Constitutional Convention: Hearings on S. 2307 before the Subcommittee on Separation of Powers of the Senate Committee on the Judiciary*, 90th Cong., 1st sess. (1968) ([Monthly Catalog](https://mocat.library.unt.edu/catalog/882-8942); Y 4.J 89/2:C 76/14; Check: a digitized copy, and the witnesses). History of Bills, 1967, [S. 2307](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt28/pdf/GPO-CRECB-1967-pt28-2.pdf#page=67). See [[cal.1967-08-17.amendments]]. Names: Ervin.'
    tags: [name:ervin-sam-j-jr]
  - id: cal.1967-10-31.consumers
    when: Oct. 31
    date: '1967-10-31'
    thread: consumers
    also: [farm]
    c: 'House passes the meat inspection bill, H.R. 12144, [402–1](https://voteview.com/rollcall/RH0900189): federal money and personnel offered to the States that bring their inspection of meat sold within a State up to federal standards; the federal statutes recast in one act.'
    n: '[113 Cong. Rec., House, Oct. 31, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-10-1.pdf). [[w.nadel-politics-of-consumer-protection]].'
  - id: cal.1967-10-31.vietnam
    when: Oct. 31
    date: '1967-10-31'
    thread: vietnam-elections
    c: Saigon. Thiệu inaugurated President, Kỳ Vice President; Humphrey heads the American delegation, in Vietnam Oct. 29–Nov. 1. The Lower House elected Oct. 22. Thiệu had agreed, at Bunker's asking, to speak in his inaugural address only in general terms of a peaceful settlement and of his willingness to meet with Hanoi.
    n: 'FRUS 1964–68, V, docs. [356](https://history.state.gov/historicaldocuments/frus1964-68v05/d356), [361](https://history.state.gov/historicaldocuments/frus1964-68v05/d361), [366](https://history.state.gov/historicaldocuments/frus1964-68v05/d366), [367](https://history.state.gov/historicaldocuments/frus1964-68v05/d367). See [[cal.1967-09-03.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Humphrey, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:humphrey-hubert-h, name:bunker-ellsworth, place:saigon]
  - id: cal.1967-10.open-housing-mi
    when: Oct.
    date: '1967-10'
    thread: open-housing
    also: [states-and-cities]
    c: Michigan. Romney asks the legislature, in special session, for a State open occupancy law against discrimination in the sale or rental of most housing, and more money for the Civil Rights Commission (Check the day).
    n: '[[w.fine-expanding-the-frontiers-of]]; [[w.mollenhoff-george-romney]]. Names: Romney.'
