    n: 'Daily Digest, [113 Cong. Rec. D505](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=503) (Oct. 3, 1967). [113 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-2.pdf) (1967). [[w.zelizer-taxing-america]], 264–65 (the day, the motion, Mills for it); [[w.zelizer-fierce-urgency-of-now]], 282 (Watts''s motion; Rostenkowski: "We hope this will get the executive branch off dead center"); [[w.bernstein-guns-or-butter]], 370 (20 to 5). Check: Zelizer, 265, counts Mills, ten Republicans and eight Democrats for the motion. [[w.gibbons-u-s-government-and]], IV, 760 (20–5, by CQ''s *Almanac*, 1967, 653). To check: [[w.okun-political-economy-of-prosperity]]; Marjorie Hunter, "House Unit Votes To Delay Action on Surcharge," [*New York Times*, Oct. 4, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/04/issue.html) (cited by [[w.zelizer-taxing-america]], 265 n.44); Norman Miller, "Mills Says Johnson Is Unlikely to Yield to House Panel Demand He Cut Spending," *Wall Street Journal*, Oct. 5, 1967 (cited by [[w.zelizer-taxing-america]], 265 n.44); John Manley Interview Collection (JMIC), in Zelizer''s possession; also LBJ Library (cited by [[w.zelizer-taxing-america]], 265 n.45). See [[cal.1967-01-10.economy]]; [[cal.1967-08-03.economy]]. Names: Watts, Mills. Check: the page.'
