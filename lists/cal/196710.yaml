  - id: cal.1967-10-24.cities-and-housing
    when: Oct. 24–26
    date: '1967-10-24'
    thread: cities-and-housing
    c: 'House, the conference on the Independent Offices and HUD appropriation. Oct. 24: the House insists against the Senate''s $40 million for rent supplements, [151–251](https://voteview.com/rollcall/RH0900177) against receding, and against its amendment adding $50 million (Check the item), [156–241](https://voteview.com/rollcall/RH0900176). Oct. 26: a motion to send the report back, to insist again against rent supplements, lost, [184–198](https://voteview.com/rollcall/RH0900182); the report adopted, [297–88](https://voteview.com/rollcall/RH0900183).'
    n: '[113 Cong. Rec., House, Oct. 24, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-5-2.pdf); [113 Cong. Rec., House, Oct. 26, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-7-2.pdf). See [[cal.1967-09-19.cities-and-housing]].'
  - id: cal.1967-10-24.amendments
    when: Oct. 24
    date: '1967-10-24'
    thread: amendments
    also: [states-and-cities, congress]
    c: 'House Judiciary reports H.J. Res. 396, the District''s representation in Congress, amended, H. Rept. 819. The House does not take it up in the 90th Congress.'
    n: '[113 Cong. Rec. 29908](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-5-2.pdf#page=89) (1967); History of Bills, 1967, [H.J. Res. 396](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt28/pdf/GPO-CRECB-1967-pt28-2.pdf#page=447). See [[cal.1967-07-19.amendments]]. Names: Celler.'
    tags: [name:celler-emanuel, state:dc, city:washington]
  - id: cal.1967-10-24.middle-east
    when: Oct. 24
    date: '1967-10-24'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Israel''s guns fire the refineries at Suez (Check). Dobrynin proposes confidential consultations.'
    n: 'Check: the record of Dobrynin''s proposal. See [[cal.1967-10-21.middle-east]]. Names: Dobrynin.'
