    n: '[113 Cong. Rec., Senate, Oct. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-4-2.pdf). To check: [[w.goldstein-political-repression-in-modern]]. See [[cal.1965-11-15.court]].'
