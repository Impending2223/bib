    c: 'The March on the Pentagon, called by the National Mobilization Committee, Dellinger its chairman. A rally at the Lincoln Memorial, Spock among the speakers; some 30,000 to 35,000 go on to the Pentagon, many to stay the night; soldiers and marshals hold the building. Mailer among those arrested; 208 arrests by the *Times* of Oct. 23; 647 to 693 in all, by the later estimates. Johnson to McNamara and Ramsey Clark, Oct. 23: the troops and police acted "with restraint, firmness and professional skill."'
    n: 'Memorandum Following the Peace Demonstrations at the Lincoln Memorial and the Pentagon, [1967 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=328) (Oct. 23, 1967). FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 865–66 (the rally, the soldiers and marshals, Mailer, the arrests in all; the count, by DeBenedetti and Chatfield, 198, 443 n.21); [[w.rights-in-conflict-convention-week]], 21–22 (the Mobilization; Dellinger its chairman; 600 or more arrested); [[w.mcnamara-in-retrospect]], ch. 10 at nn.38–40 (some 20,000; troops shoulder to shoulder, marshals before them, reinforcements in the center courtyard). [[w.califano-triumph-and-tragedy-of]], 199 (troops in the Commerce Department''s basement, come in civilian clothes by twos and fours); [[w.branch-at-canaans-edge]], 646–48 (2,000 police, 1,800 Guardsmen, military police; John Lewis: "We don''t want to play Indian outside the white man''s fort"; nearly seven hundred arrested); [[w.bernstein-guns-or-butter]], 423–24 (Justice expected 22,000, the FBI 28,000, the *Times* 50,000; 625 adults arrested; $1,078,500); [[w.drea-mcnamara-clifford-and-the-2011]], 281–82 (the permit of Oct. 19; McNamara at his staff meeting Oct. 20; 800 military police outside in North Parking, three battalions inside, five more on standby, 236 marshals); [[w.wells-war-within]], 195–97, 203 (more than a hundred thousand at the Lincoln Memorial; over thirty thousand in the mall below the Pentagon; troops inside the building; 683 arrests); [[w.zaroulis-who-spoke-up]], 137–42 (50,000 at the Lincoln Memorial, some estimates 100,000; Spock among the speakers; marshals and troops; the celebrities arrested; 683 in all); [[w.debenedetti-american-ordeal]], 196–98 (an estimated hundred thousand in Washington; some fifty thousand into the north parking lot; 6,000 marshals and troops, the 82d Airborne among them; some 750 overnight; 647 arrested, 47 hospitalized). Check: [[w.rights-in-conflict-convention-week]], 21, gives some 50,000 at the Pentagon, some 2,000 up its steps. Check: [[w.wells-war-within]] gives more than one hundred thousand at the Lincoln Memorial (195). Check: DeBenedetti, 197, gives some fifty thousand marching to the Pentagon. To check: [[w.mailer-armies-of-the-night]]; [[w.small-antiwarriors]]. Names: Dellinger, Spock, Mailer, Johnson, McNamara, Clark. Check: Gibbons puts the crowd at the Lincoln Memorial at 50,000 to 100,000, at least half of it going on to the Pentagon (IV, 865–66).'
