    when: Oct. 24
    date: '1967-10-24'
    thread: vietnam-congress
    c: Dinner at the White House for members of the House of both parties; Johnson talks the whole time. 1968 "tough"; a Congressman may put "a very visible public distance" between himself and the President, but they will be on one line of the ballot. "They're just plain unhappy with me."
    n: '[[w.gibbons-u-s-government-and]], IV, 847–48. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-25.vietnam
    when: Oct. 25
    date: '1967-10-25'
    thread: vietnam
    also: [congress]
    c: 'Senate. Mansfield, with 54 cosponsors, offers S. Res. 180: the President to consider bringing the American resolution of Jan. 31, 1966, or another of equal purpose, before the Security Council. Oct. 10, the Senate had added to the State, Justice and Commerce appropriation the sense of Congress that the United States seek economic sanctions against North Vietnam in the UN, as against Rhodesia, [74–15](https://voteview.com/rollcall/RS0900224).'
    n: '[113 Cong. Rec., Senate, Oct. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-6-2.pdf); [113 Cong. Rec., Senate, Oct. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-5-1.pdf). FRUS 1964–68, V, doc. [373](https://history.state.gov/historicaldocuments/frus1964-68v05/d373). [[w.gibbons-u-s-government-and]], IV, 919 (S. Res. 180). Names: Mansfield.'
