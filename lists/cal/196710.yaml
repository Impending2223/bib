    also: [vietnam]
    c: 'Gallup, Oct. 6–11: the United States made a mistake in sending troops: yes 46 percent, no 44. The war may prevent World War III, 40; may start it, 40. The Johnson Administration telling the public all it should know about the war: is 21, is not 70. Troops to be sent to another situation like Vietnam: should 28, should not 57.'
