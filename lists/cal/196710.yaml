    when: Oct. 20–24
    date: '1967-10-20'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: The Politburo meets on the strategic plan for the winter, spring and summer of 1967–68, Trường Chinh presiding; Lê Duẩn and Võ Nguyên Giáp away for treatment abroad. Oct. 20, the intelligence and Operations reports; Oct. 21, Văn Tiến Dũng for the Military Committee on the plan to turn the main strategic attack into the cities, with a general offensive and uprising; the fronts report their plans; Oct. 23–24, the Politburo debates the chances of taking the cities and of an uprising. It adopts the line to prepare a general offensive and uprising, to be set off the same day and hour at Đà Nẵng and Saigon if it can be, the cities to be taken and if possible Thiệu, Kỳ or Westmoreland; a second front and a Provisional Revolutionary Government to follow; agrees to join the Lao in attacking Nậm Bạc. Trường Chinh asks that "three degrees of victory" be put as "cases." The question of the uprising is left for the next meeting.
