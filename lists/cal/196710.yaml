    thread: vietnam-pennsylvania
    also: [vietnam-air-war]
    c: 'Johnson tells the congressional leaders of Pennsylvania. Strikes on the Phúc Yên airfield, authorized Sept. 28 and cancelled, authorized again.'
    n: 'FRUS 1964–68, V, docs. [362](https://history.state.gov/historicaldocuments/frus1964-68v05/d362), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363), [364](https://history.state.gov/historicaldocuments/frus1964-68v05/d364); [312](https://history.state.gov/historicaldocuments/frus1964-68v05/d312) (Phúc Yên). See [[cal.1967-10-06.vietnam]]; [[cal.1967-08-24.vietnam-air-war]]. Names: Johnson.'
