  - id: cal.1967-10-12.china-leadership
    when: Oct. 12
    date: '1967-10-12'
    time: 1967-10-12T10:30Z
    place: peking
    thread: china-leadership
    c: 'Evening, Great Hall. Mao again receives the Albanian delegation under Mehmet Shehu, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng and Li Fuchun present. Since late September the great alliances grow and the unalliance few; the settlement still needs months, a year and a half in all, three years planned, since June 1 a year. Where disorder is worst it is easier; where indifferent, harder. Of the officials: the new governments mean a great test; high pay, rank, house, car, and they stop being revolutionary and become officials; the leaders are helpless, but this time it is good: the masses sort them out. It is not Liu Shaoqi''s work alone.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 12, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 190 (Oct. 12, 1967; Zhou with Mao at the reception of Shehu and the Albanian delegation); [[w.zhou-enlai-waijiao-huodong]], 518 (Oct. 12, 1967; 6:30 p.m., Great Hall of the People; Zhou accompanies Mao in receiving the Albanian delegation under Shehu); [[w.mao-zedong-zhuan]], VI, ch. 76 n.79 (Oct. 12, to the Albanian delegation under Shehu, n.79: ''this is a good chance to examine the cadres''; some cadres do not approach the masses or lower cadres, are officials and lords, I have no way to deal with them, in so big a country I have never seen 99 percent of the people, ''this time the masses do it to them''; ''why we do not fear disorder: if you do not let it be disorderly, the contradictions cannot come out''; ''since late September more have united than not; they have had enough, I think workers, peasants, schools and offices rather do not want to go on; to settle everything needs some months more''; ''next year or the year after we hold a party congress, to build the Party anew''). Made public: 1993. To check: Mao Zedong 毛泽东, talk with the Albanian party and government delegation 阿尔巴尼亚党政代表团 (record 谈话记录), Oct. 12, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.79). Names: Mao Zedong, Mehmet Shehu, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun, Liu Shaoqi. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
