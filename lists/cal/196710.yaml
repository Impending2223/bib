  - id: cal.1967-10-01.opinion
    when: Oct. 1
    date: '1967-10-01'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Sept. 14–19: Democrats'' choice for 1968: Robert Kennedy 39 percent, Johnson 37, Goldberg 8, Humphrey 6, McNamara 5; no preference 5. The convention''s choice between the two: Kennedy 51, Johnson 39, undecided 10. Those 21 to 29, Kennedy 66; 50 and over, 41.'
    n: '[[w.gallup-poll]], III, 2083–84. Names: Kennedy, Johnson, Goldberg, Humphrey, McNamara.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:goldberg-arthur-j, name:humphrey-hubert-h, name:mcnamara-robert-s]
  - id: cal.1967-10-02.court
    when: Oct. 2
    date: '1967-10-02'
    thread: court
    c: The October Term opens; Marshall, confirmed Aug. 30, takes his seat, the first Negro on the Court. Sept. 30, at the ranch, Johnson had named Erwin N. Griswold, dean of the Harvard Law School, Solicitor General in Marshall's place; sworn Oct. 23.
    n: 'The President''s News Conference at the LBJ Ranch, [1967 Pub. Papers 882](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=274) (Sept. 30, 1967); Remarks at the Swearing In of Erwin N. Griswold as Solicitor General, [1967 Pub. Papers 939](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=331) (Oct. 23, 1967). To check: [[w.williams-thurgood-marshall]]. See [[cal.1967-06-13.court]]. Names: Marshall, Griswold, Johnson.'
    tags: [name:marshall-thurgood, name:griswold-erwin-n, name:johnson-lyndon-b]
  - id: cal.1967-10-02.vietnam
    when: Oct. 2
    date: '1967-10-02'
    thread: vietnam-elections
    c: 'Saigon. The Constituent Assembly validates the election of Thiệu and Kỳ shortly before midnight, 58–43, five ballots invalid. Sept. 28, four members of the Democratic Alliance Bloc on its Special Election Committee had sent Bunker their price for voting validation: Kỳ to name the Prime Minister and three ministers, and 300,000 piasters for each member of the Bloc. Bunker had it passed to Kỳ and warned he would make it public.'
    n: 'FRUS 1964–68, V, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v05/d342) (Bunker''s weekly telegram, Oct. 4). Made public: [[w.bunker-papers]], 185–195. [[w.gibbons-u-s-government-and]], IV, 775–76 (the validation). See [[cal.1967-09-03.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:bunker-ellsworth, place:saigon]
  - id: cal.1967-10-02.vietnam-congress
    when: Oct. 2
    date: '1967-10-02'
    thread: vietnam-congress
    c: 'Cooper in the Senate: stop the bombing without condition, keep it stopped, the war confined to the South. Mansfield, Fulbright, Pell, Morton, Javits and Percy with him; Kuchel, Miller, Thurmond, Murphy, Dominick and McGee against. Percy: the President''s seven failures; McGee: "The Vietnam question ... is incidental."'
    n: '[113 Cong. Rec., Senate, Oct. 2, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-8-1.pdf), 27441 ff. (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 829–30. Names: Cooper, Mansfield, Fulbright, Pell, Morton, Javits, Percy, Kuchel, Thurmond, McGee, Miller, Murphy.'
    tags: [name:cooper-john-sherman, name:mansfield-mike, name:fulbright-j-william, name:pell-claiborne-d, name:morton-thruston-b, name:javits-jacob-k, name:percy-charles-h, name:kuchel-thomas-h, name:thurmond-strom, name:mcgee-gale-w, name:miller-jack-r, name:murphy-george]
  - id: cal.1967-10-03.economy
    when: Oct. 3
    date: '1967-10-03'
    thread: economy-surcharge
    c: Ways and Means sets the surcharge aside on Watts's motion, 20–5, until the President and Congress agree on cuts in spending; Mills for it. The House orders the rule for another continuing resolution, [213–205](https://voteview.com/rollcall/RH0900151).
    n: 'Daily Digest, [113 Cong. Rec. D505](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=503) (Oct. 3, 1967). [113 Cong. Rec., House, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-2.pdf). [[w.zelizer-taxing-america]], 264–65 (the day, the motion, Mills for it). Check: Zelizer, 265, counts Mills, ten Republicans and eight Democrats for the motion. [[w.gibbons-u-s-government-and]], IV, 760 (20–5, by CQ''s *Almanac*, 1967, 653). To check: [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1967-01-10.economy]]; [[cal.1967-08-03.economy]]. Names: Watts, Mills.'
    tags: [name:mills-wilbur-d, name:watts-john-c]
  - id: cal.1967-10-03.mayors-cleveland
    when: Oct. 3
    date: '1967-10-03'
    thread: mayors
    also: [elections-1967]
    c: Cleveland's Democratic primary for mayor. Carl Stokes, a State representative, over Mayor Locher, 110,769 to 92,033, 53.7 percent; a third 3,545, 1.7 percent.
    n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. To check: [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.nelson-electing-black-mayors]]; [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]. See [[cal.1965-11-02.mayors-cleveland]]. Names: Stokes, Locher.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:locher-ralph-s]
  - id: cal.1967-10-03.vietnam
    when: Oct. 3
    date: '1967-10-03'
    thread: vietnam
    also: [vietnam-pennsylvania, elections-1968]
    c: 'Johnson with Rusk, McNamara, Rostow, Helms, Christian and Tom Johnson, 6:10 to 9:32 p.m. Rusk, from the United Nations: no one can say what would follow a halt; Moscow has given up trying to move Hanoi. Johnson: no halt unless Hanoi agrees to meet promptly and push for a settlement. Rostow: the bombing costly to Hanoi; McNamara: "I do not agree." From the Friendly Five reports: all "think that we will lose the election if we do not do something about Vietnam quick." Of the march on the Pentagon: "They are not going to run me out of town." Nothing to leave the room: what would it do to the war if he announced he would not run? "If it were set either way today, the decision would be that he would not run." Rusk: "You must not go down."'
    n: 'FRUS 1964–68, V, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.gibbons-u-s-government-and]], IV, 784, 807–08, 839, 861 (Tom Johnson''s notes); [[w.johnson-vantage-point]], 428 (the question of not running). Made public: Johnson''s memoir (1971), the question; the notes, FRUS 1964–68, V (2002). See [[cal.1967-08-21.vietnam-congress]]. Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
    src:
      c: 5e9a6f19
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d341: all'
        - 'w.gibbons-u-s-government-and IV, 784, 807–08, 839, 861: ?'
        - 'w.johnson-vantage-point 428: A, I-J'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:helms-richard, name:christian-george]
    aliases: [cal.1967-10-03.elections-1968]
  - id: cal.1967-10-03.vietnam-congress
    when: Oct. 3
    date: '1967-10-03'
    thread: vietnam-congress
    c: 'Dirksen in the Senate, supplied by the executive at Johnson''s direction: Vietnam "our outside security line"; "I was not made a Senator to preside over the liquidation of the holy fabric of freedom." Case answers; Fulbright and he at it nearly two hours.'
    n: '[113 Cong. Rec., Senate, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-1.pdf), 27576–84 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 832–33. To check: *New York Times*, Oct. 4, 1967; [[w.macneil-dirksen]], 301. Gibbons puts Kuchel''s speech earlier that day; his page, 27442, is in the Senate''s day of Oct. 2. See [[cal.1967-10-02.vietnam-congress]]. Names: Dirksen, Johnson, Case, Fulbright, Kuchel.'
    tags: [name:dirksen-everett, name:johnson-lyndon-b, name:case-clifford-p, name:fulbright-j-william, name:kuchel-thomas-h]
  - id: cal.1967-10-04.opinion
    when: Oct. 4
    date: '1967-10-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 14–19: Rockefeller and Reagan 55 percent, Johnson and Humphrey 41, undecided 4. Democrats: Johnson–Humphrey 68, Rockefeller–Reagan 29. Independents: Rockefeller–Reagan 62, Johnson–Humphrey 30.'
    n: '[[w.gallup-poll]], III, 2084–85. Names: Rockefeller, Reagan, Johnson, Humphrey.'
    tags: [name:rockefeller-nelson, name:reagan-ronald, name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1967-10-04.poverty
    when: Oct. 4
    date: '1967-10-04'
    thread: poverty
    c: The Senate recommits S. 2388, the Economic Opportunity Amendments, to strike Clark's title II, the emergency employment act, [54–28](https://voteview.com/rollcall/RS0900208).
    n: '[113 Cong. Rec., Senate, Oct. 4, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-1-2.pdf). See [[cal.1967-09-26.poverty]]. Names: Clark.'
    tags: [name:clark-joseph-s]
  - id: cal.1967-10-04.vietnam
    when: Oct. 4
    date: '1967-10-04'
    thread: vietnam
    also: [vietnam-air-war, vietnam-pennsylvania]
    c: 'Johnson with Rusk, McNamara, Rostow and Christian, 7:02 to 7:55 p.m., on two messages from Paris: Bộ has withdrawn "solemn engagement to talk." Johnson: "We need to pour the steel on. Let''s hit them every day and go every place except Hanoi"; of the 24 targets left, "Hit all you can." McNamara of Kissinger: "the best I''ve seen in my seven years." Of Percy''s resolution: "Tell Percy we will listen to him at any time and any place."'
    n: 'FRUS 1964–68, V, doc. [346](https://history.state.gov/historicaldocuments/frus1964-68v05/d346). [[w.gibbons-u-s-government-and]], IV, 785, 831 (Percy). Made public: FRUS 1964–68, V (2002). See [[cal.1967-10-03.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Mai Văn Bộ, Kissinger, Percy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:christian-george, name:mai-van-bo, name:kissinger-henry-a, name:percy-charles-h]
  - id: cal.1967-10-04.vietnam-2
    when: Oct. 4
    date: '1967-10-04'
    thread: vietnam
    also: [war-opposition]
    c: 'Watson to Rostow: Johnson wants to see the telegrams answering San Antonio, and those against it sent to the FBI "to run a check on" their senders. Rostow''s office does both.'
    n: '[[w.gibbons-u-s-government-and]], IV, 784 (a note from Rostow''s staff to Rostow, Oct. 4, 1967, LBJ Library, NSF Country File, Vietnam). Made public: [[w.gibbons-u-s-government-and]], IV (1995). See [[cal.1967-09-29.vietnam]]. Names: Watson, Rostow, Johnson.'
    tags: [name:watson-w-marvin, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-10-04.war-opposition
    when: Oct. 4
    date: '1967-10-04'
    thread: war-opposition
    c: 'Cabinet. Clark on the march: other events to be staged to draw people off; the sponsors pacifists and "extreme Left-wing groups with long lines of Communist affiliations." Rusk: "Wouldn''t it help to leak that?" Gardner: "they must know that!" Clark: given to some columnists. Johnson: "Let''s see it some more"; "Every day, Senators attack us."'
    n: '[[w.gibbons-u-s-government-and]], IV, 861–62 (notes of the Cabinet meeting, LBJ Library, Cabinet Papers). See [[cal.1967-09-20.war-opposition]]. Names: Clark, Rusk, Gardner, Johnson.'
    tags: [name:clark-ramsey, name:rusk-dean, name:gardner-john-w, name:johnson-lyndon-b]
  - id: cal.1967-10-05.economy-surcharge
    when: Oct. 5
    date: '1967-10-05'
    thread: economy-surcharge
    c: 'Johnson signs the continuing resolution, [81 Stat. 256](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg256.pdf), funds to Oct. 23. News conference: a $5 billion cut in fiscal 1968 spending would mean appropriations cut by up to $10 billion; let the House name the cuts, bill by bill; "the cruelest tax of all is the inflation tax."'
    n: 'The President''s News Conference, [1967 Pub. Papers 894](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=286) (Oct. 5, 1967). See [[cal.1967-10-03.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-05.poverty
    when: Oct. 5
    date: '1967-10-05'
    thread: poverty
    c: The Senate passes S. 2388, the Economic Opportunity Amendments, [60–21](https://voteview.com/rollcall/RS0900214). No aid for voter registration, [85–3](https://voteview.com/rollcall/RS0900213).
    n: '[113 Cong. Rec., Senate, Oct. 5, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-2-2.pdf). See [[cal.1967-09-26.poverty]].'
  - id: cal.1967-10-05.vietnam-pennsylvania
    when: Oct. 5
    date: '1967-10-05'
    thread: vietnam-pennsylvania
    c: 'Johnson with Rusk, McNamara and Rostow, 6:55 to 8:25 p.m., on the new message for Bộ. Johnson: "This proposal may lead them to a meeting, but it may lead me into a trap." Rusk''s words, "in accordance with its proposal of August 25," carry the no-advantage assumption; "without expression of condition" kept. Mansfield and Dirksen told? "Not until we have something."'
    n: 'FRUS 1964–68, V, doc. [348](https://history.state.gov/historicaldocuments/frus1964-68v05/d348). [[w.gibbons-u-s-government-and]], IV, 786. Made public: FRUS 1964–68, V (2002). See [[cal.1967-10-04.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Mai Văn Bộ, Mansfield, Dirksen.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:mai-van-bo, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1967-10-05.vietnam-congress
    when: Oct. 5
    date: '1967-10-05'
    thread: vietnam-congress
    c: 'Percy offers S. Res. 173, sixteen Republicans and five Democrats with him: American forces not to bear an ever larger share of the fighting; the non-Communist nations of Asia to give more. Dirksen: "full of mischief." Nitze and William Bundy: it could be taken in Asia as American pressure.'
    n: 'Percy, Oct. 5: [113 Cong. Rec. 28038](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-2-2.pdf#page=59) (S. Res. 173 and its twenty-one cosponsors). [[w.gibbons-u-s-government-and]], IV, 830–31. To check: *New York Times*, Oct. 6, 1967; William Bundy, "Late Note for the President''s Evening Reading," Oct. 4, 1967 (LBJ Library). See [[cal.1967-10-02.vietnam-congress]]. Names: Percy, Dirksen, Nitze, William Bundy.'
    src:
      c: 16af06cb
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-2-2.pdf#page=59: A-B'
        - 'w.gibbons-u-s-government-and IV, 830–31: all'
    tags: [name:percy-charles-h, name:dirksen-everett, name:nitze-paul, name:bundy-william]
  - id: cal.1967-10-05.vietnam
    when: Oct. 5
    date: '1967-10-05'
    thread: vietnam
    c: 'Rusk to his staff conference, after a *Times* story on dissent within the Government: "Either support the President or keep quiet"; "This is not a debating society." The decision not to create a war psychology: "Maybe this was a mistake."'
    n: '[[w.gibbons-u-s-government-and]], IV, 906–07 (Lindley to the Policy Planning Council, Oct. 5, 1967, State, Lot File 71 D 273). Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1967-10-06.vietnam
    when: Oct. 6
    date: '1967-10-06'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. A note for Bộ through Kissinger and Marcovich: the United States understands that upon the cessation of all bombardment of the North, "without expression of condition," the North would enter promptly into productive discussions; if so, it will give the date the bombing would stop and suggest a date and a place for talks.'
    n: 'FRUS 1964–68, V, doc. [349](https://history.state.gov/historicaldocuments/frus1964-68v05/d349). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 786–87. See [[cal.1967-07-21.vietnam]]. Names: Mai Văn Bộ, Kissinger, Marcovich.'
    tags: [name:mai-van-bo, name:kissinger-henry-a, name:marcovich-hebert]
  - id: cal.1967-10-06.economy-surcharge
    when: Oct. 6
    date: '1967-10-06'
    thread: economy-surcharge
    c: 'Mills, in a statement on federal spending and the growth of government: the committee''s action "not irresponsible, bullheaded, or spiteful," but the anxiety members found at home over the Labor Day recess about "the recent sharp rise in federal outlays."'
    n: 'Robison, "Who Killed Cock Robin?," extension of remarks, Oct. 10, 1967, [113 Cong. Rec. 28500](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-5-3.pdf#page=2) (Mills''s statement quoted). [[w.zelizer-taxing-america]], 265; [[w.gibbons-u-s-government-and]], IV, 760–61 (the day). Check: Robison has the statement "released last weekend." See [[cal.1967-10-03.economy]]. Names: Mills.'
    tags: [name:mills-wilbur-d]
  - id: cal.1967-10-08.opinion
    when: Oct. 8
    date: '1967-10-08'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, Aug. 24–29: in a better position to end the war, a Republican President 31 percent, a Democratic President 21; no difference, no opinion 48.'
    n: '[[w.gallup-poll]], III, 2085.'
  - id: cal.1967-10-08.robert-kennedy
    when: Oct. 8
    date: '1967-10-08'
    thread: robert-kennedy
    also: [elections-1968, democratic-party]
    c: 'New York. Salinger''s meeting on 1968: Edward Kennedy, Stephen Smith, Sorensen, O''Donnell; Robert Kennedy absent. Sorensen for waiting until 1972; O''Donnell: Johnson a bully and a coward who would run from a fight.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 829. To check: Joseph Dolan, oral history interview by L. J. Hackman, Apr. 10, 1970, 76; Pierre Salinger, oral history interview by L. J. Hackman, May 26, 1969, 51; Kenneth O''Donnell, oral history interview by L. J. Hackman, Apr. 3, 1969, 7, RFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 829 n.34). Names: Salinger, Edward Kennedy, Stephen Smith, Sorensen, O''Donnell, Robert Kennedy, Johnson.'
    src:
      c: 9ca37fb2
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 829: all'
        - 'via w.schlesinger-robert-kennedy-and-his 829 n.34: all'
    tags: [name:salinger-pierre, name:kennedy-edward-m, name:smith-stephen-e, name:sorensen-theodore-c, name:odonnell-kenneth-p, name:kennedy-robert-f, name:johnson-lyndon-b, state:ny, city:nyc]
  - id: cal.1967-10-09.latin-america
    when: Oct. 9
    date: '1967-10-09'
    thread: latin-america
    also: [cuba]
    c: 'Bolivia. Che Guevara, captured Oct. 8 by the Bolivian army''s Second Ranger Battalion, trained by Americans, is shot at La Higuera, 1:15 p.m., on orders from army headquarters at La Paz. Oct. 10, the army: dead of wounds received in battle. Rostow to Johnson, Oct. 11: "I regard this as stupid, but it is understandable from a Bolivian standpoint."'
    n: 'FRUS 1964–68, XXXI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v31/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v31/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v31/d173). Made public: FRUS 1964–68, XXXI (2004) (Check). To check: [[w.anderson-che-guevara]]; [[w.rabe-killing-zone]]. Names: Guevara, Rostow, Johnson.'
    tags: [name:guevara-ernesto, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-10-09.vietnam-congress
    when: Oct. 9
    date: '1967-10-09'
    thread: vietnam-congress
    c: 'Mansfield''s letter to every Senator: go to the Security Council "win or lose," a recorded vote to show "who is willing and who is not willing." Johnson to Rostow: "get me a reply quickly."'
    n: 'The letter, [113 Cong. Rec., Senate, Oct. 12, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-7-2.pdf), 28857–58 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 918–19. See [[cal.1967-09-19.vietnam-congress]]. Names: Mansfield, Johnson, Rostow.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1967-10-10.space
    when: Oct. 10
    date: '1967-10-10'
    thread: space
    also: [soviet-union]
    c: 'The Outer Space Treaty, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf), in force, the ratifications of the United States, Britain and the Soviet Union deposited in Washington, London and Moscow; proclaimed the same day. Johnson, in the East Room, with Rusk, Dobrynin and the British ambassador: "the intention of 84 nations" that the exploration of space remain peaceful; no weapons of mass destruction in orbit, no bases on the moon, no weapons tested in space.'
    n: 'Remarks at Ceremony Marking the Entry Into Force of the Outer Space Treaty, [1967 Pub. Papers 918](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=310) (Oct. 10, 1967). See [[cal.1967-01-27.space]]. Names: Johnson, Rusk, Dobrynin.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1967-10-11.opinion
    when: Oct. 11
    date: '1967-10-11'
    thread: opinion
    also: [jobs-and-wages, labor-disputes]
    c: 'Gallup, Sept. 14–19: have heard of the strike between Ford and the Auto Workers, 90 percent. Of them, sympathies with the company 40, the union 26. Labor unions in general: approve 66, disapprove 23.'
    n: '[[w.gallup-poll]], III, 2085.'
  - id: cal.1967-10-11.vietnam
    when: Oct. 11
    date: '1967-10-11'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Tuesday lunch, 12:55 to 1:03 p.m.: McConnell, acting chairman, for striking Phúc Yên; McNamara: "militarily marginal"; Rusk: wait some days. Johnson waits, and asks a "strategy for the next 12 months on Vietnam—military, political, negotiating"; "too much vague talk."'
    n: '[[w.gibbons-u-s-government-and]], IV, 787–88. To check: notes of the meeting and Rostow''s typed notes (LBJ Library). Names: McConnell, McNamara, Rusk, Johnson.'
    tags: [name:mcconnell-john-p, name:mcnamara-robert-s, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1967-10-11.vietnam-congress
    when: Oct. 11
    date: '1967-10-11'
    thread: vietnam-congress
    also: [war-opposition]
    c: 'McCormack in the House, quoting Giáp on American dissent, "a valuable mark of sympathy": "If I were one of those, my conscience would be such that it would disturb me the rest of my life"; a standing ovation from some hundred members.'
    n: '[113 Cong. Rec., House, Oct. 11, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-6-2.pdf), 28611 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 840. To check: *New York Times*, Oct. 12, 1967. Gibbons dates the speech Oct. 12; his page is in the House''s day of Oct. 11. Names: McCormack, Võ Nguyên Giáp.'
    tags: [name:mccormack-john-w, name:vo-nguyen-giap]
  - id: cal.1967-10-12.vietnam
    when: Oct. 12
    date: '1967-10-12'
    thread: vietnam
    also: [china]
    c: 'Rusk, at a news conference: Vietnam vital to the security of the United States; within a decade or two, "a billion Chinese on the mainland, armed with nuclear weapons," "with no certainty about what their attitudes toward the rest of Asia will be." McCarthy, Oct. 16: Rusk raising a "yellow peril."'
    n: '[*New York Times*, Oct. 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/13/issue.html); [Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html). FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.gibbons-u-s-government-and]], IV, 845–47 (the transcript, *Bulletin*, Oct. 30, 1967; McCarthy, 113 Cong. Rec. 28929–31). To check: [[w.schoenbaum-waging-war-and-peace]]; [[w.rusk-as-i-saw-it-1990]]. Names: Rusk, McCarthy.'
    tags: [name:rusk-dean, name:mccarthy-eugene-j]
  - id: cal.1967-10-12.vietnam-congress
    when: Oct. 12
    date: '1967-10-12'
    thread: vietnam-congress
    c: 'William Fitts Ryan and 29 other Representatives, 27 Democrats and 3 Republicans, to Johnson: stop the bombing of the North.'
    n: '[[w.gibbons-u-s-government-and]], IV, 839 n.125. To check: the letter (LBJ Library, WHCF, Name File, Ryan). Names: Ryan, Johnson.'
    tags: [name:ryan-william-f, name:johnson-lyndon-b]
  - id: cal.1967-10-13.women
    when: Oct. 13
    date: '1967-10-13'
    thread: women
    c: 'Executive Order 11375: "sex" written into Executive Order 11246. Equal opportunity without discrimination because of sex in federal employment, in 30 days, and by federal contractors and subcontractors, in a year; the Civil Service Commission to hear complaints in federal employment.'
    n: '[Executive Order 11375](https://www.presidency.ucsb.edu/documents/executive-order-11375-amending-executive-order-no-11246-relating-equal-employment), [32 Fed. Reg. 14303](https://www.govinfo.gov/content/pkg/FR-1967-10-17/pdf/FR-1967-10-17.pdf#page=5) (Oct. 17, 1967). To check: [[w.harrison-on-account-of-sex]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-13.economy-surcharge
    when: Oct. 13
    date: '1967-10-13'
    thread: economy-surcharge
    c: 'Schultze and Ackley to Johnson, "Impasse on the Tax Increase": keep pressing "even if in your judgment there is no chance of getting a tax increase passed," and fix the responsibility on the Republicans.'
    n: '[[w.gibbons-u-s-government-and]], IV, 922 (LBJ Library, WHCF Ex LE/FI 11-4). See [[cal.1967-10-03.economy]]. Names: Schultze, Ackley, Johnson.'
    tags: [name:schultze-charles-l, name:ackley-gardner, name:johnson-lyndon-b]
  - id: cal.1967-10-15.opinion
    when: Oct. 15
    date: '1967-10-15'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey of independent voters: the Republican party, highly favorable 29 percent, highly unfavorable 3; the Democratic, 27 and 3. Best for keeping the nation out of war: Republican 28, Democratic 18. To keep it prosperous: Republican 25, Democratic 30.'
    n: '[[w.gallup-poll]], III, 2085–86.'
  - id: cal.1967-10-15.vietnam
    when: Oct. 15
    date: '1967-10-15'
    thread: vietnam
    c: '"MACV Strategic Study, September 1967–September 1968," sixty-eight pages: the enemy''s population base "slipping from his grasp." Pacification "of paramount importance"; the offensive cut to mobile brigades in each corps zone; American and South Vietnamese units integrated, against the forces'' eventual withdrawal.'
    n: '[[w.gibbons-u-s-government-and]], IV, 928–30 (National Archives, Westmoreland-CBS Papers). To check: [[w.sorley-thunderbolt]]. Names: Westmoreland.'
    tags: [name:westmoreland-william]
  - id: cal.1967-10-16.war-opposition
    when: Oct. 16–20
    date: '1967-10-16'
    thread: war-opposition
    also: [draft, students]
    c: 'Stop the Draft Week. Oct. 16, the Resistance''s day: draft cards turned in at rallies in some eighteen cities, Boston''s Arlington Street Church among them. Oakland: a sit-in at the induction center, Oct. 16, over a hundred arrested; the police clear the street with clubs, Oct. 17; some 10,000 hold the streets around the center, Oct. 20. Washington, Oct. 20: Coffin and Spock among those who bring the cards collected, some 990, to the Justice Department; not accepted. Check the counts.'
    n: '[*New York Times*, Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html); [Oct. 18, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/18/issue.html); [Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). FRUS 1964–68, V, docs. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 862–63 (Oct. 16, eighteen cities, from the *Times* of Oct. 17; Oct. 20, from Coffin''s memoir). To check: [[w.ferber-resistance]]; [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Coffin, Spock.'
    tags: [name:coffin-william-sloane-jr, name:spock-benjamin, state:ca, city:oakland, state:ma, city:boston, state:dc, city:washington]
  - id: cal.1967-10-16.states-and-cities-us
    when: Oct. 16
    date: '1967-10-16'
    thread: states-and-cities
    also: [elections-1968]
    c: The National Governors' Conference, its 59th meeting, sails aboard the *Independence*, New York to the Virgin Islands and back, Oct. 16–24.
    n: '*Proceedings of the National Governors'' Conference, 1967*. To check: [[w.sabato-goodbye-to-good-time]]; [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-07-01.states-and-cities-us]].'
  - id: cal.1967-10-16.open-housing-mi
    when: Oct. 16
    date: '1967-10-16'
    thread: open-housing
    also: [states-and-cities]
    c: Michigan. Demonstrators against Romney's open occupancy bill in the House gallery, some for Wallace.
    n: '*Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download), 1. See [[cal.1967-10.open-housing-mi]]. Names: Romney, Wallace.'
    tags: [state:mi, name:romney-george-w, name:wallace-george-c]
  - id: cal.1967-10-16.vietnam
    when: Oct. 16
    date: '1967-10-16'
    thread: vietnam
    also: [vietnam-pennsylvania]
    c: 'Johnson with Rusk, McNamara, Rostow, Helms and Christian. Rusk: no serious answer from Hanoi, "a one way conversation." McNamara for a pause of a month at least, "because of the domestic plus"; *Life* to call for one. Johnson: "How are we ever going to win?" McNamara: "I have no idea how we can win it in the next 12 months."'
    n: 'FRUS 1964–68, V, doc. [353](https://history.state.gov/historicaldocuments/frus1964-68v05/d353). [[w.gibbons-u-s-government-and]], IV, 788. Made public: FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:helms-richard, name:christian-george]
  - id: cal.1967-10-16.war-opposition-2
    when: Oct. 16
    date: '1967-10-16'
    thread: war-opposition
    c: 'Califano to Johnson: the preparations for the march on course; the leaks to the press on Communist influence "should discourage many less extreme antiwar sympathizers from attending."'
    n: '[[w.gibbons-u-s-government-and]], IV, 862 (LBJ Library, WHCF, HU 4). See [[cal.1967-10-04.war-opposition]]. Names: Califano, Johnson.'
    tags: [name:califano-joseph-a-jr, name:johnson-lyndon-b]
  - id: cal.1967-10-17.vietnam-pennsylvania
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Bộ''s answer: while the United States escalates, Hanoi can neither receive Kissinger nor comment; talks only when the bombing has ended without condition.'
    n: 'The answer, read at the meeting of Oct. 18: FRUS 1964–68, V, doc. [357](https://history.state.gov/historicaldocuments/frus1964-68v05/d357). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 789. See [[cal.1967-10-06.vietnam]]. Names: Mai Văn Bộ, Kissinger.'
    tags: [name:mai-van-bo, name:kissinger-henry-a]
  - id: cal.1967-10-17.vietnam-operations
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam-operations
    c: Ông Thành, a stream near the Bình Dương–Bình Long line. The 2d Battalion, 28th Infantry, of the 1st Infantry Division, ambushed in the jungle; its commander killed. American losses 56 killed, 75 wounded, 2 missing.
    n: '[[w.macgarrigle-united-states-army-in]], 353–361; [[w.villard-united-states-army-in]], 50, 101–102.'
    tags: [place:ong-thanh]
  - id: cal.1967-10-17.vietnam
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam
    c: 'McGeorge Bundy to Johnson, after a day''s talks in Washington: the policy "as right as ever," the war "a long, slow business." Strongly against any unconditional pause, an extended pause "for the sake of appearances," a headline-making intensification of the bombing, and a large reinforcement of Westmoreland beyond the totals agreed.'
    n: '[FRUS 1964–68, V, doc. 354](https://history.state.gov/historicaldocuments/frus1964-68v05/d354). [[w.johnson-vantage-point]], 373. Made public: in part, [[w.johnson-vantage-point]], 373; FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 872–73. Names: McGeorge Bundy, Johnson, Westmoreland.'
    src:
      c: 085e1edb
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d354: all'
        - 'w.johnson-vantage-point 373: all'
        - 'w.gibbons-u-s-government-and IV, 872–73: all'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:westmoreland-william]
  - id: cal.1967-10-17.vietnam-2
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam
    also: [vietnam-pennsylvania]
    c: 'Johnson with Rusk, McNamara, Wheeler, Helms, Rostow and Christian, 1:40 to 2:50 p.m.: "the news is all bad." Paris to be made known: Rusk to "disclose it under strong questioning" in a closed committee session; "It will take about two days to leak." McNamara to see Russell; Rusk''s people to "pull their gloves off." Hanoi''s bombing to resume after Oct. 20 without an answer. Rusk: Fulbright asks him to testify in public; "I do not want seven hours of public debate." Johnson: "I would go to the hearings and hit them hard and solid," not on television.'
    n: 'FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.gibbons-u-s-government-and]], IV, 789, 910 (the testimony, from Tom Johnson''s notes). Made public: FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara, Wheeler, Helms, Rostow, Christian, Russell, Fulbright.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:helms-richard, name:rostow-walt-w, name:christian-george, name:russell-richard-b, name:fulbright-j-william]
  - id: cal.1967-10-17.vietnam-3
    when: Oct. 17
    date: '1967-10-17'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'The Joint Chiefs, "Increased Pressures on North Vietnam," JCSM-555-67: progress slow "largely because US military power has been restrained." Ten actions, among them all targets of military worth freed, the deep-water ports mined, more in Laos and Cambodia. McNamara to Johnson: for six of the ten, not the targets, the ports, the naval operations or Cambodia.'
    n: '[[w.gibbons-u-s-government-and]], IV, 925–27 (the report and McNamara''s memorandum, State, Central File, Pol 27 Viet S). To check: [[w.pentagon-papers]], IV, 210–14 (the report). See [[cal.1967-09-12.vietnam-pennsylvania]]. Names: McNamara, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1967-10-17.economy-surcharge
    when: Oct. 17
    date: '1967-10-17'
    thread: economy-surcharge
    c: 'Johnson with McCormack, Albert and Mansfield, 5:35 to 6:55 p.m.: Mills "wants to cut 5 to 10 billion dollars in expenditures and then in programs"; "We are in an all-out, knock-down war."'
    n: '[[w.gibbons-u-s-government-and]], IV, 922–23 (Tom Johnson''s notes). See [[cal.1967-10-13.economy-surcharge]]. Names: Johnson, McCormack, Albert, Mansfield, Mills.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w, name:albert-carl, name:mansfield-mike, name:mills-wilbur-d]
  - id: cal.1967-10-17.democratic-party
    when: Oct. 17
    date: '1967-10-17'
    thread: democratic-party
    also: [elections-1968, robert-kennedy]
    c: 'McGovern to Robert Kennedy by telephone: McCarthy has about decided to enter the primaries against Johnson. Kennedy "terribly distressed": McCarthy will run strong in New Hampshire; early commitments to him would make it hard "if we wanted to make some other move." By McGovern''s account.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 826–27. To check: McGovern, oral history interview by L. J. Hackman, July 16, 1970, 44–46 (cited by [[w.schlesinger-robert-kennedy-and-his]], 827 n.19); Schlesinger, journal, Oct. 18, 1967. Check: the day (the day before Schlesinger''s entry). Names: McGovern, Robert Kennedy, Eugene McCarthy, Johnson.'
    src:
      c: 01918272
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 826–27: all'
        - 'via w.schlesinger-robert-kennedy-and-his 827 n.19: all'
    tags: [name:mcgovern-george, name:kennedy-robert-f, name:mccarthy-eugene-j, name:johnson-lyndon-b]
  - id: cal.1967-10-17.antisubversion
    when: Oct. 17
    date: '1967-10-17'
    thread: antisubversion
    also: [robert-kennedy]
    c: 'The Senate on S. 2171: Robert Kennedy leads the fight to abolish the Subversive Activities Control Board. Eugene McCarthy for keeping it.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 826. To check: 113 Cong. Rec. S14894–97 (daily ed. Oct. 17, 1967) (cited by [[w.schlesinger-robert-kennedy-and-his]], 826 n.18). Check: the day, and McCarthy''s vote (Oct. 23?). See [[cal.1967-10-23.antisubversion]]. Names: Robert Kennedy, Eugene McCarthy.'
    src:
      c: 1c1b1efe
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 826: all'
    tags: [name:kennedy-robert-f, name:mccarthy-eugene-j]
  - id: cal.1967-10-18.students
    when: Oct. 18
    date: '1967-10-18'
    thread: students
    also: [war-opposition]
    c: Madison. Students sit in at the University of Wisconsin's Commerce Building against the recruiters of Dow Chemical, maker of napalm; the city's police, called in, clear it with clubs and tear gas; some seventy hurt (Check).
    n: '[*New York Times*, Oct. 19, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/19/issue.html). To check: [[w.maraniss-they-marched-into-sunlight]].'
    tags: [state:wi, city:madison]
  - id: cal.1967-10-18.economy
    when: Oct. 18
    date: '1967-10-18'
    thread: economy-surcharge
    also: [congress]
    c: 'Continuing resolution, H.J. Res. 888. House: an amendment holding fiscal 1968 spending to fiscal 1967''s, Vietnam, the Post Office and some programs for persons excepted, [238–164](https://voteview.com/rollcall/RH0900166) (Check the exceptions); passed, [254–143](https://voteview.com/rollcall/RH0900168).'
    n: '[113 Cong. Rec., House, Oct. 18, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-1-2.pdf). To check: [[w.bernstein-guns-or-butter]]. See [[cal.1967-10-03.economy]].'
  - id: cal.1967-10-18.vietnam-pennsylvania
    when: Oct. 18
    date: '1967-10-18'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Johnson with Kissinger, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor and Clifford: Bộ''s answer a rejection.'
    n: 'FRUS 1964–68, V, doc. [357](https://history.state.gov/historicaldocuments/frus1964-68v05/d357). [[w.gibbons-u-s-government-and]], IV, 790–93. See [[cal.1967-10-06.vietnam]]. Names: Johnson, Kissinger, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor, Clifford.'
    tags: [name:johnson-lyndon-b, name:kissinger-henry-a, name:rusk-dean, name:mcnamara-robert-s, name:katzenbach-nicholas, name:rostow-walt-w, name:fortas-abe, name:taylor-maxwell, name:clifford-clark]
  - id: cal.1967-10-18.opinion
    when: Oct. 18
    date: '1967-10-18'
    thread: opinion
    also: [economy]
    c: 'Gallup, Oct. 6–11: the most urgent problem facing oneself and one''s family: the high cost of living 60 percent; sickness, health 8; Vietnam 5; racial problems 4; employment 3; old age 3. No problems 16.'
    n: '[[w.gallup-poll]], III, 2086.'
  - id: cal.1967-10-18.vietnam-congress
    when: Oct. 18
    date: '1967-10-18'
    thread: vietnam-congress
    c: 'Morris Udall to Johnson: "a letter which is painful to write"; he has concluded "our Vietnam policies are unwise and should be substantially modified." His speech, already mailed to 20,000 constituents: stop the bombing, enclaves, a settlement. Rostow, Oct. 21: "the most politically effective statement I have yet seen" for de-escalation.'
    n: '[[w.gibbons-u-s-government-and]], IV, 834–35. To check: Rostow to Johnson, Oct. 21, 1967, with Udall''s letter (LBJ Library, NSF Country File, Vietnam); Katzenbach to Johnson, Oct. 20, 1967 (State, Lot File 70 D 207). Names: Udall, Johnson, Rostow.'
    tags: [name:udall-morris-k, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1967-10-18.vietnam
    when: Oct. 18
    date: '1967-10-18'
    thread: vietnam
    c: 'McGeorge Bundy to Johnson, after Humphrey and Clifford: Clifford for "a gradually increasing squeeze" on the North. Of the dinner the night before: "You are surrounded by people you can trust."'
    n: '[[w.gibbons-u-s-government-and]], IV, 873–74 (McGeorge Bundy to Johnson, Oct. 18, 1967, LBJ Library, C.F. ND 19/CO 312). See [[cal.1967-10-17.vietnam]]. Names: McGeorge Bundy, Johnson, Humphrey, Clifford.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:humphrey-hubert-h, name:clifford-clark]
  - id: cal.1967-10-19.vietnam
    when: Oct. 19
    date: '1967-10-19'
    thread: vietnam
    c: 'Johnson with Clifford and Rostow on the pressure for a pause: the question to go to the senior advisers. Their memorandum of Oct. 20: ten of them to meet "to explore the problem of a pause." Johnson strikes Acheson and Fortas from the list, adds Taylor and Lodge; Acheson and Fortas asked after all.'
    n: '[[w.gibbons-u-s-government-and]], IV, 874–75 (Clifford and Rostow to Johnson, Oct. 20, 1967, with Johnson''s notes on it, LBJ Library, Diary Backup). To check: [[w.clifford-counsel-to-the-president-2]], 454; [[w.isaacson-wise-men]]. See [[cal.1967-10-18.vietnam]]. Names: Johnson, Clifford, Rostow, Acheson, Fortas, Taylor, Lodge.'
    tags: [name:johnson-lyndon-b, name:clifford-clark, name:rostow-walt-w, name:acheson-dean-g, name:fortas-abe, name:taylor-maxwell, name:lodge-henry-cabot]
  - id: cal.1967-10-19.vietnam-congress
    when: Oct. 19
    date: '1967-10-19'
    thread: vietnam-congress
    c: 'Rusk to Fulbright, asked to testify in public: a meeting "will run less risk of damaging our foreign relations if it were held in Executive Session."'
    n: '[[w.gibbons-u-s-government-and]], IV, 910 (read into the committee''s executive session of Oct. 31, unpublished transcript). See [[cal.1967-10-17.vietnam-2]]. Names: Rusk, Fulbright.'
    tags: [name:rusk-dean, name:fulbright-j-william]
  - id: cal.1967-10-20.mississippi
    when: Oct. 20
    date: '1967-10-20'
    thread: mississippi
    c: 'Meridian. *United States v. Price*: the jury convicts seven of conspiring against the rights of Chaney, Goodman and Schwerner, Deputy Price, Bowers, the White Knights'' Imperial Wizard, and Alton Wayne Roberts among them. Eight acquitted, Sheriff Rainey among them; no verdict on three, Killen among them. Judge Cox had sent the jury back with an *Allen* charge when it reported itself deadlocked.'
    n: '*Posey v. United States*, [416 F.2d 545](https://static.case.law/f2d/416/case-pdfs/0545-01.pdf) (5th Cir. 1969), the appeal. [*New York Times*, Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). [[w.dittmer-local-people]], 418 (seven convicted, Price and Bowers among them). To check: [[w.ball-murder-in-mississippi]]; [[w.cagin-we-are-not-afraid]]; [[w.mars-witness-in-philadelphia]]. See [[cal.1964-12-04.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Bowers, Roberts, Rainey, Killen, Cox.'
