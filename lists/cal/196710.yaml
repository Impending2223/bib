  - id: cal.1967-10-23.vietnam
    when: Oct. 23
    date: '1967-10-23'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Johnson with Rusk, McNamara, Rostow, Wheeler and Christian, 1:05 to 3:40 p.m. Helms: "you ended up where you began." Phúc Yên (authorized Sept. 28 and cancelled), two bridges and the power plant authorized: "Now we have gotten rid of all the excuses." Johnson: "It doesn''t seem we can win the war militarily"; "We''ve almost lost the war in the last two months in the court of public opinion." The reserves? McNamara: not needed. Of the draft-card protesters, Rusk: "I would enforce the law." The Joint Chiefs'' report of Oct. 17 "not what was desired."'
    n: 'FRUS 1964–68, V, docs. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363) (all but the Joint Chiefs'' report), [312](https://history.state.gov/historicaldocuments/frus1964-68v05/d312) (Phúc Yên). [[w.gibbons-u-s-government-and]], IV, 793–95, 868–69, 874, 927–28 (Tom Johnson''s notes; the report, from the Pentagon Papers). Made public: FRUS 1964–68, V (2002). To check: [[w.pentagon-papers]], IV, 536 (the report). See [[cal.1967-10-20.vietnam-pennsylvania]]; [[cal.1967-08-24.vietnam-air-war]]. Names: Johnson, Rusk, McNamara, Rostow, Wheeler, Christian, Helms.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:wheeler-earle, name:christian-george, name:helms-richard]
