    c: 'Stop the Draft Week. Oct. 16, the Resistance''s day: draft cards turned in at rallies in some eighteen cities, Boston''s Arlington Street Church among them. Oakland: a sit-in at the induction center, Oct. 16, over a hundred arrested; the police clear the street with clubs, Oct. 17; some 10,000 hold the streets around the center, Oct. 20. Washington, Oct. 20: Coffin and Spock among those who bring the cards collected, some 990, to the Justice Department; not accepted. Check the counts.'
    n: '[*New York Times*, Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html); [Oct. 18, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/18/issue.html); [Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). FRUS 1964–68, V, docs. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 862–63 (Oct. 16, eighteen cities, from the *Times* of Oct. 17; Oct. 20, from Coffin''s memoir); [[w.bernstein-guns-or-butter]], 420–21 (Boston Common, 4,000; San Francisco''s federal building, the cards dumped on Poole, 400 to the FBI; Oakland, 124 arrested, Baez among them); [[w.wells-war-within]], 191–95 (Oct. 16, Oakland, more than two hundred pacifists at the doors, arrested; San Francisco, Boston''s Arlington Street Church; twelve to fifteen hundred cards in eighteen cities; Oct. 17, the streets cleared, 25 arrested; Oct. 20, nearly ten thousand; Washington, 992 cards, McDonough will not take them); [[w.zaroulis-who-spoke-up]], 133–35 (the turn-ins, Boston''s at Arlington Street; Oakland, 125 arrested Oct. 16, clubs and mace Oct. 17, 10,000 Oct. 20; Coffin, Spock, Goodman and Raskin at Justice, the cards refused); [[w.debenedetti-american-ordeal]], 195–97 (over 1,100 cards; Boston and seventeen other centers; some 120 arrested at Oakland Oct. 16, 3,500 there Oct. 17, over 20 hospitalized, 10,000 against 2,000 police Oct. 20; Coffin and the Resistance refused at Justice; not Spock or the count of cards). Check: [[w.wells-war-within]] gives more than two hundred pacifists blocking the Oakland center''s doors Oct. 16, arrested (191). To check: [[w.ferber-resistance]]; [[w.foley-confronting-the-war-machine]]. Names: Coffin, Spock.'
