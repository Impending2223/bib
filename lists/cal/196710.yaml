    c: 'Mao reads the Qinghai Party core group''s telegram of Oct. 19 to the Center and the Group asking to restore Party life: to the Group to discuss and answer, and to the localities to follow. On "may Party life be restored," he writes "should be so." On Oct. 26 Zhang Chunqiao tells Liu Xianquan by telephone that the units with revolutionary committees may restore Party life, but the matter is large: how to "restore"; whether all old members take part; leadership organs first or all together.'
