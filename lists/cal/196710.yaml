    c: 'Zhou Enlai writes on the General Political Department''s report on appointing and removing army officers, to Ye Jianying and Yang Chengwu and for Lin Biao: reports and approvals of the Military Commission on daily administration, troop movement, appointments, unit organization, weapons and equipment, not part of supporting Left, farm, industry, military control and training, defence or foreign affairs, should go from the Commission and the General Staff direct to Vice-Chairman Lin for approval, not through his hands; otherwise too many papers pile up with him, he has no time, and exceeds his authority to the harm of great matters.'
