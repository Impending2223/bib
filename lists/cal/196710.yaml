    c: 'Mao reads, and slightly alters, the Center''s draft notice printing "Chairman Mao''s Important Instructions on His Inspection of North, Central-South and East China," the notes of his talks July 14–Sept. 23, which it issues that day: the situation "greatly good, not merely good"; "the confusion fooled the enemy and steeled the masses"; unite in great alliances; "among the working class there is no basic conflict of interest."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 7, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 121–126 (Oct. 7, 1967; the record of Mao''s talks on his inspection of North, Central-South and East China, July 14–Sept. 23, which the Center sent to the provincial revolutionary committees and military regions Oct. 7; the book prints it from the Center''s document with Mao''s revised copy; n.1 names the provinces: Hebei, Henan, Hubei, Hunan, Jiangxi, Zhejiang and Shanghai); [[w.mao-zedong-zhuan]], VI, ch. 76 (Oct. 7 the Center puts into order and sends on ''Chairman Mao''s important instructions on his inspection of North, Central-South and East China'' 《毛主席视察华北、中南和华东地区时的重要指示》, the first time since the January seizures that the Center sends down a rather systematic account by Mao of the Cultural Revolution; the tour lasted two months and ten days, Mao leaving Wuhan and passing through Henan to reach Peking on the 23rd; the book says the talks had little effect, Mao not having changed the guiding idea of the Cultural Revolution). [[w.dikotter-cultural-revolution]], 164 n.3 (Mao''s tour of the areas near civil war, calling for a great alliance: "There is no reason whatsoever for the working class to split into two irreconcilable organisations," broadcast again and again to the nation in a Great Strategic Plan); [[w.liu-jixian-ye-jianying-nianpu]], II, 970–971 (Oct. 7, 1967; the Center sends down Mao''s talks on his inspection; in them, on the struggle with Zhang Guotao''s 张国焘 splitting on the Long March, Mao, touching his head: "Comrade Ye Jianying did a great service at the crucial moment. Without him, there would be none of this. He saved the Party, saved the Red Army, saved us"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: [[w.milton-wind-will-not-subside]], 292–293 (cited by [[w.dikotter-cultural-revolution]], 164 n.3). Names: Mao Zedong.'
