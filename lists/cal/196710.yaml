  - id: cal.1967-10-03.china-leadership
    when: Oct. 3
    date: '1967-10-03'
    time: 1967-10-03T09:00Z
    place: peking
    thread: china-leadership
    c: 'Great Hall, room 118. Mao receives the Congo (Brazzaville) government delegation under Prime Minister Noumazalay, Zhou Enlai, Li Xiannian and Xu Yixin present, on the Cultural Revolution. Anarchism has grown too; better exposed, so that we can teach. Some Red Guards strike blindly, want to bring down Chen Yi, Zhou Enlai and Li Xiannian, which is wrong; those cadres are to be protected. Of officials: rank up, pay up, a better house, a car: all well, only no bureaucratic airs; one thing he asks of them: no official''s airs.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 3, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 189 (Oct. 3, 1967; Zhou with Mao at the reception of Premier Noumazalaye of Congo (Brazzaville); Mao on Red Guards beating blindly and wanting to bring down Chen Yi, Zhou and Li Xiannian); [[w.zhou-enlai-waijiao-huodong]], 517 (Oct. 3, 1967; 5 p.m., Hall 118, Great Hall of the People; Zhou accompanies Mao in receiving Prime Minister Noumazalaye and his delegation); [[w.mao-zedong-zhuan]], VI, ch. 76 n.78 (Oct. 3, to Noumazalay, n.78: ''the cultural revolution is to remake part of our state machine''; of cadres: ''all I ask of you is one thing, put down the bureaucratic airs, treat people equally, no scolding at every turn''; ''this year and more of great criticism has given the cadres a fright''; ''anarchism has also grown much, it is good that it is exposed, we can educate''; to Noumazalay''s remark that foreigners say China is very disorderly: ''when it has been disorderly a while it will not be, even if asked, they have had enough''; ''two sides in one factory and fighting so fiercely, no reason; when they have fought enough they will not want to, the heads isolated; a word from the Center is a way down, too early is no good''; ''it is like a body covered with boils, squeeze out the pus and it is healthier''). To check: Mao Zedong 毛泽东, talk with Noumazalay 努马扎莱 (record 谈话记录), Oct. 3, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.78). Names: Mao Zedong, Noumazalay, Zhou Enlai, Li Xiannian, Xu Yixin, Chen Yi. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
