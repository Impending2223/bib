    c: 'Johnson with Rusk, McNamara, Rostow, Wheeler and Christian, 1:05 to 3:40 p.m. Helms: "you ended up where you began." Phúc Yên (authorized Sept. 28 and cancelled), two bridges and the power plant authorized: "Now we have gotten rid of all the excuses." Johnson: "It doesn''t seem we can win the war militarily"; "We''ve almost lost the war in the last two months in the court of public opinion." The reserves? McNamara: not needed. Of the draft-card protesters, Rusk: "I would enforce the law." The Joint Chiefs'' report of Oct. 17 "not what was desired."'
