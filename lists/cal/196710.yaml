    c: 'Johnson tells the congressional leaders of Pennsylvania. Of the bombing, by Tom Johnson''s notes as Mann quotes them: Hickenlooper, "If we stop the bombing ... we will surrender in effect"; Dirksen, "I am still in your corner"; Russell Long, "step it up." Mansfield alone against it: "We could bomb North Vietnam into the Stone Age if we wanted to"; contact between the NLF and Saigon. Johnson: "I am not prepared to act simply on hope."'
