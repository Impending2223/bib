    c: 'Rostow, for Clifford and himself, to Johnson: the senior advisers to meet Nov. 1–2, "since there is no single issue like a pause": an evening briefing at State, then the President. Their advice to be asked on the bombing, an unconditional pause, peace initiatives, the war in the South and support at home.'
