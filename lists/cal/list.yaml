# Cal.: page text and outline. Entries live in the files named by 'file'.
page_title: Calendar, January–September 1961
h1: 'Calendar of the Kennedy and Johnson years: January 20 to September 30, 1961'
lede: 'Executive, legislative, judicial, and state events from the inauguration to the end of September 1961: the first session of the 87th Congress (Jan. 3–Sept. 27), and the first eight months of the Kennedy administration.'
logic:
  - Seventh list in the series. This one is Cal. It points into K–J Adm. and K–J Cong., and into the earlier lists where they hold the record.
  - 'How to read it. One entry per event, by date, with the thread in parentheses. The line says what happened. The note gives sources: the first entry of each thread carries its bibliography, and later entries point back by date ("See Apr. 15"). Books already in a list are cited by short title with the list and section; works found only here are cited in full. Names point to Part III of the lists. Presidential messages, speeches, and press conferences are cited by title and date; all are in the *Public Papers* for 1961 and on the American Presidency Project (K–J Adm. II.K). FRUS means *Foreign Relations of the United States, 1961–1963*, by volume. Votes link to Voteview where the roll call is identified. "Check" marks a detail to verify.'
  - 'Three parts: the threads, a short prologue, then the months.'
