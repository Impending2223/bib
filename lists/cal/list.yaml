# Cal.: page text and outline. Entries live in the files named by 'file'.
page_title: Calendar, January 1960–December 1962
h1: 'Calendar of the Eisenhower and Kennedy years: the 86th Congress''s second session and the 87th Congress, January 6, 1960, to December 31, 1962'
lede: 'Executive, legislative, judicial, and state events from the opening of the 86th Congress''s second session, Jan. 6, 1960, to the end of 1962: that session (Jan. 6–Sept. 1, 1960); the 87th Congress''s first session (Jan. 3–Sept. 27, 1961) and second (Jan. 10–Oct. 13, 1962); the Eisenhower administration''s last year, the campaign and election of 1960, the transition, and the Kennedy administration''s first two years. The second calendar takes up in January 1963, at the 88th Congress''s opening.'
logic:
  - Seventh list in the series. This one is Cal. It points into K–J Adm. and K–J Cong., into Viet. for the war, and into the earlier lists where they hold the record.
  - 'How to read it. Laid out by day. Each day gives its date, the *New York Times* for that date, the entries for events that began that day, each under its thread in small capitals, and the day''s documents, closed until opened: the President''s (American Presidency Project) and FRUS, every document dated that day. A later day of an event that ran several days points back to it. The line says what happened. The note gives sources: the first entry of each thread carries its bibliography, and later entries point back by date ("See Apr. 15"). Works are cited in full at their first appearance in each calendar, by short form after, each linked to its entry in Works, the A–Z bibliography. Names point to Part III of the lists. Presidential messages, speeches, and press conferences are cited by title and date; all are in the *Public Papers* (Eisenhower''s 1960–61 volume; Kennedy''s for 1961, 1962 and 1963; Johnson''s from Nov. 22, 1963, in his 1963–64 and 1965 volumes) and on the American Presidency Project (K–J Adm. II.K). FRUS means *Foreign Relations of the United States*, by subseries and volume: *1958–1960* for Eisenhower''s last year, *1961–1963*, and, from Nov. 22, 1963, *1964–1968*. Votes link to Voteview where the roll call is identified. "Check" marks a detail to verify.'
  - 'Indicators. Each month opens with a table of the figures that report on it, filed by the period they cover, not the date they were issued: months in their month, quarters in the quarter''s last month, fiscal years (July–June) in June, calendar years in December. Two values: as first reported, with its release date, and as revised today. First releases are from ALFRED (CPI, unemployment, payrolls, industrial production, GNP, real GNP; the deflator is GNP over real GNP in the same release). Wholesale prices, the budgets, the federal sector of the national accounts, and the balance of payments are from the next January''s *Economic Report*; for those, first reported means as reported then. Three budgets: the administrative budget (federal funds; the deficit of the headlines), the consolidated cash statement (with the trust funds), and the federal sector of the national income accounts. The unified budget came with fiscal 1969; today''s budget figures are on that basis. The over-all balance of payments is no longer published. The output gap: the CEA''s estimates then and the CBO''s now, in separate rows, since the concepts differ. Monthly changes are from the prior month, not annualized; CPI, wholesale prices, and industrial production add the change from a year earlier (y/y). Quarterly changes are at annual rates in both columns. Definitions and pointers: Indicators, concepts and sources, before the first month. A figure''s source shows on hover. Data: indicators/ in the repository.'
  - 'Parts: the threads, each with its dates in this calendar and, muted, its next in the second; the months, January 6, 1960, to December 1962. The presidential primaries of 1960 and each convention''s opening carry CQ''s returns: one entry a primary day with its table, and at the convention a map of the party''s primaries.'
