# Cal.: page text and outline. Entries live in the files named by 'file'.
page_title: Calendar, January 1961–January 1964; the primaries, 1960–1976
h1: 'Calendar of the Kennedy and Johnson years: the 87th Congress and the first session of the 88th, January 3, 1961, to January 7, 1964; with the presidential primaries and conventions of 1960, 1964, 1968, 1972 and 1976'
lede: 'Executive, legislative, judicial, and state events from the inauguration to the second session of the 88th Congress: the 87th''s first session (Jan. 3–Sept. 27, 1961) and second (Jan. 10–Oct. 13, 1962); the 88th''s first (Jan. 9–Dec. 30, 1963); the Kennedy administration and the first weeks of Johnson''s.'
logic:
  - Seventh list in the series. This one is Cal. It points into K–J Adm. and K–J Cong., into Viet. for the war, and into the earlier lists where they hold the record.
  - 'How to read it. Laid out by day. Each day gives its date, the *New York Times* for that date, the entries for events that began that day, each under its thread in small capitals, and the day''s documents, closed until opened: the President''s (American Presidency Project) and FRUS, every document dated that day. A later day of an event that ran several days points back to it. The line says what happened. The note gives sources: the first entry of each thread carries its bibliography, and later entries point back by date ("See Apr. 15"). Books already in a list are cited by short title with the list and section; works found only here are cited in full. Names point to Part III of the lists. Presidential messages, speeches, and press conferences are cited by title and date; all are in the *Public Papers* for 1961, 1962 and 1963 (Johnson''s from Nov. 22, 1963, in his 1963–64 volume) and on the American Presidency Project (K–J Adm. II.K). FRUS means *Foreign Relations of the United States, 1961–1963*, by volume, and, for Johnson''s weeks, *1964–1968*. Votes link to Voteview where the roll call is identified. "Check" marks a detail to verify.'
  - 'Indicators. Each month opens with a table of the figures that report on it, filed by the period they cover, not the date they were issued: months in their month, quarters in the quarter''s last month, fiscal years (July–June) in June, calendar years in December; December 1960 in the Prologue. Two values: as first reported, with its release date, and as revised today. First releases are from ALFRED (CPI, unemployment, payrolls, industrial production, GNP, real GNP; the deflator is GNP over real GNP in the same release). Wholesale prices, the budgets, the federal sector of the national accounts, and the balance of payments are from the next January''s *Economic Report*; for those, first reported means as reported then. Three budgets: the administrative budget (federal funds; the deficit of the headlines), the consolidated cash statement (with the trust funds), and the federal sector of the national income accounts. The unified budget came with fiscal 1969; today''s budget figures are on that basis. The over-all balance of payments is no longer published. The output gap: the CEA''s estimates then and the CBO''s now, in separate rows, since the concepts differ. Monthly changes are from the prior month, not annualized; CPI, wholesale prices, and industrial production add the change from a year earlier (y/y). Quarterly changes are at annual rates in both columns. Definitions and pointers: Indicators, concepts and sources, before the Prologue. A figure''s source shows on hover. Data: indicators/ in the repository.'
  - 'Parts: the threads; the primaries and conventions of 1960; a short prologue; the months, January 1961 to January 7, 1964; then the primaries and conventions of 1964, 1968, 1972 and 1976. The primary seasons hold only CQ''s returns, one entry a primary day with its table, and at each convention''s opening a map of the party''s primaries; the rest of those years is not yet written.'
