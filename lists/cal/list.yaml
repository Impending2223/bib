  lede: 'Executive, legislative, judicial, and state events from January 1963, the 88th Congress''s opening (Jan. 3), to Jan. 3, 1967, the 89th''s close: the 88th''s first session (Jan. 9–Dec. 30, 1963) and second (Jan. 7–Oct. 3, 1964); the 89th''s first (Jan. 4–Oct. 23, 1965) and second (Jan. 10–Oct. 22, 1966); the Kennedy administration''s last year, Johnson''s first term, and the first two years of his second. The first calendar runs from Jan. 6, 1960, to Dec. 31, 1962.'
