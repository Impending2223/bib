# Cal. LXIII August 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIII
entries:
  - id: cal.1965-08-03.voting-rights
    when: Aug. 3–4
    date: '1965-08-03'
    thread: voting-rights
    c: House adopts the conference report on the voting rights bill, S. 1564, [328–74](https://voteview.com/rollcall/RH0890107); recommittal lost, [118–284](https://voteview.com/rollcall/RH0890106). Senate, Aug. 4, [79–18](https://voteview.com/rollcall/RS0890178). The House's ban on the poll tax dropped for a finding that it abridges the right to vote and a direction to the Attorney General to sue.
    n: '[111 Cong. Rec., House, Aug. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-5-2.pdf); [111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). See [[cal.1965-07-09.voting-rights]].'
  - id: cal.1965-08-04.court
    when: Aug. 4
    date: '1965-08-04'
    thread: court
    also: [congress, states-and-cities]
    c: Dirksen's amendment to let one house of a State legislature be apportioned on factors other than population, if the voters approve, fails in the Senate, [57–39](https://voteview.com/rollcall/RS0890177), seven short of two-thirds. Offered as a substitute for S.J. Res. 66, a resolution for National American Legion Baseball Week; the substitute taken, [59–39](https://voteview.com/rollcall/RS0890176); Javits's, [12–85](https://voteview.com/rollcall/RS0890175).
    n: '[111 Cong. Rec., Senate, Aug. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf). S.J. Res. 2, 89th Cong. (Opp. II.H.2). Dixon, *Democratic Representation* (Opp. II.F). See [[cal.1964-09-10.court]]. Names: Dirksen (K–J Cong. III.A); Javits (K–J Cong. III.E).'
    tags: [name:dirksen-everett, name:javits-jacob-k]
  - id: cal.1965-08-05.vietnam
    when: Aug. 5
    date: '1965-08-05'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Cẩm Nê, south of Đà Nẵng, Aug. 3: Marines burn the hamlet''s huts, some with cigarette lighters, before a CBS camera. Safer''s film on the CBS evening news, Aug. 5. The Marines and the Pentagon dispute his account; Johnson complains to Stanton, CBS''s president. Check.'
    n: '[FRUS 1964–68, III, doc. 117](https://history.state.gov/historicaldocuments/frus1964-68v03/d117) (Aug. 10, the film discussed at the State Department). Hammond, *Public Affairs: The Military and the Media, 1962–1968* (Viet. II.I.3). Hallin, *The "Uncensored War"* (Viet. II.G.4). Arlen, *Living-Room War* (Viet. I.C). Shulimson & Johnson, *The Landing and the Buildup, 1965* (Viet. II.F.5). See [[cal.1965-07-28.vietnam]]. Names: Safer (Viet. III.F); Stanton (Cong. III.M).'
    tags: [name:safer-morley, name:stanton-frank, name:johnson-lyndon-b]
  - id: cal.1965-08-05.india-and-china
    when: Aug. 5–31
    date: '1965-08-05'
    thread: india-and-china
    c: 'Kashmir. Armed men from Pakistan, Operation Gibraltar, cross the cease-fire line into the valley from Aug. 5 to raise a rising; none follows. India''s army crosses the line Aug. 15, takes heights above the Srinagar–Leh road near Kargil, and the Haji Pir pass by Aug. 28. NSAM 337, Aug. 10: alternatives to the intelligence facilities in Pakistan to be readied. Aug. 31, Komer: the Pakistanis may send in regulars.'
    n: 'FRUS 1964–68, XXV, docs. [160](https://history.state.gov/historicaldocuments/frus1964-68v25/d160), [168](https://history.state.gov/historicaldocuments/frus1964-68v25/d168), [176](https://history.state.gov/historicaldocuments/frus1964-68v25/d176). [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-4) (Aug. 29, 1965). Dennis Kux, *The United States and Pakistan, 1947–2000: Disenchanted Allies* (2001). See [[cal.1965-06-30.india-and-china]]. Names: Komer (K–J Adm. III.E).'
    tags: [name:komer-robert-w, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1965-08-06.voting-rights
    when: Aug. 6
    date: '1965-08-06'
    thread: voting-rights
    c: Voting Rights Act signed in the President's Room off the Senate chamber, after Johnson's address in the Rotunda at noon, [79 Stat. 437](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg437.pdf). Literacy tests and like devices suspended where under half the voting-age population was registered on Nov. 1, 1964, or voted that November; federal examiners to list voters there; new voting rules there to be cleared by the Attorney General or the District Court in Washington. "The vote is the most powerful instrument ever devised by man for breaking down injustice."
    n: '[Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act](https://www.presidency.ucsb.edu/documents/remarks-the-capitol-rotunda-the-signing-the-voting-rights-act) (Aug. 6, 1965). Statute (K–J Cong. II.J.2). See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-15.voting-rights]]; [[cal.1965-08-03.voting-rights]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-06.opinion
    when: Aug. 6
    date: '1965-08-06'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, July 16–21: the Johnson Administration pushing integration too fast, 40 percent; not fast enough, 13; about right, 38. Southern whites 69 too fast; whites outside the South 36. Republicans 46 too fast; Democrats 35; independents 43.'
    n: '*The Gallup Poll*, III, 1955–56 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-07.voting-rights
    when: Aug. 7–10
    date: '1965-08-07'
    thread: voting-rights
    also: [civil-rights-the-executive]
    c: 'The act at work. Aug. 7, the coverage published: Alabama, Alaska, Georgia, Louisiana, Mississippi, South Carolina, Virginia, 26 counties of North Carolina, one of Arizona. Suit against Mississippi''s poll tax. Aug. 9, Katzenbach certifies nine counties for examiners: Dallas, Hale, Lowndes, Marengo in Alabama; East Carroll, East Feliciana, Plaquemines in Louisiana; Leflore and Madison in Mississippi. Examiners at work Aug. 10; suits against the poll tax in Texas, Alabama, Virginia. Check the dates of the suits. Aug. 25, Johnson: 27,385 listed in thirteen counties.'
    n: '[30 Fed. Reg. 9897](https://www.govinfo.gov/app/details/FR-1965-08-07) (Aug. 7, 1965); [30 Fed. Reg. 9970–71](https://www.govinfo.gov/app/details/FR-1965-08-10) (Aug. 10, 1965). [Remarks in the Capitol Rotunda at the Signing of the Voting Rights Act](https://www.presidency.ucsb.edu/documents/remarks-the-capitol-rotunda-the-signing-the-voting-rights-act) (Aug. 6, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1039) (Aug. 25, 1965). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). See [[cal.1965-08-06.voting-rights]]. Names: Katzenbach (K–J Adm. III.I).'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1965-08-10.cities-and-housing
    when: Aug. 10
    date: '1965-08-10'
    thread: cities-and-housing
    c: 'Housing and Urban Development Act of 1965 signed, [79 Stat. 451](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg451.pdf). Rent supplements: the Government to pay the owner of private nonprofit or limited-dividend housing what the rent exceeds a quarter of a low-income tenant''s income; payments up to $30 million a year at first, rising to $150 million a year from July 1968. FHA insurance, urban renewal, public and college housing extended. The Senate had kept rent supplements July 15, [40–47](https://voteview.com/rollcall/RS0890159) on striking them, and passed the bill, [54–30](https://voteview.com/rollcall/RS0890162); conference report, House, July 27, [251–168](https://voteview.com/rollcall/RH0890098). Aug. 11, the Senate passes the bill for a Department of Housing and Urban Development, [57–33](https://voteview.com/rollcall/RS0890179).'
    n: '[Remarks at the Signing of the Housing and Urban Development Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-housing-and-urban-development-act) (Aug. 10, 1965). [111 Cong. Rec., Senate, July 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-7-1.pdf); [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). Pritchett, *Robert Clifton Weaver and the American City* (K–J Adm. II.G.5). See [[cal.1965-06-16.cities-and-housing]]; [[cal.1965-06-30.cities-and-housing]]. Names: Weaver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c]
  - id: cal.1965-08-11.states-and-cities
    when: Aug. 11–16
    date: '1965-08-11'
    thread: states-and-cities
    c: 'Watts, Los Angeles. A highway patrolman arrests Marquette Frye for drunken driving at 116th Street and Avalon, Aug. 11; a crowd gathers; six days of rioting, looting, and burning. Brown in Greece; Lieutenant Governor Anderson sends the Guard, on the streets Aug. 13, nearly 14,000 by the end; a curfew over the district. 34 dead, more than 1,000 hurt, some 4,000 arrested. Check the figures. Aug. 15, Johnson: "no greater wrong, in our democracy, than violent, willful disregard of law"; and "the unjust conditions from which disorder largely flows."'
    n: '[Statement by the President Following the Restoration of Order in Los Angeles](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-restoration-order-los-angeles) (Aug. 15, 1965). Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). Jerry Cohen & William S. Murphy, *Burn, Baby, Burn! The Los Angeles Race Riot, August 1965* (1966). Conot, *Rivers of Blood, Years of Darkness*; Horne, *Fire This Time*; Flamm, *Law and Order* (K–J Cong. II.F). Branch, *At Canaan''s Edge* (K–J Adm. II.C). See [[cal.1964-07-18.states-and-cities]]. Names: Frye (K–J Cong. III.K).'
    tags: [name:frye-marquette, name:brown-edmund-g, name:anderson-glenn-m, name:johnson-lyndon-b]
  - id: cal.1965-08-18.vietnam
    when: Aug. 18–24
    date: '1965-08-18'
    thread: vietnam
    c: 'Operation Starlite, the Vạn Tường peninsula south of Chu Lai. Walt''s Marines, by sea and by helicopter, against the 1st Viet Cong Regiment, found by a deserter''s word: the first major attack by American troops alone. The Marines count 614 enemy dead; 45 Marines killed. Check the figures.'
    n: '[FRUS 1964–68, III, doc. 125](https://history.state.gov/historicaldocuments/frus1964-68v03/d125) (Sharp, Aug. 23). Shulimson & Johnson, *The Landing and the Buildup, 1965* (Viet. II.F.5). Lehrack, *The First Battle*; Andrew, *The First Fight* (Viet. II.C.5). See [[cal.1965-07-28.vietnam]]. Names: Walt (Viet. III.D).'
    tags: [name:walt-lewis-w]
  - id: cal.1965-08-19.poverty
    when: Aug. 19
    date: '1965-08-19'
    thread: poverty
    c: 'Senate passes the Economic Opportunity Amendments, H.R. 8283, [61–29](https://voteview.com/rollcall/RS0890199): $1.65 billion for the year. Amendments to keep the governors'' veto over community action, given by the 1964 act, fail, Aug. 18: [43–43](https://voteview.com/rollcall/RS0890192), [42–43](https://voteview.com/rollcall/RS0890193). The House passed its bill July 22, [245–158](https://voteview.com/rollcall/RH0890095).'
    n: '[111 Cong. Rec., Senate, Aug. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-7-1.pdf); [Aug. 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-1-2.pdf); [111 Cong. Rec., House, July 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-4-2.pdf). See [[cal.1964-08-20.poverty]].'
  - id: cal.1965-08-20.alabama
    when: Aug. 20
    date: '1965-08-20'
    thread: alabama
    also: [voting-rights]
    c: Hayneville, Lowndes County. Coleman, a special deputy, kills Jonathan Daniels, an Episcopal seminarian, with a shotgun at a store door and wounds Father Morrisroe, a Catholic priest; both just out of jail with others arrested picketing at Fort Deposit Aug. 14. Johnson's telegrams to Daniels's mother and to Morrisroe, Aug. 23.
    n: '[Telegram to Mrs. Philip Daniels on the Death of Her Son Jonathan, a Theological Student](https://www.presidency.ucsb.edu/documents/telegram-mrs-philip-daniels-the-death-her-son-jonathan-theological-student) (Aug. 23, 1965); [Telegram to the Reverend Richard Morrisroe Expressing Hope for His Recovery](https://www.presidency.ucsb.edu/documents/telegram-the-reverend-richard-morrisroe-expressing-hope-for-his-recovery) (Aug. 23, 1965). Charles W. Eagles, *Outside Agitator: Jon Daniels and the Civil Rights Movement in Alabama* (1993). Hasan Kwame Jeffries, *Bloody Lowndes: Civil Rights and Black Power in Alabama''s Black Belt* (2009). See [[cal.1965-05-07.alabama]]. Names: Coleman, Daniels, Morrisroe (K–J Cong. III.K).'
    tags: [name:coleman-thomas-l, name:daniels-jonathan-m, name:morrisroe-richard-f, name:johnson-lyndon-b]
  - id: cal.1965-08-21.defense
    when: Aug. 21
    date: '1965-08-21'
    thread: defense
    also: [congress]
    c: 'Johnson vetoes the military construction authorization, H.R. 8439: section 611 would bar closing or cutting any base until 120 days after a report to the Armed Services Committees, reports only from January to April. The Attorney General calls it repugnant to the Constitution.'
    n: '[Veto of the Military Authorization Bill](https://www.presidency.ucsb.edu/documents/veto-the-military-authorization-bill) (Aug. 21, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1039) (Aug. 25, 1965). Shapley, *Promise and Power* (K–J Adm. II.G.4). Names: Katzenbach (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-08-21.space
    when: Aug. 21–29
    date: '1965-08-21'
    thread: space
    c: 'Gemini 5: Cooper and Conrad, nearly eight days, 120 orbits; the endurance record passes to the United States. A fuel cell''s trouble the first day; the rendezvous practice with a pod given up. Down in the Atlantic Aug. 29; Johnson telephones them.'
    n: '[Remarks by Telephone to Astronauts Cooper and Conrad Following Completion of the Gemini 5 Mission](https://www.presidency.ucsb.edu/documents/remarks-telephone-astronauts-cooper-and-conrad-following-completion-the-gemini-5-mission) (Aug. 29, 1965); [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-4) (Aug. 29, 1965). See [[cal.1965-03-23.space]]; [[cal.1965-06-03.space]]. Names: Cooper, Conrad (K–J Cong. III.K).'
    tags: [name:cooper-l-gordon-jr, name:conrad-charles-jr, name:johnson-lyndon-b]
  - id: cal.1965-08-22.opinion
    when: Aug. 22
    date: '1965-08-22'
    thread: opinion
    c: 'Gallup, July 16–21: would vote for a well-qualified man of one''s party for President who was a Jew, 80 percent; a Catholic, 87; a Negro, 59 (no, 34).'
    n: '*The Gallup Poll*, III, 1958 (K–J Cong. II.E).'
  - id: cal.1965-08-25.space
    when: Aug. 25
    date: '1965-08-25'
    thread: space
    also: [defense]
    c: 'News conference. The Defense Department to build a Manned Orbiting Laboratory, $1.5 billion: Douglas Aircraft to build the laboratory, a Titan III-C to launch it, a Gemini capsule to bring its two-man crews back; the first manned flight in 1968.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1039) (Aug. 25, 1965). See [[cal.1965-08-21.space]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-25.economy
    when: Aug. 25
    date: '1965-08-25'
    thread: economy
    also: [transition-and-staff]
    c: 'Breakfast with the Cabinet and agency heads. Planning-programming-budgeting, the system McNamara brought to Defense, ordered throughout the Government: a planning staff under each head; goals, alternatives, and costs over several years; the 1968 budget in the new form. Schultze of the Budget Bureau to direct it.'
    n: '[Statement by the President to Cabinet Members and Agency Heads on the New Government-Wide Planning and Budgeting System](https://www.presidency.ucsb.edu/documents/statement-the-president-cabinet-members-and-agency-heads-the-new-government-wide-planning) (Aug. 25, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1039) (Aug. 25, 1965). Enthoven & Smith, *How Much Is Enough?* (Viet. II.F.18). Shapley, *Promise and Power* (K–J Adm. II.G.4). Names: McNamara (K–J Adm. III.F); Schultze (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:schultze-charles-l]
  - id: cal.1965-08-25.immigration
    when: Aug. 25
    date: '1965-08-25'
    thread: immigration
    c: 'House passes Celler''s immigration bill, H.R. 2580, [318–95](https://voteview.com/rollcall/RH0890125): the national-origins quotas ended; 170,000 a year from outside the Western Hemisphere, by preference for kin and skill. A ceiling of 115,000 on the Western Hemisphere from July 1, 1968, refused, [189–218](https://voteview.com/rollcall/RH0890124). Johnson''s letter to McCormack the same day.'
    n: '[111 Cong. Rec., House, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-2.pdf). [Letter to the Speaker Urging House Action on the Immigration Bill](https://www.presidency.ucsb.edu/documents/letter-the-speaker-urging-house-action-the-immigration-bill) (Aug. 25, 1965). See [[cal.1965-01-13.immigration]]. Names: Celler (K–J Cong. III.D); McCormack (K–J Cong. III.C).'
    tags: [name:celler-emanuel, name:mccormack-john-w, name:johnson-lyndon-b]
  - id: cal.1965-08-25.opinion
    when: Aug. 25
    date: '1965-08-25'
    thread: opinion
    also: [voting-rights]
    c: 'Gallup, July 16–21: persons of 18, 19 and 20 permitted to vote: yes 57 percent, no 39.'
    n: '*The Gallup Poll*, III, 1958 (K–J Cong. II.E).'
  - id: cal.1965-08-26.states-and-cities
    when: Aug. 26
    date: '1965-08-26'
    thread: states-and-cities
    c: 'Johnson sends Ramsey Clark, Deputy Attorney General, with a federal team to Los Angeles, to work out with Brown and Yorty a program for the riot area: Watts has "the largest number of school dropouts," "the lowest median family income." Brown''s commission on the riots, McCone chairman, Christopher vice chairman, named Aug. 19. Check the date.'
    n: '[Statement by the President Upon Announcing a Program of Assistance to Los Angeles](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-announcing-program-assistance-los-angeles) (Aug. 26, 1965). See [[cal.1965-08-11.states-and-cities]]. Names: Ramsey Clark, McCone (K–J Adm. III.I); Yorty (K–J Cong. III.F).'
    tags: [name:johnson-lyndon-b, name:clark-ramsey, name:brown-edmund-g, name:yorty-sam, name:mccone-john-a, name:christopher-warren]
  - id: cal.1965-08-26.jobs-and-wages
    when: Aug. 26
    date: '1965-08-26'
    thread: jobs-and-wages
    c: 'Public Works and Economic Development Act signed, [79 Stat. 552](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg552.pdf): grants and loans for public works and development facilities in areas of persistent unemployment and low income; districts of several counties; regional commissions. An Economic Development Administration in Commerce, Foley to head it, in place of the Area Redevelopment Administration. The House passed the bill Aug. 12, [246–138](https://voteview.com/rollcall/RH0890117).'
    n: '[Remarks at the Signing of the Public Works and Economic Development Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-public-works-and-economic-development-act) (Aug. 26, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1039) (Aug. 25, 1965). [111 Cong. Rec., House, Aug. 12, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-3-2.pdf). Eller, *Uneven Ground* (K–J Adm. II.B). See [[cal.1961-05-01.program]].'
    tags: [name:johnson-lyndon-b, name:foley-eugene-p]
  - id: cal.1965-08-26.school-aid
    when: Aug. 26
    date: '1965-08-26'
    thread: school-aid
    c: 'House passes the Higher Education Act, H.R. 9567, [368–22](https://voteview.com/rollcall/RH0890126): grants for needy undergraduates, insured student loans, aid to college libraries and to developing colleges, community service programs.'
    n: '[111 Cong. Rec., House, Aug. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-6-1.pdf). [Statement by the President Following House Passage of the Higher Education Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-passage-the-higher-education-bill) (Aug. 26, 1965). Higher Education Act of 1965 (K–J Cong. II.J.2). Graham, *The Uncertain Triumph* (K–J Adm. II.B). See [[cal.1965-01-12.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-29.transition-and-staff
    when: Aug. 29
    date: '1965-08-29'
    thread: transition-and-staff
    also: [europe-and-the-alliance]
    c: News conference at the LBJ Ranch. Gronouski, Postmaster General, to be Ambassador to Poland, for "building bridges" to Eastern Europe. O'Brien, the President's assistant for congressional relations, to be Postmaster General, and to keep that work.
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-4) (Aug. 29, 1965). O''Brien, *No Final Victories* (K–J Adm. II.G.2). Names: Gronouski (K–J Adm. III.G); O''Brien (K–J Adm. III.B).'
    tags: [name:johnson-lyndon-b, name:gronouski-john-a, name:obrien-lawrence-f]
  - id: cal.1965-08-29.opinion
    when: Aug. 29
    date: '1965-08-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 5–10: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13; Democrats 77, Republicans 71. How the war will end: most often, a compromise like Korea.'
    n: '*The Gallup Poll*, III, 1958–59 (K–J Cong. II.E).'
  - id: cal.1965-08-30.students
    when: Aug. 30
    date: '1965-08-30'
    thread: students
    also: [defense]
    c: 'Signed: knowingly to destroy or mutilate a draft card made a crime under the Universal Military Training and Service Act, [79 Stat. 586](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg586-2.pdf), up to five years and $10,000. The House passed it Aug. 10, [393–1](https://voteview.com/rollcall/RH0890114).'
    n: '[111 Cong. Rec., House, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-2.pdf). Flynn, *The Draft, 1940–1973* (K–J Adm. II.D). *United States v. O''Brien* (K–J Adm. II.H.1). Baskir & Strauss, *Chance and Circumstance* (Viet. II.G.1). See [[cal.1965-05-21.students]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-08-30.steel
    when: Aug. 30
    date: '1965-08-30'
    thread: steel
    also: [jobs-and-wages]
    c: 'Steel. With the Steelworkers'' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor: a shutdown put off eight days, the bargaining moved to Washington. On television that evening. Aug. 26, he had telephoned both.'
    n: '[Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry](https://www.presidency.ucsb.edu/documents/televised-statement-the-president-announcing-postponement-shutdown-the-steel-industry) (Aug. 30, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1034) (Aug. 26, 1965). Sheahan, *The Wage-Price Guideposts* (K–J Adm. II.B). Califano, *The Triumph and Tragedy of Lyndon Johnson* (K–J Adm. II.G.3). See [[cal.1963-04-11.steel]]. Names: Abel, Cooper (K–J Cong. III.K); Wirtz, Connor (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:abel-i-w, name:cooper-r-conrad, name:wirtz-w-willard, name:connor-john-t]
  - id: cal.1965-08-31.latin-america
    when: Aug. 31
    date: '1965-08-31'
    thread: latin-america
    c: 'Santo Domingo. The Act of Dominican Reconciliation signed: Caamaño for the Constitutionalists, García-Godoy for the provisional government, Bunker and the OAS committee; Imbert, out Aug. 30, accepts it. García-Godoy provisional president; a general amnesty; arms collected; the Inter-American force''s withdrawal to be negotiated. García-Godoy sworn Sept. 3.'
    n: 'FRUS 1964–68, XXXII, docs. [127](https://history.state.gov/historicaldocuments/frus1964-68v32/d127), [128](https://history.state.gov/historicaldocuments/frus1964-68v32/d128). See [[cal.1965-04-28.latin-america]]; [[cal.1965-06-15.latin-america]]. Names: Bunker (Viet. III.C).'
    tags: [name:caamano-deno-francisco, name:garcia-godoy-hector, name:imbert-barrera-antonio, name:bunker-ellsworth]
