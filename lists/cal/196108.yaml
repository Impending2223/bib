  - id: cal.1961-08-24.china-leadership-3
    when: Aug. 24
    date: '1961-08-24'
    thread: china-leadership
    also: [farm]
    c: 'At the Central Work Conference Zhou Enlai reports on grain, July 1961 to June 1962. This year''s disaster greater than last year''s but the villages better and the harvest near last year''s. Purchase and output fixed fast, over- and under-output handled flexibly; villages first, big and medium cities and key mines supplied; "low standard, vegetables and melons for grain" for three to five years more. Eight tasks: output estimates, purchase, sales, allotment, imports, concentrated shipping, cutting town numbers, and commodity-grain bases in Sichuan, north Manchuria, Central-South, Jiangsu, Zhejiang and Guangxi.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 429 (Aug. 24, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
