section: XXI
entries:
  - id: cal.1961-08.mississippi
    when: Aug.
    date: 1961-08
    thread: mississippi
    c: Bob Moses opens SNCC's voter registration school in McComb; registration attempts in Amite and Walthall Counties. Moses beaten at Liberty.
    n: '[[w.dittmer-local-people]], 99–107; [[w.payne-ive-got-the-light]]; [[w.carson-in-struggle]]; [[w.burner-and-gently-he-shall]]; [[w.branch-parting-the-waters]]. SNCC Digital Gateway (K–J Cong. II.L). Names: Moses, Hayden.'
    tags: [name:moses-robert-p, name:hayden-tom]
  - id: cal.1961-08.civil-rights-organizations
    when: Aug.
    date: 1961-08
    thread: civil-rights-organizations
    c: 'SNCC at the Highlander Folk School, Tenn., mid-month: direct action or voter registration, the administration urging registration and promising foundation money. Near a split. Baker''s compromise: two wings, direct action under Nash, voter registration.'
    n: 'SNCC Digital Gateway, [SNCC debates direct action & voter registration at Highlander](https://snccdigital.org/events/sncc-debates-direct-action-voter-registration-at-highlander/) (K–J Cong. II.L). [[w.carson-in-struggle]]; [[w.dittmer-local-people]], 107; [[w.payne-ive-got-the-light]]; [[w.ransby-ella-baker-and-the]]; [[w.hogan-many-minds-one-heart]]. Names: Baker, Nash.'
    tags: [name:baker-ella, name:nash-diane]
  - id: cal.1961-08-01.berlin-and-vienna
    when: Aug. 1
    date: '1961-08-01'
    thread: berlin-and-vienna
    c: Congress authorizes the call-up of up to 250,000 reservists for a year, [75 Stat. 242](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg242-3.pdf).
    n: CQ Almanac 1961. See [[cal.1961-07-25.berlin-and-vienna]].
  - id: cal.1961-08-01.jobs-and-wages-mo
    when: Aug. 1
    date: '1961-08-01'
    thread: jobs-and-wages
    c: 'Missouri''s Fair Employment Practices Act (Senate Bill 257): no discrimination in employment by race, color, creed, religion, national origin or ancestry; the Commission on Human Rights to enforce it.'
    n: 'Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), history and chronology (Check: Aug. 1 there as the day it "passes"). [[w.lang-grassroots-at-the-gateway]].'
    tags: [state:mo]
  - id: cal.1961-08-02.right-and-the-military
    when: Aug. 2
    date: '1961-08-02'
    thread: right-and-the-military
    c: Fulbright's memorandum to McNamara on military officers propagandizing for the radical right, written in June, is placed in the record. Thurmond demands an inquiry.
    n: '[Cong. Rec., Senate, Aug. 2, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-3-2.pdf). *Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3), which came of it. [[w.woods-fulbright]]; [[w.crespino-strom-thurmonds-america]]. Names: Fulbright, Thurmond, McNamara.'
    tags: [name:fulbright-j-william, name:mcnamara-robert-s, name:thurmond-strom]
  - id: cal.1961-08-02.opinion
    when: Aug. 2
    date: '1961-08-02'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, July 13–18: back the Berliners'' right to a free election, East Berlin included, even at the cost of war, 61 percent; not, 27. The UN to try to settle Berlin, 81; able to, 40.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-08-03.crime-and-hijacking
    when: Aug. 3
    date: '1961-08-03'
    thread: crime-and-hijacking
    c: A Continental Air Lines 707 seized at El Paso; Kennedy follows from the White House; the FBI and Border Patrol shoot out the tires.
    n: Telegrams of Commendation Following the Capture of High-Jackers of a Jet Airliner in El Paso, Texas, [1961 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=605) (Aug. 4, 1961). [FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-03.european-community
    when: Aug. 3
    date: '1961-08-03'
    thread: european-community
    c: The Commons approves the application, 313–5; Labour's amendment refused, 318–209.
    n: HC Deb, [Aug. 3, 1961](https://api.parliament.uk/historic-hansard/commons/1961/aug/03/european-economic-community), cc. 1651–1786. See [[cal.1961-07-31.european-community]].
  - id: cal.1961-08-05.latin-america
    when: Aug. 5–7
    date: '1961-08-05'
    thread: latin-america
    c: Punta del Este. The Inter-American Economic and Social Council meets, Aug. 5. Dillon pledges $20 billion over ten years (Check the day). Che Guevara present.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). [[w.goodwin-remembering-america]]. [[w.taffet-foreign-aid-as-foreign]]. See [[cal.1961-03-13.latin-america]]. Names: Dillon, Guevara.'
    tags: [name:dillon-c-douglas, name:guevara-ernesto]
  - id: cal.1961-08-06.space
    when: Aug. 6
    date: '1961-08-06'
    thread: space
    c: Titov orbits for a day.
    n: 'News Conference, [1961 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=611) (Aug. 10, 1961). See [[cal.1961-04-12.space]]. Names: Titov.'
    tags: [name:titov-gherman]
  - id: cal.1961-08-07.conservation
    when: Aug. 7
    date: '1961-08-07'
    thread: conservation
    c: 'Cape Cod National Seashore Act signed, [75 Stat. 284](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg284.pdf): the outer beach of Cape Cod, Mass., in six towns, to be bought for a national seashore; no condemnation of a home where the town''s zoning bylaw meets the Secretary''s standards. Kennedy had cosponsored a like bill in the Senate. The House passed it July 10, [278–82](https://voteview.com/rollcall/RH0870055).'
    n: Statute (K–J Cong. II.J.2). Remarks Upon Signing Bill Authorizing the Cape Cod National Seashore Park, [1961 Pub. Papers 551](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=609) (Aug. 7, 1961). S. 857, 87th Cong. [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-08.state-and-city-finance-tx
    when: Aug. 8
    date: '1961-08-08'
    thread: state-and-city-finance
    c: Texas Legislature, on the first called session's last day, passes a $354 million tax bill, nearly $320 million of it from a 2 percent sales tax, the State's first general sales tax. Senate 23–8. Governor Daniel lets it become law without his signature and calls a second session, Aug. 10, for teachers' pay.
    n: 'Acts 1961, 57th Leg., 1st C.S., ch. 24 (H.B. 20), the Limited Sales, Excise and Use Tax Act, [Tex. Gen. Laws 71](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf): "Filed without Governor''s signature, Aug. 16, 1961," [114](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf#page=44). Tex. Legis. Ref. Library, [57th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-1) (July 10–Aug. 8, 1961), and [second called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-2) (Aug. 10–14). "The Making of a Sales Tax," [*Texas Observer*, Aug. 12, 1961, p. 1](https://issues.texasobserver.org/pdf/ustxtxb_obs_1961_08_12_issue.pdf). [[w.cunningham-cowboy-conservatism]]; [[w.davidson-race-and-class-in]]. Names: Daniel.'
    tags: [state:tx, name:daniel-price]
  - id: cal.1961-08-09.confirmations
    when: Aug. 9
    date: '1961-08-09'
    thread: confirmations
    c: Lawrence J. O'Connor Jr. confirmed to the Federal Power Commission, [83–12](https://voteview.com/rollcall/RS0870127).
    n: '[107 Cong. Rec., Senate, Aug. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-8-1.pdf). See [[cal.1961-06-13.confirmations]]. Names: O''Connor.'
    tags: [name:oconnor-lawrence-j-jr]
  - id: cal.1961-08-11.japan-and-korea
    when: Aug. 11
    date: '1961-08-11'
    thread: japan
    c: 'NSAM 68: a task force on the Ryukyus, as Kennedy promised Ikeda in June: the sources of the Ryukyuans'' discontent, the economy, what can be done, Okinawa''s worth as a base kept in mind.'
    n: '[FRUS 1961–63, XXII, doc. 340](https://history.state.gov/historicaldocuments/frus1961-63v22/d340). [[w.sarantakes-keystone]]; [[w.schaller-altered-states]]; [[w.reischauer-my-life-between-japan]]. See [[cal.1961-06-20.transition-and-staff]]. Names: Ikeda, Kennedy.'
    tags: [name:kennedy-john-f, name:ikeda-hayato]
  - id: cal.1961-08-12.japan-and-korea
    when: Aug. 12
    date: '1961-08-12'
    thread: korea
    c: 'Park, chairman of the Supreme Council since its first chairman''s ouster, July 3, promises civilian government in 1963: a new constitution, a presidential system, a smaller one-house Assembly, elections in May 1963. Rusk, Aug. 11, to the Korean ambassador: elections sooner.'
    n: 'FRUS 1961–63, XXII, docs. [235](https://history.state.gov/historicaldocuments/frus1961-63v22/d235), [239](https://history.state.gov/historicaldocuments/frus1961-63v22/d239), [241](https://history.state.gov/historicaldocuments/frus1961-63v22/d241), [242](https://history.state.gov/historicaldocuments/frus1961-63v22/d242). See [[cal.1961-05-16.japan-and-korea]]. Names: Park, Rusk.'
    tags: [name:park-chung-hee, name:rusk-dean]
  - id: cal.1961-08-13.berlin-and-vienna
    when: Aug. 13
    date: '1961-08-13'
    thread: berlin-and-vienna
    c: East Germany seals the sector border overnight. Kennedy at Hyannis Port. The response is a protest.
    n: 'FRUS 1961–63, XIV, docs. [104](https://history.state.gov/historicaldocuments/frus1961-63v14/d104), [105](https://history.state.gov/historicaldocuments/frus1961-63v14/d105). See [[cal.1961-06-03.berlin-and-vienna]]. [[w.harrison-driving-the-soviets-up]]; [[w.wilke-der-weg-zur-mauer]]; [[w.kempe-berlin-1961]]; [[w.brandt-begegnungen-und-einsichten]]. Names: Brandt.'
    tags: [name:kennedy-john-f, name:brandt-willy]
  - id: cal.1961-08-16.berlin-and-vienna
    when: Aug. 16
    date: '1961-08-16'
    thread: berlin-and-vienna
    c: Brandt's letter to Kennedy; three hundred thousand at the city hall rally.
    n: '[FRUS 1961–63, XIV, doc. 117](https://history.state.gov/historicaldocuments/frus1961-63v14/d117). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Brandt.'
    tags: [name:brandt-willy, name:kennedy-john-f]
  - id: cal.1961-08-17.latin-america
    when: Aug. 17
    date: '1961-08-17'
    thread: latin-america
    c: The Charter of Punta del Este signed. Goodwin and Guevara talk that night.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). See [[cal.1961-08-05.latin-america]]. Names: Goodwin, Guevara.'
    tags: [name:goodwin-richard-n, name:guevara-ernesto]
  - id: cal.1961-08-18.welfare-ny
    when: Aug. 17
    date: '1961-08-17'
    thread: welfare
    also: [court]
    c: Newburgh. The State Supreme Court for Orange County, on the State Board of Social Welfare's suit, grants a temporary injunction against twelve of the thirteen points, the monthly report to the welfare department excepted; orders to be submitted. Rockefeller orders an inquiry under the Moreland Act (Check the date). Dec. 19, the injunction made permanent.
    n: '*State Bd. of Social Welfare v. City of Newburgh*, [28 Misc. 2d 539](https://static.case.law/misc2d/28/case-pdfs/0539-01.pdf) (Sup. Ct. 1961). [[w.ritz-despised-poor]]. The opinion is dated Aug. 17; the order signed on it, later. Check against the literature: the order''s date, the Moreland inquiry''s, the permanent injunction''s. See [[cal.1961-06-19.welfare-ny]]. Names: Rockefeller.'
    tags: [state:ny, city:newburgh, name:rockefeller-nelson]
  - id: cal.1961-08-19.berlin-and-vienna
    when: Aug. 19–20
    date: '1961-08-19'
    thread: berlin-and-vienna
    c: Johnson and Clay in Berlin. A battle group of the 18th Infantry drives up the autobahn and is received by Johnson.
    n: 'FRUS 1961–63, XIV, docs. [120](https://history.state.gov/historicaldocuments/frus1961-63v14/d120), [121](https://history.state.gov/historicaldocuments/frus1961-63v14/d121). Remarks Following the Vice President''s Report on the Berlin Situation, [1961 Pub. Papers 566](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=624) (Aug. 21, 1961). [[w.caro-passage-of-power]]; [[w.kempe-berlin-1961]]; [[w.smith-lucius-d-clay]]. Names: Johnson, Clay.'
    tags: [name:johnson-lyndon-b, name:clay-lucius-d]
  - id: cal.1961-08-20.opinion
    when: Aug. 20
    date: '1961-08-20'
    thread: opinion
    also: [defense]
    c: 'Gallup, July 27–Aug. 1: 5 percent have changed their homes against a nuclear attack; 20 have stored food.'
    n: '[[w.gallup-poll]], III, 1732.'
  - id: cal.1961-08-21.states-and-cities-nyc
    when: Aug. 21
    date: '1961-08-21'
    thread: states-and-cities
    c: 'Special session at Albany, N.Y., called by Rockefeller: six hours, a law to reform New York City''s schools. The Board of Education removed; a new board to be named by the mayor from a screening panel''s nominees (Check the terms).'
    n: '[*New York Times*, Aug. 22, 1961](https://www.nytimes.com/1961/08/22/archives/reform-ordered-democrats-are-beaten-on-amendments-and-all-but-7.html); [Wikipedia, "173rd New York State Legislature"](https://en.wikipedia.org/wiki/173rd_New_York_State_Legislature). Check: *Laws of New York*, 1961, Extraordinary Session. [[w.ravitch-great-school-wars]]. Names: Rockefeller.'
    tags: [state:ny, city:nyc, name:rockefeller-nelson]
  - id: cal.1961-08-21.european-community
    when: Aug. 21
    date: '1961-08-21'
    thread: european-community
    c: 'NSAM 76: Kennedy asks State, the Treasury and the CEA to study the effect on the United States of Britain''s entry into the Common Market.'
    n: 'FRUS 1961–63, XIII, doc. [15](https://history.state.gov/historicaldocuments/frus1961-63v13/d15). See [[cal.1961-07-31.european-community]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-21.middle-east-johnson-plan
    when: Aug. 21
    date: '1961-08-21'
    thread: middle-east-johnson-plan
    c: 'The UN Palestine Conciliation Commission (France, Turkey, the United States) names Joseph E. Johnson, president of the Carnegie Endowment for International Peace, its Special Representative: to explore with the Arab host governments and Israel practical means of progress on the Palestine Arab refugees, under paragraph 11 of Resolution 194 (III), repatriation or compensation. State''s candidate; he accepts, Aug. 17, at Rusk''s request. The UN announces it, Aug. 24.'
    n: '[A/4921](https://documents.un.org/doc/UNDOC/GEN/NL6/107/71/PDF/NL610771.PDF#page=2), para. 4 (the PCC''s nineteenth progress report, Oct. 15, 1961). FRUS 1961–63, XVII, doc. [96](https://history.state.gov/historicaldocuments/frus1961-63v17/d96) (editorial note). [[w.gazit-president-kennedys-policy-toward]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-decade-of-transition]]; [[w.bass-support-any-friend]]. See [[cal.1961-05-11.middle-east]]. Names: Johnson, Rusk.'
    tags: [name:johnson-joseph-e, name:rusk-dean]
  - id: cal.1961-08-23.opinion
    when: Aug. 23
    date: '1961-08-23'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, July 27–Aug. 1: federal youth camps like the CCC, good idea 80 percent, poor 13. Idle young men to be required to go, 59.'
    n: '[[w.gallup-poll]], III, 1732.'
  - id: cal.1961-08-23.europe-and-the-alliance
    when: Aug. 23
    date: '1961-08-23'
    thread: cyprus
    c: 'Cyprus. NSAM 71: Kennedy on State''s status report, its "gloomy tone": the Makarios government''s inadequacies against the Communist party''s discipline; "Perhaps we need some preventive medicine here."'
    n: '[NSAM No. 71](https://history.state.gov/historicaldocuments/frus1961-63v16/d248) (Aug. 23, 1961). See [[cal.1960-08-16.europe-and-the-alliance]]. Names: Kennedy, Makarios III.'
    tags: [name:kennedy-john-f, name:makarios-iii]
  - id: cal.1961-08-23.european-community
    when: Aug. 23
    date: '1961-08-23'
    thread: european-community
    c: 'Ball, on NSAM 76: "the situation is well in hand."'
    n: 'FRUS 1961–63, XIII, doc. [16](https://history.state.gov/historicaldocuments/frus1961-63v13/d16). See [[cal.1961-07-31.european-community]]. Names: Ball.'
    tags: [name:ball-george-w]
  - id: cal.1961-08-24.confirmations
    when: Aug. 24
    date: '1961-08-24'
    thread: confirmations
    also: [defense]
    c: Maj. Gene Hal Williams to brigadier general, Army National Guard of the United States. Seven of Armed Services against, Smith of Maine and Thurmond among them. Smith's motion to recommit fails, [37–46](https://voteview.com/rollcall/RS0870157); confirmed, [45–37](https://voteview.com/rollcall/RS0870158). Check who he was.
    n: '[107 Cong. Rec., Senate, Aug. 24, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt13/pdf/GPO-CRECB-1961-pt13-1-2.pdf); [Executive Calendar, Aug. 14, 1961](https://www.senate.gov/legislative/LIS/executive_calendar/1961/08_14_1961.pdf). See [[cal.1961-03-07.confirmations]]. Names: Williams, Smith, Thurmond.'
    tags: [name:smith-margaret-chase, name:thurmond-strom, name:williams-gene-hal]
  - id: cal.1961-08-25.latin-america
    when: Aug. 25
    date: '1961-08-25'
    thread: latin-america
    c: Quadros resigns in Brazil. Goulart succeeds under a parliamentary compromise.
    n: '[[w.skidmore-politics-in-brazil-1930]]; [[w.parker-brazil-and-the-quiet]]. [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). Names: Quadros, Goulart.'
    tags: [name:quadros-janio, name:goulart-joao]
  - id: cal.1961-08-25.africa
    when: Aug. 25
    date: '1961-08-25'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'The General Assembly''s special session on Bizerte, France absent. Stevenson, Aug. 22: only negotiation between France and Tunisia will settle it. Resolution 1622 (S-III), 66–0, the United States among the 30 abstaining: French forces in Tunisia against its will a violation of its sovereignty.'
    n: '[G.A. Res. 1622 (S-III)](https://undocs.org/A/RES/1622(S-III)). FRUS 1961–63, XXI, doc. [174](https://history.state.gov/historicaldocuments/frus1961-63v21/d174). See [[cal.1961-07-19.africa]]. Names: Stevenson.'
    tags: [name:stevenson-adlai-e]
  - id: cal.1961-08-25.amendments
    when: Aug. 25
    date: '1961-08-25'
    thread: amendments
    also: [voting-rights, congress]
    c: 'Kefauver''s subcommittee gives a day to the poll tax amendments, S.J. Res. 58, Holland''s, and S.J. Res. 81. Katzenbach, Assistant Attorney General, for Justice: "The Justice Department supports the proposed amendment as a realistic technique which seeks the early demise of the poll tax." A statute would surely reach the elections of Senators and Representatives, less surely those of electors.'
    n: 'Kefauver''s notice, [107 Cong. Rec. 16,760](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt12/pdf/GPO-CRECB-1961-pt12-9-1.pdf) (1961). Katzenbach''s testimony, pp. 368 and 387–88 of the printed hearings, as Holland read it into [108 Cong. Rec. 4366–67](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt4/pdf/GPO-CRECB-1962-pt4-1-1.pdf) (1962) (Check that he testified this day). [[w.lawson-black-ballots]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1961-05-23.electoral-college]]; [[cal.1960-02-02.states-and-cities]]. Names: Kefauver, Holland, Katzenbach.'
    tags: [name:kefauver-estes, name:holland-spessard-l, name:katzenbach-nicholas]
  - id: cal.1961-08-27.opinion-5
    when: Aug. 27
    date: '1961-08-27'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, July 27–Aug. 1: Republicans'' choice for 1964, of three: Nixon 60, Rockefeller 18, Goldwater 17; no opinion 5. Independents: Nixon 49, Rockefeller 21, Goldwater 18.'
    n: '[[w.gallup-poll]], III, 1733; [[w.white-making-of-the-president-1965]]. Names: Nixon, Rockefeller, Goldwater.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1961-08-28.congo
    when: Aug. 28
    date: '1961-08-28'
    thread: congo
    c: UN forces' Operation Rumpunch against Katanga's mercenaries.
    n: FRUS 1961–63, XX, docs. [100](https://history.state.gov/historicaldocuments/frus1961-63v20/d100), [101](https://history.state.gov/historicaldocuments/frus1961-63v20/d101). See [[cal.1961-02-13.congo]].
  - id: cal.1961-08-30.states-and-cities
    when: Aug. 30
    date: '1961-08-30'
    thread: states-and-cities
    also: [testing, desegregation-schools, georgia]
    c: Atlanta desegregates four high schools with nine Black students, peacefully. Kennedy praises the city at that day's press conference.
    n: '[[w.kruse-white-flight]]. News Conference, [1961 Pub. Papers 572](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630) (Aug. 30, 1961). Names: Hartsfield.'
    tags: [name:kennedy-john-f, name:hartsfield-william-b, state:ga, city:atlanta]
  - id: cal.1961-08-30.school-aid
    when: Aug. 30
    date: '1961-08-30'
    thread: school-aid
    c: The scaled-down school bill called up under Calendar Wednesday. The House refuses to consider it, [170–242](https://voteview.com/rollcall/RH0870084). Dead for the Congress.
    n: See [[cal.1961-02-20.school-aid]].
  - id: cal.1961-08-30.peace-corps
    when: Aug. 30
    date: '1961-08-30'
    thread: peace-corps
    also: [africa]
    c: The first volunteers arrive in Ghana.
    n: Remarks to a Group of Peace Corps Volunteers Before Their Departure for Tanganyika and Ghana, [1961 Pub. Papers 569](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=627) (Aug. 28, 1961). See [[cal.1961-03-01.peace-corps]].
  - id: cal.1961-08-30.berlin-and-vienna
    when: Aug. 30
    date: '1961-08-30'
    thread: berlin-and-vienna
    c: Clay named the President's personal representative in Berlin. The Soviet Union announces it will resume nuclear testing.
