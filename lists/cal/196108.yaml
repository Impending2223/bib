    date: '1961-08-15'
    place: beidaihe
    thread: china-leadership
    c: 'Beidaihe 北戴河. Deng Xiaoping 邓小平, Peng Zhen 彭真, Li Fuchun 李富春 and Bo Yibo 薄一波 to Mao Zedong 毛泽东 and the Standing Committee on the draft working regulations for state industrial enterprises: the "five fixings" 五定 by the state and "five guarantees" 五保 by the enterprise; responsibility, a single chain of command under the director; policy toward technicians and old workers; fixed cooperation and economic contracts; one administrative master only. Proposed: discussed at the work conference, then tried as a draft in the main enterprises.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1655 (Aug. 15, 1961); [[w.peng-zhen-nianpu-1902]], IV, 146–147 (Aug. 15, 1961; the letter: the regulations deal with enterprises'' internal problems, made by eleven work groups of the Secretariat and the Planning and Economic Commissions in plants at Peking, Shanghai, Tianjin, Taiyuan, Jilin and elsewhere, two months mostly, some four or five; eight main problems, the worst targets too high, tasks unsettled and materials short, responsibility gone and equipment damaged, science and the old workers slighted, management too dispersed; eighty articles; to be revised at the conference, then tried in the key enterprises as a draft). Footnote 1: the five fixings, of products and scale, staff and organs, main materials, fixed and working capital, cooperation; footnote 2: the five guarantees, of variety, quality and quantity, the wage bill, the cost plan, profits paid in, the life of the main plant (III, 1655). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen, Li Fuchun, Bo Yibo, Mao Zedong.'
    src:
      c: d4f8bdb5
      rows:
