    when: Aug. 24
    date: '1961-08-24'
    thread: china-leadership
    c: The rural work department 農村工作部 of the Central Committee issues its report on how the Sixty Articles 六十條 are carried out 《各地貫徹執行六十條的情況和問題》. On August figures the goods taken without pay 平調 come to 25 billion yuan for the country, against 11.1 billion first estimated; 20 to 30 percent is refunded; the old refunds are incomplete and new transfers occur, in the 1961 summer harvest some places seizing the wheat of members' private plots to pay the levy, some counting plot grain against the ration.{1} The Center's rule gives private plots 自留地 5 percent of the land;{2} Jiangsu 江蘇 gives 4.7 percent on average, some places under 4.{3}
