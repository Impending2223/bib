  - id: cal.1961-08-23.laos
    when: Aug. 23
    date: '1961-08-23'
    place: washington
    thread: laos
    c: 'The White House. Harriman, with Schlesinger, to Kennedy on the Laos negotiations; both opposed to intervention. On a counterstatement to the Communist manifesto, which Harriman cabled from Geneva citing the *New York Times* of Aug. 14: Kennedy on Castro''s literacy drive, "an immense communal effort like this is attractive to people who wish to serve their country"; Schlesinger to draft a free world manifesto. Kennedy: "the best way to deal with State is to send over memos." By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 129. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Kennedy, Castro.'
