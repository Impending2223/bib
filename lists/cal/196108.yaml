    date: '1961-08-07'
    thread: berlin-and-vienna
    c: 'Khrushchev on Soviet television: the peace treaty with the GDR; the access agreements of the occupation "will become null and void." But "Barring access to West Berlin or a blockade of West Berlin are entirely out of the question." The White House: "Nothing new."'
    n: '[[w.reeves-president-kennedy]], 205–6. To check: [[w.slusser-berlin-crisis-of-1961]], 107–14 (cited by [[w.reeves-president-kennedy]], 205); *New York Times*, Aug. 8, 1961 (cited by [[w.reeves-president-kennedy]], 206). Names: Khrushchev.'
