    c: 'The White House, on the delegation''s return from Punta del Este. After Kennedy''s greeting on the lawn, Goodwin walks in with him and tells him of the talk with Guevara. No sign of annoyance: "Write up a complete account ... and circulate it to Rusk, Bundy, and the others." He opens Guevara''s box of Cuban cigars, lights one: "You should have smoked the first one."'
