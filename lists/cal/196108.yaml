    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 223. Made public: 1997. To check: [[w.nongye-jitihua-zhongyao-wenjian]], 515 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 223 n.70). Check: the day.'
