  - id: cal.1961-08-09.china-leadership
    when: Aug. 9
    date: '1961-08-09'
    place: harbin
    thread: china-leadership
    also: [china]
    c: 'Harbin. Liu Shaoqi inspects the Xiangfang people''s commune: the bamboo-and-rattan plant, a sanba cloth shoe plant, a bearing plant, a service station, the public mess hall in the Anbu district, the commune''s second kindergarten. At the commune cadres'' forum he says urban communes have a role in using surplus labor, but must not weaken the organs of state power. To organize surplus labor, taking men into state factories as regular workers is to be done with care; or small plants are run, and those that go to whole-people ownership must share the treatment of state and local state-run enterprises or the workers will not hold; a whole-people plant needs high mechanization and productivity, which the state can afford. The commune''s industry is to count its costs, productivity, and quantity and quality, not output value alone.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 536 (Aug. 9, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
