    place: highlander-folk-school
    thread: civil-rights-organizations
    c: 'SNCC at the Highlander Folk School, Tenn., mid-month: direct action or voter registration, the administration urging registration and promising foundation money.{1} Near a split. Baker''s compromise: two wings, direct action under Nash, voter registration.{2}'
    n: 'SNCC Digital Gateway, [SNCC debates direct action & voter registration at Highlander](https://snccdigital.org/events/sncc-debates-direct-action-voter-registration-at-highlander/) (K–J Cong. II.L). [[w.dittmer-local-people]], 107 (not the days); [[w.schlesinger-robert-kennedy-and-his]], 302 ("In August, after heated debate between ''direct action'' and ''voter registration'' wings, SNCC decided to join the campaign"; the foundations'' money and the promise of protection; Highlander and the day not named). [[w.branch-parting-the-waters]], 485–87. To check: [[w.carson-in-struggle]]; [[w.payne-ive-got-the-light]]; [[w.ransby-ella-baker-and-the]]; [[w.hogan-many-minds-one-heart]]; Charles McDew, interviewed by Katherine M. Shannon, 1967, Howard University Civil Rights Documentation Project (cited by [[w.dittmer-local-people]], 107 n.34); SNCC minutes, Baltimore meeting, July 14–16, 1961, Student Nonviolent Coordinating Committee Papers, box 7, and Papers of Martin Luther King, Jr., box 23, folder 18, King Library and Archives (cited by [[w.branch-parting-the-waters]], 485 n.1); Charles McDew, oral history; interviews: James Bevel, May 16–17, 1985 (Branch) (cited by [[w.branch-parting-the-waters]], 487 n.2); [[w.carson-in-struggle]], 40 (cited by [[w.branch-parting-the-waters]], 485 n.1); [[w.carson-in-struggle]], 41–42 (cited by [[w.branch-parting-the-waters]], 487 n.1). Names: Baker, Nash.'
