  - id: cal.1961-08-08.state-and-city-finance-tx
    when: Aug. 8
    date: '1961-08-08'
    thread: state-and-city-finance
    c: Texas Legislature, on the first called session's last day, passes a $354 million tax bill, nearly $320 million of it from a 2 percent sales tax, the State's first general sales tax. Senate 23–8. Governor Daniel lets it become law without his signature and calls a second session, Aug. 10, for teachers' pay.
    n: 'Acts 1961, 57th Leg., 1st C.S., ch. 24 (H.B. 20), the Limited Sales, Excise and Use Tax Act, [Tex. Gen. Laws 71](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf): "Filed without Governor''s signature, Aug. 16, 1961," [114](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf#page=44). Tex. Legis. Ref. Library, [57th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-1) (July 10–Aug. 8, 1961), and [second called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-2) (Aug. 10–14). "The Making of a Sales Tax," [*Texas Observer*, Aug. 12, 1961, p. 1](https://issues.texasobserver.org/pdf/ustxtxb_obs_1961_08_12_issue.pdf). To check: [[w.cunningham-cowboy-conservatism]]; [[w.davidson-race-and-class-in]]. Names: Daniel.'
    tags: [state:tx, name:daniel-price]
  - id: cal.1961-08-09.confirmations
    when: Aug. 9
    date: '1961-08-09'
    thread: confirmations
    c: Lawrence J. O'Connor Jr. confirmed to the Federal Power Commission, [83–12](https://voteview.com/rollcall/RS0870127).
    n: '[107 Cong. Rec., Senate, Aug. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-8-1.pdf). See [[cal.1961-06-13.confirmations]]. Names: O''Connor.'
    tags: [name:oconnor-lawrence-j-jr]
  - id: cal.1961-08-09.berlin-and-vienna
    when: Aug. 9
    date: '1961-08-09'
    thread: berlin-and-vienna
    c: 'Dowling, ambassador in Bonn, and Lightner, minister in Berlin, brief the American chiefs of mission in Europe on the Paris meetings. By Lightner''s notes: the other side might stop the refugees at the zonal border, "but there was also the alternative of putting the border control right through the middle of the city."'
