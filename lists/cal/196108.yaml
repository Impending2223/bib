    c: 'The day after the Soviet announcement that testing will resume, the President on interference with air access to Berlin.{1} If a military plane is forced or shot down, fighters to cover the transports;{2} Lemnitzer and Taylor for firing back at anti-aircraft guns;{3} the President overrules them until a first such attack.{4} By Robert Kennedy''s notes, the gloomiest meeting since early in the crisis.{5} To his brother after: "I said I wanted to get off. ... Get off the planet."{6}'
