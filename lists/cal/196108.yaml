  - id: cal.1961-08-03.testing
    when: Aug. 3
    date: '1961-08-03'
    thread: testing
    c: 'Kennedy to Macmillan, by letter, on testing: "we simply cannot be sure, without a control system, that the Soviets are not testing"; still "most reluctant" to decide to resume; one more try at Geneva. If the United States resumes, underground, unless the Soviets resume in the atmosphere.'
    n: '[FRUS 1961–63, VII, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v07/d50). [[w.reeves-president-kennedy]], 224. To check: Kennedy to Macmillan, Aug. 3, 1961, Nuclear History papers, National Security Archive (cited by [[w.reeves-president-kennedy]], 224). Names: Macmillan, Kennedy.'
    src:
      c: 43b56a5f
      rows:
