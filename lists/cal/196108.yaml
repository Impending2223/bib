  - id: cal.1961-08-05.european-community
    when: Aug. 5
    date: '1961-08-05'
    thread: european-community
    c: 'Ball to Kennedy: Macmillan trying to "slide sidewise into the Common Market," the Commonwealth''s and the EFTA''s interests promising a long negotiation. Britain in the Community on the Rome Treaty''s political terms "substantial additional weight on the Western side of the world power balance"; the industrial West in two parts, the United States and the Community, Japan outside both. Kennedy to welcome Macmillan''s announcement at his news conference of Aug. 10.'
    n: '[[w.ball-past-has-another-pattern]], 217–18. See [[cal.1961-07-31.european-community]]. Names: Ball, Kennedy, Macmillan.'
