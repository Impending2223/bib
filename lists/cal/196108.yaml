    when: Aug.
    date: 1961-08
    place: peking
    thread: china-leadership
    c: 'Chen Yi tells the graduating seniors of Peking''s colleges that red and expert are not opposed: most of a student''s time should go to professional study;{1} against "thoroughly red and specialized" and the epithet "white specialist."{2} He speaks for himself, not for the organization.{3}'
