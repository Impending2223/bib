  - id: cal.1961-08-31.china-leadership-4
    when: Aug. 31
    date: '1961-08-31'
    thread: china-leadership
    c: The inspection group 檢查組 of the Sichuan 四川 provincial committee's rectification work corps at Daxian 達縣 reports on the masses of parts of Qu 渠 county eating "Guanyin earth" 觀音土, white clay, for want of livelihood arrangements 《關於渠縣部份地區因生活安排不落實群眾吃「觀音土」的調查報告》. Digging begins in late June at Pujiashan 蒲家山, Wenxing 文興 brigade, Daxia 大峽 commune, and by early August has spread to three districts and 18 communes; at four sites some 400 cubic meters are dug, about 10,000 person-times, about 500,000 jin. In Qingfeng 慶豐 brigade 214 of 262 households, 755 people, have eaten it, and 6 have died; in three teams 13 are dead of it.
    n: '[[w.yang-jisheng-mubei]], I, 206–207; [[w.dikotter-maos-great-famine]], 284 n.55 (a work team sent by Li Jingquan to Quxian county: 250,000 kilos of Guanyin soil dug from deep pits by more than 10,000 people; in one village 214 of 262 families have eaten it; in every village several dead of blocked colons). Made public: 2008. To check: Provincial Committee Rectification Work Corps at Daxian, Inspection Group, "Investigation report on the masses of parts of Qu county eating ''Guanyin earth'' because livelihood is not arranged," Aug. 31, 1961, 12 copies (cited by [[w.yang-jisheng-mubei]], I, 207 n.40); Sichuan Provincial Archives, Aug. 31, 1961, JC1-2620, pp. 177–178 (cited by [[w.dikotter-maos-great-famine]], 284 n.55). Check: the note prints the copies as sent Aug. 6, before the report''s day of Aug. 31. Names: Li Jingquan.'
    src:
      c: 19e0ff2a
      rows:
        - 'w.yang-jisheng-mubei I, 206–207: all'
        - 'via w.yang-jisheng-mubei I, 207 n.40: all'
        - 'w.dikotter-maos-great-famine 284 n.55: ?'
    tags: [polity:prc, vis:only:prc, name:li-jingquan]
  - id: cal.1961-08.china-leadership-6
    when: Aug.
    date: 1961-08
    thread: china-leadership
    also: [china]
    c: 'Four officials report after Li Fuchun''s speech: Li Yiqing, a senior party secretary, that in 1958 over 140,000 tonnes of farming tools went into the backyard furnaces of Henan; Wu Jingtian, vice-minister of railways, that one locomotive in five is out of use for engine damage; Peng De, vice-minister of transportation, that fewer than two vehicles in three work; Xu Chi, vice-minister of metallurgy, that the Angang steelworks stopped for weeks in the summer for want of coal.'
    n: '[[w.dikotter-maos-great-famine]], 122 n.24, 144 n.70. Made public: 2010. To check: Documents from the Beidaihe conference, Aug. 11, 1961 (the Hunan file), Hunan Provincial Archives, 186-1-584, pp. 38–48, 125, 134 and 152 (cited by [[w.dikotter-maos-great-famine]], 122 n.24; 144 n.70). Check: the meeting and the days: the book sets the reports at Lushan in the summer of 1961 (122, 144); the file it cites is of the Beidaihe conference, Aug. 11. Names: Li Fuchun, Wu Jingtian.'
    src:
      c: f74553e3
