  - id: cal.1961-08.desegregation-schools
    when: Aug.
    date: 1961-08
    thread: desegregation-schools
    c: 'Chicago. The NAACP''s branch, the Reverend Carl Fuqua leading, the Defender urging, calls on Negro parents to register their children at less crowded white schools: "Operation Transfer." School officials refuse the transfers.'
    n: '[[w.ralph-northern-protest]], 15. Check: the month (Ralph: the summer of 1961). See [[cal.1961-09.desegregation-schools]].'
    tags: [state:il, city:chicago]
