  - id: cal.1961-08-23.china-leadership
    when: Aug. 23–Sept. 16
    date: '1961-08-23'
    place: lushan
    thread: china-leadership
    c: 'Lushan.{1} The Central Work Conference, Mao presiding (its order set by the enlarged Standing Committee with the regional first secretaries, Aug. 23): grain, markets, the plans for 1961–62 and industry, the regulations for state enterprises and the higher schools, the training of cadres.{2} Adopted: the Center''s directive on industry ("retreat where we must, and enough"; seven years of "adjust, consolidate, fill out, raise," three with adjustment first); the "Seventy Articles" on industry;{3} the "Sixty Articles" on the higher schools; the decision on training cadres. Coal over 500 million and steel over 15 million tons for the two years; 1961''s steel from 11 to 8.5 million.{4} Zhu De and Peng Zhen attend; Chen Yun, ill, only to Sept. 1.{5} Mao, Aug. 23: socialism not yet understood, the Sixty Articles no final answer; "we shall hit more nails" for three years. To the enlarged Standing Committee later: the economy has reached bottom and rises day by day.{6} Reports: Zhou on grain, Li Xiannian on markets and prices, Li Fuchun on industry, Bo Yibo on the Seventy Articles, Lu Dingyi on the Sixty; Deng''s speech the summing-up.{7} The directive is the "Instruction on current industrial problems."{8} 99.6 billion yuan spent on capital construction in the three years to September 1961, 9.2 billion more on housing.{9}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 23, 1961 (the entries for Aug. 23–Sept. 16 and Aug. 23). [[w.zhou-enlai-nianpu-1949]], II, 429, Aug. 23–Sept. 16, 1961 (the conference''s decisions as Zhou''s chronology lists them). [[w.macfarquhar-origins-of-the-cultural]], III, 67 (Mao''s opening remarks; the Rural Work Department''s report); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538 (Aug. 23–Sept. 16, 1961; Liu attends the Central Work Conference at Lushan: industry, grain, finance and education; it makes the "Instruction on current industrial problems" and passes the Education Ministry''s directly run colleges'' work regulations (draft), the "Sixty Articles on Higher Education," and the work regulations of state industrial enterprises (draft), the "Seventy Articles on Industry"); [[w.deng-xiaoping-nianpu-1904]], III, 1656 (Aug. 23–Sept. 5, 1961; Deng attends; industry, grain, finance and trade, education; adopted, the draft regulations for state industrial enterprises and for the higher schools, the directive on current industrial problems, the decision on training cadres in rotation; seven years of readjustment, consolidation, filling out and raising standards; coal and steel the center; Deng sums up on Sept. 5 and leaves early for Korea; the conference ends Sept. 16. Aug. 23, Deng at Mao''s meeting of the Standing Committee and the regional first secretaries); [[w.mao-zedong-zhuan]], V, ch. 68 nn.20, 21 (Aug. 23, Lushan: Mao convenes the Standing Committee and the regional leaders to set the conference''s agenda, asks of the harvests and the sixty articles; socialist construction not yet understood, "we shall hit more nails"; the economy, he says, has reached bottom (Wang Renzhong''s diary); the conference runs Aug. 23 to Sept. 16). [[w.yang-jisheng-mubei]], II, 1174 (the second Lushan conference, Aug. 23–Sept. 16, 1961: grain, markets, the two-year plan, industry and its management; Mao holds the economy hit bottom in 1961 and is improving daily); [[w.dikotter-maos-great-famine]], 122 (Li Fuchun, the month after his July speech at Beidaihe, gives a similar report at a top-level party meeting at Lushan, again exempting Mao from responsibility; Mao praises it); [[w.jian-zhou-enlai]], 459 (Lushan, August: Zhou stresses the difficulties; Mao: the mistakes few, the low ebb reached, things to improve day by day); [[w.peng-zhen-nianpu-1902]], IV, 149 (Aug. 23–Sept. 16, 1961; Peng Zhen attends; industry, grain, finance and trade, education; the directive on present industrial questions revised under Deng; the draft regulations for state industrial enterprises; Zhou''s rules for grain in 1961–62; the provisional regulations for the colleges; the decision on retraining cadres); [[w.dikotter-maos-great-famine]], 166 n.13 (a report to the conference: 99.6 billion yuan spent on capital construction in the three years to September 1961, a further 9.2 billion on housing); [[w.zhu-de-nianpu-xinbian]], III, 1812–1813 (Aug. 23, 1961, morning, Zhu De 朱德 goes to Mao Zedong''s 毛泽东 for a meeting (上午); Aug. 23–Sept. 16, 1961, Zhu De at the Central Work Conference 中共中央工作会议 at Lushan 庐山 on industry, grain, finance and trade, education and the world, which adopts the draft Work Regulations for State Industrial Enterprises 《国营工业企业工作条例（草案）》 (the "Seventy Articles on industry" 工业七十条), the Center''s rules on grain work for 1961–62 《中共中央关于一九六一年到一九六二年度粮食工作的几项规定》, the draft provisional Work Regulations for the Higher Schools under the Ministry of Education 《教育部直属高等院校暂行工作条例（草案）》 (the "Sixty Articles on higher education" 高教六十条) and the decision on training cadres in rotation 《中共中央关于轮训干部的决定》, and the directive on present industrial questions 《关于当前工业问题的指示》, the eight-character policy of "adjustment, consolidation, filling out and raising standards" to be carried out unwaveringly for seven years); [[w.chen-yun-nianpu-xiuding]], III, 104 (Chen Yun attends, Aug. 23–Sept. 1, only the first half for illness; the conference ends Sept. 16; its directive on industry 《关于当前工业问题的指示》: the eight-character policy a year old without targets lowered to the facts, a year lost; three years with adjustment at the center, targets cut to safe levels, retreat where we must, and enough; Mao: we have retreated to the valley floor and now rise day by day; the Seventy Articles on industry and the Sixty on the higher schools adopted); [[w.chen-yun-nianpu-xiuding]], III, 104; [[w.zhu-de-nianpu-xinbian]], III, 1812–13 (Zhu De); [[w.peng-zhen-nianpu-1902]], IV, 149 (Peng Zhen); [[w.mao-zedong-zhuan]], V, ch. 68 at nn.20, 21. [[w.mao-zedong-zhuan]], V, ch. 68 at n.21. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 538; [[w.zhu-de-nianpu-xinbian]], III, 1813; [[w.dikotter-maos-great-famine]], 166; [[w.dikotter-maos-great-famine]], 166 n.13 (a report at the Lushan conference). Made public: 1996. Check: Yang Shangkun''s diary heads Aug. 24 "the work conference begins," its first plenary that afternoon ([[w.yang-shangkun-riji]], II, 62). Check: the day of Li Fuchun''s report at Lushan: [[w.dikotter-maos-great-famine]], 122, gives only "the following month" after July; Li Fuchun on the plan, Aug. 31: [[cal.1961-08-31.china-leadership]]. To check: the Working Regulations for State Industrial Enterprises (draft), Sept. 1961; [[w.bian-mao-zedong-he-tade]], 57–58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 67 n.154a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 548–49 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 67 n.154b); [[w.rui-lushan-huiyi-shilu]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 67 n.154c); Relayed record of Mao Zedong''s 毛泽东 speech to the Standing Committee and the regional leaders 中央常委和大区负责人会议, Lushan, Aug. 23, 1961 (传达记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.20); Wang Renzhong 王任重, diary, Aug. 23, 1961 (王任重日记) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.21); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], II, 1073 (cited by [[w.jian-zhou-enlai]], 459 n.76). Names: Mao Zedong, Zhu De, Peng Zhen, Chen Yun, Zhou Enlai, Li Xiannian, Li Fuchun, Bo Yibo, Lu Dingyi, Deng Xiaoping.'
