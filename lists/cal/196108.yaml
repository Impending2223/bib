    when: Aug. 5
    date: '1961-08-05'
    thread: china
    also: [testing]
    c: 'Hyannis Port, on the boat. Stevenson, Cleveland and Schlesinger with Kennedy on the General Assembly. General and complete disarmament the American goal, on Cleveland''s formula. Peking to be kept out this year: "If we can buy twelve months, it will be more than worth it."'
    n: '[[w.schlesinger-thousand-days-1965]], 478–80. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Stevenson, Cleveland, Schlesinger, Kennedy.'
