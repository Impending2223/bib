    c: Kennedy and Johnson adopt the Eisenhower-Nixon procedures on presidential inability. The President to tell the Vice President, who acts until it ends;{1} where he cannot, the Vice President decides, after such consultation as seems to him appropriate, the Cabinet's support and the Attorney General's advice in mind;{2} the President decides when it has ended.{3}
