    c: 'Punta del Este, the day after the cigars. The same Argentine tells Goodwin that Guevara would like to talk with him informally, at a small private party after the conference. Goodwin tells Dillon, who answers: "I don''t see what harm it can do."'
    n: '[[w.goodwin-remembering-america]], 196 (Goodwin''s account; Dillon "soon retracted his agreement" after Guevara''s speech on the last day). See [[cal.1961-08.latin-america]]. Names: Guevara, Goodwin, Dillon. Check: the day.'
    tags: [name:guevara-ernesto, name:goodwin-richard-n, name:dillon-c-douglas]
  - id: cal.1961-08.cuba
    when: Aug., after the 17th
    date: 1961-08
    at: after 1961-08-17
    thread: cuba
    c: 'Goodwin to Kennedy, in a memorandum on Cuba policy after the Punta del Este conference and the talk with Guevara: "Pay as little attention as possible to Cuba. Do not allow them to appear as the victims of U.S. aggression. Do not create the impression we are obsessed with Castro — an impression which only strengthens Castro''s hand in Cuba and encourages anti-American and leftist forces in other countries to rally round the Cuban flag."'
    n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account, quoting the memorandum). Names: Goodwin, Kennedy, Castro. Check: the day; after the conference and the talk with Guevara (203).'
    tags: [name:goodwin-richard-n, name:kennedy-john-f, name:castro-fidel]
  - id: cal.1961-08.latin-america-3
    when: Aug.
    date: 1961-08
    thread: latin-america
    also: [cuba]
    c: Guevara, from Punta del Este, visits his native Argentina and meets President Frondizi, supposedly in secret. The military learn of it at once; in Buenos Aires, charges that Frondizi seeks an accommodation with the communists.
    n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). Names: Guevara, Frondizi. Check: the day.'
    tags: [name:guevara-ernesto, name:frondizi-arturo]
  - id: cal.1961-08.latin-america-4
    when: Aug.
    date: 1961-08
    thread: latin-america
    also: [cuba]
    c: 'Adolfo Mugica, Argentina''s foreign minister, in Frondizi''s defense: it was perfectly all right for Frondizi to talk with Guevara, because Goodwin had been negotiating with Guevara in Montevideo. The American press picks it up.'
    n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). See [[cal.1961-08.latin-america-3]]. Names: Frondizi, Guevara, Goodwin. Check: the day.'
    tags: [name:frondizi-arturo, name:guevara-ernesto, name:goodwin-richard-n]
  - id: cal.1961-08.latin-america-5
    when: Aug.
    date: 1961-08
    thread: latin-america
    c: 'Goodwin telephones the Argentine ambassador: Mugica''s statement is inaccurate and disturbing.'
    n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account). See [[cal.1961-08.latin-america-4]]. Names: Goodwin. Check: the day.'
    tags: [name:goodwin-richard-n]
  - id: cal.1961-08.latin-america-6
    when: Aug.
    date: 1961-08
    thread: latin-america
    also: [cuba]
    c: The White House denies that the United States has made any deals with Castro.
    n: '[[w.goodwin-remembering-america]], 203 (Goodwin''s account; the words not given). See [[cal.1961-08.latin-america-4]]. Names: Castro. Check: the day.'
    tags: [name:castro-fidel, polity:us]
  - id: cal.1961-08.latin-america-7
    when: Aug.
    date: 1961-08
    thread: latin-america
    also: [cuba]
    c: 'Mugica, sacrificed by Frondizi to the military, announcing his resignation: what he had said about "Goodwin" was true just the same, and the Goodwin–Guevara conference showed that Castro''s regime sought better relations with the United States.'
    n: '[[w.goodwin-remembering-america]], 203–4 (Goodwin''s account; the story then on the front page of the *Washington Post*, 204). See [[cal.1961-08.latin-america-4]]. Names: Frondizi, Goodwin, Guevara, Castro. Check: the day; "a few days" after the White House''s denial (203).'
    tags: [name:frondizi-arturo, name:goodwin-richard-n, name:guevara-ernesto, name:castro-fidel]
  - id: cal.1961-08-31.china-leadership
    when: Aug. 31
    date: '1961-08-31'
    place: lushan
    thread: china-leadership
    c: 'Lushan. The enlarged Standing Committee, Mao presiding. Deng Xiaoping on industry: the plans mostly no plans; output and building "mostly paralyzed"; adjustment the center of the eight characters, two or three years, "only a full retreat lets us adjust." Li Fuchun on the plan.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 31, 1961. [[w.deng-xiaoping-nianpu-1904]], III, 1657 (Aug. 31, 1961; afternoon; Deng: the former plans mostly no plans; industrial output and building half paralysed; the eight characters centered on readjustment, two or three years, a new balance; only a retreat far enough allows readjustment). Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Li Fuchun.'
    tags: [polity:prc, name:mao-zedong, name:deng-xiaoping, name:li-fuchun, vis:only:prc]
