  - id: cal.1961-08-01.jobs-and-wages-mo
    when: Aug. 1
    date: '1961-08-01'
    thread: jobs-and-wages
    c: 'Dalton approves S.B. 257, Missouri''s Fair Employment Practices Act: no discrimination in employment by race, creed, color, religion, national origin or ancestry; the Commission on Human Rights to enforce it.'
    n: '*Laws of Missouri*, 1961, [439–443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54161): "Approved August 1, 1961," [443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54165) (Missouri State Archives, Missouri Digital Heritage). Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), history and chronology. To check: [[w.lang-grassroots-at-the-gateway]]. Names: Dalton.'
    tags: [state:mo, name:dalton-john-m]
    short: Missouri's fair employment act
  - id: cal.1961-08-01.transition-and-staff
    when: Aug. 1
    date: '1961-08-01'
    thread: transition-and-staff
    c: 'The President to Bundy and Schlesinger, of the press on Francis X. Morrissey, his father''s man in Boston, for a federal judgeship: "my father has come to me and said that he has never asked me for anything ... to make Frank Morrissey a federal judge. What can I do?" Bundy: his father knew he should not ask it, and would know he was right to refuse. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 375–76; [[w.navasky-kennedy-justice]], 362–63 (the rumors from June 1961; Anthony Lewis''s story of July 3 in the *Times*; the judgeship not given). To check: Schlesinger''s journal, Aug. 1, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 376 n.31). Names: John F. Kennedy, Bundy, Schlesinger. Check: the American Bar Association''s report and Robert Kennedy''s words to Anthony Lewis (376) undated; the judgeship left empty.'
    src:
      c: 9e6f6e24
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 375–76: all'
        - 'via w.schlesinger-robert-kennedy-and-his 376 n.31: all'
        - 'w.navasky-kennedy-justice 362–63: ?'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:schlesinger-arthur-m-jr, name:kennedy-joseph-p]
  - id: cal.1961-08-01.soviet-union
    when: Aug. 1
    date: '1961-08-01'
    thread: soviet-union
    also: [berlin-and-vienna, latin-america]
    c: 'Khrushchev approves most of Shelepin''s KGB plan: "a situation in various areas of the world" to divide the attention and forces of the United States during the settlement of a German peace treaty and West Berlin. Mutiny in Nicaragua, a rising in El Salvador, rebellion in Guatemala, with the Cubans, $25,000; the Kurds; Western minds to be persuaded of more Soviet missiles than there are.'
    n: '[[w.fursenko-one-hell-of-a]], 138; [[w.fursenko-khrushchevs-cold-war]], 378–79 (Shelepin''s proposal of July 29; the FSLN, $10,000 for weapons). To check: Shelepin to Khrushchev, July 29, 1961, Special Dossier of the Secretariat, Aug. 1, 1961, TsKhSD, as Zubok and Pleshakov cite it, *Inside the Kremlin''s Cold War*, 253–55 (cited by [[w.fursenko-one-hell-of-a]], 138 n.24). Names: Khrushchev, Shelepin.'
    src:
      c: 06f4632a
      rows:
        - 'w.fursenko-one-hell-of-a 138: all'
        - 'via w.fursenko-one-hell-of-a 138 n.24: all'
        - 'w.fursenko-khrushchevs-cold-war 378–79: all'
    tags: [name:khrushchev-nikita-s, name:shelepin-alexandr-n]
