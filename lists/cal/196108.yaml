    date: 1961-08
    thread: china-leadership
    also: [laos, vietnam-diplomacy]
    c: 'As Hanoi later tells it: the Chinese advise the Vietnamese to take the greatest care not to be drawn directly into the war in Laos, warning of American involvement and its cost to North Vietnam, Yunnan and Guangxi; Peking proposes Laos divided north and south, the north along China''s border to the revolutionary forces, the south to Phoumi Nosavan. The Laotian revolutionaries propose instead east and west zones, the east, along the cordillera, theirs, a corridor between North and South Vietnam.'
    n: '[[w.guan-vietnamese-communists-relations-with]], 200 (by the Vietnamese disclosures of 1979 and 1984; the author doubts). Made public: 1979 (the SRV Foreign Ministry''s White Paper, Oct. 4–6, 1979). To check: The Socialist Republic of Vietnam Foreign Ministry''s White Paper on relations with China, Hanoi Home Service, Oct. 4–6, 1979, SWB/FE/6238/A3/13 (cited by [[w.guan-vietnamese-communists-relations-with]], 200 n.84a); [[w.affairs-chinese-rulers-crimes-against]], 30–31 (cited by [[w.guan-vietnamese-communists-relations-with]], 200 n.84b). Names: Phoumi Nosavan.'
