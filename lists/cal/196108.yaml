    c: 'The Cabinet Room, 11 a.m., on Southeast Asia: Kennedy with Rusk, McNamara, Robert Kennedy, Harriman, Dulles, Lemnitzer and others;{1} Harriman to see Souvanna.{2} NSAM 80: the mobile training teams in Laos raised to 500, advisers down to the company; 2,000 more Meo supported, 11,000 in all; photo-reconnaissance over Laos by Thai or sanitized aircraft.{3} Lemnitzer, on a force for southern Laos: the first, by Reeves, 13,000.{4}'
    n: '[FRUS 1961–63, XXIV, doc. 172](https://history.state.gov/historicaldocuments/frus1961-63v24/d172) (the meeting); [doc. 173](https://history.state.gov/historicaldocuments/frus1961-63v24/d173) (NSAM 80). [[w.reeves-president-kennedy]], 221; [[w.mcnamara-in-retrospect]], ch. 2 at n.10 (Rusk for diplomacy and readiness under SEATO''s plan, some 30,000 troops; McNamara: Laos weighed against Berlin and six divisions for Europe, no war in Southeast Asia without total mobilization; Kennedy: no commitment to the plan "without regard to whatever else might happen in the world"). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 250 (the Johnson plan; the President''s decisions: contingency planning, 500 American advisers and as many Thai, 2,000 more Hmong to 11,000, photo reconnaissance twice a week); [[w.schulimson-joint-chiefs-of-staff]], 106 (Lemnitzer presents the revised SEATO Plan 5: a Thai, South Vietnamese and American force under an American commander into southern Laos, some 13,000 Americans to hold the Mekong towns). To check: NSAM 80, Aug. 29, 1961, National Security Files, box 331, Kennedy Library; Memorandum of conversation, meeting on Southeast Asia, Aug. 29, 1961, National Security Files, box 317, Kennedy Library (cited by [[w.reeves-president-kennedy]], 221). Check: Reeves has the Meo army in the Vietnamese highlands (221); NSAM 80''s Meo are in Laos. Names: Rusk, McNamara, Robert Kennedy, Harriman, Dulles, Lemnitzer, Souvanna Phouma, Kennedy.'
