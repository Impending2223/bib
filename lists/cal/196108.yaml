  - id: cal.1961-08.civil-rights-organizations
    when: Aug.
    date: 1961-08
    thread: civil-rights-organizations
    c: 'SNCC at the Highlander Folk School, Tenn., mid-month: direct action or voter registration, the administration urging registration and promising foundation money. Near a split. Baker''s compromise: two wings, direct action under Nash, voter registration.'
    n: 'SNCC Digital Gateway, [SNCC debates direct action & voter registration at Highlander](https://snccdigital.org/events/sncc-debates-direct-action-voter-registration-at-highlander/) (K–J Cong. II.L). [[w.dittmer-local-people]], 107 (not the days). To check: [[w.carson-in-struggle]]; [[w.payne-ive-got-the-light]]; [[w.ransby-ella-baker-and-the]]; [[w.hogan-many-minds-one-heart]]; Charles McDew, interviewed by Katherine M. Shannon, 1967, Howard University Civil Rights Documentation Project (cited by [[w.dittmer-local-people]], 107 n.34). Names: Baker, Nash.'
