  - id: cal.1961-08-31.cuba
    when: Aug. 31
    date: '1961-08-31'
    thread: cuba
    c: 'The Cuban Task Force at the White House: Ball, Bissell, Barnes, Goodwin. The public posture toward Cuba as quiet as possible. Covert action to aim at targets important to the economy, refineries, plants using American equipment; paramilitary action through Cuban groups able to form a political opposition within Cuba.'
    n: 'Goodwin to Kennedy, Sept. 1, [FRUS 1961–63, X, doc. 258](https://history.state.gov/historicaldocuments/frus1961-63v10/d258). [[w.schlesinger-robert-kennedy-and-his]], 475 (Goodwin''s report). Check: Schlesinger cites Goodwin''s memorandum of Sept. 6; FRUS prints one of Sept. 1 and one of Sept. 6 ([FRUS 1961–63, XII, doc. 81](https://history.state.gov/historicaldocuments/frus1961-63v12/d81)) opening alike. See [[cal.1961-04-15.cuba]]. Names: Ball, Bissell, Barnes, Goodwin.'
