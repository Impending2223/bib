    also: [china]
    c: 'Lushan. Liu Shaoqi comments on the finance and trade rectification pilot work group''s report on the "back door" in grain and commerce at Xinxiang, Henan. The tighter goods and markets, the worse the "back door": some commodities go mostly out the back and peasants cannot buy them. The grain and commercial departments are to blame, and Party and government leaders at every level too; if it is not checked, the plan to exchange goods with the peasants for farm produce and to pay workers by labor in kind will largely fail. How to stop the back door and have the state''s goods most needed by the people distributed fairly is one of the important problems of grain and the market. The comment is printed as a work conference document.'
