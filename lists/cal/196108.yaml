  - id: cal.1961-08-01.berlin-and-vienna
    when: Aug. 1
    date: '1961-08-01'
    thread: berlin-and-vienna
    c: Congress authorizes the call-up of up to 250,000 reservists for a year, [75 Stat. 242](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg242-3.pdf).
    n: CQ Almanac 1961. See [[cal.1961-07-25.berlin-and-vienna]].
  - id: cal.1961-08-01.jobs-and-wages-mo
    when: Aug. 1
    date: '1961-08-01'
    thread: jobs-and-wages
    c: 'Dalton approves S.B. 257, Missouri''s Fair Employment Practices Act: no discrimination in employment by race, creed, color, religion, national origin or ancestry; the Commission on Human Rights to enforce it.'
    n: '*Laws of Missouri*, 1961, [439–443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54161): "Approved August 1, 1961," [443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54165) (Missouri State Archives, Missouri Digital Heritage). Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), history and chronology. To check: [[w.lang-grassroots-at-the-gateway]]. Names: Dalton.'
    tags: [state:mo, name:dalton-john-m]
  - id: cal.1961-08-01.transition-and-staff
    when: Aug. 1
    date: '1961-08-01'
    thread: transition-and-staff
    c: 'The President to Bundy and Schlesinger, of the press on Francis X. Morrissey, his father''s man in Boston, for a federal judgeship: "my father has come to me and said that he has never asked me for anything ... to make Frank Morrissey a federal judge. What can I do?" Bundy: his father knew he should not ask it, and would know he was right to refuse. By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 375–76. To check: Schlesinger''s journal, Aug. 1, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 376 n.31). Names: John F. Kennedy, Bundy, Schlesinger. Check: the American Bar Association''s report and Robert Kennedy''s words to Anthony Lewis (376) undated; the judgeship left empty.'
    src:
      c: 9e6f6e24
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 375–76: all'
        - 'via w.schlesinger-robert-kennedy-and-his 376 n.31: all'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:schlesinger-arthur-m-jr, name:kennedy-joseph-p]
  - id: cal.1961-08-02.right-and-the-military
    when: Aug. 2
    date: '1961-08-02'
    thread: right-and-the-military
    c: Fulbright's memorandum to McNamara on military officers propagandizing for the radical right, written in June, is placed in the record. Thurmond demands an inquiry.
    n: '[Cong. Rec., Senate, Aug. 2, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-3-2.pdf). *Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3), which came of it. To check: [[w.woods-fulbright]]; [[w.crespino-strom-thurmonds-america]]. Names: Fulbright, Thurmond, McNamara.'
    tags: [name:fulbright-j-william, name:mcnamara-robert-s, name:thurmond-strom]
  - id: cal.1961-08-02.opinion
    when: Aug. 2
    date: '1961-08-02'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, July 13–18: back the Berliners'' right to a free election, East Berlin included, even at the cost of war, 61 percent; not, 27. The UN to try to settle Berlin, 81; able to, 40.'
    n: '[[w.gallup-poll]], III, 1729.'
  - id: cal.1961-08-02.amendments
    when: Aug. 2
    date: '1961-08-02'
    thread: amendments
    c: 'Robert Kennedy to the President, on presidential inability: the Vice President acts as President while it lasts, and decides it where the President cannot; the President decides when it has ended. The Eisenhower-Nixon memorandum of Mar. 3, 1958, reads the clause rightly; Brownell and Rogers had said the same.'
    n: '[42 Op. Att''y Gen. 69](https://archive.org/details/op-atty-gen/042/page/n93/mode/1up) (1961). To check: [[w.feerick-twenty-fifth-amendment]]. Names: Robert Kennedy, Eisenhower, Nixon, Brownell, Rogers.'
    tags: [name:kennedy-robert-f, name:eisenhower-dwight-d, name:nixon-richard-m, name:brownell-herbert-jr, name:rogers-william-p]
  - id: cal.1961-08-03.crime-and-hijacking
    when: Aug. 3
    date: '1961-08-03'
    thread: crime-and-hijacking
    c: A Continental Air Lines 707 seized at El Paso; Kennedy follows from the White House; the FBI and Border Patrol shoot out the tires.
    n: Telegrams of Commendation Following the Capture of High-Jackers of a Jet Airliner in El Paso, Texas, [1961 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=605) (Aug. 4, 1961). [FRUS 1961–63, X, doc. 252](https://history.state.gov/historicaldocuments/frus1961-63v10/d252). See [[cal.1961-05-01.crime-and-hijacking]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-03.european-community
    when: Aug. 3
    date: '1961-08-03'
    thread: european-community
    c: The Commons approves the application, 313–5; Labour's amendment refused, 318–209.
    n: HC Deb, [Aug. 3, 1961](https://api.parliament.uk/historic-hansard/commons/1961/aug/03/european-economic-community), cc. 1651–1786. See [[cal.1961-07-31.european-community]].
  - id: cal.1961-08-05.latin-america
    when: Aug. 5–7
    date: '1961-08-05'
    thread: latin-america
    c: Punta del Este. The Inter-American Economic and Social Council meets, Aug. 5. Dillon pledges $20 billion over ten years (Check the day). Che Guevara present.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). To check: [[w.goodwin-remembering-america]]; [[w.taffet-foreign-aid-as-foreign]]. See [[cal.1961-03-13.latin-america]]. Names: Dillon, Guevara.'
    tags: [name:dillon-c-douglas, name:guevara-ernesto]
  - id: cal.1961-08-05.china
    when: Aug. 5
    date: '1961-08-05'
    thread: china
    also: [testing]
    c: 'Hyannis Port, on the boat. Stevenson, Cleveland and Schlesinger with Kennedy on the General Assembly. General and complete disarmament the American goal, on Cleveland''s formula. Peking to be kept out this year: "If we can buy twelve months, it will be more than worth it."'
    n: '[[w.schlesinger-thousand-days-1965]], 478–80. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Stevenson, Cleveland, Schlesinger, Kennedy.'
    src:
      c: 8b92b3d6
      rows:
        - 'w.schlesinger-thousand-days-1965 478–80: all'
    tags: [name:stevenson-adlai-e, name:cleveland-j-harlan, name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-08-06.space
    when: Aug. 6
    date: '1961-08-06'
    thread: space
    c: Titov orbits for a day.
    n: 'News Conference, [1961 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=611) (Aug. 10, 1961). See [[cal.1961-04-12.space]]. Names: Titov.'
    tags: [name:titov-gherman]
  - id: cal.1961-08-07.conservation
    when: Aug. 7
    date: '1961-08-07'
    thread: conservation
    c: 'Cape Cod National Seashore Act signed, [75 Stat. 284](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg284.pdf): the outer beach of Cape Cod, Mass., in six towns, to be bought for a national seashore; no condemnation of a home where the town''s zoning bylaw meets the Secretary''s standards. Kennedy had cosponsored a like bill in the Senate. The House passed it July 10, [278–82](https://voteview.com/rollcall/RH0870055).'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing Bill Authorizing the Cape Cod National Seashore Park, [1961 Pub. Papers 551](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=609) (Aug. 7, 1961). S. 857, 87th Cong. To check: [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-08-07.africa
    when: Aug. 7
    date: '1961-08-07'
    thread: africa
    also: [robert-kennedy]
    c: 'Abidjan, the Ivory Coast''s first anniversary of independence, Robert Kennedy heading the American delegation. Houphouët-Boigny to him: Nkrumah of Ghana surrounded by sycophants, convinced of a divine mission to lead all Africa, the Russians encouraging him. Help Ghana build the Volta dam? A tepid yes.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 559–60. To check: Houphouët-Boigny and Robert Kennedy, memorandum of conversation, Aug. 7, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 560 n.2). Names: Robert Kennedy, Houphouët-Boigny, Nkrumah.'
    src:
      c: c743d3be
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 559–60: all'
        - 'via w.schlesinger-robert-kennedy-and-his 560 n.2: B-C'
    tags: [name:kennedy-robert-f, name:houphouet-boigny-felix, name:nkrumah-kwame]
  - id: cal.1961-08-08.state-and-city-finance-tx
    when: Aug. 8
    date: '1961-08-08'
    thread: state-and-city-finance
    c: Texas Legislature, on the first called session's last day, passes a $354 million tax bill, nearly $320 million of it from a 2 percent sales tax, the State's first general sales tax. Senate 23–8. Governor Daniel lets it become law without his signature and calls a second session, Aug. 10, for teachers' pay.
    n: 'Acts 1961, 57th Leg., 1st C.S., ch. 24 (H.B. 20), the Limited Sales, Excise and Use Tax Act, [Tex. Gen. Laws 71](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf): "Filed without Governor''s signature, Aug. 16, 1961," [114](https://lrl.texas.gov/scanned/sessionLaws/57-1/HB_20_CH_24.pdf#page=44). Tex. Legis. Ref. Library, [57th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-1) (July 10–Aug. 8, 1961), and [second called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=57-2) (Aug. 10–14). "The Making of a Sales Tax," [*Texas Observer*, Aug. 12, 1961, p. 1](https://issues.texasobserver.org/pdf/ustxtxb_obs_1961_08_12_issue.pdf). To check: [[w.cunningham-cowboy-conservatism]]; [[w.davidson-race-and-class-in]]. Names: Daniel.'
    tags: [state:tx, name:daniel-price]
  - id: cal.1961-08-09.confirmations
    when: Aug. 9
    date: '1961-08-09'
    thread: confirmations
    c: Lawrence J. O'Connor Jr. confirmed to the Federal Power Commission, [83–12](https://voteview.com/rollcall/RS0870127).
    n: '[107 Cong. Rec., Senate, Aug. 9, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt11/pdf/GPO-CRECB-1961-pt11-8-1.pdf). See [[cal.1961-06-13.confirmations]]. Names: O''Connor.'
    tags: [name:oconnor-lawrence-j-jr]
  - id: cal.1961-08-10.amendments
    when: Aug. 10
    date: '1961-08-10'
    thread: amendments
    c: Kennedy and Johnson adopt the Eisenhower-Nixon procedures on presidential inability. The President to tell the Vice President, who acts until it ends; where he cannot, the Vice President decides, after such consultation as seems to him appropriate, the Cabinet's support and the Attorney General's advice in mind; the President decides when it has ended.
    n: 'White House Statement and Text of Agreement Between the President and the Vice President on Procedures in the Event of Presidential Inability, [1961 Pub. Papers 561](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=619) (Aug. 10, 1961). See [[cal.1961-08-02.amendments]]. Names: Kennedy, Johnson, Eisenhower, Nixon.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1961-08-11.japan-and-korea
    when: Aug. 11
    date: '1961-08-11'
    thread: japan
    c: 'NSAM 68: a task force on the Ryukyus, as Kennedy promised Ikeda in June: the sources of the Ryukyuans'' discontent, the economy, what can be done, Okinawa''s worth as a base kept in mind.'
    n: '[FRUS 1961–63, XXII, doc. 340](https://history.state.gov/historicaldocuments/frus1961-63v22/d340). To check: [[w.sarantakes-keystone]]; [[w.schaller-altered-states]]; [[w.reischauer-my-life-between-japan]]. See [[cal.1961-06-20.transition-and-staff]]. Names: Ikeda, Kennedy.'
    tags: [name:kennedy-john-f, name:ikeda-hayato]
  - id: cal.1961-08-12.japan-and-korea
    when: Aug. 12
    date: '1961-08-12'
    thread: korea
    c: 'Park, chairman of the Supreme Council since its first chairman''s ouster, July 3, promises civilian government in 1963: a new constitution, a presidential system, a smaller one-house Assembly, elections in May 1963. Rusk, Aug. 11, to the Korean ambassador: elections sooner.'
    n: 'FRUS 1961–63, XXII, docs. [235](https://history.state.gov/historicaldocuments/frus1961-63v22/d235), [239](https://history.state.gov/historicaldocuments/frus1961-63v22/d239), [241](https://history.state.gov/historicaldocuments/frus1961-63v22/d241), [242](https://history.state.gov/historicaldocuments/frus1961-63v22/d242). See [[cal.1961-05-16.japan-and-korea]]. Names: Park, Rusk.'
    tags: [name:park-chung-hee, name:rusk-dean]
