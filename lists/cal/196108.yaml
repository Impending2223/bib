  - id: cal.1961-08-01.transition-and-staff
    when: Aug. 1
    date: '1961-08-01'
    thread: transition-and-staff
    c: 'The President to Bundy and Schlesinger, of the press on Francis X. Morrissey, his father''s man in Boston, for a federal judgeship: "my father has come to me and said that he has never asked me for anything ... to make Frank Morrissey a federal judge. What can I do?"{1} Bundy: his father knew he should not ask it, and would know he was right to refuse. By Schlesinger''s journal.{2}'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 375–76; [[w.navasky-kennedy-justice]], 362–63 (the rumors from June 1961; Anthony Lewis''s story of July 3 in the *Times*; the judgeship not given); [[w.schlesinger-journals]], 125–26 (the journal of Aug. 1, on the plane back from Otis: Kennedy, of the press on Morrissey: "my father has come to me and said that he has never asked me for anything, that he wants to ask me only this one thing—to make Frank Morrissey a federal judge. What can I do?"; Bundy: his father knows he should not ask it, and will know he was right to refuse; not "his father''s man in Boston"; also Rusk "deeply hurt" by Reston''s column and Kennedy''s view of six on-site inspections). To check: Schlesinger''s journal, Aug. 1, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 376 n.31). Names: John F. Kennedy, Bundy, Schlesinger. Check: the American Bar Association''s report and Robert Kennedy''s words to Anthony Lewis (376) undated; the judgeship left empty.'
    src:
      c: 9e6f6e24
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 375–76: 1, 2'
        - 'via w.schlesinger-robert-kennedy-and-his 376 n.31: 1, 2'
        - 'w.navasky-kennedy-justice 362–63: ?'
        - 'w.schlesinger-journals 125–26: 2'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:schlesinger-arthur-m-jr, name:kennedy-joseph-p]
    time_range:
      - 1961-08-01T13:00Z
