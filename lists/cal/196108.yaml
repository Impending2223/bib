    c: 'The Secretariat''s circular no. 35-TT/TW on the 16th anniversary of the August Revolution and National Day (Sept. 2): to praise the three years'' socialist transformation and the economic and cultural gains, spur emulation toward the 1961 plan and the First Five-Year Plan, and rouse the struggle against the Americans and Diệm. At the usual scale, with mass meetings and short emulation drives, tied to the rectification campaign; guard against sabotage, drought, flood, storm and fire; crowds kept from the capital. Eleven slogans.'
