  - id: cal.1961-08-02.amendments
    when: Aug. 2
    date: '1961-08-02'
    thread: amendments
    c: 'Robert Kennedy to the President, on presidential inability: the Vice President acts as President while it lasts, and decides it where the President cannot; the President decides when it has ended. The Eisenhower-Nixon memorandum of Mar. 3, 1958, reads the clause rightly; Brownell and Rogers had said the same.'
    n: '[42 Op. Att''y Gen. 69](https://archive.org/details/op-atty-gen/042/page/n93/mode/1up) (1961). To check: [[w.feerick-twenty-fifth-amendment]]. Names: Robert Kennedy, Eisenhower, Nixon, Brownell, Rogers.'
    tags: [name:kennedy-robert-f, name:eisenhower-dwight-d, name:nixon-richard-m, name:brownell-herbert-jr, name:rogers-william-p]
    short: the Kennedy–Johnson agreement on inability
