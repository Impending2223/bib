    time_approx: true
    place: washington
    thread: testing
    c: 'Kennedy with the National Security Council and the congressional leaders. The White House statement: the Soviet announcement "primarily a form of atomic blackmail, designed to substitute terror for reason"; the stockpile and the delivery systems "wholly adequate."{1} The meeting begins Thursday morning shortly after 10, the leaders due at 10:45. Present: Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow, Fisher, Bundy, Scoville and Schlesinger. Rusk proposes a statement announcing the decision to resume; Kennedy, back from a call from Stevenson, turns it into preparations ordered. Johnson: let Khrushchev take the heat for a few days. Murrow is against a statement.{2}'
    n: 'White House Statement Following the President''s Meeting With the National Security Council and Congressional Leaders on the Resumption of Nuclear Tests by the U.S.S.R, [1961 Pub. Papers 584](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=642) (Aug. 31, 1961). [[w.sorensen-kennedy]], 620; [[w.schlesinger-journals]], 130–32 (Thursday morning''s meeting before the congressional leaders at 10:45 (Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow, Fisher, Bundy, Scoville and Schlesinger present): Rusk proposes a statement announcing the decision to resume; Kennedy, after a call from Stevenson, turns it into preparations ordered; Johnson: "it would be a good thing if you let Khrushchev take the heat for a few days"; Murrow against the statement; the page does not give the White House statement''s text); [[w.schlesinger-journals]], 130–31. See [[cal.1961-08-30.testing]]. Names: Kennedy, Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow, Fisher, Bundy, Schlesinger, Stevenson.'
    src:
