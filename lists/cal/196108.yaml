  - id: cal.1961-08-05.berlin-and-vienna
    when: Aug. 5–6
    date: '1961-08-05'
    thread: berlin-and-vienna
    also: [europe-and-the-alliance]
    c: 'Paris: Rusk, Home and Couve de Murville on Berlin and Germany, Aug. 5; Brentano with them, Aug. 6. Formal negotiations with the Russians in October or early November, the Ambassadorial Group in Washington to prepare the Western position. Rusk and Home for a public move toward a Foreign Ministers'' meeting; Couve against any until Western preparations tell on Khrushchev.'
    n: '[FRUS 1961–63, XIV, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v14/d94); [doc. 99](https://history.state.gov/historicaldocuments/frus1961-63v14/d99) (Rusk to Kennedy, eyes only, Aug. 7). [[w.rusk-as-i-saw-it-1990]], 222. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Rusk, Douglas-Home, Couve de Murville, Brentano, Khrushchev.'
    src:
      c: 9f9556fd
      rows:
