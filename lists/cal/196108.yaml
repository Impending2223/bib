  - id: cal.1961-08-03.china-leadership-2
    when: Aug. 3
    date: '1961-08-03'
    place: daxinganling
    thread: china-leadership
    also: [china]
    c: 'Daxing''anling. In rain Liu Shaoqi inspects the Wufengshan forest farm of the Genhe forestry bureau, Yakeshi (now Xiguitu banner), Inner Mongolia, and holds a forum with its leading cadres and workers'' representatives on forest regeneration, restoring rules and setting up a responsibility system. On wages he says the forest-area allowance, 33 percent here and 25 percent in Xiaoxing''anling, is egalitarian: it should be divided by whether men live in the hills or in town, climb more or sit in an office, winter or summer, fine weather or rain. The state still gives the 33 percent, not a cent less; how it is shared is to be studied with the workers.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 534 (Aug. 3, 1961). Made public: 1996. Names: Liu Shaoqi.'
