    c: 'Wang Renzhong 王任重, at a meeting of the leaders of all the southern provinces, says that extraordinary difficulties demand extraordinary measures: grain can go only to the cities, and the villages in the grip of famine must fend for themselves. Some of the parts must be sacrificed to keep the whole.'
    n: '[[w.dikotter-maos-great-famine]], 134 n.11; [[w.dikotter-maos-great-famine]], 81 n.31 (Wang Renzhong in 1961: Hubei received 200,000 tonnes from Peking in 1959 to fight starvation, while the state exported more than 4 million tonnes that year). Made public: 2010. Check: whether Wang Renzhong''s remark on Hubei''s grain ([[w.dikotter-maos-great-famine]], 81 n.31) was made at this meeting. To check: Wang Renzhong, remarks to the meeting of the leaders of the southern provinces, Aug. 1961, Guangdong Provincial Archives, file of Aug. 10, 1961, 219-2-318, pp. 9–16 (cited by [[w.dikotter-maos-great-famine]], 134 n.11). Check: the day and the place. Names: Wang Renzhong.'
