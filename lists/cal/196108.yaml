    also: [robert-kennedy, testing]
    c: 'The day after the Soviet announcement that testing will resume, the President on interference with air access to Berlin. If a military plane is forced or shot down, fighters to cover the transports; Lemnitzer and Taylor for firing back at anti-aircraft guns; the President overrules them until a first such attack. By Robert Kennedy''s notes, the gloomiest meeting since early in the crisis. To his brother after: "I said I wanted to get off. ... Get off the planet."'
    n: '[FRUS 1961–63, XIV, doc. 135](https://history.state.gov/historicaldocuments/frus1961-63v14/d135) (Bundy''s memorandum of decisions). [[w.schlesinger-robert-kennedy-and-his]], 429–30. To check: Robert Kennedy, dictated Sept. 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 430 n.54). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Kennedy, Lemnitzer, Taylor, Robert Kennedy, McNamara. Check: Robert Kennedy''s notes do not date the meeting; Bundy''s memorandum is of Aug. 31.'
