        - 'w.peng-zhen-nianpu-1902 IV, 146–147: ?'
    tags: [polity:prc, name:deng-xiaoping, name:peng-zhen, name:li-fuchun, name:bo-yibo, name:mao-zedong, vis:only:prc]
