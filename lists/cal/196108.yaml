    c: The party group of the Hebei 河北 health department reports on at once launching a campaign to treat and prevent disease 《關於立即開展治病防病運動的報告》; the Provincial Committee forwards it Aug. 17 (document [61] no. 258). Since July the disease has risen in 67 of the province's 114 counties and cities; in mid-July edema, child malnutrition, amenorrhea and uterine prolapse are about 5 percent above the end of June, edema about 10; among edema patients grave and emaciated cases are many, up to 20 or 30 percent in some areas; in Huanghua 黃驊, Jinghai 靜海, Dongguang 東光 and elsewhere children are going blind and paralysed in batches; sudden death is rising.
