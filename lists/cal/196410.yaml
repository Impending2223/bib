  - id: cal.1964-10-01.black-nationalism
    when: Oct. 1
    date: '1964-10-01'
    thread: black-nationalism
    c: 'Louis X, by telephone, reports to Elijah Muhammad on the Boston trial for the beating of Barnette and asks whether to plead to lesser charges. Muhammad: no; "They needed a severe beating and should have been killed." Nine convicted in January.'
    n: '[[w.branch-pillar-of-fire]], 503. To check: FBI wiretap intercept reported in SAC, Phoenix, to SAC, Boston, Oct. 2, 1964, FMXNY-5010 (cited by [[w.branch-pillar-of-fire]], 503); Aubrey Barnette with Edward Linn, "The Black Muslims Are a Fraud," Saturday Evening Post, Feb. 27, 1965, p. 29 (cited by [[w.branch-pillar-of-fire]], 503). See [[cal.1964-09-02.black-nationalism]]. Names: Muhammad.'
    src:
      c: 573d7ce3
      rows:
        - 'w.branch-pillar-of-fire 503: all'
        - 'via w.branch-pillar-of-fire 503 n.the-muslims-pulled-a: all'
        - 'via w.branch-pillar-of-fire 503 n.eventual-conviction-in-january: all'
    tags: [name:muhammad-elijah]
  - id: cal.1964-10-01.mississippi
    when: Oct. 1
    date: '1964-10-01'
    thread: mississippi
    also: [king]
    c: 'McComb. The FBI and the Highway Patrol arrest three Klansmen who admit bombing by drawing Negro names from a hat; their car holds a pistol, four rifles, clubs, a hood and a deputy''s badge. DeLoach takes word to the White House. King, at Savannah''s St. Paul CME that night: the movement has "finally penetrated the closed society of Mississippi." The day before, Governor Johnson: "Some were bombings by white people."'
    n: '[[w.branch-pillar-of-fire]], 504, 503. To check: Lee White to LBJ, Oct. 1, 1964, Ex HU2/ST24, LBJ Library (cited by [[w.branch-pillar-of-fire]], 503); [[w.dittmer-local-people]], 309–11 (cited by [[w.branch-pillar-of-fire]], 504); New York Times, Oct. 1, 1964, p. 32 (cited by [[w.branch-pillar-of-fire]], 504); New York Times, Oct. 2, 1964, p. 27 (cited by [[w.branch-pillar-of-fire]], 504); speech of Gov. Paul Johnson, Oct. 1, 1964, WLBT news film 2770/F1800, MDAH (cited by [[w.branch-pillar-of-fire]], 504); Whitehead, Attack on Terror, pp. 166–68 (cited by [[w.branch-pillar-of-fire]], 504); U.S. Commission on Civil Rights, Law Enforcement, pp. 37–39. The U.S. Civil Rights Commission reported that most of the weekly bombings were carried out by a Ku Klux Klan klavern called the South Pike Rifleman''s Association, organized as an affiliate of the National Rifle Association in order to purchase arms and ammunition at discount. The klavern was known informally as the Wolf Pack (cited by [[w.branch-pillar-of-fire]], 504); et, Oct. 14, 1964, pp. 4–7 (cited by [[w.branch-pillar-of-fire]], 504). See [[cal.1964-09-20.mississippi]]. Names: DeLoach, King, Paul Johnson.'
    src:
      c: 09d527fc
      rows:
        - 'w.branch-pillar-of-fire 504: all'
        - 'via w.branch-pillar-of-fire 503 n.deloach-took-a-bulletin: all'
        - 'via w.branch-pillar-of-fire 504 n.four-episcopal-ministers: all'
        - 'via w.branch-pillar-of-fire 504 n.some-were-bombings-by: all'
