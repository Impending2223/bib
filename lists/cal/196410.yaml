    c: 'Mao presides over the Politburo Standing Committee at Diaoyutai, no. 10: not enough that China alone send a delegation to Moscow; propose that the twelve socialist states all send, the Koreans, Vietnamese, Romanians and Albanians in particular, as China alone would be conspicuous; East Europe''s states want the CPSU line kept. Both to be put to the CPSU, and the four ambassadors in Beijing to be told. Liu, Zhou and Deng agree; Deng, with Peng Zhen and others, to Korea to inform Kim Il Sung; Deng to tell Zhu De and Chen Yun, Zhou to tell Lin Biao.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 29, 1964. [[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 29, 1964: Zhou goes to Mao''s for a meeting or talk); [[w.lengxi-shinian-lunzhan-1956-1966]], 842–844 (Oct. 29; the 12 socialist states all to send delegations; Korea, Vietnam, Romania and Albania to be asked; Liu, Zhou and Deng agree; Deng to tell Zhu De and Chen Yun, Zhou Lin Biao; Deng with Peng Zhen and Wu to Pyongyang); [[w.deng-xiaoping-nianpu-1904]], III, 1833 (Oct. 29, 1964; Deng at the Politburo Standing Committee meeting Mao presides over; Mao proposes that all twelve socialist states send delegations to the October Revolution celebrations and asks Deng to pass this to Zhu De and Chen Yun, who were not at the meeting; the meeting decides that Deng, Peng Zhen and others go to Korea to tell Kim Il Sung). Made public: 1997. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kim Il Sung, Zhu De, Chen Yun, Lin Biao.'
