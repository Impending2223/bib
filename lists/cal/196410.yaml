  - id: cal.1964-10-24.soviet-union-leadership-2
    when: Oct. 24
    date: '1964-10-24'
    thread: soviet-union-leadership
    also: [china]
    c: 'The Belovezh forest. Brezhnev, Kosygin and Andropov, for the Presidium, meet Gomułka, Cyrankiewicz and Kliszko for over four hours, and tell them of Khrushchev''s removal. Gomułka: content; Khrushchev would not be contradicted; no consultation on foreign policy; last year''s nonproliferation proposal, and the multilateral force; the "second Rapallo," the trip to Bonn and Adzhubei; missiles to Cuba, unconsulted. On China no public polemic, talks to be sought, a CMEA parties'' meeting. The Poles ask what the Soviet Union wants of Poland.'
    n: '[[w.khrushchev-1964-stenogrammy]], 309–13 (doc. 18, the note of Oct. 27 to the Central Committee; RGANI, f. 3, op. 16, d. 552, ll. 16–20), 303–04 (doc. 10, P 166/I, Oct. 22, the authorization). [[w.brezhnev-rabochie-i-dnevnikovye]], I, 54–56 (№ 5, the week''s days, "Суб. — 24 — Б-Пуща," noon Moscow time, the two sides'' members, and Brezhnev''s list beforehand: a swing to the left, concessions to the Chinese, Khrushchev''s services not marked; no record of the talk; № 3, I, 47–48, the trip planned; the editors, I, 68 n.51: decided by the Presidium Oct. 22, held Oct. 24). Made public: 2007. See [[cal.1964-10-22.soviet-union-leadership]]. Names: Brezhnev, Kosygin, Andropov, Gomułka, Cyrankiewicz, Adzhubei, Khrushchev.'
    src:
