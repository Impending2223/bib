  - id: cal.1964-10-18.china-leadership-6
    when: Oct. 18
    date: '1964-10-18'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi replies to Li Fuchun, who had written that day: he cannot speak to the comrades at the planning meeting, having no mature views yet, and has not finished the material sent. The 1965 plan is better issued early. Planners and economic workers who would be thoroughgoing proletarian revolutionaries must seek truth from facts, be selfless, and dare to struggle against whatever thought and conduct harms socialism, without regard for personal feelings. Many comrades have rightist thinking on this point; the right deviation is the present chief danger; the Center has sent out Li Xuefeng''s letter for them to read, and a Hebei provincial committee summary on opposing the right. But not as before to oppose the right in production figures and plan targets, which must be realistic under strict thrift; today''s rightist thinking shows chiefly in class struggle, methods of managing enterprises, cadres'' state of mind and way of life.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607 (Oct. 18, 1964). Made public: 1996. Names: Liu Shaoqi, Li Fuchun.'
    tags: [polity:prc, name:liu-shaoqi, name:li-fuchun, vis:only:prc]
