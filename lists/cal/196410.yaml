  - id: cal.1964-10-03.china
    when: Oct. 3
    date: '1964-10-03'
    thread: china
    also: [congo, africa]
    c: China and Congo (Brazzaville) issue a joint communique on President Massamba-Débat's visit. The Chinese side warmly praises the Congolese people's great victory in the revolution of August, firmly supports the Congolese people's heroic struggle against imperialism, for the Congo (Brazzaville) as a base of threats, interference and subversion against the Congo (Leopoldville), and will give great support to the Congolese people's difficult struggle to promote the revolution and build their country. The Congo (Brazzaville) side values China's consistent policy of peace and foreign relations, its support for restoring China's lawful seat in the United Nations, and its opposition to the imperialist plot of "two Chinas". Both support the struggle of the African countries still under colonial rule for independence and freedom.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 361–362 (Oct. 3, 1964). Check: the book''s sentence on the Congo (Brazzaville) as a "base" is read as the communique''s words against imperialist use of it for pressure on and subversion of the Congolese people; the exact sense is as the book prints it.'
    src:
      c: f8362cc7
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 361–362: all'
    tags: [polity:prc, polity:congo-brazzaville, polity:us]
