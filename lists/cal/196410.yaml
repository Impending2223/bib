    n: '[[w.branch-pillar-of-fire]], 506–07. Check: the days. To check: Anonymous, "Introduction: Semi-Introspective," paper for the Nov. 1964 Waveland conference, b1f11, A/CS (cited by [[w.branch-pillar-of-fire]], 506); Memo re "SNCC Staff Retreat," Oct. 1964, b1f11, A/SC (cited by [[w.branch-pillar-of-fire]], 506); Memo "From Sherrod," ibid. It begins: "First of all, let us thank God for the wisdom of the pinched toe and the empty belly." It ends: "We were kids (cited by [[w.branch-pillar-of-fire]], 506); now we''re grown-up-almost. We still have a little time before the giant awakes. This may be the last time (cited by [[w.branch-pillar-of-fire]], 506); I don''t know." (cited by [[w.branch-pillar-of-fire]], 506); Carson, Jn Struggle, pp. 138–42 (cited by [[w.branch-pillar-of-fire]], 506); Forman, Black Revolution- aries, pp. 411–37 (cited by [[w.branch-pillar-of-fire]], 506); Mary King, Freedom Song, pp. 437–74 (cited by [[w.branch-pillar-of-fire]], 506); Dittmer, Local People, pp. 315–37. At Waveland on Nov. 6, 1964, Forman was quoted as follows: "Someone has said there is a power struggle going on...," in minutes, A/SN7 (cited by [[w.branch-pillar-of-fire]], 506); Interview with Robert P. Moses, Aug. 10, 1983, Feb. 15, 1991 (cited by [[w.branch-pillar-of-fire]], 506); Mike Miller to SNCC National Staff, Oct. 23, 1964, courtesy of Mike Miller (cited by [[w.branch-pillar-of-fire]], 507); Anonymous, "Introduction: Semi-Introspective," paper for the Nov. 1964 Waveland conference, b1f11, A/CS (cited by [[w.branch-pillar-of-fire]], 507); Frank Smith, "Position Paper No. 1," bl f11, A/CS (cited by [[w.branch-pillar-of-fire]], 507); Mary King, Freedom Song, pp. 567–69 (cited by [[w.branch-pillar-of-fire]], 507). See [[cal.1964-09-04.civil-rights-organizations]]. Names: Forman, Moses.'
