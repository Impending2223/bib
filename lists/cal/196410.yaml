  - id: cal.1964-10-01.king
    when: Oct. 1
    date: '1964-10-01'
    place: savannah
    thread: king
    also: [poverty, elections-1964]
    c: 'Savannah. King''s annual report to the convention: systematic tests in Alabama dropped; Alabama the next campaign, "135 years to register ten thousand Negroes"; Bevel and others sent to Rochester and Philadelphia; the poverty war sound, 80 percent of its beneficiaries white; the Republicans "a giant stride away from its Lincoln tradition." "My people, my people, listen, listen, the battle is in our hands."'
    n: '[[w.branch-pillar-of-fire]], 487–89; [[w.kotz-judgment-days]], 226 (at Savannah: Goldwater''s candidacy made it "essential for us to turn all forces to areas where registration could be readily accomplished and where practical results were possible," from *The Worker*, Oct. 11, 1964). Check: Kotz, 226 n.87, gives the Savannah words from *The Worker*, Oct. 11, 1964, no day. To check: [*New York Times*, Oct. 2, 1964](https://timesmachine.nytimes.com/timesmachine/1964/10/02/issue.html), at 27 (cited by [[w.branch-pillar-of-fire]], 487); Annual Report of MLK to the 8th An- nual SCLC Convention, Savannah, Georgia, delivered Oct. 1, 1964, A/KS6 (cited by [[w.branch-pillar-of-fire]], 487–89); Garrow, Bearing the Cross, pp (cited by [[w.branch-pillar-of-fire]], 487–89). See [[cal.1964-09-28.king]]. Names: King.'
