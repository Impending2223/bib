        - 'w.schwartz-lyndon-johnson-and-europe 42: A'
        - 'via w.schwartz-lyndon-johnson-and-europe 42 n.138: A'
    tags: [name:grewe-wilhelm, name:erhard-ludwig, name:rusk-dean]
