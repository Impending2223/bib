    thread: china
    also: [south-asia]
    c: The Chinese government issues a statement rebutting Indian Prime Minister Shastri's use of the conference of non-aligned countries at Cairo to slander China on the boundary question. Any mediation, and any proposals it makes, got without China's consent and in its absence, are unacceptable to China. India keeps putting forward its so-called acceptance of the Colombo proposals in whole only to counter, to turn its people's attention and to win U.S. military aid. The statement restates that if the Indian government really wishes to negotiate, the Chinese government is ready, at any time and in any place, to begin negotiations with the Indian government on the basis of the Colombo proposals.
