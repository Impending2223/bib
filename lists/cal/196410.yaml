    place: moscow
    thread: soviet-union-leadership
    c: 'The Central Committee''s plenum, Brezhnev opening, 153 of 169 members present. Suslov reports for the Presidium: Khrushchev''s errors, intrigue, the cult, the threat in July to disband the Academy of Sciences, the attempt to abolish the Timiryazev Academy, Adzhubei''s talk in Bonn. He reads Khrushchev''s letter, relief for "advanced age" and ill health, and the Presidium''s decision. No debate. Pegov asks that his belittling of the Presidium and the Central Committee be put in; Aristov, that he did not justify the Central Committee''s trust; the plenum votes, unanimously. Brezhnev elected First Secretary, unanimously; Kosygin recommended for Chairman of the Council of Ministers. The press to print only the first point. Secretaries of the republics and oblasts to meet next day at 11.'
    n: '[[w.khrushchev-1964-stenogrammy]], 232–39 (doc. 16, the unedited stenogram; RGANI, f. 2, op. 1, d. 752, ll. 6–21), 239–52 (doc. 17, Protocol no. 9; d. 742), 252–54 (doc. 18, Brezhnev''s opening, written after), 255–67 (doc. 20, Suslov''s report); 267 (doc. 21, the announcement, *Pravda*, Oct. 16). [[w.schattenberg-brezhnev]], 173–74 (the plenum from 6 p.m.; Suslov''s report; no discussion; Brezhnev on Podgorny''s motion, Kosygin "recommended"; Lesechko cut off; 173 n.16, 174 nn.21–24). Made public: 2007; the decision, 1964. To check: *Kak snimali Khrushcheva*, *Istoricheskii arkhiv*, 1993, no. 1, 3–19 (cited by [[w.schattenberg-brezhnev]], 173 n.14). Names: Brezhnev, Suslov, Khrushchev, Adzhubei, Pegov, Aristov, Kosygin. Check: the stenogram begins unrecorded and is unedited; Suslov''s later remarks are given to Brezhnev in the plenum''s record (n.191); the motion for Brezhnev stands as Podgorny''s with Polyansky''s name struck out. See [[cal.1964-10-14.soviet-union]].'
