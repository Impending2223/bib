    when: Oct. 1
    date: '1964-10-01'
    thread: medicare
    c: The conference's vote on the Senate's Medicare. The Senate conferees for, Long, Smathers, Anderson and Gore; against, Williams and Carlson; Byrd abstaining. The House's against, Mills, Byrnes and Curtis; for, King and Boggs. No hospital insurance in the 88th Congress.
