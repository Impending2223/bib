    n: 'Remarks at the Station in Alexandria, Va., at the Start of Mrs. Johnson''s Trip Through the South, [1963–64 Pub. Papers 1215](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=455) (Oct. 6, 1964); Remarks at a Fundraising Dinner in New Orleans, [1963–64 Pub. Papers 1281](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=521) (Oct. 9, 1964). [[w.young-two-suns-of-the]], 185–88 (the train, Oct. 6–9; Johnson at New Orleans); [[w.branch-pillar-of-fire]], 514–15; [[w.kotz-judgment-days]], 223–25 (four days, forty-seven speeches in six States; the Jung Hotel; the Bailey story, by Rayburn); [[w.white-making-of-the-president-1965]], 363–64 (New Orleans, Oct. 9: "I signed it, and I am going to enforce it"; the old Senator''s "Negro, Negro, Negro!"); [[w.kotz-judgment-days]], 223 (Robertson of Virginia away antelope hunting; a governor in mourning; Klansmen burn a cross on Governor Russell''s lawn in South Carolina; catcalls at Columbia; at Charleston, "Johnson is a Communist"; Mrs. Johnson: "right now, I am entitled to mine"); [[w.mann-walls-of-jericho]], 441–42 (Johnson''s speech at New Orleans; the story of Bailey and Rayburn); [[w.johnson-white-house-diary]], 194, 198–99 (written later: "forty-seven stops in four days"; a woman at a North Carolina stop, "was it Ahoskie?", milked twenty cows to be at the train; she kept no diary of the campaign; planned Sept. 4 to begin in Washington and end in New Orleans, 194; the plate after 182: "''Lady Bird Special'' in Virginia during the Whistlestop campaign through the South, October 6–9"; not Alexandria, the days'' stops or Johnson at New Orleans). [[w.mann-walls-of-jericho]], 441–42 (the train; Johnson at New Orleans, Oct. 9). Check: Branch gives the word Johnson used as "Nigger! Nigger! Nigger!", from The Vantage Point and Busby (514–15); the Papers, 1286, and the press print "Negro.". Check: Kotz gives the old Senator''s words as "Nigger, Nigger, Nigger" (224). The time is the first day''s. To check: PDD, Oct. 9, 1964, LBJ (cited by [[w.branch-pillar-of-fire]], 514); "Remarks at a Fundraising Dinner in New Orleans," Oct. 9, 1964, pp. 1281- (cited by [[w.branch-pillar-of-fire]], 514); [[w.johnson-vantage-point]], 110 (cited by [[w.branch-pillar-of-fire]], 514); Int; [[w.valenti-very-human-president]], 161; [[w.miller-lyndon]], 398 (cited by [[w.mann-walls-of-jericho]], 442). Horace Busby, Feb. 3, 1992 (cited by [[w.branch-pillar-of-fire]], 514); [[w.goldman-tragedy-of-lyndon-johnson]], 292–94 (cited by [[w.branch-pillar-of-fire]], 515); *Jet*, Oct. 22, 1964, at 4 (cited by [[w.branch-pillar-of-fire]], 515); "Remarks at a Fundraising Dinner in New Orleans," Oct. 9, 1964, pp. 1281- (cited by [[w.branch-pillar-of-fire]], 515); AJ, Oct. 10, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 515); [[w.miller-lyndon]], 485 (cited by [[w.branch-pillar-of-fire]], 515). See [[cal.1964-09-07.elections-1964]]. Names: Lady Bird Johnson, Johnson. Check: Young, 188, from Goldman and Woods, gives "Nigger, Nigger, Nigger!"; the Public Papers print "Negro." Check: Mann, 442, from Valenti and Miller, gives "Nigra, Nigra, Nigra!"'
