    thread: soviet-union-leadership
    c: 'The Presidium, the second day. Mikoyan: "In general, I was right"; "sending the submarines verged on adventurism"; Khrushchev to lose some posts, not his seat. Brezhnev: "Dismiss Comrade Khrushchev from the posts he holds and divide them." Khrushchev: the risk in Cuba "inevitable"; "I do not ask for mercy"; "Finally the party has grown and is able to control anyone." He asks his own dismissal; his Zil replaced by a Volga. The Presidium resolves: Khrushchev relieved, one man not to hold both posts, the plenum to meet that day, Brezhnev opening and Suslov reporting; Adzhubei out as editor of *Izvestiya*, Stepakov in; Kharlamov out as chairman of the radio and television committee, Mesyatsev in.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 537–38; [[w.prezidium-tsk-kpss-1954]], I, 871–72 (Malin''s notes); [[w.prezidium-tsk-kpss-1954]], I, 868–71 (Oct. 14, the speeches before Brezhnev''s: Polyansky, "Заболели манией величия" (you have caught megalomania); Mikoyan; Rashidov; Kosygin, "Вас освободить от всех постов" (relieve you of all posts); Podgorny); [[w.prezidium-tsk-kpss-1954]], III, 767–68 (P 164/I, Oct. 13–14: Khrushchev''s errors, his "преклонном возрасте" (advanced age) and failing health; his posts to be divided); [[w.brezhnev-rabochie-i-dnevnikovye]], I, 38–41 (№ 1, Brezhnev''s notes for his speech at the Presidium, Oct. 13–14: the plenums not held; the party organs slighted; a cult of Khrushchev in place of the one before; Ryazan and the corn; no industrial line; his own years in the Presidium; the notes, not the words spoken); [[w.khrushchev-1964-stenogrammy]], 226–27 (doc. 9, Malin''s cards, Khrushchev''s last words); [[w.khrushchev-1964-stenogrammy]], 230 (doc. 12, his letter asking release); [[w.khrushchev-1964-stenogrammy]], 231–32 (docs. 13–15, P 164/I–III, Oct. 13–14: the decision, Adzhubei and Stepakov, Kharlamov and Mesyatsev); [[w.schattenberg-brezhnev]], 173 (the second day: Brezhnev''s personal statement; Khrushchev concedes, the party "has matured," asks release for age and health; 173 nn.10–13). Check: [[w.schattenberg-brezhnev]], 173, has Khrushchev "I ask for mercy," citing Malin''s card ([[w.khrushchev-1964-stenogrammy]], 226, 173 n.11), which reads "Не прошу милости" (I do not ask for mercy). To check: Fursenko''s interviews with veterans of the Kremlin guard, Oct. 2005 (cited by [[w.fursenko-khrushchevs-cold-war]], 538 n.28). See [[cal.1964-10-13.soviet-union]]. Names: Mikoyan, Khrushchev, Brezhnev.'
