        - 'via w.branch-pillar-of-fire 504 n.three-klansmen.d: all'
        - 'via w.branch-pillar-of-fire 504 n.king-announced-this-news.a: all'
        - 'via w.branch-pillar-of-fire 504 n.king-announced-this-news.b: all'
