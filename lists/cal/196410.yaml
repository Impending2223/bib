  - id: cal.1964-10-01.goldwater
    when: Oct. 1
    date: '1964-10-01'
    thread: goldwater
    also: [elections-1964, vietnam]
    c: 'Columbus, Ohio, from the train. Goldwater on Vietnam: "I promise you that we would bend every effort to see that decisions were made in South Vietnam ... that some day we could hope and pray that we could end that terrible conflict." Later, a statement: if elected, he would send Eisenhower to South Vietnam.'
    n: '[[w.goldberg-barry-goldwater]], 228–29; the [*New York Times*, Oct. 1, 1964](https://timesmachine.nytimes.com/timesmachine/1964/10/01/issue.html), 24, and Oct. 6, 1964, 1, 29, by the notes (228 n.103, 229 n.104). Check: the day of the statement. See [[cal.1964-09-28.goldwater]]. Names: Goldwater, Eisenhower.'
    src:
      c: db576cb5
      rows:
        - 'w.goldberg-barry-goldwater 228–29: all'
        - 'via w.goldberg-barry-goldwater 228 n.103: A'
    tags: [name:goldwater-barry-m, name:eisenhower-dwight-d]
