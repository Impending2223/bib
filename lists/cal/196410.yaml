  - id: cal.1964-10-03.congress
    when: Oct. 3
    date: '1964-10-03'
    thread: congress
    c: '88th Congress adjourns sine die: the Senate at 1:41 p.m., the House at 3:16. Passed in the second session: the tax cut, civil rights, the poverty program, wilderness, food stamps, mass transit, housing. Left: Medicare, in conference; Appalachia and the disability amendment, passed by the Senate only.'
    n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-5-1.pdf) (1964); [House](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-5-2.pdf). Statement by the President Reviewing the Work of the 88th Congress, [1963–64 Pub. Papers 1201](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=441) (Oct. 3, 1964). CQ Almanac 1964. [[w.sundquist-politics-and-policy]], 104, 316–17 (the adjournment, Appalachia left in the House, 104; Medicare dead in conference, 316–17); [[w.zelizer-fierce-urgency-of-now]], 191 (Medicare, added by the Senate to the Social Security bill, killed by Mills in conference). To check: [[w.congress-and-the-nation]] (K–J Cong. II.L). See [[cal.1964-01-07.congress]]; [[cal.1964-09-02.medicare]]; [[cal.1964-09-25.jobs-and-wages]]; [[cal.1964-09-28.succession]]. Names: Johnson. Check: the page.'
