  - id: cal.1964-10-02.elections-1964
    when: Oct. 2
    date: '1964-10-02'
    thread: elections-1964-new-york
    also: [robert-kennedy, civil-rights-organizations]
    c: 'The New York NAACP''s convention. Keating: Robert Kennedy "abandoned his post at the Department of Justice with an unfinished task." Charles Evers, of the Mississippi NAACP, throws away his text: Kennedy "means more to us in Mississippi than any white man I know, including yourself, Senator." No endorsement. By Evers''s account.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 671; [[w.guthman-we-band-of-brothers]], 307–08 (Buffalo; Keating''s advance text; Evers throws away his text). Check: Guthman quotes Evers otherwise: "If he ran for dogcatcher in Mississippi, every Negro in Mississippi would vote for him" (307). To check: [[w.stein-american-journey]], 180. Names: Keating, Robert Kennedy, Evers.'
