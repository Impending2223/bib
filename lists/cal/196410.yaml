  - id: cal.1964-10-01.students
    when: Oct. 1–2
    date: '1964-10-01'
    thread: students
    also: [states-and-cities]
    c: 'Berkeley. Weinberg, a former student, arrested at a CORE table on Sproul Plaza, the University enforcing its ban on political tables and fund-raising there since Sept. 14; students hold the police car 32 hours, Savio speaking from its roof. Oct. 2, 7:30 p.m.: Kerr and the students'' representatives sign a pact. The Free Speech Movement formed, Oct. 3–4.'
    n: 'Free Speech Movement, [*Chronicle of the Free Speech Controversy*](https://www.fsm-a.org/stacks/FSM_chronofcontrov.html) (leaflet). [[w.branch-pillar-of-fire]], 503, 505–06; [[w.bernstein-guns-or-butter]], 403–05 (Savio''s three demands; the pack-in; Oct. 2, the agreement at 7:20). To check: [[w.rorabaugh-berkeley-at-war]]; [[w.cohen-freedoms-orator]]; [[w.gitlin-sixties]]; [[w.berkeley-in-the-sixties]]; Heirich, The Beginning, pp. 98–119 (cited by [[w.branch-pillar-of-fire]], 503); Viorst, Fire in the Streets, pp. 290–91 (cited by [[w.branch-pillar-of-fire]], 503); Heirich, The Beginning, pp. 129–44 (cited by [[w.branch-pillar-of-fire]], 505); Viorst, Fire in the Streets, pp. 29108 (cited by [[w.branch-pillar-of-fire]], 505). See [[cal.1962-06-11.students]]. Names: Savio, Weinberg, Kerr.'
