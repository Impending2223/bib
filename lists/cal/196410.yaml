    c: 'Mao, Hall of the People, evening: receives Phạm Văn Đồng, premier, leading a Party and government delegation; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun present. Mao: the U.S. may fight as long as it likes, Vietnam will fight as long; Korea showed that it can be fought. Not the time to send Chinese troops to the South; when depends. Whether to hit the North is not decided. Phạm Văn Đồng: Vietnam will keep the war in the South to "special war" and not let it spread north. Mao: good; prepare, but be careful, no haste. A talk with the U.S. may be of use. China is ready for an American landing, which will need Chiang and South Korea; if it comes, let it go where it likes, and fight guerrilla as with the Japanese.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1964. [[w.zhou-enlai-waijiao-huodong]], 420 (Oct. 5, 1964; 晚7时; Zhou with Mao); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 606 (Oct. 5, 1964; Liu, with Mao, Zhou Enlai, Zhu De and Deng Xiaoping, receives Phạm Văn Đồng, member of the Vietnam Workers'' Party Politburo and Premier); [[w.77-conversations-between-chinese]], [72–75](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=70) (doc. 3; Mao with Phạm Văn Đồng and Hoàng Văn Hoan, Beijing, Oct. 5, 1964, ''7–7:50 (p.m.?)'': Mao on the division the DRV planned to send to the South, the timing the point, and on the U.S. not yet having decided to attack the North; keep the main force, ''the green mountain''; Zhou on the Security Council''s invitation to Hanoi through U Thant and the Soviets, still secret, and over 120 Warsaw meetings; 72 nn.114–117, 74 n.119). [[w.deng-xiaoping-nianpu-1904]], III, 1830 (Oct. 5, 1964; evening, 晚; Deng with Liu Shaoqi, Zhu De and Zhou Enlai at Mao''s meeting with Phạm Văn Đồng 范文同, member of the Vietnam Workers'' Party Politburo and Prime Minister). Made public: 1993. Check: Tønnesson''s essay (77 Conversations, 34) dates Phạm Văn Đồng''s words ''Our Politburo has made a decision on this matter'' to Mao as Oct. 5, 1965; the record (doc. 3) is Oct. 5, 1964. Names: Mao Zedong, Phạm Văn Đồng, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun, Chiang Kai-shek.'
