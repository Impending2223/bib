  - id: cal.1964-10-01.vietnam
    when: Oct. 1
    date: '1964-10-01'
    thread: vietnam
    also: [elections-1964, press-and-broadcasting]
    c: 'Bundy to Johnson, for his meeting with the bureau chiefs: "a hint of firmness." "It is a better chance than even that we will be undertaking some ... action in the Laotian corridor and even in North Vietnam within the next two months, and we do not want the record to suggest even remotely that we campaigned on peace in order to start a war in November."'
    n: '[[w.preston-war-council]], 157. To check: Bundy to Johnson, Oct. 1, 1964, NSF, Memos to the President, Bundy, box 2, LBJ Library (cited by [[w.preston-war-council]], 157 n.3). Names: Bundy, Johnson.'
