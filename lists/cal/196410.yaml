  - id: cal.1964-10-01.elections-1964
    when: Oct. 1
    date: '1964-10-01'
    thread: elections-1964-johnson
    c: 'John Bartlow Martin to Moyers on Illinois, "the big pivotal Midwest swing state": Goldwater should carry it, downstate and the Chicago suburbs; but the regular Republicans "resent" his volunteers, the Birch Society among them, and the middle-class Republicans will vote for Johnson. Racial fears drive the workers to Goldwater: "If you want a Negro in the next plant, vote Democrat."'
    n: '[[w.young-two-suns-of-the]], 156. To check: John Bartlow Martin to Moyers, Oct. 1, 1964, PL/ST 14, box 45, WHCF, LBJ Library (cited by [[w.young-two-suns-of-the]], 156 n.37); the same (cited by [[w.young-two-suns-of-the]], 156 n.38). Names: John Bartlow Martin, Moyers, Goldwater, Johnson.'
    src:
      c: 329ee67d
      rows:
        - 'w.young-two-suns-of-the 156: all'
        - 'via w.young-two-suns-of-the 156 n.37: all'
        - 'via w.young-two-suns-of-the 156 n.38: all'
    tags: [name:martin-john-bartlow, name:moyers-bill, name:goldwater-barry-m, name:johnson-lyndon-b, state:il]
