    c: 'Pyongyang, the afternoon. Deng Xiaoping, with Peng Zhen, Wu Lengxi and Liaison Department staff, in the first of two talks with Kim Il Sung: Peking''s view of Khrushchev''s fall and the new leaders'' prospects; the plan to send delegations to Moscow, "on-the-spot investigation," with no great hopes. Kim agrees all the socialist states should send; he will not go himself. Kim asks who planned the fall: Brezhnev chaired, but was back from Berlin only before Oct. 12; Suslov read the report; perhaps Polyansky or Kozlov. Deng: Suslov surely agreed, but not he alone.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 843–846 (the talks of Oct. 30, afternoon, and Oct. 31, morning, their matters given together: Kim''s view of Brezhnev; the middle of the three possibilities the likeliest, Kim agreeing; his welcome to exchanges between the parties and thanks to Deng for coming himself; Deng on Suslov and Andropov in July 1963; Wu on Brezhnev beside Liu in 1960 "like a pupil"; Kim Il later to lead the Korean delegation); [[w.deng-xiaoping-nianpu-1904]], III, 1833 (Oct. 30, 1964; afternoon, 下午; Deng''s talk with Kim Il Sung). Made public: 1999. Names: Deng Xiaoping, Peng Zhen, Kim Il Sung, Brezhnev, Suslov, Polyansky, Kozlov.'
