    also: [china]
    c: 'The Presidium on the invitations for Nov. 7: whether the Chinese party-government delegation is to come with the other socialist parties''; directives approved for consultations that day by the high-frequency line, Brezhnev with Gomułka, Gheorghiu-Dej and Novotný, Podgorny with Kádár and Ulbricht, Suslov with the Bulgarians. Brezhnev''s notes of the replies: Gomułka, invite the Chinese, at the top level, the Poles'' to be "simply a delegation of Poland"; Novotný, invite them, a refusal would be used against both parties, Albania not; Gheorghiu-Dej (by the editors'' guess), the moment to be used "cleverly," Romania to send a delegation.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 56–57 (№ 6, "Готовить директивы для переговоров" (prepare directives for the talks) and the replies), 72 nn.100–102 (the editors: the Presidium of Oct. 29 took up the paper of the Central Committee''s department and the Foreign Ministry on the Chinese delegation, decided on consultations that day with the leaders of the fraternal parties and approved the directives for them by the high-frequency line, given to Brezhnev, Podgorny and Suslov), 69 n.69 (the invitations fixed Oct. 30; Albania invited, absent). [[w.khrushchev-1964-stenogrammy]], 333–38 (docs. 27, 29–30, P 168/I and II, Oct. 29: Chervonenko''s telegram from Peking of that day, nos. 1170–75, on the delegation for the anniversary, to the Foreign Policy Commission; Andropov and Gromyko''s draft of Brezhnev''s letter to Castro, to be reworked; RGANI, f. 3, op. 18, d. 292, l. 1). Made public: 2016. Check: [[w.schattenberg-brezhnev]], 270, citing Brezhnev''s notes of Oct. 29 (270 n.16), has Suslov travel to Bulgaria, Podgorny to the GDR and Hungary, and Brezhnev and Kosygin seek out the Poles, Czechoslovaks and Romanians in October; the notes give talks by the high-frequency line, the same men with the same parties. To check: the Polish, Czechoslovak and Romanian accounts of the calls. Names: Brezhnev, Gomułka, Gheorghiu-Dej, Novotný, Podgorny, Kádár, Ulbricht, Suslov.'
