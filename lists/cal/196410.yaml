  - id: cal.1964-10-22.soviet-union-leadership
    when: Oct. 22
    date: '1964-10-22'
    place: moscow
    thread: soviet-union-leadership
    c: 'The Presidium. Suslov on his talk with the Hungarians: harsh, nothing of his merits, unexpected; did Moscow mean to change its policy on the cult; they asked that Khrushchev''s working-over not become "вот был культ Сталина, вот культ Хрущева" (there was Stalin''s cult, here is Khrushchev''s) in the press. Brezhnev, Kosygin and Andropov to meet Gomułka and the Polish party on Oct. 24: of the cult, restrained words; of Adzhubei, "болтливый" (a chatterbox); the trip to the Federal Republic never decided; on China, no change, the press polemic halted. The obkoms to be reunited in principle, the plenum to take it up. Khrushchev freed as chairman of the Bureau for the RSFSR; his salary kept for life, a state dacha at Semenovskoe, a Volga with KGB drivers, the Fourth Chief Directorate''s care, the dietary canteen.'
    n: 'Protocol 166, items I, Iб and II. [[w.prezidium-tsk-kpss-1954]], I, 872–73 (doc. 321, Malin''s notes); III, 771–72 (P 166/I and II). [[w.brezhnev-rabochie-i-dnevnikovye]], I, 47–48 (№ 3, Brezhnev''s list for the day, not earlier than Oct. 17 and the 22nd by its items: Tsedenbal''s reception and the press; the trip to Belovezhskaya Pushcha; Khrushchev''s housing and keep; a foreign-policy commission of Suslov, Andropov, Ponomarev, Gromyko, Semichastny and Ilichev; the Presidium to meet that day on the finished questions, not on personnel; the editors, I, 68 nn.51–55: the Protocol of Oct. 22); [[w.khrushchev-1964-stenogrammy]], 301–05 (docs. 9–13, Malin''s notes; P 166/I, II, VIII, IX); [[w.schattenberg-brezhnev]], 173–74 (Khrushchev''s keep, the decisions of Oct. 22 and Dec. 15 together, 174 n.18). See [[cal.1964-10-14.soviet-union]]. Made public: 2003. Names: Suslov, Khrushchev, Brezhnev, Kosygin, Andropov, Gomułka, Adzhubei.'
