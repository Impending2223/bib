  - id: cal.1964-10-24.china-leadership-3
    when: Oct. 24
    date: '1964-10-24'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi drafts for the Central Committee an instruction on the struggle to seize power in the socialist-education movement and forwards the report of the Tianjin municipal committee on the seizure of power in the Xiaozhan area. The instruction says: where power has been manipulated or usurped by the enemy, a struggle to seize it must be carried out, or a grave mistake is made; before resolving on it, deep and detailed investigation is needed to know whether leadership is in the enemy''s hands and whether the leading core of the place has changed in nature, and only then can it be decided whether to struggle for power.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607–608 (Oct. 24, 1964); [[w.macfarquhar-origins-of-the-cultural]], III, 409 (the Tianjin committee''s report confirming Chen Boda''s findings at Xiaozhan is circulated with the comment that where counter-revolutionaries have usurped the leadership power must be seized back); [[w.mao-zedong-zhuan]], VI, ch. 73 (Oct. 24 Liu forwards the Tianjin committee''s report on the seizure of power at Xiaozhan, with his instruction on the struggle to seize power, drafted for the Center; part of the contradictions with the enemy appear as contradictions among the people, even in the Party (n.22)). Made public: 1996. Check: the book has the Tianjin report circulated six weeks after Chen Boda''s letter of Aug. 4 (III, 409). To check: the Tianjin municipal committee''s report on the seizure of power in the Xiaozhan area and the Central Committee''s instruction (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 607–608); [[w.jin-1949-1989-niande-zhongguo]], 545–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 409 n.56a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1124 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 409 n.56b); Liu Shaoqi 刘少奇, instruction drafted for the Center 中共中央 forwarding the Tianjin committee''s 天津市委 report on the struggle to seize power in the Xiaozhan area 小站地区 (manuscript 手稿), Oct. 24, 1964 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.22). Names: Liu Shaoqi.'
