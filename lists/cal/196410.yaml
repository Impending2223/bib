    c: 'Mao presides in the afternoon over the Politburo Standing Committee, Room 118, with a dozen more on foreign affairs: on what to do since Khrushchev''s fall, ten days'' watching. The policy so far was "affirm and watch" (one telegram); now "push and watch". Zhou Enlai to lead a Party and government delegation to the October Revolution celebrations, with He Long; no decision that day. The new CPSU leaders will first take up farming, industry, Party structure; the policy toward China unlikely to change soon; work on them, no great hopes.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 27, 1964. [[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 27, 1964: Zhou goes to Mao''s for a meeting or talk); [[w.lengxi-shinian-lunzhan-1956-1966]], 841–844 ("one affirm, two watch" to "one push, two watch"; Zhou to head the delegation to Moscow with He Long; the matter left to the next day; the new leaders to take up farming, industry, Party structure first; the policy to China unlikely to change soon); [[w.deng-xiaoping-nianpu-1904]], III, 1833 (Oct. 27, 1964; evening, 晚; Deng at the Politburo Standing Committee meeting Mao presides over; Mao proposes that China take the initiative with the CPSU Central Committee in proposing to send a delegation to the October Revolution celebrations). Made public: 1997. Names: Mao Zedong, Zhou Enlai, He Long, Khrushchev.'
