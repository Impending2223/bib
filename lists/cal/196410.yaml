    c: 'Pitsunda, 9:30 a.m. Khrushchev with Palewski, briefly: "We can wait. We have patience." At the Moscow airport only Semichastny and Georgadze; his guards replaced; in the car Mikoyan urges him to give up the premiership to Kosygin: "I am not going to fight." The Presidium, Brezhnev in his place: his unilateral acts; Shelepin: growth down from 11 to 4 percent, Anadyr "a risky enterprise," "juggl[ed] with people''s fates."'
    n: '9:30 a.m. by Moscow''s clock or Tbilisi''s at Pitsunda, not settled: the range covers both. [[w.fursenko-khrushchevs-cold-war]], 536–37 (Palewski: "in excellent form"; twenty-five in the room); [[w.prezidium-tsk-kpss-1954]], I, 862–65 (Malin''s notes, Oct. 13); [[w.prezidium-tsk-kpss-1954]], I, 865–68 (Malin''s notes of Oct. 13 continued, Grishin and the others: "Пышно расцвел культ личности одного лица" (the cult of one person''s personality has bloomed lushly)); [[w.khrushchev-1964-stenogrammy]], 217–27 (doc. 9, Malin''s cards of Oct. 13–14; the present, p. 217); [[w.schattenberg-brezhnev]], 173 (the guards replaced, by Semichastny, 173 n.8); [[w.schattenberg-brezhnev]], 170, 172–73 (the Presidium from 3 p.m.; Brezhnev first to speak, the others after; Khrushchev home for the night); [[w.lengxi-shinian-lunzhan-1956-1966]], 893 (from the memoirs Wu quotes: Khrushchev and Mikoyan land at Vnukovo-2 the afternoon of Oct. 13; the Kremlin guard replaced; the Presidium, Brezhnev presiding, Kozlov absent). Check: Malin''s notes (I, 862) list Khrushchev among those present and Brezhnev as the speaker on the item; nothing of who presided. Shelepin (864–65): national income "from 11% to 4%"; the Cuban crisis "авантюра" (an adventure), "juggling with the fates of the people." To check: Trevelyan, "The Circumstances of Mr. Khrushchev''s Downfall," Nov. 2, 1964, FO 371/177666; Baudet to Couve de Murville, Oct. 16, 1964, *Documents Diplomatiques Français*, 1964, II, no. 136 (cited by [[w.fursenko-khrushchevs-cold-war]], 536 n.19, n.20). Check: Brezhnev''s opening to the plenum, written after, says the Presidium met Oct. 13 in full except Kozlov, ill, "under Khrushchev''s chairmanship" ([[w.khrushchev-1964-stenogrammy]], 253). Check: [[w.schattenberg-brezhnev]], 170 (by Semichastny and Shelest, 170 n.454), has Brezhnev alone meet Khrushchev and Mikoyan at the airport, without the Presidium; the entry, Semichastny and Georgadze. The work has Khrushchev take the chair at the Presidium (170). See [[cal.1964-10-12.soviet-union]]. Names: Khrushchev, Palewski, Mikoyan, Kosygin, Brezhnev, Shelepin.'
