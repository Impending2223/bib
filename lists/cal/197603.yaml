    c: 'Illinois primary. Republican: Ford over Reagan, 456,750 to 311,295, 58.9 percent. Democratic: Carter over Wallace, 630,915 to 361,798, 48.1 percent.'
    n: '[*State of Illinois Official Vote Cast at the Primary Election, March 16, 1976*, 5, 8–13](https://archive.org/details/stateofillinoiso1976illi/page/n7). CQ Guide 6th (2010) 417. See [[cal.1976-02-24.elections-1976]]. Names: Wallace, Ford, Carter, Reagan.'
    tags: [primary:1976-03-16, name:wallace-george-c, name:ford-gerald-r, name:carter-jimmy, name:reagan-ronald]
