    date: '1976-03-09'
    thread: elections-1976
    c: 'Florida primary. Republican: Ford over Reagan, 321,982 to 287,837, 52.8 percent. Democratic: Carter over Wallace, 448,844 to 396,820, 34.5 percent.'
    n: 'CQ Guide 6th (2010) 417. See [[cal.1976-02-24.elections-1976]]. Names: Wallace, Ford, Carter, Reagan.'
    tags: [primary:1976-03-09, name:wallace-george-c, name:ford-gerald-r, name:carter-jimmy, name:reagan-ronald]
