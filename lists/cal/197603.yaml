    n: '[*North Carolina Manual, 1977*, 723–724](https://archive.org/details/northcarolinaman1977nort/page/n743). CQ Guide 6th (2010) 418. See [[cal.1976-02-24.elections-1976]]. Names: Wallace, Ford, Carter, Reagan.'
