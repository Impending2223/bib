    c: 'Primaries in Massachusetts and Vermont. Republican: Ford in Massachusetts and Vermont. Democratic: Jackson in Massachusetts; Carter in Vermont.'
    n: 'Mass., [*Election Statistics*, 1976 (Pub. Doc. No. 43), 56, 98](https://archive.org/details/electionstatisti19761977mass/page/n64). CQ Guide 6th (2010) 417. See [[cal.1976-02-24.elections-1976]]. Names: Ford, Jackson, Carter.'
