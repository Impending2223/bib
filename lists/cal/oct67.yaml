    c: Michigan. Romney asks the legislature, in special session, for a State open occupancy law against discrimination in the sale or rental of most housing, and more money for the Civil Rights Commission. Oct. 16, demonstrators against it in the House gallery, some for Wallace. The House turns it down as the session ends, about Dec. 14 (Check the day and the vote).
    n: '*Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download), 1; [Jan. 10, 1968](https://our.oakland.edu/bitstreams/0fd81de3-05ea-4cb6-a8dd-e5008a871b71/download), 1 ("turned down by the House only 27 days ago"). [[w.fine-expanding-the-frontiers-of]]; [[w.mollenhoff-george-romney]]. Names: Romney.'
