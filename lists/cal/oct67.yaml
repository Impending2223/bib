list: cal
section: XCV
entries:
  - id: cal.1967-10.elections-1968
    when: Oct.
    date: 1967-10
    thread: elections-1968
    also: [india-and-china]
    c: 'Nixon, "Asia After Viet Nam," in *Foreign Affairs*, October: "we simply cannot afford to leave China forever outside the family of nations."'
    n: '[[w.nixon-asia-after-viet-nam]]. [[w.perlstein-nixonland-2008]]; [[w.ambrose-nixon]]; [[w.witcover-resurrection-of-richard-nixon]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1967-10-02.court
    when: Oct. 2
    date: '1967-10-02'
    thread: court
    c: The October Term opens; Marshall, confirmed Aug. 30, takes his seat, the first Negro on the Court. Sept. 30, at the ranch, Johnson had named Erwin N. Griswold, dean of the Harvard Law School, Solicitor General in Marshall's place; sworn Oct. 23.
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-16) (Sept. 30, 1967); [Remarks at the Swearing In of Erwin N. Griswold as Solicitor General](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-erwin-n-griswold-solicitor-general-the-united-states) (Oct. 23, 1967). [[w.williams-thurgood-marshall]]. See [[cal.1967-06-13.court]]. Names: Marshall, Griswold, Johnson.'
    tags: [name:marshall-thurgood, name:griswold-erwin-n, name:johnson-lyndon-b]
  - id: cal.1967-10-02.vietnam
    when: Oct. 2
    date: '1967-10-02'
    thread: vietnam
    c: 'Saigon. The Constituent Assembly validates the election of Thiệu and Kỳ shortly before midnight, 58–43, five ballots invalid. Sept. 28, four members of the Democratic Alliance Bloc on its Special Election Committee had sent Bunker their price for voting validation: Kỳ to name the Prime Minister and three ministers, and 300,000 piasters for each member of the Bloc. Bunker had it passed to Kỳ and warned he would make it public.'
    n: 'FRUS 1964–68, V, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v05/d342) (Bunker''s weekly telegram, Oct. 4). Made public: [[w.bunker-papers]], 185–195. See [[cal.1967-09-03.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:bunker-ellsworth]
  - id: cal.1967-10-03.economy
    when: Oct. 3–5
    date: '1967-10-03'
    thread: economy
    c: 'Ways and Means sets the surcharge aside, 20–5 (Check), until the President and Congress agree on cuts in spending; Mills. Sept. 27, the House had sent a continuing resolution back to committee, [202–182](https://voteview.com/rollcall/RH0900145); Oct. 3, the rule for another ordered by [213–205](https://voteview.com/rollcall/RH0900151). Oct. 5, Johnson signs it, [81 Stat. 256](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg256.pdf), funds to Oct. 23, and holds a news conference: a $5 billion cut in fiscal 1968 spending would mean appropriations cut by up to $10 billion; let the House name the cuts, bill by bill; "the cruelest tax of all is the inflation tax."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1197) (Oct. 5, 1967). [113 Cong. Rec., House, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-2.pdf). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1967-01-10.economy]]. Names: Mills, Johnson.'
    tags: [name:mills-wilbur-d, name:johnson-lyndon-b]
  - id: cal.1967-10-03.mayors-cleveland
    when: Oct. 3
    date: '1967-10-03'
    thread: mayors
    also: [elections-1967]
    c: Cleveland's Democratic primary for mayor. Carl Stokes, a State representative, 110,769, 53.7 percent, over Mayor Locher, 92,033, 44.6; a third 1.7.
    n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.nelson-electing-black-mayors]]; [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]. See [[cal.1965-11-02.mayors-cleveland]]. Names: Stokes, Locher.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:locher-ralph-s]
  - id: cal.1967-10-06.vietnam
    when: Oct. 6–24
    date: '1967-10-06'
    thread: vietnam
    c: 'Pennsylvania. Oct. 6, a note for Bộ through Kissinger and Marcovich: the United States understands that upon the cessation of all bombardment of the North, "without expression of condition," the North would enter promptly into productive discussions; if so, it will give the date the bombing would stop and suggest a date and a place for talks. Bộ''s answer, Oct. 17: while the United States escalates, Hanoi can neither receive Kissinger nor comment; talks only when the bombing has ended without condition. Oct. 18, Johnson with Kissinger, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor and Clifford: the answer a rejection. Oct. 20, in Paris, Kissinger to Marcovich and Aubrac: Washington has nothing more to say. Oct. 23, Johnson tells the congressional leaders; strikes on the Phúc Yên airfield, authorized Sept. 28 and cancelled, authorized again.'
    n: 'FRUS 1964–68, V, docs. [349](https://history.state.gov/historicaldocuments/frus1964-68v05/d349), [357](https://history.state.gov/historicaldocuments/frus1964-68v05/d357), [358](https://history.state.gov/historicaldocuments/frus1964-68v05/d358), [360](https://history.state.gov/historicaldocuments/frus1964-68v05/d360), [362](https://history.state.gov/historicaldocuments/frus1964-68v05/d362), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363), [364](https://history.state.gov/historicaldocuments/frus1964-68v05/d364); [312](https://history.state.gov/historicaldocuments/frus1964-68v05/d312) (Phúc Yên). Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-21.vietnam]]. Names: Mai Văn Bộ, Kissinger, Marcovich, Aubrac, Johnson, Rusk, McNamara, Katzenbach, Rostow, Fortas, Taylor, Clifford.'
    tags: [name:mai-van-bo, name:kissinger-henry-a, name:marcovich-hebert, name:aubrac-raymond, name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:katzenbach-nicholas, name:rostow-walt-w, name:fortas-abe, name:taylor-maxwell, name:clifford-clark]
  - id: cal.1967-10-09.latin-america
    when: Oct. 9
    date: '1967-10-09'
    thread: latin-america
    also: [cuba]
    c: 'Bolivia. Che Guevara, captured Oct. 8 by the Bolivian army''s Second Ranger Battalion, trained by Americans, is shot at La Higuera, 1:15 p.m., on orders from army headquarters at La Paz. Oct. 10, the army: dead of wounds received in battle. Rostow to Johnson, Oct. 11: "I regard this as stupid, but it is understandable from a Bolivian standpoint."'
    n: 'FRUS 1964–68, XXXI, docs. [171](https://history.state.gov/historicaldocuments/frus1964-68v31/d171), [172](https://history.state.gov/historicaldocuments/frus1964-68v31/d172), [173](https://history.state.gov/historicaldocuments/frus1964-68v31/d173). Made public: FRUS 1964–68, XXXI (2004) (Check). [[w.anderson-che-guevara]]; [[w.rabe-killing-zone]]. Names: Guevara, Rostow, Johnson.'
    tags: [name:guevara-ernesto, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1967-10-10.space
    when: Oct. 10
    date: '1967-10-10'
    thread: space
    also: [soviet-union]
    c: 'The Outer Space Treaty, [18 U.S.T. 2410](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-18-3/lltreaties-18-3.pdf#page=94), [610 U.N.T.S. 205](https://treaties.un.org/doc/Publication/UNTS/Volume%20610/volume-610-I-8843-English.pdf), in force, the ratifications of the United States, Britain and the Soviet Union deposited in Washington, London and Moscow; proclaimed the same day. Johnson, in the East Room, with Rusk, Dobrynin and the British ambassador: "the intention of 84 nations" that the exploration of space remain peaceful; no weapons of mass destruction in orbit, no bases on the moon, no weapons tested in space.'
    n: '[Remarks at Ceremony Marking the Entry Into Force of the Outer Space Treaty](https://www.presidency.ucsb.edu/documents/remarks-ceremony-marking-the-entry-into-force-the-outer-space-treaty) (Oct. 10, 1967). See [[cal.1967-01-27.space]]. Names: Johnson, Rusk, Dobrynin.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly]
  - id: cal.1967-10-12.vietnam
    when: Oct. 12
    date: '1967-10-12'
    thread: vietnam
    also: [india-and-china]
    c: 'Rusk, at a news conference: Vietnam vital to the security of the United States; within a decade or two, "a billion Chinese on the mainland, armed with nuclear weapons," their attitude toward the rest of Asia uncertain (Check the words). McCarthy, Oct. 16: Rusk raising a "yellow peril."'
    n: '[*New York Times*, Oct. 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/13/issue.html); [Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html). FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.schoenbaum-waging-war-and-peace]]; [[w.rusk-as-i-saw-it-1990]]. Names: Rusk, McCarthy.'
    tags: [name:rusk-dean, name:mccarthy-eugene-j]
  - id: cal.1967-10-13.women
    when: Oct. 13
    date: '1967-10-13'
    thread: women
    c: 'Executive Order 11375: "sex" written into Executive Order 11246. Equal opportunity without discrimination because of sex in federal employment, in 30 days, and by federal contractors and subcontractors, in a year; the Civil Service Commission to hear complaints in federal employment.'
    n: '[Executive Order 11375](https://www.presidency.ucsb.edu/documents/executive-order-11375-amending-executive-order-no-11246-relating-equal-employment), [32 Fed. Reg. 14303](https://www.govinfo.gov/content/pkg/FR-1967-10-17/pdf/FR-1967-10-17.pdf#page=5) (Oct. 17, 1967). [[w.harrison-on-account-of-sex]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-10-16.war-opposition
    when: Oct. 16–20
    date: '1967-10-16'
    thread: war-opposition
    also: [draft, students]
    c: 'Stop the Draft Week. Oct. 16, the Resistance''s day: draft cards turned in at rallies in some eighteen cities, Boston''s Arlington Street Church among them. Oakland: a sit-in at the induction center, Oct. 16, over a hundred arrested; the police clear the street with clubs, Oct. 17; some 10,000 hold the streets around the center, Oct. 20. Washington, Oct. 20: Coffin and Spock among those who bring the cards collected, some 990, to the Justice Department; not accepted. Check the counts.'
    n: '[*New York Times*, Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html); [Oct. 18, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/18/issue.html); [Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). FRUS 1964–68, V, docs. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.ferber-resistance]]; [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Coffin, Spock.'
    tags: [name:coffin-william-sloane-jr, name:spock-benjamin, state:ca, city:oakland, state:ma, city:boston, state:dc, city:washington]
  - id: cal.1967-10-18.students
    when: Oct. 18
    date: '1967-10-18'
    thread: students
    also: [war-opposition]
    c: Madison. Students sit in at the University of Wisconsin's Commerce Building against the recruiters of Dow Chemical, maker of napalm; the city's police, called in, clear it with clubs and tear gas; some seventy hurt (Check).
    n: '[*New York Times*, Oct. 19, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/19/issue.html). [[w.maraniss-they-marched-into-sunlight]].'
    tags: [state:wi, city:madison]
  - id: cal.1967-10-18.economy
    when: Oct. 18–25
    date: '1967-10-18'
    thread: economy
    also: [congress]
    c: 'Continuing resolution, H.J. Res. 888. House, Oct. 18: an amendment holding fiscal 1968 spending to fiscal 1967''s, Vietnam, the Post Office and some programs for persons excepted, [238–164](https://voteview.com/rollcall/RH0900166) (Check the exceptions); passed, [254–143](https://voteview.com/rollcall/RH0900168). Senate, Oct. 25: a ceiling of $131.5 billion on fiscal 1968 spending refused, [39–48](https://voteview.com/rollcall/RS0900230); 5 percent off each nonmilitary item, refused, [43–46](https://voteview.com/rollcall/RS0900231); all but the funds to Nov. 15 struck, [50–34](https://voteview.com/rollcall/RS0900233); passed, [59–26](https://voteview.com/rollcall/RS0900234).'
    n: '[113 Cong. Rec., House, Oct. 18, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-1-2.pdf); [113 Cong. Rec., Senate, Oct. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-6-2.pdf). [[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-10-03.economy]].'
  - id: cal.1967-10-20.mississippi
    when: Oct. 20
    date: '1967-10-20'
    thread: mississippi
    c: 'Meridian. *United States v. Price*: the jury convicts seven of conspiring against the rights of Chaney, Goodman and Schwerner, Deputy Price, Bowers, the White Knights'' Imperial Wizard, and Alton Wayne Roberts among them. Eight acquitted, Sheriff Rainey among them; no verdict on three, Killen among them. Judge Cox had sent the jury back with an *Allen* charge when it reported itself deadlocked.'
    n: '[*New York Times*, Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). [[w.ball-murder-in-mississippi]]; [[w.cagin-we-are-not-afraid]]; [[w.mars-witness-in-philadelphia]]. See [[cal.1964-12-04.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Bowers, Roberts, Rainey, Killen, Cox.'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r, name:bowers-sam, name:roberts-alton-wayne, name:rainey-lawrence-a, name:killen-edgar-ray, name:cox-w-harold]
  - id: cal.1967-10-21.war-opposition
    when: Oct. 21–23
    date: '1967-10-21'
    thread: war-opposition
    c: 'The March on the Pentagon, called by the National Mobilization Committee, Dellinger its chairman. A rally at the Lincoln Memorial, Spock among the speakers; some 30,000 to 35,000 go on to the Pentagon, many to stay the night; soldiers and marshals hold the building. Mailer among those arrested; 208 arrests by the *Times* of Oct. 23 (Check the final count). Johnson to McNamara and Ramsey Clark, Oct. 23: the troops and police acted "with restraint, firmness and professional skill."'
    n: '[Memorandum Following the Peace Demonstrations at the Lincoln Memorial and the Pentagon](https://www.presidency.ucsb.edu/documents/memorandum-following-the-peace-demonstrations-the-lincoln-memorial-and-the-pentagon) (Oct. 23, 1967). FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.mailer-armies-of-the-night]]; [[w.debenedetti-american-ordeal]]; [[w.small-antiwarriors]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. Names: Dellinger, Spock, Mailer, Johnson, McNamara, Clark.'
    tags: [name:dellinger-david, name:spock-benjamin, name:mailer-norman, name:johnson-lyndon-b, name:mcnamara-robert-s, name:clark-ramsey, state:dc, city:washington]
  - id: cal.1967-10-21.middle-east
    when: Oct. 21–24
    date: '1967-10-21'
    thread: middle-east
    also: [soviet-union]
    c: 'Egyptian missile boats sink the Israeli destroyer *Eilat* off Port Said, Oct. 21; Israel''s guns fire the refineries at Suez, Oct. 24 (Check). Kosygin to Johnson, a letter of Oct. 20 that Dobrynin delivers Oct. 21: no progress toward a political settlement; Israel still holds the Arab lands. Johnson answers Oct. 23; Dobrynin, Oct. 24, proposes confidential consultations.'
    n: 'FRUS 1964–68, XIX, docs. [480](https://history.state.gov/historicaldocuments/frus1964-68v19/d480), [483](https://history.state.gov/historicaldocuments/frus1964-68v19/d483), [484](https://history.state.gov/historicaldocuments/frus1964-68v19/d484). [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-06-05.middle-east]]. Names: Kosygin, Dobrynin, Johnson.'
    tags: [name:kosygin-aleksei, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1967-10-23.antisubversion
    when: Oct. 23
    date: '1967-10-23'
    thread: antisubversion
    also: [court]
    c: 'Senate passes S. 2171, [65–10](https://voteview.com/rollcall/RS0900229): the Subversive Activities Control Board kept, its power to order members of Communist organizations to register taken away, after *Albertson*. A section ending the Board June 30, 1969, on a finding of the Attorney General, [74–2](https://voteview.com/rollcall/RS0900227) (Check its terms); its end Jan. 1, 1968, refused, [17–58](https://voteview.com/rollcall/RS0900228).'
    n: '[113 Cong. Rec., Senate, Oct. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-4-2.pdf). [[w.goldstein-political-repression-in-modern]]. See [[cal.1965-11-15.court]].'
  - id: cal.1967-10-24.cities-and-housing
    when: Oct. 24–26
    date: '1967-10-24'
    thread: cities-and-housing
    c: 'House, the conference on the Independent Offices and HUD appropriation. Oct. 24: the House insists against the Senate''s $40 million for rent supplements, [151–251](https://voteview.com/rollcall/RH0900177) against receding, and against its amendment adding $50 million (Check the item), [156–241](https://voteview.com/rollcall/RH0900176). Oct. 26: a motion to send the report back, to insist again against rent supplements, lost, [184–198](https://voteview.com/rollcall/RH0900182); the report adopted, [297–88](https://voteview.com/rollcall/RH0900183).'
    n: '[113 Cong. Rec., House, Oct. 24, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-5-2.pdf); [113 Cong. Rec., House, Oct. 26, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-7-2.pdf). See [[cal.1967-09-19.cities-and-housing]].'
  - id: cal.1967-10-25.vietnam
    when: Oct. 25
    date: '1967-10-25'
    thread: vietnam
    also: [congress]
    c: 'Senate. Mansfield, with 54 cosponsors, offers S. Res. 180: the President to consider bringing the American resolution of Jan. 31, 1966, or another of equal purpose, before the Security Council. Oct. 10, the Senate had added to the State, Justice and Commerce appropriation the sense of Congress that the United States seek economic sanctions against North Vietnam in the UN, as against Rhodesia, [74–15](https://voteview.com/rollcall/RS0900224).'
    n: '[113 Cong. Rec., Senate, Oct. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-6-2.pdf); [113 Cong. Rec., Senate, Oct. 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-5-1.pdf). FRUS 1964–68, V, doc. [373](https://history.state.gov/historicaldocuments/frus1964-68v05/d373). [[w.gibbons-u-s-government-and-1995]]. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1967-10-26.latin-america
    when: Oct. 26–28
    date: '1967-10-26'
    thread: latin-america
    c: 'Díaz Ordaz at the White House, Oct. 26–27. Oct. 28, at 12:01 a.m., the boundary changes at El Paso and Ciudad Juárez: El Chamizal returned to Mexico under the convention of Aug. 29, 1963. Johnson and Díaz Ordaz proclaim it at the monument on the Mexican side and dedicate three bridges. Johnson the same day to the Mexican-American conference at El Paso.'
    n: '[Joint Statement Following Discussions With President Diaz Ordaz of Mexico](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-diaz-ordaz-mexico-0) (Oct. 27, 1967); [Text of the Chamizal Declaration](https://www.presidency.ucsb.edu/documents/text-the-chamizal-declaration-recognizing-the-transfer-lands-between-the-united-states-and) (Oct. 28, 1967); [Remarks at the Chamizal Ceremony, Juarez, Mexico](https://www.presidency.ucsb.edu/documents/remarks-the-chamizal-ceremony-juarez-mexico) (Oct. 28, 1967); [Remarks to the Delegates to the Mexican-American Conference, El Paso, Texas](https://www.presidency.ucsb.edu/documents/remarks-the-delegates-the-mexican-american-conference-el-paso-texas) (Oct. 28, 1967). [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1963-07-18.latin-america]]. Names: Díaz Ordaz, Johnson.'
    tags: [name:diaz-ordaz-gustavo, name:johnson-lyndon-b, state:tx, city:el-paso]
  - id: cal.1967-10-30.king
    when: Oct. 30
    date: '1967-10-30'
    thread: king
    also: [alabama]
    c: Birmingham. King and Abernathy, with others of the petitioners, go to jail to serve the five days for contempt of the injunction of Apr. 10, 1963, upheld in *Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (Check who went with them, and the day of release).
    n: '[*New York Times*, Oct. 31, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/31/issue.html). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1963-04-12.alabama]]. Names: King, Abernathy.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david, state:al, city:birmingham]
  - id: cal.1967-10-31.consumers
    when: Oct. 31
    date: '1967-10-31'
    thread: consumers
    also: [farm]
    c: 'House passes the meat inspection bill, H.R. 12144, [402–1](https://voteview.com/rollcall/RH0900189): federal money and personnel offered to the States that bring their inspection of meat sold within a State up to federal standards; the federal statutes recast in one act.'
    n: '[113 Cong. Rec., House, Oct. 31, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt22/pdf/GPO-CRECB-1967-pt22-10-1.pdf). [[w.nadel-politics-of-consumer-protection]].'
  - id: cal.1967-10-31.vietnam
    when: Oct. 31
    date: '1967-10-31'
    thread: vietnam
    c: Saigon. Thiệu inaugurated President, Kỳ Vice President; Humphrey heads the American delegation, in Vietnam Oct. 29–Nov. 1. The Lower House elected Oct. 22. Thiệu had agreed, at Bunker's asking, to speak in his inaugural address only in general terms of a peaceful settlement and of his willingness to meet with Hanoi.
    n: 'FRUS 1964–68, V, docs. [356](https://history.state.gov/historicaldocuments/frus1964-68v05/d356), [361](https://history.state.gov/historicaldocuments/frus1964-68v05/d361), [366](https://history.state.gov/historicaldocuments/frus1964-68v05/d366), [367](https://history.state.gov/historicaldocuments/frus1964-68v05/d367). See [[cal.1967-09-03.vietnam]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Humphrey, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:humphrey-hubert-h, name:bunker-ellsworth]
  - id: cal.1967-10.open-housing-mi
    when: Oct.–Dec.
    date: 1967-10
    thread: open-housing
