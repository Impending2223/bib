  - id: cal.1968-05-05.vietnam-may-offensive-12
    when: May 5
    date: '1968-05-05'
    place: tan-uyen
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Tân Uyên and Lái Thiêu, Bình Dương. The province forces with Regiment 12 of the 7th Division open a round of action west of Route 16 and by the history's count put hundreds out of action. Tân Uyên district troops and the Bình Mỹ guerrillas break a sweep by an American battalion at Bàu Đồng Tràm and by the history's count put nearly 100 out of action.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 194–95. Check: the day of the Bàu Đồng Tràm fight; the history gives none. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn]
