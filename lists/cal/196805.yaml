    when: May 5
    date: '1968-05-05'
    place: hue
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Huế, Quảng Trị town, 8 district towns, 12 bases. At dawn infantry, artillery and sappers attack together the targets around Huế and Quảng Trị and the district seats and bases of Trị–Thiên.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 214–15. Check: the clock, whose it is.'
