    c: 'Aboard the plane from Los Angeles to Portland, late on the day of Oregon''s primary, as the polls close; Kennedy, Goodwin, staff and family.{1} Reports radioed to the plane: defeat almost certain.{2} The cabin falls silent. Kennedy, near Goodwin: "We frightened them."{3}'
