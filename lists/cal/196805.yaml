    c: 'Mao, Peking: reads Yao Wenyuan''s Xinhua report on the Peking Xinhua Printing Works'' military control committee''s way of dealing with enemies in the plant, and proposes it for all China: read it to the Group, revise, add a comment.{1} "Best of its kind I have seen."{2}'
