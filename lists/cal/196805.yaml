    n: 'Letter to the Speaker of the House Urging Immediate Action on the Tax Surcharge, [1968–69 Pub. Papers 565](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=643) (May 4, 1968). See [[cal.1968-03-26.economy]]; [[cal.1967-11-29.economy]]; [[cal.1967-01-10.economy]]. Names: McCormack, Johnson.'
