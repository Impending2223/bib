  - id: cal.1968-05-03.vietnam
    when: May 3
    date: '1968-05-03'
    time: 1968-05-03T05:00Z
    thread: vietnam-paris
    also: [economy-surcharge]
    c: 'Word from Hanoi, received at 1 a.m.: it will meet in Paris on May 10 or several days after.{1} Johnson to Rostow by telephone: "I''d rather go to almost any place than Paris."{2} Morning news conference: Paris and May 10 accepted, after consulting Rusk, Clifford, Goldberg, Ball, Harriman and Vance;{3} "only the very first step."{4} A tax bill "without any ''ands,'' ''buts,'' or ''ors''";{5} cuts as each appropriation bill comes up: "stand up like men and answer the roll call."{6}'
