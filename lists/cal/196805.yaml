section: CIII
entries:
  - id: cal.1968-05-01.states-and-cities-cleveland
    when: May 1
    date: '1968-05-01'
    thread: states-and-cities
    also: [poverty]
    c: 'Cleveland. Stokes, on television, announces Cleveland: Now!, public and private money for jobs, housing, health, youth and the downtown: $1.5 billion in ten years, $177 million in the first two (Check). After Glenville, word that money from it had reached Ahmed Evans''s group stops the gifts.'
    n: '[*Encyclopedia of Cleveland History*, "Cleveland: Now!"](https://case.edu/ech/articles/c/cleveland-now). To check: [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]; [[w.stokes-promises-of-power]]; [[w.masotti-shoot-out-in-cleveland]]. See [[cal.1967-11-07.mayors-cleveland]]. Glenville: [[cal.1968-07-23.civil-disorders]]. Names: Stokes, Evans.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b, name:evans-fred]
  - id: cal.1968-05-01.opinion
    when: May 1
    date: '1968-05-01'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 4–9: describing oneself, hawk 41 percent, dove 41. Men 50 and 33; women 32 and 49; East 34 and 48. The United States made a mistake in sending troops: yes 48, no 40.'
    n: '[[w.gallup-poll]], III, 2124–25.'
  - id: cal.1968-05-03.vietnam
    when: May 3
    date: '1968-05-03'
    thread: vietnam-paris
    c: 'Word from Hanoi, received at 1 a.m.: it will meet in Paris on May 10 or several days after. Johnson to Rostow by telephone: "I''d rather go to almost any place than Paris." Morning news conference: Paris and May 10 accepted, after consulting Rusk, Clifford, Goldberg, Ball, Harriman and Vance; "only the very first step."'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=634) (May 3, 1968). FRUS 1964–68, VI, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v06/d221). [Johnson and Rostow, 1 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walt-rostow-may-3-1968), Conversation WH6805-01-13004 (Miller Center). See [[cal.1968-03-31.elections-1968]]. Names: Rostow, Rusk, Clifford, Goldberg, Ball, Harriman, Vance, Johnson.'
    tags: [name:johnson-lyndon-b, name:rostow-walt-w, name:rusk-dean, name:clifford-clark, name:goldberg-arthur-j, name:ball-george-w, name:harriman-w-averell, name:vance-cyrus]
  - id: cal.1968-05-03.vietnam-order-of-battle
    when: May 3
    date: '1968-05-03'
    thread: vietnam-order-of-battle
    c: 'Helms and Wheeler, with Carroll of DIA and Walsh of the CIA, on the estimates of enemy strength. Back to the drawing board: the CIA and DIA to work out new formats and definitions; Helms to withhold the CIA''s figures meanwhile; Wheeler to cut MACV''s order-of-battle reporting.'
    n: 'FRUS 1964–68, VI, doc. [220](https://history.state.gov/historicaldocuments/frus1964-68v06/d220), 10:30 a.m. Made public: FRUS 1964–68, VI (2002). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Helms, Wheeler, Carroll, Walsh.'
    tags: [name:helms-richard, name:wheeler-earle, name:carroll-joseph-f, name:walsh-paul-v]
  - id: cal.1968-05-04.governors-nc
    when: May 4
    date: '1968-05-04'
    thread: governors
    also: [elections-1968]
    c: 'North Carolina''s primaries for governor, Moore barred from a second term. Democratic: Lieutenant Governor Robert Scott 337,368, 48.1 percent; J. Melville Broughton Jr., the party''s State chairman and son of the governor of 1941–45, 233,924, 33.4; Reginald Hawkins, a Negro dentist and civil rights leader of Charlotte, 129,808, 18.5. Broughton does not call a runoff. Republican: U.S. Representative Jim Gardner 113,584, 72.8 percent. Nov. 5, Scott over Gardner, 52.7 percent.'
    n: '[N.C. *Manual*, 1969, 291](https://archive.org/details/northcarolinama1969nort/page/n306); Wikipedia, ["1968 North Carolina gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Carolina_gubernatorial_election). Check: that Broughton declined the runoff. To check: [[w.luebke-tar-heel-politics]]; [[w.bass-transformation-of-southern-politics-1976]]. Names: Moore, Scott, Broughton, Hawkins, Gardner.'
    tags: [state:nc, city:charlotte, name:moore-dan-k, name:scott-robert-w, name:broughton-j-melville-jr, name:hawkins-reginald-a, name:gardner-james-c]
  - id: cal.1968-05-04.governors-tx
    when: May 4
    date: '1968-05-04'
    thread: governors
    also: [elections-1968]
    c: 'Texas Democratic primary for governor, Connally not running: ten candidates. Don Yarborough, a Houston lawyer, 421,607, 24.1 percent; Lieutenant Governor Preston Smith 386,875, 22.1; Waggoner Carr, attorney general 1961–67, 14.7; Dolph Briscoe, a rancher of Uvalde, Tex., 12.9; Eugene Locke, deputy ambassador at Saigon 1967–68, 12.5; John Hill, secretary of state, 8.8. Runoff between Yarborough and Smith. Republican: Paul Eggers 62.5.'
    n: 'Votes: [Wikipedia, "1968 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election), from the *Texas Almanac*; [*Texas Observer*, May 10, 1968](https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_05_10_issue.pdf). Check: the State Democratic Executive Committee''s canvass. To check: [[w.davidson-race-and-class-in]]; [[w.knaggs-two-party-texas]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1967-11-10.governors-tx]]. Names: Connally, Yarborough, Smith, Carr, Briscoe, Locke, Hill, Eggers.'
    tags: [state:tx, name:connally-john, name:yarborough-don, name:smith-preston, name:carr-waggoner, name:briscoe-dolph-jr, name:locke-eugene-m, name:hill-john-l-jr, name:eggers-paul-w]
  - id: cal.1968-05-05.economy
    when: May 5
    date: '1968-05-05'
    thread: economy-surcharge
    also: [congress]
    c: 'Johnson to McCormack, released: the surcharge, "about a penny on the dollar"; delay "a ticket to disaster." He does not urge cuts in the $186 billion January budget, but "would reluctantly accept some reductions if they are realistic and reasonable."'
    n: 'Letter to the Speaker of the House Urging Immediate Action on the Tax Surcharge, [1968–69 Pub. Papers 565](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=643) (May 4, 1968). See [[cal.1968-03-26.economy]]; [[cal.1967-11-29.economy]]; [[cal.1967-01-10.economy]]. Names: McCormack, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w]
  - id: cal.1968-05-05.vietnam
    when: May 5
    date: '1968-05-05'
    thread: vietnam-may-offensive
    c: 'The second offensive: rockets, mortars and ground attacks, from midnight May 4–5, on Saigon, airfields and Kon Tum, some 119 places (Check). Fighting in Saigon''s outskirts and Cholon for a week. Wheeler to Johnson, May 4: "Hit 18 places"; Rusk: "pretty heavy fighting as we move into talks."'
    n: 'FRUS 1964–68, VI, doc. [222](https://history.state.gov/historicaldocuments/frus1964-68v06/d222). [[w.vietnam-victory-in-vietnam]], 227–28 (artillery on eight targets in Saigon at 3:10 a.m., May 5; the 9th Division''s attack shifted to the southwest); [[w.cosmas-joint-chiefs-of-staff]], 206–207. To check: [[w.spector-after-tet]]; [[w.nolan-house-to-house]]; [[w.schmitz-tet-offensive]]; [[w.sorley-better-war]]. See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Rusk, Johnson.'
    tags: [name:wheeler-earle, name:rusk-dean, name:johnson-lyndon-b, place:saigon, place:cholon, place:kontum]
  - id: cal.1968-05-07.elections-1968
    when: May 7
    date: '1968-05-07'
    thread: elections-1968
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Nixon-Rockefeller in the District; Nixon in Indiana; Rhodes in Ohio. Democratic: Kennedy in the District and Indiana; Young in Ohio.'
    n: 'CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: Rhodes, Nixon, Kennedy, Rockefeller, Young.'
    tags: [primary:1968-05-07, name:rhodes-james-a, name:nixon-richard-m, name:kennedy-robert-f, name:young-stephen-m, name:rockefeller-nelson]
  - id: cal.1968-05-07.elections-1968-2
    when: May 7
    date: '1968-05-07'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'Indiana, Kennedy''s first primary: Kennedy first; Branigin, the Governor, a favorite son pledged to Johnson''s cause, second (Check); McCarthy third. In the District, Kennedy''s slate over Humphrey''s.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 880–83. See [[cal.1968-05-07.elections-1968]]; [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Branigin, McCarthy, Johnson, Humphrey.'
    tags: [name:kennedy-robert-f, name:branigin-roger-d, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:humphrey-hubert-h, state:in]
  - id: cal.1968-05-07.alabama-al
    when: May 7
    date: '1968-05-07'
    thread: alabama
    also: [governors]
    c: 'Montgomery. Lurleen Wallace dies of cancer, 41, sixteen months in office. Lieutenant Governor Albert Brewer, 39, governor: the first lieutenant governor to succeed under the constitution of 1901. State offices and the schools closed for her funeral, May 9. George Wallace campaigning for President since February.'
    n: '[Encyclopedia of Alabama, "Lurleen B. Wallace (1967–68)"](https://encyclopediaofalabama.org/article/lurleen-b-wallace-1967-68/); ["Albert P. Brewer (1968–71)"](https://encyclopediaofalabama.org/article/albert-p-brewer-1968-71/). Check: the *Alabama Official and Statistical Register*, 1971, and the hour Brewer took the oath. To check: [[w.alabama-governors]]; [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1967-01-16.alabama-al]]. Names: Lurleen Wallace, Brewer, George Wallace.'
    tags: [state:al, name:wallace-lurleen-b, name:brewer-albert-p, name:wallace-george-c]
  - id: cal.1968-05-09.crime-and-hijacking
    when: May 9
    date: '1968-05-09'
    thread: crime-and-hijacking-safe-streets
    also: [court]
    c: 'The Senate on S. 917, the Safe Streets and Crime Control bill. Johnson to Mansfield, released: Title I, the grants to local law enforcement, the heart of it; Title IV keeps handguns from "the dangerous and the deranged" but not the rifle.'
    n: 'Letter to the Majority Leader of the Senate on the Crime Control and Safe Streets Bill, [1968–69 Pub. Papers 585](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=663) (May 8, 1968). To check: [[w.harris-fear-of-crime]]; [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1967-02-06.crime-and-hijacking]]. Names: Mansfield, Johnson.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike]
  - id: cal.1968-05-09.states-and-cities-nyc
    when: May 9
    date: '1968-05-09'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: New York City. Ocean Hill–Brownsville's governing board, on its personnel committee's recommendation, ends the employment in the district of thirteen teachers and six administrators, most of Junior High School 271, May 9. The Board of Education tells them to ignore the notices; parents block the doors; 350 of the union's teachers walk out of the district's schools.
    n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike); [Chalkbeat, May 10, 2018](https://www.chalkbeat.org/newyork/2018/5/10/21105025/fifty-years-ago-teacher-oustings-that-led-to-new-york-city-s-massive-teacher-strikes/). To check: [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.kahlenberg-tough-liberal]]; [[w.cannato-ungovernable-city]]. See [[cal.1967-07.states-and-cities-nyc]]; [[cal.1967-11-09.states-and-cities-nyc]]. Names: McCoy, Shanker.'
    tags: [state:ny, city:nyc, name:mccoy-rhody-a, name:shanker-albert]
  - id: cal.1968-05-10.vietnam-operations
    when: May 10
    date: '1968-05-10'
    thread: vietnam-operations
    c: Khâm Đức. The 2d North Vietnamese Division's assault on Ngok Tavak, the smaller camp seven kilometers southwest of the Special Forces camp at Khâm Đức, Quảng Tín; its defenders abandon it. The Americal Division sends reinforcements to Khâm Đức (Golden Valley).
    n: '[[w.villard-united-states-army-in]], 539–543; [[w.cosmas-joint-chiefs-of-staff]], 208. To check: [[w.mcleroy-bait]].'
    tags: [place:kham-duc]
  - id: cal.1968-05-12.king
    when: May 12
    date: '1968-05-12'
    thread: king-poor-peoples
    also: [poverty]
    c: 'The Poor People''s Campaign in Washington. Mother''s Day: Coretta King leads a march of welfare mothers (Check).'
    n: 'To check: [[w.fager-uncertain-resurrection]]; [[w.mcknight-last-crusade]]; [[w.mantler-power-to-the-poor]]; [[w.abernathy-and-the-walls-came]]; [[w.young-easy-burden]]; [[w.jackson-from-civil-rights-to]]. See [[cal.1968-04-29.king]]; [[cal.1968-04-04.king]]. Names: Coretta King.'
    tags: [name:king-coretta-scott, city:washington]
  - id: cal.1968-05-12.opinion
    when: May 12
    date: '1968-05-12'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, May 2–7, with Wallace as a third party''s candidate: Nixon 39 percent, Humphrey 36, Wallace 14. Rockefeller 40, Humphrey 33, Wallace 16. Nixon 42, Robert Kennedy 32, Wallace 15. Rockefeller 42, Kennedy 28, Wallace 18. Nixon 39, McCarthy 37, Wallace 14. Rockefeller 40, McCarthy 31, Wallace 17.'
    n: '[[w.gallup-poll]], III, 2126. Names: Nixon, Humphrey, Wallace, Rockefeller, Kennedy, McCarthy.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:rockefeller-nelson, name:kennedy-robert-f, name:mccarthy-eugene-j]
  - id: cal.1968-05-12.vietnam-operations
    when: May 12
    date: '1968-05-12'
    thread: vietnam-operations
    c: 'Khâm Đức evacuated under fire. At 2:30 a.m. the North Vietnamese overrun three of its five hilltop observation posts; the evacuation by Army and Marine helicopters and Air Force transports from about 8 a.m. Lost: 6 helicopters, 2 C-130s, an O-2 and an A-1E. Allied losses 25 killed, 120 wounded, 13 missing.'
    n: 'Remarks Upon Presenting the Medal of Honor to a Member of Each of the Armed Services, [1968–69 Pub. Papers 1329](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=639) (Jan. 16, 1969). [[w.villard-united-states-army-in]], 544–547. To check: [[w.gropman-airpower-and-the-airlift]]. See [[cal.1968-05-10.vietnam-operations]].'
    tags: [place:kham-duc]
  - id: cal.1968-05-13.king-poor-peoples
    when: May 13
    date: '1968-05-13'
    thread: king-poor-peoples
    also: [poverty]
    c: Washington. In West Potomac Park, by the Reflecting Pool, Abernathy drives the first stake of Resurrection City, plywood shelters for some 3,000 under a Park Service permit (Check the numbers and the permit's term).
    n: 'See [[cal.1968-05-12.king]]. Names: Abernathy.'
    tags: [name:abernathy-ralph-david, city:washington]
  - id: cal.1968-05-13.vietnam
    when: May 13
    date: '1968-05-13'
    thread: vietnam-paris
    c: 'Paris, the Hotel Majestic, 10:30 a.m.: the first session of the official conversations. Harriman and Vance for the United States; Xuân Thủy, a minister, for the Democratic Republic. Procedural meetings had gone two days, Vance with Hà Văn Lâu. Thủy: the talks are to end the bombing and all other acts of war against the North; other questions after. Harriman: the aim is the South Vietnamese people''s right to determine their own future "without outside interference or coercion"; Hanoi''s attacks since Mar. 31. Sessions follow weekly (Check).'
    n: 'FRUS 1964–68, VI, docs. [230](https://history.state.gov/historicaldocuments/frus1964-68v06/d230), [234](https://history.state.gov/historicaldocuments/frus1964-68v06/d234), [254](https://history.state.gov/historicaldocuments/frus1964-68v06/d254). [[w.cosmas-joint-chiefs-of-staff]], 182. To check: [[w.herring-secret-diplomacy-of-the]]; [[w.goodman-lost-peace]]; [[w.thies-when-governments-collide]]; [[w.abramson-spanning-the-century]]; [[w.clifford-counsel-to-the-president-2]]; [[w.johnson-vantage-point]]; [[w.schandler-unmaking-of-a-president]]; [[w.nguyen-hanois-war]]; [[w.asselin-vietnams-american-war]]. See [[cal.1968-05-03.vietnam]]. Names: Harriman, Vance, Xuân Thủy, Hà Văn Lâu.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:xuan-thuy, name:ha-van-lau]
  - id: cal.1968-05-14.economy-surcharge
    when: May 14
    date: '1968-05-14'
    thread: economy-surcharge
    c: 'The Tuesday lunch. Johnson on the conference report on taxes: "Labor is completely against it."'
    n: 'FRUS 1964–68, VI, doc. [232](https://history.state.gov/historicaldocuments/frus1964-68v06/d232). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-26.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-05-14.crime-and-hijacking-safe-streets
    when: May 14
    date: '1968-05-14'
    thread: crime-and-hijacking-safe-streets
    c: 'Senate, S. 917: Senate confirmation for Hoover''s successors as Director of the FBI, [72–0](https://voteview.com/rollcall/RS0900412).'
    n: 'See [[cal.1968-05-09.crime-and-hijacking]]. Names: Hoover.'
    tags: [name:hoover-j-edgar]
  - id: cal.1968-05-14.elections-1968
    when: May 14
    date: '1968-05-14'
    thread: elections-1968
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: Kennedy in Nebraska; unpledged delegates in West Virginia.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1968*, 3, 18](https://govdocs.nebraska.gov/epubs/S1200/S001-1968prim_gen.pdf#page=4); [*West Virginia Blue Book, 1968*, 824, 853](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1968.pdf#page=832). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: Nixon, Kennedy.'
    tags: [primary:1968-05-14, name:nixon-richard-m, name:kennedy-robert-f]
  - id: cal.1968-05-14.state-constitutions-md
    when: May 14
    date: '1968-05-14'
    thread: state-constitutions
    also: [elections-1968]
    c: Maryland's voters reject the convention's constitution, 367,101 to 284,033, 43.6 percent for. The constitution of 1867 stands.
    n: '[Md. *Manual*, 1973–74, 50](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000176/html/am176--50.html) (Archives of Maryland, vol. 176). Check: the State Administrative Board of Election Laws'' returns, by county. To check: [[w.callcott-maryland-and-america-1940]]. See [[cal.1968-01-10.state-constitutions-md]].'
    tags: [state:md]
  - id: cal.1968-05-14.governors-wv
    when: May 14
    date: '1968-05-14'
    thread: governors
    also: [elections-1968]
    c: 'West Virginia''s primaries for governor, Hulett Smith barred from a second term. Democratic: James Sprouse, a lawyer of Charleston, W. Va., 123,181, 37.6 percent; the attorney general 118,637, 36.2; a State senator 22.3. Republican: U.S. Representative Arch Moore 106,299, 57.0, over Underwood, governor 1957–61, 41.1.'
    n: 'Votes: [Wikipedia, "1968 West Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1968_West_Virginia_gubernatorial_election), from Our Campaigns. Check: the Secretary of State''s *Official Returns of the Primary Election*, 1968. To check: [[w.peirce-border-south-states]]. Names: Smith, Sprouse, Moore, Underwood.'
    tags: [state:wv, name:smith-hulett-c, name:sprouse-james-m, name:moore-arch-a-jr, name:underwood-cecil-h]
  - id: cal.1968-05-14.amendments
    when: May 14–16
    date: '1968-05-14'
    thread: amendments
    also: [voting-rights, congress]
    c: 'Bayh''s subcommittee on the vote at eighteen: S.J. Res. 8, 14 and 78. Bayh: 10.8 million Americans 18, 19 and 20. Mansfield the first witness, for S.J. Res. 8, his, with 43 cosponsors; Kentucky, Georgia, Alaska and Hawaii already vote under 21. Nixon and Humphrey for it, in a statement and a letter. No resolution reported.'
    n: '*Lowering the Voting Age to 18: Hearings on S.J. Res. 8, S.J. Res. 14, and S.J. Res. 78 before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 90th Cong., 2d sess., [4–5](https://www.govinfo.gov/content/pkg/CHRG-90shrg97135/pdf/CHRG-90shrg97135.pdf#page=8), [106–07](https://www.govinfo.gov/content/pkg/CHRG-90shrg97135/pdf/CHRG-90shrg97135.pdf#page=110) (1968); History of Bills, 1968, [S.J. Res. 8](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt25/pdf/GPO-CRECB-1968-pt25-2.pdf#page=45). To check: [[w.cultice-youths-battle-for-the]]; [[w.kyvig-explicit-and-authentic-acts]]. Names: Bayh, Mansfield, Nixon, Humphrey.'
    tags: [name:bayh-birch, name:mansfield-mike, name:nixon-richard-m, name:humphrey-hubert-h]
