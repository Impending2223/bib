    c: 'Senate, S. 917: rifles and shotguns added to the firearms title, refused, [29–53](https://voteview.com/rollcall/RS0900415).'
    n: See [[cal.1968-05-09.crime-and-hijacking]].
  - id: cal.1968-05-16.elections-1968-state-conventions
    when: May 16
    date: '1968-05-16'
    thread: elections-1968-state-conventions
    also: [georgia]
    c: 'Georgia''s Democratic delegation to Chicago named, 43, unpledged. The party''s Rule 55: the State chairman chooses the delegates, with the governor''s advice and consent.'
    n: '"Unpledged Slate Voted in Georgia," [*New York Times*, May 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/17/issue.html), 26; the rule, the Hughes Commission''s report, [114 Cong. Rec. 31548](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=174) (Oct. 14, 1968). How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): appointment. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. Bibliography of the Chicago credentials: [[cal.1968-08-26.elections-1968-2]]. To check: [[w.commission-on-the-democratic-choice]]; [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]; [[w.selection-mandate-for-reform]]; [[w.shafer-quiet-revolution]]. Names: Maddox. Check: the Times''s page (TimesMachine, by subscription; not read here).'
    tags: [state:ga, name:maddox-lester, ok:thread-first]
  - id: cal.1968-05-17.war-opposition
    when: May 17
    date: '1968-05-17'
    thread: war-opposition
    also: [draft]
    c: Catonsville, Md., 12:50 p.m. Nine Catholics, the priests Daniel and Philip Berrigan among them, take some 378 files from Local Board No. 33 to the parking lot and burn them with homemade napalm. Arrested there. Philip Berrigan already convicted for pouring blood on the files of the Baltimore customs house, Oct. 27, 1967 (Check).
    n: '*United States v. Moylan*, [417 F.2d 1002](https://static.case.law/f2d/417/case-pdfs/1002-01.pdf) (4th Cir. 1969), the appeal. To check: [[w.peters-catonsville-nine]]. Names: Daniel Berrigan, Philip Berrigan.'
    tags: [name:berrigan-daniel, name:berrigan-philip, state:md]
  - id: cal.1968-05-17.vietnam-operations
    when: May 17
    date: '1968-05-17'
    thread: vietnam-operations
    c: Delaware ends, the 1st Brigade out the day before. Some 850 of the enemy killed, hundreds of tons of food, weapons and equipment taken or destroyed; 142 American and 26 South Vietnamese soldiers killed; 11 helicopters destroyed, 35 damaged.
    n: '[FRUS 1964–68, VI, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v06/d228) (Bunker, May 10). [[w.villard-united-states-army-in]], 538–539. See [[cal.1968-04-19.vietnam-operations]]. Check: Cosmas, 205, gives "more than 860" of the enemy killed in Delaware, and 168 American and South Vietnamese dead.'
    tags: [place:a-shau-valley]
  - id: cal.1968-05-18.vietnam
    when: May 18
    date: '1968-05-18'
    thread: vietnam
    c: Saigon. Nguyễn Văn Thiệu accepts the resignation of Nguyễn Văn Lộc's cabinet and names Trần Văn Hương Prime Minister.
    n: 'FRUS 1964–68, VI, doc. [245](https://history.state.gov/historicaldocuments/frus1964-68v06/d245). To check: [[w.bunker-papers]]; [[w.schaffer-ellsworth-bunker]]; [[w.spector-after-tet]]. Names: Nguyễn Văn Thiệu, Nguyễn Văn Lộc, Trần Văn Hương.'
    tags: [name:nguyen-van-thieu, name:nguyen-van-loc, name:tran-van-huong, place:saigon]
  - id: cal.1968-05-20.court
    when: May 20
    date: '1968-05-20'
    thread: court
    also: [crime-and-hijacking]
    c: '*Duncan v. Louisiana*, [391 U.S. 145](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391145/usrep391145.pdf): the Sixth Amendment''s jury trial binds the States through the Fourteenth in serious criminal cases. Gary Duncan, 19, a Negro of Plaquemines Parish, tried without a jury for simple battery on a white boy, sentenced to 60 days and $150; the crime punishable by two years. White for the Court, 7–2; Black, with Douglas, and Fortas concurring; Harlan, with Stewart, dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.powe-warren-court-and-american]]; [[w.cox-warren-court]]. See [[cal.1967-12-18.court]].'
    tags: [name:white-byron-r, name:black-hugo-l, name:douglas-william-o, name:fortas-abe, name:harlan-john-marshall, name:stewart-potter, state:la]
  - id: cal.1968-05-21.governors-il
    when: May 20–21
    date: '1968-05-20'
    thread: governors
    c: Illinois. Kerner, named by Johnson to the Seventh Circuit (nominated Mar. 11, confirmed Apr. 11), resigns as governor, May 20. Shapiro, the lieutenant governor since 1961, sworn governor, May 21, for the rest of the term.
    n: '[Federal Judicial Center, "Kerner, Otto, Jr."](https://www.fjc.gov/history/judges/kerner-otto-jr): nominated Mar. 11, 1968, confirmed Apr. 11. [Wikipedia, "Otto Kerner Jr."](https://en.wikipedia.org/wiki/Otto_Kerner_Jr.); [Wikipedia, "Samuel Shapiro (Illinois politician)"](https://en.wikipedia.org/wiki/Samuel_Shapiro_(Illinois_politician)). Check: the *Illinois Blue Book*, 1969–70. To check: [[w.barnhart-kerner]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1964-11-03.governors-il]]. Names: Kerner, Shapiro, Johnson.'
    tags: [state:il, name:kerner-otto, name:shapiro-samuel-h, name:johnson-lyndon-b]
  - id: cal.1968-05-21.crime-and-hijacking-safe-streets
    when: May 21
    date: '1968-05-21'
    thread: crime-and-hijacking-safe-streets
    also: [court]
    c: 'Senate, S. 917, Title II: the motions to strike the sections on confessions (*Miranda*), [29–55](https://voteview.com/rollcall/RS0900421), on delay before arraignment (*Mallory*), [26–58](https://voteview.com/rollcall/RS0900422), and on eyewitnesses (*Wade*), [21–63](https://voteview.com/rollcall/RS0900424), refused; the sections taking from the federal courts review of State convictions on confessions, [52–32](https://voteview.com/rollcall/RS0900423), and on habeas corpus, [54–27](https://voteview.com/rollcall/RS0900426), struck.'
    n: See [[cal.1968-05-09.crime-and-hijacking]].
  - id: cal.1968-05-21.poverty
    when: May 21
    date: '1968-05-21'
    thread: poverty
    also: [farm, press-and-broadcasting]
    c: 'CBS Reports, *Hunger in America*: hunger in San Antonio, Loudoun County, Va., among the Navajo, and in Alabama''s Black Belt; the Agriculture Department''s food programs. Freeman answers it, and asks CBS for equal time (Check).'
    n: 'To check: [[w.kotz-let-them-eat-promises]]. See [[cal.1967-04-10.poverty]]. Names: Freeman.'
    tags: [name:freeman-orville-l]
  - id: cal.1968-05-22.europe-and-the-alliance
    when: May 22
    date: '1968-05-22'
    thread: europe-and-the-alliance-france
    also: [economy]
    c: 'France. The University of Paris at Nanterre closed May 2; students and police in the streets from May 6; a general strike May 13, the Sorbonne occupied May 14; by May 21 some 8 million on strike. NSC: Katzenbach expects de Gaulle to defeat a vote of censure.'
    n: 'FRUS 1964–68, XII, doc. [78](https://history.state.gov/historicaldocuments/frus1964-68v12/d78). To check: [[w.jackson-de-gaulle]]; [[w.seidman-imaginary-revolution]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.gavin-gold-dollars-and-power]]. Names: Katzenbach, de Gaulle.'
    tags: [name:katzenbach-nicholas, name:de-gaulle-charles]
  - id: cal.1968-05-22.opinion
    when: May 22
    date: '1968-05-22'
    thread: opinion
    also: [elections-1968-polls, students]
    c: 'Gallup, May 2–7, college students, the Democratic convention''s choice among three: McCarthy 46 percent, Robert Kennedy 33, Humphrey 15. Consider themselves Republicans 19, Democrats 37, independents 44.'
    n: '[[w.gallup-poll]], III, 2127. Names: McCarthy, Kennedy, Humphrey.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, name:humphrey-hubert-h]
  - id: cal.1968-05-23.crime-and-hijacking-safe-streets
    when: May 23
    date: '1968-05-23'
    thread: crime-and-hijacking-safe-streets
    c: 'Senate, S. 917: Title III, wiretapping and eavesdropping on court order, kept, [12–68](https://voteview.com/rollcall/RS0900432); Dirksen''s block grants, to the States alone, [48–29](https://voteview.com/rollcall/RS0900436). Passed as H.R. 5037, [72–4](https://voteview.com/rollcall/RS0900439).'
    n: 'See [[cal.1968-05-09.crime-and-hijacking]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-05-23.king-poor-peoples
    when: May 23
    date: '1968-05-23'
    thread: king-poor-peoples
    c: 'Rusk answers the grievances the Poor People''s Campaign''s representatives put to him at State, May 1: the war, South Africa, Rhodesia, Portugal.'
    n: 'FRUS 1964–68, XXXIV, doc. [331](https://history.state.gov/historicaldocuments/frus1964-68v34/d331). See [[cal.1968-05-12.king]]. Names: Rusk, Abernathy.'
    tags: [name:rusk-dean, name:abernathy-ralph-david]
  - id: cal.1968-05-25.vietnam
    when: May 25
    date: '1968-05-25'
    thread: vietnam-paris
    c: 'The bombing between the 19th and 20th parallels. Lunch: Clifford, sorties in the North up from 3,200 in February to 9,100 in May; Taylor and Rostow for going back to the 20th; Rusk thinks the bombing south of it more effective. Johnson: Rusk and Clifford to "figure out how to get back to the 20th parallel with little bombast," Vance home first.'
    n: 'FRUS 1964–68, VI, doc. [249](https://history.state.gov/historicaldocuments/frus1964-68v06/d249). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]; [[cal.1968-03-31.elections-1968]]. Names: Clifford, Taylor, Rostow, Rusk, Vance, Johnson.'
    tags: [name:clifford-clark, name:taylor-maxwell, name:rostow-walt-w, name:rusk-dean, name:vance-cyrus, name:johnson-lyndon-b]
  - id: cal.1968-05-25.vietnam-2
    when: May 25
    date: '1968-05-25'
    thread: vietnam
    c: 'Saigon. Trần Văn Hương''s cabinet announced. Bunker, May 29: "a considerable move toward civilian government."'
    n: 'Bunker''s weekly message, May 29, cited in a note to FRUS 1964–68, VI, doc. [245](https://history.state.gov/historicaldocuments/frus1964-68v06/d245). See [[cal.1968-05-18.vietnam]]. Names: Trần Văn Hương, Bunker.'
    tags: [name:tran-van-huong, name:bunker-ellsworth, place:saigon]
  - id: cal.1968-05-25.vietnam-may-offensive
    when: May 25
    date: '1968-05-25'
    thread: vietnam-may-offensive
    c: 'A second wave of attacks in Saigon (Check the day). Johnson to the congressional leaders, May 28: "We lost 1,100 men in the last two weeks."'
    n: 'FRUS 1964–68, VI, doc. [254](https://history.state.gov/historicaldocuments/frus1964-68v06/d254). See [[cal.1968-05-05.vietnam]]. Names: Johnson. Check: *Victory in Vietnam* gives May 25 (228).'
    tags: [name:johnson-lyndon-b, place:saigon]
  - id: cal.1968-05-25.elections-1968-state-conventions
    when: May 25
    date: '1968-05-25'
    thread: elections-1968-state-conventions
    c: 'Iowa''s Democratic State convention divides its 46 votes: Robert Kennedy 25, Humphrey 9½, McCarthy 5, uncommitted 6½.'
    n: '"Kennedy Winner in Iowa Contest," [*New York Times*, May 26, 1968](https://timesmachine.nytimes.com/timesmachine/1968/05/26/issue.html), 53. How chosen, the Hughes Commission''s Table I, [114 Cong. Rec. 31549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-3.pdf#page=175) (Oct. 14, 1968): convention; open precinct. The figures: [Wikipedia, "1968 Democratic Party presidential primaries"](https://en.wikipedia.org/wiki/1968_Democratic_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026. See [[cal.1968-05-16.elections-1968-state-conventions]]. Names: Robert Kennedy, Humphrey, McCarthy. Check: the Times''s page (TimesMachine, by subscription; not read here).'
    tags: [state:ia, name:kennedy-robert-f, name:humphrey-hubert-h, name:mccarthy-eugene-j]
  - id: cal.1968-05-26.opinion
    when: May 26
    date: '1968-05-26'
    thread: opinion
    also: [vietnam, civil-rights-the-executive, crime-and-hijacking]
    c: 'Gallup, May 2–7: the most important problem facing the country: Vietnam 42 percent, race relations 25, crime and lawlessness (riots, looting, juvenile delinquency included) 15, the high cost of living and taxes 8, poverty 4. The party better able to handle it: Republican 30, Democratic 28, no difference or no opinion 42.'
    n: '[[w.gallup-poll]], III, 2128.'
  - id: cal.1968-05-27.desegregation-schools
    when: May 27
    date: '1968-05-27'
    thread: desegregation-schools
    also: [court]
    c: '*Green v. County School Board of New Kent County*, [391 U.S. 430](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391430/usrep391430.pdf): a "freedom-of-choice" plan that leaves a dual system in place does not satisfy *Brown*; the board must "come forward with a plan that promises realistically to work, and promises realistically to work now." New Kent County, Va., two schools, one white, one Negro, still. Brennan for a unanimous Court. The same day, *Raney* (Gould, Ark.) and *Monroe* (Jackson, Tenn.).'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.orfield-reconstruction-of-southern-education]]; [[w.powe-warren-court-and-american]]. Names: Brennan.'
    tags: [name:brennan-william-j-jr, state:va]
  - id: cal.1968-05-27.draft
    when: May 27
    date: '1968-05-27'
    thread: draft
    also: [war-opposition, court]
    c: '*United States v. O''Brien*, [391 U.S. 367](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391367/usrep391367.pdf): the 1965 amendment making it a crime to destroy or mutilate a draft card upheld; David O''Brien had burned his on the steps of the South Boston courthouse, Mar. 31, 1966. A regulation of conduct valid where it furthers an important interest unrelated to suppressing expression. Warren for the Court, 7–1; Douglas dissenting; Marshall took no part.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.powe-warren-court-and-american]]. See [[cal.1965-11-02.students]].'
    tags: [name:warren-earl, name:douglas-william-o, name:marshall-thurgood, state:ma, city:boston]
  - id: cal.1968-05-28.vietnam-paris
    when: May 28
    date: '1968-05-28'
    thread: vietnam-paris
    c: 'Vance: no bombing north of the 20th, Hanoi would break off the talks; perhaps selective bombing north of the 19th. Katzenbach: going above the 19th "may hurt you on tax bill." No change ordered (Check).'
    n: 'FRUS 1964–68, VI, doc. [253](https://history.state.gov/historicaldocuments/frus1964-68v06/d253). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-25.vietnam]]. Names: Vance, Katzenbach.'
    tags: [name:vance-cyrus, name:katzenbach-nicholas]
  - id: cal.1968-05-28.europe-and-the-alliance-france
    when: May 28
    date: '1968-05-28'
    thread: europe-and-the-alliance-france
    c: 'Shriver from Paris: de Gaulle''s authority in France, and France''s abroad, "significantly reduced."'
    n: 'FRUS 1964–68, XII, doc. [79](https://history.state.gov/historicaldocuments/frus1964-68v12/d79). See [[cal.1968-05-22.europe-and-the-alliance]]. Names: Shriver, de Gaulle.'
    tags: [name:shriver-r-sargent, name:de-gaulle-charles]
  - id: cal.1968-05-28.elections-1968
    when: May 28
    date: '1968-05-28'
    thread: elections-1968
    c: 'Primaries in Florida and Oregon. Republican: unpledged delegates in Florida; Nixon in Oregon. Democratic: Smathers in Florida; McCarthy in Oregon.'
    n: '[*Tabulation of Official Vote, Florida Primary Elections, 1968*, 25–32](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1968/page/n30); Or., [*Official Abstract of Votes, Primary Election 1968*, 34–36](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411031/File/document). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Smathers, Nixon.'
    tags: [primary:1968-05-28, name:mccarthy-eugene-j, name:smathers-george-a, name:nixon-richard-m]
  - id: cal.1968-05-28.cities-and-housing
    when: May 28
    date: '1968-05-28'
    thread: cities-and-housing
    c: 'The Senate passes S. 3497, the Housing and Urban Development Act of 1968, [67–4](https://voteview.com/rollcall/RS0900447): subsidies for homes bought by families of lower income and for rental housing; guarantees for new communities kept, [27–38](https://voteview.com/rollcall/RS0900441); the National Insurance Development Corporation, for insurance in riot areas, kept, [10–62](https://voteview.com/rollcall/RS0900446). Johnson to Sparkman, May 29.'
    n: 'Letter to Senator Sparkman Following Senate Passage of the Housing and Urban Development Bill, [1968–69 Pub. Papers 659](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=737) (May 29, 1968). To check: [[w.hays-federal-government-and-urban]]. See [[cal.1968-02-22.cities-and-housing]]. Names: Sparkman, Johnson.'
    tags: [name:sparkman-john, name:johnson-lyndon-b]
  - id: cal.1968-05-28.elections-1968-2
    when: May 28
    date: '1968-05-28'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'Oregon: McCarthy over Kennedy, the first election a Kennedy had lost (Check). Nebraska, May 14, had gone to Kennedy, McCarthy second. Both to California for June 4.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 905–07. See [[cal.1968-05-28.elections-1968]]; [[cal.1968-05-14.elections-1968]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, state:or, state:ne]
  - id: cal.1968-05-28.trade
    when: May 28
    date: '1968-05-28'
    thread: trade
    c: 'Message on trade, a Trade Expansion Act of 1968: the President''s authority to adjust tariffs extended through June 30, 1970; the American Selling Price system of customs valuation ended, the price of the Kennedy Round''s concessions on chemicals; adjustment assistance eased; appropriations for the American share of the GATT''s costs.'
    n: 'Special Message to the Congress: "Greater Prosperity Through Expanded World Trade", [1968–69 Pub. Papers 648](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=726) (May 28, 1968). To check: [[w.zeiler-american-trade-and-power]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-05-28.elections-1968-or
    when: May 28
    date: '1968-05-28'
    thread: elections-1968
    also: [war-opposition]
    c: Oregon's Democratic primary for the Senate. Morse, seeking a fifth term, 185,091, 49.0 percent; Duncan, U.S. Representative 1963–67, who supports the war, 174,795, 46.3; one other 4.7. Packwood, a State representative, the Republican nominee.
    n: 'Votes: [Wikipedia, "1968 United States Senate election in Oregon"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Oregon), from Our Campaigns; Check: [Or. *Official Abstract of Votes, Primary Election, May 28, 1968*](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411031/File/document) (the server failed from here, Oct. 17, 2026). To check: [[w.drukman-wayne-morse]]. See [[cal.1966-05-24.elections-1966]]; [[cal.1968-05-28.elections-1968]]. Names: Morse, Duncan, Packwood.'
    tags: [state:or, name:morse-wayne, name:duncan-robert-b, name:packwood-robert-w]
  - id: cal.1968-05-29.consumers
    when: May 29
    date: '1968-05-29'
    thread: consumers
    c: 'Consumer Credit Protection Act signed, [82 Stat. 146](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg146.pdf). Title I, truth in lending: the finance charge stated in dollars and as an annual percentage rate. Federal penalties on extortionate credit, the loan shark; limits on the garnishment of wages; a National Commission on Consumer Finance. Paul Douglas, its first sponsor in the Senate, at the signing; Leonor Sullivan its manager in the House (Check).'
    n: 'Remarks Upon Signing the Consumer Credit Protection Act, [1968–69 Pub. Papers 660](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=738) (May 29, 1968). Statute (K–J Cong. II.J.2). To check: [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-07-11.consumers]]. Names: Douglas, Sullivan, Johnson.'
    tags: [name:johnson-lyndon-b, name:douglas-paul-h, name:sullivan-leonor-k]
  - id: cal.1968-05-29.opinion
    when: May 29
    date: '1968-05-29'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, May 2–7, residents of large cities: a mayor''s order to the police to shoot on sight anyone looting stores during race riots: the best way 47 percent, there is a better way 49. Serious racial trouble in this community in the next six months: likely 30, not likely 59.'
    n: '[[w.gallup-poll]], III, 2128. See [[cal.1968-04-04.civil-disorders]].'
  - id: cal.1968-05-29.economy-surcharge
    when: May 29
    date: '1968-05-29'
    thread: economy-surcharge
    also: [congress]
    c: The House Appropriations Committee's formula, $4 billion off fiscal 1969 expenditures; the conferees on H.R. 15414 had taken the Senate's $6 billion (Check the day). The House refuses to instruct its conferees for $4 billion in place of $6 billion, [137–259](https://voteview.com/rollcall/RH0900332).
    n: See [[cal.1968-03-26.economy]].
  - id: cal.1968-05-30.europe-and-the-alliance-france
    when: May 30
    date: '1968-05-30'
    thread: europe-and-the-alliance-france
    c: De Gaulle will not resign; the Assembly dissolved, elections June 23 and 30.
    n: 'FRUS 1964–68, XII, doc. [80](https://history.state.gov/historicaldocuments/frus1964-68v12/d80). See [[cal.1968-05-22.europe-and-the-alliance]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
