  - id: cal.1968-05-07.robert-kennedy-campaign-primaries-2
    when: May 7, night
    date: '1968-05-07'
    place: indianapolis
    thread: robert-kennedy-campaign-primaries
    follows:
      - cal.1968-05-07.robert-kennedy-campaign-primaries-3
    c: 'Indianapolis, the Sheraton-Lincoln, the returns clear. Kennedy on CBS with Roger Mudd, then, on a split screen with McCarthy he had not wanted to give exposure, with Cronkite, who asks about campaign spending: no candidate would need so much if the networks gave air time at cost; they could afford it, the public owning the airwaves. To Mudd: "There are two ways you can play this—above the table and below the table, and your people played below. I had no indication this was coming. I want you to make it clear I feel this way." He leaves. By Witcover''s account.'
    n: '[[w.witcover-85-days]], 179. Order: after [[cal.1968-05-07.robert-kennedy-campaign-primaries-3|O''Brien''s first precinct figures]], by Witcover (178–79: O''Brien brings the first sample returns, the South Bend figures, to the airport motel; then the Sheraton-Lincoln) and O''Brien (239: O''Brien goes "down the hall to see his candidate"). See [[cal.1968-05-07.elections-1968-2]]. Names: Robert Kennedy, Cronkite, McCarthy.'
    tags: [name:kennedy-robert-f, name:cronkite-walter, name:mccarthy-eugene-j, state:in, city:indianapolis]
  - id: cal.1968-05-07.china-leadership
    when: May 7
    date: '1968-05-07'
    time: 1968-05-07T13:45Z
    place: peking
    thread: china-zhou-foreign
    also: [vietnam-hanoi, vietnam-paris]
    c: 'Zhou Enlai to Xuân Thủy, Vietnam''s Foreign Minister: Korea''s talks were not like Vietnam''s;{1} that was half of Korea, this is the unification of Vietnam, half of Vietnam being fourteen years old. After recounting the Korean negotiations: they produced only an armistice and no other political agreement; the basic point is that what is not won on the battlefield cannot be won at the table. The Americans and South Vietnam have a million troops; unless their backbone is broken, or five or six of ten fingers, they will not admit defeat or leave.{2}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 228–229 (May 7, 1968); [[w.zhou-enlai-waijiao-huodong]], 524 (May 7, 1968; 9:45 p.m., Fujian Hall, Great Hall of the People; the book has Zhou adding that the Geneva agreement of 1954, as Mao told Hồ Chí Minh, may have been wrongly signed, and many southern fighters had to move north; that Ngô Đình Diệm''s arrests, imprisonment and repression cost some 200,000 lives before the southern people rose; that the U.S. refused to sign the 1954 agreement; that the 1958 Chinese withdrawal from Korea was not matched by the U.S.; that Vietnam agreed too fast and too eagerly; and that Mao told Phạm Văn Đồng talks are possible but need a high posture); [[w.zhonghua-renmin-gongheguo-waijiao]], 195 (May 7, 1968; Xuân Thủy: the Korean armistice talks unlike Vietnam''s); [[w.77-conversations-between-chinese]], [131–133](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=129) (doc. 35; Beijing, the Great Hall of the People, 9:45 p.m., May 7, 1968: Zhou with Chen Yi and Xuân Thủy; the Korean and Geneva negotiations, what is not won on the battlefield not won at the table, Mao''s remark to Hồ on Geneva, whose date the editors, 132 n.199, give as not specified, possibly the winter or spring of 1968; Chen Yi: do not inform the Soviets of the talks with the U.S.). [[w.khoo-collateral-damage]], 53 (Zhou, with Chen Yi, and Xuân Thủy, May 7, 1968). Made public: 1993. To check: [[w.77-conversations-between-chinese]], 134–135 (cited by [[w.khoo-collateral-damage]], 53 n.57). Names: Zhou Enlai, Xuân Thủy.'
