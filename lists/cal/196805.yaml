    also: [china-mao-cr]
    c: 'Mao with the Cultural Revolution Group''s members, Peking: wants Chen Yi, Li Xiannian, Nie Rongzhen, Ye Jianying, Liu Bocheng, Xu Xiangqian and other vice premiers and marshals called in to talk.{1} On the cadres attacked: 95 percent good;{2} no forced confessions, weigh evidence; the Yan''an rule of no killing, few arrests;{3} the "Wu Hao notice" a fake.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 8, 1968; [[w.zhou-enlai-nianpu-1949-2020]], III, 229 (May 8, 1968; the reception and the talk on the Wu Hao notice); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.11, 49 (May 8, in a talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会, Mao: we fixed one rule at Yan''an, no killing, most not arrested; go by evidence and corroboration, not confession, since pressed men confess and the pressing grows; the Party''s history has its lessons, the AB Corps in Jiangxi, the arrests of Social Democrats in Fujian, the Reorganization Clique and the Third Party in E-Yu-Wan, n.11; the same record, n.49: the materials gathered on Liu Shaoqi are not all to be believed (his plotting with the Americans in the winter of 1946 and the sending of Shen Qizhen 沈其震 to Truman and Acheson through Stuart is a fabrication), Zhou doubts the account of Liu''s visit to Nanjing before the war, and no killing is best, the survivors can work and can testify; the book says nothing of the marshals, the cadres ''ninety-five percent good'' or the ''Wu Hao notice''). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 229 (May 8, 1968), puts the talk in a break of the reception of the study classes'' and the railway conference''s delegates, has Mao say that even Xu Shiyou, past sixty, did not know the "Wu Hao notice" was the enemy''s forgery, and has Zhou tell the notice''s origin and say he has had the papers and his report photocopied and will write an account. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), May 8, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.11). Names: Mao Zedong, Chen Yi, Li Xiannian, Nie Rongzhen, Ye Jianying, Liu Bocheng, Xu Xiangqian, Liu Bocheng.'
