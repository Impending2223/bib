  - id: cal.1968-05-06.vietnam-paris
    when: May 6
    date: '1968-05-06'
    thread: vietnam-paris
    c: 'The White House, 1:20 p.m.: Johnson with Rusk, Clifford, Harriman, Vance and the others before the delegation leaves for Paris. Johnson pessimistic; the negotiators to be optimistic. Rusk: "They''ll come in with a roar." Clifford: they will not talk without a halt. Johnson: "What would you do about stopping the bombing?" Nothing settled.'
    n: '[FRUS 1964–68, VI, doc. 225](https://history.state.gov/historicaldocuments/frus1964-68v06/d225). [[w.dallek-flawed-giant]], 539–40 (Johnson; Rusk; the question; nothing settled). Made public: FRUS 1964–68, VI (2002). [[w.clifford-counsel-to-the-president-2]], 536 (Clifford''s question on a halt; Rusk turns to other matters). See [[cal.1968-05-03.vietnam]]. Names: Johnson, Rusk, Clifford, Harriman, Vance. Check: Clifford, 536, has the meeting "late that day".'
