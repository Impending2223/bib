    place: washington
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'Johnson to Kosygin, by the private channel: arms limitation in the Middle East;{1} and talks on strategic arms, his proposal since December 1966.{2} He proposes that the two governments announce, early in the General Assembly''s debate on the nonproliferation treaty, bilateral negotiations to limit strategic offensive and defensive missiles.{3} The shorter of two drafts, without the specifics the Joint Chiefs had opposed.{4} Rusk gives Dobrynin a copy May 3.{5}'
