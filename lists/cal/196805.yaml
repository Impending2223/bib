  - id: cal.1968-05-05.vietnam-may-offensive
    when: May 5–10
    date: '1968-05-05'
    place: saigon
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Saigon, west of the city. Regiment 2 (Battalions 267, 269 and Binh Tan 6, Võ Văn Hoàng commanding) attacks the Phú Lâm radar group, goes on to Cầu Tre, hurts a ranger battalion and takes the Minh Phụng and Bình Thới areas. Two ranger battalions with armor counterattack; at Duy Linh square B40 and B41 gunners and machine guns of the regiment fire on the lead. May 7 and 8 the regiment holds two high-rise buildings at the Minh Phụng crossing against A-37 bombing and two ranger battalions with dozens of M41 tanks. The fight runs to May 10; the regiment then splits, one battalion north to the Phú Thọ cemetery, two south past Cầu Gỗ to Bình Tiên.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 185–86. The history gives the offensive''s opening at 12:30 a.m. May 5; see [[cal.1968-05-05.vietnam]]. The time is not the regiment''s. Check: the day each arm reached its ground.'
    tags: [polity:drv, polity:rvn, polity:us, ok:fields-time]
  - id: cal.1968-05-05.vietnam-may-offensive-2
    when: May 5
    date: '1968-05-05'
    place: saigon
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Saigon, around Tân Sơn Nhứt. Regiment 1 of the 9th Division, attached to Subregion 2, breaks through the outer screen and attacks the Bảy Hiền crossing and targets around the airfield. At the French cemetery the Saigon paratroops, the strategic reserve, come out of the airfield to stop it; a hard fight follows at Mả Xây. In two days, May 5 and 6, by the history's count the regiment kills nearly 200; May 7 Subregion 2 orders it west of Bà Quẹo to defend.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 186. See [[cal.1968-05-05.vietnam]]. The figures are the history''s.'
    tags: [polity:drv, polity:rvn]
  - id: cal.1968-05-05.vietnam-may-offensive-4
    when: May 5–7
    date: '1968-05-05'
    place: saigon
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Saigon, the east. "Dare-to-die" teams of Battalions 2 and 4 of Subregion 4 bring down a corner of the highway bridge, blocking traffic for days. Night of May 7 the subregion's main units fight the Saigon Marine Group A in District 9; a sapper detachment takes the Sincovina factory, the posts nearby are abandoned, and engineers with guerrillas blow the Sụp and Trao Trảo bridges and hold the area from Long Bình to Bình Trưng for days.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 188. The history gives the bridge May 5 and the district fighting the night of May 7.'
    tags: [polity:drv, polity:rvn, ok:fields-time]
  - id: cal.1968-05-05.vietnam-may-offensive-5
    when: May 5–6
    date: '1968-05-05'
    place: saigon
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Saigon, northeast. At dawn two infantry companies with local self-defense men cross the bridge by truck, take high-rise buildings at the end of Tự Đức street and beat counterattacks by a Saigon marine battalion. At noon May 6 a ranger battalion with dozens of armored cars counterattacks; the force splits into teams, burns two M113s and holds until ordered to change direction.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 188–89. Check: the clock, whose it is; the bridge as printed, "Phan Thanh Giản". The figures are the history''s.'
    tags: [polity:drv, polity:rvn]
    time_range:
      - 1968-05-04T16:00Z
      - 1968-05-04T22:00Z
    time_band: predawn
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1968-05-05.vietnam-may-offensive-6
    when: May 5–7
    date: '1968-05-05'
    place: cu-chi
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Đồng Dù base and Củ Chi town. Two composite battalions of the 9th Division attack the American troops for three days and by the history's count put nearly 200 out of action, destroy 60 vehicles and burn two fuel depots. May 8 Battalion 5 of Regiment 2 attacks two American companies at Bà Điểm, by the history's count nearly 100 out of action and two M113s destroyed. Night of May 9 two Region sapper companies attack the Quang Trung training camp at Hóc Môn, put 80 out of action and wreck the command and signals area.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 190. Check: the days; the history gives May 5, 6 and 7; May 8; the night of May 9. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn]
  - id: cal.1968-05-05.vietnam-may-offensive-3
    when: May 5–8
    date: '1968-05-05'
    place: my-tho
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Mỹ Tho and Gò Công. In the offensive's first week the province's Battalion 263 with Region sapper Companies 312 and 314 attacks the Hùng Vương training base and by the history's count puts nearly 500 out of action. Battalion 514C, north of Cái Bè, destroys the Hộ Cư, Hậu Mỹ and Mỹ Thiên posts; the city's commandos take the American quarters, a police post and the Armored Regiment 6 base; guerrillas of Bình Trưng, Long Hưng and Song Thuận shoot down three helicopters. At Gò Công Battalion 514B destroys the Sơn Quy post and May 8 fights counterattacks at Bình Lạc, Bình Phú, Bình Nho and Bình Thọ.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 197. See [[cal.1968-05-05.vietnam]]. Check: the days; the history gives "the first week". The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn]
  - id: cal.1968-05-05.vietnam-may-offensive-7
    when: May 5
    date: '1968-05-05'
    place: thanh-tri
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Cống Đá post, Thạnh Trị district, Sóc Trăng. The district forces besiege and destroy the post; a party ambushes the security company sent from the district seat to relieve it and hurts it badly.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 202. Check: the province; the history gives the district only. The figures are the history''s.'
    tags: [polity:drv, polity:rvn]
  - id: cal.1968-05-05.vietnam-may-offensive-8
    when: May 5–7
    date: '1968-05-05'
    place: cho-lau
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Chợ Lầu town, northern Bình Thuận. At dawn Company 440 of the province takes the town and destroys a security and a civil-guard platoon. The afternoon of May 7 it ambushes a security company coming to relieve the town and hurts it badly; at 3 p.m. that day four ranger companies from Lương Sơn in three columns try to surprise it.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 204. The time is the first act''s, May 5. Check: the clock, whose it is. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn, ok:fields-time]
    time_range:
      - 1968-05-04T16:00Z
      - 1968-05-04T22:00Z
    time_band: predawn
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1968-05-05.vietnam-may-offensive-9
    when: May 5–6
    date: '1968-05-05'
    place: quang-ngai
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Quảng Ngãi town. Two sapper companies of the province and the town forces attack the Quảng Ngãi subsector in two days, May 5 and 6, and hurt two companies of Saigon and security troops badly.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 208. The history says the attack avenges the 500 killed at Sơn Mỹ in March. The figures are the history''s.'
    tags: [polity:drv, polity:rvn, polity:us]
  - id: cal.1968-05-05.vietnam-may-offensive-10
    when: May 5–6
    date: '1968-05-05'
    place: phu-my
    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Route 1, Ông Diệu bridge to Phù Mỹ district seat, Bình Định. At dawn the 3d Division of Region 5 (less a regiment), with province and district forces, attacks eight targets along the road. About 11 p.m. May 6 a convoy with air and artillery cover, coming out of Phù Mỹ, runs into the division's ambush; the history counts 32 vehicles burned and over 100 killed.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 208–09. The time is the first act''s, May 5. Check: the clock, whose it is. The figures are the history''s.'
