  - id: cal.1968-05.elections-1968-mccarthy
    when: May
    date: 1968-05
    thread: elections-1968-mccarthy
    also: [robert-kennedy-campaign-primaries]
    c: 'Omaha, the Blackstone Hotel, a dinner with reporters, the night before McCarthy leaves Nebraska. McCarthy: Nebraska "wasn''t very important"; "Kennedy talks about winning three primaries. I''ve won five," the fifth "the college primary"; "I''d rather win the college primary than the Indiana primary." Indiana had knocked Kennedy out of any chance; "All the cards are on the table now." He predicts 30 percent in Nebraska, Kennedy under 50. By Witcover''s account.'
    n: '[[w.witcover-85-days]], 185–86. Check: the day (the work has "the night before McCarthy left the state," after Indiana, May 7, and before the Omaha dinner of May 10, which he passed up). Names: McCarthy, Robert Kennedy.'
