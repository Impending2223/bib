    thread: vietnam-may-offensive
    also: [vietnam-hanoi]
    c: Saigon, District 5. The armed forces of the Chinese-community organization rouse hundreds of people, who take the district administrative building May 6 to 8 and go on to the Lò Gạch, Lò Gốm and Lò Sâu quarters, hamlet 1 of Trang Tử ward and hamlet 6 of Phú Lâm ward.
