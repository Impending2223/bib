  - id: cal.1968-05-06.economy-surcharge
    when: May 6
    date: '1968-05-06'
    thread: economy-surcharge
    c: 'Ways and Means, in executive session, adopts Herlong''s motion for the House conferees on H.R. 15414: spending for fiscal 1969 cut by at least $4 billion, the war''s special costs, interest, veterans'' benefits and the Social Security trust funds excepted; new obligational authority cut by at least $10 billion, old rescinded by at least $8 billion; a 10 percent surcharge or a comparable rate.'
    n: '[114 Cong. Rec. D197](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=195). [[w.johnson-vantage-point]], 454 (after Appropriations). See [[cal.1967-01-10.economy]].'
