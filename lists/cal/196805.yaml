  - id: cal.1968-05-04.governors-nc
    when: May 4
    date: '1968-05-04'
    thread: governors
    also: [elections-1968]
    c: 'North Carolina''s primaries for governor, Moore barred from a second term. Democratic: Lieutenant Governor Robert Scott over J. Melville Broughton Jr., the party''s State chairman and son of the governor of 1941–45, 337,368 to 233,924, 48.1 percent; Reginald Hawkins, a Negro dentist and civil rights leader of Charlotte, 129,808, 18.5 percent. Broughton does not call a runoff. Republican: U.S. Representative Jim Gardner over Stickley, 113,584 to 42,483, 72.8 percent. Nov. 5, Scott over Gardner, 821,233 to 737,075, 52.7 percent.'
    n: '[N.C. *Manual*, 1969, 291](https://archive.org/details/northcarolinama1969nort/page/n306); Wikipedia, ["1968 North Carolina gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Carolina_gubernatorial_election). The bar: N.C. Const. art. III, § 2, as amended 1962, "nor shall a person elected to either of these two offices be eligible for election to the next succeeding term of the same office," [*Constitution of North Carolina*, a literal print as of Jan. 1, 1969, 25](https://archive.org/details/constitutionofno00nort); the amendment ratified Nov. 6, 1962, [[w.sanders-amendments-to-the-constitution]], [14](https://archive.org/details/amendmentstocons00sand). Check: that Broughton declined the runoff. To check: [[w.luebke-tar-heel-politics]]; [[w.bass-transformation-of-southern-politics-1976]]. Names: Moore, Scott, Broughton, Hawkins, Gardner.'
    tags: [state:nc, city:charlotte, name:moore-dan-k, name:scott-robert-w, name:broughton-j-melville-jr, name:hawkins-reginald-a, name:gardner-james-c]
  - id: cal.1968-05-04.governors-tx
    when: May 4
    date: '1968-05-04'
    thread: governors
    also: [elections-1968]
    c: 'Texas Democratic primary for governor, Connally not running: ten candidates. Don Yarborough, a Houston lawyer, over Lieutenant Governor Preston Smith, 421,607 to 386,875, 24.1 percent; Waggoner Carr, attorney general 1961–67, 257,543, 14.7 percent; Dolph Briscoe, a rancher of Uvalde, Tex., 225,686, 12.9 percent; Eugene Locke, deputy ambassador at Saigon 1967–68, 218,118, 12.5 percent; John Hill, secretary of state, 154,908, 8.8 percent. Runoff between Yarborough and Smith. Republican: Paul Eggers over Trice, 65,501 to 28,849, 62.5 percent.'
    n: 'Votes: [Wikipedia, "1968 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1968_Texas_gubernatorial_election), from the *Texas Almanac*; [*Texas Observer*, May 10, 1968](https://issues.texasobserver.org/pdf/ustxtxb_obs_1968_05_10_issue.pdf). Check: the State Democratic Executive Committee''s canvass. To check: [[w.davidson-race-and-class-in]]; [[w.knaggs-two-party-texas]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1967-11-10.governors-tx]]. Names: Connally, Yarborough, Smith, Carr, Briscoe, Locke, Hill, Eggers.'
    tags: [state:tx, name:connally-john, name:yarborough-don, name:smith-preston, name:carr-waggoner, name:briscoe-dolph-jr, name:locke-eugene-m, name:hill-john-l-jr, name:eggers-paul-w]
