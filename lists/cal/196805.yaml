    c: Na Khang, Lima Site 36, attacked May 5; the planes over it from first light May 6. 276 Air Force sorties May 5–13. From May 10 the Meo push north and east; by May 13 their outposts retaken, the enemy four to five miles back.
    n: '[[w.anthony-war-in-northern-laos]], 262–63. To check: 7th AF/13th AF to 7th AF, 051030Z May 68, "Lima Site 36 Sitrep and Air Strike Request" (cited by [[w.anthony-war-in-northern-laos]], 263 n.66a); 4802d JLD to 7th AF/13th AF, "LS-36," May 13, 1968 (cited by [[w.anthony-war-in-northern-laos]], 263 n.66b). See [[cal.1967-01-06.laos]].'
