    c: Wilbur Cohen sworn Secretary of Health, Education, and Welfare, Under Secretary since 1965 and acting Secretary since Gardner left, Mar. 1.
    n: 'Remarks at the Swearing In of Wilbur J. Cohen as Secretary of Health, Education, and Welfare, [1968–69 Pub. Papers 616](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=694) (May 16, 1968). To check: [[w.berkowitz-mr-social-security]]. Names: Cohen, Gardner, Johnson.'
