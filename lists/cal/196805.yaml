  - id: cal.1968-05-07.robert-kennedy-campaign-primaries-2
    when: May 7, night
    date: '1968-05-07'
    thread: robert-kennedy-campaign-primaries
    c: 'Indianapolis, the Sheraton-Lincoln, the returns clear. Kennedy on CBS with Roger Mudd, then, on a split screen with McCarthy he had not wanted to give exposure, with Cronkite, who asks about campaign spending: no candidate would need so much if the networks gave air time at cost; they could afford it, the public owning the airwaves. To Mudd: "There are two ways you can play this—above the table and below the table, and your people played below. I had no indication this was coming. I want you to make it clear I feel this way." He leaves. By Witcover''s account.'
    n: '[[w.witcover-85-days]], 179. See [[cal.1968-05-07.elections-1968-2]]. Names: Robert Kennedy, Cronkite, McCarthy.'
