    place: portland
    thread: robert-kennedy-campaign-primaries
    c: 'Portland, late Saturday afternoon.{1} O''Brien, won over by Walinsky, asks Robert Kennedy to debate McCarthy.{2} Salinger, Lucey and vanden Heuvel are for a debate; Mrs. Green, whom he asks twice, says no. Kennedy''s reasons: it gives McCarthy exposure, smacks of desperation and takes a weapon from California. O''Brien, called in, thinks it would not hurt and will go along with Kennedy''s decision.{5} Kennedy: a bad idea; what if McCarthy asks about Pearson''s wiretap column?{3} Finding Walinsky, Edelman and Greenfield laughing in the hall, he tells them to go ring doorbells and slams the door.{4} Dutton gets Kennedy up after six; he orders the room cleared. In the corridor he tells Walinsky and Greenfield, his speechwriters, that they should be writing speeches, not playing the guitar. Later they say they are going back to Washington to write.{6}'
    n: '[[w.thomas-robert-kennedy]], 381; [[w.obrien-no-final-victories]], 241–42 (the weekend before the Oregon vote: O''Brien, Salinger, Edelman, Walinsky and Oregon people discuss McCarthy''s standing challenge to debate; O''Brien tends to favor it with reservations, some of the younger men opposed; Kennedy sends for O''Brien in his suite; Drew Pearson''s column on the King wiretap; decided no by default; the laughing aides); [[w.witcover-85-days]], 213–15 (Saturday, May 25, the eighth-floor suite at the Benson; Walinsky, Salinger, Lucey and vanden Heuvel for a debate, Mrs. Green against; O''Brien called in by Kennedy and saying it would not hurt; after six o''clock, Kennedy in his shorts orders the room cleared and tells Walinsky and Greenfield in the corridor to "go out and ring doorbells"; not Pearson''s column); [[w.witcover-85-days]], 213–14; [[w.witcover-85-days]], 215. To check: Lawrence O''Brien, oral history, LBJ Library; O''Brien, *No Final Victories*, 241 (cited by [[w.thomas-robert-kennedy]], 475). See [[cal.1968-05-25.robert-kennedy]]. Names: O''Brien, Walinsky, Robert Kennedy, Salinger, Lucey, vanden Heuvel, Green, Dutton, Greenfield.'
    src:
      c: 18e691d6
      rows:
        - 'w.thomas-robert-kennedy 381: 1, 2, 3, 4'
        - 'via w.thomas-robert-kennedy 381 n.rfk-and-obrien: 1, 2, 3, 4'
        - 'w.obrien-no-final-victories 241–42: ?'
        - 'w.witcover-85-days 213–15: ?'
        - 'w.witcover-85-days 213–14: 5'
        - 'w.witcover-85-days 215: 6'
    tags: [name:obrien-lawrence-f, name:walinsky-adam, name:kennedy-robert-f, state:or, name:salinger-pierre, name:lucey-patrick, name:vanden-heuvel-william-j, name:green-edith, name:dutton-frederick-g, name:greenfield-jeff]
