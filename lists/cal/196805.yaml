    c: 'Hồ Chí Minh''s testament, the drafts of 1968: at 78, "absolutely secret," the part on himself rewritten: no lavish funeral; his body cremated, the ashes in three urns for North, Center and South, each buried on a hill with a simple house for visitors and trees planted. In May 1968, rereading it, he adds pages: after victory the Party put in order, the war''s wounds healed, the farm cooperatives spared the agricultural tax for a year, the cities and villages rebuilt.'
    n: '*Di chúc của Chủ tịch Hồ Chí Minh*, the draft of May 1968 ("Tháng 5-1968, khi xem lại thư này ...," 262), [[w.van-kien-dang-toan]], XXX, 260–64. Made public: 2004. Check: the pages written at 78 (260–61) are undated, the added pages dated May 1968 (262); and whether the drafts were first published with the Politburo''s notice no. 151-TB/TW of Aug. 19, 1989, on the testament and the day of his death (XXX, 228 n.). Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh]
