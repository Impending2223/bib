    c: 'Mao, Great Hall (Hall 118), evening, with Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Xie Fuzhi and others: against the "jet-plane" struggle sessions (Ji Dengkui in Henan, more than a hundred) and forced confessions;{1} the 16 Points define a counterrevolutionary by acts of murder, arson, poison, sabotage;{2} the bad are few. To Chen Boda: stay out of Fujian, do not act alone, and talk with the Group before seeing students.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, May 11, 1968; [[w.jianguo-yilai-mao-zedong]], XIX, 249 (May 11, 1968; a passage of Mao''s talk with Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Xie Fuzhi and others: whether the broad masses are protected or suppressed is the basic difference between the Communist Party and the Kuomintang, between the proletariat and the bourgeoisie, and between their dictatorships; set in bold type in the *Renmin ribao* and *Jiefangjun bao* editorial of June 2, 1968, n.1); [[w.mao-zedong-zhuan]], VI, ch. 77 n.10 (May 11 by the note, Mao''s speech on armed fighting, rebellion and other questions: to rectify the ranks and catch the bad is basically right; since he said the Cultural Revolution continues the Kuomintang–Communist war a batch of Kuomintang bad men have been caught, to go on but under control, with a point at which to put on the brakes; the Sixteen Points define a current counterrevolutionary as one who kills, burns, poisons or destroys state property, a few reactionary slogans need not mean arrest; unless real spies or real counterrevolutionaries, do not leave men without a way out; protect or suppress the masses is the root difference between Communists and Kuomintang; the book gives no hour, place or those present). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 77). To check: Mao Zedong 毛泽东, speech on armed fighting, rebellion and other questions 关于武斗、造反等问题的讲话 (record 讲话记录), May 11, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.10). Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Xie Fuzhi, Ji Dengkui, Chen Zaidao.'
