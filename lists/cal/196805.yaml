huan]], VI, ch. 77). To check: Xinhua News Agency, internal reference special issue Cultural Revolution Trends (Wenhua geming dongtai 文化革命动向) no. 1220, May 12, 1968: ''The experience of the military control committee of the Peking Xinhua Printing Works in rousing the masses to struggle against the enemy'' (Beijing Xinhua yinshuachang junguanhui fadong qunzhong kaizhan dui di douzheng de jingyan 北京新华印刷厂军管会发动群众开展对敌斗争的经验), sent to Mao by Yao Wenyuan May 13; the Center and the Group forwarded it to the whole country May 25 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 251 n.1); Zhongfa [1968] 74, May 25, 1968, in [[w.wenhua-dageming-yanjiu-ziliao]], II, 126 (cited by [[w.macfarquhar-maos-last-revolution]], 255 n.8); Mao Zedong 毛泽东, comment on the Xinhua *Wenhua geming dongtai* 《文化革命动向》 no. 1220 (manuscript 手稿), May 19, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.12); Mao Zedong, "Guanyu ''Beijing Xinhua yinshuachang junguanhui fadong qunzhong kaizhan duidi douzheng de jingyan'' de pishi," May 25, 1968, Cultural Revolution Database (cited by [[w.dikotter-cultural-revolution]], 184 n.3). Names: Mao Zedong, Yao Wenyuan.'
