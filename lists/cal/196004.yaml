    c: 'Shanghai 上海. Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡 and Yan Renhan 颜仁翰, deputy head of the Suzhou Pingtan Troupe 苏州市评弹团: doubting whether in the Ming 明 one could go by boat from Suzhou 苏州 to Zhuxianzhen 朱仙镇 or Kaifeng 开封, as the ballad *Miao jin feng* 《描金凤》 has it, he had the Institute of History 中国历史研究所 look into it on his return to Peking 北京: the waterway was open from the Sui 隋 and still in the Ming; copies of its paper for the old storytellers Yang Binkui 杨斌奎, Zhu Jiesheng 朱介生 and Xue Xiaoqing 薛筱卿; Kaifeng to Xiangyang 襄阳 (*Zhenzhu ta* 《珍珠塔》) and Nanyang 南阳 to Luoyang 洛阳 (*Shuang zhu feng* 《双珠凤》) still being looked into.'
