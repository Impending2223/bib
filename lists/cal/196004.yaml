    thread: china-leadership
    also: [soviet-union]
    c: '*Hongqi* (No. 8) prints "Long Live Leninism," its editors'' article for Lenin''s ninetieth anniversary.{1} The article holds the era unchanged and Leninism not outdated; it quotes no Khrushchev and no Soviet press.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, mid-Apr. 1960. [[w.lengxi-shinian-lunzhan-1956-1966]], 263–264 (the *Hongqi* editors'' article: the era unchanged, Leninism not outdated; no Khrushchev or Soviet press quoted); [[w.yang-jisheng-mubei]], II, 1150 (April 1960, for Lenin''s ninetieth anniversary the Center has three articles published, the *Hongqi* editors'' "Long Live Leninism," the *Renmin ribao* editorial "Forward along the path of the great Lenin," and Lu Dingyi''s report "Unite under Lenin''s revolutionary banner," setting out the Center''s views on peaceful coexistence and transition, revolution, war and peace and the nature of imperialism, aimed in fact at the Soviet party); [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (April 1960: the Sino-Soviet polemic begins); [[w.jian-zhou-enlai]], 451–452 (April 1960, Lenin''s ninetieth anniversary: several long essays on imperialism, peace and war and revolution, criticizing the "modern revisionists" without naming them; translated into many languages); [[w.yang-jisheng-tiandi-fanfu]], I, 95 (the three articles for Lenin''s ninetieth anniversary); [[w.westad-introduction]], 24 ("Long Live Leninism," *Hongqi*, Apr. 16, 1960, the first article to make the split plain to a general audience; 24 n.84); [[w.pleshakov-nikita-khrushchev-and-sino]], 238 (by April 1960, after "Long Live Leninism!", Soviet foreign-policy opinion holds that the Chinese deviations go too far, to be answered in the Soviet press); [[w.brothers-in-arms]], 380 (Deng Xiaoping''s speech of July 8, 1963, in the Soviet record: "three articles ''Long Live Leninism!'' and others," aimed at imperialism and Yugoslav revisionism, not openly at the CPSU); [[w.friedman-shadow-cold-war]], 51 (Mao has propaganda workers write three polemics for Lenin''s ninetieth birthday; the Soviets refuse to reply openly before the Paris summit); [[w.chang-friends-and-enemies]], 213–14 (in April 1960, for Lenin''s ninetieth anniversary, the CCP''s essays against "modern revisionism," the CPSU and Khrushchev not named; as printed in *Long Live Leninism*, 3d ed., 1960, 1–55, 214 n.22); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 252–302 ("Long Live Leninism" 列宁主义万岁, by the *Hongqi* 红旗 editors, dated Apr. 16, 1960, in full, printed from *Hongqi*, 1960, no. 8); [[w.lengxi-shinian-lunzhan-1956-1966]], 263. Check: the Yang Shangkun riji''s editors date the article''s publication in *Hongqi* Apr. 22, 1960 ([[w.yang-shangkun-riji]], I, 498 n.1). To check: [[w.sino-soviet-dispute]], 78–112 (cited by [[w.macfarquhar-maos-last-revolution]], 7 n.16); Chinese Embassy in Moscow to Foreign Ministry, "An Unfriendly Note from the Soviet Foreign Ministry," July 21, 1960 (cited by [[w.jian-zhou-enlai]], 452 n.38); [[w.luthi-sino-soviet-split]], 163 (cited by [[w.friedman-shadow-cold-war]], 51 n.103); Interviews in China, 1985 (cited by [[w.chang-friends-and-enemies]], 214 n.23). See [[cal.1960-04.china-leadership-3]]. Names: Khrushchev.'
