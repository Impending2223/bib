  - id: cal.1960-04.china-leadership-3
    when: Apr., mid
    date: 1960-04
    at: before 1960-04-11
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao reads Chen Boda''s drafts of *Hongqi*''s "Long Live Leninism," Apr. 14–16. Chen, Apr. 16: of fifteen mentions of Mao''s name, four left, after Deng Xiaoping and others revised it at his word; Khrushchev''s name added twice.{1} Mao adds a line on the Declaration;{2} notes "revisionism the main danger," "peace and war: two hands"; strikes out the passage on his "paper tiger" of 1946.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, mid-Apr. 1960. [[w.jianguo-yilai-mao-zedong]], XV, 162–165 (Mao''s eight comments and insertions on the two drafts, the manuscript dated only April 1960: on the Tito passage, "not thorough, add a few sentences"; on the passage that a socialist army driven over the border by an attack would still leave the people''s own will to make revolution, "Southeast Asia: the West will sow discord", the passage to be rewritten so that socialist states never send armies over their borders except when attacked; "revisionism is the main danger"; "peace and war: two hands"; "sum up the points of each section at the head and the end"; on the 1957 Moscow Declaration''s passage on revisionism, "quite correct, this is how it is"; an insertion that every socialist state should master more and more of the new technologies, atomic energy and rockets, for the people''s welfare; an insertion that the revolutionary proletarian party must rely on the semi-proletariat of the countryside, the poor peasants, in a worker-peasant alliance; Chen Boda''s letters of Apr. 14 and 16). Made public: 2013. To check: Hongqi editorial department, draft "Long live Leninism: for the ninetieth anniversary of Lenin''s birth", submitted by Chen Boda Apr. 14, 1960 with a letter to Mao (the Secretariat discussed it twice and Liu Shaoqi read it and made comments) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 164 n.1a); Hongqi editorial department, second draft of "Long live Leninism", submitted by Chen Boda Apr. 16, 1960 with a letter to Mao on revisions made after consulting Deng Xiaoping and others (cited by [[w.jianguo-yilai-mao-zedong]], XV, 164 n.1b). Names: Mao Zedong, Chen Boda, Deng Xiaoping, Khrushchev.'
    src:
