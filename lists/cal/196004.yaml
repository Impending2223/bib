  - id: cal.1960-04-08.voting-rights
    when: Apr. 8
    date: '1960-04-08'
    thread: voting-rights
    c: Senate passes H.R. 8601 as amended, [71–18](https://voteview.com/rollcall/RS0860284), the Senators of nine southern States against. Court-appointed voting referees; federal election records kept; obstruction of court orders and flight after a bombing made crimes. Judiciary's version taken up Mar. 30, [71–17](https://voteview.com/rollcall/RS0860269); Javits's equal job opportunity commission tabled on Dirksen's motion, Apr. 1, [48–38](https://voteview.com/rollcall/RS0860272).
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: Javits, Dirksen.'
    tags: [name:javits-jacob-k, name:dirksen-everett]
  - id: cal.1960-04-08.elections-1960
    when: Apr. 8
    date: '1960-04-08'
    thread: elections-1960
    c: 'Kennedy calls on Johnson in his Capitol office and asks him, by Johnson''s account, to get Robert Byrd "out of West Virginia": Byrd''s organization working for Humphrey before the primary. Johnson: Byrd''s own State.'
    n: '[[w.caro-passage-of-power]], 84–85. To check: Krock, "Notes of Conversation, May 3, 1960," Krock Papers (Reference File, LBJ Library); Houston Post, May 8, 1960 (cited by [[w.caro-passage-of-power]], 85). Names: Kennedy, Johnson, Byrd, Humphrey.'
