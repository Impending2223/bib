  - id: cal.1960-04-10.china-leadership
    when: Apr. 10
    date: '1960-04-10'
    place: peking
    thread: china-leadership
    c: 'The National People''s Congress closes, Mao present.{1} Zhou Enlai on the world and China''s foreign relations.{2} The 1960 plan adopted: steel 18.4 million tons, coal 425 million, grain 594 billion jin, cotton 53 million dan; and the National Program for Agriculture, 1956–67.{3} Zhu De presides at the closing, in the afternoon.{4} Peng Zhen attends.{5} Chen Yun attends the closing.{6} The session approves Li Fuchun''s report on the plan and Li Xiannian''s on the budget.{7}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 10, 1960. [[w.zhou-enlai-nianpu-1949]], II, 300, Apr. 10, 1960 (Zhou''s report on the international situation). [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 137 (Apr. 10, 1960; Zhou''s speech to the National People''s Congress on the international situation and foreign affairs: the socialist camp, the independence movements, no China-binding agreement without China, "two Chinas," Japan, an Asia-Pacific nuclear-free zone); [[w.yang-shangkun-riji]], I, 498 (Apr. 10, 1960; 9:30 a.m. to 1 p.m., at the Congress''s hall, Zhou''s report); [[w.deng-xiaoping-nianpu-1904]], III, 1540 (Apr. 10, 1960; morning, Deng at the plenary that hears Zhou Enlai on the world situation and China''s foreign relations; afternoon, at the closing. The session adopted the 1960 plan: steel 18.4 million tons, 38 percent over 1959; grain 594 billion jin, about 10 percent over); [[w.peng-zhen-nianpu-1902]], IV, 17 (Apr. 10, 1960; Peng Zhen at the morning plenary, which hears Zhou Enlai''s report on the international situation and China''s foreign relations, and at the closing in the afternoon); [[w.guan-vietnamese-communists-relations-with]], 141 (the session of Mar. 30–Apr. 10; on its last morning, behind closed doors, Zhou''s foreign-policy report, not on the agenda and added at the last minute, by British sources; only a summary published: almost nothing on Laos, Vietnam, Korea or the Middle East, the stress on peaceful coexistence and the Five Principles); [[w.zhu-de-nianpu-xinbian]], III, 1770 (Apr. 10, 1960; the morning Zhou Enlai 周恩来 on the world situation and China''s foreign relations; the afternoon Zhu De 朱德 presides at the closing; the resolutions on the plan, the accounts and budget, the drive to fulfill the agricultural program ahead of time and the Standing Committee''s report, and the 1956–67 National Program for Agricultural Development adopted); [[w.chen-yun-nianpu-xiuding]], III, 34 (Chen Yun at the closing); [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 190 n.1, 213 n.1 (Apr. 10, 1960, the session approves Li Fuchun''s report on the plan and Li Xiannian''s on the budget); [[w.zhu-de-nianpu-xinbian]], III, 1770; [[w.peng-zhen-nianpu-1902]], IV, 17; [[w.chen-yun-nianpu-xiuding]], III, 34; [[w.jianguo-yilai-zhongyao-wenxian]], XIII, 190 n.1, 213 n.1. Check: the 38 and 10 percent given above as the Deng chronology''s are not on III, 1539–1540. To check: FO 371/150407, FC 1016/18A, 12 April 1960, from Beijing to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 141 n.33a); FO 371/150408, FC 1016/21, 22 April 1960, from Beijing to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 141 n.33b); Zhou Enlai''s report to the National People''s Congress, the published version, SWB/FE/308/C/1-5 (cited by [[w.guan-vietnamese-communists-relations-with]], 141 n.34). Names: Mao Zedong, Zhou Enlai, Zhu De, Peng Zhen, Chen Yun, Li Fuchun, Li Xiannian.'
