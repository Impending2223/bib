    c: The provincial and prefectural committees send work groups to Meitan 湄潭 county after the incident comes to light, and take emergency steps to save the people, opening the granaries to arrange livelihood.{1} The county committee keeps the lid on, and the leaders of Suiyang 綏陽 commune drive people up the hills to keep them from the group.{2}
