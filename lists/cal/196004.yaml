    c: 'Eighteen former ministers and notables, Trần Văn Văn and Phan Khắc Sửu among them, meet at the Caravelle Hotel in Saigon and petition Diệm: corruption, one-party rule, liberties denied; reform asked. Released to the press days later.'
    n: 'FRUS 1958–60, I, docs. [142](https://history.state.gov/historicaldocuments/frus1958-60v01/d142), [149](https://history.state.gov/historicaldocuments/frus1958-60v01/d149) (Fishel to Diệm), [150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150). [[w.miller-misalliance]], 206 (the eighteen, the Caravelle, the letter''s complaints; not the day); [[w.gibbons-u-s-government-and]], I, 339–40 (the eighteen, the Caravelle, the manifesto''s complaints and demands; not the names, the day or the release); [[w.mann-grand-delusion]], 219 (a group of noncommunist leaders, some former ministers, meet in Saigon in April 1960 and issue a manifesto against Diệm''s repression; not the number, the Caravelle, the names, the day or the other complaints). Miller, 206, dates the letter Apr. 19, the day of doc. 142, which reports a draft to be handed Diệm at a meeting set for Apr. 25; FRUS''s editors date the statement Apr. 26, after the meeting at the Caravelle (doc. 142 n. 3); [[w.moyar-triumph-forsaken]], 105 (the eighteen at the Caravelle, Apr. 26; the manifesto''s complaints and demands). To check: [[w.catton-diems-final-failure]]; [[w.jacobs-cold-war-mandarin]]; *Bách Khoa*, no. 165, Nov. 15, 1963, 93, the letter''s Vietnamese text (cited by [[w.miller-misalliance]], 206 n.64); the manifesto''s text, Pentagon Papers, Gravel ed., I, 316–21 (cited by [[w.gibbons-u-s-government-and]], I, 339 n.162); Durbrow, oral history interview, LBJ Library (cited by [[w.moyar-triumph-forsaken]], 105 n.50, for an American hand in the manifesto); the Caravelle manifesto, The Pentagon Papers, vol. 1, 316–21 (cited by [[w.moyar-triumph-forsaken]], 105 n.49). Names: Trần Văn Văn, Phan Khắc Sửu, Ngô Đình Diệm. Check: Moyar, 105, by Durbrow''s later account, has Americans help write the manifesto.'
