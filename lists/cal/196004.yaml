    c: 'The NSC, 439th meeting, on Minuteman. Douglas recommends the Air Force''s plan. Eisenhower, by Kistiakowsky''s account: "Why don''t we go completely crazy and plan on a force of 10,000?" He approves it, to be kept informed, the missile untested.'
