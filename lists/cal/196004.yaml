  - id: cal.1960-04-12.governors-il
    when: Apr. 12
    date: '1960-04-12'
    thread: governors
    also: [elections-1960]
    c: 'Illinois, primaries for governor. Democratic: Kerner, a Cook County judge, slated by Daley''s organization, over Lohman, State treasurer, 649,253 to 232,345, 60.9 percent; Mitchell, once national chairman, 184,651, 17.3 percent. Republican: Stratton, seeking a third term, over Hayes Robertson, 499,365 to 345,340, 59.1 percent.'
    n: 'Votes: [Ill. *Official Vote*, 1960, p. 77](https://archive.org/details/officialvote1960illi/page/n78). Lohman''s, Mitchell''s and Robertson''s votes: [Wikipedia, "1960 Illinois gubernatorial election"](https://en.wikipedia.org/wiki/1960_Illinois_gubernatorial_election). To check: [[w.barnhart-kerner]]; [[w.kenney-political-passage]]; [[w.cohen-american-pharaoh]]. See [[cal.1960-04-12.elections-1960]]. Names: Kerner, Daley, Lohman, Mitchell, Stratton, Robertson.'
    tags: [state:il, name:kerner-otto, name:daley-richard-j, name:lohman-joseph-d, name:mitchell-stephen-a, name:stratton-william-g, name:robertson-hayes]
  - id: cal.1960-04-15.civil-rights-organizations
    when: Apr. 15–17
    date: '1960-04-15'
    thread: civil-rights-organizations
    also: [sit-ins]
    c: Easter weekend at Shaw University, Raleigh. The sit-ins' student leaders, called by Ella Baker of SCLC with SCLC's money. King and James Lawson speak. A Temporary Student Nonviolent Coordinating Committee formed, apart from SCLC.
    n: '[Recommendations of the Findings and Recommendations Committee](https://www.crmvet.org/docs/6004_shaw_recommendations.pdf), Youth Leadership Conference, Raleigh. King, [Statement to the Press at the Beginning of the Youth Leadership Conference](https://okra.stanford.edu/link/document600415-003), Apr. 15, 1960 (King Papers Project); printed in [[w.papers-of-martin-luther]], 426–27 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/statement-press-beginning-youth-leadership-conference)). SNCC Digital Gateway (K–J Cong. II.L). To check: [[w.carson-in-struggle]]; [[w.zinn-sncc]]; [[w.ransby-ella-baker-and-the]]; [[w.hogan-many-minds-one-heart]]; [[w.morris-origins-of-the-civil]]; [[w.halberstam-children]]; [[w.branch-parting-the-waters]]. Names: Baker, Martin Luther King, Lawson.'
    tags: [name:baker-ella, name:king-martin-luther-jr, name:lawson-james-m-jr]
