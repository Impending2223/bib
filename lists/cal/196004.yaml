  - id: cal.1960-04-22.europe-and-the-alliance
    when: Apr. 22–26
    date: '1960-04-22'
    thread: europe-and-the-alliance
    also: [berlin-and-vienna]
    c: 'De Gaulle''s state visit. At Camp David, Apr. 24: the summit''s procedure agreed, disarmament its main subject; de Gaulle to write Khrushchev. Address to a joint meeting of Congress, Apr. 25. Khrushchev at Baku the same day: the Soviet demands on Germany and Berlin restated.'
    n: 'Joint Statement Following Discussions With President de Gaulle, [1960–61 Pub. Papers 359](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=411) (Apr. 25, 1960). FRUS 1958–60, VII, pt. 2, docs. [166](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d166), [168](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d168), [169](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d169), [170](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d170). To check: [[w.gaulle-memoires-despoir]]; [[w.jackson-de-gaulle]]; [[w.eisenhower-white-house-years]]. See [[cal.1960-03-15.berlin-and-vienna]]. Names: de Gaulle, Khrushchev, Eisenhower.'
    tags: [name:de-gaulle-charles, name:khrushchev-nikita-s, name:eisenhower-dwight-d]
  - id: cal.1960-04-24.laos
    when: Apr. 24–26
    date: '1960-04-24'
    thread: laos
    c: Laos elects its Assembly. The CDNI and the government's candidates sweep; no Neo Lao Hak Xat candidate near a seat. Reports of the Army rigging the count in districts. State, Apr. 26, concerned at "indications elections have been so rigged as to invalidate them in eyes of world opinion."
    n: 'FRUS 1958–60, XVI, docs. [334](https://history.state.gov/historicaldocuments/frus1958-60v16/d334), [336](https://history.state.gov/historicaldocuments/frus1958-60v16/d336), [337](https://history.state.gov/historicaldocuments/frus1958-60v16/d337), [338](https://history.state.gov/historicaldocuments/frus1958-60v16/d338) (Dulles to the NSC, Apr. 28). To check: [[w.rust-before-the-quagmire]]; [[w.jacobs-universe-unraveling]]; [[w.dommen-conflict-in-laos]]; [[w.fall-anatomy-of-a-crisis]]; [[w.stevenson-end-of-nowhere]].'
  - id: cal.1960-04-24.mississippi-biloxi
    when: Apr. 24
    date: '1960-04-24'
    thread: mississippi
    also: [desegregation-public-places]
    c: Biloxi. Some 125 Negro men, women and children, led by Dr. Gilbert R. Mason, wade in at the city's beach, built with federal funds; white crowds attack them, the police standing by; fighting in the town into the night. Mason arrested Apr. 17 for swimming there. The beaches held public by the Fifth Circuit in 1968.
    n: '*United States v. Harrison County*, [399 F.2d 485](https://static.case.law/f2d/399/case-pdfs/0485-01.pdf), 486 (5th Cir. 1968). [Wikipedia, "Biloxi wade-ins"](https://en.wikipedia.org/wiki/Biloxi_wade-ins). [[w.dittmer-local-people]], 86–87 (86: the wade-in of Apr. 24, the mob with pipes, chains and bats, the police watching, the shooting in the town; not the count). Check: Dittmer, 86, gives Apr. 14 for Mason''s first swim, he and a few friends ordered off the beach by a policeman, and forty white men with pipes, chains and bats on Apr. 24. To check: [[w.katagiri-mississippi-state-sovereignty-commission]]; the affidavits of Dorothy Galloway and Gilbert Mason, May 3, 1960, NAACP Papers; *Jackson Daily News*, May 2, 1960; *New York Times*, May 18, 1960 (cited by [[w.dittmer-local-people]], 86 n.38). Names: Mason.'
