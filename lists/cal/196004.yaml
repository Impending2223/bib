  - id: cal.1960-04.china-leadership-27
    when: Apr.–May
    date: 1960-04
    place: peking
    thread: china-leadership
    c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 writes "Views on the Eighth Plenum of the Eighth Central Committee" 《对八届八中全会的看法》, notes of over fifty thousand characters. Rereading in April the plenum''s resolution on the anti-Party group headed by him 《中国共产党八届八中全会关于以彭德怀同志为首的反党集团的错误的决议》 weighed on him: it departs from the facts, settles old accounts and attacks the man, and makes his letter to Mao 毛泽东 of July 14, 1959 a "Right opportunist anti-Party program." His letter''s true motive, he writes: readjustment, above all of industry against agriculture, which lagged far behind; begun in 1959, a year would have done it. Practice, he writes, has shown it was not he who erred at Lushan 庐山; there was no "military club" 军事俱乐部 and no anti-Party group. Nine questions: the Beidaihe 北戴河 meeting; the nationwide steel drive; the pace of farm growth; who opposed the communes; the economic laws of socialism and capitalism; who "exaggerated to the extreme"; old accounts; irresponsible words; his view of Khrushchev 赫鲁晓夫.'
    n: '[[w.peng-dehuai-nianpu]], 759–760. Made public: 1998. Names: Peng Dehuai, Mao Zedong, Khrushchev.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai, name:mao-zedong, name:khrushchev-nikita-s]
