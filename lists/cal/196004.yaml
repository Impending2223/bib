    c: West Virginia, after Wisconsin;{1} its primary May 10.{2} Kennedy's own poll there, 70–30 for him in December, now 60–40 for Humphrey.{3} Franklin D. Roosevelt, Jr., campaigns for Kennedy.{4}
    n: '[[w.schlesinger-robert-kennedy-and-his]], 198–200 (the December poll; Roosevelt, after a meeting at Palm Beach with the Kennedys); [[w.white-making-of-the-president]], 100–07 (Harris''s poll turned; O''Brien; Roosevelt Jr.; the religious issue met head on from Apr. 25, 106). [[w.kallina-kennedy-v-nixon]], 62–63 (the polls; Roosevelt). [[w.sorensen-kennedy]], 139. Check the poll''s figures. To check: [[w.fleming-kennedy-vs-humphrey-west]]; "A Study of Voter Attitude in West Virginia on Presidential Preferences," January 1960, JFK Library (cited by [[w.kallina-kennedy-v-nixon]], 62 n.37). See [[cal.1960-03.elections-1960]]. Names: Kennedy, Humphrey, Roosevelt. Check: Kallina, 62 and 228–29 n.38: the April poll was of Kanawha County alone, 60–40 or 64–36 as White prints it; the poll of December and January, statewide, 54–23, 70–30 without the undecided.'
