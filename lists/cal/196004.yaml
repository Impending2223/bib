    c: 'Wujiahuayuan 吴家花园, Peking 北京. Peng Dehuai 彭德怀 studies political economy: Marx''s *Capital* 《资本论》, vol. I and parts of vols. II and III; part of the Party School''s 党校 Party history lectures 党史讲稿; the parts on military affairs of the *Selected Works of Mao Zedong* 《毛泽东选集》, vols. II–IV; Stalin''s *Economic Problems of Socialism in the USSR* 《苏联社会主义经济问题》.'
