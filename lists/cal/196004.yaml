    c: Wuwei 無為 county, Anhui 安徽, Yangshan 羊山 commune, Ruanjing 阮井 team. Zhou Kefa 周可法, sick, falls in the water leading an ox. The team leader Ren 任 says he did it to avoid the fields, slaps him twice and withholds his meal. Zhou hangs himself at noon that day. Ren has bound and beaten 19; 15 fled and one died.
