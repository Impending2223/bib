    c: 'Mao, on Deng Xiaoping''s note of Apr. 21 sending Liao Chengzhi and Liu Ningyi''s report of Apr. 17 on the Second Afro-Asian Peoples'' Solidarity Conference at Conakry: Yang Shangkun is to act on Deng''s view. Deng had written that the report tells so much that it might be printed for the Politburo and Secretariat, the central ministries and Party groups, and telegraphed to the provincial committees.{1} The report: the conference, Apr. 11–15, with 72 Asian and African delegations and observers, was filled with opposition to imperialism and colonialism; the reactionary and revisionist positions were routed; the Chinese delegation, under Liao, with Liu as deputy, held a weighty place.{2}'
