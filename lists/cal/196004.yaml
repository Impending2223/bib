    c: On a train from Bluefield, W.Va., to Indianapolis, during the West Virginia primary. Salinger, breakfasting with Billy Graham, asks him to sign a statement of Protestant ministers for tolerance in the election, then being drafted; he says he would. Sorensen tries for two days to reach him by telephone; Graham refuses, on the ground that he should not interfere in the election. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 34–35. Check: the day (the work gives none; West Virginia''s primary was May 10). Names: Salinger, Graham, Sorensen.'
