  - id: cal.1960-04-15.vietnam-hanoi
    when: Apr. 15
    date: '1960-04-15'
    thread: vietnam-hanoi
    c: 'Hanoi. The National Assembly''s twelfth session closes (Apr. 11–15). Tôn Đức Thắng, chairman of its Standing Committee: not yet the time to shift to war in the South; the people''s wish "work and peace"; the coming summit promises gains for peace. The subcommittee on the military service bill: defense some 16 percent of the budget this year, from 27 percent in 1955. Phạm Văn Bạch, deputy for Bến Tre: the South in "an extremely unsafe situation" while the North builds socialism.'
    n: '[[w.asselin-hanois-road-to-the]], 74–75. To check: Tôn Đức Thắng''s closing address, the subcommittee''s presentation and Phạm Văn Bạch''s address, Apr. 15, 1960, Hồ sơ 64, Phông Quốc hội, Vietnam National Archives Center 3 (cited by [[w.asselin-hanois-road-to-the]], 74–75 nn.11–13, 16). Names: Tôn Đức Thắng.'
