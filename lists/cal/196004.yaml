    c: 'The Gansu 甘肅 committee reports that the Tongwei 通渭 county committee is wholly degenerate: not a backward county but rotten throughout, led by the first secretary, Xi Daolong 席道隆, who shielded and used counterrevolutionaries and bad elements and held the committee''s leadership, and carried out from top to bottom a complete rightist opportunist line, among its "restorations of capitalism" four-level accounting with the team as base, livestock and seed to households, and "who sows reaps."'
