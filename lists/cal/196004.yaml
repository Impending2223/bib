    n: '[[w.kallina-kennedy-v-nixon]], 59; [[w.thomas-robert-kennedy]], 93 (Robert Kennedy at Cronkite after the broadcast; his call to Watson; the Columbia analysts told to justify their results, and their leaving CBS). [[w.sorensen-kennedy]], 137 n.2 (Roper on CBS). To check: Transcript, "What Happened in Wisconsin," CBS-TV, Apr. 5, 1960, RFK Papers, JFK Library (cited by [[w.kallina-kennedy-v-nixon]], 59 n.28). See [[cal.1960-04-05.elections-1960]]. Names: Cronkite, Kennedy, Robert Kennedy, Kirk, Stanton. Check: the day of Kennedy''s call to Stanton; Kallina gives none (59).'
    src:
      c: 7c109a38
      rows:
