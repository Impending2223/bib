  - id: cal.1960-04-07.china-leadership-3
    when: Apr. 7
    date: '1960-04-07'
    thread: china-leadership
    c: 'Mao drafts the Center''s comment forwarding the Jiangsu committee''s report of Mar. 30 on its six-level cadre conference: the conference was held very well, the report is sent for reference. He sends it to Liu Shaoqi, Deng Xiaoping and Peng Zhen and asks Yang Shangkun to have it telegraphed. The report: the conference, Mar. 19, took two days on the situation and Mar. 22–28 on the transition to commune ownership and the commune economy; hard argument on "whether to pass over" and on conditions; the three-level ownership with the brigade as base to stay for now; "levelling and transfers" shown unworkable; the brigade economy over 70 percent of income, the commune''s about 10.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 148–150 (Apr. 7, 1960); [[w.peng-zhen-nianpu-1902]], IV, 16 (Apr. 7, 1960; Peng Zhen, Liu Shaoqi and Deng Xiaoping receive the Center''s forwarding of the Jiangsu report and Mao''s comment: the cadres learned that commune-level economy must rest on brigade-level economy, "one levelling, two transfers" and the "communist wind" will not do; Mao: "干部会议开得很好", to go to the provinces by telegram through Yang Shangkun). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Jiangsu Provincial Committee, report of Mar. 30, 1960 to the Center, Mao and the Shanghai Bureau on its six-level Party cadre conference of Mar. 19–28 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 148 n.1). See [[cal.1960-03-14.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Yang Shangkun.'
