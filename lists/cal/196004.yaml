    c: Bo 亳 county, Anhui 安徽. Liang Zhiyuan 梁志遠 inspects the county's dissuasion station 勸阻站 for vagrants. Its doctor, Yang Wende 楊文德, tells him many dead vagrants have been dug up and eaten. At the burial ground Liang sees many opened graves, rags on the ground and the head of a middle-aged man. The doctor says he has told the public security bureau many times and no one has taken a position.
    n: '[[w.yang-jisheng-mubei]], I, 308 n.83, 311 (the section''s note). Made public: 2003 (Liang Zhiyuan''s article, signed "Lu Ping, a Peking scholar," in *Kaifang* 《開放》, Hong Kong, 2003 no. 10: I, 308 n.83). Printed for internal circulation: *Chunqiu wencun* 《春秋文存》, the internal edition of *Yanhuang chunqiu*, a few dozen copies (I, 299, 308 n.83; no year given). To check: Liang Zhiyuan 梁志遠, "Guanyu ''tezhong anjian'' de huibao: Anhui Boxian ren chi ren jianwen lu" 《關於「特種案件」的彙報——安徽毫縣人吃人見聞錄》 (so printed), *Kaifang* 2003 no. 10 (cited by [[w.yang-jisheng-mubei]], I, 308 n.83).'
