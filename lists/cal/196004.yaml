  - id: cal.1960-04.africa
    when: Apr.
    date: 1960-04
    thread: africa
    c: 'Guinea. The three-year plan, drawn up largely under Charles Bettelheim, introduced by Keita N''Famara, Minister of Planning, at the Guinean Democratic Party''s economic conference: "social differentiation" to be liquidated, no "path of the creation of a bourgeoisie"; no heavy industry yet, for want of capital and cadres; "above all ... a plan of the development of agricultural production." His speech later printed, abridged, in *Pravda* and *Narody Azii i Afriki*.'
    n: '[[w.friedman-shadow-cold-war]], 78. To check: [[w.amin-trois-experiences-africaines-de]], 143 (cited by [[w.friedman-shadow-cold-war]], 78 n.69); Charles Bettelheim, “China’s Economic Growth,” in China Shakes the World Again, 10 (cited by [[w.friedman-shadow-cold-war]], 78 n.70); Keita N’Famara, “Sozdanie Ekonomicheskikh Osnov Nezavisimoĭ Gvineĭ,” Narody Azii i Afriki 2 (1961): 53–61, 53–61 (cited by [[w.friedman-shadow-cold-war]], 78 n.71); Keita N’Famara, “Sozdanie Ekonomicheskikh Osnov Nezavisimoĭ Gvineĭ,” Narody Azii i Afriki 2 (1961): 53–61, 54 (cited by [[w.friedman-shadow-cold-war]], 78 n.72); Keita N’Famara, “Sozdanie Ekonomicheskikh Osnov Nezavisimoĭ Gvineĭ,” Narody Azii i Afriki 2 (1961): 53–61, 56 (cited by [[w.friedman-shadow-cold-war]], 78 n.73).'
    src:
      c: 812f8044
      rows:
        - 'w.friedman-shadow-cold-war 78: all'
        - 'via x.undated.charles-bettelheim-chinas-economic-growth-china-shakes: ?'
        - 'via x.1961.keita-nfamara-sozdanie-ekonomicheskikh-osnov-nezavisimoi-gvinei: ?'
