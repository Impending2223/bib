    c: 'Eighteen former ministers and notables, Trần Văn Văn and Phan Khắc Sửu among them, meet at the Caravelle Hotel in Saigon and petition Diệm: corruption, one-party rule, liberties denied; reform asked.{1} Released to the press days later.{2}'
