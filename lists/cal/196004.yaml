  - id: cal.1960-04-02.china-leadership-6
    when: Apr. 2
    date: '1960-04-02'
    place: peking
    thread: china-leadership
    c: 'Peking 北京. Peng Zhen 彭真 with Liu Ren 刘仁 and others on trying urban people''s communes: unlike the rural, the bounds those of the police stations and street offices; the laboring poor first, others kept out; production groups and work taken home; ownership by the whole people or collective, wages not too high; schools and shops not handed down; no state industry lowered to collective; housing for mess halls and nurseries; the capitalists left outside for now, "看半年再说".'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 13–14. Made public: 2012. Names: Peng Zhen, Liu Ren.'
