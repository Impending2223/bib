    c: Huzhu 互助 county, Qinghai 青海, Hongyazigou 紅崖子溝 commune, Shilang 石郎 brigade, Wozi 窩子 team, where over 40 of some 150 have starved. By Yin Shusheng's 尹曙生 account, Ma Xianzhen 馬賢珍, the team head, at his mother's urging secretly shares out the team's last 4,420 jin of grain, trades four of its sheep for 800 jin of vegetables for the members, and leads them to dig wild greens. The brigade reports him; the public security bureau arrests him as a "bad element" 壞分子, and a court gives him five years.
