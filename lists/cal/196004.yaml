    c: 'Seoul, Apr. 26: crowds in the streets; McConaughy and Magruder call on Rhee; he says he will step down if the people wish. The Assembly, unanimous, asks his resignation and new elections.{1} Apr. 27: Rhee resigns;{2} Huh Chung acting President. Apr. 28: Yi Ki-pung and his family dead by their own hands.{3}'
