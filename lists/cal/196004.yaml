  - id: cal.1960-04-06.elections-1960-primaries-2
    when: Apr. 6
    date: '1960-04-06'
    thread: elections-1960-primaries
    c: 'Charleston, W. Va., after the meeting at the Kanawha Hotel. Robert Kennedy, from a telephone booth, to Kennedy in Washington: the way to avoid a religious fight is to persuade Humphrey to withdraw. Kennedy: "It can''t be that bad," the seventy-thirty poll. Robert Kennedy: "The people who voted for you in that poll have just found out that you''re a Catholic." Kennedy: "Come back to Washington for a few days, and we''ll see what we can do with Hubert."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 181–82 (O''Donnell''s and Powers''s account); [[w.goodwin-remembering-america]], 84 (O''Donnell, sent as soon as the Wisconsin votes were in, with the West Virginia county and political leaders: "That''s right, but we didn''t know he was Catholic"; O''Donnell telephones Kennedy, "is there any way we can win down there?" "Yes ... you can convert"; not Robert Kennedy, the booth, the poll or the words). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Check: who called. [[w.goodwin-remembering-america]], 84, has O''Donnell meet the county leaders after Wisconsin and telephone Kennedy: "Yes ... you can convert.". Names: Kennedy, Robert Kennedy, Humphrey. Check: the day: the calendar has the meeting at the Kanawha Hotel that preceded the call on Apr. 8, from its minutes (cal.1960-04-08.elections-1960-2); the authors have it on the morning after the Wisconsin primary.'
    src:
