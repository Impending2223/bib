  - id: cal.1960-04-02.china-leadership-8
    when: Apr. 2
    date: '1960-04-02'
    thread: china-leadership
    c: 'Zhu De 朱德 to the Center 中共中央 and Mao Zedong 毛泽东, a report on his inspection of Guizhou 贵州, Sichuan 四川 and Henan 河南: farming and its technical reform to suit each place, not one pattern; old equipment from the big plants and some new machine tools for the county and commune repair shops, toward semi-mechanized and mechanized farming; commodity production in farming and industry; small hydropower stations, shipping on the rivers and canals, fish in ponds and reservoirs; wells and canals together on the plains, water held in stages in the hills.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1771. Made public: 2016. Names: Zhu De, Mao Zedong.'
    tags: [polity:prc, ok:fields-place, name:zhu-de, name:mao-zedong, vis:only:prc]
