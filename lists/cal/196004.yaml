  - id: cal.1960-04-08.elections-1960-2
    when: Apr. 8
    date: '1960-04-08'
    thread: elections-1960
    also: [robert-kennedy]
    c: 'Charleston, W. Va. Robert Kennedy asks the Kennedy organizers for "a cold-blooded appraisal" of West Virginia, county by county. The answer: "He''s a Catholic. That''s our God-damned problem"; the December poll of 70 to 30 made before anyone knew it. His strategy: meet religion head on, then show "there is something more important"; "food, family and flag in southern West Virginia."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 198. [[w.kallina-kennedy-v-nixon]], 64 (the meeting and its question). To check: minutes, "Meeting re West Virginia Primary — April 8, 1960," RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 198 n.26); [[w.odonnell-johnny-we-hardly-knew]], 161 (cited by [[w.schlesinger-robert-kennedy-and-his]], 198 n.27); "Meeting Re West Virginia Primary—April 8, 1960," RFK Papers, JFK Library; Chalmers M. Roberts OHI, Nov. 8, 1977, JFK Library (cited by [[w.kallina-kennedy-v-nixon]], 64 n.41). See [[cal.1960-04.elections-1960]]. Names: Robert Kennedy, Kennedy. Check: Kallina, 64 and 229 n.41, reads the minutes as reporting trouble from Kennedy''s religion in five counties only, most saying it no great problem; not the answer given here.'
    src:
      c: cb8fc0ec
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 198: all'
        - 'via w.schlesinger-robert-kennedy-and-his 198 n.26: A, D'
        - 'via w.schlesinger-robert-kennedy-and-his 198 n.28: D'
        - 'w.kallina-kennedy-v-nixon 64: B'
        - 'via w.kallina-kennedy-v-nixon 64 n.41a: B'
        - 'via w.kallina-kennedy-v-nixon 64 n.41b: B'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, state:wv]
