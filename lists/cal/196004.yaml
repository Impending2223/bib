  - id: cal.1960-04-26.japan-and-korea
    when: Apr. 26–28
    date: '1960-04-26'
    thread: japan-and-korea-rhee
    c: 'Seoul, Apr. 26: crowds in the streets; McConaughy and Magruder call on Rhee; he says he will step down if the people wish. The Assembly, unanimous, asks his resignation and new elections. Apr. 27: Rhee resigns; Huh Chung acting President. Apr. 28: Yi Ki-pung and his family dead by their own hands.'
    n: 'FRUS 1958–60, XVIII, docs. [308](https://history.state.gov/historicaldocuments/frus1958-60v18/d308), [309](https://history.state.gov/historicaldocuments/frus1958-60v18/d309), [310](https://history.state.gov/historicaldocuments/frus1958-60v18/d310), [313](https://history.state.gov/historicaldocuments/frus1958-60v18/d313). The President''s News Conference, [1960–61 Pub. Papers 360](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=412) (Apr. 27, 1960). See [[cal.1960-03-15.japan-and-korea]]. Names: McConaughy, Magruder, Rhee, Huh Chung, Yi Ki-pung.'
    tags: [name:mcconaughy-walter-p-jr, name:magruder-carter-b, name:rhee-syngman, name:huh-chung, name:yi-ki-pung]
  - id: cal.1960-04-26.vietnam
    when: Apr. 26
    date: '1960-04-26'
    thread: vietnam
    c: 'Eighteen former ministers and notables, Trần Văn Văn and Phan Khắc Sửu among them, meet at the Caravelle Hotel in Saigon and petition Diệm: corruption, one-party rule, liberties denied; reform asked. Released to the press days later.'
    n: 'FRUS 1958–60, I, docs. [142](https://history.state.gov/historicaldocuments/frus1958-60v01/d142), [149](https://history.state.gov/historicaldocuments/frus1958-60v01/d149) (Fishel to Diệm), [150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150). [[w.miller-misalliance]], 206 (the eighteen, the Caravelle, the letter''s complaints; not the day); [[w.gibbons-u-s-government-and]], I, 339–41 (the meeting and the petition). Miller, 206, dates the letter Apr. 19, the day of doc. 142, which reports a draft to be handed Diệm at a meeting set for Apr. 25; FRUS''s editors date the statement Apr. 26, after the meeting at the Caravelle (doc. 142 n. 3). To check: [[w.catton-diems-final-failure]]; [[w.jacobs-cold-war-mandarin]]; *Bách Khoa*, no. 165, Nov. 15, 1963, 93, the letter''s Vietnamese text (cited by [[w.miller-misalliance]], 206 n.64). Names: Trần Văn Văn, Phan Khắc Sửu, Ngô Đình Diệm.'
