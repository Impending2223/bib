  - id: cal.1960-04-18.china-leadership-8
    when: Apr. 18
    date: '1960-04-18'
    thread: china-leadership
    c: 'Mao drafts the Center''s comment forwarding the State Planning Commission''s article "Every trade making machinery is the good way to develop the machine industry at high speed": a good document, to be followed, and it may go in the Party journals. He sends it to Deng, Peng Zhen and Li Fuchun, and Yang Shangkun is to send it out. The article: besides the two specialist ministries (First Machine Building, Agricultural Machinery), two half-machine ministries (Railways, Textiles) and seventeen small machine ministries make about half the planned products; the road is unified planning with every trade making its own equipment.'
