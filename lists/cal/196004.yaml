  - id: cal.1960-04.china-leadership-20
    when: Apr.
    date: 1960-04
    place: meitan
    thread: china-leadership
    also: [china]
    c: Meitan 湄潭 county, Guizhou 貴州, Suiyang 綏陽 commune. With the provincial and prefectural work group in the county, the commune's party leaders, besides driving people into the hills away from the group, shut up the gravely sick and the orphans; thirty-six die in one tobacco-curing house. The commune has the dead thrown into the sinkholes 消洞 behind it, some still breathing; the people call them the "ten-thousand-person pit."
    n: '[[w.yang-jisheng-mubei]], I, 573, 574 n.12 (the section the note closes). The words: 1960年4月 (I, 573). Made public: 2007 (Liu Xingsheng 劉興盛, article on the Meitan 湄潭 incident, *Yanhuang chunqiu* 2007 no. 11, the section''s source: I, 574 n.12). To check: Liu Xingsheng 劉興盛, "Lishi de beiju, chentong de jingshi: 1959 nian Guizhou sheng ''Meitan shijian'' shimo" 《歷史的悲劇　沉痛的警示——1959年貴州省「湄潭事件」始末》, *Yanhuang chunqiu* 炎黃春秋 2007 no. 11 (cited by [[w.yang-jisheng-mubei]], I, 574 n.12); [[w.dikotter-maos-great-famine]], 314 n.21. See [[cal.1960-04.china-leadership-15]].'
