    at: after 1960-04-13
    thread: china-leadership
    also: [cuba]
    c: 'Mao annotates and revises the International Liaison Department''s Chinese translation, printed Apr. 13, of the draft program of Cuba''s Popular Socialist Party. On the passage on winning most of the urban petty bourgeoisie he marks a question and a note on the national bourgeoisie; he rewrites the list of sympathies behind the Cuban revolution to name the peoples of Latin America, Asia and Africa and the socialist camp and the oppressed of the West, striking that of the American people; he writes in clauses on carrying out the land-reform law quickly and wholly for poor peasants and middle peasants short of land, on protecting existing industry and raising capital by bank control, import limits, a progressive tax on excess profit and loans without political strings, on priority for agriculture and light industry without neglecting heavy, on workers'' sacrifices not simply filling the capitalists'' pockets, on living wages, and on a jury system, a one-chamber parliament and a patriotic front. Marginal queries: foreign banks confiscated without compensation, redeeming and abolishing concessions, larger cooperatives in stages, small private plots; steel and machine-building to be added.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 192–197 (Apr. 1960). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the day; the translation is dated Apr. 13. To check: Partido Socialista Popular of Cuba, draft program adopted at the plenum of its National Committee in October 1959, for approval by a party congress (cited by [[w.jianguo-yilai-mao-zedong]], XV, 195 n.1a); Central Committee International Liaison Department, Chinese translation of the draft program of the Popular Socialist Party of Cuba, printed Apr. 13, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 195 n.1b). Names: Mao Zedong.'
