  - id: cal.1960-04-02.china-leadership-2
    when: Apr. 2–4
    date: '1960-04-02'
    thread: china-leadership
    c: Zhou Enlai, Apr. 2–4, at the Secretariat and the Politburo, which discuss the main points of the plan for the last three years of the Second Five-Year Plan and the report Tan Zhenlin is to make to the National People's Congress on reaching the agricultural program early.{1} Apr. 2, morning, the Secretariat finds the draft report on reaching the agricultural program early "no good, to be rewritten."{2} Deng Xiaoping presides at the Secretariat.{3} Apr. 4, 8 to 10 p.m., the Politburo passes Li Fuchun's and Tan Zhenlin's drafts.{4} Liu Shaoqi presides; Zhu De attends.{5}
    n: '[[w.zhou-enlai-nianpu-1949]], II, 301 (Apr. 2, 1960); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 483 (Apr. 4, 1960; Liu presides at the Politburo meeting on the State Planning Commission Party group''s key points of the supplementary plan for 1960–62 and Tan Zhenlin''s report to the Congress); [[w.yang-shangkun-riji]], I, 495–496 (Apr. 2–4, 1960; Apr. 2, morning: the Secretariat on the report to the Congress on finishing the agriculture program early, "no good, to be rewritten"; 4 to 6:30 p.m., the Secretariat on the draft of the forum''s report on the supplementary plan for 1960–62; Apr. 3, 8 p.m. to midnight, the Secretariat on Tan Zhenlin''s draft report; Apr. 4, 8 to 10 p.m., the Politburo passes Li Fuchun''s and Tan Zhenlin''s drafts); [[w.deng-xiaoping-nianpu-1904]], III, 1537–1538 (Apr. 2–4, 1960; Deng presides at the Secretariat the morning of the 2nd on Tan Zhenlin''s draft report for the National People''s Congress, "Strive to fulfil the national program for agricultural development ahead of time", the afternoon on the State Planning Commission Party group''s draft main points of the supplementary plan for 1960–62, and the evening of the 3rd again on Tan''s draft, sent on to the Politburo; Zhou attends; the evening of the 4th Deng at Liu Shaoqi''s Politburo on both); [[w.peng-zhen-nianpu-1902]], IV, 13 (Apr. 2, 1960, morning, the Secretariat''s 176th meeting, on Tan Zhenlin''s draft report to the Congress on reaching the agricultural program early; afternoon, its 177th, on the State Planning Commission''s draft main points of the supplementary plan for 1960–62; Peng Zhen at both, Zhou Enlai attending); [[w.peng-zhen-nianpu-1902]], IV, 14 (Apr. 3, 1960; the Secretariat''s 178th meeting revises Tan Zhenlin''s draft and sends it to the Politburo; Peng Zhen there, Zhou Enlai attending); [[w.peng-zhen-nianpu-1902]], IV, 15 (Apr. 4, 1960; Peng Zhen at the Politburo meeting, Liu Shaoqi presiding, on the State Planning Commission Party group''s draft main points of the supplementary plan and Tan Zhenlin''s draft report); [[w.zhu-de-nianpu-xinbian]], III, 1771 (Apr. 4, 1960, evening; Zhu De 朱德 at the Politburo 中共中央政治局 meeting Liu Shaoqi 刘少奇 presides); [[w.yang-shangkun-riji]], I, 495; [[w.deng-xiaoping-nianpu-1904]], III, 1537–1538; [[w.yang-shangkun-riji]], I, 496; [[w.zhu-de-nianpu-xinbian]], III, 1771. Made public: 1996. Names: Zhou Enlai, Tan Zhenlin, Deng Xiaoping, Li Fuchun, Liu Shaoqi, Zhu De.'
