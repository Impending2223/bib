    when: Apr., late
    date: 1960-04
    at: before 1960-04-21
    thread: china-leadership
    c: 'Mao drafts the Center''s comment forwarding Guangdong''s report of Apr. 12 on the "five many": the harm "like a great earthquake"; every first secretary down to the prefectures to read it, inquire and act.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, late Apr. 1960. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1960-04.china-leadership-4
    when: Apr., late
    date: 1960-04
    at: before 1960-04-21
    thread: china-leadership
    c: 'Mao revises Deng Xiaoping''s draft of Apr. 24, the Center''s comment on Nie Rongzhen''s letter on publicity for the "four modernizations": for "do ten, say eight or nine," "say five, even one or two," the most secret not at all; boasting "strictly" prevented.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, late Apr. 1960. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Nie Rongzhen.'
    tags: [polity:prc, name:mao-zedong, name:deng-xiaoping, name:nie-rongzhen, vis:only:prc]
  - id: cal.1960-04.china-leadership-2
    when: Apr., late
    date: 1960-04
    at: before 1960-04-21
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao on the points of Kuusinen''s speech of Apr. 22 at Moscow for Lenin''s anniversary (dogmatism behind the times; new weapons make war impossible; sober statesmen in the imperialist camp): "this must be criticized"; an article, "A Discussion with Comrade Kuusinen," for a few at the center first, then perhaps in print or for senior cadres only. To Yang Shangkun, Deng Xiaoping and Chen Boda.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, late Apr. 1960. Made public: 2013. Names: Mao Zedong, Kuusinen, Yang Shangkun, Deng Xiaoping, Chen Boda.'
    tags: [polity:prc, name:mao-zedong, name:kuusinen-otto-v, name:deng-xiaoping, name:chen-boda, vis:only:prc]
  - id: cal.1960-04.china-leadership-5
    when: Apr., early
    date: 1960-04
    at: before 1960-04-01
    thread: china-leadership
    also: [soviet-union]
    c: 'Two Secretariat meetings, Deng Xiaoping presiding, on the first drafts of the Lenin-anniversary pieces: the *Renmin ribao* editorial (Hu Qiaomu, Wu Lengxi), Lu Dingyi''s speech, the *Hongqi* editors'' article (Chen Boda), and the pamphlets of Lenin''s writings. Seven matters set: the era, Leninism not outdated, revolutionary doctrine, war and peace, imperialism''s nature, revolution and parliament, revisionism and dogmatism. The editorial to take the situation and the United States, Lu proletarian revolution and dictatorship, *Hongqi* the era; unity kept, Yugoslavia the target.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 259–260. Made public: 1999. Names: Deng Xiaoping, Lu Dingyi, Chen Boda. Check: the days: "early April".'
    src:
      c: 6de39839
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 259–260: all'
    tags: [polity:prc, name:deng-xiaoping, name:lu-dingyi, name:chen-boda, vis:only:prc]
  - id: cal.1960-04.china-leadership-6
    when: Apr., early
    date: 1960-04
    at: before 1960-04-01
    thread: china-leadership
    also: [soviet-union]
    c: Politburo Standing Committee at Mao's house, afterward ("later"), Deng reporting the Secretariat's points. Liu Shaoqi and Zhou Enlai agree to the division of the three pieces; Mao too. Reason fully, treat opponents differently, leave room; criticize chiefly the Yugoslav views, quote no Soviet and above all not Khrushchev.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 260–261. Made public: 1999. Names: Deng Xiaoping, Liu Shaoqi, Zhou Enlai, Mao Zedong, Khrushchev. Check: the day: Wu says only that it followed the Secretariat; before the pieces ran (Apr. 16, 22).'
    src:
      c: 1982d583
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 260–261: all'
    tags: [polity:prc, name:deng-xiaoping, name:liu-shaoqi, name:zhou-enlai, name:mao-zedong, name:khrushchev-nikita-s, vis:only:prc]
