  - id: cal.1960-04.middle-east
    when: Apr.
    date: 1960-04
    thread: middle-east
    c: 'The "Health Alteration Committee," unanimously, to the Deputy Director for Plans: a "disabling operation" against the Iraqi colonel, the Chief of Operations advising it "highly desirable." Barnes approves for Bissell. The operation approved: a monogrammed handkerchief with an incapacitating agent, to be mailed to the colonel from an Asian country.'
    n: '[[w.sen-church-alleged-assassination-plots]], 181 n. (Memo, Deputy Chief CI to DDP, dated as printed "4/1/62"; the mailing, by Scheider''s recollection, undated; the CIA, 1975: the handkerchief "in fact never received (if, indeed, sent)"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Deputy Chief CI to DDP (cited by [[w.sen-church-alleged-assassination-plots]], 181 n.). See [[cal.1960-02-25.middle-east]]. Names: Barnes, Bissell. Check: the day; the memorandum''s year printed 1962.'
    tags: [name:barnes-c-tracy, name:bissell-richard-m-jr]
  - id: cal.1960-04.elections-1960-religion-2
    when: Apr.
    date: 1960-04
    thread: elections-1960-religion
    c: During the West Virginia primary, at Kennedy's asking, Sorensen asks the Senate chaplain, the Reverend Mr. Harris, for a public statement deploring religious bigotry and prejudice in presidential politics. Harris, who had assured Kennedy he would speak out at the appropriate time, declines, mindful, Sorensen supposes, that he served Nixon, Johnson, Humphrey and Symington too.
    n: '[[w.sorensen-counselor]], 160–61 (Sorensen''s account, written in 2008; Kennedy had asked him to explore it; Sorensen then turned to Sayre, Arthur L. Miller, Bishop Oxnam, Blake and Dahlberg, not entered). See [[cal.1960-05-03.elections-1960-2]]. Names: Sorensen, Kennedy, Nixon, Johnson, Humphrey, Symington. Check: the day and the month.'
    tags: [name:sorensen-theodore-c, name:kennedy-john-f, name:nixon-richard-m, name:johnson-lyndon-b, name:humphrey-hubert-h, name:symington-william-s]
