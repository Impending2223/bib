  - id: cal.1960-04-19.sit-ins
    when: Apr. 19
    date: '1960-04-19'
    thread: sit-ins
    c: Nashville. Z. Alexander Looby's house bombed before dawn; he and his wife unhurt. Some thousands march in silence to City Hall. Mayor Ben West, asked by Diane Nash, says the lunch counters should be desegregated.
    n: 'To check: [[w.halberstam-children]]. See [[cal.1960-02-01.sit-ins]]. Names: Nash, Looby, Ben West.'
    tags: [name:nash-diane, name:looby-z-alexander, name:west-ben]
  - id: cal.1960-04-19.governors-la
    when: Apr. 19
    date: '1960-04-19'
    thread: governors
    also: [elections-1960]
    c: 'Louisiana, general election for governor: Davis (D) over Grevemberg (R), a former superintendent of State police, 407,907 to 86,135, 80.5 percent; a States'' Rights candidate 12,515, 2.5 percent. The first Republican nominee for governor since 1952.'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1960_Louisiana_gubernatorial_election). Check: La. Secretary of State, *General Election Returns*, 1960. The shares computed from the article''s votes (it prints 81.52 for Davis). See [[cal.1960-01-09.governors-la]]. Names: Jimmie Davis, Grevemberg.'
    tags: [name:davis-jimmie-h, name:grevemberg-francis, state:la]
  - id: cal.1960-04-19.japan-and-korea-rhee
    when: Apr. 19
    date: '1960-04-19'
    thread: japan-and-korea-rhee
    c: 'Seoul: university and high-school students march on the government; police fire into the crowds; martial law, and an army division released by the UN Command. Herter hands the Korean Ambassador an aide-mémoire: the elections and the violence a matter of American concern.'
    n: 'FRUS 1958–60, XVIII, docs. [298](https://history.state.gov/historicaldocuments/frus1958-60v18/d298), [299](https://history.state.gov/historicaldocuments/frus1958-60v18/d299), [301](https://history.state.gov/historicaldocuments/frus1958-60v18/d301) (Herter and Eisenhower by telephone), [302](https://history.state.gov/historicaldocuments/frus1958-60v18/d302) (the aide-mémoire). See [[cal.1960-03-15.japan-and-korea]]. Names: Herter.'
    tags: [name:herter-christian-a]
