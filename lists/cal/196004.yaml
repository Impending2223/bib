    c: 'Mao, on Lu Dingyi''s draft of Apr. 4 of his speech "Teaching must be reformed", for the National People''s Congress: read, very good, returned to Lu. The draft: trials on a large scale in full-time primary and middle schools, with shorter years, higher standard, controlled hours and more labor, the change to come over ten to twenty years; primary schooling for all and illiteracy among young and adult workers and peasants to be ended in the Second Five-Year Plan, the middle school in the third; a school course of some ten years reaching the level of a present first-year university. Lu delivers it Apr. 9; *Renmin ribao* prints it Apr. 10.'
