  - id: cal.1960-04-30.vietnam-hanoi
    when: Apr. 30
    date: '1960-04-30'
    thread: vietnam-hanoi
    also: [vietnam, japan-and-korea-rhee]
    c: 'The Party Center to the Nam Bộ and Interzone V Executive Committees, cable no. 34, on South Korea: the movement against "the U.S.-Rhee" regime strong in the cities, among students and intellectuals, weak in the countryside, the army aloof or repressing, its leaders pro-American bourgeois; one cruel agent replaced by a subtler. Its lessons: mass political struggle can shake a dictatorship but without military force cannot win; the students matter most; the enemy''s quarrels at the top to be used. Members not to hope too much from it; the cities, Saigon and Chợ Lớn''s students above all, to be better led.'
    n: '*Điện của Trung ương Đảng số 34 gửi Xứ uỷ Nam Bộ, Khu uỷ V*. [[w.van-kien-dang-toan]], XXI, 306–08. Made public: 2002. Names: Rhee.'
    tags: [polity:us, polity:rok, polity:rvn, name:rhee-syngman, polity:drv]
  - id: cal.1960-04.china-leadership-3
    when: Apr., mid
    date: 1960-04
    at: before 1960-04-11
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao reads Chen Boda''s drafts of *Hongqi*''s "Long Live Leninism," Apr. 14–16. Chen, Apr. 16: of fifteen mentions of Mao''s name, four left, after Deng Xiaoping and others revised it at his word; Khrushchev''s name added twice. Mao adds a line on the Declaration; notes "revisionism the main danger," "peace and war: two hands"; strikes out the passage on his "paper tiger" of 1946.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, mid-Apr. 1960. Made public: 2013. Names: Mao Zedong, Chen Boda, Deng Xiaoping, Khrushchev.'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, name:deng-xiaoping, name:khrushchev-nikita-s, vis:only:prc]
  - id: cal.1960-04-30.china-leadership
    when: Apr. 30
    date: '1960-04-30'
    thread: china-leadership
    c: 'Tianjin, on the train. Mao with Tan Zhenlin, Liao Luyan, Liu Zihou and Wan Xiaotang after the rural work conference. Tan: the deaths in Fuyang, Anhui, isolated, rations above the reports. Mao: the real state unknown, to the center and to the provinces; grain hidden "because poor."'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 30, 1960. Made public: 2013. Names: Mao Zedong, Tan Zhenlin, Liao Luyan, Liu Zihou, Wan Xiaotang, Yang Shangkun.'
    tags: [polity:prc, name:mao-zedong, name:tan-zhenlin, vis:only:prc]
