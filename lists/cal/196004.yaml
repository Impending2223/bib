    c: 'Zhou Enlai''s second talk with U Nu.{1} U Nu asks that the Sino-Indian boundary be treated on the principle of the Sino-Burmese one, forces withdrawn first. Zhou: China does not recognize the McMahon line but its administration and army have never crossed it; withdrawal is India''s to make, who have advanced north of it at Khinzemane; China can settle the Indian boundary on the Burmese principles, the difficulty being India''s refusal; it has grounds to doubt India now wants a settlement but will do all to keep talks from breaking.{2}'
