  - id: cal.1960-04.china-leadership-16
    when: Apr.
    date: 1960-04
    thread: china-leadership
    also: [china]
    c: 'Xie Fuzhi 谢富治, Minister of Public Security, explains to his staff the policy: arrest fewer, kill fewer, supervise fewer; 4,000 are to be killed in 1960.{1} He puts the prisoners in the reform-through-labour camps, Tibet excluded, at 1.8 million, in 1,077 factories, mines and quarries and on 440 farms, those in the re-education camps at 440,000, and the camps'' yield at 3 billion yuan a year, besides 750,000 tonnes of produce from the farms.{2}'
    n: '[[w.dikotter-maos-great-famine]], 288 n.4, 289 n.12–13, 290 n.17; [[w.dikotter-maos-great-famine]], 288 (n.4: in 1959 some 4,500 killed, 213,000 arrested and 677,000 humiliated in public); [[w.dikotter-maos-great-famine]], 289 (n.14: just under a million subjected to struggle or put under surveillance in 1959). Made public: 2010. To check: Papers from the tenth national conference on national security, Zhongfa [60] 318, Apr. 8, 1960, Gansu Provincial Archives, 91-18-179, pp. 11–12 and 26 (cited by [[w.dikotter-maos-great-famine]], 288 n.4; 289 n.12–13; 290 n.17). Names: Xie Fuzhi 谢富治. Check: the day.'
    src:
      c: 4773c9ab
      rows:
