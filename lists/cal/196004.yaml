    when: Apr. 18
    date: '1960-04-18'
    thread: china-leadership
    c: 'Mao drafts the Center''s comment forwarding the Central-South Cooperation Region''s report on the standing committees'' meeting held at Zhengzhou: the Center holds its basic line correct and worth study and reference. He sends it to Liu, Deng and Peng Zhen, and Yang Shangkun is to telegraph it. The report: 38 to 40 million tons of steel for the nation by 1962 possible, the region aiming at 6.1 to 6.4 million; the technical movement; small modern and small native mines and furnaces; the "three antis" in two steps; cadres to avoid their home districts, a third of grass-roots cadres to be from elsewhere; secretaries to go down to the villages from April to mid-May.'
