  - id: cal.1962-10-24.missile-crisis-5
    when: Oct. 24–25
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Night, by the telephone memoranda. 10:30 p.m.: Ball reads Kennedy Khrushchev''s letter, the quarantine "an act of piracy." 11:15: Kennedy for a message giving the Russians "enough of an out to stop their shipments." 11:25: Ball to Rusk: U Thant to ask Khrushchev to hold off his ships, a tanker due at the line in the morning. 11:45: Ball to Stevenson. 12:30 a.m.: Ball to Bundy: Stevenson has got Thant out of bed; the message to go in the morning. 2 a.m.: Stevenson''s instructions for Thant''s message.'
    n: '[FRUS 1961–63, XI, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v11/d63); [doc. 64](https://history.state.gov/historicaldocuments/frus1961-63v11/d64); [doc. 65](https://history.state.gov/historicaldocuments/frus1961-63v11/d65); [doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v11/d66); [doc. 67](https://history.state.gov/historicaldocuments/frus1961-63v11/d67); [doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v11/d69) (the instructions). [[w.ball-past-has-another-pattern]], 301–02 (the night; the idea his, for twenty-four hours). See [[cal.1962-10-24.missile-crisis-4]]. Names: Ball, Kennedy, Khrushchev, Rusk, U Thant, Stevenson, McGeorge Bundy.'
