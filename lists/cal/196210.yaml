  - id: cal.1962-10-24.missile-crisis-diplomacy
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-diplomacy
    c: 'Kennedy and Macmillan by telephone, 11 p.m. London, Home and Caccia with Macmillan. Kennedy: "Should he take out Cuba." Macmillan to think and answer. U Thant''s intervention "giving the show away": Khrushchev could accept an unpoliced truce, Kennedy could not.'
    n: '[[w.macmillan-diaries]], 511–12. See [[cal.1962-10-24.missile-crisis-4]]. Names: Kennedy, Macmillan, Douglas-Home, Caccia, U Thant, Khrushchev.'
    tags: [name:kennedy-john-f, name:macmillan-harold, name:douglas-home-alec, name:caccia-harold-a, name:u-thant, name:khrushchev-nikita-s, polity:uk, polity:us, polity:cuba, name:home-alec-douglas]
  - id: cal.1962-10-24.missile-crisis-diplomacy-2
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: 'Adenauer to Steel, the British Ambassador, of his briefing by Dowling "und einem Herrn Smith von der CIA" (and a Mr. Smith of the CIA): "sehr beeindruckt von der großen Gefahr" (much impressed by the great danger) the United States was in; he could not see how it went unnoticed so long; Khrushchev wanted no "Fischereigeschäft" (fishing business) with Castro.'
    n: '[[w.akten-zur-auswartigen-politik]], III, 1765 n.9 (the editors'' quotation). To check: the record, Stiftung Bundeskanzler-Adenauer-Haus, Bestand III/61 (cited by [[w.akten-zur-auswartigen-politik]], III, 1765 n.9). See [[cal.1962-10-22.missile-crisis-diplomacy-4]]. Names: Adenauer, Steel, Dowling, Khrushchev, Castro.'
    tags: [name:adenauer-konrad, name:steel-christopher-e, name:dowling-walter-c, name:khrushchev-nikita-s, name:castro-fidel, polity:frg, polity:uk, polity:us, polity:cuba]
  - id: cal.1962-10-24.missile-crisis-diplomacy-3
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-diplomacy
    c: 'Harriman, by telephone from Washington on Wednesday night, to Schlesinger in New York: Khrushchev wants help off the hook, and is sending signals, the letter to Bertrand Russell, the orders to Soviet ships to avoid confrontation, the evening with Jerome Hines; Eisenhower ignored such signals after the U-2. "If we do nothing but get tougher and tougher, we will force him into counter measures.... We must give him an out." He has not talked to Rusk, who never asks his advice outside the Far East. Schlesinger sends the President a memorandum that night. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 175–76. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Khrushchev, Rusk, Eisenhower.'
    tags: [name:harriman-w-averell, name:schlesinger-arthur-m-jr, name:khrushchev-nikita-s, name:rusk-dean, name:eisenhower-dwight-d, city:nyc]
  - id: cal.1962-10-24.missile-crisis-9
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Kennedy, on the word that the Soviet ships are stopping, sends strict orders to the Essex and to Admiral Anderson, chief of naval operations: no Soviet ship or submarine outside the interception zone is to be stopped, boarded or harassed. By the authors, he assumed Khrushchev was "probably already taking enough criticism from his rivals in the Kremlin" and wanted "no incident that might cause a new flare-up."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 377 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-10-24.missile-crisis]]. Names: Kennedy, Anderson, Khrushchev.'
    tags: [name:kennedy-john-f, name:anderson-george-w-jr, name:khrushchev-nikita-s]
  - id: cal.1962-10-24.press-and-broadcasting
    when: Oct. 24
    date: '1962-10-24'
    thread: press-and-broadcasting
    also: [missile-crisis-quarantine]
    c: 'Salinger hands the press a memorandum of twelve categories of information "vital to our national security" that the Defense Department will not release: plans for forces, estimates of capability and targets, intelligence, movements, alert, dispersal, missile numbers, command posts, airlift. It asks "caution and discretion"; editors in doubt may call the Pentagon''s News Desk. Salinger: it binds no editor. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 290–92. Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1962-10-24.missile-crisis-quarantine
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-quarantine
    also: [press-and-broadcasting]
    c: Shortly before 1 a.m. Salinger gives out the photographs of the missiles in Cuba, after ExComm had held them back and Ambassador Bruce had released them to British television in London; Salinger had told Kennedy it was untenable to show them in Britain and keep them classified at home. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 293–94. Names: Salinger, Bruce, Kennedy.'
    tags: [name:salinger-pierre, name:bruce-david-k-e, name:kennedy-john-f]
