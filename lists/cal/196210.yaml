  - id: cal.1962-10-22.missile-crisis-28
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [defense]
    c: 'The Joint Chiefs to SACLANT, JCS 6848, on the "blockade": "forceful boarding and control of the ship''s operation may be necessary. If boarding meets with organized resistance, the ship will be destroyed." That afternoon, McNamara approving, they tell Power, CINCSAC, to be ready to go to DEFCON 2 at 10 a.m., Oct. 23, the quarantine''s hour.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 211. To check: JCS 6848 to CINCLANT, Oct. 22, 1962, fldr Cuba Oct 22, 1962, box 440, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 211 n.68); McNaughton for SecDef, Oct. 22, 1962, fldr Cuba Oct 22, 1962, box 440, Subject files, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 211 n.68). See [[cal.1962-10-22.missile-crisis]]. Check: Kaplan''s note names CINCLANT; the quarantine began Oct. 24. Names: McNamara.'
