    tags: [name:ball-george-w, name:kennedy-john-f, name:kennedy-robert-f]
  - id: cal.1962-10-17.missile-crisis-3
    when: Oct. 17
    date: '1962-10-17'
    thread: missile-crisis
    also: [cuba]
    c: '9:30 a.m., McCone with the President. By McCone''s note, Kennedy inclined to act promptly if at all, without warning, on the MRBMs and possibly the airfields. McCone''s paper: no action without warning, no "Pearl Harbor indictment"; an ultimatum first. Kennedy approves sabotage, among it a grenade attack on the Chinese embassy in Havana and a mortar attack on three SA-2 sites; not the mining of harbors.'
    n: '[FRUS 1961–63, XI, doc. 23](https://history.state.gov/historicaldocuments/frus1961-63v11/d23) (the meeting and Kennedy''s inclination, in its note). [[w.fursenko-one-hell-of-a]], 227–28. To check: McCone, "Memorandum for Discussion Today, Oct. 17, 1962," doc. 53, and "Brief Discussion with the President—9:30 A.M.—17 October 1962," doc. 55, in McAuliffe, ed., *CIA Documents on the Cuban Missile Crisis* (cited by [[w.fursenko-one-hell-of-a]], 228 n.25); Carter, "Operation MONGOOSE/Sabotage Proposals," Oct. 16, 1962, and Parrott, memorandum for the Special Group (Augmented), Oct. 17, 1962, Rockefeller Commission papers (cited by [[w.fursenko-one-hell-of-a]], 228 n.26). Check: the day of the approval of sabotage. See [[cal.1962-10-16.missile-crisis]]. Names: McCone, Kennedy.'
