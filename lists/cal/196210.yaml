  - id: cal.1962-10-02.europe-and-the-alliance
    when: Oct. 2
    date: '1962-10-02'
    thread: europe-and-the-alliance
    also: [european-community]
    c: 'Cadenabbia, noon. Adenauer receives McGeorge Bundy with Dowling, the American Ambassador. America must lead; Khrushchev a convinced Communist; Soviet power grown enormously in ten years; Khrushchev afraid of America, and more of Red China; America should help Red China a little. De Gaulle''s reserve toward NATO, in confidence: put his generals under NATO and he would no longer have them in hand.'
