    c: '9:30 a.m., McCone with the President. By McCone''s note, Kennedy inclined to act promptly if at all, without warning, on the MRBMs and possibly the airfields. McCone''s paper: no action without warning, no "Pearl Harbor indictment"; an ultimatum first. Kennedy approves sabotage, among it a grenade attack on the Chinese embassy in Havana and a mortar attack on three SA-2 sites; not the mining of harbors.'
