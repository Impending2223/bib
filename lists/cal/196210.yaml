  - id: cal.1962-10-18.missile-crisis-3
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'The ExComm, without Acheson, in the afternoon: substantial agreement on a visit-and-search blockade, urged by McNamara and Gilpatric, Taylor and the Chiefs dissenting. Reported to the President that night.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 508. Meeker''s record of Oct. 19, [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (the night''s meeting with the President, a tentative blockade by one participant''s recollection). See [[cal.1962-10-16.missile-crisis]]. Names: Acheson, McNamara, Gilpatric, Taylor, Kennedy.'
