    c: 'Kim Chong-p''il, director of the Korean CIA, with Rusk and Harriman, the missile crisis on. Ōhira''s offer in Tokyo, as Kim reports it: $300 million over twelve years, not to be called reparations; Kim asks $600 million with loans. Harriman: the bars on candidates in the 1963 elections. Nov. 12, in Tokyo, Kim and Ōhira settle the figures: $300 million in grants, $200 million in government loans. Check.'
    n: 'FRUS 1961–63, XXII, docs. [280](https://history.state.gov/historicaldocuments/frus1961-63v22/d280), [281](https://history.state.gov/historicaldocuments/frus1961-63v22/d281), [282](https://history.state.gov/historicaldocuments/frus1961-63v22/d282), [283](https://history.state.gov/historicaldocuments/frus1961-63v22/d283). To check: [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]. See [[cal.1962-04-24.japan-and-korea]]. Names: Kim Chong-p''il, Ōhira, Rusk, Harriman.'
