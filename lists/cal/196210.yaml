  - id: cal.1962-10-26.south-asia
    when: Oct. 26
    date: '1962-10-26'
    thread: south-asia
    also: [china]
    c: 'The afternoon. B. K. Nehru, India''s Ambassador, gives Kennedy the Prime Minister''s letter on the Chinese attack: India confident it "shall have your sympathy and support." Kennedy: he will reply at once, full sympathy and support, help within American capabilities. By Sorensen''s account he adds, unofficially, that Nehru should make Khrushchev "put up or shut up" on the MIGs promised.'
    n: '[FRUS 1961–63, XIX: South Asia, doc. 182](https://history.state.gov/historicaldocuments/frus1961-63v19/d182), Washington to New Delhi, Oct. 27. [[w.sorensen-kennedy]], 663 (the first of some fifteen letters in six months; the Ambassador on "support" rather than "military assistance"). See [[cal.1962-10-20.india-and-china]]. Names: Jawaharlal Nehru, Khrushchev, Kennedy.'
