    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'Kennedy''s reply: the secret shipment of offensive weapons began it; prudence on both sides. Soviet ships to observe the quarantine, in force at 1400 Greenwich, Oct. 24.'
    n: 'FRUS 1961–63, VI, doc. [62](https://history.state.gov/historicaldocuments/frus1961-63v06/d62). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 636. Names: Kennedy, Khrushchev.'
