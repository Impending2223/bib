  - id: cal.1962-10-21.missile-crisis-8
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [europe-and-the-alliance-jupiters, defense]
    c: 'An ISA memorandum to Nitze, "The Implications of Withdrawal of Our Ballistic Missiles From Turkey": Turks man the Jupiters; "Removal of the weapons, in the most real sense, is an act of disarming our friend"; capitulation to blackmail. The Joint Chiefs the same day against a presidential order that no Jupiter be fired from Italy or Turkey without further authority, even under Soviet attack.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 221. To check: ISA memorandum to Nitze, "The Implications of Withdrawal of Our Ballistic Missiles From Turkey," Oct. 21, 1962, fldr R&R Unit, Cuban Missile Crisis, Nitze Black Book II, box 2, Cuba Sensitive files, Acc 71A-2896 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.120); JCSM-800-62, Vice Adm. Herbert D. Riley for SecDef, Oct. 21, 1962, fldr R&R Unit, Cuban Missile Crisis, box 3, Cuba Sensitive files, Acc 71A-2896 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.121). Names: Nitze.'
    src:
