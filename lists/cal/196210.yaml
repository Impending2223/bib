    when: Oct. 5
    date: '1962-10-05'
    thread: georgia
    also: [legislatures]
    c: 'The Senate passes the reapportionment, 43–4: many seats to the cities. Nominations already made void: special primaries Oct. 16, runoffs Oct. 23. Counties of several districts to elect their senators at large.'
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 5, 1962. See [[cal.1962-09-27.georgia-ga]].'
