    c: 'Washington, about an hour and a half, Taylor joining at the end. Schröder with McNamara: McNamara on his German tour, the forces'' readiness high but too dependent on nuclear war, a massive Soviet aggression the least likely case. Schröder: Khrushchev must see men ready, if need be, to fight a nuclear war; conventional forces needed as well.'
