    when: Oct. 25
    date: '1962-10-25'
    time: 1962-10-25T21:00Z
    thread: missile-crisis-excomm
    c: 'The Executive Committee, 5 p.m., the fifth meeting. McCone: fifteen ships en route to Cuba. Dillon: a run on gold in Germany and London. McNamara: no ship yet boarded; the Lebanese ship turned back before the barrier. Rusk: the missiles out, or under UN control; heavy pressure on the Russians while talks go on.'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v11/d73) (Bromley Smith''s summary record). [[w.sorensen-kennedy]], 711 (Thursday and Friday the President and the Committee weigh new pressures: a tighter blockade, more low-level flights, action inside Cuba, an air strike, an invasion). See [[cal.1962-10-25.missile-crisis-7]]. Names: McCone, Dillon, McNamara, Rusk.'
    src:
