  - id: cal.1962-10-18.missile-crisis-excomm-3
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis-excomm
    c: 'The Executive Committee. One of the advocates of an air strike, a Republican, passes Sorensen a note across the table: if the missiles are allowed to become operational, "the next House of Representatives is likely to have a Republican majority." By Sorensen''s account.'
    n: '[[w.sorensen-kennedy]], 688 (quoting it). Check: the day; Sorensen puts it in the debate of Oct. 17–18. See [[cal.1962-10-18.missile-crisis-6]]. Names: Sorensen.'
