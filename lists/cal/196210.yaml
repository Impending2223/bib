    when: Oct. 26
    date: '1962-10-26'
    time: 1962-10-26T14:00Z
    thread: missile-crisis-excomm
    also: [cuba]
    c: The Executive Committee, 10 a.m., the sixth meeting. McCone has stood down a CIA plan to land ten teams in Cuba by submarine; the President wants it before the Special Group, and Mongoose remade, perhaps under the Committee, for a Cuba after Castro. Bundy on the leaks to the press. The *Marucla*'s boarding to be made public.
