    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis-excomm
    also: [robert-kennedy]
    c: 'Saturday evening, the Truman Balcony, after Stevenson has made his case to the ExComm. The President to Robert Kennedy and O''Donnell: "I wouldn''t think a guy who''s as smart a politician would expose himself. There are a lot of bastards in there who hate his guts and think he''s an appeaser. To set yourself up to those guys is a pretty risky operation." And: "We are very, very close to war. And there''s not room in the White House bomb shelter for all of us."'
    n: '[[w.thomas-robert-kennedy]], 224, 232; [[w.odonnell-johnny-we-hardly-knew]], 366–67 (after the ExComm meeting in the Oval Room, the President on the Truman Balcony with Robert Kennedy and O''Donnell; Robert Kennedy: Stevenson is "not strong enough or tough enough to be representing us at the UN at a time like this ... somebody like John McCloy"; the President: "I think Adlai showed plenty of strength and courage ... I admire him for saying what he said"; the Jupiters, "the damned things"). To check: Theodore Sorensen OH, JFK Library (cited by Thomas, 436, for the shelter). Names: Kennedy, Robert Kennedy, O''Donnell, Stevenson.'
    src:
