  - id: cal.1962-10-24.missile-crisis-2
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-diplomacy
    c: 'Khrushchev: the quarantine an ultimatum; the OAS without authority. Soviet captains not to be instructed to obey the American navy.'
    n: 'FRUS 1961–63, VI, doc. [63](https://history.state.gov/historicaldocuments/frus1961-63v06/d63). [[w.fursenko-one-hell-of-a]], 255–56; [[w.fursenko-khrushchevs-cold-war]], 483 ("we will not simply be bystanders with regard to piratical acts"); [[w.prezidium-tsk-kpss-1954]], III, 351–55 (P 61/8, Oct. 24, and the text, dictated by Khrushchev that day: "ultimatum" terms; the OAS without any authority; no instructions to Soviet captains to obey). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 637–639. Names: Khrushchev.'
