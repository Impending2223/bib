  - id: cal.1962-10-27.missile-crisis-8
    when: Oct. 27
    date: '1962-10-27'
    time: 1962-10-27T23:00Z
    time_approx: true
    thread: missile-crisis-excomm
    also: [robert-kennedy, europe-and-the-alliance-jupiters]
    c: 'About 7 p.m., the Oval Office: the President with Rusk, McNamara, Bundy, Sorensen, Robert Kennedy and a few others, sworn to secrecy. Robert Kennedy to see Dobrynin: the missiles out and no invasion, or "further action was unavoidable"; no public deal on Turkey, but the Jupiters to go after the crisis; any Soviet mention of it to void it. Made public by Bundy, 1988.'
    n: '[[w.thomas-robert-kennedy]], 227–28; [[w.sorensen-counselor]], 302–03 (after the ExComm dispersed, a smaller meeting in the Oval Office with Robert Kennedy, McNamara, Rusk, Bundy, Thompson, Sorensen "and possibly others" to instruct Robert Kennedy for his meeting with Dobrynin; Rusk''s proposal of a private word on the Turkish missiles; Sorensen learned later that Robert Kennedy varied the letter''s language; not the hour). Check: Counselor, 303–04, has the Turkish missile understanding "first made public ten years later, in a Time magazine article cosigned by the surviving participants" of the Oval Office meeting; the entry has it made public by Bundy, 1988. To check: [[w.bundy-danger-and-survival]], 432–44 (cited by [[w.thomas-robert-kennedy]], 227 n.). See [[cal.1962-10-27.missile-crisis]]. Names: Kennedy, Rusk, McNamara, Bundy, Sorensen, Robert Kennedy, Dobrynin.'
    src:
      c: ebad6438
      rows:
        - 'w.thomas-robert-kennedy 227–28: all'
        - 'w.sorensen-counselor 302–03: C'
    tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:sorensen-theodore-c, name:kennedy-robert-f, name:dobrynin-anatoly]
  - id: cal.1962-10-27.missile-crisis-9
    when: Oct. 27
    date: '1962-10-27'
    time: 1962-10-28T01:00Z
    thread: missile-crisis-excomm
    c: 'From 9 p.m., the ExComm, taped. Robert Kennedy to McNamara: "How are you doing, Bob?" McNamara: be sure the Russians understand the consequences; "an eye for an eye." Robert Kennedy: "I''d take Cuba back." Someone: "Suppose we make Bobby mayor of Havana."'
    n: '[[w.thomas-robert-kennedy]], 229; [[w.sorensen-kennedy]], 716 (the meeting at 9 p.m., "shorter, cooler and quieter"); [[w.sorensen-counselor]], 304 (later that Saturday night, after dinner, the full ExComm reconvenes in the Cabinet Room, without the President by Sorensen''s account; the hawks insist the blockade has not worked; Johnson, silent until then: "All I know is that when you were walking along a Texas road and a rattlesnake rose up ready to strike, there was only one thing to do—take a long stick and knock its head off"; Sorensen''s account, written in 2008; not the hour, the taping or the words entered). To check: [[w.kennedy-tapes]], 628 (cited by [[w.thomas-robert-kennedy]], 229 n.). Names: Robert Kennedy, McNamara.'
    src:
      c: acc822ad
      rows:
