    c: 'Scali with Fomin (Feklisov) again, at Kennedy''s suggestion. Fomin: Castro "a very hard person to control"; is the time right for a summit? Rusk should talk with Dobrynin three times a day. Scali: the President is determined to try again on disarmament; no wish to humiliate Khrushchev. By Scali''s report, printed by Salinger.'
    n: '[[w.salinger-with-kennedy]], 278–79. Names: Scali, Feklisov, Kennedy, Castro, Rusk, Dobrynin, Khrushchev.'
    tags: [name:scali-john-a, name:feklisov-aleksandr, name:kennedy-john-f, name:castro-fidel, name:rusk-dean, name:dobrynin-anatoly, name:khrushchev-nikita-s]
