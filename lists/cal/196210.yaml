    tags: [name:bolshakov-georgi, name:kennedy-robert-f, name:bartlett-charles]
  - id: cal.1962-10-23.missile-crisis-7
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'At Robert Kennedy''s behest, Bartlett with Bolshakov at his office in the National Press Club, by the GRU''s record: the President "very angry," reminded of Pearl Harbor; he "does not want to invade Cuba," only to remove the MRBM bases, better through the UN. Later the same day, again, with the U-2 photographs on an easel: "So what do you see, Georgi?"'
    n: '[[w.fursenko-one-hell-of-a]], 251. To check: GRU, "Kratkoye Soderzhanye: Besed G. Bolshakova s R. Kennedy" (cited by [[w.fursenko-one-hell-of-a]], 251 n.26, n.27); [[w.robert-kennedy-in-his]], 261 (cited by [[w.fursenko-one-hell-of-a]], 251 n.28, the photographs); Bolshakov, "Hot Line," *Novoye Vremya*, no. 6 (1989) (cited by [[w.fursenko-one-hell-of-a]], 251 n.29). See [[cal.1962-10-07.soviet-union]]. Names: Robert Kennedy, Bartlett, Bolshakov, Kennedy.'
    src:
      c: b4aed9ca
      rows:
