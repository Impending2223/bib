  - id: cal.1962-10-26.missile-crisis-7
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-anadyr
    also: [soviet-union]
    c: 'Pliyev, warned by Cuban and Czech sources, expects an American air strike within a day or two: more deception, and "a dispersal of technology," likely the warheads moved nearer the missiles. All twenty-four launchers ready; no warhead mated, each three and a half hours from it.'
