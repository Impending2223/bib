  - id: cal.1962-10-23.missile-crisis-6
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    also: [robert-kennedy, europe-and-the-alliance-jupiters]
    c: 'Holeman calls Bolshakov. By Bolshakov''s notes: "Robert Kennedy and his circle consider it possible to discuss the following trade: The U.S. would liquidate its missile bases in Turkey and Italy, and the USSR would do the same in Cuba"; but only "in a time of quiet." Bartlett, by the GRU''s record, a like word; the GRU station holds both until the next day.'
    n: '[[w.fursenko-one-hell-of-a]], 249–50, 252. To check: GRU summary (cited by [[w.fursenko-one-hell-of-a]], 250 n.19, n.20); GRU, entry for Oct. 24, 1962 (cited by [[w.fursenko-one-hell-of-a]], 252 n.30). Check: Bartlett denies he named Turkey to Bolshakov; Holeman does not recall (250 n.20). See [[cal.1962-10-21.robert-kennedy]]. Names: Bolshakov, Robert Kennedy, Bartlett.'
    src:
      c: c9b7dbc3
      rows:
        - 'w.fursenko-one-hell-of-a 249–50, 252: all'
