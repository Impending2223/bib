  - id: cal.1962-10-25.missile-crisis-7
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis-excomm
    c: The Executive Committee, the fourth meeting. USIA to weigh dropping leaflets on Cuba. Non-bloc ships to be investigated and boarded, tankers excluded; the tanker *Bucharest* not to be intercepted, a bloc ship to be ready for interception Friday in daylight. Eight low-level reconnaissance aircraft over the sites at once. An answer to U Thant approved, revised with New York by 1:15 p.m.
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 71](https://history.state.gov/historicaldocuments/frus1961-63v11/d71) (record of action). [[w.sorensen-kennedy]], 710–11 (the tanker passed on the President''s instructions; a nonbloc ship under Soviet charter to be boarded; the leaflet drop authorized and held); [[w.salinger-with-kennedy]], 271, 292 (Salinger''s notes, Thursday: Kennedy orders the Navy to pass the *Bucharest* without search, orders night reconnaissance flights over Cuba and approves missile fuel as contraband; the ExComm, hearing the report in the morning, orders the news released through Defense at the end of the morning; not USIA, the bloc ship or U Thant). See [[cal.1962-10-24.missile-crisis]]. Names: Kennedy, McCone, McNamara, U Thant.'
