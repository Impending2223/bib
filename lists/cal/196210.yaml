    c: 'The ExComm, after a report that an American plane was fired on over a Cuban air base. Kennedy asks Thompson whether Zhukov is important; Thompson will see him Friday; Rusk has not been asked. Kennedy: "Pierre must outrank both of you. Zhukov is seeing him for lunch on Wednesday." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 280. Names: Kennedy, Thompson, Zhukov, Rusk, Salinger.'
    tags: [name:kennedy-john-f, name:thompson-llewellyn-e, name:rusk-dean, name:salinger-pierre]
