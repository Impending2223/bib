    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis-diplomacy
    c: The House of Commons. Macmillan's statement on Cuba, with new points on U Thant's move; well received on all sides. Gaitskell, asking ten questions, "most damaging about 'consultation'"; Wade and Shinwell.
    n: '[[w.macmillan-diaries]], 512 (the statement finished with Home and Caccia at 9:30 a.m.; the House met at 11). To check: H.C. Deb., Oct. 25, 1962 (Hansard). Names: Macmillan, Gaitskell, Shinwell, U Thant, Wade.'
