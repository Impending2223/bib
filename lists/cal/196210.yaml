  - id: cal.1962-10-01.european-community
    when: Oct. 1
    date: '1962-10-01'
    thread: european-community
    also: [europe-and-the-alliance]
    c: Cadenabbia, 11 a.m. Adenauer receives Heath. Fanfani's ideas of the Franco-German tie wrong; de Gaulle and he want the two peoples bound so close that no French government could go with Russia against Germany, nor a German one against France. On British entry he had spoken with de Gaulle once, last winter. German farming and textiles; the Common Market's "bittere Früchte" (bitter fruits).
    n: '*Gespräch des Bundeskanzlers Adenauer mit dem britischen Lordsiegelbewahrer Heath in Cadenabbia* (Kusterer''s record). [[w.akten-zur-auswartigen-politik]], III, 1571–74 (Dok. 368; present, Barth, Osterheld, Shuckburgh, Higgins). Names: Adenauer, Heath, Fanfani, de Gaulle.'
    tags: [name:adenauer-konrad, name:heath-edward-r-g, name:fanfani-amintore, name:de-gaulle-charles, polity:frg, polity:uk, polity:fr]
