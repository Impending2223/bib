    c: 'Sunday night. Kennedy asks the *New York Times* and the *Washington Post* not to run their stories of a coming quarantine; both hold them. The next afternoon''s *Herald Tribune*: "Top-Secret Doings in Capital; A Cuba-Berlin Strategy Step?"'
    n: '[[w.fursenko-one-hell-of-a]], 238; [[w.sorensen-kennedy]], 697–98 (one newspaper had the story Sunday evening and agreed not to print it at the President''s request; publishers asked to check). To check: [[w.salinger-with-kennedy]], 253, 261 (cited by [[w.fursenko-one-hell-of-a]], 238 n.58–59); *New York Herald Tribune*, Oct. 22, 1962 (238 n.57). See [[cal.1962-10-20.missile-crisis-3]]. Names: Kennedy.'
