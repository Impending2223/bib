  - id: cal.1962-10-26.missile-crisis-5
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-quarantine
    also: [defense]
    c: About 10 p.m. C-19, its batteries low, surfaces to recharge; two or three hours, then four American antisubmarine ships close in. Shumkov dives; a destroyer passes over the conning tower; three grenades dropped. "I thought they were bombing us." A leak, repaired.
    n: '[[w.fursenko-khrushchevs-cold-war]], 486–87 (a try on Oct. 25 given up on sighting an American ship). To check: transcript, interview with Nikolai Shumkov, BBC Scotland (cited by [[w.fursenko-khrushchevs-cold-war]], 487 n.79). See [[cal.1962-10-23.missile-crisis-10]].'
    src:
      c: afbb2904
      rows:
        - 'w.fursenko-khrushchevs-cold-war 486–87: all'
        - 'via x.2006.kcw-p487-c19: all'
  - id: cal.1962-10-26.soviet-union
    when: Oct. 26
    date: '1962-10-26'
    thread: soviet-union
    also: [missile-crisis, intelligence]
    c: 'Moscow, early. Reports that the Americans are readying an attack for Oct. 27: Warren Rogers of the *Herald Tribune*, in the Pentagon''s pool for an invasion, overheard with his editor, Robert Donovan, at the National Press Club bar the night before by an émigré bartender; Heffernan of Reuters and a KGB source, "Garn," the same; Dorticós''s fears to the GRU. Khrushchev decides to seek his diplomatic way out.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 486. To check: Markov to Serov, Oct. 26, 1962, GRU; Feklisov to Center, Oct. 25, 1962, SVR; Murov to Serov, Oct. 24, 1962, GRU (cited by [[w.fursenko-khrushchevs-cold-war]], 486 n.75, n.76). See [[cal.1962-10-25.soviet-union]]. Names: Dorticós, Khrushchev.'
    src:
