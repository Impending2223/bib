    thread: missile-crisis-excomm
    also: [berlin-and-vienna]
    c: 'The ExComm, morning. McNamara on the Navy''s rules for Soviet submarines: practice depth charges the warning to surface. Kennedy''s "time of greatest worry," by Robert Kennedy''s notes. Kennedy would rather the first ship attacked be a merchant ship; McNamara against deferring; the Navy''s instructions left. Kennedy on a Soviet reply at Berlin: "no movement in or out of Berlin—a blockade."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 481–82. To check: [Executive Committee Meeting of the National Security Council](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-4), 10 a.m., Tape 36.3 (Miller Center); [[w.presidential-recordings]], III, 191–95 (cited by [[w.fursenko-khrushchevs-cold-war]], 481 nn.58–62); [[w.schlesinger-robert-kennedy-and-his]], 514 (cited by [[w.fursenko-khrushchevs-cold-war]], 481 n.59). See [[cal.1962-10-24.missile-crisis]]. Names: McNamara, Kennedy, Robert Kennedy.'
