      - cal.1962-10-22.missile-crisis-18
    c: 'The 507th NSC, 3 p.m., all the Joint Chiefs present. Rusk reads Macmillan''s message; the best legal basis the Rio Treaty, not Article 51; Robert Kennedy: the blockade illegal without the OAS. Salinger: Gromyko gone from New York with the usual farewell. The President: "everyone should sing one song."'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 41](https://history.state.gov/historicaldocuments/frus1961-63v11/d41). [National Security Council Meeting on the Cuban Missile Crisis](https://millercenter.org/the-presidency/secret-white-house-tapes/national-security-council-meeting-cuban-missile-crisis), Tape 33.1 (Miller Center). [[w.sorensen-kennedy]], 701 (the meeting at 3 p.m., the Chiefs present, "taut, organizational"; Gromyko''s farewell monitored). After the calls: FRUS 1961–63, XI, doc. 41 ("earlier in the day"). See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Rusk, Macmillan, Robert Kennedy, Salinger, Gromyko.'
    src:
      c: f176456f
