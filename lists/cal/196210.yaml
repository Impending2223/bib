    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-anadyr
    also: [cuba]
    c: 'Castro to the general staff of the Revolutionary Army, on Prensa Latina''s intercept of an American ultimatum for U Thant: all forces to their command posts, the highest alert; from the next morning Cuban antiaircraft guns to fire on any American plane over Cuba. Raúl Castro to Oriente, Guevara to Pinar del Río.'
    n: '[[w.fursenko-one-hell-of-a]], 268. Names: Castro, Raúl Castro, Guevara.'
