    thread: europe-and-the-alliance
    c: Bonn, the Cabinet all day, with long breaks; from 6:30 p.m. without the FDP's ministers. The social package passed all the same (continued pay in sickness, sickness insurance, child allowances), eleven CDU/CSU ministers a quorum. The FDP's parliamentary executive asks the dismissal of Hopf and Strauß, the state secretaries.
    n: 'Carstens to Schröder at Entebbe, Fernschreiben Nr. 21, Oct. 31, 1962, 9 p.m.: "Hier ist eine ernste Regierungskrise ausgebrochen" (a serious government crisis has broken out here). [[w.akten-zur-auswartigen-politik]], III, 1821 (Dok. 427; n.5, the FDP''s demand, refused Nov. 2; n.6, the Cabinet''s decision). To check: *Kabinettsprotokolle* 1962, 490–92 (cited by [[w.akten-zur-auswartigen-politik]], III, 1821 n.6). See [[cal.1962-10-31.europe-and-the-alliance-2]]. Names: Hopf, Strauss.'
    tags: [name:hopf-volkmar, name:strauss-walter, polity:frg]
  - id: cal.1962-10.japan
    when: Oct., late
    date: 1962-10
    thread: japan
    also: [china]
    c: Tatsunosuke Takasaki leads a large Japanese delegation to China; Zhou Enlai talks with him.
    n: '[[w.jian-zhou-enlai]], 505. Names: Zhou Enlai. Check: the day.'
    tags: [name:zhou-enlai, polity:japan, polity:prc]
  - id: cal.1962-10.elections-1962-2
    when: Oct.
    date: 1962-10
    thread: elections-1962
    c: 'The White House, the Oval Room upstairs, an evening, with Johnson and O''Donnell, on whether Kennedy should speak in Chicago for Yates against Dirksen. Johnson to Kennedy: a disaster for the administration if Dirksen loses and Kuchel becomes the Republican leader. O''Donnell: "I wouldn''t mind dealing with Tommy Kuchel every day in the week if I could knock off the Republican minority leader in the Senate in this election." Kennedy: "Well, Kenny, this is one time when Lyndon is right and you''re wrong. But I''ve got a commitment to go to Chicago and help Yates, and I''ve got to stick to my commitment."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 356–57 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Johnson, Kennedy, O''Donnell, Yates, Dirksen, Kuchel. Check: the day (the book: "a week or so before the Cuban missile crisis arose," after the commitment to Daley was given).'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f, name:odonnell-kenneth-p, name:yates-sidney-r, name:dirksen-everett, name:kuchel-thomas-h]
  - id: cal.1962-10.missile-crisis-diplomacy-2
    when: Oct.
    date: 1962-10
    thread: missile-crisis-diplomacy
    also: [latin-america]
    c: 'At the White House''s request Goodwin works with Schlesinger on the draft of Stevenson''s speech for the United Nations: its subject, the Soviet missiles in Cuba. Goodwin is then to go with Dillon to Mexico City, to the meeting of the Latin American foreign ministers, to explain Kennedy''s naval quarantine before he announces it.'
    n: '[[w.goodwin-remembering-america]], 217 (Goodwin''s account; he did not take part in the secret deliberations). Names: Goodwin, Schlesinger, Stevenson, Dillon, Kennedy. Check: the day; "In mid-October of 1962" (217).'
    tags: [name:goodwin-richard-n, name:schlesinger-arthur-m-jr, name:stevenson-adlai-e, name:dillon-c-douglas, name:kennedy-john-f]
  - id: cal.1962-10-31.press-and-broadcasting
    when: Oct. 31
    date: '1962-10-31'
    thread: press-and-broadcasting
    c: The State Department adopts the rule that its officials report their press contacts by memorandum, a mistake there, Salinger tells Kennedy, and Manning thinks so more strongly. Suspended within a month, by Manning's letter to the Department's officials. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 294–95. Check: the day ("four days later" than Oct. 27). See [[cal.1962-10-27.press-and-broadcasting]]. Names: Salinger, Kennedy, Manning.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:manning-robert-j]
  - id: cal.1962-10-31.missile-crisis-settlement
    when: Oct. 31
    date: '1962-10-31'
    thread: missile-crisis-settlement
    also: [soviet-union]
    c: 'Washington, the Rive Gauche. Salinger lunches with Yuri Zhukov of *Pravda* and Bolshakov. Salinger: the secret missiles and the lies to Kennedy a harsh blow; Khrushchev must remove missiles and launchers. Zhukov: neither side must show weakness; he sounds out a summit, which Reston thought premature the day before, and complains of State''s report that Castro told Latin American Communists to sabotage, and of the film *We''ll Bury You*. No separate treaty with East Germany after the elections. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 281–82. Names: Salinger, Zhukov, Bolshakov, Kennedy, Khrushchev, Reston, Castro.'
    tags: [name:salinger-pierre, name:bolshakov-georgi, name:kennedy-john-f, name:khrushchev-nikita-s, name:reston-james, name:castro-fidel]
