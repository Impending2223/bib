    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 'Acheson alone with the President. By Acheson''s later account, he calls the talk of a Pearl Harbor in reverse "silly": "It is unworthy of you to talk that way."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 508. To check: "No Yearning to be Loved: Dean Acheson talks to Kenneth Harris," *Listener*, Apr. 8, 1971 (cited by [[w.schlesinger-robert-kennedy-and-his]], 508 n.42). See [[cal.1962-10-16.missile-crisis]]. Names: Acheson, Kennedy.'
