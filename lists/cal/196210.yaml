    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: 'Khrushchev''s first letter: the missiles out for a pledge against invasion. Feklisov puts like terms to Scali of ABC.'
    n: 'FRUS 1961–63, VI, doc. [65](https://history.state.gov/historicaldocuments/frus1961-63v06/d65) (the letter). [[w.fursenko-one-hell-of-a]]. See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 640–645. Names: Khrushchev, Feklisov, Scali.'
    tags: [name:khrushchev-nikita-s, name:scali-john-a, name:feklisov-aleksandr]
