    also: [robert-kennedy, europe-and-the-alliance-jupiters]
    c: 'Holeman calls Bolshakov. By Bolshakov''s notes: "Robert Kennedy and his circle consider it possible to discuss the following trade: The U.S. would liquidate its missile bases in Turkey and Italy, and the USSR would do the same in Cuba"; but only "in a time of quiet." Bartlett, by the GRU''s record, a like word; the GRU station holds both until the next day.'
