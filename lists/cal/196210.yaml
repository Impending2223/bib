  - id: cal.1962-10-01.transition-and-staff
    when: Oct. 1
    date: '1962-10-01'
    thread: transition-and-staff
    c: Taylor Chairman of the Joint Chiefs. Lemnitzer to NATO.
    n: 'Remarks at the Swearing In of Gen. Maxwell D. Taylor as Chairman of the Joint Chiefs of Staff, [1962 Pub. Papers 730](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=790). Remarks Upon Presenting the Distinguished Service Medal to Gen. Lyman L. Lemnitzer, [1962 Pub. Papers 729](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=789) (Oct. 1, 1962). To check: [[w.taylor-swords-and-plowshares]]; [[w.mcmaster-dereliction-of-duty-1997]]. See [[cal.1961-06-26.transition-and-staff]]. Names: Taylor, Lemnitzer.'
