  - id: cal.1962-10-24.missile-crisis-8
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    also: [defense]
    c: 'Night, the Navy''s control room. McNamara with Anderson, by McNamara''s account: asked how he will stop the Soviet ship reaching the line, Anderson: "I presume we''ll hail it in English"; a shot across the bow, if need be through the rudder. McNamara: "There will be no firing of any kind at that Soviet ship without my personal authority." Gilpatric, there: Anderson "sort of exploded"; to Gilpatric after, "that''s the end of Anderson." Anderson''s account less sharp.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 212; [[w.odonnell-johnny-we-hardly-knew]], 378 (that night McNamara and Gilpatric at the Navy''s Flag Plot, to see that the President''s orders were observed: one American vessel watching a Soviet submarine; Anderson told him "the Navy needed no advice on how to manage a blockade"; not the words quoted). To check: McNamara, interview, July 24, 1986, 5–7, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 212 n.74); Anderson, interview by Poole, Nov. 7, 1978, and by Matloff and Trask, May 31, 1984, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 212 n.75). Check: the accounts differ. See [[cal.1962-10-24.missile-crisis]]. Names: McNamara, Anderson, Gilpatric.'
