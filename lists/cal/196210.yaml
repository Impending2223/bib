    n: '[108 Cong. Rec. 21415](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt16/pdf/GPO-CRECB-1962-pt16-3-1.pdf#page=13) (Oct. 1, 1962). [[w.mann-walls-of-jericho]], 332–33. See [[cal.1962-06-25.mississippi]]. Names: Ervin, Stephen Young, Javits.'
