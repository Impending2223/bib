  - id: cal.1962-10-22.missile-crisis-27
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [defense]
    c: The armed forces to DEFCON 3. The President gives McNamara latitude in carrying out the quarantine, ships refusing to identify their cargo or accept search to be taken into custody; preparations for an air strike and a landing go on.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 210. See [[cal.1962-10-22.missile-crisis]]. Names: McNamara.'
