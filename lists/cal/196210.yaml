    n: 'P 61/II, Oct. 25, 1962, and the instructions. [[w.prezidium-tsk-kpss-1954]], III, 360–61 (docs. 265.2, 265.2.1); I, 620 (Malin''s notes: Mikoyan; "Т. Зорин правильно предлагает" (Comrade Zorin proposes rightly)). See [[cal.1962-10-25.missile-crisis]]. Made public: 2003. Names: Zorin, Mikoyan.'
