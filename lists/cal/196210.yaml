  - id: cal.1962-10-24.missile-crisis-3
    when: Oct. 24
    date: '1962-10-24'
    time: 1962-10-24T15:24Z
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance-jupiters]
    c: '11:24 a.m., the Secretary to Hare in Ankara and Finletter at NATO: a negotiated removal of the offensive threat in Cuba may mean dismantling the Jupiters; Hare''s assessment urgently asked, of outright removal, of removal with a Polaris submarine in the area, or with a seaborne multilateral force; Finletter''s on NATO. Not to be discussed with foreigners.'
    n: '[FRUS 1961–63, XI, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v11/d56). [[w.ball-past-has-another-pattern]], 295 (the cable). Check: Ball has it as his own notice to the two ambassadors. See [[cal.1962-10-14.missile-crisis]]. Names: Hare, Finletter.'
    src:
      c: 4cf9280a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d56: all'
        - 'w.ball-past-has-another-pattern 295: A'
    tags: [name:hare-raymond-a, name:finletter-thomas-k, name:rusk-dean]
  - id: cal.1962-10-24.missile-crisis-4
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis-diplomacy
    c: 'U Thant to the Security Council, and in messages to Kennedy and Khrushchev at the asking of many members: a voluntary suspension of arms shipments to Cuba and of the quarantine, for two or three weeks, to give time for talks. No provision for verification, by Ball''s account; Washington against.'
    n: 'Message to the Acting Secretary General of the United Nations, [1962 Pub. Papers 811](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871) (Oct. 25, 1962), note (the appeal). [[w.ball-past-has-another-pattern]], 300 (the proposal; no verification). See [[cal.1962-10-14.missile-crisis]]. Names: U Thant, Kennedy, Khrushchev.'
    src:
      c: 50c8c167
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=871: A'
        - 'w.ball-past-has-another-pattern 300: all'
    tags: [name:u-thant, name:kennedy-john-f, name:khrushchev-nikita-s]
    time_range:
