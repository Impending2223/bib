    also: [robert-kennedy]
    c: 'Stevenson argues at the NSC for offering to give up the missile bases in Turkey and Italy to get the Soviet missiles out of Cuba. Robert Kennedy, by his notes: "a rather strong argument with him"; he suggests privately to the President that someone else replace Stevenson at the UN, "such a weak man in these kinds of negotiations." The President to O''Donnell: "I admire [Stevenson] for saying what he did."'
    n: 'Minutes of the 505th Meeting of the National Security Council, [FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v11/d34) (Oct. 20, 1962) (Stevenson''s argument). [[w.schlesinger-robert-kennedy-and-his]], 516; [[w.odonnell-johnny-we-hardly-knew]], 366 (the President to O''Donnell and Robert Kennedy on the Truman Balcony: "I think Adlai showed plenty of strength and courage ... I admire him for saying what he said"; Robert Kennedy''s proposal, "put somebody like John McCloy in his place"). Check: the day of the suggestion. To check: Robert Kennedy, memorandum, Nov. 15, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 516 n.81). See [[cal.1962-10-20.missile-crisis]]. Names: Stevenson, Robert Kennedy, Kennedy, O''Donnell.'
