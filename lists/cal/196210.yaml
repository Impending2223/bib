  - id: cal.1962-10-25.europe-and-the-alliance
    when: Oct. 25
    date: '1962-10-25'
    thread: europe-and-the-alliance
    c: 'The Cabinet, 2:45 to 5:15 p.m., on the Home Secretary''s committee''s papers on "the future pattern of Britain": industrial location, housing, offices, transport. The "Liberal" survivors (Erroll, the Lord Chancellor, the Minister of Health) against the "Dirigists" (Brooke, Keith Joseph, the Secretary of State for Scotland). Macmillan''s summing up put off to Monday. Cuba left to him and Home; railway wages, Beeching and the unions.'
    n: '[[w.macmillan-diaries]], 512 (n.98: the Cabinet Committee on Population and Employment). Names: Macmillan, Douglas-Home, Erroll, Brooke, Joseph, Beeching.'
    tags: [name:erroll-frederick-j, name:brooke-henry, name:joseph-keith-s, name:beeching-richard, name:macmillan-harold, name:douglas-home-alec, polity:uk, name:home-alec-douglas]
