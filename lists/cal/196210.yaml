    c: 'Khrushchev''s reply to U Thant, approved by the Presidium: "Заявляю Вам, что я согласен с Вашим предложением" (I declare that I agree with your proposal). The Foreign Ministry''s draft rejected as unfit; the reply to be published with U Thant''s appeal.'
    n: 'P 61/III, Oct. 25, 1962. [[w.prezidium-tsk-kpss-1954]], I, 620 (Malin''s notes: "Сказать кратко: «согласны с Вашим предложением»" (Say briefly: "we agree with your proposal")); I, 1111 n.4; III, 362–63 (the resolution and the reply). See [[cal.1962-10-24.missile-crisis-4]]. Names: Khrushchev, U Thant.'
