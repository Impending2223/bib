    when: Oct. 29
    date: '1962-10-29'
    thread: press-and-broadcasting
    c: 'Sylvester to Richard Fryklund of the *Washington Star*: covering the blockade was harder than covering World War II. "In the kind of world we live in the generation of news by the government becomes one weapon in a strained situation. The results, in my opinion, justify the means." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 285, 295–96 (the newspaper societies'' resolutions after; "generation of news" becomes "management of the news"). Names: Sylvester.'
