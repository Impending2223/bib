    c: 'The ExComm''s Berlin-NATO subcommittee, Nitze in the chair, 11 a.m., its first meeting: the allies to be told that the Soviet acts in Cuba heightened the Berlin crisis; no dramatic initiatives, nuclear weapons into Berlin among them, to force the Soviets out of Cuba.'
