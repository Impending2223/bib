    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 5, 1962. See [[cal.1962-09-27.georgia-ga]].'
