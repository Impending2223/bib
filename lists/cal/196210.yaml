    thread: soviet-union
    also: [missile-crisis-diplomacy]
    c: 'The night after the address, Khrushchev sleeps on a couch in his office, in his clothes: "I was ready for alarming news to come any moment, and I wanted to be ready to react immediately." By his memoir.'
