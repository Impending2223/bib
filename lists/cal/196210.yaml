    c: 'Moscow. Khrushchev summons W. E. Knox, president of Westinghouse Electric International: a blockade illegal except in war; stopping and searching Soviet ships piracy; Soviet submarines would sink an American ship that forced a Soviet ship to stop; the missiles in Cuba admitted; Kennedy should agree to a meeting.'
