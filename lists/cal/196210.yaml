  - id: cal.1962-10-26.missile-crisis-4
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-anadyr
    also: [soviet-union]
    c: Cuba. Soviet nuclear warheads moved from their storage sites to positions closer to their delivery vehicles, against an American invasion. By the Russian accounts of 1992, 162 warheads on the island, at least 90 of them tactical.
    n: '[[w.mcnamara-in-retrospect]], appendix at n.2. Made public: Anatoly Dokochaev, "Afterword to Sensational 100 Day Nuclear Cruise," *Krasnaya Zvezda*, Nov. 6, 1992, 2; V. Badurkin, interview with Dimitri Volkogonov, "Operation Anadyr," *Trud*, Oct. 27, 1992, 3 (cited by [[w.mcnamara-in-retrospect]], appendix n.2). See [[cal.1962-10-26.missile-crisis]].'
