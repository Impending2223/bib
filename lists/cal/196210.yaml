    thread: soviet-union
    c: 'Khrushchev, a note to the Presidium on his tour of Turkmenia, Tajikistan and Uzbekistan: a union production administration for Central Asia''s farming, chiefly cotton, best seated in Tashkent; the republics'' industry in one Central Asian sovnarkhoz; a Central Asian Bureau of the Central Committee, not elected but approved by the Presidium, the republics'' first secretaries among its members. The tour "как бы подготовкой к предстоящему Пленуму ЦК" (as it were a preparation for the coming Plenum of the Central Committee).'
    n: '*Zapiska Pervogo sekretarya TsK KPSS ... N. S. Khrushcheva v svyazi s ego poezdkoi v Tadzhikskuyu i Uzbekskuyu SSR*, Oct. 5, 1962 (RGANI, f. 3, op. 16, d. 158), sent to the members and candidates of the Presidium and the secretaries. [[w.prezidium-tsk-kpss-1954]], III, 326–34 (doc. 262.0.2; the Plenum, 334). Made public: 2008. Names: Khrushchev.'
