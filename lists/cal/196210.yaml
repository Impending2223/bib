    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-excomm
    c: 'After the address. A congressional leader telephones Kennedy: a group of the leaders, watching it together after leaving his office, now understand and support his policy more fully. By Sorensen''s account.'
