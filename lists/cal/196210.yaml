  - id: cal.1962-10-27.missile-crisis-6
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance-jupiters]
    c: Night. Rusk, with Kennedy's assent, telephones Cordier at Columbia and dictates a statement for U Thant to make, proposing the removal of both the Jupiters and the missiles in Cuba, to reach U Thant only on a further signal. None is sent.
