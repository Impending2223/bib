    c: 'Birmingham''s three commissioners, Connor among them, in secret with the firemen''s leaders: a million-dollar raise if the firemen vote against the new charter. A reformer tapes it. Radio advertisements before the vote: a fireman, "Do we get the raise regardless of how the election comes out next Tuesday?"; Mayor Arthur Hanes, "Absolutely not. You don''t get your raises unless we are here to give it to you."'
