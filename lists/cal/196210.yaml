      - 1962-10-26T06:00Z
    time_zone: Europe/Moscow
  - id: cal.1962-10-26.cuba
    when: Oct. 26–27
    date: '1962-10-26'
    thread: cuba
    also: [missile-crisis]
    c: 'Havana, overnight. Castro dictates a letter to Khrushchev at Alekseyev''s: "if they actually carry out the brutal act of invading Cuba, that would be the moment to eliminate such danger forever through an act of legitimate defense, however harsh and terrible the solution would be."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 490. To check: [[w.fursenko-one-hell-of-a]], 272 (cited by [[w.fursenko-khrushchevs-cold-war]], 490 n.85). See [[cal.1962-10-27.soviet-union]]. Names: Castro, Khrushchev.'
