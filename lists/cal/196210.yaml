        - 'w.sorensen-kennedy 697: B, E'
        - 'w.taylor-swords-and-plowshares 271: B-C, E'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a]
