    thread: missile-crisis
    also: [robert-kennedy]
    c: 'Black Saturday. Second letter, broadcast: the Jupiters in Turkey added. Anderson''s U-2 shot down over Cuba; another strays over Siberia. That night Robert Kennedy to Dobrynin: the Jupiters to go, privately.'
    n: 'FRUS 1961–63, XI, docs. [91](https://history.state.gov/historicaldocuments/frus1961-63v11/d91), [94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94), [96](https://history.state.gov/historicaldocuments/frus1961-63v11/d96). [[w.dobbs-one-minute-to-midnight]]; [[w.stern-averting-the-final-failure]]; [[w.sherwin-gambling-with-armageddon]]; [[w.dobrynin-in-confidence]]. See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Dobrynin, Anderson, Robert F. Kennedy.'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:anderson-rudolf-jr, name:khrushchev-nikita-s]
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Radio Moscow: the missiles to be dismantled and returned. Castro refuses inspection.'
    n: '[FRUS 1961–63, XI, doc. 102](https://history.state.gov/historicaldocuments/frus1961-63v11/d102). [Statement by the President Following the Soviet Decision To Withdraw Missiles From Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-soviet-decision-withdraw-missiles-from-cuba) (Oct. 28, 1962). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Castro.'
    tags: [name:castro-fidel, name:khrushchev-nikita-s]
  - id: cal.1962-10-29.japan-and-korea
    when: Oct. 29
    date: '1962-10-29'
    thread: korea
    also: [japan]
    c: 'Kim Chong-p''il, director of the Korean CIA, with Rusk and Harriman, the missile crisis on. Ōhira''s offer in Tokyo, as Kim reports it: $300 million over twelve years, not to be called reparations; Kim asks $600 million with loans. Harriman: the bars on candidates in the 1963 elections. Nov. 12, in Tokyo, Kim and Ōhira settle the figures: $300 million in grants, $200 million in government loans. Check.'
    n: 'FRUS 1961–63, XXII, docs. [280](https://history.state.gov/historicaldocuments/frus1961-63v22/d280), [281](https://history.state.gov/historicaldocuments/frus1961-63v22/d281), [282](https://history.state.gov/historicaldocuments/frus1961-63v22/d282), [283](https://history.state.gov/historicaldocuments/frus1961-63v22/d283). [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]. See [[cal.1962-04-24.japan-and-korea]]. Names: Kim Chong-p''il, Ōhira, Rusk, Harriman.'
    tags: [name:kim-chong-pil, name:ohira-masayoshi, name:rusk-dean, name:harriman-w-averell]
