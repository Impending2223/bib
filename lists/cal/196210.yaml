    c: 'Robert Kennedy calls Dobrynin to his office and gives back Khrushchev''s unsigned letter, by his notes: "No quid pro quo as I told you. ... I told you we would be out of them — 4–5 months. That still holds. ... You have my word on this & that is sufficient." Any published document indicating a deal, and it is off. Dobrynin withdraws the letter.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 523; [[w.dobrynin-in-confidence]], 93 (Robert Kennedy: no formal accord, not even confidential letters; he might run for President some day); [[w.thomas-robert-kennedy]], 231 (Robert Kennedy hands back the letter: "Who knows where and when such letters can surface"; it "could cause irreparable harm to my political career," by Dobrynin''s cable). [[w.rusk-as-i-saw-it-1990]], 240 (the letter given back). Check: Dobrynin does not mention the letter returned (93). To check: Robert Kennedy, handwritten notes, n.d. [Oct. 30, 1962], and Robert Kennedy to Rusk, Oct. 30, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 523, the footnote). The letter: [[cal.1962-10-28.missile-crisis-3]]. Names: Robert Kennedy, Dobrynin, Khrushchev.'
    src:
      c: fbea76ce
      rows:
