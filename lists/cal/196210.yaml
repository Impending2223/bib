  - id: cal.1962-10-05.opinion
    when: Oct. 5
    date: '1962-10-05'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, Aug. 23–28: Negro children here have the same chance at a good education as white children, say 86 percent of Southern whites and 80 of whites elsewhere. About six Southern Negroes in ten say not.'
    n: '[[w.gallup-poll]], III, 1786.'
  - id: cal.1962-10-05.middle-east
    when: Oct. 5
    date: '1962-10-05'
    thread: middle-east-yemen
    c: 'Faisal, Crown Prince of Saudi Arabia, at lunch with Kennedy. Yemen: the rebels would fall without help from the UAR and the Soviet Union. Faisal: American food for the UAR frees Nasser''s money for subversion. Oct. 17, Saud makes Faisal Prime Minister.'
    n: 'Joint Statement Following Discussions With Crown Prince Faysal of Saudi Arabia, [1962 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=793) (Oct. 5, 1962). FRUS 1961–63, XVIII, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v18/d71), [83](https://history.state.gov/historicaldocuments/frus1961-63v18/d83). To check: [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Nasser, Saud ibn Abd al-Aziz Al Saud.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:saud-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:kennedy-john-f]
