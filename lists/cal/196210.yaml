    c: 'The Oval Office, 11 a.m. Kennedy with Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger and Hilsman on the diplomacy of the crisis; Stevenson''s speech to the Security Council gone over, a threat of an American strike cut. Schlesinger sent to help Stevenson. Robert Kennedy: "We will have to make a deal at the end, but we must stand absolutely firm now."'
