  - id: cal.1962-10-29.missile-crisis
    when: Oct. 29
    date: '1962-10-29'
    thread: missile-crisis-settlement
    c: 'Kennedy, twice that day, to Schlesinger, for the record, by Schlesinger''s notes: the Soviets moved to bring Russia and China together, to recast the setting for Berlin after the election, and to deal the United States a political blow. The policy worked for three reasons: overwhelming local conventional superiority; no vital Soviet interest at stake in Cuba; no case the Soviets could sustain before the world. "Not just because we were tough."'
    n: '[[w.reeves-president-kennedy]], 427–28; [[w.schlesinger-journals]], 174 (Monday, Oct. 22, 10 a.m.: Schlesinger asks why the Russians did it; Kennedy gives three reasons (bring Russia and China closer; "radically redefine the setting in which the Berlin situation would be reopened after the election"; "deal the U.S. a tremendous political blow"); not the three reasons the policy worked). Check: the day of the three reasons the Soviets moved: [[w.schlesinger-journals]], 174, has Kennedy give them to Schlesinger at about 10 a.m. on Monday, Oct. 22 (Russia and China closer; the setting for Berlin after the election; "a tremendous political blow"), not on Oct. 29. To check: Proceedings of the Hawk''s Cay Conference on the Cuban Missile Crisis, Mar. 5–8, 1987, 11–12, 15, Center for Science and International Affairs, Harvard (cited by [[w.reeves-president-kennedy]], 427). Made public: the Hawk''s Cay Conference, Mar. 5–8, 1987, by Reeves''s note (427). Names: Schlesinger, Kennedy.'
    src:
      c: b97b5e34
      rows:
        - 'w.reeves-president-kennedy 427–28: all'
        - 'via w.reeves-president-kennedy 427 n.he-told-me-he-thought-it: all'
        - 'w.schlesinger-journals 174: ?'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
