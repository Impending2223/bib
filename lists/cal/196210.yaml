    c: 'Washington, the afternoon, nearly two and a half hours. Schröder with Rusk, Tyler, Hillenbrand, Thompson and Dowling: the Soviets have not settled their next steps; Khrushchev''s war of nerves; Berlin no war to him unless his prestige is gravely engaged. Rusk: not sure Khrushchev knows the West will fight; he will reopen talks after the American elections, insisting on West Berlin and the separate treaty.'
    n: 'Schröder to the Auswärtiges Amt, Fernschreiben Nr. 3070, Oct. 16, 1962, 6:40 p.m. (the talk "gestern"). [[w.akten-zur-auswartigen-politik]], III, 1712–14 (Dok. 398). See [[cal.1962-10-14.berlin-and-vienna]]. Names: Schröder, Rusk, Tyler, Thompson, Dowling, Khrushchev.'
    tags: [name:schroder-gerhard, name:rusk-dean, name:tyler-william-r, name:thompson-llewellyn-e, name:dowling-walter-c, name:khrushchev-nikita-s, polity:frg, polity:us, polity:ussr]
