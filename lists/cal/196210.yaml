    c: 'Van Zandt (R-Pa.), leaving a State Department briefing, makes public what the Navy has done, or not done, at the quarantine line, which Kennedy wanted kept secret; on radio and television within the hour. Kennedy, angry, has Hughes, the deputy director of intelligence who gave the briefing, paged at Idlewild: "What the hell is going on?"'
