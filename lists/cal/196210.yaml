    thread: soviet-union
    also: [missile-crisis]
    c: 'Moscow, just after 9 a.m., Pliyev''s flash cable: an American strike expected that night or at dawn; Castro has ordered his air defense to fire; "in the event of a U.S. air attack on our installations, we will employ all available means of air defense." Malinovsky, 11 a.m.: "I propose to confirm."'
    n: '[[w.fursenko-one-hell-of-a]], 271–72; [[w.mcnamara-in-retrospect]], appendix at n.2 (Pliyev''s cable to Malinovsky, the day after the warheads were moved; sent on to Khrushchev, returned "Approved"). Check: McNamara, from the Russian press of 1992, has Pliyev''s cable report the warheads moved closer to their delivery vehicles on Oct. 26, and Khrushchev write "Approved" across it (appendix at n.2). To check: *Na Krayu Propasti* (cited by [[w.fursenko-one-hell-of-a]], 271 n.55). See [[cal.1962-10-27.missile-crisis]]. Names: Castro, Malinovsky.'
