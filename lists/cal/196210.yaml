  - id: cal.1962-10-27.missile-crisis-excomm-2
    when: Oct. 27
    date: '1962-10-27'
    time: 1962-10-27T20:00Z
    thread: missile-crisis-excomm
    c: 'The ExComm from 4 p.m. About 5:40 McNamara reports a U-2''s wreckage and the pilot''s body found near a Soviet-manned SAM site. McNamara: to allow time with the NATO allies, no air attack before Wednesday, Oct. 31, or Thursday, Nov. 1, but only with surveillance kept up and fire returned on anything firing at it; an air strike would have to be all-out, almost certainly leading to an invasion.'
    n: '[[w.poole-joint-chiefs-of-staff]], 180. To check: [[w.kennedy-tapes]], 356, 358, 364 (cited by [[w.poole-joint-chiefs-of-staff]], 180 n.87). See [[cal.1962-10-27.missile-crisis]]. Names: McNamara.'
    src:
      c: 7b73eedb
      rows:
        - 'w.poole-joint-chiefs-of-staff 180: all'
        - 'via x.1962-10-27.recording-excomm-meeting-oct-27-1962: B-D'
    tags: [name:mcnamara-robert-s]
  - id: cal.1962-10-27.missile-crisis-diplomacy
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-diplomacy
    c: Dobrynin writes up his meeting with Robert Kennedy for Moscow at once and sends it by Western Union, there being no faster means; a boy comes on a bicycle to pick it up.
    n: '[[w.thomas-robert-kennedy]], 228. To check: [[w.reeves-president-kennedy]], 420–21 (cited by Thomas, 437). See [[cal.1962-10-27.missile-crisis]]. Names: Dobrynin, Robert Kennedy.'
    src:
      c: 6970b6d4
      rows:
        - 'w.thomas-robert-kennedy 228: all'
    tags: [name:dobrynin-anatoly, name:kennedy-robert-f]
  - id: cal.1962-10-27.missile-crisis-excomm
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-excomm
    also: [robert-kennedy]
    c: 'The family quarters, after the meeting with Dobrynin. Robert Kennedy reports to the President, with Powers eating chicken; he holds out little hope the Russians will back down. The President: "God, Dave, the way you''re eating up all that chicken and drinking up all my wine, anybody would think it was your last meal." After the ExComm breaks up at midnight, the President and Powers watch *Roman Holiday*.'
    n: '[[w.thomas-robert-kennedy]], 228–29; [[w.odonnell-johnny-we-hardly-knew]], 385–87 (the reply to Khrushchev''s first letter handwritten by Robert Kennedy, reworked and signed by Kennedy; Robert Kennedy''s report on Dobrynin at the Department of Justice; Kennedy to Powers: "God, Dave, the way you''re eating up all that chicken and drinking up all my wine, anybody would think it was your last meal"; the nine o''clock ExComm "pessimistic"; Roman Holiday; not the midnight or his hope of the Russians). To check: [[w.reeves-president-kennedy]], 420–21. See [[cal.1962-10-27.missile-crisis]]. Names: Robert Kennedy, Kennedy, Powers.'
    src:
      c: 4c6b1c9e
      rows:
        - 'w.thomas-robert-kennedy 228–29: all'
        - 'w.odonnell-johnny-we-hardly-knew 385–87: A, B, D'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:powers-david-f]
  - id: cal.1962-10-27.china
    when: Oct. 27
    date: '1962-10-27'
    thread: china
    c: Zhongnanhai, the Juxiang Shuwu, evening. Mao Zedong calls Zhou Enlai and others to a meeting.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 27, 1962. Made public: Check (2013 at the latest). See [[cal.1962-10-26.china]]. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
  - id: cal.1962-10-27.soviet-union-2
    when: Oct. 27
    date: '1962-10-27'
    thread: soviet-union
    also: [missile-crisis]
    c: 'Moscow, the Presidium on further steps on Cuba, Khrushchev, Mikoyan, Malinovsky, Gromyko and others speaking. Malin''s notes: the Americans will hardly invade, but no one can vouch for it; no end to the conflict without satisfying the Americans and telling them the R-12s are there; with the base in Turkey and Pakistan liquidated besides, Moscow comes out the winner; inspection once the missiles are out. All for Khrushchev''s proposal. Pavlov''s proposal from Havana approved.'
    n: 'Protocol 62. [[w.prezidium-tsk-kpss-1954]], I, 622–23 (Malin''s notes: "Не сможем ликвидировать конфликта, если не дадим удовлетворения американцам и не скажем им, что наши ракеты Р-12 есть там" (We cannot liquidate the conflict unless we give the Americans satisfaction and tell them our R-12 missiles are there); "А если еще мы получим в придачу ликвидацию базы в Турции, Пакистане, то мы окажемся в выигрыше" (And if we also get the liquidation of the base in Turkey, Pakistan into the bargain, we shall come out the winners)); I, 1112 n.2 (the editors: "Pavlov" Alekseyev, Castro''s proposal to declare the missiles under Soviet control). Check: the volume''s other notes make "Pavlov" Pliyev (III, 367 n.г), and the cable of Oct. 27 "Товарищу ПАВЛОВУ" is addressed to Pliyev (III, 390, doc. 268.8.1). See [[cal.1962-10-27.soviet-union]]. Made public: 2003. Names: Khrushchev, Mikoyan, Malinovsky, Gromyko.'
    tags: [name:khrushchev-nikita-s, name:mikoyan-anastas, name:malinovsky-rodion-y, name:gromyko-andrei, polity:ussr, polity:us, polity:turkey, polity:pakistan, polity:cuba]
  - id: cal.1962-10-27.missile-crisis-anadyr
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-anadyr
    also: [soviet-union]
    c: 'Moscow to Pliyev ("Pavlov"), by cipher cable over "Director": "применять ядерное оружие из ракет, ФКР, Луна и с самолетов без санкции из Москвы запрещается" (the use of nuclear weapons from missiles, cruise missiles, Lunas and aircraft without Moscow''s sanction is forbidden), "categorically" confirmed.'
    n: 'APRF, f. 3, op. 65, d. 906, l. 2 (a copy), approved with Pavlov''s instructions by P 63/IX, Oct. 28. [[w.prezidium-tsk-kpss-1954]], III, 390 (doc. 268.8.1); I, 1112 n.3 (the editors: after the U-2 was shot down, Khrushchev''s cable to Pliyev forbidding the missiles'' use). See [[cal.1962-10-27.soviet-union]]. Made public: 2008. Names: Pliyev.'
    tags: [name:pliyev-issa-a, polity:ussr, polity:cuba]
  - id: cal.1962-10-27.missile-crisis-excomm-3
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-excomm
    c: 'The White House, Saturday, the Rose Garden, after the word that Major Anderson''s U-2 had been shot down. Kennedy walks out to restrain his irritation; O''Donnell follows. By O''Donnell, Kennedy is "not so much upset by Khrushchev''s change in attitude as exasperated because the Jupiter missiles were still in Turkey." Kennedy: "Just to set the record straight, will you find out when was the last time I asked to have those damned missiles taken out of Turkey? Not the first five times I asked for their removal, just the date of the last time." O''Donnell has Bromley Smith check the file: the order was in August.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 382 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Khrushchev, O''Donnell, Bromley Smith.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s, name:odonnell-kenneth-p, polity:ussr, polity:cuba, polity:turkey, name:smith-bromley-k]
  - id: cal.1962-10-27.missile-crisis-excomm-4
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-excomm
    c: 'Washington, the Sans Souci, lunch, after the morning ExComm meeting at which Kennedy asked McNamara to sound out NATO on trading the Jupiters. O''Donnell to Robert Kennedy: "Your brother will be making a terrible mistake if he pulls those missiles out of Turkey right now. Everybody in Western Europe will turn against us. And there''s no need of it." Robert Kennedy: "You''re right. Let''s eat up quickly, and get back there and talk to him."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 384 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Robert Kennedy, Kennedy, McNamara.'
    tags: [name:odonnell-kenneth-p, name:kennedy-robert-f, name:kennedy-john-f, name:mcnamara-robert-s, polity:cuba, polity:turkey]
  - id: cal.1962-10-27.missile-crisis-excomm-5
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-excomm
    c: 'The White House, the mansion, lunch, after Kennedy''s swim. Robert Kennedy and O''Donnell tell him their talk at the Sans Souci against taking the missiles out of Turkey. Kennedy: "Relax. You fellows ought to know me better than that. I have no intention of taking those missiles out of Turkey. The only reason I asked McNamara to talk to the NATO people about it was because I was wondering what they would say."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 384 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Robert Kennedy, O''Donnell, Kennedy, McNamara.'
    tags: [name:kennedy-robert-f, name:odonnell-kenneth-p, name:kennedy-john-f, name:mcnamara-robert-s, polity:cuba, polity:turkey]
  - id: cal.1962-10-27.press-and-broadcasting
    when: Oct. 27
    date: '1962-10-27'
    thread: press-and-broadcasting
    also: [defense]
    c: At Kennedy's order, angry that people at Defense and State put out what the press is asked not to print, Sylvester has all Defense officials report in memoranda their press contacts, the questions and their answers. The press protests it as censorship. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 294. Names: Kennedy, Salinger, Sylvester.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:sylvester-arthur]
  - id: cal.1962-10-27.missile-crisis-diplomacy-2
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-diplomacy
    c: 'After the second letter, Scali telephones Fomin (Feklisov) at 4 p.m. and meets him a quarter hour later at the Statler. Scali: "a stinking double-cross"; the Turkish formula "completely, totally, utterly and perpetually unacceptable." Fomin: the cable traffic delayed Moscow''s answer; he and Ambassador Dobrynin await a reply. By Scali''s memorandum to Rusk, printed by Salinger.'
    n: '[[w.salinger-with-kennedy]], 277–78. See [[cal.1962-10-27.missile-crisis-2]]. Names: Scali, Feklisov, Dobrynin, Rusk.'
