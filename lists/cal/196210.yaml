    n: '[Kennedy and Robert Kennedy, 7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/discussion-between-president-kennedy-and-robert-kennedy), Tapes 36.1 and 36.2 (Miller Center). [Proclamation No. 3504](https://www.presidency.ucsb.edu/documents/proclamation-3504-interdiction-the-delivery-offensive-weapons-cuba), [27 Fed. Reg. 10,401](https://www.govinfo.gov/app/details/FR-1962-10-25) (1962). Opinion: Katzenbach to Robert Kennedy, Oct. 23, on the draft proclamation: Russian ships not bound for Cuba searchable within a reasonable zone, or where a change of course is a ruse, [FRUS 1961–63, X–XII, microfiche supp., doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d374). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy, Dobrynin.'
