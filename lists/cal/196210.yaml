    c: 'London, noon. Macmillan to Khrushchev, Butler, Home, Thorneycroft and Heath agreeing: the missiles to be taken out of Cuba, as the Americans demand; then to more constructive work, disarmament and the like. Sent through diplomatic channels; Moscow''s climb-down came by radio as they finished lunch.'
    n: '[[w.macmillan-diaries]], 513–14. See [[cal.1962-10-28.missile-crisis]]. Names: Macmillan, Khrushchev, Butler, Douglas-Home, Thorneycroft, Heath.'
    tags: [name:macmillan-harold, name:khrushchev-nikita-s, name:butler-richard-a, name:douglas-home-alec, name:thorneycroft-peter, name:heath-edward-r-g, polity:uk, polity:ussr, polity:us, polity:cuba, name:home-alec-douglas]
