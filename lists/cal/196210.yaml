    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    also: [testing]
    c: 'SANE: an "immediate military disengagement" under the UN; the quarantine and the work on the Cuban missiles halted together; the missiles in Turkey and Cuba withdrawn under the UN''s guarantees.'
