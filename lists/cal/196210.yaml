  - id: cal.1962-10-05.vietnam-hanoi
    when: Oct. 5
    date: '1962-10-05'
    thread: vietnam-hanoi
    also: [china]
    c: 'Zhongnanhai, the Yinian Tang, afternoon. Mao Zedong receives a Vietnamese military delegation led by Võ Nguyên Giáp; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Ye Jianying, Luo Ruiqing and Xiao Xiangrong present. Mao: imperialism reaches too far, "十个指头按十只跳蚤，结果是一个也抓不到" (ten fingers on ten fleas: in the end it catches none); in South Vietnam and Laos the Vietnamese have caught one of America''s "fingers"; five or ten more years of war, and when they call for a Geneva conference America may have to compromise, or else intervene further; an attack on the North must reckon with the South''s guerrillas, the peoples'' struggles in Laos and Thailand, China, Korea and the North''s own strength; "美国还不敢轻易下手" (America does not yet dare move lightly).'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1962. [[w.jian-zhou-enlai]], 494 (Mao and Zhou with Giap; Mao, in Chen''s translation: "in the past years, we have not thought much about the offensives by the imperialists. We now should give some good attention to it"; the Vietnamese have "caught one of the Americans'' five fingers"; "it is not an easy decision for the United States to intervene"; China "will pay very close attention to the situation in South Vietnam and Laos"; not the place, the hour, the others present or the fleas). Made public: Check (the words; 2013 at the latest). To check: [[w.jian-maos-china-and-the]], 207; Mao''s conversation with Giap, Oct. 5, 1962, Chinese Central Archive (cited by [[w.jian-zhou-enlai]], 765 n.11). Names: Mao Zedong, Võ Nguyên Giáp, Zhou Enlai.'
    src:
      c: 29c81015
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Oct. 5, 1962: all'
        - 'w.jian-zhou-enlai 494: ?'
    tags: [name:mao-zedong, name:vo-nguyen-giap, name:zhou-enlai, polity:prc, polity:drv, polity:us, polity:laos, polity:thailand, polity:dprk]
  - id: cal.1962-10-05.soviet-union
    when: Oct. 5
