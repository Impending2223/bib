  - id: cal.1962-10-18.missile-crisis-4
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 'Bohlen, leaving for Paris, to the President: the missiles must go, but "it seems to me essential that this channel should be tested out before military action is employed." Sorensen''s summary the same day: "the Rusk or the Bohlen approaches," a strike without warning or a prompt letter to Khrushchev first.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 513. To check: [[w.bohlen-witness-to-history-1929]], 491 (cited by [[w.schlesinger-robert-kennedy-and-his]], 513 n.66); Sorensen, memorandum, Oct. 18, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 513 n.67). See [[cal.1962-10-16.missile-crisis]]. Names: Bohlen, Kennedy, Sorensen, Rusk, Khrushchev.'
