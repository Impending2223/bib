    follows:
      - cal.1962-10-22.missile-crisis
    c: 'The night after the President''s address, Taylor sleeps in his Pentagon office, the only time in the crisis: Khrushchev may hold "some card up his sleeve"; a move to hide the missiles feared.'
    n: '[[w.taylor-swords-and-plowshares]], 274 (Taylor''s account). See [[cal.1962-10-22.missile-crisis]]. Names: Taylor, Khrushchev.'
    src:
      c: 6a19d4cf
      rows:
        - 'w.taylor-swords-and-plowshares 274: all'
    tags: [name:taylor-maxwell, name:khrushchev-nikita-s]
  - id: cal.1962-10-22.china
    when: Oct. 22
    date: '1962-10-22'
    thread: china
    c: Zhongnanhai, the Juxiang Shuwu, 7 p.m. Mao Zedong calls Zhou Enlai and others to a meeting.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1962 (the entry for Oct. 20: "二十二日晚七时，在中南海菊香书屋召集周恩来等开会"). Made public: Check (2013 at the latest). See [[cal.1962-10-20.china]]. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
  - id: cal.1962-10-22.south-asia
    when: Oct. 22
    date: '1962-10-22'
    thread: south-asia
    also: [china]
    c: 'The Defense Ministry''s spokesman: India''s troops have crossed the McMahon line, taken large tracts of Chinese territory and attacked China''s frontier forces in strength; "为了防止印度军队卷土重来，再度发动进攻，我边防部队在自卫战斗中，没有必要再受这条非法的麦克马洪线的约束" (to keep India''s troops from returning and attacking again, our frontier forces, fighting in self-defense, need no longer be bound by this illegal McMahon line).'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1962. To check: the statement''s published text. See [[cal.1962-10-20.india-and-china]].'
    tags: [polity:prc, polity:india]
  - id: cal.1962-10-23.soviet-union
    when: Oct. 22–23
    date: '1962-10-22'
    thread: soviet-union
    also: [missile-crisis]
    follows:
      - cal.1962-10-22.soviet-union
    part_of: cal.1962-10-22.soviet-union-leadership
    c: 'Moscow, after 1 a.m., the Presidium on the address: the four submarines to go on, the *Aleksandrovsk* to the nearest port, the four ships with the R-14s to keep course, the ships not yet arrived to turn back. The Soviet and Warsaw Pact forces put on alert; leaves stopped.'
    n: '[[w.fursenko-one-hell-of-a]], 247–48; [[w.fursenko-khrushchevs-cold-war]], 476–80 (the *Aleksandrovsk* to come in; the ships in the Mediterranean home; the submarines); [[w.prezidium-tsk-kpss-1954]], I, 618–19 (Protocol 60). Check: Fursenko and Naftali''s later account (476–80) has the Presidium sit again at 10 a.m., after lunch and in the evening, Oct. 23: the ships in the Atlantic to go no farther than the approaches to Cuba; Mikoyan twice overruled on the submarines, then Gorshkov''s map, the four to hold two days'' sail from Cuba, an order none of them received; the ships with the R-14s told to turn only Oct. 25 (477 n.47). Check: the volume prints these decisions in Protocol 60, the session of Oct. 22 (I, 617–19): the ships in the Mediterranean back to the Black Sea, the ships not yet arrived turned back, the four submarines on, the *Aleksandrovsk* to the nearest port; the Warsaw Pact''s commander called in. Check: the volume''s resolution of Oct. 23 under Protocol 60, P 60/I ([[w.prezidium-tsk-kpss-1954]], III, 339–40), approves the government''s statement, the letters to Kennedy and to Castro and Zorin''s instructions; nothing of the ships or the alert. To check: the extracts of Protocol 60, APRF (cited by [[w.fursenko-one-hell-of-a]], 247 n.12, 248 n.13). See [[cal.1962-10-22.soviet-union]].'
    src:
      c: 920d7639
      rows:
        - 'w.fursenko-one-hell-of-a 247–48: all'
        - 'via w.fursenko-one-hell-of-a 247 n.12a: A'
        - 'via w.fursenko-one-hell-of-a 247 n.12b: A'
        - 'via w.fursenko-one-hell-of-a 248 n.13: B-C'
        - 'w.fursenko-khrushchevs-cold-war 476–80: A'
        - 'via x.2006.kcw-p476-80: A'
        - 'w.prezidium-tsk-kpss-1954 I, 618–19: A-B'
        - 'via x.1962-10-22.malins-notes-protocol-60-oct-22: A-B'
    time_range:
      - 1962-10-22T22:00Z
      - 1962-10-23T03:00Z
    time_zone: Europe/Moscow
  - id: cal.1962-10-22.soviet-union-3
    when: Oct. 22
    date: '1962-10-22'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    follows:
      - cal.1962-10-23.soviet-union
    part_of: cal.1962-10-22.soviet-union-leadership
    c: 'The Presidium, after Cuba, on Demichev''s report of the CPSU delegation in the GDR: the Ambassador better replaced by one who has their trust; their information wrong; Ulbricht to be answered on his planned reorganization of economic management: "в отношении Советов не разделяем, не возлагаем надежды" (on the councils, we do not share it, we place no hopes in them). The delegation''s work approved, by resolution of Oct. 23.'
    n: 'Protocol 60, item IV. [[w.prezidium-tsk-kpss-1954]], I, 619 (Malin''s notes); III, 351 (P 60/IV, Oct. 23). See [[cal.1962-10-22.soviet-union]]. Made public: 2003. Names: Ulbricht, Demichev.'
    tags: [name:demichev-pyotr-n, name:ulbricht-walter, polity:ussr, polity:gdr]
  - id: cal.1962-10-22.missile-crisis-diplomacy-2
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-diplomacy
    c: 'London, after the text of Kennedy''s speech arrives about 5 p.m. Macmillan and Home draft the reply: support in preventing the Russians'' "new act of aggression," with points for thought. A first draft, advising him to seize Cuba, dropped.'
    n: '[[w.macmillan-diaries]], 509 (the "Suez analogy"; the fear of a trade of the Cuban rockets for Turkish or Italian bases, or of Berlin for Cuba). See [[cal.1962-10-22.missile-crisis-16]]. Names: Macmillan, Douglas-Home, Kennedy.'
    tags: [name:macmillan-harold, name:douglas-home-alec, name:kennedy-john-f, polity:uk, polity:us, polity:cuba, polity:ussr, name:home-alec-douglas]
  - id: cal.1962-10-22.europe-and-the-alliance
    when: Oct. 22
    date: '1962-10-22'
    thread: europe-and-the-alliance
    also: [missile-crisis]
    c: 'London, 8 to 11 p.m., Macmillan''s dinner for Norstad. Washington is urging a NATO alert: for Britain a Royal Proclamation and the reservists called up. Macmillan: "we wd not repeat not agree at this stage"; mobilization had sometimes caused war. Norstad agrees.'
    n: '[[w.macmillan-diaries]], 510. Names: Macmillan, Norstad.'
    tags: [name:macmillan-harold, name:norstad-lauris, polity:uk, polity:us]
  - id: cal.1962-10-22.missile-crisis-diplomacy-3
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-diplomacy
    c: 'London. Macmillan takes Gaitskell, a guest at the Norstad dinner, to the Cabinet room and shows him the documents and the President''s speech. Gaitskell: his party "would not like it."'
    n: '[[w.macmillan-diaries]], 510. See [[cal.1962-10-22.europe-and-the-alliance]]. Names: Macmillan, Gaitskell.'
    tags: [name:macmillan-harold, name:gaitskell-hugh, polity:uk]
  - id: cal.1962-10-22.missile-crisis-diplomacy-4
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: Dowling briefs Adenauer in advance on the President's measures against the Soviet missile sites in Cuba, with the text of the address and the CIA's intelligence memorandum of Oct. 21.
    n: '[[w.akten-zur-auswartigen-politik]], III, 1764 n.9 (with Knappstein to the Auswärtiges Amt, Drahtbericht Nr. 3151, Oct. 22: his thanks to Tyler for the advance briefing). To check: the letters of Kennedy and Adenauer, Oct. 22–23, [[w.adenauer-briefe-1961-1963]], 175–76, 453 (cited by [[w.akten-zur-auswartigen-politik]], III, 1765 n.9). See [[cal.1962-10-22.missile-crisis-22]]. Names: Dowling, Adenauer.'
    tags: [name:dowling-walter-c, name:adenauer-konrad, polity:us, polity:frg, polity:cuba, polity:ussr]
  - id: cal.1962-10-22.middle-east
    when: Oct. 22
    date: '1962-10-22'
    thread: middle-east
    c: 'After luncheon with Home, Macmillan with the Governor of Aden, Home and Sandys present, on Yemen: the royalists unlikely to overthrow the new revolutionary government; early recognition inevitable. The Governor asks more time, about a week.'
    n: '[[w.macmillan-diaries]], 509 (n.93: Hassan, Badr). Names: Macmillan, Douglas-Home, Sandys.'
    tags: [name:macmillan-harold, name:douglas-home-alec, name:sandys-duncan-e, polity:uk, polity:yemen, name:home-alec-douglas]
  - id: cal.1962-10-22.soviet-union-4
    when: Oct. 22
    date: '1962-10-22'
    thread: soviet-union
    also: [china, south-asia]
    c: 'The Soviet government''s memorandum to the Chinese government: Moscow endorses China''s position in the war with India; on the McMahon line it "supports China''s stand, that is, it is not an established borderline, but a legacy of the tragic historical past."'
    n: '[[w.jian-zhou-enlai]], 485–86. Made public: Check. To check: Memorandum of the Soviet government to the Chinese government, Oct. 22, 1962, 109-03801-02, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 764 n.97). See [[cal.1962-10-18.south-asia]].'
    tags: [polity:ussr, polity:prc, polity:india]
  - id: cal.1962-10-22.missile-crisis-33
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: 'The White House, after the congressional leaders have left his office. Kennedy to O''Donnell and others: "Oh, sure, we support you, Mister President. But it''s your decision, not ours, and if it goes wrong, we''ll knock your block off."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 372–73 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell.'
    tags: [name:kennedy-john-f, name:odonnell-kenneth-p, polity:cuba]
  - id: cal.1962-10-22.missile-crisis-quarantine
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-quarantine
    also: [press-and-broadcasting]
    c: Morning. Salinger asks Minow of the FCC to clear the way for the use of ten radio stations; Minow flies back from New York and telephones the managers to stand by for a White House call at 6 p.m. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 261. Names: Salinger, Minow.'
    tags: [name:salinger-pierre, name:minow-newton-n]
  - id: cal.1962-10-22.missile-crisis-quarantine-2
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-quarantine
    also: [missile-crisis]
    c: 'Afternoon. Kennedy gives Salinger a backgrounder for the questions after the address: a quarantine over an air strike because no strike is certain to hit every site; the missiles'' secrecy and the Russians'' denials; proof only since Tuesday; the Turkish bases not the same as Cuba''s missiles. "The next move is up to the Russians." By Salinger''s account, from his notes of the direct quotes.'
    n: '[[w.salinger-with-kennedy]], 262–63. Names: Kennedy, Salinger.'
    tags: [name:salinger-pierre, name:kennedy-john-f]
  - id: cal.1962-10-22.missile-crisis-34
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: '4:10 p.m., Salinger''s briefing. Asked if the President''s cold was "a diplomatic illness," Salinger: "The President definitely had a degree of temperature in Chicago." Does he still have a cold? "No, he is fine." By Salinger''s account, met with incredulity.'
    n: '[[w.salinger-with-kennedy]], 263. Names: Salinger, Kennedy.'
    tags: [name:salinger-pierre, name:kennedy-john-f]
  - id: cal.1962-10-22.missile-crisis-quarantine-3
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-quarantine
    also: [cuba]
    c: 6 p.m. Salinger telephones the managers of ten radio stations, Ralf Brent of WRUL first, with the President's request, worded with the FCC's lawyers, that they give their transmitters to the government from sunset to sunrise for Spanish broadcasts, voluntarily and with their costs paid. The cables are already at their doors. All agree. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 259, 264. See [[cal.1962-10-22.missile-crisis-25]]. Names: Salinger, Kennedy.'
    tags: [name:salinger-pierre, name:kennedy-john-f]
  - id: cal.1962-10-22.missile-crisis-35
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [press-and-broadcasting, soviet-union]
    c: 'Salinger puts Sagatelyan of Tass in the pool at the President''s office for the address: "I want to be sure that you read the President loud and clear." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 264. Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1962-10-22.missile-crisis-36
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'After the address, Salinger''s office, the largest press crowd of his tenure but for the assassination: a hundred questions in fifteen minutes. The President stays in Washington "at least for the foreseeable future"; Kennedy did not call Gromyko a liar; he and Johnson cancel their political tours. Next move if the blockade fails: "I am not in charge of speculation." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 266–67. Names: Salinger, Kennedy, Gromyko, Johnson.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:gromyko-andrei, name:johnson-lyndon-b]
  - id: cal.1962-10-22.missile-crisis-37
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'Night, after the briefing. Salinger sends one by one for the White House correspondents who would go with the President if Washington were evacuated: never more than fifteen minutes away. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 267. Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1962-10-22.missile-crisis-38
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: Night. Salinger telephones Bill Steven, editor of the *Houston Chronicle*, chosen executive officer of the Censorship Advisory Board, to fly to Washington; he does. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 267. See [[cal.1962-10-21.missile-crisis-10]]. Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1962-10-22.vietnam-hanoi
    when: Oct. 22
    date: '1962-10-22'
    thread: vietnam-hanoi
    c: The Secretariat's instruction no. 55-CT/TW on basic political education for the Party members of the countryside, factories, construction sites and state farms.
    n: '*Chỉ thị của Ban Bí thư số 55-CT/TW về việc giáo dục chính trị cơ bản cho đảng viên nông thôn, nhà máy, công trường, nông trường*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 763–68. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1962-10-22.vietnam-hanoi-2
    when: Oct. 22
    date: '1962-10-22'
    thread: vietnam-hanoi
    c: 'The Secretariat''s instruction no. 56-CT/TW on raising livestock in the first five-year plan: its progress slow and uneven, in places backward, since 1958.'
    n: '*Chỉ thị của Ban Bí thư số 56-CT/TW về phương hướng và biện pháp đẩy mạnh chăn nuôi trong kế hoạch 5 năm lần thứ nhất*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXIII, 769–82. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1962-10-22.soviet-union-leadership
    when: Oct. 22–23
    date: '1962-10-22'
    thread: soviet-union-leadership
    follows:
      - cal.1962-10-22.intelligence-2
    c: 'The Presidium in session, Protocol 60, Khrushchev presiding, past midnight into Oct. 23. Present: Brezhnev, Kozlov, Kosygin, Mikoyan, Polyansky, Suslov, Shvernik, Grishin, Demichev, Ilyichev, Ponomarev, Shelepin.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 617–19 (Protocol 60, Malin''s notes and his list of those present; Kennedy''s letter received, 619); III, 339–51 (P 60/I and IV, dated Oct. 23); III, 1008–10 nn.1, 8, 14 (Khrushchev presiding; Kennedy''s letter handed over at 1 a.m. Moscow time, Oct. 23; item IV taken at "the session of Oct. 23"). Names: Khrushchev, Brezhnev, Kozlov, Kosygin, Mikoyan, Polyansky, Suslov, Shvernik, Demichev, Ponomarev, Shelepin.'
    tags: [name:khrushchev-nikita-s, name:brezhnev-leonid, name:kozlov-frol-r, name:kosygin-aleksei, name:mikoyan-anastas, name:polyansky-dmitri-s, name:suslov-mikhail-a, name:shvernik-nikolai-m, name:demichev-pyotr-n, name:ponomarev-boris-n, name:shelepin-aleksandr-n]
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-quarantine
    also: [robert-kennedy]
    c: OAS endorses the quarantine, none opposed. Proclamation signed; in force 10 a.m., Oct. 24. Robert Kennedy sees Dobrynin.
    n: '[Kennedy and Robert Kennedy, 7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/discussion-between-president-kennedy-and-robert-kennedy), Tapes 36.1 and 36.2 (Miller Center). [Proclamation No. 3504](https://www.presidency.ucsb.edu/documents/proclamation-3504-interdiction-the-delivery-offensive-weapons-cuba), [27 Fed. Reg. 10,401](https://www.govinfo.gov/app/details/FR-1962-10-25) (1962). Opinion: Katzenbach to Robert Kennedy, Oct. 23, on the draft proclamation: Russian ships not bound for Cuba searchable within a reasonable zone, or where a change of course is a ruse, [FRUS 1961–63, X–XII, microfiche supp., doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d374). [[w.ball-past-has-another-pattern]], 299 (19–0); [[w.fursenko-one-hell-of-a]], 255; [[w.rusk-as-i-saw-it-1990]], 236 (the OAS vote); [[w.fursenko-khrushchevs-cold-war]], 482 (the OAS); [[w.sorensen-kennedy]], 706, 708–09; [[w.sorensen-kennedy]], 706, 708 (the OAS unanimous; the proclamation issued, effective the next day). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy, Dobrynin.'
