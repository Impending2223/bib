    c: 'Midday, the Presidium, on Kennedy''s letter. Khrushchev: the four missile ships to turn back; "We must dismantle the missiles to make Cuba into a zone of peace"; "Give us a pledge not to invade Cuba, and we will remove the missiles"; the UN may inspect. Approved; the Presidium to the Bolshoi that evening.'
