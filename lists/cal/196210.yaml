    when: Oct. 26
    date: '1962-10-26'
    time: 1962-10-26T16:00Z
    time_approx: true
    thread: missile-crisis-excomm
    also: [press-and-broadcasting]
    c: Noon. Lincoln White, State's press officer, announcing the work going on at the missile sites, refers reporters to the address's "further action will be justified." Headlines that an invasion or an air strike is near. Kennedy, his temper lost, calls Rusk, the Assistant Secretary, then White.
    n: '[[w.sorensen-kennedy]], 711–12. See [[cal.1962-10-22.missile-crisis]]. Check: the hour. Names: White, Rusk, Kennedy.'
