    n: '[[w.schlesinger-robert-kennedy-and-his]], 524; [[w.schlesinger-journals]], 177–78 (the journal of Oct. 29: Kennedy to Schlesinger after the staff meeting, "relaxed and chipper but far from complacent": the Republicans will attack the settlement; "Too many people will think now that all we have to do in dealing with the Russians is to kick them in the balls"; "They had no business in putting those missiles in and in lying to me about it"; of Eisenhower''s two speeches: "It is your father and his poll"; not the words on the military or McNamara). To check: Schlesinger, journal, Oct. 29, 1962, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 524 n.116). See [[cal.1962-10-28.defense]]. Names: Kennedy, Schlesinger, McNamara.'
