  - id: cal.1962-10-23.missile-crisis-2
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    c: 'Khrushchev''s reply: the quarantine a gross violation of the UN Charter and of freedom of navigation; the arms in Cuba defensive. Not to be published for the time being.'
    n: 'FRUS 1961–63, VI, doc. [61](https://history.state.gov/historicaldocuments/frus1961-63v06/d61). [[w.fursenko-one-hell-of-a]], 248; [[w.prezidium-tsk-kpss-1954]], III, 339–40, 345–46 (P 60/I, Oct. 23: the text approved, to go with the government''s statement through the American Ambassador; the letter: a "gross violation" of the UN Charter and of free navigation; the arms "exclusively" for defense; not its publication). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 636–637. Names: Khrushchev.'
    src:
      c: 0e57daee
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d61: all'
        - 'w.fursenko-one-hell-of-a 248: A-B'
        - 'w.prezidium-tsk-kpss-1954 III, 339–40, 345–46: A, B'
    tags: [name:khrushchev-nikita-s]
    time_range:
      - 1962-10-23T06:00Z
      - 1962-10-23T14:00Z
    time_band: workday daytime
    time_zone: Europe/Moscow
