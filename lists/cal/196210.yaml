    when: Oct. 2
    date: '1962-10-02'
    thread: south-asia
    also: [china]
    c: 'Zhongnanhai, the Yinian Tang, afternoon. Mao Zedong chairs the Politburo Standing Committee on the border conflict with India. Decided: a note to India on Oct. 3, the two sides to meet on Oct. 15 as before proposed, either side free to put its views.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 2, 1962 (and n. 110: the proposal of Sept. 13, talks from Oct. 15 in Peking, then Delhi, each side''s forces back 20 kilometers). Made public: Check (2013 at the latest). Names: Mao Zedong.'
