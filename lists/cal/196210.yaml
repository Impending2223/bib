  - id: cal.1962-10-19.missile-crisis
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis-excomm
    c: 'A memorandum, unsigned and unaddressed, in the Office of Legal Counsel''s daybooks: the President may blockade Cuba under the laws of the United States without further action by Congress, ships alone or aircraft too. Lawful under international law, but open to question in the OAS and the UN; Cuba and the Soviet bloc could take it as an act of war.'
    n: '[1 Op. O.L.C. Supp. 486](https://www.justice.gov/olc/file/477221/dl#page=502) (Oct. 19, 1962); the editor''s note: perhaps Meeker''s, with Katzenbach. [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (Meeker''s record of the meeting at State, 11 a.m.: Katzenbach, the President''s authority "ample"; a declaration of war unnecessary). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1962-10-16.missile-crisis]].'
