    date: '1962-10-22'
    thread: missile-crisis
    also: [europe-and-the-alliance-jupiters, defense]
    c: 'Taylor to Norstad: no missile to be fired from Italy or Turkey without the President''s authority. Kennedy at the White House that morning, 11:30: "What we''ve got to do is make sure these fellows ... don''t fire them off and think the United States is under attack. I don''t think we ought to accept the Chiefs'' word on that one."'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 221. To check: White House meeting, Oct. 22, 1962, 11:30 a.m., recorded, May et al., Presidential Recordings, III, 34–35 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 221 n.122). See [[cal.1962-10-21.missile-crisis-8]]. Names: Taylor, Norstad, Kennedy.'
