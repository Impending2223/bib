    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 10 p.m., the White House. Nine of the ExComm in Ball's car, by way of the Treasury and the passage under the White House, to stay with the President past midnight. Kennedy leaning to a blockade; Sorensen to draft a speech. Chayes called home from Paris that night, by Ball's account.
    n: '[[w.ball-past-has-another-pattern]], 292–93. See [[cal.1962-10-18.missile-crisis-3]]. Names: Ball, Kennedy, Sorensen, Chayes.'
