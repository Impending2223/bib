    n: '[[w.schlesinger-robert-kennedy-and-his]], 311. To check: Sam Ervin to the President, Oct. 6, 1962, JFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 311, the footnote). See [[cal.1961-11-23.civil-rights-the-executive]]. Names: Ervin, Kennedy.'
