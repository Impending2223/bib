    c: 'The Joint Chiefs to SACLANT, JCS 6848, on the "blockade": "forceful boarding and control of the ship''s operation may be necessary. If boarding meets with organized resistance, the ship will be destroyed." That afternoon, McNamara approving, they tell Power, CINCSAC, to be ready to go to DEFCON 2 at 10 a.m., Oct. 23, the quarantine''s hour.'
