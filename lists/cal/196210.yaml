      c: f81d4f6f
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 513: all'
        - 'via w.schlesinger-robert-kennedy-and-his 513 n.67: B'
    tags: [name:bohlen-charles-e, name:kennedy-john-f, name:sorensen-theodore-c, name:rusk-dean, name:khrushchev-nikita-s]
  - id: cal.1962-10-19.missile-crisis
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis
    c: 'A memorandum, unsigned and unaddressed, in the Office of Legal Counsel''s daybooks: the President may blockade Cuba under the laws of the United States without further action by Congress, ships alone or aircraft too. Lawful under international law, but open to question in the OAS and the UN; Cuba and the Soviet bloc could take it as an act of war.'
    n: '[1 Op. O.L.C. Supp. 486](https://www.justice.gov/olc/file/477221/dl#page=502) (Oct. 19, 1962); the editor''s note: perhaps Meeker''s, with Katzenbach. [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (Meeker''s record of the meeting at State, 11 a.m.: Katzenbach, the President''s authority "ample"; a declaration of war unnecessary). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1962-10-16.missile-crisis]].'
  - id: cal.1962-10-19.missile-crisis-2
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'The ExComm at State, 11 a.m., the President campaigning. Bundy reopens the air strike: "decisive action with its advantages of surprise." Acheson, Dillon, McCone and Taylor for a strike; McNamara readies the forces but does not advocate it. Robert Kennedy, with a grin, has also talked with the President: an air strike "with all the memory of Pearl Harbor"; "For 175 years we had not been that kind of country. A sneak attack was not in our traditions." He favors action that leaves the Soviets room to pull back.'
    n: 'Meeker''s record, [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31). [[w.schlesinger-robert-kennedy-and-his]], 508–10, with Robert Kennedy''s memorandum of Oct. 31. To check: Robert Kennedy, memorandum dictated Oct. 31, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 509 n.45). See [[cal.1962-10-16.missile-crisis]]. Names: Bundy, Acheson, Dillon, McCone, Taylor, McNamara, Robert Kennedy, Kennedy.'
