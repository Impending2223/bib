  - id: cal.1962-10-26.king
    when: Oct. 26
    date: '1962-10-26'
    thread: king
    c: 'Several conservative papers run nearly the same front-page story, planted by the FBI: O''Dell, of SCLC''s New York office, a "concealed member" of the Communist Party''s national committee. Days later King: O''Dell has resigned, "pending further inquiry"; he stays, off the payroll a while.'
    n: '[[w.garrow-bearing-the-cross]], 222–23; [[w.branch-parting-the-waters]], 675–78; [[w.thomas-robert-kennedy]], 251 (the FBI''s leaks that October; local papers on a high-level Communist in King''s organization); [[w.schlesinger-robert-kennedy-and-his]], 355 ("In October 1962 the Bureau leaked incriminating material about O''Dell to southern newspapers. Soon King placed him on temporary leave"). Check: Branch, 675–78, quotes the *New Orleans Times-Picayune*, Oct. 26, 1962: O''Dell a "Communist who has infiltrated to the top administrative post" in SCLC; four other papers ran the like, from St. Louis to Long Island; King''s statement of Nov. 1 says O''Dell "has functioned purely as a technician"; privately O''Dell never left the staff. To check: *Augusta Chronicle*, Oct. 25, 1962, at A4; *St. Louis Globe-Democrat*, Oct. 26, 1962, at A1; *New Orleans Times-Picayune*, Oct. 26, 1962; *Long Island Star Journal*, Oct. 26, 1962, at 1; FBI New York file 100-111180-8-7, 2A, FBI file 100-111180-8-7; *Birmingham News*, Nov. 2, 1962; *New Orleans Times-Picayune*, Nov. 2, 1962; *Long Island Star Journal*, Nov. 2, 1962, at 1; O''Dell to King, Dec. 4, 1962; Walker to O''Dell, Feb. 1, 1963, King Center; Henry Cabirac to Mathew Ahmann, Jan. 18, 1963, National Catholic Conference for Interracial Justice Papers, box 31, folder 4, Marquette University (cited by [[w.garrow-bearing-the-cross]], 222 n.51). Check: the day; Garrow, 222, cites papers of Oct. 25 and 26. Names: O''Dell, King.'
