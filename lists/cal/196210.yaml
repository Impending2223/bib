  - id: cal.1962-10-15.defense
    when: Oct. 15
    date: '1962-10-15'
    thread: defense
    c: 'The Hickory Hill seminar, at McNamara''s, on Soviet cybernetics; John Ford of the CIA, Robert Livingston of the National Institutes of Health and Dana Durand speak. McNamara to Schlesinger: no sane western leader can envisage initiating nuclear war; "the Pentagon is full of papers talking about the preservation of a ''viable society'' after nuclear conflict," which "drives me mad." "Everyone knows that we won''t go to nuclear war over Berlin. That is why we have to develop a conventional capability." By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 171–72. Made public: [[w.schlesinger-journals]] (2007). Names: McNamara, Schlesinger.'
