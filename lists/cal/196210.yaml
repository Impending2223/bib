    c: 'Hawaii''s primary, for governor. Republican: Governor Quinn over Kealoha, the lieutenant governor, 44,205 to 33,272, 57.1 percent. Democratic: Burns, once Delegate to Congress, over Greenstein, 71,540 to 7,781, 90.2 percent.'
    n: 'Votes: [Haw. *Result of Votes Cast, Primary Election*, Oct. 6, 1962, grand total](https://archive.org/download/HI-hist/1962_Primary.pdf#page=34). To check: [[w.boylan-john-a-burns]]; [[w.coffman-island-edge-of-america]]. See [[cal.1961-01-06.elections-1960]]. Names: Quinn, Burns, Kealoha.'
