  - id: cal.1962-10-25.missile-crisis-quarantine
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis-quarantine
    c: 'Moscow''s note of protest to Washington, on Kuznetsov''s note of Oct. 24, approved by the Presidium by poll: on Oct. 24, from 1:30 to 6 a.m. Moscow time, American military aircraft buzzed the motor ship *Simferopol* three times on the high seas, at 23°30'' N, 62°56'' W, firing their cannon.'
    n: 'P 61/IV, Oct. 25, 1962, and the note''s draft. [[w.prezidium-tsk-kpss-1954]], III, 365–66 (doc. 265.4; the poll, 366 n.a). Names: Kuznetsov.'
    tags: [name:kuznetsov-vasily-v, polity:ussr, polity:us]
