  - id: cal.1962-10-02.mayors-cleveland
    when: Oct. 2
    date: '1962-10-02'
    thread: mayors
    also: [elections-1962]
    c: Cleveland, Democratic primary for the rest of Celebrezze's term. Locher over Mark McElroy, the attorney general, who had lost the primary for governor in May.
    n: '*Plain Dealer*, Oct. 3, 1962, pp. A1, A10 (Check the figures). To check: [[w.davis-black-americans-in-cleveland]]. See [[cal.1962-07-14.transition-and-staff-cleveland]]; [[cal.1962-05-08.governors-oh]]. Names: Locher, McElroy, Celebrezze.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s, name:mcelroy-mark, name:celebrezze-anthony-j]
  - id: cal.1962-10-02.middle-east-johnson-plan
    when: Oct. 2
    date: '1962-10-02'
    thread: middle-east-johnson-plan
    c: 'The plan in the press: Milton Freudenheim''s summary of its main elements, substantially accurate, in the *Chicago Daily News* and the *Washington Post*. The State Department''s spokesman comments.'
    n: FRUS 1961–63, XVIII, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v18/d67), n. 2 (circular telegram 574). See [[cal.1961-08-21.middle-east-johnson-plan]].
  - id: cal.1962-10-03.space
    when: Oct. 3
    date: '1962-10-03'
    thread: space
    c: Schirra's six orbits.
    n: 'Statement by the President on the Orbital Flight of Astronaut Walter Schirra, [1962 Pub. Papers 732](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=792) (Oct. 3, 1962). See [[cal.1961-04-12.space]]. Names: Schirra.'
    tags: [name:schirra-walter-m-jr]
  - id: cal.1962-10-03.european-community
    when: Oct. 3
    date: '1962-10-03'
    thread: european-community
    c: 'Brighton, the Labour Party conference. Gaitskell against entry on the terms in sight: a federal Europe "the end of a thousand years of history." The conference backs the executive''s five conditions. The Commonwealth''s Prime Ministers had met in London, Sept. 10–19. The Conservatives, at Llandudno the next week, for entry (Check the dates).'
    n: 'Labour Party, *Report of the Sixty-First Annual Conference* (1962) (Check the pages). To check: [[w.williams-hugh-gaitskell]]; [[w.ludlow-dealing-with-britain]]; [[w.young-this-blessed-plot]]; [[w.milward-uk-and-the-european]]. See [[cal.1961-10-10.european-community]]. Names: Gaitskell.'
    tags: [name:gaitskell-hugh]
  - id: cal.1962-10-04.middle-east-johnson-plan
    when: Oct. 4
    date: '1962-10-04'
    thread: middle-east-johnson-plan
    c: 'Syria''s Prime Minister, al-Azm, on Joseph Johnson''s plan: a "clear violation" of the General Assembly''s Resolution 194; a plan to settle the refugees outside their homeland.'
    n: 'FRUS 1961–63, XVIII, doc. [75](https://history.state.gov/historicaldocuments/frus1961-63v18/d75), n. 2 (Komer, Oct. 9; airgram A-115 from Damascus). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: al-Azm, Johnson.'
    tags: [name:al-azm-khalid-pasha, name:johnson-joseph-e]
  - id: cal.1962-10-05.georgia-ga
    when: Oct. 5
    date: '1962-10-05'
    thread: georgia
    also: [legislatures]
    c: 'The Senate passes the reapportionment, 43–4: many seats to the cities. Nominations already made void: special primaries Oct. 16, runoffs Oct. 23. Counties of several districts to elect their senators at large.'
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 5, 1962. See [[cal.1962-09-27.georgia-ga]].'
    tags: [state:ga]
  - id: cal.1962-10-05.opinion
    when: Oct. 5
    date: '1962-10-05'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, Aug. 23–28: Negro children here have the same chance at a good education as white children, say 86 percent of Southern whites and 80 of whites elsewhere. About six Southern Negroes in ten say not.'
    n: '[[w.gallup-poll]], III, 1786.'
  - id: cal.1962-10-05.middle-east
    when: Oct. 5
    date: '1962-10-05'
    thread: middle-east-yemen
    c: 'Faisal, Crown Prince of Saudi Arabia, at lunch with Kennedy. Yemen: the rebels would fall without help from the UAR and the Soviet Union. Faisal: American food for the UAR frees Nasser''s money for subversion. Oct. 17, Saud makes Faisal Prime Minister.'
    n: 'Joint Statement Following Discussions With Crown Prince Faysal of Saudi Arabia, [1962 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=793) (Oct. 5, 1962). FRUS 1961–63, XVIII, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v18/d71), [83](https://history.state.gov/historicaldocuments/frus1961-63v18/d83). To check: [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1962-09-26.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Nasser, Saud ibn Abd al-Aziz Al Saud.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:saud-ibn-abd-al-aziz-al-saud, name:nasser-gamal-abdel, name:kennedy-john-f]
  - id: cal.1962-10-06.governors-hi
    when: Oct. 6
    date: '1962-10-06'
    thread: governors
    also: [elections-1962]
    c: 'Hawaii''s primary, for governor. Republican: Governor Quinn over Kealoha, the lieutenant governor, 44,205 to 33,272, 57.1 percent. Democratic: Burns, once Delegate to Congress, over Greenstein, 71,540 to 7,781, 90.2 percent.'
    n: 'Votes: [Haw. *Result of Votes Cast, Primary Election*, Oct. 6, 1962, grand total](https://archive.org/download/HI-hist/1962_Primary.pdf#page=34). To check: [[w.boylan-john-a-burns]]; [[w.coffman-island-edge-of-america]]. See [[cal.1961-01-06.elections-1960]]. Names: Quinn, Burns, Kealoha.'
    tags: [state:hi, name:quinn-william-f, name:kealoha-james-k, name:burns-john-a]
  - id: cal.1962-10-08.middle-east
    when: Oct. 8
    date: '1962-10-08'
    thread: middle-east
    also: [foreign-aid]
    c: 'Wheat for the UAR: an agreement for sales of farm surpluses for Egyptian pounds under Title I of Public Law 480, [13 U.S.T. 2166](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-13-2/lltreaties-13-2.pdf#page=982). $390 million, $275.8 million of it wheat; the amounts for fiscal 1964 and 1965 set by annual review. Signed after a week''s delay over Yemen.'
    n: 'TIAS 5179; U.N.T.S. Check. FRUS 1961–63, XVIII, doc. [70](https://history.state.gov/historicaldocuments/frus1961-63v18/d70); FRUS 1964–68, XVIII, doc. [127](https://history.state.gov/historicaldocuments/frus1964-68v18/d127). To check: [[w.badeau-middle-east-remembered]]; [[w.burns-economic-aid-and-american]]; [[w.little-new-frontier-on-the]]; [[w.ferris-nassers-gamble]].'
  - id: cal.1962-10-10.program
    when: Oct. 10
    date: '1962-10-10'
    thread: health
    c: Drug Amendments signed, [76 Stat. 780](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg780.pdf). Proof of efficacy; informed consent.
    n: See [[cal.1962-07-15.program]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-10.africa
    when: Oct. 10
    date: '1962-10-10'
    thread: africa
    c: Sékou Touré of Guinea at the White House, after his speech at the UN on falling prices for raw materials. Kennedy cites American support of the UN against Katanga's secession; Touré asks aid in several forms.
    n: 'Remarks of Welcome to President Sekou Toure of Guinea at the Washington National Airport, [1962 Pub. Papers 752](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=812) (Oct. 10, 1962). FRUS 1961–63, XXI, docs. [263](https://history.state.gov/historicaldocuments/frus1961-63v21/d263), [264](https://history.state.gov/historicaldocuments/frus1961-63v21/d264), [265](https://history.state.gov/historicaldocuments/frus1961-63v21/d265). To check: [[w.attwood-twilight-struggle]]; [[w.muehlenbeck-betting-on-the-africans]]. Names: Touré.'
    tags: [name:toure-ahmed-sekou, name:kennedy-john-f]
  - id: cal.1962-10-11.trade
    when: Oct. 11
    date: '1962-10-11'
    thread: trade
    c: Trade Expansion Act signed, [76 Stat. 872](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg872.pdf). Herter named to negotiate, Nov. 15.
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1962-01-25.trade]]. Names: Herter.'
    tags: [name:herter-christian-a, name:kennedy-john-f, bill:trade-1962]
  - id: cal.1962-10-13.congress
    when: Oct. 13
    date: '1962-10-13'
    thread: congress
    c: 'Second session adjourns. Passed: trade, the investment credit, manpower, welfare, public works. Lost: Medicare, school and college aid, Urban Affairs, literacy tests.'
    n: '[Cong. Rec., Senate, Oct. 13, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt17/pdf/GPO-CRECB-1962-pt17-8-1.pdf). CQ Almanac 1962 (K–J Cong. II.L). To check: [[w.sundquist-politics-and-policy]]. See [[cal.1961-11-16.congress]].'
    tags: [appropriations:87-2]
  - id: cal.1962-10-14.missile-crisis
    when: Oct. 14
    date: '1962-10-14'
    thread: missile-crisis
    c: Heyser's U-2 photographs MRBM sites near San Cristóbal.
    n: '[FRUS 1961–63, XI, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v11/d16). See [[cal.1962-05-24.missile-crisis]]. Names: Heyser.'
    tags: [name:heyser-richard-s]
  - id: cal.1962-10-14.opinion
    when: Oct. 14
    date: '1962-10-14'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Sept. 20–25: on Cuba, bomb or invade, 10 percent; an embargo, 13; something short of war, 26; hands off, 22. American forces into Cuba to overthrow Castro, 24 agree, 63 disagree.'
    n: '[[w.gallup-poll]], III, 1786. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1962-10-15.africa
    when: Oct. 15
    date: '1962-10-15'
    thread: africa
    c: Ben Bella, Prime Minister of Algeria since Sept. 26, at the White House. Kennedy on the impression in Algeria that the United States favors nuclear tests, colonialism and imperialism. Algeria's economic needs discussed; no figures, no commitments. Then to Havana.
    n: 'Remarks of Welcome to Prime Minister Ben Bella of Algeria on the South Lawn at the White House, [1962 Pub. Papers 784](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=844); Joint Statement Following Discussions With Prime Minister Ben Bella, [1962 Pub. Papers 786](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=846) (Oct. 15, 1962). FRUS 1961–63, XXI, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v21/d71), [72](https://history.state.gov/historicaldocuments/frus1961-63v21/d72), [73](https://history.state.gov/historicaldocuments/frus1961-63v21/d73), [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77) (doc. 77: NSAM 211, Dec. 14, on aid to Algeria). To check: [[w.byrne-mecca-of-revolution]]; [[w.rakove-kennedy-johnson-and-the]]; [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1962-07-03.africa]]. Names: Ben Bella.'
    tags: [name:ben-bella-ahmed, name:kennedy-john-f]
  - id: cal.1962-10-15.georgia-ga
    when: Oct. 15
    date: '1962-10-15'
    thread: georgia
    also: [legislatures]
    c: A Fulton Superior Court judge holds the election of senators at large void in Fulton.
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Valdosta Daily Times*, Oct. 16, 1962. Check: the case. See [[cal.1962-09-27.georgia-ga]].'
    tags: [state:ga, city:atlanta]
  - id: cal.1962-10-16.missile-crisis
    when: Oct. 16
    date: '1962-10-16'
    thread: missile-crisis
    also: [robert-kennedy]
    c: Bundy tells Kennedy at breakfast. First ExComm meeting, 11:50 a.m., taped. Air strike, invasion, blockade.
    n: 'FRUS 1961–63, XI, docs. [18](https://history.state.gov/historicaldocuments/frus1961-63v11/d18), [21](https://history.state.gov/historicaldocuments/frus1961-63v11/d21). [[w.presidential-recordings]], vols; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 204–206; [[w.poole-joint-chiefs-of-staff]], 166. 2–3. [[w.schlesinger-robert-kennedy-and-his]], 506–13; [[w.caro-passage-of-power]], 207–22 (Johnson in the ExComm). [[w.schlesinger-thousand-days-1965]], 794–808. To check: [[w.kennedy-tapes]]; [[w.stern-averting-the-final-failure]]. See [[cal.1962-05-24.missile-crisis]]. Names: Bundy, McNamara, Taylor.'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1962-10-16.economy
    when: Oct. 16
    date: '1962-10-16'
    thread: economy
    c: 'Revenue Act of 1962 signed, [76 Stat. 960](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg960.pdf). Investment credit, 7 percent. Withholding on dividends and interest dropped. The Treasury''s full-year estimate of the revenue lost: $0.2 billion, 0.03 percent of GDP.'
    n: '[[w.tempalski-revenue-effects-of-major]], Table 1, p. 15; [[w.zelizer-taxing-america]], 186–90 (the credit, 7 percent; withholding dropped). See [[cal.1961-01-05.economy]]. Names: Mills, Dillon.'
    tags: [name:kennedy-john-f, name:mills-wilbur-d, name:dillon-c-douglas, bill:revenue-1962]
  - id: cal.1962-10-16.africa
    when: Oct. 16–17
    date: '1962-10-16'
    thread: africa
    also: [cuba]
    c: Ben Bella in Havana, from New York, with Castro. Their joint communiqué calls for the evacuation of the base at Guantánamo (Check).
    n: 'FRUS 1961–63, XXI, doc. [72](https://history.state.gov/historicaldocuments/frus1961-63v21/d72) (its note dates the visit Oct. 18; Check). See [[cal.1962-10-15.africa]]. Names: Ben Bella, Castro.'
    tags: [name:ben-bella-ahmed, name:castro-fidel]
  - id: cal.1962-10-16.africa-2
    when: Oct. 16–17
    date: '1962-10-16'
    thread: africa
    c: Hasan al-Rida, Crown Prince of Libya and heir to King Idris, at the White House; in the United States to Oct. 24.
    n: 'Toasts of the President and Crown Prince Hasan of Libya, [1962 Pub. Papers 786](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=846) (Oct. 16, 1962); Joint Statement Following Discussions With the Crown Prince of Libya, [1962 Pub. Papers 789](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=849) (Oct. 17, 1962). FRUS 1961–63, XXI, docs. [94](https://history.state.gov/historicaldocuments/frus1961-63v21/d94), [97](https://history.state.gov/historicaldocuments/frus1961-63v21/d97). To check: [[w.st-john-libya-and-the-united]]; [[w.vandewalle-history-of-modern-libya]]. Names: Hasan al-Rida al-Sanusi, Idris I.'
    tags: [name:hasan-al-rida-al-sanusi, name:idris-i, name:kennedy-john-f]
  - id: cal.1962-10-17.opinion
    when: Oct. 17
    date: '1962-10-17'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Sept. 20–25: troops sent to overthrow Castro likely to bring all-out war with Russia, 51 percent; not, 37. Even of those who think war unlikely, 57 oppose an invasion.'
    n: '[[w.gallup-poll]], III, 1787. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1962-10-18.missile-crisis
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 'Gromyko at the White House: Soviet aid to Cuba defensive. Kennedy does not show the photographs.'
    n: '[FRUS vol. 11](https://history.state.gov/historicaldocuments/frus1961-63v11). See [[cal.1962-05-24.missile-crisis]]. Names: Gromyko.'
    tags: [name:gromyko-andrei, name:kennedy-john-f]
  - id: cal.1962-10-19.missile-crisis
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis
    c: 'A memorandum, unsigned and unaddressed, in the Office of Legal Counsel''s daybooks: the President may blockade Cuba under the laws of the United States without further action by Congress, ships alone or aircraft too. Lawful under international law, but open to question in the OAS and the UN; Cuba and the Soviet bloc could take it as an act of war.'
    n: '[1 Op. O.L.C. Supp. 486](https://www.justice.gov/olc/file/477221/dl#page=502) (Oct. 19, 1962); the editor''s note: perhaps Meeker''s, with Katzenbach. [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (Meeker''s record of the meeting at State, 11 a.m.: Katzenbach, the President''s authority "ample"; a declaration of war unnecessary). Made public: 1 Op. O.L.C. Supp. (2013). See [[cal.1962-10-16.missile-crisis]].'
  - id: cal.1962-10-20.missile-crisis
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: Kennedy leaves Chicago with a "cold." Quarantine chosen over air strike.
    n: '[FRUS 1961–63, XI, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v11/d34). See [[cal.1962-10-16.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-20.india-and-china
    when: Oct. 20
    date: '1962-10-20'
    thread: south-asia
    also: [china]
    c: China attacks in Ladakh and the North-East Frontier Agency.
    n: '[FRUS 1961–63, XIX, doc. 179](https://history.state.gov/historicaldocuments/frus1961-63v19/d179). See [[cal.1961-12-18.india-and-china]].'
  - id: cal.1962-10-22.missile-crisis-2
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: 'Kennedy to Khrushchev, with the text of the address: the threat in Cuba to be removed; the action taken the minimum necessary, not to be misjudged.'
    n: 'FRUS 1961–63, VI, doc. [60](https://history.state.gov/historicaldocuments/frus1961-63v06/d60). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 209–210; [[w.poole-joint-chiefs-of-staff]], 173. See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 635–636. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-22.missile-crisis
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: Address, 7 p.m. Quarantine. A missile from Cuba to bring full retaliation on the Soviet Union.
    n: Radio and Television Report to the American People on the Soviet Arms Buildup in Cuba, [1962 Pub. Papers 806](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=866) (Oct. 22, 1962). Recording (K–J Adm. II.I). See [[cal.1962-10-16.missile-crisis]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-22.robert-kennedy
    when: Oct. 22
    date: '1962-10-22'
    thread: robert-kennedy
    also: [crime-and-hijacking]
    c: Nashville. Hoffa's trial opens under the Taft-Hartley Act, the Test Fleet case. Edward Partin, a Teamsters official from Baton Rouge, in Hoffa's hotel suite and company throughout, reports to Walter Sheridan, Robert Kennedy's investigator, on attempts to reach the jurors.
    n: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf), 294–96 (1966). [[w.schlesinger-robert-kennedy-and-his]], 279–80. To check: [[w.sheridan-fall-and-rise-of]]; [[w.navasky-kennedy-justice]]; [[w.goldfarb-perfect-villains-imperfect-heroes]]; [[w.sloane-hoffa]]; [[w.kennedy-enemy-within]]. See [[cal.1961-09-13.crime-and-hijacking]]. Made public: Partin''s part, at the Chattanooga trial, 1964. Names: Hoffa, Partin, Sheridan, Robert Kennedy.'
    tags: [name:kennedy-robert-f, name:hoffa-james-r, name:partin-edward-grady, name:sheridan-walter]
  - id: cal.1962-10-22.missile-crisis-3
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: 'The Oval Office, 11 a.m. Kennedy with Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger and Hilsman on the diplomacy of the crisis; Stevenson''s speech to the Security Council gone over, a threat of an American strike cut. Schlesinger sent to help Stevenson. Robert Kennedy: "We will have to make a deal at the end, but we must stand absolutely firm now."'
    n: '[Meeting on Diplomatic Plans for the Crisis, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-diplomatic-plans-crisis), Tape 32 (Miller Center). [[w.schlesinger-thousand-days-1965]], 811. See [[cal.1962-10-16.missile-crisis]]. Names: John F. Kennedy, Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger, Hilsman, Stevenson.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:kennedy-robert-f, name:ball-george-w, name:bundy-mcgeorge, name:johnson-u-alexis, name:schlesinger-arthur-m-jr, name:hilsman-roger, name:stevenson-adlai-e]
  - id: cal.1962-10-22.missile-crisis-4
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: 'Kennedy shows the congressional leaders the U-2 photographs and his course. Russell: the quarantine too slow and too risky, invade; Fulbright with him.'
    n: '[Meeting with the Congressional Leadership on the Cuban Missile Crisis, 5:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-congressional-leadership-cuban-missile-crisis), Tapes 33 and 33A (Miller Center). [[w.schlesinger-thousand-days-1965]], 812. See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Russell, Fulbright. Check: the hour; Schlesinger gives five o''clock.'
    tags: [name:kennedy-john-f, name:russell-richard-b, name:fulbright-j-william]
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    also: [robert-kennedy]
    c: OAS endorses the quarantine, none opposed. Proclamation signed; in force 10 a.m., Oct. 24. Robert Kennedy sees Dobrynin.
    n: '[Kennedy and Robert Kennedy, 7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/discussion-between-president-kennedy-and-robert-kennedy), Tapes 36.1 and 36.2 (Miller Center). [Proclamation No. 3504](https://www.presidency.ucsb.edu/documents/proclamation-3504-interdiction-the-delivery-offensive-weapons-cuba), [27 Fed. Reg. 10,401](https://www.govinfo.gov/app/details/FR-1962-10-25) (1962). Opinion: Katzenbach to Robert Kennedy, Oct. 23, on the draft proclamation: Russian ships not bound for Cuba searchable within a reasonable zone, or where a change of course is a ruse, [FRUS 1961–63, X–XII, microfiche supp., doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d374). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy, Dobrynin.'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:kennedy-john-f]
  - id: cal.1962-10-23.missile-crisis-2
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'Khrushchev''s reply: the quarantine a gross violation of the UN Charter and of freedom of navigation; the arms in Cuba defensive. Not to be published for the time being.'
    n: 'FRUS 1961–63, VI, doc. [61](https://history.state.gov/historicaldocuments/frus1961-63v06/d61). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 636–637. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-10-23.missile-crisis-3
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'Kennedy''s reply: the secret shipment of offensive weapons began it; prudence on both sides. Soviet ships to observe the quarantine, in force at 1400 Greenwich, Oct. 24.'
    n: 'FRUS 1961–63, VI, doc. [62](https://history.state.gov/historicaldocuments/frus1961-63v06/d62). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 636. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-23.missile-crisis-4
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'Stevenson to the Security Council from 4 p.m., his text finished as he speaks; the OAS resolution handed to him in the course of it. Kennedy wires him: "It has given our cause a great start."'
    n: '[[w.department-of-state-bulletin]], [Nov. 12, 1962, 723](https://archive.org/details/departmentofstat4762unit/page/723/mode/1up) (the statement of Oct. 23). [[w.schlesinger-thousand-days-1965]], 813–14. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson, Kennedy.'
    tags: [name:stevenson-adlai-e, name:kennedy-john-f]
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Soviet ships stop or turn back. Rusk: "the other fellow just blinked."'
    n: '[FRUS 1961–63, XI, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v11/d55). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 210–212; [[w.poole-joint-chiefs-of-staff]], 177. To check: [[w.dobbs-one-minute-to-midnight]]. See [[cal.1962-10-16.missile-crisis]]. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1962-10-24.missile-crisis-2
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Khrushchev: the quarantine an ultimatum; the OAS without authority. Soviet captains not to be instructed to obey the American navy.'
    n: 'FRUS 1961–63, VI, doc. [63](https://history.state.gov/historicaldocuments/frus1961-63v06/d63). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 637–639. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-10-24.immigration
    when: Oct. 24
    date: '1962-10-24'
    thread: immigration
    c: 'Act of Oct. 24, [76 Stat. 1247](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1247.pdf): nonquota visas for the waiting lists. Relatives of citizens in the fourth preference, registered before Mar. 31, 1954, on petitions filed before 1962; skilled specialists in the first preference, on petitions filed before Apr. 1, 1962, where half their country''s quota is oversubscribed.'
    n: 'Statute (K–J Cong. II.J.2). S. 3361, 87th Cong. To check: [[w.reimers-still-the-golden-door]]. See [[cal.1961-09-26.immigration]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-25.missile-crisis
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: Stevenson and Zorin at the Security Council. "Until hell freezes over." The photographs shown.
    n: '[U.N. Security Council, *Official Records*, 17th year, 1025th meeting, Oct. 25, 1962](https://documents.un.org/doc/undoc/gen/nl6/200/05/pdf/nl620005.pdf). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 213. To check: [[w.martin-adlai-stevenson-and-the]]. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson, Zorin.'
    tags: [name:stevenson-adlai-e, name:zorin-valerian]
  - id: cal.1962-10-25.missile-crisis-2
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: 'Kennedy''s reply, handed to the Soviet Embassy at 1:45 a.m.: the assurances that no offensive weapons were going to Cuba false; the first challenge not his.'
    n: 'FRUS 1961–63, VI, doc. [64](https://history.state.gov/historicaldocuments/frus1961-63v06/d64). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 639. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-26.missile-crisis
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: 'Khrushchev''s first letter: the missiles out for a pledge against invasion.'
    n: 'FRUS 1961–63, VI, doc. [65](https://history.state.gov/historicaldocuments/frus1961-63v06/d65). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 213; [[w.poole-joint-chiefs-of-staff]], 178. To check: [[w.fursenko-one-hell-of-a]]. See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 640–645. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-10-26.missile-crisis-2
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: Feklisov puts like terms to Scali of ABC.
    n: 'FRUS 1961–63, XI, doc. [80](https://history.state.gov/historicaldocuments/frus1961-63v11/d80). To check: [[w.fursenko-one-hell-of-a]]. See [[cal.1962-10-16.missile-crisis]]. Names: Feklisov, Scali.'
    tags: [name:scali-john-a, name:feklisov-aleksandr]
  - id: cal.1962-10-26.king
    when: Oct. 26
    date: '1962-10-26'
    thread: king
    c: 'Several conservative papers run nearly the same front-page story, planted by the FBI: O''Dell, of SCLC''s New York office, a "concealed member" of the Communist Party''s national committee. Days later King: O''Dell has resigned, "pending further inquiry"; he stays, off the payroll a while.'
    n: '[[w.garrow-bearing-the-cross]], 222–23. Check: the day; Garrow cites papers of Oct. 25 and 26 (667 n.51). Names: O''Dell, King.'
    tags: [name:odell-jack-h, name:king-martin-luther-jr]
  - id: cal.1962-10-27.missile-crisis-2
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: 'Khrushchev''s second letter, broadcast over Moscow radio: the means the United States calls offensive out of Cuba, the American means out of Turkey; the Security Council to inspect.'
    n: 'FRUS 1961–63, VI, doc. [66](https://history.state.gov/historicaldocuments/frus1961-63v06/d66). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-10-27.missile-crisis
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'Black Saturday. Anderson''s U-2 shot down over Cuba; another strays over Siberia. That night Robert Kennedy to Dobrynin: the Jupiters to go, privately.'
    n: 'FRUS 1961–63, XI, docs. [94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94), [96](https://history.state.gov/historicaldocuments/frus1961-63v11/d96). [[w.schlesinger-robert-kennedy-and-his]], 520–23; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 213–214, 222; [[w.poole-joint-chiefs-of-staff]], 180. To check: [[w.dobbs-one-minute-to-midnight]]; [[w.stern-averting-the-final-failure]]; [[w.sherwin-gambling-with-armageddon]]; [[w.dobrynin-in-confidence]]. See [[cal.1962-10-16.missile-crisis]]. Names: Dobrynin, Anderson, Robert F. Kennedy.'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:anderson-rudolf-jr]
  - id: cal.1962-10-27.missile-crisis-3
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: 'Kennedy''s reply to the letter of Oct. 26, released to the press: the weapons out of Cuba under UN observation, no more brought in; then the quarantine lifted and assurances against an invasion. Work on the bases to stop first.'
    n: 'Message to Chairman Khrushchev Calling for Removal of Soviet Missiles From Cuba, [1962 Pub. Papers 813](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=873) (Oct. 27, 1962). FRUS 1961–63, VI, doc. [67](https://history.state.gov/historicaldocuments/frus1961-63v06/d67). See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-27.missile-crisis-4
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: 'Evening, the ExComm, the President and his brother out of the room. Johnson against the Turkish trade: "We''re backing down"; the Russians "shot down one plane, and they gave up Turkey"; the U-2''s loss, not the letters, to be answered. Kennedy back about 7:20; Johnson left out of the smaller meeting in the Oval Office after.'
    n: '[Executive Committee Meeting, 4:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-10), Tape 41 (Miller Center); [continued](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-11), Tape 41A (Miller Center). [FRUS 1961–63, XI, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94). [[w.caro-passage-of-power]], 216–21. See [[cal.1962-10-16.missile-crisis]]. Names: Johnson, Robert Kennedy, Bundy, Dillon, Thompson, Kennedy.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:bundy-mcgeorge, name:dillon-c-douglas, name:thompson-llewellyn-e, name:kennedy-john-f]
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Radio Moscow: the missiles to be dismantled and returned. Castro refuses inspection.'
    n: '[FRUS 1961–63, XI, doc. 102](https://history.state.gov/historicaldocuments/frus1961-63v11/d102). Statement by the President Following the Soviet Decision To Withdraw Missiles From Cuba, [1962 Pub. Papers 815](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=875) (Oct. 28, 1962). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Castro.'
    tags: [name:castro-fidel, name:khrushchev-nikita-s]
  - id: cal.1962-10-28.missile-crisis-2
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Kennedy''s reply to the broadcast, released at 4:35 p.m.: the letters of Oct. 27 and 28 firm undertakings of both governments, to be carried out promptly.'
    n: 'Message in Reply to a Broadcast by Chairman Khrushchev on the Cuban Crisis, [1962 Pub. Papers 814](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=874) (Oct. 28, 1962). FRUS 1961–63, VI, doc. [69](https://history.state.gov/historicaldocuments/frus1961-63v06/d69). See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-28.missile-crisis-3
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Khrushchev, a second letter of the day, private, through Dobrynin to Robert Kennedy on Oct. 29: the bases in Turkey, as Robert Kennedy proposed, to be discussed in confidence.'
    n: 'FRUS 1961–63, VI, doc. [70](https://history.state.gov/historicaldocuments/frus1961-63v06/d70). See [[cal.1962-10-16.missile-crisis]]. Made public: *Problems of Communism*, special ed., Spring 1992, 60–62. Names: Khrushchev, Dobrynin, Robert F. Kennedy.'
    tags: [name:khrushchev-nikita-s, name:dobrynin-anatoly, name:kennedy-robert-f]
  - id: cal.1962-10-29.japan-and-korea
    when: Oct. 29
    date: '1962-10-29'
    thread: korea
    also: [japan]
    c: 'Kim Chong-p''il, director of the Korean CIA, with Rusk and Harriman, the missile crisis on. Ōhira''s offer in Tokyo, as Kim reports it: $300 million over twelve years, not to be called reparations; Kim asks $600 million with loans. Harriman: the bars on candidates in the 1963 elections. Nov. 12, in Tokyo, Kim and Ōhira settle the figures: $300 million in grants, $200 million in government loans. Check.'
    n: 'FRUS 1961–63, XXII, docs. [280](https://history.state.gov/historicaldocuments/frus1961-63v22/d280), [281](https://history.state.gov/historicaldocuments/frus1961-63v22/d281), [282](https://history.state.gov/historicaldocuments/frus1961-63v22/d282), [283](https://history.state.gov/historicaldocuments/frus1961-63v22/d283). To check: [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]. See [[cal.1962-04-24.japan-and-korea]]. Names: Kim Chong-p''il, Ōhira, Rusk, Harriman.'
    tags: [name:kim-chong-pil, name:ohira-masayoshi, name:rusk-dean, name:harriman-w-averell]
  - id: cal.1962-10-30.missile-crisis
    when: Oct. 30
    date: '1962-10-30'
    thread: missile-crisis
    c: 'Khrushchev, in confidence: the quarantine to be lifted now, without waiting for the inspection of ships; Guantánamo to be given up.'
    n: 'FRUS 1961–63, VI, doc. [71](https://history.state.gov/historicaldocuments/frus1961-63v06/d71). See [[cal.1962-10-16.missile-crisis]]. Made public: *Problems of Communism*, special ed., Spring 1992. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
