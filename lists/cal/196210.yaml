  - id: cal.1962-10-02.missile-crisis
    when: Oct. 2
    date: '1962-10-02'
    thread: missile-crisis
    also: [cuba, defense]
    c: 'McNamara to Taylor, after the meeting with the Chiefs of Oct. 1: six contingencies for military action against Cuba, among them Soviet offensive weapons there and an attack on Guantanamo; plans for each; the harder objective, the Castro regime''s removal, to be planned for. By Fursenko and Naftali: "The President wants no military action within the next three months, but he can''t be sure as he does not control events."'
    n: '[FRUS 1961–63, XI, doc. 4](https://history.state.gov/historicaldocuments/frus1961-63v11/d4) (the memorandum). [[w.fursenko-one-hell-of-a]], 217 (the words quoted). To check: McNamara to Taylor, Oct. 2, 1962, Cuban Missile Crisis collection, National Security Archive; Young, *When the Russians Blinked* (1990), 66–67, 70–71 (cited by [[w.fursenko-one-hell-of-a]], 217 n.2). Check: the words quoted; FRUS''s text does not print them. Names: McNamara, Taylor, Castro.'
    src:
