  - id: cal.1962-10-04.elections-1962
    when: Oct. 4
    date: '1962-10-04'
    thread: elections-1962
    also: [mississippi-ole-miss, opinion]
    c: 'Harris, the President''s pollster, by memorandum: "I have never seen the temper and mood change so drastically as this election outlook." In the Northern industrial States sentiment behind him "2-1/2 to 3-1 on Mississippi"; in New York, the Jewish vote Democratic from 61 to 73 percent in two days, the Negro vote from 65 to 84.'
    n: '[[w.reeves-president-kennedy]], 364. To check: Harris to Kennedy, Oct. 4, 1962, President''s Office Files, box 105, Kennedy Library (cited by [[w.reeves-president-kennedy]], 364). See [[cal.1962-09-30.mississippi-ole-miss]]. Names: Harris, Kennedy.'
