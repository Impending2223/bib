  - id: cal.1962-10-24.south-asia
    when: Oct. 24
    date: '1962-10-24'
    thread: south-asia
    also: [china]
    c: 'The government''s statement, three proposals: the boundary to be settled by talks; meanwhile each side to respect the line of actual control along the whole border and pull its forces 20 kilometers back from it. India agreeing, China to withdraw its frontier forces in the east to north of that line; in the middle and west neither side to cross it; officials to negotiate the disengagement. The two Prime Ministers to meet again: Nehru welcome in Peking, or China''s Premier to go to Delhi.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 24, 1962. [[w.jian-zhou-enlai]], 481 (drafted under Zhou''s guidance; Chen''s three: a peaceful settlement, an end to the conflict and a withdrawal, renewed talks; "the Line of Actual Control existing between them on November 7, 1959," each side twenty kilometers back; not the east, middle and west, or the Prime Ministers'' meeting); [[w.mao-zedong-zhuan]], V, ch. 71, and n.2 (the boundary to be settled by talks, not "three proposals"; the line of actual control of Nov. 7, 1959, along the whole border; the two Prime Ministers to meet again, not where). To check: the statement''s published text; *Renmin ribao*, Oct. 25, 1962 (cited by [[w.jian-zhou-enlai]], 763 n.81). See [[cal.1962-10-23.south-asia-2]]. Names: Nehru.'
    src:
