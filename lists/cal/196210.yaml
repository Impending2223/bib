  - id: cal.1962-10-19.missile-crisis-8
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis
    c: 'The White House, Friday morning, before the flight to Cleveland and Chicago. Kennedy to Robert Kennedy: "If you have any trouble, call me and I''ll call off the trip and come back and talk to them." O''Donnell: what if he cannot get a consensus? Kennedy: "I''ll make my own decision anyway. I''m the one who has the responsibility, so we''ll do what I want to do." He tells of Lincoln''s Cabinet: all aye, Lincoln no, "the no''s had it." To O''Donnell: "You''ll probably have to cut the trip short. I''ll make that speech in Chicago for Sid Yates and Dick Daley that you''re worrying about, but I don''t know about Wisconsin and the Seattle Fair."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 362 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, O''Donnell, Yates, Daley.'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:odonnell-kenneth-p, name:yates-sidney-r, name:daley-richard-j, polity:cuba]
  - id: cal.1962-10-19.missile-crisis-warnings
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis-warnings
    c: 'Chicago, the Sheraton-Blackstone, evening. Salinger tells Kennedy that Robert Allen and Paul Scott are to run a column on an invasion of Cuba and that Carleton Kent of the Chicago Sun-Times asks about a parachute unit alerted for a jump on Cuba. Kennedy: "Call Kent and tell him that report is all wrong. We have no plan to invade Cuba." He has O''Donnell call McNamara to ask Allen and Scott not to print the column; O''Donnell does.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 363 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 250–51 (Phillips of State warns of the Allen and Scott story; Kent of the *Sun-Times* asks about the 18th Parachute Corps standing by for a jump on Cuba; Salinger goes to the President in his suite, O''Donnell with him; Kennedy has O''Donnell call McNamara "to straighten out Allen and Scott"; not that O''Donnell does). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Salinger, Kennedy, O''Donnell, McNamara.'
    src:
      c: 5863ea29
      rows:
        - 'w.odonnell-johnny-we-hardly-knew 363: ?'
        - 'w.salinger-with-kennedy 250–51: A, B'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:odonnell-kenneth-p, name:mcnamara-robert-s, polity:cuba, city:chicago]
    variants:
