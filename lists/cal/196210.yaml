  - id: cal.1962-10-21.china
    when: Oct. 21
    date: '1962-10-21'
    thread: china
    c: 7 p.m. Mao Zedong talks with Zhou Enlai.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1962 (the entry for Oct. 20: "二十一日晚七时，同周恩来谈话"). Made public: Check (2013 at the latest). See [[cal.1962-10-20.china]]. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
  - id: cal.1962-10-21.missile-crisis-diplomacy
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: 'About 10 p.m., London. A message from Kennedy to Macmillan: a short account of the serious situation developing between the United States and the Soviet Union over Cuba.'
    n: '[[w.macmillan-diaries]], 508. See [[cal.1962-10-21.missile-crisis-6]]. Names: Kennedy, Macmillan.'
    tags: [name:kennedy-john-f, name:macmillan-harold, polity:uk, polity:us, polity:ussr, polity:cuba]
  - id: cal.1962-10-21.china-2
    when: Oct. 21
    date: '1962-10-21'
    thread: china
    also: [south-asia]
    c: 'Zhou Enlai, at a State Council meeting: "We are in favor of settling international disputes through negotiation. But Nehru refused to negotiate, called for the war, and launched the attack. ... We cannot make endless concessions, so we fight back. If Nehru remains stubborn and refuses to seek compromise with us, we have no other choice but teach him a bitter lesson."'
    n: '[[w.jian-zhou-enlai]], 481 (Chen''s translation). Made public: Check (1997 at the latest). To check: [[w.zhou-enlai-nianpu-1949]], II, 504 (cited by [[w.jian-zhou-enlai]], 763 n.80). See [[cal.1962-10-20.china-2]]. Names: Zhou Enlai, Nehru. Check: one State Council meeting or two (Chen, 481, 483).'
    tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:india]
  - id: cal.1962-10-21.missile-crisis-9
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: '9 a.m., the Situation Room. Bundy tells Salinger that the country is on the brink of nuclear war: offensive Soviet missiles in Cuba, not yet operational; a blockade the probable course; Kennedy to decide that day and announce it on television the next. He describes the aerial photographs and gives a chronology. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 253–54. Names: Bundy, Salinger, Kennedy.'
    tags: [name:salinger-pierre, name:bundy-mcgeorge, name:kennedy-john-f]
  - id: cal.1962-10-21.missile-crisis-10
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'Shortly before noon, Salinger''s office. Salinger with Colonel Justice Chambers of the Office of Emergency Planning sets the emergency information plan going: a standby alert of the nationwide communications system, the instructions for the pool of correspondents who would go with the President, and plans to call part of the fifteen-member Censorship Advisory Board to Washington. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 257. Names: Salinger, Chambers.'
    tags: [name:salinger-pierre, name:chambers-justice-m]
  - id: cal.1962-10-21.missile-crisis-12
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'Salinger to Kennedy: the press asks why he has not gone to Mass. Kennedy: "I''m going." Salinger is to attend the ExComm that day and all strategy conferences for the duration: "I''ll expect you to know what''s going on every minute." By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 258. Names: Salinger, Kennedy.'
    tags: [name:salinger-pierre, name:kennedy-john-f]
  - id: cal.1962-10-21.missile-crisis-13
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'After the meeting, Kennedy to Salinger: ask the networks for half an hour at 7 p.m. the next night, "but hold off as long as you can"; arrange briefings at the White House, State and the Pentagon right after the speech; with O''Brien, bring the congressional leaders back for 5 p.m. the next day. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 259. Check: the hour. See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Salinger, O''Brien.'
    tags: [name:kennedy-john-f, name:salinger-pierre, name:obrien-lawrence-f]
  - id: cal.1962-10-21.missile-crisis-11
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: Afternoon, Salinger's house, Falls Church, Va. Salinger, Sylvester and Manning agree that Sylvester handles the military announcements and Manning the diplomatic ones, nothing from either without White House approval. A three-way telephone line bypassing the switchboards is put in that afternoon. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 260 (they then go over the cables in Manning''s office, where Don May of UPI finds them together). Names: Salinger, Sylvester, Manning.'
    tags: [name:salinger-pierre, name:sylvester-arthur, name:manning-robert-j, city:falls-church, state:va]
  - id: cal.1962-10-22.missile-crisis-2
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis-diplomacy
    c: 'Kennedy to Khrushchev, with the text of the address: the threat in Cuba to be removed; the action taken the minimum necessary, not to be misjudged.'
    n: 'FRUS 1961–63, VI, doc. [60](https://history.state.gov/historicaldocuments/frus1961-63v06/d60); XI, doc. [44](https://history.state.gov/historicaldocuments/frus1961-63v11/d44) (the same letter; cited by [[w.poole-joint-chiefs-of-staff]], 175 n.61). The address it enclosed, Radio and Television Report to the American People on the Soviet Arms Buildup in Cuba, [1962 Pub. Papers 806](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=866) (Oct. 22, 1962) ("to secure their withdrawal or elimination from the Western Hemisphere"; cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 210 n.60). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 209–10 (the address, not the letter); [[w.poole-joint-chiefs-of-staff]], 175 (the letter given Dobrynin with the address). See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 635–636. Names: Kennedy, Khrushchev.'
