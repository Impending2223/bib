  - id: cal.1962-10-17.berlin-and-vienna
    when: Oct. 17
    date: '1962-10-17'
    thread: berlin-and-vienna
    c: 'The White House, 10 a.m. Schröder with Kennedy, Bundy, Dowling and Salinger among those present: the Soviets may not mean to force the crisis by late November; a pass and visa requirement for civilian traffic would put land access in the Soviet zone''s hands, and must meet a hard reaction. Kennedy: civil and military access interdependent, but military access can go by air, the city''s supply cannot.'
    n: '*Gespräch des Bundesministers Schröder mit Präsident Kennedy in Washington*. [[w.akten-zur-auswartigen-politik]], III, 1717–19 (Dok. 399). Names: Schröder, Kennedy, McGeorge Bundy, Dowling, Salinger.'
