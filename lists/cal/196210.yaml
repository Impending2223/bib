  - id: cal.1962-10-27.missile-crisis-15
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    also: [defense]
    c: 'The forces poised for the invasion of Cuba: two carriers with nine escorts and a task force of 12 destroyers and cruisers; three Marine battalions reinforcing Guantánamo, a Marine expeditionary brigade on its way from California; some 850 Tactical Air Command aircraft in the Southeast; four Army divisions assigned to CINCLANT. SAC: 52 B-52s airborne with 196 nuclear weapons, 611 bombers on 15-minute alert.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 213. To check: Anatoli I. Gribkov and William Y. Smith, Operation ANADYR (1994), 141–42, Gribkov and Smith, *Operation ANADYR*, 141–42 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 213 n.78).'
    src:
