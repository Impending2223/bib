  - id: cal.1962-10-23.missile-crisis-5
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    also: [robert-kennedy, soviet-union]
    c: 'Evening. Robert Kennedy, at the President''s suggestion, with Dobrynin on the third floor of the Soviet Embassy: the Russians'' duplicity; the President''s far less belligerent course than Keating''s and Capehart''s, on Soviet assurances; the troops withdrawn from Thailand at Khrushchev''s request. The action "hypocritical, misleading and false." Dobrynin: so far as he knows, no missiles in Cuba.'
    n: 'Robert Kennedy to the President, Oct. 24, [FRUS 1961–63, XI, doc. 53](https://history.state.gov/historicaldocuments/frus1961-63v11/d53). [[w.schlesinger-robert-kennedy-and-his]], 514; [[w.dobrynin-in-confidence]], 84–85 ("staked his political career" on the Soviet assurances; the shipmasters'' instructions; "But that would be an act of war"; by Dobrynin''s account); [[w.sorensen-kennedy]], 709 (sent to learn whether the ship captains had instructions; he learned nothing); [[w.thomas-robert-kennedy]], 224 (about 9:30 p.m., the third floor of the Soviet Embassy; Kennedy "in a state of agitation"; "I do not know how all this will end, but we intend to stop your ships"); [[w.sorensen-kennedy]], 709 (Robert Kennedy sent to learn whether the Soviet captains had instructions; he learned nothing). [[w.fursenko-one-hell-of-a]], 252–53 (by Dobrynin''s report of Oct. 24). To check: Dobrynin to Moscow, "On the Meeting with R. Kennedy, October 23," Oct. 24, 1962, AVPRF (cited by [[w.fursenko-one-hell-of-a]], 252 n.31). See [[cal.1962-10-16.missile-crisis]]. Names: Robert Kennedy, Kennedy, Dobrynin, Keating, Capehart, Khrushchev.'
