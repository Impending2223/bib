    c: 'The Executive Committee, 11:10 a.m., the tenth meeting, Khrushchev''s broadcast read by all beforehand. Bundy: "today was the doves'' day." No air reconnaissance today; the tanker *Graznyy* lying outside the zone, no bloc ship to halt; the UN to take on the surveillance if it will. No gloating, no claim of victory.'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 103](https://history.state.gov/historicaldocuments/frus1961-63v11/d103) (Bromley Smith''s summary record). [[w.sorensen-kennedy]], 716–17 (the meeting postponed from 10 to 11 a.m.; the Sunday overflights called off, no ship halted; precautions against the exiles'' raids; "no boasting, no gloating"); [[w.thomas-robert-kennedy]], 231 (the meeting at 11; Bundy on the doves); [[w.odonnell-johnny-we-hardly-knew]], 387–88 (the ExComm after Kennedy''s return from mass; to the suggestion that he appear on television to announce the victory: "There will be none of that. I want no crowing and not a word of gloating from anybody in this government"; not the hour or the business); [[w.salinger-with-kennedy]], 273 (the last meeting, drafting the reply hailing the "statesmanlike decision"; the President joins in no triumph; to an adviser who calls him "ten feet tall": "this will wear off in about a week"; not the hour, Bundy or the business). After the broadcast: FRUS 1961–63, XI, doc. 103 ("had been read by"). See [[cal.1962-10-28.missile-crisis]]. Names: Bundy, McNamara, Rusk, Kennedy.'
