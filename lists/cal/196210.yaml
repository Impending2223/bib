    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'The ExComm, without Acheson, in the afternoon: substantial agreement on a visit-and-search blockade, urged by McNamara and Gilpatric, Taylor and the Chiefs dissenting. Reported to the President that night.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 508. Meeker''s record of Oct. 19, [FRUS 1961–63, XI, doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v11/d31) (the night''s meeting with the President, a tentative blockade by one participant''s recollection). [[w.ball-past-has-another-pattern]], 291–92 (the evening: two groups, Bundy''s for the air strike, Ball''s for the blockade; Dillon won over; then the President). See [[cal.1962-10-16.missile-crisis]]. Names: Acheson, McNamara, Gilpatric, Taylor, Kennedy. Check: Ball (292) has the groups argue in the evening, during Rusk''s dinner for Gromyko.'
