  - id: cal.1962-10-20.missile-crisis-7
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: The White House, Saturday afternoon. Kennedy telephones Jackie at Glen Ora, where she is with Caroline and John for the weekend, and asks her to come back with the children that evening so that he and his family can be together if there is a sudden emergency.
    n: '[[w.odonnell-johnny-we-hardly-knew]], 367 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy.'
    tags: [name:kennedy-john-f, polity:cuba]
  - id: cal.1962-10-20.missile-crisis-8
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: 'The White House, the weekend. Commander Shepard, the naval aide, gives O''Donnell and Powers pink identification cards: they are to be in the group that would go with the President and Mrs. Kennedy to an underground shelter outside the city. Shepard shows O''Donnell the list, Rusk, McNamara and Sorensen among those he remembers. The families of officials are to drive their own cars to a place near Quantico, with eighteen minutes'' warning. Mrs. O''Donnell: "While you''re safe with the President under a rock somewhere, what am I supposed to do with your five children?"'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 367–68 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Powers, Rusk, McNamara, Sorensen. Check: the day (the authors put the cards in their account of Saturday, Oct. 20; Mrs. O''Donnell''s question "later that weekend").'
    tags: [name:odonnell-kenneth-p, name:powers-david-f, name:rusk-dean, name:mcnamara-robert-s, name:sorensen-theodore-c]
  - id: cal.1962-10-20.missile-crisis-warnings
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis-warnings
    c: 'Washington, Jim Rowe''s house, Saturday night. Stevenson, asking O''Donnell what Kennedy thought of his part at the ExComm that afternoon, is told the President admired his courage in bringing up an opposing view. Stevenson: "I know that most of those fellows will probably consider me a coward for the rest of my life for what I said today. But perhaps we need a coward in the room when we are talking about a nuclear war."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 369–70 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Stevenson, O''Donnell, Kennedy, Rowe.'
    tags: [name:stevenson-adlai-e, name:odonnell-kenneth-p, name:kennedy-john-f, name:rowe-james-h-jr]
  - id: cal.1962-10-20.missile-crisis-diplomacy-2
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis-diplomacy
    c: 'Washington, the Magnuson house, O Street, Saturday morning. Stevenson to Schlesinger, out of the chauffeur''s hearing: the secret discussions of the week are on Cuba; aerial reconnaissance has found offensive missile bases; the President learned it Tuesday morning and told him after lunch that day. The argument all week between a diplomatic and a military solution; pressure for an air strike put aside for a quarantine. He must speak early in the week in the Security Council, and asks Schlesinger to begin work on it. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 172–73. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1962-10-20.missile-crisis-diplomacy]]. Names: Stevenson, Schlesinger, Kennedy.'
    tags: [name:stevenson-adlai-e, name:schlesinger-arthur-m-jr, name:kennedy-john-f, city:washington]
  - id: cal.1962-10-20.missile-crisis-9
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: 'Chicago, the Sheraton-Blackstone. At Salinger''s 9:15 briefing Western Union''s man calls him to the President''s suite: Kennedy, in pajamas, with O''Donnell, Powers and Dr. Burkley, says he has a temperature and a cold and writes the bulletin on hotel stationery: "99.2 degrees temperature. Upper respiratory infection. Doctor says he should return to Washington." Salinger reads it to the reporters; no one questions it. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 252. See [[cal.1962-10-20.missile-crisis]]. Names: Kennedy, Salinger, O''Donnell, Powers, Burkley.'
    tags: [name:salinger-pierre, name:kennedy-john-f, name:odonnell-kenneth-p, name:powers-david-f, name:burkley-george-g, city:chicago, state:il]
  - id: cal.1962-10-20.soviet-union
    when: Oct. 20
    date: '1962-10-20'
    thread: soviet-union
    also: [missile-crisis-warnings]
    c: Bolshakov tells the columnists Stewart Alsop and Charles Bartlett that there are no offensive Soviet missiles in Cuba; they quote him by name. By Salinger's account, the cause of his recall to Moscow.
    n: '[[w.salinger-with-kennedy]], 282. Check: the day (the book''s "Saturday, October 20"), and the column. Names: Bolshakov, Stewart Alsop, Bartlett.'
    tags: [name:bolshakov-georgi, name:alsop-stewart, name:bartlett-charles]
  - id: cal.1962-10-20.missile-crisis-10
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    also: [press-and-broadcasting]
    c: '9:38 p.m. Kennedy telephones Salinger at home. Salinger reports the many questions on Cuba and that he is still in the dark. Kennedy: "You''re lucky." By Salinger''s account, from his date book.'
    n: '[[w.salinger-with-kennedy]], 253. Names: Kennedy, Salinger.'
    tags: [name:kennedy-john-f, name:salinger-pierre]
  - id: cal.1962-10-20.missile-crisis-warnings-2
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis-warnings
    also: [press-and-broadcasting]
    c: '10:08 p.m. Folliard of the *Washington Post* tells Salinger that Lippmann has told Friendly, the *Post*''s editor, at a party that we are on the brink of war. Salinger calls Kennedy back. Kennedy: "This town is a sieve." How long can it hold? Salinger: through tonight and maybe tomorrow. Bundy will fill Salinger in in the morning. By Salinger''s account, from his date book.'
    n: '[[w.salinger-with-kennedy]], 253. Names: Folliard, Lippmann, Friendly, Salinger, Kennedy, Bundy.'
    tags: [name:lippmann-walter, name:salinger-pierre, name:kennedy-john-f, name:bundy-mcgeorge]
  - id: cal.1962-10-21.missile-crisis
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis-excomm
    c: 'Evening, The Elms. McCone briefs Johnson, back from his trip toward Hawaii, on the quarantine. By McCone''s memorandum, Johnson against it, "locking the barn after the horse was gone," and against "telegraphing our punch": for "an unannounced strike"; he agrees reluctantly, told of Eisenhower''s support.'
    n: '[[w.caro-passage-of-power]], 212; [[w.sorensen-kennedy]], 697 (the Vice President brought back from his campaign tour in Hawaii). To check: McCone''s memorandum for the file, Oct. 22, 1962 (cited by [[w.caro-passage-of-power]], 212). See [[cal.1962-10-20.missile-crisis]]. Names: McCone, Johnson, Eisenhower.'
    src:
      c: e7c5187c
      rows:
        - 'w.caro-passage-of-power 212: all'
        - 'via w.caro-passage-of-power 212 n.in-considerable-detail: all'
        - 'w.sorensen-kennedy 697: B'
    tags: [name:mccone-john-a, name:johnson-lyndon-b, name:eisenhower-dwight-d]
    time_range:
      - 1962-10-21T21:00Z
      - 1962-10-22T04:00Z
    time_zone: America/New_York
  - id: cal.1962-10-21.missile-crisis-2
    when: Oct. 21
    date: '1962-10-21'
    time: 1962-10-21T14:00Z
    thread: missile-crisis-excomm
    c: '10 a.m., the Oval Office, on Sorensen''s third draft of the address, by Ball''s account. Ball: hold Castro as responsible as Khrushchev, the blockade to take in petroleum; McNamara against: the blockade narrow, its one aim the missiles. Stevenson: not "render the missiles inoperable" but "dismantle and remove." Harriman, Hillenbrand and Talbot arrive at the White House in plain view, to send the press after China, India or Berlin.'
    n: '[[w.ball-past-has-another-pattern]], 297. See [[cal.1962-10-14.missile-crisis]]. Names: Sorensen, Ball, Castro, Khrushchev, McNamara, Stevenson, Harriman, Hillenbrand, Talbot.'
    src:
      c: 149006c7
      rows:
        - 'w.ball-past-has-another-pattern 297: all'
    tags: [name:sorensen-theodore-c, name:ball-george-w, name:castro-fidel, name:khrushchev-nikita-s, name:mcnamara-robert-s, name:stevenson-adlai-e, name:harriman-w-averell, name:hillenbrand-martin-j, name:talbot-phillips]
  - id: cal.1962-10-21.robert-kennedy
    when: Oct. 21
    date: '1962-10-21'
    thread: robert-kennedy
    also: [missile-crisis, europe-and-the-alliance-jupiters]
    c: 'Evening, the Justice Department. Robert Kennedy''s own group on the way out: "the Turkish missiles would have to be given up in the end, as the price of settlement." A public offer through the UN he finds "rather weak and defensive."'
    n: '[[w.fursenko-one-hell-of-a]], 237; [[w.thomas-robert-kennedy]], 221 (State Department experts with Robert Kennedy, Sunday night: the Jupiters discussed and shelved; "weak and defensive"). Check: Thomas puts the meeting in the White House Situation Room (221). To check: Bernstein, "Reconsidering the Missile Crisis: Dealing with Problems of the American Jupiters in Turkey," in Nathan, ed., *The Cuban Missile Crisis Revisited* (1992), 73–74 (cited by [[w.fursenko-one-hell-of-a]], 237 n.53). Names: Robert Kennedy.'
    src:
      c: 51f47454
      rows:
        - 'w.fursenko-one-hell-of-a 237: all'
        - 'via w.fursenko-one-hell-of-a 237 n.53: all'
        - 'w.thomas-robert-kennedy 221: B-C'
    tags: [name:kennedy-robert-f]
    time_range:
      - 1962-10-21T21:00Z
      - 1962-10-22T04:00Z
    time_zone: America/New_York
  - id: cal.1962-10-21.missile-crisis-3
    when: Oct. 21
    date: '1962-10-21'
    time: 1962-10-21T18:30Z
    thread: missile-crisis-excomm
    c: 'The 506th NSC, 2:30 to 4:50 p.m. The third draft of the President''s speech read and revised: the numbers of missiles and sites out; "quarantine," not blockade, Rusk for it; the responsibility pinned on Khrushchev; no invitation to a summit. Anderson on the quarantine''s procedures. United Nations inspection of the missiles'' removal to be asked.'
    n: '[FRUS 1961–63, XI, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v11/d38) (the minutes). [[w.sorensen-kennedy]], 698 (the meeting; the draft read; Anderson; the inspection); [[w.salinger-with-kennedy]], 258–59 (the meeting Salinger attends at Kennedy''s order: the summit proposal deleted from the address; "quarantine" chosen over "blockade," with no speaker named; Acheson to brief de Gaulle and NATO, Bruce Macmillan, Dowling Adenauer; Stevenson''s case to the UN; Don Wilson''s plan for ten Atlantic radio stations broadcasting to Cuba by night approved; not the draft, Anderson or the inspection). See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Rusk, Khrushchev, Anderson.'
    src:
      c: 174d91a4
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d38: all'
        - 'w.sorensen-kennedy 698: A, B, F, G'
        - 'w.salinger-with-kennedy 258–59: E'
    tags: [name:kennedy-john-f, name:rusk-dean, name:khrushchev-nikita-s, name:anderson-george-w-jr]
    variants:
      - unit: A
        witness: w.salinger-with-kennedy
        reads: 'Salinger: an ExComm session in the Cabinet Room "that morning," Salinger present, "within the hour" of his talk with Kennedy about Mass; he is home by four that afternoon'
        at: 258–60
  - id: cal.1962-10-21.missile-crisis-4
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis-excomm
    c: 'Late in the day the White House calls Fulbright, touring Arkansas: to Little Rock, an Air Force plane to bring him to Washington. From Little Rock he tells Tillman, of Foreign Relations'' staff, to draft him a memorandum. Tillman, from the papers and the Record: a force landed to take out the missiles, the Soviets let stand aside.'
    n: '[[w.woods-fulbright]], 271, 274. To check: Seth Tillman, interview by Woods, Oct. 6, 1988 (cited by [[w.woods-fulbright]], 273–74 nn.37, 40). Meeting: [[cal.1962-10-22.missile-crisis-4]]. Names: Fulbright.'
    src:
      c: a887838f
      rows:
        - 'w.woods-fulbright 271, 274: all'
        - 'via x.1988-10-06.woods-interview-tillman: B-C'
    tags: [name:fulbright-j-william]
    time_range:
      - 1962-10-21T20:00Z
      - 1962-10-22T01:00Z
    time_zone: America/New_York
  - id: cal.1962-10-21.missile-crisis-5
    when: Oct. 21
    date: '1962-10-21'
    time: 1962-10-21T15:30Z
    thread: missile-crisis-excomm
    c: 'The Oval Room, 11:30 a.m. to about 12:30 p.m. Kennedy with Robert Kennedy, McNamara, Taylor and Sweeney of the Tactical Air Command, McCone joining. Sweeney certain an air strike would be "successful," not all the known missiles likely destroyed; Taylor: "The best we can offer you is to destroy 90% of the known missiles." The air strike out, the blockade on, by Sorensen''s account.'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 36](https://history.state.gov/historicaldocuments/frus1961-63v11/d36). [[w.sorensen-kennedy]], 697 (Robert Kennedy in from Virginia in riding clothes; the air strike out); [[w.taylor-swords-and-plowshares]], 271 (Sweeney''s answers; the blockade chosen; no time of day). See [[cal.1962-10-16.missile-crisis]]. Names: Robert Kennedy, McNamara, Taylor, McCone, John F. Kennedy.'
    src:
      c: 3d8a348c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d36: A-D'
        - 'w.sorensen-kennedy 697: B, E'
        - 'w.taylor-swords-and-plowshares 271: B-C, E'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a]
  - id: cal.1962-10-21.press-and-broadcasting
    when: Oct. 21
    date: '1962-10-21'
    thread: press-and-broadcasting
    also: [missile-crisis]
    c: 'Sunday night. Kennedy asks the *New York Times* and the *Washington Post* not to run their stories of a coming quarantine; both hold them. The next afternoon''s *Herald Tribune*: "Top-Secret Doings in Capital; A Cuba-Berlin Strategy Step?"'
    n: '[[w.fursenko-one-hell-of-a]], 238; [[w.sorensen-kennedy]], 697–98 (one newspaper had the story Sunday evening and agreed not to print it at the President''s request; publishers asked to check). Check: the day: [[w.odonnell-johnny-we-hardly-knew]], 370, has Kennedy''s calls to the Post and the Times on Saturday night (Oct. 20), after O''Donnell''s call from the Rowe party, not Sunday night. To check: [[w.salinger-with-kennedy]], 253, 261 (cited by [[w.fursenko-one-hell-of-a]], 238 n.58–59); *New York Herald Tribune*, Oct. 22, 1962 (238 n.57). See [[cal.1962-10-20.missile-crisis-3]]. Names: Kennedy.'
    src:
      c: a9158449
      rows:
        - 'w.fursenko-one-hell-of-a 238: all'
        - 'w.sorensen-kennedy 697–98: B-C'
    tags: [name:kennedy-john-f]
    time_range:
      - 1962-10-21T22:00Z
      - 1962-10-22T07:00Z
    time_zone: America/New_York
  - id: cal.1962-10-21.missile-crisis-6
    when: Oct. 21
    date: '1962-10-21'
    time: 1962-10-21T16:30Z
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: 'The White House, 12:30 p.m. Kennedy alone with Ormsby-Gore, the British Ambassador: the U-2 evidence; an air strike on Oct. 22 or a blockade, which could Britain support? Ormsby-Gore the blockade; the President: he and his advisers had come to the same conclusion.'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 37](https://history.state.gov/historicaldocuments/frus1961-63v11/d37) (editorial note, from the Ambassador''s report to London; no American record found). [[w.sorensen-kennedy]], 697 (he met with the British Ambassador, his close friend). To check: Harold Macmillan, *At the End of the Day, 1961–1963* (1973), 190–94 (cited by FRUS, doc. 37). See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Ormsby-Gore.'
    src:
      c: c0fa600a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d37: all'
        - 'w.sorensen-kennedy 697: B'
    tags: [name:kennedy-john-f, name:ormsby-gore-david]
  - id: cal.1962-10-21.missile-crisis-7
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    also: [europe-and-the-alliance-jupiters]
    c: 'William Bundy of ISA, "Generalized Negotiation of Bases as a Possible Face-Saver to the Soviets for Withdrawal of Missiles from Cuba": the Soviets out of Cuba, the United States out of Turkey and Italy or elsewhere; "hitherto we have considered the subject of ''foreign military bases'' an untouchable subject for negotiation"; the political cost perhaps too high.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 220. To check: William Bundy, "Generalized Negotiation of Bases as a Possible Face-Saver to the Soviets for Withdrawal of Missiles from Cuba," Oct. 21, 1962, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 220 n.117). Names: William Bundy.'
    src:
      c: aaeedbe1
      rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 220: all'
        - 'via x.1962-10-21.william-bundy-generalized-negotiation-of-bases-as: all'
    tags: [name:bundy-william]
