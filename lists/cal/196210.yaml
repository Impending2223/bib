    c: 'The ExComm in Ball''s conference room at State, the "Think Tank," Kennedy campaigning. Ball against an air strike: irreversible, and a great power acting against its own traditions loses its authority. By Ball''s account Robert Kennedy later puts it his way: a surprise strike another Pearl Harbor; "My brother is not going to be the Tojo of the 1960s."'
