    c: 'Khrushchev to Castro, dictated at the Presidium: "в такой кризисный, переломный момент не поддаваться чувству, проявить выдержку" (at such a critical turning point not to give way to feeling, to show restraint); no pretext for the Americans to wreck the settlement in sight: "Вчера вы сбили один из них" (Yesterday you shot one of them down).'
    n: 'Protocol 63, item V; P 63/V, Oct. 28, 1962, and the instructions to Alekseyev with the letter (f. 3, op. 18, d. 101, l. 17–18). [[w.prezidium-tsk-kpss-1954]], III, 386–87 (doc. 268.5.1); I, 624 (the letter dictated; its discussion not recorded); I, 1113 n.2. See [[cal.1962-10-28.soviet-union]]. Made public: 2003. Names: Khrushchev, Castro.'
    tags: [name:khrushchev-nikita-s, name:castro-fidel, polity:ussr, polity:cuba, polity:us]
