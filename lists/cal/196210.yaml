  - id: cal.1962-10-26.missile-crisis-3
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-quarantine
    c: 'The Navy boards the *Marucla*, Panamanian-owned, under Soviet charter, chosen as the least provocative: no contraband. The tanker *Bucharest*, having named itself and its cargo, had been let through without boarding, and an East German passenger ship.'
    n: '[[w.ball-past-has-another-pattern]], 302–03; [[w.sorensen-kennedy]], 710; [[w.sorensen-kennedy]], 710 (at dawn Friday, the President''s authorization; trucks and parts); [[w.thomas-robert-kennedy]], 225 (the *Marucla* boarded, under Soviet charter, mostly for show; the destroyer the *Joseph P. Kennedy, Jr.*); [[w.odonnell-johnny-we-hardly-knew]], 378 (on Friday the Marucla, a Soviet-chartered Liberty-ship freighter, is stopped at the blockade line by a destroyer, the Joseph P. Kennedy, Jr.; Kennedy: "I suppose everybody will say that I sent the Kennedy in there deliberately, to give our family some publicity"; the Bucharest let through unboarded the day before, the captain having assured the Navy of his cargo; not the boarding, the owner''s flag, the contraband or the East German ship); [[w.salinger-with-kennedy]], 271 (Defense announces the first boarding and search, of the *Marucla*, of Panamanian registry under Soviet charter; no resistance; by the destroyer *Joseph P. Kennedy, Jr.*; not the reason for choosing her). Check: the days, Ball giving the boarding as of Friday morning. Check: Thomas, 225, has the *Marucla* Lebanese-registered, carrying dry goods. See [[cal.1962-10-14.missile-crisis]].'
