    n: '[Meeting on Diplomatic Plans for the Crisis, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-diplomatic-plans-crisis), Tape 32 (Miller Center). [[w.schlesinger-thousand-days-1965]], 811. See [[cal.1962-10-16.missile-crisis]]. Names: John F. Kennedy, Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger, Hilsman, Stevenson.'
