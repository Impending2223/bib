    time: 1962-10-22T15:00Z
    thread: missile-crisis-excomm
    c: 'The Oval Office, 11 a.m. Kennedy with Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger and Hilsman on the diplomacy of the crisis; Stevenson''s speech to the Security Council gone over, a threat of an American strike cut. Schlesinger sent to help Stevenson. Robert Kennedy: "We will have to make a deal at the end, but we must stand absolutely firm now."'
    n: '[Meeting on Diplomatic Plans for the Crisis, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-diplomatic-plans-crisis), Tape 32 (Miller Center). [[w.schlesinger-thousand-days-1965]], 811; [[w.schlesinger-journals]], 175 (Monday, Oct. 22: the President tells Schlesinger to go to New York to work with Stevenson; at 11 Schlesinger meets Rusk, Robert Kennedy "and others," who read his draft for the Security Council, "generally applauded"; "The President called for a few omissions—including a passage threatening an American strike if the Cuban build-up persisted"; to New York after lunch; the page gives neither the Oval Office nor the other names nor Robert Kennedy''s words). See [[cal.1962-10-16.missile-crisis]]. Names: John F. Kennedy, Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger, Hilsman, Stevenson.'
    src:
      c: 2bdee4c4
