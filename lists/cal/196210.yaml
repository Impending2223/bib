  - id: cal.1962-10-24.immigration
    when: Oct. 24
    date: '1962-10-24'
    thread: immigration
    c: 'Act of Oct. 24, [76 Stat. 1247](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1247.pdf): nonquota visas for the waiting lists. Relatives of citizens in the fourth preference, registered before Mar. 31, 1954, on petitions filed before 1962; skilled specialists in the first preference, on petitions filed before Apr. 1, 1962, where half their country''s quota is oversubscribed.'
    n: 'Statute (K–J Cong. II.J.2). S. 3361, 87th Cong. To check: [[w.reimers-still-the-golden-door]]. See [[cal.1961-09-26.immigration]].'
    tags: [name:kennedy-john-f]
    short: the waiting lists cleared
    time_range:
