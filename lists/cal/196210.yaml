    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'Stevenson to the Security Council from 4 p.m., his text finished as he speaks; the OAS resolution handed to him in the course of it. Kennedy wires him: "It has given our cause a great start."'
    n: '[[w.department-of-state-bulletin]], [Nov. 12, 1962, 723](https://archive.org/details/departmentofstat4762unit/page/723/mode/1up) (the statement of Oct. 23). [[w.schlesinger-thousand-days-1965]], 813–14. [[w.sorensen-kennedy]], 706. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson, Kennedy.'
