    n: '[[w.preston-war-council]], 108. To check: Forrestal to Bundy, Oct. 4, 1962, NSF, Meetings and Memoranda, Staff Memoranda, Forrestal, box 320, Kennedy Library (cited by [[w.preston-war-council]], 108 n.19). Names: Forrestal, Bundy, Kennedy. Check: Preston has defoliation approved in August, crop destruction early in October, enlarged in November at McNamara''s request; the days not given.'
