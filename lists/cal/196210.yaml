    c: 'Finletter from Paris, 9 p.m.: the Turks set great store by the Jupiters, a symbol of the Alliance''s will to use atomic weapons in Turkey''s defense; obsolescence no matter. Any arrangement not agreed beforehand by Ankara "most damaging"; one not putting some other considerable atomic capability in Turkey in their place would be rejected.'
