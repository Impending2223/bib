  - id: cal.1962-10-18.south-asia
    when: Oct. 18
    date: '1962-10-18'
    thread: south-asia
    also: [soviet-union, china]
    c: 'The Presidium, by poll, approves instructions to Benediktov, the Ambassador in New Delhi: to see Nehru alone and tell him in confidence that Moscow is deeply disturbed and disappointed by recent events; the McMahon line drawn by Britain and never recognized by China; Peking''s proposal of talks without preconditions constructive; a new withdrawal humiliating to China.'
    n: '*Ob ukazaniyakh sovposlu v Indii v svyazi s kitaisko-indiiskim pogranichnym konfliktom*, P 59/33, Oct. 18, 1962, and the instructions, drafted by the Foreign Ministry (Kuznetsov). [[w.prezidium-tsk-kpss-1954]], III, 335–39 (doc. 263.0; for: Kozlov, Kosygin, Polyansky, Suslov, Khrushchev, Shvernik); I, 1108 n.1 (the signed protocol of the session of Oct. 14 dated Oct. 18). See [[cal.1962-10-14.soviet-union]]. Made public: 2008. Names: Nehru, Benediktov.'
    tags: [name:benediktov-ivan-a, name:nehru-jawaharlal, polity:ussr, polity:india, polity:prc, polity:uk]
  - id: cal.1962-10-18.europe-and-the-alliance
    when: Oct. 18
    date: '1962-10-18'
    thread: europe-and-the-alliance
    c: 'Macmillan with Bligh, his private secretary, and Cary of the Cabinet Office, from luncheon to 6:30, on what he now calls "The Modernisation of Britain": a plan of action within a few days, for one or two colleagues.'
    n: '[[w.macmillan-diaries]], 507 (the diary of Oct. 19, "yesterday"; n.91: the paper, CAB 129/111, C(62) 201). Names: Macmillan.'
    tags: [name:macmillan-harold, polity:uk]
  - id: cal.1962-10-18.europe-and-the-alliance-2
    when: Oct. 18
    date: '1962-10-18'
    thread: europe-and-the-alliance
    c: 'Maudling, the Chancellor of the Exchequer, at dinner with Macmillan: Bank Rate not to be lowered for the present; the long-term rate of interest to be brought down; purchase tax on motor cars cut from 45 to 33⅓ percent, to be announced when Parliament returns, at £30 million to the revenue.'
    n: '[[w.macmillan-diaries]], 507. Check: the day: the diary of Oct. 19, after "We had a good day yesterday." See [[cal.1962-10-18.europe-and-the-alliance]]. Names: Maudling, Macmillan.'
    tags: [name:maudling-reginald, name:macmillan-harold, polity:uk]
