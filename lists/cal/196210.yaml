    c: '7:35 p.m., the Statler Hotel coffee shop. Scali to Fomin (Feklisov): the United States government "sees real possibilities in this," the word from "the highest sources." Fomin asks whether UN inspectors could also check the American bases in Florida and nearby countries; Scali: a terrible complication. Fomin will report at once to the highest Soviet sources and to Zorin. Twenty minutes. By Scali''s memorandum, printed by Salinger.'
