    thread: missile-crisis-excomm
    c: 'A meeting shortly after the address. Kennedy''s doodles on two sheets of his yellow pad: "serious ... 16–32 [missiles] within a week ... Soviet submarines ... blockade ... Guantanamo ... increases risk ... McCone ... 1 million men ... holding the alliance."'
    n: '[[w.sorensen-kennedy]], 705 (quoting them). Check: the day; Sorensen: "during one of our meetings shortly after his speech." Names: Kennedy, McCone.'
    src:
      c: f0511b08
      rows:
        - 'w.sorensen-kennedy 705: all'
    tags: [name:kennedy-john-f, name:mccone-john-a]
  - id: cal.1962-10-23.missile-crisis-19
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: 'The morning after the address. Rusk greets Ball, from a night on his office couch: "George, we''ve won a great victory. You and I are still alive." At home, Ball''s wife lays in canned goods, water, some books.'
    n: '[[w.thomas-robert-kennedy]], 223 (by Ball''s account). To check: [[w.ball-past-has-another-pattern]], 299, 304 (cited by Thomas, 436). Names: Rusk, Ball.'
    src:
      c: 09d44c60
      rows:
        - 'w.thomas-robert-kennedy 223: all'
    tags: [name:rusk-dean, name:ball-george-w]
  - id: cal.1962-10-23.missile-crisis-20
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'Robert Kennedy sends his aides at the Justice Department home to their families. Symington buys a tent and knapsacks. The top White House officials handed envelopes, to be opened in case of attack: directions to the landing sites for the helicopters to a mountain shelter in Virginia. Kennedy to Guthman: "I''m not going. If it comes to that, there''ll be sixty million Americans killed and as many Russians or more. I''ll be at Hickory Hill."'
    n: '[[w.thomas-robert-kennedy]], 223–24. To check: [[w.guthman-we-band-of-brothers]], 126 (cited by Thomas, 436). Check: the day; Thomas puts it in the week after the address. Names: Robert Kennedy, James Symington, Guthman.'
    src:
      c: 6fe39f8f
      rows:
        - 'w.thomas-robert-kennedy 223–24: all'
        - 'via x.undated.joe-dolan-interview-thomas: A'
        - 'via x.undated.james-symington-interview-thomas: B'
    tags: [name:kennedy-robert-f, name:symington-james-w, name:guthman-edwin-o]
  - id: cal.1962-10-23.south-asia
    when: Oct. 23
    date: '1962-10-23'
    thread: south-asia
    also: [china]
    c: 'Zhongnanhai, the Juxiang Shuwu, 5 a.m. Mao Zedong calls Zhou Enlai and others together on settling the armed conflict on the border with India. Decided: a statement by the central government proposing an end to the conflict, renewed peaceful talks and a settlement of the boundary; Zhou to direct its drafting.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 23, 1962. Made public: Check (2013 at the latest). See [[cal.1962-10-17.south-asia]]. Names: Mao Zedong, Zhou Enlai.'
    tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:india]
  - id: cal.1962-10-23.south-asia-2
    when: Oct. 23
    date: '1962-10-23'
    thread: south-asia
    also: [china]
    c: After 10 p.m. Mao Zedong calls a second meeting; the government's statement discussed and adopted.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 23, 1962. Made public: Check (2013 at the latest). See [[cal.1962-10-23.south-asia]]. Names: Mao Zedong.'
    tags: [name:mao-zedong, polity:prc]
  - id: cal.1962-10-23.missile-crisis-diplomacy
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    also: [soviet-union]
    c: 'Moscow. The Soviet government''s statement on Kennedy''s address: the quarantine piracy, a step toward a world thermonuclear war; Cuba''s arms for its defense; all foreign troops to come home; the Security Council to be called. Approved by the Presidium that day, for the press.'
    n: 'P 60/I, Oct. 23, 1962, item 1, and *Zayavlenie Sovetskogo pravitel''stva* (the revised draft). [[w.prezidium-tsk-kpss-1954]], III, 339–45 (341: "Соединенные Штаты Америки делают шаг на пути к развязыванию мировой термоядерной войны" (the United States is taking a step toward unleashing a world thermonuclear war)); I, 1109 n.3 (the editors: published Oct. 23; "но если агрессоры развяжут войну, то Советский Союз нанесет самый мощный ответный удар" (but if the aggressors unleash war, the Soviet Union will strike the most powerful return blow); the defensive arms to go if all foreign bases go). See [[cal.1962-10-22.soviet-union]]. Check: the volume prints the revised draft (III, 340 n.д); the text as published not read. Names: Kennedy.'
    tags: [name:kennedy-john-f, polity:ussr, polity:us, polity:cuba]
  - id: cal.1962-10-23.missile-crisis-anadyr
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-anadyr
    also: [cuba]
    c: 'Khrushchev to Castro, by cable to Alekseyev for delivery at once, with Kennedy''s letter: the address a gross interference in Cuba''s affairs and a brazen provocation against the Soviet Union; the Soviet military in Cuba ordered to take measures and be in full readiness. Approved by the Presidium.'
    n: 'P 60/I, Oct. 23, 1962, item 3. [[w.prezidium-tsk-kpss-1954]], III, 346–47 (doc. 264.0.3); I, 1110 n.7. Made public: 2003. Names: Khrushchev, Castro, Kennedy, Alekseyev.'
    tags: [name:alekseyev-aleksandr-i, name:khrushchev-nikita-s, name:castro-fidel, name:kennedy-john-f, polity:ussr, polity:cuba, polity:us]
  - id: cal.1962-10-23.missile-crisis-diplomacy-2
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: '5:45 to about 7 p.m. Acheson, with Dowling, briefs Adenauer: an air strike on the missile sites, 3,000 to 4,000 Russians killed; then the airfields and SAM sites, 10,000 to 15,000 Cubans; then a landing of 75,000 to 100,000; the President chose the blockade. Adenauer: unrest could be stirred up inside Cuba; no conflict if the West stands firm.'
    n: '*Gespräch des Bundeskanzlers Adenauer mit dem Sonderberater des amerikanischen Präsidenten, Acheson* (Weber''s record, Oct. 30). [[w.akten-zur-auswartigen-politik]], III, 1762–66 (Dok. 409). To check: FRUS 1961–63, American Republics; Cuba 1961–1962; Cuban Missile Crisis and Aftermath, Microfiche Supplement, doc. 378 (cited by [[w.akten-zur-auswartigen-politik]], III, 1762 n.2). See [[cal.1962-10-22.missile-crisis-22]]. Names: Acheson, Dowling, Adenauer.'
    tags: [name:acheson-dean-g, name:dowling-walter-c, name:adenauer-konrad, polity:us, polity:frg, polity:cuba, polity:ussr]
  - id: cal.1962-10-23.missile-crisis-diplomacy-3
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    c: 'Adenauer to Kennedy, by letter: "aus voller Überzeugung" (from full conviction) for the President''s "große, umfassende Aktion" (great, comprehensive action) against the Soviet missile sites in Cuba.'
    n: '[[w.akten-zur-auswartigen-politik]], III, 1903 n.3. To check: [[w.adenauer-briefe-1961-1963]], 176 (cited by [[w.akten-zur-auswartigen-politik]], III, 1903 n.3). Names: Adenauer, Kennedy.'
    tags: [name:adenauer-konrad, name:kennedy-john-f, polity:frg, polity:us, polity:cuba]
  - id: cal.1962-10-23.missile-crisis-diplomacy-4
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    c: The Cabinet, 10:30 a.m. to 1 p.m. Macmillan on Cuba, the documents read aloud, not circulated. Ministers "rather shaken, but satisfied."
    n: '[[w.macmillan-diaries]], 510. Names: Macmillan.'
    tags: [name:macmillan-harold, polity:uk]
  - id: cal.1962-10-23.missile-crisis-diplomacy-5
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-diplomacy
    c: London, late into the night. Macmillan's messages, each drafted apart, to de Gaulle, Adenauer and Fanfani; to Diefenbaker, Menzies and Holyoake; to Nehru and Ayub; and to Nehru a personal one on his war with China.
    n: '[[w.macmillan-diaries]], 511 (Canada "has already got cold feet"; India given ammunition and light arms). Names: Macmillan, de Gaulle, Adenauer, Fanfani, Diefenbaker, Menzies, Holyoake, Nehru, Ayub Khan.'
    tags: [name:macmillan-harold, name:de-gaulle-charles, name:adenauer-konrad, name:fanfani-amintore, name:diefenbaker-john-g, name:menzies-robert-g, name:holyoake-keith, name:nehru-jawaharlal, name:ayub-khan-mohammad, polity:uk, polity:fr, polity:frg, polity:italy, polity:canada, polity:australia, polity:nz, polity:india, polity:pakistan, polity:prc]
  - id: cal.1962-10-23.european-community
    when: Oct. 23
    date: '1962-10-23'
    thread: european-community
    also: [missile-crisis-diplomacy]
    c: 'Brussels, the EEC''s foreign ministers in consultation, Piccioni in the chair. Cuba first: understanding for the American stand; firmness against the Soviet threat. Schröder on his talks with Kennedy and Rusk; in the afternoon, on Bonn''s recognition of the new government in Yemen, Piccioni and the French minister favorable, Paris to wait.'
    n: 'Jansen''s circular of Oct. 24, 1962, Fernschreiben Nr. 3674 Plurex, sent Oct. 25. [[w.akten-zur-auswartigen-politik]], III, 1779 (Dok. 414). See [[cal.1962-10-17.berlin-and-vienna]]. Names: Piccioni, Schröder, Kennedy, Rusk.'
    tags: [name:piccioni-attilio, name:schroder-gerhard, name:kennedy-john-f, name:rusk-dean, polity:frg, polity:italy, polity:fr, polity:us, polity:ussr, polity:yemen]
  - id: cal.1962-10-23.missile-crisis-quarantine-2
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis-quarantine
    c: 'The White House, after the evening meeting, in Kennedy''s office with Robert Kennedy, Sorensen and O''Donnell, on the rash actions that start wars. Kennedy, who had lately read Tuchman''s The Guns of August, quotes the German Chancellor asked how the war began: "Ah, if we only knew." "I wish we could send a copy of that book to every Navy officer on every Navy ship right now. But they probably wouldn''t read it."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 375 (O''Donnell''s and Powers''s account). See [[cal.1962-10-23.missile-crisis-15]]. Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, Robert Kennedy, Sorensen, O''Donnell.'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:sorensen-theodore-c, name:odonnell-kenneth-p, polity:cuba]
  - id: cal.1962-10-23.press-and-broadcasting
    when: Oct. 23
    date: '1962-10-23'
    thread: press-and-broadcasting
    also: [missile-crisis-quarantine]
    c: '6 p.m. Salinger meets news-industry leaders: McKelway of the *Star* and AP, Gallagher, Thomason of UPI, Merriman Smith, Hagerty for ABC, Blair Clark, McAndrew, Sylvester and Manning. He asks them to withhold information that helps the enemy, and promises twelve points the next day and a twenty-four-hour Pentagon news desk. Gallagher and McAndrew resent any suggestion of censorship and the barring of reporters from blockade ships and Guantánamo. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 287–89. Names: Salinger, Hagerty, Sylvester, Manning.'
    tags: [name:salinger-pierre, name:hagerty-james-c, name:sylvester-arthur, name:manning-robert-j]
  - id: cal.1962-10-23.press-and-broadcasting-2
    when: Oct. 23
    date: '1962-10-23'
    thread: press-and-broadcasting
    also: [missile-crisis-quarantine]
    c: After the news leaders leave, Salinger asks Hagerty to stay, lays out the censorship plans for full war and, with Kennedy's assent, asks him to head them. Hagerty, reluctant, agrees to head an advisory committee, and proposes Byron Price. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 289–90. See [[cal.1962-10-23.press-and-broadcasting]]. Names: Salinger, Hagerty, Kennedy, Price.'
    tags: [name:salinger-pierre, name:hagerty-james-c, name:kennedy-john-f, name:price-byron]
  - id: cal.1962-10-23.press-and-broadcasting-3
    when: Oct. 23
    date: '1962-10-23'
    thread: press-and-broadcasting
    also: [missile-crisis-quarantine]
    c: Salinger takes Hagerty to Kennedy, who thanks him for agreeing to head the advisory committee; Price is to be called at once, on standby, and agrees to serve if full censorship comes. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 290. See [[cal.1962-10-23.press-and-broadcasting-2]]. Names: Salinger, Hagerty, Kennedy, Price.'
    tags: [name:salinger-pierre, name:hagerty-james-c, name:kennedy-john-f, name:price-byron]
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Soviet ships stop or turn back. Rusk: "the other fellow just blinked."'
    n: '[FRUS 1961–63, XI, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v11/d55). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 210–11, 213 (the ships turned back, by Oct. 25); [[w.poole-joint-chiefs-of-staff]], 177; [[w.schlesinger-robert-kennedy-and-his]], 514–15 (the ships stopped, at the morning''s ExComm); [[w.rusk-as-i-saw-it-1990]], 237; [[w.sorensen-kennedy]], 709–10 (the ships); [[w.fursenko-khrushchevs-cold-war]], 481–82 (McCone: "they either stopped them or reversed direction"; Rusk to Bundy); [[w.thomas-robert-kennedy]], 224–25 (10 a.m.; the submarine; Robert Kennedy on his brother''s face; McCone: the ships stopped; Rusk''s "eyeball to eyeball"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 210 (the OAS, 19 to 0, Oct. 24); [[w.caro-passage-of-power]], 213 (Wednesday, Oct. 24, the ExComm at 10 a.m.: McCone announces that the Russian ships have stopped, "and might be starting to turn around"; not Rusk''s words); [[w.odonnell-johnny-we-hardly-knew]], 375–77 (the Cabinet Room, the blockade in force at ten; two Russian ships and a submarine near the line; McCone with a note, "some of the Russian ships are stopping"; twenty ships stopped; Rusk: "We''re eyeball to eyeball, and I think the other fellow just blinked"). [[w.reeves-president-kennedy]], 400–401. [[w.ball-past-has-another-pattern]], 300 (a dozen of the twenty-five ships, word reaching the Cabinet Room). Word reached the ExComm at its 10 a.m. meeting: [[w.thomas-robert-kennedy]], 224–25. To check: [[w.dobbs-one-minute-to-midnight]]. See [[cal.1962-10-16.missile-crisis]]. Names: Rusk. Check: Rusk puts the ships'' stopping on the Thursday (237).'
