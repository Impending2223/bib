  - id: cal.1962-10-19.missile-crisis-warnings-2
    when: Oct. 19
    date: '1962-10-19'
    thread: missile-crisis-warnings
    c: 'Chicago, the Sheraton-Blackstone, while Kennedy is at the Yates dinner at McCormick Place. Salinger presses O''Donnell to let him in on what is happening. O''Donnell: "All I can tell you now is that the President may have to develop a cold tomorrow. If he does, we''ll have to cancel the rest of the trip and go back to Washington." O''Donnell has arranged with Dick O''Hare in Washington to cancel the rest of the trip on five minutes'' notice.'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 363–64 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 251 (Salinger finds O''Donnell alone in the suite after Kennedy has left for a $100-a-plate Democratic dinner at McCormick Place, Yates not named: "You''re going to have to cut me in pretty quick"). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Kennedy.'
    src:
