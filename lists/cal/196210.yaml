  - id: cal.1962-10-03.european-community
    when: Oct. 3
    date: '1962-10-03'
    thread: european-community
    c: 'Brighton, the Labour Party conference. Gaitskell against entry on the terms in sight: a federal Europe "the end of a thousand years of history." The conference backs the executive''s five conditions. The Commonwealth''s Prime Ministers had met in London, Sept. 10–19. The Conservatives, at Llandudno the next week, for entry (Check the dates).'
    n: 'Labour Party, *Report of the Sixty-First Annual Conference* (1962) (Check the pages). To check: [[w.williams-hugh-gaitskell]]; [[w.ludlow-dealing-with-britain]]; [[w.young-this-blessed-plot]]; [[w.milward-uk-and-the-european]]. See [[cal.1961-10-10.european-community]]. Names: Gaitskell.'
    tags: [name:gaitskell-hugh]
