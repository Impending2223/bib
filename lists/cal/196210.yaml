    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis-diplomacy
    also: [europe-and-the-alliance]
    c: 'Rhöndorf, 11:30 a.m. to 1:15 p.m., Globke present. Dowling brings Adenauer Kennedy''s answer to Khrushchev and asks his view: the United States may soon have to bomb the sites or invade, within twenty-four hours, he expects. Adenauer: "er sei für beide Maßnahmen; die Basen müßten weg" (he was for both measures; the bases must go), for an invasion too; more pressure on Castro, an ultimatum of twenty-four hours. Bonn''s man at NATO to be instructed so.'
    n: '*Gespräch des Bundeskanzlers Adenauer mit dem amerikanischen Botschafter Dowling in Rhöndorf*. [[w.akten-zur-auswartigen-politik]], III, 1799–1803 (Dok. 419). See [[cal.1962-10-23.missile-crisis-diplomacy-2]]. Names: Globke, Dowling, Adenauer, Kennedy, Khrushchev, Castro.'
