  - id: cal.1962-10-21.missile-crisis-2
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis
    c: '10 a.m., the Oval Office, on Sorensen''s third draft of the address, by Ball''s account. Ball: hold Castro as responsible as Khrushchev, the blockade to take in petroleum; McNamara against: the blockade narrow, its one aim the missiles. Stevenson: not "render the missiles inoperable" but "dismantle and remove." Harriman, Hillenbrand and Talbot arrive at the White House in plain view, to send the press after China, India or Berlin.'
    n: '[[w.ball-past-has-another-pattern]], 297. See [[cal.1962-10-14.missile-crisis]]. Names: Sorensen, Ball, Castro, Khrushchev, McNamara, Stevenson, Harriman, Hillenbrand, Talbot.'
