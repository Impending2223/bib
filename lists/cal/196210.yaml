    c: Before the address. Sorensen refuses all calls from newsmen; he answers one powerful Congressman ("Is it serious?" "Yes") and Edward Kennedy ("Should I give my campaign dinner speech on Cuba?" "No"). He gives Feldman and Lee White copies of the speech. By Sorensen's account.
