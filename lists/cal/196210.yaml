    c: 'The Senate after the riot. Ervin deplores it, but those "fomenting litigation" might meditate on St. Paul: "All things are lawful unto me, but all things are not expedient." Stephen Young: "There just cannot be any compromise on civil rights." Javits: "reckless defiance of the law only breeds anarchy."'
    n: '[108 Cong. Rec. 21,415](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt16/pdf/GPO-CRECB-1962-pt16-3-1.pdf#page=13) (1962) (Oct. 1, 1962). [[w.mann-walls-of-jericho]], 332–33. The Senate sat from noon to 9:45 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=1), [D592](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=590). See [[cal.1962-06-25.mississippi]]. Names: Ervin, Stephen Young, Javits.'
