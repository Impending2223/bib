    c: The Executive Committee, 10 a.m. The Proclamation of Interdiction approved, to issue at 6 p.m., in force at dawn Oct. 24; an order extending tours of duty. If a U-2 is shot down, retaliation on the likeliest SAM site, McNamara to decide if the President is unavailable. Quarantine to exclude POL at first. About six low-level reconnaissance flights approved.
