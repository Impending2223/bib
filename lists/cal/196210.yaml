  - id: cal.1962-10-26.missile-crisis-3
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-quarantine
    c: 'The Navy boards the *Marucla*, Panamanian-owned, under Soviet charter, chosen as the least provocative: no contraband. The tanker *Bucharest*, having named itself and its cargo, had been let through without boarding, and an East German passenger ship.'
    n: '[[w.ball-past-has-another-pattern]], 302–03; [[w.sorensen-kennedy]], 710; [[w.sorensen-kennedy]], 710 (at dawn Friday, the President''s authorization; trucks and parts); [[w.thomas-robert-kennedy]], 225 (the *Marucla* boarded, under Soviet charter, mostly for show; the destroyer the *Joseph P. Kennedy, Jr.*). Check: the days, Ball giving the boarding as of Friday morning. Check: Thomas, 225, has the *Marucla* Lebanese-registered, carrying dry goods. See [[cal.1962-10-14.missile-crisis]].'
