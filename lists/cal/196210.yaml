    c: 'Kennedy shows the congressional leaders the U-2 photographs and his course. Russell: the quarantine too slow and too risky, invade; Fulbright with him.'
    n: '[Meeting with the Congressional Leadership on the Cuban Missile Crisis, 5:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-congressional-leadership-cuban-missile-crisis), Tapes 33 and 33A (Miller Center). [[w.schlesinger-thousand-days-1965]], 812; [[w.fursenko-one-hell-of-a]], 243–45 (Russell; "one hell of a gamble"); [[w.humphrey-education-of-a-public-1976]], 248–49 (the meeting; Humphrey flown in by a military plane, with Hickenlooper from Iowa, by his account); [[w.rusk-as-i-saw-it-1990]], 234–35; [[w.fursenko-khrushchevs-cold-war]], 474–75 (Russell: "these people have been warned"; Kennedy: "it may very well come to that before the end of the week"); [[w.woods-fulbright]], 271–72 (Russell and Fulbright: an air strike or an invasion); [[w.sorensen-kennedy]], 702–03; [[w.sorensen-kennedy]], 702 (some twenty leaders at 5 p.m.; Russell and Fulbright for an invasion; Halleck informed, not consulted); [[w.caro-passage-of-power]], 215 (twenty leaders in the Cabinet Room before the telecast, Johnson attending; Russell for invasion at once; Fulbright, a blockade "the worst of the alternatives"; not the photographs); [[w.odonnell-johnny-we-hardly-knew]], 370–72 (Hale Boggs brought from the Gulf by helicopter and jet; Kennedy to Dirksen: "tonight you''re going to get reelected"; McCone on the photographs, Rusk and McNamara on the blockade; Russell demanded a military attack, Fulbright backed him; Kennedy: "Last Tuesday, I was for an air strike or an invasion myself"); [[w.sorensen-counselor]], 297 (hours before the address, Russell calls for an invasion: "You should assemble as speedily as possible an adequate force and clean out that situation!"; Fulbright for an invasion "and an all-out one, as quickly as possible"; Kennedy: it "would be foolish" to expect the Russians not to regard it as far more offensive than a blockade; not the day''s hour); [[w.salinger-with-kennedy]], 264 (at 5 p.m. the leaders shown the photographs and told of the quarantine; Russell argues for an invasion, Fulbright with him; Kennedy will not change; not "too slow and too risky"); [[w.albert-little-giant-1990]], 264–65 (a Monday afternoon in October, five o''clock: the leaders of both houses and the committee chairmen told of the missiles and the quarantine; Russell, in Albert''s words, a quarantine too weak a response, invade; Kennedy: an invasion likely would trigger nuclear war; not the photographs, Fulbright, or "too slow and too risky"). [[w.schlesinger-robert-kennedy-and-his]], 531 (Fulbright for invasion, a "wiser course"). Schlesinger, 812, gives five o''clock; PRDE catalogues the recording at 5:30 p.m. ([Tapes 33.2 and 33A.1](https://prde.upress.virginia.edu/conversations/8030006)). [[w.reeves-president-kennedy]], 392–93. [[w.ball-past-has-another-pattern]], 298 (the leaders for an air strike or stronger action). Check: Woods (271–72) dates the Russell Papers'' copy of the notes Oct. 23 and puts the meeting at five o''clock; Kennedy, by the notes, gives thirty medium-range missiles, forty MiG-21s and twenty Il-28s. See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Russell, Fulbright. Check: Humphrey puts Kennedy in Minnesota the weekend before, at the State fairgrounds on the Saturday night (248–49); [[cal.1962-10-20.missile-crisis]] has him in Chicago.'
