  - id: cal.1962-10-21.missile-crisis
    when: Oct. 21
    date: '1962-10-21'
    thread: missile-crisis-excomm
    c: 'Evening, The Elms. McCone briefs Johnson, back from his trip toward Hawaii, on the quarantine. By McCone''s memorandum, Johnson against it, "locking the barn after the horse was gone," and against "telegraphing our punch": for "an unannounced strike"; he agrees reluctantly, told of Eisenhower''s support.'
    n: '[[w.caro-passage-of-power]], 212; [[w.sorensen-kennedy]], 697 (the Vice President brought back from his campaign tour in Hawaii). To check: McCone''s memorandum for the file, Oct. 22, 1962 (cited by [[w.caro-passage-of-power]], 212). See [[cal.1962-10-20.missile-crisis]]. Names: McCone, Johnson, Eisenhower.'
    src:
      c: e7c5187c
      rows:
        - 'w.caro-passage-of-power 212: all'
        - 'via w.caro-passage-of-power 212 n.in-considerable-detail: all'
        - 'w.sorensen-kennedy 697: B'
    tags: [name:mccone-john-a, name:johnson-lyndon-b, name:eisenhower-dwight-d]
    time_range:
