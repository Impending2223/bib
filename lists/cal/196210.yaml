  - id: cal.1962-10-03.european-community
    when: Oct. 3
    date: '1962-10-03'
    thread: european-community
    c: 'Brighton, the Labour Party conference. Gaitskell against entry on the terms in sight: a federal Europe "the end of a thousand years of history." The conference backs the executive''s five conditions. The Commonwealth''s Prime Ministers had met in London, Sept. 10–19. The Conservatives, at Llandudno the next week, for entry (Check the dates).'
    n: 'Labour Party, *Report of the Sixty-First Annual Conference* (1962) (Check the pages). To check: [[w.williams-hugh-gaitskell]]; [[w.ludlow-dealing-with-britain]]; [[w.young-this-blessed-plot]]; [[w.milward-uk-and-the-european]]. See [[cal.1961-10-10.european-community]]. Names: Gaitskell.'
    tags: [name:gaitskell-hugh]
  - id: cal.1962-10-04.middle-east-johnson-plan
    when: Oct. 4
    date: '1962-10-04'
    thread: middle-east-johnson-plan
    c: 'Syria''s Prime Minister, al-Azm, on Joseph Johnson''s plan: a "clear violation" of the General Assembly''s Resolution 194; a plan to settle the refugees outside their homeland.'
    n: 'FRUS 1961–63, XVIII, doc. [75](https://history.state.gov/historicaldocuments/frus1961-63v18/d75), n. 2 (Komer, Oct. 9; airgram A-115 from Damascus). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: al-Azm, Johnson.'
    tags: [name:al-azm-khalid-pasha, name:johnson-joseph-e]
  - id: cal.1962-10-04.cuba
    when: Oct. 4
    date: '1962-10-04'
    thread: cuba
    also: [robert-kennedy]
    c: 'Mongoose meeting, Robert Kennedy in the chair: the President dissatisfied with the lack of sabotage; a sharp exchange with McCone. Phase two outmoded; Lansdale to bring sabotage forward at once and plan the mining of harbors. The Attorney General to chair the group for the time being.'
    n: 'McCone, memorandum of the meeting, [FRUS 1961–63, XI, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v11/d8); [S. Rep. No. 94-465, 147 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=158) (the chair). [[w.schlesinger-robert-kennedy-and-his]], 480 (the President''s wish). See [[cal.1961-11-30.cuba]]. Names: Robert Kennedy, Kennedy, McCone, Lansdale.'
    src:
      c: bdf8b174
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d8: A-D'
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=158: E'
        - 'w.schlesinger-robert-kennedy-and-his 480: A'
        - 'via w.schlesinger-robert-kennedy-and-his 480 n.53: A'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:mccone-john-a, name:lansdale-edward-g]
