  - id: cal.1962-10-04.cuba
    when: Oct. 4
    date: '1962-10-04'
    thread: cuba
    also: [robert-kennedy]
    c: 'Mongoose meeting, Robert Kennedy in the chair: the President dissatisfied with the lack of sabotage; a sharp exchange with McCone. Phase two outmoded; Lansdale to bring sabotage forward at once and plan the mining of harbors. The Attorney General to chair the group for the time being.'
    n: 'McCone, memorandum of the meeting, [FRUS 1961–63, XI, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v11/d8); [S. Rep. No. 94-465, 147 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=158) (the chair). [[w.schlesinger-robert-kennedy-and-his]], 480 (the President''s wish). [[w.fursenko-one-hell-of-a]], 217–18 (Robert Kennedy''s charge; McCone''s answer; the mining of harbors). See [[cal.1961-11-30.cuba]]. Names: Robert Kennedy, Kennedy, McCone, Lansdale.'
