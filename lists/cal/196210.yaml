    n: '[FRUS 1961–63, XI, doc. 99](https://history.state.gov/historicaldocuments/frus1961-63v11/d99) (Rusk''s letter of March 1987; Bundy: Cordier to stand by the night of Oct. 27). [[w.rusk-as-i-saw-it-1990]], 240–41; [[w.dobrynin-in-confidence]], 93–94 (by Rusk''s later account to Dobrynin). Made public: Rusk''s letter to James G. Blight, read by Bundy at the Hawk''s Cay conference, March 1987 ([FRUS 1961–63, XI, doc. 99](https://history.state.gov/historicaldocuments/frus1961-63v11/d99)). Check: in the memoir the suggestion is Rusk''s and Kennedy agrees (240–41); in the letter Kennedy instructs him. See [[cal.1962-10-14.missile-crisis]]. Names: Rusk, Kennedy, Cordier, U Thant.'
