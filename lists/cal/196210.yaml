  - id: cal.1962-10-15.africa
    when: Oct. 15
    date: '1962-10-15'
    thread: africa
    c: Ben Bella, Prime Minister of Algeria since Sept. 26, at the White House. Kennedy on the impression in Algeria that the United States favors nuclear tests, colonialism and imperialism. Algeria's economic needs discussed; no figures, no commitments. Then to Havana.
    n: 'Remarks of Welcome to Prime Minister Ben Bella of Algeria on the South Lawn at the White House, [1962 Pub. Papers 784](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=844); Joint Statement Following Discussions With Prime Minister Ben Bella, [1962 Pub. Papers 786](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=846) (Oct. 15, 1962). FRUS 1961–63, XXI, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v21/d71), [72](https://history.state.gov/historicaldocuments/frus1961-63v21/d72), [73](https://history.state.gov/historicaldocuments/frus1961-63v21/d73), [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77) (doc. 77: NSAM 211, Dec. 14, on aid to Algeria). To check: [[w.byrne-mecca-of-revolution]]; [[w.rakove-kennedy-johnson-and-the]]; [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1962-07-03.africa]]. Names: Ben Bella.'
    tags: [name:ben-bella-ahmed, name:kennedy-john-f]
