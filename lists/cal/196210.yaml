    c: 'At Robert Kennedy''s behest, Bartlett with Bolshakov at his office in the National Press Club, by the GRU''s record: the President "very angry," reminded of Pearl Harbor; he "does not want to invade Cuba," only to remove the MRBM bases, better through the UN. Later the same day, again, with the U-2 photographs on an easel: "So what do you see, Georgi?"'
