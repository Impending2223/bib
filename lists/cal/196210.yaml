  - id: cal.1962-10-26.missile-crisis-diplomacy
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-diplomacy
    also: [berlin-and-vienna]
    c: 'Schröder''s office, 3 p.m. Smirnov, the Soviet Ambassador, hands Schröder his government''s statement and asks Bonn to condemn the American aggression and use its influence with its allies. Schröder: the evidence shows Cuba made an offensive base, missiles of 1,800 to 3,700 km; peace threatened in Berlin too, where the Soviets are leaving the four powers'' footing.'
