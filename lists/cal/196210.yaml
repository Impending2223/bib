  - id: cal.1962-10-25.missile-crisis-4
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis-diplomacy
    c: 'Morning, Stevenson to U Thant with Washington''s suggestions. Thant''s confidential message to Khrushchev, sent at 2:26 p.m. by Ball''s account: Soviet ships to keep out of the interception area for a limited time "to permit discussion of the modalities of a possible agreement." His note to Kennedy: American vessels to avoid direct confrontation. Zorin had called his first proposal "very bad."'
