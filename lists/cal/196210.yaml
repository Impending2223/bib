  - id: cal.1962-10-27.missile-crisis-4
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis-excomm
    c: 'Evening, the ExComm, the President and his brother out of the room. Johnson against the Turkish trade: "We''re backing down"; the Russians "shot down one plane, and they gave up Turkey"; the U-2''s loss, not the letters, to be answered. Kennedy back about 7:20; Johnson left out of the smaller meeting in the Oval Office after. The record of action: the night reconnaissance with flares held up, then called off. The President''s message to U Thant: is the Soviet Union willing "immediately to cease work on these bases in Cuba and render the weapons inoperable under UN verification so that various solutions can be discussed"? The U-2 over the Soviet Union not to be mentioned unless Moscow does; tomorrow''s day mission without escort, but fighters to attack MIGs that attack it.'
    n: '[Executive Committee Meeting, 4:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-10), Tape 41 (Miller Center); [continued](https://millercenter.org/the-presidency/secret-white-house-tapes/executive-committee-meeting-national-security-council-11), Tape 41A (Miller Center). [FRUS 1961–63, XI, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94). [FRUS 1961–63, X–XII, microfiche supp., doc. 437](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d437) (record of action, meeting no. 8). [[w.caro-passage-of-power]], 216–21; [[w.schlesinger-robert-kennedy-and-his]], 525 (Johnson, by Robert Kennedy''s memorandum of Nov. 15); [[w.sorensen-kennedy]], 713–14 (the flare-drop flight called off; the letter to U Thant; the Alaska U-2 ignored). To check: Robert Kennedy, memorandum dictated Nov. 15, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 525, the footnote). See [[cal.1962-10-16.missile-crisis]]. Names: Johnson, Robert Kennedy, Bundy, Dillon, Thompson, Kennedy, U Thant.'
    src:
      c: 00e98c5a
      rows:
