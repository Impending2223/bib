  - id: cal.1962-10-01.cuba
    when: Oct. 1
    date: '1962-10-01'
    thread: cuba
    also: [defense]
    c: 'McNamara orders Dennison, commander in chief of the Atlantic Fleet, "to be prepared to institute a blockade of Cuba." That evening Dennison to his fleet commanders: "maximum readiness to execute CINCLANT OPLAN 312 [an air strike] by October 20." A large amphibious exercise announced as cover.'
    n: '[[w.bird-color-of-truth]], 244. Names: McNamara, Dennison.'
