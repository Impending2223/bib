    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis-diplomacy
    c: 'Kennedy and Macmillan by telephone, 11 p.m. London: U Thant''s "cease fire" accepted by the Russians; Kennedy''s answer, Stevenson to discuss it with U Thant, "very ingenious"; fourteen ships turned round, one tanker let through. No end to the blockade on the Russians'' unsupported word.'
    n: '[[w.macmillan-diaries]], 512–13. See [[cal.1962-10-25.missile-crisis-4]]. Names: Kennedy, Macmillan, U Thant, Stevenson.'
    tags: [name:kennedy-john-f, name:macmillan-harold, name:u-thant, name:stevenson-adlai-e, polity:uk, polity:us, polity:ussr]
