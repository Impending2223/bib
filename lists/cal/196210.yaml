  - id: cal.1962-10-01.elections-1962
    when: Oct. 1
    date: '1962-10-01'
    thread: elections-1962
    also: [governors]
    c: 'San Francisco, before newspaper editors and publishers: Nixon and Brown''s one joint appearance. Braden, a publisher, asks of the Hughes Tool Company''s loan to Nixon''s family. Nixon: $205,000 lent his brother six years before, his mother''s property the security; "Governor Brown has a chance to stand up as a man and charge me with misconduct. Do it, sir!"'
    n: '[[w.nixon-rn]], 242–43. See [[cal.1962-06-05.elections-1962]]. Names: Nixon, Brown, Braden.'
    src:
      c: 245e3b0f
      rows:
        - 'w.nixon-rn 242–43: all'
    tags: [name:nixon-richard-m, name:brown-edmund-g, name:braden-thomas, state:ca]
  - id: cal.1962-10-01.mississippi-ole-miss-2
    when: Oct. 1
    date: '1962-10-01'
    time: 1962-10-01T04:14Z
    thread: mississippi-ole-miss
    c: 'Kennedy and Barnett by telephone, 12:14 and 1:45 a.m., the riot under way: the State police back. By Sorensen''s account, Kennedy: "Listen, Governor, somebody''s been shot down there already and it''s going to get worse. ... I want them back. Good-bye." Barnett agrees to send the two hundred troopers back.'
    n: '[Conversation with Ross Barnett, 12:14 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am), [cont.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am-cont); [1:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am), [cont.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am-cont) (Miller Center). [[w.sorensen-kennedy]], 486 (Kennedy''s words; Barnett''s agreement). See [[cal.1962-09-30.mississippi-ole-miss]]. Names: Kennedy, Barnett. Check: the quoted words against the recordings, not heard.'
    src:
      c: a1c78371
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-1214-am: A'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ross-barnett-145-am: A'
        - 'w.sorensen-kennedy 486: B, C'
    tags: [name:kennedy-john-f, name:barnett-ross-r]
