  - id: cal.1962-10-26.missile-crisis-diplomacy-2
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis-diplomacy
    c: 'The White House, Friday, outside O''Donnell''s office. Rusk has brought John Scali of ABC, with the proposal Fomin made him: the removal of the missiles and a pledge of no more offensive weapons in Cuba for a pledge not to invade. Salinger, finding them there, shouts at Scali, "What the hell are you doing here?"; Rusk: "It''s all right, Pierre. I brought him here." Kennedy hears the proposal and tells Scali to take back that it is acceptable as a basis for a settlement. "But don''t use my name. ... Give them the impression that you talked to me, but don''t say so. Tell them you''ve gotten a favorable response from the highest authority in the government."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 379–80 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 274–75 (Rusk brings Scali, with Fomin''s proposal, to the White House; Salinger, in agitation, in the back corridor near the Cabinet Room: "What the hell are you doing here?"; Kennedy instructs Scali to convey that it is an acceptable basis, without attributing it to him; not the words to Scali). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). See [[cal.1962-10-26.missile-crisis-2]]. Names: Rusk, Scali, Salinger, Kennedy, O''Donnell.'
