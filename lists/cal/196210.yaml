    c: 'Kennedy and Macmillan by telephone, after the address: the clandestine build-up would have unhinged Latin America and Berlin; no plan to invade Cuba; the object to get the missiles out; "attempting to begin the escalation in a way to prevent WW III." Macmillan for his support, and for a summit on disarmament.'
    n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 45](https://history.state.gov/historicaldocuments/frus1961-63v11/d45) (the President''s side only). [[w.sorensen-kennedy]], 705 (Macmillan phoned his support, with an interest in a summit on disarmament and an interim suspension on both sides); [[w.macmillan-diaries]], 510 (the call at 7:30 p.m. Washington, 11:30 p.m. GMT, the broadcast just over: Kennedy "rather excited, but very clear," grateful for the messages; forces built up for a coup de main to seize Cuba "shd that become necessary"; nothing of Berlin, the summit or World War III). Check: the hour. After the address: [[w.sorensen-kennedy]], 705. See [[cal.1962-10-22.missile-crisis-16]]. Names: Kennedy, Macmillan.'
