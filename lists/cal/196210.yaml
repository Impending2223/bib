    c: 'Stevenson to Kennedy, by letter, the day after the President briefed him: personal emissaries to Castro and Khrushchev; no disclosure yet that an attack is imminent. "To start or risk starting a nuclear war is bound to be divisive at best." The existence of nuclear missile bases anywhere to be made negotiable "before we start anything."'
