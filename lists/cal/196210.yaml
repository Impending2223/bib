  - id: cal.1962-10-23.missile-crisis-3
    when: Oct. 23
    date: '1962-10-23'
    time: 1962-10-23T22:51Z
    thread: missile-crisis-diplomacy
    follows:
      - cal.1962-10-23.missile-crisis-2
    c: 'Kennedy''s reply: the secret shipment of offensive weapons began it; prudence on both sides. Soviet ships to observe the quarantine, in force at 1400 Greenwich, Oct. 24.'
    n: 'FRUS 1961–63, VI, doc. [62](https://history.state.gov/historicaldocuments/frus1961-63v06/d62). The reply to [[cal.1962-10-23.missile-crisis-2]]. See [[cal.1962-10-16.missile-crisis]]. Made public: [[w.department-of-state-bulletin]], Nov. 19, 1973, 636. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1962-10-23.missile-crisis-4
    when: Oct. 23
    date: '1962-10-23'
    time: 1962-10-23T20:00Z
    thread: missile-crisis-diplomacy
    c: 'Stevenson to the Security Council from 4 p.m., his text finished as he speaks; the OAS resolution handed to him in the course of it. Kennedy wires him: "It has given our cause a great start."'
    n: '[[w.department-of-state-bulletin]], [Nov. 12, 1962, 723](https://archive.org/details/departmentofstat4762unit/page/723/mode/1up) (the statement of Oct. 23). [[w.schlesinger-thousand-days-1965]], 813–14. [[w.sorensen-kennedy]], 706. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson, Kennedy.'
    src:
      c: e1aa2a8a
      rows:
        - 'https://archive.org/details/departmentofstat4762unit/page/723/mode/1up: all'
