# Cal. XCVII December 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCVII
entries:
  - id: cal.1967-12-01.state-constitutions-pa
    when: Dec. 1
    date: '1967-12-01'
    thread: state-constitutions
    also: [legislatures]
    c: Harrisburg. Pennsylvania's constitutional convention opens in the House chamber, its delegates elected Nov. 7. Broderick, the lieutenant governor, its president (Check).
    n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention). Check: *Journal of the Constitutional Convention of the Commonwealth of Pennsylvania of 1967–1968*. See [[cal.1967-05-16.state-constitutions-pa]]. Names: Broderick.'
    tags: [state:pa, name:broderick-raymond-j]
  - id: cal.1967-12-04.king
    when: Dec. 4
    date: '1967-12-04'
    thread: king
    also: [poverty]
    c: 'Atlanta, Ebenezer Baptist Church. King announces the Poor People''s Campaign: the poor, black and white, to Washington from April, to stay until Congress and the President act on jobs and income; civil disobedience if need be. The SCLC''s staff had agreed on it at Frogmore, S.C., late November (Check).'
    n: '[[w.mcknight-last-crusade]]; [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]. See [[cal.1966-08-26.open-housing]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:ga, city:atlanta]
  - id: cal.1967-12-04.war-opposition
    when: Dec. 4–8
    date: '1967-12-04'
    thread: war-opposition
    also: [draft]
    c: 'Stop the Draft Week, New York. Dec. 5, at the Whitehall Street induction center before dawn: 264 arrested, Spock among them, by the *Times*''s count. Some 585 arrested in the week (Check).'
    n: '[[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Spock.'
    tags: [name:spock-benjamin, city:nyc, state:ny]
  - id: cal.1967-12-09.draft
    when: Dec. 9–13
    date: '1967-12-09'
    thread: draft
    also: [war-opposition, students]
    c: 'Hershey and Clark''s joint statement, Dec. 9, after Hershey''s letter of Oct. 26 to local boards: Justice to give priority to prosecuting those who unlawfully obstruct the draft (Check its terms). Dec. 11, after two hours with Clark, Hershey: a board may still reclassify a registrant who disrupts the system. Dec. 13, eight House Democrats ask Hershey''s resignation; Edward Kennedy offers a bill to leave such cases to the federal courts.'
    n: '[[w.foley-confronting-the-war-machine]]; [[w.flynn-draft-1940-1973]]; [[w.flynn-lewis-b-hershey-mr]]. See [[cal.1967-03-06.draft]]. Names: Hershey, Clark, Edward Kennedy.'
    tags: [name:hershey-lewis-b, name:clark-ramsey, name:kennedy-edward-m]
  - id: cal.1967-12-12.specials
    when: Dec. 12
    date: '1967-12-12'
    thread: specials
    also: [war-opposition]
    c: 'California 11th, special run-off. McCloskey (R), a lawyer of Portola Valley who ran against the war, takes the seat of Younger (R), who died June 20: 66,385; Archibald (D) 44,319; Shirley Temple Black, write-in, 4,064. The special primary, Nov. 14: McCloskey 52,882, Black 34,521, Draper (R) 19,566, Archibald 15,069; no majority.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 5, 1968, p. 8](https://archive.org/details/californiastate196668cali/page/n185). [[w.kabaservice-rule-and-ruin]]. See [[cal.1967-04-11.specials]]. Names: McCloskey, Younger, Shirley Temple Black.'
    tags: [special:1967-12-12-h-CA-11, name:mccloskey-paul-n-jr, name:younger-jesse-a, name:black-shirley-temple, state:ca]
  - id: cal.1967-12-12.europe-and-the-alliance
    when: Dec. 12–14
    date: '1967-12-12'
    thread: europe-and-the-alliance
    c: 'Brussels, the North Atlantic Council''s first ministerial meeting at its new seat. The Harmel report, "The Future Tasks of the Alliance," adopted: defense and détente together; a study of balanced force reductions. Rusk: results satisfactory, the meeting "partly overshadowed by Greek crisis." Dec. 12, Rusk with the British Foreign Secretary on Britain''s entry to the Common Market.'
    n: 'FRUS 1964–68, XIII, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v13/d280), [281](https://history.state.gov/historicaldocuments/frus1964-68v13/d281). [[w.haftendorn-nato-and-the-nuclear]]; [[w.wenger-crisis-and-opportunity]]; [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1966-12-14.europe-and-the-alliance]]. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1967-12-12.open-housing-milwaukee
    when: Dec. 12
    date: '1967-12-12'
    thread: open-housing
    also: [states-and-cities]
    c: Milwaukee. The Common Council passes an alderman's compromise open housing ordinance, modeled on the State's law of 1965, covering a third of the city's housing. Phillips's ordinance, covering all of it, still refused; the Youth Council's marches go on.
    n: '[Milwaukee Public Library, "200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches). Check: the Common Council''s *Proceedings*, Dec. 12, 1967. See [[cal.1967-08-28.open-housing-milwaukee]]. Names: Phillips.'
    tags: [state:wi, city:milwaukee, name:phillips-vel]
  - id: cal.1967-12-13.europe-and-the-alliance
    when: Dec. 13–14
    date: '1967-12-13'
    thread: europe-and-the-alliance
    c: 'Greece. Constantine moves against the junta: tells Talbot at Tatoi, Dec. 13, he will fly north to Kavala, take command of the armed forces and call for the government''s resignation; asks the President''s endorsement. The army stays with the junta; the King, his family and Kollias fly to Rome, Dec. 14. Papadopoulos Prime Minister; a regent named (Check).'
    n: 'FRUS 1964–68, XVI, docs. [344](https://history.state.gov/historicaldocuments/frus1964-68v16/d344), [349](https://history.state.gov/historicaldocuments/frus1964-68v16/d349). [[w.keeley-colonels-coup-and-the]]; [[w.miller-united-states-and-the]]. See [[cal.1967-04-21.europe-and-the-alliance]]. Names: Constantine, Talbot, Kollias, Papadopoulos.'
    tags: [name:constantine-ii, name:talbot-phillips, name:kollias-constantine, name:papadopoulos-george]
  - id: cal.1967-12-13.antisubversion
    when: Dec. 13
    date: '1967-12-13'
    thread: antisubversion
    also: [congress]
    c: 'The House adopts the conference report on the Subversive Activities Control Act amendments, [276–114](https://voteview.com/rollcall/RH0900240): registration, which the courts had struck down, dropped; the Board, on the Attorney General''s petition, to determine and publish which organizations are Communist-action or Communist-front and who are their members. Proxmire''s amendment, modified: the Board to expire unless proceedings are under way and reported to Congress by Jan. 10, 1969. Signed Jan. 2, 1968, [81 Stat. 765](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg765.pdf), without a statement (Check).'
    n: 'Statute (K–J Cong. II.J.2). [[w.goldstein-political-repression-in-modern]]. See [[cal.1967-10-23.antisubversion]]; [[cal.1965-11-15.court]]. Names: Proxmire.'
    tags: [name:proxmire-william]
  - id: cal.1967-12-13.open-housing-louisville
    when: Dec. 13
    date: '1967-12-13'
    thread: open-housing
    also: [mayors, elections-1967]
    c: 'Louisville. The Board of Aldermen, Democrats elected Nov. 7 on a promise to pass it, adopts an open housing ordinance, 9–3: a fine of $100 for refusing to sell or rent for race, religion or national origin; owner-occupied buildings of four units or fewer exempt. Mayor Schmied neither signs nor vetoes it; it takes effect without him.'
    n: 'Ordinance No. 4522, Series 1967 (a copy, [Ivan Allen Jr. mayoral records](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/2286)); [*Carolina Times*, Dec. 23, 1967](https://newspapers.digitalnc.org/lccn/sn83045120/1967-12-23/ed-1/seq-1/). Check: the date of the vote. See [[cal.1967-04-11.open-housing-louisville]]. Names: Schmied.'
    tags: [state:ky, city:louisville, name:schmied-kenneth-a]
  - id: cal.1967-12-14.consumers
    when: Dec. 14
    date: '1967-12-14'
    thread: consumers
    c: 'Flammable Fabrics Act amendments signed, [81 Stat. 568](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg568.pdf): standards extended from wearing apparel to household furnishings and other fabrics, set by Commerce; a study of burn injuries.'
    n: '[Remarks Upon Signing Bill Amending the Flammable Fabrics Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-amending-the-flammable-fabrics-act) (Dec. 14, 1967). [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-11-20.consumers]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-14.foreign-aid
    when: Dec. 14–15
    date: '1967-12-14'
    thread: foreign-aid
    c: 'Foreign aid appropriations. The House recommits the conference report, [196–185](https://voteview.com/rollcall/RH0900241), Dec. 14; adopts the second, [197–158](https://voteview.com/rollcall/RH0900242), Dec. 15: $2.296 billion (Check). Signed Jan. 2, 1968, [81 Stat. 936](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg936.pdf).'
    n: See [[cal.1967-11-08.foreign-aid]].
  - id: cal.1967-12-15.consumers
    when: Dec. 15
    date: '1967-12-15'
    thread: consumers
    also: [farm]
    c: 'Wholesome Meat Act signed, [81 Stat. 584](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg584.pdf): the States to inspect meat sold within their borders by standards "at least equal" to the federal within two years, the federal government paying up to half; failing that, federal inspection. The Senate had passed the stronger bill, [89–2](https://voteview.com/rollcall/RS0900276), Nov. 28; the House adopts the conference report, [336–28](https://voteview.com/rollcall/RH0900231), Dec. 6. Johnson reads an inspector''s report of July 1967 on a packing plant. Upton Sinclair, of *The Jungle*, at the signing.'
    n: '[Remarks Upon Signing Bill Amending the Meat Inspection Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-amending-the-meat-inspection-act) (Dec. 15, 1967); [Statement by the President on the Meat Inspection Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-the-meat-inspection-bill) (Dec. 5, 1967). [[w.nadel-politics-of-consumer-protection]]; [[w.mccarry-citizen-nader]]. Names: Sinclair, Johnson.'
    tags: [name:johnson-lyndon-b, name:sinclair-upton]
  - id: cal.1967-12-15.jobs-and-wages
    when: Dec. 15
    date: '1967-12-15'
    thread: jobs-and-wages
    c: 'Age Discrimination in Employment Act signed, [81 Stat. 602](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg602.pdf): no discrimination against workers 40 to 65 in hiring, discharge or terms of employment by employers of 25 or more, employment agencies and unions; enforced by Labor; in effect in 180 days.'
    n: '[Statement by the President After Signing the Age Discrimination in Employment Act of 1967](https://www.presidency.ucsb.edu/documents/statement-the-president-after-signing-the-age-discrimination-employment-act-1967) (Dec. 16, 1967). Statute (K–J Cong. II.J.2). [[w.friedman-your-time-will-come]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-15.congress
    when: Dec. 15
    date: '1967-12-15'
    thread: congress
    c: The 90th Congress's first session ends, Jan. 10–Dec. 15. No tax increase. The second session to open Jan. 15.
    n: '[[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-01-10.rules]].'
  - id: cal.1967-12-17.vietnam
    when: Dec. 17–31
    date: '1967-12-17'
    thread: vietnam
    c: 'Buttercup. Saigon, Dec. 17–18: Sau Hà, a prisoner, and the emissary Buttercup-2 sent back to the NLF with the American written reply to the cadre''s message, concealed in a notebook. Dec. 31, the emissary back: the other side "surprised and pleased" at the answer; the channel open. Nov. 29, Rusk to Bunker: Buttercup not to "shrivel up" for the South Vietnamese''s reluctance.'
    n: 'FRUS 1964–68, V, docs. [420](https://history.state.gov/historicaldocuments/frus1964-68v05/d420), [449](https://history.state.gov/historicaldocuments/frus1964-68v05/d449), [452](https://history.state.gov/historicaldocuments/frus1964-68v05/d452). [[w.herring-secret-diplomacy-of-the]]; [[w.brigham-guerrilla-diplomacy]]. Made public: FRUS 1964–68, V (2002). Names: Rusk, Bunker.'
    tags: [name:rusk-dean, name:bunker-ellsworth]
  - id: cal.1967-12-18.court
    when: Dec. 18
    date: '1967-12-18'
    thread: court
    also: [crime-and-hijacking]
    c: '*Katz v. United States*, [389 U.S. 347](https://tile.loc.gov/storage-services/service/ll/usrep/usrep389/usrep389347/usrep389347.pdf): the FBI''s device on the outside of a public telephone booth in Los Angeles, recording a bettor''s calls without a warrant, a search and seizure. Stewart for the Court, 7–1: "the Fourth Amendment protects people, not places"; *Olmstead*''s trespass rule no longer controls. Harlan concurring: a "reasonable" expectation of privacy. Black dissenting; Marshall took no part.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. Names: Stewart, Harlan, Black.'
    tags: [name:stewart-potter, name:harlan-john-marshall, name:black-hugo-l]
  - id: cal.1967-12-18.vietnam
    when: Dec. 18
    date: '1967-12-18'
    thread: vietnam
    c: 'Johnson''s memorandum for the file on McNamara''s of Nov. 1, after the written views of Rostow, Taylor, Fortas, Clifford, Rusk and McGeorge Bundy, and his talks with Bunker and Westmoreland. The bombing: strike the remaining targets of military worth, without excessive civilian casualties or American losses or a greater risk of drawing in the Soviet Union or China; restrikes; less drama. "A unilateral and unrequited bombing stand-down would be read in both Hanoi and the United States as a sign of weakening will." No announced stabilization; no increase above the approved level. Operations in the South reviewed to cut American casualties and turn over responsibility to the South Vietnamese.'
    n: 'FRUS 1964–68, V, doc. [441](https://history.state.gov/historicaldocuments/frus1964-68v05/d441). Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-01.vietnam]]. Names: McNamara, Rostow, Taylor, Fortas, Clifford, Rusk, Bundy, Bunker, Westmoreland, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rostow-walt-w, name:taylor-maxwell, name:fortas-abe, name:clifford-clark, name:rusk-dean, name:bundy-mcgeorge, name:bunker-ellsworth, name:westmoreland-william]
  - id: cal.1967-12-19.vietnam
    when: Dec. 19–24
    date: '1967-12-19'
    thread: vietnam
    also: [japan-and-korea]
    c: 'Holt lost swimming off Cheviot Beach, Victoria, Dec. 17. Johnson to his memorial service: Honolulu, Pago Pago, Canberra, Dec. 21; Melbourne, Dec. 22. At Canberra with Thiệu: his government ready to talk with individuals of the NLF, not with the Front as an organization; with Park, McEwen and Holyoake on more allied troops. Dec. 23: Khorat, Thailand; Cam Ranh Bay; Karachi, Ayub Khan; Rome, Saragat (Check), and the Vatican, Paul VI, with an aide-mémoire: "We would be willing to stop the bombing and proceed promptly to serious and productive discussions." Home Dec. 24. Before leaving, Dec. 19, the networks'' year-end interview.'
    n: '["A Conversation With the President"](https://www.presidency.ucsb.edu/documents/conversation-with-the-president-joint-interview-for-use-television-networks) (Dec. 19, 1967); [Joint Statement Following Discussions in Canberra With President Thieu of Vietnam](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-canberra-with-president-thieu-vietnam) (Dec. 21, 1967); [Statement by the President Following His Meeting at the Vatican With Pope Paul VI](https://www.presidency.ucsb.edu/documents/statement-the-president-following-his-meeting-the-vatican-with-pope-paul-vi) (Dec. 23, 1967). FRUS 1964–68, V, doc. [442](https://history.state.gov/historicaldocuments/frus1964-68v05/d442); XXVII, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v27/d34), [35](https://history.state.gov/historicaldocuments/frus1964-68v27/d35); XXIX, pt. 1, doc. [140](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d140); XXV, doc. [475](https://history.state.gov/historicaldocuments/frus1964-68v25/d475); XII, docs. [309](https://history.state.gov/historicaldocuments/frus1964-68v12/d309), [310](https://history.state.gov/historicaldocuments/frus1964-68v12/d310). [[w.dallek-flawed-giant]]; [[w.johnson-vantage-point]]; [[w.woods-lbj]]. Names: Holt, Nguyễn Văn Thiệu, Park, McEwen, Holyoake, Ayub Khan, Saragat, Paul VI, Johnson.'
    tags: [name:johnson-lyndon-b, name:holt-harold-e, name:nguyen-van-thieu, name:park-chung-hee, name:mcewen-john, name:holyoake-keith, name:ayub-khan-mohammad, name:saragat-giuseppe, name:paul-vi]
  - id: cal.1967-12-19.vietnam-2
    when: Dec. 19–20
    date: '1967-12-19'
    thread: vietnam
    c: 'Westmoreland to Wheeler: the enemy will attack along the borders to launch major attacks against South Vietnam for "a psychological and political victory"; Dec. 20, his forces near the borders have compelled Hanoi "to undertake an intensified country-wide effort, perhaps a maximum effort, over a relatively short period."'
    n: 'FRUS 1964–68, V, doc. [443](https://history.state.gov/historicaldocuments/frus1964-68v05/d443). [[w.wirtz-tet-offensive]]; [[w.oberdorfer-tet]]; [[w.cosmas-joint-chiefs-of-staff]]. Made public: FRUS 1964–68, V (2002). Names: Westmoreland, Wheeler.'
    tags: [name:westmoreland-william, name:wheeler-earle]
  - id: cal.1967-12-19.space
    when: Dec. 19
    date: '1967-12-19'
    thread: space
    also: [soviet-union]
    c: 'The General Assembly endorses the Agreement on the Rescue of Astronauts, the Return of Astronauts and the Return of Objects Launched into Outer Space, drafted in the Outer Space Committee: parties to notify, rescue and return astronauts who land on their territory or the high seas, and to return space objects on request.'
    n: '[Statement by the President on the United Nations Agreement for the Rescue and Return of Astronauts and Space Objects](https://www.presidency.ucsb.edu/documents/statement-the-president-the-united-nations-agreement-for-the-rescue-and-return-astronauts) (Dec. 19, 1967). See [[cal.1967-01-27.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-12-21.antisubversion-ca
    when: Dec. 21
    date: '1967-12-21'
    thread: antisubversion
    c: '*Vogel v. County of Los Angeles*, 68 Cal. 2d 18: the Supreme Court of California strikes the second paragraph of the public employee''s oath (the Levering Act''s, in the constitution since 1952), the disclaimer of membership in any party or organization advocating the overthrow of the government. The first paragraph, to support and defend the constitutions, stands.'
    n: '[Opinion](https://caselaw.findlaw.com/ca-supreme-court/1820877.html) (FindLaw). Check: the vote (6–1, Wikipedia). See [[cal.1962-11-06.antisubversion-ca]].'
    tags: [state:ca, city:los-angeles]
  - id: cal.1967-12-26.crime-and-hijacking-miami
    when: Dec. 26
    date: '1967-12-26'
    thread: crime-and-hijacking
    also: [civil-disorders]
    c: 'Miami. Police Chief Headley announces patrols of shotguns and dogs in the Negro districts against "young hoodlums": "When the looting starts, the shooting starts." "We don''t mind being accused of police brutality."'
    n: 'AP, "Big City Police Deciding to Be Tough on Rioters Next Summer," [*San Bernardino Sun*, Dec. 30, 1967](https://cdnc.ucr.edu/?a=d&d=SBS19671230.1.2). Check: the second quotation. [[w.dunn-black-miami-in-the]]. Names: Headley.'
    tags: [state:fl, city:miami, name:headley-walter-e]
  - id: cal.1967-12-27.crime-and-hijacking
    when: Dec. 27
    date: '1967-12-27'
    thread: crime-and-hijacking
    also: [states-and-cities]
    c: 'District of Columbia crime act signed, [81 Stat. 734](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg734.pdf), the Senate having passed it [67–9](https://voteview.com/rollcall/RS0900305): citations for misdemeanors; an antiriot law; a review of the District''s criminal code. Johnson objects to two provisions: minimum sentences, "a backward step"; three hours of questioning before an arrested person is taken to a judicial officer.'
    n: '[Statement by the President Upon Signing the District of Columbia Crime Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-district-columbia-crime-bill) (Dec. 27, 1967). [[w.clark-crime-in-america]]. See [[cal.1966-11-13.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, city:washington]
  - id: cal.1967-12-29.vietnam
    when: Dec. 29–Jan. 5
    date: '1967-12-29'
    thread: vietnam
    c: 'Nguyễn Duy Trinh at a reception for a Mongolian delegation, Dec. 29, broadcast by Radio Hanoi Jan. 1: after the United States unconditionally ends the bombing and other acts of war, "the DRV will talk" with it; before, talks "could" follow. Jan. 3, Mai Văn Bộ in Paris to Westinghouse Broadcasting: talks at once if the bombing stops (Check). Jan. 3, restrikes near Hanoi held off, for the Cambodian and Romanian channels. Jan. 5, Harriman with Macovescu, back from Hanoi, four hours: Packers.'
    n: 'FRUS 1964–68, V, doc. [451](https://history.state.gov/historicaldocuments/frus1964-68v05/d451); VI, docs. [3](https://history.state.gov/historicaldocuments/frus1964-68v06/d3), [4](https://history.state.gov/historicaldocuments/frus1964-68v06/d4), [5](https://history.state.gov/historicaldocuments/frus1964-68v06/d5). [[w.herring-secret-diplomacy-of-the]]; [[w.nguyen-hanois-war]]. See [[cal.1967-11-21.vietnam]]. Names: Nguyễn Duy Trinh, Mai Văn Bộ, Harriman, Macovescu.'
    tags: [name:nguyen-duy-trinh, name:mai-van-bo, name:harriman-w-averell, name:macovescu-gheorghe, name:johnson-lyndon-b]
  - id: cal.1967-12-30.africa
    when: Dec. 30–Jan. 11
    date: '1967-12-30'
    thread: africa
    c: 'Humphrey in Africa: Ivory Coast; Liberia, for Tubman''s inauguration; Ghana; the Congo; Zambia; Ethiopia; Somalia; Kenya; Tunisia. Thurgood Marshall and Marks of the USIA with him.'
    n: 'FRUS 1964–68, XXIV, doc. [231](https://history.state.gov/historicaldocuments/frus1964-68v24/d231). [[w.solberg-hubert-humphrey]]; [[w.lyons-keeping-africa-off-the]]. Names: Humphrey, Tubman, Marshall, Marks.'
    tags: [name:humphrey-hubert-h, name:tubman-william-v-s, name:marshall-thurgood, name:marks-leonard-h]
  - id: cal.1967-12.court-us
    when: Dec.
    date: 1967-12
    thread: court
    also: [states-and-cities, legislatures]
    c: 'Dirksen''s drive for a convention on apportionment, at the year''s end: 32 legislatures have applied since 1963, by the Article V Library''s count; 34 needed. New in 1967: Colorado, Illinois, Indiana, North Dakota.'
    n: 'The applications in 113 Cong. Rec. 6384, 8004, 11,175, 18,007 (1967), as the [Article V Library](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0) lists them (Check each against the Record). [[w.bonfield-dirksen-amendment-and-the]]; [[w.macneil-dirksen]]. See [[cal.1966-12.court-us]]. Names: Dirksen.'
    tags: [name:dirksen-everett, state:co, state:il, state:in, state:nd]
