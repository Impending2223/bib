        - 'via x.1968-10-01.mccarthys-notes-for-hill-on-the-back-of-hills-en: B'
    tags: [name:mccarthy-eugene-j, name:humphrey-hubert-h]
  - id: cal.1968-10-01.elections-1968-3
    when: Oct. 1
    date: '1968-10-01'
    thread: elections-1968-humphrey
    c: 'Johnson to Clifford on Humphrey''s speech at Salt Lake City, by Clifford''s account: "But he says he would stop the bombing without conditions." Clifford: we can live with it; the bombing halt tied to what follows, resumption reserved; do not attack the Vice President.'
    n: '[[w.clifford-counsel-to-the-president-2]], 572. See [[cal.1968-09-30.elections-1968]]. Names: Johnson, Clifford, Humphrey.'
    src:
      c: e4b0089d
      rows:
        - 'w.clifford-counsel-to-the-president-2 572: all'
    tags: [name:johnson-lyndon-b, name:clifford-clark, name:humphrey-hubert-h]
  - id: cal.1968-10-01.elections-1968-4
    when: Oct. 1
    date: '1968-10-01'
    thread: elections-1968-humphrey
    c: 'Nashville, the day after Salt Lake City. The hecklers gone; signs: "If You Mean It, We''re With You," "Stop the War—Humphrey, We Trust You." At Nashville and Knoxville Humphrey calls Wallace "a political plunger," "apostle of hate and racism"; of Nixon: "My Republican opponent ... appeals to the same fear, the same passions, the same frustrations."'
    n: '[[w.solberg-hubert-humphrey]], 386; [[w.humphrey-education-of-a-public-1976]], 403 (the signs, by his account). To check: the *New York Times*, Oct. 2 and 3, 1968; UPI bulletin, Oct. 2, 1968 (cited by [[w.solberg-hubert-humphrey]], 386, its note). See [[cal.1968-09-30.elections-1968]]. Check: the day at Knoxville. Names: Humphrey, Wallace, Nixon.'
    src:
      c: db8bc4c6
      rows:
        - 'w.solberg-hubert-humphrey 386: all'
        - 'w.humphrey-education-of-a-public-1976 403: A-B'
        - 'via w.solberg-hubert-humphrey 386 n.plunger: all'
    tags: [name:humphrey-hubert-h, name:wallace-george-c, name:nixon-richard-m, state:tn, city:nashville]
