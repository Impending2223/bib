# Cal. CVIII October 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CVIII
entries:
  - id: cal.1968-10-01.court
    when: Oct. 1
    date: '1968-10-01'
    thread: court-fortas
    also: [confirmations]
    c: Fortas. The Senate's debate on taking up the nomination, from Sept. 25; Griffin among its leaders. Cloture refused, [45–43](https://voteview.com/rollcall/RS0900570), two-thirds of those voting needed. Fortas asks Johnson the same day to withdraw his name.
    n: '[[w.shogan-question-of-judgment]]. See [[cal.1968-07-11.court]]. Names: Fortas, Griffin, Johnson.'
    tags: [name:fortas-abe, name:griffin-robert-p, name:johnson-lyndon-b]
  - id: cal.1968-10-01.antisubversion
    when: Oct. 1–4
    date: '1968-10-01'
    thread: antisubversion
    also: [war-opposition]
    c: 'House Un-American Activities Committee, a subcommittee under Ichord: hearings on subversive involvement in the disorders at the Democratic convention in Chicago. Rubin comes in costume, bandoliers and a toy rifle. Oct. 3, Abbie Hoffman arrested at the Capitol for wearing a shirt made of an American flag. Check the days and the costume.'
    n: 'Daily Digest, [114 Cong. Rec. D455](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=453), [114 Cong. Rec. D463](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=461), [114 Cong. Rec. D465](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=463). House Committee on Un-American Activities, *Subversive Involvement in Disruption of 1968 Democratic Party National Convention*, Hearings, 90th Cong., 2d Sess. (1968) (Check the title and parts). [[w.farber-chicago-68]]; [[w.wells-war-within]]. See [[cal.1966-08-16.students]]. Names: Ichord, Rubin, Hoffman.'
    tags: [name:ichord-richard-h-ii, name:rubin-jerry, name:hoffman-abbie, state:dc, city:washington]
  - id: cal.1968-10-01.states-and-cities-jacksonville
    when: Oct. 1
    date: '1968-10-01'
    thread: states-and-cities
    also: [mayors]
    c: Jacksonville and Duval County one government, by the charter Duval's voters approved Aug. 8, 1967, 54,493 to 29,768. Hans Tanzler, mayor of the old city from 1967, the consolidated city's first mayor.
    n: '[Wikipedia, "Jacksonville Consolidation"](https://en.wikipedia.org/wiki/Jacksonville_Consolidation). Check: the Supervisor of Elections'' returns of Aug. 8, 1967; the charter, Laws of Fla. 1967, ch. 67-1320. [[w.bartley-keeping-the-faith]]. See [[cal.1965-10-01.states-and-cities-jacksonville]]. Names: Tanzler.'
    tags: [state:fl, city:jacksonville, name:tanzler-hans-g-jr]
  - id: cal.1968-10-02.conservation
    when: Oct. 2
    date: '1968-10-02'
    thread: conservation
    c: 'Four bills signed: Redwood National Park, [82 Stat. 931](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg931.pdf); the National Wild and Scenic Rivers System, [82 Stat. 906](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg906-2.pdf); the National Trails System, [82 Stat. 919](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg919.pdf); North Cascades National Park, [82 Stat. 926](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg926.pdf). Johnson: 2,400,000 acres added to the National Park System since 1961; the redwoods rescued "from the chain saw." The House had agreed to the Redwood conference report, [329–1](https://voteview.com/rollcall/RH0900423), and passed the rivers bill, [268–7](https://voteview.com/rollcall/RH0900424), Sept. 12.'
    n: 'Remarks Upon Signing Four Bills Relating to Conservation and Outdoor Recreation, [1968–69 Pub. Papers 1000](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=310) (Oct. 2, 1968). Statute (K–J Cong. II.J.2). [[w.schrepfer-fight-to-save-the]]. See [[cal.1965-02-08.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-02.latin-america
    when: Oct. 2
    date: '1968-10-02'
    thread: latin-america
    c: 'Mexico City, the Plaza de las Tres Culturas at Tlatelolco. Troops and police fire on a student rally; the next morning''s papers, 20 to 28 dead, hundreds wounded, hundreds arrested (Check). The army had occupied the National University, Sept. 18. Oliver to Katzenbach, Oct. 3: "provocation by student extremists and gross over-reaction by the security forces." The CIA, Oct. 5: the demonstrations sparked by domestic politics, not by Cubans or Soviets. The Olympic Games open Oct. 12.'
    n: 'FRUS 1964–68, XXXI, docs. [363](https://history.state.gov/historicaldocuments/frus1964-68v31/d363), [364](https://history.state.gov/historicaldocuments/frus1964-68v31/d364), [365](https://history.state.gov/historicaldocuments/frus1964-68v31/d365). [National Security Archive, "The Tlatelolco Massacre"](https://nsarchive2.gwu.edu/NSAEBB/NSAEBB99/) (2003). [[w.poniatowska-la-noche-de-tlatelolco]]; [[w.kurlansky-1968]]. Made public: the National Security Archive''s collection (2003); FRUS 1964–68, XXXI (2004) (Check). Names: Oliver, Katzenbach.'
    tags: [name:oliver-covey-t, name:katzenbach-nicholas]
  - id: cal.1968-10-02.defense
    when: Oct. 2–3
    date: '1968-10-02'
    thread: defense
    c: Senate, the defense appropriation, H.R. 18707. Oct. 2, no funds in fiscal 1969 for producing and deploying the Sentinel antiballistic missile system, refused, [25–45](https://voteview.com/rollcall/RS0900572). Oct. 3, passed, [55–2](https://voteview.com/rollcall/RS0900581). The House had passed it Sept. 12, [333–7](https://voteview.com/rollcall/RH0900422).
    n: See [[cal.1967-09-18.defense]].
  - id: cal.1968-10-02.students-los-angeles
    when: Oct. 2
    date: '1968-10-02'
    thread: students
    c: 'Los Angeles. Thirty-five arrested at the Board of Education after an eight-day sit-in for Castro''s return to his classroom at Lincoln. The board returns him (Check: the date).'
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). See [[cal.1968-03-01.students-los-angeles]]. Names: Castro.'
    tags: [state:ca, city:los-angeles, name:castro-sal]
  - id: cal.1968-10-02.opinion
    when: Oct. 2
    date: '1968-10-02'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 19–24, the same poll by group. Non-whites: Humphrey 80 percent, Nixon 12. Catholics: Humphrey 40, Nixon 36, Wallace 16. Jews: Humphrey 51, Nixon 31. Manual workers: Nixon 34, Humphrey 33, Wallace 25. Those 21 to 29: Nixon 39, Humphrey 30, Wallace 25. Places under 2,500: Nixon 44, Wallace 27, Humphrey 22.'
    n: '[[w.gallup-poll]], III, 2162–64. Names: Humphrey, Nixon, Wallace.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c]
  - id: cal.1968-10-02.court-fortas
    when: Oct. 2
    date: '1968-10-02'
    thread: court-fortas
    also: [confirmations]
    c: 'Johnson withdraws Fortas''s nomination, "with deep regret": the Senate''s action "historically and constitutionally tragic"; let it be "no precedent." Thornberry''s nomination falls with it.'
    n: 'Statement by the President Upon Withdrawing the Nomination of Justice Abe Fortas as Chief Justice of the United States, [1968–69 Pub. Papers 1000](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=310) (Oct. 2, 1968). See [[cal.1968-07-11.court]]. Names: Fortas, Johnson, Thornberry.'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:thornberry-william-h]
  - id: cal.1968-10-02.testing-missile-talks
    when: Oct. 2
    date: '1968-10-02'
    thread: testing-missile-talks
    also: [soviet-union, vietnam]
    c: 'New York. Gromyko hands Rusk Moscow''s answer: basic principles for limiting and then reducing strategic arms to be set at the meeting; on Vietnam, nothing new.'
    n: 'FRUS 1964–68, XI, doc. [287](https://history.state.gov/historicaldocuments/frus1964-68v11/d287); XIV, doc. [307](https://history.state.gov/historicaldocuments/frus1964-68v14/d307). See [[cal.1968-09-09.soviet-union]]. Names: Gromyko, Rusk.'
    tags: [name:gromyko-andrei, name:rusk-dean]
  - id: cal.1968-10-03.desegregation-schools
    when: Oct. 3
    date: '1968-10-03'
    thread: desegregation-schools
    also: [congress]
    c: 'House, the Labor–HEW appropriation, H.R. 18037. The Senate''s forms of sections 409 and 410 accepted: no funds to force the busing of students, or a child''s attendance at a school against his parents'' choice, "in order to overcome racial imbalance" (section 409, [330–7](https://voteview.com/rollcall/RH0900458)); none to force busing or attendance as a condition of federal funds, likewise limited (section 410, [167–155](https://voteview.com/rollcall/RH0900459)). The House''s own form of 409, without "racial imbalance," refused, [167–176](https://voteview.com/rollcall/RH0900457). The conference report through the Senate, Oct. 9, [56–3](https://voteview.com/rollcall/RS0900592).'
    n: '[[w.orfield-reconstruction-of-southern-education]]. See [[cal.1968-05-27.desegregation-schools]].'
  - id: cal.1968-10-03.latin-america
    when: Oct. 3
    date: '1968-10-03'
    thread: latin-america-peru
    c: 'Lima, early in the morning. The army ousts Belaúnde and flies him to Buenos Aires; Velasco heads a Revolutionary Government; Congress closed. Rostow to Johnson: "Contrary to our latest intelligence assessments."'
    n: 'FRUS 1964–68, XXXI, docs. [509](https://history.state.gov/historicaldocuments/frus1964-68v31/d509), [511](https://history.state.gov/historicaldocuments/frus1964-68v31/d511). [[w.brands-latin-americas-cold-war]]; [[w.rabe-killing-zone]]. Names: Belaúnde, Velasco, Rostow, Johnson.'
    tags: [name:belaunde-terry-fernando, name:velasco-alvarado-juan, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1968-10-03.elections-1968
    when: Oct. 3
    date: '1968-10-03'
    thread: elections-1968
    c: 'Pittsburgh. Wallace names LeMay, retired Chief of Staff of the Air Force, his running mate. LeMay, at the news conference: "We seem to have a phobia about nuclear weapons" (Check the words). Wallace: LeMay would not use them in Vietnam. Oct. 13, the American Independent Party''s platform, released at San Francisco.'
    n: '[American Independent Party Platform of 1968](https://www.presidency.ucsb.edu/documents/american-independent-party-platform-1968) (Oct. 13, 1968). [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.kozak-lemay]]. See [[cal.1968-09-02.elections-1968]]. Names: Wallace, LeMay.'
    tags: [name:wallace-george-c, name:lemay-curtis-e, state:pa, city:pittsburgh]
  - id: cal.1968-10-03.defense-soviet-forces
    when: Oct. 3
    date: '1968-10-03'
    thread: defense-soviet-forces
    c: NIE 11-8-68, Soviet Strategic Attack Forces. About 900 operational ICBM launchers, to surpass the American force in numbers by 1970; a force goal of 1,100–1,500. About 700 medium and intermediate launchers. Six, perhaps seven, Y-class submarines of 16 tubes built.
    n: '[FRUS 1964–68, X, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v10/d217). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1964–68, X (2001).'
    tags: [name:helms-richard]
  - id: cal.1968-10-05.mayors-honolulu
    when: Oct. 5
    date: '1968-10-05'
    thread: mayors
    also: [elections-1968]
    c: 'Honolulu''s primaries for mayor, Blaisdell, mayor since 1955, running for the House. Democratic: Fasi, of the City Council, 44,034, 44.5 percent; Lemke 30,982, 31.3; two others. Republican: D. G. Anderson 20,704, 76.2. Nov. 5, Fasi elected over Anderson; Blaisdell beaten (Check: the figures).'
    n: '[*Primary Election, State of Hawaii, October 5, 1968*, final summary report](https://archive.org/download/HI-hist/1968_Primary.pdf); Check: the general election''s Oahu returns, [*Result of Votes Cast, General Election, November 5, 1968*](https://archive.org/download/HI-hist/1968_General.pdf). [[w.coffman-island-edge-of-america]]. Names: Blaisdell, Fasi, Lemke, Anderson.'
    tags: [state:hi, city:honolulu, name:blaisdell-neal-s, name:fasi-frank-f, name:lemke-herman-g-p, name:anderson-d-g]
  - id: cal.1968-10-06.opinion
    when: Oct. 6
    date: '1968-10-06'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 1–6: all bombing of the North stopped, and if after one or two months Hanoi has not begun to remove its soldiers from the South, a decision whether to bomb all of the North, the cities included: favor 48 percent, oppose 39 (54 and 33 in June). July 18–23, repeated: a candidate for turning more of the fighting over to the South Vietnamese and withdrawing some troops as of Jan. 1, 66 for, 18 against.'
    n: '[[w.gallup-poll]], III, 2164. See [[cal.1968-06-26.opinion]].'
  - id: cal.1968-10-06.vietnam-paris
    when: Oct. 6
    date: '1968-10-06'
    thread: vietnam-paris
    also: [soviet-union]
    c: 'New York. Rusk to Gromyko, alone, after dinner: let Moscow press Hanoi on Saigon''s presence at the talks.'
    n: 'FRUS 1964–68, XIV, doc. [310](https://history.state.gov/historicaldocuments/frus1964-68v14/d310). See [[cal.1968-09-07.vietnam]]. Names: Rusk, Gromyko.'
    tags: [name:rusk-dean, name:gromyko-andrei]
  - id: cal.1968-10-07.vietnam-paris
    when: Oct. 7
    date: '1968-10-07'
    thread: vietnam-paris
    also: [elections-1968]
    c: Rusk briefs Nixon; Nixon to Johnson by telephone the same afternoon.
    n: 'FRUS 1964–68, VII, doc. [53](https://history.state.gov/historicaldocuments/frus1964-68v07/d53). See [[cal.1968-09-07.vietnam]]. Names: Rusk, Nixon, Johnson.'
    tags: [name:rusk-dean, name:nixon-richard-m, name:johnson-lyndon-b]
  - id: cal.1968-10-08.space
    when: Oct. 8
    date: '1968-10-08'
    thread: space
    c: 'The Agreement on the Rescue of Astronauts, the Return of Astronauts and the Return of Objects Launched into Outer Space, [19 U.S.T. 7570](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-6/lltreaties-19-6.pdf#page=866), [672 U.N.T.S. 119](https://treaties.un.org/doc/Publication/UNTS/Volume%20672/volume-672-I-9574-English.pdf), signed at Washington, London and Moscow Apr. 22: the Senate consents, [66–0](https://voteview.com/rollcall/RS0900589).'
    n: See [[cal.1967-12-19.space]].
  - id: cal.1968-10-08.farm
    when: Oct. 8
    date: '1968-10-08'
    thread: farm
    also: [poverty]
    c: 'Food Stamp Act amendments signed, [82 Stat. 958](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg958.pdf): the program extended three years. Johnson: over 1,000 counties, more than 2.5 million people; 325 more counties have asked for it. The House had refused to bar strikers, [159–186](https://voteview.com/rollcall/RH0900448), and agreed to the conference report, [247–97](https://voteview.com/rollcall/RH0900449), Sept. 25.'
    n: 'Statement by the President Upon Signing Bill Extending the Food Stamp Program, [1968–69 Pub. Papers 1012](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=322) (Oct. 8, 1968). Statute (K–J Cong. II.J.2). [[w.kotz-let-them-eat-promises]]. See [[cal.1967-09-27.farm]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-08.press-and-broadcasting
    when: Oct. 8–9
    date: '1968-10-08'
    thread: press-and-broadcasting
    also: [elections-1968]
    c: 'House, S.J. Res. 175, suspending Section 315''s equal-time rule for the year''s presidential and vice-presidential candidates: an all-night session, the Republicans'' quorum calls; the motion to adjourn refused, [93–149](https://voteview.com/rollcall/RH0900467). Oct. 9, the debate limited to an hour, [162–111](https://voteview.com/rollcall/RH0900468); separate appearances in place of one program for all, refused, [112–204](https://voteview.com/rollcall/RH0900471); passed, [280–35](https://voteview.com/rollcall/RH0900472). The Senate does not take up the House''s version before adjournment; no debates (Check the Senate''s earlier passage).'
    n: '[[w.schroeder-presidential-debates]]. See [[cal.1964-08-18.elections-1964]].'
  - id: cal.1968-10-08.foreign-aid
    when: Oct. 8–9
    date: '1968-10-08'
    thread: foreign-aid
    also: [middle-east]
    c: 'Foreign Assistance Act of 1968 signed, Oct. 8, [82 Stat. 960](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg960.pdf). Johnson''s statement, Oct. 9: the request cut by almost $1 billion, "to the lowest level in the history of foreign aid"; the act "inadequate." Section 651, the sense of Congress that the President negotiate the sale of supersonic planes to Israel: "I am asking the Secretary of State to initiate negotiations with the Government of Israel." The House had agreed to the conference report, Sept. 19, [196–151](https://voteview.com/rollcall/RH0900442).'
    n: 'Statement by the President Upon Signing the Foreign Assistance Act of 1968, [1968–69 Pub. Papers 1017](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=327) (Oct. 9, 1968). FRUS 1964–68, XX, doc. [275](https://history.state.gov/historicaldocuments/frus1964-68v20/d275). Statute (K–J Cong. II.J.2). See [[cal.1968-01-07.middle-east]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-09.vietnam
    when: Oct. 9
    date: '1968-10-09'
    thread: vietnam-paris
    c: 'Paris. At the tea break, Harriman and Vance: Saigon''s place in the talks after a halt "utterly indispensable."'
    n: 'FRUS 1964–68, VII, doc. [54](https://history.state.gov/historicaldocuments/frus1964-68v07/d54). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance.'
    tags: [name:harriman-w-averell, name:vance-cyrus]
  - id: cal.1968-10-09.opinion
    when: Oct. 9
    date: '1968-10-09'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Sept. 19–24: an area within a mile where one would be afraid to walk at night: yes 35 percent, no 62. Men 19; women 50. Whites 35; Negroes 40. Central cities 49; suburbs 31; places under 2,500, 24.'
    n: '[[w.gallup-poll]], III, 2164–65.'
  - id: cal.1968-10-09.latin-america-peru
    when: Oct. 9
    date: '1968-10-09'
    thread: latin-america-peru
    c: Peru. The army takes the La Brea y Pariñas oil fields of the International Petroleum Company.
    n: 'Rusk to Johnson, Oct. 11: FRUS 1964–68, XXXI, doc. [515](https://history.state.gov/historicaldocuments/frus1964-68v31/d515). See [[cal.1968-10-03.latin-america]].'
  - id: cal.1968-10-10.court
    when: Oct. 10
    date: '1968-10-10'
    thread: court-fortas
    c: 'Johnson will send no other name for Chief Justice: "These are not ordinary times." Warren, willing to serve until a successor qualifies, to remain "until emotionalism subsides."'
    n: 'Statement by the President Upon Declining To Submit an Additional Nomination for the Office of Chief Justice of the United States, [1968–69 Pub. Papers 1024](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=334) (Oct. 10, 1968). See [[cal.1968-06-26.court]]. Names: Johnson, Warren.'
    tags: [name:johnson-lyndon-b, name:warren-earl]
  - id: cal.1968-10-10.opinion
    when: Oct. 10
    date: '1968-10-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 26–Oct. 1, the kind of President each would make. Nixon: excellent 9 percent, good 37, average 36, poor 13. Humphrey: 5, 25, 37 and 27. Wallace: 7, 15, 18 and 48.'
    n: '[[w.gallup-poll]], III, 2165. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-10-10.japan-and-korea-pueblo
    when: Oct. 10
    date: '1968-10-10'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the 23rd closed meeting: Pak''s paper on the release of the crew, with the publicity the North wants. Katzenbach to Johnson, undated: the "overwrite," explored since May 18 with Johnson''s authority: Woodward to write on the North Korean document of admission and apology that he acknowledges receipt of the crew, and sign that.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [317](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d317), [319](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d319). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-09-17.japan-and-korea]]. Names: Pak Chung Kuk, Katzenbach, Johnson, Woodward.'
    tags: [name:pak-chung-kuk, name:katzenbach-nicholas, name:johnson-lyndon-b, name:woodward-gilbert-h]
  - id: cal.1968-10-11.space
    when: Oct. 11
    date: '1968-10-11'
    thread: space-apollo
    c: 'Apollo 7, the first manned Apollo flight, from Cape Kennedy, Fla., on a Saturn IB: Schirra, Eisele and Cunningham, eleven days in earth orbit; the command and service module''s systems tested; the first live television from an American spacecraft. Webb had left NASA, Oct. 7; Paine acting Administrator.'
    n: 'Message to the Apollo 7 Astronauts, [1968–69 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=342) (Oct. 11, 1968). [[w.brooks-chariots-for-apollo]]; [[w.murray-apollo]]; [[w.chaikin-man-on-the-moon]]. See [[cal.1967-11-09.space]]. Names: Schirra, Eisele, Cunningham, Webb, Paine, Johnson.'
    tags: [name:schirra-walter-m-jr, name:eisele-donn-f, name:cunningham-r-walter, name:johnson-lyndon-b, name:webb-james-e, name:paine-thomas-o, state:fl]
  - id: cal.1968-10-11.latin-america
    when: Oct. 11
    date: '1968-10-11'
    thread: latin-america-panama
    c: Panama, at night. The National Guard takes over the government; Arias, inaugurated Oct. 1, takes refuge in the Canal Zone.
    n: 'FRUS 1964–68, XXXI, docs. [448](https://history.state.gov/historicaldocuments/frus1964-68v31/d448), [449](https://history.state.gov/historicaldocuments/frus1964-68v31/d449). [[w.jorden-panama-odyssey]]; [[w.lafeber-panama-canal]]. Names: Arias.'
    tags: [name:arias-madrid-arnulfo]
  - id: cal.1968-10-11.farm
    when: Oct. 11
    date: '1968-10-11'
    thread: farm
    c: The Food and Agriculture Act of 1965 extended a year, through 1970, [82 Stat. 996](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg996-2.pdf); its conference report through the House Sept. 25, [190–172](https://voteview.com/rollcall/RH0900447).
    n: 'Statement by the President Upon Signing Bill Extending the Food and Agriculture Act of 1965, [1968–69 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=342) (Oct. 11, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-07-31.farm]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-11.testing-npt
    when: Oct. 11
    date: '1968-10-11'
    thread: testing-npt
    c: 'Johnson on the nonproliferation treaty: "Now it is before our Senate for ratification"; the danger would multiply "as additional fingers were placed on nuclear triggers." The Senate does not take it up before it adjourns (Check).'
    n: 'Statement by the President Urging Ratification by the Senate of the Nuclear Nonproliferation Treaty, [1968–69 Pub. Papers 1029](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=339) (Oct. 11, 1968). See [[cal.1968-09-17.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-11.vietnam-paris
    when: Oct. 11
    date: '1968-10-11'
    thread: vietnam-paris
    c: 'Paris, at Sceaux, in private: Lê Đức Thọ''s two questions: would the bombing stop once Hanoi answered on Saigon''s participation, and would that answer be counted a condition? Vance, by telephone: "Tho then said if the U.S. gave a positive response, the DRV would give a positive response."'
    n: 'FRUS 1964–68, VII, doc. [58](https://history.state.gov/historicaldocuments/frus1964-68v07/d58). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Lê Đức Thọ, Vance.'
    tags: [name:le-duc-tho, name:vance-cyrus]
  - id: cal.1968-10-12.vietnam
    when: Oct. 12
    date: '1968-10-12'
    thread: vietnam
    also: [war-opposition]
    c: 'Greencastle, Ind., at DePauw University: McGeorge Bundy, Johnson''s Special Assistant until 1966, for an unconditional halt to the bombing and the withdrawal of substantial American forces beginning in 1969 (Check the place).'
    n: 'FRUS 1964–68, VII, doc. [63](https://history.state.gov/historicaldocuments/frus1964-68v07/d63). *New York Times*, [Oct. 13, 1968](https://timesmachine.nytimes.com/timesmachine/1968/10/13/issue.html). [[w.bird-color-of-truth]]. Names: Bundy, Johnson.'
    tags: [name:bundy-mcgeorge, state:in, name:johnson-lyndon-b]
  - id: cal.1968-10-12.vietnam-paris
    when: Oct. 12
    date: '1968-10-12'
    thread: vietnam-paris
    c: 'Paris. Oberemko to Vance, urgently, the same as Thọ. Bunker and Abrams: Hanoi shifting its main effort "from the battlefield to the conference table."'
    n: 'FRUS 1964–68, VII, docs. [60](https://history.state.gov/historicaldocuments/frus1964-68v07/d60), [61](https://history.state.gov/historicaldocuments/frus1964-68v07/d61). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Oberemko, Vance, Lê Đức Thọ, Bunker, Abrams.'
    tags: [name:oberemko-valentin, name:vance-cyrus, name:le-duc-tho, name:bunker-ellsworth, name:abrams-creighton]
  - id: cal.1968-10-13.opinion
    when: Oct. 13
    date: '1968-10-13'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 1–6, Sept. 19–24 and Sept. 26–Oct. 1 together, a profile of Wallace''s support. The North: Nixon 47 percent, Humphrey 31, Wallace 14. The Border States: Nixon 37, Wallace 33, Humphrey 24. The Deep South: Wallace 52, Nixon 20, Humphrey 20. For Wallace, the South and outside it: in all 39 and 14; men 44 and 18; women 33 and 10; the college-educated 23 and 7. Sept. 1–6, rating Wallace highly favorable: Southern whites 46; Northern whites 15; non-whites 6.'
    n: '[[w.gallup-poll]], III, 2165–66. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-10-13.vietnam-paris
    when: Oct. 13
    date: '1968-10-13'
    thread: vietnam-paris
    c: Saigon. Thiệu concurs in the instructions to Harriman and Vance.
    n: 'FRUS 1964–68, VII, doc. [64](https://history.state.gov/historicaldocuments/frus1964-68v07/d64). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Nguyễn Văn Thiệu, Harriman, Vance.'
    tags: [name:nguyen-van-thieu, name:harriman-w-averell, name:vance-cyrus, place:saigon]
  - id: cal.1968-10-14.congress
    when: Oct. 14
    date: '1968-10-14'
    thread: congress
    c: 'The 90th Congress''s second session ends, adjourned sine die: the House at 2 p.m., the Senate at 2:17. The last roll calls, Oct. 10 in the Senate, Oct. 11 in the House.'
    n: '[114 Cong. Rec. 31373](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-2.pdf#page=63) (House), [31309](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt24/pdf/GPO-CRECB-1968-pt24-3-1.pdf#page=58) (Senate), Oct. 14, 1968. See [[cal.1968-01-15.congress]].'
    tags: [appropriations:90-2]
  - id: cal.1968-10-14.vietnam
    when: Oct. 14
    date: '1968-10-14'
    thread: vietnam-paris
    c: 'Johnson with Rusk, Clifford, Wheeler, Taylor, Helms and Rostow: Wheeler agrees with Abrams, no military objection. Instructions to Harriman and Vance: the bombing to stop if Hanoi agrees "to begin serious talks the next day" with Saigon on the American side; the DMZ and the cities as before.'
    n: 'FRUS 1964–68, VII, docs. [65](https://history.state.gov/historicaldocuments/frus1964-68v07/d65), [68](https://history.state.gov/historicaldocuments/frus1964-68v07/d68), [74](https://history.state.gov/historicaldocuments/frus1964-68v07/d74). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Johnson, Rusk, Clifford, Wheeler, Taylor, Helms, Rostow, Abrams, Harriman, Vance.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:wheeler-earle, name:taylor-maxwell, name:helms-richard, name:rostow-walt-w, name:abrams-creighton, name:harriman-w-averell, name:vance-cyrus]
  - id: cal.1968-10-14.states-and-cities-nyc
    when: Oct. 14
    date: '1968-10-14'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: New York City. The teachers' third strike, the union's teachers kept from Ocean Hill's classrooms.
    n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike). See [[cal.1968-09-09.states-and-cities-nyc]]. Names: Shanker.'
    tags: [state:ny, city:nyc, name:shanker-albert]
  - id: cal.1968-10-14.latin-america-panama
    when: Oct. 14
    date: '1968-10-14'
    thread: latin-america-panama
    c: 'Rostow to Johnson on Panama: no bloodshed that could threaten the canal the first concern; Arias denied the Zone''s radio.'
    n: 'FRUS 1964–68, XXXI, doc. [451](https://history.state.gov/historicaldocuments/frus1964-68v31/d451). See [[cal.1968-10-11.latin-america]]. Names: Rostow, Johnson, Arias.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:arias-madrid-arnulfo]
  - id: cal.1968-10-15.court
    when: Oct. 15
    date: '1968-10-15'
    thread: court
    also: [elections-1968]
    c: '*Williams v. Rhodes*, [393 U.S. 23](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393023/usrep393023.pdf): Ohio''s laws keeping new parties off the presidential ballot, petitions of 15 percent of the last vote for governor among them, deny equal protection. The American Independent Party on the ballot, under an order of September; the Socialist Labor Party, too late, not (Check). Six to three. Argued Oct. 7, the October Term''s opening day (Check).'
    n: See [[cal.1968-10-03.elections-1968]].
    tags: [state:oh]
  - id: cal.1968-10-16.school-aid
    when: Oct. 16
    date: '1968-10-16'
    thread: school-aid
    also: [students]
    c: 'Higher Education Amendments of 1968 signed, [82 Stat. 1014](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg1014.pdf), and the Vocational Education Amendments of 1968, [82 Stat. 1064](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg1064.pdf). Johnson: "education laws numbers 59 and 60 since the beginning of this administration." Aid to be denied to students convicted of, or found to have taken part in, serious campus disruption (Check the section). The Senate had agreed to the vocational conference report, Oct. 2, [58–11](https://voteview.com/rollcall/RS0900571).'
    n: 'Remarks Upon Signing Two Education Bills, [1968–69 Pub. Papers 1038](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=348) (Oct. 16, 1968). Statute (K–J Cong. II.J.2). See [[cal.1965-11-08.school-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-16.black-nationalism
    when: Oct. 16–18
    date: '1968-10-16'
    thread: black-nationalism
    c: 'Mexico City, the Olympic Stadium. Tommie Smith, first in the 200 meters, and John Carlos, third, on the stand for the anthem, each with a black-gloved fist raised; both with the badges of the Olympic Project for Human Rights, as does the Australian second. Brundage''s International Olympic Committee demands their suspension; the United States Olympic Committee suspends them and sends them home (Check the day). Johnson to the team, Oct. 30: "In victory--and in defeat--you brought new honor to our country."'
    n: 'Statement by the President Congratulating Members of the United States Olympic Team, [1968–69 Pub. Papers 1099](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=409) (Oct. 30, 1968). [[w.edwards-revolt-of-the-black]]; [[w.hartmann-race-culture-and-the]]. Names: Tommie Smith, Carlos, Brundage, Johnson.'
    tags: [name:smith-tommie, name:carlos-john, name:brundage-avery, name:johnson-lyndon-b]
  - id: cal.1968-10-16.soviet-union
    when: Oct. 16
    date: '1968-10-16'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: Prague. Kosygin and the Czechoslovak government sign a treaty on the "temporary stay" of Soviet forces in Czechoslovakia (Check the day).
    n: 'FRUS 1964–68, XVII, doc. [96](https://history.state.gov/historicaldocuments/frus1964-68v17/d96) (Beam from Prague, Oct. 26). [[w.williams-prague-spring-and-its]]; [[w.valenta-soviet-intervention-in-czechoslovakia]]. See [[cal.1968-08-20.soviet-union]]. Names: Kosygin.'
    tags: [name:kosygin-aleksei]
  - id: cal.1968-10-16.vietnam-paris
    when: Oct. 16
    date: '1968-10-16'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'Saigon''s Foreign Minister tells the troop-contributing countries a cessation is under consideration. Johnson, by conference call, to Humphrey, Nixon and Wallace, 11:41 a.m.: "our position ... today is exactly what it was the last time all three of you were briefed." Christian: no basic change, no breakthrough.'
    n: '[Johnson, Humphrey, Nixon and Wallace, 11:41 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-conference-call-richard-nixon-george-wallace), Conversation WH6810-04-13547 (Miller Center). FRUS 1964–68, VII, docs. [75](https://history.state.gov/historicaldocuments/frus1964-68v07/d75), [80](https://history.state.gov/historicaldocuments/frus1964-68v07/d80). The President''s News Conference, [1968–69 Pub. Papers 1063](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=373) (Oct. 24, 1968) (Christian''s statement; Check the day). See [[cal.1968-09-07.vietnam]]. Names: Johnson, Humphrey, Nixon, Wallace, Christian.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:christian-george, place:saigon]
  - id: cal.1968-10-17.vietnam-paris
    when: Oct. 17
    date: '1968-10-17'
    thread: vietnam-paris
    c: 'Paris. Vance to Xuân Thủy: a date certain for the meeting; Thủy: in Hanoi some call it "reciprocity."'
    n: 'FRUS 1964–68, VII, docs. [83](https://history.state.gov/historicaldocuments/frus1964-68v07/d83), [84](https://history.state.gov/historicaldocuments/frus1964-68v07/d84). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Vance, Xuân Thủy.'
    tags: [name:vance-cyrus, name:xuan-thuy]
  - id: cal.1968-10-18.consumers
    when: Oct. 18
    date: '1968-10-18'
    thread: consumers
    also: [health]
    c: 'Radiation Control for Health and Safety Act signed, [82 Stat. 1173](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg1173.pdf): standards for the radiation from television sets, X-ray machines and other electronic products. Johnson: his twentieth consumer measure, "the last consumer measure" he will sign as President.'
    n: 'Remarks Upon Signing the Radiation Control for Health and Safety Act of 1968, [1968–69 Pub. Papers 1050](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=360) (Oct. 18, 1968). Statute (K–J Cong. II.J.2). [[w.nadel-politics-of-consumer-protection]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-18.vietnam
    when: Oct. 18
    date: '1968-10-18'
    thread: vietnam-paris
    c: 'Saigon balks. Thiệu instructs Bùi Diễm and Lâm: if the NLF takes part "as a separate entity," the GVN will not.'
    n: 'FRUS 1964–68, VII, docs. [87](https://history.state.gov/historicaldocuments/frus1964-68v07/d87), [89](https://history.state.gov/historicaldocuments/frus1964-68v07/d89). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Nguyễn Văn Thiệu, Bùi Diễm, Phạm Đăng Lâm.'
    tags: [name:nguyen-van-thieu, name:bui-diem, name:pham-dang-lam, place:saigon]
  - id: cal.1968-10-18.space
    when: Oct. 18
    date: '1968-10-18'
    thread: space
    c: Johnson ratifies the astronauts' rescue agreement, [19 U.S.T. 7570](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-19-6/lltreaties-19-6.pdf#page=866), [672 U.N.T.S. 119](https://treaties.un.org/doc/Publication/UNTS/Volume%20672/volume-672-I-9574-English.pdf). Ratifications deposited and in force Dec. 3.
    n: 'See [[cal.1968-10-08.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-18.soviet-union-czechoslovakia
    when: Oct. 18
    date: '1968-10-18'
    thread: soviet-union-czechoslovakia
    c: Prague. The National Assembly ratifies the treaty on the stay of Soviet forces (Check the day).
    n: See [[cal.1968-10-16.soviet-union]].
  - id: cal.1968-10-18.soviet-union
    when: Oct. 18
    date: '1968-10-18'
    thread: soviet-union
    also: [europe-and-the-alliance]
    c: 'Belgrade: Katzenbach with Tito; Johnson''s "continuing interest in Yugoslavia''s independence, sovereignty and economic development," made public Oct. 14.'
    n: 'FRUS 1964–68, XVII, doc. [196](https://history.state.gov/historicaldocuments/frus1964-68v17/d196). See [[cal.1968-08-30.soviet-union-czechoslovakia]]. Names: Katzenbach, Tito, Johnson.'
    tags: [name:katzenbach-nicholas, name:tito-josip-broz, name:johnson-lyndon-b]
  - id: cal.1968-10-19.vietnam-paris
    when: Oct. 19
    date: '1968-10-19'
    thread: vietnam-paris
    also: [soviet-union]
    c: 'Dobrynin to Rusk: Moscow "actively assisting."'
    n: 'FRUS 1964–68, VII, doc. [92](https://history.state.gov/historicaldocuments/frus1964-68v07/d92). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-18.vietnam]]. Names: Dobrynin, Rusk.'
    tags: [name:dobrynin-anatoly, name:rusk-dean]
  - id: cal.1968-10-21.latin-america-panama
    when: Oct. 21
    date: '1968-10-21'
    thread: latin-america-panama
    c: Panama. Arias still in the Zone, refusing to leave; Torrijos, of the Guard, presses for help in getting him out; recognition of the junta to be decided.
    n: 'FRUS 1964–68, XXXI, doc. [452](https://history.state.gov/historicaldocuments/frus1964-68v31/d452). See [[cal.1968-10-11.latin-america]]. Names: Arias, Torrijos.'
    tags: [name:arias-madrid-arnulfo, name:torrijos-herrera-omar-efrain]
  - id: cal.1968-10-22.elections-1968
    when: Oct. 22
    date: '1968-10-22'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Haldeman''s notes of Nixon''s instructions, by telephone (Check): "Keep Anna Chennault working on SVN"; and "Any other way to monkey wrench it? Anything RN can do" (Check the words).'
    n: 'H. R. Haldeman''s notes, Oct. 22, 1968, Nixon Presidential Library (Check the file). Made public: John A. Farrell, "Nixon''s Vietnam Blockade," *New York Times*, Dec. 31, 2016 (Check the date); [[w.farrell-richard-nixon]]. See [[cal.1968-07-12.elections-1968]]. Names: Haldeman, Nixon, Chennault.'
    tags: [name:haldeman-h-r, name:nixon-richard-m, name:chennault-anna]
  - id: cal.1968-10-22.crime-and-hijacking
    when: Oct. 22
    date: '1968-10-22'
    thread: crime-and-hijacking
    c: 'Gun Control Act of 1968 signed, [82 Stat. 1213](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg1213-2.pdf): the interstate mail-order sale of rifles, shotguns, handguns and ammunition stopped; no sales to minors, felons, drug addicts or the mentally incompetent; destructive devices taxed and registered; the import of surplus military weapons stopped (Check the terms). The conference report through both houses Oct. 10, the House''s [161–129](https://voteview.com/rollcall/RH0900473). Johnson, Oct. 11: no registration of guns, no licensing of owners; "the voices of the gun lobby prevailed for the moment." Executive Order 11432, the same day, on the control of arms imports.'
    n: 'Statement by the President on the Gun Control Bill, [1968–69 Pub. Papers 1029](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=339) (Oct. 11, 1968); Remarks Upon Signing the Gun Control Act of 1968, [1968–69 Pub. Papers 1059](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=369) (Oct. 22, 1968); [Executive Order 11432](https://www.presidency.ucsb.edu/documents/executive-order-11432-control-arms-imports) (Oct. 22, 1968). Statute (K–J Cong. II.J.2). See [[cal.1968-09-16.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-22.middle-east
    when: Oct. 22
    date: '1968-10-22'
    thread: middle-east
    also: [testing-npt]
    c: 'Eban at the White House. Johnson: his decision on the Phantoms made in principle in January; not a formal condition, but Eban should know the government''s "very strong feelings" on Israel''s signing the nonproliferation treaty; Clifford''s concern at Israel''s surface-to-surface missiles.'
    n: 'FRUS 1964–68, XX, doc. [284](https://history.state.gov/historicaldocuments/frus1964-68v20/d284). [[w.cohen-israel-and-the-bomb]]; [[w.ben-zvi-lyndon-b-johnson-and]]. Made public: FRUS 1964–68, XX (2001) (Check). See [[cal.1968-01-07.middle-east]]. Names: Eban, Johnson, Clifford.'
    tags: [name:eban-abba-s, name:johnson-lyndon-b, name:clifford-clark]
  - id: cal.1968-10-22.latin-america-peru
    when: Oct. 22
    date: '1968-10-22'
    thread: latin-america-peru
    c: 'At lunch, Rusk on Peru: "This is the 62nd coup I''ve lived through since I''ve been Secretary of State"; Johnson: "Recognize him as soon as you want to."'
    n: 'FRUS 1964–68, XXXI, docs. [518](https://history.state.gov/historicaldocuments/frus1964-68v31/d518), [519](https://history.state.gov/historicaldocuments/frus1964-68v31/d519). See [[cal.1968-10-03.latin-america]]. Names: Rusk, Johnson.'
    tags: [name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-10-22.space-apollo
    when: Oct. 22
    date: '1968-10-22'
    thread: space-apollo
    c: 'Apollo 7 down in the Atlantic. Johnson by telephone: "we have only our fingertip on the latch."'
    n: 'Remarks by Telephone to the Apollo 7 Astronauts Following Their Return, [1968–69 Pub. Papers 1058](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=368) (Oct. 22, 1968). See [[cal.1968-10-11.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-10-23.elections-1968
    when: Oct. 23
    date: '1968-10-23'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Bùi Diễm cables Saigon the advice of Nixon''s campaign: refuse to attend the expanded talks; the cable intercepted. A tip, by way of Eugene Rostow, from a New York banker: the Nixon camp means to block the deal (Check the day). Johnson has the FBI watch Chennault and the South Vietnamese embassy (Check the day).'
    n: 'FRUS 1964–68, VII, doc. [144](https://history.state.gov/historicaldocuments/frus1964-68v07/d144) (Thiệu''s talks, Oct. 23–25, from the CIA). Rostow''s file "South Vietnam and U.S. Policies" (the "X" envelope), LBJ Library. Made public: in part, [[w.white-making-of-the-president-1969]]; [[w.safire-before-the-fall]]; [[w.diem-in-the-jaws-of]]; the "X" envelope, opened at the LBJ Library in 1994 (Check); [[w.hughes-chasing-shadows]]. See [[cal.1968-10-22.elections-1968]]. Names: Bùi Diễm, Nixon, Eugene Rostow, Johnson, Chennault.'
    tags: [name:bui-diem, name:nixon-richard-m, name:rostow-eugene, name:johnson-lyndon-b, name:chennault-anna]
  - id: cal.1968-10-23.middle-east
    when: Oct. 23
    date: '1968-10-23'
    thread: middle-east
    c: 'Johnson to Eshkol: "real peace is not found alone on the walls of a fortress--or under the umbrella of air power--or behind a nuclear shield."'
    n: 'FRUS 1964–68, XX, doc. [285](https://history.state.gov/historicaldocuments/frus1964-68v20/d285). See [[cal.1968-10-22.middle-east]]. Names: Johnson, Eshkol.'
    tags: [name:johnson-lyndon-b, name:eshkol-levi]
  - id: cal.1968-10-23.japan-and-korea-pueblo
    when: Oct. 23
    date: '1968-10-23'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom: Pak calls the American proposal a "petty stratagem."'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [321](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d321). See [[cal.1968-09-17.japan-and-korea]]. Names: Pak Chung Kuk.'
    tags: [name:pak-chung-kuk]
  - id: cal.1968-10-23.vietnam-paris
    when: Oct. 23
    date: '1968-10-23'
    thread: vietnam-paris
    c: Saigon. Bunker with Thiệu and Kỳ on "our side–your side."
    n: 'FRUS 1964–68, VII, doc. [114](https://history.state.gov/historicaldocuments/frus1964-68v07/d114). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-18.vietnam]]. Names: Bunker, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    tags: [name:bunker-ellsworth, name:nguyen-van-thieu, name:nguyen-cao-ky, place:saigon]
  - id: cal.1968-10-24.opinion
    when: Oct. 24
    date: '1968-10-24'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Oct. 17–22, a secret ballot: Nixon 44 percent, Humphrey 36, Wallace 15, undecided 5. South: Wallace 42, Nixon 27, Humphrey 26. Midwest: Nixon 50, Humphrey 26, Wallace 17.'
    n: '[[w.gallup-poll]], III, 2167. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-10-25.latin-america-peru
    when: Oct. 25
    date: '1968-10-25'
    thread: latin-america-peru
    c: Relations with Peru resumed.
    n: FRUS 1964–68, XXXI, doc. [520](https://history.state.gov/historicaldocuments/frus1964-68v31/d520). See [[cal.1968-10-03.latin-america]].
  - id: cal.1968-10-25.vietnam-paris
    when: Oct. 25
    date: '1968-10-25'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'At the White House, Taylor on the draft minute: "This looks like a phony to me." Johnson: "That old dog won''t hunt." Nixon: he does not believe that a halt now would be "a cynical, last-minute attempt" to elect Humphrey (Check the words).'
    n: 'FRUS 1964–68, VII, doc. [121](https://history.state.gov/historicaldocuments/frus1964-68v07/d121). *New York Times*, [Oct. 26, 1968](https://timesmachine.nytimes.com/timesmachine/1968/10/26/issue.html). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-18.vietnam]]. Names: Taylor, Johnson, Nixon, Humphrey.'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-10-27.vietnam-paris
    when: Oct. 27
    date: '1968-10-27'
    thread: vietnam-paris
    c: 'Paris: Hanoi agrees to a first meeting some three days after the halt; Vance: "We have now got everything we have asked for." Rusk, that evening: "I smell Vodka and Caviar in it."'
    n: 'FRUS 1964–68, VII, docs. [128](https://history.state.gov/historicaldocuments/frus1964-68v07/d128), [129](https://history.state.gov/historicaldocuments/frus1964-68v07/d129). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Vance, Rusk.'
    tags: [name:vance-cyrus, name:rusk-dean]
  - id: cal.1968-10-27.elections-1968-chennault
    when: Oct. 27
    date: '1968-10-27'
    thread: elections-1968-chennault
    also: [vietnam]
    c: Bùi Diễm cables Saigon again the advice of Nixon's campaign; the cable intercepted.
    n: 'FRUS 1964–68, VII, doc. [145](https://history.state.gov/historicaldocuments/frus1964-68v07/d145), n. 2 (Rostow to Johnson, Oct. 29). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-23.elections-1968]]. Names: Bùi Diễm, Nixon.'
    tags: [name:bui-diem, name:nixon-richard-m]
  - id: cal.1968-10-29.elections-1968
    when: Oct. 29
    date: '1968-10-29'
    thread: elections-1968
    c: McCarthy will vote for Humphrey; he will not run for the Senate as a Democrat in 1970, nor for the presidential nomination in 1972 (Check the words).
    n: '*New York Times*, [Oct. 30, 1968](https://timesmachine.nytimes.com/timesmachine/1968/10/30/issue.html). [[w.eisele-almost-to-the-presidency]]. See [[cal.1968-09-02.elections-1968]]. Names: McCarthy, Humphrey.'
    tags: [name:mccarthy-eugene-j, name:humphrey-hubert-h]
  - id: cal.1968-10-29.vietnam
    when: Oct. 29
    date: '1968-10-29'
    thread: vietnam-paris
    c: '2:30 a.m., the Cabinet Room: Abrams, called home from Saigon, with Johnson, Rusk, Clifford, Wheeler, Taylor, Helms and Rostow: the halt, in his judgment, no added danger to American forces. Saigon: Thiệu, with his National Security Council, will not go to the Nov. 2 meeting on the terms agreed; the halt held a day.'
    n: 'FRUS 1964–68, VII, docs. [140](https://history.state.gov/historicaldocuments/frus1964-68v07/d140), [149](https://history.state.gov/historicaldocuments/frus1964-68v07/d149), [150](https://history.state.gov/historicaldocuments/frus1964-68v07/d150). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Abrams, Johnson, Rusk, Clifford, Wheeler, Taylor, Helms, Rostow, Nguyễn Văn Thiệu.'
    tags: [name:abrams-creighton, name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:wheeler-earle, name:taylor-maxwell, name:helms-richard, name:rostow-walt-w, name:nguyen-van-thieu, place:saigon]
  - id: cal.1968-10-29.elections-1968-chennault
    when: Oct. 29
    date: '1968-10-29'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Walt Rostow to Johnson: "There is no hard evidence that Mr. Nixon himself is involved"; the materials "so explosive that they could gravely damage the country whether Mr. Nixon is elected or not."'
    n: 'FRUS 1964–68, VII, doc. [145](https://history.state.gov/historicaldocuments/frus1964-68v07/d145). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-10-23.elections-1968]]. Names: Walt Rostow, Johnson, Nixon.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1968-10-30.japan-and-korea
    when: Oct. 30
    date: '1968-10-30'
    thread: korea
    c: Some 120 North Korean commandos land on the east coast of South Korea, at Ulchin and Samcheok (Check the number and the days).
    n: FRUS 1964–68, XXIX, pt. 1, doc. [323](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d323) (Check whether it treats the landings). [[w.lerner-pueblo-incident]]. See [[cal.1968-01-23.japan-and-korea]].
  - id: cal.1968-10-30.opinion
    when: Oct. 30
    date: '1968-10-30'
    thread: opinion
    also: [elections-1968-polls, economy]
    c: 'Gallup, Oct. 17–22, the party more likely to keep the United States out of World War III: Republican 37 percent, Democratic 24. To keep the country prosperous: Republican 34, Democratic 37. To keep prices down in the next four years: Republican 40, Democratic 24.'
    n: '[[w.gallup-poll]], III, 2167.'
  - id: cal.1968-10-30.vietnam-paris
    when: Oct. 30–31
    date: '1968-10-30'
    thread: vietnam-paris
    c: 'Lâu: Hanoi will do without the agreed secret minute. Johnson with his advisers on the hour of the halt and of its announcement. Paris, 1:30 a.m., Oct. 31: Harriman and Vance tell Thủy and Lâu the President will order the halt that evening, the meeting Nov. 6.'
    n: 'FRUS 1964–68, VII, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v07/d153), [156](https://history.state.gov/historicaldocuments/frus1964-68v07/d156), [158](https://history.state.gov/historicaldocuments/frus1964-68v07/d158). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Hà Văn Lâu, Harriman, Vance, Xuân Thủy, Johnson.'
    tags: [name:ha-van-lau, name:harriman-w-averell, name:vance-cyrus, name:xuan-thuy, name:johnson-lyndon-b]
  - id: cal.1968-10-31.vietnam
    when: Oct. 31
    date: '1968-10-31'
    thread: vietnam-paris
    also: [elections-1968]
    c: 'Address to the nation, 8 p.m.: "all air, naval, and artillery bombardment of North Vietnam" to cease at 8 a.m., Washington time, Nov. 1. The Paris meeting of Nov. 6 one "at which the representatives of the Government of South Vietnam are free to participate"; the NLF to be present, "in no way" recognized. "We cannot have productive talks in an atmosphere where the cities are being shelled and where the demilitarized zone is being abused." Johnson had told Humphrey, Nixon and Wallace by conference call, 6:05 p.m. Bunker to Thiệu: the President "had decided that he must go ahead."'
    n: 'The President''s Address to the Nation Upon Announcing His Decision To Halt the Bombing of North Vietnam, [1968–69 Pub. Papers 1099](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=409) (Oct. 31, 1968). FRUS 1964–68, VII, docs. [164](https://history.state.gov/historicaldocuments/frus1964-68v07/d164) (Johnson to Kosygin), [166](https://history.state.gov/historicaldocuments/frus1964-68v07/d166), [167](https://history.state.gov/historicaldocuments/frus1964-68v07/d167), [169](https://history.state.gov/historicaldocuments/frus1964-68v07/d169), [170](https://history.state.gov/historicaldocuments/frus1964-68v07/d170). [[w.johnson-vantage-point]]; [[w.clifford-counsel-to-the-president-2]]; [[w.frankum-like-rolling-thunder]], 64. See [[cal.1968-05-13.vietnam]]. Names: Johnson, Humphrey, Nixon, Wallace, Bunker, Nguyễn Văn Thiệu.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:bunker-ellsworth, name:nguyen-van-thieu]
  - id: cal.1968-10-31.japan-and-korea-pueblo
    when: Oct. 31
    date: '1968-10-31'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom. Pak: a settlement depends on the United States signing the document of Sept. 30.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [323](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d323). See [[cal.1968-09-17.japan-and-korea]]. Names: Pak Chung Kuk.'
    tags: [name:pak-chung-kuk]
