  - id: cal.1968-10-01.antisubversion
    when: Oct. 1–4
    date: '1968-10-01'
    thread: antisubversion
    also: [war-opposition]
    c: 'House Un-American Activities Committee, a subcommittee under Ichord: hearings on subversive involvement in the disorders at the Democratic convention in Chicago. Rubin comes in costume, bandoliers and a toy rifle. Oct. 3, Abbie Hoffman arrested at the Capitol for wearing a shirt made of an American flag. Check the days and the costume.'
    n: 'Daily Digest, [114 Cong. Rec. D455](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=453), [114 Cong. Rec. D463](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=461), [114 Cong. Rec. D465](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=463). House Committee on Un-American Activities, *Subversive Involvement in Disruption of 1968 Democratic Party National Convention*, Hearings, 90th Cong., 2d Sess. (1968) (Check the title and parts). To check: [[w.farber-chicago-68]]; [[w.wells-war-within]]. See [[cal.1966-08-16.students]]. Names: Ichord, Rubin, Hoffman.'
    tags: [name:ichord-richard-h-ii, name:rubin-jerry, name:hoffman-abbie, state:dc, city:washington]
  - id: cal.1968-10-01.states-and-cities-jacksonville
    when: Oct. 1
    date: '1968-10-01'
    thread: states-and-cities
    also: [mayors]
    c: Jacksonville and Duval County one government, by the charter Duval's voters approved Aug. 8, 1967, 54,493 to 29,768, 64.7 percent. Hans Tanzler, mayor of the old city from 1967, the consolidated city's first mayor.
    n: '[Wikipedia, "Jacksonville Consolidation"](https://en.wikipedia.org/wiki/Jacksonville_Consolidation). Check: the Supervisor of Elections'' returns of Aug. 8, 1967; the charter, Laws of Fla. 1967, ch. 67–1320. To check: [[w.bartley-keeping-the-faith]]. See [[cal.1965-10-01.states-and-cities-jacksonville]]. Names: Tanzler.'
    tags: [state:fl, city:jacksonville, name:tanzler-hans-g-jr]
    short: Jacksonville consolidated
  - id: cal.1968-10-01.elections-1968
    when: Oct. 1
    date: '1968-10-01'
    thread: elections-1968-wallace
    c: 'Wallace leaves Chicago for Grand Rapids, Mich., then Kalamazoo, Lansing and Flint: he claims the whole South and the border States, 170 electoral votes.'
    n: '[[w.chester-american-melodrama]], 668, 692. Names: Wallace.'
    src:
      c: ac9fa8ca
      rows:
        - 'w.chester-american-melodrama 668, 692: all'
    tags: [name:wallace-george-c, state:mi]
  - id: cal.1968-10-01.elections-1968-2
    when: Oct. 1
    date: '1968-10-01'
    thread: elections-1968-mccarthy
    c: The day after Salt Lake City. McCarthy, who calls Humphrey's new position no move at all, has Eller telephone Hill, from his notes on the back of Hill's letter, the conditions on which Humphrey could earn his endorsement.
    n: '[[w.chester-american-melodrama]], 742. To check: Gerald Hill to McCarthy, letter, September 1968 (cited by [[w.chester-american-melodrama]], 742); McCarthy''s notes for Hill on the back of Hill''s envelope, Oct. 1, 1968 (cited by [[w.chester-american-melodrama]], 742). See [[cal.1968-09-30.elections-1968]]. Names: McCarthy, Humphrey.'
    src:
      c: 5d425f71
      rows:
        - 'w.chester-american-melodrama 742: all'
