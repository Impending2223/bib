  - id: cal.1968-10-05.mayors-honolulu
    when: Oct. 5
    date: '1968-10-05'
    thread: mayors
    also: [elections-1968]
    c: 'Honolulu''s primaries for mayor, Blaisdell, mayor since 1955, running for the House. Democratic: Fasi, of the City Council, over Lemke, 44,034 to 30,982, 44.5 percent; Kaapu 12,567, 12.7 percent; one other. Republican: D. G. Anderson, 20,704, 76.2 percent, over one other. Nov. 5, Fasi elected over Anderson; Blaisdell beaten (Check: the figures).'
    n: '[*Primary Election, State of Hawaii, October 5, 1968*, final summary report](https://archive.org/download/HI-hist/1968_Primary.pdf); Check: the general election''s Oahu returns, [*Result of Votes Cast, General Election, November 5, 1968*](https://archive.org/download/HI-hist/1968_General.pdf). Check: the Republican runner-up''s count. To check: [[w.coffman-island-edge-of-america]]. Names: Blaisdell, Fasi, Lemke, Anderson.'
    tags: [state:hi, city:honolulu, name:blaisdell-neal-s, name:fasi-frank-f, name:lemke-herman-g-p, name:anderson-d-g]
    short: Fasi at Honolulu
  - id: cal.1968-10-05.democratic-party
    when: Oct. 5–6
    date: '1968-10-05'
