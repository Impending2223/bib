    tags: [name:le-duc-tho, name:xuan-thuy, name:johnson-lyndon-b, place:hanoi]
  - id: cal.1968-10-03.vietnam-paris-2
    when: Oct. 3
    date: '1968-10-03'
    time: 1968-10-03T13:00Z
    thread: vietnam-paris
    c: 'Vance with Johnson in his bedroom, 9 to 10:30 a.m., Rostow present: optimistic; Hanoi may think its bargaining power declining and wish to settle sooner. Johnson skeptical; his three points: Saigon in the talks after a cessation, the DMZ, the cities; the whole government to agree on resuming the bombing if they are violated. Vance agrees.'
    n: '[FRUS 1964–68, VII, doc. 49](https://history.state.gov/historicaldocuments/frus1964-68v07/d49) (Rostow''s memorandum for the record). [[w.johnson-vantage-point]], 515. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Vance, Johnson, Rostow.'
