    time: 1968-10-22T15:50Z
    thread: crime-and-hijacking
    c: 'Gun Control Act of 1968 signed, [82 Stat. 1213](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg1213-2.pdf): the interstate mail-order sale of rifles, shotguns, handguns and ammunition stopped; no sales to minors, felons, drug addicts or the mentally incompetent; destructive devices taxed and registered; the import of surplus military weapons stopped (Check the terms). The conference report through both houses Oct. 10, the House''s [161–129](https://voteview.com/rollcall/RH0900473). Johnson, Oct. 11: no registration of guns, no licensing of owners; "the voices of the gun lobby prevailed for the moment." Executive Order 11432, the same day, on the control of arms imports.'
    n: 'Statement by the President on the Gun Control Bill, [1968–69 Pub. Papers 1029](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=339) (Oct. 11, 1968); Remarks Upon Signing the Gun Control Act of 1968, [1968–69 Pub. Papers 1059](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=369) (Oct. 22, 1968); [Executive Order 11432](https://www.presidency.ucsb.edu/documents/executive-order-11432-control-arms-imports) (Oct. 22, 1968). Statute (K–J Cong. II.J.2). [[w.califano-triumph-and-tragedy-of]], 304–05 (licensing and registration lost in Judiciary on a tie; "the voices of a powerful lobby"; the pen to Alan Barth of the Post the next day). See [[cal.1968-09-16.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
