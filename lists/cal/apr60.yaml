entries:
  - id: cal.1960-04.economy
    when: Apr.
    date: 1960-04
    thread: economy
    c: The business cycle's peak, as the National Bureau later dated it. The recession of 1960–61 begins.
    n: '[NBER business-cycle chronology](https://www.nber.org/research/business-cycle-dating). Trough: [[cal.1961-02.economy]]. See [[cal.1960-03.economy]].'
  - id: cal.1960-04.elections-1960
    when: Apr.
    date: 1960-04
    thread: elections-1960
    c: West Virginia, after Wisconsin; its primary May 10. Kennedy's own poll there, 70–30 for him in December, now 60–40 for Humphrey. Franklin D. Roosevelt, Jr., campaigns for Kennedy.
    n: 'Check the poll''s figures. [[w.fleming-kennedy-vs-humphrey-west]]; [[w.white-making-of-the-president]]. See [[cal.1960-03.elections-1960]]. Names: Kennedy (Viet. III.A); Humphrey (K–J Adm. III.D).'
    tags: [name:kennedy-john-f, name:humphrey-hubert-h, name:roosevelt-franklin-d-jr]
  - id: cal.1960-04-01.space
    when: Apr. 1
    date: '1960-04-01'
    thread: space
    c: Tiros I launched from Cape Canaveral, Fla. The first weather satellite; television pictures of the clouds.
    n: '[Statement by the President on the Launching of Satellite Tiros I](https://www.presidency.ucsb.edu/documents/statement-the-president-the-launching-satellite-tiros-i) (Apr. 1, 1960). [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]].'
  - id: cal.1960-04-05.elections-1960
    when: Apr. 5
    date: '1960-04-05'
    thread: elections-1960
    c: 'Wisconsin primary. Republican: Nixon, unopposed. Democratic: Kennedy 56.5 percent, Humphrey 43.5.'
    n: 'CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey (K–J Adm. III.D); Kennedy (Viet. III.A); Nixon (Opp. III.E).'
    tags: [primary:1960-04-05, name:humphrey-hubert-h, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-04-08.voting-rights
    when: Apr. 8
    date: '1960-04-08'
    thread: voting-rights
    c: Senate passes H.R. 8601 as amended, [71–18](https://voteview.com/rollcall/RS0860284), the Senators of nine southern States against. Court-appointed voting referees; federal election records kept; obstruction of court orders and flight after a bombing made crimes. Judiciary's version taken up Mar. 30, [71–17](https://voteview.com/rollcall/RS0860269); Javits's equal job opportunity commission tabled on Dirksen's motion, Apr. 1, [48–38](https://voteview.com/rollcall/RS0860272).
    n: 'See [[cal.1960-02-15.voting-rights]]. Names: Javits (K–J Cong. III.E); Dirksen (Opp. III.A).'
    tags: [name:javits-jacob-k, name:dirksen-everett]
  - id: cal.1960-04-11.japan-and-korea
    when: Apr. 11–19
    date: '1960-04-11'
    thread: japan-and-korea
    c: 'Masan, Apr. 11: the body of a student missing since Mar. 15 taken from the harbor; riots again. Seoul, Apr. 19: university and high-school students march on the government; police fire into the crowds; martial law, and an army division released by the UN Command. Herter hands the Korean Ambassador an aide-mémoire: the elections and the violence a matter of American concern.'
    n: FRUS 1958–60, XVIII, docs. [295](https://history.state.gov/historicaldocuments/frus1958-60v18/d295), [296](https://history.state.gov/historicaldocuments/frus1958-60v18/d296), [298](https://history.state.gov/historicaldocuments/frus1958-60v18/d298), [299](https://history.state.gov/historicaldocuments/frus1958-60v18/d299), [301](https://history.state.gov/historicaldocuments/frus1958-60v18/d301) (Herter and Eisenhower by telephone), [302](https://history.state.gov/historicaldocuments/frus1958-60v18/d302) (the aide-mémoire). See [[cal.1960-03-15.japan-and-korea]].
    tags: [name:herter-christian-a]
  - id: cal.1960-04-12.elections-1960
    when: Apr. 12
    date: '1960-04-12'
    thread: elections-1960
    c: 'Illinois primary. Republican: Nixon 99.9 percent, others (write-in) 0.1. Democratic: Kennedy (write-in) 64.6 percent, Stevenson (write-in) 15.1.'
    n: 'CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Stevenson (K–J Adm. III.E).'
    tags: [primary:1960-04-12, name:kennedy-john-f, name:nixon-richard-m, name:stevenson-adlai-e]
  - id: cal.1960-04-15.civil-rights-organizations
    when: Apr. 15–17
    date: '1960-04-15'
    thread: civil-rights-organizations
    also: [sit-ins]
    c: Easter weekend at Shaw University, Raleigh. The sit-ins' student leaders, called by Ella Baker of SCLC with SCLC's money. King and James Lawson speak. A Temporary Student Nonviolent Coordinating Committee formed, apart from SCLC.
    n: '[[w.carson-in-struggle]]; [[w.zinn-sncc]]; [[w.ransby-ella-baker-and-the]]; [[w.hogan-many-minds-one-heart]]; [[w.morris-origins-of-the-civil]]; [[w.halberstam-children]]; [[w.branch-parting-the-waters]]. SNCC Digital Gateway (K–J Cong. II.L). Names: Baker, King (K–J Cong. III.H); Lawson (K–J Cong. III.K).'
    tags: [name:baker-ella, name:king-martin-luther-jr, name:lawson-james-m-jr]
  - id: cal.1960-04-19.elections-1960
    when: Apr. 19
    date: '1960-04-19'
    thread: elections-1960
    c: 'New Jersey primary. Republican: unpledged delegates, unopposed. Democratic: unpledged delegates, unopposed.'
    n: CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]].
    tags: [primary:1960-04-19]
  - id: cal.1960-04-19.sit-ins
    when: Apr. 19
    date: '1960-04-19'
    thread: sit-ins
    c: Nashville. Z. Alexander Looby's house bombed before dawn; he and his wife unhurt. Some thousands march in silence to City Hall. Mayor Ben West, asked by Diane Nash, says the lunch counters should be desegregated.
    n: '[[w.halberstam-children]]. See [[cal.1960-02-01.sit-ins]]. Names: Nash (K–J Cong. III.H); Looby (K–J Cong. III.K); West (K–J Cong. III.K).'
    tags: [name:nash-diane, name:looby-z-alexander, name:west-ben]
  - id: cal.1960-04-21.voting-rights
    when: Apr. 21
    date: '1960-04-21'
    thread: voting-rights
    c: House agrees to the Senate's amendments to H.R. 8601, [288–95](https://voteview.com/rollcall/RH0860106). To the President.
    n: See [[cal.1960-02-15.voting-rights]].
  - id: cal.1960-04-21.elections-1960
    when: Apr. 21
    date: '1960-04-21'
    thread: elections-1960
    c: 'Kennedy to the American Society of Newspaper Editors, Washington, on the religious issue: "I am not the Catholic candidate for President."'
    n: 'The text: JFK Library, Pre-Presidential Papers. Check the wording. [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.white-making-of-the-president]]; [[w.sorensen-kennedy]]. Names: Kennedy (Viet. III.A).'
    tags: [name:kennedy-john-f]
  - id: cal.1960-04-21.foreign-aid
    when: Apr. 21–28
    date: '1960-04-21'
    thread: foreign-aid
    c: 'House passes the Mutual Security authorization, H.R. 11510, [243–131](https://voteview.com/rollcall/RH0860107). Senate, on S. 3058, Apr. 28: Douglas''s amendment for free navigation of international waterways, aimed at the UAR''s closing of Suez to Israeli ships, [45–25](https://voteview.com/rollcall/RS0860292); Church''s $1.8 billion ceiling on military aid refused, [27–32](https://voteview.com/rollcall/RS0860294).'
    n: '[[w.kaufman-trade-and-aid]]; [[w.ruttan-united-states-development-assistance]]. Names: Douglas, Church (K–J Cong. III.B).'
    tags: [name:douglas-paul-h, name:church-frank]
  - id: cal.1960-04-22.europe-and-the-alliance
    when: Apr. 22–26
    date: '1960-04-22'
    thread: europe-and-the-alliance
    also: [berlin-and-vienna]
    c: 'De Gaulle''s state visit. At Camp David, Apr. 24: the summit''s procedure agreed, disarmament its main subject; de Gaulle to write Khrushchev. Address to a joint meeting of Congress, Apr. 25. Khrushchev at Baku the same day: the Soviet demands on Germany and Berlin restated.'
    n: '[Joint Statement Following Discussions With President de Gaulle](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-de-gaulle-0) (Apr. 25, 1960). FRUS 1958–60, VII, pt. 2, docs. [166](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d166), [168](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d168), [169](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d169), [170](https://history.state.gov/historicaldocuments/frus1958-60v07p2/d170). [[w.gaulle-memoires-despoir]]; [[w.jackson-de-gaulle]]; [[w.eisenhower-white-house-years]]. See [[cal.1960-03-15.berlin-and-vienna]]. Names: de Gaulle, Khrushchev (K–J Adm. III.J); Eisenhower (Opp. III.E).'
    tags: [name:de-gaulle-charles, name:khrushchev-nikita-s, name:eisenhower-dwight-d]
  - id: cal.1960-04-24.laos
    when: Apr. 24–26
    date: '1960-04-24'
    thread: laos
    c: Laos elects its Assembly. The CDNI and the government's candidates sweep; no Neo Lao Hak Xat candidate near a seat. Reports of the Army rigging the count in districts. State, Apr. 26, concerned at "indications elections have been so rigged as to invalidate them in eyes of world opinion."
    n: FRUS 1958–60, XVI, docs. [334](https://history.state.gov/historicaldocuments/frus1958-60v16/d334), [336](https://history.state.gov/historicaldocuments/frus1958-60v16/d336), [337](https://history.state.gov/historicaldocuments/frus1958-60v16/d337), [338](https://history.state.gov/historicaldocuments/frus1958-60v16/d338) (Dulles to the NSC, Apr. 28). [[w.rust-before-the-quagmire]]; [[w.jacobs-universe-unraveling]]; [[w.dommen-conflict-in-laos]]; [[w.fall-anatomy-of-a-crisis]]; [[w.stevenson-end-of-nowhere]].
  - id: cal.1960-04-26.japan-and-korea
    when: Apr. 26–28
    date: '1960-04-26'
    thread: japan-and-korea
    c: 'Seoul, Apr. 26: crowds in the streets; McConaughy and Magruder call on Rhee; he says he will step down if the people wish. The Assembly, unanimous, asks his resignation and new elections. Apr. 27: Rhee resigns; Huh Chung acting President. Apr. 28: Yi Ki-pung and his family dead by their own hands.'
    n: FRUS 1958–60, XVIII, docs. [308](https://history.state.gov/historicaldocuments/frus1958-60v18/d308), [309](https://history.state.gov/historicaldocuments/frus1958-60v18/d309), [310](https://history.state.gov/historicaldocuments/frus1958-60v18/d310), [313](https://history.state.gov/historicaldocuments/frus1958-60v18/d313). [The President's News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-241) (Apr. 27, 1960). See [[cal.1960-03-15.japan-and-korea]].
    tags: [name:mcconaughy-walter-p-jr, name:magruder-carter-b, name:rhee-syngman, name:huh-chung, name:yi-ki-pung]
  - id: cal.1960-04-26.vietnam
    when: Apr. 26
    date: '1960-04-26'
    thread: vietnam
    c: 'Eighteen former ministers and notables, Trần Văn Văn and Phan Khắc Sửu among them, meet at the Caravelle Hotel in Saigon and petition Diệm: corruption, one-party rule, liberties denied; reform asked. Released to the press days later.'
    n: 'FRUS 1958–60, I, docs. [142](https://history.state.gov/historicaldocuments/frus1958-60v01/d142), [149](https://history.state.gov/historicaldocuments/frus1958-60v01/d149) (Fishel to Diệm), [150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150). [[w.catton-diems-final-failure]]; [[w.miller-misalliance]]; [[w.jacobs-cold-war-mandarin]]. Names: Diệm (Viet. III.G).'
    tags: [name:tran-van-van, name:phan-khac-suu, name:ngo-dinh-diem]
  - id: cal.1960-04-26.elections-1960
    when: Apr. 26
    date: '1960-04-26'
    thread: elections-1960
    c: 'Primaries in Massachusetts and Pennsylvania. Republican: Nixon (write-in) in Massachusetts; Nixon in Pennsylvania. Democratic: Kennedy (write-in) in Massachusetts and Pennsylvania.'
    n: 'CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E).'
    tags: [primary:1960-04-26, name:kennedy-john-f, name:nixon-richard-m]
