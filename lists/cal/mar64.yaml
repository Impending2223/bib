# Cal. XLVI March 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLVI
entries:
  - id: cal.1964-03-04.crime-and-hijacking
    when: Mar. 4
    date: '1964-03-04'
    thread: crime-and-hijacking
    also: [robert-kennedy]
    c: 'Chattanooga. A federal jury convicts Hoffa, with three others, of tampering with the jury at his 1962 Nashville trial. Sentenced Mar. 12: eight years and $10,000. The government''s witness a Teamsters official in Hoffa''s company at Nashville.'
    n: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf) (1966) (affirmed; the informer''s testimony admitted). Navasky, *Kennedy Justice*; Goldfarb, *Perfect Villains, Imperfect Heroes* (K–J Adm. II.E). Sloane, *Hoffa* (K–J Cong. II.I.4). Kennedy, *The Enemy Within* (K–J Adm. II.G.1). See [[cal.1961-09-13.crime-and-hijacking]]. Names: Hoffa (K–J Cong. III.I).'
    tags: [name:hoffa-james-r, name:kennedy-robert-f]
  - id: cal.1964-03-04.europe-and-the-alliance
    when: Mar. 4
    date: '1964-03-04'
    thread: europe-and-the-alliance
    c: 'Cyprus. The Security Council, unanimous, recommends a UN peacekeeping force and a mediator; Greek and Turkish Cypriots fighting since December. Johnson: "a major step toward peace." Mar. 12, NSAM 286: American airlift, free, for the troops of contributors who cannot carry their own. The same day Turkey warns Makarios it will move if the attacks on Turkish Cypriots go on.'
    n: '[S.C. Res. 186](https://docs.un.org/S/RES/186%281964%29) (Mar. 4, 1964). [Statement by the President following Adoption of the Security Council Resolution on Cyprus](https://www.presidency.ucsb.edu/documents/statement-the-president-following-adoption-the-security-council-resolution-cyprus) (Mar. 4, 1964). FRUS 1964–68, XVI, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v16/d21), [25](https://history.state.gov/historicaldocuments/frus1964-68v16/d25), [26](https://history.state.gov/historicaldocuments/frus1964-68v16/d26). Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). See [[cal.1963-12-28.europe-and-the-alliance]].'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:makarios-iii]
  - id: cal.1964-03-04.opinion
    when: Mar. 4
    date: '1964-03-04'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Jan. 30–Feb. 4: the party to keep the country prosperous: Democratic 48 percent, Republican 20, no difference 21. To keep the country out of World War III: Democratic 34, Republican 21, no difference 31.'
    n: '*The Gallup Poll*, III, 1868 (K–J Cong. II.E).'
  - id: cal.1964-03-06.elections-1964
    when: Mar. 6
    date: '1964-03-06'
    thread: elections-1964
    also: [alabama]
    c: 'Wallace at Madison: he files in Wisconsin''s Democratic presidential primary, his slate of sixty delegates against the favorite-son slate of the State''s governor.'
    n: '[Photograph](https://wisconsinhistory.org/Records/Image/IM116625) by Richard Sroda, Mar. 6, 1964, and its caption (Wisconsin Historical Society). Carter, *The Politics of Rage* (K–J Cong. II.H). Lesher, *George Wallace* (K–J Cong. II.I.3). Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c]
  - id: cal.1964-03-06.voting-rights
    when: Mar. 6
    date: '1964-03-06'
    thread: voting-rights
    also: [mississippi, court]
    c: 'Jackson. A three-judge court dismisses the Government''s suit against Mississippi''s registration laws: the test of 1955, that an applicant read, write and interpret any section of the State constitution; the "good moral character" requirement of 1960; the statutes of 1962. The State not a proper defendant; the laws valid on their face. Cameron writing, with Cox; Brown dissents, Mar. 23.'
    n: '*United States v. Mississippi*, [229 F. Supp. 925](https://static.case.law/f-supp/229/html/0925-01.html) (S.D. Miss. 1964). Reversed: [[cal.1965-03-08.court]]. Lawson, *Black Ballots* (K–J Cong. II.C). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). Bass, *Unlikely Heroes* (K–J Cong. II.H). Dittmer, *Local People* (K–J Cong. II.F). Names: Cameron, Cox (K–J Cong. III.G); Brown (K–J Cong. III.K).'
    tags: [name:cameron-ben-f, name:cox-w-harold, name:brown-john-r]
  - id: cal.1964-03-08.vietnam
    when: Mar. 8–16
    date: '1964-03-08'
    thread: vietnam
    c: 'McNamara and Taylor in South Vietnam, Mar. 8–12; McNamara tours the Delta with Khánh, before crowds. His report, Mar. 16: some 40 percent of the countryside under Viet Cong control or predominant influence. Full support for Khánh; his forces up by at least 50,000. No overt action against the North now; readiness to strike across the borders on 72 hours'' notice, and to begin "graduated overt military pressure" on 30 days''.'
    n: 'FRUS 1964–68, I, docs. [74](https://history.state.gov/historicaldocuments/frus1964-68v01/d74), [84](https://history.state.gov/historicaldocuments/frus1964-68v01/d84). *The Pentagon Papers* (K–J Adm. II.H.3). McNamara, *In Retrospect* (K–J Adm. II.G.4). Taylor, *Swords and Plowshares* (Viet. II.H.1). Logevall, *Choosing War*; VanDeMark, *Into the Quagmire*; McMaster, *Dereliction of Duty* (K–J Adm. II.D). Kaiser, *American Tragedy* (Viet. II.B.8). Herring, *LBJ and Vietnam*; Barrett, *Uncertain Warriors* (Viet. II.C.1). See [[cal.1963-11-26.vietnam]]. Names: McNamara, Taylor (K–J Adm. III.F); Khánh (Viet. III.G).'
    tags: [name:mcnamara-robert-s, name:taylor-maxwell, name:nguyen-khanh]
  - id: cal.1964-03-08.black-nationalism
    when: Mar. 8–12
    date: '1964-03-08'
    thread: black-nationalism
    c: 'Malcolm X leaves the Nation of Islam. Mar. 12, at the Park Sheraton: his own Muslim Mosque, Inc., in Harlem; ready to work with civil rights groups in the South; Black people to defend themselves where the government will not.'
    n: 'See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X (K–J Cong. III.H). Check: the hotel.'
    tags: [name:malcolm-x]
  - id: cal.1964-03-09.court
    when: Mar. 9
    date: '1964-03-09'
    thread: court
    also: [king]
    c: '*New York Times Co. v. Sullivan*, [376 U.S. 254](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376254/usrep376254.pdf). The $500,000 libel judgment a Montgomery jury gave a city commissioner over "Heed Their Rising Voices," a 1960 advertisement for King''s defense, reversed, 9–0; Abernathy among the defendants. A public official may not recover for a defamatory falsehood about his official conduct without proof of "actual malice." Brennan for the Court; Black, Douglas and Goldberg would bar such suits altogether.'
    n: 'Opinion (K–J Cong. II.J.1). Lewis, *Make No Law*; Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Names: Brennan, Black, Douglas, Goldberg (K–J Cong. III.G); King, Abernathy (K–J Cong. III.H).'
    tags: [name:brennan-william-j-jr, name:black-hugo-l, name:douglas-william-o, name:goldberg-arthur-j, name:king-martin-luther-jr, name:abernathy-ralph-david]
  - id: cal.1964-03-09.civil-rights-bill
    when: Mar. 9–26
    date: '1964-03-09'
    thread: civil-rights-bill
    c: Mansfield moves that the Senate take up H.R. 7152. Russell's southern Democrats debate the motion sixteen days. Mar. 26, carried, [67–17](https://voteview.com/rollcall/RS0880288); Morse's motion to send the bill to the Judiciary Committee until Apr. 8 tabled, [50–34](https://voteview.com/rollcall/RS0880289).
    n: '[110 Cong. Rec., Senate, Mar. 9, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-4-2.pdf); [110 Cong. Rec., Senate, Mar. 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-7-2.pdf). Voteview counts the Morse vote 49–34; the Record, 50–34. See [[cal.1964-02-10.civil-rights-bill]]. Names: Mansfield (K–J Cong. III.A); Russell, Morse (K–J Cong. III.B).'
    tags: [name:mansfield-mike, name:russell-richard-b, name:morse-wayne]
  - id: cal.1964-03-09.jobs-and-wages
    when: Mar. 9
    date: '1964-03-09'
    thread: jobs-and-wages
    c: Manpower Report. Unemployment in 1963, 4.2 million in the average week, 5.7 percent of the labor force; 2.6 million more working part time for want of full-time work. A national commission on automation and technological progress proposed.
    n: '[Annual Message to the Congress: The Manpower Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-manpower-report-the-president-0) (Mar. 9, 1964); [Letter to the President of the Senate and to the Speaker of the House Proposing a National Commission on Automation and Technological Progress](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-proposing-national-commission) (Mar. 9, 1964). See [[cal.1962-03-15.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-03-10.elections-1964
    when: Mar. 10
    date: '1964-03-10'
    thread: elections-1964
    also: [goldwater]
    c: 'New Hampshire primary. Republican: Lodge (write-in) 35.5 percent, Goldwater 22.3. Democratic: Johnson (write-in) 95.3 percent, Kennedy (write-in) 1.6.'
    n: 'CQ Guide 6th (2010) 406. White, *The Making of the President 1964* (Opp. II.E). Perlstein, *Before the Storm* (Opp. II.B). Names: Lodge (K–J Adm. III.E); Goldwater (Opp. III.B); Johnson (K–J Adm. III.D); Kennedy (K–J Adm. III.A).'
    tags: [primary:1964-03-10, name:lodge-henry-cabot, name:johnson-lyndon-b, name:kennedy-robert-f, name:goldwater-barry-m]
  - id: cal.1964-03-10.specials
    when: Mar. 10
    date: '1964-03-10'
    thread: specials
    c: Tennessee 2d, special. Irene Baker (R) to her husband's seat, 55.5 to 43.3 over the Democrat; Howard Baker died Jan. 7. Swing 14.4 to D. Not a candidate in November.
    n: 'Votes: CQ Guide 6th (2010) 1275. Check: Tenn. Secretary of State, returns. [110 Cong. Rec., House, Mar. 19, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-1-2.pdf) (Baker sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Baker (K–J Cong. III.K).'
    tags: [special:1964-03-10-h-TN-2, name:baker-irene-bailey, name:baker-howard-h]
  - id: cal.1964-03-12.congress
    when: Mar. 12
    date: '1964-03-12'
    thread: congress
    c: 'House defeats the federal pay bill, [184–222](https://voteview.com/rollcall/RH0880138): raises for federal employees, executives and judges, and for members, $22,500 to $32,500. Mar. 17, Johnson asks the House to reconsider.'
    n: '[110 Cong. Rec., House, Mar. 12, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-7-2.pdf). [Letter to the Speaker Urging House Action on Federal Pay Legislation](https://www.presidency.ucsb.edu/documents/letter-the-speaker-urging-house-action-federal-pay-legislation) (Mar. 17, 1964). *Congress and the Nation*, vol. 1 (K–J Cong. II.L).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-03-14.assassination
    when: Mar. 14
    date: '1964-03-14'
    thread: assassination
    c: Dallas. A jury convicts Ruby of Oswald's murder with malice; death. The defense, psychomotor epilepsy, rejected. Reversed by the Texas Court of Criminal Appeals, Oct. 5, 1966; Ruby dies before a new trial, Jan. 3, 1967.
    n: '*Rubenstein v. State*, [407 S.W.2d 793](https://static.case.law/sw2d/407/html/0793-01.html) (Tex. Crim. App. 1966). John Kaplan & Jon R. Waltz, *The Trial of Jack Ruby* (1965). See [[cal.1963-11-22.assassination]]; [[cal.1963-11-24.assassination]]. Names: Ruby, Oswald (K–J Cong. III.K).'
    tags: [name:ruby-jack, name:oswald-lee-harvey]
  - id: cal.1964-03-16.poverty
    when: Mar. 16
    date: '1964-03-16'
    thread: poverty
    c: 'Message on poverty: the Economic Opportunity Act. A Job Corps of 100,000 young men; work-training for 200,000, work-study for 140,000; community action; volunteers; loans to poor farmers and to employers of the unemployed. An Office of Economic Opportunity in the Executive Office, Shriver to direct. $970 million, 1 percent of the budget. Landrum''s bill, H.R. 10440; McNamara''s, S. 2642, the same day.'
    n: '[Special Message to the Congress Proposing a Nationwide War on the Sources of Poverty](https://www.presidency.ucsb.edu/documents/special-message-the-congress-proposing-nationwide-war-the-sources-poverty) (Mar. 16, 1964). [110 Cong. Rec., House, Mar. 16, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-10-1.pdf); [110 Cong. Rec., Senate, Mar. 16, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-10-2.pdf). Economic Opportunity Act of 1964 (K–J Cong. II.J.2). Council of Economic Advisers, *Annual Report* (Jan. 1964), ch. 2 (K–J Adm. II.H.3). Harrington, *The Other America* (K–J Cong. II.F). Gillette, *Launching the War on Poverty*; Moynihan, *Maximum Feasible Misunderstanding*; Davies, *From Opportunity to Entitlement*; Lemann, *The Promised Land* (K–J Adm. II.B). Matusow, *The Unraveling of America* (K–J Adm. II.A). Sundquist, *Politics and Policy*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). Stossel, *Sarge* (K–J Adm. II.G.5). See [[cal.1964-01-08.program]]. Names: Shriver (K–J Adm. III.G); Landrum (K–J Cong. III.D).'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent, name:landrum-phil-m, name:mcnamara-patrick-v]
  - id: cal.1964-03-17.vietnam
    when: Mar. 17
    date: '1964-03-17'
    thread: vietnam
    c: 'NSC approves McNamara''s report. NSAM 288: the agencies to carry it out "energetically," the Assistant Secretary for Far Eastern Affairs to coordinate. White House statement: "setbacks" since October; aid to South Vietnam "for as long as it is required."'
    n: '[NSAM No. 288](https://history.state.gov/historicaldocuments/frus1964-68v01/d87) (Mar. 17, 1964). [FRUS 1964–68, I, doc. 86](https://history.state.gov/historicaldocuments/frus1964-68v01/d86). [White House Statement on the Situation in South Viet-Nam](https://www.presidency.ucsb.edu/documents/white-house-statement-the-situation-south-viet-nam) (Mar. 17, 1964). See [[cal.1964-03-08.vietnam]]. Names: McNamara (K–J Adm. III.F); Bundy (K–J Adm. III.E).'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:bundy-mcgeorge]
  - id: cal.1964-03-19.foreign-aid
    when: Mar. 19
    date: '1964-03-19'
    thread: foreign-aid
    c: 'Foreign aid message. $3.4 billion for fiscal 1965: $1 billion military, $2.4 billion economic; $1.1 billion under last year''s request. Two-thirds of military aid to eleven countries on the Sino-Soviet periphery.'
    n: '[Special Message to the Congress on Foreign Aid](https://www.presidency.ucsb.edu/documents/special-message-the-congress-foreign-aid-3) (Mar. 19, 1964). Johnson, *Congress and the Cold War* (K–J Cong. II.D). See [[cal.1963-12-24.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-03-19.voting-rights
    when: Mar. 19
    date: '1964-03-19'
    thread: voting-rights
    also: [alabama]
    c: 'Selma. Judge Thomas denies the Justice Department''s two Dallas County suits, filed June 26 and Nov. 12, 1963. Sheriff Clark''s men at the mass meetings, the arrests of registration workers: no federal right violated, the plaintiff having "failed in its proof" (*United States v. Dallas County*). The county grand jury, acting in good faith, may compel the Civil Rights Division''s lawyers to testify (*United States v. McLeod*).'
    n: '*United States v. Dallas County*, [229 F. Supp. 1014](https://static.case.law/f-supp/229/html/1014-01.html) (S.D. Ala. 1964); *United States v. McLeod*, [229 F. Supp. 383](https://static.case.law/f-supp/229/html/0383-01.html) (S.D. Ala. 1964). Both reversed: *United States v. McLeod*, [385 F.2d 734](https://static.case.law/f2d/385/html/0734-01.html) (5th Cir. 1967). Garrow, *Protest at Selma*; Lawson, *Black Ballots* (K–J Cong. II.C). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). Names: Thomas, Clark (K–J Cong. III.K).'
    tags: [name:thomas-daniel-h, name:clark-james-g-jr]
  - id: cal.1964-03-22.opinion
    when: Mar. 22
    date: '1964-03-22'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Feb. 28–Mar. 5: more often to blame if a person is poor: lack of effort 33 percent, circumstances 29, both equally 32. Of those choosing, Republicans 64 effort; Democrats 53 circumstances. Poverty ever done away with here: yes 9, no 83.'
    n: '*The Gallup Poll*, III, 1870 (K–J Cong. II.E).'
  - id: cal.1964-03-25.latin-america
    when: Mar. 25
    date: '1964-03-25'
    thread: latin-america
    also: [cuba]
    c: 'Fulbright in the Senate, "Old Myths and New Realities." Policy to admit "unthinkable thoughts": Castro "a nuisance but not a grave threat"; the Panama treaty of 1903 "in certain respects obsolete"; the realities about China to be faced.'
    n: '[110 Cong. Rec., Senate, Mar. 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-6-1.pdf). Fulbright, *Old Myths and New Realities* (K–J Cong. II.D). Woods, *Fulbright* (K–J Cong. II.I.1). See [[cal.1964-01-09.latin-america]]. Names: Fulbright (K–J Cong. III.B); Castro (K–J Adm. III.J).'
    tags: [name:fulbright-j-william, name:castro-fidel]
  - id: cal.1964-03-25.opinion
    when: Mar. 25
    date: '1964-03-25'
    thread: opinion
    also: [rules, civil-rights-bill]
    c: 'Gallup, Feb. 28–Mar. 5: 54 percent can say what a filibuster is. Of them, a simple majority to end debate in place of two-thirds, 40 approve, 38 disapprove. The South 35 approve, 41 disapprove.'
    n: '*The Gallup Poll*, III, 1870–71 (K–J Cong. II.E).'
  - id: cal.1964-03-27.states-and-cities
    when: Mar. 27
    date: '1964-03-27'
    thread: states-and-cities
    c: 'Alaska earthquake, Good Friday, 5:36 p.m.: Anchorage, Seward, Valdez, Kodiak. Over a hundred dead, most in the sea waves; Check the figure. Mar. 28, Johnson declares a disaster. Apr. 2, E.O. 11150: a federal commission on reconstruction, Senator Anderson chairman. Apr. 23, $22.5 million asked in grants to the State.'
    n: '[Statement by the President on the Earthquake in Alaska](https://www.presidency.ucsb.edu/documents/statement-the-president-the-earthquake-alaska) (Mar. 28, 1964); [Exec. Order No. 11,150](https://www.presidency.ucsb.edu/documents/executive-order-11150-establishing-the-federal-reconstruction-and-development-planning) (Apr. 2, 1964); [Letter to the President of the Senate and to the Speaker of the House Proposing Additional Aid for Alaska](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-proposing-additional-aid-for) (Apr. 23, 1964). Wallace R. Hansen et al., [*The Alaska Earthquake, March 27, 1964: Field Investigations and Reconstruction Effort*](https://pubs.usgs.gov/publication/pp541) (U.S. Geological Survey Professional Paper 541, 1966). Names: Anderson (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:anderson-clinton-p]
  - id: cal.1964-03-29.opinion
    when: Mar. 29
    date: '1964-03-29'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, special survey of Republican county chairmen, their own choice for the nomination: Goldwater 878, Nixon 383, Lodge 244, Scranton 164, Rockefeller 117; others 37, no preference 17.'
    n: '*The Gallup Poll*, III, 1871 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Nixon (Opp. III.E); Lodge (K–J Adm. III.E); Scranton, Rockefeller (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:nixon-richard-m, name:lodge-henry-cabot, name:scranton-william-w, name:rockefeller-nelson]
  - id: cal.1964-03-30.civil-rights-bill
    when: Mar. 30
    date: '1964-03-30'
    thread: civil-rights-bill
    c: Senate debate on the bill itself begins. Humphrey, the floor manager, opens; Kuchel follows for the Republicans. A floor captain from each party for each title. Russell's southern Democrats hold the floor in turn.
    n: '[110 Cong. Rec., Senate, Mar. 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-8-1.pdf). See [[cal.1964-03-09.civil-rights-bill]]. Cloture: [[cal.1964-06-10.civil-rights-bill]]. Names: Humphrey, Kuchel (K–J Cong. III.A); Russell (K–J Cong. III.B).'
    tags: [name:humphrey-hubert-h, name:kuchel-thomas-h, name:russell-richard-b]
  - id: cal.1964-03-31.latin-america
    when: Mar. 31–Apr. 2
    date: '1964-03-31'
    thread: latin-america
    c: 'Brazil. Gordon, Mar. 28: Goulart "definitely engaged on campaign to seize dictatorial power." Mar. 31, the army rises against him in Minas Gerais; Washington orders Brother Sam, a carrier task force and tankers, and readies arms for airlift. Apr. 1, Goulart leaves Rio; resistance ends but at Porto Alegre. That night the Congress declares the presidency vacant; Mazzilli, president of the Chamber, sworn. Apr. 2, Johnson''s "warmest good wishes." The Congress elects Castelo Branco, Apr. 11.'
    n: 'FRUS 1964–68, XXXI, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v31/d187), [195](https://history.state.gov/historicaldocuments/frus1964-68v31/d195), [198](https://history.state.gov/historicaldocuments/frus1964-68v31/d198), [206](https://history.state.gov/historicaldocuments/frus1964-68v31/d206). [Message to the New President of Brazil](https://www.presidency.ucsb.edu/documents/message-the-new-president-brazil) (Apr. 2, 1964). Parker, *Brazil and the Quiet Intervention, 1964*; Leacock, *Requiem for Revolution*; Rabe, *The Most Dangerous Area in the World*; Rabe, *The Killing Zone* (K–J Adm. II.D). See [[cal.1962-04-03.latin-america]]. Names: Goulart (K–J Adm. III.J).'
    tags: [name:gordon-lincoln, name:goulart-joao, name:mazzilli-pascoal-ranieri, name:johnson-lyndon-b, name:castelo-branco-humberto-de-alencar]
