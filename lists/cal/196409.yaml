  - id: cal.1964-09-01.elections-1964
    when: Sept. 1
    date: '1964-09-01'
    thread: elections-1964
    also: [georgia, democratic-party]
    c: 'Russell to Jimmy Carter, a Georgia State Senator who had urged him to campaign, by letter: he will not support a platform "endorsing and assuring enforcement" of the civil rights law; "I do not believe that even he would ask me to stultify myself." Humphrey can "charm the birds right down out of the trees," but his philosophy is not Russell''s.'
    n: '[[w.mann-walls-of-jericho]], 443. To check: Russell to Carter, Sept. 1, 1964, Richard B. Russell Library; [[w.fite-richard-b-russell-jr]], 419 (cited by [[w.mann-walls-of-jericho]], 443). Check: which words are the letter''s. See [[cal.1964-07-02.civil-rights-bill]]. Names: Russell, Jimmy Carter, Humphrey.'
    src:
      c: 1614c1d2
      rows:
        - 'w.mann-walls-of-jericho 443: all'
        - 'via w.mann-walls-of-jericho 443 n.i-do-not-believe-that-even-he-would-ask-me: A'
    tags: [name:russell-richard-b, name:carter-jimmy, state:ga]
  - id: cal.1964-09-02.cities-and-housing
    when: Sept. 2
    date: '1964-09-02'
    thread: cities-and-housing
    c: Housing Act of 1964 signed, [78 Stat. 769](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg769.pdf). Housing and urban renewal programs funded to Sept. 30, 1965; rehabilitation loans in renewal areas; aid to code enforcement; rental housing for farmworkers. Conference report, House Aug. 19, [310–70](https://voteview.com/rollcall/RH0880218).
    n: 'Remarks Upon Signing the Housing Act, [1963–64 Pub. Papers 1029](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=269) (Sept. 2, 1964). To check: [[w.gelfand-nation-of-cities]]. See [[cal.1964-01-27.cities-and-housing]]; [[cal.1961-06-30.program]]. Names: Johnson, Sparkman.'
    tags: [name:johnson-lyndon-b, name:sparkman-john, name:rains-albert-m]
  - id: cal.1964-09-02.economy
    when: Sept. 2
    date: '1964-09-02'
    thread: economy
    c: 'Interest Equalization Tax Act signed, [78 Stat. 809](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg809.pdf): the tax on Americans'' purchases of foreign stocks and bonds, from 2.75 to 15 percent of value, on acquisitions after July 18, 1963, through 1965.'
    n: '[Exec. Order No. 11,175](https://www.presidency.ucsb.edu/documents/executive-order-11175-exclusion-for-original-or-new-canadian-issues-required-for) (Sept. 2, 1964), new Canadian issues excluded. See [[cal.1963-07-18.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-02.medicare
    when: Sept. 2
    date: '1964-09-02'
    thread: medicare
    c: 'Senate adds hospital insurance for the aged to the Social Security bill, H.R. 11865: Gore''s amendment, [49–44](https://voteview.com/rollcall/RS0880509). Passed Sept. 3, [60–28](https://voteview.com/rollcall/RS0880511), with a $7 monthly rise in benefits. The House conferees will not take Medicare; the bill dies in conference at adjournment, Oct. 3.'
    n: '[110 Cong. Rec., Senate, Sept. 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf). Statement by the President Following Senate Passage of the Medicare Bill, [1963–64 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=272) (Sept. 2, 1964): "the first time either House of Congress has endorsed health care for the aged under the social security system." [[w.marmor-politics-of-medicare]];[[w.zelizer-taxing-america]], 229–30 (the Senate''s vote; Mills and the House conferees against). [[w.sundquist-politics-and-policy]], 316–17 (Gore''s amendment, 49–44; the conference). To check: [[w.harris-sacred-trust]]; [[w.blumenthal-heart-of-power]]; [[w.david-with-dignity]]; Henry Hall Wilson to O''Brien, June 21, 1964; Cohen to O''Brien, Aug. 13, 1964; O''Brien to Johnson, Sept. 13, 1964; Wilson to O''Brien, Sept. 20, 1964, White House Office Aides Files, Henry Hall Wilson, LBJ Library (cited by [[w.zelizer-taxing-america]], 230 n.72). See [[cal.1964-07-29.medicare]]; [[cal.1961-02-09.medicare]]. Names: Gore, Johnson.'
    src:
      c: 5f677f8a
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf: all'
