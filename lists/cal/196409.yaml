    thread: elections-1964
    also: [vietnam]
    c: 'Johnson campaigns in New England: Providence, at Brown''s bicentennial; Hartford; Burlington, Vt.; Portland, Me.; Manchester. Large crowds; an AP reporter brought to the rope line to see the "proof the people did like" him. At Manchester, to the New Hampshire weekly newspaper editors: "just for the moment I have not thought that we were ready for American boys to do the fighting for Asian boys"; "we are not going north and drop bombs at this stage of the game, and we are not going south and run out." Nixon, Rockefeller, Scranton and Goldwater "have all, at some time or other, suggested the possible wisdom of going north in Viet-Nam."'
    n: 'Remarks in Providence at the 200th Anniversary Convocation of Brown University, [1963–64 Pub. Papers 1139](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=379); Remarks in Hartford, Connecticut, [1963–64 Pub. Papers 1144](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=384); Remarks in Hartford to a Group of Business Leaders, [1963–64 Pub. Papers 1147](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=387); Remarks at the Airport, Burlington, Vermont, [1963–64 Pub. Papers 1151](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=391); Remarks in Portland, Maine, on the Steps of the City Hall, [1963–64 Pub. Papers 1156](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=396); Remarks in Manchester to the Members of the New Hampshire Weekly Newspaper Editors Association, [1963–64 Pub. Papers 1160](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=400) (Sept. 28, 1964). [[w.young-two-suns-of-the]], 180 (the crowds; the reporter); [[w.white-making-of-the-president-1965]], 364 (the "jump" in his crowds, Monday, Sept. 28); [[w.branch-pillar-of-fire]], 502–03; [[w.goldberg-barry-goldwater]], 228 (thirty speeches in twenty hours in six States; Manchester, N.H.: "We are not going north and drop bombs at this stage of the game, and we are not going south and run out"); [[w.bernstein-guns-or-butter]], 150 (six stops, Providence to Boston at 2 a.m.; Providence''s crowd "perhaps half a million," by Theodore White; 70 minutes late at Brown); [[w.bernstein-guns-or-butter]], 442–43 (at Brown: "I look with the greatest of favor upon the proposal of your own able President Keeney''s Commission for a National Foundation for the Humanities"); [[w.white-making-of-the-president-1965]], 347, 362–67 (Providence: "we''re in favor of a lot of things and we''re against mighty few"; the Warren report read at the Ranch, Sept. 26–27; Providence at 9:30 a.m., some 3,000 at the airport; thirteen stops, Brown''s convocation; Hartford, two hours late, the business leaders and Rayburn''s story; on to Burlington, Portland, Manchester and Boston, the day ending at 2 a.m.). [[w.logevall-choosing-war]], 238 (the Manchester passage). [[w.mann-grand-delusion]], 374–75 (Manchester). Check: Branch gives a record million in the six New England States before dawn on Sept. 29, ending at Edward Kennedy''s bedside (502). To check: [[w.evans-lyndon-b-johnson]] (cited by [[w.young-two-suns-of-the]], 180 n.22); [[w.white-making-of-the-president]], 366–67 (cited by [[w.branch-pillar-of-fire]], 502); [[w.miller-lyndon]], 481–82 (cited by [[w.branch-pillar-of-fire]], 502); [[w.valenti-very-human-president]], 160–61 (cited by [[w.branch-pillar-of-fire]], 502). See [[cal.1964-09-28.goldwater]]. Names: Johnson, Nixon, Rockefeller, Scranton, Goldwater.'
