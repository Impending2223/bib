    also: [elections-1964]
    c: Michigan's primary. Romney renominated over a former State senator, 583,356, 87.9 percent. U.S. Representative Staebler, at large, the Democrat, unopposed.
    n: 'Votes: [Wikipedia, "1964 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1964_Michigan_gubernatorial_election), from the [*Michigan Manual 1965–1966*, pp. 405–406](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179256&view=1up&seq=473) (Check: not read here). Check: the count of the former State senator. See [[cal.1962-11-06.governors-mi]]. Names: Romney, Staebler.'
    tags: [state:mi, name:romney-george-w, name:staebler-neil-o]
  - id: cal.1964-09-01.open-housing-detroit
    when: Sept. 1
    date: '1964-09-01'
    thread: open-housing
    also: [state-constitutions]
    c: Detroit. The "Homeowners' Rights Ordinance," an initiative securing an owner's choice of buyer, tenant and agent, adopted with the primary, 137,671 to 114,743, 54.5 percent, over Cavanagh's and Romney's opposition. Held unconstitutional in the Wayne County Circuit Court (Check the case and date).
