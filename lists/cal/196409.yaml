entries:
  - id: cal.1964-09-01.governors-mi
    when: Sept. 1
    date: '1964-09-01'
    thread: governors
    also: [elections-1964]
    c: Michigan's primary. Romney renominated, 583,356, 87.9 percent, over a former State senator. U.S. Representative Staebler, at large, the Democrat, unopposed.
    n: 'Votes: [Wikipedia, "1964 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1964_Michigan_gubernatorial_election), from the [*Michigan Manual 1965–1966*, pp. 405–406](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179256&view=1up&seq=473) (Check: not read here). See [[cal.1962-11-06.governors-mi]]. Names: Romney, Staebler.'
    tags: [state:mi, name:romney-george-w, name:staebler-neil-o]
  - id: cal.1964-09-01.open-housing-detroit
    when: Sept. 1
    date: '1964-09-01'
    thread: open-housing
    also: [state-constitutions]
    c: Detroit. The "Homeowners' Rights Ordinance," an initiative securing an owner's choice of buyer, tenant and agent, adopted with the primary, 137,671 to 114,743, 54.5 percent, over Cavanagh's and Romney's opposition. Held unconstitutional in the Wayne County Circuit Court (Check the case and date).
    n: '*Pontiac Press*, [Sept. 2, 1964](https://our.oakland.edu/items/a8c68234-0a76-4b43-8408-656a4c862254) (AP; Check: the city clerk''s canvass). To check: [[w.sugrue-origins-of-the-urban]]; [[w.fine-expanding-the-frontiers-of]]; [[w.fine-violence-in-the-model]]. See [[cal.1962-11-26.open-housing-detroit]]. Names: Cavanagh, Romney.'
    tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:romney-george-w]
  - id: cal.1964-09-02.cities-and-housing
    when: Sept. 2
    date: '1964-09-02'
    thread: cities-and-housing
    c: Housing Act of 1964 signed, [78 Stat. 769](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg769.pdf). Housing and urban renewal programs funded to Sept. 30, 1965; rehabilitation loans in renewal areas; aid to code enforcement; rental housing for farmworkers. Conference report, House Aug. 19, [310–70](https://voteview.com/rollcall/RH0880218).
    n: 'Remarks Upon Signing the Housing Act, [1963–64 Pub. Papers 1029](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=269) (Sept. 2, 1964). To check: [[w.gelfand-nation-of-cities]]. See [[cal.1964-01-27.cities-and-housing]]; [[cal.1961-06-30.program]]. Names: Johnson, Sparkman.'
    tags: [name:johnson-lyndon-b, name:sparkman-john, name:rains-albert-m]
  - id: cal.1964-09-02.economy
    when: Sept. 2
    date: '1964-09-02'
    thread: economy
    c: 'Interest Equalization Tax Act signed, [78 Stat. 809](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg809.pdf): the tax on Americans'' purchases of foreign stocks and bonds, from 2.75 to 15 percent of value, on acquisitions after July 18, 1963, through 1965.'
    n: '[Exec. Order No. 11,175](https://www.presidency.ucsb.edu/documents/executive-order-11175-exclusion-for-original-or-new-canadian-issues-required-for) (Sept. 2, 1964), new Canadian issues excluded. See [[cal.1963-07-18.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-02.medicare
    when: Sept. 2
    date: '1964-09-02'
    thread: medicare
    c: 'Senate adds hospital insurance for the aged to the Social Security bill, H.R. 11865: Gore''s amendment, [49–44](https://voteview.com/rollcall/RS0880509). Passed Sept. 3, [60–28](https://voteview.com/rollcall/RS0880511), with a $7 monthly rise in benefits. The House conferees will not take Medicare; the bill dies in conference at adjournment, Oct. 3.'
    n: '[110 Cong. Rec., Senate, Sept. 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf). Statement by the President Following Senate Passage of the Medicare Bill, [1963–64 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=272) (Sept. 2, 1964): "the first time either House of Congress has endorsed health care for the aged under the social security system." [[w.marmor-politics-of-medicare]];[[w.harris-sacred-trust]]. To check: [[w.blumenthal-heart-of-power]]; [[w.david-with-dignity]]; [[w.zelizer-taxing-america]] (K–J Cong. II.B). See [[cal.1964-07-29.medicare]]; [[cal.1961-02-09.medicare]]. Names: Gore, Johnson.'
    tags: [name:gore-albert-sr, name:johnson-lyndon-b]
  - id: cal.1964-09-02.voting-rights-selma
    when: Sept. 2
    date: '1964-09-02'
    thread: voting-rights-selma
    also: [alabama]
    c: The United States sues Sheriff Clark, Judge Hare, the circuit solicitor, the probate judge and the city of Selma (*United States v. Clark*); heard in December by a three-judge court.
    n: '[The case](https://clearinghouse.net/case/14753/), Civil Rights Litigation Clearinghouse (filed Sept. 2, 1964). *United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/case-pdfs/0720-01.pdf) (S.D. Ala. 1965) (the findings). See [[cal.1964-07-04.alabama]]. Names: James Clark, Hare.'
    tags: [name:clark-james-g-jr, name:hare-james-a]
  - id: cal.1964-09-03.conservation
    when: Sept. 3
    date: '1964-09-03'
    thread: conservation
    c: 'Wilderness Act, [78 Stat. 890](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg890.pdf), and Land and Water Conservation Fund Act, [78 Stat. 897](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg897.pdf), signed. Wilderness: 9.1 million acres of national forest in 54 areas; no permanent roads or commercial enterprise; mining claims allowed through 1983; more by act of Congress. The fund, from park fees, surplus property sales, and the motorboat fuel tax, for federal and State recreation lands. Senate on the fund, Aug. 12, [92–1](https://voteview.com/rollcall/RS0880500).'
    n: 'Wilderness Act (K–J Cong. II.J.2). Remarks Upon Signing the Wilderness Bill and the Land and Water Conservation Fund Bill, [1963–64 Pub. Papers 1033](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=273) (Sept. 3, 1964). To check: [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]. See [[cal.1964-07-30.conservation]]. See [[cal.1962-03-01.conservation]]. Names: Johnson, Anderson, Jackson, Aspinall, Udall.'
    tags: [name:johnson-lyndon-b, name:anderson-clinton-p, name:jackson-henry-m, name:udall-stewart-l, name:aspinall-wayne-n]
  - id: cal.1964-09-03.transition-and-staff
    when: Sept. 3
    date: '1964-09-03'
    thread: transition-and-staff
    also: [elections-1964, robert-kennedy]
    c: Robert Kennedy resigns as Attorney General, nominated on Sept. 1 by New York's Democratic convention, on the first ballot, to run for the Senate against Keating. Katzenbach Acting Attorney General from Sept. 4.
    n: '[Johnson, Robert Kennedy, O''Donnell and Valenti](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-september-3-1964), Conversation WH6409-04-5453-5457-5458 (Miller Center). Letter Accepting Resignation of Robert F. Kennedy as Attorney General, [1963–64 Pub. Papers 1036](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=276) (Sept. 3, 1964). To check: [[w.katzenbach-some-of-it-was]]. See [[cal.1964-08-25.elections-1964]]. Names: Robert Kennedy, Keating, Katzenbach, Johnson.'
    tags: [name:kennedy-robert-f, name:keating-kenneth-b, name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1964-09-03.goldwater
    when: Sept. 3
    date: '1964-09-03'
    thread: goldwater
    also: [elections-1964]
    c: Prescott, Ariz. Goldwater opens his campaign from the north steps of the Yavapai County Courthouse, where he had begun each race for national office.
    n: '[[w.perlstein-before-the-storm]], 409–11 (Prescott, where he always opened). To check: [[w.shadegg-what-happened-to-goldwater]]; [[w.white-making-of-the-president-1965]]. See [[cal.1964-07-15.elections-1964]]. Names: Goldwater.'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-09-03.europe-and-the-alliance-cyprus
    when: Sept. 3
    date: '1964-09-03'
    thread: cyprus
    c: Cyprus. Greece rejects the Acheson proposals, in the King's reply to Johnson. Acheson home, Sept. 4.
    n: '[FRUS 1964–68, XVI, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v16/d150) (the NSC, Sept. 1). Check: the King''s reply. See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Johnson, Acheson, Constantine II.'
    tags: [name:johnson-lyndon-b, name:acheson-dean-g, name:constantine-ii]
  - id: cal.1964-09-04.latin-america
    when: Sept. 4
    date: '1964-09-04'
    thread: latin-america
    c: 'Chile. Frei, the Christian Democrat, elected President with 56 percent; Allende, of the Popular Action Front, 39. The CIA had given Frei money and organization, and run propaganda against Allende. Johnson, Sept. 5: "an internal matter in which the people of Chile were the only judges."'
    n: '[FRUS 1964–68, XXXI, docs. 269](https://history.state.gov/historicaldocuments/frus1964-68v31/d269), [270](https://history.state.gov/historicaldocuments/frus1964-68v31/d270). The President''s News Conference, [1963–64 Pub. Papers 1040](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=280) (Sept. 5, 1964). S. Select Comm. to Study Governmental Operations with Respect to Intelligence Activities, *Covert Action in Chile, 1963–1973*, 94th Cong. (Comm. Print 1975). To check: [[w.rabe-killing-zone]]. Names: Frei Montalva, Allende Gossens, Johnson.'
    tags: [name:frei-montalva-eduardo, name:allende-gossens-salvador, name:johnson-lyndon-b]
  - id: cal.1964-09-04.opinion
    when: Sept. 4
    date: '1964-09-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Aug. 27–Sept. 1: the party more likely to keep the country out of World War III: Democratic 44 percent, Republican 20, no difference 20. To keep it prosperous: Democratic 53, Republican 21, no difference 12.'
    n: '[[w.gallup-poll]], III, 1900.'
  - id: cal.1964-09-04.civil-rights-the-executive
    when: Sept. 4
    date: '1964-09-04'
    thread: civil-rights-the-executive
    also: [georgia]
    c: Danielsville. An all-white Madison County jury acquits Sims and Myers, Klansmen of Athens, of Penn's murder.
    n: '*New Georgia Encyclopedia*, ["Lemuel Penn Murder"](https://www.georgiaencyclopedia.org/articles/history-archaeology/lemuel-penn-murder/). See [[cal.1964-07-11.civil-rights-the-executive]]. Names: Sims, Myers, Penn.'
    tags: [name:sims-joseph-howard, name:myers-cecil-william, name:penn-lemuel-a]
  - id: cal.1964-09-07.elections-1964
    when: Sept. 7
    date: '1964-09-07'
    thread: elections-1964
    also: [testing, goldwater]
    c: 'Labor Day. Johnson opens his campaign in Cadillac Square, Detroit: "There is no such thing as a conventional nuclear weapon." That night on NBC, the Democrats'' "Daisy": a girl counting petals, a countdown, a bomb; shown once. Seattle, Sept. 16: the release of nuclear weapons "by Presidential decision alone."'
    n: 'Remarks in Cadillac Square, Detroit, [1963–64 Pub. Papers 1049](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=289) (Sept. 7, 1964); Remarks in Seattle on the Control of Nuclear Weapons, [1963–64 Pub. Papers 1078](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=318) (Sept. 16, 1964). [[w.perlstein-before-the-storm]], 412–14, 418–20 (the spot; Cadillac Square). To check: [[w.mann-daisy-petals-and-mushroom]]; [[w.white-making-of-the-president-1965]]; [[w.lamb-campaign-decision-making]]; [[w.dallek-flawed-giant]]. See [[cal.1964-08-26.elections-1964]]; [[cal.1964-07-15.elections-1964]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-08.governors-az
    when: Sept. 8
    date: '1964-09-08'
    thread: governors
    also: [elections-1964]
    c: 'Arizona''s primary, for governor, Fannin running for Goldwater''s Senate seat. Republican: Kleindienst 64,310, 62.8 percent; Mecham 38,131. Democratic: Goddard 114,377, 60.0; Brock 57,067, 30.0.'
    n: 'Votes: [Wikipedia, "1964 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1964_Arizona_gubernatorial_election); Check: [Ariz. *Official Canvass, Primary Election, September 8, 1964*](https://azmemory.azlibrary.gov/nodes/view/102660). To check: [[w.shermer-sunbelt-capitalism]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1962-09-11.governors-az]]. Names: Fannin, Goldwater, Kleindienst, Goddard, Mecham, Brock.'
    tags: [state:az, name:kleindienst-richard-g, name:mecham-evan, name:goddard-samuel-p-jr, name:brock-art, name:fannin-paul-j, name:goldwater-barry-m]
  - id: cal.1964-09-08.governors-wi
    when: Sept. 8
    date: '1964-09-08'
    thread: governors
    also: [elections-1964]
    c: 'Wisconsin, governor. Democratic primary: Governor Reynolds 70.3 percent, Frinzi 29.7. Republican: Knowles, a former lieutenant governor, 71.9, Knutson 28.1.'
    n: 'Votes: [Wikipedia, "1964 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1964_Wisconsin_gubernatorial_election), from the *Wisconsin Blue Book 1966* (Check). To check: [[w.thompson-history-of-wisconsin-volume]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1964-04-07.elections-1964]]. Names: John Reynolds, Knowles, Frinzi, Knutson.'
    tags: [state:wi, name:reynolds-john-w-jr, name:frinzi-dominic-h, name:knowles-warren-p, name:knutson-milo-g]
  - id: cal.1964-09-08.governors-nh
    when: Sept. 8
    date: '1964-09-08'
    thread: governors
    also: [elections-1964]
    c: New Hampshire's Republican primary for governor. Pillsbury 32,200, 51.4 percent; Powell 21,764, 34.7; King, the governor, 3,608 as a write-in. King re-elected in November over Pillsbury, 66.8 percent.
    n: '[N.H. *Manual for the General Court*, no. 39 (1965), p. 500](https://archive.org/details/manualforgeneral39newh/page/n539). [Wikipedia, "1964 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1964_New_Hampshire_gubernatorial_election). See [[cal.1962-11-06.governors-nh]]. Names: Pillsbury, Powell, King.'
    tags: [state:nh, name:pillsbury-john, name:powell-wesley, name:king-john-w]
  - id: cal.1964-09-08.governors-vt
    when: Sept. 8
    date: '1964-09-08'
    thread: governors
    also: [elections-1964]
    c: Vermont's Republican primary for governor. Foote, the lieutenant governor, 19,121, 42.8 percent; Babcock 36.3; MacBride 20.7. Hoff re-elected in November over Foote, 64.9 percent.
    n: '[Vt. Secretary of State, "Primary Election Results, 1964"](https://web.archive.org/web/20160304052858/https://www.sec.state.vt.us/media/62959/p1964.pdf); [Wikipedia, "1964 Vermont gubernatorial election"](https://en.wikipedia.org/wiki/1964_Vermont_gubernatorial_election). See [[cal.1962-11-06.governors-vt]]. Names: Foote, Robert Babcock, MacBride, Hoff.'
    tags: [state:vt, name:foote-ralph-a, name:babcock-robert-s, name:macbride-roger, name:hoff-philip-h]
  - id: cal.1964-09-08.europe-and-the-alliance-cyprus
    when: Sept. 8
    date: '1964-09-08'
    thread: cyprus
    c: 'Cyprus. At Johnson''s lunch, Acheson and Ball: no negotiated settlement possible; a Turkish move on the Karpas, then "instant enosis."'
    n: '[FRUS 1964–68, XVI, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v16/d155). See [[cal.1964-07-07.europe-and-the-alliance]]. Names: Johnson, Acheson, Ball.'
    tags: [name:johnson-lyndon-b, name:acheson-dean-g, name:ball-george-w]
  - id: cal.1964-09-10.vietnam
    when: Sept. 10
    date: '1964-09-10'
    thread: vietnam
    c: NSAM 314, after the Sept. 9 meeting with Taylor. Destroyer patrols in the Gulf of Tonkin to resume, well beyond twelve miles; then the South's 34A raids. Talks with Laos on operations into the corridor. Ready to respond to any attack on American units. First, to strengthen the Saigon government.
    n: '[NSAM No. 314](https://history.state.gov/historicaldocuments/frus1964-68v01/d345) (Sept. 10, 1964); [FRUS 1964–68, I, doc. 343](https://history.state.gov/historicaldocuments/frus1964-68v01/d343). The President''s News Conference, [1963–64 Pub. Papers 1052](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=292) (Sept. 9, 1964). [[w.gibbons-u-s-government-and]], II, 350–353; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 525; [[w.cosmas-joint-chiefs-of-staff-2012]], 130–133; [[w.marolda-united-states-navy-and]], 472; [[w.staaveren-u-s-air-force]], 36. To check: [[w.pentagon-papers]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.taylor-swords-and-plowshares]]. See [[cal.1964-08-07.vietnam]]. Names: Johnson, Taylor.'
    tags: [name:johnson-lyndon-b, name:taylor-maxwell, name:bundy-mcgeorge]
  - id: cal.1964-09-10.court
    when: Sept. 10
    date: '1964-09-10'
    thread: court
    also: [congress, legislatures]
    c: 'Senate refuses cloture on the Dirksen–Mansfield rider to the foreign aid bill, [30–63](https://voteview.com/rollcall/RS0880512): stays of court orders to reapportion State legislatures. Northern liberals filibustering. Sept. 24, Mansfield''s substitute, a sense of Congress that the courts may give legislatures six months, [44–38](https://voteview.com/rollcall/RS0880522); the bill passes, [45–16](https://voteview.com/rollcall/RS0880527). Dropped in conference.'
    n: '[110 Cong. Rec., Senate, Sept. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-2-2.pdf); [Sept. 24, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-13-2.pdf). To check: [[w.dixon-democratic-representation]]; [[w.cortner-apportionment-cases]]. See [[cal.1964-08-19.court]]; [[cal.1964-06-15.court]]. Names: Dirksen, Mansfield.'
    tags: [name:dirksen-everett, name:mansfield-mike]
  - id: cal.1964-09-10.baker
    when: Sept. 10
    date: '1964-09-10'
    thread: baker
    c: Senate, [75–3](https://voteview.com/rollcall/RS0880519), has the Rules Committee reopen its inquiry into Senate employees' business, on charges of an overpayment for the D.C. Stadium. Williams's substitute, to give it to Government Operations, loses [37–50](https://voteview.com/rollcall/RS0880514).
    n: '[110 Cong. Rec., Senate, Sept. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-2-2.pdf). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). See [[cal.1964-07-24.baker]]; [[cal.1963-10-07.baker]]. Names: Williams.'
    tags: [name:williams-john-j]
  - id: cal.1964-09-13.vietnam
    when: Sept. 13–14
    date: '1964-09-13'
    thread: vietnam-saigon
    c: Saigon. Generals Lâm Văn Phát and Dương Văn Đức bring troops into the city before dawn and announce Khánh's overthrow. Washington refuses Khánh's request for American help. No support; the troops withdraw on the 14th.
    n: 'FRUS 1964–68, I, docs. [347](https://history.state.gov/historicaldocuments/frus1964-68v01/d347), [352](https://history.state.gov/historicaldocuments/frus1964-68v01/d352). [[w.cosmas-joint-chiefs-of-staff-2012]], 121. To check: [[w.shaplen-lost-revolution]]; [[w.ahern-cia-and-the-generals]]; [[w.lam-history-of-south-vietnam-2021]]; [[w.johnson-right-hand-of-power]]; [[w.taylor-swords-and-plowshares]]; [[w.ky-twenty-years-and-twenty]]; [[w.kahin-intervention]]. See [[cal.1964-08-16.vietnam]]. Names: Lâm Văn Phát, Dương Văn Đức, Nguyễn Khánh.'
    tags: [name:lam-van-phat, name:duong-van-duc, name:nguyen-khanh, place:saigon]
  - id: cal.1964-09-14.desegregation-schools-nyc
    when: Sept. 14
    date: '1964-09-14'
    thread: desegregation-schools
    c: New York. Parents and Taxpayers, white parents' groups of Queens and Brooklyn, keep their children home against the pairing of schools to mix them by race, at the opening of the term. Check the dates and the count.
    n: 'To check: [[w.ravitch-great-school-wars]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.taylor-knocking-at-our-own]]. See [[cal.1964-02-03.desegregation-schools]].'
    tags: [state:ny, city:nyc]
  - id: cal.1964-09-14.amendments
    when: Sept. 14
    date: '1964-09-14'
    thread: amendments
    also: [women, congress]
    c: Senate Judiciary reports the equal rights amendment, S.J. Res. 45, without amendment, Bayh filing the report. Passed over at the call of the calendar Sept. 24; no vote.
    n: 'S. Rep. No. 88-1558, [110 Cong. Rec. 22,025](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-4-2.pdf) (1964); [22,852](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-13-2.pdf). See [[cal.1960-07-02.amendments]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1964-09-15.governors-wa
    when: Sept. 15
    date: '1964-09-15'
    thread: governors
    also: [elections-1964]
    c: 'Washington''s blanket primary, for governor: Evans (R), a State representative, 323,152, 39.1 percent; Governor Rosellini (D), seeking a third term, 243,220, 29.4; Christensen (R) 213,217, 25.8. Evans and Rosellini nominated.'
    n: 'Votes: [Wikipedia, "1964 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1964_Washington_gubernatorial_election); Check: Wash. *Official Abstract of Votes, State Primary, September 15, 1964*, 7. To check: [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. Names: Evans, Rosellini, Christensen.'
    tags: [state:wa, name:evans-daniel-j, name:rosellini-albert-d, name:christensen-richard-g]
  - id: cal.1964-09-15.governors-ma
    when: Sept. 15
    date: '1964-09-15'
    thread: governors
    also: [elections-1964]
    c: Massachusetts primary. Bellotti, the lieutenant governor, takes the Democratic nomination for governor from Peabody, 363,675 to 336,780, 49.6 percent to 45.9; two others. Hicks second for treasurer, 24.5 percent. Volpe unopposed for the Republican nomination.
    n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 217](https://archive.org/details/electionstatisti1964mass/page/n222). [Wikipedia, "1964 Massachusetts elections"](https://en.wikipedia.org/wiki/1964_Massachusetts_elections). See [[cal.1964-06-19.congress]]. Names: Bellotti, Peabody, Hicks, Volpe.'
    tags: [state:ma, name:bellotti-francis-x, name:peabody-endicott, name:hicks-louise-d, name:volpe-john-a]
  - id: cal.1964-09-16.elections-1964
    when: Sept. 16
    date: '1964-09-16'
    thread: elections-1964
    also: [goldwater, south-carolina]
    c: 'Thurmond, on South Carolina television, leaves the Democratic party for the Republican, to campaign for Goldwater: "The Democratic Party has abandoned the people."'
    n: 'The address: [110 Cong. Rec., Senate, Sept. 17, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-7-1.pdf), printed by Simpson. To check: [[w.crespino-strom-thurmonds-america]]; [[w.bass-strom]]; [[w.cosman-five-states-for-goldwater]]. See [[cal.1964-09-07.elections-1964]]. Names: Thurmond, Goldwater.'
    tags: [name:thurmond-strom, name:goldwater-barry-m]
  - id: cal.1964-09-17.desegregation-public-places
    when: Sept. 17
    date: '1964-09-17'
    thread: desegregation-public-places
    also: [alabama, civil-rights-bill]
    c: 'Birmingham. Ollie''s Barbecue, eleven blocks from the nearest interstate highway: some $150,000 of food a year, bought locally, $69,783 of it meat shipped from outside the State. A three-judge court holds Title II, applied to it, beyond the power of Congress, and enjoins its enforcement against the owners. Oct. 5, the Supreme Court notes probable jurisdiction.'
    n: '*McClung v. Katzenbach*, [233 F. Supp. 815](https://static.case.law/f-supp/233/case-pdfs/0815-01.pdf) (N.D. Ala. 1964). Reversed: [[cal.1964-12-14.court]]. To check: [[w.powe-warren-court-and-american]]. See [[cal.1964-07-03.civil-rights-bill]].'
  - id: cal.1964-09-17.governors-ri
    when: Sept. 17
    date: '1964-09-17'
    thread: governors
    also: [elections-1964]
    c: Rhode Island's Democratic primary for governor. Gallogly, the lieutenant governor, 55,282, 56.7 percent, over two others. Chafee renominated.
    n: '[R.I. Board of Elections, *Official Count*, 1964, p. 15](https://elections.ri.gov/sites/g/files/xkgbur756/files/publications/Election_Publications/Countbooks/1964-Count-Book.pdf#page=15); Chafee over Gallogly in November, 239,501 to 152,165, p. 43. See [[cal.1962-11-06.governors-ri]]. Names: Gallogly, Chafee.'
    tags: [state:ri, name:gallogly-edward-p, name:chafee-john-h]
  - id: cal.1964-09-18.vietnam
    when: Sept. 18–19
    date: '1964-09-18'
    thread: vietnam
    c: Gulf of Tonkin, night of Sept. 18. The destroyers Morton and Richard S. Edwards, on patrol, fire on radar contacts. Johnson doubts the evidence; strikes on the North prepared, then called off. No attack proven.
    n: '[FRUS 1964–68, I, doc. 356](https://history.state.gov/historicaldocuments/frus1964-68v01/d356). [[w.gibbons-u-s-government-and]], II, 354–355; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 525; [[w.cosmas-joint-chiefs-of-staff-2012]], 133; [[w.marolda-united-states-navy-and]], 454–458. To check: [[w.moise-tonkin-gulf-and-the-2019]]. See [[cal.1964-08-02.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rusk-dean, name:bundy-mcgeorge, place:gulf-of-tonkin]
  - id: cal.1964-09-18.opinion
    when: Sept. 18
    date: '1964-09-18'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Aug. 27–Sept. 1, by region: East, Johnson 73, Goldwater 21; Midwest, Johnson 69, Goldwater 25; South, Goldwater 47, Johnson 46; West, Johnson 66, Goldwater 30.'
    n: '[[w.gallup-poll]], III, 1902. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-09-18.legislatures-va
    when: Sept. 18
    date: '1964-09-18'
    thread: legislatures
    c: 'Virginia. On the mandate in *Davis v. Mann*, the three-judge court reaffirms its order of 1962: the terms of the senators and delegates elected in 1963 to end by January 1966; enforcement stayed to Dec. 15 for a special session to reapportion. The General Assembly reapportions both houses in special session before then (Check: its dates).'
    n: '*Mann v. Davis*, [238 F. Supp. 458](https://static.case.law/f-supp/238/case-pdfs/0458-01.pdf) (E.D. Va. 1964). See [[cal.1962-11-28.legislatures-va]]; [[cal.1964-06-15.court]].'
    tags: [state:va]
  - id: cal.1964-09-22.latin-america
    when: Sept. 22
    date: '1964-09-22'
    thread: latin-america
    c: 'Sea-level canal study signed, [78 Stat. 990](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg990.pdf): a commission of five to choose a site for a canal at sea level across the isthmus. House, Sept. 1, [320–23](https://voteview.com/rollcall/RH0880222).'
    n: 'Statement by the President Upon Approving Bill Providing for a Site Study for a New Interoceanic Canal, [1963–64 Pub. Papers 1116](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=356) (Sept. 24, 1964). See [[cal.1964-01-09.latin-america]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-09-24.assassination
    when: Sept. 24
    date: '1964-09-24'
    thread: assassination
    c: 'Warren gives Johnson the Commission''s report: Oswald fired the shots, alone; Ruby acted alone; no evidence of a conspiracy, foreign or domestic. 888 pages; made public Sept. 27. Twenty-six volumes of hearings and exhibits follow in November.'
    n: 'Letter to the Chief Justice Upon Receipt of the Warren Commission Report, [1963–64 Pub. Papers 1116](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=356) (Sept. 24, 1964). [[w.report-of-the-presidents-1964]], [govinfo](https://www.govinfo.gov/content/pkg/GPO-WARRENCOMMISSIONREPORT/pdf/GPO-WARRENCOMMISSIONREPORT.pdf). See [[cal.1963-11-29.assassination]]. Names: Warren, Johnson, Oswald, Ruby.'
    tags: [name:warren-earl, name:johnson-lyndon-b, name:oswald-lee-harvey, name:ruby-jack]
  - id: cal.1964-09-24.mississippi
    when: Sept. 24
    date: '1964-09-24'
    thread: mississippi
    c: 'Oval Office, 1:10 p.m. Johnson, with Lee White, sees three Negro women of McComb whose houses had been bombed, Aylene Quin''s Sept. 20 with her two children asleep: the sheriff''s claim that the victims set the bombs; Negroes afraid to report; a branch office of the FBI. Oct. 23, nine white men plead guilty to the bombings in the county court, are sentenced to five years and freed on probation, the judge finding them "unduly provoked."'
    n: '[Johnson, Ora Bryant, Mattie Dillon, Aylene Quin, and Lee White, 1:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lee-white-september-24-1964), Conversation WH6409-14-5666, 5667 (Miller Center); [Johnson and Lee White, 5:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lee-white-september-24-1964-1), Conversation WH6409-15-5681 (Miller Center). [Affidavit of Aylene Quin](https://www.crmvet.org/nars/aff/640920_sncc_mcc_quin_affidavit.pdf) (SNCC, Sept. 1964). *The Student Voice*, [Nov. 25, 1964](https://www.crmvet.org/docs/sv/sv641125.pdf). [[w.dittmer-local-people]], 306–11. To check: [[w.payne-ive-got-the-light]]. See [[cal.1964-06-14.mississippi]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson, White, Quin.'
    tags: [name:johnson-lyndon-b, name:white-lee-c, name:quin-aylene]
  - id: cal.1964-09-25.latin-america
    when: Sept. 25
    date: '1964-09-25'
    thread: latin-america
    c: Johnson and López Mateos at El Paso mark the Chamizal settlement. "Let Chamizal stand as a symbol to all the world that the most troublesome of problems can yield to the tools of peace."
    n: 'Remarks in El Paso at a Ceremony Marking the Settlement of the Chamizal Dispute, [1963–64 Pub. Papers 1117](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=357) (Sept. 25, 1964). To check: [[w.liss-century-of-disagreement]]. See [[cal.1963-12-17.latin-america]]. Names: Johnson, López Mateos.'
    tags: [name:johnson-lyndon-b, name:lopez-mateos-adolfo]
  - id: cal.1964-09-25.jobs-and-wages
    when: Sept. 25
    date: '1964-09-25'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Senate passes the Appalachian Regional Development Act, S. 2782, [45–13](https://voteview.com/rollcall/RS0880528): $1.06 billion for the eleven States of the region. The House does not act.'
    n: '[110 Cong. Rec., Senate, Sept. 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt17/pdf/GPO-CRECB-1964-pt17-14-1.pdf). See [[cal.1961-05-01.program]].'
  - id: cal.1964-09-25.opinion
    when: Sept. 25
    date: '1964-09-25'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, Aug. 27–Sept. 1, the words to describe each. Johnson: well-qualified 63 percent, experienced 62, intelligent 56, good judgment 46, honest 42. Goldwater: intelligent 33, forceful 31, poor judgment 26, not well-qualified 25, honest 24, reckless 24.'
    n: '[[w.gallup-poll]], III, 1902–03. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-09-26.states-and-cities
    when: Sept. 26
    date: '1964-09-26'
    thread: states-and-cities
    c: 'Hoover''s report on the summer''s riots, Harlem to Philadelphia, made public: no pattern from city to city, no national organization; communities "with economic and social problems crying out for solution." Riot training for police from the FBI and the Army.'
    n: 'Statement by the President Upon Making Public an FBI Report on the Recent Urban Riots, [1963–64 Pub. Papers 1137](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=377) (Sept. 26, 1964). See [[cal.1964-07-18.states-and-cities]]; [[cal.1964-07-24.states-and-cities]]. Names: Hoover, Johnson.'
    tags: [name:hoover-j-edgar, name:johnson-lyndon-b]
  - id: cal.1964-09-28.succession
    when: Sept. 28–29
    date: '1964-09-28'
    thread: succession
    also: [amendments]
    c: Senate passes Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 139, by voice vote. On Stennis's motion, again Sept. 29, [65–0](https://voteview.com/rollcall/RS0880530), so the record shows two-thirds. The House does not act.
    n: '[110 Cong. Rec., Senate, Sept. 29, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-1-1.pdf). See [[cal.1963-11-22.succession]]. Names: Bayh, Stennis.'
    tags: [name:bayh-birch, name:stennis-john-c]
  - id: cal.1964-09.goldwater
    when: Sept.
    date: 1964-09
    thread: goldwater
    also: [elections-1964]
    c: '*Fact*, September–October issue: "The Unconscious of a Conservative: A Special Issue on the Mind of Barry Goldwater." Its poll of 12,356 psychiatrists: 2,417 answer; 1,189 call him unfit for the Presidency, 657 fit, 571 cannot say. Advertised in mid-September. Sept. 1965, Goldwater sues the magazine, its publisher Ginzburg and its managing editor for libel.'
    n: '*Goldwater v. Ginzburg*, [414 F.2d 324](https://static.case.law/f2d/414/case-pdfs/0324-01.pdf) (2d Cir. 1969). *Goldwater v. Ginzburg* (Opp. II.H.1). [[w.perlstein-before-the-storm]], 438–39 (Ginzburg and the poll). Names: Goldwater, Ginzburg.'
    tags: [name:goldwater-barry-m, name:ginzburg-ralph]
  - id: cal.1964-09-29.legislatures-pa
    when: Sept. 29
    date: '1964-09-29'
    thread: legislatures
    c: '*Butcher v. Bloom*: the Pennsylvania Supreme Court holds the General Assembly''s apportionment acts of 1964 invalid under the Fourteenth Amendment, the State Constitution''s provisions construed as valid. The 1964 elections to go forward; the General Assembly to reapportion by Sept. 1, 1965, or the court will.'
    n: '*Butcher v. Bloom*, [415 Pa. 438](https://static.case.law/pa/415/case-pdfs/0438-01.pdf), 203 A.2d 556 (1964). *Scranton v. Drew*, [379 U.S. 40](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379040/usrep379040.pdf) (1964). To check: [[w.dixon-democratic-representation]]; [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1964-06-15.court]].'
    tags: [state:pa]
  - id: cal.1964-09-29.legislatures-ok
    when: Sept. 29
    date: '1964-09-29'
    thread: legislatures
    c: Oklahoma. Special primaries for the Legislature, under the court's apportionment.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 45](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=45) (note). See [[cal.1964-08-07.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1964-09.vietnam
    when: Sept.
    date: 1964-09
    thread: vietnam
    c: The Politburo resolves to seek a decisive victory in the South within a few years by main-force campaigns. Nguyễn Chí Thanh, of the Politburo, sent south with senior cadres to direct them.
    n: '[[w.vietnam-victory-in-vietnam]], 137–38; [[w.asselin-hanois-road-to-the]], 198–99 (the Politburo, Sept. 25–29; Nguyễn Chí Thanh sent south); [[w.nguyen-hanois-war]], 73 (Thanh at COSVN''s headquarters in Tây Ninh by October). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1963-12.vietnam]]. Names: Nguyễn Chí Thanh. Check: Nguyen, 63, 65, has Thanh named to command in the South after the Ninth Plenum, and leaving in mid-1964 (73).'
    tags: [name:nguyen-chi-thanh]
  - id: cal.1964-09-29.mississippi
    when: Sept. 29
    date: '1964-09-29'
    thread: mississippi
    c: McComb. Paul Johnson, with T. B. Birdsong of the Highway Patrol, tells Pike County's officials he will send in a battalion of the National Guard; at their plea he gives them forty-eight hours.
    n: '[[w.dittmer-local-people]], 309–11. The first of the bombers arrested the next day, eleven within the week: Dittmer, 310–11. Check: the call from the Justice Department, before Johnson''s, that troops were being alerted (Dittmer, 310, and its note). See [[cal.1964-09-24.mississippi]]. Names: Paul Johnson, Birdsong.'
    tags: [state:ms, name:johnson-paul-b-jr, name:birdsong-t-b]
