  - id: cal.1964-09-03.conservation
    when: Sept. 3
    date: '1964-09-03'
    thread: conservation
    c: 'Wilderness Act, [78 Stat. 890](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg890.pdf), and Land and Water Conservation Fund Act, [78 Stat. 897](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg897.pdf), signed. Wilderness: 9.1 million acres of national forest in 54 areas; no permanent roads or commercial enterprise; mining claims allowed through 1983; more by act of Congress. The fund, from park fees, surplus property sales, and the motorboat fuel tax, for federal and State recreation lands. Senate on the fund, Aug. 12, [92–1](https://voteview.com/rollcall/RS0880500).'
    n: 'Wilderness Act (K–J Cong. II.J.2). Remarks Upon Signing the Wilderness Bill and the Land and Water Conservation Fund Bill, [1963–64 Pub. Papers 1033](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=273) (Sept. 3, 1964). [[w.sundquist-politics-and-policy]], 358 (the fund, about $200 million a year for recreation land). To check: [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]. See [[cal.1964-07-30.conservation]]. See [[cal.1962-03-01.conservation]]. Names: Johnson, Anderson, Jackson, Aspinall, Udall.'
