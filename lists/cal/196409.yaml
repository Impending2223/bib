  - id: cal.1964-09-03.elections-1964
    when: Sept. 3
    date: '1964-09-03'
    thread: elections-1964
    c: 'Moyers to Johnson: Fortas and Clifford advise against *Meet the Press*, *Face the Nation* and the rest, "too commercial, not controllable, and unsuitable for the President"; an appearance "either before or after Goldwater" would "build the Senator an audience he could not otherwise get." Johnson agrees.'
    n: '[[w.young-two-suns-of-the]], 152. To check: Moyers to Johnson, Sept. 3, 1964, PL 2 Aug. 26–Sept. 5, 1964, box 83, WHCF, LBJ Library (cited by [[w.young-two-suns-of-the]], 152 n.29b). See [[cal.1964-08-20.elections-1964]]. Names: Moyers, Johnson, Fortas, Clifford, Goldwater.'
