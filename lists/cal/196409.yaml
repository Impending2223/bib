      c: a04ee3bf
      rows:
        - 'w.young-two-suns-of-the 152: all'
        - 'via w.young-two-suns-of-the 152 n.29b: A'
    tags: [name:moyers-bill, name:johnson-lyndon-b, name:fortas-abe, name:clifford-clark, name:goldwater-barry-m]
  - id: cal.1964-09-04.latin-america
    when: Sept. 4
    date: '1964-09-04'
    thread: latin-america
    c: 'Chile. Frei, the Christian Democrat, elected President with 56 percent; Allende, of the Popular Action Front, 39. The CIA had given Frei money and organization, and run propaganda against Allende. Johnson, Sept. 5: "an internal matter in which the people of Chile were the only judges."'
    n: '[FRUS 1964–68, XXXI, docs. 269](https://history.state.gov/historicaldocuments/frus1964-68v31/d269), [270](https://history.state.gov/historicaldocuments/frus1964-68v31/d270). The President''s News Conference, [1963–64 Pub. Papers 1040](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=280) (Sept. 5, 1964). S. Select Comm. to Study Governmental Operations with Respect to Intelligence Activities, *Covert Action in Chile, 1963–1973*, 94th Cong. (Comm. Print 1975). Check: the counts, and the shares to one decimal. To check: [[w.rabe-killing-zone]]. Names: Frei Montalva, Allende Gossens, Johnson.'
    tags: [name:frei-montalva-eduardo, name:allende-gossens-salvador, name:johnson-lyndon-b]
  - id: cal.1964-09-04.opinion
    when: Sept. 4
    date: '1964-09-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Aug. 27–Sept. 1: the party more likely to keep the country out of World War III: Democratic 44 percent, Republican 20, no difference 20. To keep it prosperous: Democratic 53, Republican 21, no difference 12.'
    n: '[[w.gallup-poll]], III, 1900.'
