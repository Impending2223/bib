  - id: cal.1964-09-02.medicare
    when: Sept. 2
    date: '1964-09-02'
    thread: medicare
    c: 'Senate adds hospital insurance for the aged to the Social Security bill, H.R. 11865: Gore''s amendment, [49–44](https://voteview.com/rollcall/RS0880509). Passed Sept. 3, [60–28](https://voteview.com/rollcall/RS0880511), with a $7 monthly rise in benefits. The House conferees will not take Medicare; the bill dies in conference at adjournment, Oct. 3.'
    n: '[110 Cong. Rec., Senate, Sept. 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt16/pdf/GPO-CRECB-1964-pt16-5-1.pdf). Statement by the President Following Senate Passage of the Medicare Bill, [1963–64 Pub. Papers 1032](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=272) (Sept. 2, 1964): "the first time either House of Congress has endorsed health care for the aged under the social security system." [[w.marmor-politics-of-medicare]];[[w.zelizer-taxing-america]], 229–30 (the Senate''s vote; Mills and the House conferees against). [[w.sundquist-politics-and-policy]], 316–17 (Gore''s amendment, 49–44; the conference); [[w.bernstein-guns-or-butter]], 167–68 (42 to 42 at first; Goldwater flown in from Arizona; adopted on the third ballot; passed Sept. 3, 60 to 28; the conferees named). Check: Bernstein, 167, gives the Gore amendment 49 to 46. To check: [[w.harris-sacred-trust]]; [[w.blumenthal-heart-of-power]]; [[w.david-with-dignity]]; Henry Hall Wilson to O''Brien, June 21, 1964; Cohen to O''Brien, Aug. 13, 1964; O''Brien to Johnson, Sept. 13, 1964; Wilson to O''Brien, Sept. 20, 1964, White House Office Aides Files, Henry Hall Wilson, LBJ Library (cited by [[w.zelizer-taxing-america]], 230 n.72). See [[cal.1964-07-29.medicare]]; [[cal.1961-02-09.medicare]]. Names: Gore, Johnson.'
