  - id: cal.1966-10-03.robert-kennedy
    when: Oct. 3
    date: '1966-10-03'
    thread: robert-kennedy
    also: [poverty]
    c: 'Robert Kennedy in the Senate for the committee''s authorization of the war on poverty, $2.5 billion against the President''s $1.75 billion: of 950,000 new jobs for teenagers last year some 33,000, about 3 percent, went to Negroes; "Negroes, 11 percent of the population, suffer 22 percent of all combat deaths in the jungles of Vietnam." "No Government program now operating gives any substantial promise of meeting the unemployment crisis affecting the Negro of the cities."'
    n: 'Kennedy''s speech, [112 Cong. Rec. 24794–96 (1966)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-6-1.pdf#page=50) (Senate, Oct. 3, 1966). [[w.palermo-in-his-own-right]], 167, 174. Names: Robert Kennedy.'
