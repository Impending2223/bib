    when: Oct., late
    date: 1966-10
    at: before 1966-10-21
    place: peking
    thread: china-red-guards
    c: 'The "Red Cannon Squad" 紅炮班 of the University of Science and Technology of China 中國科技大學 puts up the poster "Long live Chairman Mao''s theory of the proletarian class struggle" 〈毛主席的無產階級階級鬥爭學說萬歲〉: the masses have no vote over the Party''s organs at every level and cannot supervise them, which breeds revisionism and bureaucratism.'
