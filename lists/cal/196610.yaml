  - id: cal.1966-10-24.china-leadership
    when: Oct. 24
    date: '1966-10-24'
    place: peking
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Peking, the pool, evening. Mao to Politburo members and bureau heads: the conference is nearly done. The students have made mistakes, but we "lords" mostly;{1} never admit "anti-Party, anti-socialist": could one still work?{2} Liu''s and Deng''s posters should not be put in the streets;{3} let them err;{4} allow people to make revolution (Lu Xun''s *Ah Q*, "not allowed to make revolution").{5} The disorder came from the Center: he had not foreseen that one poster of Nie Yuanzi''s, the Red Guards and the national link-ups would make so much of it. Five months'' experience; five years needed.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 80–81 (Oct. 24, 1966; Zhou at the report meeting at Mao''s; Mao on the wall posters against Liu and Deng, on Ah Q and on "mixing mud", and on the Eighth Congress report, which the Congress passed); [[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 24, 1966; evening, 晚; Deng at Mao''s meeting, where Mao on Liu Shaoqi and Deng says the posters against them are not to be put in the streets; they are to be allowed to make revolution and to correct themselves, and the two alone are not to be held responsible for the Eighth Congress reports, which all read and the Congress passed); [[w.mao-zedong-zhuan]], VI, ch. 75 n.20 (Oct. 24, in the evening, hearing the conference''s reports, Mao makes many interjections to put the leading cadres at ease: ''I did not foresee that one poster of Nie Yuanzi''s, one Red Guard, one national link-up would make so large a thing''; ''never admit anti-Party, anti-socialist, could one then work?''; to Li Jingquan: do not admit it, to put the Center bureaus, provinces and cities down and have students succeed them, would that do?; ''Liu''s and Deng''s posters should not be put in the streets, let them make revolution, do not forbid it, tell the students to read Lu Xun''s *Ah Q*''; ''do not wipe out comrade Shaoqi with one stroke''; ''Liu and Deng act in the open, not in secret''; ''Liu and Deng are to be allowed to change; they say I mix mud, then I do''; n.20). [[w.mao-zedong-zhuan]], VI, ch. 77 n.42 (ch. 77 gives from Mao''s speech at the Central Work Conference, Oct. 24, 1966 (the note''s title), n.42: ''one cannot write off Comrade Shaoqi with one stroke; Liu and Deng act openly, not in secret; Liu and Deng must be allowed to make revolution, allowed to change; if they say I mix mud, then I do mix mud''; the book adds that Mao did not approve of posting big-character posters on Liu and Deng in public or of quoting ''Bombard the headquarters'' in the papers and accepted in the main Liu''s self-criticism at the work conference). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, interjections at the report meeting 汇报会 of the Central Work Conference (record 插话记录), Oct. 24, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.20); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议 (record 讲话记录), Oct. 24, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.42). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Nie Yuanzi, Lu Xun.'
    src:
      c: e1ef00e0
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 24, 1966: 1, 2, 3, 4, 5, 6'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 80–81: ?'
