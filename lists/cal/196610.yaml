section: LXXXIV
entries:
  - id: cal.1966-10-02.opinion
    when: Oct. 2
    date: '1966-10-02'
    thread: opinion
    also: [defense]
    c: 'Gallup, Sept. 8–13: every able-bodied man of 18 required to serve a year in the armed forces: yes 69 percent, no 24.'
    n: '[[w.gallup-poll]], III, 2032.'
  - id: cal.1966-10-03.poverty
    when: Oct. 3
    date: '1966-10-03'
    thread: poverty
    also: [mississippi]
    c: 'OEO refuses the Child Development Group of Mississippi a new grant: its Head Start centers to the counties'' Community Action boards and to Mississippi Action for Progress, chartered Sept. 13 at Shriver''s request by Owen Cooper, LeRoy Percy and Hodding Carter III.'
    n: '[[w.dittmer-local-people]], 376–79. Check: Dittmer, 377, on the Senate investigator''s report to Stennis, Aug. 5, and Shriver''s compliance. See [[cal.1965-06-29.poverty]]. Names: Shriver, Cooper, Percy, Hodding Carter III.'
    tags: [state:ms, name:shriver-r-sargent, name:cooper-owen, name:percy-leroy, name:carter-hodding-iii]
  - id: cal.1966-10-04.poverty
    when: Oct. 4
    date: '1966-10-04'
    thread: poverty
    c: 'Economic Opportunity Amendments, S. 3164, in the Senate: Dirksen''s cut of the authorization to the budget''s $1.75 billion taken, [45–27](https://voteview.com/rollcall/RS0890466); an amendment barring aid to anyone who incited or carried on a riot, [39–32](https://voteview.com/rollcall/RS0890468); passed, [49–20](https://voteview.com/rollcall/RS0890469).'
    n: '[112 Cong. Rec., Senate, Oct. 4, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-7-2.pdf). See [[cal.1966-09-29.poverty]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-10-05.opinion
    when: Oct. 5
    date: '1966-10-05'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 18–23, on a scale from plus 5 to minus 5: highly favorable, plus 4 or 5, Nixon 22 percent, Romney 16. Republicans 40 and 24; independents 20 and 16; Democrats 12 and 10. Unable to rate: Nixon 4, Romney 25.'
    n: '[[w.gallup-poll]], III, 2032. Names: Nixon, Romney.'
    tags: [name:nixon-richard-m, name:romney-george-w]
  - id: cal.1966-10-05.africa
    when: Oct. 5
    date: '1966-10-05'
    thread: africa
    also: [foreign-aid]
    c: 'NSAM 356: Johnson approves in principle Korry''s report on development policy in Africa, with a larger part for the World Bank; State to have a program carrying out its other recommendations in effect by Dec. 1.'
    n: 'FRUS 1964–68, XXIV, docs. [215](https://history.state.gov/historicaldocuments/frus1964-68v24/d215), [221](https://history.state.gov/historicaldocuments/frus1964-68v24/d221) (NSAM 356). Made public: FRUS 1964–68, XXIV (1999). To check: [[w.lyons-keeping-africa-off-the]]. See [[cal.1966-05-26.africa]]. Names: Korry.'
    tags: [name:johnson-lyndon-b, name:korry-edward-m]
  - id: cal.1966-10-06.school-aid
    when: Oct. 6
    date: '1966-10-06'
    thread: school-aid
    also: [desegregation-schools]
    c: 'Elementary and Secondary Education Amendments. House: an amendment holding the Commissioner of Education to the Civil Rights Act''s procedures before he withholds funds from a district, [220–116](https://voteview.com/rollcall/RH0890361) (Check its terms); recommittal, to cut $343 million, refused, [150–185](https://voteview.com/rollcall/RH0890362); passed, [237–97](https://voteview.com/rollcall/RH0890363). The Senate passed its bill the same day, [54–16](https://voteview.com/rollcall/RS0890477).'
    n: '[112 Cong. Rec., House, Oct. 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-2-2.pdf); [112 Cong. Rec., Senate, Oct. 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-2-1.pdf). To check: [[w.graham-uncertain-triumph]]; [[w.orfield-reconstruction-of-southern-education]]. See [[cal.1965-01-12.school-aid]].'
  - id: cal.1966-10-07.europe-and-the-alliance
    when: Oct. 7
    date: '1966-10-07'
    thread: europe-and-the-alliance
    also: [soviet-union, european-community]
    c: 'Johnson to the National Conference of Editorial Writers, New York: from "the narrow concept of coexistence" to "peaceful engagement" with the East; the unification of Germany "in the context of a larger, peaceful, and prosperous Europe." Export controls eased on hundreds of nonstrategic items; the Export-Import Bank to guarantee commercial credits to Poland, Hungary, Bulgaria and Czechoslovakia; action asked on the consular convention with the Soviet Union. A "gradual and balanced revision in force levels on both sides" possible.'
    n: 'Remarks in New York City Before the National Conference of Editorial Writers, [1966 Pub. Papers 1125](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=499) (Oct. 7, 1966). [[w.schwartz-lyndon-johnson-and-europe]], 133–36. To check: [[w.brands-wages-of-globalism]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-07.opinion
    when: Oct. 7
    date: '1966-10-07'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Sept. 8–13: the party more likely to keep the country out of World War III: Republican 27 percent, Democratic 24, no difference 30.'
    n: '[[w.gallup-poll]], III, 2032.'
  - id: cal.1966-10-09.opinion
    when: Oct. 9
    date: '1966-10-09'
    thread: opinion
    also: [china]
    c: 'Gallup, Sept. 8–13: Communist China admitted to the UN: should 25 percent, should not 56; persons in *Who''s Who in America*, 64 and 32. Admission if it would improve relations: favor 55, oppose 30. If the UN votes to admit it, the United States to go along: should 53, should not 33. Britain, Peking admitted: the public 54 should, 21 not; persons in the British *Who''s Who*, 86 and 8.'
    n: '[[w.gallup-poll]], III, 2032–33.'
  - id: cal.1966-10-10.vietnam
    when: Oct. 10–13
    date: '1966-10-10'
    thread: vietnam
    c: McNamara in Vietnam, Katzenbach with him.
    n: 'His report, Oct. 14: FRUS 1964–68, IV, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268). To check: [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.gibbons-u-s-government-and]], IV, 450–57; [[w.herring-lbj-and-vietnam]]. Names: McNamara, Katzenbach.'
    tags: [name:mcnamara-robert-s, name:katzenbach-nicholas]
  - id: cal.1966-10-10.soviet-union
    when: Oct. 10
    date: '1966-10-10'
    thread: soviet-union
    also: [testing, vietnam]
    c: 'Gromyko at the White House with Dobrynin, 5 to 6:41 p.m.; Rusk and Thompson with Johnson. Most of the talk is Vietnam. On a nonproliferation treaty Gromyko: the Soviet Union ready to sign "in two weeks" once a text is agreed; no nuclear weapons to the national control of non-nuclear powers, nor to any grouping that includes them. Johnson: by law no one but the President may decide to fire American nuclear weapons. Rusk and Gromyko had gone over treaty language in New York, Sept. 22–24.'
    n: 'FRUS 1964–68, XIV, doc. [178](https://history.state.gov/historicaldocuments/frus1964-68v14/d178); XI, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v11/d153), [157](https://history.state.gov/historicaldocuments/frus1964-68v11/d157); IV, doc. [264](https://history.state.gov/historicaldocuments/frus1964-68v04/d264). [[w.dobrynin-in-confidence]], 144–145; [[w.johnson-vantage-point]], 248–49, 477 (Rusk and Gromyko in New York, Sept. 22 and 24); [[w.poole-joint-chiefs-of-staff-2012]], 78. [[w.gibbons-u-s-government-and]], IV, 442–43. To check: [[w.seaborg-stemming-the-tide]]. Names: Gromyko, Dobrynin, Rusk, Thompson, Johnson.'
    tags: [name:gromyko-andrei, name:dobrynin-anatoly, name:rusk-dean, name:thompson-llewellyn-e, name:johnson-lyndon-b]
  - id: cal.1966-10-11.welfare
    when: Oct. 11
    date: '1966-10-11'
    thread: welfare
    also: [poverty]
    c: 'Child Nutrition Act signed, [80 Stat. 885](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg885.pdf): a pilot program of school breakfasts, $7.5 million for fiscal 1967 and $10 million for 1968; food for children in preschool programs; aid for kitchen equipment to schools that cannot afford it; part of the States'' costs of running the programs.'
    n: 'Remarks at the Signing of the Child Nutrition Act of 1966, [1966 Pub. Papers 1140](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=514) (Oct. 11, 1966). To check: [[w.levine-school-lunch-politics]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-12.program
    when: Oct. 12–13
    date: '1966-10-12'
    thread: program
    also: [congress]
    c: 'Long''s Presidential Election Campaign Fund, a title of the Foreign Investors Tax Act, H.R. 13103: each taxpayer may direct $1 of his income tax to a fund paid out to the parties whose candidates had 15 million votes or more in the last presidential election. A motion to strike it lost in the Senate, [33–39](https://voteview.com/rollcall/RS0890484); the bill passed Oct. 13, [58–18](https://voteview.com/rollcall/RS0890489).'
    n: '[112 Cong. Rec., Senate, Oct. 12, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-7-2.pdf). To check: [[w.mann-legacy-to-power]]. Names: Long.'
    tags: [name:long-russell-b]
  - id: cal.1966-10-12.opinion
    when: Oct. 12
    date: '1966-10-12'
    thread: opinion
    also: [elections-1966, economy]
    c: 'Gallup, Oct. 2–7: the party to do the best job of keeping the country prosperous: Democratic 41 percent, Republican 24, no difference 19. To keep prices down: Republican 32, Democratic 25, no difference 26.'
    n: '[[w.gallup-poll]], III, 2033.'
  - id: cal.1966-10-13.vietnam-congress
    when: Oct. 13
    date: '1966-10-13'
    thread: vietnam-congress
    c: 'Stennis in the Senate, the day McNamara is back from Saigon: "It is time that we take a good hard look at the realities"; a nation with little industry has tied us down; "prepare for the long pull," some Great Society programs deferred. Symington with him; Thurmond for the "full power" of the United States.'
    n: '[112 Cong. Rec. 26537–41](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-1-1.pdf) (Oct. 13, 1966). [[w.gibbons-u-s-government-and]], IV, 421. Gibbons prints the pages "16537-26541." See [[cal.1966-10-14.vietnam]]. Names: Stennis, McNamara, Symington, Thurmond.'
    tags: [name:stennis-john-c, name:mcnamara-robert-s, name:symington-william-s, name:thurmond-strom]
  - id: cal.1966-10-13.students
    when: Oct. 13
    date: '1966-10-13'
    thread: students
    also: [vietnam-congress]
    c: The House passes Pool's bill, H.R. 12047, against aid to an enemy in an undeclared war and obstruction of the armed forces' movements, [275–64](https://voteview.com/rollcall/RH0890367), after seven quorum calls; 56 Democrats and 8 Republicans against. Justice and Defense had called it unnecessary. It dies in the Senate's Judiciary Committee.
    n: '[112 Cong. Rec., House, Oct. 13, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-1-2.pdf). [[w.gibbons-u-s-government-and]], IV, 429–30. Gibbons has the debate on Oct. 12; the vote, 112 Cong. Rec. 26592–93, is in the House''s day of Oct. 13. See [[cal.1966-08-16.students]]. Names: Pool.'
    tags: [name:pool-joe-r]
  - id: cal.1966-10-13.vietnam-congress-2
    when: Oct. 13
    date: '1966-10-13'
    thread: vietnam-congress
    c: 'Mansfield to Johnson, privately: raising the military ante "gets us in deeper all the time, with no terminus in sight." Stop bombing the North and agree to an immediate hold-fire, then a cease-fire and negotiations, the NLF a party; a token withdrawal of 30,000 men in the first week; U Thant to carry the terms to Hanoi. Johnson''s reply perfunctory.'
    n: 'FRUS 1964–68, IV, doc. [266](https://history.state.gov/historicaldocuments/frus1964-68v04/d266). [[w.gibbons-u-s-government-and]], IV, 447. Made public: FRUS 1964–68, IV (1998). Names: Mansfield, Johnson, U Thant.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:u-thant]
  - id: cal.1966-10-14.cities-and-housing
    when: Oct. 14
    date: '1966-10-14'
    thread: cities-and-housing
    c: The Demonstration Cities and Metropolitan Development Act, S. 3708, through the House, [178–141](https://voteview.com/rollcall/RH0890371); recommittal refused, [149–175](https://voteview.com/rollcall/RH0890370).
    n: '[112 Cong. Rec., House, Oct. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-2-2.pdf). See [[cal.1966-01-26.cities-and-housing]].'
  - id: cal.1966-10-14.opinion
    when: Oct. 14
    date: '1966-10-14'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 30–Oct. 6: the American offer of a step-by-step withdrawal of its troops under UN supervision if the North Vietnamese withdraw theirs: approve 52 percent; approve with minor reservations 22; oppose 16.'
    n: '[[w.gallup-poll]], III, 2033.'
  - id: cal.1966-10-14.economy-investment-credit
    when: Oct. 14
    date: '1966-10-14'
    thread: economy-investment-credit
    c: The Senate passes the suspension of the investment credit, H.R. 17607, [38–19](https://voteview.com/rollcall/RS0890494); freight cars, trailers and semitrailers exempted, [41–28](https://voteview.com/rollcall/RS0890492).
    n: '[112 Cong. Rec., Senate, Oct. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-2-1.pdf). See [[cal.1966-09-08.economy]].'
  - id: cal.1966-10-14.vietnam
    when: Oct. 14
    date: '1966-10-14'
    thread: vietnam
    c: 'McNamara''s memorandum to Johnson: "no reasonable way to bring the war to an end soon"; pacification "a bad disappointment"; the bombing has not "significantly affected infiltration or cracked the morale of Hanoi." He recommends: American forces to level off at 470,000, 70,000 more in 1967; a barrier against infiltration near the 17th parallel; the bombing of the North held at its present 12,000 attack sorties a month; pacification pressed; to make peace gestures credible, consider stopping the bombing of all the North, or shifting it away from the zones of Hanoi and Haiphong. The Joint Chiefs dissent the same day. McNamara and Katzenbach brief the press.'
    n: 'FRUS 1964–68, IV, docs. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268), [269](https://history.state.gov/historicaldocuments/frus1964-68v04/d269). Remarks at a Press Briefing Following the Return From Vietnam of Secretary McNamara and Under Secretary Katzenbach, [1966 Pub. Papers 1184](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=558) (Oct. 14, 1966). Made public: [[w.pentagon-papers]], IV, 348–355 (1971). [[w.drea-mcnamara-clifford-and-the-2011]], 78, 131–133; [[w.cosmas-joint-chiefs-of-staff-2012]], 537; [[w.gibbons-u-s-government-and]], IV, 458–62. See [[cal.1966-10-10.vietnam]]. Names: McNamara, Johnson, Katzenbach.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1966-10-15.transportation
    when: Oct. 15
    date: '1966-10-15'
    thread: transportation
    c: 'Department of Transportation Act signed, [80 Stat. 931](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg931.pdf): the twelfth executive department, bringing together, Johnson says, 31 agencies and bureaus. The Maritime Administration left out. The Senate passed it Sept. 29, [64–2](https://voteview.com/rollcall/RS0890462).'
    n: 'Remarks Upon Signing Bill Creating a Department of Transportation, [1966 Pub. Papers 1188](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=562) (Oct. 15, 1966). To check: [[w.davis-department-of-transportation]]. See [[cal.1966-03-02.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-15.conservation
    when: Oct. 15
    date: '1966-10-15'
    thread: conservation
    c: 'Seven conservation bills signed: Guadalupe Mountains National Park in Texas; Pictured Rocks National Lakeshore in Michigan; Bighorn Canyon National Recreation Area in Montana; Wolf Trap Farm Park in Virginia; more land for Point Reyes National Seashore; the Endangered Species Preservation Act, [80 Stat. 926](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg926.pdf), native species threatened with extinction to be listed, and land bought for them; the National Historic Preservation Act, [80 Stat. 915](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg915.pdf), a National Register of Historic Places, grants to the States, and an Advisory Council on Historic Preservation to comment on federal undertakings that touch a listed place.'
    n: 'Remarks at the Signing Ceremony for Seven Conservation Bills, [1966 Pub. Papers 1186](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=560) (Oct. 15, 1966). To check: [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. See [[cal.1965-10-22.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-15.black-nationalism
    when: Oct. 15
    date: '1966-10-15'
    thread: black-nationalism
    also: [civil-rights-organizations]
    c: 'Oakland. Huey P. Newton and Bobby Seale found the Black Panther Party for Self-Defense. Its ten-point program, "What We Want, What We Believe": among its points, full employment, decent housing, exemption of all black men from military service, "an immediate end to police brutality," freedom for all black men held in prisons and jails.'
    n: 'To check: [[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.seale-seize-the-time]]; [[w.self-american-babylon]]; [[w.joseph-waiting-til-the-midnight]]. Names: Newton, Seale.'
    tags: [name:newton-huey-p, name:seale-bobby, state:ca, city:oakland]
  - id: cal.1966-10-15.vietnam
    when: Oct. 15
    date: '1966-10-15'
    thread: vietnam
    c: McNamara and Wheeler with Johnson before the NSC meets on the Asian trip.
    n: '[FRUS 1964–68, IV, doc. 272](https://history.state.gov/historicaldocuments/frus1964-68v04/d272). [[w.gibbons-u-s-government-and]], IV, 462–63, 471. See [[cal.1966-10-10.vietnam]]. Names: McNamara, Wheeler, Johnson.'
    tags: [name:mcnamara-robert-s, name:wheeler-earle, name:johnson-lyndon-b]
  - id: cal.1966-10-16.opinion
    when: Oct. 16
    date: '1966-10-16'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Oct. 1–6: the party one would like to see win the congressional district. Union members: Democratic 66 percent, Republican 34. Negroes: 82 and 18. Those 21 to 29: 56 and 44.'
    n: '[[w.gallup-poll]], III, 2033–34.'
  - id: cal.1966-10-17.vietnam
    when: Oct. 17–18
    date: '1966-10-17'
    thread: vietnam-asian-trip
    c: Johnson's Asian trip. From Washington Oct. 17, by Honolulu and American Samoa.
    n: 'Remarks at Dulles International Airport on Departing for the Asian-Pacific Trip, [1966 Pub. Papers 1216](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=590) (Oct. 17, 1966); Remarks at the East-West Center in Honolulu, [1966 Pub. Papers 1219](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=593) (Oct. 18, 1966); Remarks Upon Arrival at Tafuna International Airport, Pago Pago, American Samoa, [1966 Pub. Papers 1227](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=601) (Oct. 18, 1966). [[w.johnson-vantage-point]], 359–60; [[w.dallek-flawed-giant]], 383–85 (the trip). To check: [[w.gibbons-u-s-government-and]]; [[w.herring-lbj-and-vietnam]]; [[w.rostow-diffusion-of-power]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-17.electoral-college
    when: Oct. 17
    date: '1966-10-17'
    thread: electoral-college
    also: [court]
    c: '*Delaware v. New York*, [385 U.S. 895](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385orders/usrep385orders.pdf#page=95): leave to file the complaint denied, without opinion. Kentucky, Pennsylvania, South Dakota, North Dakota, Oklahoma, Utah, Wyoming, Florida, Iowa, Arkansas, Kansas and West Virginia realigned as plaintiffs. Rehearing denied Nov. 21, [385 U.S. 964](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385orders/usrep385orders.pdf#page=164).'
    n: Petition for Rehearing, *Delaware v. New York*, No. 28, Orig. (U.S. filed Nov. 3, 1966) ([Supreme Court](https://www.supremecourt.gov/pdfs/recordsandbriefs/1000202793/1000202793_004.pdf)). See [[cal.1966-07-20.electoral-college]].
    tags: [state:de, state:ny]
  - id: cal.1966-10-18.court
    when: Oct. 18–19
    date: '1966-10-18'
    thread: court
    also: [press-and-broadcasting]
    c: '*Time, Inc. v. Hill* reargued. Richard M. Nixon for James Hill, whose family''s night as hostages of escaped convicts in 1952 *Life* had described as the story of a play; Harold R. Medina, Jr., for Time. The question: may New York''s privacy statute make the press liable for a false report without proof that it knew the report false or reckless of the truth. First argued Apr. 27. The October Term opened Oct. 3.'
    n: '*Time, Inc. v. Hill*, [385 U.S. 374](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385374/usrep385374.pdf) (1967), decided Jan. 9, 1967. To check: [[w.barbas-newsworthy]]; [[w.garment-crazy-rhythm]]; [[w.ambrose-nixon]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1966-10-18.cities-and-housing
    when: Oct. 18
    date: '1966-10-18'
    thread: cities-and-housing
    c: 'The Demonstration Cities Act: the Senate agrees to the conference report, [38–22](https://voteview.com/rollcall/RS0890495).'
    n: 'Check: the Record''s page. See [[cal.1966-10-14.cities-and-housing]].'
  - id: cal.1966-10-19.opinion
    when: Oct. 19
    date: '1966-10-19'
    thread: opinion
    also: [elections-1966, vietnam]
    c: 'Gallup, Oct. 1–6: the most important problem, in order of mention: the war in Vietnam; civil rights and racial strife; rising prices. The party better able to handle it: Democratic 53 percent, Republican 47.'
    n: '[[w.gallup-poll]], III, 2034.'
  - id: cal.1966-10-19.vietnam-asian-trip
    when: Oct. 19–20
    date: '1966-10-19'
    thread: vietnam-asian-trip
    c: 'Johnson in New Zealand, Holyoake his host: Ohakea, Wellington.'
    n: 'Remarks Upon Arrival at the Airport, Wellington, New Zealand, [1966 Pub. Papers 1231](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=605) (Oct. 19, 1966); Remarks at the Parliamentary Luncheon, Wellington, New Zealand, [1966 Pub. Papers 1233](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=607) (Oct. 20, 1966). See [[cal.1966-10-17.vietnam]]. Names: Johnson, Holyoake.'
    tags: [name:johnson-lyndon-b, name:holyoake-keith]
  - id: cal.1966-10-19.vietnam-congress
    when: Oct. 19
    date: '1966-10-19'
    thread: vietnam-congress
    c: 'Aiken in the Senate, as Johnson leaves for Manila: two choices, escalate into a new dimension, or de-escalate; the United States "could well declare unilaterally that this stage of the Vietnam war is over—that we have ''won,''" redeploy its forces around strategic centers and put reconnaissance in place of bombing. By Aiken''s later account, the only time Johnson "ever really got mad at me."'
    n: '[112 Cong. Rec., Senate, Oct. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-5-1.pdf), 27523–25. [[w.gibbons-u-s-government-and]], IV, 447–50 (and Aiken''s account, CRS interview, Oct. 19, 1978; Marks''s, of Johnson''s reply to him in 1967: "in my gut I knew that you and George Aiken were right"). Names: Aiken, Johnson.'
    tags: [name:aiken-george-d, name:johnson-lyndon-b]
