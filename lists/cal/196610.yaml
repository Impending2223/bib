    place: fuzhou
    thread: china-red-guards
    c: 'Fuzhou 福州: the provincial Party committee telegraphs the Central Committee 中共中央, denouncing the rebels'' hunger strike as a counter-revolutionary act of hooligans backed by Taiwan.'
    n: '[[w.dikotter-cultural-revolution]], 116 n.4. Made public: 2002 (Ye Qing). To check: Ye Qing, "''Wenge'' shiqi Fujian qunzhong zuzhi yanjiu" (2002), I, 63–64 (cited by [[w.dikotter-cultural-revolution]], 116 n.4b). Check: the day.'
