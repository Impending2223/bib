    also: [china-zhou-cr]
    c: 'Zhou Enlai receives delegates of teachers and students of half-work, half-study schools come to Peking. Asked whether these are Mao''s educational thought: half-work, half-study with study first is, but it must be made concrete; the aim is a socialist-minded, educated laborer developed morally, mentally and physically; a school, whether full-time or half-work, is to put study first and learn work, farming and soldiering in the course. Not every school has "one small group"; some leaders have only individual or partial faults and are not power-holders on the capitalist road.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 79 (Oct. 21, 1966, the item after); [[w.pu-weihua-zalan-jiu-shijie]], 232, 232 n.66 (Zhou to the Red Guards: the stone lions must go, a "last ultimatum to the lions," those before Xinhuamen 新华门 too, being feudal; the record in the *Wenku* is dated Oct. 22, the *Zhou Enlai nianpu* Oct. 21). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], as [[w.pu-weihua-zalan-jiu-shijie]], 232 n.66, cites it for the day). To check: 周恩來接見半工半讀學校部分革命師生時的講話 (Oct. 22, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 232 n.66). Names: Zhou Enlai.'
