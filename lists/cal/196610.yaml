  - id: cal.1966-10.vietnam-hanoi
    when: Oct.
    date: 1966-10
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Politburo, judges that the Americans will push the war in 1967 and 1968, 1967 the year of weight for both sides, and sets the task: in the South beat the second strategic counteroffensive, keep the initiative, build toward a general offensive and general uprising; in the North build, fight, keep the corridors open, be ready for a landing in southern Military Region 4 and Middle and Lower Laos. Fight and talk: add the diplomatic struggle to the military and political. It adopts the Central Military Party Committee''s six modes of fighting.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 232–34. See [[cal.1966-02.vietnam-hanoi]]. Made public: 2013. Check: the days; the history says "tháng 10-1966".'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1966-10.vietnam-hanoi-2
    when: Oct.
    date: 1966-10
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The Central Office''s third all-South conference on guerrilla war sums up the guerrilla movement: from small wearing-down to larger destruction of units; guerrillas with simple arms shoot down thousands of aircraft and destroy thousands of vehicles; "belts to kill the Americans"; blockade of big posts and cutting of roads over wide areas for long periods; the movement entering the contested zones.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 235. Made public: 2013. Check: the days.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
