    c: 'Gallup, Sept. 8–13: Communist China admitted to the UN: should 25 percent, should not 56; persons in *Who''s Who in America*, 64 and 32. Admission if it would improve relations: favor 55, oppose 30. If the UN votes to admit it, the United States to go along: should 53, should not 33. Britain, Peking admitted: the public 54 should, 21 not; persons in the British *Who''s Who*, 86 and 8.'
