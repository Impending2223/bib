    place: manila
    thread: vietnam-asian-trip
    also: [korea]
    c: 'The Manila conference, at Marcos''s invitation: Holt of Australia, Park of Korea, Holyoake of New Zealand, Marcos, Thanom of Thailand, Thiệu and Kỳ of South Vietnam, Johnson.{1} The communiqué: allied forces "shall be withdrawn, after close consultation, as the other side withdraws its forces to the North, ceases infiltration, and the level of violence thus subsides," and not later than six months after;{2} South Vietnam to finish its constitution by March 1967 and to offer national reconciliation; a Declaration of Goals of Freedom.{3}'
    n: 'Summary of the President''s Remarks at the Manila Summit Conference, [1966 Pub. Papers 1256](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=630) (Oct. 24, 1966); Manila Summit Conference Documents, [1966 Pub. Papers 1259](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=633) (Oct. 25, 1966); Remarks Recorded for Broadcast to the American People Following the Manila Conference, [1966 Pub. Papers 1270](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=644) (Oct. 27, 1966). FRUS 1964–68, IV, docs. [277](https://history.state.gov/historicaldocuments/frus1964-68v04/d277), [280](https://history.state.gov/historicaldocuments/frus1964-68v04/d280), [281](https://history.state.gov/historicaldocuments/frus1964-68v04/d281), [282](https://history.state.gov/historicaldocuments/frus1964-68v04/d282); XXIX, pt. 1, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d94). [[w.gibbons-u-s-government-and]], IV, 440–44 (the six-month provision, "negotiated personally by the President himself," by McNaughton''s report); [[w.westmoreland-soldier-reports]], 190–91 (the delegations; Johnson wanted Westmoreland, without Wheeler or Sharp, the senior officer there; his and Cao Văn Viên''s review; the withdrawal clause, on which he was not consulted); [[w.berman-lyndon-johnsons-war]], 17, 19 (the seven; the withdrawal within six months); [[w.nixon-rn]], 274 (the joint communiqué of Oct. 25: allied withdrawal within six months, on the North''s withdrawal, an end to its support of infiltration, less violence); [[w.zaroulis-who-spoke-up]], 93 (the Manila Conference convened Oct. 24 with the heads of state of South Vietnam, the United States, Australia, New Zealand, Thailand and South Korea; the promise to withdraw troops within six months once the North abandoned its "aggression," the bombing not mentioned); [[w.johnson-white-house-diary]], 434 (Oct. 25: the six Chiefs of State, Holt, Holyoake, Thanom, Park, Johnson and Marcos, "closeted in Malacanang Palace discussing all the military, civil, and diplomatic dimensions of Vietnam and hammering out a statement" while the wives toured; not the order of business). [[w.clifford-counsel-to-the-president-2]], 440–42 (Clifford third in the American delegation, after Johnson and Rusk; the leaders; little done in the plenary sessions). See [[cal.1966-10-17.vietnam]]. Names: Johnson, Marcos, Holt, Park Chung Hee, Holyoake, Thanom Kittikachorn, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
