  - id: cal.1966-10-22.congress
    when: Oct. 22
    date: '1966-10-22'
    thread: congress
    c: 'The 89th Congress''s second session adjourns sine die, the Senate at 5:08 p.m., the House at 5:46. Oct. 15, in the East Room, McCormack''s report on the 89th to Johnson and the members: "fabulous." Oct. 19, the House had created a Select Committee on Standards and Conduct, [256–0](https://voteview.com/rollcall/RH0890384).'
    n: '[112 Cong. Rec., Senate, Oct. 22, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt21/pdf/GPO-CRECB-1966-pt21-3-1.pdf); [112 Cong. Rec., House, Oct. 22, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt21/pdf/GPO-CRECB-1966-pt21-3-2.pdf); [112 Cong. Rec., House, Oct. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-5-2.pdf). Remarks on the Accomplishments of the 89th Congress, [1966 Pub. Papers 1190](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=564) (Oct. 15, 1966). To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.mackenzie-liberal-hour]]. See [[cal.1965-10-23.congress]]; [[cal.1966-01-10.congress]]. Names: McCormack, Johnson.'
    tags: [name:mccormack-john-w, name:johnson-lyndon-b, appropriations:89-2]
