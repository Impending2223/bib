  - id: cal.1966-10-03.vietnam-2
    when: Oct. 3
    date: '1966-10-03'
    thread: vietnam
    c: 'Lodge with Thiệu, Kỳ and Trần Văn Đỗ, a long session on a settlement and national reconciliation. Lodge: the United States "will not withdraw our troops before security is assured"; the Tonkin resolution "a legal commitment." Kỳ: "cannot sit down with the VC," but with the border closed "a secret agreement with the VC" best; a "fade-away" preferred, though American opinion may not wait; a proclamation Nov. 1 premature. Thiệu plans a plea for reconciliation Nov. 1.'
    n: '[FRUS 1964–68, IV, doc. 258](https://history.state.gov/historicaldocuments/frus1964-68v04/d258) (Lodge''s report, 7630, Oct. 4). [[w.gibbons-u-s-government-and]], IV, 400. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-09-22.vietnam-2]]. Names: Lodge, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    src:
      c: c0314ce1
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d258: all'
        - 'w.gibbons-u-s-government-and IV, 400: all'
        - 'via w.gibbons-u-s-government-and IV, 400 n.50: all'
    tags: [name:lodge-henry-cabot, name:nguyen-van-thieu, name:nguyen-cao-ky]
  - id: cal.1966-10-03.vietnam-asian-trip
    when: Oct. 3
    date: '1966-10-03'
    thread: vietnam-asian-trip
    c: 'Rostow to Johnson, the results wanted from Manila: the allies'' commitment reaffirmed; agreed terms for peace; Saigon''s approach to the Viet Cong, perhaps an amnesty; pacification and land reform; Cambodia''s integrity; regional development without a new bloc of the fighting allies.'
    n: '[[w.gibbons-u-s-government-and]], IV, 440 n.3. Names: Rostow, Johnson.'
