    when: Oct. 10
    date: '1966-10-10'
    thread: vietnam
    c: 'Lodge with McNamara at his house, reading him a memorandum: "seek out and destroy" means many more casualties than "split up and keep off balance"; the war will be won by destroying the terrorist organization, not by killing; so fewer American troops in the "military" war, more in pacification, ten percent of the ARVN''s infantry strength assigned to its divisions on the "buddy" system.'
    n: '[[w.gibbons-u-s-government-and]], IV, 451–52. Lodge''s account; by his memoir, McNamara recalled the talk in 1968. To check: Lodge''s memorandum read to McNamara, Oct. 10, 1966, Lodge Papers, Vietnam Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 451 n.41). See [[cal.1966-10-10.vietnam-2]]. Names: Lodge, McNamara.'
