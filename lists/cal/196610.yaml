    c: Peking.{1} Liu Shaoqi and Deng Xiaoping make their self-criticisms at the Central Work Conference, taking the main responsibility for the "line error" in directing the Cultural Revolution.{2}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 23, 1966. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 651 (Oct. 23, 1966; Liu makes his self-criticism speech at the Central Work Conference and takes responsibility for the "line error": in the fifty-odd days after June 1 he made a line error and a directional error in leading the proletarian cultural revolution, chiefly his responsibility; the responsibility of other comrades, those in Peking at the Center, some in the State Council, the Peking committee, the work groups and some localities, is a lesser one; before July 18 Mao was not in Peking and the Center''s daily work was presided over by him, the Peking cultural revolution was reported to meetings he presided over, at which some wrong decisions were made and wrong suggestions approved or agreed to); [[w.macfarquhar-maos-last-revolution]], 137–138 (Liu admits two sets of "errors," the summer''s "serious errors in line," "right-opportunistic in nature," and past errors in principle and line, chiefly the "right deviation" of 1962 and the tendency of 1964; he does not call himself a "revisionist." Deng''s is more personal in tone, endorses Lin Biao as Mao''s "assistant and successor," and is ready to call what he did with Liu in the summer a "bourgeois reactionary erroneous line"); [[w.macfarquhar-origins-of-the-cultural]], III, 344 (Liu in his confession: he did not know how the second ten points came about; Peng Zhen''s tour of seven provinces and report to Mao gave its ideas); [[w.deng-xiaoping-nianpu-1904]], III, 1933 (Oct. 23, 1966; Deng makes his self-criticism at the Central Work Conference; besides examining his so-called ''line error'' he says it must be made clear that the great majority of the work teams are good comrades, and that for the mistakes made in this work, except in a few cases, the chief responsibility should not be borne by them but by himself and Comrade Shaoqi); [[w.mao-zedong-zhuan]], VI, ch. 75 (Oct. 23 Liu Shaoqi and Deng Xiaoping, at the plenary session, make self-criticisms and of their own accord take responsibility for sending work teams and the like; their drafts had gone to Mao first, who welcomed them). [[w.yang-jisheng-tiandi-fanfu]], I, 300–302 (Oct. 23 in the plenary meeting of the conference Liu Shaoqi and Deng Xiaoping make their self-criticisms; Liu: "I wrongly judged the situation and took the normal phenomena of the mass movement for a ''counter-current against the Party and the proletarian dictatorship,'' and so stood on the reactionary bourgeois side and carried out the bourgeois line"; Deng: Mao''s "Bombard the Headquarters" "hit the point in a single needle," "hit my vital part," the work groups a form of an error whose substance is the line, the mass line, standing on the side against the revolutionary masses; Lin Biao is the model to learn from); [[w.jian-zhou-enlai]], 554 (Liu and Deng own "serious mistakes by carrying out bourgeois reactionary lines"; most present lukewarm, even resentful); [[w.zhou-enlai-nianpu-1949-2020]], III, 80 (Zhou that day: the two self-criticisms "this afternoon at the meeting"). Made public: 1996. To check: Liu Shaoqi, self-criticism at the Central Work Conference, Oct. 23, 1966 ([[w.pipan-ziliao]], III, 721–732) (cited by [[w.macfarquhar-maos-last-revolution]], 138 n.16); Deng Xiaoping, self-criticism at the Central Work Conference, Oct. 23, 1966 ([[w.wuchanjieji-wenhua-dageming-ziliao]], 684–687) (cited by [[w.macfarquhar-maos-last-revolution]], 138 n.17); Liu Shaoqi, confession of Oct. 1966, as published, in [[w.issues-and-studies-taipei]], 95–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 344 n.54); Liu Shaoqi, self-criticism at the Central Work Conference, Oct. 23, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 301 n.33); Deng Xiaoping, self-criticism at the Central Work Conference, Oct. 23, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 302 n.34); Liu Shaoqi''s and Deng Xiaoping''s self-criticism at the Central Work Conference, October 23, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 554 n.45). Names: Liu Shaoqi, Deng Xiaoping.'
