    c: 'The Center decides to let students link up for another month in October and has the railways plan for 1.5 to 1.7 million students each way into and out of Peking. Gu Mu reports the railways difficulties; Zhou: draft three plans, with methods and difficulties, for him to put to the Standing Committee; he fears most a halt or block of the railways, the great artery, whose stoppage would paralyze the whole economy.'
