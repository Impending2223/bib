    n: '[[w.zelizer-fierce-urgency-of-now]], 246. To check: the recordings, [Conversation with Abe Fortas](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abe-fortas-october-3-1966-1), Conversation WH6610-02-10912 and -10913 (Miller Center) (cited by [[w.zelizer-fierce-urgency-of-now]], 246 n.53). Names: Johnson, Fortas.'
