  - id: cal.1966-10-10.vietnam-force-levels
    when: Oct. 10
    date: '1966-10-10'
    thread: vietnam-force-levels
    also: [vietnam]
    c: 'MACV''s briefing for McNamara on the barrier. Starbird outlines his task force''s plan; McNamara: "I do not know if this or any other barrier is practical." Westmoreland: Tiger Hound, mobile forces by the zone, and a "strong point obstacle system" of his own. McNamara: "an excellent plan"; "I keep looking back for five years, and as far as I am concerned it is a failure"; "a year from today there is going to be a barrier up there."'
    n: '[[w.gibbons-u-s-government-and]], IV, 456–57. To check: Transcript of the meeting of Oct. 10, 1966, MACV records, U.S. Army Military History Institute, Carlisle Barracks, Pa. (microfilm) (cited by [[w.gibbons-u-s-government-and]], IV, 457 n.60). See [[cal.1966-09-15.vietnam]]. Names: Starbird, McNamara, Westmoreland.'
