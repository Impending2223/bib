    also: [testing, vietnam]
    c: 'Gromyko at the White House with Dobrynin, 5 to 6:41 p.m.;{1} Rusk and Thompson with Johnson.{2} Most of the talk is Vietnam.{3} On a nonproliferation treaty Gromyko: the Soviet Union ready to sign "in two weeks" once a text is agreed; no nuclear weapons to the national control of non-nuclear powers, nor to any grouping that includes them. Johnson: by law no one but the President may decide to fire American nuclear weapons.{4} Rusk and Gromyko had gone over treaty language in New York, Sept. 22–24.{5}'
    n: 'FRUS 1964–68, XIV, doc. [178](https://history.state.gov/historicaldocuments/frus1964-68v14/d178); XI, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v11/d153), [157](https://history.state.gov/historicaldocuments/frus1964-68v11/d157); IV, doc. [264](https://history.state.gov/historicaldocuments/frus1964-68v04/d264). [[w.dobrynin-in-confidence]], 144–145; [[w.johnson-vantage-point]], 248–49, 477 (Rusk and Gromyko in New York, Sept. 22 and 24); [[w.poole-joint-chiefs-of-staff-2012]], 78 (Rusk and Gromyko in September); [[w.berman-lyndon-johnsons-war]], 19 (Gromyko for more specific conditions of an American withdrawal); [[w.schwartz-lyndon-johnson-and-europe]], 137–38 (Gromyko with Johnson in early October 1966, an agreement on a nonproliferation treaty very close; Johnson that the President would never give up his veto over the power of decision to fire nuclear weapons, n.153, FRUS 1964–68, XI, 387; Rusk the same day; not the hour, "in two weeks" or the law); [[w.chang-friends-and-enemies]], 275 (Gromyko tells Johnson and Rusk of the Soviets'' growing concern at China''s military threat; the talks, by an American official, the "most direct, honest, objective and non-ideological in several years"). [[w.gibbons-u-s-government-and]], IV, 442–43 (the meeting). Check: the Dobrynin pages; the copy read Nov. 4, 2026 (Times Books, paperback of the first edition) has the meeting at 149–50. Check: Chang ([[w.chang-friends-and-enemies]], 275) puts Gromyko''s talks with Johnson and Rusk "in late November 1966," citing the *New York Times*, Nov. 22, 1966, 1. To check: [[w.seaborg-stemming-the-tide]]; The *New York Times*, Nov. 22, 1966, 1; U.S., *China and U.S. Far East Policy*, 208 (cited by [[w.chang-friends-and-enemies]], 275 n.46a–b). Names: Gromyko, Dobrynin, Rusk, Thompson, Johnson.'
