  - id: cal.1966-10.china-leadership-32
    when: Oct., early
    date: 1966-10
    at: before 1966-10-11
    place: henan
    thread: china-red-guards
    c: 'Henan 河南. By early October, 129 cadres of department and bureau rank and above criticized and struggled, among them Zhao Wenfu 赵文甫 and Yang Weiping 杨蔚萍 of the committee''s Secretariat, the vice-governors Shao Wenjie 邵文杰, Peng Xiaoqian 彭笑千 and Zhang Boyuan 张柏园, and Liu Hongwen 刘鸿文, Liu Yanchun 刘晏春, Song Yuxi 宋玉玺 and Ren Leiyuan 任雷远 of its standing committee; 63 dismissed, 11 suspended to examine themselves: the count of the Henan party chronicle.'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 98. Made public: 1986 ([[w.zhonggong-henan-dangshi-dashiji]]). To check: [[w.zhonggong-henan-dangshi-dashiji]], II, 182 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 98 n.28). Names: Zhao Wenfu.'
    src:
      c: 75677b0b
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 98: all'
    tags: [polity:prc, vis:only:prc, name:zhao-wenfu]
  - id: cal.1966-10.china-leadership-33
    when: Oct., after the work conference
    date: 1966-10
    at: after 1966-10-28
    place: peking
    thread: china-red-guards
    c: 'Peking 北京. Tao Zhu 陶铸, conveying the Central Work Conference to cadres of grade 17 and above of the central and state organs: the Eleventh Plenum 八届十一中全会 corrected Liu and Deng''s wrong line and the long-standing dispersion of the Center''s leadership, abolished the first and second lines and put all power in the Chairman''s hands, as in the War of Liberation.'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 200. Made public: 2008. Names: Tao Zhu.'
