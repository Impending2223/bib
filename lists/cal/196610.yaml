    when: Oct. 1–2
    date: '1966-10-01'
    thread: testing
    c: 'Camp David: Johnson with Rusk, McNamara, McGeorge Bundy, Ball and U. Alexis Johnson on the nonproliferation treaty, after Rusk''s talks with Gromyko. Some for moving quickly; Rusk: serious risks in moving fast without consulting the allies. Johnson agrees; Rusk to tell all concerned.'
    n: '[[w.johnson-vantage-point]], 478–79, by Johnson''s account. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Gromyko.'
