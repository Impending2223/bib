  - id: cal.1966-10-01.civil-rights-organizations
    when: Oct. 1
    date: '1966-10-01'
    place: chicago
    thread: civil-rights-organizations
    also: [desegregation-schools, state-and-city-finance]
    c: 'Chicago. The Coordinating Council, apart from the movement''s assembly, its first meeting since July 23, thirty-three organizations. Its education committee''s motion, condensed, carried 12 to 2, four abstaining: "the defeat of the proposed school building bond issue on November 8th," $25 million, Berry being for it. Timuel Black proposes New Breed for membership.'
    n: '[[w.anderson-confronting-the-color-line]], 282–83, 285. To check: Memoranda, Follow-up Committee to Agenda Committee, 28, 30 September 1966 (cited by [[w.anderson-confronting-the-color-line]], 282 n.23).'
    src:
