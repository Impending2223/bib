    when: Oct., late
    date: 1966-10
    at: before 1966-10-21
    place: jinan
    thread: china-red-guards
    c: Jinan 济南. At the height of the criticism of the "bourgeois reactionary line" the Red Guard Division 红卫兵师 and its bodies break up; the Red Guard Jinan Command grows into a province-wide body and is renamed the "Red Guard Shandong Command" 红卫兵山东指挥部.
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. See [[cal.1966-09.china-leadership-38]].'
