  - id: cal.1966-10.china-leadership-36
    when: Oct., at the Central Work Conference
    date: 1966-10
    at: after 1966-10-09
    place: peking
    thread: china-red-guards
    also: [china-united-front]
    c: The Central Work Conference 中央工作会议 hands out a dozen reference papers; the fourth, "Beat the old world till it is routed" 〈把旧世界打个落花流水〉, extols the Red Guards' four olds under ten heads ("the bourgeoisie's prestige swept away," "a batch of deeply hidden counter-revolutionaries dug out," "religious superstition swept away, churches and temples pulled down," "the exploiting classes' ill-gotten wealth confiscated"). By its incomplete count, from Aug. 23 to Oct. 3 the house searches of the big cities took 1,198,000 liang of gold, 12 million liang of silver, 9,789,000 silver dollars, US$3,558,000, 3,739,000 in pounds and other currencies, 43,280,000 yuan in cash, deposits and bonds, 17,190,000 pieces of gold and silver jewelry, 950,000 chi of silk and cloth, about 100 million relics and 5,240,000 books; 1,788 cases of active counter-revolution were cracked, and 397,400 "ox-demons and snake-spirits" driven from the cities.
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 240. Made public: 2008. See [[cal.1966-10-09.china-leadership]].'
    src:
      c: 2df5a4a2
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 240: all'
    tags: [polity:prc, vis:only:prc]
