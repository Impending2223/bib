  - id: cal.1966-10-01.china-leadership-7
    when: Oct. 1
    date: '1966-10-01'
    time: 1966-10-01T11:00Z
    time_approx: true
    place: peking
    thread: china-red-guards
    c: After the parade Mao insists on going for a motorized greeting session with some of his "closest comrades-in-arms." The masses surge forward and the cars cannot move; Fu Chongbi, commander of the Peking Garrison, has three ribs broken clearing the way, about ten people are trampled to death and nearly a hundred are injured. The incident is kept out of the news.
    n: '[[w.macfarquhar-maos-last-revolution]], 109; [[w.yang-jisheng-tiandi-fanfu]], I, 242 (Oct. 1, a little after 7 p.m. 晚7點多, Mao''s car is hemmed in by Red Guards from West Chang''an Avenue to the south entrance; Lin Biao gets out and shouts that he is Minister of Defense and they must let the cars through to the evening party at Tiananmen; the Guards take no notice and the ring tightens; the commander of the Third Guard Division 警衛三師 hurries up a regiment of mobile troops to free Mao by force). Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], II, 709 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.32). See [[cal.1966-10-01.china-leadership]]. Names: Mao Zedong, Fu Chongbi. Check: the account is Wang Li''s (109 n.32).'
    src:
      c: 48c723f0
      rows:
        - 'w.macfarquhar-maos-last-revolution 109: all'
        - 'w.yang-jisheng-tiandi-fanfu I, 242: ?'
    tags: [polity:prc, name:mao-zedong, vis:only:prc, name:fu-chongbi]
    time_zone: Asia/Shanghai
