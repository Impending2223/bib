    c: Zhou Enlai, after talks with Tao Zhu, Li Fuchun and Ye Jianying, meets the chief men of the regions, provinces and cities and the heads of the State Council's branches and the Cultural Revolution Group on conveying the spirit of the Central Work Conference and on policies and measures of the movement.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 82 (Oct. 26, 1966, the item after); [[w.liu-jixian-ye-jianying-nianpu]], II, 947 (Oct. 26, 1966; Ye Jianying 叶剑英 with Tao Zhu 陶铸, Li Fuchun 李富春 and others at Zhou Enlai''s 周恩来). Made public: 2020. The order: after [[cal.1966-10-26.china-leadership]], the printed order alone ([[w.zhou-enlai-nianpu-1949-2020]], III, 81–82). Names: Zhou Enlai, Tao Zhu, Li Fuchun, Ye Jianying.'
