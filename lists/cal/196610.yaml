    also: [vietnam-diplomacy, soviet-union, china, comecon]
    c: 'Hanoi. Maurer and Niculescu-Mizil talk with Phạm Văn Đồng, Nguyễn Duy Trinh and Xuân Thủy, 1000 to 1300 hrs. Maurer reports the divergences with the Soviet Union (the gold sent to Russia in 1917, the Warsaw Pact''s command), the coolness with China since Zhou''s visit, and the NATO states'' leaders who ask why Hanoi will not talk; the armed struggle going on, he proposes that the DRV open talks to unmask the Americans. Đồng: the conditions are not ripe; he asks for concrete suggestions, and Maurer has none.'
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. ''The discussions began at 1000 hrs''; ''The discussions ended at 1300 hrs.'' The Archive dates the transcript Oct. 3; the file note at its end reads Oct. 2–3, 1966. Names: Maurer, Phạm Văn Đồng, Nguyễn Duy Trinh, Xuân Thủy. Check: the days; the file note reads Oct. 2–3, against the transcript''s Oct. 3 and 4 and Maurer''s own ''October 3 and in the afternoon of October 4'' at Peking. Check: the year the document was first printed or posted; the Archive page gives none.'
    tags: [polity:romania, polity:drv, name:maurer-ion-gheorghe, name:pham-van-dong, name:nguyen-duy-trinh, name:xuan-thuy, vis:only:romania+drv]
    time_zone: Asia/Bangkok
  - id: cal.1966-10-03.vietnam-hanoi-2
