  - id: cal.1966-10-06.china-leadership
    when: Oct. 6
    date: '1966-10-06'
    place: peking
    thread: china-red-guards
    also: [china-zhou-cr]
    c: Zhou Enlai attends the Central Cultural Revolution Group's rally of revolutionary teachers and students from all over the country in Peking, "to open fire fiercely on the bourgeois reactionary line". Chen Boda and Jiang Qing speak; Zhang Chunqiao reads the Emergency Instruction on the Cultural Revolution in the army's academies.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 73 (Oct. 6, 1966); [[w.macfarquhar-maos-last-revolution]], 135 (at a rally organized by the Capital 3rd HQ in the Workers'' Stadium, Zhou and the Cultural Revolution Group announce to 100,000 "revolutionary teachers and students" from all over China the rehabilitation of all comrades who since May 16, 1966 have suffered repression, attacks, struggle or even suppression at the hands of leaderships at various levels or work teams); [[w.yang-jisheng-tiandi-fanfu]], I, 298 (Oct. 6 the Third Headquarters of the Peking Red Guards hold a rally of 100,000 in the Workers'' Gymnasium, its banner "Rally of the revolutionary teachers and students of the whole country in Peking to fire fiercely at the bourgeois reactionary line"; Zhou Enlai, Jiang Qing, Chen Boda, Kang Sheng, Tao Zhu, Zhang Chunqiao and the Group''s other members attend, Chen presiding and letting Jiang speak first; Zhang reads the Military Commission''s urgent directive on the cultural revolution in military academies, which declares null the labels of "counter-revolutionary" and "rightist" put on people early in the movement, returns the self-criticisms to their writers, and lets the material be destroyed with the masses'' agreement; Zhou says it applies equally to the colleges and middle schools, and asks the local committees that those who come to Peking to complain not be persecuted or held on return; Kuai Dafu 蒯大富 reads the oath; the rally adopts the telegram 〈向資產階級反動路線猛烈開火〉); [[w.yang-jisheng-tiandi-fanfu]], II, 1145 (the Third Headquarters'' rally of 100,000 to "open fire on the bourgeois reactionary line"). To check: [[w.wuchanjieji-wenhua-dageming-ziliao-1966]], IV, 34 (cited by [[w.macfarquhar-maos-last-revolution]], 135 n.9); Zhou Enlai, speech at the rally of Oct. 6, 1966 〈向資產階級反動路線猛烈開火誓師大會上的講話〉, in Song Yongyi 宋永毅, *Zhongguo wenhua dageming wenku* 《中國文化大革命文庫》 (2006) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 298 n.23). See [[cal.1966-10-05.china-leadership]]. Names: Zhou Enlai, Chen Boda, Jiang Qing, Zhang Chunqiao.'
    tags: [name:zhou-enlai, name:chen-boda, name:jiang-qing, name:zhang-chunqiao, polity:prc]
