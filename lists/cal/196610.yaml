  - id: cal.1966-10.china-leadership-30
    when: Oct., early
    date: 1966-10
    at: before 1966-10-11
    thread: china-red-guards
    c: 'The Red Guards'' exhibition of the spoils of their raids, an incomplete count, by Ding Dahua''s account: from June to early October 1966 the Red Guards across the country seize 42.8 billion yuan in cash, deposits and bonds, over 1.188 million taels of gold and over 10 million antiques; dig out over 16,600 "class enemies," break over 1,700 "counterrevolutionary" cases, and drive over 39 million "ox-demons and snake-spirits" from the cities.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 260. To check: 丁大華:〈世所罕見的紅衛兵抄家戰果展覽會〉,《文史精華》2008年,第1期 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 260 n.32). Check: the day; and the 39 million, so printed.'
