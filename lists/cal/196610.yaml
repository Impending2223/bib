    c: Longyan county 龍岩縣, Fujian 福建, Shizhong commune 適中公社. Xie Hongshui 謝洪水, a farmer, founds a "Chinese Communist Party Happiness Committee" 中國共產黨幸福委員會, claiming Liu Shaoqi 劉少奇's direct leadership, and links up in secret.
