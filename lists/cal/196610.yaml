    n: '[[w.macfarquhar-maos-last-revolution]], 109. Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], II, 622–623 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.33). See [[cal.1966-10-01.china-leadership-7]]. Names: Mao Zedong. Check: the time; the book places it after the incident (109); the account is Wang Li''s.'
