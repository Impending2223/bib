    n: '[112 Cong. Rec., Senate, Oct. 4, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-7-2.pdf). See [[cal.1966-09-29.poverty]]. Names: Dirksen.'
