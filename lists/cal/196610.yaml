    when: Oct. 3
    date: '1966-10-03'
    thread: vietnam
    also: [soviet-union]
    c: 'Harriman to Johnson and Rusk, "Negotiations": "the only real chance now in sight to induce Hanoi to negotiate a settlement depends on the influence Moscow is willing and able to exert"; press the Soviet obligation under the Geneva agreements; inducements for Moscow.'
    n: '[FRUS 1964–68, IV, doc. 257](https://history.state.gov/historicaldocuments/frus1964-68v04/d257). [[w.gibbons-u-s-government-and]], IV, 443. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-09-30.vietnam-3]]. Names: Harriman, Johnson, Rusk.'
