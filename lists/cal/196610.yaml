  - id: cal.1966-10-01.china-leadership
    when: Oct. 1
    date: '1966-10-01'
    time: 1966-10-01T02:00Z
    place: peking
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Tiananmen, 10 a.m.{1} Mao at the rally for the PRC''s seventeenth anniversary (over 1,500,000), receives Red Guards and revolutionary teachers and students (the fourth reception); at noon, the wounded drillers of the Daqing 3211 team; walks over Jinshui Bridge into the crowd. The day lasts over six hours. Evening: sits on the square with the people; watches the fireworks from the gate.{2} The papers count "friends from some seventy countries" among the crowd.{3} Lin Biao: the struggle between the proletarian revolutionary line Mao represents and the bourgeois line goes on; those who hold to the wrong line are a handful and must fail.{4} Chen Yi, with Lin Biao and Zhou Enlai, is beside Mao for the review.{5} Ye Jianying reviews the march with Mao from the gate tower.{6} Zhu De attends.{7} Chen Yun attends.{8} Deng Xiaoping attends.{9}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1966. [[w.zhou-enlai-waijiao-huodong]], 505 (Oct. 1, 1966; morning, Tiananmen tower; Zhou reviews the march of 1,500,000); [[w.macfarquhar-maos-last-revolution]], 109 (the rally of 1,500,000, "friends from some seventy countries" present, the fourth of Mao''s eight reviews); [[w.deng-xiaoping-nianpu-1904]], III, 1932 (Oct. 1, 1966; Deng takes part in the rally in Tiananmen Square 天安门广场 for the seventeenth anniversary of the People''s Republic and in the review of the parade); [[w.mao-zedong-zhuan]], VI, ch. 75 (Oct. 1, the seventeenth anniversary: a rally and march of a million at Tiananmen Square, Mao present; Lin Biao''s speech there: the struggle between the proletarian revolutionary line represented by Mao and the bourgeois line goes on; those who hold to the wrong line are a handful, who will fail). [[w.chen-yi-nianpu]], 1167 (Oct. 1, 1966; Chen Yi with Lin Biao, Zhou and others accompanies Mao reviewing the march of a million and a half, Mao''s fourth reception of Red Guards); [[w.liu-jixian-ye-jianying-nianpu]], II, 945 (Oct. 1, 1966; Ye Jianying 叶剑英 on the Tiananmen 天安门 gate tower with Mao reviewing the parade of 1,500,000 teachers, students and Red Guards); [[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun at the capital''s rally at Tiananmen for the seventeenth anniversary and at Mao''s fourth reception of the Red Guards); [[w.zhu-de-nianpu-xinbian]], III, 1957 (Oct. 1, 1966; Zhu De 朱德 at the rally and parade of 1,500,000 of the capital and from all over the country in Tiananmen Square 天安门广场 for the seventeenth anniversary of the People''s Republic); [[w.macfarquhar-maos-last-revolution]], 109; [[w.mao-zedong-zhuan]], VI, ch. 75. [[w.chen-yi-nianpu]], 1167; [[w.liu-jixian-ye-jianying-nianpu]], II, 945; [[w.zhu-de-nianpu-xinbian]], III, 1957; [[w.chen-yun-nianpu-xiuding]], III, 157; [[w.deng-xiaoping-nianpu-1904]], III, 1932. Check: the book (109) says the papers reported the rally; the incident after the parade was kept out of them. To check: [[w.hui-hongweibing-mi-lu]], 393 (cited by [[w.macfarquhar-maos-last-revolution]], 110 n.40). Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Yi, Ye Jianying, Zhu De, Chen Yun, Deng Xiaoping.'
    src:
      c: b11c16ff
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 1, 1966: 1, 2'
        - 'w.zhou-enlai-waijiao-huodong 505: 1'
        - 'w.macfarquhar-maos-last-revolution 109: 3'
        - 'w.mao-zedong-zhuan VI, ch. 75: 4'
        - 'w.chen-yi-nianpu 1167: 5'
        - 'w.liu-jixian-ye-jianying-nianpu II, 945: 6'
        - 'w.zhu-de-nianpu-xinbian III, 1957: 7'
        - 'w.chen-yun-nianpu-xiuding III, 157: 8'
        - 'w.deng-xiaoping-nianpu-1904 III, 1932: 9'
    tags: [name:mao-zedong, polity:prc, name:lin-biao, name:zhou-enlai, name:chen-yi, name:ye-jianying, name:zhu-de, name:chen-yun, name:deng-xiaoping]
  - id: cal.1966-10-01.china-leadership-2
    when: Oct. 1
    date: '1966-10-01'
    place: peking
    thread: china-red-guards
    also: [china-mao-cr, china-propaganda, china-united-front]
    c: 'On the Tiananmen tower, Mao to Ted Hill: go to the universities; left, right and middle; the old intellectuals still needed, for the papers and broadcasts; full change takes long.{1} Pointing to the marchers: imperialism and revisionism fear the students, and so do some of our cadres, central and provincial, who would call out workers and peasants against them, not the army.{2} To Li Zongren: the Red Guards sealed the CPPCC and the democratic parties, but both remain.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1966. [[w.mao-zedong-zhuan]], VI, ch. 75 n.12 (that evening, as he watches the fireworks from the tower, Mao talks with the Australian communist leader Hill: pointing at the students in the square, imperialism and revisionism fear these students, so do some of our cadres, Central Committee members, Politburo members, provincial, prefectural and county secretaries among them, who would call out the army, but the army cannot be moved, so they would call out workers and peasants against the students, n.12). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: Mao Zedong 毛泽东, talk with Ted Hill 希尔 (record 谈话记录), Oct. 1, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.12). Names: Mao Zedong, Ted Hill, Li Zongren.'
    src:
      c: 1486079f
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 1, 1966: 1, 2, 3'
        - 'w.mao-zedong-zhuan VI, ch. 75 n.12: 2'
        - 'via w.mao-zedong-zhuan VI, ch.75 n.12: 2'
    tags: [name:mao-zedong, polity:prc, vis:only:prc, name:li-zongren, name:ted-hill]
    time_range:
      - 1966-10-01T11:00Z
      - 1966-10-01T14:00Z
    time_band: evening
    time_zone: Asia/Shanghai
  - id: cal.1966-10-01.china-leadership-6
    when: Oct. 1
    date: '1966-10-01'
    place: peking
    thread: china-red-guards
    also: [china-zhou-cr]
    c: 'Zhou Enlai, on the Tiananmen stand, tells Li Zongren to spend a few days in Hospital 301: the Red Guards are young and warm but know little of Party policy and may disturb him.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (under Sept. 1966). Made public: 2020. See [[cal.1966-09.china-leadership-5]]. Names: Zhou Enlai, Li Zongren.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc, name:li-zongren]
  - id: cal.1966-10-01.china-leadership-3
    when: Oct. 1
    date: '1966-10-01'
    thread: china-zhou
    c: 'Zhou Enlai revises the *Renmin ribao* editorial for the 17th anniversary, "Arm Seven Hundred Million People with Mao Zedong Thought", as Chen Boda revised it: those who do not yet understand Mao''s line are no longer equated with deliberate opponents. To Mao he notes that two passages on p. 3 confuse the two kinds of contradiction; the wording he leaves to Tang Pingzhu. Mao circles it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70–71 (Oct. 1, 1966). Names: Zhou Enlai, Chen Boda, Mao Zedong, Tang Pingzhu.'
    tags: [name:zhou-enlai, name:chen-boda, name:mao-zedong, polity:prc, name:tang-pingzhu]
  - id: cal.1966-10-01.china-leadership-4
    when: Oct. 1
    date: '1966-10-01'
    thread: china-red-guards
    c: 'The *Hongqi*, issue 13, prints the editorial "Advance on the Broad Road of Mao Zedong Thought": a very few oppose the Sixteen Points and hold to the bourgeois reactionary line, which must be thoroughly criticized, with no eclecticism. Zhou Enlai tells his liaison man Liu Xiyao that Chen Boda published it without the Center''s discussion; no one was ready, and many leading cadres are now in difficulty.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 71 (Oct. 1, 1966); [[w.macfarquhar-maos-last-revolution]], 135 (the thirteenth issue of *Red Flag*, its key editorial meant to introduce a unifying label, is distributed seventy-two hours behind schedule, on Oct. 3); [[w.dikotter-cultural-revolution]], 116 n.4 (the editorial, edited by Chen Boda: the power holders taking the capitalist road "a small bunch of counter-revolutionary revisionists" who "raise the red flag in order to fight the red flag"; the "bourgeois reactionary line"; the text has it published Oct. 3, its note gives *Hongqi*, no. 13, Oct. 1, 1966); [[w.zhu-de-nianpu-xinbian]], III, 1958 (under Oct. 1, 1966; the *Hongqi* 《红旗》, issue 13, prints the editorial "Advance on the broad road of Mao Zedong Thought" 《在毛泽东思想的大路上前进》, calling for "thorough criticism" of the "bourgeois reactionary line" 资产阶级反动路线; after it the criticism of the "bourgeois reactionary line" begins all over the country). Check: MacFarquhar (135) has the issue distributed Oct. 3; the chronology has the editorial in the issue of Oct. 1 and reprinted in the *Renmin ribao* of Oct. 2. Names: Zhou Enlai, Chen Boda, Liu Xiyao, Mao Zedong.'
    tags: [name:zhou-enlai, name:chen-boda, name:mao-zedong, polity:prc, name:liu-xiyao]
