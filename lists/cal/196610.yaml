    when: Oct., early
    date: 1966-10
    at: before 1966-10-01
    thread: china-red-guards
    c: 'Liu Zhijian 劉志堅, head of the army''s Cultural Revolution Group, argues there is no precedent for abolishing Party committee leadership. Zhang Chunqiao 张春桥: Party leadership is leadership by Mao and his Thought. Liu: very fine, but the lower levels still need concrete persons to lead them.'
