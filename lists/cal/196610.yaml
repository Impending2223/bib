    when: Oct., early
    date: 1966-10
    at: before 1966-10-01
    thread: china-foreign
    c: Chen Yi 陈毅 receives National Day cables from the Foreign Ministers of Albania, the DRV, the DPRK, Romania, Afghanistan, Algeria, Burma, Cambodia, the Congo, Pakistan, the GDR, Mongolia, the Soviet Union and many other countries, and from the head of the external liaison office of the National Liberation Front of South Vietnam.
