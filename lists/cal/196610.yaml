  - id: cal.1966-10-15.china-leadership
    when: Oct. 15
    date: '1966-10-15'
    thread: china-red-guards
    also: [china-mao-cr]
    c: 'Mao reads Chen Boda''s draft speech for the conference, "The Two Lines in the Great Proletarian Cultural Revolution" (four parts: the situation good; the two lines; and others the nianpu does not name). Evening: seen, usable; the rest to follow; to be given to the members for some days'' discussion. On cadres'' sons ("some bad, even on the revisionist road") he strikes the words that they degenerate into revisionism''s representatives. Night: part four, usable; the whole to be printed at once, to hand out as it is given.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 15, 1966. [[w.macfarquhar-maos-last-revolution]], 136 (Mao revises Chen Boda''s report repeatedly before and after its delivery; the printed text is to be handed out beforehand); [[w.jianguo-yilai-mao-zedong]], XVIII, 369–371 (Oct. 15, 1966; Mao''s notes to Chen Boda, 8:30 p.m. Oct. 15, on the first three parts, and the night of Oct. 15, on the fourth, sent at midnight; printed from the manuscripts; the four parts: the situation excellent; the two-line struggle continued; rid of some fears, rouse the masses boldly; keep to the class line, unite the majority; note 2: he changed "Comrade Jiang Qing" (who proposed adding ordinary cadres'' children) to "a comrade"; note 3: in part four "little children" to "some young people" on the "born red" theory). Made public: 2006. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 140–142 (cited by [[w.macfarquhar-maos-last-revolution]], 136 n.12); Chen Boda, "The two lines in the Great Proletarian Cultural Revolution," speech to the Central Work Conference, drafts of Oct. 15, 24 and Nov. 5, 1966 (printed as a conference document Oct. 16; issued by the Center General Office to county and regiment level Nov. 9) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 370 n.1). Names: Mao Zedong, Chen Boda.'
