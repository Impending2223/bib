  - id: cal.1966-10-24.vietnam-asian-trip
    when: Oct. 24–25
    date: '1966-10-24'
    thread: vietnam-asian-trip
    also: [korea]
    c: 'The Manila conference, at Marcos''s invitation: Holt of Australia, Park of Korea, Holyoake of New Zealand, Marcos, Thanom of Thailand, Thiệu and Kỳ of South Vietnam, Johnson. The communiqué: allied forces "shall be withdrawn, after close consultation, as the other side withdraws its forces to the North, ceases infiltration, and the level of violence thus subsides," and not later than six months after; South Vietnam to finish its constitution by March 1967 and to offer national reconciliation; a Declaration of Goals of Freedom.'
    n: 'Summary of the President''s Remarks at the Manila Summit Conference, [1966 Pub. Papers 1256](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=630) (Oct. 24, 1966); Manila Summit Conference Documents, [1966 Pub. Papers 1259](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=633) (Oct. 25, 1966); Remarks Recorded for Broadcast to the American People Following the Manila Conference, [1966 Pub. Papers 1270](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=644) (Oct. 27, 1966). FRUS 1964–68, IV, docs. [277](https://history.state.gov/historicaldocuments/frus1964-68v04/d277), [280](https://history.state.gov/historicaldocuments/frus1964-68v04/d280), [281](https://history.state.gov/historicaldocuments/frus1964-68v04/d281), [282](https://history.state.gov/historicaldocuments/frus1964-68v04/d282); XXIX, pt. 1, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d94). [[w.gibbons-u-s-government-and]], IV, 440–44 (the six-month provision, "negotiated personally by the President himself," by McNaughton''s report). See [[cal.1966-10-17.vietnam]]. Names: Johnson, Marcos, Holt, Park Chung Hee, Holyoake, Thanom Kittikachorn, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    tags: [name:johnson-lyndon-b, name:marcos-ferdinand-e, name:holt-harold-e, name:park-chung-hee, name:holyoake-keith, name:thanom-kittikachorn, name:nguyen-van-thieu, name:nguyen-cao-ky]
