  - id: cal.1966-10-01.vietnam
    when: Oct. 1
    date: '1966-10-01'
    thread: vietnam
    c: 'Ginsburgh to Rostow, "Vietnam—the Next Phase": win, or pass the crest, by June 1, 1968, before the conventions; a week after the November elections, warn Hanoi privately; then the oil, the power plants, the steel plant, the ports mined, the air force; two divisions from Europe.'
    n: '[FRUS 1964–68, IV, doc. 253](https://history.state.gov/historicaldocuments/frus1964-68v04/d253). [[w.gibbons-u-s-government-and]], IV, 482–83. Made public: FRUS 1964–68, IV (1998). Names: Rostow.'
