    date: '1966-10-04'
    thread: poverty
    c: 'Economic Opportunity Amendments, S. 3164, in the Senate: Dirksen''s cut of the authorization to the budget''s $1.75 billion taken, [45–27](https://voteview.com/rollcall/RS0890466); an amendment barring aid to anyone who incited or carried on a riot, [39–32](https://voteview.com/rollcall/RS0890468); passed, [49–20](https://voteview.com/rollcall/RS0890469).'
