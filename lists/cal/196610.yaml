  - id: cal.1966-10-14.vietnam
    when: Oct. 14
    date: '1966-10-14'
    thread: vietnam
    c: 'McNamara''s memorandum to Johnson: "no reasonable way to bring the war to an end soon"; pacification "a bad disappointment"; the bombing has not "significantly affected infiltration or cracked the morale of Hanoi." He recommends: American forces to level off at 470,000, 70,000 more in 1967; a barrier against infiltration near the 17th parallel; the bombing of the North held at its present 12,000 attack sorties a month; pacification pressed; to make peace gestures credible, consider stopping the bombing of all the North, or shifting it away from the zones of Hanoi and Haiphong. The Joint Chiefs dissent the same day. McNamara and Katzenbach brief the press.'
    n: 'FRUS 1964–68, IV, docs. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268), [269](https://history.state.gov/historicaldocuments/frus1964-68v04/d269). Remarks at a Press Briefing Following the Return From Vietnam of Secretary McNamara and Under Secretary Katzenbach, [1966 Pub. Papers 1184](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=558) (Oct. 14, 1966). Made public: [[w.pentagon-papers]], IV, 348–355 (1971). [[w.drea-mcnamara-clifford-and-the-2011]], 78, 131–32 (the memorandum, all but the sorties; the Chiefs'' dissent); [[w.cosmas-joint-chiefs-of-staff-2012]], 537–39 (the memorandum; the Chiefs'' reply); [[w.gibbons-u-s-government-and]], IV, 458–62; [[w.herring-lbj-and-vietnam]], 47, 76–77 (the report: no end soon; pacification gone "backward"; 470,000; the barrier; the bombing held; new initiatives; all bombing of the North to be ended "at the proper time"); [[w.mcnamara-in-retrospect]], ch. 9 at nn.8, 27–29 (military operations and pacification under one command first urged, then a clearer line of command, the ambassador keeping it). [[w.mann-grand-delusion]], 514–16 (the memorandum, all but the sorties and pacification pressed; the Chiefs'' dissent); [[w.branch-at-canaans-edge]], 540 (written on the KC-135 home; casualties at a rate of sixty thousand dead a year; infiltration up threefold despite 84,000 sorties; "the important war" gone "backward"); [[w.berman-lyndon-johnsons-war]], 13–16 (the memorandum: "no reasonable way to bring the war to an end soon"; 470,000; the barrier, 10,000 to 20,000 men, $1 billion; the sorties; pacification "thoroughly stalled"; Wheeler''s reply). To check: [[w.sheehan-bright-shining-lie]], 628–31 (cited by [[w.branch-at-canaans-edge]], 540); [[w.gravel-political-odyssey]], 348–54 (cited by [[w.branch-at-canaans-edge]], 540); McNamara, /n Retrospect, pp. 262-63. Quoting this memo 1n his 1995 memoir, McNamara revised its description of "the important war," pacification, from a quest "for the complicity of the people" in the 1966 original to one "for the [hearts and minds] of the people." This tiny shift covered up a strange and perhaps telling choice of the term "complicity" rather than consent as the desired political stance for the Vietnamese (cited by [[w.branch-at-canaans-edge]], 540). See [[cal.1966-10-10.vietnam]]. Names: McNamara, Johnson, Katzenbach.'
