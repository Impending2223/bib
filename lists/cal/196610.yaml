    c: East of the Sa Thầy river, 12 to 14 kilometers west-northwest of Plei Giăng. After bombing (B-52s included) and shelling that clear the ground, the morning the American 4th Division's 1st Brigade lands. When night falls Regiment 320 attacks the American columns. Oct. 28 the history counts two American companies destroyed and a third badly hurt; it quotes UPI, Oct. 28, on the division, in Vietnam two months, being punished.
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 249–50. See [[cal.1966-10-18.vietnam-hanoi]]. Check: the clock, whose it is; the history''s Oct. 20 patrols of Saigon commandos west of the post. The figures are the history''s.'
