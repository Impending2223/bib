    c: 'Peking Normal University 北京師範大學. Li Wenbo 李文博, a student of its physics department, puts up the poster "The commune is long since no longer a state in the old sense" 〈公社早已不是原來意義上的國家了〉.{1} The poster: the socialist system to be thoroughly renewed, the proletarian dictatorship thoroughly improved; the present system "a bourgeois state without a bourgeoisie"; the Cultural Revolution''s aim the principles of the Paris Commune.{2}'
