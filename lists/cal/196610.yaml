  - id: cal.1966-10-27.africa
    when: Oct. 27
    date: '1966-10-27'
    thread: africa
    c: The General Assembly ends South Africa's mandate over South West Africa, Resolution 2145 (XXI), 114–2, Portugal and South Africa against, Britain, France and Malawi abstaining (Check); the United States for. The territory to come under the direct responsibility of the United Nations; an ad hoc committee to recommend how it is to be administered.
    n: '[G.A. Res. 2145 (XXI)](https://undocs.org/A/RES/2145(XXI)) (Oct. 27, 1966). [[w.current-documents-1966]], 585–586. To check: [[w.borstelmann-cold-war-and-the]]. See [[cal.1966-07-14.africa]].'
