    c: 'Mao reads Xiao Hua''s report of Oct. 30 to Lin Biao on how the army makes its Cultural Revolution: those back from the work conference to pass on its spirit; the military regions'' organs begin in November, to end about the Spring Festival; army-level organs first as in divisions, with positive education; military districts about two months; academies strengthened; units below army keep order. "Agreed; returned to Lin."{1}'
