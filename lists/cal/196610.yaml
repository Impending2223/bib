    c: '4 a.m.{1} Mao reads Deng Xiaoping''s "preliminary self-criticism" for the conference (draft of Oct. 21): "may be given so."{2} After "turn over a new leaf" add something positive: with one''s own effort and comrades'' help one believes the errors will be corrected;{3} given time he will stand up again; half a life in revolution, is one fall to crush him? And drop "preliminary" from the title.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 22, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 372–373 (Oct. 22, 1966; Mao''s letter to Deng Xiaoping, 4 a.m. Oct. 22, on the draft Deng sent Oct. 21; printed from the manuscript; notes 2–3: Deng added a passage of that kind and dropped "preliminary" from the title; he spoke Oct. 23); [[w.deng-xiaoping-nianpu-1904]], III, 1932–1933 (Oct. 22, 1966; Mao''s reply: ''Comrade Xiaoping: you may speak as it stands; but after the first line on page nine, ''turn over a new leaf'', add a few positive words, for instance that with one''s own effort and the comrades'' help one believes the errors will be corrected: ''let me have time, I shall stand up; after half a lifetime of revolution, having fallen, am I to be unable to rise?''; also the word ''preliminary'' can be struck from the title''); [[w.mao-zedong-zhuan]], VI, ch. 75 n.19 (Mao''s comment on Deng Xiaoping''s speech draft, Oct. 22 by the note: ''comrade Xiaoping: may speak on this''; after ''turning over a new leaf'' on p. 9 add something heartening, as that with his own effort and his comrades'' help he believes the errors will be corrected; ''let me have time, I shall stand up again''; half a life in revolution, a fall and then crushed?; ''preliminary'' can be dropped from the title, n.19). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: Deng Xiaoping, "Preliminary self-criticism at the Central Work Conference," draft sent to Mao Oct. 21, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 372 n.1); Mao Zedong 毛泽东, comment on Deng Xiaoping''s 邓小平 speech draft (manuscript 手稿), Oct. 22, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.19). Names: Mao Zedong, Deng Xiaoping.'
