  - id: cal.1966-10-10.soviet-union
    when: Oct. 10
    date: '1966-10-10'
    thread: soviet-union
    also: [testing, vietnam]
    c: 'Gromyko at the White House with Dobrynin, 5 to 6:41 p.m.; Rusk and Thompson with Johnson. Most of the talk is Vietnam. On a nonproliferation treaty Gromyko: the Soviet Union ready to sign "in two weeks" once a text is agreed; no nuclear weapons to the national control of non-nuclear powers, nor to any grouping that includes them. Johnson: by law no one but the President may decide to fire American nuclear weapons. Rusk and Gromyko had gone over treaty language in New York, Sept. 22–24.'
