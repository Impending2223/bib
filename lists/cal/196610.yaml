    when: Oct. 2
    date: '1966-10-02'
    thread: vietnam
    c: 'Unger to Rusk: Porter thinks McNamara''s proposal "quite impractical," opposed by those with the most experience in Vietnam; the military "markedly less competent" at it than those now responsible.'
