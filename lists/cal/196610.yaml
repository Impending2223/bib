    c: 'Zhou Enlai speaks to the East China group of the Central Work Conference. The Cultural Revolution has no precedent, even in other socialist countries; each lacks experience of practice and of history; the line struggle was raised after the Cultural Revolution Group talked with the minority, and he did not foresee it and risks falling behind. Plans for receiving the students linking up have always been too conservative: the limit was to be about 1.5 million; Mao says no, prepare to pass two or three million.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 81–82 (Oct. 26, 1966). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
