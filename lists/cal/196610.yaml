  - id: cal.1966-10-14.vietnam
    when: Oct. 14
    date: '1966-10-14'
    thread: vietnam
    c: 'McNamara''s memorandum to Johnson: "no reasonable way to bring the war to an end soon"; pacification "a bad disappointment"; the bombing has not "significantly affected infiltration or cracked the morale of Hanoi." He recommends: American forces to level off at 470,000, 70,000 more in 1967; a barrier against infiltration near the 17th parallel; the bombing of the North held at its present 12,000 attack sorties a month; pacification pressed; to make peace gestures credible, consider stopping the bombing of all the North, or shifting it away from the zones of Hanoi and Haiphong. The Joint Chiefs dissent the same day. McNamara and Katzenbach brief the press.'
    n: 'FRUS 1964–68, IV, docs. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268), [269](https://history.state.gov/historicaldocuments/frus1964-68v04/d269). Remarks at a Press Briefing Following the Return From Vietnam of Secretary McNamara and Under Secretary Katzenbach, [1966 Pub. Papers 1184](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=558) (Oct. 14, 1966). Made public: [[w.pentagon-papers]], IV, 348–355 (1971). [[w.drea-mcnamara-clifford-and-the-2011]], 78, 131–32 (the memorandum, all but the sorties; the Chiefs'' dissent); [[w.cosmas-joint-chiefs-of-staff-2012]], 537–39 (the memorandum; the Chiefs'' reply); [[w.gibbons-u-s-government-and]], IV, 458–62; [[w.herring-lbj-and-vietnam]], 47, 76–77 (the report: no end soon; pacification gone "backward"; 470,000; the barrier; the bombing held; new initiatives; all bombing of the North to be ended "at the proper time"). See [[cal.1966-10-10.vietnam]]. Names: McNamara, Johnson, Katzenbach.'
