    c: 'Mao returns Chen Boda''s revised speech of Oct. 16: very good;{1} work in "grasp revolution, promote production";{2} print it as small booklets, at least two for every Party branch and Red Guard squad.{3} On Nov. 6, on a second revision: first to county and regiment level, then down when the cadres above are of one mind. Issued Nov. 9.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 24, 1966. [[w.macfarquhar-maos-last-revolution]], 139 (Mao calls for Chen Boda''s report to be printed in booklet form in quantities large enough for every Party branch and Red Guard contingent to have at least two copies); [[w.jianguo-yilai-mao-zedong]], XVIII, 370–371 (Oct. 24, 1966; Mao''s notes to Chen Boda, 11 p.m. Oct. 24 and Nov. 6; note 4: Chen added the passage on "grasp revolution, promote production" Oct. 25; note 1: the Center General Office issued the speech to county and regiment level Nov. 9); [[w.mao-zedong-zhuan]], VI, ch. 75 n.27 (Mao''s comment on Chen Boda''s speech draft, Oct. 24 by the note: whether the two words ''grasp revolution, promote production'' could be put in somewhere, n.27). [[w.yang-jisheng-tiandi-fanfu]], I, 300 (Oct. 24 at 11 p.m. 晚11時 Mao notes on Chen Boda''s report: "the revision read, very good; where to put in the two phrases ''grasp revolution, promote production,'' consider; print it as a small book, in large numbers, at least two for every branch and every Red Guard squad"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 141 (cited by [[w.macfarquhar-maos-last-revolution]], 139 n.20); Mao Zedong 毛泽东, comment on Chen Boda''s 陈伯达 speech draft for the Central Work Conference (manuscript 手稿), Oct. 24, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.27); Mao Zedong 毛澤東, comment of Oct. 24, 1966 on Chen Boda''s report, [[w.jianguo-yilai-mao-zedong]], XII, 141 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 300 n.27). Names: Mao Zedong, Chen Boda.'
