    c: 'Zhou Enlai talks with Ion Gheorghe Maurer, chairman of Romania''s Council of Ministers, who reports his talks in Vietnam.{1} Zhou: on Vietnam the Chinese and Soviet positions are wholly opposite, with no joint action; Vietnam will be talked of when the time comes, the issue is the conditions, the moment and who decides, and Vietnam decides; anyone mobilized by the Soviet Union and the U.S. to press Vietnam may cross China if Vietnam invites, with exceptions, such as U Thant, who would have to be considered; aid goods to Vietnam go through China under the agreements.{2}'
    n: '"[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union After the Visit of the Romanian Delegation to Vietnam (Beijing)](https://digitalarchive.umd.edu/document/122583)" (Oct. 4, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 1–21, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian transcript: Maurer and Niculescu-Mizil report the Hanoi talks to Zhou, Chen Yi, Zhao Yiming, Qiao Guanhua and Yu Chen, 1630 to 1930 hrs; Zhou answers. [[w.zhou-enlai-nianpu-1949-2020]], III, 72 (Oct. 5, 1966); [[w.zhou-enlai-waijiao-huodong]], 505 (Oct. 5, 1966; 4:30 p.m., Building 18, Diaoyutai guesthouse; the book sums up Zhou''s replies in four points: on Vietnam the Chinese and Soviet positions are wholly opposite and there is no joint action; talks will come at some time, the issue being conditions, moment and who decides, and Vietnam decides; those the Soviet Union and the U.S. mobilize to press Vietnam may pass through if Vietnam invites, with exceptions such as U Thant to be considered; aid goods to Vietnam through China go by agreement and allow no joint action); [[w.zhonghua-renmin-gongheguo-waijiao]], 129–130 (Oct. 5, 1966; Maurer, back through Beijing from Vietnam; the talk on negotiation: conditions, time, who decides). Made public: 1993. Check: the Romanian transcript headed Beijing, Oct. 4, has Maurer place the Hanoi talks on ''October 3 and in the afternoon of October 4''; its day cannot stand. Names: Zhou Enlai, Maurer, U Thant.'
