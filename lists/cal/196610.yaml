        - 'w.gibbons-u-s-government-and IV, 482–83: all'
        - 'via w.gibbons-u-s-government-and IV, 482 n.13: all'
    tags: [name:rostow-walt-w]
  - id: cal.1966-10-01.robert-kennedy
    when: Oct. 1
    date: '1966-10-01'
    thread: robert-kennedy
    also: [democratic-party]
    c: 'Goodwin with Robert Kennedy, a long talk, the first of two (the second Oct. 16), on running against Johnson in 1968: Johnson''s standing will fall and Kennedy''s rise, the people hating Johnson''s personality, not only his style or his policies; but Johnson "would dump Humphrey and even stop the war if necessary to defeat you."'
    n: '[[w.chester-american-melodrama]], 111. Names: Goodwin, Robert Kennedy, Johnson, Humphrey.'
    src:
      c: e8f294b0
      rows:
        - 'w.chester-american-melodrama 111: all'
    tags: [name:goodwin-richard-n, name:kennedy-robert-f, name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1966-10-02.opinion
    when: Oct. 2
    date: '1966-10-02'
    thread: opinion
    also: [defense]
    c: 'Gallup, Sept. 8–13: every able-bodied man of 18 required to serve a year in the armed forces: yes 69 percent, no 24.'
    n: '[[w.gallup-poll]], III, 2032.'
