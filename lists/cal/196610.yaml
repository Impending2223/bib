  - id: cal.1966-10-09.china-leadership
    when: Oct. 9–28
    date: '1966-10-09'
    place: peking
    thread: china-red-guards
    also: [china-mao-cr]
    c: Peking, Great Hall, East Hall.{1} The Central Work Conference opens, Mao presiding;{2} Lin Biao introduces the agenda.{3} The bureaus' secretaries, the provinces' heads and the Center ministries' heads attend;{4} the conference discusses the Cultural Revolution and criticizes the "bourgeois reactionary line."{5} Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Zhu De, Chen Yi, Chen Yun and Ye Jianying attend.{6} Set first for three days, it lasts almost three weeks.{7} Some local rebel leaders are asked to speak.{8} By Wang Li, the criticism is to settle the leaders who ran the Center's work in August and September, chiefly Zhou and Tao Zhu, and the provincial and municipal leaders.{9}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 9, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 74, 76 (Oct. 9–28, 1966; Zhou attends the Central Work Conference; Chen Boda''s report and Lin Biao''s speech attacking Liu Shaoqi and Deng Xiaoping); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 650–651 (Oct. 9–28, 1966; Liu attends the Central Work Conference Mao presides over; there Lin Biao and Chen Boda name Liu and Deng Xiaoping as carrying out "a line suppressing the masses and opposing the revolution," and say the wrong line of this cultural revolution was chiefly started by Liu and Deng; Oct. 24 and 25 Mao says at the meeting that posting Liu''s and Deng''s big-character posters on the streets is not good, that people are to make revolution and not forbidden to, that Liu and Deng are not to be written off in one stroke nor can Liu and Deng wholly be blamed, and their two comrades had their reasons for the mistakes; after the meeting a wave of criticism of the "bourgeois reactionary line" rises across the country); [[w.macfarquhar-maos-last-revolution]], 136 (intended at first to last three days, then a week, the conference lasts almost three weeks, Oct. 9–28); [[w.deng-xiaoping-nianpu-1904]], III, 1932 (Oct. 9–28, 1966; Deng attends the Central Work Conference 中央工作会议 Mao presides over; on the 16th Chen Boda''s speech ''The two lines in the great proletarian cultural revolution'' 《无产阶级文化大革命中的两条路线》 concentrates on criticizing the ''bourgeois reactionary line'' and declares that those who put forward the wrong line are its representatives, Liu Shaoqi and Comrade Deng Xiaoping, who bear the chief responsibility); [[w.mao-zedong-zhuan]], VI, ch. 75 (from Oct. 9 at Peking the Central Work Conference, chaired by Mao, with the heads of the Center''s Party, government and army departments and of the Party committees of the provinces, municipalities and autonomous regions; the subject the criticism of the ''bourgeois reactionary line'', many of those in charge in the regions and departments uneasy and unconvinced; it ends Oct. 28). [[w.yang-jisheng-tiandi-fanfu]], I, 299–300 (Oct. 9–28 the Center holds the work conference in Peking; the heads of the provincial, municipal and regional committees, the State Council''s ministries and commissions, and the Military Commission''s departments, the armies and the services attend, and some local rebel leaders are asked to speak; its business is to criticize the bourgeois reactionary line and clear the way of the cultural revolution; Wang Li: this criticism is to settle the leaders who led the Center''s work in August and September, chiefly the premier and Tao Zhu, and the leaders of the provincial and municipal committees); [[w.yang-jisheng-tiandi-fanfu]], II, 1145 (Oct. 9 to 28, to criticize the bourgeois reactionary line); [[w.jian-zhou-enlai]], 553 (the work conference of Oct. 9 on criticizing the "bourgeois reactionary line," set for seven days, lasting three weeks); [[w.chen-yi-nianpu]], 1168 (Oct. 9–28, 1966; Chen Yi at the Central Work Conference at Peking, which discusses the Cultural Revolution and criticizes the "bourgeois reactionary line"); [[w.liu-jixian-ye-jianying-nianpu]], II, 946 (Oct. 9–28, 1966; Ye Jianying 叶剑英 at the Central Work Conference Mao presides); [[w.chen-yun-nianpu-xiuding]], III, 157 (Chen Yun attends, Oct. 9–28, Mao presiding; Lin Biao and Chen Boda name Liu Shaoqi and Deng Xiaoping for a bourgeois line; Liu, in his self-criticism, ties it to his "right errors" of 1962, among them backing Chen Yun''s report and proposing him for head of the Central Finance and Economics Small Group: he learned only later that Mao did not agree; Mao: the first and second lines meant his views could not be carried out in Peking; "I lit this fire"; not all Liu''s and Deng''s fault; Zhou on the last day on relaying the conference); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Oct. 9–28, 1966; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 Mao Zedong 毛泽东 presides over, its chief business the criticism of the "bourgeois reactionary line" 资产阶级反动路线, to clear further the so-called "resistance" of the Party''s cadres at every level); [[w.yang-jisheng-tiandi-fanfu]], I, 299. Made public: 1996. To check: [[w.zhou-enlai-nianpu-1949]], III, 73–75 (cited by [[w.macfarquhar-maos-last-revolution]], 136 n.10a); [[w.nianyi-da-dongluande-niandai]], 101 (cited by [[w.macfarquhar-maos-last-revolution]], 136 n.10b); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 42, 44 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 300 n.25). Names: Mao Zedong, Lin Biao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Zhu De, Chen Yi, Chen Yun, Ye Jianying, Wang Li, Tao Zhu.'
