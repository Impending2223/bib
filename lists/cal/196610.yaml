  - id: cal.1966-10-05.china-leadership
    when: Oct. 5
    date: '1966-10-05'
    thread: china-red-guards
    also: [china-army]
    c: 'With Mao''s reading and consent the Center forwards the Military Commission''s and General Political Department''s urgent directive on the Cultural Revolution in military academies, from Lin Biao''s proposal: every frame binding the masses'' movement in the academies to be discarded.{1} The directive finds that some academies'' leaders overstress their special character, suppress democracy, forbid links between classes, departments and schools and set students against students; the academies are to follow the Sixteen Points as the local colleges do, with the four bigs, and those branded counter-revolutionaries, anti-Party elements or rightists at the start of the movement are to be cleared in public. The army and the academies are not to take part in the localities'' movement.{2} It cancels the rule that the schools'' Party committees lead the movement once the work teams leave.{3} By Teiwes, it abolishes Party committee leadership of the movement in the army''s schools, not in the army at large.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 5, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 72–73 (Oct. 5, 1966; the Center''s forwarding, with Mao''s approval, of the Military Commission''s and General Political Department''s Emergency Instruction on the Cultural Revolution in the army''s academies); [[w.macfarquhar-maos-last-revolution]], 135 (Zhongfa [1966] 515, an "Urgent Instruction" drawn up at Lin Biao''s insistence, calls for the immediate, full and public rehabilitation of all the students and others victimized under the "bourgeois reactionary line"; Mao''s comment: "Very good, very important"); [[w.macfarquhar-maos-last-revolution]], 176 (Lin Biao, on this day, concedes to students at military academies and schools the same rights as the Red Guards); [[w.mao-zedong-zhuan]], VI, ch. 75 (Oct. 5 the Center transmits the Military Commission''s and General Political Department''s urgent instruction on the cultural revolution in military academies, on Lin Biao''s view: every frame that binds the mass movement is to be removed; the Center adds that it applies to all colleges and middle schools at county level and above, to be read to the students and staff and carried out). [[w.yang-jisheng-tiandi-fanfu]], I, 420 (the Center forwards the Emergency Instruction 〈中央軍委、總政治部關於軍隊院校無產階級文化大革命的緊急指示〉, Zhongfa (66) 515 中發(66)515號: on Lin Biao''s proposal the frames binding the movement in the academies discarded, the academies to follow the Sixteen Points as the local colleges do, with the four bigs; those branded at the start of the movement cleared; the army and academies not to take part in the localities'' movement; by Qiu Huizuo the All-Army Group''s work (Liu Zhijian, Yang Mancun, Xie Tangzhong); by Wang Li, Lin dictated it after Tao Zhu''s daughter Tao Siliang and another cadre''s child told him of the academies'' repression; by Yu Ruxin, Lin Doudou brought him the matter; the students pour into Peking and the leaderships of over 100 academies are paralyzed; Mao: "yaoyaoyao" (111 academies), "there are indeed demons"); [[w.teiwes-tragedy-of-lin-biao]], 66–67 (the directive, from Lin''s proposal and in the Cultural Revolution Group''s form: Party committee leadership abolished in the army''s schools, not in the army; curbs on the masses attacked; earlier labels on rebellious students void; the schools not to join local movements; the Center agrees, Mao and Lin approve its issue, Mao attaches great importance to it; Zhou, Tao Zhu, Ye Jianying and others promote it at mass rallies); [[w.liu-jixian-ye-jianying-nianpu]], II, 946 (Oct. 5, 1966; approved by Mao, the Center forwards the urgent directive: all limits on the mass movement in the army''s schools removed, and the rule that their Party committees lead it after the work teams leave; after it, by this book, the wave of "kicking aside the Party committees" over the country, every level''s committee but the field armies'' paralyzed); [[w.yang-jisheng-tiandi-fanfu]], I, 420; [[w.liu-jixian-ye-jianying-nianpu]], II, 946; [[w.teiwes-tragedy-of-lin-biao]], 67. Made public: 2006. Check: whether Zhongfa [1966] 515 is this directive on the military academies or another document; the book gives the rehabilitation as its matter (135). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhongfa [1966] 515, "Urgent Instruction" on the rehabilitation of victims of the "bourgeois reactionary line," drawn up at Lin Biao''s insistence, with Mao''s comment "Very good, very important" ([[w.li-wang-li-fansi-lu]], II, 624) (cited by [[w.macfarquhar-maos-last-revolution]], 135 n.8); [[w.wenhua-dageming-yanjiu-ziliao]], I, 132–133 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.33a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.macfarquhar-maos-last-revolution]], 176 n.33b); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 455 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 420 n.8); [[w.li-wang-li-fansi-lu]], the Beixing ed. as Yang cites it (2011, 2nd ed.), 下, 41 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 420 n.9a); Yu Ruxin 余汝信, 〈1966年中央軍委「緊急指示」的由來〉 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 420 n.9b); *Qiu Huizuo huiyilu* 《邱會作回憶錄》 (Xin shiji chubanshe 新世紀出版社, Hong Kong, 2011), 458 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 420 n.10); [[w.nianyi-da-dongluande-niandai]], 96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23a); [[w.yunsheng-maojiawan-jishi]], 42–43 (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 67 n.23c); [[w.nianyi-da-dongluande-niandai]], 96–99 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24a); [[w.yunsheng-maojiawan-jishi]], 56–58, 61–62 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 277–278 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24c); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 161 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24d); [[w.yanjiubu-zhongguo-renmin-jiefang-jun]], 627 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24e); [[w.barnouin-ten-years-of-turbulence]], 126–132 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24g). Names: Mao Zedong, Lin Biao.'
