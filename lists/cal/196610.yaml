  - id: cal.1966-10-03.vietnam
    when: Oct. 3
    date: '1966-10-03'
    thread: vietnam
    c: 'Johnson and Eisenhower, by telephone, 5:24 p.m. Eisenhower: winning the war before the poverty programs or reaching the moon; many want him to say publicly how to win it, "I won''t do it—I won''t divide the United States when it needs unity."'
    n: '[Johnson and Eisenhower, 5:24 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-october-3-1966), Conversation WH6610-02-10916 (Miller Center). [[w.johns-vietnams-second-front]], 116 (the conversation, from Eisenhower''s notes). To check: notes of the conversation, Oct. 3, 1966, Augusta–Walter Reed Series, box 1, Eisenhower Post-Presidential Papers, Eisenhower Library (cited by [[w.johns-vietnams-second-front]], 116 n.151). Names: Johnson, Eisenhower.'
