    n: '[[w.galbraith-ambassadors-journal]]; [[w.gibbons-u-s-government-and]], II, 119–120. [FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02). See [[cal.1961-01-28.vietnam]]. Names: Galbraith, Harriman, McNamara.'
