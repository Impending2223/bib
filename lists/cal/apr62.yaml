    date: '1962-04-10'
    thread: steel
    c: Blough at the White House, 5:45 p.m., with the release. Six dollars a ton.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-194) (Apr. 11, 1962). McConnell, *Steel and the Presidency*; Rowen, *Free Enterprisers*; Heath, *Kennedy and the Business Community* (K–J Adm. II.B). See [[cal.1961-09-06.steel]].'
    tags: [name:kennedy-john-f, name:blough-roger-m]
