  - id: cal.1962-04-29.opinion
    when: Apr. 29
    date: '1962-04-29'
    thread: opinion
    c: 'Gallup, Apr. 6–11: the most important problem, war, peace, and international tension, 63 percent; cost of living and taxes, 10; unemployment, 8; racial problems, 6. The Democrats better able to handle it, 40; the Republicans, 16.'
    n: '*The Gallup Poll*, III, 1764 (K–J Cong. II.E).'
