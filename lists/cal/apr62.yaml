    n: '[Remarks at a Dinner Honoring Nobel Prize Winners of the Western Hemisphere](https://www.presidency.ucsb.edu/documents/remarks-dinner-honoring-nobel-prize-winners-the-western-hemisphere) (Apr. 29, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
