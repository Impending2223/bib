    when: Apr. 10
    date: '1962-04-10'
    thread: crime-and-hijacking-maheu
    also: [cuba]
    c: 'Hoover to Miller: Edwards holds that prosecuting Maheu in the wiretap case would expose "most sensitive information relating to the abortive Cuban invasion."'
    n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1962-03-28.crime-and-hijacking]]. Names: Hoover, Miller, Edwards, Maheu.'
    tags: [name:hoover-j-edgar, name:miller-herbert-j-jr, name:edwards-sheffield, name:maheu-robert-a]
  - id: cal.1962-04-11.steel
    when: Apr. 11
    date: '1962-04-11'
    thread: steel
    also: [robert-kennedy]
    c: 'Press conference: "a tiny handful of steel executives." The Justice Department and Pentagon purchasing move.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-194) (Apr. 11, 1962). [[w.navasky-kennedy-justice]]. See [[cal.1962-04-10.steel]]. Names: Robert F. Kennedy, McNamara.'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:mcnamara-robert-s]
  - id: cal.1962-04-11.middle-east
    when: Apr. 11–13
    date: '1962-04-11'
    thread: middle-east
    c: 'The Shah and the Empress in Washington, on a state visit, Apr. 10–18. With Kennedy, Apr. 12; with McNamara the same day: the basic force level of Iran''s army 150,000 men, more on the northern border after a joint study, a planning team from the Joint Chiefs. Rusk''s aide-mémoire, Apr. 13. The joint statement: the Third Plan, aid continued, the bilateral agreement of 1959 reaffirmed.'
    n: '[Remarks of Welcome to the Shah and the Empress of Iran at the Washington National Airport](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-shah-and-the-empress-iran-the-washington-national-airport); [Toasts of the President and the Shah of Iran](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-the-shah-iran-2) (Apr. 11, 1962); [Joint Statement following Discussions With the Shah of Iran](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-shah-iran) (Apr. 13, 1962). FRUS 1961–63, XVII, docs. [243](https://history.state.gov/historicaldocuments/frus1961-63v17/d243), [247](https://history.state.gov/historicaldocuments/frus1961-63v17/d247), [248](https://history.state.gov/historicaldocuments/frus1961-63v17/d248). [[w.pahlavi-mission-for-my-country]]; [[w.rubin-paved-with-good-intentions]]; [[w.bill-eagle-and-the-lion]]; [[w.afkhami-life-and-times-of]]; [[w.milani-shah]]; [[w.offiler-us-foreign-policy-and]]. Names: Pahlavi, McNamara, Rusk, Kennedy.'
    tags: [name:pahlavi-mohammed-reza, name:kennedy-john-f, name:mcnamara-robert-s, name:rusk-dean]
  - id: cal.1962-04-13.steel
    when: Apr. 13
    date: '1962-04-13'
    thread: steel
    c: Inland and Kaiser hold. Bethlehem rescinds; U.S. Steel follows.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-201) (Apr. 18, 1962). See [[cal.1962-04-10.steel]].'
  - id: cal.1962-04-13.opinion
    when: Apr. 13
    date: '1962-04-13'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Mar. 8–13: federal youth camps like the CCC, good idea 79 percent, poor 16.'
    n: '[[w.gallup-poll]], III, 1762.'
  - id: cal.1962-04-16.desegregation-schools-la
    when: Apr. 16
    date: '1962-04-16'
    thread: desegregation-schools
    c: Archbishop Rummel of New Orleans excommunicates Leander Perez, the Plaquemines Parish leader, and two others who organized against his order desegregating the archdiocese's schools for 1962–63.
    n: '[Wikipedia](https://en.wikipedia.org/wiki/Joseph_Rummel). [[w.jeansonne-leander-perez]]; [[w.fairclough-race-and-democracy]]. Names: Rummel, Perez.'
    tags: [name:rummel-joseph-f, name:perez-leander-h, state:la, city:new-orleans]
  - id: cal.1962-04-16.crime-and-hijacking-maheu
    when: Apr. 16
    date: '1962-04-16'
    thread: crime-and-hijacking-maheu
    also: [cuba]
    c: 'Houston, the CIA''s General Counsel: Miller sees "no major difficulty in stopping action for prosecution."'
    n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1962-03-28.crime-and-hijacking]]. Names: Houston, Miller.'
    tags: [name:houston-lawrence, name:miller-herbert-j-jr]
  - id: cal.1962-04-17.european-community
    when: Apr. 17
    date: '1962-04-17'
    thread: european-community
    c: 'Paris. The Six''s foreign ministers fail to agree on a treaty of political union, the Fouchet plan: Belgium and the Netherlands will not go on without Britain. The French draft of Oct. 19, 1961, loose "confederal" ties in politics and defense; a second, Jan. 18. Apr. 27, State to its missions: the United States takes no side.'
    n: 'FRUS 1961–63, XIII, docs. [22](https://history.state.gov/historicaldocuments/frus1961-63v13/d22) (circular, Nov. 3, 1961), [24](https://history.state.gov/historicaldocuments/frus1961-63v13/d24) (Spaak, Nov. 29, 1961), [35](https://history.state.gov/historicaldocuments/frus1961-63v13/d35) (circular, Apr. 27). [[w.camps-britain-and-the-european]]; [[w.vaisse-la-grandeur]]; [[w.giauque-grand-designs-and-visions]]. Names: Fouchet.'
    tags: [name:fouchet-christian]
  - id: cal.1962-04-20.crime-and-hijacking-maheu
    when: Apr. 20
    date: '1962-04-20'
    thread: crime-and-hijacking-maheu
    also: [cuba]
    c: 'Houston asks the Justice Department formally not to prosecute in the wiretap case, "on grounds of security."'
    n: '[S. Rep. No. 94-465, 130–31 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=141). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1962-03-28.crime-and-hijacking]]. Names: Houston.'
    tags: [name:houston-lawrence]
  - id: cal.1962-04-20.opinion
    when: Apr. 20
    date: '1962-04-20'
    thread: opinion
    also: [railroads]
    c: 'Gallup, Mar. 8–13: a law against unions requiring more workers than a job needs, 55 percent for, 23 against.'
    n: '[[w.gallup-poll]], III, 1763.'
  - id: cal.1962-04-21.states-and-cities-seattle
    when: Apr. 21
    date: '1962-04-21'
    thread: states-and-cities
    also: [space]
    c: 'Seattle. The Century 21 Exposition, the Seattle World''s Fair, opened by Kennedy from Palm Beach with a telegraph key, by a signal from Cassiopeia A: "we are reaching out through space on the new ocean." Open to Oct. 21.'
    n: '[Remarks in Palm Beach Upon Opening by Remote Control the Seattle World''s Fair](https://www.presidency.ucsb.edu/documents/remarks-palm-beach-upon-opening-remote-control-the-seattle-worlds-fair) (Apr. 21, 1962). [Wikipedia, "Century 21 Exposition"](https://en.wikipedia.org/wiki/Century_21_Exposition). [[w.schwantes-pacific-northwest]].'
    tags: [state:wa, city:seattle, name:kennedy-john-f]
  - id: cal.1962-04-24.japan-and-korea
    when: Apr. 24
    date: '1962-04-24'
    thread: japan-and-korea
    c: 'NSAM 151, Kennedy to Rusk: the Japan–Korea talks, on and off for over a decade, to be brought "to a prompt and successful conclusion"; time not on Korea''s side. Komer''s prompting, Apr. 23.'
    n: 'FRUS 1961–63, XXII, docs. [255](https://history.state.gov/historicaldocuments/frus1961-63v22/d255), [256](https://history.state.gov/historicaldocuments/frus1961-63v22/d256). [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]; [[w.lee-troubled-peace]]; [[w.macdonald-u-s-korean-relations]]; [[w.brazinsky-nation-building-in-south]]. See [[cal.1961-11-14.japan-and-korea]]. Names: Kennedy, Rusk, Komer.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:komer-robert-w]
