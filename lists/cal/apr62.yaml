  - id: cal.1962-04-08.cuba
    when: Apr. 8
    date: '1962-04-08'
    thread: cuba
    c: 'Bay of Pigs prisoners sentenced: thirty years, or $62 million. Sixty wounded freed on credit, Apr. 14. Check the release date.'
    n: '[FRUS vol. 10, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v10/d321). See [[cal.1961-04-15.cuba]].'
  - id: cal.1962-04-08.opinion
    when: Apr. 8
    date: '1962-04-08'
    thread: opinion
    also: [trade]
    c: 'Gallup, Mar. 8–13: more trade with other countries important, 65 percent. 46 have heard of the administration''s trade plan, 13 can describe it. Of those who had heard, lower tariffs 38, higher 15.'
    n: '*The Gallup Poll*, III, 1761 (K–J Cong. II.E).'
  - id: cal.1962-04-10.steel
