  - id: cal.1962-04-04.conservation
    when: Apr. 4
    date: '1962-04-04'
    thread: conservation
    c: The Land Conservation Fund bill sent to Congress.
    n: '[Letter to the President of the Senate and the Speaker of the House Transmitting Bill To Create a Land Conservation Fund](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-bill-create-land) (Apr. 4, 1962). See [[cal.1962-03-01.conservation]]. Names: Kennedy.'
