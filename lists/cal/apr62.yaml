    when: Apr. 25
    date: '1962-04-25'
    thread: testing
    c: U.S. atmospheric testing resumes near Christmas Island.
    n: '[U.S. Department of Energy, *United States Nuclear Tests, July 1945 through September 1992*, DOE/NV-209, rev. 16 (2015), 20–21](https://www.osti.gov/servlets/purl/1351809#page=38); [FRUS 1961–63, VII–IX, microfiche supp., doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v07-09mSupp/d127). See [[cal.1962-03-02.testing]].'
