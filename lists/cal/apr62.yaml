# Cal. XVIII April 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVIII
entries:
  - id: cal.1962-04-01.voting-rights
    when: Apr. 1
    date: '1962-04-01'
    thread: voting-rights
    c: The Voter Education Project begins under the Southern Regional Council, with foundation money and the Justice Department's encouragement. Check the date.
    n: See [[cal.1962-03-27.voting-rights]]. Carson, *In Struggle* (K–J Cong. II.F).
  - id: cal.1962-04-03.latin-america
    when: Apr. 3–4
    date: '1962-04-03'
    thread: latin-america
    c: Goulart in Washington; he addresses Congress. Check.
    n: See [[cal.1961-08-25.latin-america]].
  - id: cal.1962-04-04.vietnam
    when: Apr. 4
    date: '1962-04-04'
    thread: vietnam
    c: Galbraith's memorandum from New Delhi. The United States should seek a neutral settlement, through Harriman, before it is drawn in. Kennedy sends it to McNamara; the Chiefs reject it.
    n: 'Galbraith, *Ambassador''s Journal* (K–J Adm. II.G.4). FRUS vol. 2. Names: Galbraith (K–J Adm. III.E).'
  - id: cal.1962-04-08.cuba
    when: Apr. 8
    date: '1962-04-08'
    thread: cuba
    c: The Bay of Pigs prisoners sentenced to thirty years, or $62 million in ransom. Sixty wounded freed on credit on the 14th. Check.
    n: See [[cal.1961-04-15.cuba]].
  - id: cal.1962-04-10.steel
    when: Apr. 10
    date: '1962-04-10'
    thread: steel
    c: Roger Blough of U.S. Steel calls at the White House at a quarter to six and hands Kennedy the press release. Six dollars a ton.
    n: McConnell, *Steel and the Presidency*; Rowen, *Free Enterprisers*; Heath, *Kennedy and the Business Community* (K–J Adm. II.B). See [[cal.1961-09-06.steel]].
  - id: cal.1962-04-11.steel
    when: Apr. 11
    date: '1962-04-11'
    thread: steel
    c: 'Press conference: "a tiny handful of steel executives whose pursuit of private power and profit exceeds their sense of public responsibility." The Justice Department moves; the Pentagon shifts orders.'
    n: 'News Conference (Apr. 11, 1962). Navasky, *Kennedy Justice* (K–J Adm. II.E). Names: Robert F. Kennedy (K–J Adm. III.A).'
  - id: cal.1962-04-13.steel
    when: Apr. 13
    date: '1962-04-13'
    thread: steel
    c: Inland and Kaiser having held, Bethlehem rescinds; U.S. Steel follows late in the afternoon. The business press turns on Kennedy.
    n: See [[cal.1962-04-10.steel]].
  - id: cal.1962-04-25.testing
    when: Apr. 25
    date: '1962-04-25'
    thread: testing
    c: American atmospheric testing resumes near Christmas Island.
    n: See [[cal.1962-03-02.testing]].
  - id: cal.1962-04-29.press-and-broadcasting
    when: Apr. 29
    date: '1962-04-29'
    thread: press-and-broadcasting
    c: Dinner for the Nobel laureates of the Western Hemisphere. "The most extraordinary collection of talent ... ever gathered at the White House, with the possible exception of when Thomas Jefferson dined alone."
    n: Remarks at a Dinner Honoring Nobel Prize Winners of the Western Hemisphere (Apr. 29, 1962).
