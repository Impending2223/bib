    when: Apr. 27
    date: '1962-04-27'
    thread: opinion
    also: [cities-and-housing]
    c: 'Gallup, Apr. 6–11: a department of urban affairs, 50 percent for, 30 against. Republicans 37 for, 42 against.'
    n: '[[w.gallup-poll]], III, 1764.'
  - id: cal.1962-04-27.conservation
    when: Apr. 27
    date: '1962-04-27'
    thread: conservation
    c: 'Executive Order 11017: a Recreation Advisory Council of the Secretaries of the Interior, Agriculture, Defense and Health, Education, and Welfare and the Housing Administrator, the chair rotating; the new Bureau of Outdoor Recreation in Interior.'
    n: '[Exec. Order No. 11,017](https://www.presidency.ucsb.edu/documents/executive-order-11017-providing-for-coordination-with-respect-outdoor-recreation-resources), [27 Fed. Reg. 4141](https://www.govinfo.gov/app/details/FR-1962-04-28) (Check the issue). See [[cal.1962-04-04.conservation]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-28.georgia-ga
    when: Apr. 28
    date: '1962-04-28'
    thread: georgia
    also: [court, elections-1962]
    c: '*Sanders v. Gray*, Atlanta. A three-judge court, Tuttle sitting, enjoins the county unit system in any primary where its allotment of units falls short of the court''s standard: Fulton County, 14.1 percent of the people, has 1.46 percent of the 410 units. The General Assembly had amended the system days before; the new system "misses the mark."'
    n: '*Sanders v. Gray*, [203 F. Supp. 158](https://static.case.law/f-supp/203/case-pdfs/0158-01.pdf) (N.D. Ga. 1962). [[w.bartley-from-thurmond-to-wallace]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-03-26.court]]. Names: Tuttle.'
    tags: [name:tuttle-elbert-p, state:ga]
  - id: cal.1962-04-29.press-and-broadcasting
    when: Apr. 29
    date: '1962-04-29'
    thread: press-and-broadcasting
    c: Dinner for the Nobel laureates. "With the possible exception of when Thomas Jefferson dined alone."
    n: '[Remarks at a Dinner Honoring Nobel Prize Winners of the Western Hemisphere](https://www.presidency.ucsb.edu/documents/remarks-dinner-honoring-nobel-prize-winners-the-western-hemisphere) (Apr. 29, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-29.opinion
    when: Apr. 29
    date: '1962-04-29'
    thread: opinion
    c: 'Gallup, Apr. 6–11: the most important problem, war, peace, and international tension, 63 percent; cost of living and taxes, 10; unemployment, 8; racial problems, 6. The Democrats better able to handle it, 40; the Republicans, 16.'
    n: '[[w.gallup-poll]], III, 1764.'
