# Cal. XVIII April 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVIII
entries:
  - id: cal.1962-04-01.voting-rights
    when: Apr. 1
    date: '1962-04-01'
    thread: voting-rights
    c: 'Voter Education Project begins: the Southern Regional Council, foundation money, the Justice Department''s blessing.'
    n: Carson, *In Struggle* (K–J Cong. II.F). See [[cal.1962-03-27.voting-rights]].
  - id: cal.1962-04-03.latin-america
    when: Apr. 3–4
    date: '1962-04-03'
    thread: latin-america
    c: Goulart in Washington; addresses Congress.
    n: See [[cal.1961-08-25.latin-america]].
  - id: cal.1962-04-04.vietnam
    when: Apr. 4
    date: '1962-04-04'
    thread: vietnam
    c: 'Galbraith from New Delhi: seek a neutral settlement, through Harriman. Kennedy sends it to McNamara; the Chiefs reject it.'
    n: 'Galbraith, *Ambassador''s Journal* (K–J Adm. II.G.4). [FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02). See [[cal.1961-01-28.vietnam]]. Names: Galbraith, Harriman (K–J Adm. III.E).'
  - id: cal.1962-04-08.cuba
    when: Apr. 8
    date: '1962-04-08'
    thread: cuba
    c: 'Bay of Pigs prisoners sentenced: thirty years, or $62 million. Sixty wounded freed on credit, Apr. 14. Check the release date.'
    n: '[FRUS vol. 10, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v10/d321). See [[cal.1961-04-15.cuba]].'
  - id: cal.1962-04-10.steel
    when: Apr. 10
    date: '1962-04-10'
    thread: steel
    c: Blough at the White House, 5:45 p.m., with the release. Six dollars a ton.
    n: McConnell, *Steel and the Presidency*; Rowen, *Free Enterprisers*; Heath, *Kennedy and the Business Community* (K–J Adm. II.B). See [[cal.1961-09-06.steel]].
  - id: cal.1962-04-11.steel
    when: Apr. 11
    date: '1962-04-11'
    thread: steel
    c: 'Press conference: "a tiny handful of steel executives." The Justice Department and Pentagon purchasing move.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-194) (Apr. 11, 1962). Navasky, *Kennedy Justice* (K–J Adm. II.E). See [[cal.1962-04-10.steel]]. Names: Robert F. Kennedy (K–J Adm. III.A); McNamara (K–J Adm. III.F).'
  - id: cal.1962-04-13.steel
    when: Apr. 13
    date: '1962-04-13'
    thread: steel
    c: Inland and Kaiser hold. Bethlehem rescinds; U.S. Steel follows.
    n: See [[cal.1962-04-10.steel]].
  - id: cal.1962-04-25.testing
    when: Apr. 25
    date: '1962-04-25'
    thread: testing
    c: U.S. atmospheric testing resumes near Christmas Island.
    n: See [[cal.1962-03-02.testing]].
  - id: cal.1962-04-29.press-and-broadcasting
    when: Apr. 29
    date: '1962-04-29'
    thread: press-and-broadcasting
    c: Dinner for the Nobel laureates. "With the possible exception of when Thomas Jefferson dined alone."
    n: '[Remarks at a Dinner Honoring Nobel Prize Winners of the Western Hemisphere](https://www.presidency.ucsb.edu/documents/remarks-dinner-honoring-nobel-prize-winners-the-western-hemisphere) (Apr. 29, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
