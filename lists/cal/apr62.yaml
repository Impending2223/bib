  - id: cal.1962-04-05.transportation
    when: Apr. 5
    date: '1962-04-05'
    thread: transportation
    also: [cities-and-housing]
    c: 'Special message on transportation. Minimum-rate regulation lifted from all carriage of bulk and farm commodities, as now for water carriers; inter-city passenger fares in time under maximum rates only. User charges: 2 cents a gallon on jet fuel and on fuel used on the inland waterways; 5 percent on airline tickets and waybills. Mass transit grants through the HHFA: $500 million over three years, $100 million in fiscal 1963.'
    n: '[Special Message to the Congress on Transportation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transportation) (Apr. 5, 1962). [[w.friedlaender-dilemma-of-freight-transport]]; [[w.smerk-urban-transportation]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-06.opinion
    when: Apr. 6
    date: '1962-04-06'
    thread: opinion
    also: [elections-1962]
    c: 'Gallup, Mar. 15–20, on Edward Kennedy''s candidacy for the Senate: no figures printed. Opinion by party; Democrats and Independents mostly for, the whole on balance favorable.'
    n: '[[w.gallup-poll]], III, 1760. Names: Edward M. Kennedy.'
    tags: [name:kennedy-edward-m]
  - id: cal.1962-04-06.state-and-city-finance-detroit
    when: Apr. 6
    date: '1962-04-06'
    thread: state-and-city-finance
    c: Detroit. Cavanagh proposes a city income tax of 1 percent, on residents and on what nonresidents earn in the city; adopted by the Common Council. Swainson vetoes the legislature's bill against taxing commuters. In force July 1.
    n: '[Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan) (Check: the ordinance and the veto message). [[w.fine-violence-in-the-model]]. Names: Cavanagh, Swainson.'
    tags: [state:mi, city:detroit, name:cavanagh-jerome-p, name:swainson-john-b]
  - id: cal.1962-04-08.cuba
    when: Apr. 8
    date: '1962-04-08'
    thread: cuba
    c: 'Bay of Pigs prisoners sentenced: thirty years, or $62 million. Sixty wounded freed on credit, Apr. 14. Check the release date.'
    n: '[FRUS vol. 10, doc. 321](https://history.state.gov/historicaldocuments/frus1961-63v10/d321). See [[cal.1961-04-15.cuba]].'
  - id: cal.1962-04-08.opinion
    when: Apr. 8
    date: '1962-04-08'
    thread: opinion
    also: [trade, european-community]
    c: 'Gallup, Mar. 8–13: more trade with other countries important, 65 percent. 46 have heard of the administration''s trade plan, 13 can describe it. Of those who had heard, lower tariffs 38, higher 15.'
    n: '[[w.gallup-poll]], III, 1761.'
  - id: cal.1962-04-09.european-community
    when: Apr. 9–12
    date: '1962-04-09'
    thread: european-community
    c: 'Hallstein in Washington; with Rusk and Ball, Apr. 9. Joint statement with Kennedy, Apr. 12: "an Atlantic Partnership founded on close cooperation between two equal partners"; the Common Market''s first stage completed; Kennedy on American farm exports; Hallstein for the President''s trade program.'
    n: '[Joint Statement following Discussions With the President of the European Economic Community](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-president-the-european-economic-community) (Apr. 12, 1962). [FRUS 1961–63, XIII, doc. 33](https://history.state.gov/historicaldocuments/frus1961-63v13/d33). See [[cal.1961-05-16.european-community]]. Names: Hallstein, Rusk, Ball.'
    tags: [name:hallstein-walter, name:rusk-dean, name:ball-george-w, name:kennedy-john-f]
  - id: cal.1962-04-09.middle-east
    when: Apr. 9
    date: '1962-04-09'
    thread: middle-east
    c: 'Security Council, Resolution 171, on Israel''s raid of Mar. 16–17 on Syrian gun positions above Lake Tiberias: a flagrant violation of its resolution of 1956. Adopted 10–0, France abstaining (Check); the United States for. Kennedy, Apr. 10, to the State Department: why was he not kept informed?'
    n: '[S.C. Res. 171](https://undocs.org/S/RES/171(1962)) (Apr. 9, 1962). FRUS 1961–63, XVII, docs. [216](https://history.state.gov/historicaldocuments/frus1961-63v17/d216), [226](https://history.state.gov/historicaldocuments/frus1961-63v17/d226), [242](https://history.state.gov/historicaldocuments/frus1961-63v17/d242). [[w.shlaim-iron-wall]]; [[w.bass-support-any-friend]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-04-10.steel
    when: Apr. 10
    date: '1962-04-10'
    thread: steel
    c: Blough at the White House, 5:45 p.m., with the release. Six dollars a ton.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-194) (Apr. 11, 1962). [[w.mcconnell-steel-and-the-presidency]]; [[w.rowen-free-enterprisers]]; [[w.heath-john-f-kennedy-and]]. See [[cal.1961-09-06.steel]]. Names: Blough.'
    tags: [name:kennedy-john-f, name:blough-roger-m]
  - id: cal.1962-04-10.specials
    when: Apr. 10
    date: '1962-04-10'
    thread: specials
    also: [south-carolina]
    c: 'South Carolina 2d, special. Corinne Boyd Riley (D), unopposed, to her husband''s seat. No swing: Riley unopposed in 1960.'
    n: '[108 Cong. Rec., House, Apr. 12, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt5/pdf/GPO-CRECB-1962-pt5-7-1.pdf) (Riley sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Corinne Boyd Riley, John J. Riley.'
    tags: [special:1962-04-10-h-SC-2, name:riley-john-j, name:riley-corinne-boyd]
