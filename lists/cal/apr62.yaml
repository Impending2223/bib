    c: 'South Carolina 2d, special. Corinne Boyd Riley (D), unopposed, to her husband''s seat. No swing: Riley unopposed in 1960.'
    n: '[108 Cong. Rec., House, Apr. 12, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt5/pdf/GPO-CRECB-1962-pt5-7-1.pdf) (Riley sworn). See [[cal.1961-04-04.states-and-cities]].'
