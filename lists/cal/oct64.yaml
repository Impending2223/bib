# Cal. LIII October 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LIII
entries:
  - id: cal.1964-10-01.students
    when: Oct. 1–2
    date: '1964-10-01'
    thread: students
    also: [states-and-cities]
    c: 'Berkeley. Weinberg, a former student, arrested at a CORE table on Sproul Plaza, the University enforcing its ban on political tables and fund-raising there since Sept. 14; students hold the police car 32 hours, Savio speaking from its roof. Oct. 2, 7:30 p.m.: Kerr and the students'' representatives sign a pact. The Free Speech Movement formed, Oct. 3–4.'
    n: 'Free Speech Movement, [*Chronicle of the Free Speech Controversy*](https://www.fsm-a.org/stacks/FSM_chronofcontrov.html) (leaflet). Rorabaugh, *Berkeley at War*; Cohen, *Freedom''s Orator*; Gitlin, *The Sixties* (K–J Cong. II.F). *Berkeley in the Sixties* (K–J Cong. I.B). See [[cal.1962-06-11.students]]. Names: Savio (K–J Cong. III.H); Weinberg, Kerr (K–J Cong. III.K).'
    tags: [name:savio-mario, name:weinberg-jack, name:kerr-clark]
  - id: cal.1964-10-03.congress
    when: Oct. 3
    date: '1964-10-03'
    thread: congress
    c: '88th Congress adjourns sine die: the Senate at 1:41 p.m., the House at 3:16. Passed in the second session: the tax cut, civil rights, the poverty program, wilderness, food stamps, mass transit, housing. Left: Medicare, in conference; Appalachia and the disability amendment, passed by the Senate only.'
    n: '[110 Cong. Rec., Senate, Oct. 3, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-5-1.pdf); [House](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-5-2.pdf). [Statement by the President Reviewing the Work of the 88th Congress](https://www.presidency.ucsb.edu/documents/statement-the-president-reviewing-the-work-the-88th-congress) (Oct. 3, 1964). CQ Almanac 1964; *Congress and the Nation*, vol. 1 (K–J Cong. II.L). Sundquist, *Politics and Policy*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). See [[cal.1964-01-07.congress]]; [[cal.1964-09-02.medicare]]; [[cal.1964-09-25.jobs-and-wages]]; [[cal.1964-09-28.succession]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-10-06.elections-1964
    when: Oct. 6–9
    date: '1964-10-06'
    thread: elections-1964
    also: [civil-rights-bill]
    c: 'The "Lady Bird Special": Mrs. Johnson by train from Alexandria through the South to New Orleans. Johnson joins her there, Oct. 9; on the civil rights law, he quotes an old Southern Senator: "All they ever hear at election time is Negro, Negro, Negro!"'
    n: '[Remarks at the Station in Alexandria, Va., at the Start of Mrs. Johnson''s Trip Through the South](https://www.presidency.ucsb.edu/documents/remarks-the-station-alexandria-va-the-start-mrs-johnsons-trip-through-the-south) (Oct. 6, 1964); [Remarks at a Fundraising Dinner in New Orleans](https://www.presidency.ucsb.edu/documents/remarks-fundraising-dinner-new-orleans) (Oct. 9, 1964). Lady Bird Johnson, *A White House Diary* (K–J Adm. II.G.3). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1964-09-07.elections-1964]]. Names: Lady Bird Johnson (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lady-bird, name:johnson-lyndon-b]
  - id: cal.1964-10-07.foreign-aid
    when: Oct. 7
    date: '1964-10-07'
    thread: foreign-aid
    c: Foreign Assistance Act of 1964, [78 Stat. 1009](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1009.pdf), and the aid appropriation, [78 Stat. 1015](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1015.pdf), signed. Conference report, Senate Oct. 2, [35–15](https://voteview.com/rollcall/RS0880534); the reapportionment rider dropped.
    n: '[110 Cong. Rec., Senate, Oct. 2, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt18/pdf/GPO-CRECB-1964-pt18-4-1.pdf). Ruttan, *United States Development Assistance Policy* (K–J Adm. II.D). See [[cal.1963-12-24.foreign-aid]]; [[cal.1964-09-10.court]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-10-08.foreign-aid
    when: Oct. 8
    date: '1964-10-08'
    thread: foreign-aid
    also: [farm]
    c: 'Food for Peace extended two years, [78 Stat. 1035](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1035.pdf). Johnson signs, but holds two provisions a breach of the separation of powers: an agriculture committee''s veto over uses of the foreign currencies, and a committee partly of members of Congress to pass on low-interest loans. Conference report, Senate Sept. 24, [54–11](https://voteview.com/rollcall/RS0880525).'
    n: '[Statement by the President Upon Signing Bill Extending the Agricultural Trade and Assistance Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-extending-the-agricultural-trade-and-assistance) (Oct. 8, 1964). Ruttan, *United States Development Assistance Policy* (K–J Adm. II.D). See [[cal.1964-10-07.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-10-11.opinion
    when: Oct. 11
    date: '1964-10-11'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Sept. 18–23: the most important problem: international, the cold war, 46 percent; racial 35; cost of living 6; unemployment 4; too much government control 4. The party better able to handle it: Democratic 49, Republican 23, no difference 19.'
    n: '*The Gallup Poll*, III, 1905 (K–J Cong. II.E).'
  - id: cal.1964-10-14.elections-1964
    when: Oct. 14
    date: '1964-10-14'
    thread: elections-1964
    c: Jenkins, Johnson's chief aide, resigns. Arrested Oct. 7 with another man in a YMCA washroom near the White House, charged with disorderly conduct; arrested on the same charge in 1959. Johnson orders an FBI inquiry; Hoover reports, Oct. 22, no breach of security. Check the date of the report.
    n: '[Statement by the President on Walter Jenkins](https://www.presidency.ucsb.edu/documents/statement-the-president-walter-jenkins) (Oct. 15, 1964). White, *The Making of the President 1964* (Opp. II.E). Dallek, *Flawed Giant* (K–J Adm. II.A). See [[cal.1964-09-07.elections-1964]]. Names: Jenkins (K–J Adm. III.C); Hoover (K–J Adm. III.I).'
    tags: [name:jenkins-walter-w, name:johnson-lyndon-b, name:hoover-j-edgar]
  - id: cal.1964-10-14.king
    when: Oct. 14
    date: '1964-10-14'
    thread: king
    c: 'The Norwegian Nobel Committee awards the 1964 Peace Prize to King, 35, in St. Joseph''s Hospital, Atlanta, for rest. At his bedside press conference, with Coretta King and Andrew Young: "every penny" of the $54,000 to the movement; no call from the White House that he knows of; Goldwater against civil rights. Connor: "scraping the bottom of the barrel."'
    n: '[The Nobel Peace Prize 1964](https://www.nobelprize.org/prizes/peace/1964/king/facts/); [WSB-TV newsfilm of the press conference](https://crdl.usg.edu/id:ugabma_wsbn_wsbn38277) (Oct. 14, 1964). Branch, *Pillar of Fire* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Fairclough, *To Redeem the Soul of America* (K–J Cong. II.F). See [[cal.1963-10-10.king]]. Names: King (K–J Cong. III.H); Coretta Scott King, Connor (K–J Cong. III.K); Goldwater (Opp. III.B).'
    tags: [name:king-martin-luther-jr, name:king-coretta-scott, name:young-andrew-j-jr, name:goldwater-barry-m, name:connor-eugene]
  - id: cal.1964-10-15.soviet-union
    when: Oct. 15
    date: '1964-10-15'
    thread: soviet-union
    c: Khrushchev removed, "for reasons of age and health." Called back to Moscow from his Black Sea vacation, Oct. 13; relieved by the Central Committee, Oct. 14, of party and government posts and his Presidium seat. Brezhnev First Secretary, Kosygin Chairman of the Council of Ministers. Oct. 16, Dobrynin brings Johnson the new government's wish "to continue in seeking for steps toward a more solid peace."
    n: 'FRUS 1964–68, XIV, docs. [51](https://history.state.gov/historicaldocuments/frus1964-68v14/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v14/d52), [53](https://history.state.gov/historicaldocuments/frus1964-68v14/d53), [55](https://history.state.gov/historicaldocuments/frus1964-68v14/d55). [Statement by the President Following a Meeting With the Russian Ambassador](https://www.presidency.ucsb.edu/documents/statement-the-president-following-meeting-with-the-russian-ambassador) (Oct. 16, 1964). Fursenko & Naftali, *Khrushchev''s Cold War*; *Prezidium TsK KPSS 1954–1964* (K–J Adm. II.D). Khrushchev, *Vremya. Lyudi. Vlast''*; Dobrynin, *In Confidence* (K–J Adm. II.G.7). William Taubman, *Khrushchev: The Man and His Era* (2003). Names: Khrushchev, Kosygin, Dobrynin (K–J Adm. III.J); Brezhnev (Adm. III.J); Johnson (K–J Adm. III.D).'
    tags: [name:khrushchev-nikita-s, name:brezhnev-leonid, name:kosygin-aleksei, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1964-10-15.europe-and-the-alliance
    when: Oct. 15–16
    date: '1964-10-15'
    thread: europe-and-the-alliance
    c: 'Britain votes. Labour 317 seats, the Conservatives 304, the Liberals 9: a majority of four. Wilson Prime Minister, Oct. 16, for Douglas-Home. Johnson''s message the same day.'
    n: '[Message of Congratulation to the Right Honorable Harold Wilson](https://www.presidency.ucsb.edu/documents/message-congratulation-the-right-honorable-harold-wilson) (Oct. 16, 1964). [FRUS 1964–68, XII, doc. 230](https://history.state.gov/historicaldocuments/frus1964-68v12/d230). Wilson, *The Labour Government, 1964–1970* (K–J Adm. II.G.7). Priest, *Kennedy, Johnson and NATO*; Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). Names: Wilson (K–J Adm. III.J).'
    tags: [name:wilson-harold, name:douglas-home-alec, name:johnson-lyndon-b]
  - id: cal.1964-10-16.testing
    when: Oct. 16
    date: '1964-10-16'
    thread: testing
    also: [india-and-china]
    c: 'China explodes its first atomic device, on a tower at Lop Nur, Sinkiang, about 3 a.m. Eastern time. Johnson: "no surprise"; its military significance "should not be overestimated"; the commitments in Asia stand. On Sept. 15 Rusk, McNamara and Bundy, with Johnson''s approval, had ruled out "unprovoked unilateral" action against China''s nuclear plants.'
    n: '[Statement by the President on the First Chinese Nuclear Device](https://www.presidency.ucsb.edu/documents/statement-the-president-the-first-chinese-nuclear-device) (Oct. 16, 1964). FRUS 1964–68, XXX, docs. [49](https://history.state.gov/historicaldocuments/frus1964-68v30/d49), [57](https://history.state.gov/historicaldocuments/frus1964-68v30/d57). William Burr & Jeffrey T. Richelson, *Whether to "Strangle the Baby in the Cradle": The United States and the Chinese Nuclear Program, 1960–64*, [25 Int''l Security 54](https://doi.org/10.1162/016228800560525) (2000–01). See [[cal.1963-10-07.testing]]. Names: Rusk, Bundy (K–J Adm. III.E); McNamara (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge]
  - id: cal.1964-10-16.poverty
    when: Oct. 16
    date: '1964-10-16'
    thread: poverty
    c: 'Shriver sworn in as Director of the Office of Economic Opportunity, keeping the Peace Corps. The program''s first money in the Supplemental Appropriation Act, signed Oct. 7, [78 Stat. 1023](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1023.pdf): $800 million, community action up to $300 million.'
    n: '[Remarks at the Swearing In of Sargent Shriver as Director, Office of Economic Opportunity](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-sargent-shriver-director-office-economic-opportunity) (Oct. 16, 1964). Gillette, *Launching the War on Poverty* (K–J Adm. II.B). Stossel, *Sarge* (K–J Adm. II.G.5). See [[cal.1964-08-20.poverty]]. Names: Shriver (K–J Adm. III.G).'
    tags: [name:shriver-r-sargent, name:johnson-lyndon-b]
  - id: cal.1964-10-16.school-aid
    when: Oct. 16
    date: '1964-10-16'
    thread: school-aid
    c: National Defense Education Act Amendments signed, [78 Stat. 1100](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1100.pdf). The act carried through fiscal 1968, its aid widened from science, mathematics and languages to history, civics, geography, English and reading; aid to impacted areas a year more. Conference report, House Oct. 1, [320–20](https://voteview.com/rollcall/RH0880231).
    n: '[Remarks Upon Signing Bill Amending the National Defense Education Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-amending-the-national-defense-education-act) (Oct. 16, 1964). Graham, *The Uncertain Triumph* (K–J Adm. II.B). See [[cal.1963-12-18.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-10-18.soviet-union
    when: Oct. 18
    date: '1964-10-18'
    thread: soviet-union
    also: [testing, europe-and-the-alliance]
    c: 'Address on the week. Khrushchev "forced out of power by his former friends and colleagues"; Moscow plans no change in basic foreign policy. Lop Nor: the test ban upheld; nations without nuclear arms promised support "against some threat of nuclear blackmail." The Labour government: "our friends."'
    n: '[Radio and Television Report to the American People on Recent Events in Russia, China, and Great Britain](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-recent-events-russia-china-and-great) (Oct. 18, 1964). See [[cal.1964-10-15.soviet-union]]; [[cal.1964-10-16.testing]]; [[cal.1964-10-15.europe-and-the-alliance]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:khrushchev-nikita-s]
  - id: cal.1964-10-19.goldwater
    when: Oct. 19
    date: '1964-10-19'
    thread: goldwater
    also: [elections-1964]
    c: Jenkins. Goldwater, once his commanding officer in an Air Force Reserve unit, questioned by FBI agents, asks Hoover why Jenkins had no rigorous security check before he joined the White House. On the stump, no more than an allusion to Johnson's "curious crew"; his staff told to make no use of the arrest, by one of their accounts. Check the date.
    n: '[E. W. Kenworthy, "Goldwater Asks F.B.I. to Explain Check on Jenkins," *New York Times*, Oct. 20, 1964](https://www.nytimes.com/1964/10/20/archives/goldwater-asks-fbi-to-explain-check-on-jenkins.html). Middendorf, *A Glorious Disaster*; Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-10-14.elections-1964]]. Names: Jenkins (K–J Adm. III.C); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m, name:jenkins-walter-w, name:hoover-j-edgar, name:johnson-lyndon-b]
  - id: cal.1964-10-20.goldwater
    when: Oct. 20–22
    date: '1964-10-20'
    thread: goldwater
    also: [elections-1964]
    c: '"Choice," a half-hour film for Mothers for Moral America, a unit of Citizens for Goldwater-Miller: riots, protests, the decline of morals. Some 200 prints out; NBC to show it Oct. 22. Goldwater, having seen it, calls it "a racist film" and stops it. Check the dates.'
    n: 'Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1964-09-03.goldwater]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-10-20.voting-rights
    when: Oct. 20
    date: '1964-10-20'
    thread: voting-rights
    also: [mississippi]
    c: 'Jackson. A three-judge court strikes down Mississippi''s act of Apr. 23: a voter exempt from the poll tax by the Twenty-fourth Amendment to show, in federal elections, receipts issued without payment and obtained by Feb. 1. A heavier procedure than for voters the State itself exempts; void under the Amendment. On the suit of Victoria Gray, beaten in the Senate primary June 2, and a Forrest County voter.'
    n: '*Gray v. Johnson*, [234 F. Supp. 743](https://static.case.law/f-supp/234/html/0743-01.html) (S.D. Miss. 1964). Lawson, *Black Ballots* (K–J Cong. II.C). See [[cal.1964-01-23.voting-rights]]. Names: Gray (K–J Cong. III.K).'
    tags: [name:gray-victoria-jackson, name:cox-w-harold]
  - id: cal.1964-10-21.vietnam
    when: Oct. 21
    date: '1964-10-21'
    thread: vietnam
    also: [elections-1964]
    c: 'Johnson at the University of Akron: "we are not about to send American boys 9 or 10,000 miles away from home to do what Asian boys ought to be doing for themselves." Neither a wider war nor withdrawal.'
    n: '[Remarks in Memorial Hall, Akron University](https://www.presidency.ucsb.edu/documents/remarks-memorial-hall-akron-university) (Oct. 21, 1964). Logevall, *Choosing War* (K–J Adm. II.D). See [[cal.1964-08-07.vietnam]]; [[cal.1964-09-07.elections-1964]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-10-24.vietnam
    when: Oct. 24
    date: '1964-10-24'
    thread: vietnam
    c: Saigon. The High National Council, set up to give the South a civilian government, names Phan Khắc Sửu Chief of State over Minh, its charter promulgated Oct. 20. Khánh resigns as Prime Minister to Sửu, Oct. 27; Trần Văn Hương, former mayor of Saigon, Prime Minister-designate by Oct. 31. Taylor protests he was not consulted. Check the charter's date.
    n: 'FRUS 1964–68, I, docs. [385](https://history.state.gov/historicaldocuments/frus1964-68v01/d385), [387](https://history.state.gov/historicaldocuments/frus1964-68v01/d387), [389](https://history.state.gov/historicaldocuments/frus1964-68v01/d389), [390](https://history.state.gov/historicaldocuments/frus1964-68v01/d390). See [[cal.1964-09-13.vietnam]]. Names: Dương Văn Minh, Khánh, Trần Văn Hương (Viet. III.G); Taylor (K–J Adm. III.F).'
    tags: [name:phan-khac-suu, name:duong-van-minh, name:nguyen-khanh, name:tran-van-huong, name:taylor-maxwell]
  - id: cal.1964-10-26.elections-1964
    when: Oct. 26
    date: '1964-10-26'
    thread: elections-1964
    c: 'Johnson in Georgia and South Carolina. Macon, City Hall, with Sanders, Talmadge and Vinson, Russell absent: "The new South is here in America." A rally at Augusta. Columbia, the State Capitol steps, at night, with Senator Olin Johnston.'
    n: '[Remarks at City Hall, Macon, Georgia](https://www.presidency.ucsb.edu/documents/remarks-city-hall-macon-georgia); [Remarks at a Rally in Augusta, Georgia](https://www.presidency.ucsb.edu/documents/remarks-rally-augusta-georgia); [Remarks on the Steps of the State Capitol, Columbia, South Carolina](https://www.presidency.ucsb.edu/documents/remarks-the-steps-the-state-capitol-columbia-south-carolina) (Oct. 26, 1964). White, *The Making of the President 1964*; Cosman, *Five States for Goldwater* (Opp. II.E). See [[cal.1964-10-06.elections-1964]]. Names: Johnson (K–J Adm. III.D); Sanders (K–J Cong. III.K); Talmadge (Wg. III.F); Vinson (K–J Cong. III.D); Russell (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:sanders-carl-e, name:talmadge-herman-e, name:vinson-carl, name:russell-richard-b, name:johnston-olin-d]
  - id: cal.1964-10-27.elections-1964
    when: Oct. 27
    date: '1964-10-27'
    thread: elections-1964
    also: [goldwater]
    c: 'Reagan for Goldwater, "A Time for Choosing," a prerecorded half hour on NBC: "You and I have a rendezvous with destiny."'
    n: '[Address on Behalf of Senator Barry Goldwater: "A Time for Choosing"](https://www.presidency.ucsb.edu/documents/address-behalf-senator-barry-goldwater-time-for-choosing) (Oct. 27, 1964). Reagan, *A Time for Choosing* (Opp. II.I). Dallek, *The Right Moment* (Opp. II.E). Schoenwald, *A Time for Choosing*; Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-09-07.elections-1964]]. Names: Reagan (Opp. III.F); Goldwater (Opp. III.B).'
    tags: [name:reagan-ronald, name:goldwater-barry-m]
  - id: cal.1964-10-27.goldwater
    when: Oct. 27
    date: '1964-10-27'
    thread: goldwater
    also: [elections-1964]
    c: 'Moyers, in the campaign''s last days, asks the FBI for name checks on everyone in Goldwater''s Senate office. Hoover to Moyers, Oct. 27: information on two of the staff.'
    n: '[S. Rep. No. 94-755, Book II, 117, 228 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-ii.pdf#page=241) (K–J Adm. II.H.3). Made public: the Church Committee, Book II (1976), pp. 117, 228. Check whether earlier. Names: Moyers (K–J Adm. III.C); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
    tags: [name:moyers-bill, name:hoover-j-edgar, name:goldwater-barry-m]
  - id: cal.1964-10-30.civil-rights-bill
    when: Oct. 30
    date: '1964-10-30'
    thread: civil-rights-bill
    also: [desegregation-public-places]
    c: Collins's Community Relations Service surveys 53 cities over 50,000 in the nineteen States without public accommodations laws. In 51, more than two-thirds of the hotels desegregated; motels, 46; chain restaurants, 50; theaters, 49; libraries, 52.
    n: '[Statement by the President on the Results of a Survey of Compliance With the Civil Rights Act](https://www.presidency.ucsb.edu/documents/statement-the-president-the-results-survey-compliance-with-the-civil-rights-act) (Oct. 30, 1964). See [[cal.1964-07-02.civil-rights-bill]]; [[cal.1964-07-20.civil-rights-bill]]. Names: Collins (K–J Cong. III.F).'
    tags: [name:collins-leroy, name:johnson-lyndon-b]
