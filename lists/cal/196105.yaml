    thread: defense
    c: 'The Joint Chiefs, Lemnitzer in Southeast Asia, send McNamara their split views on his directive to plan a unified command of the Strategic Army Corps and Tactical Air Command: Decker and White for it, provided Navy and Marine units come in later; Burke for a joint task force only; Shoup for a doctrine only.'
