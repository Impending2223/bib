    also: [china-liu]
    c: 'Liu Shaoqi, in his home village, publicly apologizes for the food shortages: he has been guilty of bureaucratism; the Central Committee had known only how to procure more grain.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 57; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 520–521 (May 7, 1961; morning, Liu sweeps his mother''s grave at Shouzichong; afternoon, at the forum of grassroots cadres and members of Tanzichong brigade he says he has not been home in nearly forty years, and life is hard; the work was done badly, and he is sorry to them; production fell and life worsened chiefly through errors, not the weather; the mess halls have no advantage, save neither labor nor firewood, and are to be dissolved; housing, private plots, hogs and fowl, forests are then to be settled; the talk is in his Selected Works as "Talk with Tanzichong peasants"); [[w.dikotter-maos-great-famine]], 120 n.18 (a few days after he reaches his home village, Liu apologises to the villagers at a mass meeting: home for the first time in nearly forty years, their lives bitter, "we beg for your pardon"; the canteen dissolved that evening on his orders). Made public: 1996. To check: [[w.selections-from-china-mainland]], (Supplement), No. 26, 13 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 57 n.101a); [[w.xingdou-liu-shaoqi-he-tade]], 516 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 57 n.101b); [[w.shaoqi-liu-shaoqi-xuanji-selected]], the "Talk with the peasants of Tanzichong" (同炭子冲农民的谈话) (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521); Jin Chongji and Huang Zheng, eds., *Liu Shaoqi zhuan* (Beijing: Zhongyang wenxian chubanshe, 1998), 874 (cited by [[w.dikotter-maos-great-famine]], 120 n.18). Names: Liu Shaoqi.'
