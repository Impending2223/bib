    c: Zhu De writes to Mao, from his tour of Sichuan, Shaanxi and Henan, a long list of complaints about the mess-halls.{1}
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 66; [[w.yang-jisheng-mubei]], II, 767 n.54 (Zhu De''s letter to Mao of May 9: the mess halls have "five bads" and "eleven smashes"); [[w.zhu-de-nianpu-xinbian]], III, 1804–1805 (May 9, 1961; Zhu De 朱德 to Mao Zedong 毛泽东 on his inspection of Sichuan, Shaanxi, Henan and Hebei 四川、陕西、河南、河北, with proposals: since the urgent letter and the draft Sixty Articles the masses'' zeal high and household sidelines spreading, their chief fear the policy not kept; Henan better, but over two million still with oedema and disease and many animals dead; the mess halls Sichuan''s "two smokes" 两道烟 and Shaanxi''s "five bads" (short rations, labor and time wasted, no meals in the rain, mush all year); in eastern Henan 豫东 oedema down 40 to 50 percent within a month of letting members cook at home; the three provinces for restoring handicrafts, made state-owned too widely in 1958; the fairs lively, speculation with them, state commerce to lead; blockades between counties and communes to be broken; the ban on long-distance trading to be weighed case by case, peddlers being useful; farming, handicrafts and supply cooperatives one whole). Made public: 1997. To check: [[w.dangdai-zhongguode-zhejiang]], 1, 80 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.151a); [[w.de-zhu-de-xuanji-selected]], 374–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.151b); [[w.jin-1949-1989-niande-zhongguo]], 378 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153a); [[w.de-zhu-de-xuanji-selected]], 375 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153b); [[w.boying-deng-zihui-zhuan]], 344 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153c); [[w.aiguo-zhongguo-da-guang-jiao]], 1, 9–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153d); [[w.peng-zei-huairou-diaocha]], 15, 21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153e); Peking party committee report to the Center, May 17, 1961, in [[w.peng-zei-huairou-diaocha]], 15, 21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153f); Peking party committee report to the Center, May 18, 1961, in [[w.peng-zei-huairou-diaocha]], 15, 21 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 66 n.153g). Names: Zhu De, Mao Zedong.'
