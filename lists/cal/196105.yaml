  - id: cal.1961-05-31.latin-america-4
    when: May 31
    date: '1961-05-31'
    thread: latin-america
    c: 'Allen Dulles telephones Robert Kennedy in the morning: the reports of Trujillo''s death not verified. Half an hour later: probably "99 chances out of 100" that he has been assassinated.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 491–92 (by Kennedy''s notes dictated June 1, "yesterday morning"; the notes add that the United States had been in contact with some anti-Trujillo generals, had decided in the last week or so not to furnish the arms they asked, and had no contact with them now). To check: RFK, notes dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 491 n.82, 492 n.86). See [[cal.1961-05-30.latin-america]]. Names: Dulles, Robert Kennedy, Trujillo.'
