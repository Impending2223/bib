    c: 'Deng Xiaoping 邓小平 and Peng Zhen 彭真 to Mao Zedong 毛泽东, by letter, on a month''s inquiry in Shunyi 顺义 and Huairou 怀柔: zeal much raised by the Twelve and Sixty Articles; communes of about 10,000, the brigade the village, teams of about fifty households with work groups; grain: most teams for nine-tenths bought and one kept of the contracted surplus, four and six above it; surplus shared by work points and manure; the supply system to go, only five-guarantee and hard-pressed households helped; three guarantees and one reward; mess halls left to the members, small, accounted apart; animals and tools to the teams; supply cooperatives, handicrafts and sidelines restored.'
