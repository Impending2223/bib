    c: 'Kennedy to Schlesinger, back from Europe, by Schlesinger''s account: as a British prime minister he would have been thrown out; here failure has increased his charm. Evelyn Lincoln brings an advance on the Gallup poll, 82 percent behind the administration: "It''s just like Eisenhower. The worse I do, the more popular I get." Waving Lemnitzer''s cables from Laos: "If it hadn''t been for Cuba, we might be about to intervene in Laos. I might have taken this advice seriously."'
