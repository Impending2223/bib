    also: [cuba, crime-and-hijacking]
    c: 'Hoover to Robert Kennedy on the wiretap found in a Las Vegas hotel room Oct. 31, 1960, placed for Maheu.{1} Maheu to the FBI, Apr. 18: the tap was part of a project "on behalf of the CIA relative to anti-Castro activities."{2} Edwards, the CIA''s Director of Security, May 3: the Agency had used Giancana, through Maheu, against Castro; of the methods he knew nothing, it being "dirty business."{3} Kennedy, in the margin: "Courtney I hope this will be followed up vigorously."{4}'
    n: '[S. Rep. No. 94-465, 125–28 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=136); the tap, [77](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=88) (K–J Adm. II.H.3). The Bureau''s files already held Hoover''s memorandum of Oct. 18, 1960: Giancana had told friends Castro would be "done away with" in November (126). [[w.schlesinger-robert-kennedy-and-his]], 482–84, 493 (the tap, the Agency''s plea, Kennedy''s note); [[w.thomas-robert-kennedy]], 156 (his note to Evans on Hoover''s memorandum: "I hope this will be followed up vigorously"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: [[w.thomas-very-best-men]]; [[w.powers-man-who-kept-the]]. Names: Robert Kennedy, Hoover, Edwards, Giancana, Maheu, Castro.'
