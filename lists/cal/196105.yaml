  - id: cal.1961-05-13.china-leadership-3
    when: May 13
    date: '1961-05-13'
    place: changsha
    thread: china-liu
    c: 'Changsha. Liu Shaoqi hears the Xiangyin county committee on rectifying the communes. Peasants'' interests are not to be taken; restitution is to be thorough, but not all in money: goods, to help production and living. On "dividing the land to households": say plainly it is wrong and educate the masses; production is collective, and private plots, field margins and bank slopes are the members'' own. The work team is not to bestow favors; the masses call it "Bao Qingtian" and Liu thinks they are criticizing it. Cadres cannot be left without the mass line for want of skill; they are to be taught.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 523 (May 13, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
