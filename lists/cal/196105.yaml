  - id: cal.1961-05.latin-america-3
    when: May
    date: 1961-05
    thread: latin-america
    c: Rumors that Trujillo may be assassinated. Robert Kennedy, after a talk with Allen Dulles at the Pentagon, calls the President, who has known nothing of it. A task force to work out another course in case it happens; Goodwin on it.
    n: '[[w.schlesinger-robert-kennedy-and-his]], 491 (by Kennedy''s notes dictated June 1; the day not given); [[w.sen-church-alleged-assassination-plots]], 207 (Robert Kennedy talks with Dulles "apparently sometime in the early part of May," after reports of Trujillo''s imminent assassination, calls the President, and "decided at that time that we''d put a task force on the problem and try to work out some kind of alternative course of action in case this event did occur"; the President "had known nothing about it," Kennedy''s notes of June 1; not the Pentagon or Goodwin). To check: Robert F. Kennedy, notes dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 491 n.82). See [[cal.1961-02-17.latin-america]]. Names: Trujillo, Robert Kennedy, Dulles, Kennedy, Goodwin. Check: the day.'
