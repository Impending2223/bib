  - id: cal.1961-05-31.china-leadership-2
    when: May 31
    date: '1961-05-31'
    thread: china-sixty-articles
    also: [china-liu]
    follows:
      - cal.1961-05-31.china-leadership-3
      - cal.1961-05-31.china-leadership-4
      - cal.1961-05-31.china-leadership-5
    c: 'Liu Shaoqi to the work conference: the food problem is central; neither peasants, workers nor cadres have peace of mind.{1} 30 per cent natural calamities, 70 per cent man-made, he says, citing the Hunan peasants and Shanxi''s Tao Lujia.{2} The center bears responsibility for errors and deaths.{3} "We cannot go on like this."{4} Recovery in eight or ten years.{5}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 62; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524–525 (May 31, 1961; Liu presides at the Central Work Conference''s plenary meeting and sums up: the peasants of Hunan say "three parts natural calamity, seven parts man-made"; for the country as a whole natural calamity is the main cause in some places, but not in most, where the faults and errors in work are the main cause; in carrying out the general line, organizing communes and the Leap there were many faults, some serious; some inexperience made unavoidable, some avoidable and earlier discoverable); [[w.yang-shangkun-riji]], II, 38 (May 31, 1961; Liu Shaoqi speaks at the enlarged session); [[w.dikotter-maos-great-famine]], 121 n.20 (Liu at a gathering of leaders: "the centre is the principal culprit"; the Hunan saying, 30 per cent natural calamities, 70 per cent man-made; no longer one finger in ten); [[w.yang-jisheng-mubei]], II, 648 n.2 (natural disasters not the chief cause in most places; the shortcomings and errors of the work the chief cause); [[w.jian-zhou-enlai]], 459 (the May work conference: Liu, the disaster 30 percent natural, 70 percent human error; Mao silent); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 (printed as "The causes of the present economic difficulties and the way to overcome them" 《当前经济困难的原因及其克服的办法》, from *Liu Shaoqi xuanji*, II: every contradiction now shows in grain; the Hunan peasants'' "three parts natural disaster, seven parts man-made"; Tao Lujia for Shanxi, and Hebei, Shandong and Henan, put the errors of work first; the Center to take responsibility). Made public: 1985 ([[w.shaoqi-liu-shaoqi-xuanji-selected]], from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 356–363 prints it). Check: Made public: [[w.china-reconstructs]], Nov. 1967, Supplement, cited here, may quote the speech before 1985. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], 335–36 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.126); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127a); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127b); [[w.china-reconstructs]], Nov. 1967, Supplement, 8, 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.127c); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 337–38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.128); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 338 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129a); [[w.selected-works-of-liu]], 2, 316 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.129b); Liu Shaoqi, speech of May 31, 1961, Gansu Provincial Archives, 91-6-81, pp. 69–73 (cited by [[w.dikotter-maos-great-famine]], 121 n.20). Names: Liu Shaoqi, Tao Lujia.'
