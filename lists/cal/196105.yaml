  - id: cal.1961-05-03.africa
    when: May 3–5
    date: '1961-05-03'
    thread: africa
    c: Bourguiba of Tunisia on a state visit. May 5, Kennedy determines that up to $4.1 million of the year's military assistance funds may furnish Tunisia equipment.
    n: 'Remarks of Welcome to President Bourguiba of Tunisia at the Washington National Airport, [1961 Pub. Papers 349](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=407) (May 3, 1961); Joint Statement Following Discussions With President Bourguiba, [1961 Pub. Papers 363](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=421) (May 5, 1961). FRUS 1961–63, XXI, docs. [162](https://history.state.gov/historicaldocuments/frus1961-63v21/d162), [163](https://history.state.gov/historicaldocuments/frus1961-63v21/d163) (Presidential Determination No. 61-26). To check: [[w.muehlenbeck-betting-on-the-africans]]. Names: Bourguiba.'
    tags: [name:bourguiba-habib-ben-ali, name:kennedy-john-f]
  - id: cal.1961-05-03.cuba
    when: May 3
    date: '1961-05-03'
    thread: cuba-bay-of-pigs
    c: 'The Taylor board in McNamara''s office. McNamara: a marginal probability of success, the force grown from about 800 to 1,200, the air support, sea cover and landing site cutting the chances. Three reasons to go ahead: bringing the force home would say the United States would not help fight Communism; no other chance without Americans; the guerrilla fallback. The CIA''s chronology of D-2 to D+2 for the board the same day.'
    n: 'FRUS 1961–63, X, docs. [199](https://history.state.gov/historicaldocuments/frus1961-63v10/d199); [198](https://history.state.gov/historicaldocuments/frus1961-63v10/d198) (the chronology). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: McNamara.'
    src:
      c: 82af2f65
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d199: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d198: F'
    tags: [name:mcnamara-robert-s]
