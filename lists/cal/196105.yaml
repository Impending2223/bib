  - id: cal.1961-05-03.cuba
    when: May 3
    date: '1961-05-03'
    thread: cuba-bay-of-pigs
    c: 'The Taylor board in McNamara''s office. McNamara: a marginal probability of success, the force grown from about 800 to 1,200, the air support, sea cover and landing site cutting the chances. Three reasons to go ahead: bringing the force home would say the United States would not help fight Communism; no other chance without Americans; the guerrilla fallback. The CIA''s chronology of D-2 to D+2 for the board the same day.'
    n: 'FRUS 1961–63, X, docs. [199](https://history.state.gov/historicaldocuments/frus1961-63v10/d199); [198](https://history.state.gov/historicaldocuments/frus1961-63v10/d198) (the chronology). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-24.cuba]]. Names: McNamara.'
    src:
