      rows:
        - 'w.mann-grand-delusion 234: all'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1961-05-06.robert-kennedy
    when: May 6
    date: '1961-05-06'
    thread: robert-kennedy
    also: [desegregation-schools, georgia]
    c: 'Robert Kennedy at the University of Georgia Law School''s Law Day exercises, Athens, Ga. On Prince Edward County, Va., which had closed its schools: "if the orders of the court are circumvented, the Department of Justice will act. We will not stand by or be aloof. We will move." "I happen to believe that the 1954 decision was right."'
    n: '[Address at the Law Day Exercises of the University of Georgia Law School](https://www.justice.gov/ag/rfkspeeches/1961/05-06-1961.pdf) (May 6, 1961). [[w.schlesinger-robert-kennedy-and-his]], 293–94 (his quotation reads "stand by and be aloof"). To check: [[w.robert-kennedy-in-his]]; [[w.thomas-robert-kennedy]]; [[w.navasky-kennedy-justice]]; [[w.guthman-we-band-of-brothers]]; [[w.shesol-mutual-contempt]]; the text of the speech, *New York Times*, May 7, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 293 n.34). Names: Robert Kennedy.'
