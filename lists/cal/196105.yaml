  - id: cal.1961-05-01.cuba-4
    when: May 1
    date: '1961-05-01'
    thread: cuba
    also: [defense]
    c: 'CINCLANT''s planners give the Joint Chiefs an outline plan with McNamara''s five days'' reaction time. CINCLANT, the Chiefs approving, calls it unrealistic and proposes two tracks: OPLAN 314-61, simultaneous airborne and amphibious assaults on 18 days'' notice; OPLAN 316-61, airborne assault forces within 5 days, the amphibious invasion 3 days later.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 200. To check: WSEG, Cuba study, WSEG (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 200 n.23). See [[cal.1961-04-29.cuba]]. Names: McNamara.'
