    c: 'Mao, 4 a.m., has Zhou Enlai''s telephone report from Handan sent to every bureau and province: nearly all members want to cook at home, and Zhou is arranging the mess halls'' closing;{1} supply only for the "five guarantees" households and the needy; work points as in the higher cooperatives, output contracted to the teams, work to groups.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 7, 1961; [[w.zhou-enlai-nianpu-1949]], II, 409–10, May 7, 1961 (Zhou''s telephone report and Mao''s order to circulate it); [[w.macfarquhar-origins-of-the-cultural]], III, 49 (Zhou''s report from Handan: the three points); [[w.jianguo-yilai-mao-zedong]], XVI, 26–27 (May 7, 1961; Mao''s comment sending Zhou''s telephone report of 3:30 to 4 a.m. to the bureaus and provincial committees; the report''s points, note 1); [[w.mao-zedong-zhuan]], V, ch. 68 n.10 (May 7: Zhou Enlai telephones Mao from Handan of his survey at Boyan commune, Wu''an, four questions: the mess halls (nearly all members, women and bachelors too, want to cook at home), the supply system, the grain contract and the like; Mao has the record sent round). [[w.yang-jisheng-mubei]], II, 768 n.56 (Zhou Enlai''s report to Mao after his inquiry at Boyan commune in Wu''an, Hebei: nearly all members, women and single men among them, are willing to go home to cook; the members do not favor the supply system); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 (Zhou Enlai''s telephone report from the Handan 邯郸 district of May 7, printed from *Zhou Enlai xuanji*, II, as "On the inquiry into the mess halls, work points and other questions" 《关于食堂和评工记分等问题的调查》: three days of reports at Handan, then five days at Boyan 伯延 commune, Wu''an 武安 county; nearly all members, women and single men too, want to cook at home; members against the supply system, for keeping the "five guarantee" households; the work-point system of the higher cooperatives wanted back; the note: Mao forwarded it May 7 to the bureaus and committees). Made public: 1984 ([[w.enlai-zhou-enlai-xuanji-selected]], II (Renmin chubanshe, Nov. 1984, by CiNii Books NCID BA53138644), Zhou''s report, from which [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319 prints it, its note giving Mao''s forwarding). To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.67a); [[w.aiguo-zhongguo-da-guang-jiao]], 1, 10–11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.67b). Names: Mao Zedong, Zhou Enlai.'
