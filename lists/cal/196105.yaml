    also: [robert-kennedy, alabama-birmingham]
    c: 'Robert Kennedy by telephone to George Cruit, Greyhound''s superintendent at Birmingham: the drivers will not drive the riders on. "Surely somebody in the damn bus company can drive a bus, can''t they?" "Somebody better get in the damn bus and get it going and get these people on their way." Cruit records the call.'
