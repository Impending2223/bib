    n: 'Votes: Ariz. Secretary of State, Official Canvass, Special General Election, May 2, 1961, in Turnbow, *Ariz. Political Almanac*, 1962, [65](https://azmemory.azlibrary.gov/nodes/view/102593). See [[cal.1961-04-04.states-and-cities]]. Names: Morris Udall, Stewart Udall, Matheson.'
