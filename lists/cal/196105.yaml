  - id: cal.1961-05-21.china-leadership
    when: May 21–June 12
    date: '1961-05-21'
    place: peking
    thread: china-sixty-articles
    c: 'Peking, the Huairen Tang.{1} The Central Work Conference, Mao presiding (put off from May 15; its order set by the enlarged Standing Committee that evening).{2} The Sixty Articles revised: whether a team keeps a mess hall "wholly for the members to decide";{3} the supply part of distribution dropped.{4} Rules adopted: nine measures to cut town population and grain sales (Zhou Enlai''s, June 6);{5} repayment for levelling and transfers; forty articles on commerce, thirty-five on handicrafts, eighteen on forests.{6} Twenty million fewer in the towns in three years, ten this year; steel for 1961 cut from 18 to 11 million tons. Mao, May 21: repayment, 80 or 90 percent by next spring, some 20 billion yuan in all.{7} Zhu De and Peng Zhen attend.{8} The last two and a half days again on food, with speeches by Zhou, Chen Yun and Li Xiannian.{9} Mess halls: joined freely, run by their members at their own cost, free to leave.{10} Zhu De, May 31: the peasants miss 1957; the teahouses, inns and eating houses of the market towns to be restored.{11} Mao, closing, criticizes himself: the fight on the right should not have been carried to the masses; those wrongly criticized after Lushan are to be reviewed and cleared.{12}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 21, 1961 (the entries for May 21–June 12 and May 21; and June 6); [[w.zhou-enlai-nianpu-1949]], II, 414–15, May 21–June 12, 1961 (Zhou at the conference, with his speeches); [[w.macfarquhar-origins-of-the-cultural]], III, 61–62 (the three stages; the last days'' speeches by Zhou, Chen Yun and Li Xiannian); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524 (May 21–June 12, 1961; Liu attends; the conference revises the draft commune regulations on the Center''s and the regions'' investigations, makes the nine measures on cutting the urban population and town grain sales, discusses commerce and handicrafts, and decides to review the cases of members and cadres criticized and punished in the last ten years); [[w.deng-xiaoping-nianpu-1904]], III, 1641 (May 21–June 12, 1961; Deng attends; the revised draft Working Regulations from the leaders'' inquiries; the nine measures to cut the town population, by over 20 million in three years, 10 million this year; steel for 1961 cut from 18 to 11 million tons; repayment, investigation, the mass line, rehabilitation and punishment; commerce and handicrafts); [[w.mao-zedong-zhuan]], V, ch. 68 (May 21 to June 12, the Central Work Conference at Peking; May 23–26 on four of Mao''s questions (investigation, the mass line, repayment, rehabilitation), May 29–30 the sixty articles revised, May 31 and June 1 grain, June 2, 3 and 5 forests, commerce and handicrafts, then the cities and industry briefly; the revised sixty articles drop the supply system and leave the mess hall to the members). [[w.yang-jisheng-mubei]], II, 1173 (the Central Work Conference, May 21–June 12, 1961, in Peking: Mao''s four questions, investigation, the mass line, refunds, rehabilitation; the Sixty Articles revised and adopted, the mess hall for the members to decide, the grain ration to households); [[w.brothers-in-arms]], 371, 374 (Zhou Enlai to Chervonenko, June 25, 1961: the Central Committee''s recent "working meeting" took up home questions; it recommended he work half days for his health); [[w.peng-zhen-nianpu-1902]], IV, 130 (May 21–June 12, 1961; Peng Zhen attends; the regulations revised and adopted on the leaders'' investigation, the supply system ended, mess halls "完全由社员讨论决定," voluntary, self-run, free to leave; the revised draft regulations, the "Forty Articles" on commerce and the "Thirty-five Articles" on handicrafts; nine measures to cut the urban population by over 20 million in three years, 10 million this year; this year''s steel cut from 18 million tons to 11 million; Peng meanwhile on coal and rectification with those concerned); [[w.zhu-de-nianpu-xinbian]], III, 1806 (May 21–June 12, 1961; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 (the "Peking work conference" 北京工作会议), which draws up the revised draft Sixty Articles 《农村人民公社工作条例（修正草案）》, the "Forty Articles on commerce" 商业四十条, the "Thirty-five Articles on handicrafts" 手工业三十五条 and the nine measures to cut the town population and town grain sales 《关于减少城镇人口和压缩城镇粮食销量的九条办法》; the supply cooperatives to keep their own accounts, cooperative shops and peddlers restored, rural fairs opened, purchase contracts for farm products; the town population cut by over 20 million in three years, 10 million this year; the year''s steel cut from 20 million tons to 11 million; Mao Zedong 毛泽东, closing, criticizes himself, the fight on the right should not have been carried to the masses, and those wrongly criticized and punished after Lushan to be reviewed and cleared); [[w.chen-yun-nianpu-xiuding]], III, 88 (Chen Yun at the Central Work Conference in Peking, May 21–June 12; the revised Sixty Articles, rules on commerce and handicrafts, the nine measures to cut the towns'' population and grain sales; 20 million fewer townspeople in three years, 10 million this year; steel for the year cut from 20 to 11 million tons; Mao''s self-criticism and the rehabilitation of those wrongly criticized after Lushan; afterwards the mess halls left to the members and rations to households); [[w.zhu-de-nianpu-xinbian]], III, 1806 (Zhu De); [[w.peng-zhen-nianpu-1902]], IV, 130 (Peng Zhen); [[w.macfarquhar-origins-of-the-cultural]], III, 62; [[w.peng-zhen-nianpu-1902]], IV, 130; [[w.zhu-de-nianpu-xinbian]], III, 1806; [[w.chen-yun-nianpu-xiuding]], III, 88. Made public: 1996. To check: [[w.mao-zedong-shuxin-xuanji]], 578, 580 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.123a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 475–76 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.123b); [[w.zhongguo-gongchan-dang-lici]], 148 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 61 n.123c); [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 487 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.125a); [[w.yuzhi-deng-xiaoping-jianshe-you]], 33 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 62 n.125b). Names: Mao Zedong, Zhou Enlai, Zhu De, Peng Zhen, Chen Yun, Li Xiannian.'
