  - id: cal.1961-05.space
    when: May
    date: 1961-05
    thread: space
    also: [africa]
    c: 'A White House state dinner for Bourguiba of Tunisia. Kennedy, with Wiesner: "we''re having a terrible argument in the White House over whether we should put a man on the moon. ... If I told you you''d get an extra billion dollars a year in foreign aid if I didn''t do it, what would be your advice?" Bourguiba: "I wish I could tell you to put it in foreign aid. But I cannot."'
    n: '[[w.reeves-president-kennedy]], 139. To check: [[w.murray-apollo]], 66–67 (cited by [[w.reeves-president-kennedy]], 139). Check: the day; Reeves has the dinner the day after Shepard''s flight ([[cal.1961-05-05.space]]), the state visit having begun May 3 ([[cal.1961-05-03.africa]]). Names: Bourguiba, Wiesner, Kennedy.'
    src:
      c: a7f9c214
      rows:
        - 'w.reeves-president-kennedy 139: all'
    tags: [name:bourguiba-habib-ben-ali, name:wiesner-jerome-b, name:kennedy-john-f]
