  - id: cal.1961-05-05.vietnam-johnson-asia
    when: May 5
    date: '1961-05-05'
    thread: vietnam-johnson-asia
    c: 'Kennedy to Johnson, the afternoon, by Reeves''s account: "I still want you to go to Vietnam." Johnson: "I don''t want to embarrass you by getting my head blown off in Saigon." Kennedy: "If anything happens to you, Sam Rayburn and I will give you the biggest funeral Austin, Texas, ever saw."'
    n: '[[w.mann-grand-delusion]], 234. To check: [[w.reeves-president-kennedy]], 118–19 (cited by [[w.mann-grand-delusion]], 234 n.1). Check: the day. See [[cal.1961-04-28.vietnam]]. Names: Kennedy, Johnson, Rayburn.'
    src:
