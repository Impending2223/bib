  - id: cal.1961-05-09.china-leadership-15
    when: May 9
    date: '1961-05-09'
    place: linxia
    thread: china-famine
    c: Wang Feng 汪鋒 reports to Mao Zedong 毛澤東 from Linxia 臨夏 on the mess halls and other rural questions. The halls, he finds, take 13.16 percent of a brigade's workdays; the people have come to fear and hate them, saying "the ladle has a knife in it." In team 6 of the survey brigade the team leader and the manager, by graft and held-back rations, forced thirteen women, and 39 of those eating in the hall died in 1960. The halls must follow what helps production and living, not be tied to socialism, and members must not be forced to eat in them. With the halls dissolved, he writes, "a great joy."
    n: '[[w.yang-jisheng-mubei]], II, 760–761, 768. Made public: 2008. To check: Wang Feng 汪鋒, "Guanyu nongcun shitang deng wenti xiang zhuxi de baogao" 《關於農村食堂等問題向主席的報告》, May 9, 1961, at Linxia, Gansu Provincial Committee file Gan fa [61] 0296 (cited by [[w.yang-jisheng-mubei]], II, 760 n.46). Names: Mao Zedong.'
