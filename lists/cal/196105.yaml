    place: moscow
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: 'The Presidium on the summit, on the Foreign Ministry''s paper: disarmament, the climate, a German treaty and West Berlin, Laos, normal relations.{1} Khrushchev approves it as written, no new initiatives.{2} By Dobrynin''s account, Mikoyan urges care with Kennedy;{3} Khrushchev rejects the "cautious approach": pressed hard, Kennedy will yield.{4}'
    n: '[[w.fursenko-one-hell-of-a]], 124–26; [[w.fursenko-khrushchevs-cold-war]], 355–59 ("He is a son of a bitch"; "more than a 95% probability that there will be no war"; Mikoyan against; planes to be brought down; "Presents can be made even before a war"); [[w.dobrynin-in-confidence]], 44–46 ("approximately ten days before" Vienna, Dobrynin there as the delegation''s counselor: the pressure on a young president; Mikoyan alone in doubt, "for a cautious approach"; no thought of war); [[w.prezidium-tsk-kpss-1954]], I, 498–507 (Protocol 331; Khrushchev''s remarks); [[w.prezidium-tsk-kpss-1954]], III, 169 (the resolution, P 331/I). Check: Fursenko and Naftali (2006), from the stenogram, have Khrushchev set a new course at this meeting, not approve the paper as written: a peace treaty, the air routes cut off, Western planes to be brought down; "more than a 95% probability that there will be no war" (355–59, citing the stenogram and Protocol 331, May 26, 1961, nn.72–73). Check: the protocol and Khrushchev''s remarks (I, 498–507) bear out Fursenko and Naftali against the approval of the paper as written: a peace treaty with the GDR "firmly"; Western planes to land at GDR fields, shot down if need be (505); "more than 95%" that there will be no war (503); arms into the GDR within six months; out of the protocol, the test ban tied to disarmament, no concession on the American two to one (499); presents for Kennedy, "One gives presents even before a war" (507). On May 17 the Foreign Ministry''s materials were set aside as "bureaucratic documents" (497–98). Check: the resolution (III, 169) agrees "с позициями, изложенными тов. Хрущевым" (with the positions Comrade Khrushchev set out) and has the Foreign Ministry prepare the materials for Vienna as an aide-mémoire; nothing of approving the Ministry''s paper as written. Check: the stenogram (I, 504–05) has Khrushchev against keeping the air links ("надо быть твердыми"; of Western planes shot down, "проглотят") and notes Mikoyan''s remark unrecorded (504); the words "cautious approach" are Dobrynin''s (44–46), not the record''s. To check: V. V. Kuznetsov to the Central Committee, May 26, 1961, APRF (cited by [[w.fursenko-one-hell-of-a]], 124 n.56, the paper). Names: Khrushchev, Dobrynin, Mikoyan, Kennedy.'
