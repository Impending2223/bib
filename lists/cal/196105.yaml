e the safety of the nearly 1,500 in the church; fifty were at the airport when King arrived. To check: [*New York Times*, May 22, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/22/issue.html), at 26; *Montgomery Advertiser*, May 22, 1961, at 1, 2; [[w.guthman-we-band-of-brothers]], 172–73 (cited by [[w.branch-parting-the-waters]], 453 n.2); [[w.forman-making-of-black-revolutionaries]], 155 (cited by [[w.branch-parting-the-waters]], 454 n.1); Raines, *My Soul Is Rested*, 342 (cited by [[w.branch-parting-the-waters]], 454 n.2); Raines, *My Soul Is Rested*, 128ff, 334ff; Viorst, *Fire in the Streets*, 153ff; John Lewis, interview by Archie E. Allen, May 30, 1969; John Lewis, oral history; [[w.forman-making-of-black-revolutionaries]], 155–56; [[w.guthman-we-band-of-brothers]], 175–78; [[w.navasky-kennedy-justice]], 24, 124–25; [[w.farmer-lay-bare-the-heart]], 204–7; [[w.meier-core]], 138–39 (cited by [[w.branch-parting-the-waters]], 454 n.3); Durr, *Outside the Magic Circle*, 300–301 (cited by [[w.branch-parting-the-waters]], 458 n.1); *Montgomery Advertiser*, May 23, 1961, at 1 (cited by [[w.branch-parting-the-waters]], 465 n.1); [*New York Times*, May 22, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/22/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 465 n.2). See [[cal.1961-05-04.freedom-rides]]. Names: King, Abernathy, Patterson.'
