    c: 'Special message on urgent national needs, before a joint session: a man on the moon before the decade is out; also civil defense, Special Forces, foreign aid, the information agency. Same day the Senate passes school aid, [49–34](https://voteview.com/rollcall/RS0870054).'
    n: 'Special Message to the Congress on Urgent National Needs, [1961 Pub. Papers 396](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=454) (May 25, 1961). [[w.reeves-president-kennedy]], 135–40 (the moon, and the decision behind it); [[w.mann-walls-of-jericho]], 315 (no word of civil rights; Wofford''s and Marshall''s pleas refused); [[w.sorensen-kennedy]], 614 (shelters as "survival insurance"; the program assigned to the Secretary of Defense); [[w.poole-joint-chiefs-of-staff]], 65 ($100 million for the ROAD divisions, $138 million for Army and Marine equipment, the Marines raised to 190,000); [[w.selverstone-kennedy-withdrawal]], 29 (the address to a joint session, May 25, "Urgent National Needs"; the freedom doctrine); [[w.wofford-of-kennedys-and-kings]], 158 (the moon proposal, "on the eve of his departure for Europe": "a major national commitment" to "go to the moon"; not the school aid vote); [[w.sorensen-counselor]], 336–37 (the message on Urgent National Needs, to a joint session: Kennedy, sensing a skeptical audience, departs from his prepared text, the only time Sorensen recalls in a formal address, to add a personal note of urgency; "this decade" inserted by Kennedy himself). [[w.sorensen-kennedy]], 525, 614 (the moon; civil defense). The House sat from noon to 5:32 p.m.: [Daily Digest, D5](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=3), [D249](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=247). Check: Wofford, 158, calls the address a State of the Union address. See [[cal.1961-04-12.space]]. Recording (K–J Adm. II.I). See [[cal.1961-02-20.school-aid]].'
