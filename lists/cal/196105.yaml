    also: [king, alabama]
    c: 'Mob besieges King, Abernathy, and the riders in the First Baptist Church;{1} marshals hold it until Patterson sends the Guard.{2} Martial law.{3} Nearly 1,500 are in the church against "a huge, howling mob." King, from the pulpit: the law "can keep him from lynching me."{4} Farmer is there too. King telephones Robert Kennedy through the night; to Kennedy''s request for a cooling-off, Farmer: "we have been cooling off for 350 years."{5}'
    n: 'King, [Address at Freedom Riders Rally at First Baptist Church](https://okra.stanford.edu/link/document610521-000) (King Papers Project), printed in [[w.papers-of-martin-luther-vii]], 227 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/address-freedom-riders-rally-first-baptist-church-0)); his words to the church that night, from a tape, printed as "Statement Delivered at Freedom Riders Rally at First Baptist Church," [[w.papers-of-martin-luther-vii]], 231 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/statement-delivered-freedom-riders-rally-first-baptist-church)). [Announcement of martial law in Montgomery](https://okra.stanford.edu/link/document610521-002) (King Papers Project). [[w.garrow-bearing-the-cross]], 157–58; [[w.mann-walls-of-jericho]], 312–13 (King''s speech; the mob; the marshals'' tear gas; dispersed by morning); [[w.kotz-judgment-days]], 53–54 (King by telephone with Robert Kennedy through the night; Farmer: "we have been cooling off for 350 years"); [[w.thomas-robert-kennedy]], 130–31 (the First Baptist Church, the mob, the marshals with tear gas, the Guard sent by Patterson); [[w.wofford-of-kennedys-and-kings]], 154 (Montgomery, the First Baptist Church, nearly 1,500 against "a huge, howling mob"; King; not enough marshals; the governor "belatedly sent in the National Guard" and the mob was driven back; not Abernathy or martial law); [[w.schlesinger-robert-kennedy-and-his]], 297–98 (Sunday evening, fifteen hundred to hear King at the First Baptist Church; the mob burns a car before it; the marshals, with Mann''s troopers and at last the National Guard, drive the mob back, the Negroes in the church not daring to leave; airborne troops on alert at Fort Benning; not Abernathy, Patterson''s order or martial law); [[w.wofford-of-kennedys-and-kings]], 154; [[w.kotz-judgment-days]], 53. [[w.reeves-president-kennedy]], 129–31 (the siege; the marshals and the Guard). [[w.branch-parting-the-waters]], 453–65. Check: Wofford, 154, has too few marshals on hand to assure the safety of the nearly 1,500 in the church; fifty were at the airport when King arrived. To check: [*New York Times*, May 22, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/22/issue.html), at 26; *Montgomery Advertiser*, May 22, 1961, at 1, 2; [[w.guthman-we-band-of-brothers]], 172–73 (cited by [[w.branch-parting-the-waters]], 453 n.2); [[w.forman-making-of-black-revolutionaries]], 155 (cited by [[w.branch-parting-the-waters]], 454 n.1); Raines, *My Soul Is Rested*, 342 (cited by [[w.branch-parting-the-waters]], 454 n.2); Raines, *My Soul Is Rested*, 128ff, 334ff; Viorst, *Fire in the Streets*, 153ff; John Lewis, interview by Archie E. Allen, May 30, 1969; John Lewis, oral history; [[w.forman-making-of-black-revolutionaries]], 155–56; [[w.guthman-we-band-of-brothers]], 175–78; [[w.navasky-kennedy-justice]], 24, 124–25; [[w.farmer-lay-bare-the-heart]], 204–7; [[w.meier-core]], 138–39 (cited by [[w.branch-parting-the-waters]], 454 n.3); Durr, *Outside the Magic Circle*, 300–301 (cited by [[w.branch-parting-the-waters]], 458 n.1); *Montgomery Advertiser*, May 23, 1961, at 1 (cited by [[w.branch-parting-the-waters]], 465 n.1); [*New York Times*, May 22, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/22/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 465 n.2). See [[cal.1961-05-04.freedom-rides]]. Names: King, Abernathy, Patterson, Robert Kennedy, Farmer.'
