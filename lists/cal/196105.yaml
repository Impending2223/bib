  - id: cal.1961-05-01.china-leadership-2
    when: May 1
    date: '1961-05-01'
    place: changsha
    thread: china-liu
    c: 'Changsha. Liu Shaoqi talks with Hu Jiwei, deputy editor-in-chief of *Renmin ribao*, and others. The paper should sum up the experience of three years: its exaggeration in reporting production and construction, its blind command in spreading model experience, its one-sidedness in propaganda on policy and theory have done real harm. It put forward many high targets and launched "satellites" and wrong things the Center had put forward. There are two deviations: cutting loose from the local Party committee, and doing only what the committee says, hence the boasting of good mess halls and "satellites." A Communist journalist joins principle to discipline: obeys the leadership, reports problems and gives opinions. Every article should come from investigation; a journalist and editor should be a truth-seeking Marxist-Leninist.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 518–519 (May 1, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1961-05-01.china-leadership-3
    when: May 1
    date: '1961-05-01'
    thread: china-sixty-articles
    also: [china-liu]
    c: 'Liu Shaoqi writes to Zhang Pinghua: the housing problem in Hunan''s villages is an important one needing settlement now, though it will take two or three years; the work team''s investigation and opinion on housing in Tianhua brigade, Guangfu commune, is a reference for handling it elsewhere; should it be issued to every place? That day the Hunan provincial committee sends the letter and the Central Committee investigation group''s "Investigation and opinion on the housing situation of Tianhua brigade, Guangfu commune" to the whole province.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519 (May 1, 1961). The chronology marks it as a second item of the day (△). Made public: 1996. To check: Central Committee investigation group, "Investigation and opinion on the housing situation of Tianhua brigade, Guangfu commune" (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 519). Names: Liu Shaoqi, Zhang Pinghua.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc, name:zhang-pinghua]
