  - id: cal.1961-05-11.vietnam
    when: May 11
    date: '1961-05-11'
    thread: vietnam
    c: 'NSAM 52 adopts the Gilpatric task force program: more advisers, Special Forces, a study of combat troops.{1} Nolting presents credentials in Saigon.{2} It confirms the approvals of Apr. 29 and directs an assessment of raising South Vietnam''s forces from 170,000 to 200,000.{3} By McNamara''s account, Kennedy scales the task force''s plan back to 100 more advisers and 400 Special Forces men.{4}'
    n: '[NSAM No. 52](https://history.state.gov/historicaldocuments/frus1961-63v01/d52) (K–J Adm. II.H.2). [FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01); doc. [42](https://history.state.gov/historicaldocuments/frus1961-63v01/d42) (Gilpatric to Kennedy, May 3: the task force''s program). [[w.miller-misalliance]], 224–25 (the task force''s program; troops deferred); [[w.gibbons-u-s-government-and]], II, 38–40 (the program; not Nolting); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 268 (the program); [[w.mcnamara-in-retrospect]], ch. 2 at nn.9–10 (Gilpatric''s task force; Kennedy authorizes 100 more advisers and 400 Special Forces men). [[w.logevall-choosing-war]], 25 (NSAM 52; the passages on ground forces struck from the task force''s report); [[w.moyar-triumph-forsaken]], 129 (the President''s approval of Apr. 29: the advisers from 685 to 785, the Civil Guard to 68,000; the study of American forces); [[w.sorensen-kennedy]], 652–53 (a more limited program than the task force''s approved); [[w.sorensen-kennedy]], 652–53 (the task force''s report; the limited program: advisers tripled, logistic support, the Civil Guard); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 268 (more MAAG personnel; a study of a commitment of forces; 52 Special Forces at once and 350 more); [[w.reeves-president-kennedy]], 116–17 (the Gilpatric–Lansdale program, more than fifty recommendations approved, Special Forces training financed; undated, NSAM 52 not named); [[w.rusk-as-i-saw-it-1990]], 431 (Kennedy secretly orders 500 Special Forces and other advisers, above the 685 limit, in May; not NSAM 52, the day, the task force or the study of combat troops); [[w.schlesinger-robert-kennedy-and-his]], 703 (the Pentagon calls for the immediate dispatch of 3600 combat troops; Kennedy, "compromising," sends a hundred military advisers and four hundred Green Berets; Gilpatric: the increase "was greeted by the President with a great deal of impatience"; no day or NSAM); [[w.ma