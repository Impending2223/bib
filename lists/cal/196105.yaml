    also: [vietnam-johnson-asia]
    c: 'Johnson with Diệm, 8 a.m.: Kennedy''s letter, point by point. Diệm agrees to more MAAG advisers and welcomes the support for 20,000 more men and a Civil Guard of 68,000;{1} a memorandum asks some $30 million more in defense support.{2} After dinner: American or SEATO combat troops only in case of overt aggression.{3} By Miller''s account Diệm also asks for 100,000 more men, an army of 270,000.{4}'
    n: '[FRUS 1961–63, I, doc. 54](https://history.state.gov/historicaldocuments/frus1961-63v01/d54) (Nolting, May 13; the talk after dinner in its last note, from telegram 1743, May 15). [[w.miller-misalliance]], 226 (the letter; the advisers; the 270,000; troops only against an invasion); [[w.mann-grand-delusion]], 236–37 (the morning of May 12: Johnson with Diệm, Kennedy''s four-page letter reviewed "point by point"; Diệm agrees to a MAAG increase and accepts more aid for his army and civil guard; reticent on U.S. combat troops, "no appetite," by Young''s cable; not the hour, the figures, the memorandum or "only in case of overt aggression"). To check: "Vice President Johnson''s Talk with President Diem after Dinner May 12," May 15, 1961, Vice Presidential Security File, LBJ Library; Diệm to Kennedy, May 15 and June 9, 1961, *United States-Vietnam Relations*, Book 11, 155, 167–73 (cited by [[w.miller-misalliance]], 226 n.33). See [[cal.1961-05-09.vietnam]]. Names: Johnson, Diệm, Kennedy. Check: the day of the 270,000.'
