    thread: china-sixty-articles
    also: [china-liu]
    c: 'Liu Shaoqi speaks at the third group (Central-South and North China) of the Central Work Conference on the draft Rural People''s Commune Work Regulations. Right opportunism is the main danger, and has been fought some years;{1} since the Zhengzhou meeting the practice in the villages was in truth to oppose "left" errors, the Lushan meeting also touched it but did not make a slogan of it. Whether to put forward the slogan against "left" now is for consideration. Experience is rich but experience of building socialism is short: in farming, the field crops on one side and family sidelines, pigs and hens on the other, and abolishing private plots was a large mistake which lowered production and living and hurt industry.{2} The whole Party, all cadres and people have gone hungry, a deep lesson.{3}'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 524 (May 24, 1961); [[w.yang-shangkun-riji]], II, 31–32 (May 24, 1961; the group, 3 to 6 p.m.; Yang''s notes, the speaker not named: whether to raise opposing the "left" now, as at Lushan Mao said they were in fact opposing it without saying so; abolishing private plots "a great adventure"; mess halls can be run, but are run badly). Made public: 1996. Names: Liu Shaoqi.'
