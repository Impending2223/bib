  - id: cal.1961-05-06.china-leadership-2
    when: May 6
    date: '1961-05-06'
    place: tanzichong
    thread: china-sixty-articles
    also: [china-liu]
    c: 'Tanzichong. In the morning Liu Shaoqi talks with the peasant Wang Shengping, whose letters on rural conditions were held back: if those you accuse accuse you in turn, come to Peking, and I will pay the fare and the board. In the afternoon, with the peasants Ou Yinchun, Ou Fengqiu and Ou Ronghua: people do not yet trust policy because ownership is not yet settled; what is yours is yours and mine mine, and what is taken must be paid back. In the evening he hears the rectification work team''s head: the masses are not at ease, cadres dare not speak; the team is to see to pots, spades, tongs and jars for the mess halls'' dissolution and tell the committees to have them made; goods once made good, the masses will believe it.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 520 (May 6, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1961-05-06.china-leadership-3
    when: May 6
    date: '1961-05-06'
    place: shanghai
    thread: china-mao
    also: [china-agriculture]
    c: 'Shanghai.{1} Mao to Li Jingquan, for Chen Zhengren at Pingquan commune, Jianyang: Chen''s letter of May 1 received;{2} a week or better two weeks more of inquiry there will do much good.{3} To Li: why no letter? Has he been out to investigate? The Center''s list of topics went out Apr. 25; the May 4 notice puts the conference off to May 20 for fuller inquiry, so Peking can go further than Guangzhou.{4} The first secretaries of the bureaus and committees to spend this half-month in the villages and write to Mao freely; he will answer every letter. Reply by secure telephone to his residence or train.{5}'
    n: '[[w.jianguo-yilai-mao-zedong]], XVI, 24–25 (May 6, 1961); [[w.mao-zedong-zhuan]], V, ch. 68 n.9 (May 6, from Shanghai: Mao to Li Jingquan and Chen Zhengren, whose letter from a commune in Jianyang, Sichuan, pleased him; the Center''s list of topics sent Apr. 25, the May 4 notice putting the conference off to May 20; the first secretaries to go to the villages). [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317 (the letter printed in full, signed May 6, at Shanghai, to Li Jingquan for Chen Zhengren and to the first secretaries of the bureaus and provinces: the Center''s list of subjects for inquiry sent Apr. 25, its notice of May 4 putting the meeting off to May 20; each first secretary to spend the half-month in the villages and write to him; the note quotes the notice of Apr. 25). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317). To check: Mao Zedong 毛泽东, letter to Li Jingquan 李井泉 and Chen Zhengren 陈正人 (manuscript 手稿), May 6, 1961 (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.9). Names: Mao Zedong, Li Jingquan, Chen Zhengren. Check: the first edition, [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996), may have printed it before 1997.'
    src:
      c: 18cbf3ad
      rows:
