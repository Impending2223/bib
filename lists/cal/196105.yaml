  - id: cal.1961-05-09.china-leadership-5
    when: May 9
    date: '1961-05-09'
    place: tanzichong
    thread: china-sixty-articles
    also: [china-liu]
    c: Tanzichong. Liu Shaoqi talks with the Huaminglou commune rectification work team. Democracy is not to be bestowed; it is fought for. Some cadres say the higher level forbids speaking but do not fight for democracy themselves, and fear the masses. That the masses call the team "clear skies" (qingtian) shows it has done some good, but it is the team freeing the masses, not the masses freeing themselves; if the team too were "Lord Clear Sky" it would be no good and the mass line not followed. In the afternoon he inspects the Huangcai reservoir on the way back to Ningxiang county town, and is there in the evening.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 521 (May 9, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
