  - id: cal.1961-05-18.china-leadership-6
    when: May 18
    date: '1961-05-18'
    thread: china-famine
    c: 'The Jilin 吉林 provincial committee forwards the report on rectification at Jiuzhan 九站 people''s commune, a suburb of Jilin city 《揭開假先進的蓋子,拔掉真落後的根子——省委批轉九站人民公社整風整社情況的報告》 (document Jifa [61] no. 231). In Zhangjiu 張久 district the cadres beat and cursed members at will and used three means of "dictatorship": a training class of forced labor without pay; a "sick ward," with a cold kang and a thin gruel; a white flag, parading, hanging and beating; of 308 households about 20 percent were so treated, and Wang Derun''s 王德潤 family of three was driven to death. The commune forced vegetables on over 6,000 mu unfit for them; 840 mu of low, narrow land were put to onions, seed costing 10,800 yuan and the yield 700. Grain output in Dahuang 大荒 district fell 44.2 percent in 1959 against 1958 and 58.55 percent in 1960.'
    n: '[[w.yang-jisheng-mubei]], I, 350. Made public: 2008. To check: Jilin Provincial Party Committee, document Jifa [61] no. 231, forwarding the report of the rectification work group of Jiuzhan people''s commune 九站人民公社整風整社工作組, "Lifting the lid off the false advanced, pulling out the root of the real wrong," May 18, 1961 (cited by [[w.yang-jisheng-mubei]], I, 350 n.24).'
    src:
      c: aa07c5fc
      rows:
        - 'w.yang-jisheng-mubei I, 350: all'
        - 'via w.yang-jisheng-mubei I, 350 n.24: all'
    tags: [polity:prc, vis:only:prc]
  - id: cal.1961-05-18.china-leadership-7
    when: May 18
    date: '1961-05-18'
    thread: china-famine
    c: 'The Luqiao 路橋 commune survey group of the Huangyan 黃岩 county committee writes "A comparison of two production brigades" 《兩個生產大隊的對比》: Zhangyang 章楊 brigade, the best in Luqiao town, and the backward Lifeng 利豐 brigade, over a li apart, both on rice plain with like natural conditions and basis. The communist wind blew unequally. Zhangyang had it in 1958, in 1959 after the Second Zhengzhou conference partly refunded what "equalization and transfer" had taken, and had none after; Lifeng had it from 1958 to 1960, much material and labor taken and the members'' private plots taken and given back "three seize, four release." Both brigades practiced the supply system in 1958, in grain only.'
    n: '[[w.yang-jisheng-mubei]], I, 483. Made public: 2008. To check: Luqiao Commune survey group of the Huangyan County Committee 中共浙江省委黃岩縣路橋公社調查組, "Liang ge shengchan dadui de duibi" 《兩個生產大隊的對比》, May 18, 1961 (cited by [[w.yang-jisheng-mubei]], I, 483 n.34).'
