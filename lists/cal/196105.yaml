    thread: robert-kennedy
    also: [desegregation-schools, georgia]
    c: 'Robert Kennedy at the University of Georgia Law School''s Law Day exercises, Athens, Ga.{1} On Prince Edward County, Va., which had closed its schools: "if the orders of the court are circumvented, the Department of Justice will act. We will not stand by or be aloof. We will move."{2} "I happen to believe that the 1954 decision was right."{3}'
    n: '[Address at the Law Day Exercises of the University of Georgia Law School](https://www.justice.gov/ag/rfkspeeches/1961/05-06-1961.pdf) (May 6, 1961). [[w.schlesinger-robert-kennedy-and-his]], 293–94 (his quotation reads "stand by and be aloof"); [[w.mann-walls-of-jericho]], 306 (his first formal address as Attorney General; the words on court orders); [[w.guthman-we-band-of-brothers]], 158–64 (the speech; the Prince Edward County passage, "We will not stand by or be aloof. We will move."; not the 1954 sentence); [[w.thomas-robert-kennedy]], 127 (to the University of Georgia in early May: the Department will enforce the law; "with hands shaking"); [[w.wofford-of-kennedys-and-kings]], 150–51 (his first formal speech as Attorney General; agreement with *Brown*; "if the orders of the court are circumvented, the Department of Justice will act"; an ovation). [[w.branch-parting-the-waters]], 414–15. Check: Wofford gives "We will not stand by and be aloof" (151). To check: [[w.navasky-kennedy-justice]]; [[w.shesol-mutual-contempt]]; [*New York Times*, May 7, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/07/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 415 n.1). Names: Robert Kennedy.'
    src:
      c: dc8e7f0a
