    n: '[[w.preston-war-council]], 81. To check: Komer to Rostow, May 3, 1961, NSF, Meetings and Memoranda, Staff Memoranda, Komer, box 321, Kennedy Library (cited by [[w.preston-war-council]], 81 n.18). Names: Komer, Rostow.'
