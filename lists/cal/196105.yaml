    n: 'Keating, [107 Cong. Rec. 7340](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt6/pdf/GPO-CRECB-1961-pt6-4-1.pdf#page=62) (May 4, 1961). [[w.sundquist-politics-and-policy]], 257. See [[cal.1961-05-04.civil-rights-bill]]. Names: Keating.'
