  - id: cal.1961-05.latin-america-4
    when: May
    date: 1961-05
    thread: latin-america
    c: 'Goodwin takes the President the CIA''s account of its Dominican program, "neutralize" underlined: the dissidents have had weapons. Kennedy: "If Trujillo goes, he goes, but why are we pushing that?" Goodwin to tell Dearborn: no part in assassination, no more weapons to anyone.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 491 ("the first the White House knew about weapons"; the day not given); [[w.sen-church-alleged-assassination-plots]], 211 (the document of May 13 on the weapons passed, "neutralize" underscored, the passage circled by Goodwin, new to him; not his taking it to the President, Kennedy''s words or the instruction to Dearborn); [[w.goodwin-remembering-america]], 210 (Goodwin tells Kennedy, Bundy gone, of his discovery that the CIA "had actually transferred some small weapons to a group that wished to overthrow Trujillo by assassination"; Kennedy, angry: "Tell them no more weapons. The United States is not to get involved in any assassinations. I''d like to get rid of Trujillo, but not that way"; not the document, "neutralize," the words of B or Dearborn). Check: the day and the words. [[w.goodwin-remembering-america]], 210, puts Goodwin''s report to Kennedy on the afternoon after a press conference of "late October" 1961, months after Trujillo''s death (May 30), with Kennedy''s words: "Tell them no more weapons. The United States is not to get involved in any assassinations. I''d like to get rid of Trujillo, but not that way.". To check: Church committee, *Alleged Assassination Plots Involving Foreign Leaders*, S. Rep. No. 94-465, 195–211 (1975); Richard Goodwin, "The Record of JFK and Political Assassinations," *Boston Globe*, Nov. 24, 1975 (cited by [[w.schlesinger-robert-kennedy-and-his]], 491 n.83). See [[cal.1961-05.latin-america-3]]. Names: Goodwin, Kennedy, Trujillo. Check: the day.'
    src:
      c: adff40d9
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 491: all'
        - 'w.sen-church-alleged-assassination-plots 211: ?'
        - 'w.goodwin-remembering-america 210: ?'
    tags: [name:goodwin-richard-n, name:kennedy-john-f, name:trujillo-rafael]
  - id: cal.1961-05-31.latin-america-dominican-republic
    when: May 31
    date: '1961-05-31'
    thread: latin-america-dominican-republic
    c: 'Cable to the CIA station: destroy all records of contacts with the dissidents and related matters, except the contingency plans and the cable of May 29 to Dearborn.'
    n: '[[w.sen-church-alleged-assassination-plots]], 214 (the cable; all CIA personnel were taken out of the Dominican Republic, and Dearborn was back in Washington within a few days). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, headquarters to station, May 31, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 214). See [[cal.1961-05-30.latin-america]]. Check: the sender: the report says "The State Department cabled the CIA station," citing a cable from headquarters.'
  - id: cal.1961-05.latin-america-5
    when: May
    date: 1961-05
    thread: latin-america
    c: 'Kennedy to Goodwin by telephone: "Let''s get moving on the Alliance for Progress ... before they think I didn''t mean it, that all we care about is Castro." Goodwin: the conference is set for the beginning of August, and he cannot get the State Department to agree on a position. Kennedy: "It ought to be tomorrow. ... We already have a position. Tell them to read my speech. ... Never mind. I''ll talk to Dillon."'
    n: '[[w.goodwin-remembering-america]], 190 (Goodwin''s account). Names: Kennedy, Goodwin, Castro, Dillon. Check: the day; "A few weeks after the disaster in Cuba" (190).'
    tags: [name:kennedy-john-f, name:goodwin-richard-n, name:castro-fidel, name:dillon-c-douglas]
  - id: cal.1961-05.press-and-broadcasting
    when: May
    date: 1961-05
    thread: press-and-broadcasting
    c: After the Ottawa visit the Republican National Committee's *Battle Line* accuses Salinger of writing his own USIA biography ("a dynamo . . . a jaunty hunk of a man"), and the *New York Herald Tribune* editorializes against it; a day or two later the USIA writer is found to have taken the words from an article in the *Tribune*. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 169. Check: the day (the work gives the visit to Ottawa, May 16–18, and no day). Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1961-05.press-and-broadcasting-2
    when: May, late
    date: 1961-05
    thread: press-and-broadcasting
    c: 'The White House. Bill Lawrence of the *Times*, told he will not go with the President to Europe: "If I had a good job offer today, I''d quit." Salinger telephones Hagerty at ABC: "If you want Lawrence, I think today''s the day." Lawrence signs that day as ABC''s White House correspondent and political editor. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 144. Check: the day ("late May 1961," the President to leave for Europe "in a day or two"). Names: Salinger, Hagerty.'
    tags: [name:salinger-pierre, name:hagerty-james-c]
