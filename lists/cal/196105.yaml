  - id: cal.1961-05-02.laos
    when: May 2
    date: '1961-05-02'
    thread: laos
    also: [defense]
    c: 'McNamara and Gilpatric to Kennedy, "Alternative Courses of Action in Laos," the Chiefs'' and two service secretaries'' views attached. Laos "one of the least favorable places in the world for direct U.S. military intervention," but intervention: 48 hours for a cease-fire at the present line, then forces to hold the vital centers. "At some point, we may have to initiate the use of nuclear weapons." Burke: troops to Thailand and South Vietnam at once, into Laos in 48 hours; White: ground forces a "maldeployment," air power.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 242–43; [[w.poole-joint-chiefs-of-staff]], 130–31 (Lemnitzer: only immediate military action can keep the key areas; the NSC''s contingency planning that afternoon). To check: SecDef (McNamara) and DepSecDef (Gilpatric) for the President, May 2, 1961, NSF, JFKL; abridged in FRUS 1961–63, XXIV, 166–70 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 243 n.54). See [[cal.1961-05-01.laos]]. Names: McNamara, Gilpatric, Kennedy, Burke, White.'
    src:
