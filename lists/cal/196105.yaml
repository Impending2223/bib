    thread: robert-kennedy
    also: [freedom-rides, alabama]
    c: 'Patterson will not take the President''s call.{1} Robert Kennedy and Patterson by telephone, at length: "You''re making political speeches at me, John." Patterson will talk only with a personal representative of the President.{2} Seigenthaler, at the Capitol that night with a White House telegram, before the Alabama cabinet;{3} Patterson''s statement: "The State of Alabama has the will, the force, the men, and the equipment to give full protection to everyone in Alabama."{4}'
    n: '[[w.branch-parting-the-waters]], 441–42; [[w.schlesinger-robert-kennedy-and-his]], 296 (Seigenthaler with Patterson: "if federal marshals come into Alabama, there''ll be blood in the streets"; Floyd Mann: his troopers will protect the bus; by Seigenthaler''s account; the day not given); [[w.wofford-of-kennedys-and-kings]], 153 (Patterson "would not even answer his phone calls"; the President calls him; on May 19 Patterson returns Robert Kennedy''s call; promises Seigenthaler to protect the Riders to Montgomery; not the words). To check: [*New York Times*, May 20, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/20/issue.html), at 1 (cited by [[w.branch-parting-the-waters]], 441 n.1); *Montgomery Advertiser*, May 20, 1961, at 1; [*New York Times*, May 21, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/21/issue.html), at 78 (cited by [[w.branch-parting-the-waters]], 442 n.1); John Seigenthaler, oral history (cited by [[w.branch-parting-the-waters]], 441 n.3); [[w.guthman-we-band-of-brothers]], 170 (cited by [[w.branch-parting-the-waters]], 442 n.1); John Seigenthaler, recorded interview by Ronald J. Grele, Feb. 22, 1966, 314–24, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 296 n.50). See [[cal.1961-05-15.freedom-rides]]. Names: Patterson, Kennedy, Robert Kennedy, Seigenthaler.'
