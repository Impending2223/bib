    thread: laos
    c: The 481st NSC, on Laos. McNamara proposes a SEATO move into the panhandle, "recognizing that if we do we must be prepared to win"; to win in Southeast Asia might take nuclear weapons. Taylor against American troops in Laos; Dulles warns of a Chinese response. No decision while the cease-fire is negotiated; the President ready under certain conditions to send forces to Thailand; the Chiefs to present the military implications May 2.
    n: '[FRUS 1961–63, XXIV, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v24/d73) (McNamara''s notes; NSC Action 2417). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 242 (all but the forces for Thailand); [[w.poole-joint-chiefs-of-staff]], 130. [[w.sorensen-kennedy]], 644 (the NSC on Laos). See [[cal.1961-04-26.laos]]. Names: McNamara, Taylor, Dulles.'
