  - id: cal.1961-05-04.china-leadership-9
    when: May 4
    date: '1961-05-04'
    thread: china-famine
    c: A Qu 衢 county work group issues its basic materials on Luotou 爐頭 production brigade, Shiliang 石梁 commune 《爐頭生產大隊基本情況資料》. In 1955 the brigade's two cooperatives paid 650 jin of ration a head and over 1.2 yuan a workday. Forced in 1956 into the 1,116-household Shengli 勝利 advanced cooperative, in 1958 into a 1,639-household accounting unit and then into Shiliang commune, it lost its private plots, pigs, pots and stoves; the mess hall fed all comers free from October 1958 to March 1959. In 1959 the brigade's actual output was 340,000 jin, against 530,000 under the "three guarantees" and 720,000 as "verified"; it needed 265,800 jin of ration and 33,700 of seed and could sell 51,300, but sold 127,675. From February 1960 it had no grain for three months, and after the autumn harvest 20 days and more again; laborers in the fields got 4 liang of rice a day (0.25 jin) and the rest none; people ate bark, grass and leaves; edema and deaths followed. The management district's private jail held over 200.
    n: '[[w.yang-jisheng-mubei]], I, 479–481. Made public: 2008. To check: Qu County work group 衢縣工作組, "Lutou shengchan dadui jiben qingkuang ziliao" 《爐頭生產大隊基本情況資料》, May 4, 1961 (cited by [[w.yang-jisheng-mubei]], I, 479 n.32).'
