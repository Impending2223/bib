    c: 'Seoul. The Military Revolutionary Committee, Lt. Gen. Chang Do-young chairman and martial-law commander, Park Chung Hee his deputy commander, proclaims emergency martial law over the whole country from 9 a.m.: assemblies and travel abroad barred, the press censored, curfew 7 p.m. to 5 a.m.; bank funds frozen, airports and ports closed, prices held at the May 15 level. Proclamation 4: all power taken from Chang Myon''s government as of 7 a.m.; the two houses and the local assemblies dissolved at 8 p.m.; party activity banned; the cabinet to be arrested. The courts halted; the election of the Chief Justice and justices, set for May 25, put off.'
    n: '[[w.ilchi]], I, May 16, 1961, revolution, items 1–2, 7; business, items 1–2 (the log cites Proclamation 8 for the local assemblies; the Gazette''s Proclamation 8 lifts the freeze on military spending, and Proclamation 4 dissolves them); May 17, revolution, item 4 (prices). [[w.kwanbo]], [no. 2856 (May 16, 1961), 1–2](https://theme.archives.go.kr/next/gazette/viewGazetteContentList.do?gazetteId=0001647885&actionType=date) (Committee Decrees 1–2, Proclamations 1–8). See [[cal.1961-05-16.japan-and-korea]]. Names: Chang Do-young, Park, Chang Myon.'
    tags: [polity:rok, name:chang-yo-yong, name:park-chung-hee, name:chang-myon, name:chang-do-young]
