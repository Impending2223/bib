  - id: cal.1961-05-05.cuba
    when: May 5
    date: '1961-05-05'
    place: washington
    thread: cuba
    also: [robert-kennedy, vietnam, latin-america]
    c: '483d NSC meeting, on Cuba.{1} No Navy blockade; an Air Force plan of heavy bombardment, which the other services opposed, rejected. Overflights every two or three days.{2} The exiles to be refugees (Robert Kennedy). The Trading with the Enemy Act to be invoked at an overt act, $30 million in food and drugs exempted.{3} By Schlesinger''s journal, McNamara: Defense against enlisting a Cuban Freedom Brigade in the Army.{4} South Vietnam: no American troops before the conference on Laos opens, the MAAG''s increase left to Gilpatric and State.{5} The Council, on British Guiana, breaks off for Shepard''s launch, watched on Evelyn Lincoln''s television.{6} On the Dominican Republic: "The United States should not initiate the overthrow of Trujillo before knowing what kind of government would succeed him."{7} By Burke''s debrief: intervention probably needed sooner or later, not now; a blockade not worthwhile; McNamara: the Air Force would air-land all the forces in 36 hours.{8}'
    n: '[FRUS 1961–63, I, doc. 46](https://history.state.gov/historicaldocuments/frus1961-63v01/d46) (Burke''s debrief; South Vietnam). FRUS 1961–63, X, docs. [204](https://history.state.gov/historicaldocuments/frus1961-63v10/d204) (Burris''s notes); [206](https://history.state.gov/historicaldocuments/frus1961-63v10/d206) (Burke''s debrief: intervention later, not now; the airlift); [207](https://history.state.gov/historicaldocuments/frus1961-63v10/d207) (McNamara to Yarmolinsky: the Brigade refused, Cuban volunteers to be inducted). [[w.schlesinger-robert-kennedy-and-his]], 472–73 (the Freedom Brigade); [[w.bissell-reflections-of-a-cold]], 199 (the record of actions quoted); [[w.preston-war-council]], 64 (Bundy''s plan); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 193–94 (the action approved by the President May 16; no separate Cuban force; Cubans to enlist in the American forces); [[w.poole-joint-chiefs-of-staff]], 231 (Kennedy to the NSC on Trujillo; any military action multilateral); [[w.sen-church-alleged-assassination-plots]], 209 (the Record of Actions: the Task Force on Cuba to prepare plans for crises in Haiti or the Dominican Republic; "Noted the President''s view that the United States should not initiate the overthrow of Trujillo before we knew what government would succeed him, and that any action against Trujillo should be multilateral"; approved by the President May 16; not the meeting''s other business). [[w.reeves-president-kennedy]], 117–18, 125, 141 (British Guiana and Shepard, 117–18; Trujillo, 141). [[w.jones-bay-of-pigs]], 150–51 (the bombardment and the blockade refused; the surveillance; the Brigade refused, the volunteers taken). [FRUS 1961–63, X, doc. 203](https://history.state.gov/historicaldocuments/frus1961-63v10/d203) (Bundy''s points for decision, from the Nitze task force''s report). See [[cal.1961-04-15.cuba]]. Names: Robert Kennedy, Schlesinger, McNamara, Gilpatric, Lincoln, Trujillo, Burke. Check: Reeves has five hundred more troops ordered to South Vietnam that day (125); by FRUS''s note, Rusk decided the same day on up to 100 more for the MAAG.'
