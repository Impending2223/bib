    thread: africa
    c: Bourguiba of Tunisia on a state visit. May 5, Kennedy determines that up to $4.1 million of the year's military assistance funds may furnish Tunisia equipment.
    n: 'Remarks of Welcome to President Bourguiba of Tunisia at the Washington National Airport, [1961 Pub. Papers 349](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=407) (May 3, 1961); Joint Statement Following Discussions With President Bourguiba, [1961 Pub. Papers 363](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=421) (May 5, 1961). FRUS 1961–63, XXI, docs. [162](https://history.state.gov/historicaldocuments/frus1961-63v21/d162), [163](https://history.state.gov/historicaldocuments/frus1961-63v21/d163) (Presidential Determination No. 61-26). To check: [[w.muehlenbeck-betting-on-the-africans]]. Names: Bourguiba.'
