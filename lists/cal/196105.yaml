    also: [freedom-rides, alabama]
    c: 'Patterson will not take the President''s call. Robert Kennedy and Patterson by telephone, at length: "You''re making political speeches at me, John." Patterson will talk only with a personal representative of the President. Seigenthaler, at the Capitol that night with a White House telegram, before the Alabama cabinet; Patterson''s statement: "The State of Alabama has the will, the force, the men, and the equipment to give full protection to everyone in Alabama."'
