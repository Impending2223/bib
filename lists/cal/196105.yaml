  - id: cal.1961-05-06.china-leadership-10
    when: May 6
    date: '1961-05-06'
    thread: china-foreign
    also: [china-propaganda]
    c: 'Chen Yun 陈云 talks with the heads of the Shanghai People''s Pingtan Troupe 上海市人民评弹团: pingtan''s 评弹 history must be studied, the years before and after the war with Japan too, when it turned commercial and vulgar jokes ran wild, whence the "cutting off of tails" 斩尾巴 after 1949 (the early movement of some in pingtan to stop the traditional pieces, the nianpu''s note); now jokes are needed again, but not to excess; students of literature, drama and music to be welcomed to study pingtan.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 86. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]]; [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
