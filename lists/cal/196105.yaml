    c: 'Shunyi 顺义. Deng Xiaoping 邓小平 and Peng Zhen 彭真 hear five of the Center''s inquiry teams and Liu Ren 刘仁 and others. Deng: the supply system by the 30–70 split not by class line, made help for the five-guarantee and hard-pressed households; distribution by work, three guarantees and one reward 三包一奖, work points, the fixed points ended; the mess hall voluntary, help either way.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1635 (May 4, 1961); [[w.peng-zhen-nianpu-1902]], IV, 125 (May 4, 1961; at Shunyi Peng Zhen and Deng Xiaoping hear the Center''s five investigation groups); [[w.peng-zhen-nianpu-1902]], IV, 125–126 (May 4, 1961; with the Peking committee''s group, Liu Ren, Li Qi (the page''s note: head of the committee''s propaganda department) and the county secretaries; on the supply system Peng: two views, aid only for "five guarantee" and needy households, or keep supply at three to seven or two to eight; Liu Ren on Dahongmen 大红门 brigade, 1960: of 151 households 19 landlords and rich peasants and 55 who seldom worked took most of the 190,000 yuan; aid to three and three households would cost 1,500 yuan and raise the work point from 0.8 to over 1.3 yuan; Deng: supply against the class line, dropped; on mess halls Peng: "完全自由，完全自愿", 2 percent of the vegetable land to the mess hall, its accounts separate). Footnote 1: Liu Ren, then a secretary of the North China Bureau and second secretary in Peking; footnote 2: the one reward, for output above quota (III, 1635). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen, Liu Ren.'
