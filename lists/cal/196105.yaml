    n: '[FRUS 1961–63, XIV, doc. 22](https://history.state.gov/historicaldocuments/frus1961-63v14/d22). [[w.reeves-president-kennedy]], 125. Check: Reeves''s note dates the memorandum May 6. Names: McNamara, Kennedy.'
