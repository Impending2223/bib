  - id: cal.1961-05.cuba
    when: May
    date: 1961-05
    thread: cuba
    also: [robert-kennedy, republican-party]
    c: 'A month after the invasion Castro offers the prisoners for an "indemnity" of five hundred bulldozers. The President asks Mrs. Roosevelt, Walter Reuther, Milton Eisenhower and George Romney to head a committee to raise the money; Romney declines. Most Republican leaders against: Goldwater, "surrender to blackmail"; Nixon, "Human lives are not something to be bartered."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 468–69. To check: [[w.eisenhower-wine-is-bitter]], chs. 15–16; [[w.johnson-bay-of-pigs]], bk. 4, ch. 3 (cited by [[w.schlesinger-robert-kennedy-and-his]], 469 n.4). See [[cal.1961-04-15.cuba]]. Names: Castro, Kennedy, Eleanor Roosevelt, Reuther, Milton Eisenhower, Romney, Goldwater, Nixon. Check: the days of the offer, the committee and the statements.'
    src:
      c: 2ad145fc
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 468–69: all'
    tags: [name:castro-fidel, name:kennedy-john-f, name:roosevelt-eleanor, name:reuther-walter, name:eisenhower-milton-s, name:romney-george-w, name:goldwater-barry-m, name:nixon-richard-m]
