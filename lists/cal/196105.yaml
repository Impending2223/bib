    c: The general office of the Changchun 長春 municipal committee reports on stopping some people's stripping of tree bark and damaging public facilities 《關於制止某些群眾扒樹皮、損壞公共設施的報告》. Since May many trees in the city have been stripped; in three districts, Nanguan 南關, Chaoyang 朝陽 and Erdaohezi 二道河子, 1,036 trees, mostly elms. The mayor has called the public security, education, Youth League and construction offices to forbid it; over 300 men from public security and construction patrol the parks and tree-lined places from 4 a.m. to 11 p.m. in shifts, and detain stripers administratively.
