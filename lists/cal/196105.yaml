    thread: china-sixty-articles
    also: [china-liu, china-economy]
    c: 'Deng Xiaoping 邓小平 speaks at the plenary of the Central Work Conference, Liu Shaoqi 刘少奇 presiding, on grain, the shorter industrial front and the town population: in three years great faults, many problems, much good done too; 18.4 million tons of steel last year more lost than gained, squeezing farming, light industry and the market; heavenly disaster or human? in some places, as Liu said, chiefly our work; the grain problem one of farming, light and heavy industry, the speed of heavy industry; the town population cut, the central ministries first.'
