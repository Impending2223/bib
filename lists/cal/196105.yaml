  - id: cal.1961-05-04.middle-east
    when: May 4–5
    date: '1961-05-04'
    thread: middle-east
    c: 'Tehran. A teachers'' strike; 50,000 demonstrators clash with the army and the police, May 4. May 5, the Prime Minister and his cabinet resign; the Shah then names Amini, once ambassador in Washington. Amini''s terms: his own cabinet, the Majlis dissolved, a court for corruption. The NSC, the same day: a task force on Iran under Talbot, its report by May 15. Kennedy, by Rusk''s note: "the potentially dangerous situation in Iran."'
    n: '[FRUS 1961–63, XVII, doc. 41](https://history.state.gov/historicaldocuments/frus1961-63v17/d41) (editorial note: NSC Action No. 2420; the task force). To check: [[w.rubin-paved-with-good-intentions]]; [[w.bill-eagle-and-the-lion]]; [[w.gasiorowski-u-s-foreign-policy]]; [[w.little-american-orientalism]]; [[w.offiler-us-foreign-policy-and]]. See [[cal.1960-08-25.middle-east]]. Names: Pahlavi, Amini, Talbot, Rusk, Kennedy.'
    tags: [name:pahlavi-mohammed-reza, name:amini-ali, name:talbot-phillips, name:rusk-dean, name:kennedy-john-f]
