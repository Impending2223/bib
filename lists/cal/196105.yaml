    when: May 1
    date: '1961-05-01'
    thread: laos
    also: [vietnam-congress]
    c: 'Mansfield to Kennedy, by memorandum, on sending forces to Laos: "If the intervention involves U.S. forces, the initial approval, such as it is, will start to disappear as soon as the first significant casualty lists are published," and approval of "stand-firm" give way to disapproval of "Kennedy''s War."'
    n: '[[w.reeves-president-kennedy]], 115. To check: Mansfield to Kennedy, May 1, 1961, Vice-Presidential Security File, box 4, Johnson Library (cited by [[w.reeves-president-kennedy]], 115). See [[cal.1961-05-01.cuba-2]], his memorandum on Cuba the same day. Names: Mansfield, Kennedy.'
