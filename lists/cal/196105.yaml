    n: '[107 Cong. Rec. D184](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=182). Check: Rusk recalls telling the committee at an executive session that spring that Cuba might become a Soviet missile base ([[w.rusk-as-i-saw-it-1990]], 215); which session is not settled: the subcommittee also met on Cuba Apr. 28, the full committee invited, and Rusk briefed the full committee May 3 ([107 Cong. Rec. D194](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=192)). See [[cal.1961-04-17.cuba]]. Names: Rusk.'
