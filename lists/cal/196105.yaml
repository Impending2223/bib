    when: May 16
    date: '1961-05-16'
    thread: latin-america-dominican-republic
    c: 'Dearborn to the State Department, to Coerr: an urgent request from the dissidents for the machine guns; the attempt is set for the night of May 16, chances of success 80 percent, the guns would lessen the risk of failure. The dissidents say that if it fails for lack of them the United States will be held responsible and never forgiven. Dearborn told them he was reasonably sure authorization could not be had.'
