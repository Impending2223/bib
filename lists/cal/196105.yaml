    n: '[[w.zedong-mao-zedong-nianpu]], IV, May 13, 1961; [[w.macfarquhar-origins-of-the-cultural]], III, 49 (the Peking report of May 10, prepared by Deng Tuo); [[w.deng-xiaoping-nianpu-1904]], III, 1637 (May 13, 1961; Mao: "send this letter to the regional bureaus and the provincial, city and regional committees for reference"); [[w.mao-zedong-zhuan]], V, ch. 68 n.13 (May 13, Mao forwards Deng Xiaoping''s and Peng Zhen''s letter of May 10: five survey groups and the Peking committee''s working groups spent over a month at Shunyi and Huairou; the sizes of brigades and teams adjusted and the peasants'' zeal greatly raised). [[w.peng-zhen-nianpu-1902]], IV, 129 (May 13, 1961; Mao''s comment: send the letter to the regional bureaus and the provincial committees for reference); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331 (Mao''s comment of May 13 and the letter of Deng Xiaoping and Peng Zhen of May 10, printed in full: five investigation groups in Shunyi and Huairou and the Peking committee''s work groups, over a month; the size of communes and brigades, the supply system, grain procurement, "three guarantees and one reward", work points, the mess halls and ownership). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 324–331). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: the Deng nianpu (III, 1636–1637) gives Deng''s and Peng Zhen''s report of May 10 as a letter (致信), not a telephone report. To check: [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 302 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71a); [[w.zhongguo-gongchan-dang-liushi]], 484 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71b); [[w.peng-zei-huairou-diaocha]], passim, 25–26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.71c); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 492–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 49 n.72b); Deng Xiaoping 邓小平 and Peng Zhen 彭真, letter 