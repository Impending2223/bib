    thread: china-sixty-articles
    also: [china-mao]
    c: 'Shanghai, 3 a.m.{1} Mao has Hu Qiaomu''s letter of May 8 on the Hunan investigation group sent to the bureaus and committees for reference. Hu: with the Hunan committee the group has made first revisions to the Sixty Articles; Shaoshan commune''s mess halls are down from 112 to 6;{2} he will turn to commerce and handicrafts.{3}'
