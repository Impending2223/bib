    thread: cuba-bay-of-pigs
    also: [laos, opinion]
    c: 'Kennedy to Schlesinger, back from Europe, by Schlesinger''s account: as a British prime minister he would have been thrown out; here failure has increased his charm.{1} Evelyn Lincoln brings an advance on the Gallup poll, 82 percent behind the administration: "It''s just like Eisenhower. The worse I do, the more popular I get."{2} Waving Lemnitzer''s cables from Laos: "If it hadn''t been for Cuba, we might be about to intervene in Laos. I might have taken this advice seriously."{3}'
    n: '[[w.schlesinger-thousand-days-1965]], 292, 339; [[w.schlesinger-journals]], 120–21 (Kennedy, May 3 late afternoon, "cool and composed"; Evelyn Lincoln comes in with "an advance on the new Gallup poll, showing Kennedy at an unprecedented 82 percent of approval"; Kennedy: "It''s just like Eisenhower. The worse I do, the more popular I get"; the remarks on a British prime minister and on his charm are not on the page). Names: Kennedy, Schlesinger, Lincoln, Eisenhower, Lemnitzer.'
    src:
      c: bb2cc52a
      rows:
        - 'w.schlesinger-thousand-days-1965 292: 1, 2'
        - 'w.schlesinger-thousand-days-1965 339: 3'
