    c: 'Johnson with Diệm, 8 a.m.: Kennedy''s letter, point by point. Diệm agrees to more MAAG advisers and welcomes the support for 20,000 more men and a Civil Guard of 68,000; a memorandum asks some $30 million more in defense support. After dinner: American or SEATO combat troops only in case of overt aggression. By Miller''s account Diệm also asks for 100,000 more men, an army of 270,000.'
