  - id: cal.1961-05-05.laos
    when: May 5
    date: '1961-05-05'
    thread: laos
    also: [soviet-union, china]
    c: Pushkin, Soviet deputy foreign minister, tells Liu Xiao, the Chinese ambassador, how Moscow means to go into the Geneva conference on Laos. Peking, Hanoi and Warsaw agree, he says, on using it to build up the Lao people's strength; the Lao government, army and elections are not its business, neutrality and the Control Commission's limits are. Moscow will press for seating the Patriotic Front and for Britain as co-chair; Sihanouk's refusal to attend is "childish" and will not delay it.
    n: '"[Record of Conversation between Soviet Union Deputy of Foreign Affairs Pushkin and Ambassador Liu Xiao](https://digitalarchive.umd.edu/document/120885)" (May 5, 1961), PRC FMA 109-03755-02, 112–119, obtained by Yiming Feng, trans. Jake Tompkins, Wilson Center Digital Archive. Ministry of Foreign Affairs document, top secret, No. 329; the record gives the time as 11:00 a.m. and gives no place. Pushkin adds that the Control Commission had met and would leave for Laos next day if its instructions were settled that day; of the British ambassador he says he "came to speak with me" "this afternoon", so the translation reads, of a talk the record puts at 11:00 a.m. The record names no city: Liu Xiao was ambassador at Moscow, but no place is set. Names: Pushkin, Liu Xiao. Check: the year the Archive posted the document.'
    tags: [polity:prc, polity:ussr, name:pushkin-georgiyi-maksimovich, vis:only:prc+ussr, ok:fields-place, name:liu-xiao]
