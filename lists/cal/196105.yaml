    c: 'Tanzichong. Liu Shaoqi hears the Huaminglou commune rectification work team. Mess halls were set up grudgingly and are most unpopular; "we made mistakes on this, and went at it for three years without understanding." In the evening he hears the Tanzichong brigade work team: a mess hall should save labor, and the present ones waste it, and what does not save labor is not to be kept. On housing, not to take back houses wholesale "to the original owner": investigate and treat each as it is; the brigade is to help members settle it.'
