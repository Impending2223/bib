    also: [africa]
    c: 'Boris Ponomarev, head of the CPSU International Department, "O gosudarstve natsional''noi demokratii," in *Kommunist* (no. 8): a state of national democracy to include freedom of speech, press and assembly and the right to form parties; no true independence without the liquidation of foreign monopolies and a strong national economy, heavy industry above all; the UAR, with Pakistan, an example of reactionary forces using dictatorial means; its processes arise from the contradictory interests of classes.'
