    date: '1961-05-01'
    thread: cuba
    also: [latin-america]
    c: 'Mansfield to the President, "The Cuban Aftermath": the clamor for further action largely Republican. "If we yield to the temptation to give vent to our anger at our own failure, we will, ironically, strengthen Castro''s position." Gradual disengagement from the anti-Castro groups; an end to violent verbal attacks on Castro; the Alliance for Progress pushed hard and fast.'
    n: '[FRUS 1961–63, X, doc. 192](https://history.state.gov/historicaldocuments/frus1961-63v10/d192). [[w.schlesinger-robert-kennedy-and-his]], 473. [[w.jones-bay-of-pigs]], 150. See [[cal.1961-04-15.cuba]]. Names: Mansfield, Kennedy, Castro.'
