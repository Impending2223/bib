  - id: cal.1961-05-16.china-leadership-2
    when: May 16
    date: '1961-05-16'
    place: geneva
    thread: china-foreign
    also: [laos]
    follows:
      - cal.1961-05-16.laos
    c: 'Geneva. Chen Yi, head of the Chinese delegation, in his first speech at the enlarged conference on Laos: the Laotian internal question can and must be settled only by the Laotians themselves. The international side of the question is to create the conditions in which the Laotian people can truly do what they wish without outside interference. All states at the conference must share the obligation to ensure Laos''s independence and neutrality. No outside state may use force or threats; none may use aid to wreck Laos''s neutrality. The United States and the states that back its interference must withdraw their military men, and the Kuomintang remnants in Laos must be disarmed and sent out. Only by abolishing the aggressive Southeast Asia military bloc can peace and security be kept in Southeast Asia, Laos included.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 195–196 (May 16, 1961); [[w.chen-yi-nianpu]], 872–873 (May 16, 1961; Chen Yi''s first speech, after the opening; the 1954 agreements a good base; Laos''s long unrest the work of American interference; its internal questions for the Lao alone; American and other foreign military personnel to leave; the Kuomintang remnants to be disarmed and sent out; only the end of SEATO can keep the peace; Vice-President Johnson''s tour of South Vietnam, Thailand and the Philippines cannot but alert us). Names: Chen Yi.'
    src:
