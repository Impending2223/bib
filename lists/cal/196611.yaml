    when: Nov. 2
    date: '1966-11-02'
    thread: laos
    c: 'Two Seventh Air Force A-1Es on a night mission with a C-130 flareship strafe a friendly area just outside Steel Tiger''s Foxtrot area: damage, a few injured.'
