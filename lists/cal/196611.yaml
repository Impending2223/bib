    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966); [[w.macfarquhar-maos-last-revolution]], 141 (worker rebels from seventeen factories form the Shanghai Workers'' Revolutionary Rebel General Headquarters at a meeting in the Shanghai Liaison Station of the Capital 3rd HQ, with Wang Hongwen, a thirty-two-year-old security guard, as "commander"; the Shanghai Party Committee refuses to recognize it); [[w.mao-zedong-zhuan]], VI, ch. 75 (early Nov. some Shanghai factory organizations, led by Wang Hongwen 王洪文 of No. 17 Cotton Mill, link up to set up the ''Shanghai Workers'' Revolutionary Rebel General Headquarters'' 上海工人革命造反总司令部; the Shanghai Party committee, on the Center''s rule against cross-trade organizations in factories and mines, does not recognize it and tries to educate the workers; Wang and the others call that ''suppressing revolutionary rebellion''; the date of the founding not given). [[w.dikotter-cultural-revolution]], 125 n.24, n.25 (the Red Workers inaugurated on Cultural Plaza; Cao Diqiu calls them the "dregs of humanity"; 20,000 march to city hall in the rain; a rumoured telegram from Zhou; over a thousand board a train for Peking, shunted to a siding; the line to Nanjing blocked thirty hours until Zhang Chunqiao arrives by military plane); [[w.dikotter-cultural-revolution]], 125. Made public: 2006. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.perry-proletarian-power]], 32–36 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34a); [[w.nianyi-da-dongluande-niandai]], 128 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34b); [[w.li-wang-li-fansi-lu]], II, 653–654 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34c); [[w.shanghai-wenhua-dageming-shihua]], I, 137–159 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34d). Names: Zhou Enlai, Wang Hongwen, Cao Diqiu.'
