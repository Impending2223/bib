  - id: cal.1966-11-03.elections-1966
    when: Nov. 3
    date: '1966-11-03'
    thread: elections-1966
    also: [vietnam-johnson-asia, republican-party]
    c: 'Nixon''s statement on the Manila communiqué, given the press in New York: mutual withdrawal would "leave the fate of South Vietnam to the Vietcong and the South Vietnamese Army"; tying withdrawal to the level of fighting, "we have offered to surrender a decisive military advantage." Printed in full by the *New York Times*.'
    n: '[[w.nixon-rn]], 274; [[w.white-making-of-the-president-1969]], 51 (the statement, given the *Times* by six). To check: Nixon''s statement, Nov. 3, 1966, as the *New York Times* printed it (quoted by [[w.nixon-rn]], 274). See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Nixon. Check: the *Times*''s day.'
