    c: 'The *Renmin ribao* prints the editorial "More on Grasping Revolution and Promoting Production": the economy is a whole; the Revolution in mines, enterprises and villages is not to take production time or leave production posts.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 86–87 (under Nov. 9, 1966); [[w.macfarquhar-maos-last-revolution]], 141 (the central authorities'' editorials repeat the summer''s policy that workers remain at their production posts and not leave their factories to exchange revolutionary experiences). To check: Renmin ribao, editorial, Nov. 10, 1966, translated in Survey of China Mainland Press, no. 3825 (Nov. 22, 1966) (cited by [[w.macfarquhar-maos-last-revolution]], 141 n.30). See [[cal.1966-11-09.china-leadership-2]]. Names: Zhou Enlai.'
