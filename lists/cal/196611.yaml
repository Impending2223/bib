    n: '[[w.teiwes-tragedy-of-lin-biao]], 68 (Yu in fact ran the Commission; Li assisted Zhou Enlai on the economy, 68 n.25). Made public: 1987 ([[w.shinian-houde-pingshuo]]). To check: [[w.nianyi-da-dongluande-niandai]], 134–137 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25a); [[w.shinian-houde-pingshuo]], 47–52 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25b); [[w.li-ping-wenhua-dageming-zhongde-zhou-enlai]], 122 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.25c). See [[cal.1966-11-17.china-leadership-2]]. Names: Li Fuchun, Yu Qiuli.'
