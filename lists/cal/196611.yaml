    c: 'Fuzhou 福州: the rebels seize the provincial Party headquarters; Ken Ling and his friends storm Ye Fei 叶飞''s residence as he is served breakfast; he is paraded through the streets in the following days and appeals to Han Xianchu 韩先楚, the army commander, who refuses to step in.'
