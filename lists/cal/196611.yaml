    c: 'Johnson gives Fulbright an hour''s private briefing on Manila, after Fulbright had come with Humphrey to meet him at Dulles on his return; Rusk to go on with it at lunch. Johnson''s letter after: "Let me have your suggestions from time to time." Fulbright then praises the conference''s results.'
    n: '[[w.gibbons-u-s-government-and]], IV, 446 (Stone''s account of the airport and the statement). To check: I. F. Stone, *In a Time of Torment* (1967), 346–47; Johnson to Fulbright, Nov. 4, 1966 (LBJ Library, Ex FO 6-3). See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Johnson, Fulbright, Humphrey, Rusk.'
