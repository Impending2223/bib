  - id: cal.1966-11-01.elections-1966
    when: Nov. 1
    date: '1966-11-01'
    thread: elections-1966
    c: 'Anchorage, the Westward Hotel, the night before Washington. Johnson to aides and secretaries: "FDR passed five major bills the first one hundred days. We passed 200 in the last two years"; signings in the East Room, the Cabinet Room, the Fish Room. The tour dropped; Brown and Douglas left to fill their schedules.'
    n: '[[w.califano-triumph-and-tragedy-of]], 151–52. Names: Johnson, Brown, Douglas.'
    src:
      c: 84d335e6
      rows:
        - 'w.califano-triumph-and-tragedy-of 151–52: all'
        - 'via w.califano-triumph-and-tragedy-of 152 n.4b: all'
    tags: [name:johnson-lyndon-b, name:brown-edmund-g, name:douglas-paul-h]
