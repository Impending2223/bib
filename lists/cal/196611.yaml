  - id: cal.1966-11-05.conservation
    when: Nov. 5
    date: '1966-11-05'
    thread: conservation
    c: 'Indiana Dunes National Lakeshore Act signed, [80 Stat. 1309](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1309.pdf), the statement released at San Antonio: thirteen miles of dunes and shore on Lake Michigan kept for public use. Douglas''s bill, S. 360; the Park Service had proposed it in 1916.'
    n: 'Statement by the President Upon Signing Bill Establishing the Indiana Dunes National Lakeshore, [1966 Pub. Papers 1331](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=705) (Nov. 5, 1966). To check: [[w.franklin-duel-for-the-dunes]]; [[w.douglas-in-the-fullness-of]]. Names: Douglas.'
    tags: [name:johnson-lyndon-b, name:douglas-paul-h]
