    c: 'Ginsburgh of the NSC staff to Rostow, on McNamara''s report, "exceedingly and excessively pessimistic": the war can be won in 12 to 24 months.{1} "I think this memo puts me farther out on a limb than anyone else has gone in writing."{2}'
