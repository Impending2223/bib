  - id: cal.1966-11-03.cities-and-housing
    when: Nov. 3
    date: '1966-11-03'
    time: 1966-11-03T18:06Z
    thread: cities-and-housing
    c: 'Demonstration Cities and Metropolitan Development Act signed in the East Room, with the clean water act, [80 Stat. 1255](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1255.pdf): grants for comprehensive city demonstration programs, $12 million a year for planning in fiscal 1967 and 1968, then $400 million for 1968 and $500 million for 1969; grants and guarantees for metropolitan planning and new communities. Weaver and Wood to run it.'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill, [1966 Pub. Papers 1309](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=683) (Nov. 3, 1966). [[w.califano-triumph-and-tragedy-of]], 135 ("Model Cities"; Johnson to Califano: "Don''t ever give such a stupid Goddamn name to a bill again"); [[w.bernstein-guns-or-butter]], 467 (the "Model Cities" Act, the name Johnson orders used; to Califano: "Don''t ever give such a stupid Goddamn name to a bill again"); [[w.zelizer-fierce-urgency-of-now]], 227 (Model Cities, "severely watered down" from Johnson''s plan, about $900 million). See [[cal.1966-01-26.cities-and-housing]]. Names: Weaver, Wood.'
    src:
      c: 5605166a
      rows:
