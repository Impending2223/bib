    c: 'Anting 安亭. From before dawn Zhang Chunqiao 張春橋 negotiates with Wang Hongwen 王洪文 and Pan Guoping 潘國平: stopping the trains is a crime, a counter-revolutionary act; they are to go back to Shanghai. They agree to urge a return on terms: the General Headquarters recognized as a revolutionary body, the action as revolutionary, the blame the municipal committee''s. From a truck, in the rain, Zhang speaks nearly an hour; the workers'' accusations run from 8 a.m. to past 3 p.m., and he allows that the committee carried out the reactionary line and promises to report it to the Center and Mao. Wang Hongwen announces the General Headquarters'' decision: all return to Shanghai.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 342–343. The words: 12日凌晨，談判開始; 從12日上午8點持續到下午3點多; 整整13個小時 (I, 342). The time is the talks'' start. To check: *Xu Jingxian de zuihou huiyi* 《徐景賢的最后回憶》 (Xingke''er chubanshe 星克爾出版(香港)有限公司, 2013), 58 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 342 n.24). See [[cal.1966-11-11.china-leadership-3]]. Names: Zhang Chunqiao, Wang Hongwen.'
