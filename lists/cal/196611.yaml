    c: 'NBC, a half hour of the Republican Congressional Campaign Committee''s time. Nixon on Johnson''s attack: "one of the most savage personal assaults ever leveled by the President of the United States against one of his political opponents"; the right to dissent; the case for a Republican Congress.'
    n: '[[w.nixon-rn]], 276–77. See [[cal.1966-11-04.elections-1966]]. Names: Nixon, Johnson. Check: the day; Nixon gives two days before the election.'
