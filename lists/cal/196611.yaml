  - id: cal.1966-11-01.vietnam
    when: Nov. 1–2
    date: '1966-11-01'
    place: seoul
    thread: vietnam-asian-trip
    also: [korea]
    c: 'Seoul, from Oct. 31.{1} Johnson and Park, Nov. 1; Johnson to the National Assembly, and their joint statement, Nov. 2. To Anchorage the same day, across the date line: the Fish Protein Concentrate Act signed there. At Dulles that night, the trip''s end: 31,500 miles, seven nations, seventeen days.{2}'
    n: 'Joint Statement Following Discussions With President Park of Korea, [1966 Pub. Papers 1293](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=667); Remarks Before the Korean National Assembly, Seoul, Korea, [1966 Pub. Papers 1290](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=664); Remarks at Dulles International Airport Upon Returning From the Asian-Pacific Trip, [1966 Pub. Papers 1302](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=676) (Nov. 2, 1966). Remarks Upon Signing Bills Relating to Health and Education, [1966 Pub. Papers 1307](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=681) (Nov. 3, 1966) (the mileage). FRUS 1964–68, XXIX, pt. 1, doc. [96](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d96). [[w.mcpherson-political-education]], 313–15 (Seoul''s crowds); [[w.bernstein-guns-or-butter]], 329 (to the troops in Korea: "My great-great-grandfather died at the Alamo"); [[w.johnson-white-house-diary]], 446–53 (Oct. 31: arrival in Seoul at about 3 p.m., Park at the foot of the steps, 350,000 estimated at City Hall Plaza, the Golden Key; Johnson: "To an American, the free soil of Korea is hallowed ground"; State Dinner at the Capitol after the Blue House; Nov. 2: the National Cemetery, the National Assembly, "I leave today with a deep sense of confidence in the future of Asia and the Pacific"; the National Assembly on Nov. 2, as the entry; the diary has no entry for Nov. 1). See [[cal.1966-10-17.vietnam]]. Names: Johnson, Park Chung Hee.'
    src:
