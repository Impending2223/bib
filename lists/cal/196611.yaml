  - id: cal.1966-11-30.vietnam-hanoi
    when: Nov. 30
    date: '1966-11-30'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat''s circular no. 189-TT/TW on the 20th anniversary of the national resistance (Dec. 19), the 22nd of the People''s Army (Dec. 22) and the 6th of the National Liberation Front (Dec. 20): a propaganda drive to raise the will to beat the Americans, on the resistance against the French, the unity of army and people and of North and South, and the Front as the South''s one true representative. Stories, visits to families of the dead, small army and people''s days, exhibitions and films; a rally in Hanoi.'
    n: '*Thông tri của Ban Bí thư số 189-TT/TW, ngày 30-11-1966, Về việc tuyên truyền động viên nhân dịp ba ngày kỷ niệm trong tháng 12 năm 1966*, signed for the Secretariat by Vũ Tuân, chief of its office. [[w.van-kien-dang-toan]], XXVII, 323–25. Made public: 2003.'
    tags: [polity:drv, polity:us, vis:only:drv]
