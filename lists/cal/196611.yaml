  - id: cal.1966-11-10.china-leadership-2
    when: Nov. 10
    date: '1966-11-10'
    place: anting
    thread: china-leadership
    also: [china]
    c: Before dawn the General Headquarters of Shanghai's rebel workers, in the name of going to Peking to "lodge a complaint", lies on the rails at Anting station near Shanghai and stops the trains, cutting the Shanghai–Nanjing line for thirty-one hours.{1}
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10, 1966); [[w.macfarquhar-maos-last-revolution]], 141–142 (some 2,500 of its members commandeer a train to go to Peking; when Zhou orders it stopped they sit down on the rails at Anting on the Shanghai–Nanjing trunk line for thirty-one hours, until Zhang Chunqiao, sent by the Standing Committee, persuades them to return to Shanghai for negotiations); [[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 10, before dawn Wang Hongwen leads more than two thousand workers to board a train by force at Shanghai North Station to petition at Peking; the train is stopped at Anting by order of the railway bureau; at noon the workers lie on the rails, cutting the Shanghai–Nanjing line for nearly thirty-one hours, so that thirty-six trains cannot leave Shanghai; they demand that the headquarters be recognized as a lawful revolutionary organization, the journey to Peking a revolutionary act, and the East China Bureau and the Shanghai committee wholly to answer for the result). [[w.jian-zhou-enlai]], 555 (over a thousand of the new Shanghai Workers'' Revolutionary Rebellion Headquarters, bound for Peking to win the Group''s recognition, stopped by the Shanghai authorities at Anting, some twenty kilometers out; they lie across the tracks and block the Shanghai–Peking line more than twenty hours). Made public: 2006. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.perry-proletarian-power]], 32–36 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34a); [[w.nianyi-da-dongluande-niandai]], 128 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34b); [[w.li-wang-li-fansi-lu]], II, 653–654 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34c); [[w.shanghai-wenhua-dageming-shihua]], I, 137–159 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.34d). See [[cal.1966-11-09.china-leadership-3]]. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
    variants:
      - unit: '1'
        witness: w.mao-zedong-zhuan
        reads: the boarding at Shanghai North Station before dawn on the 10th, the lying on the rails at Anting at noon that day, the line cut nearly thirty-one hours and thirty-six trains held
        at: VI, ch. 75
      - unit: '1'
        witness: w.yang-jisheng-tiandi-fanfu
        reads: before dawn a group of the Workers' General Headquarters 工總司 rushes the North Station and crowds onto train 626 for Peking, which leaves at 5 a.m.; Wang Hongwen 王洪文 and Pan Guoping 潘國平 with more than a thousand take train 756 to Zhengzhou, made temporarily train 602, leaving at 7 a.m.; Zhou will not have so many go north and has the Railways Ministry's transport bureau order a stop; train 602 stops at Anting at 8:17 a.m., a small station of which even Shanghai people did not know, its engine taken off, the train lying on a coal-unloading siding; train 626 is stopped at Nanjing station at noon; the Shanghai–Nanjing line is cut 31 hours 34 minutes
        at: I, 341
  - id: cal.1966-11-10.china-leadership-3
    when: Nov. 10
    date: '1966-11-10'
    thread: china-leadership
    also: [china]
    follows:
      - cal.1966-11-10.china-leadership-2
    c: 'Zhou Enlai, told of the Anting stoppage, has Chen Boda wire the East China Bureau''s Han Zheyi that the Bureau and the Shanghai committee must stand firm: the General Headquarters is not to be recognized as lawful, nor lying on the rails as revolutionary action. He wires the Shanghai workers at Anting that their act harms their units'' output and the country''s traffic, and asks them to return to Shanghai at once.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 9, 1966, the item after); [[w.mao-zedong-zhuan]], VI, ch. 75 (the Anting incident brought no word from Mao at first; Zhou Enlai presides over an enlarged meeting of the Standing Committee, which, on the principles the Center had laid down, has Chen Boda wire the East China Bureau and the Shanghai committee not to compromise with the headquarters, and to persuade the workers who had been taken in or swept along). [[w.yang-jisheng-tiandi-fanfu]], I, 341 (the Shanghai committee reports to the Center; Zhou presides over the Center''s huddle on how to deal with it, which decides to wire the East China Bureau and the Shanghai workers'' rebels, both drafted by Chen Boda: the Bureau to hold firm, not to recognize the General Headquarters as a lawful organization nor the stopping of the trains as a revolutionary act, the Cultural Revolution Group deciding to send Zhang Chunqiao back to Shanghai to persuade the workers; to the workers: "big principles govern small ones, and doing production well is the big principle; your act harms production and greatly the whole country''s traffic, a very great matter; we hope you will at once correct it and go back to Shanghai and settle problems on the spot; the Group sends Comrade Zhang Chunqiao to meet you at once"; the telegram about a thousand characters, in full in Xu Jingxian); [[w.jian-zhou-enlai]], 556 (Zhou, not intervening himself, persuades Chen Boda to cable the workers to go back, their protest "[would] influence the productivity of their own work units or even that of the whole country"). Made public: 2020. To check: *Xu Jingxian de zuihou huiyi* 《徐景賢的最后回憶》 (Xingke''er chubanshe 星克爾出版(香港)有限公司, 2013), 54–55, 55–57 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 341 n.21); [[w.li-xun-geming-zaofan-niandai]], 317–318 (cited by [[w.jian-zhou-enlai]], 556 n.49). Names: Zhou Enlai, Chen Boda, Han Zheyi.'
    tags: [name:zhou-enlai, name:chen-boda, polity:prc, vis:only:prc, name:han-zheyi]
