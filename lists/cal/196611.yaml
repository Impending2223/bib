    when: Nov. 1
    date: '1966-11-01'
    thread: vietnam-asian-trip
    also: [korea]
    c: Seoul, the last night of the stay. William Bundy, Rostow and McPherson out on the town as guests of several Korean cabinet ministers. By McPherson's account.
    n: '[[w.mcpherson-political-education]], 314–15. Check: the day. See [[cal.1966-11-01.vietnam]]. Names: William Bundy, Rostow, McPherson.'
