    c: Zhou Enlai, with Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu and the heads of the General Department's and services, receives at the Workers' Stadium those in Peking from the army's academies and from cultural and sports units. He walks the field with Tao Zhu to meet the delegates and leaves. Chen Yi, Xu Xiangqian, Ye Jianying and others criticize extreme practices in the Cultural Revolution and stress that the army must not fall into disorder.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 88 (Nov. 13, 1966); [[w.yang-jisheng-tiandi-fanfu]], I, 421 (with Lin Biao''s consent the 100,000 rally at the Workers'' Stadium in the afternoon, to send the academies'' students in Peking back to their schools; Chen Yi: "a cold towel on a hot head is good," no storming of gates, buildings and phones; Ye Jianying: the Second Military Medical University went too far; the capitalist-roaders a handful; a slip from Li Jicai 李繼才 of the Veterinary University''s rebels asks whether Lin approved the rally; uproar in the stands, and Xiao Hua and Liu Zhijian close the rally and escort the marshals out); [[w.teiwes-tragedy-of-lin-biao]], 36, 67–68 (the General Political Department''s first rally, the old marshals urging the students against excessive slogans and violence; Lin approves He Long''s speaking and his speech beforehand, the most conservative of the marshals'': the army to keep out of local Cultural Revolution activities; denounced by radical factions); [[w.chen-yi-nianpu]], 1174 (Nov. 13, 1966, afternoon, the Workers'' Stadium; Chen Yi''s speech to the rally of 100,000 of the army''s academies and sports and arts units: he will throw some cold water; some treat their own comrades and the people''s army as enemies, "escalating step by step," the further "left" the better; such simplifying and widening will bring the opposite result); [[w.liu-jixian-ye-jianying-nianpu]], II, 948–949 (Nov. 13, 1966; Ye Jianying 叶剑英, with Zhou Enlai 周恩来, Tao Zhu 陶铸, Chen Yi 陈毅, He Long 贺龙, Xu Xiangqian 徐向前 and the heads of the general departments, services and arms, receives at the Workers'' Stadium 工人体育场 the hundred thousand of the army''s schools and cultural and sports units come to Peking 北京, and speaks against the movement''s wrong ways: truth one step too far becomes error (Lenin 列宁); leaders who have owned their errors again and again still beaten and struggled against, the Second Medical University 二医大 gone too far; let people err and correct themselves; reading Mao''s books and obeying him more than seeing him; the *Quotations* 《毛主席语录》 not to be recited like scripture; a cadre fallen with a heart attack still struggled against: he is angered; beware of men with ulterior motives). To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 3rd ed., 2011), 622–624 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 421 n.11); [[w.nianyi-da-dongluande-niandai]], 123 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.71a); [[w.xu-xiangqian-zhuan]], 522 (cited by [[w.teiwes-tragedy-of-lin-biao]], 36 n.71b); [[w.nianyi-da-dongluande-niandai]], 96–99 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24a); [[w.yunsheng-maojiawan-jishi]], 56–58, 61–62 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 277–278 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24c); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 161 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24d); [[w.yanjiubu-zhongguo-renmin-jiefang-jun]], 627 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24e); [[w.barnouin-ten-years-of-turbulence]], 126–132 (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 68 n.24g). Names: Zhou Enlai, Tao Zhu, Chen Yi, He Long, Xu Xiangqian, Ye Jianying, Xiao Hua, Yang Chengwu.'
