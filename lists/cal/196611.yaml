    when: Nov. 30
    date: '1966-11-30'
    thread: china-leadership
    c: 'Zhou Enlai speaks at the collective reception by the Center''s leaders of masses from factories, mines, institutions and offices around the country. Because of the Cultural Revolution all have had problems; the Center is studying them and drafting decisions; they have been long away from their units, with production and work, and most may go back, leaving a few delegates. Chen Yi adds that in a word it is the Premier''s instruction, the Center''s spirit: make revolution and grasp and promote production, without hampering production.'
