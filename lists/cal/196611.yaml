  - id: cal.1966-11-03.china-leadership-2
    when: Nov. 3
    date: '1966-11-03'
    thread: china-leadership
    c: 'Zhou Enlai, before the sixth reception, calls the heads of Peking''s Red Guard bodies: Peking''s teachers and students are not to take part in the Tiananmen review; to help the PLA and others with propaganda and order; and after the out-of-town teachers and students are reviewed, urge them home to run their own Cultural Revolution.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 3, 1966). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-11-03.vietnam-hanoi
