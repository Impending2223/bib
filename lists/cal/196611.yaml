  - id: cal.1966-11-04.vietnam
    when: Nov. 4
    date: '1966-11-04'
    thread: vietnam
    c: 'After Johnson''s meeting with Rusk and McNamara, State tells Lodge, 78865, of the new arrangement for pacification: the civil side under one manager, the security side under MACV.'
    n: '[[w.gibbons-u-s-government-and]], IV, 471. To check: Washington to Saigon 78865, Nov. 4, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 471 n.108); Rostow to Johnson, Nov. 4, 1966, the agenda for the day''s meeting, NSF Memos to the President, Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 471 n.108). See [[cal.1966-10-15.vietnam]]. Names: Johnson, Rusk, McNamara, Lodge.'
