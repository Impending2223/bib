    at: after 1966-11-10
    thread: china-leadership
    c: 'Zhang Chunqiao 张春桥 signs the demands of the Workers'' General Headquarters: that it be recognized as a lawful revolutionary organization, that its journey north to lodge a complaint was a revolutionary act, and that the East China Bureau and the Shanghai committee answer for the results of the stoppage of the trains.'
    n: '[[w.mao-zedong-zhuan]], VI, ch. 75 (after his arrival at Shanghai; the day and the place not given). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. See [[cal.1966-11-13.china-leadership-3]]. Names: Zhang Chunqiao. Check: the place; the book has him sign after reaching Shanghai.'
