    n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [625](https://archive.org/details/alabama-official-statistical-register-1967/page/n626)–[627](https://archive.org/details/alabama-official-statistical-register-1967/page/n628). [*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.jeffries-bloody-lowndes]]. See [[cal.1966-05-03.elections-1966]]; [[cal.1966-11-08.elections-1966]]. Names: Lurleen Wallace, Grenier, Wilson Baker, Martin, Sparkman.'
