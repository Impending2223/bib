    thread: china-leadership
    c: Shanghai 上海. With the criticism of the "bourgeois reactionary line" 资产阶级反动路线, the Shanghai Red Guard General Headquarters 上海市红卫兵总部 and the Red Guards' Shanghai Colleges' General Headquarters 红卫兵上海市大专院校总部, now held conservative bodies, collapse one after the other.
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 228. The words: 11月以后相继垮台散伙 (228). See [[cal.1966-09-26.china-leadership-4]].'
    src:
      c: c161bae0
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 228: all'
