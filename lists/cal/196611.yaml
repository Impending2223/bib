  - id: cal.1966-11-08.elections-1966
    when: Nov. 8
    date: '1966-11-08'
    thread: elections-1966
    also: [georgia, states-and-cities]
    c: 'Midterms. House 248 D–187 R, from 295–140 at the 89th''s opening: Republicans up 47. Senate 64 D–36 R, three seats to the Republicans: Percy over Douglas in Illinois, 2,100,449 to 1,678,147, 54.9 percent; Hatfield in Oregon; Baker in Tennessee. Brooke, Massachusetts'' attorney general, over Peabody, 1,213,473 to 774,761, 60.7 percent: the first Negro elected to the Senate by popular vote. Governors: Republicans 25, up eight. Reagan over Brown in California, 3,742,913 to 2,749,174, 57.6 percent. Rockefeller a third term in New York over O''Connor, 2,690,626 to 2,298,363, 44.6 percent, in a field of four; Romney re-elected in Michigan over Ferency, 1,490,430 to 963,383, 60.5 percent. Agnew in Maryland; Winthrop Rockefeller in Arkansas and Kirk in Florida, their States'' first Republican governors since Reconstruction; Lurleen Wallace in Alabama. Georgia: Callaway (R) over Maddox (D), 453,665 to 450,626, 46.6 percent, a 3,039-vote margin; write-ins for Arnall 69,025, 7.1 percent (Check): no majority; the General Assembly to choose.'
    n: '[*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1357](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=731) (Nov. 10, 1966): "We thought that we would lose one. We lost three." Governors'' figures: Wikipedia''s tables of each race (Check against the States'' canvasses). [[w.kabaservice-rule-and-ruin]], 187–91 (the House, 187 seats, up forty-seven; the Senate, 64 to 36, three seats taken; Percy over Douglas; Hatfield; Baker; Brooke, 61 percent, the first Negro elected to the Senate by popular vote; twenty-five governors; Reagan; Rockefeller; Romney; Agnew; Winthrop Rockefeller); [[w.white-making-of-the-president-1969]], 51–52 (Republicans up forty-seven in the House, three in the Senate; Nixon at the Delmonico: "We''ll kick their toes off in 1968"); [[w.branch-at-canaans-edge]], 549–50 (net losses: forty-seven House seats, three Senate, eight governors, 677 legislative seats; Reagan by 993,739 of 6.5 million; Brown: "the people want separation of the races"); [[w.goldberg-barry-goldwater]], 246–47 (governors twenty-five of thirty-five, Senate eighteen of thirty-two, forty-seven House seats, two of them in the Northeast; Southern Republicans up nine, to twenty-six; Arizona''s Senate Republican for the first time); [[w.smith-on-his-own-terms]], 493 (Rockefeller over O''Connor; Winthrop Rockefeller, Arkansas''s first Republican governor since Reconstruction); [[w.bernstein-guns-or-butter]], 410–11 (47 seats in the House, 3 in the Senate, 8 governors, 677 legislators; O''Brien expected 32); [[w.zelizer-fierce-urgency-of-now]], 257 (248 Democrats in the House, 64 in the Senate; Republicans up 47 and 3; a net of eight governorships); [[w.graham-uncertain-triumph]], 130–31. To check: [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]; [[w.brooke-bridging-the-divide]]; [[w.douglas-in-the-fullness-of]]; [[w.ward-arkansas-rockefeller]]; [[w.witcover-white-knight]]; [[w.short-everything-is-pickrick]]; [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.savage-jfk-lbj-and-the]]; New York Times, Nov. 10, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 549); Mary White Ovington, "The National Association for the Advancement of Colored People, Journal of Negro History, Vol. 9, 1924, p. 339 (cited by [[w.branch-at-canaans-edge]], 549); Edwards, *Reagan* (1967), 176 (cited by [[w.branch-at-canaans-edge]], 549, 550); "Wallace Doubts Reagan''s Beliefs," NYT, Nov. 10, 1966, p. 30 (cited by [[w.branch-at-canaans-edge]], 549); "Reagan Emerging in 1968 Spotlight," NYT, Nov. 10, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 549); Edwards, *Reagan* (1967), 171–72 (cited by [[w.branch-at-canaans-edge]], 549); New York Times, Noy. 10, 1966, p29 (cited by [[w.branch-at-canaans-edge]], 549); Atlanta Constitution, Nov. 10, 1966, p. 7 (cited by [[w.branch-at-canaans-edge]], 549); New York Times, Nov. 19, 1966, p. 30 (cited by [[w.branch-at-canaans-edge]], 550); [[w.matusow-unraveling-of-america]], 214 (cited by [[w.branch-at-canaans-edge]], 550); New York Times, Noy. 9, 1966, p29 (cited by [[w.branch-at-canaans-edge]], 550); New York Times, Nov. 6, 1966, p. 60 (cited by [[w.branch-at-canaans-edge]], 550). See [[cal.1966-01-04.states-and-cities]]; [[cal.1966-11-04.elections-1966]]. Names: Percy, Hatfield, Brooke, Douglas, Baker, Reagan, Nelson Rockefeller, Romney, Agnew, Winthrop Rockefeller, Kirk, Brown, Maddox, Peabody, Callaway, Lurleen Wallace, Arnall, O''Connor.'
