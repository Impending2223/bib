    also: [voting-rights]
    c: 'Texas adopts fifteen of sixteen amendments. The poll tax repealed as a condition of voting, 659,604 to 466,119, 58.6 percent. Voters short of a county''s residence to vote for electors and statewide offices, and new residents for President and Vice President, 701,349 to 347,337, 66.9 percent; members of the armed forces resident in Texas to vote, 893,798 to 197,901, 81.9 percent. A county of 1.2 million or more may consolidate its governments, 565,174 to 447,578, 55.8 percent. A five-member Court of Criminal Appeals; $200 million more in water bonds; airport authorities; Arlington State College out of the Permanent University Fund. Refused: six-year terms for directors of conservation districts.'
