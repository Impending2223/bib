  - id: cal.1966-11-25.china-leadership
    when: Nov. 25
    date: '1966-11-25'
    thread: china-leadership
    c: 'With Mao''s consent the Center and State Council telegraph the East China Bureau and the Zhejiang committee: a few of the masses have taken the Wenzhou public security bureau; it harms order, the fight against the enemy and the Revolution; withdraw at once; the same elsewhere.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 25, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966; Zhou reviews and issues the Center''s and State Council''s telegram to the East China Bureau and Zhejiang committee, copy to all: public security organs are organs of dictatorship, to be kept working; masses who entered must leave at once; students and masses had burst into public security offices and hurt policemen in Zhejiang, Fujian, Xinjiang, Yunnan, Jilin and Hebei). Made public: 2013. Check: Zhou''s chronology gives Zhou''s review and issue of the telegram under Nov. 24. Names: Mao Zedong.'
    tags: [name:mao-zedong, polity:prc, vis:only:prc]
  - id: cal.1966-11-25.china-leadership-2
    when: Nov. 25–26
    date: '1966-11-25'
    place: peking
    thread: china-leadership
    c: 'Tiananmen. Mao receives 2,500,000 Red Guards and revolutionary teachers and students, the eighth and last reception: Nov. 25 from 11:30 a.m., four hours; Nov. 26 from 2:30 p.m., in an open car, at the square, Chang''an Avenue and the western airfield.{1} Since Aug. 18 he has received over 11,000,000 person-times.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 25, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 25–26, 1966; Zhou with Mao at the eighth reception of out-of-town teachers, students and Red Guards); [[w.macfarquhar-maos-last-revolution]], 109–110 (the last rally, Nov. 25–26, brings Mao before some 12 million Red Guards in all; more than 200,000 a day were arriving in Peking by train by November, 290,000 on peak days by Zhou''s count, with 50,000 more after the last rally hoping to see Mao and 60,000 to submit petitions; at one time 3 million temporary visitors); [[w.deng-xiaoping-nianpu-1904]], III, 1934 (Nov. 25 and 26, 1966; Deng takes part in Mao''s eighth reception of two and a half million teachers and students and Red Guards from all over the country); [[w.yang-jisheng-tiandi-fanfu]], I, 242 (Nov. 25 at four below, Mao stands four hours and receives 650,000 Red Guards in the square; Nov. 26 he receives the last 1,850,000 from a car at the Diaoyutai and the western airfield; the road blocked, he is taken toward Yuquanshan 玉泉山, there the car is hemmed in and the guards help him in on foot; at the dispersal a small bridge breaks, several are trampled to death and more crushed; the eight receptions together over 12,000,000 Red Guards); [[w.chen-yi-nianpu]], 1175–1176 (Nov. 25, 1966, 11:30 a.m., and Nov. 26, 2:30 p.m.; Chen Yi with Lin Biao, Zhou and others on the Tiananmen tower at the eighth reception, two and a half million); [[w.dikotter-cultural-revolution]], 108 (after eight reviews, the last on Nov. 26, Mao has appeared before 12 million Red Guards; at the end he rides through the city in an open jeep, reaching 2 million at a stroke); [[w.liu-jixian-ye-jianying-nianpu]], II, 950 (Nov. 25–26, 1966; Ye Jianying 叶剑英 with Mao at the eighth reception); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Nov. 25–26, 1966; Zhu De 朱德 in Tiananmen Square 天安门广场 at Mao Zedong''s 毛泽东 eighth reception of 2,500,000 Red Guards 红卫兵, teachers and students from all over the country). To check: [[w.beijing-shi-jiedai-lai]], 1–3 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.35); [[w.hui-hongweibing-mi-lu]], 393 (cited by [[w.macfarquhar-maos-last-revolution]], 110 n.40); [[w.lin-biao-wenxuan-2]], II, 378 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.34a); [[w.zhongyang-fuze-tongzhi-guanyu-2]], 54 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.34b); [[w.wenhua-dageming-bowuguan-2]], I, 84–101 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.34c); [[w.ting-xing-leaf-in-the-bitter]], 93–98 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.34d). Names: Mao Zedong.'
