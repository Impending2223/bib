  - id: cal.1966-11-17.china-leadership-2
    when: Nov. 17–21
    date: '1966-11-17'
    place: peking
    thread: china-leadership
    c: 'Peking.{1} An industry-and-communications forum of provincial and State Council officials takes up the "twelve instructions on the Cultural Revolution in factories" drafted under Chen Boda. They reject its allowance of factory factions and student link-ups, and a draft by Gu Mu, "Some Provisions on the Cultural Revolution in Industrial and Communications Enterprises" (the "fifteen articles"), says the industry front for seventeen years followed Mao''s line: no stopping production;{2} workers join in spare hours; students not to link up in factories.{3} Chen Boda and the Group oppose and attack it.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 17, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 90 (Nov. 17–23, 1966; before the planning and the industry-and-transport conferences Zhou has Yu Qiuli press the preparation, so as to fix the 1967 plan early and well, and has Gu Mu form a team on carrying out "grasp revolution, promote production"; the delegates reject the Twelve Instructions allowance of factory factions and student link-ups; Gu Mu drafts the Fifteen Articles); [[w.macfarquhar-maos-last-revolution]], 142–143 (a series of stormy meetings in November, convened with a national planning conference, brings representatives of the State Planning Commission, the center''s regional bureaus, the industrial ministries and the major industrial cities together with members of the Group, to discuss matters in urgent need of resolution on the movement and production; the main dispute is over a Group draft that flatly rejects any conflict between production and revolution; most regional representatives are fiercely opposed to workers'' organizations); [[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 17–21 at Peking the forum of the heads in charge of industry of some provinces and cities and of the State Council''s departments, on Chen Boda''s draft for factories and mines; the members dislike its leave to form factions in factories and for students to link up in them, and write a revised draft: ''in the seventeen years the industrial and communications front in the main carried out Chairman Mao''s revolutionary line''; large-scale industry is continuous and cooperative, no stopping production for revolution, only by stages and in batches; workers join in only in spare time, the eight-hour day not to be invaded; students not to go to factories to link up). [[w.jian-zhou-enlai]], 556–557 (the national conference on industry and transport; Chen Boda''s draft lets workers form their own organizations and students make "revolutionary connections" in factories; the officials almost all oppose: "the nation''s economy will fall into complete disorder"); [[w.teiwes-tragedy-of-lin-biao]], 68 (the industry and communications seminar from mid-November: the economic officials reject the Cultural Revolution Group''s twelve-article draft; Yu Qiuli and Gu Mu, under Tao Zhu, draft a fifteen-article counter-document). Made public: 2006. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 75), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.nianyi-da-dongluande-niandai]], 134 (cited by [[w.macfarquhar-maos-last-revolution]], 142 n.36); [[w.shi-yun-zhang-chunqiao-yao-wenyuan-shizhuan]], 351 (cited by [[w.jian-zhou-enlai]], 556 n.55); [[w.nianyi-da-dongluande-niandai]], 135–137 (cited by [[w.jian-zhou-enlai]], 557 n.56). Names: Chen Boda, Gu Mu.'
    src:
      c: babd01d2
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Nov. 17, 1966: 1, 2, 3, 4'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 90: ?'
        - 'w.macfarquhar-maos-last-revolution 142–143: ?'
        - 'w.mao-zedong-zhuan VI, ch. 75: 1, 3'
        - 'w.jian-zhou-enlai 556–557: ?'
        - 'w.teiwes-tragedy-of-lin-biao 68: ?'
