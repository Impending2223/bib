  - id: cal.1966-11-08.elections-1966
    when: Nov. 8
    date: '1966-11-08'
    thread: elections-1966
    also: [georgia, states-and-cities]
    c: 'Midterms. House 248 D–187 R, from 295–140 at the 89th''s opening: Republicans up 47. Senate 64 D–36 R, three seats to the Republicans: Percy over Douglas in Illinois, 2,100,449 to 1,678,147, 54.9 percent; Hatfield in Oregon; Baker in Tennessee. Brooke, Massachusetts'' attorney general, over Peabody, 1,213,473 to 774,761, 60.7 percent: the first Negro elected to the Senate by popular vote. Governors: Republicans 25, up eight. Reagan over Brown in California, 3,742,913 to 2,749,174, 57.6 percent. Rockefeller a third term in New York over O''Connor, 2,690,626 to 2,298,363, 44.6 percent, in a field of four; Romney re-elected in Michigan over Ferency, 1,490,430 to 963,383, 60.5 percent. Agnew in Maryland; Winthrop Rockefeller in Arkansas and Kirk in Florida, their States'' first Republican governors since Reconstruction; Lurleen Wallace in Alabama. Georgia: Callaway (R) over Maddox (D), 453,665 to 450,626, 46.6 percent, a 3,039-vote margin; write-ins for Arnall 69,025, 7.1 percent (Check): no majority; the General Assembly to choose.'
    n: '[*Statistics of the Congressional Election of November 8, 1966*](https://clerk.house.gov/member_info/electionInfo/1966election.pdf) (Clerk of the House, 1967). The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 1357](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=731) (Nov. 10, 1966): "We thought that we would lose one. We lost three." Governors'' figures: Wikipedia''s tables of each race (Check against the States'' canvasses). To check: [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]; [[w.brooke-bridging-the-divide]]; [[w.douglas-in-the-fullness-of]]; [[w.smith-on-his-own-terms]]; [[w.ward-arkansas-rockefeller]]; [[w.witcover-white-knight]]; [[w.short-everything-is-pickrick]]; [[w.witcover-resurrection-of-richard-nixon]]; [[w.perlstein-nixonland-2008]]; [[w.kabaservice-rule-and-ruin]]; [[w.savage-jfk-lbj-and-the]]. See [[cal.1966-01-04.states-and-cities]]; [[cal.1966-11-04.elections-1966]]. Names: Percy, Hatfield, Brooke, Douglas, Baker, Reagan, Nelson Rockefeller, Romney, Agnew, Winthrop Rockefeller, Kirk, Brown, Maddox, Peabody, Callaway, Lurleen Wallace, Arnall, O''Connor.'
    tags: [election:1966, name:percy-charles-h, name:douglas-paul-h, name:hatfield-mark-o, name:baker-howard-h-jr, name:brooke-edward-w, name:peabody-endicott, name:reagan-ronald, name:brown-edmund-g, name:rockefeller-nelson, name:romney-george-w, name:agnew-spiro-t, name:rockefeller-winthrop, name:kirk-claude-r-jr, name:callaway-howard-h, name:maddox-lester, name:wallace-lurleen-b, name:arnall-ellis, state:ma, name:oconnor-frank-d]
