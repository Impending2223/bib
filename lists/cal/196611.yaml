    thread: state-legislatures
    also: [elections-1966, legislatures]
    c: 'The State legislatures.{1} Republicans gain some 420 lower-house seats and 160 senate seats;{2} Democrats lose some 625 and 124, the bodies smaller by reapportionment. Republicans take both houses of Alaska, Arizona, Maine, Michigan and Utah, the lower houses of Colorado, Delaware, Illinois, Indiana, Iowa, Montana, North Dakota, Pennsylvania, Washington, Wisconsin and Wyoming, and the Ohio Senate (tied before); the California and Delaware senates tied; Democrats take the Connecticut House and the Nevada Senate. At the 1967 sessions Democrats control 23 legislatures, Republicans 18, eight divided or tied (32, 6 and 11 before). Remade by reapportionment: the Connecticut House, 294 seats to 177; the Ohio House, 137 to 99; the Arizona House, 80 to 60; the Maryland Senate, 29 to 43.{3}'
    n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1966 and 1967 (Check against the *Book of the States*, 1966–67 and 1968–69). [[w.hess-republican-establishment]], 2, 4 (after 1964 Republicans controlled "only 7 of the 50 legislatures"; in 1966 they "nearly tripled the number" and captured the legislatures of Arizona and Alaska for the first time since statehood; no seat counts, no chamber by chamber). Check: Nixon, 277, gives the Republicans 540 seats in the legislatures. Check: Hess and Broder, 2, have the Republicans in control of "only 7 of the 50 legislatures" after 1964; the entry has 6 before the election. To check: [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1966-11-08.elections-1966]]; [[cal.1966-01.legislatures-us]].'
