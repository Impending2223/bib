    c: 'Economic Opportunity Amendments signed, [80 Stat. 1451](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1451.pdf), the statement released at San Antonio: $1.75 billion authorized for fiscal 1967, $846 million of it for community action; sums set program by program, Head Start and legal services named.'
    n: 'Statement by the President Upon Signing Bill To Provide for Continued Progress in the Nation''s War on Poverty, [1966 Pub. Papers 1352](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=726) (Nov. 8, 1966). To check: [[w.davies-from-opportunity-to-entitlement]]. See [[cal.1965-10-09.poverty]].'
