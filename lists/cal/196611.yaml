    c: 'Zhou Enlai speaks at the meeting for the centenary of Sun Yat-sen''s birth. Sun was a great revolutionary of the Chinese bourgeois-democratic revolution; the 1911 Revolution he led had great historical meaning: it did not finish the democratic task against imperialism and feudalism, but it ended over two thousand years of feudal monarchy and raised the spirit of democracy; the Chinese people will always remember his part.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 87–88 (Nov. 12, 1966); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 652 (Nov. 12, 1966; Liu attends the meeting); [[w.chen-yi-nianpu]], 1174 (Nov. 12, 1966; Chen Yi at the meeting; before it, with Zhou, Soong Ching-ling, Dong Biwu, Tao Zhu and He Xiangning 何香凝, he receives some of the foreign friends, Hong Kong and Macao people and overseas Chinese attending); [[w.liu-jixian-ye-jianying-nianpu]], II, 948 (Nov. 12, 1966; Ye Jianying 叶剑英 at the capital''s meeting for the centenary of Sun Yat-sen''s 孙中山 birth); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Nov. 12, 1966; Zhu De 朱德 at the meeting of the capital marking the centenary of Sun Yat-sen''s 孙中山 birth). Check: Liu''s chronology (II, 652) has Liu attend, after Zhou''s advice of Nov. 8 that he and Deng might ask leave ([[cal.1966-11-08.china-leadership-2]]). Names: Zhou Enlai, Sun Yat-sen.'
