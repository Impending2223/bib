    c: 'Clean Water Restoration Act signed, [80 Stat. 1246](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1246.pdf), Muskie''s bill: sewage-treatment grants authorized at $450 million for fiscal 1968, rising to $1.25 billion for 1971, $3.4 billion in four years; a study of the Nation''s estuaries.'
    n: 'Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill, [1966 Pub. Papers 1309](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=683) (Nov. 3, 1966). [[w.bernstein-guns-or-butter]], 286 (after Johnson considered a veto). To check: [[w.milazzo-unlikely-environmentalists]]. See [[cal.1965-10-02.conservation]]. Names: Muskie.'
