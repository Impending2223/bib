    c: 'Tiananmen. Mao receives over two million Red Guards and revolutionary teachers and students from 10:10 a.m. for more than seven hours, the sixth reception. On the tower he asks Liu Shaoqi about Wang Guangmei and the children. Liu: now that the Revolution is up, I will go to the masses too. Mao: you are old; do not.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 3, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 85 (Nov. 3, 1966; Zhou with Mao at the sixth reception on Tiananmen); [[w.macfarquhar-maos-last-revolution]], 110 (the sixth rally, Nov. 3); [[w.deng-xiaoping-nianpu-1904]], III, 1934 (Nov. 3, 1966; Deng takes part in Mao''s sixth reception of more than two million teachers and students and Red Guards from all over the country); [[w.chen-yi-nianpu]], 1172 (Nov. 3, 1966, morning; Chen Yi with Lin Biao, Zhou and others on the Tiananmen tower accompanying Mao at the sixth reception); [[w.liu-jixian-ye-jianying-nianpu]], II, 948 (Nov. 3, 1966; Ye Jianying 叶剑英 with Mao on the Tiananmen 天安门 gate tower, the sixth reception); [[w.chen-yun-nianpu-xiuding]], III, 158 (Chen Yun at the sixth reception); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Nov. 3, 1966; Zhu De 朱德 in Tiananmen Square 天安门广场 at Mao Zedong''s 毛泽东 sixth reception of the Red Guards 红卫兵, teachers and students from all over the country). To check: [[w.hui-hongweibing-mi-lu]], 393 (cited by [[w.macfarquhar-maos-last-revolution]], 110 n.40). Names: Mao Zedong, Liu Shaoqi, Wang Guangmei. Check: the talk with Liu, from the nianpu alone.'
