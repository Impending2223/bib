  - id: cal.1966-11-03.vietnam-operations
    when: Nov. 3
    date: '1966-11-03'
    thread: vietnam-operations
    c: 'Attleboro. North from the cache sites near Dầu Tiếng toward the Ba Hao stream, the 196th Brigade''s battalions run into the Viet Cong 9th Division, whose own offensive was to open that day: the operation grows into a battle of the 25th and 1st Divisions, eighteen American and three South Vietnamese battalions, some 22,000 troops in all. The 1st Division''s heaviest fighting Nov. 8.'
    n: '[[w.macgarrigle-united-states-army-in]], 37–56; [[w.cosmas-joint-chiefs-of-staff-2012]], 451 (the 9th Division met; 21 battalions). See [[cal.1966-09-14.vietnam-operations]].'
