  - id: cal.1966-11-01.elections-1966
    when: Nov. 1
    date: '1966-11-01'
    place: anchorage
    thread: elections-1966
    follows:
      - cal.1966-11-01.vietnam-asian-trip
    c: 'Anchorage, the Westward Hotel, the night before Washington. Johnson to aides and secretaries: "FDR passed five major bills the first one hundred days. We passed 200 in the last two years"; signings in the East Room, the Cabinet Room, the Fish Room. The tour dropped; Brown and Douglas left to fill their schedules.'
    n: '[[w.califano-triumph-and-tragedy-of]], 151–52; [[w.dallek-flawed-giant]], 339 (in an Anchorage hotel room the evening before he returned from Asia, to aides: "FDR passed five major bills the first one hundred days. We passed 200 in the last two years"; the campaign trip canceled at the last minute; not the hotel''s name, the secretaries or the signings). Names: Johnson, Brown, Douglas.'
    src:
      c: 84d335e6
      rows:
