    when: Nov. 2
    date: '1966-11-02'
    thread: vietnam-asian-trip
    c: Air Force One home from Anchorage through a storm. Symington, aboard, sings a reprise of the trip. By McPherson's account.
    n: '[[w.mcpherson-political-education]], 315; [[w.johnson-vantage-point]], 363 (home by way of Alaska; Dulles in the rain, the night of Nov. 2). Check: the day; the book gives the flight after the President''s speech in Anchorage. See [[cal.1966-11-01.elections-1966]]. Names: Symington, McPherson.'
