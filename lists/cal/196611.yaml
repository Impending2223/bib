    c: 'Thirty-five governors elected: Republicans 23, Democrats 12.{1} Republicans took ten States, Democrats two.{2} Reagan (R) over Governor Brown in California;{3} Rockefeller (R) re-elected in New York;{4} Winthrop Rockefeller (R) in Arkansas and Kirk (R) in Florida, each State''s first Republican governor since Reconstruction; Agnew (R) over Mahoney in Maryland; Lurleen Wallace (D) in Alabama. Georgia: no majority; to the legislature.{5} Governorships after the election: 25 each.{6}'
    n: '[Wikipedia, "1966 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1966_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.dallek-flawed-giant]], 339 (eight governorships to the Republicans, a 25 to 25 split of the States); [[w.hess-republican-establishment]], 2, 5 (of the fifteen Republican governorships at stake the party held all but two, Maine and Kansas, and took ten from the Democrats; Rockefeller winning a third term; the Republicans holding "half of the statehouses"); [[w.hess-republican-establishment]], 3–5 (Agnew, Governor-elect of Maryland; Florida''s first Republican governorship since Reconstruction; Reagan returning the California capitol to the party; Republican governors up from 17 to 25; not Brown, Mahoney, Arkansas, Alabama or Georgia). To check: [[w.sabato-goodbye-to-good-time]]. See [[cal.1966-11-08.elections-1966]]. Names: Brown, Reagan, Nelson Rockefeller, Winthrop Rockefeller, Kirk, Agnew, Mahoney, Lurleen Wallace.'
