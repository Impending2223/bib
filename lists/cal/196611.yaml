    c: 'News conference.{1} Asked of Nixon''s statement of Nov. 3, that the Manila communiqué''s terms for withdrawal would leave South Vietnam to the Viet Cong: "I do not want to get into a debate on a foreign policy meeting in Manila with a chronic campaigner like Mr. Nixon."{2} His habit to find fault with his government "during a period of October every 2 years."{3} On the House, now 295–140: a loss of 40 or 50 seats, the average since 1890, would not stop the program.{4}'
