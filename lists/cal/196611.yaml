    place: chongqing
    thread: china-leadership
    c: Chongqing 重慶. The petition corps, back from Peking, where it joined Mao's sixth review of Nov. 3, formally founds the "Workers' Rebel Army Headquarters" 工人造反軍總部, soon the city's largest workers' rebel body.
