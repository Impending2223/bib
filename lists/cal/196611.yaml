    date: 1966-11
    at: after 1966-11-10
    place: peking
    thread: china-leadership
    c: 'Several hundred Wuhan workers board trains for Peking 北京 to complain of the Hubei committee; at Zhongnanhai''s 中南海 west gate, under the Workers'' Headquarters'' banner, they put up slogans against Chen Boda''s 陳伯達 telegram to the Shanghai workers at Anting ("the small reason must yield to the great"): "is revolution the great reason, or production?"'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 468. To check: Xu Zhengquan 徐正全, 〈雪地足跡〉, *Zuotian* 《昨天》, 2012, no. 7 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 468 n.18). See [[cal.1966-11-09.china-leadership-6]]. Names: Chen Boda.'
