    n: 'Ark., [*Historical Report of the Secretary of State* (2018), 390](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=399). Votes: CQ Guide 6th (2010) 1277. See [[cal.1961-04-04.states-and-cities]]. Names: Pryor, Harris.'
