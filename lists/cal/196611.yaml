  - id: cal.1966-11-30.china-leadership-5
    when: Nov. 30
    date: '1966-11-30'
    place: peking
    thread: china-leadership
    follows:
      - cal.1966-11-30.china-leadership-3
    c: 'At the meeting of workers come to Peking 北京 from the provinces, at the Workers'' Gymnasium 工人体育馆, Chen Yi 陈毅 calls on them to go home quickly: "grasp revolution, promote production," the Center''s and the Premier''s instruction; of the twenty or thirty thousand most should go back, leaving a few representatives; workers and peasants cannot stop work like students; "this is no plot, it is an open plan."'
    n: '[[w.chen-yi-nianpu]], 1176–1177. The words: 晚上 (1176–1177). Names: Chen Yi.'
