    date: '1966-11-06'
    thread: transportation
    c: 'News conference at Fredericksburg, Tex. Boyd, Under Secretary of Commerce for Transportation, to be the first Secretary of Transportation, his nomination to go to the Senate in January. The department: 31 agencies and bureaus, nearly 100,000 employees, almost $6 billion.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1183) (Nov. 6, 1966). See [[cal.1966-03-02.transportation]]. Names: Boyd.'
