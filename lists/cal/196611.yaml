  - id: cal.1966-11-03.school-aid
    when: Nov. 3
    date: '1966-11-03'
    time: 1966-11-03T17:03Z
    thread: school-aid
    also: [health]
    c: 'Four bills signed in the East Room, the morning after the trip: the Elementary and Secondary Education Amendments, [80 Stat. 1191](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1191.pdf), with a new title for the education of handicapped children; the Higher Education Amendments, [80 Stat. 1240](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1240.pdf); the Comprehensive Health Planning and Public Health Service Amendments, [80 Stat. 1180](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1180-2.pdf), grants to the States for health planning and services in place of grants disease by disease (Check); the Allied Health Professions Personnel Training Act, [80 Stat. 1222](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1222.pdf).'
    n: 'Remarks Upon Signing Bills Relating to Health and Education, [1966 Pub. Papers 1307](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=681) (Nov. 3, 1966). [[w.zelizer-fierce-urgency-of-now]], 256 (three ceremonies, eight bills, the education act''s $6.1 billion; the turquoise backdrop for color television); [[w.graham-uncertain-triumph]], 129–30 (the school amendments, $6.1 billion for two years, the handicapped; the college amendments, $3.6 billion for three). To check: *New York Times*, Nov. 4, 1966 (cited by [[w.graham-uncertain-triumph]], 129 n.37). See [[cal.1965-04-11.school-aid]]; [[cal.1965-11-08.school-aid]].'
    src:
