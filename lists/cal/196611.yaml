  - id: cal.1966-11-02.laos
    when: Nov. 2
    date: '1966-11-02'
    thread: laos
    c: 'An A-26 working with a roadwatch team near Route 65, eight miles east of Samneua: fourteen vehicles destroyed with the A-1s called in. Bango/Whiplash ended Nov. 1, Momyer having told the Udorn conference of Oct. 25 that diverted Rolling Thunder sorties would serve.'
    n: '[[w.anthony-war-in-northern-laos]], 211. To check: 7th AF to COMUSMACV, 020900Z Nov. 66 (cited by [[w.anthony-war-in-northern-laos]], 211 n.66); Dep Comdr, 7th AF/13th AF, to 7th AF, 031555Z Nov. 66 (cited by [[w.anthony-war-in-northern-laos]], 211 n.68a); 7th AF to CINCPAC, 150900Z Nov. 66 (cited by [[w.anthony-war-in-northern-laos]], 211 n.68b). See [[cal.1966-10-10.laos]]. Names: Momyer.'
    src:
