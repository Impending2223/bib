list: cal
section: LXXXV
entries:
  - id: cal.1966-11-01.vietnam
    when: Nov. 1–2
    date: '1966-11-01'
    thread: vietnam-asian-trip
    also: [korea]
    c: 'Seoul, from Oct. 31. Johnson and Park, Nov. 1; Johnson to the National Assembly, and their joint statement, Nov. 2. To Anchorage the same day, across the date line: the Fish Protein Concentrate Act signed there. At Dulles that night, the trip''s end: 31,500 miles, seven nations, seventeen days.'
    n: 'Joint Statement Following Discussions With President Park of Korea, [1966 Pub. Papers 1293](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=667); Remarks Before the Korean National Assembly, Seoul, Korea, [1966 Pub. Papers 1290](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=664); Remarks at Dulles International Airport Upon Returning From the Asian-Pacific Trip, [1966 Pub. Papers 1302](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=676) (Nov. 2, 1966). Remarks Upon Signing Bills Relating to Health and Education, [1966 Pub. Papers 1307](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=681) (Nov. 3, 1966) (the mileage). FRUS 1964–68, XXIX, pt. 1, doc. [96](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d96). See [[cal.1966-10-17.vietnam]]. Names: Johnson, Park Chung Hee.'
    tags: [name:johnson-lyndon-b, name:park-chung-hee]
  - id: cal.1966-11-01.vietnam-congress
    when: Nov. 1
    date: '1966-11-01'
    thread: vietnam-congress
    c: 'Church to Goldberg, privately: try a cease-fire, its "serious practical disadvantages" notwithstanding, for "the alternative of a stalemated war of attrition makes it imperative." The elections will prove little, leaving the President "much more room for maneuver."'
    n: '[[w.gibbons-u-s-government-and]], IV, 447. Drafted, it seems, by Norvill Jones of the Foreign Relations staff. To check: Church to Goldberg, Nov. 1, 1966, National Archives, RG 46, Papers of the Senate Foreign Relations Committee (cited by [[w.gibbons-u-s-government-and]], IV, 447 n.33). Names: Church, Goldberg.'
    src:
      c: fe99e650
      rows:
        - 'w.gibbons-u-s-government-and IV, 447: all'
        - 'via w.gibbons-u-s-government-and IV, 447 n.33: all'
    tags: [name:church-frank, name:goldberg-arthur-j]
  - id: cal.1966-11-02.cuba
    when: Nov. 2
    date: '1966-11-02'
    thread: cuba
    also: [immigration]
    c: 'Cuban Adjustment Act signed, [80 Stat. 1161](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1161.pdf): a native or citizen of Cuba admitted or paroled since Jan. 1, 1959, and present two years may be made a permanent resident, at the Attorney General''s discretion, his residence dated from thirty months before. Nov. 10, Johnson waives the $25 fee: some 123,000 eligible, about 4,000 more a month.'
    n: 'Statement by the President Upon Directing the Waiver of Permanent Resident Application Fees for Cuban Refugees, [1966 Pub. Papers 1364](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=738) (Nov. 10, 1966). To check: [[w.garcia-havana-usa]]; [[w.masud-piloto-from-welcomed-exiles-to]]. See [[cal.1965-11-06.cuba]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-02.vietnam
    when: Nov. 2
    date: '1966-11-02'
    thread: vietnam
    c: 'Ginsburgh of the NSC staff to Rostow, on McNamara''s report, "exceedingly and excessively pessimistic": the war can be won in 12 to 24 months. "I think this memo puts me farther out on a limb than anyone else has gone in writing."'
    n: '[FRUS 1964–68, IV, doc. 288](https://history.state.gov/historicaldocuments/frus1964-68v04/d288). [[w.gibbons-u-s-government-and]], IV, 462. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-10-14.vietnam]]. Names: Rostow, McNamara.'
    src:
      c: af7559cc
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d288: A'
        - 'w.gibbons-u-s-government-and IV, 462: B'
        - 'via w.gibbons-u-s-government-and IV, 462 n.72: all'
    tags: [name:rostow-walt-w, name:mcnamara-robert-s]
  - id: cal.1966-11-03.cities-and-housing
    when: Nov. 3
    date: '1966-11-03'
    thread: cities-and-housing
    c: 'Demonstration Cities and Metropolitan Development Act signed in the East Room, with the clean water act, [80 Stat. 1255](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1255.pdf): grants for comprehensive city demonstration programs, $12 million a year for planning in fiscal 1967 and 1968, then $400 million for 1968 and $500 million for 1969; grants and guarantees for metropolitan planning and new communities. Weaver and Wood to run it.'
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill, [1966 Pub. Papers 1309](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=683) (Nov. 3, 1966). See [[cal.1966-01-26.cities-and-housing]]. Names: Weaver, Wood.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c, name:wood-robert-c]
  - id: cal.1966-11-03.conservation
    when: Nov. 3
    date: '1966-11-03'
    thread: conservation
    c: 'Clean Water Restoration Act signed, [80 Stat. 1246](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1246.pdf), Muskie''s bill: sewage-treatment grants authorized at $450 million for fiscal 1968, rising to $1.25 billion for 1971, $3.4 billion in four years; a study of the Nation''s estuaries.'
    n: 'Remarks Upon Signing the Demonstration Cities Bill and the Clean Water Restoration Bill, [1966 Pub. Papers 1309](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=683) (Nov. 3, 1966). To check: [[w.milazzo-unlikely-environmentalists]]. See [[cal.1965-10-02.conservation]]. Names: Muskie.'
    tags: [name:johnson-lyndon-b, name:muskie-edmund-s]
  - id: cal.1966-11-03.school-aid
    when: Nov. 3
    date: '1966-11-03'
    thread: school-aid
    also: [health]
    c: 'Four bills signed in the East Room, the morning after the trip: the Elementary and Secondary Education Amendments, [80 Stat. 1191](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1191.pdf), with a new title for the education of handicapped children; the Higher Education Amendments, [80 Stat. 1240](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1240.pdf); the Comprehensive Health Planning and Public Health Service Amendments, [80 Stat. 1180](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1180-2.pdf), grants to the States for health planning and services in place of grants disease by disease (Check); the Allied Health Professions Personnel Training Act, [80 Stat. 1222](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1222.pdf).'
    n: 'Remarks Upon Signing Bills Relating to Health and Education, [1966 Pub. Papers 1307](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=681) (Nov. 3, 1966). To check: [[w.graham-uncertain-triumph]]. See [[cal.1965-04-11.school-aid]]; [[cal.1965-11-08.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-11-03.program
    when: Nov. 3
    date: '1966-11-03'
    thread: program
    c: 'Fair Packaging and Labeling Act signed in the East Room, [80 Stat. 1296](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1296.pdf), Hart''s bill: a package''s net contents stated in a uniform place on its principal display panel; HEW to write the rules for foods, drugs and cosmetics, the Federal Trade Commission for other goods; voluntary standards against needless package sizes (Check). With it the Child Protection Act, [80 Stat. 1303](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1303.pdf): hazardous toys and children''s articles banned from interstate commerce.'
    n: 'Remarks at the Signing of the Truth-in-Packaging and Child Protection Bills, [1966 Pub. Papers 1314](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=688) (Nov. 3, 1966). To check: [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Hart.'
    tags: [name:johnson-lyndon-b, name:hart-philip-a]
  - id: cal.1966-11-03.succession
    when: Nov. 3
    date: '1966-11-03'
    thread: succession
    c: 'News conference. Johnson announces an operation, on his doctors'' advice: a bulge at the scar of last year''s gall bladder operation to be repaired, a polyp removed from his throat. Burkley: no sign of a serious problem.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1179) (Nov. 3, 1966). To check: [[w.gilbert-mortal-presidency]]. See [[cal.1965-10-08.succession]]. Names: Johnson, Burkley.'
    tags: [name:johnson-lyndon-b, name:burkley-george-g]
  - id: cal.1966-11-03.middle-east-iran-oil
    when: Nov. 3
    date: '1966-11-03'
    thread: middle-east-iran-oil
    c: State and the Foreign Office on a common front on Iran and the consortium.
    n: '[FRUS 1964–68, XXXIV, doc. 193](https://history.state.gov/historicaldocuments/frus1964-68v34/d193). See [[cal.1966-10-25.middle-east]].'
  - id: cal.1966-11-03.vietnam-operations
    when: Nov. 3
    date: '1966-11-03'
    thread: vietnam-operations
    c: 'Attleboro. North from the cache sites near Dầu Tiếng toward the Ba Hao stream, the 196th Brigade''s battalions run into the Viet Cong 9th Division, whose own offensive was to open that day: the operation grows into a battle of the 25th and 1st Divisions, eighteen American and three South Vietnamese battalions, some 22,000 troops in all. The 1st Division''s heaviest fighting Nov. 8.'
    n: '[[w.macgarrigle-united-states-army-in]], 37–56; [[w.cosmas-joint-chiefs-of-staff-2012]], 451 (the 9th Division met; 21 battalions). See [[cal.1966-09-14.vietnam-operations]].'
    src:
      c: 9e55bcb0
      rows:
        - 'w.macgarrigle-united-states-army-in 37–56: all'
        - 'w.cosmas-joint-chiefs-of-staff-2012 451: A-B'
    tags: [place:tay-ninh]
  - id: cal.1966-11-03.vietnam-congress
    when: Nov. 3
    date: '1966-11-03'
    thread: vietnam-congress
    c: 'Johnson gives Fulbright an hour''s private briefing on Manila, after Fulbright had come with Humphrey to meet him at Dulles on his return; Rusk to go on with it at lunch. Johnson''s letter after: "Let me have your suggestions from time to time." Fulbright then praises the conference''s results.'
    n: '[[w.gibbons-u-s-government-and]], IV, 446 (Stone''s account of the airport and the statement). To check: I. F. Stone, *In a Time of Torment* (1967), 346–47; Johnson to Fulbright, Nov. 4, 1966 (LBJ Library, Ex FO 6-3). See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Johnson, Fulbright, Humphrey, Rusk.'
    src:
      c: a8b98325
      rows:
        - 'w.gibbons-u-s-government-and IV, 446: all'
        - 'via w.gibbons-u-s-government-and IV, 446 n.29: C'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:humphrey-hubert-h, name:rusk-dean]
  - id: cal.1966-11-03.elections-1966
    when: Nov. 3
    date: '1966-11-03'
    thread: elections-1966
    also: [vietnam-johnson-asia, republican-party]
    c: 'Nixon''s statement on the Manila communiqué, given the press in New York: mutual withdrawal would "leave the fate of South Vietnam to the Vietcong and the South Vietnamese Army"; tying withdrawal to the level of fighting, "we have offered to surrender a decisive military advantage." Printed in full by the *New York Times*.'
    n: '[[w.nixon-rn]], 274. To check: Nixon''s statement, Nov. 3, 1966, as the *New York Times* printed it (quoted by [[w.nixon-rn]], 274). See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Nixon. Check: the *Times*''s day.'
    src:
      c: b1f1734a
      rows:
        - 'w.nixon-rn 274: all'
        - 'via w.nixon-rn 274 n.text: all'
    tags: [name:nixon-richard-m]
  - id: cal.1966-11-04.elections-1966
    when: Nov. 4
    date: '1966-11-04'
    thread: elections-1966
    also: [vietnam]
    c: 'News conference. Asked of Nixon''s statement of Nov. 3, that the Manila communiqué''s terms for withdrawal would leave South Vietnam to the Viet Cong: "I do not want to get into a debate on a foreign policy meeting in Manila with a chronic campaigner like Mr. Nixon." His habit to find fault with his government "during a period of October every 2 years." On the House, now 295–140: a loss of 40 or 50 seats, the average since 1890, would not stop the program.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1180) (Nov. 4, 1966). [[w.johns-vietnams-second-front]], 126 (Nixon''s charge; the answer, "chronic campaigner," "October every two years"); [[w.nixon-rn]], 274–75 (the question on Nixon''s statement; the answer). [[w.hess-republican-establishment]], 195–97 ("a chronic campaigner"; Nixon''s answer on time the party bought). To check: [[w.perlstein-nixonland-2008]]; [[w.witcover-resurrection-of-richard-nixon]]; Nixon to Eisenhower, Oct. 4, 1966, and Nixon''s newspaper column, Oct. 16, 1966, Special Names Series, box 14, Eisenhower Post-Presidential Papers, Eisenhower Library; press release, Nov. 4, 1966, Press Secretary File, box D55, Ford Congressional Papers, Ford Library (cited by [[w.johns-vietnams-second-front]], 126 n.24); *New York Times*, Nov. 5, 1966 (cited by [[w.johns-vietnams-second-front]], 126 n.26). See [[cal.1966-10-17.vietnam]]. Names: Nixon, Johnson.'
    src:
      c: a96d89b3
      rows:
        - 'https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1180: all'
