    thread: china-leadership
    c: 'Lin Biao 林彪, after Jiang Qing''s last visit, reports to Mao at once: Xu Xiangqian 徐向前 may head the All-Army Cultural Revolution Group, the Commission''s daily work to stay with Ye Jianying 葉劍英.'
