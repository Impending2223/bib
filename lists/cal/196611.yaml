    date: '1966-11-01'
    place: peking
    thread: china-leadership
    also: [china]
    c: 'The *Hongqi* editorial "Victory for the Proletarian Revolutionary Line Represented by Chairman Mao": leading Party members treat the masses as ignorant and incapable, turn the spearhead on them, brand them "anti-party elements" and "rightists"; the work teams'' dossiers to be destroyed and their verdicts overturned.'
    n: '[[w.dikotter-cultural-revolution]], 118, 122 n.8, n.17. To check: "Yi Mao zhuxi daibiao de wuchanjieji geming luxian de shengli," *Hongqi*, no. 14, Nov. 1, 1966, 1–3 (cited by [[w.dikotter-cultural-revolution]], 118 n.8); the same (cited by [[w.dikotter-cultural-revolution]], 122 n.17a). Names: Mao Zedong.'
