    c: 'Nie Yuanzi, of the Peking University wall poster: "Five months ago today" Mao, making it known to the whole country and the world, "lit the blazing fire of the Great Proletarian Cultural Revolution!"'
    n: '[[w.macfarquhar-maos-last-revolution]], 58 (the words printed in *Xin Beida*, no. 20, Nov. 5, 1966: 58 n.39). To check: Xin Beida (New Peking University), no. 20 (Nov. 5, 1966) (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.39). See [[cal.1966-06-01.china-leadership]]. Names: Mao Zedong, Nie Yuanzi.'
