    c: 'Tiananmen. Mao receives over two million Red Guards and revolutionary teachers and students, the seventh reception: Nov. 10 from 10 a.m. for six hours (to those Center and other leaders on the tower: "put politics in command, go among the masses");{1} Nov. 11 from 2:30 p.m., in an open car along Chang''an Avenue.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 10, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 87 (Nov. 10–11, 1966; Zhou with Mao at the seventh reception, two million out-of-town teachers, students and Red Guards); [[w.macfarquhar-maos-last-revolution]], 110 (the seventh rally, Nov. 10–11); [[w.jianguo-yilai-mao-zedong]], XVIII, 391 (Nov. 10, 1966; his words on the Tiananmen rostrum to some Center and other leaders, printed from *Renmin ribao*, Nov. 12, 1966; note 1: more than two million received Nov. 10 and 11; neither the hours nor the reception''s number given); [[w.deng-xiaoping-nianpu-1904]], III, 1934 (Nov. 10–11, 1966; Deng takes part in Mao Zedong''s 毛泽东 seventh reception, on the 10th and 11th, of over two million teachers and students and Red Guards from all over the country); [[w.yang-jisheng-tiandi-fanfu]], I, 243 (Nov. 10, for the Red Guards to ride past the Tiananmen with Mao reviewing from the tower, more than 6,000 trucks are needed, a thousand each drawn overnight from the forces of sea, land and air and from the Shenyang, Peking and Jinan military regions; some count Nov. 10 and 11 as one reception); [[w.chen-yi-nianpu]], 1173 (Nov. 10, 1966, 10 a.m., and Nov. 11, 3 p.m.; Chen Yi with Lin Biao, Zhou and others on the Tiananmen tower at the seventh reception, two million); [[w.liu-jixian-ye-jianying-nianpu]], II, 948 (Nov. 10–11, 1966; Ye Jianying 叶剑英 with Mao at the seventh reception, two million); [[w.zhu-de-nianpu-xinbian]], III, 1958 (Nov. 10–11, 1966; Zhu De 朱德 in Tiananmen Square 天安门广场 at Mao Zedong''s 毛泽东 seventh reception of more than two million Red Guards 红卫兵, teachers and students from all over the country). To check: [[w.hui-hongweibing-mi-lu]], 393 (cited by [[w.macfarquhar-maos-last-revolution]], 110 n.40). Names: Mao Zedong.'
