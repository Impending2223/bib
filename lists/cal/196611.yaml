  - id: cal.1966-11-03.program
    when: Nov. 3
    date: '1966-11-03'
    time: 1966-11-03T22:45Z
    thread: program
    c: 'Fair Packaging and Labeling Act signed in the East Room, [80 Stat. 1296](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1296.pdf), Hart''s bill: a package''s net contents stated in a uniform place on its principal display panel; HEW to write the rules for foods, drugs and cosmetics, the Federal Trade Commission for other goods; voluntary standards against needless package sizes (Check). With it the Child Protection Act, [80 Stat. 1303](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1303.pdf): hazardous toys and children''s articles banned from interstate commerce.'
    n: 'Remarks at the Signing of the Truth-in-Packaging and Child Protection Bills, [1966 Pub. Papers 1314](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=688) (Nov. 3, 1966). To check: [[w.peterson-restless]]. See [[cal.1964-02-05.program]]. Names: Hart.'
    tags: [name:johnson-lyndon-b, name:hart-philip-a]
    short: Fair Packaging
  - id: cal.1966-11-03.succession
    when: Nov. 3
    date: '1966-11-03'
    time: 1966-11-03T20:30Z
    thread: succession
    c: 'News conference. Johnson announces an operation, on his doctors'' advice: a bulge at the scar of last year''s gall bladder operation to be repaired, a polyp removed from his throat. Burkley: no sign of a serious problem.'
    n: 'The President''s News Conference of November 3, 1966, [1966 Pub. Papers 1310](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=684) (Nov. 3, 1966). To check: [[w.gilbert-mortal-presidency]]. See [[cal.1965-10-08.succession]]. Names: Johnson, Burkley.'
    tags: [name:johnson-lyndon-b, name:burkley-george-g]
