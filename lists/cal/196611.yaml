        - 'w.hess-republican-establishment 195–97: A'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1966-11-04.opinion
    when: Nov. 4
    date: '1966-11-04'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, special survey, a secret ballot for the candidate or party one would like to see win: Democratic 52 percent, Republican 48. Midwest: Republican 55, Democratic 45.'
    n: '[[w.gallup-poll]], III, 2035.'
  - id: cal.1966-11-04.middle-east-iran-oil
    when: Nov. 4
    date: '1966-11-04'
    thread: middle-east-iran-oil
    c: 'The five American members of the consortium to Hare and Solomon: Iran''s demands, oil at cost and proven fields given up, all unacceptable; Iran and the consortium "on collision course."'
    n: '[FRUS 1964–68, XXXIV, doc. 194](https://history.state.gov/historicaldocuments/frus1964-68v34/d194). See [[cal.1966-10-25.middle-east]]. Names: Hare.'
    tags: [name:hare-raymond-a]
  - id: cal.1966-11-04.elections-1966-2
    when: Nov. 4
    date: '1966-11-04'
    thread: elections-1966
    also: [republican-party]
    c: 'Waterville, Me. Nixon, asked of Johnson''s attack: "let''s disagree as gentlemen"; "We need a bipartisan program for Vietnam in which both participate, rather than just a one-party program."'
    n: '[[w.nixon-rn]], 275–76. See [[cal.1966-11-04.elections-1966]]. Names: Nixon, Johnson.'
    src:
      c: 215d93cb
      rows:
        - 'w.nixon-rn 275–76: all'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b]
  - id: cal.1966-11-04.vietnam-force-levels
    when: Nov. 4
    date: '1966-11-04'
    thread: vietnam-force-levels
    c: 'The Joint Chiefs to McNamara, JCSM-702-66, Program Four: 504,000 Americans by the end of 1967, 522,000 by June 1968, 564,000 by the end of 1968, the barrier''s forces apart; the expanded concept "should be carried out in its entirety," mining the ports, a naval quarantine, raids into Cambodia and Laos.'
    n: '[[w.gibbons-u-s-government-and]], IV, 463–64. To check: JCSM-702-66, Nov. 4, 1966, summarized in Pentagon Papers, Gravel ed., IV, 361–62 (cited by [[w.gibbons-u-s-government-and]], IV, 463 n.77). See [[cal.1966-10-20.vietnam-force-levels]]. Names: McNamara.'
