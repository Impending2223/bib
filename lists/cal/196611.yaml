  - id: cal.1966-11-01.china
    when: Nov. 1
    date: '1966-11-01'
    thread: china
    also: [soviet-union]
    c: Foreign Ministry reply to the Soviet embassy, rejecting the Soviet note of Oct. 27 protesting China's stand and making demands. The Chinese masses in recent days have been very restrained and orderly and have not touched a hair of the Soviet embassy's people, cars or buildings; the chargé and his wife and the staff went out undisturbed, and there is no question of wrecking the embassy's normal work.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 135 (Nov. 1, 1966).'
    src:
      c: 0ebe4e73
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 135: all'
    tags: [polity:prc, polity:ussr]
  - id: cal.1966-11-01.china-leadership-2
    when: Nov. 1
    date: '1966-11-01'
    thread: china-leadership
    also: [china]
    c: '*Renmin ribao wenhua geming dongtai* reports that some staff of the *People''s Daily* claim that Chen Boda, whose work team held sway in its offices during the "fifty days," was a most faithful executor of the "bourgeois reactionary line"; his defenders, among them the senior commentator Wang Ruoshui, say that he worked around "the restrictions imposed by comrade Deng Xiaoping" and resolutely carried out the proletarian revolutionary line of Chairman Mao.'
    n: '[[w.macfarquhar-maos-last-revolution]], 137. To check: Renmin ribao wenhua geming dongtai (People''s Daily Cultural Revolution Trends) (Beijing: Renmin ribao), no. 64, Nov. 1, 1966 (cited by [[w.macfarquhar-maos-last-revolution]], 137 n.14). Names: Chen Boda, Deng Xiaoping, Mao Zedong, Wang Ruoshui. Check: the day of the claims; the issue of the bulletin is Nov. 1.'
    src:
      c: 41f986a5
      rows:
        - 'w.macfarquhar-maos-last-revolution 137: all'
        - 'via w.macfarquhar-maos-last-revolution 137 n.14: all'
    tags: [polity:prc, name:chen-boda, name:deng-xiaoping, name:mao-zedong, vis:only:prc, name:wang-ruoshui]
  - id: cal.1966-11-01.china-leadership-3
    when: Nov. 1
    date: '1966-11-01'
    thread: china-leadership
    c: 'Mao, on the record of his speech of Oct. 25 to the Central Work Conference, which Chen Boda 陈伯达 sent him: "Back to Chen Boda. Let it be so; I changed a few words. Not to be issued for now."'
    n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 378 (Nov. 1, 1966; note 1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]] (1987–98; Check: the volume and year). To check: Record of Mao Zedong''s speech of Oct. 25, 1966 at the Central Work Conference, sent to Mao by Chen Boda (Mao''s revisions and note of Nov. 1) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 378 n.1). See [[cal.1966-10-25.china-leadership]]. Names: Mao Zedong, Chen Boda. Check: whether the notes of the first edition give it.'
    src:
      c: 56f9f392
      rows:
        - 'w.jianguo-yilai-mao-zedong XVIII, 378: all'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 378 n.1: all'
    tags: [polity:prc, name:mao-zedong, name:chen-boda, vis:only:prc]
  - id: cal.1966-11-01.china-leadership-4
    when: Nov. 1
    date: '1966-11-01'
    place: nanjing
    thread: china-leadership
    c: 'Nanjing 南京. The Jiangsu Red Rebel General Headquarters 江蘇省紅色造反總司令部 (Sheng Hongzong 省紅總), Nanjing''s largest "mountain," is founded; its sponsor and core is the Nanjing University Red Rebel Corps 南大紅色造反隊. Chief figures: Wen Fenglai 文鳳來, middle-aged teacher of the politics department, Dai Guoqiang 戴國強 of the Xinhua branch, whom Yao Wenyuan has dismissed as a reporter for joining a local mass body, Kong Fanjie 孔繁潔, and students Shi Wei 施威, Yao Jinqiu 姚金鍬 and Geng Changxian 耿昌賢. The conservative Nanjing Red Guard Headquarters and the Nanjing workers'' Red Guards fall as the bourgeois line is criticized.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 320. Made public: 2011. Names: Yao Wenyuan.'
    src:
      c: b76d0556
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 320: all'
    tags: [polity:prc, name:yao-wenyuan]
  - id: cal.1966-11-01.china-leadership-5
    when: Nov. 1
    date: '1966-11-01'
    thread: china-leadership
    also: [africa]
    c: Chen Yi 陈毅 speaks at the reception of Mohamed Cherif Sahli 穆罕默德·萨赫利, Algeria's Ambassador, for the twelfth anniversary of the Algerian revolution; the "seven-nation summit" Johnson called at Manila to force peace by war will fail.
    n: '[[w.chen-yi-nianpu]], 1172. The words: 晚上 (1172). Names: Chen Yi.'
    tags: [polity:prc, polity:algeria, name:chen-yi, ok:fields-place]
