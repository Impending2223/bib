    c: 'Zhou Enlai at the discussion and revision of the draft Provisions on the Cultural Revolution in Mining and Industrial Enterprises. Liu Lanbo, Lü Zhengcao and Lü Dong express anger at Chen Boda''s and the Cultural Revolution Group''s efforts to throw industry and transport into disorder. Zhou: "if we do not go to hell, who will? if we do not enter the tigers lair, who will?" All are to give up personal interest for the Party and state, in the spirit of going into the tigers lair for its cub, and to resolve to enter "hell".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 92 (Nov. 24, 1966, the item after); [[w.jian-zhou-enlai]], 557 (Zhou on the "tide of rebellions": "As we cannot stop it, we may try to channel it"; a "punishment ... created by our own behavior in the past. If we do not bear responsibility for it, who will? If we do not go into hell, who will?"); [[w.teiwes-tragedy-of-lin-biao]], 69 (Zhou, two days after Mao''s decision: one cannot avoid the inferno, there is no escape, one can only ride it out and not be swept away). Made public: 2020. To check: Zhou speech at the conference on political work in industry and transportation of the whole country, November 24, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 557 n.61a); [[w.zhou-enlai-nianpu-1949]], III, 99 (cited by [[w.jian-zhou-enlai]], 557 n.61b); [[w.nianyi-da-dongluande-niandai]], 137–143 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26a); [[w.shinian-houde-pingshuo]], 52–56 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26b); [[w.li-ping-wenhua-dageming-zhongde-zhou-enlai]], 9, 126 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26c); [[w.kau-lin-piao-affair]], 413 (cited by [[w.teiwes-tragedy-of-lin-biao]], 69 n.26d). Names: Zhou Enlai, Liu Lanbo, Lü Zhengcao, Lü Dong, Chen Boda.'
