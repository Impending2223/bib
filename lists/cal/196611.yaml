    c: Saigon, the National Day parade, Westmoreland in the reviewing stand.{1} The Viet Cong fire fourteen rounds from recoilless rifles during it.{2}
    n: '[[w.westmoreland-soldier-reports]], 188; [[w.lich-su-khang-chien-chong-my]], IV, 246–47 (the Command sets guns close to Saigon to fire on the National Day rally; Reuters, Nov. 1: the guests on the stand fled and crawled under it). Names: Westmoreland.'
