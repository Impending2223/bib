  - id: cal.1966-11-30.china-leadership-6
    when: Nov. 30
    date: '1966-11-30'
    thread: china-leadership
    c: 'Ye Jianying 叶剑英 presides at the Military Commission''s 军委 fifty-ninth standing meeting: Zhang Zhenhuan 张震寰 on the missile-nuclear test (the fourth nuclear test) and the tests to come, Tang Yanjie 唐延杰 on building a missile range at a base of the Defense Science and Technology Commission 国防科委; well pleased, it agrees to both. Some experts of the "two bombs" have had their homes raided, against the Party''s policy: apologies and amends to be made, and a forum of the experts held, to be received by Mao Zedong 毛泽东, Lin Biao 林彪 and Zhou Enlai 周恩来.'
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 951–952. Made public: 2007. Names: Ye Jianying, Mao Zedong, Lin Biao, Zhou Enlai, Zhang Zhenhuan.'
