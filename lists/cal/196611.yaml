  - id: cal.1966-11-08.economy
    when: Nov. 8
    date: '1966-11-08'
    thread: economy-investment-credit
    c: 'The investment tax credit on machinery and equipment, and accelerated depreciation on buildings, suspended, [80 Stat. 1508](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1508.pdf): asked Sept. 8 against inflation and tight money; the suspension, set to end Dec. 31, 1967, ended as of Mar. 9, 1967, by the act of June 13, 1967. Johnson''s statement: long-term interest rates down about a quarter point from their summer peaks.'
    n: 'Statement by the President Upon Signing Bill Suspending the Investment Tax Credit and Accelerated Depreciation Allowance, [1966 Pub. Papers 1355](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=729) (Nov. 8, 1966). [[w.zelizer-taxing-america]], 257, 260 (the suspension, its early end). To check: [[w.collins-more]]; [[w.okun-political-economy-of-prosperity]]; House Committee on Ways and Means, President''s Proposal on Suspension of the Investment Credit and Application of Accelerated Depreciation: Hearings, 89th Cong., 2d sess. (1966) (cited by [[w.zelizer-taxing-america]], 257 n.8); Ways and Means, "Press Release: Chairman Wilbur D. Mills ... Releases Committee Decisions Relating to Suspension of the Investment Credit and the Allowance of Accelerated Depreciation," Sept. 23, 1966, National Archives, RG 128, Box 497, File: Ways and Means 1960 (cited by [[w.zelizer-taxing-america]], 257 n.8). See [[cal.1965-12-05.economy]]. Names: Johnson.'
