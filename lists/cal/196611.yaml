  - id: cal.1966-11-22.china-leadership
    when: Nov. 22
    date: '1966-11-22'
    thread: china-leadership
    c: 'Mao hears Zhou Enlai and Li Fuchun on the draft provisions for industry. Four points: the Revolution in mines and factories by stages; the eight-hour day untouched, workers make revolution in spare hours; after revision Gu Mu to take a team to Shanghai, Tianjin and Shenyang and hear every faction, aim to issue in December;{1} the draft''s list of power-holders too wide, drop "forgetting one''s roots, selfish, suppressing the masses."{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 22, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 90–91 (Nov. 22, 1966; Zhou and Li Fuchun report to Mao that Chen Boda and the Cultural Revolution Group object to the Fifteen Articles; Mao''s four points); [[w.macfarquhar-maos-last-revolution]], 143 (the views of the ministers, planning officials and regional representatives are presented to Mao on Nov. 22; he rejects them as unacceptable, and the members of the Group are emboldened); [[w.mao-zedong-zhuan]], VI, ch. 75 n.29 (Nov. 22 Zhou Enlai and Li Fuchun report to Mao; Mao''s points: the cultural revolution in factories and mines to go by stages and in batches; the eight-hour working day not to be invaded, workers to make revolution only in spare time; after the paper is out Gu Mu is to take a team to Shanghai, Tianjin and Shenyang to hear the factions of workers and go on revising, to issue it in December, n.29). [[w.jian-zhou-enlai]], 557 (a second document, written with Zhou''s support: workers to "make revolution in their spare time," no "revolutionary connections" in factories; Mao rejects it at once: a further document to back workers'' right to their own organizations; not the day); [[w.teiwes-tragedy-of-lin-biao]], 68 (Mao rejects the fifteen articles: the workers'' right to form mass organizations to be upheld; Chen Boda''s ten articles, reflecting Mao''s views, then passed by the meeting). Made public: 1990 ([[w.womende-zhou-zongli]], 26, 27, 46, cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.29). Check: the entry has Zhou and Li Fuchun reporting that Chen Boda and the Group object to the Fifteen Articles, and Mao''s four points; the book has Mao reject the views of the ministers, planning officials and regional representatives (143). Check: the day of the report to Mao; Yang Jisheng ([[w.yang-jisheng-tiandi-fanfu]], I, 334–35) has Li Fuchun pass on the same four points by telephone at 10 p.m. on Nov. 21, Zhou and he having already reported to Mao ([[cal.1966-11-21.china-leadership-3]]). To check: [[w.nianyi-da-dongluande-niandai]], 138–139 (cited by [[w.macfarquhar-maos-last-revolution]], 143 n.38); [[w.womende-zhou-zongli]], 26, 27, 46 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.29); [[w.zhou-enlai-nianpu-1949]], III, 92 (cited by [[w.jian-zhou-enlai]], 557 n.57); [[w.shi-yun-zhang-chunqiao-yao-wenyuan-shizhuan]], 351 (cited by [[w.jian-zhou-enlai]], 557 n.58). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Gu Mu.'
