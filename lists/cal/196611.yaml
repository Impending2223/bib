  - id: cal.1966-11-02.vietnam
    when: Nov. 2
    date: '1966-11-02'
    thread: vietnam
    c: 'Ginsburgh of the NSC staff to Rostow, on McNamara''s report, "exceedingly and excessively pessimistic": the war can be won in 12 to 24 months. "I think this memo puts me farther out on a limb than anyone else has gone in writing."'
    n: '[FRUS 1964–68, IV, doc. 288](https://history.state.gov/historicaldocuments/frus1964-68v04/d288). [[w.gibbons-u-s-government-and]], IV, 462. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-10-14.vietnam]]. Names: Rostow, McNamara.'
