  - id: cal.1966-11-02.korea
    when: Nov. 2
    date: '1966-11-02'
    thread: korea
    c: North Korean soldiers cross the DMZ and ambush an American patrol; six Americans killed.
    n: '[[w.poole-joint-chiefs-of-staff-2012]], 235. South Korean raids northward went on; in one, about twenty killed on each side (235). Early in November ten UH-1Ds meant for Vietnam diverted to Korea (236).'
    src:
      c: e051c8dd
      rows:
        - 'w.poole-joint-chiefs-of-staff-2012 235: all'
