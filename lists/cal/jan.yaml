  - id: cal.1961-01-20.transition-and-staff
    when: Jan. 20
    date: '1961-01-20'
    thread: transition-and-staff
    c: 'Inauguration. The cabinet confirmed and sworn in over two days: Rusk, Dillon, McNamara, Robert Kennedy, Day, Udall, Freeman, Hodges, Goldberg, Ribicoff. Stevenson to the UN. McGovern to Food for Peace.'
    n: '[Inaugural Address](https://www.presidency.ucsb.edu/documents/inaugural-address-2). [Cong. Rec., Senate, Jan. 21, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-14-1.pdf). [Remarks at the Swearing-In Ceremonies for the Members of the Cabinet](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-ceremonies-for-the-members-the-cabinet) (Jan. 21, 1961). Thurston Clarke, *Ask Not: The Inauguration of John F. Kennedy and the Speech That Changed America* (2004). *Preparing to Be President: The Memos of Richard E. Neustadt* (Charles O. Jones ed., 2000). Sorensen, *Kennedy*, and Schlesinger, *A Thousand Days* (K–J Adm. II.G.2). Reeves, *President Kennedy* (K–J Adm. II.A), begins here and runs day by day. Recording: inaugural (K–J Adm. II.I). Names: K–J Adm. III.B, III.E–III.I.'
    tags: [executive:1961-01-20, name:kennedy-john-f, name:johnson-lyndon-b, name:rusk-dean, name:dillon-c-douglas, name:mcnamara-robert-s, name:kennedy-robert-f, name:day-j-edward, name:udall-stewart-l, name:freeman-orville-l, name:hodges-luther-h, name:goldberg-arthur-j, name:ribicoff-abraham, name:stevenson-adlai-e, name:mcgovern-george]
