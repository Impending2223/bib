# Cal. III January 20–31, 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: III
entries:
  - id: cal.1961-01-20.transition-and-staff
    when: Jan. 20
    date: '1961-01-20'
    thread: transition-and-staff
    c: 'Inauguration. The cabinet confirmed and sworn in over two days: Rusk, Dillon, McNamara, Robert Kennedy, Day, Udall, Freeman, Hodges, Goldberg, Ribicoff. Stevenson to the UN. McGovern to Food for Peace.'
    n: 'Thurston Clarke, *Ask Not: The Inauguration of John F. Kennedy and the Speech That Changed America* (2004). *Preparing to Be President: The Memos of Richard E. Neustadt* (Charles O. Jones ed., 2000). Sorensen, *Kennedy*, and Schlesinger, *A Thousand Days* (K–J Adm. II.G.2). Reeves, *President Kennedy* (K–J Adm. II.A), begins here and runs day by day. Recording: inaugural (K–J Adm. II.I). Names: K–J Adm. III.B, III.E–III.I.'
  - id: cal.1961-01-23.court
    when: Jan. 23
    date: '1961-01-23'
    thread: court
    c: '*Times Film Corp. v. City of Chicago*, [365 U.S. 43](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365043/usrep365043.pdf). Prior licensing of films upheld, 5–4.'
    n: 'The Court''s 1961 decisions: Schwartz, *Super Chief*; Powe, *Warren Court* (K–J Cong. II.G). Cases: K–J Cong. II.J.1.'
  - id: cal.1961-01-25.press-and-broadcasting
    when: Jan. 25
    date: '1961-01-25'
    thread: press-and-broadcasting
    c: First presidential press conference carried live, from the State Department auditorium. Announces the Soviet release of the two surviving RB-47 fliers.
    n: '*Kennedy and the Press: The News Conferences* (Harold W. Chase & Allen H. Lerman eds., 1965). The film is at the JFK Library (K–J Adm. II.K). Mary Ann Watson, *The Expanding Vista: American Television in the Kennedy Years* (1990).'
  - id: cal.1961-01-28.vietnam
    when: Jan. 28
    date: '1961-01-28'
    thread: vietnam
    c: Kennedy approves the Counterinsurgency Plan for Vietnam after reading Lansdale's report. More aid for a larger South Vietnamese army, tied to reform.
    n: 'FRUS vol. 1. *The Pentagon Papers* (Gravel ed.), vol. 2 (K–J Adm. II.H.3). Novosejt, *"I Made Mistakes"*; Freedman, *Kennedy''s Wars*; Gibbons, pt. 2 (K–J Adm. II.D). The war itself: Viet. II.B.'
  - id: cal.1961-01-29.economy
    when: Jan. 29
    date: '1961-01-29'
    thread: economy
    c: Heller takes office as chairman of the Council of Economic Advisers, with Tobin and Gordon.
    n: 'Heller, *New Dimensions*; Tobin, *National Economic Policy* (K–J Adm. II.B). Heller''s statements and speeches, 1961–63, on FRASER (K–J Adm. II.K). Names: Heller, Tobin, Gordon (K–J Adm. III.H).'
  - id: cal.1961-01-30.program
    when: Jan. 30
    date: '1961-01-30'
    thread: program
    c: First State of the Union. The tide running against the United States in every area of crisis; the economy in recession.
    n: Annual Message to the Congress on the State of the Union (Jan. 30, 1961).
  - id: cal.1961-01-31.rules
    when: Jan. 31
    date: '1961-01-31'
    thread: rules
    c: House enlarges the Rules Committee from twelve to fifteen, [217–212](https://voteview.com/rollcall/RH0870003). Rayburn's last great fight. Smith and Colmer lose their veto.
    n: 'H.R. Res. 127, 87th Cong. Milton C. Cummings Jr. & Robert L. Peabody, *The Decision to Enlarge the Committee on Rules*, in *New Perspectives on the House of Representatives* (K–J Cong. II.A). Robinson, *The House Rules Committee*; Schickler, *Disjointed Pluralism* (K–J Cong. II.A). Hardeman & Bacon, *Rayburn*; Dierenfield, *Keeper of the Rules* (K–J Cong. II.I.2). O''Brien, *No Final Victories* (K–J Adm. II.G.2), for the White House whip count. The vote divided about 195 Democrats and 22 Republicans against 64 Democrats and 148 Republicans. Names: Rayburn, Smith, Colmer, Bolling (K–J Cong. III.C–D); Halleck (Opp. III.C).'
