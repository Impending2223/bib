  - id: cal.1961-01-30.program
    when: Jan. 30
    date: '1961-01-30'
    thread: program
    c: The Address to the Joint Session. The tide running against the United States in every area of crisis; the economy in recession.
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-5) (Jan. 30, 1961). H. Doc. No. 73, 87th Cong.: [107 Cong. Rec. 1427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2).'
    gloss:
      title: Style
      text:
      - 'Art. II, § 3: the President “shall from time to time give to the Congress Information of the State of the Union.” “Annual message” and “State of the Union” are usage.'
      - 'The Houses’ act. Jan. 26, H. Con. Res. 109: the Houses to assemble Jan. 30 “for the purpose of receiving such communications as the President of the United States shall be pleased to make to them” ([107 Cong. Rec. 1262](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-18-1.pdf)). It names no message. The second year, H. Con. Res. 402, the same words, “communication” in the singular ([108 Cong. Rec. 75](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-2.pdf)). The two resolutions do not otherwise differ.'
      - 'The Record’s headings, not ratified by either House. Jan. 30, House: “Joint session of the House and Senate held pursuant to the provisions of House Concurrent Resolution 109 to hear an address by the President of the United States”; the text under “The State of the Union—Address of the President of the United States (H. Doc. No. 73)” ([1427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2)). Senate: it goes “to hear the annual message of the President of the United States”; “Joint session of the two Houses—Annual message of the President of the United States (H. Doc. No. 73)” ([1357](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-1.pdf)). Jan. 11, 1962, House: “State of the Union Message of the President of the United States (H. Doc. No. 251)” ([108 Cong. Rec. 63](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-1.pdf#page=2)). Senate: it goes “to hear the address to be delivered by the President”; “Joint session of the two Houses—Address by the President” ([76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-2.pdf#page=2)).'
      - 'The House’s act, Jan. 30. On McCormack’s motion, agreed to, “that the message of the President be referred to the Committee of the Whole House on the State of the Union and ordered printed” ([1431](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=6)). The same motion for Eisenhower’s of Jan. 12 ([107 Cong. Rec. 649](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-8-1.pdf#page=6)). The committee’s name is its own: the House sitting as a committee. The message of Feb. 2 on economic recovery went to it as well (H. Doc. No. 81, [107 Cong. Rec. 1677](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-3-2.pdf#page=2)).'
      - '*Public Papers*, compiled by the Office of the Federal Register: “Annual Message to the Congress on the State of the Union,” for Eisenhower’s of Jan. 12, for Kennedy’s of Jan. 30, and for Jan. 11, 1962. The text calls itself “this Message”; of Roosevelt’s of 1945, “his final state of the Union message.” It does not otherwise name itself.'
      - 'The second address that month. Eisenhower’s, Jan. 12, in writing, read in the House: “State of the Union—Message from the President of the United States (H. Doc. No. 1)”; “Once again it is my constitutional duty to assess the state of the Union” ([107 Cong. Rec. 644](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-8-1.pdf)). Kennedy’s address eighteen days after. So in 1953: Truman’s in writing, Jan. 7; Eisenhower’s in person, Feb. 2; both “Annual Message” in the *Public Papers*. See [[cal.1961-01-12.program]].'
      - Later usage. From Reagan, 1981, a new President’s first appearance before the Houses is titled an address before a joint session, and is not counted a State of the Union; the outgoing President’s written message keeps the name (Carter, 1981). [APP, “Annual Messages to Congress on the State of the Union”](https://www.presidency.ucsb.edu/documents/presidential-documents-archive-guidebook/annual-messages-congress-the-state-the-union).
      - 'Check: the House and Senate Journals, Jan. 26 and 30, 1961, and Jan. 11, 1962; the title pages of H. Docs. 1, 73 and 251.'
