    when: Oct. 3
    date: '1962-10-03'
    thread: space
    c: Schirra's six orbits.
    n: '[Statement by the President on the Orbital Flight of Astronaut Walter Schirra](https://www.presidency.ucsb.edu/documents/statement-the-president-the-orbital-flight-astronaut-walter-schirra) (Oct. 3, 1962). See [[cal.1961-04-12.space]]. Names: Schirra (K–J Adm. III.F).'
