  - id: cal.1962-10-14.opinion
    when: Oct. 14
    date: '1962-10-14'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Sept. 20–25: on Cuba, bomb or invade, 10 percent; an embargo, 13; something short of war, 26; hands off, 22. American forces into Cuba to overthrow Castro, 24 agree, 63 disagree.'
    n: '[[w.gallup-poll]], III, 1786. Names: Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel]
  - id: cal.1962-10-15.africa
    when: Oct. 15
    date: '1962-10-15'
    thread: africa
    c: Ben Bella, Prime Minister of Algeria since Sept. 26, at the White House. Kennedy on the impression in Algeria that the United States favors nuclear tests, colonialism and imperialism. Algeria's economic needs discussed; no figures, no commitments. Then to Havana.
    n: '[Remarks of Welcome to Prime Minister Ben Bella of Algeria on the South Lawn at the White House](https://www.presidency.ucsb.edu/documents/remarks-welcome-prime-minister-ben-bella-algeria-the-south-lawn-the-white-house); [Joint Statement Following Discussions With Prime Minister Ben Bella](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-ben-bella) (Oct. 15, 1962). FRUS 1961–63, XXI, docs. [71](https://history.state.gov/historicaldocuments/frus1961-63v21/d71), [72](https://history.state.gov/historicaldocuments/frus1961-63v21/d72), [73](https://history.state.gov/historicaldocuments/frus1961-63v21/d73), [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77) (doc. 77: NSAM 211, Dec. 14, on aid to Algeria). [[w.byrne-mecca-of-revolution]]; [[w.rakove-kennedy-johnson-and-the]]; [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1962-07-03.africa]]. Names: Ben Bella (K–J Adm. III.J).'
    tags: [name:ben-bella-ahmed, name:kennedy-john-f]
