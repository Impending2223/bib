    c: Taylor Chairman of the Joint Chiefs. Lemnitzer to NATO.
    n: '[Remarks at the Swearing In of Gen. Maxwell D. Taylor as Chairman of the Joint Chiefs of Staff](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-gen-maxwell-d-taylor-chairman-the-joint-chiefs-staff). [Remarks Upon Presenting the Distinguished Service Medal to Gen. Lyman L. Lemnitzer](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-gen-lyman-l-lemnitzer) (Oct. 1, 1962). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D). See [[cal.1961-06-26.transition-and-staff]]. Names: Taylor, Lemnitzer (K–J Adm. III.F).'
