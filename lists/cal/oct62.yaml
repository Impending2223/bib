    n: '[Statement by the President on the Orbital Flight of Astronaut Walter Schirra](https://www.presidency.ucsb.edu/documents/statement-the-president-the-orbital-flight-astronaut-walter-schirra) (Oct. 3, 1962). See [[cal.1961-04-12.space]].'
  - id: cal.1962-10-10.program
    when: Oct. 10
    date: '1962-10-10'
    thread: program
    c: Drug Amendments signed. Proof of efficacy; informed consent.
    n: '[Pub. L. No. 87-781, 76 Stat. 780](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg780.pdf) (1962). See [[cal.1962-07-15.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-11.trade
    when: Oct. 11
    date: '1962-10-11'
    thread: trade
    c: Trade Expansion Act signed. Herter named to negotiate, Nov. 15.
    n: '[Pub. L. No. 87-794, 76 Stat. 872](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg872.pdf) (K–J Cong. II.J.2). See [[cal.1962-01-25.trade]].'
    tags: [name:herter-christian-a, name:kennedy-john-f]
  - id: cal.1962-10-13.congress
    when: Oct. 13
    date: '1962-10-13'
    thread: congress
    c: 'Second session adjourns. Passed: trade, the investment credit, manpower, welfare, public works. Lost: Medicare, school and college aid, Urban Affairs, literacy tests.'
    n: '[Cong. Rec., Senate, Oct. 13, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt17/pdf/GPO-CRECB-1962-pt17-8-1.pdf). CQ Almanac 1962 (K–J Cong. II.L). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1961-11-16.congress]].'
  - id: cal.1962-10-14.missile-crisis
    when: Oct. 14
    date: '1962-10-14'
    thread: missile-crisis
    c: Heyser's U-2 photographs MRBM sites near San Cristóbal.
    n: '[FRUS 1961–63, XI, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v11/d16). See [[cal.1962-05-24.missile-crisis]].'
  - id: cal.1962-10-16.missile-crisis
    when: Oct. 16
    date: '1962-10-16'
    thread: missile-crisis
    c: Bundy tells Kennedy at breakfast. First ExComm meeting, 11:50 a.m., taped. Air strike, invasion, blockade.
    n: 'FRUS 1961–63, XI, docs. [18](https://history.state.gov/historicaldocuments/frus1961-63v11/d18), [21](https://history.state.gov/historicaldocuments/frus1961-63v11/d21). *The Kennedy Tapes*; *The Presidential Recordings: John F. Kennedy: The Great Crises*, vols. 2–3 (K–J Adm. II.J). Stern (K–J Adm. II.D). See [[cal.1962-05-24.missile-crisis]]. Names: Bundy (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f]
  - id: cal.1962-10-16.economy
    when: Oct. 16
    date: '1962-10-16'
    thread: economy
    c: Revenue Act of 1962 signed. Investment credit, 7 percent. Withholding on dividends and interest dropped.
    n: '[Pub. L. No. 87-834, 76 Stat. 960](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg960.pdf) (1962). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1961-01-05.economy]]. Names: Mills (K–J Cong. III.D); Dillon (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-18.missile-crisis
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 'Gromyko at the White House: Soviet aid to Cuba defensive. Kennedy does not show the photographs.'
    n: '[FRUS vol. 11](https://history.state.gov/historicaldocuments/frus1961-63v11). See [[cal.1962-05-24.missile-crisis]]. Names: Gromyko (K–J Adm. III.J).'
    tags: [name:gromyko-andrei, name:kennedy-john-f]
  - id: cal.1962-10-20.missile-crisis
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: Kennedy leaves Chicago with a "cold." Quarantine chosen over air strike.
    n: '[FRUS 1961–63, XI, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v11/d34). See [[cal.1962-10-16.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-20.india-and-china
    when: Oct. 20
    date: '1962-10-20'
    thread: india-and-china
    c: China attacks in Ladakh and the North-East Frontier Agency.
    n: See [[cal.1961-12-18.india-and-china]].
  - id: cal.1962-10-22.missile-crisis
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: Address, 7 p.m. Quarantine. A missile from Cuba to bring full retaliation on the Soviet Union.
    n: '[Radio and Television Report to the American People on the Soviet Arms Buildup in Cuba](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-soviet-arms-buildup-cuba) (Oct. 22, 1962). Recording (K–J Adm. II.I). See [[cal.1962-10-16.missile-crisis]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: OAS endorses the quarantine, none opposed. Proclamation signed; in force 10 a.m., Oct. 24. Robert Kennedy sees Dobrynin.
    n: '[Proclamation No. 3504](https://www.presidency.ucsb.edu/documents/proclamation-3504-interdiction-the-delivery-offensive-weapons-cuba), [27 Fed. Reg. 10,401](https://www.govinfo.gov/app/details/FR-1962-10-25) (1962). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy (K–J Adm. III.A); Dobrynin (K–J Adm. III.J).'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:kennedy-john-f]
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Soviet ships stop or turn back. Rusk: "the other fellow just blinked."'
    n: '[FRUS 1961–63, XI, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v11/d55). Dobbs, *One Minute to Midnight* (K–J Adm. II.D). See [[cal.1962-10-16.missile-crisis]]. Names: Rusk (K–J Adm. III.E).'
    tags: [name:rusk-dean]
  - id: cal.1962-10-25.missile-crisis
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: Stevenson and Zorin at the Security Council. "Until hell freezes over." The photographs shown.
    n: 'Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson (K–J Adm. III.E).'
    tags: [name:stevenson-adlai-e]
  - id: cal.1962-10-26.missile-crisis
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: 'Khrushchev''s first letter: the missiles out for a pledge against invasion. Feklisov puts like terms to Scali of ABC.'
    n: '[FRUS vol. 6](https://history.state.gov/historicaldocuments/frus1961-63v06). Fursenko & Naftali (K–J Adm. II.D). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s, name:scali-john-a]
  - id: cal.1962-10-27.missile-crisis
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: 'Black Saturday. Second letter, broadcast: the Jupiters in Turkey added. Anderson''s U-2 shot down over Cuba; another strays over Siberia. That night Robert Kennedy to Dobrynin: the Jupiters to go, privately.'
    n: 'FRUS 1961–63, XI, docs. [91](https://history.state.gov/historicaldocuments/frus1961-63v11/d91), [94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94), [96](https://history.state.gov/historicaldocuments/frus1961-63v11/d96). Dobbs; Stern; Sherwin (see [[cal.1962-05-24.missile-crisis]]). Dobrynin, *In Confidence* (K–J Adm. II.G.7). Names: Robert F. Kennedy (K–J Adm. III.A); Dobrynin (K–J Adm. III.J).'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly]
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Radio Moscow: the missiles to be dismantled and returned. Castro refuses inspection.'
    n: '[FRUS 1961–63, XI, doc. 102](https://history.state.gov/historicaldocuments/frus1961-63v11/d102). [Statement by the President Following the Soviet Decision To Withdraw Missiles From Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-soviet-decision-withdraw-missiles-from-cuba) (Oct. 28, 1962). See [[cal.1962-10-16.missile-crisis]]. Names: Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel]
