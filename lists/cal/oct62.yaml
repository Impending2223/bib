# Cal. XXIV October 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXIV
entries:
  - id: cal.1962-10-01.mississippi
    when: Oct. 1
    date: '1962-10-01'
    thread: mississippi
    also: [right-and-the-military]
    c: Meredith registers. Troops in Oxford. Walker arrested for insurrection; sent for psychiatric examination.
    n: 'See [[cal.1962-09-27.mississippi]]. Names: Walker (K–J Adm. III.F).'
  - id: cal.1962-10-01.transition-and-staff
    when: Oct. 1
    date: '1962-10-01'
    thread: transition-and-staff
    c: Taylor Chairman of the Joint Chiefs. Lemnitzer to NATO.
    n: 'Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D). See [[cal.1961-06-26.transition-and-staff]]. Names: Taylor, Lemnitzer (K–J Adm. III.F).'
  - id: cal.1962-10-03.space
    when: Oct. 3
    date: '1962-10-03'
    thread: space
    c: Schirra's six orbits.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-10-10.program
    when: Oct. 10
    date: '1962-10-10'
    thread: program
    c: Drug Amendments signed. Proof of efficacy; informed consent.
    n: Pub. L. No. 87-781, 76 Stat. 780 (1962). See [[cal.1962-07-15.program]].
  - id: cal.1962-10-11.trade
    when: Oct. 11
    date: '1962-10-11'
    thread: trade
    c: Trade Expansion Act signed. Herter named to negotiate, Nov. 15.
    n: Pub. L. No. 87-794 (K–J Cong. II.J.2). See [[cal.1962-01-25.trade]].
  - id: cal.1962-10-13.congress
    when: Oct. 13
    date: '1962-10-13'
    thread: congress
    c: 'Second session adjourns. Passed: trade, the investment credit, manpower, welfare, public works. Lost: Medicare, school and college aid, Urban Affairs, literacy tests.'
    n: CQ Almanac 1962 (K–J Cong. II.L). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1961-11-16.congress]].
  - id: cal.1962-10-14.missile-crisis
    when: Oct. 14
    date: '1962-10-14'
    thread: missile-crisis
    c: Heyser's U-2 photographs MRBM sites near San Cristóbal.
    n: See [[cal.1962-05-24.missile-crisis]].
  - id: cal.1962-10-16.missile-crisis
    when: Oct. 16
    date: '1962-10-16'
    thread: missile-crisis
    c: Bundy tells Kennedy at breakfast. First ExComm meeting, 11:50 a.m., taped. Air strike, invasion, blockade.
    n: '*The Kennedy Tapes*; *The Presidential Recordings: John F. Kennedy: The Great Crises*, vols. 2–3 (K–J Adm. II.J). Stern (K–J Adm. II.D). See [[cal.1962-05-24.missile-crisis]]. Names: Bundy (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F).'
  - id: cal.1962-10-16.economy
    when: Oct. 16
    date: '1962-10-16'
    thread: economy
    c: Revenue Act of 1962 signed. Investment credit, 7 percent. Withholding on dividends and interest dropped.
    n: 'Pub. L. No. 87-834, 76 Stat. 960 (1962). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1961-01-05.economy]]. Names: Mills (K–J Cong. III.D); Dillon (K–J Adm. III.H).'
  - id: cal.1962-10-18.missile-crisis
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: 'Gromyko at the White House: Soviet aid to Cuba defensive. Kennedy does not show the photographs.'
    n: 'FRUS vol. 11. See [[cal.1962-05-24.missile-crisis]]. Names: Gromyko (K–J Adm. III.J).'
  - id: cal.1962-10-20.missile-crisis
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: Kennedy leaves Chicago with a "cold." Quarantine chosen over air strike.
    n: See [[cal.1962-10-16.missile-crisis]].
  - id: cal.1962-10-20.india-and-china
    when: Oct. 20
    date: '1962-10-20'
    thread: india-and-china
    c: China attacks in Ladakh and the North-East Frontier Agency.
    n: See [[cal.1961-12-18.india-and-china]].
  - id: cal.1962-10-22.missile-crisis
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: Address, 7 p.m. Quarantine. A missile from Cuba to bring full retaliation on the Soviet Union.
    n: Recording (K–J Adm. II.I). See [[cal.1962-10-16.missile-crisis]].
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: OAS endorses the quarantine, none opposed. Proclamation signed; in force 10 a.m., Oct. 24. Robert Kennedy sees Dobrynin.
    n: 'Proclamation No. 3504, 27 Fed. Reg. 10,401 (1962). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy (K–J Adm. III.A); Dobrynin (K–J Adm. III.J).'
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Soviet ships stop or turn back. Rusk: "the other fellow just blinked."'
    n: 'Dobbs, *One Minute to Midnight* (K–J Adm. II.D). See [[cal.1962-10-16.missile-crisis]]. Names: Rusk (K–J Adm. III.E).'
  - id: cal.1962-10-25.missile-crisis
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: Stevenson and Zorin at the Security Council. "Until hell freezes over." The photographs shown.
    n: 'Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson (K–J Adm. III.E).'
  - id: cal.1962-10-26.missile-crisis
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: 'Khrushchev''s first letter: the missiles out for a pledge against invasion. Feklisov puts like terms to Scali of ABC.'
    n: 'FRUS vol. 6. Fursenko & Naftali (K–J Adm. II.D). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev (K–J Adm. III.J).'
  - id: cal.1962-10-27.missile-crisis
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: 'Black Saturday. Second letter, broadcast: the Jupiters in Turkey added. Anderson''s U-2 shot down over Cuba; another strays over Siberia. That night Robert Kennedy to Dobrynin: the Jupiters to go, privately.'
    n: 'Dobbs; Stern; Sherwin (see [[cal.1962-05-24.missile-crisis]]). Dobrynin, *In Confidence* (K–J Adm. II.G.7). Names: Robert F. Kennedy (K–J Adm. III.A); Dobrynin (K–J Adm. III.J).'
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Radio Moscow: the missiles to be dismantled and returned. Castro refuses inspection.'
    n: 'See [[cal.1962-10-16.missile-crisis]]. Names: Castro (K–J Adm. III.J).'
