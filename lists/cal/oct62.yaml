  - id: cal.1962-10-22.robert-kennedy
    when: Oct. 22–Dec. 23
    date: '1962-10-22'
    thread: robert-kennedy
    also: [crime-and-hijacking]
    c: Nashville. Hoffa on trial under the Taft-Hartley Act, the Test Fleet case. Edward Partin, a Teamsters official from Baton Rouge, in Hoffa's hotel suite and company throughout, reports to Walter Sheridan, Robert Kennedy's investigator, on attempts to reach the jurors. Dec. 23, the jury hung.
    n: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf), 294–96 (1966). [[w.sheridan-fall-and-rise-of]]; [[w.navasky-kennedy-justice]]; [[w.goldfarb-perfect-villains-imperfect-heroes]]; [[w.sloane-hoffa]]; [[w.kennedy-enemy-within]]. See [[cal.1961-09-13.crime-and-hijacking]]. Made public: Partin''s part, at the Chattanooga trial, 1964. Names: Hoffa (K–J Cong. III.I); Partin, Sheridan (K–J Cong. III.K); Robert Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f, name:hoffa-james-r, name:partin-edward-grady, name:sheridan-walter]
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    also: [robert-kennedy]
    c: OAS endorses the quarantine, none opposed. Proclamation signed; in force 10 a.m., Oct. 24. Robert Kennedy sees Dobrynin.
    n: '[Kennedy and Robert Kennedy, 7:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/discussion-between-president-kennedy-and-robert-kennedy), Tapes 36.1 and 36.2 (Miller Center). [Proclamation No. 3504](https://www.presidency.ucsb.edu/documents/proclamation-3504-interdiction-the-delivery-offensive-weapons-cuba), [27 Fed. Reg. 10,401](https://www.govinfo.gov/app/details/FR-1962-10-25) (1962). See [[cal.1962-10-16.missile-crisis]]. Names: Robert F. Kennedy (K–J Adm. III.A); Dobrynin (K–J Adm. III.J).'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:kennedy-john-f]
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: 'Soviet ships stop or turn back. Rusk: "the other fellow just blinked."'
    n: '[FRUS 1961–63, XI, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v11/d55). [[w.dobbs-one-minute-to-midnight]]. See [[cal.1962-10-16.missile-crisis]]. Names: Rusk (K–J Adm. III.E).'
    tags: [name:rusk-dean]
  - id: cal.1962-10-24.immigration
    when: Oct. 24
    date: '1962-10-24'
    thread: immigration
    c: 'Act of Oct. 24, [76 Stat. 1247](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg1247.pdf): nonquota visas for the waiting lists. Relatives of citizens in the fourth preference, registered before Mar. 31, 1954, on petitions filed before 1962; skilled specialists in the first preference, on petitions filed before Apr. 1, 1962, where half their country''s quota is oversubscribed.'
    n: Statute (K–J Cong. II.J.2). S. 3361, 87th Cong. [[w.reimers-still-the-golden-door]]. See [[cal.1961-09-26.immigration]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-25.missile-crisis
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: Stevenson and Zorin at the Security Council. "Until hell freezes over." The photographs shown.
    n: '[[w.martin-adlai-stevenson-and-the]]. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson (K–J Adm. III.E); Zorin (K–J Adm. III.J).'
    tags: [name:stevenson-adlai-e, name:zorin-valerian]
  - id: cal.1962-10-26.missile-crisis
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: 'Khrushchev''s first letter: the missiles out for a pledge against invasion. Feklisov puts like terms to Scali of ABC.'
    n: '[FRUS vol. 6](https://history.state.gov/historicaldocuments/frus1961-63v06). [[w.fursenko-one-hell-of-a]]. See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Feklisov (K–J Adm. III.J); Scali (K–J Cong. III.J).'
    tags: [name:khrushchev-nikita-s, name:scali-john-a, name:feklisov-aleksandr]
  - id: cal.1962-10-27.missile-crisis
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    also: [robert-kennedy]
    c: 'Black Saturday. Second letter, broadcast: the Jupiters in Turkey added. Anderson''s U-2 shot down over Cuba; another strays over Siberia. That night Robert Kennedy to Dobrynin: the Jupiters to go, privately.'
    n: 'FRUS 1961–63, XI, docs. [91](https://history.state.gov/historicaldocuments/frus1961-63v11/d91), [94](https://history.state.gov/historicaldocuments/frus1961-63v11/d94), [96](https://history.state.gov/historicaldocuments/frus1961-63v11/d96). [[w.dobbs-one-minute-to-midnight]]; [[w.stern-averting-the-final-failure]]; [[w.sherwin-gambling-with-armageddon]]; [[w.dobrynin-in-confidence]]. See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Dobrynin (K–J Adm. III.J); Anderson (K–J Adm. III.F); Robert F. Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f, name:dobrynin-anatoly, name:anderson-rudolf-jr, name:khrushchev-nikita-s]
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: 'Radio Moscow: the missiles to be dismantled and returned. Castro refuses inspection.'
    n: '[FRUS 1961–63, XI, doc. 102](https://history.state.gov/historicaldocuments/frus1961-63v11/d102). [Statement by the President Following the Soviet Decision To Withdraw Missiles From Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-soviet-decision-withdraw-missiles-from-cuba) (Oct. 28, 1962). See [[cal.1962-10-16.missile-crisis]]. Names: Khrushchev, Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel, name:khrushchev-nikita-s]
  - id: cal.1962-10-29.japan-and-korea
    when: Oct. 29
    date: '1962-10-29'
    thread: japan-and-korea
    c: 'Kim Chong-p''il, director of the Korean CIA, with Rusk and Harriman, the missile crisis on. Ōhira''s offer in Tokyo, as Kim reports it: $300 million over twelve years, not to be called reparations; Kim asks $600 million with loans. Harriman: the bars on candidates in the 1963 elections. Nov. 12, in Tokyo, Kim and Ōhira settle the figures: $300 million in grants, $200 million in government loans. Check.'
    n: 'FRUS 1961–63, XXII, docs. [280](https://history.state.gov/historicaldocuments/frus1961-63v22/d280), [281](https://history.state.gov/historicaldocuments/frus1961-63v22/d281), [282](https://history.state.gov/historicaldocuments/frus1961-63v22/d282), [283](https://history.state.gov/historicaldocuments/frus1961-63v22/d283). [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]. See [[cal.1962-04-24.japan-and-korea]]. Names: Kim Chong-p''il, Ōhira (K–J Adm. III.J); Rusk, Harriman (K–J Adm. III.E).'
    tags: [name:kim-chong-pil, name:ohira-masayoshi, name:rusk-dean, name:harriman-w-averell]
