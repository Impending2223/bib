    when: Oct. 16
    date: '1962-10-16'
    thread: missile-crisis
    also: [robert-kennedy]
    c: Bundy tells Kennedy at breakfast. First ExComm meeting, 11:50 a.m., taped. Air strike, invasion, blockade.
    n: 'FRUS 1961–63, XI, docs. [18](https://history.state.gov/historicaldocuments/frus1961-63v11/d18), [21](https://history.state.gov/historicaldocuments/frus1961-63v11/d21). [[w.kennedy-tapes]]; [[w.presidential-recordings]], vols. 2–3. [[w.stern-averting-the-final-failure]]. See [[cal.1962-05-24.missile-crisis]]. Names: Bundy (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:bundy-mcgeorge, name:kennedy-john-f]
  - id: cal.1962-10-16.economy
    when: Oct. 16
    date: '1962-10-16'
    thread: economy
    c: Revenue Act of 1962 signed, [76 Stat. 960](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg960.pdf). Investment credit, 7 percent. Withholding on dividends and interest dropped.
    n: '[[w.zelizer-taxing-america]]. See [[cal.1961-01-05.economy]]. Names: Mills (K–J Cong. III.D); Dillon (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-10-17.opinion
    when: Oct. 17
    date: '1962-10-17'
    thread: opinion
    also: [missile-crisis, cuba]
    c: 'Gallup, Sept. 20–25: troops sent to overthrow Castro likely to bring all-out war with Russia, 51 percent; not, 37. Even of those who think war unlikely, 57 oppose an invasion.'
    n: '[[w.gallup-poll]], III, 1787. Names: Castro (K–J Adm. III.J).'
    tags: [name:castro-fidel]
