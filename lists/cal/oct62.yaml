# Cal. XXIV October 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXIV
entries:
  - id: cal.1962-10-01.mississippi
    when: Oct. 1
    date: '1962-10-01'
    thread: mississippi
    also: [right-and-the-military]
    c: Meredith registers. Regular troops hold Oxford. Walker, who urged on the crowd, arrested for insurrection and sent for psychiatric examination.
    n: See [[cal.1962-09-27.mississippi]].
  - id: cal.1962-10-01.transition-and-staff
    when: Oct. 1
    date: '1962-10-01'
    thread: transition-and-staff
    c: Taylor becomes Chairman of the Joint Chiefs. Lemnitzer goes to NATO as commander.
    n: 'Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). McMaster, *Dereliction of Duty* (K–J Adm. II.D). Names: Taylor, Lemnitzer (K–J Adm. III.F).'
  - id: cal.1962-10-03.space
    when: Oct. 3
    date: '1962-10-03'
    thread: space
    c: Schirra's six orbits.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-10-10.program
    when: Oct. 10
    date: '1962-10-10'
    thread: program
    c: Drug Amendments signed. A new drug must be shown effective as well as safe; patients told when drugs are experimental.
    n: Pub. L. No. 87-781, 76 Stat. 780 (1962). Check. See [[cal.1962-07-15.program]].
  - id: cal.1962-10-11.trade
    when: Oct. 11
    date: '1962-10-11'
    thread: trade
    c: Trade Expansion Act signed. Christian Herter named the special representative for the negotiations.
    n: Pub. L. No. 87-794 (K–J Cong. II.J.2). Check Herter's date. See [[cal.1962-01-25.trade]].
  - id: cal.1962-10-13.congress
    when: Oct. 13
    date: '1962-10-13'
    thread: congress
    c: The second session adjourns. Trade, the investment credit, manpower, welfare, and public works passed; Medicare, school and college aid, urban affairs, and the literacy bill lost.
    n: CQ Almanac 1962 (K–J Cong. II.L). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1961-11-16.congress]].
  - id: cal.1962-10-14.missile-crisis
    when: Oct. 14
    date: '1962-10-14'
    thread: missile-crisis
    c: Major Richard Heyser's U-2 photographs medium-range missile sites near San Cristóbal.
    n: See [[cal.1962-05-24.missile-crisis]].
  - id: cal.1962-10-16.missile-crisis
    when: Oct. 16
    date: '1962-10-16'
    thread: missile-crisis
    c: Bundy tells Kennedy at breakfast. The group later called the ExComm meets at 11:50 in the Cabinet Room, the tape running. Air strike, invasion, and blockade on the table.
    n: '*The Kennedy Tapes*; *The Presidential Recordings: John F. Kennedy: The Great Crises*, vols. 2–3 (K–J Adm. II.J). Stern (K–J Adm. II.D). Names: Bundy (K–J Adm. III.E).'
  - id: cal.1962-10-16.economy
    when: Oct. 16
    date: '1962-10-16'
    thread: economy
    c: Revenue Act of 1962 signed. A 7 percent investment credit; withholding on dividends and interest dropped.
    n: 'Pub. L. No. 87-834, 76 Stat. 960 (1962). Check. Zelizer, *Taxing America* (K–J Cong. II.B). Names: Mills (K–J Cong. III.D); Dillon (K–J Adm. III.H).'
  - id: cal.1962-10-18.missile-crisis
    when: Oct. 18
    date: '1962-10-18'
    thread: missile-crisis
    c: Gromyko at the White House says Soviet aid to Cuba is defensive. Kennedy, the photographs in his desk, does not show them.
    n: 'FRUS vol. 11. Names: Gromyko (K–J Adm. III.J).'
  - id: cal.1962-10-20.missile-crisis
    when: Oct. 20
    date: '1962-10-20'
    thread: missile-crisis
    c: Kennedy leaves a campaign trip in Chicago with a "cold" and chooses the quarantine over an air strike.
    n: See [[cal.1962-10-16.missile-crisis]].
  - id: cal.1962-10-20.india-and-china
    when: Oct. 20
    date: '1962-10-20'
    thread: india-and-china
    c: China attacks in Ladakh and the North-East Frontier Agency. The Indian army routed.
    n: See [[cal.1961-12-18.india-and-china]].
  - id: cal.1962-10-22.missile-crisis
    when: Oct. 22
    date: '1962-10-22'
    thread: missile-crisis
    c: Address at seven in the evening. A quarantine of offensive weapons; any missile launched from Cuba to be met with a full retaliatory response upon the Soviet Union.
    n: Recording (K–J Adm. II.I).
  - id: cal.1962-10-23.missile-crisis
    when: Oct. 23
    date: '1962-10-23'
    thread: missile-crisis
    c: The OAS endorses the quarantine without a vote against. Kennedy signs the proclamation that evening, in force at ten the next morning. Robert Kennedy sees Dobrynin.
    n: Proclamation No. 3504, 27 Fed. Reg. 10,401 (1962). Check.
  - id: cal.1962-10-24.missile-crisis
    when: Oct. 24
    date: '1962-10-24'
    thread: missile-crisis
    c: Soviet ships nearing the line stop or turn back. "We're eyeball to eyeball, and I think the other fellow just blinked" (Rusk).
    n: Dobbs, *One Minute to Midnight* (K–J Adm. II.D).
  - id: cal.1962-10-25.missile-crisis
    when: Oct. 25
    date: '1962-10-25'
    thread: missile-crisis
    c: Stevenson and Zorin at the Security Council. "I am prepared to wait for my answer until hell freezes over." The photographs on easels.
    n: 'Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). Names: Stevenson (K–J Adm. III.E).'
  - id: cal.1962-10-26.missile-crisis
    when: Oct. 26
    date: '1962-10-26'
    thread: missile-crisis
    c: Khrushchev's long letter. The missiles out for a pledge not to invade. Aleksandr Feklisov of the KGB puts something like it to John Scali of ABC.
    n: FRUS vol. 6 (the letters). Fursenko & Naftali (K–J Adm. II.D).
  - id: cal.1962-10-27.missile-crisis
    when: Oct. 27
    date: '1962-10-27'
    thread: missile-crisis
    c: Black Saturday. A second letter, broadcast, adds the Jupiters in Turkey. Major Rudolf Anderson's U-2 shot down over Cuba; another U-2 strays over Siberia. That night Robert Kennedy tells Dobrynin the Jupiters will go, privately, within months.
    n: Dobbs; Stern; Sherwin (see [[cal.1962-05-24.missile-crisis]]). Dobrynin, *In Confidence* (K–J Adm. II.G.7).
  - id: cal.1962-10-28.missile-crisis
    when: Oct. 28
    date: '1962-10-28'
    thread: missile-crisis
    c: Radio Moscow. The missiles will be dismantled, crated, and taken home. Castro, not consulted, refuses inspection.
    n: See [[cal.1962-10-16.missile-crisis]].
