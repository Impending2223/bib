    when: Oct. 2
    date: '1962-10-02'
    thread: mayors
    also: [elections-1962]
    c: Cleveland, Democratic primary for the rest of Celebrezze's term. Locher over Mark McElroy, the attorney general, who had lost the primary for governor in May.
    n: '*Plain Dealer*, Oct. 3, 1962, pp. A1, A10 (Check the figures). [[w.davis-black-americans-in-cleveland]]. See [[cal.1962-07-14.transition-and-staff-cleveland]]; [[cal.1962-05-08.governors-oh]]. Names: Locher (K–J Cong. III.K); McElroy (K–J Cong. III.F); Celebrezze (K–J Adm. III.G).'
    tags: [state:oh, city:cleveland, name:locher-ralph-s, name:mcelroy-mark, name:celebrezze-anthony-j]
