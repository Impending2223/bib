    when: Oct. 14
    date: '1962-10-14'
    thread: missile-crisis
    c: Heyser's U-2 photographs MRBM sites near San Cristóbal.
    n: '[FRUS 1961–63, XI, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v11/d16). See [[cal.1962-05-24.missile-crisis]]. Names: Heyser (K–J Adm. III.F).'
