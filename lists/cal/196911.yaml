entries:
  - id: cal.1969-11-01.china-leadership
    when: Nov. 1
    date: '1969-11-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Wang Dongxing reports to Mao, Lin Biao, Zhou Enlai, Chen Boda and Kang Sheng a proposal to appoint Wang Liangen and Zhang Yaoci deputy directors of the Central General Office. Zhou notes: propose to agree.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325 (Nov. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, name:chen-boda, name:kang-sheng, vis:only:prc]
  - id: cal.1969-11-01.china-leadership-2
    when: Nov. 1
    date: '1969-11-01'
    place: peking
    thread: china-leadership
    c: Peng Dehuai 彭德怀 reads *Taking Tiger Mountain by Strategy* 《智取威虎山》 in the paper and sings 65 minutes, giggling, kicking, clapping, as if dancing.
    n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1969-11-02.vietnam-hanoi
    when: Nov. 2
    date: '1969-11-02'
    time: 1969-11-01T20:00Z
    place: ka-te
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Ka Te, Hill 936, Quảng Đức. At 4 a.m. the 66th Regiment storms the base from its trenches, after five days of closing in; in 15 minutes the garrison is destroyed. Nearly 200 out of action, 14 aircraft shot down, six 105 mm and 155 mm guns taken, by the history's count.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 150–51. See [[cal.1969-10-29.vietnam-hanoi]]. The words: "Bốn giờ sáng ngày 2-11-1969" (4 a.m., Nov. 2, 1969).'
    tags: [polity:drv, polity:us]
    time_zone: Asia/Ho_Chi_Minh
  - id: cal.1969-11-02.vietnam-hanoi-2
    when: Nov. 2–6
    date: '1969-11-02'
    place: duc-lap
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Đức Lập and Đắk Song. On the campaign's main axis the Front's forces surround Đức Lập to draw the Saigon forces out toward Đắk Song and destroy them.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-10-29.vietnam-hanoi]].'
    tags: [polity:drv]
  - id: cal.1969-11-03.vietnam
    when: Nov. 3
    date: '1969-11-03'
    thread: vietnam
    c: 'Nixon''s statement on Vietnam: the South Vietnamese forces to be made strong enough to take over the whole of the South''s security, so that all American ground combat forces can be withdrawn. The history draws his account of Vietnamization from it.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 29 and n. 1. [[w.chang-friends-and-enemies]], 288 (Nixon: the United States "shall provide a shield if a nuclear power threatens the freedom of a nation allied with us or of a nation whose survival we consider vital to our security"; the Soviet Union and China meant, not named). Check: Chang ([[w.chang-friends-and-enemies]], 288) calls it "a November 1969 speech on Guam"; the Guam remarks were of July 25 ([[cal.1969-07-25.vietnam]]). To check: Nixon, *Public Papers* (1969), the address of Nov. 3. Names: Nixon. Check: the form; the history gives the day and quotes in translation.'
    tags: [polity:us, name:nixon-richard-m]
  - id: cal.1969-11-03.vietnam-hanoi-2
    when: Nov. 3
    date: '1969-11-03'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Vietnam News Agency''s commentary "Cải cách điền địa - một trò bịp bợm và phản động" (Land reform, a fraud and a reactionary trick), on the Saigon government''s land program: nearly all land in the South, from landlords'' to the French-owned land sold to Diệm and Nhu in 1958, has been divided by the revolution to the peasants since the uprising; Saigon''s village officials and exiled landlords take it back and give it to puppet troops, in Long An, Tây Ninh, Bình Thuận and Bà Rịa.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 49–50. Check: the place; the history names the agency, not the city, and gives the day only.'
    tags: [polity:drv]
  - id: cal.1969-11-03.vietnam-hanoi
    when: Nov. 3
    date: '1969-11-03'
    place: bu-dop
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The Liberation Army command opens the Phước Bình–Bù Đốp campaign in Phước Long and Bình Long: the 7th Division (the 209th, 165th and 141st Regiments), an artillery regiment, the 18th Sapper and 94th Engineer Battalions, under Đàm Văn Ngụy, the division''s commander; to destroy forces, cut Routes 13 and 14 and help the people against pacification. The Bù Đốp subsector besieged. The command ends the campaign Dec. 10: more than 1,000 of the enemy put out of action, by its count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 138–39. To check: *Tóm tắt các chiến dịch* (2001), 259, 261 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 138 n.). Names: Đàm Văn Ngụy.'
    tags: [polity:drv, province:phuoc-long, province:binh-long]
  - id: cal.1969-11-03.china-leadership
    when: Nov. 3
    date: '1969-11-03'
    place: nanchang
    thread: china-leadership
    c: Nanchang 南昌. Chen Yun 陈云, by the Jiangxi Revolutionary Committee's 江西省革命委员会 arrangement, moves from the city to the Fuzhou Military Region's cadres' sanatorium 福州军区干部休养所 at Qingyunpu 青云谱, in the western suburbs; for secrecy he goes in Jiangxi by the name Chen Yuanfang 陈元方.
    n: '[[w.chen-yun-nianpu-xiuding]], III, 172. See [[cal.1969-11.china-leadership-13]]. Made public: 2015. Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc]
  - id: cal.1969-11-05.china-leadership
    when: Nov. 5
    date: '1969-11-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, defense]
    c: 'The State Council and the Military Commission forward the "Opinions on reforming the posts and telecommunications system" of the military control commissions of the Ministries of Railways, Communications and Posts and Telecommunications and of the PLA Signal Corps: the Ministry''s telecommunications is to be separated from its posts, telecommunications going under army leadership, posts merged with the railway and communications departments. On Nov. 10 they send out a notice merging the State Bureau of Surveying and Mapping into the General Staff''s Survey Bureau.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325 (Nov. 5, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-05.china-leadership-2
    when: Nov. 5
    date: '1969-11-05'
    place: wuhan
    thread: china-leadership
    c: Wuhan 武漢. The city sends 1,319 people, the Steel and New factions' heads great and small among them, to Peking to the Center's "Mao Zedong Thought study class" at the Air Force Academy 空軍學院 (1,600 with those who join later), held there eight months, to June 1970, without freedom; on Chen Boda's 陳伯達 line, "link up to Liu, down to the ox-demons, set fire to yourself".
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 478. Made public: 2016. Names: Chen Boda.'
    src:
      c: '34871994'
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 478: all'
    tags: [polity:prc, vis:only:prc, name:chen-boda]
  - id: cal.1969-11-06.vietnam-hanoi
    when: Nov. 6
    date: '1969-11-06'
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'The Government''s statement on Nixon''s Vietnamization: the "change of policy" he praises means more war and holding on to the South, no right settlement at Paris; Vietnamese made to fight Vietnamese; American troops withdrawn drop by drop with no date for all, combat infantry only, the rest to stay; the war prolonged without limit.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 36–37. Names: Nixon.'
    tags: [polity:drv, polity:us, name:nixon-richard-m, ok:fields-place]
  - id: cal.1969-11-07.soviet-union-leadership
    when: Nov. 7
    date: '1969-11-07'
    place: moscow
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev, 1:30 to 2 p.m., negotiates with the delegation of the Republic of South Vietnam led by Nguyễn Hữu Thọ, after the parade from the Mausoleum.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 370 (Nov. 7). Names: Brezhnev, Nguyễn Hữu Thọ.'
    tags: [name:brezhnev-leonid, name:nguyen-huu-tho, polity:ussr, polity:drv]
    time_range:
      - 1969-11-07T10:30Z
      - 1969-11-07T11:00Z
    time_zone: Europe/Moscow
