    when: Nov. 7
    date: '1969-11-07'
    place: peking
    thread: china-leadership
    also: [middle-east]
    c: Li Xiannian receives the Iraqi government civil aviation delegation. The same day China and Iraq sign, at Beijing, an air transport agreement.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 230 (Nov. 7, 1969). Names: Li Xiannian.'
