entries:
  - id: cal.1969-11-07.soviet-union-leadership
    when: Nov. 7
    date: '1969-11-07'
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev, 1:30 to 2 p.m., negotiates with the delegation of the Republic of South Vietnam led by Nguyễn Hữu Thọ, after the parade from the Mausoleum.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 370 (Nov. 7). Names: Brezhnev, Nguyễn Hữu Thọ.'
    tags: [name:brezhnev-leonid, name:nguyen-huu-tho, polity:ussr, polity:drv]
  - id: cal.1969-11-10.soviet-union-leadership
    when: Nov. 10
    date: '1969-11-10'
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Brezhnev receives the Sudanese delegation led by Nimeiri, 4 to 6 p.m., Suslov, Ponomarev and others taking part.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 370 (Nov. 10). Names: Brezhnev, Nimeiri, Suslov, Ponomarev.'
    tags: [name:brezhnev-leonid, name:suslov-mikhail-a, name:ponomarev-boris-n, name:numayri-gafar-m-jaafar-nimeiry, polity:ussr, polity:sudan]
  - id: cal.1969-11-12.china-leadership
    when: Nov. 12
    date: '1969-11-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Liu Shaoqi dies at Kaifeng, Henan, 6:45 a.m., aged 71: chairman of the PRC and formerly vice-chairman of the Central Committee.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 12, 1969. Made public: Check (1980 at the latest, at his rehabilitation). Names: Liu Shaoqi. Check: the chronology gives no word on how and when the Center was told, or on whether Mao was; the date of its being made public.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-11-12.vietnam-hanoi
    when: Nov. 12
    date: '1969-11-12'
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the thirty-first congress of the Communist Party of Great Britain: greetings on its fight against the monopolies, for Britain''s leaving NATO and the removal of American bases; thanks for its support of Vietnam and for John Gollan''s delegation to Hồ Chí Minh''s funeral.'
    n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 11 năm 1969, gửi Đại hội lần thứ XXXI Đảng Cộng sản Anh* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Names: Gollan, Hồ Chí Minh. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, vis:only:drv+uk, name:ho-chi-minh]
  - id: cal.1969-11-19.china-leadership
    when: Nov. 19
    date: '1969-11-19'
    thread: china-leadership
    also: [soviet-union, south-asia, china]
    c: 'Mao, Peking: Zhou Enlai''s report of Nov. 16 with Qiao Guanhua''s draft speech at the boundary talks (the two premiers'' understanding the base of talks; disengagement in disputed areas a guarantee of keeping the status quo; talks free of threat) and of President Yahya Khan''s talk with Zhang Tong, China''s ambassador in Pakistan, conveying a message from Nixon. Zhou: Nixon''s and Kissinger''s moves are to be noted; the reply to Yahya after consultation with the Foreign Ministry.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 19, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Qiao Guanhua, Nixon, Kissinger, Yahya Khan, Zhang Tong. Check: the American record of the message by Yahya; the day of the talk with Zhang.'
    tags: [polity:prc, polity:pakistan, name:mao-zedong, name:zhou-enlai, name:qiao-guanhua, name:nixon-richard-m, name:kissinger-henry-a, vis:only:prc]
  - id: cal.1969-11-20.soviet-union-leadership
    when: Nov. 20
    date: '1969-11-20'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Sunay, President of Turkey, 10 to 11:30.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 372 (Nov. 20). Names: Brezhnev, Sunay.'
    tags: [name:brezhnev-leonid, name:sunay-cedvet, polity:ussr, polity:turkey]
  - id: cal.1969-11-20.vietnam-hanoi
    when: Nov. 20
    date: '1969-11-20'
    thread: vietnam-hanoi
    also: [vietnam-air-war]
    c: 'The Politburo''s resolution no. 194-NQ/TW on the American pilots captured in the North: not prisoners of war, Hanoi not bound by the Geneva Convention of 1949, but its relevant points to be applied in a humane policy, to win American and world opinion. Food, clothing and medicine kept as now; healthy quarters, exercise and labor; political education; a card home monthly, a parcel every two months; those held in secret allowed cards by early 1970; belongings kept; religious services; the dead buried together for return.'
    n: '*Nghị quyết của Bộ Chính trị số 194-NQ/TW, ngày 20 tháng 11 năm 1969, Về chính sách đối với giặc Mỹ lái máy bay bị bắt ở miền Bắc*, signed for the Politburo by Nguyễn Duy Trinh. [[w.van-kien-dang-toan]], XXX, 350–52. Made public: 2004.'
    tags: [polity:drv, polity:us, vis:only:drv, name:nguyen-duy-trinh]
  - id: cal.1969-11-21.vietnam-hanoi
    when: Nov. 21
    date: '1969-11-21'
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 242-TT/TW on the industrious, simple and honest life of the revolutionary, against abuse and embezzlement of state and collective property: some cadres abuse their posts, keep slush funds, set their own perquisites, take state materials for private houses. Slush funds forbidden and returned to the budget; abuse of office forbidden; the people to criticize and watch over cadres.'
    n: '*Thông tri của Ban Bí thư số 242-TT/TW, ngày 21 tháng 11 năm 1969, Về việc phát huy lối sống cần cù, giản dị, liêm khiết của người cách mạng; chống lạm dụng, tham ô tài sản của Nhà nước và của tập thể*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 353–56. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-11-29.vietnam-hanoi
    when: Nov. 29
    date: '1969-11-29'
    thread: vietnam-hanoi
    also: [soviet-union]
    c: 'The Politburo, in the morning, decides to preserve Hồ Chí Minh''s body for the long term and build his mausoleum, open to visitors in 1971: white pillow and mattress, khaki clothes of his own cut, a thin blanket, his sandals in a small glass case. The mausoleum modern yet national, solemn yet simple, at historic Ba Đình; an agreement to be signed with the Soviet Union for its help; the Central Military Commission to guard the body, the Architecture Ministry to build.'
    n: '*Thông báo của Ban Bí thư số 14-TB/TW, ngày 4 tháng 12 năm 1969, Quyết định của Bộ Chính trị về việc giữ gìn thi hài Hồ Chủ tịch và xây dựng lăng mộ của Người* (the session of Nov. 29), signed for the Secretariat by Lê Văn Lương; placed by subject, out of date order, by the editors (328 n.). [[w.van-kien-dang-toan]], XXX, 328–29. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, polity:ussr, vis:only:drv, name:ho-chi-minh]
