    date: '1969-11-28'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the delegates to several specialty conferences of the defense industry and speaks: revolution and war preparation are to be joined, war preparation to influence revolution and revolution to support it; defense production cannot be discussed apart from total production, there being a balance to strike among all of industry and agriculture, and equipment, materials and building force are limited, so every effort must be made to dig out potential. Cadres, those who erred too, are to be freed early and given work, old cadres having experience, the Party''s precious property, and long "standing aside" wastes their trade and their politics; most intellectuals can be educated, a part of great potential to be valued, trained and taught.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 329 (Nov. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-28.china-leadership-2
    when: Nov. 28
    date: '1969-11-28'
    thread: china-leadership
    c: 'Mao 毛泽东, Lin Biao 林彪 and Zhou Enlai 周恩来 telegraph Enver Hoxha 恩维尔·霍查, Haxhi Lleshi 哈奇·列希 and Mehmet Shehu 穆罕默德·谢胡 at Tirana 地拉那 on the twenty-fifth anniversary of Albania''s liberation: twenty-five years ago the Albanian people, led by the Party of Labor under Hoxha, beat the Italian and German fascist occupiers by their own strength.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 477–479 (Nov. 28, 1969; printed from *Renmin ribao*, Nov. 29, 1969). Names: Mao Zedong, Lin Biao, Zhou Enlai, Enver Hoxha, Haxhi Lleshi, Mehmet Shehu.'
    src:
      c: 4f017c19
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 477–479: all'
    tags: [polity:prc, polity:albania, name:mao-zedong, name:lin-biao, name:zhou-enlai]
  - id: cal.1969-11-29.vietnam-hanoi
    when: Nov. 29
    date: '1969-11-29'
    place: hanoi
    thread: vietnam-hanoi
    also: [soviet-union]
    c: 'The Politburo, in the morning, decides to preserve Hồ Chí Minh''s body for the long term and build his mausoleum, open to visitors in 1971: white pillow and mattress, khaki clothes of his own cut, a thin blanket, his sandals in a small glass case. The mausoleum modern yet national, solemn yet simple, at historic Ba Đình; an agreement to be signed with the Soviet Union for its help; the Central Military Commission to guard the body, the Architecture Ministry to build.'
    n: '*Thông báo của Ban Bí thư số 14-TB/TW, ngày 4 tháng 12 năm 1969, Quyết định của Bộ Chính trị về việc giữ gìn thi hài Hồ Chủ tịch và xây dựng lăng mộ của Người* (the session of Nov. 29), signed for the Secretariat by Lê Văn Lương; placed by subject, out of date order, by the editors (328 n.). [[w.van-kien-dang-toan]], XXX, 328–29. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, polity:ussr, vis:only:drv, name:ho-chi-minh]
  - id: cal.1969-11-29.china-leadership
    when: Nov. 29
    date: '1969-11-29'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai, on a situation paper the Foreign Ministry printed, writes: Chinese diplomats and translators too must make advances to the envoys of countries friendly to China, a major diplomatic task; they are not to "sit at home with the door shut, afraid of ghosts knocking".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 329 (Nov. 29, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
