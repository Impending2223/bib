    place: peking
    thread: china-leadership
    c: Zhou attends the reception given by Albania's ambassador Robo for the twenty-fifth anniversary of Albania's liberation.
    n: '[[w.zhou-enlai-waijiao-huodong]], 546 (Nov. 29, 1969; evening; Beijing). Names: Zhou Enlai.'
