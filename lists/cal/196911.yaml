    c: Zhou Enlai, receiving the Chinese Party and government delegation about to visit Albania, says that to speak only of American-Soviet collusion and not of their contention is very one-sided; the center of their contention is now the Middle East; seeing only collusion leaves some questions unexplained; to put it as the contradiction of only two camps is one-sided; analysis of the international situation is analysis of contradictions, how can one not see them?
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 327–328 (Nov. 21, 1969). Made public: 2020. Names: Zhou Enlai.'
