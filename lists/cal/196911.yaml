  - id: cal.1969-11-23.china-leadership
    when: Nov. 23
    date: '1969-11-23'
    time: 1969-11-23T12:15Z
    thread: china-leadership
    also: [vietnam-hanoi, soviet-union]
    c: 'Zhou Enlai, meeting Lê Thanh Nghị, Hoàng Văn Hoan and others: since the Zhenbao incident in March word has come from Moscow that the Soviet Union would bomb China''s strategic and atomic bases with nuclear weapons; the Soviet government has never denied it; he asked Kosygin to his face and he neither answered nor cleared it up; China raised it several times at the boundary talks and had no answer. They have a guilty conscience, and from a position of strength try to frighten with the atom bomb, which cannot frighten China. The nianpu''s note: at the Peking airport on Sept. 11 Zhou told Kosygin that if they used pre-emptive means to crush China''s nuclear bases China would declare it war and aggression and resist to the end, though it did not wish it so.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 328 (Nov. 23, 1969); [[w.zhou-enlai-waijiao-huodong]], 546 (Nov. 23, 1969; 8:15 p.m., Fujian Hall, Great Hall of the People; the book gives Lê Thanh Nghị and Hoàng Văn Hoan as Politburo members of the Vietnam Workers'' Party and says the talk was on the situation of the Sino-Soviet boundary talks). Made public: 1993. Names: Zhou Enlai.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, vis:only:prc+drv]
    time_zone: Asia/Shanghai
  - id: cal.1969-11-24.china-leadership
    when: Nov. 24
    date: '1969-11-24'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the State Council business group criticizes the coal, metallurgy and railway sectors: coal is industry''s grain and should lead, and its failure to rise hurts everything; coal output of Pingdingshan in Henan and of Shandong, Shanxi, Inner Mongolia, Yunnan, Guizhou and Sichuan is poorly done, is it factionalism or what? Cadres who know the work are to be freed soon. Metallurgy has failed its plan in many ways, worse than coal, Anshan included; steel is first to meet the needs of defense, then power, machine tools, railways and cars, with key steels pressed and not all at once. Railways had many accidents this half year, over 2,000 wagons wrecked, more than in the Red Guard time; a blocked railway hurts both war preparation and production. Coal is to be taken up by Ji Dengkui, rail transport by Yu Qiuli, and production raised in coal, oil, chemicals, railways, communications and posts.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 328 (Nov. 24, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
