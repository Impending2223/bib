  - id: cal.1969-11.china-leadership-13
    when: Nov., before the 3rd
    date: 1969-11
    at: before 1969-11-03
    place: nanchang
    thread: china-leadership
    c: Nanchang 南昌. The departments concerned, by Zhou Enlai's 周恩来 instruction, install heating at Chen Yun's 陈云 new lodging, and decide that he shall squat at the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂, two li from it.
    n: '[[w.chen-yun-nianpu-xiuding]], III, 172. See [[cal.1969-10-18.china-leadership-4]]. Made public: 2015. Names: Chen Yun, Zhou Enlai. Check: the month; the nianpu has it done only beforehand, before the move of Nov. 3, on Zhou''s instruction of Oct. 18.'
    tags: [polity:prc, name:chen-yun, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11.china-leadership-14
    when: Nov., late
    date: 1969-11
    at: before 1969-11-21
    place: nanchang
    thread: china-leadership
    c: Nanchang 南昌. Chen Yun 陈云 begins to go in turn to each shop of the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂 for the squads' political study meetings and "five-good" 五好 appraisal meetings (by the nianpu's note good in political thought, military skill, the "three-eight" style 三八作风, the fulfilling of tasks and physical training, an army campaign spread in the Cultural Revolution to factories and schools), and talks one by one with cadres, workers and technicians on the works' production and the staff's life.
    n: '[[w.chen-yun-nianpu-xiuding]], III, 173. Made public: 2015. Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc]
