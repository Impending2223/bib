  - id: cal.1969-11.china-leadership
    when: Nov., after the 9th
    date: 1969-11
    at: after 1969-11-09
    thread: china-leadership
    c: 'Mao 毛泽东, on Li Liuru''s 李六如 letter of Nov. 10 (with the cadres'' dispersal from Peking the Center has sent him to Guangxi 广西; old and frail, he asks to go home to Pingjiang 平江, Hunan 湖南, where he can be looked after, and asks the Center for an early verdict on his history): "Wang to deal with as he sees fit."'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 476 (Nov. 1969). The editors gloss "Wang" as Wang Dongxing 汪东兴 (n.2). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Li Liuru, letter of Nov. 10, 1969 to Mao (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 476 n.1). Names: Mao Zedong, Li Liuru, Wang Dongxing. Check: the day; the book gives Nov. 1969, and the letter is of Nov. 10. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
    src:
      c: f409d987
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 476: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 476 n.1: all'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-11.vietnam-hanoi
    when: Nov., late
    date: 1969-11
    at: before 1969-11-21
    place: my-tho
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Mỹ Tho. Companies 1 and 3 of Battalion 514C ambush seven Civil Guard companies on Route 20; Company 2 raids at Chợ Bung, Châu Thành Bắc, on Route 4: 17 pacification teams destroyed and 27 engineer vehicles, by the history''s count. Region 8''s task for the last months is set as breaking the pacification program.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 144–45 and its note. Check: the days; the history gives "cuối tháng 11-1969".'
    tags: [polity:drv]
  - id: cal.1969-11.vietnam-hanoi-2
