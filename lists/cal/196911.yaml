    date: 1969-11
    at: before 1969-11-21
    place: binh-chanh-bridge
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Route 26. A sapper team under Lê Văn Phích brings down the Bình Chánh bridge, 100 meters, closing the road for two months.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 146 and n. 1. Check: the province; the history does not name it.'
    tags: [polity:drv]
