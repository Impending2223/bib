    when: Nov., after the 13th
    date: 1969-11
    at: after 1969-11-13
    place: maanshan
    thread: china-leadership
    c: Ma'anshan 馬鞍山. The city's people's security group 市人保組 (the military control commission), calling the auditorium fire the class enemy's arson, holds six of the company's "suspects" for examination; one, under torture, confesses to a "Special Executive Committee of the No. 17 Metallurgical Company, Ma'anshan district, of the Chinese National New Life Party" 中華民族新生黨, and names many leading cadres of Wuhu 蕪湖, Chizhou 池州, Ma'anshan and the Ma'anshan Steel Company as its members, its rising foiled and the fire set instead.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 629. Made public: 2011. To check: Yin Shusheng 尹曙生, 〈安徽文革「清隊」檔案揭秘〉, *Yanhuang chunqiu* 《炎黃春秋》, 2011, no. 1 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 629 n.115).'
