  - id: cal.1969-11-07.vietnam-hanoi
    when: Nov. 7
    date: '1969-11-07'
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'The Provisional Revolutionary Government''s statement: Nixon''s "Vietnamization" a policy of Vietnamese fighting Vietnamese, to prolong the war, keep the new colonialism in the South and divide Vietnam for good; the withdrawals by drops to calm American opinion.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 37. See [[cal.1969-11-06.vietnam-hanoi]]. Names: Nixon.'
    tags: [polity:drv, polity:us, name:nixon-richard-m]
  - id: cal.1969-11-07.china-leadership-4
    when: Nov. 7
    date: '1969-11-07'
    place: peking
    thread: china-leadership
    c: 'Peng Dehuai 彭德怀 to the sentry 哨兵: have a pear. The sentry: who would eat your stinking pear? Stung, he cries out: so fierce!'
    n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1969-11-08.china-leadership
    when: Nov. 8
    date: '1969-11-08'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, hearing the heads of the National Defense Industry Office''s departments, says no more Third Front projects can be arranged in Sichuan: modern war is solid war and projects must not be too many or too crowded; the rule in building factories is to change large to small and many to good; production and building are not done by sea of men but short, small and lean.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-08.china-leadership-2
    when: Nov. 8
    date: '1969-11-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai, hearing the State Capital Construction Commission's military representative on sending staff down, proposes that Gu Mu need not go to a cadre school but go to the Third Front capital construction engineer corps to investigate and sum up experience.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-08.china-leadership-3
    when: Nov. 8
    date: '1969-11-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai presides over the Politburo meeting on Inner Mongolia.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 8, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-09.china-leadership
    when: Nov. 9
    date: '1969-11-09'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on Yu Qiuli''s forwarding of the report on the stoppage of the Baotou Steel works, writes Li Xiannian, Ji Dengkui, Yu Qiuli and Zhu Huning: "Baotou Steel puts the main reason it makes no steel on rail transport; please verify." The works'' revolutionary committee''s Nov. 8 report says it has been stopped since Oct. 28, eleven days, chiefly for poor rail transport and also serious internal anarchism; Yu''s comment holds the cause not wholly transport but also the works'' and the railway bureau''s internal problems.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 9, 1969); [[w.macfarquhar-maos-last-revolution]], 301 (one of the biggest steel plants of the north, at Baotou, halted almost two weeks; its leaders blame rail stoppages, Zhou''s other sources "serious anarchy within the plant itself"). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 305, 333, 335, cited by [[w.macfarquhar-maos-last-revolution]], 301 n.79). To check: [[w.zhou-enlai-nianpu-1949]], III, 305, 333, 335 (cited by [[w.macfarquhar-maos-last-revolution]], 301 n.79). Names: Zhou Enlai, Li Xiannian.'
    src:
      c: 9e0643e8
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 326: ?'
        - 'w.macfarquhar-maos-last-revolution 301: A-B'
    tags: [polity:prc, name:zhou-enlai, name:li-xiannian, vis:only:prc]
  - id: cal.1969-11-09.china-leadership-2
    when: Nov. 9
    date: '1969-11-09'
    thread: china-leadership
    also: [china]
    c: Deng Xiaoping 邓小平 and Zhuo Lin go to the Xinjian County Tractor Repair Works to labour. Deng is first set to wash parts and read drawings, then, at his own request, made a fitter, working parts with a file; Zhuo Lin is put in the electricians' team, washing coils with the women workers.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Nov. 9, 1969). The words: 上午 (III, 1950). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
    src:
      c: 6b011acd
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1950: all'
    tags: [polity:prc, name:deng-xiaoping, vis:only:prc]
    time_range:
      - 1969-11-08T22:00Z
      - 1969-11-09T04:00Z
    time_band: morning
    time_zone: Asia/Shanghai
  - id: cal.1969-11-09.vietnam-hanoi
    when: Nov. 9
    date: '1969-11-09'
    place: bu-prang
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: Bu Prăng to Đức Lập. With artillery in support the infantry takes a series of posts along the line. The 66th Regiment presses west of Bu Prăng and Hills 882 and 883; Saigon sends Task Force 220 and two reconnaissance companies to relieve.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-10-29.vietnam-hanoi]].'
    tags: [polity:drv]
  - id: cal.1969-11-10.soviet-union-leadership
    when: Nov. 10
    date: '1969-11-10'
    place: moscow
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Brezhnev receives the Sudanese delegation led by Nimeiri, 4 to 6 p.m., Suslov, Ponomarev and others taking part.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 370 (Nov. 10). Names: Brezhnev, Nimeiri, Suslov, Ponomarev.'
    tags: [name:brezhnev-leonid, name:suslov-mikhail-a, name:ponomarev-boris-n, name:numayri-gafar-m-jaafar-nimeiry, polity:ussr, polity:sudan]
    time_range:
      - 1969-11-10T13:00Z
      - 1969-11-10T15:00Z
    time_zone: Europe/Moscow
  - id: cal.1969-11-10.china-leadership
    when: Nov. 10
    date: '1969-11-10'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the heads of the National Defense Science and Technology Commission, the National Defense Industry Office, the State Science and Technology Commission and the Academy of Sciences, and the heads of the workers'' and PLA propaganda teams and military control commissions stationed at the Commission and the Second and Seventh Ministries: the propaganda teams in the defense research systems are to be withdrawn, having done their task; the units have production tasks in cutting-edge technology and lost much work in three years; to catch up with the advanced countries they must seize the time and begin with concrete projects fitting present conditions.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 10, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-10.china-leadership-2
    when: Nov. 10
    date: '1969-11-10'
    place: kaifeng
    thread: china-leadership
    also: [china]
    c: Kaifeng. Liu Shaoqi is in critical condition a third time.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Nov. 10, 1969). Made public: 1996. See [[cal.1969-10-31.china-leadership-3]]. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-11-11.vietnam-hanoi
    when: Nov. 11
    date: '1969-11-11'
    place: long-tien-cai-lay
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Ô Môi, Long Mạnh canal, Long Tiên, Cai Lậy. Regiment 1 of Region 8 ambushes the Saigon 7th Division''s 20th Battalion: hundreds killed or captured, 200 weapons taken, by the history''s count; the local forces then break up nearly all the civil defense units in ten villages of Cai Lậy.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 144.'
    tags: [polity:drv]
  - id: cal.1969-11-12.china-leadership
    when: Nov. 12
    date: '1969-11-12'
    time: 1969-11-11T22:45Z
    place: kaifeng
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Liu Shaoqi dies at Kaifeng, Henan, 6:45 a.m., aged 71: chairman of the PRC and formerly vice-chairman of the Central Committee.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 12, 1969. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Nov. 12, 1969; Liu dies at Kaifeng, Henan, at 6:45 a.m.); [[w.macfarquhar-maos-last-revolution]], 278 (of pneumonia); [[w.mao-zedong-zhuan]], VI, ch. 77 (the book''s year after Oct. 31, 1968: on Nov. 12 Liu Shaoqi, gravely ill, dies at his place of confinement at Kaifeng, Henan, aged seventy-one, ''wronged'' as the book puts it, ''the greatest unjust case in the history of the Party and the Republic''; the book gives no hour and no office held). [[w.yang-jisheng-tiandi-fanfu]], II, 706 (in the basement vault of a bank at Kaifeng where he was held; cremated as "Liu Weihuang," "a patient of a virulent infectious disease"); [[w.dikotter-cultural-revolution]], 235 n.8 (a month after his expulsion Liu dies in solitary detention, too weak to rise, unwashed, covered in bedsores, his hair long, tied down with gauze strips for fear he might kill himself; beaten at meetings after his arrest in 1967, denied medicine for his diabetes, kept alive until the Ninth Congress; Zhou, put in charge of his case by Mao, calls him "a criminal traitor, enemy agent and scab"); [[w.chen-yun-nianpu-xiuding]], III, 172 (Liu Shaoqi, wronged, dies at Kaifeng, Henan, aged seventy-one). Made public: Check (1980 at the latest, at his rehabilitation). To check: [[w.dittmer-death-and-transfiguration]], 459–460 (cited by [[w.macfarquhar-maos-last-revolution]], 278 n.18); [[w.gao-wenhua-dageming-shinian-shi]], 178 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 706 n.41); [[w.jiaqi-turbulent-decade]], 159–163 (cited by [[w.dikotter-cultural-revolution]], 235 n.8). Names: Liu Shaoqi. Check: the chronology gives no word on how and when the Center was told, or on whether Mao was; the date of its being made public.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-11-12.vietnam-hanoi
    when: Nov. 12
    date: '1969-11-12'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the thirty-first congress of the Communist Party of Great Britain: greetings on its fight against the monopolies, for Britain''s leaving NATO and the removal of American bases; thanks for its support of Vietnam and for John Gollan''s delegation to Hồ Chí Minh''s funeral.'
    n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 11 năm 1969, gửi Đại hội lần thứ XXXI Đảng Cộng sản Anh* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Names: Gollan, Hồ Chí Minh. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, vis:only:drv+uk, name:ho-chi-minh]
  - id: cal.1969-11-12.china-leadership-2
    when: Nov. 12
    date: '1969-11-12'
    place: nanchang
    thread: china-leadership
    c: 'Nanchang 南昌. Chen Yun 陈云 goes to the Jiangxi Chemical and Petroleum Machinery Works 江西化工石油机械厂 (by the nianpu''s note made in the Cultural Revolution the 28th Regiment of the Jiangxi Production and Construction Corps 江西生产建设兵团第28团, with 10 companies, or shops, and over 100 squads) and tells its heads who come out to meet him: "I am a man who has made big mistakes, come to your works to be re-educated by the working class." After hearing their account of the works he says he will squat company by company and squad by squad, attending the squads'' production meetings and political study, and with them visits each of its sections and offices. From then he goes to the works each morning and reads at his lodging in the afternoons and evenings.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 172. See [[cal.1969-11-03.china-leadership]]. The words: 上午 (172). Made public: 2015. Names: Chen Yun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc]
    time_range:
      - 1969-11-11T22:00Z
