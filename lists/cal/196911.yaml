    date: 1969-11
    at: after 1969-11-12
    thread: china-leadership
    c: Liu Shaoqi's 刘少奇 body cremated in great secrecy in the middle of the night under a false name, as a "highly contagious patient," only two workers present; his death never announced in Mao's 毛泽东 lifetime.
    n: '[[w.dikotter-cultural-revolution]], 242 n.1. Made public: 1996 at the latest. To check: [[w.jiaqi-turbulent-decade]], 163 (cited by [[w.dikotter-cultural-revolution]], 242 n.1). See [[cal.1969-11-12.china-leadership]]. Names: Liu Shaoqi, Mao Zedong.'
