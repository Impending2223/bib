  - id: cal.1969-11-09.china-leadership
    when: Nov. 9
    date: '1969-11-09'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on Yu Qiuli''s forwarding of the report on the stoppage of the Baotou Steel works, writes Li Xiannian, Ji Dengkui, Yu Qiuli and Zhu Huning: "Baotou Steel puts the main reason it makes no steel on rail transport; please verify." The works'' revolutionary committee''s Nov. 8 report says it has been stopped since Oct. 28, eleven days, chiefly for poor rail transport and also serious internal anarchism; Yu''s comment holds the cause not wholly transport but also the works'' and the railway bureau''s internal problems.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 9, 1969). Made public: 2020. Names: Zhou Enlai, Li Xiannian.'
    tags: [polity:prc, name:zhou-enlai, name:li-xiannian, vis:only:prc]
  - id: cal.1969-11-10.soviet-union-leadership
    when: Nov. 10
    date: '1969-11-10'
    thread: soviet-union-leadership
    also: [middle-east]
    c: Moscow. Brezhnev receives the Sudanese delegation led by Nimeiri, 4 to 6 p.m., Suslov, Ponomarev and others taking part.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 370 (Nov. 10). Names: Brezhnev, Nimeiri, Suslov, Ponomarev.'
    tags: [name:brezhnev-leonid, name:suslov-mikhail-a, name:ponomarev-boris-n, name:numayri-gafar-m-jaafar-nimeiry, polity:ussr, polity:sudan]
  - id: cal.1969-11-10.china-leadership
    when: Nov. 10
    date: '1969-11-10'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: 'Zhou Enlai receives the heads of the National Defense Science and Technology Commission, the National Defense Industry Office, the State Science and Technology Commission and the Academy of Sciences, and the heads of the workers'' and PLA propaganda teams and military control commissions stationed at the Commission and the Second and Seventh Ministries: the propaganda teams in the defense research systems are to be withdrawn, having done their task; the units have production tasks in cutting-edge technology and lost much work in three years; to catch up with the advanced countries they must seize the time and begin with concrete projects fitting present conditions.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 326 (Nov. 10, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-10.china-leadership-2
    when: Nov. 10
    date: '1969-11-10'
    thread: china-leadership
    also: [china]
    c: Kaifeng. Liu Shaoqi is in critical condition a third time.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Nov. 10, 1969). Made public: 1996. See [[cal.1969-10-31.china-leadership-3]]. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-11-12.china-leadership
    when: Nov. 12
    date: '1969-11-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Liu Shaoqi dies at Kaifeng, Henan, 6:45 a.m., aged 71: chairman of the PRC and formerly vice-chairman of the Central Committee.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 12, 1969. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Nov. 12, 1969; Liu dies at Kaifeng, Henan, at 6:45 a.m.). Made public: Check (1980 at the latest, at his rehabilitation). Names: Liu Shaoqi. Check: the chronology gives no word on how and when the Center was told, or on whether Mao was; the date of its being made public.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-11-12.vietnam-hanoi
    when: Nov. 12
    date: '1969-11-12'
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the thirty-first congress of the Communist Party of Great Britain: greetings on its fight against the monopolies, for Britain''s leaving NATO and the removal of American bases; thanks for its support of Vietnam and for John Gollan''s delegation to Hồ Chí Minh''s funeral.'
    n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 11 năm 1969, gửi Đại hội lần thứ XXXI Đảng Cộng sản Anh* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Names: Gollan, Hồ Chí Minh. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, vis:only:drv+uk, name:ho-chi-minh]
  - id: cal.1969-11-13.china-leadership
    when: Nov. 13
    date: '1969-11-13'
    thread: china-leadership
    also: [economy, india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Fujian revolutionary committee''s report of Nov. 11 to the Center and State Council on problems met in drawing next year''s production plan under "prepare for war, prepare against famine, for the people", writes: "this wire is worth a look; take care in allocating Fujian''s products; build the two provinces'' capacity for self-supplying industry." The report says the production tasks the Center''s departments gave in recent years far exceed capacity and proposes that they be arranged by each place''s industrial base and some reduced or cancelled.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 327 (Nov. 13, 1969). Made public: 2020. Names: Zhou Enlai. Check: the second province named in the nianpu, read by OCR.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-11-14.china
    when: Nov. 14
    date: '1969-11-14'
    thread: china
    also: [africa]
    c: The railway delegations of China, Tanzania and Zambia sign at Lusaka a supplementary agreement on building the Tanzania–Zambia railway, by which China agrees that its starting point, set by the three governments' original agreement, be changed to Tanzania's capital, Dar es Salaam. They also sign minutes on the preparatory work for construction and other papers.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 230 (Nov. 14, 1969).'
    src:
      c: 5ac7cbd4
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 230: all'
    tags: [polity:prc, polity:tanzania, polity:zambia]
  - id: cal.1969-11-17.china-leadership
    when: Nov. 17
    date: '1969-11-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Jiang Qing, on the request of the workers'' and PLA propaganda teams at the Central News Documentary Film Studio and its "Revolutionary Great Alliance Committee" to draw some of the 8341 Unit''s propaganda team at the Peking Film Studio to replace the PLA team at the News Film Studio: Di Fucai is to be asked to draw some of the 8341 Unit''s comrades to take over from the 193rd Division''s military propaganda team; the workers'' team too may withdraw once the 8341 Unit''s men know the plant; the teams at the News Film Studio have been told to prepare. On Nov. 19 Jiang Qing passes the letter to Wang Dongxing: "organizing a team is your work; to ask me to do it is to make it hard for me", and beside Zhou''s "have told ... to prepare" she writes "unnecessary".'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 327 (Nov. 17, 1969). Made public: 2020. Names: Zhou Enlai, Jiang Qing.'
    tags: [polity:prc, name:zhou-enlai, name:jiang-qing, vis:only:prc]
  - id: cal.1969-11-17.china-leadership-2
    when: Nov. 17
    date: '1969-11-17'
    thread: china-leadership
    also: [china]
    c: London. James Murray comments on Michael Wilford's draft paper on Hong Kong.
    n: '[[w.macfarquhar-maos-last-revolution]], 227 n.22 (an example of "calmer approaches" among British diplomats; the note gives no more). Made public: 2006. To check: Murray, comments on Wilford''s draft paper, Nov. 17, 1969, FCO 40/160, PRO (cited by [[w.macfarquhar-maos-last-revolution]], 227 n.22).'
    src:
