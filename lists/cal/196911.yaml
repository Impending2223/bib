    date: 1969-11
    at: after 1969-11-13
    place: maanshan
    thread: china-leadership
    c: 'Ma''anshan 馬鞍山. The case group, mostly army cadres, takes the confession for true and puts several hundred on the inquiry: 712 examined, 133 held, 8 driven to suicide under torture, 1 dead of illness in custody.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 629. Made public: 2011. To check: Yin Shusheng 尹曙生, 〈安徽文革「清隊」檔案揭秘〉, *Yanhuang chunqiu* 《炎黃春秋》, 2011, no. 1 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 629 n.115). Check: the dates (the case''s course after the fire; the page gives none).'
