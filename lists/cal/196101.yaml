  - id: cal.1961-01-02.rules
    when: Jan. 2
    date: '1961-01-02'
    thread: rules
    c: 'Rayburn to a group of liberal Democrats: no restored twenty-one-day rule, and Smith has refused to enlarge the committee. He will recommend that the Democratic caucus remove Colmer and seat a loyal Democrat. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 240 ("On January 2, 1961"). See [[cal.1960-12-31.rules]]. Names: Rayburn, Smith, Colmer, Albert.'
    tags: [name:rayburn-sam, name:smith-howard-w, name:colmer-william-m, name:albert-carl]
  - id: cal.1961-01-02.china-leadership-2
    when: Jan. 2–9
    date: '1961-01-02'
    time: 1961-01-02T09:00Z
    place: rangoon
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai, Jan. 2–9, leads a friendly delegation of over 400 to Burma (government, military, culture and arts, boundary commission, Yunnan, Buddhist, film, press and sports delegations), the largest foreign friendship delegation since 1949. On Jan. 2 at Rangoon he calls on President Win Maung: the boundary settled so smoothly is the first with a neighbor and will be a model.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 383 (Jan. 2, 1961); [[w.zhou-enlai-waijiao-huodong]], 299 (Jan. 2, 1961; 下午3时30分, 总统府, 拜会吴温貌总统和夫人); [[w.macfarquhar-origins-of-the-cultural]], III, 23 n.7 (Zhou in Burma, Jan. 2–9: independence day, the boundary treaty''s instruments exchanged, the £30 million loan); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 181 (Jan. 2–9, 1961; Zhou visits Burma on the government''s invitation with military, cultural, press, film, sports, Buddhist and Yunnan delegations and the Chinese members of the boundary joint commission; he talks with U Nu and attends the Jan. 4 independence ceremony and the exchange of ratifications of the boundary treaty). The time is the first day''s. To check: [[w.agency-chinas-foreign-relations]], 209 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 23 n.7). Names: Zhou Enlai, U Nu, Ne Win.'
