    date: '1961-01-02'
    thread: laos
    c: The Defense Department announces "normal precautionary actions" to raise the readiness of forces in the Pacific.
    n: '[[w.watson-into-the-missile-age]], 655 (the announcement; the United States had called for a meeting of the SEATO Council; not the forces or the hour). To check: *New York Times*, [Jan. 1](https://timesmachine.nytimes.com/timesmachine/1961/01/01/issue.html), [Jan. 2](https://timesmachine.nytimes.com/timesmachine/1961/01/02/issue.html), and [Jan. 3, 1961](https://timesmachine.nytimes.com/timesmachine/1961/01/03/issue.html) (cited by [[w.watson-into-the-missile-age]], 655 n.151). See [[cal.1961-01-02.laos]].'
  - id: cal.1961-01-02.rules
    when: Jan. 2
    date: '1961-01-02'
    thread: rules
    c: 'Rayburn to a group of liberal Democrats: no restored twenty-one-day rule, and Smith has refused to enlarge the committee. He will recommend that the Democratic caucus remove Colmer and seat a loyal Democrat. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 240 ("On January 2, 1961"). See [[cal.1960-12-31.rules]]. Names: Rayburn, Smith, Colmer, Albert.'
    tags: [name:rayburn-sam, name:smith-howard-w, name:colmer-william-m, name:albert-carl]
  - id: cal.1961-01-03.rules
    when: Jan. 3
    date: '1961-01-03'
    thread: rules
    c: 87th Congress convenes. Senate 65 D–35 R, Hickey (D) appointed in Wyoming for Keith Thomson (R), elected and dead in December; House 263–174. Rayburn Speaker; Mansfield and Humphrey lead the Senate Democrats, Dirksen and Kuchel the Republicans; Halleck the House Republicans.
    n: '[107 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf) (1961). [House roll call 1](https://voteview.com/rollcall/RH0870001). [[w.mann-walls-of-jericho]], 295 (Humphrey whip, with Johnson''s help). The Senate sat from noon to 2:44 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=1), [D4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=2). The House sat from noon to 2:30 p.m.: [Daily Digest, D5](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=3), [D6](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=4). To check: [[w.hardeman-rayburn]]. See [[cal.1961-01-03.congress]] (the Democrats'' conference). Names: Hickey, Thomson, Rayburn, Mansfield, Humphrey, Dirksen, Kuchel, Halleck. Check: the page.'
    src:
      c: 92cd7e2f
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf: all'
        - 'https://voteview.com/rollcall/RH0870001: all'
        - 'w.mann-walls-of-jericho 295: E'
    tags: [congress:87, name:hickey-john-j, name:rayburn-sam, name:mansfield-mike, name:humphrey-hubert-h, name:thomson-keith, name:dirksen-everett, name:kuchel-thomas-h, name:halleck-charles-a, committees:87]
