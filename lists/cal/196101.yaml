  - id: cal.1961-01-03.republican-party-congress
    when: Jan. 3
    date: '1961-01-03'
    thread: republican-party-congress
    c: 'Senate Republican conference organizes the 87th Congress, thirty-three present: Saltonstall chairman, Young secretary, Bridges Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Boggs and Miller introduced. Morton: research on the Cabinet nominees, the Policy Committee the focal point. Dirksen: no course of blind opposition, but modify where necessary.'
    n: '[[w.wolff-minutes-of-the-senate]], 867–71 (the elections, 868–69; Morton, 870; Dirksen, 871). See [[cal.1961-01.republican-party-congress]]. Names: Saltonstall, Young, Bridges, Dirksen, Kuchel, Boggs, Miller, Morton.'
    tags: [name:saltonstall-leverett, name:young-milton-r, name:bridges-henry-s, name:dirksen-everett, name:kuchel-thomas-h, name:morton-thruston-b, name:boggs-james-c, name:miller-jack-r]
  - id: cal.1961-01-03.vietnam-hanoi
    when: Jan. 3
    date: '1961-01-03'
    thread: vietnam-hanoi
    c: 'The Secretariat, Hanoi: directive no. 08-CT/TW on mass cultural work: since directive no. 109 of Oct. 21, 1958, wider and beginning to carry the Party''s thought, but weak in ideology and fight, little tied to the political tasks, thin in the countryside, on the building sites and in the mountains. Its aims: the Third Congress''s resolutions and the Party''s policies, science and technique, good literature and art spread; clubs and village culture houses; each committee to set its tasks for 1961.'
    n: '*Chỉ thị của Ban Bí thư số 08-CT/TW về việc tăng cường công tác văn hoá trong quần chúng*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 1–12. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1961-01-04.cuba-bay-of-pigs
    when: Jan. 4
    date: '1961-01-04'
    thread: cuba-bay-of-pigs
    c: 'Hawkins, of the CIA''s paramilitary staff, to Esterline, the project chief: the decisions the strike needs. A lodgment by an all-Cuban force of about 750; air strikes from dawn of D-1 to destroy Castro''s aircraft and ships. The strike in the latter half of February, not after Mar. 1.'
    n: '[FRUS 1961–63, X, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v10/d9). Made public: in part, *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 40–42. See [[cal.1960-03-17.cuba]]. Names: Hawkins, Esterline, Castro.'
