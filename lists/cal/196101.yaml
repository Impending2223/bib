  - id: cal.1961-01-18.china-leadership
    when: Jan. 18
    date: '1961-01-18'
    place: peking
    thread: china-leadership
    c: 'The Huairen Tang, the Ninth Plenum''s last session; Mao speaks. Too little investigation; the "communist wind" not known; Lushan''s fight on the right broke the fight on the left; last year the center''s leaders were absorbed abroad. One account only; equal exchange, pay by work; repay the "communist wind." Steel to stay at 18.45 million tons (Ye Jianying''s and Li Weihan''s view): quality now, not quantity. "On the economy we lack experience"; can it be learned in twenty years, not twenty-eight?'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 18, 1961. [[w.lengxi-shinian-lunzhan-1956-1966]], 445–448 (Liu Shaoqi''s speech of Jan. 18 on the Moscow conference, as Wu summarizes it: Mao rightly kept out and made Liu head, in the second line, not arguing openly with Khrushchev; his seniority from Moscow in 1921 counted a little; the Soviets looked strong and were weak at heart: the letter of Nov. 5, then the call of Nov. 9 to say it had nothing to do with the conference; after *Long Live Leninism* they had to grant imperialism unchanged, to seize on the 1957 Declaration, to write in anti-imperialism and support of national liberation, and to sign a statement for unity; Mikoyan and Kozlov came Nov. 26, after Hồ''s petition, to feel China out with the lure of restored aid; Hồ''s invitation of the 28th to meet Khrushchev refused; the Soviets had asked Liu to visit from fear of a split; the struggle may ease: lengthen it, put the strength into home work, start no debate, study basic theory, Stalin''s among it; Mao interjects: not afraid to print their pieces or of a split, only trade would stop; be ready for cultural and economic ties cut, diplomatic ones alone; Liu: the struggle to rise and fall ten years at least; some parties new Social Democrats; capitalism can come back where there is revisionism, as Mao has said; *Pravda* cut the Irkutsk passage); [[w.lengxi-shinian-lunzhan-1956-1966]], 448–449 (Chen Yun at the plenum''s close, mainly on planning and agriculture, also on the Moscow conference: a success, the delegation''s work good; revisionism abroad no wonder; right to fight it, or owe history as a communist; the struggle bears long on the fate of the world''s peoples); [[w.lengxi-shinian-lunzhan-1956-1966]], 449–451 (Mao''s long speech before the plenum closed on the 18th: of the international matter, the Center investigated well and so was resolute; Khrushchev rushed to Bucharest and to the decision sent down to the branches, fearing the three articles; he called them and Deng''s speech ("Nov. 10") China''s factional programme; the 81-party meeting a great success; unity now, even with parties that cursed China; no struggle now, last year''s was needed; Marxism-Leninism to be made concrete in each country, as trunk and branches); [[w.macfarquhar-origins-of-the-cultural]], III, 15–16 (Mao''s speech on the final day); [[w.yang-shangkun-riji]], I, 644 (Jan. 18, 1961; the closing session, 3 to 6 p.m., Yang present; Mao stresses investigation and learning to do construction work; Chen Yun on the market and grain; Liu Shaoqi on the Moscow meeting (note 1: of Nov. 1960)); [[w.deng-xiaoping-nianpu-1904]], III, 1614 (Jan. 18, 1961; Deng at the closing session; Mao asks 1961 to be a year of investigation); [[w.mao-zedong-zhuan]], V, ch. 67 n.9 (Jan. 18: Mao asks that 1961 be a year of investigation, a wind of investigation and research). Made public: 1999. Check: the speakers: Wu (445–449) has Liu Shaoqi and Chen Yun speak on the Moscow conference at the plenum''s close, Jan. 18, as well as Mao. Check: Yang Shangkun''s diary has the closing session from 3 to 6 p.m., with Chen Yun on the market and grain and Liu Shaoqi on the Moscow meeting after Mao ([[w.yang-shangkun-riji]], I, 644); a time field. To check: [[w.tse-tung-miscellany-of-mao-tse]], 2, 239 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 15 n.24); [[w.mao-zedong-sixiang-wan]], 263 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 15 n.25b); [[w.mao-zedong-sixiang-yuanli]], 338 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 15 n.25c); [[w.schoenhals-paper-presented-to-the]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 15 n.25d); [[w.selections-from-china-mainland]], No. 633, 18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37b); [[w.dangshi-yanjiu]], 21–33 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37d); [[w.xiaozu-huainian-zhou-enlai]], 38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37e); [[w.dangdai-zhongguo-jingji]], 353–61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37f); Mao Zedong 毛泽东, speech at the Ninth Plenum of the Eighth Central Committee 中共八届九中全会, Jan. 18, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.9). Names: Mao Zedong, Ye Jianying, Li Weihan, Li Fuchun.'
