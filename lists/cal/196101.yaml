    c: 'Mao 毛泽东, 6:50 p.m., to Hu Qiaomu 胡乔木 and Wu Lengxi 吴冷西, on their draft of the Ninth Plenum''s communiqué: read, very good; to be sent out at once, in every paper tomorrow, the 21st; translated into several languages and broadcast tonight. He adds that all this work must be done by fully arousing the masses, with free airing of views, on a grand scale, and inserts ''based on the production team'' before ''three-level ownership''. On the draft of the evening of Jan. 19, by the passage on cutting capital construction in 1961: ''the remaining two years done so too''.'
