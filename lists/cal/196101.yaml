    when: Jan. 21
    date: '1961-01-21'
    thread: transition-and-staff
    c: 'The White House, Saturday morning. Truman, the first visitor of Kennedy''s presidency, calls on him, his first visit since leaving the house eight years before. Truman to the photographers in the West Wing lobby: Kennedy would be a President who would allow them "the one more picture" they always ask; "I heard the other fellow wouldn''t stand for it."'
