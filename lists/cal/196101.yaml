  - id: cal.1961-01-09.transition-and-staff
    when: Jan. 9
    date: '1961-01-09'
    place: massachusetts
    thread: transition-and-staff
    c: 'Cambridge. The President-elect to the Massachusetts Legislature and the Harvard Overseers. At Schlesinger''s house: Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser''s; Wiesner on science adviser; the tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed.'
    n: '[[w.schlesinger-thousand-days-1965]], 162; [[w.odonnell-johnny-we-hardly-knew]], 274–75 (the Massachusetts legislature, the Harvard Overseers; at Schlesinger''s house in Cambridge with Bundy and Wiesner; Schlesinger signed that day, "We''ll keep your appointment quiet until after the Senate confirms Chester Bowles"; not Chayes, Seaborg or the tax task force); [[w.schlesinger-journals]], 102 (Kennedy''s visit to 109 Irving Street on Jan. 9, Secret Service and police around the house, about 300 people in the cold, arriving about 2:20 and leaving shortly before 5; Schlesinger with him 2:30 to 3:30, then Surrey''s tax task force, Chayes, Bundy, Stratton and Wiesner; Bundy proposes Seaborg for the AEC and, after talking with Kennedy, calls him from the house; the page does not say he offered it, nor mention the Legislature, the Overseers or Bundy''s post; Schlesinger''s appointment as Special Assistant is a footnote); [[w.sorensen-counselor]], 219–20 (Kennedy''s "Farewell to Massachusetts," delivered Jan. 9, drafted by Sorensen at the height of the transition; the "city upon a hill" from Winthrop and questions on integrity borrowed from Roosevelt; Kennedy''s parents thought it should have been kept for the inaugural; not Cambridge, the Overseers or the other business of the day). [[w.sorensen-kennedy]], 233–34 (the legislature; the Overseers). See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Bundy, Chayes, Wiesner, Seaborg, Schlesinger, Bowles. Check: the address''s text.'
