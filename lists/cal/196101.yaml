  - id: cal.1961-01-01.republican-party
    when: Jan. 1
    date: '1961-01-01'
    thread: republican-party
    c: 'Valiukas to Hermann, of the national committee, copies to Nixon, Rockefeller, Goldwater and Bridges: with Bridges that Nixon threw away a won election; the party lost for want of leadership, Eisenhower a "very poor Party leader," Nixon and Lodge neglecting the minorities and nationalities; the committee to hire a nationalities expert.'
    n: '[[w.gifford-center-cannot-hold]], 193–94 (quoting it). To check: Valiukas to Hermann, Jan. 1, 1961, Series 320, Box 778, "Valiukas," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 194 n.81). Names: Nixon, Rockefeller, Goldwater, Bridges, Eisenhower, Lodge.'
    src:
      c: 661da440
      rows:
        - 'w.gifford-center-cannot-hold 193–94: all'
        - 'via w.gifford-center-cannot-hold 194 n.81: all'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m, name:bridges-henry-s, name:eisenhower-dwight-d, name:lodge-henry-cabot]
  - id: cal.1961-01-01.china-leadership
    when: Jan. 1
    date: '1961-01-01'
    thread: china-leadership
    c: 'Mao 毛泽东, on the Center''s draft directive of Jan. 1 forwarding the Xinyang 信阳 prefectural committee''s report: to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德, Chen Yun 陈云, Deng Xiaoping 邓小平 and Peng Zhen 彭真 to read at once, then Yang Shangkun 杨尚昆 to print. He rewrites a passage: in every commune and team, rectification, production and famine relief, and the people''s livelihood to be taken up together and done well together.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 463–465 (Jan. 1, 1961; Mao''s comment and revision on the Center''s draft directive of Jan. 1, 1961; printed from the manuscript and his revised copy). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). See [[cal.1960-12-31.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Yang Shangkun.'
    src:
      c: 86b2933a
      rows:
        - 'w.jianguo-yilai-mao-zedong XV, 463–465: all'
    tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:zhu-de, name:chen-yun, name:deng-xiaoping, name:peng-zhen, vis:only:prc]
