    also: [goldwater]
    c: 'Washington. The Republican National Committee in closed session, its first since the election. Goldwater, asked by Morton to keep from controversy, against Keating''s proposed national policy board: "We do not need a fancy advisory group such as the Democrats have." The Committee to be supreme in future campaigns, to heavy applause. Morton names Bliss, Ohio''s chairman, to head a committee on the big-city vote: "tell us what steps have to be taken everywhere to erode the monolithic Democratic big city vote." That night Nixon''s party for the Committee at the Columbia Country Club, Chevy Chase, Md.: three or four at a time stop to talk with him.'
    n: '[[w.novak-agony-of-the-g]], 38–39 & n.2 (the Keating proposal pigeonholed despite Morton''s support); [[w.novak-agony-of-the-g]], 49 (the date; the applause; the party); [[w.novak-agony-of-the-g]], 54 (Bliss''s committee, at "its first postelection meeting at Washington in January, 1961"). Names: Goldwater, Morton, Keating, Bliss, Nixon. Check: Novak, 38, puts the address "the next day" after the conference''s reconvening.'
