    c: 'The Senate Republican conference reconvenes. Goldwater gives the press his remarks to it: "In light of the 1960 election results in New York, I think it is particularly inappropriate that a member of the Republican leadership of that state should seek to prescribe the pattern of political conduct of the party nationally." Javits drops his opposition on Goldwater''s pledge to stay out of States where he is not wanted or would hurt the party''s candidates; Goldwater re-elected chairman of the Senate campaign committee by the thirty-five Republican Senators, unanimously.'
