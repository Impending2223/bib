  - id: cal.1961-01-05.economy
    when: Jan. 5
    date: '1961-01-05'
    thread: economy
    c: 'Samuelson''s task force reports to the President-elect: a recession under way and a weak recovery ahead. Spend sooner on programs already wanted; hold a temporary tax cut in reserve.'
    n: '[[w.stein-fiscal-revolution-in-america]], 386, 388; [[w.sundquist-politics-and-policy]], 36 (the report: a recession; spending increases; a temporary tax cut a "second line of defense"; not the day). The Fed: [[w.meltzer-history-of-the-federal]]. The dollar: [[w.triffin-gold-and-the-dollar]]. Figures: FRASER for what was published at the time, FRED for the revised series (K–J Adm. II.K). [[w.sorensen-kennedy]], 396 (the report, a recession). To check: [[w.economy-prospects-and-policies-for]]; [[w.stein-presidential-economics]]; [[w.heller-new-dimensions-of-political]]; [[w.okun-political-economy-of-prosperity]]; [[w.collins-more]]; [[w.president-and-the-council]]; [[w.bremner-chairman-of-the-fed]]; [[w.garbade-after-the-accord]]; [[w.roosa-dollar-and-world-liquidity]]; [[w.solomon-international-monetary-system-1945]]. Names: Samuelson. Check: Sundquist, 36, has the report issued Jan. 6, 1961.'
