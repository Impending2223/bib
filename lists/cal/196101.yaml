    c: 'Kennedy, reviewing a near-final draft of the State of the Union, done in an all-night session, finds its warnings insufficient and inserts: "Each day the crises multiply. Each day their solution grows more difficult. Each day we draw nearer the hour of maximum danger." Sunday, after church, in the Mansion, he adds: "There will be further setbacks before the tide is turned." By Sorensen''s account.'
