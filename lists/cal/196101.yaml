    tags: [polity:prc]
  - id: cal.1961.soviet-union-2
    when: '1961'
    date: '1961'
    place: new-delhi
    thread: soviet-union
    also: [china]
    c: New Delhi. The Afro-Asian Solidarity Council's meeting. Soviet delegates again put disarmament and the "world without arms" first and are left cold. India's delegate, for fear of offending the United States, whose aid it wants, will not raise the anti-colonial banner, which Afro-Asian and Latin American delegates resent. The Chinese call for support of peoples' struggles against old and new colonialism and national independence and economies, and most delegates agree.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 454–455 ("in 1961"; the day not given). See [[cal.1961.soviet-union]]. Check: the date and the Chinese delegates'' names; Wu gives the year only.'
