  - id: cal.1961-01-03.congress
    when: Jan. 3
    date: '1961-01-03'
    thread: congress
    also: [democratic-party]
    c: 'Senate Democrats in caucus. Mansfield, Johnson''s choice to succeed him as majority leader, moves that Johnson preside over the caucus as Vice President. Gore against: "This caucus is not open to former senators." Carried, 46–17, against loud protest. Johnson never uses the role.'
    n: '[[w.dallek-flawed-giant]], 8 (the caucus, the motion, Gore, the vote); [[w.caro-passage-of-power]], 164–69 (the conference, the protest, the role unused; no count given); [[w.mann-walls-of-jericho]], 291–92 (the day; the motion; Gore and Clark against; Mansfield''s threat to resign; 46–17); [[w.shesol-mutual-contempt]], 63–64 (the conference, sixty-four Democrats; Mansfield''s motion; Clark and Gore against; 46 to 17, from *Time*); [[w.bernstein-guns-or-butter]], 8 (Clark, Gore, Anderson, Johnston and Robertson against). [[w.humphrey-education-of-a-public-1976]], 243 (Johnson presides at the caucus''s first meeting; Russell later tells him he cannot keep the power). Senate Democratic Conference, 1903–1964, pp. 581–83, Senate Democratic Conference (the minutes as published); Drew Pearson, Washington Post, Jan. 18, 1961 (cited by [[w.caro-passage-of-power]], 169). Names: Mansfield, Johnson, Gore. Check: Dallek gives Jan. 5, "seventeen days before taking office" (8), which would be Jan. 3. Check: Mann, 291, gives Gore''s words as "We might as well ask Jack [Kennedy] to come back up and take his turn at presiding," and Jan. 3. Check: Humphrey: Johnson "presided at the first meeting of the caucus" (243).'
