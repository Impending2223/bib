        - 'w.perlstein-before-the-storm 107: all'
  - id: cal.1961-01-03.rules
    when: Jan. 3
    date: '1961-01-03'
    thread: rules
    c: 87th Congress convenes. Senate 65 D–35 R, Hickey (D) appointed in Wyoming for Keith Thomson (R), elected and dead in December; House 263–174. Rayburn Speaker; Mansfield and Humphrey lead the Senate Democrats, Dirksen and Kuchel the Republicans; Halleck the House Republicans.
    n: '[Cong. Rec., Senate, Jan. 3, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf). [House roll call 1](https://voteview.com/rollcall/RH0870001). [[w.mann-walls-of-jericho]], 295 (Humphrey whip, with Johnson''s help). To check: [[w.hardeman-rayburn]]. See [[cal.1961-01-03.congress]] (the Democrats'' conference). Names: Hickey, Thomson, Rayburn, Mansfield, Humphrey, Dirksen, Kuchel, Halleck.'
    src:
      c: 92cd7e2f
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf: all'
        - 'https://voteview.com/rollcall/RH0870001: all'
        - 'w.mann-walls-of-jericho 295: E'
    tags: [congress:87, name:hickey-john-j, name:rayburn-sam, name:mansfield-mike, name:humphrey-hubert-h, name:thomson-keith, name:dirksen-everett, name:kuchel-thomas-h, name:halleck-charles-a, committees:87]
  - id: cal.1961-01-03.cuba
    when: Jan. 3
    date: '1961-01-03'
    thread: cuba
    c: 'Castro''s note of Jan. 2: each embassy cut to eleven persons, the Americans to leave in 48 hours. Eisenhower breaks diplomatic and consular relations with Cuba. The Swiss to keep American interests in Havana. At the meeting that decides the break (Herter, Gates, Anderson, Dulles, Gray and others), by Barnes''s notes: the force to be enlarged, up to 1,500 trainees; none trained on American soil; American forces if Cubans harm Americans or attack Guantanamo.'
    n: 'Statement by the President on Terminating Diplomatic Relations With Cuba, [1960–61 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=943). FRUS 1961–63, X, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v10/d1) (the note), [2](https://history.state.gov/historicaldocuments/frus1961-63v10/d2), [7](https://history.state.gov/historicaldocuments/frus1961-63v10/d7) (the American note). FRUS 1961–63, X, doc. [3](https://history.state.gov/historicaldocuments/frus1961-63v10/d3) (Barnes''s notes of the meeting). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 173 (the break); [[w.poole-joint-chiefs-of-staff]], 108 (the break); [[w.bissell-reflections-of-a-cold]], 161–62 (the meeting; Eisenhower present, by Bissell); [[w.paterson-contesting-castro]], 258 n.29 (Castro''s demand, the embassy a "nest of spies"; the break). [[w.jones-bay-of-pigs]], 39–40 (the note; the break; the trainees doubled to 1,500). Check: Paterson dates Castro''s demand Jan. 3 (258). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.bohning-castro-obsession]]; [[w.leogrande-back-channel-to-cuba]]; "Termination of Diplomatic and Consular Relations Between the United States and Cuba," [[w.current-documents-1960]], 251–52 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 173 n.3); Wayne S. Smith, *The Closest of Enemies* (1987), 64 (cited by [[w.paterson-contesting-castro]], 258 n.29). Names: Castro, Eisenhower. Check: Jones has Eisenhower approve the break and direct the enlargement (40); FRUS''s list of those present, from a CIA chronology of May 24, 1961, does not name him.'
