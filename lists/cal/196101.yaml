    thread: latin-america-dominican-republic
    c: 'Mann to Merchant, by memorandum, through Merchant''s special assistant Scott: the dissidents have "consistently asked us to supply them with ''hardware''" and, "rather persistently," for "the more exotic items and devices." He suggests token quantities of items they want, among them small explosive devices, for "sabotage potential"; there "would be no thought of toppling the GODR" by them.'
    n: '[[w.sen-church-alleged-assassination-plots]], 197 (the memorandum, drafted Jan. 11; by Merchant''s notes the Special Group of the same day "agreed in terms of Tom Mann''s memo"; the findings, 270: it did not mention assassination). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Mann to Merchant, Jan. 12, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 197). See [[cal.1961-01-11.latin-america-dominican-republic]]. Names: Mann, Merchant.'
