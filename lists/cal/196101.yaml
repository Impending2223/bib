    c: 'The Central Committee''s third plenum, Hanoi, on the Moscow meeting of the communist and workers'' parties of November 1960. Lê Duẩn''s report for the delegation, "Strengthen unity, advance to new victories!": the socialist system becoming decisive, the colonial system breaking up, a world war preventable; differences among the parties, the Soviet and Chinese above all. The resolution: the new declaration of the 81 parties, with that of 1957, the movement''s common program; in Indochina and Southeast Asia "peace will surely defeat war"; its documents to be studied in the Party.'
