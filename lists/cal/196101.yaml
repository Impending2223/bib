  - id: cal.1961-01-08.china-leadership-3
    when: Jan. 8
    date: '1961-01-08'
    thread: china-leadership
    c: 'The inspection group 檢查組 of the Gansu 甘肅 provincial committee''s health department 衛生廳 reports to the department''s Party group 黨組 and the Dingxi 定西 prefectural committee on Tongwei 通渭 county. For a whole year, 1959–60, rations fell short: the strong weakened, the old died, women''s periods stopped, children wasted; emaciation 消瘦 is the chief ailment and edema 浮腫 its later form, the course running emaciation, edema, emaciation, edema, to coma, heart failure and sudden death. Deaths in Maying 馬營, Bangluo 榜羅 and Disanpu 第三鋪 communes are mostly of this kind; Zhangjiacha 張家岔 village, Dongfanghong 東方紅 brigade, Chengguan 城關 commune, had 204 people in 1958 and since Nov. 1959 a third fewer, 65 of the 128 left ill and 13 dead lately. The report names six causes, among them poor living, wrong substitute foods, raw water and raw food, and abuse within families under shortage.'
    n: '[[w.yang-jisheng-mubei]], I, 154–156. Made public: 2008. To check: Health Department Inspection Group of the Gansu Provincial Committee, report to the department''s Party group and the Dingxi prefectural committee, Jan. 8, 1961 (cited by [[w.yang-jisheng-mubei]], I, 156 n.32). Check: the note closing the passage (I, 156 n.32) is the report of Jan. 8, 1961; the text introduces it as a report of a medical team organized by the provincial health department (省衛生廳組織的醫療隊).'
    src:
      c: 9a34a9fb
      rows:
        - 'w.yang-jisheng-mubei I, 154–156: all'
        - 'via w.yang-jisheng-mubei I, 156 n.32: all'
    tags: [polity:prc, vis:only:prc]
  - id: cal.1961-01-08.china-leadership-7
    when: Jan. 8–10
    date: '1961-01-08'
    thread: china-leadership
    c: 'Fengyang 鳳陽 county committee''s five-level enlarged cadre meeting 五級幹部擴大會議, whose aim is to correct the "five winds", sets its members "to speak and air freely" to expose the problems; Chen Zhenya 陳振亞 chairs, in a tense and serious meeting, and over 90 percent of the speakers have lost people at home, speaking in tears. Its bulletins nos. 4, 5 and 6, of Jan. 8, 9 and 10, record among others: Wang Tinghua 王庭華 of Zongpu 總鋪 commune asks deputy county head Song Zhaoyin 宋兆銀 if he knows that last year a hundred or two in his village starved; a member says the county committee''s officialism was so grave that deaths were not dared reported, 87 of the 300 and more in his village; Wan Deyuan 萬德元, Party secretary of Wudian 武店 commune, tells that at a tobacco-curing meeting in 1959 the county committee claimed more leaf than there was, and that a secretary of the county committee''s secretariat ordered the starved buried three feet deep with crops planted over.'
    n: '[[w.yang-jisheng-mubei]], I, 266–267, 271. Made public: 2008. To check: Fengyang County Committee, five-level enlarged meeting, bulletin no. 4, Jan. 8, 1961 (cited by [[w.yang-jisheng-mubei]], I, 271 n.20a); Fengyang County Committee, five-level enlarged meeting, bulletin no. 5, Jan. 9, 1961 (cited by [[w.yang-jisheng-mubei]], I, 271 n.20b); Fengyang County Committee, five-level enlarged meeting, bulletin no. 6, Jan. 10, 1961 (cited by [[w.yang-jisheng-mubei]], I, 271 n.20c). Check: the opening day; the text gives the meeting as "Jan. 1961" and the bulletins by day. It has Chen Zhenya as deputy head of the county committee''s rural work department, and in the paragraph before as the provincial department''s (both I, 266). Bulletin no. 6 is printed Jan. 10, 1960 at I, 271 n.23 and Jan. 10, 1961 at I, 264 n.15.'
