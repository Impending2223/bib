    c: 'Cambridge. The President-elect to the Massachusetts Legislature and the Harvard Overseers. At Schlesinger''s house: Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser''s; Wiesner on science adviser; the tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed.'
