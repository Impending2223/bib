    tags: [polity:prc]
  - id: cal.1961.soviet-union-3
    when: '1961'
    date: '1961'
    place: stockholm
    thread: soviet-union
    also: [china]
    c: Stockholm. The World Peace Council's meeting. Soviet delegates put disarmament and the "world without arms" first, and meet the same opposition. The Chinese argue that for peace the national independence and national economies of the peoples must be settled and workers in Europe and America supported against monopoly capital; most delegates agree, even many pacifists, who also do not accept omitting the fight against old and new colonialism.
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 454–456 ("in 1961"; the day not given). See [[cal.1961.soviet-union-2]]. Check: the date and the Chinese delegates'' names; Wu gives the year only.'
