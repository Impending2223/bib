  - id: cal.1961-01-14.china-leadership
    when: Jan. 14–18
    date: '1961-01-14'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'The Huairen Tang. The Ninth Plenum of the Eighth Central Committee, Mao presiding. Deng Xiaoping on the Moscow conference: the delegation approved, the Statement and the Appeal endorsed. Li Fuchun on the plans for 1960 and 1961; Chen Yun on steel and grain. Agriculture first; building cut; "adjust, consolidate, fill out, raise"; rural markets revived; rectification by stages; six regional bureaus of the Center set up.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 14, 1961 (the entry for Jan. 14–18). [[w.zhou-enlai-nianpu-1949]], II, 384–85, Jan. 14–18, 1961 (Zhou present; the plenum''s decisions). [[w.lengxi-shinian-lunzhan-1956-1966]], 442–445 (the plenum on Deng''s report on the Moscow meeting: the meeting the largest, longest, fiercest yet, its result fairly good; the open argument from TASS''s statement of Sept. 9, 1959 to the meeting, fifteen months; the CPSU''s means, cold treatment, watching, pressure, siege, fatigue, and its two trumps, pressure and the majority; Deng''s four gains: a good statement, the lid off, the Marxist-Leninist ranks tempered, consultation to agreement set up between the parties; Wu has the plenum decide to put its strength into home adjustment from 1961); [[w.macfarquhar-origins-of-the-cultural]], III, 13–17, 19–21 (the plenum: Mao''s speech; Li Fuchun''s opinions on the 1961 plan; Deng Xiaoping''s report and the resolution on the Moscow conference; the six regional bureaux); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 502 (Jan. 14–18, 1961; Liu attends the Ninth Plenum: the 1960 plan''s fulfillment and the 1961 plan''s main targets; agriculture as the base and big grain; the capital construction line shortened, heavy industry''s pace somewhat lowered; "adjust, consolidate, fill out, raise" adopted; the Twelve Articles and the rectification of the communes to go deep; Mao on a great wind of investigation and study); [[w.yang-shangkun-riji]], I, 643 (Jan. 14–15, 1961; opened 4 p.m. Jan. 14, Deng Xiaoping and Li Fuchun reporting; note 1: Deng on the Moscow meeting of the parties of Nov. 1960, Li on the 1960 plan''s execution and the 1961 plan''s chief targets; Jan. 15 the groups on the two reports); [[w.deng-xiaoping-nianpu-1904]], III, 1612–1613 (Jan. 14–18, 1961; Deng attends; his report on the Moscow meeting and Li Fuchun''s on the 1960 plan and the 1961 targets adopted; "readjustment, consolidation, filling out and raising standards"; agriculture the base; capital construction cut; the twelve articles carried through; the six regional bureaus approved. Deng''s report, the 14th: the meeting unprecedented in size, length and sharpness; the paper on the whole good and revolutionary; the lid lifted; "unanimity through consultation" established; the struggle paused, not ended); [[w.mao-zedong-zhuan]], V, ch. 67 (Jan. 14–18, the Ninth Plenum at Peking: Deng Xiaoping''s report on the Moscow conference, endorsed; Li Fuchun on the plan of 1960 and the main figures of 1961). [[w.yang-jisheng-mubei]], II, 1173 (the Ninth Plenum of the Eighth Central Committee, Jan. 14–18, 1961, in Peking: "adjust, consolidate, fill out, raise"; the real adjustment begins in the second half of 1961). Made public: 1996. Check: MacFarquhar has Li Fuchun give his opinions on the first day. Check: Yang Shangkun''s diary has the plenum open at 4 p.m. Jan. 14 ([[w.yang-shangkun-riji]], I, 643); a time field. To check: [[w.bank-china]], 71 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.18a); [[w.mao-zedong-sixiang-wan]], 258–59, 265–66 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.36a); [[w.xuexi-lishi-jueyi-zhuanji]], 121 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.36b); [[w.selections-from-china-mainland]], No. 633, 18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37b); [[w.dangshi-yanjiu]], 21–33 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37d); [[w.xiaozu-huainian-zhou-enlai]], 38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37e); [[w.dangdai-zhongguo-jingji]], 353–61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.37f); [[w.peking-review]], No. 4, 1961, 7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.40a); [[w.history-of-the-chinese]], 286 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.40b); [[w.renqiong-song-renqiong-huiyilu]], 361–62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.40c); [[w.schurmann-ideology-and-organization-in]], 147–49 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.40d); [[w.teiwes-politics-at-maos-court]], passim (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 16 n.40e); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 434–45 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 17 n.45); [[w.zhongguo-nongye-nianjian-1980]], 34–35 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 17 n.49c); [[w.lardy-chen-yuns-strategy-for]], 174 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 19 n.53); [[w.sino-soviet-dispute]], 207–21, 33–34, 206–207 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 21 n.57b); [[w.zagoria-sino-soviet-conflict-1956]], 367–69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 21 n.57c); [[w.gittings-survey-of-the-sino]], 144–53 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 21 n.57d); Li Fuchun, speech of Jan. 14, 1961, to the Ninth Plenum on the 1961 plan (not published) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 19 n.55); Deng Xiaoping, report to the Ninth Plenum on the Moscow meeting of the communist and workers'' parties, Jan. 14, 1961 (cited by [[w.yang-shangkun-riji]], I, 643 n.1a); Li Fuchun, speech of Jan. 14, 1961, to the Ninth Plenum on the 1961 plan (not published) (cited by [[w.yang-shangkun-riji]], I, 643 n.1b). Names: Mao Zedong, Deng Xiaoping, Li Fuchun, Chen Yun, Liu Shaoqi. Check: the communique as printed, *Renmin ribao*, Jan. 21, 1961; the plenum itself secret until then.'
