  - id: cal.1961-01-25.press-and-broadcasting
    when: Jan. 25
    date: '1961-01-25'
    thread: press-and-broadcasting
    also: [soviet-union, testing, congo, foreign-aid, cuba]
    c: 'First presidential press conference carried live, from the State Department auditorium. Announces the Soviet release of the two surviving RB-47 fliers. The Geneva test ban negotiations, due early in February, to be put off to late March for a clear American position; McCloy''s panel of experts under Fisk of the Bell Laboratories to recommend it. The American contribution to relieve the famine in the Congo much increased: more corn meal and dry milk, rice, and an airlift of a thousand tons of food, seeds and hospital supplies from African nations; the Congo''s emergency needs from surplus stocks to be met in full. Relations with Cuba: none being considered; the concern is with such movements "seized by external forces" and turned to an ideology "alien to this hemisphere."'
    n: 'News Conference, [1961 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=66). The film is at the JFK Library (K–J Adm. II.K). [[w.sorensen-kennedy]], 541 (the RB-47 fliers'' release announced). [[w.sorensen-kennedy]], 617 (the special group to prepare a new bargaining position and a draft treaty). [[w.sorensen-kennedy]], 636 (the first move, in the first week: the emergency airlift). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 175 (Cuba). To check: [[w.kennedy-and-the-press]]; [[w.watson-expanding-vista]]. Check: Dobrynin has Washington''s official note of Jan. 24 confirming the President''s order that American planes not enter Soviet airspace (44). See [[cal.1961-01-20.soviet-union]]. Names: Kennedy, McCloy.'
    src:
      c: 3f9bf535
      rows:
