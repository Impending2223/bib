  - id: cal.1961-01-04.laos
    when: Jan. 4
    date: '1961-01-04'
    thread: laos
    c: Six Laotian T-6 pilots back at Savannakhet from gunnery at Kokotiem, with four Thai "volunteers" in Laotian insignia. Boun Oum's government protests the Soviet airlift to the Soviet embassy, which refuses the note. Phoumi orders the air arm's first combat mission, an armed reconnaissance of Route 13 from the Lik River to Vang Vieng.
