    c: 'The Yinian Tang. Mao''s meeting of the Standing Committee and the regional secretaries on Hu Qiaomu''s draft "Three Main Rules and Eight Points" for Party and government cadres and the order of the work conference and the Ninth Plenum. Mao''s rules: start from the facts; raise the political level (exchange of equal values, pay by work); practice democratic centralism; the points in the positive ("speak kindly," not "beatings to be punished"). Whether to issue them now, when power is to be taken back in a fifth of the counties: to be discussed.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 9, 1961. [[w.jianguo-yilai-mao-zedong]], XV, 472–473 (Jan. 9, 1961; Mao''s comment of Jan. 9 on Hu Qiaomu''s report of Jan. 8 with the draft, which he titles ''Three Main Rules and Eight Points (draft)'': to the groups to discuss; whether to issue it now, when power is being taken in 20 percent of the counties, communes and teams, or wait; too complex, less plain than the Red Army''s; note 1: the meeting at the Yinian Tang that afternoon and Mao''s revised rules and points; printed from the manuscript; not the order of the work conference and the plenum); [[w.yang-shangkun-riji]], I, 642 (Jan. 9, 1961; after the Secretariat''s forty minutes; the regions'' men report; the plenum to begin the 13th); [[w.deng-xiaoping-nianpu-1904]], III, 1610–1611 (Jan. 9, 1961; 3:35 p.m.; Deng at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries: the bureaus'' reports, the draft "Three main rules of discipline and eight points for attention for Party and government cadres", the Ninth Plenum); [[w.mao-zedong-zhuan]], V, ch. 67 n.7 (Jan. 9, the fifth report: Hu Qiaomu''s draft "three great disciplines and eight points of attention" for Party and government cadres handed round, Mao not satisfied: it is to be short and easy to remember, and not to do harm; he adds the item "no investigation, no right to speak"; Liu Zihou on two Hebei counties; Mao: the false Communist, the real Kuomintang; issued Jan. 27). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], I, 642) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 67). Names: Mao Zedong, Hu Qiaomu, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Ke Qingshi, Li Jingquan, Tao Zhu.'
