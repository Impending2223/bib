  - id: cal.1961.soviet-union
    when: '1961'
    date: '1961'
    place: moscow
    thread: soviet-union
    also: [china]
    c: 'Moscow. The World Federation of Trade Unions'' meeting. Soviet delegates put disarmament and the "world without arms, armies or wars" first, above everything; delegates of Asia, Africa and Latin America, under old and new colonial rule, oppose it. The Chinese say disarmament is not above everything: peoples'' national independence, national economies, workers'' struggles in Europe and America against monopoly must have support. The Soviet delegates are isolated even in Moscow.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 454–455 ("in 1961"; the day not given). Check: the date, and the Chinese delegates'' names; Wu gives the year only.'
