    thread: program
    c: The Address to the Joint Session. The tide running against the United States in every area of crisis; the economy in recession.
    n: 'Annual Message to the Congress on the State of the Union, [1961 Pub. Papers 19](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=77) (Jan. 30, 1961). H. Doc. No. 73, 87th Cong.: [107 Cong. Rec. 1427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2) (1961). [[w.schlesinger-thousand-days-1965]], 167–68; [[w.stein-fiscal-revolution-in-america]], 386 (the economy: "seven months of recession, three and one-half years of slack"); [[w.selverstone-kennedy-withdrawal]], 21 (the address to Congress, Jan. 30: the tide "unfavorable," the economy "in trouble"). [[w.sorensen-kennedy]], 292. To check: [[w.bernstein-promises-kept]].'
