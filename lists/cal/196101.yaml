  - id: cal.1961-01-06.elections-1960
    when: Jan. 6
    date: '1961-01-06'
    thread: elections-1960
    also: [electoral-college]
    c: 'Electoral votes counted in joint session, Nixon presiding. Hawaii''s three certificates: on Nixon''s proposal, without objection, Governor Quinn''s of the Kennedy electors, after the recount. Kennedy 303, Nixon 219, Byrd 15. For Vice President, Johnson 303, Lodge 219, Thurmond 14, Goldwater 1. Nixon: "This is the first time in 100 years that a candidate for the Presidency announced the result of an election in which he was defeated and announced the victory of his opponent." Kennedy and Johnson declared elected.'
    n: '[107 Cong. Rec. 288–291](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-4-2.pdf#page=2). Byrd''s fifteen: Mississippi''s eight and six of Alabama''s eleven, unpledged electors; one Oklahoma elector, Republican, who gave Goldwater his vote for Vice President. [[w.kallina-kennedy-v-nixon]], 188–89 (the session; Hawaii''s certificates; Nixon''s declaration). [[w.nixon-six-crises]], 415–16 (the count; Nixon''s statement, at Mazo''s suggestion; Rayburn''s thanks). See [[cal.1960-11-08.elections-1960]]. Names: Nixon, Johnson, Lodge, Byrd, Thurmond, Goldwater, Quinn.'
