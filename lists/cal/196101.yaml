    when: Jan. 6
    date: '1961-01-06'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: Khrushchev reports to party organizations on the Moscow meeting of 81 communist parties. World war avoidable; wars of national liberation inevitable, and to be supported. Kennedy reads it to his staff and quotes it to the cabinet.
