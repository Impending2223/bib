    c: 'The preinaugural gala; Sinatra sings for the President-elect. Robert Kennedy, in a low voice to Fay: he hopes Sinatra will "live up" to the respectability the Kennedys have bestowed on him.'
    n: '[[w.thomas-robert-kennedy]], 161. Thomas: when Fay told it in the manuscript of his White House memoir, Kennedy had it deleted (Fay''s manuscript, Myrick Land Papers, Boston University; cited by Thomas, 422). Check: the day; Thomas: "a preinaugural gala in January." Names: Robert Kennedy, Fay.'
    src:
