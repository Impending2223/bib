    c: 'Kennedy''s first meeting on Cuba as President, the Cabinet Room. Dulles: Cuba a Communist-controlled state. Defense: nothing now authorized will overthrow Castro. Kennedy orders the covert program kept up and enlarged; the Chiefs to review the CIA''s plan for a landing; State to propose action through the OAS. No hint to reach anyone beyond those concerned.'
