# Cal. XIV January 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIV
entries:
  - id: cal.1961-01-02.laos
    when: Jan. 2–3
    date: '1961-01-02'
    thread: laos
    c: Eisenhower confers on Laos, Jan. 2 and 3, with Herter, Gates, Dulles and Lemnitzer. Boun Oum's forces against Kong Le and the Pathet Lao, supplied by a Soviet airlift; the French unhelpful, the British coming along. The assembly invests Boun Oum, 41–0 (Check the date).
    n: 'FRUS 1961–63, XXIV, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v24/d1), [2](https://history.state.gov/historicaldocuments/frus1961-63v24/d2). See [[cal.1960-08-09.laos]]. Names: Lemnitzer, Dulles, Kong Le, Boun Oum, Eisenhower, Herter, Gates.'
    tags: [name:eisenhower-dwight-d, name:herter-christian-a, name:gates-thomas-s-jr, name:dulles-allen-w, name:lemnitzer-lyman-l, name:kong-le, name:boun-oum-na-champassak]
  - id: cal.1961-01-03.rules
    when: Jan. 3
    date: '1961-01-03'
    thread: rules
    c: 87th Congress convenes. Senate 65 D–35 R, Hickey (D) appointed in Wyoming for Keith Thomson (R), elected and dead in December; House 263–174. Rayburn Speaker; Mansfield and Humphrey lead the Senate Democrats, Dirksen and Kuchel the Republicans; Halleck the House Republicans. The conference lets Vice President-elect Johnson preside over it, 46–17, against loud protest; he never uses the role.
    n: '[Cong. Rec., Senate, Jan. 3, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf). [House roll call 1](https://voteview.com/rollcall/RH0870001). [[w.caro-passage-of-power]], on the conference vote. To check: [[w.hardeman-rayburn]]. Names: Hickey, Thomson, Rayburn, Mansfield, Humphrey, Dirksen, Kuchel, Halleck, Johnson.'
    tags: [congress:87, name:hickey-john-j, name:rayburn-sam, name:mansfield-mike, name:humphrey-hubert-h, name:johnson-lyndon-b, name:thomson-keith, name:dirksen-everett, name:kuchel-thomas-h, name:halleck-charles-a, committees:87]
  - id: cal.1961-01-03.cuba
    when: Jan. 3
    date: '1961-01-03'
    thread: cuba
    c: 'Castro''s note of Jan. 2: each embassy cut to eleven persons, the Americans to leave in 48 hours. Eisenhower breaks diplomatic and consular relations with Cuba. The Swiss to keep American interests in Havana.'
    n: 'Statement by the President on Terminating Diplomatic Relations With Cuba, [1960–61 Pub. Papers 891](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=943). FRUS 1961–63, X, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v10/d1) (the note), [2](https://history.state.gov/historicaldocuments/frus1961-63v10/d2), [7](https://history.state.gov/historicaldocuments/frus1961-63v10/d7) (the American note). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 173–174; [[w.poole-joint-chiefs-of-staff]], 108. To check: [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.bohning-castro-obsession]]; [[w.leogrande-back-channel-to-cuba]]. Names: Castro, Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:castro-fidel, name:herter-christian-a]
  - id: cal.1961-01-03.congress
    when: Jan. 3
    date: '1961-01-03'
    thread: congress
    c: 'Senate Democrats in caucus. Mansfield, Johnson''s choice to succeed him as majority leader, moves that Johnson preside over the caucus as Vice President. Gore against: "This caucus is not open to former senators." Carried, 46–17.'
    n: '[[w.dallek-flawed-giant]], 8. To check: [[w.caro-passage-of-power]]. Names: Mansfield, Johnson, Gore. Check: Dallek gives Jan. 5, "seventeen days before taking office" (8), which would be Jan. 3.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:gore-albert-sr]
  - id: cal.1961-01-05.economy
    when: Jan. 5
    date: '1961-01-05'
    thread: economy
    c: 'Samuelson''s task force reports to the President-elect: a recession under way and a weak recovery ahead. Spend sooner on programs already wanted; hold a temporary tax cut in reserve.'
    n: '[[w.stein-fiscal-revolution-in-america]], 386, 388. The Fed: [[w.meltzer-history-of-the-federal]]. The dollar: [[w.triffin-gold-and-the-dollar]]. Figures: FRASER for what was published at the time, FRED for the revised series (K–J Adm. II.K). To check: [[w.economy-prospects-and-policies-for]]; [[w.stein-presidential-economics]]; [[w.heller-new-dimensions-of-political]]; [[w.okun-political-economy-of-prosperity]]; [[w.collins-more]]; [[w.president-and-the-council]]; [[w.bremner-chairman-of-the-fed]]; [[w.garbade-after-the-accord]]; [[w.gavin-gold-dollars-and-power]]; [[w.roosa-dollar-and-world-liquidity]]; [[w.solomon-international-monetary-system-1945]]. Names: Samuelson.'
    tags: [name:samuelson-paul-a, name:kennedy-john-f]
  - id: cal.1961-01-05.laos
    when: Jan. 5
    date: '1961-01-05'
    thread: laos
    c: 'The NSC on Laos: the Joint Chiefs on limited war in Southeast Asia.'
    n: 'FRUS 1961–63, XXIV, doc. [3](https://history.state.gov/historicaldocuments/frus1961-63v24/d3). See [[cal.1960-08-09.laos]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-06.berlin-and-vienna
    when: Jan. 6
    date: '1961-01-06'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: Khrushchev reports to party organizations on the Moscow meeting of 81 communist parties. World war avoidable; wars of national liberation inevitable, and to be supported. Kennedy reads it to his staff and quotes it to the cabinet.
    n: '[FRUS 1961–63, V, doc. 15](https://history.state.gov/historicaldocuments/frus1961-63v05/d15) (Jan. 26, 1961). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 35; [[w.marolda-united-states-navy-and]], 98; [[w.futrell-united-states-air-force]], 56. To check: [[w.beschloss-crisis-years]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1961-01-06.desegregation-schools
    when: Jan. 6
    date: '1961-01-06'
    thread: desegregation-schools-uga
    also: [georgia]
    c: Judge Bootle orders the University of Georgia to admit Charlayne Hunter and Hamilton Holmes.
    n: '*Holmes v. Danner*, [191 F. Supp. 394](https://static.case.law/f-supp/191/case-pdfs/0394-01.pdf) (M.D. Ga. 1961). [[w.bass-unlikely-heroes]], on Tuttle and the stay. To check: [[w.trillin-education-in-georgia]]; [[w.hunter-gault-in-my-place]]; [[w.pratt-we-shall-not-be]]. Names: Bootle, Hunter, Holmes.'
    tags: [name:bootle-william-a, name:hunter-charlayne, name:holmes-hamilton-e]
  - id: cal.1961-01-06.elections-1960
    when: Jan. 6
    date: '1961-01-06'
    thread: elections-1960
    also: [electoral-college]
    c: 'Electoral votes counted in joint session, Nixon presiding. Hawaii''s three certificates: on Nixon''s proposal, without objection, Governor Quinn''s of the Kennedy electors, after the recount. Kennedy 303, Nixon 219, Byrd 15. For Vice President, Johnson 303, Lodge 219, Thurmond 14, Goldwater 1. Kennedy and Johnson declared elected.'
    n: '[107 Cong. Rec. 288–291](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-4-2.pdf#page=2). Byrd''s fifteen: Mississippi''s eight and six of Alabama''s eleven, unpledged electors; one Oklahoma elector, Republican, who gave Goldwater his vote for Vice President. See [[cal.1960-11-08.elections-1960]]. Names: Nixon, Johnson, Lodge, Byrd, Thurmond, Goldwater, Quinn.'
    tags: [name:nixon-richard-m, name:kennedy-john-f, name:johnson-lyndon-b, name:lodge-henry-cabot, name:byrd-harry-f, name:thurmond-strom, name:goldwater-barry-m, name:quinn-william-f]
  - id: cal.1961-01-08.opinion
    when: Jan. 8
    date: '1961-01-08'
    thread: opinion
    also: [program]
    c: 'Gallup, Dec. 8–13, 1960: for the new President and Congress to act on, holding down prices, 63 percent; medical care for the aged, 52; a $1.25 minimum wage, 48; lower taxes, 46; more to end segregation, 46; more school aid, 40; more spending against unemployment, 28.'
    n: '[[w.gallup-poll]], III, 1700.'
  - id: cal.1961-01-09.desegregation-schools-uga
    when: Jan. 9
    date: '1961-01-09'
    thread: desegregation-schools-uga
    also: [georgia]
    c: Hunter and Holmes register at the University of Georgia.
    n: 'See [[cal.1961-01-06.desegregation-schools]]. Names: Hunter, Holmes.'
    tags: [name:hunter-charlayne, name:holmes-hamilton-e]
  - id: cal.1961-01-09.transition-and-staff
    when: Jan. 9
    date: '1961-01-09'
    thread: transition-and-staff
    c: 'Cambridge. The President-elect to the Massachusetts Legislature and the Harvard Overseers. At Schlesinger''s house: Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser''s; Wiesner on science adviser; the tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed.'
    n: '[[w.schlesinger-thousand-days-1965]], 162. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Bundy, Chayes, Wiesner, Seaborg, Schlesinger, Bowles. Check: the address''s text.'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:chayes-abram, name:wiesner-jerome-b, name:seaborg-glenn-t, name:schlesinger-arthur-m-jr, name:bowles-chester]
  - id: cal.1961-01-10.legislatures
    when: Jan. 10
    date: '1961-01-10'
    thread: legislatures
    c: 'Eisenhower transmits the Census Director''s statement under 2 U.S.C. § 2a: each State''s population and its Representatives, 435 by the method of equal proportions. For the 88th Congress: California from 30 to 38, Florida 8 to 12; Arizona, Hawaii, Maryland, Michigan, New Jersey, Ohio and Texas one more each. Pennsylvania from 30 to 27; Arkansas, Massachusetts and New York two fewer; Alabama, Illinois, Iowa, Kansas, Kentucky, Maine, Minnesota, Mississippi, Missouri, Nebraska, North Carolina and West Virginia one. The House of 437 back to 435.'
    n: '[107 Cong. Rec. 463, Senate, Jan. 10, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-6-1.pdf). The law: the act of June 18, 1929, § 22, [46 Stat. 21, 26](https://www.govinfo.gov/content/pkg/STATUTE-46/pdf/STATUTE-46-Pg21.pdf), as amended Nov. 15, 1941, [55 Stat. 761](https://www.govinfo.gov/content/pkg/STATUTE-55/pdf/STATUTE-55-Pg761.pdf); [2 U.S.C. § 2a (1958)](https://www.loc.gov/item/uscode1958-001002001/). The seats: [*1960 Census of Population, Advance Reports*, PC(A1)-1](https://www2.census.gov/library/publications/decennial/1960/population-pc-a1/15611126ch1.pdf), table 3. To check: [[w.balinski-fair-representation]]; [[w.anderson-american-census]]. See [[cal.1960-11-15.legislatures]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, state:ca, state:fl, state:az, state:hi, state:md, state:mi, state:nj, state:oh, state:tx, state:pa, state:ar, state:ma, state:ny, state:al, state:il, state:ia, state:ks, state:ky, state:me, state:mn, state:ms, state:mo, state:ne, state:nc, state:wv]
  - id: cal.1961-01-10.cuba
    when: Jan. 10
    date: '1961-01-10'
    thread: cuba-bay-of-pigs
    c: '*New York Times*, front page, Paul Kennedy: "U.S. Helps Train an Anti-Castro Force at Secret Guatemalan Air-Ground Base."'
    n: '[*New York Times*, Jan. 10, 1961](https://timesmachine.nytimes.com/timesmachine/1961/01/10/issue.html). To check: [[w.wyden-bay-of-pigs]]; [[w.bay-of-pigs-invasion-playa-giron-chronology]]. See [[cal.1960-10-30.cuba]].'
  - id: cal.1961-01-11.rules
    when: Jan. 11
    date: '1961-01-11'
    thread: rules
    c: Senate liberals' motion to change Rule XXII at the opening is referred to the Rules Committee, [50–46](https://voteview.com/rollcall/RS0870001).
    n: '[107 Cong. Rec., Senate, Jan. 11, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-7-1.pdf). S. Res. 4, 87th Cong. To check: [[w.finley-delaying-the-dream]].'
  - id: cal.1961-01-11.desegregation-schools-uga
    when: Jan. 11
    date: '1961-01-11'
    thread: desegregation-schools-uga
    also: [georgia]
    c: A riot at Hunter's dormitory at night. Both students suspended and driven to Atlanta.
    n: 'See [[cal.1961-01-06.desegregation-schools]]. Names: Hunter.'
    tags: [name:hunter-charlayne, name:holmes-hamilton-e]
  - id: cal.1961-01-12.program
    when: Jan. 12
    date: '1961-01-12'
    thread: program
    c: Eisenhower's last State of the Union, in writing, read in the House. The eight years reviewed.
    n: 'Annual Message to the Congress on the State of the Union, [1960–61 Pub. Papers 913](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=965) (Jan. 12, 1961). H. Doc. No. 1, 87th Cong.: [107 Cong. Rec. 644](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-8-1.pdf). See [[cal.1960-01-07.program]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-13.desegregation-schools-uga
    when: Jan. 13–16
    date: '1961-01-13'
    thread: desegregation-schools-uga
    also: [georgia]
    c: Bootle orders Hunter and Holmes readmitted. In class again Jan. 16.
    n: 'Check: the order''s report. See [[cal.1961-01-06.desegregation-schools]]. Names: Bootle, Hunter, Holmes.'
    tags: [name:bootle-william-a, name:hunter-charlayne, name:holmes-hamilton-e]
  - id: cal.1961-01-14.economy
    when: Jan. 14
    date: '1961-01-14'
    thread: economy
    c: Eisenhower's executive order bars Americans from holding gold abroad, after the October run on the London market.
    n: '[Exec. Order No. 10,905](https://www.presidency.ucsb.edu/documents/executive-order-10905-amendment-executive-order-6260-august-28-1933-amended), [26 Fed. Reg. 321](https://www.govinfo.gov/app/details/FR-1961-01-17) (K–J Adm. II.H.2). To check: [[w.triffin-gold-and-the-dollar]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1961-01-05.economy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-16.economy
    when: Jan. 16
    date: '1961-01-16'
    thread: economy
    c: 'Eisenhower''s last budget, fiscal 1962: receipts $82.3 billion, expenditures $80.9 billion, a surplus of $1.5 billion. Fiscal 1961''s surplus put at $79 million.'
    n: 'Annual Budget Message to the Congress: Fiscal Year 1962, [1960–61 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=986). [[w.stein-fiscal-revolution-in-america]], 367 (the surplus). To check: [[w.morgan-eisenhower-versus-the-spenders]]. See [[cal.1961-01-05.economy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, budget:1962]
  - id: cal.1961-01-16.welfare-la
    when: Jan. 16
    date: '1961-01-16'
    thread: welfare
    c: Flemming, Secretary of Health, Education, and Welfare, rules that a State may not deny Aid to Dependent Children for an unsuitable home while the children remain in it; Federal funds to be withheld after June 30, 1961. Louisiana's "suitable home" law of 1960 had cut 24,000 children from the rolls in August 1960. Check the day.
    n: '*Social Security Bulletin*, [Dec. 1960, 1](https://archive.org/details/sim_social-security-bulletin_1960-12_23_12/page/n2/mode/1up) (Louisiana, August: 6,400 families, 24,000 children); [July 1961, 19](https://archive.org/details/sim_social-security-bulletin_1961-07_24_7/page/n20/mode/1up) (the ruling, "in January 1961"; its effect put off by Pub. L. 87-31). [Wikipedia, "Flemming Rule"](https://en.wikipedia.org/wiki/Flemming_Rule). To check: [[w.bell-aid-to-dependent-children]]; [[w.fairclough-race-and-democracy]]. Names: Flemming.'
    tags: [name:flemming-arthur-s, state:la]
  - id: cal.1961-01-17.congo
    when: Jan. 17
    date: '1961-01-17'
    thread: congo
    c: Lumumba, held at Thysville since December, flown to Elisabethville with Okito and Mpolo, beaten on the way, and killed in Katanga that night. Not announced until Feb. 13.
    n: '[FRUS 1964–68, XXIII, docs. 59](https://history.state.gov/historicaldocuments/frus1964-68v23/d59), [60](https://history.state.gov/historicaldocuments/frus1964-68v23/d60), [62](https://history.state.gov/historicaldocuments/frus1964-68v23/d62) (CIA reports, Jan. 17–19). [FRUS 1961–63, XX, doc. 8](https://history.state.gov/historicaldocuments/frus1961-63v20/d8) (Jan. 20, 1961). See [[cal.1960-08-18.congo-2]]. Names: Lumumba, Okito, Mpolo.'
    tags: [name:lumumba-patrice, name:okito-joseph, name:mpolo-maurice]
  - id: cal.1961-01-17.defense
    when: Jan. 17
    date: '1961-01-17'
    thread: defense
    c: Eisenhower's farewell address, on radio and television. Guard against "unwarranted influence, whether sought or unsought, by the military-industrial complex"; against public policy become "the captive of a scientific-technological elite."
    n: 'Farewell Radio and Television Address to the American People, [1960–61 Pub. Papers 1035](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=1087). To check: [[w.ledbetter-unwarranted-influence]]; [[w.ambrose-eisenhower]]; [[w.eisenhower-white-house-years]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-17.oil
    when: Jan. 17
    date: '1961-01-17'
    thread: oil
    c: 'Eisenhower, Proclamation 3389: from Apr. 1, East Coast (District I) residual fuel oil allocations open to sellers with deep-water terminals, by their terminal inputs; residual imports held to the 1957 level.'
    n: '[Proclamation 3389](https://www.presidency.ucsb.edu/documents/proclamation-3389-modifying-proclamation-no-3279-march-10-1959-adjusting-imports-petroleum), [26 Fed. Reg. 507](https://www.govinfo.gov/app/details/FR-1961-01-20); statement, [1960–61 Pub. Papers 1060](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=1112) (Jan. 18). See [[cal.1960-10-28.oil]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-18.economy
    when: Jan. 18
    date: '1961-01-18'
    thread: economy
    c: Eisenhower's last Economic Report. No measures proposed against the recession.
    n: 'Annual Message Presenting the Economic Report to the Congress, [1960–61 Pub. Papers 1050](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=1102). [[w.economic-report-of-the]], on FRASER (K–J Adm. II.J). The Joint Economic Committee''s report on it (K–J Cong. II.J.3). See [[cal.1961-01-16.economy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1961-01-18.georgia-ga
    when: Jan. 18
    date: '1961-01-18'
    thread: georgia
    also: [desegregation-schools]
    c: 'Vandiver to the General Assembly in joint session, at night, the week after the riot at Athens: repeal of the laws that would close a desegregated school, the Sibley majority''s course.'
    n: '*Atlanta Constitution*, Jan. 19, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-01-19_93_182)). To check: [[w.roche-restructured-resistance]]; [[w.pratt-we-shall-not-be]]; [[w.trillin-education-in-georgia]]; [[w.bartley-creation-of-modern-georgia]]. See [[cal.1960-04-28.georgia-ga]]; [[cal.1961-01-06.desegregation-schools]]. Names: Vandiver, Sibley.'
    tags: [name:vandiver-s-ernest-jr, name:sibley-john-a, state:ga]
  - id: cal.1961-01-19.laos
    when: Jan. 19
    date: '1961-01-19'
    thread: laos
    also: [cuba-bay-of-pigs]
    c: 'Eisenhower–Kennedy transition meeting, the two alone, then with the outgoing and incoming secretaries. Laos called the key to Southeast Asia; accounts of what Eisenhower advised conflict. Cuba: help the anti-Castro guerrillas "to the utmost"; the training in Guatemala continued and accelerated.'
    n: 'FRUS 1961–63, XXIV, docs. [7](https://history.state.gov/historicaldocuments/frus1961-63v24/d7) (Kennedy''s notes, dictated), [8](https://history.state.gov/historicaldocuments/frus1961-63v24/d8) (Persons), [9](https://history.state.gov/historicaldocuments/frus1961-63v24/d9) (Herter); X, doc. [22](https://history.state.gov/historicaldocuments/frus1961-63v10/d22) (Clifford''s and McNamara''s memoranda, on Cuba). [[w.greenstein-what-did-eisenhower-tell]], compares the five accounts; [[w.gibbons-u-s-government-and]], II, 8–9; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 231; [[w.marolda-united-states-navy-and]], 98; [[w.schulimson-joint-chiefs-of-staff]], 29. [[w.schlesinger-thousand-days-1965]], 163–64. To check: [[w.clifford-counsel-to-the-president-2]] (K–J Adm. II.G.4). See [[cal.1961-01-02.laos]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f, name:herter-christian-a, name:persons-wilton-b]
  - id: cal.1961-01-20.transition-and-staff
    when: Jan. 20
    date: '1961-01-20'
    thread: transition-and-staff
    also: [robert-kennedy]
    c: 'Inauguration. The cabinet confirmed and sworn in over two days: Rusk, Dillon, McNamara, Robert Kennedy, Day, Udall, Freeman, Hodges, Goldberg, Ribicoff. Stevenson to the UN. McGovern to Food for Peace.'
    n: 'Inaugural Address, [1961 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=59). [Cong. Rec., Senate, Jan. 21, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-14-1.pdf). Remarks at the Swearing-In Ceremonies for the Members of the Cabinet, [1961 Pub. Papers 5](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=63) (Jan. 21, 1961). [[w.reeves-president-kennedy]], begins here and runs day by day. Recording: inaugural (K–J Adm. II.I). [[w.schlesinger-thousand-days-1965]], 1–5, 165–66 (the inauguration), 170 (McGovern). To check: [[w.clarke-ask-not]]; [[w.preparing-to-be-president]]; [[w.sorensen-kennedy]]. Names: Rusk, Stevenson, Dillon, McNamara, Robert Kennedy, Day, Udall, Freeman, Hodges, Goldberg, Ribicoff, McGovern.'
    tags: [executive:1961-01-20, name:kennedy-john-f, name:johnson-lyndon-b, name:rusk-dean, name:dillon-c-douglas, name:mcnamara-robert-s, name:kennedy-robert-f, name:day-j-edward, name:udall-stewart-l, name:freeman-orville-l, name:hodges-luther-h, name:goldberg-arthur-j, name:ribicoff-abraham, name:stevenson-adlai-e, name:mcgovern-george]
  - id: cal.1961-01-20.soviet-union
    when: Jan. 20–21
    date: '1961-01-20'
    thread: soviet-union
    c: 'Khrushchev and Brezhnev congratulate the new President; his reply, Jan. 21, shares their hope of a fundamental improvement. Jan. 21, Khrushchev receives Thompson: an aide-mémoire frees the two surviving RB-47 fliers, Olmstead and McKone, the Soviet government taking account of Kennedy''s statements in the campaign against reconnaissance flights over the Soviet Union.'
    n: 'Exchange of Greetings With Leaders of the Soviet Union, [1961 Pub. Papers 3](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=61) (Jan. 21, 1961). FRUS 1961–63, VI, docs. [3](https://history.state.gov/historicaldocuments/frus1961-63v06/d3), [4](https://history.state.gov/historicaldocuments/frus1961-63v06/d4); V, docs. [9](https://history.state.gov/historicaldocuments/frus1961-63v05/d9), [10](https://history.state.gov/historicaldocuments/frus1961-63v05/d10). To check: [[w.beschloss-crisis-years]]; [[w.thompson-kremlinologist]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. See [[cal.1960-07-11.soviet-union]]. The release announced: [[cal.1961-01-25.press-and-broadcasting]]. Names: Khrushchev, Brezhnev, Thompson, Olmstead, McKone.'
