  - id: cal.1961-01.rules-2
    when: Jan.
    date: 1961-01
    thread: rules
    c: 'Nixon, presiding in the Senate in his last ruling before Johnson takes the chair: the Senate may adopt new rules at the opening of each Congress without regard to the two-thirds for cloture. The Southerners: the Senate a continuing body, its rules continuing with it. By McPherson''s account.'
    n: '[[w.mcpherson-political-education]], 185. Check: the day; the book gives none. See [[cal.1961-01-03.rules]]. Names: Nixon, Johnson.'
    src:
      c: fe17e797
      rows:
        - 'w.mcpherson-political-education 185: all'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b]
  - id: cal.1961-01-31.latin-america-dominican-republic
    when: Jan. 31
    date: '1961-01-31'
    thread: latin-america-dominican-republic
    c: 'Dearborn to the State Department''s special assistant for CIA liaison: the dissidents are "delighted" about the decision to deliver "exotic equipment."'
    n: '[[w.sen-church-alleged-assassination-plots]], 197 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to the special assistant, Jan. 31, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 197). See [[cal.1961-01-19.latin-america-dominican-republic]].'
  - id: cal.1961-01.latin-america
    when: Jan.
    date: 1961-01
    thread: latin-america
    c: 'The Oval Office, late in the month. Kennedy, holding a message from Betancourt, to Goodwin: "I''d like to get a major statement on our Latin policy soon. Next to Berlin it''s the most critical area, and will be for a long time." He will "make a big commitment"; asks if something can be ready in a month: "I don''t care if everyone agrees. You know what our thinking is." Of Cuba: "I don''t want this to be an anti-Cuban speech. Just throw Castro in with the other dictators." Goodwin to draft an answer to a telegram from Somoza saying democracy for Nicaragua is Kennedy''s hope too.'
    n: '[[w.goodwin-remembering-america]], 146–48 (Goodwin''s account). Names: Kennedy, Goodwin, Betancourt, Castro. Check: the day; "Sometime toward the end of January" (146).'
    tags: [name:kennedy-john-f, name:goodwin-richard-n, name:betancourt-romulo, name:castro-fidel]
  - id: cal.1961-01.press-and-broadcasting-2
    when: Jan.
    date: 1961-01
    thread: press-and-broadcasting
    c: 'Washington, the Sheraton Park. Lunch of three hours with Merriman Smith, Folliard, Donovan and Brandt. Folliard: "You''re turning the presidential press conferences into a sideshow." Salinger refuses to tell them where the President goes or with whom, and to have reporters name their papers on television; agreement only on the Inaugural arrangements and the press pool. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 58–59. Check: the day (after the return to Washington the week after New Year''s). Names: Salinger.'
    tags: [name:salinger-pierre]
  - id: cal.1961-01.press-and-broadcasting-3
    when: Jan.
    date: 1961-01
    thread: press-and-broadcasting
    c: Lunch with Reston of the *Times*, after the Sheraton Park lunch. Reston holds the President should stop seeing his old friends in the press socially, and the press must be with him whenever he leaves the White House; Salinger will neither police the President's friends nor announce his private movements. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 59–60. Check: the day. See [[cal.1961-01.press-and-broadcasting-2]]. Names: Reston, Salinger.'
    tags: [name:reston-james, name:salinger-pierre]
  - id: cal.1961-01.rules-3
    when: Jan.
    date: 1961-01
    thread: rules
    c: Smith, to head off the enlargement, offers to release five bills the President-elect has called critical. By Albert's account.
    n: '[[w.albert-little-giant-1990]], 240. Check: the day: the work gives none; after the word of Colmer''s purge ([[cal.1961-01-02.rules]]), while Kennedy is President-elect. Names: Smith, Kennedy, Albert.'
    tags: [name:smith-howard-w, name:kennedy-john-f, name:albert-carl]
  - id: cal.1961-01.rules-4
    when: Jan.
    date: 1961-01
    thread: rules
    c: 'Vinson''s offer to Rayburn, the one compromise he would accept: drop the purge of Colmer, and Vinson will get enough southern Democratic votes to add three members to the Rules Committee. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 240–41. Check: the day: the work gives none; after the word of Colmer''s purge ([[cal.1961-01-02.rules]]). Names: Vinson, Rayburn, Colmer, Albert.'
    tags: [name:vinson-carl, name:rayburn-sam, name:colmer-william-m, name:albert-carl]
  - id: cal.1961-01.rules-5
    when: Jan.
    date: 1961-01
    thread: rules
    c: 'Kennedy, Rayburn present and uncomfortable, telephones Cooley, dean of North Carolina''s delegation: the administration has named three North Carolinians, Hodges, Murphy and Webb, to high posts; the State could give him more help on the Rules Committee. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 242 (the call; in the end one North Carolina vote, Bonner''s, pledged to Rayburn before it). Check: the day: the work gives none; Kennedy President, before the vote of Jan. 31. Names: Kennedy, Rayburn, Cooley, Hodges, Murphy, Webb, Albert.'
    tags: [name:kennedy-john-f, name:rayburn-sam, name:cooley-harold-d, name:hodges-luther-h, name:murphy-charles-s, name:webb-james-e, name:albert-carl, state:nc]
