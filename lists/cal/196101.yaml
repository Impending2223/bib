    c: 'Wofford to Robert Kennedy, before the inauguration: the FBI a "bottleneck"; it "has, or uses, few if any Negro investigators. White FBI investigators, who often have a Southern accent, run into great resistance from skeptical, fearful Negroes." Hoover will not cooperate until convinced "our new Attorney General is just as serious about conspiracies against civil rights as about the Communist conspiracy."'
