    n: '[FRUS 1961–63, X, doc. 10](https://history.state.gov/historicaldocuments/frus1961-63v10/d10); U.N. docs. S/PV.921, S/PV.923. [[w.jones-bay-of-pigs]], 40. See [[cal.1961-01-03.cuba]]. Names: Roa, Wadsworth.'
