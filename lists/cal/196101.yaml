    c: 'The Carlyle, New York. Hovde and members of his task force on education give the President-elect their report; Salinger hands out its seven pages. More than $9.39 billion in grants and loans over four and a half years, $5.84 billion of it in grants to the States for public schools only: $30 a pupil, $20 more in the poorer States and in cities over 300,000. The colleges'' plan of grants and loans for construction endorsed, but, Kennedy''s staff pressing, the first year held to $500 million. Kennedy: "great value," but "I don''t know whether we have the resources immediately to take on the whole program"; by Feldman''s account, "quite annoyed."'
