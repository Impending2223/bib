  - id: cal.1961-01-01.jobs-and-wages
    when: Jan. 1
    date: '1961-01-01'
    thread: jobs-and-wages
    also: [transition-and-staff]
    c: 'Palm Beach. Douglas''s task force on area redevelopment, six of its members from West Virginia, reports to the President-elect: the area redevelopment bill first; more food distribution, longer unemployment benefits, wider public assistance; for Appalachia, access roads and a regional commission. The bill to go in on the opening day.'
    n: '[[w.sundquist-politics-and-policy]], 84. Names: Douglas, Kennedy. Check: the day; Flood, 107 Cong. Rec. 100 (Jan. 4, 1961), has Kennedy receiving the report Jan. 2.'
    src:
      c: b39e36ef
      rows:
        - 'w.sundquist-politics-and-policy 84: all'
    tags: [name:douglas-paul-h, name:kennedy-john-f]
  - id: cal.1961-01-01.transition-and-staff-nsc
    when: Jan. 1
    date: '1961-01-01'
    thread: transition-and-staff-nsc
    c: 'The President-elect names Bundy Special Assistant for National Security Affairs: the NSC and "its machinery" to be used "more flexibly than in the past"; Bundy to "simplify" it into "a single, small, but strongly organized staff unit."'
    n: '[[w.preston-war-council]], 40. To check: Kennedy press release, Jan. 1, 1961, in Henry M. Jackson, ed., *The National Security Council* (1965), 302–03 (cited by [[w.preston-war-council]], 40 n.8). Names: Kennedy, Bundy. Check: Preston''s text has the appointment announced at a press conference, Dec. 31, 1960; the note, the release of Jan. 1.'
    src:
      c: 4d4b04c1
      rows:
        - 'w.preston-war-council 40: all'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge]
  - id: cal.1961-01-02.laos
    when: Jan. 2–3
    date: '1961-01-02'
    thread: laos
    c: Eisenhower confers on Laos, Jan. 2 and 3, with Herter, Gates, Dulles and Lemnitzer. Boun Oum's forces against Kong Le and the Pathet Lao, supplied by a Soviet airlift; the French unhelpful, the British coming along. The assembly invests Boun Oum, 41–0 (Check the date).
    n: 'FRUS 1961–63, XXIV, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v24/d1), [2](https://history.state.gov/historicaldocuments/frus1961-63v24/d2). See [[cal.1960-08-09.laos]]. Names: Lemnitzer, Dulles, Kong Le, Boun Oum, Eisenhower, Herter, Gates.'
    tags: [name:eisenhower-dwight-d, name:herter-christian-a, name:gates-thomas-s-jr, name:dulles-allen-w, name:lemnitzer-lyman-l, name:kong-le, name:boun-oum-na-champassak]
  - id: cal.1961-01-02.conservative-movement
    when: Jan. 2
    date: '1961-01-02'
    thread: conservative-movement
    c: 'Young Americans for Freedom''s first public act: a picket at the White House gates for the House Un-American Activities Committee, against those who would abolish it, whom they outnumber two to one.'
    n: '[[w.perlstein-before-the-storm]], 104, 107. See [[cal.1960-09-10.conservative-movement]].'
    src:
