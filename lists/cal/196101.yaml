  - id: cal.1961-01-20.china-leadership-3
    when: Jan. 20
    date: '1961-01-20'
    thread: china-leadership
    also: [china]
    c: Liu Shaoqi hears Liu Lantao, first secretary of the Northwest Bureau, and the first secretaries Zhang Desheng (Shaanxi), Zhang Zhongliang (Gansu), Wang Feng (Ningxia), Gao Feng (Qinghai) and Wang Enmao (Xinjiang) on their work. Cadres' level is a matter of tying theory to practice; Marxism-Leninism's universal truth fits different places, masses, cadres and times. Leaders should do typical investigations and keep a style of talking things over with the masses. Where leaders back a good style the cadres take it up, and it outlives them; if they back a bad one the old cadres go bad and new ones cannot grow.
