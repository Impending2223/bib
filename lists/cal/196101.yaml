    c: 'Devlin to headquarters: a mutiny "almost certainly would ∗ ∗ ∗ bring about [Lumumba] return power"; he has told the Congolese government that the army garrison at Léopoldville "will mutiny within two or three days unless drastic action taken satisfy complaints." He urges headquarters to consider an immediate reaction. By the ordinary channel; no mention of assassination.'
