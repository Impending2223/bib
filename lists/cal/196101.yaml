    c: 'Mao to Tian Jiaying: three investigation groups of seven, led by Chen Boda (Guangdong), Hu Qiaomu (Hunan) and Tian (Zhejiang), each with his 1930 "On Investigation Work"; one team to the worst brigade, one to the best, ten to fifteen days; then to report to him at Canton and study industry there a month.'
