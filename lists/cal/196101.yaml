  - id: cal.1961-01-08.opinion
    when: Jan. 8
    date: '1961-01-08'
    thread: opinion
    also: [program]
    c: 'Gallup, Dec. 8–13, 1960: for the new President and Congress to act on, holding down prices, 63 percent; medical care for the aged, 52; a $1.25 minimum wage, 48; lower taxes, 46; more to end segregation, 46; more school aid, 40; more spending against unemployment, 28.'
    n: '[[w.gallup-poll]], III, 1700.'
  - id: cal.1961-01-09.desegregation-schools-uga
    when: Jan. 9
    date: '1961-01-09'
    thread: desegregation-schools-uga
    also: [georgia]
    c: Hunter and Holmes register at the University of Georgia.
    n: 'Check: the day; the court''s order on the suspension, *Holmes v. Danner*, [191 F. Supp. 394, 417](https://static.case.law/f-supp/191/case-pdfs/0394-01.pdf) (M.D. Ga. 1961), has them "admitted and enrolled" on Jan. 11. See [[cal.1961-01-06.desegregation-schools]]. Names: Hunter, Holmes.'
    tags: [name:hunter-charlayne, name:holmes-hamilton-e]
  - id: cal.1961-01-09.transition-and-staff
    when: Jan. 9
    date: '1961-01-09'
