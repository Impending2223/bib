  - id: cal.1961-01-01.republican-party
    when: Jan. 1
    date: '1961-01-01'
    thread: republican-party
    c: 'Valiukas to Hermann, of the national committee, copies to Nixon, Rockefeller, Goldwater and Bridges: with Bridges that Nixon threw away a won election; the party lost for want of leadership, Eisenhower a "very poor Party leader," Nixon and Lodge neglecting the minorities and nationalities; the committee to hire a nationalities expert.'
    n: '[[w.gifford-center-cannot-hold]], 193–94 (quoting it). To check: Valiukas to Hermann, Jan. 1, 1961, Series 320, Box 778, "Valiukas," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 194 n.81). Names: Nixon, Rockefeller, Goldwater, Bridges, Eisenhower, Lodge.'
    src:
      c: 661da440
      rows:
        - 'w.gifford-center-cannot-hold 193–94: all'
        - 'via w.gifford-center-cannot-hold 194 n.81: all'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m, name:bridges-henry-s, name:eisenhower-dwight-d, name:lodge-henry-cabot]
  - id: cal.1961-01-02.laos
    when: Jan. 2–3
    date: '1961-01-02'
    time: 1961-01-02T16:15Z
    thread: laos
    c: Eisenhower confers on Laos, Jan. 2 and 3, with Herter, Gates, Dulles and Lemnitzer. Boun Oum's forces against Kong Le and the Pathet Lao, supplied by a Soviet airlift; the French unhelpful, the British coming along. The assembly invests Boun Oum, 41–0 (Check the date).
    n: 'FRUS 1961–63, XXIV, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v24/d1), [2](https://history.state.gov/historicaldocuments/frus1961-63v24/d2). [[w.watson-into-the-missile-age]], 655 (the president "followed the situation in meetings with his advisers, including Gates and Douglas, on 2 and 3 January"; the Laotian national assembly "formally recognized the Boun Oum government on 3 January, giving it full legal status"; not Herter, Dulles or Lemnitzer, nor the vote of 41–0). See [[cal.1960-08-09.laos]]. Names: Lemnitzer, Dulles, Kong Le, Boun Oum, Eisenhower, Herter, Gates.'
    src:
      c: 7372a0dc
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d1: all'
        - 'w.watson-into-the-missile-age 655: ?'
    tags: [name:eisenhower-dwight-d, name:herter-christian-a, name:gates-thomas-s-jr, name:dulles-allen-w, name:lemnitzer-lyman-l, name:kong-le, name:boun-oum-na-champassak]
