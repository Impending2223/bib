  - id: cal.1961-01-02.laos
    when: Jan. 2–3
    date: '1961-01-02'
    time: 1961-01-02T16:15Z
    thread: laos
    c: Eisenhower confers on Laos, Jan. 2 and 3, with Herter, Gates, Dulles and Lemnitzer. Boun Oum's forces against Kong Le and the Pathet Lao, supplied by a Soviet airlift; the French unhelpful, the British coming along. The assembly invests Boun Oum, 41–0 (Check the date).
    n: 'FRUS 1961–63, XXIV, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v24/d1), [2](https://history.state.gov/historicaldocuments/frus1961-63v24/d2). See [[cal.1960-08-09.laos]]. Names: Lemnitzer, Dulles, Kong Le, Boun Oum, Eisenhower, Herter, Gates.'
