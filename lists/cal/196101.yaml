    c: 'Mao 毛泽东, 5 a.m., returns to Chen Boda 陈伯达 his draft speech for the Ninth Plenum, sent with his letter of Jan. 12: speak it so; if there is no time to speak, send it to Deng Xiaoping 邓小平 to print for the work conference. Chen''s letter also offers excerpts of Mao''s works on practice and the zigzags of things and on investigation, and a passage of Lenin.'
