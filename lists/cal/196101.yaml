  - id: cal.1961-01-30.program
    when: Jan. 30
    date: '1961-01-30'
    thread: program
    c: The Address to the Joint Session. The tide running against the United States in every area of crisis; the economy in recession.
    n: 'Annual Message to the Congress on the State of the Union, [1961 Pub. Papers 19](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=77) (Jan. 30, 1961). H. Doc. No. 73, 87th Cong.: [107 Cong. Rec. 1427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2) (1961). [[w.schlesinger-thousand-days-1965]], 167–68. [[w.sorensen-kennedy]], 292. To check: [[w.bernstein-promises-kept]].'
    src:
      c: 148d52ad
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=77: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2: all'
        - 'w.schlesinger-thousand-days-1965 168: A, C'
        - 'w.sorensen-kennedy 292: all'
    gloss:
      title: Style
      text:
        - 'Art. II, § 3: the President "shall from time to time give to the Congress Information of the State of the Union." "Annual message" and "State of the Union" are usage.'
        - 'The Houses'' act. H. Con. Res. 109, offered by McCormack and agreed to by the House Jan. 24 ([107 Cong. Rec. 1204](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-16-1.pdf)), by the Senate Jan. 26: the Houses to assemble Jan. 30 "for the purpose of receiving such communications as the President of the United States shall be pleased to make to them" ([1262](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-18-1.pdf)). It names no message. The second year, H. Con. Res. 402, the same words, "communication" in the singular ([108 Cong. Rec. 75](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-2.pdf)). The two resolutions do not otherwise differ.'
        - 'The Record''s headings, not ratified by either House. Jan. 30, House: "Joint session of the House and Senate held pursuant to the provisions of House Concurrent Resolution 109 to hear an address by the President of the United States"; the text under "The State of the Union—Address of the President of the United States (H. Doc. No. 73)" ([1427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=2)). Senate: it goes "to hear the annual message of the President of the United States"; "Joint session of the two Houses—Annual message of the President of the United States (H. Doc. No. 73)" ([1357](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-1.pdf)). Jan. 11, 1962, House: "State of the Union Message of the President of the United States (H. Doc. No. 251)" ([108 Cong. Rec. 63](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-1.pdf#page=2)). Senate: it goes "to hear the address to be delivered by the President"; "Joint session of the two Houses—Address by the President" ([76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-2-2.pdf#page=2)).'
        - The House's act, Jan. 30. On McCormack's motion, agreed to, "that the message of the President be referred to the Committee of the Whole House on the State of the Union and ordered printed" ([1431](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-1-2.pdf#page=6)). The same motion for Eisenhower's of Jan. 12 ([107 Cong. Rec. 649](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-8-1.pdf#page=6)). "State of the Union" there is the committee's name, not the message's. The Committee of the Whole House on the State of the Union is the House itself, sitting as a committee; bills on the Union Calendar go to it, and messages from the President on other subjects. The message of Feb. 2 on economic recovery went to it as well (H. Doc. No. 81, [107 Cong. Rec. 1677](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt2/pdf/GPO-CRECB-1961-pt2-3-2.pdf#page=2)).
        - 'The House Journal, read and approved by the House the next day it sits. Jan. 24: "Providing for a joint session"; McCormack "submitted the following concurrent resolution," "considered and agreed to" ([158](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122504&seq=162)). Jan. 12: under "Messages from the President," the heading "State of the Union"; the Speaker lays before the House "a message from the President of the United States" ([91](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122504&seq=95)); "On motion of Mr. McCormack the message of the President was referred to the Committee of the Whole House on the State of the Union" ([96](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122504&seq=100)). Jan. 30: "Joint session to receive the President''s message"; the President "delivered the following message" ([170](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122504&seq=174)); "Reference of the President''s message," on McCormack''s motion as before ([174](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122504&seq=178)). The Journal heads Eisenhower''s written message "State of the Union" and Kennedy''s address "the President''s message." *Journal of the House of Representatives*, 87th Cong., 1st sess. (1961).'
        - 'The Senate Journal, its reading dispensed with by unanimous consent. Jan. 13, the Senate''s first day after Eisenhower''s: under the heading "State of the Union," "the following message from the President of the United States, which was ordered to lie on the table" ([41](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525781&seq=45)–[46](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525781&seq=50)). Jan. 26: "Joint meeting of the two Houses to receive messages from the President"; H. Con. Res. 109 read; "Resolved, That the Senate agree thereto" ([95](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525781&seq=99)). Jan. 30, under the heading "State of the Union": the Senate "proceeded to the Hall of the House of Representatives, pursuant to House Concurrent Resolution 109, to hear an address by the President of the United States," and "the President of the United States addressed them" ([110](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525781&seq=114)); "Upon the conclusion of the address, the joint session was dissolved" ([114](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525781&seq=118)). The Senate Journal heads both "State of the Union"; of Kennedy''s, its text says "address." *Journal of the Senate*, 87th Cong., 1st sess. (1961).'
        - '*Public Papers*, compiled by the Office of the Federal Register: "Annual Message to the Congress on the State of the Union," for Eisenhower''s of Jan. 12, for Kennedy''s of Jan. 30, and for Jan. 11, 1962. The text calls itself "this Message"; of Roosevelt''s of 1945, "his final state of the Union message." It does not otherwise name itself.'
        - 'The second address that month. Eisenhower''s, Jan. 12, in writing, read in the House; laid before the Senate Jan. 13: "State of the Union—Message from the President of the United States (H. Doc. No. 1)"; "Once again it is my constitutional duty to assess the state of the Union" ([107 Cong. Rec. 644](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-8-1.pdf)). Kennedy''s address eighteen days after. So in 1953: Truman''s in writing, Jan. 7; Eisenhower''s in person, Feb. 2; both "Annual Message" in the *Public Papers*. See [[cal.1961-01-12.program]].'
        - 'The second year, the Journals. Jan. 11, 1962, Senate: its committee to notify the President reports that "the President had advised that he desired to deliver a message on the state of the Union today at 12:30 p.m. before a joint session of the two Houses" ([2](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525773&seq=4)); H. Con. Res. 402 agreed to under "Joint session of two Houses to receive message from the President"; under the heading "Address of the President of the United States on the state of the Union," the Senate proceeds "to hear an address by the President of the United States," who "addressed them" ([3](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525773&seq=5)); "Upon the conclusion of the address" ([7](https://babel.hathitrust.org/cgi/pt?id=mdp.39015087525773&seq=9)). House, Jan. 10: its committee to notify the President reports, "The President has asked us to report that he will be pleased to deliver his message at 12:30 o''clock p.m., January 11, 1962, to a joint session of the two bodies"; then, under "Providing for a joint session," Albert''s H. Con. Res. 402, "considered and agreed to" ([12](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122561&seq=18)). Jan. 11: "Joint session to receive the President''s message" ([17](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122561&seq=23)); the President "delivered the following message" ([18](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122561&seq=24)); "Reference of the President''s message," on Albert''s motion, "the message of the President was referred to the Committee of the Whole House on the State of the Union" ([22](https://babel.hathitrust.org/cgi/pt?id=uc1.31175030122561&seq=28)). Of 1962, the President''s word, as the committees report it: to the Senate, "a message on the state of the Union"; to the House, "his message." Of 1961 no such report. *Journal of the Senate* and *Journal of the House of Representatives*, 87th Cong., 2d sess. (1962).'
        - Later usage. From Reagan, 1981, a new President's first appearance before the Houses is titled an address before a joint session, and is not counted a State of the Union; the outgoing President's written message keeps the name (Carter, 1981). [APP, "Annual Messages to Congress on the State of the Union"](https://www.presidency.ucsb.edu/documents/presidential-documents-archive-guidebook/annual-messages-congress-the-state-the-union).
        - 'Check: the title pages of H. Docs. 1, 73 and 251.'
