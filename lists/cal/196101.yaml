    c: Salinger's first briefing as Press Secretary, on the order doubling the surplus food ration. An Agriculture specialist gives the cost as $36 million a month, $9 for each of four million beneficiaries; two hours later he finds the $9 is for a family of four, and Salinger gives the press $9 million. By Salinger's account.
