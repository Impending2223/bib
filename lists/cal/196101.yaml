    c: 'The Yinian Tang, 10:20 p.m. Mao''s meeting of the Standing Committee, the departments and the regional bureaus hears Li Fuchun on the 1961 plan: the 1960 plan one for industry and transport, farming squeezed, targets high, power sent down too far; steel for 1961 at 19.5, 19 or 18.7 million tons. Mao: as coal, ore and transport allow.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 3, 1961. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 501 (Jan. 3, 1961; the Central Work Conference''s third report session, on the 1961 plan; Liu: raising steel the year before from 18.4 to 20.4 million tons was an error; this year''s plan to ease the situation and the contradictions and leave margin in every item); [[w.yang-shangkun-riji]], I, 639 (Jan. 3, 1961; the meeting at Mao''s, 晚间...10 时在主席处开会; Li Fuchun: 20 million tons of steel leaves gaps in iron, coal, transport and timber, to be cut to 19 or 19.5 million for margin; Mao: report so tomorrow for discussion; high targets and strain for three years squeezed farming, and even 19 million may bring the same strain in the fourth quarter, to be avoided; the meeting broke up at 1:45 a.m.); [[w.deng-xiaoping-nianpu-1904]], III, 1609 (Jan. 3, 1961; night; Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries hears Li Fuchun on the 1961 plan, steel at most 19 million tons; asked whether "great leap" can still be said in 1961, Deng: the New Year editorials of *Hongqi* and the *Renmin ribao* did not, saying "new victories in socialist construction"); [[w.mao-zedong-zhuan]], V, ch. 67 n.6 (Jan. 3, evening, the fourth report: Li Fuchun on the plan for 1961, steel at 19.5, 19 or 18.7 million tons, Mao: 19 million looks safe, agriculture first and steel after). Made public: 1996. To check: Mao Zedong 毛泽东, interjections at the report meeting of the Central Work Conference 中央工作会议汇报会, Jan. 3, 1961 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.6). Names: Mao Zedong, Li Fuchun, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Li Xiannian, Tan Zhenlin, Chen Boda, Bo Yibo.'
