  - id: cal.1961-01-13.china-leadership
    when: Jan. 13
    date: '1961-01-13'
    place: peking
    thread: china-leadership
    c: 'The Huairen Tang. Mao closes the Central Work Conference: "make investigation and study the fashion"; each leader to study a brigade or two, a commune, a factory; "clear facts, great resolve, right methods"; "go bankrupt to pay the debts": the laborer never expropriated; building cut, no new works this year; socialism not to be built in such haste.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 13 (Mao on investigation); [[w.yang-shangkun-riji]], I, 643 (Jan. 13, 1961; the work conference ends; Mao speaks at 11 a.m.); [[w.deng-xiaoping-nianpu-1904]], III, 1611–1612 (Jan. 13, 1961; morning; Deng at the closing plenary; on Mao''s remarks on productivity Deng interjects: big, middle and small together; small first, but in the long run the middle road, the stress on the middle); [[w.mao-zedong-zhuan]], V, ch. 67 n.8 (Jan. 13: Mao closes the conference on investigation and research: the facts clear, the resolve great, the methods right; "a year of seeking truth from facts"; each leader to take a team or two for a survey). Made public: 2013. Check: Yang Shangkun''s diary has Mao speak at 11 a.m. ([[w.yang-shangkun-riji]], I, 643); and the conference resumes Jan. 19 (I, 644). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], I, 643) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 67), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.xin-zhongguo-biannianshi-1949]], 182 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.16); [[w.mao-zedong-sixiang-wan]], xia, 323–24 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.17); Mao Zedong 毛泽东, speech closing the Central Work Conference 中央工作会议, Jan. 13, 1961; in *Mao Zedong wenji*, vol. 8, 233-234, 237 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.8). Names: Mao Zedong.'
