    date: '1964-01-03'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater announces for the Republican nomination, at his home in Arizona: "I will offer a choice, not an echo."'
    n: '[Remarks Announcing Candidacy for the Republican Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-announcing-candidacy-for-the-republican-presidential-nomination) (Jan. 3, 1964). Shadegg, *What Happened to Goldwater?*; White, *Suite 3505*; Goldberg, *Barry Goldwater*; Edwards, *Goldwater*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). Goldwater, *With No Apologies* (Opp. II.G.1). See [[cal.1963-04-08.elections-1964]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m]
