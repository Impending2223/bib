    n: '*The Gallup Poll*, III, 1860–62 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Rockefeller (Opp. III.H).'
