    n: '*The Gallup Poll*, III, 1857 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
