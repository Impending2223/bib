  - id: cal.1963-12-27.succession
    when: Dec. 27
    date: '1963-12-27'
    thread: succession
    also: [economy]
    c: 'News conference at the Ranch. The 1965 budget: requests cut $731 million and 10,000 jobs after three days with the Cabinet. Sent Jan. 21, 1964: $97.9 billion.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-0) (Dec. 27, 1963). The 1965 estimate: [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000), Table C-56. [[w.morgan-deficit-government]]; [[w.caro-passage-of-power]]; [[w.zelizer-taxing-america]]. See [[cal.1963-12-07.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-28.europe-and-the-alliance
    when: Dec. 28–29
    date: '1963-12-28'
    thread: europe-and-the-alliance
    c: Erhard at the LBJ Ranch. Six American divisions to stay in Germany; no arrangement to perpetuate a divided Germany; the multilateral force "a new means of strengthening Western defense."
    n: '[Joint Statement Following Discussions With Chancellor Erhard](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard) (Dec. 29, 1963). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Erhard.'
    tags: [name:erhard-ludwig, name:johnson-lyndon-b]
