    n: '*The Gallup Poll*, III, 1860 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Shriver (K–J Adm. III.G); Brown, Wagner (K–J Cong. III.F); Fulbright, McCarthy (K–J Cong. III.B).'
