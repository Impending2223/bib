  - id: cal.1964-01-07.goldwater
    when: Jan. 7
    date: '1964-01-07'
    thread: goldwater
    also: [elections-1964]
    c: 'Concord, New Hampshire, the campaign''s first week: "I would like to suggest one change, that social security be made voluntary." Rockefeller takes it up; Goldwater denies he would wreck the system.'
    n: 'Quoted with its date in Humphrey''s speech at Bakersfield, Cal., 1964 ([Humphrey papers, MNHS](https://www2.mnhs.org/library/findaids/00442/pdfa/00442-01375.pdf)); the Democrats'' spot ["Social Security"](https://www.livingroomcandidate.org/commercials/1964/social-security) (1964). White, *The Making of the President 1964* (Opp. II.E). Perlstein, *Before the Storm* (Opp. II.B). See [[cal.1964-01-03.elections-1964]]. Names: Goldwater (Opp. III.B); Rockefeller (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson]
