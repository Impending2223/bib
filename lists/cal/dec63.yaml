  - id: cal.1963-12-21.vietnam
    when: Dec. 21
    date: '1963-12-21'
    thread: vietnam
    c: 'McNamara to Johnson after two days in Saigon: "The situation is very disturbing." Unless reversed in two or three months, neutralization at best, more likely a Communist-controlled state. The Minh government "indecisive and drifting."'
    n: '[FRUS 1961–63, IV, doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v04/d374). McNamara, *In Retrospect* (K–J Adm. II.G.4). Shapley, *Promise and Power* (Viet. II.H.1). Logevall, *Choosing War*; McMaster, *Dereliction of Duty* (K–J Adm. II.D). Ahern, *The CIA and the Generals*; Lam, *The History of South Vietnam* (Viet. II.E.5). See [[cal.1963-11-01.vietnam]]. Names: McNamara (K–J Adm. III.F); Johnson (K–J Adm. III.D); Dương Văn Minh (Viet. III.G).'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:duong-van-minh]
  - id: cal.1963-12-21.specials
    when: Dec. 21
    date: '1963-12-21'
    thread: specials
    c: Texas 10th, special runoff. Pickle (D) over Dobbs (R), 62.9 to 37.1, for the seat of Thornberry, of the Rules Committee, now a district judge; Johnson's old district. Swing 0.4 to R.
    n: '[109 Cong. Rec., House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf) (Pickle sworn). Votes: CQ Guide 6th (2010) 1271; CQ dates the first round by year only. Check the date of the first round. Pickle & Pickle, *Jake* (K–J Cong. II.I.2). See [[cal.1961-04-04.states-and-cities]]. Names: Dobbs (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [special:1963-12-21-h-TX-10, name:pickle-james-j, name:dobbs-jim, name:thornberry-william-h, name:johnson-lyndon-b]
  - id: cal.1963-12-24.foreign-aid
    when: Dec. 24
    date: '1963-12-24'
    thread: foreign-aid
    also: [trade, succession]
    c: 'The House, in at 7 a.m. on Christmas Eve, adopts Passman''s amendment to the aid appropriation, [189–158](https://voteview.com/rollcall/RH0880119): the President may allow Export-Import Bank guarantees on credit to Communist countries in the national interest. The wheat credit kept. Senate agrees Dec. 30, [56–14](https://voteview.com/rollcall/RS0880229). About $3 billion, against $4.5 billion asked. Signed Jan. 6, [77 Stat. 857](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg857.pdf).'
    n: '[109 Cong. Rec. House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf). [Statement by the President on the Proposed Reduction in Foreign Aid Funds](https://www.presidency.ucsb.edu/documents/statement-the-president-the-proposed-reduction-foreign-aid-funds) (Dec. 14, 1963). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1963-11-15.foreign-aid]]; [[cal.1963-10-09.trade]].'
    tags: [name:passman-otto-e, name:johnson-lyndon-b]
  - id: cal.1963-12-27.succession
    when: Dec. 27
    date: '1963-12-27'
    thread: succession
    also: [economy]
    c: 'News conference at the Ranch. The 1965 budget: requests cut $731 million and 10,000 jobs after three days with the Cabinet. Sent Jan. 21, 1964: $97.9 billion.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-0) (Dec. 27, 1963). The 1965 estimate: [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000), Table C-56. Morgan, *Deficit Government* (K–J Adm. II.B). Caro, *The Passage of Power* (K–J Adm. II.F). Zelizer, *Taxing America* (K–J Cong. II.B). See [[cal.1963-12-07.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-28.europe-and-the-alliance
    when: Dec. 28–29
    date: '1963-12-28'
    thread: europe-and-the-alliance
    c: Erhard at the LBJ Ranch. Six American divisions to stay in Germany; no arrangement to perpetuate a divided Germany; the multilateral force "a new means of strengthening Western defense."
    n: '[Joint Statement Following Discussions With Chancellor Erhard](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard) (Dec. 29, 1963). Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). See [[cal.1963-01-14.europe-and-the-alliance]].'
    tags: [name:erhard-ludwig, name:johnson-lyndon-b]
  - id: cal.1963-12-30.congress
    when: Dec. 30
    date: '1963-12-30'
    thread: congress
    c: 'First session of the 88th Congress adjourns, 2:51 p.m. Passed: the test ban, equal pay, mental health, clean air, higher and vocational education. Left: the tax bill in Finance, civil rights in Rules, Medicare.'
    n: '[109 Cong. Rec., House, Dec. 30, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-12-1.pdf). CQ Almanac 1963; *Congress and the Nation*, vol. 1 (K–J Cong. II.L). Burns, *The Deadlock of Democracy* (K–J Cong. II.A). Sundquist, *Politics and Policy*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). See [[cal.1962-10-13.congress]].'
