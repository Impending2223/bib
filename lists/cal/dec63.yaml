# Cal. XLIX December 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIX
entries:
  - id: cal.1963-12-01.black-nationalism
    when: Dec. 1–4
    date: '1963-12-01'
    thread: black-nationalism
    also: [assassination]
    c: 'Malcolm X, speaking for Elijah Muhammad at the Manhattan Center, asked about Kennedy''s murder: "chickens coming home to roost." Muhammad had told his ministers to say nothing of it. Dec. 4: Muhammad suspends him from speaking for ninety days. Check: the hall.'
    n: '[[w.x-autobiography-of-malcolm-x]]; [[w.marable-malcolm-x]]; [[w.goldman-death-and-life-of]]; [[w.payne-dead-are-arising]]. Names: Malcolm X (K–J Cong. III.H); Muhammad (K–J Cong. III.K).'
    tags: [name:malcolm-x, name:muhammad-elijah]
  - id: cal.1963-12-05.assassination
    when: Dec. 5
    date: '1963-12-05'
    thread: assassination
    c: The Warren Commission's first meeting, at the National Archives. The FBI's summary report to it, Dec. 9. Rankin its general counsel.
    n: 'National Archives: JFK Assassination Records Collection (K–J Adm. II.K). See [[cal.1963-11-29.assassination]]. Names: Warren (K–J Cong. III.G).'
    tags: [name:warren-earl, name:rankin-j-lee]
  - id: cal.1963-12-06.opinion
    when: Dec. 6
    date: '1963-12-06'
    thread: opinion
    also: [assassination]
    c: 'Gallup, Nov. 22–27: the man who shot Kennedy acted on his own, 29 percent; some group or element also responsible, 52; uncertain, 19.'
    n: '[[w.gallup-poll]], III, 1854.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-12-07.economy
    when: Dec. 7
    date: '1963-12-07'
    thread: economy
    also: [succession]
    c: Johnson's first news conference. The tax bill to take effect Jan. 1 whenever passed; Byrd agrees, at lunch. The 1965 budget to start from $98.8 billion and $3.5 billion of built-in increases. McNamara to cut 25,000 civilian jobs.
    n: '[The President''s First News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-first-news-conference) (Dec. 7, 1963). [[w.zelizer-taxing-america]]; [[w.heinemann-harry-byrd-of-virginia]]. Caro, *The Passage of Power*, chs. 19, 22 (K–J Adm. II.F). [[w.taking-charge]]. See [[cal.1963-01-24.economy]]; [[cal.1963-09-25.economy]]. Names: Johnson (K–J Adm. III.D); Byrd (K–J Cong. III.B); McNamara (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:byrd-harry-f, name:mcnamara-robert-s]
  - id: cal.1963-12-08.opinion
    when: Dec. 8
    date: '1963-12-08'
    thread: opinion
    also: [economy]
    c: 'Gallup, Oct. 11–16: the Kennedy administration''s record on spending, of those with an opinion, 35 percent favorable, 65 unfavorable; 23 had none.'
    n: '[[w.gallup-poll]], III, 1854.'
  - id: cal.1963-12-09.civil-rights-bill
    when: Dec. 9
    date: '1963-12-09'
    thread: civil-rights-bill
    c: Celler's petition to discharge the civil rights bill from Smith's Rules Committee opens for signatures; 218 needed. Dec. 11, the House adjourns rather than take up Calendar Wednesday, [214–166](https://voteview.com/rollcall/RH0880106). Dec. 18, Smith promises hearings Jan. 9.
    n: '[109 Cong. Rec., House, Dec. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt18/pdf/GPO-CRECB-1963-pt18-5-2.pdf). [Discharge Petition to Move the Civil Rights Bill Out of the Rules Committee](https://www.archives.gov/legislative/features/civil-rights-1964/discharge-petition.html) (National Archives). [[w.whalen-longest-debate]]; [[w.risen-bill-of-the-century]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1963-10-29.civil-rights-bill]]. Names: Celler, Smith (K–J Cong. III.D).'
    tags: [name:celler-emanuel, name:smith-howard-w]
  - id: cal.1963-12-11.opinion
    when: Dec. 11
    date: '1963-12-11'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill, succession]
    c: 'Gallup, Nov. 22–27: under the new President, integration pushed faster, 16 percent; not so fast, 29; about the same, 43.'
    n: '[[w.gallup-poll]], III, 1854.'
  - id: cal.1963-12-13.opinion-5
    when: Dec. 13
    date: '1963-12-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 5–10: Democrats'' choice for 1964: Johnson 68, Robert Kennedy 16, Stevenson 5, Humphrey 2, Brown 2, Symington 1, Fulbright 1; others, no preference 5. Independents: Johnson 66, Robert Kennedy 11.'
    n: '[[w.gallup-poll]], III, 1854. Names: Johnson (K–J Adm. III.D); Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Brown (K–J Cong. III.F); Fulbright (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:brown-edmund-g, name:symington-william-s, name:fulbright-j-william]
  - id: cal.1963-12-15.opinion-5
    when: Dec. 15
    date: '1963-12-15'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 5–10: Republicans'' choice for 1964: Nixon 29, Goldwater 27, Lodge 16, Rockefeller 13, Romney 7, Scranton 2, Margaret Chase Smith 2; no preference 4. Independents: Rockefeller 22, Goldwater 21, Nixon 20, Lodge 18.'
    n: '[[w.gallup-poll]], III, 1854–55. Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H); Smith (Opp. III.A).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:smith-margaret-chase]
  - id: cal.1963-12-16.school-aid
    when: Dec. 16
    date: '1963-12-16'
    thread: school-aid
    c: 'Higher Education Facilities Act signed, [77 Stat. 363](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg363-2.pdf), the Morse–Green bill: $1.195 billion over three years in grants and loans for academic buildings at public and private colleges, church colleges included. Conference report, House Nov. 6, [258–92](https://voteview.com/rollcall/RH0880085); Senate Dec. 10, [54–27](https://voteview.com/rollcall/RS0880211). Johnson: "the Education Congress of 1963."'
    n: '[Remarks Upon Signing the Higher Education Facilities Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-higher-education-facilities-act) (Dec. 16, 1963). [[w.graham-uncertain-triumph]]. See [[cal.1963-01-29.school-aid]]; [[cal.1963-08-06.school-aid]]. Names: Morse (K–J Cong. III.B); Green (K–J Cong. III.D).'
    tags: [name:johnson-lyndon-b, name:morse-wayne, name:green-edith]
  - id: cal.1963-12-16.foreign-aid
    when: Dec. 16
    date: '1963-12-16'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1963 signed, [77 Stat. 379](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg379.pdf). Conference report, House Dec. 9, [195–164](https://voteview.com/rollcall/RH0880100); Senate Dec. 13, [61–26](https://voteview.com/rollcall/RS0880213). Johnson: "a dangerous reduction in funds."'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-2) (Dec. 16, 1963). See [[cal.1963-11-15.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-17.program
    when: Dec. 17
    date: '1963-12-17'
    thread: conservation
    c: Clean Air Act signed, [77 Stat. 392](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg392.pdf). Grants to State and local control agencies; federal research; federal suits to abate pollution that crosses State lines. Conference report, House Dec. 10, [273–109](https://voteview.com/rollcall/RH0880104).
    n: Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Clean Air Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-clean-air-act) (Dec. 17, 1963). [[w.dewey-dont-breathe-the-air]]; [[w.krier-pollution-and-policy]]; [[w.jones-clean-air]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-17.latin-america
    when: Dec. 17
    date: '1963-12-17'
    thread: latin-america
    c: 'Senate approves the Chamizal convention, [15 U.S.T. 21](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-15-1/lltreaties-15-1.pdf#page=29), [505 U.N.T.S. 185](https://treaties.un.org/doc/Publication/UNTS/Volume%20505/volume-505-I-7374-English.pdf), [79–1](https://voteview.com/rollcall/RS0880216): the Chamizal tract at El Paso to Mexico, the Rio Grande''s channel moved. Johnson signs the ratification Dec. 20.'
    n: '[Remarks Upon Signing the Ratification of the Chamizal Convention](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-ratification-the-chamizal-convention) (Dec. 20, 1963). Convention for the Solution of the Problem of the Chamizal (K–J Cong. II.J.2). See [[cal.1963-07-18.latin-america]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-17.opinion-5
    when: Dec. 17
    date: '1963-12-17'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 12–17, released Jan. 10, 1964: Johnson 66, Lodge 23, undecided and other 11; Johnson 74, Rockefeller 17, undecided and other 9.'
    n: '[[w.gallup-poll]], III, 1858. Names: Johnson (K–J Adm. III.D); Lodge (K–J Adm. III.E); Rockefeller (Opp. III.H).'
    tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:rockefeller-nelson]
  - id: cal.1963-12-18.school-aid
    when: Dec. 18
    date: '1963-12-18'
    thread: school-aid
    c: Vocational Education Act signed, [77 Stat. 403](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg403.pdf); the National Defense Education Act and aid to impacted areas extended. Conference report, House Dec. 12, [301–65](https://voteview.com/rollcall/RH0880109); Senate Dec. 13, [82–4](https://voteview.com/rollcall/RS0880214).
    n: '[Remarks Upon Signing the Vocational Education Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-vocational-education-bill) (Dec. 18, 1963). [[w.graham-uncertain-triumph]]. See [[cal.1963-01-29.school-aid]]; [[cal.1963-08-06.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-18.opinion-5
    when: Dec. 18
    date: '1963-12-18'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 22–27, the South: Johnson 78, Goldwater 19, undecided, others 3.'
    n: '[[w.gallup-poll]], III, 1855. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1963-12-20.opinion-5
    when: Dec. 20
    date: '1963-12-20'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 12–17, Catholics: Johnson 91, Goldwater 6, undecided, others 3.'
    n: '[[w.gallup-poll]], III, 1855. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1963-12-21.vietnam
    when: Dec. 21
    date: '1963-12-21'
    thread: vietnam
    c: 'McNamara to Johnson after two days in Saigon: "The situation is very disturbing." Unless reversed in two or three months, neutralization at best, more likely a Communist-controlled state. The Minh government "indecisive and drifting."'
    n: '[FRUS 1961–63, IV, doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v04/d374). [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.ahern-cia-and-the-generals]]; [[w.lam-history-of-south-vietnam-2021]]. See [[cal.1963-11-01.vietnam]]. Names: McNamara (K–J Adm. III.F); Johnson (K–J Adm. III.D); Dương Văn Minh (Viet. III.G).'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:duong-van-minh]
  - id: cal.1963-12-21.specials
    when: Dec. 21
    date: '1963-12-21'
    thread: specials
    c: Texas 10th, special runoff. Pickle (D) over Dobbs (R), 62.9 to 37.1, for the seat of Thornberry, of the Rules Committee, now a district judge; Johnson's old district. Swing 0.4 to R.
    n: '[109 Cong. Rec., House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf) (Pickle sworn). Votes: CQ Guide 6th (2010) 1271; CQ dates the first round by year only. Check the date of the first round. [[w.pickle-jake]]. See [[cal.1961-04-04.states-and-cities]]. Names: Dobbs (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [special:1963-12-21-h-TX-10, name:pickle-james-j, name:dobbs-jim, name:thornberry-william-h, name:johnson-lyndon-b]
  - id: cal.1963-12-24.foreign-aid
    when: Dec. 24
    date: '1963-12-24'
    thread: foreign-aid
    also: [trade, succession]
    c: 'The House, in at 7 a.m. on Christmas Eve, adopts Passman''s amendment to the aid appropriation, [189–158](https://voteview.com/rollcall/RH0880119): the President may allow Export-Import Bank guarantees on credit to Communist countries in the national interest. The wheat credit kept. Senate agrees Dec. 30, [56–14](https://voteview.com/rollcall/RS0880229). About $3 billion, against $4.5 billion asked. Signed Jan. 6, [77 Stat. 857](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg857.pdf).'
    n: '[109 Cong. Rec. House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf). [Statement by the President on the Proposed Reduction in Foreign Aid Funds](https://www.presidency.ucsb.edu/documents/statement-the-president-the-proposed-reduction-foreign-aid-funds) (Dec. 14, 1963). [[w.caro-passage-of-power]]. See [[cal.1963-11-15.foreign-aid]]; [[cal.1963-10-09.trade]].'
    tags: [name:passman-otto-e, name:johnson-lyndon-b]
  - id: cal.1963-12-27.succession
    when: Dec. 27
    date: '1963-12-27'
    thread: succession
    also: [economy]
    c: 'News conference at the Ranch. The 1965 budget: requests cut $731 million and 10,000 jobs after three days with the Cabinet. Sent Jan. 21, 1964: $97.9 billion.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-0) (Dec. 27, 1963). The 1965 estimate: [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000), Table C-56. [[w.morgan-deficit-government]]; [[w.caro-passage-of-power]]; [[w.zelizer-taxing-america]]. See [[cal.1963-12-07.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-28.europe-and-the-alliance
    when: Dec. 28–29
    date: '1963-12-28'
    thread: europe-and-the-alliance
    c: Erhard at the LBJ Ranch. Six American divisions to stay in Germany; no arrangement to perpetuate a divided Germany; the multilateral force "a new means of strengthening Western defense."
    n: '[Joint Statement Following Discussions With Chancellor Erhard](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard) (Dec. 29, 1963). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1963-01-14.europe-and-the-alliance]].'
    tags: [name:erhard-ludwig, name:johnson-lyndon-b]
  - id: cal.1963-12-30.congress
    when: Dec. 30
    date: '1963-12-30'
    thread: congress
    c: 'First session of the 88th Congress adjourns, 2:51 p.m. Passed: the test ban, equal pay, mental health, clean air, higher and vocational education. Left: the tax bill in Finance, civil rights in Rules, Medicare.'
    n: '[109 Cong. Rec., House, Dec. 30, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-12-1.pdf). CQ Almanac 1963; [[w.congress-and-the-nation]] (K–J Cong. II.L). [[w.burns-deadlock-of-democracy]]; [[w.sundquist-politics-and-policy]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1962-10-13.congress]].'
  - id: cal.1963-12.robert-kennedy
    when: Dec.
    date: 1963-12
    thread: robert-kennedy
    also: [soviet-union]
    c: 'William Walton, painter and friend of the Kennedys, in Moscow on a cultural visit put off by the assassination, sees Bolshakov at Robert Kennedy''s request. By Bolshakov''s report, the message: Robert Kennedy and Mrs. Kennedy believed there had been a conspiracy in the President''s death; Robert Kennedy shared his brother''s approach to the Soviet Union. Check the date.'
    n: '[[w.fursenko-one-hell-of-a]]. See [[cal.1961-05-09.berlin-and-vienna]]. Made public: Fursenko & Naftali (1997). Names: Walton (K–J Cong. III.K); Bolshakov (K–J Adm. III.J); Robert Kennedy, Jacqueline Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f, name:walton-william, name:bolshakov-georgi, name:kennedy-jacqueline]
