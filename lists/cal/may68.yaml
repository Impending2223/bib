    date: '1968-05-14'
    thread: elections-1968
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: Kennedy in Nebraska; unpledged delegates in West Virginia.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1968*, 3, 18](https://govdocs.nebraska.gov/epubs/S1200/S001-1968prim_gen.pdf#page=4); [*West Virginia Blue Book, 1968*, 824, 853](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1968.pdf#page=832). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: Nixon, Kennedy.'
    tags: [primary:1968-05-14, name:nixon-richard-m, name:kennedy-robert-f]
