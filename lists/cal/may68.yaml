# Cal. CIII May 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CIII
entries:
  - id: cal.1968-05-01.states-and-cities-cleveland
    when: May 1
    date: '1968-05-01'
    thread: states-and-cities
    also: [poverty]
    c: 'Cleveland. Stokes, on television, announces Cleveland: Now!, public and private money for jobs, housing, health, youth and the downtown: $1.5 billion in ten years, $177 million in the first two (Check). After Glenville, word that money from it had reached Ahmed Evans''s group stops the gifts.'
    n: '[*Encyclopedia of Cleveland History*, "Cleveland: Now!"](https://case.edu/ech/articles/c/cleveland-now). [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]; [[w.stokes-promises-of-power]]; [[w.masotti-shoot-out-in-cleveland]]. See [[cal.1967-11-07.mayors-cleveland]]. Glenville: [[cal.1968-07-23.civil-disorders]]. Names: Stokes.'
    tags: [state:oh, city:cleveland, name:stokes-carl-b]
  - id: cal.1968-05-03.vietnam
    when: May 3
    date: '1968-05-03'
    thread: vietnam
    c: 'Word from Hanoi, received at 1 a.m.: it will meet in Paris on May 10 or several days after. Johnson to Rostow by telephone: "I''d rather go to almost any place than Paris." Morning news conference: Paris and May 10 accepted, after consulting Rusk, Clifford, Goldberg, Ball, Harriman and Vance; "only the very first step."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1208) (May 3, 1968). FRUS 1964–68, VI, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v06/d221). [Johnson and Rostow, 1 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walt-rostow-may-3-1968), Conversation WH6805-01-13004 (Miller Center). See [[cal.1968-03-31.elections-1968]]. Names: Rostow, Rusk, Clifford, Goldberg, Ball, Harriman, Vance, Johnson.'
    tags: [name:johnson-lyndon-b, name:rostow-walt-w, name:rusk-dean, name:clifford-clark, name:goldberg-arthur-j, name:ball-george-w, name:harriman-w-averell, name:vance-cyrus]
  - id: cal.1968-05-05.economy
    when: May 5–29
    date: '1968-05-05'
    thread: economy
    also: [congress]
    c: 'Johnson to McCormack, released May 5: the surcharge, "about a penny on the dollar"; delay "a ticket to disaster." He does not urge cuts in the $186 billion January budget, but "would reluctantly accept some reductions if they are realistic and reasonable." The House Appropriations Committee''s formula: $4 billion off fiscal 1969 expenditures. The conferees on H.R. 15414 take the Senate''s $6 billion (Check the day). At lunch, May 14: "Labor is completely against it." May 29, the House refuses to instruct its conferees for $4 billion in place of $6 billion, [137–259](https://voteview.com/rollcall/RH0900332).'
    n: '[Letter to the Speaker of the House Urging Immediate Action on the Tax Surcharge](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-urging-immediate-action-the-tax-surcharge) (May 4, 1968). FRUS 1964–68, VI, doc. [232](https://history.state.gov/historicaldocuments/frus1964-68v06/d232). See [[cal.1967-11-29.economy]]; [[cal.1967-01-10.economy]]. Names: McCormack, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w]
  - id: cal.1968-05-05.vietnam
    when: May 5–13
    date: '1968-05-05'
    thread: vietnam
    c: 'The second offensive: rockets, mortars and ground attacks, from midnight May 4–5, on Saigon, airfields and Kon Tum, some 119 places (Check). Fighting in Saigon''s outskirts and Cholon for a week; a second wave in Saigon, May 25 (Check). Wheeler to Johnson, May 4: "Hit 18 places"; Rusk: "pretty heavy fighting as we move into talks." Johnson to the congressional leaders, May 28: "We lost 1,100 men in the last two weeks."'
    n: 'FRUS 1964–68, VI, docs. [222](https://history.state.gov/historicaldocuments/frus1964-68v06/d222), [254](https://history.state.gov/historicaldocuments/frus1964-68v06/d254). [[w.spector-after-tet]]; [[w.nolan-house-to-house]]; [[w.schmitz-tet-offensive]]; [[w.sorley-better-war]]. See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Rusk, Johnson.'
    tags: [name:wheeler-earle, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-05-07.elections-1968
    when: May 7
    date: '1968-05-07'
    thread: elections-1968
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Nixon-Rockefeller in the District; Nixon in Indiana; Rhodes in Ohio. Democratic: Kennedy in the District and Indiana; Young in Ohio.'
    n: 'CQ Guide 6th (2010) 409. See [[cal.1968-03-12.elections-1968]]. Names: Rhodes, Nixon, Kennedy.'
    tags: [primary:1968-05-07, name:rhodes-james-a, name:nixon-richard-m, name:kennedy-robert-f, name:young-stephen-m]
  - id: cal.1968-05-07.elections-1968-2
    when: May 7
    date: '1968-05-07'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'Indiana, Kennedy''s first primary: Kennedy first; Branigin, the Governor, a favorite son pledged to Johnson''s cause, second (Check); McCarthy third. In the District, Kennedy''s slate over Humphrey''s.'
    n: 'See [[cal.1968-05-07.elections-1968]]; [[cal.1968-03-14.robert-kennedy]]. Names: Kennedy, Branigin, McCarthy, Johnson, Humphrey.'
    tags: [name:kennedy-robert-f, name:branigin-roger-d, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:humphrey-hubert-h, state:in]
  - id: cal.1968-05-09.crime-and-hijacking
    when: May 9–23
    date: '1968-05-09'
    thread: crime-and-hijacking
    also: [court]
    c: 'The Senate on S. 917, the Safe Streets and Crime Control bill. Johnson to Mansfield, released May 9: Title I, the grants to local law enforcement, the heart of it; Title IV keeps handguns from "the dangerous and the deranged" but not the rifle. May 16, long guns refused, [29–53](https://voteview.com/rollcall/RS0900415). May 21, Title II: the motions to strike the sections on confessions (*Miranda*), [29–55](https://voteview.com/rollcall/RS0900421), on delay before arraignment (*Mallory*), [26–58](https://voteview.com/rollcall/RS0900422), and on eyewitnesses (*Wade*), [21–63](https://voteview.com/rollcall/RS0900424), refused; the sections taking from the federal courts review of State convictions on confessions, [52–32](https://voteview.com/rollcall/RS0900423), and on habeas corpus, [54–27](https://voteview.com/rollcall/RS0900426), struck. May 23: Title III, wiretapping and eavesdropping on court order, kept, [12–68](https://voteview.com/rollcall/RS0900432); Dirksen''s block grants, to the States alone, [48–29](https://voteview.com/rollcall/RS0900436). Passed as H.R. 5037, [72–4](https://voteview.com/rollcall/RS0900439). May 14: Senate confirmation for Hoover''s successors, [72–0](https://voteview.com/rollcall/RS0900412).'
    n: '[Letter to the Majority Leader of the Senate on the Crime Control and Safe Streets Bill](https://www.presidency.ucsb.edu/documents/letter-the-majority-leader-the-senate-the-crime-control-and-safe-streets-bill) (May 8, 1968). [[w.harris-fear-of-crime]]; [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1967-02-06.crime-and-hijacking]]. Names: Mansfield, Dirksen, Hoover, Johnson.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett, name:hoover-j-edgar]
  - id: cal.1968-05-09.states-and-cities-nyc
    when: May 9–15
    date: '1968-05-09'
    thread: states-and-cities
    also: [jobs-and-wages]
    c: New York City. Ocean Hill–Brownsville's governing board, on its personnel committee's recommendation, ends the employment in the district of thirteen teachers and six administrators, most of Junior High School 271, May 9. The Board of Education tells them to ignore the notices; parents block the doors; 350 of the union's teachers walk out of the district's schools. May 15, some 300 police open the school (Check the numbers).
    n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike); [Chalkbeat, May 10, 2018](https://www.chalkbeat.org/newyork/2018/5/10/21105025/fifty-years-ago-teacher-oustings-that-led-to-new-york-city-s-massive-teacher-strikes/). [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.kahlenberg-tough-liberal]]; [[w.cannato-ungovernable-city]]. See [[cal.1967-07.states-and-cities-nyc]]; [[cal.1967-11-09.states-and-cities-nyc]]. Names: McCoy, Shanker.'
    tags: [state:ny, city:nyc, name:mccoy-rhody-a, name:shanker-albert]
  - id: cal.1968-05-12.king
    when: May 12–23
    date: '1968-05-12'
    thread: king
    also: [poverty]
    c: 'The Poor People''s Campaign in Washington. May 12, Mother''s Day, Coretta King leads a march of welfare mothers (Check). May 13, in West Potomac Park, by the Reflecting Pool, Abernathy drives the first stake of Resurrection City, plywood shelters for some 3,000 under a Park Service permit (Check the numbers and the permit''s term). May 23, Rusk answers the grievances the campaign''s representatives put to him at State, May 1: the war, South Africa, Rhodesia, Portugal.'
    n: 'FRUS 1964–68, XXXIV, doc. [331](https://history.state.gov/historicaldocuments/frus1964-68v34/d331). [[w.fager-uncertain-resurrection]]; [[w.mcknight-last-crusade]]; [[w.mantler-power-to-the-poor]]; [[w.abernathy-and-the-walls-came]]; [[w.young-easy-burden]]; [[w.jackson-from-civil-rights-to]]. See [[cal.1968-04-04.king]]; [[cal.1967-12-04.king]]. Names: Coretta King, Abernathy, Rusk.'
    tags: [name:king-coretta-scott, name:abernathy-ralph-david, name:rusk-dean, city:washington]
  - id: cal.1968-05-13.vietnam
    when: May 13
    date: '1968-05-13'
    thread: vietnam
    c: 'Paris, the Hotel Majestic, 10:30 a.m.: the first session of the official conversations. Harriman and Vance for the United States; Xuân Thủy, a minister, for the Democratic Republic. Procedural meetings had gone two days, Vance with Hà Văn Lâu. Thủy: the talks are to end the bombing and all other acts of war against the North; other questions after. Harriman: the aim is the South Vietnamese people''s right to determine their own future "without outside interference or coercion"; Hanoi''s attacks since Mar. 31. Sessions follow weekly (Check).'
    n: 'FRUS 1964–68, VI, docs. [230](https://history.state.gov/historicaldocuments/frus1964-68v06/d230), [234](https://history.state.gov/historicaldocuments/frus1964-68v06/d234), [254](https://history.state.gov/historicaldocuments/frus1964-68v06/d254). [[w.herring-secret-diplomacy-of-the]]; [[w.goodman-lost-peace]]; [[w.thies-when-governments-collide]]; [[w.abramson-spanning-the-century]]; [[w.clifford-counsel-to-the-president-2]]; [[w.johnson-vantage-point]]; [[w.schandler-unmaking-of-a-president]]; [[w.nguyen-hanois-war]]; [[w.asselin-vietnams-american-war]]. See [[cal.1968-05-03.vietnam]]. Names: Harriman, Vance, Xuân Thủy, Hà Văn Lâu.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:xuan-thuy, name:ha-van-lau]
  - id: cal.1968-05-14.elections-1968
    when: May 14
    date: '1968-05-14'
    thread: elections-1968
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: Kennedy in Nebraska; unpledged delegates in West Virginia.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1968*, 3, 18](https://govdocs.nebraska.gov/epubs/S1200/S001-1968prim_gen.pdf#page=4); [*West Virginia Blue Book, 1968*, 824, 853](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1968.pdf#page=832). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: Nixon, Kennedy.'
    tags: [primary:1968-05-14, name:nixon-richard-m, name:kennedy-robert-f]
  - id: cal.1968-05-16.transition-and-staff
    when: May 16
    date: '1968-05-16'
    thread: transition-and-staff
    also: [health]
    c: Wilbur Cohen sworn Secretary of Health, Education, and Welfare, Under Secretary since 1965 and acting Secretary since Gardner left, Mar. 1.
    n: '[Remarks at the Swearing In of Wilbur J. Cohen as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-wilbur-j-cohen-secretary-health-education-and-welfare) (May 16, 1968). [[w.berkowitz-mr-social-security]]. Names: Cohen, Gardner, Johnson.'
    tags: [name:cohen-wilbur-j, name:gardner-john-w, name:johnson-lyndon-b]
  - id: cal.1968-05-17.war-opposition
    when: May 17
    date: '1968-05-17'
    thread: war-opposition
    also: [draft]
    c: Catonsville, Md., 12:50 p.m. Nine Catholics, the priests Daniel and Philip Berrigan among them, take some 378 files from Local Board No. 33 to the parking lot and burn them with homemade napalm. Arrested there. Philip Berrigan already convicted for pouring blood on the files of the Baltimore customs house, Oct. 27, 1967 (Check).
    n: '*United States v. Moylan*, [417 F.2d 1002](https://static.case.law/f2d/417/html/1002-01.html) (4th Cir. 1969), the appeal. [[w.peters-catonsville-nine]]. Names: Daniel Berrigan, Philip Berrigan.'
    tags: [name:berrigan-daniel, name:berrigan-philip, state:md]
  - id: cal.1968-05-18.vietnam
    when: May 18–25
    date: '1968-05-18'
    thread: vietnam
    c: Saigon. Nguyễn Văn Thiệu accepts the resignation of Nguyễn Văn Lộc's cabinet and names Trần Văn Hương Prime Minister. Hương's cabinet announced May 25; Bunker calls it "a considerable move toward civilian government."
    n: 'FRUS 1964–68, VI, doc. [245](https://history.state.gov/historicaldocuments/frus1964-68v06/d245). [[w.bunker-papers]]; [[w.schaffer-ellsworth-bunker]]; [[w.spector-after-tet]]. Names: Nguyễn Văn Thiệu, Nguyễn Văn Lộc, Trần Văn Hương, Bunker.'
    tags: [name:nguyen-van-thieu, name:nguyen-van-loc, name:tran-van-huong, name:bunker-ellsworth]
  - id: cal.1968-05-20.court
    when: May 20
    date: '1968-05-20'
    thread: court
    also: [crime-and-hijacking]
    c: '*Duncan v. Louisiana*, [391 U.S. 145](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391145/usrep391145.pdf): the Sixth Amendment''s jury trial binds the States through the Fourteenth in serious criminal cases. Gary Duncan, 19, a Negro of Plaquemines Parish, tried without a jury for simple battery on a white boy, sentenced to 60 days and $150; the crime punishable by two years. White for the Court, 7–2; Black, with Douglas, and Fortas concurring; Harlan, with Stewart, dissenting.'
    n: Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]; [[w.cox-warren-court]]. See [[cal.1967-12-18.court]].
    tags: [name:white-byron-r, name:black-hugo-l, name:douglas-william-o, name:fortas-abe, name:harlan-john-marshall, name:stewart-potter, state:la]
  - id: cal.1968-05-21.governors-il
    when: May 20–21
    date: '1968-05-20'
    thread: governors
    c: Illinois. Kerner, named by Johnson to the Seventh Circuit (nominated Mar. 11, confirmed Apr. 11), resigns as governor, May 20. Shapiro, the lieutenant governor since 1961, sworn governor, May 21, for the rest of the term.
    n: '[Wikipedia, "Otto Kerner Jr."](https://en.wikipedia.org/wiki/Otto_Kerner_Jr.); [Wikipedia, "Samuel Shapiro (Illinois politician)"](https://en.wikipedia.org/wiki/Samuel_Shapiro_(Illinois_politician)). Check: the *Illinois Blue Book*, 1969–70. [[w.barnhart-kerner]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1964-11-03.governors-il]]. Names: Kerner, Shapiro, Johnson.'
    tags: [state:il, name:kerner-otto, name:shapiro-samuel-h, name:johnson-lyndon-b]
  - id: cal.1968-05-21.poverty
    when: May 21
    date: '1968-05-21'
    thread: poverty
    also: [farm, press-and-broadcasting]
    c: 'CBS Reports, *Hunger in America*: hunger in San Antonio, Loudoun County, Va., among the Navajo, and in Alabama''s Black Belt; the Agriculture Department''s food programs. Freeman answers it, and asks CBS for equal time (Check).'
    n: '[[w.kotz-let-them-eat-promises]]. See [[cal.1967-04-10.poverty]]. Names: Freeman.'
    tags: [name:freeman-orville-l]
  - id: cal.1968-05-22.europe-and-the-alliance
    when: May 22–June 30
    date: '1968-05-22'
    thread: europe-and-the-alliance
    also: [economy]
    c: 'France. The University of Paris at Nanterre closed May 2; students and police in the streets from May 6; a general strike May 13, the Sorbonne occupied May 14; by May 21 some 8 million on strike. NSC, May 22: Katzenbach expects de Gaulle to defeat a vote of censure. Shriver, May 28: his authority in France, and France''s abroad, "significantly reduced." May 30, de Gaulle will not resign; the Assembly dissolved, elections June 23 and 30. Fowler, June 6: the franc''s crisis a threat to the monetary system and an opportunity. The Gaullists win a majority of the Assembly, June 30 (Check the seats).'
    n: 'FRUS 1964–68, XII, docs. [78](https://history.state.gov/historicaldocuments/frus1964-68v12/d78), [79](https://history.state.gov/historicaldocuments/frus1964-68v12/d79), [80](https://history.state.gov/historicaldocuments/frus1964-68v12/d80); VIII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v08/d199). [[w.jackson-de-gaulle]]; [[w.seidman-imaginary-revolution]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.gavin-gold-dollars-and-power]]. Names: Katzenbach, de Gaulle, Shriver, Fowler.'
    tags: [name:katzenbach-nicholas, name:de-gaulle-charles, name:shriver-r-sargent, name:fowler-henry-h]
  - id: cal.1968-05-25.vietnam
    when: May 25–28
    date: '1968-05-25'
    thread: vietnam
    c: 'The bombing between the 19th and 20th parallels. Lunch, May 25: Clifford, sorties in the North up from 3,200 in February to 9,100 in May; Taylor and Rostow for going back to the 20th; Rusk thinks the bombing south of it more effective. Johnson: Rusk and Clifford to "figure out how to get back to the 20th parallel with little bombast," Vance home first. May 28, Vance: no bombing north of the 20th, Hanoi would break off the talks; perhaps selective bombing north of the 19th. Katzenbach: going above the 19th "may hurt you on tax bill." No change ordered (Check).'
    n: 'FRUS 1964–68, VI, docs. [249](https://history.state.gov/historicaldocuments/frus1964-68v06/d249), [253](https://history.state.gov/historicaldocuments/frus1964-68v06/d253). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-05-13.vietnam]]; [[cal.1968-03-31.elections-1968]]. Names: Clifford, Taylor, Rostow, Rusk, Vance, Katzenbach, Johnson.'
    tags: [name:clifford-clark, name:taylor-maxwell, name:rostow-walt-w, name:rusk-dean, name:vance-cyrus, name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1968-05-27.desegregation-schools
    when: May 27
    date: '1968-05-27'
    thread: desegregation-schools
    also: [court]
    c: '*Green v. County School Board of New Kent County*, [391 U.S. 430](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391430/usrep391430.pdf): a "freedom-of-choice" plan that leaves a dual system in place does not satisfy *Brown*; the board must "come forward with a plan that promises realistically to work, and promises realistically to work now." New Kent County, Va., two schools, one white, one Negro, still. Brennan for a unanimous Court. The same day, *Raney* (Gould, Ark.) and *Monroe* (Jackson, Tenn.).'
    n: 'Opinion (K–J Cong. II.J.1). [[w.orfield-reconstruction-of-southern-education]]; [[w.powe-warren-court-and-american]]. Names: Brennan.'
    tags: [name:brennan-william-j-jr, state:va]
  - id: cal.1968-05-27.draft
    when: May 27
    date: '1968-05-27'
    thread: draft
    also: [war-opposition, court]
    c: '*United States v. O''Brien*, [391 U.S. 367](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391367/usrep391367.pdf): the 1965 amendment making it a crime to destroy or mutilate a draft card upheld; David O''Brien had burned his on the steps of the South Boston courthouse, Mar. 31, 1966. A regulation of conduct valid where it furthers an important interest unrelated to suppressing expression. Warren for the Court, 7–1; Douglas dissenting; Marshall took no part.'
    n: Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]. See [[cal.1965-11-02.students]].
    tags: [name:warren-earl, name:douglas-william-o, name:marshall-thurgood, state:ma, city:boston]
  - id: cal.1968-05-28.elections-1968
    when: May 28
    date: '1968-05-28'
    thread: elections-1968
    c: 'Primaries in Florida and Oregon. Republican: unpledged delegates in Florida; Nixon in Oregon. Democratic: Smathers in Florida; McCarthy in Oregon.'
    n: '[*Tabulation of Official Vote, Florida Primary Elections, 1968*, 25–32](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1968/page/n30); Or., [*Official Abstract of Votes, Primary Election 1968*, 34–36](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411031/File/document). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Smathers, Nixon.'
    tags: [primary:1968-05-28, name:mccarthy-eugene-j, name:smathers-george-a, name:nixon-richard-m]
  - id: cal.1968-05-28.cities-and-housing
    when: May 28
    date: '1968-05-28'
    thread: cities-and-housing
    c: 'The Senate passes S. 3497, the Housing and Urban Development Act of 1968, [67–4](https://voteview.com/rollcall/RS0900447): subsidies for homes bought by families of lower income and for rental housing; guarantees for new communities kept, [27–38](https://voteview.com/rollcall/RS0900441); the National Insurance Development Corporation, for insurance in riot areas, kept, [10–62](https://voteview.com/rollcall/RS0900446). Johnson to Sparkman, May 29.'
    n: '[Letter to Senator Sparkman Following Senate Passage of the Housing and Urban Development Bill](https://www.presidency.ucsb.edu/documents/letter-senator-sparkman-following-senate-passage-the-housing-and-urban-development-bill) (May 29, 1968). [[w.hays-federal-government-and-urban]]. See [[cal.1968-02-22.cities-and-housing]]. Names: Sparkman, Johnson.'
    tags: [name:sparkman-john, name:johnson-lyndon-b]
  - id: cal.1968-05-28.elections-1968-2
    when: May 28
    date: '1968-05-28'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'Oregon: McCarthy over Kennedy, the first election a Kennedy had lost (Check). Nebraska, May 14, had gone to Kennedy, McCarthy second. Both to California for June 4.'
    n: 'See [[cal.1968-05-28.elections-1968]]; [[cal.1968-05-14.elections-1968]]; [[cal.1968-03-14.robert-kennedy]]. Names: McCarthy, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, state:or, state:ne]
  - id: cal.1968-05-28.trade
    when: May 28
    date: '1968-05-28'
    thread: trade
    c: 'Message on trade, a Trade Expansion Act of 1968: the President''s authority to adjust tariffs extended through June 30, 1970; the American Selling Price system of customs valuation ended, the price of the Kennedy Round''s concessions on chemicals; adjustment assistance eased; appropriations for the American share of the GATT''s costs.'
    n: '[Special Message to the Congress: "Greater Prosperity Through Expanded World Trade"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-greater-prosperity-through-expanded-world-trade) (May 28, 1968). [[w.zeiler-american-trade-and-power]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-05-29.consumers
    when: May 29
    date: '1968-05-29'
    thread: consumers
    c: 'Consumer Credit Protection Act signed, [82 Stat. 146](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg146.pdf). Title I, truth in lending: the finance charge stated in dollars and as an annual percentage rate. Federal penalties on extortionate credit, the loan shark; limits on the garnishment of wages; a National Commission on Consumer Finance. Paul Douglas, its first sponsor in the Senate, at the signing; Leonor Sullivan its manager in the House (Check).'
