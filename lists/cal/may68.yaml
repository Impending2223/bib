    date: '1968-05-28'
    thread: elections-1968
    c: 'Primaries in Florida and Oregon. Republican: unpledged delegates in Florida; Nixon in Oregon. Democratic: Smathers in Florida; McCarthy in Oregon.'
    n: '[*Tabulation of Official Vote, Florida Primary Elections, 1968*, 25–32](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1968/page/n30); Or., [*Official Abstract of Votes, Primary Election 1968*, 34–36](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411031/File/document). CQ Guide 6th (2010) 410. See [[cal.1968-03-12.elections-1968]]. Names: McCarthy, Smathers, Nixon.'
