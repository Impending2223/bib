  - id: cal.1967-01-03.congress
    when: Jan. 3
    date: '1967-01-03'
    thread: congress
    c: 'Powell. The Special Subcommittee on Contracts of the House Administration Committee, Hays its chairman, reports on the Education and Labor Committee''s spending: Powell and some of the committee''s staff deceived the House on travel; strong evidence of salary paid his wife unlawfully, at his direction (Check the date). No action in the 89th Congress, which ends at noon.'
    n: 'H.R. Rep. No. 2349, 89th Cong., 2d Sess., 6–7 (1966), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). [[w.hamilton-adam-clayton-powell-jr]]; [[w.powell-adam-by-adam]]. See [[cal.1966-01-10.congress]]. Names: Powell (K–J Cong. III.D); Hays (Cong. III.E).'
    tags: [name:powell-adam-clayton-jr, name:hays-wayne-l]
  - id: cal.1967-01-03.assassination
    when: Jan. 3
    date: '1967-01-03'
    thread: assassination
    c: 'Ruby dies at Parkland Hospital, Dallas, of a pulmonary embolism; cancer found in December. The Texas Court of Criminal Appeals had reversed his conviction Oct. 5, 1966, and ordered a new trial outside Dallas (Check).'
    n: '[[w.wills-jack-ruby]]; [[w.kaplan-trial-of-jack-ruby]]. See [[cal.1964-03-14.assassination]]. Names: Ruby (K–J Cong. III.K).'
    tags: [name:ruby-jack]
