    tags: [state:ms, city:jackson, name:johnson-paul-b-jr]
  - id: cal.1964-01-21.transition-and-staff
    when: Jan. 21
    date: '1964-01-21'
    thread: transition-and-staff
    c: Murrow resigns from the USIA, ill; Rowan, ambassador to Finland, to succeed him, sworn Feb. 28.
    n: 'Letter Accepting Resignation of Edward R. Murrow as Director, USIA, [1963–64 Pub. Papers 167](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=251) (Jan. 21, 1964); Remarks at the Swearing In of Carl T. Rowan, [1963–64 Pub. Papers 321](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=405) (Feb. 28, 1964). Rowan named Jan. 21; check. See [[cal.1964-01-15.transition-and-staff]]. Names: Johnson, Murrow, Rowan.'
    tags: [name:johnson-lyndon-b, name:murrow-edward-r, name:rowan-carl-t]
  - id: cal.1964-01-21.baker
    when: Jan. 21
    date: '1964-01-21'
    thread: baker
    c: Rules Committee releases Reynolds's closed testimony of Jan. 9 and 17. Advertising time on KTBC, Johnson's Austin station, bought for $1,208 when he wrote Johnson's life insurance; a Magnavox stereo set installed in Johnson's Washington home, July 1959, at Baker's suggestion.
    n: '*Financial or Business Interests of Officers or Employees of the Senate: Hearings Before the S. Comm. on Rules and Administration*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg27211p1), at II ("released to the public January 21, 1964"), [35–37](https://www.govinfo.gov/content/pkg/CHRG-88shrg27211p1/pdf/CHRG-88shrg27211p1.pdf#page=39) (1964). See [[cal.1963-11-22.baker]]. Names: Reynolds, Johnson, Robert Baker.'
    tags: [name:reynolds-don-b, name:johnson-lyndon-b, name:baker-robert-g]
  - id: cal.1964-01-21.civil-rights-bill
    when: Jan. 21
    date: '1964-01-21'
    thread: civil-rights-bill
    c: 'Webb to Johnson after seeing Halleck: a $750,000 building at Purdue, research grants on an installment basis; "the minute he kicks over the traces, we stop the installment." Johnson: "Sounds good."'
    n: '[Johnson and Webb, 3:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-webb-january-21-1964), Conversation WH6401-18-1454 (Miller Center). [[w.caro-passage-of-power]], 560. See [[cal.1964-01-18.civil-rights-bill]]. Names: Webb, Johnson, Halleck.'
    tags: [name:webb-james-e, name:johnson-lyndon-b, name:halleck-charles-a]
  - id: cal.1964-01-22.mississippi-hattiesburg
    when: Jan. 22
    date: '1964-01-22'
    thread: mississippi
    also: [voting-rights, civil-rights-organizations]
    c: 'Hattiesburg. Freedom Day: Negro applicants line up at the Forrest County courthouse to register before the circuit clerk, some fifty pickets and some thirty Northern clergymen beside them; Moses, of SNCC, among the organizers. Check the numbers.'
    n: 'SNCC, ["Hattiesburg, Miss., Freedom Day, January 22, 1964"](https://www.crmvet.org/docs/6401_sncc_hattiesburg-fd.pdf). [[w.dittmer-local-people]], 219–21 (nearly 200 at the courthouse by 10:30, fifty clergymen from out of the State; Moses the one arrest there). To check: [[w.payne-ive-got-the-light]]; [[w.branch-pillar-of-fire]]. See [[cal.1962-05.mississippi-ms]]. Check: Dittmer, 220–21, gives nearly 200 at the courthouse by 10:30, fifty clergymen from out of the State among them, and Moses the one arrested there. Names: Moses.'
    src:
      c: 39e62b2f
      rows:
        - 'https://www.crmvet.org/docs/6401_sncc_hattiesburg-fd.pdf: all'
        - 'w.dittmer-local-people 219–21: A-C'
    tags: [state:ms, city:hattiesburg, name:moses-robert-p]
  - id: cal.1964-01-22.amendments
    when: Jan. 22–23
    date: '1964-01-22'
    thread: amendments
    also: [succession, congress]
    c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Bayh''s, opens hearings on presidential succession and disability, S.J. Res. 13, 28, 35, 138, 139, 140 and 143: Members of Congress first, then public hearings in February and March, Nixon and the former Attorneys General Brownell and Biddle among the witnesses. The same month a dozen legal scholars called by the American Bar Association reach a consensus in two days; its House of Delegates endorses it.'
    n: 'Bayh''s notice, [110 Cong. Rec. 526](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-8-1.pdf) (1964); his account of the hearings, [8161–62](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-9-2.pdf). The consensus, [111 Cong. Rec. 1175–76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-17-1.pdf) (1965). *Presidential Inability and Vacancies in the Office of Vice President: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 88th Cong. (1964) (Check the title and a digitized copy). To check: [[w.feerick-twenty-fifth-amendment]]; [[w.bayh-one-heartbeat-away]]. See [[cal.1963-11-22.succession]]. Names: Bayh, Nixon, Brownell.'
    tags: [name:bayh-birch, name:nixon-richard-m, name:brownell-herbert-jr]
  - id: cal.1964-01-23.voting-rights
    when: Jan. 23
    date: '1964-01-23'
    thread: voting-rights
    also: [amendments]
    c: 'South Dakota ratifies the Twenty-fourth Amendment, the thirty-eighth State: no poll tax in federal elections. Certified Feb. 4, [78 Stat. 1117](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1117.pdf), Johnson watching, a first. Poll taxes stand for State elections in Alabama, Arkansas, Mississippi, Texas, and Virginia.'
    n: 'Statement by the President Announcing the Adoption of the 24th Amendment to the Constitution, [1963–64 Pub. Papers 222](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=306) (Jan. 23, 1964); Remarks Upon Witnessing the Certification of the 24th Amendment to the Constitution, [1963–64 Pub. Papers 260](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=344) (Feb. 4, 1964). U.S. Const. amend. XXIV (K–J Cong. II.J.2). To check: [[w.lawson-black-ballots]]. See [[cal.1962-08-27.voting-rights]]; [[cal.1963-03-22.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:holland-spessard-l, name:boutin-bernard-l]
  - id: cal.1964-01-23.rules
    when: Jan. 23
    date: '1964-01-23'
    thread: rules
    also: [congress]
    c: 'Senate adopts Pastore''s germaneness rule, S. Res. 89, [57–25](https://voteview.com/rollcall/RS0880234): debate germane to the pending business for three hours after the morning hour, unless waived. Jan. 30, S. Res. 111, committees to sit through the morning hour, [47–33](https://voteview.com/rollcall/RS0880237); Clark''s amendments to let them sit while the Senate debates lost, [36–43](https://voteview.com/rollcall/RS0880235), [34–45](https://voteview.com/rollcall/RS0880236).'
    n: '[110 Cong. Rec., Senate, Jan. 23, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-12-2.pdf); [110 Cong. Rec., Senate, Jan. 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-1-1.pdf). See [[cal.1963-02-07.rules]]; [[cal.1963-02-19.congress]]. Names: Pastore, Clark.'
    tags: [name:pastore-john-o, name:clark-joseph-s]
  - id: cal.1964-01-23.baker
    when: Jan. 23
    date: '1964-01-23'
    thread: baker
    c: 'Johnson, at a news conference called for 5 p.m.: insurance on his life, bought in 1957 by the family company, Reynolds taking a commission; $78,000 in premiums paid. The stereo set a gift of "the Baker family."'
    n: 'The President''s News Conference, [1963–64 Pub. Papers 219](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=303) (Jan. 23, 1964). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). To check: [[w.baker-wheeling-and-dealing]]. See [[cal.1963-11-22.baker]], [[cal.1964-01-21.baker]]. Names: Johnson, Reynolds, Robert Baker.'
    tags: [name:johnson-lyndon-b, name:reynolds-don-b, name:baker-robert-g]
  - id: cal.1964-01-23.robert-kennedy
    when: Jan. 23
    date: '1964-01-23'
    thread: robert-kennedy
    also: [indonesia]
    c: 'Robert Kennedy at Djakarta, after Kuala Lumpur and Manila: Sukarno agrees to order a cease-fire, and to a meeting of the foreign ministers of Indonesia, Malaysia, and the Philippines at Bangkok, Feb. 5–6. Then Bangkok and London.'
    n: '[FRUS 1964–68, XXVI, doc. 23](https://history.state.gov/historicaldocuments/frus1964-68v26/d23). See [[cal.1964-01-17.robert-kennedy]]. Names: Robert Kennedy, Sukarno.'
    tags: [name:kennedy-robert-f, name:sukarno]
  - id: cal.1964-01-23.civil-rights-bill
    when: Jan. 23
    date: '1964-01-23'
    thread: civil-rights-bill
    c: 'Smith gives in, Republicans on Rules having met with its Democrats: the hearings to end Jan. 30, the bill "will be voted out."'
    n: '[[w.caro-passage-of-power]], 560. Check: the Rules Committee''s record. See [[cal.1964-01-09.civil-rights-bill]]. Names: Smith, Johnson.'
    tags: [name:smith-howard-w, name:johnson-lyndon-b]
  - id: cal.1964-01-23.economy
    when: Jan. 23
    date: '1964-01-23'
    thread: economy
    c: 'Finance adopts Dirksen''s amendment repealing the excises on jewelry, furs, handbags and luggage, 12–5, $450 million a year; Anderson, Hartke and Ribicoff revive their own. Johnson by telephone: the three to withdraw them; Byrd to allow one motion on all the amendments. The afternoon vote strikes them, 9–8, Byrd''s the ninth: "My vote."'
    n: '[Johnson and Smathers, 12:34 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-january-23-1964), Conversation WH6401-19-1489 (Miller Center); [Anderson, 1:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-clinton-anderson-january-23-1964), WH6401-19-1490; [Hartke, 1:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-vance-hartke-january-23-1964), WH6401-19-1492; [Ribicoff, 1:14 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-abraham-ribicoff-and-office-conversation), WH6401-19-1493; [Byrd, 1:17 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-23-1964), WH6401-19-1495; [Byrd to the operator](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd), WH6401-19-1496; [Byrd, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-23-1964-0), WH6401-20-1510 (Miller Center). [[w.caro-passage-of-power]], 554–57. See [[cal.1964-01-07.economy]]. Names: Dirksen, Clinton Anderson, Hartke, Ribicoff, Johnson, Byrd, Smathers.'
    tags: [name:dirksen-everett, name:anderson-clinton-p, name:hartke-rupert-v, name:ribicoff-abraham, name:johnson-lyndon-b, name:byrd-harry-f, name:smathers-george-a]
  - id: cal.1964-01-24.transition-and-staff
    when: Jan. 24
    date: '1964-01-24'
    thread: transition-and-staff
    c: Hornig sworn as science adviser for Wiesner, back to MIT.
    n: 'Remarks at the Swearing In of Donald F. Hornig, [1963–64 Pub. Papers 223](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=307) (Jan. 24, 1964). See [[cal.1964-01-15.transition-and-staff]]. Names: Johnson, Hornig, Wiesner.'
    tags: [name:johnson-lyndon-b, name:hornig-donald-f, name:wiesner-jerome-b]
  - id: cal.1964-01-25.europe-and-the-alliance
    when: Jan. 25–28
    date: '1964-01-25'
    thread: cyprus
    c: Cyprus, fighting between Greek and Turkish Cypriots since Dec. 21; the guarantor powers' conference in London broken down. Britain asks American troops for an allied force. Johnson, with Ball, McNamara, and Taylor, lets Ball explore a NATO force of 10,000 with a token American battalion of 1,200, and a mediator.
    n: 'FRUS 1964–68, XVI, docs. [3](https://history.state.gov/historicaldocuments/frus1964-68v16/d3), [4](https://history.state.gov/historicaldocuments/frus1964-68v16/d4) (editorial note). To check: [[w.ball-past-has-another-pattern]]; [[w.nicolet-united-states-policy-towards]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, Ball, McNamara, Taylor.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1964-01-27.europe-and-the-alliance
    when: Jan. 27
    date: '1964-01-27'
    thread: europe-and-the-alliance
    also: [vietnam, china]
    c: 'France and the People''s Republic of China announce recognition. Johnson keeps the protest low; Chiang asked not to break with Paris first. De Gaulle, Jan. 31: no neutrality in Southeast Asia without China. Feb. 10, Taipei ends relations with France.'
    n: '[FRUS 1964–68, XXX, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v30/d2); [FRUS 1964–68, XXX, doc. 12](https://history.state.gov/historicaldocuments/frus1964-68v30/d12); [FRUS 1964–68, I, doc. 27](https://history.state.gov/historicaldocuments/frus1964-68v01/d27). [[w.schwartz-lyndon-johnson-and-europe]], 31 (Johnson''s response). To check: [[w.logevall-choosing-war]]; [[w.bohlen-witness-to-history-1929]]. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Johnson, de Gaulle, Chiang Kai-shek.'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles, name:chiang-kai-shek]
  - id: cal.1964-01-27.elections-1964
    when: Jan. 27
    date: '1964-01-27'
    thread: elections-1964
    c: 'Margaret Chase Smith announces for the Republican nomination, at the Women''s National Press Club: "I have few illusions and no money, but I''m staying for the finish."'
    n: 'To check: [[w.white-making-of-the-president-1965]]; [[w.declaration-of-conscience]]. See [[cal.1964-01-03.elections-1964]]. Names: Smith.'
    tags: [name:smith-margaret-chase]
  - id: cal.1964-01-27.cities-and-housing
    when: Jan. 27
    date: '1964-01-27'
    thread: cities-and-housing
    c: Housing message. Public housing, 50,000 units a year for four years, and 40,000 leased; urban renewal, $1.4 billion more for two years; loans for the elderly; grants and loans toward new communities. The mass transit bill the Senate passed. A Department of Housing and Community Development.
    n: 'Special Message to the Congress on Housing and Community Development, [1963–64 Pub. Papers 233](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=317) (Jan. 27, 1964). See [[cal.1962-01-24.program]]; [[cal.1963-04-04.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-27.japan-and-korea
    when: Jan. 27–28
    date: '1964-01-27'
    thread: japan
    c: 'Third meeting of the Joint Committee, Tokyo: Rusk, Hodges, Wirtz, Heller. Rusk with Ikeda and Ōhira on Korea, China, defense; Ōhira: Japanese opinion strong for an understanding with Peking, recognition not in prospect. The communiqué repeats the promise on the interest equalization tax. Then Seoul.'
    n: 'FRUS 1964–68, XXIX, pt. 2, docs. [7](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d7), [8](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d8); FRUS 1964–68, XXIX, pt. 1, docs. [1](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d1), [333](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d333), [335](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d335). See [[cal.1963-11-25.japan-and-korea]]; [[cal.1963-08-01.japan-and-korea]]. Names: Rusk, Hodges, Wirtz, Heller, Ikeda, Ōhira.'
    tags: [name:rusk-dean, name:hodges-luther-h, name:wirtz-w-willard, name:heller-walter-w, name:ikeda-hayato, name:ohira-masayoshi]
