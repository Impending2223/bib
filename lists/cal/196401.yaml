    thread: space
    c: Saturn I, two stages, puts some 37,000 pounds in orbit, the largest payload yet; liquid hydrogen proved as a fuel.
    n: 'Statement by the President Following the Launching of the First Satellite by Saturn I, [1963–64 Pub. Papers 248](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=332) (Jan. 29, 1964). See [[cal.1963-11-29.space]]. Names: Johnson.'
