    thread: vietnam-saigon
    c: 'Johnson''s New Year''s message to General Minh, dated Dec. 31: "the fullest measure of support"; American personnel and matériel "as needed to assist you in achieving victory." "Neutralization" of South Vietnam unacceptable, "only another name for a Communist takeover."'
