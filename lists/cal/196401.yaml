    when: Jan. 1
    date: '1964-01-01'
    thread: robert-kennedy
    c: 'Johnson, from the ranch, wires Robert Kennedy: "Your brother would have been very proud of the strength you have shown. ... I will need your counsel and support." They had not met in December.'
