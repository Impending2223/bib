    c: The Florida Legislative Investigation Committee, the Johns Committee, publishes *Homosexuality and Citizenship in Florida*, its report on homosexuals in the schools, the universities and the State's offices, with photographs; 25 cents a copy. The attorney general warns it to stop distributing the report as obscene.
    n: '[*Homosexuality and Citizenship in Florida*](https://archive.org/details/ReportJan1964) (Jan. 1964). To check: [[w.braukman-communists-and-perverts-under]]. See [[cal.1963-03-25.court]]. Names: Johns.'
