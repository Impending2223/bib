  - id: cal.1964-01-01.opinion-5
    when: Jan. 1
    date: '1964-01-01'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 12–17: Johnson 75, Goldwater 20, undecided, other 5; Johnson 69, Nixon 24, undecided, other 7.'
    n: '[[w.gallup-poll]], III, 1857. Names: Johnson, Goldwater, Nixon.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:nixon-richard-m]
  - id: cal.1964-01-02.press-and-broadcasting
    when: Jan. 2
    date: '1964-01-02'
    thread: press-and-broadcasting
    c: 'Johnson to George Brown, in the hospital: no merger without a letter from Jones that the *Chronicle* will support his administration "as long as you''re there"; the bank not to be mentioned. Brown: Albert Thomas thinks it "too much of a trade." "Okay." Jones''s letter the next day.'
    n: '[Johnson and George Brown, 11:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-brown-january-2-1964), Conversation WH6401-03-1143 (Miller Center). [[w.caro-passage-of-power]], 525–27. See [[cal.1963-12-25.press-and-broadcasting]]. Names: Johnson, Albert Thomas.'
    tags: [name:johnson-lyndon-b, name:thomas-albert]
  - id: cal.1964-01-03.elections-1964
    when: Jan. 3
    date: '1964-01-03'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater announces for the Republican nomination, at his home in Arizona: "I will offer a choice, not an echo." That morning, in his bedroom: Kitchel to manage the campaign, Burch his assistant, Kleindienst director of field operations.'
    n: '[Remarks Announcing Candidacy for the Republican Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-announcing-candidacy-for-the-republican-presidential-nomination) (Jan. 3, 1964). [[w.perlstein-before-the-storm]], 258–61. To check: [[w.shadegg-what-happened-to-goldwater]]; [[w.white-suite-3505]]; [[w.goldberg-barry-goldwater]]; [[w.edwards-goldwater]]; [[w.middendorf-glorious-disaster]]; [[w.goldwater-with-no-apologies]]. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater, Kitchel, Burch, Kleindienst.'
    tags: [name:goldwater-barry-m, name:kitchel-denison, name:burch-dean, name:kleindienst-richard-g]
  - id: cal.1964-01-04.legislatures-il
    when: Jan. 4
    date: '1964-01-04'
    thread: legislatures
    c: 'Illinois Supreme Court, *People ex rel. Giannis v. Carpentier*, [30 Ill. 2d 24](https://static.case.law/ill-2d/30/case-pdfs/0024-01.pdf): Kerner''s veto of the House map valid, the commission having failed; the House of 177 to be elected at large in November. The legislature in special session provides for it; Kerner signs Jan. 29 (Check). Each party to nominate 118 by convention.'
    n: '*People ex rel. Giannis v. Carpentier*, [30 Ill. 2d 24](https://static.case.law/ill-2d/30/case-pdfs/0024-01.pdf) (1964) (Check the link). See [[cal.1963-07-01.legislatures-il]]. Names: Kerner.'
    tags: [state:il, name:kerner-otto]
  - id: cal.1964-01-04.press-and-broadcasting
    when: Jan. 4
    date: '1964-01-04'
    thread: press-and-broadcasting
    c: 'Johnson to Albert Jackson, managing editor of the *Dallas Times-Herald*, on its reporter Margaret Mayer''s letter of Dec. 17 asking about the Johnson stations: stop her. The paper''s records and its stations'' might be asked for. Jackson, Jan. 5: "We''ll take care of the thing tomorrow."'
    n: '[Johnson and Jackson, 8:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964), Conversation WH6401-05-1183 (Miller Center); [Jan. 5, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-jackson-january-5-1964-0), Conversation WH6401-05-1186 (Miller Center). [[w.caro-passage-of-power]], 521–23. The Miller Center''s address for the first call reads "january-5"; its catalogue and PRDE''s date the call Jan. 4, 8:45 p.m. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-05.opinion-5
    when: Jan. 5
    date: '1964-01-05'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 22–27: Republicans'' choice for 1964: Nixon 29, Goldwater 23, Lodge 19, Rockefeller 12, Romney 8, Scranton 4; no preference, others 5. Independents: Nixon 22, Goldwater 21, Lodge 18, Rockefeller 18.'
    n: '[[w.gallup-poll]], III, 1857. Names: Nixon, Goldwater, Lodge, Rockefeller, Romney, Scranton.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-01-05.king
    when: Jan. 5–6
    date: '1964-01-05'
    thread: king
    c: 'Washington, the Willard Hotel, King there for the argument of *New York Times v. Sullivan*. FBI agents plant microphones in his room: fifteen reels in two days, a party with SCLC colleagues and two women from Philadelphia. The transcripts made for the White House.'
    n: '[[w.garrow-bearing-the-cross]], 310. Check: the days. See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1964-01-06.vietnam
    when: Jan. 6
    date: '1964-01-06'
    thread: vietnam
    c: 'Mansfield to Johnson again: "Neither do we want another Korea." Close to "the point of no return"; less talk of American responsibility, more of the Vietnamese.'
    n: '[FRUS 1964–68, I, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v01/d2) (Gibbons: Jan. 7). [[w.gibbons-u-s-government-and]], II, 215–216; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 500 (Mansfield''s proposals, received Jan. 6). See [[cal.1963-12-07.vietnam]]. Names: Mansfield, Johnson.'
    src:
      c: b43a2759
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d2: all'
        - 'w.gibbons-u-s-government-and II, 215–216: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 500: A'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 500 n.11: all'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1964-01-07.congress
    when: Jan. 7
    date: '1964-01-07'
    thread: congress
    c: Second session of the 88th Congress convenes. Shelley resigns from the House to be mayor of San Francisco; Howard Baker, Sr., of Tennessee dies.
    n: '[110 Cong. Rec., Senate, Jan. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-1-1.pdf). See [[cal.1963-12-30.congress]]. Names: Shelley, Howard Baker.'
    tags: [name:shelley-john-f, name:baker-howard-h]
  - id: cal.1964-01-07.elections-1964
    when: Jan. 7
    date: '1964-01-07'
    thread: elections-1964-polls
    also: [opinion]
    c: 'Gallup, Jan. 2–7, released Jan. 19, 1964: Democrats'' choice for Vice President, 1964: Robert Kennedy 34, Stevenson 26, Humphrey 14, Shriver 8, Brown 5, Fulbright 2, McCarthy 2, Wagner 2; others, no preference 7. Independents: Stevenson 26, Robert Kennedy 25.'
    n: '[[w.gallup-poll]], III, 1860. Names: Robert Kennedy, Stevenson, Humphrey, Shriver, Brown, Wagner, Fulbright, McCarthy.'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:shriver-r-sargent, name:brown-edmund-g, name:fulbright-j-william, name:mccarthy-eugene-j, name:wagner-robert-f-jr]
  - id: cal.1964-01-07.opinion-5
    when: Jan. 7
    date: '1964-01-07'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Jan. 2–7, released Jan. 22, 1964: Johnson 75, Goldwater 18; Johnson 68, Lodge 25; Johnson 71, Nixon 24; Johnson 77, Rockefeller 16. Undecided 7, 7, 5, 7. Republicans: Goldwater 47, Johnson 41; Lodge 61, Johnson 31; Nixon 61, Johnson 33; Johnson 48, Rockefeller 44.'
    n: '[[w.gallup-poll]], III, 1860–62. Names: Johnson, Goldwater, Lodge, Nixon, Rockefeller.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m, name:lodge-henry-cabot, name:nixon-richard-m, name:rockefeller-nelson]
  - id: cal.1964-01-07.goldwater
    when: Jan. 7
    date: '1964-01-07'
    thread: goldwater
    also: [elections-1964]
    c: 'Concord, N.H., the campaign''s first week: "I would like to suggest one change, that social security be made voluntary." Rockefeller takes it up; Goldwater denies he would wreck the system.'
    n: 'Quoted with its date in Humphrey''s speech at Bakersfield, Cal., 1964 ([Humphrey papers, MNHS](https://www2.mnhs.org/library/findaids/00442/pdfa/00442-01375.pdf)); the Democrats'' spot ["Social Security"](https://www.livingroomcandidate.org/commercials/1964/social-security) (1964). [[w.perlstein-before-the-storm]], 269–70, 274. To check: [[w.white-making-of-the-president-1965]]. See [[cal.1964-01-03.elections-1964]]. Names: Goldwater, Rockefeller.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson]
  - id: cal.1964-01-07.economy
    when: Jan. 7
    date: '1964-01-07'
    thread: economy
    c: 'Byrd and Williams brought to the White House to see the budget''s galleys and the Budget Bureau''s tally sheets: $97.9 billion. Johnson: "Now you can tell your friends that you forced the President of the United States to reduce the budget."'
    n: '[[w.caro-passage-of-power]], 552–53. See [[cal.1963-12-05.economy]]. Names: Byrd, Williams, Johnson.'
    tags: [name:byrd-harry-f, name:williams-john-j, name:johnson-lyndon-b]
  - id: cal.1964-01-08.program
    when: Jan. 8
    date: '1964-01-08'
    thread: program
    c: State of the Union. "This administration today, here and now, declares unconditional war on poverty in America." The civil rights bill to pass this session; the tax bill by Feb. 1, withholding at 14 percent; hospital insurance under Social Security; Appalachia, youth employment, food stamps, a National Service Corps, the minimum wage to 2 million more; immigrants chosen by skill and family, not birthplace. Budget $97.9 billion, $500 million under the current year; the deficit halved, to $4.9 billion. Enriched uranium cut 25 percent.
    n: 'Annual Message to the Congress on the State of the Union, [1963–64 Pub. Papers 112](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=196) (Jan. 8, 1964). [110 Cong. Rec., House, Jan. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-2-2.pdf). Recording (K–J Adm. II.I). [[w.johnson-vantage-point]], 37 (the budget, the deficit halved), 75 (the war on poverty), 465 (enriched uranium). [[w.dallek-flawed-giant]], 62. [[w.caro-passage-of-power]], 537–50 (the address, the war on poverty, civil rights). To check: [[w.matusow-unraveling-of-america]]; [[w.gillette-launching-the-war-on]]; [[w.sundquist-politics-and-policy]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1963-01-14.program]]; [[cal.1963-11-27.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - poverty
      - economy
      - civil-rights-bill
      - medicare
      - jobs-and-wages
      - cities-and-housing
      - immigration
      - testing
  - id: cal.1964-01-08.economy
    when: Jan. 8
    date: '1964-01-08'
    thread: economy
    c: 'After the State of the Union, Johnson by telephone on the budget held under $98 billion. To Byrd, 3:25 p.m.: "You are my inspiration for doing it." Fowler, 5:40 p.m.: "making an honest man out of me and out of Wilbur Mills in one day."'
    n: '[Johnson and Byrd, 3:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-8-1964), Conversation WH6401-08-1247; [Johnson and Fowler, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-january-8-1964), Conversation WH6401-08-1254 (Miller Center). [[w.zelizer-taxing-america]], 203; [[w.caro-passage-of-power]], 553 (the call to Byrd). See [[cal.1964-01-08.program]]; [[cal.1963-01-24.economy]]. Names: Johnson, Byrd, Fowler, Mills.'
    tags: [name:johnson-lyndon-b, name:byrd-harry-f, name:fowler-henry-h, name:mills-wilbur-d]
  - id: cal.1964-01-08.press-and-broadcasting
    when: Jan. 8
    date: '1964-01-08'
    thread: press-and-broadcasting
    c: 'Before the State of the Union, Johnson to Jones: the letter received, the merger signed that morning, "From here on out, we''re partners"; to Brown, the same. Saxon announces the approval Jan. 13.'
    n: '[Johnson and Jones, 11:04 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-jones-january-8-1964), Conversation WH6401-08-1236 (Miller Center); [Johnson and Brown, 11:20 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-brown-and-office-secretary-january-8), Conversation WH6401-08-1239 (Miller Center). [[w.caro-passage-of-power]], 527. See [[cal.1963-12-25.press-and-broadcasting]]. Names: Johnson, Saxon.'
    tags: [name:johnson-lyndon-b, name:saxon-james-j]
  - id: cal.1964-01-09.latin-america
    when: Jan. 9–11
    date: '1964-01-09'
    thread: latin-america-panama
    c: 'Panama. Jan. 9, Panamanian students carry their flag to Balboa High School in the Canal Zone, where Zone students have raised the American flag; it is torn. Three days of rioting along the Zone and in Colón: about 22 Panamanians and four American soldiers killed. Check the count of dead.'
    n: 'FRUS 1964–68, XXXI, docs. [372](https://history.state.gov/historicaldocuments/frus1964-68v31/d372), [373](https://history.state.gov/historicaldocuments/frus1964-68v31/d373) (editorial note). [[w.johnson-vantage-point]], 180–81 (the march into the Zone; the rioting in Panama City and Colón; four American soldiers killed); [[w.dallek-flawed-giant]], 93–96. To check: [[w.lafeber-panama-canal]]; [[w.jorden-panama-odyssey]]; [[w.mcpherson-yankee-no]]; [[w.rabe-killing-zone]]; [[w.taking-charge]]. See [[cal.1963-03-18.latin-america]]. Check: Johnson has the Zone students raise the flag Jan. 7, the Panamanian students march in two days later, the rioting end Jan. 12, twenty Panamanians dead (180–81). Check: Dallek gives twenty-four Panamanians and four Americans killed (93).'
  - id: cal.1964-01-09.civil-rights-bill
    when: Jan. 9
    date: '1964-01-09'
    thread: civil-rights-bill
    c: Smith's Rules Committee opens hearings on the civil rights bill, as he promised in December.
    n: 'Daily Digest, [110 Cong. Rec. D7](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=5) (Jan. 9, 1964). [[w.caro-passage-of-power]], 558. To check: [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1963-12-09.civil-rights-bill]]. Names: Smith.'
    tags: [name:smith-howard-w]
  - id: cal.1964-01-10.latin-america-panama
    when: Jan. 10
    date: '1964-01-10'
    thread: latin-america-panama
    c: 'Chiari breaks relations. Johnson telephones him, and sends Mann and Vance. Chiari''s terms: "structural revision" of the 1903 treaty.'
    n: 'White House Statement on the Events in Panama, [1963–64 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=205) (Jan. 10, 1964). FRUS 1964–68, XXXI, docs. [368](https://history.state.gov/historicaldocuments/frus1964-68v31/d368), [370](https://history.state.gov/historicaldocuments/frus1964-68v31/d370). [[w.johnson-vantage-point]], 181–83 (the meeting, the call, Mann sent). See [[cal.1964-01-09.latin-america]]. Names: Chiari, Johnson, Mann, Vance.'
    tags: [name:chiari-roberto-f, name:johnson-lyndon-b, name:mann-thomas-c, name:vance-cyrus]
  - id: cal.1964-01-11.health
    when: Jan. 11
    date: '1964-01-11'
    thread: health
    c: 'The Surgeon General''s advisory committee reports, *Smoking and Health*: cigarette smoking causally related to lung cancer in men; "a health hazard of sufficient importance in the United States to warrant appropriate remedial action." Terry releases it on a Saturday.'
    n: 'Surgeon General''s Advisory Committee on Smoking and Health, [*Smoking and Health*](https://profiles.nlm.nih.gov/spotlight/nn/catalog/nlm:nlmuid-101584932X202-doc) (PHS Pub. No. 1103, 1964). To check: [[w.brandt-cigarette-century]]. Names: Terry.'
    tags: [name:terry-luther-l]
  - id: cal.1964-01-11.governors-la
    when: Jan. 11
    date: '1964-01-11'
    thread: governors
    also: [elections-1963]
    c: 'Louisiana''s Democratic runoff for governor: McKeithen over Morrison, 492,905 to 451,161, 52.2 percent. McKeithen carries every North Louisiana parish.'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1964_Louisiana_gubernatorial_election). See [[cal.1963-12-07.governors-la]]. Names: McKeithen, deLesseps Morrison.'
    tags: [name:mckeithen-john-j, name:morrison-delesseps-s, state:la]
  - id: cal.1964-01-12.africa
    when: Jan. 12
    date: '1964-01-12'
    thread: africa
    also: [europe-and-the-alliance]
    c: Zanzibar. African revolutionaries overthrow the Arab-led government, a month after independence; a republic, Karume its President.
    n: '[FRUS 1964–68, XXIV, doc. 181](https://history.state.gov/historicaldocuments/frus1964-68v24/d181) (Jan. 29). To check: [[w.petterson-revolution-in-zanzibar]]. Names: Karume.'
    tags: [name:karume-abeid]
  - id: cal.1964-01-13.middle-east
    when: Jan. 13–17
    date: '1964-01-13'
    thread: middle-east
    c: 'The Arab kings and presidents at Cairo, at Nasser''s call. To divert the Jordan''s sources in Syria and Lebanon from Israel; a Unified Arab Command; Shukairy to organize a "Palestine entity." Rusk to Johnson, Jan. 16: the diversion of the Jordan''s waters the toughest of the year''s problems.'
    n: 'FRUS 1964–68, XVIII, docs. [9](https://history.state.gov/historicaldocuments/frus1964-68v18/d9), [54](https://history.state.gov/historicaldocuments/frus1964-68v18/d54), [129](https://history.state.gov/historicaldocuments/frus1964-68v18/d129). To check: [[w.kerr-arab-cold-war]]; [[w.gerges-superpowers-and-the-middle]]; [[w.sayigh-armed-struggle-and-the]]; [[w.shlaim-iron-wall]]. Names: Nasser, Shukairy, Rusk.'
    tags: [name:nasser-gamal-abdel, name:shukairy-ahmad, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1964-01-14.poverty-nc
    when: Jan. 14
    date: '1964-01-14'
    thread: poverty
    c: 'Johnson to Sanford''s conference on poverty at Raleigh: "The North Carolina Fund promises to make an exciting and important contribution." The federal departments to cooperate.'
    n: 'Telegram to Governor Sanford on His Attack on Poverty in North Carolina, [1963–64 Pub. Papers 132](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=216) (Jan. 14, 1964). See [[cal.1963-07-18.poverty-nc]]. Names: Sanford, Johnson.'
    tags: [state:nc, name:sanford-terry, name:johnson-lyndon-b]
  - id: cal.1964-01-15.transition-and-staff
    when: Jan. 15
    date: '1964-01-15'
    thread: transition-and-staff
    c: Sorensen resigns as Special Counsel, to write his book on Kennedy; he leaves Feb. 29.
    n: 'Letter Accepting Resignation of Theodore C. Sorensen as Special Counsel to the President, [1963–64 Pub. Papers 137](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=221) (Jan. 15, 1964). [[w.caro-passage-of-power]], 589–90. To check: [[w.sorensen-counselor]]. See [[cal.1963-09-30.transition-and-staff]]. Names: Johnson, Sorensen, Kennedy.'
    tags: [name:johnson-lyndon-b, name:sorensen-theodore-c, name:kennedy-john-f]
  - id: cal.1964-01-15.latin-america-panama
    when: Jan. 15
    date: '1964-01-15'
    thread: latin-america-panama
    c: 'Panama. The Inter-American Peace Committee''s formula: "negociar," read as discuss in Washington, negotiate in Panama.'
    n: '[FRUS 1964–68, XXXI, doc. 379](https://history.state.gov/historicaldocuments/frus1964-68v31/d379) (editorial note). See [[cal.1964-01-09.latin-america]].'
  - id: cal.1964-01-16.latin-america-panama
    when: Jan. 16
    date: '1964-01-16'
    thread: latin-america-panama
    c: 'White House statement: the United States ready to carry on discussions with Panama.'
    n: 'White House Statement Concerning U.S. Readiness To Carry On Discussions With Panama, [1963–64 Pub. Papers 144](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=228) (Jan. 16, 1964). See [[cal.1964-01-09.latin-america]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-16.vietnam
    when: Jan. 16
    date: '1964-01-16'
    thread: vietnam
    c: 'Johnson approves the Krulak committee''s plan of covert operations against the North, received at the Ranch Jan. 2: raids on the trail and the coasts of the Gulf of Tonkin, from Feb. 1. No NSAM; not announced.'
    n: 'FRUS 1964–68, I: Vietnam, 1964, doc. [4](https://history.state.gov/historicaldocuments/frus1964-68v01/d4) (Bundy to Johnson, Jan. 7: the plan, the Krulak committee''s, from Feb. 1; read by the President Jan. 13); doc. [13](https://history.state.gov/historicaldocuments/frus1964-68v01/d13) n.2 (the joint State, Defense and CIA telegram of Jan. 16: the President has approved execution from Feb. 1). [[w.caro-passage-of-power]], 533–35. See [[cal.1963-11-26.vietnam]]. Names: Johnson, Krulak.'
    src:
      c: 74a277ce
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d4: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d13: A'
        - 'w.caro-passage-of-power 533–35: all'
    tags: [name:johnson-lyndon-b, name:krulak-victor-h]
  - id: cal.1964-01-17.opinion
    when: Jan. 17
    date: '1964-01-17'
    thread: opinion
    also: [economy, civil-rights-bill, medicare]
    c: 'Gallup, Jan. 2–7: what Congress should do when it meets. Tax reduction first; civil rights second; medical care for older persons third; then federal spending, aid to education, foreign problems, unemployment.'
    n: '[[w.gallup-poll]], III, 1859–60.'
  - id: cal.1964-01-17.robert-kennedy
    when: Jan. 17–18
    date: '1964-01-17'
    thread: robert-kennedy
    also: [indonesia]
    c: Robert Kennedy, sent by Johnson, on Indonesia's confrontation of Malaysia. Tokyo, with Sukarno.
    n: 'FRUS 1964–68, XXVI, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v26/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v26/d16) (his instructions, Jan. 14), [17](https://history.state.gov/historicaldocuments/frus1964-68v26/d17), [19](https://history.state.gov/historicaldocuments/frus1964-68v26/d19) (the talks in Tokyo, Jan. 17, 18). [[w.schlesinger-robert-kennedy-and-his]], 633–35. To check: [[w.jones-conflict-and-confrontation-in]]. See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy, Johnson, Sukarno.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:sukarno]
  - id: cal.1964-01-18.poverty
    when: Jan. 18
    date: '1964-01-18'
    thread: poverty
    also: [civil-rights-organizations]
    c: Johnson, at a Saturday meeting called the night before, asks King, Wilkins, Whitney Young and Farmer to support the war on poverty. King for it, and for "some kind of compensatory crash program."
    n: '[[w.garrow-bearing-the-cross]], 310. Check: Garrow cites the *New York Times*, Jan. 19, 1964 (680 n.20). Names: Johnson, King, Wilkins, Young, Farmer.'
