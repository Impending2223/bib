  - id: cal.1964-01-31.opinion
    when: Jan. 31
    date: '1964-01-31'
    thread: opinion
    also: [succession]
    c: 'Gallup, Jan. 2–7: 53 percent have followed the discussion of presidential succession. Of them, the Secretary of State to succeed in place of the Speaker, 46 for, 36 against.'
    n: '[[w.gallup-poll]], III, 1862.'
  - id: cal.1964-01-31.mississippi
    when: Jan. 31
    date: '1964-01-31'
    thread: mississippi
    c: 'Liberty, Amite County. Louis Allen, who saw Hurst kill Herbert Lee in 1961 and testified to self-defense, then told SNCC, the FBI and the Civil Rights Commission otherwise, shot dead at his gate the night before he was to leave the State. The FBI had referred his reports of threats to the Highway Patrol. Its inquiry closed in May: no voting work, so no federal jurisdiction.'
    n: 'Robert Moses, [Report Concerning the Louis Allen Case](https://www.wisconsinhistory.org/record/multi/W01DRZ7) (SNCC, 1964), with Mrs. Allen''s and Tommy Allen''s accounts. Civil Rights Division, [Notice to Close File, Louis Allen](https://www.justice.gov/crt/case-document/file/1194136/dl) (May 19, 2015). [[w.dittmer-local-people]], 109, 215 (Allen''s testimony and what he told the FBI; the killing, the night before he was to leave). To check: [[w.payne-ive-got-the-light]]; *Nation*, Mar. 16, 1964, 254–55; the affidavit of Mrs. Elizabeth Allen, May 29, 1964, Hillegas Collection (cited by [[w.dittmer-local-people]], 215 n.1). See [[cal.1961-09-25.mississippi]]. Made public: the Civil Rights Division''s notice closing the file, May 19, 2015, from the FBI''s memoranda of 1961–64. Names: Allen, Hurst, Lee.'
    src:
      c: a11636ee
      rows:
