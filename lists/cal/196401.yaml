  - id: cal.1964-01-18.civil-rights-bill
    when: Jan. 18
    date: '1964-01-18'
    thread: civil-rights-bill
    c: 'The petition at 178 names. Halleck in the Oval Office at noon: no Lincoln''s Birthday speech "when Howard Smith''s got his foot on Lincoln''s neck." Johnson telephones Webb before him, on what NASA can do for Purdue, in Halleck''s district; after he leaves: "Let''s help him."'
    n: '[Johnson and Webb, 12:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-webb-january-18-1964), Conversation WH6401-16-1421 (Miller Center). [[w.caro-passage-of-power]], 559. See [[cal.1964-01-09.civil-rights-bill]]. Names: Halleck, Smith, Johnson, Webb.'
    tags: [name:halleck-charles-a, name:smith-howard-w, name:johnson-lyndon-b, name:webb-james-e]
  - id: cal.1964-01-19.opinion
    when: Jan. 19
    date: '1964-01-19'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Jan. 2–7: Democrats'' choice for Vice President: Robert Kennedy 34, Stevenson 26, Humphrey 14, Shriver 8, Brown 5, Fulbright 2, McCarthy 2, Wagner 2; others, no preference 7. Independents: Stevenson 26, Robert Kennedy 25, Humphrey 13.'
    n: '[[w.gallup-poll]], III, 1860. Names: Robert Kennedy, Stevenson, Shriver, Humphrey, Fulbright, McCarthy, Brown, Wagner.'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:shriver-r-sargent, name:humphrey-hubert-h, name:fulbright-j-william, name:mccarthy-eugene-j, name:brown-edmund-g, name:wagner-robert-f-jr]
  - id: cal.1964-01-20.economy
    when: Jan. 20
    date: '1964-01-20'
    thread: economy
    c: 'Economic Report. GNP at a $600 billion rate in the fourth quarter; unemployment 5.5 percent. With the tax cut, $623 billion in 1964. The guideposts reaffirmed. The Council''s second chapter, "The Problem of Poverty in America": a family under $3,000 a year poor; one family in five.'
    n: 'Annual Message to the Congress: The Economic Report of the President, [1963–64 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=239) (Jan. 20, 1964). [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000). [[w.advisers-annual-report-1964]], ch. 2 (K–J Adm. II.H.3). To check: [[w.heller-new-dimensions-of-political]]. See [[cal.1963-01-24.economy]]. Names: Johnson, Heller.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w]
  - id: cal.1964-01-20.africa
    when: Jan. 20–25
    date: '1964-01-20'
    thread: africa
    also: [europe-and-the-alliance]
    c: Army mutinies in Tanganyika, Uganda and Kenya, put down by British troops at the governments' request.
    n: '[FRUS 1964–68, XXIV: Africa, doc. 182](https://history.state.gov/historicaldocuments/frus1964-68v24/d182) (State''s background paper for Douglas-Home''s visit, Feb. 7, 1964: the mutinies; the British in at each government''s request). Check: the days. See [[cal.1964-01-12.africa]].'
  - id: cal.1964-01-21.economy
    when: Jan. 21
    date: '1964-01-21'
    thread: economy
    c: Budget for fiscal 1965. Expenditures $97.9 billion, $500 million under 1964 and $900 million under the 1964 request; receipts $93.0 billion; deficit $4.9 billion. Defense down more than $1 billion. Civilian employment cut, the first budget to do so since the count began in 1956.
    n: 'Annual Budget Message to the Congress, Fiscal Year 1965, [1963–64 Pub. Papers 175](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=259) (Jan. 21, 1964); Remarks to Members of the Budget Bureau Staff at the Signing of the 1965 Budget, [1963–64 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=236) (Jan. 20, 1964). [[w.stein-fiscal-revolution-in-america]], 453 ($97.9 billion); [[w.zelizer-taxing-america]], 202–03 ($97.9 billion). To check: [[w.morgan-deficit-government]]. See [[cal.1963-12-27.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, budget:1965]
  - id: cal.1964-01-21.testing
    when: Jan. 21
    date: '1964-01-21'
    thread: testing
    c: 'Geneva. The Eighteen-Nation Disarmament Committee resumes; Foster reads Johnson''s message. Five proposals: no force to change boundaries; a verified freeze on strategic nuclear vehicles; a halt to fissionable material for weapons, plant by plant meanwhile; observation posts against surprise attack; no transfer of nuclear weapons to national control.'
    n: 'Message to the 18-Nation Disarmament Conference in Geneva, [1963–64 Pub. Papers 171](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=255); Statement by the President on the Reopening of the Geneva Disarmament Conference, [1963–64 Pub. Papers 172](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=256) (Jan. 21, 1964); Letter to Chairman Khrushchev on the Eve of the Reopening of the Geneva Disarmament Conference, [1963–64 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=237) (Jan. 20, 1964). [[w.poole-joint-chiefs-of-staff]], 90 (the freeze proposed). To check: [[w.bundy-danger-and-survival]]; [[w.lyndon-johnson-confronts-the]]. See [[cal.1963-10-07.testing]]. Names: Johnson, Foster, Khrushchev.'
    src:
      c: a4c4c464
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=255: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=256: all'
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=237: all'
        - 'w.poole-joint-chiefs-of-staff 90: B, E'
        - 'via w.poole-joint-chiefs-of-staff 90 n.30: B, E'
    tags: [name:johnson-lyndon-b, name:foster-william-c, name:khrushchev-nikita-s]
  - id: cal.1964-01-21.mississippi-ms
    when: Jan. 21
    date: '1964-01-21'
    thread: mississippi
    also: [governors]
    c: 'Paul Johnson inaugurated at Jackson: "Hate, or prejudice, or ignorance, will not lead Mississippi while I sit in the governor''s chair" (Check the wording).'
    n: 'Mississippi Department of Archives and History, ["Paul Burney Johnson, Jr."](https://mshistory.mdah.ms.gov/issue/paul-burney-johnson-jr-fifty-fourth-governor-of-mississippi-1964-1968). To check: [[w.crespino-in-search-of-another]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Paul Johnson.'
