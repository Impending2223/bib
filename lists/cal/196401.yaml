  - id: cal.1964-01-30.vietnam
    when: Jan. 30
    date: '1964-01-30'
    thread: vietnam-saigon
    c: 'Saigon. Nguyễn Khánh takes power without bloodshed; Dương Văn Minh, Trần Văn Đôn, Lê Văn Kim held. Lodge and Harkins: Khánh feared the junta was dealing with the French toward neutralization. Feb. 1, Johnson: neutralization of the South alone, no; "the operations should be stepped up."'
    n: 'FRUS 1964–68, I, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v01/d22), [24](https://history.state.gov/historicaldocuments/frus1964-68v01/d24), [31](https://history.state.gov/historicaldocuments/frus1964-68v01/d31); [19](https://history.state.gov/historicaldocuments/frus1964-68v01/d19) (Lodge, Jan. 29: Khánh''s charges). The President''s News Conference, [1963–64 Pub. Papers 254](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=338) (Feb. 1, 1964). [[w.gibbons-u-s-government-and]], II, 218; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 502 (the coup); [[w.cosmas-joint-chiefs-of-staff-2012]], 10–12 (the coup; Khánh''s charges). To check: Saigon 1445 and 1446 to State, Jan. 30, 1964; SACSA briefing sheet, "Coup d''Etat in Republic of Vietnam," Jan. 30, 1964, OCJCS File (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 12 n.20). To check: [[w.ahern-cia-and-the-generals]]; [[w.shaplen-lost-revolution]]; [[w.lam-history-of-south-vietnam-2021]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.vandemark-into-the-quagmire]]. See [[cal.1963-12-21.vietnam]]. Names: Nguyễn Khánh, Dương Văn Minh, Trần Văn Đôn, Lê Văn Kim, Lodge, Harkins, Johnson.'
