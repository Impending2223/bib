  - id: cal.1964-01-03.elections-1964
    when: Jan. 3
    date: '1964-01-03'
    thread: elections-1964-primaries
    also: [goldwater]
    c: 'Goldwater announces for the Republican nomination, at his home in Arizona: "I will offer a choice, not an echo." That morning, in his bedroom: Kitchel to manage the campaign, Burch his assistant, Kleindienst director of field operations.'
    n: '[Remarks Announcing Candidacy for the Republican Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-announcing-candidacy-for-the-republican-presidential-nomination) (Jan. 3, 1964). [[w.perlstein-before-the-storm]], 258–61; [[w.young-two-suns-of-the]], 70 (the announcement, the words); [[w.white-making-of-the-president-1965]], 97 (Friday morning, the terrace of his home on Camelback Mountain, forty-eight hours'' notice to the press and the networks; "because of the principles in which I believe"); [[w.goldberg-barry-goldwater]], 181–82 (his Scottsdale home, a prepared statement: "an engagement of principles"; "I will offer a choice, not an echo"; Kitchel general director, Burch his assistant, Kleindienst director of field operations, none from the draft committee; primaries in New Hampshire, Illinois, Oregon and California); [[w.smith-on-his-own-terms]], 420 ("a choice, not an echo"); [[w.bernstein-guns-or-butter]], 127 (on crutches after surgery on a heel spur, on the patio of his home in Scottsdale; "the Arizona Mafia," Kitchel, Burch, Kleindienst); [[w.novak-agony-of-the-g]], 268–69 (the patio of his house; on crutches; "I will not change my beliefs to win votes. I will offer a choice, not an echo"). [[w.white-suite-3505]], 264–65 (the announcement, the words). To check: Male to Goldwater, planning memo, Jan. 3, 1964, Barry Goldwater Papers, box 13/51, Arizona Historical Foundation (cited by [[w.perlstein-before-the-storm]], 259 n.1); Ray Curtis, radio announcer, the announcement, transcribed, Rockefeller Archive Center, box 10/779 (cited by [[w.perlstein-before-the-storm]], 260 n.2a); Los Angeles Times, Jan. 3, 1964, A1 (the announcement) (cited by [[w.perlstein-before-the-storm]], 260 n.2b); Transcript, Goldwater''s press conference, Jan. 3, 1964, Rockefeller Archive Center, box 10/779 (cited by [[w.perlstein-before-the-storm]], 260 n.3); [[w.shadegg-what-happened-to-goldwater]]; [[w.edwards-goldwater]]; [[w.middendorf-glorious-disaster]]; [[w.goldwater-with-no-apologies]]. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater, Kitchel, Burch, Kleindienst.'
