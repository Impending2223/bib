    place: washington
    thread: japan
    also: [economy]
    c: 'Ōhira in Washington on the interest equalization tax: Ball and, apart, Rusk, Aug. 1; Kennedy, Aug. 2, with Ikeda''s letter. Japan needs a regular inflow of capital. The communiqué: if "serious economic difficulties" arise in Japan, "some form of exemption" for new issues.'
    n: '[110 Cong. Rec. 18,026](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-1-2.pdf#page=62) (1964) (Fong, Aug. 4, 1964: Ōhira came "to dissuade our Government from enacting the bill"). [FRUS 1961–63, IX: Foreign Economic Policy, doc. 81](https://history.state.gov/historicaldocuments/frus1961-63v09/d81) (editorial note: Ōhira with Ball and, separately, Rusk, Aug. 1, and with Kennedy, Aug. 2; Rusk added: canvass, Nov. 5, 2026). FRUS 1961–63, XXII, docs. [376](https://history.state.gov/historicaldocuments/frus1961-63v22/d376), [377](https://history.state.gov/historicaldocuments/frus1961-63v22/d377), [378](https://history.state.gov/historicaldocuments/frus1961-63v22/d378). To check: [[w.schaller-altered-states]]. See [[cal.1963-07-18.economy]]. Names: Ōhira, Ikeda, Ball, Kennedy, Rusk.'
