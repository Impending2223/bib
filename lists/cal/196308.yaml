    c: Americus, Ga. After a mass meeting at Friendship Baptist, two hundred young people march a block through the Negro section; police fire warning shots; Sheriff Fred B. Chappell jabs Don Harris of SNCC with an electric cattle prod; bricks and clubs; seventy-seven jailed. Harris, two white Northern students and a young Negro of Americus charged with seditious conspiracy under the "Angelo Herndon statute," a capital crime, no bail. Nearly a hundred teenagers jailed in July over the Martin Theater.
