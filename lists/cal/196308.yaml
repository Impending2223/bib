  - id: cal.1963-08-09.georgia-albany
    when: Aug. 9
    date: '1963-08-09'
    thread: georgia-albany
    c: The Justice Department announces federal indictments of nine Albany activists, for perjury and conspiring to injure a juror. The April picketing of the store of Carl Smith, a juror when a federal jury acquitted Sheriff L. Warren Johnson of Baker County of shooting a Negro prisoner, Charles Ware. Five leaders of the Albany Movement among the nine, Anderson and Slater King with them.
    n: '[[w.garrow-bearing-the-cross]], 279. To check: New York Times, Aug. 10, 1963, 1; John Doar to Robert Kennedy, "Albany," May 9, 1963, Burke Marshall Papers, box 8, Kennedy Library (cited by [[w.garrow-bearing-the-cross]], 279 n.57). See [[cal.1961-11-17.albany]]. Names: Anderson.'
