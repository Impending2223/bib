    time: 1963-08-28T16:00Z
    thread: vietnam-saigon
    c: 'Meeting with the President on Vietnam, noon. Ball: "We must decide now to go through to a successful overthrow of Diem"; Harriman agrees. Nolting against: a coup bad in principle. Kennedy asks Defense for ways to build up the forces against Diệm; Lodge and Harkins to be asked.'
    n: '[FRUS 1961–63, IV, doc. 1](https://history.state.gov/historicaldocuments/frus1961-63v04/d1). [[w.schlesinger-robert-kennedy-and-his]], 713 (the words, given to Harriman, Ball, Hilsman and Forrestal); [[w.moyar-triumph-forsaken]], 241–42; [[w.robert-kennedy-in-his]], 397 ("a meeting on that Wednesday, I think," McNamara''s questions put; Taylor, McNamara, McCone against the coup); [[w.mcnamara-in-retrospect]], ch. 3 at nn.10–12 (the noon meeting; Ball, no choice but a coup; Nolting''s doubts; the evening meeting, 6 p.m., and the three messages to Saigon). [[w.reeves-president-kennedy]], 572–73 (the meeting; Ball; Harriman; Kennedy''s questions); [[w.selverstone-kennedy-withdrawal]], 143 (Aug. 28: Ball and Harriman "already beyond the point of no return," the question "how do we make this coup successful"); [[w.schlesinger-robert-kennedy-and-his]], 713 (Harriman, Ball, Hilsman and Forrestal say the United States "must decide now to go through to a successful overthrow" (n.59: National Security Council meeting, Aug. 28, 1963, RFK Papers); Taylor, McNamara, McCone and Johnson strongly oppose a coup; not the hour, Nolting''s argument or the President''s instructions). [[w.preston-war-council]], 124 (Forrestal''s urging, before the meeting, a firm statement). To check: Krulak, meeting notes, Aug. 28, 1963, NDUL, Taylor Papers, box 50 (cited by [[w.moyar-triumph-forsaken]], 242 n.44); [FRUS 1961–63, IV, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v04/d2) (FRUS, 1961–1963, vol. 4, 2; cited by [[w.moyar-triumph-forsaken]], 242 n.44). See [[cal.1963-08-24.vietnam]]. Made public: FRUS 1961–63, IV (1991). Names: Ball, Harriman, Nolting, John F. Kennedy, Ngô Đình Diệm, Lodge, Harkins.'
