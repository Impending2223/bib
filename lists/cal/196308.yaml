    when: Aug. 1–2
    date: '1963-08-01'
    thread: japan
    also: [economy]
    c: 'Ōhira in Washington on the interest equalization tax: Ball and, apart, Rusk, Aug. 1; Kennedy, Aug. 2, with Ikeda''s letter. Japan needs a regular inflow of capital. The communiqué: if "serious economic difficulties" arise in Japan, "some form of exemption" for new issues.'
