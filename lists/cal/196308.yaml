    also: [vietnam-diplomacy]
    c: 'Mao revises the Foreign Ministry''s draft of a talk against the Diệm group''s bloody suppression of South Vietnam''s Buddhists, intended for the news report of his meeting; decides to make it a formal statement, "Against the aggression of the United States–Diệm group in South Vietnam and the slaughter of South Vietnam''s people," and sends it to Liu Shaoqi and Zhou Enlai. Radio Peking broadcasts it that evening: no weapon of the United States, no cruelty of the Diệm group, will save Diệm''s regime.'
    n: '"[Statement (from Mao Zedong) Opposing (the Combined Efforts) of the United States and Ngô Đình Diệm to Subjugate and Massacre the People of Southern Vietnam](https://digitalarchive.umd.edu/document/240256)" (Aug. 29, 1963), Gang er si Wuhan daxue zongbu et al, eds., *Mao Zedong sixiang wansui* (Long Live Mao Zedong Thought), vol. 5 (1961–1968) (Wuhan, internal circulation, May 1968), 60–61, Wilson Center Digital Archive (the statement''s title, B, and its words that neither American weapons nor the Diệm group''s repression will save the regime, C, not Mao''s revision of the draft, his sending it to Liu and Zhou, or the broadcast; the statement as the Red Guard collection prints it, titled 反对美国——吴庭艳集团侵略和屠杀越南南方人民的声明 and dated Aug. 29, 1963, with the note that it was first printed in the *Renmin ribao* of Aug. 30, 1963; an internal-circulation printing, not the first publication). [[w.zedong-mao-zedong-nianpu]], V, Aug. 29, 1963 ("同日"). [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 297–298 (Aug. 29, 1963; Mao''s statement against the aggression of the U.S.–Ngô Đình Diệm clique in South Vietnam and its slaughter of the South Vietnamese people: the Chinese people condemn the bloody suppression and support Hồ Chí Minh''s statement; the U.S. wrecked the first Geneva agreements and blocked Vietnam''s unification, wages the so-called special war in the south, and has wrecked the second Geneva agreement too and interferes in Laos; only deceivers or the very naive believe a piece of paper will make it lay down its butcher''s knife; the oppressed peoples must win liberation by unity and struggle); [[w.jianguo-yilai-mao-zedong]], XVII, 46–50 (Aug. 29, 1963; the statement as printed from *Renmin ribao* Aug. 30; Mao''s comment to send it to Liu, Zhou and Deng, then to Xinhua, to be broadcast that night and printed next day, "revised after consulting the Vietnamese comrades"). To check: the statement as broadcast, Aug. 29, 1963; Zhou Enlai, submission of the draft talk against the Ngô Đình Diệm group''s bloody suppression of South Vietnam''s Buddhists and people, Aug. 29, 1963, 2 o''clock (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 48 n.1); Hồ Chí Minh, statement on the situation in South Vietnam, Aug. 28, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 49 n.4). See [[cal.1963-08-29.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Ngô Đình Diệm.'
