    n: '[[w.zhou-enlai-waijiao-huodong]], 366 (Aug. 1, 1963); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 292 (Aug. 1, 1963; the rally supports the ninth World Conference against Atomic and Hydrogen Bombs, to meet at Hiroshima; it says the Chinese people will join the Japanese and all the world''s peoples in the struggle for the complete, thorough and resolute prohibition and destruction of nuclear weapons and firmly oppose the partial test ban treaty signed by the U.S., Britain and the Soviet Union; Zhou, Chen Yi, Vice-Premier Luo Ruiqing and other leaders attend); [[w.chen-yi-nianpu]], 979 (Aug. 1, 1963, afternoon, the Great Hall of the People; Chen Yi at the meeting). Names: Zhou Enlai.'
