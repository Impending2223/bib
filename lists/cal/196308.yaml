  - id: cal.1963-08-26.china-leadership
    when: Aug. 26
    date: '1963-08-26'
    place: peking
    thread: china-leadership
    c: 'Yinian Tang. Mao presides at the Standing Committee on the draft "On the development of industry" and the work conference called for September. Deng Xiaoping reports the drafting committee''s discussions. Mao agrees to two steps; the time he would stretch: first stage fifteen years, then fifteen more; leave out "in the front rank" and say "a socialist power of the four modernizations." (In late August he had already changed "ten years" to "fifteen" in both steps, and "to the front rank" to "near the world''s advanced level.")'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 26, 1963. [[w.jianguo-yilai-mao-zedong]], XVII, 40–42 (Aug. 1963; the August changes to the draft "On problems of industrial development": the period "short" made "not too long"; the first step ten years made fifteen, the second step ten years to be in the world''s front rank made fifteen years to approach the world''s advanced level; note 1 dates parts 1–4 in August, the added paragraph 5 in early September); [[w.deng-xiaoping-nianpu-1904]], III, 1771 (Aug. 26, 1963; Deng at the Politburo Standing Committee meeting Mao presides over; reports the drafting committee''s discussions of the last few days and explains the revision of the draft ''Questions of industrial development''). Made public: 2013. To check: Draft "On problems of industrial development" (Guanyu gongye fazhan wenti), first draft, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 42 n.1). Names: Mao Zedong, Deng Xiaoping.'
