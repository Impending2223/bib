    c: 'The White House, Dobrynin alone with Kennedy, their last meeting, with Khrushchev''s message. Kennedy on the Senate''s hearings: "What can I do with people like Teller or Senator Goldwater?" After ratification, talks on surprise attack and weapons in outer space. On Germany, no force to change borders, no formal declaration. More trade; cooperation in space, perhaps a joint flight to the moon. Cuba: the Soviet troops; Khrushchev''s visit there. Thanks for the condolences on Patrick. The press told of Khrushchev''s message.'
