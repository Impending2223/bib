  - id: cal.1963-08-26.china-leadership-2
    when: Aug. 26
    date: '1963-08-26'
    time: 1963-08-26T06:00Z
    place: peking
    thread: china-leadership
    c: 'Zhou Enlai receives the Belgian parliamentarian Scheyven (舍伊文): peaceful coexistence can be only between independent states; a colony and a colonial power cannot, nor the ruled and the ruling class; it should not be abused; between unequals it cannot be; to beg it invites aggression and insult. States of different systems can learn techniques from each other; Belgium has some China can learn; common ground is to coexist in politics, trade in economics, learn in technique.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 575 (Aug. 26, 1963); [[w.zhou-enlai-waijiao-huodong]], 369 (Aug. 26, 1963; 下午2时, 中南海西花厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 296–297 (Aug. 26, 1963; Zhou receives the Belgian M.P. Scheyven (哈蒙·舍伊文) and says that states of different systems can live in peaceful coexistence on the five principles of respecting one another and living together in peace, not merely feasible but realizable; those who slander China as wanting war and expansion ignore the facts; peaceful coexistence is only between independent states, not between a colony and a colonial power nor a ruled class and a ruling class, nor between unequals; to beg for it invites aggression and insult). Continues 576. Made public: 1993. Check: the name in Roman letters. Names: Zhou Enlai.'
