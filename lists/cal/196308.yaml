    n: '[S.C. Res. 181](https://undocs.org/S/RES/181(1963)) (Aug. 7, 1963). [FRUS 1961–63, XXI, doc. 412](https://history.state.gov/historicaldocuments/frus1961-63v21/d412). See [[cal.1963-08-02.africa]]. Names: Kennedy.'
