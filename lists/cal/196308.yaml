ay"). [[w.ball-past-has-another-pattern]], 372 (Aug. 26: McCone, McNamara and Taylor against the cable; Ball holds to it). [FRUS 1961–63, III, doc. 302](https://history.state.gov/historicaldocuments/frus1961-63v03/d302) (Forrestal''s points for the President to close the meeting of Aug. 27: "The United States cannot support a government in South Vietnam which is dominated by Counselor Nhu"). The time is the first day''s. To check: [[w.blair-lodge-in-vietnam]]. See [[cal.1963-08-24.vietnam]]. Names: Kennedy.'
