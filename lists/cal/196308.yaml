  - id: cal.1963-08-01.civil-rights-the-executive
    when: Aug. 1
    date: '1963-08-01'
    time: 1963-08-01T20:00Z
    place: washington
    thread: civil-rights-the-executive
    also: [civil-rights-bill, latin-america]
    c: 'News conference. Asked why the demonstrations have subsided: the biracial groups'' work, Congress''s consideration of remedies, the Negro leadership''s sense of a "long drawn-out task"; "merely because the demonstrations have subsided does not ... mean that we should go to sleep and forget the problem." On the Alliance for Progress: there must be a revolution in Latin America, peaceful or bloody; the Alliance "has failed, of course, to some degree, because the problems are almost insuperable"; it should be pursued and intensified.'
    n: 'The President''s News Conference of August 1, 1963, [1963 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670), 617. [[w.branch-parting-the-waters]], 864. [[w.sorensen-kennedy]], 534–35 (Sorensen: "depressed" by the size of the problems). To check: [*New York Times*, Aug. 2, 1963](https://timesmachine.nytimes.com/timesmachine/1963/08/02/issue.html), at 1, 10 (cited by [[w.branch-parting-the-waters]], 864 n.3). Names: Kennedy.'
    src:
      c: f1b254c0
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670: all'
        - 'w.branch-parting-the-waters 864: A-C'
        - 'via w.branch-parting-the-waters 864 n.3: A-C'
        - 'w.sorensen-kennedy 534–35: E'
    tags: [name:kennedy-john-f]
    aliases: [cal.1963-08-01.latin-america]
  - id: cal.1963-08-01.soviet-union
    when: Aug. 1
    date: '1963-08-01'
    place: moscow
    thread: soviet-union-leadership
    c: 'The Presidium on the Moscow film festival, whose jury gave its main prize to Fellini''s *8½*. Khrushchev, to Romanov, chairman of the cinema committee: Soviet members are not to vote on juries; he is unready for his post, and has betrayed the June plenum''s decision. The prize to be disowned; the Secretariat to look into it.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 734–35 (Protocol 108, item V, Malin''s notes); [[w.prezidium-tsk-kpss-1954]], I, 1143–44 nn.2–3 (the editors: the prize, against the party''s ideological organs; the plenum of June 18–21, 1963; Romanov kept his post); [[w.prezidium-tsk-kpss-1954]], III, 555 (Protocol 108: the heading only). Made public: 2003. Names: Khrushchev.'
    src:
      c: f73ef0de
      rows:
