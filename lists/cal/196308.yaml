  - id: cal.1963-08-18.vietnam-saigon
    when: Aug. 18
    date: '1963-08-18'
    thread: vietnam-saigon
    c: 'Saigon. Some twenty thousand at a rally at the Xá Lợi pagoda. That evening, by Trần Văn Đôn''s account to the CIA of Aug. 23, ten generals decide on the action of Aug. 20–21, Nhu not their prompter: Đôn, Tôn Thất Đính, Đỗ Cao Trí, Trần Thiện Khiêm, Nguyễn Khánh, Mai Hữu Xuân, Nguyễn Ngọc Lễ, Lê Văn Kim, Dương Văn Minh and one whose name is withheld.'
    n: '[FRUS 1961–63, III, doc. 275](https://history.state.gov/historicaldocuments/frus1961-63v03/d275), para. 5 (CIA Saigon, Aug. 24); [doc. 261](https://history.state.gov/historicaldocuments/frus1961-63v03/d261) (the embassy, Aug. 21: the impetus from the generals; Sunday''s large crowd at Xá Lợi). [[w.moyar-triumph-forsaken]], 231–32 (the rally; the generals'' meeting and their reasons; their request to Diệm, his consent, no bonze to be harmed). To check: Saigon to State, Aug. 21, 1963, DDRS, 1985, 22 (cited by [[w.moyar-triumph-forsaken]], 231 n.5); [FRUS 1961–63, III, doc. 264](https://history.state.gov/historicaldocuments/frus1961-63v03/d264) (Carroll to McNamara, Aug. 21, 1963; cited by [[w.moyar-triumph-forsaken]], 231 n.5); Ho Son Dai and Tran Phan Chan, Lich Su Saigon-Cho Lon-Gia Dinh Khang Chien (1994), 364 (cited by [[w.moyar-triumph-forsaken]], 231 n.3). See [[cal.1963-05-08.vietnam]]. Names: Trần Văn Đôn, Tôn Thất Đính, Trần Thiện Khiêm, Nguyễn Khánh, Lê Văn Kim, Dương Văn Minh, Ngô Đình Nhu. Check: Moyar''s twenty thousand.'
