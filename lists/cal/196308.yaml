    c: 'After the March, 5 p.m., the Oval Office: Kennedy with King, Randolph, Wilkins, Young and Reuther. Wilkins: the people "and not Martin Luther King or Roy Wilkins . . . have dreamed up this civil rights business." They ask a broader bill, a fair employment commission. Kennedy counts the House by delegation: 158 to 160 Democrats; 60 Republicans needed, 20 to 25 in the Senate. Randolph: "nothing less than a crusade." Kennedy: better from the grass roots than from the President.'
