  - id: cal.1963-08-01.civil-rights-the-executive
    when: Aug. 1
    date: '1963-08-01'
    time: 1963-08-01T20:00Z
    thread: civil-rights-the-executive
    also: [civil-rights-bill, latin-america]
    c: 'News conference. Asked why the demonstrations have subsided: the biracial groups'' work, Congress''s consideration of remedies, the Negro leadership''s sense of a "long drawn-out task"; "merely because the demonstrations have subsided does not ... mean that we should go to sleep and forget the problem." On the Alliance for Progress: there must be a revolution in Latin America, peaceful or bloody; the Alliance "has failed, of course, to some degree, because the problems are almost insuperable"; it should be pursued and intensified.'
    n: 'The President''s News Conference of August 1, 1963, [1963 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670), 617. [[w.branch-parting-the-waters]], 864. [[w.sorensen-kennedy]], 534–35 (Sorensen: "depressed" by the size of the problems). To check: New York Times, Aug. 2, 1963, 1, 10 (cited by [[w.branch-parting-the-waters]], 864 n.3). Names: Kennedy.'
    src:
      c: f1b254c0
      rows:
