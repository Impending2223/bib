  - id: cal.1963-08.china-leadership
    when: Aug., early
    date: 1963-08
    at: before 1963-08-01
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao presides at the Standing Committee on how to answer the CPSU Open Letter. His five points: the Letter names China, so China names the CPSU; go after the Letter and the Soviet leaders, leave other parties'' attacks for now; aim at Khrushchev, the first to speak and the worst; first print the Soviet leaders'' anti-Chinese words, his last two speeches above all; the replies to argue and to mock, firm and soft together. Other members: follow the Letter''s questions without being led by it; the first reply on the origin of the differences, the second on Stalin, war and peace, peaceful coexistence and peaceful transition each its own. Mao and Liu Shaoqi: the writers to list the Soviet arguments, quote the classics exactly, and finish soon but not carelessly.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 638–639 (the Standing Committee "in early August" (8月初); the five points in Wu''s numbering; "the wolf is in the road, do not ask the fox"; Mao and Liu on the writers'' work: "better, then faster"). Made public: 1999. See [[cal.1963-07-23.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Khrushchev. Check: the day within early August, and the place; Wu gives neither.'
    src:
      c: e5e2c6ba
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 638–639: all'
    tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:khrushchev-nikita-s, vis:only:prc]
