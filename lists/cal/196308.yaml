    c: 'The State Department, 11 a.m.: Rusk, McNamara, Johnson, Taylor, McGeorge Bundy, Hilsman, Nolting and Kattenburg, the coup off. Kattenburg: acquiesce and the United States out within six months to a year; better "to withdraw in a dignified way." Rusk: "we will not pull out of Viet-Nam." Johnson: "Certainly we can''t pull out"; ties with Diệm to be restored.'
    n: '[FRUS 1961–63, IV, doc. 37](https://history.state.gov/historicaldocuments/frus1961-63v04/d37) (Hilsman''s memorandum). [[w.logevall-choosing-war]], 51 (the meeting; Kattenburg for withdrawal; Rusk, McNamara and Johnson against). Made public: the Pentagon Papers (1971), in part; FRUS 1961–63, IV (1991). Check: Logevall, 51, quotes Johnson, "disaster to pull out," and McNamara, "we have been winning the war," words not in Hilsman''s memorandum. To check: PP (Gravel), 2:741–43 (cited by [[w.logevall-choosing-war]], 51 n.24). See [[cal.1963-08-31.vietnam]]. Names: Rusk, McNamara, Johnson, Taylor, McGeorge Bundy, Hilsman, Nolting, Kattenburg, Diệm.'
