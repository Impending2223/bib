    when: Aug. 9
    date: '1963-08-09'
    place: washington
    thread: georgia-albany
    c: The Justice Department announces federal indictments of nine Albany activists, for perjury and conspiring to injure a juror. The April picketing of the store of Carl Smith, a juror when a federal jury acquitted Sheriff L. Warren Johnson of Baker County of shooting a Negro prisoner, Charles Ware. Five leaders of the Albany Movement among the nine, Anderson and Slater King with them.
    n: '[[w.garrow-bearing-the-cross]], 279; [[w.branch-parting-the-waters]], 866–68; [[w.purdum-idea-whose-time-has-2014]], 109 (the perjury indictments of nine Albany activists, Aug. 9, and the charge of juror intimidation; read by the leaders as an effort to appease Southern feeling). Check: Branch, 731, 866–68: Ware''s was a civil suit, Sheriff L. Warren Johnson cleared of civil liability; a special federal grand jury, nearly sixty subpoenas; the perjury counts over a meeting with C. B. King; Joni Rabinowitz and Anderson alone charged with conspiring against Smith; Robert Kennedy announces it at a press conference the day his nephew Patrick dies; Katzenbach: the picketing "must become a matter of serious Federal legal concern"; Judge Elliott had pressed the investigation. Check: Purdum, 109, has Ware''s case a civil suit against the sheriff, the all-white jury ruling for Johnson; the entry has an acquittal. To check: [*New York Times*, Aug. 10, 1963](https://timesmachine.nytimes.com/timesmachine/1963/08/10/issue.html), at 1; John Doar to Robert Kennedy, "Albany," May 9, 1963, Burke Marshall Papers, box 8, Kennedy Library (cited by [[w.garrow-bearing-the-cross]], 279 n.57). See [[cal.1961-11-17.albany]]. Names: Anderson.'
