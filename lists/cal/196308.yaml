    c: On the plane from Shanghai to Peking. Zhou Enlai tells Shermarke that China has 650 million people and must first do well at home, which is one quarter of the world; its struggles have had the world's peoples' support, first the Soviet people's, but revolution rests chiefly on the people itself, else revolution could be exported; Somalia's victory too rests chiefly on its own struggle; Lenin's way, too, was followed chiefly by the Soviet people; the Soviet Union's claim that other nations' victories rest chiefly on its help is wrong, as the October Revolution shows.
