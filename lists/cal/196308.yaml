  - id: cal.1963-08-20.china-leadership
    when: Aug. 20–24
    date: '1963-08-20'
    thread: china-leadership
    c: 'Zhou Enlai at the drafting committee for the Central Committee''s decision "On Industrial Development," Aug. 20–24. Aug. 23 he agrees with Deng Xiaoping that "base on reality, look to the future" starts the line, with four additions: sum up fourteen years'' experience, plus and minus; estimate the present rightly, from a few basic figures; set a far aim, the four modernizations within twenty-three years or the twentieth century, not being first in the world; grasp China''s mark: large country, rich resources, many people, heavy task.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 574 (Aug. 20–24, 1963); [[w.yang-shangkun-riji]], II, 307 (Aug. 20, 1963; Aug. 20, 10 a.m. to noon, the industrial document''s drafting committee, Chen Boda explaining; Yang there); [[w.yang-shangkun-riji]], II, 308–309 (Aug. 21–24, 1963; the drafting committee: Aug. 21, 3 to 6:30 p.m., Ke Qingshi, Song Renqiong and Tao Zhu speak; Aug. 22, 3 to 6:30 p.m., Li Jingquan, Li Xuefeng and Liu Lantao; Aug. 23, 3 to 6 p.m., Peng Zhen and Zhou Enlai; Aug. 24, 3 to 6 p.m., Nie Rongzhen and Cheng Zihua; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1770 (Aug. 20–24, 1963; Deng presides at the meetings of the Central Committee''s drafting committee on industrial development; on the 20th says that the industrial line and plan must start from reality and consider the base of agriculture, industry and science and technology; urges, as a near goal, within five to seven years an independent industrial system on a national scale; the summary is in the *Selected Works of Deng Xiaoping*, vol. 1, as ''Base on reality, look to the future'' 《立足现实，放眼前途》); [[w.peng-zhen-nianpu-1902]], IV, 287–288 (Aug. 20–24, 1963; Peng Zhen at the drafting committee of the decision on industrial development; Aug. 23, afternoon, he speaks: two steps, after the three years'' transition about ten years to a first independent and fairly complete system, then the long view; steel perhaps 20 million tons; the base first, farming, industry and science; food, clothing and goods, defense, the four modernizations and breakthroughs in advanced technique; industry held back because farming could not feed it; defense industry neglected until Chiang''s threat last year; fuel, materials, precision machines and large equipment; mining the base of heavy industry; balance across and along; enterprises run by economic means; series and standards; thrift, cash crops, light industry, exports; too many middle links; cadres to dig in; prices and wages). Continues 575. Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
