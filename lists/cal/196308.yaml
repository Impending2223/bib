  - id: cal.1963-08-09.china-leadership
    when: Aug. 9
    date: '1963-08-09'
    thread: china-leadership
    also: [china]
    c: The *People's Daily* prints, over Mao's name, his statement "Calling on the people of the world to unite against American imperialist racial discrimination and to support the American Blacks' struggle against it." Robert F. Williams, in Cuba, former president of the NAACP's Monroe, North Carolina, branch, asked twice this year for such a statement; Mao speaks "for the Chinese people." Mao had read the draft of Qiao Guanhua and Pu Shouchang on Aug. 7, asked Chinese, English and French texts, and on Aug. 8 sent the Chinese to Liu Shaoqi and Deng Xiaoping for Xinhua.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 9, 1963 (and the entries for Aug. 7 and 8). [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 294 (Aug. 8, 1963; Mao receives African guests, among them Ali Mohamed Chamy (阿里·穆哈默德·沙米), chairman of the Comoro national liberation movement, and issues a statement calling on the world''s peoples to unite against the racial discrimination of U.S. imperialism and to support the struggle of American Blacks against it); [[w.jianguo-yilai-mao-zedong]], XVII, 26–27 (Aug. 7, 1963; Aug. 7, 8 p.m., Mao to Pu Shouchang: the draft statement usable, to be put into English and French and brought to Mao with the original before 2 p.m. next day; Aug. 8, 10 a.m.: Liu and Deng to read it, then Xinhua to handle; written on the revised draft Qiao Guanhua and Pu sent on the evening of Aug. 6, which proposed that the statement be issued alone, in Mao''s name); [[w.jianguo-yilai-mao-zedong]], XVII, 28–31 (Aug. 8, 1963; Mao''s statement of Aug. 8 as printed in *Renmin ribao* Aug. 9; the Black population given as over 19 million, about 11 percent; the Ku Klux Klan note 2). To check: the statement as printed, *Renmin ribao*, Aug. 9, 1963; Qiao Guanhua and Pu Shouchang, report to Mao Zedong with the revised draft statement, Aug. 6, 1963 (evening) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 26 n.1). See [[cal.1963-08-04.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Robert F. Williams, Qiao Guanhua, Pu Shouchang.'
