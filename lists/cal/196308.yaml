  - id: cal.1963-08-07.opinion
    when: Aug. 7
    date: '1963-08-07'
    thread: opinion
    also: [railroads]
    c: 'Gallup, July 18–23: 71 percent have heard of the railroad dispute. Of them, 40 side with the railroads, 28 with the unions. Few would have the government dictate terms.'
    n: '[[w.gallup-poll]], III, 1832.'
  - id: cal.1963-08-07.africa
    when: Aug. 7
    date: '1963-08-07'
    thread: africa
    c: 'Kennedy approves a vote for the African resolution if its boycott of South African goods is dropped. Resolution 181, 9–0, Britain and France abstaining: all states to stop the sale and shipment of arms, ammunition and military vehicles to South Africa.'
    n: '[S.C. Res. 181](https://undocs.org/S/RES/181(1963)) (Aug. 7, 1963). [FRUS 1961–63, XXI, doc. 412](https://history.state.gov/historicaldocuments/frus1961-63v21/d412). See [[cal.1963-08-02.africa]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
