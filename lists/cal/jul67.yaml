list: cal
section: XCII
entries:
  - id: cal.1967-07-01.state-and-city-finance-mi
    when: July 1
    date: '1967-07-01'
    thread: state-and-city-finance
    c: 'Michigan. The legislature passes Romney''s fiscal program, the State''s first income tax: 2.6 percent on individuals, an exemption of $1,200 a dependent, from Oct. 1; 5.6 percent on corporations and 7 on financial institutions, from Jan. 1, 1968; the business activities tax repealed; relief from property and city income taxes. House 62–44, June 30; Senate 22–15, July 1, refusing it immediate effect. Act 281; Romney signs (Check the day).'
    n: '*Pontiac Press*, [July 1, 1967](https://our.oakland.edu/bitstreams/796dd1e2-b1a8-4121-8d3a-f058cea60603/download), 1. [Income Tax Act of 1967](https://www.legislature.mi.gov/documents/mcl/pdf/MCL-206-1.pdf), 1967 PA 281, in force Oct. 1, 1967. [[w.mollenhoff-george-romney]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1963-09-11.state-and-city-finance-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1967-07-04.middle-east
    when: July 4–21
    date: '1967-07-04'
    thread: middle-east
    also: [soviet-union]
    c: 'The General Assembly''s emergency session on the war. July 4, the Yugoslav draft, Israel to withdraw to the lines of June 4, 53–46–20, the United States against; the Latin American draft, withdrawal with an end to belligerency, 57–43–20, the United States for; neither has two-thirds. Resolution 2253 (ES-V), July 4, 99–0–20, and 2254 (ES-V), July 14, 99–0–18: Israel to rescind its measures altering the status of Jerusalem; the United States abstaining. July 19–20, Goldberg with Gromyko and Dobrynin: a joint formula, withdrawal "without delay" and an end to claims inconsistent with the existence of independent states. The Arab delegations will not take it. The session adjourns July 21, its records sent to the Security Council (Check).'
    n: 'G.A. Res. [2253 (ES-V)](https://undocs.org/A/RES/2253(ES-V)) (July 4, 1967); G.A. Res. [2254 (ES-V)](https://undocs.org/A/RES/2254(ES-V)) (July 14, 1967). FRUS 1964–68, XIX, docs. [342](https://history.state.gov/historicaldocuments/frus1964-68v19/d342), [377](https://history.state.gov/historicaldocuments/frus1964-68v19/d377), [380](https://history.state.gov/historicaldocuments/frus1964-68v19/d380), [384](https://history.state.gov/historicaldocuments/frus1964-68v19/d384). [Johnson and Goldberg, 9:15 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-arthur-goldberg-july-15-1967), July 15, Conversation WH6707-01-12002 (Miller Center). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]. Names: Goldberg, Gromyko, Dobrynin.'
    tags: [name:goldberg-arthur-j, name:gromyko-andrei, name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1967-07-05.congo
    when: July 5–18
    date: '1967-07-05'
    thread: congo
    also: [africa]
    c: 'Mutiny of the white mercenaries in the Congolese army. July 5, some 160 of them, most French and Belgian, leading 1,000 to 2,000 Katangese troops, take Kisangani and Bukavu; Tshombe had been flown to Algiers June 30, his aircraft hijacked. Mobutu asks Johnson for help. July 6, Rusk, Nitze, Helms and the Chiefs for three C-130s with American crews, to ferry Congolese troops and supplies; no combat forces. Johnson approves; the planes sent July 8. Senators protest from July 10 (Check who). July 12, the mercenaries leave Kisangani by truck. July 13, Katzenbach to the NSC: Mobutu "the end of the line." July 18, Rusk: if Tshombe is executed, "forget about the Congo" in Congress.'
    n: 'FRUS 1964–68, XXIII, docs. [504](https://history.state.gov/historicaldocuments/frus1964-68v23/d504), [507](https://history.state.gov/historicaldocuments/frus1964-68v23/d507), [508](https://history.state.gov/historicaldocuments/frus1964-68v23/d508), [519](https://history.state.gov/historicaldocuments/frus1964-68v23/d519), [522](https://history.state.gov/historicaldocuments/frus1964-68v23/d522), [523](https://history.state.gov/historicaldocuments/frus1964-68v23/d523), [527](https://history.state.gov/historicaldocuments/frus1964-68v23/d527). Made public: FRUS 1964–68, XXIII (2013). [[w.kelly-americas-tyrant]]; [[w.devlin-chief-of-station-congo]]. Names: Tshombe, Mobutu, Rusk, Nitze, Helms, Katzenbach, Johnson.'
    tags: [name:tshombe-moise, name:mobutu-joseph-d, name:rusk-dean, name:nitze-paul, name:helms-richard, name:katzenbach-nicholas, name:johnson-lyndon-b, name:mcbride-robert-h, name:rostow-walt-w]
  - id: cal.1967-07-07.vietnam
    when: July 7–13
    date: '1967-07-07'
    thread: vietnam
    also: [defense]
    c: 'McNamara, Katzenbach and Wheeler in Vietnam, July 7–11, to settle the next increase, Program 5. MACV''s briefings: a main-force war, the North''s part in it growing. McNamara holds the increase within a ceiling of 525,000. July 11, with Bunker, to Nguyễn Văn Thiệu and Nguyễn Cao Kỳ, Johnson''s message: the elections must be honest and seen to be. July 12, his report at the White House; to the press: "some more U.S. military personnel will be required. I am not sure how many." July 13, Johnson''s news conference with McNamara and Westmoreland: Westmoreland to have the troops he needs. Program 5: 47,296 men more, to an authorized strength of 525,000; McNamara''s formal approval Aug. 14.'
    n: 'FRUS 1964–68, V, docs. [233](https://history.state.gov/historicaldocuments/frus1964-68v05/d233), [236](https://history.state.gov/historicaldocuments/frus1964-68v05/d236), [238](https://history.state.gov/historicaldocuments/frus1964-68v05/d238), [239](https://history.state.gov/historicaldocuments/frus1964-68v05/d239), [240](https://history.state.gov/historicaldocuments/frus1964-68v05/d240). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1192) (July 13, 1967). Made public: [[w.pentagon-papers]], IV, 515–528 (1971); FRUS 1964–68, V (2002). [[w.mcnamara-in-retrospect]], 283; [[w.gibbons-u-s-government-and-1995]]; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]; [[w.westmoreland-soldier-reports]]. Names: McNamara, Katzenbach, Wheeler, Bunker, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Westmoreland, Johnson.'
    tags: [name:mcnamara-robert-s, name:katzenbach-nicholas, name:wheeler-earle, name:bunker-ellsworth, name:nguyen-van-thieu, name:nguyen-cao-ky, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1967-07-11.consumers
    when: July 11
    date: '1967-07-11'
    thread: consumers
    c: 'The Senate passes S. 5, Proxmire''s truth-in-lending bill, [92–0](https://voteview.com/rollcall/RS0900126): lenders and sellers on credit to state the finance charge in dollars and as an annual percentage rate; revolving charge accounts excepted from the rate (Check).'
    n: 'See [[cal.1966-03-21.program]]. Names: Proxmire.'
    tags: [name:proxmire-william]
  - id: cal.1967-07-11.state-constitutions-ok
    when: July 11
    date: '1967-07-11'
    thread: state-constitutions
    c: 'Oklahoma, special election, after the bribery of the Supreme Court: a new judicial article, the justices of the peace abolished, judges elected without party, 90,167 to 73,919; the justices of the Supreme Court and the Court of Criminal Appeals chosen from a Judicial Nominating Commission''s names and kept by retention votes, 86,183 to 79,280.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 71](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=71) (State Questions 447, 448). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1965-01-21.states-and-cities-ok]].'
    tags: [state:ok]
  - id: cal.1967-07-12.civil-disorders
    when: July 12–17
    date: '1967-07-12'
    thread: civil-disorders
    also: [states-and-cities]
    c: 'Newark. July 12, evening: a Negro cab driver, arrested after a traffic stop, is seen dragged into the Fourth Precinct station; a crowd gathers, rocks and fire bombs. Looting and fires the next night. July 14, 2 to 2:30 a.m., Addonizio asks Hughes for the State Police and the National Guard. Sniper reports; Guardsmen and police fire into the Central Ward. The State Police and the Guard withdrawn July 17. Twenty-three dead, the Kerner Commission counted: a white detective, a white fireman, 21 Negroes.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1193) (July 18, 1967), item 6. [Johnson and Goldberg, 9:15 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-arthur-goldberg-july-15-1967), July 15, Conversation WH6707-01-12002 (Miller Center). [[w.report-of-the-national]]; [[w.hayden-rebellion-in-newark]]; [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Addonizio, Hughes.'
    tags: [name:addonizio-hugh-j, name:hughes-richard-j, state:nj, city:newark]
  - id: cal.1967-07-14.civil-disorders
    when: July 14–19
    date: '1967-07-14'
    thread: civil-disorders
    also: [states-and-cities]
    c: Plainfield, N.J., from the night of July 14. July 16, a white patrolman beaten and shot to death by a crowd after he had shot a young Negro. Forty-six carbines stolen from an arms plant nearby and handed out in the street. July 19, the carbines not returned, Hughes orders State Police and Guardsmen into the ghetto to search for them.
    n: '[[w.report-of-the-national]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Hughes.'
    tags: [name:hughes-richard-j, state:nj]
  - id: cal.1967-07-14.vietnam
    when: July 14–Aug. 5
    date: '1967-07-14'
    thread: vietnam
    c: 'July 14, Johnson asks Clifford and Taylor, of the Foreign Intelligence Advisory Board, to go to Saigon and to the allies fighting in Vietnam: to consult, and to learn what more troops they will give. July 22–Aug. 5: South Vietnam, Thailand, Australia, New Zealand, Korea; not the Philippines. Aug. 5, their report to Johnson, Ball, Rusk and Nitze present: the allies agree on the conduct of the war; none will promise troops at once; South Vietnam to add 65,000 men and draft at 18.'
    n: 'FRUS 1964–68, V, docs. [244](https://history.state.gov/historicaldocuments/frus1964-68v05/d244), [253](https://history.state.gov/historicaldocuments/frus1964-68v05/d253), [270](https://history.state.gov/historicaldocuments/frus1964-68v05/d270); XXVII, doc. [27](https://history.state.gov/historicaldocuments/frus1964-68v27/d27). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1194) (July 31, 1967), items 9, 12. Made public: FRUS 1964–68, V (2002). [[w.clifford-counsel-to-the-president-2]]; [[w.taylor-swords-and-plowshares]]; [[w.gibbons-u-s-government-and-1995]]. Names: Clifford, Taylor, Johnson.'
    tags: [name:clifford-clark, name:taylor-maxwell, name:johnson-lyndon-b, name:ball-george-w, name:rusk-dean, name:nitze-paul]
  - id: cal.1967-07-16.jobs-and-wages
    when: July 16–17
    date: '1967-07-16'
    thread: jobs-and-wages
    also: [railroads]
    c: 'The shopcraft unions'' railroad strike, from July 16: the first nationwide rail strike in more than twenty years, Johnson says. Executive Order 11362, July 16: transportation priorities and allocations. July 17, Johnson''s letter to McCormack and Mansfield: pass the Senate''s bill. The House concurs in the Senate''s amendments to S.J. Res. 81, [244–148](https://voteview.com/rollcall/RH0900093); the Senate, [69–20](https://voteview.com/rollcall/RS0900135), makes the determination of the special board final. Signed that night, [81 Stat. 122](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg122.pdf).'
    n: '[Letter to the Speaker of the House and to the Senate Majority Leader on the Railroad Strike](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-and-the-senate-majority-leader-the-railroad-strike) (July 17, 1967); [Statement by the President Upon Signing Joint Resolution To Provide for Settlement of the Railroad Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-joint-resolution-provide-for-settlement-the-railroad) (July 17, 1967). Exec. Order No. 11362, [32 Fed. Reg. 10495](https://www.govinfo.gov/app/details/FR-1967-07-18). Statute (K–J Cong. II.J.2). See [[cal.1967-01-28.railroads]]. Names: McCormack, Mansfield, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w, name:mansfield-mike]
  - id: cal.1967-07-17.vietnam
    when: July 17–18
    date: '1967-07-17'
    thread: vietnam
    c: 'Saigon. July 17, the Constituent Assembly''s committee on the slates recommends rejecting the military ticket, Nguyễn Văn Thiệu and Nguyễn Cao Kỳ. July 18, Bùi Diễm to Bunker: the generals may take "some strong action." Bunker: no coup will be countenanced; if the impasse stands, Thiệu and Kỳ should consider stepping aside. Late July 18, the Assembly approves the Thiệu–Kỳ ticket and ten others and disqualifies seven, among them Dương Văn Minh''s and the peace candidate Âu Trường Thanh''s.'
    n: 'FRUS 1964–68, V, doc. [246](https://history.state.gov/historicaldocuments/frus1964-68v05/d246) (editorial note). Made public: [[w.bunker-papers]], 86–91 (1990); FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and-1995]]; [[w.schaffer-ellsworth-bunker]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bùi Diễm, Bunker, Dương Văn Minh, Âu Trường Thanh.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:bui-diem, name:bunker-ellsworth, name:duong-van-minh, name:au-truong-thanh]
  - id: cal.1967-07-18.conservation
    when: July 18
    date: '1967-07-18'
    thread: conservation
    c: 'The Senate passes S. 780, Muskie''s air quality bill, [88–0](https://voteview.com/rollcall/RS0900136): air quality control regions; federal criteria; the States to set standards for each region, the Secretary of Health, Education, and Welfare to act where they do not (Check the terms).'
    n: '[[w.jones-clean-air]]; [[w.dewey-dont-breathe-the-air]]. See [[cal.1965-10-20.conservation]]. Names: Muskie.'
    tags: [name:muskie-edmund-s]
  - id: cal.1967-07-19.civil-disorders
    when: July 19
    date: '1967-07-19'
    thread: civil-disorders
    also: [crime-and-hijacking]
    c: 'The House passes H.R. 421, Cramer''s anti-riot bill, [348–70](https://voteview.com/rollcall/RH0900096): a federal crime to travel between States, or use any facility of interstate commerce, with intent to incite or take part in a riot; five years and $10,000 (Check the penalty).'
    n: '[[w.flamm-law-and-order]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Cramer.'
    tags: [name:cramer-william-c]
  - id: cal.1967-07-20.cities-and-housing
    when: July 20
    date: '1967-07-20'
    thread: cities-and-housing
    also: [poverty]
    c: 'The House refuses the rule for H.R. 11000, the Rat Extermination Act, [176–207](https://voteview.com/rollcall/RH0900097): grants to cities for rat control, $20 million a year asked. Christian reads Johnson''s statement: "a cruel blow to the poor children of America."'
    n: '[Statement by the President on the Failure of the House To Act on the Rat Extermination Act](https://www.presidency.ucsb.edu/documents/statement-the-president-the-failure-the-house-act-the-rat-extermination-act) (July 20, 1967). [[w.califano-triumph-and-tragedy-of]]; [[w.dallek-flawed-giant]]. Names: Christian, Johnson.'
    tags: [name:christian-george, name:johnson-lyndon-b]
  - id: cal.1967-07-20.black-nationalism
    when: July 20–23
    date: '1967-07-20'
    thread: black-nationalism
    also: [civil-rights-organizations]
    c: 'Newark, three days after the Guard''s withdrawal: the National Conference on Black Power, more than a thousand delegates (Check the count). Resolutions for black economic and political power and self-defense (Check the terms).'
    n: '[[w.joseph-waiting-til-the-midnight]]; [[w.woodard-nation-within-a-nation]]; [[w.mumford-newark]].'
    tags: [state:nj, city:newark]
  - id: cal.1967-07-21.vietnam
    when: July 21–Aug. 3
    date: '1967-07-21'
    thread: vietnam
    c: 'Pennsylvania. Herbert Marcovich, a French biologist known to Kissinger, met at the Pugwash conference in Paris in June, and Raymond Aubrac, an official of the FAO known to Hồ Chí Minh and Phạm Văn Đồng, in Hanoi July 21–26, Kissinger having briefed them on the American position. July 24, Phạm Văn Đồng: "We want an unconditional end to the bombing and if that happens, there will be no further obstacle to negotiations"; a de facto halt enough; some American troops might stay until a political settlement. They see Hồ Chí Minh once. Back in Paris July 28. Aug. 1, Kissinger''s report. Aug. 3, State''s negotiations committee in Harriman''s office: of "considerable potential significance"; Kissinger and Cooper to see the Frenchmen in Paris.'
    n: 'FRUS 1964–68, V, docs. [263](https://history.state.gov/historicaldocuments/frus1964-68v05/d263) (editorial note), [267](https://history.state.gov/historicaldocuments/frus1964-68v05/d267). Made public: [[w.herring-secret-diplomacy-of-the]], 717–725 (1983); FRUS 1964–68, V (2002). [[w.isaacson-kissinger]]; [[w.ferguson-kissinger-1923-1968]]; [[w.gibbons-u-s-government-and-1995]]. Names: Marcovich, Kissinger, Aubrac, Hồ Chí Minh, Phạm Văn Đồng, Harriman, Cooper.'
    tags: [name:marcovich-hebert, name:aubrac-raymond, name:kissinger-henry-a, name:ho-chi-minh, name:pham-van-dong, name:harriman-w-averell, name:cooper-chester-l]
  - id: cal.1967-07-23.civil-disorders
    when: July 23–Aug. 3
    date: '1967-07-23'
    thread: civil-disorders
    also: [states-and-cities, elections-1968]
    c: 'Detroit. A police raid on an after-hours club at 12th Street and Clairmount, early July 23, sets off five days of rioting; Romney calls out the Michigan National Guard. July 24, 10:46 a.m., Romney, joined by Cavanagh, asks for federal troops. Johnson sends paratroopers to Selfridge Air Force Base, Mich., and Vance to Detroit. That night, on Vance''s and Throckmorton''s report, the proclamation and Executive Order 11364; Johnson on television before midnight: "law and order have broken down in Detroit, Michigan." July 25–26, three young Negro men killed at the Algiers Motel. Forty-three dead, more than 7,200 arrested. July 27, food and medical aid ordered. Aug. 3, Vance and Throckmorton report to Johnson.'
    n: '[Telegram in Reply to Governor Romney''s Request for Federal Troop Assistance in Detroit](https://www.presidency.ucsb.edu/documents/telegram-reply-governor-romneys-request-for-federal-troop-assistance-detroit) (July 24, 1967); [Remarks to the Nation After Authorizing the Use of Federal Troops in Detroit](https://www.presidency.ucsb.edu/documents/remarks-the-nation-after-authorizing-the-use-federal-troops-detroit) (July 24, 1967); Exec. Order No. 11364, [32 Fed. Reg. 10907](https://www.govinfo.gov/app/details/FR-1967-07-26); [Telegram to Governor Romney and Mayor Cavanagh in Reply to Their Request for Disaster Relief Assistance in Detroit](https://www.presidency.ucsb.edu/documents/telegram-governor-romney-and-mayor-cavanagh-reply-their-request-for-disaster-relief) (July 27, 1967); [Remarks to the Press After a Meeting With Cyrus Vance and General Throckmorton on the Situation in Detroit](https://www.presidency.ucsb.edu/documents/remarks-the-press-after-meeting-with-cyrus-vance-and-general-throckmorton-the-situation) (Aug. 3, 1967). [Johnson and Ramsey Clark](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ramsey-clark-july-24-1967), July 24, Conversation WH6707-01-12004; [Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005; [Johnson and Dirksen, 3:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-july-26-1967), July 26, Conversations WH6707-01-12007, [12008](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-july-26-1967-0) (Miller Center). [[w.report-of-the-national]]; [[w.fine-violence-in-the-model]]; [[w.locke-detroit-riot-of-1967]]; [[w.hersey-algiers-motel-incident]]; [[w.sugrue-origins-of-the-urban]]; [[w.thompson-whose-detroit]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Romney, Cavanagh, Vance, Throckmorton, Johnson.'
    tags: [name:romney-george-w, name:cavanagh-jerome-p, name:vance-cyrus, name:throckmorton-john-l, name:johnson-lyndon-b, name:clark-ramsey, name:hoover-j-edgar, name:dirksen-everett, state:mi, city:detroit]
  - id: cal.1967-07-24.civil-disorders
    when: July 24–26
    date: '1967-07-24'
    thread: civil-disorders
    also: [civil-rights-organizations, states-and-cities]
    c: 'Cambridge, Md. H. Rap Brown, SNCC''s chairman, to a crowd of several hundred, night of July 24: "If America don''t come around, we''re going to burn America down" (Check the words). Shots; Brown grazed by a pellet; fire burns the Pine Street school and blocks of the Second Ward (Check). Maryland charges him with inciting to riot; a federal warrant for flight to avoid prosecution; arrested July 26 at Washington National Airport (Check), freed on bail. Agnew: "I hope they pick him up soon, put him away and throw away the key" (Check the words).'
    n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005 (Miller Center). [[w.levy-civil-war-on-race]]; [[w.carson-in-struggle]]; [[w.witcover-white-knight]]; [[w.joseph-waiting-til-the-midnight]]. Names: Brown, Agnew.'
    tags: [name:brown-h-rap, name:agnew-spiro-t, name:hoover-j-edgar, state:md]
  - id: cal.1967-07-26.civil-rights-organizations
    when: July 26
    date: '1967-07-26'
    thread: civil-rights-organizations
    also: [civil-disorders, king]
    c: 'King, Randolph, Wilkins and Young, a joint statement on the riots: the killing, arson and looting criminal and to be dealt with so; the riots harmful to Negroes; Congress to act on jobs and housing (Check the terms and the date).'
    n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005 (Miller Center). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. Names: Martin Luther King, Randolph, Wilkins, Young.'
    tags: [name:king-martin-luther-jr, name:randolph-a-philip, name:wilkins-roy, name:young-whitney-m-jr]
  - id: cal.1967-07-27.civil-disorders
    when: July 27–31
    date: '1967-07-27'
    thread: civil-disorders
    c: 'Johnson''s address on civil disorders, July 27, 10:30 p.m. "We have endured a week such as no nation should live through." A National Advisory Commission on Civil Disorders: Kerner chairman, Lindsay vice chairman; Fred Harris and Brooke of the Senate, Corman and McCulloch of the House; Abel of the Steelworkers, Thornton of Litton Industries, Wilkins of the NAACP, Peden of Kentucky''s Commerce Department, Jenkins, Atlanta''s chief of police. The looting and arson "not part of the civil rights protest"; new riot-control training for the National Guard; the FBI to look for evidence of conspiracy; the House''s defeat of the rat bill and the cut in model cities funds named. A day of prayer, July 30. July 29, the commission''s first meeting; Executive Order 11365: what happened, why, what can be done. July 31, Ginsburg its executive director.'
    n: '[The President''s Address to the Nation on Civil Disorders](https://www.presidency.ucsb.edu/documents/the-presidents-address-the-nation-civil-disorders) (July 27, 1967); [Remarks Upon Signing Order Establishing the National Advisory Commission on Civil Disorders](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-order-establishing-the-national-advisory-commission-civil-disorders) (July 29, 1967); Exec. Order No. 11365, [32 Fed. Reg. 11111](https://www.govinfo.gov/app/details/FR-1967-08-01); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1194) (July 31, 1967), item 1. [Johnson and Lindsay, 5:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-lindsay-july-27-1967), July 27, Conversation WH6707-01-12009 (Miller Center). [[w.report-of-the-national]]; [[w.gillon-separate-and-unequal]]; [[w.barnhart-kerner]]; [[w.harris-potomac-fever]]; [[w.cannato-ungovernable-city]]; [[w.flamm-law-and-order]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Kerner, Lindsay, Harris, Brooke, Corman, McCulloch, Abel, Thornton, Wilkins, Peden, Jenkins, Ginsburg, Johnson.'
    tags: [name:johnson-lyndon-b, name:kerner-otto, name:lindsay-john-v, name:harris-fred-r, name:brooke-edward-w, name:corman-james-c, name:mcculloch-william-m, name:abel-i-w, name:thornton-charles-b, name:wilkins-roy, name:peden-katherine-graham, name:jenkins-herbert, name:ginsburg-david, name:hoover-j-edgar]
  - id: cal.1967-07-29.congo
    when: July 29–Aug. 31
    date: '1967-07-29'
    thread: congo
    also: [africa]
    c: 'July 29, eighteen Republican Senators, Hickenlooper and Dirksen among them, protest the C-130s in a letter to Johnson. Rusk to McBride: the second C-130 to leave early in the week; Belgium and other Europeans asked to carry more of the burden. Schramme''s mercenaries hold Bukavu. Aug. 5, Mobutu''s radio attacks the United States; McBride protests. Aug. 18–25, an evacuation of the mercenaries through Rwanda nearly agreed, then lost. Aug. 31, Rostow to Johnson: Rusk, McNamara and Helms for five CIA-paid pilots to fly Mobutu''s T-28s for three months.'
    n: 'FRUS 1964–68, XXIII, docs. [530](https://history.state.gov/historicaldocuments/frus1964-68v23/d530), [531](https://history.state.gov/historicaldocuments/frus1964-68v23/d531), [540](https://history.state.gov/historicaldocuments/frus1964-68v23/d540), [544](https://history.state.gov/historicaldocuments/frus1964-68v23/d544). Made public: FRUS 1964–68, XXIII (2013). See [[cal.1967-07-05.congo]]. Names: Hickenlooper, Dirksen, Johnson, Rusk, McBride, Schramme, Mobutu, Rostow, McNamara, Helms.'
    tags: [name:hickenlooper-bourke-b, name:dirksen-everett, name:johnson-lyndon-b, name:rusk-dean, name:mcbride-robert-h, name:schramme-jean, name:mobutu-joseph-d, name:rostow-walt-w, name:mcnamara-robert-s, name:helms-richard]
  - id: cal.1967-07-30.civil-disorders
    when: July 30–Aug. 3
    date: '1967-07-30'
    thread: civil-disorders
    also: [states-and-cities]
    c: Milwaukee. Shooting, looting and fires on the North Side from the night of July 30. Maier declares an emergency and a curfew on the whole city, around the clock; Knowles sends the National Guard. Four dead (Check the count and the days).
    n: '[[w.report-of-the-national]]; [[w.jones-selma-of-the-north]]. Names: Maier, Knowles.'
    tags: [name:maier-henry-w, name:knowles-warren-p, state:wi, city:milwaukee]
  - id: cal.1967-07-31.vietnam
    when: July 31–Aug. 18
    date: '1967-07-31'
    thread: vietnam
    also: [congress, elections-1968]
    c: 'July 31, Fulbright introduces S. Res. 151: a national commitment to a foreign power to follow only from action by both the executive and the legislative branches (Check the terms). Foreign Relations'' hearings from Aug. 16. Katzenbach, Aug. 17: the Tonkin Gulf resolution and the SEATO treaty authority enough; a declaration of war "outmoded" (Check the words). McCarthy, leaving the hearing: "There is no limit to what he says the President could do" (Check the words). Aug. 18, Johnson''s news conference: "we did not think the resolution was necessary to do what we did and what we are doing. But we thought it was desirable"; Congress may withdraw it by a resolution of its own.'
    n: '*U.S. Commitments to Foreign Powers: Hearings Before the Senate Committee on Foreign Relations on S. Res. 151*, 90th Cong., 1st Sess. (1967) (Check the pages). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1195) (Aug. 18, 1967), item 10. FRUS 1964–68, V, doc. [262](https://history.state.gov/historicaldocuments/frus1964-68v05/d262). [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.gibbons-u-s-government-and-1995]]; [[w.ely-war-and-responsibility]]; [[w.katzenbach-some-of-it-was]]; [[w.sandbrook-eugene-mccarthy]]; [[w.mccarthy-year-of-the-people]]. Names: Fulbright, Katzenbach, McCarthy, Johnson.'
    tags: [name:fulbright-j-william, name:katzenbach-nicholas, name:mccarthy-eugene-j, name:johnson-lyndon-b]
  - id: cal.1967-07.states-and-cities-nyc
    when: July–Sept.
    date: 1967-07
    thread: states-and-cities
    c: 'New York City. Three demonstration districts for community control of the schools, with Ford Foundation money: Ocean Hill–Brownsville in Brooklyn, Intermediate School 201 in Harlem, Two Bridges on the Lower East Side. Ocean Hill''s governing board of parents and members of the community elected in August; Rhody McCoy, an acting principal, its unit administrator. Check the dates.'
    n: 'Check: the Board of Education''s resolution. [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.cannato-ungovernable-city]]; [[w.kahlenberg-tough-liberal]]. Names: McCoy.'
    tags: [state:ny, city:nyc, name:mccoy-rhody-a]
