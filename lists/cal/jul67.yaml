# Cal. XCIII July 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCIII
entries:
  - id: cal.1967-07-01.state-and-city-finance-mi
    when: July 1
    date: '1967-07-01'
    thread: state-and-city-finance
    c: 'Michigan. The legislature passes Romney''s fiscal program, the State''s first income tax: 2.6 percent on individuals, an exemption of $1,200 a dependent, from Oct. 1; 5.6 percent on corporations and 7 on financial institutions, from Jan. 1, 1968; the business activities tax repealed; relief from property and city income taxes. House 62–44, June 30; Senate 22–15, July 1, refusing it immediate effect. Act 281; Romney signs (Check the day).'
    n: '*Pontiac Press*, [July 1, 1967](https://our.oakland.edu/bitstreams/796dd1e2-b1a8-4121-8d3a-f058cea60603/download), 1. [Income Tax Act of 1967](https://www.legislature.mi.gov/documents/mcl/pdf/MCL-206-1.pdf), 1967 PA 281, in force Oct. 1, 1967. [[w.mollenhoff-george-romney]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1963-09-11.state-and-city-finance-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1967-07-01.states-and-cities-us
    when: July 1
    date: '1967-07-01'
    thread: states-and-cities
    also: [elections-1968]
    c: 'St. Louis. The Democratic Governors'' Conference: a statement of accord with Johnson on the peace in Vietnam, crime, and equality of opportunity; McKeithen and Maddox abstain. Johnson comes, briefs them in confidence, and signs the Older Americans Act Amendments before them.'
    n: '[Remarks to the Conference of Democratic Governors in St. Louis](https://www.presidency.ucsb.edu/documents/remarks-the-conference-democratic-governors-st-louis); [The President''s News Conference in St. Louis Following the Democratic Governors Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-st-louis-following-the-democratic-governors-conference) (July 1, 1967), Harold Hughes''s statement. [[w.sparacino-democratic-and-republican-governors]]; [[w.sabato-goodbye-to-good-time]]. See [[cal.1967-03-18.states-and-cities-us]]. Names: Johnson, Harold Hughes, McKeithen, Maddox.'
    tags: [name:johnson-lyndon-b, name:hughes-harold-e, name:mckeithen-john-j, name:maddox-lester, state:mo]
  - id: cal.1967-07-02.opinion
    when: July 2
    date: '1967-07-02'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 22–27: Johnson 45 percent, Romney 44, undecided 11. Independents: Romney 45, Johnson 40.'
    n: '[[w.gallup-poll]], III, 2071. Names: Johnson, Romney.'
    tags: [name:johnson-lyndon-b, name:romney-george-w]
  - id: cal.1967-07-04.middle-east
    when: July 4
    date: '1967-07-04'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'The General Assembly''s emergency session on the war. The Yugoslav draft, Israel to withdraw to the lines of June 4, 53–46–20, the United States against; the Latin American draft, withdrawal with an end to belligerency, 57–43–20, the United States for; neither has two-thirds. Resolution 2253 (ES-V), 99–0–20: Israel to rescind its measures altering the status of Jerusalem; the United States abstaining.'
    n: 'G.A. Res. [2253 (ES-V)](https://undocs.org/A/RES/2253(ES-V)) (July 4, 1967). FRUS 1964–68, XIX, doc. [342](https://history.state.gov/historicaldocuments/frus1964-68v19/d342). Made public: FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]; [[cal.1967-06-19.middle-east]].'
  - id: cal.1967-07-05.congo
    when: July 5
    date: '1967-07-05'
    thread: congo
    c: 'Mutiny of the white mercenaries in the Congolese army. Some 160 of them, most French and Belgian, leading 1,000 to 2,000 Katangese troops, take Kisangani and Bukavu; Tshombe had been flown to Algiers June 30, his aircraft hijacked. Mobutu asks Johnson for help.'
    n: 'FRUS 1964–68, XXIII, doc. [504](https://history.state.gov/historicaldocuments/frus1964-68v23/d504). Made public: FRUS 1964–68, XXIII (2013). [[w.kelly-americas-tyrant]]; [[w.devlin-chief-of-station-congo]]. Names: Tshombe, Mobutu, Johnson.'
    tags: [name:tshombe-moise, name:mobutu-joseph-d, name:johnson-lyndon-b]
  - id: cal.1967-07-06.congo
    when: July 6–8
    date: '1967-07-06'
    thread: congo
    c: 'Rusk, Nitze, Helms and the Chiefs for three C-130s with American crews, to ferry Congolese troops and supplies; no combat forces. Johnson approves; the planes sent July 8.'
    n: 'FRUS 1964–68, XXIII, docs. [507](https://history.state.gov/historicaldocuments/frus1964-68v23/d507), [508](https://history.state.gov/historicaldocuments/frus1964-68v23/d508). See [[cal.1967-07-05.congo]]. Names: Rusk, Nitze, Helms, Johnson.'
    tags: [name:rusk-dean, name:nitze-paul, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-07-06.conservation-or
    when: July 6
    date: '1967-07-06'
    thread: conservation
    c: 'Oregon. McCall signs the Beach Bill (H.B. 1601): the wet sand to sixteen feet above low tide the State''s; a public easement over the dry sand to the line of vegetation. Brought on by a Cannon Beach, Or., motel owner''s fencing of the dry sand, 1966.'
    n: 'Check: Or. Laws 1967. [Wikipedia, "Oregon Beach Bill"](https://en.wikipedia.org/wiki/Oregon_Beach_Bill). [[w.walth-fire-at-edens-gate]]; [[w.peirce-pacific-states-of-america]]. Names: McCall.'
    tags: [state:or, name:mccall-tom]
  - id: cal.1967-07-07.vietnam
    when: July 7–11
    date: '1967-07-07'
    thread: vietnam-program-5
    also: [defense]
    c: 'McNamara, Katzenbach and Wheeler in Vietnam, to settle the next increase, Program 5. MACV''s briefings: a main-force war, the North''s part in it growing. McNamara holds the increase within a ceiling of 525,000. July 11, with Bunker, to Nguyễn Văn Thiệu and Nguyễn Cao Kỳ, Johnson''s message: the elections must be honest and seen to be.'
    n: 'FRUS 1964–68, V, docs. [233](https://history.state.gov/historicaldocuments/frus1964-68v05/d233), [236](https://history.state.gov/historicaldocuments/frus1964-68v05/d236). Made public: [[w.pentagon-papers]], IV, 515–528 (1971); FRUS 1964–68, V (2002). [[w.mcnamara-in-retrospect]], 283; [[w.gibbons-u-s-government-and]], IV; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]; [[w.westmoreland-soldier-reports]]. See [[cal.1967-05-19.vietnam]]. Names: McNamara, Katzenbach, Wheeler, Bunker, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Johnson.'
    tags: [name:mcnamara-robert-s, name:katzenbach-nicholas, name:wheeler-earle, name:bunker-ellsworth, name:nguyen-van-thieu, name:nguyen-cao-ky, name:johnson-lyndon-b]
  - id: cal.1967-07-09.opinion
    when: July 9
    date: '1967-07-09'
    thread: opinion
    also: [middle-east-six-day-war-aftermath]
    c: 'Gallup, June 22–27: Arab-Israeli peace plans, the UN to have the final say 36 percent, left to Israel and the Arabs 57. A peaceful settlement can be worked out: yes 70, no 21. The land Israel conquered: give all back 15, keep it all 24, keep some 49.'
    n: '[[w.gallup-poll]], III, 2071–72.'
  - id: cal.1967-07-10.congo
    when: July 10
    date: '1967-07-10'
    thread: congo
    also: [congress]
    c: 'Senators protest the C-130s (Check who).'
    n: 'FRUS 1964–68, XXIII, doc. [519](https://history.state.gov/historicaldocuments/frus1964-68v23/d519). See [[cal.1967-07-05.congo]].'
  - id: cal.1967-07-11.consumers
    when: July 11
    date: '1967-07-11'
    thread: consumers
    c: 'The Senate passes S. 5, Proxmire''s truth-in-lending bill, [92–0](https://voteview.com/rollcall/RS0900126): lenders and sellers on credit to state the finance charge in dollars and as an annual percentage rate; revolving charge accounts excepted from the rate (Check).'
    n: 'See [[cal.1966-03-21.program]]. Names: Proxmire.'
    tags: [name:proxmire-william]
  - id: cal.1967-07-11.state-constitutions-ok
    when: July 11
    date: '1967-07-11'
    thread: state-constitutions
    c: 'Oklahoma, special election, after the bribery of the Supreme Court: a new judicial article, the justices of the peace abolished, judges elected without party, 90,167 to 73,919; the justices of the Supreme Court and the Court of Criminal Appeals chosen from a Judicial Nominating Commission''s names and kept by retention votes, 86,183 to 79,280.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 71](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=71) (State Questions 447, 448). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1965-01-21.states-and-cities-ok]].'
    tags: [state:ok]
  - id: cal.1967-07-12.civil-disorders
    when: July 12–13
    date: '1967-07-12'
    thread: civil-disorders-newark
    also: [states-and-cities]
    c: 'Newark. July 12, evening: a Negro cab driver, arrested after a traffic stop, is seen dragged into the Fourth Precinct station; a crowd gathers, rocks and fire bombs. Looting and fires the next night.'
    n: '[[w.report-of-the-national]]; [[w.hayden-rebellion-in-newark]]; [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]; [[w.mclaughlin-long-hot-summer-of]].'
    tags: [state:nj, city:newark]
  - id: cal.1967-07-12.opinion
    when: July 12
    date: '1967-07-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 22–27: Republicans'' choice for 1968: Nixon 39 percent, Romney 25, Reagan 11, Rockefeller 10, Percy 7, Hatfield 2, Lindsay 2. Independents: Nixon 26, Romney 19, Rockefeller 18, Reagan 14, Percy 7, Lindsay 5, Hatfield 3.'
    n: '[[w.gallup-poll]], III, 2072. Names: Nixon, Romney, Reagan, Rockefeller, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:reagan-ronald, name:rockefeller-nelson, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1967-07-12.electoral-college
    when: July 12
    date: '1967-07-12'
    thread: electoral-college
    also: [congress]
    c: 'Bayh''s subcommittee resumes its hearings on the election of the President: Holland and Ervin.'
    n: '*Election of the President* hearings, [435](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=445). See [[cal.1967-05-16.electoral-college]]. Names: Holland, Ervin.'
    tags: [name:holland-spessard-l, name:ervin-sam-j-jr]
  - id: cal.1967-07-12.vietnam-program-5
    when: July 12
    date: '1967-07-12'
    thread: vietnam-program-5
    c: 'McNamara''s report at the White House; to the press: "some more U.S. military personnel will be required. I am not sure how many."'
    n: 'FRUS 1964–68, V, doc. [238](https://history.state.gov/historicaldocuments/frus1964-68v05/d238). See [[cal.1967-07-07.vietnam]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-07-12.congo
    when: July 12–13
    date: '1967-07-12'
    thread: congo
    c: 'The mercenaries leave Kisangani by truck, July 12. July 13, Katzenbach to the NSC: Mobutu "the end of the line."'
    n: 'FRUS 1964–68, XXIII, docs. [522](https://history.state.gov/historicaldocuments/frus1964-68v23/d522), [523](https://history.state.gov/historicaldocuments/frus1964-68v23/d523). See [[cal.1967-07-05.congo]]. Names: Katzenbach, Mobutu.'
    tags: [name:katzenbach-nicholas, name:mobutu-joseph-d]
  - id: cal.1967-07-13.vietnam-program-5
    when: July 13
    date: '1967-07-13'
    thread: vietnam-program-5
    c: 'Johnson''s news conference with McNamara and Westmoreland: Westmoreland to have the troops he needs.'
    n: 'FRUS 1964–68, V, docs. [239](https://history.state.gov/historicaldocuments/frus1964-68v05/d239), [240](https://history.state.gov/historicaldocuments/frus1964-68v05/d240). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1192) (July 13, 1967). See [[cal.1967-07-07.vietnam]]. Names: McNamara, Westmoreland, Johnson.'
    tags: [name:mcnamara-robert-s, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1967-07-14.civil-disorders
    when: July 14–16
    date: '1967-07-14'
    thread: civil-disorders
    also: [states-and-cities]
    c: Plainfield, N.J., from the night of July 14. July 16, a white patrolman beaten and shot to death by a crowd after he had shot a young Negro. Forty-six carbines stolen from an arms plant nearby and handed out in the street.
    n: '[[w.report-of-the-national]]; [[w.mclaughlin-long-hot-summer-of]].'
    tags: [state:nj]
  - id: cal.1967-07-14.civil-disorders-newark
    when: July 14
    date: '1967-07-14'
    thread: civil-disorders-newark
    also: [states-and-cities]
    c: 'Newark. 2 to 2:30 a.m., Addonizio asks Hughes for the State Police and the National Guard. Sniper reports; Guardsmen and police fire into the Central Ward.'
    n: 'Check: the governor''s proclamation. See [[cal.1967-07-12.civil-disorders]]. Names: Addonizio, Hughes.'
    tags: [name:addonizio-hugh-j, name:hughes-richard-j, state:nj, city:newark]
  - id: cal.1967-07-14.vietnam
    when: July 14
    date: '1967-07-14'
    thread: vietnam
    c: 'Johnson asks Clifford and Taylor, of the Foreign Intelligence Advisory Board, to go to Saigon and to the allies fighting in Vietnam: to consult, and to learn what more troops they will give.'
    n: 'FRUS 1964–68, V, doc. [244](https://history.state.gov/historicaldocuments/frus1964-68v05/d244). Made public: FRUS 1964–68, V (2002). [[w.clifford-counsel-to-the-president-2]]; [[w.taylor-swords-and-plowshares]]; [[w.gibbons-u-s-government-and]], IV. Names: Clifford, Taylor, Johnson.'
    tags: [name:clifford-clark, name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1967-07-14.middle-east
    when: July 14
    date: '1967-07-14'
    thread: middle-east-six-day-war-aftermath
    c: 'General Assembly Resolution 2254 (ES-V), 99–0–18: Israel again called on to rescind its measures altering the status of Jerusalem; the United States abstaining.'
    n: 'G.A. Res. [2254 (ES-V)](https://undocs.org/A/RES/2254(ES-V)) (July 14, 1967). [Johnson and Goldberg, 9:15 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-arthur-goldberg-july-15-1967), July 15, Conversation WH6707-01-12002 (Miller Center). See [[cal.1967-07-04.middle-east]]. Names: Goldberg, Johnson.'
    tags: [name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1967-07-16.jobs-and-wages
    when: July 16–17
    date: '1967-07-16'
    thread: railroads
    c: 'The shopcraft unions'' railroad strike, from July 16: the first nationwide rail strike in more than twenty years, Johnson says. Executive Order 11362, July 16: transportation priorities and allocations. July 17, Johnson''s letter to McCormack and Mansfield: pass the Senate''s bill. The House concurs in the Senate''s amendments to S.J. Res. 81, [244–148](https://voteview.com/rollcall/RH0900093); the Senate, [69–20](https://voteview.com/rollcall/RS0900135), makes the determination of the special board final. Signed that night, [81 Stat. 122](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg122.pdf).'
    n: '[Letter to the Speaker of the House and to the Senate Majority Leader on the Railroad Strike](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-and-the-senate-majority-leader-the-railroad-strike) (July 17, 1967); [Statement by the President Upon Signing Joint Resolution To Provide for Settlement of the Railroad Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-joint-resolution-provide-for-settlement-the-railroad) (July 17, 1967). Exec. Order No. 11362, [32 Fed. Reg. 10495](https://www.govinfo.gov/app/details/FR-1967-07-18). Statute (K–J Cong. II.J.2). See [[cal.1967-01-28.railroads]]. Names: McCormack, Mansfield, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w, name:mansfield-mike]
  - id: cal.1967-07-16.opinion
    when: July 16
    date: '1967-07-16'
    thread: opinion
    also: [court]
    c: 'Gallup, June 22–27: the Supreme Court, excellent 15 percent, good 30, fair 29, poor 17. Impartial in its decisions 47; favors one group 30.'
    n: '[[w.gallup-poll]], III, 2068. Check: the release is printed dated July 16 on p. 2068, among the June releases.'
  - id: cal.1967-07-17.civil-disorders-newark
    when: July 17
    date: '1967-07-17'
    thread: civil-disorders-newark
    also: [states-and-cities]
    c: 'Newark. The State Police and the Guard withdrawn. Twenty-three dead, the Kerner Commission counted: a white detective, a white fireman, 21 Negroes.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1193) (July 18, 1967), item 6. See [[cal.1967-07-12.civil-disorders]]. Names: Hughes.'
    tags: [name:hughes-richard-j, state:nj, city:newark]
  - id: cal.1967-07-17.vietnam
    when: July 17–18
    date: '1967-07-17'
    thread: vietnam-elections
    c: 'Saigon. July 17, the Constituent Assembly''s committee on the slates recommends rejecting the military ticket, Nguyễn Văn Thiệu and Nguyễn Cao Kỳ. July 18, Bùi Diễm to Bunker: the generals may take "some strong action." Bunker: no coup will be countenanced; if the impasse stands, Thiệu and Kỳ should consider stepping aside. Late July 18, the Assembly approves the Thiệu–Kỳ ticket and ten others and disqualifies seven, among them Dương Văn Minh''s and the peace candidate Âu Trường Thanh''s.'
    n: 'FRUS 1964–68, V, doc. [246](https://history.state.gov/historicaldocuments/frus1964-68v05/d246) (editorial note). Made public: [[w.bunker-papers]], 86–91 (1990); FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV; [[w.schaffer-ellsworth-bunker]]. Names: Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bùi Diễm, Bunker, Dương Văn Minh, Âu Trường Thanh.'
    tags: [name:nguyen-van-thieu, name:nguyen-cao-ky, name:bui-diem, name:bunker-ellsworth, name:duong-van-minh, name:au-truong-thanh, place:saigon]
  - id: cal.1967-07-18.conservation
    when: July 18
    date: '1967-07-18'
    thread: conservation
    c: 'The Senate passes S. 780, Muskie''s air quality bill, [88–0](https://voteview.com/rollcall/RS0900136): air quality control regions; federal criteria; the States to set standards for each region, the Secretary of Health, Education, and Welfare to act where they do not (Check the terms).'
    n: '[[w.jones-clean-air]]; [[w.dewey-dont-breathe-the-air]]. See [[cal.1965-10-20.conservation]]. Names: Muskie.'
    tags: [name:muskie-edmund-s]
  - id: cal.1967-07-18.congo
    when: July 18
    date: '1967-07-18'
    thread: congo
    c: 'Rusk to Johnson: if Tshombe is executed, "forget about the Congo" in Congress.'
    n: 'FRUS 1964–68, XXIII, doc. [527](https://history.state.gov/historicaldocuments/frus1964-68v23/d527). See [[cal.1967-07-05.congo]]. Names: Rusk, Tshombe, Johnson.'
    tags: [name:rusk-dean, name:tshombe-moise, name:johnson-lyndon-b]
  - id: cal.1967-07-19.civil-disorders
    when: July 19
    date: '1967-07-19'
    thread: civil-disorders
    also: [crime-and-hijacking]
    c: 'The House passes H.R. 421, Cramer''s anti-riot bill, [348–70](https://voteview.com/rollcall/RH0900096): a federal crime to travel between States, or use any facility of interstate commerce, with intent to incite or take part in a riot; five years and $10,000 (Check the penalty).'
    n: '[[w.flamm-law-and-order]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Cramer.'
    tags: [name:cramer-william-c]
  - id: cal.1967-07-19.amendments
    when: July 19
    date: '1967-07-19'
    thread: amendments
    also: [states-and-cities, congress]
    c: 'House Judiciary opens hearings on H.J. Res. 396, Celler''s, introduced Mar. 7, and like resolutions: the District''s representation in Congress, as the message asked. The hearings close Aug. 2.'
    n: '*D.C. Representation in Congress: Hearings on H.J. Res. 396 before the House Committee on the Judiciary*, 90th Cong., 1st sess. (1967); [113 Cong. Rec. 5749](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt5/pdf/GPO-CRECB-1967-pt5-1-2.pdf#page=48) (1967). See [[cal.1967-02-27.amendments]]. Names: Celler.'
    tags: [name:celler-emanuel, state:dc, city:washington]
  - id: cal.1967-07-19.civil-disorders-2
    when: July 19
    date: '1967-07-19'
    thread: civil-disorders
    also: [states-and-cities]
    c: 'Plainfield, N.J. The carbines not returned, Hughes orders State Police and Guardsmen into the ghetto to search for them.'
    n: 'See [[cal.1967-07-14.civil-disorders]]. Names: Hughes.'
    tags: [name:hughes-richard-j, state:nj]
  - id: cal.1967-07-19.electoral-college
    when: July 19
    date: '1967-07-19'
    thread: electoral-college
    c: 'Election hearings: Scammon.'
    n: '*Election of the President* hearings, [579](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=589). See [[cal.1967-07-12.electoral-college]]. Names: Scammon.'
    tags: [name:scammon-richard-m]
  - id: cal.1967-07-19.middle-east
    when: July 19–20
    date: '1967-07-19'
    thread: middle-east-six-day-war-aftermath
    also: [soviet-union]
    c: 'Goldberg with Gromyko and Dobrynin: a joint formula, withdrawal "without delay" and an end to claims inconsistent with the existence of independent states. The Arab delegations will not take it.'
    n: 'FRUS 1964–68, XIX, docs. [377](https://history.state.gov/historicaldocuments/frus1964-68v19/d377), [380](https://history.state.gov/historicaldocuments/frus1964-68v19/d380). See [[cal.1967-07-04.middle-east]]. Names: Goldberg, Gromyko, Dobrynin.'
    tags: [name:goldberg-arthur-j, name:gromyko-andrei, name:dobrynin-anatoly]
  - id: cal.1967-07-20.cities-and-housing
    when: July 20
    date: '1967-07-20'
    thread: cities-and-housing
    also: [poverty]
    c: 'The House refuses the rule for H.R. 11000, the Rat Extermination Act, [176–207](https://voteview.com/rollcall/RH0900097): grants to cities for rat control, $20 million a year asked. Christian reads Johnson''s statement: "a cruel blow to the poor children of America."'
    n: '[Statement by the President on the Failure of the House To Act on the Rat Extermination Act](https://www.presidency.ucsb.edu/documents/statement-the-president-the-failure-the-house-act-the-rat-extermination-act) (July 20, 1967). [[w.califano-triumph-and-tragedy-of]]; [[w.dallek-flawed-giant]]. Names: Christian, Johnson.'
    tags: [name:christian-george, name:johnson-lyndon-b]
  - id: cal.1967-07-20.black-nationalism
    when: July 20–23
    date: '1967-07-20'
    thread: black-nationalism
    also: [civil-rights-organizations]
    c: 'Newark, three days after the Guard''s withdrawal: the National Conference on Black Power, more than a thousand delegates (Check the count). Resolutions for black economic and political power and self-defense (Check the terms).'
    n: '[[w.joseph-waiting-til-the-midnight]]; [[w.woodard-nation-within-a-nation]]; [[w.mumford-newark]].'
    tags: [state:nj, city:newark]
  - id: cal.1967-07-20.electoral-college
    when: July 20
    date: '1967-07-20'
    thread: electoral-college
    c: 'Election hearings: Morton.'
    n: '*Election of the President* hearings, [613](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=623). See [[cal.1967-07-12.electoral-college]]. Names: Morton.'
    tags: [name:morton-thruston-b]
  - id: cal.1967-07-21.vietnam
    when: July 21–26
    date: '1967-07-21'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Herbert Marcovich, a French biologist known to Kissinger, met at the Pugwash conference in Paris in June, and Raymond Aubrac, an official of the FAO known to Hồ Chí Minh and Phạm Văn Đồng, in Hanoi, Kissinger having briefed them on the American position. July 24, Phạm Văn Đồng: "We want an unconditional end to the bombing and if that happens, there will be no further obstacle to negotiations"; a de facto halt enough; some American troops might stay until a political settlement. They see Hồ Chí Minh once. Back in Paris July 28.'
    n: 'FRUS 1964–68, V, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v05/d263) (editorial note). Made public: [[w.herring-secret-diplomacy-of-the]], 717–725 (1983); FRUS 1964–68, V (2002). [[w.isaacson-kissinger]]; [[w.ferguson-kissinger-1923-1968]]; [[w.gibbons-u-s-government-and]], IV. Names: Marcovich, Kissinger, Aubrac, Hồ Chí Minh, Phạm Văn Đồng.'
    tags: [name:marcovich-hebert, name:aubrac-raymond, name:kissinger-henry-a, name:ho-chi-minh, name:pham-van-dong, place:hanoi]
  - id: cal.1967-07-21.middle-east
    when: July 21
    date: '1967-07-21'
    thread: middle-east-six-day-war-aftermath
    c: 'The General Assembly''s emergency session adjourns, its records sent to the Security Council (Check).'
    n: 'FRUS 1964–68, XIX, doc. [384](https://history.state.gov/historicaldocuments/frus1964-68v19/d384). See [[cal.1967-07-04.middle-east]].'
  - id: cal.1967-07-22.vietnam
    when: July 22
    date: '1967-07-22'
    thread: vietnam
    c: 'Clifford and Taylor leave, to Aug. 5: South Vietnam, Thailand, Australia, New Zealand, Korea; not the Philippines.'
    n: 'FRUS 1964–68, V, doc. [253](https://history.state.gov/historicaldocuments/frus1964-68v05/d253). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1194) (July 31, 1967), items 9, 12. See [[cal.1967-07-14.vietnam]]. Names: Clifford, Taylor.'
    tags: [name:clifford-clark, name:taylor-maxwell]
  - id: cal.1967-07-23.civil-disorders
    when: July 23
    date: '1967-07-23'
    thread: civil-disorders-detroit
    also: [states-and-cities, elections-1968]
    c: 'Detroit. A police raid on an after-hours club at 12th Street and Clairmount, early in the morning, sets off five days of rioting; Romney calls out the Michigan National Guard. Forty-three dead, more than 7,200 arrested.'
    n: '[[w.report-of-the-national]]; [[w.fine-violence-in-the-model]]; [[w.locke-detroit-riot-of-1967]]; [[w.hersey-algiers-motel-incident]]; [[w.sugrue-origins-of-the-urban]]; [[w.thompson-whose-detroit]]; [[w.mclaughlin-long-hot-summer-of]]. Check: the governor''s proclamation. Names: Romney.'
    tags: [name:romney-george-w, state:mi, city:detroit]
  - id: cal.1967-07-23.opinion
    when: July 23
    date: '1967-07-23'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, July 14–16: serious racial trouble in this community in the next six months, those in cities of a million and more: likely 14 percent, not likely 78. How Negroes are treated in this community: whites, the same as whites 76, not very well 15, badly 1; Negroes, 44, 44 and 9.'
    n: '[[w.gallup-poll]], III, 2072.'
  - id: cal.1967-07-24.civil-disorders-detroit
    when: July 24
    date: '1967-07-24'
    thread: civil-disorders-detroit
    also: [states-and-cities, elections-1968]
    c: 'Detroit. 10:46 a.m., Romney, joined by Cavanagh, asks for federal troops. Johnson sends paratroopers to Selfridge Air Force Base, Mich., and Vance to Detroit. That night, on Vance''s and Throckmorton''s report, the proclamation and Executive Order 11364; Johnson on television before midnight: "law and order have broken down in Detroit, Michigan."'
    n: '[Telegram in Reply to Governor Romney''s Request for Federal Troop Assistance in Detroit](https://www.presidency.ucsb.edu/documents/telegram-reply-governor-romneys-request-for-federal-troop-assistance-detroit) (July 24, 1967); [Remarks to the Nation After Authorizing the Use of Federal Troops in Detroit](https://www.presidency.ucsb.edu/documents/remarks-the-nation-after-authorizing-the-use-federal-troops-detroit) (July 24, 1967); Exec. Order No. 11364, [32 Fed. Reg. 10907](https://www.govinfo.gov/app/details/FR-1967-07-26). [Johnson and Ramsey Clark](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ramsey-clark-july-24-1967), July 24, Conversation WH6707-01-12004 (Miller Center). See [[cal.1967-07-23.civil-disorders]]. Names: Romney, Cavanagh, Vance, Throckmorton, Johnson.'
    tags: [name:romney-george-w, name:cavanagh-jerome-p, name:vance-cyrus, name:throckmorton-john-l, name:johnson-lyndon-b, name:clark-ramsey, state:mi, city:detroit]
  - id: cal.1967-07-24.civil-disorders
    when: July 24–26
    date: '1967-07-24'
    thread: civil-disorders
    also: [civil-rights-organizations, states-and-cities]
    c: 'Cambridge, Md. H. Rap Brown, SNCC''s chairman, to a crowd of several hundred, night of July 24: "If America don''t come around, we''re going to burn America down" (Check the words). Shots; Brown grazed by a pellet; fire burns the Pine Street school and blocks of the Second Ward (Check). Maryland charges him with inciting to riot; a federal warrant for flight to avoid prosecution; arrested July 26 at Washington National Airport (Check), freed on bail. Agnew: "I hope they pick him up soon, put him away and throw away the key" (Check the words).'
    n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005 (Miller Center). [[w.levy-civil-war-on-race]]; [[w.carson-in-struggle]]; [[w.witcover-white-knight]]; [[w.joseph-waiting-til-the-midnight]]. Names: Brown, Agnew.'
    tags: [name:brown-h-rap, name:agnew-spiro-t, name:hoover-j-edgar, state:md]
  - id: cal.1967-07-25.civil-disorders-detroit
    when: July 25–26
    date: '1967-07-25'
    thread: civil-disorders-detroit
    also: [states-and-cities]
    c: 'Detroit. Three young Negro men killed at the Algiers Motel, the night of July 25–26.'
    n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005; [Johnson and Dirksen, 3:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-july-26-1967), July 26, Conversations WH6707-01-12007, [12008](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-july-26-1967-0) (Miller Center). See [[cal.1967-07-23.civil-disorders]]. Check: the tapes'' subjects.'
    tags: [name:hoover-j-edgar, name:dirksen-everett, name:johnson-lyndon-b, state:mi, city:detroit]
  - id: cal.1967-07-26.civil-rights-organizations
    when: July 26
    date: '1967-07-26'
    thread: civil-rights-organizations
    also: [civil-disorders, king]
    c: 'King, Randolph, Wilkins and Young, a joint statement on the riots: the killing, arson and looting criminal and to be dealt with so; the riots harmful to Negroes; Congress to act on jobs and housing (Check the terms and the date).'
    n: '[Johnson and Hoover, 10:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-july-25-1967), July 25, Conversation WH6707-01-12005 (Miller Center). [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. Names: Martin Luther King, Randolph, Wilkins, Young.'
    tags: [name:king-martin-luther-jr, name:randolph-a-philip, name:wilkins-roy, name:young-whitney-m-jr]
  - id: cal.1967-07-26.amendments
    when: July 26
    date: '1967-07-26'
    thread: amendments
    also: [states-and-cities]
    c: 'Ramsey Clark to House Judiciary for the District''s representation in Congress: "What perfect irony that our great democracy denies representation in the Congress to citizens resident in its Capital City." One Representative sure; what more Congress gives, Congress may take away.'
    n: '*D.C. Representation in Congress: Hearings on H.J. Res. 396 before the House Committee on the Judiciary*, 90th Cong., 1st sess., [93–94](https://www.govinfo.gov/content/pkg/CHRG-90hhrg83040/pdf/CHRG-90hhrg83040.pdf#page=97) (1967). See [[cal.1967-07-19.amendments]]. Names: Clark.'
    tags: [name:clark-ramsey, state:dc, city:washington]
  - id: cal.1967-07-27.civil-disorders
    when: July 27
    date: '1967-07-27'
    thread: civil-disorders-kerner
    c: 'Johnson''s address on civil disorders, 10:30 p.m. "We have endured a week such as no nation should live through." A National Advisory Commission on Civil Disorders: Kerner chairman, Lindsay vice chairman; Fred Harris and Brooke of the Senate, Corman and McCulloch of the House; Abel of the Steelworkers, Thornton of Litton Industries, Wilkins of the NAACP, Peden of Kentucky''s Commerce Department, Jenkins, Atlanta''s chief of police. The looting and arson "not part of the civil rights protest"; new riot-control training for the National Guard; the FBI to look for evidence of conspiracy; the House''s defeat of the rat bill and the cut in model cities funds named. A day of prayer, July 30.'
    n: '[The President''s Address to the Nation on Civil Disorders](https://www.presidency.ucsb.edu/documents/the-presidents-address-the-nation-civil-disorders) (July 27, 1967). [Johnson and Lindsay, 5:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-lindsay-july-27-1967), July 27, Conversation WH6707-01-12009 (Miller Center). [[w.report-of-the-national]]; [[w.gillon-separate-and-unequal]]; [[w.barnhart-kerner]]; [[w.harris-potomac-fever]]; [[w.cannato-ungovernable-city]]; [[w.flamm-law-and-order]]; [[w.califano-triumph-and-tragedy-of]]; [[w.mclaughlin-long-hot-summer-of]]. Names: Kerner, Lindsay, Harris, Brooke, Corman, McCulloch, Abel, Thornton, Wilkins, Peden, Jenkins, Johnson.'
    tags: [name:johnson-lyndon-b, name:kerner-otto, name:lindsay-john-v, name:harris-fred-r, name:brooke-edward-w, name:corman-james-c, name:mcculloch-william-m, name:abel-i-w, name:thornton-charles-b, name:wilkins-roy, name:peden-katherine-graham, name:jenkins-herbert, name:hoover-j-edgar]
  - id: cal.1967-07-27.civil-disorders-detroit
    when: July 27
    date: '1967-07-27'
    thread: civil-disorders-detroit
    also: [states-and-cities]
    c: 'Detroit. Food and medical aid ordered.'
    n: '[Telegram to Governor Romney and Mayor Cavanagh in Reply to Their Request for Disaster Relief Assistance in Detroit](https://www.presidency.ucsb.edu/documents/telegram-governor-romney-and-mayor-cavanagh-reply-their-request-for-disaster-relief) (July 27, 1967). See [[cal.1967-07-23.civil-disorders]]. Names: Romney, Cavanagh, Johnson.'
    tags: [name:romney-george-w, name:cavanagh-jerome-p, name:johnson-lyndon-b, state:mi, city:detroit]
  - id: cal.1967-07-28.crime-and-hijacking-ca
    when: July 28
    date: '1967-07-28'
    thread: crime-and-hijacking
    also: [black-nationalism]
    c: 'Reagan signs the Mulford Act, [Cal. Stats. 1967, ch. 960](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol2.PDF#page=604), an urgency statute: a loaded firearm carried in a public place or street of a city a misdemeanor; none on the Capitol''s grounds or at the residences of the governor and the legislators.'
    n: 'Statute, 2459–2462. Passed the Senate, 29–7, and the Assembly, 62–9 (Check against the *Journals*). See [[cal.1967-05-02.black-nationalism-oakland]]. Names: Reagan, Mulford.'
    tags: [state:ca, name:reagan-ronald, name:mulford-don]
  - id: cal.1967-07-29.civil-disorders-kerner
    when: July 29
    date: '1967-07-29'
    thread: civil-disorders-kerner
    c: 'The Kerner Commission''s first meeting; Executive Order 11365: what happened, why, what can be done.'
    n: '[Remarks Upon Signing Order Establishing the National Advisory Commission on Civil Disorders](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-order-establishing-the-national-advisory-commission-civil-disorders) (July 29, 1967); Exec. Order No. 11365, [32 Fed. Reg. 11111](https://www.govinfo.gov/app/details/FR-1967-08-01). See [[cal.1967-07-27.civil-disorders]]. Names: Kerner, Johnson.'
    tags: [name:kerner-otto, name:johnson-lyndon-b]
  - id: cal.1967-07-29.congo
    when: July 29
    date: '1967-07-29'
    thread: congo
    c: 'Eighteen Republican Senators, Hickenlooper and Dirksen among them, protest the C-130s in a letter to Johnson. Rusk to McBride: the second C-130 to leave early in the week; Belgium and other Europeans asked to carry more of the burden. Schramme''s mercenaries hold Bukavu.'
    n: 'FRUS 1964–68, XXIII, doc. [530](https://history.state.gov/historicaldocuments/frus1964-68v23/d530). Made public: FRUS 1964–68, XXIII (2013). See [[cal.1967-07-05.congo]]. Names: Hickenlooper, Dirksen, Johnson, Rusk, McBride, Schramme.'
    tags: [name:hickenlooper-bourke-b, name:dirksen-everett, name:johnson-lyndon-b, name:rusk-dean, name:mcbride-robert-h, name:schramme-jean]
  - id: cal.1967-07-29.state-and-city-finance-ca
    when: July 29
    date: '1967-07-29'
    thread: state-and-city-finance
    c: 'Reagan signs the tax bill, S.B. 556, [Cal. Stats. 1967, ch. 963](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1967/67Vol2.PDF#page=616): the State''s sales tax from 3 to 4 percent, Aug. 1; the personal income tax rates from 1 to 10 percent, the top over $14,000 of taxable income; other taxes raised. An urgency statute.'
    n: 'Statute, 2471, 2479. Check: the yield (about $940 million in Cannon). [[w.cannon-governor-reagan]]; [[w.groot-selling-ronald-reagan]]. See [[cal.1967-01-05.governors-ca]]. Names: Reagan.'
    tags: [state:ca, name:reagan-ronald]
  - id: cal.1967-07-30.civil-disorders
    when: July 30–Aug. 3
    date: '1967-07-30'
    thread: civil-disorders
    also: [states-and-cities]
    c: Milwaukee. Shooting, looting and fires on the North Side from the night of July 30. Maier declares an emergency and a curfew on the whole city, around the clock; Knowles sends the National Guard. Four dead (Check the count and the days).
    n: '[[w.report-of-the-national]]; [[w.jones-selma-of-the-north]]. Names: Maier, Knowles.'
    tags: [name:maier-henry-w, name:knowles-warren-p, state:wi, city:milwaukee]
  - id: cal.1967-07-30.opinion
    when: July 30
    date: '1967-07-30'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, July 13–18: Johnson''s handling of Vietnam: approve 33 percent, disapprove 52. The United States made a mistake in sending troops: yes 41, no 48. Losing ground 10, standing still 46, making progress 34. 100,000 more troops beside the 465,000 there: favor 40, oppose 49.'
    n: '[[w.gallup-poll]], III, 2074. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-07-31.vietnam
    when: July 31
    date: '1967-07-31'
    thread: vietnam-commitments
    also: [congress]
    c: 'Fulbright introduces S. Res. 151: a national commitment to a foreign power to follow only from action by both the executive and the legislative branches (Check the terms).'
    n: 'FRUS 1964–68, V, doc. [262](https://history.state.gov/historicaldocuments/frus1964-68v05/d262). [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.gibbons-u-s-government-and]], IV; [[w.ely-war-and-responsibility]]. Check: the Record''s page. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1967-07-31.civil-disorders-kerner
    when: July 31
    date: '1967-07-31'
    thread: civil-disorders-kerner
    c: 'Ginsburg the Kerner Commission''s executive director.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1194) (July 31, 1967), item 1. See [[cal.1967-07-27.civil-disorders]]. Names: Ginsburg, Johnson.'
    tags: [name:ginsburg-david, name:johnson-lyndon-b]
  - id: cal.1967-07.states-and-cities-nyc
    when: July–Sept.
    date: 1967-07
    thread: states-and-cities
    c: 'New York City. Three demonstration districts for community control of the schools, with Ford Foundation money: Ocean Hill–Brownsville in Brooklyn, Intermediate School 201 in Harlem, Two Bridges on the Lower East Side. Ocean Hill''s governing board of parents and members of the community elected in August; Rhody McCoy, an acting principal, its unit administrator. Check the dates.'
    n: 'Check: the Board of Education''s resolution. [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.cannato-ungovernable-city]]; [[w.kahlenberg-tough-liberal]]. Names: McCoy.'
    tags: [state:ny, city:nyc, name:mccoy-rhody-a]
