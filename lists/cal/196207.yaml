  - id: cal.1962-07-01.economy-debt-limit
    when: July 1
    date: '1962-07-01'
    thread: economy-debt-limit
    c: 'The debt limit to $308 billion signed, [76 Stat. 124](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg124-2.pdf): $308 billion to Mar. 31, 1963, $305 billion to June 24, $300 billion to June 30.'
    n: Statute (K–J Cong. II.J.2). See [[cal.1962-06-14.economy-debt-limit]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-01.berlin-and-vienna
    when: July 1
    date: '1962-07-01'
    thread: berlin-and-vienna
    also: [soviet-union, missile-crisis]
    c: 'The Presidium, Mikoyan absent, before Raúl Castro''s visit. Khrushchev renews the push on West Berlin: on a peace treaty the Western garrisons halved, under the UN flag; in two years replaced by non-Western UN troops; in six, all out; "An international organ is unacceptable"; even by "aggravating things." Against McNamara''s Ann Arbor speech: "Not targeting cities—how aggressive! . . . To get the population used to the idea that nuclear war will take place." The UN to take up Germany in a crisis once the missiles are in Cuba in November. The Soviet–Cuban defense agreement approved; Anadyr shipped by Nov. 1.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 440–43; [[w.prezidium-tsk-kpss-1954]], I, 569–70 (Protocol 39). Check: the protocol (I, 569) lists Mikoyan present; it has nothing of the UN taking up Germany once the missiles are in Cuba. To check: Protocol 39, July 1, 1962, [[w.prezidium-tsk-kpss-1954]], I (cited by [[w.fursenko-khrushchevs-cold-war]], 441 nn.6–9, 442 n.12). See [[cal.1962-06-10.missile-crisis]]. Names: Mikoyan, Khrushchev, McNamara, Raúl Castro.'
    src:
      c: f23606d8
      rows:
        - 'w.fursenko-khrushchevs-cold-war 440–43: all'
        - 'via w.fursenko-khrushchevs-cold-war 441 n.6: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 442 n.12: C'
        - 'w.prezidium-tsk-kpss-1954 I, 569–70: B-G, I-J'
        - 'via x.1962-07-01.presidium-protocol-39: B-G, I-J'
    tags: [name:mikoyan-anastas, name:khrushchev-nikita-s, name:mcnamara-robert-s, name:castro-raul]
