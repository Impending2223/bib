  - id: cal.1962-07-01.berlin-and-vienna
    when: July 1
    date: '1962-07-01'
    place: ogarevo
    thread: berlin-and-vienna
    also: [soviet-union, missile-crisis, defense]
    part_of: cal.1962-07-01.soviet-union-leadership-2
    c: 'The Presidium, Mikoyan absent, before Raúl Castro''s visit.{1} Khrushchev renews the push on West Berlin: on a peace treaty the Western garrisons halved, under the UN flag;{2} in two years replaced by non-Western UN troops;{3} in six, all out; "An international organ is unacceptable"; even by "aggravating things."{4} Against McNamara''s Ann Arbor speech: "Not targeting cities—how aggressive! . . . To get the population used to the idea that nuclear war will take place."{5} The UN to take up Germany in a crisis once the missiles are in Cuba in November.{6} The Soviet–Cuban defense agreement approved; Anadyr shipped by Nov. 1.{7}'
    n: '[[w.fursenko-khrushchevs-cold-war]], 440–43; [[w.prezidium-tsk-kpss-1954]], I, 569–70 (Protocol 39); [[w.prezidium-tsk-kpss-1954]], III, 284–85 (P 39/II and III: Khrushchev''s view on further proposals on Berlin agreed; the proposals for the talks with the Cubans approved; not their terms); [[w.poole-joint-chiefs-of-staff]], 31–32 (Khrushchev on McNamara''s Ann Arbor speech; see [[cal.1962-06-16.defense]]). Check: the protocol (I, 569) lists Mikoyan present; it has nothing of the UN taking up Germany once the missiles are in Cuba. Check: the protocol (I, 569) lists Mikoyan among those present at the session of July 1; "Mikoyan absent" is Fursenko and Naftali''s (441). The protocol has the Western troops replaced after two years by UN troops, not by non-Western ones. See [[cal.1962-06-10.missile-crisis]]. Names: Mikoyan, Khrushchev, McNamara, Raúl Castro.'
    src:
      c: f23606d8
      rows:
        - 'w.fursenko-khrushchevs-cold-war 440–43: 1, 2, 3, 4, 5, 6, 7'
        - 'via w.fursenko-khrushchevs-cold-war 441 n.6: 1, 2'
        - 'via w.fursenko-khrushchevs-cold-war 442 n.12: 3'
