    c: 'Mao receives Deng Zihui at his request.{1} Deng urges "responsibility fields" (责任田), citing the Anhui districts of Dangtu and Suxian and a Fuliji district committee report: unified in means of production, plans, labor, distribution and delivery to the collective, not individual farming;{2} the form is a pay-by-output responsibility system with great life, and the peasants will not give it up.{3} Mao says nothing, then as Deng gets up asks for the report to be sent.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 17, 1962; [[w.mao-zedong-zhuan]], V, ch. 70 nn.31, 32 (July 17: Deng Zihui puts the case for household contracting, the five unifications; Mao says later (Sept. 25) he put questions and Deng did not answer; an hour and a half of being lectured). [[w.yang-jisheng-mubei]], I, 335 (July 1962: Deng Zihui sends people to Fuliji 符離集 in Anhui, whose "Investigation report on the responsibility fields of household contracting" praises them and urges they not be beaten to death in a lump); [[w.chen-yun-nianpu-xiuding]], III, 136 (Deng Zihui at Mao''s urges the responsibility fields, in fact a production responsibility system with pay by output; Mao does not state a view). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). To check: [[w.weiyuanhui-deng-zihui-zhuan]], 564 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.31); Mao Zedong 毛泽东, interjection at Dong Biwu''s 董必武 speech at the Tenth Plenum 八届十中全会, Sept. 25, 1962 (record 插话记录), on his talk with Deng Zihui of July 17 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.32). Names: Mao Zedong, Deng Zihui.'
