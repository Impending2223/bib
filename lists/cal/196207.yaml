evolutionary* (New York: PublicAffairs, 2007), 97–98; Huang Zheng, *Wang Guangmei fangtan lu* (Beijing: Zhongyang wenxian chubanshe, 2006), 288, Wang Guangmei''s version (cited by [[w.dikotter-maos-great-famine]], 337 n.5a, n.5b); [[w.wang-guangmei-lishi-yingyou-renmin-lai]], 49 (cited by [[w.jian-zhou-enlai]], 468 n.15); Wang Guangmei 王光美, Liu Yuan 劉源 et al., *Ni suo bu zhidao de Liu Shaoqi* 《你所不知道的劉少奇》 (Henan renmin chubanshe, 2000), 90 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 74 n.80); Liu Yuan, "Mao Zedong wei shenma yao dadao Liu Shaoqi," quoted in Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 97–98 (cited by [[w.dikotter-cultural-revolution]], 17 n.10a); Huang Zheng, *Wang Guangmei fangtan lu* (2006), 288, a version from Liu''s wife (cited by [[w.dikotter-cultural-revolution]], 17 n.10b). Names: Mao Zedong, Liu Shaoqi, Tian Jiaying, Chen Yun, Deng Zihui. Check: the day; the book places it after Liu''s speech of July 18 and gives Huang Zheng as its source.'
