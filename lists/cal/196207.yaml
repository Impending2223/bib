    c: 'Zhou Enlai, agreed with Mao, drafts a telegram from the Central Committee to Chen Yi and the Chinese delegation at Geneva: seize the moment of Nehru''s wish to resume talks;{1} ask to see India''s Defense Minister, Krishna Menon; settle with him the procedure, time, place and level of the officials'' talks. Mao reads and approves it that evening.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 22, 1962 (the entry continues on July 23); [[w.zhou-enlai-nianpu-1949]], II, 490 (July 22–23, 1962: the telegram: the border question a long struggle, in the west an interlocking, long armed coexistence; Chen Yi to see Menon at Geneva and hint that only direct talks of the two sides can settle it; Zhou reports to Mao again at the end of the month); [[w.mao-zedong-zhuan]], V, ch. 70 n.14 (July 23: after consulting Mao, Zhou Enlai drafts for the Center the instruction to Chen Yi and the delegation at Geneva to see Menon, India''s Defense Minister, on resuming talks on the border). [[w.jian-zhou-enlai]], 478 (the telegram of the "highest urgency" to Chen Yi at Geneva, with Mao''s approval: seize Nehru''s interest in talks; see Krishna Menon; settle procedure, timing, place and level). Made public: 1997. To check: Zhou Enlai 周恩来, instruction drafted for the Center 中共中央 to Chen Yi 陈毅 and the delegation on continuing the talks with Menon 梅农 on the Sino-Indian boundary (manuscript 手稿), July 23, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.14); [[w.li-lianqing-da-waijiaojia-zhou-enlai]], IV, 316 (cited by [[w.jian-zhou-enlai]], 478 n.62c). See [[cal.1962-07-22.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Chen Yi, Nehru, Krishna Menon.'
    tags: [polity:prc, polity:india, name:mao-zedong, name:zhou-enlai, name:chen-yi, name:nehru-jawaharlal, vis:only:prc, name:menon-v-k-krishna]
