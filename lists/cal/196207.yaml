  - id: cal.1962-07-08.china
    when: July 8
    date: '1962-07-08'
    thread: china
    also: [south-asia]
    c: The Foreign Ministry sends a note to the Indian embassy, the first of five (July 8, 10, 13, 16 and 22) in a stretch of days. They protest Indian troops' setting up military posts in Xinjiang and Tibet, cutting off the retreat of a Chinese post, and attacking and deliberately provoking Chinese border personnel. China very much does not want any unfortunate incident on the boundary and has long shown the greatest forbearance. If India takes that restraint for weakness and persists in trying to take territory by force, it plays with fire and makes a grave mistake. If it forces an armed clash, China will defend itself, and India bears all the responsibility.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 234–235 (July 8, 1962); [[w.jian-zhou-enlai]], 476 (July 8: the protest drafted under Zhou''s guidance; China will not give up self-defense). Check: the book gives the five notes as one item with one text, not each note''s own words. To check: [[w.zhonghua-renmin-gongheguo-duiwai]], IX, 61 (cited by [[w.jian-zhou-enlai]], 476 n.51).'
