  - id: cal.1962-07-28.china-leadership
    when: July 28
    date: '1962-07-28'
    place: beidaihe
    thread: china-leadership
    also: [soviet-union]
    c: 'Beidaihe, Building 95.{1} Mao with the Standing Committee, the regional bureaus'' first secretaries, Peng Zhen, Chen Boda, Luo Ruiqing and Wang Renzhong.{2} The problem in the world and at home the same: whether the revolution is led by the proletariat or the bourgeoisie, dictatorship of the one or the other;{3} the national bourgeoisie two-sided, two hands needed; Khrushchev takes them for socialists and wants "peaceful transition";{4} "unique line" is right, and not unique we cannot be; right-leaning signs also in foreign affairs.{5} When Zhou Enlai raises city work, production, prices, workers'' living: do it now, a committee, Zhou to command.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 28, 1962; [[w.zhou-enlai-nianpu-1949]], II, 492 (July 28, 1962: Zhou Enlai at the Beidaihe conference from July 28 to Aug. 24); [[w.deng-xiaoping-nianpu-1904]], III, 1718–1719 (July 28, 1962; 1 p.m.; Deng at Mao''s enlarged Standing Committee: the common question at home and abroad, which class leads the revolution; the venting after January freed thought, but also brought output by household, some right thinking, some "ox-demons and snake-spirits"); [[w.mao-zedong-zhuan]], V, ch. 70 n.38 (July 28, afternoon, Beidaihe, Building 95: Mao with the Standing Committee and the bureaus'' first secretaries: whether the revolution is led by the proletariat or the bourgeoisie; Khrushchev says "unique line", we cannot but be unique; right-leaning signs in foreign affairs, and the Moscow peace congress''s low line to be explained to the other parties; household contracting both right and "ghosts", are the three north regions steady?). [[w.jian-zhou-enlai]], 468–469 (Beidaihe, late July: Mao on whether the revolution is led by the proletariat or the bourgeoisie, a common issue at home and abroad; a struggle for a hundred years and more); [[w.peng-zhen-nianpu-1902]], IV, 208 (July 28, 1962, afternoon; Peng Zhen at the meeting Mao chairs, of the Standing Committee, the regional bureaus'' first secretaries, Wang Renzhong, Chen Boda, Luo Ruiqing and others; Mao: the common question at home and abroad, whether the proletariat or the bourgeoisie leads; after the Seven Thousand, signs of the right in the Party, "output by household" among them, some sound, some "牛鬼蛇神"; signs of the right in foreign work too). Made public: 1997. To check: Mao Zedong 毛泽东, interjections at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议, Beidaihe, July 28, 1962 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.38); [[w.xianzhi-mao-zedong-zhuan-1949]], 1235 (cited by [[w.jian-zhou-enlai]], 469 n.18a). Names: Mao Zedong, Zhou Enlai, Peng Zhen, Chen Boda, Luo Ruiqing, Khrushchev, Wang Renzhong.'
