  - id: cal.1962-07-24.georgia-albany
    when: July 24
    date: '1962-07-24'
    thread: georgia-albany
    c: Tuttle vacates Elliott's order. That night in Albany, rocks and bottles.
    n: 'Check: the order''s record. See [[cal.1961-11-17.albany]]. Names: Tuttle, Elliott.'
    tags: [name:tuttle-elbert-p, name:elliott-j-robert]
