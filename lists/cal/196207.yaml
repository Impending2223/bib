    c: 'Honolulu.{1} McNamara orders plans for the advisers'' withdrawal by the end of 1965.{2} Harkins: "There is no doubt we are on the winning side"; the Viet Cong''s military potential will be gone a year after the South''s forces are fully operational; some 16,000 advisers.{3} His goal, South Vietnamese forces able to do without American support within three years; military assistance, $101.4 million in fiscal 1961, $177 million in 1962 and $179.4 million in 1963, to be cut early.{4}'
