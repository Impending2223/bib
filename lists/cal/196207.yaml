  - id: cal.1962-07-31.governors-ar
    when: July 31
    date: '1962-07-31'
    thread: governors
    also: [elections-1962]
    c: 'Arkansas, Democratic primary for governor: Faubus 208,996, 51.6 percent, a fifth nomination without a runoff; McMath, governor 1949–53, 83,473, 20.6; Dale Alford, a U.S. Representative, 82,815, 20.4; three others.'
    n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 412](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). To check: [[w.reed-faubus]]. Names: Faubus, McMath, Alford.'
