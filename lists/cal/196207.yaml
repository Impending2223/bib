    c: 'Dawn. Gardner at the jail desk with $356: "Here''s Martin Luther King''s fine. Turn him out."{1} The receipt made out to King and Abernathy.{2} At 7:30 a.m. Pritchett tells them their fines are paid, by "an unidentified, well-dressed Negro male"; they must go.{3}'
