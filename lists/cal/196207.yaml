  - id: cal.1962-07-06.economy-gold
    when: July 6
    date: '1962-07-06'
    place: washington
    thread: economy-gold
    c: 'Kaysen to Kennedy, "Gold," with the papers of the past two weeks: Louchheim''s plan for agreed ratios of gold to reserves, the 25 percent cover to go; Tobin and Roosa on it, Dillon added. Tobin: practical, and needed soon; Roosa doubts it. The Treasury sure it has the situation in hand; the Council for a fundamental change in the payments mechanism.{1} Among the papers, by Gavin''s account, an essay of Keynes''s on a payments system without gold.{2} Roosa had not answered Kennedy on Saager''s idea of raising the price of gold in all currencies: it creates "something of the same problems for us that devaluation would create."{3}'
    n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v09/d56). [[w.gavin-gold-dollars-and-power]], 81 & n.76 (the essay of Keynes''s). Made public: FRUS 1961–63, IX (1995). See [[cal.1962-05-29.economy]]. Names: Kaysen, Kennedy, Tobin, Roosa, Dillon.'
