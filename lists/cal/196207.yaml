    when: July 25
    date: '1962-07-25'
    thread: georgia-albany
    also: [king]
    c: King calls a day of penance for the violence at Albany.
    n: 'King and Anderson, [Statement on violence in Albany, Ga. and declaration of day of penance](https://okra.stanford.edu/link/document620725-001), July 25, 1962 (King Papers Project). King''s press conference that day, from WSB-TV''s film, printed as "Press Conference Denouncing Violence in Albany," [[w.papers-of-martin-luther-vii]], 553 ([King Institute](https://kinginstitute.stanford.edu/king-papers/documents/press-conference-denouncing-violence-albany)). See [[cal.1961-11-17.albany]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr, name:anderson-william-g]
  - id: cal.1962-07-25.program
    when: July 25
    date: '1962-07-25'
    thread: welfare
    c: Public Welfare Amendments signed, [76 Stat. 172](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg172.pdf). Services and rehabilitation for families on relief. Ribicoff out of HEW to run for the Senate; Celebrezze in.
    n: 'To check: [[w.davies-from-opportunity-to-entitlement]]. Names: Ribicoff, Celebrezze.'
    tags: [name:ribicoff-abraham, name:celebrezze-anthony-j, name:kennedy-john-f]
  - id: cal.1962-07-27.albany
    when: July 27
    date: '1962-07-27'
    thread: georgia-albany
    also: [king]
    c: King arrested at a City Hall prayer vigil.
    n: 'Hoover, [Memo to Robert F. Kennedy regarding the racial situation in Albany, Ga.](https://okra.stanford.edu/link/document620728-004), July 28, 1962 (King Papers Project). See [[cal.1961-11-17.albany]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-07-31.transition-and-staff
    when: July 31
    date: '1962-07-31'
    thread: transition-and-staff
    also: [mayors]
    c: Celebrezze sworn in as Secretary of HEW. Locher, Cleveland's law director, mayor.
    n: 'Remarks at the Swearing In of Anthony J. Celebrezze as Secretary of Health, Education, and Welfare, [1962 Pub. Papers 587](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=647) (July 31, 1962). See [[cal.1962-07-14.transition-and-staff-cleveland]]. Names: Celebrezze, Locher.'
    tags: [state:oh, city:cleveland, name:kennedy-john-f, name:celebrezze-anthony-j, name:locher-ralph-s]
