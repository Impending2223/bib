  - id: cal.1962-07-07.china-leadership-4
    when: July 7
    date: '1962-07-07'
    thread: china-leadership
    c: 'Morning.{1} Deng Xiaoping, to the Communist Youth League''s Central Committee, advocates letting a hundred schools contend to find the best form of rural organization, each to express his opinion.{2} He repeats his black cat and white cat saying: the peasants should adopt whatever system they want, and if it is not legal it should be made legal.{3}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 268; [[w.yang-shangkun-riji]], II, 192 (July 7, 1962; 9 a.m. to noon, Deng receives the whole of the Youth League Central Committee''s seventh plenum (its third), photographs, speaks); [[w.deng-xiaoping-nianpu-1904]], III, 1713–1714 (July 7, 1962; morning; Deng receives all those at the Youth League''s Third Central Committee''s Seventh Plenum and speaks: politically a fine situation; the economy not good, its recovery resting on farming; the peasants'' zeal through the relations of production; whatever form restores output most easily and fast, and the masses want, to be used, the illegal made legal, "yellow cat or black cat, a cat that catches mice is a good cat"; a step back to go forward; industry to serve farming and meet food, clothing and use; the League''s own system, staff not to be touched by others, its right to criticize the Party. The part on the situation printed in *Deng Xiaoping wenxuan*, vol. 1, as "How to restore agricultural production"); [[w.mao-zedong-zhuan]], V, ch. 70 n.26 (July 7: Deng Xiaoping to those attending the Youth League''s plenum: consolidating the collective economy is the basic direction, but many forms are to be admitted, and those that have household contracting made lawful; the Center to take it up at the August meeting). [[w.yang-jisheng-mubei]], II, 1125 n.28 (July 7: Deng Xiaoping to the delegates of the Youth League''s plenum, "how to restore agriculture": he favors making household contracting legal, and repeats Liu Bocheng''s Sichuan saying of the yellow cat and the black cat). Made public: [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 305 (1989; sold through Xinhua, by its catalogue record, CiNii NCID BN1283573X). Circulated in China: Deng Xiaoping, speech to the Communist Youth League Central Committee, July 7, 1962, in [[w.ziliaozu-fan-geming-xiuzhengzhuyi-fenzi]], 52–60 (53–4) (a Peking University Red Guard compilation, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.35b). To check: Deng Xiaoping, speech to the Communist Youth League Central Committee, July 7, 1962, in [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 305 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.35a); Deng Xiaoping, speech to the Communist Youth League Central Committee, July 7, 1962, in [[w.ziliaozu-fan-geming-xiuzhengzhuyi-fenzi]], 52–60 (53–4) (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.35b); Deng Xiaoping, "How to restore agricultural production" 《怎样恢复农业生产》, the part of this speech on the situation at home, in [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (the nianpu''s vol. 1; cited by [[w.deng-xiaoping-nianpu-1904]], III, 1714); Deng Xiaoping 邓小平, talk with those attending the Seventh Plenum of the Third Central Committee of the Communist Youth League 共青团三届七中全会, July 7, 1962; [[w.xiaoping-deng-xiaoping-wenxuan-1938]] (the note cites vol. 1 of the 2d ed., Oct. 1994, 322–327) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.26). Names: Deng Xiaoping. Check: Deng attributes the saying to Liu Bocheng, who claimed it as Sichuanese; the book finds it possible Deng misremembered ([[w.xiaoping-deng-xiaoping-wenxuan-1938]], 305).'
