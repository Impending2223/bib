  - id: cal.1962-07-18.china-leadership-2
    when: July 18
    date: '1962-07-18'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi receives the bureau chiefs and higher cadres of the Central Committee''s departments and the state organs who are being sent down to the main grain-producing areas, and gives them five tasks: strengthen the prefectural, county and basic-level leadership;{1} carry out the Center''s correct policy; report conditions as they are; change the incorrect style of some local Party organizations;{2} consolidate the collective economy and develop farm production.{3} Policy is made by the Center, which alone may decide it; a place with special conditions may make its own policy, but it must be decided and approved by the Center. A policy carried out well or ill, wholly or in part, mechanically or by truth from facts, makes a great difference; a market divided into closed districts against the national unified market, as one that bars goods from another district, is not permitted. The talk is in his Selected Works as "Strengthen basic-level leadership and improve the style of work."{4}'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 558 (July 18, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 268 (Liu tells the officials the Central Committee will soon decide on baochan daohu and individual operation; he prefers the Henan responsibility system, major farm work done collectively and odd jobs separately by individuals; he also defends the collective system and calls for struggle against incorrect views and attitudes); [[w.yang-shangkun-riji]], II, 195 (July 18, 1962; afternoon, to the 107 cadres going down: six points, the basic levels'' leadership, the Center''s policies, true reports, bad styles corrected, the collective economy consolidated, the factories run well; Yang Shangkun hears four, then is called away by Mao); [[w.mao-zedong-zhuan]], V, ch. 70 n.29 (July 18: Liu Shaoqi to the cadres sent down: much of the collective economy has begun to shake and may fall apart; the Center is discussing and will lay down policy; in the villages they are to see to consolidating the collective economy). Made public: 1996. Check: the Selected Works text of the talk (the entry''s unit J) is the source for these points ([[w.selected-works-of-liu]], 2, 440–43, cited at III, 268 nn.37–38). To check: Liu Shaoqi, speech of July 18, 1962, to central officials sent to the countryside, in [[w.selected-works-of-liu]], 440–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.37); Liu Shaoqi, speech of July 18, 1962, to central officials sent to the countryside, in [[w.selected-works-of-liu]], 443 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 268 n.38); Liu Shaoqi 刘少奇, talk to the cadres of the central and State organs sent down, July 18, 1962; [[w.shaoqi-liu-shaoqi-xuanji-selected]], 461 (the note prints Dec. 1981 for the second volume) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.29). Names: Liu Shaoqi.'
