    when: July 3
    date: '1962-07-03'
    thread: africa
    c: 'Algeria independent: France recognizes it after the referendum of July 1. Kennedy''s statement.'
    n: Statement by the President on the Occasion of Algerian Independence, [1962 Pub. Papers 536](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=596) (July 3, 1962). See [[cal.1962-03-18.africa]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-03.republican-party
    when: July 3
    date: '1962-07-03'
    thread: republican-party
    also: [goldwater]
    c: 'Eisenhower to Charles S. Jones, by letter, after Goldwater''s attack on the Gettysburg conference: "I am getting awfully sick of him." Goldwater after the nomination, "he has no illusions he could be elected"; "what is really annoying is that he wants to set himself up as the single authority and guiding voice for the Republican Party."'
    n: '[[w.kabaservice-rule-and-ruin]], 59; [[w.goldberg-barry-goldwater]], 165 (Goldwater, fearing Eisenhower would organize a draft for Nixon, rejects Modern Republicanism as "counter to the traditional principles" of the party; Eisenhower''s words, July 1962). To check: Dwight D. Eisenhower to Charles S. Jones, July 3, 1962, Eisenhower Post-Presidential Papers, Eisenhower Library, SNF-10 (cited by [[w.kabaservice-rule-and-ruin]], 59 n.110). Names: Eisenhower, Goldwater.'
    src:
      c: 90ce52ed
      rows:
