    c: 4 p.m., Mao's pool residence.{1} Chen Yun, who had written at 1 p.m. asking for an hour, lays before Mao his view for dividing land among households.{2} Mao, after hearing him, gives no sign; Chen later recalls that he "was very angry" afterward.{3}
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 6, 1962 ("同日"); [[w.macfarquhar-origins-of-the-cultural]], III, 233 (Chen Yun advocates baochan daohu to Mao and other senior colleagues in early July); [[w.macfarquhar-origins-of-the-cultural]], III, 267–68 (Chen Yun''s interview, on the night Mao returned to the capital: the collective and individual economies to coexist for a long period; the individual economy to be stressed); [[w.mao-zedong-zhuan]], V, ch. 70 nn.23, 24 (July 6: Chen Yun writes asking for an hour; that afternoon Mao hears him for dividing the land among households; Chen says later that after the talk Mao was very angry). [[w.jian-zhou-enlai]], 467 (Chen proposes to Mao land redistribution to stimulate output; Mao "extremely upset," no rebuke then); [[w.yang-jisheng-tiandi-fanfu]], I, 74 (afternoon; Mao gives no view; Chen Yun later recalls that Mao was very angry); [[w.chen-yun-nianpu-xiuding]], III, 135 (1 p.m., Chen Yun to Mao, just back that morning: better than when he fell ill, but weak, two or three months more to recover; he has thought of ways to restore farming and would talk with Mao, an hour enough; he can walk to Mao''s. Some had urged him not to hurry; he answered that leading the nation''s economic work he must answer to the Party and the people, and with the way found, how could he lose the moment. 4 p.m., at Mao''s, he proposes redividing the fields to rouse the peasants and restore output; Mao says nothing then). Made public: 2013. Check: the book dates Chen Yun''s letter asking for the interview ''early July''; the Mao chronology has Chen write at 1 p.m. July 6. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.al-zhongguo-gongchan-dang-zhizheng]], 220 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 233 n.97a); [[w.jiefangjun-jiangling-zhuan-2]], 2, 65 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 233 n.97b); Chen Yun 陈云, letter to Mao Zedong (manuscript 手稿), July 6, 1962, asking to see him for about an hour (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.23); Chen Yun 陈云, speech at the Politburo meeting 中共中央政治局会议, Nov. 22, 1982 (record 发言记录): after the talk Mao "was very angry" (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.24); [[w.chen-yun-nianpu-1905]], III, 120 (cited by [[w.jian-zhou-enlai]], 467 n.10b). See [[cal.1962-07-06.china-leadership]]. Names: Mao Zedong, Chen Yun.'
