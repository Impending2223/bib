  - id: cal.1962-07-06.congo
    when: July 6–12
    date: '1962-07-06'
    thread: congo
    c: 'An American military team under Greene in the Congo. Its recommendations: training and modernization under the UN; the army cut to a 14,000-man internal security force, a small air force and river navy; a $2 million grant of vehicles, radios, parts and rations; a small military mission.'
    n: '[[w.poole-joint-chiefs-of-staff]], 260.'
    src:
      c: 7b99bc60
      rows:
        - 'w.poole-joint-chiefs-of-staff 260: all'
  - id: cal.1962-07-06.economy-gold
    when: July 6
    date: '1962-07-06'
    thread: economy-gold
    c: 'Kaysen to Kennedy, "Gold," with the papers of the past two weeks: Louchheim''s plan for agreed ratios of gold to reserves, the 25 percent cover to go; Tobin and Roosa on it, Dillon added. Tobin: practical, and needed soon; Roosa doubts it. The Treasury sure it has the situation in hand; the Council for a fundamental change in the payments mechanism. Among the papers, by Gavin''s account, an essay of Keynes''s on a payments system without gold. Roosa had not answered Kennedy on Saager''s idea of raising the price of gold in all currencies: it creates "something of the same problems for us that devaluation would create."'
    n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v09/d56). [[w.gavin-gold-dollars-and-power]], 81 & n.76 (the essay of Keynes''s). Made public: FRUS 1961–63, IX (1995). See [[cal.1962-05-29.economy]]. Names: Kaysen, Kennedy, Tobin, Roosa, Dillon.'
    src:
      c: 24359e90
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d56: all'
        - 'w.gavin-gold-dollars-and-power 81: G'
        - 'via w.gavin-gold-dollars-and-power 81 n.76: all'
    tags: [name:kaysen-carl, name:kennedy-john-f, name:tobin-james, name:roosa-robert-v, name:dillon-c-douglas]
  - id: cal.1962-07-06.economy-gold-2
    when: July 6
    date: '1962-07-06'
    thread: economy-gold
    c: 'Kennedy to David Rockefeller, answering his letter on the balance of payments: "this country will not—I repeat not—increase the price of gold, thereby devaluating the dollar," nor impose exchange controls or import barriers. The deficit smaller this year; speculation virtually ended.'
    n: 'Letter to David Rockefeller on the Balance of Payments Question, [1962 Pub. Papers 547](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=607) (July 6, 1962). See [[cal.1962-07-06.economy-gold]]. Names: Kennedy, David Rockefeller.'
