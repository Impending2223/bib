  - id: cal.1962-07-02.defense
    when: July 2
    date: '1962-07-02'
    thread: defense
    also: [governors]
    c: 'Hershey, Pa., the Governors'' Conference, at the President''s urging. McNamara on the reserve reorganization: "far from diminishing the role of the reservist, it will give him a new and even more important part"; an hour and a half with the governors'' National Guard committee. July 3, the governors resolve against the plan by voice vote.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 112. Names: McNamara.'
