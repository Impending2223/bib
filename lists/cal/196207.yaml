    also: [south-asia]
    c: 'Midnight.{1} Mao hears Zhou Enlai on the Sino-Indian border: on July 10 Indian troops in the western sector pressed on the Chinese patrol to within fifty yards;{2} on July 11 two Indian helicopters landed reinforcements and hovered low; another detachment moved down the Galwan to set up a new post.{3}'
