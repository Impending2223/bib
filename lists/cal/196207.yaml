    c: 'Robert Kennedy to King by telephone, on Elliott''s order.{1} King feels "impelled" to march;{2} Kennedy: Southern governors and school officials pray for an excuse to defy federal orders.{3} King: "Some of these problems you have created yourself by appointing these segregationist federal judges."{4} Kennedy hands the phone to Burke Marshall, nearly two hours: defiance would put King where the administration means to put Barnett.{5} That night King, through Clarence Jones: he will obey until the lawyers have the order overturned.{6}'
