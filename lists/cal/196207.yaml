  - id: cal.1962-07-08.china-leadership
    when: July 8
    date: '1962-07-08'
    place: peking
    thread: china-leadership
    c: 'Noon, Juxiang Shuwu.{1} Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda and Tian Jiaying: summer harvests in Henan and Shandong are not so bad; asks Liu and others to see the Henan, Shandong and Jiangxi comrades;{2} declares against household contracting, and reproaches Tian for working it up in Peking instead of revising the "Sixty Articles." Proposes a draft decision on consolidating the collective economy and developing farm output for a Central Work Conference; Chen Boda to draft it.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1962; [[w.zhou-enlai-nianpu-1949]], II, 488 (July 8, 1962: Zhou Enlai attends Mao''s meeting); [[w.macfarquhar-origins-of-the-cultural]], III, 267 (after consulting the provincial leaders, Mao calls a staff meeting to which Chen Boda is summoned; he criticizes Tian for advocating baochan daohu instead of working on a revision of the Sixty Articles and, without consulting his Standing Committee colleagues, has Chen draft a central decision to consolidate the collective economy); [[w.deng-xiaoping-nianpu-1904]], III, 1714–1715 (July 8, 1962; Deng at Mao''s meeting: the summer harvests of Henan and Shandong, the situation not so bad; Liu, Zhou and Deng to talk with the Henan and Shandong men; Mao against output by household; Chen Boda to draft the decision on consolidating the communes'' collective economy); [[w.mao-zedong-zhuan]], V, ch. 70 n.28 (July 8 at his residence: Mao with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda and Tian Jiaying: the summer harvests of Henan and Shandong not so bad; Liu and others to hear the Henan, Shandong and Jiangxi men; he opposes household contracting, reproaches Tian for pressing it at Peking and not revising the sixty articles, and has Chen Boda draft the decision on consolidating the communes'' collective economy). [[w.jian-zhou-enlai]], 467–468 (two days later: Mao with Liu, Zhou, Chen Boda and Tian: the harvest in Henan and Shandong not so bad; firm against linking output with households; Tian the "main advocate"); [[w.yang-jisheng-tiandi-fanfu]], I, 74 (the Juxiang Shuwu; Mao against contracting to households and dividing the fields); [[w.chen-yun-nianpu-xiuding]], III, 136 (Mao calls Liu, Zhou, Deng, Chen Boda and Tian Jiaying: the summer harvests of Henan and Shandong, things not so bad; he is against household contracting and proposes a Center decision on strengthening the communes'' collective economy and farm output, for the work conference). Made public: 1997. Check: the book places the staff meeting after Mao''s talks with the provincial leaders of July 9–11 (III, 267); the Mao chronology has it July 8. To check: [[w.bian-mao-zedong-he-tade]], 67–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 267 n.29a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1086 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 267 n.29b); [[w.qingshan-kang-sheng-waizhuan]], 196 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 267 n.29c); Record of Zhou Enlai''s 周恩来 talk with the heads of the Heilongjiang Provincial Committee''s secretariat, June 18, 1963, with Zhou''s desk calendar 周恩来台历, on the meeting of July 8, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.28); [[w.chen-yun-nianpu-1905]], III, 120 (cited by [[w.jian-zhou-enlai]], 468 n.12b); [[w.bian-mao-zedong-he-tade-1996]], 93 (cited by [[w.jian-zhou-enlai]], 468 n.12c). See [[cal.1962-07-06.china-leadership-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda, Tian Jiaying.'
