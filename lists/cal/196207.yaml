  - id: cal.1962-07-06.china-leadership
    when: July 6
    date: '1962-07-06'
    place: peking
    thread: china-leadership
    c: 'Peking, Mao''s pool residence.{1} At Tian Jiaying''s request.{2} Tian: about 30 percent of the peasants over the country already work by household contracting or divided land, and the share is growing;{3} better to lead it than leave it to spontaneity;{4} at the end perhaps 40 percent so, 60 percent collective or semi-collective; a stopgap, to be led back to the collective after recovery. Mao says nothing while he hears him; then asks: "Do you stand for the collective economy or the individual as the chief?" and "is it your own view or others''?"{5} Tian: his own.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 6, 1962; [[w.macfarquhar-origins-of-the-cultural]], III, 266–67 (Tian telephones Hebei, where Mao is at Handan; the message not to hurry shows Mao''s impatience; two days later Mao, back in Peking, summons him. Tian: about 30 percent of the peasants farm under baochan daohu or fentian daohu, perhaps 40 percent; collectivism to follow recovery; Mao hears him out in silence, then asks which he advocates as the main form); [[w.mao-zedong-zhuan]], V, ch. 70 n.22 (July 6, at the pool in Zhongnanhai, the day Mao returns: Tian Jiaying puts his case, about 30 percent already contracting or dividing the land, perhaps 40 percent in the end; Mao: collective or individual as the chief? is it your own view? Tian: his own). [[w.jian-zhou-enlai]], 467 (Tian urges household responsibility on Mao, a temporary measure; Mao''s two questions: collective or private economy? his own opinion or others''?); [[w.yang-jisheng-tiandi-fanfu]], I, 74 (Mao back in Peking; Tian Jiaying on dividing the fields and contracting output to households; Mao: is this your own view or others''?); [[w.chen-yun-nianpu-xiuding]], III, 135 (morning, Mao just back to Peking that morning from his inspection: Tian Jiaying, at his own request, puts his view of household contracting and dividing the fields, a temporary expedient, the peasants to be led back to the collective when output recovers; Mao: is your stand chiefly the collective or the individual economy? Your own view, or others''?). Made public: 2013. Check: Bo Yibo estimates 20 percent of the peasantry on baochan daohu ([[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1078, cited by the book at III, 266 n.26). Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 70), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check