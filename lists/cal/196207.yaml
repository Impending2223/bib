  - id: cal.1962-07-05.civil-rights-the-executive
    when: July 5
    date: '1962-07-05'
    thread: civil-rights-the-executive
    also: [defense]
    c: 'News conference. The order against segregation in federally financed housing, after seventeen months: "I will announce it when we think it would be a useful and appropriate time." Asked of the $460 million for fallout shelters on which Armed Services has held no hearings: "When the skies are clear, no one is interested"; "I think the time to do it is now." A supplemental request of some $35 million to stock food against attack.'
    n: 'The President''s News Conference of July 5, 1962, [1962 Pub. Papers 539](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=599), at 543 (the shelters). [[w.reeves-president-kennedy]], 327. [[w.sorensen-kennedy]], 616–17 (the words; the shelter legislation of 1962). See [[cal.1961-11-23.civil-rights-the-executive]]. Names: Kennedy.'
    src:
      c: baf0856a
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=599: all'
        - 'w.reeves-president-kennedy 327: A-B'
        - 'w.sorensen-kennedy 616–17: D'
    tags: [name:kennedy-john-f]
    aliases: [cal.1962-07-05.defense]
  - id: cal.1962-07-05.berlin-and-vienna
    when: July 5
    date: '1962-07-05'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Khrushchev to Kennedy, between his talks with Raúl Castro: further delay on a German settlement "would involve such a threat to peace which must be averted already now when it is not too late." The Western garrison in Berlin to be cut by half at once, replaced by Warsaw Pact, neutral and small NATO countries'' troops; the eleven thousand under the UN flag, all out in four years. Ulbricht, July 11, told only of serious negotiations ahead, and to tighten the border now if he wishes.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 445. To check: Khrushchev to Kennedy, July 5, 1962, FRUS 1961–63, XV, 207–12 (cited by [[w.fursenko-khrushchevs-cold-war]], 445 n.21); Khrushchev to Ulbricht, July 11, 1962, APRF (cited 445 n.22). See [[cal.1962-07-01.berlin-and-vienna]]. Names: Khrushchev, Kennedy, Ulbricht.'
    src:
      c: 492aef6a
      rows:
        - 'w.fursenko-khrushchevs-cold-war 445: all'
        - 'via w.fursenko-khrushchevs-cold-war 445 n.21: A-B'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:ulbricht-walter]
  - id: cal.1962-07-05.king
    when: July 5
    date: '1962-07-05'
    thread: king
    also: [civil-rights-organizations]
    c: 'King to the NAACP''s convention, introduced by Dick Gregory: "True peace is not merely the absence of tension, but it is the presence of justice." On the quarrels within the movement: "legislation and court orders can only declare rights. They can never thoroughly deliver them." Civil disobedience, from Socrates to Lutuli. "We have lived with gradualism ... We want freedom now!"'
    n: '[[w.branch-parting-the-waters]], 598–99. To check: King''s address, July 5, 1962, King Speeches, box 3, King Library and Archives (cited by [[w.branch-parting-the-waters]], 598 n.2). See [[cal.1962-07.civil-rights-organizations]]. Names: Martin Luther King, Gregory.'
    src:
      c: ae042ed7
      rows:
        - 'w.branch-parting-the-waters 598–99: all'
        - 'via w.branch-parting-the-waters 598 n.2: all'
    tags: [name:king-martin-luther-jr, name:gregory-dick, state:ga, city:atlanta]
  - id: cal.1962-07-06.defense-soviet-forces
    when: July 6
    date: '1962-07-06'
    thread: defense-soviet-forces
    c: NIE 11-8-62, Soviet Capabilities for Long Range Attack. About 50 operational ICBM launchers; 125–175 by mid-1963, 200–300 by mid-1964, 300–600 by mid-1967. About 40 ballistic missile submarines, 120 missiles of 350 n.m. 165 heavy and 950 medium bombers. Air Force intelligence, 75–100 launchers now.
    n: '[FRUS 1961–63, VIII, doc. 96](https://history.state.gov/historicaldocuments/frus1961-63v08/d96). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
    tags: [name:mccone-john-a]
  - id: cal.1962-07-06.economy
    when: July 6
    date: '1962-07-06'
    thread: economy
    c: 'The Chamber of Commerce''s committee on taxation, Plumley its chairman, answers Byrd, who had called its proposal of June 29 "fiscal irresponsibility": "To await the day when spending is cut, as propitious for reducing tax rates, may be to wait in vain."'
    n: '[[w.stein-fiscal-revolution-in-america]], 418. To check: Chamber of Commerce of the United States, News Service, release of July 6, 1962 (cited by [[w.stein-fiscal-revolution-in-america]], 418 n.56). Check: the day of Byrd''s charge, and his letters to Plumley. See [[cal.1962-06-29.economy]]. Names: Byrd.'
    src:
      c: ea4fb070
      rows:
        - 'w.stein-fiscal-revolution-in-america 418: all'
        - 'via w.stein-fiscal-revolution-in-america 418 n.56: all'
    tags: [name:byrd-harry-f]
  - id: cal.1962-07-06.missile-crisis
    when: July 6
    date: '1962-07-06'
    thread: missile-crisis-anadyr
    also: [soviet-union, cuba]
    c: 'The Presidium, after Khrushchev''s first meeting with Raúl Castro, July 3: at the Cubans'' and General Dementyev''s urging, the "defensive" weapons, the SAMs, to go first, all in July; the strategic missiles after, their shipments delayed for want of ships. All still to be done by Nov. 1.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 444–45; [[w.prezidium-tsk-kpss-1954]], I, 571 (Protocol 40). Check: the protocol (I, 571) has Pliev to command, the defensive means first, then the others, and Kennedy''s and Rusk''s Independence Day speeches to be answered; nothing of the Cubans'' or Dementyev''s urging, or of the ships. To check: Protocol 40, July 6, 1962, [[w.prezidium-tsk-kpss-1954]], I (cited by [[w.fursenko-khrushchevs-cold-war]], 444 n.18). See [[cal.1962-07.missile-crisis]]. Names: Khrushchev, Raúl Castro.'
