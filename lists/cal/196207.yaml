  - id: cal.1962-07-02.china-leadership-5
    when: July 2
    date: '1962-07-02'
    time: 1962-07-02T07:30Z
    thread: china-leadership
    c: 'The Secretariat 书记处, 3:30 to 7 p.m.; Yang Shangkun 杨尚昆 puts the sending down of 107 cadres and other matters.{1} Deng presides, on rehabilitation of cadres, the Youth League and farming. Deng: many ask to divide the land; Chen Yun has inquired; farming alone does best now; "yellow cat, black cat," whichever restores output fastest in the transition.{2} Peng Zhen: stop the talk of difficulties and turn to the positive; Deng: "I lean that way."{3}'
    n: '[[w.yang-shangkun-riji]], II, 191 (July 2, 1962); [[w.deng-xiaoping-nianpu-1904]], III, 1712–1713 (July 2, 1962; afternoon; Deng presides; rehabilitation, the Youth League, farming. Deng: no details in files, the whole history and the key points; files simplified. Farming: many ask to divide the land; Chen Yun''s inquiry; farming alone does best now; "yellow cat or black cat", whichever restores fastest in the transition; output by household studied in earnest; the masses have reasons; many forms; retreat enough to advance. To Peng Zhen''s call to end the talk of difficulties: "I lean to that"); [[w.mao-zedong-zhuan]], V, ch. 70 n.25 (July 2: the Secretariat, Peng Zhen and Deng Xiaoping, on the bureau heads'' complaint that there is too much talk of errors and difficulties, Peng: stop at them and turn to the positive; Deng: "I lean that way"; and on household contracting, Deng: "yellow cat, black cat", whichever method serves recovery in the transition). The words: 下午3时半到7时 (II, 191). [[w.peng-zhen-nianpu-1902]], IV, 204 (July 2, 1962, afternoon; the Secretariat''s 328th meeting; rehabilitation of cadres, the Youth League, streamlining, restoring farm output; Peng Zhen: judge cadres by their whole history and the key questions, not details; many decisions of these years made too fast; even the Chairman''s word "也不那么灵了", many questions decided under pressure without his study; the Secretariat not to throw out ideas without investigation; the grain levy at a fixed price, the price gap on purchases to be settled or the collective economy will collapse; talk of difficulties and shortcomings to stop here and turn to the positive; Deng Xiaoping: "我倾向这样"); [[w.deng-xiaoping-nianpu-1904]], III, 1712–1713; [[w.mao-zedong-zhuan]], V, ch. 70. [[w.deng-xiaoping-nianpu-1904]], III, 1713. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). To check: Record of the Secretariat''s meeting 中共中央书记处会议记录, July 2, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.25). Names: Yang Shangkun, Deng Xiaoping, Peng Zhen, Chen Yun.'
