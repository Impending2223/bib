    c: 'Mao summons Liu Shaoqi to his swimming pool and upbraids him for not halting baochan daohu.{1} Before, Tian Jiaying, Chen Yun and Deng Zihui had spoken to Mao for household contracting. Liu: Chen and Tian spoke within the Party, no breach of discipline; so many starved, history will write of Mao and Liu, people eating people in the books. Mao: the three red flags denied, the land divided; why not resist? and after his death?{2}'
