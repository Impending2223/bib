    when: July 2
    date: '1962-07-02'
    thread: republican-party
    also: [goldwater]
    c: 'Goldwater to Miller, the national chairman, by letter, against the Citizens Committee of the Gettysburg conference: "We already have a National Committee. Where is there unity in two groups working in the same field?" The confusion and distrust "which cost us the Presidency in 1960."'
    n: '[[w.novak-agony-of-the-g]], 75. See [[cal.1962-06-30.republican-party]]. Names: Goldwater, Miller.'
