  - id: cal.1962-07-28.georgia-albany
    when: July 28
    date: '1962-07-28'
    place: albany-ga
    thread: georgia-albany
    c: 'William Hansen of SNCC, the one white jailed in the marches of July 27, beaten by inmates in the Dougherty County jail overnight: a broken jaw, cuts, broken ribs.{1} Sheriff D. C. "Cull" Campbell, seventy-six, strikes C. B. King, come as Hansen''s lawyer, on the head with a cane. Pritchett: "This is exactly what we''ve been trying to prevent."{2} Campbell to FBI agent Cheek: "Yeah, I hit him in the head. I told the son of a bitch to get out of my office, and he didn''t get out."{3}'
    n: '[[w.branch-parting-the-waters]], 622–23. To check: [*New York Times*, July 29, 1962](https://timesmachine.nytimes.com/timesmachine/1962/07/29/issue.html), at 1; *Atlanta Journal*, July 29, 1962, at 1 (cited by [[w.branch-parting-the-waters]], 622 n.1); *Albany Herald*, Sept. 15, 1962, at 10 (cited by [[w.branch-parting-the-waters]], 622 n.2); interviews: Marion Cheek, July 11, 1985 (cited by [[w.branch-parting-the-waters]], 622 n.3). See [[cal.1962-07-27.albany]].'
    src:
      c: 925c4afe
