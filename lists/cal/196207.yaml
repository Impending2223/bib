    c: Geneva.{1} Declaration on the Neutrality of Laos;{2} fourteen signatories.{3}
    n: 'Statement by the President on the Signing of Agreements To End the Conflict in Laos, [1962 Pub. Papers 568](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=628) (July 23, 1962). [FRUS 1961–63, XXIV, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v24/d411). Declaration on the Neutrality of Laos (Viet. II.I.2). [[w.gibbons-u-s-government-and]], II, 117 (signed July 23; not the signatories); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 256 (the declaration, July 23); [[w.marolda-united-states-navy-and]], 84; [[w.anthony-war-in-northern-laos]], 71; [[w.asselin-hanois-road-to-the]], 124–25 (the agreement signed in July; Hanoi''s reading of it); [[w.zhai-china-and-the-vietnam]], 105; [[w.moyar-triumph-forsaken]], 164; [[w.sorensen-kennedy]], 647; [[w.fursenko-khrushchevs-cold-war]], 449 (the Geneva agreement, foreign forces to withdraw); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 256 (the statement of July 9 incorporated; 40 North Vietnamese counted out by the control commission in 75 days); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 237 (July 23, 1962; the enlarged Geneva conference on the peaceful settlement of the Laos question ends; the declaration on the neutrality of Laos and its protocol, adopted unanimously, take effect on signing; the fourteen signatories undertake to recognize and respect Laos''s sovereignty, independence, neutrality, unity and territorial integrity); [[w.macfarquhar-origins-of-the-cultural]], III, 273 (the Geneva conference concludes with agreements signed by both the Chinese Foreign Minister and the American Secretary of State, after fourteen months of negotiation); [[w.lich-su-khang-chien-chong-my]], III, 133 (July 23, 1962, the conference ends: the Americans to withdraw their 666 advisers from Laos; respect for Laos'' independence and territory); [[w.lich-su-khang-chien-chong-my]], III, 133 (July 23, 1962: the conference ends; the United States to withdraw its 666 advisers from Laos); [[w.khoo-collateral-damage]], 42 (the conference ends, July 1962: Laos declared neutral; foreign military personnel to withdraw); [[w.guan-vietnamese-communists-relations-with]], 226 (the Protocol and the Declaration of Neutrality, long after the six weeks the Russians had expected). [[w.rusk-as-i-saw-it-1990]], 429 (the accords; the concessions, by Rusk''s account). To check: [[w.abramson-spanning-the-century]]; Chen Yi, statement of July 23, 1962, on the Geneva agreement on Laos, in [[w.lall-how-communist-china-negotiates]], 179 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 273 n.75a); [[w.lall-how-communist-china-negotiates]], 171–80 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 273 n.75b); [[w.sagar-major-political-events-in]], 54, 59 (cited by [[w.khoo-collateral-damage]], 42 n.221); [[w.modelski-international-conference-on-the]], 135–136, 140–143 (cited by [[w.guan-vietnamese-communists-relations-with]], 226 n.105). See [[cal.1961-03-23.laos]]. Names: Harriman.'
