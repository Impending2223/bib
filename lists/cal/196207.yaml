    c: 'Night, Shiloh, seven hundred waiting. The Reverend S. B. Wells, a freight loader at the Marine depot: "I''ve heard about an injunction, but I haven''t seen one!"{1} Nearly two hundred, mostly teenagers, march behind him;{2} blocked at the bus station, Wells kneels; Pritchett: "All right, Rev, come on and get up, goddamn it. Let''s go to jail." 113 jailed, then some fifty more. King, watching from a car: "They can stop the leaders, but they can''t stop the people."{3}'
