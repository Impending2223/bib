    c: 'Lê Duẩn to COSVN on the lesson of Laos: a struggle "in excess of the situation" would have brought other reactions from the imperialists;{1} neutrality for the South a "method," to get the Americans out and a government in Saigon that would be "independent."{2}'
    n: '[[w.asselin-hanois-road-to-the]], 134–36; [[w.van-kien-dang-toan]], XXIII, 705–26 (Thư của đồng chí Lê Duẩn gửi Trung ương Cục miền Nam, Về cách mạng miền Nam, the title the editors'', 705, the letter "Ba gửi T.W.C": the lesson of Laos, had the struggle been pushed "quá giới hạn của tình hình" (beyond the limits of the situation), above all the military struggle too far, "có thể có những phản ứng khác của đế quốc" (there could be other reactions of the imperialists), 708; to push the revolution in the South "đi quá mức độ cần thiết" (beyond the necessary degree) would bring no victory, 710; the Americans to be pushed back step by step, their puppet government overthrown and "một chính quyền độc lập và trung lập" (an independent and neutral government) built, the right measure, the Front''s ten slogans "chiến thuật hay" (a good tactic), 711–12; not "method"); [[w.guan-vietnamese-communists-relations-with]], 229–230 ("in July 1962": the Americans mean the South as a springboard against the North and a wall against socialism; the South, with no border on China, more open to direct invasion, so fight carefully; North and South bound together; the enemy not to be underrated; Laos, Nam Tha, a lesson in struggling and knowing when to hold back; political and military struggle together against the strategic hamlets; the enemy may be brought to negotiate, as in Laos and Algeria). Made public: 2002. To check: [[w.duan-thu-vao-nam]], 50–67 (cited by [[w.guan-vietnamese-communists-relations-with]], 230 n.119). Names: Lê Duẩn.'
