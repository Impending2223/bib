  - id: cal.1962-07-03.states-and-cities-us
    when: July 3
    date: '1962-07-03'
    thread: states-and-cities
    c: Governors' Conference at Hershey, Pa. The Resolutions Committee's civil rights resolution, reaffirming that of 1961; amendments by Rockefeller, Hatfield and Swainson of Michigan for a pledge of action. Hollings and others hold the floor into the evening. On Lawrence's proposal, each governor to sign the text he supports, the resolution and amendments set aside, 32–8. July 4, Kennedy to the governors at Independence Hall.
    n: '[*Proceedings of the Governors'' Conference, 1962*, 68–94](https://www.nga.org/wp-content/uploads/2026/03/1962_Annual_Meeting-compressed.pdf#page=83). Address at Independence Hall, Philadelphia, [1962 Pub. Papers 537](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=597). [[w.smith-on-his-own-terms]], 373 (the governors at Hershey reject Rockefeller''s resolution for equal opportunity and universal voting rights). To check: [[w.black-southern-governors-and-civil]]. See [[cal.1961-06-25.states-and-cities-us]]. Names: Rockefeller, Hatfield, Swainson, Hollings, Lawrence, Kennedy.'
    src:
      c: d3629949
      rows:
