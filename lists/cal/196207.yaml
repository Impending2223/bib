    part_of: cal.1962-07-01.soviet-union-leadership-2
    c: 'The Presidium at Ogarevo, the same session as Berlin and Cuba, on the KGB''s note of June 26: Moskalenko to be called in and dressed down before the marshals; Colonel Yuferov to be tried in closed court. The Leningrad party''s and sovnarkhoz''s note on the leading works and design bureaus: Brezhnev and Kirilenko to look into it.'
    n: 'Protocol 39, items XIII and XVII. [[w.prezidium-tsk-kpss-1954]], I, 570 (doc. 254, Malin''s notes); III, 285–87 (doc. 254.2, the KGB''s note, not printed; P 39/XVII and the note of Tolstikov and Antonov). See [[cal.1962-07-01.berlin-and-vienna]], [[cal.1962-07-01.berlin-and-vienna]]. Made public: 2003. Names: Moskalenko, Yuferov, Brezhnev, Kirilenko.'
    tags: [name:brezhnev-leonid, name:kirilenko-andrei-p, polity:ussr, name:moskalenko, name:yuferov]
