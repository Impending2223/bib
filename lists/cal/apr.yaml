# Cal. VI April 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VI
entries:
  - id: cal.1961-04-03.states-and-cities
    when: Apr. 3
    date: '1961-04-03'
    thread: states-and-cities
    c: Michigan voters approve a constitutional convention. Romney leads Citizens for Michigan.
    n: Albert L. Sturm, *Constitution-Making in Michigan, 1961–1962* (1963). Harris, *Romney's Way* (Opp. II.C).
    tags: [name:romney-george-w]
  - id: cal.1961-04-04.states-and-cities
    when: Apr. 4
    date: '1961-04-04'
    thread: states-and-cities
    also: [specials]
    c: Texas special election for Johnson's seat. Seventy-one candidates; Tower first, Blakley second. Runoff set.
    n: Knaggs, *Two-Party Texas* (K–J Cong. II.H). Tower, *Consequences* (Opp. II.G.1).
    tags: [name:johnson-lyndon-b, name:tower-john-g, name:blakley-william-a]
  - id: cal.1961-04-04.cuba
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba
    c: State Department meeting on the invasion plan. Fulbright, invited, argues against it. The plan goes ahead.
    n: '[FRUS 1961–63, X, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v10/d80). Bibliography: [[cal.1961-04-15.cuba]].'
    tags: [ok:thread-first, name:fulbright-j-william]
  - id: cal.1961-04-06.opinion
    when: Apr. 6–11
    date: '1961-04-06'
    thread: opinion
    c: Approval 78 percent, disapproval 5, the lowest of the presidency. In the field the week before the landing.
    n: See [[cal.1961-02-10.opinion]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-12.space
    when: Apr. 12
    date: '1961-04-12'
    thread: space
    c: Gagarin orbits the earth.
    n: '[Statement by the President on the Orbiting of a Soviet Astronaut](https://www.presidency.ucsb.edu/documents/statement-the-president-the-orbiting-soviet-astronaut). [Message to Chairman Khrushchev Concerning the Flight of the Soviet Astronaut](https://www.presidency.ucsb.edu/documents/message-chairman-khrushchev-concerning-the-flight-the-soviet-astronaut). Logsdon, *Decision to Go to the Moon* and *John F. Kennedy and the Race to the Moon*; McDougall, *...the Heavens and the Earth* (K–J Adm. II.B). Lambright, *Powering Apollo* (K–J Adm. II.G.5). Robert Dallek, *Johnson, Project Apollo, and the Politics of Space Program Planning*, in *Spaceflight and the Myth of Presidential Leadership* (Roger D. Launius & Howard E. McCurdy eds., 1997). Names: Webb, Wiesner (K–J Adm. III.B, III.G); Johnson (K–J Adm. III.D).'
    tags: [name:gagarin-yuri]
  - id: cal.1961-04-15.cuba
    when: Apr. 15–19
    date: '1961-04-15'
    thread: cuba
    c: 'The Bay of Pigs. Apr. 15: air strikes from Nicaragua, with a cover story Stevenson repeats at the UN. Apr. 16: the second strike canceled. Apr. 17: Brigade 2506 lands. Apr. 19: collapse; about 1,200 captured.'
    n: 'Wyden, *Bay of Pigs*; Rasenberger, *Brilliant Disaster*; Fursenko & Naftali, *"One Hell of a Gamble"*; Thomas, *Very Best Men* (K–J Adm. II.D–E). [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). Kirkpatrick survey and the Taylor report (K–J Adm. II.H.3). Bissell, *Reflections of a Cold Warrior* (K–J Adm. II.G.6). Piero Gleijeses, *Ships in the Night: The CIA, the White House and the Bay of Pigs*, 27 [J. Latin Am. Stud.](https://www.cambridge.org/core/journals/journal-of-latin-american-studies) 1 (1995). Grayston L. Lynch, *Decision for Disaster: Betrayal at the Bay of Pigs* (1998), by a CIA officer ashore. The Cuban record: *Playa Girón: derrota del imperialismo* (4 vols., 1961–62), the prisoners'' interrogations. Check. National Security Archive briefing books (K–J Adm. II.K). Names: Bissell, Dulles (K–J Adm. III.I); Stevenson, Bowles (K–J Adm. III.E); Burke (K–J Adm. III.F).'
    tags: [name:stevenson-adlai-e]
  - id: cal.1961-04-17.right-and-the-military
    when: Apr. 17
    date: '1961-04-17'
    thread: right-and-the-military
    c: Major General Edwin Walker relieved of his division in Germany pending inquiry into his "Pro-Blue" troop program.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-213) (Apr. 21, 1961). Schoenwald, *A Time for Choosing* (Opp. II.B). Dallek, *Birchers* (Opp. II.B). Names: Walker (K–J Adm. III.F).'
    tags: [name:walker-edwin-a]
  - id: cal.1961-04-17.court
    when: Apr. 17
    date: '1961-04-17'
    thread: court
    c: '*Burton v. Wilmington Parking Authority*, [365 U.S. 715](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365715/usrep365715.pdf).'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-04-18.specials
    when: Apr. 18
    date: '1961-04-18'
    thread: specials
    c: 'Arkansas 6th, special. Catherine Dorris Norrell to her husband''s seat, 43.1 percent of five Democrats. No swing: Norrell unopposed in 1960.'
    n: 'Shares: Wikipedia. Check the date: April 18 or 19. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1961-04-18-h-AR-6, name:norrell-william-f, name:norrell-catherine-dorris]
  - id: cal.1961-04-19.court
    when: Apr. 19–20
    date: '1961-04-19'
    thread: court
    c: '*Baker v. Carr* argued.'
    n: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962). Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). Ansolabehere & Snyder, *End of Inequality* (Opp. II.F). Names: Cox (K–J Cong. III.G).'
  - id: cal.1961-04-20.cuba
    when: Apr. 20
    date: '1961-04-20'
    thread: cuba
    also: [space]
    c: 'Address to the newspaper editors: the lessons of Cuba, and no retreat. Same day Kennedy asks Johnson, as Space Council chairman, whether there is a space program the United States can win. Tax message the same day: an investment credit and withholding on dividends.'
    n: '[Address Before the American Society of Newspaper Editors](https://www.presidency.ucsb.edu/documents/address-before-the-american-society-newspaper-editors) (Apr. 20, 1961). Logsdon (see [[cal.1961-04-12.space]]) prints the memo. [Special Message to the Congress on Taxation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-taxation) (Apr. 20, 1961).'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1961-04-21.cuba
    when: Apr. 21
    date: '1961-04-21'
    thread: cuba
    c: 'Press conference: Kennedy takes responsibility. "Victory has a hundred fathers." His approval rises.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-213) (Apr. 21, 1961). Chase & Lerman (see [[cal.1961-01-25.press-and-broadcasting]]).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-22.cuba
    when: Apr. 22
    date: '1961-04-22'
    thread: cuba
    c: 'Kennedy meets Eisenhower at Camp David. The Cuba Study Group formed: Taylor, Robert Kennedy, Dulles, Burke.'
    n: '[FRUS 1961–63, X, doc. 169](https://history.state.gov/historicaldocuments/frus1961-63v10/d169). Eisenhower & Eisenhower, *Going Home to Glory* (Opp. II.G.3). Report: [[cal.1961-06-13.cuba]]. See [[cal.1961-04-15.cuba]].'
    tags: [name:kennedy-john-f, name:eisenhower-dwight-d, name:taylor-maxwell, name:kennedy-robert-f, name:dulles-allen-w, name:burke-arleigh-a]
  - id: cal.1961-04-24.court
    when: Apr. 24
    date: '1961-04-24'
    thread: court
    c: '*Konigsberg v. State Bar*, [366 U.S. 36](https://tile.loc.gov/storage-services/service/ll/usrep/usrep366/usrep366036/usrep366036.pdf).'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-04-25.space
    when: Apr. 25
    date: '1961-04-25'
    thread: space
    c: Statute makes the Vice President chairman of the Space Council. Johnson's memorandum of Apr. 28 recommends the moon.
    n: '[Pub. L. No. 87-26, 75 Stat. 47](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg47.pdf) (1961). Logsdon (see [[cal.1961-04-12.space]]). Caro, *Passage of Power* (K–J Adm. II.A).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1961-04-27.press-and-broadcasting
    when: Apr. 27
    date: '1961-04-27'
    thread: press-and-broadcasting
    c: 'Address to the newspaper publishers in New York: a call for self-restraint in a cold war. The press reads it as a call for censorship.'
    n: '[Address "The President and the Press" Before the American Newspaper Publishers Association](https://www.presidency.ucsb.edu/documents/address-the-president-and-the-press-before-the-american-newspaper-publishers-association) (Apr. 27, 1961).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-28.opinion
    when: Apr. 28–May 3
    date: '1961-04-28'
    thread: opinion
    c: 'After the Bay of Pigs: 83 percent approve, the high of the presidency; 61 percent approve his handling of Cuba. A trade embargo has majority support; sending troops does not. "The worse I do, the more popular I get."'
    n: Gallup Vault, *Cuba Embargo Popular After Bay of Pigs Fiasco* (Apr. 2016), at [news.gallup.com](https://news.gallup.com/vault/190772/gallup-vault-cuba-embargo-popular-bay-pigs-fiasco.aspx). Some compilations give 82. Schlesinger, *A Thousand Days* (K–J Adm. II.G.2), for the remark. Mueller; Brody (K–J Cong. II.E) on the rally. See [[cal.1961-02-10.opinion]] and [[cal.1961-04-15.cuba]].
    tags: [name:kennedy-john-f]
