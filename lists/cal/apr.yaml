    c: 'Gallup, Mar. 10–15: federal school aid to all public schools, 68 percent; withheld from schools that fail to integrate, 23.'
    n: '[[w.gallup-poll]], III, 1713.'
  - id: cal.1961-04-03.states-and-cities
    when: Apr. 3
    date: '1961-04-03'
    thread: state-constitutions
    c: Michigan voters approve a constitutional convention. Romney leads Citizens for Michigan.
    n: '[[w.sturm-constitution-making-in-michigan]]; [[w.harris-romneys-way]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi]
  - id: cal.1961-04-03.cuba
    when: Apr. 3
    date: '1961-04-03'
    thread: cuba-bay-of-pigs
    c: 'The State Department''s pamphlet *Cuba*, the White Paper: Castro has delivered Cuba to the Sino-Soviet bloc; Cuba called on to sever its links with the Communist movement. Drafted in Inter-American Affairs, revised in the White House by Schlesinger and Goodwin.'
    n: '[FRUS 1961–63, X, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v10/d79); Department of State Publication 7171. Ordered by NSAM 31: see [[cal.1961-03-11.cuba]]. Names: Castro, Schlesinger, Goodwin.'
    tags: [name:castro-fidel, name:schlesinger-arthur-m-jr, name:goodwin-richard-n]
  - id: cal.1961-04-04.states-and-cities
    when: Apr. 4
    date: '1961-04-04'
    thread: states-and-cities
    also: [specials]
    c: Texas special election for Johnson's seat. Seventy-one candidates; Tower first, Blakley second. Runoff set.
    n: '[[w.knaggs-two-party-texas]]; [[w.tower-consequences]]. Names: Johnson, Tower, Blakley.'
    tags: [name:johnson-lyndon-b, name:tower-john-g, name:blakley-william-a, state:tx]
  - id: cal.1961-04-04.cuba
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba-bay-of-pigs
    c: 'The State Department, 6 p.m. Kennedy polls his advisers on Zapata. Fulbright, invited, speaks against it; Rusk opposed; Berle, Mann, McNamara for. Hawkins: groups of 200 too small. Kennedy still wants it to look like a rising from inside.'
    n: '[FRUS 1961–63, X, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v10/d80) (Gray''s notes). Made public: FRUS 1961–63, X (1997). See [[cal.1961-03-29.cuba]]. Names: Kennedy, Fulbright, Rusk, Berle, Mann, McNamara, Hawkins.'
    tags: [name:kennedy-john-f, name:fulbright-j-william, name:rusk-dean, name:berle-adolf-a, name:mann-thomas-c, name:mcnamara-robert-s, name:hawkins-jack]
  - id: cal.1961-04-04.mayors-los-angeles
    when: Apr. 4
    date: '1961-04-04'
    thread: mayors
    also: [elections-1961]
    c: 'Los Angeles, nonpartisan primary for mayor: Poulson, mayor since 1953, 39.7 percent; Yorty, once a U.S. Representative, 27.1; Councilman McGee 25.6; six others. Poulson and Yorty to a runoff, May 31.'
    n: 'Votes: [Wikipedia, "1961 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1961_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. [[w.bollens-yorty]]; [[w.sonenshein-politics-in-black-and]]. Names: Poulson, Yorty, McGee.'
    tags: [state:ca, city:los-angeles, name:poulson-norris, name:yorty-sam, name:mcgee-patrick-d]
  - id: cal.1961-04-04.mayors-st-louis
    when: Apr. 4
    date: '1961-04-04'
    thread: mayors
    also: [elections-1961]
    c: St. Louis re-elects Tucker (D) mayor, a third term.
    n: 'City of St. Louis, ["Raymond R. Tucker"](https://www.stlouis-mo.gov/government/about/history/mayors/mayor.cfm?id=987) (Check: the day, the opponent and the vote). [[w.gordon-mapping-decline]]. Names: Tucker.'
    tags: [state:mo, city:st-louis, name:tucker-raymond-r]
  - id: cal.1961-04-05.opinion
    when: Apr. 5
    date: '1961-04-05'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Mar. 10–15: under the school bill, more important here, new buildings 38 percent, teachers'' salaries 26, both 27.'
    n: '[[w.gallup-poll]], III, 1713.'
  - id: cal.1961-04-05.european-community
    when: Apr. 5–8
    date: '1961-04-05'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'Macmillan in Washington. The Americans: if Britain joins the Six and accepts the Rome Treaty''s political and institutional obligations, the United States will support it; a commercial arrangement alone, not. Ball had told Heath the same in London, Mar. 30. Joint statement, Apr. 8: "further steps toward the economic and political unity of Europe."'
    n: '[Remarks at the Reading of the Joint Statement Following Discussions With Prime Minister Macmillan](https://www.presidency.ucsb.edu/documents/remarks-the-reading-the-joint-statement-following-discussions-with-prime-minister) (Apr. 8, 1961). FRUS 1961–63, XIII, doc. [3](https://history.state.gov/historicaldocuments/frus1961-63v13/d3) (circular, Apr. 12). [[w.camps-britain-and-the-european]]; [[w.macmillan-pointing-the-way-1959]]; [[w.ball-past-has-another-pattern]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.ludlow-dealing-with-britain]]; [[w.milward-uk-and-the-european]]. See [[cal.1960-05-03.european-community]]. Names: Macmillan, Heath, Ball.'
    tags: [name:macmillan-harold, name:ball-george-w, name:heath-edward-r-g, name:kennedy-john-f]
  - id: cal.1961-04-05.cuba
    when: Apr. 5
    date: '1961-04-05'
    thread: cuba-bay-of-pigs
    c: 'Schlesinger to Kennedy, after the meeting of Apr. 4: for quiet infiltration and air drops; against the beachhead. However Cuban the force, the United States held accountable; a protracted civil war.'
    n: '[FRUS 1961–63, X, doc. 81](https://history.state.gov/historicaldocuments/frus1961-63v10/d81). Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-04.cuba]]. Names: Schlesinger, Kennedy. Check: an earlier release.'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1961-04-06.opinion
    when: Apr. 6–11
    date: '1961-04-06'
    thread: opinion
    c: Approval 78 percent, disapproval 6, in the series today; not released at the time. In the field the week before the landing.
    n: See [[cal.1961-02-10.opinion]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-06.europe-and-the-alliance
    when: Apr. 6
    date: '1961-04-06'
    thread: europe-and-the-alliance-jupiters
    also: [defense]
    c: 'The Jupiters for Turkey. NSAM 35: State, Defense and the CIA to review the deployment, Acheson''s NATO task force having advised Polaris for the alliance instead.'
    n: '[NSAM No. 35](https://history.state.gov/historicaldocuments/frus1961-63v16/d361) (Apr. 6, 1961). FRUS 1961–63, XVI, doc. [362](https://history.state.gov/historicaldocuments/frus1961-63v16/d362) (Apr. 20). [[w.harris-troubled-alliance]]; [[w.nash-other-missiles-of-october]]. Names: Acheson.'
    tags: [name:kennedy-john-f, name:acheson-dean-g, name:bundy-mcgeorge]
  - id: cal.1961-04-07.cuba
    when: Apr. 7
    date: '1961-04-07'
    thread: cuba-bay-of-pigs
    also: [press-and-broadcasting]
    c: '*New York Times*, front page: Szulc, from Miami, on anti-Castro units trained to invade Cuba. Cut in New York the night before: nothing on the CIA, nor that a landing was imminent; one column, not four.'
    n: '[*New York Times*, Apr. 7, 1961](https://timesmachine.nytimes.com/timesmachine/1961/04/07/issue.html). [[w.talese-kingdom-and-the-power]]; [[w.wyden-bay-of-pigs]]. Made public, the cuts: Clifton Daniel''s address to the World Press Institute, June 1, 1966. See [[cal.1961-01-10.cuba]]. Names: Szulc. Check: the headline; the cuts against Daniel''s text.'
    tags: [name:szulc-tad]
  - id: cal.1961-04-12.space
    when: Apr. 12
    date: '1961-04-12'
    thread: space
    c: Gagarin orbits the earth.
    n: '[Statement by the President on the Orbiting of a Soviet Astronaut](https://www.presidency.ucsb.edu/documents/statement-the-president-the-orbiting-soviet-astronaut). [Message to Chairman Khrushchev Concerning the Flight of the Soviet Astronaut](https://www.presidency.ucsb.edu/documents/message-chairman-khrushchev-concerning-the-flight-the-soviet-astronaut). [[w.logsdon-decision-to-go-to]]; [[w.logsdon-john-f-kennedy-and]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.lambright-powering-apollo]]. [[w.dallek-johnson-project-apollo-and]]. Names: Webb, Wiesner, Johnson, Gagarin.'
    tags: [name:gagarin-yuri, name:webb-james-e, name:wiesner-jerome-b, name:johnson-lyndon-b]
  - id: cal.1961-04-12.cuba
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    c: 'Press conference. "There will not be, under any conditions, an intervention in Cuba by the United States Armed Forces." The Government to see that no Americans are involved in actions inside Cuba.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-211), item 4. See [[cal.1961-04-04.cuba]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-04-12.cuba-2
    when: Apr. 12
    date: '1961-04-12'
    thread: cuba-bay-of-pigs
    c: 'The White House, 5:45 p.m. Bissell''s last revision: a pilot to land at Miami as a defector; air strikes on D-2. Kennedy stresses no association with the United States; training in the United States to stop. No-go times: noon, Apr. 14, for the strikes; noon, Apr. 16, for the landing.'
    n: 'FRUS 1961–63, X, docs. [92](https://history.state.gov/historicaldocuments/frus1961-63v10/d92) (Gray''s notes), [93](https://history.state.gov/historicaldocuments/frus1961-63v10/d93) (the CIA''s paper); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 33. Made public: FRUS 1961–63, X (1997). See [[cal.1961-04-04.cuba]]. Names: Bissell, John F. Kennedy.'
    tags: [name:bissell-richard-m-jr, name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:kennedy-robert-f, name:lemnitzer-lyman-l, name:bundy-mcgeorge]
  - id: cal.1961-04-13.european-community
    when: Apr. 13
    date: '1961-04-13'
    thread: european-community
    also: [europe-and-the-alliance]
    c: 'Kennedy to Adenauer: Britain best in the Community on an unconditional basis.'
    n: 'FRUS 1961–63, XIII, doc. [4](https://history.state.gov/historicaldocuments/frus1961-63v13/d4). See [[cal.1961-04-05.european-community]]. Names: Kennedy, Adenauer.'
    tags: [name:kennedy-john-f, name:adenauer-konrad]
  - id: cal.1961-04-15.cuba
    when: Apr. 15
    date: '1961-04-15'
    thread: cuba-bay-of-pigs
    c: 'The Bay of Pigs. At dawn eight B-26s of the exile force, from Puerto Cabezas, Nicaragua, strike three airfields: Campo Libertad, San Antonio de los Baños, Santiago. Five aircraft destroyed. A B-26 lands at Key West, another at Miami, its pilot a defector by the cover story. The diversionary landing east of Guantanamo aborted.'
    n: 'FRUS 1961–63, X, docs. [102](https://history.state.gov/historicaldocuments/frus1961-63v10/d102), [104](https://history.state.gov/historicaldocuments/frus1961-63v10/d104) (Castro''s communiqué; Miró Cardona''s statement), [93](https://history.state.gov/historicaldocuments/frus1961-63v10/d93) (the cover plan, Apr. 12); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231) (Taylor''s Memorandum No. 1, June 13), pars. 35–36. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.wyden-bay-of-pigs]]; [[w.rasenberger-brilliant-disaster]]; [[w.fursenko-one-hell-of-a]]; [[w.thomas-very-best-men]]; [[w.operation-zapata]]; [[w.bay-of-pigs-declassified]]; [[w.bissell-reflections-of-a-cold]]; [[w.gleijeses-ships-in-the-night]]; [[w.lynch-decision-for-disaster]], by a CIA officer ashore; [[w.higgins-perfect-failure]]; [[w.jones-bay-of-pigs]]. The Cuban record: [[w.playa-giron]], the prisoners'' interrogations. See [[cal.1960-03-17.cuba]].'
    tags: [name:bissell-richard-m-jr, name:dulles-allen-w]
  - id: cal.1961-04-15.cuba-2
    when: Apr. 15
    date: '1961-04-15'
    thread: cuba-bay-of-pigs
    c: 'The UN''s Political Committee, called early. Roa charges the United States with aggression; Zorin: Cuba has friends ready to come to its aid. Stevenson denies it, cites the press conference of Apr. 12: the raids by defectors from Cuba''s air force, landed in Florida.'
    n: '[FRUS 1961–63, X, doc. 104](https://history.state.gov/historicaldocuments/frus1961-63v10/d104); U.N. doc. A/C.1/SR.1149. See [[cal.1961-04-15.cuba]]. Names: Roa, Zorin, Stevenson.'
    tags: [name:roa-y-garcia-raul, name:zorin-valerian, name:stevenson-adlai-e]
  - id: cal.1961-04-16.cuba
    when: Apr. 16
    date: '1961-04-16'
    thread: cuba-bay-of-pigs
    c: 'The second strike cancelled. At 9:30 p.m. Bundy tells Cabell: no air strikes at dawn until they can fly from a strip in the beachhead. Cabell and Bissell to Rusk, 10:15: strikes in the beachhead allowed, the airfields not; they do not ask to speak to the President. The order reaches Puerto Cabezas with the crews in their cockpits.'
    n: 'FRUS 1961–63, X, docs. [108](https://history.state.gov/historicaldocuments/frus1961-63v10/d108) (Cabell to Taylor, May 9), [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 37, 43–45. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1961-04-15.cuba]]. Names: McGeorge Bundy, Cabell, Bissell, Rusk.'
    tags: [name:bundy-mcgeorge, name:cabell-charles-p, name:bissell-richard-m-jr, name:rusk-dean, name:kennedy-john-f]
  - id: cal.1961-04-17.right-and-the-military
    when: Apr. 17
    date: '1961-04-17'
    thread: right-and-the-military
    c: Major General Edwin Walker relieved of his division in Germany pending inquiry into his "Pro-Blue" troop program.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-213) (Apr. 21, 1961). [[w.schoenwald-time-for-choosing]]; [[w.dallek-birchers]]. Names: Walker.'
    tags: [name:walker-edwin-a]
  - id: cal.1961-04-17.court
    when: Apr. 17
    date: '1961-04-17'
    thread: court
    also: [desegregation-public-places]
    c: '*Burton v. Wilmington Parking Authority*, [365 U.S. 715](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365715/usrep365715.pdf).'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-04-17.cuba
    when: Apr. 17
    date: '1961-04-17'
    thread: cuba-bay-of-pigs
    c: 'Brigade 2506 lands at the Bay of Pigs from 1 a.m., Red Beach and Blue Beach; paratroopers at San Blas, 7:30. Castro''s aircraft sink the *Houston* and the *Río Escondido*; the other ships put out to sea.'
    n: 'FRUS 1961–63, X, docs. [112](https://history.state.gov/historicaldocuments/frus1961-63v10/d112), [116](https://history.state.gov/historicaldocuments/frus1961-63v10/d116); [109](https://history.state.gov/historicaldocuments/frus1961-63v10/d109) (Lynch''s report), [110](https://history.state.gov/historicaldocuments/frus1961-63v10/d110) (Robertson''s). [[w.lynch-decision-for-disaster]]. See [[cal.1961-04-15.cuba]]. Names: Castro.'
    tags: [name:castro-fidel]
  - id: cal.1961-04-18.specials
    when: Apr. 18
    date: '1961-04-18'
    thread: specials
    c: 'Arkansas 6th, special. Catherine Dorris Norrell to her husband''s seat, 43.1 percent of five Democrats. No swing: Norrell unopposed in 1960.'
    n: 'Shares: Wikipedia. Check the date: April 18 or 19. See [[cal.1961-04-04.states-and-cities]]. Names: Norrell.'
    tags: [special:1961-04-18-h-AR-6, name:norrell-william-f, name:norrell-catherine-dorris]
  - id: cal.1961-04-18.governors-nj
    when: Apr. 18
    date: '1961-04-18'
    thread: governors
    also: [elections-1961]
    c: 'New Jersey primaries for governor. Democratic: Hughes, the county leaders'' choice since Feb. 13, 84.2 percent. Republican: Mitchell, Eisenhower''s Secretary of Labor, in since Jan. 14 with Case''s backing, 43.7; Walter H. Jones, State senator, the county organizations'' candidate, 34.7; Dumont, State senator, 20.7.'
    n: '[*Results of the Primary Election Held April 18, 1961*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1961-primary-election.pdf) (Secretary of State); figures here from [Wikipedia, "1961 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1961_New_Jersey_gubernatorial_election) (Hughes 222,789; Mitchell 202,188, Jones 160,553, Dumont 95,761); check against the Results. [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes, Eisenhower, Mitchell, Case, Jones, Dumont.'
    tags: [state:nj, name:hughes-richard-j, name:mitchell-james-p, name:eisenhower-dwight-d, name:case-clifford-p, name:jones-walter-h, name:dumont-wayne-jr]
  - id: cal.1961-04-18.cuba
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    also: [soviet-union]
    c: 'Khrushchev to Kennedy, published as delivered: the bands invading Cuba trained, equipped and armed in the United States; "We will render the Cuban people and their government all necessary help to repel armed attack on Cuba." Zorin reads it in the Political Committee.'
    n: '[FRUS 1961–63, X, doc. 117](https://history.state.gov/historicaldocuments/frus1961-63v10/d117); VI, doc. [9](https://history.state.gov/historicaldocuments/frus1961-63v06/d9). [[w.fursenko-one-hell-of-a]]. See [[cal.1961-04-15.cuba]]. Names: Khrushchev, Kennedy, Zorin.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:zorin-valerian]
  - id: cal.1961-04-18.cuba-2
    when: Apr. 18
    date: '1961-04-18'
    thread: cuba-bay-of-pigs
    also: [soviet-union]
    c: 'Kennedy''s reply, handed to Menshikov by Rusk, 6:50 p.m., and released: "the United States intends no military intervention in Cuba"; against intervention by an outside force, the obligations of the inter-American system. Stevenson reads it in the Political Committee.'
    n: '[Message to Chairman Khrushchev Concerning the Meaning of Events in Cuba](https://www.presidency.ucsb.edu/documents/message-chairman-khrushchev-concerning-the-meaning-events-cuba). FRUS 1961–63, VI, doc. [10](https://history.state.gov/historicaldocuments/frus1961-63v06/d10); X, doc. [130](https://history.state.gov/historicaldocuments/frus1961-63v10/d130). See [[cal.1961-04-18.cuba]]. Names: Kennedy, Menshikov, Rusk, Stevenson.'
    tags: [name:kennedy-john-f, name:menshikov-mikhail, name:rusk-dean, name:stevenson-adlai-e]
  - id: cal.1961-04-19.court
    when: Apr. 19–20
    date: '1961-04-19'
    thread: court
    also: [legislatures]
    c: '*Baker v. Carr* argued.'
    n: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962). [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]. Names: Cox.'
    tags: [name:cox-archibald, state:tn]
  - id: cal.1961-04-19.cuba
    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    c: 'After a White House meeting from 11:58 p.m., the Chiefs order six unmarked Navy aircraft over the beachhead, 6:30 to 7:30 a.m.: defend the brigade from air attack, seek no combat, attack nothing on the ground. The brigade''s B-26s arrive an hour early; two shot down.'
    n: 'FRUS 1961–63, X, docs. [140](https://history.state.gov/historicaldocuments/frus1961-63v10/d140), [141](https://history.state.gov/historicaldocuments/frus1961-63v10/d141) (Burke to Dennison); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 72, 83. Made public: *Operation Zapata* (1981); FRUS 1961–63, X (1997). See [[cal.1961-04-15.cuba]]. Names: Burke.'
    tags: [name:kennedy-john-f, name:burke-arleigh-a, name:dennison-robert-l]
  - id: cal.1961-04-19.cuba-2
    when: Apr. 19
    date: '1961-04-19'
    thread: cuba-bay-of-pigs
    c: 'The beachhead falls. San Román''s last message, 2:32 p.m.: "Am destroying all equipment and communications. I have nothing left to fight with." Resistance over by nightfall.'
    n: 'FRUS 1961–63, X, docs. [142](https://history.state.gov/historicaldocuments/frus1961-63v10/d142), [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 71. [[w.playa-giron]]. See [[cal.1961-04-15.cuba]]. Names: San Román.'
    tags: [name:san-roman-jose-perez]
  - id: cal.1961-04-20.cuba
    when: Apr. 20
    date: '1961-04-20'
    thread: cuba
    also: [space]
    c: 'Address to the newspaper editors: the lessons of Cuba, and no retreat. Same day Kennedy asks Johnson, as Space Council chairman, whether there is a space program the United States can win. Tax message the same day: an investment credit and withholding on dividends.'
    n: '[Address Before the American Society of Newspaper Editors](https://www.presidency.ucsb.edu/documents/address-before-the-american-society-newspaper-editors) (Apr. 20, 1961). [[w.logsdon-decision-to-go-to]] prints the memo. See [[cal.1961-04-12.space]]. [Special Message to the Congress on Taxation](https://www.presidency.ucsb.edu/documents/special-message-the-congress-taxation) (Apr. 20, 1961). Names: Johnson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1961-04-20.europe-and-the-alliance
    when: Apr. 20–24
    date: '1961-04-20'
    thread: europe-and-the-alliance
    also: [european-community]
    c: 'Policy directive, "NATO and the Atlantic Nations," from Acheson''s review; approved Apr. 21; NSAM 40, Apr. 24, for its execution. First priority in Europe to forces for contingencies short of nuclear or massive attack; the American divisions to stay. Support for European integration: Britain not to stay apart "by hopes of a ''special'' relation with the U.S."; the Six to welcome it.'
    n: '[FRUS 1961–63, XIII, doc. 100](https://history.state.gov/historicaldocuments/frus1961-63v13/d100). [[w.stromseth-origins-of-flexible-response]]; [[w.brinkley-dean-acheson]]; [[w.winand-eisenhower-kennedy-and-the]]; [[w.trachtenberg-constructed-peace]]. Names: Acheson.'
    tags: [name:acheson-dean-g, name:kennedy-john-f]
  - id: cal.1961-04-21.cuba
    when: Apr. 21
    date: '1961-04-21'
    thread: cuba
    c: 'Press conference: Kennedy takes responsibility. "Victory has a hundred fathers." His approval rises.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-213) (Apr. 21, 1961). [[w.kennedy-and-the-press]].'
