    n: '[*Results of the Primary Election Held April 18, 1961*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1961-primary-election.pdf) (Secretary of State); figures here from [Wikipedia, "1961 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1961_New_Jersey_gubernatorial_election) (Hughes 222,789; Mitchell 202,188, Jones 160,553, Dumont 95,761); check against the Results. [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes (K–J Cong. III.F); Eisenhower, Mitchell (Opp. III.E); Case (Opp. III.B); Jones, Dumont (K–J Cong. III.K).'
