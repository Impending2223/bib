    n: 'Votes: [Wikipedia, "1961 Los Angeles mayoral election"](https://en.wikipedia.org/wiki/1961_Los_Angeles_mayoral_election), from Our Campaigns; Check: the City Clerk''s canvass. [[w.bollens-yorty]]; [[w.sonenshein-politics-in-black-and]]. Names: Poulson, Yorty (K–J Cong. III.F); McGee (K–J Cong. III.K).'
