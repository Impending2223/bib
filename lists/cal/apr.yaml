  - id: cal.1961-04-15.cuba
    when: Apr. 15–19
    date: '1961-04-15'
    thread: cuba
    c: 'The Bay of Pigs. Apr. 15: air strikes from Nicaragua, with a cover story Stevenson repeats at the UN. Apr. 16: the second strike canceled. Apr. 17: Brigade 2506 lands. Apr. 19: collapse; about 1,200 captured.'
    n: '[[w.wyden-bay-of-pigs]]; [[w.rasenberger-brilliant-disaster]]; [[w.fursenko-one-hell-of-a]]; [[w.thomas-very-best-men]]. [FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). Kirkpatrick survey and the Taylor report (K–J Adm. II.H.3). [[w.bissell-reflections-of-a-cold]]; [[w.gleijeses-ships-in-the-night]]; [[w.lynch-decision-for-disaster]], by a CIA officer ashore. The Cuban record: [[w.playa-giron]], the prisoners'' interrogations. Check. National Security Archive briefing books (K–J Adm. II.K). Names: Bissell, Dulles (K–J Adm. III.I); Stevenson, Bowles (K–J Adm. III.E); Burke (K–J Adm. III.F).'
    tags: [name:stevenson-adlai-e]
