# Cal. VI April 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VI
entries:
  - id: cal.1961-04-03.states-and-cities
    when: Apr. 3
    date: '1961-04-03'
    thread: states-and-cities
    c: Michigan voters approve a constitutional convention. Romney leads Citizens for Michigan.
    n: Albert L. Sturm, *Constitution-Making in Michigan, 1961–1962* (1963). Check. Harris, *Romney's Way* (Opp. II.C). See [[cal.1961-09-12.states-and-cities]].
  - id: cal.1961-04-04.states-and-cities
    when: Apr. 4
    date: '1961-04-04'
    thread: states-and-cities
    c: Texas special election for Johnson's seat. Seventy-one candidates; Tower first, Blakley second. Runoff set.
    n: Knaggs, *Two-Party Texas* (K–J Cong. II.H). Tower, *Consequences* (Opp. II.G.1). See [[cal.1961-05-27.states-and-cities]].
  - id: cal.1961-04-04.cuba
    when: Apr. 4
    date: '1961-04-04'
    thread: cuba
    c: State Department meeting on the invasion plan. Fulbright, invited, argues against it. The plan goes ahead.
    n: See [[cal.1961-04-15.cuba]].
    tags: [ok:thread-first]
  - id: cal.1961-04-06.opinion
    when: Apr. 6–11
    date: '1961-04-06'
    thread: opinion
    c: Approval 78 percent, disapproval 5, the lowest of the presidency. In the field the week before the landing.
    n: See [[cal.1961-02-10.opinion]].
  - id: cal.1961-04-12.space
    when: Apr. 12
    date: '1961-04-12'
    thread: space
    c: Gagarin orbits the earth.
    n: 'Logsdon, *Decision to Go to the Moon* and *John F. Kennedy and the Race to the Moon*; McDougall, *...the Heavens and the Earth* (K–J Adm. II.B). Lambright, *Powering Apollo* (K–J Adm. II.G.5). Robert Dallek, *Johnson, Project Apollo, and the Politics of Space Program Planning*, in *Spaceflight and the Myth of Presidential Leadership* (Roger D. Launius & Howard E. McCurdy eds., 1997). Names: Webb, Wiesner (K–J Adm. III.B, III.G); Johnson (K–J Adm. III.D).'
  - id: cal.1961-04-15.cuba
    when: Apr. 15–19
    date: '1961-04-15'
    thread: cuba
    c: 'The Bay of Pigs. Apr. 15: air strikes from Nicaragua, with a cover story Stevenson repeats at the UN. Apr. 16: the second strike canceled. Apr. 17: Brigade 2506 lands. Apr. 19: collapse; about 1,200 captured.'
    n: 'Wyden, *Bay of Pigs*; Rasenberger, *Brilliant Disaster*; Fursenko & Naftali, *"One Hell of a Gamble"*; Thomas, *Very Best Men* (K–J Adm. II.D–E). FRUS vol. 10. Kirkpatrick survey and the Taylor report (K–J Adm. II.H.3). Bissell, *Reflections of a Cold Warrior* (K–J Adm. II.G.6). Piero Gleijeses, *Ships in the Night: The CIA, the White House and the Bay of Pigs*, 27 [J. Latin Am. Stud.](https://www.cambridge.org/core/journals/journal-of-latin-american-studies) 1 (1995). Grayston L. Lynch, *Decision for Disaster: Betrayal at the Bay of Pigs* (1998), by a CIA officer ashore. The Cuban record: *Playa Girón: derrota del imperialismo* (4 vols., 1961–62), the prisoners'' interrogations. Check. National Security Archive briefing books (K–J Adm. II.K). Names: Bissell, Dulles (K–J Adm. III.I); Stevenson, Bowles (K–J Adm. III.E); Burke (K–J Adm. III.F).'
  - id: cal.1961-04-17.right-and-the-military
    when: Apr. 17
    date: '1961-04-17'
    thread: right-and-the-military
    c: Major General Edwin Walker relieved of his division in Germany pending inquiry into his "Pro-Blue" troop program.
    n: 'Schoenwald, *A Time for Choosing* (Opp. II.B). Dallek, *Birchers* (Opp. II.B). Names: Walker (K–J Adm. III.F).'
  - id: cal.1961-04-17.court
    when: Apr. 17
    date: '1961-04-17'
    thread: court
    c: '*Burton v. Wilmington Parking Authority*, [365 U.S. 715](https://tile.loc.gov/storage-services/service/ll/usrep/usrep365/usrep365715/usrep365715.pdf).'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-04-19.court
    when: Apr. 19–20
    date: '1961-04-19'
    thread: court
    c: '*Baker v. Carr* argued.'
    n: 'Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). Ansolabehere & Snyder, *End of Inequality* (Opp. II.F). Names: Cox (K–J Cong. III.G). See [[cal.1961-05-01.court]].'
  - id: cal.1961-04-20.cuba
    when: Apr. 20
    date: '1961-04-20'
    thread: cuba
    also: [space]
    c: 'Address to the newspaper editors: the lessons of Cuba, and no retreat. Same day Kennedy asks Johnson, as Space Council chairman, whether there is a space program the United States can win. Tax message the same day: an investment credit and withholding on dividends. Check the tax message date.'
    n: Address Before the American Society of Newspaper Editors (Apr. 20, 1961). Logsdon (see [[cal.1961-04-12.space]]) prints the memo. Special Message to the Congress on Taxation (Apr. 20, 1961).
  - id: cal.1961-04-21.cuba
    when: Apr. 21
    date: '1961-04-21'
    thread: cuba
    c: 'Press conference: Kennedy takes responsibility. "Victory has a hundred fathers." His approval rises.'
    n: News Conference (Apr. 21, 1961). Chase & Lerman (see [[cal.1961-01-25.press-and-broadcasting]]).
  - id: cal.1961-04-22.cuba
    when: Apr. 22
    date: '1961-04-22'
    thread: cuba
    c: 'Kennedy meets Eisenhower at Camp David. The Cuba Study Group formed: Taylor, Robert Kennedy, Dulles, Burke.'
    n: See [[cal.1961-06-13.cuba]]. Eisenhower & Eisenhower, *Going Home to Glory* (Opp. II.G.3).
  - id: cal.1961-04-24.court
    when: Apr. 24
    date: '1961-04-24'
    thread: court
    c: '*Konigsberg v. State Bar*, [366 U.S. 36](https://tile.loc.gov/storage-services/service/ll/usrep/usrep366/usrep366036/usrep366036.pdf).'
    n: See [[cal.1961-01-23.court]].
  - id: cal.1961-04-25.space
    when: Apr. 25
    date: '1961-04-25'
    thread: space
    c: Statute makes the Vice President chairman of the Space Council. Check the date and Pub. L. number. Johnson's memorandum of Apr. 28 recommends the moon.
    n: Logsdon (see [[cal.1961-04-12.space]]). Caro, *Passage of Power* (K–J Adm. II.A).
  - id: cal.1961-04-27.press-and-broadcasting
    when: Apr. 27
    date: '1961-04-27'
    thread: press-and-broadcasting
    c: 'Address to the newspaper publishers in New York: a call for self-restraint in a cold war. The press reads it as a call for censorship.'
    n: Address Before the American Newspaper Publishers Association (Apr. 27, 1961).
  - id: cal.1961-04-28.opinion
    when: Apr. 28–May 3
    date: '1961-04-28'
    thread: opinion
    c: 'After the Bay of Pigs: 83 percent approve, the high of the presidency; 61 percent approve his handling of Cuba. A trade embargo has majority support; sending troops does not. "The worse I do, the more popular I get."'
    n: Gallup Vault, *Cuba Embargo Popular After Bay of Pigs Fiasco* (Apr. 2016), at [news.gallup.com](https://news.gallup.com/vault/190772/gallup-vault-cuba-embargo-popular-bay-pigs-fiasco.aspx). Some compilations give 82. Schlesinger, *A Thousand Days* (K–J Adm. II.G.2), for the remark. Mueller; Brody (K–J Cong. II.E) on the rally. See [[cal.1961-02-10.opinion]] and [[cal.1961-04-15.cuba]].
