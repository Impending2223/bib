  - id: cal.1961-04-28.opinion
    when: Apr. 28–May 3
    date: '1961-04-28'
    thread: opinion
    c: 'After the Bay of Pigs: 83 percent approve, the high of the presidency; 61 percent approve his handling of Cuba. A trade embargo has majority support; sending troops does not. "The worse I do, the more popular I get."'
    n: '[[w.vault-cuba-embargo-popular-after]], at [news.gallup.com](https://news.gallup.com/vault/190772/gallup-vault-cuba-embargo-popular-bay-pigs-fiasco.aspx). Some compilations give 82. [[w.schlesinger-thousand-days-1965]], for the remark. [[w.mueller-war-presidents-and-public]]; [[w.brody-assessing-the-president]] on the rally. See [[cal.1961-02-10.opinion]] and [[cal.1961-04-15.cuba]].'
    tags: [name:kennedy-john-f]
