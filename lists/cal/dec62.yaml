list: cal
section: XXXI
entries:
  - id: cal.1962-12-02.goldwater
    when: Dec. 2
    date: '1962-12-02'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Jan. 1963, he receives White: not a candidate; the draft not disowned. Check the number.'
    n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White (Opp. III.F); Rockefeller (Opp. III.H); Goldwater (Opp. III.B).'
    tags: [name:white-f-clifton, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: 'Sylvester, Pentagon spokesman: the government''s right to lie to save itself in a nuclear crisis. "Managed news."'
    n: Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-01-25.press-and-broadcasting]].
    tags: [name:sylvester-arthur]
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Alsop and Bartlett, *Saturday Evening Post*, Dec. 8: Stevenson "wanted a Munich." Bartlett a Kennedy friend. Stevenson stays.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-177) (Dec. 12, 1962). Martin (K–J Adm. II.G.4). See [[cal.1962-05-24.missile-crisis]]. Names: Stevenson (K–J Adm. III.E); Alsop (Opp. III.J).'
    tags: [name:alsop-stewart, name:stevenson-adlai-e, name:kennedy-john-f, name:bartlett-charles]
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    c: New York newspaper strike begins. 114 days.
    n: See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12-09.opinion-5
    when: Dec. 9
    date: '1962-12-09'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Nov. 16–21: choice for 1964: Rockefeller 41, Nixon 21, Romney 15, Goldwater 11, Dirksen 4, Scranton 3; others, no preference 5. Republicans, by second choices reallocated to four: Rockefeller 52, Goldwater 16, Romney 15, Scranton 5.'
    n: '*The Gallup Poll*, III, 1793–94 (K–J Cong. II.E). Names: Rockefeller, Romney, Scranton (Opp. III.H); Nixon (Opp. III.E); Goldwater (Opp. III.B); Dirksen (Opp. III.A).'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:dirksen-everett, name:scranton-william-w]
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
    c: McNamara in London tells Thorneycroft Skybolt will likely be cancelled.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-177) (Dec. 12, 1962). [FRUS 1961–63, XIII, doc. 401](https://history.state.gov/historicaldocuments/frus1961-63v13/d401). Neustadt, *Report to JFK* (see [[cal.1961-12-21.europe-and-the-alliance]]). Names: McNamara (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s, name:thorneycroft-peter]
  - id: cal.1962-12-12.opinion-5
    when: Dec. 12
    date: '1962-12-12'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Nov. 16–21: the four, by region: Rockefeller 50 in the East, 44 in the Midwest, 42 in the South, 55 in the West. Goldwater 12 to 16.'
    n: '*The Gallup Poll*, III, 1794–95 (K–J Cong. II.E). Names: Rockefeller, Romney, Scranton (Opp. III.H); Goldwater (Opp. III.B).'
    tags: [name:rockefeller-nelson, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w]
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'Economic Club of New York. Cut rates for persons and business: "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget."'
    n: '[Address and Question and Answer Period at the Economic Club of New York](https://www.presidency.ucsb.edu/documents/address-and-question-and-answer-period-the-economic-club-new-york) (Dec. 14, 1962). Heller; Stein (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-14.space
    when: Dec. 14
    date: '1962-12-14'
    thread: space
    c: Mariner 2 passes Venus. First planetary flyby.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-12-17.press-and-broadcasting
    when: Dec. 17
    date: '1962-12-17'
    thread: press-and-broadcasting
    c: '"After Two Years." An hour with three network correspondents.'
    n: '[Television and Radio Interview: "After Two Years—a Conversation with the President"](https://www.presidency.ucsb.edu/documents/television-and-radio-interview-after-two-years-conversation-with-the-president) (Dec. 17, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-18.europe-and-the-alliance
    when: Dec. 18–21
    date: '1962-12-18'
    thread: europe-and-the-alliance
    c: Nassau. Polaris for Britain in place of Skybolt, assigned to a NATO force. The same offered de Gaulle.
    n: '[Joint Statement Following Discussions With Prime Minister Macmillan - The Nassau Agreement](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-macmillan-the-nassau-agreement) (Dec. 21, 1962). FRUS 1961–63, XIII, docs. [402](https://history.state.gov/historicaldocuments/frus1961-63v13/d402), [403](https://history.state.gov/historicaldocuments/frus1961-63v13/d403), [407](https://history.state.gov/historicaldocuments/frus1961-63v13/d407). Macmillan (K–J Adm. II.G.7). Neustadt (see [[cal.1961-12-21.europe-and-the-alliance]]). Names: Macmillan, de Gaulle (K–J Adm. III.J).'
    tags: [name:de-gaulle-charles, name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1962-12-19.testing
    when: Dec. 19
    date: '1962-12-19'
    thread: testing
    c: Khrushchev offers two or three on-site inspections a year. Washington wants more.
    n: '[FRUS vol. 6](https://history.state.gov/historicaldocuments/frus1961-63v06). Seaborg (K–J Adm. II.D). See [[cal.1961-09-01.testing]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-12-20.latin-america
    when: Dec. 20
    date: '1962-12-20'
    thread: latin-america
    c: Bosch elected president of the Dominican Republic.
    n: 'See [[cal.1961-05-30.latin-america]]. Names: Bosch (K–J Adm. III.J).'
    tags: [name:bosch-juan]
  - id: cal.1962-12-23.cuba
    when: Dec. 23–24
    date: '1962-12-23'
    thread: cuba
    c: 'Bay of Pigs prisoners flown to Homestead. Ransom: about $53 million in drugs and food. Donovan''s deal.'
    n: '[FRUS 1961–63, XI, doc. 255](https://history.state.gov/historicaldocuments/frus1961-63v11/d255). Donovan (see [[cal.1962-02-10.berlin-and-vienna]]). See [[cal.1962-04-08.cuba]]. Names: Robert F. Kennedy (K–J Adm. III.A).'
    tags: [name:donovan-james-b]
  - id: cal.1962-12-26.vietnam
    when: Dec. 26
    date: '1962-12-26'
    thread: vietnam
    c: Mansfield reports to Kennedy at Palm Beach. The war not being won; more Americans make it an American war. Check the date.
    n: 'Mansfield''s report of Dec. 18, [FRUS vol. 2, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v02/d330). Mansfield et al., *Vietnam and Southeast Asia* (Viet. II.I.3). Oberdorfer, *Senator Mansfield* (K–J Cong. II.I.1). Mann, *A Grand Delusion* (K–J Cong. II.D). See [[cal.1961-01-28.vietnam]]. Names: Mansfield (Viet. III.E).'
    tags: [name:mansfield-mike, name:kennedy-john-f]
  - id: cal.1962-12-28.congo
    when: Dec. 28
    date: '1962-12-28'
    thread: congo
    c: UN forces take Elisabethville. Katanga's secession ends in January.
    n: FRUS 1961–63, XX, docs. [387](https://history.state.gov/historicaldocuments/frus1961-63v20/d387), [388](https://history.state.gov/historicaldocuments/frus1961-63v20/d388). See [[cal.1961-02-13.congo]].
  - id: cal.1962-12-29.cuba
    when: Dec. 29
    date: '1962-12-29'
    thread: cuba
    c: 'Orange Bowl. Kennedy takes the brigade''s flag: "This flag will be returned to this brigade in a free Havana."'
    n: '[Remarks in Miami at the Presentation of the Flag of the Cuban Invasion Brigade](https://www.presidency.ucsb.edu/documents/remarks-miami-the-presentation-the-flag-the-cuban-invasion-brigade) (Dec. 29, 1962). See [[cal.1961-04-15.cuba]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    thread: vietnam
    c: Ấp Bắc. The ARVN 7th Division, with American helicopters and advisers, fails against a Viet Cong battalion. Five helicopters down; three Americans killed. Vann briefs Halberstam and Sheehan; Harkins calls it a victory. Hilsman and Forrestal in Saigon.
    n: 'FRUS 1961–63, III, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v03/d1), [5](https://history.state.gov/historicaldocuments/frus1961-63v03/d5). Toczek, *The Battle of Ap Bac* (Viet. II.B.10). Sheehan, *A Bright Shining Lie* (Viet. II.B.10). Halberstam, *The Making of a Quagmire* (Viet. I.C). See [[cal.1961-01-28.vietnam]]. Names: Vann (Viet. III.C); Harkins (Viet. III.D); Huỳnh Văn Cao (Viet. III.G); Halberstam, Sheehan (Viet. III.F); Hilsman, Forrestal (Viet. III.A).'
    tags: [name:vann-john-paul, name:halberstam-david, name:sheehan-neil, name:harkins-paul-d, name:hilsman-roger, name:forrestal-michael-v]
  - id: cal.1963-01-03.congress
    when: Jan. 3
    date: '1963-01-03'
    thread: congress
    c: 87th Congress ends at noon. 88th convenes Jan. 9.
    n: '[Cong. Rec., Senate, Jan. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-1-1.pdf). See [[cal.1961-01-03.rules]]; [[cal.1961-11-16.congress]].'
    tags: [congress:88]
