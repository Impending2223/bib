# Cal. XXVI December 1962–January 3, 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXVI
entries:
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: 'Sylvester, Pentagon spokesman: the government''s right to lie to save itself in a nuclear crisis. "Managed news."'
    n: Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Alsop and Bartlett, *Saturday Evening Post*, Dec. 8: Stevenson "wanted a Munich." Bartlett a Kennedy friend. Stevenson stays.'
    n: 'Martin (K–J Adm. II.G.4). See [[cal.1962-05-24.missile-crisis]]. Names: Stevenson (K–J Adm. III.E); Alsop (Opp. III.J).'
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    c: New York newspaper strike begins. 114 days. Check.
    n: See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
    c: McNamara in London tells Thorneycroft Skybolt will likely be cancelled.
    n: 'Neustadt, *Report to JFK* (see [[cal.1961-12-21.europe-and-the-alliance]]). Names: McNamara (K–J Adm. III.F).'
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'Economic Club of New York. Cut rates for persons and business: "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget."'
    n: 'Address and Question and Answer Period at the Economic Club of New York (Dec. 14, 1962). Heller; Stein (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller (K–J Adm. III.H).'
  - id: cal.1962-12-14.space
    when: Dec. 14
    date: '1962-12-14'
    thread: space
    c: Mariner 2 passes Venus. First planetary flyby.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-12-17.press-and-broadcasting
    when: Dec. 17
    date: '1962-12-17'
    thread: press-and-broadcasting
    c: '"After Two Years." An hour with three network correspondents.'
    n: 'Television and Radio Interview: "After Two Years—a Conversation with the President" (Dec. 17, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
  - id: cal.1962-12-18.europe-and-the-alliance
    when: Dec. 18–21
    date: '1962-12-18'
    thread: europe-and-the-alliance
    c: Nassau. Polaris for Britain in place of Skybolt, assigned to a NATO force. The same offered de Gaulle.
    n: 'Macmillan (K–J Adm. II.G.7). Neustadt (see [[cal.1961-12-21.europe-and-the-alliance]]). Names: Macmillan, de Gaulle (K–J Adm. III.J).'
  - id: cal.1962-12-19.testing
    when: Dec. 19
    date: '1962-12-19'
    thread: testing
    c: Khrushchev offers two or three on-site inspections a year. Washington wants more.
    n: 'FRUS vol. 6. Seaborg (K–J Adm. II.D). See [[cal.1961-09-01.testing]]. Names: Khrushchev (K–J Adm. III.J).'
  - id: cal.1962-12-20.latin-america
    when: Dec. 20
    date: '1962-12-20'
    thread: latin-america
    c: Bosch elected president of the Dominican Republic.
    n: 'See [[cal.1961-05-30.latin-america]]. Names: Bosch (K–J Adm. III.J).'
  - id: cal.1962-12-23.cuba
    when: Dec. 23–24
    date: '1962-12-23'
    thread: cuba
    c: 'Bay of Pigs prisoners flown to Homestead. Ransom: about $53 million in drugs and food. Donovan''s deal.'
    n: 'Donovan (see [[cal.1962-02-10.berlin-and-vienna]]). See [[cal.1962-04-08.cuba]]. Names: Robert F. Kennedy (K–J Adm. III.A).'
  - id: cal.1962-12-26.vietnam
    when: Dec. 26
    date: '1962-12-26'
    thread: vietnam
    c: Mansfield reports to Kennedy at Palm Beach. The war not being won; more Americans make it an American war. Check the date.
    n: 'Mansfield et al., *Vietnam and Southeast Asia* (Viet. II.I.3). Oberdorfer, *Senator Mansfield* (K–J Cong. II.I.1). Mann, *A Grand Delusion* (K–J Cong. II.D). See [[cal.1961-01-28.vietnam]]. Names: Mansfield (Viet. III.E).'
  - id: cal.1962-12-28.congo
    when: Dec. 28
    date: '1962-12-28'
    thread: congo
    c: UN forces take Elisabethville. Katanga's secession ends in January.
    n: See [[cal.1961-02-13.congo]].
  - id: cal.1962-12-29.cuba
    when: Dec. 29
    date: '1962-12-29'
    thread: cuba
    c: 'Orange Bowl. Kennedy takes the brigade''s flag: "This flag will be returned to this brigade in a free Havana."'
    n: Remarks in Miami at the Presentation of the Flag of the Cuban Invasion Brigade (Dec. 29, 1962). See [[cal.1961-04-15.cuba]].
  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    thread: vietnam
    c: Ap Bac. The ARVN 7th Division, with American helicopters and advisers, fails against a Viet Cong battalion. Five helicopters down; three Americans killed. Vann briefs Halberstam and Sheehan; Harkins calls it a victory. Hilsman and Forrestal in Saigon.
    n: 'Toczek, *The Battle of Ap Bac* (Viet. II.B.10). Sheehan, *A Bright Shining Lie* (Viet. II.B.10). Halberstam, *The Making of a Quagmire* (Viet. I.C). See [[cal.1961-01-28.vietnam]]. Names: Vann (Viet. III.C); Harkins (Viet. III.D); Huynh Van Cao (Viet. III.G); Halberstam, Sheehan (Viet. III.F); Hilsman, Forrestal (Viet. III.A).'
  - id: cal.1963-01-03.congress
    when: Jan. 3
    date: '1963-01-03'
    thread: congress
    c: 87th Congress ends at noon. 88th convenes Jan. 9.
    n: See [[cal.1961-01-03.rules]]; [[cal.1961-11-16.congress]].
    tags: [congress:88]
