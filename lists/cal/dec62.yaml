# Cal. XXXVII December 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVII
entries:
  - id: cal.1962-12-02.goldwater
    when: Dec. 2
    date: '1962-12-02'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Jan. 1963, he receives White: not a candidate; the draft not disowned. Check the number.'
    n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). [[w.white-making-of-the-president-1965]]. See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White, Rockefeller, Goldwater.'
    tags: [name:white-f-clifton, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1962-12-03.japan-and-korea
    when: Dec. 3–5
    date: '1962-12-03'
    thread: japan-and-korea
    c: 'Second meeting of the Joint Committee, Washington. Kennedy at lunch, Dec. 3: Japan''s growth "the most extraordinary, modern industrial miracle"; the two to work as partners against a Chinese domination of Asia. Rusk and Dillon to Ōhira, apart: Japanese purchases of American arms to offset the dollars spent on the bases.'
    n: '[Remarks at a Luncheon in Honor of a Japanese Trade Delegation](https://www.presidency.ucsb.edu/documents/remarks-luncheon-honor-japanese-trade-delegation) (Dec. 3, 1962). FRUS 1961–63, XXII, docs. [361](https://history.state.gov/historicaldocuments/frus1961-63v22/d361), [362](https://history.state.gov/historicaldocuments/frus1961-63v22/d362). See [[cal.1961-11-02.japan-and-korea]]. Names: Kennedy, Rusk, Dillon, Ōhira.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:dillon-c-douglas, name:ohira-masayoshi]
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: 'Sylvester, Pentagon spokesman: the government''s right to lie to save itself in a nuclear crisis. "Managed news."'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-157) (Feb. 7, 1963). [[w.salinger-with-kennedy]]. See [[cal.1961-01-25.press-and-broadcasting]]. Names: Sylvester.'
    tags: [name:sylvester-arthur]
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Alsop and Bartlett, *Saturday Evening Post*, Dec. 8: Stevenson "wanted a Munich." Bartlett a Kennedy friend. Stevenson stays.'
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-177) (Dec. 12, 1962). [[w.martin-adlai-stevenson-and-the]]. See [[cal.1962-05-24.missile-crisis]]. Names: Alsop, Bartlett, Stevenson.'
    tags: [name:alsop-stewart, name:stevenson-adlai-e, name:kennedy-john-f, name:bartlett-charles]
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    c: New York newspaper strike begins. 114 days.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-163) (Jan. 24, 1963); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-160) (Feb. 21, 1963). See [[cal.1961-01-25.press-and-broadcasting]].'
  - id: cal.1962-12-09.opinion-5
    when: Dec. 9
    date: '1962-12-09'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: choice for 1964: Rockefeller 41, Nixon 21, Romney 15, Goldwater 11, Dirksen 4, Scranton 3; others, no preference 5. Republicans, by second choices reallocated to four: Rockefeller 52, Goldwater 16, Romney 15, Scranton 5.'
    n: '[[w.gallup-poll]], III, 1793–94. Names: Rockefeller, Romney, Scranton, Nixon, Goldwater, Dirksen.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:dirksen-everett, name:scranton-william-w]
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
    c: McNamara in London tells Thorneycroft Skybolt will likely be cancelled.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-177) (Dec. 12, 1962). [FRUS 1961–63, XIII, doc. 401](https://history.state.gov/historicaldocuments/frus1961-63v13/d401). [[w.neustadt-report-to-jfk]]. Names: McNamara, Thorneycroft.'
    tags: [name:mcnamara-robert-s, name:thorneycroft-peter]
  - id: cal.1962-12-12.opinion-5
    when: Dec. 12
    date: '1962-12-12'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: the four, by region: Rockefeller 50 in the East, 44 in the Midwest, 42 in the South, 55 in the West. Goldwater 12 to 16.'
    n: '[[w.gallup-poll]], III, 1794–95. Names: Rockefeller, Romney, Scranton, Goldwater.'
    tags: [name:rockefeller-nelson, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w]
  - id: cal.1962-12-12.europe-and-the-alliance
    when: Dec. 12–13
    date: '1962-12-12'
    thread: europe-and-the-alliance
    also: [missile-crisis]
    c: 'The Jupiters. At Paris for NATO''s ministers, Rusk to the Turkish Foreign Minister, Dec. 12; McNamara to the Turkish and Italian defense ministers, Dec. 13: the Jupiters dismantled by Apr. 1, Polaris submarines in the Mediterranean in their place, each government to share in their targeting. McNamara''s letter, Jan. 5. Turkey accepts in principle, Jan. 27, with conditions: nuclear weapons for its F-100 squadrons first.'
    n: 'FRUS 1961–63, XVI, docs. [384](https://history.state.gov/historicaldocuments/frus1961-63v16/d384), [386](https://history.state.gov/historicaldocuments/frus1961-63v16/d386) (the letter), [390](https://history.state.gov/historicaldocuments/frus1961-63v16/d390), [394](https://history.state.gov/historicaldocuments/frus1961-63v16/d394). See [[cal.1961-04-06.europe-and-the-alliance]], [[cal.1962-10-27.missile-crisis]]. Names: Rusk, McNamara.'
    tags: [name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1962-12-13.legislatures-us
    when: Dec. 13
    date: '1962-12-13'
    thread: legislatures
    also: [court]
    c: 'Advisory Commission on Intergovernmental Relations, *Apportionment of State Legislatures*, adopted: both houses of a State legislature to be apportioned strictly by population; where population is the only factor, districts within 10 percent of the average; the courts to leave the drawing of districts to the legislature or a board. Governors Smylie and Hollings and four others dissent: population "unless the people directly determine otherwise."'
    n: '[ACIR, *Apportionment of State Legislatures* (A-15, Dec. 1962)](https://library.unt.edu/gpo/ACIR/Reports/policy/a-15.pdf#page=81). [[w.baker-reapportionment-revolution]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Smylie, Hollings.'
    tags: [name:smylie-robert-e, name:hollings-ernest-f]
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'Economic Club of New York. Cut rates for persons and business: "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget."'
    n: '[Address and Question and Answer Period at the Economic Club of New York](https://www.presidency.ucsb.edu/documents/address-and-question-and-answer-period-the-economic-club-new-york) (Dec. 14, 1962). [[w.heller-new-dimensions-of-political]]; [[w.stein-fiscal-revolution-in-america]]. See [[cal.1961-01-05.economy]]. Names: Heller.'
    tags: [name:kennedy-john-f, name:heller-walter-w]
  - id: cal.1962-12-14.space
    when: Dec. 14
    date: '1962-12-14'
    thread: space
    c: Mariner 2 passes Venus. First planetary flyby.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-12-14.africa
    when: Dec. 14
    date: '1962-12-14'
    thread: africa
    c: 'NSAM 211: Kennedy asks for a strategy for Algeria, from emergency relief toward development, American aid supplementing France''s; a report by the end of January.'
    n: FRUS 1961–63, XXI, doc. [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77). See [[cal.1962-10-15.africa]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-17.press-and-broadcasting
    when: Dec. 17
    date: '1962-12-17'
    thread: press-and-broadcasting
    c: '"After Two Years." An hour with three network correspondents.'
    n: '[Television and Radio Interview: "After Two Years—a Conversation with the President"](https://www.presidency.ucsb.edu/documents/television-and-radio-interview-after-two-years-conversation-with-the-president) (Dec. 17, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-17.georgia-atlanta
    when: Dec. 17–18
    date: '1962-12-17'
    thread: georgia
    also: [open-housing]
    c: Atlanta. A Negro having bought a house in Peyton Forest, white homeowners ask for barricades across Peyton and Harlan Roads; the Board of Aldermen votes them, Allen signs, and they go up the next day. Jan. 7, the aldermen vote to keep them; Mar. 1, a Fulton Superior Court judge holds them unconstitutional.
    n: '[Order, *Googer v. City of Atlanta*, No. A-97679 (Fulton Super. Ct. Mar. 1, 1963)](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/7304) (Ivan Allen Jr. Mayoral Records, Box 17, Folder 11). [Wikipedia, "Atlanta''s Berlin Wall"](https://en.wikipedia.org/wiki/Atlanta''s_Berlin_Wall); *Time*, Jan. 18, 1963, "The South: Divided City." [[w.kruse-white-flight]]; [[w.allen-mayor]]; [[w.stone-regime-politics]]. Names: Allen.'
    tags: [name:allen-ivan-jr, state:ga, city:atlanta]
  - id: cal.1962-12-17.open-housing-co
    when: Dec. 17
    date: '1962-12-17'
    thread: open-housing
    also: [states-and-cities]
    c: '*Colorado Anti-Discrimination Commission v. Case*, 151 Colo. 235: the Colorado Supreme Court sustains the State''s Fair Housing Act of 1959 and the Commission''s order under it. Check the holding and the vote.'
    n: '*Colorado Anti-Discrimination Commission v. Case*, [151 Colo. 235](https://static.case.law/colo/151/html/0235-01.html), 380 P.2d 34 (1962). [[w.peirce-mountain-states-of-america]].'
    tags: [state:co]
  - id: cal.1962-12-18.europe-and-the-alliance
    when: Dec. 18–21
    date: '1962-12-18'
    thread: europe-and-the-alliance
    c: Nassau. Polaris for Britain in place of Skybolt, assigned to a NATO force. The same offered de Gaulle.
    n: '[Joint Statement Following Discussions With Prime Minister Macmillan - The Nassau Agreement](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-macmillan-the-nassau-agreement) (Dec. 21, 1962). FRUS 1961–63, XIII, docs. [402](https://history.state.gov/historicaldocuments/frus1961-63v13/d402), [403](https://history.state.gov/historicaldocuments/frus1961-63v13/d403), [407](https://history.state.gov/historicaldocuments/frus1961-63v13/d407). [[w.macmillan-at-the-end-of]]. [[w.neustadt-report-to-jfk]]. See [[cal.1961-12-21.europe-and-the-alliance]]. Names: Macmillan, de Gaulle.'
    tags: [name:de-gaulle-charles, name:kennedy-john-f, name:macmillan-harold]
  - id: cal.1962-12-19.testing
    when: Dec. 19
    date: '1962-12-19'
    thread: testing
    c: Khrushchev offers two or three on-site inspections a year. Washington wants more.
    n: '[FRUS vol. 6](https://history.state.gov/historicaldocuments/frus1961-63v06). [[w.seaborg-kennedy-khrushchev-and-the]]. See [[cal.1961-09-01.testing]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1962-12-19.middle-east
    when: Dec. 19
    date: '1962-12-19'
    thread: middle-east
    c: 'Washington recognizes the Yemen Arab Republic. The YAR''s statement of Dec. 18, written to an American text: it will honor the treaties of previous governments. The UAR''s of Dec. 19: a phased withdrawal of its troops as Saudi and Jordanian support of the royalists ends.'
    n: 'FRUS 1961–63, XVIII, docs. [96](https://history.state.gov/historicaldocuments/frus1961-63v18/d96), [114](https://history.state.gov/historicaldocuments/frus1961-63v18/d114), [116](https://history.state.gov/historicaldocuments/frus1961-63v18/d116) (editorial note: the statements and the recognition). See [[cal.1962-09-26.middle-east]].'
  - id: cal.1962-12-20.latin-america
    when: Dec. 20
    date: '1962-12-20'
    thread: latin-america
    c: Bosch elected president of the Dominican Republic.
    n: 'See [[cal.1961-05-30.latin-america]]. Names: Bosch.'
    tags: [name:bosch-juan]
  - id: cal.1962-12-20.mississippi-us
    when: Dec. 20
    date: '1962-12-20'
    thread: mississippi
    also: [voting-rights]
    c: The legislature rejects the poll tax amendment, the one State to vote it down. Its poll tax stands for State elections.
    n: House Manual (116th Cong.), [118](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg118.htm). Check the legislature's journals. [[w.lawson-black-ballots]]. See [[cal.1962-11-14.voting-rights-us]].
    tags: [state:ms]
  - id: cal.1962-12-23.cuba
    when: Dec. 23–24
    date: '1962-12-23'
    thread: cuba
    also: [robert-kennedy]
    c: 'Bay of Pigs prisoners flown to Homestead, Fla. Ransom: about $53 million in drugs and food. Donovan''s deal.'
    n: '[FRUS 1961–63, XI, doc. 255](https://history.state.gov/historicaldocuments/frus1961-63v11/d255). Donovan (see [[cal.1962-02-10.berlin-and-vienna]]). See [[cal.1962-04-08.cuba]]. Names: Donovan, Robert F. Kennedy.'
    tags: [name:donovan-james-b, name:kennedy-robert-f]
  - id: cal.1962-12-26.vietnam
    when: Dec. 26
    date: '1962-12-26'
    thread: vietnam
    c: Mansfield reports to Kennedy at Palm Beach. The war not being won; more Americans make it an American war. Check the date.
    n: 'Mansfield''s report of Dec. 18, [FRUS vol. 2, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v02/d330). [[w.al-vietnam-and-southeast-asia]]; [[w.oberdorfer-senator-mansfield-2003]]; [[w.mann-grand-delusion]]. See [[cal.1961-01-28.vietnam]]. Names: Mansfield.'
    tags: [name:mansfield-mike, name:kennedy-john-f]
  - id: cal.1962-12-27.middle-east
    when: Dec. 27
    date: '1962-12-27'
    thread: middle-east
    c: 'Kennedy and Meir at Palm Beach, 70 minutes. Kennedy: the United States has "a special relationship with Israel in the Middle East really comparable only to that which it has with Britain"; but it cannot make Israel its exclusive friend in the region.'
    n: 'FRUS 1961–63, XVIII, doc. [121](https://history.state.gov/historicaldocuments/frus1961-63v18/d121). [[w.gazit-president-kennedys-policy-toward]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-decade-of-transition]]; [[w.bass-support-any-friend]]. Names: Meir.'
    tags: [name:kennedy-john-f, name:meir-golda]
  - id: cal.1962-12-28.congo
    when: Dec. 28
    date: '1962-12-28'
    thread: congo
    c: UN forces take Elisabethville. Katanga's secession ends in January.
    n: FRUS 1961–63, XX, docs. [387](https://history.state.gov/historicaldocuments/frus1961-63v20/d387), [388](https://history.state.gov/historicaldocuments/frus1961-63v20/d388). See [[cal.1961-02-13.congo]].
  - id: cal.1962-12-29.cuba
    when: Dec. 29
    date: '1962-12-29'
    thread: cuba
    c: 'Orange Bowl. Kennedy takes the brigade''s flag: "This flag will be returned to this brigade in a free Havana."'
    n: '[Remarks in Miami at the Presentation of the Flag of the Cuban Invasion Brigade](https://www.presidency.ucsb.edu/documents/remarks-miami-the-presentation-the-flag-the-cuban-invasion-brigade) (Dec. 29, 1962). See [[cal.1961-04-15.cuba]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-12.cities-and-housing-nyc
    when: Dec.
    date: 1962-12
    thread: cities-and-housing
    also: [transportation]
    c: New York. The Board of Estimate, after a hearing of six hours, sets aside Moses's Lower Manhattan Expressway, an elevated highway across Broome Street from the Holland Tunnel to the East River bridges; Jacobs among its opponents. Check the date (Dec. 6 or 11) and the vote. Moses brings back a revised plan in May 1963.
    n: '[*New York Times*, Dec. 4, 1962](https://www.nytimes.com/1962/12/04/archives/relocation-report-is-help-to-downtown-expressway-relocation-plan.html); [Dec. 7](https://www.nytimes.com/1962/12/07/archives/expressway-vote-delayed-by-city-final-decision-is-postponed-after.html); [Wikipedia, "Interstate 78 in New York"](https://en.wikipedia.org/wiki/Interstate_78_in_New_York). [[w.flint-wrestling-with-moses]]; [[w.caro-power-broker]]; [[w.robert-moses-and-the]]; [[w.zipp-manhattan-projects]]. Names: Moses, Jacobs.'
    tags: [state:ny, city:nyc, name:jacobs-jane, name:moses-robert]
  - id: cal.1962-12.states-and-cities-us
    when: Dec.
    date: 1962-12
    thread: states-and-cities
    also: [court, legislatures]
    c: 'The Council of State Governments'' General Assembly of the States, at Chicago, recommends three amendments to the Constitution, to be sought by applications of the legislatures: an amendment proposed by two-thirds of the legislatures in identical texts to go to the States without action by Congress; the apportionment of State legislatures taken from the federal courts; a Court of the Union, the fifty State chief justices, to review the Supreme Court''s judgments. Check the place and days.'
    n: '"Amending the Constitution to Strengthen the States in the Federal System," 36 *State Government* 10 (1963) (Check). [[w.black-proposed-amendment-of-article]]; [[w.kurland-court-of-the-union]]; [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1962-03-26.court]].'
