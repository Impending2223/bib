# Cal. XXVI December 1962–January 3, 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXVI
entries:
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: Arthur Sylvester, the Pentagon's spokesman, on the government's right, in a nuclear crisis, to lie to save itself. "Managed news" becomes the charge. Check the date.
    n: Salinger, *With Kennedy* (K–J Adm. II.G.2).
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Stewart Alsop and Charles Bartlett in the *Saturday Evening Post*: a "nonadmirer" says Stevenson "wanted a Munich." Bartlett is the President''s friend. Kennedy keeps Stevenson.'
    n: Martin (K–J Adm. II.G.4). Check the issue date.
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    c: The New York newspaper strike begins. It lasts 114 days.
    n: Check.
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
    c: McNamara in London tells Thorneycroft that Skybolt, the missile Britain's deterrent was to ride on, will probably be cancelled.
    n: 'Neustadt, *Report to JFK* (see [[cal.1961-12-21.europe-and-the-alliance]]). Names: McNamara (K–J Adm. III.F).'
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'The Economic Club of New York: cut the rates for individuals and business; "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget."'
    n: Address and Question and Answer Period at the Economic Club of New York (Dec. 14, 1962). Heller; Stein (K–J Adm. II.B).
  - id: cal.1962-12-14.space
    when: Dec. 14
    date: '1962-12-14'
    thread: space
    c: Mariner 2 passes Venus, the first visit to another planet.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-12-17.press-and-broadcasting
    when: Dec. 17
    date: '1962-12-17'
    thread: press-and-broadcasting
    c: An hour with three network correspondents, "After Two Years." The office, the crisis, the job.
    n: 'Television and Radio Interview: "After Two Years—a Conversation with the President" (Dec. 17, 1962). Check the title.'
  - id: cal.1962-12-18.europe-and-the-alliance
    when: Dec. 18–21
    date: '1962-12-18'
    thread: europe-and-the-alliance
    c: Nassau. Kennedy gives Macmillan Polaris in place of Skybolt, the submarines to be assigned to a NATO force. The same offered to de Gaulle.
    n: Macmillan (K–J Adm. II.G.7). Neustadt (see [[cal.1961-12-21.europe-and-the-alliance]]).
  - id: cal.1962-12-19.testing
    when: Dec. 19
    date: '1962-12-19'
    thread: testing
    c: Khrushchev's letter offers two or three on-site inspections a year. He believes Washington asked no more; Washington had not. The number stalls the comprehensive ban.
    n: FRUS vol. 6. Seaborg (K–J Adm. II.D).
  - id: cal.1962-12-20.latin-america
    when: Dec. 20
    date: '1962-12-20'
    thread: latin-america
    c: Juan Bosch elected president of the Dominican Republic.
    n: 'Names: Bosch (K–J Adm. III.J).'
  - id: cal.1962-12-23.cuba
    when: Dec. 23–24
    date: '1962-12-23'
    thread: cuba
    c: The Bay of Pigs prisoners flown to Homestead. Donovan's deal with Castro, paid in some $53 million of drugs and food.
    n: See [[cal.1962-04-08.cuba]]. Donovan (see [[cal.1962-02-10.berlin-and-vienna]]).
  - id: cal.1962-12-26.vietnam
    when: Dec. 26
    date: '1962-12-26'
    thread: vietnam
    c: Mansfield, back from Saigon, reports to Kennedy at Palm Beach. The war is not being won; more Americans will only make it ours. Kennedy is angry, and later says Mansfield was right. Check the date.
    n: 'His report (Viet. II.I.3). Oberdorfer, *Senator Mansfield* (K–J Cong. II.I.1). Mann, *A Grand Delusion* (K–J Cong. II.D). Names: Mansfield (Viet. III.E).'
  - id: cal.1962-12-28.congo
    when: Dec. 28
    date: '1962-12-28'
    thread: congo
    c: UN forces move against Katanga and take Elisabethville. Tshombe ends the secession in January.
    n: See [[cal.1961-02-13.congo]].
  - id: cal.1962-12-29.cuba
    when: Dec. 29
    date: '1962-12-29'
    thread: cuba
    c: 'The Orange Bowl. Kennedy receives the brigade''s flag: "This flag will be returned to this brigade in a free Havana."'
    n: Remarks in Miami at the Presentation of the Flag of the Cuban Invasion Brigade (Dec. 29, 1962).
  - id: cal.1963-01-02.vietnam
    when: Jan. 2
    date: '1963-01-02'
    thread: vietnam
    c: Ap Bac. The 7th Division, with American helicopters and advisers, fails to take a Viet Cong battalion dug in by the canals. Five helicopters down, three Americans killed. Vann tells Halberstam and Sheehan; Harkins calls it a victory.
    n: 'Toczek, *The Battle of Ap Bac* (Viet. II.B). Sheehan, *A Bright Shining Lie* (Viet. II.A). Halberstam, *The Making of a Quagmire* (Viet. I.C). Hilsman and Forrestal are in Saigon that week. Names: Vann (Viet. III.C); Harkins (Viet. III.D); Huynh Van Cao (Viet. III.G).'
  - id: cal.1963-01-03.congress
    when: Jan. 3
    date: '1963-01-03'
    thread: congress
    c: The 87th Congress ends at noon. The 88th convenes Jan. 9.
    n: See [[cal.1961-01-03.rules]].
