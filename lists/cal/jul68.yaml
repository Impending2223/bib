# Cal. CV July 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CV
entries:
  - id: cal.1968-07-01.testing
    when: July 1
    date: '1968-07-01'
    thread: testing
    also: [soviet-union]
    c: 'Treaty on the Non-Proliferation of Nuclear Weapons signed at Washington, London and Moscow, [21 U.S.T. 483](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-21-1/lltreaties-21-1.pdf#page=491), [729 U.N.T.S. 161](https://treaties.un.org/doc/Publication/UNTS/Volume%20729/volume-729-I-10485-English.pdf). In the East Room, Rusk for the United States; fifty-six states sign at Washington. The nonnuclear states not to make or receive nuclear weapons; safeguards of the IAEA; the nuclear powers to negotiate on ending the arms race. Johnson announces agreement with the Soviet Union "to enter in the nearest future into discussions on the limitation and the reduction of both offensive strategic nuclear weapons delivery systems and systems of defense against ballistic missiles." After the signing, Rusk to Dobrynin: Johnson thinking of another meeting with Kosygin.'
    n: '[Remarks at the Signing of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-nuclear-nonproliferation-treaty) (July 1, 1968). FRUS 1964–68, XIV, doc. [278](https://history.state.gov/historicaldocuments/frus1964-68v14/d278). [[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]; [[w.maddock-nuclear-apartheid]]; [[w.newhouse-cold-dawn]]. See [[cal.1968-06-12.testing]]; [[cal.1968-06-21.testing]]. Names: Rusk, Dobrynin, Kosygin, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly, name:kosygin-aleksei]
  - id: cal.1968-07-01.immigration
    when: July 1
    date: '1968-07-01'
    thread: immigration
    c: 'The national origins quota system ends, under the Immigration Act of 1965: 170,000 visas a year outside the Western Hemisphere, by preference, no more than 20,000 to a country; for the first time a ceiling on the Western Hemisphere, 120,000. Johnson to the American Committee on Italian Migration: "No longer will only three nations supply 70 percent of America''s immigrants."'
    n: '[Remarks to the American Committee on Italian Migration on the Occasion of the Termination of the National Origins Quota System](https://www.presidency.ucsb.edu/documents/remarks-the-american-committee-italian-migration-the-occasion-the-termination-the-national) (July 1, 1968). See [[cal.1965-10-03.immigration]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.transportation
    when: July 1
    date: '1968-07-01'
    thread: transportation
    also: [cities-and-housing]
    c: Reorganization Plan No. 2 of 1968 in effect, sent Feb. 26 and not disapproved by Congress. The Urban Mass Transportation Administration in the Department of Transportation; the mass transit programs moved from HUD. HUD keeps the planning grants for the cities' transit.
    n: '[Statement by the President on the Reorganization of Urban Mass Transportation Functions](https://www.presidency.ucsb.edu/documents/statement-the-president-the-reorganization-urban-mass-transportation-functions) (July 1, 1968). Check: the plan''s terms, in the Federal Register. [[w.smerk-urban-transportation]]. See [[cal.1966-10-15.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-01.european-community
    when: July 1
    date: '1968-07-01'
    thread: european-community
    also: [trade]
    c: 'The European Economic Community''s customs union complete, eighteen months ahead of the Treaty of Rome''s schedule: the last duties on trade among the Six removed; the common external tariff in force. Johnson''s message to Rey.'
    n: '[Message to Jean Rey, President of the Commission of the European Communities, on the Occasion of the Completion of the European Customs Union](https://www.presidency.ucsb.edu/documents/message-jean-rey-president-the-commission-the-european-communities-the-occasion-the) (July 1, 1968). See [[cal.1967-11-27.european-community]]. Names: Rey, Johnson.'
    tags: [name:johnson-lyndon-b, name:rey-jean]
  - id: cal.1968-07-02.defense
    when: July 2–3
    date: '1968-07-02'
    thread: defense
    also: [vietnam]
    c: Gen. Harold K. Johnson retires as Army Chief of Staff, July 2, the Distinguished Service Medal at the White House. July 3, Westmoreland Chief of Staff; Abrams, in acting command since Westmoreland left Saigon June 11, commander in Vietnam.
    n: '[Remarks Upon Presenting the Distinguished Service Medal to Gen. Harold K. Johnson, Retiring Chief of Staff, USA](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-gen-harold-k-johnson-retiring) (July 2, 1968); [Remarks at the Presentation of the Distinguished Service Medal to General Westmoreland](https://www.presidency.ucsb.edu/documents/remarks-the-presentation-the-distinguished-service-medal-general-westmoreland) (July 12, 1968). [[w.sorley-honorable-warrior]]; [[w.sorley-westmoreland]]; [[w.sorley-thunderbolt]]; [[w.sorley-better-war]]. Names: Harold K. Johnson, Westmoreland, Abrams, Lyndon Johnson.'
    tags: [name:johnson-lyndon-b, name:johnson-harold-k, name:westmoreland-william, name:abrams-creighton]
  - id: cal.1968-07-03.elections-1968
    when: July 3–4
    date: '1968-07-03'
    thread: elections-1968
    c: 'Minneapolis, the evening of July 3: hecklers keep Wallace from speaking. Johnson, July 4: "Americans of every viewpoint must be deeply concerned over the intolerance which prevented presidential candidate George Wallace from speaking."'
    n: '[Statement by the President on the Disruption by Hecklers of a Speech by George Wallace in Minneapolis](https://www.presidency.ucsb.edu/documents/statement-the-president-the-disruption-hecklers-speech-george-wallace-minneapolis) (July 4, 1968). [[w.carter-politics-of-rage-1995]]; [[w.chester-american-melodrama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, state:mn, city:minneapolis]
  - id: cal.1968-07-03.opinion
    when: July 3
    date: '1968-07-03'
    thread: opinion
    also: [civil-disorders]
    c: 'Gallup, June 13–18: some call this country a "sick society": agree 36 percent, disagree 58. Whites 35 and 60; Negroes 48 and 43. Wallace''s supporters 42 and 51; Nixon''s 36 and 61; Humphrey''s 32 and 61.'
    n: '[[w.gallup-poll]], III, 2138–39. Names: Wallace, Nixon, Humphrey.'
    tags: [name:wallace-george-c, name:nixon-richard-m, name:humphrey-hubert-h]
  - id: cal.1968-07-05.war-opposition
    when: July 5
    date: '1968-07-05'
    thread: war-opposition
    c: 'Flag desecration act signed, [82 Stat. 291](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg291-2.pdf): up to a year in prison and a $1,000 fine for whoever "knowingly casts contempt" on a flag of the United States by publicly mutilating, defacing, defiling, burning or trampling it. Introduced after the burning of flags in Central Park, Apr. 15, 1967.'
    n: Statute (K–J Cong. II.J.2). [[w.goldstein-saving-old-glory]]. See [[cal.1967-04-15.war-opposition]].
  - id: cal.1968-07-05.latin-america
    when: July 5–8
    date: '1968-07-05'
    thread: latin-america
    also: [foreign-aid]
    c: 'Barrientos Ortuño of Bolivia at the LBJ Ranch, July 5. San Salvador, July 6–8: Johnson with the Presidents of El Salvador, Costa Rica, Honduras, Nicaragua and Guatemala at the headquarters of the Organization of Central American States. Joint Declaration, July 6: the Central American Common Market and the integration program of Punta del Este; United States support for a Central American Fund for Economic Integration and the Central American Bank (Check the amounts). July 8, stops at Managua, San José, Guatemala City and San Pedro Sula.'
    n: '[The President''s Toast at a Luncheon at the LBJ Ranch Honoring President Barrientos of Bolivia](https://www.presidency.ucsb.edu/documents/the-presidents-toast-luncheon-the-lbj-ranch-honoring-president-barrientos-bolivia) (July 5, 1968); [Joint Declaration of the Presidents Following Their Meeting in San Salvador](https://www.presidency.ucsb.edu/documents/joint-declaration-the-presidents-following-their-meeting-san-salvador) (July 6, 1968); [Remarks at the Working Session of the Presidents of the Central American Republics in San Salvador](https://www.presidency.ucsb.edu/documents/remarks-the-working-session-the-presidents-the-central-american-republics-san-salvador) (July 6, 1968). [[w.taffet-foreign-aid-as-foreign]]; [[w.lafeber-inevitable-revolutions]]. See [[cal.1967-04-11.latin-america]]. Names: Barrientos Ortuño, Sánchez Hernández, Trejos Fernández, López Arellano, Somoza Debayle, Méndez Montenegro, Johnson.'
    tags: [name:johnson-lyndon-b, name:barrientos-ortuno-rene, name:sanchez-hernandez-fidel, name:trejos-fernandez-jose-joaquin, name:lopez-arellano-oswaldo, name:somoza-debayle-anastasio, name:mendez-montenegro-julio-cesar]
  - id: cal.1968-07-07.opinion
    when: July 7
    date: '1968-07-07'
    thread: opinion
    also: [elections-1968, congress]
    c: 'Gallup, June 13–18, the party one would like to see win this congressional district, the undecided left out: Democratic 58 percent, Republican 42. South 70 and 30; outside the South 55 and 45.'
    n: '[[w.gallup-poll]], III, 2139.'
  - id: cal.1968-07-09.testing
    when: July 9
    date: '1968-07-09'
    thread: testing
    c: 'The nonproliferation treaty sent to the Senate: "the most important international agreement limiting nuclear arms since the nuclear age began." Ninety-five members of the United Nations had voted to commend it; signed at Washington by the United States, Britain, the Soviet Union and fifty-three others.'
    n: '[Special Message to the Senate Urging Consent to the Ratification of the Nuclear Nonproliferation Treaty](https://www.presidency.ucsb.edu/documents/special-message-the-senate-urging-consent-the-ratification-the-nuclear-nonproliferation) (July 9, 1968). See [[cal.1968-07-01.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-10.cities-and-housing
    when: July 10–26
    date: '1968-07-10'
    thread: cities-and-housing
    c: 'The House passes the Housing and Urban Development bill, H.R. 17989, [295–114](https://voteview.com/rollcall/RH0900374), July 10, after limiting the incomes of those the low-income housing may serve, [270–137](https://voteview.com/rollcall/RH0900372), and recommitting it with instructions to strike the upgrading of public housing management and the interim assistance to blighted areas, [217–193](https://voteview.com/rollcall/RH0900373). Johnson, July 11: low- and middle-income housing at ten times any earlier rate; the beginning of 6 million federally subsidized units. The conference report on the Senate''s bill, S. 3497, through the House July 26, [228–135](https://voteview.com/rollcall/RH0900405).'
    n: '[Statement by the President Following House Action on the Housing and Urban Development Act of 1968](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-housing-and-urban-development-act-1968) (July 11, 1968). [[w.haar-between-the-idea-and]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1968-05-28.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-11.court
    when: July 11–23
    date: '1968-07-11'
    thread: court
    also: [confirmations]
    c: 'The Senate Judiciary Committee, Eastland chairman, hears the nominations of Fortas as Chief Justice and Thornberry to his seat. Griffin, leading the Republicans against confirming a "lame duck" President''s nominees, among the first witnesses (Check). Fortas before the committee four days from July 16, the first sitting Justice named Chief Justice to appear (Check the days): questions on his advice to Johnson while on the Court, the Court''s decisions on crime and obscenity. Thurmond on *Mallory v. United States*. The hearings recess July 23 (Check).'
    n: 'Check: *Nominations of Abe Fortas and Homer Thornberry: Hearings Before the Senate Committee on the Judiciary*, 90th Cong., 2d Sess. (1968), not found online. [U.S. Senate Historical Office, "Filibuster Derails Supreme Court Appointment"](https://www.senate.gov/about/powers-procedures/nominations/filibuster-derails-supreme-court-appointment.htm). See [[cal.1968-06-26.court]]. Names: Eastland, Fortas, Thornberry, Griffin, Thurmond, Johnson.'
    tags: [name:eastland-james-o, name:fortas-abe, name:thornberry-william-h, name:griffin-robert-p, name:thurmond-strom, name:johnson-lyndon-b]
  - id: cal.1968-07-11.africa
    when: July 11
    date: '1968-07-11'
    thread: africa
    c: 'Johnson''s appeal on Nigeria: the civilians of the Eastern Region "threatened not just by violence but by starvation"; the United States ready to support the International Committee of the Red Cross with more funds, supplies and equipment; relief "frustrated by disputes on how to get supplies through the lines." "Mass starvation that can be prevented must be prevented."'
    n: '[Statement by the President Appealing for the Prevention of Mass Starvation in Nigeria](https://www.presidency.ucsb.edu/documents/statement-the-president-appealing-for-the-prevention-mass-starvation-nigeria) (July 11, 1968). [[w.thompson-american-policy-and-african]]; [[w.stremlau-international-politics-of-the]]. See [[cal.1967-05-30.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-11.opinion
    when: July 11
    date: '1968-07-11'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, June 26–July 1, with Wallace as a third party''s candidate: Humphrey 40 percent, Nixon 35, Wallace 16, undecided 9. South: Humphrey 33, Wallace 32, Nixon 29. Non-whites: Humphrey 83, Nixon 7. Humphrey 36, Rockefeller 36, Wallace 21; South, Wallace 39, Humphrey 33, Rockefeller 21.'
    n: '[[w.gallup-poll]], III, 2139–43. Names: Humphrey, Nixon, Wallace, Rockefeller.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-07-12.elections-1968
    when: July 12
    date: '1968-07-12'
    thread: elections-1968
    also: [vietnam]
    c: 'New York. Anna Chennault brings Bùi Diễm, South Vietnam''s ambassador, to Nixon; Mitchell present (Check the place). Nixon: Chennault his channel to the South Vietnamese government. The meeting kept secret.'
    n: 'Made public: [[w.chennault-education-of-anna]]; [[w.diem-in-the-jaws-of]]. [[w.hersh-price-of-power]]; [[w.forslund-anna-chennault]]; [[w.hughes-chasing-shadows]]; [[w.farrell-richard-nixon]]; [[w.lafeber-deadly-bet]]; [[w.powers-man-who-kept-the]]; [[w.clifford-counsel-to-the-president-2]]; [[w.berman-no-peace-no-honor]]; [[w.bundy-tangled-web]]; [[w.kimball-nixons-vietnam-war]]; [[w.dallek-flawed-giant]]. Names: Chennault, Bùi Diễm, Nixon, Mitchell.'
    tags: [name:chennault-anna, name:bui-diem, name:nixon-richard-m, name:mitchell-john-n, state:ny, city:nyc]
  - id: cal.1968-07-12.opinion
    when: July 12
    date: '1968-07-12'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, June 26–July 1, with Wallace as a third party''s candidate: McCarthy 39 percent, Nixon 36, Wallace 18, undecided 7. Those 21 to 29: McCarthy 47, Nixon 35. South: Nixon 33, Wallace 32, McCarthy 27. McCarthy 37, Rockefeller 35, Wallace 20; South, Wallace 38, McCarthy 28, Rockefeller 24.'
    n: '[[w.gallup-poll]], III, 2143–47. Names: McCarthy, Nixon, Wallace, Rockefeller.'
    tags: [name:mccarthy-eugene-j, name:nixon-richard-m, name:wallace-george-c, name:rockefeller-nelson]
  - id: cal.1968-07-15.black-nationalism-oakland
    when: July 15
    date: '1968-07-15'
    thread: black-nationalism
    also: [crime-and-hijacking]
    c: Oakland, the Alameda County courthouse. Newton's trial opens for the death of Officer John Frey, Oct. 28, 1967; Charles Garry for the defense. Panthers and "Free Huey" demonstrators outside (Check the date). The verdict in September.
    n: '[[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.seale-seize-the-time]]. See [[cal.1967-10-28.black-nationalism-oakland]]. Names: Newton.'
    tags: [name:newton-huey-p, state:ca, city:oakland]
  - id: cal.1968-07-15.conservation
    when: July 15
    date: '1968-07-15'
    thread: conservation
    c: 'Signed, [82 Stat. 354](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg354-2.pdf): the Land and Water Conservation Fund raised to $200 million a year for five years, revenues under the Outer Continental Shelf Lands Act to make up what other receipts lack. The same day the House passes the Redwood National Park bill, S. 2515, [389–15](https://voteview.com/rollcall/RH0900382), and the national trails bill, H.R. 4865, [378–18](https://voteview.com/rollcall/RH0900386).'
    n: '[Remarks Upon Signing Bill To Enlarge the Land and Water Conservation Fund](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-enlarge-the-land-and-water-conservation-fund) (July 15, 1968). Statute (K–J Cong. II.J.2). See [[cal.1964-09-03.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-15.soviet-union
    when: July 15–Aug. 3
    date: '1968-07-15'
    thread: soviet-union
    also: [europe-and-the-alliance]
    c: 'Czechoslovakia. July 15, the Warsaw letter of the Soviet, Polish, East German, Hungarian and Bulgarian parties to the Czechoslovak party: the danger of counterrevolution. July 22, Rusk to Dobrynin: no truth in the Soviet press''s charges of an American hand in Czechoslovakia; the United States has kept out. July 24, Rostow at lunch: the Soviets will not move militarily. Čierna nad Tisou, July 29–Aug. 1, the Soviet and Czechoslovak Presidiums; Bratislava, Aug. 3, the six parties'' declaration. Beam from Prague, Aug. 4: Dubček "staring down the Soviet threat of force."'
    n: 'FRUS 1964–68, XVII, docs. [65](https://history.state.gov/historicaldocuments/frus1964-68v17/d65), [67](https://history.state.gov/historicaldocuments/frus1964-68v17/d67), [70](https://history.state.gov/historicaldocuments/frus1964-68v17/d70), [72](https://history.state.gov/historicaldocuments/frus1964-68v17/d72), [75](https://history.state.gov/historicaldocuments/frus1964-68v17/d75), [77](https://history.state.gov/historicaldocuments/frus1964-68v17/d77). Made public: FRUS 1964–68, XVII (1996). [[w.williams-prague-spring-and-its]]; [[w.dawisha-kremlin-and-the-prague]]; [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1968-03-22.soviet-union]]. Names: Rusk, Dobrynin, Rostow, Beam, Dubček.'
    tags: [name:rusk-dean, name:dobrynin-anatoly, name:rostow-walt-w, name:beam-jacob-d, name:dubcek-alexander]
  - id: cal.1968-07-16.health
    when: July 16
    date: '1968-07-16'
    thread: health
    also: [foreign-aid]
    c: 'A Committee on Population and Family Planning, eighteen members, Cohen and John D. Rockefeller 3d its cochairmen: the federal role in research on fertility control and contraceptives; access for all families to information and services "to plan the number and spacing of their children"; help to the developing countries; the cost of a five-year program.'
    n: '[Statement by the President Upon Appointing the Committee on Population and Family Planning](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-appointing-the-committee-population-and-family-planning) (July 16, 1968). [[w.critchlow-intended-consequences]]. Names: Cohen, Rockefeller, Johnson.'
    tags: [name:johnson-lyndon-b, name:cohen-wilbur-j, name:rockefeller-john-d]
  - id: cal.1968-07-17.foreign-aid
    when: July 17–31
    date: '1968-07-17'
    thread: foreign-aid
    also: [japan-and-korea]
    c: 'Foreign Assistance Act of 1968, H.R. 15263. Johnson, July 17: the lowest request in history, already cut $600 million, about 20 percent, by the Foreign Affairs Committee. The House recommits it with instructions to cut some $165 million more, [268–150](https://voteview.com/rollcall/RH0900390), and passes it, [228–184](https://voteview.com/rollcall/RH0900391), July 18. The Senate passes it, [46–28](https://voteview.com/rollcall/RS0900536), July 31, after providing that the ban on aid to Communist countries may not be waived until the *Pueblo*''s crew is released, [43–29](https://voteview.com/rollcall/RS0900528), July 30.'
    n: '[Statement by the President on the Foreign Aid Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-the-foreign-aid-bill) (July 17, 1968); [Recorded Remarks in Support of the Foreign Aid Bill](https://www.presidency.ucsb.edu/documents/recorded-remarks-support-the-foreign-aid-bill) (July 17, 1968). See [[cal.1967-11-08.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-18.vietnam
    when: July 18–20
    date: '1968-07-18'
    thread: vietnam
    c: 'Honolulu. Johnson and Nguyễn Văn Thiệu, July 19–20, a meeting in place of the state visit Thiệu put off. Clifford, back from Saigon (July 13–18), July 18: large attacks expected in I Corps and around Saigon, probably in late August. Joint statement, July 20: South Vietnam''s forces 765,000 in June, more than 800,000 by the year''s end; M-16s for all its forces in 1969; South Vietnam "a full participant playing a leading role" in talks on a settlement; the United States will not support the imposition of "a ''coalition government,''" or any other, on the South. No response from Hanoi to the limitation of the bombing.'
    n: '[Joint Statement Following Discussions With President Thieu of South Vietnam at the Honolulu Conference](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-thieu-south-vietnam-the-honolulu) (July 20, 1968); [Statement to the Press at the Close of the Honolulu Conference](https://www.presidency.ucsb.edu/documents/statement-the-press-the-close-the-honolulu-conference) (July 20, 1968). FRUS 1964–68, VI, docs. [302](https://history.state.gov/historicaldocuments/frus1964-68v06/d302), [303](https://history.state.gov/historicaldocuments/frus1964-68v06/d303), [304](https://history.state.gov/historicaldocuments/frus1964-68v06/d304). [[w.clifford-counsel-to-the-president-2]], 550–553; [[w.johnson-vantage-point]]; [[w.diem-in-the-jaws-of]]; [[w.berman-lyndon-johnsons-war]]. See [[cal.1968-05-13.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu, Clifford.'
    tags: [name:johnson-lyndon-b, name:nguyen-van-thieu, name:clifford-clark, state:hi, city:honolulu]
  - id: cal.1968-07-18.elections-1968
    when: July 18
    date: '1968-07-18'
    thread: elections-1968
    c: Walter Reed Army Hospital. Eisenhower, a patient since his heart attack of April, endorses Nixon (Check the day).
    n: '[[w.frank-ike-and-dick]]; [[w.ambrose-nixon]]; [[w.eisenhower-going-home-to-glory]]. See [[cal.1967-10.elections-1968]]. Names: Eisenhower, Nixon.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1968-07-18.opinion
    when: July 18
    date: '1968-07-18'
    thread: opinion
    also: [court]
    c: 'Gallup, June 26–July 1: the Supreme Court rated excellent 8 percent, good 28, fair 32, poor 21. South: excellent 5, good 18, fair 35, poor 31. College-educated: 14, 34, 27 and 21. Those 50 and over: poor 29.'
    n: '[[w.gallup-poll]], III, 2147–48.'
  - id: cal.1968-07-19.poverty
    when: July 19
    date: '1968-07-19'
    thread: poverty
    also: [crime-and-hijacking]
    c: 'The Senate cites Jeff Fort, leader of the Blackstone Rangers, for contempt, [80–0](https://voteview.com/rollcall/RS0900500), S. Res. 379: he had walked out of the hearing of McClellan''s Permanent Subcommittee on Investigations on the Office of Economic Opportunity''s grant to The Woodlawn Organization, for job training run with the Rangers and the Disciples (Check the grant and the date of the walkout).'
    n: '[[w.moore-almighty-black-p-stone]]. See [[cal.1967-11-15.poverty]]. Names: Fort, McClellan.'
    tags: [name:fort-jeff, name:mcclellan-john-l, state:il, city:chicago]
  - id: cal.1968-07-19.farm
    when: July 19–31
    date: '1968-07-19'
    thread: farm
    c: The farm programs of the Food and Agriculture Act of 1965. The Senate passes S. 3590, a four-year extension, [58–18](https://voteview.com/rollcall/RS0900507), July 20, after refusing a one-year extension, [33–45](https://voteview.com/rollcall/RS0900501), and a three-year, [40–40](https://voteview.com/rollcall/RS0900503), and a limit of $25,000 a year on the payments to one recipient, [25–47](https://voteview.com/rollcall/RS0900504). The House, July 31, recommits its bill, H.R. 17126, with instructions for a limit of $20,000, [230–160](https://voteview.com/rollcall/RH0900411), and passes it, [213–176](https://voteview.com/rollcall/RH0900412).
    n: '[[w.cochrane-american-farm-policy-1948]]; [[w.hansen-gaining-access]]. See [[cal.1967-09-27.farm]].'
  - id: cal.1968-07-21.states-and-cities-us
    when: July 21–24
    date: '1968-07-21'
    thread: states-and-cities
    also: [civil-rights-the-executive]
    c: Cincinnati. The National Governors' Conference, its 60th meeting. July 23, Johnson to the governors. July 24, Romney's "Declaration of Conscience," against racism, human rights and property rights "interlinked," adopted by a show of hands, 21–5, the governors of Alabama and Georgia speaking against. Ellington elected chairman.
    n: '*Proceedings of the National Governors'' Conference, 1968*, [89–92](https://www.nga.org/wp-content/uploads/2021/03/1968NGAAnnualMeeting.pdf#page=104), 105. [Remarks Before the National Governors'' Conference in Cincinnati](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-governors-conference-cincinnati) (July 23, 1968). [[w.sparacino-democratic-and-republican-governors]]. See [[cal.1968-02-28.states-and-cities-us]]. Names: Johnson, Romney, Maddox, Ellington.'
    tags: [name:johnson-lyndon-b, name:romney-george-w, name:maddox-lester, name:ellington-buford]
  - id: cal.1968-07-21.opinion
    when: July 21
    date: '1968-07-21'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, June 13–18, McCarthy''s supporters, with Rockefeller, Humphrey and Wallace (the American Independent party''s) the candidates: Humphrey 62 percent, Rockefeller 33, Wallace 2. June 26–July 1, Rockefeller''s supporters, with Nixon, McCarthy and Wallace: Nixon 59, McCarthy 34, Wallace 3.'
    n: '[[w.gallup-poll]], III, 2149. Names: McCarthy, Rockefeller, Humphrey, Wallace, Nixon.'
    tags: [name:mccarthy-eugene-j, name:rockefeller-nelson, name:humphrey-hubert-h, name:wallace-george-c, name:nixon-richard-m]
  - id: cal.1968-07-23.civil-disorders
    when: July 23–27
    date: '1968-07-23'
    thread: civil-disorders
    also: [black-nationalism]
    c: 'Cleveland, Glenville, the night of July 23–24: gunfire for some four hours between the police and Ahmed Evans''s Black Nationalists of New Libya. Three policemen killed, three of the gunmen, a bystander; at least fifteen wounded. Stokes keeps white policemen out of the area, Negro leaders and Negro police to patrol it; looting and burning go on; the National Guard and the rest of the police sent in (Check the days). Over July 27.'
    n: '[[w.masotti-shoot-out-in-cleveland]]; [[w.stokes-promises-of-power]]. Check: the counts, in Masotti and Corsi. See [[cal.1966-07-18.states-and-cities]]. Names: Evans, Stokes.'
    tags: [name:evans-fred, name:stokes-carl-b, state:oh, city:cleveland]
  - id: cal.1968-07-23.economy
    when: July 23
    date: '1968-07-23'
    thread: economy
    also: [jobs-and-wages]
    c: 'At Austin. Johnson underlines the Cabinet Committee on Price Stability''s call for restraint in wages and prices: the tax bill "cannot do the entire job by itself"; more than 250 large contracts expire, August through December, among them steel, aerospace, longshoring, coal, airlines and railroads. That night, Cincinnati, the National Governors'' Conference: more than fifty major bills before Congress.'
    n: '[Statement by the President on the Need for Restraint by Business and Labor in the Interest of Economic Stability](https://www.presidency.ucsb.edu/documents/statement-the-president-the-need-for-restraint-business-and-labor-the-interest-economic) (July 23, 1968); [Remarks Before the National Governors'' Conference in Cincinnati](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-governors-conference-cincinnati) (July 23, 1968). [[w.okun-political-economy-of-prosperity]]. See [[cal.1968-06-20.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-24.crime-and-hijacking
    when: July 24
    date: '1968-07-24'
    thread: crime-and-hijacking
    c: 'The House passes the gun bill, H.R. 17735, [305–118](https://voteview.com/rollcall/RH0900398): the mail-order and interstate sale of rifles, shotguns and their ammunition stopped, with the sale to minors. No registration or licensing of owners, which Johnson asked in June. Rifle, shotgun and .22 rimfire ammunition taken out of the bill, [218–205](https://voteview.com/rollcall/RH0900395); exemptions for competition and military training, [225–198](https://voteview.com/rollcall/RH0900397); Poff''s penalties for using a gun in a federal felony, [412–11](https://voteview.com/rollcall/RH0900396). Check: the ammunition amendment''s fate in conference.'
    n: '[[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]; [[w.winkler-gunfight]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Poff, Johnson.'
    tags: [name:poff-richard-h, name:johnson-lyndon-b]
  - id: cal.1968-07-24.opinion
    when: July 24
    date: '1968-07-24'
    thread: opinion
    also: [middle-east]
    c: 'Gallup, June 26–July 1: the main cause of trouble between Israelis and Arabs: ancient enmity 22 percent, territorial rights 16; no opinion 41. In a full-scale war there in the next year or two, the United States to stay out 61; to support Israel 10. In such a war, supply arms and material to Israel: should 24, should not 59; to the Arabs, 3 and 79. Send troops to help Israel: 9 and 77. Another full-scale war likely within five years: is 62, is not 13.'
    n: '[[w.gallup-poll]], III, 2149–50.'
  - id: cal.1968-07-25.students
    when: July 25
    date: '1968-07-25'
    thread: students
    also: [school-aid]
    c: The House passes the Higher Education Amendments, H.R. 15067, [389–15](https://voteview.com/rollcall/RH0900400), after an amendment denying its aid to students convicted of crimes in campus disorders, [260–146](https://voteview.com/rollcall/RH0900399). The Senate had passed its bill, S. 3769, [83–0](https://voteview.com/rollcall/RS0900488), July 15.
    n: '[[w.graham-uncertain-triumph]]. Check: the amendment''s terms. See [[cal.1967-10-18.students]].'
  - id: cal.1968-07-25.testing
    when: July 25–30
    date: '1968-07-25'
    thread: testing
    also: [soviet-union]
    c: 'Kosygin to Johnson, July 25: talks on "the curbing of the strategic armaments race" could begin at Geneva in a month to a month and a half. Johnson, July 30: Geneva and the interval acceptable; talks at the level of heads of government, foreign ministers or special delegations; an announcement, if possible, before the conference of nonnuclear states opens in late August.'
    n: 'FRUS 1964–68, XI, docs. [261](https://history.state.gov/historicaldocuments/frus1964-68v11/d261), [263](https://history.state.gov/historicaldocuments/frus1964-68v11/d263). Made public: FRUS 1964–68, XI (1997). [[w.newhouse-cold-dawn]]; [[w.smith-doubletalk]]; [[w.seaborg-stemming-the-tide]]. See [[cal.1968-06-21.testing]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1968-07-26.elections-1968
    when: July 26
    date: '1968-07-26'
    thread: elections-1968
    also: [vietnam]
    c: 'The candidates briefed. Rusk briefs Wallace at the State Department and the White House, Johnson joining him, 12:45 to 1:05 p.m. Nixon with Johnson in the Cabinet Room, 6 to 7:35 p.m., Rusk and Rostow joining: the talks with the Soviets on offensive and defensive weapons; Paris; the bombing.'
    n: 'FRUS 1964–68, VI, doc. [310](https://history.state.gov/historicaldocuments/frus1964-68v06/d310). Made public: the notes, FRUS 1964–68, VI (2002). [[w.lafeber-deadly-bet]]; [[w.nixon-rn]]. Names: Rusk, Wallace, Nixon, Rostow, Johnson.'
    tags: [name:rusk-dean, name:wallace-george-c, name:nixon-richard-m, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1968-07-26.elections-1968-2
    when: July 26
    date: '1968-07-26'
    thread: elections-1968
    also: [robert-kennedy]
    c: Edward Kennedy will not be a candidate for Vice President (Check the day).
    n: '[[w.clymer-edward-m-kennedy]]. See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy.'
    tags: [name:kennedy-edward-m]
  - id: cal.1968-07-28.opinion
    when: July 28
    date: '1968-07-28'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, July 18–23: Republicans'' choice for 1968: Nixon 60 percent, Rockefeller 23, Reagan 7, Lindsay 4, Percy 2, Hatfield 1, Stassen 1. Independents: Nixon 38, Rockefeller 35, Reagan 10, Lindsay 8.'
    n: '[[w.gallup-poll]], III, 2150. Names: Nixon, Rockefeller, Reagan, Lindsay, Percy, Hatfield, Stassen.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:lindsay-john-v, name:percy-charles-h, name:hatfield-mark-o, name:stassen-harold-e]
  - id: cal.1968-07-29.vietnam
    when: July 29–30
    date: '1968-07-29'
    thread: vietnam
    also: [elections-1968]
    c: 'Harriman and Vance from Paris, July 29: stop all the bombing of the North now; Hanoi''s answer to the "Phase 1-Phase 2" proposal, if any, will be slow and ambiguous. Rusk, after seeing Johnson and Clifford: "stay firmly on our present course"; Hanoi, Moscow and others mounting a campaign to force a halt with nothing in return. July 30, at lunch, Johnson asks Taylor for a report on "this new wave of demands to stop the bombing."'
    n: 'FRUS 1964–68, VI, docs. [312](https://history.state.gov/historicaldocuments/frus1964-68v06/d312), [313](https://history.state.gov/historicaldocuments/frus1964-68v06/d313), [314](https://history.state.gov/historicaldocuments/frus1964-68v06/d314), [316](https://history.state.gov/historicaldocuments/frus1964-68v06/d316). [Johnson and Rusk, 9:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dean-rusk-july-30-1968), July 30, Conversation WH6807-02-13219 (Miller Center). Made public: FRUS 1964–68, VI (2002). [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]; [[w.clifford-counsel-to-the-president-2]]. See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Rusk, Clifford, Taylor, Johnson.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:rusk-dean, name:clifford-clark, name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1968-07-29.africa
    when: July 29
    date: '1968-07-29'
    thread: africa
    c: 'Rhodesia. Executive Order 11419, under the United Nations Participation Act, carrying out Security Council Resolution 253 of May 29: no imports from Southern Rhodesia, no exports to it, no carriage in American ships or aircraft, no transfers of funds, beyond the sanctions of January 1967.'
    n: '[Executive Order 11419—Relating to Trade and Other Transactions Involving Southern Rhodesia](https://www.presidency.ucsb.edu/documents/executive-order-11419-relating-trade-and-other-transactions-involving-southern-rhodesia) (July 29, 1968). [[w.horne-from-the-barrel-of]]; [[w.watts-rhodesias-unilateral-declaration-of]]. See [[cal.1967-01-05.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-29.foreign-aid
    when: July 29
    date: '1968-07-29'
    thread: foreign-aid
    also: [farm]
    c: 'Food for Freedom extended two years, [82 Stat. 450](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg450.pdf): amended to help the balance of payments, to give more for family planning and education, to let local currencies pay for public works. Johnson: self-help, required since 1966, the condition of food aid.'
    n: '[Remarks Upon Signing Bill Extending the Food for Freedom Program](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-extending-the-food-for-freedom-program) (July 29, 1968). Statute (K–J Cong. II.J.2). See [[cal.1966-11-11.foreign-aid]]. Names: Freeman, Johnson.'
    tags: [name:johnson-lyndon-b, name:freeman-orville-l]
  - id: cal.1968-07-29.consumers
    when: July 29
    date: '1968-07-29'
    thread: consumers
    also: [economy]
    c: 'Three securities bills signed. The Williams Act, [82 Stat. 454](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg454.pdf): disclosure in tender offers for a company''s shares. Margin credit on stocks sold over the counter, under the Federal Reserve''s rules, [82 Stat. 452](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg452.pdf). A study of institutional investors by the SEC, [82 Stat. 453](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg453.pdf). Johnson: the mutual fund bill, asked Feb. 16, 1967, still before Congress.'
    n: '[Remarks Upon Signing Bills for the Protection of Investors in Securities](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bills-for-the-protection-investors-securities) (July 29, 1968). Statute (K–J Cong. II.J.2). [[w.seligman-transformation-of-wall-street]]. Names: Cohen, Johnson.'
    tags: [name:johnson-lyndon-b, name:cohen-manuel-f]
  - id: cal.1968-07-30.governors-ar
    when: July 30
    date: '1968-07-30'
    thread: governors
    also: [elections-1968]
    c: 'Arkansas''s Democratic primary for governor, to face Rockefeller: Marion Crank, once Speaker of the House, 106,092, 25.6 percent; Virginia Johnson, wife of Jim Johnson, the nominee of 1966, 86,038, 20.7; Ted Boswell 85,629, 20.6; Bruce Bennett, once attorney general, 15.7; two others. Runoff between Crank and Johnson. The same day, Fulbright renominated for the Senate, 220,684, 52.9 percent, over Jim Johnson, 132,038.'
    n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642) (governor), [593](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=606) (Senate). [[w.urwin-agenda-for-reform]]; [[w.johnson-arkansas-in-modern-america]]. See [[cal.1966-07-26.elections-1966]]. Names: Rockefeller, Crank, Virginia Johnson, James Johnson, Boswell, Bennett, Fulbright.'
    tags: [state:ar, name:rockefeller-winthrop, name:crank-marion-h, name:johnson-virginia, name:johnson-james-d, name:boswell-ted, name:bennett-bruce, name:fulbright-j-william]
  - id: cal.1968-07-31.crime-and-hijacking
    when: July 31
    date: '1968-07-31'
    thread: crime-and-hijacking
    also: [poverty]
    c: 'Juvenile Delinquency Prevention and Control Act signed, [82 Stat. 462](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg462.pdf): grants through HEW to the States and cities for programs of prevention, rehabilitation and training. Johnson: "Criminals are made and not born." The Senate had refused block grants to the States, [34–38](https://voteview.com/rollcall/RS0900485), July 8.'
    n: '[Remarks Upon Signing the Juvenile Delinquency Prevention and Control Act of 1968](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-juvenile-delinquency-prevention-and-control-act-1968) (July 31, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-02-18.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07-31.steel
    when: July 31–Aug. 1
    date: '1968-07-31'
    thread: steel
    also: [economy]
    c: 'The steel contract settled July 30. July 31, Bethlehem raises prices on its mill products nearly 5 percent across the board; Republic follows. Johnson, opening his news conference: the increase "unreasonable" and "should not be permitted to stand"; $600 million a year to consumers. Aug. 1, to the Speaker and the Majority Leader: the largest increase in steel since 1958, in the end more than $1.1 billion in higher prices. U.S. Steel''s selective increases later in August, about 2.5 percent; Bethlehem and the others come down to them (Check).'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1211) (July 31, 1968); [Letter to the Speaker of the House and to the Majority Leader of the Senate on the Steel Price Increases](https://www.presidency.ucsb.edu/documents/letter-the-speaker-the-house-and-the-majority-leader-the-senate-the-steel-price-increases) (Aug. 1, 1968). [[w.tiffany-decline-of-american-steel]]; [[w.hoerr-and-the-wolf-finally]]. See [[cal.1966-08-04.steel]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-07.states-and-cities-nyc
    when: July
    date: 1968-07
    thread: states-and-cities
    c: New York City. Lindsay names Galamison, of the school boycott of 1964, to the Board of Education, enlarged by the legislature's act of the session (the Marchi law), which put off a plan of decentralization for a year (Check the act and its terms).
    n: '[Wikipedia, "Milton Galamison"](https://en.wikipedia.org/wiki/Milton_Galamison). Check: *Laws of New York*, 1968, the act. See [[cal.1968-05-09.states-and-cities-nyc]]. Names: Lindsay, Galamison.'
    tags: [state:ny, city:nyc, name:lindsay-john-v, name:galamison-milton-a]
  - id: cal.1968-07-31.opinion
    when: July 31
    date: '1968-07-31'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, July 18–23, with Wallace as a third party''s candidate: Nixon 40 percent, Humphrey 38, Wallace 16. Rockefeller 36, Humphrey 36, Wallace 21. Rockefeller 36, McCarthy 35, Wallace 20. Nixon 41, McCarthy 36, Wallace 16.'
    n: '[[w.gallup-poll]], III, 2150–51. Names: Nixon, Humphrey, Wallace, Rockefeller, McCarthy.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:rockefeller-nelson, name:mccarthy-eugene-j]
