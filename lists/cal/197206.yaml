  - id: cal.1972-06-06.elections-1972
    when: June 6
    date: '1972-06-06'
    thread: elections-1972
    c: 'Primaries in California, New Jersey, New Mexico and South Dakota. Republican: Nixon in California, New Mexico and South Dakota; unpledged delegates in New Jersey. Democratic: McGovern in California, New Mexico and South Dakota; Chisholm in New Jersey.'
    n: 'Cal., [*Statement of Vote, Consolidated Primary Election, June 6, 1972*, 4–21](https://archive.org/details/statementofvote197072cali/page/n206); N.J., [*Results of the Primary Election Held June 6, 1972*, 3–4](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1972-primary-election.pdf#page=3); [*Official Election Returns for South Dakota, Primary Election, June 6, 1972*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1972P.pdf#page=2). CQ Guide 6th (2010) 415. See [[cal.1972-03-07.elections-1972]]. Names: McGovern, Nixon, Chisholm.'
    tags: [primary:1972-06-06, name:mcgovern-george, name:nixon-richard-m, name:chisholm-shirley]
  - id: cal.1972-06-30.elections-1972
    when: June 30
    date: '1972-06-30'
    thread: elections-1972
    c: 'Washington. The Democratic convention''s Credentials Committee votes 71–61 to seat the Chicago delegates of Singer and Jesse Jackson in place of Daley''s, chosen against the party''s rules. Daley: "Where are the rights of the people to elect who they want as delegates?"'
    n: '[[w.cohen-american-pharaoh]], 522. Check: the day; Cohen and Taylor: ten days before the convention. Names: Daley.'
