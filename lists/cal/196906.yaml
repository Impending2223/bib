    also: [india-and-china-cultural-revolution]
    c: 'Mao on his train at Wuhan hears Hubei''s revolutionary committee and the Wuhan Military Region (Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming): do the work of a third of the people first, no loud methods; politics must not be stiff; prepare for failure; the army men sent to support workers and peasants to learn political work. Leaves for Changsha.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 26, 1969; [[w.mao-zedong-zhuan]], VI, ch. 78 nn.5, 11 (the day he leaves Wuhan, June 26, Mao says to Hubei''s Zeng Siyu 曾思玉 and the others: ''I did not come to talk work with you, I came to rest, being busy at Peking'', n.5; in the record of the talk with Zeng Siyu, Liu Feng 刘丰, Zhang Tixue 张体学 and Fang Ming 方铭, n.11: before going down the main thing is to learn policy and make the policy clear; those in custody, all to be freed, whatever their rank, a nationwide question; the special-case groups are very dangerous, afraid of being right they twist men into counterrevolutionaries; a group worked one or two years with nothing and prefers to be left; he does not wholly oppose special-case groups, which need men of experience, older, with the masses; in Henan, it is said, half the first secretaries of districts and counties are working again, a good experience; the book puts Mao at the East Lake guesthouse, Meiling No. 1, May 31 to June 26, not on his train). Made public: 1993 ([[w.mao-zedong-zai-hubei]], 323, cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.5). Check: the place: the book has Mao at the East Lake guesthouse, Wuchang (Meiling No. 1), May 31 to June 26; the entry puts the talk on his train at Wuhan; and the book''s quotations of the talk (n.11) are not the entry''s. To check: Guan Xiang 官祥 and others, ''Zai Donghu de rizi li'' 《在东湖的日子里》, in [[w.mao-zedong-zai-hubei]], 323 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.5); Mao Zedong 毛泽东, talk with Zeng Siyu 曾思玉, Liu Feng 刘丰, Zhang Tixue 张体学 and Fang Ming 方铭 (record 谈话记录), June 26, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.11). Names: Mao Zedong, Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
