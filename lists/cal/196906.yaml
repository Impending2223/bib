  - id: cal.1969-06-02.china-leadership
    when: June 2
    date: '1969-06-02'
    thread: china-leadership
    c: 'Zhou Enlai notes on Chen Yi''s report of June 1 that the International Problems Study Group (Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen) has three tasks from Mao: stay in factories, schools, communes; study the international situation by reading and discussion and give views; study defense in the same way. They are not to return to their posts and are free of administration some days a week, to study world affairs and help Mao on strategy.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 2, 1969; [[w.zhou-enlai-nianpu-1949-2020]], III, 295–296 (June 2, 1969; Zhou''s note and his earlier words to Chen Yi and the others); [[w.macfarquhar-maos-last-revolution]], 315 (Zhou receives the marshals'' first report in early June). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 281, 301–302, 305, cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35a). To check: [[w.zhou-enlai-nianpu-1949]], III, 281, 301–302, 305 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35a); Zhang Baojun, "Dakai Zhong Mei guanxi damen shimo", in [[w.gongheguo-zhongda-shijian-he]], II, 673–717 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35b); [[w.rongzhen-inside-the-red-star]] (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.35c). Names: Zhou Enlai, Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Mao Zedong, Xiong Xianghui, Yao Guang.'
