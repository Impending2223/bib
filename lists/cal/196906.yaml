  - id: cal.1969-06-12.china-leadership
    when: June 12
    date: '1969-06-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'By Mao''s instruction the Center issues "Opinions on several matters to watch in propagating Mao''s image", saying that propaganda now shows "no stress on politics, a pursuit of form, boasting and waste": without the Center''s approval no more Mao badges are to be made; no "loyalty movement"; no "asking for instructions in the morning and reporting in the evening", no reciting quotations before meals, no bowing to Mao''s portrait, and like formalism.'
