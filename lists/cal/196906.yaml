  - id: cal.1969-06-28.china-leadership
    when: June 28
    date: '1969-06-28'
    place: changsha
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Changsha hears Li Yuan and Hua Guofeng of Hunan''s revolutionary committee: teach and unite the majority; unsettled factions give no unity; liberated cadres may be moved; on the basic accounting unit of the communes he asks what they think; Shimen''s report that the unit must not be changed lightly. Leaves for Nanchang the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 28, 1969; [[w.mao-zedong-zhuan]], VI, ch. 78 n.12 (June 28 in Hunan Mao says to Li Yuan 黎原 and Hua Guofeng 华国锋: ''an extreme left and an extreme right come out because there is such a current of thought in society; the Hunan Provincial Proletarian Revolutionaries'' Great Alliance Committee (Sheng wu lian) was extreme left, was then in fashion, there was an extreme-left current'', n.12; the book gives no place, so no Changsha). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 78). To check: Mao Zedong 毛泽东, talk with Li Yuan 黎原 and Hua Guofeng 华国锋 (record 谈话记录), June 28, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.12). Names: Mao Zedong, Hua Guofeng, Li Yuan.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc, name:hua-guofeng]
  - id: cal.1969-06-28.china-leadership-2
    when: June 28–30
    date: '1969-06-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Mao, in his talks in Hunan and Jiangxi with the local Party, government and army heads, affirms the historical role of the Aug. 1 Nanchang Uprising and the merits of Zhou Enlai and others in it. The nianpu notes that early in the Cultural Revolution some proposed moving Army Day to Sept. 9, the date of Mao's 1927 Autumn Harvest Uprising, and it was dropped because Mao opposed.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 300 (June 28, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong. Check: whether these remarks are in the Mao entries of June 28 and 30.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-28.laos
    when: June 28–July 1
    date: '1969-06-28'
    place: muong-soui
    thread: laos
    also: [vietnam-hanoi]
    c: Mường Sủi. The Vietnamese and Lao forces take all of Mường Sủi and pursue the remnants to the Salaphu Khun junction, threatening Sam Thong and Long Tieng; the campaign ends. By their count the long-held defenses are broken. Khamtay Siphandone says it shows the Lao–Vietnamese forces can beat the "intensified special war"; UPI, June 28, calls it the Americans' costliest battle in Laos since the start of 1969.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 240 and n. 1. See [[cal.1969-06-23.vietnam-hanoi]]. To check: *Lịch sử Quân đội nhân dân Lào*, a Vietnamese translation, in the Institute of Military History, 6 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 240 n. 1). Check: the words; the history renders Khamtay and UPI in Vietnamese.'
    tags: [polity:laos, polity:pathet-lao, polity:drv]
  - id: cal.1969-06-30.china-leadership
    when: June 30
    date: '1969-06-30'
    place: nanchang
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Nanchang hears Cheng Shiqing, Yang Dongliang and Chen Changfeng of Jiangxi''s revolutionary committee and military district: Aug. 1 stays the Army''s day, since the Nanchang rising was the first shot; the Jiangxi daily cannot be renamed Jinggangshan, which belongs to the whole country; 95 percent of cadres freed, good. Arrives Hangzhou the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 30, 1969. Made public: 2013. Names: Mao Zedong, Cheng Shiqing, Yang Dongliang, Chen Changfeng.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06.china-leadership
    when: June, late
    date: 1969-06
    at: before 1969-06-21
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the editorial for the Party''s forty-eighth anniversary, "Long live the Communist Party of China" (*Renmin ribao*, *Jiefangjun bao*, *Hongqi*): "printed as it stands", after he adds "a preliminary" prosperity and changes "strong country" to "country": no more of such boasting. Printed July 1.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, late June 1969; [[w.jianguo-yilai-mao-zedong]], XIX, 9, 18 (June 1969; the book dates Mao''s note ''June 1969''; the editorial is of July 1). Made public: 2013. Names: Mao Zedong.'
