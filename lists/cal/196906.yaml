    c: The whole army begins a round of political study on the situation and new tasks, after the class of cadres in Hanoi; units hold emulation congresses on the resolve to beat the American invaders, and the regions, services and arms in the North sum up four years of beating the air war.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 193. See [[cal.1969-05.vietnam-hanoi]]. Check: the days; the history gives the month.'
