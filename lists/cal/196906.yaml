  - id: cal.1969-06.vietnam-paris
    when: June, after the PRG's formation
    date: 1969-06
    at: after 1969-06-08
    thread: vietnam-paris
    also: [vietnam-hanoi]
    c: Twenty-two socialist and democratic states recognize the Provisional Revolutionary Government and open diplomatic relations with it soon after its formation. By 1971 it has relations with 26.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 96, 226, 236. See [[cal.1969-06-06.vietnam-hanoi]]. Check: the days; the history says "ngay sau khi thành lập", and gives "hơn 20" at p. 226 and 26 for 1971.'
