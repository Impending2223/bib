  - id: cal.1969-06-26.soviet-union-leadership
    when: June 26
    date: '1969-06-26'
    thread: soviet-union-leadership
    c: 'Moscow. The plenum of the Central Committee. Brezhnev reports on the results of the International Meeting of Communist and Workers'' Parties, two hours and forty-five minutes. The speakers, by his list: Shelest, Grishin, Kunaev, Fedoseev, Chiryaev, Kulidzhanov, Epishev, the designer Babakin and Keldysh.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 397–98 (№ 89, Brezhnev''s notes, June 26–27), 444 nn.145–47 (the editors: the report at the Plenum of June 26; the Politburo of June 25 ordered aktiv meetings on the results of the Moscow Meeting and set Brezhnev to report to the Moscow aktiv; the Soviet statement on the Chinese border, approved June 13). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 346 (the secretaries'' record, June 20–26: Brezhnev at Zavidovo June 20–22 on the report on the results of the International Meeting; at the plenum June 26 until 3:20 p.m.). To check: the Plenum''s stenogram and the report as printed; the notes are his list of speakers, not their words. Names: Brezhnev, Shelest, Grishin, Kunaev. Check: [[w.schattenberg-brezhnev]], 214 (214 n.92: RGANI, f. 2, op. 3, d. 159, l. 143–44, a plenum''s file), has Brezhnev on agriculture in June 1969, the oblast and rayon officials invited: the poor harvest of 1967, the food promised to Czechoslovakia, the apathy of the guaranteed wage; whether at this plenum is not shown.'
    src:
      c: 22ae8fb8
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 346: ?'
    tags: [polity:ussr, name:brezhnev-leonid, name:shelest-petro-y, name:yepishev-a-a]
