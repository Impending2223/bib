    c: Zhou Enlai receives those attending the 15th regular meeting on navigation of the Sino-Soviet boundary rivers. The meeting is held at Khabarovsk from June 18 to Aug. 8; the two sides agree on certain concrete questions and sign minutes.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298 (June 11, 1969). Made public: 2020. Names: Zhou Enlai.'
