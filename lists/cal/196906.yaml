  - id: cal.1969-06-04.china-leadership
    when: June 4
    date: '1969-06-04'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai receives the ambassadors about to leave for their posts: the situation is optimistic but they are to expect twists; diplomatic work is to be active, the embassies to make research a main task, "the whole in mind, typical cases in hand"; unity inside the embassy and collective leadership; leaders to set the example and teach the staff to be modest, prudent and plain, neither haughty nor servile; experience is to be summed up and policy carried out. On the giving out of Mao''s portraits and quotations abroad since the Cultural Revolution he stresses being skilful in propaganda abroad and most careful.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 297 (June 4, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-04.china-leadership-2
    when: June 4
    date: '1969-06-04'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai meets the heads of the 68th Army to go over their self-criticism report. On July 30, receiving the members of the Xuzhou-Haizhou study class run by the Center, he says the report is good, its direction right, severe on themselves, self-critical, a high posture.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 297 (June 4, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
