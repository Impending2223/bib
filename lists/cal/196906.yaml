# Cal. CXVI June 1969
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CXVI
entries:
  - id: cal.1969-06-02.china-leadership
    when: June 2
    date: '1969-06-02'
    thread: china-leadership
    c: 'Zhou Enlai notes on Chen Yi''s report of June 1 that the International Problems Study Group (Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen) has three tasks from Mao: stay in factories, schools, communes; study the international situation by reading and discussion and give views; study defense in the same way. They are not to return to their posts and are free of administration some days a week, to study world affairs and help Mao on strategy.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 2, 1969. Made public: 2013. Names: Zhou Enlai, Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Mao Zedong, Xiong Xianghui, Yao Guang.'
    tags: [polity:prc, name:zhou-enlai, name:chen-yi, name:ye-jianying, name:xu-xiangqian, name:nie-rongzhen, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-03.soviet-union-leadership
    when: June 3–4
    date: '1969-06-03'
    thread: soviet-union-leadership
    c: Moscow. Before the International Meeting. Brezhnev meets at Vnukovo, June 3, the delegations of the Hungarian, Polish, Bulgarian, Mongolian, East German and Czechoslovak parties; June 4, he negotiates with their leaders, 10 to 1 and 8 to 10 p.m., and at 1, with Podgorny, meets Ceaușescu's Romanian delegation.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 341 (June 3–4). Made public: 2016. Names: Brezhnev, Podgorny, Ceaușescu.'
    tags: [name:brezhnev-leonid, name:podgorny-nikolai-v, name:ceausescu-nicolae, polity:ussr, polity:romania, polity:poland, polity:czechoslovakia, polity:gdr, polity:hungary, polity:bulgaria, polity:mongolia, vis:only:ussr+bulgaria+czechoslovakia+gdr+hungary+mongolia+poland+romania]
  - id: cal.1969-06-05.soviet-union-leadership
    when: June 5–7
    date: '1969-06-05'
    thread: soviet-union-leadership
    also: [china]
    c: Moscow. The International Meeting of Communist and Workers' Parties opens in the Kremlin's Georgievsky Hall, June 5, 3 p.m., Brezhnev welcoming the delegations; he is at its sittings June 6 and 7, and on June 7 makes his main speech.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 341–342 (June 5–7). Names: Brezhnev. Check: The record says "a large speech"; its text is not in it.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:romania, polity:poland]
  - id: cal.1969-06-09.vietnam-hanoi
    when: June 9
    date: '1969-06-09'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat''s cable no. 111 to the zone, city and provincial secretaries: the people''s congress in the South, led by the Party, has chosen the Provisional Revolutionary Government of the Republic of South Vietnam. A mark of the general offensive''s victories, a blow at the Saigon regime''s claim to legality, a step toward a broad coalition. To be told to the standing committees, spread only after Liberation Radio announces it; provinces to cable their twinned provinces in the South; illusions and impatience both guarded against.'
    n: '*Điện của Ban Bí thư số 111, ngày 9 tháng 6 năm 1969, Về việc thành lập Chính phủ Cách mạng lâm thời Cộng hoà miền Nam Việt Nam* (the title the editors''), signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 189–91. Made public: 2004.'
    tags: [polity:drv, polity:rvn, polity:us, vis:only:drv]
  - id: cal.1969-06-10.vietnam-hanoi
    when: June 10
    date: '1969-06-10'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat''s circular no. 235-TT/TW on hailing and supporting the Provisional Revolutionary Government, a national, democratic and coalition government with the Front''s forces at its core: to be explained from the congress''s documents and the press, with the Front''s ten-point solution; after the Government''s and the National Assembly Standing Committee''s statements of support and recognition, the Fatherland Front and mass bodies to follow.'
    n: '*Thông tri của Ban Bí thư số 235-TT/TW, ngày 10 tháng 6 năm 1969, Về việc hưởng ứng và ủng hộ Chính phủ Cách mạng lâm thời Cộng hoà miền Nam Việt Nam*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 192–95. Made public: 2004. See [[cal.1969-06-09.vietnam-hanoi]].'
    tags: [polity:drv, polity:us, vis:only:drv]
  - id: cal.1969-06-11.china-leadership
    when: June 11
    date: '1969-06-11'
    thread: china-leadership
    also: [soviet-union]
    c: The Chinese Foreign Ministry sends the Soviet ambassador a note of strong protest at a Soviet incursion into the western Barluk area of Yumin county, Xinjiang, and new bloodshed.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 11, 1969. Check: whether the chronology''s day is the date of the note or of the incident.'
    tags: [polity:prc]
  - id: cal.1969-06-11.china-leadership-2
    when: June 11 or 12
    date: '1969-06-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads the Center''s "Some points on propaganda of Chairman Mao''s image" and approves: in the Cultural Revolution waste and ostentation, expensive statues of porcelain, plaster and plastic, bad portraits, ever larger badges, posters everywhere, "treasure-book" stands, "loyalty" rooms and dances. Issued after.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 11 or 12, 1969. See [[cal.1969-06-11.china-leadership]]. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-13.soviet-union-leadership
    when: June 13–17
    date: '1969-06-13'
    thread: soviet-union-leadership
    c: 'Moscow. The International Meeting''s last days: Brezhnev at the sittings June 13 to 16; the closing session June 17, 9 to 12, in the Georgievsky Hall; a reception at 3.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 343–344 (June 13–17). Names: Brezhnev.'
    tags: [name:brezhnev-leonid, polity:ussr]
  - id: cal.1969-06-13.vietnam-hanoi
    when: June 13
    date: '1969-06-13'
    thread: vietnam-hanoi
    c: The Secretariat's circular no. 236-TT/TW dissolves the Region IV Transport Assurance Command and the command boards of Nghệ An, Hà Tĩnh and Quảng Bình, on the Central Military Commission's and the transport Party committee's proposal; the Council's Standing Committee to hear the command's report, settle its stores and give awards.
    n: '*Thông tri của Ban Bí thư số 236-TT/TW, ngày 13 tháng 6 năm 1969, Về việc giải thể hệ thống chỉ huy thống nhất bảo đảm giao thông vận tải Khu IV*, signed for the Secretariat by Lê Văn Lương; circular no. 220 cited at XXIX, 324 (196 n.). [[w.van-kien-dang-toan]], XXX, 196–97. Made public: 2004. See [[cal.1968-08-02.vietnam-hanoi]].'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-06-14.soviet-union-leadership
    when: June 14
    date: '1969-06-14'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev receives the Czechoslovak party delegation led by Husák at his dacha, 6:30 p.m. to 1 a.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 344 (June 14). Names: Brezhnev, Husák.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-06-14.china-leadership
    when: June 14
    date: '1969-06-14'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Mao, Peking: approves the Foreign Ministry''s proposal that China recognize the Provisional Revolutionary Government of the Republic of South Vietnam, and Zhou Enlai''s telegram of congratulation as premier to its president, Huynh Tan Phat.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 14, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Huynh Tan Phat (Huang Jinfa in the Chinese). Check: the day of recognition and publication.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-06-18.soviet-union-leadership
    when: June 18
    date: '1969-06-18'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives the Cuban delegation led by Rodríguez, 4:20 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 344–345 (June 18–19). Names: Brezhnev, Rodríguez.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:cuba, polity:israel]
  - id: cal.1969-06-18.vietnam-hanoi
    when: June 18
    date: '1969-06-18'
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 237-TT/TW on pressing the investigation and denunciation of American war crimes, under circular no. 183-TT/TW of June 28, 1966: the Party groups and committees to see to it; the ministries of Culture, Defense and Public Security and the others concerned to collect the records and evidence.'
    n: '*Thông tri của Ban Bí thư số 237-TT/TW, ngày 18 tháng 6 năm 1969, Về việc đẩy mạnh hơn nữa công tác điều tra tố cáo tội ác của đế quốc Mỹ trong tình hình hiện nay*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 206–8. Made public: 2004.'
    tags: [polity:drv, polity:us, vis:only:drv]
  - id: cal.1969-06-18.vietnam-hanoi-2
    when: June 18
    date: '1969-06-18'
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 238-TT/TW on spreading and enforcing the statute of the higher-level farm cooperatives, adopted by the Government: part of the campaign for the members'' collective mastery; each cooperative''s own rules drawn up; about a month in each base, after the tenth-month transplanting.'
    n: '*Thông tri của Ban Bí thư số 238-TT/TW, ngày 18 tháng 6 năm 1969, Về việc phổ biến và thi hành Điều lệ hợp tác xã sản xuất nông nghiệp*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 209–11. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-06-19.vietnam-hanoi
    when: June 19
    date: '1969-06-19'
    thread: vietnam-hanoi
    also: [laos]
    c: 'The Politburo''s resolution no. 190-NQ/TW on helping "Party X," the Lao People''s Revolutionary Party, build the economy and culture of its liberated zone, run since 1965 on the scale of a state: the aid plans ill fitted to Hanoi''s budget, the advisers too few, transport of goods poor. The three-year plan of aid, 1968–70, to be pressed, a new plan prepared for a lull; the aid organization at home strengthened.'
    n: '*Nghị quyết của Bộ Chính trị số 190-NQ/TW, ngày 19 tháng 6 năm 1969, Về việc giúp Đảng X đẩy mạnh xây dựng kinh tế, phát triển văn hóa ở vùng giải phóng*, signed for the Politburo by Nguyễn Duy Trinh; "Đảng X," the editors'' note (212 n.). [[w.van-kien-dang-toan]], XXX, 212–18. Made public: 2004.'
    tags: [polity:drv, polity:laos, polity:us, vis:only:drv, name:nguyen-duy-trinh]
  - id: cal.1969-06-25.vietnam-hanoi
    when: June 25
    date: '1969-06-25'
    thread: vietnam-hanoi
    c: 'The Secretariat''s circular no. 239-TT/TW on the care and education of children, after the article by "T.L.," Hồ Chí Minh, for June 1: committees, the children''s committee, the schools, the Youth Union and parents to answer for their morals, schooling, health and play, before the 1969–70 school year.'
    n: '*Thông tri của Ban Bí thư số 239-TT/TW, ngày 25 tháng 6 năm 1969, Về việc chăm sóc và giáo dục thiếu niên, nhi đồng*, signed for the Secretariat by Trần Xuân Bách, chief of its office. [[w.van-kien-dang-toan]], XXX, 219–21. Made public: 2004. Names: Hồ Chí Minh.'
    tags: [polity:drv, vis:only:drv, name:ho-chi-minh]
  - id: cal.1969-06-26.soviet-union-leadership
    when: June 26
    date: '1969-06-26'
    thread: soviet-union-leadership
    c: 'Moscow. The plenum of the Central Committee. Brezhnev reports on the results of the International Meeting of Communist and Workers'' Parties, two hours and forty-five minutes. The speakers, by his list: Shelest, Grishin, Kunaev, Fedoseev, Chiryaev, Kulidzhanov, Epishev, the designer Babakin and Keldysh.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 397–98 (№ 89, Brezhnev''s notes, June 26–27), 444 nn.145–47 (the editors: the report at the Plenum of June 26; the Politburo of June 25 ordered aktiv meetings on the results of the Moscow Meeting and set Brezhnev to report to the Moscow aktiv; the Soviet statement on the Chinese border, approved June 13). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 346 (the secretaries'' record, June 20–26: Brezhnev at Zavidovo June 20–22 on the report on the results of the International Meeting; at the plenum June 26 until 3:20 p.m.). To check: the Plenum''s stenogram and the report as printed; the notes are his list of speakers, not their words. Names: Brezhnev, Shelest, Grishin, Kunaev. Check: [[w.schattenberg-brezhnev]], 214 (214 n.92: RGANI, f. 2, op. 3, d. 159, l. 143–44, a plenum''s file), has Brezhnev on agriculture in June 1969, the oblast and rayon officials invited: the poor harvest of 1967, the food promised to Czechoslovakia, the apathy of the guaranteed wage; whether at this plenum is not shown.'
    src:
      c: 22ae8fb8
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 346: ?'
    tags: [polity:ussr, name:brezhnev-leonid, name:shelest-petro-y, name:yepishev-a-a]
  - id: cal.1969-06-26.china-leadership
    when: June 26
    date: '1969-06-26'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao on his train at Wuhan hears Hubei''s revolutionary committee and the Wuhan Military Region (Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming): do the work of a third of the people first, no loud methods; politics must not be stiff; prepare for failure; the army men sent to support workers and peasants to learn political work. Leaves for Changsha.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 26, 1969. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-28.china-leadership
    when: June 28
    date: '1969-06-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Changsha hears Li Yuan and Hua Guofeng of Hunan''s revolutionary committee: teach and unite the majority; unsettled factions give no unity; liberated cadres may be moved; on the basic accounting unit of the communes he asks what they think; Shimen''s report that the unit must not be changed lightly. Leaves for Nanchang the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 28, 1969. Made public: 2013. Names: Mao Zedong, Hua Guofeng, Li Yuan.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc, name:hua-guofeng]
  - id: cal.1969-06-30.china-leadership
    when: June 30
    date: '1969-06-30'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao at Nanchang hears Cheng Shiqing, Yang Dongliang and Chen Changfeng of Jiangxi''s revolutionary committee and military district: Aug. 1 stays the Army''s day, since the Nanchang rising was the first shot; the Jiangxi daily cannot be renamed Jinggangshan, which belongs to the whole country; 95 percent of cadres freed, good. Arrives Hangzhou the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, June 30, 1969. Made public: 2013. Names: Mao Zedong, Cheng Shiqing, Yang Dongliang, Chen Changfeng.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06.china-leadership
    when: June, late
    date: 1969-06
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: the editorial for the Party''s forty-eighth anniversary, "Long live the Communist Party of China" (*Renmin ribao*, *Jiefangjun bao*, *Hongqi*): "printed as it stands", after he adds "a preliminary" prosperity and changes "strong country" to "country": no more of such boasting. Printed July 1.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, late June 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
