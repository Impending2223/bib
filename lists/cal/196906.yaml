  - id: cal.1969-06-10.china-leadership
    when: June 10
    date: '1969-06-10'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai tells the meeting of heads of the State Council''s directly attached departments, army cadres and mass delegates among them, of the plan to cut the government''s departments discussed by the Center: the State Council''s former 61 ministries, commissions and bureaus are merged into 19 working departments. Struggle-criticism-reform in the central Party and state organs has come to settling their organizational form; revolutionary committees in the ministries are to be set up carefully (foreign affairs, finance, defense), not all questions can be taken to them, there must be a core leading group, whose members are to be chosen the more carefully, later the Party group or committee. Many leaders are "standing aside", none are capitalist-roaders, and hardly any ministry can avoid it; levels are to be cut with departments, to raise efficiency; cuts are to suit the place and the matter, and the specific plan is to be taken up and settled by the masses. To grasp revolution is to promote production, and the business most urgent is that of industry and communications. The State Council''s business group is announced to add Ji Dengkui and Li Desheng.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 297–298 (June 10, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-06-10.china-leadership-2
    when: June 10
    date: '1969-06-10'
    time: 1969-06-10T07:00Z
    place: peking
    thread: china-leadership
    also: [south-asia, china]
    c: 'Zhou Enlai receives Pakistan''s ambassador, Kaiser, who hands over President Yahya Khan''s letter inviting Zhou to Pakistan. Zhou: several countries have asked when he can go abroad, but, much occupied at home, he cannot now; many friendly countries understand, and a Pakistani visit too is probably not to be fixed this year.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 298 (June 10, 1969); [[w.zhou-enlai-waijiao-huodong]], 536 (June 10, 1969; 3 p.m., Jiangsu Hall, Great Hall of the People; the book adds that a visit to Pakistan was not possible before National Day, whether in the winter was hard to say, and that if he travelled abroad he would go to Pakistan first); [[w.zhonghua-renmin-gongheguo-waijiao]], 216 (June 10, 1969; Pakistan''s ambassador, Kaiser, hands over President Yahya Khan''s letter inviting Zhou to Pakistan; Zhou cannot go abroad now for the pressure of home affairs, but will go to Pakistan first). Made public: 1993. Names: Zhou Enlai.'
    src:
