  - id: cal.1969-06-06.china
    when: June 6
    date: '1969-06-06'
    thread: china
    also: [soviet-union]
    c: 'Foreign Ministry note to the Soviet embassy: since the Soviet government made the bloody incidents of Mar. 2 and 15 on Zhenbao Island, it has said it is willing to "consult" and at the same time stepped up armed provocation against China. From Mar. 15 to noon on May 28 Soviet troops went on shooting at Zhenbao Island and the depth of Chinese territory with heavy guns and light and heavy machine guns, and spread the armed provocations from the Wusuli to the Heilong River, from water to land, and from the eastern to the western sector, in a run of border incidents. From Mar. 29 to May 31 Soviet aircraft, bombers, fighters and scouts, wilfully violated Chinese airspace 57 times, some going over 60 kilometers deep and flying over 240. China protests with great anger.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 215–216 (June 6, 1969).'
    src:
      c: 77bbef8d
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 215–216: all'
    tags: [polity:prc, polity:ussr]
  - id: cal.1969-06-06.china-leadership
    when: June 6
    date: '1969-06-06'
    thread: china-leadership
    c: 'Mao 毛泽东, on the Air Force Party Committee''s report of May 4 on technical innovation in its units since the Cultural Revolution (230 larger innovations done, over 80 under study), sent by the Military Commission''s Office Group May 29: read with much interest; a single technical change is to be called "technical innovation" (jishu gexin 技术革新), not "technical revolution" (jishu geming 技术革命), which means history''s great changes: steam for hand labor, then electricity, now atomic energy.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 447 (June 6, 1969). The report twice put "technical revolution" beside "technical innovation" (447–448 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Air Force Party Committee, report of May 4, 1969 on technical innovation in the Air Force''s units since the Cultural Revolution, sent to Mao by the Military Commission Office Group May 29 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 447 n.1). Names: Mao Zedong. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
    src:
      c: 7b9ca4e7
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 447: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 447 n.1: all'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-06-06.vietnam-hanoi
    when: June 6–8
    date: '1969-06-06'
    place: war-zone-d
    thread: vietnam-hanoi
    also: [vietnam-paris]
    c: 'War Zone D, at COSVN''s base: the Congress of People''s Representatives of the South, 88 delegates of parties, nationalities, religions, classes and the armed forces and 72 guests. It adopts a program of action, and the five-point position as the basis at Paris, and elects the Provisional Revolutionary Government of the Republic of South Vietnam: Huỳnh Tấn Phát, vice chairman of the Front''s Central Committee, its chairman; Nguyễn Hữu Thọ chairman and Trịnh Đình Thảo vice chairman of its Advisory Council; Trần Nam Trung Defense, Nguyễn Thị Bình Foreign Affairs, Cao Văn Bổn Economy and Finance.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 93–95. Names: Huỳnh Tấn Phát, Nguyễn Hữu Thọ, Trịnh Đình Thảo, Trần Nam Trung, Nguyễn Thị Bình, Cao Văn Bổn.'
    tags: [polity:drv, name:nguyen-huu-tho, name:nguyen-thi-binh]
