  - id: cal.1969-06.china-leadership-4
    when: June
    date: 1969-06
    thread: china-leadership
    also: [defense, china]
    c: 'The forum held by the Military Commission''s Office Group under Huang Yongsheng and Wu Faxian, on Mao''s Ninth Congress instruction to prepare for war and Lin Biao''s call to view, check and carry out everything "by the view of war", puts forward a huge plan for building national defense. The nianpu says it weighed on the outline of the Fourth Five-Year Plan drawn up on Zhou''s instruction: too much stress on heavy industry, especially the Third Front''s military plants, capital construction too large, some output targets too high.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 300 (June 1969); [[w.macfarquhar-maos-last-revolution]], 316 (in June 1969, as the marshals begin, Huang Yongsheng and his colleagues hold two conferences on the threat from the north); [[w.mao-zedong-zhuan]], VI, ch. 78 (in June, on Mao''s view, the Military Commission''s Office Group holds a forum to discuss ''preparing for war''; the book says nothing of its plan, of Huang Yongsheng and Wu Faxian, or of the outline of the Fourth Five-Year Plan). Made public: 2020. To check: [[w.history-of-the-chinese]], 347 (cited by [[w.macfarquhar-maos-last-revolution]], 316 n.37a); Zheng Qian, "60 niandai mo Zhongguo beizhan miwen", in [[w.gongheguo-zhongda-shijian-he]], 634 (cited by [[w.macfarquhar-maos-last-revolution]], 316 n.37b). Names: Zhou Enlai, Huang Yongsheng, Wu Faxian, Lin Biao, Mao Zedong.'
    src:
      c: '95369088'
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 300: ?'
        - 'w.macfarquhar-maos-last-revolution 316: A'
        - 'w.mao-zedong-zhuan VI, ch. 78: ?'
    tags: [polity:prc, name:zhou-enlai, name:huang-yongsheng, name:wu-faxian, name:lin-biao, name:mao-zedong, vis:only:prc]
