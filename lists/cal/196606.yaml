  - id: cal.1966-06-29.vietnam-2
    when: June 29–30
    date: '1966-06-29'
    thread: vietnam-marigold
    c: 'Saigon. D''Orlandi, the Italian ambassador, to Lodge, June 29: Lewandowski, the Polish member of the ICC, has brought a "very specific peace offer" from Hanoi; the NLF to "take part" in negotiations, not as sole representative; a "suspension" of the bombing; American withdrawal on a "reasonable calendar." Lodge, June 30: new in substance, "so forthcoming as to arouse suspicion." Johnson to Martin of the Federal Reserve, June 30: "the most persuasive peace feeler I''ve had since I''ve been President."'
    n: 'FRUS 1964–68, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1964-68v04/d167), [169](https://history.state.gov/historicaldocuments/frus1964-68v04/d169), [170](https://history.state.gov/historicaldocuments/frus1964-68v04/d170). [[w.gibbons-u-s-government-and]], IV, 390–91, 495–98. Made public: in outline, [[w.kraslow-secret-search-for-peace]] (1968); the telegrams, [[w.herring-secret-diplomacy-of-the]] (1983). To check: [[w.hershberg-marigold]]; [[w.herring-secret-diplomacy-of-the]]; [[w.herring-lbj-and-vietnam]]. Names: Lodge, Lewandowski, D''Orlandi, Martin, Johnson.'
    tags: [name:lodge-henry-cabot, name:lewandowski-janusz, name:martin-william-mcchesney-jr, name:johnson-lyndon-b, name:dorlandi-giovanni, place:saigon]
  - id: cal.1966-06-29.middle-east
    when: June 29
    date: '1966-06-29'
    thread: middle-east-iran-arms
    c: 'Iran''s arms. The Shah to Meyer, Pakistan''s case in mind: aircraft from the United States; anti-aircraft arms elsewhere if American prices and terms are not reasonable; more F-4s, and sooner.'
    n: '[FRUS 1964–68, XXII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v22/d148). See [[cal.1964-07-04.middle-east]]. Names: Pahlavi, Meyer.'
    tags: [name:pahlavi-mohammed-reza, name:meyer-armin-h]
  - id: cal.1966-06-29.vietnam-congress
    when: June 29
    date: '1966-06-29'
    thread: vietnam-congress
    c: 'Fulbright invites sixteen Senators to an informal meeting on the war: Democrats Bartlett, Burdick, Church, Clark, Gore, Gruening, Hartke, McCarthy, McGovern, Metcalf, Moss, Nelson, Neuberger and Stephen Young; Republicans Aiken and Cooper. Not Mansfield or Morse.'
    n: '[[w.gibbons-u-s-government-and]], IV, 347–48. To check: Marcy to Fulbright, June 29, 1966 (National Archives, RG 46). Names: Fulbright, Bartlett, Burdick, Church, Clark, Gore, Gruening, Hartke, McCarthy, McGovern, Metcalf, Moss, Nelson, Neuberger, Stephen Young, Aiken, Cooper, Mansfield, Morse.'
    tags: [name:fulbright-j-william, name:bartlett-edward-l, name:burdick-quentin-n, name:church-frank, name:clark-joseph-s, name:gore-albert-sr, name:gruening-ernest, name:hartke-rupert-v, name:mccarthy-eugene-j, name:mcgovern-george, name:metcalf-lee-w, name:moss-frank-e, name:nelson-gaylord-a, name:neuberger-maurine-b, name:young-stephen-m, name:aiken-george-d, name:cooper-john-sherman, name:mansfield-mike, name:morse-wayne]
  - id: cal.1966-06-29.vietnam-congress-2
    when: June 29
    date: '1966-06-29'
    thread: vietnam-congress
    c: 'The Senate on the oil strikes. Russell: "we have exhausted every effort to arrive at negotiations"; Saltonstall, Symington and, in the House, Ford with him. Mansfield: "a new stage in the war," more aid from Moscow and Peking, more infiltration in the end. Aiken: "The President has made a mistake."'
    n: '[[w.gibbons-u-s-government-and]], IV, 377. To check: *New York Times*, June 30, 1966; 112 Cong. Rec., June 29 and 30, 1966. See [[cal.1966-06-29.vietnam]]. Names: Russell, Saltonstall, Symington, Ford, Mansfield, Aiken.'
    tags: [name:russell-richard-b, name:saltonstall-leverett, name:symington-william-s, name:ford-gerald-r, name:mansfield-mike, name:aiken-george-d]
  - id: cal.1966-06-30.medicare
    when: June 30
    date: '1966-06-30'
    thread: medicare
    c: 'Johnson''s statement: "Medicare begins tomorrow"; over 92 percent of the beds in general hospitals already in compliance; hospitals not to discriminate, doctors not to "drive hard bargains."'
    n: 'Statement by the President on the Inauguration of the Medicare Program, [1966 Pub. Papers 676](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=752) (June 30, 1966). See [[cal.1966-06-15.medicare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-30.state-and-city-finance-us
    when: June 30
    date: '1966-06-30'
    thread: state-and-city-finance
    c: Fiscal 1966 closes in forty-seven States. The fifty State governments' taxes for the year $29.4 billion, $150.89 a head; federal aid $11.7 billion; long-term debt $28.5 billion (Census). By Census's columns, first revenue from general sales taxes in Idaho, Massachusetts and New York.
    n: 'Census, [*State Government Finances in 1966*](https://www2.census.gov/programs-surveys/gov-finances/datasets/historical/1900-1992%20State%20Government%20Finance.zip) (GF No. 11, 1967), tables 3, 4, 6, 7, 8, 12, 20. To check: [[w.bureau-data-base-on-historical]]; [[w.bureau-data-base-on-historical-2010]]. See [[cal.1960-06-30.state-and-city-finance-us]].'
    tags: [statefin:1966, state:id, state:ma, state:ny]
  - id: cal.1966-06-30.vietnam-congress
    when: June 30
    date: '1966-06-30'
    thread: vietnam-congress
    c: 'Ball before the Foreign Relations Committee, at its hearings on NATO. Fulbright: the oil strikes "one more step toward the ultimate war"; the only solution contemplated "the surrender of North Vietnam." Ball: the bombing weakens Hanoi''s morale; he has "no doubts or reservations." Moyers to Ball the next day: "a wonderful job for the President."'
    n: 'Daily Digest, [112 Cong. Rec. D340](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=338) (the hearing). [[w.gibbons-u-s-government-and]], IV, 377–78. To check: *New York Times*, July 1, 1966; Ball''s telephone transcripts (LBJ Library, Papers of George Ball, "Presidential Telecons"). See [[cal.1966-06-29.vietnam]]. Names: Ball, Fulbright, Moyers.'
    tags: [name:ball-george-w, name:fulbright-j-william, name:moyers-bill]
