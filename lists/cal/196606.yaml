    c: 'The Senate on the oil strikes. Russell: "we have exhausted every effort to arrive at negotiations";{1} Saltonstall, Symington and, in the House, Ford with him. Mansfield: "a new stage in the war," more aid from Moscow and Peking, more infiltration in the end.{2} Aiken: "The President has made a mistake."{3} Fulbright, Robert Kennedy, Javits and a number of House Democratic liberals agree with Mansfield; Aiken speaks "in a voice quaking with emotion."{4}'
