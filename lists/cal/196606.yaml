    c: Tsinghua University.{1} A work team of more than 500 men and women enters, drawn from the Party committee of the State Council's Industry and Communications Office and headed by Ye Lin, a deputy chairman of the State Economic Commission.{2} Wang Guangmei, Liu Shaoqi's wife, is a member. Ye Lin recalls thirty years later that he was wholly unprepared for the job. Kuai Dafu, a student in the Chemical Engineering Department, recalls that on hearing of the team's arrival that evening he and his classmates applauded endlessly and shouted "Long live the CCP!" and "Long live Chairman Mao!"{3}
    n: '[[w.macfarquhar-maos-last-revolution]], 66, 72; [[w.yang-jisheng-tiandi-fanfu]], I, 192 (June 9 the work group of 513 under Ye Lin 葉林, deputy director of the State Economic Commission 國家經委, enters Tsinghua and takes over all power in the school; the Party committee stopped work the evening before); [[w.dikotter-cultural-revolution]], 60 (the largest work team, more than 500, Wang Guangmei among them, enters Tsinghua on June 9); [[w.pu-weihua-zalan-jiu-shijie]], 156 (the work group enters Tsinghua the evening of June 8). To check: [[w.chengxian-wenhua-dageming-chuqide-beida]], 17 (cited by [[w.macfarquhar-maos-last-revolution]], 66 n.1); [[w.qinghua-daxue-kuai-dafu]], 41 (cited by [[w.macfarquhar-maos-last-revolution]], 72 n.28). The words: "the evening of June 9" (MacFarquhar 72). Names: Liu Shaoqi, Mao Zedong, Ye Lin, Wang Guangmei, Kuai Dafu.'
