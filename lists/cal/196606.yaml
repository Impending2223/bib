    also: [china]
    c: 'The Secretariat''s circular no. 182-TT/TW on the 45th anniversary of the Chinese Communist Party, July 1: a round year, to be marked solemnly, Vietnamese–Chinese unity weighing the more in the war against the Americans. Propaganda on the Chinese Party under Mao Zedong, China''s gains by Marxism–Leninism and Mao Zedong Thought, its great cultural revolution now under way, its world role and its aid to Vietnam. A rally at the Hanoi city theater, June 30; a week of propaganda, June 27–July 3; the Central Committee''s greeting and an editorial in the press of July 1; an exhibition and a Chinese film week.'
    n: '*Thông tri của Ban Bí thư số 182-TT/TW, ngày 22-6-1966, Về tổ chức kỷ niệm lần thứ 45 ngày thành lập Đảng Cộng sản Trung Quốc*, signed for the Secretariat by Vũ Tuân, chief of its office. [[w.van-kien-dang-toan]], XXVII, 218–21. The rally: "vào tối 30 tháng 6 năm 1966 tại Nhà hát Thành phố" (the evening of June 30, at the city theater), 220. Made public: 2003. Names: Mao Zedong.'
