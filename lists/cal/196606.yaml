    c: Peking University, morning.{1} While the work team is tied up in a meeting, students from about six departments "struggle" Lu Ping and about forty other "monsters and freaks."{2} Nie Yuanzi's supporters' account tells of the "black gang" swamped like rats, to shouts of "Beat them!" A professor, whose husband is among those humiliated, writes that the students used wastebaskets for dunces' hats, glued posters on the victims' backs and sometimes threw ink in their faces. The work team breaks up the meeting around noon.{3}
    n: '[[w.macfarquhar-maos-last-revolution]], 73–74; [[w.mao-zedong-zhuan]], VI, ch. 74 n.44 (June 18 some students struggle more than forty people at Peking University, with blacking of faces, tall hats and kneeling, a few beaten; the work team stops it and calls for vigilance against bad elements, n.44). [[w.yang-jisheng-tiandi-fanfu]], I, 202 (June 18, 9 to 11 a.m. 上午9時至11時, the departments of chemistry, biology, Eastern languages, Western languages, Chinese and radio electronics and other units struggle against over 60 people, among them "key" persons, Party and League cadres and teachers "with problems," and two "reactionary students": faces blackened, tall hats, kneeling, a few beaten; the work group fixes it a "counter-revolutionary incident"; Yang thinks the excesses could have been corrected by policy and guidance); [[w.jian-zhou-enlai]], 546 (the "June Eighteenth Incident" at Peking University, a serious clash between the work team and those against it); [[w.dikotter-cultural-revolution]], 64 (scores condemned as counter-revolutionaries for parading and humiliating the university''s president on June 18); [[w.pu-weihua-zalan-jiu-shijie]], 158 (the morning of June 18, while the work group holds a meeting of all its members, from about 9 o''clock seizures and struggles break out in the chemistry, biology, Eastern languages, Western languages, Chinese and radio departments; a "ghost-struggling platform" before building 38; over sixty cadres and teachers struggled, tall hats, ink on their faces, posters on their bodies, kneeling, hair pulled, clothes torn, beaten and kicked, paraded; women indecently assaulted). To check: [[w.beijing-daxue-wuchanjieji-wenhua]], 7 (cited by [[w.macfarquhar-maos-last-revolution]], 74 n.33); [[w.daiyun-to-the-storm]], 156–160 (cited by [[w.macfarquhar-maos-last-revolution]], 74 n.34); Peking University 北京大学, *Wenhua geming jianbao* 《文化革命简报》 no. 9, June 18, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.44); [[w.macfarquhar-maos-last-revolution]], 75–76 (cited by [[w.jian-zhou-enlai]], 546 n.8a); [[w.nianyi-da-dongluande-niandai]], 39–40 (cited by [[w.jian-zhou-enlai]], 546 n.8b); [[w.wenhua-dageming-yanjiu-ziliao]], I, 51–52 (cited by [[w.jian-zhou-enlai]], 546 n.8c). The words: "the morning of June 18" (MacFarquhar 73); the meeting broken up "around noon" (74). Names: Lu Ping, Nie Yuanzi.'
