    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642–643 (June 20, 1966); [[w.yang-jisheng-tiandi-fanfu]], I, 203–204 (the same day Chen Yongkang 陳永康 and He Fangfang 何方方 post 〈揪出鉆進我們肝臟的牛鬼蛇神!〉, which finds the work group wrong in direction and line; Liu receives its head Gou Deyuan and three others and says "this poster is not like kind criticism," "now they attack you, the enemy has come out, the snake is out of its hole, and destroying it is easier," and tells them to use the contradictions, win the majority, isolate the minority, and defeat them one by one); [[w.dikotter-cultural-revolution]], 64 n.30 (Liu to the work team he guides at the middle school attached to Peking Normal University: pick the right moment, wait until most of the monsters have exposed themselves, then counter-attack); [[w.pu-weihua-zalan-jiu-shijie]], 162 (that afternoon Liu Shaoqi calls in the work group, has it organize discussion of the posters against it and rouse the masses to hit back; to Gou Deyuan: "it is good that they attack you; the enemy has come out, the snake has left its hole, and is easier to destroy; discuss this poster well, then struggle"; the *Liu Shaoqi zhuan* (162 n.108)). Made public: 1996. To check: *Pipan ziliao: Zhongguo Heluxiaofu Liu Shaoqi fangeming xiuzhengzhuyi yanlunji (1958.6–1967.7)* 《批判資料:中國赫魯曉夫劉少奇反革命修正主義言論集》 (Renmin chubanshe ziliaoshi 人民出版社資料室, 1967; internal circulation 內部發行), 669–670 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 204 n.39); [[w.liu-shaoqi-zhuan]], II, 1024–1025 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 162 n.108). Names: Liu Shaoqi.'
