  - id: cal.1966-06-01.civil-rights-the-executive
    when: June 1–2
    date: '1966-06-01'
    thread: civil-rights-the-executive
    also: [civil-rights-organizations]
    c: 'White House Conference "To Fulfill These Rights," Heineman chairman, Randolph honorary chairman. Johnson to the delegates, June 1: the issue "is beyond the mastery of one man or one group of men." SNCC stays away.'
    n: 'Remarks to the Delegates to the White House Conference "To Fulfill These Rights", [1966 Pub. Papers 571](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=647) (June 1, 1966). To check: [[w.rainwater-moynihan-report-and-the]]; [[w.graham-civil-rights-era]]. See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph, Heineman, Johnson.'
    tags: [name:johnson-lyndon-b, name:randolph-a-philip, name:heineman-ben-w]
  - id: cal.1966-06-01.latin-america
    when: June 1–2
    date: '1966-06-01'
    thread: latin-america
    c: 'Dominican Republic. Balaguer elected president over Bosch, 57.1 percent; Bosch 39.2 percent, Bonnelly 3.4 percent, by Rostow''s figures; some 1.4 million voting. June 2, Johnson to García-Godoy: "the tranquility of free elections. There can be no greater tribute."'
    n: 'Message to Provisional President Garcia-Godoy Following the Election in the Dominican Republic, [1966 Pub. Papers 577](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=653) (June 2, 1966). [FRUS 1964–68, XXXII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v32/d178). Check: the counts. To check: [[w.slater-intervention-and-negotiation]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-09-03.latin-america]]. Names: Bosch, Balaguer, García-Godoy, Bonnelly, Rostow, Johnson.'
    tags: [name:balaguer-joaquin-videla, name:bosch-juan, name:rostow-walt-w, name:garcia-godoy-hector, name:johnson-lyndon-b, name:bonnelly-rafael-f]
  - id: cal.1966-06-01.opinion
    when: June 1
    date: '1966-06-01'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, May 5–10: white parents who would object to a school where a few of the children are colored: outside the South 6 percent, South 24; where half are, 32 and 49; where more than half are, 60 and 62.'
    n: '[[w.gallup-poll]], III, 2010.'
  - id: cal.1966-06-01.vietnam-struggle
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: Huế. Students sack and burn the American consulate (Check the date).
    n: '[FRUS 1964–68, IV, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150) (Westmoreland to Wheeler, June 2). [[w.gibbons-u-s-government-and]], IV, 330 (June 1). See [[cal.1966-03-10.vietnam]].'
