    also: [china-liu]
    c: 'Liu Shaoqi 劉少奇, forwarding for the Center the Central-South Bureau''s 中南局 report on the cultural revolution and the Northwest Bureau''s 西北局 plan, writes that when the ox-demons and snake-spirits come out to attack, there is no haste to strike back: tell the left to stand firm, and the leaders must judge the heat; when most are exposed, organize the counterattack in time. Anti-Party, antisocialist middle-school and college students must be pulled out; among graduating senior-middle students some may, with the city committee''s approval, be criticized, struggled against and capped.{1} The Central-South report says to catch 1 percent rightists among students.{2}'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 200–201; [[w.pu-weihua-zalan-jiu-shijie]], 131, 165 (on 165: June 23, Liu, forwarding the Central-South and Northwest bureaus'' reports: when the ox-demons and snake-spirits come out to attack, no haste to strike back; tell the left to hold firm; the leaders to judge the heat; when most are exposed, organize the counterattack in time; anti-Party, anti-socialist students among college and middle-school students to be dragged out; some graduating senior-middle students, with the city committee''s approval, criticized, struggled and capped; on 131, the report forwarded: the Central-South Bureau''s "Request report on the situation of the cultural revolution and views" 〈關於文化大革命的情況和意見的請示報告〉: the report names those already pulled out as anti-Party, anti-socialist figures, among them Qin Mu 秦牧, Ke Lin 柯麟 and Liu Zhiming 劉志明 of the Zhongshan Medical College, Li Da 李達, He Dinghua 何定華 and Zhu Shaotian 朱劭天 of Wuhan University, Cheng Yun 程雲 and Wu Keren 武克仁 of Wuhan, Kang Zhuo 康濯 of Hunan, Guo Xiaotang 郭曉棠 of Zhengzhou University and Lu Di 陸地 of Guangxi). Made public: 2008. Names: Liu Shaoqi.'
