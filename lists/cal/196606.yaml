    c: Peking Geological Institute 北京地質學院. Tao Lujia 陶魯笳, deputy director of the State Council's Industry and Communications Political Department 國務院工交政治部, and He Changgong 何長工, deputy minister of geology and secretary of the institute's Party committee, say the institute has an "underground command" and tell the work group to seize Li Gui 李貴.
