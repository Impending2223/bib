        - 'via w.dallek-flawed-giant 371 n.99a: A-E'
        - 'w.dallek-flawed-giant 370–71: ?'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b, name:anderson-clinton-p, name:rostow-walt-w]
  - id: cal.1966-06-01.vietnam-struggle-2
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: Saigon. A bomb in Thiện Minh's car injures him seriously. Trí Quang, in a message to Johnson, blames the United States for its support of Kỳ and Thiệu.
    n: '[[w.gibbons-u-s-government-and]], IV, 330. To check: Saigon to Washington 5224, June 2, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.53). Check: the day of Trí Quang''s message (Saigon 5224, June 2). Names: Thích Trí Quang, Johnson, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu.'
    src:
      c: 8ba8b045
      rows:
        - 'w.gibbons-u-s-government-and IV, 330: all'
        - 'via w.gibbons-u-s-government-and IV, 330 n.53: all'
    tags: [name:thich-tri-quang, name:johnson-lyndon-b, name:nguyen-cao-ky, name:nguyen-van-thieu]
  - id: cal.1966-06-01.vietnam-struggle-3
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: 'The Directorate and the Buddhist leaders meet to complete their agreement: by Thiệu''s account to Westmoreland, the Buddhists say "the people" want Kỳ and Thiệu out; by Kỳ''s to Habib, Tâm Châu, asked "Do you want me to go or not?", says it never was his intention. Thiệu to Westmoreland: if Thiện Minh and Trí Quang were killed "things would remain quiet."'
    n: '[[w.gibbons-u-s-government-and]], IV, 330. To check: Saigon to Washington 5195, June 1, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.54); Westmoreland to Wheeler, MAC 4474, June 1, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.54). Names: Nguyễn Văn Thiệu, Westmoreland, Nguyễn Cao Kỳ, Habib, Tâm Châu, Thích Trí Quang.'
    src:
      c: 3750d3a1
      rows:
        - 'w.gibbons-u-s-government-and IV, 330: all'
        - 'via w.gibbons-u-s-government-and IV, 330 n.54a: A'
        - 'via w.gibbons-u-s-government-and IV, 330 n.54b: A-B'
    tags: [name:nguyen-van-thieu, name:westmoreland-william, name:nguyen-cao-ky, name:habib-philip-c, name:tam-chau, name:thich-tri-quang]
  - id: cal.1966-06-01.vietnam-struggle-4
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: 'Lodge''s weekly report, 5178: the attack on Thiện Minh perhaps the Communists'', moving in "as a last desperate means." The Buddhists "power-hungry," "out to make an effect on the American political scene"; "a plentiful supply of Buddhists—mystics and mental defectives—ready to burn themselves alive"; "our policy of working through the government ... is absolutely right."'
    n: '[[w.gibbons-u-s-government-and]], IV, 331. To check: Saigon to Washington 5178, June 1, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 331 n.57). See [[cal.1966-06-01.vietnam-struggle-2]]. Names: Lodge, Johnson.'
    src:
      c: 06f8b74d
      rows:
        - 'w.gibbons-u-s-government-and IV, 331: all'
        - 'via w.gibbons-u-s-government-and IV, 331 n.57: all'
    tags: [name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-06-01.vietnam-struggle-5
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: 'Word that Lâm, the new I Corps commander, will move at once to restore order at Huế after the consulate''s burning. State to Lodge, Flash, 3714: see Kỳ now; the agreement may be undone, and the burning of American property should not set the timing. That night Nhuận tells Trí Quang and the operation is called off.'
    n: '[[w.gibbons-u-s-government-and]], IV, 331–32. To check: Washington to Saigon 3714, June 1, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 332 n.60). See [[cal.1966-06-01.vietnam-struggle]]. Names: Lodge, Nguyễn Cao Kỳ, Thích Trí Quang.'
    src:
      c: 90670ae7
      rows:
        - 'w.gibbons-u-s-government-and IV, 331–32: all'
        - 'via w.gibbons-u-s-government-and IV, 332 n.60: B'
    tags: [name:lodge-henry-cabot, name:nguyen-cao-ky, name:thich-tri-quang]
  - id: cal.1966-06-01.vietnam-congress
    when: June 1
    date: '1966-06-01'
    thread: vietnam-congress
    c: 'Marcy to Fulbright: get Mansfield to hold a "rump session" of senior Senators, Russell, Stennis, Mansfield, Fulbright, Cooper and Aiken, on "the future of this nation in Vietnam": "Somehow the direction the President is taking must be changed"; "This would be senatorial advice in the constitutional sense!"'
    n: '[[w.gibbons-u-s-government-and]], IV, 343. To check: Marcy to Fulbright, June 1, 1966, National Archives, RG 46, Papers of the Committee on Foreign Relations, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], IV, 343 n.94). See [[cal.1966-05-20.vietnam-congress]]. Names: Marcy, Fulbright, Mansfield, Russell, Stennis, John Sherman Cooper, Aiken.'
    src:
      c: aa19d555
      rows:
        - 'w.gibbons-u-s-government-and IV, 343: all'
        - 'via w.gibbons-u-s-government-and IV, 343 n.94: all'
    tags: [name:marcy-carl, name:fulbright-j-william, name:mansfield-mike, name:russell-richard-b, name:stennis-john-c, name:cooper-john-sherman, name:aiken-george-d]
  - id: cal.1966-06-02.space
    when: June 2
    date: '1966-06-02'
    thread: space
    c: 'Surveyor 1, launched May 30 from Cape Kennedy, Fla., lands softly on the moon, in the Ocean of Storms, the first American spacecraft to do so; the Soviet Luna 9 had landed Feb. 3. Its pictures on television the same morning. Johnson: prints to be offered to the world''s scientists; June 8, sent to foreign nations.'
    n: 'Statement by the President Following the Landing of Surveyor I on the Moon, [1966 Pub. Papers 575](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=651) (June 2, 1966); Statement by the President Upon Sending to Foreign Nations Prints of Lunar Photographs Made by Surveyor I, [1966 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=666) (June 8, 1966). To check: [[w.nicks-far-travelers]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-02.vietnam
    when: June 2
    date: '1966-06-02'
    thread: vietnam
    c: 'Rostow sends Johnson a shorter version of the five alternatives: in effect, "we need something more than our present course ... but less than a major escalation. I agree." Johnson gives a copy to Mansfield.'
    n: '[[w.gibbons-u-s-government-and]], IV, 326. To check: Rostow to Johnson, cover memorandum, June 2, 1966, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 326 n.43). See [[cal.1966-05-27.vietnam-2]]. Names: Rostow, Johnson, Mansfield.'
    src:
      c: 0b4cfd11
      rows:
        - 'w.gibbons-u-s-government-and IV, 326: all'
        - 'via w.gibbons-u-s-government-and IV, 326 n.43: A'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b, name:mansfield-mike]
  - id: cal.1966-06-02.vietnam-struggle
    when: June 2
    date: '1966-06-02'
    thread: vietnam-struggle
    c: 'Komer to Moyers, "Vietnam Press Guidelines": the dissidents jockeying for power, not "a popular upheaval," nor an invitation to the United States to leave; "part of the painful process of a young nation at war struggling toward consensus"; "not Gotterdammerung."'
    n: '[[w.gibbons-u-s-government-and]], IV, 333. To check: Komer to Moyers, "Vietnam Press Guidelines," June 2, 1966, NSF Files of Robert W. Komer, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 333 n.68). Names: Komer, Moyers.'
    src:
      c: 64ea637a
      rows:
        - 'w.gibbons-u-s-government-and IV, 333: all'
        - 'via w.gibbons-u-s-government-and IV, 333 n.68: all'
    tags: [name:komer-robert-w, name:moyers-bill]
