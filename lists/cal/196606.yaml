  - id: cal.1966-06-01.latin-america
    when: June 1–2
    date: '1966-06-01'
    thread: latin-america
    c: 'Dominican Republic. Balaguer elected president over Bosch, 57.1 percent; Bosch 39.2 percent, Bonnelly 3.4 percent, by Rostow''s figures; some 1.4 million voting. June 2, Johnson to García-Godoy: "the tranquility of free elections. There can be no greater tribute."'
    n: 'Message to Provisional President Garcia-Godoy Following the Election in the Dominican Republic, [1966 Pub. Papers 577](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=653) (June 2, 1966). [FRUS 1964–68, XXXII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v32/d178). [[w.rusk-as-i-saw-it-1990]], 376 (Balaguer, 57 percent); [[w.ball-past-has-another-pattern]], 329 (elections held June 1, 1966, a solution Ball credits almost wholly to Bunker; not the result); [[w.dallek-flawed-giant]], 267 (June 1, 1966: Balaguer over Bosch, 57 percent to 39; the left sees U.S. intimidation, the administration a victory for constitutional government; not the decimals, Bonnelly or the turnout). Check: the counts. To check: [[w.slater-intervention-and-negotiation]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-09-03.latin-america]]. Names: Bosch, Balaguer, García-Godoy, Bonnelly, Rostow, Johnson. Check: Rusk gives more than 1.3 million voting ([[w.rusk-as-i-saw-it-1990]], 376).'
    src:
