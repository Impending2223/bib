  - id: cal.1966-06-02.space
    when: June 2
    date: '1966-06-02'
    thread: space
    c: 'Surveyor 1, launched May 30 from Cape Kennedy, Fla., lands softly on the moon, in the Ocean of Storms, the first American spacecraft to do so; the Soviet Luna 9 had landed Feb. 3. Its pictures on television the same morning. Johnson: prints to be offered to the world''s scientists; June 8, sent to foreign nations.'
    n: 'Statement by the President Following the Landing of Surveyor I on the Moon, [1966 Pub. Papers 575](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=651) (June 2, 1966); Statement by the President Upon Sending to Foreign Nations Prints of Lunar Photographs Made by Surveyor I, [1966 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=666) (June 8, 1966). To check: [[w.nicks-far-travelers]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: Surveyor
