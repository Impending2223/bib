  - id: cal.1966-06.vietnam-hanoi
    when: June
    date: 1966-06
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The Central Military Party Committee decides to set up the Route 9–North Quảng Trị Front, B5, to open a new strategic direction against the weak side of the enemy: force the enemy to scatter into the mountains, destroy strategic forces with the North''s main force, help the Trị–Thiên delta, and block a land spread of the war into Military Region 4. At first Military Region 4''s Party committee and command run it, Colonel Nam Long commander, Colonel Quách Sỹ Kha commissar.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 190–91, 196. Made public: 2013. Check: the day.'
    tags: [polity:drv, vis:only:drv, ok:fields-place]
  - id: cal.1966-06-30.vietnam-hanoi-3
    when: June 30
    date: '1966-06-30'
    place: loc-ninh
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Cần Lê and Trảng Ba Nghì, Route 13 near Lộc Ninh. Regiment 1 of the 9th Division, commander Bùi Thanh Vân, ambushes a convoy from Hớn Quản under eight gunships: 43 vehicles destroyed, mostly tanks and M113s, nearly 300 Americans out of action; firing stops at 7 p.m.'
    n: '[[w.lich-su-khang-chien-chong-my]], IV, 163–64. The figures are the history''s. Check: the clock; the history says only that the firing stopped at 7 p.m.'
    tags: [polity:drv, polity:us, ok:fields-time]
