  - id: cal.1966-06-03.china-leadership-2
    when: June 3
    date: '1966-06-03'
    place: peking
    thread: china-may-sixteenth
    also: [china-liu]
    c: 'Peking.{1} Liu Shaoqi presides over the enlarged Standing Committee meeting, which hears Li Xuefeng on the Peking colleges and agrees his eight rules: wall posters kept on campus;{2} no meetings that hinder work and teaching; no marches into the streets;{3} no foreigners; no raids on the homes of the denounced;{4} secrecy;{5} no beating or slander;{6} keep to the post.{7}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 3, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 35 (June 3, 1966; Zhou attends; the eight rules, and the agreement to send work groups to schools whose leadership is paralyzed); [[w.macfarquhar-maos-last-revolution]], 65, 71 (the eight rules); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 640 (June 3, 1966; Liu presides at the enlarged Standing Committee meeting, which hears Li Xuefeng, first secretary of the Peking committee, report on the movement in the Peking area; Liu says the socialist cultural revolution is at its height, and Peking University and the big schools are to have good order, so students are to be organized quickly and brought onto the track; the meeting agrees to Li''s eight requirements and to send work groups into some of Peking''s universities and middle schools, with cadres drawn from the central ministries and the Youth League''s Central Committee as members; afterward, as the movement advanced and most schools'' organizations fell into passivity and paralysis, work groups were stationed in Peking''s universities and middle schools generally, and many provinces and cities copied Peking); [[w.deng-xiaoping-nianpu-1904]], III, 1917 (June 3, 1966; Deng at the enlarged Politburo Standing Committee meeting Liu Shaoqi presides over, which studies questions of the ''cultural revolution'' and lays down eight rules: inside and outside to be told apart, secrecy kept, big-character posters not on the streets, no demonstrations, no linking up, no large denunciation meetings, no besieging the ''black gang''s'' houses, no beating or insulting; the meeting agrees that the Peking municipal committee send work teams into some universities and middle schools, and the central departments and Youth League Central Committee draw cadres to join them); [[w.mao-zedong-zhuan]], VI, ch. 74 (the same day the enlarged Standing Committee meeting, under Liu Shaoqi and Deng Xiaoping, agrees that the Peking committee send work teams to the universities and middle schools). [[w.yang-jisheng-tiandi-fanfu]], I, 197 (June 3, at Liu Shaoqi''s home 劉少奇家里, the enlarged Politburo Standing Committee meeting under Liu draws up eight rules: posters on campus; meetings not to hinder work and teaching; no marches into the streets; inside and outside kept apart, no foreigners to visit, foreign students not in the movement; no uproar at the homes of those struggled against; secrecy; no beating or slander; active leadership, keeping to posts; Li Xuefeng, first secretary of the new Peking committee, then: with these eight things are easy, now they must be told below; Deng: a mass meeting of 100,000, one pole through to the bottom, the new committee takes office; Li: first separately, tonight organs, the second meeting the schools); [[w.chen-yi-nianpu]], 1151 (early June 1966; Chen Yi at the enlarged Standing Committee meeting presided over by Liu Shaoqi and Deng Xiaoping, Mao away, which decides to send work teams to Peking''s universities and middle schools and on June 3 draws up the Eight Points); [[w.pu-weihua-zalan-jiu-shijie]], 152 (June 3, Liu Shaoqi presides over the enlarged Standing Committee on the movement in Peking; Li Xuefeng, first secretary of the new committee, puts eight demands: posters inside the schools; meetings not to hinder work or teaching; no marches in the streets; inside and outside apart, no foreign visitors, foreign students out of the movement; no going to the homes of those struggled against; secrecy; no beating or insulting; active leadership, each at his post; and work groups where a school''s leadership is paralyzed, the League and the Organization Department helping; the meeting agrees; Liu: the cultural revolution at its height, order in the schools, the students organized quickly); [[w.chen-yun-nianpu-xiuding]], III, 153 (early June, under Liu Shaoqi and Deng Xiaoping, the Standing Committee decides to send work teams to the colleges and middle schools and draws up eight requirements to keep the movement led and orderly). Made public: 1996. To check: [[w.zheng-liu-shaoqide-zuihou-suiyue]], 131 (cited by [[w.macfarquhar-maos-last-revolution]], 65 n.71); Dazibao xuan, no. 2 (1966), 23 (cited by [[w.macfarquhar-maos-last-revolution]], 71 n.26b); Li Xuefeng 李雪峰, 〈回憶「文化大革命」初期的「五十天路線錯誤」〉, *Zhonggong dangshi yanjiu* 《中共黨史研究》 1998 no. 4, reprinted in Zhang Hua et al., eds., *Shinian wenge* 《十年文革》 (Zhonggong dangshi chubanshe 中共黨史出版社, 2007), 650–651 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 197 n.18). Names: Liu Shaoqi, Li Xuefeng.'
