    c: 'The Secretariat''s directive no. 130-CT/TW, on the Politburo''s decision: a strong propaganda drive for July 20, the Geneva anniversary, at home and abroad, against the American escalation in the South and the bombing of the North. At home a political session in the Party on Trường Sơn''s article on the South''s 1965–66 dry-season victory, and a committee on American war crimes in the North, with a letter to the American people and to Bertrand Russell. Abroad, the missions to press for rallies, strikes and boycotts, the socialist countries first.'
    n: '*Chỉ thị của Ban Bí thư số 130-CT/TW, ngày 22-6-1966, Về đợt tuyên truyền vận động trong dịp 20 tháng 7 năm 1966*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVII, 208–17. Made public: 2003. Names: Bertrand Russell. Check: whose pen name "Trường Sơn" is.'
