  - id: cal.1966-06-29.vietnam
    when: June 29–30
    date: '1966-06-29'
    thread: vietnam
    c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29. Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result; put off for weather and leaks; Johnson''s assent to McNamara by telephone, June 28. Wilson, told in advance, dissociates Britain. Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."'
    n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV, 370–71, 377 (the strikes, 377; Wilson''s dissociation, 370–71); [[w.pentagon-papers]], IV; [[w.drea-mcnamara-clifford-and-the-2011]], 75–76 (the NSC of June 22 and Ronning''s report; Wilson''s warning; the postponement; Johnson''s approval June 28; the strikes June 29); [[w.frankum-like-rolling-thunder]], 48–49 (the strikes of June 29; put off for weather); [[w.vietnam-victory-in-vietnam]], 181 (the strikes of June 29); [[w.staaveren-gradual-failure]], 279, 285–89 (the strikes; the directive of June 22 and Ronning''s visit; the postponements for the weather and the leak of June 24; the approval relayed June 28; Wilson told beforehand); [[w.dallek-flawed-giant]], 373–74 (the NSC of June 22, not its figures or Ronning; the strikes); [[w.herring-lbj-and-vietnam]], 105 (the oil strikes, late June). Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). To check: [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]; Msg, JCS to CINCPAC, 222044Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 288 n.27a); msg, CINCPAC to CINCPACFLT, CINCPACAF, 222044Z Jun 66 (c