    tags: [name:mansfield-mike, name:rusk-dean]
  - id: cal.1966-06-17.vietnam-2
    when: June 17
    date: '1966-06-17'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'NSC, 6:05 p.m.: the strikes on the oil stores. Johnson: not to disrupt the oil reaching the forces in the field is to pay in American casualties. The decision waits on Rusk''s return from NATO, Ronning''s report from Hanoi, word to the allies. McNamara: he has opposed the strikes for months; the situation has changed. Humphrey: "I have come around reluctantly"; politically "it will play hell." Goldberg alone against. "In order not to be lobbied on the decision, not another soul should be informed of this discussion."'
    n: '[FRUS 1964–68, IV, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v04/d159). [[w.dallek-flawed-giant]], 373 (the meeting, Johnson, the wait, Goldberg, the secrecy). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 372–74. Names: Johnson, Rusk, Ronning, Goldberg, McNamara, Humphrey.'
    src:
      c: 0c87ccd7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d159: all'
        - 'w.dallek-flawed-giant 373: A-C, H-I'
        - 'w.gibbons-u-s-government-and IV, 372–74: all'
        - 'via w.dallek-flawed-giant 373 n.105: A-C, H-I'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:ronning-chester, name:goldberg-arthur-j, name:mcnamara-robert-s, name:humphrey-hubert-h]
  - id: cal.1966-06-18.vietnam
    when: June 18
    date: '1966-06-18'
    thread: vietnam
    also: [transition-and-staff]
    c: 'News conference: the alternatives examined, "including all suggestions from those who have not shared our views"; "the national interest requires that we persist in our present policy." Forces and operations may increase. Hanoi''s hopes rest "more on political differences in Saigon and Washington than on his military capacity." Raborn resigns as Director of Central Intelligence after fourteen months; Helms, his deputy, named.'
    n: 'The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701) (June 18, 1966). [[w.gibbons-u-s-government-and]], IV, 344–45 (the war). To check: [[w.powers-man-who-kept-the]]; [[w.helms-look-over-my-shoulder]]. See [[cal.1965-04-28.transition-and-staff]]. Names: Johnson, Raborn, Helms.'
    tags: [name:johnson-lyndon-b, name:raborn-william-f-jr, name:helms-richard]
    aliases: [cal.1966-06-18.transition-and-staff]
  - id: cal.1966-06-19.opinion
    when: June 19
    date: '1966-06-19'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 19–24: a vote on the war in the next few months: continue it 48 percent, withdraw the troops 35. The end: an all-out victory 17, a compromise 54, a defeat 6. Communist China to enter the war: will 35, will not 37. May 5–10: most South Vietnamese want the United States out, yes 34, no 38; if a majority did, pull out, yes 51, no 33. How long: longer than five years 22, uncertain 32.'
    n: '[[w.gallup-poll]], III, 2013–14.'
  - id: cal.1966-06-19.governors-mn
    when: June 19
    date: '1966-06-19'
    thread: governors
    also: [elections-1966]
    c: Minnesota. The DFL state convention endorses Lieutenant Governor Keith for governor over Governor Rolvaag, on the twentieth ballot. Rolvaag takes it to the primary.
    n: 'Minnesota Election Archives, ["Governor, 1966 Election"](https://mn.electionarchives.lib.umn.edu/election/2319664010120600). [Wikipedia, "1966 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1966_Minnesota_gubernatorial_election). To check: [[w.peirce-great-plains-states-of]]; [[w.mondale-good-fight]]. Names: Keith, Rolvaag.'
    tags: [state:mn, name:keith-alexander-m, name:rolvaag-karl-f]
  - id: cal.1966-06-20.court
    when: June 20
    date: '1966-06-20'
    thread: court
    also: [crime-and-hijacking]
    c: '*Schmerber v. California*, [384 U.S. 757](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384757/usrep384757.pdf): blood drawn from a drunken-driving suspect over his refusal neither compelled testimony nor an unreasonable search; Brennan for the Court, 5–4; Warren, Black, Douglas and Fortas dissent. *Johnson v. New Jersey*, [384 U.S. 719](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384719/usrep384719.pdf): *Escobedo* and *Miranda* govern only trials begun after their dates; Warren for the Court; Black and Douglas dissent.'
    n: See [[cal.1966-06-13.court]].
  - id: cal.1966-06-20.court-2
    when: June 20
    date: '1966-06-20'
    thread: court
    also: [mississippi, georgia]
    c: 'Removal of civil rights prosecutions to federal court, 28 U.S.C. § 1443. *Georgia v. Rachel*, [384 U.S. 780](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384780/usrep384780.pdf): sit-in demonstrators charged with trespass at Atlanta restaurants may remove their cases if the Civil Rights Act of 1964 protected what they did. *City of Greenwood v. Peacock*, [384 U.S. 808](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384808/usrep384808.pdf): civil rights workers charged at Greenwood, Miss., in 1964 may not; a claim that the state court will not try them fairly is not enough. Stewart for the Court in both; in *Peacock*, 5–4, Douglas, Warren, Brennan and Fortas dissenting.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1966-06-20.governors-me
    when: June 20
    date: '1966-06-20'
    thread: governors
    also: [elections-1966]
    c: 'Maine''s primaries for governor. Republican: Reed, the governor, over Erwin, 55,924 to 37,765, 59.7 percent. Democratic: Curtis, Secretary of State, over Carlton Reed, president of the Maine Senate, 30,879 to 13,839, 55.6 percent; Childs, Speaker of the Maine House, 10,793, 19.4 percent.'
    n: '[Maine, "1966 Republican Primary: State & County Officers"](https://digitalmaine.com/tabulations_for_elections_1960s/43); ["1966 Democratic Primary: State & County Officers"](https://digitalmaine.com/tabulations_for_elections_1960s/44). [Wikipedia, "1966 Maine gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maine_gubernatorial_election). Check the date: the tabulations are dated June 22. To check: [[w.palmer-maine-politics-and-government]]. Names: Erwin, Curtis, Carlton Reed, Childs, Reed.'
    tags: [state:me, name:reed-john-h, name:erwin-james-s, name:curtis-kenneth-m, name:reed-carlton-day-jr, name:childs-dana]
  - id: cal.1966-06-21.mississippi
    when: June 21
    date: '1966-06-21'
    thread: mississippi-meredith
    c: Philadelphia. King leads a memorial march for Chaney, Goodman and Schwerner; whites attack the marchers, Deputy Price among the officers present (Check).
    n: '[*New York Times*, June 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html). [[w.dittmer-local-people]], 398. See [[cal.1966-06-06.mississippi]]; [[cal.1964-08-04.mississippi]]. Names: King, Chaney, Goodman, Schwerner, Price.'
    src:
      c: 2b579e41
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html: all'
        - 'w.dittmer-local-people 398: all'
    tags: [name:king-martin-luther-jr, name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r]
  - id: cal.1966-06-21.middle-east
    when: June 21–23
    date: '1966-06-21'
    thread: middle-east
    also: [states-and-cities]
    c: 'King Faisal at the White House, June 21–22; over an hour alone with Johnson. Development, Saudi integrity, Southeast Asia, Yemen; no new security assurances. June 22, at a press luncheon: "Jews of the world aid Israel … In our situation we consider those who aid our enemy as our enemy." June 23, Lindsay cancels New York''s dinner for him; Rockefeller his call.'
    n: 'Remarks of Welcome to King Faisal of Saudi Arabia on the South Lawn at the White House, [1966 Pub. Papers 640](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=716) (June 21, 1966); Joint Statement Following Discussions With King Faisal of Saudi Arabia, [1966 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=721) (June 22, 1966). FRUS 1964–68, XXI, docs. [276](https://history.state.gov/historicaldocuments/frus1964-68v21/d276), [279](https://history.state.gov/historicaldocuments/frus1964-68v21/d279) (the luncheon; the dinner). To check: [[w.bronson-thicker-than-oil]]. See [[cal.1964-11-02.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Lindsay, Rockefeller.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:johnson-lyndon-b, name:lindsay-john-v, name:rockefeller-nelson, state:ny, city:nyc]
  - id: cal.1966-06-22.crime-and-hijacking
    when: June 22
    date: '1966-06-22'
    thread: crime-and-hijacking
    c: 'Bail Reform Act signed, Ervin''s bill, [80 Stat. 214](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg214.pdf): in the federal courts a defendant not charged with a capital crime released on his own recognizance or an unsecured bond unless the judge finds more needed to assure his appearance; time in custody credited to the sentence. The House passed it June 7, [319–14](https://voteview.com/rollcall/RH0890268). Johnson: the poorer defendant "stays in jail because he is poor."'
    n: 'Remarks at the Signing of the Bail Reform Act of 1966, [1966 Pub. Papers 644](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=720) (June 22, 1966). To check: [[w.thomas-bail-reform-in-america]]. Names: Ervin, Johnson.'
    tags: [name:johnson-lyndon-b, name:ervin-sam-j-jr]
  - id: cal.1966-06-22.vietnam-struggle
    when: June 22
    date: '1966-06-22'
    thread: vietnam-struggle
    c: 'Lodge: perhaps the end of the crisis "which began with the relief of General Thi on March 10."'
    n: 'FRUS 1964–68, IV, docs. [160](https://history.state.gov/historicaldocuments/frus1964-68v04/d160), [162](https://history.state.gov/historicaldocuments/frus1964-68v04/d162). See [[cal.1966-03-10.vietnam]]. Names: Lodge, Nguyễn Chánh Thi.'
    tags: [name:lodge-henry-cabot, name:nguyen-chanh-thi]
  - id: cal.1966-06-22.vietnam-congress
    when: June 22
    date: '1966-06-22'
    thread: vietnam-congress
    c: 'Johnson''s reply to Mansfield, written by Rostow: peace will come once Hanoi is convinced "that we are not weak; that we are not impatient; that we are not going to falter; that they cannot win." Mansfield answers June 25, restating his view; Johnson acknowledges it June 30 without comment.'
    n: '[[w.gibbons-u-s-government-and]], IV, 327. To check: Johnson to Mansfield, June 22, 1966; Mansfield to Johnson, June 25 (LBJ Library, NSF Files of Mike Mansfield); Johnson to Mansfield, June 30 (LBJ Library, WHCF, ND 19/CO 312). See [[cal.1966-06-13.vietnam-congress]]. Names: Johnson, Mansfield, Rostow.'
    tags: [name:johnson-lyndon-b, name:mansfield-mike, name:rostow-walt-w]
  - id: cal.1966-06-22.vietnam-congress-2
    when: June 22
    date: '1966-06-22'
    thread: vietnam-congress
    c: 'Johnson off the record with thirty members of the Armed Services and foreign affairs committees who had been to South Vietnam, ten Senators and twenty Representatives; Rusk, McNamara, Wheeler and Rostow with him; 5:45 to 7:10 p.m. By Monagan''s account, Johnson: "We are going to win!"; no one gives him a better alternative than McNamara''s or Wheeler''s; Hanoi reads "some Senators" more carefully than we do. Most members for more military pressure; Mansfield and Aiken against.'
    n: '[[w.gibbons-u-s-government-and]], IV, 376–77. To check: John S. Monagan, unpublished recollections. See [[cal.1966-06-29.vietnam]]. Names: Johnson, Rusk, McNamara, Wheeler, Rostow, Monagan, Mansfield, Aiken.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:rostow-walt-w, name:monagan-john-s, name:mansfield-mike, name:aiken-george-d]
  - id: cal.1966-06-23.mississippi-meredith
    when: June 23
    date: '1966-06-23'
    thread: mississippi-meredith
    c: Canton. Highway patrolmen fire tear gas into the marchers raising their tents on a Negro school's grounds.
    n: '[*New York Times*, June 24, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/24/issue.html). See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-06-24.transportation
    when: June 24
    date: '1966-06-24'
    thread: transportation-auto-safety
    c: 'Senate passes the Traffic Safety Act, S. 3005, Magnuson''s, [76–0](https://voteview.com/rollcall/RS0890335): federal safety standards for new cars, mandatory. Criminal penalties for willful violations refused, [14–62](https://voteview.com/rollcall/RS0890334). The Highway Safety Act, S. 3052, through the same day. Johnson: "We can no longer tolerate such anarchy on wheels."'
    n: 'Statement by the President Following Senate Approval of the Traffic Safety Bill, [1966 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=726) (June 24, 1966). See [[cal.1966-03-22.transportation]]. Names: Magnuson, Johnson.'
    tags: [name:johnson-lyndon-b, name:magnuson-warren-g]
  - id: cal.1966-06-24.opinion
    when: June 24
    date: '1966-06-24'
    thread: opinion
    also: [vietnam, students]
    c: 'Gallup, special survey of college students: Johnson''s handling of Vietnam: approve 47 percent, disapprove 47. Released June 22, their approval of his handling of the job: 55, 38.'
    n: '[[w.gallup-poll]], III, 2014. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-24.economy-debt-limit
    when: June 24
    date: '1966-06-24'
    thread: economy-debt-limit
    c: The debt limit to $330 billion for fiscal 1967 signed, [80 Stat. 221](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg221.pdf).
    n: Statute (K–J Cong. II.J.2). See [[cal.1966-06-08.economy-debt-limit]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-26.mississippi-meredith
    when: June 26
    date: '1966-06-26'
    thread: mississippi-meredith
    c: Jackson. The march ends, some 15,000 at the Capitol, Meredith with them. Some 4,000 Negroes registered along the route (Check).
    n: '[*New York Times*, June 27, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/27/issue.html). See [[cal.1966-06-06.mississippi]]. Names: Meredith.'
    tags: [name:meredith-james-h]
  - id: cal.1966-06-27.economy
    when: June 27
    date: '1966-06-27'
    thread: economy
    c: 'The Federal Reserve Board raises member banks'' reserve requirement on time deposits other than savings, on each bank''s holdings over $5 million, from 4 to 5 percent, from July 14 and 21: over $400 million more in required reserves, some 950 banks affected, those issuing certificates of deposit most. Banks'' short-term promissory notes brought under the reserve and interest rules from Sept. 1. The discount rate stays at 4½ percent.'
    n: '*Federal Reserve Bulletin*, July 1966, [979–80](https://fraser.stlouisfed.org/files/docs/publications/FRB/1960s/frb_071966.pdf#page=47). To check: [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]. See [[cal.1965-12-05.economy]].'
  - id: cal.1966-06-28.latin-america
    when: June 28–29
    date: '1966-06-28'
    thread: latin-america
    c: 'Argentina. The army under Pistarini deposes Illia before dawn, June 28; the commanders in chief name Onganía, the army''s retired commander, president, sworn June 29. The embassy cuts off official contact. Rostow to Johnson: "This unjustified military coup is a serious setback."'
    n: 'FRUS 1964–68, XXXI, docs. [131](https://history.state.gov/historicaldocuments/frus1964-68v31/d131), [132](https://history.state.gov/historicaldocuments/frus1964-68v31/d132), [133](https://history.state.gov/historicaldocuments/frus1964-68v31/d133), [134](https://history.state.gov/historicaldocuments/frus1964-68v31/d134). To check: [[w.potash-army-and-politics-in]]; [[w.rabe-killing-zone]]. Names: Rostow, Pistarini, Illia, Onganía, Johnson.'
    tags: [name:pistarini-pascual-angel, name:illia-arturo-umberto, name:ongania-juan-carlos, name:rostow-walt-w, name:johnson-lyndon-b]
