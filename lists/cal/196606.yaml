  - id: cal.1966-06-05.vietnam
    when: June 5
    date: '1966-06-05'
    thread: vietnam
    c: 'Westmoreland''s commanders'' conference. Habib: the United States preaching moderation to extremists on both sides, "a dialogue of the deaf"; it "cannot and will not abandon the government"; "Islands of anarchy are thus unacceptable." Westmoreland: "an adolescent nation," the crisis "blown up out of all proportion by the press."'
    n: '[[w.gibbons-u-s-government-and]], IV, 333–34. To check: Memorandum for the record of June 20, 1966, on the MACV commanders'' conference of June 5, Westmoreland Papers, History File, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 333 n.69). Names: Westmoreland, Habib.'
