  - id: cal.1966-06-15.opinion
    when: June 15
    date: '1966-06-15'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, the same county chairmen, their feelings about the war: go all-out to win 29 percent; go all-out or get out 18; mishandled 13; the strategy to change 12; the military to have a greater say 5; stop the spread of communism 9; pessimism 10; we should get out 8; end it quickly 7; Johnson waging war for political reasons 5; support for the Administration 4.'
    n: '[[w.gallup-poll]], III, 2013. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-15.vietnam-struggle
    when: June 15–19
    date: '1966-06-15'
    thread: vietnam-struggle
    c: Huế. Two airborne and two marine battalions, with Loan's police, clear the altars and hold the city. Nhuận, the 1st Division's commander, relieved; Đính and Trí Quang brought to Saigon (Check the days).
    n: '[FRUS 1964–68, IV, doc. 160](https://history.state.gov/historicaldocuments/frus1964-68v04/d160) (Lodge, June 22: Huế back under the government; n. 3, the four battalions with the police June 15–17, open resistance ended by June 19). Gibbons has the government''s troops into Huế June 8 and the city in its hands by June 9 (IV, 332). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Ngọc Loan, Phạm Xuân Nhuận, Tôn Thất Đính, Thích Trí Quang.'
    src:
      c: 646ccead
      rows:
