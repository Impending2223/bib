  - id: cal.1966-06.china-leadership-26
    when: June, about the 10th
    date: 1966-06
    at: before 1966-06-11
    thread: china-may-sixteenth
    also: [china-liu]
    c: At a meeting of the Center, about June 10, Liu Shaoqi 劉少奇 says that the movement may be much like 1957, and that 300,000 to 400,000 rightists will have to be struck. Wang Renzhong 王任重, in his later self-criticism, says this was his own thought too.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 201–202; [[w.dikotter-cultural-revolution]], 64 n.30 (Liu Shaoqi sets a quota of 1 percent of the students and teachers of schools and universities to be denounced as rightists, some 300,000 for the country; the book gives no day; the quota and the figure from Song Yongyi, 64 n.30c). Made public: 2005. To check: Xu Hailiang 徐海亮, *Donghu fengyun lu: Wuhan qunzhong de wenge jiyi* 《東湖風云錄——武漢群眾的文革記憶》 (Yinhe chubanshe 銀河出版社, 2005), 7 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 202 n.33); [[w.macfarquhar-maos-last-revolution]], 72–73 (cited by [[w.dikotter-cultural-revolution]], 64 n.30a); [[w.xiaoxia-repressive-movements-and-the]], 74 (cited by [[w.dikotter-cultural-revolution]], 64 n.30b); Song Yongyi, "Bei yancang de lishi: Liu Shaoqi dui ''wenge'' de dute gongxian" (2007) (cited by [[w.dikotter-cultural-revolution]], 64 n.30c). See [[cal.1966-06-08.china-leadership-7]]. Names: Liu Shaoqi, Wang Renzhong.'
