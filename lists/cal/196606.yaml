    when: June 28
    date: '1966-06-28'
    thread: states-and-cities
    also: [robert-kennedy]
    c: Manhattan's Democratic primary for Surrogate. Silverman, a Supreme Court justice, backed by Robert Kennedy, the reform clubs and the Liberals, beats Klein, the county organization's choice, also endorsed by the Republicans (Check). Check the date and the vote.
    n: '["The Making of the Surrogate," *Time*, July 8, 1966](https://web.archive.org/web/20121102175036/http://www.time.com/time/magazine/article/0,9171,835926,00.html); [Wikipedia, "Samuel Silverman"](https://en.wikipedia.org/wiki/Samuel_Silverman). [[w.schlesinger-robert-kennedy-and-his]], 751–54 (the candidates and their backers; not the date or the vote). To check: [[w.thomas-robert-kennedy]]. Names: Silverman, Klein, Robert Kennedy.'
