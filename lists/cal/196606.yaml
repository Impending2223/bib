    when: June 16
    date: '1966-06-16'
    thread: vietnam-congress
    c: 'Mansfield in the Senate: Rusk to meet China''s Foreign Minister to seek an end to the war. "Peace in Vietnam and peace in China ... are very closely interrelated, if not, indeed, inseparable." The White House: the President welcomes suggestions; Rusk and others to review it.'
    n: '[112 Cong. Rec. 13486–87](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt10/pdf/GPO-CRECB-1966-pt10-7-2.pdf#page=20) (June 16, 1966) (the speech). [[w.gibbons-u-s-government-and]], IV, 327–28. To check: *New York Times*, June 17, 1966. See [[cal.1966-04-18.vietnam-congress]]. Names: Mansfield, Rusk.'
    src:
      c: 1274be2b
      rows:
