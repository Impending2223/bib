  - id: cal.1966-06-28.vietnam-congress
    when: June 28
    date: '1966-06-28'
    thread: vietnam-congress
    c: 'Mansfield with the Democratic chairmen, Russell and Fulbright among them, an hour and three-quarters, then the junior Democrats, three hours, on the war. His report to Johnson, June 29: general support for the President; deep concern that no way has been found to end the war; no sentiment for immediate withdrawal; "a strong conviction that candidates of the Democratic Party will be hurt by the war."'
    n: '[FRUS 1964–68, IV, doc. 166](https://history.state.gov/historicaldocuments/frus1964-68v04/d166) (Mansfield to Johnson, June 29: the two meetings of June 28 and the four points; the lengths of the meetings not in it). [[w.gibbons-u-s-government-and]], IV, 348–50. Names: Mansfield, Russell, Fulbright, Johnson.'
    src:
      c: 484dc239
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d166: B-E'
        - 'w.gibbons-u-s-government-and IV, 348–50: all'
    tags: [name:mansfield-mike, name:russell-richard-b, name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1966-06-28.vietnam-congress-2
    when: June 28
    date: '1966-06-28'
    thread: vietnam-congress
    c: 'Marcy calls Rostow for a reply to Fulbright on the Princeton study. Rostow: some useful suggestions; it should not be published now. His memorandum to Johnson that night: study it respectfully, keep "a good arm''s length" from neutralization. Johnson, instead of a letter, has Moyers tell Marcy that Rusk will be in touch with Fulbright.'
    n: '[[w.gibbons-u-s-government-and]], IV, 346–47. To check: Marcy to Fulbright, June 29, 1966 (National Archives, RG 46, Marcy Chron File); Rostow to Johnson, June 28, with Moyers''s note (LBJ Library, Files of Walt Rostow). See [[cal.1966-06-06.vietnam-congress]]. Names: Marcy, Rostow, Fulbright, Johnson, Moyers, Rusk.'
    tags: [name:marcy-carl, name:rostow-walt-w, name:fulbright-j-william, name:johnson-lyndon-b, name:moyers-bill, name:rusk-dean]
  - id: cal.1966-06-29.vietnam
    when: June 29–30
    date: '1966-06-29'
    thread: vietnam
    c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29. Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result; put off for weather and leaks; Johnson''s assent to McNamara by telephone, June 28. Wilson, told in advance, dissociates Britain. Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."'
    n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV, 360–78 (the decision, the NSC of June 17 and 22, Wilson''s dissociation, 369–71); [[w.pentagon-papers]], IV; [[w.drea-mcnamara-clifford-and-the-2011]], 75–76 (the NSC of June 22 and Ronning''s report; Wilson''s warning; the postponement; Johnson''s approval June 28; the strikes June 29); [[w.frankum-like-rolling-thunder]], 48–49 (the strikes of June 29; put off for weather); [[w.vietnam-victory-in-vietnam]], 181 (the strikes of June 29); [[w.staaveren-gradual-failure]], 279, 285–89 (the strikes; the directive of June 22 and Ronning''s visit; the postponements for the weather and the leak of June 24; the approval relayed June 28; Wilson told beforehand); [[w.dallek-flawed-giant]], 373–74 (the NSC of June 22, not its figures or Ronning; the strikes). Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). To check: [[w.herring-lbj-and-vietnam]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]; Msg, JCS to CINCPAC, 222044Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 288 n.27a); msg, CINCPAC to CINCPACFLT, CINCPACAF, 222044Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 288 n.27b); Msg, JCS to CINCPAC, 251859Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.28a); Washington Post, Jun 26, 66 (cited by [[w.staaveren-gradual-failure]], 289 n.28b); Msg, CJCS to CINCPAC, 281254Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.29); Msgs, CINCPAC to CINCPACAF and CINCPACFLT, 230943Z Jun 66 and 281932Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.30a); UPI dispatch (in Current News, Early Bird ed), Jun 29, 66, p 6 (cited by [[w.staaveren-gradual-failure]], 289 n.30b). Names: McNamara, William Bundy, Wilson, Holt, Ronning, Johnson.'
