    when: June 5
    date: '1966-06-05'
    thread: vietnam
    c: 'Westmoreland to Sharp, MAC 4612: the enemy in the South up to 267,000, mostly North Vietnamese regulars; his main effort in Kontum, Pleiku and Darlac by the sanctuaries, where he can win "strategic success." The answer: press toward the Laotian and Cambodian borders and strike before he is ready.'
    n: '[[w.gibbons-u-s-government-and]], IV, 359. To check: Westmoreland to Sharp, MAC 4612, June 5, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 359 n.16). Names: Westmoreland, Sharp.'
