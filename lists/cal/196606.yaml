    date: '1966-06-27'
    time: 1966-06-27T08:30Z
    place: tirana
    thread: china-zhou-foreign
    also: [china-foreign, comecon]
    c: Zhou holds the fourth talks with Hoxha, Shehu and the other Albanian leaders at the Partisan Palace.{1} By the Albanian record Zhou tells Hoxha and Shehu that class struggle goes on in socialist countries, Cuba, Romania, Korea and Vietnam among them, and names three anti-party groups in China, the last of Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; the way is to "peel the bamboo." He says the Koreans avoid China and meet the Soviets in secret, that Soviet revisionism is penetrating Vietnam, where Lê Duẩn has changed, and that China will help if Hanoi insists on resistance, though the Vietnamese fear Chinese troops. He adds that the Romanians printed only summaries of his speeches, and that a two-hour dispute with their leaders held up a rally in Romania.{2}
    n: '"[Excerpt from a Conversation between Zhou Enlai and Albanian Party Leaders, 27 June 1966](https://digitalarchive.umd.edu/document/300029)" (June 27, 1966), Arkivi Qendror Shtetëror (Central State Archives, Tirana, Albania), Fondi 14/AP, Marrëdhëniet me Partinë Komuniste të Kinës, V. 1966, Dos. 13, Fl. 001–130, contributed and trans. Elidor Mëhilli, Wilson Center Digital Archive (an excerpt, pp. 80–102 of the record''s 130, of talks of June 24–28; it names no place and gives no hour; the speaker says he will give his speech "this afternoon at the rally"). [[w.zhou-enlai-waijiao-huodong]], 499 (June 27, 1966; 9:30 a.m., Partisan Palace, Tirana). The book gives no content. Check: the book does not say whose clock; taken as local. Names: Zhou Enlai, Peng Zhen, Luo Ruiqing, Lu Dingyi, Lê Duẩn, Mehmet Shehu, Yang Shangkun.'
