  - id: cal.1966-06-03.china-leadership
    when: June 3
    date: '1966-06-03'
    thread: china-may-sixteenth
    also: [china-mao-cr, china-propaganda]
    c: 'Mao approves two Xinhua dispatches: the Center puts Li Xuefeng first secretary of the Peking committee, Wu De (from Jilin) second;{1} the new committee sends a work group under Zhang Chengxian to Peking University, removes Lu Ping and Peng Peiyun, and reorganizes the university committee.{2} Printed June 4.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 3, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 35 (June 3, 1966; Zhou reviews the Xinhua report on the reorganization of the Peking committee and drafts the Xinhua report on the Zhang Chengxian work group at Peking University, which acts for the Party committee; the *Renmin ribao* prints both June 4); [[w.macfarquhar-maos-last-revolution]], 65 (the announcement of Song Shuo, Lu Ping and Peng Peiyun''s dismissal); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 640–641 (June 3, 1966; the book says that with the consent of the Politburo Standing Committee the Peking committee sends a work group under Zhang Chengxian, then secretary of the Hebei provincial committee''s secretariat, into Peking University, to exercise the university committee''s powers and lead its movement; it prints the Xinhua dispatch on the reorganization, drafted by Zhou Enlai on the Standing Committee''s decision, which Mao read and approved; footnote 1 (640) gives Zhang''s post); [[w.mao-zedong-zhuan]], VI, ch. 74 (June 3 the Peking Municipal Committee sends a work team under Zhang Chengxian 张承先 to Peking University). [[w.yang-jisheng-tiandi-fanfu]], I, 186 (June 3 Xinhua announces together the Center''s decision to reorganize the Peking committee and the new committee''s decision to reorganize the Peking University committee; on the night of June 1 Zhang Chengxian 張承先, secretary of the Hebei committee, had entered the university with a few of the team); [[w.pu-weihua-zalan-jiu-shijie]], 152 (the evening of June 3 the Central People''s Broadcasting Station broadcasts the news of the work group''s entry into Peking University, a dispatch Zhou Enlai drafted on the standing members'' decision; the work group, sent in the North China Bureau''s name, now "decided by the newly reorganized Peking committee"; Mao reads it and agrees). Made public: June 4, 1966 (*Renmin ribao*). To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 39, 41 (cited by [[w.macfarquhar-maos-last-revolution]], 65 n.72). Names: Mao Zedong, Li Xuefeng, Wu De, Zhang Chengxian, Lu Ping, Peng Peiyun.'
