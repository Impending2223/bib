    also: [robert-kennedy]
    c: 'Robert Kennedy in South Africa, invited by the National Union of South African Students, whose president, Ian Robertson, is under a banning order.{1} Cape Town, June 6, the Day of Affirmation: "Each time a man stands up for an ideal ... he sends forth a tiny ripple of hope."{2} Then Stellenbosch, Durban, Johannesburg and Soweto;{3} Luthuli, banned, visited on his farm, by helicopter (Groutville: Check).{4} He lands at Johannesburg minutes before midnight, June 4, with Ethel Kennedy, Walinsky and Angie Novello.{5} Forty American journalists'' visas revoked; 1,500 break through to the plane.{6} At Natal University, before twenty thousand students: "What if God is black?"{7} At Cape Town 15,000 hear him.{8} At a farm near Durban, Luthuli is given a tape recorder and a recording of John Kennedy''s address of June 11, 1963, Lowenstein''s idea.{9}'
    n: 'Kennedy, Day of Affirmation address, from the advance text: [112 Cong. Rec. 12,429–31](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-10-2.pdf) (1966). [FRUS 1964–68, XXIV, doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v24/d212). [[w.schlesinger-robert-kennedy-and-his]], 743–48 (not Groutville); [[w.palermo-in-his-own-right]], 164 (the invitation; Luthuli; Soweto; not the places or days); [[w.thomas-robert-kennedy]], 322 (the Day of Affirmation: "a tiny ripple of hope"); [[w.branch-at-canaans-edge]], 473–75 (Johannesburg, the night of June 4, 1,500 at the airport, forty American journalists'' visas revoked; Natal University, "What if God is black?"; Cape Town, 15,000; Luthuli given a recording of John Kennedy''s address of June 11, 1963, Lowenstein''s idea); [[w.shesol-mutual-contempt]], 301–2 (the arrival before midnight June 4, with Ethel Kennedy, Walinsky and Angie Novello; Cape Town, June 6); [[w.thomas-robert-kennedy]], 321, 323 (the students'' union''s invitation; Robertson banned five days before Kennedy''s arrival, Saturday, June 4, shortly before midnight; Luthuli visited in the bush); [[w.shesol-mutual-contempt]], 301; [[w.branch-at-canaans-edge]], 473–74; [[w.branch-at-canaans-edge]], 474. To check: [[w.schlesinger-thousand-days-1965]], 800–808 (cited by [[w.branch-at-canaans-edge]], 473); Arriving statement, Johannesburg, South Africa, June 4, 1966, 11:40 p.m., Adam Walinsky Papers, Box 14, JFK (cited by [[w.branch-at-canaans-edge]], 474); Frank Taylor, "In South Africa," *National Observer*, June 13, 1966, at 1, 17 (cited by [[w.branch-at-canaans-edge]], 474); Chafe, *Never Stop Running* (1993), 282–84 (cited by [[w.branch-at-canaans-edge]], 474); Allard K. Lowenstein, oral history by Larry J. Hackman, April 23, 1969, and Dec. 2, 1969, JFK (cited by [[w.branch-at-canaans-edge]], 474); Senator Robert ee "Suppose God Is Black," *Look*, Aug. 23, 1966, p. 44 ff (cited by [[w.branch-at-canaans-edge]