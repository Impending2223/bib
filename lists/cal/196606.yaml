    c: 'Hangzhou.{1} Mao presides over an enlarged Standing Committee meeting that hears Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng and Tao Zhu on the Cultural Revolution.{2} Chen Boda also reports. Liu Shaoqi asks how the schools are to be done: some seize power, some criticize the academic authorities, then the teaching system is reformed; for the factories and villages, whether to join the cultural revolution to the "four clean-ups." The discussion reaches no clear view on work groups.{3} Liu and Deng seek Mao''s consent to the work teams; he stays evasive.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 9, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 36 (June 9–12, 1966; Zhou attends with Liu, Deng, Kang Sheng and Tao Zhu to report on the Cultural Revolution; during it he talks with Tao Zhu, Liu Lantao, Kang Sheng, Wang Dongxing and Jiang Qing); [[w.macfarquhar-maos-last-revolution]], 65 (Liu, Zhou, Deng, Tao Zhu and Chen Boda report to Mao, June 9–12); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641 (June 9–12, 1966; Liu goes to Hangzhou with Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda, Kang Sheng and others to report on the "Cultural Revolution" to Mao and, under Mao, discusses it; Liu says: how are the schools to be done? Some seize power, some criticize the academic authorities, then the reform of the teaching system, which settles a chain of problems such as examinations and textbooks; for the cultural revolution of factories and villages in the cities and countryside, is it to be joined with the "four clean-ups"? The discussion reached no clear view on whether to send work groups or not; footnote 1 (641) gives Tao Zhu''s post); [[w.macfarquhar-origins-of-the-cultural]], III, 461 (Liu and Deng fly to Hangzhou to ask about work teams; Mao temporizes and leaves them in charge); [[w.deng-xiaoping-nianpu-1904]], III, 1918 (June 9, 1966; Deng at the enlarged Standing Committee meeting Mao presides over at Hangzhou); [[w.mao-zedong-zhuan]], VI, ch. 74 (June 9–12 Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda, Kang Sheng and others go to Hangzhou to report to Mao on the cultural revolution). [[w.yang-jisheng-tiandi-fanfu]], I, 186 (June 9 6月9日 Liu Shaoqi, Zhou Enlai and Deng Xiaoping fly to Hangzhou to report and ask Mao to return to Peking to preside; Mao will not for now); [[w.dikotter-cultural-revolution]], 60 n.20 (Liu and Deng fly to Hangzhou to seek Mao''s consent to the work teams; he remains evasive; to his doctor afterwards: "Let them handle the problems of the movement by themselves"); [[w.pu-weihua-zalan-jiu-shijie]], 153–154 (June 9–12, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Tao Zhu, Chen Boda and Kang Sheng go to Hangzhou to report to Mao and discuss the cultural revolution under him; Liu: in the schools some to seize power, some to criticize the academic authorities, then reform of the school system, examinations and textbooks; in the factories and villages whether to join it to the Four Cleanups; no clear view on whether to send work groups); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641; [[w.dikotter-cultural-revolution]], 60. Made public: 1986 ([[w.lishi-zai-zheli-chensi]]). To check: [[w.nianyi-da-dongluande-niandai]], 34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 461 n.3a); [[w.al-zhongguo-gongchan-dang-zhizheng]], 272–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 461 n.3b); [[w.lishi-zai-zheli-chensi]], 1, 3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 461 n.3c). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Tao Zhu, Chen Boda.'
