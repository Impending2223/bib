    n: 'Remarks of Welcome to King Faisal of Saudi Arabia on the South Lawn at the White House, [1966 Pub. Papers 640](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=716) (June 21, 1966); Joint Statement Following Discussions With King Faisal of Saudi Arabia, [1966 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=721) (June 22, 1966). FRUS 1964–68, XXI, docs. [276](https://history.state.gov/historicaldocuments/frus1964-68v21/d276), [279](https://history.state.gov/historicaldocuments/frus1964-68v21/d279) (the luncheon; the dinner). The time is the first day''s. To check: [[w.bronson-thicker-than-oil]]. See [[cal.1964-11-02.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Lindsay, Rockefeller.'
