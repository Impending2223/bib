    when: June 14
    date: '1966-06-14'
    thread: mayors
    also: [elections-1966]
    c: 'Newark runoff. Addonizio re-elected over Carlin, his predecessor. First round May 10: Kenneth Gibson, engineer of the Housing Authority, third. Check the figures.'
    n: '[*New York Times*, May 11, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/11/issue.html); [June 15, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/15/issue.html). To check: [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]. Names: Addonizio, Carlin, Gibson.'
    tags: [state:nj, city:newark, name:addonizio-hugh-j, name:carlin-leo-p, name:gibson-kenneth-a]
