    n: 'Check: *Supplemental Report of the Secretary of State*, in *Reports and Resolutions* (1967), II, as [Wikipedia](https://en.wikipedia.org/wiki/1966_United_States_Senate_special_election_in_South_Carolina) gives it. To check: [[w.kalk-origins-of-the-southern]]; [[w.hollings-making-government-work]]. See [[cal.1965-04-22.south-carolina-sc]]. Names: Hollings, Russell, McNair, Rogers, Johnston.'
