    when: June 2
    date: '1966-06-02'
    thread: vietnam-air-war
    c: 'Wheeler to Sharp and Westmoreland, JCS 3086: the decision on the oil strikes close; Westmoreland to ask for them in a few days.'
    n: '[[w.gibbons-u-s-government-and]], IV, 367. To check: JCS 3086, June 2, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 367 n.51). See [[cal.1966-05-24.vietnam-air-war]]. Names: Wheeler, Sharp, Westmoreland.'
