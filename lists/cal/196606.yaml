    when: June 28–30
    date: '1966-06-28'
    thread: transition-and-staff
    c: Helms confirmed as Director of Central Intelligence, June 28; sworn June 30.
    n: 'Remarks at the Swearing In of Richard Helms as Director of the Central Intelligence Agency, [1966 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=753) (June 30, 1966). Check: the Record''s page. See [[cal.1966-06-18.vietnam]]. Names: Helms.'
