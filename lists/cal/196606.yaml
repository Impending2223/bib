  - id: cal.1966-06.china-leadership-27
    when: June
    date: 1966-06
    thread: china-may-sixteenth
    c: 'Deng Xiaoping 鄧小平 calls his daughter Deng Rong 鄧榕 home from the Normal University''s girls'' middle school and tells her: trust the work group and obey it; if your views now agree, of course you obey; if later they differ, you obey all the same. Deng Rong says so in her exposure of him in April 1967.'
