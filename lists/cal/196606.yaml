    when: June 2
    date: '1966-06-02'
    thread: europe-and-the-alliance
    c: 'Rostow to Johnson: "On balance, I think a Wilson visit is a good idea. But it must be publicly focused on NATO and other matters, not Vietnam."'
    n: '[[w.gibbons-u-s-government-and]], IV, 370 n.59. Names: Rostow, Johnson, Wilson.'
