  - id: cal.1966-06-21.china-leadership-6
    when: June 21
    date: '1966-06-21'
    thread: china-may-sixteenth
    also: [china-liu]
    c: Deng Xiaoping 邓小平, with Liu Shaoqi 刘少奇, presides at the enlarged Politburo 政治局 Standing Committee 政治局常委会 meeting, which hears reports on the 'cultural revolution'. On the work teams' methods and other questions he gives his views and sharply rebuts Chen Boda's 陈伯达 proposal to withdraw the work teams. The meeting calls for strengthening leadership of the movement, no random seizing, hauling out or struggling, no beating, insulting or disguised corporal punishment, no taking power at will, no knocking down everything; it asks that Party and League life be resumed, production, work and life attended to, and the normal social order kept.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1920 (June 21, 1966); [[w.yang-jisheng-tiandi-fanfu]], I, 197–198 (June 21 Liu and Deng again call the enlarged Politburo to study the movement; Deng offers views on the work groups'' methods; after the spirit is carried down, "the anarchist phenomena are checked"); [[w.pu-weihua-zalan-jiu-shijie]], 164 (June 21, Liu Shaoqi at the enlarged Standing Committee: some schools drive out the work groups and seize power from them, wanting files, guns and broadcasting; no seizing of power at will; bad work groups may be withdrawn, but to break off the Party''s leadership is bad, most committees are good; counter-revolutionaries appear in "left" and right guise; no beating, insulting or disguised corporal punishment, by the Twenty-three Articles; Liu and Deng saw a counter-current, the Center decided to back the work groups against interference; the *Liu Shaoqi zhuan*, II, 1025 (164 n.110)). The words: 晚 (III, 1920). Made public: 2009 (the nianpu). To check: Mao Mao 毛毛, *Wode fuqin Deng Xiaoping "wenge" suiyue* 《我的父親鄧小平「文革」歲月》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2000), 20 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 198 n.20); [[w.liu-shaoqi-zhuan]], II, 1025 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 164 n.110). Names: Deng Xiaoping, Liu Shaoqi, Chen Boda.'
