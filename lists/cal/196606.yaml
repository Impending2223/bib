    c: Li Xuefeng 李雪峰, first secretary of the new Peking committee 北京市委, speaks at its work conference at the Peking Hotel 北京飯店.{1} The situation is excellent; reactionary forces, views and actions have come out in every school; "if there are counter-revolutionaries, it is nothing; arrest them and be done."{2} To support or oppose the new committee is now the mark of supporting or opposing the Party.{3} The rightists who drive out the work teams must be cleaned up; if Communists do not stand up, Nagy will come to power.{4} He calls for "catching the swimming fish" and "resisting interference."{5}
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 199; [[w.pu-weihua-zalan-jiu-shijie]], 165 (June 23, Li Xuefeng''s report at the Peking Hotel: most against the work groups a contradiction among the people, but bad men contest the leadership with them; Mao''s "one carp, three waves"; the situation excellent, reaction come out in every school; "counter-revolutionaries are nothing: arrest them and be done"; the rightists who drive out the work groups to be cleaned up; if Communists do not stand up, Nagy will come to power (165 n.111 on Nagy); "resist interference"; Party and League life to be restored, 95 percent of members good). The words: 「抓游魚」「反干擾」 (I, 199). Made public: 1998. Names: Li Xuefeng.'
