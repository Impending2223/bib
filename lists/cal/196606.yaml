  - id: cal.1966-06-01.vietnam
    when: June 1
    date: '1966-06-01'
    thread: vietnam
    c: Fulbright with Johnson at the White House, 6:20 to 8:13 p.m., brought by Clinton Anderson, who leaves them; Rostow joins; Johnson doing most of the talking on the war's choices. Fulbright still without confidence in the policy; he will "keep in touch."
    n: '[[w.dallek-flawed-giant]], 370–71 (the meeting, "nearly two hours"; the talk; Fulbright''s answer: 371); [[w.gibbons-u-s-government-and]], IV, 343–44 (Rostow''s notes). To check: Rostow''s notes, President''s Daily Diary, June 1, 1966 (LBJ Library); Diary Backup, June 1, 1966, LBJ Library (cited by [[w.dallek-flawed-giant]], 371); Watson to Johnson, May 27, 1966, President''s Appointment File, Diary Backup for June 1, 1966, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 343 n.95). See [[cal.1966-02-04.vietnam]]. Names: Fulbright, Johnson, Clinton Anderson, Rostow.'
