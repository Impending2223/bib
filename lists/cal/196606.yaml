    c: 'Saigon. D''Orlandi, the Italian ambassador, to Lodge, June 29: Lewandowski, the Polish member of the ICC, has brought a "very specific peace offer" from Hanoi; the NLF to "take part" in negotiations, not as sole representative; a "suspension" of the bombing; American withdrawal on a "reasonable calendar." Lodge, June 30: new in substance, "so forthcoming as to arouse suspicion." Johnson to Martin of the Federal Reserve, June 30: "the most persuasive peace feeler I''ve had since I''ve been President."'
    n: 'FRUS 1964–68, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1964-68v04/d167), [169](https://history.state.gov/historicaldocuments/frus1964-68v04/d169), [170](https://history.state.gov/historicaldocuments/frus1964-68v04/d170). [[w.gibbons-u-s-government-and]], IV, 390–91, 495–98 (the offer, 390–91); [[w.herring-lbj-and-vietnam]], 104–07 (the channel at Saigon, D''Orlandi, Lewandowski and Lodge; its course to Dec. 15; not this meeting). Made public: in outline, [[w.kraslow-secret-search-for-peace]] (1968); the telegrams, [[w.herring-secret-diplomacy-of-the]] (1983). To check: [[w.hershberg-marigold]]; [[w.herring-secret-diplomacy-of-the]]. Names: Lodge, Lewandowski, D''Orlandi, Martin, Johnson.'
