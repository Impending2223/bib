    n: '[*New York Times*, June 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html). [[w.dittmer-local-people]], 398; [[w.branch-at-canaans-edge]], 487–88 (King: "I believe in my heart that the murderers are somewhere around me at this moment"; some 25 whites surge over the television men; night riders fire into the Negro neighborhood); [[w.kotz-judgment-days]], 360 (King: "the murderers are somewhere around me"; Price: "You''re damn right; they''re right behind you right now"); [[w.young-easy-burden]], 401 (the truck driven through the march; Rainey and Price in the crowd; Abernathy''s prayer). To check: Paul Good, "The Meredith March," New South, Summer 1966, p. 11 (cited by [[w.branch-at-canaans-edge]], 487); [[w.mars-witness-in-philadelphia]], 207 (cited by [[w.branch-at-canaans-edge]], 487); [*New York Times*, June 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html), at 25 (cited by [[w.branch-at-canaans-edge]], 487, 488); [[w.garrow-bearing-the-cross]], 483 (cited by [[w.branch-at-canaans-edge]], 488); Frank, *An American Death* (1972), 68–69 (cited by [[w.branch-at-canaans-edge]], 488); "Philadelphia, Miss., Whites and Negroes Trade Shots," ibid., p. 1 (cited by [[w.branch-at-canaans-edge]], 488). See [[cal.1966-06-06.mississippi]]; [[cal.1964-08-04.mississippi]]. Names: King, Chaney, Goodman, Schwerner, Price.'
