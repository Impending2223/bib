    c: 'NSC, 12:30 p.m., on the oil strikes. McNamara: truck traffic up 100 percent, infiltration 120; civilian dead 50 to 300. Wheeler: "In a very real sense, this is a war of attrition"; next, mining Haiphong. Johnson: "I don''t get any alternatives"; "Are you more sure than MacArthur was?"; public approval "deteriorating." Taylor: mine Haiphong too. All for the strikes but Goldberg.'
