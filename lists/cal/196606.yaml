    also: [vietnam-hanoi, china-foreign]
    c: Zhou Enlai leads the Chinese party and government delegation to Romania.{1} On the way he stops briefly in Afghanistan and tells Prime Minister Maiwandwal that the key to Vietnam is restoring the Geneva Agreements, and the key to that the withdrawal of U.S. troops and its allies troops from the South and the rest of Indochina, the end of aggression, and the Vietnamese and Indochinese peoples settling their own affairs.{2}
    n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Maurer''s account to Phạm Văn Đồng, Oct. 3, 1966: the Romanians asked Zhou not to give, in his speech in Bucharest, his views on the Soviet Union and its policy; he did not, and seemed very dissatisfied; he rejected their urging to find a way to talk with the Soviet leaders, whom he called traitors. [[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 16, 1966); [[w.zhou-enlai-waijiao-huodong]], 496 (June 16–24, 1966; June 16, before dawn, leaving at the invitation of the Romanian Communist Party and government for a friendly visit; morning, Kabul, talks at the prime minister''s office with Prime Minister Maiwandwal); [[w.zhonghua-renmin-gongheguo-waijiao]], 109 (June 16, 1966; the talks at Kabul with Maiwandwal: the key is restoring the Geneva agreements, and to that the full U.S. withdrawal). Names: Zhou Enlai. Check: the day of the Afghan stop.'
