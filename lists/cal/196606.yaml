    c: 'Hangzhou. Mao to the enlarged Standing Committee meeting: first seize power and criticize the authorities, then reform teaching and the school system. Entrance examinations to be set, by school nomination and selection;{1} this year''s university admission put off half a year;{2} textbooks rewritten.{3} A blow at 5 percent is plenty.{4} Work groups sent too early are no good; let it be chaotic first, then send them when things are clear.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 12, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 12, 1966; at Mao''s: on naming in the press, Zhou says organs of dictatorship should only circulate, not print; print a few of the reorganized, or foreigners will know at once); [[w.mao-zedong-zhuan]], VI, ch. 74 n.54 (June 12, hearing Liu Shaoqi and the others: work teams sent too quickly are not good, there has been no preparation; better to let it be chaotic and have a free-for-all, then send them when things are clear; students read no books, in half a year ''what lives most is reading newspapers'', n.54). [[w.yang-jisheng-tiandi-fanfu]], I, 197 (June 12 12日, at Hangzhou, Mao: this year''s university entrance put off half a year for half a year of cultural revolution; work groups sent too fast are no good, unprepared, better to let it go chaotic, a free-for-all, and send them when the situation is clear); [[w.pu-weihua-zalan-jiu-shijie]], 154, 154 n.100 (Mao in the discussion: "sending work groups too fast is not good; there is no preparation; better let it be chaotic, a free-for-all, and send them when things are clear"; the talk not published, its gist known from later accounts: Li Dazhang heard at the Hangzhou meeting of June 12 Mao''s instruction not to send, to send few, to send late; Jiang Weiqing''s memoir relays the points of Mao''s talks of June 10 and 12: the schools to seize power, the universities first; a blow at 5 percent is not few; no hurry to send work groups, let a free-for-all run for some months (154 n.100)). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, interjections while hearing Liu Shaoqi 刘少奇 and others report (record 插话记录), June 12, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.54); [[w.jiang-weiqing-qishi-nian-zhengcheng]], 515 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 154 n.100). Names: Mao Zedong.'
