    n: 'Remarks at a Meeting With Medical and Hospital Leaders To Prepare for the Launching of Medicare, [1966 Pub. Papers 605](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=681) (June 15, 1966). See [[cal.1965-07-30.medicare]]. Names: Johnson.'
