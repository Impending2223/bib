  - id: cal.1966-06-01.civil-rights-the-executive
    when: June 1–2
    date: '1966-06-01'
    thread: civil-rights-the-executive
    also: [civil-rights-organizations]
    c: 'White House Conference "To Fulfill These Rights," Heineman chairman, Randolph honorary chairman. Johnson to the delegates, June 1: the issue "is beyond the mastery of one man or one group of men." SNCC stays away.'
    n: 'Remarks to the Delegates to the White House Conference "To Fulfill These Rights", [1966 Pub. Papers 571](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=647) (June 1, 1966). [[w.mcpherson-political-education]], 346–48 (Heineman; Louis Martin''s arrangements; Johnson at the closing dinner); [[w.sundquist-politics-and-policy]], 285 (the conference, June 1966; Heineman''s council; Randolph honorary chairman); [[w.branch-at-canaans-edge]], 471–72 (the pickets, "Uncle Toms!"; Johnson''s unscheduled arrival, 9:40 p.m.; seventeen ovations; Marshall introduced; Nabrit''s ruling against a motion on Vietnam, ten to one, June 2); [[w.kotz-judgment-days]], 358–60 (SNCC away, of the "tragic gulf between promise and fulfillment"; Moynihan kept out, King given one session; at the Shoreham Johnson introduces Marshall); [[w.anderson-confronting-the-color-line]], 194 (the conference, June 1–2); [[w.dallek-flawed-giant]], 327–28 (the White House civil rights conference of June 1–2, "To Fulfill These Rights"; Johnson''s speech: "this issue is beyond the mastery of one man or one group of men" (328); not the day of the speech, the chairmen or SNCC). To check: [[w.rainwater-moynihan-report-and-the]]; [[w.graham-civil-rights-era]]; "Militants Fail to Sway Delegates," *Washington Post*, June 2, 1966, at 1 (cited by [[w.branch-at-canaans-edge]], 471); "Picketers, Conferees Swap Jests," *Washington Post*, June 2, 1966, at 4 (cited by [[w.branch-at-canaans-edge]], 471); *Southern Courier*, June 4–5, 1966, pal: "Black Jesus!": [*New York Times*, June 2, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/02/issue.html), at 21 (cited by [[w.branch-at-canaans-edge]], 471); Harry McPherson memo of June 2, 1966, attached to PDD, June 2, 1966, LBJ (cited by [[w.branch-at-canaans-edge]], 471); Robert E. Kintner, "Appearance at the Civil Rights Conference, Sheraton Park Hotel," 3:00 p.m., June 1, 1966, White House Conference, Box 56, LBJ (cited by [[w.branch-at-canaans-edge]], 471); President''s Daily Diary, June 1, 1966, LBJ (cited by [[w.branch-at-canaans-edge]], 471); Int. Harry McPherson, Oct. 10, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 471); [*New York Times*, June 2, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/02/issue.html), p (cited by [[w.branch-at-canaans-edge]], 471); *Jet*, June 16, 1966, pp. 16—20 (cited by [[w.branch-at-canaans-edge]], 472); McPherson, *A Political Education* (1988), 347–48 (cited by [[w.branch-at-canaans-edge]], 472); [[w.anderson-confronting-the-color-line]], 194–95 (cited by [[w.branch-at-canaans-edge]], 472); Garrow, Bearing, pete: attractive female college students: Int. Harry McPherson, Oct. 10, 1991 (cited by [[w.branch-at-canaans-edge]], 472); *Jet*, June 16, 1966, at 31 (cited by [[w.branch-at-canaans-edge]], 472); [*New York Times*, June 4, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/04/issue.html), at 12 (cited by [[w.branch-at-canaans-edge]], 472); *Washington Post*, June 3, 1966, at 1 (cited by [[w.branch-at-canaans-edge]], 472). See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph, Heineman, Johnson.'
