  - id: cal.1966-06-01.china-leadership
    when: June 1
    date: '1966-06-01'
    place: hangzhou
    thread: china-may-sixteenth
    also: [china-mao-cr, china-propaganda]
    c: 'Mao to Kang Sheng and Chen Boda, on the wall poster of Nie Yuanzi and six others at Peking University ("What have Song Shuo, Lu Ping and Peng Peiyun been doing in the Cultural Revolution?"): Xinhua to broadcast it whole, the papers to print it;{1} "the reactionary fortress can be broken from here."{2} It is broadcast that evening;{3} the *Renmin ribao* prints it June 2 with a commentator''s article and an editorial.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 1, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 34 (June 1, 1966; the radio broadcast that evening of the Nie Yuanzi poster; the *Renmin ribao* of June 2 prints it with a commentators article); [[w.macfarquhar-maos-last-revolution]], 58 (Mao reads it at noon; broadcast at 8:30 p.m.); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 639 (June 1 and 2, 1966; the book says Kang Sheng instigated the poster of Nie Yuanzi and six others at Peking University, "What have Song Shuo, Lu Ping and Peng Peiyun done in the Cultural Revolution?", and that it was broadcast across the country with Mao''s approval; June 2 the *Renmin ribao* prints it in full with a commentator''s article, "Hail a big-character poster of Peking University," and an editorial, "Touch the people''s souls: a great revolution," and students everywhere rise); [[w.macfarquhar-maos-last-revolution]], 80–81 (Mao came across the poster''s text in issue 13 of the Group''s Cultural Revolution Bulletin); [[w.jianguo-yilai-mao-zedong]], XVIII, 271–272 (June 1, 1966; Mao''s letter to Kang Sheng and Chen Boda, June 1, on the *Wenhua geming jianbao* 文化革命简报 no. 13, compiled May 27 by the editorial offices of *Hongqi* and *Guangming ribao* 光明日报, which printed the poster of May 25 by Nie Yuanzi 聂元梓, Song Yixiu 宋一秀, Xia Jianzhi 夏剑豸, Yang Keming 杨克明, Zhao Zhengyi 赵正义, Gao Yunpeng 高云鹏 and Li Xingchen 李醒尘 of the philosophy department); [[w.mao-zedong-zhuan]], VI, ch. 74 nn.42, 43 (Mao, at Hangzhou, reads the Nie Yuanzi 聂元梓 poster in no. 13 of the *Wenhua geming jianbao*; his note to Kang Sheng and Chen Boda: Xinhua to broadcast it whole and the papers everywhere to print it; Peking University, a reactionary fortress, can from this be broken; the Central People''s Broadcasting Station reads the poster that evening; on June 2 the *Renmin ribao* prints it whole, with a commentator''s article by Wang Li 王力, Guan Feng 关锋 and Cao Yi''ou 曹轶欧 added, to which in Aug. Mao adds a note, n.43). [[w.yang-jisheng-tiandi-fanfu]], I, 181, 185–186 (June 1, Mao at Hangzhou to Kang Sheng and Chen Boda: Xinhua to broadcast the poster, 〈宋碩、陸平、彭珮云在文化革命中究竟干些甚么？〉, whole, and all the papers to print it; the reactionary fortress of Peking University can from now begin to be broken; at 8 p.m. that evening 6月1日晚8點 the Central People''s Broadcasting Station reads it whole; the *Renmin ribao* follows with a commentator''s article 〈歡呼北大的一張大字報〉; Mao telephones Kang Sheng and Chen Boda that it is the Peking commune''s manifesto of the 1960s, of more weight than the Paris Commune); [[w.peng-zhen-nianpu-1902]], IV, 487 (June 1, 1966; Mao to Kang Sheng and Chen Boda: Xinhua may broadcast it in full and all papers print it; broadcast that night; on the 2nd *Renmin ribao* prints it with the commentator''s "Hail a big-character poster at Peking University," calling the university''s Party a "sham Communist Party," a "revisionist party"; "struggle against black gangs" aimed at Party heads, presidents and teachers soon in many cities'' schools); [[w.jian-zhou-enlai]], 545 (the evening of June 1 the central radio reads the poster of seven Peking University teachers against the university''s "conspiratorial activities against the Cultural Revolution"; Kang Sheng had brought it to Mao, who ordered Xinhua to "broadcast this text in its entirety"; Zhou unprepared); [[w.dikotter-cultural-revolution]], 57 n.12 (Kang sends Mao a copy of the poster of May 25; Mao: "even more significant than the manifesto of the Paris commune"; broadcast that evening); [[w.pu-weihua-zalan-jiu-shijie]], 129–130 (at noon Mao comments on the *Jianbao* no. 13: to Kang Sheng and Boda, Xinhua may broadcast it in full and the papers everywhere print it, "most necessary"; the reactionary fortress of Peking University can from now begin to be broken; "please act"; the Central People''s Broadcasting Station broadcasts it at 8 p.m. that evening; the *Renmin ribao* of June 2 prints it in full on its front page, under "Seven comrades of Peking University expose a big plot in a poster," with the commentator''s article "Hail Peking University''s poster"; the Wengao, XII, 62 (130 n.74)); [[w.chen-yun-nianpu-xiuding]], III, 153 (that evening the Central People''s Broadcasting Station broadcasts, with Mao''s approval, the poster of Nie Yuanzi 聂元梓 and six others falsely charging the Peking University Party committee and the Peking committee). Made public: June 1, 1966 (the broadcast); Mao''s note, 2013. Check: MacFarquhar (58) has Mao read the poster at noon and telephone Kang Sheng and Chen Boda that afternoon; the broadcast at 8:30 p.m.; Zhou Enlai told by Kang a few hours before; Liu Shaoqi with no warning. To check: the poster of May 25 as printed in the *Cultural Revolution Bulletin* no. 13, May 27; [[w.zedong-jianguo-yilai-mao-zedong]], XII, 62 (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.34a); [[w.hongbiao-wengede-di-yi-zhang]], 43 (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.34b); [[w.zhou-enlai-nianpu-1949]], III, 33 (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.35); [[w.zheng-liu-shaoqide-zuihou-suiyue]], 64 (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.37); "Hail Beida''s Big-Character Poster," Renmin ribao commentator''s article, June 2, 1966 (translated in Peking Review, no. 37, Sept. 9, 1966, 21–22), in [[w.wenhua-dageming-yanjiu-ziliao]], I, 36–37 (cited by [[w.macfarquhar-maos-last-revolution]], 58 n.38); Hongqi and Guangming ribao editorial offices, Wenhua geming jianbao no. 13, May 27, 1966, printing the Peking University poster of May 25 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 271 n.1a); Nie Yuanzi, Song Yixiu, Xia Jianzhi, Yang Keming, Zhao Zhengyi, Gao Yunpeng and Li Xingchen, big-character poster "What are Song Shuo, Lu Ping and Peng Peiyun doing in the Cultural Revolution?", Peking University, May 25, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 271 n.1b); Mao Zedong 毛泽东, comment on the *Wenhua geming jianbao* 《文化革命简报》 no. 13 of the *Hongqi* 红旗 editorial office and the *Guangming ribao* 光明日报 editors'' office (manuscript 手稿), June 1, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.42); [[w.xianzhi-mao-zedong-zhuan-1949]], 1407 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 185 n.56). Names: Mao Zedong, Kang Sheng, Chen Boda, Nie Yuanzi, Song Shuo, Lu Ping, Peng Peiyun.'
