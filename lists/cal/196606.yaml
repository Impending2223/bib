  - id: cal.1966-06-10.china-leadership
    when: June 10
    date: '1966-06-10'
    place: hangzhou
    thread: china-may-sixteenth
    also: [vietnam-hanoi, china-mao-cr, china-foreign]
    c: 'Hangzhou.{1} Mao receives Hồ Chí Minh, Kang Sheng, Wu Xiuquan and Jiang Qing present.{2} He says he may not outlast the next year (he is then 73, a dangerous age by the Chinese saying); everything divides in two; Bernstein and Kautsky were Marx''s and Engels''s heirs, and who China''s are, Bernstein, Kautsky or Khrushchev, is not known; there is time to prepare.{3} The struggle began in Nov. 1965 with the young Yao Wenyuan. On industry: begin small, in China and Vietnam, and grow.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 10, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 36 (June 10, 1966; Zhou with Mao at the meeting with Hồ Chí Minh); [[w.macfarquhar-maos-last-revolution]], 38 n.27 (the meeting of June 10); [[w.mao-zedong-zhuan]], VI, ch. 74 n.48 (June 10, a long heart-to-heart: he will be about done this year or next, for Chinese say 73 and 84 and he is 73 next year; everything divides in two; Marx''s and Engels''s heirs Bernstein and Kautsky; who China''s heirs are, Bernstein, Kautsky or Khrushchev, is not known; prepare, ''there is yet time''; the record, n.48; place not given). [[w.yang-jisheng-tiandi-fanfu]], I, 50 (Mao at Hangzhou to Hồ Chí Minh: we are all past seventy and will one day be invited by Marx; who the successor is, Bernstein, Kautsky or Khrushchev, cannot be known; prepare, there is still time; do not look to those now shouting "long live"); [[w.zhu-de-nianpu-xinbian]], III, 1954 (June 10, 1966; Mao Zedong 毛泽东, at Hangzhou 杭州, talks with Hồ Chí Minh 胡志明: revisionism has appeared in China too; Peng Zhen 彭真, Luo Ruiqing 罗瑞卿, Lu Dingyi 陆定一 and Yang Shangkun 杨尚昆 are friends of his and of Mao''s; Peking was an independent kingdom no one could question; this time hundreds or thousands, great and small, may be brought down, in learning, education, the press, publishing, literature and art, and the universities and schools). Made public: 2006. Check: MacFarquhar (38 n.27) has Mao tell Hồ Chí Minh of the four purged: "these are all my friends.". Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.zhonghua-renmin-gongheguo-fengyun]], I, 1054 (cited by [[w.macfarquhar-maos-last-revolution]], 38 n.27); Mao Zedong 毛泽东, talk with Hồ Chí Minh 胡志明 (record 谈话记录), June 10, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.48). Names: Mao Zedong, Hồ Chí Minh, Kang Sheng, Wu Xiuquan, Jiang Qing, Yao Wenyuan.'
