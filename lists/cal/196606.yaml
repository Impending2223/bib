    c: 'Robert Kennedy, in a statement on the bombing of Haiphong: "Will this step effectively prevent North Vietnam from supplying the Viet Cong in the South with sufficient men and materiel to enable them to continue the war at the levels they desire?"{1} Past escalations came with "assurances and predictions" never fulfilled; "on each occasion, the effort from the North has either increased in spite of our efforts, or taken a different and more dangerous course."{2}'
