# Cal. LXXX June 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXX
entries:
  - id: cal.1966-06-01.civil-rights-the-executive
    when: June 1–2
    date: '1966-06-01'
    thread: civil-rights-the-executive
    also: [civil-rights-organizations]
    c: 'White House Conference "To Fulfill These Rights," Heineman chairman, Randolph honorary chairman. Johnson to the delegates, June 1: the issue "is beyond the mastery of one man or one group of men." SNCC stays away.'
    n: 'Remarks to the Delegates to the White House Conference "To Fulfill These Rights", [1966 Pub. Papers 571](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=647) (June 1, 1966). [[w.rainwater-moynihan-report-and-the]]; [[w.graham-civil-rights-era]]. See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph, Heineman, Johnson.'
    tags: [name:johnson-lyndon-b, name:randolph-a-philip, name:heineman-ben-w]
  - id: cal.1966-06-01.latin-america
    when: June 1–2
    date: '1966-06-01'
    thread: latin-america
    c: 'Dominican Republic. Balaguer elected president over Bosch, 57.09 percent to 39.17, Bonnelly 3.4, by Rostow''s figures; some 1.4 million voting. June 2, Johnson to García-Godoy: "the tranquility of free elections. There can be no greater tribute."'
    n: 'Message to Provisional President Garcia-Godoy Following the Election in the Dominican Republic, [1966 Pub. Papers 577](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=653) (June 2, 1966). [FRUS 1964–68, XXXII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v32/d178). [[w.slater-intervention-and-negotiation]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-09-03.latin-america]]. Names: Bosch, Balaguer, García-Godoy, Bonnelly, Rostow, Johnson.'
    tags: [name:balaguer-joaquin-videla, name:bosch-juan, name:rostow-walt-w, name:garcia-godoy-hector, name:johnson-lyndon-b, name:bonnelly-rafael-f]
  - id: cal.1966-06-01.opinion
    when: June 1
    date: '1966-06-01'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, May 5–10: white parents who would object to a school where a few of the children are colored: outside the South 6 percent, South 24; where half are, 32 and 49; where more than half are, 60 and 62.'
    n: '[[w.gallup-poll]], III, 2010.'
  - id: cal.1966-06-01.vietnam-struggle
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: Huế. Students sack and burn the American consulate (Check the date).
    n: '[FRUS 1964–68, IV, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150) (Westmoreland to Wheeler, June 2). See [[cal.1966-03-10.vietnam]].'
    tags: [place:hue]
  - id: cal.1966-06-02.space
    when: June 2
    date: '1966-06-02'
    thread: space
    c: 'Surveyor 1, launched May 30 from Cape Kennedy, Fla., lands softly on the moon, in the Ocean of Storms, the first American spacecraft to do so; the Soviet Luna 9 had landed Feb. 3. Its pictures on television the same morning. Johnson: prints to be offered to the world''s scientists; June 8, sent to foreign nations.'
    n: 'Statement by the President Following the Landing of Surveyor I on the Moon, [1966 Pub. Papers 575](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=651) (June 2, 1966); Statement by the President Upon Sending to Foreign Nations Prints of Lunar Photographs Made by Surveyor I, [1966 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=666) (June 8, 1966). [[w.nicks-far-travelers]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-03.space
    when: June 3–6
    date: '1966-06-03'
    thread: space
    c: 'Gemini 9: Stafford and Cernan, up June 3. Their Agena target lost May 17, when its Atlas failed; the substitute, launched June 1, met in orbit with its shroud half open, "an angry alligator" (Stafford), and no docking. June 5, Cernan outside the spacecraft over two hours, his visor fogged, the backpack test given up. Down June 6.'
    n: '[NASA, *Astronautics and Aeronautics, 1966*, NASA SP-4007 (1967), 206–207](https://ntrs.nasa.gov/api/citations/19670029479/downloads/19670029479.pdf#page=215). [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]; [[cal.1966-02-28.space]]. Names: Stafford, Cernan.'
    tags: [name:stafford-thomas-p, name:cernan-eugene-a]
  - id: cal.1966-06-03.opinion
    when: June 3
    date: '1966-06-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 5–10: the United States made a mistake sending troops to fight in Vietnam: yes 36 percent, no 49. Republicans 42 yes; independents 37; Democrats 32. Under 30, 29; 50 and over, 42. Canadians, a special survey, the United States'' handling of Vietnam: approve 35, disapprove 34.'
    n: '[[w.gallup-poll]], III, 2010.'
  - id: cal.1966-06-04.africa
    when: June 4–9
    date: '1966-06-04'
    thread: africa
    also: [robert-kennedy]
    c: 'Robert Kennedy in South Africa, invited by the National Union of South African Students, whose president, Ian Robertson, is under a banning order. Cape Town, June 6, the Day of Affirmation: "Each time a man stands up for an ideal ... he sends forth a tiny ripple of hope." Then Stellenbosch, Durban, Johannesburg and Soweto; Luthuli, banned, visited at Groutville (Check).'
    n: 'Kennedy, Day of Affirmation address, from the advance text: [112 Cong. Rec., Senate, June 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-10-2.pdf), 12429–31. [FRUS 1964–68, XXIV, doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v24/d212). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. See [[cal.1964-06-12.africa]]. Names: Robert Kennedy, Luthuli, Ian Robertson.'
    tags: [name:kennedy-robert-f, name:luthuli-albert-john, name:robertson-ian]
  - id: cal.1966-06-06.mississippi
    when: June 6
    date: '1966-06-06'
    thread: mississippi-meredith
    also: [civil-rights-organizations]
    c: Meredith, walking alone from Memphis to Jackson since June 5 "against fear," shot from the roadside south of Hernando, Miss., by Aubrey James Norvell, of Memphis (Check); wounded by birdshot, taken to a Memphis hospital.
    n: '[*New York Times*, June 7, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/07/issue.html). [[w.goudsouzian-down-to-the-crossroads]]; [[w.meredith-mission-from-god]]; [[w.dittmer-local-people]]; [[w.branch-at-canaans-edge]]; [[w.garrow-bearing-the-cross]]; [[w.carson-in-struggle]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1962-10-01.mississippi]]. Names: Meredith, Norvell.'
    tags: [name:meredith-james-h, name:norvell-aubrey-james]
  - id: cal.1966-06-06.court
    when: June 6
    date: '1966-06-06'
    thread: court
    also: [press-and-broadcasting]
    c: '*Sheppard v. Maxwell*, [384 U.S. 333](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384333/usrep384333.pdf): a murder conviction of 1954 at Cleveland set aside; the trial judge let the publicity and the press in the courtroom deny the defendant a fair trial. Ohio to try him again or release him. Clark for the Court, 8–1; Black dissents.'
    n: '[[w.powe-warren-court-and-american]].'
  - id: cal.1966-06-06.india-and-china
    when: June 6
    date: '1966-06-06'
    thread: south-asia
    c: 'India devalues the rupee, from 4.76 to 7.50 to the dollar, the first step of the program Asoka Mehta worked out with the World Bank''s Woods. Rostow to Johnson, June 11: opposition in her own party, from the Left and from business; Indira Gandhi "needs the prompt response of aid donors."'
    n: 'FRUS 1964–68, XXV, docs. [345](https://history.state.gov/historicaldocuments/frus1964-68v25/d345), [349](https://history.state.gov/historicaldocuments/frus1964-68v25/d349). [[w.kux-india-and-the-united]]. See [[cal.1966-03-28.india-and-china]]. Names: Rostow, Mehta, Woods, Indira Gandhi, Johnson.'
    tags: [name:gandhi-indira, name:mehta-asoka, name:woods-george-d, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-06-06.europe-and-the-alliance
    when: June 6–8
    date: '1966-06-06'
    thread: europe-and-the-alliance-france
    c: 'Brussels, the NATO ministers. The Fourteen, June 6: the military headquarters out of France, SHAPE to the Benelux countries, the Defense College to Italy, the Standing Group abolished. June 8, Couve de Murville yields on procedure: the French forces in Germany to be negotiated. Rusk: "the family of 14" remains together.'
    n: 'FRUS 1964–68, XIII, docs. [174](https://history.state.gov/historicaldocuments/frus1964-68v13/d174), [175](https://history.state.gov/historicaldocuments/frus1964-68v13/d175), [177](https://history.state.gov/historicaldocuments/frus1964-68v13/d177). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Rusk, Couve de Murville.'
    tags: [name:rusk-dean, name:couve-de-murville-maurice]
  - id: cal.1966-06-07.elections-1966
    when: June 7
    date: '1966-06-07'
    thread: elections-1966
    c: 'California''s primary. Republican: Reagan 1,417,623, 64.8 percent; Christopher, once mayor of San Francisco, 675,683. Democratic: Brown, seeking a third term, 1,355,262, 52.7 percent; Yorty, mayor of Los Angeles, 981,088.'
    n: 'Votes: [Cal. *Statement of Vote*, June 7, 1966, p. 6](https://archive.org/details/californiastate196668cali/page/n13). [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]. See [[cal.1966-01-04.states-and-cities]]. Names: Reagan, Brown, Yorty, Christopher.'
    tags: [name:reagan-ronald, name:brown-edmund-g, name:yorty-sam, name:christopher-george, state:ca]
  - id: cal.1966-06-07.specials
    when: June 7
    date: '1966-06-07'
    thread: specials
    c: 'California 14th, special, held with the primary. Waldie (D), majority leader of the State Assembly, takes the seat of Baldwin (R), who died Mar. 9, with a majority, so no run-off: Waldie 71,501 of 139,754; Newman (R) 43,539; Richardson (R) 14,693. Swing 27.1 to D.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 5](https://archive.org/details/californiastate196668cali/page/n50). See [[cal.1965-12-15.specials]]. Names: Waldie, Baldwin.'
    tags: [special:1966-06-07-h-CA-14, name:waldie-jerome-r, name:baldwin-john-f-jr]
  - id: cal.1966-06-07.mississippi-meredith
    when: June 7
    date: '1966-06-07'
    thread: mississippi-meredith
    also: [civil-rights-organizations]
    c: King, McKissick and Carmichael take up Meredith's march from the spot where he was shot. Wilkins and Young leave it over its manifesto and its armed guard, the Deacons for Defense (Check).
    n: '[Manifesto of the James Meredith March for Freedom in Mississippi](https://okra.stanford.edu/link/document660608-001), June 7–8, 1966; King, [Address at Meredith March rally](https://okra.stanford.edu/link/document660607-002), June 7 (King Papers Project). See [[cal.1966-06-06.mississippi]]. Names: King, McKissick, Carmichael, Wilkins, Young, Meredith.'
    tags: [name:king-martin-luther-jr, name:mckissick-floyd-b, name:carmichael-stokely, name:wilkins-roy, name:young-whitney-m-jr, name:meredith-james-h]
  - id: cal.1966-06-08.vietnam
    when: June 8
    date: '1966-06-08'
    thread: vietnam-struggle
    c: Huế. Trí Quang begins a hunger strike against American support of Kỳ; Buddhist altars set in the streets block the convoys. The Directorate had taken in ten civilians, June 6.
    n: '[*New York Times*, June 9, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/09/issue.html). See [[cal.1966-03-10.vietnam]]; [[cal.1966-05-15.vietnam]]. Names: Thích Trí Quang, Nguyễn Cao Kỳ.'
    tags: [name:thich-tri-quang, name:nguyen-cao-ky, place:hue]
  - id: cal.1966-06-08.opinion
    when: June 8
    date: '1966-06-08'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 19–24: Johnson''s handling of Vietnam: approve 41 percent, disapprove 37. Democrats 49 approve; Republicans 34; independents 33.'
    n: '[[w.gallup-poll]], III, 2011. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-08.economy-debt-limit
    when: June 8
    date: '1966-06-08'
    thread: economy-debt-limit
    c: House passes H.R. 15202, the temporary debt limit $330 billion for fiscal 1967. Rule, [205–153](https://voteview.com/rollcall/RH0890269); passed, [199–165](https://voteview.com/rollcall/RH0890270).
    n: '[112 Cong. Rec., House, June 8, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt10/pdf/GPO-CRECB-1966-pt10-2-1.pdf). [[w.morgan-deficit-government]]; [[w.zelizer-taxing-america]]. See [[cal.1960-06-08.economy-debt-limit]].'
  - id: cal.1966-06-09.testing
    when: June 9–10
    date: '1966-06-09'
    thread: testing
    also: [south-asia, china]
    c: 'The NSC on India and the bomb, June 9, China''s third test the spur. NSAM 351, June 10: Rusk, with McNamara and Foster, to study how far to use economic leverage against an Indian weapon, what arms control agreements might do, and how far to meet India''s security fears.'
    n: 'FRUS 1964–68, XXV, docs. [346](https://history.state.gov/historicaldocuments/frus1964-68v25/d346), [347](https://history.state.gov/historicaldocuments/frus1964-68v25/d347). Made public: FRUS 1964–68, XXV (2000). See [[cal.1966-05-17.testing]]. Names: Rusk, Foster, McNamara.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:foster-william-c, name:johnson-lyndon-b]
  - id: cal.1966-06-10.vietnam-struggle
    when: June 10
    date: '1966-06-10'
    thread: vietnam-struggle
    c: Kỳ sends riot police under Loan to Huế.
    n: '[*New York Times*, June 11, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/11/issue.html). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ, Nguyễn Ngọc Loan.'
    tags: [name:nguyen-cao-ky, name:nguyen-ngoc-loan, place:hue]
  - id: cal.1966-06-12.opinion
    when: June 12
    date: '1966-06-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, special survey of 1,597 Republican county chairmen, their own choice for 1968 from a list of thirteen: Nixon 717, Romney 342, Goldwater 174, Scranton 79, Reagan 74, Morton 49, Hatfield 48; others 98. The likely nominee: Nixon 775, Romney 445, Scranton 64, Reagan 19. Between Nixon and Romney: Nixon 944, Romney 475, undecided 178.'
    n: '[[w.gallup-poll]], III, 2012. "Morton" as printed. Check. Names: Nixon, Romney, Scranton, Goldwater, Hatfield, Morton, Reagan.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w, name:reagan-ronald, name:hatfield-mark-o, name:morton-thruston-b]
  - id: cal.1966-06-13.court
    when: June 13
    date: '1966-06-13'
    thread: court
    also: [crime-and-hijacking]
    c: '*Miranda v. Arizona*, [384 U.S. 436](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384436/usrep384436.pdf), with three other cases: no statement from questioning in custody to be used unless the suspect was first warned that he may remain silent, that what he says may be used against him, that he may have a lawyer, and that one will be appointed if he cannot pay, and waived those rights knowingly. Warren for the Court, 5–4; Clark, Harlan, Stewart and White dissent.'
    n: Opinion (K–J Cong. II.J.1). [[w.baker-miranda]]; [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]]. See [[cal.1964-06-22.court]].
  - id: cal.1966-06-13.court-2
    when: June 13
    date: '1966-06-13'
    thread: court
    also: [voting-rights]
    c: '*Katzenbach v. Morgan*, [384 U.S. 641](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384641/usrep384641.pdf): § 4(e) of the Voting Rights Act, which lets a citizen schooled to the sixth grade in Puerto Rico vote without reading English, upheld under § 5 of the Fourteenth Amendment; New York''s English literacy test yields to it. Brennan for the Court, 7–2; Harlan and Stewart dissent.'
    n: Opinion (K–J Cong. II.J.1). [[w.lawson-black-ballots]]; [[w.powe-warren-court-and-american]]. See [[cal.1965-08-06.voting-rights]].
  - id: cal.1966-06-13.opinion
    when: June 13
    date: '1966-06-13'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, the same county chairmen: Nixon able to beat Johnson in 1968: yes 59 percent, no 30. East 45 and 44; Midwest 62 and 26; South 69 and 22; West 54 and 33. The harder Democrat to beat, in 1968 or 1972: Robert Kennedy 77, Humphrey 12.'
    n: '[[w.gallup-poll]], III, 2012–13. The votes printed under it (944, 475, 178) are those for Nixon and Romney ([[cal.1966-06-12.opinion]]). Check. Names: Nixon, Johnson, Robert Kennedy, Humphrey.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:kennedy-robert-f, name:humphrey-hubert-h]
  - id: cal.1966-06-14.opinion
    when: June 14
    date: '1966-06-14'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, the same county chairmen: the best reasons Republican candidates for Congress can give this year: Vietnam 44 percent; the threat of inflation 41; Johnson''s domestic programs 37; too much government spending 33; Johnson has too much power 19; states'' rights 9; foreign policy 8.'
    n: '[[w.gallup-poll]], III, 2013. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-14.south-carolina-sc
    when: June 14
    date: '1966-06-14'
    thread: south-carolina
    also: [elections-1966]
    c: 'South Carolina''s Democratic primary. Senate, for Johnston''s unexpired term: Hollings 60.8 percent, U.S. Senator Russell 39.2. Governor McNair unopposed. Rogers, a State representative, the Republicans'' nominee for governor without a primary.'
    n: 'Check: *Supplemental Report of the Secretary of State*, in *Reports and Resolutions* (1967), II, as [Wikipedia](https://en.wikipedia.org/wiki/1966_United_States_Senate_special_election_in_South_Carolina) gives it. [[w.kalk-origins-of-the-southern]]; [[w.hollings-making-government-work]]. See [[cal.1965-04-22.south-carolina-sc]]. Names: Hollings, Russell, McNair, Rogers.'
    tags: [name:hollings-ernest-f, name:russell-donald-s, name:mcnair-robert-e, name:rogers-joseph-o-jr, state:sc]
  - id: cal.1966-06-14.mayors-newark
    when: June 14
    date: '1966-06-14'
    thread: mayors
    also: [elections-1966]
    c: 'Newark runoff. Addonizio re-elected over Carlin, his predecessor. First round May 10: Kenneth Gibson, engineer of the Housing Authority, third. Check the figures.'
    n: '[*New York Times*, May 11, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/11/issue.html); [June 15, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/15/issue.html). [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]. Names: Addonizio, Carlin, Gibson.'
    tags: [state:nj, city:newark, name:addonizio-hugh-j, name:carlin-leo-p, name:gibson-kenneth-a]
  - id: cal.1966-06-15.medicare
    when: June 15
    date: '1966-06-15'
    thread: medicare
    c: Medicare's eve. Johnson to medical and hospital leaders, on the program's opening July 1.
    n: 'Remarks at a Meeting With Medical and Hospital Leaders To Prepare for the Launching of Medicare, [1966 Pub. Papers 605](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=681) (June 15, 1966). See [[cal.1965-07-30.medicare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-15.opinion
    when: June 15
    date: '1966-06-15'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, the same county chairmen, their feelings about the war: go all-out to win 29 percent; go all-out or get out 18; mishandled 13; the strategy to change 12; the military to have a greater say 5; stop the spread of communism 9; pessimism 10; we should get out 8; end it quickly 7; Johnson waging war for political reasons 5; support for the Administration 4.'
    n: '[[w.gallup-poll]], III, 2013. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-15.vietnam-struggle
    when: June 15–19
    date: '1966-06-15'
    thread: vietnam-struggle
    c: Huế. Two airborne and two marine battalions, with Loan's police, clear the altars and hold the city. Nhuận, the 1st Division's commander, relieved; Đính and Trí Quang brought to Saigon (Check the days).
    n: 'Check: the record. See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Ngọc Loan, Phạm Xuân Nhuận, Tôn Thất Đính, Thích Trí Quang.'
    tags: [name:nguyen-ngoc-loan, name:pham-xuan-nhuan, name:ton-that-dinh, name:thich-tri-quang, place:hue]
  - id: cal.1966-06-16.mississippi
    when: June 16
    date: '1966-06-16'
    thread: mississippi-meredith
    also: [civil-rights-organizations]
    c: 'Greenwood. Carmichael, arrested for pitching the marchers'' tents on a Negro school''s grounds and released, at the rally that night: "We been saying freedom for six years and we ain''t got nothin''. What we gonna start saying now is Black Power!" The crowd takes it up.'
    n: '[*New York Times*, June 17, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/17/issue.html). See [[cal.1966-06-06.mississippi]]. Names: Carmichael.'
    tags: [name:carmichael-stokely]
  - id: cal.1966-06-16.economy-debt-limit
    when: June 16
    date: '1966-06-16'
    thread: economy-debt-limit
    c: Senate passes H.R. 15202, [50–17](https://voteview.com/rollcall/RS0890319). Long's motion to table Williams's amendment, a deduction of up to $100 for political contributions, carried, [45–24](https://voteview.com/rollcall/RS0890318).
    n: '[112 Cong. Rec., Senate, June 16, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt10/pdf/GPO-CRECB-1966-pt10-7-2.pdf). See [[cal.1966-06-08.economy-debt-limit]]. Names: Long, Williams.'
    tags: [name:long-russell-b, name:williams-john-j]
  - id: cal.1966-06-18.transition-and-staff
    when: June 18
    date: '1966-06-18'
    thread: transition-and-staff
    c: News conference. Raborn resigns as Director of Central Intelligence after fourteen months; Helms, his deputy, named.
    n: 'The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701) (June 18, 1966). [[w.powers-man-who-kept-the]]; [[w.helms-look-over-my-shoulder]]. See [[cal.1965-04-28.transition-and-staff]]. Names: Raborn, Helms.'
    tags: [name:raborn-william-f-jr, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1966-06-19.opinion
    when: June 19
    date: '1966-06-19'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 19–24: a vote on the war in the next few months: continue it 48 percent, withdraw the troops 35. The end: an all-out victory 17, a compromise 54, a defeat 6. Communist China to enter the war: will 35, will not 37. May 5–10: most South Vietnamese want the United States out, yes 34, no 38; if a majority did, pull out, yes 51, no 33. How long: longer than five years 22, uncertain 32.'
    n: '[[w.gallup-poll]], III, 2013–14.'
  - id: cal.1966-06-19.governors-mn
    when: June 19
    date: '1966-06-19'
    thread: governors
    also: [elections-1966]
    c: Minnesota. The DFL state convention endorses Lieutenant Governor Keith for governor over Governor Rolvaag, on the twentieth ballot. Rolvaag takes it to the primary.
    n: 'Minnesota Election Archives, ["Governor, 1966 Election"](https://mn.electionarchives.lib.umn.edu/election/2319664010120600). [Wikipedia, "1966 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1966_Minnesota_gubernatorial_election). [[w.peirce-great-plains-states-of]]; [[w.mondale-good-fight]]. Names: Keith, Rolvaag.'
    tags: [state:mn, name:keith-alexander-m, name:rolvaag-karl-f]
  - id: cal.1966-06-20.court
    when: June 20
    date: '1966-06-20'
    thread: court
    also: [crime-and-hijacking]
    c: '*Schmerber v. California*, [384 U.S. 757](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384757/usrep384757.pdf): blood drawn from a drunken-driving suspect over his refusal neither compelled testimony nor an unreasonable search; Brennan for the Court, 5–4; Warren, Black, Douglas and Fortas dissent. *Johnson v. New Jersey*, [384 U.S. 719](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384719/usrep384719.pdf): *Escobedo* and *Miranda* govern only trials begun after their dates; Warren for the Court; Black and Douglas dissent.'
    n: See [[cal.1966-06-13.court]].
  - id: cal.1966-06-20.court-2
    when: June 20
    date: '1966-06-20'
    thread: court
    also: [mississippi, georgia]
    c: 'Removal of civil rights prosecutions to federal court, 28 U.S.C. § 1443. *Georgia v. Rachel*, [384 U.S. 780](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384780/usrep384780.pdf): sit-in demonstrators charged with trespass at Atlanta restaurants may remove their cases if the Civil Rights Act of 1964 protected what they did. *City of Greenwood v. Peacock*, [384 U.S. 808](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384808/usrep384808.pdf): civil rights workers charged at Greenwood, Miss., in 1964 may not; a claim that the state court will not try them fairly is not enough. Stewart for the Court in both; in *Peacock*, 5–4, Douglas, Warren, Brennan and Fortas dissenting.'
    n: '[[w.powe-warren-court-and-american]].'
  - id: cal.1966-06-20.governors-me
    when: June 20
    date: '1966-06-20'
    thread: governors
    also: [elections-1966]
    c: 'Maine''s primaries for governor. Republican: Reed, the governor, 55,924, 59.7 percent; Erwin 37,765. Democratic: Curtis, Secretary of State, 30,879, 55.6 percent; Carlton Reed, president of the Maine Senate, 24.9; Childs, Speaker of the Maine House, 19.4.'
    n: '[Maine, "1966 Republican Primary: State & County Officers"](https://digitalmaine.com/tabulations_for_elections_1960s/43); ["1966 Democratic Primary: State & County Officers"](https://digitalmaine.com/tabulations_for_elections_1960s/44). [Wikipedia, "1966 Maine gubernatorial election"](https://en.wikipedia.org/wiki/1966_Maine_gubernatorial_election). Check the date: the tabulations are dated June 22. [[w.palmer-maine-politics-and-government]]. Names: Erwin, Curtis, Carlton Reed, Childs, Reed.'
    tags: [state:me, name:reed-john-h, name:erwin-james-s, name:curtis-kenneth-m, name:reed-carlton-day-jr, name:childs-dana]
  - id: cal.1966-06-21.mississippi
    when: June 21
    date: '1966-06-21'
    thread: mississippi-meredith
    c: Philadelphia. King leads a memorial march for Chaney, Goodman and Schwerner; whites attack the marchers, Deputy Price among the officers present (Check).
    n: '[*New York Times*, June 22, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/22/issue.html). See [[cal.1966-06-06.mississippi]]; [[cal.1964-08-04.mississippi]]. Names: King, Chaney, Goodman, Schwerner, Price.'
    tags: [name:king-martin-luther-jr, name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r]
  - id: cal.1966-06-21.middle-east
    when: June 21–23
    date: '1966-06-21'
    thread: middle-east
    also: [states-and-cities]
    c: 'King Faisal at the White House, June 21–22; over an hour alone with Johnson. Development, Saudi integrity, Southeast Asia, Yemen; no new security assurances. June 22, at a press luncheon: "Jews of the world aid Israel … In our situation we consider those who aid our enemy as our enemy." June 23, Lindsay cancels New York''s dinner for him; Rockefeller his call.'
    n: 'Remarks of Welcome to King Faisal of Saudi Arabia on the South Lawn at the White House, [1966 Pub. Papers 640](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=716) (June 21, 1966); Joint Statement Following Discussions With King Faisal of Saudi Arabia, [1966 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=721) (June 22, 1966). FRUS 1964–68, XXI, docs. [276](https://history.state.gov/historicaldocuments/frus1964-68v21/d276), [279](https://history.state.gov/historicaldocuments/frus1964-68v21/d279) (the luncheon; the dinner). [[w.bronson-thicker-than-oil]]. See [[cal.1964-11-02.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Lindsay, Rockefeller.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:johnson-lyndon-b, name:lindsay-john-v, name:rockefeller-nelson, state:ny, city:nyc]
  - id: cal.1966-06-22.crime-and-hijacking
    when: June 22
    date: '1966-06-22'
    thread: crime-and-hijacking
    c: 'Bail Reform Act signed, Ervin''s bill, [80 Stat. 214](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg214.pdf): in the federal courts a defendant not charged with a capital crime released on his own recognizance or an unsecured bond unless the judge finds more needed to assure his appearance; time in custody credited to the sentence. The House passed it June 7, [319–14](https://voteview.com/rollcall/RH0890268). Johnson: the poorer defendant "stays in jail because he is poor."'
    n: 'Remarks at the Signing of the Bail Reform Act of 1966, [1966 Pub. Papers 644](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=720) (June 22, 1966). [[w.thomas-bail-reform-in-america]]. Names: Ervin, Johnson.'
    tags: [name:johnson-lyndon-b, name:ervin-sam-j-jr]
  - id: cal.1966-06-22.vietnam-struggle
    when: June 22
    date: '1966-06-22'
    thread: vietnam-struggle
    c: 'Lodge: perhaps the end of the crisis "which began with the relief of General Thi on March 10."'
    n: 'FRUS 1964–68, IV, docs. [160](https://history.state.gov/historicaldocuments/frus1964-68v04/d160), [162](https://history.state.gov/historicaldocuments/frus1964-68v04/d162). See [[cal.1966-03-10.vietnam]]. Names: Lodge, Nguyễn Chánh Thi.'
    tags: [name:lodge-henry-cabot, name:nguyen-chanh-thi]
  - id: cal.1966-06-23.mississippi-meredith
    when: June 23
    date: '1966-06-23'
    thread: mississippi-meredith
    c: Canton. Highway patrolmen fire tear gas into the marchers raising their tents on a Negro school's grounds.
    n: '[*New York Times*, June 24, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/24/issue.html). See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-06-24.transportation
    when: June 24
    date: '1966-06-24'
    thread: transportation-auto-safety
    c: 'Senate passes the Traffic Safety Act, S. 3005, Magnuson''s, [76–0](https://voteview.com/rollcall/RS0890335): federal safety standards for new cars, mandatory. Criminal penalties for willful violations refused, [14–62](https://voteview.com/rollcall/RS0890334). The Highway Safety Act, S. 3052, through the same day. Johnson: "We can no longer tolerate such anarchy on wheels."'
    n: 'Statement by the President Following Senate Approval of the Traffic Safety Bill, [1966 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=726) (June 24, 1966). See [[cal.1966-03-22.transportation]]. Names: Magnuson, Johnson.'
    tags: [name:johnson-lyndon-b, name:magnuson-warren-g]
  - id: cal.1966-06-24.opinion
    when: June 24
    date: '1966-06-24'
    thread: opinion
    also: [vietnam, students]
    c: 'Gallup, special survey of college students: Johnson''s handling of Vietnam: approve 47 percent, disapprove 47. Released June 22, their approval of his handling of the job: 55, 38.'
    n: '[[w.gallup-poll]], III, 2014. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-24.economy-debt-limit
    when: June 24
    date: '1966-06-24'
    thread: economy-debt-limit
    c: The debt limit to $330 billion for fiscal 1967 signed, [80 Stat. 221](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg221.pdf).
    n: Statute (K–J Cong. II.J.2). See [[cal.1966-06-08.economy-debt-limit]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-26.mississippi-meredith
    when: June 26
    date: '1966-06-26'
    thread: mississippi-meredith
    c: Jackson. The march ends, some 15,000 at the Capitol, Meredith with them. Some 4,000 Negroes registered along the route (Check).
    n: '[*New York Times*, June 27, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/27/issue.html). See [[cal.1966-06-06.mississippi]]. Names: Meredith.'
    tags: [name:meredith-james-h]
  - id: cal.1966-06-27.economy
    when: June 27
    date: '1966-06-27'
    thread: economy
    c: 'The Federal Reserve Board raises member banks'' reserve requirement on time deposits other than savings, on each bank''s holdings over $5 million, from 4 to 5 percent, from July 14 and 21: over $400 million more in required reserves, some 950 banks affected, those issuing certificates of deposit most. Banks'' short-term promissory notes brought under the reserve and interest rules from Sept. 1. The discount rate stays at 4½ percent.'
    n: '*Federal Reserve Bulletin*, July 1966, [979–80](https://fraser.stlouisfed.org/files/docs/publications/FRB/1960s/frb_071966.pdf#page=47). [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]. See [[cal.1965-12-05.economy]].'
  - id: cal.1966-06-28.latin-america
    when: June 28–29
    date: '1966-06-28'
    thread: latin-america
    c: 'Argentina. The army under Pistarini deposes Illia before dawn, June 28; the commanders in chief name Onganía, the army''s retired commander, president, sworn June 29. The embassy cuts off official contact. Rostow to Johnson: "This unjustified military coup is a serious setback."'
    n: 'FRUS 1964–68, XXXI, docs. [131](https://history.state.gov/historicaldocuments/frus1964-68v31/d131), [132](https://history.state.gov/historicaldocuments/frus1964-68v31/d132), [133](https://history.state.gov/historicaldocuments/frus1964-68v31/d133), [134](https://history.state.gov/historicaldocuments/frus1964-68v31/d134). [[w.potash-army-and-politics-in]]; [[w.rabe-killing-zone]]. Names: Rostow, Pistarini, Illia, Onganía, Johnson.'
    tags: [name:pistarini-pascual-angel, name:illia-arturo-umberto, name:ongania-juan-carlos, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-06-28.states-and-cities-nyc
    when: June 28
    date: '1966-06-28'
    thread: states-and-cities
    also: [robert-kennedy]
    c: Manhattan's Democratic primary for Surrogate. Silverman, a Supreme Court justice, backed by Robert Kennedy, the reform clubs and the Liberals, beats Klein, the county organization's choice, also endorsed by the Republicans (Check). Check the date and the vote.
    n: '["The Making of the Surrogate," *Time*, July 8, 1966](https://web.archive.org/web/20121102175036/http://www.time.com/time/magazine/article/0,9171,835926,00.html); [Wikipedia, "Samuel Silverman"](https://en.wikipedia.org/wiki/Samuel_Silverman). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]. Names: Silverman, Klein, Robert Kennedy.'
    tags: [state:ny, city:nyc, name:silverman-samuel-j, name:klein-arthur-g, name:kennedy-robert-f]
  - id: cal.1966-06-28.medicare
    when: June 28
    date: '1966-06-28'
    thread: medicare
    c: Johnson reviews with Gardner and Cohen, State by State, hospitals' compliance with the Civil Rights Act.
    n: 'Remarks to the Press Following a Meeting To Review Plans for the Inauguration of Medicare, [1966 Pub. Papers 657](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=733) (June 28, 1966). See [[cal.1966-06-15.medicare]]. Names: Johnson, Gardner, Cohen.'
    tags: [name:johnson-lyndon-b, name:gardner-john-w, name:cohen-wilbur-j]
  - id: cal.1966-06-28.transition-and-staff
    when: June 28–30
    date: '1966-06-28'
    thread: transition-and-staff
    c: Helms confirmed as Director of Central Intelligence, June 28; sworn June 30.
    n: 'Remarks at the Swearing In of Richard Helms as Director of the Central Intelligence Agency, [1966 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=753) (June 30, 1966). Check: the Record''s page. See [[cal.1966-06-18.transition-and-staff]]. Names: Helms.'
    tags: [name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1966-06-29.vietnam
    when: June 29–30
    date: '1966-06-29'
    thread: vietnam
    c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29. Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result; put off for weather and leaks; Johnson''s assent to McNamara by telephone, June 28. Wilson, told in advance, dissociates Britain (Check). Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."'
    n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV; [[w.pentagon-papers]], IV; [[w.herring-lbj-and-vietnam]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]; [[w.drea-mcnamara-clifford-and-the-2011]]. Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). Names: McNamara, William Bundy, Wilson, Holt, Ronning, Johnson.'
    tags: [name:mcnamara-robert-s, name:bundy-william, name:ronning-chester, name:wilson-harold, name:holt-harold-e, name:johnson-lyndon-b, place:haiphong, place:hanoi]
  - id: cal.1966-06-29.vietnam-2
    when: June 29–30
    date: '1966-06-29'
    thread: vietnam-marigold
    c: 'Saigon. D''Orlandi, the Italian ambassador, to Lodge, June 29: Lewandowski, the Polish member of the ICC, has brought a "very specific peace offer" from Hanoi; the NLF to "take part" in negotiations, not as sole representative; a "suspension" of the bombing; American withdrawal on a "reasonable calendar." Lodge, June 30: new in substance, "so forthcoming as to arouse suspicion." Johnson to Martin of the Federal Reserve, June 30: "the most persuasive peace feeler I''ve had since I''ve been President."'
    n: 'FRUS 1964–68, IV, docs. [167](https://history.state.gov/historicaldocuments/frus1964-68v04/d167), [169](https://history.state.gov/historicaldocuments/frus1964-68v04/d169), [170](https://history.state.gov/historicaldocuments/frus1964-68v04/d170). [[w.hershberg-marigold]]; [[w.herring-secret-diplomacy-of-the]]; [[w.gibbons-u-s-government-and]], IV; [[w.herring-lbj-and-vietnam]]. Made public: in outline, [[w.kraslow-secret-search-for-peace]] (1968); the telegrams, [[w.herring-secret-diplomacy-of-the]] (1983). Names: Lodge, Lewandowski, D''Orlandi, Martin, Johnson.'
    tags: [name:lodge-henry-cabot, name:lewandowski-janusz, name:martin-william-mcchesney-jr, name:johnson-lyndon-b, name:dorlandi-giovanni, place:saigon]
  - id: cal.1966-06-29.middle-east
    when: June 29
    date: '1966-06-29'
    thread: middle-east-iran-arms
    c: 'Iran''s arms. The Shah to Meyer, Pakistan''s case in mind: aircraft from the United States; anti-aircraft arms elsewhere if American prices and terms are not reasonable; more F-4s, and sooner.'
    n: '[FRUS 1964–68, XXII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v22/d148). See [[cal.1964-07-04.middle-east]]. Names: Pahlavi, Meyer.'
    tags: [name:pahlavi-mohammed-reza, name:meyer-armin-h]
  - id: cal.1966-06-30.medicare
    when: June 30
    date: '1966-06-30'
    thread: medicare
    c: 'Johnson''s statement: "Medicare begins tomorrow"; over 92 percent of the beds in general hospitals already in compliance; hospitals not to discriminate, doctors not to "drive hard bargains."'
    n: 'Statement by the President on the Inauguration of the Medicare Program, [1966 Pub. Papers 676](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=752) (June 30, 1966). See [[cal.1966-06-15.medicare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-30.state-and-city-finance-us
    when: June 30
    date: '1966-06-30'
    thread: state-and-city-finance
    c: Fiscal 1966 closes in forty-seven States. The fifty State governments' taxes for the year $29.4 billion, $150.89 a head; federal aid $11.7 billion; long-term debt $28.5 billion (Census). By Census's columns, first revenue from general sales taxes in Idaho, Massachusetts and New York.
    n: Census, [*State Government Finances in 1966*](https://www2.census.gov/programs-surveys/gov-finances/datasets/historical/1900-1992%20State%20Government%20Finance.zip) (GF No. 11, 1967), tables 3, 4, 6, 7, 8, 12, 20; [[w.bureau-data-base-on-historical]]; [[w.bureau-data-base-on-historical-2010]]. See [[cal.1960-06-30.state-and-city-finance-us]].
    tags: [statefin:1966, state:id, state:ma, state:ny]
