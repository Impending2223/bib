# Cal. LXXX June 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXX
entries:
  - id: cal.1966-06-01.civil-rights-the-executive
    when: June 1–2
    date: '1966-06-01'
    thread: civil-rights-the-executive
    also: [civil-rights-organizations]
    c: 'White House Conference "To Fulfill These Rights," Heineman chairman, Randolph honorary chairman. Johnson to the delegates, June 1: the issue "is beyond the mastery of one man or one group of men." SNCC stays away.'
    n: 'Remarks to the Delegates to the White House Conference "To Fulfill These Rights", [1966 Pub. Papers 571](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=647) (June 1, 1966). To check: [[w.rainwater-moynihan-report-and-the]]; [[w.graham-civil-rights-era]]. See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph, Heineman, Johnson.'
    tags: [name:johnson-lyndon-b, name:randolph-a-philip, name:heineman-ben-w]
  - id: cal.1966-06-01.latin-america
    when: June 1–2
    date: '1966-06-01'
    thread: latin-america
    c: 'Dominican Republic. Balaguer elected president over Bosch, 57.1 percent; Bosch 39.2 percent, Bonnelly 3.4 percent, by Rostow''s figures; some 1.4 million voting. June 2, Johnson to García-Godoy: "the tranquility of free elections. There can be no greater tribute."'
    n: 'Message to Provisional President Garcia-Godoy Following the Election in the Dominican Republic, [1966 Pub. Papers 577](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=653) (June 2, 1966). [FRUS 1964–68, XXXII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v32/d178). Check: the counts. To check: [[w.slater-intervention-and-negotiation]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-09-03.latin-america]]. Names: Bosch, Balaguer, García-Godoy, Bonnelly, Rostow, Johnson.'
    tags: [name:balaguer-joaquin-videla, name:bosch-juan, name:rostow-walt-w, name:garcia-godoy-hector, name:johnson-lyndon-b, name:bonnelly-rafael-f]
  - id: cal.1966-06-01.opinion
    when: June 1
    date: '1966-06-01'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, May 5–10: white parents who would object to a school where a few of the children are colored: outside the South 6 percent, South 24; where half are, 32 and 49; where more than half are, 60 and 62.'
    n: '[[w.gallup-poll]], III, 2010.'
  - id: cal.1966-06-01.vietnam-struggle
    when: June 1
    date: '1966-06-01'
    thread: vietnam-struggle
    c: Huế. Students sack and burn the American consulate (Check the date).
    n: '[FRUS 1964–68, IV, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150) (Westmoreland to Wheeler, June 2). [[w.gibbons-u-s-government-and]], IV, 330 (June 1). See [[cal.1966-03-10.vietnam]].'
    tags: [place:hue]
  - id: cal.1966-06-01.vietnam
    when: June 1
    date: '1966-06-01'
    thread: vietnam
    c: Fulbright with Johnson at the White House, 6:20 to 8:13 p.m., brought by Clinton Anderson, who leaves them; Rostow joins; Johnson doing most of the talking on the war's choices. Fulbright still without confidence in the policy; he will "keep in touch."
    n: '[[w.dallek-flawed-giant]], 370–71 (the meeting, "nearly two hours"; the talk; Fulbright''s answer: 371); [[w.gibbons-u-s-government-and]], IV, 343–44 (Rostow''s notes). To check: Rostow''s notes, President''s Daily Diary, June 1, 1966 (LBJ Library); Diary Backup, June 1, 1966, LBJ Library (cited by [[w.dallek-flawed-giant]], 371). See [[cal.1966-02-04.vietnam]]. Names: Fulbright, Johnson, Clinton Anderson, Rostow.'
    src:
      c: 1da46ce2
      rows:
        - 'w.dallek-flawed-giant 371: A, C-E'
        - 'w.gibbons-u-s-government-and IV, 343–44: ?'
        - 'via w.dallek-flawed-giant 371 n.99a: A-E'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b, name:anderson-clinton-p, name:rostow-walt-w]
  - id: cal.1966-06-02.space
    when: June 2
    date: '1966-06-02'
    thread: space
    c: 'Surveyor 1, launched May 30 from Cape Kennedy, Fla., lands softly on the moon, in the Ocean of Storms, the first American spacecraft to do so; the Soviet Luna 9 had landed Feb. 3. Its pictures on television the same morning. Johnson: prints to be offered to the world''s scientists; June 8, sent to foreign nations.'
    n: 'Statement by the President Following the Landing of Surveyor I on the Moon, [1966 Pub. Papers 575](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=651) (June 2, 1966); Statement by the President Upon Sending to Foreign Nations Prints of Lunar Photographs Made by Surveyor I, [1966 Pub. Papers 590](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=666) (June 8, 1966). To check: [[w.nicks-far-travelers]]; [[w.mcdougall-heavens-and-the-earth]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-03.space
    when: June 3–6
    date: '1966-06-03'
    thread: space
    c: 'Gemini 9: Stafford and Cernan, up June 3. Their Agena target lost May 17, when its Atlas failed; the substitute, launched June 1, met in orbit with its shroud half open, "an angry alligator" (Stafford), and no docking. June 5, Cernan outside the spacecraft over two hours, his visor fogged, the backpack test given up. Down June 6.'
    n: '[NASA, *Astronautics and Aeronautics, 1966*, NASA SP-4007 (1967), 206–207](https://ntrs.nasa.gov/api/citations/19670029479/downloads/19670029479.pdf#page=215). To check: [[w.hacker-on-the-shoulders-of]]. See [[cal.1965-12-15.space]]; [[cal.1966-02-28.space]]. Names: Stafford, Cernan.'
    tags: [name:stafford-thomas-p, name:cernan-eugene-a]
  - id: cal.1966-06-03.opinion
    when: June 3
    date: '1966-06-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 5–10: the United States made a mistake sending troops to fight in Vietnam: yes 36 percent, no 49. Republicans 42 yes; independents 37; Democrats 32. Under 30, 29; 50 and over, 42. Canadians, a special survey, the United States'' handling of Vietnam: approve 35, disapprove 34.'
    n: '[[w.gallup-poll]], III, 2010.'
  - id: cal.1966-06-04.africa
    when: June 4–9
    date: '1966-06-04'
    thread: africa
    also: [robert-kennedy]
    c: 'Robert Kennedy in South Africa, invited by the National Union of South African Students, whose president, Ian Robertson, is under a banning order. Cape Town, June 6, the Day of Affirmation: "Each time a man stands up for an ideal ... he sends forth a tiny ripple of hope." Then Stellenbosch, Durban, Johannesburg and Soweto; Luthuli, banned, visited on his farm, by helicopter (Groutville: Check).'
    n: 'Kennedy, Day of Affirmation address, from the advance text: [112 Cong. Rec., Senate, June 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-10-2.pdf), 12429–31. [FRUS 1964–68, XXIV, doc. 212](https://history.state.gov/historicaldocuments/frus1964-68v24/d212). [[w.schlesinger-robert-kennedy-and-his]], 743–48 (not Groutville). To check: [[w.thomas-robert-kennedy]]. See [[cal.1964-06-12.africa]]. Names: Robert Kennedy, Luthuli, Ian Robertson.'
    src:
      c: fc248110
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-10-2.pdf: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v24/d212: all'
        - 'w.schlesinger-robert-kennedy-and-his 743–48: all'
        - 'via w.schlesinger-robert-kennedy-and-his 746 n.14: B'
        - 'via w.schlesinger-robert-kennedy-and-his 747 n.24: D'
    tags: [name:kennedy-robert-f, name:luthuli-albert-john, name:robertson-ian]
  - id: cal.1966-06-06.mississippi
    when: June 6
    date: '1966-06-06'
    thread: mississippi-meredith
    also: [civil-rights-organizations]
    c: Meredith, walking alone from Memphis to Jackson since June 5 "against fear," shot from the roadside south of Hernando, Miss., by Aubrey James Norvell, of Memphis (Check); wounded by birdshot, taken to a Memphis hospital.
    n: '[*New York Times*, June 7, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/07/issue.html). [[w.dittmer-local-people]], 389–402; [[w.garrow-bearing-the-cross]], 473 (the shooting, from ambush, the second day). To check: [[w.goudsouzian-down-to-the-crossroads]]; [[w.meredith-mission-from-god]]; [[w.branch-at-canaans-edge]]; [[w.carson-in-struggle]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1962-10-01.mississippi]]. Check: Dittmer, 392, gives three loads of buckshot, sixty to seventy pellets. Names: Meredith, Norvell.'
    src:
      c: eecbdb12
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1966/06/07/issue.html: all'
        - 'w.garrow-bearing-the-cross 473: ?'
        - 'w.dittmer-local-people 389–402: all'
    tags: [name:meredith-james-h, name:norvell-aubrey-james]
  - id: cal.1966-06-06.court
    when: June 6
    date: '1966-06-06'
    thread: court
    also: [press-and-broadcasting]
    c: '*Sheppard v. Maxwell*, [384 U.S. 333](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384333/usrep384333.pdf): a murder conviction of 1954 at Cleveland set aside; the trial judge let the publicity and the press in the courtroom deny the defendant a fair trial. Ohio to try him again or release him. Clark for the Court, 8–1; Black dissents.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1966-06-06.india-and-china
    when: June 6
    date: '1966-06-06'
    thread: south-asia
    c: 'India devalues the rupee, from 4.76 to 7.50 to the dollar, the first step of the program Asoka Mehta worked out with the World Bank''s Woods. Rostow to Johnson, June 11: opposition in her own party, from the Left and from business; Indira Gandhi "needs the prompt response of aid donors."'
    n: 'FRUS 1964–68, XXV, docs. [345](https://history.state.gov/historicaldocuments/frus1964-68v25/d345), [349](https://history.state.gov/historicaldocuments/frus1964-68v25/d349). To check: [[w.kux-india-and-the-united]]. See [[cal.1966-03-28.india-and-china]]. Names: Rostow, Mehta, Woods, Indira Gandhi, Johnson.'
    tags: [name:gandhi-indira, name:mehta-asoka, name:woods-george-d, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-06-06.europe-and-the-alliance
    when: June 6–8
    date: '1966-06-06'
    thread: europe-and-the-alliance-france
    c: 'Brussels, the NATO ministers. The Fourteen, June 6: the military headquarters out of France, SHAPE to the Benelux countries, the Defense College to Italy, the Standing Group abolished. June 8, Couve de Murville yields on procedure: the French forces in Germany to be negotiated. Rusk: "the family of 14" remains together.'
    n: 'FRUS 1964–68, XIII, docs. [174](https://history.state.gov/historicaldocuments/frus1964-68v13/d174), [175](https://history.state.gov/historicaldocuments/frus1964-68v13/d175), [177](https://history.state.gov/historicaldocuments/frus1964-68v13/d177). [[w.schwartz-lyndon-johnson-and-europe]], 106, 109 (the French forces in Germany). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Rusk, Couve de Murville.'
    tags: [name:rusk-dean, name:couve-de-murville-maurice]
  - id: cal.1966-06-06.vietnam-congress
    when: June 6
    date: '1966-06-06'
    thread: vietnam-congress
    c: 'Fulbright sends Johnson *Neutralization in Southeast Asia: Problems and Prospects*, a study made at his request by members of the Princeton faculty: neutralization "merits serious consideration" as an alternative to a long American military presence in South Vietnam.'
    n: '[[w.gibbons-u-s-government-and]], IV, 346. To check: Fulbright to Johnson, June 6, 1966 (LBJ Library, Files of Walt Rostow). Names: Fulbright, Johnson.'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1966-06-06.democratic-party
    when: June 6
    date: '1966-06-06'
    thread: democratic-party
    also: [robert-kennedy]
    c: Watson to Johnson on talks with Prendergast, New York's former State chairman, on "ways in which your Administration can properly recognize the Democratic Party machinery there and therefore take away the separate organization which Senator Kennedy is planning."
    n: '[[w.schlesinger-robert-kennedy-and-his]], 751. To check: Marvin Watson to Johnson, June 6, 1966, Johnson Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 751 n.51). Names: Watson, Johnson, Robert Kennedy.'
    src:
      c: 640c60b3
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 751: all'
        - 'via w.schlesinger-robert-kennedy-and-his 751 n.51: all'
    tags: [name:watson-w-marvin, name:johnson-lyndon-b, name:kennedy-robert-f, state:ny]
  - id: cal.1966-06-07.elections-1966
    when: June 7
    date: '1966-06-07'
    thread: elections-1966
    c: 'California''s primary. Republican: Reagan over Christopher, once mayor of San Francisco, 1,417,623 to 675,683, 64.8 percent. Democratic: Brown, seeking a third term, over Yorty, mayor of Los Angeles, 1,355,262 to 981,088, 52.7 percent.'
    n: 'Votes: [Cal. *Statement of Vote*, June 7, 1966, p. 6](https://archive.org/details/californiastate196668cali/page/n13). To check: [[w.dallek-right-moment]]; [[w.cannon-governor-reagan]]; [[w.rarick-california-rising]]. See [[cal.1966-01-04.states-and-cities]]. Names: Reagan, Brown, Yorty, Christopher.'
    tags: [name:reagan-ronald, name:brown-edmund-g, name:yorty-sam, name:christopher-george, state:ca]
  - id: cal.1966-06-07.specials
    when: June 7
    date: '1966-06-07'
    thread: specials
    c: 'California 14th, special, held with the primary. Waldie (D), majority leader of the State Assembly, takes the seat of Baldwin (R), who died Mar. 9, with a majority, so no run-off: Waldie over Newman (R), 71,501 to 43,539, 51.2 percent; Richardson (R) 14,693, 10.5 percent. Swing 27.1 to D.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 5](https://archive.org/details/californiastate196668cali/page/n50). See [[cal.1965-12-15.specials]]. Names: Waldie, Baldwin.'
    tags: [special:1966-06-07-h-CA-14, name:waldie-jerome-r, name:baldwin-john-f-jr]
  - id: cal.1966-06-07.mississippi-meredith
    when: June 7
    date: '1966-06-07'
    thread: mississippi-meredith
    also: [civil-rights-organizations]
    c: King, McKissick and Carmichael take up Meredith's march from the spot where he was shot. Wilkins and Young leave it over its manifesto and its armed guard, the Deacons for Defense (Check).
    n: '[Manifesto of the James Meredith March for Freedom in Mississippi](https://okra.stanford.edu/link/document660608-001), June 7–8, 1966; King, [Address at Meredith March rally](https://okra.stanford.edu/link/document660607-002), June 7 (King Papers Project). [[w.garrow-bearing-the-cross]], 475–78. See [[cal.1966-06-06.mississippi]]. Names: King, McKissick, Carmichael, Wilkins, Young, Meredith.'
    tags: [name:king-martin-luther-jr, name:mckissick-floyd-b, name:carmichael-stokely, name:wilkins-roy, name:young-whitney-m-jr, name:meredith-james-h]
  - id: cal.1966-06-07.mississippi
    when: June 7
    date: '1966-06-07'
    thread: mississippi
    also: [elections-1966]
    c: 'Mississippi''s Democratic primary, the day after Meredith is shot. The Freedom Democrats run for all five House seats and against Eastland: Ed King 22 percent against John Bell Williams in the 3d; Guyot under 5 in the 5th; Clifton Whitley ahead of Eastland only in Claiborne and Jefferson Counties, which Charles Evers had organized.'
    n: '[[w.dittmer-local-people]], 394. Check: the returns; Dittmer: some 140,000 Negroes registered, about a fourth of them voting. See [[cal.1966-06-06.mississippi]]. Names: Ed King, John Bell Williams, Eastland, Charles Evers, Meredith, Guyot, Whitley.'
    src:
      c: 0af94b73
      rows:
        - 'w.dittmer-local-people 394: all'
    tags: [state:ms, name:king-edwin, name:williams-john-b, name:eastland-james-o, name:evers-charles, name:meredith-james-h, name:guyot-lawrence, name:whitley-clifton]
  - id: cal.1966-06-08.vietnam
    when: June 8
    date: '1966-06-08'
    thread: vietnam-struggle
    c: Huế. Trí Quang begins a hunger strike against American support of Kỳ; Buddhist altars set in the streets block the convoys. The Directorate had taken in ten civilians, June 6.
    n: '[*New York Times*, June 9, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/09/issue.html). [[w.gibbons-u-s-government-and]], IV, 332. See [[cal.1966-03-10.vietnam]]; [[cal.1966-05-15.vietnam]]. Names: Thích Trí Quang, Nguyễn Cao Kỳ.'
    tags: [name:thich-tri-quang, name:nguyen-cao-ky, place:hue]
  - id: cal.1966-06-08.opinion
    when: June 8
    date: '1966-06-08'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 19–24: Johnson''s handling of Vietnam: approve 41 percent, disapprove 37. Democrats 49 approve; Republicans 34; independents 33.'
    n: '[[w.gallup-poll]], III, 2011. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-06-08.economy-debt-limit
    when: June 8
    date: '1966-06-08'
    thread: economy-debt-limit
    c: House passes H.R. 15202, the temporary debt limit $330 billion for fiscal 1967. Rule, [205–153](https://voteview.com/rollcall/RH0890269); passed, [199–165](https://voteview.com/rollcall/RH0890270).
    n: '[112 Cong. Rec., House, June 8, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt10/pdf/GPO-CRECB-1966-pt10-2-1.pdf). To check: [[w.morgan-deficit-government]]. See [[cal.1960-06-08.economy-debt-limit]].'
  - id: cal.1966-06-09.testing
    when: June 9–10
    date: '1966-06-09'
    thread: testing
    also: [south-asia, china]
    c: 'The NSC on India and the bomb, June 9, China''s third test the spur. NSAM 351, June 10: Rusk, with McNamara and Foster, to study how far to use economic leverage against an Indian weapon, what arms control agreements might do, and how far to meet India''s security fears.'
    n: 'FRUS 1964–68, XXV, docs. [346](https://history.state.gov/historicaldocuments/frus1964-68v25/d346), [347](https://history.state.gov/historicaldocuments/frus1964-68v25/d347). Made public: FRUS 1964–68, XXV (2000). See [[cal.1966-05-17.testing]]. Names: Rusk, Foster, McNamara.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:foster-william-c, name:johnson-lyndon-b]
  - id: cal.1966-06-09.opinion
    when: June 9
    date: '1966-06-09'
    thread: opinion
    also: [vietnam]
    c: 'Moyers to Johnson on his talks with Harris, Gallup and other pollsters: "our standing is down and likely to drop further"; Vietnam the issue; "the people are in a foul mood over Vietnam," Harris says; the sentiment not to withdraw but "Why can''t we get it over with?" The President "on dead center"; their advice, "some ray of hope."'
    n: '[[w.gibbons-u-s-government-and]], IV, 339. To check: Moyers to Johnson, June 9, 1966 (LBJ Library, WHCF, CF PR 16). Names: Moyers, Johnson, Harris, Gallup.'
    tags: [name:moyers-bill, name:johnson-lyndon-b, name:harris-louis, name:gallup-george-h]
  - id: cal.1966-06-10.vietnam-struggle
    when: June 10
    date: '1966-06-10'
    thread: vietnam-struggle
    c: Kỳ sends riot police under Loan to Huế.
    n: '[*New York Times*, June 11, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/11/issue.html). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ, Nguyễn Ngọc Loan.'
    tags: [name:nguyen-cao-ky, name:nguyen-ngoc-loan, place:hue]
  - id: cal.1966-06-12.opinion
    when: June 12
    date: '1966-06-12'
    thread: opinion
    also: [elections-1968-polls, republican-party]
    c: 'Gallup, special survey of 1,597 Republican county chairmen, their own choice for 1968 from a list of thirteen: Nixon 717, Romney 342, Goldwater 174, Scranton 79, Reagan 74, Morton 49, Hatfield 48; others 98. The likely nominee: Nixon 775, Romney 445, Scranton 64, Reagan 19. Between Nixon and Romney: Nixon 944, Romney 475, undecided 178.'
    n: '[[w.gallup-poll]], III, 2012. "Morton" as printed. Check. Names: Nixon, Romney, Scranton, Goldwater, Hatfield, Morton, Reagan.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w, name:reagan-ronald, name:hatfield-mark-o, name:morton-thruston-b]
  - id: cal.1966-06-13.court
    when: June 13
    date: '1966-06-13'
    thread: court
    also: [crime-and-hijacking]
    c: '*Miranda v. Arizona*, [384 U.S. 436](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384436/usrep384436.pdf), with three other cases: no statement from questioning in custody to be used unless the suspect was first warned that he may remain silent, that what he says may be used against him, that he may have a lawyer, and that one will be appointed if he cannot pay, and waived those rights knowingly. Warren for the Court, 5–4; Clark, Harlan, Stewart and White dissent.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.baker-miranda]]; [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]]. See [[cal.1964-06-22.court]].'
  - id: cal.1966-06-13.court-2
    when: June 13
    date: '1966-06-13'
    thread: court
    also: [voting-rights]
    c: '*Katzenbach v. Morgan*, [384 U.S. 641](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384641/usrep384641.pdf): § 4(e) of the Voting Rights Act, which lets a citizen schooled to the sixth grade in Puerto Rico vote without reading English, upheld under § 5 of the Fourteenth Amendment; New York''s English literacy test yields to it. Brennan for the Court, 7–2; Harlan and Stewart dissent.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.lawson-black-ballots]]; [[w.powe-warren-court-and-american]]. See [[cal.1965-08-06.voting-rights]].'
  - id: cal.1966-06-13.opinion
    when: June 13
    date: '1966-06-13'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, the same county chairmen: Nixon able to beat Johnson in 1968: yes 59 percent, no 30. East 45 and 44; Midwest 62 and 26; South 69 and 22; West 54 and 33. The harder Democrat to beat, in 1968 or 1972: Robert Kennedy 77, Humphrey 12.'
    n: '[[w.gallup-poll]], III, 2012–13. The votes printed under it (944, 475, 178) are those for Nixon and Romney ([[cal.1966-06-12.opinion]]). Check. Names: Nixon, Johnson, Robert Kennedy, Humphrey.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:kennedy-robert-f, name:humphrey-hubert-h]
  - id: cal.1966-06-13.vietnam-congress
    when: June 13
    date: '1966-06-13'
    thread: vietnam-congress
    c: 'Mansfield to Johnson, on the five alternatives Rostow''s staff drew up and Johnson gave him (withdrawal; enclaves; the present course; major escalation; the maximum short of nuclear war): withdrawal rather than enclaves; the present course leading fast to major escalation; the best course to limit the military involvement and seek negotiations.'
    n: '[[w.gibbons-u-s-government-and]], IV, 326–27. To check: Mansfield to Johnson, June 13, 1966 (LBJ Library, NSF Files of Mike Mansfield); Jorden and Ginsburgh''s paper, May 27, and Rostow''s cover memorandum, June 2 (LBJ Library, NSF Memos to the President—Walt Rostow). Names: Mansfield, Johnson, Rostow.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:rostow-walt-w]
