  - id: cal.1966-06-14.vietnam-air-war
    when: June 14
    date: '1966-06-14'
    place: washington
    thread: vietnam-air-war
    also: [europe-and-the-alliance]
    c: 'Johnson to Wilson, after Rusk''s private talk with him: "I see no way of avoiding such action," the corridor through Laos, the buildup, Cambodia, no interest in peace in Hanoi;{1} "not ... an air assault on civilian centers."{2} The target the oil installations of Hanoi and Haiphong; orders not yet issued.{6} Not to "speak in terms of disassociation."{4} Else seven points to include, among them: Wilson told beforehand; oil storage the target, not civilian centers; Britain, with no troops in the fighting, not to judge the military action; Hanoi and Peking unresponsive.{7} A visit in mid- or late July.{5} "A good deal of blue sky" between the visit and any action in Vietnam; nothing before mid-July, the dates left open.{8} Drafted by Rusk, reviewed by Johnson, redrafted by Rusk and Rostow; an information copy to McNamara.{9}'
    cut_from:
      '4': '3'
      '5': '3'
    n: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156). [[w.gibbons-u-s-government-and]], IV, 370; [[w.gibbons-u-s-government-and]], IV, 370 (Rusk''s private talk with Wilson; the strikes not against population centers). The message itself gives the visit "in mid- or late July," not late July alone (doc. 156). The drafting and the copy to McNamara: doc. 156 n.1. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-06-03.vietnam-air-war]]. Names: Johnson, Wilson, Rusk, Rostow, McNamara.'
