    tags: [name:nguyen-ngoc-loan, name:pham-xuan-nhuan, name:ton-that-dinh, name:thich-tri-quang, place:hue]
  - id: cal.1966-06-15.vietnam
    when: June 15
    date: '1966-06-15'
    thread: vietnam
    c: 'After the reception for a delegation from Austria, fifty minutes with Fulbright: by Fulbright''s account "a highly emotional harangue," Johnson set on force enough to bring the Communists to a settlement.'
