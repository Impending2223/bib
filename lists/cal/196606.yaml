    place: shanghai
    thread: china-may-sixteenth
    c: 'The East China Bureau''s 华东局 secretariat meets on the May enlarged Politburo meeting. Its policy: rouse the masses boldly; rely on the left, win the middle, isolate the right; aim at those in power in the Party taking the capitalist road; public criticism by name with care, and dismissals approved above; the Four Cleanups to center on the Cultural Revolution; whether and when to send work groups as the case requires.'
