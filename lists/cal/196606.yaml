    c: 'NSC, 6:05 p.m.: the strikes on the oil stores. Johnson: not to disrupt the oil reaching the forces in the field is to pay in American casualties. The decision waits on Rusk''s return from NATO, Ronning''s report from Hanoi, word to the allies. McNamara: he has opposed the strikes for months; the situation has changed. Humphrey: "I have come around reluctantly"; politically "it will play hell." Goldberg alone against. "In order not to be lobbied on the decision, not another soul should be informed of this discussion."'
    n: '[FRUS 1964–68, IV, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v04/d159). [[w.dallek-flawed-giant]], 373 (the meeting, Johnson, the wait, Goldberg, the secrecy); [[w.solberg-hubert-humphrey]], 296–97 (Humphrey''s notes: "I reluctantly went along"); [[w.branch-at-canaans-edge]], 495 ("The choice is one of military lives versus escalation"); [[w.drea-mcnamara-clifford-and-the-2011]], 75 (the choice, higher American casualties or escalation; decision put off to Rusk''s and Ronning''s return). [[w.humphrey-education-of-a-public-1976]], 343–44 (the meeting; Humphrey for the strikes, reluctantly; Goldberg against). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 372–74. Check: Woods (133), citing the notes of this meeting, has Johnson authorize the strikes after the Joint Chiefs'' report of the North Vietnamese trucks, up from 6,900 to 10,000 a month; the notes give the trucks (General Johnson, 6,900 to 10,000) and leave the decision to wait. Names: Johnson, Rusk, Ronning, Goldberg, McNamara, Humphrey.'
