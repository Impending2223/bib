    c: 'After midnight, Johnson with Luci at St. Dominic''s church.{1} 1:52 a.m., Rostow by telephone: black clouds over fifty square miles above Haiphong, "So it looks like we burned up quite a bit of oil." 2:47 a.m., Vance: skeptical of the 80 percent first estimate at Hanoi; all the pilots back. "Let''s go to bed."{2}'
