    when: June 3
    date: '1966-06-03'
    thread: vietnam-air-war
    also: [europe-and-the-alliance]
    c: 'Wilson to Johnson on the oil strikes: the military benefits do not outweigh the political costs; in a declared war "clearly ... necessary and right," but where the aim is a negotiated settlement they "may only increase the difficulty"; British opinion and Western Europe''s "disquiet and criticism" reinforced.'
    n: '[[w.gibbons-u-s-government-and]], IV, 369–70. To check: Wilson to Johnson, June 3, 1966, cited in Pentagon Papers, Gravel ed., IV, 102 (cited by [[w.gibbons-u-s-government-and]], IV, 369 n.57). Names: Wilson, Johnson.'
