  - id: cal.1966-06-20.china-leadership-13
    when: June 20
    date: '1966-06-20'
    thread: china-may-sixteenth
    also: [china-organization]
    c: Hu Keshi 胡克實, secretary of the Youth League's Central Committee, tells Hu Qili 胡啟立 to go with him to see Deng Xiaoping 鄧小平. Deng tells Hu Qili that the thirteen who put up the poster at the girls' middle school are not activists, that activists do not sympathize with them; that middle-school students too include counter-revolutionaries, as Yang Guoqing 楊國慶, lately shot, was a middle-school student of 19; such must be struck back at; reactionary students will show themselves, and are to be set aside for a time. Hu Qili passes it to the work group the same day.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 205. Made public: [[w.yang-jisheng-tiandi-fanfu]], I, 205 (2016). Circulated in China: Hu Qili 胡啟立, 〈鄧小平是鎮壓師大女附中革命學生的黑司令〉, in Xin Beida gongshe 02621 zhidui, ed., *Che di qingsuan Deng Xiaoping* (Apr. 1967) (a Red Guard paper; cited by [[w.yang-jisheng-tiandi-fanfu]], I, 205 n.45). To check: Hu Qili 胡啟立, 〈鄧小平是鎮壓師大女附中革命學生的黑司令〉, in Xin Beida gongshe 02621 zhidui, ed., *Che di qingsuan Deng Xiaoping* (Apr. 1967) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 205 n.45). Names: Deng Xiaoping, Hu Keshi. Check: only the Red Guard exposures of 1967 give it; Yang (I, 205) leaves Deng''s talks on the school unsettled until the archives open.'
