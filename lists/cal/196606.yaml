  - id: cal.1966-06-16.china-leadership-8
    when: June 16
    date: '1966-06-16'
    thread: china-liu
    also: [africa, china-foreign]
    c: Liu Shaoqi answers President Boumedienne's letter, stating China's stand on disarmament. Imperialism has long used "disarmament" as a smokescreen to arm everywhere and prepare war; of more than a thousand postwar disarmament conferences none has shown any disarming. It would use it to limit and deprive peace-loving, especially Asian, states of the right to build self-defense forces. The U.S. runs the U.N. and bars China from it; China has no tie with it and will go to no meeting connected with it, disarmament meetings included. While the U.S. invades Vietnam and threatens the whole of Indochina and China, sitting with it on disarmament would turn the peoples' aim aside and give the U.S. cover.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 109–110 (June 16, 1966). Names: Liu Shaoqi, Boumedienne.'
