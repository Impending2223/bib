    c: 'Foreign Ministry note to the Indonesian embassy, rejecting Indonesia''s note of May 12. The Indonesian note, the Chinese say, ducks the substance and facts of the bloodshed at the Chinese embassy and instead protests to China; China firmly refuses that protest. Citing the bloodshed of Apr. 15, the attacks on and wrecking of Chinese missions and the persecution of Chinese in hundreds of towns, China repeats its demands: stop all anti-Chinese acts, protect the missions, and protect the overseas Chinese''s rights, lives and property.'
