  - id: cal.1966-06-29.vietnam-2
    when: June 29–30
    date: '1966-06-29'
    place: saigon
    thread: vietnam-marigold
    also: [comecon]
    c: 'Saigon.{1} D''Orlandi, the Italian ambassador, to Lodge, June 29: Lewandowski, the Polish member of the ICC, has brought a "very specific peace offer" from Hanoi;{2} the NLF to "take part" in negotiations, not as sole representative; a "suspension" of the bombing; American withdrawal on a "reasonable calendar." Lodge, June 30: new in substance, "so forthcoming as to arouse suspicion." Johnson to Martin of the Federal Reserve, June 30: "the most persuasive peace feeler I''ve had since I''ve been President."{3}'
    n: '[FRUS 1964–68, IV, doc. 167](https://history.state.gov/historicaldocuments/frus1964-68v04/d167); [doc. 169](https://history.state.gov/historicaldocuments/frus1964-68v04/d169); [doc. 170](https://history.state.gov/historicaldocuments/frus1964-68v04/d170). [[w.gibbons-u-s-government-and]], IV, 390–91, 495–98 (the offer, 390–91); [[w.herring-lbj-and-vietnam]], 104–07 (the channel at Saigon, D''Orlandi, Lewandowski and Lodge; its course to Dec. 15; not this meeting); [[w.mann-grand-delusion]], 516–17 (Lewandowski''s initiative of June: Hanoi open to a "political compromise," a role for the Viet Cong in the negotiations, a "suspension" of U.S. air strikes as an opening to talks; not the day, D''Orlandi, a "very specific peace offer" or the withdrawal calendar). [[w.rusk-as-i-saw-it-1990]], 466–67. Made public: in outline, [[w.kraslow-secret-search-for-peace]] (1968); the telegrams, [[w.herring-secret-diplomacy-of-the]] (1983). To check: [[w.hershberg-marigold]]; [[w.herring-secret-diplomacy-of-the]]. Names: Lodge, Lewandowski, D''Orlandi, Martin, Johnson.'
