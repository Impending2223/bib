    place: peking
    thread: china-may-sixteenth
    also: [china-propaganda]
    c: 'Peking Normal University 北京師范大學. At 10 a.m. Sun Youyu 孫友余, head of the work group, broadcasts on the poster put up that morning by Tan Houlan 譚厚蘭 and sixteen other students, "Where does Sun Youyu mean to lead the movement?": it is ulterior, their fate is tied to the ox-demons, a planned and organized premeditated act. He opens the struggle to "sweep the periphery" and "resist interference."{1} The poster went up at 6 a.m., Gao Shukui among its seventeen signers. Another poster asks Guo Yingqiu whether the plan to lodge Peking Garrison men at the People''s University over the holidays was Peng Zhen''s plot; Sun answers both, and says opposing the work group is opposing the new municipal committee and the Center.{2}'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 198–199; [[w.pu-weihua-zalan-jiu-shijie]], 161 (at 6 a.m. Gao Shukui 高树奎, Tan Houlan 谭厚兰 and fifteen others post "Where is Sun Youyu leading the movement?" against the work group head; another poster, "Who is Guo Yingqiu?", asks whether the plan for the Peking Garrison''s men to lodge in the People''s University over the holidays was a plot of Peng Zhen''s; Sun broadcasts: opposing the work group is opposing the new committee and the Center; "resist interference"; Mu Xin''s memoir (161 n.107)); [[w.pu-weihua-zalan-jiu-shijie]], 161. The words: 上午10時 (I, 199). Made public: [[w.xin-ban-guangming-ribao-shinian]], 297–298 (1994; marking not seen). Circulated in China: Hongweibing shoudu sansi 紅衛兵首都三司, ed., *Tianfan difu kai er kang: wuchanjieji wenhua dageming dashiji (1963.12–1967.10.1)* 《天翻地覆慨而慷——無產階級文化大革命大事記》 (Peking, 1967), 49–53 (a Red Guard paper; cited by [[w.yang-jisheng-tiandi-fanfu]], I, 199 n.25). To check: Hongweibing shoudu sansi 紅衛兵首都三司, ed., *Tianfan difu kai er kang: wuchanjieji wenhua dageming dashiji (1963.12–1967.10.1)* 《天翻地覆慨而慷——無產階級文化大革命大事記》 (Peking, 1967), 49–53 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 199 n.25); [[w.xin-ban-guangming-ribao-shinian]], 297–298 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 161 n.107). Names: Tan Houlan, Peng Zhen. Check: 内部发行 or a like marking in [[w.xin-ban-guangming-ribao-shinian]] (copyright page not seen; its catalogue record, CiNii NCID BN12879418, notes none).'
