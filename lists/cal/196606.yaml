    thread: vietnam-marigold
    c: 'Saigon. D''Orlandi, the Italian ambassador, to Lodge, June 29: Lewandowski, the Polish member of the ICC, has brought a "very specific peace offer" from Hanoi; the NLF to "take part" in negotiations, not as sole representative; a "suspension" of the bombing; American withdrawal on a "reasonable calendar." Lodge, June 30: new in substance, "so forthcoming as to arouse suspicion." Johnson to Martin of the Federal Reserve, June 30: "the most persuasive peace feeler I''ve had since I''ve been President."'
