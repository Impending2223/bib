    c: 'Johnson and Russell at dinner, alone, against a promise to McNamara: the Meredith march; Carmichael, Johnson predicts, dead within ninety days. The target maps, the bombers about to leave. Russell, in his diary memo that night: "some policy had suddenly resolved itself ... It was the latter."'
