  - id: cal.1966-06-29.vietnam
    when: June 29–30
    date: '1966-06-29'
    time: 1966-06-29T05:50Z
    thread: vietnam
    c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29.{1} Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result;{2} put off for weather and leaks;{3} Johnson''s assent to McNamara by telephone, June 28.{4} Wilson, told in advance, dissociates Britain.{5} Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."{6} McNamara, 7:59 a.m., June 28: "I dont see how you can go on fighting out there ... without doing it"; Johnson: "Okay, Bob, go ahead."{7} The Navy goes first, at 1:50 p.m. Saigon time, for the weather: sixteen A-6s and twelve support aircraft on Haiphong. Twenty-five minutes later the Air Force on the tank farm near Hanoi, some 17 percent of the North''s reserves: two of thirty-two tanks left standing, about 90 percent of the target area destroyed. One F-105 lost, its pilot, Murphy Neal, captured; a MiG-17 shot down.{8} At Haiphong, pilots report 80 percent destroyed; the photographs show 40.{9} Johnson telephones Rostow and Vance eleven times in some seventy-five minutes for word of the raids.{10}'
    n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV, 370–71, 377 (the strikes, 377; Wilson''s dissociation, 370–71); [[w.drea-mcnamara-clifford-and-the-2011]], 75–76 (the NSC of June 22 and Ronning''s report; Wilson''s warning; the postponement; Johnson''s approval June 28; the strikes June 29); [[w.frankum-like-rolling-thunder]], 48–49 (the strikes of June 29; put off for weather); [[w.vietnam-victory-in-vietnam]], 181 (the strikes of June 29); [[w.staaveren-gradual-failure]], 279, 285–89 (the strikes; the directive of June 22 and Ronning''s visit; the postponements for the weather and the leak of June 24; the approval relayed June 28; Wilson told beforehand); [[w.dallek-flawed-giant]], 373–74 (the NSC of June 22, not its figures or Ronning; the strikes); [[w.herring-lbj-and-vietnam]], 105 (the oil strikes, late June); [[w.mcnamara-in-retrospect]], ch. 9 at nn.9–10 (authorized "in late June"; the loss hindered the North only a short time: dispersed fuel, more by rail from China and from Soviet tankers). [[w.branch-at-canaans-edge]], 495–97 (McNamara, 7:59 a.m., June 28: "I don''t see how you can go on fighting out there ... without doing it"; Johnson: "Okay, Bob, go ahead"); [[w.berman-lyndon-johnsons-war]], 15 n.* (Rolling Thunder widened "in July 1966 to include ammunition dumps and oil storages"); [[w.cosmas-joint-chiefs-of-staff-2012]], 427 (the first attacks June 29, some 40 percent of Haiphong''s storage knocked out and a tank farm near Hanoi destroyed; restrikes authorized July 5); [[w.staaveren-gradual-failure]], 289, 292 (Sharp''s execute order: the Navy on Haiphong, Bac Giang, Don Son and Duong Nham and the Kep radar, the Air Force on Hanoi, Nguyen Khe, Viet Tri; the Navy first, at 1350, sixteen A-6s on Haiphong; Hanoi''s site some 80 percent destroyed; by July 11, twenty-five sites struck); [[w.drea-mcnamara-clifford-and-the-2011]], 76 (Haiphong''s tanks only 40 percent destroyed, restruck July 5; about 90 percent at Hanoi); [[w.zaroulis-who-spoke-up]], 86 (the first bombing run takes off the night of June 29; the page has Washington announce the first strikes June 30; Wilson dissociates Britain); [[w.goodwin-remembering-america]], 465 (the first bombing of Hanoi and Haiphong, two-thirds of the North''s oil said destroyed; at a White House meeting on it, by a former associate''s account in Goodwin''s diary of July 16, McNamara: "that bombing the Hanoi-Haiphong fuel dumps won''t get us out of Vietnam, but they''ll run us out of this country if we don''t do it"; the date as July 29); [[w.lich-su-khang-chien-chong-my]], IV, 206, 397–98 (the Đức Giang and Thượng Lý depots, Jun. 29); [[w.branch-at-canaans-edge]], 496; [[w.branch-at-canaans-edge]], 496 n. (the hour). Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). Check: Berman (15 n.*) dates the widening to the oil storage July 1966. Check: the day. [[w.goodwin-remembering-america]], 465, has the first bombing of Hanoi and Haiphong "On July 29."; [[w.staaveren-gradual-failure]], 289–90; [[w.drea-mcnamara-clifford-and-the-2011]], 76; [[w.cosmas-joint-chiefs-of-staff-2012]], 427 (40 percent). To check: [[w.pentagon-papers]] (IV); Msg, JCS to CINCPAC, 222044Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 288 n.27a); msg, CINCPAC to CINCPACFLT, CINCPACAF, 222044Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 288 n.27b); Msg, JCS to CINCPAC, 251859Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.28a); *Washington Post*, June 26, 1966 (cited by [[w.staaveren-gradual-failure]], 289 n.28b); Msg, CJCS to CINCPAC, 281254Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.29); Msgs, CINCPAC to CINCPACAF and CINCPACFLT, 230943Z Jun 66 and 281932Z Jun 66 (cited by [[w.staaveren-gradual-failure]], 289 n.30a); UPI dispatch (in Current News, Early Bird ed), Jun 29, 66, p 6 (cited by [[w.staaveren-gradual-failure]], 289 n.30b); McNamara''s news conference, June 29, 1966, transcript in the [*New York Times*, June 30, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/30/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 377 n.72); [[w.dallek-flawed-giant]], 371–75 (cited by [[w.branch-at-canaans-edge]], 495); "President Hints Intensified War Effort; Ky Feels Junta Is ''Over Hump'' in Crisis," [*New York Times*, June 19, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/19/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 495); [Johnson and Robert McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (cited by [[w.branch-at-canaans-edge]], 496); [Johnson and Robert McNamara](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (cited by [[w.branch-at-canaans-edge]], 497). Names: McNamara, William Bundy, Wilson, Holt, Ronning, Johnson, Rostow, Vance.'
