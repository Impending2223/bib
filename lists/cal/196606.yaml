    c: 'Liu Shaoqi drafts for the Central Committee the comment forwarding the Peking University Cultural Revolution Bulletin no. 9, which reports on how the work group there stopped disorderly beating: the Center thinks the work group''s handling of the disorder correct and timely, and any unit where it occurs may follow Peking University''s way.{1}'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642 (June 20, 1966); [[w.macfarquhar-maos-last-revolution]], 75 (Liu endorses the work team''s action of June 18 as "correct and timely" and has its report reprinted as a highly classified central circular, a guide for Party committees all over China); [[w.deng-xiaoping-nianpu-1904]], III, 1919–1920 (June 18–20, 1966; at Peking University mass beating and fighting break out on the 18th and the work team there criticizes and makes some rules that night; on the 20th the Central Committee forwards the university''s *Cultural Revolution Bulletin* no. 9 to the whole country, with a comment Liu Shaoqi drafts in the Center''s name affirming the team''s way; Chen Boda, Jiang Qing and others then go to the university to hold meetings stirring teachers and students against the work team; footnote 1: on Aug. 5, 1966, at the Eleventh Plenum and on Mao''s view, a Central Committee paper said that forwarding the bulletin was ''wrong'' and revoked it); [[w.mao-zedong-zhuan]], VI, ch. 74 (June 20, on Liu Shaoqi''s view the Center transmits Bulletin no. 9 of Peking University with a note: the work team''s way of handling the disorder is correct and timely, and units where it occurs may follow it). [[w.yang-jisheng-tiandi-fanfu]], I, 202 (June 19 Liu Shaoqi 劉少奇 forwards the bulletin in the Center''s name with the comment that the Center thinks the work group''s way of handling the disorder is correct and timely, and that any unit where such a thing occurs may follow Peking University''s way; the bulletin is issued on the 20th); [[w.pu-weihua-zalan-jiu-shijie]], 159 (June 20, Liu Shaoqi forwards bulletin no. 9 to the whole Party; his draft comment for the Center: the work group''s handling of the disorderly struggles correct and timely; others to follow Peking University''s way (159 n.104, n.105)). Made public: 1996. To check: the Peking University Cultural Revolution Bulletin no. 9, the Central Committee''s comment of June 20, 1966 (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 642); [[w.zheng-liu-shaoqide-zuihou-suiyue]], 67 (cited by [[w.macfarquhar-maos-last-revolution]], 75 n.37b); 中共中央轉發北京大學文化革命簡報(第九號) (June 20, 1966), in [[w.wenhua-dageming-yanjiu-ziliao]], I, 49–50 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 159 n.104). Names: Liu Shaoqi. Check: the book says Jiang Qing and others later called the forwarding "suppressing the student movement."'
