# Cal. LVIII March 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LVIII
entries:
  - id: cal.1965-03-02.vietnam
    when: Mar. 2
    date: '1965-03-02'
    thread: vietnam
    c: 'Rolling Thunder begins: 104 American and 19 South Vietnamese aircraft against the Xóm Bàng ammunition depot, just north of the demilitarized zone, and the Quảng Khê naval base. Six American aircraft lost, five pilots rescued; no announcement in Washington or Saigon. The same day General Harold K. Johnson, the Army''s chief of staff, ordered to Saigon to find what more can be done in the South: "no limitation on funds, equipment or personnel."'
    n: FRUS 1964–68, II, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v02/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v02/d176), [178](https://history.state.gov/historicaldocuments/frus1964-68v02/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v02/d179). Thompson, *Rolling Thunder*; Clodfelter, *The Limits of Air Power*; Van Staaveren, *Gradual Failure* (Viet. II.F.6). See [[cal.1965-02-07.vietnam]]; [[cal.1965-02-13.vietnam]].
    tags: [name:johnson-lyndon-b, name:johnson-harold-k]
  - id: cal.1965-03-02.cities-and-housing
    when: Mar. 2
    date: '1965-03-02'
    thread: cities-and-housing
    c: 'Message on the cities: a Department of Housing and Urban Development; rent supplements, the government to pay part of the rent of low- and moderate-income families in privately built housing, more than 500,000 homes in four years; matching grants for community facilities, $100 million for fiscal 1966; aid to buy land ahead of growth.'
    n: '[Special Message to the Congress on the Nation''s Cities](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-nations-cities) (Mar. 2, 1965). Gelfand, *A Nation of Cities*; Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1962-01-24.program]]; [[cal.1964-09-02.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-03.economy
    when: Mar. 3
    date: '1965-03-03'
    thread: economy
    c: 'Act ending the gold reserve against Federal Reserve deposits signed, [79 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg5.pdf): the Reserve Banks'' 25 percent in gold certificates against their deposits repealed; the 25 percent against Federal Reserve notes kept. The House passed it Feb. 9, the Senate Feb. 18.'
    n: H.R. 3818, 89th Cong. Solomon, *The International Monetary System, 1945–1976* (K–J Adm. II.B). See [[cal.1965-02-09.economy]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-05.opinion
    when: Mar. 5
    date: '1965-03-05'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Jan. 28–Feb. 2: pay in the Neighborhood Youth Corps set by each community, 54 percent; the federal minimum of $1.25 required, 38. The pay for part-time work: $1.00 or less, 41; more, 46. South 54 for $1.00 or less.'
    n: '*The Gallup Poll*, III, 1927–28 (K–J Cong. II.E).'
  - id: cal.1965-03-07.voting-rights
    when: Mar. 7
    date: '1965-03-07'
    thread: voting-rights
    also: [alabama, king]
    c: Selma. Some 650 set out from Brown Chapel to walk to Montgomery, Hosea Williams and John Lewis at the head. Beyond the Edmund Pettus Bridge, Lingo's state troopers, on a plan known to Wallace, and Sheriff Clark's mounted possemen break them up with clubs, tear gas, and nausea gas; 75 to 80 injured, Lewis's skull fractured. On television that night.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 104–05 (M.D. Ala. 1965) (the court''s findings). Film (K–J Cong. II.K). Garrow, *Protest at Selma*; Lawson, *Black Ballots*; May, *Bending Toward Justice* (K–J Cong. II.C). Branch, *At Canaan''s Edge*; Kotz, *Judgment Days* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Fairclough, *To Redeem the Soul of America*; Carson, *In Struggle* (K–J Cong. II.F). Carter, *The Politics of Rage* (K–J Cong. II.H). Lewis, *Walking with the Wind* (K–J Cong. II.I.4). Dallek, *Flawed Giant* (K–J Adm. II.A). *Reaching for Glory* (K–J Adm. II.J). See [[cal.1965-01-02.voting-rights]]; [[cal.1965-02-18.voting-rights]]. Names: Williams, Lingo, Clark (K–J Cong. III.K); Lewis (K–J Cong. III.H); Wallace (K–J Cong. III.F).'
    tags: [name:williams-hosea, name:lewis-john, name:lingo-albert-j, name:wallace-george-c, name:clark-james-g-jr]
  - id: cal.1965-03-07.opinion
    when: Mar. 7
    date: '1965-03-07'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Jan. 28–Feb. 2: the Federal Government to pay more of the public schools'' costs, 49 percent; the States and localities as now, 42. The money to public schools only, 41; to Catholic and other private schools as well, 51.'
    n: '*The Gallup Poll*, III, 1928 (K–J Cong. II.E).'
  - id: cal.1965-03-08.vietnam
    when: Mar. 8
    date: '1965-03-08'
    thread: vietnam
    c: Two battalion landing teams of Marines come ashore at Đà Nẵng, the first American ground combat units in Vietnam; the mayor and General Thi, the corps commander, greet them. A third battalion and a helicopter squadron by Mar. 12. Their mission the security of the air base.
    n: '[FRUS 1964–68, II, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v02/d188). Shulimson & Johnson, *U.S. Marines in Vietnam: The Landing and the Buildup, 1965* (Viet. II.F.5). Berman, *Planning a Tragedy*; VanDeMark, *Into the Quagmire*; McMaster, *Dereliction of Duty*; Preston, *The War Council* (Viet. II.C.3). Logevall, *Choosing War*; Kahin, *Intervention*; Gibbons, *The U.S. Government and the Vietnam War* (K–J Adm. II.D). Berman, *Lyndon Johnson''s War*; Herring, *LBJ and Vietnam* (Viet. II.C.1). Kaiser, *American Tragedy* (Viet. II.B.8). Taylor, *Swords and Plowshares* (Viet. II.H.1). Westmoreland, *A Soldier Reports* (Viet. II.H.2). See [[cal.1965-02-22.vietnam]].'
    tags: [name:nguyen-chanh-thi]
  - id: cal.1965-03-08.court
    when: Mar. 8
    date: '1965-03-08'
    thread: court
    also: [voting-rights]
    c: '*Louisiana v. United States*, [380 U.S. 145](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380145/usrep380145.pdf): Louisiana''s test requiring an applicant to interpret any section of the State or Federal Constitution to the registrar''s satisfaction struck down. *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf): the Government''s suit against the State''s registration laws reinstated. Black for the Court in both. *Swain v. Alabama*, [380 U.S. 202](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380202/usrep380202.pdf): a prosecutor''s peremptory strikes of every Negro on one jury panel no proof of discrimination, 6–3.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). See [[cal.1964-12-14.court]]. Names: Black, White (K–J Cong. III.G).'
    tags: [name:black-hugo-l, name:white-byron-r]
  - id: cal.1965-03-08.court-2
    when: Mar. 8
    date: '1965-03-08'
    thread: court
    also: [defense]
    c: '*United States v. Seeger*, [380 U.S. 163](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380163/usrep380163.pdf): the draft law''s exemption for objectors by "religious training and belief" covers "a sincere and meaningful belief" that occupies in its holder''s life "a place parallel to that filled by the God" of those plainly exempt. Clark for the Court, without dissent.'
    n: 'Baskir & Strauss, *Chance and Circumstance* (Viet. II.G.1). See [[cal.1965-03-08.court]]. Names: Clark (K–J Cong. III.G).'
    tags: [name:clark-tom-c]
  - id: cal.1965-03-08.crime-and-hijacking
    when: Mar. 8
    date: '1965-03-08'
    thread: crime-and-hijacking
    c: 'Message on crime: "a malignant enemy in America''s midst." A President''s Commission on Law Enforcement and Administration of Justice; a Law Enforcement Assistance Act, grants through the Attorney General for new methods in police, courts, and corrections; mail-order sales of guns to individuals stopped, interstate shipment only among licensed dealers. "Lee Oswald sent for and received a rifle through the United States mail."'
    n: '[Special Message to the Congress on Law Enforcement and the Administration of Justice](https://www.presidency.ucsb.edu/documents/special-message-the-congress-law-enforcement-and-the-administration-justice) (Mar. 8, 1965). Flamm, *Law and Order* (K–J Cong. II.F). *The Challenge of Crime in a Free Society* (K–J Cong. II.J.3). See [[cal.1961-09-13.crime-and-hijacking]]. Names: Oswald (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:oswald-lee-harvey]
  - id: cal.1965-03-09.voting-rights
    when: Mar. 9
    date: '1965-03-09'
    thread: voting-rights
    also: [alabama, king]
    c: Selma, the second march. Judge Johnson bars any march until a hearing. King leads some 2,500 to the bridge, kneels with them at the troopers' line, and turns back, as Collins had arranged with Clark and Lingo. That night whites club James Reeb, a Unitarian minister from Boston; he dies in Birmingham Mar. 11.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 103 (M.D. Ala. 1965) (the order of Mar. 9). [Statement by the President on the Situation in Selma, Alabama](https://www.presidency.ucsb.edu/documents/statement-the-president-the-situation-selma-alabama) (Mar. 9, 1965): "deploring the brutality." Check the number. See [[cal.1965-03-07.voting-rights]]. Names: Frank Johnson (K–J Cong. III.G); King (K–J Cong. III.H); Collins (K–J Cong. III.F); Clark, Lingo, Reeb (K–J Cong. III.K).'
    tags: [name:johnson-frank-m-jr, name:king-martin-luther-jr, name:collins-leroy, name:clark-james-g-jr, name:lingo-albert-j, name:reeb-james-j, name:johnson-lyndon-b]
  - id: cal.1965-03-09.jobs-and-wages
    when: Mar. 9
    date: '1965-03-09'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Appalachian Regional Development Act signed, [79 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg5-2.pdf): an Appalachian Regional Commission; $840 million for 2,350 miles of development highways and 1,000 of access roads, to 1971; $252.4 million to June 1967 for health centers, land, timber, mines, water, and vocational schools. The House had passed the Senate''s bill Mar. 3, [257–165](https://voteview.com/rollcall/RH0890015); recommittal refused, [100–323](https://voteview.com/rollcall/RH0890014).'
    n: '[Remarks Upon Signing the Appalachia Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-appalachia-bill) (Mar. 9, 1965): "The dole is dead. The pork barrel is gone." [111 Cong. Rec., House, Mar. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-10-1.pdf). Eller, *Uneven Ground* (K–J Adm. II.B). Caudill, *Night Comes to the Cumberlands* (K–J Cong. II.F). See [[cal.1965-02-01.jobs-and-wages]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-09.congress
    when: Mar. 9
    date: '1965-03-09'
    thread: congress
    c: Senate sets up a Joint Committee on the Organization of the Congress, six members from each House, three of each party, [88–0](https://voteview.com/rollcall/RS0890027); an amendment to let it recommend on rules and procedure refused, [29–58](https://voteview.com/rollcall/RS0890026). Monroney manages it. The House agrees Mar. 11 by unanimous consent, on Madden's request.
    n: S. Con. Res. 2, 89th Cong. [111 Cong. Rec., Senate, Mar. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-3-2.pdf); [111 Cong. Rec., House, Mar. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-5-1.pdf). Zelizer, *On Capitol Hill*; Schickler, *Disjointed Pluralism* (K–J Cong. II.A). See [[cal.1965-01-04.congress]].
    tags: [name:monroney-almer-s, name:madden-ray-j]
  - id: cal.1965-03-12.opinion
    when: Mar. 12
    date: '1965-03-12'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 19–24: continue present efforts in South Vietnam, 66 percent; pull out, 19. A bigger war: likely 44, not 43. A conference called by Johnson with the leaders of Southeast Asia and China: yes 81, no 11.'
    n: '*The Gallup Poll*, III, 1929 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-13.voting-rights
    when: Mar. 13
    date: '1965-03-13'
    thread: voting-rights
    also: [alabama]
    c: 'Wallace at the White House, on his telegram of the night before. Johnson asks him to declare for universal suffrage, to permit peaceful assembly, and to call a biracial meeting. News conference in the Rose Garden after: "What happened in Selma was an American tragedy"; the voting bill to go to Congress Monday; if State officials will not register citizens, federal officials will.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1028) (Mar. 13, 1965). Carter, *The Politics of Rage* (K–J Cong. II.H). Kotz, *Judgment Days* (K–J Adm. II.C). See [[cal.1965-03-07.voting-rights]]. Names: Wallace (K–J Cong. III.F).'
    tags: [name:wallace-george-c, name:johnson-lyndon-b]
  - id: cal.1965-03-15.voting-rights
    when: Mar. 15
    date: '1965-03-15'
    thread: voting-rights
    c: 'Johnson to a joint session, at night, on television: "The American Promise." "So it was last week in Selma, Alabama." A voting bill to strike down the restrictions used to deny Negroes the vote, in all elections; "their cause must be our cause too. ... And we shall overcome." A written message the same day.'
    n: '[Special Message to the Congress: The American Promise](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-american-promise) (Mar. 15, 1965); [Special Message to the Congress on the Right To Vote](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-right-vote) (Mar. 15, 1965). [111 Cong. Rec., House, Mar. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-6-2.pdf). Recording (K–J Adm. II.I). See [[cal.1965-03-07.voting-rights]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-17.voting-rights
    when: Mar. 17
    date: '1965-03-17'
    thread: voting-rights
    c: The voting bill sent to Congress. Celler introduces it, H.R. 6400; Mar. 18, Mansfield for himself, Dirksen, and 64 others, S. 1564. Where a literacy or like test was used and fewer than half of those of voting age were registered on Nov. 1, 1964, or voted that November, tests suspended and federal examiners to list voters. Mar. 18, the Senate sends it to Judiciary with orders to report by Apr. 9, [67–13](https://voteview.com/rollcall/RS0890032).
    n: '[Letter to the President of the Senate Proposing Legislation To Eliminate Barriers to the Right To Vote](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-proposing-legislation-eliminate-barriers-the-right-vote) (Mar. 17, 1965). [111 Cong. Rec., House, Mar. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-8-2.pdf); [111 Cong. Rec., Senate, Mar. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf) (the bill, 5402–03). Voting Rights Act of 1965 (K–J Cong. II.J.2). Katzenbach, *Some of It Was Fun* (K–J Adm. II.G.6). See [[cal.1965-03-15.voting-rights]]. Names: Celler (K–J Cong. III.D); Mansfield, Dirksen (K–J Cong. III.A).'
    tags: [name:johnson-lyndon-b, name:celler-emanuel, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-03-17.alabama
    when: Mar. 17
    date: '1965-03-17'
    thread: alabama
    also: [voting-rights]
    c: 'Judge Johnson permits the march to Montgomery on U.S. 80, on the plaintiffs'' plan: no limit on numbers on the four-lane road, 300 on the two-lane stretch; Wallace, Lingo, and Clark enjoined from interfering. "The extent of the right to assemble, demonstrate and march peaceably ... should be commensurate with the enormity of the wrongs."'
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 106–09 (M.D. Ala. 1965). Opinion (K–J Cong. II.J.1). Bass, *Taming the Storm* (K–J Cong. II.G). See [[cal.1965-03-09.voting-rights]]. Names: Frank Johnson (K–J Cong. III.G); Wallace (K–J Cong. III.F); Lingo, Clark (K–J Cong. III.K).'
    tags: [name:johnson-frank-m-jr, name:wallace-george-c, name:lingo-albert-j, name:clark-james-g-jr]
  - id: cal.1965-03-17.court
    when: Mar. 17
    date: '1965-03-17'
    thread: court
    also: [congress]
    c: House refuses the Justices $3,000 more a year, [178–202](https://voteview.com/rollcall/RH0890020), the rule having carried, [202–183](https://voteview.com/rollcall/RH0890019). The pay act of 1964 had raised Members' and other federal judges' salaries $7,500, the Justices' $4,500, to $39,500; the Chief Justice $40,000.
    n: H.R. 5374, 89th Cong. [111 Cong. Rec., House, Mar. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-8-2.pdf). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1965-03-08.court]].
  - id: cal.1965-03-18.transition-and-staff
    when: Mar. 18
    date: '1965-03-18'
    thread: transition-and-staff
    also: [economy]
    c: Dillon to leave the Treasury; Fowler, Under Secretary 1961–64, named to succeed him. Confirmed Mar. 25 without a roll call; sworn Apr. 1.
    n: '[Remarks to the Press Upon Announcing the Nomination of Henry H. Fowler as Secretary of the Treasury](https://www.presidency.ucsb.edu/documents/remarks-the-press-upon-announcing-the-nomination-henry-h-fowler-secretary-the-treasury) (Mar. 18, 1965); [Letter Accepting Resignation of Douglas Dillon as Secretary of the Treasury](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-douglas-dillon-secretary-the-treasury) (Mar. 31, 1965); [Remarks at the Swearing In of Henry H. Fowler as Secretary of the Treasury](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-henry-h-fowler-secretary-the-treasury) (Apr. 1, 1965). [111 Cong. Rec., Senate, Mar. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt5/pdf/GPO-CRECB-1965-pt5-2-1.pdf). See [[cal.1965-01-20.transition-and-staff]]. Names: Dillon, Fowler (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:dillon-c-douglas, name:fowler-henry-h]
  - id: cal.1965-03-20.alabama
    when: Mar. 20
    date: '1965-03-20'
    thread: alabama
    also: [voting-rights]
    c: 'Wallace, Mar. 18: the State needs 6,171 men to guard the march and has some 450; he asks for federal civil officers. Johnson that night: Wallace has 10,000 Guardsmen. Mar. 19, Wallace and the legislature: Alabama cannot bear the cost. Mar. 20, 1:30 a.m., from Johnson City, Proclamation 3645 and Executive Order 11207: the Alabama Guard called into federal service, the Secretary of Defense to use the armed forces as needed; Ramsey Clark to Alabama.'
    n: '[Statement by the President in Response to a Telegram From the Governor of Alabama](https://www.presidency.ucsb.edu/documents/statement-the-president-response-telegram-from-the-governor-alabama) (Mar. 18, 1965); [The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-2) (Mar. 20, 1965). Proclamation 3645, [30 Fed. Reg. 3739](https://www.govinfo.gov/app/details/FR-1965-03-23); Exec. Order 11207, [30 Fed. Reg. 3743](https://www.govinfo.gov/app/details/FR-1965-03-23). See [[cal.1965-03-17.alabama]]. Names: Wallace (K–J Cong. III.F); Ramsey Clark (K–J Adm. III.I).'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, name:clark-ramsey]
  - id: cal.1965-03-21.voting-rights
    when: Mar. 21–25
    date: '1965-03-21'
    thread: voting-rights
    also: [alabama, king]
    c: 'Selma to Montgomery. King leads some 3,200 out of Selma under the federalized Guard, Army troops, marshals, and the FBI; 300 through Lowndes County; thousands join for the last miles. Mar. 25, some 25,000 at the Capitol in Montgomery. King: "How long? Not long."'
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 108–09 (M.D. Ala. 1965) (the plan). Check the counts. See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-20.alabama]]. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-03-23.space
    when: Mar. 23
    date: '1965-03-23'
    thread: space
    c: 'Gemini 3: Grissom and Young, three orbits in under five hours, the first American crew of two. They fire the thrusters to change their orbit, the first crew to do so. Five days after Voskhod 2, from which a Soviet cosmonaut stepped out into space.'
    n: '[Message of Congratulations Following the Orbital Flight of Russian Spaceship Voskhod 2](https://www.presidency.ucsb.edu/documents/message-congratulations-following-the-orbital-flight-russian-spaceship-voskhod-2) (Mar. 19, 1965); [Statement by the President on the Flight of Gemini 3](https://www.presidency.ucsb.edu/documents/statement-the-president-the-flight-gemini-3); [Telephone Conversation With Gus Grissom and John Young Following the Orbital Flight of Gemini 3](https://www.presidency.ucsb.edu/documents/telephone-conversation-with-gus-grissom-and-john-young-following-the-orbital-flight-gemini) (Mar. 23, 1965). Barton C. Hacker & James M. Grimwood, *On the Shoulders of Titans: A History of Project Gemini* (1977). McDougall, *...the Heavens and the Earth*; Siddiqi, *Challenge to Apollo* (K–J Adm. II.B). See [[cal.1964-07-31.space]]. Names: Grissom (K–J Adm. III.F); Young (K–J Cong. III.K).'
    tags: [name:grissom-virgil-i, name:young-john-w, name:johnson-lyndon-b]
  - id: cal.1965-03-23.medicare
    when: Mar. 23
    date: '1965-03-23'
    thread: medicare
    also: [welfare]
    c: 'Ways and Means votes out Mills''s bill, H.R. 6675: hospital insurance under Social Security, up to 60 days an illness, with nursing home care, from a payroll tax; insurance for doctors'' bills, voluntary, $3 a month; Kerr-Mills enlarged for the needy of all ages; cash benefits up 7 percent.'
    n: '[Statement by the President Following Committee Action on the Medicare Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-committee-action-the-medicare-bill) (Mar. 23, 1965); [Remarks to the Press Following a Meeting With Congressional Leaders To Discuss Medical Care Legislation](https://www.presidency.ucsb.edu/documents/remarks-the-press-following-meeting-with-congressional-leaders-discuss-medical-care) (Mar. 26, 1965). Marmor, *The Politics of Medicare*; Zelizer, *Taxing America*; David, *With Dignity* (K–J Cong. II.B). See [[cal.1965-01-07.medicare]]. Names: Mills (K–J Cong. III.D).'
    tags: [name:mills-wilbur-d, name:johnson-lyndon-b]
  - id: cal.1965-03-24.students
    when: Mar. 24–25
    date: '1965-03-24'
    thread: students
    also: [vietnam]
    c: 'Ann Arbor. The first teach-in on the war, at the University of Michigan: faculty and students, some 3,000, in lectures, debates, and seminars from evening to morning. Faculty had first planned a one-day strike against the war. Columbia, Mar. 26; teach-ins at some 35 more campuses within a week. Check the counts.'
    n: Wells, *The War Within* (K–J Cong. II.F). DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?*; Heineman, *Campus Wars* (Viet. II.G.1).
  - id: cal.1965-03-24.opinion
    when: Mar. 24
    date: '1965-03-24'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Feb. 19–24: Republicans'' choice to lead the party: Nixon 36, Lodge 16, Romney 14, Goldwater 11, Scranton 8, Rockefeller 4, Taft 4, Percy 2, Hatfield 2. Independents: Nixon 29, Lodge 18, Romney 14, Goldwater 10, Scranton 7, Rockefeller 7.'
    n: '*The Gallup Poll*, III, 1930 (K–J Cong. II.E). Names: Lodge (K–J Adm. III.E); Nixon (Opp. III.E); Goldwater, Percy, Hatfield (Opp. III.B); Romney, Scranton, Rockefeller (Opp. III.H).'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:taft-robert-jr, name:percy-charles-h, name:hatfield-mark-o]
  - id: cal.1965-03-25.jobs-and-wages
    when: Mar. 25
    date: '1965-03-25'
    thread: jobs-and-wages
    also: [poverty]
    c: Message on area and regional development, for depressed areas of some 27 million people. The Area Redevelopment Administration's work to an Economic Development Administrator in Commerce; grants for public facilities, half the cost; multi-county development districts; regional planning commissions on the Appalachian model.
    n: '[Special Message to the Congress on Area and Regional Economic Development](https://www.presidency.ucsb.edu/documents/special-message-the-congress-area-and-regional-economic-development) (Mar. 25, 1965). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1965-03-09.jobs-and-wages]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-25.alabama
    when: Mar. 25
    date: '1965-03-25'
    thread: alabama
    also: [voting-rights]
    c: Viola Liuzzo of Detroit, a white volunteer driving marchers back to Selma, shot dead from a passing car on U.S. 80 in Lowndes County. The young Negro marcher with her survives.
    n: '[Televised Remarks Announcing the Arrest of Members of the Ku Klux Klan](https://www.presidency.ucsb.edu/documents/televised-remarks-announcing-the-arrest-members-the-ku-klux-klan) (Mar. 26, 1965). May, *The Informant* (K–J Cong. II.F). Mary Stanton, *From Selma to Sorrow: The Life and Death of Viola Liuzzo* (1998). See [[cal.1965-03-21.voting-rights]]. Names: Liuzzo (K–J Cong. III.K).'
    tags: [name:liuzzo-viola]
  - id: cal.1965-03-26.civil-rights-the-executive
    when: Mar. 26
    date: '1965-03-26'
    thread: civil-rights-the-executive
    also: [alabama]
    c: 'Johnson on television from the East Room, Hoover beside him: four Klansmen arrested in Birmingham for Liuzzo''s death, on a federal conspiracy charge; one of them the FBI''s informant. "Get out of the Ku Klux Klan now." Katzenbach to draft legislation against the Klan; Congress invited to investigate. Apr. 14, the House gives the Un-American Activities Committee $50,000 for an inquiry into the Klan, [313–44](https://voteview.com/rollcall/RH0890038).'
    n: '[Televised Remarks Announcing the Arrest of Members of the Ku Klux Klan](https://www.presidency.ucsb.edu/documents/televised-remarks-announcing-the-arrest-members-the-ku-klux-klan) (Mar. 26, 1965). H. Res. 310, 89th Cong.; [111 Cong. Rec., House, Apr. 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-6-1.pdf). Goodman, *The Committee* (K–J Cong. II.A). See [[cal.1965-03-25.alabama]]. Names: Hoover, Katzenbach (K–J Adm. III.I); Liuzzo (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:hoover-j-edgar, name:katzenbach-nicholas, name:liuzzo-viola]
  - id: cal.1965-03-26.school-aid
    when: Mar. 26
    date: '1965-03-26'
    thread: school-aid
    c: House passes the Elementary and Secondary Education bill, H.R. 2362, [263–153](https://voteview.com/rollcall/RH0890026); recommittal lost, [149–267](https://voteview.com/rollcall/RH0890025).
    n: '[111 Cong. Rec., House, Mar. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt5/pdf/GPO-CRECB-1965-pt5-3-1.pdf). [Statement by the President Following House Action on the Education Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-education-bill) (Mar. 27, 1965). Eidenberg & Morey, *An Act of Congress* (K–J Cong. II.B). See [[cal.1965-01-12.school-aid]]. Names: Perkins, Powell (K–J Cong. III.D).'
    tags: [name:perkins-carl-d, name:powell-adam-clayton-jr]
  - id: cal.1965-03-30.vietnam
    when: Mar. 30
    date: '1965-03-30'
    thread: vietnam
    c: 'A car bomb outside the American embassy in Saigon: 2 Americans and 20 Vietnamese killed, nearly 200 wounded; U. Alexis Johnson, the chargé, cut. Apr. 1, Johnson asks $1 million for a new chancery; the House votes it Apr. 5, [378–0](https://voteview.com/rollcall/RH0890031).'
    n: '[FRUS 1964–68, II, doc. 221](https://history.state.gov/historicaldocuments/frus1964-68v02/d221). [Statement by the President on the Bombing of the U.S. Embassy in Saigon](https://www.presidency.ucsb.edu/documents/statement-the-president-the-bombing-the-us-embassy-saigon) (Mar. 30, 1965). Johnson, *The Right Hand of Power* (Viet. II.H.1). See [[cal.1965-03-08.vietnam]]. Names: U. Alexis Johnson (Viet. III.C).'
    tags: [name:johnson-u-alexis, name:johnson-lyndon-b]
