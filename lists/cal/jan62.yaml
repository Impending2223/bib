# Cal. XV January 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XV
entries:
  - id: cal.1962-01-10.congress
    when: Jan. 10
    date: '1962-01-10'
    thread: congress
    c: The second session convenes. McCormack elected Speaker; Albert majority leader; Boggs whip.
    n: 'See [[cal.1961-11-16.congress]]. Albert, *Little Giant* (K–J Cong. II.I.2). Names: Boggs (K–J Cong. III.C).'
  - id: cal.1962-01-11.program
    when: Jan. 11
    date: '1962-01-11'
    thread: program
    c: State of the Union. Trade authority, the investment credit, Medicare, a Department of Urban Affairs, standby power to cut taxes and start public works in a downturn.
    n: Annual Message to the Congress on the State of the Union (Jan. 11, 1962).
  - id: cal.1962-01-12.vietnam
    when: Jan. 12
    date: '1962-01-12'
    thread: vietnam
    c: Operation Chopper. American H-21s carry about a thousand ARVN paratroopers into an attack west of Saigon, the first American combat support in the field. Check the numbers.
    n: Sheehan, *A Bright Shining Lie* (Viet. II.A).
  - id: cal.1962-01-13.vietnam
    when: Jan. 13
    date: '1962-01-13'
    thread: vietnam
    c: Ranch Hand's first defoliation runs along Route 15. Check the date.
    n: Spector, *Advice and Support* (Viet. II.I.3). Kennedy approved herbicide trials in November.
  - id: cal.1962-01-15.vietnam
    when: Jan. 15
    date: '1962-01-15'
    thread: vietnam
    c: Press conference. Are Americans in combat in Vietnam? "No."
    n: News Conference (Jan. 15, 1962). Mecklin, *Mission in Torment* (Viet. II.B). Hammond, *Public Affairs* (Viet. II.I.3).
  - id: cal.1962-01-17.program
    when: Jan. 17
    date: '1962-01-17'
    thread: program
    c: Executive order recognizes unions of federal employees and lets them bargain.
    n: Exec. Order No. 10,988 (K–J Adm. II.H.2).
  - id: cal.1962-01-22.economy
    when: Jan. 22
    date: '1962-01-22'
    thread: economy
    c: 'The Economic Report and the Council''s annual report: potential output and the gap, and the wage-price guideposts, productivity as the measure.'
    n: Council of Economic Advisers, Annual Report (Jan. 1962) (K–J Adm. II.H.3). Sheahan, *The Wage-Price Guideposts* (K–J Adm. II.B). Check the date of transmittal.
  - id: cal.1962-01-22.latin-america
    when: Jan. 22–31
    date: '1962-01-22'
    thread: latin-america
    also: [cuba]
    c: The OAS foreign ministers at Punta del Este. Cuba excluded from the inter-American system by exactly the two-thirds needed, with Argentina, Brazil, Mexico, and others abstaining.
    n: FRUS vol. 12. Rabe (K–J Adm. II.D). Check the vote.
  - id: cal.1962-01-23.right-and-the-military
    when: Jan. 23
    date: '1962-01-23'
    thread: right-and-the-military
    c: Stennis's subcommittee opens hearings on the "muzzling" of officers' speeches. Thurmond pushed for them. Check the date.
    n: '*Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3). Crespino, *Strom Thurmond''s America* (Opp. II.F). Names: Stennis, Thurmond (K–J Cong. III.B).'
  - id: cal.1962-01-24.program
    when: Jan. 24
    date: '1962-01-24'
    thread: program
    also: [civil-rights-the-executive]
    c: The House Rules Committee kills the Urban Affairs department bill, 9–6. Kennedy says Weaver would be its secretary, and sends a reorganization plan to force a vote.
    n: 'Pritchett, *Robert Clifton Weaver* (K–J Adm. II.G.5). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Names: Weaver (K–J Adm. III.G); Smith (K–J Cong. III.D).'
  - id: cal.1962-01-25.trade
    when: Jan. 25
    date: '1962-01-25'
    thread: trade
    c: Trade message. Five years' authority to cut tariffs by half, to zero on goods where the United States and the Common Market dominate world trade; adjustment assistance for the industries hurt.
    n: 'Special Message to the Congress on Foreign Trade Policy (Jan. 25, 1962). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). Raymond A. Bauer, Ithiel de Sola Pool & Lewis Anthony Dexter, *American Business and Public Policy: The Politics of Foreign Trade* (1963). Names: Ball (K–J Adm. III.E); Mills (K–J Cong. III.D).'
