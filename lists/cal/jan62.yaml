# Cal. XV January 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XV
entries:
  - id: cal.1962-01-10.congress
    when: Jan. 10
    date: '1962-01-10'
    thread: congress
    c: Second session convenes. McCormack Speaker; Albert majority leader; Boggs whip.
    n: '[108 Cong. Rec., House, Jan. 10, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-1-2.pdf); [108 Cong. Rec., Senate, Jan. 10, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-1-1.pdf). Albert, *Little Giant* (K–J Cong. II.I.2). See [[cal.1961-11-16.congress]]. Names: McCormack, Albert, Boggs (K–J Cong. III.C).'
    tags: [name:mccormack-john-w, name:albert-carl, name:boggs-hale]
  - id: cal.1962-01-11.program
    when: Jan. 11
    date: '1962-01-11'
    thread: program
    c: State of the Union. Trade authority, an investment credit, Medicare, an Urban Affairs department, standby power over taxes and public works.
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-4) (Jan. 11, 1962). See [[cal.1961-02-02.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-01-12.vietnam
    when: Jan. 12
    date: '1962-01-12'
    thread: vietnam
    c: Operation Chopper. American H-21s lift about a thousand ARVN paratroopers into action near Saigon.
    n: Sheehan, *A Bright Shining Lie* (Viet. II.B.10). See [[cal.1961-01-28.vietnam]].
  - id: cal.1962-01-13.vietnam
    when: Jan. 13
    date: '1962-01-13'
    thread: vietnam
    c: Ranch Hand's first defoliation runs, along Route 15.
    n: 'FRUS 1961–63, II, docs. [1](https://history.state.gov/historicaldocuments/frus1961-63v02/d1), [41](https://history.state.gov/historicaldocuments/frus1961-63v02/d41). Spector, *Advice and Support* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]].'
  - id: cal.1962-01-15.vietnam
    when: Jan. 15
    date: '1962-01-15'
    thread: vietnam
    c: Press conference. Americans in combat in Vietnam? "No."
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-174) (Jan. 15, 1962). Mecklin, *Mission in Torment* (Viet. II.G.4). Hammond, *Public Affairs* (Viet. II.I.3).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-01-17.program
    when: Jan. 17
    date: '1962-01-17'
    thread: program
    c: 'Executive order: federal employees'' unions recognized; bargaining allowed.'
    n: '[Exec. Order No. 10,988](https://www.presidency.ucsb.edu/documents/executive-order-10988-employee-management-cooperation-the-federal-service) (K–J Adm. II.H.2).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-01-22.economy
    when: Jan. 22
    date: '1962-01-22'
    thread: economy
    c: Economic Report. The Council on potential output and the gap; the wage-price guideposts; the full-employment surplus, about $10 billion, nearly 2 percent of potential GNP, for the fiscal 1960 program.
    n: 'Council of Economic Advisers, Annual Report (Jan. 1962) (K–J Adm. II.H.3): [Economic Report of the President, Jan. 1962](https://www.govinfo.gov/app/details/SERIALSET-12497_00_00-002-0278-0000). [Message to the Congress Presenting the President''s First Economic Report](https://www.presidency.ucsb.edu/documents/message-the-congress-presenting-the-presidents-first-economic-report) (Jan. 22, 1962). Sheahan, *The Wage-Price Guideposts* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-01-22.latin-america
    when: Jan. 22–31
    date: '1962-01-22'
    thread: latin-america
    also: [cuba]
    c: OAS foreign ministers at Punta del Este. Cuba excluded, 14–1; six abstain, Argentina, Brazil, and Mexico among them.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). Rabe (K–J Adm. II.D). See [[cal.1961-03-13.latin-america]]. Names: Rusk (K–J Adm. III.E).'
  - id: cal.1962-01-23.right-and-the-military
    when: Jan. 23
    date: '1962-01-23'
    thread: right-and-the-military
    c: Stennis subcommittee hearings on the "muzzling" of officers open. Thurmond's doing.
    n: '*Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3). Crespino, *Strom Thurmond''s America* (Opp. II.F). See [[cal.1961-08-02.right-and-the-military]]. Names: Stennis, Thurmond (K–J Cong. III.B).'
    tags: [name:stennis-john-c, name:thurmond-strom]
  - id: cal.1962-01-24.program
    when: Jan. 24
    date: '1962-01-24'
    thread: program
    also: [civil-rights-the-executive]
    c: House Rules Committee kills the Urban Affairs department, 9–6. Kennedy names Weaver its secretary-to-be and sends a reorganization plan.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-185) (Jan. 24, 1962). [Special Message to the Congress Transmitting Reorganization Plan 1 of 1962](https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-1-1962) (Jan. 30, 1962). Pritchett, *Robert Clifton Weaver* (K–J Adm. II.G.5). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Names: Weaver (K–J Adm. III.G); Smith (K–J Cong. III.D).'
    tags: [name:kennedy-john-f, name:weaver-robert-c]
  - id: cal.1962-01-25.trade
    when: Jan. 25
    date: '1962-01-25'
    thread: trade
    c: Trade message. Authority to halve tariffs, and to end them where the United States and the Common Market dominate; adjustment assistance.
    n: '[Special Message to the Congress on Foreign Trade Policy](https://www.presidency.ucsb.edu/documents/special-message-the-congress-foreign-trade-policy) (Jan. 25, 1962). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). Raymond A. Bauer, Ithiel de Sola Pool & Lewis Anthony Dexter, *American Business and Public Policy: The Politics of Foreign Trade* (1963). Names: Ball (K–J Adm. III.E); Mills (K–J Cong. III.D).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-01-27.specials
    when: Jan. 27
    date: '1962-01-27'
    thread: specials
    c: 'Texas 13th, special. Purcell (D) over Meissner (R), 62.9 to 37.1, for Ikard''s seat. No swing: Ikard unopposed in 1960.'
    n: '[108 Cong. Rec., House, Jan. 29, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt1/pdf/GPO-CRECB-1962-pt1-12-2.pdf) (Purcell sworn). Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1962-01-27-h-TX-13, name:purcell-graham-b-jr, name:ikard-frank-n, name:meissner-joe]
  - id: cal.1962-01-30.specials
    when: Jan. 30
    date: '1962-01-30'
    thread: specials
    c: 'Texas 4th, special. Ray Roberts (D) to Rayburn''s seat over Slagle (D), 54.3 percent. No swing: Rayburn unopposed in 1960.'
    n: '[108 Cong. Rec., House, Feb. 5, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt2/pdf/GPO-CRECB-1962-pt2-2-1.pdf) (Roberts sworn). Shares: Wikipedia; they add to 101.0. Check. See [[cal.1961-04-04.states-and-cities]], [[cal.1961-11-16.congress]]. Names: Rayburn (K–J Cong. III.C).'
    tags: [special:1962-01-30-h-TX-4, name:rayburn-sam, name:roberts-herbert-r, name:slagle-r-c]
