# Cal. XV January 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XV
entries:
  - id: cal.1962-01-10.congress
    when: Jan. 10
    date: '1962-01-10'
    thread: congress
    c: Second session convenes. McCormack Speaker; Albert majority leader; Boggs whip.
    n: 'Albert, *Little Giant* (K–J Cong. II.I.2). See [[cal.1961-11-16.congress]]. Names: McCormack, Albert, Boggs (K–J Cong. III.C).'
  - id: cal.1962-01-11.program
    when: Jan. 11
    date: '1962-01-11'
    thread: program
    c: State of the Union. Trade authority, an investment credit, Medicare, an Urban Affairs department, standby power over taxes and public works.
    n: Annual Message to the Congress on the State of the Union (Jan. 11, 1962). See [[cal.1961-02-02.program]].
  - id: cal.1962-01-12.vietnam
    when: Jan. 12
    date: '1962-01-12'
    thread: vietnam
    c: Operation Chopper. American H-21s lift about a thousand ARVN paratroopers into action near Saigon. Check the numbers.
    n: Sheehan, *A Bright Shining Lie* (Viet. II.A). See [[cal.1961-01-28.vietnam]].
  - id: cal.1962-01-13.vietnam
    when: Jan. 13
    date: '1962-01-13'
    thread: vietnam
    c: Ranch Hand's first defoliation runs, along Route 15. Check the date.
    n: Spector, *Advice and Support* (Viet. II.I.3). See [[cal.1961-01-28.vietnam]].
  - id: cal.1962-01-15.vietnam
    when: Jan. 15
    date: '1962-01-15'
    thread: vietnam
    c: Press conference. Americans in combat in Vietnam? "No."
    n: News Conference (Jan. 15, 1962). Mecklin, *Mission in Torment* (Viet. II.B). Hammond, *Public Affairs* (Viet. II.I.3).
  - id: cal.1962-01-17.program
    when: Jan. 17
    date: '1962-01-17'
    thread: program
    c: 'Executive order: federal employees'' unions recognized; bargaining allowed.'
    n: Exec. Order No. 10,988 (K–J Adm. II.H.2).
  - id: cal.1962-01-22.economy
    when: Jan. 22
    date: '1962-01-22'
    thread: economy
    c: Economic Report. The Council on potential output and the gap; the wage-price guideposts. Check the date.
    n: 'Council of Economic Advisers, Annual Report (Jan. 1962) (K–J Adm. II.H.3). Sheahan, *The Wage-Price Guideposts* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Heller (K–J Adm. III.H).'
  - id: cal.1962-01-22.latin-america
    when: Jan. 22–31
    date: '1962-01-22'
    thread: latin-america
    also: [cuba]
    c: OAS foreign ministers at Punta del Este. Cuba excluded, 14–1; six abstain, Argentina, Brazil, and Mexico among them. Check.
    n: 'FRUS vol. 12. Rabe (K–J Adm. II.D). See [[cal.1961-03-13.latin-america]]. Names: Rusk (K–J Adm. III.E).'
  - id: cal.1962-01-23.right-and-the-military
    when: Jan. 23
    date: '1962-01-23'
    thread: right-and-the-military
    c: Stennis subcommittee hearings on the "muzzling" of officers open. Thurmond's doing. Check the date.
    n: '*Military Cold War Education and Speech Review Policies* (K–J Cong. II.J.3). Crespino, *Strom Thurmond''s America* (Opp. II.F). See [[cal.1961-08-02.right-and-the-military]]. Names: Stennis, Thurmond (K–J Cong. III.B).'
  - id: cal.1962-01-24.program
    when: Jan. 24
    date: '1962-01-24'
    thread: program
    also: [civil-rights-the-executive]
    c: House Rules Committee kills the Urban Affairs department, 9–6. Kennedy names Weaver its secretary-to-be and sends a reorganization plan.
    n: 'Pritchett, *Robert Clifton Weaver* (K–J Adm. II.G.5). Gelfand, *A Nation of Cities* (K–J Cong. II.B). Names: Weaver (K–J Adm. III.G); Smith (K–J Cong. III.D).'
  - id: cal.1962-01-25.trade
    when: Jan. 25
    date: '1962-01-25'
    thread: trade
    c: Trade message. Authority to halve tariffs, and to end them where the United States and the Common Market dominate; adjustment assistance.
    n: 'Special Message to the Congress on Foreign Trade Policy (Jan. 25, 1962). Zeiler, *American Trade and Power in the 1960s* (K–J Adm. II.B). Raymond A. Bauer, Ithiel de Sola Pool & Lewis Anthony Dexter, *American Business and Public Policy: The Politics of Foreign Trade* (1963). Names: Ball (K–J Adm. III.E); Mills (K–J Cong. III.D).'
