# Cal. XXI July 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXI
entries:
  - id: cal.1962-07-04.europe-and-the-alliance
    when: July 4
    date: '1962-07-04'
    thread: europe-and-the-alliance
    c: Independence Hall. A "Declaration of Interdependence" with a uniting Europe.
    n: Address at Independence Hall, Philadelphia (July 4, 1962). See [[cal.1961-12-21.europe-and-the-alliance]].
  - id: cal.1962-07-09.testing
    when: July 9
    date: '1962-07-09'
    thread: testing
    c: 'Starfish Prime: 1.4 megatons, 250 miles over Johnston Island. Artificial aurora; satellites damaged; streetlights out in Hawaii. Check.'
    n: See [[cal.1962-04-25.testing]].
  - id: cal.1962-07-10.space
    when: July 10
    date: '1962-07-10'
    thread: space
    c: 'Telstar launched. July 23: first live transatlantic television, Kennedy''s press conference among it. Check.'
    n: See [[cal.1961-04-12.space]]; [[cal.1962-08-14.rules]].
  - id: cal.1962-07-10.albany
    when: July 10–12
    date: '1962-07-10'
    thread: albany
    c: King and Abernathy choose jail over fines. Out July 12, the fines paid by an unnamed hand.
    n: 'Abernathy, *And the Walls Came Tumbling Down* (K–J Cong. II.I.4). See [[cal.1961-11-17.albany]]. Names: King (K–J Cong. III.H).'
  - id: cal.1962-07-11.economy
    when: July 11
    date: '1962-07-11'
    thread: economy
    c: Treasury's new depreciation guidelines. Faster write-offs, by ruling.
    n: 'Rev. Proc. 62-21. Check. Heller, *New Dimensions of Political Economy* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Dillon (K–J Adm. III.H).'
  - id: cal.1962-07-15.program
    when: July 15
    date: '1962-07-15'
    thread: program
    c: '*Washington Post* (Mintz): Kelsey of the FDA kept thalidomide off the market. Kefauver''s drug bill revives.'
    n: 'Richard Harris, *The Real Voice* (1964). See [[cal.1961-02-02.program]]. Names: Kefauver (K–J Cong. III.B).'
  - id: cal.1962-07-17.medicare
    when: July 17
    date: '1962-07-17'
    thread: medicare
    c: Senate tables the Anderson–Javits amendment, 52–48. Randolph with the opponents. Check. Kennedy on television that night.
    n: 'Medicare (King–Anderson) (K–J Cong. II.J.2). See [[cal.1961-02-09.medicare]]. Names: Anderson, Kerr (K–J Cong. III.B); Javits (K–J Cong. III.E).'
  - id: cal.1962-07-18.latin-america
    when: July 18
    date: '1962-07-18'
    thread: latin-america
    c: Peru's army takes power after a disputed election. Relations and aid suspended; restored in August. Check.
    n: Rabe (K–J Adm. II.D). See [[cal.1961-03-13.latin-america]].
  - id: cal.1962-07-20.albany
    when: July 20–24
    date: '1962-07-20'
    thread: albany
    c: 'Elliott enjoins the marches; Tuttle vacates the order. Marion King beaten at the Camilla jail. July 24: rocks and bottles. King calls a day of penance.'
    n: 'See [[cal.1961-11-17.albany]]. Names: Tuttle (K–J Cong. III.G); King (K–J Cong. III.H).'
  - id: cal.1962-07-23.laos
    when: July 23
    date: '1962-07-23'
    thread: laos
    c: Geneva. Declaration on the Neutrality of Laos; fourteen signatories.
    n: 'Declaration on the Neutrality of Laos (Viet. II.I.2). Abramson, *Spanning the Century* (K–J Adm. II.G.4). See [[cal.1961-03-23.laos]]. Names: Harriman (K–J Adm. III.E).'
  - id: cal.1962-07-23.vietnam
    when: July 23
    date: '1962-07-23'
    thread: vietnam
    c: Honolulu. McNamara orders plans for the advisers' withdrawal by the end of 1965. Check.
    n: 'FRUS vol. 2. Newman, *JFK and Vietnam*; Kaiser, *American Tragedy* (Viet. II.B.8). See [[cal.1961-01-28.vietnam]]. Names: McNamara (Viet. III.A); Harkins (Viet. III.D).'
  - id: cal.1962-07-25.program
    when: July 25
    date: '1962-07-25'
    thread: program
    c: Public Welfare Amendments signed. Services and rehabilitation for families on relief. Ribicoff out of HEW to run for the Senate; Celebrezze in.
    n: 'Pub. L. No. 87-543, 76 Stat. 172 (1962). Davies, *From Opportunity to Entitlement* (K–J Adm. II.B). Names: Ribicoff, Celebrezze (K–J Adm. III.G).'
  - id: cal.1962-07-27.albany
    when: July 27
    date: '1962-07-27'
    thread: albany
    c: King arrested at a City Hall prayer vigil.
    n: See [[cal.1961-11-17.albany]].
  - id: cal.1962-07.missile-crisis
    when: July
    date: 1962-07
    thread: missile-crisis
    c: Raúl Castro in Moscow. Defense agreement initialed. Soviet shipping to Cuba begins. Check the dates.
    n: See [[cal.1962-05-24.missile-crisis]].
