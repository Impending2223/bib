# Cal. XXI July 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXI
entries:
  - id: cal.1962-07-01.opinion
    when: July 1
    date: '1962-07-01'
    thread: opinion
    also: [medicare]
    c: 'Gallup, May 31–June 5: hospital care for the aged through Social Security, 48 percent; voluntary private insurance, 41. Republicans 59 for private insurance.'
    n: '*The Gallup Poll*, III, 1774 (K–J Cong. II.E).'
  - id: cal.1962-07-04.europe-and-the-alliance
    when: July 4
    date: '1962-07-04'
    thread: europe-and-the-alliance
    c: Independence Hall. A "Declaration of Interdependence" with a uniting Europe.
    n: '[Address at Independence Hall, Philadelphia](https://www.presidency.ucsb.edu/documents/address-independence-hall-philadelphia) (July 4, 1962). See [[cal.1961-12-21.europe-and-the-alliance]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-09.testing
    when: July 9
    date: '1962-07-09'
    thread: testing
    c: 'Starfish Prime: 1.4 megatons, 250 miles over Johnston Island. Artificial aurora; satellites damaged; streetlights out in Hawaii.'
    n: See [[cal.1962-04-25.testing]].
  - id: cal.1962-07-10.space
    when: July 10
    date: '1962-07-10'
    thread: space
    c: 'Telstar launched. July 23: first live transatlantic television, Kennedy''s press conference among it.'
    n: '[Statement by the President on the Telstar Communications Satellite](https://www.presidency.ucsb.edu/documents/statement-the-president-the-telstar-communications-satellite) (July 11, 1962); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-180) (July 23, 1962). The satellite bill: [[cal.1962-08-14.rules]]. See [[cal.1961-04-12.space]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-10.albany
    when: July 10–12
    date: '1962-07-10'
    thread: albany
    also: [king]
    c: King and Abernathy choose jail over fines. Out July 12, the fines paid by an unnamed hand.
    n: 'Abernathy, *And the Walls Came Tumbling Down* (K–J Cong. II.I.4). See [[cal.1961-11-17.albany]]. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david]
  - id: cal.1962-07-11.economy
    when: July 12
    date: '1962-07-12'
    thread: economy
    c: Treasury's new depreciation guidelines. Faster write-offs, by ruling.
    n: '[Statement by the President on the New Tax Depreciation Schedules](https://www.presidency.ucsb.edu/documents/statement-the-president-the-new-tax-depreciation-schedules) (July 12, 1962). Rev. Proc. 62-21. Heller, *New Dimensions of Political Economy* (K–J Adm. II.B). See [[cal.1961-01-05.economy]]. Names: Dillon (K–J Adm. III.H).'
  - id: cal.1962-07-12.confirmations
    when: July 12
    date: '1962-07-12'
    thread: confirmations
    c: Matthew McCloskey, the Democrats' treasurer, to Ireland. Williams of Delaware's motion to recommit fails, [30–62](https://voteview.com/rollcall/RS0870294); confirmed.
    n: '[108 Cong. Rec., Senate, July 12, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt10/pdf/GPO-CRECB-1962-pt10-4-1.pdf). See [[cal.1961-03-07.confirmations]]. Names: Williams (Opp. III.B).'
    tags: [name:mccloskey-matthew-h-jr, name:williams-john-j]
  - id: cal.1962-07-15.program
    when: July 15
    date: '1962-07-15'
    thread: health
    c: '*Washington Post* (Mintz): Kelsey of the FDA kept thalidomide off the market. Kefauver''s drug bill revives.'
    n: 'Richard Harris, *The Real Voice* (1964). Daniel Carpenter, *Reputation and Power: Organizational Image and Pharmaceutical Regulation at the FDA* (2010). Names: Kefauver (K–J Cong. III.B).'
    tags: [name:kelsey-frances-o, name:kefauver-estes, name:mintz-morton]
  - id: cal.1962-07-15.opinion-5
    when: July 15
    date: '1962-07-15'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, May 31–June 5: Republicans'' choice for 1964: Nixon 45, other 55. Nixon''s supporters'' second choices redistributed: Rockefeller 31, Goldwater 21, Romney 15, Milton Eisenhower 12, Dirksen 5; other, no preference 16.'
    n: '*The Gallup Poll*, III, 1776 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Rockefeller, Romney (Opp. III.H); Goldwater (Opp. III.B); Dirksen (Opp. III.A).'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:eisenhower-milton-s, name:dirksen-everett]
  - id: cal.1962-07-17.medicare
    when: July 17
    date: '1962-07-17'
    thread: medicare
    c: Senate tables the Anderson–Javits amendment, [52–48](https://voteview.com/rollcall/RS0870297). Randolph with the opponents. Kennedy on television that night.
    n: 'Medicare (King–Anderson) (K–J Cong. II.J.2). See [[cal.1961-02-09.medicare]]. Names: Anderson, Kerr (K–J Cong. III.B); Javits (K–J Cong. III.E).'
    tags: [name:anderson-clinton-p, name:javits-jacob-k, name:randolph-jennings, name:kennedy-john-f]
  - id: cal.1962-07-18.latin-america
    when: July 18
    date: '1962-07-18'
    thread: latin-america
    c: Peru's army takes power after a disputed election. Relations and aid suspended; restored in August.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12), docs. [420](https://history.state.gov/historicaldocuments/frus1961-63v12/d420), [426](https://history.state.gov/historicaldocuments/frus1961-63v12/d426). Rabe (K–J Adm. II.D). See [[cal.1961-03-13.latin-america]].'
  - id: cal.1962-07-20.albany
    when: July 20–24
    date: '1962-07-20'
    thread: albany
    c: 'Elliott enjoins the marches; Tuttle vacates the order. Marion King beaten at the Camilla jail. July 24: rocks and bottles. King calls a day of penance.'
    n: 'See [[cal.1961-11-17.albany]]. Names: Tuttle (K–J Cong. III.G); King (K–J Cong. III.H).'
    tags: [name:tuttle-elbert-p, name:king-martin-luther-jr, name:elliott-j-robert, name:king-marion]
  - id: cal.1962-07-23.laos
    when: July 23
    date: '1962-07-23'
    thread: laos
    c: Geneva. Declaration on the Neutrality of Laos; fourteen signatories.
    n: '[Statement by the President on the Signing of Agreements To End the Conflict in Laos](https://www.presidency.ucsb.edu/documents/statement-the-president-the-signing-agreements-end-the-conflict-laos) (July 23, 1962). [FRUS 1961–63, XXIV, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v24/d411). Declaration on the Neutrality of Laos (Viet. II.I.2). Abramson, *Spanning the Century* (K–J Adm. II.G.4). See [[cal.1961-03-23.laos]]. Names: Harriman (K–J Adm. III.E).'
  - id: cal.1962-07-23.vietnam
    when: July 23
    date: '1962-07-23'
    thread: vietnam
    c: Honolulu. McNamara orders plans for the advisers' withdrawal by the end of 1965.
    n: '[FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02), doc. [248](https://history.state.gov/historicaldocuments/frus1961-63v02/d248). Newman, *JFK and Vietnam*; Kaiser, *American Tragedy* (Viet. II.B.8). See [[cal.1961-01-28.vietnam]]. Names: McNamara (Viet. III.A); Harkins (Viet. III.D).'
    tags: [name:mcnamara-robert-s]
  - id: cal.1962-07-25.program
    when: July 25
    date: '1962-07-25'
    thread: welfare
    c: Public Welfare Amendments signed, [76 Stat. 172](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg172.pdf). Services and rehabilitation for families on relief. Ribicoff out of HEW to run for the Senate; Celebrezze in.
    n: 'Davies, *From Opportunity to Entitlement* (K–J Adm. II.B). Names: Ribicoff, Celebrezze (K–J Adm. III.G).'
    tags: [name:ribicoff-abraham, name:celebrezze-anthony-j, name:kennedy-john-f]
  - id: cal.1962-07-27.albany
    when: July 27
    date: '1962-07-27'
    thread: albany
    also: [king]
    c: King arrested at a City Hall prayer vigil.
    n: See [[cal.1961-11-17.albany]].
    tags: [name:king-martin-luther-jr]
  - id: cal.1962-07.missile-crisis
    when: July
    date: 1962-07
    thread: missile-crisis
    c: Raúl Castro in Moscow. Defense agreement initialed. Soviet shipping to Cuba begins. Check the initialing.
    n: '[FRUS 1961–63, X, doc. 383](https://history.state.gov/historicaldocuments/frus1961-63v10/d383). See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:castro-raul]
