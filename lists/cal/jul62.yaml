    c: 'Arkansas, Democratic primary for governor: Faubus 208,996, 51.6 percent, a fifth nomination without a runoff; McMath, governor 1949–53, 83,473, 20.6; Dale Alford, a Representative, 82,815, 20.4; three others.'
    n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 412](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). [[w.reed-faubus]]. Names: Faubus, McMath (K–J Cong. III.F); Alford (K–J Cong. III.K).'
