# Cal. XXI July 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXI
entries:
  - id: cal.1962-07-04.europe-and-the-alliance
    when: July 4
    date: '1962-07-04'
    thread: europe-and-the-alliance
    c: 'Independence Hall: a "Declaration of Interdependence" between the United States and a uniting Europe. The Grand Design, in a sentence.'
    n: Address at Independence Hall, Philadelphia (July 4, 1962). See [[cal.1961-12-21.europe-and-the-alliance]].
  - id: cal.1962-07-09.testing
    when: July 9
    date: '1962-07-09'
    thread: testing
    c: Starfish Prime, a 1.4-megaton burst 250 miles over Johnston Island. An artificial aurora; satellites crippled; streetlights out in Hawaii.
    n: See [[cal.1962-04-25.testing]]. Check.
  - id: cal.1962-07-10.space
    when: July 10
    date: '1962-07-10'
    thread: space
    c: AT&T's Telstar launched. On the 23rd the first live television across the Atlantic, part of a Kennedy press conference among the pictures.
    n: See [[cal.1962-08-14.rules]] for the satellite corporation. Check.
  - id: cal.1962-07-10.albany
    when: July 10–12
    date: '1962-07-10'
    thread: albany
    c: King and Abernathy, sentenced for the December march, choose jail over fines. On the 12th they are put out; someone has paid. Chief Pritchett's tactics, nonviolent arrests and no scenes, work.
    n: See [[cal.1961-11-17.albany]]. Abernathy, *And the Walls Came Tumbling Down* (K–J Cong. II.I.4).
  - id: cal.1962-07-11.economy
    when: July 11
    date: '1962-07-11'
    thread: economy
    c: The Treasury's new depreciation guidelines. Faster write-offs for business, by ruling, without Congress.
    n: 'Rev. Proc. 62-21. Check. Heller, *New Dimensions of Political Economy* (K–J Adm. II.B). Names: Dillon (K–J Adm. III.H).'
  - id: cal.1962-07-15.program
    when: July 15
    date: '1962-07-15'
    thread: program
    c: The *Washington Post* (Morton Mintz) tells how Frances Kelsey of the FDA kept thalidomide off the American market. Kefauver's stalled drug bill revives.
    n: 'Richard Harris, *The Real Voice* (1964). Names: Kefauver (K–J Cong. III.B).'
  - id: cal.1962-07-17.medicare
    when: July 17
    date: '1962-07-17'
    thread: medicare
    c: The Senate tables the Anderson–Javits Medicare amendment to the welfare bill, 52–48. Randolph of West Virginia votes with the opponents. Check. Kennedy on television that night.
    n: 'Medicare (King–Anderson) (K–J Cong. II.J.2). See [[cal.1961-02-09.medicare]]. Names: Anderson, Kerr (K–J Cong. III.B); Javits (K–J Cong. III.E).'
  - id: cal.1962-07-18.latin-america
    when: July 18
    date: '1962-07-18'
    thread: latin-america
    c: The Peruvian army takes power after a disputed election. Washington suspends relations and aid, then restores them in August.
    n: Rabe (K–J Adm. II.D). Check.
  - id: cal.1962-07-20.albany
    when: July 20–24
    date: '1962-07-20'
    thread: albany
    c: Judge Elliott enjoins the marches; Judge Tuttle sets the order aside. Marion King, pregnant, beaten by a deputy at the Camilla jail; on the 24th a crowd answers with bottles and rocks. King calls a day of penance.
    n: 'See [[cal.1961-11-17.albany]]. Names: Tuttle (K–J Cong. III.G).'
  - id: cal.1962-07-23.laos
    when: July 23
    date: '1962-07-23'
    thread: laos
    c: Geneva. The Declaration on the Neutrality of Laos signed by fourteen nations.
    n: 'Declaration on the Neutrality of Laos (Viet. II.I.2). Abramson, *Spanning the Century* (K–J Adm. II.G.4). Names: Harriman (K–J Adm. III.E).'
  - id: cal.1962-07-23.vietnam
    when: July 23
    date: '1962-07-23'
    thread: vietnam
    c: Honolulu. McNamara tells the commanders to plan for the advisory effort to end, and the Americans to leave, by the end of 1965.
    n: FRUS vol. 2. Newman, *JFK and Vietnam*; Kaiser, *American Tragedy* (Viet. II.B). Check.
  - id: cal.1962-07-25.program
    when: July 25
    date: '1962-07-25'
    thread: program
    c: Public Welfare Amendments signed. Services and rehabilitation for families on relief. Ribicoff, who wrote them, leaves HEW to run for the Senate; Celebrezze succeeds.
    n: 'Pub. L. No. 87-543, 76 Stat. 172 (1962). Check. Davies, *From Opportunity to Entitlement* (K–J Adm. II.B). Names: Ribicoff, Celebrezze (K–J Adm. III.G).'
  - id: cal.1962-07-27.albany
    when: July 27
    date: '1962-07-27'
    thread: albany
    c: King arrested again at a prayer vigil at City Hall. Check.
    n: See [[cal.1961-11-17.albany]].
  - id: cal.1962-07.missile-crisis
    when: July
    date: 1962-07
    thread: missile-crisis
    c: Raúl Castro in Moscow. The defense agreement initialed. Soviet ships begin the run to Cuba. Check the dates.
    n: See [[cal.1962-05-24.missile-crisis]].
