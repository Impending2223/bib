entries:
  - id: cal.1962-07-01.opinion
    when: July 1
    date: '1962-07-01'
    thread: opinion
    also: [medicare]
    c: 'Gallup, May 31–June 5: hospital care for the aged through Social Security, 48 percent; voluntary private insurance, 41. Republicans 59 for private insurance.'
    n: '[[w.gallup-poll]], III, 1774.'
  - id: cal.1962-07-03.states-and-cities-us
    when: July 3
    date: '1962-07-03'
    thread: states-and-cities
    c: Governors' Conference at Hershey, Pa. The Resolutions Committee's civil rights resolution, reaffirming that of 1961; amendments by Rockefeller, Hatfield and Swainson of Michigan for a pledge of action. Hollings and others hold the floor into the evening. On Lawrence's proposal, each governor to sign the text he supports, the resolution and amendments set aside, 32–8. July 4, Kennedy to the governors at Independence Hall.
    n: '[*Proceedings of the Governors'' Conference, 1962*, 68–94](https://www.nga.org/wp-content/uploads/2026/03/1962_Annual_Meeting-compressed.pdf#page=83). [[w.black-southern-governors-and-civil]]. See [[cal.1961-06-25.states-and-cities-us]]. Names: Rockefeller (Opp. III.H); Hatfield (Opp. III.B); Swainson, Hollings, Lawrence (K–J Cong. III.F); Kennedy (Viet. III.A).'
    tags: [name:rockefeller-nelson, name:hatfield-mark-o, name:hollings-ernest-f, name:lawrence-david-l, name:kennedy-john-f, name:swainson-john-b]
  - id: cal.1962-07-03.africa
    when: July 3
    date: '1962-07-03'
    thread: africa
    c: 'Algeria independent: France recognizes it after the referendum of July 1. Kennedy''s statement.'
    n: '[Statement by the President on the Occasion of Algerian Independence](https://www.presidency.ucsb.edu/documents/statement-the-president-the-occasion-algerian-independence) (July 3, 1962). See [[cal.1962-03-18.africa]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-04.europe-and-the-alliance
    when: July 4
    date: '1962-07-04'
    thread: europe-and-the-alliance
    c: Independence Hall. A "Declaration of Interdependence" with a uniting Europe.
    n: '[Address at Independence Hall, Philadelphia](https://www.presidency.ucsb.edu/documents/address-independence-hall-philadelphia) (July 4, 1962). See [[cal.1961-12-21.europe-and-the-alliance]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-09.testing
    when: July 9
    date: '1962-07-09'
    thread: testing
    c: 'Starfish Prime: 1.4 megatons, 250 miles over Johnston Island. Artificial aurora; satellites damaged; streetlights out in Hawaii.'
    n: See [[cal.1962-04-25.testing]].
  - id: cal.1962-07-10.space
    when: July 10
    date: '1962-07-10'
    thread: space
    c: 'Telstar launched. July 23: first live transatlantic television, Kennedy''s press conference among it.'
    n: '[Statement by the President on the Telstar Communications Satellite](https://www.presidency.ucsb.edu/documents/statement-the-president-the-telstar-communications-satellite) (July 11, 1962); [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-180) (July 23, 1962). The satellite bill: [[cal.1962-08-14.rules]]. See [[cal.1961-04-12.space]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-07-10.albany
    when: July 10–12
    date: '1962-07-10'
    thread: georgia
    also: [king]
    c: King and Abernathy choose jail over fines. Out July 12, the fines paid by an unnamed hand.
    n: '[[w.abernathy-and-the-walls-came]]. See [[cal.1961-11-17.albany]]. Names: King, Abernathy (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david]
  - id: cal.1962-07-11.economy
    when: July 12
    date: '1962-07-12'
    thread: economy
    c: Treasury's new depreciation guidelines. Faster write-offs, by ruling.
    n: '[Statement by the President on the New Tax Depreciation Schedules](https://www.presidency.ucsb.edu/documents/statement-the-president-the-new-tax-depreciation-schedules) (July 12, 1962). Rev. Proc. 62-21. [[w.heller-new-dimensions-of-political]]. See [[cal.1961-01-05.economy]]. Names: Dillon (K–J Adm. III.H).'
  - id: cal.1962-07-12.confirmations
    when: July 12
    date: '1962-07-12'
    thread: confirmations
    c: Matthew McCloskey, the Democrats' treasurer, to Ireland. Williams of Delaware's motion to recommit fails, [30–62](https://voteview.com/rollcall/RS0870294); confirmed.
    n: '[108 Cong. Rec., Senate, July 12, 1962](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt10/pdf/GPO-CRECB-1962-pt10-4-1.pdf). See [[cal.1961-03-07.confirmations]]. Names: McCloskey (K–J Cong. III.K); Williams (Opp. III.B).'
    tags: [name:mccloskey-matthew-h-jr, name:williams-john-j]
  - id: cal.1962-07-12.alabama-al
    when: July 12
    date: '1962-07-12'
    thread: alabama
    also: [legislatures, state-constitutions]
    c: 'The legislature, in extraordinary session, four days before the federal court''s hearing in *Sims v. Frink*: the "67-Senator Amendment," a senator for each county, proposed for the November ballot; and the Crawford-Webb Act, a second plan should the amendment fail. The legislature last apportioned on the 1900 census.'
    n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [360](https://archive.org/details/alabama-official-statistical-register-1963/page/n359). *Sims v. Frink*, [205 F. Supp. 245](https://static.case.law/f-supp/205/html/0245-01.html) (M.D. Ala. 1962) (the hearing set, Apr. 14). [[w.cortner-apportionment-cases]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
    tags: [state:al]
  - id: cal.1962-07-14.transition-and-staff-cleveland
    when: July 14–31
    date: '1962-07-14'
    thread: transition-and-staff
    also: [mayors]
    c: Kennedy names Celebrezze, mayor of Cleveland since 1953, Secretary of HEW, July 14, Ribicoff leaving to run for the Senate in Connecticut. Nominated July 16; confirmed July 20; sworn July 31. Locher, the city's law director, mayor.
    n: '[Letter Accepting Resignation of Abraham Ribicoff as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-abraham-ribicoff-secretary-health-education-and-welfare) (July 13, 1962); [Remarks at the Swearing In of Anthony J. Celebrezze as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-anthony-j-celebrezze-secretary-health-education-and-welfare) (July 31, 1962). [[w.peirce-great-lakes-states-of]]. Names: Celebrezze, Ribicoff (K–J Adm. III.G); Locher (K–J Cong. III.K).'
    tags: [state:oh, city:cleveland, name:kennedy-john-f, name:celebrezze-anthony-j, name:ribicoff-abraham, name:locher-ralph-s]
  - id: cal.1962-07-15.program
    when: July 15
    date: '1962-07-15'
    thread: health
    c: '*Washington Post* (Mintz): Kelsey of the FDA kept thalidomide off the market. Kefauver''s drug bill revives.'
    n: '[[w.harris-real-voice]]; [[w.carpenter-reputation-and-power]]. Names: Mintz (K–J Cong. III.J); Kelsey (K–J Cong. III.K); Kefauver (K–J Cong. III.B).'
    tags: [name:kelsey-frances-o, name:kefauver-estes, name:mintz-morton]
  - id: cal.1962-07-15.opinion-5
    when: July 15
    date: '1962-07-15'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, May 31–June 5: Republicans'' choice for 1964: Nixon 45, other 55. Nixon''s supporters'' second choices redistributed: Rockefeller 31, Goldwater 21, Romney 15, Milton Eisenhower 12, Dirksen 5; other, no preference 16.'
    n: '[[w.gallup-poll]], III, 1776. Names: Nixon, Milton Eisenhower (Opp. III.E); Rockefeller, Romney (Opp. III.H); Goldwater (Opp. III.B); Dirksen (Opp. III.A).'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m, name:romney-george-w, name:eisenhower-milton-s, name:dirksen-everett]
  - id: cal.1962-07-17.medicare
    when: July 17
    date: '1962-07-17'
    thread: medicare
    c: Senate tables the Anderson–Javits amendment, [52–48](https://voteview.com/rollcall/RS0870297). Randolph with the opponents. Kennedy on television that night.
    n: 'Medicare (King–Anderson) (K–J Cong. II.J.2). See [[cal.1961-02-09.medicare]]. Names: Anderson, Kerr, Randolph (K–J Cong. III.B); Javits (K–J Cong. III.E).'
    tags: [name:anderson-clinton-p, name:javits-jacob-k, name:randolph-jennings, name:kennedy-john-f]
  - id: cal.1962-07-18.latin-america
    when: July 18
    date: '1962-07-18'
    thread: latin-america
    c: Peru's army takes power after a disputed election. Relations and aid suspended; restored in August.
    n: '[FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12), docs. [420](https://history.state.gov/historicaldocuments/frus1961-63v12/d420), [426](https://history.state.gov/historicaldocuments/frus1961-63v12/d426). [[w.rabe-most-dangerous-area-in]]. See [[cal.1961-03-13.latin-america]].'
  - id: cal.1962-07-18.legislatures-mi
    when: July 18
    date: '1962-07-18'
    thread: legislatures
    also: [court]
    c: 'Michigan Supreme Court, *Scholle v. Secretary of State*, on remand after *Baker v. Carr*: the State Senate''s districts of 1952, from 55,806 people in the Upper Peninsula to 690,583 in Oakland County, void under the Equal Protection Clause; the Aug. 7 primary for the Senate called off, new districts ordered. July 27, Stewart stays the order until the Supreme Court can hear it.'
    n: '*Scholle v. Secretary of State*, 367 Mich. 176 (1962) (Check the cite). [Wikipedia, "1962 in Michigan"](https://en.wikipedia.org/wiki/1962_in_Michigan). [[w.politics-of-reapportionment]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Stewart (K–J Cong. III.G).'
    tags: [state:mi, name:stewart-potter]
  - id: cal.1962-07-20.albany
    when: July 20–24
    date: '1962-07-20'
    thread: georgia
    c: 'Elliott enjoins the marches; Tuttle vacates the order. Marion King beaten at the Camilla jail. July 24: rocks and bottles. King calls a day of penance.'
    n: 'See [[cal.1961-11-17.albany]]. Names: Elliott, Tuttle (K–J Cong. III.G); Marion King, Martin Luther King (K–J Cong. III.H).'
    tags: [name:tuttle-elbert-p, name:king-martin-luther-jr, name:elliott-j-robert, name:king-marion]
  - id: cal.1962-07-21.alabama-al
    when: July 21
    date: '1962-07-21'
    thread: alabama
    also: [legislatures, court]
    c: '*Sims v. Frink*. A three-judge court, Judge Johnson sitting: neither the 67-Senator Amendment nor the Crawford-Webb Act meets the equal protection clause. For the November election, its own provisional plan, drawn from parts of both: Jefferson County 17 representatives, Mobile 8, Montgomery 4; 35 senatorial districts, Jefferson and Mobile one each. Decree filed July 25.'
    n: '*Sims v. Frink*, [208 F. Supp. 431](https://static.case.law/f-supp/208/html/0431-01.html) (M.D. Ala. 1962); the decree, *Alabama Official and Statistical Register, 1963*, [360](https://archive.org/details/alabama-official-statistical-register-1963/page/n359)–361. Affirmed: [[cal.1964-06-15.court]]. See [[cal.1962-07-12.alabama-al]]. Names: Johnson (K–J Cong. III.G).'
    tags: [state:al, city:birmingham, city:mobile, city:montgomery, name:johnson-frank-m-jr]
  - id: cal.1962-07-23.laos
    when: July 23
    date: '1962-07-23'
    thread: laos
    c: Geneva. Declaration on the Neutrality of Laos; fourteen signatories.
    n: '[Statement by the President on the Signing of Agreements To End the Conflict in Laos](https://www.presidency.ucsb.edu/documents/statement-the-president-the-signing-agreements-end-the-conflict-laos) (July 23, 1962). [FRUS 1961–63, XXIV, doc. 411](https://history.state.gov/historicaldocuments/frus1961-63v24/d411). Declaration on the Neutrality of Laos (Viet. II.I.2). [[w.abramson-spanning-the-century]]. See [[cal.1961-03-23.laos]]. Names: Harriman (K–J Adm. III.E).'
  - id: cal.1962-07-23.vietnam
    when: July 23
    date: '1962-07-23'
    thread: vietnam
    c: Honolulu. McNamara orders plans for the advisers' withdrawal by the end of 1965.
    n: '[FRUS vol. 2](https://history.state.gov/historicaldocuments/frus1961-63v02), doc. [248](https://history.state.gov/historicaldocuments/frus1961-63v02/d248). [[w.newman-jfk-and-vietnam]]; [[w.kaiser-american-tragedy]]. See [[cal.1961-01-28.vietnam]]. Names: McNamara (Viet. III.A); Harkins (Viet. III.D).'
    tags: [name:mcnamara-robert-s]
  - id: cal.1962-07-23.legislatures-fl
    when: July 23
    date: '1962-07-23'
    thread: legislatures
    also: [court]
    c: '*Sobel v. Adams*, Miami. A three-judge court holds Florida''s apportionment invidiously discriminatory: each of Dade County''s three representatives stands for 311,000 people, Gilchrist County''s for 2,868. Bryant calls a special session, July 24; it meets Aug. 1 and proposes an apportionment amendment for November. Sept. 5, the court finds the amendment a rational plan.'
    n: '*Sobel v. Adams*, [208 F. Supp. 316](https://static.case.law/f-supp/208/html/0316-01.html) (S.D. Fla. 1962). [[w.ansolabehere-end-of-inequality-2008]]; [[w.smith-on-democracys-doorstep-2014]]. See [[cal.1962-03-26.court]]. Names: Bryant (K–J Cong. III.F).'
    tags: [name:bryant-farris, state:fl, city:miami]
  - id: cal.1962-07-25.program
    when: July 25
    date: '1962-07-25'
    thread: welfare
    c: Public Welfare Amendments signed, [76 Stat. 172](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg172.pdf). Services and rehabilitation for families on relief. Ribicoff out of HEW to run for the Senate; Celebrezze in.
    n: '[[w.davies-from-opportunity-to-entitlement]]. Names: Ribicoff, Celebrezze (K–J Adm. III.G).'
    tags: [name:ribicoff-abraham, name:celebrezze-anthony-j, name:kennedy-john-f]
