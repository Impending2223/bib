    when: Mar. 12
    date: '1968-03-12'
    thread: elections-1968
    c: 'New Hampshire primary. Republican: Nixon over Rockefeller (write-in), 80,666 to 11,241, 77.6 percent. Democratic: Johnson (write-in) over McCarthy, 27,520 to 23,263, 49.6 percent.'
    n: 'N.H., [*Manual for the General Court*, No. 41 (1969), 318–319, 441](https://archive.org/details/manualforgeneral41newh/page/n350). CQ Guide 6th (2010) 409. To check: [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. Names: McCarthy, Johnson, Rockefeller, Nixon.'
