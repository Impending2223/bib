    n: '[[w.schlesinger-robert-kennedy-and-his]], 843–44. [[w.mann-grand-delusion]], 583–84. To check: 114 Cong. Rec. 5647–48 (1968) (cited by [[w.schlesinger-robert-kennedy-and-his]], 843 n.8). Names: Robert Kennedy, Johnson.'
