    c: 'Robert Kennedy, landing at La Guardia shortly before ten, hears from Burns that Johnson will not run. That night, from his apartment, calls to party leaders and a telegram to Johnson proposing a meeting. The telegram, 11:43 p.m.: "Your decision regarding the Presidency subordinates self to country and is truly magnanimous. I respectfully and earnestly request an opportunity to visit you as soon as possible."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 867–68; [[w.palermo-in-his-own-right]], 155–56 (C; Kennedy''s advisers at his apartment into the morning); [[w.shesol-mutual-contempt]], 436, 439–40 (on the plane, Burns: "Johnson isn''t running"; "I wonder if he would have done it if I hadn''t come in"; at United Nations Plaza: "The joy is premature"; calls to Daley, who will not come to the telephone, and to governors, senators and mayors; to O''Brien before midnight: "Here we go again, Larry"); [[w.zelizer-fierce-urgency-of-now]], 293–94 (Burns to Kennedy on the plane: "Johnson isn''t running"; vanden Heuvel: "This sure solves a lot of our troubles"); [[w.thomas-robert-kennedy]], 365 (Burns boards the plane: "The president is not going to run"; Kennedy: "You''re kidding"; on the drive in: "I wonder if he would have done this if I hadn''t come in"). Check: Shesol, 436, has the flight from Phoenix land at Kennedy International at about 9:50 p.m. Check: Zelizer, 293–94, has Burns come up the aisle of the plane, Kennedy just back from Phoenix. To check: Schlesinger, journal, Mar. 31, 1968 (cited by [[w.schlesinger-robert-kennedy-and-his]], 868 n.50); [[w.witcover-85-days]], 126–27 (cited by [[w.schlesinger-robert-kennedy-and-his]], 868 n.49); Robert Kennedy to Johnson, telegram, Mar. 31, 1968, 11:43 p.m., RFK Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 156 n.122). See [[cal.1968-03-31.elections-1968]]. The meeting: [[cal.1968-04-03.robert-kennedy]]. Names: Robert Kennedy, Johnson.'
