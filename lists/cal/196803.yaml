    when: Mar. 16
    date: '1968-03-16'
    thread: vietnam
    c: 'Johnson to the National Alliance of Businessmen: "We must meet our commitments in the world and in Vietnam. We shall and we are going to win."'
    n: 'Remarks at a Meeting of the National Alliance of Businessmen, [1968–69 Pub. Papers 402](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=480) (Mar. 16, 1968). See [[cal.1968-01-30.vietnam]]. Names: Johnson.'
