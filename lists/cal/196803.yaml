  - id: cal.1968-03-12.vietnam-205000
    when: Mar. 12
    date: '1968-03-12'
    thread: vietnam-205000
    c: 'The Tuesday lunch, 1:29 p.m., Rusk at the Senate hearing; Johnson watches part of it on television. The financing of the build-up to be studied ("you have to have about $4 billion"); a statement to be thought about; Clifford and Wheeler to see Russell, Rivers and Mahon. Johnson: the Monday meeting "did moderate my judgment some"; "I do think we should evaluate our strategy."'
    n: '[FRUS 1964–68, VI, doc. 121](https://history.state.gov/historicaldocuments/frus1964-68v06/d121). [[w.johnson-vantage-point]], 406. Made public: in part, [[w.johnson-vantage-point]], 406; FRUS 1964–68, VI (2002). See [[cal.1968-03-11.vietnam]]; [[cal.1968-02-27.vietnam]]. Names: Rusk, Johnson, Clifford, Wheeler, Russell, Rivers, Mahon.'
