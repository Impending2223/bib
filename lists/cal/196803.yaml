  - id: cal.1968-03-12.king-poor-peoples
    when: Mar. 12
    date: '1968-03-12'
    thread: king-poor-peoples
    c: 'Atlanta. King to SCLC''s executive staff, at lunch: the campaign "a continuing, massive lobby-in" at Congress. "I think we''ve got to pit the President against the Congress. I don''t think we ought to make this an anti-Lyndon Johnson battle"; Johnson to be "almost ... forced to support us."'
    n: '[[w.garrow-bearing-the-cross]], 601. Check: the day; Garrow has the lunch after the research committee''s meeting in New York, Mar. 11, and two days before the minority groups'' conference, Mar. 14 (718 n.31). See [[cal.1967-12-04.king]]. Names: King, Johnson.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, state:ga, city:atlanta]
  - id: cal.1968-03-13.opinion
    when: Mar. 13
    date: '1968-03-13'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 22–27, a plan put to the public: the United States to train South Vietnam''s men to fight, as many American troops withdrawn as each 100,000 are trained, most if not all out within a year, supplies and economic aid kept up, the fighting left to the South Vietnamese: approve 69 percent, disapprove 21. Republicans 68, Democrats 70, independents 69. Most South Vietnamese want the United States out of their country: yes 40, no 45.'
    n: '[[w.gallup-poll]], III, 2109–10.'
  - id: cal.1968-03-14.economy
    when: Mar. 14
    date: '1968-03-14'
    thread: economy-gold
    also: [trade]
    c: 'After heavy buying on the London market, the Federal Reserve''s discount rate to 5 percent; at Washington''s request London''s gold market closed from Mar. 15; Fowler and Martin: the United States will buy and sell gold at $35 an ounce in official transactions. The Senate passes H.R. 14743, the 25 percent gold cover on Federal Reserve notes ended, [39–37](https://voteview.com/rollcall/RS0900356).'
    n: 'FRUS 1964–68, VIII, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v08/d189), [190](https://history.state.gov/historicaldocuments/frus1964-68v08/d190), [191](https://history.state.gov/historicaldocuments/frus1964-68v08/d191). [[w.schwartz-lyndon-johnson-and-europe]], 200–02. To check: [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.james-international-monetary-cooperation-since]]; [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1968-02-21.economy]]; [[cal.1967-11-18.economy]]. Names: Fowler, Martin.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr]
  - id: cal.1968-03-14.vietnam-205000
    when: Mar. 14
    date: '1968-03-14'
    thread: vietnam-205000
    c: 'Acheson to Johnson, after his own inquiry: the public would not support the reinforcement asked; "you are being led down the garden path."'
    n: 'FRUS 1964–68, VI, doc. [125](https://history.state.gov/historicaldocuments/frus1964-68v06/d125). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Acheson, Johnson.'
    tags: [name:acheson-dean-g, name:johnson-lyndon-b]
  - id: cal.1968-03-14.robert-kennedy
    when: Mar. 14–16
    date: '1968-03-14'
    thread: robert-kennedy
    also: [elections-1968]
    c: 'Mar. 14, Robert Kennedy and Sorensen with Clifford at the Pentagon: Kennedy would stay out of the race if Johnson named a commission to review the war''s policy, Kennedy and nine others its members; Johnson refuses. Mar. 11, Sorensen had seen Johnson. Mar. 16, the Senate Caucus Room, where his brother had announced in 1960: Kennedy a candidate for the Democratic nomination. "I do not run for the Presidency merely to oppose any man but to propose new policies."'
    n: '[*New York Times*, Mar. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/17/issue.html). FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). [Johnson and Daley, 5:00 p.m., Mar. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-and-office-conversation-march-13), Conversation WH6803-02-12810 (Miller Center). [[w.schlesinger-robert-kennedy-and-his]], 851–57; [[w.dallek-flawed-giant]], 527–28 (Kennedy to Clifford). To check: [[w.thomas-robert-kennedy]]; [[w.shesol-mutual-contempt]]; [[w.witcover-85-days]]; [[w.newfield-robert-kennedy]]; [[w.clarke-last-campaign]]; [[w.clifford-counsel-to-the-president-2]]. Names: Kennedy, Sorensen, Clifford, Johnson.'
    tags: [name:kennedy-robert-f, name:sorensen-theodore-c, name:clifford-clark, name:johnson-lyndon-b, name:daley-richard-j]
  - id: cal.1968-03-15.open-housing-ky
    when: Mar. 15
    date: '1968-03-15'
    thread: open-housing
    c: 'Kentucky''s General Assembly passes a statewide fair housing act, the first in the South: Senator Georgia Davis Powers and Representative Mae Street Kidd of Louisville its sponsors. It becomes law without Nunn''s signature.'
    n: '[HUD, "Kentucky" (July 14, 2006)](https://archives.hud.gov/content/focus/2006-07-14.cfm); [Wikipedia, "Louie Nunn"](https://en.wikipedia.org/wiki/Louie_Nunn). Check: the act, *Kentucky Acts*, 1968, and the date it took effect. To check: [[w.kmeyer-civil-rights-in-the]]; [[w.harrison-new-history-of-kentucky]]. See [[cal.1967-12-13.open-housing-louisville]]. Names: Powers, Kidd, Nunn.'
    tags: [state:ky, city:louisville, name:powers-georgia-davis, name:kidd-mae-street, name:nunn-louie-b]
