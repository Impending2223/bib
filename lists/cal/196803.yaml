    n: '[FRUS 1964–68, VI, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v06/d130) (the editorial note: the time, those present, from the Daily Diary; the meeting''s notes quoted). [[w.johnson-vantage-point]], 406–7 (Rusk''s words; no decision). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Johnson, Clifford, Rusk, Wheeler, Nitze, Fortas, Taylor, Rostow, Fowler.'
