  - id: cal.1968-03-31.soviet-union
    when: Mar. 31
    date: '1968-03-31'
    thread: soviet-union
    also: [vietnam]
    c: 'Dobrynin with Johnson, Harriman and Rostow, 6:05 p.m., after going over the address with Harriman and Rostow: the Soviet Union, as Geneva co-chairman and Hanoi''s supplier, to "bring its influence to bear for a conference"; the Chinese "cocky" and "chesty"; "he had gone 90% of the way." Dobrynin: why not a 100 percent pause? Johnson: "But you are helping them." The bombing to go on below the 20th parallel, no firm time limit. In a hallway afterward, by Dobrynin''s account, Johnson tells him he will not run.'
    n: 'FRUS 1964–68, VI, doc. [168](https://history.state.gov/historicaldocuments/frus1964-68v06/d168); XIV, doc. [268](https://history.state.gov/historicaldocuments/frus1964-68v14/d268). [[w.longley-lbjs-1968]], 95–97 (the meeting; the hallway, by Dobrynin''s account). To check: [[w.dobrynin-in-confidence]], 170–72. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-31.elections-1968]]. Names: Dobrynin, Harriman, Rostow, Johnson.'
