    thread: vietnam-operations
    c: 'Four North Vietnamese infiltration trawlers, sighted Feb. 28–29 among 1,176 steel-hulled craft, approach the coast at once: off Quảng Ngãi one is driven aground and blows itself up; one off Bình Định turns back for China; one beaches in the Hòn Hèo secret zone near Nha Trang and explodes under fire; one is sunk 43 miles northeast of Cà Mau Point.'
    n: '[[w.macv-command-history-1968]], 447–48; Since Market Time began in 1965, no confirmed successful infiltration by trawler (448).'
