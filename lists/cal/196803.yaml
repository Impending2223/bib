  - id: cal.1968-03-01.vietnam
    when: Mar. 1
    date: '1968-03-01'
    thread: vietnam
    c: 'Johnson at a testimonial dinner for Brooks in Beaumont: the pledge to South Vietnam "not a commitment that I made, but a commitment that the United States made"; "until he is willing to leave his neighbor alone, we are going to be there defending that neighbor." By Mann''s account: "we are not going to be quislings, and we are not going to be appeasers, and we are not going to cut and run."'
    n: 'Remarks at a Testimonial Dinner in Beaumont, Texas, for Representative Jack Brooks, [1968–69 Pub. Papers 312](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=390) (Mar. 1, 1968) (the dinner; the commitment). [[w.mann-grand-delusion]], 595 (the words he quotes). Check: Mann dates the speech Mar. 2; the Public Papers have the dinner end the day of Mar. 1. Check: Mann''s words, on the volume''s page 318, which the scan''s text read here lacks. Names: Johnson.'
    src:
