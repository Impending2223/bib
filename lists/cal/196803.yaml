  - id: cal.1968-03-01.transition-and-staff
    when: Mar. 1
    date: '1968-03-01'
    thread: defense-clifford
    also: [transition-and-staff]
    c: Clifford sworn in as Secretary of Defense in the East Room; McNamara gone to the World Bank.
    n: 'Remarks at the Swearing In of Clark Clifford as Secretary of Defense, [1968–69 Pub. Papers 301](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=379) (Mar. 1, 1968). See [[cal.1968-01-19.defense]]. Names: Clifford, McNamara, Johnson.'
    tags: [name:clifford-clark, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1968-03-01.open-housing
    when: Mar. 1
    date: '1968-03-01'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516, the Dirksen substitute: Titles I, the federally protected activities, and II, fair housing. Cloture short of two-thirds, [59–35](https://voteview.com/rollcall/RS0900322).'
    n: 'See [[cal.1968-02-06.open-housing]]; [[cal.1967-02-15.open-housing]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-03-01.students-los-angeles
    when: Mar. 1
    date: '1968-03-01'
    thread: students
    also: [desegregation-schools]
    c: Los Angeles. Mexican American students walk out of Wilson High School, on the East Side.
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). [[w.haney-lopez-racism-on-trial]]; [[w.garcia-blowout]]; [[w.felker-kantor-policing-los-angeles]].'
    tags: [state:ca, city:los-angeles]
  - id: cal.1968-03-03.opinion
    when: Mar. 3
    date: '1968-03-03'
    thread: opinion
    also: [crime-and-hijacking, court]
    c: 'Gallup, Feb. 1–6: the courts in this area deal with criminals not harshly enough 63 percent, about right 19, too harshly 2. Steps to reduce crime, the five named most often: correct social and economic conditions 18; more parental control 18; changes in the courts, a freer hand for the police, 17; a larger police force 15; more severe penalties 13.'
    n: '[[w.gallup-poll]], III, 2108.'
  - id: cal.1968-03-04.vietnam
    when: Mar. 4–5
    date: '1968-03-04'
    thread: vietnam-205000
    also: [defense]
    c: 'Clifford''s group reports on Westmoreland''s request for 205,000 more men. Its draft memorandum: some 22,000 to Vietnam at once; a call-up of about 262,000 reservists, higher draft calls, enlistments extended; the rest of the request to wait on events; the strategic guidance to Westmoreland to be studied anew. Clifford: "We seem to have a sinkhole. We put in more—they match it." Rusk: the bombing of the North might be stopped during its rainy season; Johnson: "Really get on your horses on that."'
    n: 'FRUS 1964–68, VI, docs. [103](https://history.state.gov/historicaldocuments/frus1964-68v06/d103), [104](https://history.state.gov/historicaldocuments/frus1964-68v06/d104), [105](https://history.state.gov/historicaldocuments/frus1964-68v06/d105). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Clifford, Westmoreland, Rusk, Johnson.'
    tags: [name:clifford-clark, name:westmoreland-william, name:rusk-dean, name:johnson-lyndon-b, name:nitze-paul]
  - id: cal.1968-03-04.open-housing
    when: Mar. 4
    date: '1968-03-04'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516: cloture invoked on the Dirksen substitute, [65–32](https://voteview.com/rollcall/RS0900323), the fourth vote. The single owner''s home exempted from fair housing, refused, [38–56](https://voteview.com/rollcall/RS0900324).'
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-03-04.black-nationalism
    when: Mar. 4
    date: '1968-03-04'
    thread: black-nationalism
    also: [king]
    c: 'The FBI''s counterintelligence program against black nationalist groups widened from twenty-three field offices to forty-one. Its long-range goals: to prevent a coalition of the groups; to prevent the rise of a "messiah" who could "unify, and electrify," the movement, King, Carmichael and Elijah Muhammad named; to prevent violence; to keep the groups and leaders from "respectability"; to prevent their growth among the young.'
    n: 'Memorandum, FBI Headquarters to the field offices, Mar. 4, 1968, as quoted in [S. Rep. No. 94-755, Book III, 21–22 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=25). Made public: the Church Committee, *Supplementary Detailed Staff Reports on Intelligence Activities and the Rights of Americans*, Book III (1976). See [[cal.1967-08-25.black-nationalism]]. Names: King, Carmichael, Elijah Muhammad, Hoover.'
    tags: [name:king-martin-luther-jr, name:carmichael-stokely, name:muhammad-elijah, name:hoover-j-edgar]
  - id: cal.1968-03-04.health
    when: Mar. 4
    date: '1968-03-04'
    thread: health
    c: 'Message on health, "Health in America." Asked: a Child Health Act, the care of poor mothers and infants, $58 million more for maternal and child health in fiscal 1969; family planning, from $25 million to $61 million; a Health Manpower Act; new ways of paying doctors and hospitals under Medicare and Medicaid; a reasonable cost range for the drugs those programs buy, and a United States Compendium of Drugs.'
    n: '[Special Message to the Congress: "Health in America"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-health-america) (Mar. 4, 1968). [[w.blumenthal-heart-of-power]]; [[w.califano-triumph-and-tragedy-of]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-04.opinion
    when: Mar. 4
    date: '1968-03-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 22–27: the Republican convention''s choice narrowed to Nixon and Rockefeller: Nixon 48 percent, Rockefeller 44; Republicans 67 and 30; independents 45 and 47. Republicans'' choice from eight: Nixon 49, Rockefeller 22, Reagan 11, Romney 7, Percy 4, Lindsay 3, Hatfield 1, Stassen 1.'
    n: '[[w.gallup-poll]], III, 2108–09. Names: Nixon, Rockefeller, Reagan, Romney, Percy, Lindsay, Hatfield, Stassen.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:romney-george-w, name:percy-charles-h, name:lindsay-john-v, name:hatfield-mark-o, name:stassen-harold-e]
  - id: cal.1968-03-05.students-los-angeles
    when: Mar. 5–8
    date: '1968-03-05'
    thread: students
    also: [desegregation-schools]
    c: 'Los Angeles. The walkouts spread through the East Side''s high schools: Garfield, some 2,000, Mar. 5; Lincoln, Roosevelt and Garfield, Mar. 6; Belmont, Mar. 7; again Mar. 8.'
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). See [[cal.1968-03-01.students-los-angeles]].'
    tags: [state:ca, city:los-angeles]
  - id: cal.1968-03-05.open-housing
    when: Mar. 5
    date: '1968-03-05'
    thread: open-housing
    also: [civil-disorders]
    c: 'Senate, H.R. 2516: the anti-riot amendment, the intent to incite a riot to be proved, [82–13](https://voteview.com/rollcall/RS0900326).'
    n: See [[cal.1968-02-06.open-housing]].
  - id: cal.1968-03-06.transition-and-staff
    when: Mar. 6
    date: '1968-03-06'
    thread: transition-and-staff
    c: C. R. Smith, chairman of American Airlines, sworn in as Secretary of Commerce, for Trowbridge, who resigned for his health.
    n: 'Remarks at the Swearing In of Cyrus R. Smith as Secretary of Commerce, [1968–69 Pub. Papers 348](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=426) (Mar. 6, 1968). See [[cal.1968-02-16.transition-and-staff]]. Names: Smith, Trowbridge, Johnson.'
    tags: [name:smith-c-r, name:trowbridge-alexander-b, name:johnson-lyndon-b]
  - id: cal.1968-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1968-03-06'
    thread: civil-rights-the-executive
    c: 'Message on the American Indian, "The Forgotten American": unemployment among Indians nearly 40 percent; the average age at death 44, for other Americans 65. A new goal: an end to the debate over "termination," and "self-determination." Executive Order 11399: a National Council on Indian Opportunity, the Vice President its chairman, with the Secretaries of the Interior, Agriculture, Commerce, Labor, Health, Education, and Welfare, and Housing and Urban Development, the Director of the Office of Economic Opportunity, and six Indians (Check the members).'
    n: '[Special Message to the Congress on the Problems of the American Indian: "The Forgotten American"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-problems-the-american-indian-the-forgotten-american); [Executive Order 11399](https://www.presidency.ucsb.edu/documents/executive-order-11399-establishing-the-national-council-indian-opportunity) (Mar. 6, 1968). [[w.clarkin-federal-indian-policy-in]]; [[w.cobb-native-activism-in-cold]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1968-03-06.vietnam
    when: Mar. 6
    date: '1968-03-06'
    thread: vietnam
    also: [congress]
    c: 'Johnson with Fulbright, Mansfield, Sparkman, Aiken and Hickenlooper, on Rusk''s coming testimony and the Gulf of Tonkin Resolution: "I sent up the resolution on Southeast Asia because I told the Security Council members that I was not going to commit troops" without Congress.'
    n: 'FRUS 1964–68, VI, doc. [109](https://history.state.gov/historicaldocuments/frus1964-68v06/d109). [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.schoenbaum-waging-war-and-peace]]. Names: Johnson, Fulbright, Mansfield, Sparkman, Aiken, Hickenlooper, Rusk.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:mansfield-mike, name:sparkman-john, name:aiken-george-d, name:hickenlooper-bourke-b, name:rusk-dean]
  - id: cal.1968-03-07.testing
    when: Mar. 7
    date: '1968-03-07'
    thread: testing-npt
    also: [soviet-union]
    c: The nonproliferation treaty. At Geneva, before the Eighteen-Nation Disarmament Committee, the United States, the Soviet Union and Britain propose a Security Council resolution on security assurances to non-nuclear states that sign. Foster for the United States.
    n: '[[w.department-of-state-bulletin]], [Mar. 25, 1968, 401](https://archive.org/details/departmentofstat581968unit/page/401/mode/1up) (Foster''s statement of Mar. 7, U.S./U.N. press release 34). [[w.seaborg-stemming-the-tide]]. See [[cal.1968-01-18.testing]]. Names: Foster.'
    tags: [name:foster-william-c]
  - id: cal.1968-03-08.conservation
    when: Mar. 8
    date: '1968-03-08'
    thread: conservation
    c: 'Message on conservation, "To Renew a Nation." Asked: $1.5 to $2 billion of community waste treatment plants built this year; a National Water Commission; a Safe Drinking Water Act; the Central Arizona Project; laws against oil spills; a Surface Mining Reclamation Act; the Solid Waste Disposal Act extended; the highway beautification program continued.'
    n: 'Special Message to the Congress on Conservation: "To Renew a Nation", [1968–69 Pub. Papers 355](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=433) (Mar. 8, 1968). [[w.gould-lady-bird-johnson-and]]. See [[cal.1967-11-21.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-08.open-housing
    when: Mar. 8
    date: '1968-03-08'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516: six titles on the rights of American Indians, [81–0](https://voteview.com/rollcall/RS0900344); Ervin''s substitute, without fair housing, refused, [24–64](https://voteview.com/rollcall/RS0900339); the Dirksen substitute adopted, [61–19](https://voteview.com/rollcall/RS0900345).'
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Ervin, Dirksen.'
    tags: [name:ervin-sam-j-jr, name:dirksen-everett]
  - id: cal.1968-03-10.vietnam
    when: Mar. 10
    date: '1968-03-10'
    thread: vietnam-205000
    also: [press-and-broadcasting]
    c: '*New York Times*, front page: "Westmoreland Requests 206,000 More Men, Stirring Debate in Administration." A call-up of reserves under study; some officials for a change of strategy.'
    n: '[*New York Times*, Mar. 10, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/10/issue.html). [[w.schandler-unmaking-of-a-president]]; [[w.braestrup-big-story]]; [[w.hammond-public-affairs]]. See [[cal.1968-01-30.vietnam]]. Names: Westmoreland.'
    tags: [name:westmoreland-william]
  - id: cal.1968-03-10.opinion
    when: Mar. 10
    date: '1968-03-10'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 22–27: the United States made a mistake in sending troops: yes 49 percent, no 41. The fighting to last under two years 35, over two years 30. The United States and its allies losing ground 23, standing still 38, making progress 33.'
    n: '[[w.gallup-poll]], III, 2109.'
  - id: cal.1968-03-11.vietnam
    when: Mar. 11–12
    date: '1968-03-11'
    thread: vietnam
    also: [congress]
    c: Rusk before Foreign Relations on the foreign aid bill, televised; questioned on the war, the troop request, and the resolution (Check the hours and the words).
    n: 'Daily Digest, [114 Cong. Rec. D90](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=88), [114 Cong. Rec. D92](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=90). [*New York Times*, Mar. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/12/issue.html); [Mar. 13, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/13/issue.html). See [[cal.1968-03-06.vietnam]]. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1968-03-11.testing-npt
    when: Mar. 11
    date: '1968-03-11'
    thread: testing-npt
    also: [soviet-union]
    c: Geneva. Foster and Roshchin bring the Eighteen-Nation Disarmament Committee a revised joint draft of the nonproliferation treaty.
    n: '*Documents on Disarmament, 1968*, 162–166 (the draft). See [[cal.1968-03-07.testing]]. Names: Foster, Roshchin.'
    tags: [name:foster-william-c, name:roshchin-alexei-a]
  - id: cal.1968-03-11.open-housing
    when: Mar. 11
    date: '1968-03-11'
    thread: open-housing
    also: [congress]
    c: 'The Senate passes H.R. 2516, [71–20](https://voteview.com/rollcall/RS0900346). Johnson: a statement.'
    n: 'Statement by the President on the Senate''s Action in Passing the Civil Rights Bill, [1968–69 Pub. Papers 374](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=452) (Mar. 11, 1968). See [[cal.1968-02-06.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-11.court
    when: Mar. 11
    date: '1968-03-11'
    thread: court
    also: [alabama]
    c: '*Lee v. Washington*, [390 U.S. 333](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390333/usrep390333.pdf) (per curiam): affirmed, the three-judge court''s decree that Alabama''s statutes requiring segregation in prisons and jails violate the Fourteenth Amendment, with its schedule for desegregating them.'
    n: Opinion. *Washington v. Lee*, [263 F. Supp. 327](https://static.case.law/f-supp/263/case-pdfs/0327-01.pdf) (M.D. Ala. 1966), the decree. [[w.bass-taming-the-storm]].
    tags: [state:al]
  - id: cal.1968-03-11.vietnam-operations
    when: Mar. 11
    date: '1968-03-11'
    thread: vietnam-operations
    c: 'Quyết Thắng, the largest allied operation yet in III Corps, around Saigon: six American and ten South Vietnamese brigade equivalents, Weyand''s and Khang''s sweeps merged at Westmoreland''s direction. By Apr. 7, some 1,420 of the enemy killed, over 500 weapons, about 107 tons of rice.'
    n: '[[w.villard-united-states-army-in]], 460–463. Names: Weyand, Westmoreland.'
    tags: [name:weyand-frederick-c, name:westmoreland-william, place:saigon, province:hau-nghia, province:long-an]
  - id: cal.1968-03-12.open-housing
    when: Mar. 12
    date: '1968-03-12'
    thread: open-housing
    c: 'Johnson to the Speaker: pass the Senate''s bill.'
    n: 'Letter to the Speaker of the House Urging Prompt Action on the Civil Rights Bill, [1968–69 Pub. Papers 380](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=458) (Mar. 12, 1968). See [[cal.1968-02-06.open-housing]]. Names: McCormack, Johnson.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w]
  - id: cal.1968-03-12.elections-1968
    when: Mar. 12
    date: '1968-03-12'
    thread: elections-1968
    c: 'New Hampshire primary. Republican: Nixon 77.6 percent, Rockefeller (write-in) 10.8. Democratic: Johnson (write-in) 49.6 percent, McCarthy 41.9.'
    n: 'N.H., [*Manual for the General Court*, No. 41 (1969), 318–319, 441](https://archive.org/details/manualforgeneral41newh/page/n350). CQ Guide 6th (2010) 409. [[w.chester-american-melodrama]]; [[w.white-making-of-the-president-1969]]. Names: McCarthy, Johnson, Rockefeller, Nixon.'
    tags: [primary:1968-03-12, name:mccarthy-eugene-j, name:johnson-lyndon-b, name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1968-03-12.elections-1968-2
    when: Mar. 12–13
    date: '1968-03-12'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'New Hampshire. McCarthy wins twenty of the State''s twenty-four delegates to the convention; Johnson, not on the ballot, his name written in. Mar. 13, Robert Kennedy: he is "reassessing" whether to run (Check the word).'
    n: '[*New York Times*, Mar. 13, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/13/issue.html); [Mar. 14, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/14/issue.html). FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). [[w.herzog-mccarthy-for-president]]; [[w.larner-nobody-knows]]; [[w.mccarthy-year-of-the-people]]. See [[cal.1968-03-12.elections-1968]]; [[cal.1967-11-30.elections-1968]]. Names: McCarthy, Johnson, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:johnson-lyndon-b, name:kennedy-robert-f, state:nh]
  - id: cal.1968-03-12.specials
    when: Mar. 12
    date: '1968-03-12'
    thread: specials
    also: [mississippi]
    c: 'Mississippi 3rd, special run-off. Charles H. Griffin (D), administrative assistant to John Bell Williams (D), takes the seat Williams resigned Jan. 16 to become Governor: 87,713, 66.9 percent; Charles Evers (D), the NAACP''s field secretary, brother of Medgar Evers, 43,303, 33.1. The first round, Feb. 27 (Check the date), all candidates on one ballot, a majority needed: Evers 33,706, Griffin 28,927, Ellis Bodron 22,842; three others.'
    n: 'Votes: CQ Guide 6th (2010) 1284, 1286 n.1. Check: the Mississippi secretary of state''s returns. [[w.dittmer-local-people]]; [[w.crespino-in-search-of-another]]. See [[cal.1968-02-20.specials]]. Names: Griffin, John Bell Williams, Charles Evers, Medgar Evers.'
    tags: [special:1968-03-12-h-MS-3, name:griffin-charles-h, name:williams-john-b, name:evers-charles, name:evers-medgar, state:ms]
  - id: cal.1968-03-12.states-and-cities-ak
    when: Mar. 12
    date: '1968-03-12'
    thread: states-and-cities
    also: [conservation, oil]
    c: 'Alaska. Atlantic Richfield and Humble Oil confirm oil at Prudhoe Bay State No. 1, on State land on the North Slope (Check: the day of the announcement).'
    n: '[Wikipedia, "Prudhoe Bay Oil Field"](https://en.wikipedia.org/wiki/Prudhoe_Bay_Oil_Field). [[w.coates-trans-alaska-pipeline-controversy]]; [[w.naske-alaska]]; [[w.hickel-who-owns-america]].'
    tags: [state:ak]
  - id: cal.1968-03-13.opinion
    when: Mar. 13
    date: '1968-03-13'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 22–27, a plan put to the public: the United States to train South Vietnam''s men to fight, as many American troops withdrawn as each 100,000 are trained, most if not all out within a year, supplies and economic aid kept up, the fighting left to the South Vietnamese: approve 69 percent, disapprove 21. Republicans 68, Democrats 70, independents 69. Most South Vietnamese want the United States out of their country: yes 40, no 45.'
    n: '[[w.gallup-poll]], III, 2109–10.'
  - id: cal.1968-03-14.economy
    when: Mar. 14
    date: '1968-03-14'
    thread: economy-gold
    also: [trade]
    c: 'After heavy buying on the London market, the Federal Reserve''s discount rate to 5 percent; at Washington''s request London''s gold market closed from Mar. 15; Fowler and Martin: the United States will buy and sell gold at $35 an ounce in official transactions. The Senate passes H.R. 14743, the 25 percent gold cover on Federal Reserve notes ended, [39–37](https://voteview.com/rollcall/RS0900356).'
    n: 'FRUS 1964–68, VIII, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v08/d189), [190](https://history.state.gov/historicaldocuments/frus1964-68v08/d190), [191](https://history.state.gov/historicaldocuments/frus1964-68v08/d191). [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.james-international-monetary-cooperation-since]]; [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1968-02-21.economy]]; [[cal.1967-11-18.economy]]. Names: Fowler, Martin.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr]
  - id: cal.1968-03-14.vietnam-205000
    when: Mar. 14
    date: '1968-03-14'
    thread: vietnam-205000
    c: 'Acheson to Johnson, after his own inquiry: the public would not support the reinforcement asked; "you are being led down the garden path."'
    n: 'FRUS 1964–68, VI, doc. [125](https://history.state.gov/historicaldocuments/frus1964-68v06/d125). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Acheson, Johnson.'
    tags: [name:acheson-dean-g, name:johnson-lyndon-b]
  - id: cal.1968-03-14.robert-kennedy
    when: Mar. 14–16
    date: '1968-03-14'
    thread: robert-kennedy
    also: [elections-1968]
    c: 'Mar. 14, Robert Kennedy and Sorensen with Clifford at the Pentagon: Kennedy would stay out of the race if Johnson named a commission to review the war''s policy, Kennedy among its members (Check the terms); Johnson refuses. Mar. 11, Sorensen had seen Johnson. Mar. 16, the Senate Caucus Room, where his brother had announced in 1960: Kennedy a candidate for the Democratic nomination. "I do not run for the Presidency merely to oppose any man but to propose new policies."'
    n: '[*New York Times*, Mar. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/17/issue.html). FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). [Johnson and Daley, 5:00 p.m., Mar. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-and-office-conversation-march-13), Conversation WH6803-02-12810 (Miller Center). [[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.shesol-mutual-contempt]]; [[w.witcover-85-days]]; [[w.newfield-robert-kennedy]]; [[w.clarke-last-campaign]]; [[w.clifford-counsel-to-the-president-2]]. Names: Kennedy, Sorensen, Clifford, Johnson.'
    tags: [name:kennedy-robert-f, name:sorensen-theodore-c, name:clifford-clark, name:johnson-lyndon-b, name:daley-richard-j]
  - id: cal.1968-03-15.open-housing-ky
    when: Mar. 15
    date: '1968-03-15'
    thread: open-housing
    c: 'Kentucky''s General Assembly passes a statewide fair housing act, the first in the South: Senator Georgia Davis Powers and Representative Mae Street Kidd of Louisville its sponsors. It becomes law without Nunn''s signature.'
    n: '[HUD, "Kentucky" (July 14, 2006)](https://archives.hud.gov/content/focus/2006-07-14.cfm); [Wikipedia, "Louie Nunn"](https://en.wikipedia.org/wiki/Louie_Nunn). Check: the act, *Kentucky Acts*, 1968, and the date it took effect. [[w.kmeyer-civil-rights-in-the]]; [[w.harrison-new-history-of-kentucky]]. See [[cal.1967-12-13.open-housing-louisville]]. Names: Powers, Kidd, Nunn.'
    tags: [state:ky, city:louisville, name:powers-georgia-davis, name:kidd-mae-street, name:nunn-louie-b]
  - id: cal.1968-03-16.vietnam
    when: Mar. 16
    date: '1968-03-16'
    thread: vietnam
    c: Quảng Ngãi Province. Charlie Company, 1st Battalion, 20th Infantry, of the Americal Division's Task Force Barker, in the hamlets of Sơn Mỹ village, Mỹ Lai 4 among them, kills some 350 to 500 unarmed villagers, most of them women, children and old men; Calley's platoon among the first. Thompson, an Army helicopter pilot, lands between the soldiers and a group of villagers. The task force reports 128 of the enemy killed.
    n: '[[w.peers-report-of-the-dept]]; [[w.hersh-my-lai-4]]; [[w.hersh-cover-up]]; [[w.bilton-four-hours-in-my]]; [[w.belknap-vietnam-war-on-trial]]; [[w.angers-forgotten-hero-of-my]]; [[w.allison-my-lai]]; [[w.jones-my-lai]]. Made public: Ridenhour''s letter to members of Congress, Mar. 29, 1969; the Army''s charge against Calley, Sept. 1969; Hersh''s story for the Dispatch News Service, Nov. 13, 1969. Names: Calley, Thompson.'
    tags: [name:calley-william-l-jr, name:thompson-hugh-jr, place:son-my-my-lai]
  - id: cal.1968-03-16.vietnam-2
    when: Mar. 16
    date: '1968-03-16'
    thread: vietnam
    c: 'Johnson to the National Alliance of Businessmen: "We must meet our commitments in the world and in Vietnam. We shall and we are going to win."'
    n: 'Remarks at a Meeting of the National Alliance of Businessmen, [1968–69 Pub. Papers 402](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=480) (Mar. 16, 1968). See [[cal.1968-01-30.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-16.economy-gold
    when: Mar. 16–17
    date: '1968-03-16'
    thread: economy-gold
    also: [trade]
    c: 'Washington. The central bank governors of the seven gold pool countries: gold to pass only among monetary authorities at $35; none sold to the market, none bought from it; $4 billion in credits for Britain.'
    n: '[Johnson with Fowler and Martin, 3:40 p.m., Mar. 17](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-and-william-mcc-martin-march-17), Conversation WH6803-02-12819 (Miller Center). See [[cal.1968-03-14.economy]]. Names: Fowler, Martin, Johnson.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:johnson-lyndon-b]
  - id: cal.1968-03-17.opinion
    when: Mar. 17
    date: '1968-03-17'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Feb. 22–27: the Democratic convention''s choice narrowed to Robert Kennedy and Johnson: Johnson 41 percent, Kennedy 41, undecided 18. Democrats: Johnson 45, Kennedy 44. Those 21 to 29: Kennedy 59, Johnson 29; 50 and over, Johnson 48, Kennedy 29.'
    n: '[[w.gallup-poll]], III, 2110–11. Names: Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1968-03-18.vietnam
    when: Mar. 18
    date: '1968-03-18'
    thread: vietnam
    c: 'Johnson to the National Farmers Union at Minneapolis: "a total national effort to win the war, to win the peace, and to complete the job that must be done here at home"; the budget to be cut, if Congress will.'
    n: 'Remarks to Delegates to the National Farmers Union Convention in Minneapolis, [1968–69 Pub. Papers 406](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=484) (Mar. 18, 1968). See [[cal.1968-03-16.vietnam-2]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-18.economy-gold
    when: Mar. 18
    date: '1968-03-18'
    thread: economy-gold
    c: 'The gold cover act signed, [82 Stat. 50](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg50.pdf): no gold reserve behind Federal Reserve notes.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1968-03-14.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-18.king
    when: Mar. 18
    date: '1968-03-18'
    thread: king-memphis
    also: [labor-disputes]
    c: Memphis, the sanitation strike. King at Mason Temple calls for a general strike and a march.
    n: '[[w.beifuss-at-the-river-i]]; [[w.honey-going-down-jericho-road]]; [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1968-02-12.king]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:tn, city:memphis]
  - id: cal.1968-03-19.students
    when: Mar. 19–23
    date: '1968-03-19'
    thread: students
    also: [civil-rights-organizations]
    c: 'Washington. Howard University students hold the administration building for five days: the charges against the students who disrupted the university''s Charter Day, Mar. 1, to be dropped; courses in Negro history and culture among their demands (Check the demands and the settlement).'
    n: '[*New York Times*, Mar. 20, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/20/issue.html); [Mar. 24, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/24/issue.html). [[w.rogers-black-campus-movement]].'
    tags: [state:dc, city:washington]
  - id: cal.1968-03-20.congress
    when: Mar. 20
    date: '1968-03-20'
    thread: congress
    c: 'Senate, S. Res. 266, its first code of conduct: Clark''s substitute, full public disclosure, refused, [40–44](https://voteview.com/rollcall/RS0900360).'
    n: '[[w.zelizer-on-capitol-hill]]. See [[cal.1967-06-13.congress]]. Names: Clark.'
    tags: [name:clark-joseph-s]
  - id: cal.1968-03-20.opinion
    when: Mar. 20
    date: '1968-03-20'
    thread: opinion
    also: [vietnam, jobs-and-wages, farm, labor-disputes]
    c: 'Gallup, two releases. Feb. 22–27: go all-out to win a military victory in Vietnam, using atom bombs and weapons: agree 27 percent, disagree 65. Public school teachers permitted to strike: should 36, should not 57. Nurses permitted to strike, 29 and 66; to join unions, 59 and 34. Farmers to establish a nationwide union: should 48, should not 35; farmers 53 and 39. Jan. 4–9, no strike to go on more than 21 days, then a committee appointed by the courts to decide, binding on both: favor 69, oppose 22.'
    n: '[[w.gallup-poll]], III, 2111–12.'
  - id: cal.1968-03-21.elections-1968
    when: Mar. 21
    date: '1968-03-21'
    thread: elections-1968
    c: 'New York. Rockefeller, at a news conference: he will not campaign, directly or indirectly, for the Republican nomination, but would answer a draft (Check the words).'
    n: '[*New York Times*, Mar. 22, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/22/issue.html). FRUS 1964–68, VI, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v06/d149). [[w.smith-on-his-own-terms]]; [[w.persico-imperial-rockefeller]]; [[w.kabaservice-rule-and-ruin]]; [[w.white-making-of-the-president-1969]]. Names: Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1968-03-21.middle-east
    when: Mar. 21
    date: '1968-03-21'
    thread: middle-east
    c: Israeli forces cross the Jordan against the Fatah base at Karameh; the Jordanian army in the fighting; Israel's dead some thirty (Check).
    n: FRUS 1964–68, XX, docs. [119](https://history.state.gov/historicaldocuments/frus1964-68v20/d119), [120](https://history.state.gov/historicaldocuments/frus1964-68v20/d120), [121](https://history.state.gov/historicaldocuments/frus1964-68v20/d121), [122](https://history.state.gov/historicaldocuments/frus1964-68v20/d122). [[w.quandt-peace-process]]; [[w.spiegel-other-arab-israeli-conflict]]. See [[cal.1967-11-22.middle-east]].
  - id: cal.1968-03-22.congress
    when: Mar. 22
    date: '1968-03-22'
    thread: congress
    c: 'The Senate''s first code of conduct, S. Res. 266, passed, [67–1](https://voteview.com/rollcall/RS0900366): new rules on gifts and campaign funds, the political work of employees, and disclosure, each Senator to file a public statement of his gifts and honoraria and a sealed one of his income, assets and debts with the Comptroller General (Check the terms).'
    n: See [[cal.1968-03-20.congress]].
  - id: cal.1968-03-22.vietnam
    when: Mar. 22
    date: '1968-03-22'
    thread: vietnam-abrams
    also: [defense]
    c: 'News conference. Westmoreland to be Army Chief of Staff, from July; his successor not yet named. Wheeler''s term as Chairman of the Joint Chiefs, to end July 2, extended a year, Congress willing; Russell and Rivers for it. Mar. 23, Johnson to Westmoreland: "Your appointment as Army Chief of Staff gives me great personal pleasure."'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=507) (Mar. 22, 1968). FRUS 1964–68, VI, doc. [151](https://history.state.gov/historicaldocuments/frus1964-68v06/d151). [[w.sorley-westmoreland]]; [[w.westmoreland-soldier-reports]]; [[w.cosmas-joint-chiefs-of-staff]]. Names: Westmoreland, Wheeler, Russell, Rivers, Johnson.'
    tags: [name:westmoreland-william, name:wheeler-earle, name:russell-richard-b, name:rivers-l-mendel, name:johnson-lyndon-b]
  - id: cal.1968-03-22.transition-and-staff
    when: Mar. 22
    date: '1968-03-22'
    thread: transition-and-staff
    also: [poverty]
    c: News conference. Shriver named ambassador to France; Harding, his deputy, to run the poverty program meanwhile. Wilbur Cohen, the Under Secretary, to be Secretary of Health, Education, and Welfare, for Gardner.
    n: 'The President''s News Conference, [1968–69 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=507) (Mar. 22, 1968). [[w.stossel-sarge]]. See [[cal.1968-01-25.transition-and-staff]]. Names: Shriver, Harding, Cohen, Gardner, Johnson.'
    tags: [name:shriver-r-sargent, name:harding-bertrand-m, name:cohen-wilbur-j, name:gardner-john-w, name:johnson-lyndon-b]
  - id: cal.1968-03-22.soviet-union
    when: Mar. 22
    date: '1968-03-22'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: 'Prague. Novotný resigns as President. Beam, Mar. 25: "For first time in history, a Communist regime has purged top leader by bringing popular pressure to bear on him."'
    n: 'FRUS 1964–68, XVII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v17/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v17/d57). [[w.dawisha-kremlin-and-the-prague]]. Names: Novotný, Beam.'
    tags: [name:novotny-antonin, name:beam-jacob-d]
  - id: cal.1968-03-24.middle-east
    when: Mar. 24
    date: '1968-03-24'
    thread: middle-east
    c: 'Security Council Resolution 248, unanimous: the military action by Israel at Karameh, "in flagrant violation" of the Charter and the cease-fire resolutions, condemned (Check the words).'
    n: '[S.C. Res. 248](https://undocs.org/S/RES/248(1968)) (Mar. 24, 1968). See [[cal.1968-03-21.middle-east]].'
  - id: cal.1968-03-24.opinion
    when: Mar. 24
    date: '1968-03-24'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy]
    c: 'Gallup, Mar. 15–20, Democrats, the convention''s choice narrowed to two: Robert Kennedy 44 percent, Johnson 41, undecided 15. Johnson 59, McCarthy 29, undecided 12.'
    n: '[[w.gallup-poll]], III, 2112. Names: Kennedy, Johnson, McCarthy.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:mccarthy-eugene-j]
  - id: cal.1968-03-25.vietnam
    when: Mar. 25–26
    date: '1968-03-25'
    thread: vietnam-205000
    c: 'The Wise Men. Mar. 25, at State: dinner with Rusk, Clifford and others, three briefings, DePuy''s among them. Mar. 26, Johnson with Wheeler and Abrams, then the group with the President. McGeorge Bundy''s summary: Acheson for the majority, "we can no longer do the job we set out to do in the time we have left and we must begin to take steps to disengage"; Ball, Dean, Vance and Dillon with him; Bradley, Taylor and Murphy against; Ball, Goldberg and Vance for stopping the bombing now.'
    n: 'FRUS 1964–68, VI, docs. [155](https://history.state.gov/historicaldocuments/frus1964-68v06/d155), [156](https://history.state.gov/historicaldocuments/frus1964-68v06/d156), [157](https://history.state.gov/historicaldocuments/frus1964-68v06/d157), [158](https://history.state.gov/historicaldocuments/frus1964-68v06/d158). Made public: FRUS 1964–68, VI (2002). [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]; [[w.hoopes-limits-of-intervention]]; [[w.clifford-counsel-to-the-president-2]]; [[w.brinkley-dean-acheson]]; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1968-02-27.vietnam]]. Names: Rusk, Clifford, DePuy, Johnson, Wheeler, Abrams, Bundy, Acheson, Ball, Dean, Vance, Dillon, Bradley, Taylor, Murphy, Goldberg.'
    tags: [name:rusk-dean, name:clifford-clark, name:depuy-william-e, name:johnson-lyndon-b, name:wheeler-earle, name:abrams-creighton, name:bundy-mcgeorge, name:acheson-dean-g, name:ball-george-w, name:dean-arthur-h, name:vance-cyrus, name:dillon-c-douglas, name:bradley-omar-n, name:taylor-maxwell, name:murphy-robert-d, name:goldberg-arthur-j, name:ridgway-matthew-b, name:lodge-henry-cabot, name:mccloy-john-j, name:fortas-abe]
  - id: cal.1968-03-26.economy
    when: Mar. 26
    date: '1968-03-26'
    thread: economy-surcharge
    also: [congress]
    c: 'Senate, H.R. 15414, the excise taxes on telephone service and automobiles extended. The Smathers–Williams substitute: a 10 percent surcharge, fiscal 1969 spending cut by $6 billion, a freeze on federal civilian hiring (Check the terms). The surcharge struck from it, refused, [35–52](https://voteview.com/rollcall/RS0900369); the freeze and the moratorium on public works struck, refused, [33–56](https://voteview.com/rollcall/RS0900368).'
    n: '[[w.zelizer-taxing-america]]; [[w.bernstein-guns-or-butter]]. See [[cal.1967-01-10.economy]]. Names: Smathers, Williams.'
    tags: [name:smathers-george-a, name:williams-john-j]
  - id: cal.1968-03-27.court
    when: Mar. 27
    date: '1968-03-27'
    thread: court
    also: [civil-rights-the-executive]
    c: 'Jury Selection and Service Act signed, [82 Stat. 53](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg53.pdf): federal jurors drawn at random from the voter lists; no citizen excluded for race, color, religion, sex, national origin or economic status. Through the House, Feb. 26, [307–45](https://voteview.com/rollcall/RH0900261).'
    n: 'Remarks Upon Signing the Jury Selection and Service Act of 1968, [1968–69 Pub. Papers 445](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=523) (Mar. 27, 1968). [[w.graham-civil-rights-era]]. See [[cal.1967-02-15.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-27.economy-surcharge
    when: Mar. 27
    date: '1968-03-27'
    thread: economy-surcharge
    also: [congress]
    c: 'Senate, H.R. 15414: an excess profits tax in place of both the surcharge and the spending cut, refused, [18–74](https://voteview.com/rollcall/RS0900372).'
    n: See [[cal.1968-03-26.economy]].
  - id: cal.1968-03-27.opinion
    when: Mar. 27
    date: '1968-03-27'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Mar. 15–20, two releases. Nixon 41 percent, Johnson 39, Wallace 14, undecided 6. Outside the South: Nixon 44, Johnson 41, Wallace 8. South: Johnson 34, Nixon 31, Wallace 31. Republicans'' choice for 1968, after the New Hampshire primary: Nixon 60, Rockefeller 24, Reagan 6, Percy 5. Before it: Nixon 49, Rockefeller 22, Reagan 11, Percy 4; Romney 7.'
    n: '[[w.gallup-poll]], III, 2112–13. See [[cal.1968-03-12.elections-1968]]. Names: Nixon, Johnson, Wallace, Rockefeller, Reagan, Percy, Romney.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:wallace-george-c, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h, name:romney-george-w]
  - id: cal.1968-03-28.vietnam
    when: Mar. 28
    date: '1968-03-28'
    thread: vietnam-205000
    c: 'The address drafted. Rusk, Clifford, William Bundy and McPherson on McPherson''s drafts: Clifford proposes a new element, the bombing halted north of the 20th parallel; the text made a speech for peace.'
    n: 'FRUS 1964–68, VI, doc. [163](https://history.state.gov/historicaldocuments/frus1964-68v06/d163). [[w.mcpherson-political-education]]. Made public: McPherson, *A Political Education* (1972); FRUS 1964–68, VI (2002). See [[cal.1968-03-25.vietnam]]. Names: Rusk, Clifford, Bundy, McPherson.'
    tags: [name:rusk-dean, name:clifford-clark, name:bundy-william, name:mcpherson-harry]
  - id: cal.1968-03-28.economy-surcharge
    when: Mar. 28
    date: '1968-03-28'
    thread: economy-surcharge
    also: [congress]
    c: 'Senate, H.R. 15414: the moratorium on public works struck from the Smathers–Williams substitute, [42–37](https://voteview.com/rollcall/RS0900378).'
    n: 'See [[cal.1968-03-26.economy]]. Names: Smathers, Williams.'
    tags: [name:smathers-george-a, name:williams-john-j]
  - id: cal.1968-03-28.king-memphis
    when: Mar. 28
    date: '1968-03-28'
    thread: king-memphis
    also: [civil-disorders]
    c: Memphis. The march from Clayborn Temple, King at its head, breaks up as windows are smashed and stores looted on Beale and Main Streets; the police with clubs, tear gas and Mace; a youth of sixteen shot dead by a policeman; some sixty hurt and nearly three hundred arrested (Check the counts); Ellington sends the Guard; Loeb a curfew. King, led away, says he will lead another march.
    n: '[*New York Times*, Mar. 29, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/29/issue.html). See [[cal.1968-03-18.king]]. Names: King, Ellington, Loeb.'
    tags: [name:king-martin-luther-jr, name:ellington-buford, name:loeb-henry, state:tn, city:memphis]
  - id: cal.1968-03-28.students-los-angeles
    when: Mar. 28
    date: '1968-03-28'
    thread: students
    also: [desegregation-schools]
    c: 'Los Angeles. The Board of Education hears the Educational Issues Coordinating Committee''s 39 demands. Thirteen organizers of the walkouts, Castro, a teacher at Lincoln, among them, later indicted for conspiracy (Check the date: May 31; Wikipedia''s timeline gives their arrest as Mar. 31).'
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts); Check: the board''s minutes, Mar. 28, 1968, and its answer; the grand jury''s indictment. See [[cal.1968-03-01.students-los-angeles]]. Names: Castro.'
    tags: [state:ca, city:los-angeles, name:castro-sal]
  - id: cal.1968-03-29.king-memphis
    when: Mar. 29
    date: '1968-03-29'
    thread: king-memphis
    c: 'Johnson on Memphis: "Rioting, violence, and repression can only divide our people."'
    n: 'Statement by the President on the Disorders in Memphis, [1968–69 Pub. Papers 458](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=536) (Mar. 29, 1968). See [[cal.1968-03-18.king]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:tn, city:memphis]
  - id: cal.1968-03-30.vietnam-205000
    when: Mar. 30
    date: '1968-03-30'
    thread: vietnam-205000
    c: 'With Clifford, Wheeler, William Bundy, Rostow, McNamara and McPherson, Johnson decides against announcing a call-up of reserves for the strategic reserve: "I''m just worn down on it."'
    n: 'FRUS 1964–68, VI, doc. [167](https://history.state.gov/historicaldocuments/frus1964-68v06/d167). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Clifford, Wheeler, Bundy, Rostow, McNamara, McPherson, Johnson.'
    tags: [name:clifford-clark, name:wheeler-earle, name:bundy-william, name:rostow-walt-w, name:mcnamara-robert-s, name:mcpherson-harry, name:johnson-lyndon-b]
  - id: cal.1968-03-30.soviet-union-czechoslovakia
    when: Mar. 30
    date: '1968-03-30'
    thread: soviet-union-czechoslovakia
    also: [europe-and-the-alliance]
    c: Prague. The National Assembly elects Svoboda President.
    n: 'See [[cal.1968-03-22.soviet-union]]. Names: Svoboda.'
    tags: [name:svoboda-ludvik]
  - id: cal.1968-03-31.elections-1968
    when: Mar. 31
    date: '1968-03-31'
    thread: elections-1968
    also: [vietnam-205000]
    c: 'Address to the nation, 9 p.m. No attacks on North Vietnam, "unilaterally, and at once," but in "the area north of the demilitarized zone" where the enemy''s buildup threatens allied positions; Clifford''s order to the Joint Chiefs, effective 7 p.m.: no strikes north of the 20th parallel. Harriman to represent the United States at talks, Thompson to join him "at Geneva or any other suitable place." About 13,500 more support troops in five months, some from reserve units called up; $2.5 billion more in fiscal 1968, $2.6 billion in 1969; the surcharge urged. "I shall not seek, and I will not accept, the nomination of my party for another term as your President."'
    n: 'The President''s Address to the Nation Announcing Steps To Limit the War in Vietnam and Reporting His Decision Not To Seek Reelection, [1968–69 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=547); The President''s News Conference, [1968–69 Pub. Papers 476](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=554) (Mar. 31, 1968). FRUS 1964–68, VI, docs. [168](https://history.state.gov/historicaldocuments/frus1964-68v06/d168), [169](https://history.state.gov/historicaldocuments/frus1964-68v06/d169). [Johnson and Rockefeller, 11:59 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nelson-rockefeller-april-1-1968), Conversation WH6803-06-12859 (Miller Center). [President''s Daily Diary, Mar. 31, 1968](https://catalog.archives.gov/id/192475), images 10, 17 (LBJ Library; National Archives Catalog). [[w.schandler-unmaking-of-a-president]]; [[w.johnson-vantage-point]]; [[w.clifford-counsel-to-the-president-2]]; [[w.christian-president-steps-down]]; [[w.mcpherson-political-education]]; [[w.hoopes-limits-of-intervention]]; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]; [[w.dallek-flawed-giant]]; [[w.woods-lbj]]; [[w.lafeber-deadly-bet]]; [[w.gould-1968]]; [[w.kaiser-1968-in-america]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.frankum-like-rolling-thunder]], 59–62. See [[cal.1968-01-30.vietnam]]. Names: Johnson, Clifford, Harriman, Thompson.'
    tags: [name:johnson-lyndon-b, name:clifford-clark, name:harriman-w-averell, name:thompson-llewellyn-e]
