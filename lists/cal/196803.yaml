    when: Mar. 18
    date: '1968-03-18'
    thread: vietnam
    c: 'Johnson to the National Farmers Union at Minneapolis: "a total national effort to win the war, to win the peace, and to complete the job that must be done here at home"; the budget to be cut, if Congress will.'
