  - id: cal.1968-03-01.economy
    when: Mar. 1
    date: '1968-03-01'
    thread: economy
    c: 'Sharp, the Canadian Finance Minister, with Fowler, Friday evening, the visit kept from the press. The Canadian dollar pressed by the British devaluation and the American program; $900 million, a third of the reserves, spent since Jan. 1. An American import surcharge would force Canada to devalue; a border tax Canada would match. Ottawa wants to avoid devaluation: it asks an exemption from the investment program and a $1 billion Export-Import Bank line. Fowler: the exemption a problem; an early answer.'
    n: '[FRUS 1964–68, XII: Western Europe, doc. 347](https://history.state.gov/historicaldocuments/frus1964-68v12/d347) (Walt Rostow to Johnson, Mar. 4). [FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 185](https://history.state.gov/historicaldocuments/frus1964-68v08/d185) (editorial note: Sharp and Fowler on the border tax, Mar. 1). Made public: FRUS 1964–68, XII (2001). See [[cal.1968-02-29.economy]]. Names: Sharp, Fowler.'
    src:
      c: ec3209f4
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d347: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d185: A'
    tags: [name:sharp-mitchell-w, name:fowler-henry-h]
    time_range:
      - 1968-03-01T22:00Z
      - 1968-03-02T05:00Z
    time_zone: America/New_York
