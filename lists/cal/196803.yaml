  - id: cal.1968-03-10.opinion
    when: Mar. 10
    date: '1968-03-10'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 22–27: the United States made a mistake in sending troops: yes 49 percent, no 41. The fighting to last under two years 35, over two years 30. The United States and its allies losing ground 23, standing still 38, making progress 33.'
    n: '[[w.gallup-poll]], III, 2109.'
  - id: cal.1968-03-10.vietnam-205000
    when: Mar. 10
    date: '1968-03-10'
    thread: vietnam-205000
    c: 'Sunday. Rusk at lunch with Johnson on his testimony before Foreign Relations the next day: as full a picture as security allows; the review under way; his proposal of a bombing cutback not for the Senate.'
    n: '[[w.johnson-vantage-point]], 402, by Johnson''s account. Check: Rusk to the committee, Mar. 11, as Johnson quotes him (403): he called on the President "yesterday afternoon after he got back from church." See [[cal.1968-02-27.vietnam]]. Names: Rusk, Johnson.'
    src:
      c: '43599992'
      rows:
        - 'w.johnson-vantage-point 402: all'
    tags: [name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-03-11.vietnam
    when: Mar. 11–12
    date: '1968-03-11'
    thread: vietnam
    also: [congress]
    c: Rusk before Foreign Relations on the foreign aid bill, televised; questioned on the war, the troop request, and the resolution (Check the hours and the words).
    n: 'Daily Digest, [114 Cong. Rec. D90](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=88), [114 Cong. Rec. D92](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=90). [*New York Times*, Mar. 12, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/12/issue.html); [Mar. 13, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/13/issue.html). See [[cal.1968-03-06.vietnam]]. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1968-03-11.testing-npt
    when: Mar. 11
    date: '1968-03-11'
    thread: testing-npt
    also: [soviet-union]
    c: Geneva. Foster and Roshchin bring the Eighteen-Nation Disarmament Committee a revised joint draft of the nonproliferation treaty.
    n: 'Joint American-Soviet Draft Treaty on the Nonproliferation of Nuclear Weapons, Mar. 11, 1968, U.S. Arms Control and Disarmament Agency, *Documents on Disarmament, 1968*, [162–66](https://archive.org/details/DTIC_AD0703891/page/162/mode/1up) (1969) (the draft, submitted to the Committee by the United States and the Soviet Union). See [[cal.1968-03-07.testing]]. Names: Foster, Roshchin.'
    tags: [name:foster-william-c, name:roshchin-alexei-a]
  - id: cal.1968-03-11.open-housing
    when: Mar. 11
    date: '1968-03-11'
    thread: open-housing
    also: [congress]
    c: 'The Senate passes H.R. 2516, [71–20](https://voteview.com/rollcall/RS0900346). Johnson: a statement.'
    n: 'Statement by the President on the Senate''s Action in Passing the Civil Rights Bill, [1968–69 Pub. Papers 374](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=452) (Mar. 11, 1968). See [[cal.1968-02-06.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-11.court
    when: Mar. 11
    date: '1968-03-11'
    thread: court
    also: [alabama]
    c: '*Lee v. Washington*, [390 U.S. 333](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390333/usrep390333.pdf) (per curiam): affirmed, the three-judge court''s decree that Alabama''s statutes requiring segregation in prisons and jails violate the Fourteenth Amendment, with its schedule for desegregating them.'
    n: 'Opinion. *Washington v. Lee*, [263 F. Supp. 327](https://static.case.law/f-supp/263/case-pdfs/0327-01.pdf) (M.D. Ala. 1966), the decree. To check: [[w.bass-taming-the-storm]].'
    tags: [state:al]
  - id: cal.1968-03-11.vietnam-operations
    when: Mar. 11
    date: '1968-03-11'
    thread: vietnam-operations
    c: 'Quyết Thắng, the largest allied operation yet in III Corps, around Saigon: six American and ten South Vietnamese brigade equivalents, Weyand''s and Khang''s sweeps merged at Westmoreland''s direction. By Apr. 7, some 1,420 of the enemy killed, over 500 weapons, about 107 tons of rice.'
    n: '[[w.villard-united-states-army-in]], 460–463; [[w.vietnam-victory-in-vietnam]], 228 (the sweeps around Saigon from Mar. 11). Names: Weyand, Westmoreland.'
    src:
      c: 636625b6
      rows:
        - 'w.villard-united-states-army-in 460–463: all'
        - 'w.vietnam-victory-in-vietnam 228: A'
    tags: [name:weyand-frederick-c, name:westmoreland-william, place:saigon, province:hau-nghia, province:long-an]
