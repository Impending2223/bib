    thread: state-and-city-finance
    c: Kentucky. Nunn, who had campaigned against new taxes, has the General Assembly raise the sales tax from 3 to 5 percent and the motor vehicle license from $5 to $12.50, against a deficit of $24 million projected by the Breathitt administration. He vetoes a quarter of the session's bills.
    n: '*Journal of the House of Representatives of the Commonwealth of Kentucky*, 1968, [425–26](https://archive.org/details/jhouseky1968v1/page/425/mode/1up) (Nunn''s message, Feb. 18: the sales tax from 3 to 5 cents, motor vehicle licenses from $5 to $12.50); [1875–76](https://archive.org/details/jhouseky1968v2/page/1875/mode/1up) (H.B. 399, "relating to revenue and taxation," passed by the House, Mar. 6, 56–41); [2573](https://archive.org/details/jhouseky1968v2/page/2573/mode/1up) (the Senate''s passage announced, Mar. 14). [Wikipedia, "Louie Nunn"](https://en.wikipedia.org/wiki/Louie_Nunn). Check: the Senate''s vote and the Governor''s approval, *Kentucky Acts*, 1968. Check: Nunn''s message speaks of the $24 million cutback Breathitt directed (425), not a deficit. To check: [[w.harrison-new-history-of-kentucky]]. See [[cal.1967-11-07.governors-ky]]. Names: Nunn, Breathitt.'
