  - id: cal.1968-03-31.elections-1968
    when: Mar. 31
    date: '1968-03-31'
    thread: elections-1968
    also: [vietnam-205000]
    c: 'Address to the nation, 9 p.m. No attacks on North Vietnam, "unilaterally, and at once," but in "the area north of the demilitarized zone" where the enemy''s buildup threatens allied positions; Clifford''s order to the Joint Chiefs, effective 7 p.m.: no strikes north of the 20th parallel. Harriman to represent the United States at talks, Thompson to join him "at Geneva or any other suitable place." About 13,500 more support troops in five months, some from reserve units called up; $2.5 billion more in fiscal 1968, $2.6 billion in 1969; the surcharge urged. "I shall not seek, and I will not accept, the nomination of my party for another term as your President."'
    n: 'The President''s Address to the Nation Announcing Steps To Limit the War in Vietnam and Reporting His Decision Not To Seek Reelection, [1968–69 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=547); The President''s News Conference, [1968–69 Pub. Papers 476](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=554) (Mar. 31, 1968). FRUS 1964–68, VI, docs. [168](https://history.state.gov/historicaldocuments/frus1964-68v06/d168), [169](https://history.state.gov/historicaldocuments/frus1964-68v06/d169). [Johnson and Rockefeller, 11:59 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nelson-rockefeller-april-1-1968), Conversation WH6803-06-12859 (Miller Center). [President''s Daily Diary, Mar. 31, 1968](https://catalog.archives.gov/id/192475), images 10, 17 (LBJ Library; National Archives Catalog). [[w.frankum-like-rolling-thunder]], 59, 61 (the address; the strikes north of the 20th ended; not to run); [[w.cosmas-joint-chiefs-of-staff]], 171–172 (the address; Harriman; the troops and the cost); [[w.drea-mcnamara-clifford-and-the-2011]], 190, 225 (the address, the bombing limited, part of the reinforcement from the reserves, no other term); [[w.poole-joint-chiefs-of-staff-2012]], 59 (the bombing curtailed; the 13,500; not to run); [[w.johnson-vantage-point]], 425–37; [[w.dallek-flawed-giant]], 513, 529. To check: [[w.schandler-unmaking-of-a-president]]; [[w.clifford-counsel-to-the-president-2]]; [[w.christian-president-steps-down]]; [[w.mcpherson-political-education]]; [[w.hoopes-limits-of-intervention]]; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]; [[w.woods-lbj]]; [[w.lafeber-deadly-bet]]; [[w.gould-1968]]; [[w.kaiser-1968-in-america]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]. See [[cal.1968-01-30.vietnam]]. Names: Johnson, Clifford, Harriman, Thompson.'
