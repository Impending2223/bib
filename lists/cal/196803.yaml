  - id: cal.1968-03-31.robert-kennedy
    when: Mar. 31
    date: '1968-03-31'
    thread: robert-kennedy-campaign
    also: [elections-1968]
    c: 'Robert Kennedy, landing at La Guardia shortly before ten, hears from Burns that Johnson will not run. That night, from his apartment, calls to party leaders and a telegram to Johnson proposing a meeting. The telegram, 11:43 p.m.: "Your decision regarding the Presidency subordinates self to country and is truly magnanimous. I respectfully and earnestly request an opportunity to visit you as soon as possible."'
