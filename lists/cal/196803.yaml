    date: '1968-03-28'
    thread: students
    also: [desegregation-schools]
    c: 'Los Angeles. The Board of Education hears the Educational Issues Coordinating Committee''s 39 demands. Thirteen organizers of the walkouts, Castro, a teacher at Lincoln, among them, later indicted for conspiracy (Check the date: May 31; Wikipedia''s timeline gives their arrest as Mar. 31).'
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts); Check: the board''s minutes, Mar. 28, 1968, and its answer; the grand jury''s indictment. See [[cal.1968-03-01.students-los-angeles]]. Names: Castro.'
    tags: [state:ca, city:los-angeles, name:castro-sal]
  - id: cal.1968-03-28.king
    when: Mar. 28
    date: '1968-03-28'
    thread: king
    also: [king-memphis, king-poor-peoples]
    c: King, from Memphis, on the march with Hosea Williams in Atlanta. Williams tells Jim Harrison, SCLC's comptroller and a paid FBI informant; Harrison tells his control agent. FBI headquarters orders full information on King's part in the march, for leaks to cooperative reporters against the Poor People's Campaign.
