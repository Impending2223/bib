    when: Mar. 18
    date: '1968-03-18'
    thread: economy-gold
    c: 'The gold cover act signed, [82 Stat. 50](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg50.pdf): no gold reserve behind Federal Reserve notes.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1968-03-14.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
