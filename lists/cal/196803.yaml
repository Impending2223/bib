    date: '1968-03-07'
    thread: vietnam-congress
    also: [vietnam-205000]
    c: 'The Senate on the reported request for more troops. Fulbright: the Gulf of Tonkin resolution, "like any contract based on misrepresentation, in my opinion, is null and void." Case: whether the war "is winnable without the destruction of South Vietnam." Church: Congress has "abdicated that responsibility." Hatfield: not "the decision of one man." Tower, for the escalation reported. Mansfield: "We are in the wrong place, and we are fighting the wrong kind of war."'
    n: '[114 Cong. Rec. 5644–61](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt5/pdf/GPO-CRECB-1968-pt5-2-1.pdf#page=14) (1968). [[w.mann-grand-delusion]], 582–85. See [[cal.1968-03-07.robert-kennedy]]. Names: Fulbright, Case, Church, Hatfield, Tower, Mansfield.'
