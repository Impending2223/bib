  - id: cal.1968-03-28.king-memphis
    when: Mar. 28
    date: '1968-03-28'
    thread: king-memphis
    also: [civil-disorders]
    c: Memphis. The march from Clayborn Temple, King at its head, breaks up as windows are smashed and stores looted on Beale and Main Streets; the police with clubs, tear gas and Mace; a youth of sixteen shot dead by a policeman; some sixty hurt and nearly three hundred arrested (Check the counts); Ellington sends the Guard; Loeb a curfew. King, led away, says he will lead another march.
    n: '[*New York Times*, Mar. 29, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/29/issue.html). [[w.garrow-bearing-the-cross]], 609–11 (the march, the windows and the looting on Beale, the police, a young man shot dead, King led away). Check: Garrow, 611, 613, has the second march resolved that night at the Holiday Inn Rivermont and announced at King''s press conference, Mar. 29. See [[cal.1968-03-18.king]]. Names: King, Ellington, Loeb.'
    tags: [name:king-martin-luther-jr, name:ellington-buford, name:loeb-henry, state:tn, city:memphis]
  - id: cal.1968-03-28.students-los-angeles
