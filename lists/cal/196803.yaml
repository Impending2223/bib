    when: Mar. 12
    date: '1968-03-12'
    thread: open-housing
    c: 'Johnson to the Speaker: pass the Senate''s bill.'
    n: 'Letter to the Speaker of the House Urging Prompt Action on the Civil Rights Bill, [1968–69 Pub. Papers 380](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=458) (Mar. 12, 1968). See [[cal.1968-02-06.open-housing]]. Names: McCormack, Johnson.'
