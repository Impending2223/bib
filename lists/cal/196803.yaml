  - id: cal.1968-03-12.elections-1968-2
    when: Mar. 12–13
    date: '1968-03-12'
    thread: elections-1968
    also: [robert-kennedy]
    c: 'New Hampshire. McCarthy wins twenty of the State''s twenty-four delegates to the convention; Johnson, not on the ballot, his name written in. Mar. 13, Robert Kennedy: he is "reassessing" whether to run (Check the word).'
    n: '[*New York Times*, Mar. 13, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/13/issue.html); [Mar. 14, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/14/issue.html). FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). To check: [[w.herzog-mccarthy-for-president]]; [[w.larner-nobody-knows]]; [[w.mccarthy-year-of-the-people]]. See [[cal.1968-03-12.elections-1968]]; [[cal.1967-11-30.elections-1968]]. Names: McCarthy, Johnson, Kennedy.'
