    when: Mar. 12
    date: '1968-03-12'
    thread: states-and-cities
    also: [conservation, oil]
    c: 'Alaska. Atlantic Richfield and Humble Oil confirm oil at Prudhoe Bay State No. 1, on State land on the North Slope (Check: the day of the announcement).'
    n: '[Wikipedia, "Prudhoe Bay Oil Field"](https://en.wikipedia.org/wiki/Prudhoe_Bay_Oil_Field). To check: [[w.coates-trans-alaska-pipeline-controversy]]; [[w.naske-alaska]]; [[w.hickel-who-owns-america]].'
