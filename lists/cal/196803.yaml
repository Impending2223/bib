ord''s views and had William Bundy draft a cable to Bunker; that evening, alone with Johnson, he advised the second draft, and Johnson told him to send the cable ([[w.rusk-as-i-saw-it-1990]], 481–82). Check: McPherson counts Rostow among the five at the meeting (433, 435); FRUS''s note names four.'
