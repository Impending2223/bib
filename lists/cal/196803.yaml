  - id: cal.1968-03-16.vietnam
    when: Mar. 16
    date: '1968-03-16'
    thread: vietnam
    c: Quảng Ngãi Province. Charlie Company, 1st Battalion, 20th Infantry, of the Americal Division's Task Force Barker, in the hamlets of Sơn Mỹ village, Mỹ Lai 4 among them, kills some 350 to 500 unarmed villagers, most of them women, children and old men; Calley's platoon among the first. Thompson, an Army helicopter pilot, lands between the soldiers and a group of villagers. The task force reports 128 of the enemy killed.
    n: '[[w.peers-report-of-the-dept]], [2-1 to 2-4](https://tile.loc.gov/storage-services/service/ll/llmlp/RDAR-Vol-I/RDAR-Vol-I.pdf#page=29) (the Library of Congress''s copy) (the operation of Mar. 16 by Task Force Barker, of the Americal Division''s 11th Brigade, in Sơn Mỹ; C/1-20 Infantry in Mỹ Lai (4); the dead almost all old men, women and children; Thompson''s complaints). Made public: Ridenhour''s letter to members of Congress, Mar. 29, 1969; the Army''s charge against Calley, Sept. 1969; Hersh''s story for the Dispatch News Service, Nov. 13, 1969. To check: [[w.hersh-my-lai-4]]; [[w.hersh-cover-up]]; [[w.bilton-four-hours-in-my]]; [[w.belknap-vietnam-war-on-trial]]; [[w.angers-forgotten-hero-of-my]]; [[w.allison-my-lai]]; [[w.jones-my-lai]]. Names: Calley, Thompson. Check: Peers, 2-3, has at least 175–200 killed by C Company in Mỹ Lai (4), the CID''s estimates over 400 in all of Sơn Mỹ.'
    src:
      c: 6a728f8f
      rows:
        - 'https://tile.loc.gov/storage-services/service/ll/llmlp/RDAR-Vol-I/RDAR-Vol-I.pdf#page=29: A-B'
    tags: [name:calley-william-l-jr, name:thompson-hugh-jr, place:son-my-my-lai]
