    date: '1968-03-20'
    thread: opinion
    also: [vietnam, jobs-and-wages, farm, labor-disputes]
    c: 'Gallup, two releases. Feb. 22–27: go all-out to win a military victory in Vietnam, using atom bombs and weapons: agree 27 percent, disagree 65. Public school teachers permitted to strike: should 36, should not 57. Nurses permitted to strike, 29 and 66; to join unions, 59 and 34. Farmers to establish a nationwide union: should 48, should not 35; farmers 53 and 39. Jan. 4–9, no strike to go on more than 21 days, then a committee appointed by the courts to decide, binding on both: favor 69, oppose 22.'
