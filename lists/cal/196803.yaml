  - id: cal.1968-03-04.vietnam
    when: Mar. 4–5
    date: '1968-03-04'
    thread: vietnam-205000
    also: [defense]
    c: 'Clifford''s group reports on Westmoreland''s request for 205,000 more men. Its draft memorandum: some 22,000 to Vietnam at once; a call-up of about 262,000 reservists, higher draft calls, enlistments extended; the rest of the request to wait on events; the strategic guidance to Westmoreland to be studied anew. Clifford: "We seem to have a sinkhole. We put in more—they match it." Rusk: the bombing of the North might be stopped during its rainy season; Johnson: "Really get on your horses on that."'
    n: '[[w.johnson-vantage-point]], 396–99; [[w.herring-lbj-and-vietnam]], 160, 162 (the report: 22,000 now, the reserves; "We seem to have a sinkhole"; a "whole new look"; Rusk''s partial halt first proposed Mar. 4); [[w.rusk-as-i-saw-it-1990]], 479–80 (Rusk''s proposal; Johnson''s reply); [[w.woods-j-william-fulbright-vietnam]], 171 (Clifford: Westmoreland and the Chiefs over-optimistic; more men down a rathole; a million in Vietnam by the year''s end; Johnson does not protest); [[w.berman-lyndon-johnsons-war]], 179–80 (22,000 more, three tactical fighter squadrons, 262,000 reserves; Clifford: "We are not convinced that our present policy will bring us to that objective"; "We seem to have a sinkhole"); [[w.woods-fulbright]], 481 (Clifford: a million Americans in Vietnam by the year''s end); [[w.bernstein-guns-or-butter]], 479 (Clifford and Warnke''s three points; Fowler on the reserves'' cost; Rusk on the rainy season); [[w.drea-mcnamara-clifford-and-the-2011]], 187 (the draft memorandum: the bombing on, 22,000 men by May 1, 262,000 reservists, more than 30,000 for Korea); [[w.drea-mcnamara-clifford-and-the-2011]], 223 (the report leaves the air war undecided; Rusk: the bombing could stop in the rainy season). [[w.longley-lbjs-1968]], 72–73 (Warnke''s draft, read to Clifford and Wheeler Mar. 1; the report; the sinkhole; the rainy season). Made public: FRUS 1964–68, VI (2002). [[w.clifford-counsel-to-the-president-2]], 492–96 (the task force, Mar. 2–4; the meeting late that Monday, Tom Johnson''s notes quoted: "We seem to have gotten caught in a sinkhole"; Fowler; Wheeler; Nitze for a halt; Rusk''s rainy season; Johnson: "Dean, I want you to really get on your horse on that one"). [FRUS 1964–68, VI, doc. 103](https://history.state.gov/historicaldocuments/frus1964-68v06/d103); [doc. 104](https://history.state.gov/historicaldocuments/frus1964-68v06/d104); [doc. 105](https://history.state.gov/historicaldocuments/frus1964-68v06/d105). See [[cal.1968-02-27.vietnam]]. Names: Clifford, Westmoreland, Rusk, Johnson. Check: Johnson gives a call-up of "about 245,000" (397); the draft memorandum, about 262,000, or 242,000 without the naval increases (doc. 103). Check: by Rusk''s account he proposed limiting the bombing to the areas "integrally related to the battlefield" and gave Johnson a passage for a speech; Johnson: "Get on your horses and let''s get something ready" ([[w.rusk-as-i-saw-it-1990]], 479–80).'
