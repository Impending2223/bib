    c: 'The statement withdrawing from the race, by Busby''s account. In the West Hall in the morning, Johnson: "I want out of this cage"; Busby to work the January statement over with Christian; the chances of going through with it "eighty-twenty against." The last line''s "will not accept" changed to "would" ("too presumptuous") and put back in the evening. At lunch the Krims and Luci Nugent argue against it. Connally, asked through Christian: "Tonight is better than tomorrow night."'
