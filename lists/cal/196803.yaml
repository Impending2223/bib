    date: '1968-03-12'
    thread: specials
    also: [mississippi]
    c: 'Mississippi 3rd, special run-off. Charles H. Griffin (D), administrative assistant to John Bell Williams (D), takes the seat Williams resigned Jan. 16 to become Governor, over Charles Evers (D), the NAACP''s field secretary, brother of Medgar Evers, 87,713 to 43,303, 66.9 percent. The first round, Feb. 27 (Check the date), all candidates on one ballot, a majority needed: Evers over Griffin, 33,706 to 28,927, 29.3 percent; Ellis Bodron 22,842, 19.9 percent; three others.'
    n: 'Votes: CQ Guide 6th (2010) 1284, 1286 n.1. Check: the Mississippi secretary of state''s returns. [[w.dittmer-local-people]], 420. To check: [[w.crespino-in-search-of-another]]. See [[cal.1968-02-20.specials]]. Names: Griffin, John Bell Williams, Charles Evers, Medgar Evers.'
