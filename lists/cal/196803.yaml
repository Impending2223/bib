    n: '[*New York Times*, Mar. 10, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/10/issue.html). [[w.cosmas-joint-chiefs-of-staff]], 165 (the story; the debates); [[w.drea-mcnamara-clifford-and-the-2011]], 187 (the article of Mar. 10); [[w.poole-joint-chiefs-of-staff-2012]], 59 (the story). To check: [[w.schandler-unmaking-of-a-president]]; [[w.braestrup-big-story]]; [[w.hammond-public-affairs]]. See [[cal.1968-01-30.vietnam]]. Names: Westmoreland.'
