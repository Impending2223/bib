    c: Clifford sworn in as Secretary of Defense in the East Room; McNamara gone to the World Bank.
    n: 'Remarks at the Swearing In of Clark Clifford as Secretary of Defense, [1968–69 Pub. Papers 301](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=379) (Mar. 1, 1968). See [[cal.1968-01-19.defense]]. Names: Clifford, McNamara, Johnson.'
    tags: [name:clifford-clark, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1968-03-01.open-housing
    when: Mar. 1
    date: '1968-03-01'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516, the Dirksen substitute: Titles I, the federally protected activities, and II, fair housing. Cloture short of two-thirds, [59–35](https://voteview.com/rollcall/RS0900322).'
    n: 'See [[cal.1968-02-06.open-housing]]; [[cal.1967-02-15.open-housing]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-03-01.students-los-angeles
    when: Mar. 1
    date: '1968-03-01'
    thread: students
    also: [desegregation-schools]
    c: Los Angeles. Mexican American students walk out of Wilson High School, on the East Side.
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). To check: [[w.haney-lopez-racism-on-trial]]; [[w.garcia-blowout]]; [[w.felker-kantor-policing-los-angeles]].'
    tags: [state:ca, city:los-angeles]
  - id: cal.1968-03-03.opinion
    when: Mar. 3
    date: '1968-03-03'
    thread: opinion
    also: [crime-and-hijacking, court]
    c: 'Gallup, Feb. 1–6: the courts in this area deal with criminals not harshly enough 63 percent, about right 19, too harshly 2. Steps to reduce crime, the five named most often: correct social and economic conditions 18; more parental control 18; changes in the courts, a freer hand for the police, 17; a larger police force 15; more severe penalties 13.'
    n: '[[w.gallup-poll]], III, 2108.'
  - id: cal.1968-03-04.vietnam
    when: Mar. 4–5
    date: '1968-03-04'
    thread: vietnam-205000
    also: [defense]
    c: 'Clifford''s group reports on Westmoreland''s request for 205,000 more men. Its draft memorandum: some 22,000 to Vietnam at once; a call-up of about 262,000 reservists, higher draft calls, enlistments extended; the rest of the request to wait on events; the strategic guidance to Westmoreland to be studied anew. Clifford: "We seem to have a sinkhole. We put in more—they match it." Rusk: the bombing of the North might be stopped during its rainy season; Johnson: "Really get on your horses on that."'
    n: 'FRUS 1964–68, VI, docs. [103](https://history.state.gov/historicaldocuments/frus1964-68v06/d103), [104](https://history.state.gov/historicaldocuments/frus1964-68v06/d104), [105](https://history.state.gov/historicaldocuments/frus1964-68v06/d105). [[w.johnson-vantage-point]], 396–99. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Clifford, Westmoreland, Rusk, Johnson. Check: Johnson gives a call-up of "about 245,000" (397); the draft memorandum, about 262,000, or 242,000 without the naval increases (doc. 103).'
    src:
      c: 1698264d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d103: all'
        - 'w.johnson-vantage-point 397–99: A-B, D-E, G-H'
    tags: [name:clifford-clark, name:westmoreland-william, name:rusk-dean, name:johnson-lyndon-b, name:nitze-paul]
  - id: cal.1968-03-04.open-housing
    when: Mar. 4
    date: '1968-03-04'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516: cloture invoked on the Dirksen substitute, [65–32](https://voteview.com/rollcall/RS0900323), the fourth vote. The single owner''s home exempted from fair housing, refused, [38–56](https://voteview.com/rollcall/RS0900324).'
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-03-04.black-nationalism
    when: Mar. 4
    date: '1968-03-04'
    thread: black-nationalism
    also: [king]
    c: 'The FBI''s counterintelligence program against black nationalist groups widened from twenty-three field offices to forty-one. Its long-range goals: to prevent a coalition of the groups; to prevent the rise of a "messiah" who could "unify, and electrify," the movement, King, Carmichael and Elijah Muhammad named; to prevent violence; to keep the groups and leaders from "respectability"; to prevent their growth among the young.'
    n: 'Memorandum, FBI Headquarters to the field offices, Mar. 4, 1968, as quoted in [S. Rep. No. 94-755, Book III, 21–22 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=25). Made public: the Church Committee, *Supplementary Detailed Staff Reports on Intelligence Activities and the Rights of Americans*, Book III (1976). See [[cal.1967-08-25.black-nationalism]]. Names: King, Carmichael, Elijah Muhammad, Hoover.'
    tags: [name:king-martin-luther-jr, name:carmichael-stokely, name:muhammad-elijah, name:hoover-j-edgar]
  - id: cal.1968-03-04.health
    when: Mar. 4
    date: '1968-03-04'
    thread: health
    c: 'Message on health, "Health in America." Asked: a Child Health Act, the care of poor mothers and infants, $58 million more for maternal and child health in fiscal 1969; family planning, from $25 million to $61 million; a Health Manpower Act; new ways of paying doctors and hospitals under Medicare and Medicaid; a reasonable cost range for the drugs those programs buy, and a United States Compendium of Drugs.'
    n: '[Special Message to the Congress: "Health in America"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-health-america) (Mar. 4, 1968). To check: [[w.blumenthal-heart-of-power]]; [[w.califano-triumph-and-tragedy-of]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-04.opinion
    when: Mar. 4
    date: '1968-03-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 22–27: the Republican convention''s choice narrowed to Nixon and Rockefeller: Nixon 48 percent, Rockefeller 44; Republicans 67 and 30; independents 45 and 47. Republicans'' choice from eight: Nixon 49, Rockefeller 22, Reagan 11, Romney 7, Percy 4, Lindsay 3, Hatfield 1, Stassen 1.'
    n: '[[w.gallup-poll]], III, 2108–09. Names: Nixon, Rockefeller, Reagan, Romney, Percy, Lindsay, Hatfield, Stassen.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:reagan-ronald, name:romney-george-w, name:percy-charles-h, name:lindsay-john-v, name:hatfield-mark-o, name:stassen-harold-e]
  - id: cal.1968-03-04.king-poor-peoples
    when: Mar. 4
    date: '1968-03-04'
    thread: king-poor-peoples
    also: [civil-disorders-kerner]
    c: 'King on the Kerner report: its finding that white racism is the root of the riots "an important confession of a harsh truth." The campaign''s first phase "a lobby-in against Congress" from its return, Apr. 22; three caravans, from Milwaukee, Boston and Mississippi, by car, foot and mule cart, in Washington early in May.'
    n: '[[w.garrow-bearing-the-cross]], 600. To check: King, "Statement," Mar. 4, 1968 (King Papers; SCLC), as Garrow cites it (718 n.29). See [[cal.1967-12-04.king]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1968-03-05.students-los-angeles
    when: Mar. 5–8
    date: '1968-03-05'
    thread: students
    also: [desegregation-schools]
    c: 'Los Angeles. The walkouts spread through the East Side''s high schools: Garfield, some 2,000, Mar. 5; Lincoln, Roosevelt and Garfield, Mar. 6; Belmont, Mar. 7; again Mar. 8.'
    n: '[Wikipedia, "East L.A. walkouts"](https://en.wikipedia.org/wiki/East_L.A._walkouts). See [[cal.1968-03-01.students-los-angeles]].'
    tags: [state:ca, city:los-angeles]
  - id: cal.1968-03-05.open-housing
    when: Mar. 5
    date: '1968-03-05'
    thread: open-housing
    also: [civil-disorders]
    c: 'Senate, H.R. 2516: the anti-riot amendment, the intent to incite a riot to be proved, [82–13](https://voteview.com/rollcall/RS0900326).'
    n: See [[cal.1968-02-06.open-housing]].
  - id: cal.1968-03-06.transition-and-staff
    when: Mar. 6
    date: '1968-03-06'
    thread: transition-and-staff
    c: C. R. Smith, chairman of American Airlines, sworn in as Secretary of Commerce, for Trowbridge, who resigned for his health.
    n: 'Remarks at the Swearing In of Cyrus R. Smith as Secretary of Commerce, [1968–69 Pub. Papers 348](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=426) (Mar. 6, 1968). See [[cal.1968-02-16.transition-and-staff]]. Names: Smith, Trowbridge, Johnson.'
    tags: [name:smith-c-r, name:trowbridge-alexander-b, name:johnson-lyndon-b]
  - id: cal.1968-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1968-03-06'
    thread: civil-rights-the-executive
    c: 'Message on the American Indian, "The Forgotten American": unemployment among Indians nearly 40 percent; the average age at death 44, for other Americans 65. A new goal: an end to the debate over "termination," and "self-determination." Executive Order 11399: a National Council on Indian Opportunity, the Vice President its chairman, with the Secretaries of the Interior, Agriculture, Commerce, Labor, Health, Education, and Welfare, and Housing and Urban Development, the Director of the Office of Economic Opportunity, and six Indians (Check the members).'
    n: '[Special Message to the Congress on the Problems of the American Indian: "The Forgotten American"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-problems-the-american-indian-the-forgotten-american); [Executive Order 11399](https://www.presidency.ucsb.edu/documents/executive-order-11399-establishing-the-national-council-indian-opportunity) (Mar. 6, 1968). To check: [[w.clarkin-federal-indian-policy-in]]; [[w.cobb-native-activism-in-cold]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1968-03-06.vietnam
    when: Mar. 6
    date: '1968-03-06'
    thread: vietnam
    also: [congress]
    c: 'Johnson with Fulbright, Mansfield, Sparkman, Aiken and Hickenlooper, on Rusk''s coming testimony and the Gulf of Tonkin Resolution: "I sent up the resolution on Southeast Asia because I told the Security Council members that I was not going to commit troops" without Congress.'
    n: 'FRUS 1964–68, VI, doc. [109](https://history.state.gov/historicaldocuments/frus1964-68v06/d109). To check: [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.schoenbaum-waging-war-and-peace]]. Names: Johnson, Fulbright, Mansfield, Sparkman, Aiken, Hickenlooper, Rusk.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:mansfield-mike, name:sparkman-john, name:aiken-george-d, name:hickenlooper-bourke-b, name:rusk-dean]
  - id: cal.1968-03-07.testing
    when: Mar. 7
    date: '1968-03-07'
    thread: testing-npt
    also: [soviet-union]
    c: The nonproliferation treaty. At Geneva, before the Eighteen-Nation Disarmament Committee, the United States, the Soviet Union and Britain propose a Security Council resolution on security assurances to non-nuclear states that sign. Foster for the United States.
    n: '[[w.department-of-state-bulletin]], [Mar. 25, 1968, 401](https://archive.org/details/departmentofstat581968unit/page/401/mode/1up) (Foster''s statement of Mar. 7, U.S./U.N. press release 34). To check: [[w.seaborg-stemming-the-tide]]. See [[cal.1968-01-18.testing]]. Names: Foster.'
    tags: [name:foster-william-c]
  - id: cal.1968-03-08.conservation
    when: Mar. 8
    date: '1968-03-08'
    thread: conservation
    c: 'Message on conservation, "To Renew a Nation." Asked: $1.5 to $2 billion of community waste treatment plants built this year; a National Water Commission; a Safe Drinking Water Act; the Central Arizona Project; laws against oil spills; a Surface Mining Reclamation Act; the Solid Waste Disposal Act extended; the highway beautification program continued.'
    n: 'Special Message to the Congress on Conservation: "To Renew a Nation", [1968–69 Pub. Papers 355](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=433) (Mar. 8, 1968). To check: [[w.gould-lady-bird-johnson-and]]. See [[cal.1967-11-21.conservation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-08.open-housing
    when: Mar. 8
    date: '1968-03-08'
    thread: open-housing
    also: [congress]
    c: 'Senate, H.R. 2516: six titles on the rights of American Indians, [81–0](https://voteview.com/rollcall/RS0900344); Ervin''s substitute, without fair housing, refused, [24–64](https://voteview.com/rollcall/RS0900339); the Dirksen substitute adopted, [61–19](https://voteview.com/rollcall/RS0900345).'
    n: 'See [[cal.1968-02-06.open-housing]]. Names: Ervin, Dirksen.'
    tags: [name:ervin-sam-j-jr, name:dirksen-everett]
  - id: cal.1968-03-08.elections-1968
    when: Mar. 8
    date: '1968-03-08'
    thread: elections-1968
    c: 'Johnson tells his aides to go ahead: organizing for the primaries and the convention''s delegates.'
    n: '[[w.dallek-flawed-giant]], 527. See [[cal.1967-09-08.elections-1968]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-03-08.vietnam-205000
    when: Mar. 8
    date: '1968-03-08'
    thread: vietnam-205000
    c: 'Johnson with his senior advisers on Vietnam. Clifford and the Chiefs: 33,000 more men, not 22,000, with selected reserves called. Johnson: "I am not going to approve 205,000."'
    n: '[[w.johnson-vantage-point]], 402, by Johnson''s account. See [[cal.1968-02-27.vietnam]]. Names: Johnson, Clifford.'
