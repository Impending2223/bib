    c: The nonproliferation treaty. At Geneva, before the Eighteen-Nation Disarmament Committee, the United States, the Soviet Union and Britain propose a Security Council resolution on security assurances to non-nuclear states that sign. Foster for the United States.
    n: '[[w.department-of-state-bulletin]], [Mar. 25, 1968, 401](https://archive.org/details/departmentofstat581968unit/page/401/mode/1up) (Foster''s statement of Mar. 7, U.S./U.N. press release 34). To check: [[w.seaborg-stemming-the-tide]]. See [[cal.1968-01-18.testing]]. Names: Foster.'
    tags: [name:foster-william-c]
