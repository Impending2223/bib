    n: '[*New York Times*, Mar. 17, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/17/issue.html). FRUS 1964–68, VI, doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v06/d123). [Johnson and Daley, 5:00 p.m., Mar. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-and-office-conversation-march-13), Conversation WH6803-02-12810 (Miller Center). [[w.schlesinger-robert-kennedy-and-his]], 851–57 (the meeting with Clifford, by Clifford''s memorandum; Johnson''s refusal; Sorensen with Johnson, Mar. 11; the Caucus Room; not the quotation); [[w.dallek-flawed-giant]], 527–28 (Kennedy to Clifford, Mar. 14; Johnson''s refusal; the announcement); [[w.clifford-counsel-to-the-president-2]], 502–05 (Edward Kennedy''s call before midnight, Mar. 13; Johnson and Fortas in the bedroom, Mar. 14; the meeting at 11 a.m., the ten names; Clifford''s three comments; Johnson, Humphrey and Fortas at 3:30 p.m.; Clifford''s call to Sorensen and Kennedy, Johnson listening; Sorensen with Johnson, Mar. 11; the announcement, Mar. 16); [[w.white-making-of-the-president-1969]], 163–64, 166 (Mar. 13, Kennedy to Daley, Daley to Johnson; Mar. 14, nearly two hours with Clifford; Johnson''s no at five; the Caucus Room); [[w.shesol-mutual-contempt]], 420 (from Clifford''s memorandum of the meeting; it and his memoirs differ); [[w.thomas-robert-kennedy]], 359–60 (the peace commission, from Clifford''s memorandum; the Senate Caucus Room reserved); [[w.branch-at-canaans-edge]], 710 (Johnson listening on an extension); [[w.shesol-mutual-contempt]], 422–23 (the announcement: "I do not run for the Presidency merely to oppose any man but to propose new policies"; "My decision reflects no personal animosity or disrespect toward President Johnson"; at the press conference after: "it''s been put in the context of a personal struggle between myself and President Johnson"); [[w.bernstein-guns-or-butter]], 501 (the Caucus Room; "I do not run for the Presidency merely to oppose any man"); [[w.thomas-robert-kennedy]], 360 ("I do not run for the presidency merely to oppose any man, but to propose new policies"). [[w.longley-lbjs-1968]], 76–78 (Sorensen with Johnson, Mar. 11, by Shesol''s account; Kennedy and Sorensen with Clifford; Johnson''s refusal; the announcement); [[w.palermo-in-his-own-right]], 135–37, 143–44 (the meeting at the Pentagon at eleven, by Clifford''s memorandum, and its list; Johnson''s refusal, with Fortas and Humphrey; the Caucus Room and the quotation). [[w.chester-american-melodrama]], 120–24 (Daley''s idea of Feb. 8; Sorensen and Johnson, Mar. 11; the meeting of Mar. 14, both accounts; the refusal by telephone that night). Check: Bernstein dates the announcement Mar. 15 (501) and Mar. 16 (480, 505). To check: [[w.witcover-85-days]]; [[w.newfield-robert-kennedy]]; [[w.clarke-last-campaign]]; New York Times, March 18, 1968, p. 1 (cited by [[w.branch-at-canaans-edge]], 710); "Statement of Senator Robert F. Kennedy, Washington, DC, March 16, 1968," Edelman Papers, box 11, JFK Library; "Transcript, 3/16 RFK Announcement, Senate Caucus," 1968 Presidential Campaign Files, Media Division, box 3, JFK Library (cited by [[w.shesol-mutual-contempt]], 422); The White House account of the Clifford meeting of Mar. 14, 1968 (cited by [[w.chester-american-melodrama]], 121); Robert Kennedy''s office''s account of the Sorensen and Clifford meetings, Mar. 1968 (cited by [[w.chester-american-melodrama]], 121). Names: Kennedy, Sorensen, Clifford, Johnson. Check: Palermo, 136, has Edward Kennedy telephoning Clifford at home on the evening of Mar. 13, and the commission Daley''s idea of early February.'
