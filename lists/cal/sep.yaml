# Cal. XI September 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XI
entries:
  - id: cal.1961-09-01.testing
    when: Sept. 1
    date: '1961-09-01'
    thread: testing
    c: The Soviet Union ends the three-year moratorium with an atmospheric test. The Belgrade nonaligned conference opens the same day.
    n: 'Seaborg, *Kennedy, Khrushchev, and the Test Ban* (K–J Adm. II.D). [FRUS vol. 7](https://history.state.gov/historicaldocuments/frus1961-63v07). Names: Wiesner (K–J Adm. III.B).'
  - id: cal.1961-09-03.economy
    when: Sept. 3
    date: '1961-09-03'
    thread: economy
    c: 'The 1961 minimum wage takes effect: $1.15 an hour, $1.25 from 1963. Newly covered retail and service workers start at $1.00.'
    n: '[Pub. L. No. 87-30, 75 Stat. 65](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg65.pdf) (1961). [Statement by the President on the Increase in the Minimum Wage](https://www.presidency.ucsb.edu/documents/statement-the-president-the-increase-the-minimum-wage). See [[cal.1961-03-24.program]] (Program) and [[cal.1961-05-05.space]] (Space).'
  - id: cal.1961-09-04.foreign-aid
    when: Sept. 4
    date: '1961-09-04'
    thread: foreign-aid
    c: Foreign Assistance Act signed. AID created; Congress denies the Treasury borrowing, granting long-term authorizations instead.
    n: '[Pub. L. No. 87-195, 75 Stat. 424](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg424-2.pdf) (K–J Cong. II.J.2). See [[cal.1961-03-22.foreign-aid]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-05.testing
    when: Sept. 5
    date: '1961-09-05'
    thread: testing
    c: Kennedy orders U.S. testing resumed, underground and in the laboratory.
    n: '[Statement by the President on Ordering Resumption of Underground Nuclear Tests](https://www.presidency.ucsb.edu/documents/statement-the-president-ordering-resumption-underground-nuclear-tests) (Sept. 5, 1961). See [[cal.1961-09-01.testing]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-05.crime-and-hijacking
    when: Sept. 5
    date: '1961-09-05'
    thread: crime-and-hijacking
    c: Aircraft piracy made a federal crime.
    n: '[Pub. L. No. 87-197, 75 Stat. 466](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg466.pdf) (1961).'
  - id: cal.1961-09-06.steel
    when: Sept. 6
    date: '1961-09-06'
    thread: steel
    c: Kennedy writes the heads of twelve steel companies asking them to hold prices when the October wage step comes.
    n: '[Letter to Leaders of the Steel Industry on the Need for Price Stability](https://www.presidency.ucsb.edu/documents/letter-leaders-the-steel-industry-the-need-for-price-stability). McConnell, *Steel and the Presidency*; Rowen, *Free Enterprisers*; Heath, *Kennedy and the Business Community* (K–J Adm. II.B). Names: Goldberg (K–J Adm. III.G); Heller (K–J Adm. III.H).'
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-07.states-and-cities
    when: Sept. 7
    date: '1961-09-07'
    thread: states-and-cities
    c: New York primary. Mayor Wagner, running against Tammany, beats Levitt; DeSapio loses his own district leadership to the reformers.
    n: 'Wilson, *The Amateur Democrat*; Moscow, *The Last of the Big-Time Bosses* (K–J Cong. II.H). Names: Wagner (K–J Cong. III.F).'
    tags: [name:wagner-robert-f-jr, name:levitt-arthur, name:desapio-carmine]
  - id: cal.1961-09-12.states-and-cities
    when: Sept. 12
    date: '1961-09-12'
    thread: states-and-cities
    c: Michigan elects its convention delegates. Romney among them.
    n: See [[cal.1961-04-03.states-and-cities]].
    tags: [name:romney-george-w]
  - id: cal.1961-09-13.crime-and-hijacking
    when: Sept. 13
    date: '1961-09-13'
    thread: crime-and-hijacking
    c: 'Robert Kennedy''s organized-crime bills signed: the Wire Act, the Travel Act, and the wagering-paraphernalia act.'
    n: '[Pub. L. No. 87-216, 75 Stat. 491](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg491.pdf); [Pub. L. No. 87-228, 75 Stat. 498](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg498-2.pdf); [Pub. L. No. 87-218, 75 Stat. 492](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg492-2.pdf) (1961). Goldfarb, *Perfect Villains, Imperfect Heroes*; Navasky (K–J Adm. II.E).'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-09-15.testing
    when: Sept. 15
    date: '1961-09-15'
    thread: testing
    c: First U.S. underground test of the series in Nevada.
    n: See [[cal.1961-09-01.testing]].
  - id: cal.1961-09-18.congo
    when: Sept. 18
    date: '1961-09-18'
    thread: congo
    c: Hammarskjöld killed in a crash near Ndola on his way to meet Tshombe.
    n: '[Statement by the President on the Death of Dag Hammarskjold](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-dag-hammarskjold). [FRUS 1961–63, XX, doc. 118](https://history.state.gov/historicaldocuments/frus1961-63v20/d118). See [[cal.1961-02-13.congo]]. The UN inquiries of 2015–24 reopened the cause.'
    tags: [name:hammarskjold-dag, name:tshombe-moise]
  - id: cal.1961-09-19.rules
    when: Sept. 19
    date: '1961-09-19'
    thread: rules
    c: Senate refuses cloture on the motion to take up the Rule XXII change, [37–43](https://voteview.com/rollcall/RS0870193). The filibuster rule stands for the session.
    n: 'S. Res. 4, 87th Cong.; S. Rep. No. 87-870 (1961). Senate cloture table, 87th Cong. ([senate.gov](https://www.senate.gov/legislative/cloture/87.htm)). Finley, *Delaying the Dream* (K–J Cong. II.C). Names: Mansfield (K–J Cong. III.A); Russell (K–J Cong. III.B).'
  - id: cal.1961-09-19.space
    when: Sept. 19
    date: '1961-09-19'
    thread: space
    c: NASA names Houston for the Manned Spacecraft Center. Albert Thomas held NASA's appropriations.
    n: 'Lambright, *Powering Apollo* (K–J Adm. II.G.5). Names: Thomas (K–J Cong. III.D).'
    tags: [name:thomas-albert]
  - id: cal.1961-09-19.berlin-and-vienna
    when: Sept. 19
    date: '1961-09-19'
    thread: berlin-and-vienna
    c: Clay arrives in Berlin.
    n: Smith, *Lucius D. Clay* (see [[cal.1961-08-19.berlin-and-vienna]]). The tank confrontation at Checkpoint Charlie comes [[cal.1961-10-27.berlin-and-vienna]].
    tags: [name:clay-lucius-d]
  - id: cal.1961-09-21.program
    when: Sept. 21
    date: '1961-09-21'
    thread: program
    c: 'Mutual Educational and Cultural Exchange Act signed: the Fulbright–Hays Act.'
    n: '[Pub. L. No. 87-256, 75 Stat. 527](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg527.pdf) (1961).'
    tags: [name:fulbright-j-william, name:hays-wayne-l, name:kennedy-john-f]
  - id: cal.1961-09-22.peace-corps
    when: Sept. 22
    date: '1961-09-22'
    thread: peace-corps
    c: Peace Corps Act signed. Juvenile delinquency act signed the same day, Robert Kennedy's committee behind it.
    n: '[Pub. L. No. 87-293, 75 Stat. 612](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg612.pdf) (K–J Cong. II.J.2). Juvenile Delinquency and Youth Offenses Control Act of 1961, [Pub. L. No. 87-274, 75 Stat. 572](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg572.pdf). Lemann, *Promised Land* (K–J Adm. II.B), on the delinquency program as seed of community action.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-09-22.freedom-rides
    when: Sept. 22
    date: '1961-09-22'
    thread: freedom-rides
    c: The ICC orders segregation signs out of interstate terminals from Nov. 1.
    n: '[Interstate Commerce Commission, No. MC-C-3358, 26 Fed. Reg. 9166](https://www.govinfo.gov/app/details/FR-1961-09-29) (Sept. 29, 1961). See [[cal.1961-05-04.freedom-rides]]; [[cal.1961-05-29.freedom-rides]]. Arsenault (K–J Adm. II.C).'
  - id: cal.1961-09-23.civil-rights-the-executive
    when: Sept. 23
    date: '1961-09-23'
    thread: civil-rights-the-executive
    c: Thurgood Marshall nominated to the Second Circuit; recess-appointed in October. Eastland's subcommittee holds the confirmation for a year.
    n: '[Cong. Rec., Senate, Sept. 23, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt16/pdf/GPO-CRECB-1961-pt16-2-2.pdf). Williams, *Thurgood Marshall* (K–J Cong. II.G). Navasky (K–J Adm. II.E). Names: Marshall (K–J Cong. III.G).'
    tags: [name:marshall-thurgood, name:eastland-james-o]
  - id: cal.1961-09-25.testing
    when: Sept. 25
    date: '1961-09-25'
    thread: testing
    c: Address to the UN General Assembly a week after Hammarskjöld's death. Against the troika; for disarmament; the sword of Damocles.
    n: '[Address in New York City Before the General Assembly of the United Nations](https://www.presidency.ucsb.edu/documents/address-new-york-city-before-the-general-assembly-the-united-nations) (Sept. 25, 1961). Recording (K–J Adm. II.I).'
    tags: [name:kennedy-john-f, name:hammarskjold-dag]
  - id: cal.1961-09-25.mississippi
    when: Sept. 25
    date: '1961-09-25'
    thread: mississippi
    c: Herbert Lee, a farmer working with Moses, shot dead at the Liberty cotton gin by state representative E.H. Hurst. A coroner's jury finds self-defense.
    n: See Aug. Dittmer; Payne (K–J Cong. II.F).
    tags: [name:moses-robert-p, name:lee-herbert, name:hurst-e-h]
  - id: cal.1961-09-26.testing
    when: Sept. 26
    date: '1961-09-26'
    thread: testing
    c: Arms Control and Disarmament Act signed. ACDA created; William C. Foster director.
    n: '[Pub. L. No. 87-297, 75 Stat. 631](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg631.pdf) (K–J Cong. II.J.2). Seaborg (K–J Adm. II.D). Duncan L. Clarke, *Politics of Arms Control: The Role and Effectiveness of the U.S. Arms Control and Disarmament Agency* (1979).'
    tags: [name:foster-william-c, name:kennedy-john-f]
  - id: cal.1961-09-27.transition-and-staff
    when: Sept. 27
    date: '1961-09-27'
    thread: transition-and-staff
    c: John McCone named to succeed Dulles at the CIA. First session of the 87th Congress adjourns.
    n: '[Remarks in Newport Upon Announcing the Appointment of John McCone as Director of the Central Intelligence Agency](https://www.presidency.ucsb.edu/documents/remarks-newport-upon-announcing-the-appointment-john-mccone-director-the-central). [Cong. Rec., Senate, Sept. 26, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt16/pdf/GPO-CRECB-1961-pt16-4-1.pdf). Robarge, *John McCone* (K–J Adm. II.G.6). Grose, *Gentleman Spy* (K–J Adm. II.G.6). The session''s record: CQ Almanac 1961; Sundquist (K–J Cong. II.B). Names: McCone, Dulles (K–J Adm. III.I).'
    tags: [name:mccone-john-a, name:dulles-allen-w]
