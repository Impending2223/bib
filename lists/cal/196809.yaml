ers"; Ball''s "deep briefing"; the *Deseret News*: "HHH to Halt Bombing"; not NBC, the hours, the negotiations or the resumption); [[w.white-making-of-the-president-1969]], 354–56 (the $100,000; the call to Johnson fifteen minutes before); [[w.califano-triumph-and-tragedy-of]], 325 (his aides tell reporters it commits him to a halt without qualification; introduced as the candidate, no flag or seal; not cleared with Johnson); [[w.zelizer-fierce-urgency-of-now]], 311–12; [[w.bernstein-guns-or-butter]], 516–17 (Ball reads it to Johnson; the passage quoted); [[w.mann-walls-of-jericho]], 490 (Sept. 30, a half hour of network time; Humphrey "willing" to stop the bombing); [[w.nixon-rn]], 318 (Salt Lake City, Sept. 30, televised: the bombing stopped "as an acceptable risk for peace"); [[w.zaroulis-who-spoke-up]], 202 (Sept. 30, Salt Lake City, taped: a halt to the bombing if Hanoi gave "some sign" of "serious" negotiations; an "acceptable risk for peace"; Humphrey introduced as the candidate, not the Vice President). Check: Bernstein, 516, puts the speech "on the 25th.". Check: Mann, 490, has the campaign raise $100,000 for the half hour. Check: Solberg, 384, prints "by deed or word," the entry "by word or deed.". Check: Solberg, 384, has Ball reach Johnson first, after Johnson''s talk with Nixon, and Humphrey call later. To check: [[w.johns-price-of-loyalty]]. See [[cal.1968-09-02.elections-1968]]. Names: Humphrey, Nixon, Johnson, Ball. Check: Ball has himself telephoning Johnson in the afternoon, Humphrey retaping, to read him the passage.'
