    n: '[*Official Abstract of Votes Cast at the Primary Election Held September 3, 1968*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1968-09-03-primary.pdf) (State Board of Canvassers, Sept. 17, 1968). Doherty''s name and the November figures: [Wikipedia, "1968 North Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Dakota_gubernatorial_election). [[w.peirce-great-plains-states-of]], 166–67 (McCarney, beaten in 1964, nominated; Guy''s four terms; his re-election over McCarney). See [[cal.1964-06-30.governors-nd]]. Names: McCarney, Guy.'
