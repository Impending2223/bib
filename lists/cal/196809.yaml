    c: 'Seattle, then Salt Lake City, the speech on Vietnam, by Humphrey''s account. Ball''s draft; O''Brien''s telegram: "Ball speech a disaster"; Van Dyk to draft anew. At 2 p.m. Van Dyk, Sherman, Connell, Rowe, Berman, Harris, O''Brien. At night in Salt Lake City, Welsh, Bailey and Moss too, till 2 a.m.'
