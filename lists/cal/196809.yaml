    n: '[[w.solberg-hubert-humphrey]], 373–74; [[w.white-making-of-the-president-1969]], 338 (Freeman: no schedule, no advance men, no money). To check: Edgar Berman, diary, Sept. 3, 1968, Berman files (cited by [[w.solberg-hubert-humphrey]], 374, its note). Names: Humphrey.'
