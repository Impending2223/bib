  - id: cal.1968-09-05.soviet-union-leadership
    when: Sept. 5
    date: '1968-09-05'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'The Politburo, after Brezhnev''s meeting that morning with the ambassadors to the socialist countries. His notes: back from Moscow, they "all speak of unity," a harmful slogan; the petty bourgeoisie the force the counterrevolution used; Prague''s propaganda plays up Smrkovský, not Svoboda, Černík and Husák; each country''s ambassador to be heard in the Politburo; powerful transmitters at Brest; ambassadors on the military councils; Yugoslavia the center of revisionism; Romania, some contact, no open criticism. Baibakov''s paper on wider economic ties with Bulgaria.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 322–24 (№ 79, Brezhnev''s notes, dated September), 344 nn.117–24 (the editors: the notes to "Пиллер" are his at the Politburo of Sept. 5, 322 n.d; before it his meeting with the ambassadors, which he reported, and Chervonenko''s information; Baibakov''s paper on Bulgaria; the letter to Romania of Aug. 24). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 282 (the secretaries'' record, Sept. 5: 9 to 11, Brezhnev''s meeting with Aristov, Abrasimov, Benediktov, Chervonenko, Puzanov, Basov, Soldatov, Sikachev, Panyushkin, Kuznetsov and Gromyko; the Politburo in the Kremlin, 4 to 7 p.m.). Made public: 2016. To check: the protocol of Sept. 5. Names: Smrkovský, Svoboda, Černík, Husák, Baibakov, Brezhnev.'
    src:
      c: 7310101d
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 282: ?'
    tags: [polity:ussr, name:brezhnev-leonid, name:svoboda-ludvik, name:husak-gustav, name:baibakov-nikolai-k, vis:only:ussr]
