    c: 'Zhou Enlai, at dawn, talks with responsible people of the Academy of Sciences and the National Defense Science and Technology Commission on the backward state of military radio technology: the old ways of thirty years ago, a set needing many men and men to guard it; could they all be transistorized; copying alone will not do, create; mobilize the masses and it can be done next year; the Fourth Ministry and the Signal Corps are to do it within half a year. By the end of 1972 an all-transistor tactical radio is made, half the weight of the valve set.'
