  - id: cal.1968-09-28.court-fortas
    when: Sept. 28
    date: '1968-09-28'
    thread: court-fortas
    c: The White House, evening. Johnson asks Carol and Abe Fortas to dinner. Carol Fortas "is quite sure it is all over—Abe has lost. Senator Dirksen's complete turnaround was the end." Fortas is "very quiet, contained, and dignified." They talk of "the future of the country, the temper of the time, the campaigns of Nixon and of Humphrey—the likelihood that there might be a swing to strong conservatism," and of "the heritage of McCarthy the first and McCarthy the second." Mrs. Johnson expects "the end" in the next week.
    n: '[[w.johnson-white-house-diary]], 712–13 (Lady Bird Johnson''s account). Carol Fortas''s view as Mrs. Johnson gives it; Dirksen''s "turnaround" is not further described. See [[cal.1968-09-24.court-fortas]]. Made public: 1970. Names: Fortas, Johnson, Dirksen, Nixon, Humphrey, Lady Bird Johnson.'
