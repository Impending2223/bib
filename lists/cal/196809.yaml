    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai with the Cultural Revolution Group''s liaison members receives the capital''s workers'' and PLA propaganda teams and cites Mao''s Sept. 1 instruction that most students trained in the old schools can join workers and peasants, some inventing and creating, under correct leadership and the education of workers, peasants and soldiers: a development of the earlier policy on intellectuals. Of the Hongqi note of Sept. 5 on the Shanghai Machine Tool Institute he repeats that even the worst of the old intellectuals must be given a way out. Of the Cultural Revolution: frankly, he did not understand it at first, did not foresee today''s situation; Red Guards stormed Zhongnanhai more than ten times and each time he worked on them and did not fall out.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 253 (Sept. 14, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
