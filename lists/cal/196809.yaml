    n: 'Votes: [Wikipedia, "1968 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1968_Iowa_gubernatorial_election), from the [*Summary of Official Canvass of the Votes Cast in Iowa Primary Election, September 3, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968primcanv.pdf) (Check: the scan''s totals). [[w.peirce-great-plains-states-of]], 102 n.∗ (Ray once the State Republican chairman). To check: [[w.larew-party-reborn]]. See [[cal.1966-09-06.governors-ia]]. Names: Ray, Johnson, Beck, Franzenburg, Hughes.'
    src:
