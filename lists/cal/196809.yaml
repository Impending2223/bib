  - id: cal.1968-09-02.jobs-and-wages
    when: Sept. 2
    date: '1968-09-02'
    thread: jobs-and-wages
    c: 'Labor Day. Johnson''s statement: employment at an all-time peak of almost 78 million; Americans "must open their hearts and work with a new sense of purpose to help the disadvantaged enter the mainstream of our society."'
    n: 'Statement by the President, Labor Day, 1968, [1968–69 Pub. Papers 921](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=231) (Sept. 2, 1968; released at Austin). [[w.dallek-flawed-giant]], 552 (the Labor Day statement, its words). Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-02.china-leadership
    when: Sept. 2
    date: '1968-09-02'
    thread: china-leadership
    also: [china, india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the meeting of Xinjiang''s delegates, announcing the approval of the Xinjiang Uighur Autonomous Region''s revolutionary committee: once set up, the committee must first achieve "grasping revolution by trades"; very few of Xinjiang''s prefectures, autonomous prefectures and counties have committees, because the organizations there have long cut across trades, and what cuts across trades cannot be organized by trade.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Sept. 2, 1968). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1968-09-02.china-leadership-2
    when: Sept. 2
    date: '1968-09-02'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Zhou Enlai attends and speaks at the reception given by Vietnam''s ambassador, Ngô Minh Loan, for the 23rd anniversary of Vietnam''s independence: if the Vietnamese people hold to protracted war and oppose capitulation and compromise they will certainly win final victory in the war against the Americans for national salvation.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 251 (Sept. 2, 1968); [[w.zhou-enlai-waijiao-huodong]], 529 (Sept. 2, 1968; the reception given by Vietnam''s ambassador Ngô Minh Loan for the twenty-third anniversary of Vietnam''s independence; the book has Zhou saying the Vietnamese people, holding to protracted war and opposing surrender and compromise, will win the final victory in the war against the U.S.); [[w.zhonghua-renmin-gongheguo-waijiao]], 201 (Sept. 2, 1968; Zhou''s speech: protracted war, no surrender or compromise). Names: Zhou Enlai.'
    src:
      c: bf209961
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 251: ?'
        - 'w.zhou-enlai-waijiao-huodong 529: A'
        - 'w.zhonghua-renmin-gongheguo-waijiao 201: all'
    tags: [polity:prc, name:zhou-enlai]
