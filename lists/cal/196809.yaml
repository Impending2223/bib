  - id: cal.1968-09-01.opinion
    when: Sept. 1
    date: '1968-09-01'
    thread: opinion
    also: [welfare, foreign-aid]
    c: 'Gallup, Aug. 7–12: have heard or read of Pope Paul VI''s statement banning artificial methods of birth control, Catholics 93 percent, Protestants 86. Of them, favor his position: Catholics 28, oppose 54; Protestants 13 and 62. Catholics: can practice artificial birth control and still be a good Catholic, 65 to 25. Birth control information available to anyone who wants it: Protestants 75 yes, Catholics 76. Help to other nations that ask aid in their birth control programs: 70 and 65.'
    n: '[[w.gallup-poll]], III, 2157–58. Names: Paul VI.'
    tags: [name:paul-vi]
