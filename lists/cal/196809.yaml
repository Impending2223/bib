# Cal. CVII September 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CVII
entries:
  - id: cal.1968-09.elections-1968
    when: Sept.
    date: 1968-09
    thread: elections-1968
    c: 'Agnew in the campaign: Humphrey "squishy soft on communism," a phrase he later withdraws; "Polack"; "the fat Jap," of a reporter on his plane. Check the days and places.'
    n: 'To check: [[w.witcover-white-knight]]; [[w.lippman-spiro-agnews-america]]; [[w.holden-republican-populist]]. See [[cal.1968-09-02.elections-1968]]. Names: Agnew, Humphrey.'
    tags: [name:agnew-spiro-t, name:humphrey-hubert-h]
  - id: cal.1968-09-01.opinion
    when: Sept. 1
    date: '1968-09-01'
    thread: opinion
    also: [welfare, foreign-aid]
    c: 'Gallup, Aug. 7–12: have heard or read of Pope Paul VI''s statement banning artificial methods of birth control, Catholics 93 percent, Protestants 86. Of them, favor his position: Catholics 28, oppose 54; Protestants 13 and 62. Catholics: can practice artificial birth control and still be a good Catholic, 65 to 25. Birth control information available to anyone who wants it: Protestants 75 yes, Catholics 76. Help to other nations that ask aid in their birth control programs: 70 and 65.'
    n: '[[w.gallup-poll]], III, 2157–58. Names: Paul VI.'
    tags: [name:paul-vi]
  - id: cal.1968-09-02.elections-1968
    when: Sept. 2
    date: '1968-09-02'
    thread: elections-1968
    c: 'The campaign opens. Labor Day: Humphrey in New York''s parade (Check).'
    n: 'To check: [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.gould-1968]]; [[w.witcover-year-the-dream-died]]; [[w.nelson-resilient-america]]; [[w.lafeber-deadly-bet]]; [[w.johns-price-of-loyalty]]; [[w.solberg-hubert-humphrey]]; [[w.perlstein-nixonland-2008]]. See [[cal.1968-08-26.elections-1968]]. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1968-09-03.governors-ia
    when: Sept. 3
    date: '1968-09-03'
    thread: governors
    also: [elections-1968]
    c: 'Iowa, governor; Hughes running for the Senate. Republican primary: Ray, once State chairman, over Donald E. Johnson, once national commander of the American Legion, 108,744 to 77,716, 43.2 percent; Beck 65,439, 26.0 percent. Democratic: Franzenburg, the State treasurer, unopposed.'
    n: 'Votes: [Wikipedia, "1968 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1968_Iowa_gubernatorial_election), from the [*Summary of Official Canvass of the Votes Cast in Iowa Primary Election, September 3, 1968*](https://sos.iowa.gov/elections/pdf/results/60s/1968primcanv.pdf) (Check: the scan''s totals). To check: [[w.larew-party-reborn]]; [[w.peirce-great-plains-states-of]]. See [[cal.1966-09-06.governors-ia]]. Names: Ray, Johnson, Beck, Franzenburg, Hughes.'
    tags: [state:ia, name:ray-robert-d, name:johnson-donald-e, name:beck-robert-k, name:franzenburg-paul, name:hughes-harold-e]
  - id: cal.1968-09-03.governors-nd
    when: Sept. 3
    date: '1968-09-03'
    thread: governors
    also: [elections-1968]
    c: 'North Dakota, Republican primary for governor: McCarney, a candidate in 1964, over Doherty, 47,324 to 42,845, 52.5 percent. Governor Guy unopposed for a fourth term; re-elected in November over McCarney, 135,955 to 108,382, 54.8 percent.'
    n: '[*Official Abstract of Votes Cast at the Primary Election Held September 3, 1968*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1968-09-03-primary.pdf) (State Board of Canvassers, Sept. 17, 1968). Doherty''s name and the November figures: [Wikipedia, "1968 North Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Dakota_gubernatorial_election). To check: [[w.peirce-great-plains-states-of]]. See [[cal.1964-06-30.governors-nd]]. Names: McCarney, Guy.'
    tags: [state:nd, name:mccarney-robert-p, name:guy-william-l]
  - id: cal.1968-09-04.elections-1968
    when: Sept. 4
    date: '1968-09-04'
    thread: elections-1968
    c: 'Chicago: Nixon''s motorcade through the Loop.'
    n: 'See [[cal.1968-09-02.elections-1968]]. Names: Nixon.'
    tags: [name:nixon-richard-m, state:il, city:chicago]
  - id: cal.1968-09-06.court
    when: Sept. 6
    date: '1968-09-06'
    thread: court-fortas
    also: [confirmations]
    c: 'Fortas. Johnson, at a news conference, after meeting Mansfield and Dirksen: "There has never been a single case where the Senate failed to act on a nomination because of the filibuster."'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 924](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=234) (Sept. 6, 1968). See [[cal.1968-07-11.court]]. Names: Fortas, Johnson, Mansfield, Dirksen.'
    tags: [name:fortas-abe, name:johnson-lyndon-b, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1968-09-07.vietnam
    when: Sept. 7
    date: '1968-09-07'
    thread: vietnam-paris
    c: Paris. Harriman and Vance meet Lê Đức Thọ and Xuân Thủy in private, the first of such meetings; what is said to stay secret. Thọ's three hours on the war.
    n: 'FRUS 1964–68, VII, doc. [7](https://history.state.gov/historicaldocuments/frus1964-68v07/d7). [[w.nguyen-hanois-war]], 121–29 (Hanoi''s side of the private talks, to the halt), 122 (this meeting). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy. Check: Nguyen, 122, dates the meeting Sept. 8, by Hanoi''s record, and gives Thọ''s lecture "nearly an hour."'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:le-duc-tho, name:xuan-thuy]
  - id: cal.1968-09-07.women
    when: Sept. 7
    date: '1968-09-07'
    thread: women
    c: 'Atlantic City. New York Radical Women and others picket the Miss America Pageant on the Boardwalk: a "Freedom Trash Can" for girdles, bras, false eyelashes and copies of *Playboy*; a sheep crowned. Inside the hall, during the broadcast, a banner: "Women''s Liberation." The first Miss Black America pageant the same night, nearby (Check).'
    n: 'To check: [[w.echols-daring-to-be-bad]]; [[w.rosen-world-split-open]].'
    tags: [state:nj, city:atlantic-city]
  - id: cal.1968-09-08.black-nationalism-oakland
    when: Sept. 8
    date: '1968-09-08'
    thread: black-nationalism
    c: Oakland. The jury convicts Newton of voluntary manslaughter in the death of an Oakland policeman, Oct. 28, 1967. Sept. 27, sentenced to two to fifteen years. Check the day of the verdict.
    n: '*People v. Newton*, [8 Cal. App. 3d 359](https://static.case.law/cal-app-3d/8/case-pdfs/0359-01.pdf) (1970), the appeal. See [[cal.1967-10-28.black-nationalism-oakland]]. Names: Newton.'
    tags: [name:newton-huey-p, state:ca, city:oakland]
  - id: cal.1968-09-08.opinion
    when: Sept. 8
    date: '1968-09-08'
    thread: opinion
    also: [elections-1968-polls, economy, vietnam]
    c: 'Gallup, Aug. 7–12: the party to do the best job of keeping the country prosperous: Republican 36 percent, Democratic 36. The most important problem: Vietnam 51, crime (looting and riots included) 21, civil rights 20, the high cost of living 7. The party better able to handle it: Republican 37, Democratic 25. Of keeping prices down in the next four years: Republican 44, Democratic 22.'
    n: '[[w.gallup-poll]], III, 2158–59.'
  - id: cal.1968-09-09.soviet-union
    when: Sept. 9
    date: '1968-09-09'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'The summit, put off by the invasion of Czechoslovakia, sought again. At his home, Rostow to Dobrynin, on Johnson''s instructions: "The President does not wish to launch the missile talks at a meeting lower than the Kosygin-Johnson level." Dobrynin: "Now that the Democratic Convention is over, the offensive may subside."'
    n: 'FRUS 1964–68, XI, doc. [280](https://history.state.gov/historicaldocuments/frus1964-68v11/d280); XIV, doc. [294](https://history.state.gov/historicaldocuments/frus1964-68v14/d294); VII, doc. [9](https://history.state.gov/historicaldocuments/frus1964-68v07/d9). Made public: FRUS 1964–68, XI (1997) and XIV (2001) (Check the years). To check: [[w.newhouse-cold-dawn]]; [[w.garthoff-detente-and-confrontation]]. See [[cal.1968-06-21.testing]]. Names: Rostow, Dobrynin, Johnson, Kosygin.'
    tags: [name:rostow-walt-w, name:dobrynin-anatoly, name:johnson-lyndon-b, name:kosygin-aleksei]
  - id: cal.1968-09-09.elections-1968
    when: Sept. 9
    date: '1968-09-09'
    thread: elections-1968
    also: [vietnam]
    c: 'Philadelphia: Humphrey, some American units might be withdrawn from Vietnam late in 1968 or early in 1969; at Denver the same day, the convention''s majority and minority planks on Vietnam not far apart.'
    n: 'See [[cal.1968-09-02.elections-1968]]. Names: Humphrey.'
    tags: [name:humphrey-hubert-h, state:pa, city:philadelphia]
  - id: cal.1968-09-09.states-and-cities-nyc
    when: Sept. 9
    date: '1968-09-09'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: 'New York City. The United Federation of Teachers strikes the schools on the first day, for the return of the Ocean Hill teachers: 93 percent of the 58,000 out.'
    n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike). Check: [Tamiment Library, United Federation of Teachers records](https://findingaids.library.nyu.edu/tamwag/wag_022). See [[cal.1968-05-09.states-and-cities-nyc]]. Names: Shanker.'
    tags: [state:ny, city:nyc, name:shanker-albert]
  - id: cal.1968-09-10.elections-1968
    when: Sept. 10
    date: '1968-09-10'
    thread: elections-1968
    also: [vietnam]
    c: 'New Orleans, Johnson to the American Legion: "We yearn for the day when our men can come home. No man can predict when that day will come."'
    n: 'Remarks in New Orleans Before the 50th Annual National Convention of the American Legion, [1968–69 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=246) (Sept. 10, 1968). [[w.dallek-flawed-giant]], 577. See [[cal.1968-09-02.elections-1968]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:la, city:new-orleans]
  - id: cal.1968-09-10.governors-wi
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [elections-1968]
    c: 'Wisconsin, Democratic primary for governor: La Follette, the attorney general, grandson of the Progressive, over Wille, 173,458 to 31,778, 84.5 percent. Governor Knowles unopposed for a third term; re-elected in November over La Follette, 893,463 to 791,100, 52.9 percent.'
    n: 'Votes: [Wikipedia, "1968 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1968_Wisconsin_gubernatorial_election), from the [*Wisconsin Blue Book*, 1970](https://search.library.wisc.edu/digital/AGMDNMSNXDGTAN8A/full/APPTZUTEORTMJZ8V) (Check: not read here). To check: [[w.peirce-great-lakes-states-of]]. See [[cal.1966-09-13.governors-wi]]. Names: La Follette, Knowles.'
    tags: [state:wi, name:la-follette-bronson-c, name:knowles-warren-p]
  - id: cal.1968-09-10.governors-nh
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [elections-1968]
    c: 'New Hampshire''s primaries for governor; King running for the Senate. Republican: Peterson, Speaker of the House, over Wesley Powell, governor 1959–63, 29,262 to 26,498, 34.1 percent; Thomson 25,275, 29.5 percent; four others. Democratic: Bussiere, of Manchester, over Sullivan, 12,021 to 10,895, 32.7 percent; three others. Peterson elected in November over Bussiere, 149,902 to 135,378, 52.5 percent.'
    n: '[N.H. *Manual for the General Court*, no. 41 (1969), p. 526](https://archive.org/details/manualforgeneral41newh/page/526). [Wikipedia, "1968 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1968_New_Hampshire_gubernatorial_election). To check: [[w.peirce-new-england-states]]. See [[cal.1966-09-13.governors-nh]]. Names: Peterson, Powell, Thomson, Bussiere, King.'
    tags: [state:nh, name:peterson-walter-r-jr, name:powell-wesley, name:thomson-meldrim-jr, name:bussiere-emile-r, name:king-john-w]
  - id: cal.1968-09-10.governors-vt
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [elections-1968]
    c: 'Vermont, governor; Hoff not running for a fourth term. Republican primary: Davis, chairman of National Life, over Oakes, the attorney general, 36,719 to 21,791, 62.7 percent. Democratic: Daley, the lieutenant governor, over others, 10,641 to 256, 97.7 percent. Davis elected in November over Daley, 89,387 to 71,656, 55.5 percent.'
    n: '[Vt. Secretary of State, "Primary Election Results, 1968"](https://web.archive.org/web/20160303233732/https://www.sec.state.vt.us/media/62953/p1968.pdf); [Wikipedia, "1968 Vermont gubernatorial election"](https://en.wikipedia.org/wiki/1968_Vermont_gubernatorial_election). To check: [[w.hand-star-that-set]]; [[w.peirce-new-england-states]]. See [[cal.1966-09-13.governors-vt]]. Names: Davis, Oakes, Daley, Hoff.'
    tags: [state:vt, name:davis-deane-c, name:oakes-james-l, name:daley-john-j, name:hoff-philip-h]
  - id: cal.1968-09-10.governors-ny
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [congress]
    c: New York. Rockefeller appoints Goodell, Representative from the 38th District since 1959, to Robert Kennedy's Senate seat until the election of 1970. Goodell resigns from the House, Sept. 9.
    n: 'The certificate of appointment, dated Sept. 10, presented and the oath taken in the Senate, Sept. 12: [114 Cong. Rec. 26668](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt20/pdf/GPO-CRECB-1968-pt20-6-2.pdf#page=20). [Wikipedia, "Charles Goodell"](https://en.wikipedia.org/wiki/Charles_Goodell). To check: [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1968-06-05.robert-kennedy]]. Names: Rockefeller, Goodell, Robert Kennedy.'
    tags: [state:ny, name:rockefeller-nelson, name:goodell-charles-e, name:kennedy-robert-f]
  - id: cal.1968-09-10.governors-az
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [elections-1968]
    c: 'Arizona''s primaries. Governor, Democratic: Goddard, governor 1965–67, over Shields, 112,948 to 30,337, 73.4 percent; one other. Governor Williams unopposed. Senate, Hayden retiring: Elson, his administrative assistant, the Democrats'' nominee over Bob Kennedy, 95,231 to 41,397, 62.7 percent; Goldwater the Republicans''. In November Williams over Goddard, 279,923 to 204,075, 57.8 percent; Goldwater over Elson.'
    n: 'Votes: [Wikipedia, "1968 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1968_Arizona_gubernatorial_election), from the canvasses; [Wikipedia, "1968 United States Senate election in Arizona"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Arizona), from Our Campaigns. Check: [Ariz. *Official Canvass, Primary Election, September 10, 1968*](https://azmemory.azlibrary.gov/nodes/view/102664) and [*General Election, November 5, 1968*](https://azmemory.azlibrary.gov/nodes/view/102663) (bot-checked from here). Check: the Senate primary''s share: Wikipedia''s table gives Elson 95,231, Kennedy 41,397, and 62.7 percent, and no third candidate. To check: [[w.shermer-sunbelt-capitalism]]; [[w.goldberg-barry-goldwater]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1966-11-08.governors-az]]. Names: Goddard, Williams, Hayden, Elson, Goldwater.'
    tags: [state:az, name:goddard-samuel-p-jr, name:williams-jack, name:hayden-carl, name:elson-roy-l, name:goldwater-barry-m]
  - id: cal.1968-09-10.governors-ut
    when: Sept. 10
    date: '1968-09-10'
    thread: governors
    also: [elections-1968]
    c: 'Utah''s Republican primary for governor: Buehner, once a general authority of the Church of Jesus Christ of Latter-day Saints, over Rawlings, 93,635 to 39,907, 70.1 percent. Governor Rampton unopposed. In November Rampton over Buehner, 289,283 to 131,729, 68.7 percent, as Nixon carries the State.'
    n: 'Votes: [Utah, *Abstract of the Returns of an Election Held in the State of Utah, Tuesday, November 5, 1968*](https://vote.utah.gov/wp-content/uploads/2023/09/1968Gen.pdf); the primary, [Wikipedia, "1968 Utah gubernatorial election"](https://en.wikipedia.org/wiki/1968_Utah_gubernatorial_election) (Check: the primary abstract, at the Utah State Archives). To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1964-11-03.governors-ut]]. Names: Buehner, Rampton, Nixon.'
    tags: [state:ut, name:buehner-carl-w, name:rampton-calvin-l, name:nixon-richard-m]
  - id: cal.1968-09-11.states-and-cities-ocean-hill
    when: Sept. 11
    date: '1968-09-11'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: New York City. The teachers back, the Board of Education having ordered the Ocean Hill teachers reinstated.
    n: See [[cal.1968-09-09.states-and-cities-nyc]].
    tags: [state:ny, city:nyc]
  - id: cal.1968-09-11.transition-and-staff
    when: Sept. 11
    date: '1968-09-11'
    thread: transition-and-staff
    c: 'Johnson to the candidates, under the Presidential Transition Act of 1963: the departments and agencies to plan for the transfer of the executive power on Jan. 20, 1969; Charles Murphy the coordinator in the White House Office; each candidate may name a representative to work with him.'
    n: 'Letter to Presidential Candidates Concerning Plans for an Orderly Transfer of Executive Power, [1968–69 Pub. Papers 958](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=268) (Sept. 11, 1968). To check: [[w.brauer-presidential-transitions]]; [[w.christian-president-steps-down]]. Names: Murphy, Johnson.'
    tags: [name:murphy-charles-s, name:johnson-lyndon-b]
  - id: cal.1968-09-11.jobs-and-wages
    when: Sept. 11
    date: '1968-09-11'
    thread: jobs-and-wages
    c: 'Johnson to the Speaker and the President of the Senate, proposing a Federal Coal Mine Health and Safety Act: since the act of 1952, over 5,500 miners killed on the job, 250,000 seriously disabled; at least one active miner in ten, one retired miner in five, with a serious respiratory disease. Not enacted in the session (Check).'
    n: 'Letter to the President of the Senate and to the Speaker of the House Proposing the Federal Coal Mine Health and Safety Act, [1968–69 Pub. Papers 950](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=260) (Sept. 11, 1968). To check: [[w.derickson-black-lung]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-11.georgia-ga
    when: Sept. 11
    date: '1968-09-11'
    thread: georgia
    also: [elections-1968]
    c: 'Georgia''s Democratic primary. Talmadge renominated for the Senate over Maynard Jackson, a lawyer of the National Labor Relations Board in Atlanta, 627,915 to 207,171, 75.2 percent. The Republicans'' first primary for the Senate: E. Earl Patton.'
    n: 'Votes: [Wikipedia, "1968 United States Senate election in Georgia"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Georgia). Check: the Secretary of State''s tabulation of the primary. To check: [[w.tuck-beyond-atlanta]]; [[w.bartley-from-thurmond-to-wallace]]. Names: Talmadge, Jackson.'
    tags: [state:ga, city:atlanta, name:talmadge-herman-e, name:jackson-maynard]
  - id: cal.1968-09-11.opinion
    when: Sept. 11
    date: '1968-09-11'
    thread: opinion
    also: [elections-1968-polls, jobs-and-wages]
    c: 'Gallup, Aug. 7–12, registered voters, union members and others: outside the South, union members, Humphrey 43 percent, Nixon 36, Wallace 12; non-union, Nixon 51, Humphrey 33, Wallace 10. In the South the book prints the same figures for union members and non-members: Wallace 50, Humphrey 29, Nixon 16.'
    n: '[[w.gallup-poll]], III, 2159. Names: Humphrey, Nixon, Wallace. Check the South''s union figures against another printing of the release.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c]
  - id: cal.1968-09-12.elections-1968
    when: Sept. 12
    date: '1968-09-12'
    thread: elections-1968
    also: [vietnam]
    c: 'Clifford to Johnson, at lunch: the Vice President "has had three flubs": the withdrawal of troops, the planks, a Marine unit coming home.'
    n: 'FRUS 1964–68, VII, doc. [12](https://history.state.gov/historicaldocuments/frus1964-68v07/d12). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-02.elections-1968]]. Names: Clifford, Johnson, Humphrey.'
    tags: [name:clifford-clark, name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1968-09-13.court-fortas
    when: Sept. 13
    date: '1968-09-13'
    thread: court-fortas
    also: [confirmations]
    c: 'The Judiciary Committee''s hearings on Fortas resume: he was paid $15,000, raised from private donors, for nine summer seminars at American University''s law school; he declines to appear again (Check the days).'
    n: 'Daily Digest, [114 Cong. Rec. D425](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=423), [114 Cong. Rec. D427](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=425). See [[cal.1968-07-11.court]]. Names: Fortas.'
    tags: [name:fortas-abe]
  - id: cal.1968-09-13.states-and-cities-ocean-hill
    when: Sept. 13
    date: '1968-09-13'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: New York City. The teachers out again, the Ocean Hill governing board refusing to take back its teachers.
    n: See [[cal.1968-09-09.states-and-cities-nyc]].
    tags: [state:ny, city:nyc]
  - id: cal.1968-09-15.vietnam-paris
    when: Sept. 15
    date: '1968-09-15'
    thread: vietnam-paris
    c: 'Paris. Harriman and Vance with Lê Đức Thọ and Xuân Thủy in private, after a second meeting Sept. 12: the Americans on mutual withdrawal, the DMZ, and "our side–your side" for talks after a halt.'
    n: 'FRUS 1964–68, VII, doc. [14](https://history.state.gov/historicaldocuments/frus1964-68v07/d14). [[w.nguyen-hanois-war]], 122. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:le-duc-tho, name:xuan-thuy]
  - id: cal.1968-09-15.opinion
    when: Sept. 15
    date: '1968-09-15'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 1–6: Nixon 43 percent, Humphrey 31, Wallace (American Independent) 19, undecided 7. South: Wallace 38, Nixon 31, Humphrey 25. Independents: Nixon 39, Wallace 33, Humphrey 20. Democrats: Humphrey 63, Wallace 17, Nixon 10.'
    n: '[[w.gallup-poll]], III, 2159–60. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-09-15.elections-1968
    when: Sept. 15
    date: '1968-09-15'
    thread: elections-1968
    c: 'Billy Graham brings Johnson six points from Nixon: he will never embarrass Johnson; a working relationship, his advice sought; special assignments after the election; a major share of the credit when Vietnam is settled. Johnson: he will support Humphrey loyally, and cooperate with Nixon if he wins.'
    n: '[[w.dallek-flawed-giant]], 578 (Graham''s memorandum). See [[cal.1968-09-10.elections-1968]]. Names: Graham, Nixon, Johnson, Humphrey.'
    tags: [name:graham-billy, name:nixon-richard-m, name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1968-09-16.testing-missile-talks
    when: Sept. 16
    date: '1968-09-16'
    thread: testing-missile-talks
    also: [soviet-union]
    c: 'An American memorandum to the Soviet government, on Dobrynin''s observations of Sept. 13: the President agrees that a positive outcome of a meeting at the highest level needs efforts from both sides.'
    n: 'FRUS 1964–68, XI, doc. [282](https://history.state.gov/historicaldocuments/frus1964-68v11/d282); XIV, doc. [299](https://history.state.gov/historicaldocuments/frus1964-68v14/d299). See [[cal.1968-09-09.soviet-union]]. Names: Dobrynin, Johnson.'
    tags: [name:dobrynin-anatoly, name:johnson-lyndon-b]
  - id: cal.1968-09-16.elections-1968
    when: Sept. 16
    date: '1968-09-16'
    thread: elections-1968
    also: [press-and-broadcasting]
    c: 'NBC, *Rowan & Martin''s Laugh-In*: Nixon, on tape, a few seconds: "Sock it to *me*?"'
    n: 'To check: [[w.nixon-rowan-and-martins-laugh]]; [[w.perlstein-nixonland-2008]]. See [[cal.1968-09-02.elections-1968]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1968-09-16.space
    when: Sept. 16
    date: '1968-09-16'
    thread: space
    c: 'Webb leaves NASA. By the accounts Dallek gives, he had offered to resign before; Johnson, "fed up with this same old story": "Let''s call in the press." To the reporters, Webb: budget cuts have put the United States second in space; the agency "a sort of whipping boy."'
    n: '[[w.dallek-flawed-giant]], 423–24 (from Webb''s and Paine''s oral histories and Sherrod''s papers, NASA Archives). Names: Webb, Johnson. Check: the day, against the press of Sept. 16–17.'
    tags: [name:webb-james-e, name:johnson-lyndon-b]
  - id: cal.1968-09-16.crime-and-hijacking
    when: Sept. 17
    date: '1968-09-17'
    thread: crime-and-hijacking-guns
    c: 'Senate, the gun bill, S. 3633: Dodd''s stricter qualifications for licensed dealers refused, [42–45](https://voteview.com/rollcall/RS0900551).'
    n: 'To check: [[w.zimring-firearms-and-federal-law]]; [[w.spitzer-politics-of-gun-control]]. See [[cal.1968-06-06.crime-and-hijacking]]. Names: Dodd.'
    tags: [name:dodd-thomas-j]
  - id: cal.1968-09-17.testing
    when: Sept. 17
    date: '1968-09-17'
    thread: testing-npt
    c: 'The nonproliferation treaty. The Foreign Relations Committee recommends consent, 13–3–3. Foster to Dobrynin the same day: done in spite of Czechoslovakia; should there be "further similar events in Romania and Yugoslavia," the treaty and the rest "might just as well be forgotten."'
    n: 'FRUS 1964–68, XI, doc. [283](https://history.state.gov/historicaldocuments/frus1964-68v11/d283). To check: [[w.seaborg-stemming-the-tide]]. See [[cal.1968-07-09.testing]]. Names: Foster, Dobrynin.'
    tags: [name:foster-william-c, name:dobrynin-anatoly]
  - id: cal.1968-09-17.court-fortas
    when: Sept. 17
    date: '1968-09-17'
    thread: court-fortas
    also: [confirmations]
    c: The Judiciary Committee reports Fortas's nomination as Chief Justice favorably, 11–6.
    n: 'Daily Digest, [114 Cong. Rec. D430](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=428). See [[cal.1968-07-11.court]]. Names: Fortas.'
    tags: [name:fortas-abe]
  - id: cal.1968-09-17.japan-and-korea
    when: Sept. 17
    date: '1968-09-17'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the *Pueblo*: Woodward and Pak Chung Kuk, the 21st closed meeting of the senior members. Pak: the crew released if the United States signs and submits the North Korean document of May 8.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [313](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d313), [315](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d315). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Woodward, Pak Chung Kuk.'
    tags: [name:woodward-gilbert-h, name:pak-chung-kuk]
  - id: cal.1968-09-17.economy
    when: Sept. 17
    date: '1968-09-17'
    thread: economy
    c: 'Johnson: Chrysler''s increase on its 1969 models, announced the day before, "excessive"; the Cabinet Committee on Price Stability finds "absolutely no excuse" for it; followed through the industry, three-quarters of a billion dollars from American families.'
    n: 'Statement by the President on Prices of New Automobiles, [1968–69 Pub. Papers 962](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=272) (Sept. 17, 1968). To check: [[w.bernstein-guns-or-butter]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-17.governors-wa
    when: Sept. 17
    date: '1968-09-17'
    thread: governors
    also: [elections-1968]
    c: Washington's blanket primary, for governor. Governor Evans (R) over O'Connell (D), the attorney general, 305,897 to 182,969, 43.4 percent; Durkan (D), a State senator, 162,382, 23.0 percent; five others. In November Evans over O'Connell, 692,378 to 560,262, 54.7 percent.
    n: 'Votes: [Wash. Secretary of State, Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive), the 1968 primary and general (a database, statewide totals); [Wikipedia, "1968 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1968_Washington_gubernatorial_election). Check: the *Official Abstract of Votes, Primary Election Held on September 17, 1968*, and the general''s (HathiTrust, bot-checked from here). To check: [[w.peirce-pacific-states-of-america]]. See [[cal.1964-11-03.governors-wa]]. Names: Evans, O''Connell, Durkan.'
    tags: [state:wa, name:evans-daniel-j, name:oconnell-john-j, name:durkan-martin-j]
  - id: cal.1968-09-17.vietnam-paris
    when: Sept. 17
    date: '1968-09-17'
    thread: vietnam-paris
    c: 'Harriman, home from Paris, with Johnson, 12:15 p.m., Rostow present: Hanoi will want a settlement, not wait for a new President; the understanding on the DMZ; a decision on ending the bombing hoped for within two weeks. Johnson: Harriman as bad as Rusk in thinking it easy to start the bombing again. By Johnson''s account Harriman promises to urge a resumption "with enthusiasm" if the understandings are violated.'
    n: '[FRUS 1964–68, VII, doc. 20](https://history.state.gov/historicaldocuments/frus1964-68v07/d20) (Harriman''s memorandum). [[w.johnson-vantage-point]], 514–15 (Johnson''s account). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Johnson, Rostow, Rusk. Check: Harriman''s memorandum records no such promise; Johnson''s quotes him.'
    tags: [name:harriman-w-averell, name:johnson-lyndon-b, name:rostow-walt-w, name:rusk-dean]
  - id: cal.1968-09-18.crime-and-hijacking-guns
    when: Sept. 18
    date: '1968-09-18'
    thread: crime-and-hijacking-guns
    c: 'Senate, the gun bill: the registration and licensing of firearms refused, [31–55](https://voteview.com/rollcall/RS0900553); no licenses after 1970 to dealers in States without effective firearms laws, [35–48](https://voteview.com/rollcall/RS0900554); a national firearms inventory, [31–53](https://voteview.com/rollcall/RS0900555); the licensing of concealable weapons, [35–49](https://voteview.com/rollcall/RS0900556). The House''s bill, H.R. 17735, passed, its text replaced by S. 3633''s, [70–17](https://voteview.com/rollcall/RS0900558): the mail-order and interstate sale of rifles, shotguns and ammunition stopped.'
    n: See [[cal.1968-06-06.crime-and-hijacking]].
  - id: cal.1968-09-18.opinion
    when: Sept. 18
    date: '1968-09-18'
    thread: opinion
    also: [elections-1968-polls, war-opposition, civil-disorders]
    c: 'Gallup, Sept. 1–6: the way the Chicago police dealt with the young people protesting the Vietnam war at the time of the Democratic convention: approve 56 percent, disapprove 31. Humphrey''s supporters 44 and 41; Nixon''s 63 and 25; Wallace''s 71 and 20. Those 21 to 29, 47 and 41. Negroes 18 and 63.'
    n: '[[w.gallup-poll]], III, 2160–61. Names: Humphrey, Nixon, Wallace.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:wallace-george-c]
  - id: cal.1968-09-20.students-ca
    when: Sept. 20
    date: '1968-09-20'
    thread: students
    also: [black-nationalism]
    c: 'Berkeley. The Regents of the University of California limit a lecturer without faculty appointment to one appearance a quarter in a course for credit: Cleaver, of the Black Panthers, engaged to give most of the lectures of Social Analysis 139X. Reagan, a Regent, against his teaching.'
    n: 'To check: [[w.rorabaugh-berkeley-at-war]]; [[w.rosenfeld-subversives]]; [[w.cannon-governor-reagan]]. See [[cal.1967-01-20.students]]. Names: Cleaver, Reagan. Check: the day of the Regents'' vote, the vote and the resolution''s terms; the sit-in at Moses Hall, Oct. 23, and the arrests.'
    tags: [state:ca, city:berkeley, name:cleaver-eldridge, name:reagan-ronald]
  - id: cal.1968-09-20.vietnam-paris
    when: Sept. 20–21
    date: '1968-09-20'
    thread: vietnam-paris
    c: 'Paris. Harriman and Vance with Lê Đức Thọ and Xuân Thủy in private, on Saigon''s place: an understanding on it "could be a major factor" in a decision to stop the bombing; Thọ: only "could be." Sept. 21, Harriman and Vance to Rusk: let them say "would be the major factor." Thọ and Thủy to the Politburo, Sept. 20, by Nguyen''s account: Washington will accept the NLF, or any party Hanoi names, on Hanoi''s side.'
    n: 'FRUS 1964–68, VII, docs. [24](https://history.state.gov/historicaldocuments/frus1964-68v07/d24), [26](https://history.state.gov/historicaldocuments/frus1964-68v07/d26), [27](https://history.state.gov/historicaldocuments/frus1964-68v07/d27). [[w.nguyen-hanois-war]], 122–23. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy, Rusk.'
    tags: [name:harriman-w-averell, name:vance-cyrus, name:le-duc-tho, name:xuan-thuy, name:rusk-dean]
  - id: cal.1968-09-22.opinion
    when: Sept. 22
    date: '1968-09-22'
    thread: opinion
    also: [elections-1968-polls, voting-rights, amendments, electoral-college]
    c: 'Gallup, Sept. 1–6: presidential candidates chosen in a nationwide primary instead of by party conventions: favor 76 percent, oppose 13. May 23–28: a constitutional amendment to do away with the Electoral College and elect the President by the total vote: approve 66, disapprove 19. July 18–23: persons 18, 19 and 20 permitted to vote: yes 66, no 31.'
    n: '[[w.gallup-poll]], III, 2161.'
  - id: cal.1968-09-23.economy
    when: Sept. 23
    date: '1968-09-23'
    thread: economy
    c: 'Johnson on General Motors'' prices: if the industry follows them, about $350 million saved.'
    n: 'Statement by the President on Prices of New Automobiles, [1968–69 Pub. Papers 972](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=282) (Sept. 23, 1968). See [[cal.1968-09-17.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-09-24.elections-1968
    when: Sept. 24
    date: '1968-09-24'
    thread: elections-1968
    c: 'Johnson to Clifford, by Clifford''s account: he doubts Humphrey''s fitness to be President, wanting "guts"; he would think more of him if he "showed he had some balls."'
    n: '[[w.dallek-flawed-giant]], 577. To check: [[w.clifford-counsel-to-the-president-2]], 570–72. See [[cal.1968-09-10.elections-1968]]. Names: Johnson, Clifford, Humphrey.'
    tags: [name:johnson-lyndon-b, name:clifford-clark, name:humphrey-hubert-h]
  - id: cal.1968-09-25.opinion
    when: Sept. 25
    date: '1968-09-25'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 1–6, of Humphrey and Nixon, the one who: makes the better appearance on television, Nixon 54 percent, Humphrey 28; is more likeable, Nixon 43, Humphrey 40; is more experienced in world affairs, Nixon 51, Humphrey 31; is more sincere and believable, Nixon 46, Humphrey 34; is more likely to go down in history as a great statesman, Nixon 39, Humphrey 29.'
    n: '[[w.gallup-poll]], III, 2161–62. Names: Humphrey, Nixon.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-09-26.transition-and-staff
    when: Sept. 26
    date: '1968-09-26'
    thread: transition-and-staff
    also: [elections-1968]
    c: 'Ball resigns as Representative to the UN, to work for Humphrey; Johnson: it "has nothing to do with public policy but does have something to do with domestic politics." Wiggins, editor of the *Washington Post*, named in his place; sworn Oct. 4.'
    n: 'Remarks Upon Announcing Resignation of George W. Ball and Intention To Nominate J. Russell Wiggins as U.S. Representative to the United Nations, [1968–69 Pub. Papers 976](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=286) (Sept. 26, 1968); Remarks at the Swearing In of J. Russell Wiggins as U.S. Representative to the United Nations, [1968–69 Pub. Papers 1007](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=317) (Oct. 4, 1968). To check: [[w.ball-past-has-another-pattern]]. See [[cal.1968-09-02.elections-1968]]. Names: Ball, Humphrey, Wiggins, Johnson.'
    tags: [name:ball-george-w, name:humphrey-hubert-h, name:wiggins-james-r, name:johnson-lyndon-b]
  - id: cal.1968-09-28.vietnam-paris
    when: Sept. 28
    date: '1968-09-28'
    thread: vietnam-paris
    c: 'Lê Đức Thọ and Xuân Thủy to Nguyễn Duy Trinh, a plan for the talks: no one of Thiệu''s government at the table, the NLF alone beside Hanoi; the private meetings kept up until the American election, the business left for a four-party conference.'
    n: '[[w.nguyen-hanois-war]], 123. Made public: Nguyen (2012), from the Foreign Ministry''s chronology for internal circulation (Hanoi, 1987). See [[cal.1968-09-07.vietnam]]. Names: Lê Đức Thọ, Xuân Thủy, Nguyễn Duy Trinh.'
    tags: [name:le-duc-tho, name:xuan-thuy, name:nguyen-duy-trinh]
  - id: cal.1968-09-29.opinion
    when: Sept. 29
    date: '1968-09-29'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Sept. 19–24: Nixon 43 percent, Humphrey 28, Wallace 21, undecided 8. South: Wallace 38, Nixon 31, Humphrey 24. Midwest: Nixon 50, Humphrey 27, Wallace 16.'
    n: '[[w.gallup-poll]], III, 2162. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-09-30.elections-1968
    when: Sept. 30
    date: '1968-09-30'
    thread: elections-1968
    also: [vietnam]
    c: 'Salt Lake City, taped for NBC, broadcast that evening: Humphrey, as President, would stop the bombing of the North "as an acceptable risk for peace," since it could lead to success in the negotiations; before it, "key importance" on evidence, "direct or indirect, by word or deed," of Communist willingness to restore the DMZ; the bombing resumed on a showing of bad faith. Nixon to Johnson by telephone, 6:45 p.m.: any change in policy? Johnson: none; he has not read the speech. Humphrey to Johnson, 7:30, minutes before the broadcast. Johnson to Ball, 8:15: "they would have to give me direct or indirect, word or deed."'
    n: '[Johnson and Nixon, 6:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-september-30-1968), Conversation WH6809-04-13433 (Miller Center); [Johnson and Humphrey, 7:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-and-office-secretary-september), Conversation WH6809-04-13435 (Miller Center); [Johnson and Ball, 8:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-ball-october-1-1968), Conversation WH6809-04-13436 (Miller Center). FRUS 1964–68, VII, docs. [38](https://history.state.gov/historicaldocuments/frus1964-68v07/d38), [39](https://history.state.gov/historicaldocuments/frus1964-68v07/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v07/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v07/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v07/d42) (Johnson to Dirksen, Oct. 1). *New York Times*, [Oct. 1, 1968](https://timesmachine.nytimes.com/timesmachine/1968/10/01/issue.html) (the text). To check: [[w.johns-price-of-loyalty]]. See [[cal.1968-09-02.elections-1968]]. Names: Humphrey, Nixon, Johnson, Ball.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m, name:johnson-lyndon-b, name:ball-george-w, state:ut, city:salt-lake-city]
  - id: cal.1968-09-30.jobs-and-wages
    when: Sept. 30
    date: '1968-09-30'
    thread: labor-disputes
    c: 'Executive Order 11431, under the Taft-Hartley Act: a Board of Inquiry, David Cole its chairman, into the disputes between the International Longshoremen''s Association and the shipping and stevedoring employers of the Atlantic and Gulf ports; a strike there would "imperil the national health and safety." Johnson to Ball that evening: "We''ve got the damn longshoremen out tonight." The injunction followed (Check the day).'
    n: '[Executive Order 11431](https://www.presidency.ucsb.edu/documents/executive-order-11431-creating-board-inquiry-report-certain-labor-disputes-affecting-the) (Sept. 30, 1968). FRUS 1964–68, VII, doc. [41](https://history.state.gov/historicaldocuments/frus1964-68v07/d41). See [[cal.1965-02-10.jobs-and-wages]]. Names: Cole, Johnson, Ball.'
    tags: [name:cole-david-l, name:johnson-lyndon-b, name:ball-george-w]
  - id: cal.1968-09-30.conservation
    when: Sept. 30
    date: '1968-09-30'
    thread: conservation
    c: 'Colorado River Basin Project Act signed, [82 Stat. 885](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg885-3.pdf): the Central Arizona Project, the Colorado''s water to central and southern Arizona; no dams on the river between Glen Canyon and Hoover Dam without Congress (Check the terms). Johnson, with Hayden, Jackson, Aspinall and the Udalls: "Next to the air we breathe, water is our most precious resource." The National Water Commission created three days before.'
    n: 'Remarks Upon Signing the Colorado River Basin Project Act, [1968–69 Pub. Papers 991](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=301) (Sept. 30, 1968). Statute (K–J Cong. II.J.2). To check: [[w.johnson-central-arizona-project-1918]]; [[w.reisner-cadillac-desert]]. Names: Hayden, Jackson, Aspinall, Stewart Udall, Morris Udall, Johnson.'
    tags: [name:hayden-carl, name:jackson-henry-m, name:aspinall-wayne-n, name:udall-stewart-l, name:udall-morris-k, name:johnson-lyndon-b]
  - id: cal.1968-09-30.japan-and-korea-pueblo
    when: Sept. 30
    date: '1968-09-30'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the 22nd closed meeting: Pak commits the North to release the crew at the signature of the apology, and hands Woodward the text to be signed.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [316](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d316). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-09-17.japan-and-korea]]. Names: Pak Chung Kuk, Woodward.'
    tags: [name:pak-chung-kuk, name:woodward-gilbert-h]
  - id: cal.1968-09-30.states-and-cities-ocean-hill
    when: Sept. 30
    date: '1968-09-30'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: New York City. The second teachers' strike ends (Check the day).
    n: See [[cal.1968-09-09.states-and-cities-nyc]].
    tags: [state:ny, city:nyc]
