  - id: cal.1968-09.china-leadership-4
    when: Sept.
    date: 1968-09
    at: before 1968-09-11
    thread: china-leadership
    c: 'Mao 毛泽东, on the investigation report of the *Renmin ribao* 人民日报 criticism group, ''The education revolution in the villages must rely on the poor and lower-middle peasants: the experience of the Shuiyuan commune, Yingkou county'', printed in the paper''s *Wenhua da geming qingkuang huibian* no. 593 of Aug. 24: ''Do as proposed.'' He changes its subtitle, and adds: the Shuiyuan 水源 commune''s schools have done the education revolution rather well; their most important experience is that the revolutionary teachers and pupils joined the poor and lower-middle peasants and relied on them closely in a mass movement of the education revolution, so that the poor and lower-middle peasants run the schools with the teachers and pupils.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 319–320 (Sept. 1968). Made public: *Hongqi*, no. 3, Sept. 10, 1968 and the *Renmin ribao* Sept. 16 (the report as printed, signed ''investigators of the Renmin ribao and Hongqi''). Check: the day of Mao''s note, after Aug. 31, when Yao Wenyuan sent the report. Names: Mao Zedong, Yao Wenyuan.'
    src:
      c: a593c1a7
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 319–320: all'
    tags: [polity:prc, name:mao-zedong, name:yao-wenyuan, vis:only:prc]
  - id: cal.1968-09.china-leadership-5
