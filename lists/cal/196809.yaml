    when: Sept. 2
    date: '1968-09-02'
    thread: jobs-and-wages
    c: 'Labor Day. Johnson''s statement: employment at an all-time peak of almost 78 million; Americans "must open their hearts and work with a new sense of purpose to help the disadvantaged enter the mainstream of our society."'
    n: 'Statement by the President, Labor Day, 1968, [1968–69 Pub. Papers 921](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=231) (Sept. 2, 1968; released at Austin). [[w.dallek-flawed-giant]], 552 (the Labor Day statement, its words). Names: Johnson.'
