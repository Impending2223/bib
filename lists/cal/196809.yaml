  - id: cal.1968-09-01.elections-1968
    when: Sept. 1
    date: '1968-09-01'
    thread: elections-1968-nixon
    also: [economy-surcharge]
    c: 'Nixon on the "tax of inflation": "In the last two years the average American worker has been on a Government-operated treadmill. New taxes and rising prices have more than wiped out all the pay raises he has won since 1965." The new taxes and "the hidden tax of inflation" have left his purchasing power below December 1965''s.'
    n: '[[w.zelizer-fierce-urgency-of-now]], 310. To check: "Nixon Scores ''Tax of Inflation''; Says Worker Is on Treadmill," [*New York Times*, Sept. 2, 1968](https://timesmachine.nytimes.com/timesmachine/1968/09/02/issue.html) (cited by [[w.zelizer-fierce-urgency-of-now]], 310 n.10). Check: the day and the place. Names: Nixon.'
    src:
      c: c34ab24a
      rows:
        - 'w.zelizer-fierce-urgency-of-now 310: all'
        - 'via w.zelizer-fierce-urgency-of-now 310 n.10: all'
    tags: [name:nixon-richard-m]
  - id: cal.1968-09-01.china-leadership
    when: Sept. 1
    date: '1968-09-01'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Mao, Lin Biao and Zhou Enlai telegraph Hồ Chí Minh and others on the DRV''s twenty-third anniversary: the Vietnamese victory a contribution to peoples against American imperialism; seven hundred million Chinese will support the war to the end.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1968. [[w.zhonghua-renmin-gongheguo-waijiao]], 201 (Sept. 1, 1968; the greetings on the 23rd anniversary: the protracted war); [[w.jianguo-yilai-mao-zedong]], XIX, 307–308 (Sept. 1, 1968; printed from the *Renmin ribao* of Sept. 2, 1968, dated Peking, Sept. 1; addressed to Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng). Names: Mao Zedong, Lin Biao, Zhou Enlai, Hồ Chí Minh.'
    src:
      c: 4ecb98ff
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Sept. 1, 1968: all'
        - 'w.zhonghua-renmin-gongheguo-waijiao 201: A'
        - 'w.jianguo-yilai-mao-zedong XIX, 307–308: A-B'
    tags: [polity:prc, polity:drv, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:ho-chi-minh]
  - id: cal.1968-09-01.china-leadership-2
    when: Sept. 1
    date: '1968-09-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai at the Cultural Revolution Group's liaison meeting, which discusses and passes the Xinjiang Military Region's report on setting up the Xinjiang Uighur Autonomous Region's revolutionary committee and the Center's instruction on it. The same day, with Mao's consent, the Center, State Council, Military Commission and Group approve the committee.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250 (Sept. 1, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1968-09-01.china-leadership-3
    when: Sept. 1
    date: '1968-09-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the liaison meeting that discusses and revises the Peking revolutionary committee''s "Several provisions on selecting and sending workers'' Mao Zedong Thought propaganda teams": workers are to be drawn from factories that have achieved great alliance, set up committees and cleared class ranks with marked results, only outstanding industrial workers, none still tied to the factions of the unit they are sent to; about a tenth of the city''s industrial workers, so long as production is not hurt. On Sept. 2 Zhou proposes to Mao that the provisions go to the whole country; Mao approves, and on Sept. 5 Zhou drafts the Center''s covering comment.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 250–251 (Sept. 1, 1968). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
