  - id: cal.1965-02-10.vietnam
    when: Feb. 10–11
    date: '1965-02-10'
    thread: vietnam
    c: 'Qui Nhơn. A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed. Humphrey, Ball and Thompson ask that reprisal wait until Kosygin has left the area; McNamara and most of the others for striking at once. Flaming Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized zone; American and South Vietnamese planes, the barracks at Chấp Lễ.'
    n: 'FRUS 1964–68, II, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106). [[w.gibbons-u-s-government-and]], III, 77–83; [[w.frankum-like-rolling-thunder]], 17–18; [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack at Qui Nhơn; the strikes in reply); [[w.cosmas-joint-chiefs-of-staff-2012]], 216–217; [[w.staaveren-gradual-failure]], 21–22. Frankum, 18, has the South Vietnamese strike another barracks, his target 32, not Chấp Lễ; Staaveren, 21–22, their target the Vu Con barracks, Chấp Lễ an alternate. Target 32 is the Vu Con barracks (FRUS 1964–68, II, doc. 78 n. 4); FRUS''s editors, from Vance''s chronology, have American and South Vietnamese planes strike Chấp Lễ (doc. 106). To check: Rolling Thunder (Proj CHECO, 1966), pp 9-12 (cited by [[w.staaveren-gradual-failure]], 22 n.27a); hist, CINCPAC, 1965, Vol II, p 322 (cited by [[w.staaveren-gradual-failure]], 22 n.27b). See [[cal.1965-02-07.vietnam]]. Names: Humphrey, Ball, McNamara, Thompson, Kosygin.'
