  - id: cal.1965-02.china-2
    when: Feb., late
    date: 1965-02
    at: before 1965-02-19
    thread: china
    also: [soviet-union, vietnam-diplomacy]
    c: 'By Zhou''s account to the Romanian leaders, Mar. 25, the Soviet list sent after Kosygin''s return from Hanoi: with the two antiaircraft missile regiments for the DRV, 4,000 regular troops; a unit of 12 MiG-21s with 500 men at Kunming; two air corridors across China. China, having consulted the Vietnamese, refuses the troops.'
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou: ''in the last ten days of February''; ''not for instruction, but to ensure their control''; the list of arms itself given in mid-March, ''300 and some armaments wagons''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Kosygin, Zhou Enlai. Check: the day of the refusal.'
    tags: [polity:ussr, polity:prc, polity:drv, name:kosygin-aleksei, name:zhou-enlai, vis:only:ussr+prc+drv, vis:from:romania:1965-03-25, ok:fields-place]
  - id: cal.1965-02.china-3
    when: Feb., late
    date: 1965-02
    at: before 1965-02-19
    thread: china
    also: [soviet-union, vietnam-diplomacy]
    c: By Zhou's account to the Romanian leaders, Mar. 25, the Soviet Union proposes sending 40 AN-12 aircraft to North Vietnam with 75 machine guns and 18 37-mm antiaircraft guns; China answers that Hanoi's airport cannot take them, and sends 100 machine guns and 66 guns itself.
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou: ''At the end of February of this year''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). Names: Zhou Enlai. Check: the day.'
    tags: [ok:fields-place, polity:ussr, polity:prc, polity:drv, name:zhou-enlai, vis:only:ussr+prc, vis:from:romania:1965-03-25]
  - id: cal.1965-02.soviet-union
    when: Feb., late
    date: 1965-02
    at: before 1965-02-19
    place: bucharest
    thread: soviet-union
    c: 'A representative of the CPSU Central Committee''s International Department, at Bucharest, asks the Romanians to take part in the meeting of Mar. 1. They refuse and advise renouncing it: Kosygin''s visits to Vietnam, China and Korea, they say, have made it needless. Ceaușescu''s account to Zhou, Mar. 25.'
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Ceaușescu: ''Just a few days before the beginning of that gathering''; the representative ''was here''. Made public: 2005 ([[w.relatiile-romano-chineze-1880]], Document 252, 690–714). See [[cal.1965-02-06.soviet-union]]. Names: Ceaușescu, Kosygin. Check: the day and the representative''s name.'
    tags: [polity:ussr, polity:romania, name:ceausescu-nicolae, name:kosygin-aleksei, vis:only:romania+ussr, vis:from:prc:1965-03-25]
  - id: cal.1965-02.china-leadership-2
    when: Feb., Kosygin's passage through China
    date: 1965-02
    at: after 1965-02-05
    thread: china-leadership
    also: [soviet-union]
    c: 'Zhou, with Kosygin on his way through China to and from Vietnam, raises again China''s word: even if the United States strikes China, China will not ask the Soviet Union to take part in the war. So Zhou tells Ben Bella, Mar. 31.'
    n: '"[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou: "In February this year, Kosygin visited Vietnam and Korea, stopping by China along the way. Once again I raised this matter"; no talk named). See [[cal.1964-11.china-leadership-5]]; the visit''s first talk, [[cal.1965-02-05.china-leadership]]. Names: Zhou Enlai, Kosygin, Ben Bella. Check: the day, and in which talk. Check: the year the Archive posted the document.'
