    thread: vietnam-diplomacy
    also: [press-and-broadcasting]
    c: 'U Thant''s press conference at the UN: he has been in talks on Vietnam for some time.{1} "I am sure that the great American people, if only they knew the true facts and the background to the developments in South Vietnam, will agree with me that further bloodshed is unnecessary."{2} "As you know, in times of war and hostilities, the first casualty is truth."{3} His talks with the parties: "concrete ideas and proposals" he cannot disclose.{4}'
    n: '[FRUS 1964–68, II, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v02/d161) (editorial note: the press conference; extracts, *Papers of Adlai E. Stevenson*, VIII, 663–64). [[w.herring-lbj-and-vietnam]], 92–93 (the press conference and its words; before it, Bill Frye''s account of Thant''s first move in the *Chicago Sun-Times*, Feb. 21; after it, Reedy''s denial of any "authorized negotiations"; the *Times* for negotiations); [[w.rusk-as-i-saw-it-1990]], 463 (Thant''s press conference, Feb. 24, 1965; "In times of war and hostilities, the first casualty is truth"; the first quotation read otherwise, see the variant; not "for some time" or "concrete ideas"). [[w.logevall-choosing-war]], 352–53 (the press conference; the "concrete ideas and proposals"; the quotation). Check: Logevall, 353, has "if only they know." To check: the transcript, Stevenson Papers, Princeton, box 906 (cited by FRUS); *New York Times*, [Feb. 17](https://timesmachine.nytimes.com/timesmachine/1965/02/17/issue.html), [Feb. 18](https://timesmachine.nytimes.com/timesmachine/1965/02/18/issue.html), [Feb. 21](https://timesmachine.nytimes.com/timesmachine/1965/02/21/issue.html), and [Feb. 25, 1965](https://timesmachine.nytimes.com/timesmachine/1965/02/25/issue.html) (cited by [[w.herring-lbj-and-vietnam]], 93 n.11); [*New York Times*, Feb. 25, 1965](https://timesmachine.nytimes.com/timesmachine/1965/02/25/issue.html) (cited by [[w.logevall-choosing-war]], 353 n.37). Check: Rusk, 463, has "would agree.". See [[cal.1964-08-06.vietnam-2]]. Names: U Thant.'
    src:
