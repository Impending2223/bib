  - id: cal.1965-02-19.succession
    when: Feb. 19
    date: '1965-02-19'
    thread: succession
    also: [amendments]
    c: Senate passes S.J. Res. 1, the amendment on presidential inability and vice-presidential vacancies, [72–0](https://voteview.com/rollcall/RS0890018). The President may declare his own inability; the Vice President, with a majority of the Cabinet, may declare it; a disagreement goes to Congress, two-thirds of both Houses to keep the Vice President acting. A vacant Vice Presidency filled by the President's nominee, confirmed by a majority of both Houses.
    n: '[111 Cong. Rec., Senate, Feb. 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt3-3-1.pdf) (Voteview counts 61 yeas; the Record, 72). See [[cal.1964-09-28.succession]]; [[cal.1965-01-28.succession]]. Names: Bayh.'
