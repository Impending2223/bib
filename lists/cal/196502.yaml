  - id: cal.1965-02-06.vietnam-congress
    when: Feb. 6
    date: '1965-02-06'
    thread: vietnam-congress
    also: [vietnam]
    c: 'The 545th NSC, 7:45 to 9 p.m., on reprisal for Pleiku, McCormack and Mansfield present. Mansfield: "We are not now in a penny ante game"; the people of the South "not behind us"; caution "our watchword"; what government had cleared it? A war with China, the Soviet-Chinese split healed, "worse than Korea." Johnson: "cowardice has gotten us into more wars than response has." Ball: "We are all in accord that action must be taken." The strikes authorized; Johnson: "We need a recommendation from Saigon."'
    n: 'FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76) (summary notes); [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77) (memorandum for the record). [[w.mann-grand-delusion]], 394–95. Check: Mann dates the meeting the evening of Feb. 7. [[w.preston-war-council]], 173 (Ball; Johnson''s wait for Saigon''s recommendation). See [[cal.1965-02-07.vietnam]]. Names: McCormack, Mansfield, Johnson.'
