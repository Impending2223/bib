    when: Feb. 5
    date: '1965-02-05'
    thread: voting-rights-selma
    also: [voting-rights, king]
    c: Selma. Fifteen members of Congress arrive in the afternoon; King leaves jail to meet them. To reporters, he will go to Washington to ask Johnson for voting rights legislation.
    n: '[[w.garrow-bearing-the-cross]], 386; [[w.sundquist-politics-and-policy]], 272 (the fifteen members). [[w.kabaservice-rule-and-ruin]], 139 (Mathias, Morse and Reid of the Wednesday Group among them, at their own expense; the jailers'' cattle prods). See [[cal.1965-02-01.voting-rights]]. Check: the members. Names: Martin Luther King, Johnson.'
