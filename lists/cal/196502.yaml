    when: Feb. 9
    date: '1965-02-09'
    thread: voting-rights
    also: [king]
    c: 'King with Humphrey and Katzenbach, over an hour, on the voting bill; then ten minutes with Johnson, Lee White present. King: Johnson to send a proposal to Congress "very soon."'
    n: '[[w.dallek-flawed-giant]], 214. [[w.garrow-bearing-the-cross]], 386–88. Check: the record. See [[cal.1965-02-01.voting-rights]]. Names: King, Humphrey, Katzenbach, Johnson, White.'
