  - id: cal.1965-02-07.vietnam-2
    when: Feb. 7–8
    date: '1965-02-07'
    thread: vietnam
    c: 'McGeorge Bundy''s report to Johnson, written on the flight home: without new American action "defeat appears inevitable," within "the next year or so." Its annex, "A Policy of Sustained Reprisal": air and naval action against the North, justified by "the whole Viet Cong campaign of violence and terror in the South"; its odds "somewhere between 25% and 75%," worth it even if it fails. Feb. 8, Johnson to Taylor: the December plan for continuing action against the North to be carried out.'
    n: 'FRUS 1964–68, II, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v02/d84), [91](https://history.state.gov/historicaldocuments/frus1964-68v02/d91). [[w.gibbons-u-s-government-and]], III, 58–59, 67; [[w.drea-mcnamara-clifford-and-the-2011]], 56 (Bundy''s proposal of sustained bombing; the December plan to be carried out); [[w.marolda-united-states-navy-and]], 502 (Bundy''s recommendation, Feb. 7). To check: [[w.pentagon-papers]]. See [[cal.1965-02-07.vietnam]]. Names: McGeorge Bundy, Taylor, Johnson.'
