    when: Feb. 5
    date: '1965-02-05'
    thread: king
    also: [voting-rights]
    c: 'Lee White to Johnson, after Wachtel''s call asking an appointment for King: "My own personal reaction ... is to avoid seeing King"; Katzenbach thinks Selma has acted "pretty responsibly," King should be content with Judge Thomas''s order. If King comes to Washington, Katzenbach or Humphrey to see him.'
