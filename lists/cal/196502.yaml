    place: washington
    thread: vietnam-congress
    also: [vietnam]
    c: 'The 545th NSC, 7:45 to 9 p.m., on reprisal for Pleiku, McCormack and Mansfield present.{1} Mansfield: "We are not now in a penny ante game"; the people of the South "not behind us";{2} caution "our watchword"; what government had cleared it? A war with China, the Soviet-Chinese split healed, "worse than Korea."{3} Johnson: "cowardice has gotten us into more wars than response has."{4} Ball: "We are all in accord that action must be taken."{5} The strikes authorized;{6} Johnson: "We need a recommendation from Saigon."{7}'
    n: 'FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76) (summary notes); [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77) (memorandum for the record). [[w.mann-grand-delusion]], 394–95; [[w.white-making-of-the-president-1969]], 19–21 (Ball''s objection, Kosygin in Hanoi; Bundy''s call from Saigon at seven, Vance taking it; McNamara, Vance and Wheeler draft the orders to Sharp); [[w.branch-pillar-of-fire]], 581–82; [[w.solberg-hubert-humphrey]], 270 (the council on reprisal, Mansfield there, Humphrey away; the bombing of the North decided); [[w.dallek-flawed-giant]], 247–48 (after Pleiku, the NSC meeting with congressional leaders; Johnson announces the air attack; Mansfield alone dissents, urging negotiation; not the hour, the number or the quotations). Check: Mann dates the meeting the evening of Feb. 7. [[w.preston-war-council]], 173 (Ball; Johnson''s wait for Saigon''s recommendation). Check: White has the meeting called for soon after six. To check: Bromley Smith, "Summary Notes of 545th NSC Meeting," Feb. 6, 1965, Meeting Notes File, Box 1, LBJ (cited by [[w.branch-pillar-of-fire]], 581); Bromley Smith, "Summary Notes of 545th NSC Meeting," Feb. 6, 1965, Meeting Notes File, Box 1, LBJ (cited by [[w.branch-pillar-of-fire]], 582); William P. Bundy Oral History by Paige E. Mulhollan, May 26, 1969, pp. 7–12, LBJ (cited by [[w.branch-pillar-of-fire]], 582). See [[cal.1965-02-07.vietnam]]. Names: McCormack, Mansfield, Johnson.'
