  - id: cal.1965-02-02.states-and-cities
    when: Feb. 2
    date: '1965-02-02'
    thread: states-and-cities
    c: 'Special message on home rule for the District of Columbia. A charter bill: an elected local government and an elected delegate in the House. Congress keeps its power to legislate for the District and to repeal the council''s acts; the President an absolute veto.'
    n: Special Message to the Congress on Home Rule for the District of Columbia, [1965 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=197) (Feb. 2, 1965). [[w.califano-triumph-and-tragedy-of]], 228 (home rule asked; the Senate expected to pass it, the House District Committee to kill it); [[w.bernstein-guns-or-butter]], 313 ("the people elect those who govern them"; a mayor, a council of 15, a nonvoting member of the House). See [[cal.1961-03-29.states-and-cities]].
