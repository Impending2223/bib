  - id: cal.1965-02-13.transition-and-staff
    when: Feb. 13
    date: '1965-02-13'
    thread: transition-and-staff
    c: Katzenbach sworn as Attorney General, Ramsey Clark as Deputy, at the White House. The Senate confirmed both Feb. 10 without a roll call. Katzenbach had been acting since September.
    n: 'Remarks at the Swearing In of Nicholas deB. Katzenbach as Attorney General and Ramsey Clark as Deputy Attorney General, [1965 Pub. Papers 182](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=258) (Feb. 13, 1965). [111 Cong. Rec., Senate, Feb. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-9-2.pdf). To check: [[w.katzenbach-some-of-it-was]]. See [[cal.1964-09-03.transition-and-staff]]. Names: Katzenbach, Clark.'
