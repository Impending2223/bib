    thread: labor-disputes
    c: 'The longshoremen''s strike. The ILA has struck every Atlantic and Gulf port since Jan. 11. Johnson: the strike "totally unjustified" in the North Atlantic and East Gulf ports, where agreement has been reached; Wirtz, Connor and Senator Morse to recommend terms for the South Atlantic and West Gulf. Feb. 12, the employers accept the recommendations; nearly all the major ports to reopen the next morning.'
