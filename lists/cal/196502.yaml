  - id: cal.1965-02-01.voting-rights
    when: Feb. 1
    date: '1965-02-01'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. King and Abernathy arrested with some 250 marching to the courthouse; they refuse bond. At Marion, in Perry County, some 700 arrested the same day. Check the counts.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 382–84; [[w.mann-walls-of-jericho]], 450–51 (King and Abernathy arrested; Marion, nearly seven hundred); [[w.branch-pillar-of-fire]], 575–77; [[w.kotz-judgment-days]], 263–64 (264 marchers, 258 Negro and 6 white, arrested by Baker for parading without a permit); [[w.bernstein-guns-or-butter]], 220 (Baker arrests King with 260). Check: Branch gives 264 marching by the FBI''s count, nearly seven hundred leaving for Perry County''s first Freedom Day, and nearly five hundred schoolchildren arrested by Clark the same day (575–76). To check: [[w.garrow-protest-at-selma]]; Mobile LHM dated Feb. 5, 1965, FDCA-324, pp. 1–3 (cited by [[w.branch-pillar-of-fire]], 575); King ABC news statement of Feb. 1, 1965 (misdated as Feb. 2), A/KS (cited by [[w.branch-pillar-of-fire]], 575); SAC, Mobile, to Director, Feb. 1, 1965, FDCA-288 (cited by [[w.branch-pillar-of-fire]], 576); Fager, Selma 1965 (1985), 52–53 (cited by [[w.branch-pillar-of-fire]], 576); Int. Frank Soracco, Sept. 12–14, 1990, Oct. 21, 1997 (cited by [[w.branch-pillar-of-fire]], 576); Int. Sheriff Robert "Cotton" Nichols, May 28, 1990 (cited by [[w.branch-pillar-of-fire]], 576). See [[cal.1965-01-02.voting-rights]]. Check: Garrow, 382, 384, has 260 arrested with King, some 700 more at the courthouse that afternoon and 600 marching at Marion; more than 700 arrested at Marion Feb. 3. Names: King, Abernathy.'
