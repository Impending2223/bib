    c: 'Zhou agrees in principle to the Economic Commission''s list of trusts for 1965: besides the twelve approved by the Center, four more on trial; gold and electrical industry companies to begin forming now; petroleum, timber processing and instruments need talks with the offices concerned first; regional companies for steel (Beijing, Tianjin, Tangshan or all Hebei) to be considered. Asks the Commission to choose companies of different conditions to send summaries of first experience.'
