    c: 'The 547th NSC, 10:30 a.m., the leaders, Mansfield, Dirksen, McCormack and Ford, joining.{1} Johnson: "We are now ready to return to our program of pushing forward in an effort to defeat North Vietnamese aggression without escalating the war."{2} The Congressional Resolution and his powers enough;{3} "the views of a few Senators could not control his actions";{4} he will use it "carefully but effectively."{5} Ford: more money and men?{6} McNamara: "not in the initial stages."{7} Dirksen asks what a withdrawal would mean; Bundy: the consequences in Southeast Asia very large, elsewhere "even to the extent of affecting the morale in Berlin."{8}'
