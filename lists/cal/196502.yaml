    c: Selma. King and Abernathy arrested with some 250 marching to the courthouse; they refuse bond. At Marion, in Perry County, some 700 arrested the same day. Check the counts.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 382–84. To check: [[w.garrow-protest-at-selma]]; [[w.branch-at-canaans-edge]]; New York Times, Feb. 1, 1965, 16; Feb. 2, 1965, 1; Washington Post, Feb. 2, 1965, A1; Selma Times-Journal, Feb. 1, 1965, 1; Feb. 2, 1965, 1; FBI file 44-27969-64; King to Young, Selma jail notes, Feb. 1-5, 1965, King Papers, 22-6, King Center (cited by [[w.garrow-bearing-the-cross]], 382 n.25). See [[cal.1965-01-02.voting-rights]]. Check: Garrow, 382, 384, has 260 arrested with King, some 700 more at the courthouse that afternoon and 600 marching at Marion; more than 700 arrested at Marion Feb. 3. Names: King, Abernathy.'
