    tags: [name:de-gaulle-charles, name:ball-george-w, name:dillon-c-douglas]
  - id: cal.1965-02-04.vietnam
    when: Feb. 4
    date: '1965-02-04'
    thread: vietnam
    c: 'The Bundy mission in Saigon, by Air Force 3, in the morning: Bundy, Cooper, McNaughton, Unger, Goodpaster and Rogers. Bundy to McCone, 7:10 p.m.: no member of the country team thinks deterioration can be stopped without "a reasonably effective and stable government"; "Getting it is something else again." "The current situation among non-Communists forces gives all the appearances of a civil war within a civil war."'
    n: '[FRUS 1964–68, II, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v02/d66) (the telegram). [[w.preston-war-council]], 170–72. Names: Bundy, Chester Cooper, McNaughton, Unger, Goodpaster, McCone.'
    src:
      c: ae98f407
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d66: B'
        - 'w.preston-war-council 170–72: all'
    tags: [name:bundy-mcgeorge, name:cooper-chester-l, name:mcnaughton-john-t, name:unger-leonard, name:goodpaster-andrew-j, name:mccone-john-a, place:saigon]
  - id: cal.1965-02-04.vietnam-2
    when: Feb. 4
    date: '1965-02-04'
    thread: vietnam
    c: 'McGeorge Bundy and William Bundy by telephone: nothing in the President''s press conference to answer; nothing yet set for the mission''s return. McGeorge Bundy: "we will not return with urgent and immediate requirements for decision making meetings because of the continuing fluidity of the local situation here."'
    n: '[FRUS 1964–68, II, doc. 72](https://history.state.gov/historicaldocuments/frus1964-68v02/d72). [[w.preston-war-council]], 176–77. Names: McGeorge Bundy, William Bundy.'
