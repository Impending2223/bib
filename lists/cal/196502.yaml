    c: 'The Senate''s "Vietnam debate" opens.{1} Church: the Saigon government losing "for lack of internal cohesion"; a negotiated, neutral Indochina.{2} McGee: the domino theory valid;{3} a line at the 17th parallel, graduated bombing of the North if it is crossed.{4} Nelson: "it clearly would be folly to expand our mission."{5} McGovern: bombing the North "will not solve the guerrilla struggle in the south"; pressure for negotiation, not "the false hope that military victory is possible for either side."{6}'
