    c: 'The 546th NSC, 8 a.m., with McCormack, Mansfield and Ford. Mansfield: "Why cannot we handle this matter through the United Nations? Can''t the Geneva powers act?" Johnson: "This cannot be done." Ford: why strike one target of four? Mansfield: the purpose to impress Hồ Chí Minh and Giáp, not necessary "to go any further at this time"; Johnson: to impress Kosygin "and a number of others in the world, including our own citizens." Mansfield and McCormack agree to the South Vietnamese strike.'
    n: 'FRUS 1964–68, II, docs. [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80) (summary notes); [81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (memorandum for the record). [[w.mann-grand-delusion]], 395–96. [[w.ball-past-has-another-pattern]], 390 (the meeting). Check: Mann dates the meeting the morning of Feb. 8. After the attack at Pleiku: [[cal.1965-02-07.vietnam]]. See [[cal.1965-02-06.vietnam-congress]]. Names: McCormack, Mansfield, Ford, Johnson, Hồ Chí Minh, Võ Nguyên Giáp, Kosygin. Check: Ball (390) has himself, Mansfield, Humphrey and Thompson for putting the strike off while Kosygin was in Hanoi, McNamara prevailing, and Humphrey kept from the meetings for months after.'
