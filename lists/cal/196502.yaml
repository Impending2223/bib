  - id: cal.1965-02-07.vietnam-2
    when: Feb. 7–8
    date: '1965-02-07'
    thread: vietnam
    follows:
      - cal.1965-02-07.vietnam
    c: 'McGeorge Bundy''s report to Johnson, written on the flight home: without new American action "defeat appears inevitable," within "the next year or so." Its annex, "A Policy of Sustained Reprisal": air and naval action against the North, justified by "the whole Viet Cong campaign of violence and terror in the South"; its odds "somewhere between 25% and 75%," worth it even if it fails. Feb. 8, Johnson to Taylor: the December plan for continuing action against the North to be carried out.'
    n: 'FRUS 1964–68, II, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v02/d84), [91](https://history.state.gov/historicaldocuments/frus1964-68v02/d91). [[w.gibbons-u-s-government-and]], III, 58–59, 67; [[w.drea-mcnamara-clifford-and-the-2011]], 56 (Bundy''s proposal of sustained bombing; the December plan to be carried out); [[w.marolda-united-states-navy-and]], 502 (Bundy''s recommendation, Feb. 7); [[w.preston-war-council]], 176–79 (the report and its annex; "surrender on the installment plan"; Pleiku "an ideal opportunity"); [[w.mcnamara-in-retrospect]], ch. 7 at n.3. [[w.ball-past-has-another-pattern]], 390 (Bundy''s recommendations: reprisal to lift morale in the South; Hanoi''s will "an important but longer-range purpose"); [[w.branch-pillar-of-fire]], 582; [[w.bernstein-guns-or-butter]], 345 ("Defeat appears inevitable"; "sustained reprisal"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 529–30 ("The situation in Vietnam is deteriorating, and without new U.S. action defeat appears inevitable"). Check: Rusk (447): back from Churchill''s funeral with the flu, then at Ball''s place in Florida, he was away when the decision was made. Written after Pleiku, on the flight home: [[cal.1965-02-07.vietnam]]. To check: [[w.pentagon-papers]]; [[w.johnson-vantage-point]], 126 (cited by [[w.branch-pillar-of-fire]], 582). See [[cal.1965-02-07.vietnam]]. Names: McGeorge Bundy, Taylor, Johnson.'
