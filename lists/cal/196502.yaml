    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. King and Abernathy arrested with some 250 marching to the courthouse; they refuse bond. At Marion, in Perry County, some 700 arrested the same day. Check the counts.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 382–84; [[w.mann-walls-of-jericho]], 450–51 (King and Abernathy arrested; Marion, nearly seven hundred). To check: [[w.garrow-protest-at-selma]]. See [[cal.1965-01-02.voting-rights]]. Check: Garrow, 382, 384, has 260 arrested with King, some 700 more at the courthouse that afternoon and 600 marching at Marion; more than 700 arrested at Marion Feb. 3. Names: King, Abernathy.'
