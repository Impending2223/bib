  - id: cal.1965-02-16.opinion
    when: Feb. 16
    date: '1965-02-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey, no field dates printed: have heard of the recent developments in Vietnam, 91 percent. Of them, the action taken by the United States in the last few days: approve 67, disapprove 15. Continue present efforts in South Vietnam, 64; pull out, 18. Continue at the risk of nuclear war, 31; not, 21.'
    n: '[[w.gallup-poll]], III, 1925.'
  - id: cal.1965-02-17.vietnam
    when: Feb. 17
    date: '1965-02-17'
    thread: vietnam
    c: 'Johnson to the National Industrial Conference Board: "We seek no wider war," but "our continuing actions will be those which are justified and those that are made necessary by the continuing aggression of others." Humphrey''s memorandum to Johnson, the same day: 1965 "the year of minimum political risk"; the administration better placed to "cut losses" than any this century; the opposition "more Democratic than Republican." Humphrey kept from the Vietnam councils for a time after. Check.'
    n: 'Remarks to the National Industrial Conference Board, [1965 Pub. Papers 202](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=278) (Feb. 17, 1965). [FRUS 1964–68, II, doc. 134](https://history.state.gov/historicaldocuments/frus1964-68v02/d134). [[w.gibbons-u-s-government-and]], III, 107. To check: [[w.humphrey-education-of-a-public-1976]]; [[w.solberg-hubert-humphrey]]; [[w.johns-price-of-loyalty]]. See [[cal.1965-02-07.vietnam]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-02-17.poverty
    when: Feb. 17
    date: '1965-02-17'
    thread: poverty
    c: 'Letter to Congress on the war on poverty: the Economic Opportunity Act''s programs extended two years; $1.5 billion for fiscal 1966; the college work-study program to the Office of Education.'
    n: 'Letter to the President of the Senate and to the Speaker of the House on Stepping Up the War on Poverty, [1965 Pub. Papers 199](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=275) (Feb. 17, 1965). To check: [[w.gillette-launching-the-war-on]]. See [[cal.1964-12-12.poverty]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-17.opinion
    when: Feb. 17
    date: '1965-02-17'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey: Vietnam likely to lead to a bigger war, 45 percent; not, 44. The United States handling South Vietnam as well as could be expected, 62; badly, 22. A UN army to deal with Southeast Asia and Vietnam: approve 60, disapprove 20.'
    n: '[[w.gallup-poll]], III, 1925.'
  - id: cal.1965-02-17.japan-and-korea
    when: Feb. 17–20
    date: '1965-02-17'
    thread: japan-and-korea-normalization
    also: [japan]
    c: 'Shiina, Japan''s Foreign Minister, in Seoul. The Basic Relations Treaty initialed, Feb. 20: embassies at once.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [357](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d357), [358](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d358). See [[cal.1964-06-03.japan-and-korea]]. Names: Shiina.'
    tags: [name:shiina-etsusaburo]
  - id: cal.1965-02-17.vietnam-2
    when: Feb. 17
    date: '1965-02-17'
    thread: vietnam
    c: 'The Senate''s "Vietnam debate" opens. Church: the Saigon government losing "for lack of internal cohesion"; a negotiated, neutral Indochina. McGee: the domino theory valid; a line at the 17th parallel, graduated bombing of the North if it is crossed.'
    n: '[111 Cong. Rec. 2869](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-1-1.pdf) ff. (Church), 2884 ff. (McGee) (1965). [[w.gibbons-u-s-government-and]], III, 131–133. Names: Church, McGee.'
    tags: [name:church-frank, name:mcgee-gale-w]
  - id: cal.1965-02-17.vietnam-3
    when: Feb. 17
    date: '1965-02-17'
    thread: vietnam
    c: Eisenhower with Johnson, McNamara and Wheeler in the Cabinet Room, 10 a.m.–12:30 p.m. Deny Southeast Asia to the Communists; strikes on the North to break Hanoi's will. Negotiation from weakness "likely to lead only into deceit." The Tonkin Gulf resolution like the Formosa one, ample.
    n: '[FRUS 1964–68, II, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v02/d133). [[w.gibbons-u-s-government-and]], III, 130–131; [[w.johns-vietnams-second-front]], 86–88 (the meeting; Eisenhower''s advice); [[w.johnson-vantage-point]], 130–31. See [[cal.1965-02-13.vietnam]]. Names: Eisenhower, Johnson, McNamara, Wheeler.'
    tags: [name:eisenhower-dwight-d, name:johnson-lyndon-b, name:mcnamara-robert-s, name:wheeler-earle]
  - id: cal.1965-02-18.voting-rights
    when: Feb. 18
    date: '1965-02-18'
    thread: voting-rights-selma
    also: [alabama]
    c: Marion, Perry County. A night march of some 500 from Zion Methodist Church toward the jail, where an SCLC worker is held; the street lights go out, and state troopers and local police beat the marchers back. A trooper shoots Jimmie Lee Jackson, 26, in a café where he had gone with his mother and grandfather. He dies at Selma, Feb. 26. Check.
    n: '[[w.garrow-bearing-the-cross]], 391–92. To check: [[w.garrow-protest-at-selma]]; [[w.may-bending-toward-justice]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]; [[cal.1965-02-01.voting-rights]]. Names: Jackson.'
    tags: [name:jackson-jimmie-lee]
  - id: cal.1965-02-18.economy
    when: Feb. 18
    date: '1965-02-18'
    thread: economy
    c: Senate passes the bill to end the gold reserve against Federal Reserve deposits, [74–7](https://voteview.com/rollcall/RS0890016).
    n: '[111 Cong. Rec., Senate, Feb. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt3-2-2.pdf). See [[cal.1965-02-09.economy]].'
  - id: cal.1965-02-18.economy-2
    when: Feb. 18
    date: '1965-02-18'
    thread: economy
    also: [trade]
    c: Johnson asks the business and banking leaders at the White House for their help on the balance of payments.
    n: 'Remarks to Business and Banking Leaders on the Balance of Payments Problem, [1965 Pub. Papers 206](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=282) (Feb. 18, 1965). See [[cal.1965-02-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-18.vietnam
    when: Feb. 18
    date: '1965-02-18'
