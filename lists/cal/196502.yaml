  - id: cal.1965-02-10.vietnam
    when: Feb. 10–11
    date: '1965-02-10'
    thread: vietnam
    c: 'Qui Nhơn. A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed. Humphrey, Ball and Thompson ask that reprisal wait until Kosygin has left the area; McNamara and most of the others for striking at once. Bundy: "If we take no action, the Soviets may think we are in fact a paper tiger"; at an appropriate time it could be announced "that we had turned a corner and changed our policy." Flaming Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized zone; American and South Vietnamese planes, the barracks at Chấp Lễ. Humphrey, asked by Johnson: "I don''t think we should."'
    n: '[[w.gibbons-u-s-government-and]], III, 77–78 (the attack; the NSC: Ball, Thompson and Humphrey for waiting, McNamara for striking; two targets, Feb. 11); [[w.frankum-like-rolling-thunder]], 17–18 (the attack at Qui Nhơn; the Navy''s strike on Chánh Hòa); [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack at Qui Nhơn; the strikes in reply); [[w.cosmas-joint-chiefs-of-staff-2012]], 216–217; [[w.staaveren-gradual-failure]], 21–22; [[w.westmoreland-soldier-reports]], 116–17 (the bomb, twenty-three killed, twenty-one wounded; a night of conflicting orders on the targets; the strikes after daylight Feb. 11, at Chấp Lễ and near Đồng Hới); [[w.preston-war-council]], 179–80 (Bundy at the NSC, "a paper tiger"; "we had turned a corner and changed our policy"). Frankum, 18, has the South Vietnamese strike another barracks, his target 32, not Chấp Lễ; Staaveren, 21–22, their target the Vu Con barracks, Chấp Lễ an alternate. Target 32 is the Vu Con barracks (FRUS 1964–68, II, doc. 78 n. 4); FRUS''s editors, from Vance''s chronology, have American and South Vietnamese planes strike Chấp Lễ (doc. 106). [[w.mann-grand-delusion]], 401–2. [[w.solberg-hubert-humphrey]], 271 (Humphrey for delay until Kosygin left Hanoi, with Ball and Thompson; Rusk and McNamara for striking at once). [FRUS 1964–68, II, doc. 95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95); [doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97); [doc. 98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98); [doc. 106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106). See [[cal.1965-02-07.vietnam]]. Names: Humphrey, Ball, McNamara, Thompson, Kosygin. Check: Solberg, 271, has a mortar attack at Qui Nhơn.'
