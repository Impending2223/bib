    c: 'The 546th NSC, 8 a.m., with McCormack, Mansfield and Ford.{1} Mansfield: "Why cannot we handle this matter through the United Nations? Can''t the Geneva powers act?"{2} Johnson: "This cannot be done."{3} Ford: why strike one target of four?{4} Mansfield: the purpose to impress Hồ Chí Minh and Giáp, not necessary "to go any further at this time"; Johnson: to impress Kosygin "and a number of others in the world, including our own citizens." Mansfield and McCormack agree to the South Vietnamese strike.{5}'
    n: 'FRUS 1964–68, II, docs. [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80) (summary notes); [81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (memorandum for the record). [[w.mann-grand-delusion]], 395–96. [[w.ball-past-has-another-pattern]], 390 (the meeting). Check: Mann dates the meeting the morning of Feb. 8. After the attack at Pleiku: [[cal.1965-02-07.vietnam]]. Check: Solberg, 270, puts at the session of Feb. 7 Vance on the secure telephone to Saigon (Johnson: "Are they unanimous in Saigon?"), Mansfield: "I would negotiate. I would not hit back," and Johnson: "I just don''t think you can stand still and take this sort of thing"; his note cites William Bundy''s interviews for the LBJ Library and the summary notes of the 545th meeting, Feb. 6. To check: William Bundy, interview with Paige Mulhollan, May 29, 1969, LBJ Library (cited by [[w.solberg-hubert-humphrey]], 270, its note). See [[cal.1965-02-06.vietnam-congress]]. Names: McCormack, Mansfield, Ford, Johnson, Hồ Chí Minh, Võ Nguyên Giáp, Kosygin. Check: Ball (390) has himself, Mansfield, Humphrey and Thompson for putting the strike off while Kosygin was in Hanoi, McNamara prevailing, and Humphrey kept from the meetings for months after.'
