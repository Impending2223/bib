  - id: cal.1965-02-01.black-nationalism
    when: Feb. 1
    date: '1965-02-01'
    thread: black-nationalism
    also: [king]
    c: 'Elijah Muhammad, on the FBI''s taps, has Chauncey Eskridge, his lawyer and King''s, propose to King a meeting: King "just needs to be put on the right track"; a meeting would be a "bombshell." Selma''s news stops Eskridge''s trip.'
    n: '[[w.branch-pillar-of-fire]], 575. Check: the day; the intercepts are of Feb. 1, 6 and 8. To check: Wiretap intercepts of Feb. 1, 6, and 8, 1965, in SAC, Phoenix, to Director, Feb. 11, 1965, FEM-NR (cited by [[w.branch-pillar-of-fire]], 575). See [[cal.1964-11-24.black-nationalism]]. Names: Muhammad, King.'
