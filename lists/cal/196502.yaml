    c: 'Wilson to Johnson by telephone, after Pleiku and the bombing of the North, hoping to come to Washington.{1} Johnson: "Why don''t you run Malaysia and let me run Vietnam?"{2} The talk ends with assurances of British support.{3}'
    n: '[[w.schwartz-lyndon-johnson-and-europe]], 85; [[w.logevall-choosing-war]], 339–40 (Wilson''s call to Johnson at 10:15 p.m. Washington time, after Pleiku and Qui Nhơn, asking to come to Washington; the concluding pledges of mutual support). Check: Logevall, 339, quotes Johnson: "I won''t tell you how to run Malaysia and you don''t tell us how to run Vietnam.". To check: memorandum of telephone conversation, Wilson and Johnson, Feb. 10, 1965, NSF, Memos to the President, Bundy Files, Box 2, LBJ Library (cited by [[w.schwartz-lyndon-johnson-and-europe]], 85 n.160); Sylvia A. Ellis, "Lyndon Johnson, Harold Wilson and the Vietnam War," in Jonathan Hollowell, ed., *Twentieth-Century Anglo-American Relations* (2001), 195 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 85 n.159). See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Wilson, Johnson.'
