    n: '[FRUS 1964–68, II, doc. 119](https://history.state.gov/historicaldocuments/frus1964-68v02/d119). See [[cal.1965-02-13.vietnam]]. Names: Nguyễn Khánh, Nguyễn Xuân Oánh.'
