    also: [trade]
    c: 'Balance of payments message: the 1964 deficit $3 billion.{1} Executive Order 11198 puts the interest equalization tax on bank loans abroad of a year or more;{2} the tax to be extended two years and to cover other lenders'' credit.{3} Voluntary restraint on lending and investing abroad, the Federal Reserve to enlist the banks, Commerce and the Treasury the corporations.{4} Returning tourists'' duty-free allowance to $50.{5}'
