  - id: cal.1965-02-05.civil-rights-the-executive
    when: Feb. 5
    date: '1965-02-05'
    thread: civil-rights-the-executive
    c: 'Executive Order 11197: a President''s Council on Equal Opportunity, Humphrey chairman, the heads of the departments and agencies with civil rights duties its members. It is to coordinate their work under the Civil Rights Acts of 1957 and 1964, as Humphrey had recommended. Jan. 26, Humphrey had been named chairman of the Peace Corps'' National Advisory Council.'
    n: '[Executive Order 11197—Establishing the President''s Council on Equal Opportunity](https://www.presidency.ucsb.edu/documents/executive-order-11197-establishing-the-presidents-council-equal-opportunity) (Feb. 5, 1965), [30 Fed. Reg. 1721](https://www.govinfo.gov/app/details/FR-1965-02-09); Letter to the Vice President Upon Establishing the President''s Council on Equal Opportunity, [1965 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=228) (Feb. 6, 1965); Letter to the Vice President Asking Him To Serve as Chairman, National Advisory Council of the Peace Corps, [1965 Pub. Papers 99](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=175) (Jan. 26, 1965). [[w.humphrey-education-of-a-public-1976]], 408 (the council at Humphrey''s urging; its staff, Wiley Branton; its meetings with Katzenbach, Marshall, Vance, Wirtz, Gardner); [[w.solberg-hubert-humphrey]], 267 (Johnson accepts Humphrey''s outline as "wise"). To check: [[w.graham-civil-rights-era]]. See [[cal.1964-12-03.civil-rights-bill]]. Names: Humphrey.'
