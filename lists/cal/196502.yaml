  - id: cal.1965-02-07.vietnam-3
    when: Feb. 7
    date: '1965-02-07'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'McNamara''s press conference on Pleiku: "I think it was a very clear challenge and test of our political purpose and strength of will." William Bundy to the SEATO ambassadors, by Harlech''s report: the North''s action "intended as a clear test of will," calling for "urgent and appropriate retaliatory action."'
    n: '[[w.preston-war-council]], 173. To check: McNamara news conference, Feb. 7, 1965, NSF, Country File, Vietnam, box 13, LBJ Library; Harlech (Washington) to London, Feb. 7, 1965, FO 371/180594, Public Record Office (cited by [[w.preston-war-council]], 173 n.37). See [[cal.1965-02-07.vietnam]]. Names: McNamara, William Bundy, Ormsby-Gore.'
    src:
      c: ddf85ec6
