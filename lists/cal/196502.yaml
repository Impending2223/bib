  - id: cal.1965-02-22.vietnam
    when: Feb. 22
    date: '1965-02-22'
    place: saigon
    thread: vietnam-force-levels
    c: 'Westmoreland asks for Marines to guard the air base at Đà Nẵng.{1} Taylor would accept one battalion landing team, but warns that once the policy against ground combat forces is breached "it will be very difficult to hold line."{2} Throckmorton, back from Đà Nẵng, would bring in a whole Marine brigade of three battalions; Westmoreland asks two, the third held offshore. Taylor endorses one, reluctantly.{3} Taylor, in his cables: the American soldier "is not a suitable guerilla fighter for Asian forests and jungles."{4}'
    n: 'FRUS 1964–68, II, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v02/d153), [155](https://history.state.gov/historicaldocuments/frus1964-68v02/d155) (Westmoreland, Feb. 23). [[w.gibbons-u-s-government-and]], III, 122–23; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 532 (Westmoreland''s proposal; Taylor''s reply, Feb. 22); [[w.westmoreland-soldier-reports]], 123 (Throckmorton for a brigade; Westmoreland asks two battalions, a third offshore; Taylor objects, accepts one, then both); [[w.mcnamara-in-retrospect]], ch. 7 at n.9 (two Marine battalions for Đà Nẵng; Taylor against; Johnson approves). [[w.clifford-counsel-to-the-president-2]], 409 (Taylor''s cables against combat troops: the American soldier "not a suitable guerilla fighter for Asian forests and jungles"); [[w.califano-triumph-and-tragedy-of]], 32 (two battalions of Marines to protect the air base at Đà Nẵng; their mission limited to the airfield); [[w.bernstein-guns-or-butter]], 345 (two battalions, 3,500 men); [[w.drea-mcnamara-clifford-and-the-2011]], 23 (Westmoreland recommends combat Marines for Đà Nẵng, Taylor reluctantly concurring; about 1,300 Marines there already); [[w.taylor-swords-and-plowshares]], 338 (Taylor''s reluctant concurrence, on Westmoreland''s view of the bases'' security); [[w.westmoreland-soldier-reports]], 123; [[w.clifford-counsel-to-the-president-2]], 409. Check: FRUS 1964–68, II, doc. 153 n.3 has MAC JOO 5515, Feb. 22, recommend "a Marine expeditionary brigade" for Đà Nẵng "on a phased basis"; Westmoreland (123) gives Throckmorton for the brigade and himself for two battalions, a third offshore. Check: Drea dates the recommendation Feb. 23 (23). To check: [[w.shulimson-u-s-marines-in]]; MACV to CINCPAC 220743Z, Feb. 1965, NSF, NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 122 n.193); Saigon to Washington 2699, Feb. 22, 1965, NSF, Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 122 n.194). See [[cal.1965-02-07.vietnam]]. Names: Westmoreland, Taylor, Throckmorton.'
