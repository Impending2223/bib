    when: Feb. 8
    date: '1965-02-08'
    thread: vietnam-congress
    also: [vietnam]
    c: 'The 547th NSC, 10:30 a.m., the leaders, Mansfield, Dirksen, McCormack and Ford, joining. Johnson: "We are now ready to return to our program of pushing forward in an effort to defeat North Vietnamese aggression without escalating the war." The Congressional Resolution and his powers enough; "the views of a few Senators could not control his actions"; he will use it "carefully but effectively." Ford: more money and men? McNamara: "not in the initial stages."'
    n: 'FRUS 1964–68, II, docs. [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87) (summary notes); [88](https://history.state.gov/historicaldocuments/frus1964-68v02/d88) (McCone''s memorandum for the record). [[w.mann-grand-delusion]], 398 (Johnson''s words). See [[cal.1965-02-07.vietnam-congress]]. Names: Mansfield, Dirksen, McCormack, Ford, Johnson, McNamara.'
