    c: Kosygin in Hanoi;{1} the attack at Pleiku and the first reprisal strikes while he is there.{2} A destroyer patrol in the Gulf of Tonkin had been called off for the visit.{3} A Soviet government statement promises "further measures to safeguard the security and strengthen the defensive capability" of the North.{4}
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders: the Vietnamese told Kosygin that it was not the moment for negotiations; Kosygin said that Soviet arms would henceforth be free, gave the South medical aid only, and pressed for a common declaration of the socialist countries. FRUS 1964–68, II, docs. [82](https://history.state.gov/historicaldocuments/frus1964-68v02/d82), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [111](https://history.state.gov/historicaldocuments/frus1964-68v02/d111) (Feb. 11). [[w.drea-mcnamara-clifford-and-the-2011]], 56 (Kosygin in Hanoi; the attack at Pleiku and the reprisal); [[w.staaveren-gradual-failure]], 11 (Kosygin in Hanoi from Feb. 4; the De Soto patrol called off); [[w.dobrynin-in-confidence]], 139–40 (Fulbright to Dobrynin: Johnson hesitated whether to wait for Kosygin to leave; Rusk''s excuses; the strongly worded Soviet message; Kosygin turned against Johnson); [[w.bernstein-guns-or-butter]], 344 (to persuade Hanoi to discuss peace; refused, more arms asked and given); [[w.logevall-choosing-war]], 322 (Kosygin in Hanoi in early February, at the time of McGeorge Bundy''s visit to Saigon; not Pleiku or the destroyer patrol); [[w.macfarquhar-origins-of-the-cultural]], III, 372 (Kosygin''s visit to Hanoi in February 1965 brings new Soviet military aid); [[w.friedman-shadow-cold-war]], 129 (Kosygin in Hanoi in early February; the NLF kills eight Marines at Pleiku and the air attacks follow, which Kosygin takes as a personal insult; talks on a new defense agreement, completed in Moscow; Kosygin then organizes military support from the rest of the Warsaw Pact); [[w.khoo-collateral-damage]], 24–25 (Kosygin in Hanoi Feb. 6–10, with Andropov, Kuznetsov, Vershinin, Loginov and Sidorovich, and a team of missile experts; on the agenda Soviet military and economic aid and the Sino-Soviet dispute). [[w.preston-war-council]], 175, 184 (Dobrynin to Thompson, Feb. 7: further strikes "a deliberate provocation"; the Soviet statements, 184). To check: [[w.gaiduk-soviet-union-and-the]]; [[w.zhai-china-and-the-vietnam]]; Hist, CINCPAC, 1965, Vol II, pp 317–18 (cited by [[w.staaveren-gradual-failure]], 11 n.4a); CINCPACFLT rpt, The United States Navy in the Pacific, 1965, pp 13–14 (cited by [[w.staaveren-gradual-failure]], 11 n.4b); *New York Times*, 11 Feb 65 (cited by [[w.staaveren-gradual-failure]], 11 n.4c); [[w.griffith-sino-soviet-relations-1964]], 72–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 372 n.156); Secret report of American and European Department, Soviet–East European Department MFA on actions of new Soviet leadership in Africa and Asia, March 31, 1965, CFMA doc. 109-03652-02, 36 (cited by [[w.friedman-shadow-cold-war]], 129 n.125a); Report of embassy DRV on “International Conference of Solidarity with Vietnamese People against Aggression of U.S. Imperialism in Defense of Peace, in Hanoi 11/25–29/1964,” December 17, 1964, AVPRF f.079 o.19 papka 44 d.30, 315–22 (cited by [[w.friedman-shadow-cold-war]], 129 n.125b); [[w.gaiduk-soviet-union-and-the]], 30 (cited by [[w.friedman-shadow-cold-war]], 129 n.126); MFA News Department report on Soviet military aid to DRV, March 3, 1965, CFMA doc. 109-02850-01, 1–2 (c