  - id: cal.1965-02-10.vietnam
    when: Feb. 10–11
    date: '1965-02-10'
    place: qui-nhon
    thread: vietnam-operations
    c: 'Qui Nhơn.{1} A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed.{2} Humphrey, Ball and Thompson ask that reprisal wait until Kosygin has left the area;{3} McNamara and most of the others for striking at once.{4} Bundy: "If we take no action, the Soviets may think we are in fact a paper tiger"; at an appropriate time it could be announced "that we had turned a corner and changed our policy."{5} Flaming Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized zone;{6} American and South Vietnamese planes, the barracks at Chấp Lễ.{7} Humphrey, asked by Johnson: "I don''t think we should."{8}'
    n: '[[w.gibbons-u-s-government-and]], III, 77–78 (the attack; the NSC: Ball, Thompson and Humphrey for waiting, McNamara for striking; two targets, Feb. 11); [[w.frankum-like-rolling-thunder]], 17–18 (the attack at Qui Nhơn; the Navy''s strike on Chánh Hòa); [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack at Qui Nhơn; the strikes in reply); [[w.cosmas-joint-chiefs-of-staff-2012]], 216–217; [[w.staaveren-gradual-failure]], 21–22; [[w.westmoreland-soldier-reports]], 116–17 (the bomb, twenty-three killed, twenty-one wounded; a night of conflicting orders on the targets; the strikes after daylight Feb. 11, at Chấp Lễ and near Đồng Hới); [[w.preston-war-council]], 179–80 (Bundy at the NSC, "a paper tiger"; "we had turned a corner and changed our policy"); [[w.white-making-of-the-president-1969]], 21 (Humphrey''s dissent at the Cabinet, Feb. 10, and alone with Johnson the night of Feb. 11); [[w.zaroulis-who-spoke-up]], 33–34 (Qui Nhơn, Feb. 11; Flaming Dart II, Feb. 12: 160 planes); [[w.dallek-flawed-giant]], 249 (Qui Nhơn, Feb. 10: Johnson authorizes only a retaliatory attack while Kosygin is in Hanoi; no mention of "continuing action"; "killing twenty-one Americans", for which see Variant); [[w.lich-su-khang-chien-chong-my]], III, 399 (the night of Feb. 9, Bình Định forces attack the Việt Cường Hotel in the center of Qui Nhơn); [[w.lich-su-khang-chien-chong-my]], III, 406 (Feb. 11: American aircraft hit Hồ Xá, the Vĩnh Linh area, Cồn Cỏ island, Đồng Hới and near places; an F8U shot down, its pilot, "Rôbơt Sumếchcơ," taken on Lý Ninh hill; two downed at the Gianh port by Company 54, the navy''s machine guns, the fishermen''s self-defense and the militia); [[w.khoo-collateral-damage]], 24 (the Vietnamese counterattacks: Qui Nhơn, Feb. 10). Frankum, 18, has the South Vietnamese strike another barracks, his target 32, not Chấp Lễ; Staaveren, 21–22, their target the Vu Con barracks, Chấp Lễ an alternate. Target 32 is the Vu Con barracks (FRUS 1964–68, II, doc. 78 n. 4); FRUS''s editors, from Vance''s chronology, have American and South Vietnamese planes strike Chấp Lễ (doc. 106). [[w.mann-grand-delusion]], 401–2. [[w.solberg-hubert-humphrey]], 271 (Humphrey for delay until Kosygin left Hanoi, with Ball and Thompson; Rusk and McNamara for striking at once). [FRUS 1964–68, II, doc. 95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95); [doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97); [doc. 98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98); [doc. 106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106). Check: Mann, 483, from Van Dyk, puts Humphrey''s stand against the sustained bombing at the National Security Council after the attack on the advisers'' compound (nine killed, seventy-six wounded), Rusk and McNamara silent; then a year frozen out. To check: [[w.smith-international-history-of-the-1991]], 31 (cited by [[w.khoo-collateral-damage]], 24 n.95). See [[cal.1965-02-07.vietnam]]. Names: Humphrey, Ball, McNamara, Thompson, Kosygin. Check: Solberg, 271, has a mortar attack at Qui Nhơn.'
