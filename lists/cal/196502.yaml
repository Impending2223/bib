  - id: cal.1965-02-01.congress
    when: Feb. 1
    date: '1965-02-01'
    thread: congress
    also: [south-carolina]
    c: Watson of South Carolina, stripped of his seniority by the Democratic caucus, leaves the House on its adjournment. His letter of Jan. 13 to the Governor had made the resignation effective when a special election was called; none was, and on Jan. 27 he resigned as of Feb. 1.
    n: '[111 Cong. Rec., House, Jan. 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-1-1.pdf). See [[cal.1965-01-02.congress]]. Names: Watson.'
    tags: [name:watson-albert-w]
  - id: cal.1965-02-01.jobs-and-wages
    when: Feb. 1
    date: '1965-02-01'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Senate passes the Appalachian Regional Development Act, S. 3, [62–22](https://voteview.com/rollcall/RS0890007): $840 million for a development highway system; $252.4 million through June 1967 for the other programs; a regional commission of a federal cochairman and a member from each State.'
    n: '[111 Cong. Rec., Senate, Feb. 1, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-3-2.pdf). To check: [[w.eller-uneven-ground]]. See [[cal.1964-09-25.jobs-and-wages]].'
  - id: cal.1965-02-01.vietnam
    when: Feb. 1
    date: '1965-02-01'
    thread: vietnam
    c: 'Bundy to Taylor, 6:58 p.m., exclusive: "I am primarily interested in coming away with a sense of what kind of pressures you and your senior subordinates feel can be effectively applied to the VC and Hanoi," without the constraints of existing policy; "Do we in fact need a stable government in order to proceed aggressively and effectively with pacification?"'
    n: '[FRUS 1964–68, II, doc. 56](https://history.state.gov/historicaldocuments/frus1964-68v02/d56). [[w.preston-war-council]], 169. See [[cal.1965-01-30.vietnam-2]]. Names: Bundy, Taylor.'
    src:
      c: 0e712e4a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d56: all'
        - 'w.preston-war-council 169: all'
    tags: [name:bundy-mcgeorge, name:taylor-maxwell]
  - id: cal.1965-02-01.intelligence
    when: Feb. 1
    date: '1965-02-01'
    thread: intelligence
    also: [soviet-union, vietnam]
    c: 'CIA intelligence memorandum, "The Kosygin Delegation to North Vietnam": "an unusually strong delegation" shows Moscow''s wish to regain influence in Hanoi and its concern at escalation; more Soviet aid, surface-to-air missiles perhaps. The same day Komer to Bundy: Moscow means to "re-engage in Southeast Asia"; "I wish I saw a decent way to warn them off."'
    n: '[FRUS 1964–68, II, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v02/d55). [[w.preston-war-council]], 169–70. To check: Komer to Bundy, Feb. 1, 1965, NSF, Country File, Vietnam, box 13, LBJ Library (cited by [[w.preston-war-council]], 170 n.31). Names: Kosygin, Komer, Bundy.'
    src:
      c: 7800b351
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d55: A'
        - 'w.preston-war-council 169–70: all'
    tags: [name:kosygin-aleksei, name:komer-robert-w, name:bundy-mcgeorge]
  - id: cal.1965-02-01.europe-and-the-alliance
    when: Feb. 1
    date: '1965-02-01'
    thread: europe-and-the-alliance
    also: [vietnam]
    c: 'Harlech from Washington to London: in Bundy''s talks with Taylor the second phase "might" be discussed.'
    n: '[[w.preston-war-council]], 176–77. To check: Harlech (Washington) to London, Feb. 1, 1965, FO 371/180539, Public Record Office (cited by [[w.preston-war-council]], 177 n.47). Names: Ormsby-Gore, Bundy, Taylor.'
