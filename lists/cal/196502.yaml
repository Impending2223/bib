# Cal. LXIII February 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIII
entries:
  - id: cal.1965-02-01.voting-rights
    when: Feb. 1
    date: '1965-02-01'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. King and Abernathy arrested with some 250 marching to the courthouse; they refuse bond. At Marion, in Perry County, some 700 arrested the same day. Check the counts.
    n: 'Check: the record. [[w.garrow-bearing-the-cross]], 382–84. To check: [[w.garrow-protest-at-selma]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]. Check: Garrow, 382, 384, has 260 arrested with King, some 700 more at the courthouse that afternoon and 600 marching at Marion; more than 700 arrested at Marion Feb. 3. Names: King, Abernathy.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david]
  - id: cal.1965-02-01.congress
    when: Feb. 1
    date: '1965-02-01'
    thread: congress
    also: [south-carolina]
    c: Watson of South Carolina, stripped of his seniority by the Democratic caucus, leaves the House on its adjournment. His letter of Jan. 13 to the Governor had made the resignation effective when a special election was called; none was, and on Jan. 27 he resigned as of Feb. 1.
    n: '[111 Cong. Rec., House, Jan. 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-1-1.pdf). See [[cal.1965-01-02.congress]]. Names: Watson.'
    tags: [name:watson-albert-w]
  - id: cal.1965-02-01.jobs-and-wages
    when: Feb. 1
    date: '1965-02-01'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Senate passes the Appalachian Regional Development Act, S. 3, [62–22](https://voteview.com/rollcall/RS0890007): $840 million for a development highway system; $252.4 million through June 1967 for the other programs; a regional commission of a federal cochairman and a member from each State.'
    n: '[111 Cong. Rec., Senate, Feb. 1, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-3-2.pdf). To check: [[w.eller-uneven-ground]]. See [[cal.1964-09-25.jobs-and-wages]].'
  - id: cal.1965-02-02.states-and-cities
    when: Feb. 2
    date: '1965-02-02'
    thread: states-and-cities
    c: 'Special message on home rule for the District of Columbia. A charter bill: an elected local government and an elected delegate in the House. Congress keeps its power to legislate for the District and to repeal the council''s acts; the President an absolute veto.'
    n: Special Message to the Congress on Home Rule for the District of Columbia, [1965 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=197) (Feb. 2, 1965). See [[cal.1961-03-29.states-and-cities]].
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1965-02-03.legislatures-ny
    when: Feb. 3
    date: '1965-02-03'
    thread: state-legislatures
    also: [robert-kennedy]
    c: Albany, N.Y. After a month, Zaretzki, Wagner's candidate, elected the Senate's leader with the Republicans' votes, at Rockefeller's urging.
    n: '[*New York Times*, Feb. 4, 1965](https://www.nytimes.com/1965/02/04/archives/zaretzki-wins-as-gop-steps-in-giving-wagner-man-needed-votes.html). See [[cal.1965-01-06.legislatures-ny]]. Names: Zaretzki, Wagner, Rockefeller.'
    tags: [state:ny, name:zaretzki-joseph, name:wagner-robert-f-jr, name:rockefeller-nelson, city:nyc]
  - id: cal.1965-02-03.legislatures-ar
    when: Feb. 3
    date: '1965-02-03'
    thread: legislatures
    also: [court]
    c: 'Arkansas. *Park v. Faubus*: the congressional districts of 1961 void, further elections under them enjoined.'
    n: '*Park v. Faubus*, [238 F. Supp. 62](https://static.case.law/f-supp/238/case-pdfs/0062-01.pdf) (E.D. Ark. 1965). See [[cal.1965-01-28.legislatures-ar]]. Names: Faubus.'
    tags: [state:ar, name:faubus-orval-e]
  - id: cal.1965-02-03.foreign-aid
    when: Feb. 3
    date: '1965-02-03'
    thread: foreign-aid
    also: [middle-east]
    c: The Senate allows Food for Peace sales to the UAR the President finds in the national interest, [44–38](https://voteview.com/rollcall/RS0890012).
    n: '[111 Cong. Rec., Senate, Feb. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-5-2.pdf). [FRUS 1964–68, XVIII, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v18/d133) (editorial note). See [[cal.1965-01-26.foreign-aid]].'
  - id: cal.1965-02-03.voting-rights-selma
    when: Feb. 3
    date: '1965-02-03'
    thread: voting-rights-selma
    c: 'Andrew Young to Lee White, for King in the Selma jail: a presidential emissary to Selma; a statement for the right to vote in Dallas County; legislation. White to Johnson: tell Young the Justice Department is following it; Katzenbach, in secret touch with Judge Thomas, thinks Thomas can settle it.'
    n: '[[w.garrow-bearing-the-cross]], 382–84. See [[cal.1965-01-02.voting-rights]]. Names: Young, White, Johnson, Katzenbach, Thomas.'
    tags: [name:young-andrew-j-jr, name:white-lee-c, name:johnson-lyndon-b, name:katzenbach-nicholas, name:thomas-daniel-h, name:king-martin-luther-jr]
  - id: cal.1965-02-04.farm
    when: Feb. 4
    date: '1965-02-04'
    thread: farm
    c: Agriculture message. Price and income supports kept; a commission to examine the whole of farm policy; a long-term land use program; rural housing loans. "Parity of opportunity" for rural America, where 46 percent of the families with incomes under $3,000 live.
    n: 'Special Message to the Congress on Agriculture, [1965 Pub. Papers 139](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=215) (Feb. 4, 1965); The President''s News Conference, [1965 Pub. Papers 131](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=207) (Feb. 4, 1965). To check: [[w.cochrane-american-farm-policy-1948]]. See [[cal.1964-08-31.farm]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-04.legislatures-ny
    when: Feb. 4
    date: '1965-02-04'
    thread: state-legislatures
    also: [robert-kennedy]
    c: Albany, N.Y. Travia elected Speaker over Steingut, again with Republican votes.
    n: '[*New York Times*, Feb. 5, 1965](https://www.nytimes.com/1965/02/05/archives/travial-elected-speaker-gop-vote-again-decisive-as-streingut-is.html). See [[cal.1965-01-06.legislatures-ny]]. Names: Travia, Steingut.'
    tags: [state:ny, name:travia-anthony-j, name:steingut-stanley]
  - id: cal.1965-02-04.voting-rights
    when: Feb. 4
    date: '1965-02-04'
    thread: voting-rights
    also: [foreign-aid, middle-east, europe-and-the-alliance]
    c: 'News conference. On Selma: "all Americans should be indignant when one American is denied the right to vote." The House asked to accept the Senate''s terms on sales to the UAR. On not sending Humphrey to Churchill''s funeral: "I may have made a mistake."'
    n: 'The President''s News Conference, [1965 Pub. Papers 131](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=207) (Feb. 4, 1965). See [[cal.1965-02-01.voting-rights]]; [[cal.1965-01-26.foreign-aid]]; [[cal.1965-01-24.europe-and-the-alliance]]. Names: Johnson, Humphrey, Churchill.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:churchill-winston-s]
    aliases: [cal.1965-02-04.europe-and-the-alliance, cal.1965-02-04.foreign-aid]
  - id: cal.1965-02-04.voting-rights-selma
    when: Feb. 4
    date: '1965-02-04'
    thread: voting-rights-selma
    also: [alabama]
    c: Selma. Judge Thomas suspends the registrars' literacy test and orders at least 100 applications taken each registration day.
    n: 'Check: the order. See [[cal.1965-02-01.voting-rights]]. Names: Thomas.'
    tags: [name:thomas-daniel-h]
  - id: cal.1965-02-05.civil-rights-the-executive
    when: Feb. 5
    date: '1965-02-05'
    thread: civil-rights-the-executive
    c: 'Executive Order 11197: a President''s Council on Equal Opportunity, Humphrey chairman, the heads of the departments and agencies with civil rights duties its members. It is to coordinate their work under the Civil Rights Acts of 1957 and 1964, as Humphrey had recommended. Jan. 26, Humphrey had been named chairman of the Peace Corps'' National Advisory Council.'
    n: '[Executive Order 11197—Establishing the President''s Council on Equal Opportunity](https://www.presidency.ucsb.edu/documents/executive-order-11197-establishing-the-presidents-council-equal-opportunity) (Feb. 5, 1965), [30 Fed. Reg. 1721](https://www.govinfo.gov/app/details/FR-1965-02-09); Letter to the Vice President Upon Establishing the President''s Council on Equal Opportunity, [1965 Pub. Papers 152](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=228) (Feb. 6, 1965); Letter to the Vice President Asking Him To Serve as Chairman, National Advisory Council of the Peace Corps, [1965 Pub. Papers 99](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=175) (Jan. 26, 1965). To check: [[w.graham-civil-rights-era]]; [[w.solberg-hubert-humphrey]]. See [[cal.1964-12-03.civil-rights-bill]]. Names: Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-02-05.voting-rights-selma
    when: Feb. 5
    date: '1965-02-05'
    thread: voting-rights-selma
    also: [king]
    c: 'King, from the Selma jail, in the *New York Times*: "there are more Negroes in jail with me than there are on the voting rolls."'
    n: 'Check: the page. [[w.garrow-bearing-the-cross]], 386. See [[cal.1965-02-01.voting-rights]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-02-06.soviet-union
    when: Feb. 6–10
    date: '1965-02-06'
    thread: soviet-union
    also: [vietnam]
    c: Kosygin in Hanoi; the attack at Pleiku and the first reprisal strikes while he is there. A destroyer patrol in the Gulf of Tonkin had been called off for the visit. A Soviet government statement promises "further measures to safeguard the security and strengthen the defensive capability" of the North.
    n: 'FRUS 1964–68, II, docs. [82](https://history.state.gov/historicaldocuments/frus1964-68v02/d82), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [111](https://history.state.gov/historicaldocuments/frus1964-68v02/d111) (Feb. 11). [[w.drea-mcnamara-clifford-and-the-2011]], 56 (Kosygin in Hanoi; the attack at Pleiku and the reprisal); [[w.staaveren-gradual-failure]], 11 (Kosygin in Hanoi from Feb. 4; the De Soto patrol called off). To check: [[w.gaiduk-soviet-union-and-the]]; [[w.zhai-china-and-the-vietnam]]; [[w.dobrynin-in-confidence]]; Hist, CINCPAC, 1965, Vol II, pp 317-18 (cited by [[w.staaveren-gradual-failure]], 11 n.4a); CINCPACFLT rpt, The United States Navy in the Pacific, 1965, pp 13-14 (cited by [[w.staaveren-gradual-failure]], 11 n.4b); New York Times, 11 Feb 65 (cited by [[w.staaveren-gradual-failure]], 11 n.4c). See [[cal.1964-10-15.soviet-union]]. Names: Kosygin.'
    src:
