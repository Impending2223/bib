    c: 'Deng Xiaoping 邓小平 presides at the Secretariat 书记处, which hears Gu Mu 谷牧 on the national conferences on industry and communications and on political work in them, and discusses the revised "Main points of industrial and communications work in 1965" and "Main points of political work in the industrial and communications system in 1965". Deng: with farm machinery selling badly, the way out is to cut cost; part of the agricultural funds can go to tractor stations; more motor vehicles and tractors; on the ''four clean-ups'' in factories, which aim at better production, technical and management revolution and thrift, the plants must turn to these in time, half a month''s delay being half a month''s loss; in three or four months turn round to management revolution, technical revolution and cadres'' labor.'
