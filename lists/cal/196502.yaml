  - id: cal.1965-02-11.soviet-union
    when: Feb. 11
    date: '1965-02-11'
    time: 1965-02-11T02:00Z
    place: peking
    thread: soviet-union
    also: [china, vietnam]
    c: 'Peking.{1} Kosygin, on his way home from Hanoi, with Mao and Zhou Enlai: let the two parties stop their polemics and act together for Vietnam.{2} Mao refuses: the debate will go on for nine thousand years.{3} The Great Hall, 10 a.m.;{4} with Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi and Kang Sheng.{5} Kosygin: Soviet missiles, guns and torpedo boats to Hanoi free.{6} Mao: no meeting of the parties while the Albanian question stands;{7} China will not attend the Moscow meeting of Mar. 1.{8} Soviet aid to go by rail across China, no air corridor.{9} Luo Ruiqing, Liu Xiao and Yang Chengwu also attend.{10} Mao: the polemic will run 25 years, then 10,000; of the Mar. 1 meeting, "we favor your holding it, but we shall not go"; while the Albanian question stands, no meeting; the two parties may unite in some ten years. Kosygin: sooner.{11} Mao: more support for the southern guerrillas; Zhou: "If the imperialists try to impose a war on us, we will surely fight."{12}'
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Zhou''s account to the Romanian leaders: Mao told Kosygin that China too wants 10–15 years of peace, and that the more the Soviet Union helps North Vietnam the better; Kosygin offered two regiments of ground-to-air missiles, antiaircraft guns, amphibious tanks, MiG-17s and trainers; the two sides agreed to exchange information on international problems, which Zhou dates ''13 February''. [[w.jian-maos-china-and-the]], 231 (by a Chinese history, Cong Jin''s); [[w.zhai-china-and-the-vietnam]], 153 (the same history); [[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1965 (Mao, the morning, with Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Kang Sheng, Luo Ruiqing, Liu Xiao and Yang Chengwu: no meeting of the parties while the Albanian question stands; the open letter of July 14, 1963, and the report and resolution of February 1964 to be withdrawn). In Washington, Feb. 7: [FRUS 1964–68, II, doc. 81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (the NSC: Mansfield asks whether Kosygin will consult Peking on his way home; Thompson: he might). [[w.zhou-enlai-nianpu-1949]], II, 708 (Feb. 10–11, 1965: Zhou''s fifth talk with Kosygin, returning from Hanoi, and his reception with Mao and Liu Shaoqi; on the way to the airport on the 11th, Zhou: the two sides should exchange views often, informally and not in public); [[w.zhou-enlai-waijiao-huodong]], 436 (Feb. 11, 1965; 10 a.m., Great Hall of the People; Zhou accompanies Mao and Liu Shaoqi in meeting Kosygin and his delegation); [[w.zhonghua-renmin-gongheguo-waijiao]], 7–8 (Feb. 11, 1965; Mao, Liu and Zhou receive Kosygin; the points debated; Mao on objective law); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 615 (Feb. 11, 1965; Liu, with Mao, Zhou Enlai and Deng Xiaoping, meets Kosygin, chairman of the Soviet Council of Ministers, and the Soviet delegation he heads); [[w.lengxi-shinian-lunzhan-1956-1966]], 913–921 (Mao and Kosygin; Mao on the polemic: 25 years, then 10,000; the "dogmatist" label; the Mar. 1 meeting "we favor your holding it, but we shall not go"; Albania the key; Khrushchev, "invite him to Peking"; unity in ten to fifteen years or earlier, perhaps with the imperialists'' help; the talk the morning after the rally; no agreement); [[w.macfarquhar-origins-of-the-cultural]], III, 375 (Kosygin''s overtures in Beijing, February 1965, bring no revival of cordiality); [[w.yang-shangkun-riji]], II, 509 (Feb. 11, 1965; Mao and the other members of the Standing Committee receive Kosygin and his party that morning; the words: 主席等常委同志今天上午接见了柯西金等一行人员); [[w.deng-xiaoping-nianpu-1904]], III, 1845 (Feb. 11, 1965; Deng with Mao, Liu Shaoqi and Zhou Enlai meets the Soviet delegation under Kosygin); [[w.peng-zhen-nianpu-1902]], IV, 397 (Feb. 11, 1965, morning; Peng Zhen, with Mao, Liu Shaoqi, Zhou Enlai and Deng Xiaoping, meets Kosygin and his delegation on their way home from Vietnam); [[w.friedman-shadow-cold-war]], 130 (Kosygin stops in Peking for talks on coordinated aid to the DRV and returns empty-handed; Mao wants continued war, as Radchenko has it); [[w.chen-yi-nianpu]], 1084 (Feb. 11, 1965, morning; Mao and Liu Shaoqi receive Kosygin and the Soviet delegation, Chen Yi present); [[w.jian-zhou-enlai]], 522 (Zhou, Liu, Deng and others with Mao; Mao''s monologue; Kosygin: Soviet missiles, guns and torpedo boats to Hanoi free; Mao: more support for the southern guerrillas; Peking will not attend the Moscow meeting; "The open dispute will last for another ten thousand years," then nine thousand; Zhou: "If the imperialists try to impose a war on us, we will surely fight"; Moscow "had supported the Indian reactionaries against China"); [[w.khoo-collateral-damage]], 21–22 (Kosygin''s return stop, Feb. 10–11; Mao refuses to halt the polemics ("ten thousand years"), approves the conference, China not to attend; asks, reportedly, whether an attack on China would count as one on the Soviet Union, Kosygin silent; the only result an agreement to carry Soviet aid by land: Mao allows rail transit, refuses an air corridor); [[w.dikotter-cultural-revolution]], 43 n.3 (Kosygin, back from Hanoi, presses for a joint effort in Vietnam; Mao, before the whole leadership, lectures him for hours and rejects his pleas for unity); [[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1965. [[w.lengxi-shinian-lunzhan-1956-1966]], 914–20; [[w.jian-zhou-enlai]], 522. Made public: Cong Jin, *Quzhe fazhan de suiyue* (1989), by Chen''s note (358 n.107). Check: [[w.zedong-mao-zedong-nianpu]], V, Feb. 11, 1965, gives neither Kosygin''s proposal nor the "nine thousand years"; it puts the talk in the Hall of the People, with Liu Shaoqi, Deng Xiaoping and others present, and gives Mao''s terms for joining: the Albanian line dropped, the open letter, report and resolution withdrawn. Check: [[w.jian-zhou-enlai]], 522 n.15a, dates the Chinese record of Mao''s conversation with Kosygin Feb. 12, 1965; the Polish record, n.15b, Feb. 11. To check: [[w.jin-1949-1989-niande-zhongguo]], 607–8 (cited by [[w.jian-maos-china-and-the]], 231 n.107); [[w.griffith-sino-soviet-relations-1964]], 74–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 375 n.181); [[w.radchenko-two-suns-in-the]], 144–48 (cited by [[w.friedman-shadow-cold-war]], 130 n.131); [[w.radchenko-two-suns-in-the]], 141–43 (cited by [[w.friedman-shadow-cold-war]], 130 n.132); Mao conversation with Kosygin, February 12, 1965, 109-03957-07, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 522 n.15a); "Minutes from a Conversation between A. N. Kosygin and Mao Zedong," February 11, 1965, KC PZPR, XI A/10, 517, 524, Polish Archive of Modern Records, Wilson Center Digital Archive no. 118039 (cited by [[w.jian-zhou-enlai]], 522 n.15b); K. S. Karol''s account of a Nov. 9, 1966 interview with Zhou Enlai (cited in Ross Terrill, "The Siege Mentality," Problems of Communism 16.2 (1967), 3) (cited by [[w.khoo-collateral-damage]], 22 n.72a); [[w.terrill-siege-mentality]], 3 (cited by [[w.khoo-collateral-damage]], 22 n.72b); [[w.wang-taiping-zhonghua-renmin-gongheguo-waijiaoshi]], 265 (cited by [[w.khoo-collateral-damage]], 22 n.73); [[w.yang-kuisong-changes-in-mao-zedongs]], 31 (cited by [[w.khoo-collateral-damage]], 22 n.74); [[w.zhai-china-and-the-vietnam]], 150 (cited by [[w.khoo-collateral-damage]], 22 n.75). See [[cal.1965-02-06.soviet-union]]. Names: Kosygin, Mao, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Chen Yi, Kang Sheng, Luo Ruiqing, Liu Xiao, Yang Chengwu.'
