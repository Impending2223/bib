  - id: cal.1965-02-10.economy
    when: Feb. 10
    date: '1965-02-10'
    thread: economy
    also: [trade]
    c: 'Balance of payments message: the 1964 deficit $3 billion. Executive Order 11198 puts the interest equalization tax on bank loans abroad of a year or more; the tax to be extended two years and to cover other lenders'' credit. Voluntary restraint on lending and investing abroad, the Federal Reserve to enlist the banks, Commerce and the Treasury the corporations. Returning tourists'' duty-free allowance to $50.'
    n: 'Special Message to the Congress on International Balance of Payments, [1965 Pub. Papers 170](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=246) (Feb. 10, 1965); [Executive Order 11198—Imposition of Interest Equalization Tax on Certain Commercial Bank Loans](https://www.presidency.ucsb.edu/documents/executive-order-11198-imposition-interest-equalization-tax-certain-commercial-bank-loans) (Feb. 10, 1965), [30 Fed. Reg. 1929](https://www.govinfo.gov/app/details/FR-1965-02-11). [[w.schwartz-lyndon-johnson-and-europe]], 72. To check: [[w.solomon-international-monetary-system-1945]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1963-07-18.economy]]; [[cal.1964-09-02.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-10.jobs-and-wages
    when: Feb. 10–12
    date: '1965-02-10'
    thread: labor-disputes
    c: 'The longshoremen''s strike. The ILA has struck every Atlantic and Gulf port since Jan. 11. Johnson: the strike "totally unjustified" in the North Atlantic and East Gulf ports, where agreement has been reached; Wirtz, Connor and Senator Morse to recommend terms for the South Atlantic and West Gulf. Feb. 12, the employers accept the recommendations; nearly all the major ports to reopen the next morning.'
    n: 'Statement by the President on the Longshoremen''s Strike, [1965 Pub. Papers 169](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=245) (Feb. 10, 1965); Statement by the President Announcing Progress in the Longshoremen''s Strike, [1965 Pub. Papers 182](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=258) (Feb. 12, 1965). To check: [[w.jensen-strife-on-the-waterfront]]. Names: Johnson, Wirtz, Connor, Morse.'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard, name:connor-john-t, name:morse-wayne]
  - id: cal.1965-02-10.soviet-union
    when: Feb. 10
    date: '1965-02-10'
    thread: soviet-union
    c: 'White House statement on the attack on the embassy in Moscow: the police protection "wholly inadequate."'
    n: 'White House Statement on the Attack on the U.S. Embassy in Moscow, [1965 Pub. Papers 170](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=246) (Feb. 10, 1965). See [[cal.1965-02-06.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-10.vietnam-2
    when: Feb. 10
    date: '1965-02-10'
    thread: vietnam
    c: 'Evening, off the record: Johnson with nine of Congress, Kuchel the one Republican. Ball and McDonald brief. Fulbright asks of strikes on China; answered no. Mansfield''s memorandum: another reprisal will not cool the situation; expect the Viet Cong''s answer in the South.'
    n: 'FRUS 1964–68, II, docs. [100](https://history.state.gov/historicaldocuments/frus1964-68v02/d100), [101](https://history.state.gov/historicaldocuments/frus1964-68v02/d101); Bundy''s reply, Feb. 11, [107](https://history.state.gov/historicaldocuments/frus1964-68v02/d107). [[w.gibbons-u-s-government-and]], III, 79–82. See [[cal.1965-02-10.vietnam]]. Names: Johnson, Kuchel, Ball, McDonald, Fulbright, Mansfield.'
    tags: [name:johnson-lyndon-b, name:kuchel-thomas-h, name:ball-george-w, name:mcdonald-david-l, name:fulbright-j-william, name:mansfield-mike]
  - id: cal.1965-02-11.foreign-aid
    when: Feb. 11
    date: '1965-02-11'
    thread: foreign-aid
    also: [middle-east]
    c: 'The supplemental farm appropriation signed, [79 Stat. 4](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg4.pdf): sales to the UAR only under the agreement of 1962 and as the President so finds.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1965-01-26.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-11.soviet-union
    when: Feb. 11
    date: '1965-02-11'
    thread: soviet-union
    also: [china, vietnam]
    c: 'Peking. Kosygin, on his way home from Hanoi, with Mao and Zhou Enlai: let the two parties stop their polemics and act together for Vietnam. Mao refuses: the debate will go on for nine thousand years.'
    n: '[[w.jian-maos-china-and-the]], 231 (by a Chinese history, Cong Jin''s). In Washington, Feb. 7: [FRUS 1964–68, II, doc. 81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (the NSC: Mansfield asks whether Kosygin will consult Peking on his way home; Thompson: he might). Made public: Cong Jin, *Quzhe fazhan de suiyue* (1989), by Chen''s note (358 n.107). See [[cal.1965-02-06.soviet-union]]. Names: Kosygin, Mao, Zhou Enlai.'
    tags: [name:kosygin-aleksei, name:mao-zedong, name:zhou-enlai]
  - id: cal.1965-02-12.legislatures-ia
    when: Feb. 12
    date: '1965-02-12'
    thread: legislatures
    also: [court]
    c: Iowa. The federal court holds the General Assembly's make-up void for future elections. The Assembly adopts a new temporary plan, Senate 61 (Check the date).
    n: '*Davis v. Cameron*, [238 F. Supp. 462](https://static.case.law/f-supp/238/case-pdfs/0462-01.pdf) (S.D. Iowa 1965). [*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 116. See [[cal.1965-01-11.legislatures-ia]].'
    tags: [state:ia]
  - id: cal.1965-02-13.vietnam
    when: Feb. 13
    date: '1965-02-13'
    thread: vietnam
    c: 'Johnson approves "a program of measured and limited air action," with Saigon, against military targets in the North below the 19th parallel, "until further notice": once or twice a week, two or three targets a day. With it, the case against Hanoi to the Security Council and a readiness for "talks."'
    n: 'FRUS 1964–68, II, docs. [113](https://history.state.gov/historicaldocuments/frus1964-68v02/d113), [115](https://history.state.gov/historicaldocuments/frus1964-68v02/d115). [[w.gibbons-u-s-government-and]], III, 85–90; [[w.frankum-like-rolling-thunder]], 19–21; [[w.cosmas-joint-chiefs-of-staff-2012]], 225–26; [[w.staaveren-gradual-failure]], 80–81; [[w.marolda-united-states-navy-and]], 504 (the approval, Feb. 13; a limited campaign on two or three targets); [[w.johnson-vantage-point]], 130; [[w.dallek-flawed-giant]], 249. See [[cal.1965-02-07.vietnam]]. Names: Johnson.'
