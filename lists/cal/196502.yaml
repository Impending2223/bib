    c: The Soviet Union contacts the French government on negotiations on Vietnam, without waiting for China's reply or heeding Hanoi's opposition, as Zhou tells Ben Bella on Mar. 31.
    n: '"[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou''s account: "contacted the French government on 23 February"; the Soviet ambassador to France later told the Chinese ambassador that the French attitude was Moscow''s, for unconditional cease-fire talks). The record gives no place or hour. Names: Zhou Enlai, Ben Bella. Check: when the Chinese embassy in Paris learned of it. Check: the year the Archive posted the document.'
