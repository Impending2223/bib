    n: '[FRUS 1964–68, II, doc. 123](https://history.state.gov/historicaldocuments/frus1964-68v02/d123). [[w.gibbons-u-s-government-and]], III, 104; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 528 (another premier, Feb. 16). To check: [[w.shaplen-lost-revolution]]; [[w.ahern-cia-and-the-generals]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1964-12-20.vietnam]]; [[cal.1965-01-27.vietnam]]. Names: Phan Huy Quát, Phan Khắc Sửu.'
