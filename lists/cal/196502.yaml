    c: 'McGeorge Bundy to William Bundy from Saigon, 6 p.m., for the President: the mission and the ambassador to report apart; Bundy''s report to be written on the way home. "Tomorrow will be spent in the field and should give additional color to conclusions which will contain few major surprises. Overall impression is that important decisions are necessary but that there is time in which to make them."'
