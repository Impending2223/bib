    place: warsaw
    thread: china
    also: [vietnam]
    c: 'Warsaw, the 124th meeting of the ambassadorial talks.{1} Wang Kuo-ch''uan to Cabot: action against North Vietnam is action against China;{2} the American defeat in the South foregone; if the United States spreads the war to the North, China will not sit idly by.{3} Cabot: the United States will leave South Vietnam if the North stops interfering there.{4}'
    n: '[FRUS 1964–68, XXX, doc. 78](https://history.state.gov/historicaldocuments/frus1964-68v30/d78) (Cabot''s report). [[w.zhai-china-and-the-vietnam]], 138 (Wang''s warning, from Schulzinger''s essay, the meeting not dated: "Chinese people will not sit idly by"); [[w.macfarquhar-origins-of-the-cultural]], III, 376 (the American emissary at the Warsaw talks makes clear in February that the United States will not invade or bomb China or crush the North Vietnamese regime). Made public: FRUS 1964–68, XXX. Check: the book has the American emissary at the Warsaw talks say in February and April 1965 that the United States had no intention of invading or bombing China or crushing the North Vietnamese regime (III, 376 n.185, Young, 268–70); the entry gives Cabot''s words on leaving South Vietnam. To check: [[w.young-negotiating-with-the-chinese]], 268–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 376 n.185). Names: Wang Kuo-ch''uan, Cabot. Check: whether Zhai''s words are this meeting''s.'
