  - id: cal.1965-02-17.vietnam-2
    when: Feb. 17
    date: '1965-02-17'
    thread: vietnam
    c: 'The Senate''s "Vietnam debate" opens. Church: the Saigon government losing "for lack of internal cohesion"; a negotiated, neutral Indochina. McGee: the domino theory valid; a line at the 17th parallel, graduated bombing of the North if it is crossed. Nelson: "it clearly would be folly to expand our mission." McGovern: bombing the North "will not solve the guerrilla struggle in the south"; pressure for negotiation, not "the false hope that military victory is possible for either side."'
