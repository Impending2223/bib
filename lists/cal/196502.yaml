    date: '1965-02-04'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Bundy''s statement in Saigon to the people of South Vietnam: "I can tell you plainly that the United States remains determined to work in partnership with you for the defeat of these aggressors so that your families can sleep in peace."'
    n: '[[w.preston-war-council]], 172. To check: *San Francisco Chronicle*, Feb. 4, 1965, 12 (cited by [[w.preston-war-council]], 172 n.35). Names: Bundy. Check: the day; Preston has a second statement near the end of the visit.'
