  - id: cal.1965-02-07.vietnam
    when: Feb. 7–8
    date: '1965-02-07'
    place: pleiku
    thread: vietnam
    c: 'Pleiku.{1} Before dawn the Viet Cong attack the American advisers'' compound and the Camp Holloway airfield: 7 Americans killed, 109 wounded, by the first count;{2} aircraft destroyed.{3} McGeorge Bundy, in Saigon since Feb. 4, and Taylor recommend reprisal;{4} the NSC, meeting the evening of Feb. 6 in Washington, approves.{5} Flaming Dart: of four army barracks in southern North Vietnam, Navy planes from the carriers hit Đồng Hới, the others weathered in;{6} Feb. 8, South Vietnamese planes, with American cover, strike Chấp Lễ.{7} Johnson orders American dependents home.{8} Check the final count.{9} In Westmoreland''s command post at Saigon, with Alexis Johnson and Westmoreland, Bundy and Taylor telephone Vance to recommend the strikes; Taylor gets Acting Prime Minister Nguyễn Xuân Oánh''s assent.{10} Bundy and Westmoreland fly to Pleiku; Nguyễn Khánh, meeting them there, endorses the reprisal.{11} Johnson''s statement: "We have no choice now but to clear the decks"; a Hawk air defense battalion ordered to South Vietnam.{12} Humphrey, in Minnesota, misses the NSC.{13}'
    n: '"[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Kosygin, Feb. 10: on the 8th South Vietnamese planes crossed the line with Johnson''s assent, the White House announcing it; Nguyễn Cao Kỳ flew one himself from Đà Nẵng and was lightly wounded, hit in four places; Peking knew of it only on the night of the 9th; Chấp Lễ not named). Statement by the President Upon Ordering Withdrawal of American Dependents From South Viet-Nam, [1965 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=229) (Feb. 7, 1965). FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76), [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77), [78](https://history.state.gov/historicaldocuments/frus1964-68v02/d78), [79](https://history.state.gov/historicaldocuments/frus1964-68v02/d79), [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87). [[w.gibbons-u-s-government-and]], III, 60–64 (the attack; Bundy and Taylor for reprisal; the NSC, Feb. 6; four barracks, one struck); [[w.staaveren-gradual-failure]], 9–18; [[w.frankum-like-rolling-thunder]], 15–17 (the attack on Camp Holloway; Flaming Dart, Đồng Hới struck, the rest weathered out; Chấp Lễ, Feb. 8); [[w.vietnam-victory-in-vietnam]], 142–43 (the attack on the airfield and Camp Holloway; Flaming Dart on Hồ Xá and Đồng Hới, 143); [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack; Bundy and Taylor for reprisal; the President''s approval the evening of Feb. 6; one barracks hit, the rest weathered out; the next day''s strikes); [[w.cosmas-joint-chiefs-of-staff-2012]], 213–214 (the attack; the recommendation; the NSC; the dependents); [[w.marolda-united-states-navy-and]], 495–97 (the attack; the reprisal authorized; Flaming Dart; Chấp Lễ; the dependents); [[w.anthony-war-in-northern-laos]], 156 (the attack, 7 killed and 109 wounded; the recommendation; the NSC''s approval); [[w.nguyen-hanois-war]], 74–75 (the attack); [[w.asselin-hanois-road-to-the]], 206 (the same); [[w.johnson-vantage-point]], 124–26 (the reprisal approved, one target struck, the others weathered in; the dependents ordered home); [[w.dallek-flawed-giant]], 247–48 (eight advisers killed, 247; one of four targets hit, 248); [[w.preston-war-council]], 172–73, 175–76 (the attack; Bundy''s calls to Vance urging the strikes; Bundy, Taylor and Westmoreland at Pleiku that day); [[w.mcnamara-in-retrospect]], ch. 7 at nn.1–3 (Bundy in Saigon; his recommendation; the reprisal). [[w.logevall-choosing-war]], 324–27 (the attack, 8 killed and 126 wounded, ten aircraft destroyed, 324; Bundy''s call; the NSC of Feb. 6, the four targets; the dependents, 327); [[w.moyar-triumph-forsaken]], 353 (seven Americans killed, more than a hundred wounded, twenty-five aircraft hit; the NSC; Flaming Dart against Đồng Hới); [[w.branch-pillar-of-fire]], 581–82; [[w.bird-color-of-truth]], 306–07 (the attack; Bundy back the same day for reprisal); [[w.bernstein-guns-or-butter]], 344–45 (the night of Feb. 6–7; Bundy with Taylor and Westmoreland, the "streetcar"; Flaming Dart); [[w.taylor-swords-and-plowshares]], 335–36 (the attack, over a hundred wounded, aircraft destroyed or damaged; Bundy and Taylor to Vance by telephone from Westmoreland''s command post; Oánh''s concurrence; forty-five Navy planes on Đồng Hới the same day; twenty-four South Vietnamese the next on Chấp Lễ; the dependents out within ten days); [[w.nixon-rn]], 271 (the barracks near Pleiku shelled; Johnson''s statement, "We have no choice now but to clear the decks"; the retaliatory raids ordered); [[w.solberg-hubert-humphrey]], 270 (Bundy''s and Taylor''s cables urging prompt reprisal by bombing the North; the council of Feb. 6; Humphrey away in Minnesota); [[w.barrett-uncertain-warriors]], 17–18 (the NSC meetings after Pleiku, Mansfield at them on two consecutive days, for negotiating; Johnson: "I just don''t think you can stand still and take this kind of thing"; not the evening of Feb. 6 or the approval); [[w.zaroulis-who-spoke-up]], 33 (the attack at Pleiku; Bundy telephones Johnson to urge a strike; forty-nine Navy fighter-bombers hit Đồng Hới within twelve hours; Kỳ''s planes delayed by weather, strike the next day); [[w.albert-little-giant-1990]], 297–98 (the attack on the outpost at Pleiku; two hours after it Johnson orders reprisal raids on targets in the North; the page has "February 6, 1964" and nine Americans killed; not the airfield, the aircraft, Bundy, Taylor or the dependents); [[w.lich-su-khang-chien-chong-my]], III, 397–98 (the night of Feb. 6–7, sappers against the Cù Hanh airfield and Camp Holloway; the Second Regiment, Region 5''s, against Dương Liễu, Bình Định); [[w.lich-su-khang-chien-chong-my]], III, 403–04 (Flaming Dart I against Vĩnh Linh and Đồng Hới, Feb. 7; the Air Defense–Air Force on alert from the early morning); [[w.lich-su-khang-chien-chong-my]], III, 403–05 (Holloway the "sensitive" event, the pretext; Flaming Dart I on Vĩnh Linh and Đồng Hới, Feb. 7: the Air Defense–Air Force command on alert from early morning on the Politburo''s and the Central Military Party Committee''s order; at 1:53 p.m. the radar of Company 2, Regiment 290 (Lương Hữu Sắt, Nguyễn Đặng Tuất), picks up the first flight, from the Phú Hội dunes; the guns of the 325th and 341st Divisions, two patrol boats at Nhật Lệ and the militia fire. Feb. 8, American aircraft with the South Vietnamese air force under Nguyễn Cao Kỳ strike Hồ Xá, Vĩnh Linh, and Đồng Hới); [[w.khoo-collateral-damage]], 24 (the NLF raid on the air base at Pleiku, Feb. 7: 8 Americans killed, 120 wounded; reprisal raids north of the 17th parallel); [[w.taylor-swords-and-plowshares]], 335; [[w.westmoreland-soldier-reports]], 115 (the meeting in the operations room); [[w.preston-war-council]], 173 (the calls to Vance); [[w.westmoreland-soldier-reports]], 116; [[w.preston-war-council]], 175 (Bundy, Taylor and Westmoreland at Pleiku the day of the attack); [[w.nixon-rn]], 271 (the words); [[w.solberg-hubert-humphrey]], 270. [[w.westmoreland-soldier-reports]], 115–16, 118 (the attack; Bundy, Taylor and U. Alexis Johnson in Westmoreland''s operations room, Bundy''s call to the White House; Westmoreland, Bundy and Khánh at Pleiku; the strikes on Đồng Hới, and Chấp Lễ the next day; the dependents). Check: Branch gives eight killed, more than a hundred wounded, ten aircraft destroyed (581). Check: Bird, 306, gives eight Americans killed and 126 wounded, at 2 a.m. Check: Bernstein, 344, gives eight Americans killed, a hundred wounded and ten aircraft destroyed. Check: Humphrey has an ad hoc meeting in the Cabinet Room "the first weekend of February 1965," Ball, Stevenson and he against the bombing (319); FRUS''s lists of those present (II, docs. 76–78, 80–81) name neither Humphrey nor Stevenson, and give Ball for a retaliatory strike (doc. 77); McNamara''s record has the President asking the Vice President to the meeting of the evening of Feb. 6 (doc. 78). Check: Taylor gives eight Americans killed ([[w.taylor-swords-and-plowshares]], 335). Check: Barrett, 17–18, has Mansfield attend the NSC meetings after Pleiku on two consecutive days and say, "I would negotiate. I would not hit back.". Check: [[w.logevall-choosing-war]], 324, has 8 killed, 126 wounded, ten aircraft destroyed; [[w.khoo-collateral-damage]], 24, 8 killed, 120 wounded. To check: [[w.pentagon-papers]]; [[w.kahin-intervention]]; [[w.berman-planning-a-tragedy]]; [[w.khong-analogies-at-war]]; [[w.vandemark-into-the-quagmire]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.goldstein-lessons-in-disaster]]; [[w.gardner-pay-any-price]]; [[w.kaiser-american-tragedy]]; [[w.thompson-rolling-thunder]]; [[w.clodfelter-limits-of-air-power]]; [[w.pribbenow-rolling-thunder-and-linebacker]]; [[w.cooper-lost-crusade]]; [*New York Times*, Feb. 7, 1965](https://timesmachine.nytimes.com/timesmachine/1965/02/07/issue.html), at 1 (cited by [[w.branch-pillar-of-fire]], 581); [[w.karnow-vietnam]], 427–28 (cited by [[w.branch-pillar-of-fire]], 581); [[w.mcnamara-in-retrospect]], 170–71 (cited by [[w.branch-pillar-of-fire]], 581); [*New York Times*, Feb. 8, 1965](https://timesmachine.nytimes.com/timesmachine/1965/02/08/issue.html), at 14 (cited by [[w.branch-pillar-of-fire]], 582); [[w.sagar-major-political-events-in]], 70 (cited by [[w.khoo-collateral-damage]], 24 n.92); [[w.smith-international-history-of-the-1991]], 31 (cited by [[w.khoo-collateral-damage]], 24 n.94). See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-24.vietnam]]; [[cal.1965-01-27.vietnam]]. Check: Frankum, 15, gives 8 Americans killed, 128 wounded; Cosmas, 213, 8 killed, 108 wounded, 20 aircraft damaged or destroyed. Check: Marolda, 495, gives eight killed and 109 wounded. Names: McGeorge Bundy, Taylor, Johnson, Westmoreland, Humphrey, Alexis Johnson, Vance, Nguyễn Xuân Oánh, Nguyễn Khánh. Check: *Victory in Vietnam* credits the 409th Sapper Battalion: 100 killed and 20 aircraft destroyed (142). Check: Asselin, 206, has a Special Forces camp attacked, eight Americans killed, more than a hundred wounded. Check: Johnson gives eight Americans killed outright and one later, more than a hundred wounded, five aircraft destroyed and fifteen damaged; the NSC met at 7:45 p.m., Feb. 6 (124). Check: Van Staaveren, 9, gives one American killed and twenty-four wounded at the advisers'' compound, seven killed and 104 wounded at Camp Holloway. Check: Gibbons, III, 60, gives eight Americans killed and 60 or more wounded. Check: Westmoreland gives eight Americans killed and five aircraft destroyed (115).'
