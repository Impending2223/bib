    when: Feb. 9
    date: '1965-02-09'
    thread: soviet-union
    also: [vietnam]
    c: A crowd of some 1,500, Asian students most of them, attacks the American Embassy in Moscow.
    n: FRUS 1964–68, XIV, docs. [91](https://history.state.gov/historicaldocuments/frus1964-68v14/d91), [92](https://history.state.gov/historicaldocuments/frus1964-68v14/d92), [93](https://history.state.gov/historicaldocuments/frus1964-68v14/d93) (Feb. 11). See [[cal.1965-02-06.soviet-union]].
  - id: cal.1965-02-09.vietnam
    when: Feb. 9
    date: '1965-02-09'
    thread: vietnam
    c: 'McGeorge Bundy answers Mansfield for Johnson, point by point. The UN: no expert sees "any prospect that it can act effectively."'
    n: '[FRUS 1964–68, II, doc. 94](https://history.state.gov/historicaldocuments/frus1964-68v02/d94). [[w.gibbons-u-s-government-and]], III, 69–70. See [[cal.1965-02-08.vietnam]]. Names: McGeorge Bundy, Mansfield, Johnson.'
