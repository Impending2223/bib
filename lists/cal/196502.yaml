    c: 'Selma.{1} Katzenbach telephones King: the Justice Department has learned of a plot to shoot him from ambush at Marion a week before;{2} he should take the greatest care.{3} That night at Brown Chapel King speaks of night marches, with or without Wallace''s leave.{4}'
