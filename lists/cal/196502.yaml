  - id: cal.1965-02-06.vietnam-congress
    when: Feb. 6
    date: '1965-02-06'
    thread: vietnam-congress
    also: [vietnam]
    c: 'The 545th NSC, 7:45 to 9 p.m., on reprisal for Pleiku, McCormack and Mansfield present. Mansfield: "We are not now in a penny ante game"; the people of the South "not behind us"; caution "our watchword"; what government had cleared it? A war with China, the Soviet-Chinese split healed, "worse than Korea." Johnson: "cowardice has gotten us into more wars than response has." The strikes authorized.'
    n: 'FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76) (summary notes); [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77) (memorandum for the record). [[w.mann-grand-delusion]], 394–95. Check: Mann dates the meeting the evening of Feb. 7. See [[cal.1965-02-07.vietnam]]. Names: McCormack, Mansfield, Johnson.'
    src:
      c: d0af71f9
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d76: A-C, H'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d77: A, D-H'
        - 'w.mann-grand-delusion 394–95: A-H'
        - 'via w.mann-grand-delusion 394 n.10: B-F'
        - 'via w.mann-grand-delusion 395 n.13: G'
    tags: [name:mccormack-john-w, name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1965-02-07.vietnam
    when: Feb. 7–8
    date: '1965-02-07'
    thread: vietnam
    c: 'Pleiku. Before dawn the Viet Cong attack the American advisers'' compound and the Camp Holloway airfield: 7 Americans killed, 109 wounded, by the first count; aircraft destroyed. McGeorge Bundy, in Saigon since Feb. 4, and Taylor recommend reprisal; the NSC, meeting the evening of Feb. 6 in Washington, approves. Flaming Dart: of four army barracks in southern North Vietnam, Navy planes from the carriers hit Đồng Hới, the others weathered in; Feb. 8, South Vietnamese planes, with American cover, strike Chấp Lễ. Johnson orders American dependents home. Check the final count.'
    n: 'Statement by the President Upon Ordering Withdrawal of American Dependents From South Viet-Nam, [1965 Pub. Papers 153](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=229) (Feb. 7, 1965). FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76), [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77), [78](https://history.state.gov/historicaldocuments/frus1964-68v02/d78), [79](https://history.state.gov/historicaldocuments/frus1964-68v02/d79), [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87). [[w.gibbons-u-s-government-and]], III, 60–64 (the attack; Bundy and Taylor for reprisal; the NSC, Feb. 6; four barracks, one struck); [[w.staaveren-gradual-failure]], 9–18; [[w.frankum-like-rolling-thunder]], 15–17 (the attack on Camp Holloway; Flaming Dart, Đồng Hới struck, the rest weathered out; Chấp Lễ, Feb. 8); [[w.vietnam-victory-in-vietnam]], 142–43 (the attack on the airfield and Camp Holloway; Flaming Dart on Hồ Xá and Đồng Hới, 143); [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack; Bundy and Taylor for reprisal; the President''s approval the evening of Feb. 6; one barracks hit, the rest weathered out; the next day''s strikes); [[w.cosmas-joint-chiefs-of-staff-2012]], 213–214 (the attack; the recommendation; the NSC; the dependents); [[w.marolda-united-states-navy-and]], 495–97 (the attack; the reprisal authorized; Flaming Dart; Chấp Lễ; the dependents); [[w.anthony-war-in-northern-laos]], 156 (the attack, 7 killed and 109 wounded; the recommendation; the NSC''s approval); [[w.nguyen-hanois-war]], 74–75 (the attack); [[w.asselin-hanois-road-to-the]], 206 (the same); [[w.johnson-vantage-point]], 124–26 (the reprisal approved, one target struck, the others weathered in; the dependents ordered home); [[w.dallek-flawed-giant]], 247–48 (eight advisers killed, 247; one of four target