    c: 'The White House briefing for members of Congress, after Church''s speech for a negotiated settlement: Johnson backs Church into a corner of the dining room for an hour, "to show me my error," by Church''s account; the story Johnson gives a reporter the next day: "The next time you want a dam in Idaho, Frank, go see Walter." Johnson opens with a Senator who "predicted ... that there would be no war in Europe," Borah. Mansfield, at the reception: "Frank, I was expecting you to speak up." McCarthy, leaving: "If Frank Church had just surrendered, we all could have gone home thirty minutes ago." By Church''s account.'
    n: '[[w.gibbons-u-s-government-and]], III, 128–29 (Church''s accounts). [[w.mann-grand-delusion]], 12–14, 412. To check: Church oral history, 1969, LBJ Library; CRS interview with Church, July 5, 1983 (cited by [[w.gibbons-u-s-government-and]], III, 128 n.7, 129 nn.8, 10); [[w.ashby-fighting-the-odds]], 194–96. See [[cal.1965-02-17.vietnam-2]]. Names: Church, Johnson, Lippmann, Mansfield, McCarthy. Check: Mann puts the briefing "that evening," Feb. 18 (12), and on Feb. 17 (412).'
