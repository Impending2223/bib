  - id: cal.1965-02-07.vietnam-congress
    when: Feb. 7
    date: '1965-02-07'
    thread: vietnam-congress
    also: [vietnam]
    c: 'The 546th NSC, 8 a.m., with McCormack, Mansfield and Ford. Mansfield: "Why cannot we handle this matter through the United Nations? Can''t the Geneva powers act?" Johnson: "This cannot be done." Ford: why strike one target of four? Mansfield: the purpose to impress Hồ Chí Minh and Giáp, not necessary "to go any further at this time"; Johnson: to impress Kosygin "and a number of others in the world, including our own citizens." Mansfield and McCormack agree to the South Vietnamese strike.'
    n: 'FRUS 1964–68, II, docs. [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80) (summary notes); [81](https://history.state.gov/historicaldocuments/frus1964-68v02/d81) (memorandum for the record). [[w.mann-grand-delusion]], 395–96. Check: Mann dates the meeting the morning of Feb. 8. See [[cal.1965-02-06.vietnam-congress]]. Names: McCormack, Mansfield, Ford, Johnson, Hồ Chí Minh, Võ Nguyên Giáp, Kosygin.'
