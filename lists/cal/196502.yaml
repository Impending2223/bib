    tags: [name:bundy-mcgeorge, name:taylor-maxwell]
  - id: cal.1965-02-01.intelligence
    when: Feb. 1
    date: '1965-02-01'
    place: washington
    thread: intelligence
    also: [soviet-union, vietnam]
    c: 'CIA intelligence memorandum, "The Kosygin Delegation to North Vietnam": "an unusually strong delegation" shows Moscow''s wish to regain influence in Hanoi and its concern at escalation;{1} more Soviet aid, surface-to-air missiles perhaps.{2} The same day Komer to Bundy: Moscow means to "re-engage in Southeast Asia"; "I wish I saw a decent way to warn them off."{3}'
    n: '[FRUS 1964–68, II, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v02/d55). [[w.preston-war-council]], 169–70. To check: Komer to Bundy, Feb. 1, 1965, NSF, Country File, Vietnam, box 13, LBJ Library (cited by [[w.preston-war-council]], 170 n.31). Names: Kosygin, Komer, Bundy.'
    src:
