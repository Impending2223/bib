    when: Feb. 4
    date: '1965-02-04'
    thread: europe-and-the-alliance-france
    also: [economy]
    c: 'De Gaulle''s press conference at the Élysée: the gold exchange standard to give way to the gold standard; other countries invited to follow France and turn surplus dollars into gold. Ball to Dillon by telephone: "a lot of very angry Congressmen and Senators."'
    n: '[[w.gavin-gold-dollars-and-power]], 120–24. To check: Ball to Dillon, Feb. 4, 1965, Ball Papers, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 124 n.29); de Gaulle, *Discours et messages*, IV (cited by [[w.gavin-gold-dollars-and-power]], 75 n.50). Check: the text of the press conference. Names: de Gaulle, Ball, Dillon.'
