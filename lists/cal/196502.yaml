  - id: cal.1965-02-07.opinion
    when: Feb. 7
    date: '1965-02-07'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Jan. 7–12: a police permit required to buy a gun: favor 73 percent, oppose 23. A gun in the home: 48.'
    n: '[[w.gallup-poll]], III, 1922–23.'
  - id: cal.1965-02-08.conservation
    when: Feb. 8
    date: '1965-02-08'
    thread: conservation
    c: Special message on natural beauty. Billboards and junkyards along the highways to be controlled; landscaping on federal-aid roads; a national system of wild rivers, and one of trails; the Potomac a model; a Redwood National Park studied; the Land and Water Conservation Fund fully funded. Water quality standards; talks with industry on automobile exhaust. A White House Conference on Natural Beauty, Laurance Rockefeller chairman.
    n: 'Special Message to the Congress on Conservation and Restoration of Natural Beauty, [1965 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=231) (Feb. 8, 1965). To check: [[w.gould-lady-bird-johnson-and]]. See [[cal.1964-09-03.conservation]]; [[cal.1965-01-28.conservation]]. Names: Laurance Rockefeller.'
    tags: [name:johnson-lyndon-b, name:rockefeller-laurance-s]
  - id: cal.1965-02-08.foreign-aid
    when: Feb. 8
    date: '1965-02-08'
    thread: foreign-aid
    also: [middle-east]
    c: The House declines to insist on its ban on sales to the UAR, [165–241](https://voteview.com/rollcall/RH0890006).
    n: '[111 Cong. Rec., House, Feb. 8, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-7-1.pdf). See [[cal.1965-01-26.foreign-aid]].'
  - id: cal.1965-02-08.vietnam
    when: Feb. 8
    date: '1965-02-08'
    thread: vietnam
    c: 'Mansfield to Johnson after the three NSC meetings: grave doubts of Khánh''s government; the South tired of the war; too far into the North, worse than Korea.'
    n: '[FRUS 1964–68, II, doc. 92](https://history.state.gov/historicaldocuments/frus1964-68v02/d92). [[w.gibbons-u-s-government-and]], III, 69. See [[cal.1965-02-07.vietnam]]. Names: Mansfield, Johnson, Nguyễn Khánh.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:nguyen-khanh]
  - id: cal.1965-02-09.economy
    when: Feb. 9
    date: '1965-02-09'
    thread: economy
    c: House passes the bill to end the 25 percent gold certificate reserve against Federal Reserve deposits, H.R. 3818, [300–82](https://voteview.com/rollcall/RH0890008); the reserve against notes kept.
    n: '[111 Cong. Rec., House, Feb. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-8-2.pdf). To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1965-01-28.economy]].'
