    c: 'Johnson approves "a program of measured and limited air action," with Saigon, against military targets in the North below the 19th parallel, "until further notice": once or twice a week, two or three targets a day.{1} With it, the case against Hanoi to the Security Council and a readiness for "talks."{2}'
    n: '[[w.gibbons-u-s-government-and]], III, 85–86 (not the strikes'' frequency); [[w.frankum-like-rolling-thunder]], 19–20 (the Joint Chiefs'' eight-week program, Feb. 12, strikes with Saigon two days a week); [[w.cosmas-joint-chiefs-of-staff-2012]], 225–26; [[w.staaveren-gradual-failure]], 80–81; [[w.marolda-united-states-navy-and]], 504 (the approval, Feb. 13; a limited campaign on two or three targets); [[w.johnson-vantage-point]], 130; [[w.dallek-flawed-giant]], 249 (the cable to Taylor; not the limits); [[w.westmoreland-soldier-reports]], 117–18 (the program announced; two to four attacks a week, below the 19th parallel); [[w.preston-war-council]], 180 (the approval, by cable to Taylor); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 530–31; [[w.drea-mcnamara-clifford-and-the-2011]], 23 (a limited version of the Chiefs'' eight-week campaign, approved tentatively); [[w.logevall-choosing-war]], 344 (Johnson formally approves the sustained bombing of North Vietnam at a meeting on Feb. 13; the Chiefs'' plan, almost all south of the 19th parallel; not "until further notice" or the weekly figures); [[w.mann-grand-delusion]], 403–04 (Feb. 13: Ball, acting Secretary of State, informs Saigon that the President approved "a program of measured and limited air action" south of the 19th Parallel, jointly with the South Vietnamese "until further notice," strikes on two or three targets "about once or twice a week"; the case to the Security Council, Hanoi the "aggressor," the United States "ready and eager" for "talks"); [[w.lich-su-khang-chien-chong-my]], III, 406 (Feb. 13: Johnson agrees to continuous bombing of the whole North, "to break Hanoi''s will", code-named Rolling Thunder, carried out from Mar. 2). [[w.ball-past-has-another-pattern]], 392 (Rolling Thunder ordered, two days after Qui Nhơn). [FRUS 1964–68, II, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v02/d113); [doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v02/d115); [doc. 109](https://history.state.gov/historicaldocuments/frus1964-68v02/d109) (the Joint Chiefs'' eight-week program, Feb. 11). Check: Logevall, 344, gives the Chiefs'' plan as four fixed targets and air interdiction over two road segments a week. See [[cal.1965-02-07.vietnam]]. Names: Johnson.'
