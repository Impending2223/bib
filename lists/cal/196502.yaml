    c: 'Andrew Young to Lee White, for King in the Selma jail: a presidential emissary to Selma; a statement for the right to vote in Dallas County; legislation. White to Johnson: tell Young the Justice Department is following it; Katzenbach, in secret touch with Judge Thomas, thinks Thomas can settle it.'
    n: '[[w.garrow-bearing-the-cross]], 382–84; [[w.branch-pillar-of-fire]], 577; [[w.kotz-judgment-days]], 266; [[w.bernstein-guns-or-butter]], 220–21 (White to Johnson: "the basic reason for King''s call is to have a reply that he can publicize"). After DeLoach''s letter, by Kotz, 266 n.: [[cal.1965-02-03.civil-rights-the-executive]]. To check: Lee White to Johnson, Feb. 3, 1965, White House Central Files, Ex HU/ST1, box 24, Johnson Library; King to Young, Selma jail notes, Feb. 1–5, 1965, King Papers, 22–6, King Center; Hoover to Moyers, Feb. 3 and 4, 1965, FBI file 44-12831-298, 100-106670-804; New York Times, Feb. 4, 1965, 1; Washington Post, Feb. 4, 1965, A1 (cited by [[w.garrow-bearing-the-cross]], 384 n.26); White to LBJ, "Message from Dr. Martin Luther King," Feb. 3, 1965, EX HU2/ST1, LBJ (cited by [[w.branch-pillar-of-fire]], 577). See [[cal.1965-01-02.voting-rights]]. Names: Young, White, Johnson, Katzenbach, Thomas.'
