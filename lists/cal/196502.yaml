    c: 'Peking 北京. Peng Zhen 彭真 speaks to the secretaries of the "four clean-ups" Tongxian 通县 branch teams: since the "Twenty-three Articles," great progress, many erring cadres have confessed, planned repayment and laid down burdens, only a few branch secretaries with great popular anger not yet freed; neither clutched nor let off; with most cadres and masses, the few landlords and the like and grave "four unclean" cadres met by "using contradictions, winning the many, opposing the few, defeating them one by one"; landlords missed in land reform treated case by case, labels for those with popular anger or recent counter-revolution; reactionary rich peasants few; property confiscated only by law; grave grafters who confess and repay may go unlabeled; production and the "four clean-ups" both, good branches built so the teams can leave.'
