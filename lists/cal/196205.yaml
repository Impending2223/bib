  - id: cal.1962-05-24.missile-crisis
    when: May 24
    date: '1962-05-24'
    place: moscow
    thread: missile-crisis
    c: 'The Presidium approves Khrushchev''s plan: medium- and intermediate-range missiles to Cuba, in secret.{1} Castro agrees at month''s end.{2} Eleven members of the Presidium, Malinovsky and Gromyko speak; unanimous, Mikoyan for.{3} Rashidov''s delegation, Marshal Biryuzov the real power, reaches Havana late in May; Castro accepts.{4} By Alekseev''s account, Castro: "May we be the first victims of a showdown with U.S. imperialism!"{5}'
    n: '[[w.poole-joint-chiefs-of-staff]], 161; [[w.paterson-contesting-castro]], 259 (Soviet and Cuban officials first discuss the missiles in May); [[w.fursenko-khrushchevs-cold-war]], 436 (unanimous, Mikoyan for; Castro''s consent first); [[w.fursenko-khrushchevs-cold-war]], 438–39 (Rashidov''s delegation, Biryuzov the real power; Castro accepts, not believing it is for Cuba''s defense alone); [[w.dobrynin-in-confidence]], 74–76 (Alekseev named ambassador; Khrushchev''s "cup of tea" at the dacha; Castro: "May we be the first victims of a showdown with U.S. imperialism!"; by Alekseev''s notes given Dobrynin); [[w.prezidium-tsk-kpss-1954]], I, 556 (Protocol 32, May 21 and 24); [[w.prezidium-tsk-kpss-1954]], I, 1100 n.4 (the editors: the Defense Council decides, May 24, the troops and equipment to move to Cuba in secret; the Presidium''s resolution P 32/1 the same day, unanimous); [[w.macfarquhar-origins-of-the-cultural]], III, 315 (Khrushchev comes up in April–May 1962 with the idea of secretly emplacing missiles in Cuba; the Defence Council takes the final decision May 24, Khrushchev having all present sign the directive); [[w.fursenko-khrushchevs-cold-war]], 436; [[w.fursenko-khrushchevs-cold-war]], 438–39; [[w.dobrynin-in-confidence]], 76. The tapes (K–J Adm. II.J). FRUS vols. [6](https://history.state.gov/historicaldocuments/frus1961-63v06), [10](https://history.state.gov/historicaldocuments/frus1961-63v10), [11](https://history.state.gov/historicaldocuments/frus1961-63v11). [[w.fursenko-one-hell-of-a]], 180–82, 186–87 (the Defense Council, May 21, and the Presidium, May 24; Castro''s agreement after the Rashidov–Biryuzov mission, May 29–30). Check: the editors (I, 1100 n.4), from S. P. Ivanov''s recollection as Volkogonov gives it, have Mikoyan object at the Defense Council; they cite the resolution, APRF, f. 3, op. 65, d. 872, l. 49, and do not print it. To check: [[w.dobbs-one-minute-to-midnight]]; [[w.stern-averting-the-final-failure]]; [[w.allison-essence-of-decision]]; [[w.kennedy-thirteen-days]]; [[w.sherwin-gambling-with-armageddon]]; Extract from protocol 32/1, meeting of the Presidium, May 24, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 181 n.45); [[w.beschloss-crisis-years]], 382, 386 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 315 n.102); [[w.khrushchev-khrushchev-remembers]], 492–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 315 n.104a); [[w.khrushchev-khrushchev-remembers-1976]], 583 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 315 n.104b); [[w.zubok-inside-the-kremlins-cold]], 261–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 315 n.104d). Names: Khrushchev, Castro, Mikoyan, Rashidov, Malinovsky, Gromyko.'
