    c: 'Peking 北京. Peng Zhen 彭真 speaks at the May work conference: grain and cotton up only if farm and industrial goods are exchanged at equal value, high-priced goods sold while state grain prices stay low cannot last; collective economy held by pay for work, else disguised individual farming; in Peking''s suburbs collective land turned to private plots; reviews for the cadres below the county; leading cores at every level, the county the center at the base; cadres sent down to strengthen county and commune leadership.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 194–195. Made public: 2012. See [[cal.1962-05-07.china-leadership]]. Names: Peng Zhen.'
