    c: 'Cambodia. Malcolm MacDonald, there May 11–15 to dissuade Sihanouk from pressing for a conference on Vietnam, with Sihanouk: none should think all Laos can be neutral, a third of it held by the Pathet Lao and Vietnamese; a neutral government under Souvanna Phouma the best and only way to keep Laos from falling wholly, with the free world''s active help. Not much worried by the Communists; South Vietnamese and Thai aggression with American arms the danger, which would leave him no choice but China''s help and the end of nonalignment.'
