    also: [china-zhou]
    c: 'Zhou Enlai revises the draft of the Central Committee''s directive issuing the Finance Group''s report: face difficulties fully and overcome them one by one;{1} from Center to localities the main leaders split in two, one part on streamlining, one on the villages. The Group had proposed cutting over 9 million workers and 13 million urban people; the Center now decides over 10 million workers and 20 million urban people in two years. It goes to the Party May 26.{2} Zhou''s covering letter, by Li Fuchun, asks that Li Fuchun, then at Shanghai, report to Mao at Hangzhou; if Mao has no time, he is to read the directive first, and Tian Jiaying or Lin Ke to give him the report''s gist.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 478 (May 19, 1962); [[w.mao-zedong-zhuan]], V, ch. 69 n.51 (May 19: Zhou Enlai sends Mao the Finance Group''s report and the draft directive, by Li Fuchun; Mao''s secretary or Lin Ke to explain the report if he has no time). Continues 479. [[w.jianguo-yilai-mao-zedong]], XVI, 292 n.2. Made public: 1997. To check: the directive as issued, May 26, 1962; Zhou Enlai 周恩来, letter to Mao Zedong (manuscript 手稿), May 19, 1962, with the draft directive and the Central Finance Group''s report (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.51). Names: Zhou Enlai, Li Fuchun, Tian Jiaying, Lin Ke.'
