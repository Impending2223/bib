        - 'via w.selverstone-kennedy-withdrawal 67 n.72: A, E-F'
        - 'w.preston-war-council 111: all'
        - 'via w.preston-war-council 111 n.28c: all'
    tags: [name:kennedy-john-f, name:gilpatric-roswell-l, name:decker-george-h, name:taylor-maxwell, name:bundy-mcgeorge, name:forrestal-michael-v, name:harriman-w-averell, name:hilsman-roger, name:galbraith-john-kenneth]
  - id: cal.1962-05-01.republican-party-congress
    when: May 1
    date: '1962-05-01'
    thread: republican-party-congress
    also: [jobs-and-wages]
    c: 'The Senate Republican Policy Committee and the members of the conference present resolve unanimously to oppose the financing of the standby public works bill as reported: provisions that "set a dangerous precedent and strike at the financial stability of institutions in which the American public has great faith and confidence." Hickenlooper puts the statement in the Record May 2.'
    n: 'Hickenlooper, [108 Cong. Rec. 7555](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt6/pdf/GPO-CRECB-1962-pt6-6-2.pdf#page=13) (May 2, 1962). [[w.sundquist-politics-and-policy]], 95–96 (the resolution). See [[cal.1962-03-26.jobs-and-wages]]. Names: Hickenlooper.'
    src:
      c: a6ab97b5
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt6/pdf/GPO-CRECB-1962-pt6-6-2.pdf#page=13: all'
        - 'w.sundquist-politics-and-policy 95–96: A'
        - 'via w.sundquist-politics-and-policy 96 n.84: A'
    tags: [name:hickenlooper-bourke-b]
  - id: cal.1962-05-01.defense
    when: May 1
    date: '1962-05-01'
    thread: defense
    c: The report on government contracting for research and development, Bell's, the Budget Director's, with Defense, the AEC, the Civil Service Commission, NASA, the National Science Foundation and the science adviser, dated Apr. 30, sent to Congress; Kennedy has approved it for the agencies' guidance. Not-for-profit bodies like RAND, "if strongly led," a source of objective advice; too close control by an agency "may tend to limit objectivity." Federal salaries to be raised.
    n: 'Letter to the President of the Senate and to the Speaker of the House on Federal Research and Development Contracts, [1962 Pub. Papers 352](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=412) (May 1, 1962). [[w.bissell-reflections-of-a-cold]], 227 n.2 (the report quoted, from the excerpts released May 1). Check: Bissell has the report drawn up in the summer of 1962 by a cabinet committee and approved by the President (227); the Papers give it dated Apr. 30, released May 1. To check: "Excerpts from Report to the President on Government Contracting for Research and Development, Released May 1, 1962," May 22, 1962, Papers of Richard M. Bissell Jr. (cited by [[w.bissell-reflections-of-a-cold]], 227 n.2). Names: Bell, Kennedy.'
    src:
      c: c11f2b45
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=412: A-B, E'
        - 'w.bissell-reflections-of-a-cold 227 n.2: C-D'
        - 'via x.1962-05-22.excerpts-from-report-on-government-contracting: C-D'
    tags: [name:bell-david-e, name:kennedy-john-f]
  - id: cal.1962-05-01.king
    when: May 1
    date: '1962-05-01'
    thread: king
    also: [antisubversion]
    c: 'The FBI''s microphones in Levison''s office. Levison, glad King''s name never came up before the subcommittee: "I wasn''t as much bothered as McClellan." McClellan had called him the worst witness: "That means I was worse than Jimmy Hoffa."'
    n: '[[w.branch-parting-the-waters]], 586. To check: microphone log, May 1, 1962, FBI New York file 100-111180, subfile 5 (cited by [[w.branch-parting-the-waters]], 586 n.2). See [[cal.1962-04-30.king]]. Names: Levison, Martin Luther King, McClellan.'
