    when: May 11
    date: '1962-05-11'
    place: peking
    thread: china-retreat-1962
    also: [china-agriculture]
    c: 'Peking 北京. Zhu De 朱德, at the Central Work Conference''s 中共中央工作会议 plenary, on village work: the whole Party to be roused to develop farming, the economy''s base; though the order agriculture, light, heavy industry was long proclaimed, building followed heavy, light, agriculture, a road that does not go through, and must now be turned round; in the villages two legs, the main work and sidelines both; the peasants'' food, clothing, housing and travel cannot be met by grain shared out from the main work alone, but by household sidelines.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1837. Made public: 2016. Names: Zhu De.'
