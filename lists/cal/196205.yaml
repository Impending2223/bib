  - id: cal.1962-05-11.china-leadership
    when: May 11
    date: '1962-05-11'
    time: 1962-05-11T07:30Z
    thread: china-retreat-1962
    also: [china-famine, china-zhou]
    follows:
      - cal.1962-05-11.china-leadership-6
    c: 'Zhou Enlai''s speech at the Central Work Conference on why the situation is still called very grave: the unbalance caused by "our subjective errors" will clear only by degrees, and the famine''s effects are not quickly turned.{1} Work well needs clear facts, great resolve, right methods;{2} to close so many factories, cut so many staff, no other regime in China could, only this one with its base in the masses;{3} "fear in the face of the task," no pride or carelessness.{4} He explains the streamlining plan by sector, policy limits and placing.{5} The conference decides to carry out the eight-character line and adjust by a wide margin, and broadly agrees with the Finance Group''s report that Zhou and Li Xiannian submitted; his main points go to delegates to take home.{6} He sends Li Fuchun to Mao at Hangzhou with the draft directive.{7} By Yang''s notes of the speech, from 3:30 p.m.: cutting 20 million is like moving a country; the Seven Thousand conference''s long-range targets cannot stand; the summer harvest is poor; imports are to be held within 700 million dollars; staff are to be cut by 10 to 10.7 million and the towns by 10 million, mostly within a year.{8}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 476–77 (May 11, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 204–05, 208 (Zhou on the move of 10 million workers, 20 million city people in two years; Zhou informs Mao and secures his agreement); [[w.macfarquhar-origins-of-the-cultural]], III, 282 (Zhou tells his colleagues that, except for a few regions, agricultural production in most of the country has stopped declining and taken an upward turn); [[w.yang-shangkun-riji]], II, 169–171 (May 11, 1962; the plenary, from 3:30 p.m.; by Yang''s notes: cutting 20 million like moving a country; the Seven Thousand conference''s long-range targets untenable; the summer harvest poor; imports held within 700 million dollars; workers down 10–10.7 million, town people 10 million); [[w.mao-zedong-zhuan]], V, ch. 69 n.47 (May 11: Zhou Enlai, repeating Liu Shaoqi''s estimate at the Seven Thousand Cadres Conference, that the hardest time is mostly past but is still a severe one, the adjustment to be long, in general the third five-year plan; Deng Xiaoping and Liu Shaoqi also speak). [[w.yang-shangkun-riji]], II, 169–171. Made public: 1997. The order: after [[cal.1962-05-11.china-leadership-6]], [[w.yang-shangkun-riji]], II, 169 (the plenary 10 a.m. to 1 p.m., then from 3:30 p.m. Zhou''s report). To check: the main points of the speech as sent to the delegates; [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 204 n.72a); [[w.enlai-zhou-enlai-xuanji-selected]], 2, 421 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 204 n.72b); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.73a); [[w.enlai-zhou-enlai-xuanji-selected]], 2, 421–22 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.73b); [[w.enlai-zhou-enlai-xuanji-selected]], 2, 419–20 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 208 n.90); [[w.zedong-jianguo-yilai-mao-zedong]], 10,