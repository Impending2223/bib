    c: '10:15 a.m., by telephone. Ball tells Bundy and U. Alexis Johnson of the barrage and the attack on Nam Tha, the two Americans taken out by helicopter. Johnson: the first clear, open breach of the cease-fire; Phoumi had reinforced Nam Tha against advice. A message for Rusk to send Gromyko; MacDonald to work on Souphanouvong; Souvanna to be reached in Paris. Ball to call the President before he goes boating.'
