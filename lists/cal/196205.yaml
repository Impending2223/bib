    thread: governors
    also: [elections-1962, right-and-the-military]
    c: 'Texas primaries for governor. Democratic: Connally over Don Yarborough, 431,498 to 317,986, 29.8 percent; Governor Daniel 248,524, 17.2 percent; Attorney General Will Wilson 171,617, 11.9 percent; Marshall Formby 139,094, 9.6 percent; Walker 138,387, 9.6 percent; Connally and Yarborough to a runoff. Republican: Jack Cox over one other, 99,170 to 16,136, 86.0 percent.'
    n: '[Wikipedia, "1962 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the parties'' canvasses (Texas State Library and Archives). To check: [[w.knaggs-two-party-texas]]; [[w.reston-lone-star]]; [[w.connally-in-historys-shadow]]; [[w.davidson-race-and-class-in]]; [[w.krochmal-blue-texas]]. Names: Connally, Don Yarborough, Daniel, Formby, Cox, Wilson, Walker.'
