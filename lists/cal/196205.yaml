    thread: court
    also: [voting-rights]
    c: 'Eastland in the Senate, in the literacy-test filibuster, against the Supreme Court: "The court must be restricted." His box scores of its cases on communism and subversion: Black for the "Communist" position in all 102; Warren and Brennan in most.'
