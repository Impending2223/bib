  - id: cal.1962-05-02.vietnam
    when: May 2
    date: '1962-05-02'
    thread: vietnam
    c: 'Forrestal to Kennedy, for the morning''s briefing on Laos and Vietnam: no significant change; the strategic villages and pacification "proceeding satisfactorily." Defoliation and crop destruction up again; McNamara''s research group finds defoliation technically feasible, its effect unproven.'
    n: '[FRUS 1961–63, II, doc. 178](https://history.state.gov/historicaldocuments/frus1961-63v02/d178). [[w.preston-war-council]], 107, 109. See [[cal.1962-05-01.vietnam-2]]. Names: Forrestal, Kennedy, McNamara. Check: Preston''s date for the briefing; the calendar has Kennedy''s meeting on May 1.'
