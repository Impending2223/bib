    c: 'Edwards, with Houston''s help, to the Attorney General: a memorandum of the briefing of May 7. The operation "conducted during the period approximately August 1960 to May 1961"; "After the failure of the invasion of Cuba word was sent through Maheu to Rosselli to call off the operation and Rosselli was told to tell his principal that the proposal to pay one hundred fifty thousand dollars for completion of the operation had been definitely withdrawn." After the offer, Edwards "briefed the proper senior officials of [the] Agency," who "duly orally approved"; "knowledge" kept to six persons.'
