    c: 'Xichang 西昌. Zhu De 朱德 inspects the Taihe iron mine 西昌太和铁矿 and the Xichang research institute of iron, steel and nonferrous metals 西昌钢铁有色金属研究所.{1} Told by the mine''s head that over 5,000 workers have been cut and some 500 kept, he says: the state in great difficulty, some building must halt for now, but preparations to go on, and large-scale industrial building will start again once the difficulties are past; the works and offices to keep more private plots; China''s way is two hands, at least vegetables to eat; waste hills to be opened step by step, small to large.{2}'
