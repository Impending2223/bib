    n: 'P 33/I. [[w.prezidium-tsk-kpss-1954]], III, 258–78 (doc. 246.3 and the letter, 246.3.1; no note of the item in vol. I). [[w.lengxi-shinian-lunzhan-1956-1966]], 494 (the CPSU''s answer of May 31 to the Chinese letter of Apr. 7: in effect a refusal of a conference of the brother parties, since it makes the improvement of Albania''s relations with the USSR a precondition, asking the Albanian party to give up its position and yield to the CPSU leaders); [[w.guan-vietnamese-communists-relations-with]], 222 (May 31: a new conference agreed in principle; both to stop attacks in the press). See [[cal.1962-05-31.soviet-union]], [[cal.1962-04-14.soviet-union-leadership]]. Made public: 1999. Names: Deng Xiaoping, Hoxha, Shehu.'
