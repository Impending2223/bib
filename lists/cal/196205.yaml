  - id: cal.1962-05-01.vietnam
    when: May 1
    date: '1962-05-01'
    thread: vietnam
    c: 'Marguerite Higgins, in the *Herald Tribune*, reads Ball''s speech of Apr. 30 as a commitment now "irrevocable."{2} Kennedy asks how it was cleared;{3} Bundy to Kennedy: "a tone and content that we would not have cleared."{4}'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 709 ("A few days later" than Lemnitzer''s reply, Ball''s speech: Higgins leads her *Herald Tribune* story, "The American commitment, moreover, is now irrevocable"; Kennedy asks Bundy how it had slipped by; Bundy: "a tone and content that we would not have cleared"; no day or place); [[w.schlesinger-robert-kennedy-and-his]], 709 ("A few days later" than Lemnitzer''s reply, Ball''s speech: Higgins leads her *Herald Tribune* story, "The American commitment, moreover, is now irrevocable"; Kennedy asks Bundy how it had slipped by; Bundy: "a tone and content that we would not have cleared"; no day or place). [[w.selverstone-kennedy-withdrawal]], 69–70 (the Herald Tribune''s reading; Kennedy disturbed). Selverstone, 69, dates the speech Apr. 30, at the Economic Club of Detroit: [[cal.1962-04-30.vietnam]]. Names: Ball, John F. Kennedy, Bundy, Higgins.'
    src:
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 709: 2, 3, 4'
        - 'via w.schlesinger-robert-kennedy-and-his 709 n.42: 3'
        - 'w.selverstone-kennedy-withdrawal 69–70: 2, 3'
        - 'via w.selverstone-kennedy-withdrawal 70 n.85: 3'
    tags: [name:ball-george-w, name:kennedy-john-f, name:bundy-mcgeorge, name:higgins-marguerite, ok:note-substance]
