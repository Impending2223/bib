    c: 'Deng Xiaoping to the work conference: rehabilitation of those hit in 1959–60 is too slow;{1} perhaps 10 million cases need review, 400,000 so far in Henan;{2} he urges the Sichuan method, complete and en masse, with no stain on records.{3} He says those who fear the charge of rightism and hide problems are themselves rightist.{4} Two central tasks: 20 million fewer townspeople, and better work in the production teams.{5}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 207–08; [[w.yang-shangkun-riji]], II, 171 (May 11, 1962; by Yang''s notes: two centers, streamlining and the production team; rehabilitation to go faster; the county committees'' core to be built); [[w.deng-xiaoping-nianpu-1904]], III, 1704–1705 (May 11, 1962; afternoon; Deng''s speech: two central tasks, 20 million fewer townspeople and stronger production teams; rehabilitation below the county, the villages first, in one sweep, caps off, no tails, an admission we were wrong; leading cores of committees, the county above all, the danger lack of confidence; printed in *Deng Xiaoping wenxuan*, vol. 1, as "Ways to overcome the present difficulties"); [[w.yang-jisheng-mubei]], II, 917 n.146 (in his speech of May 11 Deng says that for the places that have rehabilitated, the number is known: 400,000 in Henan, and in fact more; in the whole country perhaps 10 million; the number was cut from his Selected Works); [[w.yang-jisheng-mubei]], II, 1121 n.21 (Deng at the May conference: one package settlement, all hats off); [[w.yang-jisheng-tiandi-fanfu]], I, 63 (Deng: Henan 400,000 and more; the nation perhaps 10 million, those affected tens of millions; the figure struck from the text in *Deng Xiaoping wenxuan*); [[w.deng-xiaoping-nianpu-1904]], III, 1704; [[w.chen-yun-nianpu-xiuding]], III, 133. Made public: 1997. The order: after [[cal.1962-05-11.china-leadership]], [[w.yang-shangkun-riji]], II, 169 ("由恩来同志报告，小平发言，少奇同志做了总结"). To check: [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 207 n.86a); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 300 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 207 n.86b); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 207 n.87a); [[w.xiaoping-deng-xiaoping-wenxuan-1938]], 301 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 207 n.87b); [[w.zhonggong-dangshi-ji