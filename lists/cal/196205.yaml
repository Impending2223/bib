    tags: [polity:prc, polity:india]
  - id: cal.1962-05-11.china-2
    when: May 11
    date: '1962-05-11'
    thread: china
    also: [south-asia]
    c: The Foreign Ministry sends a second note to the Indian embassy, a serious protest at Indian troops' intrusion into Tibet south of Spanggur Lake. It points out that the Indian government means to heighten tension along the western sector of the boundary. It demands that the Indian troops withdraw from their posts at once and stop all provocation; if not, India will bear all the consequences.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 227–228 (May 11, 1962).'
