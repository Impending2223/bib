  - id: cal.1962-05-11.china
    when: May 11
    date: '1962-05-11'
    thread: china
    also: [south-asia]
    c: The Foreign Ministry sends a note to the Indian embassy, rejecting again India's proposal to negotiate a new trade and transit agreement in place of the 1954 agreement on Tibet. It regrets the proposal and rebuts the pretexts. It restates China's firm adherence to the five principles and its efforts to improve relations. The liberated new China cannot be pushed back to the position of the old China, and its territorial sovereignty is not to be violated.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 227 (May 11, 1962).'
    src:
