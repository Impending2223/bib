    c: 'Liu Shaoqi to the work conference: every year since the Leap but one has ended with lower targets, the party has been leftist for years and should be rightist for a while;{1} sending the cities'' people to the countryside is harder than the Leap;{2} student riots are to be kept few and small, martial law and cut transport links if they come, and no shooting;{3} the most difficult period is past only in a few areas, not in the cities and industry.{4}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 204–05, 208; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 555 (May 11, 1962; Liu''s closing talk: how stands the economic situation? a very difficult one, not a great one; the most difficult period has not passed in the cities and in industry; the main danger is still underestimating the difficulties; the town population is to be cut by more than twenty million, and the national economy adjusted at once; the talk is in his Selected Works as "What after all is the present economic situation?"); [[w.yang-shangkun-riji]], II, 171–172 (May 11, 1962; Liu sums up, the conference ends; by Yang''s notes: the targets lowered every year since 1958; the hardest time not past, save in places; trouble to be prepared for, martial law among the means; the heroes of adjustment above those of the Leap). Made public: 1996. The order: after [[cal.1962-05-11.china-leadership-3]], [[w.yang-shangkun-riji]], II, 169 (Liu sums up last, and the conference ends). To check: [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 72–73 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 204 n.70); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 70–71 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.74a); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 446–47 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 205 n.74b); [[w.shaoqi-liu-shaoqi-xuanji-selected]], 444–46, 445 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 208 n.89). Names: Liu Shaoqi. Check: the day; the book gives the four Standing Committee members'' speeches as the last day.'
