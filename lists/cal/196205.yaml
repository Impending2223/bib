  - id: cal.1962-05-07.china-leadership-2
    when: May 7
    date: '1962-05-07'
    thread: china-retreat-1962
    c: The Finance and Economics Small Group's report to the work conference puts 1961 grain output at 142.5 million tons, 42.5 million below 1957, and rural grain per head at 150 kg;{1} finds a four-year deficit of over 25 billion yuan and 41.7 million urban workers, 17.2 million above 1957;{2} and holds that Sichuan and Heilongjiang are now deficit provinces, with 4 million tons of grain to be imported.{3} It proposes overall balance, a cut in industry to help agriculture, and a revised 1962 plan with capital construction down almost a quarter, to 4.6 billion yuan.{4}
