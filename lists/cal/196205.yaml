  - id: cal.1962-05-01.soviet-union
    when: May 1
    date: '1962-05-01'
    place: washington
    thread: soviet-union
    c: 'The Soviet Embassy. Salinger lunches with the new ambassador, Dobrynin, four days before leaving for Moscow. Dobrynin: Khrushchev''s letters to Kennedy will now go through him, not Bolshakov and Salinger; he wants the widest relationship with Americans in and out of government. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 220–21. Check: the day ("four days before my departure" on May 5). Names: Dobrynin, Salinger, Khrushchev, Kennedy, Bolshakov.'
    tags: [name:salinger-pierre, name:dobrynin-anatoly, name:khrushchev-nikita-s, name:kennedy-john-f, name:bolshakov-georgi]
  - id: cal.1962-05-01.china-leadership
    when: May 1
    date: '1962-05-01'
    place: peking
    thread: china-mao
    c: 'Peking.{1} Mao reads the revised first part of the Central Finance Group''s draft report, with Zhou Enlai''s changes: closer to the facts, a base for the Center''s small meeting with the regional secretaries in early May.{2} Afternoon, Yinian Tang: the Standing Committee takes up the first part, Mao agreeing to the report''s line.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 1, 1962; [[w.mao-zedong-zhuan]], V, ch. 69 n.46 (May 1: Mao finishes the report''s first part and writes his comment, "closer to the facts", as a base for the small Central meeting of early May; he leaves Peking south the next day, May 2, to return July 6). [[w.zhu-de-nianpu-xinbian]], III, 1836 (May 1, 1962; Zhu De 朱德 at the meeting at the Yinian Tang 颐年堂 at 5 p.m.). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 69). To check: Mao Zedong 毛泽东, comment on Zhou Enlai''s letter (manuscript 手稿), May 1, 1962: the report "closer to the facts", a base for the small meeting of early May (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.46). Names: Mao Zedong, Zhou Enlai.'
    src:
      c: 2ea5704e
      rows:
        - 'w.zedong-mao-zedong-nianpu V, May 1, 1962: 1, 2, 3'
        - 'w.mao-zedong-zhuan V, ch. 69 n.46: 2'
