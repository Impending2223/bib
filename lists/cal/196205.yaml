  - id: cal.1962-05-24.china-leadership
    when: May 24
    date: '1962-05-24'
    thread: china-zhou
    c: 'Zhou Enlai to the meeting of non-Party heads in the government''s departments, explaining the decision on further cutting staff and the urban population: the figures were raised to lighten the farm''s load for the cities, ease the pressure on agriculture and the strain on supplies. Those who see only the gains and push the faults aside, and those who see so many faults they lose heart, are both wrong; if the whole Party, the democratic parties and the people stir with one heart there is no difficulty that cannot be overcome.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 480 (May 24, 1962). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1962-05-24.china-leadership-2
    when: May 24
    date: '1962-05-24'
    thread: china-famine
    c: 'Deng Zihui, director of the Central Committee''s Rural Work Department, reports to the Center and Mao on problems in the communes: low attendance and efficiency, egalitarianism, cadre privileges; individual operation, in some form, is practised by 20 percent of peasant households, 60 percent in some xian.{1} He asks that the land-reform settlement be the baseline for returning property, a law holding the rural settlement for thirty years, and a national grain procurement target of 35 million tons for three to five years.{2}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 226–29, 231–32. Made public: 1997. To check: [[w.nongye-jitihua-zhongyao-wenjian]], 567–76 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 227 n.79a); [[w.nongye-jitihua-zhongyao-wenjian]], 567 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 227 n.81a); [[w.nongye-jitihua-zhongyao-wenjian]], 567–69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 228 n.82a); [[w.nongye-jitihua-zhongyao-wenjian]], 574–75 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 231 n.91a). Names: Mao Zedong, Deng Zihui.'
