  - id: cal.1962-05-11.soviet-union
    when: May 11–13
    date: '1962-05-11'
    thread: soviet-union
    c: 'Salinger in Moscow on exchanges of information, a television exchange among them. Met at the airport by Thompson: Khrushchev wants to see him. May 12–13, with Khrushchev and Adzhubei at a dacha outside Moscow. Bundy''s instructions, May 12: no impression of substantive talks; the meetings at the Chairman''s initiative.'
    n: 'FRUS 1961–63, V, docs. [193](https://history.state.gov/historicaldocuments/frus1961-63v05/d193), [195](https://history.state.gov/historicaldocuments/frus1961-63v05/d195), [196](https://history.state.gov/historicaldocuments/frus1961-63v05/d196). [[w.salinger-with-kennedy]], 222–237. See [[cal.1962-01-30.soviet-union]]. Names: Salinger, Thompson, Bundy, Khrushchev, Adzhubei.'
    tags: [name:salinger-pierre, name:thompson-llewellyn-e, name:bundy-mcgeorge, name:khrushchev-nikita-s, name:adzhubei-aleksei]
  - id: cal.1962-05-12.laos
    when: May 12
    date: '1962-05-12'
    thread: laos
    c: 'The White House, 10:30 a.m.: Kennedy with Rusk, McNamara, Gilpatric, Harriman, Lemnitzer, Taylor and others; McNamara and Lemnitzer report on Thailand, South Vietnam and Laos after Nam Tha. 4:30 p.m.: Rusk would "reinvigorate the deterrent"; McNamara''s plan sends the Valley Forge and the Hancock toward Bangkok. Kennedy approves "only precautionary dispositions," no landing in Thailand yet.'
    n: '[FRUS 1961–63, XXIV, doc. 357](https://history.state.gov/historicaldocuments/frus1961-63v24/d357) (Forrestal''s memorandum, drafted May 23). [[w.anthony-war-in-northern-laos]], 68 (the meeting and the reports). To check: Hist, CINCPAC, 1962, p 214 (cited by [[w.anthony-war-in-northern-laos]], 68 n.34). See [[cal.1962-05-06.laos]]. Names: Kennedy, Rusk, McNamara, Gilpatric, Harriman, Lemnitzer, Taylor. Check: Kennedy''s appointment book has him leave for Milwaukee at 3:41 p.m. (doc. 357 n.1); the memorandum has him approve at the 4:30 meeting.'
    src:
