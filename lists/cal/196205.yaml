    place: washington
    thread: republican-party-congress
    also: [jobs-and-wages]
    c: 'The Senate Republican Policy Committee and the members of the conference present resolve unanimously to oppose the financing of the standby public works bill as reported: provisions that "set a dangerous precedent and strike at the financial stability of institutions in which the American public has great faith and confidence."{1} Hickenlooper puts the statement in the Record May 2.{2}'
