  - id: cal.1962-05-07.robert-kennedy
    when: May 7
    date: '1962-05-07'
    thread: robert-kennedy
    also: [cuba, crime-and-hijacking-maheu]
    c: 'Robert Kennedy, at his request, briefed by Lawrence Houston, the CIA''s General Counsel, and Sheffield Edwards, its Director of Security, on the Agency''s use of Giancana and Rosselli, through Maheu, to kill Castro: described as ended in May 1961.{1} In April Harvey had given Rosselli poison pills. Kennedy, by Houston''s account: if the Agency was "going to get involved with Mafia personnel again he wanted to be informed first." May 9, he tells Hoover;{2} Hoover''s record, May 10: the CIA "could not afford to have any action taken against Giancana and Maheu." No one is prosecuted for the tap.{3}'
    n: '[S. Rep. No. 94-465, 131–34 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=142) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 493–94 (the briefing, the pills, Kennedy''s words by Houston''s account, his telling Hoover); [[w.shesol-mutual-contempt]], 128–29 (Robert Kennedy learns of the plots, May 7; May 9, his order to the CIA); [[w.thomas-robert-kennedy]], 171 (Edwards and Houston at his office; the $150,000 contract; the operation said to be ended; Edwards: briefed "all the way"); [[w.reeves-president-kennedy]], 292 (Houston alone named; the schemes described as ended). To check: [[w.thomas-very-best-men]]; [[w.powers-man-who-kept-the]]. See [[cal.1962-03-28.crime-and-hijacking]]; [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy, Houston, Rosselli, Maheu, Edwards, Giancana, Harvey, Hoover, Castro.'
