  - id: cal.1962-05-13.laos
    when: May 13
    date: '1962-05-13'
    thread: laos
    c: McCone, McNamara and Lemnitzer with Eisenhower on Laos, Vietnam and Thailand. If Laos is lost, South Vietnam and Thailand will follow; the forces for Thailand approved; Laos to be partitioned if it can be; no American combat troops into Laos now. He will try to keep his party's leaders out of public debate.
    n: '[FRUS 1961–63, XXIV, doc. 363](https://history.state.gov/historicaldocuments/frus1961-63v24/d363) (McCone''s memorandum). [[w.johns-vietnams-second-front]], 27 (the briefing). To check: [[w.rust-kennedy-in-vietnam]], 75 (cited by [[w.johns-vietnams-second-front]], 27 n.66). See [[cal.1962-05-12.laos]]. Names: McCone, McNamara, Lemnitzer, Eisenhower. Check: Johns, 27, from Rust, has Eisenhower support whatever the President decides, neutralization included; McCone''s memorandum has him for partition.'
    src:
