entries:
  - id: cal.1962-05-01.alabama-al
    when: May 1
    date: '1962-05-01'
    thread: alabama
    also: [governors, elections-1962]
    c: 'Alabama''s Democratic primary for governor: Wallace over DeGraffenried, 207,062 to 160,704, 32.5 percent; Folsom 159,640, 25.1 percent; Attorney General MacDonald Gallion 80,374, 12.6 percent; Connor 23,019, 3.6 percent; Lieutenant Governor Boutwell 862, 0.1 percent. Runoff between Wallace and DeGraffenried. Hill renominated for the Senate over two, 363,613 to 129,677, 73.7 percent.'
    n: '[*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), 736](https://archive.org/details/alabama-official-statistical-register-1963/page/n735)–[737](https://archive.org/details/alabama-official-statistical-register-1963/page/n736); Boutwell''s total, not printed there, from [Wikipedia, "1962 Alabama gubernatorial election"](https://en.wikipedia.org/wiki/1962_Alabama_gubernatorial_election) (Check). Votes: [Wikipedia, "1962 Alabama gubernatorial election"](https://en.wikipedia.org/wiki/1962_Alabama_gubernatorial_election) and [Wikipedia, "1962 United States Senate election in Alabama"](https://en.wikipedia.org/wiki/1962_United_States_Senate_election_in_Alabama), from the Register. To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-politics-and-the]]; [[w.bartley-southern-elections]]; [[w.peirce-deep-south-states-of]]. Names: Wallace, DeGraffenried, Folsom, Gallion, Connor, Boutwell, Hill.'
    tags: [state:al, name:wallace-george-c, name:degraffenried-ryan, name:folsom-james-e, name:gallion-macdonald, name:connor-eugene, name:boutwell-albert, name:hill-lister]
  - id: cal.1962-05-01.governors-ok
    when: May 1
    date: '1962-05-01'
    thread: governors
    also: [elections-1962]
    c: 'Oklahoma primaries for governor. Democratic: Raymond Gary, governor 1955–59, over W. P. Bill Atkinson, 176,525 to 91,182, 33.0 percent; Preston Moore 85,248, 15.9 percent; Lieutenant Governor George Nigh 84,404, 15.7 percent; State Senator Fred Harris 78,476, 14.6 percent; runoff between Gary and Atkinson. Republican: Henry Bellmon, a former State Republican chairman, over one other, 56,560 to 5,313, 91.4 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 26](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=26), [p. 30](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=30). To check: [[w.bellmon-life-and-times-of]]; [[w.harris-potomac-fever]]; [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. Names: Gary, Atkinson, Moore, Nigh, Harris, Bellmon.'
    tags: [state:ok, name:gary-raymond, name:atkinson-w-p-bill, name:moore-preston-j, name:nigh-george, name:harris-fred-r, name:bellmon-henry]
  - id: cal.1962-05-01.state-constitutions-ok
    when: May 1
    date: '1962-05-01'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Oklahoma, with the primary: towns and counties may issue bonds, with their taxpayers'' consent, to secure industry, adopted, 263,850 to 195,020, 57.5 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 31](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=31). See [[cal.1960-07-26.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1962-05-01.vietnam
    when: May 1
    date: '1962-05-01'
    thread: vietnam
    c: 'Ball''s speech on Vietnam: the fall of the South "a loss of tragic significance" to the free world in Asia; the Herald Tribune reads it as a commitment now "irrevocable." Kennedy asks how it was cleared; Bundy to Kennedy: "a tone and content that we would not have cleared."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 709. [[w.selverstone-kennedy-withdrawal]], 69–70 (the Herald Tribune''s reading; Kennedy disturbed). To check: Ball to McGeorge Bundy, May 1, 1962; Bundy to Kennedy, May 1, 1962, JFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 709 n.42). Check: the speech''s day and place: Selverstone gives Apr. 30, the Economic Club of Detroit (69). Names: Ball, John F. Kennedy, Bundy.'
    src:
      c: 4335b17c
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 709: all'
        - 'via w.schlesinger-robert-kennedy-and-his 709 n.42: C'
        - 'w.selverstone-kennedy-withdrawal 69–70: B-C'
        - 'via w.selverstone-kennedy-withdrawal 70 n.85: C'
    tags: [name:ball-george-w, name:kennedy-john-f, name:bundy-mcgeorge]
  - id: cal.1962-05-01.congress
    when: May 1
    date: '1962-05-01'
    thread: congress
    also: [foreign-aid]
    c: 'Kennedy to Porter Hardy, chairman of a House subcommittee on foreign operations, after State again withholds foreign aid records: State to give the committee everything pertinent but personnel files, and those "for your eyes only as Chairman."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 382. To check: Kennedy to Hardy, May 1, 1962, JFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 382 n.54). Names: Kennedy, Hardy.'
