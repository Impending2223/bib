  - id: cal.1962-05-06.opinion
    when: May 6
    date: '1962-05-06'
    thread: opinion
    also: [press-and-broadcasting]
    c: 'Gallup, Apr. 6–11: nearly three adults in four have seen or heard one of Kennedy''s press conferences in six months. Of them, 91 percent favorable to his handling of himself, 4 unfavorable.'
    n: '[[w.gallup-poll]], III, 1765.'
    tags: [name:kennedy-john-f]
  - id: cal.1962-05-07.robert-kennedy
    when: May 7
    date: '1962-05-07'
    thread: robert-kennedy
    also: [cuba, crime-and-hijacking-maheu]
    c: 'Robert Kennedy, at his request, briefed by Lawrence Houston, the CIA''s General Counsel, and Sheffield Edwards, its Director of Security, on the Agency''s use of Giancana and Rosselli, through Maheu, to kill Castro: described as ended in May 1961. In April Harvey had given Rosselli poison pills. Kennedy, by Houston''s account: if the Agency was "going to get involved with Mafia personnel again he wanted to be informed first." May 9, he tells Hoover; Hoover''s record, May 10: the CIA "could not afford to have any action taken against Giancana and Maheu." No one is prosecuted for the tap.'
    n: '[S. Rep. No. 94-465, 131–34 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=142) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 493–94 (the briefing, the pills, Kennedy''s words by Houston''s account, his telling Hoover). To check: [[w.thomas-very-best-men]]; [[w.powers-man-who-kept-the]]; [[w.thomas-robert-kennedy]]. See [[cal.1962-03-28.crime-and-hijacking]]; [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy, Houston, Rosselli, Maheu, Edwards, Giancana, Harvey, Hoover, Castro.'
    src:
      c: 2b25ad9d
      rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=142: all'
        - 'w.schlesinger-robert-kennedy-and-his 493–94: A-D'
        - 'via w.schlesinger-robert-kennedy-and-his 494 n.92: A-D'
    tags: [name:kennedy-robert-f, name:houston-lawrence, name:edwards-sheffield, name:giancana-sam, name:castro-fidel, name:harvey-william-k, name:hoover-j-edgar, name:rosselli-john, name:maheu-robert-a]
