ations-with]], 223–224 (no evidence of Chinese part; Peking believed to let the Pathet Lao–Viet forces through a Chinese salient against Muong Sing, the supplies by the Soviet–North Vietnamese airlifts; Phoumi''s troops not harried in their 120-kilometer retreat to the Mekong at Ban Houei Sai); [[w.fursenko-khrushchevs-cold-war]], 431–32. Check: the day; Reeves, 307, has Nam Tha overrun on May 5, and the American advisers out by helicopter on May 6 (309). Check: FRUS XXIV, doc. 343, has the garrison "moving southwest," not to the Mekong. To check: [[w.rust-so-much-to-lose]]; [[w.castle-at-war-in-the]]; Msgs, AmEmb Vientiane to SECSTATE, 1495, May 6, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27a); 1508, May 7, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27b); 1513, May 8, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27c); CHMAAG Laos to JCS, DA IN 22725, May 6, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27d); DA IN 227338, May 7, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27e); JCS to CINCPAC, 4379, May 6, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27f); AmEmb Vientiane to SECSTATE, 1549, May 12, 1962 (cited by [[w.anthony-war-in-northern-laos]], 67 n.27g); BBC, Summary of World Broadcasts, Far East, SWB/FE/939/C/1 and SWB/FE/940/C/1-2 (May 1962) (cited by [[w.guan-vietnamese-communists-relations-with]], 223 n.90); FO 371/166439, DF 1015/282, 10 May 1962, from the Commonwealth Relations Office to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 223 n.91); FO 371/169802, DF 1011/1, 15 January 1963, from Vientiane to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 224 n.93); FO 371/166441, DF 1015/335, 16 May 1962, from Vientiane to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 224 n.94). See [[cal.1961-03-23.laos]]. Names: Phoumi Nosavan.'
