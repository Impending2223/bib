    c: 'Oklahoma primaries for governor.{1} Democratic: Raymond Gary, governor 1955–59, over W. P. Bill Atkinson, 176,525 to 91,182, 33.0 percent;{2} Preston Moore 85,248, 15.9 percent; Lieutenant Governor George Nigh 84,404, 15.7 percent; State Senator Fred Harris 78,476, 14.6 percent; runoff between Gary and Atkinson. Republican: Henry Bellmon, a former State Republican chairman, over one other, 56,560 to 5,313, 91.4 percent.{3}'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 26](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=26), [p. 30](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=30). [[w.peirce-great-plains-states-of]], 258 (Gary, governor in the 1950s, in the primary). To check: [[w.bellmon-life-and-times-of]]; [[w.harris-potomac-fever]]; [[w.morgan-oklahoma-politics-and-policies]]. Names: Gary, Atkinson, Moore, Nigh, Harris, Bellmon.'
