  - id: cal.1962-05-03.soviet-union
    when: May 3
    date: '1962-05-03'
    thread: soviet-union
    also: [robert-kennedy]
    c: 'The White House, the reception for the diplomatic corps. Kennedy introduces his brother to Dobrynin as "an expert in confidential contacts with the Soviet Union" whom he "ought to know better." A week later, lunch at Robert Kennedy''s house in McLean, Va., politics left aside: the start of their channel. By Dobrynin''s account.'
    n: '[[w.dobrynin-in-confidence]], 62–63. Check: the day of the lunch. Names: Kennedy, Robert Kennedy, Dobrynin.'
    src:
      c: ef556487
      rows:
        - 'w.dobrynin-in-confidence 62–63: all'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:dobrynin-anatoly]
  - id: cal.1962-05-04.europe-and-the-alliance
    when: May 4–6
    date: '1962-05-04'
    thread: europe-and-the-alliance
    c: 'Athens, the NATO ministers. McNamara, May 5, sets out American nuclear strategy to the allies in restricted session. Guidelines on consultation before the use of nuclear weapons agreed, Italy''s objection settled. Apr. 18, NSAM 147: Polaris submarines to be committed to NATO, as promised at Ottawa; a multilateral MRBM force not to be offered unasked.'
    n: 'FRUS 1961–63, XIII, docs. [135](https://history.state.gov/historicaldocuments/frus1961-63v13/d135) (NSAM 147), [136](https://history.state.gov/historicaldocuments/frus1961-63v13/d136) (Rusk to Kennedy, May 6); VIII, doc. [82](https://history.state.gov/historicaldocuments/frus1961-63v08/d82) (McNamara''s address, May 5, excerpts). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 305–08 (McNamara''s address); [[w.poole-joint-chiefs-of-staff]], 198 (Athens; McNamara''s remarks; the program approved). To check: [[w.kaplan-wizards-of-armageddon]]; [[w.stromseth-origins-of-flexible-response]]; [[w.trachtenberg-constructed-peace]]; the address in full, William Bundy to the service secretaries, May 10, 1962, Policy Planning Staff files, RG 59 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 307 n.42); "Remarks by Secretary McNamara, NATO Ministerial Meeting, 5 May 1962," JMF 9050/5410 (23 Mar 62) sec. 1 (cited by [[w.poole-joint-chiefs-of-staff]], 198 n.49). See [[cal.1961-05-17.europe-and-the-alliance]]. Names: McNamara, Rusk.'
