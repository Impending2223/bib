        - 'via w.branch-parting-the-waters 586 n.2: all'
    tags: [name:levison-stanley-d, name:king-martin-luther-jr, name:mcclellan-john-l]
  - id: cal.1962-05-02.court
    when: May 2
    date: '1962-05-02'
    thread: court
    also: [voting-rights]
    c: 'Eastland in the Senate, in the literacy-test filibuster, against the Supreme Court: "The court must be restricted." His box scores of its cases on communism and subversion: Black for the "Communist" position in all 102; Warren and Brennan in most.'
    n: '[108 Cong. Rec. 7599–7607](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt6/pdf/GPO-CRECB-1962-pt6-6-2.pdf#page=57) (May 2, 1962). [[w.mann-walls-of-jericho]], 323–24. To check: Time, May 18, 1962 (cited by [[w.mann-walls-of-jericho]], 323). See [[cal.1962-04-24.voting-rights]]. Names: Eastland, Hugo Black, Warren, Brennan.'
