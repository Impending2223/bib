  - id: cal.1962-05-01.vietnam-2
    when: May 1
    date: '1962-05-01'
    thread: vietnam
    c: 'The White House, 11 a.m. Kennedy with Gilpatric, Decker, Taylor, Bundy, Forrestal, Harriman, Hilsman and others: Laos; Hilsman on the war; defoliants. Galbraith''s neutralized coalition for South Vietnam: Harriman and Hilsman against it; Kennedy decides against it.'
    n: '[FRUS 1961–63, II, doc. 176](https://history.state.gov/historicaldocuments/frus1961-63v02/d176) (Hilsman''s draft memorandum). [[w.selverstone-kennedy-withdrawal]], 66–67 (the neutralization set aside). Made public: FRUS 1961–63, II (1990). [[w.preston-war-council]], 111 (Hilsman and Harriman "vigorously opposed" Galbraith''s recommendations). See [[cal.1962-04-06.vietnam]]. Names: Kennedy, Gilpatric, Decker, Taylor, Bundy, Forrestal, Harriman, Hilsman, Galbraith.'
    src:
      c: 302b6b02
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d176: all'
