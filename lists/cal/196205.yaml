    when: May 23
    date: '1962-05-23'
    thread: china-liu
    also: [china-political-legal]
    c: Liu Shaoqi invites the members of the Central Committee's political and legal small group to talk about drafting the "Summing-up report on political and legal work since 1958." The chief lesson in these years of political-legal work is mixing two contradictions of different nature, mainly taking our own for enemies and striking too wide; the two kinds of contradiction must be distinguished strictly, and so must the two methods of handling them; most of the errors lay in handling contradictions among the people by the method for enemies, in the Party and government, including the Kuomintang-style handling of Party problems, which sharpens contradictions and may split. The public security organs, the procuracy and the courts are organs of dictatorship over enemies, and for the people are to be organs for handling contradictions among the people. Independent trial by the courts is right and constitutional; the Party committee and government should not meddle in their cases; if a local committee's decision clashes with law and the Center's policy, obey the law and the Center's policy. The talk is in his Selected Works as "Political and legal work and the correct handling of contradictions among the people."
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 556 (May 23, 1962); [[w.peng-zhen-nianpu-1902]], IV, 197 (May 23, 1962; Peng Zhen at Liu Shaoqi''s meeting with the political and legal group; Peng: the lesson of these years the failure to keep the two kinds of contradiction apart; public security, procuracy and courts each to its duty, under the law). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
