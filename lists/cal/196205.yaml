    c: 'Mao, on the Center''s draft directive forwarding the Central Finance and Economic Group''s 中央财经小组 report of Apr. 30, "On discussing the adjusted plan for 1962," sent him by Zhou Enlai 周恩来 with a letter of May 19: "Back to the Premier; do as proposed."{1} The Finance Group''s plan lowers 1962''s gross industrial and farm output from 140 billion yuan to 130 billion.{2}'
    n: '[[w.jianguo-yilai-mao-zedong]], XVI, 290–292 (May 24, 1962; Mao''s note of May 24; printed from the manuscript; note 1: the draft (the Standing Committee''s Central Work Conference of May 7–11 agreed with the report; its spirit to be passed on by word of mouth to county first secretaries and up; the main work to cut the industrial front, staff and urban population, and to strengthen the production teams; the plan''s gross output of industry and farming lowered from 140 to 130 billion yuan); issued by the Center May 26 as Zhongfa [62] 254 to the ministries'' Party groups and the provincial committees; note 2: Zhou''s letter of May 19 by way of Li Fuchun: if Mao has no time, the directive first, Tian Jiaying or Lin Ke to tell him the report; Mao had agreed to the course at the Standing Committee on May 1); [[w.mao-zedong-zhuan]], V, ch. 69 n.52 (May 24: Mao reads both papers and writes "Return to the Premier, carry it out"). [[w.jianguo-yilai-mao-zedong]], XVI, 291 n.1. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 69); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Central Committee, draft directive forwarding the Central Finance and Economic Group''s report on discussing the adjusted plan for 1962 (May 1962) (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 290 n.1a); Central Finance and Economic Group, report "On discussing the adjusted plan for 1962," Apr. 30, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 290 n.1b); Zhou Enlai, letter of May 19, 1962 sending the Finance Group''s report and the draft directive to Li Fuchun and then to Mao Zedong (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 292 n.2); Mao Zedong 毛泽东, note on the draft directive forwarding the Central Finance Group''s report (manuscript 手稿), May 24, 1962: "return to the Premier, carry it out" (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.52). See [[cal.1962-05-19.china