# Cal. XLV February 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLV
entries:
  - id: cal.1964-02-01.transition-and-staff
    when: Feb. 1
    date: '1964-02-01'
    thread: transition-and-staff
    also: [poverty]
    c: 'News conference. Shriver, back from a world trip, to organize the war on poverty as Special Assistant to the President, keeping the Peace Corps; a Cabinet committee to advise him. His letter of appointment, Feb. 12: he directs the departments in the program and speaks for it to Congress.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1048) (Feb. 1, 1964); [Letter to Sargent Shriver on His Appointment To Direct the Program To Eliminate Poverty](https://www.presidency.ucsb.edu/documents/letter-sargent-shriver-his-appointment-direct-the-program-eliminate-poverty) (Feb. 12, 1964). Gillette, *Launching the War on Poverty* (K–J Adm. II.B). Stossel, *Sarge* (K–J Adm. II.G.5). See [[cal.1964-01-08.program]]. The message: [[cal.1964-03-16.poverty]]. Names: Johnson (K–J Adm. III.D); Shriver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1964-02-02.cuba
    when: Feb. 2–7
    date: '1964-02-02'
    thread: cuba
    c: 'Guantanamo. Feb. 2, the Coast Guard takes four Cuban fishing boats inside American waters off the Dry Tortugas; the crews held at Key West, Florida asking to prosecute them. Feb. 6, Cuba cuts off the base''s water. Feb. 7, statement: the base to be self-sufficient, water by ship and from the sea; Cuban workers cut. Johnson at UCLA, Feb. 21: better "to send an admiral to cut the water off than to send a battalion of Marines to turn it back on."'
    n: '[White House Statement Declaring United States Determination To Guarantee the Security of the Naval Base at Guantanamo](https://www.presidency.ucsb.edu/documents/white-house-statement-declaring-united-states-determination-guarantee-the-security-the) (Feb. 7, 1964); [Remarks at the 96th Charter Day Observance of the University of California at Los Angeles](https://www.presidency.ucsb.edu/documents/remarks-the-96th-charter-day-observance-the-university-california-los-angeles) (Feb. 21, 1964). FRUS 1964–68, XXXII, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v32/d228), [229](https://history.state.gov/historicaldocuments/frus1964-68v32/d229). LeoGrande & Kornbluh, *Back Channel to Cuba*; Bohning, *The Castro Obsession* (K–J Adm. II.D). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-02.opinion
    when: Feb. 2
    date: '1964-02-02'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Jan. 2–7: a law giving all persons, Negro and white, the right to be served in hotels, restaurants, theaters, and the like, 61 percent for, 31 against. Whites outside the South 71 for; Southern whites 20 for, 72 against.'
    n: '*The Gallup Poll*, III, 1863 (K–J Cong. II.E).'
  - id: cal.1964-02-03.assassination
    when: Feb. 3
    date: '1964-02-03'
    thread: assassination
    c: 'The Warren Commission takes its first testimony: Marina Oswald, the first witness. 552 witnesses in all, 94 heard by the members themselves; hearings closed unless a witness asked otherwise.'
    n: '[*Report of the President''s Commission on the Assassination of President Kennedy*, Foreword](https://www.archives.gov/research/jfk/warren-commission-report/foreword.html) (K–J Adm. II.H.3). *Hearings Before the President''s Commission on the Assassination of President Kennedy*, vol. I (1964). Willens, *History Will Prove Us Right*; McKnight, *Breach of Trust*; Shenon, *A Cruel and Shocking Act* (K–J Adm. II.F). See [[cal.1963-11-29.assassination]]; [[cal.1963-12-05.assassination]]. Names: Marina Oswald (K–J Cong. III.K); Warren (K–J Cong. III.G).'
    tags: [name:oswald-marina, name:warren-earl]
  - id: cal.1964-02-03.desegregation-schools
    when: Feb. 3
    date: '1964-02-03'
    thread: desegregation-schools
    c: New York. A one-day boycott of the city's schools against their segregation, called by Galamison's Citywide Committee for Integrated Schools, backed by CORE and the NAACP. Some 464,000 pupils out, about 45 percent. Check the count.
    n: 'Taylor, *Knocking at Our Own Door* (K–J Cong. II.F). Names: Galamison (K–J Cong. III.K).'
    tags: [name:galamison-milton-a]
  - id: cal.1964-02-03.alabama
    when: Feb. 3–18
    date: '1964-02-03'
    thread: alabama
    also: [desegregation-schools]
    c: Tuskegee. On the State Board of Education's order, Wallace its president ex officio, Tuskegee High closed above the seventh grade, Feb. 3; its twelve pupils, all Black, left to go back to Tuskegee Institute High. Judge Johnson orders them admitted to the white high schools at Shorter and Notasulga. Feb. 4, the State board "deplores the order of Judge Johnson" and directs tuition grants. Feb. 5, Notasulga's mayor turns six away under new town ordinances; the white pupils leave both schools. Feb. 14, Johnson enjoins the mayor. Feb. 18, the justices of the Alabama Supreme Court, asked by Wallace, advise that no State law authorized the board's orders.
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/html/0743-01.html) (M.D. Ala. 1964) (the three-judge court''s findings, July 13); *United States v. Rea*, [231 F. Supp. 772](https://static.case.law/f-supp/231/html/0772-01.html) (M.D. Ala. 1964). Bass, *Taming the Storm* (K–J Cong. II.G). See [[cal.1963-09-02.alabama]]. Names: Wallace (K–J Cong. III.F); Johnson (K–J Cong. III.G).'
    tags: [name:wallace-george-c, name:johnson-frank-m-jr]
  - id: cal.1964-02-05.program
    when: Feb. 5
    date: '1964-02-05'
    thread: program
    c: Consumer message. Truth in packaging and in lending; warning labels on drugs, cosmetics, and pressurized containers; inspection of all meat and poultry, intrastate too; no pesticide registered "under protest"; temporary cease-and-desist orders for the FTC. Peterson, Special Assistant for Consumer Affairs since Jan. 3, to lead.
    n: '[Special Message to the Congress on Consumer Interests](https://www.presidency.ucsb.edu/documents/special-message-the-congress-consumer-interests) (Feb. 5, 1964); [Statement by the President Upon Establishing the President''s Committee on Consumer Interests](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-establishing-the-presidents-committee-consumer-interests) (Jan. 3, 1964). Peterson, *Restless* (K–J Adm. II.G.5). See [[cal.1962-03-15.program]]. Names: Johnson (K–J Adm. III.D); Peterson (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:peterson-esther]
  - id: cal.1964-02-07.economy
    when: Feb. 7
    date: '1964-02-07'
    thread: economy
    c: 'Senate passes the tax bill, [77–21](https://voteview.com/rollcall/RS0880264): Democrats 56–11, Republicans 21–10. Long reported it for the Finance Committee Jan. 28. Ribicoff''s credit for college costs lost, [45–48](https://voteview.com/rollcall/RS0880242); cuts in the oil depletion allowance lost, [33–61](https://voteview.com/rollcall/RS0880254) and [35–57](https://voteview.com/rollcall/RS0880256).'
    n: '[110 Cong. Rec., Senate, Feb. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-8-1.pdf); [110 Cong. Rec., Senate, Jan. 28, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-14-2.pdf) (S. Rep. No. 88-830). [Statement by the President Following Senate Committee Action on the Tax Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-committee-action-the-tax-bill) (Jan. 24, 1964); [Statement by the President Following Senate Approval of the Tax Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-approval-the-tax-bill) (Feb. 7, 1964). Zelizer, *Taxing America* (K–J Cong. II.B). Mann, *Legacy to Power*; Heinemann, *Harry Byrd of Virginia* (K–J Cong. II.I.1). See [[cal.1963-09-25.economy]]; [[cal.1963-12-07.economy]]. Names: Long (K–J Cong. III.A); Ribicoff (K–J Adm. III.G).'
    tags: [name:long-russell-b, name:ribicoff-abraham]
  - id: cal.1964-02-08.women
    when: Feb. 8
    date: '1964-02-08'
    thread: women
    also: [civil-rights-bill]
    c: 'House, in Committee of the Whole on the civil rights bill: Smith of Virginia moves to add "sex" to Title VII''s ban on discrimination in employment. Celler opposes; Griffiths speaks for it and demands tellers. Adopted, 168–133.'
    n: '[110 Cong. Rec., House, Feb. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-9-1.pdf). Harrison, *On Account of Sex* (K–J Adm. II.B). Whalen, *The Longest Debate* (K–J Cong. II.C). Dierenfield, *Keeper of the Rules* (K–J Cong. II.I.2). See [[cal.1963-10-11.program]]; [[cal.1964-01-09.civil-rights-bill]]. Names: Smith, Celler, Griffiths (K–J Cong. III.D).'
    tags: [name:smith-howard-w, name:celler-emanuel, name:griffiths-martha-w]
  - id: cal.1964-02-10.civil-rights-bill
    when: Feb. 10
    date: '1964-02-10'
    thread: civil-rights-bill
    c: 'House passes the civil rights bill, H.R. 7152, [290–130](https://voteview.com/rollcall/RH0880128): Democrats 152–96, Republicans 138–34; Southern Democrats 7–86. Nine days on the floor, Celler and McCulloch managing; "sex" in Title VII among the amendments adopted. To the Senate.'
    n: '[110 Cong. Rec., House, Feb. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-10-2.pdf). Civil Rights Act of 1964 (K–J Cong. II.J.2). Berman, *A Bill Becomes a Law*; Whalen, *The Longest Debate*; Loevy, *To End All Segregation*; Mann, *The Walls of Jericho*; Loevy ed., *The Civil Rights Act of 1964*; Finley, *Delaying the Dream*; Risen, *The Bill of the Century*; Purdum, *An Idea Whose Time Has Come* (K–J Cong. II.C). Rosenberg & Karabell, *Kennedy, Johnson, and the Quest for Justice* (K–J Adm. II.J). Caro, *The Passage of Power* (K–J Adm. II.F). Humphrey, *The Education of a Public Man*; Fite, *Richard B. Russell, Jr.*; Oberdorfer, *Senator Mansfield* (K–J Cong. II.I.1). MacNeil, *Dirksen*; Hulsey, *Everett Dirksen and His Presidents* (Opp. II.D). See [[cal.1963-10-29.civil-rights-bill]]; [[cal.1964-01-09.civil-rights-bill]]. Names: Celler (K–J Cong. III.D); McCulloch (K–J Cong. III.E).'
    tags: [name:celler-emanuel, name:mcculloch-william-m]
  - id: cal.1964-02-10.medicare
    when: Feb. 10
    date: '1964-02-10'
    thread: medicare
    also: [health]
    c: 'Health message. Hospital insurance for everyone 65 and over through Social Security: a quarter of one percent more from employers and from employees, the wage base from $4,800 to $5,200, about a dollar a month for the average worker; those outside Social Security covered from general funds. Hill-Burton extended five years.'
    n: '[Special Message to the Congress on the Nation''s Health](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-nations-health) (Feb. 10, 1964). See [[cal.1963-02-21.medicare]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-11.school-aid
    when: Feb. 11
    date: '1964-02-11'
    thread: school-aid
    c: 'Library Services and Construction Act signed, [78 Stat. 11](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg11.pdf): aid to city libraries as well as rural, and grants for building. House passage Jan. 21, [254–107](https://voteview.com/rollcall/RH0880124), after Frelinghuysen''s amendment to strike the building and city aid lost, [179–183](https://voteview.com/rollcall/RH0880122).'
    n: '[Remarks Upon Signing Bill Amending the Library Services Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-amending-the-library-services-act) (Feb. 11, 1964). [110 Cong. Rec., House, Jan. 21, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-10-1.pdf). Graham, *The Uncertain Triumph* (K–J Adm. II.B). See [[cal.1963-12-18.school-aid]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:frelinghuysen-peter-h-jr]
  - id: cal.1964-02-12.opinion
    when: Feb. 12
    date: '1964-02-12'
    thread: opinion
    also: [latin-america]
    c: 'Gallup, Jan. 31–Feb. 5: 64 percent have followed the dispute with Panama over the Canal Zone. Of them: a firm policy, no concessions, 45 percent; firm, but better relations, 11; concessions (more rent, a new treaty, the Canal to Panama), 9; no opinion 23.'
    n: '*The Gallup Poll*, III, 1864 (K–J Cong. II.E).'
  - id: cal.1964-02-14.vietnam
    when: Feb. 14–21
    date: '1964-02-14'
    thread: vietnam
    c: 'NSAM 280: a committee under William Sullivan of State to manage policy in Vietnam, Forrestal for the White House. Feb. 20, Johnson with Rusk, McNamara, Taylor, McCone: contingency planning for pressures against the North speeded up, for "the maximum credible deterrent effect on Hanoi"; American dependents encouraged to go home. Feb. 21, at UCLA: outside direction and supply "a deeply dangerous game."'
    n: '[NSAM No. 280](https://history.state.gov/historicaldocuments/frus1964-68v01/d46) (Feb. 14, 1964); [FRUS 1964–68, I, doc. 54](https://history.state.gov/historicaldocuments/frus1964-68v01/d54). [Remarks at the 96th Charter Day Observance of the University of California at Los Angeles](https://www.presidency.ucsb.edu/documents/remarks-the-96th-charter-day-observance-the-university-california-los-angeles) (Feb. 21, 1964). *The Pentagon Papers* (K–J Adm. II.H.3). Logevall, *Choosing War*; McMaster, *Dereliction of Duty*; Preston, *The War Council* (K–J Adm. II.D). See [[cal.1964-01-30.vietnam]]. Names: Forrestal, Rusk (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F); McCone (K–J Adm. III.I); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:sullivan-william-h, name:forrestal-michael-v, name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a]
  - id: cal.1964-02-16.opinion
    when: Feb. 16
    date: '1964-02-16'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Jan. 30–Feb. 5: Republicans'' choice for 1964: Nixon 31, Goldwater 20, Rockefeller 16, Lodge 12, Scranton 7, Romney 5; others, no preference 9. Independents: Nixon 29, Goldwater 18, Lodge 18, Rockefeller 16.'
    n: '*The Gallup Poll*, III, 1864–65 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-02-17.court
    when: Feb. 17
    date: '1964-02-17'
    thread: court
    c: '*Wesberry v. Sanders*, [376 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep376/usrep376001/usrep376001.pdf). Art. I, § 2: one man''s vote in a congressional election to be worth as much as another''s, "as nearly as is practicable." Georgia''s Fifth, Atlanta, 823,680 people; the Ninth, 272,154. Black for six; Harlan dissents, Stewart with him; Clark in part.'
    n: 'Opinion (K–J Cong. II.J.1; Opp. II.H.1). Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1962-03-26.court]]; [[cal.1963-03-18.court-2]]. Names: Black, Harlan, Stewart, Clark (K–J Cong. III.G).'
    tags: [name:black-hugo-l, name:harlan-john-marshall, name:stewart-potter, name:clark-tom-c]
  - id: cal.1964-02-18.specials
    when: Feb. 18
    date: '1964-02-18'
    thread: specials
    c: California 5th, special. Phillip Burton (D) takes Shelley's seat, 53.6 percent, over Verreos (R), 25.6; six others. Swing 12.8 to R.
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 3, 1964, p. 29](https://archive.org/details/castatem196264cali/page/n178). See [[cal.1961-04-04.states-and-cities]]; [[cal.1964-01-07.congress]]. Names: Burton (Cong. III.E); Verreos (K–J Cong. III.K).'
    tags: [special:1964-02-18-h-CA-5, name:burton-phillip, name:shelley-john-f, name:verreos-nick-a]
  - id: cal.1964-02-19.opinion
    when: Feb. 19
    date: '1964-02-19'
    thread: opinion
    also: [elections-1964, goldwater]
    c: 'Gallup, Jan. 30–Feb. 5: the convention''s choice between Goldwater and Rockefeller: Rockefeller 49, Goldwater 36, undecided 15. Republicans: Goldwater 44, Rockefeller 41. Independents: Rockefeller 48, Goldwater 40.'
    n: '*The Gallup Poll*, III, 1865 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson]
  - id: cal.1964-02-20.trade
    when: Feb. 20–25
    date: '1964-02-20'
    thread: trade
    c: The longshoremen refuse to load wheat for the Soviet Union while less than half goes in American ships; the Maritime Administration had let Continental Grain ship about 38 percent in them. Feb. 24, Johnson's telegram to Meany; Meany intervenes, and the boycott ends.
    n: '[Telegram to the President, AFL-CIO, Concerning the Union Refusal To Load Wheat for Russia](https://www.presidency.ucsb.edu/documents/telegram-the-president-afl-cio-concerning-the-union-refusal-load-wheat-for-russia) (Feb. 25, 1964). See [[cal.1963-10-09.trade]]; [[cal.1963-12-24.foreign-aid]]. Names: Johnson (K–J Adm. III.D); Meany (K–J Cong. III.I).'
    tags: [name:johnson-lyndon-b, name:meany-george]
  - id: cal.1964-02-23.opinion
    when: Feb. 23
    date: '1964-02-23'
    thread: opinion
    c: 'Gallup, Jan. 30–Feb. 2: Johnson''s handling of problems at home, 70 percent approve, 12 disapprove; of foreign policy, 61 approve, 14 disapprove. Republicans 57 and 47 approve.'
    n: '*The Gallup Poll*, III, 1866–67 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-26.economy
    when: Feb. 26
    date: '1964-02-26'
    thread: economy
    c: 'Revenue Act of 1964 signed, [78 Stat. 19](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg19.pdf), Johnson on television: an $11.5 billion cut. Individual rates 14 to 70 percent, from 20 to 91, in two steps, 1964 and 1965; corporate 48, from 52; withholding 14 percent, from 18, in eight days. Conference report, House Feb. 25, [326–83](https://voteview.com/rollcall/RH0880131); Senate Feb. 26, [74–19](https://voteview.com/rollcall/RS0880267).'
    n: 'Statute (K–J Cong. II.J.2). [Radio and Television Remarks Upon Signing the Tax Bill](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-upon-signing-the-tax-bill) (Feb. 26, 1964). [110 Cong. Rec., House, Feb. 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-8-2.pdf); [110 Cong. Rec., Senate, Feb. 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-9-2.pdf). Zelizer, *Taxing America* (K–J Cong. II.B). Stein, *The Fiscal Revolution in America*; Michelmore, *Tax and Spend* (K–J Adm. II.B). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1963-01-24.economy]]; [[cal.1964-02-07.economy]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-26.civil-rights-bill
    when: Feb. 26
    date: '1964-02-26'
    thread: civil-rights-bill
    c: 'Senate. H.R. 7152, read the first time Feb. 17, when Mansfield names Humphrey to manage it on the floor. Feb. 26, at the second reading, Mansfield objects to further proceedings under Rule XIV: the bill to the calendar, not to Eastland''s Judiciary Committee. Metcalf, presiding, overrules Russell''s point of order; Russell''s appeal tabled, [54–37](https://voteview.com/rollcall/RS0880268).'
    n: '[110 Cong. Rec., Senate, Feb. 17, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-2-1.pdf); [110 Cong. Rec., Senate, Feb. 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-9-2.pdf). See [[cal.1964-02-10.civil-rights-bill]]. Names: Mansfield, Humphrey (K–J Cong. III.A); Eastland, Russell (K–J Cong. III.B).'
    tags: [name:mansfield-mike, name:humphrey-hubert-h, name:eastland-james-o, name:metcalf-lee-w, name:russell-richard-b]
  - id: cal.1964-02-26.opinion
    when: Feb. 26
    date: '1964-02-26'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Jan. 30–Feb. 2: the Johnson administration pushing integration too fast, 30 percent; not fast enough, 15; about right, 39. Southern whites 49 too fast; whites outside the South 28.'
    n: '*The Gallup Poll*, III, 1867 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-29.defense
    when: Feb. 29
    date: '1964-02-29'
    thread: defense
    also: [transition-and-staff]
    c: News conference. The A-11, an experimental Lockheed jet flown at more than 2,000 miles an hour and above 70,000 feet, disclosed; its performance classified; begun in 1959. William Bundy to be Assistant Secretary of State for the Far East, McNaughton to take his place at Defense.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1049) (Feb. 29, 1964). See [[cal.1963-10-14.defense]]. Names: Johnson (K–J Adm. III.D); Bundy (K–J Adm. III.E); McNaughton (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:bundy-william, name:mcnaughton-john-t]
  - id: cal.1964-02-29.robert-kennedy
    when: Feb. 29–May 14
    date: '1964-02-29'
    thread: robert-kennedy
    c: 'Robert Kennedy recorded for the Kennedy Library''s oral history by John Bartlow Martin: Feb. 29 and Mar. 1, Apr. 13, Apr. 30, May 14. Later sessions: Anthony Lewis, with Burke Marshall, from Dec. 4; Schlesinger, Feb. 27, 1965. Check the December dates.'
    n: '[Robert F. Kennedy oral history interview, Feb. 29 and Mar. 1, 1964](https://www.jfklibrary.org/asset-viewer/archives/jfkoh-rfk-01) (JFKOH-RFK-01), and JFKOH-RFK-02 to -04, Kennedy Library. *Robert Kennedy in His Own Words* (K–J Adm. II.G.1). Made public: *Robert Kennedy in His Own Words* (Edwin O. Guthman & Jeffrey Shulman eds., 1988). Names: Robert Kennedy (K–J Adm. III.A); Marshall (K–J Adm. III.I); Schlesinger (K–J Adm. III.B).'
    tags: [name:kennedy-robert-f, name:marshall-burke, name:schlesinger-arthur-m-jr]
