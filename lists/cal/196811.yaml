  - id: cal.1968-11-02.vietnam
    when: Nov. 2
    date: '1968-11-02'
    thread: vietnam-paris
    c: 'Saigon. Thiệu to the National Assembly in joint session: his government will not go to the Paris meeting set for Nov. 6; it will talk with Hanoi, not with the NLF as a delegation of its own. Bunker, the same day: Saigon will not come to the substantive meetings until the procedures are agreed, and wants the NLF counted part of Hanoi''s delegation; he urges the first meeting put off.'
    n: 'FRUS 1964–68, VII, docs. [180](https://history.state.gov/historicaldocuments/frus1964-68v07/d180), [182](https://history.state.gov/historicaldocuments/frus1964-68v07/d182). [[w.nguyen-hanois-war]], 129 (Thiệu''s refusal); [[w.zelizer-fierce-urgency-of-now]], 313; [[w.bernstein-guns-or-butter]], 519. Made public: FRUS 1964–68, VII (2003). [[w.clifford-counsel-to-the-president-2]], 594. See [[cal.1968-09-07.vietnam]]. Names: Nguyễn Văn Thiệu, Bunker.'
    src:
      c: 5b2445c3
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d180: all'
