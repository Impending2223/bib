    also: [electoral-college]
    c: 'Nixon elected over Humphrey, 31,783,783 to 31,271,837, 43.4 percent; Wallace (American Independent) 9,910,517, 13.5 percent. Electoral votes as cast Dec. 16: Nixon 301, thirty-two States; Humphrey 191, thirteen States and the District; Wallace 46, Alabama, Arkansas, Georgia, Louisiana and Mississippi, and one North Carolina elector. Agnew Vice President. House 243 D–192 R, from 248–187 at the 90th''s opening. Senate 58 D–42 R, Republicans up five: Goldwater in Arizona; Gurney in Florida; Mathias over Brewster in Maryland; Saxbe in Ohio; Bellmon over Monroney in Oklahoma; Packwood over Morse in Oregon, 408,825 to 405,380, 50.2 percent, a 3,445-vote margin; Schweiker over Clark in Pennsylvania. Democratic gains: Cranston in California, Hughes in Iowa. In New York''s 12th, Shirley Chisholm (D) over Farmer: the first Negro woman elected to Congress.'
    n: '[*Statistics of the Presidential and Congressional Election of November 5, 1968*](https://clerk.house.gov/member_info/electionInfo/1968election.pdf) (Clerk of the House). [[w.nixon-rn]], 330–34, 351 (Nixon over Humphrey; Wallace 13.5 percent); [[w.humphrey-education-of-a-public-1976]], 406 (Nixon 31.8 million, Humphrey and Muskie 31.2 million, Wallace under 10 million); [[w.solberg-hubert-humphrey]], 403–07 (Check: Solberg gives 31,785,480 to 31,270,533); [[w.white-making-of-the-president-1969]], 396–97, 399 (thirty-two States; Humphrey 191; the House 243 Democrats, 192 Republicans; Schweiker over Clark); [[w.zelizer-fierce-urgency-of-now]], 313–14 (43.4, 42.7 and 13.5 percent; 301, 191 and 46 electoral votes; the Senate 57 to 43, the House 243 to 192); [[w.bernstein-guns-or-butter]], 521 (Nixon 31,785,480, Humphrey 31,275,165, Wallace 9,906,473, of 73,359,762; 302, 191 and 46 electoral votes). Telegram to President-Elect Richard M. Nixon, [1968–69 Pub. Papers 1114](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=424); Telegram to Vice President Hubert H. Humphrey, [1968–69 Pub. Papers 1114](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=424) (Nov. 5, 1968, released Nov. 6). FRUS 1964–68, VII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v07/d199). [[w.chester-american-melodrama]], 747 (Nixon''s 43.4 percent). Check: White, 396, gives the Associated Press''s totals: Nixon 31,770,237, 43.40 percent; Humphrey 31,270,533, 42.72; Wallace 9,906,141, 13.53; the Senate, 397, 57 Democrats, 43 Republicans. Check: Bernstein, 521, gives Nixon 31,785,480 and Humphrey 31,275,165. Check: White, by the AP''s "final official totals," gives Nixon 31,770,237 (43.40 percent), Humphrey 31,270,533 (42.72), Wallace 9,906,141 (13.53) ([[w.white-making-of-the-president-1969]], 396). To check: [[w.witcover-year-the-dream-died]]; [[w.gould-1968]]; [[w.nelson-resilient-america]]; [[w.perlstein-nixonland-2008]]; [[w.carter-politics-of-rage-1995]]. See [[cal.1968-08-26.elections-1968]]. Names: Nixon, Humphrey, Wallace, Agnew, Goldwater, Gurney, Mathias, Brewster, Saxbe, Bellmon, Monroney, Packwood, Morse, Schweiker, Clark, Cranston, Hughes, Chisholm, Farmer. Check: Nixon gives 43.3 percent to Humphrey''s 42.6 (351).'
