    c: 'Johnson to Wilson, approved 9:25 p.m.: Fowler to stay in Europe to persuade the Germans to revalue and prevent a large unilateral French devaluation; Bonn proposes border-tax changes instead, which would not do. The aim: about 10 percent up for the mark, 5 percent down for the franc, small moves by Italy and the Netherlands; a meeting of the Ten in Europe, Schweitzer present; London not to move meanwhile.'
