  - id: cal.1968-11-01.vietnam-paris-2
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam-paris
    also: [soviet-union]
    c: 'Dobrynin brings Rusk his own translation of Kosygin''s letter to Johnson: received "with satisfaction," the news of the bombing''s end and of talks with the DRV, the NFLSV, the United States and Saigon; "a great deed has been done." Rusk on its phrase "bombings and other military actions": the DMZ, no attacks on the cities.'
    n: '[FRUS 1964–68, VII, doc. 177](https://history.state.gov/historicaldocuments/frus1964-68v07/d177); [[w.dobrynin-in-confidence]], 191 (Kosygin''s satisfaction). See [[cal.1968-10-31.vietnam-paris-2]]. Names: Dobrynin, Rusk, Kosygin, Johnson.'
    src:
      c: 9ad5e1b2
      rows:
