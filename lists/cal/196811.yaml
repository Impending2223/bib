  - id: cal.1968-11-01.vietnam-operations-2
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam-operations
    c: The Navy's riverine forces open Sea Lords, to deny the Delta's waterways to the enemy and enter his strongholds.
    n: '[[w.cosmas-joint-chiefs-of-staff]], 243. Abrams to his commanders on the halt: "the order of the day is to intensify your offensive" (243). To check: COMUSMACV MAC 17450 to CJCS et al., 230940Z Dec 68, OCJCS File 091 Vietnam Dec 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21); MAC 17719, 301109Z Dec 68, OCJCS File 091 Vietnam Dec 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21); COMUSMACV 42365 to JCS, 160834Z Dec 68, JCS IN 72070. "1968 Year-End Review," II, pp. 3–7 - 3–8, 3–16 - 3–19 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21); NMCC OPSUMs 274-68, 21 Nov 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21); NMCC OPSUMs 290-68, 11 Dec 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21); HQ USARPAC, "Highlights of USARPAC Activities," Dec 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 243 n.21).'
