    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Iowa. Republicans take the Senate, 45 seats to the Democrats' 16, and keep the House, 86 to 38.
    n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Iowa Official Register*, 1969–70. To check: [[w.larew-party-reborn]]. See [[cal.1965-01-11.legislatures-ia]].'
    tags: [state:ia]
  - id: cal.1968-11-05.state-constitutions-il
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    c: Illinois's voters call a constitutional convention, 2,979,972 to 1,135,440, 72.4 percent; a majority of all the ballots cast at the election required, and the call has 63.3 percent of them. The first call put to them since 1934, refused then. The delegates to be elected in 1969.
    n: '[*Official Vote of the State of Illinois*, 1968](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=50), PDF pp. 50–53 (the OCR of the totals unclear here); the figures, [Wikipedia, "1968 Illinois elections"](https://en.wikipedia.org/wiki/1968_Illinois_elections). To check: [[w.peirce-great-lakes-states-of]]. See [[cal.1962-11-06.state-constitutions-il]].'
    tags: [state:il]
  - id: cal.1968-11-05.state-constitutions-ia
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [legislatures, state-legislatures]
    c: 'Iowa''s voters adopt five amendments: the legislature''s apportionment, 469,449 to 263,886, 64.0 percent; its members'' pay, 389,435 to 350,277, 52.6 percent; annual sessions, 394,258 to 366,591, 51.8 percent; the governor''s item veto, 411,472 to 328,273, 55.6 percent; home rule for cities, 486,749 to 256,236, 65.5 percent.'
    n: '[*Iowa Official Register*, 1969–70](https://publications.iowa.gov/41454/1/Iowa%20Official%20Register%201969-1970.pdf#page=362), PDF pp. 362–364 (S.J.R. 8, 10, 4, 2, 1). To check: [[w.peirce-great-plains-states-of]]. See [[cal.1965-01-11.legislatures-ia]].'
    tags: [state:ia]
  - id: cal.1968-11-05.governors
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: 'Twenty-one governors elected: Republicans 13, Democrats 8. Republicans took seven States (Delaware, Illinois, Indiana, Iowa, New Hampshire, Vermont, West Virginia), Democrats two (Montana, Rhode Island). Ogilvie (R) over Governor Shapiro in Illinois; Peterson (R) over Governor Terry in Delaware; Licht (D) over Governor Chafee in Rhode Island; Anderson (D) over Governor Babcock in Montana; Moore (R) in West Virginia; Scott (D) over Gardner (R) in North Carolina; Winthrop Rockefeller (R) re-elected in Arkansas. Governorships after the election: Republicans 31, Democrats 19.'
    n: '[Wikipedia, "1968 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1968_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). To check: [[w.sabato-goodbye-to-good-time]]. See [[cal.1968-11-05.elections-1968]]. Names: Ogilvie, Shapiro, Peterson, Terry, Licht, Chafee, Anderson, Babcock, Moore, Scott, Gardner, Winthrop Rockefeller.'
    tags: [governors:1968-11-05, name:ogilvie-richard-b, name:shapiro-samuel-h, name:peterson-russell-w, name:terry-charles-l-jr, name:licht-frank, name:chafee-john-h, name:anderson-forrest-h, name:babcock-tim-m, name:moore-arch-a-jr, name:scott-robert-w, name:gardner-james-c, name:rockefeller-winthrop]
  - id: cal.1968-11-05.legislatures-us
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: The State legislatures. Republicans take both houses of California, the senates of Delaware, Indiana and Iowa, and the lower houses of New York and Nevada; Democrats take the lower houses of Alaska, Michigan and Pennsylvania; the Tennessee House tied. Republicans gain some 46 senate seats; the lower houses' totals nearly as before. At the 1969 sessions Republicans control 21 legislatures, Democrats 20, eight divided or tied (19, 22 and 8 before).
    n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against the *Book of the States*, 1968–69 and 1970–71). See [[cal.1968-11-05.elections-1968]]; [[cal.1966-11-08.legislatures-us]].'
    tags: [legislatures:1969, state:pa, state:ca, state:tn, state:de, state:mi, state:ny, state:in, state:ak, state:nv, state:ia]
  - id: cal.1968-11-05.governors-mt
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968, state-and-city-finance]
    c: Montana. Forrest Anderson (D) governor over Governor Babcock (R), 150,481 to 116,432, 54.1 percent; a third candidate, of the New Reform Party, 11,199, 4.0 percent. Babcock had asked for a sales tax; Anderson against it (Check).
    n: '[*Official Montana General Election Returns, November 5, 1968*](https://archive.org/details/officialmontanag1968montrich/page/n1). The third candidate''s count: [Wikipedia, "1968 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Montana_gubernatorial_election). To check: [[w.malone-montana]]. See [[cal.1968-06-04.governors-mt]]. Names: Anderson, Babcock.'
    tags: [state:mt, name:anderson-forrest-h, name:babcock-tim-m]
  - id: cal.1968-11-05.governors-nm
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: New Mexico. Cargo (R) re-elected over Chavez (D), once a State senator, 160,140 to 157,230, 50.2 percent, a 2,910-vote margin; the People's Constitutional Party's candidate, in Tijerina's place, 1,540, 0.5 percent. In the primaries Cargo over Hawley, 28,014 to 23,052, 54.9 percent; Chavez first of six Democrats, over Bruce King, 41,348 to 24,658, 30.9 percent. The last two-year term.
    n: 'Votes: [Wikipedia, "1968 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1968_New_Mexico_gubernatorial_election), from *New Mexico Election Returns, 1911–1969* and *America Votes 8*; Check: N.M., *Official Returns*, 1968 (paper, State Records Center and Archives), and the primaries'' date. T. Phillip Wolf, [*The 1968 Elections in New Mexico*, 22 W. Pol. Q. 510](https://www.jstor.org/stable/446344) (1969). To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1966-11-08.governors-nm]]. Names: Cargo, Chavez, Tijerina, Hawley. Check: the ruling that kept Tijerina off the ballot.'
    tags: [state:nm, name:cargo-david-f, name:chavez-fabian-jr, name:tijerina-reies-lopez, name:hawley-clifford-j]
  - id: cal.1968-11-05.elections-1968-ak
    when: Nov. 5
    date: '1968-11-05'
    thread: elections-1968
    c: Alaska. Gravel (D) elected to the Senate over Rasmuson (R), 36,527 to 30,286, 45.1 percent; Gruening, on write-ins, 14,118, 17.4 percent.
    n: 'Votes: [Alaska, *Official Returns by Election Precinct, General Election, November 5, 1968*, 7](https://www.elections.alaska.gov/Core/Archive/68GENR/68genr.pdf#page=8) (statewide totals; Gruening''s column "write-ins"; persons voting 82,886), the Clerk''s *Statistics*, and [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), alike. See [[cal.1968-08-27.elections-1968-ak]]; [[cal.1968-11-05.elections-1968]]. Names: Gravel, Rasmuson, Gruening.'
    tags: [state:ak, name:gravel-mike, name:rasmuson-elmer-e, name:gruening-ernest]
  - id: cal.1968-11-05.legislatures-ca
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: 'California. Republicans take both houses: the Assembly 41 R–39 D, from 38–42; the Senate 21–19, from 20–20. Monagan, the Republican leader, Speaker in Unruh''s place at the session''s opening, Jan. 6, 1969 (Check the day).'
    n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against Cal., *Statement of Vote, General Election, November 5, 1968*). To check: [[w.boyarsky-big-daddy]]; [[w.cannon-governor-reagan]]. See [[cal.1966-01-11.legislatures-ca]]. Names: Monagan, Unruh.'
    tags: [state:ca, name:monagan-robert-t, name:unruh-jesse-m]
  - id: cal.1968-11-05.legislatures-ak
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Alaska. Democrats take the House, 22–18, from 15 D–25 R; the Senate stays Republican, 11–9.
    n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969 (Check against Alaska, *Official Returns*, Nov. 5, 1968). To check: [[w.naske-alaska]].'
    tags: [state:ak]
  - id: cal.1968-11-05.legislatures-nv
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Nevada. Republicans take the Assembly, 22–18, from 19 R–21 D; the Senate stays Democratic, 11–9.
    n: '[*Political History of Nevada* (2016), 364, 366](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=370): the 1967 and 1969 sessions, members by party. [[w.klarner-state-partisan-balance-data]]: the sessions of 1968 and 1969. To check: [[w.elliott-history-of-nevada]]. See [[cal.1965-10-25.legislatures-nv]].'
    tags: [state:nv]
  - id: cal.1968-11-05.state-constitutions-hi
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [legislatures]
    c: Hawaii. Of the 23 amendments the constitutional convention of 1968 proposed, the voters ratify 22; the eighth fails, 96,283 to 99,257, 49.2 percent. A legislature's amendment carries, 111,911 to 59,661, 65.2 percent.
    n: '[*Result of Votes Cast, General Election, November 5, 1968*](https://archive.org/download/HI-hist/1968_General.pdf), summary of votes cast by counties, certified Nov. 25, 1968. To check: [[w.meller-with-an-understanding-heart]]; [[w.coffman-island-edge-of-america]]. See [[cal.1966-04-25.legislatures-hi]]. Check: the convention''s call, dates and president; the eighth amendment''s subject (the voting age?); the legislature''s amendment.'
    tags: [state:hi]
  - id: cal.1968-11-05.state-constitutions-ca
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'California''s propositions. Adopted: 1-A, a homeowner''s exemption from the property tax, the State paying the localities what they lose, from the extraordinary session Reagan called in 1968, 3,500,368 to 3,058,978, 53.4 percent. Rejected: 9, Watson''s initiative limiting the property tax, 2,146,010 to 4,570,097, 32.0 percent; 1, a revision of the constitution''s articles on schools, cities and counties and public utilities, 2,606,748 to 3,462,301, 43.0 percent; 3, bonds for the State colleges, the University and urban schools.'
    n: 'Cal., [*Statement of Vote, General Election, November 5, 1968*, 27–31](https://archive.org/details/californiastate196668cali/page/n204) (Proposition 9, [30](https://archive.org/details/californiastate196668cali/page/n207)); 1-A: S.C.A. 1, ch. 9, and S.B. 8, ch. 1, Cal. Stats. 1968, 1st Ex. Sess. To check: [[w.cannon-governor-reagan]]; [[w.peirce-megastates-of-america]]. See [[cal.1967-07-29.state-and-city-finance-ca]]; [[cal.1966-11-08.state-constitutions-ca]]. Names: Reagan, Watson. Check: the vote on 3.'
    tags: [state:ca, name:reagan-ronald, name:watson-philip-e]
  - id: cal.1968-11-05.governors-mo
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: 'Missouri. Hearnes (D) re-elected governor over Lawrence Roos (R), supervisor of St. Louis County, 1,072,805 to 691,797, 60.8 percent: the first Missouri governor elected to a second term in succession, under the amendment of 1965.'
    n: 'Votes: [Mo. *Official Manual*, 1969–70, 1197](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/41030). The amendment: H.J.R. 3, [*Laws of Missouri*, 1965, 676](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/57106), Mo. Const. art. IV, § 17: "No person shall be elected governor more than twice"; adopted Aug. 17, 1965, effective Sept. 16, 1965, [*Laws of Missouri*, 1965, pt. III, 815](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56755). See [[cal.1965-08-17.state-constitutions-mo]]. To check: [[w.peirce-great-plains-states-of]]. See [[cal.1964-08-04.governors-mo]]. Names: Hearnes, Roos.'
    tags: [state:mo, name:hearnes-warren-e, name:roos-lawrence-k]
  - id: cal.1968-11-05.states-and-cities-dc
    when: Nov. 5
    date: '1968-11-05'
    thread: states-and-cities
    also: [school-aid, elections-1968]
    c: 'Washington. The District elects its Board of Education, the first officials its people have chosen since 1874 (Check): eleven members, without party, one from each of eight wards and three at large; some 89 candidates (Check). No ward race decided: runoffs Nov. 26. Julius Hobson, the plaintiff in *Hobson v. Hansen*, among those elected at large (Check).'
    n: 'The act: [82 Stat. 101](https://www.govinfo.gov/content/pkg/STATUTE-82/pdf/STATUTE-82-Pg101.pdf). [DC 1968 Project, "5 November 1968 & Presidential Election"](https://www.dc1968project.com/blog/2018/12/22/5-november-1968-amp-presidential-election), from the *Hilltop*, Nov. 8, 1968. Check: the Board of Elections'' returns of Nov. 5 and Nov. 26, and Hobson''s round. To check: [[w.jaffe-dream-city]]; [[w.gillette-between-justice-and-beauty]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-22.states-and-cities]]. Names: Hobson.'
    tags: [state:dc, city:washington, name:hobson-julius-w]
  - id: cal.1968-11-05.state-and-city-finance-va
    when: Nov. 5
    date: '1968-11-05'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Virginia''s voters approve $81 million in general obligation bonds, the State''s first in the century: for higher education, $67.23 million, 772,929 to 389,721, 66.5 percent; for mental hospitals, $13.77 million, 784,724 to 323,070, 70.8 percent. Godwin''s proposal, under the act of the 1968 General Assembly.'
    n: '[Va. State Board of Elections, historical elections database](https://historical.elections.virginia.gov/), ballot questions, 1968. Check: the *Statement of the Vote*, Nov. 5, 1968, and the claim of the first bonds since the century''s beginning. To check: [[w.peirce-border-south-states]]; [[w.howard-commentaries-on-the-constitution]]. Names: Godwin.'
    tags: [state:va, name:godwin-mills-e-jr]
  - id: cal.1968-11-05.state-constitutions-ok
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    c: 'Oklahoma. A new oath of office for all public officers, in place of the constitution''s, rejected though it carries, 357,840 to 284,656, 55.7 percent: an amendment needs a majority of all votes cast at the election, 481,865.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-17](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=18) (State Question 445). See [[cal.1968-08-27.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1968-11-05.state-constitutions-tx
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [welfare, state-and-city-finance]
    c: 'Texas votes on fourteen amendments, adopts seven: the State property tax to be cut and abolished after 1978, 64.1 percent; the Employees Retirement System in the constitution, 60.4 percent; the Permanent University Fund''s investments widened, 59.8 percent; consolidation of offices in El Paso and Tarrant Counties, 50.3 percent. Rejected: the ceiling on State spending for public assistance raised from $60 million to $75 million, 43.5 percent; legislators'' salaries to $8,400 a year, 49.0 percent; industrial development bonds, 49.0 percent.'
    n: 'Texas Legislative Council, [*Amendments to the Texas Constitution Since 1876*](https://tlc.texas.gov/docs/amendments/Constamend1876.pdf) (2026), art. 3, §§ 24, 51, 51-a, 52a, 64; art. 7, § 11a; art. 8, § 1-e; art. 16, § 62. Check: the Secretary of State''s canvass. Check: the counts. To check: [[w.may-texas-state-constitution]]. See [[cal.1967-11-11.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1968-11-05.open-housing-md
    when: Nov. 5
    date: '1968-11-05'
    thread: open-housing
    also: [state-constitutions]
    c: 'Maryland''s voters reject the open-housing act of 1967, ch. 385, signed by Agnew and petitioned to referendum: no discrimination in the sale of new houses or the rental of new apartments in buildings of twelve units or more.'
    n: '[Md. *Manual*, 1969–70, 483](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--483.html) (Archives of Maryland, vol. 174), the vote by county. Check: the statewide totals (the Manual''s page prints the counties). To check: [[w.callcott-maryland-and-america-1940]]; [[w.durr-behind-the-backlash]]. See [[cal.1967-04-21.open-housing-md]]; [[cal.1968-04-10.open-housing]]. Names: Agnew.'
    tags: [state:md, name:agnew-spiro-t]
  - id: cal.1968-11-05.state-constitutions-fl
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [desegregation-schools]
    c: 'Florida adopts its new constitution, the first since 1885: the basic document, 645,233 to 518,940, 55.4 percent; suffrage and elections, 625,980 to 497,752, 55.7 percent; local government, 625,347 to 508,962, 55.1 percent. The constitution''s command of separate schools gone.'
    n: '[Fla. *Tabulation of Official Votes Cast in the General Election*, Nov. 5, 1968, 27–28](https://archive.org/details/Tabulationofofficialvotescastinthegeneralelection1968). To check: [[w.dalemberte-florida-state-constitution]]. See [[cal.1968-06-24.state-constitutions-fl]].'
    tags: [state:fl]
  - id: cal.1968-11-05.legislatures-tn
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: 'Tennessee''s House elected 49 Republicans, 49 Democrats and an independent. Jan. 1969, the Republicans'' William Jenkins of Rogersville, Tenn., elected Speaker over the Democrats'' candidate: the first Republican Speaker in the century.'
    n: 'Check: the century claim, the *Tennessee Blue Book*, 1969–70, and the House Journal of the 86th General Assembly, the day and vote of the Speaker''s election. [Wikipedia, "Bill Jenkins (politician)"](https://en.wikipedia.org/wiki/Bill_Jenkins_(politician)). To check: [[w.peirce-border-south-states]]. Names: Jenkins.'
    tags: [state:tn, name:jenkins-william-l]
  - id: cal.1968-11-05.governors-wv
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: 'West Virginia. Moore (R) elected governor over Sprouse (D), 378,315 to 365,530, 50.9 percent: the State''s second Republican governor since 1932. John D. Rockefeller IV, a State delegate, elected secretary of state (D), 433,142 to 277,877, 60.9 percent of the two.'
    n: '[W. Va. *Blue Book*, 1969, 575](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1969.pdf#page=583). To check: [[w.peirce-border-south-states]]. See [[cal.1968-05-14.governors-wv]]. Names: Moore, Sprouse, Rockefeller.'
    tags: [state:wv, name:moore-arch-a-jr, name:sprouse-james-m, name:rockefeller-john-d-iv]
  - id: cal.1968-11-05.governors-ar
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968, state-constitutions]
    c: 'Arkansas. Rockefeller (R) re-elected over Crank (D), 322,782 to 292,813, 52.4 percent: the first Republican governor of Arkansas re-elected. The State''s electors to Wallace; Fulbright re-elected. The voters approve calling a constitutional convention (Check the vote).'
    n: 'Ark. [*Historical Report of the Secretary of State* (2008)](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf), [629](https://www.sos.arkansas.gov/uploads/elections/historical_report1210.pdf#page=642). [UALR Center for Arkansas History and Culture, "Failed Constitutions"](https://ualrexhibits.org/convention/failed-constitutions/). Check: the vote on the convention. See [[cal.1968-07-30.governors-ar]]. Names: Rockefeller, Crank, Wallace, Fulbright.'
    tags: [state:ar, name:rockefeller-winthrop, name:crank-marion-h, name:wallace-george-c, name:fulbright-j-william]
  - id: cal.1968-11-05.governors-de
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: Delaware. Russell Peterson (R), a Du Pont chemist, elected governor over Terry (D), 104,474 to 102,360, 50.5 percent; the Guard in Wilmington the campaign's issue. Terry keeps the Guard there to the end of his term; Peterson withdraws it on taking office, Jan. 21, 1969.
    n: 'Votes: [Wikipedia, "1968 Delaware gubernatorial election"](https://en.wikipedia.org/wiki/1968_Delaware_gubernatorial_election), from Our Campaigns. Check: [Del., *Official Results of General Election*, Nov. 5, 1968](https://elections.delaware.gov/elections/resultsarchive/elect68/pdfs/19681105_GeneralElectionResults.pdf) (a scan, not read). To check: [[w.hoffecker-corporate-capital]]; [[w.peirce-mid-atlantic-states-of]]. See [[cal.1968-04-09.states-and-cities-wilmington-de]]. Names: Peterson, Terry.'
    tags: [state:de, city:wilmington-de, name:peterson-russell-w, name:terry-charles-l-jr]
  - id: cal.1968-11-06.elections-1968
    when: Nov. 6
    date: '1968-11-06'
    thread: elections-1968
    c: 'Humphrey concedes at Minneapolis, his telegram to Nixon: "you will have my support in unifying and leading the nation." Nixon at the Waldorf-Astoria in New York: a teenagers sign at Deshler, Ohio, "Bring Us Together," "the great objective of this Administration at the outset."'
    n: '[Remarks Conceding the Presidential Election in Minneapolis, Minnesota](https://www.presidency.ucsb.edu/documents/remarks-conceding-the-presidential-election-minneapolis-minnesota) (Nov. 6, 1968); [Remarks in New York City Accepting Election as the 37th President of the United States](https://www.presidency.ucsb.edu/documents/remarks-new-york-city-accepting-election-the-37th-president-the-united-states) (Nov. 6, 1968). See [[cal.1968-11-05.elections-1968]]. Names: Humphrey, Nixon.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-11-06.students
    when: Nov. 6
    date: '1968-11-06'
    thread: students-sf-state
    c: San Francisco State College. The Black Students Union and the Third World Liberation Front strike on fifteen demands, a department of black studies and the admission of nonwhite applicants among them. Police on the campus. The strike follows the suspension of George Murray, a Black Panther teaching in the English department, Nov. 1, on Chancellor Dumke's order.
    n: 'To check: [[w.orrick-shut-it-down]]; [[w.barlow-end-to-silence]]; [[w.rojas-from-black-power-to]]; [[w.cannon-governor-reagan]]; [[w.rogers-black-campus-movement]]; [[w.smith-by-any-means-necessary]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1968-11-06.vietnam-paris
    when: Nov. 6
    date: '1968-11-06'
    thread: vietnam-paris
    c: Paris. The meeting set for the day postponed indefinitely.
    n: FRUS 1964–68, VII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v07/d199). See [[cal.1968-11-02.vietnam]].
  - id: cal.1968-11-08.africa
    when: Nov. 8
    date: '1968-11-08'
    thread: africa
    c: 'Nigeria. $2.5 million to the International Committee of the Red Cross for the victims of the civil war, beyond the $10 million in money, food and equipment already given and $4.3 million from American voluntary agencies. Johnson: the dispute "a Nigerian and an African problem—not an American one"; both parties asked to end the war.'
    n: 'Statement by the President Upon Authorizing Aid to Victims of the Civil War in Nigeria, [1968–69 Pub. Papers 1115](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=425) (Nov. 8, 1968). To check: [[w.thompson-american-policy-and-african]]; [[w.stremlau-international-politics-of-the]]. See [[cal.1967-05-30.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-11-08.elections-1968
    when: Nov. 8
    date: '1968-11-08'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Dirksen to Johnson: he has told Nixon that "they send some of the boys out to stiffen Thiệu''s spine"; Nixon says he sent no one. Nixon to Johnson from Key Biscayne, Fla., that night.'
    n: '[Johnson and Dirksen, 2:54 p.m., Nov. 8](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-8-1968), Conversation WH6811-03-13722; [Johnson and Nixon, 9:23 p.m., Nov. 8](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-and-telephone-operator-november), Conversation WH6811-04-13723-13724-13725 (Miller Center). FRUS 1964–68, VII, docs. [205](https://history.state.gov/historicaldocuments/frus1964-68v07/d205), [207](https://history.state.gov/historicaldocuments/frus1964-68v07/d207). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-11-02.elections-1968]]. Names: Dirksen, Johnson, Nixon, Nguyễn Văn Thiệu.'
    tags: [name:dirksen-everett, name:johnson-lyndon-b, name:nixon-richard-m, name:nguyen-van-thieu]
  - id: cal.1968-11-10.elections-1968-chennault
    when: Nov. 10
    date: '1968-11-10'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'The FBI to the NSC staff: Bùi Diễm has reported to Thiệu what Dirksen told him.'
    n: 'FRUS 1964–68, VII, doc. [209](https://history.state.gov/historicaldocuments/frus1964-68v07/d209). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-11-02.elections-1968]]. Names: Bùi Diễm, Nguyễn Văn Thiệu, Dirksen.'
    tags: [name:bui-diem, name:nguyen-van-thieu, name:dirksen-everett]
  - id: cal.1968-11-11.transition-and-staff
    when: Nov. 11
    date: '1968-11-11'
    thread: transition-and-staff
    c: 'Nixon at the White House: lunch with the Johnsons; in the Cabinet Room, Rusk, Clifford, Wheeler, Helms and Rostow brief him on Vietnam, the Middle East and Eastern Europe. Rusk asks for a man of Nixon''s next to his office. Nixon: Vietnam and other matters "cannot await decision and cannot afford a gap of 2 months."'
    n: 'Remarks to the Press With President-Elect Nixon Following Their Luncheon Meeting at the White House, [1968–69 Pub. Papers 1119](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=429) (Nov. 11, 1968). FRUS 1964–68, VII, doc. [211](https://history.state.gov/historicaldocuments/frus1964-68v07/d211). [[w.johnson-vantage-point]], 556 (the lunch and the briefings); [[w.dallek-flawed-giant]], 593–94. To check: [[w.christian-president-steps-down]]; [[w.nixon-rn]]. Names: Nixon, Johnson, Rusk, Clifford, Wheeler, Helms, Rostow.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:wheeler-earle, name:helms-richard, name:rostow-walt-w]
  - id: cal.1968-11-12.court
    when: Nov. 12
    date: '1968-11-12'
    thread: court
    c: '*Epperson v. Arkansas*, [393 U.S. 97](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393097/usrep393097.pdf): Arkansas''s statute of 1928, forbidding the teaching in its schools that man descended from a lower order of animals, void under the First Amendment, on a Little Rock biology teachers suit. Fortas for the Court: the First Amendment "does not permit the State to require that teaching and learning must be tailored to the principles or prohibitions of any religious sect or dogma." Black, Harlan and Stewart concurring separately.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.larson-trial-and-error]]; [[w.larson-summer-for-the-gods]]; [[w.powe-warren-court-and-american]]. Names: Fortas.'
    tags: [name:fortas-abe, state:ar]
  - id: cal.1968-11-12.vietnam
    when: Nov. 12
    date: '1968-11-12'
    thread: vietnam-paris
    c: 'Clifford''s news conference at the Pentagon: Saigon assented to each step of the October understanding, "as clear as two partners can have"; the President "absolutely right in not giving Saigon a veto on the plan."'
    n: 'FRUS 1964–68, VII, doc. [213](https://history.state.gov/historicaldocuments/frus1964-68v07/d213). [[w.drea-mcnamara-clifford-and-the-2011]], 200. To check: [[w.clifford-counsel-to-the-president-2]]. See [[cal.1968-05-13.vietnam]]. Names: Clifford.'
    tags: [name:clifford-clark]
  - id: cal.1968-11-12.soviet-union
    when: Nov. 12
    date: '1968-11-12'
    thread: soviet-union
    also: [europe-and-the-alliance]
    c: 'Warsaw, the Polish partys Fifth Congress. Brezhnev: when forces hostile to socialism try to turn a socialist country toward capitalism, it is the concern of all the socialist countries; military aid to a fraternal country against such a threat, as in Czechoslovakia, an extraordinary step (Check the words).'
    n: 'To check: [[w.ouimet-rise-and-fall-of]]; [[w.valenta-soviet-intervention-in-czechoslovakia]]. See [[cal.1968-08-20.soviet-union]]. Names: Brezhnev.'
    tags: [name:brezhnev-leonid]
  - id: cal.1968-11-12.elections-1968-chennault
    when: Nov. 12
    date: '1968-11-12'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Johnson to DeLoach: check the calls from Agnew''s campaign plane at Albuquerque, Nov. 2.'
    n: '[Johnson and DeLoach, 8:30 p.m., Nov. 12](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cartha-deloach-and-office-conversation-1), Conversation WH6811-04-13730 (Miller Center). FRUS 1964–68, VII, doc. [212](https://history.state.gov/historicaldocuments/frus1964-68v07/d212). See [[cal.1968-11-02.elections-1968]]. Names: Johnson, DeLoach, Agnew.'
    tags: [name:johnson-lyndon-b, name:deloach-cartha, name:agnew-spiro-t]
  - id: cal.1968-11-13.students-san-francisco
    when: Nov. 13
    date: '1968-11-13'
    thread: students-sf-state
    c: 'San Francisco State. President Smith closes the college after the day''s fighting. Reagan: "an act of capitulation"; "as long as I am Governor, our publicly supported institutions of higher education are going to stay open." Unruh wires him to reopen it.'
    n: '[[w.orrick-shut-it-down]], 45–46. See [[cal.1968-11-06.students]]. Names: Smith, Reagan, Unruh.'
    tags: [state:ca, city:san-francisco, name:smith-robert-r, name:reagan-ronald, name:unruh-jesse-m]
  - id: cal.1968-11-13.elections-1968-chennault
    when: Nov. 13
    date: '1968-11-13'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'DeLoach to Johnson: five calls from one telephone on Agnew''s plane, Agnew''s to Rusk among them, one to the Nixon–Agnew headquarters in Washington.'
    n: '[Johnson and DeLoach, 5:15 p.m., Nov. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cartha-deloach-november-13-1968), Conversation WH6811-04-13733 (Miller Center). See [[cal.1968-11-02.elections-1968]]. Names: DeLoach, Johnson, Agnew, Rusk, Nixon.'
    tags: [name:deloach-cartha, name:johnson-lyndon-b, name:agnew-spiro-t, name:rusk-dean, name:nixon-richard-m]
  - id: cal.1968-11-14.europe-and-the-alliance
    when: Nov. 14–16
    date: '1968-11-14'
    thread: europe-and-the-alliance
    also: [soviet-union]
    c: 'Brussels, the NATO ministers, a month early after Czechoslovakia''s invasion. The communiqué: any Soviet intervention directly or indirectly affecting the situation in Europe or the Mediterranean would "create an international crisis with grave consequences." The allies to spend more on their forces; France with the other fourteen on the political issues. Rusk reads a statement from Nixon on his commitment to NATO.'
    n: 'FRUS 1964–68, XIII, docs. [336](https://history.state.gov/historicaldocuments/frus1964-68v13/d336), [337](https://history.state.gov/historicaldocuments/frus1964-68v13/d337). The President''s News Conference, [1968–69 Pub. Papers 1126](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=436) (Nov. 15, 1968). See [[cal.1968-08-20.soviet-union]]. Names: Rusk, Nixon.'
    tags: [name:rusk-dean, name:nixon-richard-m]
  - id: cal.1968-11-15.transition-and-staff
    when: Nov. 15
    date: '1968-11-15'
    thread: transition-and-staff
    c: 'News conference: Robert Murphy, Nixon''s liaison and observer with the Secretary of State; "the decisions that will be made between now and January 20th will be made by this President."'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 1126](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=436) (Nov. 15, 1968). See [[cal.1968-11-11.transition-and-staff]]. Names: Murphy, Nixon, Johnson.'
    tags: [name:murphy-robert-d, name:nixon-richard-m, name:johnson-lyndon-b]
  - id: cal.1968-11-15.laos
    when: Nov. 15
    date: '1968-11-15'
    thread: laos
    also: [vietnam]
    c: 'Commando Hunt: the sorties freed by the halt turned on the routes through the Laotian panhandle and the passes from the North, Mụ Giạ, Nape and Ban Karai, guided by the Igloo White sensors. Sullivan, Nov. 4: sorties in the south up from about 100 a day to 250.'
    n: 'FRUS 1964–68, XXVIII, docs. [390](https://history.state.gov/historicaldocuments/frus1964-68v28/d390) (Nov. 4), [399](https://history.state.gov/historicaldocuments/frus1964-68v28/d399). [[w.frankum-like-rolling-thunder]], 126–128 (Commando Hunt from Nov. 15; the passes; Igloo White); [[w.cosmas-joint-chiefs-of-staff]], 243; [[w.anthony-war-in-northern-laos]], 284 (the campaign begun Nov. 15). See [[cal.1965-04-03.laos]]. Names: Sullivan.'
    src:
      c: 230bba07
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d390: all'
        - 'w.frankum-like-rolling-thunder 126–128: ?'
        - 'w.cosmas-joint-chiefs-of-staff 243: all'
        - 'w.anthony-war-in-northern-laos 284: A'
    tags: [name:sullivan-william-h, place:mu-gia-pass]
  - id: cal.1968-11-17.states-and-cities-ocean-hill
    when: Nov. 17
    date: '1968-11-17'
    thread: states-and-cities-ocean-hill
    also: [labor-disputes]
    c: 'New York City. The third strike ends: Allen, the State Commissioner of Education, puts Ocean Hill–Brownsville under a State trustee; the dismissed teachers reinstated; three of its principals transferred. The schools shut 36 days in all.'
    n: '[Wikipedia, "1968 New York City teachers'' strike"](https://en.wikipedia.org/wiki/1968_New_York_City_teachers%27_strike). Check: the State Education Department''s order, Nov. 17. See [[cal.1968-09-09.states-and-cities-nyc]]. Names: Allen, McCoy.'
    tags: [state:ny, city:nyc, name:allen-james-e-jr, name:mccoy-rhody-a]
  - id: cal.1968-11-18.economy
    when: Nov. 18
    date: '1968-11-18'
    thread: economy-franc
    also: [europe-and-the-alliance]
    c: 'The franc and the mark. Johnson to Kiesinger through Fowler: no unilateral French devaluation; the monetary authorities to act together.'
    n: 'FRUS 1964–68, VIII, doc. [208](https://history.state.gov/historicaldocuments/frus1964-68v08/d208). To check: [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.eichengreen-globalizing-capital]]. See [[cal.1967-11-18.economy]]. Made public: FRUS 1964–68, VIII (1998). Names: Johnson, Kiesinger, Fowler.'
    tags: [name:johnson-lyndon-b, name:kiesinger-kurt-georg, name:fowler-henry-h]
  - id: cal.1968-11-18.students-sf-state
    when: Nov. 18
    date: '1968-11-18'
    thread: students-sf-state
    c: San Francisco State. The State College trustees against negotiation.
    n: 'To check: [[w.orrick-shut-it-down]]. See [[cal.1968-11-06.students]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1968-11-20.jobs-and-wages
    when: Nov. 20
    date: '1968-11-20'
    thread: jobs-and-wages
    c: 'Farmington, W. Va. Explosions and fire in Consolidation Coal''s No. 9 mine: 78 men trapped below.'
    n: 'To check: [[w.derickson-black-lung]]; [[w.armbrister-act-of-vengeance]].'
    tags: [state:wv]
  - id: cal.1968-11-20.students-sf-state
    when: Nov. 20
    date: '1968-11-20'
    thread: students-sf-state
    c: San Francisco State. Classes resume with a convocation.
    n: 'To check: [[w.orrick-shut-it-down]]. See [[cal.1968-11-06.students]].'
    tags: [state:ca, city:san-francisco]
  - id: cal.1968-11-20.economy-franc
    when: Nov. 20–22
    date: '1968-11-20'
    thread: economy-franc
    also: [europe-and-the-alliance]
    c: 'Bonn, the Group of Ten. Schiller: Germany will not revalue; a border-tax adjustment of 4 percent on exports and imports instead. A standby credit of $2 billion for the franc, $500 million of it American; any devaluation of the franc not to exceed 11 percent.'
    n: 'FRUS 1964–68, VIII, docs. [216](https://history.state.gov/historicaldocuments/frus1964-68v08/d216), [219](https://history.state.gov/historicaldocuments/frus1964-68v08/d219). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-18.economy]]. Names: Schiller.'
    tags: [name:schiller-karl]
  - id: cal.1968-11-20.vietnam-operations
    when: Nov. 20
    date: '1968-11-20'
    thread: vietnam-operations
    c: 'Meade River: seven Marine battalions ring some 36 square kilometers of "Dodge City," fifteen kilometers south of Đà Nẵng, by 8:25 a.m., the largest cordon and search to that time.'
    n: '[[w.shulimson-u-s-marines-in-1997]], 425–427.'
    tags: [place:operation-meade-river, province:quang-nam]
  - id: cal.1968-11-23.economy-franc
    when: Nov. 23
    date: '1968-11-23'
    thread: economy-franc
    also: [europe-and-the-alliance]
    c: De Gaulle keeps the franc's parity.
    n: 'FRUS 1964–68, VIII, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v08/d221). See [[cal.1968-11-18.economy]]. Names: de Gaulle.'
    tags: [name:de-gaulle-charles]
  - id: cal.1968-11-24.opinion
    when: Nov. 24
    date: '1968-11-24'
    thread: opinion
    also: [elections-1968-polls, voting-rights, amendments, electoral-college]
    c: 'Gallup, Nov. 9–14: a constitutional amendment to do away with the Electoral College and elect the President by the total vote: approve 81 percent, disapprove 12. Presidential campaigns shortened from ten weeks to five: favor 60, oppose 27. A law to limit the money spent for or by a candidate: favor 68, oppose 24.'
    n: '[[w.gallup-poll]], III, 2171.'
  - id: cal.1968-11-24.economy-franc
    when: Nov. 24
    date: '1968-11-24'
    thread: economy-franc
    also: [europe-and-the-alliance]
    c: 'Johnson to de Gaulle: "ready to cooperate in any way we can."'
    n: 'Message to President de Gaulle Concerning His Decision To Maintain the Value of the Franc, [1968–69 Pub. Papers 1158](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=468) (Nov. 24, 1968). See [[cal.1968-11-18.economy]]. Names: Johnson, de Gaulle.'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles]
  - id: cal.1968-11-25.soviet-union
    when: Nov. 25
    date: '1968-11-25'
    thread: testing-missile-talks
    also: [soviet-union, transition-and-staff]
    c: 'The missile talks and a summit. Johnson to Nixon, a paper given Murphy Nov. 26: in "these nuclear matters" he "must take clear responsibility," keeping Nixon''s flexibility after Jan. 20.'
    n: 'FRUS 1964–68, XIV, doc. [322](https://history.state.gov/historicaldocuments/frus1964-68v14/d322). [[w.drea-mcnamara-clifford-and-the-2011]], 343. To check: [[w.garthoff-detente-and-confrontation]]; [[w.newhouse-cold-dawn]]; [[w.seaborg-stemming-the-tide]]. See [[cal.1968-09-09.soviet-union]]; [[cal.1968-08-20.soviet-union]]. Made public: FRUS 1964–68, XIV (2001). Names: Johnson, Nixon, Murphy.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:murphy-robert-d]
  - id: cal.1968-11-26.vietnam
    when: Nov. 26
    date: '1968-11-26'
    thread: vietnam-paris
    c: 'Saigon will send a delegation to Paris; its statement and the American, agreed in advance with the troop-contributing countries, released Nov. 27 in Saigon. Johnson: "a new and hopeful phase in the negotiations," but "both hard bargaining and hard fighting in the days ahead."'
    n: 'Statement by the President on the Decision by the Republic of Vietnam To Participate in the Peace Talks in Paris, [1968–69 Pub. Papers 1158](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=468) (Nov. 26, 1968). [FRUS 1964–68, VII, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v07/d236). See [[cal.1968-05-13.vietnam]]. Rusk at the White House: [[cal.1968-11-26.testing-missile-talks]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, place:saigon]
  - id: cal.1968-11-26.students-san-francisco
    when: Nov. 26
    date: '1968-11-26'
    thread: students-sf-state
    c: Los Angeles. Smith resigns the presidency of San Francisco State at the trustees' meeting, unable "to reconcile effectively the conflicts between the Trustees and Chancellor, the faculty groups on campus, the militant student groups, and political forces of the State." The trustees adopt ten disciplinary rules. Hayakawa, of the English faculty, acting president.
    n: '[[w.orrick-shut-it-down]], 54–55, 62. See [[cal.1968-11-06.students]]. Names: Smith, Hayakawa.'
    tags: [state:ca, city:san-francisco, name:smith-robert-r, name:hayakawa-s-i]
  - id: cal.1968-11-26.testing-missile-talks
    when: Nov. 26
    date: '1968-11-26'
    thread: testing-missile-talks
    also: [soviet-union, transition-and-staff, vietnam-paris]
    c: 'Johnson with Rusk, Clifford, Rostow, Fulbright and Tom Johnson, 10:21 to 11:11 a.m. Rusk: "The logjam is broken"; "it would be good for the President and Kosygin to meet." Nixon''s aide Ellsworth to Dobrynin: Nixon objects to a summit (Dobrynin''s account; Check the day).'
    n: 'FRUS 1964–68, XIV, doc. [323](https://history.state.gov/historicaldocuments/frus1964-68v14/d323) (the meeting); VII, doc. [237](https://history.state.gov/historicaldocuments/frus1964-68v07/d237) (the meeting); XIV, doc. [324](https://history.state.gov/historicaldocuments/frus1964-68v14/d324) (the summit again, 1:45 p.m.). [[w.dobrynin-in-confidence]], 186–87 (Ellsworth). See [[cal.1968-11-25.soviet-union]]. Names: Rusk, Clifford, Rostow, Fulbright, Johnson, Kosygin, Ellsworth, Dobrynin, Nixon.'
    tags: [name:rusk-dean, name:johnson-lyndon-b, name:kosygin-aleksei, name:ellsworth-robert, name:dobrynin-anatoly, name:nixon-richard-m, name:clifford-clark, name:rostow-walt-w, name:fulbright-j-william]
  - id: cal.1968-11-27.middle-east
    when: Nov. 27
    date: '1968-11-27'
    thread: middle-east
    c: 'Warnke to Rabin: the United States agrees to sell Israel fifty F-4 Phantoms, with related equipment and services, the annexes to be negotiated. Rabin''s letter of Nov. 22 had reaffirmed that Israel will not be the first power to introduce nuclear weapons into the Middle East, and that no American aircraft will carry them.'
    n: 'FRUS 1964–68, XX, docs. [332](https://history.state.gov/historicaldocuments/frus1964-68v20/d332), [333](https://history.state.gov/historicaldocuments/frus1964-68v20/d333). [[w.drea-mcnamara-clifford-and-the-2011]], 453. To check: [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.rabin-pinkas-sherut]]. See [[cal.1968-01-07.middle-east]]. Made public: FRUS 1964–68, XX (2001). Names: Warnke, Rabin.'
    tags: [name:warnke-paul, name:rabin-yitzhak]
  - id: cal.1968-11-30.jobs-and-wages
    when: Nov. 30
    date: '1968-11-30'
    thread: jobs-and-wages
    c: 'Farmington, W. Va. The No. 9 mine sealed, none of the 78 brought out. Johnson: his Occupational Health and Safety Act and Coal Mine Safety Act, sent to Congress this year, "will help, and they must be passed."'
    n: 'Statement by the President on the Mine Disaster at Mannington, West Virginia, [1968–69 Pub. Papers 1158](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=468) (Nov. 30, 1968). See [[cal.1968-11-20.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:wv]
