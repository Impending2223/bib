        - 'via x.1969-02-03.i-no-7-3-feb-69: A'
        - 'via x.1968-11-02.nmcc-opsum-259-68-2-nov-68: A'
    short: Rolling Thunder ends
  - id: cal.1968-11-01.vietnam-operations
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam-operations
    c: 'The Joint Chiefs'' directives for after the halt, in effect 1300Z Nov. 1: no ground units into the DMZ without "specific orders from highest authority"; fire from or across it answered until the guns are silent; in a major attack on the cities, strikes on the North only with the highest approval.'
    n: '[[w.cosmas-joint-chiefs-of-staff]], 240–41. To check: JCS 7077 to AIG, RED ROCKET 1, 010100Z Nov 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 241 n.11); JCS 7077 to AIG, RED ROCKET 2, 010108Z Nov 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 241 n.12). See [[cal.1968-11-01.vietnam-air-war]].'
