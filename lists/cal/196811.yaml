entries:
  - id: cal.1968-11-01.vietnam
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam
    c: 'The Accelerated Pacification Campaign opens, to run to Jan. 31: about 1,000 contested hamlets to be brought under the Saigon government; the attack on the Viet Cong infrastructure, the Phoenix program, pressed. Abrams in command; Colby, Komer''s deputy, to head CORDS. Dec. 16, the CIA stations assessment of Phoenix: "encouraging progress," but no significant reduction yet in the Communists'' ability to carry on.'
    n: 'FRUS 1964–68, VII, doc. [44](https://history.state.gov/historicaldocuments/frus1964-68v07/d44) (Bunker, Oct. 2: Thiệu''s first phase, 1,000 hamlets by Tet); doc. [91](https://history.state.gov/historicaldocuments/frus1964-68v07/d91) (Bunker, Oct. 19: 1,000 contested hamlets, November–January); doc. [256](https://history.state.gov/historicaldocuments/frus1964-68v07/d256). [[w.vietnam-victory-in-vietnam]], 237–38 (Hanoi''s account: a trial in Vĩnh Long and Trà Vinh showed its weakness in the countryside); [[w.cosmas-joint-chiefs-of-staff]], 247 (the campaign and its goals). Made public: FRUS 1964–68, VII (2003). Cosmas, 247, gives "more than 1,200 hamlets," contested or Viet Cong-controlled; his dates, Nov. 1–Jan. 31, the entry''s. To check: [[w.hunt-pacification]]; [[w.sorley-better-war]]; [[w.colby-lost-victory]]; [[w.andrade-ashes-to-ashes]]. Names: Abrams, Colby, Komer.'
    src:
      c: e984401b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d44: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d91: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d256: all'
        - 'w.vietnam-victory-in-vietnam 237–38: A'
        - 'w.cosmas-joint-chiefs-of-staff 247: A-B'
        - 'via w.cosmas-joint-chiefs-of-staff 247 n.34: A-B'
    tags: [name:abrams-creighton, name:colby-william-e, name:komer-robert-w]
  - id: cal.1968-11-01.elections-1968-chennault
    when: Nov. 1
    date: '1968-11-01'
    thread: elections-1968-chennault
    c: 'Johnson has William Bundy brief Humphrey on Chennault''s pressure on Thiệu. Humphrey, without direct evidence of Nixon''s part, will not leak it: "difficult to explain how we knew about what she had done."'
    n: '[[w.dallek-flawed-giant]], 591; [[w.bernstein-guns-or-butter]], 520 (William Bundy gives Humphrey the intercepts'' details; Humphrey declines to attack Nixon). [[w.longley-lbjs-1968]], 240–41 (Bundy''s briefing; Humphrey''s reasons). [[w.solberg-hubert-humphrey]], 398 (Bundy at Humphrey''s apartment; Sherman for using it; Humphrey''s reasons). See [[cal.1968-10-29.elections-1968-chennault]]. Names: Johnson, William Bundy, Humphrey, Chennault, Nguyễn Văn Thiệu, Nixon. Check: Solberg puts the briefing on the day Humphrey flew to Texas, before Issues and Answers, and cites Jones''s memorandum of Nov. 2 (398).'
    src:
      c: f88882ef
      rows:
        - 'w.dallek-flawed-giant 591: all'
        - 'w.longley-lbjs-1968 240–41: A-B'
        - 'w.solberg-hubert-humphrey 398: A-B'
        - 'via w.solberg-hubert-humphrey 398 n.walt-reports: A'
        - 'w.bernstein-guns-or-butter 520: ?'
    tags: [name:johnson-lyndon-b, name:bundy-william, name:humphrey-hubert-h, name:chennault-anna, name:nguyen-van-thieu, name:nixon-richard-m]
  - id: cal.1968-11-01.elections-1968-chennault-2
    when: Nov. 1
    date: '1968-11-01'
    time: 1968-11-01T18:58Z
    thread: elections-1968-chennault
    c: 'Johnson to Rowe, of Humphrey''s campaign, by telephone, 1:58 p.m.: keep Humphrey from mentioning Vietnam until Tuesday night; Nixon "is in deep telling Thieu and them and Korea and all of them not to go along with me on anything"; "your little friend, Mrs. Chennault, and the whole outfit is working in it."'
    n: 'FRUS 1964–68, VII, doc. [173](https://history.state.gov/historicaldocuments/frus1964-68v07/d173). [[w.longley-lbjs-1968]], 242; [[w.bernstein-guns-or-butter]], 520 (Rowe''s oral history: "I just want Humphrey to know about it"; "It''s too late"). [[w.solberg-hubert-humphrey]], 397 (the call, Rowe at Peoria; Chennault''s word to the ambassador). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-07-12.elections-1968]]. Names: Rowe, Humphrey, Nixon, Nguyễn Văn Thiệu, Chennault, Johnson. Check: Solberg''s note gives the Daily Diary''s 2:30 p.m.'
    src:
