  - id: cal.1968-11-03.elections-1968-chennault
    when: Nov. 3
    date: '1968-11-03'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Smathers to Johnson: Nixon fears Johnson will charge him with having "connived with John Tower and Anna Chennault." Nixon to Johnson from Los Angeles, after *Meet the Press*: any talk of sabotaging Saigon''s attitude has "absolutely no credibility, as far as I am concerned." Johnson on a UPI story quoting "a highly placed aide to Nixon," Finch, as he guesses.'
    n: '[Johnson and Smathers, 1:25 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-november-3-1968), Conversation WH6811-02-13708-13709; [Johnson and Nixon, 1:54 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-november-3-1968), Conversation WH6811-02-13710 (Miller Center). FRUS 1964–68, VII, docs. [186](https://history.state.gov/historicaldocuments/frus1964-68v07/d186), [187](https://history.state.gov/historicaldocuments/frus1964-68v07/d187). [[w.dallek-flawed-giant]], 590; [[w.nixon-rn]], 329 (the call, at Harlow''s urging, on Finch''s remarks, by Nixon''s account). [[w.longley-lbjs-1968]], 245–47. [[w.chester-american-melodrama]], 734 (the call, Sunday afternoon; Chennault named; "Who is this man Fink?"). [[w.white-making-of-the-president-1969]], 381, 383 n.4 (the call, Johnson''s, of Saigon''s refusal; "Who''s this guy Fink you got?"). To check: Jones''s memorandum, Nov. 3, 1968, 11:25 a.m., Reference File: Anna Chennault, LBJ Library; Harlow''s oral history, May 6, 1979 (cited by [[w.dallek-flawed-giant]], 590). See [[cal.1968-11-02.elections-1968]]. Names: Smathers, Johnson, Nixon, Tower, Chennault, Finch. Check: Chester, 734, and White, 381, have Johnson place the call to Nixon''s party.'
    src:
      c: 3fbd1951
