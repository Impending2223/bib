    date: '1968-11-03'
    thread: elections-1968-chennault
    c: 'The flight from Houston to Los Angeles. Humphrey: "I''ll be damned if I''m going to let the China Lobby of all people steal the election from me." He dictates a statement, "As President, I would sever all relations with the South Vietnamese and leave them on their own," and holds it back. At Los Angeles, milder: "If the Vietnamese do not come to the conference table as promised, the United States should go on without them."'
