    short: Thiệu's refusal
  - id: cal.1968-11-02.elections-1968
    when: Nov. 2
    date: '1968-11-02'
    time: 1968-11-03T03:18Z
    thread: elections-1968-chennault
    also: [vietnam]
    c: '9:18 p.m., Johnson telephones Dirksen, on Clifford''s advice: Nixon''s people have told Saigon to hold out until after the election; "This is treason."'
    n: '[Johnson and Dirksen, 9:18 p.m., Nov. 2](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-3-1968), Conversation WH6811-01-13706 (Miller Center). FRUS 1964–68, VII, doc. [181](https://history.state.gov/historicaldocuments/frus1964-68v07/d181). [[w.longley-lbjs-1968]], 243–45 (the call; Dirksen to Harlow, Harlow to Nixon, by Harlow''s account); [[w.white-making-of-the-president-1969]], 381; [[w.zelizer-fierce-urgency-of-now]], 313 (Johnson to Dirksen: Nixon''s people''s doing "despicable"; to reveal it would "rock the nation"). Made public: FRUS 1964–68, VII (2003). [[w.dallek-flawed-giant]], 590 (the call, after Johnson consulted Rusk, Clifford and Rostow). [[w.clifford-counsel-to-the-president-2]], 594 (Johnson tells Dirksen he knows of Chennault''s doings; Dirksen tells Nixon; Nixon calls Johnson). Check: Zelizer''s note dates the call to Dirksen Oct. 31, 1968 (313 n.16); the Miller Center''s catalogue holds calls to Dirksen of Oct. 31, 4:09 p.m. (WH6810.11, 13614-13617), and Nov. 2, 9:18 p.m. To check: [[w.hughes-chasing-shadows]]; [[w.chennault-education-of-anna]]; [[w.diem-in-the-jaws-of]]; [[w.farrell-richard-nixon]]; Rostow''s memorandum for the record, May 14, 1973, Reference File: Anna Chennault, LBJ Library; Territo to Johnson, Nov. 3, 1972 [so Dallek], Reference File: Anna Chennault, LBJ Library; "Walt Reports," Nov. 2, 1968, Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 590). See [[cal.1968-07-12.elections-1968]]. Names: Johnson, Dirksen, Clifford, Nixon. Check: Clifford, 594, has Johnson''s talk with Dirksen on Sunday, Nov. 3.'
