    c: 'Warsaw. The Chinese chargé, Chen Dong, to Stoessel, answering his letters of Sept. 12 and Nov. 15: the 135th meeting, which the Americans ask put off, to be held Feb. 20, 1969, "By that time your new President will have been in office for a month." The two principles restated: American forces out of Taiwan, an agreement on the five principles of peaceful coexistence.'
