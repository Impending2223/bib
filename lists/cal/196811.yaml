entries:
  - id: cal.1968-11-01.vietnam
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam
    c: 'The Accelerated Pacification Campaign opens, to run to Jan. 31: about 1,000 contested hamlets to be brought under the Saigon government; the attack on the Viet Cong infrastructure, the Phoenix program, pressed. Abrams in command; Colby, Komer''s deputy, to head CORDS. Dec. 16, the CIA stations assessment of Phoenix: "encouraging progress," but no significant reduction yet in the Communists'' ability to carry on.'
    n: 'FRUS 1964–68, VII, doc. [44](https://history.state.gov/historicaldocuments/frus1964-68v07/d44) (Bunker, Oct. 2: Thiệu''s first phase, 1,000 hamlets by Tet); doc. [91](https://history.state.gov/historicaldocuments/frus1964-68v07/d91) (Bunker, Oct. 19: 1,000 contested hamlets, November–January); doc. [256](https://history.state.gov/historicaldocuments/frus1964-68v07/d256). [[w.vietnam-victory-in-vietnam]], 237–38 (Hanoi''s account: a trial in Vĩnh Long and Trà Vinh showed its weakness in the countryside); [[w.cosmas-joint-chiefs-of-staff]], 247. Made public: FRUS 1964–68, VII (2003). Cosmas, 247, gives "more than 1,200 hamlets," contested or Viet Cong-controlled; his dates, Nov. 1–Jan. 31, the entry''s. To check: [[w.hunt-pacification]]; [[w.sorley-better-war]]; [[w.colby-lost-victory]]; [[w.andrade-ashes-to-ashes]]. Names: Abrams, Colby, Komer.'
    src:
      c: e984401b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d44: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d91: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d256: all'
        - 'w.vietnam-victory-in-vietnam 237–38: ?'
        - 'w.cosmas-joint-chiefs-of-staff 247: ?'
    tags: [name:abrams-creighton, name:colby-william-e, name:komer-robert-w]
  - id: cal.1968-11-01.elections-1968-chennault
    when: Nov. 1
    date: '1968-11-01'
    thread: elections-1968-chennault
    c: 'Johnson has William Bundy brief Humphrey on Chennault''s pressure on Thiệu. Humphrey, without direct evidence of Nixon''s part, will not leak it: "difficult to explain how we knew about what she had done."'
    n: '[[w.dallek-flawed-giant]], 591. To check: [[w.solberg-hubert-humphrey]], 398–400. See [[cal.1968-10-29.elections-1968-chennault]]. Names: Johnson, William Bundy, Humphrey, Chennault, Nguyễn Văn Thiệu, Nixon.'
    tags: [name:johnson-lyndon-b, name:bundy-william, name:humphrey-hubert-h, name:chennault-anna, name:nguyen-van-thieu, name:nixon-richard-m]
  - id: cal.1968-11-02.vietnam
    when: Nov. 2
    date: '1968-11-02'
    thread: vietnam-paris
    c: 'Saigon. Thiệu to the National Assembly in joint session: his government will not go to the Paris meeting set for Nov. 6; it will talk with Hanoi, not with the NLF as a delegation of its own. Bunker, the same day: Saigon will not come to the substantive meetings until the procedures are agreed, and wants the NLF counted part of Hanoi''s delegation; he urges the first meeting put off.'
    n: 'FRUS 1964–68, VII, docs. [180](https://history.state.gov/historicaldocuments/frus1964-68v07/d180), [182](https://history.state.gov/historicaldocuments/frus1964-68v07/d182). [[w.nguyen-hanois-war]], 129 (Thiệu''s refusal). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Nguyễn Văn Thiệu, Bunker.'
    tags: [name:nguyen-van-thieu, name:bunker-ellsworth, place:saigon]
  - id: cal.1968-11-02.elections-1968
    when: Nov. 2
    date: '1968-11-02'
    thread: elections-1968-chennault
    also: [vietnam]
    c: '9:18 p.m., Johnson telephones Dirksen, on Clifford''s advice: Nixon''s people have told Saigon to hold out until after the election; "This is treason."'
    n: '[Johnson and Dirksen, 9:18 p.m., Nov. 2](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-3-1968), Conversation WH6811-01-13706 (Miller Center). FRUS 1964–68, VII, doc. [181](https://history.state.gov/historicaldocuments/frus1964-68v07/d181). Made public: FRUS 1964–68, VII (2003). [[w.dallek-flawed-giant]], 590. To check: [[w.hughes-chasing-shadows]]; [[w.chennault-education-of-anna]]; [[w.diem-in-the-jaws-of]]; [[w.farrell-richard-nixon]]. See [[cal.1968-07-12.elections-1968]]. Names: Johnson, Dirksen, Clifford, Nixon.'
    tags: [name:johnson-lyndon-b, name:dirksen-everett, name:clifford-clark, name:nixon-richard-m]
  - id: cal.1968-11-03.elections-1968-chennault
    when: Nov. 3
    date: '1968-11-03'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'Smathers to Johnson: Nixon fears Johnson will charge him with having "connived with John Tower and Anna Chennault." Nixon to Johnson from Los Angeles, after *Meet the Press*: any talk of sabotaging Saigon''s attitude has "absolutely no credibility, as far as I am concerned."'
    n: '[Johnson and Smathers, 1:25 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-november-3-1968), Conversation WH6811-02-13708-13709; [Johnson and Nixon, 1:54 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-november-3-1968), Conversation WH6811-02-13710 (Miller Center). FRUS 1964–68, VII, docs. [186](https://history.state.gov/historicaldocuments/frus1964-68v07/d186), [187](https://history.state.gov/historicaldocuments/frus1964-68v07/d187). [[w.dallek-flawed-giant]], 590. See [[cal.1968-11-02.elections-1968]]. Names: Smathers, Johnson, Nixon, Tower, Chennault.'
    tags: [name:smathers-george-a, name:johnson-lyndon-b, name:nixon-richard-m, name:tower-john-g, name:chennault-anna]
  - id: cal.1968-11-03.elections-1968
    when: Nov. 3
    date: '1968-11-03'
    thread: elections-1968
    c: Houston, the Astrodome. Johnson with Humphrey at a Democratic rally, two days before the election. That night, Johnson's remarks broadcast for the Democratic Victory Committee.
    n: 'Remarks at the Astrodome in Houston at a Democratic Party Rally, [1968–69 Pub. Papers 1107](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=417) (Nov. 3, 1968); Remarks Broadcast on a Program Sponsored by the Democratic Victory Committee, [1968–69 Pub. Papers 1110](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=420) (Nov. 3, 1968). To check: [[w.solberg-hubert-humphrey]]; [[w.white-making-of-the-president-1969]]. See [[cal.1968-08-26.elections-1968]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, state:tx, city:houston]
  - id: cal.1968-11-04.elections-1968-chennault
    when: Nov. 4
    date: '1968-11-04'
    thread: elections-1968-chennault
    also: [vietnam]
    c: 'A question from the *Christian Science Monitor*: Johnson will confirm nothing; Rusk, Clifford and Rostow to meet on it.'
    n: '[Johnson, Clifford, Rusk and Rostow, 12:27 p.m., Nov. 4](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-conference-call-clark-clifford-dean-rusk-walt), Conversation WH6811-03-13713-13714 (Miller Center). FRUS 1964–68, VII, doc. [192](https://history.state.gov/historicaldocuments/frus1964-68v07/d192). [[w.dallek-flawed-giant]], 591. See [[cal.1968-11-02.elections-1968]]. Names: Johnson, Rusk, Clifford, Rostow.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:rostow-walt-w]
  - id: cal.1968-11-04.opinion
    when: Nov. 4
    date: '1968-11-04'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup''s final poll, special survey, Oct. 29–Nov. 2: Nixon 42 percent, Humphrey 40, Wallace 14, undecided 4. The undecided allocated: Nixon 43, Humphrey 42, Wallace 15.'
    n: '[[w.gallup-poll]], III, 2167–68. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-11-05.elections-1968
    when: Nov. 5
    date: '1968-11-05'
    thread: elections-1968
    also: [electoral-college]
    c: 'Nixon elected over Humphrey, 31,783,783 to 31,271,837, 43.4 percent; Wallace (American Independent) 9,910,517, 13.5 percent. Electoral votes as cast Dec. 16: Nixon 301, thirty-two States; Humphrey 191, thirteen States and the District; Wallace 46, Alabama, Arkansas, Georgia, Louisiana and Mississippi, and one North Carolina elector. Agnew Vice President. House 243 D–192 R, from 248–187 at the 90th''s opening. Senate 58 D–42 R, Republicans up five: Goldwater in Arizona; Gurney in Florida; Mathias over Brewster in Maryland; Saxbe in Ohio; Bellmon over Monroney in Oklahoma; Packwood over Morse in Oregon, 408,825 to 405,380, 50.2 percent, a 3,445-vote margin; Schweiker over Clark in Pennsylvania. Democratic gains: Cranston in California, Hughes in Iowa. In New York''s 12th, Shirley Chisholm (D) over Farmer: the first Negro woman elected to Congress.'
    n: '[*Statistics of the Presidential and Congressional Election of November 5, 1968*](https://clerk.house.gov/member_info/electionInfo/1968election.pdf) (Clerk of the House). Telegram to President-Elect Richard M. Nixon, [1968–69 Pub. Papers 1114](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=424); Telegram to Vice President Hubert H. Humphrey, [1968–69 Pub. Papers 1114](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=424) (Nov. 5, 1968, released Nov. 6). FRUS 1964–68, VII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v07/d199). To check: [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.witcover-year-the-dream-died]]; [[w.gould-1968]]; [[w.nelson-resilient-america]]; [[w.perlstein-nixonland-2008]]; [[w.carter-politics-of-rage-1995]]; [[w.solberg-hubert-humphrey]]; [[w.nixon-rn]]. See [[cal.1968-08-26.elections-1968]]. Names: Nixon, Humphrey, Wallace, Agnew, Goldwater, Gurney, Mathias, Brewster, Saxbe, Bellmon, Monroney, Packwood, Morse, Schweiker, Clark, Cranston, Hughes, Chisholm, Farmer.'
    tags: [election:1968, name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:agnew-spiro-t, name:goldwater-barry-m, name:gurney-edward-j, name:mathias-charles-mcc-jr, name:brewster-daniel-b, name:saxbe-william-b, name:bellmon-henry, name:monroney-almer-s, name:packwood-robert-w, name:morse-wayne, name:schweiker-richard-s, name:clark-joseph-s, name:cranston-alan, name:hughes-harold-e, name:chisholm-shirley, name:farmer-james, name:johnson-lyndon-b]
  - id: cal.1968-11-05.specials
    when: Nov. 5
    date: '1968-11-05'
    thread: specials
    c: Pennsylvania 20th, special, held with the general election. Gaydos (D) elected for the rest of the term of Holland (D), who died Aug. 9; the same day, the full term, 109,236 to 44,037 for the Republican.
    n: 'Full term: [*Statistics of the Presidential and Congressional Election of November 5, 1968*](https://clerk.house.gov/member_info/electionInfo/1968election.pdf), 40; the Clerk prints the regular race only. Check: the specials returns (Pa. *Manual*). See [[cal.1968-08-24.specials]]. Names: Gaydos, Holland.'
    tags: [special:1968-11-05-h-PA-20, name:gaydos-joseph-m, name:holland-elmer-j, state:pa]
  - id: cal.1968-11-05.governors-il
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968]
    c: Illinois. Ogilvie (R) elected governor over Shapiro (D), 2,307,295 to 2,179,501, 51.2 percent; Shapiro carries Cook County and eighteen others.
    n: '[*Official Vote of the State of Illinois*, 1968](https://www.elections.il.gov/DocDisplay.aspx?doc=Downloads/ElectionOperations/VoteTotals/Archived/1968/1968%20GE%20and%20PE.PDF#page=6), PDF p. 6. See [[cal.1968-06-11.governors-il]]. Names: Ogilvie, Shapiro.'
    tags: [state:il, name:ogilvie-richard-b, name:shapiro-samuel-h]
  - id: cal.1968-11-05.governors-ri
    when: Nov. 5
    date: '1968-11-05'
    thread: governors
    also: [elections-1968, state-and-city-finance]
    c: Rhode Island. Licht (D), a Superior Court judge, elected governor over Chafee (R), seeking a fourth two-year term, 195,766 to 187,958, 51.0 percent. Chafee, against an income tax in three campaigns, now for one; Licht against it.
    n: '[*Official Count of the Ballots Cast*, 1968](https://elections.ri.gov/sites/g/files/xkgbur756/files/publications/Election_Publications/Countbooks/1968-Count-Book.pdf#page=23) (R.I. Secretary of State), PDF p. 23; both unopposed in the primaries of Sept. 10 (pp. 5, 8). [Wikipedia, "John Chafee"](https://en.wikipedia.org/wiki/John_Chafee). To check: [[w.moakley-rhode-island-politics-and]]; [[w.peirce-new-england-states]]. See [[cal.1964-09-17.governors-ri]]. Names: Licht, Chafee.'
    tags: [state:ri, name:licht-frank, name:chafee-john-h]
  - id: cal.1968-11-05.legislatures-ny
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: New York. Republicans take the Assembly, 78 seats to the Democrats' 72, and keep the Senate, 33 to 24. Duryea, the Republican leader, elected Speaker, Jan. 8, 1969.
    n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. [Wikipedia, "Perry B. Duryea Jr."](https://en.wikipedia.org/wiki/Perry_B._Duryea_Jr.). Check: the *Legislative Manual*, 1969. To check: [[w.connery-rockefeller-of-new-york]]. See [[cal.1966-11-08.state-constitutions-ny]]. Names: Duryea.'
    tags: [state:ny, name:duryea-perry-b-jr]
  - id: cal.1968-11-05.legislatures-pa
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Pennsylvania. Democrats take the House, 106 seats to the Republicans' 96; Republicans keep the Senate, 27 to 23.
    n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Pennsylvania Manual*, vol. 99. To check: [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1968-04-23.state-constitutions-pa]].'
    tags: [state:pa]
  - id: cal.1968-11-05.state-constitutions-mi
    when: Nov. 5
    date: '1968-11-05'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: Michigan. Proposal 1, an amendment to permit a graduated income tax, rejected, 614,826 to 2,025,052, 23.3 percent. The law for daylight saving time refused at referendum, 1,402,562 to 1,403,052, 50.0 percent, a 490-vote margin. Bonds for water pollution control and for parks approved.
    n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals), from the *Michigan Manual*, 1969–70 (Check: not read here). To check: [[w.peirce-great-lakes-states-of]]. See [[cal.1967-07-01.state-and-city-finance-mi]]; [[cal.1966-11-08.state-constitutions-mi]].'
    tags: [state:mi]
  - id: cal.1968-11-05.legislatures-mi
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Michigan. Democrats take the House, 57 seats to the Republicans' 53. The Senate, elected for four years in 1966, stays Republican, 20 to 18.
    n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Check: the *Michigan Manual*, 1969–70. See [[cal.1964-11-03.legislatures-mi]].'
    tags: [state:mi]
  - id: cal.1968-11-05.legislatures-in
    when: Nov. 5
    date: '1968-11-05'
    thread: state-legislatures
    also: [elections-1968]
    c: Indiana. Republicans take the Senate, 35 seats to the Democrats' 15, and keep the House, 73 to 27; Whitcomb (R) governor over Rock (D), 1,080,271 to 965,816, 52.7 percent.
    n: '[[w.klarner-state-partisan-balance-data]], the sessions of 1968 and 1969. Governor: [Indiana *Election Report*, 1968](https://digital.library.in.gov/Record/ISL_p16066coll37-1222) (Check: not read here); [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election). See [[cal.1968-06-18.governors-in]]. Names: Whitcomb, Rock.'
    tags: [state:in, name:whitcomb-edgar-d, name:rock-robert-l]
