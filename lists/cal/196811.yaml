    thread: economy-franc
    c: 'Walt Rostow to Fowler in Rome, 2258Z, from Basel''s weekend: Brunet of the Bank of France thinks France cannot hold its rate; Blessing still against a change in the mark; the Fund''s management sees a strong case for revaluing the mark and fears a French devaluation without it. Larre, from Paris: in a general change of European rates the United States "needs to decide" whether to raise the price of gold or demonetize it. Washington hopes for a German revaluation of not less than 10 percent.'
    n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 207](https://history.state.gov/historicaldocuments/frus1964-68v08/d207) (CAP 82761). Made public: FRUS 1964–68, VIII (1998). See [[cal.1968-11-15.economy-franc-2]]. Names: Walt Rostow, Fowler, Blessing.'
