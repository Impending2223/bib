  - id: cal.1964-01-20.economy
    when: Jan. 20
    date: '1964-01-20'
    thread: economy
    c: 'Economic Report. GNP at a $600 billion rate in the fourth quarter; unemployment 5.5 percent. With the tax cut, $623 billion in 1964. The guideposts reaffirmed. The Council''s second chapter, "The Problem of Poverty in America": a family under $3,000 a year poor; one family in five.'
    n: '[Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-13) (Jan. 20, 1964). [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000). [[w.advisers-annual-report-1964]], ch. 2 (K–J Adm. II.H.3). [[w.heller-new-dimensions-of-political]]; [[w.stein-fiscal-revolution-in-america]]. See [[cal.1963-01-24.economy]]. Names: Johnson, Heller.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w]
  - id: cal.1964-01-20.africa
    when: Jan. 20–25
    date: '1964-01-20'
    thread: africa
    also: [europe-and-the-alliance]
    c: Army mutinies in Tanganyika, Uganda and Kenya, put down by British troops at the governments' request.
    n: 'Check: the record. See [[cal.1964-01-12.africa]].'
  - id: cal.1964-01-21.economy
    when: Jan. 21
    date: '1964-01-21'
    thread: economy
    c: Budget for fiscal 1965. Expenditures $97.9 billion, $500 million under 1964 and $900 million under the 1964 request; receipts $93.0 billion; deficit $4.9 billion. Defense down more than $1 billion. Civilian employment cut, the first budget to do so since the count began in 1956.
    n: '[Annual Budget Message to the Congress, Fiscal Year 1965](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1965) (Jan. 21, 1964); [Remarks to Members of the Budget Bureau Staff at the Signing of the 1965 Budget](https://www.presidency.ucsb.edu/documents/remarks-members-the-budget-bureau-staff-the-signing-the-1965-budget) (Jan. 20, 1964). [[w.morgan-deficit-government]]. See [[cal.1963-12-27.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-21.testing
    when: Jan. 21
    date: '1964-01-21'
    thread: testing
    c: 'Geneva. The Eighteen-Nation Disarmament Committee resumes; Foster reads Johnson''s message. Five proposals: no force to change boundaries; a verified freeze on strategic nuclear vehicles; a halt to fissionable material for weapons, plant by plant meanwhile; observation posts against surprise attack; no transfer of nuclear weapons to national control.'
    n: '[Message to the 18-Nation Disarmament Conference in Geneva](https://www.presidency.ucsb.edu/documents/message-the-18-nation-disarmament-conference-geneva); [Statement by the President on the Reopening of the Geneva Disarmament Conference](https://www.presidency.ucsb.edu/documents/statement-the-president-the-reopening-the-geneva-disarmament-conference) (Jan. 21, 1964); [Letter to Chairman Khrushchev on the Eve of the Reopening of the Geneva Disarmament Conference](https://www.presidency.ucsb.edu/documents/letter-chairman-khrushchev-the-eve-the-reopening-the-geneva-disarmament-conference) (Jan. 20, 1964). [[w.bundy-danger-and-survival]]; [[w.lyndon-johnson-confronts-the]]. See [[cal.1963-10-07.testing]]. Names: Johnson, Foster, Khrushchev.'
    tags: [name:johnson-lyndon-b, name:foster-william-c, name:khrushchev-nikita-s]
  - id: cal.1964-01-21.mississippi-ms
    when: Jan. 21
    date: '1964-01-21'
    thread: mississippi
    also: [governors]
    c: 'Paul Johnson inaugurated at Jackson: "Hate, or prejudice, or ignorance, will not lead Mississippi while I sit in the governor''s chair" (Check the wording).'
    n: 'Mississippi Department of Archives and History, ["Paul Burney Johnson, Jr."](https://mshistory.mdah.ms.gov/issue/paul-burney-johnson-jr-fifty-fourth-governor-of-mississippi-1964-1968). [[w.dittmer-local-people]]; [[w.crespino-in-search-of-another]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Paul Johnson.'
    tags: [state:ms, city:jackson, name:johnson-paul-b-jr]
  - id: cal.1964-01-21.transition-and-staff
    when: Jan. 21
    date: '1964-01-21'
    thread: transition-and-staff
    c: Murrow resigns from the USIA, ill; Rowan, ambassador to Finland, to succeed him, sworn Feb. 28.
    n: '[Letter Accepting Resignation of Edward R. Murrow as Director, USIA](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-edward-r-murrow-director-usia) (Jan. 21, 1964); [Remarks at the Swearing In of Carl T. Rowan](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-carl-t-rowan-director-united-states-information-agency) (Feb. 28, 1964). Rowan named Jan. 21; check. See [[cal.1964-01-15.transition-and-staff]]. Names: Johnson, Murrow, Rowan.'
    tags: [name:johnson-lyndon-b, name:murrow-edward-r, name:rowan-carl-t]
  - id: cal.1964-01-22.mississippi-hattiesburg
    when: Jan. 22
    date: '1964-01-22'
    thread: mississippi
    also: [voting-rights, civil-rights-organizations]
    c: 'Hattiesburg. Freedom Day: Negro applicants line up at the Forrest County courthouse to register before the circuit clerk, some fifty pickets and some thirty Northern clergymen beside them; Moses, of SNCC, among the organizers. Check the numbers.'
    n: 'SNCC, ["Hattiesburg, Miss., Freedom Day, January 22, 1964"](https://www.crmvet.org/docs/6401_sncc_hattiesburg-fd.pdf). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.branch-pillar-of-fire]]. See [[cal.1962-05.mississippi-ms]]. Names: Moses.'
    tags: [state:ms, city:hattiesburg, name:moses-robert-p]
  - id: cal.1964-01-22.amendments
    when: Jan. 22–23
    date: '1964-01-22'
    thread: amendments
    also: [succession, congress]
    c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Bayh''s, opens hearings on presidential succession and disability, S.J. Res. 13, 28, 35, 138, 139, 140 and 143: Members of Congress first, then public hearings in February and March, Nixon and the former Attorneys General Brownell and Biddle among the witnesses. The same month a dozen legal scholars called by the American Bar Association reach a consensus in two days; its House of Delegates endorses it.'
    n: 'Bayh''s notice, [110 Cong. Rec. 526](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-8-1.pdf) (1964); his account of the hearings, [8161–62](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-9-2.pdf). The consensus, [111 Cong. Rec. 1175–76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-17-1.pdf) (1965). *Presidential Inability and Vacancies in the Office of Vice President: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 88th Cong. (1964) (Check the title and a digitized copy). [[w.feerick-twenty-fifth-amendment]]; [[w.bayh-one-heartbeat-away]]. See [[cal.1963-11-22.succession]]. Names: Bayh, Nixon, Brownell.'
    tags: [name:bayh-birch, name:nixon-richard-m, name:brownell-herbert-jr]
  - id: cal.1964-01-23.voting-rights
    when: Jan. 23
    date: '1964-01-23'
    thread: voting-rights
    also: [amendments]
    c: 'South Dakota ratifies the Twenty-fourth Amendment, the thirty-eighth State: no poll tax in federal elections. Certified Feb. 4, [78 Stat. 1117](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1117.pdf), Johnson watching, a first. Poll taxes stand for State elections in Alabama, Arkansas, Mississippi, Texas, and Virginia.'
    n: '[Statement by the President Announcing the Adoption of the 24th Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-the-adoption-the-24th-amendment-the-constitution) (Jan. 23, 1964); [Remarks Upon Witnessing the Certification of the 24th Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/remarks-upon-witnessing-the-certification-the-24th-amendment-the-constitution) (Feb. 4, 1964). U.S. Const. amend. XXIV (K–J Cong. II.J.2). [[w.lawson-black-ballots]]. See [[cal.1962-08-27.voting-rights]]; [[cal.1963-03-22.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:holland-spessard-l, name:boutin-bernard-l]
  - id: cal.1964-01-23.rules
    when: Jan. 23
    date: '1964-01-23'
    thread: rules
    also: [congress]
    c: 'Senate adopts Pastore''s germaneness rule, S. Res. 89, [57–25](https://voteview.com/rollcall/RS0880234): debate germane to the pending business for three hours after the morning hour, unless waived. Jan. 30, S. Res. 111, committees to sit through the morning hour, [47–33](https://voteview.com/rollcall/RS0880237); Clark''s amendments to let them sit while the Senate debates lost, [36–43](https://voteview.com/rollcall/RS0880235), [34–45](https://voteview.com/rollcall/RS0880236).'
    n: '[110 Cong. Rec., Senate, Jan. 23, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-12-2.pdf); [110 Cong. Rec., Senate, Jan. 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-1-1.pdf). See [[cal.1963-02-07.rules]]; [[cal.1963-02-19.congress]]. Names: Pastore, Clark.'
    tags: [name:pastore-john-o, name:clark-joseph-s]
  - id: cal.1964-01-23.baker
    when: Jan. 23
    date: '1964-01-23'
    thread: baker
    c: 'Johnson, at a news conference called for 5 p.m.: insurance on his life, bought in 1957 by the family company, Reynolds taking a commission; $78,000 in premiums paid. The stereo set a gift of "the Baker family." Reynolds''s testimony to the Rules Committee, in closed session, Jan. 9, made public. Check the date.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1043) (Jan. 23, 1964). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). [[w.baker-wheeling-and-dealing]]; [[w.caro-passage-of-power]]. See [[cal.1963-11-22.baker]]. Names: Johnson, Reynolds, Robert Baker.'
    tags: [name:johnson-lyndon-b, name:reynolds-don-b, name:baker-robert-g]
  - id: cal.1964-01-23.robert-kennedy
    when: Jan. 23
    date: '1964-01-23'
    thread: robert-kennedy
    also: [indonesia]
    c: 'Robert Kennedy at Djakarta, after Kuala Lumpur and Manila: Sukarno agrees to order a cease-fire, and to a meeting of the foreign ministers of Indonesia, Malaysia, and the Philippines at Bangkok, Feb. 5–6. Then Bangkok and London.'
    n: '[FRUS 1964–68, XXVI, doc. 23](https://history.state.gov/historicaldocuments/frus1964-68v26/d23). See [[cal.1964-01-17.robert-kennedy]]. Names: Robert Kennedy, Sukarno.'
    tags: [name:kennedy-robert-f, name:sukarno]
  - id: cal.1964-01-24.transition-and-staff
    when: Jan. 24
    date: '1964-01-24'
    thread: transition-and-staff
    c: Hornig sworn as science adviser for Wiesner, back to MIT.
    n: '[Remarks at the Swearing In of Donald F. Hornig](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-donald-f-hornig-special-assistant-the-president-for-science-and) (Jan. 24, 1964). See [[cal.1964-01-15.transition-and-staff]]. Names: Johnson, Hornig, Wiesner.'
    tags: [name:johnson-lyndon-b, name:hornig-donald-f, name:wiesner-jerome-b]
  - id: cal.1964-01-25.europe-and-the-alliance
    when: Jan. 25–28
    date: '1964-01-25'
    thread: cyprus
    c: Cyprus, fighting between Greek and Turkish Cypriots since Dec. 21; the guarantor powers' conference in London broken down. Britain asks American troops for an allied force. Johnson, with Ball, McNamara, and Taylor, lets Ball explore a NATO force of 10,000 with a token American battalion of 1,200, and a mediator.
    n: 'FRUS 1964–68, XVI, docs. [3](https://history.state.gov/historicaldocuments/frus1964-68v16/d3), [4](https://history.state.gov/historicaldocuments/frus1964-68v16/d4) (editorial note). [[w.ball-past-has-another-pattern]]; [[w.nicolet-united-states-policy-towards]]; [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, Ball, McNamara, Taylor.'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:mcnamara-robert-s, name:taylor-maxwell]
  - id: cal.1964-01-27.europe-and-the-alliance
    when: Jan. 27
    date: '1964-01-27'
    thread: europe-and-the-alliance
    also: [vietnam, china]
    c: 'France and the People''s Republic of China announce recognition. Johnson keeps the protest low; Chiang asked not to break with Paris first. De Gaulle, Jan. 31: no neutrality in Southeast Asia without China. Feb. 10, Taipei ends relations with France.'
    n: '[FRUS 1964–68, XXX, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v30/d2); [FRUS 1964–68, XXX, doc. 12](https://history.state.gov/historicaldocuments/frus1964-68v30/d12); [FRUS 1964–68, I, doc. 27](https://history.state.gov/historicaldocuments/frus1964-68v01/d27). [[w.schwartz-lyndon-johnson-and-europe]]; [[w.logevall-choosing-war]]; [[w.bohlen-witness-to-history-1929]]. See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Johnson, de Gaulle, Chiang Kai-shek.'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles, name:chiang-kai-shek]
  - id: cal.1964-01-27.elections-1964
    when: Jan. 27
    date: '1964-01-27'
    thread: elections-1964
    c: 'Margaret Chase Smith announces for the Republican nomination, at the Women''s National Press Club: "I have few illusions and no money, but I''m staying for the finish."'
    n: '[[w.white-making-of-the-president-1965]]; [[w.declaration-of-conscience]]. See [[cal.1964-01-03.elections-1964]]. Names: Smith.'
    tags: [name:smith-margaret-chase]
  - id: cal.1964-01-27.cities-and-housing
    when: Jan. 27
    date: '1964-01-27'
    thread: cities-and-housing
    c: Housing message. Public housing, 50,000 units a year for four years, and 40,000 leased; urban renewal, $1.4 billion more for two years; loans for the elderly; grants and loans toward new communities. The mass transit bill the Senate passed. A Department of Housing and Community Development.
    n: '[Special Message to the Congress on Housing and Community Development](https://www.presidency.ucsb.edu/documents/special-message-the-congress-housing-and-community-development-0) (Jan. 27, 1964). See [[cal.1962-01-24.program]]; [[cal.1963-04-04.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-27.japan-and-korea
    when: Jan. 27–28
    date: '1964-01-27'
    thread: japan
    c: 'Third meeting of the Joint Committee, Tokyo: Rusk, Hodges, Wirtz, Heller. Rusk with Ikeda and Ōhira on Korea, China, defense; Ōhira: Japanese opinion strong for an understanding with Peking, recognition not in prospect. The communiqué repeats the promise on the interest equalization tax. Then Seoul.'
    n: 'FRUS 1964–68, XXIX, pt. 2, docs. [7](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d7), [8](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d8); FRUS 1964–68, XXIX, pt. 1, docs. [1](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d1), [333](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d333), [335](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d335). See [[cal.1963-11-25.japan-and-korea]]; [[cal.1963-08-01.japan-and-korea]]. Names: Rusk, Hodges, Wirtz, Heller, Ikeda, Ōhira.'
    tags: [name:rusk-dean, name:hodges-luther-h, name:wirtz-w-willard, name:heller-walter-w, name:ikeda-hayato, name:ohira-masayoshi]
  - id: cal.1964-01-29.space
    when: Jan. 29
    date: '1964-01-29'
    thread: space
    c: Saturn I, two stages, puts some 37,000 pounds in orbit, the largest payload yet; liquid hydrogen proved as a fuel.
    n: '[Statement by the President Following the Launching of the First Satellite by Saturn I](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-launching-the-first-satellite-saturn-i) (Jan. 29, 1964). See [[cal.1963-11-29.space]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-30.vietnam
    when: Jan. 30
    date: '1964-01-30'
    thread: vietnam-saigon
    c: 'Saigon. Nguyễn Khánh takes power without bloodshed; Dương Văn Minh, Trần Văn Đôn, Lê Văn Kim held. Lodge and Harkins: Khánh feared the junta was dealing with the French toward neutralization. Feb. 1, Johnson: neutralization of the South alone, no; "the operations should be stepped up."'
    n: 'FRUS 1964–68, I, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v01/d22), [24](https://history.state.gov/historicaldocuments/frus1964-68v01/d24), [31](https://history.state.gov/historicaldocuments/frus1964-68v01/d31). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1048) (Feb. 1, 1964). [[w.ahern-cia-and-the-generals]]; [[w.shaplen-lost-revolution]]; [[w.lam-history-of-south-vietnam-2021]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.vandemark-into-the-quagmire]]; [[w.gibbons-u-s-government-and]], II, 218. See [[cal.1963-12-21.vietnam]]. Names: Nguyễn Khánh, Dương Văn Minh, Trần Văn Đôn, Lê Văn Kim, Lodge, Harkins, Johnson.'
    tags: [name:nguyen-khanh, name:duong-van-minh, name:tran-van-don, name:le-van-kim, name:lodge-henry-cabot, name:harkins-paul-d, name:johnson-lyndon-b, place:saigon]
  - id: cal.1964-01-30.desegregation-schools-cleveland
    when: Jan. 30
    date: '1964-01-30'
    thread: desegregation-schools
    also: [civil-rights-organizations]
    c: Cleveland. The United Freedom Movement, some sixty Negro organizations formed in June 1963, against the schools' practice of busing Negro pupils to schools where they are taught apart. At the Murray Hill School in Little Italy, white crowds stone Negroes in the streets through the day.
    n: '[Wikipedia, "United Freedom Movement"](https://en.wikipedia.org/wiki/United_Freedom_Movement) (Check). [[w.moore-carl-b-stokes-and]]; [[w.frazier-harambee-city]]; [[w.davis-black-americans-in-cleveland]].'
    tags: [state:oh, city:cleveland]
  - id: cal.1964-01-30.civil-rights-bill
    when: Jan. 30
    date: '1964-01-30'
    thread: civil-rights-bill
    c: 'The Rules Committee grants a rule for the civil rights bill, H. Res. 616: ten hours of general debate, the Judiciary Committee''s substitute in order. 11–4; check the vote.'
    n: 'Check: the record. See [[cal.1964-01-09.civil-rights-bill]]. Names: Smith.'
    tags: [name:smith-howard-w]
  - id: cal.1964-01-31.opinion
    when: Jan. 31
    date: '1964-01-31'
    thread: opinion
    also: [succession]
    c: 'Gallup, Jan. 2–7: 53 percent have followed the discussion of presidential succession. Of them, the Secretary of State to succeed in place of the Speaker, 46 for, 36 against.'
    n: '[[w.gallup-poll]], III, 1862.'
  - id: cal.1964-01-31.mississippi
    when: Jan. 31
    date: '1964-01-31'
    thread: mississippi
    c: 'Liberty, Amite County. Louis Allen, who saw Hurst kill Herbert Lee in 1961 and testified to self-defense, then told SNCC, the FBI and the Civil Rights Commission otherwise, shot dead at his gate the night before he was to leave the State. The FBI had referred his reports of threats to the Highway Patrol. Its inquiry closed in May: no voting work, so no federal jurisdiction.'
    n: 'Robert Moses, [Report Concerning the Louis Allen Case](https://www.wisconsinhistory.org/record/multi/W01DRZ7) (SNCC, 1964), with Mrs. Allen''s and Tommy Allen''s accounts. Civil Rights Division, [Notice to Close File, Louis Allen](https://www.justice.gov/crt/case-document/file/1194136/dl) (May 19, 2015). [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]. See [[cal.1961-09-25.mississippi]]. Made public: the Civil Rights Division''s notice closing the file, May 19, 2015, from the FBI''s memoranda of 1961–64. Names: Allen, Hurst, Lee.'
    tags: [name:allen-louis, name:hurst-e-h, name:lee-herbert]
  - id: cal.1964-01-31.civil-rights-bill
    when: Jan. 31
    date: '1964-01-31'
    thread: civil-rights-bill
    c: The House takes up the civil rights bill under the rule.
    n: '[110 Cong. Rec., House, Jan. 31, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-2-2.pdf). See [[cal.1964-01-09.civil-rights-bill]].'
  - id: cal.1964-01.antisubversion-fl
    when: Jan.
    date: 1964-01
    thread: antisubversion
    c: The Florida Legislative Investigation Committee, the Johns Committee, publishes *Homosexuality and Citizenship in Florida*, its report on homosexuals in the schools, the universities and the State's offices, with photographs; 25 cents a copy. The attorney general warns it to stop distributing the report as obscene.
    n: '[*Homosexuality and Citizenship in Florida*](https://archive.org/details/ReportJan1964) (Jan. 1964). [[w.braukman-communists-and-perverts-under]]. See [[cal.1963-03-25.court]]. Names: Johns.'
    tags: [name:johns-charley-e, state:fl]
