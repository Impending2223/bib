    c: Robert Kennedy, sent by Johnson, on Indonesia's confrontation of Malaysia. Tokyo, with Sukarno.
    n: 'FRUS 1964–68, XXVI, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v26/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v26/d16) (his instructions, Jan. 14). [[w.jones-conflict-and-confrontation-in]]; [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy, Johnson, Sukarno.'
