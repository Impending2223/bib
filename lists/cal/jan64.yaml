  - id: cal.1964-01-13.middle-east
    when: Jan. 13–17
    date: '1964-01-13'
    thread: middle-east
    c: 'The Arab kings and presidents at Cairo, at Nasser''s call. To divert the Jordan''s sources in Syria and Lebanon from Israel; a Unified Arab Command; Shukairy to organize a "Palestine entity." Rusk to Johnson, Jan. 16: the diversion of the Jordan''s waters the toughest of the year''s problems.'
    n: 'FRUS 1964–68, XVIII, docs. [9](https://history.state.gov/historicaldocuments/frus1964-68v18/d9), [54](https://history.state.gov/historicaldocuments/frus1964-68v18/d54), [129](https://history.state.gov/historicaldocuments/frus1964-68v18/d129). [[w.kerr-arab-cold-war]]; [[w.gerges-superpowers-and-the-middle]]; [[w.sayigh-armed-struggle-and-the]]; [[w.shlaim-iron-wall]]. Names: Nasser, Shukairy, Rusk.'
    tags: [name:nasser-gamal-abdel, name:shukairy-ahmad, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1964-01-14.poverty-nc
    when: Jan. 14
    date: '1964-01-14'
    thread: poverty
    c: 'Johnson to Sanford''s conference on poverty at Raleigh: "The North Carolina Fund promises to make an exciting and important contribution." The federal departments to cooperate.'
    n: '[Telegram to Governor Sanford on His Attack on Poverty in North Carolina](https://www.presidency.ucsb.edu/documents/telegram-governor-sanford-his-attack-poverty-north-carolina) (Jan. 14, 1964). See [[cal.1963-07-18.poverty-nc]]. Names: Sanford, Johnson.'
    tags: [state:nc, name:sanford-terry, name:johnson-lyndon-b]
