    when: Jan. 15
    date: '1964-01-15'
    thread: transition-and-staff
    c: Sorensen resigns as Special Counsel, to write his book on Kennedy; he leaves Feb. 29.
    n: '[Letter Accepting Resignation of Theodore C. Sorensen as Special Counsel to the President](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-theodore-c-sorensen-special-counsel-the-president) (Jan. 15, 1964). [[w.sorensen-counselor]]; [[w.caro-passage-of-power]]. See [[cal.1963-09-30.transition-and-staff]]. Names: Johnson, Sorensen.'
    tags: [name:johnson-lyndon-b, name:sorensen-theodore-c]
