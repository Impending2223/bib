# Cal. XLIV January 8–31, 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIV
entries:
  - id: cal.1964-01-08.program
    when: Jan. 8
    date: '1964-01-08'
    thread: program
    c: State of the Union. "This administration today, here and now, declares unconditional war on poverty in America." The civil rights bill to pass this session; the tax bill by Feb. 1, withholding at 14 percent; hospital insurance under Social Security; Appalachia, youth employment, food stamps, a National Service Corps, the minimum wage to 2 million more; immigrants chosen by skill and family, not birthplace. Budget $97.9 billion, $500 million under the current year; the deficit halved, to $4.9 billion. Enriched uranium cut 25 percent.
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-25) (Jan. 8, 1964). [110 Cong. Rec., House, Jan. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-2-2.pdf). Recording (K–J Adm. II.I). Johnson, *The Vantage Point* (K–J Adm. II.G.3). Dallek, *Flawed Giant*; Matusow, *The Unraveling of America* (K–J Adm. II.A). Caro, *The Passage of Power* (K–J Adm. II.F). Gillette, *Launching the War on Poverty* (K–J Adm. II.B). Sundquist, *Politics and Policy*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). See [[cal.1963-01-14.program]]; [[cal.1963-11-27.succession]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - poverty
      - economy
      - civil-rights-bill
      - medicare
      - jobs-and-wages
      - cities-and-housing
      - immigration
      - testing
  - id: cal.1964-01-09.latin-america
    when: Jan. 9–16
    date: '1964-01-09'
    thread: latin-america
    c: 'Panama. Jan. 9, Panamanian students carry their flag to Balboa High School in the Canal Zone, where Zone students have raised the American flag; it is torn. Three days of rioting along the Zone and in Colón: about 22 Panamanians and four American soldiers killed. Jan. 10, Chiari breaks relations; Johnson telephones him, sends Mann and Vance. Chiari''s terms: "structural revision" of the 1903 treaty. Jan. 15, the Inter-American Peace Committee''s formula, "negociar" read as discuss in Washington, negotiate in Panama. Check the count of dead.'
    n: '[White House Statement on the Events in Panama](https://www.presidency.ucsb.edu/documents/white-house-statement-the-events-panama) (Jan. 10, 1964); [White House Statement Concerning U.S. Readiness To Carry On Discussions With Panama](https://www.presidency.ucsb.edu/documents/white-house-statement-concerning-us-readiness-carry-discussions-with-panama) (Jan. 16, 1964). FRUS 1964–68, XXXI, docs. [368](https://history.state.gov/historicaldocuments/frus1964-68v31/d368), [370](https://history.state.gov/historicaldocuments/frus1964-68v31/d370), [372](https://history.state.gov/historicaldocuments/frus1964-68v31/d372), [373](https://history.state.gov/historicaldocuments/frus1964-68v31/d373), [379](https://history.state.gov/historicaldocuments/frus1964-68v31/d379). LaFeber, *The Panama Canal*; Jorden, *Panama Odyssey*; McPherson, *Yankee No!*; Rabe, *The Killing Zone* (K–J Adm. II.D). Johnson, *The Vantage Point*; Beschloss, *Taking Charge* (K–J Adm. II.G.3). Dallek, *Flawed Giant* (K–J Adm. II.A). See [[cal.1963-03-18.latin-america]]. Names: Johnson (K–J Adm. III.D); Vance (K–J Adm. III.F).'
    tags: [name:chiari-roberto-f, name:johnson-lyndon-b, name:mann-thomas-c, name:vance-cyrus]
  - id: cal.1964-01-09.civil-rights-bill
    when: Jan. 9–31
    date: '1964-01-09'
    thread: civil-rights-bill
    c: 'Smith''s Rules Committee opens hearings on the civil rights bill, as he promised in December. Jan. 30, it grants a rule, H. Res. 616: ten hours of general debate, the Judiciary Committee''s substitute in order. 11–4; check the vote. Jan. 31, the House takes it up.'
    n: '[110 Cong. Rec., House, Jan. 31, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-2-2.pdf). Whalen, *The Longest Debate*; Loevy, *To End All Segregation*; Risen, *The Bill of the Century*; Purdum, *An Idea Whose Time Has Come* (K–J Cong. II.C). Dierenfield, *Keeper of the Rules* (K–J Cong. II.I.2). See [[cal.1963-12-09.civil-rights-bill]]. Names: Smith (K–J Cong. III.D).'
    tags: [name:smith-howard-w]
  - id: cal.1964-01-11.health
    when: Jan. 11
    date: '1964-01-11'
    thread: health
    c: 'The Surgeon General''s advisory committee reports, *Smoking and Health*: cigarette smoking causally related to lung cancer in men; "a health hazard of sufficient importance in the United States to warrant appropriate remedial action." Terry releases it on a Saturday.'
    n: Surgeon General's Advisory Committee on Smoking and Health, [*Smoking and Health*](https://profiles.nlm.nih.gov/spotlight/nn/catalog/nlm:nlmuid-101584932X202-doc) (PHS Pub. No. 1103, 1964). Brandt, *The Cigarette Century* (K–J Adm. II.B).
    tags: [name:terry-luther-l]
  - id: cal.1964-01-15.transition-and-staff
    when: Jan. 15–24
    date: '1964-01-15'
    thread: transition-and-staff
    c: Sorensen resigns as Special Counsel, to write his book on Kennedy; he leaves Feb. 29. Jan. 21, Murrow resigns from the USIA, ill; Rowan, ambassador to Finland, to succeed him, sworn Feb. 28. Jan. 24, Hornig sworn as science adviser for Wiesner, back to MIT.
    n: '[Letter Accepting Resignation of Theodore C. Sorensen as Special Counsel to the President](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-theodore-c-sorensen-special-counsel-the-president) (Jan. 15, 1964); [Letter Accepting Resignation of Edward R. Murrow as Director, USIA](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-edward-r-murrow-director-usia) (Jan. 21, 1964); [Remarks at the Swearing In of Donald F. Hornig](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-donald-f-hornig-special-assistant-the-president-for-science-and) (Jan. 24, 1964); [Remarks at the Swearing In of Carl T. Rowan](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-carl-t-rowan-director-united-states-information-agency) (Feb. 28, 1964). Rowan named Jan. 21; check. Sorensen, *Counselor* (K–J Adm. II.G.2). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1963-09-30.transition-and-staff]]. Names: Sorensen, Wiesner (K–J Adm. III.B); Murrow (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f, name:sorensen-theodore-c, name:murrow-edward-r, name:rowan-carl-t, name:hornig-donald-f, name:wiesner-jerome-b]
  - id: cal.1964-01-17.opinion
    when: Jan. 17
    date: '1964-01-17'
    thread: opinion
    also: [economy, civil-rights-bill, medicare]
    c: 'Gallup, Jan. 2–7: what Congress should do when it meets. Tax reduction first; civil rights second; medical care for older persons third; then federal spending, aid to education, foreign problems, unemployment.'
    n: '*The Gallup Poll*, III, 1859–60 (K–J Cong. II.E).'
  - id: cal.1964-01-17.robert-kennedy
    when: Jan. 17–24
    date: '1964-01-17'
    thread: robert-kennedy
    also: [india-and-china]
    c: 'Robert Kennedy, sent by Johnson, on Indonesia''s confrontation of Malaysia. Tokyo, Jan. 17–18, with Sukarno; Kuala Lumpur and Manila; Djakarta, Jan. 23: Sukarno agrees to order a cease-fire, and to a meeting of the foreign ministers of Indonesia, Malaysia, and the Philippines at Bangkok, Feb. 5–6. Then Bangkok and London.'
    n: 'FRUS 1964–68, XXVI, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v26/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v26/d16), [23](https://history.state.gov/historicaldocuments/frus1964-68v26/d23). Jones, *Conflict and Confrontation in South East Asia* (Viet. II.F.17). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:sukarno]
  - id: cal.1964-01-19.opinion
    when: Jan. 19
    date: '1964-01-19'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, Jan. 2–7: Democrats'' choice for Vice President: Robert Kennedy 34, Stevenson 26, Humphrey 14, Shriver 8, Brown 5, Fulbright 2, McCarthy 2, Wagner 2; others, no preference 7. Independents: Stevenson 26, Robert Kennedy 25, Humphrey 13.'
    n: '*The Gallup Poll*, III, 1860 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Shriver (K–J Adm. III.G); Humphrey (K–J Cong. III.A); Fulbright, McCarthy (K–J Cong. III.B); Brown, Wagner (K–J Cong. III.F).'
    tags: [name:kennedy-robert-f, name:stevenson-adlai-e, name:shriver-r-sargent, name:humphrey-hubert-h, name:fulbright-j-william, name:mccarthy-eugene-j, name:brown-edmund-g, name:wagner-robert-f-jr]
  - id: cal.1964-01-20.economy
    when: Jan. 20
    date: '1964-01-20'
    thread: economy
    c: 'Economic Report. GNP at a $600 billion rate in the fourth quarter; unemployment 5.5 percent. With the tax cut, $623 billion in 1964. The guideposts reaffirmed. The Council''s second chapter, "The Problem of Poverty in America": a family under $3,000 a year poor; one family in five.'
    n: '[Annual Message to the Congress: The Economic Report of the President](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-economic-report-the-president-13) (Jan. 20, 1964). [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000). Council of Economic Advisers, *Annual Report* (Jan. 1964), ch. 2 (K–J Adm. II.H.3). Heller, *New Dimensions of Political Economy*; Stein, *The Fiscal Revolution in America* (K–J Adm. II.B). See [[cal.1963-01-24.economy]]. Names: Johnson (K–J Adm. III.D); Heller (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:heller-walter-w]
  - id: cal.1964-01-21.economy
    when: Jan. 21
    date: '1964-01-21'
    thread: economy
    c: Budget for fiscal 1965. Expenditures $97.9 billion, $500 million under 1964 and $900 million under the 1964 request; receipts $93.0 billion; deficit $4.9 billion. Defense down more than $1 billion. Civilian employment cut, the first budget to do so since the count began in 1956.
    n: '[Annual Budget Message to the Congress, Fiscal Year 1965](https://www.presidency.ucsb.edu/documents/annual-budget-message-the-congress-fiscal-year-1965) (Jan. 21, 1964); [Remarks to Members of the Budget Bureau Staff at the Signing of the 1965 Budget](https://www.presidency.ucsb.edu/documents/remarks-members-the-budget-bureau-staff-the-signing-the-1965-budget) (Jan. 20, 1964). Morgan, *Deficit Government* (K–J Adm. II.B). See [[cal.1963-12-27.succession]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-21.testing
    when: Jan. 21
    date: '1964-01-21'
    thread: testing
    c: 'Geneva. The Eighteen-Nation Disarmament Committee resumes; Foster reads Johnson''s message. Five proposals: no force to change boundaries; a verified freeze on strategic nuclear vehicles; a halt to fissionable material for weapons, plant by plant meanwhile; observation posts against surprise attack; no transfer of nuclear weapons to national control.'
    n: '[Message to the 18-Nation Disarmament Conference in Geneva](https://www.presidency.ucsb.edu/documents/message-the-18-nation-disarmament-conference-geneva); [Statement by the President on the Reopening of the Geneva Disarmament Conference](https://www.presidency.ucsb.edu/documents/statement-the-president-the-reopening-the-geneva-disarmament-conference) (Jan. 21, 1964); [Letter to Chairman Khrushchev on the Eve of the Reopening of the Geneva Disarmament Conference](https://www.presidency.ucsb.edu/documents/letter-chairman-khrushchev-the-eve-the-reopening-the-geneva-disarmament-conference) (Jan. 20, 1964). Bundy, *Danger and Survival* (K–J Adm. II.G.2). *Lyndon Johnson Confronts the World* (K–J Adm. II.D). See [[cal.1963-10-07.testing]]. Names: Johnson (K–J Adm. III.D); Khrushchev (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:foster-william-c, name:khrushchev-nikita-s]
  - id: cal.1964-01-23.voting-rights
    when: Jan. 23
    date: '1964-01-23'
    thread: voting-rights
    c: 'South Dakota ratifies the Twenty-fourth Amendment, the thirty-eighth State: no poll tax in federal elections. Certified Feb. 4, [78 Stat. 1117](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg1117.pdf), Johnson watching, a first. Poll taxes stand for State elections in Alabama, Arkansas, Mississippi, Texas, and Virginia.'
    n: '[Statement by the President Announcing the Adoption of the 24th Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-the-adoption-the-24th-amendment-the-constitution) (Jan. 23, 1964); [Remarks Upon Witnessing the Certification of the 24th Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/remarks-upon-witnessing-the-certification-the-24th-amendment-the-constitution) (Feb. 4, 1964). U.S. Const. amend. XXIV (K–J Cong. II.J.2). Lawson, *Black Ballots* (K–J Cong. II.C). See [[cal.1962-08-27.voting-rights]]; [[cal.1963-03-22.voting-rights]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:holland-spessard-l, name:boutin-bernard-l]
  - id: cal.1964-01-23.rules
    when: Jan. 23
    date: '1964-01-23'
    thread: rules
    also: [congress]
    c: 'Senate adopts Pastore''s germaneness rule, S. Res. 89, [57–25](https://voteview.com/rollcall/RS0880234): debate germane to the pending business for three hours after the morning hour, unless waived. Jan. 30, S. Res. 111, committees to sit through the morning hour, [47–33](https://voteview.com/rollcall/RS0880237); Clark''s amendments to let them sit while the Senate debates lost, [36–43](https://voteview.com/rollcall/RS0880235), [34–45](https://voteview.com/rollcall/RS0880236).'
    n: '[110 Cong. Rec., Senate, Jan. 23, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-12-2.pdf); [110 Cong. Rec., Senate, Jan. 30, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-1-1.pdf). See [[cal.1963-02-07.rules]]; [[cal.1963-02-19.congress]]. Names: Clark (K–J Cong. III.B).'
    tags: [name:pastore-john-o, name:clark-joseph-s]
  - id: cal.1964-01-23.baker
    when: Jan. 23
    date: '1964-01-23'
    thread: baker
    c: 'Johnson, at a news conference called for 5 p.m.: insurance on his life, bought in 1957 by the family company, Reynolds taking a commission; $78,000 in premiums paid. The stereo set a gift of "the Baker family." Reynolds''s testimony to the Rules Committee, in closed session, Jan. 9, made public. Check the date.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1043) (Jan. 23, 1964). *Construction of the District of Columbia Stadium and Matters Related Thereto* (K–J Cong. II.J.3). Baker, *Wheeling and Dealing* (K–J Cong. II.I.1). Caro, *The Passage of Power* (K–J Adm. II.F). See [[cal.1963-11-22.baker]]. Names: Johnson (K–J Adm. III.D); Reynolds, Baker (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:reynolds-don-b, name:baker-robert-g]
  - id: cal.1964-01-25.europe-and-the-alliance
    when: Jan. 25–Feb. 15
    date: '1964-01-25'
    thread: europe-and-the-alliance
    c: Cyprus, fighting between Greek and Turkish Cypriots since Dec. 21; the guarantor powers' conference in London broken down. Britain asks American troops for an allied force. Jan. 25–28, Johnson, with Ball, McNamara, and Taylor, lets Ball explore a NATO force of 10,000 with a token American battalion of 1,200, and a mediator. Ball to London, Athens, Ankara, and Nicosia, Feb. 9–14. Makarios refuses a force from NATO countries; Feb. 15, Britain goes to the Security Council first.
    n: 'FRUS 1964–68, XVI, docs. [3](https://history.state.gov/historicaldocuments/frus1964-68v16/d3), [4](https://history.state.gov/historicaldocuments/frus1964-68v16/d4), [10](https://history.state.gov/historicaldocuments/frus1964-68v16/d10), [11](https://history.state.gov/historicaldocuments/frus1964-68v16/d11), [15](https://history.state.gov/historicaldocuments/frus1964-68v16/d15). Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Nicolet, *United States Policy Towards Cyprus, 1954–1974*; Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). Names: Johnson (K–J Adm. III.D); Ball (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F).'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:mcnamara-robert-s, name:taylor-maxwell, name:makarios-iii]
  - id: cal.1964-01-27.europe-and-the-alliance
    when: Jan. 27
    date: '1964-01-27'
    thread: europe-and-the-alliance
    also: [vietnam]
    c: 'France and the People''s Republic of China announce recognition. Johnson keeps the protest low; Chiang asked not to break with Paris first. De Gaulle, Jan. 31: no neutrality in Southeast Asia without China. Feb. 10, Taipei ends relations with France.'
    n: '[FRUS 1964–68, XXX, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v30/d2); [FRUS 1964–68, XXX, doc. 12](https://history.state.gov/historicaldocuments/frus1964-68v30/d12); [FRUS 1964–68, I, doc. 27](https://history.state.gov/historicaldocuments/frus1964-68v01/d27). Schwartz, *Lyndon Johnson and Europe*; Logevall, *Choosing War* (K–J Adm. II.D). Bohlen, *Witness to History* (K–J Adm. II.G.4). See [[cal.1963-01-14.europe-and-the-alliance]]. Names: de Gaulle (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:de-gaulle-charles, name:chiang-kai-shek]
  - id: cal.1964-01-27.elections-1964
    when: Jan. 27
    date: '1964-01-27'
    thread: elections-1964
    c: 'Margaret Chase Smith announces for the Republican nomination, at the Women''s National Press Club: "I have few illusions and no money, but I''m staying for the finish."'
    n: 'White, *The Making of the President 1964* (Opp. II.E). Smith, *Declaration of Conscience* (Opp. II.G.1). See [[cal.1964-01-03.elections-1964]]. Names: Smith (Opp. III.A).'
    tags: [name:smith-margaret-chase]
  - id: cal.1964-01-27.cities-and-housing
    when: Jan. 27
    date: '1964-01-27'
    thread: cities-and-housing
    c: Housing message. Public housing, 50,000 units a year for four years, and 40,000 leased; urban renewal, $1.4 billion more for two years; loans for the elderly; grants and loans toward new communities. The mass transit bill the Senate passed. A Department of Housing and Community Development.
    n: '[Special Message to the Congress on Housing and Community Development](https://www.presidency.ucsb.edu/documents/special-message-the-congress-housing-and-community-development-0) (Jan. 27, 1964). See [[cal.1962-01-24.program]]; [[cal.1963-04-04.program]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-29.space
    when: Jan. 29
    date: '1964-01-29'
    thread: space
    c: Saturn I, two stages, puts some 37,000 pounds in orbit, the largest payload yet; liquid hydrogen proved as a fuel.
    n: '[Statement by the President Following the Launching of the First Satellite by Saturn I](https://www.presidency.ucsb.edu/documents/statement-the-president-following-the-launching-the-first-satellite-saturn-i) (Jan. 29, 1964). See [[cal.1963-11-29.space]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-01-30.vietnam
    when: Jan. 30
    date: '1964-01-30'
    thread: vietnam
    c: 'Saigon. Nguyễn Khánh takes power without bloodshed; Dương Văn Minh, Trần Văn Đôn, Lê Văn Kim held. Lodge and Harkins: Khánh feared the junta was dealing with the French toward neutralization. Feb. 1, Johnson: neutralization of the South alone, no; "the operations should be stepped up."'
    n: 'FRUS 1964–68, I, docs. [22](https://history.state.gov/historicaldocuments/frus1964-68v01/d22), [24](https://history.state.gov/historicaldocuments/frus1964-68v01/d24), [31](https://history.state.gov/historicaldocuments/frus1964-68v01/d31). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1048) (Feb. 1, 1964). Ahern, *The CIA and the Generals*; Shaplen, *The Lost Revolution*; Lam, *The History of South Vietnam* (Viet. II.E.5). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War*; VanDeMark, *Into the Quagmire* (K–J Adm. II.D). See [[cal.1963-12-21.vietnam]]. Names: Nguyễn Khánh, Dương Văn Minh, Trần Văn Đôn (Viet. III.G); Lodge (Viet. III.C); Harkins (Viet. III.D); Johnson (K–J Adm. III.D).'
    tags: [name:nguyen-khanh, name:duong-van-minh, name:tran-van-don, name:le-van-kim, name:lodge-henry-cabot, name:harkins-paul-d, name:johnson-lyndon-b]
  - id: cal.1964-01-31.opinion
    when: Jan. 31
    date: '1964-01-31'
    thread: opinion
    also: [succession]
    c: 'Gallup, Jan. 2–7: 53 percent have followed the discussion of presidential succession. Of them, the Secretary of State to succeed in place of the Speaker, 46 for, 36 against.'
    n: '*The Gallup Poll*, III, 1862 (K–J Cong. II.E).'
  - id: cal.1964-01-31.mississippi
    when: Jan. 31
    date: '1964-01-31'
    thread: mississippi
    c: 'Liberty, Amite County. Louis Allen, who saw Hurst kill Herbert Lee in 1961 and testified to self-defense, then told SNCC, the FBI and the Civil Rights Commission otherwise, shot dead at his gate the night before he was to leave the State. The FBI had referred his reports of threats to the Highway Patrol. Its inquiry closed in May: no voting work, so no federal jurisdiction.'
    n: 'Civil Rights Division, [Notice to Close File, Louis Allen](https://www.justice.gov/crt/case-document/file/1194136/dl) (May 19, 2015). Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom* (K–J Cong. II.F). See [[cal.1961-09-25.mississippi]]. Made public: the Civil Rights Division''s notice closing the file, May 19, 2015, from the FBI''s memoranda of 1961–64. Names: Allen, Hurst (K–J Cong. III.K); Lee (K–J Cong. III.H).'
    tags: [name:allen-louis, name:hurst-e-h, name:lee-herbert]
