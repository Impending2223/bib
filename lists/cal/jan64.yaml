    when: Jan. 12
    date: '1964-01-12'
    thread: africa
    also: [europe-and-the-alliance]
    c: Zanzibar. African revolutionaries overthrow the Arab-led government, a month after independence; a republic, Karume its President.
    n: '[FRUS 1964–68, XXIV, doc. 181](https://history.state.gov/historicaldocuments/frus1964-68v24/d181) (Jan. 29). [[w.petterson-revolution-in-zanzibar]]. Names: Karume.'
