  - id: cal.1964-01-07.goldwater
    when: Jan. 7
    date: '1964-01-07'
    thread: goldwater
    also: [elections-1964]
    c: 'Concord, N.H., the campaign''s first week: "I would like to suggest one change, that social security be made voluntary." Rockefeller takes it up; Goldwater denies he would wreck the system.'
    n: 'Quoted with its date in Humphrey''s speech at Bakersfield, Cal., 1964 ([Humphrey papers, MNHS](https://www2.mnhs.org/library/findaids/00442/pdfa/00442-01375.pdf)); the Democrats'' spot ["Social Security"](https://www.livingroomcandidate.org/commercials/1964/social-security) (1964). [[w.white-making-of-the-president-1965]]; [[w.perlstein-before-the-storm]]. See [[cal.1964-01-03.elections-1964]]. Names: Goldwater, Rockefeller.'
    tags: [name:goldwater-barry-m, name:rockefeller-nelson]
  - id: cal.1964-01-08.program
    when: Jan. 8
    date: '1964-01-08'
    thread: program
    c: State of the Union. "This administration today, here and now, declares unconditional war on poverty in America." The civil rights bill to pass this session; the tax bill by Feb. 1, withholding at 14 percent; hospital insurance under Social Security; Appalachia, youth employment, food stamps, a National Service Corps, the minimum wage to 2 million more; immigrants chosen by skill and family, not birthplace. Budget $97.9 billion, $500 million under the current year; the deficit halved, to $4.9 billion. Enriched uranium cut 25 percent.
    n: '[Annual Message to the Congress on the State of the Union](https://www.presidency.ucsb.edu/documents/annual-message-the-congress-the-state-the-union-25) (Jan. 8, 1964). [110 Cong. Rec., House, Jan. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-2-2.pdf). Recording (K–J Adm. II.I). [[w.johnson-vantage-point]]; [[w.dallek-flawed-giant]]; [[w.matusow-unraveling-of-america]]; [[w.caro-passage-of-power]]; [[w.gillette-launching-the-war-on]]; [[w.sundquist-politics-and-policy]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1963-01-14.program]]; [[cal.1963-11-27.succession]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - poverty
      - economy
      - civil-rights-bill
      - medicare
      - jobs-and-wages
      - cities-and-housing
      - immigration
      - testing
  - id: cal.1964-01-09.latin-america
    when: Jan. 9–11
    date: '1964-01-09'
    thread: latin-america-panama
    c: 'Panama. Jan. 9, Panamanian students carry their flag to Balboa High School in the Canal Zone, where Zone students have raised the American flag; it is torn. Three days of rioting along the Zone and in Colón: about 22 Panamanians and four American soldiers killed. Check the count of dead.'
    n: FRUS 1964–68, XXXI, docs. [372](https://history.state.gov/historicaldocuments/frus1964-68v31/d372), [373](https://history.state.gov/historicaldocuments/frus1964-68v31/d373) (editorial note). [[w.lafeber-panama-canal]]; [[w.jorden-panama-odyssey]]; [[w.mcpherson-yankee-no]]; [[w.rabe-killing-zone]]; [[w.johnson-vantage-point]]; [[w.taking-charge]]; [[w.dallek-flawed-giant]]. See [[cal.1963-03-18.latin-america]].
  - id: cal.1964-01-09.civil-rights-bill
    when: Jan. 9
    date: '1964-01-09'
    thread: civil-rights-bill
    c: Smith's Rules Committee opens hearings on the civil rights bill, as he promised in December.
    n: 'Check: the record. [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1963-12-09.civil-rights-bill]]. Names: Smith.'
    tags: [name:smith-howard-w]
  - id: cal.1964-01-10.latin-america-panama
    when: Jan. 10
    date: '1964-01-10'
    thread: latin-america-panama
    c: 'Chiari breaks relations. Johnson telephones him, and sends Mann and Vance. Chiari''s terms: "structural revision" of the 1903 treaty.'
    n: '[White House Statement on the Events in Panama](https://www.presidency.ucsb.edu/documents/white-house-statement-the-events-panama) (Jan. 10, 1964). FRUS 1964–68, XXXI, docs. [368](https://history.state.gov/historicaldocuments/frus1964-68v31/d368), [370](https://history.state.gov/historicaldocuments/frus1964-68v31/d370). See [[cal.1964-01-09.latin-america]]. Names: Chiari, Johnson, Mann, Vance.'
    tags: [name:chiari-roberto-f, name:johnson-lyndon-b, name:mann-thomas-c, name:vance-cyrus]
  - id: cal.1964-01-11.health
    when: Jan. 11
    date: '1964-01-11'
    thread: health
    c: 'The Surgeon General''s advisory committee reports, *Smoking and Health*: cigarette smoking causally related to lung cancer in men; "a health hazard of sufficient importance in the United States to warrant appropriate remedial action." Terry releases it on a Saturday.'
    n: 'Surgeon General''s Advisory Committee on Smoking and Health, [*Smoking and Health*](https://profiles.nlm.nih.gov/spotlight/nn/catalog/nlm:nlmuid-101584932X202-doc) (PHS Pub. No. 1103, 1964). [[w.brandt-cigarette-century]]. Names: Terry.'
    tags: [name:terry-luther-l]
  - id: cal.1964-01-11.governors-la
    when: Jan. 11
    date: '1964-01-11'
    thread: governors
    also: [elections-1963]
    c: 'Louisiana''s Democratic runoff for governor: McKeithen 52.2 percent, Morrison 47.8. McKeithen carries every North Louisiana parish.'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1964_Louisiana_gubernatorial_election). See [[cal.1963-12-07.governors-la]]. Names: McKeithen, deLesseps Morrison.'
    tags: [name:mckeithen-john-j, name:morrison-delesseps-s, state:la]
