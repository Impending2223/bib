    n: 'Transcript of Broadcast on NBC''s "Huntley-Brinkley Report.", [1963 Pub. Papers 658](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=716) (Sept. 9, 1963). Kennedy, interview with Chet Huntley and David Brinkley (Viet. II.J). [[w.gibbons-u-s-government-and]], II, 163 (the interview with Huntley; the domino theory); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 288 (the interview; the domino principle). To check: [[w.watson-expanding-vista]]. See [[cal.1963-09-02.vietnam]]. Names: Huntley, Brinkley.'
