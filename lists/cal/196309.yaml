  - id: cal.1963-09-03.south-asia
    when: Sept. 3–5
    date: '1963-09-03'
    thread: south-asia
    c: 'Rawalpindi. Ball with Ayub Khan, late on Sept. 3; with Bhutto, his staff and the Pakistani command, Sept. 4, Quinn briefing them on what the United States could do for Pakistan; alone with Ayub, Sept. 5. Ayub: American arms for India undercut Pakistan; stop the arms race between them; Kashmir set aside for now. Ball: the threat China, not India; Pakistan not to be seduced by Peking.'
    n: '[[w.ball-past-has-another-pattern]], 283–85. See [[cal.1963-08-28.africa]]. Names: Ball, Ayub Khan, Bhutto, Quinn.'
    src:
      c: e11bebfb
      rows:
        - 'w.ball-past-has-another-pattern 283–85: all'
    tags: [name:ball-george-w, name:ayub-khan-mohammad, name:bhutto-zulfikar-ali, name:quinn-william-w]
    short: Ball's mission to Pakistan
  - id: cal.1963-09-03.robert-kennedy
    when: Sept. 3
    date: '1963-09-03'
    thread: robert-kennedy
    c: 'Robert Kennedy, back from fishing in Maine, hears Justin Feldman and overrules Katzenbach: Landis to serve his sentence under guard at the Columbia Presbyterian Hospital.'
    n: '[[w.navasky-kennedy-justice]], 388–89 (by Feldman''s account); [[w.thomas-robert-kennedy]], 261 (Kennedy over Katzenbach''s objection: "This is the best friend I ever had. Do it."). See [[cal.1963-08-30.robert-kennedy]]. Names: Robert Kennedy, Katzenbach, Landis. Check: the day (Navasky: the Tuesday after Labor Day); Bennett''s part.'
