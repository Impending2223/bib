    c: 'The Presidium, Khrushchev back from Yugoslavia: the Yugoslavs "close to us on most questions," but no "hundred-percent unity"; neither Leninists nor anti-Leninists; KGB men to study their border regime; perhaps in a few years the border open for free departure. Tito asks help in defense; Malinovsky to prepare. Dobrynin''s telegram on fishing vessels to Kosygin. Erroll, the British trade minister, to be received by Kosygin and Ustinov. Kosygin''s visit to Austria put off. The airfield at Conakry and gas for Afghanistan approved.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 735–37 (Protocol [113], Malin''s notes); [[w.prezidium-tsk-kpss-1954]], III, 555–64 (P 113/I–VI: the Yugoslav trip approved; Khrushchev''s note of Aug. 25 on fertilizers; Dobrynin''s cipher telegram of Aug. 31 on the Soviet fishing vessels off the American east coast, to Kosygin; Erroll''s reception, on Patolichev''s note of Aug. 31; Kosygin''s return visit to Austria; the Conakry airfield and gas for Afghanistan, the headings; coins of one ruble and fifty kopecks with a lettered edge; the headings of the Cairo telegram on the talk with Amer, the answer to Dejoie, the plenum). Made public: 2003. Names: Khrushchev, Tito, Malinovsky, Dobrynin, Kosygin.'
