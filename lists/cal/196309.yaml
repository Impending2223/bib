    n: '[FRUS 1961–63, IV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v04/d63) (Hilsman to Lodge, Sept. 5). [[w.gibbons-u-s-government-and]], II, 166; [[w.selverstone-kennedy-withdrawal]], 150 (Hilsman before the Far East Subcommittee, Sept. 5, two hours: "far-reaching doubts"; "heavy sledding" in the aid debate). [[w.mann-grand-delusion]], 289 (the telegram; the "heavy sledding"). Names: Hilsman, Lodge.'
