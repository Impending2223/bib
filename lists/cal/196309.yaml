  - id: cal.1963-09-06.china-leadership
    when: Sept. 6
    date: '1963-09-06'
    place: peking
    thread: china-four-cleanups
    also: [china-mao, china-economy]
    c: 'Huairen Hall.{1} The Central Work Conference opens (Sept. 6–27), Mao presiding.{2} Deng Xiaoping gives the agenda: 1964''s plan;{3} the added rural policies;{4} the line for industry (the main question);{5} the international question, the struggle against revisionism.{6} Schedule: Sept. 6–16 plan and rural; 17–22 industry resolution; 23–26 international. Zhou Enlai reports on the 1964 plan.{7} Peng Zhen 彭真 is among the 158 attending; the conference drafts "Some concrete policy questions of the rural socialist education movement."{8} Zhu De 朱德 attends; the draft is the "Later Ten Points" 后十条, and three more years of adjusting, consolidating, filling out and raising are settled, from 1963.{9} Chen Yun 陈云 is absent, ill.{10}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 6, 1963. [[w.zhou-enlai-nianpu-1949]], II, 577–78 (Sept. 6–27, 1963: the Central Committee''s work conference, chiefly on the line for China''s industry, the 1964 plan and rural work; Sept. 6 Zhou Enlai presides at the opening and explains the 1964 plan and the 1965 control figures: the Center agrees with Mao that 1963–65 be a transition stage of adjusting, consolidating, filling out and raising, with some growth, before the Third Five-Year Plan; then a fifteen-year design, a basically independent economic or industrial system and, within the century, a strong socialist country with the four modernizations; nine questions to be settled outside the conference); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 580 (Sept. 6–27, 1963; Liu attends the Central Work Conference, which takes up rural work, the 1964 plan and the line of industrial development and drafts the "Some concrete policies in the rural socialist education movement"; from Sept. 14 he is away in Korea and misses the later stage); [[w.macfarquhar-origins-of-the-cultural]], III, 343 (a central work conference in September discusses Peng Zhen''s report of July 4 on the movement); [[w.yang-shangkun-riji]], II, 312 (Sept. 6, 1963; the work conference''s plenary in the morning: Deng and Zhou announce the agenda; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1772 (Sept. 6–27, 1963; Deng attends the Central Work Conference, which takes up the line for industrial development, the 1964 plan and rural work; on the 6th, at the first plenary, he explains the agenda); [[w.mao-zedong-zhuan]], V, ch. 71 (the Central Work Conference Sept. 6–27: the 1964 plan, socialist education and rural work, the resolution on industry, international questions; who presided not given). [[w.peng-zhen-nianpu-1902]], IV, 289 (Sept. 6–27, 1963; Peng Zhen at the Central Work Conference in Peking, 158 attending: rural work, the 1964 plan, chiefly the line of industrial development; it drafts "Some concrete policy questions of the rural socialist education movement (minutes of the September 1963 Central Work Conference)"); [[w.zhu-de-nianpu-xinbian]], III, 1882–1883 (Sept. 6–27, 1963; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 at Peking 北京, on rural work, the 1964 plan and the growth of industry, which draws up the provisions on some concrete policies in the rural socialist education movement 《关于农村社会主义教育运动中一些具体政策的规定（草案）》 (the "Later Ten Points" 后十条) and settles three more years, from 1963, of adjustment, consolidation, filling out and raising); [[w.chen-yun-nianpu-xiuding]], III, 142 (Sept. 6–27: three more years of "adjust, consolidate, fill out, raise" from this year, a transition between the Second and Third Five-Year Plans; the Later Ten Articles on the rural socialist education movement drawn up; Chen Yun absent, ill); [[w.peng-zhen-nianpu-1902]], IV, 289; [[w.zhu-de-nianpu-xinbian]], III, 1882; [[w.chen-yun-nianpu-xiuding]], III, 142. Made public: 1996. Check: Zhou''s nianpu (II, 577) has Zhou Enlai preside at the opening session; this entry has Mao presiding. To check: the conference papers (the nianpu names: the 1964 plan, the rural measures, "On the development of industry"). Names: Mao Zedong, Deng Xiaoping, Zhou Enlai, Peng Zhen, Zhu De, Chen Yun.'
