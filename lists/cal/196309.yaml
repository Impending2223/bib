    also: [korea]
    c: 'The Foreign Ministry issues a statement on the United Nations General Assembly''s discussion of the Korean question, firmly supporting the statement of the DPRK Foreign Ministry of Sept. 25 (the editors'' note: it sternly condemns the 18th General Assembly''s again putting the Korean question on its agenda illegally, demands that U.S. aggressor troops leave South Korea and restates the just stand for peaceful unification). The statement says that the General Assembly''s renewed discussion is only to give the U.S. a pretext to go on occupying South Korea and to make new obstacles to Korea''s peaceful unification. Only the withdrawal of the U.S. aggressor troops from South Korea can ensure it.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 301 (Sept. 28, 1963).'
