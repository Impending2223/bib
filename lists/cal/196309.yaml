  - id: cal.1963-09-02.testing
    when: Sept. 2
    date: '1963-09-02'
    thread: testing
    also: [press-and-broadcasting]
    c: 'I. F. Stone, back from a month''s vacation, on the test ban: he feels like "a Rip Van Winkle ... pleasantly awakened to a world he never expected to see"; even the White House "speaking the language one heard earlier only from fringe groups like SANE which seemed to be crying in a nuclear wilderness."'
    n: '[[w.debenedetti-american-ordeal]], 63. To check: I. F. Stone, "Why and How Did Peace Suddenly Break Out?" *I. F. Stone''s Bi-Weekly*, Sept. 2, 1963, 1 (cited by [[w.debenedetti-american-ordeal]], 63 n.34). Names: Stone.'
    src:
      c: a0cdc5c9
      rows:
        - 'w.debenedetti-american-ordeal 63: all'
        - 'via w.debenedetti-american-ordeal 63 n.34: all'
    tags: [name:stone-i-f]
  - id: cal.1963-09-03.elections-1964
    when: Sept. 3
    date: '1963-09-03'
    thread: elections-1964
    c: 'New York. Rockefeller to Nixon, his neighbor, over a drink at his apartment the day after Labor Day, by Nixon''s account: "I''m going for the nomination." If Nixon supports him now, he will support Nixon in a deadlocked convention. Nixon declines.'
    n: '[[w.perlstein-before-the-storm]], 261–62; [[w.nixon-rn]], 251–52. See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller, Nixon.'
    src:
