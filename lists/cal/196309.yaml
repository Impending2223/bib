    when: Sept.
    date: 1963-09
    thread: europe-and-the-alliance
    c: 'McNamara proposes much larger withdrawals from Europe: all 80 B-47s from Britain and Spain; twelve fighter squadrons from France, Germany and Britain, tactical aircraft from 790 to 354; 30,000 Army support troops. The Joint Chiefs strongly object: Seventh Army left with "no sustained combat capability"; a division withdrawn "less unfavorable." State would bring home only the B-47s.'
