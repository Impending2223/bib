    c: 'Mao marks for Jiang Qing items in the *Cankao xiaoxi* of Sept. 25. Page 1: AFP''s Marcus on China''s material conditions and food much improved; AFP, the Soviet statement brings the dispute to a new stage. Page 4: Kyodo, American "containment" of China stuck everywhere; the *Christian Science Monitor* on Galbraith, former ambassador to India, urging trade with China; AP on Fulbright, chairman of the Senate Foreign Relations Committee, for relations with both China and the Soviet Union; the American reporter Barrett on imperialism''s fear of a strong China. To Jiang Qing: to be studied, not only read, several times over.{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1963. [[w.jianguo-yilai-mao-zedong]], XVII, 70 (Sept. 26, 1963; Mao''s note "pages 1 and 4 should be studied" and, to Jiang Qing, "reading without study is of no use; read several times over"; the circled items as note 1 lists them). Made public: 2013. To check: *Cankao xiaoxi*, Sept. 25, 1963; Cankao xiaoxi, Sept. 25, 1963, pages 1 and 4 (the circled items: AFP on China''s material conditions and food; AFP, "The Soviet statement brings the Sino-Soviet dispute to a new stage"; Kyodo, "The American policy of containing China hits a wall everywhere"; the Christian Science Monitor on Galbraith''s proposal of trade with China; AP on Fulbright; Barrett, "U.S. imperialism fears a strong China") (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 70 n.1). Names: Mao Zedong, Jiang Qing, Galbraith, Fulbright.'
