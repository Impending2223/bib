    c: 'Khrushchev, two notes to the Presidium.{1} Potatoes and vegetables for the cities: the specialized state farms right, the cities still short.{2} Mineral fertilizers: their export to stop by 1964 or be cut to a minimum, sold only to those "кому по политическим соображениям нельзя отказать" (whom on political grounds we cannot refuse); "самое глупое – экспортировать минеральные удобрения, а самим покупать зерно" (the most foolish thing is to export fertilizer and buy grain ourselves).{3}'
