  - id: cal.1963-09-06.opinion
    when: Sept. 6
    date: '1963-09-06'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Aug. 15–20: federal youth camps like the CCC, good idea 89 percent, poor 6.'
    n: '[[w.gallup-poll]], III, 1838.'
