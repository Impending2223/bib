    when: Sept. 5
    date: '1963-09-05'
    thread: vietnam-congress
    c: 'Lausche, chairman of the Far East Subcommittee, in the Senate: with Kennedy on the need for changes of policy and perhaps of personnel in Saigon; the attacks on the Buddhists "a grave mistake of policy."'
    n: '[109 Cong. Rec. 16,397](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-10-2.pdf) (1963). [[w.gibbons-u-s-government-and]], II, 166–67. Names: Lausche, Kennedy.'
