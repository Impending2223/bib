    c: 'Krulak and Mendenhall before Kennedy: Krulak, the war going well;{1} Mendenhall, the government near collapse.{2} Kennedy: "The two of you did visit the same country, didn''t you?"{3} McNamara: the United States has been trying to overthrow Diệm but has no alternative; it should go back to what it was doing three weeks before. Harriman is against; Taylor and McCone side with McNamara.{4}'
    n: 'FRUS 1961–63, IV, docs. [82](https://history.state.gov/historicaldocuments/frus1961-63v04/d82) (Krulak''s report), [83](https://history.state.gov/historicaldocuments/frus1961-63v04/d83). [[w.miller-misalliance]], 299; [[w.gibbons-u-s-government-and]], II, 171 (the reports; the President''s words by Mecklin''s memoir, "Were you two gentlemen in the same country?"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 288; [[w.schulimson-joint-chiefs-of-staff]], 361–363; [[w.moyar-triumph-forsaken]], 246–49; [[w.mcnamara-in-retrospect]], ch. 3 at n.20 (McNamara: "We have been trying to overthrow Diem, but we have no alternatives I am aware of....We should go back to what we were doing three weeks ago"; Harriman against; Taylor and McCone with McNamara). [[w.reeves-president-kennedy]], 595–97; [[w.bernstein-guns-or-butter]], 326 (a four-day inspection; Kennedy, "icily": "Were you two gentlemen in the same country?"); [[w.selverstone-kennedy-withdrawal]], 154 (Krulak and Mendenhall brief Kennedy, Sept. 10: the war going well in the countryside, politics scathing in the cities; Kennedy wonders whether they visited the same country); [[w.mann-grand-delusion]], 291 (Krulak and Mendenhall brief Kennedy Sept. 10: Krulak, "The shooting war is going ahead at an impressive pace"; Mendenhall, the civil government in Saigon "virtually broken down"; Kennedy: "The two of you did visit the same country, didn''t you?"); [[w.mcnamara-in-retrospect]], ch. 3 at n.20. [[w.preston-war-council]], 125 (Bundy sets Forrestal and Hilsman to write the policy papers). To check: Mendenhall''s report, FRUS 1961–63, IV, 144–45, 243–49 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 288 n.107); [FRUS 1961–63, IV, doc. 78](https://history.state.gov/historicaldocuments/frus1961-63v04/d78) (Saigon to State, Sept. 9, 1963; cited by [[w.moyar-triumph-forsaken]], 248 n.19); Smith, memorandum of conversation, Sept. 10, 1963, JFKL, NSF, Meetings & Memoranda, box 316 (cited by [[w.moyar-triumph-forsaken]], 249 n.21); Memorandum of conference with the President, Sept. 10, 1963 (Bromley Smith), National Security Files, box 316, Kennedy Library (cited by [[w.reeves-president-kennedy]], 595). See [[cal.1963-09-06.vietnam]]. Names: Krulak, Mendenhall, Kennedy, McNamara, Harriman, Taylor, McCone.'
