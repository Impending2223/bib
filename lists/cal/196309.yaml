  - id: cal.1963-09-07.cuba
    when: Sept. 7
    date: '1963-09-07'
    thread: cuba
    c: 'Castro, at the Brazilian embassy in Havana, to Daniel Harker of the AP: "United States leaders should think that if they assist in terrorist plans to eliminate Cuban leaders, they themselves will not be safe."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 547. To check: S. Rep. No. 94-755, bk. V, 14 (1976); [[w.johnson-bay-of-pigs]], 354 (cited by [[w.schlesinger-robert-kennedy-and-his]], 547 n.59). Names: Castro.'
