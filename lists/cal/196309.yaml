  - id: cal.1963-09-04.opinion
    when: Sept. 4
    date: '1963-09-04'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Aug. 15–20: a law giving Negroes the right to be served in hotels, restaurants, theaters, and the like, 54 percent for, 38 against. 19 would exempt small businesses; with them, 57 against a law that covers all.'
    n: '[[w.gallup-poll]], III, 1837.'
  - id: cal.1963-09-04.alabama-schools
    when: Sept. 4–5
    date: '1963-09-04'
    thread: alabama-schools
    also: [alabama-birmingham, desegregation-schools]
    c: Birmingham. Two Black children enrolled; that night Shores's house bombed; rioting, one man killed. Sept. 5, the city's schools closed at Wallace's request.
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). [[w.branch-parting-the-waters]], 888. Check: Branch, 888: five Negro students for three schools; Boutwell between Wallace and Burke Marshall, each told he wants the other''s troops out; a last-minute plea for delay on "inherent differences in the races"; after the bombing, one Negro killed, twenty-one to the hospital. See [[cal.1963-09-02.alabama]]. Names: Shores, Wallace.'
    src:
