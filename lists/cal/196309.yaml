  - id: cal.1963-09-06.china-leadership-5
    when: Sept. 6
    date: '1963-09-06'
    thread: china-polemic
    also: [soviet-union, china-bomb]
    c: 'Peking.{1} The editorial departments of the *Renmin ribao* and *Hongqi* print the first commentary on the CPSU Open Letter, "The origin and development of the differences between the leadership of the CPSU and ourselves."{2} It puts the parting at the Twentieth Congress, not in 1960 as the Letter has it.{3} On Mao''s wish it makes public for the first time the Soviet proposal of 1958 for a joint fleet and the Soviet tearing up in June 1959 of the agreement to give China an atomic bomb sample and its technical data. Three annexes go with it: the Chinese outline on peaceful transition of Jan. 10, 1957, the delegation''s statement at Bucharest of June 26, 1960, and the five proposals of the Reply of Sept. 10, 1960.{4}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 639–645 (Sept. 6; built on Deng Xiaoping''s first speech at the Moscow talks, which the leaders had approved before the delegation left, filled out and revised after its return; the editorial departments'' name, in use since 1956; the review of each piece by the writers'' group, Mao and the Standing Committee, 638–639; Mao''s wish for the disclosures, 643; the three annexes, 645); [[w.macfarquhar-origins-of-the-cultural]], III, 361–62 (the first group''s topic, the origin and development of the differences between the CPSU leadership and the Chinese; published Sept. 6); [[w.mao-zedong-zhuan]], V, ch. 71 (Sept. 6 the first commentary, "The origin and development of the differences between the leadership of the CPSU and ourselves"; it names Khrushchev). [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (the first of the nine commentaries, Sept. 6, 1963, to July 14, 1964); [[w.yang-jisheng-tiandi-fanfu]], I, 96 (the first of the nine commentaries, written by the Center''s anti-revisionist leading group under Deng Xiaoping: Kang Sheng, Wu Lengxi, Yao Zhen, Xiong Fu, Wang Li, Fan Ruoyu, Wu Jiang, Cui Qi); [[w.khoo-collateral-damage]], 16 (the first of the nine polemics, Sept. 6, 1963); [[w.chang-friends-and-enemies]], 249 (after the test ban treaty, through the rest of 1963 and into 1964, the Soviet and Chinese parties exchange the most strident polemics yet seen in the movement). To check: the commentary, *Renmin ribao*, Sept. 6, 1963 (the text); [[w.xiuquan-huiyi-yu-huainian]], 375 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 361 n.82); [[w.polemic-on-the-general]], 59–67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 362 n.86b); [[w.zhai-china-and-the-vietnam]], 127 (cited by [[w.khoo-collateral-damage]], 16 n.9a); [[w.macfarquhar-origins-of-the-cultural]], III, 360–364 (cited by [[w.khoo-collateral-damage]], 16 n.9b). See [[cal.1963-09.china-leadership]]. Names: Deng Xiaoping, Mao Zedong.'
