    also: [china-agriculture]
    c: 'Zhou Enlai at the Central work conference on several important home questions: grain, cotton, relief, the plan. After two years of adjustment an all-round recovery has begun; this year''s disasters show farming still at nature''s mercy; strive for fast, prepare for slow; proportions not to be copied. Because of the disasters the grain plan changes: purchase more than reported, sales less, transfers up of 6.8 billion jin as before. Relief: production first, then collective effort, then state aid. The 1964 plan leaves a gap of about 1.5 billion yuan, to be raised from bureaucracy by a great purge.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 580 (Sept. 19, 1963); [[w.jian-zhou-enlai]], 488 (Sept. 19: with the improvement it is easy to grow overoptimistic; China still backward). Continues 581. Made public: 1997. Names: Zhou Enlai.'
