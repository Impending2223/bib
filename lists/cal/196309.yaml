    also: [soviet-union, china-mao-foreign, china-foreign]
    c: 'Huairen Hall, afternoon. Mao presides at the Work Conference''s last plenary, and speaks.{1} All feared the situation, the international above all; some feared Soviet–American collaboration; he trusts Wang Xifeng''s line, "the great have great troubles"; both the United States and the Soviet Union are in difficulty. Rostow ("chairman of the American policy council," 罗斯特 in the nianpu) has written an article whose tone is that both met troubles that have no solution.{2} Deng Xiaoping sums up: the four items done; the documents on socialist education in the villages, on the plan, grain and the like in the main settled.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 27, 1963. [[w.zhou-enlai-nianpu-1949]], II, 581–82 (Sept. 27, 1963: Zhou Enlai speaks at the Work Conference''s closing session on the arrangement of the 1964 plan: capital construction next year to rise a little, with enough for basic industry, transport, defense industry and culture and education; investment used without waste, by four rules; a farm bank to be set up to manage the funds for farming); [[w.yang-shangkun-riji]], II, 316 (Sept. 27, 1963; the work conference ends: the plenary at Huairen Tang, 4 to 6 p.m., Deng, Zhou and Mao speaking; Yang there); [[w.deng-xiaoping-nianpu-1904]], III, 1772 (Sept. 27, 1963; Deng sums up the conference''s discussion at the closing session); [[w.mao-zedong-zhuan]], V, ch. 71 (Sept. 27 Mao on the international situation at the Central Work Conference, after Yang Shangkun reads the embassy''s analysis of Sept. 25: all fear the situation, Soviet–American collaboration; "the great have great troubles"; Rostow''s article; two intermediate zones; the line "hold to principle, hold to unity, struggle firmly, leave room, strike after the other, oppose a split"; the day by the conference''s close; who presided not given). [[w.mao-zedong-zhuan]], VI, ch. 72 (Sept. 27 Mao on the work of the nation: the rural ten points and the city five-antis lay the ground against revisionism at home, which takes in ideology, literature, arts, song and dance, drama and film (n.19)). [[w.peng-zhen-nianpu-1902]], IV, 292 (Sept. 27, 1963, afternoon; Peng Zhen at the closing session of the Central Work Conference, Mao presiding, 262 there with those at the city work conference and the planning commissions'' heads); [[w.zhu-de-nianpu-xinbian]], III, 1883 (Sept. 27, 1963; Zhu De 朱德 speaks at the conference: the foundation of socialism to be built well, above all a solid base for farming, to go forward steadily). Made public: 1997. To check: Rostow''s article as Mao read it (the nianpu: "罗斯特", chairman of the policy planning body); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议, Sept. 27, 1963 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.29); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议, Sept. 27, 1963 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.19). See [[cal.1963-09-23.china-leadership]]. Names: Mao Zedong, Rostow, Deng Xiaoping. Check: the article.'
