  - id: cal.1963-09-02.alabama
    when: Sept. 2
    date: '1963-09-02'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Alabama's schools to open under court orders. Wallace's troopers close Tuskegee High.
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). [[w.whalen-longest-debate]], 33 (troopers into Tuskegee, Huntsville, Mobile and Birmingham; not Tuskegee High). To check: [[w.carter-politics-of-rage-1995]]; [[w.mcwhorter-carry-me-home]]; [[w.marshall-federalism-and-civil-rights]]; [[w.brauer-john-f-kennedy-and]]. See [[cal.1963-06-11.alabama]]. Names: Wallace.'
