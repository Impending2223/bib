    c: 'Church offers S. Res. 196, with Carlson and twenty-one others: aid to Saigon to end unless it abandons repression and regains its people''s support.{1} The text drafted at State;{2} the President''s conference of Sept. 11 for introducing it, hearings to wait.{3} Church: "To persist in the support of such a regime can only serve to identify the United States with the cause of religious persecution."{4}'
    n: '[109 Cong. Rec. 16,824](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-15-1.pdf) (1963). FRUS 1961–63, IV, docs. [84](https://history.state.gov/historicaldocuments/frus1961-63v04/d84) (Hilsman and Church, Sept. 10), [94](https://history.state.gov/historicaldocuments/frus1961-63v04/d94) (Sept. 11). [[w.gibbons-u-s-government-and]], II, 167–68; [[w.sen-church-alleged-assassination-plots]], 220 (Church, "with White House approval," introduced a resolution condemning the South Vietnamese government''s handling of the Buddhists and ending aid unless the repression eased; not S. Res. 196, the cosponsors, State''s draft or Church''s words). [[w.mann-grand-delusion]], 289–90 (the text; Bundy''s "Good idea. Keep going"; the offer; Church''s words). To check: the note to Hilsman of Sept. 12, 1963, Thomson Papers, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], II, 168 n.91, for the drafting). See [[cal.1963-09-06.vietnam]]. Names: Church, Carlson.'
