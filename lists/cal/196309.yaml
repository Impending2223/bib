  - id: cal.1963-09-09.alabama
    when: Sept. 9–10
    date: '1963-09-09'
    thread: alabama-schools
    also: [desegregation-schools]
    c: 'Alabama''s federal district judges, all of them, enjoin Wallace from blocking the schools, Sept. 9; he sends the Guard instead. Sept. 10: Kennedy federalizes the Alabama Guard and sends it from the schools. Black pupils enter in Birmingham and Mobile.'
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). [Proclamation 3554](https://www.presidency.ucsb.edu/documents/proclamation-3554-obstructions-justice-the-state-alabama); [Exec. Order No. 11,118](https://www.presidency.ucsb.edu/documents/executive-order-11118-providing-assistance-for-removal-unlawful-obstructions-justice-the), [28 Fed. Reg. 9863](https://www.govinfo.gov/app/details/FR-1963-09-11) (1963). *United States v. Wallace*, [222 F. Supp. 485](https://static.case.law/f-supp/222/case-pdfs/0485-01.pdf) (M.D. Ala. 1963) (the preliminary injunction, Sept. 24). To check: [[w.bass-taming-the-storm]]. See [[cal.1963-09-02.alabama]]. Names: Wallace.'
    tags: [name:wallace-george-c, name:kennedy-john-f]
  - id: cal.1963-09-10.program
    when: Sept. 10
    date: '1963-09-10'
    thread: health
    c: House passes the mental retardation facilities and community mental health centers bill, $238 million over three years, [335–18](https://voteview.com/rollcall/RH0880065).
    n: '[109 Cong. Rec., House, Sept. 10, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-13-2.pdf). To check: [[w.foley-community-mental-health-legislation]]. See [[cal.1963-02-05.program]].'
