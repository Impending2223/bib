  - id: cal.1963-09-28.china-leadership
    when: Sept. 28
    date: '1963-09-28'
    place: peking
    thread: china-mao-foreign
    also: [soviet-union, china-foreign]
    c: 'Yinian Tang, afternoon. Mao, with Wang Enmao of Xinjiang, Luo Ruiqing, He Long, Xiao Hua, Xie Fuzhi, Zhou Enlai, Zhu De, Chen Yi and Yang Chengwu, on Xinjiang in the struggle against revisionism and on military preparation. First the economy: farms, herds and industry better every year, and the people''s life better than under the Kuomintang and than in the Soviet Union now; then politics in command, education against revisionism, the nationalities policy; the Han settlers to respect local custom and learn the languages; the border watched.{1} He proposes, Lin Biao being long ill, that He Long run the Military Commission''s daily work.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 28, 1963. [[w.zhou-enlai-nianpu-1949]], II, 582 (Sept. 28, 1963: Zhou Enlai at Mao''s meeting on Xinjiang with Zhu De, Chen Yi, He Long, Luo Ruiqing, Liu Lantao and Wang Enmao; Mao: first solve the economy, production to grow, the economy to flourish and living to improve each year); [[w.jianguo-yilai-mao-zedong]], XVII, 71–72 (Sept. 28, 1963; Mao''s note of the morning of Sept. 28 asking Wang Enmao to stay a day, return to Xinjiang on the 29th, and join eight others (Luo Ruiqing, He Long, Xiao Hua, Xie Fuzhi, Zhou Enlai, Zhu De, Chen Yi, Yang Chengwu) that afternoon in the Yinian Tang, Zhongnanhai, on Xinjiang''s struggle against revisionism and military preparation; the talk as note 3 gives it (the economy first; politics in command; the Han settlers; the border)); [[w.zhu-de-nianpu-xinbian]], III, 1884 (Sept. 28, 1963; in the afternoon Zhu De 朱德 at the meeting Mao Zedong 毛泽东 calls in the Yinian Tang 颐年堂 on work in Xinjiang 新疆). Made public: 1997. Names: Mao Zedong, Wang Enmao, Luo Ruiqing, He Long, Xiao Hua, Xie Fuzhi, Zhou Enlai, Zhu De, Chen Yi, Yang Chengwu, Lin Biao.'
