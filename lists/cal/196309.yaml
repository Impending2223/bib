  - id: cal.1963-09-05.vietnam-congress-3
    when: Sept. 5
    date: '1963-09-05'
    thread: vietnam-congress
    c: Church says he may offer a resolution to end aid to Saigon unless Diệm reforms; Carlson would support it.
    n: '[FRUS 1961–63, IV, doc. 70](https://history.state.gov/historicaldocuments/frus1961-63v04/d70) (to Lodge, Sept. 6: to use "statements of Lausche and Church" with Diệm). [[w.gibbons-u-s-government-and]], II, 167. See [[cal.1963-09-12.vietnam]]. Names: Church, Carlson, Ngô Đình Diệm.'
