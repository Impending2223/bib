  - id: cal.1963-09-02.goldwater
    when: Sept. 2
    date: '1963-09-02'
    thread: goldwater
    also: [elections-1964]
    c: Chicago, the Sheraton Chicago. O'Donnell announces the Draft Committee's Illinois Volunteers for Goldwater, John F. Milliken of Winnetka, Ill., its chairman, Patricia Hutar co-chairman; its office at 116 South Michigan Avenue. Goldwater in a Labor Day parade at Williams, Ariz., for the Senate, he says.
    n: '[[w.white-suite-3505]], 207. See [[cal.1963-04-08.elections-1964]]. Names: O''Donnell, Hutar, Goldwater.'
    src:
