    c: 'News conference.{1} On Vietnam: "we want the war to be won, the Communists to be contained, and the Americans to go home."{2} Church''s resolution "reflects his concern"; "we should stay there."{3} The opening statement on the test ban treaty: "if this small clearly beneficial step cannot be approved by the widest possible margin in the Senate, then this Nation cannot offer much leadership." On Goldwater''s Chicago speech, that not ten men know the truth about Cuba and the treaty: "There are no commitments." Further comment? "No, no. Not yet, not yet."{4}'
