entries:
  - id: cal.1963-09-01.opinion
    when: Sept. 1
    date: '1963-09-01'
    thread: opinion
    also: [testing]
    c: 'Gallup, Aug. 15–20: 60 percent have heard of the partial test ban. Of them, Senate approval, 63 for, 17 against; Goldwater''s supporters 52 for.'
    n: '[[w.gallup-poll]], III, 1837. Names: Goldwater.'
    tags: [name:goldwater-barry-m]
  - id: cal.1963-09-02.vietnam
    when: Sept. 2
    date: '1963-09-02'
    thread: vietnam
    also: [press-and-broadcasting, elections-1964]
    c: 'Cronkite at Hyannis Port, for CBS''s first half-hour evening news. Vietnam: "In the final analysis, it is their war." Success possible "with changes in policy and perhaps with personnel." Withdrawal "a great mistake." Civil rights and 1964: he will lose some Southern States, "maybe more"; he is not sure he is "the most popular political figure in the country today in the South."'
    n: 'Transcript of Broadcast With Walter Cronkite Inaugurating a CBS Television News Program, [1963 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=708) (Sept. 2, 1963). [FRUS 1961–63, IV, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v04/d50). Kennedy, interview with Walter Cronkite (Viet. II.J). [[w.miller-misalliance]], 295 (the interview; "With changes in policy and perhaps with personnel"); [[w.gibbons-u-s-government-and]], II, 163 (the interview''s words; not the place or the program); [[w.schulimson-joint-chiefs-of-staff]], 354 (the interview; their war; withdrawal a mistake); [[w.futrell-united-states-air-force]], 188–89 (the broadcast, Sept. 2; "changes in policy and perhaps with personnel"); [[w.moyar-triumph-forsaken]], 245–46, 278; [[w.sorensen-kennedy]], 658 (the interview); [[w.preston-war-council]], 123; [[w.mcnamara-in-retrospect]], ch. 3 at n.16. [[w.selverstone-kennedy-withdrawal]], 147 (the interview''s words; not the place or the program); [[w.schlesinger-robert-kennedy-and-his]], 711 (Sept. 2: "I don''t agree with those who say we should withdraw. That would be a great mistake"; the book names no occasion); [[w.mann-grand-delusion]], 288–89 (Kennedy to Cronkite of CBS, from Hyannis Port, Sept. 2: "In the final analysis, it is their war"; "I don''t agree with those who say we should withdraw ... That would be a great mistake"; not the first half-hour newscast, success "with changes in policy" or the Southern States). [[w.reeves-president-kennedy]], 586–89. [[w.ball-past-has-another-pattern]], 373 (the interview). [[w.young-two-suns-of-the]], 43 (to Cronkite, Sept. 2: he would lose some Southern States, but not give up the region). Check: the words on the South added from the Public Papers'' transcript (650–51), on Young''s notice (43); Young''s "refused to give up the entire region" is not in the transcript. To check: [[w.cronkite-reporters-life]]; [[w.brinkley-cronkite]]; [[w.watson-expanding-vista]]. See [[cal.1963-05-08.vietnam]]. Names: Cronkite.'
