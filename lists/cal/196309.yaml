    n: '[FRUS 1961–63, IV, doc. 51](https://history.state.gov/historicaldocuments/frus1961-63v04/d51). [[w.preston-war-council]], 125. After Lodge''s report of his talk with Nhu (doc. 51). See [[cal.1963-09-02.vietnam]]. Names: Bundy, Kennedy, Hilsman, Forrestal, Lodge, Ngô Đình Nhu, Johnson.'
    src:
