  - id: cal.1963-09-01.opinion
    when: Sept. 1
    date: '1963-09-01'
    thread: opinion
    also: [testing]
    c: 'Gallup, Aug. 15–20: 60 percent have heard of the partial test ban. Of them, Senate approval, 63 for, 17 against; Goldwater''s supporters 52 for.'
    n: '[[w.gallup-poll]], III, 1837. Names: Goldwater.'
    tags: [name:goldwater-barry-m]
  - id: cal.1963-09-02.vietnam
    when: Sept. 2
    date: '1963-09-02'
    thread: vietnam
    also: [press-and-broadcasting]
    c: 'Cronkite at Hyannis Port, for CBS''s first half-hour evening news. Vietnam: "In the final analysis, it is their war." Success possible "with changes in policy and perhaps with personnel." Withdrawal "a great mistake."'
    n: 'Transcript of Broadcast With Walter Cronkite Inaugurating a CBS Television News Program, [1963 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=708) (Sept. 2, 1963). [FRUS 1961–63, IV, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v04/d50). Kennedy, interview with Walter Cronkite (Viet. II.J). [[w.miller-misalliance]], 295 (the interview; "With changes in policy and perhaps with personnel"); [[w.gibbons-u-s-government-and]], II, 163 (the interview''s words; not the place or the program); [[w.schulimson-joint-chiefs-of-staff]], 354 (the interview; their war; withdrawal a mistake); [[w.futrell-united-states-air-force]], 188–89 (the broadcast, Sept. 2; "changes in policy and perhaps with personnel"). To check: [[w.cronkite-reporters-life]]; [[w.brinkley-cronkite]]; [[w.selverstone-kennedy-withdrawal]]; [[w.watson-expanding-vista]]. See [[cal.1963-05-08.vietnam]]. Names: Cronkite.'
