    c: 'Mao revises the second commentary on the Soviet open letter three times (early to mid-September), retitled "On the question of Stalin": the Stalin question a great question the world over, which stirred every class and is still argued;{1} no verdict is likely this century.{2} He adds Liu Shaoqi''s name beside his own: "Chinese Marxist-Leninists as represented by Comrade Mao Zedong and Comrade Liu Shaoqi."{3}'
