    c: 'Deng Xiaoping 邓小平, with Peng Zhen 彭真, meets and dines the Japanese Communist Party delegation under Takenaka Tsunesaburo 竹中恒三郎, member of its Central Committee 中央. On copying others'' experience: a dogmatism hard to avoid; it cannot be called an error, there being no other choice, as a child learning to walk must be held; looking back there are many mistakes in practical work; the thing is to sum up experience, in revolution and in construction. On the communes: in the first stage of communization there was too little experience, with equalitarianism, communes and production teams too large; the Center saw and noted these; at the end of 1958 Mao proposed opposing equalitarianism, but poor and lower-middle peasants like it and so do cadres; it violates distribution by labor; the social guarantee system was always kept, good for poor peasants short of labor.'
