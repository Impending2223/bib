    c: 'Mao, Liu Shaoqi, Zhu De and Zhou Enlai telegraph Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng on the 18th anniversary of the Democratic Republic of Vietnam: the Geneva agreements of 1954 and the unification of the country; the Buddhists'' and people''s struggle in the south against the United States and Ngô Đình Diệm, with support for Hồ''s statement; the 1962 Geneva agreements on Laos; Liu Shaoqi''s May visit and the joint statement. The friendship of the two peoples to flow on like the Yangtze and the Red River.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVII, 52–55 (Sept. 1, 1963; printed from *Renmin ribao*, Sept. 2, 1963). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hồ Chí Minh, Trường Chinh, Phạm Văn Đồng, Ngô Đình Diệm.'
