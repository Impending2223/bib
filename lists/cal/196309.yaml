    when: Sept. 5
    date: '1963-09-05'
    thread: vietnam-congress
    c: 'Hilsman two hours before the Far East Subcommittee of Foreign Relations in executive session. To Lodge: "far-reaching doubts regarding not only Diem-Nhu leadership but also advisability of continued US participation in Viet-Nam war."'
    n: '[FRUS 1961–63, IV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v04/d63) (Hilsman to Lodge, Sept. 5). [[w.gibbons-u-s-government-and]], II, 166. Names: Hilsman, Lodge.'
