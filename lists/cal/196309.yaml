  - id: cal.1963-09-02.desegregation-public-places
    when: Sept. 2
    date: '1963-09-02'
    thread: desegregation-public-places
    c: St. Augustine, Fla., Labor Day. More than a hundred march to the Slave Market, the first large demonstration there; twenty-seven arrested, Hayling among them.
    n: '[[w.branch-pillar-of-fire]], 137. To check: SAC, Jacksonville, to Director, Sept. 2, 1963, FSA-831 (cited by [[w.branch-pillar-of-fire]], 137). See [[cal.1963-06-18.desegregation-public-places]]. Names: Hayling.'
