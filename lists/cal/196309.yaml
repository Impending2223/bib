  - id: cal.1963-09-02.alabama
    when: Sept. 2
    date: '1963-09-02'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Alabama's schools to open under court orders. Wallace's troopers close Tuskegee High.
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). To check: [[w.carter-politics-of-rage-1995]]; [[w.mcwhorter-carry-me-home]]; [[w.marshall-federalism-and-civil-rights]]; [[w.brauer-john-f-kennedy-and]]. See [[cal.1963-06-11.alabama]]. Names: Wallace.'
    tags: [name:wallace-george-c]
  - id: cal.1963-09-02.vietnam-saigon
    when: Sept. 2
    date: '1963-09-02'
    thread: vietnam-saigon
    c: Lodge with Nhu, 4 to 6 p.m. Nhu will resign and move to Dalat once martial law is lifted and "certain U.S. agents" still promoting a coup have left. Madame Nhu to leave Sept. 17 for the Interparliamentary Union's meeting in Yugoslavia, perhaps for the United States. Measures for the Buddhist prisoners.
    n: '[FRUS 1961–63, IV, doc. 44](https://history.state.gov/historicaldocuments/frus1961-63v04/d44) (Lodge, Sept. 2). [[w.miller-misalliance]], 297 (Nhu, at his second meeting with Lodge, early September: he may retire). See [[cal.1963-08-27.vietnam-saigon]]. Names: Lodge, Nhu, Trần Lệ Xuân.'
    src:
      c: 178141fd
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d44: all'
        - 'w.miller-misalliance 297: A-B'
        - 'via w.miller-misalliance 297 n.59: all'
    tags: [name:lodge-henry-cabot, name:ngo-dinh-nhu, name:tran-le-xuan, place:saigon]
  - id: cal.1963-09-03.elections-1964
    when: Sept. 3
    date: '1963-09-03'
    thread: elections-1964
    c: 'New York. Rockefeller to Nixon, his neighbor, over a drink at his apartment the day after Labor Day, by Nixon''s account: "I''m going for the nomination." If Nixon supports him now, he will support Nixon in a deadlocked convention. Nixon declines.'
    n: '[[w.perlstein-before-the-storm]], 261–62; [[w.nixon-rn]], 251–52. See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller, Nixon.'
    src:
      c: e811cdce
      rows:
        - 'w.perlstein-before-the-storm 261–62: all'
        - 'w.nixon-rn 251–52: all'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1963-09-04.opinion
    when: Sept. 4
    date: '1963-09-04'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Aug. 15–20: a law giving Negroes the right to be served in hotels, restaurants, theaters, and the like, 54 percent for, 38 against. 19 would exempt small businesses; with them, 57 against a law that covers all.'
    n: '[[w.gallup-poll]], III, 1837.'
  - id: cal.1963-09-04.alabama-schools
    when: Sept. 4–5
    date: '1963-09-04'
    thread: alabama-schools
    also: [alabama-birmingham, desegregation-schools]
    c: Birmingham. Two Black children enrolled; that night Shores's house bombed; rioting, one man killed. Sept. 5, the city's schools closed at Wallace's request.
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). See [[cal.1963-09-02.alabama]]. Names: Shores, Wallace.'
    tags: [name:shores-arthur-d, name:wallace-george-c]
