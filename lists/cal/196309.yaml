    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). See [[cal.1963-09-02.alabama]]. Names: Wallace.'
