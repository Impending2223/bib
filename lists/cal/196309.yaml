ntary on the open letter of the CPSU Central Committee 《关于斯大林问题》 (manuscript 手稿), Sept. 1963 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.26); Mao Zedong 毛泽东, revision of the draft of Sept. 5 of the second commentary 《关于斯大林问题》 (manuscript 手稿), Sept. 1963 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.27); Mao Zedong 毛泽东, revision of the revised draft of the second commentary 《关于斯大林问题》 (manuscript 手稿), Sept. 11, 1963 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.28). See [[cal.1963-09-06.china-leadership-5]]. Names: Mao Zedong, Liu Shaoqi. Check: the days of the revision; the nianpu gives early to mid-September, and Sept. 13 is the day of printing ([[w.lengxi-shinian-lunzhan-1956-1966]], 645).'
