    c: 'Oregon, Ill., the Ogle County fairgrounds, a Republican picnic.{1} Rockefeller and his wife;{2} Percy absent; Goldwater buttons in the crowd. Rockefeller: "We are not on the New Frontier. We are lost in the woods."{3} At the Rockford airport, Lar Daly, running for governor: "I''m one candidate for Governor who''s not afraid to be here!"{4}'
    n: '[[w.white-suite-3505]], 209–10; [[w.novak-agony-of-the-g]], 220–21 (a week before Rockefeller''s *Meet the Press* of Sept. 14; the Ogle County Fairgrounds; no serious candidate for governor there; Daly the only one); [[w.goldberg-barry-goldwater]], 171 (Novak on the Rockefellers at the fairgrounds: "There was a smell of political death about the day in Ogle County. It was like observing a political corpse who did not realize that he was dead"); [[w.smith-on-his-own-terms]], 413 (the visit to Illinois; the local Republican leaders kept away by "scheduling conflicts"); [[w.novak-agony-of-the-g]], 221–24 & nn.3–4 (the Convair at Rockford Airport at noon, some seventy local dignitaries; Daly in an Uncle Sam suit; five thousand at the fairgrounds; Carpentier, Robertson and Percy away; Guyer: Rockefeller invited after Goldwater and others declined; the Goldwater buttons not removed; "We are lost in the woods"); [[w.perlstein-before-the-storm]], 230 (the Ogle County fair; the Rockefellers ignored by the crowd; the Washington press brought on his Convair). Names: Rockefeller, Percy.'
