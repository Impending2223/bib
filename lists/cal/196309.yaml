    thread: alabama-schools
    also: [desegregation-schools]
    c: 'Alabama''s federal district judges, all of them, enjoin Wallace from blocking the schools, Sept. 9;{1} he sends the Guard instead.{2} Sept. 10: Kennedy federalizes the Alabama Guard and sends it from the schools. Black pupils enter in Birmingham and Mobile.{3}'
    n: 'Statement by the President on Desegregation in the Schools of Alabama, [1963 Pub. Papers 661](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=719) (Sept. 9, 1963). [Proclamation 3554](https://www.presidency.ucsb.edu/documents/proclamation-3554-obstructions-justice-the-state-alabama); [Exec. Order No. 11,118](https://www.presidency.ucsb.edu/documents/executive-order-11118-providing-assistance-for-removal-unlawful-obstructions-justice-the), [28 Fed. Reg. 9863](https://www.govinfo.gov/app/details/FR-1963-09-11) (1963). *United States v. Wallace*, [222 F. Supp. 485](https://static.case.law/f-supp/222/case-pdfs/0485-01.pdf) (M.D. Ala. 1963) (the preliminary injunction, Sept. 24). [[w.branch-parting-the-waters]], 888–89; [[w.whalen-longest-debate]], 33 (the five federal district judges enjoin the troopers; the governor replaces them with national guardsmen; Kennedy federalizes the Guard and orders it from the schools; integration proceeds; no days; not the pupils at Birmingham and Mobile); [[w.risen-bill-of-the-century]], 112 (a federal judge enjoins the troopers; Wallace sends the Guard; Kennedy federalizes it; Sept. 10, Wallace: "I can''t fight bayonets with my bare hands"). Check: Branch, 888–89: the three Birmingham schools open Sept. 9, the Guard barring the Negro students; at Huntsville, unguarded by oversight, Sonnie W. Hereford IV, six, the State''s first Negro pupil in a white elementary school; most white students walk out at Birmingham; at West End High cheerleaders and football players for integrated classes; a white sit-in at Boutwell''s office. To check: [[w.bass-taming-the-storm]]. See [[cal.1963-09-02.alabama]]. Names: Wallace.'
