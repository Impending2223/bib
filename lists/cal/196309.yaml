      rows:
        - 'w.perlstein-before-the-storm 261–62: all'
        - 'w.nixon-rn 251–52: all'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1963-09-03.vietnam-force-levels
    when: Sept. 3
    date: '1963-09-03'
    thread: vietnam-force-levels
    c: McNamara approves "for planning purposes" the plan to withdraw 1,000 men from Vietnam by the end of the year; the Joint Chiefs to judge the situation and report by late October.
    n: '[[w.selverstone-kennedy-withdrawal]], 152. To check: Taylor to McNamara, JCSM-629-63, Aug. 20, 1963; McNamara to Taylor, "Withdrawal of 1,000 US Military from Vietnam," Sept. 3, 1963, RG 218, JCS Central File, box 11, NARA (cited by [[w.selverstone-kennedy-withdrawal]], 152 n.31). See [[cal.1963-05-07.vietnam-force-levels]]. Names: McNamara.'
