    c: 'Sunday morning.{1} Dynamite at the Sixteenth Street Baptist Church, Birmingham.{2} Four girls killed: Addie Mae Collins, Denise McNair, Carole Robertson, Cynthia Wesley.{3} Two Black boys shot dead in the city that afternoon.{4} Kennedy, Sept. 16: "public disparagement of law and order has encouraged violence."{5} Marshall and FBI bomb men sent.{6}'
    n: 'Statement by the President on the Sunday Bombing in Birmingham, [1963 Pub. Papers 681](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=739) (Sept. 16, 1963). [[w.garrow-bearing-the-cross]], 291–92, 294 (all but Marshall and the FBI men); [[w.branch-pillar-of-fire]], 137–39; [[w.sorensen-kennedy]], 502 (the bombing; the two boys); [[w.branch-parting-the-waters]], 889–91; [[w.kotz-judgment-days]], 65 (the fiftieth bombing in Birmingham since the war); [[w.young-easy-burden]], 275; [[w.selverstone-kennedy-withdrawal]], 158 (Sunday, Sept. 15: a church bombing in Birmingham kills four young girls; two boys shot dead in the streets that day); [[w.wofford-of-kennedys-and-kings]], 174 ("Two weeks later" a bomb kills four little girls at the Sixteenth Street Baptist Church, Birmingham; the President speaks strongly; not the names or the boys); [[w.whalen-longest-debate]], 33–34 (the morning of Sept. 15, a bomb under the steps of the church; four girls killed, twenty injured; police kill two more youngsters in the rioting; not dynamite, the names, the afternoon or the two boys as shot by others); [[w.purdum-idea-whose-time-has-2014]], 125 (the Sixteenth Street bombing, four girls dead; two boys killed that day; the rioting); [[w.risen-bill-of-the-century]], 112 (Sept. 15, the basement of the Sixteenth Street Baptist Church, four girls killed, a fifth hurt; a police officer shoots a Negro teenager, two white Boy Scouts kill a boy on a bicycle; Kennedy on Wallace; Kennedy waits days to see the leaders). [[w.reeves-president-kennedy]], 599–600 (the bombing; the four girls). Check: Branch, 889–91: Youth Day, the girls in white in the basement ladies'' room; Sarah Collins, ten, partly blinded; the two boys: a thirteen-year-old on bicycle handlebars shot by two Eagle Scouts coming from a segregationist rally, and a Negro shot in the back of the head by officers; Lingo and three hundred troopers sent by Wallace. To check: [[w.rosenberg-kennedy-johnson-and-the]] ("Bombs in Birmingham"); [[w.mcwhorter-carry-me-home]]; [[w.sikora-until-justice-rolls-down]]; [[w.jones-bending-toward-justice]]; [[w.4-little-girls]]; *New York Times*, [Sept. 16 at 1](https://timesmachine.nytimes.com/timesmachine/1963/09/16/issue.html) and [Sept. 17, 1963, at 25](https://timesmachine.nytimes.com/timesmachine/1963/09/17/issue.html); King to Kennedy, Sept. 15 and 16, 1963, White House Central Files 367, 1478, Kennedy Library; Joseph Dolan to Nicholas Katzenbach, "Birmingham Possibilities II," Sept. 18, 1963, Civil Rights Division FOIA (DOJ microfilm, reel 120) (cited by [[w.garrow-bearing-the-cross]], 291 n.4); [*New York Times*, Sept. 16, 1963](https://timesmachine.nytimes.com/timesmachine/1963/09/16/issue.html) (cited by [[w.reeves-president-kennedy]], 599). See [[cal.1963-04-03.alabama]]. Names: Addie Mae Collins, McNair, Robertson, Wesley, Marshall.'
