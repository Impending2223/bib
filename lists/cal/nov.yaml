# Cal. XIII November 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIII
entries:
  - id: cal.1961-11-01.freedom-rides
    when: Nov. 1
    date: '1961-11-01'
    thread: freedom-rides
    also: [albany]
    c: ICC order in force. SNCC tests the Albany, Georgia, bus station.
    n: '[Interstate Commerce Commission, No. MC-C-3358, 26 Fed. Reg. 9166](https://www.govinfo.gov/app/details/FR-1961-09-29) (Sept. 29, 1961). Arsenault, *Freedom Riders* (K–J Adm. II.C). See [[cal.1961-09-22.freedom-rides]]; [[cal.1961-11-17.albany]].'
  - id: cal.1961-11-02.right-and-the-military
    when: Nov. 2
    date: '1961-11-02'
    thread: right-and-the-military
    c: Walker resigns from the Army.
    n: 'See [[cal.1961-04-17.right-and-the-military]]. Names: Walker (K–J Adm. III.F).'
  - id: cal.1961-11-02.testing
    when: Nov. 2
    date: '1961-11-02'
    thread: testing
    c: Kennedy orders preparations for atmospheric tests.
    n: '[Statement by the President Concerning the Development and Testing of Nuclear Weapons](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-the-development-and-testing-nuclear-weapons) (Nov. 2, 1961). See [[cal.1961-09-01.testing]].'
  - id: cal.1961-11-03.vietnam
    when: Nov. 3
    date: '1961-11-03'
    thread: vietnam
    c: Taylor's report. Advisers down to the units; helicopters and aircraft with American crews; a flood-relief task force of about 8,000 men.
    n: 'Memorandum from Taylor to the President (K–J Adm. II.H.3). [FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01). Logevall, *Choosing War* (K–J Adm. II.D). See [[cal.1961-01-28.vietnam]]. Names: Taylor (Viet. III.A).'
  - id: cal.1961-11-03.congo
    when: Nov. 3
    date: '1961-11-03'
    thread: congo
    c: U Thant acting Secretary-General.
    n: '[Message to Adlai Stevenson Following the Election of U Thant as U.N. Secretary General](https://www.presidency.ucsb.edu/documents/message-adlai-stevenson-following-the-election-u-thant-un-secretary-general). See [[cal.1961-02-13.congo]].'
  - id: cal.1961-11-04.specials
    when: Nov. 4
    date: '1961-11-04'
    thread: specials
    c: 'Texas 20th, special. Henry B. González (D) over Goode (R), 54.6 to 44.0, for Kilday''s seat. The first Mexican American from Texas in the House. No swing: Kilday unopposed in 1960.'
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1961-11-04-h-TX-20]
  - id: cal.1961-11-07.states-and-cities
    when: Nov. 7
    date: '1961-11-07'
    thread: states-and-cities
    c: Wagner reelected mayor of New York. In New Jersey Hughes (D) beats Mitchell, Eisenhower's Labor Secretary, for governor.
    n: 'See [[cal.1961-09-07.states-and-cities]]. Names: Wagner (K–J Cong. III.F).'
  - id: cal.1961-11-07.specials
    when: Nov. 7
    date: '1961-11-07'
    thread: specials
    c: Michigan 1st, special. Nedzi (D) holds Machrowicz's seat, 85.5 percent. Swing 3.2 to R.
    n: 'Shares: Wikipedia. See [[cal.1961-04-04.states-and-cities]].'
    tags: [special:1961-11-07-h-MI-1]
  - id: cal.1961-11-08.vietnam
    when: Nov. 8–11
    date: '1961-11-08'
    thread: vietnam
    c: 'McNamara, Gilpatric, and the Chiefs advise a commitment, with troops; up to six divisions. Nov. 11: McNamara and Rusk advise deferring troops.'
    n: '[FRUS vol. 1](https://history.state.gov/historicaldocuments/frus1961-63v01). Kaiser, *American Tragedy* (Viet. II.B.8). See [[cal.1961-01-28.vietnam]]. Names: McNamara, Rusk (Viet. III.A).'
  - id: cal.1961-11-16.congress
    when: Nov. 16
    date: '1961-11-16'
    thread: congress
    c: Rayburn dies at Bonham. Kennedy, Johnson, Truman, and Eisenhower at the funeral.
    n: '[Statement by the President on the Death of Sam Rayburn](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-sam-rayburn). Hardeman & Bacon, *Rayburn*; Nelson, *John William McCormack* (K–J Cong. II.I.2). Ripley, *Majority Party Leadership in Congress*; MacNeil, *Forge of Democracy* (K–J Cong. II.A). CQ Almanac 1961 and 1962 (K–J Cong. II.L). Names: Rayburn, McCormack, Albert (K–J Cong. III.C).'
  - id: cal.1961-11-16.right-and-the-military
    when: Nov. 16–18
    date: '1961-11-16'
    thread: right-and-the-military
    c: 'Seattle: the United States "neither omnipotent nor omniscient." Nov. 18, Los Angeles: against "the discordant voices of extremism."'
    n: '[Address in Seattle at the University of Washington''s 100th Anniversary Program](https://www.presidency.ucsb.edu/documents/address-seattle-the-university-washingtons-100th-anniversary-program) (Nov. 16, 1961); [Address in Los Angeles at a Dinner of the Democratic Party of California](https://www.presidency.ucsb.edu/documents/address-los-angeles-dinner-the-democratic-party-california) (Nov. 18, 1961). See [[cal.1961-03.right-and-the-military]].'
  - id: cal.1961-11-17.albany
    when: Nov. 17
    date: '1961-11-17'
    thread: albany
    c: 'Albany Movement formed: SNCC, the NAACP, the ministers. William G. Anderson president.'
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Carson, *In Struggle* (K–J Cong. II.F). Howard Zinn, *Albany: A Study in National Responsibility* (Southern Regional Council, 1962). Names: King (K–J Cong. III.H).'
  - id: cal.1961-11-19.latin-america
    when: Nov. 19
    date: '1961-11-19'
    thread: latin-america
    c: American warships off Santo Domingo. The Trujillo brothers leave.
    n: Rabe (K–J Adm. II.D). [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). See [[cal.1961-05-30.latin-america]].
  - id: cal.1961-11-22.vietnam
    when: Nov. 22
    date: '1961-11-22'
    thread: vietnam
    c: NSAM 111. Helicopters, airlift, advisers with the units; reforms asked of Diem. No combat troops.
    n: '[NSAM No. 111](https://history.state.gov/historicaldocuments/frus1961-63v01/d272) (Viet. II.I.2). See [[cal.1961-01-28.vietnam]]. Names: Ngo Dinh Diem (Viet. III.G); Nolting (Viet. III.C).'
  - id: cal.1961-11-24.congo
    when: Nov. 24
    date: '1961-11-24'
    thread: congo
    c: Security Council authorizes force against Katanga's mercenaries.
    n: '[FRUS 1961–63, XX, doc. 143](https://history.state.gov/historicaldocuments/frus1961-63v20/d143). See [[cal.1961-02-13.congo]].'
  - id: cal.1961-11-25.berlin-and-vienna
    when: Nov. 25
    date: '1961-11-25'
    thread: berlin-and-vienna
    c: Adzhubei, Khrushchev's son-in-law, interviews Kennedy at Hyannis Port. *Izvestia* prints it whole, Nov. 28.
    n: '[Transcript of Interview With the President by Aleksei Adzhubei, Editor of Izvestia](https://www.presidency.ucsb.edu/documents/transcript-interview-with-the-president-aleksei-adzhubei-editor-izvestia) (Nov. 25, 1961). Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-06-03.berlin-and-vienna]].'
  - id: cal.1961-11-26.transition-and-staff
    when: Nov. 26
    date: '1961-11-26'
    thread: transition-and-staff
    c: The Thanksgiving reshuffle. Bowles out as Under Secretary; Ball in. Harriman to the Far East; Rostow to Policy Planning; Kaysen Bundy's deputy.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-199) (Nov. 29, 1961). Bowles, *Promises to Keep*; Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Schlesinger, *A Thousand Days* (K–J Adm. II.G.2). Names: Bowles, Ball, Harriman, Rostow, Bundy (K–J Adm. III.E).'
  - id: cal.1961-11-28.transition-and-staff
    when: Nov. 28
    date: '1961-11-28'
    thread: transition-and-staff
    c: Kennedy at Langley; the National Security Medal for Dulles. McCone sworn in, Nov. 29.
    n: '[Remarks Upon Presenting an Award to Allen W. Dulles](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-award-allen-w-dulles). [Remarks at the Swearing In of John McCone as Director, Central Intelligence Agency](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-john-mccone-director-central-intelligence-agency). Robarge, *John McCone*; Grose, *Gentleman Spy* (K–J Adm. II.G.6). See [[cal.1961-09-27.transition-and-staff]]. Names: Dulles, McCone (K–J Adm. III.I).'
  - id: cal.1961-11-30.cuba
    when: Nov. 30
    date: '1961-11-30'
    thread: cuba
    c: Operation Mongoose. Lansdale chief of operations; Robert Kennedy behind it.
    n: '[FRUS vol. 10](https://history.state.gov/historicaldocuments/frus1961-63v10). S. Rep. No. 94-465 (K–J Adm. II.H.3). Thomas, *The Very Best Men*; Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). See [[cal.1961-04-15.cuba]]. Names: Lansdale (K–J Adm. III.F); Harvey (K–J Adm. III.I); Robert F. Kennedy (K–J Adm. III.A).'
