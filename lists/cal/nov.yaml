  - id: cal.1961-11-07.states-and-cities
    when: Nov. 7
    date: '1961-11-07'
    thread: elections-1961
    also: [mayors, governors]
    c: 'Off-year elections. New York: Wagner re-elected mayor, 1,237,421 votes, 51.0 percent; Lefkowitz (R) 835,691; Gerosa, independent, 321,604. New Jersey: Hughes (D) governor over Mitchell, Eisenhower''s Labor Secretary.'
    n: 'Votes: [Wikipedia, "1961 New York City mayoral election"](https://en.wikipedia.org/wiki/1961_New_York_City_mayoral_election); Check: the Board of Elections'' canvass. See [[cal.1961-09-07.states-and-cities]]. Names: Wagner (K–J Cong. III.F).'
    tags: [name:wagner-robert-f-jr, name:mitchell-james-p, name:eisenhower-dwight-d, name:hughes-richard-j, state:ny, city:nyc, state:nj]
