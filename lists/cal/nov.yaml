# Cal. XIII November 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIII
entries:
  - id: cal.1961-11-01.freedom-rides
    when: Nov. 1
    date: '1961-11-01'
    thread: freedom-rides
    also: [albany]
    c: The ICC's order takes effect. SNCC workers test the bus station in Albany, Georgia, and leave when the police order them out.
    n: See [[cal.1961-09-22.freedom-rides]]. Arsenault, *Freedom Riders* (K–J Adm. II.C).
  - id: cal.1961-11-02.right-and-the-military
    when: Nov. 2
    date: '1961-11-02'
    thread: right-and-the-military
    c: Walker resigns from the Army, giving up his pension, to speak freely.
    n: See [[cal.1961-04-17.right-and-the-military]].
  - id: cal.1961-11-02.testing
    when: Nov. 2
    date: '1961-11-02'
    thread: testing
    c: Kennedy orders preparations for atmospheric tests, to be held only if they prove necessary.
    n: Statement by the President on Nuclear Testing (Nov. 2, 1961). Check the title. See [[cal.1961-09-01.testing]].
  - id: cal.1961-11-03.vietnam
    when: Nov. 3
    date: '1961-11-03'
    thread: vietnam
    c: 'Taylor''s report: more advisers, assigned down to the units; helicopters and planes with American crews; and a "flood relief" task force of some 8,000 men, combat troops by another name.'
    n: Memorandum from Taylor to the President (K–J Adm. II.H.3). FRUS vol. 1. Logevall, *Choosing War* (K–J Adm. II.D).
  - id: cal.1961-11-03.congo
    when: Nov. 3
    date: '1961-11-03'
    thread: congo
    c: U Thant elected acting Secretary-General.
    n: See [[cal.1961-02-13.congo]].
  - id: cal.1961-11-07.states-and-cities
    when: Nov. 7
    date: '1961-11-07'
    thread: states-and-cities
    c: Off-year elections. Wagner reelected mayor of New York. In New Jersey Richard Hughes, a Democrat, beats James Mitchell, Eisenhower's Secretary of Labor, for governor.
    n: 'See [[cal.1961-09-07.states-and-cities]]. Names: Wagner (K–J Cong. III.F).'
  - id: cal.1961-11-08.vietnam
    when: Nov. 8–11
    date: '1961-11-08'
    thread: vietnam
    c: McNamara, Gilpatric, and the Joint Chiefs advise a commitment to save South Vietnam, with troops; up to six divisions might be needed. On the 11th McNamara joins Rusk in a memorandum that puts troops off.
    n: 'FRUS vol. 1. Kaiser, *American Tragedy* (Viet. II.B). Names: McNamara, Rusk (Viet. III.A).'
  - id: cal.1961-11-16.congress
    when: Nov. 16
    date: '1961-11-16'
    thread: congress
    c: Rayburn dies at Bonham. Kennedy, Johnson, Truman, and Eisenhower at the funeral.
    n: 'Hardeman & Bacon, *Rayburn*; Nelson, *John William McCormack* (K–J Cong. II.I.2). Ripley, *Majority Party Leadership in Congress*; MacNeil, *Forge of Democracy* (K–J Cong. II.A). The session''s record: CQ Almanac 1962 (K–J Cong. II.L). Names: Rayburn, McCormack, Albert (K–J Cong. III.C).'
  - id: cal.1961-11-16.right-and-the-military
    when: Nov. 16–18
    date: '1961-11-16'
    thread: right-and-the-military
    c: Seattle and Los Angeles. At the University of Washington, the United States "neither omnipotent nor omniscient"; at the Hollywood Palladium, the "discordant voices of extremism."
    n: Address at the University of Washington's 100th Anniversary Program (Nov. 16, 1961); Address in Los Angeles at a Dinner of the Democratic Party of California (Nov. 18, 1961). Check the titles.
  - id: cal.1961-11-17.albany
    when: Nov. 17
    date: '1961-11-17'
    thread: albany
    c: The Albany Movement formed, joining SNCC, the NAACP, and the ministers. William G. Anderson, an osteopath, its president.
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Garrow, *Bearing the Cross*; Carson, *In Struggle* (K–J Cong. II.F). Howard Zinn, *Albany: A Study in National Responsibility* (1962), for the Southern Regional Council. Check. Names: King (K–J Cong. III.H).'
  - id: cal.1961-11-19.latin-america
    when: Nov. 19
    date: '1961-11-19'
    thread: latin-america
    c: American warships off Santo Domingo. The Trujillo brothers, back to take power, leave the country.
    n: Rabe (K–J Adm. II.D). FRUS vol. 12. See [[cal.1961-05-30.latin-america]]. Check the date.
  - id: cal.1961-11-22.vietnam
    when: Nov. 22
    date: '1961-11-22'
    thread: vietnam
    c: NSAM 111, the first phase of the Vietnam program. Helicopters, airlift, and advisers with the units, in return for reforms Diem never makes. No combat troops.
    n: 'NSAM No. 111 (Viet. II.I.2). Names: Nolting (Viet. III.C).'
  - id: cal.1961-11-24.congo
    when: Nov. 24
    date: '1961-11-24'
    thread: congo
    c: The Security Council authorizes force to remove Katanga's mercenaries.
    n: See [[cal.1961-02-13.congo]]. Check.
  - id: cal.1961-11-25.berlin-and-vienna
    when: Nov. 25
    date: '1961-11-25'
    thread: berlin-and-vienna
    c: Kennedy interviewed at Hyannis Port by Aleksei Adzhubei, Khrushchev's son-in-law. *Izvestia* prints it whole on the 28th.
    n: Interview with Aleksei Adzhubei, Editor of Izvestia (Nov. 25, 1961). Check the title. Salinger, *With Kennedy* (K–J Adm. II.G.2).
  - id: cal.1961-11-26.transition-and-staff
    when: Nov. 26
    date: '1961-11-26'
    thread: transition-and-staff
    c: The Thanksgiving reshuffle at State. Bowles out as Under Secretary, to be a roving ambassador; Ball in his place; Harriman Assistant Secretary for the Far East; Rostow to Policy Planning; Kaysen Bundy's deputy.
    n: 'Bowles, *Promises to Keep*; Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Schlesinger, *A Thousand Days* (K–J Adm. II.G.2). Names: Bowles, Ball, Harriman, Rostow (K–J Adm. III.E).'
  - id: cal.1961-11-28.transition-and-staff
    when: Nov. 28
    date: '1961-11-28'
    thread: transition-and-staff
    c: Kennedy at the new CIA headquarters in Langley gives Dulles the National Security Medal. McCone sworn in the next day.
    n: Robarge; Grose (K–J Adm. II.G.6). See [[cal.1961-09-27.transition-and-staff]].
  - id: cal.1961-11-30.cuba
    when: Nov. 30
    date: '1961-11-30'
    thread: cuba
    c: 'Kennedy''s memorandum creates Operation Mongoose: Lansdale chief of operations, Robert Kennedy behind it, the aim to "help Cuba overthrow the Communist regime."'
    n: 'FRUS vol. 10. S. Rep. No. 94-465 (K–J Adm. II.H.3). Thomas, *The Very Best Men*; Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). Names: Lansdale (K–J Adm. III.F); Harvey (K–J Adm. III.I).'
