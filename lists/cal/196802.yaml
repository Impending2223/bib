    c: 'The National Advisory Commission on Civil Disorders, Kerner its chairman, Lindsay vice chairman, reports: "Our nation is moving toward two societies, one black, one white—separate and unequal";{1} white society "deeply implicated in the ghetto." Proposed: 2 million jobs in three years; 6 million units of decent housing in five years, 600,000 in the first; a national system of income supplementation; a federal open housing law (Check).{2}'
    n: '[[w.report-of-the-national]], [1](https://archive.org/details/reportofnation00unit/page/n29/mode/1up) (Bantam ed.). [[w.branch-at-canaans-edge]], 705–6 (Johnson''s silence; the unsigned letters, "I''d be a hypocrite"); [[w.kotz-judgment-days]], 392 ("white racism is essentially responsible"; "two societies, one black, one white—separate and unequal"); [[w.thomas-robert-kennedy]], 357 (Feb. 29, the report, "white racism"; the White House dismisses it); [[w.schlesinger-robert-kennedy-and-his]], 846 ("At the end of February 1968 the Kerner Commission submitted a powerful report": a nation "moving toward two societies, one black, one white — separate but unequal"; "The White House," Moynihan wrote, "would not receive it"; Kennedy, "skeptical when the commission was established, was impressed by its report"; not the day, the members or the proposals). Check: Kotz dates the report Mar. 1 (392). To check: [[w.gillon-separate-and-unequal]]; [[w.barnhart-kerner]]; [[w.califano-triumph-and-tragedy-of]], 260–62 (cited by [[w.branch-at-canaans-edge]], 705); [[w.dallek-flawed-giant]], 515 (cited by [[w.branch-at-canaans-edge]], 705); McPherson to Califano, March 1, 1968, McPherson Papers, Box 32, LBJ (cited by [[w.branch-at-canaans-edge]], 705); Louis Martin to Califano, March 5, 1968, Califano Papers, Box 9, LBJ. stealthy new travel regimen: "Johnson Berates Vietnam Critics," [*New York Times*, March 2, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/02/issue.html), at 21 (cited by [[w.branch-at-canaans-edge]], 705); "On the Trail: Johnson Has Answers," [*New York Times*, March 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/03/issue.html), at 1. 740,000 paperback copies sold: [*New York Times*, March 14, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/14/issue.html), p (cited by [[w.branch-at-canaans-edge]], 705); [*New York Times*, March 2, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/02/issue.html), p (cited by [[w.branch-at-canaans-edge]], 706); Kerner, *Report* (n.d.), 1 (cited by [[w.branch-at-canaans-edge]], 706); Promised, pp. 190–91 (cited by [[w.branch-at-canaans-edge]], 706). See [[cal.1967-07-27.civil-disorders]]. Names: Kerner, Lindsay.'
