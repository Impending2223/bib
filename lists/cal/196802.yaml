  - id: cal.1968-02-12.vietnam-tet
    when: Feb. 12
    date: '1968-02-12'
    time: 1968-02-12T06:12Z
    thread: vietnam-tet
    c: 'Westmoreland: the enemy''s third phase, to take Quảng Trị and Thừa Thiên, begun;{1} he asks for reinforcements now.{2} He asks that a Marine regiment package and a brigade package of the 82d Airborne go at once: "I need these 525,000 troops now," the ceiling promised for 1969.{5} Johnson with his advisers: a brigade of the 82d Airborne, 3,800 men, and Marines, 6,500, to Vietnam;{3} the Joint Chiefs had asked that a reserve call-up come first.{4}'
    n: 'FRUS 1964–68, VI, docs. [68](https://history.state.gov/historicaldocuments/frus1964-68v06/d68), [70](https://history.state.gov/historicaldocuments/frus1964-68v06/d70). [[w.drea-mcnamara-clifford-and-the-2011]], 183 (Westmoreland''s cable; the lunch, some 10,000 men approved; the Chiefs for deferring and a call-up); [[w.westmoreland-soldier-reports]], 352 (the request, quoted; the White House meeting that day, by Wheeler''s report: "you are not expressing a firm demand"; Westmoreland: "not because I fear defeat"); [[w.califano-triumph-and-tragedy-of]], 259 (Westmoreland "desperately need[ed]" reinforcements; 10,500 ordered; Wheeler sent the next day); [[w.branch-at-canaans-edge]], 693–94 ("a new ball game"; the six battalions); [[w.berman-lyndon-johnsons-war]], 164–66 ("a new ball game"; "I need these 525,000 troops now"; six battalions, 10,500; Wheeler: Westmoreland "does not know how sacrosanct" the 525,000; the Chiefs against, Johnson for sending them); [[w.taylor-swords-and-plowshares]], 385 (Westmoreland''s request of Feb. 12: an airborne brigade and a Marine regiment); [[w.barrett-uncertain-warriors]], 116 (Westmoreland''s "firm request for troops," 10,000 more at once; Feb. 12, unanimous advice to send them; Johnson approved them "for the period of the emergency only"). [[w.longley-lbjs-1968]], 64 (the meeting). Made public: the Pentagon Papers (1971); FRUS 1964–68, VI (2002). [[w.clifford-counsel-to-the-president-2]], 478 (Westmoreland''s "firm request"; the lunch, all for more troops, Clifford silent). To check: JCSM-91-68 to McNamara, Feb. 12, 1968, Pentagon Papers Backup, Acc 75-062 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 183 n.44); [[w.karnow-vietnam]], 562–64 (cited by [[w.branch-at-canaans-edge]], 693); FRUS, *Vol. 6* (n.d.), 153, footnotes 1–3 (cited by [[w.branch-at-canaans-edge]], 693); "U.S. rushes 10,500 to Meet Threat of Vietnam Foe," [*New York Times*, Feb. 14, 1968](https://timesmachine.nytimes.com/timesmachine/1968/02/14/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 694). See [[cal.1968-01-30.vietnam]]. Names: Westmoreland, Johnson.'
