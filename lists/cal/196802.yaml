  - id: cal.1968-02-06.vietnam-tet
    when: Feb. 6
    date: '1968-02-06'
    thread: vietnam-tet
    also: [japan-and-korea-pueblo]
    c: 'Breakfast with the Democratic leaders of Congress, Boggs and Mansfield among them. Robert Byrd: poor intelligence, poor preparation for the attacks, the Viet Cong''s morale underestimated, South Vietnam''s support overestimated. Johnson: "I don''t agree with any of that"; at Panmunjom, "we are trying to keep them talking." At the Tuesday lunch Johnson is called away: Byrd, to apologize. Russell Long on the *Pueblo*. Byrd, by Tom Johnson''s notes: "we were not prepared for these attacks. We underestimated the morale and vitality of the Viet Cong. We overestimated the support of South Vietnam''s government." Johnson: "The popular thing now is to stress the mismanagement in Vietnam. I think there has been very little."'
    n: 'FRUS 1964–68, VI, doc. [58](https://history.state.gov/historicaldocuments/frus1964-68v06/d58) (Byrd''s four points, read to the advisers); doc. [59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (the apology). [[w.longley-lbjs-1968]], 46, 60 (the breakfast); [[w.branch-at-canaans-edge]], 693 (Byrd, "I am going to stick with my convictions"); [[w.berman-lyndon-johnsons-war]], 152–54 (Byrd''s four points; Johnson: "I don''t agree with any of that"; Long: "you would have been impeached"; "Anybody can kick a barn down"). [[w.barrett-uncertain-warriors]], 117–18 (Long; Byrd''s words; Johnson''s on the "mismanagement"); [[w.palermo-in-his-own-right]], 114 n.71 (Johnson "fumed" at Byrd on the intelligence; Byrd, by the note, did not agree it was good). [[w.mann-grand-delusion]], 573–74 (Byrd and Johnson, by Tom Johnson''s notes). To check: Notes of the President''s Meeting with the Democratic Congressional Leadership, Feb. 6, 1968, Tom Johnson''s Notes of Meetings, Box 2, LBJ Library (cited by [[w.longley-lbjs-1968]], 46 n.39, 60 n.20); the same notes (cited by [[w.barrett-uncertain-warriors]], 118 n.31; by [[w.palermo-in-his-own-right]], 114 n.71); Notes of LBJ breakfast meeting with Democratic congressional leadership, Feb. 6, 1968, Box 2, Tom Johnson Papers, p. 4, LBJ (cited by [[w.branch-at-canaans-edge]], 693). Made public: FRUS 1964–68, VI (2002). Check: Longley names Harry Byrd at the breakfast (46); FRUS and Longley (60) Robert Byrd. See [[cal.1968-01-30.vietnam]]. Names: Boggs, Mansfield, Robert C. Byrd, Johnson, Long. Check: Mann, 573, has "the next morning, on April 6," after Javits''s speech of Feb. 5.'
