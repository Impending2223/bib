    c: 'CBS, *Report from Vietnam: Who, What, When, Where, Why?* Cronkite, back from Saigon and Huế: "it seems now more certain than ever that the bloody experience of Vietnam is to end in a stalemate";{1} the rational way out, to negotiate, "not as victors, but as an honorable people who lived up to their pledge to defend democracy, and did the best they could."{2}'
    n: '[[w.cosmas-joint-chiefs-of-staff]], 161 (the broadcast; the stalemate); [[w.branch-at-canaans-edge]], 704 ("mired in stalemate"); [[w.berman-lyndon-johnsons-war]], 175 ("mired in stalemate"; Johnson: "Cronkite was it"); [[w.bernstein-guns-or-butter]], 476 (quoted from Schandler, 197; Christian: "the shock waves rolled through the Government"); [[w.zaroulis-who-spoke-up]], 152 (Cronkite''s half-hour CBS News special, *Report from Vietnam*; the quotation; the day not given). [[w.longley-lbjs-1968]], 71 (the broadcast; "mired in stalemate"; negotiation). Check: the broadcast''s words; Cosmas, 161, from Hammond, *Public Affairs*, 369–70, has "mired in stalemate" and "not as victims, but as an honorable people who lived up to their pledge to victory and democracy". To check: [[w.brinkley-cronkite]]; [[w.cronkite-reporters-life]]; [[w.campbell-getting-it-wrong]]; [[w.hallin-uncensored-war-the-media]]; [[w.braestrup-big-story]]; CBS Evening News, "Walter Cronkite Report from Vietnam: Who? What? When? Where? Why?," Feb. 27, 1968, T79:0331, MOB (cited by [[w.branch-at-canaans-edge]], 704); [*New York Times*, Feb. 28, 1968](https://timesmachine.nytimes.com/timesmachine/1968/02/28/issue.html), at 95 (cited by [[w.branch-at-canaans-edge]], 704); [[w.dallek-flawed-giant]], 503–6 (cited by [[w.branch-at-canaans-edge]], 704); [[w.appy-patriots]], 293 (cited by [[w.branch-at-canaans-edge]], 704); [[w.karnow-vietnam]], 561 (cited by [[w.branch-at-canaans-edge]], 704); [[w.clifford-counsel-to-the-president-2]], 485–86 (cited by [[w.branch-at-canaans-edge]], 704). Names: Cronkite.'
