  - id: cal.1968-02-19.school-aid-fl
    when: Feb. 19–Mar.
    date: '1968-02-19'
    place: florida
    thread: school-aid
    also: [state-and-city-finance, labor-disputes]
    c: 'Florida. The teachers'' statewide walkout, called by the Florida Education Association: at its height 25,712, some 40 percent of the State''s teachers, by resignations; schools closed in about two-thirds of the counties. The special session Kirk called in January had raised taxes for the schools; the FEA calls the sums too small. Kirk and the legislature give no more. By the end of March most teachers back.'
    n: '[Wikipedia, "Florida statewide teachers'' strike of 1968"](https://en.wikipedia.org/wiki/Florida_statewide_teachers%27_strike_of_1968). Check: the taxes enacted in the special session (the sales tax to 4 percent) and whether Kirk signed them, from the *Laws of Florida*, 1968, Extraordinary Session. To check: [[w.kallina-claude-kirk-and-the]]; [[w.colburn-floridas-gubernatorial-politics-in]]. See [[cal.1967-01.crime-and-hijacking-fl]]. Names: Kirk.'
    tags: [state:fl, name:kirk-claude-r-jr]
    short: the Florida teachers' walkout
