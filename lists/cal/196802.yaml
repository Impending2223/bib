  - id: cal.1968-02-06.vietnam
    when: Feb. 6
    date: '1968-02-06'
    time: 1968-02-06T18:14Z
    place: washington
    thread: vietnam
    c: 'Tuesday lunch, 1:14 to 2:55 p.m.{1} Wheeler for the Joint Chiefs, JCSM-78-68 of Feb. 3: the circles closed to strikes around Hanoi and Haiphong cut from five miles to three and one and a half, Washington''s approval needed inside them.{2} McNamara against: "the price is high and the gain is low." Clifford for;{3} Rusk for the 14 authorized targets inside, not armed reconnaissance.{4} Johnson lifts the five-mile limit and approves the 14 targets;{5} armed reconnaissance to be raised again once they are hit.{6}'
    n: 'FRUS 1964–68, VI, doc. [59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (Tom Johnson''s notes). [[w.drea-mcnamara-clifford-and-the-2011]], 223 (the request, McNamara against, Clifford for, the decision); [[w.berman-lyndon-johnsons-war]], 154–56 (dated Feb. 5: the circles to three miles around Hanoi and a mile and a half around Haiphong; Rusk against, McNamara: "the price is high and the gain is low," Wheeler: "I am fed up to the teeth," Clifford for; McNamara: not "a ''last-gasp'' action"); [[w.drea-mcnamara-clifford-and-the-2011]], 223 (Feb. 3, the Chiefs ask the restricted areas reduced; at the Tuesday lunch, Johnson overrides McNamara and goes with Clifford). Made public: FRUS 1964–68, VI (2002). To check: JCSM-78-68, the Joint Chiefs to McNamara, Feb. 3, 1968, Pentagon Papers Backup, Acc 75-062 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 223 n.81). See [[cal.1967-11-09.vietnam-air-war]]. Names: Wheeler, McNamara, Clifford, Rusk, Johnson.'
    src:
      c: cf6b4e85
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d59: 1, 2, 3, 4, 5, 6'
        - 'via w.drea-mcnamara-clifford-and-the-2011 223 n.81a: 2'
        - 'via w.drea-mcnamara-clifford-and-the-2011 223 n.81b: 1, 3, 5'
