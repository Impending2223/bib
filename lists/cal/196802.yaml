    date: '1968-02-04'
    place: nha-trang
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Nha Trang. The fighting in the city goes on to the sixth day of Tết and the attackers, unable to finish it as the enemy's pressure grows, withdraw. Regiment 20 with local forces works in Diên Khánh and Vĩnh Xương districts, cutting Route 21 and Route 1.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 125. See [[cal.1968-01-29.vietnam-tet-2]]. Check: the day; "the sixth day of Tết" by the South''s calendar.'
    tags: [polity:drv, polity:rvn]
  - id: cal.1968-02-04.vietnam-tet-3
    when: Feb. 4
    date: '1968-02-04'
    time: 1968-02-04T15:00Z
    place: vinh-long
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: 'Vĩnh Long. After naval gunfire and bombing the enemy lands two battalions of the American 9th Division''s 2d Brigade behind the Cầu Vồng road, with Saigon troops, closing two arms around the town. The front command, after six days and heavy losses, decides to hit a part of the American force and withdraw. At 11 p.m. Battalion 306 raids an American group south of the Cá Trê bridge, destroys a company and by the history''s count puts hundreds out of action, and opens the way for the wounded and the mobile battalion to leave for Phước Hậu, 5 kilometers south. The history''s count for the six days: 9,800 of the other side out of action; its own dead 228.'
    n: '[[w.lich-su-khang-chien-chong-my]], V, 147–48. See [[cal.1968-01-30.vietnam-tet-16]]. Check: the clock, whose it is. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn]
    time_zone: Asia/Ho_Chi_Minh
  - id: cal.1968-02-04.vietnam-tet-4
    when: Feb. 4
    date: '1968-02-04'
    place: dalat
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Đà Lạt. Battalion 186, now all up, with Sapper Company 852 and Company 809, attacks the subsector again; the forces take only three quarters of the positions, held off in the southwest by an armored battalion the enemy brings in. In the northwest three thrusts go deep toward the center, at the province chief's residence, the Civil Guard headquarters and the Public Security office; the enemy counterattacks hard and there is heavy fighting at the Hòa Bình market until helicopters are called to destroy it, and the forces fall back to Đa Cát.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 135–36. See [[cal.1968-01-31.vietnam-tet-16]]. Battalion 186 reached its position only the night of Feb. 4. Check: whether the northwest thrusts are Feb. 4; the history gives no day.'
    tags: [polity:drv, polity:rvn]
