    c: 'The Cabinet Room, 11:02 a.m.: Johnson with the Joint Chiefs, Rusk, McNamara, Clifford and Rostow. "Hope for the best and expect the worst": extensions, call-ups, specialists. Should he ask for more than the Gulf of Tonkin resolution, a declaration of war? Rusk: no; a challenge to Moscow and Peking "in a way we have never challenged them before." Clifford: "a very strange contradiction in what we are saying and doing."'
