    place: my-tho
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Mỹ Tho. At the second peak the enemy has strengthened the city's defenses, and only part of Battalion 514 gets in, from the southeast, destroying an M113 and a bunker at the Quay bridge and setting a boat afire on the Bảo Định. Regiments 1 and 2 of the region, Feb. 19 to 29, cannot enter the town and fight the counterattacks in the outlying communes of Đạo Thạnh, Mỹ Phong, Thanh Bình and Mỹ Tịnh An.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 157–58. See [[cal.1968-01-29.vietnam-tet-3]]. The history says "the night of Feb. 17". Check: the clock, whose it is. The figures are the history''s.'
