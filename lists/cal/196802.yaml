  - id: cal.1968-02-01.king-memphis
    when: Feb. 1
    date: '1968-02-01'
    thread: king-memphis
    c: Memphis. Echol Cole and Robert Walker, sanitation workers, crushed in the compressor of their garbage truck, sheltering from the rain. That day P. J. Ciampa of AFSCME, with T. O. Jones, sees Blackburn of public works. No death benefits for "unclassified workers"; Loeb gives $500.
