    c: 'The Cabinet Room, 11:02 a.m.: Johnson with the Joint Chiefs, Rusk, McNamara, Clifford and Rostow.{1} Nitze, Christian and Tom Johnson are there too.{4} "Hope for the best and expect the worst": extensions, call-ups, specialists. Should he ask for more than the Gulf of Tonkin resolution, a declaration of war? Rusk: no; a challenge to Moscow and Peking "in a way we have never challenged them before."{2} Clifford: "a very strange contradiction in what we are saying and doing."{3} Wheeler: the South Vietnamese forces about 360,000 men, all forces about 600,000. Johnson, after Clifford: the enemy has changed its tactics; "We have to be prepared for all that we might face."{6} Wheeler: Westmoreland wants the 82nd Airborne and two-thirds of a Marine division, 15 battalions; McNamara: about 40,000 men in all. Wheeler: the North Vietnamese infantry up from 78 battalions to 105 since December.{5}'
    n: '[FRUS 1964–68, VI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v06/d64). [[w.dallek-flawed-giant]], 507 ("plan for the worst," the later words of the meeting); [[w.branch-at-canaans-edge]], 693 (Clifford''s "strange contradiction"); [[w.berman-lyndon-johnsons-war]], 160–62 (dated Feb. 8: ARVN about 360,000; a declaration of war, Rusk against; Clifford: "a very strong contradiction in what we are saying and doing"; Wheeler: the North''s battalions from 78 to 105 since December); [[w.barrett-uncertain-warriors]], 115–16 (Johnson with the Joint Chiefs on Feb. 9, Wheeler: Westmoreland will cable for emergency reinforcements; Rusk, McNamara and others at it; no hour); [[w.berman-lyndon-johnsons-war]], 160–61. [[w.longley-lbjs-1968]], 63–64 (the meeting; Clifford''s contradiction). Made public: FRUS 1964–68, VI (2002). [[w.clifford-counsel-to-the-president-2]], 476 (Wheeler: Westmoreland would "welcome reinforcements"; Clifford''s contradiction). To check: Notes of LBJ meeting with the Joint Chiefs of Staff, Feb. 9, 1968, Tom Johnson Papers, Box 2, p. 13, LBJ (cited by [[w.branch-at-canaans-edge]], 693); "Johnson Says Foe''s Raids Are a Failure Militarily," [*New York Times*, Feb. 3, 1968](https://timesmachine.nytimes.com/timesmachine/1968/02/03/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 693). See [[cal.1968-02-09.vietnam]]. Names: Johnson, Wheeler, Rusk, McNamara, Clifford, Rostow, Westmoreland, Nitze, Christian, Tom Johnson. Check: Clifford, 476, dates this meeting Feb. 8.'
