    n: '[[w.cosmas-joint-chiefs-of-staff]], 161 (the broadcast; the stalemate). [[w.longley-lbjs-1968]], 71 (the broadcast; "mired in stalemate"; negotiation). Check: the broadcast''s words; Cosmas, 161, from Hammond, *Public Affairs*, 369–70, has "mired in stalemate" and "not as victims, but as an honorable people who lived up to their pledge to victory and democracy". To check: [[w.brinkley-cronkite]]; [[w.cronkite-reporters-life]]; [[w.campbell-getting-it-wrong]]; [[w.hallin-uncensored-war-the-media]]; [[w.braestrup-big-story]]. Names: Cronkite.'
