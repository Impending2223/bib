    when: Feb. 4
    date: '1968-02-04'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy-campaign]
    c: 'Gallup, Jan. 4–9, Democrats, the convention''s choice narrowed to two: Johnson 71 percent, McCarthy 18, no opinion 11. Johnson 52, Robert Kennedy 40, no opinion 8.'
    n: '[[w.gallup-poll]], III, 2104. Names: McCarthy, Johnson, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:johnson-lyndon-b, name:kennedy-robert-f]
  - id: cal.1968-02-04.japan-and-korea-pueblo
    when: Feb. 4
    date: '1968-02-04'
    thread: japan-and-korea-pueblo
    c: 'Rusk and McNamara on *Meet the Press*. McNamara, by Rusk''s account: no certainty whether the *Pueblo* came within the twelve-mile limit until Bucher is heard and the logs read.'
    n: 'The program: the Library of Congress''s inventory of Spivak''s photographs, LOT 13025-934. [[w.rusk-as-i-saw-it-1990]], 393. Check: Rusk does not date the program ("shortly after the seizure"). See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk, McNamara, Bucher.'
    src:
      c: 69004fb2
      rows:
        - '"The program": A'
        - 'w.rusk-as-i-saw-it-1990 393: all'
