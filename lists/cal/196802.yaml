  - id: cal.1968-02.robert-kennedy-campaign-4
    when: Feb. 17–18
    date: '1968-02-17'
    place: hickory-hill
    thread: robert-kennedy-campaign-decision
    also: [elections-1968]
    c: 'Word that McCarthy has risen to 40 percent in New Hampshire''s polls.{1} Robert Kennedy calls a man in Johnson''s organization: it is true.{2} Kennedy: "God, I''m going to lose them, and I''m going to lose them forever."{3}'
    n: '[[w.thomas-robert-kennedy]], 357; [[w.witcover-85-days]], 51–52 (Hickory Hill, the weekend of the Junior Village telethon, Feb. 17–18: Salinger produces a poll that McCarthy could get 40 percent of New Hampshire''s Democratic vote, "If it''s true, you have to announce before the primary"; Kennedy calls Bill Dunphy, a former Democratic chairman in the State; then shows Salinger Pete Hamill''s letter urging him to run, which, Salinger later, "helped Kennedy over the brink"; not Kennedy''s words). Check: the day: [[w.witcover-85-days]], 51, puts Salinger''s poll and Kennedy''s call at Hickory Hill on the weekend of the Junior Village telethon, Feb. 17–18. To check: Pierre Salinger, oral history, JFK Library; Joe Dolan, oral history, JFK Library (cited by [[w.thomas-robert-kennedy]], 469). Names: McCarthy, Robert Kennedy. Check: the day; the poll.'
    src:
      c: 7002babd
      rows:
        - 'w.thomas-robert-kennedy 357: 1, 2, 3'
        - 'via w.thomas-robert-kennedy 357 n.god-im-going-to-lose-them: 1, 2, 3'
        - 'w.witcover-85-days 51–52: 1'
    tags: [name:mccarthy-eugene-j, name:kennedy-robert-f, state:nh, ok:result-form]
    variants:
      - unit: '2'
        witness: w.witcover-85-days
        reads: 'Witcover: Kennedy calls Bill Dunphy, "a knowledgeable former Democratic chairman in the state": McCarthy "was gaining," Dunphy said, "but he doubted he''d do that well."'
        at: '51'
