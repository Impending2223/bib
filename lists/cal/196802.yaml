    c: 'Mao with Hồ Chí Minh, Peking (Great Hall of the People); Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing and Ye Qun present.{1} On the war: the Americans cannot win; in the south go for more countryside and the enemy''s field forces, leave the big cities for later; he suggests organizing several field armies, each to fight three or four battles a year and destroy whole units. Offered as advice for the Vietnam Workers'' Party to decide.{2}'
