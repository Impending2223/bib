    also: [vietnam-hanoi, vietnam, china-foreign]
    c: 'Zhou Enlai, in his talk with Hồ Chí Minh after the meeting with Mao: at this stage of the war in Vietnam, might one to three field corps be organized, each of 30,000 to 40,000 men, striving to destroy whole units of four or five thousand in each battle; they should fight far from home, in this war zone or another. Against isolated enemy, approach by tunnel and fight at night and close, so that aircraft and artillery lose their effect; tunnels dug at three or four points to carry troops and ammunition; some force also to hit the enemy''s reinforcements.{1}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 213 (Feb. 7, 1968); [[w.77-conversations-between-chinese]], [120–121](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=118) (doc. 30; Beijing, Feb. 7, 1968, no hour: Zhou to Hồ Chí Minh on one to three field corps of 30,000–40,000, battles to destroy 4,000–5,000 of the enemy in whole units, tunnels and underground galleries in three or four directions, night and close fighting, reserves for reinforcements; 121 n.191, the context of Khe Sanh, from Jan. 21, and the Tet offensive, from Jan. 31). Made public: 1998. Check: the Vietnamese record. Check: "after the meeting with Mao": the Zhou nianpu (III, 213) has Zhou go with Mao to meet Hồ Chí Minh and, "the same day" (同日), make his proposal in talking with Hồ; the Wilson Center text (doc. 30) gives no hour. The talk may be part of the same meeting. See [[cal.1968-02-07.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh, Mao Zedong.'
    src:
      c: 576d4bb2
      rows:
