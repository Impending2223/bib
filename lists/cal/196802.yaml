    c: 'Mao, Peking, answers the report and proposal on the Xuzhou rail stoppage that Zhou Enlai, Kang Sheng, Jiang Qing, Yang Chengwu and Xie Fuzhi sent him.{1} Mao: fully agreed;{2} back to Zhou, and tell Lin Biao.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 4, 1968. [[w.zhou-enlai-nianpu-1949-2020]], III, 212–213 (Feb. 4, 1968; Zhou''s letter with the report and the proposal, and Mao''s note); [[w.jianguo-yilai-mao-zedong]], XIX, 216–217 (Feb. 4, 1968; Mao''s note ''Fully agreed. Back to the Premier to handle, and tell Lin Biao''; the book dates it Feb. 1968; the report was sent Feb. 4 by Zhou, Kang Sheng, Jiang Qing, Yang Chengwu and Xie Fuzhi; the order of Feb. 6 is quoted in n.1); [[w.mao-zedong-zhuan]], VI, ch. 77 n.2 (Feb. 4 Zhou Enlai 周恩来 sends Mao the report of the Railway Ministry''s military control commission''s production command on the stoppage of rail traffic in the Xuzhou area, with a letter: the destruction is worst on the Xuzhou–Bengbu–Zhengzhou–Lianyungang cross, next the Hengyang–Liuzhou–Guangzhou triangle, then the Kunming–Chengdu line, beyond factionalism and plainly counterrevolutionary, to be met with measures of dictatorship; Mao''s comment ''fully agree, back to the Premier to handle'', the manuscript dated Feb. 1968; the book names Zhou only as the sender and gives no word of Jinan, Lin Biao or the other signers, n.2). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 212–213 (Feb. 4, 1968), has the letter Zhou''s alone, written after a liaison meeting he called at once, and Mao''s note "fully agreed; back to the Premier to handle", with no word of Lin Biao. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhou Enlai, Kang Sheng, Jiang Qing, Yang Chengwu and Xie Fuzhi, report of Feb. 4, 1968 to Mao Zedong sending the Railway Ministry military control commission''s production command''s report of 11 a.m. on the stoppage of rail traffic in the Xuzhou area: the Jinan Military Region to move mobile forces against the saboteurs, political attack with military encirclement (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 216 n.1); Central Committee, State Council, Military Commission and Cultural Revolution Group, order of Feb. 6, 1968: the few bad ringleaders who incite, manipulate and direct the wrecking of railways, blowing up of bridges, attacks on trains and killing are counter-revolutionaries, to be put down and tried by law (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 217 n.1); Mao Zedong 毛泽东, comment on the report of the Railway Ministry''s military control commission''s production command (manuscript 手稿), Feb. 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.2). Names: Mao Zedong, Zhou Enlai, Kang Sheng, Jiang Qing, Xie Fuzhi, Lin Biao, Yang Chengwu.'
