  - id: cal.1968-02-27.vietnam
    when: Feb. 27
    date: '1968-02-27'
    place: washington
    thread: vietnam-205000
    also: [defense]
    c: 'Wheeler, back from Saigon, to Johnson: the enemy''s first attack "nearly succeeded in a dozen places";{1} Westmoreland asks for 205,000 more men, 105,000 by May 1.{2} At State, Johnson at the ranch, his advisers on the still-secret request, by McPherson''s notes.{3} McNamara: a reserve call-up of at least 150,000 needed, $10 billion more in fiscal 1969;{4} "I do not understand what the strategy is in putting in 205,000 men";{5} the 205,000 "neither enough to do the job, nor an indication that our role must change."{6} Clifford: say we will put in 500,000 to a million men; "How do we avoid creating feeling that we are pounding troops down rathole?"{7} Katzenbach: the 205,000 cannot be granted; the question is how to handle Wheeler. Rusk shares McNamara''s doubts and proposes a bombing halt; Rostow alone holds the bombing should go on.{13} The lunch is in the Secretary of State''s private dining room: Rusk, McNamara, Clifford, Rostow, Katzenbach and William Bundy, with McPherson and Califano; asked by Johnson to take up the request for 205,000, and a speech on Vietnam he plans for the end of March; three hours.{12} William Bundy: "We must also prepare for the worst";{8} "Our position may be truly untenable";{9} contingency plans to "withdraw with best possible face."{10} By Clifford''s account McNamara, in tears, of the bombing: "The goddamned Air Force, they''re dropping more on North Vietnam than we dropped on Germany in the last year of World War II, and it''s not doing anything!"{11}'
    n: 'FRUS 1964–68, VI, docs. [89](https://history.state.gov/historicaldocuments/frus1964-68v06/d89), [90](https://history.state.gov/historicaldocuments/frus1964-68v06/d90). [[w.cosmas-joint-chiefs-of-staff]], 159–60 (the report; the request); [[w.drea-mcnamara-clifford-and-the-2011]], 184, 223 (Wheeler''s report and the 205,000; McNamara at State, the reserves and $10 billion); [[w.johnson-vantage-point]], 389–90 (McNamara at the lunch at State); [[w.clifford-counsel-to-the-president-2]], 479–85 (Wheeler''s report, quoted, 481; the table of 205,179, 483; the meeting at State, McNamara''s $10 billion, 484; McNamara in tears, 485); [[w.westmoreland-soldier-reports]], 353–56 (Wheeler in Saigon from Feb. 23, three days; the forces in three increments; his report from Honolulu, "a very near thing"); [[w.mcnamara-in-retrospect]], ch. 10 (McNamara''s last act on Vietnam: against Westmoreland''s 200,000, on economic, political and moral grounds). [[w.longley-lbjs-1968]], 67–68 (McNamara at the meeting at State); [[w.califano-triumph-and-tragedy-of]], 262–64 (Califano''s account of the lunch in Rusk''s dining room: McNamara on the 205,000, "madness"; Clifford''s "500,000 to a million men"; William Bundy, plans for withdrawal "with the best possible face"; Rostow alone hopeful; "It really is all over, isn''t it?"); [[w.branch-at-canaans-edge]], 704 (205,179 more; McPherson, "unbelievable and futile"); [[w.berman-lyndon-johnsons-war]], 170–72 ("how narrow the margin was between victory and defeat"; 206,000 in three parts, 108,000 by May 1, 42,000 by Sept. 1, 55,000 by Dec. 31; "1968 will be the pivotal year"); [[w.barrett-uncertain-warriors]], 125–26 (the working lunch of Feb. 27 on Wheeler''s report; McNamara''s "minimum of 150,000" reserves); [[w.berman-lyndon-johnsons-war]], 172–74 (the advisers'' meeting, by McPherson''s notes); [[w.kotz-judgment-days]], 397 (McNamara in tears at a meeting, his last before Clifford; no date given); [[w.bernstein-guns-or-butter]], 477 (Califano and McPherson there; "the most depressing three hours"); [[w.califano-triumph-and-tragedy-of]], 262–63; [[w.califano-triumph-and-tragedy-of]], 263–64. [[w.mcpherson-political-education]], 430–31 (the lunch at State: McNamara against the bombing). Made public: the request, [*New York Times*, Mar. 10, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/10/issue.html); the meetings, the Pentagon Papers (1971) and FRUS 1964–68, VI (2002). [[w.mann-grand-delusion]], 585 (William Bundy; McNamara at the meeting). Check: Westmoreland gives the first increment as about 108,000 men, ready by May (355–56). To check: [[w.schandler-unmaking-of-a-president]]; [[w.hoopes-limits-of-intervention]]; [[w.isaacson-wise-men]]; [[w.carson-in-struggle]], 283 (cited by [[w.branch-at-canaans-edge]], 704). See [[cal.1968-01-30.vietnam]]. Names: Wheeler, Westmoreland, Johnson, McPherson, McNamara, Clifford, William Bundy, Rusk, Rostow, Katzenbach, Califano.'
