    place: saigon
    thread: vietnam-tet
    also: [press-and-broadcasting]
    c: Saigon.{1} General Nguyễn Ngọc Loan, the national police chief, shoots a bound Viet Cong prisoner in the street; photographed by Adams of the Associated Press, filmed by an NBC crew.{2} The photograph on front pages Feb. 2; the film on NBC's evening news (Check the day).{3}
    n: '[[w.branch-at-canaans-edge]], 682 (outside the An Quang temple); [[w.bernstein-guns-or-butter]], 475 (NBC in color; Adams''s photograph on "virtually every" front page); [[w.westmoreland-soldier-reports]], 328 ("on the second day of the fighting," near the An Quang pagoda; Adams''s photograph; NBC''s film). To check: [[w.karnow-vietnam]], 462, 542 (cited by [[w.branch-at-canaans-edge]], 682); [[w.braestrup-big-story]], 347–49 (cited by [[w.branch-at-canaans-edge]], 682); [[w.langguth-our-vietnam]], 475 (cited by [[w.branch-at-canaans-edge]], 682); [[w.oberdorfer-tet]], 161–71 (cited by [[w.branch-at-canaans-edge]], 682); McPherson, *A Political Education* (1988), 424–25 (cited by [[w.branch-at-canaans-edge]], 682); [[w.dallek-flawed-giant]], 505–6 (cited by [[w.branch-at-canaans-edge]], 682). See [[cal.1968-01-30.vietnam]]. Names: Nguyễn Ngọc Loan, Adams.'
