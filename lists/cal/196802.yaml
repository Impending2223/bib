    c: Memphis.{1} Echol Cole and Robert Walker, sanitation workers, crushed in the compressor of their garbage truck, sheltering from the rain.{2} That day P. J. Ciampa of AFSCME, with T. O. Jones, sees Blackburn of public works.{3} No death benefits for "unclassified workers";{4} Loeb gives $500.{5}
