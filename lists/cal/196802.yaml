    c: 'Rusk to Dobrynin: the bombing of Soviet ships at Haiphong accidents. Could Moscow get "at least a rough idea" of Hanoi''s intentions, so the bombing might stop? The President could not stop it "blindfolded." "Why shouldn''t Moscow arrange for another Tashkent, this time to settle the Vietnam conflict?" Dobrynin: for the United States and the DRV to settle. By Dobrynin''s account.'
