    c: 'Zhou Enlai at a meeting at Mao''s: Mao says rebellion depends on whom one rebels against, not against the proletariat; wrecking the railways is not allowed. Zhou: in the first quarter transport, industry and coal are to be raised; great alliance and three-in-one.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 214 (Feb. 11, 1968); [[w.mao-zedong-zhuan]], VI, ch. 77 n.3 (a record of the Chairman''s instructions 《主席指示》 compiled Feb. 12 gives, undated by day: Zhou: in the first quarter transport is to be got up, industry and coal; there is to be a great alliance and the three-in-one; Mao: whoever wrecks the railways, wipe out; there is no all-one-colour thing in the world, the wish for it is factionalism, one should make self-criticism and the army is responsible; the record went to the army-level and military-region departments; the book does not date the talk, n.3). Made public: 2020. To check: *Zhuxi zhishi* 《主席指示》, compiled Feb. 12, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.3). Names: Zhou Enlai, Mao Zedong.'
