    c: 'The Senate Foreign Relations Committee, in closed session, on the Gulf of Tonkin attacks of August 1964: McNamara and Wheeler before Fulbright''s committee. McNamara: the second attack, Aug. 4, took place. The text released, censored, Feb. 24. McNamara: the suggestion that the government induced the incident "monstrous." Fulbright: "I regret it more than anything I have ever done in my life, that I was the vehicle which took that resolution to the floor." Morse: "a confused bungle."'
