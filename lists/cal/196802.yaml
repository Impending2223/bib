  - id: cal.1968-02-08.europe-and-the-alliance-2
    when: Feb. 8
    date: '1968-02-08'
    time: 1968-02-09T03:27Z
    place: washington
    thread: europe-and-the-alliance
    follows:
      - cal.1968-02-08.europe-and-the-alliance
    c: 'The White House, the State Dinner for Wilson, 150 guests. Wilson had warned Mrs. Johnson that his toast would be "quite long and quite serious," and that "Bill Fulbright wouldn''t like it." Johnson''s toast: "The American and British peoples are not short-distance crusaders. We are veteran campaigners, not amateurs, and we have never been quitters." On the songs: "Mr. Prime Minister, we could compromise and sing a duet. You sing ''God Save the Queen'' and I''ll sing ''God Bless America.''" Wilson''s toast backs the San Antonio formula for starting peace talks on Vietnam, tells of his explaining Britain''s stand to the Russian leaders in Moscow the month before, promises Britain''s part "both in negotiations and reconstruction in Vietnam," and says Johnson''s restraint over the Pueblo "will earn tribute from reasoning men everywhere." Robert Merrill sings. After, Johnson goes upstairs for the reports from Vietnam: "I''ve got to get back to Khe Sanh."'
    n: 'Toasts of the President and Prime Minister Wilson of the United Kingdom, [1968–69 Pub. Papers 209](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=287) (Feb. 8, 1968) (the hour in its note: the President''s toast, 10:27 p.m., the State Dining Room). [[w.johnson-white-house-diary]], 630–32 (Lady Bird Johnson''s account; the toasts in her quotation and paraphrase, not the texts). Merrill''s songs, "On the Road to Mandalay" and the Gershwin, had been called by the press an insult to the British Empire; Wilson sent word they were his favorites (629). After [[cal.1968-02-08.europe-and-the-alliance|the talks]]: the conference set for 11:30 to one, then lunch on the second floor, "talking and working until past 3:30"; the dinner that night ([[w.johnson-white-house-diary]], 629–30). See [[cal.1968-02-08.europe-and-the-alliance]]. Names: Wilson, Lady Bird Johnson, Fulbright, Johnson.'
    tags: [name:wilson-harold, name:johnson-lady-bird, name:fulbright-j-william, name:johnson-lyndon-b, polity:uk, city:washington]
    time_zone: America/New_York
  - id: cal.1968-02-08.vietnam-hanoi
