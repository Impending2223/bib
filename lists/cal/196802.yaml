  - id: cal.1968-02-01.elections-1968
    when: Feb. 1–2
    date: '1968-02-01'
    place: manchester
    thread: elections-1968
    c: Nixon announces for the Republican nomination in a letter to New Hampshire's voters, Feb. 1;{1} at Manchester, Feb. 2, his first news conference of the campaign.{2} "Gentlemen, this is not my last press conference."{3} The nominee to be chosen not in smoke-filled rooms but in the "fires of the primaries."{4}
    n: '[[w.nixon-rn]], 297 (the Manchester press conference, Feb. 2; its words); [[w.cq-weekly-report]], Aug. 16, 1968, 2186 (the formal announcement, Feb. 1). [[w.white-making-of-the-president-1969]], 5–6, 128 (Feb. 2, the Holiday Inn at Manchester, two in the afternoon, his first full press conference since 1962; "I have decided that I will test my ability ... in the fires of the primaries and not just in the smoke-filled rooms of Miami Beach"). Check: White, 5, has the 150,000 letters go out Wednesday, Jan. 31. To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.gould-1968]]; [[w.perlstein-nixonland-2008]]. See [[cal.1967-01-07.elections-1968]]. Names: Nixon.'
    src:
      c: 3effff4e
      rows:
        - 'w.nixon-rn 297: 2, 3, 4'
        - 'w.cq-weekly-report Aug. 16, 1968, 2186: ?'
        - 'w.white-making-of-the-president-1969 5–6, 128: 2, 4'
    tags: [name:nixon-richard-m, state:nh]
    short: Nixon announces
  - id: cal.1968-02-01.consumers
    when: Feb. 1
    date: '1968-02-01'
    place: washington
    thread: consumers
    c: 'The House passes H.R. 11601, Sullivan''s Consumer Credit Protection Act, [383–4](https://voteview.com/rollcall/RH0900250): the cost of credit disclosed as an annual percentage rate. Adopted first, [383–5](https://voteview.com/rollcall/RH0900249), an amendment making loan-sharking a federal crime. To conference with the Senate''s S. 5. Johnson: "the consumers'' Congress."'
    n: 'Statement by the President Following Passage of the Truth-in-Lending Bill by the House of Representatives, [1968–69 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=226) (Feb. 1, 1968). The House sat from noon to 5:05 p.m.: [Daily Digest, D29](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=27). To check: [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-07-11.consumers]]. Names: Sullivan, Johnson.'
    tags: [name:sullivan-leonor-k, name:johnson-lyndon-b]
    time_range:
      - 1968-02-01T17:00Z
      - 1968-02-01T22:05Z
    time_zone: America/New_York
  - id: cal.1968-02-01.economy
    when: Feb. 1
    date: '1968-02-01'
    thread: economy
    c: 'Economic Report: growth in 1967 a little over 1 percent a year in the first half, about 4½ in the second; with the surcharge, GNP up some $60 billion in 1968, about 7¾ percent; the 10 percent surcharge asked again.'
    n: 'Annual Message to the Congress: The Economic Report of the President, [1968–69 Pub. Papers 126](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=204) (Feb. 1, 1968). To check: [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-01-29.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
