  - id: cal.1968-02-01.vietnam
    when: Feb. 1
    date: '1968-02-01'
    thread: vietnam-tet
    also: [press-and-broadcasting]
    c: Saigon. General Nguyễn Ngọc Loan, the national police chief, shoots a bound Viet Cong prisoner in the street; photographed by Adams of the Associated Press, filmed by an NBC crew. The photograph on front pages Feb. 2; the film on NBC's evening news (Check the day).
    n: 'See [[cal.1968-01-30.vietnam]]. Names: Nguyễn Ngọc Loan, Adams.'
    tags: [name:nguyen-ngoc-loan, name:adams-eddie, place:saigon]
  - id: cal.1968-02-01.elections-1968
    when: Feb. 1–2
    date: '1968-02-01'
    thread: elections-1968
    c: Nixon announces for the Republican nomination in a letter to New Hampshire's voters, Feb. 1; at Manchester, Feb. 2, his first news conference of the campaign. "Gentlemen, this is not my last press conference." The nominee to be chosen not in smoke-filled rooms but in the "fires of the primaries."
    n: '[[w.nixon-rn]], 297 (the Manchester press conference, Feb. 2; its words). To check: [[w.witcover-resurrection-of-richard-nixon]]; [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.gould-1968]]; [[w.perlstein-nixonland-2008]]. See [[cal.1967-01-07.elections-1968]]. Names: Nixon.'
    src:
      c: 3effff4e
      rows:
        - 'w.nixon-rn 297: B-D'
    tags: [name:nixon-richard-m, state:nh]
  - id: cal.1968-02-01.consumers
    when: Feb. 1
    date: '1968-02-01'
    thread: consumers
    c: 'The House passes H.R. 11601, Sullivan''s Consumer Credit Protection Act, [383–4](https://voteview.com/rollcall/RH0900250): the cost of credit disclosed as an annual percentage rate. Adopted first, [383–5](https://voteview.com/rollcall/RH0900249), an amendment making loan-sharking a federal crime. To conference with the Senate''s S. 5. Johnson: "the consumers'' Congress."'
    n: 'Statement by the President Following Passage of the Truth-in-Lending Bill by the House of Representatives, [1968–69 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=226) (Feb. 1, 1968). To check: [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-07-11.consumers]]. Names: Sullivan, Johnson.'
    tags: [name:sullivan-leonor-k, name:johnson-lyndon-b]
  - id: cal.1968-02-01.economy
    when: Feb. 1
    date: '1968-02-01'
    thread: economy
    c: 'Economic Report: growth in 1967 a little over 1 percent a year in the first half, about 4½ in the second; with the surcharge, GNP up some $60 billion in 1968, about 7¾ percent; the 10 percent surcharge asked again.'
    n: 'Annual Message to the Congress: The Economic Report of the President, [1968–69 Pub. Papers 126](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=204) (Feb. 1, 1968). To check: [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1968-01-29.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-01.opinion
    when: Feb. 1
    date: '1968-02-01'
    thread: opinion
    c: 'Panzer to Johnson: Quayle''s telephone poll on the State of the Union, Jan. 19–20: favorable 45 percent, unfavorable 55. More favorable among those who saw or heard it than among those told of it; unfavorable among 40 percent of the Democrats; most unfavorable, men 21 to 49.'
    n: '[[w.longley-lbjs-1968]], 30. To check: Fred Panzer to Johnson, Feb. 1, 1968, Speeches, Box 151, LBJ Library (cited by [[w.longley-lbjs-1968]], 30 n.58). See [[cal.1968-01-17.program]]. Names: Johnson.'
    src:
      c: 09778a26
      rows:
        - 'w.longley-lbjs-1968 30: all'
        - 'via w.longley-lbjs-1968 30 n.58: all'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-01.robert-kennedy
    when: Feb. 1
    date: '1968-02-01'
    thread: robert-kennedy-campaign
    also: [elections-1968]
    c: 'Schlesinger to Robert Kennedy: "I am sure that the decision you reached was the only one in the circumstances," but "go no further than you have in taking yourself out of things"; "the situation may take a new turn by the spring and unconditional declarations of non-candidacy might be an embarrassment." Enclosed, a graduate student''s "Reflections of a 22-Year Old on Senator Kennedy in January 1968."'
    n: '[[w.palermo-in-his-own-right]], 107. To check: Schlesinger to Robert Kennedy, Feb. 1, 1968, RFK Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 107 n.35). See [[cal.1968-01-30.robert-kennedy]]. Names: Schlesinger, Robert Kennedy.'
    src:
      c: 4663d6d1
      rows:
        - 'w.palermo-in-his-own-right 107: all'
        - 'via w.palermo-in-his-own-right 107 n.35: all'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-robert-f]
  - id: cal.1968-02-02.vietnam-tet
    when: Feb. 2
    date: '1968-02-02'
    thread: vietnam-tet
    c: 'News conference. Johnson on the offensive: its first object, military success, "a complete failure"; the second, a psychological victory, not to be won.'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 155](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=233) (Feb. 2, 1968). [[w.longley-lbjs-1968]], 59 (the news conference). See [[cal.1968-01-30.vietnam]]. Names: Johnson.'
    src:
      c: 59f61681
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=233: all'
        - 'w.longley-lbjs-1968 59: A-C'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-02.japan-and-korea
    when: Feb. 2
    date: '1968-02-02'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the Neutral Nations Supervisory Commission''s conference room, 11 a.m.: the first private meeting on the *Pueblo* of the Military Armistice Commission''s senior members, Rear Admiral Smith and Major General Pak Chung Kuk. Rostow to Johnson: the North Korean "obviously instructed to stonewall."'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [247](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d247), [254](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d254). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Smith, Pak Chung Kuk, Rostow, Johnson.'
    tags: [name:smith-john-v, name:pak-chung-kuk, name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1968-02-02.jobs-and-wages-nyc
    when: Feb. 2
    date: '1968-02-02'
    thread: labor-disputes
    also: [states-and-cities]
    c: New York City. The Uniformed Sanitationmen's Association, its members rejecting a tentative contract, strikes, against the Taylor Law. Garbage piles in the streets.
    n: '[Harvard Kennedy School case 774.0, "Labor Relations, Politics and Public Opinion: The New York City Sanitation Strike of 1968"](https://case.hks.harvard.edu/labor-relations-politics-and-public-opinion-the-new-york-city-sanitation-strike-of-1968). To check: [[w.cannato-ungovernable-city]]; [[w.connery-rockefeller-of-new-york]]; [[w.freeman-working-class-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1967-09-11.states-and-cities-nyc]].'
    tags: [state:ny, city:nyc]
  - id: cal.1968-02-04.opinion
    when: Feb. 4
    date: '1968-02-04'
    thread: opinion
    also: [elections-1968-polls, robert-kennedy-campaign]
    c: 'Gallup, Jan. 4–9, Democrats, the convention''s choice narrowed to two: Johnson 71 percent, McCarthy 18, no opinion 11. Johnson 52, Robert Kennedy 40, no opinion 8.'
    n: '[[w.gallup-poll]], III, 2104. Names: McCarthy, Johnson, Kennedy.'
    tags: [name:mccarthy-eugene-j, name:johnson-lyndon-b, name:kennedy-robert-f]
  - id: cal.1968-02-05.japan-and-korea-blue-house
    when: Feb. 5
    date: '1968-02-05'
    thread: japan-and-korea-blue-house
    c: 'Park to Johnson: a plea for retaliation against the raids.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d155). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-21.japan-and-korea]]. Names: Park, Johnson.'
    tags: [name:park-chung-hee, name:johnson-lyndon-b]
  - id: cal.1968-02-05.school-aid
    when: Feb. 5
    date: '1968-02-05'
    thread: school-aid
    c: Message on education, "The Fifth Freedom." Head Start and Follow Through from $340 million to $380 million; $5 million to begin bilingual education; the handicapped from $53 million to $85 million; $30 million for a Stay in School program; Upward Bound for 30,000; Title I funded before the school year; a Partnership for Learning and Earning Act and a Networks for Knowledge Act.
    n: 'Special Message to the Congress on Education: "The Fifth Freedom", [1968–69 Pub. Papers 165](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=243) (Feb. 5, 1968). To check: [[w.graham-uncertain-triumph]]. See [[cal.1968-01-17.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-05.elections-1968
    when: Feb. 5
    date: '1968-02-05'
    thread: elections-1968
    also: [republican-party]
    c: 'Green Bay, Wis. Nixon against the administration''s peace offensives: the "only effective way" to bring Hanoi to peace is to "prosecute the war more effectively."'
    n: '[[w.johnson-vantage-point]], 399 n. (Johnson''s summary). To check: [*New York Times*, Feb. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/02/06/issue.html) (cited by [[w.johnson-vantage-point]], 399 n.). See [[cal.1968-02-01.elections-1968]]. Names: Nixon.'
    src:
      c: b8768216
      rows:
        - 'w.johnson-vantage-point 399: all'
        - 'via w.johnson-vantage-point 399 n.dagger: all'
    tags: [name:nixon-richard-m]
  - id: cal.1968-02-05.vietnam-congress
    when: Feb. 5
    date: '1968-02-05'
    thread: vietnam-congress
    also: [republican-party-congress, vietnam-tet]
    c: 'Javits in the Senate, "Vietnam: The Frenetic Stalemate": the lesson of the guerrilla raids and Khe Sanh, "the situation in Vietnam is basically stalemated"; each stalemate met with more force, "a new stalemate at a higher level"; prepare for a negotiated settlement.'
    n: '[114 Cong. Rec. 2087](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt2/pdf/GPO-CRECB-1968-pt2-5-2.pdf#page=56) (1968). [[w.mann-grand-delusion]], 573. Names: Javits.'
    src:
      c: d7d70430
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt2/pdf/GPO-CRECB-1968-pt2-5-2.pdf#page=56: all'
        - 'w.mann-grand-delusion 573: A'
        - 'via w.mann-grand-delusion 573 n.11: A'
    tags: [name:javits-jacob-k]
  - id: cal.1968-02-06.consumers
    when: Feb. 6
    date: '1968-02-06'
    thread: consumers
    c: 'Message, "To Protect the Consumer Interest," an eight-point program: a Deceptive Sales Act, new powers for the Federal Trade Commission; a study of automobile insurance by the Secretary of Transportation; a Hazardous Radiation Act, for television sets and other electronic products; a Wholesome Poultry Products Act; a Wholesome Fish and Fishery Products Act. The truth-in-lending conference to give "a strong Truth-in-Lending law."'
    n: 'Special Message to the Congress: "To Protect the Consumer Interest", [1968–69 Pub. Papers 173](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=251) (Feb. 6, 1968). See [[cal.1968-01-17.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-06.middle-east
    when: Feb. 6
    date: '1968-02-06'
    thread: middle-east
    c: 'Rusk and McNamara to Johnson: an arms package for Jordan, after General Khammash''s talks in Washington from Jan. 17: $82 million over fiscal 1968–70, 18 F-104s and 88 M-48 tanks in it, against Hussein''s request for $200 million; without it the King may take Soviet arms. McNamara the same day: a decision on Israel''s request for fifty Phantoms by Dec. 31, 1968, for deliveries from January 1970, about four a month.'
    n: 'FRUS 1964–68, XX, docs. [69](https://history.state.gov/historicaldocuments/frus1964-68v20/d69), [71](https://history.state.gov/historicaldocuments/frus1964-68v20/d71), [72](https://history.state.gov/historicaldocuments/frus1964-68v20/d72). Made public: FRUS 1964–68, XX (2001). See [[cal.1968-01-07.middle-east]]. Names: Rusk, McNamara, Khammash, Hussein, Johnson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:khammash-amer, name:hussein-ibn-talal, name:johnson-lyndon-b]
  - id: cal.1968-02-06.open-housing
    when: Feb. 6
    date: '1968-02-06'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: Senate, H.R. 2516, the bill against interference with civil rights. Ervin's amendment, narrowing it to rights under the commerce clause and in federally aided programs, tabled, [54–29](https://voteview.com/rollcall/RS0900317). Mondale and Brooke offer fair housing as a new title (Check the day).
    n: 'To check: [[w.mann-walls-of-jericho]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.macneil-dirksen]]; [[w.kotz-judgment-days]]; [[w.graham-civil-rights-era]]. See [[cal.1967-08-16.open-housing]]; [[cal.1968-01-24.open-housing]]. Names: Ervin, Mondale, Brooke.'
    tags: [name:ervin-sam-j-jr, name:mondale-walter-f, name:brooke-edward-w]
  - id: cal.1968-02-06.governors-la
    when: Feb. 6
    date: '1968-02-06'
    thread: governors
    also: [elections-1968]
    c: 'Louisiana''s general election. McKeithen (D), renominated Nov. 4, 1967, re-elected governor unopposed: no Republican filed. The first governor the constitution lets succeed himself, by the amendment of 1966.'
    n: '[Wikipedia, "1967 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1967_Louisiana_gubernatorial_election). Check: the Secretary of State''s *General Election Returns*, Feb. 6, 1968, and the vote. See [[cal.1967-11-04.governors-la]]. Names: McKeithen.'
    tags: [governors:1968-02-06, state:la, name:mckeithen-john-j]
  - id: cal.1968-02-06.vietnam
    when: Feb. 6
    date: '1968-02-06'
    thread: vietnam
    c: 'Tuesday lunch, 1:14 to 2:55 p.m. Wheeler for the Joint Chiefs, JCSM-78-68 of Feb. 3: the circles closed to strikes around Hanoi and Haiphong cut from five miles to three and one and a half, Washington''s approval needed inside them. McNamara against: "the price is high and the gain is low." Clifford for; Rusk for the 14 authorized targets inside, not armed reconnaissance. Johnson lifts the five-mile limit and approves the 14 targets; armed reconnaissance to be raised again once they are hit.'
    n: 'FRUS 1964–68, VI, doc. [59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (Tom Johnson''s notes). [[w.drea-mcnamara-clifford-and-the-2011]], 223 (the request, McNamara against, Clifford for, the decision). Made public: FRUS 1964–68, VI (2002). To check: JCSM-78-68, the Joint Chiefs to McNamara, Feb. 3, 1968, Pentagon Papers Backup, Acc 75-062 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 223 n.81). See [[cal.1967-11-09.vietnam-air-war]]. Names: Wheeler, McNamara, Clifford, Rusk, Johnson.'
    src:
      c: cf6b4e85
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d59: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 223: A-D, F'
        - 'via w.drea-mcnamara-clifford-and-the-2011 223 n.81a: B'
        - 'via w.drea-mcnamara-clifford-and-the-2011 223 n.81b: A, C-D, F'
    tags: [name:wheeler-earle, name:mcnamara-robert-s, name:clifford-clark, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1968-02-06.vietnam-tet
    when: Feb. 6
    date: '1968-02-06'
    thread: vietnam-tet
    also: [japan-and-korea-pueblo]
    c: 'Breakfast with the Democratic leaders of Congress, Boggs and Mansfield among them. Robert Byrd: poor intelligence, poor preparation for the attacks, the Viet Cong''s morale underestimated, South Vietnam''s support overestimated. Johnson: "I don''t agree with any of that"; at Panmunjom, "we are trying to keep them talking." At the Tuesday lunch Johnson is called away: Byrd, to apologize. Russell Long on the *Pueblo*. Byrd, by Tom Johnson''s notes: "we were not prepared for these attacks. We underestimated the morale and vitality of the Viet Cong. We overestimated the support of South Vietnam''s government." Johnson: "The popular thing now is to stress the mismanagement in Vietnam. I think there has been very little."'
    n: 'FRUS 1964–68, VI, doc. [58](https://history.state.gov/historicaldocuments/frus1964-68v06/d58) (Byrd''s four points, read to the advisers); doc. [59](https://history.state.gov/historicaldocuments/frus1964-68v06/d59) (the apology). [[w.longley-lbjs-1968]], 46, 60 (the breakfast). [[w.barrett-uncertain-warriors]], 117–18 (Long; Byrd''s words; Johnson''s on the "mismanagement"); [[w.palermo-in-his-own-right]], 114 n.71 (Johnson "fumed" at Byrd on the intelligence; Byrd, by the note, did not agree it was good). [[w.mann-grand-delusion]], 573–74 (Byrd and Johnson, by Tom Johnson''s notes). To check: Notes of the President''s Meeting with the Democratic Congressional Leadership, Feb. 6, 1968, Tom Johnson''s Notes of Meetings, Box 2, LBJ Library (cited by [[w.longley-lbjs-1968]], 46 n.39, 60 n.20); the same notes (cited by [[w.barrett-uncertain-warriors]], 118 n.31; by [[w.palermo-in-his-own-right]], 114 n.71). Made public: FRUS 1964–68, VI (2002). Check: Longley names Harry Byrd at the breakfast (46); FRUS and Longley (60) Robert Byrd. See [[cal.1968-01-30.vietnam]]. Names: Boggs, Mansfield, Robert C. Byrd, Johnson, Long. Check: Mann, 573, has "the next morning, on April 6," after Javits''s speech of Feb. 5.'
    src:
      c: 63d29b08
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d58: B-C'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d59: E'
        - 'w.longley-lbjs-1968 46, 60: A-D'
        - 'via w.longley-lbjs-1968 46 n.39: A, D'
        - 'via w.longley-lbjs-1968 60 n.18: B-C'
        - 'via w.longley-lbjs-1968 60 n.20b: E'
        - 'w.barrett-uncertain-warriors 117–18: F-H'
        - 'via w.barrett-uncertain-warriors 118 n.31: F-H'
        - 'w.palermo-in-his-own-right 114: B-C'
        - 'via w.palermo-in-his-own-right 114 n.71: B-C'
        - 'w.mann-grand-delusion 573–74: A-C, G-H'
        - 'via w.mann-grand-delusion 574 n.12: B-C, G-H'
    tags: [name:boggs-hale, name:mansfield-mike, name:byrd-robert-c, name:johnson-lyndon-b, name:long-russell-b]
  - id: cal.1968-02-07.vietnam
    when: Feb. 7
    date: '1968-02-07'
    thread: vietnam-khe-sanh
    c: Lang Vei, the Special Forces camp west of Khe Sanh, overrun before dawn by North Vietnamese infantry with PT-76 tanks, their first armor in the South (Check the losses).
    n: 'Wheeler to the National Security Council, Feb. 7: FRUS 1964–68, VI, doc. [60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60). See [[cal.1968-01-21.vietnam]]. Check: *Victory in Vietnam* dates the attack Feb. 6: the 24th Regiment and a battalion of the 101st, with two companies of PT-76s; 400 killed, three American advisers among them, 253 captured (222, 467 n.19).'
    tags: [place:lang-vei]
  - id: cal.1968-02-07.press-and-broadcasting
    when: Feb. 7
    date: '1968-02-07'
    thread: press-and-broadcasting
    also: [vietnam-tet]
    c: 'Bến Tre, a province capital in the Mekong Delta, retaken after Tet by American and South Vietnamese troops with air strikes and artillery. Arnett''s Associated Press dispatch quotes an American major: "It became necessary to destroy the town to save it."'
    n: 'See [[cal.1968-01-30.vietnam]]. Names: Arnett.'
    tags: [name:arnett-peter, place:ben-tre]
  - id: cal.1968-02-07.crime-and-hijacking
    when: Feb. 7
    date: '1968-02-07'
    thread: crime-and-hijacking
    c: 'Message on crime, "To Insure the Public Safety." The Safe Streets and Crime Control Act, $100 million for fiscal 1969; gun control; a Federal Anti-Riot Act against the agitator who crosses State lines; the Juvenile Delinquency Prevention Act; an Alcoholic Rehabilitation Act. Reorganization Plan No. 1: the Treasury''s Bureau of Narcotics and HEW''s Bureau of Drug Abuse Control joined in the Justice Department as the Bureau of Narcotics and Dangerous Drugs. Executive Order 11396: the Attorney General to coordinate the federal programs against crime.'
    n: 'Special Message to the Congress on Crime and Law Enforcement: "To Insure the Public Safety", [1968–69 Pub. Papers 183](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=261); Special Message to the Congress Transmitting Reorganization Plan 1 of 1968 Relating to Narcotics and Drug Abuse Control, [1968–69 Pub. Papers 197](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=275); [Executive Order 11396](https://www.presidency.ucsb.edu/documents/executive-order-11396-providing-for-the-coordination-the-attorney-general-federal-law) (Feb. 7, 1968). To check: [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1968-01-17.program]]; [[cal.1967-08-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-02-07.opinion
    when: Feb. 7
    date: '1968-02-07'
    thread: opinion
    also: [soviet-union, vietnam]
    c: 'Gallup, special survey, 28 nations rated on a scale from plus 5 to minus 5, favorable: Canada 94 percent, Switzerland 90, Australia 89, England 85, West Germany 75, Israel 74, Japan 72, India 62, South Vietnam 62, France 49, Egypt 39, Russia 19, North Vietnam 7, Cuba 6, Communist China 5.'
    n: '[[w.gallup-poll]], III, 2104–05.'
  - id: cal.1968-02-07.king-poor-peoples
    when: Feb. 7
    date: '1968-02-07'
    thread: king-poor-peoples
    also: [poverty]
    c: 'Washington. King gives the campaign''s demands: $30 billion a year against poverty; at the least, a commitment to full employment, a guaranteed annual income, and 500,000 low-cost houses a year. "Our protests will center on the government, Congress, and not the city at large."'
    n: '[[w.garrow-bearing-the-cross]], 595–96. To check: New York Times, Feb. 7, 1968, 17; Feb. 8, 1968, 30; Washington Post, Feb. 7, 1968, B1; Feb. 8, 1968, A1 (cited by [[w.garrow-bearing-the-cross]], 596 n.23). Check: the day; Garrow, 596, has it the morning after the march through Arlington Cemetery. See [[cal.1967-12-04.king]]. Names: King.'
    src:
      c: c22797ac
      rows:
        - 'w.garrow-bearing-the-cross 595–96: all'
        - 'via w.garrow-bearing-the-cross 596 n.23: B-D'
    tags: [name:king-martin-luther-jr]
  - id: cal.1968-02-07.vietnam-khe-sanh
    when: Feb. 7
    date: '1968-02-07'
    thread: vietnam-khe-sanh
    also: [vietnam-tet]
    c: 'The National Security Council, 12:29 p.m. Wheeler: Lang Vei evacuated; 670 Americans dead so far, the enemy''s dead 24,199. Johnson: "Bob, are you worried?" McNamara: "I am not worried about a true military defeat." Wheeler: "this is not a situation to take lightly." Johnson: "Everything he wants, let''s get it to him."'
