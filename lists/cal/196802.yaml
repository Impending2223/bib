    when: Feb.
    date: 1968-02
    thread: vietnam-205000
    c: 'Taylor to Johnson, for the Joint Chiefs'' call-up: a surprise in Korea or elsewhere likely enough "that it is an act of prudence to move additional ground forces to the area as rapidly as possible";{1} a reminder "that, while we are not technically at war, we are in a situation of similar emergency."{2}'
    n: '[[w.berman-lyndon-johnsons-war]], 167; [[w.taylor-swords-and-plowshares]], 388–89 (Taylor in the Clifford review for a call-up, a three-division force for the strategic reserve; "though technically not at war, we were in a situation of emergency"). To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 167). Check: the day. Names: Taylor, Johnson.'
