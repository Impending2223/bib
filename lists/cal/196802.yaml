    when: Feb. 1
    date: '1968-02-01'
    thread: elections-1968-mccarthy
    c: 'Portland, Ore. McCarthy''s first visit to the State: dinner with Howard Morgan; to fifty of his supporters, "It''s all up to you. You must accept me for what I am or forget this romance right now." He is not back until May 10.'
    n: '[[w.chester-american-melodrama]], 298–99 (Whipple''s account). See [[cal.1967-10-29.elections-1968]]. Names: McCarthy, Howard Morgan.'
