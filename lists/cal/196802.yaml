    c: 'Saigon. The night of Feb. 17 the rocket regiments 96 and 208 fire on Tân Sơn Nhứt, the Capital police headquarters and the 1st Division''s base at Phú Lợi: the BBC''s report of Feb. 18, at least 400 casualties at Phú Lợi, many stores and aircraft destroyed. Battalion 1 of the Quyết Thắng Regiment attacks the airborne 8th Battalion at Tân Thới Hiệp.'
    n: '[[w.lich-su-khang-chien-chong-my]], V, 115–16. The figures are the history''s. Check: the clock.'
