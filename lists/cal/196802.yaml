    c: Huế retaken.{1} South Vietnamese troops of Trưởng's 1st Division raise the Republic's flag over the Citadel, Feb. 24, after Marines and South Vietnamese had fought for the city from Feb. 1.{2} Graves of civilians killed during the occupation found in the weeks after (Check the count).{3}
