    c: Quế Chữ, Bôn Trì and Bôn Phổ, outside Huế. The enemy attacks from Liễu Cốc Thượng toward Quế Chữ and from Rú Lầu toward Bôn Trì and Bôn Phổ; the forces strike hard at the enemy's rear and push him back. That evening Battalion 9 of Regiment 8 goes into the citadel to reinforce it; the enemy has gained strength and the forces turn to defend the four gates, Chánh Tây, Hữu, Thượng Tứ and Đông Ba, and the road from Route 1 into An Hòa. Battalion 815 of Regiment 9 is brought from the southern wing to replace Battalion 816, which is sent into the city.
