    date: '1968-02-17'
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Nam Bộ. The night of Feb. 17 into Feb. 18 the forces attack together 11 provincial towns, 17 district towns and 7 airfields, besides Saigon. Across the country from Feb. 17 the history has the forces attack dozens of cities and provincial towns and hundreds of district seats and bases again.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 156–57. See [[cal.1968-02-17.vietnam-tet-2]]. The history says "the night of the 17th into the 18th". Check: the clock, whose it is.'
