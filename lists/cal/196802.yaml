  - id: cal.1968-02-18.vietnam-tet
    when: Feb. 18
    date: '1968-02-18'
    thread: vietnam-tet
    c: 'The Pentagon''s week: 543 Americans killed, 2,547 wounded, the most yet; American losses for the first time proportionally higher than the ARVN''s.{1} A new wave of attacks on forty-five cities and installations;{2} 122-mm rockets on Saigon.{3}'
    n: '[[w.clifford-counsel-to-the-president-2]], 479; [[w.branch-at-canaans-edge]], 694 (543 killed, 2,547 wounded); [[w.westmoreland-soldier-reports]], 332 ("a sharp flurry of local attacks, mostly with mortars and rockets, on February 18"). To check: [*New York Times*, Feb. 23, 1968](https://timesmachine.nytimes.com/timesmachine/1968/02/23/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 694); [[w.langguth-our-vietnam]], 480 (cited by [[w.branch-at-canaans-edge]], 694). See [[cal.1968-01-31.vietnam-tet]]. Check: the figures, by Clifford''s account.'
    src:
      c: e780f6b9
      rows:
        - 'w.clifford-counsel-to-the-president-2 479: 1, 2, 3'
        - 'w.branch-at-canaans-edge 694: ?'
        - 'via x.1968-02-23.new-york-times-feb-23-1968: 1, 2, 3'
        - 'w.westmoreland-soldier-reports 332: 2'
    tags: [place:saigon]
  - id: cal.1968-02-18.china-leadership
    when: Feb. 18
    date: '1968-02-18'
    thread: china-class-ranks
    also: [vietnam-hanoi, china-zhou-cr, china-army]
    c: 'Zhou Enlai revises the Center, State Council, Military Commission and Cultural Revolution Group''s urgent supplementary order. To keep aid transport to Vietnam clear: (1) inciting fire on trains, disorder at stations and ports, fights among rail workers, and beating and kidnapping military control men is counterrevolutionary banditry, to be dealt with by the Feb. 6 order; (2) rail and port workers hold their posts, no late arrival or early leaving, pay docked for unexplained absence; (3) military control men, line-guard troops and garrisons stop linking up and fights, and apply the Feb. 6 order if they fail; (4) the Center sends supervising groups at once to the main stations and ports.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 216–217 (Feb. 18, 1968). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1968-02.robert-kennedy-campaign-3
    when: Feb. 18
    date: '1968-02-18'
    place: hickory-hill
    thread: robert-kennedy-campaign-decision
    c: 'Hickory Hill, a cold weekend, a party in the house. In the bathhouse by the pool Robert Kennedy tells a few of his people again he is not running.{1} Edward Kennedy, Burke Marshall, vanden Heuvel and Goodwin are with him; the decision again is that he cannot make the race.{3} Goodwin: he will go to work for McCarthy.{2}'
    n: '[[w.thomas-robert-kennedy]], 357; [[w.witcover-85-days]], 51–52 (Hickory Hill, the telethon weekend, Sunday afternoon, Feb. 18, in the pool cabana with Edward Kennedy, Burke Marshall, vanden Heuvel and Goodwin: "the decision again was that he couldn''t make the race"; Goodwin, driving to Dulles with Kennedy: he will go to New Hampshire and work for McCarthy; the decision the group''s, not B''s words); [[w.witcover-85-days]], 52. To check: [[w.goodwin-remembering-america]], 481 (cited by [[w.thomas-robert-kennedy]], 469). See [[cal.1968-02-13.robert-kennedy]]. Names: Robert Kennedy, Goodwin, McCarthy, Edward Kennedy, Burke Marshall, vanden Heuvel. Check: the day.'
    src:
      c: 5b887cf9
      rows:
        - 'w.thomas-robert-kennedy 357: 1, 2'
        - 'w.witcover-85-days 51–52: 2'
        - 'w.witcover-85-days 52: 3'
    tags: [name:kennedy-robert-f, name:goodwin-richard-n, name:mccarthy-eugene-j, name:kennedy-edward-m, name:marshall-burke, name:vanden-heuvel-william-j]
    time_range:
      - 1968-02-18T17:00Z
      - 1968-02-18T23:00Z
    time_band: afternoon
    time_zone: America/New_York
    range_basis: record
  - id: cal.1968-02-18.vietnam-tet-2
    when: Feb. 18
    date: '1968-02-18'
    place: phan-thiet
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: 'Phan Thiết. Battalion 840 and sapper Company 482 attack the town, the main target of Region 6''s first rank: the Bình Thuận subsector, the police office and the jail. After four days the forces hold some targets and break the jail, freeing 780 prisoners; the enemy counterattacks hard with aircraft and naval guns and shells the center, and the forces move to the outskirts.'
    n: '[[w.lich-su-khang-chien-chong-my]], V, 156–57. See [[cal.1968-01-30.vietnam-tet-12]]. The figures are the history''s.'
    tags: [polity:drv, polity:rvn, polity:us]
  - id: cal.1968-02-18.vietnam-tet-3
    when: Feb. 18
    date: '1968-02-18'
    place: dalat
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Đà Lạt. Battalion 186 with Company 810 and the Biệt Động team 860 of the province attacks the Political Warfare School, the artillery position and the Đa Thành hamlets and goes on toward the center; at the Kim Thạch–Vạn Kiếp line the 2d Ranger Group stops it. After by the history's count killing hundreds, the force leaves the Kim Thạch area at 9 p.m. Feb. 19. Southwest of the city Battalion 145 (less a company), Company 816 and team 820 take the hamlets of Du Sinh, An Thành and Nam Thiên and shell the subsector and the administrative building, but are held.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 157. See [[cal.1968-01-31.vietnam-tet-16]]. Check: the day of the attack, which the history gives only as the wave of Feb. 17–18. The figures are the history''s.'
    tags: [polity:drv, polity:rvn]
  - id: cal.1968-02-18.vietnam-tet-4
    when: Feb. 18
    date: '1968-02-18'
    time: 1968-02-17T17:00Z
    place: lo-te
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Lộ Tẻ airfield, Cần Thơ. At 1 a.m. a part of the sappers and Battalion 307 of the region attack from the Vòng Cung road, where the forces had held since Feb. 4, destroy 29 aircraft, mostly helicopters, burn a fuel store and a rocket-ammunition store and destroy two trucks. At 8 a.m. they withdraw; the Saigon 42d Ranger Battalion follows to the Rau Răm creek, where Battalion 307 hurts it badly.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 158. See [[cal.1968-01-30.vietnam-tet-15]]. Check: the clock, whose it is. The figures are the history''s.'
    tags: [polity:drv, polity:rvn]
    time_zone: Asia/Ho_Chi_Minh
  - id: cal.1968-02-18.vietnam-tet-5
    when: Feb. 18
    date: '1968-02-18'
    place: can-tho
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: An Bình and Long Tuyền, outskirts of Cần Thơ. The enemy sends in Battalion 3 of the American 9th Division's 2d Brigade, three Saigon main-force and security battalions, an M113 troop and aircraft, the first American infantry in a direct fight in the western Nam Bộ. By the history's count the defenders stop them, kill nearly 300 and shoot down 2 aircraft. The morning of Feb. 20 another battalion of the brigade hits their rear and the defenders destroy a company.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 158. See [[cal.1968-02-18.vietnam-tet-4]]. The Feb. 20 action is the same operation. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn]
  - id: cal.1968-02-18.vietnam-tet-6
    when: Feb. 18
    date: '1968-02-18'
    place: hue
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Huế. The enemy takes the Thủy Quan gate and threatens the Hữu, An Hòa and Thượng Tứ gates. The command sends Battalion 816 of Regiment 9, from stopping the enemy at Bôn Trì and An Lưu, to Regiments 6 and 8, and Battalion 810 from the southern wing across the Gia Hội quarter to hold the enemy at the Đông Ba gate. A regiment coming from Route 9 arrives only on Feb. 18 at its assembly point, Battalion 7 with it, and cannot throw the enemy back; the forces are pushed into the citadel. The enemy has added a Marine battalion at Mang Cá and Đông Ba and bombards day and night with naval guns and aircraft.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 111–12. See [[cal.1968-02-16.vietnam-tet]].'
    tags: [polity:drv, polity:us, polity:rvn]
