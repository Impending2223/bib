    when: Feb. 17–Mar. 15
    date: '1968-02-17'
    thread: vietnam-tet
    also: [vietnam-hanoi]
    c: Central Highlands. From Feb. 17 to Mar. 15 the forces fight over 100 actions and by the history's count put thousands out of action, mostly Americans. Regiment 95, on Route 19, destroys 145 vehicles in March; Regiment 18 destroys 98 vehicles and shoots down 17 aircraft; Regiment 320 destroys Battalion 4 of the Saigon 45th Regiment north of Buôn Ma Thuột; Battalion 6 of Regiment 24 destroys two companies of the American 173d Airborne Brigade at Kon Tum.
    n: '[[w.lich-su-khang-chien-chong-my]], V, 156. The history gives the span, Feb. 17 to Mar. 15. Check: the days of the Regiment 95, 18, 320 and Battalion 6 actions. The figures are the history''s.'
    tags: [polity:drv, polity:us, polity:rvn, ok:fields-place]
