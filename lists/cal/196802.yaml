  - id: cal.1968-02-01.vietnam-hanoi
    when: Feb. 1
    date: '1968-02-01'
    place: hanoi
    thread: vietnam-hanoi
    also: [vietnam-tet]
    c: 'The Secretariat''s secret cable no. 23 to the zone, city and provincial committees: by first reports, on Jan. 30 and 31 the forces and people of the South struck nearly all the enemy''s vital points, towns, airfields and bases, and the cities'' people rose. The news to be spread at once; production, transport, air defense, evacuation and order kept up; letters and cables to the twinned provinces of the South.'
    n: '*Điện mật của Ban Bí thư số 23, ngày 1 tháng 2 năm 1968*, signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXIX, 167–68. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1968-02-01.china
    when: Feb. 1
    date: '1968-02-01'
    thread: china
    also: [vietnam-hanoi]
    c: The Foreign Ministry's statement protests strongly at U.S. aircraft's bombing in turn of the Chinese freighters *Hongqi 152*, at Hongay, and *Hongqi 153*, at Cẩm Phả, Vietnam. The U.S. will never stop the Chinese people's support of the Vietnamese people with bombs, and the Chinese people will go on with the Vietnamese people to give the U.S. bandits sterner punishment.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 188–189 (Feb. 1, 1968).'
