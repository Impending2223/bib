# Cal. LI August 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LI
entries:
  - id: cal.1964-08-02.vietnam
    when: Aug. 2–3
    date: '1964-08-02'
    thread: vietnam
    c: 'Gulf of Tonkin. The destroyer Maddox, on a DeSoto patrol off North Vietnam, attacked by three torpedo boats in the afternoon, Saigon time; the Maddox and planes from the Ticonderoga hit all three. South Vietnamese raiders under OPLAN 34A had shelled Hòn Mê and Hòn Ngư, July 30–31. Johnson: no reprisal; a protest to Hanoi. Aug. 3, his statement: the patrol doubled, orders to destroy any attacker.'
    n: FRUS 1964–68, I, docs. [255](https://history.state.gov/historicaldocuments/frus1964-68v01/d255), [258](https://history.state.gov/historicaldocuments/frus1964-68v01/d258), [265](https://history.state.gov/historicaldocuments/frus1964-68v01/d265). [Statement by the President Upon Instructing the Navy To Take Retaliatory Action in the Gulf of Tonkin](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-instructing-the-navy-take-retaliatory-action-the-gulf-tonkin) (Aug. 3, 1964). *The Gulf of Tonkin, the 1964 Incidents* (K–J Cong. II.J.3). Goulden, *Truth Is the First Casualty*; Galloway, *The Gulf of Tonkin Resolution*; Austin, *The President's War*; Windchy, *Tonkin Gulf*; Moïse, *Tonkin Gulf and the Escalation of the Vietnam War*; Johns, *Opening Pandora's Box*; Siff, *Why the Senate Slept*; Hanyok, *Skunks, Bogies, Silent Hounds, and the Flying Fish* (Viet. II.C.2). Hanyok, *Spartans in Darkness* (Viet. II.F.11). Shultz, *The Secret War Against Hanoi*; Conboy & Andradé, *Spies and Commandos* (Viet. II.F.10). Kaiser, *American Tragedy* (Viet. II.B.8). Logevall, *Choosing War*; McMaster, *Dereliction of Duty*; VanDeMark, *Into the Quagmire* (K–J Adm. II.D). McNamara, *In Retrospect* (K–J Adm. II.G.4). Johnson, *The Vantage Point* (K–J Adm. II.G.3). *Taking Charge* (K–J Adm. II.J). Stockdale, *In Love and War* (Viet. II.H.2). See [[cal.1964-07-27.vietnam]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-04.vietnam
    when: Aug. 4
    date: '1964-08-04'
    thread: vietnam
    c: 'A second attack reported, at night, on the Maddox and the C. Turner Joy. By early afternoon in Washington, Herrick, commanding the patrol: many contacts and torpedoes "doubtful," "freak weather effects," "over-eager sonarmen"; a "complete evaluation" asked. The NSC and the congressional leaders; strikes ordered. Johnson on television, 11:36 p.m.: "limited and fitting"; "We still seek no wider war."'
    n: '[Radio and Television Report to the American People Following Renewed Aggression in the Gulf of Tonkin](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-following-renewed-aggression-the-gulf) (Aug. 4, 1964). FRUS 1964–68, I, docs. [272](https://history.state.gov/historicaldocuments/frus1964-68v01/d272), [276](https://history.state.gov/historicaldocuments/frus1964-68v01/d276), [278](https://history.state.gov/historicaldocuments/frus1964-68v01/d278), [280](https://history.state.gov/historicaldocuments/frus1964-68v01/d280), [286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). See [[cal.1964-08-02.vietnam]]. Names: Herrick (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
    tags: [name:herrick-john-j, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1964-08-04.mississippi
    when: Aug. 4
    date: '1964-08-04'
    thread: mississippi
    c: FBI agents, on an informant's word, dig the bodies of Chaney, Goodman, and Schwerner out of an earthen dam southwest of Philadelphia, Mississippi. All three shot.
    n: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). Dittmer, *Local People*; McAdam, *Freedom Summer* (K–J Cong. II.F). Branch, *Pillar of Fire* (K–J Adm. II.C). See [[cal.1964-06-21.mississippi]]. Names: Chaney, Goodman, Schwerner (K–J Cong. III.K).'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael]
  - id: cal.1964-08-04.congress
    when: Aug. 4–5
    date: '1964-08-04'
    thread: congress
    also: [elections-1964]
    c: Engle dead, July 30. Brown appoints Salinger, the Democratic nominee, to the seat. Aug. 5, the Senate swears him in, [59–29](https://voteview.com/rollcall/RS0880477), his residence in California referred to the Rules Committee.
    n: '[110 Cong. Rec., Senate, Aug. 5, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-2-1.pdf). See [[cal.1964-06-02.elections-1964]]. Names: Brown (K–J Cong. III.F); Salinger (K–J Adm. III.B).'
    tags: [name:engle-clair, name:brown-edmund-g, name:salinger-pierre]
  - id: cal.1964-08-04.goldwater
    when: Aug. 4
    date: '1964-08-04'
    thread: goldwater
    also: [vietnam, elections-1964]
    c: 'Johnson calls Goldwater, 10:06 p.m., before his address on the Tonkin Gulf: reads him the statement; its timing, so as not to endanger the forces. Goldwater for the action.'
    n: '[Johnson and Goldwater, 10:06 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-barry-goldwater-and-office-conversation-august), Conversation WH6408-06-4715 (Miller Center). See [[cal.1964-08-04.vietnam]]. Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-08-05.vietnam
    when: Aug. 5
    date: '1964-08-05'
    thread: vietnam
    c: Pierce Arrow. Planes from the Ticonderoga and the Constellation strike the torpedo boat bases and the oil depot at Vinh, 64 sorties. Two planes lost; Alvarez taken, the first American airman held in the North. Johnson at Syracuse; his message asks Congress for a resolution.
    n: '[Special Message to the Congress on U.S. Policy in Southeast Asia](https://www.presidency.ucsb.edu/documents/special-message-the-congress-us-policy-southeast-asia); [Remarks at Syracuse University on the Communist Challenge in Southeast Asia](https://www.presidency.ucsb.edu/documents/remarks-syracuse-university-the-communist-challenge-southeast-asia) (Aug. 5, 1964). [FRUS 1964–68, I, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286). Moïse, *Tonkin Gulf and the Escalation of the Vietnam War* (Viet. II.C.2). See [[cal.1964-08-02.vietnam]]. Names: Alvarez (K–J Cong. III.K).'
    tags: [name:alvarez-everett-jr, name:johnson-lyndon-b]
  - id: cal.1964-08-05.congo
    when: Aug. 5–11
    date: '1964-08-05'
    thread: congo
    c: 'Stanleyville falls to the Simba rebels; Consul Hoyt and his staff held. Harriman to Brussels; Spaak will send no Belgian troops. Aug. 11, the NSC: support for Tshombe''s gendarmes and white mercenaries, American transport planes; no American troops.'
    n: 'FRUS 1964–68, XXIII, docs. [199](https://history.state.gov/historicaldocuments/frus1964-68v23/d199), [210](https://history.state.gov/historicaldocuments/frus1964-68v23/d210), [211](https://history.state.gov/historicaldocuments/frus1964-68v23/d211), [214](https://history.state.gov/historicaldocuments/frus1964-68v23/d214). See [[cal.1964-07-10.congo]]. Names: Harriman (K–J Adm. III.E); Tshombe (K–J Adm. III.J).'
    tags: [name:hoyt-michael-p-e, name:harriman-w-averell, name:spaak-paul-henri, name:tshombe-moise, name:johnson-lyndon-b]
  - id: cal.1964-08-05.opinion
    when: Aug. 5
    date: '1964-08-05'
    thread: opinion
    also: [right-and-the-military]
    c: 'Gallup, July 23–28: 68 percent have heard of the John Birch Society. Of them, favorable 8, unfavorable 59, no opinion 33.'
    n: '*The Gallup Poll*, III, 1896 (K–J Cong. II.E).'
  - id: cal.1964-08-07.vietnam
    when: Aug. 7–10
    date: '1964-08-07'
    thread: vietnam
    c: The Southeast Asia resolution passes, House [416–0](https://voteview.com/rollcall/RH0880197), Senate [88–2](https://voteview.com/rollcall/RS0880481), Morse and Gruening against; Fulbright its manager. "All necessary measures to repel any armed attack against the forces of the United States and to prevent further aggression." Signed Aug. 10, [78 Stat. 384](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg384.pdf). Rusk, McNamara, and Wheeler had testified to Foreign Relations and Armed Services, Aug. 6.
    n: 'Statute (K–J Cong. II.J.2). [110 Cong. Rec., House, Aug. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-2.pdf); [Senate](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf). [Statement by the President on the Passage of the Joint Resolution on Southeast Asia](https://www.presidency.ucsb.edu/documents/statement-the-president-the-passage-the-joint-resolution-southeast-asia) (Aug. 7, 1964); [Remarks Upon Signing Joint Resolution of the Maintenance of Peace and Security in Southeast Asia](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-joint-resolution-the-maintenance-peace-and-security-southeast-asia) (Aug. 10, 1964). FRUS 1964–68, I, docs. [297](https://history.state.gov/historicaldocuments/frus1964-68v01/d297), [308](https://history.state.gov/historicaldocuments/frus1964-68v01/d308). Woods, *Fulbright*; Gruening, *Many Battles* (K–J Cong. II.I.1). See [[cal.1964-08-02.vietnam]]. Names: Rusk (K–J Adm. III.E); McNamara, Wheeler (K–J Adm. III.F); Morse, Gruening, Fulbright (K–J Cong. III.B).'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:morse-wayne, name:gruening-ernest, name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1964-08-08.poverty
    when: Aug. 8
    date: '1964-08-08'
    thread: poverty
    c: House passes the poverty bill, [226–185](https://voteview.com/rollcall/RH0880201). The day before, Smith's motion to strike the enacting clause lost, [197–225](https://voteview.com/rollcall/RH0880198); Landrum's substitute, the Senate's text with a governor's veto, taken, [228–190](https://voteview.com/rollcall/RH0880199). Yarmolinsky kept out of the new office, for North Carolina votes.
    n: '[110 Cong. Rec., House, Aug. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-2.pdf); [Aug. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-5-1.pdf). [Statement by the President Following House Action on the Economic Opportunity Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-action-the-economic-opportunity-bill) (Aug. 8, 1964). See [[cal.1964-07-23.poverty]]. Names: Smith, Landrum (K–J Cong. III.D); Yarmolinsky (K–J Adm. III.G).'
    tags: [name:smith-howard-w, name:landrum-phil-m, name:yarmolinsky-adam, name:johnson-lyndon-b]
  - id: cal.1964-08-08.europe-and-the-alliance
    when: Aug. 8–10
    date: '1964-08-08'
    thread: europe-and-the-alliance
    c: Cyprus. Greek Cypriot forces press the Turkish Cypriots at Kokkina; Turkish jets strike them, Aug. 8 and 9, with napalm on the 9th. Makarios threatens the Turkish Cypriots everywhere on the island. Johnson's appeal to Papandreou, Inonu, and Makarios; the Security Council's call for a cease-fire, Aug. 9, accepted. Acheson mediating at Geneva since July.
    n: 'FRUS 1964–68, XVI, docs. [86](https://history.state.gov/historicaldocuments/frus1964-68v16/d86), [93](https://history.state.gov/historicaldocuments/frus1964-68v16/d93), [109](https://history.state.gov/historicaldocuments/frus1964-68v16/d109), [111](https://history.state.gov/historicaldocuments/frus1964-68v16/d111), [116](https://history.state.gov/historicaldocuments/frus1964-68v16/d116). Nicolet, *United States Policy Towards Cyprus*; Schwartz, *Lyndon Johnson and Europe* (K–J Adm. II.D). Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Names: Ball (K–J Adm. III.E).'
    tags: [name:makarios-iii, name:papandreou-george, name:inonu-ismet, name:johnson-lyndon-b, name:ball-george-w, name:acheson-dean-g]
  - id: cal.1964-08-09.opinion
    when: Aug. 9
    date: '1964-08-09'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, July 23–28: Johnson 59, Goldwater 31, undecided 10; the undecided allocated, Johnson 61, Goldwater 36. East: Johnson 70, Goldwater 19. South: Goldwater 51, Johnson 40.'
    n: '*The Gallup Poll*, III, 1896 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-08-12.elections-1964
    when: Aug. 12
    date: '1964-08-12'
    thread: elections-1964
    also: [goldwater]
    c: 'Hershey, Pennsylvania. Goldwater meets Eisenhower, Nixon, Scranton, Rockefeller, Romney, and the party''s governors and leaders: "I seek the support of no extremist—of the left or the right." Romney not yet for him.'
    n: 'Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). See [[cal.1964-07-13.elections-1964]]. Names: Goldwater (Opp. III.B); Eisenhower, Nixon (Opp. III.E); Scranton, Rockefeller, Romney (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:eisenhower-dwight-d, name:nixon-richard-m, name:scranton-william-w, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1964-08-12.opinion
    when: Aug. 12
    date: '1964-08-12'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, July 23–28: a UN army to deal with Southeast Asia and Vietnam, 58 percent approve, 19 disapprove. The United States handling South Vietnam as well as could be expected, 52; badly, 38.'
    n: '*The Gallup Poll*, III, 1896–97 (K–J Cong. II.E).'
  - id: cal.1964-08-14.congress
    when: Aug. 14
    date: '1964-08-14'
    thread: congress
    c: Government Employees Salary Reform Act signed, [78 Stat. 400](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg400.pdf). Members of Congress to $30,000 from $22,500; Cabinet officers to $35,000; raises for the classified service, judges, and executives. Senate passed it July 2, [58–21](https://voteview.com/rollcall/RS0880438).
    n: '[Remarks Upon Signing the Government Employees Pay Raise Bill](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-government-employees-pay-raise-bill) (Aug. 14, 1964). See [[cal.1964-01-07.congress]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-14.opinion
    when: Aug. 14
    date: '1964-08-14'
    thread: opinion
    also: [poverty]
    c: 'Gallup, July 23–28: young men of 16 to 22 out of work required to join a youth conservation corps, 73 percent approve, 21 disapprove. Republicans 63 approve; Democrats 80.'
    n: '*The Gallup Poll*, III, 1897 (K–J Cong. II.E).'
  - id: cal.1964-08-16.vietnam
    when: Aug. 16–29
    date: '1964-08-16'
    thread: vietnam
    c: Saigon. Khánh, under a state of emergency since Aug. 7, made president by the Military Revolutionary Council under a new charter, Aug. 16. Students and Buddhists in the streets; Aug. 25, the charter revoked. Aug. 27, Khánh, Minh, and Khiêm a triumvirate; Khánh to Dalat to rest, Oánh signing for him.
    n: 'FRUS 1964–68, I, docs. [305](https://history.state.gov/historicaldocuments/frus1964-68v01/d305), [312](https://history.state.gov/historicaldocuments/frus1964-68v01/d312), [322](https://history.state.gov/historicaldocuments/frus1964-68v01/d322), [325](https://history.state.gov/historicaldocuments/frus1964-68v01/d325), [330](https://history.state.gov/historicaldocuments/frus1964-68v01/d330), [332](https://history.state.gov/historicaldocuments/frus1964-68v01/d332). Topmiller, *The Lotus Unleashed* (Viet. II.E.5). See [[cal.1964-07-27.vietnam]]. Names: Khánh, Minh (Viet. III.G); Taylor (K–J Adm. III.F).'
    tags: [name:nguyen-khanh, name:duong-van-minh, name:tran-thien-khiem, name:nguyen-xuan-oanh, name:taylor-maxwell]
  - id: cal.1964-08-18.elections-1964
    when: Aug. 18
    date: '1964-08-18'
    thread: elections-1964
    c: Senate tables the conference report suspending the equal-time rule for the presidential and vice-presidential candidates, [44–41](https://voteview.com/rollcall/RS0880504). The 1960 suspension not renewed.
    n: '[110 Cong. Rec., Senate, Aug. 18, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt15/pdf/GPO-CRECB-1964-pt15-5-1.pdf). See [[cal.1964-07-15.elections-1964]].'
  - id: cal.1964-08-19.court
    when: Aug. 19
    date: '1964-08-19'
    thread: court
    also: [states-and-cities]
    c: House passes Tuck's bill to take the apportionment of State legislatures from the federal courts, [218–175](https://voteview.com/rollcall/RH0880220).
    n: '[110 Cong. Rec., House, Aug. 19, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt15/pdf/GPO-CRECB-1964-pt15-6-1.pdf). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-06-15.court]].'
    tags: [name:tuck-william-m]
  - id: cal.1964-08-19.opinion
    when: Aug. 19
    date: '1964-08-19'
    thread: opinion
    also: [court]
    c: 'Gallup, July 23–28: the Supreme Court''s ruling that both houses of every State legislature be in proportion to population, 47 percent approve, 30 disapprove. East 56 approve; South 40. Places under 2,500: 35 approve, 42 disapprove.'
    n: '*The Gallup Poll*, III, 1897–98 (K–J Cong. II.E).'
  - id: cal.1964-08-20.poverty
    when: Aug. 20
    date: '1964-08-20'
    thread: poverty
    c: 'Economic Opportunity Act signed in the Rose Garden, [78 Stat. 508](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg508.pdf). An Office of Economic Opportunity in the Executive Office; $947.5 million the first year: Job Corps, work-training, work-study, community action, rural loans, VISTA. Shriver to direct it. "Opportunity, not an opiate."'
    n: 'Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Economic Opportunity Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-economic-opportunity-act) (Aug. 20, 1964). See [[cal.1964-03-16.poverty]]. Names: Shriver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1964-08-22.mississippi
    when: Aug. 22
    date: '1964-08-22'
    thread: mississippi
    also: [elections-1964]
    c: 'Atlantic City. The Credentials Committee hears the Mississippi Freedom Democrats'' challenge to the regular delegation; Rauh their counsel. Hamer: beaten in the Winona jail, June 1963; "Is this America?" Johnson meets Democratic governors at the White House the same afternoon. Check.'
    n: '[Remarks to a Group of Democratic Governors](https://www.presidency.ucsb.edu/documents/remarks-group-democratic-governors) (Aug. 22, 1964). Dittmer, *Local People*; McAdam, *Freedom Summer*; Payne, *I''ve Got the Light of Freedom*; Carson, *In Struggle* (K–J Cong. II.F). Mills, *This Little Light of Mine* (K–J Cong. II.I.4). Branch, *Pillar of Fire*; Kotz, *Judgment Days* (K–J Adm. II.C). Humphrey, *The Education of a Public Man* (K–J Cong. II.I.1). *Taking Charge* (K–J Adm. II.J). Wisconsin Historical Society: Freedom Summer collections (K–J Cong. II.L). See [[cal.1964-08-04.mississippi]]. Names: Rauh, Hamer (K–J Cong. III.H).'
    tags: [name:rauh-joseph-l-jr, name:hamer-fannie-lou, name:johnson-lyndon-b]
  - id: cal.1964-08-23.opinion
    when: Aug. 23
    date: '1964-08-23'
    thread: opinion
    also: [elections-1964, goldwater]
    c: 'Gallup, Aug. 6–11: Johnson 65, Goldwater 29, undecided 6. Republicans: Goldwater 62, Johnson 27. Independents: Johnson 58, Goldwater 35.'
    n: '*The Gallup Poll*, III, 1898–99 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-08-24.elections-1964
    when: Aug. 24
    date: '1964-08-24'
    thread: elections-1964
    c: 'Democratic National Convention opens, Atlantic City, at Convention Hall. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 406–408. [1964 Democratic Party Platform](https://www.presidency.ucsb.edu/documents/1964-democratic-party-platform) (Aug. 24, 1964). White, *The Making of the President 1964* (Opp. II.E). *The National Election of 1964* (K–J Cong. II.E). Dallek, *Flawed Giant*; Shesol, *Mutual Contempt* (K–J Adm. II.A). Johnson, *The Vantage Point*; Lady Bird Johnson, *A White House Diary* (K–J Adm. II.G.3). *Taking Charge* (K–J Adm. II.J). Humphrey, *The Education of a Public Man* (K–J Cong. II.I.1). See [[cal.1964-03-10.elections-1964]].
    tags: [primaries:1964-D]
  - id: cal.1964-08-25.mississippi
    when: Aug. 25
    date: '1964-08-25'
    thread: mississippi
    also: [elections-1964, civil-rights-organizations]
    c: 'The Credentials Committee''s compromise, Mondale''s subcommittee: the regulars seated if they pledge to support the ticket; Aaron Henry and Ed King of the Freedom Democrats seated at large; no delegation chosen by discrimination in 1968. The Freedom Democrats refuse it; all but three of the regulars go home.'
    n: 'See [[cal.1964-08-22.mississippi]]. Names: Mondale (Cong. III.B); Henry, King (K–J Cong. III.K).'
    tags: [name:mondale-walter-f, name:henry-aaron, name:king-edwin, name:humphrey-hubert-h]
  - id: cal.1964-08-25.elections-1964
    when: Aug. 25
    date: '1964-08-25'
    thread: elections-1964
    also: [robert-kennedy]
    c: Robert Kennedy, at Gracie Mansion with Wagner, will seek the Democratic nomination for Senator from New York against Keating.
    n: '[Johnson and Robert Kennedy, Aug. 12, 9:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-august-12-1964), Conversation WH6408-18-4897 (Miller Center). [Statement by Attorney General Robert F. Kennedy](https://www.justice.gov/sites/default/files/ag/legacy/2011/01/20/08-25-1964.pdf) (Aug. 25, 1964). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-07-30.elections-1964]]. Names: Robert Kennedy (K–J Adm. III.A); Wagner (K–J Cong. III.F); Keating (Opp. III.B).'
    tags: [name:kennedy-robert-f, name:wagner-robert-f-jr, name:keating-kenneth-b]
  - id: cal.1964-08-26.elections-1964
    when: Aug. 26
    date: '1964-08-26'
    thread: elections-1964
    c: Johnson nominated by acclamation. He flies to Atlantic City and asks for Humphrey, "my trusted colleague"; Humphrey nominated by acclamation. Aug. 25, he had drafted a statement withdrawing. Check.
    n: '[Remarks Before the National Convention Upon Recommending the Nomination of Hubert Humphrey as Vice President](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-convention-upon-recommending-the-nomination-hubert-humphrey); [The President''s News Conference Before Departing for Atlantic City for the National Convention](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-before-departing-for-atlantic-city-for-the-national) (Aug. 26, 1964). See [[cal.1964-08-24.elections-1964]]. Names: Johnson (K–J Adm. III.D); Humphrey (K–J Cong. III.A).'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1964-08-26.opinion
    when: Aug. 26
    date: '1964-08-26'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 6–11: the United States handling South Vietnam as well as could be expected, 71 percent; badly, 16. What next: show we can''t be pushed around, keep troops there, 27; get tougher, 12; avoid all-out war, sit down and talk, 10; military action 9; get out 4.'
    n: '*The Gallup Poll*, III, 1899 (K–J Cong. II.E).'
  - id: cal.1964-08-27.elections-1964
    when: Aug. 27
    date: '1964-08-27'
    thread: elections-1964
    also: [robert-kennedy]
    c: Robert Kennedy introduces the film on his brother, *A Thousand Days*. A long ovation before he can speak. "When he shall die, take him and cut him out in little stars."
    n: '[Tribute to John F. Kennedy at the DNC](https://www.jfklibrary.org/node/343256) (Aug. 27, 1964). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-08-24.elections-1964]]. Names: Robert Kennedy (K–J Adm. III.A).'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1964-08-27.elections-1964-2
    when: Aug. 27
    date: '1964-08-27'
    thread: elections-1964
    also: [program]
    c: 'Johnson''s acceptance, his birthday: "I ask the American people for a mandate—not to preside over a finished program ... a mandate to begin." The Great Society; medical care for the aged; the war on poverty.'
    n: '[Remarks Before the National Convention Upon Accepting the Nomination](https://www.presidency.ucsb.edu/documents/remarks-before-the-national-convention-upon-accepting-the-nomination) (Aug. 27, 1964). See [[cal.1964-08-24.elections-1964]]; [[cal.1964-05-22.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08-31.farm
    when: Aug. 31
    date: '1964-08-31'
    thread: farm
    also: [poverty]
    c: 'Food Stamp Act signed, [78 Stat. 703](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg703.pdf). The pilot program of 1961 made permanent: $75 million for fiscal 1965, $100 million for 1966, $200 million for 1967. The House passed it Apr. 8, [229–189](https://voteview.com/rollcall/RH0880149); the Senate by voice, June 30. Check.'
    n: Statute (K–J Cong. II.J.2). [Remarks Upon Signing the Food Stamp Act](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-the-food-stamp-act) (Aug. 31, 1964). Cochrane & Ryan, *American Farm Policy* (K–J Adm. II.B). Sundquist, *Politics and Policy* (K–J Cong. II.B).
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-08.goldwater
    when: Aug.–Oct.
    date: 1964-08
    thread: goldwater
    also: [elections-1964]
    c: 'The CIA and the Goldwater campaign. Hunt, of the Domestic Operations Division, later claimed he had watched it for the White House. The CIA''s own inquiry, Dec. 1973: the campaign''s press releases and travel schedules, advance copies passed to the White House some three hours before release; the idea Barnes''s, not McCone''s or Helms''s. Check.'
    n: 'CIA, [memorandum, "Howard Hunt''s Claim That He Spied on Goldwater in the 1964 Election Campaign," Dec. 20, 1973](https://www.cia.gov/readingroom/docs/JFK%20Case%20HOWARD%20HUNTS%20CLA%5B15658047%5D.pdf); [memorandum for the record, "E. Howard Hunt," Dec. 20, 1973](https://archive.org/download/JFKNovember32017Release/104-10173-10130_text.pdf) (NARA 104-10173-10130); [memorandum of a conversation with Nedzi, Dec. 27, 1973](https://www.cia.gov/readingroom/docs/conversation%20with%20chairma%5B15132634%5D.pdf). Hunt, *Undercover* (Wg. II.E). Made public: the *Washington Post*, Dec. 20 and 21, 1973; the CIA''s findings, Colby to Nedzi, Dec. 27, 1973. Names: Hunt (Wg. III.C); McCone, Helms (K–J Adm. III.I); Goldwater (Opp. III.B).'
    tags: [name:hunt-e-howard, name:barnes-c-tracy, name:mccone-john-a, name:helms-richard, name:goldwater-barry-m]
