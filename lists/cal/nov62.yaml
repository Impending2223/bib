# Cal. XXXVI November 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVI
entries:
  - id: cal.1962-11-02.missile-crisis
    when: Nov. 2
    date: '1962-11-02'
    thread: missile-crisis
    c: 'Kennedy reports the bases being dismantled. Mikoyan in Havana three weeks: inspection, the IL-28s.'
    n: '[Radio and Television Remarks on the Dismantling of Soviet Missile Bases in Cuba](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-the-dismantling-soviet-missile-bases-cuba) (Nov. 2, 1962). [[w.mikoyan-anatomiya-karibskogo-krizisa]]. See [[cal.1962-05-24.missile-crisis]]. Names: Mikoyan.'
    tags: [name:kennedy-john-f, name:mikoyan-anastas]
  - id: cal.1962-11-02.middle-east
    when: Nov. 2
    date: '1962-11-02'
    thread: middle-east-yemen
    c: 'Aircraft from Yemen bomb Saudi villages near the border; Faisal holds the UAR responsible. Kennedy''s letter to Faisal, dated Oct. 25, sent for delivery: American support for Saudi Arabia''s integrity, and for its reforms.'
    n: 'FRUS 1961–63, XVIII, docs. [88](https://history.state.gov/historicaldocuments/frus1961-63v18/d88), [89](https://history.state.gov/historicaldocuments/frus1961-63v18/d89) (editorial note). See [[cal.1962-09-26.middle-east]], [[cal.1962-10-05.middle-east]]. Names: Faisal ibn Abd al-Aziz Al Saud, Kennedy.'
    tags: [name:faisal-ibn-abd-al-aziz-al-saud, name:kennedy-john-f]
  - id: cal.1962-11-06.elections-1962
    when: Nov. 6
    date: '1962-11-06'
    thread: elections-1962
    c: Midterms. Democrats lose a few House seats, gain in the Senate. Brown beats Nixon. Romney, Scranton, Rockefeller elected governor; Edward Kennedy, McGovern, Bayh to the Senate.
    n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). See [[cal.1962-05-05.elections-1962]]. Names: Brown, Nixon, Romney, Scranton, Rockefeller, Edward M. Kennedy, McGovern, Bayh.'
    tags: [election:1962, name:nixon-richard-m, name:scranton-william-w, name:rockefeller-nelson, name:kennedy-edward-m, name:mcgovern-george, name:bayh-birch, name:brown-edmund-g, name:romney-george-w]
  - id: cal.1962-11-06.governors
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: 'Thirty-five governors elected: Democrats 21, Republicans 14; each party took seven States from the other. Brown (D) over Nixon in California; Rockefeller (R) re-elected in New York; Romney (R) over Governor Swainson in Michigan; Scranton (R) in Pennsylvania; Rhodes (R) over Governor DiSalle in Ohio; Bellmon (R), Oklahoma''s first Republican governor. Minnesota to a recount.'
    n: '[Wikipedia, "1962 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1962_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1962-11-06.elections-1962]]. Names: Brown, Swainson, DiSalle, Nixon, Rockefeller, Romney, Scranton, Rhodes, Bellmon.'
    tags: [governors:1962-11-06, name:brown-edmund-g, name:nixon-richard-m, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:rhodes-james-a, name:bellmon-henry, name:swainson-john-b, name:disalle-michael-v]
  - id: cal.1962-11-06.alabama-al
    when: Nov. 6
    date: '1962-11-06'
    thread: alabama
    also: [elections-1962]
    c: 'Alabama. Hill (D) re-elected to the Senate over James D. Martin (R) of Gadsden, 201,937 to 195,134, 50.9 percent. Wallace elected governor without a Republican opponent. A constitutional amendment adopted, 138,211 to 32,212: a voter who moves within his county in the three months before an election may vote where he moved from.'
    n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963), 2. The amendment: *Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [783](https://archive.org/details/alabama-official-statistical-register-1963/page/n782) (Act No. 641, 1961). [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]. See [[cal.1962-11-06.elections-1962]]. Names: Hill, Martin, Wallace.'
    tags: [state:al, name:hill-lister, name:martin-james-d, name:wallace-george-c]
  - id: cal.1962-11-06.alabama-birmingham
    when: Nov. 6
    date: '1962-11-06'
    thread: mayors
    also: [alabama, elections-1962]
    c: Birmingham votes to replace its three-man City Commission, Connor its Commissioner of Public Safety, with a mayor and a council of nine, under the Mayor-Council Act of 1955; the commission retained and a council-manager plan the other choices. Election of the mayor and council set for Mar. 5, 1963.
    n: '*Reid v. City of Birmingham*, [274 Ala. 629](https://static.case.law/ala/274/case-pdfs/0629-01.pdf), 150 So. 2d 735 (1963); *Connor v. State ex rel. Boutwell*, [275 Ala. 230](https://static.case.law/ala/275/case-pdfs/0230-01.pdf), 153 So. 2d 787 (1963). Check: the vote. [[w.eskew-but-for-birmingham]]; [[w.mcwhorter-carry-me-home]]; [[w.thornton-dividing-lines]]; [[w.nunnelley-bull-connor]]. Names: Connor.'
    tags: [state:al, city:birmingham, name:connor-eugene]
  - id: cal.1962-11-06.governors-ny
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: New York. Rockefeller (R) reelected governor, 3,081,587, 53.1 percent; Morgenthau (D, Liberal) 2,552,418, 44.0; Jaquith (Conservative) 141,877, 2.4, enough for the party's line on the ballot. Javits (R) reelected U.S. Senator over Donovan, 3,272,417 to 2,289,323; O'Doherty (Conservative) 116,151.
    n: 'Governor: [Wikipedia, "1962 New York state election"](https://en.wikipedia.org/wiki/1962_New_York_state_election), from the *New York Red Book*, 1963; Check: the *Legislative Manual*, 1963. Senate: [*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). See [[cal.1962-09-17.governors-ny]]; [[cal.1962-02.states-and-cities-ny]]. Names: Rockefeller, Morgenthau, Jaquith, O''Doherty, Javits, Donovan.'
    tags: [state:ny, name:rockefeller-nelson, name:morgenthau-robert-m, name:jaquith-david-h, name:javits-jacob-k, name:donovan-james-b, name:odoherty-kieran]
  - id: cal.1962-11-06.georgia-ga
    when: Nov. 6
    date: '1962-11-06'
    thread: georgia
    also: [legislatures, elections-1962]
    c: 'Georgia Senate, the first election under the new apportionment. Leroy Johnson (D), an Atlanta lawyer, elected in the 38th district over a Negro Republican, 7,372 to 3,291: the first Negro in the Senate since 1874. Two Republicans elected. Carter, his special primary in the 14th voided by a court for fraud, elected on write-ins, 3,013 to 2,182.'
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Atlanta Constitution*, Nov. 8, 1962, and the *Atlanta Journal*, Nov. 10, 1962. [[w.carter-turning-point]]; [[w.tuck-beyond-atlanta]]; [[w.bartley-creation-of-modern-georgia]]. See [[cal.1962-09-27.georgia-ga]]. Names: Leroy Johnson, Carter.'
    tags: [name:johnson-leroy-r, name:carter-jimmy, state:ga, city:atlanta]
  - id: cal.1962-11-06.south-carolina-sc
    when: Nov. 6
    date: '1962-11-06'
    thread: south-carolina
    also: [elections-1962]
    c: 'South Carolina, Senate: Johnston (D) over Workman (R), a correspondent of the Charleston *News and Courier*, 57.2 percent. Russell elected governor without opposition.'
    n: '[Clerk, *Statistics of the Presidential and Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf). [[w.kalk-origins-of-the-southern]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1962-06-12.south-carolina-sc]]; [[cal.1962-11-06.governors]]. Names: Johnston, Workman, Russell.'
    tags: [name:johnston-olin-d, name:workman-william-d-jr, name:russell-donald-s, state:sc]
  - id: cal.1962-11-06.state-constitutions-il
    when: Nov. 6
    date: '1962-11-06'
    thread: state-constitutions
    also: [court]
    c: 'Illinois. The Judicial Article, on the blue ballot, adopted: yes 2,166,917, no 1,121,237, a majority of the 3,812,120 voting at the election, as the constitution requires. One court system: the Supreme Court, appellate courts, and circuit courts; the justices of the peace and the lesser courts abolished. In force Jan. 1, 1964 (Check the terms and the date).'
    n: 'Votes: [Ill. *Official Vote*, 1962, p. 24](https://archive.org/details/officialvoteofst1962illi/page/n25). Check the article''s text and its effective date: Illinois Constitution of 1870, art. VI (1962). [[w.peirce-megastates-of-america]].'
    tags: [state:il]
  - id: cal.1962-11-06.governors-mi
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: Michigan. Romney (R) over Governor Swainson (D), 1,420,086 to 1,339,513, 51.4 percent, the first Republican elected governor since 1946.
    n: 'Votes: [Wikipedia, "1962 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1962_Michigan_gubernatorial_election), from the [*Michigan Manual 1963–1964*, pp. 416–417](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179249&view=1up&seq=457) (Check: not read here). Three debates, Oct. 10, 18 and 27 (texts, *Detroit News*). [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]; [[w.glazer-wounded-warrior]]; [[w.peirce-megastates-of-america]]. See [[cal.1962-02-10.governors-mi]]; [[cal.1962-11-06.elections-1962]]. Names: Romney, Swainson.'
    tags: [state:mi, name:romney-george-w, name:swainson-john-b]
  - id: cal.1962-11-06.governors-oh
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: Ohio. Rhodes (R) over Governor DiSalle (D), 1,836,432 to 1,280,521, 58.9 percent. DiSalle had raised taxes and opposed the death penalty, commuting death sentences.
    n: 'Votes: [Wikipedia, "1962 Ohio gubernatorial election"](https://en.wikipedia.org/wiki/1962_Ohio_gubernatorial_election), from the Secretary of State''s official results (Check: [*Ohio Election Statistics*, 1961–1962](https://catalog.hathitrust.org/Record/000546832)). [[w.diemer-james-a-rhodes-ohio]]; [[w.disalle-power-of-life-or]]; [[w.peirce-megastates-of-america]]. See [[cal.1962-05-08.governors-oh]]; [[cal.1962-11-06.elections-1962]]. Names: Rhodes, DiSalle.'
    tags: [state:oh, name:rhodes-james-a, name:disalle-michael-v]
  - id: cal.1962-11-06.mayors-cleveland
    when: Nov. 6
    date: '1962-11-06'
    thread: mayors
    also: [elections-1962]
    c: Cleveland. Locher elected for the rest of Celebrezze's term, some three to one.
    n: '*Plain Dealer*, Nov. 7, 1962, pp. A1, A12 (Check the figures). See [[cal.1962-10-02.mayors-cleveland]]. Names: Locher, Celebrezze.'
    tags: [state:oh, city:cleveland, name:locher-ralph-s, name:celebrezze-anthony-j]
  - id: cal.1962-11-06.governors-tx
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: Texas. Connally (D) elected governor over Jack Cox (R), 847,035 to 714,995. No Republican for governor had polled so large a share since 1869.
    n: 'Votes: the joint session''s canvass, [*House Journal*, 58th Leg., Reg. Sess. 49 (1963)](https://lrl.texas.gov/scanned/Housejournals/58/H_58_0.pdf). The comparison: [Wikipedia, "1962 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1962_Texas_gubernatorial_election). [[w.knaggs-two-party-texas]]; [[w.black-rise-of-southern-republicans]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1962-06-02.governors-tx]]; [[cal.1962-11-06.governors]]. Names: Connally, Cox.'
    tags: [state:tx, name:connally-john, name:cox-jack]
  - id: cal.1962-11-06.state-constitutions-tx
    when: Nov. 6
    date: '1962-11-06'
    thread: state-constitutions
    also: [welfare]
    c: 'Texas votes on fourteen amendments; ten adopted. The ceiling on State funds for the needy aged, blind and children raised from $47 million to $52 million, 677,770 to 430,494; aid to the disabled limited to $2.5 million a year. Hospital districts; workmen''s compensation for employees of political subdivisions, 543,868 to 540,475; continuity of government after enemy attack; water storage; zoning in the Gulf counties; Dallas County school taxes kept through boundary changes. Refused: trials de novo on appeals from agencies; county retirement; State employees on advisory boards; a Titus County home for the aged.'
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 6, 1962](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1962-11-06). [[w.may-texas-state-constitution]]. See [[cal.1960-11-08.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1962-11-06.governors-ok
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: 'Oklahoma. Henry Bellmon (R) elected governor over Atkinson (D), 392,316 to 315,357, 55.2 percent: the State''s first Republican governor.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 35](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=35). [[w.bellmon-life-and-times-of]]; [[w.peirce-great-plains-states-of]]; [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1962-05-22.governors-ok]]; [[cal.1962-11-06.governors]]. Names: Bellmon, Atkinson.'
    tags: [state:ok, name:bellmon-henry, name:atkinson-w-p-bill]
  - id: cal.1962-11-06.state-constitutions-ok
    when: Nov. 6
    date: '1962-11-06'
    thread: state-constitutions
    also: [legislatures]
    c: 'Oklahoma. An initiative to enforce the constitution''s apportionment formulas by a commission of the Attorney General, Secretary of State and Treasurer, 335,045 for and 273,287 against: short of the 362,488, a majority of all votes cast, needed. Governor Edmondson proclaims it adopted; the State Supreme Court holds it failed. An amendment on liquor wholesalers'' prices, 319,809 to 307,861, also short.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 38](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=38); *Allen v. Burkhart*, [377 P.2d 821](https://static.case.law/p2d/377/case-pdfs/0821-01.pdf) (Okla. 1963); *Moss v. Burkhart*, [220 F. Supp. 149](https://static.case.law/f-supp/220/case-pdfs/0149-01.pdf) (W.D. Okla. 1963), recites both. [[w.dixon-democratic-representation]]. See [[cal.1962-06-19.legislatures-ok]]. Names: Edmondson.'
    tags: [state:ok, name:edmondson-james-h]
