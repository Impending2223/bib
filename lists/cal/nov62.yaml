  - id: cal.1962-11-06.state-constitutions-md
    when: Nov. 6
    date: '1962-11-06'
    thread: state-constitutions
    also: [legislatures]
    c: 'Maryland. Amendments: legislators'' pay from $1,800 to $3,000 rejected, 124,323 to 212,608; more signers needed to refer an act to the voters, 193,840 to 124,600; a decree for an illegitimate child''s support enforceable by imprisonment, 280,651 to 59,329; quick-taking of land in Baltimore City and Montgomery County. Referenda: the act of 1961 redrawing the congressional districts for an eighth seat rejected, 115,557 to 211,904, the eighth elected at large; the unemployment insurance act of 1961 approved, 242,895 to 185,010.'
    n: '*Maryland Manual*, 1963–64, [pp. 459–63](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--459.html), [238](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--238.html), [244](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--244.html). [[w.callcott-maryland-and-america-1940]]. See [[cal.1960-11-08.state-constitutions-md]].'
    tags: [state:md]
