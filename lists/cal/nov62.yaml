  - id: cal.1962-11-21.opinion
    when: Nov. 21
    date: '1962-11-21'
    thread: opinion
    also: [peace-corps]
    c: 'Gallup, Oct. 19–24: 71 percent have heard of the Peace Corps; of them, 74 approve its work, 9 disapprove. A Peace Corps for poor communities at home, 62 for, 22 against.'
    n: '*The Gallup Poll*, III, 1791 (K–J Cong. II.E).'
