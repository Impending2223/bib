entries:
  - id: cal.1962-11-02.missile-crisis
    when: Nov. 2
    date: '1962-11-02'
    thread: missile-crisis
    c: 'Kennedy reports the bases being dismantled. Mikoyan in Havana three weeks: inspection, the IL-28s.'
    n: '[Radio and Television Remarks on the Dismantling of Soviet Missile Bases in Cuba](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-the-dismantling-soviet-missile-bases-cuba) (Nov. 2, 1962). Mikoyan, *Anatomiya Karibskogo krizisa* (K–J Adm. II.D). See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:kennedy-john-f, name:mikoyan-anastas]
  - id: cal.1962-11-06.elections-1962
    when: Nov. 6
    date: '1962-11-06'
    thread: elections-1962
    c: Midterms. Democrats lose a few House seats, gain in the Senate. Brown beats Nixon. Romney, Scranton, Rockefeller elected governor; Edward Kennedy, McGovern, Bayh to the Senate.
    n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). See [[cal.1962-05-05.elections-1962]]. Names: Romney, Scranton, Rockefeller (Opp. III.H); Edward M. Kennedy, McGovern (K–J Cong. III.B); Brown (K–J Cong. III.F).'
    tags: [election:1962, name:nixon-richard-m, name:scranton-william-w, name:rockefeller-nelson, name:kennedy-edward-m, name:mcgovern-george, name:bayh-birch, name:brown-edmund-g, name:romney-george-w]
  - id: cal.1962-11-07.elections-1962
    when: Nov. 7
    date: '1962-11-07'
    thread: elections-1962
    c: 'Nixon at the Beverly Hilton: "You won''t have Nixon to kick around anymore."'
    n: 'Recording (Opp. II.I). See [[cal.1962-06-05.elections-1962]]. Names: Nixon (Opp. III.E).'
    tags: [name:nixon-richard-m]
  - id: cal.1962-11-14.opinion
    when: Nov. 14
    date: '1962-11-14'
    thread: opinion
    also: [desegregation-public-places, mississippi]
    c: 'Gallup, Oct. 19–24: the Kennedy administration pushing integration too fast, 42 percent; not fast enough, 12; about right, 31. The South, 65 too fast.'
    n: '*The Gallup Poll*, III, 1789 (K–J Cong. II.E).'
  - id: cal.1962-11-19.india-and-china
    when: Nov. 19–21
    date: '1962-11-19'
    thread: india-and-china
    c: 'Nehru asks for American air squadrons. Arms already flying; Harriman''s mission to New Delhi. Nov. 21: China''s cease-fire and withdrawal.'
    n: 'FRUS 1961–63, XIX, docs. [203](https://history.state.gov/historicaldocuments/frus1961-63v19/d203), [205](https://history.state.gov/historicaldocuments/frus1961-63v19/d205). [News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-170) (Nov. 20, 1962). Galbraith (K–J Adm. II.G.4). Riedel (see [[cal.1961-12-18.india-and-china]]). Names: Harriman, Galbraith (K–J Adm. III.E).'
    tags: [name:harriman-w-averell, name:nehru-jawaharlal]
  - id: cal.1962-11-20.missile-crisis
    when: Nov. 20
    date: '1962-11-20'
    thread: missile-crisis
    c: Khrushchev agrees to remove the IL-28s. Quarantine lifted, at the press conference.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-170) (Nov. 20, 1962). See [[cal.1962-05-24.missile-crisis]].'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f]
  - id: cal.1962-11-20.civil-rights-the-executive
    when: Nov. 20
    date: '1962-11-20'
    thread: civil-rights-the-executive
    c: 'Same press conference: the housing order. No discrimination in federally aided housing, prospectively.'
    n: '[Exec. Order No. 11,063](https://www.presidency.ucsb.edu/documents/executive-order-11063-equal-opportunity-housing) (K–J Adm. II.H.2). Graham, *The Civil Rights Era*; Brauer, *Second Reconstruction* (K–J Adm. II.C). Pritchett (K–J Adm. II.G.5). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Weaver (K–J Adm. III.G).'
    tags: [name:kennedy-john-f]
  - id: cal.1962-11-21.space
    when: Nov. 21
    date: '1962-11-21'
    thread: space
    c: Kennedy and Webb, Cabinet Room, taped. The moon first. "I'm not that interested in space."
    n: '[Transcript of Presidential Meeting in the Cabinet Room of the White House](https://www.nasa.gov/wp-content/uploads/static/history/JFK-Webbconv/pages/transcript.pdf) (Nov. 21, 1962; JFK Library, Presidential Recordings, tape 63). Logsdon, *John F. Kennedy and the Race to the Moon* (K–J Adm. II.B). See [[cal.1961-04-12.space]]. Names: Webb (K–J Adm. III.G).'
    tags: [name:kennedy-john-f, name:webb-james-e]
