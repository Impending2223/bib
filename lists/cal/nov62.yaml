    c: 'Washington. Initiative 211, the League of Women Voters'', redistricting the legislature by population: yes 396,419, no 441,085. Refused.'
    n: '[Wash. Legislature, Oral History Program, "Redistricting: 1962"](https://app.leg.wa.gov/oralhistory/redistricting2/1960s/1962/); [the voters'' pamphlet](https://www.sos.wa.gov/_assets/elections/voters''%20pamphlet%201962.pdf). Votes: [Wikipedia, "List of Washington (state) ballot measures"](https://en.wikipedia.org/wiki/List_of_Washington_(state)_ballot_measures); Check: Wash. *Abstract of Votes*, Nov. 6, 1962. [[w.politics-of-reapportionment]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
    tags: [state:wa]
