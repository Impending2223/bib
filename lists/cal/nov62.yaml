# Cal. XXV November 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXV
entries:
  - id: cal.1962-11-02.missile-crisis
    when: Nov. 2
    date: '1962-11-02'
    thread: missile-crisis
    c: 'Kennedy reports the bases being dismantled. Mikoyan in Havana three weeks: inspection, the IL-28s.'
    n: Report to the American People on the Soviet Arms Buildup in Cuba (Nov. 2, 1962). Mikoyan, *Anatomiya Karibskogo krizisa* (K–J Adm. II.D). See [[cal.1962-05-24.missile-crisis]].
  - id: cal.1962-11-06.elections-1962
    when: Nov. 6
    date: '1962-11-06'
    thread: elections-1962
    c: Midterms. Democrats lose a few House seats, gain in the Senate. Brown beats Nixon. Romney, Scranton, Rockefeller elected governor; Edward Kennedy, McGovern, Bayh to the Senate.
    n: 'See [[cal.1962-05-05.elections-1962]]. Names: Romney, Scranton, Rockefeller (Opp. III.H); Edward M. Kennedy, McGovern (K–J Cong. III.B); Brown (K–J Cong. III.F).'
  - id: cal.1962-11-07.elections-1962
    when: Nov. 7
    date: '1962-11-07'
    thread: elections-1962
    c: 'Nixon at the Beverly Hilton: "You won''t have Nixon to kick around anymore."'
    n: 'Recording (Opp. II.I). See [[cal.1962-06-05.elections-1962]]. Names: Nixon (Opp. III.E).'
  - id: cal.1962-11-19.india-and-china
    when: Nov. 19–21
    date: '1962-11-19'
    thread: india-and-china
    c: 'Nehru asks for American air squadrons. Arms already flying; Harriman''s mission to New Delhi. Nov. 21: China''s cease-fire and withdrawal.'
    n: 'Galbraith (K–J Adm. II.G.4). Riedel (see [[cal.1961-12-18.india-and-china]]). Names: Harriman, Galbraith (K–J Adm. III.E).'
  - id: cal.1962-11-20.missile-crisis
    when: Nov. 20
    date: '1962-11-20'
    thread: missile-crisis
    c: Khrushchev agrees to remove the IL-28s. Quarantine lifted, at the press conference.
    n: News Conference (Nov. 20, 1962). See [[cal.1962-05-24.missile-crisis]].
  - id: cal.1962-11-20.civil-rights-the-executive
    when: Nov. 20
    date: '1962-11-20'
    thread: civil-rights-the-executive
    c: 'Same press conference: the housing order. No discrimination in federally aided housing, prospectively.'
    n: 'Exec. Order No. 11,063 (K–J Adm. II.H.2). Graham, *The Civil Rights Era*; Brauer, *Second Reconstruction* (K–J Adm. II.C). Pritchett (K–J Adm. II.G.5). See [[cal.1961-03-06.civil-rights-the-executive]]. Names: Weaver (K–J Adm. III.G).'
  - id: cal.1962-11-21.space
    when: Nov. 21
    date: '1962-11-21'
    thread: space
    c: Kennedy and Webb, Cabinet Room, taped. The moon first. "I'm not that interested in space."
    n: 'Logsdon, *John F. Kennedy and the Race to the Moon* (K–J Adm. II.B). See [[cal.1961-04-12.space]]. Names: Webb (K–J Adm. III.G).'
  - id: cal.1962-11.opinion
    when: Nov.
    date: 1962-11
    thread: opinion
    c: After the missile crisis, approval in the mid-seventies.
    n: See [[cal.1961-02-10.opinion]].
