    thread: governors
    also: [elections-1962]
    c: Colorado. Love (R) governor over McNichols (D), seeking a third term, 349,342 to 262,890, 56.7 percent.
    n: 'Votes: [Colo. *Abstract of Votes Cast*, 1962, 24–25](https://spl.cde.state.co.us/artemis/sserials/s111internet/s1111962internet.pdf#page=14). [[w.peirce-mountain-states-of-america]]. See [[cal.1962-09-11.governors-co]]. Names: Love, McNichols.'
