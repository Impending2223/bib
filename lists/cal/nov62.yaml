    also: [legislatures]
    c: 'Colorado. Two initiated amendments of the constitution on the apportionment of the General Assembly. Amendment No. 7, the House by population, the Senate much as it was: yes 305,700, no 172,725, adopted. Amendment No. 8, both houses by population through a commission: yes 149,822, no 311,749, refused.'
    n: 'Votes: [Colo. *Abstract of Votes Cast*, 1962, 28–29](https://spl.cde.state.co.us/artemis/sserials/s111internet/s1111962internet.pdf#page=16); *Lucas v. Forty-Fourth General Assembly*, [377 U.S. 713, 717](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377713/usrep377713.pdf#page=5) (1964). [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]; the Court on Amendment No. 7: [[cal.1964-06-15.court]].'
