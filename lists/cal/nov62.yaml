# Cal. XXV November 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXV
entries:
  - id: cal.1962-11-02.missile-crisis
    when: Nov. 2
    date: '1962-11-02'
    thread: missile-crisis
    c: Kennedy reports the bases are being dismantled. Mikoyan in Havana for three weeks, over inspection and the IL-28 bombers.
    n: Report to the American People on the Soviet Arms Buildup in Cuba (Nov. 2, 1962). Mikoyan, *Anatomiya Karibskogo krizisa* (K–J Adm. II.D).
  - id: cal.1962-11-06.elections-1962
    when: Nov. 6
    date: '1962-11-06'
    thread: elections-1962
    c: Election day. The Democrats lose a handful of House seats and gain in the Senate, a good midterm for a President's party. Brown beats Nixon; Romney, Scranton, and Rockefeller win governorships; Edward Kennedy, McGovern, and Birch Bayh to the Senate.
    n: 'Check the net figures. Names: Romney, Scranton, Rockefeller (Opp. III.H); McGovern, Edward M. Kennedy (K–J Cong. III.B); Brown (K–J Cong. III.F).'
  - id: cal.1962-11-07.elections-1962
    when: Nov. 7
    date: '1962-11-07'
    thread: elections-1962
    c: 'Nixon at the Beverly Hilton: "You won''t have Nixon to kick around anymore, because, gentlemen, this is my last press conference."'
    n: 'Recording (Opp. II.I). Names: Nixon (Opp. III.E).'
  - id: cal.1962-11-19.india-and-china
    when: Nov. 19–21
    date: '1962-11-19'
    thread: india-and-china
    c: Nehru asks for American air squadrons. Arms are already flying in; Harriman's mission leaves for New Delhi. On the 21st China declares a cease-fire and pulls back.
    n: 'Galbraith (K–J Adm. II.G.4). Riedel (see [[cal.1961-12-18.india-and-china]]). Names: Harriman (K–J Adm. III.E).'
  - id: cal.1962-11-20.missile-crisis
    when: Nov. 20
    date: '1962-11-20'
    thread: missile-crisis
    c: Khrushchev agrees to take out the IL-28s. Kennedy lifts the quarantine at a press conference.
    n: News Conference (Nov. 20, 1962).
  - id: cal.1962-11-20.civil-rights-the-executive
    when: Nov. 20
    date: '1962-11-20'
    thread: civil-rights-the-executive
    c: At the same press conference, the housing order. No discrimination in housing built with federal aid, from now on. The "stroke of a pen," twenty-two months late.
    n: Exec. Order No. 11,063 (K–J Adm. II.H.2). Graham, *The Civil Rights Era*; Brauer, *Second Reconstruction* (K–J Adm. II.C). Pritchett (K–J Adm. II.G.5).
  - id: cal.1962-11-21.space
    when: Nov. 21
    date: '1962-11-21'
    thread: space
    c: Kennedy and Webb in the Cabinet Room, recorded. The moon first; "I'm not that interested in space" otherwise.
    n: 'Logsdon, *John F. Kennedy and the Race to the Moon* (K–J Adm. II.B). Names: Webb (K–J Adm. III.G).'
  - id: cal.1962-11.opinion
    when: Nov.
    date: 1962-11
    thread: opinion
    c: After the missile crisis, approval back in the mid-seventies. Check the readings and field dates.
    n: See [[cal.1961-02-10.opinion]].
