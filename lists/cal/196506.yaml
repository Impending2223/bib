  - id: cal.1965-06-01.economy
    when: June 1
    date: '1965-06-01'
    thread: economy
    c: 'Martin, at Columbia''s commencement luncheon, "Does Monetary History Repeat Itself?": "disquieting similarities between our present prosperity and the fabulous twenties."'
    n: '[Address before the Alumni Federation of Columbia University](https://fraser.stlouisfed.org/title/448/item/7898) (June 1, 1965) (FRASER). To check: [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]. See [[cal.1964-11-23.economy]]. Names: Martin.'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1965-06-01.latin-america
    when: June 1–2
    date: '1965-06-01'
    thread: latin-america-dominican-republic
    c: Some 2,000 Marines ordered out of the Dominican Republic, June 1, on the advice of the Inter-American force's Brazilian commander and Palmer, his deputy. June 2, the OAS foreign ministers name an Ad Hoc Committee, Bunker with the delegates of Brazil and El Salvador, to find a settlement, and name the force the Inter-American Peace Force.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031) (June 1, 1965). FRUS 1964–68, XXXII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58), [85](https://history.state.gov/historicaldocuments/frus1964-68v32/d85), [103](https://history.state.gov/historicaldocuments/frus1964-68v32/d103). [[w.drea-mcnamara-clifford-and-the-2011]], 311 (Alvim and Palmer recommend the 4,100 Marines out in two increments by June 6; the JCS and OSD concur; the second statement held to June 4). To check: [[w.schaffer-ellsworth-bunker]]. See [[cal.1965-05-15.latin-america]]. Names: Palmer, Bunker.'
    src:
      c: d457c26b
      rows:
        - 'https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d58: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 311: A'
    tags: [name:johnson-lyndon-b, name:palmer-bruce-jr, name:bunker-ellsworth]
  - id: cal.1965-06-01.governors-nj
    when: June 1
    date: '1965-06-01'
    thread: governors
    also: [elections-1965]
    c: 'New Jersey primaries for governor. Democratic: Hughes renominated over one other, 236,518 to 23,722, 90.9 percent. Republican: Dumont, State senator, over Sandman, State senator, 167,402 to 154,491, 50.4 percent.'
    n: '[*Results of the Primary Election Held June 1, 1965*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1965-primary-election.pdf) (Secretary of State); figures here from [Wikipedia, "1965 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1965_New_Jersey_gubernatorial_election) (Hughes 236,518; Dumont 167,402, Sandman 154,491, Harold P. Poeschel 10,576); check against the Results. To check: [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes, Dumont, Sandman.'
    tags: [state:nj, name:hughes-richard-j, name:dumont-wayne-jr, name:sandman-charles-w-jr]
  - id: cal.1965-06-01.voting-rights
    when: June 1
    date: '1965-06-01'
    thread: voting-rights
    also: [rules]
    c: 'The House Judiciary Committee reports the voting bill with the poll tax ban the Senate refused. Smith, holding it in Rules: "many Communists, subversives, fellow travelers, and others of doubtful loyalty to their country have attached themselves to this movement." Celler forces a vote with the twenty-one-day rule.'
    n: '[[w.zelizer-fierce-urgency-of-now]], 218; [[w.bernstein-guns-or-butter]], 240 (the three-way split: the eight Republicans'' substitute, "hastily contrived"). To check: Bruce J. Dierenfield, *Keeper of the Rules* (1987), 204 (cited by [[w.zelizer-fierce-urgency-of-now]], 218 n.117). Check: the day of Smith''s words. Names: Smith, Celler.'
    src:
      c: a65ad807
      rows:
        - 'w.zelizer-fierce-urgency-of-now 218: all'
        - 'w.bernstein-guns-or-butter 240: A'
    tags: [name:smith-howard-w, name:celler-emanuel]
