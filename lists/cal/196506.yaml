    time_zone: America/New_York
  - id: cal.1965-06-01.latin-america
    when: June 1–2
    date: '1965-06-01'
    thread: latin-america-dominican-republic
    c: Some 2,000 Marines ordered out of the Dominican Republic, June 1, on the advice of the Inter-American force's Brazilian commander and Palmer, his deputy. June 2, the OAS foreign ministers name an Ad Hoc Committee, Bunker with the delegates of Brazil and El Salvador, to find a settlement, and name the force the Inter-American Peace Force.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031) (June 1, 1965). FRUS 1964–68, XXXII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58), [85](https://history.state.gov/historicaldocuments/frus1964-68v32/d85), [103](https://history.state.gov/historicaldocuments/frus1964-68v32/d103). [[w.drea-mcnamara-clifford-and-the-2011]], 311 (Alvim and Palmer recommend the 4,100 Marines out in two increments by June 6; the JCS and OSD concur; the second statement held to June 4); [[w.ball-past-has-another-pattern]], 329 (a special OAS committee of three, Bunker among them; not the day, the other members or the Marines); [[w.rusk-as-i-saw-it-1990]], 375 (the OAS commission, Bunker the American representative; the peace force, troops of Brazil, Costa Rica, El Salvador, Honduras, Nicaragua and Paraguay with the Americans; not the day, the other delegates or the name). To check: [[w.schaffer-ellsworth-bunker]]. See [[cal.1965-05-15.latin-america]]. Names: Palmer, Bunker.'
    src:
      c: d457c26b
      rows:
        - 'https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d58: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 311: A'
        - 'w.ball-past-has-another-pattern 329: ?'
        - 'w.rusk-as-i-saw-it-1990 375: ?'
