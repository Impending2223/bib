    at: before 1965-06-11
    place: washington
    thread: transition-and-staff
    c: 'The Oval Office, by Moyers''s account to Goodwin. Johnson, a wire-service report in his hand: "Bundy is going on television — on national television — with five professors. I never gave him permission. That''s an act of disloyalty. ... Bill, I want you to go to Bundy and tell him the president would be pleased, mighty pleased, to accept his resignation." Then: "That''s the trouble with all you fellows. You''re in bed with the Kennedys." Moyers goes home without seeing Bundy.'
