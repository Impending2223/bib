    c: 'The mansion, the second floor, at breakfast. Goodwin brings Johnson the draft of the Howard address, finished at dawn, with a covering memorandum: drafts shown to Valenti, Moyers and "Pat Moynihan of Labor"; "a speech like this might well help toward making you ''The Great Emancipator'' of the twentieth century." Johnson reads it, penciling amendments: "That''ll do just fine, Dick." Goodwin: "Don''t you think I ought to check it out with black leaders?" Johnson: "If you''d like to."'
    n: '[[w.goodwin-remembering-america]], 343–44 (Goodwin''s account). Check: the day; the book puts the commencement on June 5 (343). See [[cal.1965-05.civil-rights-the-executive-2]]. Names: Goodwin, Johnson, Valenti, Moyers, Moynihan.'
