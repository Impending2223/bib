  - id: cal.1965-06-26.china-leadership-3
    when: June 26
    date: '1965-06-26'
    place: cairo
    thread: china-leadership
    also: [africa]
    c: 'Zhou meets Somalia''s Prime Minister Hussein at the Chinese embassy. China is for meeting on time; he came to attend; but if no agreement and all states agree to postpone, China will seek common ground, prepare well, never be hasty. In ten years many states have won independence; though problems remain between them, the common wish is chiefly unity, cooperation, against imperialism and colonialism. On Algeria: all parties now show it is an internal matter, and China keeps to non-interference; a government changes by democratic procedure, as in Somalia after its elections, or by armed coup, which China respects where there is no foreign interference, as in the Sudan; U.S. intervention with troops in South Vietnam, the Congo (Léopoldville) and the Dominican Republic is another matter, which all should oppose.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 739–40 (June 26, 1965); [[w.zhou-enlai-waijiao-huodong]], 465 (June 26, 1965; 11 p.m., the Chinese embassy in Cairo, Somalia''s Prime Minister (the book gives 侯赛因, Hussein)). Made public: 1993. Names: Zhou Enlai, Hussein.'
    src:
      c: 09bb5a01
      rows:
        - 'w.zhou-enlai-nianpu-1949 II, 739–40: ?'
        - 'w.zhou-enlai-waijiao-huodong 465: A, G-I'
    tags: [name:zhou-enlai, polity:prc, polity:somalia, vis:only:prc+somalia]
