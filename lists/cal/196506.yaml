    when: June 3
    date: '1965-06-03'
    thread: vietnam
    c: 'Taylor, for Ball: "we do not believe that any feasible amount of bombing of the North is of itself likely to cause the DRV to cease and desist in its actions in the South."'
    n: '[FRUS 1964–68, II, doc. 328](https://history.state.gov/historicaldocuments/frus1964-68v02/d328). [[w.mann-grand-delusion]], 439–40. Names: Taylor, Ball.'
    src:
