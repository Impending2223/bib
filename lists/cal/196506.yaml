  - id: cal.1965-06-22.transition-and-staff
    when: June 22
    date: '1965-06-22'
    place: washington
    thread: transition-and-staff
    c: 'The Oval Office; Moyers and Goodwin with Johnson. Goodwin remarks that the aid-to-education bill has the support of the liberal organizations; Johnson: "I am not going to have anything more to do with the liberals. They won''t have anything to do with me. They all just follow the communist line — liberals, intellectuals, communists. ... I detest the United Nations. They''ve tried to make a fool out of me. ... I can''t trust anybody anymore. ... I''m going to get rid of everybody who doesn''t agree with my policies. I''ll take a tough line — put Abe Fortas or Clark Clifford in the Bundy job." Of Gagarin and the astronauts in Paris: "a personal insult to me."'
    n: '[[w.goodwin-remembering-america]], 401 (Goodwin''s account, with his diary''s note of the talk afterward with Moyers; the first part also the epigraph, 392). Names: Johnson, Moyers, Goodwin, Fortas, Clifford, Bundy.'
    tags: [name:johnson-lyndon-b, name:moyers-bill, name:goodwin-richard-n, name:fortas-abe, name:clifford-clark, name:bundy-mcgeorge]
