  - id: cal.1965-06-09.vietnam-operations
    when: June 9–12
    date: '1965-06-09'
    time: 1965-06-09T16:00Z
    time_approx: true
    place: dong-xoai
    thread: vietnam-operations
    c: 'Đồng Xoài, Phước Long Province, some eighty-five kilometers north of Saigon. Shortly before midnight, elements of the Viet Cong 272d and 273d Regiments attack the Special Forces–advised CIDG camp and district headquarters; by noon on the 10th much of the camp overrun. Two South Vietnamese battalions landed by helicopter, mauled; a third, June 11, hit on the 12th. South Vietnamese losses: 416 killed, 174 wounded, 233 missing. A battalion task force of the 173d Airborne Brigade flown to Phước Vĩnh, June 13; back June 18 without a fight.'
    n: '[FRUS 1964–68, III, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v03/d5) (Taylor to Johnson, June 17). Remarks and Citation at the Medal of Honor Ceremony for Lt. Charles Q. Williams, USA, [1966 Pub. Papers 646](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=722) (June 23, 1966). [[w.def-u-s-viet-rels-iv-c-5]], 82; [[w.carland-united-states-army-in]], 27–28, 46; [[w.vietnam-victory-in-vietnam]], 146–47, 462 n.35 (the attack of June 9; the relief battalions destroyed); [[w.moyar-triumph-forsaken]], 396–402; [[w.bernstein-guns-or-butter]], 347; [[w.lich-su-khang-chien-chong-my]], III, 419–22 (the campaign''s second phase: the night of June 9 the approach, by 4 a.m. June 10 most of the post taken; the battalions landed by air beaten June 10–11; the post wholly taken; the Second Regiment named the Đồng Xoài Regiment). [[w.macv-command-history-1965]], 222 (the attack and the relief; the losses). The time is the first day''s. To check: COMUSMACV MILREP, 140737Z Jun 65 (cited by [[w.macv-command-history-1965]], 222 n.258). Check: *Victory in Vietnam* makes Đồng Xoài the second phase, from June 9, of a campaign opened May 11 in Phước Long and ended July 22: 4,000 of the enemy put out of action, 73 American advisers among them (146–47). Check: Moyar, 397, has the 2nd Viet Cong Regiment and a battalion of the 3rd make the assault.'
