    c: 'Zhou, fourth talk with Nasser: the second conference''s anti-imperialist, anti-colonialist tone must not be below the second non-aligned conference''s, or it is a weak meeting; what matters is to state the nature of aggression; second, name old friends, a clear line; whether to name is secondary; how to propose it to be talked over with friends. Whether or not it meets on time, Bandung''s ten principles stand and he will work for them.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 738–39 (June 22, 1965); [[w.zhou-enlai-waijiao-huodong]], 463 (June 22, 1965; 10:30 a.m., Kubba Palace, Cairo, the fourth talks with Nasser, in which the book has the second conference''s anti-imperialist tone not to be lower than the second non-aligned conference''s, or it is weak, and the nature and responsibility of aggression to be named, the latter the main one, enemy told from friend); [[w.zhonghua-renmin-gongheguo-waijiao]], 34–35 (June 19–30, 1965; Zhou''s return-banquet speech: China wholly for the second Afro-Asian Conference on schedule and well run; on Algeria, no interference in others'' affairs). Made public: 1993. Names: Zhou Enlai, Nasser.'
