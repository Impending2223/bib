  - id: cal.1965-06-04.civil-rights-the-executive
    when: June 4
    date: '1965-06-04'
    thread: civil-rights-the-executive
    also: [welfare]
    c: Howard University commencement, "To Fulfill These Rights." "Freedom is not enough." "Not just equality as a right and a theory but equality as a fact and equality as a result." The breakdown of the Negro family. A White House conference in the fall under that title. Drafted by Goodwin from Moynihan's report.
    n: 'Commencement Address at Howard University: "To Fulfill These Rights", [1965 Pub. Papers 635](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=109) (June 4, 1965). Recording (K–J Adm. II.I). To check: [[w.research-negro-family]]; [[w.rainwater-moynihan-report-and-the]]; [[w.kotz-judgment-days]]; [[w.graham-civil-rights-era]]. See [[cal.1965-03-15.voting-rights]]. Names: Goodwin, Moynihan.'
    tags: [name:johnson-lyndon-b, name:goodwin-richard-n, name:moynihan-daniel-patrick]
  - id: cal.1965-06-04.vietnam
    when: June 4
    date: '1965-06-04'
    thread: vietnam
    also: [china]
    c: 'McGeorge Bundy to Johnson, 11:10 a.m., with the British telegrams from Peking: Zhou Enlai''s message so interesting Johnson will want to read it himself. Rusk finds it relatively defensive. Bundy: it does not say at what point the Chinese might move in Vietnam in a way that would force the United States to act against China, "the $64 question."'
    n: '[FRUS 1964–68, XXX, doc. 88](https://history.state.gov/historicaldocuments/frus1964-68v30/d88); II, docs. [321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321) (editorial note), [335](https://history.state.gov/historicaldocuments/frus1964-68v02/d335) (William Bundy to Rusk, June 5: London to tell Chen Yi the message was received). [[w.jian-maos-china-and-the]], 217–18, 355 n.59 (the message). To check: Peking (Hopson) to the Foreign Office, No. 720, May 31, 1965, FO 371/180996, Public Record Office (cited by [[w.jian-maos-china-and-the]], 217 n.58). See [[cal.1965-05-31.vietnam]]. Names: McGeorge Bundy, Zhou Enlai, Rusk, Johnson.'
    src:
      c: d6deb410
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v30/d88: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d321: all'
        - 'w.jian-maos-china-and-the 217: A'
        - 'via w.jian-maos-china-and-the 217 n.58: A'
        - 'via w.jian-maos-china-and-the 218 n.59: A-C'
    tags: [name:bundy-mcgeorge, name:rusk-dean, name:johnson-lyndon-b, name:zhou-enlai]
  - id: cal.1965-06-05.vietnam
    when: June 5
    date: '1965-06-05'
    thread: vietnam
    c: 'Lunch at the State Department: Rusk, McNamara, Ball and the Bundys; Johnson joins them unasked. By William Bundy''s account "a reflective discussion of where we were headed," nothing decided. Johnson: would more Americans mean the Vietnamese would do less? McNamara: no sign of it. Rusk, by McNamara''s account: "We''re looking for no more than a stalemate in the South." Johnson: "The great danger is we''ll pick up a very big problem any day."'
    n: '[[w.dallek-flawed-giant]], 270 (from William Bundy''s manuscript history of the war). [[w.mann-grand-delusion]], 440 (Rusk''s office; Johnson''s coming; the words). To check: William Bundy''s manuscript history, chap. 26, 3–6, LBJ Library (cited by [[w.dallek-flawed-giant]], 270); [[w.mcnamara-in-retrospect]], 186–87 (cited by [[w.mann-grand-delusion]], 440 n.11). See [[cal.1965-06-03.vietnam]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, William Bundy. Check: Mann, 440, has them in Rusk''s office in the afternoon, Taylor''s telegram of the day before them.'
    src:
      c: 049a8bdf
      rows:
        - 'w.dallek-flawed-giant 270: A-E'
        - 'via w.dallek-flawed-giant 270 n.90: A-E'
        - 'w.mann-grand-delusion 440: A-B, F-G'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:bundy-william]
  - id: cal.1965-06-05.vietnam-congress
    when: June 5
    date: '1965-06-05'
    thread: vietnam-congress
    c: 'Mansfield to Johnson, after the leaders'' meeting: support for his "resistance to pressures for an irreversible extension of the war in Asia," which bombing Hanoi and Haiphong could be; "the minimum military effort" and the conference table "as soon as possible." Against McNamara''s 300,000: "that is but a beginning"; with Chinese forces "we had better start thinking in terms of millions." "It is about time you got an accounting from those who have pressured you."'
    n: '[[w.gibbons-u-s-government-and]], III, 276. [[w.mann-grand-delusion]], 440–41. To check: Mansfield to Johnson, June 5, 1965, NSF, Name File, Mansfield, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 276 n.160). See [[cal.1965-06-03.vietnam]]. Names: Mansfield, Johnson.'
    src:
      c: 160d3087
      rows:
        - 'w.gibbons-u-s-government-and III, 276: A-B'
        - 'via w.gibbons-u-s-government-and III, 276 n.160a: A-B'
        - 'w.mann-grand-delusion 440–41: A, C-E'
        - 'via w.mann-grand-delusion 440 n.13: A, C-E'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1965-06-05.vietnam-2
    when: June 5
    date: '1965-06-05'
    thread: vietnam
    also: [china]
    c: 'William Bundy to Rusk, on Chen Yi''s talk with the British chargé, May 31: "obviously meant to be conveyed to us"; the British told yesterday they may tell Chen Yi the message was received. Chen Yi tough on Hanoi''s resolve, mild in that China would not come in unless itself attacked, tough on going all the way if it did. Peking "wants a channel."'
    n: '[FRUS 1964–68, II, doc. 335](https://history.state.gov/historicaldocuments/frus1964-68v02/d335), par. 2. [[w.zhai-china-and-the-vietnam]], 138–39 (the line Chen Yi drew; the message received). See [[cal.1965-05-31.vietnam]]. Names: William Bundy, Rusk, Chen Yi.'
