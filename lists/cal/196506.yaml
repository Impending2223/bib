    c: 'Mao, to Wang Dongxing, on Yu Qiuli''s account at the 14th National Public Security Conference of Mao''s instructions on the Third Plan: "I pressed them again"; more than 100 billion yuan at a stroke will not do; transport, grain, steel, timber not equal to it, three southwest railways cannot be built at once, another reversal likely; not to turn the people upside down. Third front: factories that cannot move are not to be moved; two hands. Public security: arrest who should be arrested, don''t go to the other extreme.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 26, 1965; [[w.mao-zedong-zhuan]], VI, ch. 74 (Mao to Wang Dongxing: one cannot think the third front built first and war after; the U.S. will not wait; two hands (n.8; the note dates the record June 6)). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). Check: the *Mao Zedong zhuan* puts the talk with Wang Dongxing June 26 in its text and dates the record June 6 in its note (VI, ch. 74 n.8). To check: Mao Zedong 毛泽东, talk with Wang Dongxing 汪东兴 (record 谈话记录), June 6 or 26, 1965 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.8). Names: Mao Zedong, Wang Dongxing, Yu Qiuli.'
