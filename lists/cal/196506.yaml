  - id: cal.1965-06-05.vietnam
    when: June 5
    date: '1965-06-05'
    thread: vietnam
    c: 'Lunch at the State Department: Rusk, McNamara, Ball and the Bundys; Johnson joins them unasked. By William Bundy''s account "a reflective discussion of where we were headed," nothing decided. Johnson: would more Americans mean the Vietnamese would do less? McNamara: no sign of it. Rusk, by McNamara''s account: "We''re looking for no more than a stalemate in the South." Johnson: "The great danger is we''ll pick up a very big problem any day."'
    n: '[[w.dallek-flawed-giant]], 270 (from William Bundy''s manuscript history of the war); [[w.mcnamara-in-retrospect]], ch. 7 at nn.29–30 (Rusk''s office, Saturday afternoon, on Taylor''s telegram; Johnson, Lady Bird away; "The great danger is we''ll pick up a very big problem any day"). [[w.mann-grand-delusion]], 440 (Rusk''s office; Johnson''s coming; the words); [[w.drea-mcnamara-clifford-and-the-2011]], 33 (Taylor''s warning; the meeting at State, Johnson joining; "great danger"). Check: McNamara gives "We''re looking for no more than a stalemate in the South" as his own words, Rusk having "tried to be hopeful" (ch. 7 at nn.29–30); the meeting in Rusk''s office, Thompson there. To check: William Bundy''s manuscript history, chap. 26, 3–6, LBJ Library (cited by [[w.dallek-flawed-giant]], 270). See [[cal.1965-06-03.vietnam]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, William Bundy. Check: Mann, 440, has them in Rusk''s office in the afternoon, Taylor''s telegram of the day before them.'
    src:
      c: 049a8bdf
