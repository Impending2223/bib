        - 'w.mann-grand-delusion 440: A-C'
        - 'via w.mann-grand-delusion 440 n.12: B-C'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:taylor-maxwell]
  - id: cal.1965-06-03.vietnam-congress
    when: June 3
    date: '1965-06-03'
    thread: vietnam-congress
    c: 'Foreign Relations, on the $89 million for Vietnam and the Mekong plan. Fulbright: "I am sorry we ever had anything to do with it"; "it looks to me as if we are headed for a war unless we turn the emphasis around."'
    n: '[[w.gibbons-u-s-government-and]], III, 301. Names: Fulbright.'
    src:
      c: c4573e5a
      rows:
        - 'w.gibbons-u-s-government-and III, 301: all'
    tags: [name:fulbright-j-william]
  - id: cal.1965-06-03.vietnam-congress-2
    when: June 3
    date: '1965-06-03'
    thread: vietnam-congress
    c: Twenty-eight House liberals, Rosenthal leading, seven of them members of Foreign Affairs, ask the committee for hearings on Vietnam. No hearings.
    n: '[[w.gibbons-u-s-government-and]], III, 303. Names: Rosenthal.'
