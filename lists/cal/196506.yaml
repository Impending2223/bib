  - id: cal.1965-06-01.program
    when: June 1
    date: '1965-06-01'
    place: washington
    thread: program
    c: 'The National Cathedral, Luci Johnson''s graduation from National Cathedral School. Johnson speaks from the floor, not the pulpit: after a few words on homework, asking pardon of the girls for the solemn talk of an old man, a foreign policy speech. He kisses Luci and sits through the ceremony.'
    n: '[[w.johnson-white-house-diary]], 277–78 (Mrs. Johnson''s account). To check: 1965 Pub. Papers. Names: Johnson, Lady Bird Johnson.'
    tags: [name:johnson-lady-bird, name:johnson-lyndon-b]
  - id: cal.1965-06-01.republican-party
    when: June 1
    date: '1965-06-01'
    place: washington
    thread: republican-party
    c: 'A stag party at the White House for General Eisenhower, some fifty men. Eisenhower and Johnson put their heads in at the door of the Reception Room, where Mrs. Johnson is with the decorators. Mrs. Johnson: glad they can be friends.'
    n: '[[w.johnson-white-house-diary]], 279. Made public: 1970. To check: the President''s Daily Diary, June 1, 1965. Names: Eisenhower, Johnson, Lady Bird Johnson.'
