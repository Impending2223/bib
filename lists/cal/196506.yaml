  - id: cal.1965-06-07.court
    when: June 7
    date: '1965-06-07'
    thread: court
    also: [health]
    c: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf): Connecticut''s ban on the use of contraceptives void as applied to married couples. Douglas for the Court, 7–2: "specific guarantees in the Bill of Rights have penumbras" that create "zones of privacy." Goldberg, with Warren and Brennan, on the Ninth Amendment; Harlan and White concurring. Black and Stewart dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.garrow-liberty-and-sexuality]]; [[w.powe-warren-court-and-american]]; [[w.kalman-long-reach-of-the-2017]]. See [[cal.1961-06-19.court]]. Names: Douglas.'
    tags: [name:douglas-william-o]
  - id: cal.1965-06-07.vietnam
    when: June 7
    date: '1965-06-07'
    thread: vietnam-force-levels
    c: 'Westmoreland to the Joint Chiefs: the war "moving to a higher level"; North Vietnamese units in the South; the South''s army cannot hold without American troops. He asks the rest of the 3d Marine Division, the Army''s airmobile division for the highlands, a Korean division, the 173d kept on: with what is there, the forty-four battalions. Sharp concurs, June 7 and 11.'
    n: '[FRUS 1964–68, II, doc. 337](https://history.state.gov/historicaldocuments/frus1964-68v02/d337); [FRUS 1964–68, III, doc. 1](https://history.state.gov/historicaldocuments/frus1964-68v03/d1). [[w.gibbons-u-s-government-and]], III, 277–278 (the request, the 44 battalions; CINCPAC and the Joint Chiefs agree); [[w.drea-mcnamara-clifford-and-the-2011]], 33 (the cable of June 7, more marines, the airmobile and Korean divisions; the North Vietnamese); [[w.poole-joint-chiefs-of-staff-2012]], 43 (the cable); [[w.cosmas-joint-chiefs-of-staff-2012]], 300–302. [[w.barrett-uncertain-warriors]], 26–27 (the request, 34 American battalions and 10 Korean; Sharp''s concurrence); [[w.moyar-triumph-forsaken]], 394–95. To check: [[w.pentagon-papers]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.khong-analogies-at-war]]; [[w.kaiser-american-tragedy]]; [[w.carland-united-states-army-in]]; [[w.westmoreland-soldier-reports]]; CINCPAC to JCS, 072325Z June 1965, JCS IN 93177 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 302 n.29). See [[cal.1965-03-08.vietnam]]. Names: Westmoreland, Sharp.'
