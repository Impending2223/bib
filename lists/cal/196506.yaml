agmire]]; [[w.khong-analogies-at-war]]; [[w.kaiser-american-tragedy]]; [[w.carland-united-states-army-in]]; CINCPAC to JCS, 072325Z June 1965, JCS IN 93177 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 302 n.29). See [[cal.1965-03-08.vietnam]]. Names: Westmoreland, Sharp.'
