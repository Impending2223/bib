# Cal. LXVII June 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXVII
entries:
  - id: cal.1965-06-01.economy
    when: June 1
    date: '1965-06-01'
    thread: economy
    c: 'Martin, at Columbia''s commencement luncheon, "Does Monetary History Repeat Itself?": "disquieting similarities between our present prosperity and the fabulous twenties."'
    n: '[Address before the Alumni Federation of Columbia University](https://fraser.stlouisfed.org/title/448/item/7898) (June 1, 1965) (FRASER). To check: [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]. See [[cal.1964-11-23.economy]]. Names: Martin.'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1965-06-01.latin-america
    when: June 1–2
    date: '1965-06-01'
    thread: latin-america-dominican-republic
    c: Some 2,000 Marines ordered out of the Dominican Republic, June 1, on the advice of the Inter-American force's Brazilian commander and Palmer, his deputy. June 2, the OAS foreign ministers name an Ad Hoc Committee, Bunker with the delegates of Brazil and El Salvador, to find a settlement, and name the force the Inter-American Peace Force.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1031) (June 1, 1965). FRUS 1964–68, XXXII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58), [85](https://history.state.gov/historicaldocuments/frus1964-68v32/d85), [103](https://history.state.gov/historicaldocuments/frus1964-68v32/d103). To check: [[w.schaffer-ellsworth-bunker]]. See [[cal.1965-05-15.latin-america]]. Names: Palmer, Bunker.'
    tags: [name:johnson-lyndon-b, name:palmer-bruce-jr, name:bunker-ellsworth]
  - id: cal.1965-06-01.governors-nj
    when: June 1
    date: '1965-06-01'
    thread: governors
    also: [elections-1965]
    c: 'New Jersey primaries for governor. Democratic: Hughes renominated over one other, 236,518 to 23,722, 90.9 percent. Republican: Dumont, State senator, over Sandman, State senator, 167,402 to 154,491, 50.4 percent.'
    n: '[*Results of the Primary Election Held June 1, 1965*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1965-primary-election.pdf) (Secretary of State); figures here from [Wikipedia, "1965 New Jersey gubernatorial election"](https://en.wikipedia.org/wiki/1965_New_Jersey_gubernatorial_election) (Hughes 236,518; Dumont 167,402, Sandman 154,491, Harold P. Poeschel 10,576); check against the Results. To check: [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes, Dumont, Sandman.'
    tags: [state:nj, name:hughes-richard-j, name:dumont-wayne-jr, name:sandman-charles-w-jr]
  - id: cal.1965-06-02.opinion
    when: June 2
    date: '1965-06-02'
    thread: opinion
    also: [latin-america]
    c: 'Gallup, May 13–18: Johnson''s sending troops into the Dominican Republic: approve 76 percent, disapprove 17. The troops likely to stay a year or two, 41; out soon, 24.'
    n: '[[w.gallup-poll]], III, 1942–43. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-03.space
    when: June 3–7
    date: '1965-06-03'
    thread: space
    c: 'Gemini 4: McDivitt and White, four days in orbit. June 3, White outside the capsule on a tether some 23 minutes, the first American to walk in space. The first flight run from the new control center at Houston. Down in the Atlantic June 7.'
    n: 'Telephone Conversation Between the President and Astronauts James McDivitt and Edward White, [1965 Pub. Papers 646](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=120) (June 7, 1965); Remarks in Houston at the NASA Manned Spacecraft Center, [1965 Pub. Papers 655](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=129) (June 11, 1965). To check: [[w.mcdougall-heavens-and-the-earth]]; [[w.siddiqi-challenge-to-apollo]]. See [[cal.1964-07-31.space]]. Names: McDivitt, White.'
    tags: [name:johnson-lyndon-b, name:mcdivitt-james-a, name:white-edward-h-ii]
  - id: cal.1965-06-03.economy
    when: June 3
    date: '1965-06-03'
    thread: economy
    c: 'Coinage message. Silver out of the dime and quarter: faces of the nickel''s copper-nickel on a copper core. The half dollar from 90 percent silver to 40. The Treasury to use more than 300 million ounces of silver for coins this year, more than the free world mines. Senate passes the Coinage Act June 24, [74–9](https://voteview.com/rollcall/RS0890130).'
    n: Special Message to the Congress Proposing Changes in the Coinage System, [1965 Pub. Papers 620](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=94) (June 3, 1965). [111 Cong. Rec., Senate, June 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-3-1.pdf). See [[cal.1965-05-17.economy]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-03.vietnam
    when: June 3
    date: '1965-06-03'
    thread: vietnam
    c: 'Leadership meeting. By Mansfield''s account Johnson hopeful on Santo Domingo, pessimistic on Vietnam: the Joint Chiefs and others for bombing Hanoi; he has put them off a week, to hear Taylor and for fear of China. No feelers from the other side.'
    n: 'Mansfield''s memorandum, [FRUS 1964–68, II, doc. 327](https://history.state.gov/historicaldocuments/frus1964-68v02/d327). [[w.dallek-flawed-giant]], 270. Made public: FRUS 1964–68, II (1996). To check: [[w.gibbons-u-s-government-and]], III, 276. See [[cal.1965-03-16.vietnam]]. Names: Mansfield, Johnson, Taylor.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:taylor-maxwell]
  - id: cal.1965-06-04.civil-rights-the-executive
    when: June 4
    date: '1965-06-04'
    thread: civil-rights-the-executive
    also: [welfare]
    c: Howard University commencement, "To Fulfill These Rights." "Freedom is not enough." "Not just equality as a right and a theory but equality as a fact and equality as a result." The breakdown of the Negro family. A White House conference in the fall under that title. Drafted by Goodwin from Moynihan's report.
    n: 'Commencement Address at Howard University: "To Fulfill These Rights", [1965 Pub. Papers 635](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=109) (June 4, 1965). Recording (K–J Adm. II.I). To check: [[w.research-negro-family]]; [[w.rainwater-moynihan-report-and-the]]; [[w.kotz-judgment-days]]; [[w.graham-civil-rights-era]]. See [[cal.1965-03-15.voting-rights]]. Names: Goodwin, Moynihan.'
    tags: [name:johnson-lyndon-b, name:goodwin-richard-n, name:moynihan-daniel-patrick]
  - id: cal.1965-06-04.vietnam
    when: June 4
    date: '1965-06-04'
    thread: vietnam
    also: [china]
    c: 'McGeorge Bundy to Johnson, 11:10 a.m., with the British telegrams from Peking: Zhou Enlai''s message so interesting Johnson will want to read it himself. Rusk finds it relatively defensive. Bundy: it does not say at what point the Chinese might move in Vietnam in a way that would force the United States to act against China, "the $64 question."'
    n: '[FRUS 1964–68, XXX, doc. 88](https://history.state.gov/historicaldocuments/frus1964-68v30/d88); II, docs. [321](https://history.state.gov/historicaldocuments/frus1964-68v02/d321) (editorial note), [335](https://history.state.gov/historicaldocuments/frus1964-68v02/d335) (William Bundy to Rusk, June 5: London to tell Chen Yi the message was received). [[w.jian-maos-china-and-the]], 217–18 (the message), 355 n.59. See [[cal.1965-05-31.vietnam]]. Names: McGeorge Bundy, Zhou Enlai, Rusk, Johnson.'
    tags: [name:bundy-mcgeorge, name:rusk-dean, name:johnson-lyndon-b, name:zhou-enlai]
  - id: cal.1965-06-05.vietnam
    when: June 5
    date: '1965-06-05'
    thread: vietnam
    c: 'Lunch at the State Department: Rusk, McNamara, Ball and the Bundys; Johnson joins them unasked. By William Bundy''s account "a reflective discussion of where we were headed," nothing decided. Johnson: would more Americans mean the Vietnamese would do less? McNamara: no sign of it.'
    n: '[[w.dallek-flawed-giant]], 270 (from William Bundy''s manuscript history of the war). See [[cal.1965-06-03.vietnam]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, William Bundy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-mcgeorge, name:bundy-william]
  - id: cal.1965-06-06.vietnam
    when: June 6
    date: '1965-06-06'
    thread: vietnam
    also: [china]
    c: 'The first Chinese engineering troops enter North Vietnam: the second division of the Chinese People''s Volunteer Engineering Force, over 12,000 men, to build defense works and communications on fifteen islands and eight points of the Tonkin Gulf coast, and to fight beside the North Vietnamese if the Americans invade. Under the agreements of Apr. 27 (railways) and May 30 (twelve roads). By Chinese figures, over 320,000 Chinese engineering and antiaircraft troops served in North Vietnam, 1965–69, 170,000 at the peak in 1967.'
    n: '[[w.jian-maos-china-and-the]], 221–25, 229 (by the Chinese military histories). Washington''s knowledge: [FRUS 1964–68, XXX, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v30/d113) (Cline, Dec. 6: "some Chinese Communist troops (albeit probably logistic ones) are already in Vietnam"); IV, doc. [52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Jan. 28, 1966: "two Chinese construction companies"). Made public: the Chinese military histories Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. Check: the Chinese figures; Chen''s note (358 n.100) has Whiting give 50,000 Chinese troops in all, the Vietnamese sources 20,000.'
    tags: [place:gulf-of-tonkin]
  - id: cal.1965-06-07.court
    when: June 7
    date: '1965-06-07'
    thread: court
    also: [health]
    c: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf): Connecticut''s ban on the use of contraceptives void as applied to married couples. Douglas for the Court, 7–2: "specific guarantees in the Bill of Rights have penumbras" that create "zones of privacy." Goldberg, with Warren and Brennan, on the Ninth Amendment; Harlan and White concurring. Black and Stewart dissenting.'
    n: 'Opinion (K–J Cong. II.J.1). To check: [[w.garrow-liberty-and-sexuality]]; [[w.powe-warren-court-and-american]]; [[w.kalman-long-reach-of-the-2017]]. See [[cal.1961-06-19.court]]. Names: Douglas.'
    tags: [name:douglas-william-o]
  - id: cal.1965-06-07.vietnam
    when: June 7
    date: '1965-06-07'
    thread: vietnam-force-levels
    c: 'Westmoreland to the Joint Chiefs: the war "moving to a higher level"; North Vietnamese units in the South; the South''s army cannot hold without American troops. He asks the rest of the 3d Marine Division, the Army''s airmobile division for the highlands, a Korean division, the 173d kept on: with what is there, the forty-four battalions. Sharp concurs, June 7 and 11.'
    n: '[FRUS 1964–68, II, doc. 337](https://history.state.gov/historicaldocuments/frus1964-68v02/d337); [FRUS 1964–68, III, doc. 1](https://history.state.gov/historicaldocuments/frus1964-68v03/d1). [[w.gibbons-u-s-government-and]], III, 277–278; [[w.drea-mcnamara-clifford-and-the-2011]], 34–36; [[w.poole-joint-chiefs-of-staff-2012]], 43; [[w.cosmas-joint-chiefs-of-staff-2012]], 303. To check: [[w.pentagon-papers]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.khong-analogies-at-war]]; [[w.barrett-uncertain-warriors]]; [[w.kaiser-american-tragedy]]; [[w.logevall-choosing-war]]; [[w.carland-united-states-army-in]]; [[w.westmoreland-soldier-reports]]. See [[cal.1965-03-08.vietnam]]. Names: Westmoreland, Sharp.'
    tags: [name:westmoreland-william, name:sharp-u-s-grant]
  - id: cal.1965-06-08.vietnam
    when: June 8–9
    date: '1965-06-08'
    thread: vietnam
    c: 'McCloskey, for the State Department: American troops "would be available for combat support together with the Vietnamese forces as and when necessary." Westmoreland''s authority confirmed to him June 5. June 9, the White House: no change in mission; the troops guard bases, and Westmoreland may use them for Vietnamese forces "faced with aggressive attack" when no other reserves are available.'
    n: '[FRUS 1964–68, II, doc. 339](https://history.state.gov/historicaldocuments/frus1964-68v02/d339). [[w.gibbons-u-s-government-and]], III, 278–281. To check: [[w.hammond-public-affairs]]. See [[cal.1965-06-07.vietnam]]. Names: McCloskey, Westmoreland.'
    tags: [name:mccloskey-robert-j, name:westmoreland-william]
  - id: cal.1965-06-09.vietnam
    when: June 9
    date: '1965-06-09'
    thread: vietnam
    c: 'Mansfield to Johnson, asked the night before: no new resolution; a request on ground forces could "set off a wave of criticism." Three courses: all the South, upwards of a million men; the cities and provincial capitals, about 500,000; a position to negotiate from, 100,000.'
    n: '[FRUS 1964–68, II, doc. 341](https://history.state.gov/historicaldocuments/frus1964-68v02/d341). [[w.gibbons-u-s-government-and]], III, 280–282. See [[cal.1965-06-07.vietnam]]. Names: Mansfield, Johnson.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1965-06-09.vietnam-2
    when: June 9
    date: '1965-06-09'
    thread: vietnam
    c: 'Javits in the Senate: no land war in Asia without the specific consent of Congress; the President should ask for it.'
    n: '[111 Cong. Rec. 12,983–87](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-1-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 282–283. See [[cal.1965-06-09.vietnam]]. Names: Javits.'
    tags: [name:javits-jacob-k]
  - id: cal.1965-06-09.economy-debt-limit
    when: June 9
    date: '1965-06-09'
    thread: economy-debt-limit
    c: House passes H.R. 8464, the temporary debt limit $328 billion for fiscal 1966. Rule, [273–109](https://voteview.com/rollcall/RH0890066); passed, [229–165](https://voteview.com/rollcall/RH0890067).
    n: '[111 Cong. Rec., House, June 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-1-1.pdf). See [[cal.1963-05-15.economy]].'
  - id: cal.1965-06-09.vietnam-operations
    when: June 9–12
    date: '1965-06-09'
    thread: vietnam-operations
    c: 'Đồng Xoài, Phước Long Province, some eighty-five kilometers north of Saigon. Shortly before midnight, elements of the Viet Cong 272d and 273d Regiments attack the Special Forces–advised CIDG camp and district headquarters; by noon on the 10th much of the camp overrun. Two South Vietnamese battalions landed by helicopter, mauled; a third, June 11, hit on the 12th. South Vietnamese losses: 416 killed, 174 wounded, 233 missing. A battalion task force of the 173d Airborne Brigade flown to Phước Vĩnh, June 13; back June 18 without a fight.'
    n: '[FRUS 1964–68, III, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v03/d5) (Taylor to Johnson, June 17). Remarks and Citation at the Medal of Honor Ceremony for Lt. Charles Q. Williams, USA, [1966 Pub. Papers 646](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=722) (June 23, 1966). [[w.def-u-s-viet-rels-iv-c-5]], 82; [[w.carland-united-states-army-in]], 27–28, 46; [[w.vietnam-victory-in-vietnam]], 146–47, 462 n.35. Check: *Victory in Vietnam* makes Đồng Xoài the second phase, from June 9, of a campaign opened May 11 in Phước Long and ended July 22: 4,000 of the enemy put out of action, 73 American advisers among them (146–47).'
    tags: [place:dong-xoai]
  - id: cal.1965-06-10.states-and-cities
    when: June 10
    date: '1965-06-10'
    thread: states-and-cities
    also: [mayors]
    c: Wagner will not seek a fourth term as mayor of New York. Lindsay, Republican of the 17th District, already a candidate since May 13. Check the date.
    n: 'To check: [[w.cannato-ungovernable-city]]; [[w.buckley-unmaking-of-a-mayor]]. Names: Wagner, Lindsay.'
    tags: [name:wagner-robert-f-jr, name:lindsay-john-v, state:ny, city:nyc]
  - id: cal.1965-06-10.legislatures-ia
    when: June 10
    date: '1965-06-10'
    thread: state-legislatures
    c: 'Iowa. The General Assembly adjourns, the longest session in the State''s history, 145 days. Its work: the death penalty abolished; a civil rights commission created; withholding of the income tax; nine constitutional amendments proposed, annual sessions, home rule and four-year terms for governor among them. Check the date and the acts'' dates.'
    n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 107–110. See [[cal.1965-01-11.legislatures-ia]].'
    tags: [state:ia]
  - id: cal.1965-06-10.vietnam
    when: June 10
    date: '1965-06-10'
    thread: vietnam-force-levels
    c: 'Katzenbach to Johnson: no further approval by Congress needed, as a matter of law, to send 30,000 to 40,000 more troops and use them against Viet Cong concentrations as much as 150 miles from American bases. The Commander in Chief''s power; the Southeast Asia resolution. A resolution''s political uses to be weighed against its risks.'
    n: '[FRUS 1964–68, II, doc. 345](https://history.state.gov/historicaldocuments/frus1964-68v02/d345) (the date handwritten). See [[cal.1965-06-07.vietnam]]. Names: Katzenbach, Johnson.'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1965-06-11.opinion
    when: June 11
    date: '1965-06-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 13–18: the most important problem: Vietnam 23 percent; civil rights 23; threat of war 16; prestige abroad 9; world communism 9; the Dominican Republic 4; cost of living 4.'
    n: '[[w.gallup-poll]], III, 1944.'
  - id: cal.1965-06-12.vietnam
    when: June 12
    date: '1965-06-12'
    thread: vietnam-saigon
    c: Saigon. Quát, deadlocked with Chief of State Sửu, hands power back to the generals.
    n: '[FRUS 1964–68, II, doc. 349](https://history.state.gov/historicaldocuments/frus1964-68v02/d349) (Taylor, June 12, 2:05 a.m.: the formula agreed at 1 a.m., the statement to be issued that morning); [FRUS 1964–68, III, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v03/d2) (June 13). [[w.gibbons-u-s-government-and]], III, 294–295; [[w.staaveren-gradual-failure]], 149. Staaveren, 149, dates Quát''s resignation June 11. To check: [[w.kahin-intervention]]; [[w.ky-twenty-years-and-twenty]]. See [[cal.1964-10-24.vietnam]]. Names: Phan Huy Quát, Phan Khắc Sửu.'
    tags: [name:phan-huy-quat, name:phan-khac-suu, place:saigon]
  - id: cal.1965-06-13.opinion
    when: June 13
    date: '1965-06-13'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, May 13–18: a worker in a unionized plant required to join the union: should 43 percent, should not 49; union members 66 and 30. Approve of labor unions, 70. Unions have too much power: agree 57; big business has: agree 54.'
    n: '[[w.gallup-poll]], III, 1944.'
  - id: cal.1965-06-14.mississippi
    when: June 14
    date: '1965-06-14'
    thread: mississippi
    also: [voting-rights]
    c: Jackson. Against the legislature's special session on the voting laws, Lawrence Guyot of the Freedom Democrats leads some 500, nearly half of them teenagers, from the Morning Star Baptist Church toward the Capitol; police arrest 482 for parading without a permit and hold them in the State fairgrounds' cattle barns.
    n: '[[w.dittmer-local-people]], 344–46. The arrests, more than 1,000 by the end of June, and the Fifth Circuit''s injunction of June 30: Dittmer, 345–46. Names: Guyot.'
    tags: [state:ms, city:jackson, name:guyot-lawrence]
  - id: cal.1965-06-15.latin-america
    when: June 15–16
    date: '1965-06-15'
    thread: latin-america-dominican-republic
    c: Santo Domingo. Caamaño's forces attack the Inter-American force's lines; the 82d Airborne pushes into the rebel zone. Check the losses.
    n: '[FRUS 1964–68, XXXII, doc. 109](https://history.state.gov/historicaldocuments/frus1964-68v32/d109) (editorial note). See [[cal.1965-06-01.latin-america]]. Names: Caamaño-Deno.'
    tags: [name:caamano-deno-francisco]
  - id: cal.1965-06-15.specials
    when: June 15
    date: '1965-06-15'
    thread: specials
    also: [congress, south-carolina]
    c: South Carolina 2nd, special. Watson, who resigned the seat Feb. 1 after the House Democratic caucus took his seniority for backing Goldwater, re-elected as a Republican over Callison (D), 55,977 to 24,761, 69.3 percent.
    n: 'Votes: CQ Guide 6th (2010) 1276. See [[cal.1965-01-02.congress]]. Names: Watson, Callison, Goldwater.'
    tags: [special:1965-06-15-h-SC-2, name:watson-albert-w, name:goldwater-barry-m, name:callison-preston-h]
  - id: cal.1965-06-15.georgia-atlanta
    when: June 15
    date: '1965-06-15'
    thread: georgia
    also: [legislatures, elections-1965, state-legislatures]
    c: Georgia House elections under the 1965 reapportionment (Check which seats). Bond, SNCC's communications director, elected from the 136th district, Atlanta, over another Negro candidate, 2,320 to 487, 82.7 percent; some 6,000 of its 6,500 voters Negroes. Eleven Negroes elected to the House (Check).
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966). To check: [[w.neary-julian-bond]]; [[w.tuck-beyond-atlanta]]. See [[cal.1964-06-30.states-and-cities]]; [[cal.1965-01-18.georgia-ga]]. Names: Bond.'
    tags: [name:bond-julian, state:ga, city:atlanta]
  - id: cal.1965-06-15.vietnam
    when: June 15
    date: '1965-06-15'
    thread: vietnam
    c: 'Fulbright in the Senate, at Johnson''s request of the day before: against withdrawal and against escalation. An end by negotiation "involving major concessions by both sides."'
    n: '[111 Cong. Rec. 13,656–58](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-5-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 303–306. To check: [[w.woods-fulbright]]. See [[cal.1965-06-07.vietnam]]. Names: Fulbright, Johnson.'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1965-06-16.cities-and-housing
    when: June 16
    date: '1965-06-16'
    thread: cities-and-housing
    c: House passes the bill for a Department of Housing and Urban Development, H.R. 6927, [217–184](https://voteview.com/rollcall/RH0890071); recommittal refused, [141–259](https://voteview.com/rollcall/RH0890070).
    n: '[111 Cong. Rec., House, June 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-6-1.pdf). The President''s News Conference, [1965 Pub. Papers 669](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=143) (June 17, 1965). To check: [[w.gelfand-nation-of-cities]]; [[w.pritchett-robert-clifton-weaver-and]]. See [[cal.1965-01-04.program]].'
  - id: cal.1965-06-16.vietnam
    when: June 16
    date: '1965-06-16'
    thread: vietnam-force-levels
    c: McNamara announces deployments that bring American ground battalions in Vietnam to thirteen and the forces there to about 70,000.
    n: '[FRUS 1964–68, III, doc. 4](https://history.state.gov/historicaldocuments/frus1964-68v03/d4). [[w.gibbons-u-s-government-and]], III, 306–308; [[w.staaveren-gradual-failure]], 150–151. To check: [[w.carland-united-states-army-in]]. See [[cal.1965-06-07.vietnam]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1965-06-16.health
    when: June 16
    date: '1965-06-16'
    thread: health
    c: 'Senate passes the Cigarette Labeling Act, S. 559, [72–5](https://voteview.com/rollcall/RS0890119): a health warning on every pack; for three years no federal, State, or local authority to require one in advertising, an amendment for one year refused, [29–49](https://voteview.com/rollcall/RS0890118).'
    n: '[111 Cong. Rec., Senate, June 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-6-2.pdf). To check: [[w.brandt-cigarette-century]]. See [[cal.1964-01-11.health]].'
  - id: cal.1965-06-16.economy-debt-limit
    when: June 16
    date: '1965-06-16'
    thread: economy-debt-limit
    c: Senate passes H.R. 8464, [61–26](https://voteview.com/rollcall/RS0890117).
    n: '[111 Cong. Rec., Senate, June 16, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-6-2.pdf). See [[cal.1965-06-09.economy-debt-limit]].'
  - id: cal.1965-06-17.goldwater
    when: June 17
    date: '1965-06-17'
    thread: goldwater
    c: 'Washington. Goldwater announces the Free Society Association, a movement of conservative political education. Kitchel its executive director: 500,000 members expected. June 15, Goldwater will run in 1968 for Hayden''s Senate seat "regardless of who runs."'
    n: 'The Ripon Society, newsletter, July 1965, [p. 1](https://riponsociety.org/wp-content/uploads/2023/12/1965-07_Vol-1_No-5.pdf). To check: [[w.kabaservice-rule-and-ruin]]; [[w.goldberg-barry-goldwater]]. See [[cal.1965-01-12.elections-1964]]. Names: Goldwater, Kitchel, Hayden.'
    tags: [name:goldwater-barry-m, name:kitchel-denison, name:hayden-carl]
  - id: cal.1965-06-18.vietnam
    when: June 18
    date: '1965-06-18'
    thread: vietnam
    c: 'First B-52 strike (Arc Light): 27 bombers from Guam on a Viet Cong base area north of Saigon, near Bến Cát. Two collide over the Pacific on the way. Check.'
    n: 'FRUS 1964–68, III, docs. [14](https://history.state.gov/historicaldocuments/frus1964-68v03/d14), [40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40). [[w.gibbons-u-s-government-and]], III, 317; [[w.frankum-like-rolling-thunder]], 76–79; [[w.staaveren-u-s-air-force]], 133. To check: [[w.schlight-united-states-air-force]]. See [[cal.1965-03-02.vietnam]].'
    tags: [place:ben-cat]
  - id: cal.1965-06-18.latin-america
    when: June 18
    date: '1965-06-18'
    thread: latin-america-dominican-republic
    c: The OAS Ad Hoc Committee proposes for the Dominican Republic elections in six to nine months, a provisional government meanwhile, a general amnesty, and arms surrendered to the OAS.
    n: 'Check: the proposal. See [[cal.1965-06-15.latin-america]].'
  - id: cal.1965-06-19.africa
    when: June 19
    date: '1965-06-19'
    thread: africa
    c: 'Algiers. The army, under Boumediene, Defense Minister, deposes Ben Bella before dawn. The CIA: no abrupt change in policy to be expected; the new government says Algeria will keep its commitments.'
    n: 'FRUS 1964–68, XXIV, doc. [21](https://history.state.gov/historicaldocuments/frus1964-68v24/d21). To check: [[w.byrne-mecca-of-revolution]]. See [[cal.1963-10-08.africa]]. Names: Boumediene, Ben Bella.'
    tags: [name:boumediene-houari, name:ben-bella-ahmed]
  - id: cal.1965-06-19.vietnam
    when: June 19
    date: '1965-06-19'
    thread: vietnam-saigon
    c: 'Saigon. Kỳ prime minister; a National Leadership Council of ten generals, Thiệu chairman and chief of state. Taylor to Johnson, June 17: "disturbed by the selection of General Ky."'
    n: '[FRUS 1964–68, III, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v03/d5) (June 17). Check: the day of the Council''s formation. [[w.gibbons-u-s-government-and]], III, 294–296; [[w.staaveren-gradual-failure]], 149. See [[cal.1965-06-12.vietnam]]. Names: Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Taylor, Johnson.'
    tags: [name:nguyen-cao-ky, name:nguyen-van-thieu, name:taylor-maxwell, name:johnson-lyndon-b, place:saigon]
  - id: cal.1965-06-21.economy
    when: June 21
    date: '1965-06-21'
    thread: economy
    c: 'Excise Tax Reduction Act signed, [79 Stat. 136](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg136.pdf): $1.75 billion off at midnight, $1.75 billion more Jan. 1, 1966; $4.7 billion in all by 1969. House, June 2, [401–6](https://voteview.com/rollcall/RH0890061); Senate, June 15, [84–3](https://voteview.com/rollcall/RS0890116).'
    n: Remarks at the Signing of the Excise Tax Reduction Bill, [1965 Pub. Papers 691](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=165) (June 21, 1965); The President's Statement to the Cabinet Following Passage of the Excise Tax Reductions, [1965 Pub. Papers 686](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=160) (June 18, 1965). [111 Cong. Rec., House, June 2, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-6-2.pdf); [111 Cong. Rec., Senate, June 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-5-1.pdf). See [[cal.1965-05-17.economy]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-22.japan-and-korea
    when: June 22
    date: '1965-06-22'
    thread: japan-and-korea-normalization
    also: [japan]
    c: 'Tokyo. Japan and Korea sign the Treaty on Basic Relations, [583 U.N.T.S. 33](https://treaties.un.org/doc/Publication/UNTS/Volume%20583/volume-583-I-8471-English.pdf), and agreements on fisheries, Koreans in Japan, claims and economic cooperation, cultural property, disputes. Claims: $300 million in grants, $200 million in loans. Students in Seoul''s streets; the universities closed.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [364](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d364), [365](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d365). To check: [[w.cha-alignment-despite-antagonism]]; [[w.yi-in-search-of-a]]; [[w.lee-troubled-peace]]. See [[cal.1965-02-17.japan-and-korea]].'
  - id: cal.1965-06-23.robert-kennedy
    when: June 23
    date: '1965-06-23'
    thread: robert-kennedy
    also: [testing]
    c: Robert Kennedy in the Senate on the spread of nuclear weapons, "the most vital issue now facing this Nation and the world," not Vietnam, the Dominican Republic, or Berlin. Negotiations now on a nonproliferation treaty; nuclear-free zones; the test ban extended to underground tests; American and Soviet nuclear forces halted and cut back; the IAEA strengthened.
    n: '[111 Cong. Rec. 14566–76 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-2-2.pdf#page=29). [[w.schlesinger-robert-kennedy-and-his]], 692. See [[cal.1965-01-21.testing]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1965-06-23.state-and-city-finance-nyc
    when: June 23
    date: '1965-06-23'
    thread: state-and-city-finance
    c: Albany, N.Y. The Assembly passes Wagner's fiscal bills for the city's budget of 1965–66, among them leave to borrow against future revenue to meet current expenses. Check the measures and the sums.
    n: '[*New York Times*, June 23, 1965](https://www.nytimes.com/1965/06/23/archives/assembly-passes-city-fiscal-bills-session-near-end-wagner-package.html). To check: [[w.morris-cost-of-good-intentions]]; [[w.shefter-political-crisis-fiscal-crisis]]. Names: Wagner.'
    tags: [state:ny, city:nyc, name:wagner-robert-f-jr]
  - id: cal.1965-06-23.latin-america
    when: June 23
    date: '1965-06-23'
    thread: latin-america-dominican-republic
    c: 'Caamaño''s answer to the OAS committee: the inter-American force out within a month of the provisional government.'
    n: '[FRUS 1964–68, XXXII, doc. 111](https://history.state.gov/historicaldocuments/frus1964-68v32/d111). See [[cal.1965-06-15.latin-america]]. Names: Caamaño-Deno.'
    tags: [name:caamano-deno-francisco]
  - id: cal.1965-06-23.vietnam-july-decision
    when: June 23
    date: '1965-06-23'
    thread: vietnam-july-decision
    c: 'The Cabinet Room, evening. Ball: stop at 100,000 men, a trial of three months, perhaps then a shift to Thailand. Rusk and McNamara against; McNamara for more forces as needed. Johnson asks Ball and McNamara for studies of the next three months, in a week.'
    n: 'FRUS 1964–68, III, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v03/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v03/d16) (editorial note). [[w.dallek-flawed-giant]], 272. Made public: FRUS 1964–68, III (1996). To check: [[w.ball-past-has-another-pattern]]. Bibliography: [[cal.1965-07-01.vietnam]]. Names: Ball, Rusk, McNamara, Johnson.'
    tags: [name:ball-george-w, name:rusk-dean, name:mcnamara-robert-s, name:johnson-lyndon-b, ok:thread-first]
  - id: cal.1965-06-24.mayors-nyc
    when: June 24
    date: '1965-06-24'
    thread: mayors
    also: [elections-1965]
    c: Buckley announces for mayor of New York, the Conservative Party's candidate, against Lindsay. Check the date.
    n: 'To check: [[w.buckley-unmaking-of-a-mayor]]; [[w.tanenhaus-buckley]]; [[w.mahoney-actions-speak-louder]]; [[w.cannato-ungovernable-city]]. See [[cal.1965-06-10.states-and-cities]]. Names: Buckley, Lindsay.'
    tags: [state:ny, city:nyc, name:buckley-william-f-jr, name:lindsay-john-v]
  - id: cal.1965-06-24.economy-debt-limit
    when: June 24
    date: '1965-06-24'
    thread: economy-debt-limit
    c: The debt limit to $328 billion for fiscal 1966 signed, [79 Stat. 172](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg172-2.pdf).
    n: Statute (K–J Cong. II.J.2). See [[cal.1965-06-09.economy-debt-limit]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-25.vietnam
    when: June 25
    date: '1965-06-25'
    thread: vietnam
    c: San Francisco, the twentieth anniversary of the UN Charter. The nations asked "to use all their influence, individually and collectively, to bring to the tables those who seem determined to make war."
    n: Address in San Francisco at the 20th Anniversary Commemorative Session of the United Nations, [1965 Pub. Papers 703](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=177) (June 25, 1965). [[w.gibbons-u-s-government-and]], III, 309–310; [[w.drea-mcnamara-clifford-and-the-2011]], 318. See [[cal.1965-04-07.vietnam]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-27.opinion
    when: June 27
    date: '1965-06-27'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 4–9: Republicans'' best candidate for 1968: Nixon 25, Lodge 14, Goldwater 13, Romney 11, Dirksen 7, Scranton 7, Rockefeller 6, Lindsay 5, Taft 3, Reagan 3, Hatfield 2, Percy 1. Independents: Lodge 20, Nixon 14, Romney 12, Goldwater 11, Scranton 9.'
    n: '[[w.gallup-poll]], III, 1946. Names: Lodge, Dirksen, Nixon, Goldwater, Hatfield, Percy, Lindsay, Taft, Reagan, Romney, Scranton, Rockefeller.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:goldwater-barry-m, name:romney-george-w, name:dirksen-everett, name:scranton-william-w, name:rockefeller-nelson, name:lindsay-john-v, name:taft-robert-jr, name:reagan-ronald, name:hatfield-mark-o, name:percy-charles-h]
  - id: cal.1965-06-28.economy
    when: June 28–30
    date: '1965-06-28'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling. Callaghan in Washington for American support of the pound. With Johnson, June 28: the two countries to "keep together" on money, no detail. June 30, at State, with McNamara, Ball and Bruce on the Defence Review: Britain''s defense budget to be held to £2 billion at 1964 prices by 1970. The Americans press for deflation, offering a part in a multilateral loan.'
    n: 'FRUS 1964–68, XII, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v12/d243) (Fowler to Johnson, June 28), [244](https://history.state.gov/historicaldocuments/frus1964-68v12/d244) (June 30). [[w.schwartz-lyndon-johnson-and-europe]], 76–77 (by the British records and Bruce''s diary). Names: Callaghan, Johnson, McNamara, Ball, Bruce.'
    tags: [name:callaghan-james, name:johnson-lyndon-b, name:mcnamara-robert-s, name:ball-george-w, name:bruce-david-k-e, name:fowler-henry-h]
  - id: cal.1965-06-29.legislatures-fl
    when: June 29
    date: '1965-06-29'
    thread: legislatures
    c: Florida's legislature, in the session that met Apr. 6, passes a new apportionment. Dec. 23, the three-judge court holds it unconstitutional but lets it stand until sixty days after the 1967 session.
    n: '*Swann v. Adams*, [383 U.S. 210](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383210/usrep383210.pdf) (1966). See [[cal.1964-06-22.legislatures-fl]].'
    tags: [state:fl]
  - id: cal.1965-06-29.poverty
    when: June 29
    date: '1965-06-29'
    thread: poverty
    also: [mississippi]
    c: 'Paul Johnson to Shriver: the Child Development Group of Mississippi, Head Start''s largest grant that summer, some $1.5 million for 6,000 children in eighty-four centers, "an effort on the part of extremists and agitators to subvert lawful authority." The same day the Senate Appropriations Committee, at Stennis''s urging, sends staff to inspect it.'
    n: '[[w.dittmer-local-people]], 368–72 (the quotation, 371). Names: Paul Johnson, Shriver, Stennis.'
    tags: [state:ms, name:johnson-paul-b-jr, name:shriver-r-sargent, name:stennis-john-c]
  - id: cal.1965-06-30.cities-and-housing
    when: June 30
    date: '1965-06-30'
    thread: cities-and-housing
    c: 'House passes the housing bill, H.R. 7984, [245–169](https://voteview.com/rollcall/RH0890081): rent supplements, limited by amendment to families eligible for public housing, [240–179](https://voteview.com/rollcall/RH0890079); a motion to recommit and strike them lost, [202–208](https://voteview.com/rollcall/RH0890080).'
    n: '[111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). Statement by the President Following Passage of the Housing Bill by the House of Representatives, [1965 Pub. Papers 712](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=186) (June 30, 1965). To check: [[w.gelfand-nation-of-cities]]. See [[cal.1965-06-16.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-06-30.india-and-china
    when: June 30
    date: '1965-06-30'
    thread: south-asia
    c: 'India and Pakistan sign, at New Delhi and Karachi, the agreement ending the fighting in the Rann of Kutch, through Britain''s good offices: a cease-fire, troops withdrawn, the boundary to arbitration. Johnson congratulates Wilson. The same day Washington asks the World Bank to put off the July meeting of Pakistan''s aid consortium; military deliveries to both held up.'
    n: 'FRUS 1964–68, XXV, docs. [137](https://history.state.gov/historicaldocuments/frus1964-68v25/d137), [138](https://history.state.gov/historicaldocuments/frus1964-68v25/d138), [139](https://history.state.gov/historicaldocuments/frus1964-68v25/d139). To check: [[w.mcmahon-cold-war-on-the]]. See [[cal.1964-05-27.india-and-china]]. Names: Johnson, Wilson.'
    tags: [name:johnson-lyndon-b, name:wilson-harold]
  - id: cal.1965-06.crime-and-hijacking-ny
    when: June
    date: 1965-06
    thread: crime-and-hijacking
    c: New York. Rockefeller signs the bill ending the death penalty but for the murder of a peace officer on duty and murder by a prisoner under a life sentence. The State's last execution was Eddie Lee Mays's, at Sing Sing, Aug. 15, 1963. Check the day.
    n: '[Wikipedia, "Capital punishment in New York"](https://en.wikipedia.org/wiki/Capital_punishment_in_New_York). Check: *Laws of New York*, 1965. To check: [[w.banner-death-penalty]]; [[w.connery-rockefeller-of-new-york]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1965-06.desegregation-schools-milwaukee
    when: June
    date: 1965-06
    thread: desegregation-schools
    also: [court]
    c: 'Milwaukee. Barbee files *Amos v. Board of School Directors* in the federal court: the board''s neighborhood-school policy keeps and deepens segregation.'
    n: '*Amos v. Board of School Directors*, [408 F. Supp. 765](https://static.case.law/f-supp/408/case-pdfs/0765-01.pdf) (E.D. Wis. 1976). [Wikipedia, "Lloyd Barbee"](https://en.wikipedia.org/wiki/Lloyd_Barbee) (Check: the day of filing). To check: [[w.dougherty-more-than-one-struggle]]; [[w.jones-selma-of-the-north]]. See [[cal.1964-05-18.desegregation-schools-milwaukee]]. Names: Barbee.'
    tags: [state:wi, city:milwaukee, name:barbee-lloyd]
  - id: cal.1965-06.mayors-minneapolis
    when: June
    date: 1965-06
    thread: mayors
    also: [elections-1965]
    c: Minneapolis re-elects Naftalin (DFL) mayor, a third term.
    n: '[Wikipedia, "Arthur Naftalin"](https://en.wikipedia.org/wiki/Arthur_Naftalin) (Check: the day, the opponent and the vote). See [[cal.1961-06-13.mayors-minneapolis]]. Names: Naftalin.'
    tags: [state:mn, city:minneapolis, name:naftalin-arthur]
  - id: cal.1965-06-30.desegregation-public-places-mo
    when: June 30
    date: '1965-06-30'
    thread: desegregation-public-places
    c: 'Hearnes approves S.C.S.S.B. 246, Missouri''s Public Accommodations Act: no discrimination or segregation in places of public accommodation on the grounds of race, creed, color, religion, national origin or ancestry; private clubs exempted, and barber shops and beauty parlors not within a covered establishment; the Commission on Human Rights to enforce it.'
    n: '*Laws of Missouri*, 1965, [505–508](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56935): "Approved June 30, 1965," [508](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56938) (Missouri State Archives, Missouri Digital Heritage). Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), chronology. See [[cal.1961-08-01.jobs-and-wages-mo]]. Names: Hearnes.'
    tags: [state:mo, name:hearnes-warren-e]
  - id: cal.1965-06-30.european-community
    when: June 30
    date: '1965-06-30'
    thread: european-community
    c: 'Brussels. The Council of the Six reaches midnight, its deadline, with no agreement on financing the farm policy; Couve de Murville, presiding, closes the session. France stays away from the Council: the empty chair. The Commission had proposed, Mar. 31, the levies to the Community and more power for its Parliament.'
    n: 'Check: the record. [[w.schwartz-lyndon-johnson-and-europe]], 94–95 (the walkout; its issues). To check: [[w.newhouse-collision-in-brussels]]; [[w.moravcsik-choice-for-europe]]; [[w.vaisse-la-grandeur]]; [[w.ludlow-european-community-and-the]]. See [[cal.1964-12-15.european-community]]. Names: Couve de Murville.'
    tags: [name:couve-de-murville-maurice]
  - id: cal.1965-06-30.state-and-city-finance-us
    when: June 30
    date: '1965-06-30'
    thread: state-and-city-finance
    c: Fiscal 1965 closes in forty-seven States. The fifty State governments' taxes for the year $26.1 billion, $135.61 a head; federal aid $9.9 billion; long-term debt $26.2 billion (Census).
    n: 'Census, [*Compendium of State Government Finances in 1965*](https://www2.census.gov/programs-surveys/gov-finances/datasets/historical/1900-1992%20State%20Government%20Finance.zip) (GF-No. 4, 1966), tables 3, 4, 6, 7, 8, 12, 20. To check: [[w.bureau-data-base-on-historical]]; [[w.bureau-data-base-on-historical-2010]]. See [[cal.1960-06-30.state-and-city-finance-us]].'
    tags: [statefin:1965]
