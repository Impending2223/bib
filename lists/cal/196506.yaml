  - id: cal.1965-06-02.vietnam
    when: June 2
    date: '1965-06-02'
    thread: vietnam
    c: 'Humphrey at Michigan State: the Viet Cong "not a great idealistic movement, not at all. These are no reformers. They are destroyers, assassins. The enemy is not in Washington. It''s in Hanoi and Peking."'
