  - id: cal.1965-06-02.cuba
    when: June 2
    date: '1965-06-02'
    thread: cuba
    c: 'Raborn, at the 303 Committee, asks to reactivate the paramilitary effort against Cuba on a highly selective basis: Castro supporting insurgents in fourteen Latin American countries; sabotage of ships in Cuban ports, raids on the coast, deception to keep Cuba''s defenses on alert.'
    n: '[FRUS 1964–68, XXXII, doc. 307](https://history.state.gov/historicaldocuments/frus1964-68v32/d307) (Jessup to Johnson, Sept. 22, giving the request). Check: the committee''s own record of June 2. See [[cal.1965-06.cuba]]. Names: Raborn, Castro.'
    src:
      c: 506a6998
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d307: all'
    tags: [name:raborn-william-f-jr, name:castro-fidel]
  - id: cal.1965-06-02.laos
    when: June 2
    date: '1965-06-02'
    thread: laos
    c: 'Souvanna Phouma approves Duck Soup, daylight intercepts of North Vietnamese transports supplying by air in Laos: four Whiplash F-105s on alert at Korat from late afternoon to dark, scrambled by the Udorn center, at low level clear of Samneua and the flak.'
    n: '[[w.anthony-war-in-northern-laos]], 172. Names: Souvanna Phouma.'
    src:
      c: 18e1b3ac
      rows:
        - 'w.anthony-war-in-northern-laos 172: all'
    tags: [name:souvanna-phouma]
