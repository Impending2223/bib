  - id: cal.1965-06-01.china-leadership-5
    when: June 1
    date: '1965-06-01'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hears the leading group of the trust pilot conference report. He says: ours is a socialist, organized and planned economy and should be organized better than the capitalist; the aim of the pilot trusts is to make the national economy more planned and organized, with specialization, standardization and serialization, better quality, more varieties, lower cost and higher labor productivity. A trust is to be run on the principles of economic management, to raise quality, add varieties, cut costs, raise productivity and technique and meet the people''s needs. Three forms may be considered: one with personnel, finance and property all taken over and the factories wholly absorbed; one with only unified plan, prices, supply of raw materials and sales of products; one with only the plan, the arrangement of tasks and the exchange of experience; probably all three are needed, not one only.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621 (June 1, 1965). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], the piece "Shi ban tuolasi" ("Trying out trusts"), the talk (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621). Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
