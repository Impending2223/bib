  - id: cal.1965-06-07.vietnam-congress
    when: June 7
    date: '1965-06-07'
    thread: vietnam-congress
    c: 'Foreign Relations, in executive session, on the $89 million: Aiken would give it to the President, not AID, "for either bashing them or buying them": "this committee didn''t get the United States in the mess." His motion fails, 4–13, Morse, Gore and Williams with him; the money approved.'
    n: '[[w.gibbons-u-s-government-and]], III, 300–01. To check: the executive session transcript, June 7, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 301 n.67). Names: Aiken, Morse, Gore, John J. Williams, Clark, Church.'
    src:
      c: 747a743f
      rows:
