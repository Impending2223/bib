    c: 'Peking 北京, the small auditorium on the third floor of the Great Hall of the People. Peng Zhen 彭真 speaks to the enlarged meeting of the leading group of the Peking University 北京大学 socialist education work team: for a time the work team, without study, denied everything and struggled people, splitting the school''s party and cadres; its chief leaders, set in their views, ignored the Twenty-three Articles and the Center, an error; Peking University a school under Party leadership on the socialist road; Lu Ping 陆平, as he told Mao 毛泽东, a good man who has erred; cure the sickness to save the patient, small meetings and talks, not mass meetings; "politics in command" must rest on teaching; idealism may be taught; uniting 95 and 95 percent, the children of landlords, rich peasants and capitalists among those to unite, judged by conduct; three points: settle the big questions ripe for settling, unite the university''s party organization on principle, attend to teaching.'
