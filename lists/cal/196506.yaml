  - id: cal.1965-06-06.vietnam
    when: June 6
    date: '1965-06-06'
    thread: vietnam
    also: [china]
    c: 'The first Chinese engineering troops enter North Vietnam: the second division of the Chinese People''s Volunteer Engineering Force, over 12,000 men, to build defense works and communications on fifteen islands and eight points of the Tonkin Gulf coast, and to fight beside the North Vietnamese if the Americans invade. Under the agreements of Apr. 27 (railways) and May 30 (twelve roads). By Chinese figures, over 320,000 Chinese engineering and antiaircraft troops served in North Vietnam, 1965–69, 170,000 at the peak in 1967.'
    n: '[[w.jian-maos-china-and-the]], 221–25, 229 (by the Chinese military histories); [[w.zhai-china-and-the-vietnam]], 135 (the totals: over 320,000, June 1965 to March 1968; 170,000 in 1967). Washington''s knowledge: [FRUS 1964–68, XXX, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v30/d113) (Cline, Dec. 6: "some Chinese Communist troops (albeit probably logistic ones) are already in Vietnam"); IV, doc. [52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Jan. 28, 1966: "two Chinese construction companies"). Made public: the Chinese military histories Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. To check: *Beijing Review*, Nov. 30, 1979, 14 (cited by [[w.zhai-china-and-the-vietnam]], 135 n.25, for the 320,000); the author''s interview with researchers at the PLA Military Science Academy, Beijing, July 2, 1996 (cited by [[w.zhai-china-and-the-vietnam]], 135 n.26, for the 170,000). Check: the Chinese figures; Zhai, 135, has the 320,000 for June 1965 to March 1968, from the *Beijing Review* of 1979 among others; Chen''s note (358 n.100) has Whiting give 50,000 Chinese troops in all, the Vietnamese sources 20,000.'
    src:
      c: dab1e007
      rows:
