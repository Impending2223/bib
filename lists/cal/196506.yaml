  - id: cal.1965-06-06.vietnam
    when: June 6
    date: '1965-06-06'
    thread: vietnam-hanoi
    also: [china]
    c: 'The first Chinese engineering troops enter North Vietnam: the second division of the Chinese People''s Volunteer Engineering Force, over 12,000 men, to build defense works and communications on fifteen islands and eight points of the Tonkin Gulf coast, and to fight beside the North Vietnamese if the Americans invade. Under the agreements of Apr. 27 (railways) and May 30 (twelve roads). By Chinese figures, over 320,000 Chinese engineering and antiaircraft troops served in North Vietnam, 1965–69, 170,000 at the peak in 1967.'
    n: '[[w.jian-maos-china-and-the]], 221–25, 229 (by the Chinese military histories); [[w.zhai-china-and-the-vietnam]], 135 (the totals: over 320,000, June 1965 to March 1968; 170,000 in 1967); [[w.macfarquhar-origins-of-the-cultural]], III, 373 (Chinese anti-aircraft, engineering, railway and logistics units go to North Vietnam from June 9, 1965); [[w.khoo-collateral-damage]], 31 (some 320,000 PLA personnel sent to North Vietnam from Aug. 1, 1965, to Mar. 20, 1969, at most 170,000 at one time; their purpose to deter an attack on the North, by Xie Yixian). Washington''s knowledge: [FRUS 1964–68, XXX, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v30/d113) (Cline, Dec. 6: "some Chinese Communist troops (albeit probably logistic ones) are already in Vietnam"); IV, doc. [52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Jan. 28, 1966: "two Chinese construction companies"). Made public: the Chinese military histories Chen cites, Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), and Li Ke and Hao Shengzhang (1989), by his notes (357–58); in English, [[w.jian-chinas-involvement-in-the]]. To check: *Beijing Review*, Nov. 30, 1979, at 14 (cited by [[w.zhai-china-and-the-vietnam]], 135 n.25, for the 320,000); the author''s interview with researchers at the PLA Military Science Academy, Beijing, July 2, 1996 (cited by [[w.zhai-china-and-the-vietnam]], 135 n.26, for the 170,000); Han Huaizhi et al., *Dangdai Zhongguo jundui de junshi gongzuo* (1989), 1:540–41, 545, 548 (cited by [[w.jian-maos-china-and-the]], 222–23 nn.76, 79, 82); Li Ke and Hao Shengzhang, *Wenhua dageming zhong de renmin jiefang jun* (1989), 418–19, 421–22 (cited by [[w.jian-maos-china-and-the]], 222–23 nn.76–77, 82); Wang Xiangen, *Kangmei yuanyue shilu* (1990), 46, 100–101 (cited by [[w.jian-maos-china-and-the]], 222 nn.76–77, for the agreements); Allen S. Whiting, "China''s Role in the Vietnam War," in Jayne Werner and David Hunt, eds., *The American War in Vietnam* (1993), 74 (cited by [[w.jian-maos-china-and-the]], 229 n.100, for 50,000 Chinese troops in all, and "Vietnamese sources" for 20,000); [[w.bianjibu-dangdai-zhongguo-waijiao]], 161 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 373 n.167a); [[w.yanjiubu-zhongguo-renmin-jiefang-jun]], 616, 617 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 373 n.167b); [[w.whiting-chinese-calculus-of-deterrence]], 186–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 373 n.167f); [[w.cheng-jianguo-yilai-jun-shi]], 222 (so cited: "Li Deng et al., eds.") (cited by [[w.khoo-collateral-damage]], 31 n.161); [[w.wang-taiping-zhonghua-renmin-gongheguo-waijiaoshi]], 37–38 (cited by [[w.khoo-collateral-damage]], 31 n.162); [[w.xie-yixian-zhongguo-waijiao-shi-1949-1996]], 337 (cited by [[w.khoo-collateral-damage]], 31 n.163). Check: the Chinese figures; Zhai, 135, has the 320,000 for June 1965 to March 1968, from the *Beijing Review* of 1979 among others; Chen''s note (358 n.100) has Whiting give 50,000 Chinese troops in all, the Vietnamese sources 20,000.'
    src:
