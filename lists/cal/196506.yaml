  - id: cal.1965-06-04.china-leadership-2
    when: June 4–7
    date: '1965-06-04'
    place: dar-es-salaam
    thread: china-leadership
    also: [africa]
    c: 'Zhou has five talks with Nyerere, June 4 to 7. June 4: wants the Sino-Tanzanian shipping company running soon; sailing needs a trial; both independent, with the right to sail the open sea, and their flags to be recognized and respected; at the coming Asian-African conference economics is a main question; begging imperialism and reform will not do. June 5: hopes most Tanzanian ministers who have not gone will visit China: "better to see once than hear a hundred times". June 6: on the Tanzania–Zambia railway: a comprehensive survey party in August or September, to survey the line, coal, iron ore, hydrology. June 7: new states should mind two key things: stress farming, build on it by their own conditions; live simply, not match developed states; and plan cities spread out, not too concentrated, industry spread out. At the first talk, June 4, Nyerere likens a new state that keeps a colonial economy to a leaky bucket that never fills; Zhou: the economic problem is the serious one for Asian and African states, and last year''s report to the U.N. trade conference at Geneva named the symptoms, not the remedy; the U.S. invades the Congo as a base against Africa, but Vietnam is the gravest problem for the world, and China will support it fully.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 735 (June 4–7, 1965); [[w.zhou-enlai-waijiao-huodong]], 460 (June 4, 1965, 6 p.m., first talks; June 5, 9 a.m., second talks, at the Dar es Salaam presidential palace); [[w.zhou-enlai-waijiao-huodong]], 461 (June 6, 1965, 5 p.m., third talks; June 7, 9 a.m., fourth, and 5 p.m., fifth; all at the presidential palace, Dar es Salaam); [[w.zhonghua-renmin-gongheguo-waijiao]], 32 (June 4–8, 1965; Zhou''s visit to Tanzania, June 4–8; talks with Nyerere, Karume and Kawawa); [[w.77-conversations-between-chinese]], [86](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=84) (doc. 12; Dar es Salaam, June 4, 1965, no hour: Zhou to Nyerere, the U.S. in the Congo seeking a base for further aggression in Africa, Vietnam the gravest question in the world, the U.S. bogged down there the better for national liberation, and China willing to give all kinds of support). [[w.jian-zhou-enlai]], 527 (the same insistence; the note cites the second conversation, June 6). Made public: 1993. To check: Second conversation between Zhou and Tanzanian President Nyerere, June 6, 1965, 106-01269-05 (printed "106-0126905"), Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 527 n.33a). Names: Zhou Enlai, Nyerere.'
    src:
