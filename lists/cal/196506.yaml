  - id: cal.1965-06-05.vietnam-3
    when: June 5
    date: '1965-06-05'
    thread: vietnam
    c: 'Saigon''s estimate of the situation, by the mission''s Intelligence Committee, Taylor concurring: a series of defeats could break the army''s will to fight; "To ward against the possibility of such a collapse, it will probably be necessary to commit US ground forces to action."'
    n: '[FRUS 1964–68, II, doc. 332](https://history.state.gov/historicaldocuments/frus1964-68v02/d332). [[w.mann-grand-delusion]], 440. Names: Taylor.'
    src:
      c: bb594512
      rows:
