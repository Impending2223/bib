  - id: cal.1965-06-16.china-leadership
    when: June 16
    date: '1965-06-16'
    place: hangzhou
    thread: china-leadership
    also: [china]
    c: 'Mao, Hangzhou, Wang Zhuang: hears Yu Qiuli on the Third Five-Year Plan and Gu Mu on the third front; Zhou Enlai, Peng Zhen, Chen Yi, Li Xiannian, Bo Yibo, Luo Ruiqing, Jiang Hua present. Mao: too many projects, too much investment, the targets too high; fewer; food, clothing, use not to fall, rise a little yearly; farm investment (14 billion yuan) too much, learn from Dazhai; industry from Daqing. Putting defense first "has to go against the line a little"; the third front in two ways, success or not. Hurry slowly.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 16, 1965; [[w.zhou-enlai-nianpu-1949]], II, 737 (June 16, 1965: Zhou, with Mao, hears Yu Qiuli on drawing up the Third Five-Year Plan and the long-term plan and studies third-front building, first- and second-line output, city building and farming; Mao: three things to weigh in a plan, the common people (do not lose their hearts), war, and famine); [[w.mao-zedong-zhuan]], VI, ch. 73 (June 16, 1965, Mao with Zhou, Peng Zhen, Li Xiannian, Bo Yibo and others hears Yu Qiuli and Gu Mu on the Third Plan and the Third Front: too many projects, targets too high; 108 billion yuan too much for five years, little margin; margin to be left with the people; the people, war, famine: Zhou sums up "prepare for war, prepare for famine, for the people" (n.31)). [[w.yang-jisheng-tiandi-fanfu]], II, 1067 (Zhou goes to Hangzhou and with Mao hears Yu Qiuli; Mao: start from war and from preparing for it, defense first, the third line faster; Zhou sums up Mao''s view as "prepare for war, prepare for famine, for the people"); [[w.peng-zhen-nianpu-1902]], IV, 422 (June 16, 1965; Hangzhou; Peng Zhen, with Mao and Zhou, hears Yu Qiuli and Gu Mu on the Third Five-Year Plan and the long-term plan; the third front, first- and second-front production, city building, agriculture; Mao: three factors in planning, the common people, war, natural disasters). Made public: 1997. To check: Mao Zedong 毛泽东, talk on hearing the report on the Third Five-Year Plan and the Third Front 三五计划和三线建设, June 16, 1965 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.31); Zhonggong zhongyang wenxian yanjiushi 中共中央文獻研究室, ed., *Zhou Enlai zhuan* 《周恩來傳》, vol. 4 (Zhongyang wenxian chubanshe 中央文獻出版社, 1998), 1803 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1067 n.4). Names: Mao Zedong, Zhou Enlai, Peng Zhen, Chen Yi, Li Xiannian, Bo Yibo, Luo Ruiqing, Yu Qiuli, Gu Mu, Jiang Hua.'
