    c: 'The Secretariat, 9 to 12. Deng Xiaoping 邓小平 outlines the Guangzhou conference 广州会议: the countryside, and investigation. The Secretariat''s four tasks for now: rural investigation organized; the rectification in industry kept up; output raised faster; the long-term plan.'
    n: '[[w.yang-shangkun-riji]], I, 667 (Mar. 27, 1961); [[w.deng-xiaoping-nianpu-1904]], III, 1624–1625 (Mar. 27, 1961; morning; Deng presides and relays the Guangzhou conference: egalitarianism and investigation; the general line, the leap and the communes right, some things spread too fast; seeking truth from facts harmed; little investigation, much falsity, the basic lesson; investigation restored above the county as a permanent method; fixed teams to go down; trial before spreading; industrial articles too, for large and middle plants; plans not fussy, key projects, out of the Soviet way of proportion, "battles of annihilation"); [[w.peng-zhen-nianpu-1902]], IV, 114 (Mar. 27, 1961, morning; the 242nd meeting; Peng Zhen: the Secretariat did much, but the root trouble no serious investigation; to find problems and go to the base, the two things that make a good assistant to the Chairman and the Standing Committee; each department to keep in touch with model points; the two egalitarianisms show the Chairman investigates more than we; "一阵风来了随着转"). The words: 上午9时到12时 (I, 667). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Deng Xiaoping.'
    src:
