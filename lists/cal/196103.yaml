    c: 'Kennedy rules against a public works bill in 1961: too slow against the recession, and an addition to the deficit while he asks for more defense money, which must serve instead. Goldberg for a fight even if lost: Frost had told Kennedy to be "more Irish than Harvard." Kennedy: "As President, I have to be both Harvard and Irish." He promises Goldberg and labor a more careful bill next year.'
