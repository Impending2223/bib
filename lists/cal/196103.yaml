  - id: cal.1961-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1961-03-06'
    thread: civil-rights-the-executive
    c: Executive order creates the President's Committee on Equal Employment Opportunity. Johnson chairs it. Contractors to take "affirmative action."
    n: '[Exec. Order No. 10,925](https://www.presidency.ucsb.edu/documents/executive-order-10925-establishing-the-presidents-committee-equal-employment-opportunity), [26 Fed. Reg. 1977](https://www.govinfo.gov/app/details/FR-1961-03-08) (K–J Adm. II.H.2). [[w.caro-passage-of-power]], 172–74, 262–64, on Johnson and Robert Kennedy in the committee; [[w.mann-walls-of-jericho]], 304–5 (the order, March; Johnson chairman); [[w.shesol-mutual-contempt]], 80 (the order; Johnson chairman, Robert Kennedy and Goldberg members); [[w.wofford-of-kennedys-and-kings]], 141 (Executive Order 10925, Johnson chairman; two committees combined; some 20 million workers of 60,000 contractors). [[w.sorensen-kennedy]], 474 (the committee; Johnson its chairman). Check: Shesol dates the order Mar. 7, from the copy in the Lee White Papers, JFK Library (80). To check: [[w.graham-civil-rights-era]]; [[w.brauer-john-f-kennedy-and]]. Names: Johnson.'
