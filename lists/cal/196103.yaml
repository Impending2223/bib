    c: 'The White House, 10:05 a.m.{1} The CIA presents the Trinidad plan.{2} Kennedy willing to go ahead, not with a plan so "spectacular"; he wants one where American help is less obvious.{3} NSAM 31: a new exile political organization;{4} a white paper; a démarche in the OAS for free elections in Cuba.{5}'
