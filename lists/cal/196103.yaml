  - id: cal.1961-03.laos-3
    when: Mar., after the 23rd
    date: 1961-03
    at: after 1961-03-23
    thread: laos
    c: 'Kennedy, privately, to his own men, by Reeves''s account, after his public warnings on Laos: he does not intend to honor obligations in Laos; the talk and the troop movements are a bluff. If the United States must make a stand in Southeast Asia, it will be across the border, in Vietnam.'
    n: '[[w.reeves-president-kennedy]], 75 ("two days later," of the public warning after Mar. 23, is the warning, not the remark). To check: James Reston, interview; Collier and Horowitz, *The Kennedys*, 274; Rust, *Kennedy in Vietnam*, 32–34 (cited by [[w.reeves-president-kennedy]], Source Notes, 75). See [[cal.1961-03-23.laos]]. Names: Kennedy. Check: the day and the month; Reeves gives no date, the remark told after the public warnings of Mar. 23 and two days later.'
    tags: [name:kennedy-john-f]
