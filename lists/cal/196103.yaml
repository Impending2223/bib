  - id: cal.1961-03-15.china-leadership-2
    when: Mar. 15–23
    date: '1961-03-15'
    place: canton
    thread: china-sixty-articles
    also: [china-mao]
    c: 'Guangzhou.{1} The Central Work Conference, Mao presiding: the regional bureaus'' and provinces'' secretaries.{2} It adopts the draft Working Regulations for the Rural People''s Communes (the "Sixty Articles"), the Center''s letter to all members on discussing them, and its letter on investigation.{3} The draft holds down the commune''s power, makes the brigade the main accounting unit, part of the ownership with the team, and restores the higher cooperatives'' rules.{4} Mao: the first time since the communes that the center sat down together on farming.{5} Liu Shaoqi presides on the 20th, 22nd and 23rd.{6} Deng Xiaoping, in speeches of the 19th and 23rd, makes a self-criticism for the Secretariat: investigation a basic, permanent method.{7} The conference in effect began Mar. 10: the Three South conference at Guangzhou under Mao, the Three North at Peking under Liu, Zhou Enlai, Chen Yun and Deng, the Three North going to Guangzhou Mar. 14.{8} Zhu De attends.{9} Zhou speaks on the 19th in the Central-South and North China group and on the 20th on grain and foreign trade; on the 22nd he revises the Center''s letter on the draft.{10} Peng Zhen attends.{11}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1961 (the entry for Mar. 15–23, with Deng Xiaoping''s report of it, Mar. 27 and 29). [[w.zhou-enlai-nianpu-1949]], II, 398–99, Mar. 15–23, 1961 (Zhou at the conference, with his speeches of Mar. 19, 20 and 22). [[w.macfarquhar-origins-of-the-cultural]], III, 43–48 (the Guangzhou conference; the Sixty Articles); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508 (Mar. 15–23, 1961; Liu attends the Central Work Conference at Guangzhou, which drafts the Rural People''s Commune Work Regulations (draft) and a "Letter on conscientiously carrying out investigation" to the bureaus and the provincial committees; Liu presides on the 20th, 22nd and 23rd); [[w.jianguo-yilai-mao-zedong]], XV, 516 (note 3: the draft Working Regulations for the Rural People''s Communes, the ''Sixty Articles'', adopted by the conference Mar. 22, 1961; note 2: Guangzhou, Mar. 15–23; the place and the regulations only); [[w.deng-xiaoping-nianpu-1904]], III, 1623 (Mar. 15–23, 1961; Deng attends; the draft Working Regulations (the Sixty Articles on agriculture), the Center''s letter to all comrades on discussing them, and its letter to the bureaus and provinces on investigation adopted; in his speeches of the 19th and the 23rd Deng makes a self-criticism for the Secretariat: investigation a basic, permanent method, "less sitting and talking, more rising and doing"; the draft then tried and discussed across the countryside); [[w.peng-zhen-nianpu-1902]], IV, 112 (Mar. 15–23, 1961; Peng Zhen attends; the draft "Regulations on the work of the rural people''s communes" (the "Sixty Articles") adopted, against communes too big, control too tight and the two egalitarianisms; the letter to the whole Party on the regulations and the letter on investigation); [[w.zhu-de-nianpu-xinbian]], III, 1800–1801 (Mar. 14–23, 1961; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 at Guangzhou 广州, which adopts the draft Working Regulations for the Rural People''s Communes 《农村人民公社工作条例（草案）》 (the "Sixty Articles on agriculture" 农业六十条) and the Center''s letter to the bureaus and committees on investigation and study; its note: the conference in effect began Mar. 10, at Guangzhou as the Three South conference 三南会议 under Mao Zedong 毛泽东 and at Peking 北京 as the Three North 三北会议 under Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Chen Yun 陈云 and Deng Xiaoping 邓小平, the Three North''s members going to Guangzhou on Mar. 14 and the two joined as the Guangzhou work conference); [[w.chen-yun-nianpu-xiuding]], III, 78–79 (Chen Yun at the Guangzhou conference, Mar. 15–23; the "Sixty Articles" draft and the letter on investigation adopted); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508; [[w.deng-xiaoping-nianpu-1904]], III, 1623; [[w.zhu-de-nianpu-xinbian]], III, 1800 n.1; [[w.zhu-de-nianpu-xinbian]], III, 1800; [[w.zhou-enlai-nianpu-1949]], II, 398–99; [[w.peng-zhen-nianpu-1902]], IV, 112. Made public: 1996. Check: who presides on the 20th: Zhou''s chronology has Zhou ([[w.zhou-enlai-nianpu-1949]], II, 399), Liu''s has Liu ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508). To check: the Working Regulations for the Rural People''s Communes (draft), Mar. 1961; [[w.zhongguo-gongchan-dang-liushi]], 483–84 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25a); [[w.xin-zhongguo-biannianshi-1949]], 185 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25b); [[w.zhongguo-gongchan-dang-lici]], xia, 148 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25c); [[w.bian-mao-zedong-he-tade]], 48 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 905 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25e); [[w.jin-1949-1989-niande-zhongguo]], 376 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25f); [[w.zhongguo-gongchan-dang-lishi]], 253 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.25g); [[w.zhonggong-dangshi-dashi-nianbia