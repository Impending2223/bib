    date: '1961-03-30'
    thread: cuba-bay-of-pigs
    c: Fulbright, flying to Palm Beach with Kennedy, gives him a memorandum against the invasion.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 180. [[w.schlesinger-thousand-days-1965]], 251. To check: [[w.woods-fulbright]]; [[w.wyden-bay-of-pigs]]; [[w.bay-of-pigs-invasion-playa-giron-chronology]]. See [[cal.1961-03-16.cuba]]. Names: Fulbright, Kennedy. Check: the memorandum (Kennedy Library) and its text; Schlesinger has it written Mar. 29 with Pat Holt of the committee''s staff and given to Kennedy the next day, Fulbright invited on the plane to Palm Beach.'
