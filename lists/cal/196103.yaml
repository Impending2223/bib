  - id: cal.1961-03-13.china-leadership
    when: Mar. 13
    date: '1961-03-13'
    time: 1961-03-13T00:00Z
    place: canton
    thread: china-sixty-articles
    also: [china-mao]
    c: 'Mao, 8 a.m., to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, by Tao Zhu: the two egalitarianisms, between teams in a brigade and between members in a team, "two extremely grave questions," to be studied in person; Deng and Peng to spend ten days in Miyun, Shunyi, Huairou: are they "still unclear"?{1}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. [[w.macfarquhar-origins-of-the-cultural]], III, 42–43 (Mao''s letter on the two egalitarianisms); [[w.jianguo-yilai-mao-zedong]], XV, 501–503 (Mar. 13, 1961; Mao''s letter of Mar. 13, 8 a.m., Guangzhou, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Peking conference, carried by Tao Zhu, who goes and returns the next day; Liao Luyan to go north in a few days; the conference of three days too short, five to seven needed; printed from the Center''s document (with the manuscript)); [[w.deng-xiaoping-nianpu-1904]], III, 1622 (Mar. 13, 1961; Mao''s letter to Liu, Zhou, Chen Yun, Deng, Peng Zhen and the Three North conference: the two egalitarianisms, between teams and within the team, "extremely grave"; Deng and Peng Zhen to spend ten days after the meeting at Miyun, Shunyi and Huairou, each level apart; "busy with routine", no typical inquiry in person; Tao Zhu to come to Peking (footnote 1: Tao, then first secretary of the Central-South Bureau and in Guangdong)); [[w.mao-zedong-zhuan]], V, ch. 67 n.26 (Mar. 13, early morning, the letter to Liu Shaoqi and the others: to study the two egalitarianisms, among teams of a brigade and among members of a team; Tao Zhu sent to the Peking meeting; Deng Xiaoping and Zhou Enlai propose joining the two meetings, Mao agrees, at Guangzhou, and Tao Zhu does not go). [[w.peng-zhen-nianpu-1902]], IV, 112 (Mar. 13, 1961; Peng Zhen receives Mao''s letter on the two egalitarianisms, between teams within a brigade and between persons within a team, "两个极端严重的大问题"; Deng and Peng to take some ten days after the meeting to investigate at Miyun, Shunyi, Huairou and elsewhere, level by level, not all together); [[w.chen-yun-nianpu-xiuding]], III, 78 (Mao''s letter on egalitarianism in the communes, routine and investigation, to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, moving them to Guangzhou); [[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216 (the letter printed in full, signed 8 a.m., Mar. 13, Guangzhou; the notes: the Peking meeting the conference of the North China, Northeast and Northwest bureaus and provinces that Liu Shaoqi and Zhou Enlai had called, the "Three North" conference; Mao at Guangzhou with the Central-South, Southwest and East China, the "Three South"; Tao Zhu sent that day to report). Made public: 1997 ([[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). Check: Made public: [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], vol. 2, and [[w.jin-1949-1989-niande-zhongguo]] (1989), cited here, may print or quote the letter before 1997; [[w.zhonggong-dangshi-jiaoxue-cankao]], 23 (1986), may print it, if it was an open printing. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 440–41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24a); [[w.zhonggong-dangshi-jiaoxue-cankao]], 23, 448 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24b); [[w.jin-1949-1989-niande-zhongguo]], 376 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24c); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 904–05 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 43 n.24d); Mao Zedong 毛泽东, letter to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the comrades at the Peking meeting, Mar. 13, 1961; in [[w.mao-zedong-wenji]], VIII, 250 (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.26). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Tao Zhu.'
