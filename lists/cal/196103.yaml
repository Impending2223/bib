        - 'via w.branch-parting-the-waters 404 n.3a: all'
        - 'via w.branch-parting-the-waters 404 n.3b: all'
    tags: [name:kennedy-robert-f, name:king-martin-luther-jr]
  - id: cal.1961-03-07.confirmations
    when: Mar. 7–8
    date: '1961-03-07'
    thread: confirmations
    also: [alabama]
    c: Meriwether, Alabama's finance director and Patterson's former campaign manager, to the Export-Import Bank's board. Banking and Currency approves, 5–4, after questions on segregation and the Klan. Javits's motion to recommit fails, [18–66](https://voteview.com/rollcall/RS0870002); confirmed Mar. 8, [67–18](https://voteview.com/rollcall/RS0870003).
    n: '[107 Cong. Rec., Senate, Mar. 7, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-7-1.pdf); [107 Cong. Rec., Senate, Mar. 8, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-8-1.pdf); [Executive Calendar, Mar. 8, 1961](https://www.senate.gov/legislative/LIS/executive_calendar/1961/03_08_1961.pdf). The Senate''s roll calls on nominations: Voteview; *Journal of the Executive Proceedings of the Senate*. To check: [[w.mackenzie-politics-of-presidential-appointments]]. Names: Javits, Patterson, Meriwether.'
    tags: [name:meriwether-charles-m, name:javits-jacob-k, name:patterson-john]
  - id: cal.1961-03-07.sit-ins
    when: Mar. 7
    date: '1961-03-07'
    thread: sit-ins
    also: [georgia]
    c: 'Atlanta. The Chamber of Commerce releases the settlement of the sit-ins and boycotts, which had closed more than seventy downtown stores for three months: the lunch counters to follow "the same patterns ... as are finally decided upon in the public school issues"; the ten Negro signers to end boycotts, picketing and sit-ins at once.'
    n: '[[w.branch-parting-the-waters]], 395–97. To check: Atlanta Daily World, Mar. 1, 1961, 1, 5 (cited by [[w.branch-parting-the-waters]], 395 n.4); New York Times, Mar. 8, 1961, 1 (cited by [[w.branch-parting-the-waters]], 395 n.7); Atlanta Daily World, Mar. 8, 1961, 1 (cited by [[w.branch-parting-the-waters]], 396 n.1). See [[cal.1960-10-19.king]]. Check: whether the Chamber''s statement was released the day of the meeting; Branch has it the day the terms were revealed.'
    src:
      c: d1cb8ce6
      rows:
        - 'w.branch-parting-the-waters 395–97: all'
        - 'via w.branch-parting-the-waters 395 n.4: A'
        - 'via w.branch-parting-the-waters 395 n.7: A'
        - 'via w.branch-parting-the-waters 396 n.1: A'
    tags: [state:ga, city:atlanta]
  - id: cal.1961-03-08.africa
    when: Mar. 8
    date: '1961-03-08'
    thread: africa
    also: [congo]
    c: 'Nkrumah at the White House. Mostly the Congo: the Belgians out, the Congo cut off from all outside influence but the UN. He turns aside Rusk''s attempt to raise the Volta dam.'
    n: 'Remarks of Welcome to President Nkrumah of Ghana at the Washington National Airport, [1961 Pub. Papers 160](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=218); Joint Statement Following Discussions With the President of Ghana, [1961 Pub. Papers 161](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=219) (Mar. 8, 1961). FRUS 1961–63, XXI, docs. [224](https://history.state.gov/historicaldocuments/frus1961-63v21/d224), [225](https://history.state.gov/historicaldocuments/frus1961-63v21/d225). [[w.ball-past-has-another-pattern]], 185 ("early March 1961"; Nkrumah''s good impression). To check: [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.thompson-ghanas-foreign-policy-1957]]; [[w.rakove-kennedy-johnson-and-the]]. Names: Nkrumah, Rusk.'
