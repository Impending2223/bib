    tags: [name:shriver-r-sargent, name:kennedy-john-f, name:wofford-harris]
    short: the executive order, Shriver director
  - id: cal.1961-03-01.africa
    when: Mar. 1
    date: '1961-03-01'
    thread: africa
    c: 'Williams, Assistant Secretary for African Affairs, on a tour of Africa, in Kenya: what the Africans want for themselves the United States wants for them; the press reports it "Africa for the Africans" (Check the date). Kennedy, asked at his news conference: "I do not know who else Africa should be for."'
    n: 'The President''s News Conference, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). [[w.sorensen-kennedy]], 538–39 (the slogan; Kennedy''s comment). To check: [[w.noer-soapy]]; [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.borstelmann-cold-war-and-the]]. Names: Williams.'
    src:
      c: c5300b9f
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193: all'
        - 'w.sorensen-kennedy 538–39: B, C'
    tags: [name:williams-g-mennen, name:kennedy-john-f]
    short: Williams's "Africa for the Africans"
  - id: cal.1961-03-01.vietnam
    when: Mar. 1
    date: '1961-03-01'
    time: 1961-03-02T01:50Z
    thread: vietnam
    c: 'State to Saigon, telegram 1115: "White House ranks defense Viet-Nam among highest priorities US foreign policy." The Counterinsurgency Plan approved; the President asks what can be done at once, without awaiting the GVN''s approval: officers best qualified in counterguerrilla training to the MAAG; British and Malayan officers sought.'
    n: '[FRUS 1961–63, I, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v01/d16). [[w.reeves-president-kennedy]], 69. See [[cal.1961-01-28.vietnam]]. Names: Kennedy.'
    src:
      c: b2214b13
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d16: all'
        - 'w.reeves-president-kennedy 69: all'
        - 'via w.reeves-president-kennedy 69 n.white-house-ranks-defense-viet-nam: all'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-01.school-aid
    when: Mar. 1
    date: '1961-03-01'
    thread: school-aid
    c: 'The bishops, the National Catholic Welfare Conference, against any federal aid "which excludes children in private schools." Archbishop Alter for them: long-term, low-interest loans to private schools "strictly within the framework of the Constitution"; an amendment to that effect proposed.'
    n: '[[w.sundquist-politics-and-policy]], 189. See [[cal.1961-02-20.school-aid]].'
    src:
      c: 1c3f6ebc
      rows:
        - 'w.sundquist-politics-and-policy 189: all'
  - id: cal.1961-03-01.peace-corps-2
    when: Mar. 1
    date: '1961-03-01'
    thread: peace-corps
    c: 'Special message: a permanent Peace Corps by law. "Although this is an American Peace Corps, the problem of world development is not just an American problem."'
    n: 'Special Message to the Congress on the Peace Corps, [1961 Pub. Papers 143](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=201) (Mar. 1, 1961). [[w.wofford-of-kennedys-and-kings]], 261–62. See [[cal.1961-03-01.peace-corps]]. Names: Kennedy.'
    src:
      c: 3abea924
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=201: all'
        - 'w.wofford-of-kennedys-and-kings 261–62: all'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-01.school-aid-2
    when: Mar. 1
    date: '1961-03-01'
    thread: school-aid
    c: 'News conference. No aid to private and parochial schools: "the Constitution clearly prohibits aid to the school, to parochial schools"; *Everson*, 5 to 4, aid to the child. The college program different: "We are aiding the student in the same way the GI bill of rights aided the student."'
    n: 'The President''s News Conference of March 1, 1961, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). [[w.graham-uncertain-triumph]], 19–20. Check: Graham, 234 n.54, cites the Papers at 154–55, the conference of Mar. 8. Names: Kennedy.'
    src:
      c: 2e4ab8c7
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193: all'
        - 'w.graham-uncertain-triumph 19–20: all'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-02.testing
    when: Mar. 2
    date: '1961-03-02'
    thread: testing
    c: 'The Fisk panel reports to McCloy: both countries could keep "very strong" deterrents without further tests. Senior officials settle every question but the number of on-site inspections.'
    n: '[[w.poole-joint-chiefs-of-staff]], 94. Check: Poole has the report not distributed until Mar. 3. Names: McCloy.'
    src:
      c: 81ee6603
      rows:
        - 'w.poole-joint-chiefs-of-staff 94: all'
    tags: [name:mccloy-john-j]
  - id: cal.1961-03-02.defense
    when: Mar. 2
    date: '1961-03-02'
    thread: defense
    c: The Joint Chiefs' plan for a "Military Intelligence Agency," the NSA in it, a military intelligence board, the Chiefs in operational control. It never materializes.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 22. To check: JCS 2031/159, Mar. 2, 1961, OSD Hist (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 22 n.23). See [[cal.1961-02-08.defense-2]].'
    src:
