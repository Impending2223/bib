  - id: cal.1961-03-03.vietnam
    when: Mar. 3
    date: '1961-03-03'
    thread: vietnam
    also: [defense]
    c: 'McGarr to Palmer, Director of Military Assistance, enclosing his letter to Heinz: State''s message 1115 of Mar. 1 "counter productive," against the approved Counter-Insurgency Plan; "neither MAAG or the Ambassador can direct the GVN to follow our recommendations—we can only work through persuasion and advice"; aid withheld for noncompliance would weaken the government''s effort.'
    n: 'Letter From the Chief of the Military Assistance Advisory Group in Vietnam (McGarr) to the Director of Military Assistance, Office of the Assistant Secretary of Defense (Palmer), [FRUS 1961–63, I: Vietnam, 1961, doc. 17](https://history.state.gov/historicaldocuments/frus1961-63v01/d17) (Mar. 3, 1961). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 265. See [[cal.1961-02-27.vietnam]]. Names: McGarr.'
