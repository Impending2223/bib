  - id: cal.1961-03.china-leadership-21
    when: Mar.
    date: 1961-03
    place: anshun
    thread: china-famine
    c: Wang Minsan 王民三, head of the Guizhou 貴州 provincial grain department 糧食廳, goes to Anshun 安順 for Vice-Governor Xu Jiansheng 徐健生, who meant to draw grain from it. Sun Hanzhang 孫漢章, secretary of the Anshun prefectural committee 地委, tells him the prefecture has lost over 10,000 dead and has no grain to send up; he gives Caiguan 蔡官 commune, 2,600 dead and over 2,000 swollen, and the Layan 拉岩 team of Jiuzhou 舊州 commune, 32 households, 122 dead, six households wiped out.
    n: '[[w.yang-jisheng-mubei]], I, 566. Made public: 2008. Check: the day.'
