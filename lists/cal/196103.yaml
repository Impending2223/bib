    tags: [name:kozlov-frol-r, name:suslov-mikhail-a, name:castro-raul]
  - id: cal.1961-03-03.cuba-2
    when: Mar. 3
    date: '1961-03-03'
    thread: cuba
    also: [defense, immigration]
    c: 'The former Army, Navy and Air Force attachés in Cuba to Hartel of ISA, from Miami: 60,000 Cubans in Florida, more each day, nearly all willing to help overthrow Castro; seventeen agencies dealing with the refugees, no agreed procedure for intelligence; a central coordinating board recommended.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 182. To check: US Army, Navy and Air Force attachés to Cuba for Hartel, Director, Western Hemisphere Affairs (ISA), Mar. 3, 1961, fldr Cuba 1961, box 31, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 182 n.36). Names: Castro.'
