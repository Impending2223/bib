  - id: cal.1961-03-11.latin-america
    when: Mar. 11
    date: '1961-03-11'
    place: washington
    thread: latin-america
    c: 'The Oval Office. Goodwin brings Kennedy the draft of the Alliance for Progress address, which he must give "in two days." Kennedy reads it for a couple of hours, making editorial revisions: "Good job, Dick." Of the Spanish phrases: "But do I really have to say these words?" Goodwin: the whole idea is a partnership, and some Spanish words will be taken as a sign of respect. Kennedy: "Do you know any Spanish?" "Not much." "Well I don''t know any." "It would be nice if they could understand what I was saying. ... Maybe I''ll get Jackie to help me."'
    n: '[[w.goodwin-remembering-america]], 155–56 (Goodwin''s account; Goodwin had worked on the draft at home "a few days"). Names: Kennedy, Goodwin. Check: the day; "I''ve got to give it in two days" (155), the address Mar. 13.'
    tags: [name:kennedy-john-f, name:goodwin-richard-n]
