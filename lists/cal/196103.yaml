    c: 'Guangzhou 广州, Jijingkeng 鸡颈坑. Mao 毛泽东 with Wang Renzhong 王任重 of Hubei 湖北: private plots, repayment and command are three weighty questions; whether the private plots have been handed down; attending the mess hall must be by choice, and the system itself is settled. A commune regulation is wanted, since the twelve articles do not say what each level handles. How to stop blind commanding? Wang: it comes chiefly from commune and county, from province and prefecture above.'
