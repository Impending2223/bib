  - id: cal.1961-03-24.latin-america-dominican-republic
    when: Mar. 24
    date: '1961-03-24'
    thread: latin-america-dominican-republic
    c: 'CIA headquarters to the station: the timing for an assassination is wrong; "mere disposal of Trujillo may create more problems than solutions." Avoid "precipitous action by the internal dissidents until opposition group and HQS are better prepared"; machine guns will be delivered once the dissidents can receive them. The same cable: the pistols and ammunition are being pouched; Dearborn is not to be told.'
    n: '[[w.sen-church-alleged-assassination-plots]], 199–202 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Mar. 24, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 201). See [[cal.1961-03-21.latin-america-dominican-republic]]. Names: Trujillo.'
    tags: [name:trujillo-rafael]
  - id: cal.1961-03-24.jobs-and-wages
    when: Mar. 24
    date: '1961-03-24'
    place: washington
    thread: jobs-and-wages
    c: 'Rayburn''s office. Goldberg and O''Brien with Vinson, McCormack, Albert and Powell on the minimum wage bill, short of votes. Vinson would go to $1.15 for Southern votes. Rayburn: "I feel this is a decision the Administration has to make." Goldberg, nodding to O''Brien: "This really is a White House decision." O''Brien holds to $1.25 and cuts the coverage, about half a million of the four million workers, the laundry workers among them; Albert, pressed, agrees to lead the floor debate. By O''Brien''s account.'
    n: '[[w.obrien-no-final-victories]], 124–25. Check: the day: the work dates the meeting Mar. 24 and has Albert''s speech "the next day" and the vote "that day," but the House voted on Mar. 24. Names: Rayburn, Goldberg, Vinson, McCormack, Albert, Powell, O''Brien.'
    tags: [name:rayburn-sam, name:goldberg-arthur-j, name:vinson-carl, name:mccormack-john-w, name:albert-carl, name:powell-adam-clayton-jr, name:obrien-lawrence-f]
