  - id: cal.1961-03-21.china-leadership-12
    when: Mar. 21
    date: '1961-03-21'
    place: canton
    thread: china-sixty-articles
    c: 'Guangzhou 广州. Chen Yun 陈云 speaks to the Southwest and Northwest groups 西南组、西北组 of the work conference: in January he feared quotas and told Li Xiannian 李先念 grain could not be contracted; after Yao Yilin''s 姚依林 meetings, with the local committees and the peasants asking for it, he now favors contracting, since fixing output by household rouses zeal, and favors deciding now; grain will be tight two years, in places three; four ways out: tighter supply, townspeople to the villages, imports, more output; to cut the towns by 12 million in three years would save about 5 billion jin, as much as 2.5 million tons imported; grain to be imported this year and next, for reserves too, though none can be kept now; more output through policy and measures in the key areas, the counties that supply marketable grain being few; the small and middle fertilizer works unproven, so back to the big.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 79–80. Made public: 2015. Names: Chen Yun, Li Xiannian, Yao Yilin.'
    tags: [polity:prc, name:chen-yun, name:li-xiannian, vis:only:prc, name:yao-yilin]
