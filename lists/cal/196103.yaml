    c: 'Zhou Enlai receives the socialist countries'' envoys in Peking and describes China''s state.{1} To overcome the famine: rely first on the Chinese people; cut rations, low standards, vegetables and melons for grain, substitute foods; thrift and more output to keep industry; keep to the masses and the hard, plain style of the war years. Last year''s trade debts with the brother countries to be repaid later and this year''s imports and exports cut, so they bear China''s farm difficulty, which makes China uneasy.{2}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 396 (Mar. 8, 1961); [[w.zhou-enlai-waijiao-huodong]], 305 (Mar. 8, 1961; 下午3时, 人民大会堂); [[w.westad-introduction]], 27 (in March Zhou Enlai describes the desperate state of the countryside in detail to the East European and Soviet ambassadors; 27 n.92 dates the talk Mar. 8, 1961). Made public: 1993. To check: Zhou Enlai''s talk to the ambassadors from socialist countries, Mar. 8, 1961, AVPRF, f. 0100, op. 54, pa. 466, d. 7, pp. 77–91 (cited by [[w.westad-introduction]], 27 n.92). Names: Zhou Enlai.'
