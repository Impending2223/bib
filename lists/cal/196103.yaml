  - id: cal.1961-03-10.latin-america
    when: Mar. 10
    date: '1961-03-10'
    thread: latin-america
    c: 'Schlesinger reports to Kennedy on his mission with McGovern, Feb. 12–Mar. 3: Argentina, Brazil, Bolivia, Peru, Venezuela. Latin America bound to modernize; a middle-class revolution or a "workers-and-peasants" one; the landed oligarchy the barrier to the first.'
    n: '[FRUS 1961–63, XII, doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v12/d7). Made public: FRUS 1961–63, XII. [[w.schlesinger-thousand-days-1965]], 175–86 (the mission). The Alliance proposed: [[cal.1961-03-13.latin-america]]. Names: Schlesinger, McGovern, Kennedy.'
