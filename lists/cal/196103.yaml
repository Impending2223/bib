  - id: cal.1961-03-09.laos
    when: Mar. 9
    date: '1961-03-09'
    thread: laos
    c: 'The White House, 3:30 to 4:44 p.m. Kennedy with Johnson, McNamara, Lemnitzer, Felt, Nitze, Dulles, Bissell, Bundy, Rostow and others on the Chiefs'' plan of action on the Plain of Jars: to split the guerrillas, cut the Pathet Lao from North Vietnam''s support, and destroy them. The Laos task force proposes more military aid to the Royal Laotian Army.'
    n: '[FRUS 1961–63, XXIV, doc. 25](https://history.state.gov/historicaldocuments/frus1961-63v24/d25) (Clifton''s memorandum of the conference); [FRUS 1961–63, XXIV, doc. 26](https://history.state.gov/historicaldocuments/frus1961-63v24/d26) (a memorandum of the meeting, not declassified). [[w.schlesinger-thousand-days-1965]], 331 (the task force''s proposal); [[w.bissell-reflections-of-a-cold]], 147 (the meeting, Bissell present: Lemnitzer on the Chiefs'' plan for the Plaine des Jarres; more aid to Phoumi). [[w.sorensen-kennedy]], 643 (the meeting). Made public: FRUS 1961–63, XXIV. See [[cal.1961-01-19.laos]]. Names: Kennedy, Johnson, McNamara, Lemnitzer, Felt, Nitze, Dulles, Bissell, Bundy, Rostow.'
    src:
      c: 1e81874c
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d25: A-B'
        - 'w.schlesinger-thousand-days-1965 331: C'
        - 'w.sorensen-kennedy 643: A-B'
        - 'w.bissell-reflections-of-a-cold 147: B-C'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:mcnamara-robert-s, name:lemnitzer-lyman-l, name:felt-harry-d, name:nitze-paul, name:dulles-allen-w, name:bissell-richard-m-jr, name:bundy-mcgeorge, name:rostow-walt-w]
  - id: cal.1961-03-09.soviet-union
    when: Mar. 9
    date: '1961-03-09'
    thread: soviet-union
    also: [berlin-and-vienna]
    c: 'Novosibirsk. Thompson, having traveled two thousand miles into Siberia, hands Khrushchev Kennedy''s letter: time for a meeting, late May, in a neutral European capital.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 347; [[w.dobrynin-in-confidence]], 44 (Thompson hands Khrushchev the confidential message proposing a summit, Mar. 9; by Dobrynin''s account). To check: Thompson to Rusk, Apr. 1, 1961, RG 59, 611.61, NARA (cited by [[w.fursenko-khrushchevs-cold-war]], 347 n.44). See [[cal.1961-04-01.soviet-union]]. Names: Thompson, Khrushchev, Kennedy.'
