    thread: testing
    c: 'Dean from Geneva, Supnu 1428: why the Soviets, before hearing any American proposal, demanded a tripartite administrator, an absolute veto on the control system. Four guesses: a known impossible condition, to put the break on Washington; delay, or concessions on inspections and staffing; an occasion to end the talks; no single administrator as a precedent for general disarmament. Tsarapkin noncommittal, friendly.'
