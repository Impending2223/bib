entries:
  - id: cal.1961-03.right-and-the-military
    when: Mar.
    date: 1961-03
    thread: right-and-the-military
    c: 'The John Birch Society reaches the national press: the *Los Angeles Times* series and the newsmagazines. Check the dates.'
    n: 'To check: [[w.hendershot-whats-fair-on-the]] (for the broadcasters); [[w.dallek-birchers]]; [[w.mulloy-world-of-the-john]]; [[w.schoenwald-time-for-choosing]].'
  - id: cal.1961-03-01.peace-corps
    when: Mar. 1
    date: '1961-03-01'
    thread: peace-corps
    c: Executive order creates the Peace Corps on a trial basis. Shriver named director.
    n: '[Exec. Order No. 10,924](https://www.presidency.ucsb.edu/documents/executive-order-10924-establishment-and-administration-the-peace-corps-the-department), [26 Fed. Reg. 1789](https://www.govinfo.gov/app/details/FR-1961-03-02) (K–J Adm. II.H.2). To check: [[w.hoffman-all-you-need-is]]; [[w.stossel-sarge]]; [[w.wofford-of-kennedys-and-kings]]; [[w.rice-bold-experiment]]. Names: Shriver, Wofford.'
    tags: [name:shriver-r-sargent, name:kennedy-john-f, name:wofford-harris]
  - id: cal.1961-03-01.africa
    when: Mar. 1
    date: '1961-03-01'
    thread: africa
    c: 'Williams, Assistant Secretary for African Affairs, on a tour of Africa, in Kenya: what the Africans want for themselves the United States wants for them; the press reports it "Africa for the Africans" (Check the date). Kennedy, asked at his news conference: "I do not know who else Africa should be for."'
    n: 'The President''s News Conference, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). To check: [[w.noer-soapy]]; [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.borstelmann-cold-war-and-the]]. Names: Williams.'
    tags: [name:williams-g-mennen, name:kennedy-john-f]
  - id: cal.1961-03-01.vietnam
    when: Mar. 1
    date: '1961-03-01'
    thread: vietnam
    c: 'State to Saigon, telegram 1115: "White House ranks defense Viet-Nam among highest priorities US foreign policy." The Counterinsurgency Plan approved; the President asks what can be done at once, without awaiting the GVN''s approval: officers best qualified in counterguerrilla training to the MAAG; British and Malayan officers sought.'
    n: '[FRUS 1961–63, I, doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v01/d16). [[w.reeves-president-kennedy]], 69. See [[cal.1961-01-28.vietnam]]. Names: Kennedy.'
    src:
      c: b2214b13
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d16: all'
        - 'w.reeves-president-kennedy 69: all'
        - 'via w.reeves-president-kennedy 69 n.white-house-ranks-defense-viet-nam: all'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-03.conservative-movement
    when: Mar. 3
    date: '1961-03-03'
    thread: conservative-movement
    also: [goldwater]
    c: 'New York, the Manhattan Center. Young Americans for Freedom''s first rally: over three thousand inside, as many turned away, 150 pickets for abolishing the House Un-American Activities Committee. Goldwater speaks.'
    n: '[[w.perlstein-before-the-storm]], 109. To check: Conley, "3,200 at Rally Here Acclaim Goldwater," *New York Times*, Mar. 3, 1961 (cited by [[w.perlstein-before-the-storm]], 109 n.1). Check: the date; the *Times*''s report bears Mar. 3. Names: Goldwater.'
    src:
      c: 53bbf176
      rows:
        - 'w.perlstein-before-the-storm 109: all'
        - 'via w.perlstein-before-the-storm 109 n.1: all'
    tags: [name:goldwater-barry-m, city:nyc]
  - id: cal.1961-03-03.robert-kennedy
    when: Mar. 3
    date: '1961-03-03'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Sokolsky''s column: the *Insider''s Newsletter* has Hoover out by summer; he will not resign, but might be dismissed. Kennedy "an astute man"; to dismiss Hoover "would start such a fracas as no one needs."'
    n: '[[w.navasky-kennedy-justice]], 41. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover, Robert Kennedy.'
    src:
      c: 356cd264
      rows:
        - 'w.navasky-kennedy-justice 41: all'
    tags: [name:hoover-j-edgar, name:kennedy-robert-f]
  - id: cal.1961-03-04.economy
    when: Mar. 4–6
    date: '1961-03-04'
    thread: economy
    c: 'Bonn revalues the mark 4.75 percent: announced Saturday the 4th, effective Monday, 4.00 marks to the dollar instead of 4.20. The Netherlands follows. The central banks'' Basel arrangements to support sterling follow within the month.'
    n: '[FRUS 1961–63, XIV, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v14/d9) (Mar. 10, 1961). Federal Reserve Board, H.13 releases on FRASER (K–J Adm. II.J). [[w.gavin-gold-dollars-and-power]], 66 (the revaluation, among the German measures Washington pressed for). To check: [[w.bundesbank-monatsbericht]] (März 1961); [[w.emminger-d-mark-dollar-wahrungskrisen]]; [[w.doru-kiki-to-1961]]; [[w.coombs-arena-of-international-finance]] (K–J Adm. II.B). Check: Gavin, 66, gives 5 percent, the mark''s rise from 4.20 to 4.00 to the dollar; 4.75 is the dollar''s fall in marks. Names: Adenauer.'
    src:
      c: 85e304fc
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d9: all'
        - 'w.gavin-gold-dollars-and-power 66: A'
        - 'via w.gavin-gold-dollars-and-power 66 n.23: A'
    tags: [name:adenauer-konrad]
  - id: cal.1961-03-04.robert-kennedy
    when: Mar. 4
    date: '1961-03-04'
    thread: robert-kennedy
    also: [crime-and-hijacking]
    c: 'Robert Kennedy calls Hank Suydam of *Life*''s Washington office to the Justice Department: Sam Baron, a Teamsters official who has informed him in secret for two years, is ready to break with Hoffa in public, in *Life*. By Suydam''s memorandum to Thompson, the managing editor, Mar. 6.'
    n: '[[w.navasky-kennedy-justice]], 427–29 (Suydam''s memorandum, Mar. 6, "Last Saturday"; Kennedy''s account to Edward Long''s committee, that the story was to run only if Baron was killed). Names: Robert Kennedy, Hoffa. Check: the day (the memorandum''s "Last Saturday"); the day of Kennedy''s testimony to Long''s committee.'
    src:
      c: 673e02df
      rows:
        - 'w.navasky-kennedy-justice 427–29: all'
    tags: [name:kennedy-robert-f, name:hoffa-james-r]
  - id: cal.1961-03-04.robert-kennedy-2
    when: Mar. 4
    date: '1961-03-04'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Lyle Wilson of UPI: Hoover not about to retire; the reports of a rift untrue. "Ask for the source, ask for proof." The FBI and its boss at Justice "on the same basis of friendly informality as in other years."'
    n: '[[w.navasky-kennedy-justice]], 41–42. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover.'
    src:
      c: a553fb6b
      rows:
        - 'w.navasky-kennedy-justice 41–42: all'
    tags: [name:hoover-j-edgar]
  - id: cal.1961-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1961-03-06'
    thread: civil-rights-the-executive
    c: Executive order creates the President's Committee on Equal Employment Opportunity. Johnson chairs it. Contractors to take "affirmative action."
    n: '[Exec. Order No. 10,925](https://www.presidency.ucsb.edu/documents/executive-order-10925-establishing-the-presidents-committee-equal-employment-opportunity), [26 Fed. Reg. 1977](https://www.govinfo.gov/app/details/FR-1961-03-08) (K–J Adm. II.H.2). [[w.caro-passage-of-power]], 172–74, 262–64, on Johnson and Robert Kennedy in the committee; [[w.mann-walls-of-jericho]], 304–5 (the order, March; Johnson chairman); [[w.shesol-mutual-contempt]], 80 (the order; Johnson chairman, Robert Kennedy and Goldberg members). [[w.sorensen-kennedy]], 474 (the committee; Johnson its chairman). Check: Shesol dates the order Mar. 7, from the copy in the Lee White Papers, JFK Library (80). To check: [[w.graham-civil-rights-era]]; [[w.brauer-john-f-kennedy-and]]. Names: Johnson.'
    src:
      c: 1aa44c53
      rows:
        - 'https://www.presidency.ucsb.edu/documents/executive-order-10925-establishing-the-presidents-committee-equal-employment-opportunity: all'
        - 'w.caro-passage-of-power 172–74: A-B'
        - 'w.sorensen-kennedy 474: A-B'
        - 'w.mann-walls-of-jericho 304–5: A-B'
        - 'via w.mann-walls-of-jericho 304 n.the-president-issued-an-executive-order: A-B'
        - 'w.shesol-mutual-contempt 80: A-B'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1961-03-06.economy
    when: Mar. 6
    date: '1961-03-06'
    thread: economy
    c: 'Heller before the Joint Economic Committee: a gap between actual and potential output, and 4 percent unemployment as the goal. Next day Martin tells the committee much of the unemployment is structural. Patman presses Martin by letter, Mar. 30.'
    n: '[[w.heller-american-economy-in-1961]], [on FRASER](https://fraser.stlouisfed.org/title/9814/item/717990) (K–J Adm. II.K). Hearings and the committee''s report (K–J Cong. II.J.3). [[w.stein-fiscal-revolution-in-america]], 388–89, 396–98 (Heller''s testimony); [[w.sundquist-politics-and-policy]], 57–58 (Martin the next day). To check: [[w.okun-potential-gnp-its-measurement]] (for the arithmetic); Joint Economic Committee, *January 1961 Economic Report of the President and the Economic Situation and Outlook: Hearings*, 87th Cong., 1st sess. (1961), 321–29, 331, 364–65 (cited by [[w.stein-fiscal-revolution-in-america]], 389 n.8, 396 n.18, 398 n.24, for Heller). Names: Heller, Martin, Patman.'
    src:
      c: c615f70f
      rows:
        - 'https://fraser.stlouisfed.org/title/9814/item/717990: all'
        - 'w.stein-fiscal-revolution-in-america 389: A'
        - 'w.stein-fiscal-revolution-in-america 396–98: A'
        - 'via w.stein-fiscal-revolution-in-america 389 n.8: A'
        - 'via w.stein-fiscal-revolution-in-america 396 n.18: A'
        - 'via w.stein-fiscal-revolution-in-america 398 n.24: A'
        - 'w.sundquist-politics-and-policy 57–58: B'
    tags: [name:heller-walter-w, name:martin-william-mcchesney-jr, name:patman-wright]
  - id: cal.1961-03-06.space
    when: Mar. 6
    date: '1961-03-06'
    thread: space
    also: [defense]
    c: 'McNamara''s Directive 5160.32: research, development, test and engineering of the Pentagon''s space programs approved from now on to the Air Force. Each service may do preliminary research; proposals beyond it go to the Director of Defense Research and Engineering, and need the approval of the Secretary or his deputy.'
    n: '[DoD Directive 5160.32 (Mar. 6, 1961)](https://archive.org/details/DTIC_ADA075397/page/n355/mode/1up); [[w.cole-department-of-defense-documents]], 325–26. [[w.kaplan-mcnamara-ascendancy-1961-1965]], 44. Names: McNamara.'
    src:
      c: 86d92000
      rows:
        - 'https://archive.org/details/DTIC_ADA075397/page/n355/mode/1up: all'
        - 'w.cole-department-of-defense-documents 325–26: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 44: all'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 44 n.104: all'
    tags: [name:mcnamara-robert-s]
  - id: cal.1961-03-06.civil-rights-the-executive-2
    when: Mar. 6
    date: '1961-03-06'
    thread: civil-rights-the-executive
    also: [robert-kennedy]
    c: Robert Kennedy's office, the first large meeting with civil rights leaders, King not asked. They suggest a roving federal prosecutor for the South; Kennedy stresses voting.
    n: '[[w.branch-parting-the-waters]], 404. To check: Edwin Guthman, notes of the "meeting with civil rights leaders," Mar. 6, 1961 (reviewed by Branch), papers of Edwin Guthman (cited by [[w.branch-parting-the-waters]], 404 n.3). Names: Robert Kennedy, Martin Luther King.'
