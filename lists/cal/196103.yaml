  - id: cal.1961-03-07.civil-rights-the-executive
    when: Mar. 7
    date: '1961-03-07'
    time: 1961-03-07T19:30Z
    thread: civil-rights-the-executive
    c: '2:30 p.m. Robert Kennedy telephones Goodwin, angry: "Too many people are getting involved in this thing" (civil rights). "We have to decide whether we are going to have an administration position and what it''s going to be." Goodwin takes it that the Attorney General will soon take full command.'
    n: '[[w.goodwin-remembering-america]], 153 (Goodwin''s account). Names: Robert Kennedy, Goodwin. Check: the day; Goodwin ties the call to the freedom riders'' "bloody trip to the heart of the South," which began in May 1961.'
