  - id: cal.1961-03-13.china-leadership-3
    when: Mar. 13
    date: '1961-03-13'
    thread: china-zhou-foreign
    also: [indonesia, china-foreign]
    c: 'Zhou Enlai receives Indonesia''s Ambassador, Sukarni.{1} China''s entry to the United Nations is joined to the Taiwan question, two sides of one problem; America''s seating the Taiwan authorities there for China is laughable; as long as Taiwan''s delegate stays China cannot enter.{2} To Sukarni''s "1961 will be the year of the People''s Republic": China is a new state, still backward; building it needs a long time.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 398 (Mar. 13, 1961); [[w.zhou-enlai-waijiao-huodong]], 305 (Mar. 13, 1961); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 188 (Mar. 13, 1961; Zhou receives Sukarni (苏卡尼), the Indonesian ambassador; on China''s entry into the U.N., the trend in the Assembly is clear; the United States, which recognizes only Chiang''s "Republic of China," finds a vote harder and so tries "two Chinas," a seat on the Security Council for China and Taiwan as a separate state or as another China; China opposes every form). Made public: 1993. Names: Zhou Enlai, Sukarni.'
