    time_zone: America/New_York
  - id: cal.1961-03-01.vietnam-hanoi
    when: Mar. 1
    date: '1961-03-01'
    place: hanoi
    thread: vietnam-hanoi
    c: 'The Secretariat, Hanoi: directive no. 13-CT/TW on the struggle against counterrevolution and for public order in 1961, after directive no. 186 and the third plenum, which made the people''s democratic state, vigilance, order and defense one of the 1961 plan''s seven tasks.'
    n: '*Chỉ thị của Ban Bí thư số 13-CT/TW về tăng cường công tác đấu tranh chống phản cách mạng, giữ gìn trật tự an ninh*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXII, 234–41. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1961-03-01.china-leadership
    when: Mar. 1
    date: '1961-03-01'
    thread: china-mao
    c: 'Mao initials Zhou Enlai''s letter: grain short by over 4.4 billion jin in the first half-year and 3 billion in the third quarter;{1} 10 billion jin to be imported this year, 5.24 billion under contract, 5 billion in negotiation.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 1, 1961. [[w.zhou-enlai-nianpu-1949]], II, 394, Mar. 1, 1961 (Zhou''s letter to Mao on grain imports, by the reckoning to Feb. 22). Made public: 1997. Names: Mao Zedong, Zhou Enlai.'
    src:
      c: 3aa0e71f
      rows:
        - 'w.zedong-mao-zedong-nianpu IV, Mar. 1, 1961: 1, 2'
        - 'w.zhou-enlai-nianpu-1949 II, 394, Mar. 1, 1961: 1, 2'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
    variants:
