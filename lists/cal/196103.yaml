  - id: cal.1961-03.right-and-the-military
    when: Mar.
    date: 1961-03
    thread: right-and-the-military
    c: 'The John Birch Society reaches the national press: the *Los Angeles Times* series and the newsmagazines. Check the dates.'
    n: '[[w.goldberg-barry-goldwater]], 158 (*Time*''s "Mein Kampf," "a goose step away from the formation of goon squads"; the *Los Angeles Times*: "a peril to conservatives"; the *New York Times Magazine*, *Life*, *Newsweek*, *Look* and the *Saturday Evening Post*). Check: Goldberg''s notes date *Time*''s "The Americanists" Mar. 10, 1961, 22; the *Los Angeles Times* Mar. 12, 1961; *Time*''s "Storm Over Birchers" Apr. 7, 1961, 18; *Life* May 12, 1961; the *New York Times Magazine* May 14, 1961 (158 n.45–48). To check: [[w.hendershot-whats-fair-on-the]] (for the broadcasters); [[w.dallek-birchers]]; [[w.mulloy-world-of-the-john]]; [[w.schoenwald-time-for-choosing]].'
    src:
      c: a99c8718
      rows:
        - 'w.goldberg-barry-goldwater 158: A'
        - 'via w.goldberg-barry-goldwater 158 n.45: A'
        - 'via w.goldberg-barry-goldwater 158 n.46: A'
        - 'via w.goldberg-barry-goldwater 158 n.48: A'
    short: the Birch Society in the national press
  - id: cal.1961-03-01.peace-corps
    when: Mar. 1
    date: '1961-03-01'
    thread: peace-corps
    c: Executive order creates the Peace Corps on a trial basis. Shriver named director.
    n: '[Exec. Order No. 10,924](https://www.presidency.ucsb.edu/documents/executive-order-10924-establishment-and-administration-the-peace-corps-the-department), [26 Fed. Reg. 1789](https://www.govinfo.gov/app/details/FR-1961-03-02) (K–J Adm. II.H.2). [[w.wofford-of-kennedys-and-kings]], 261. To check: [[w.hoffman-all-you-need-is]]; [[w.stossel-sarge]]; [[w.rice-bold-experiment]]. Names: Shriver, Wofford.'
    src:
      c: 23e6ac00
      rows:
