    thread: latin-america
    c: 10:30 a.m. Schlesinger and Rostow with Goodwin in his office, on a special economic mission to Bolivia. With Kennedy's direction behind them, they decide the emissaries are to ignore the International Monetary Fund's and the State Department's proposals for anti-inflationary austerity and offer immediate economic assistance.
    n: '[[w.goodwin-remembering-america]], 152–53 (Goodwin''s account). See [[cal.1961-03-04.latin-america]]. Names: Schlesinger, Rostow, Goodwin, Kennedy.'
