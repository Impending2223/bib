    c: 'Guangzhou.{1} The enlarged Standing Committee, Mao presiding;{2} Zhou Enlai on industry and supply.{3} Mao on the communes since the second Zhengzhou meeting: before Lushan the facts known, after it the fight on the right silenced the truth (Henan''s 24 billion jin reported as over 40) and brought high estimates, high procurement; the fight on the left, four months, cut off by Peng Dehuai; Anhui, Shandong, Henan, Gansu too late to care for the people''s food.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 5, 1961. [[w.zhou-enlai-nianpu-1949]], II, 396, Mar. 5, 1961 (Zhou on industry and supply). [[w.deng-xiaoping-nianpu-1904]], III, 1619–1620 (Mar. 5, 1961; evening; Deng at Mao''s enlarged Standing Committee: regulations for the communes to be drafted, communes and accounting units smaller; meetings at Guangzhou for the three southern bureaus and at Peking for the three northern); [[w.mao-zedong-zhuan]], V, ch. 67 n.23 (Mar. 5, in Building 3 of the Guangdong committee: the enlarged Standing Committee with Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Hu Qiaomu and Tao Zhu; Zhou on industry and supply, Mao on the commune system and the fight on the right and the left since Lushan). [[w.yang-jisheng-mubei]], II, 788 n.37 (the book calls it an enlarged meeting of the Politburo, in Building 3 of the Guangdong committee; Mao there on statistics: always asking for figures of what was sown, produced and how much manure was piled, reported every day, with blind orders and wild reports, so that boasting grew); [[w.peng-zhen-nianpu-1902]], IV, 109 (Mar. 5, 1961, evening; Peng Zhen at Mao''s enlarged Standing Committee hearing Zhou on industry and supply and Mao on the commune system; regulations to be drafted, communes and accounting units made smaller; the three southern bureaus to meet at Guangzhou, the three northern at Peking); [[w.zhu-de-nianpu-xinbian]], III, 1799 (Mar. 5, 1961, 9 p.m.; Zhu De 朱德 at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议 Mao Zedong 毛泽东 chairs at Guangzhou 广州, which hears Zhou Enlai 周恩来 on industry and farming and Mao on the communes'' system and industrial output; Zhu De: a commune he saw in Fujian 福建 had a good harvest, output contracted to the production team, the brigade doing what the team cannot, the commune the tractors and the like. The words: 晚九时). Made public: 1997. To check: Mao Zedong 毛泽东, speech at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议, Mar. 5, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.23). Names: Mao Zedong, Zhou Enlai, Peng Dehuai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Tao Zhu.'
