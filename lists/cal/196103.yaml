    c: Xi'an 西安, 4 p.m., Yang Shangkun's 杨尚昆 first visit since 1949; met by Liu Lantao 刘澜涛, Zhang Desheng 张德生 and others. With Kang Sheng 康生 and others straight to the Banpo 半坡 village site, the Great Wild Goose Pagoda 大雁塔 and the Forest of Steles 碑林; lodged at Zhangbagou 丈八沟 at 7. Back on the train for Luoyang 洛阳 at midnight.
