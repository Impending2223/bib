    c: 'Changsha 长沙, on the train. Mao 毛泽东 hears Zhang Pinghua 张平化 on the villagers'' views of the sixty articles: the mess halls and the supply system, the three contracts and one reward. On the reward, Mao: the grain is the people''s own; what the masses grow over, they keep. A revised draft is to be made at the May conference, tried among the people. He tells Zhang to go to the villages, mostly.'
