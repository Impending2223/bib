  - id: cal.1961-03-08.china-leadership-2
    when: Mar. 8
    date: '1961-03-08'
    thread: china-famine
    also: [soviet-union, trade, cuba, china-zhou-foreign]
    c: 'Zhou Enlai, for the Center, answers orally to Chervonenko Khrushchev''s letter of Feb. 27 to Mao offering grain and Cuban sugar on credit.{1} In face of the grain shortage China first mobilizes its own strength, then buys more on deferred payment from the world market, so the Soviet offer would be held in reserve and asked for only if purchases fail.{2} On 500,000 tons of Cuban sugar: if not urgent for the Soviet market, China would accept this aid.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 397 (Mar. 8, 1961); [[w.macfarquhar-origins-of-the-cultural]], III, 25–26 (the oral reply of Mar. 8: China to buy abroad, the Soviet grain kept in reserve, the sugar accepted); [[w.yang-jisheng-mubei]], II, 667 (March 1961: the Soviet offer, to help with the famine, of a loan of 1 million tons of wheat and of 500,000 tons of Cuban sugar re-exported; China refuses the wheat and takes the sugar, a loan of 329.6 million new rubles); [[w.dikotter-maos-great-famine]], 111 n.19a–b (the Soviet offer of a million tonnes of grain and half a million tonnes of sugar on an exchange basis, free of interest, repaid over several years; Peking turns down the grain and takes the sugar). Made public: 1997. Check: [[w.dikotter-maos-great-famine]], 111 n.18 (Ministry of Foreign Affairs Archives, Peking, 109-3746-1, pp. 17–18, file of Mar. 8, 1961), has Zhou Enlai tell the trading allies in March 1961 that China can no longer export foodstuffs or meet its long-term agreements and its contracts for large plants, over a million tonnes of grain and edible oils being owed to the Soviet Union for 1960; whether it is this reply, or his talk with the Soviet trade delegation of Mar. 1 ([[cal.1961-03-01.china-leadership-3]]). To check: [[w.xiao-chushi-sulian-banian-ambassador]], 105–06 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 26 n.22); Soviet note on the offer of grain and sugar to China, Feb. 14, 1964, RGANI, Moscow, 2-1-720, pp. 81–82 (cited by [[w.dikotter-maos-great-famine]], 111 n.19a); Sbornik osnovnykh deistvuiushchikh dogovorov i soglashenii mezhdu SSSR i KNR, 1949–1961, 196–197 (cited by [[w.dikotter-maos-great-famine]], 111 n.19b). Names: Zhou Enlai, Chervonenko, Khrushchev, Mao Zedong.'
