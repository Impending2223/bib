  - id: cal.1961-03.china-leadership-19
    when: Mar.
    date: 1961-03
    place: bengbu
    thread: china-famine
    c: The bulletin of Bengbu 蚌埠 city's three-level cadre meeting 三級幹部會議簡報, "Opinions and demands to the provincial committee" 《對省委的意見和要求》, records that Zeng Qingmei 曾慶梅, secretary of the Anhui 安徽 supervisory committee, on coming to Bengbu to inspect asked at once to dance and, in the name of secretary, had actresses learn dancing overnight to partner him, while deaths from hunger were already occurring in Bengbu. It records that in 1960 the prefectural committee drew off many people to build a guesthouse; and that at Mid-Autumn, with people starving in the streets, the prefectural and county secretaries held feasts at the guest house, held dances on days that were not Sundays and ate late suppers.
    n: '[[w.yang-jisheng-mubei]], I, 319–320. Made public: 2008. To check: Bengbu city 1961 three-level cadre meeting bulletin 蚌埠市1961年三級幹部會議簡報, "Opinions and requests to the provincial committee" 《對省委的意見和要求》 (cited by [[w.yang-jisheng-mubei]], I, 320 n.90). See [[cal.1961-03-18.china-leadership-5]]. Check: the day; Cheng Guanghua''s examination at the meeting is of Mar. 18, 1961.'
