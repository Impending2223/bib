    c: 'Guangzhou.{1} The enlarged Standing Committee, Mao presiding, with the Three North conference''s men arrived (Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen and the regional secretaries): the draft regulations, too long and too mixed, to be revised;{2} the meeting to end on the 20th.{3}'
