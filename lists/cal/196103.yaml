    n: '[[w.guan-vietnamese-communists-relations-with]], 186. Made public: 1973 (*Vietnam Documents and Research Notes*, doc. no. 114, July 1973, the earliest printing the note names). To check: Vietnam Documents and Research Notes, doc. no. 114, part 1, July 1973, "VWP-DRV Leadership, 1960–1973," 60–61 (cited by [[w.guan-vietnamese-communists-relations-with]], 186 n.25); [[w.lich-su-quan-doi]], 60–61 (cited by [[w.guan-vietnamese-communists-relations-with]], 186 n.26). Names: Hoàng Văn Thái.'
