  - id: cal.1961-03-14.china-leadership-8
    when: Mar. 14
    date: '1961-03-14'
    thread: china-famine
    c: 'The Fengyang 鳳陽 county committee issues no. 16 of its Rectification Work Bulletin 《整風整社工作簡報》. It gives cases of blind commanding in the county: at Hongguang 宏光 brigade, Mentai 門台 commune, land unfit for rice was forced from dry to paddy, 1,600 mu in 1958 yielding over 50 jin a mu, 850 mu in 1959 yielding 31, 900 mu in 1960 yielding 2 to 3, and 48 men and 25 oxen carried 30,000 jin of rice seed 60 li to Zongpu 總鋪 commune to be soaked and sprouted, 29 days, and the seed was lost; in spring 1960, with the wheat ripe, over 500 laborers were sent to Huangwan 黃灣, two days there, a day settling, a day finding tools, a day asleep for want of ration, two days back, eight days for half a day''s work, and the brigade''s wheat was rained on.'
    n: '[[w.yang-jisheng-mubei]], I, 263. Made public: 2008. To check: Fengyang County Committee, *Zhengfeng zhengshe gongzuo jianbao* (Rectification Work Bulletin), no. 16, Mar. 14, 1961 (cited by [[w.yang-jisheng-mubei]], I, 263 n.12); Fengyang County Committee, *Zhengfeng zhengshe gongzuo jianbao* (Rectification Work Bulletin), no. 16, Mar. 14, 1961 (cited by [[w.yang-jisheng-mubei]], I, 263 n.13).'
