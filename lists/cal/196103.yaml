  - id: cal.1961-03-01.china-leadership-13
    when: Mar. 1
    date: '1961-03-01'
    thread: china-propaganda
    c: 'Chen Yun 陈云, by letter to Wu Zongxi 吴宗锡: Qin Jiwen''s 秦纪文 recollections of adapting the ballad *Meng Lijun* 《孟丽君》 interest him; the storytellers'' pieces in the press are on their own change of mind and old and new society, almost none on the art; they should write of their experience in storytelling.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 76. Made public: 1997 ([[w.chen-yun-tongzhi-guanyu-1997]], where the nianpu says it is printed). To check: [[w.chen-yun-tongzhi-guanyu-1997]]; [[w.chen-yun-tongzhi-guanyu]] (the 1983 first edition, which may print it earlier). Names: Chen Yun.'
