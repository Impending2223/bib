    time: 1961-03-07T15:00Z
    thread: latin-america-dominican-republic
    also: [latin-america]
    c: '10 a.m. Goodwin with Berle on the Dominican Republic: cables tell of increased brutality by Trujillo''s regime since all the OAS states, the United States among them, broke relations after his attempt on Betancourt''s life. Kennedy, believing Trujillo''s overthrow inevitable, has asked for a contingency plan to guide the transition to a friendly democratic regime.'
