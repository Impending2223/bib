  - id: cal.1961-03-07.latin-america-2
    when: Mar. 7
    date: '1961-03-07'
    time: 1961-03-07T22:00Z
    place: washington
    thread: latin-america
    c: '5 p.m., the "fish room": a final conference of more than twenty on the address to the Latin American diplomats. Twice Kennedy calls Goodwin to the Oval Office: "I don''t want it on television. I can''t go to the well too often. This is not for the American people, it''s a message to Latin America. Let''s save our television for something like health or education. Make sure the speech is beamed to Latin America. Keep repeating it the next day."'
    n: '[[w.goodwin-remembering-america]], 154 (Goodwin''s account). Names: Kennedy, Goodwin.'
    tags: [name:kennedy-john-f, name:goodwin-richard-n]
