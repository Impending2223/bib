  - id: cal.1961-03-04.china-leadership-5
    when: Mar. 4
    date: '1961-03-04'
    thread: china-famine
    c: 'He Jianzhong 何建中, a cadre of the Yanbian 延邊 prefectural committee, telephones its secretary Fu 富 in the evening, the call recorded by Lan Ganting 蘭幹亭, and reports: by the count of early February over 10,000 in Yanbian have edema, 7 percent of the people of Tumen 圖們 town and 7.5 percent in Chaoyang 朝陽 commune, Yanji 延吉 county, more in some schools and offices, 15 percent at the medical college and 10 percent at the prefectural newspaper. Of 3,899 women cadres surveyed 1,154, 29.6 percent, have women''s diseases; in all the cities and counties but Dunhua 敦化 the people strip elm bark to eat, and along the roads and railways and round the villages most elms are stripped.'
    n: '[[w.yang-jisheng-mubei]], I, 347, 355. The words: 1961年3月4日晚 (I, 347 n.18). Made public: 2008. To check: Telephone record, He Jianzhong to the rural work department, evening of Mar. 4, 1961, recorded by Lan Ganting, printed Mar. 10 by the Jilin Provincial Committee General Office (cited by [[w.yang-jisheng-mubei]], I, 347 n.18); Telephone record, He Jianzhong to the rural work department, evening of Mar. 4, 1961, recorded by Lan Ganting, printed Mar. 10 by the Jilin Provincial Committee General Office (cited by [[w.yang-jisheng-mubei]], I, 355 n.36). Check: the record (the notes, I, 347 n.18 and 355 n.36) is of the evening of Mar. 4 and was printed Mar. 10 by the Jilin provincial committee''s general office; the text (I, 355) puts the call Mar. 5.'
    src:
