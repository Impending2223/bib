    c: 'The White House, 4:30 p.m.{1} The CIA presents a landing in the Zapata area, by the Bay of Pigs.{2} Kennedy wants it to look like an inside, guerrilla operation: no dawn landing, the ships clear of the area by dawn.{3}'
