    when: Mar. 5
    date: '1961-03-05'
    thread: economy
    c: 'Samuelson, on *Meet the Press*, pressed by Spivak: by economics alone a Treasury deficit of $5 billion "is needed now."'
    n: '[[w.sundquist-politics-and-policy]], 36–37 & n.70. See [[cal.1961-01-05.economy]]. Names: Samuelson, Spivak.'
