    c: 'Zhou Enlai with Chen Yi and He Long at the Peking Workers'' Gymnasium watches table tennis training and receives the players for the 26th World Table Tennis Championships: do honor to the country in play and style, not hold thoughts back, no pride in victory or gloom in defeat, far sight; he asks the two Marshals to tell their war experience, for a match is like a war and victory and defeat are the common lot of soldiers, dialectically one.'
