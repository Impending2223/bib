    c: 'Cheng Guanghua 程光華, secretary of the Bengbu 蚌埠 city committee, makes the committee''s examination 檢查 at its three-level cadre meeting. On the exaggeration wind he says the city''s blind chasing of the fashion was grave, to the point of faking: in 1958, seeing grain "satellites" elsewhere, the suburbs faked a "satellite field", moving three and a half mu of rice into a paddy of 0.6 mu, whose real yield was 200-odd jin and was boasted as 11,000 jin; it was photographed, a field meeting held, the paper printed. The committee had set "what others have we must have", had cadres read the papers for new reports and sent men away to learn.'
    n: '[[w.yang-jisheng-mubei]], I, 315–316. Made public: 2008. To check: Cheng Guanghua 程光華, examination on behalf of the Bengbu city committee at its three-level cadre meeting (record copy 記錄稿), Mar. 18, 1961 (cited by [[w.yang-jisheng-mubei]], I, 316 n.86). Check: the text gives the meeting as "March 1961"; the day is the record copy''s, in the note.'
