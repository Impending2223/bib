    when: Mar. 10
    date: '1961-03-10'
    thread: cuba-bay-of-pigs
    c: 'A CIA information report: "many people in Camaguey believe that the Castro regime is tottering and that the situation can at any moment degenerate into bloody anarchy"; risings in Oriente; food short in a disgruntled militia.'
    n: '[[w.bissell-reflections-of-a-cold]], 180, 181 n.32 (the report quoted). To check: Information Report, Mar. 10, 1961, CIA Directorate of Plans Files (cited by [[w.bissell-reflections-of-a-cold]], 181 n.32). See [[cal.1961-01-28.cuba]]. Names: Castro.'
