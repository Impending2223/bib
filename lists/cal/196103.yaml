    c: 'The White House, on Laos, a second meeting in two days.{1} Rusk: if American forces go in, not to fight a big war but to lay a foundation for negotiation, "two-stringed." Britain to modify its position; Moscow told how seriously Washington takes it; a de facto cease-fire, then the co-chairmen at New Delhi, then a conference of fourteen nations; a SEATO force in Thailand, not yet in Laos.{2} No decision.{3}'
