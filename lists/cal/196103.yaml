    c: 'Zhou Enlai, learning that the Hong Kong paper *Zhen bao* reports an American "one and a half Chinas" plan (acknowledging China''s suzerainty over Taiwan, neither side to use force there, Taiwan to sit at the United Nations like the Byelorussian and Ukrainian republics), instructs the Center''s group on Taiwan: American basic policy will not change but it will play new tricks to confuse some; seeing that imperialism''s nature does not change is not enough, watch new conditions and trends, tactics with care, an investigating wind so enemy, friend and self are all clear.'
