    when: Mar. 1
    date: '1961-03-01'
    thread: china-famine
    c: An investigation by the Guangdong 广东 Provincial People's Congress finds rats in 2,533 of the 2,832 granaries of Nanxiong county and insects in a third of the 123 state granaries and more of the 728 commune granaries of Chao'an county; close to a third of the province's 1.5 million tonnes of state grain holds too much water and rots.
    n: '[[w.dikotter-maos-great-famine]], 137. Made public: 2010. To check: Guangdong Provincial Archives, Mar. 1, 1961, 235-1-259, pp. 23–25 (cited by [[w.dikotter-maos-great-famine]], 137 n.28); Guangdong Provincial Archives, Mar. 1, 1961, 235-1-259, pp. 23–25 (cited by [[w.dikotter-maos-great-famine]], 137 n.31).'
