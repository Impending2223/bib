  - id: cal.1961-03-03.conservative-movement
    when: Mar. 3
    date: '1961-03-03'
    thread: conservative-movement
    also: [goldwater]
    c: 'New York, the Manhattan Center. Young Americans for Freedom''s first rally: over three thousand inside, as many turned away, 150 pickets for abolishing the House Un-American Activities Committee. Goldwater speaks.'
    n: '[[w.perlstein-before-the-storm]], 109; [[w.goldberg-barry-goldwater]], 150 (Goldwater''s words, March 1961: "Sometimes, the objectives we work toward can''t be realized overnight and we must train ourselves to understand that there is such a thing as timing and patience in the conduct of political affairs"); [[w.smith-on-his-own-terms]], 358 (Young Americans for Freedom''s first national rally, the Manhattan Center; Goldwater; students from 115 campuses). To check: Conley, "3,200 at Rally Here Acclaim Goldwater," [*New York Times*, Mar. 3, 1961](https://timesmachine.nytimes.com/timesmachine/1961/03/03/issue.html) (cited by [[w.perlstein-before-the-storm]], 109 n.1). Check: the date; the *Times*''s report bears Mar. 3. Names: Goldwater.'
    src:
      c: 53bbf176
      rows:
        - 'w.perlstein-before-the-storm 109: all'
        - 'via w.perlstein-before-the-storm 109 n.1: all'
        - 'w.goldberg-barry-goldwater 150: C'
        - 'via w.goldberg-barry-goldwater 150 n.6: C'
        - 'w.smith-on-his-own-terms 358: A, C'
    tags: [name:goldwater-barry-m, city:nyc]
    short: YAF's rally at the Manhattan Center
  - id: cal.1961-03-03.robert-kennedy
    when: Mar. 3
    date: '1961-03-03'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Sokolsky''s column: the *Insider''s Newsletter* has Hoover out by summer; he will not resign, but might be dismissed. Kennedy "an astute man"; to dismiss Hoover "would start such a fracas as no one needs."'
    n: '[[w.navasky-kennedy-justice]], 41. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover, Robert Kennedy.'
    src:
      c: 356cd264
      rows:
        - 'w.navasky-kennedy-justice 41: all'
    tags: [name:hoover-j-edgar, name:kennedy-robert-f]
  - id: cal.1961-03-03.cuba
    when: Mar. 3
    date: '1961-03-03'
    thread: cuba
    also: [soviet-union]
    c: 'Moscow. Kozlov and Suslov with Flavio Bravo of the PSP: glad to help Raúl Castro and the PSP plan Cuba''s defense, "only if Soviet specialists were sent to Cuba."'
    n: '[[w.fursenko-one-hell-of-a]], 87. To check: minutes of the meeting of Kozlov, Suslov and Flavio Bravo, Mar. 3, 1961, f. 3, op. 65, d. 871, APRF (cited by [[w.fursenko-one-hell-of-a]], 87 n.40–42). See [[cal.1961-02-24.cuba]]. Names: Kozlov, Suslov, Raúl Castro.'
