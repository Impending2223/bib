    thread: cuba-bay-of-pigs
    c: The White House, 4:15 p.m. Zapata. Bissell on the photographs, a diversion of 150 men, the disposal of the force if the landing is called off. D-Day put off from Apr. 5 to Apr. 10; the next decision Apr. 4.
    n: '[FRUS 1961–63, X, doc. 74](https://history.state.gov/historicaldocuments/frus1961-63v10/d74) (Gray''s notes). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 249. See [[cal.1961-03-16.cuba]]. Names: Bissell.'
