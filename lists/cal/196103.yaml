  - id: cal.1961-03-21.china-leadership-2
    when: Mar. 21
    date: '1961-03-21'
    place: canton
    thread: china-sixty-articles
    also: [china-famine, china-liu, china-economy]
    c: 'Guangzhou. Liu Shaoqi speaks at the Central-South and North China groups of the Central Work Conference. Free markets cannot be led by administrative orders alone but by economic competition: when egg prices rise on the free market the state is to give farmers more cigarettes per egg in exchange, so the free-market price falls and the market comes under the state''s lead. Light industrial goods should go first to the countryside, to be exchanged for farm goods. Economic work is to be ever finer: grain purchase is not to be flat but graded, and pay by labor, more work more food, is to be carried through.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 509–510 (Mar. 21, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
