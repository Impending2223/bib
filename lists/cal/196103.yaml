    when: Mar. 1
    date: '1961-03-01'
    thread: china-zhou
    also: [farm, china-agriculture]
    c: 'Zhou Enlai settles the Center''s reply on cotton cloth rations for Xinjiang: with grain short this year, the cotton harvest not to be overestimated, so no cloth coupons this spring, and few in autumn and next spring.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 394 (Mar. 1, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
