    thread: china-zhou
    also: [farm, china-agriculture]
    c: At the Secretariat Zhou Enlai hears Deng Xiaoping relay Mao's talk on the commune system and industrial output;{1} it decides to call, on the 11th, the heads of the North China, Northeast and Northwest bureaus and the provincial first secretaries to study the commune system.{2}
    n: '[[w.zhou-enlai-nianpu-1949]], II, 396 (Mar. 7, 1961); [[w.yang-shangkun-riji]], I, 660–661 (Mar. 7, 1961; the Secretariat, 3 to 6 p.m.; Deng relays the questions from Mao''s: no Soviet grain, the sugar acceptable; the communes and teams made smaller; the plan, a two-year and an eight-year; commerce; the Center to issue fewer documents and attend to investigation); [[w.deng-xiaoping-nianpu-1904]], III, 1620–1621 (Mar. 7, 1961; afternoon; Deng presides, Zhou and Chen Yun attend, and relays Mao at Guangzhou: regulations fixing the powers of commune, brigade and team, against transfers and blind command; communes made smaller after spring sowing where possible (Mao had talked with Zhang Pinghua, footnote 1: then a secretary of the Central-South Bureau and first secretary in Hunan); industry to rise steadily, a two-year plan and a seven-year plan from 1963; rectification in industry too slow; too many papers; Mao has views of the Secretariat''s and the departments'' work. Civil aviation under the air force; the two-year plan by the end of March. The northern conference called for the 11th); [[w.peng-zhen-nianpu-1902]], IV, 110 (Mar. 7, 1961, afternoon; the 241st meeting; Peng Zhen there, Zhou and Chen Yun attending; current work, industry and supply, foreign and domestic trade parted; Deng relays Mao: Khrushchev''s letter of Feb. 27 offering a million tons of wheat on loan and 500,000 tons of Cuban sugar, the grain refused, the sugar accepted; communes and teams made smaller; a two-year and a seven-year plan; rectification in industry; fewer papers, more investigation; the Chairman dissatisfied with the Secretariat''s and the departments'' work; the North China, Northeast and Northwest bureaus and their provinces'' first secretaries to meet on the 11th). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping, Mao Zedong.'
