  - id: cal.1961-03-04.economy
    when: Mar. 4–6
    date: '1961-03-04'
    thread: economy
    c: 'Bonn revalues the mark 4.75 percent: announced Saturday the 4th, effective Monday, 4.00 marks to the dollar instead of 4.20. The Netherlands follows. The central banks'' Basel arrangements to support sterling follow within the month.'
    n: '[FRUS 1961–63, XIV, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v14/d9) (Mar. 10, 1961). Federal Reserve Board, H.13 releases on FRASER (K–J Adm. II.J). [[w.gavin-gold-dollars-and-power]], 66 (the revaluation, among the German measures Washington pressed for). To check: [[w.bundesbank-monatsbericht]] (März 1961); [[w.emminger-d-mark-dollar-wahrungskrisen]]; [[w.doru-kiki-to-1961]]; [[w.coombs-arena-of-international-finance]] (K–J Adm. II.B). Check: Gavin, 66, gives 5 percent, the mark''s rise from 4.20 to 4.00 to the dollar; 4.75 is the dollar''s fall in marks. Names: Adenauer.'
    src:
      c: 85e304fc
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d9: all'
        - 'w.gavin-gold-dollars-and-power 66: A'
        - 'via w.gavin-gold-dollars-and-power 66 n.23: A'
    tags: [name:adenauer-konrad]
  - id: cal.1961-03-04.robert-kennedy
    when: Mar. 4
    date: '1961-03-04'
    thread: robert-kennedy
    also: [crime-and-hijacking]
    c: 'Robert Kennedy calls Hank Suydam of *Life*''s Washington office to the Justice Department: Sam Baron, a Teamsters official who has informed him in secret for two years, is ready to break with Hoffa in public, in *Life*. By Suydam''s memorandum to Thompson, the managing editor, Mar. 6.'
    n: '[[w.navasky-kennedy-justice]], 427–29 (Suydam''s memorandum, Mar. 6, "Last Saturday"; Kennedy''s account to Edward Long''s committee, that the story was to run only if Baron was killed). Names: Robert Kennedy, Hoffa. Check: the day (the memorandum''s "Last Saturday"); the day of Kennedy''s testimony to Long''s committee.'
    src:
      c: 673e02df
      rows:
        - 'w.navasky-kennedy-justice 427–29: all'
    tags: [name:kennedy-robert-f, name:hoffa-james-r]
  - id: cal.1961-03-04.robert-kennedy-2
    when: Mar. 4
    date: '1961-03-04'
    thread: robert-kennedy
    also: [press-and-broadcasting]
    c: 'Lyle Wilson of UPI: Hoover not about to retire; the reports of a rift untrue. "Ask for the source, ask for proof." The FBI and its boss at Justice "on the same basis of friendly informality as in other years."'
    n: '[[w.navasky-kennedy-justice]], 41–42. See [[cal.1961-02-27.robert-kennedy]]. Names: Hoover.'
    src:
      c: a553fb6b
      rows:
        - 'w.navasky-kennedy-justice 41–42: all'
    tags: [name:hoover-j-edgar]
  - id: cal.1961-03-04.testing
    when: Mar. 4
    date: '1961-03-04'
    thread: testing
    c: 'A White House session on inspections: McCloy''s ten a year, more for each unidentified seismic event beyond fifty, up to twenty; Lemnitzer for inspections in proportion to events, no ceiling; Nitze, for OSD, not of "paramount importance." Kennedy adopts McCloy''s proposal. Lemnitzer to Burke: "CONCUR WITHOUT SEEING!"'
    n: '[[w.poole-joint-chiefs-of-staff]], 94. Names: McCloy, Lemnitzer, Nitze, Kennedy, Burke.'
    src:
      c: 11460f03
      rows:
        - 'w.poole-joint-chiefs-of-staff 94: all'
    tags: [name:mccloy-john-j, name:lemnitzer-lyman-l, name:nitze-paul, name:kennedy-john-f, name:burke-arleigh-a]
