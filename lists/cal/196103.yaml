    place: washington
    thread: cuba-bay-of-pigs
    c: 'The White House.{1} Zapata revised: the landing at night, air drops at first light, the ships away by dawn.{2} Kennedy approves going ahead with the planning; keeps the right to call it off up to 24 hours before the landing.{3} Burke, asked, puts the chances at about 50 percent;{4} the force not to be taken off if pinned down: "Once they were landed they were there."{5}'
    n: '[FRUS 1961–63, X, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v10/d66) (Gray''s notes; Burke to the Chiefs, Mar. 17); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 28. [[w.fursenko-one-hell-of-a]], 85; [[w.jones-bay-of-pigs]], 58, 62 (58: the meeting, the approval, the right to cancel; 62: Burke''s 50 percent); [[w.bissell-reflections-of-a-cold]], 171 (the night landing; the right to cancel); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 183 (Burke''s "probability figure of about 50 percent"). Made public: FRUS 1961–63, X (1997). See [[cal.1961-03-15.cuba]]. Names: Kennedy.'
