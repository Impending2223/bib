# Cal. XVI March 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XVI
entries:
  - id: cal.1961-03.right-and-the-military
    when: Mar.
    date: 1961-03
    thread: right-and-the-military
    c: 'The John Birch Society reaches the national press: the *Los Angeles Times* series and the newsmagazines. Check the dates.'
    n: '[[w.hendershot-whats-fair-on-the]], for the broadcasters. To check: [[w.dallek-birchers]]; [[w.mulloy-world-of-the-john]]; [[w.schoenwald-time-for-choosing]].'
  - id: cal.1961-03-01.peace-corps
    when: Mar. 1
    date: '1961-03-01'
    thread: peace-corps
    c: Executive order creates the Peace Corps on a trial basis. Shriver named director.
    n: '[Exec. Order No. 10,924](https://www.presidency.ucsb.edu/documents/executive-order-10924-establishment-and-administration-the-peace-corps-the-department), [26 Fed. Reg. 1789](https://www.govinfo.gov/app/details/FR-1961-03-02) (K–J Adm. II.H.2). To check: [[w.hoffman-all-you-need-is]]; [[w.stossel-sarge]]; [[w.wofford-of-kennedys-and-kings]]; [[w.rice-bold-experiment]]. Names: Shriver, Wofford.'
    tags: [name:shriver-r-sargent, name:kennedy-john-f, name:wofford-harris]
  - id: cal.1961-03-01.africa
    when: Mar. 1
    date: '1961-03-01'
    thread: africa
    c: 'Williams, Assistant Secretary for African Affairs, on a tour of Africa, in Kenya: what the Africans want for themselves the United States wants for them; the press reports it "Africa for the Africans" (Check the date). Kennedy, asked at his news conference: "I do not know who else Africa should be for."'
    n: 'The President''s News Conference, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). To check: [[w.noer-soapy]]; [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.borstelmann-cold-war-and-the]]. Names: Williams.'
    tags: [name:williams-g-mennen, name:kennedy-john-f]
  - id: cal.1961-03-04.economy
    when: Mar. 4–6
    date: '1961-03-04'
    thread: economy
    c: 'Bonn revalues the mark 4.75 percent: announced Saturday the 4th, effective Monday, 4.00 marks to the dollar instead of 4.20. The Netherlands follows. The central banks'' Basel arrangements to support sterling follow within the month.'
    n: '[FRUS 1961–63, XIV, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v14/d9) (Mar. 10, 1961). Federal Reserve Board, H.13 releases on FRASER (K–J Adm. II.J). To check: [[w.bundesbank-monatsbericht]] (März 1961); [[w.emminger-d-mark-dollar-wahrungskrisen]]; [[w.doru-kiki-to-1961]]; [[w.gavin-gold-dollars-and-power]]; [[w.coombs-arena-of-international-finance]] (K–J Adm. II.B). Names: Adenauer.'
    tags: [name:adenauer-konrad]
  - id: cal.1961-03-06.civil-rights-the-executive
    when: Mar. 6
    date: '1961-03-06'
    thread: civil-rights-the-executive
    c: Executive order creates the President's Committee on Equal Employment Opportunity. Johnson chairs it. Contractors to take "affirmative action."
    n: '[Exec. Order No. 10,925](https://www.presidency.ucsb.edu/documents/executive-order-10925-establishing-the-presidents-committee-equal-employment-opportunity), [26 Fed. Reg. 1977](https://www.govinfo.gov/app/details/FR-1961-03-08) (K–J Adm. II.H.2). [[w.caro-passage-of-power]], 172–74, 262–64, on Johnson and Robert Kennedy in the committee. To check: [[w.graham-civil-rights-era]]; [[w.brauer-john-f-kennedy-and]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1961-03-06.economy
    when: Mar. 6
    date: '1961-03-06'
    thread: economy
    c: 'Heller before the Joint Economic Committee: a gap between actual and potential output, and 4 percent unemployment as the goal. Next day Martin tells the committee much of the unemployment is structural. Patman presses Martin by letter, Mar. 30.'
    n: '[[w.heller-american-economy-in-1961]], [on FRASER](https://fraser.stlouisfed.org/title/9814/item/717990) (K–J Adm. II.K). Hearings and the committee''s report (K–J Cong. II.J.3). [[w.okun-potential-gnp-its-measurement]], for the arithmetic. [[w.stein-fiscal-revolution-in-america]], 388–89, 396–98 (Heller''s testimony). Names: Heller, Martin, Patman.'
    tags: [name:heller-walter-w, name:martin-william-mcchesney-jr, name:patman-wright]
  - id: cal.1961-03-07.confirmations
    when: Mar. 7–8
    date: '1961-03-07'
    thread: confirmations
    also: [alabama]
    c: Meriwether, Alabama's finance director and Patterson's former campaign manager, to the Export-Import Bank's board. Banking and Currency approves, 5–4, after questions on segregation and the Klan. Javits's motion to recommit fails, [18–66](https://voteview.com/rollcall/RS0870002); confirmed Mar. 8, [67–18](https://voteview.com/rollcall/RS0870003).
    n: '[107 Cong. Rec., Senate, Mar. 7, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-7-1.pdf); [107 Cong. Rec., Senate, Mar. 8, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt3/pdf/GPO-CRECB-1961-pt3-8-1.pdf); [Executive Calendar, Mar. 8, 1961](https://www.senate.gov/legislative/LIS/executive_calendar/1961/03_08_1961.pdf). The Senate''s roll calls on nominations: Voteview; *Journal of the Executive Proceedings of the Senate*. To check: [[w.mackenzie-politics-of-presidential-appointments]]. Names: Javits, Patterson, Meriwether.'
    tags: [name:meriwether-charles-m, name:javits-jacob-k, name:patterson-john]
  - id: cal.1961-03-08.africa
    when: Mar. 8
    date: '1961-03-08'
    thread: africa
    also: [congo]
    c: 'Nkrumah at the White House. Mostly the Congo: the Belgians out, the Congo cut off from all outside influence but the UN. He turns aside Rusk''s attempt to raise the Volta dam.'
    n: 'Remarks of Welcome to President Nkrumah of Ghana at the Washington National Airport, [1961 Pub. Papers 160](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=218); Joint Statement Following Discussions With the President of Ghana, [1961 Pub. Papers 161](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=219) (Mar. 8, 1961). FRUS 1961–63, XXI, docs. [224](https://history.state.gov/historicaldocuments/frus1961-63v21/d224), [225](https://history.state.gov/historicaldocuments/frus1961-63v21/d225). To check: [[w.mahoney-jfk]]; [[w.muehlenbeck-betting-on-the-africans]]; [[w.thompson-ghanas-foreign-policy-1957]]; [[w.rakove-kennedy-johnson-and-the]]. Names: Nkrumah, Rusk.'
    tags: [name:nkrumah-kwame, name:kennedy-john-f, name:rusk-dean]
  - id: cal.1961-03-10.latin-america
    when: Mar. 10
    date: '1961-03-10'
    thread: latin-america
    c: 'Schlesinger reports to Kennedy on his mission with McGovern, Feb. 12–Mar. 3: Argentina, Brazil, Bolivia, Peru, Venezuela. Latin America bound to modernize; a middle-class revolution or a "workers-and-peasants" one; the landed oligarchy the barrier to the first.'
    n: '[FRUS 1961–63, XII, doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v12/d7). Made public: FRUS 1961–63, XII. [[w.schlesinger-thousand-days-1965]], 175–86 (the mission). The Alliance proposed: [[cal.1961-03-13.latin-america]]. Names: Schlesinger, McGovern, Kennedy.'
    tags: [name:schlesinger-arthur-m-jr, name:mcgovern-george, name:kennedy-john-f]
  - id: cal.1961-03-11.cuba
    when: Mar. 11
    date: '1961-03-11'
    thread: cuba-bay-of-pigs
    c: 'The White House, 10:05 a.m. The CIA presents the Trinidad plan. Kennedy willing to go ahead, not with a plan so "spectacular"; he wants one where American help is less obvious. NSAM 31: a new exile political organization; a white paper; a démarche in the OAS for free elections in Cuba.'
    n: 'FRUS 1961–63, X, docs. [58](https://history.state.gov/historicaldocuments/frus1961-63v10/d58) (the CIA''s paper), [59](https://history.state.gov/historicaldocuments/frus1961-63v10/d59) (Gray''s notes), [60](https://history.state.gov/historicaldocuments/frus1961-63v10/d60) (NSAM 31); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 24. Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 240–43. See [[cal.1961-02-03.cuba]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:bissell-richard-m-jr, name:bundy-mcgeorge]
  - id: cal.1961-03-12.opinion
    when: Mar. 12
    date: '1961-03-12'
    thread: opinion
    also: [jobs-and-wages]
    c: 'Gallup, Feb. 10–15: raising the $1.00 minimum wage, 76 percent for, 18 against. Republicans 63 for.'
    n: '[[w.gallup-poll]], III, 1709.'
  - id: cal.1961-03-13.latin-america
    when: Mar. 13
    date: '1961-03-13'
    thread: latin-america
    c: The Alliance for Progress proposed to the Latin American diplomatic corps at the White House.
    n: 'Address at a White House Reception for Members of Congress and for the Diplomatic Corps of the Latin American Republics, [1961 Pub. Papers 170](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=228) (Mar. 13, 1961). [[w.levinson-alliance-that-lost-its]];[[w.rabe-most-dangerous-area-in]]. [FRUS vol. 12](https://history.state.gov/historicaldocuments/frus1961-63v12). [[w.schlesinger-thousand-days-1965]], 202–05. To check: [[w.goodwin-remembering-america]]; [[w.taffet-foreign-aid-as-foreign]]; [[w.latham-modernization-as-ideology]] (K–J Adm. II.D). Names: Goodwin, Dungan.'
    tags: [name:kennedy-john-f, name:goodwin-richard-n, name:dungan-ralph-a]
  - id: cal.1961-03-15.africa
    when: Mar. 15
    date: '1961-03-15'
    thread: africa
    c: Angola in the Security Council, at Liberia's request, after the rising at Luanda of Feb. 4. A resolution asking Portugal for reforms toward self-determination, with a subcommittee of inquiry, fails, 5–0, six abstaining, Britain and France among them. The United States votes for it; the embassy at Lisbon had warned of the reaction in Portugal.
    n: 'FRUS 1961–63, XXI, doc. [347](https://history.state.gov/historicaldocuments/frus1961-63v21/d347) (its note dates the vote Mar. 14; Check). To check: [[w.mahoney-jfk]]; [[w.schneidman-engaging-africa]]; [[w.marcum-angolan-revolution-volume-i]]; [[w.noer-cold-war-and-black]]; [[w.gleijeses-conflicting-missions]].'
  - id: cal.1961-03-15.cuba
    when: Mar. 15
    date: '1961-03-15'
    thread: cuba-bay-of-pigs
    c: 'The White House, 4:30 p.m. The CIA presents a landing in the Zapata area, by the Bay of Pigs. Kennedy wants it to look like an inside, guerrilla operation: no dawn landing, the ships clear of the area by dawn.'
    n: 'FRUS 1961–63, X, docs. [61](https://history.state.gov/historicaldocuments/frus1961-63v10/d61) (the CIA''s paper), [64](https://history.state.gov/historicaldocuments/frus1961-63v10/d64) (Bundy), [65](https://history.state.gov/historicaldocuments/frus1961-63v10/d65) (Gray''s notes); [62](https://history.state.gov/historicaldocuments/frus1961-63v10/d62) (the Chiefs the same day: Zapata the most feasible of three, none as good as Trinidad); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 25–27. Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 243. See [[cal.1961-03-11.cuba]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:bissell-richard-m-jr, name:bundy-mcgeorge]
  - id: cal.1961-03-16.middle-east
    when: Mar. 16
    date: '1961-03-16'
    thread: middle-east
    c: 'Radio Mecca: Saud has ordered the American ambassador told that the Dhahran airfield agreement will not be renewed when it expires in April 1962. Announced while State and Defense drafted a joint statement with the Saudis. The State Department''s background release the same evening.'
    n: 'FRUS 1961–63, XVII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v17/d24). [[w.poole-joint-chiefs-of-staff]], 242. To check: [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]; [[w.vitalis-americas-kingdom]]. Names: Saud ibn Abd al-Aziz Al Saud.'
    tags: [name:saud-ibn-abd-al-aziz-al-saud]
  - id: cal.1961-03-16.cuba
    when: Mar. 16
    date: '1961-03-16'
    thread: cuba-bay-of-pigs
    c: 'The White House. Zapata revised: the landing at night, air drops at first light, the ships away by dawn. Kennedy approves going ahead with the planning; keeps the right to call it off up to 24 hours before the landing.'
    n: '[FRUS 1961–63, X, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v10/d66) (Gray''s notes; Burke to the Chiefs, Mar. 17); [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 28. Made public: FRUS 1961–63, X (1997). See [[cal.1961-03-15.cuba]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1961-03-17.economy
    when: Mar. 17
    date: '1961-03-17'
    thread: economy
    c: 'Heller to the President: even if the whole program passes, output at year''s end will be some $40 billion below potential and unemployment no lower. He asks for a larger second stage. The April review is the next decision.'
    n: 'Memorandum from Heller to the President (Mar. 17, 1961) (K–J Adm. II.H.3). Names: Heller.'
    tags: [name:heller-walter-w, name:kennedy-john-f]
  - id: cal.1961-03-20.cuba
    when: Mar. 20
    date: '1961-03-20'
    thread: cuba-bay-of-pigs
    c: Miami. The FRD, enlarged, and Ray's MRP choose Miró Cardona to chair a Revolutionary Council, after the CIA's representative, opening their meeting Mar. 18, asks them for unity and a chairman. Miró Cardona, Varona, Artime, Ray and others to New York to announce it.
    n: '[FRUS 1961–63, X, doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v10/d69) (Barnes to Dulles, Mar. 21). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 244–45 (the Council). Schlesinger has the CIA''s demand for unity at the Skyways Motel, Miami, Mar. 18 (244). See [[cal.1961-02-08.cuba]]. Names: Ray, Miró Cardona, Varona, Artime. Check: Schlesinger has Varona and Ray signing the agreement on Miró Cardona Mar. 22 (244).'
    tags: [name:ray-manuel-antonio, name:miro-cardona-jose, name:varona-manuel-antonio-de, name:artime-manuel]
  - id: cal.1961-03-21.states-and-cities-el-paso
    when: Mar. 21
    date: '1961-03-21'
    thread: states-and-cities
    c: El Paso. Kennedy nominates Raymond Telles, mayor since 1957, ambassador to Costa Rica. Confirmed Apr. 6; at his post May 22.
    n: '[Office of the Historian, "Raymond L. Telles Jr."](https://history.state.gov/departmenthistory/people/telles-raymond-l) (POCOM). To check: [[w.garcia-making-of-a-mexican]]; [[w.garcia-viva-kennedy]]. Names: Telles.'
    tags: [state:tx, city:el-paso, name:telles-raymond-jr, name:kennedy-john-f]
  - id: cal.1961-03-22.foreign-aid
    when: Mar. 22
    date: '1961-03-22'
    thread: foreign-aid
    c: Foreign aid message. One new agency in place of ICA and the loan fund; five-year development lending by borrowing from the Treasury.
    n: 'Special Message to the Congress on Foreign Aid, [1961 Pub. Papers 203](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=261) (Mar. 22, 1961). To check: [[w.latham-modernization-as-ideology]]. Names: Bell, Fulbright, Rooney.'
    tags: [name:kennedy-john-f, name:bell-david-e, name:fulbright-j-william, name:rooney-john-j]
  - id: cal.1961-03-22.program
    when: Mar. 22
    date: '1961-03-22'
    thread: farm
    c: Emergency feed grain program signed, [75 Stat. 6](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg6-2.pdf).
    n: 'To check: [[w.cochrane-american-farm-policy-1948]]; [[w.hadwiger-pressures-and-protests]]; [[w.hansen-gaining-access]]. Names: Freeman.'
    tags: [name:kennedy-john-f, name:freeman-orville-l]
  - id: cal.1961-03-22.africa
    when: Mar. 22
    date: '1961-03-22'
    thread: africa
    c: 'NSAM 33 to Rusk: review policy toward South Africa, leaving the Commonwealth, and toward Angola and the Portuguese territories; in particular the encouragement of American investment in South Africa and the purchase of its gold and raw materials.'
    n: 'FRUS 1961–63, XXI, doc. [377](https://history.state.gov/historicaldocuments/frus1961-63v21/d377) (NSAM 33). Made public: FRUS 1961–63, XXI (1995). To check: [[w.noer-cold-war-and-black]]; [[w.borstelmann-cold-war-and-the]]. See [[cal.1960-03-21.africa]]. Names: Rusk.'
    tags: [name:kennedy-john-f, name:rusk-dean]
  - id: cal.1961-03-23.laos
    when: Mar. 23
    date: '1961-03-23'
    thread: laos
    c: Televised press conference with maps of the Pathet Lao advance. Seventh Fleet and Marines moved; SEATO consulted.
    n: 'News Conference, [1961 Pub. Papers 213](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=271) (Mar. 23, 1961). [[w.gibbons-u-s-government-and]], II, 21; [[w.vietnam-victory-in-vietnam]], 86–88, 456 n.21 (North Vietnamese battalions in Laos from early 1961, some 12,000 men; Tchepone taken, Apr. 11–May 3, before the cease-fire); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 237; [[w.poole-joint-chiefs-of-staff]], 126; [[w.anthony-war-in-northern-laos]], 46 (the press conference and its maps; the moves of JTF 116, the carriers and the Marines). [FRUS vol. 24](https://history.state.gov/historicaldocuments/frus1961-63v24). To check: [[w.rust-so-much-to-lose]]; [[w.freedman-kennedys-wars]]; [[w.hilsman-to-move-a-nation]]; Hist, CINCPAC, 1961, pt 2, p 84 (cited by [[w.anthony-war-in-northern-laos]], 46 n.60). Names: Harriman.'
    src:
      c: 763538e6
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=271: all'
        - 'w.gibbons-u-s-government-and II, 21: all'
        - 'w.vietnam-victory-in-vietnam 86–88, 456 n.21: ?'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 237: all'
        - 'w.poole-joint-chiefs-of-staff 126: all'
        - 'w.anthony-war-in-northern-laos 46: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24: all'
        - 'via w.anthony-war-in-northern-laos 46 n.60: B'
    tags: [name:kennedy-john-f, name:harriman-w-averell]
  - id: cal.1961-03-24.program
    when: Mar. 24
    date: '1961-03-24'
    thread: jobs-and-wages
    c: 'House adopts the weaker Ayres–Kitchin minimum wage substitute, [216–203](https://voteview.com/rollcall/RH0870014), then passes the bill, [341–78](https://voteview.com/rollcall/RH0870016). The administration''s first floor defeat; restored in conference. Same day: temporary extended unemployment compensation signed.'
    n: 'CQ Almanac 1961. [75 Stat. 8](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg8.pdf) (1961). See [[cal.1961-02-02.program]]. Names: Goldberg, Powell, Kitchin, Ayres.'
    tags: [name:ayres-william-h, name:kitchin-alvin-p, name:kennedy-john-f, name:goldberg-arthur-j, name:powell-adam-clayton-jr]
  - id: cal.1961-03-24.economy
    when: Mar. 24
    date: '1961-03-24'
    thread: economy
    c: 'Special message on budget and fiscal policy: the recession and the new requests turn Eisenhower''s projected surplus into a deficit.'
    n: 'Special Message to the Congress on Budget and Fiscal Policy, [1961 Pub. Papers 221](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=279) (Mar. 24, 1961). [[w.stein-fiscal-revolution-in-america]], 391 (the new requests). To check: [[w.morgan-deficit-government]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f]
  - id: cal.1961-03-27.mississippi
    when: Mar. 27
    date: '1961-03-27'
    thread: mississippi
    also: [sit-ins]
    c: Jackson. Nine students of Tougaloo College's NAACP youth council sit in at the white public library on State Street; arrested for breach of the peace and held thirty-two hours.
    n: '[[w.dittmer-local-people]], 87–89.'
    tags: [state:ms, city:jackson]
  - id: cal.1961-03-28.defense
    when: Mar. 28
    date: '1961-03-28'
    thread: defense
    c: Defense budget message. More Polaris and Minuteman, faster; conventional and counterinsurgency forces enlarged; the B-70 cut back.
    n: 'Special Message to the Congress on the Defense Budget, [1961 Pub. Papers 229](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=287) (Mar. 28, 1961). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 13, 38, 62; [[w.poole-joint-chiefs-of-staff]], 37; [[w.futrell-united-states-air-force]], 63 (the message''s call for forces against guerrilla war). To check: [[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]. Names: McNamara, Hitch, Enthoven, Vinson.'
    src:
      c: 5030f4ef
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=287: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 13, 38, 62: all'
        - 'w.poole-joint-chiefs-of-staff 37: all'
        - 'w.futrell-united-states-air-force 63: A, C'
        - 'via w.futrell-united-states-air-force 63 n.1: A, C'
    tags: [name:kennedy-john-f, name:mcnamara-robert-s, name:hitch-charles-j, name:enthoven-alain-c, name:vinson-carl]
  - id: cal.1961-03-28.cuba
    when: Mar. 28
    date: '1961-03-28'
    thread: cuba-bay-of-pigs
    c: 'Kennedy and Schlesinger on his draft White Paper; "snide" cut. Asked about the invasion: "I think about it as little as possible." The weak point, Kennedy says, the theory of a rising against Castro. Schlesinger to ask a *Herald Tribune* reporter back from Cuba how Cubans would take a landing.'
    n: '[[w.schlesinger-thousand-days-1965]], 245–48, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). The White Paper: [[cal.1961-04-03.cuba]]. See [[cal.1961-03-16.cuba]]. Names: Kennedy, Schlesinger, Castro.'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:castro-fidel]
  - id: cal.1961-03-29.states-and-cities
    when: Mar. 29
    date: '1961-03-29'
    thread: states-and-cities
    also: [amendments, electoral-college]
    c: Twenty-third Amendment ratified. Three electoral votes for the District.
    n: Statement by the President Following Ratification of the 23d Amendment to the Constitution, [1961 Pub. Papers 245](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=303). [Certification of amendment, 26 Fed. Reg. 2808](https://www.govinfo.gov/content/pkg/FR-1961-04-04/pdf/FR-1961-04-04.pdf#page=42) (1961). [S.J. Res. 39, 74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf) (1960). U.S. Const. amend. XXIII (K–J Cong. II.J.2). See [[cal.1960-02-02.states-and-cities]].
