    date: 1961-03
    thread: vietnam-hanoi
    also: [laos]
    c: 'The General Staff''s new battle order: the 325th Division, 341st Brigade and 244th Regiment to Military Region IV; the 316th and 335th Brigades and 148th Regiment to the Northwest Military Region, ready for Battlefield B, the South, and C, Laos. The 338th Division set up to train all soldiers bound for the South.'
