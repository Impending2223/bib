  - id: cal.1961-03-01.school-aid-2
    when: Mar. 1
    date: '1961-03-01'
    time: 1961-03-01T15:00Z
    place: washington
    thread: school-aid
    follows:
      - cal.1961-03-01.peace-corps
    c: 'News conference. No aid to private and parochial schools: "the Constitution clearly prohibits aid to the school, to parochial schools"; *Everson*, 5 to 4, aid to the child. The college program different: "We are aiding the student in the same way the GI bill of rights aided the student."'
    n: 'The President''s News Conference of March 1, 1961, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). [[w.graham-uncertain-triumph]], 19–20. Check: Graham, 234 n.54, cites the Papers at 154–55, the conference of Mar. 8. After [[cal.1961-03-01.peace-corps|the order]]: "I have today signed an Executive order providing for the establishment of a Peace Corps," the President says in opening the conference ([1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193)). Names: Kennedy.'
    src:
      c: 2e4ab8c7
