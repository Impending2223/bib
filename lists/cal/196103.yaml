    when: Mar. 3
    date: '1961-03-03'
    thread: laos
    also: [defense]
    c: Kennedy directs Lemnitzer to prepare a plan for retaking the Plain of Jars.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 236; [[w.poole-joint-chiefs-of-staff]], 126 (and Felt and Boyle brought to Washington). To check: McGhee for the Secretary of State, Mar. 3, 1961, FRUS 1961–63, XXIV, 68–69 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 237 n.30). The plan: [[cal.1961-03-09.laos]]. Names: Kennedy, Lemnitzer.'
