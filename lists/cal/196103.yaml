    c: 'The PLA General Political Department''s *Bulletin of Activities* no. 13 carries "Concerning the Struggle of the Laotian People": Laos, to the Americans the "stopper of the bottle" of Indochina, a base they mean to use against China; Kong Le''s and the Pathet Lao''s forces stronger than Phoumi Nosavan''s but fewer, in need of time and training; no early solution, the armed struggle decisive. China, the Soviet Union and North Vietnam for a peaceful settlement on Geneva''s lines; a conference first, then the Commission revived, both to deal only with Souvanna Phouma''s government; the Americans stalling for military advantage.'
