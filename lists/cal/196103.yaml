  - id: cal.1961-03.laos-2
    when: Mar.
    date: 1961-03
    thread: laos
    c: 'Winthrop Brown, Ambassador to Laos, with the President for almost an hour. Kennedy: "What do you think, you, the Ambassador?" Brown: "Laos is hopeless"; "The king is a total zero." Phoumi never near a battlefield. Kong Le not a Communist but a disgruntled soldier, a patriot. Souvanna Phouma the only Lao with a chance of pulling the country together.'
    n: '[[w.reeves-president-kennedy]], 74. Check: the month and the day; Reeves places the lunch with Lippmann ([[cal.1961-03-20.laos]]) "five days later." Names: Brown, Kennedy, Phoumi, Kong Le, Souvanna Phouma.'
