# Cal. LXXXVII February 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVII
entries:
  - id: cal.1967-02-02.india-and-china
    when: Feb. 2
    date: '1967-02-02'
    thread: india-and-china
    also: [foreign-aid, farm]
    c: 'Message on food for India. India''s need this year, 10 million tons of grain, about $725 million; 2.3 million tons already in the pipeline. The rest, 5.7 million tons, to be met through the World Bank''s India Aid Consortium; the United States to give up to 3 million tons more if other countries match it. $25 million in food for CARE and the voluntary agencies in Bihar and Uttar Pradesh.'
    n: '[Special Message to the Congress on Food for India and on Other Steps To Be Taken in an International War on Hunger](https://www.presidency.ucsb.edu/documents/special-message-the-congress-food-for-india-and-other-steps-be-taken-international-war) (Feb. 2, 1967). See [[cal.1966-11-10.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-06.crime-and-hijacking
    when: Feb. 6
    date: '1967-02-06'
    thread: crime-and-hijacking
    c: 'Message on crime. A Safe Streets and Crime Control Act: planning grants to States, cities and metropolitan bodies up to 90 percent, grants for programs up to 60 percent; an Office of Law Enforcement and Criminal Justice Assistance in the Justice Department; $50 million for fiscal 1968. Controls on the sale of firearms; a Right of Privacy Act against wiretapping and eavesdropping, but for national security; aid against juvenile delinquency and narcotics.'
    n: '[Special Message to the Congress on Crime in America](https://www.presidency.ucsb.edu/documents/special-message-the-congress-crime-america) (Feb. 6, 1967). [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1967-01-10.program]]; [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-06.robert-kennedy
    when: Feb. 6
    date: '1967-02-06'
    thread: robert-kennedy
    also: [vietnam]
    c: '*Newsweek* reports that Robert Kennedy, back from Europe, brought a peace signal from Hanoi: in Paris, Feb. 1, Manac''h of the French Foreign Ministry had told him what Hanoi would take as the condition of talks (Check the day). Feb. 6, Kennedy with Johnson in the White House, Katzenbach present (Check): Johnson, the leak was Kennedy''s; Kennedy, it was State''s. Kennedy to the press after: he brought home no peace feelers.'
    n: '[[w.schlesinger-robert-kennedy-and-his]]; [[w.shesol-mutual-contempt]]; [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]. See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy, Manac''h, Katzenbach, Johnson.'
    tags: [name:kennedy-robert-f, name:manach-etienne-m, name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1967-02-06.vietnam
    when: Feb. 6–13
    date: '1967-02-06'
    thread: vietnam
    also: [soviet-union, europe-and-the-alliance]
    c: 'Sunflower Plus. Kosygin in London, Feb. 6–13. Wilson presses on him the "Phase A–Phase B" formula, given the British in November: the bombing stops first, then both sides stop adding to their forces. Tet truce, Feb. 8–12; no bombing of the North. Feb. 10, Washington''s text, to go to Kosygin: the bombing to stop when the United States is assured that infiltration "has stopped." Feb. 12, Johnson to Wilson: no bombing if Hanoi gives that assurance by 10 a.m. London time Feb. 13; extended six hours. No reply. Feb. 13, bombing resumed; Christian reads Johnson''s statement: Hanoi used the truces for "major resupply efforts." Wilson to the Commons, Feb. 13: a settlement "could have been very near."'
    n: 'FRUS 1964–68, V, docs. [41](https://history.state.gov/historicaldocuments/frus1964-68v05/d41), [51](https://history.state.gov/historicaldocuments/frus1964-68v05/d51), [64](https://history.state.gov/historicaldocuments/frus1964-68v05/d64), [70](https://history.state.gov/historicaldocuments/frus1964-68v05/d70), [74](https://history.state.gov/historicaldocuments/frus1964-68v05/d74), [76](https://history.state.gov/historicaldocuments/frus1964-68v05/d76), [80](https://history.state.gov/historicaldocuments/frus1964-68v05/d80). [Statement by the President on the Resumption of Bombing in North Vietnam](https://www.presidency.ucsb.edu/documents/statement-the-president-the-resumption-bombing-north-vietnam) (Feb. 13, 1967). [[w.ellis-britain-america-and-the]]; [[w.colman-lost-crusader]]. See [[cal.1967-01-04.vietnam]]. Made public: the exchanges with Wilson, [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). Names: Kosygin, Wilson, Christian, Johnson.'
    tags: [name:kosygin-aleksei, name:wilson-harold, name:christian-george, name:johnson-lyndon-b]
  - id: cal.1967-02-08.vietnam
    when: Feb. 8
    date: '1967-02-08'
    thread: vietnam
    c: 'Moscow, 1 a.m.: Guthrie hands Lê Trang Johnson''s letter to Hồ Chí Minh: he will stop the bombing of the North and stop adding to American forces in the South "as soon as I am assured that infiltration into South Viet-Nam by land and by sea has stopped"; direct talks in Moscow, Burma or elsewhere. Lê Trang: it shows an "absence of goodwill." Washington, the NSC: Wheeler, a promise to talk not enough to stop the bombing; McNamara, it could stop for "a symmetrical de-escalation." Johnson''s reply to Paul VI''s appeal of Feb. 7: no cut in military action unless the other side does likewise.'
    n: 'FRUS 1964–68, V, docs. [40](https://history.state.gov/historicaldocuments/frus1964-68v05/d40), [42](https://history.state.gov/historicaldocuments/frus1964-68v05/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v05/d43). [The President''s Reply to a Message From Pope Paul VI on Vietnam](https://www.presidency.ucsb.edu/documents/the-president-s-reply-message-from-pope-paul-vi-vietnam) (Feb. 8, 1967). Made public: Hanoi''s release of the letters, Mar. 21, 1967. See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang, Hồ Chí Minh, Wheeler, McNamara, Paul VI, Johnson.'
    tags: [name:guthrie-john-c, name:le-trang, name:ho-chi-minh, name:wheeler-earle, name:mcnamara-robert-s, name:paul-vi, name:johnson-lyndon-b]
  - id: cal.1967-02-08.congress
    when: Feb. 8–23
    date: '1967-02-08'
    thread: congress
    c: 'Powell before the select committee, Celler its chairman, Feb. 8: he answers only on his age, citizenship and residence. Feb. 14, his counsel only: the standing qualifications the sole test; no punishment before a member is seated. Feb. 23, the report: Powell meets the qualifications; he asserted an unwarranted privilege and immunity from the processes of New York''s courts, diverted House funds to himself and others, and made false reports on foreign currency. To be seated, censured, fined $40,000, and stripped of seniority.'
    n: 'H.R. Rep. No. 27, 90th Cong., 1st Sess., 31–33 (1967), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 490–92 (1969) (K–J Cong. II.J.1). See [[cal.1967-01-10.congress]]. Names: Powell, Celler.'
    tags: [name:powell-adam-clayton-jr, name:celler-emanuel]
  - id: cal.1967-02-08.economy
    when: Feb. 8–23
    date: '1967-02-08'
    thread: economy
    c: 'The debt limit, H.R. 4573: to $336 billion. House, Feb. 8: the closed rule, [223–183](https://voteview.com/rollcall/RH0900006); recommittal to bring under the ceiling the $3 billion of participation certificates sold this fiscal year, refused, [155–261](https://voteview.com/rollcall/RH0900007); passed, [215–199](https://voteview.com/rollcall/RH0900008), the limit temporary. Senate, Feb. 21, the limit permanent, [54–23](https://voteview.com/rollcall/RS0900019). The House''s temporary limit kept in conference; the Senate agrees, Feb. 23, [39–31](https://voteview.com/rollcall/RS0900020).'
    n: '[113 Cong. Rec., House, Feb. 8, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt3/pdf/GPO-CRECB-1967-pt3-1-2.pdf); [113 Cong. Rec., Senate, Feb. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-1-1.pdf). [[w.zelizer-taxing-america]]; [[w.congress-and-the-nation-1969]]. See [[cal.1967-01-24.economy]].'
  - id: cal.1967-02-08.poverty
    when: Feb. 8
    date: '1967-02-08'
    thread: poverty
    also: [welfare, school-aid]
    c: 'Message on children and youth, twelve points: Head Start "Follow Through" in the early grades, and Head Start for younger children; a pilot lunch program for preschool children; child and parent centers in the poorest areas; social security up for 3 million children; aid against mental retardation; a pilot program of dental care; grants against juvenile delinquency.'
    n: '[Special Message to the Congress Recommending a 12-Point Program for America''s Children and Youth](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-12-point-program-for-americas-children-and-youth) (Feb. 8, 1967). [[w.zigler-head-start]]. See [[cal.1966-11-08.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-09.foreign-aid
    when: Feb. 9
    date: '1967-02-09'
    thread: foreign-aid
    c: 'Foreign aid message: slightly over $3.1 billion under the Foreign Assistance Act for fiscal 1968, some $2.5 billion of it economic, almost $600 million military. More than $1 billion for agriculture, education and health. $200 million for the Asian Development Bank''s special funds, over several years, on the Black mission''s advice. Latin America $624 million; the Near East and South Asia $758 million.'
    n: '[Special Message to the Congress on Foreign Aid](https://www.presidency.ucsb.edu/documents/special-message-the-congress-foreign-aid-4) (Feb. 9, 1967). [[w.ruttan-united-states-development-assistance]]. See [[cal.1966-09-19.foreign-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-10.succession
    when: Feb. 10
    date: '1967-02-10'
    thread: succession
    c: 'Twenty-fifth Amendment ratified: Minnesota and Nevada, the 37th and 38th States. Feb. 23, the Administrator of General Services certifies it, [32 Fed. Reg. 3287](https://www.govinfo.gov/content/pkg/FR-1967-02-25/pdf/FR-1967-02-25.pdf#page=4), [81 Stat. 983](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg983.pdf); Johnson in the East Room with Bayh and Celler, who brought it through Congress.'
    n: '[Remarks at Ceremony Marking the Ratification of the Presidential Inability (25th) Amendment to the Constitution](https://www.presidency.ucsb.edu/documents/remarks-ceremony-marking-the-ratification-the-presidential-inability-25th-amendment-the) (Feb. 23, 1967). [[w.feerick-twenty-fifth-amendment]]. See [[cal.1965-07-06.succession]]; [[cal.1966-07-05.succession-us]]. Names: Knott, Bayh, Celler, Johnson.'
    tags: [name:johnson-lyndon-b, name:knott-lawson-b-jr, name:bayh-birch, name:celler-emanuel]
  - id: cal.1967-02-13.intelligence
    when: Feb. 13–15
    date: '1967-02-13'
    thread: intelligence
    also: [students]
    c: 'The National Student Association''s officers confirm that the CIA has paid for its international program since the early 1950s, ahead of *Ramparts*''s March issue (Check the day). Feb. 14, *Ramparts*''s advertisements in the *Times* and the *Post*, and stories on the front page of both; Feb. 15, reports of CIA money through foundations to other youth groups abroad. Feb. 15, Johnson names Katzenbach, Gardner and Helms to review the CIA''s relations with private voluntary organizations working abroad.'
    n: 'FRUS 1964–68, XXXIII, doc. [260](https://history.state.gov/historicaldocuments/frus1964-68v33/d260); X, doc. [171](https://history.state.gov/historicaldocuments/frus1964-68v10/d171). [[w.paget-patriotic-betrayal]]; [[w.wilford-mighty-wurlitzer]]. Names: Katzenbach, Gardner, Helms, Johnson.'
    tags: [name:katzenbach-nicholas, name:gardner-john-w, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-02-15.vietnam
    when: Feb. 15
    date: '1967-02-15'
    thread: vietnam
    c: 'Moscow. Lê Trang gives Guthrie Hồ Chí Minh''s reply, received, it says, Feb. 10: the United States must stop the bombing "definitively and unconditionally," withdraw its troops and its allies'', recognize the National Liberation Front; talks only after the bombing and all other acts of war against the North stop unconditionally. Lê Trang: he can no longer meet American representatives in Moscow.'
    n: 'FRUS 1964–68, V, docs. [81](https://history.state.gov/historicaldocuments/frus1964-68v05/d81), [82](https://history.state.gov/historicaldocuments/frus1964-68v05/d82). Made public: Hanoi''s release of the letters, Mar. 21, 1967. See [[cal.1967-01-04.vietnam]]; [[cal.1967-02-08.vietnam]]. Names: Lê Trang, Guthrie, Hồ Chí Minh.'
    tags: [name:le-trang, name:guthrie-john-c, name:ho-chi-minh]
  - id: cal.1967-02-15.open-housing
    when: Feb. 15
    date: '1967-02-15'
    thread: open-housing
    also: [civil-rights-bill]
    c: 'Message on equal justice, the civil rights program of 1967. Discrimination in housing outlawed by stages: at once, housing under the order of 1962; in 1968, dwellings sold or rented by others than their occupants and buildings for five or more families; all housing in 1969. Crimes of violence against those exercising named rights made federal, with civil suits for the victims. Discrimination in choosing federal and State juries barred, the Attorney General to sue. The Equal Employment Opportunity Commission to issue enforceable cease-and-desist orders. The Civil Rights Commission extended five years.'
    n: '[Special Message to the Congress on Equal Justice](https://www.presidency.ucsb.edu/documents/special-message-the-congress-equal-justice) (Feb. 15, 1967). [[w.graham-civil-rights-era]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.dallek-flawed-giant]]. See [[cal.1966-09-14.open-housing]]; [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-16.consumers
    when: Feb. 16
    date: '1967-02-16'
    thread: consumers
    c: 'Message "To Protect the American Consumer." A Truth-in-Lending Act: the cost of credit stated as a yearly percentage rate. An Interstate Land Sales Full Disclosure Act; a Welfare and Pension Plan Protection Act; mutual funds'' charges regulated. Safety of medical devices; meat inspection''s gaps closed; hazardous household products; fire safety; electric power failures; natural gas pipelines.'
    n: '[Special Message to the Congress "To Protect the American Consumer"](https://www.presidency.ucsb.edu/documents/special-message-the-congress-protect-the-american-consumer) (Feb. 16, 1967). [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-17.assassination
    when: Feb. 17–22
    date: '1967-02-17'
    thread: assassination
    c: 'New Orleans. Feb. 17, the *States-Item* reports that Garrison, the district attorney, is investigating the assassination. Feb. 22, Ferrie, whom he has questioned, found dead in his apartment; the coroner: natural causes (Check).'
    n: '[[w.epstein-counterplot]]; [[w.kirkwood-american-grotesque]]; [[w.lambert-false-witness]]. See [[cal.1967-01-03.assassination]]. Names: Garrison, Ferrie.'
    tags: [name:garrison-jim, name:ferrie-david-w]
  - id: cal.1967-02-18.crime-and-hijacking
    when: Feb. 18
    date: '1967-02-18'
    thread: crime-and-hijacking
    c: '*The Challenge of Crime in a Free Society*, the report of the President''s Commission on Law Enforcement and Administration of Justice, Katzenbach chairman: more than 200 recommendations, on police, courts, corrections, juvenile delinquency, organized crime, narcotics and firearms (Check the count). Its last words: "America can control crime if it will."'
    n: '[Statement by the President Concerning the Report of the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-the-report-the-presidents-commission-law-enforcement) (Feb. 18, 1967). [[w.justice-challenge-of-crime-in]]; [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1965-07-23.crime-and-hijacking]]. Names: Katzenbach.'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1967-02-22.vietnam
    when: Feb. 22
    date: '1967-02-22'
    thread: vietnam
    c: 'Junction City, in War Zone C, Tây Ninh Province, toward the Cambodian border, to May 14: the 1st and 25th Infantry Divisions and other units, against the Viet Cong''s headquarters for the South. A battalion of the 173rd Airborne Brigade parachutes in, the first American combat jump of the war (Check).'
    n: '[[w.rogers-cedar-falls-junction-city]]. See [[cal.1967-01-08.vietnam]].'
  - id: cal.1967-02-22.vietnam-2
    when: Feb. 22–27
    date: '1967-02-22'
    thread: vietnam
    c: 'Feb. 22, Johnson with McNamara, Eugene Rostow, Taylor and Wheeler, 1:15 to 3:25 p.m.; no notes found. Reported from Saigon over the weekend: naval gunfire against the North''s coast, mines in its rivers, long-range artillery fire into the North. Feb. 27, news conference: activity "that we would not say has been normal through the past weeks"; no recognition of a failure of diplomacy, "None whatever."'
    n: 'FRUS 1964–68, V, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84), [88](https://history.state.gov/historicaldocuments/frus1964-68v05/d88). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1186) (Feb. 27, 1967). [[w.gibbons-u-s-government-and-1995]]; [[w.berman-lyndon-johnsons-war]]. See [[cal.1967-02-06.vietnam]]. Names: McNamara, Eugene Rostow, Taylor, Wheeler, Johnson.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rostow-eugene, name:taylor-maxwell, name:wheeler-earle]
  - id: cal.1967-02-25.war-opposition
    when: Feb. 25
    date: '1967-02-25'
    thread: war-opposition
    also: [king]
    c: 'Beverly Hills, Cal. King, at a symposium of *The Nation* with Hatfield, McCarthy and Gruening: "The Casualties of the War in Vietnam," his first address given wholly to the war (Check the place and the sponsor).'
    n: '[[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]; [[w.debenedetti-american-ordeal]]; [[w.wells-war-within]]; [[w.small-johnson-nixon-and-the]]. Names: Martin Luther King, Hatfield, McCarthy, Gruening.'
    tags: [name:king-martin-luther-jr, name:hatfield-mark-o, name:mccarthy-eugene-j, name:gruening-ernest]
  - id: cal.1967-02-27.defense
    when: Feb. 27–28
    date: '1967-02-27'
    thread: defense
    also: [soviet-union]
    c: 'Kosygin''s reply on the strategic arms, given Thompson by Gromyko Feb. 28: ready to continue the exchange of views; offensive and defensive missiles to be taken together; a meeting of representatives not excluded; better conditions if Vietnam were settled. Gromyko''s oral statement: the present balance no "stability" to preserve.'
    n: 'FRUS 1964–68, XI, docs. [185](https://history.state.gov/historicaldocuments/frus1964-68v11/d185), [186](https://history.state.gov/historicaldocuments/frus1964-68v11/d186), [187](https://history.state.gov/historicaldocuments/frus1964-68v11/d187). Made public: FRUS 1964–68, XI (1997). See [[cal.1967-01-04.defense]]. Names: Kosygin, Thompson, Gromyko.'
    tags: [name:kosygin-aleksei, name:thompson-llewellyn-e, name:gromyko-andrei]
  - id: cal.1967-02-28.court
    when: Feb. 28
    date: '1967-02-28'
    thread: court
    also: [transition-and-staff]
    c: 'Johnson names Ramsey Clark, acting since October, Attorney General. Justice Tom Clark, his father, says he will retire from the Court to avoid any appearance of a conflict.'
    n: '[The President''s Remarks to the Press Upon Announcing His Intention To Nominate Ramsey Clark as Attorney General](https://www.presidency.ucsb.edu/documents/the-presidents-remarks-the-press-upon-announcing-his-intention-nominate-ramsey-clark) (Feb. 28, 1967). [[w.dallek-flawed-giant]]; [[w.kalman-abe-fortas]]. See [[cal.1966-09-21.transition-and-staff]]. Names: Ramsey Clark, Tom Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:clark-ramsey, name:clark-tom-c]
