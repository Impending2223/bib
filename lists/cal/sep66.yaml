# Cal. LXXXII September 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXII
entries:
  - id: cal.1966-09-01.vietnam
    when: Sept. 1
    date: '1966-09-01'
    thread: vietnam
    also: [europe-and-the-alliance]
    c: 'De Gaulle at Phnom Penh, Sihanouk his host. Cambodia, he says, kept its body and its soul by remaining its own master, while "the political and military authority of the United States was seen installed in its turn in South Vietnam" and the war "gained new strength there in the form of national resistance." Lodge, from Saigon: the words mean "that the United States in effect committed an aggression in South Vietnam." Bohlen, from Paris: de Gaulle "ignoring facts in favor of his favorite position."'
    n: 'FRUS 1964–68, XII, doc. [66](https://history.state.gov/historicaldocuments/frus1964-68v12/d66). *American Foreign Policy: Current Documents, 1966*, pp. 646–648, the speech. [[w.journoud-de-gaulle-et-le]]; [[w.jackson-de-gaulle]]; [[w.clymer-troubled-relations]]. Names: de Gaulle (K–J Adm. III.J); Sihanouk (Viet. III.I); Lodge (K–J Adm. III.E).'
    tags: [name:de-gaulle-charles, name:norodom-sihanouk, name:lodge-henry-cabot, name:bohlen-charles-e]
  - id: cal.1966-09-01.states-and-cities-dayton
    when: Sept. 1
    date: '1966-09-01'
    thread: states-and-cities
    c: Dayton. Lester Mitchell, a Negro, shot dead from a passing car while sweeping the walk before his bar on West Fifth Street, early morning. Rioting in west Dayton through the day; Mayor Dave Hall asks Rhodes for the National Guard, in the city by 3 p.m. One dead, about 30 hurt, over 100 arrested.
    n: '[Wikipedia, "1966 Dayton race riot"](https://en.wikipedia.org/wiki/1966_Dayton_race_riot), from the *Dayton Daily News* (Check). See [[cal.1966-07-18.states-and-cities]]. Names: Mitchell (K–J Cong. III.K); Hall (K–J Cong. III.F); Rhodes (Opp. III.H).'
    tags: [state:oh, city:dayton, name:mitchell-lester, name:hall-dave, name:rhodes-james-a]
  - id: cal.1966-09-02.alabama-al
    when: Sept. 2
    date: '1966-09-02'
    thread: alabama
    also: [desegregation-schools]
    c: 'At Wallace''s call, the legislature, in special session, declares void every agreement of a local school board with HEW under the desegregation guidelines and forbids new ones (Act No. 252). Check: passed Sept. 2, or the Senate Aug. 31 and signed Sept. 9.'
    n: 'Act No. 252, Special Session, 1966, as cited in [*Wallace v. Lee*, Motion to Affirm](https://ldfrecollection.org/archives/archives-search/archives-item/8f325deb-eb93-40a1-bf4f-3e634cbbfcdd/wallace-v-lee-motion-to-affirm) (NAACP Legal Defense Fund). Check: *Acts of Alabama*, Special Session, 1966. [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.alabama]]. Names: Wallace (K–J Cong. III.F).'
    tags: [state:al, name:wallace-george-c]
  - id: cal.1966-09-04.open-housing
    when: Sept. 4
    date: '1966-09-04'
    thread: open-housing
    also: [civil-rights-organizations]
    c: Cicero. Robert Lucas of Chicago CORE leads some 250 marchers (Check) into the town, the march King gave up under the summit agreement; SCLC against it. Kerner has called out the National Guard. White crowds throw rocks and bottles; the Guard and the police keep them off; the marchers walk back to Chicago.
    n: 'See [[cal.1966-07-10.open-housing]]. Names: King (K–J Cong. III.H); Kerner (K–J Cong. III.F).'
    tags: [name:king-martin-luther-jr, name:kerner-otto]
  - id: cal.1966-09-04.opinion
    when: Sept. 4
    date: '1966-09-04'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey of persons drawn from *Who''s Who in America*, 1966: what they would do about Vietnam if President: step up the fighting 27 percent; continue as at present 21; slow down the fighting 35.'
    n: '[[w.gallup-poll]], III, 2025–26.'
  - id: cal.1966-09-06.georgia
    when: Sept. 6–8
    date: '1966-09-06'
    thread: georgia
    also: [civil-rights-organizations]
    c: Atlanta, Summerhill. A white policeman shoots Harold Prather, a Negro suspect running from arrest; a crowd gathers, SNCC workers among it. Allen, speaking from the top of a police car, is toppled off it; police disperse the crowd with tear gas. Allen blames SNCC. Sept. 8, Carmichael arrested, charged with inciting to riot. Check the details.
    n: '*Time*, Sept. 16, 1966, "Atlanta: Stokely''s Spark." [[w.allen-mayor]]; [[w.carson-in-struggle]]; [[w.joseph-stokely]]; [[w.kruse-white-flight]]. Names: Allen (K–J Cong. III.F); Carmichael (K–J Cong. III.H).'
    tags: [name:allen-ivan-jr, name:carmichael-stokely]
  - id: cal.1966-09-06.governors-nv
    when: Sept. 6
    date: '1966-09-06'
    thread: governors
    also: [elections-1966]
    c: 'Nevada''s primary. Democratic, for governor: Sawyer, seeking a third term, 40,982, 58.6 percent; Marshall 13,858, 19.8; Springer 13,270, 19.0. Republican: Lieutenant Governor Laxalt 32,768, 94.7.'
    n: 'Votes: [Nev. *Political History of Nevada* (12th ed., 2016), 509](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=515). [[w.laxalt-nevadas-paul-laxalt]]; [[w.sawyer-hang-tough-grant-sawyer]]. Names: Laxalt (Opp. III.H); Sawyer (K–J Cong. III.F); Marshall, Springer (K–J Cong. III.K).'
    tags: [state:nv, name:sawyer-grant, name:marshall-edward-g, name:springer-charles-e, name:laxalt-paul]
  - id: cal.1966-09-06.governors-ia
    when: Sept. 6
    date: '1966-09-06'
    thread: governors
    also: [elections-1966]
    c: 'Iowa, governor. Republican primary: Murray, an Iowa State economist, 50.5 percent, Beck, a former State Representative, 49.5. Governor Hughes unopposed.'
    n: 'Votes: [Wikipedia, "1966 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1966_Iowa_gubernatorial_election), from the [*Summary of Official Canvass of the Votes Cast in Iowa Primary Election, September 6, 1966*](https://sos.iowa.gov/elections/pdf/results/60s/1966primcanv.pdf) (Check: the scan''s totals). [[w.larew-party-reborn]]. Names: Hughes (K–J Cong. III.F); Murray, Beck (K–J Cong. III.K).'
    tags: [state:ia, name:murray-william-g, name:beck-robert-k, name:hughes-harold-e]
  - id: cal.1966-09-07.opinion
    when: Sept. 7
    date: '1966-09-07'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: Communist China to send many troops if the North Vietnamese show signs of giving in: will 38 percent, will not 35.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-07.governors-ny
    when: Sept. 7–8
    date: '1966-09-07'
    thread: governors
    also: [elections-1966]
    c: 'New York''s conventions. Democrats at Buffalo, Sept. 7: O''Connor, president of the City Council, nominated for governor on the first ballot over Samuels; Sept. 8, the delegates name Samuels for lieutenant governor against the leaders'' choice. Conservatives at Saratoga Springs, N.Y.: Adams, a professor, an enrolled Republican. Sept. 8, Republicans at Rochester renominate Rockefeller; the Liberals nominate Franklin D. Roosevelt Jr., 209 votes of 321 delegates present.'
    n: '[*New York Times*, Sept. 8, 1966](https://www.nytimes.com/1966/09/08/archives/2d-spot-at-issue-fourway-contest-for-lieutenant-governor-faces.html); [Sept. 8](https://www.nytimes.com/1966/09/08/archives/professor-named-by-conservatives-adams-to-run-for-governor-vietnam.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rockefeller-renominated-pledges-fight-on-bosses-republicans-pick.html); [Sept. 9](https://www.nytimes.com/1966/09/09/archives/rooseveltnamed-by-liberal-party-candidate-seeks-unity-after-getting.html). [[w.persico-imperial-rockefeller]]; [[w.smith-on-his-own-terms]]; [[w.connery-rockefeller-of-new-york]]; [[w.mahoney-actions-speak-louder]]. See [[cal.1962-11-06.governors-ny]]. Names: O''Connor (K–J Cong. III.F); Adams (K–J Cong. III.K); Rockefeller (Opp. III.H).'
    tags: [state:ny, name:oconnor-frank-d, name:samuels-howard-j, name:adams-paul-l, name:rockefeller-nelson, name:roosevelt-franklin-d-jr]
  - id: cal.1966-09-08.economy
    when: Sept. 8
    date: '1966-09-08'
    thread: economy
    c: Special message on fiscal policy; a news conference the same day. The 7 percent investment tax credit to be suspended for orders placed from Sept. 1 to Jan. 1, 1968; accelerated depreciation on buildings begun in that time suspended too. About $3 billion, a tenth of the part of the fiscal 1967 budget under his control, to be cut. The Federal Reserve and the large banks asked to help bring interest rates down. Further steps wait on the eight appropriation bills still in Congress and the Vietnam supplemental.
    n: '[Special Message to the Congress on Fiscal Policy](https://www.presidency.ucsb.edu/documents/special-message-the-congress-fiscal-policy-0) (Sept. 8, 1966); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1172) (Sept. 8, 1966). [[w.okun-political-economy-of-prosperity]]; [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]. See [[cal.1965-12-05.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-09.transportation
    when: Sept. 9
    date: '1966-09-09'
    thread: transportation
    c: 'National Traffic and Motor Vehicle Safety Act, [80 Stat. 718](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg718.pdf), and Highway Safety Act, [80 Stat. 731](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg731.pdf), signed. Federal safety standards for new cars and tires, domestic and imported, from the 1968 models, set first by the Secretary of Commerce; makers to notify buyers of defects; federal research and test centers. Grants to the States for highway safety programs on federal standards. Johnson: over Labor Day weekend 614 dead on the highways, 29 servicemen dead in Vietnam.'
    n: '[Remarks at the Signing of the National Traffic and Motor Vehicle Safety Act and the Highway Safety Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-national-traffic-and-motor-vehicle-safety-act-and-the-highway) (Sept. 9, 1966). [[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]; [[w.eastman-styling-vs-safety]]. See [[cal.1966-03-02.transportation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-09.opinion
    when: Sept. 9
    date: '1966-09-09'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: the United States to begin letting South Vietnam take on more of the fighting: yes 62 percent, no 22. Republicans 60, Democrats 66, independents 57.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-11.vietnam
    when: Sept. 11
    date: '1966-09-11'
    thread: vietnam
    c: 'South Vietnam elects a Constituent Assembly: 117 seats, 532 candidates. Some four-fifths of the 5,288,512 registered vote, by Lodge''s count; the Viet Cong''s attacks that day and the evening before, 19 government dead and 120 wounded. The Assembly to have a constitution ready by March 1967. Lodge to Johnson, Sept. 14: "an immense vote of no confidence in the Viet Cong."'
    n: 'FRUS 1964–68, IV, doc. [229](https://history.state.gov/historicaldocuments/frus1964-68v04/d229). Seats and candidates: Dieter Nohlen, Florian Grotz & Christof Hartmann, *Elections in Asia and the Pacific: A Data Handbook*, II (2001), 334 (Check). [[w.carter-inventing-vietnam]]; [[w.karnow-vietnam]]. See [[cal.1966-03-10.vietnam]]. Names: Lodge (K–J Adm. III.E).'
    tags: [name:lodge-henry-cabot]
  - id: cal.1966-09-11.opinion
    when: Sept. 11
    date: '1966-09-11'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: the most important problem: Vietnam 56 percent; racial problems 24; inflation 16. The party better able to handle it: Democratic 28, Republican 21, no difference 35.'
    n: '[[w.gallup-poll]], III, 2026.'
  - id: cal.1966-09-12.mississippi
    when: Sept. 12–17
    date: '1966-09-12'
    thread: mississippi
    also: [desegregation-schools]
    c: Grenada. About 250 Negro children, of 450 enrolled under a federal court order in the white schools, go to class; the rest withdrawn under threats to their parents' jobs and homes. A white crowd meets them, chases them through the streets, beats children and reporters with chains, pipes and clubs, through the first week, the local police not stepping in. Federal protection from Sept. 17; 13 of the crowd arrested. Check the figures.
    n: '[[w.dittmer-local-people]]; [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-09-13.elections-1966
    when: Sept. 13
    date: '1966-09-13'
    thread: elections-1966
    also: [states-and-cities]
    c: 'Primaries. Maryland: Mahoney, a Baltimore paving contractor, on "Your home is your castle—protect it," wins the Democratic nomination for governor, 148,446, to Sickles''s 146,607 and Finan''s 134,216; Agnew the Republican. Massachusetts: Brooke, the attorney general, unopposed for the Republican nomination for the Senate; Peabody over Collins for the Democratic, 320,967 to 265,016, Thomas Boylston Adams, against the war, 51,435.'
    n: 'Maryland Manual, 1969–70, [p. 626](http://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000174/html/am174--525.html). [Mass. *Election Statistics*, 1966 (P.D. 43)](https://archive.org/details/electionstatisti19651966mass); check the page. [[w.coffey-spiro-agnew-and-the]]; [[w.witcover-very-strange-bedfellows]]; [[w.brooke-bridging-the-divide]]; [[w.rigueur-loneliness-of-the-black]]. Names: Agnew (Opp. III.H); Brooke (Opp. III.B); Collins (K–J Cong. III.K); Mahoney (K–J Cong. III.K).'
    tags: [name:agnew-spiro-t, name:brooke-edward-w, name:peabody-endicott, name:collins-john-f, name:sickles-carlton-r, name:mahoney-george-p]
  - id: cal.1966-09-13.states-and-cities-nyc
    when: Sept. 13
    date: '1966-09-13'
    thread: states-and-cities
    c: New York. Percy Sutton, Assemblyman from Harlem, chosen Manhattan's borough president in Motley's place, she having gone to the federal bench, Aug. 30.
    n: '[Wikipedia, "Percy Sutton"](https://en.wikipedia.org/wiki/Percy_Sutton). See [[cal.1965-02-23.states-and-cities-nyc]]. Names: Sutton, Motley (K–J Cong. III.F).'
    tags: [state:ny, city:nyc, name:sutton-percy-e, name:motley-constance-baker]
  - id: cal.1966-09-13.governors-az
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Arizona''s primary, for governor. Democratic: Governor Goddard 63,180, 44.9 percent; Green 53,921, 38.3. Republican: Jack Williams, once mayor of Phoenix, 37,409, 44.3; Haugh 25,905, 30.7; Pickrell 21,192, 25.1.'
    n: 'Votes: [Wikipedia, "1966 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1966_Arizona_gubernatorial_election); Check: [Ariz. *Official Canvass, Primary Election, September 13, 1966*](https://azmemory.azlibrary.gov/nodes/view/102662). [[w.shermer-sunbelt-capitalism]]; [[w.peirce-mountain-states-of-america]]. Names: Goddard, Williams (K–J Cong. III.F); Green, Haugh, Pickrell (K–J Cong. III.K).'
    tags: [state:az, city:phoenix, name:goddard-samuel-p-jr, name:green-norman, name:williams-jack, name:haugh-john, name:pickrell-robert]
  - id: cal.1966-09-13.state-constitutions-md
    when: Sept. 13
    date: '1966-09-13'
    thread: state-constitutions
    c: Maryland. With the primaries, the voters call a constitutional convention for 1967, 160,280 to 31,680.
    n: '*Maryland Manual*, 1967–68, [p. 539](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--539.html), [288](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000173/html/am173--288.html) (ch. 501, Acts of 1966). [[w.callcott-maryland-and-america-1940]]. See [[cal.1966-09-13.elections-1966]].'
    tags: [state:md]
  - id: cal.1966-09-13.governors-wi
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Wisconsin, governor. Democratic primary: Lucey 45.2 percent, Carley 33.8, Frinzi 15.6, one other 5.4. Governor Knowles unopposed.'
    n: 'Votes: [Wikipedia, "1966 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1966_Wisconsin_gubernatorial_election), from the *Wisconsin Blue Book 1967* (Check). [[w.peirce-great-lakes-states-of]]. Names: Knowles (K–J Cong. III.F); Carley, Frinzi (K–J Cong. III.K).'
    tags: [state:wi, name:lucey-patrick, name:carley-david, name:frinzi-dominic-h, name:knowles-warren-p]
  - id: cal.1966-09-13.governors-mn
    when: Sept. 13
    date: '1966-09-13'
    thread: governors
    also: [elections-1966]
    c: 'Minnesota, governor. DFL primary: Governor Rolvaag 66.3 percent, Keith 31.0, four others 2.7. Republican: LeVander 97.9, one other 2.1.'
    n: '[*Report of the State Canvassing Board, Primary Election, September 13, 1966*](https://www.lrl.mn.gov/docs/2023/Other/232069/1966.pdf). See [[cal.1966-06-19.governors-mn]]. Names: LeVander (K–J Cong. III.F); Keith (K–J Cong. III.K).'
    tags: [state:mn, name:rolvaag-karl-f, name:keith-alexander-m, name:levander-harold]
  - id: cal.1966-09-14.elections-1966
    when: Sept. 14–28
    date: '1966-09-14'
    thread: elections-1966
    also: [georgia]
    c: 'Georgia''s Democratic primary for governor. Arnall, governor 1943–47, first, 231,480; Maddox, who closed his Atlanta restaurant rather than serve Negroes, second, 185,672; Carter, a State senator, third, 164,562; Gray 152,973. The runoff, Sept. 28: Maddox 443,055, Arnall 373,004. Callaway, a Representative, the Republican nominee.'
    n: 'Ga. *Official and Statistical Register*, 1965–66, pp. 1738, 1779 (Check). Check the dates: Wikipedia gives Sept. 13 and 27. [[w.short-everything-is-pickrick]]; [[w.kruse-white-flight]]; [[w.carter-why-not-the-best]]. Names: Maddox (K–J Cong. III.F); Carter (Cong. III.H); Callaway (Opp. III.D); Arnall (K–J Cong. III.K).'
    tags: [name:maddox-lester, name:carter-jimmy, name:callaway-howard-h, name:arnall-ellis]
  - id: cal.1966-09-14.open-housing
    when: Sept. 14–19
    date: '1966-09-14'
    thread: open-housing
    also: [congress]
    c: The civil rights bill, H.R. 14765, passed by the House Aug. 9, in the Senate. Cloture on Hart's motion to take it up refused, [54–42](https://voteview.com/rollcall/RS0890447), ten short of two-thirds; Sept. 19 again, [52–41](https://voteview.com/rollcall/RS0890448). Dirksen opposed to its open-housing title. Mansfield sets the bill aside; it dies with the session.
    n: '[112 Cong. Rec., Senate, Sept. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-2-2.pdf); [112 Cong. Rec., Senate, Sept. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-5-2.pdf). See [[cal.1966-04-28.open-housing]]. Names: Hart (K–J Cong. III.B); Dirksen, Mansfield (K–J Cong. III.A).'
    tags: [name:hart-philip-a, name:dirksen-everett, name:mansfield-mike]
  - id: cal.1966-09-14.opinion
    when: Sept. 14
    date: '1966-09-14'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Aug. 18–23: a police permit required to buy a gun: favor 68 percent, oppose 29; gun owners 56 and 41. The use of guns by those under 18: forbid it 27; restrict it 55; continue as at present 15. Gun owners: 17, 59, 22.'
    n: '[[w.gallup-poll]], III, 2027.'
  - id: cal.1966-09-16.opinion
    when: Sept. 16
    date: '1966-09-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Aug. 18–23: how the war will end: an American victory 21 percent; a stalemate or negotiations 27, Korea named by 13; a long drawn-out conflict 9; a Communist victory 4; a third world war 4; no opinion 26.'
    n: '[[w.gallup-poll]], III, 2027.'
  - id: cal.1966-09-19.foreign-aid
    when: Sept. 19
    date: '1966-09-19'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1966 signed, [80 Stat. 795](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg795-3.pdf): development lending and the Alliance for Progress authorized through fiscal 1969 (Check), the rest for a year. Johnson objects to "new restrictions on the administration of this program." The conference report through the House Sept. 1, [217–127](https://voteview.com/rollcall/RH0890323); the Senate Sept. 7, [33–25](https://voteview.com/rollcall/RS0890445).'
    n: '[Statement by the President Upon Signing the Foreign Assistance Act of 1966](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-foreign-assistance-act-1966) (Sept. 19, 1966). [[w.ruttan-united-states-development-assistance]]; [[w.taffet-foreign-aid-as-foreign]]. See [[cal.1965-10-20.foreign-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-21.economy
    when: Sept. 21
    date: '1966-09-21'
    thread: economy
    also: [cities-and-housing]
    c: 'Interest Rate Control Act signed, [80 Stat. 823](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg823.pdf): ceilings on rates paid on deposits and share accounts, set by the Federal Reserve, the FDIC and the Home Loan Bank Board, more flexibly, by the size of the deposit (Check); reserves on member banks'' time deposits up to 10 percent; the Reserve banks may deal in agency issues. The House passed it Sept. 8, [271–68](https://voteview.com/rollcall/RH0890329).'
    n: '[Remarks at the Signing of the Interest Rate Control Bill](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-interest-rate-control-bill) (Sept. 21, 1966). [112 Cong. Rec., House, Sept. 8, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt16/pdf/GPO-CRECB-1966-pt16-8-1.pdf). [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.kettl-leadership-at-the-fed]]. See [[cal.1966-09-08.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-21.court
    when: Sept. 21
    date: '1966-09-21'
    thread: court
    also: [congress]
    c: Dirksen's amendment to permit voluntary prayer in the public schools fails in the Senate, [49–37](https://voteview.com/rollcall/RS0890451), nine short of two-thirds. Offered as a substitute for S.J. Res. 144, a resolution for a National UNICEF Day; the substitute taken, [51–36](https://voteview.com/rollcall/RS0890450); Bayh's, a resolution that Congress favored prayer in the schools, refused, [33–52](https://voteview.com/rollcall/RS0890449).
    n: '[112 Cong. Rec., Senate, Sept. 21, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-7-2.pdf). [[w.dierenfield-battle-over-school-prayer]]; [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]. See [[cal.1962-06-25.court]]; [[cal.1965-08-04.court]]. Names: Dirksen (K–J Cong. III.A); Bayh (Cong. III.B).'
    tags: [name:dirksen-everett, name:bayh-birch]
  - id: cal.1966-09-21.transition-and-staff
    when: Sept. 21
    date: '1966-09-21'
    thread: transition-and-staff
    c: News conference. Ball, Under Secretary of State, has resigned, by letter of Sept. 17; Katzenbach to leave the Attorney Generalship for his place. Confirmed Sept. 30; sworn Oct. 3. Ramsey Clark, the Deputy, Acting Attorney General from Oct. 3. Ball leaves Sept. 30; Johnson's farewell for him at the White House, Oct. 6.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1174) (Sept. 21, 1966); [Remarks at the Swearing In of Nicholas deB. Katzenbach as Under Secretary of State](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-nicholas-deb-katzenbach-under-secretary-state) (Oct. 3, 1966); [Remarks at a Farewell Ceremony Honoring Former Under Secretary of State George W. Ball](https://www.presidency.ucsb.edu/documents/remarks-farewell-ceremony-honoring-former-under-secretary-state-george-w-ball) (Oct. 6, 1966). [[w.ball-past-has-another-pattern]]; [[w.katzenbach-some-of-it-was]]. Names: Ball (K–J Adm. III.E); Katzenbach, Clark (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:katzenbach-nicholas, name:clark-ramsey]
  - id: cal.1966-09-21.opinion
    when: Sept. 21
    date: '1966-09-21'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 8–13: Johnson''s handling of Vietnam: approve 43 percent, disapprove 40. Democrats 53 approve, 30 disapprove; independents 36 and 45; Republicans 34 and 52.'
    n: '[[w.gallup-poll]], III, 2027–29. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-22.vietnam
    when: Sept. 22
    date: '1966-09-22'
    thread: vietnam
    c: 'Goldberg to the General Assembly at the opening of its 21st session: the United States "prepared to order a cessation of all bombing of North Viet-Nam the moment we are assured, privately or otherwise, that this step will be answered promptly by a corresponding and appropriate de-escalation on the other side." Rostow, sending Johnson the draft Sept. 21: the passages on Vietnam did "not go beyond existing policy."'
    n: 'FRUS 1964–68, IV, doc. [244](https://history.state.gov/historicaldocuments/frus1964-68v04/d244). *Department of State Bulletin*, Oct. 10, 1966, pp. 518–525. [[w.stebenne-arthur-j-goldberg]]; [[w.herring-lbj-and-vietnam]]. See [[cal.1966-01-03.vietnam]]. Names: Goldberg, Rostow (K–J Adm. III.E).'
    tags: [name:goldberg-arthur-j, name:rostow-walt-w]
  - id: cal.1966-09-23.jobs-and-wages
    when: Sept. 23
    date: '1966-09-23'
    thread: jobs-and-wages
    c: 'Fair Labor Standards Amendments signed in the Cabinet Room, [80 Stat. 830](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg830.pdf): the minimum wage from $1.25 an hour to $1.40 Feb. 1, 1967, and $1.60 a year later; about 8 million more workers covered, farm workers for the first time, from $1 an hour, farm workers to $1.30 by 1969, the others to $1.60 by 1971. The House agreed to the conference report Sept. 7, [260–89](https://voteview.com/rollcall/RH0890327), recommittal refused, [163–183](https://voteview.com/rollcall/RH0890326); the Senate Sept. 14, [55–38](https://voteview.com/rollcall/RS0890446).'
    n: '[Remarks at the Signing of the Fair Labor Standards Amendments of 1966](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-fair-labor-standards-amendments-1966) (Sept. 23, 1966). [112 Cong. Rec., House, Sept. 7, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt16/pdf/GPO-CRECB-1966-pt16-7-2.pdf); [112 Cong. Rec., Senate, Sept. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt17/pdf/GPO-CRECB-1966-pt17-2-2.pdf). [[w.nordlund-quest-for-a-living]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-23.opinion
    when: Sept. 23
    date: '1966-09-23'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, special survey of persons drawn from *Who''s Who in America*, 1966: Republicans four in ten of them; of the public about one in four. The Republicans'' choice for 1968: Romney 40 percent, Nixon 29, Goldwater 6, Scranton 3. The independents'': Romney 40, Nixon 14, Goldwater 4, Scranton 3, Lindsay 3, Javits 2. Would run for the Senate if asked, expenses paid: yes 24.'
    n: '[[w.gallup-poll]], III, 2029–30. Names: Romney, Scranton (Opp. III.H); Nixon (Opp. III.E); Goldwater, Javits (Opp. III.B); Lindsay (Opp. III.D).'
    tags: [name:romney-george-w, name:nixon-richard-m, name:goldwater-barry-m, name:scranton-william-w, name:lindsay-john-v, name:javits-jacob-k]
  - id: cal.1966-09-25.opinion
    when: Sept. 25
    date: '1966-09-25'
    thread: opinion
    also: [vietnam, europe-and-the-alliance]
    c: 'Gallup, Aug. 18–23, and like surveys in Britain and Canada: the United States should begin to withdraw its troops, carry on at its present level of fighting, or increase its attacks on North Vietnam. United States: 18, 18, 55 percent. Britain: 42, 17, 16. Canada: 31, 18, 27.'
    n: '[[w.gallup-poll]], III, 2030.'
  - id: cal.1966-09-26.europe-and-the-alliance
    when: Sept. 26–27
    date: '1966-09-26'
    thread: europe-and-the-alliance
    c: 'Erhard in Washington. Joint statement, Sept. 27: the Federal Republic to "make every effort fully to meet the current offset agreement," but unable in future fully to offset the cost of American forces in Germany by buying American arms; the threat, the forces needed, and the burden to be reexamined in talks of the United States, Germany and Britain. Reunification "one of the most significant goals of American foreign policy." Oct. 11, McCloy named the American in the talks, to open at Bonn Oct. 20.'
    n: '[Toasts of the President and Chancellor Erhard of Germany](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-chancellor-erhard-germany) (Sept. 26, 1966); [Joint Statement Following Discussions With Chancellor Erhard of Germany](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard-germany-0) (Sept. 27, 1966); [Statement by the President on the Forthcoming Conversations Between Washington, London, and Bonn](https://www.presidency.ucsb.edu/documents/statement-the-president-the-forthcoming-conversations-between-washington-london-and-bonn) (Oct. 11, 1966). FRUS 1964–68, XV, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v15/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v15/d176), [177](https://history.state.gov/historicaldocuments/frus1964-68v15/d177), [178](https://history.state.gov/historicaldocuments/frus1964-68v15/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v15/d179), [180](https://history.state.gov/historicaldocuments/frus1964-68v15/d180); XIII, doc. [207](https://history.state.gov/historicaldocuments/frus1964-68v13/d207). [[w.zimmermann-money-and-security]]; [[w.gavin-gold-dollars-and-power]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.bird-chairman]]. See [[cal.1965-12-20.europe-and-the-alliance]].'
    tags: [name:erhard-ludwig, name:mccloy-john-j, name:johnson-lyndon-b]
  - id: cal.1966-09-27.states-and-cities-san-francisco
    when: Sept. 27–Oct. 2
    date: '1966-09-27'
    thread: states-and-cities
    c: 'San Francisco. A policeman shoots Matthew Johnson, 16, running from a stolen car at Hunters Point, Sept. 27; rioting at Hunters Point and in the Fillmore. Shelley asks for the Guard, 11:39 p.m.; Brown sends 2,000; a curfew. Sept. 28, police fire into the Bayview Community Center. Emergency ended Oct. 2. The police report: 457 arrested, 160 hurt.'
    n: 'San Francisco Police Department, *128 Hours* (1966) (Check the title), as [Wikipedia, "Hunters Point social uprising (1966)"](https://en.wikipedia.org/wiki/Hunters_Point_social_uprising_%281966%29) gives it. [[w.crowe-prophets-of-rage]]. See [[cal.1965-08-11.states-and-cities]]. Names: Brown (K–J Cong. III.F); Johnson (K–J Cong. III.K).'
    tags: [state:ca, city:san-francisco, name:johnson-matthew, name:shelley-john-f, name:brown-edmund-g]
  - id: cal.1966-09-28.opinion
    when: Sept. 28
    date: '1966-09-28'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Sept. 8–13: the Johnson Administration pushing integration too fast, 52 percent; about right, 29; not fast enough, 10. Southern whites 76 too fast; whites outside the South 52. Non-whites: too fast 5, about right 51, not fast enough 32. Republicans 61 too fast; independents 61; Democrats 44.'
    n: '[[w.gallup-poll]], III, 2030–31. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09-29.poverty
    when: Sept. 29–Oct. 20
    date: '1966-09-29'
    thread: poverty
    c: 'Economic Opportunity Amendments. House, Sept. 29: a motion to strike the enacting clause lost, [156–208](https://voteview.com/rollcall/RH0890348); recommittal with Quie''s substitute refused, [162–203](https://voteview.com/rollcall/RH0890350); passed, [210–156](https://voteview.com/rollcall/RH0890351). Senate, Oct. 4: Dirksen''s cut of the authorization to the budget''s $1.75 billion taken, [45–27](https://voteview.com/rollcall/RS0890466); an amendment barring aid to anyone who incited or carried on a riot, [39–32](https://voteview.com/rollcall/RS0890468); passed, [49–20](https://voteview.com/rollcall/RS0890469). The conference report through the House Oct. 20, [170–109](https://voteview.com/rollcall/RH0890386).'
    n: '[112 Cong. Rec., House, Sept. 29, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-4-2.pdf); [112 Cong. Rec., Senate, Oct. 4, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-7-2.pdf). [[w.davies-from-opportunity-to-entitlement]]; [[w.gillette-launching-the-war-on]]. See [[cal.1965-10-09.poverty]]. Names: Dirksen (K–J Cong. III.A).'
    tags: [name:quie-albert-h, name:dirksen-everett]
  - id: cal.1966-09-30.economy
    when: Sept. 30–Oct. 20
    date: '1966-09-30'
    thread: economy
    c: The suspension of the investment credit and of accelerated depreciation on buildings, H.R. 17607, through the House, [221–118](https://voteview.com/rollcall/RH0890353); the Senate Oct. 14, [38–19](https://voteview.com/rollcall/RS0890494), freight cars, trailers and semitrailers exempted, [41–28](https://voteview.com/rollcall/RS0890492). The conference report through the House Oct. 20, [161–76](https://voteview.com/rollcall/RH0890390). Signed Nov. 8, [80 Stat. 1508](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1508.pdf).
    n: '[112 Cong. Rec., House, Sept. 30, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt18/pdf/GPO-CRECB-1966-pt18-5-1.pdf); [112 Cong. Rec., Senate, Oct. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-2-1.pdf). See [[cal.1966-09-08.economy]].'
  - id: cal.1966-09-30.opinion
    when: Sept. 30
    date: '1966-09-30'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 8–13: the United States made a mistake sending troops to fight in Vietnam: yes 35 percent, no 49. Of those disapproving of Johnson''s handling of the war, 61 yes; of those approving, 16.'
    n: '[[w.gallup-poll]], III, 2031–32. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-09.desegregation-schools-nyc
    when: Sept.
    date: 1966-09
    thread: desegregation-schools
    c: 'New York. Intermediate School 201, in East Harlem, new and windowless, its pupils Negro and Puerto Rican: parents and community groups demand it be integrated or given a Negro principal and the community''s control; its opening put off. Check the dates.'
    n: '[[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]. See [[cal.1964-02-03.desegregation-schools]].'
    tags: [state:ny, city:nyc]
  - id: cal.1966-09.governors-id
    when: Sept.
    date: 1966-09
    thread: governors
    also: [elections-1966]
    c: Idaho. Herndon, the Democratic nominee for governor, killed with two others in the crash of a private plane in the mountains northwest of Stanley, Idaho, flying from Twin Falls, Idaho, to Coeur d'Alene, Idaho. Andrus named the nominee in his place. Check the day.
    n: '[Wikipedia, "Cecil Andrus"](https://en.wikipedia.org/wiki/Cecil_Andrus). [[w.peirce-mountain-states-of-america]]. See [[cal.1966-08-02.governors-id]]. Names: Herndon, Andrus (K–J Cong. III.K).'
    tags: [state:id, name:herndon-charles, name:andrus-cecil-d]
