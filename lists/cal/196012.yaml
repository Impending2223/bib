    n: '[[w.schlesinger-thousand-days-1965]], 141, by Schlesinger''s account; [[w.wofford-of-kennedys-and-kings]], 83 (four days after Kennedy''s breakfast with Bowles; Rusk''s note to Bowles and Bowles''s answer: "He''s going to ask you to become Secretary of State"). [[w.rusk-as-i-saw-it-1990]], 201–02. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-12-01.transition-and-staff]]. Names: Lovett, McCloy, Bowles, Bunche, Rusk, Kennedy.'
