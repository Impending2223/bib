    place: xuanwei
    thread: china-famine
    c: 'Xuanwei 宣威 county, Yunnan 雲南, Adu 阿都 commune, evening.{1} A rising spreads to two neighboring communes: 417 people of 37 production teams in 13 management districts.{2} Its cries: a second land reform, the land divided to households, no grain tax and no sale of surplus; the mess halls disbanded, the grain shared out; free markets, no grain, cloth or meal tickets; "the land goes home."{3}'
    n: '[[w.yang-jisheng-mubei]], II, 1172 (the book''s chronology); [[w.yang-jisheng-mubei]], I, 519 (n.t1: the investigation report on the Xuanwei riot, dated Nov. 30, 1960, as the book quotes it: Dec. 24, evening, Adu commune; two more communes; 13 districts, 37 teams, 417 people; the troops on the 25th, the riot over on the 26th); [[w.dikotter-maos-great-famine]], 227 n.24 (villagers of Xuanwei county rise in the autumn of 1960, backed by local cadres; the rising spreads to several communes; weapons are seized; the army captures and eliminates all but one of the leaders); [[w.yang-jisheng-mubei]], II, 1043 n.25 (December 1960, the "counterrevolutionary riot" at Xuanwei; the note refers to the book''s Yunnan chapter). The words: 晚 (II, 1172). Made public: 2008. Check: the date. The investigation report quoted for it is dated Nov. 30, 1960, and Xie Fuzhi''s report of Dec. 2, after over half a month''s work, follows it (I, 519–520); the book prints Dec. 24 in both places (I, 519; II, 1172), which cannot be Dec. 24, 1960: Nov. 24, 1960, or Dec. 24, 1959. To check: Yunnan Provincial Archives, Nov. 30, 1960, 2-1-4108, pp. 72–75 (cited by [[w.dikotter-maos-great-famine]], 227 n.24a); Yunnan Provincial Archives, Dec. 2, 1960, 2-1-4108, pp. 1–2 (cited by [[w.dikotter-maos-great-famine]], 227 n.24b); Yunnan Provincial Archives, Nov. 8 and Dec. 9, 1960, 2-1-4432, pp. 1–10 and 50–57 (cited by [[w.dikotter-maos-great-famine]], 227 n.24c, d).'
