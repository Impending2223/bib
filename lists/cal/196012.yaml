    also: [laos, vietnam-diplomacy, china-foreign]
    c: 'The Qinzheng Hall.{1} Mao receives Prince Sihanouk, Cambodia''s head of state, his wife and Penn Nouth, Prime Minister, at dinner;{2} Liu Shaoqi, Zhu De, Zhou Enlai, Peng Zhen, Chen Yi and others present.{3} In his absence Laos has changed: Phoumi, backed by America, its guns and officers, has taken most of Vientiane; Laos now America''s question, not Britain''s or France''s.{4} Per the Chinese record, Mao passes on Hồ Chí Minh''s greetings, his invitation to visit the DRV and his request for diplomatic relations; Sihanouk cannot go now, returning to Phnom Penh Dec. 26, and keeps no relations with a divided country, offering consulates instead, as in New Delhi.{5}'
    n: '"[Memorandum of Chairman Mao''s Conversation with Sihanouk on 17 December 1960](https://digitalarchive.umd.edu/document/120870)" (Dec. 17, 1960), PRC FMA 106-00274-01, 1–7, obtained by Yiming Feng, trans. Jake Tompkins, Wilson Center Digital Archive. [[w.zedong-mao-zedong-nianpu]], IV, Dec. 17, 1960. [[w.zhou-enlai-nianpu-1949]], II, 380, Dec. 17, 1960 (Zhou present). [[w.zhou-enlai-waijiao-huodong]], 296 (Dec. 17, 1960; 下午5时, 中南海勤政殿, with Deng Yingchao); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 499 (Dec. 17, 1960; Liu, with Mao, Zhu De and Zhou Enlai, meets Sihanouk); [[w.chen-yi-nianpu]], 848 (Dec. 17, 1960, afternoon, the Qinzheng Hall; Chen Yi present when Mao receives Sihanouk and his wife); [[w.peng-zhen-nianpu-1902]], IV, 84 (Dec. 17, 1960, afternoon; Peng Zhen accompanies Mao, Liu Shaoqi, Zhu De, Zhou Enlai and others in meeting the prince in the Qinzheng Hall); [[w.guan-vietnamese-communists-relations-with]], 173. The words: "Time: 17 December 1960, 5:00pm / Location: Zhongnanhai Government Reception Hall" (the record''s heading). Made public: 1993. Names: Mao Zedong, Sihanouk, Penn Nouth, Phoumi, Liu Shaoqi, Zhu De, Zhou Enlai, Peng Zhen, Chen Yi, Hồ Chí Minh.'
