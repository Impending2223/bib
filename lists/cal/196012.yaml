  - id: cal.1960-12.transition-and-staff-cabinet-10
    when: Dec.
    date: 1960-12
    thread: transition-and-staff-cabinet
    c: 'Gene Farmer of *Life* to Fulbright at Fayetteville, by telephone: he has it from the Kennedy camp that Fulbright will be Secretary of State, and wants to begin a profile. Fulbright puts him off. A family conference follows; Fulbright does not want the job, but if offered it would have to accept.'
