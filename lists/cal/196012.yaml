    when: Dec. 31
    date: '1960-12-31'
    place: palm-beach
    thread: soviet-union
    c: Palm Beach, New Year's Eve. The Soviet Embassy telephones Salinger's suite to dictate Khrushchev's New Year greeting to the President-elect. Salinger's son Marc passes the call to Merriman Smith, who takes it down. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 61–62. Split under R25b and R17: Salinger, 62, gives the delivery of the greeting to him its own day and hour ("at about 2 a.m. New Year''s morning") and the handing of it to Kennedy its own ("the next morning"); each is an entry of Jan. 1. Names: Khrushchev, Salinger.'
    src:
