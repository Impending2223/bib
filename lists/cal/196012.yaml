    c: The Chuxiong 楚雄 prefectural committee 地委 reports to the provincial committee on the problems of Taoyuan 桃園 district, Cangling 蒼嶺 commune, Chuxiong county 關於楚雄縣蒼嶺公社桃園管理區問題向省委的報告. Yu 余某, deputy secretary of the commune committee, before that the district's branch secretary, beat 46 members, killing four and maiming nine; of the district's 1,692 people 205 had wasting or edema and 98 died. In 1960 his household ate 162 jin of pork, 260 of beef, 46 chickens and 173 jin of fish; he won a bronze medal at the year's heroes' meeting.
