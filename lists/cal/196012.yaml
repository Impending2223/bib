  - id: cal.1960-12-12.soviet-union
    when: Dec. 12
    date: '1960-12-12'
    thread: soviet-union
    also: [robert-kennedy, transition-and-staff]
    c: 'Menshikov, the Soviet ambassador, at luncheon with Robert Kennedy at his invitation: Khrushchev admires the President-elect''s "intelligence and vigor" and thinks a "clear and friendly understanding" now possible; past trouble the fault of middle-level American officials; the Soviet Union, by Kennedy''s report to Rusk, has no objection to Berlin''s "remaining free under the United Nations."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 421–22. [FRUS 1961–63, V, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v05/d2) (Bruce''s diary, Jan. 5, 1961: Menshikov''s talks with Harriman, Robert Kennedy, Stevenson and Salisbury, of which there were memoranda). To check: Robert Kennedy to Rusk, Dec. 1960, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 422 n.23). Names: Menshikov, Robert Kennedy, Khrushchev, Rusk.'
