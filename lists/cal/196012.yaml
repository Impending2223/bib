  - id: cal.1960-12.transition-and-staff-5
    when: Dec.
    date: 1960-12
    thread: transition-and-staff
    c: The talent search's office, supper time. The President-elect telephones, asks who is leaking the Cabinet names, and has the secretary tell Yarmolinsky, Shriver, Wofford and anyone else that if they are doing it they had better stop. Most of the leaks, they later learn, came from Kennedy himself. By Wofford's account.
    n: '[[w.wofford-of-kennedys-and-kings]], 74. Check: the month; Wofford: during the weeks of the talent search. Names: Kennedy, Yarmolinsky, Shriver, Wofford.'
