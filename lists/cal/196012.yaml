        - 'via w.bird-color-of-truth 152 n.101: all'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge, name:rusk-dean, name:bowles-chester]
  - id: cal.1960-12.transition-and-staff-cabinet-7
    when: Dec.
    date: 1960-12
    thread: transition-and-staff-cabinet
    c: 'Fulbright, by telephone, asks Russell, bound for Palm Beach, to tell Kennedy he does not want State: more use as chairman, and his successor in the Senate likely Faubus. By Holt''s recollection.'
    n: '[[w.woods-fulbright]], 256. Check: the day; Woods sets it after the London conference and before Christmas. To check: Pat M. Holt, oral history, 149–50, Senate Historical Office; Jack Yingling, interview by Woods, Oct. 12, 1988 (cited by [[w.woods-fulbright]], 256 nn.31–32). Names: Fulbright, Russell, Kennedy, Faubus.'
