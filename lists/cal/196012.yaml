  - id: cal.1960-12-01.transition-and-staff-3
    when: Dec. 1
    date: '1960-12-01'
    time: 1960-12-01T15:00Z
    thread: transition-and-staff
    also: [soviet-union, robert-kennedy]
    c: '10 a.m., the transition office. Robert Kennedy, thirty minutes with "Mr. B." of *Izvestia*, of the KGB''s New York residency, for his brother by the KGB''s report to Khrushchev: better relations; a test ban possible in 1961, no underground tests resumed meanwhile; a summit only if results are sure, and not in the first three or four months; under pressure on Berlin, the West''s position defended; China the fundamental problem.'
    n: '[[w.fursenko-one-hell-of-a]], 81–82; [[w.fursenko-khrushchevs-cold-war]], 341 ("if in the next few months the Soviet Union applies pressure on this question, then Kennedy will certainly defend the position of the West"). To check: Robert Kennedy''s telephone log, 1960, RFK Pre-Administration Political Files, JFK Library (cited by [[w.fursenko-one-hell-of-a]], 81 n.18, the hour); Shelepin to Khrushchev, Dec. 3, 1960, SVR (cited by [[w.fursenko-one-hell-of-a]], 82 n.19). Names: Robert Kennedy, Khrushchev.'
    src:
      c: 315def71
      rows:
        - 'w.fursenko-one-hell-of-a 81–82: all'
        - 'via w.fursenko-one-hell-of-a 81 n.18: A-B'
        - 'via w.fursenko-one-hell-of-a 82 n.19: B-F'
        - 'w.fursenko-khrushchevs-cold-war 341: all'
    tags: [name:kennedy-robert-f, name:khrushchev-nikita-s, name:shelepin-aleksandr-n]
  - id: cal.1960-12-01.transition-and-staff-cabinet-2
    when: Dec. 1
    date: '1960-12-01'
    thread: transition-and-staff-cabinet
    also: [civil-rights-organizations]
    c: 'The NAACP''s John A. Morsell, in a statement: Fulbright as Secretary of State "one of the most colossal blunders of any administration." He asks a national campaign against any signer of the Southern Manifesto in the Cabinet.'
    n: '[[w.woods-fulbright]], 257; [[w.wofford-of-kennedys-and-kings]], 82 (Negro leaders and civil rights forces against Fulbright for the Southern Manifesto and his brief in *Aaron v. Cooper*; Kennedy "struck Fulbright''s name from the list"; not Morsell or the statement). To check: "NAACP Opposes Post for Senator," *Arkansas Democrat*, Dec. 1, 1960; Gloria Newton to Kennedy, Dec. 8, 1960, Fulbright Name File, Kennedy Papers (cited by [[w.woods-fulbright]], 258 n.38). See [[cal.1960-12-01.transition-and-staff-2]]. Names: Fulbright.'
    src:
