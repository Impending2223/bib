  - id: cal.1960-12-06.transition-and-staff
    when: Dec. 6
    date: '1960-12-06'
    thread: transition-and-staff
    c: Eisenhower receives Kennedy at the White House, alone, then with Herter, Gates, Anderson, Persons and Clifford. The White House staff, the NSC, NATO, the balance of payments. Eisenhower advises against reorganizing before Kennedy knows the work.
    n: 'Joint Statement by the President and President-Elect Kennedy, [1960–61 Pub. Papers 872](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=924). FRUS 1958–60, III, doc. [128](https://history.state.gov/historicaldocuments/frus1958-60v03/d128); IV, doc. [62](https://history.state.gov/historicaldocuments/frus1958-60v04/d62) (Anderson''s record). Eisenhower''s account: [[w.eisenhower-white-house-years]], 712–716. [[w.schlesinger-thousand-days-1965]], 126. [[w.kallina-kennedy-v-nixon]], 187–88. [[w.gavin-gold-dollars-and-power]], 55–56, 62 (the balance of payments). [[w.reeves-president-kennedy]], 22–23 (the talk alone and with the Cabinet members after; Eisenhower''s advice). To check: John Sharon and George Ball to Kennedy, Dec. 5, 1960, President''s Office Files, box 29a, Kennedy Library; "Briefing Memoranda for Meeting with President Eisenhower Tuesday December 6, 1960", President''s Office Files, box 29a, Kennedy Library; "Informal List of Subjects to Be Discussed at Meeting of President Eisenhower and Senator John F. Kennedy," Dec. 5, 1960, President''s Office Files, box 29a, Kennedy Library; "Topics for Discussion with President-elect Kennedy," Dec. 6, 1960, Ann Whitman File, Presidential Transition Series, box 1, Eisenhower Library; Eisenhower, "Account of My December 6th, 1960 meeting with President-elect Kennedy", Ann Whitman File, Presidential Transition Series, box 1, Eisenhower Library; Wilton Persons, memorandum for the record, Dec. 6, 1960, Ann Whitman File, Presidential Transition Series, box 1, Eisenhower Library; *Time*, Dec. 19, 1960 (cited by [[w.reeves-president-kennedy]], 22); Wilton Persons, oral history, 144, Columbia University (cited by [[w.reeves-president-kennedy]], 23). See [[cal.1960-11-09.transition-and-staff]]. Names: Eisenhower, Herter, Gates, Anderson, Persons, Kennedy, Clifford.'
