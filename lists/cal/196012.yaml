    c: 'The Yinian Tang. Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries: the bureaus on the villages'' food and the rectification of the communes; how the work conference is to go.{1} Mao: counties, communes and brigades about three good, five middling, two bad in ten, some of the bad with power seized;{2} cadres in six classes, the first two counterrevolutionaries, the third the "dead bureaucrats," indirect allies of the enemy.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 23, 1960. [[w.yang-jisheng-mubei]], II, 1139 n.62 (the book puts Mao''s division of rural cadres into six kinds at the Central Work Conference of Dec. 24, 1960 to Jan. 13, 1961: the first, five-class elements and revived landlords, counterrevolutionaries; the second, once good and gone bad, drawn over, also counterrevolutionaries; the third, dead bureaucrats, enemies; the fourth to sixth, the muddled, the half-informed and the clear-headed, good; the first three of enemy contradiction, to be met by rousing the masses to class struggle); [[w.yang-jisheng-mubei]], II, 1139–1141 n.63 (Liao Zhigao''s letter of Dec. 25 relays Mao''s words of Dec. 23 on the six kinds of cadres, 90 percent of them good); [[w.peng-zhen-nianpu-1902]], IV, 86 (Dec. 23, 1960, evening, the Yinian Tang; Peng Zhen, with Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Tan Zhenlin and others, at Mao''s meeting with the regional bureaus'' secretaries, hearing reports on rural livelihood and the rectification of the communes and on how to hold the work conference); [[w.zhu-de-nianpu-xinbian]], III, 1790 (Dec. 23, 1960; Zhu De 朱德 at the meeting of the regional bureaus'' first and second secretaries Mao Zedong 毛泽东 calls, hearing reports on the arrangement of life in the villages and discussing how to hold the Central Work Conference; Liu Shaoqi, Chen Yun, Deng Xiaoping, Peng Zhen, Tan Zhenlin and others there); [[w.chen-yun-nianpu-xiuding]], III, 60 (evening: Chen Yun with Liu Shaoqi, Zhu De, Deng Xiaoping and others at the meeting Mao calls of the regional bureaus'' first and second secretaries, on the villages'' livelihood and the coming work conference''s agenda; the six regional bureaus set up by the Politburo in September 1960 (the nianpu''s note)). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 67). [[w.deng-xiaoping-nianpu-1904]], III, 1606 (Dec. 23, 1960; evening; Deng at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries: rural livelihood, the rectification of the communes, the work conference); [[w.mao-zedong-zhuan]], V, ch. 67 n.1 (Dec. 23, before the conference opens, the first report: counties, communes and brigades about three good, five middling, two bad; in some of the bad the leadership seized by others; cadres in six classes, the first three enemies, the last three good, the "dead bureaucrats" among the third). Names: Mao Zedong, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Tan Zhenlin, Chen Boda, Ke Qingshi, Zeng Xisheng, Tao Zhu, Wang Renzhong, Song Renqiong, Li Xuefeng, Li Jingquan, Liu Zihou.'
