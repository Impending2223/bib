  - id: cal.1960-12-05.testing
    when: Dec. 5
    date: '1960-12-05'
    thread: testing
    c: The Geneva conference on stopping nuclear tests recesses, on the American proposal, to meet again in February under the new administration. Herter's proposal shown to Clifford beforehand.
    n: 'FRUS 1958–60, III, doc. [264](https://history.state.gov/historicaldocuments/frus1958-60v03/d264). [[w.watson-into-the-missile-age]], 729 (the recess, Dec. 5, to meet again Feb. 7). To check: [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.divine-blowing-on-the-wind]]; [[w.seaborg-kennedy-khrushchev-and-the]]; Department of State, *Geneva Conference on the Discontinuance of Nuclear Weapon Tests*, 114–21 (cited by [[w.watson-into-the-missile-age]], 729 n.213). Names: Herter, Clifford.'
