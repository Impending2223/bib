  - id: cal.1960-12-01.transition-and-staff
    when: Dec. 1
    date: '1960-12-01'
    thread: transition-and-staff-cabinet
    c: The cabinet named, the first of it. Kennedy names Ribicoff Secretary of Health, Education, and Welfare; Williams Assistant Secretary of State for African Affairs.
    n: 'The hearing: *Nominations of Murat W. Williams, George W. Ball, Roger W. Jones, and G. Mennen Williams: Hearing Before the S. Comm. on Foreign Relations*, 87th Cong. (1961) ([online](https://www.govinfo.gov/app/details/CHRG-87shrg64718)), 2 (Williams, Jan. 24). [[w.schlesinger-thousand-days-1965]], 129–31 (Williams announced that morning; Ribicoff and Hodges decided); [[w.wofford-of-kennedys-and-kings]], 85, 89 (Williams named before Rusk, passed over for HEW, which Ribicoff would carry better through Congress; Ribicoff had refused the Attorney Generalship, by Robert Kennedy''s oral history); [[w.schlesinger-robert-kennedy-and-his]], 227 (Ribicoff to HEW, having been offered Justice first; the day not given). To check: [[w.schoenbaum-waging-war-and-peace]] (on Rusk); [[w.shapley-promise-and-power]] (on McNamara); [[w.halberstam-best-and-the-brightest]]; [[w.bowles-promises-to-keep]]. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Ribicoff, Williams.'
