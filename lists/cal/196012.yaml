  - id: cal.1960-12-17.transition-and-staff-cabinet
    when: Dec. 17
    date: '1960-12-17'
    thread: transition-and-staff-cabinet
    c: Day to the Post Office, the last of the cabinet.
    n: '[[w.schlesinger-thousand-days-1965]], 144–45. See [[cal.1960-12-01.transition-and-staff]]. Names: Day.'
    tags: [name:kennedy-john-f, name:day-j-edward]
  - id: cal.1960-12-19.elections-1960
    when: Dec. 19
    date: '1960-12-19'
    thread: elections-1960
    also: [electoral-college]
    c: 'The electors vote in the State capitals. Kennedy 300, Nixon 219; Byrd 15: Mississippi''s eight unpledged electors, six of Alabama''s eleven, and one Oklahoma Republican, who gives Goldwater his vote for Vice President; Thurmond 14. Hawaii''s two slates both vote, its recount unfinished.'
    n: '[The 1960 certificates](https://www.archives.gov/electoral-college/1960) (National Archives). Illinois, the Chicago recount, and the Republicans'' challenges: [[w.kallina-courthouse-over-white-house]]. See [[cal.1960-11-08.elections-1960]]. Names: Kennedy, Nixon, Byrd, Thurmond, Goldwater.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:byrd-harry-f, name:goldwater-barry-m, name:thurmond-strom]
  - id: cal.1960-12-20.vietnam
    when: Dec. 20
    date: '1960-12-20'
    thread: vietnam
    c: The National Front for the Liberation of South Vietnam founded at a congress in Tây Ninh province, as the Lao Động party's congress in Hanoi resolved in September. Its manifesto and ten-point program against Diệm's government and the American presence.
    n: 'The manifesto and program: [[w.vietnam-and-america]]. Made public: Hanoi radio, Jan. 29, 1961 (Check). [[w.vietnam-victory-in-vietnam]], 67 (the Front born, Dec. 20, 1960); [[w.schulimson-joint-chiefs-of-staff]], 70 (the founding, Dec. 20, near the Cambodian border); [[w.asselin-hanois-road-to-the]], 87–89 (the Front''s founding in December; its ten points). The war itself: Viet. II.B. To check: [[w.pike-viet-cong]]; [[w.thayer-war-by-other-means]]; [[w.brigham-guerrilla-diplomacy]]; [[w.tang-vietcong-memoir]]; [[w.elliott-vietnamese-war]]; [[w.race-war-comes-to-long]]. Check: Asselin, 88, has the program adopted in February 1961.'
    src:
      c: 09de93c0
      rows:
        - 'w.vietnam-victory-in-vietnam 67: A'
        - 'w.asselin-hanois-road-to-the 87–89: ?'
        - 'w.schulimson-joint-chiefs-of-staff 70: A'
    tags: [province:tay-ninh]
  - id: cal.1960-12-20.middle-east-dimona
    when: Dec. 20
    date: '1960-12-20'
    thread: middle-east-dimona
    c: 'Harman to the State Department: a 24-megawatt research reactor, for peaceful purposes, begun a year ago.'
    n: 'FRUS 1958–60, XIII, doc. [180](https://history.state.gov/historicaldocuments/frus1958-60v13/d180). See [[cal.1960-12-08.middle-east]]. Names: Harman.'
    tags: [name:harman-avraham]
  - id: cal.1960-12-21.middle-east-dimona
    when: Dec. 21
    date: '1960-12-21'
    thread: middle-east-dimona
    c: 'Ben Gurion to the Knesset on Dimona: a research reactor. The State Department''s statement the same day.'
    n: 'FRUS 1958–60, XIII, doc. [181](https://history.state.gov/historicaldocuments/frus1958-60v13/d181) (Merchant, Dec. 31). See [[cal.1960-12-08.middle-east]]. Names: Ben Gurion.'
    tags: [name:ben-gurion-david]
  - id: cal.1960-12-22.railroads
    when: Dec. 22
    date: '1960-12-22'
    thread: railroads
    c: Eisenhower names the Presidential Railroad Commission's fifteen members; Secretary of Labor Mitchell chairman, at both sides' request.
    n: 'Statement by the President on Appointing the Presidential Railroad Commission, [1960–61 Pub. Papers 880](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=932). See [[cal.1960-11-01.railroads]]. Names: Eisenhower, Mitchell.'
    tags: [name:eisenhower-dwight-d, name:mitchell-james-p]
  - id: cal.1960-12-22.congress
    when: Dec. 22
    date: '1960-12-22'
    thread: congress
    also: [elections-1962]
    c: Kennedy resigns his Senate seat.
    n: 'Kennedy''s letter to Governor Furcolo, and his letter to Nixon enclosing a copy, Dec. 22, 1960, laid before the Senate Jan. 3: [107 Cong. Rec. 4](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf#page=2) (1961). To check: [[w.clymer-edward-m-kennedy]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1960-12-23.foreign-aid
    when: Dec. 23
    date: '1960-12-23'
    thread: foreign-aid
    c: 'Eisenhower forbids disclosure to Hardy''s House subcommittee of documents on aid to seven South American countries: NSC and OCB papers, his officers'' advice, frank exchanges with foreign officials. Dated Dec. 2, released Dec. 23.'
    n: 'The President''s Certification as to His Forbidding Disclosure to Congress of Certain Documents Relating to Aid to South American Countries, [1960–61 Pub. Papers 881](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=933). Opinion: [41 Op. Att''y Gen. 507](https://archive.org/details/op-atty-gen/041/page/n541/mode/1up) (1960), Rogers to Eisenhower, Dec. 19: the Mutual Security Act''s proviso does not cut off the Inspector General and Comptroller''s funds for documents withheld under the President''s certificate; Congress cannot compel by a condition on appropriations what it cannot compel directly. To check: [[w.rozell-executive-privilege]]; [[w.berger-executive-privilege]]; [[w.schlesinger-imperial-presidency]]. Names: Eisenhower, Hardy.'
    tags: [name:eisenhower-dwight-d, name:hardy-porter-jr]
  - id: cal.1960-12-23.vietnam
    when: Dec. 23
    date: '1960-12-23'
    thread: vietnam
    c: 'Durbrow sees Diệm, an hour and three-quarters, and leaves State''s suggestions in writing: liberalizing measures announced at once, credit for the peasants, the Assembly to investigate the departments. Diệm pleasant and "basically negative": he wants 20,000 more troops, the Laotian crisis worsening, and has raised the Civil Guard to 64,000.'
    n: '[FRUS 1958–60, I, doc. 270](https://history.state.gov/historicaldocuments/frus1958-60v01/d270) (Durbrow, Dec. 24). [[w.gibbons-u-s-government-and]], I, 342 (Diệm "even less forthcoming than before"). Made public: [[w.def-u-s-viet-rels]], Book 10, 1348–51 (1971). See [[cal.1960-12-04.vietnam]]. Gibbons, I, 342, dates the meeting Dec. 24, the telegram''s date; Durbrow: "Diem didn''t receive me until 23rd." Names: Durbrow, Diệm.'
    tags: [name:durbrow-elbridge, name:ngo-dinh-diem]
  - id: cal.1960-12-24.oil
    when: Dec. 24
    date: '1960-12-24'
    thread: oil
    c: 'Eisenhower, Proclamation 3386: from Jan. 1, the import ceiling for Districts I–IV, 9 percent of the Bureau of Mines'' estimate of demand, raised or cut by 9 percent of the last period''s underestimate or overestimate. Districts I–IV: all but California, Oregon, Washington, Nevada, Arizona, Alaska, Hawaii and Puerto Rico.'
    n: '[Proclamation 3386](https://www.presidency.ucsb.edu/documents/proclamation-3386-modifying-proclamation-3279-march-10-1959-adjusting-imports-petroleum), [25 Fed. Reg. 13945](https://www.govinfo.gov/app/details/FR-1960-12-30); statement, [1960–61 Pub. Papers 886](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=938). See [[cal.1960-10-28.oil]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-12-27.congress
    when: Dec. 27
    date: '1960-12-27'
    thread: congress
    also: [elections-1962]
    c: Governor Furcolo appoints Benjamin A. Smith II, Kennedy's college roommate, to Kennedy's Senate seat.
    n: '[Cong. Rec., Senate, Jan. 3, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt1/pdf/GPO-CRECB-1961-pt1-1-1.pdf#page=2). See [[cal.1960-12-22.congress]]. Names: Furcolo, Benjamin Smith, Kennedy.'
    tags: [name:smith-benjamin-a-ii, name:furcolo-foster, name:kennedy-john-f]
  - id: cal.1960-12-28.elections-1960
    when: Dec. 28–30
    date: '1960-12-28'
    thread: elections-1960
    also: [electoral-college]
    c: 'Hawaii''s recount, ordered by Judge Jamieson, ends: Kennedy over Nixon, 92,410 to 92,295, 50.0 percent, a 115-vote margin, where the first count gave Nixon 141. Jamieson declares the Kennedy electors appointed, Dec. 30.'
    n: 'Haw. *Result of Votes Cast, General Election*, Nov. 8, 1960, ["Result of Recount"](https://archive.org/download/HI-hist/1960_General.pdf#page=23), [totals](https://archive.org/download/HI-hist/1960_General.pdf#page=28). Votes: [Clerk of the House, *Statistics of the Presidential and Congressional Election of November 8, 1960*, 11](https://clerk.house.gov/member_info/electionInfo/1960election.pdf) (Elections, 1960). See [[cal.1960-11-08.elections-1960]]. Names: Kennedy, Nixon, Jamieson.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:jamieson-ronald-b]
  - id: cal.1960-12-31.laos
    when: Dec. 31
    date: '1960-12-31'
    thread: laos
    c: 'Eisenhower with his advisers on Laos: Pathet Lao and Kong Le columns converging on Xieng Khouang, the Soviet airlift going on. More must be known before overt action, but Laos is not to be let fall. The Seventh Fleet''s marines and the 503rd at Okinawa alerted; Boun Oum to be pressed to have the assembly invest him.'
    n: 'FRUS 1958–60, XVI, docs. [492](https://history.state.gov/historicaldocuments/frus1958-60v16/d492) (NSC, Dec. 20), [496](https://history.state.gov/historicaldocuments/frus1958-60v16/d496) (NSC, Dec. 29), [498](https://history.state.gov/historicaldocuments/frus1958-60v16/d498). See [[cal.1960-08-09.laos]]. Names: Eisenhower, Kong Le, Boun Oum na Champassak.'
    tags: [name:eisenhower-dwight-d, name:kong-le, name:boun-oum-na-champassak]
  - id: cal.1960-12.oil
    when: Dec.
    date: 1960-12
    thread: oil
    c: 'The world''s crude oil output in 1960, as the Bureau of Mines first counted it: 21.0 million barrels a day. The United States 7.04, the Soviet Union 2.95, Venezuela 2.85, Kuwait 1.62, Saudi Arabia 1.25. Proved reserves, the Oil and Gas Journal''s year-end count: 301 billion barrels; Kuwait 62, Saudi Arabia 50, the United States 33.5.'
    n: 'Bureau of Mines, [*Minerals Yearbook 1960*, II, Table 89, pp. 486–487](https://archive.org/details/pub_usgov-minerals-yearbook_1960_2/page/n493) (1961); [*The Oil and Gas Journal*, Dec. 26, 1960, 98–99](https://archive.org/details/sim_oil-gas-journal_1960-12-26_58_52/page/n105). To check: [[w.adelman-world-petroleum-market]]; [[w.yergin-prize]].'
    tags: [oilworld:1960]
  - id: cal.1960-12.rules
    when: Dec.
    date: 1960-12
    thread: rules
    also: [democratic-party]
    c: A private dining room at the Sheraton-Carlton. Johnson tells Kerr, Humphrey, Smathers and Russell he will keep the chairmanship of the Senate Democrats' conference as Vice President; Mansfield, to succeed him as leader, has agreed, and to his keeping the Majority Leader's office.
    n: '[[w.caro-passage-of-power]], 164–65 (Humphrey''s account). Check the day. Names: Johnson, Kerr, Humphrey, Smathers, Russell, Mansfield.'
    tags: [name:johnson-lyndon-b, name:kerr-robert-s, name:humphrey-hubert-h, name:smathers-george-a, name:russell-richard-b, name:mansfield-mike]
