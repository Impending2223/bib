    tags: [name:fulbright-j-william, name:russell-richard-b, name:faubus-orval-e, name:kennedy-john-f]
  - id: cal.1960-12.transition-and-staff-cabinet-8
    when: Dec.
    date: 1960-12
    thread: transition-and-staff-cabinet
    c: 'Kennedy, at Palm Beach, telephones Fulbright at Little Rock: he will name Rusk. He asks Fulbright down to talk of appointments and policy.'
    n: '[[w.woods-fulbright]], 259. Check: the day. To check: Clara Buchanan, interview by Woods, June 7, 1989 (cited by [[w.woods-fulbright]], 259 n.46). See [[cal.1960-12-12.transition-and-staff-cabinet]]. Names: Kennedy, Fulbright, Rusk.'
