    also: [china-leadership]
    c: 'Moscow, the Kremlin''s St. George''s Hall. The conference holds its closing plenary and the heads of the delegations sign the Statement.{1} Liu Shaoqi speaks, as planned. He congratulates the conference: through all the labor an agreed programme and an Appeal to the world''s peoples have been made. Differences, natural and unavoidable, can be settled on the ground of Marxism–Leninism by consultation to agreement, the one right way. The conference had turns, difficulties, obstacles, struggle, and overcame them. China wants stronger unity, differences removed, attacks stopped, above all Sino-Soviet unity. The hall applauds many times.{2}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 424–425 (the plenary on "Dec. 1"); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 496 (Nov.–early Dec. 1960, the Moscow conference of the communist and workers'' parties; the Moscow Declaration adopted; heated argument between the CPSU and CPC delegations; Dec. 1, Liu''s speech for the Chinese Party on the world situation, war and peace, the tasks of the communist movement and the unity of the socialist camp); [[w.yang-shangkun-riji]], I, 635–636 (Dec. 1, 1960; from 11 a.m., Khrushchev presiding; Suslov''s report on the amendments, twenty minutes; Liu''s speech, the Soviets leading the applause; the statement, communiqué and appeal adopted, the communiqué for Dec. 2, the statement and appeal Dec. 6; a resolution backing Cuba, not to be published; on the Chinese proposal the Soviets sign first, then round from the left; Khrushchev''s short speech on unity, Liu standing to applaud; a group photograph; two hours); [[w.deng-xiaoping-nianpu-1904]], III, 1602 (Dec. 1, 1960; morning; Deng at the closing session; the communiqué, the Statement and the appeal to the peoples of the world adopted; Liu Shaoqi speaks and signs for the Chinese delegation); [[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 1, 1960, 11 a.m.; Peng Zhen at the closing plenary in the Kremlin; the communiqué, the Statement (the "Moscow Statement") and the Appeal to the Peoples of the World adopted and signed; Liu Shaoqi speaks and signs for the Chinese delegation); [[w.guan-vietnamese-communists-relations-with]], 168 (the Statement: the Five Principles of peaceful coexistence the right policy, wars of national liberation progressive and to be supported; independence by armed struggle or not, as conditions allow; the struggle against the imperialists'' war bases to be stepped up; a single national-democratic front of all patriotic forces). Made public: 1996. To check: [[w.sino-soviet-dispute]], 177–205 (cited by [[w.guan-vietnamese-communists-relations-with]], 168 n.62). See [[cal.1960-11-10.soviet-union]]. Names: Liu Shaoqi.'
