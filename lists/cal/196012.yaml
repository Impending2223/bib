    thread: republican-party
    also: [transition-and-staff]
    c: 'Two White House dinners, Mrs. Eisenhower presiding, by Nixon''s account.{1} At each Eisenhower toasts Nixon and his wife for their part in his Administration and the campaign.{2} At one, by Nixon''s account elsewhere, Nixon beside Mrs. Eisenhower: she urges him to write the story of his trips to South America and Russia.{3}'
