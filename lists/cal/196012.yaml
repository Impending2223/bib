    place: peking
    thread: china-twelve-articles
    also: [china-moscow-1960, china-famine, china-economy]
    c: 'Peking.{1} The Central Work Conference opens (to Jan. 13, 1961): the rectification of the communes and the "five winds," the 1961 plan, the report on the Moscow conference.Its minutes add to the Twelve Articles: rectification at the bad communes first;{2} whatever was levelled and transferred paid back in kind, 2.5 billion yuan from the state for it;{3} the grain purchase price raised, not the sale price;{4} private plots from 5 to 7 percent;{5} pigs chiefly private;{6} side lines and rural fairs allowed.{7} Chen Yun speaks on the way through the difficulties, from his three months'' inquiry. The conference also sets a billion yuan to raise the grain purchase price and raises the prices of oil-seed, pigs, poultry and eggs. Mao: socialist construction not to be rushed, half a century; 1961 a year of seeking truth from facts. The Center puts Chen Yun at the head of a small group on grain prices.{8} Peng Zhen attends.{9} Zhu De attends.{10}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 24, 1960 (the entry for Dec. 24, 1960–Jan. 13, 1961). [[w.zhou-enlai-nianpu-1949]], II, 381–82, Dec. 24, 1960 (the conference, Dec. 24 to Jan. 13, 1961, and its summary). [[w.macfarquhar-origins-of-the-cultural]], III, 12–13 (the conference and its decisions: procurement prices, compensation, private plots); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 500 (Dec. 24, 1960–Jan. 13, 1961; Liu attends the Central Work Conference: the 1961 national economic plan; the "Summary of the discussion on rectifying the style and the communes in the countryside and some policies on cadres"; every commune team in 1961 to take the Center''s Twelve Articles as its guide, check and correct the "communist wind", exaggeration, blind command, cadres'' privilege and coercive command, and settle the accounts for levelled and transferred goods; Mao urges a great wind of investigation and study; the conference prepares the Ninth Plenum); [[w.jianguo-yilai-mao-zedong]], XV, 444 (note 4: the Central Work Conference at Peking, Dec. 24, 1960–Jan. 13, 1961; the place and the dates only); [[w.yang-jisheng-mubei]], II, 1172 (the Central Work Conference, Dec. 24 to Jan. 13, 1961, takes up the movement of the international communists, the rectification of the rural communes and the correction of the five winds, and the 1961 plan); [[w.deng-xiaoping-nianpu-1904]], III, 1606–1607 (Dec. 24, 1960–Jan. 13, 1961; Deng attends; in preparation for the Ninth Plenum; the summary on rural rectification; all communes in 1961 to rectify by the Center''s twelve articles (footnote 1: the urgent directive letter of Nov. 3, 1960), the "five winds" corrected, transfers repaid; Mao: "man-made disaster", errors owned, half a century, 1961 a year of seeking truth from facts); [[w.yang-jisheng-tiandi-fanfu]], I, 81 (Dec. 24, 1960 to Jan. 13, 1961, on the rectification of the communes and the correction of the "five winds"); [[w.peng-zhen-nianpu-1902]], IV, 86 (Dec. 24, 1960–Jan. 13, 1961; Peng Zhen attends; the 1961 plan; the summary on rectifying the communes and certain policies; in 1961 every commune and brigade to rectify on the key link of the twelve articles, the "five winds" (communism, exaggeration, blind command, cadre privilege, coercion) corrected, the "levelling and transfers" (so the page''s note) reckoned and repaid; Mao: a wave of investigation, 1961 a year of seeking truth from facts); [[w.zhu-de-nianpu-xinbian]], III, 1790 (Dec. 24, 1960–Jan. 13, 1961; Zhu De 朱德 at the Central Work Conference 中共中央工作会议 in Peking 北京, on the 1961 plan, the trials of rectifying the communes in the past two months, the spread of the rectification and the carrying out of the Center''s emergency directive letter); [[w.chen-yun-nianpu-xiuding]], III, 60–61 (Chen Yun at the Central Work Conference, Dec. 24–Jan. 13; he speaks on the ways through the difficulties from his three months'' inquiry; a billion yuan for higher grain purchase prices, oil-seed, pig, poultry and egg prices raised, 2.5 billion yuan for compensation, private plots from 5 to 7 percent of the land, rural fairs freed; Mao: socialist construction not to be rushed, half a century; 1961 a year of seeking truth from facts; Dec. 24, pigs "raised publicly and privately, chiefly privately"); [[w.chen-yun-nianpu-xiuding]], III, 60–61; [[w.peng-zhen-nianpu-1902]], IV, 86; [[w.zhu-de-nianpu-xinbian]], III, 1790. Made public: 1996. To check: [[w.zhonggong-dangshi-dashi-nianbiao]], 310 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.13a); [[w.huainian-mao-zedong-tongzhi]], 216 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.13b); [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 287–89 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 12 n.13c); [[w.zhonghua-renmin-gongheguo-guomin]], 161 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.14b); [[w.zhonghua-renmin-gongheguo-shangye]], 210 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.14c); [[w.biji-tao-zhu]], 354 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 13 n.15d). Names: Mao Zedong, Chen Yun, Peng Zhen, Zhu De.'
