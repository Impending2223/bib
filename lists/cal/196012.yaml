    c: The National Front for the Liberation of South Vietnam founded at a congress in Tây Ninh province, as the Lao Động party's congress in Hanoi resolved in September.{1} Its manifesto and ten-point program against Diệm's government and the American presence.{2}
    n: 'The manifesto and program: [[w.vietnam-and-america]]. [[w.moyar-triumph-forsaken]], 103–04 (sixty of the party''s officials in the South, Dec. 20, near the Cambodian border; the founding program); [[w.futrell-united-states-air-force]], 58; [[w.mann-grand-delusion]], 220 (the NLF as of the end of 1960: the political successor to the Vietminh, with Communists, religious groups and parties among its members, and broad appeals for independence, social justice and reform; not the congress, Tây Ninh, the day, the manifesto or the program); [[w.lich-su-khang-chien-chong-my]], II, 386 (the congress at Tân Lập, Châu Thành district, Tây Ninh; the manifesto); [[w.guan-vietnamese-communists-relations-with]], 179 (at Tân Lập village, Châu Thành district, now Tân Biên, Tây Ninh). Made public: Hanoi radio, Jan. 29, 1961 (Check). [[w.vietnam-victory-in-vietnam]], 67 (the Front born, Dec. 20, 1960); [[w.schulimson-joint-chiefs-of-staff]], 70 (the founding, Dec. 20, near the Cambodian border); [[w.asselin-hanois-road-to-the]], 87–89 (the Front''s founding in December; its ten points). The war itself: Viet. II.B. To check: [[w.pike-viet-cong]]; [[w.thayer-war-by-other-means]]; [[w.brigham-guerrilla-diplomacy]]; [[w.tang-vietcong-memoir]]; [[w.elliott-vietnamese-war]]; [[w.race-war-comes-to-long]]; the Front''s manifesto and program, as an undated pamphlet prints them (cited by [[w.asselin-hanois-road-to-the]], 88 nn.99–100); "Program of the South Viet Nam National Front for Liberation," Dec. 20, 1960, TTU, Pike Collection, Unit V, box 1 (cited by [[w.moyar-triumph-forsaken]], 104 n.46); [[w.luong-lich-su-cach-mang]], 156 (cited by [[w.guan-vietnamese-communists-relations-with]], 179 n.2a); [[w.lich-su-quan-doi]], 120 (cited by [[w.guan-vietnamese-communists-relations-with]], 179 n.2b); [[w.tang-journal-of-a-vietcong]], 79–80 (cited by [[w.guan-vietnamese-communists-relations-with]], 179 n.2c). Check: Asselin, 88, has the program adopted in February 1961.'
