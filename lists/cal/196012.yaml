    c: 'Mao 毛泽东: the Propaganda Department''s *Xuanjiao dongtai* 宣教动态 no. 113 of Dec. 26, on educating the masses on grain, to be printed for those at the conference;{1} Jinzhou''s 锦州 experience very good, to be used in factories and mines, offices, schools and the army; the groups to discuss it. The piece, from the Liaoning 辽宁 committee''s industry department''s report of Oct. 24: output stalled since May–June over grain troubles; ''politics in command'', airing and debate, old workers'' recollections; at Jinzhou''s Factory 401, where 85 percent had made or backed grain troubles, rations cut by over 9,000 jin and no one complains.{2}'
