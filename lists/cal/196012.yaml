    c: 'Zhou Enlai receives the Vietnamese government''s economic and trade delegation under Vice-Premier Nguyễn Duy Trinh: first-five-year-plan targets should be set low enough to be exceeded each year, as Stalin said, but not very low, with a yearly check so they may be raised after the second and third years.{1} The Leap''s gains great, with faults, such as drawing too much rural labor to the cities; in Asian and African states industry and farming should go together, on two legs; the village feeds the town and is its market.{2}'
