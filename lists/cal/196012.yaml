    c: 'The Center issues its urgent directive on holding the steel output: the task of 18.6 million tons this year a matter watched at home and abroad, a political one;{1} from Nov. 21 steel, iron and coal output has fallen day by day, and unless that is reversed the target is in danger, to the harm of the political fight and next year''s leap; every area and department to seize the time.{2}'
