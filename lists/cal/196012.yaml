    c: Moscow, the Kremlin.{1} After the plenary the CPSU gives a great reception for the delegations.{2} Liu Shaoqi sits between Khrushchev and Brezhnev at the head table, Khrushchev cordial. Delegates who attacked China in the hall tell the Chinese that there were quarrels, some not civil, and that is past. The Chinese answer that disagreement is natural, parties differ in situation and experience, and that agreement was reached is good. Some delegations, Wu hears, had feared a break above all, and a split of the movement, which would have made going home hard for the Western parties.{3}
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 425–426 ("after the meeting"; the Kremlin banquet); [[w.yang-shangkun-riji]], I, 637 (Dec. 2, 1960; Dec. 2, "a whole four hours'' reception," 1 to 5 p.m.); [[w.deng-xiaoping-nianpu-1904]], III, 1602–1603 (Dec. 2, 1960, afternoon, by the chronology; Deng speaks for the Chinese delegation at the CPSU''s banquet: after the 1957 Declaration a second common program; the enemy''s hope of disunity, above all of China and the Soviet Union, answered; at the banquet he tells Suslov the two countries'' mass organizations should work closely and agree by consultation). Made public: 1999. Check: the Deng nianpu (III, 1602) puts the CPSU''s banquet for the delegations, Deng speaking for the Chinese, on the afternoon of Dec. 2, 1960. See [[cal.1960-12-01.soviet-union]]. Names: Liu Shaoqi, Khrushchev, Brezhnev.'
