  - id: cal.1960-12-26.china-leadership
    when: Dec. 26
    date: '1960-12-26'
    place: peking
    thread: china-moscow-1960
    also: [soviet-union]
    c: 'The Yinian Tang, evening.{1} Chervonenko and two counselors bring Mao the CPSU''s greetings on his birthday; Yang Shangkun present. Mao: the Moscow conference good, the drafting commission''s work much; argument "not a bad thing"; a plenum in January to back the two documents;{2} industry''s front to be shortened in 1961, heavy industry and building above all.{3} Mao: he has not chaired the Politburo since 1953–54 and "practically never speaks" at the Central Committee''s plenums; Liu Shaoqi has run the Politburo''s routine since 1956. Yan Mingfu, Zhu Jueren, Sudarikov and Rakhmanin are also present; the greetings are from the CPSU Central Committee and Khrushchev. More than an hour.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 26, 1960. [[w.brothers-in-arms]], 365–369 (the Soviet record: Chervonenko brings Mao the greetings of the CPSU Central Committee and Khrushchev; Mao: the Moscow conference a success, its editing commission of twenty-six parties fruitful, the arguments "not bad"; a plenum in January 1961 to support its decisions; the industrial front to be narrowed, capital investment cut; he no longer chairs the Politburo, Liu Shaoqi in charge of its routine since 1956; he waits to become an ordinary member of the Politburo; Yang Shangkun, Yan Mingfu, Zhu Jueren, Sudarikov and Rakhmanin present; more than an hour); [[w.westad-sino-soviet-alliance-and]], 179 (Mao''s only meeting with the Soviet ambassador that year, a birthday visit: he no longer chairs the Politburo and "practically never speaks" at the Central Committee; he backs the compromise documents of the Moscow conference); [[w.westad-introduction]], 26 (Mao confirms his support for the Moscow resolutions to Chervonenko in late December); [[w.brothers-in-arms]], 365–369. Made public: 1996 ([[w.scholars-bulletin-of-the-cold-1996]], 167–69, the Soviet record in English translation, cited by [[w.westad-sino-soviet-alliance-and]], 179 n.40). Names: Mao Zedong, Chervonenko, Yang Shangkun, Liu Shaoqi, Khrushchev, Yan Mingfu, Sudarikov.'
