  - id: cal.1960-12.china-leadership-32
    when: Dec.
    date: 1960-12
    thread: china-agriculture
    c: 'Chen Yun 陈云, two weeks running, meets seven or eight experts of the farm, trade and policy-research departments on raising pigs in the villages: the piglet''s growth from birth to fattening, the feed, fuel and work time and the returns of state, collective and household raising compared: pigs to be "chiefly private, public as an aid" 私养为主、公养为辅, against the Center''s 中共中央 earlier "chiefly public" and the "public and private together" of the State Council Finance and Trade Office''s 国务院财贸办公室 report the Center forwarded on Nov. 15.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 62. See [[cal.1960-12-24.china-leadership]], where the work conference adopts it on Dec. 24. Made public: 2015. Names: Chen Yun.'
