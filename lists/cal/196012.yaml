  - id: cal.1960-12-01.transition-and-staff-2
    when: Dec. 1
    date: '1960-12-01'
    time: 1960-12-01T17:00Z
    place: washington
    thread: transition-and-staff-cabinet
    c: Schlesinger with the President-elect at noon, his Senate office, then Georgetown, by Schlesinger's account.{1} Hodges and Ribicoff settled; Udall and Goldberg nearly.{2} Fulbright the likeliest for State. Kennedy asks after Stevenson for Attorney General;{3} Schlesinger names Harriman to Kennedy for Secretary of State;{6} Kennedy dismisses him as "old hat," by Schlesinger's journal.{7} Blair sounds Stevenson out that night, who prefers the UN.{4} Lovett to lunch.{5}
    n: '[[w.schlesinger-thousand-days-1965]], 129–31, 135, 139; [[w.schlesinger-journals]], 94–97 (the journal of Dec. 1: Evelyn Lincoln''s appointment for noon in the Senate office, Georgetown after, Lovett to lunch; Kennedy''s talk of Freeman, Goldberg and Udall, Fulbright ("I judge ... Bill is currently ahead for State"), then "What about Adlai for Attorney General?"; Kennedy: "I think I''ll call [Blair] tonight"; not Hodges or Ribicoff, nor Stevenson''s preference for the UN; at 95, after Schlesinger''s pitch for Youngman at Treasury, "What about Averell?" and Kennedy "something to the general effect that he was too old hat"; the page does not say for which post); [[w.schlesinger-robert-kennedy-and-his]], 224. Made public: [[w.schlesinger-thousand-days-1965]] (1965). To check: Schlesinger, journal, Dec. 1, 1960, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 224 n.7). See [[cal.1960-12-01.transition-and-staff]]. Names: Schlesinger, Kennedy, Hodges, Ribicoff, Udall, Goldberg, Fulbright, Stevenson, Blair, Lovett, Harriman.'
    src:
      c: '55525605'
      rows:
        - 'w.schlesinger-thousand-days-1965 129–31: 1, 2, 5'
        - 'w.schlesinger-thousand-days-1965 139: 3, 4'
