    n: '[[w.schlesinger-robert-kennedy-and-his]], 229–33, 237. The cabinet: [[cal.1960-12-01.transition-and-staff]]. [[w.schlesinger-thousand-days-1965]], 135–36, 141–42. To check: [[w.thomas-robert-kennedy]]; [[w.navasky-kennedy-justice]]; [[w.guthman-we-band-of-brothers]]; [[w.robert-kennedy-in-his]]. Names: Kennedy, Robert Kennedy, Dillon, White.'
