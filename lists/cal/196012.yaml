    n: '[[w.fursenko-khrushchevs-cold-war]], 333; [[w.anthony-war-in-northern-laos]], 33 (the Soviet airlift from Hanoi, from Dec. 4, food, fuel and military hardware). Check: Anthony dates the airlift''s start Dec. 4 (33). To check: Jacques Nevard, *New York Times*, Dec. 4 and 5, 1960 (cited by [[w.fursenko-khrushchevs-cold-war]], 333 nn.36–37); [[w.dommen-conflict-in-laos]], 166–67 (cited by [[w.anthony-war-in-northern-laos]], 33 n.2a); AmEmb Vientiane to SECSTATE, 1057, Dec. 6, 1960 (cited by [[w.anthony-war-in-northern-laos]], 33 n.2b). See [[cal.1960-11-23.laos]]. Names: Abramov.'
