  - id: cal.1960-12-04.transition-and-staff-cabinet
    when: Dec. 4
    date: '1960-12-04'
    thread: transition-and-staff-cabinet
    c: 'Williamsburg, Va. The Rockefeller Foundation''s trustees in session, Lovett, McCloy, Bowles, Bunche and Rusk among them. Rusk called out to the telephone: the President-elect asks him to Washington.'
    n: '[[w.schlesinger-thousand-days-1965]], 141, by Schlesinger''s account. [[w.rusk-as-i-saw-it-1990]], 201–02. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-12-01.transition-and-staff]]. Names: Lovett, McCloy, Bowles, Bunche, Rusk, Kennedy.'
