    c: 'The Presidium on Albania.{1} Khrushchev: no favors, nothing for free; talks at the highest level only, party and state. The naval base: held by the Soviet side alone, its twelve submarines Soviet until relations are normal, or all twelve taken away. Mikoyan: two to the Albanians outright, two mixed, under the Warsaw Pact command. No more work on the base; work on the radio station stopped; a protest at Soviet ships held up.{2} Khrushchev''s proposal on the base and the submarines adopted; the Defense and Foreign Ministries to draft the papers.{3}'
