    c: 'The Henan 河南 committee''s standing committee. Wang Renzhong 王任重, second secretary of the Central-South Bureau, Xu Zirong 徐子榮 and Wang Congwu 王從吾 speak on Xinyang 信陽. Wang Renzhong: Mao 毛澤東 has twice said the democratic revolution is not done; the enemy must be killed, a few thousand at least, perhaps ten thousand. Xu: the dead still mount, about an eighth of 8 million; five-kinds elements have formed organized counterrevolutionary groups. Wang Congwu: Mao''s instruction is borne out, the problem is counterrevolutionary restoration, and 14 of the 20 county first secretaries are found bad.'
