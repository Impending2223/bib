        - 'via w.bird-color-of-truth 152 n.103: all'
    tags: [name:lippmann-walter, name:kennedy-john-f, name:fulbright-j-william, name:rusk-dean, name:bundy-mcgeorge]
  - id: cal.1960-12.transition-and-staff-nsc-2
    when: Dec.
    date: 1960-12
    thread: transition-and-staff-nsc
    c: 'The Carlyle, New York: Kennedy asks McGeorge Bundy whether he would be "interested" in the under secretaryship of State for political affairs; days later, by telephone, the job "doesn''t exist any more," Rusk to be Secretary, Bowles under secretary.'
    n: '[[w.bird-color-of-truth]], 152 (Bundy''s account). See [[cal.1961-01-01.transition-and-staff-nsc]]. Names: Kennedy, McGeorge Bundy, Rusk, Bowles. Check: the day.'
