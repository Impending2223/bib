    c: 'Zhou Enlai presides at the Politburo, which hears Deng Xiaoping on his work during the Moscow conference.{1} Afternoon, the enlarged Politburo. Deng: Khrushchev and the CPSU criticized; the greatest gain, "agreement through consultation"; neither side wants a split; the argument ended for a stage, not finished.{2} Peng Zhen attends.{3} Zhu De attends.{4}'
