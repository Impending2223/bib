    c: 'Deng Xiaoping 邓小平 presides at the Secretariat 书记处 on putting industry in order and on preparing the work conference of the 24th. Deng: the field in disorder; a general policy for rules, discipline, quality, technique and the ranks; Mao''s six kinds of cadre; many things the Secretariat nodded through; errors not to be excused but analysed, handled with care; the plants put in order under the slogan of summing up experience.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1605–1606 (Dec. 22, 1960); [[w.peng-zhen-nianpu-1902]], IV, 85–86 (Dec. 22, 1960; the 223rd meeting; Peng Zhen there; putting industry in order and preparing the work conference of the 24th; Peng: back home, he feels the pressure of the difficulties; the twelve-article urgent directive (the page''s note: the Center''s urgent letter of Nov. 3, 1960, on present policy in the rural communes) gave agriculture a policy, industry needs one too; plans too big, no rest in two years, routine work crowding out political work, in Henan, Anhui and Hubei too; the provinces squeezed from both ends; "不要一面倒": when Chairman Mao speaks, the localities rush in regardless; seek truth from facts and the mass line; summarize, write papers, try them, then proceed). The words: 上午 (III, 1605). Deng: 好多东西是书记处点了头的 (III, 1606). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong.'
