    c: 'Moscow, *Pravda*''s offices, 10 p.m. Wu Lengxi, leaving the reception early, calls on the editor Satyukov and his deputies, who all come out to meet him. He congratulates them on the conference and gives two points from the party talks: *Renmin ribao* and *Pravda* will not polemicize; each will print the other''s editorial on the Statement the same day (*Renmin ribao*''s written at Moscow, a Russian draft in hand for Satyukov to polish; he asks for *Pravda*''s, Russian will do, to be translated at Peking). Satyukov has the CPSU''s instructions on the first; the second surprises him, and he has none; Wu tells him to telephone Suslov; he takes the text. Wu invites him to Peking; Satyukov, who came for the Eighth Congress in 1956 and saw only hotels, accepts, and hopes Wu will come as *Pravda*''s guest.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 428–430 ("10 o''clock in the evening", by appointment). Made public: 1999. See [[cal.1960-11-30.soviet-union-2]]. Names: Suslov, Wu Lengxi, Satyukov.'
    src:
