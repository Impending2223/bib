  - id: cal.1960-12-01.transition-and-staff-cabinet-3
    when: Dec. 1
    date: '1960-12-01'
    thread: transition-and-staff-cabinet
    c: Schlesinger names Harriman to Kennedy for Secretary of State. Kennedy dismisses him as "old hat." By Schlesinger's journal.
    n: '[[w.schlesinger-robert-kennedy-and-his]], 224; [[w.schlesinger-journals]], 95 (after Schlesinger''s pitch for Youngman at Treasury, "What about Averell?" and Kennedy "something to the general effect that he was too old hat"; the page does not say for which post). To check: Schlesinger, journal, Dec. 1, 1960, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 224 n.7). Names: Schlesinger, Harriman, Kennedy.'
