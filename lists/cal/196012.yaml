    c: 'Mao 毛泽东 drafts the Center''s 中共中央 comment of Dec. 25 sending the regional bureaus, the provincial, city and regional committees and the Party groups of the Center''s ministries, state organs and mass bodies the Shaanxi 陕西 provincial committee''s report of Dec. 22 on settling the market: the provinces to follow Shaanxi''s way. His note: to Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平, Peng Zhen 彭真, Li Xiannian 李先念 and Zhou Enlai 周恩来, then Yang Shangkun 杨尚昆 to telegraph it and print it for the conference. The report: many goods short; a market group; rationing by coupon for the scarcest; local output for what Shanghai 上海 and the other great cities will cut; country fairs restored.'
