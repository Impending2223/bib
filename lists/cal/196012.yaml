  - id: cal.1960-12.press-and-broadcasting-2
    when: Dec., after the 27th
    date: 1960-12
    at: after 1960-12-27
    place: palm-beach
    thread: press-and-broadcasting
    c: 'Palm Beach Towers, just after lunch. Salinger announces live television at the President''s press conferences, the first on Jan. 25, and the ground rules; reporters must stay to the end. The correspondents protest. Lawrence of the *Times*: "as you plunge deeper and deeper into matters about which you know absolutely nothing . . ." Salinger shouts back that it is the President''s press conference and the decision final. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 57–58. Check: the day (after the decision of Dec. 27). See [[cal.1960-12-27.press-and-broadcasting]]. Names: Salinger.'
