  - id: cal.1960-12-30.china-leadership
    when: Dec. 30
    date: '1960-12-30'
    place: peking
    thread: china-famine
    also: [china-mao, china-economy, china-twelve-articles]
    c: 'The Yinian Tang. Song Renqiong and Li Xuefeng report the Northeast and North China groups.{1} Mao 毛泽东 hears the third report of the Central Work Conference''s 中央工作会议 groups on the villages.{6} Mao: raise the grain purchase price only, not the sale price, a gap of a billion yuan a year, to end the unequal exchange with the peasants, which he had refused in Oct. 1959; repayment for what was levelled and transferred 一平二调, in kind, to the last, counties and communes going bankrupt if need be, "even to bankruptcy": "Marxists must never expropriate the laborers."{7} Building can only go step by step, perhaps half a century.{8} The Center bears blame for the communist wind 共产风, not the provinces alone;{2} some faults are two or three fingers, not one 一个指头;{3} the year''s disaster is in part man-made 人祸.{4} Chen Yun 陈云: 1961 will be no better than 1960; rest the people and the animals, and import grain.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 30, 1960. [[w.deng-xiaoping-nianpu-1904]], III, 1608 (Dec. 30, 1960; afternoon; Deng at Mao''s meeting hearing Song Renqiong and Li Xuefeng on the Northeast and North China groups (footnote 1: then first secretaries of the Northeast and North China bureaus); Deng asks Chen Yun what poultry and eggs will earn abroad in 1961); [[w.peng-zhen-nianpu-1902]], IV, 88 (Dec. 30, 1960, afternoon, the Yinian Tang; Peng Zhen at Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries, hearing Song Renqiong (the page''s note: first secretary of the Northeast Bureau) and Li Xuefeng (first secretary of the North China Bureau) on the Northeast and North China groups); [[w.chen-yun-nianpu-xiuding]], III, 61–62 (afternoon: Chen Yun at Mao''s meeting in Zhongnanhai hearing the Northeast and North China groups; on Mao''s word to live the rich days as poor ones, Chen Yun: next year no better than this; three things: be ready in mind and work; men and beasts to rest this winter for the spring ploughing; import as much grain as can be had, "eating first, construction second"; Mao sums up: eating first, the market second, construction third). [[w.mao-zedong-zhuan]], V, ch. 67 n.5; [[w.yang-jisheng-mubei]], II, 806–807 n.62 (Mao''s insertion of Dec. 30 at the Central Work Conference''s report meeting: it was the Center''s own thinking that was confused, with the Zhengzhou and Shanghai papers against the winds and the great drives for steel, county and commune industry, transport and culture raising them again; the "man-made disaster" 人禍 is not the enemy''s but our own; this year''s levelling is worse than 1958''s, a whole year, not four or five months; industry above the county has drawn 50 million laborers, 24 million in 1957, 44 million in 1958, 6 million more in 1959–60, 26 million over 1957); [[w.jian-zhou-enlai]], 457 (the work conference, Dec. 30: Mao endorses Chen Yun''s proposal to import grain and gives Zhou and Chen the details). Made public: 2013; [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]]). To check: Mao Zedong 毛泽东, interjections at the report meeting of the Central Work Conference 中央工作会议汇报会, Dec. 30, 1960 (record 插话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 67 n.5); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage; The chairman''s comments during reports by leaders of various central bureaus, December 30, 1960 (cited by [[w.jian-zhou-enlai]], 457 n.65a); [[w.jin-chongji-chen-yun-zhuan]], 1224, 1226 (cited by [[w.jian-zhou-enlai]], 457 n.65b); [[w.chen-yun-nianpu-1905]], III, 51–52 (cited by [[w.jian-zhou-enlai]], 457 n.65c). See [[cal.1960-12-27.china-leadership]]. Names: Mao Zedong, Song Renqiong, Li Xuefeng, Chen Yun.'
