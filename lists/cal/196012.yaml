  - id: cal.1960-12.china-leadership-13
    when: Dec., early
    date: 1960-12
    at: before 1960-12-01
    place: lanzhou
    thread: china-famine
    c: Lanzhou 蘭州. The Northwest Bureau's meeting takes up Gansu's 甘肅 problems and exposes the errors of Zhang Zhongliang 張仲良, He Chenghua 何承華, Ruan Dimin 阮迪民 and Wang Bingxiang 王秉祥, calling them "private and leftist." The Gansu committee is reorganized, Wang Feng 汪鋒 replacing Zhang as first secretary; prefectural secretaries including Dou Minghai 竇明海, Liu Fenghao 劉逢皓 and Hu Xueyi 胡學義 are criticized, and some prefectural committees remade.
    n: '[[w.yang-jisheng-mubei]], I, 174–175 (I, 174: "early December 1960"); [[w.dikotter-maos-great-famine]], 321 n.6 (Zhang Zhongliang, told of cannibalism in Tongwei, Yumen, Wushan, Jingning and Wudu, dismisses the evidence as the work of "bad elements"; his confession of Dec. 3, 1960). The book adds that the new committee then, after Xinyang''s example, began the making up of the democratic revolution in the villages, tens of thousands criticized and struggled against (I, 175). Made public: 2008. Check: whether Zhang Zhongliang''s confession of Dec. 3, 1960 ([[w.dikotter-maos-great-famine]], 321 n.6) was made to this meeting. To check: Northwest Bureau, Lanzhou meeting, Dec. 1960, its documents, bulletins and speeches (named by [[w.yang-jisheng-mubei]], I, 119, 174; the author did not find them); Gansu Provincial Committee, "Inspection report on some questions in carrying out the spirit of the Northwest Bureau''s Lanzhou meeting over two years" (cited by [[w.yang-jisheng-mubei]], I, 175 n.51); Zhang Zhongliang, confession, Dec. 3, 1960, Gansu Provincial Archives, 91-18-140, p. 19 (cited by [[w.dikotter-maos-great-famine]], 321 n.6). Check: the day; the book places the meeting after Mao''s comment on Xinyang and the Center''s directive on Shandong, Henan, Gansu and Guizhou (I, 174), which it dates Dec. 8 (II, 835–836); whether the new committee''s criticism of the prefectural secretaries was at the meeting; "private and leftist" is the book''s rendering of 一私一左; the Lanzhou place is by the meeting''s name. Names: Zhang Zhongliang.'
