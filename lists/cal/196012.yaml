  - id: cal.1960-12-02.laos
    when: Dec. 2
    date: '1960-12-02'
    thread: laos
    c: 'Vientiane. Several hundred demonstrators friendly to the Pathet Lao against a coalition taking in Phoumi Nosavan. Souvanna Phouma, from the steps of the National Assembly: "peace or war. If you want war you can have my resignation." He asks Phoumi for a cease-fire, and Eisenhower, through the American Ambassador, to stop helping Phoumi.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 333. To check: Roy Essoyan, *Washington Post and Times Herald*, Dec. 3, 1960; Jacques Nevard, [*New York Times*, Dec. 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/12/06/issue.html) (cited by [[w.fursenko-khrushchevs-cold-war]], 333 nn.34–35). Names: Souvanna Phouma, Phoumi Nosavan, Eisenhower.'
    src:
      c: 9fb903e8
      rows:
        - 'w.fursenko-khrushchevs-cold-war 333: all'
        - 'via w.fursenko-khrushchevs-cold-war 333 n.34: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 333 n.35: C'
    tags: [name:souvanna-phouma, name:phoumi-nosavan, name:eisenhower-dwight-d, place:vientiane]
  - id: cal.1960-12-02.congo-lumumba
    when: Dec. 2
    date: '1960-12-02'
    thread: congo-lumumba
    c: Léopoldville. WI/ROGUE's first contact with Devlin, who tells him to "build cover during initial period" and to "spot persons for [a] surveillance team" in the province where Lumumba's support is strongest.
    n: '[[w.sen-church-alleged-assassination-plots]], 46 (the cable of Dec. 17). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Dec. 17, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 46). See [[cal.1960-10-27.congo-lumumba]]. Names: Devlin, Lumumba.'
    tags: [name:devlin-lawrence-r, name:lumumba-patrice]
