  - id: cal.1960-12-06.transition-and-staff
    when: Dec. 6
    date: '1960-12-06'
    thread: transition-and-staff
    c: Eisenhower receives Kennedy at the White House, alone, then with Herter, Gates, Anderson, Persons and Clifford. The White House staff, the NSC, NATO, the balance of payments. Eisenhower advises against reorganizing before Kennedy knows the work.
    n: 'Joint Statement by the President and President-Elect Kennedy, [1960–61 Pub. Papers 872](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=924). FRUS 1958–60, III, doc. [128](https://history.state.gov/historicaldocuments/frus1958-60v03/d128); IV, doc. [62](https://history.state.gov/historicaldocuments/frus1958-60v04/d62) (Anderson''s record). Eisenhower''s account: [[w.eisenhower-white-house-years]], 712–716. [[w.schlesinger-thousand-days-1965]], 126; [[w.sorensen-kennedy]], 231 (the meeting; the secretaries). [[w.kallina-kennedy-v-nixon]], 187–88. [[w.gavin-gold-dollars-and-power]], 55–56, 62 (the balance of payments). [[w.reeves-president-kennedy]], 22–23 (the talk alone and with the Cabinet members after; Eisenhower''s advice). [[w.clifford-counsel-to-the-president-2]], 341–42 (the meeting alone, an hour and forty-five minutes, then with the secretaries; Anderson on the gold; Eisenhower willing to serve, not to travel). See [[cal.1960-11-09.transition-and-staff]]. Names: Eisenhower, Herter, Gates, Anderson, Persons, Kennedy, Clifford.'
