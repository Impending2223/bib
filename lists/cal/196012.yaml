  - id: cal.1960-12.china-leadership-27
    when: Dec., after the Lanzhou meeting
    date: 1960-12
    at: after 1960-12-10
    place: tongwei
    thread: china-famine
    c: Tongwei 通渭 county, Gansu 甘肅. After the Northwest Bureau's Lanzhou 蘭州 meeting the Center, the province and the prefecture send in a work group of 250 and a medical team of 128. They bring over 33.7 million jin of grain, over 3.3 million yuan of relief, 136 tons of medicine, over 1.1 million chi of cotton cloth and over 60,000 jin of cotton, bring over 80,000 back from the edge of death and open an orphanage for over 1,200; the state lends and grants 1.42 million yuan, invests over 2.7 million free and buys over 4,700 head of livestock. In the course of the rescue two of the medical team, Wang Jun 王俊 and Liu Chunhua 劉春華 (a woman), lose their lives.
    n: '[[w.yang-jisheng-mubei]], I, 172, 173 n.50. Made public: 2008. To check: Tongwei County Committee, "Guanyu Tongwei de lishi jingyan jiaoxun" 《關於通渭的歷史經驗教訓》, July 5, 1965, with the Gansu committee''s report forwarding it, Ganfa [65] 374 (cited by [[w.yang-jisheng-mubei]], I, 173 n.50). See [[cal.1960-12.china-leadership-13]].'
