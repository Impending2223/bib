    c: Liao Zhigao 廖志高, deputy secretary of the Sichuan 四川 provincial committee, writes the governor Li Dazhang 李大章 what Mao 毛澤東 said on Dec. 23 to the regional first secretaries and some provincial secretaries. Rural cadres are of six kinds, perhaps 90 percent of them good; whoever cuts the villagers off from a living is a counterrevolutionary or like one; the Kuomintang is not dead, on the mainland too; the villages are to be rectified first and the cities after, right and wrong settled before enemy and friend. Where there are bad men, many able cadres are to be sent, as at Tonghaikou 通海口, to fight a battle of annihilation, and in rotten places to rely on outside work teams and on the 70 percent of the masses.
