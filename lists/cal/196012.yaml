  - id: cal.1960-12-04.elections-1960
    when: Dec. 4–7
    date: '1960-12-04'
    thread: elections-1960
    c: 'Earl Mazo''s four articles in the New York Herald Tribune, carried in other papers across the country: massive fraud in the election, in Texas and Illinois above all. Nixon asks him to cut the series short.'
    n: '[[w.kallina-kennedy-v-nixon]], 185, 208. To check: New York Herald Tribune, Dec. 4–7, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 208 n.16). Names: Nixon. Check: the day Nixon asked Mazo to stop; Kallina gives none (185).'
