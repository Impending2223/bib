entries:
  - id: cal.1960-12-01.transition-and-staff
    when: Dec. 1
    date: '1960-12-01'
    thread: transition-and-staff-cabinet
    c: The cabinet named, the first of it. Kennedy names Ribicoff to HEW; Williams to African affairs.
    n: '[[w.schlesinger-thousand-days-1965]], 129–31 (Williams announced that morning; Ribicoff and Hodges decided). To check: [[w.halberstam-best-and-the-brightest]]; [[w.bowles-promises-to-keep]]. See [[cal.1960-11-09.transition-and-staff]]. [[w.wofford-of-kennedys-and-kings]], on the search; [[w.schoenbaum-waging-war-and-peace]], on Rusk; [[w.shapley-promise-and-power]], on McNamara. Names: Kennedy, Ribicoff, Williams.'
    tags: [name:kennedy-john-f, name:ribicoff-abraham, name:williams-g-mennen]
  - id: cal.1960-12-01.congo
    when: Dec. 1–3
    date: '1960-12-01'
    thread: congo
    c: Lumumba caught by Mobutu's troops near the Sankuru, Dec. 1; flown back to Leopoldville, beaten before the cameras, held at Thysville from Dec. 3.
    n: 'FRUS 1958–60, XIV, docs. [273](https://history.state.gov/historicaldocuments/frus1958-60v14/d273) (Dulles to the NSC, Dec. 1), [276](https://history.state.gov/historicaldocuments/frus1958-60v14/d276) (Timberlake, Dec. 3). See [[cal.1960-08-18.congo-2]]. Names: Lumumba, Mobutu.'
    tags: [name:lumumba-patrice, name:mobutu-joseph-d, name:dulles-allen-w]
  - id: cal.1960-12-01.transition-and-staff-2
    when: Dec. 1
    date: '1960-12-01'
    thread: transition-and-staff-cabinet
    c: Schlesinger with the President-elect at noon, his Senate office, then Georgetown, by Schlesinger's account. Hodges and Ribicoff settled; Udall and Goldberg nearly. Fulbright the likeliest for State. Kennedy asks after Stevenson for Attorney General; Blair sounds Stevenson out that night, who prefers the UN. Lovett to lunch.
    n: '[[w.schlesinger-thousand-days-1965]], 129–31, 135, 139. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-12-01.transition-and-staff]]. Names: Schlesinger, Kennedy, Hodges, Ribicoff, Udall, Goldberg, Fulbright, Stevenson, Blair, Lovett.'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:hodges-luther-h, name:ribicoff-abraham, name:udall-stewart-l, name:goldberg-arthur-j, name:fulbright-j-william, name:stevenson-adlai-e, name:blair-william-m-jr, name:lovett-robert-a]
  - id: cal.1960-12-03.transition-and-staff-cabinet
    when: Dec. 3
    date: '1960-12-03'
    thread: transition-and-staff-cabinet
    c: Hodges to Commerce. Check the date.
    n: '[[w.schlesinger-thousand-days-1965]], 130 (decided by Dec. 1; the day not given). See [[cal.1960-12-01.transition-and-staff]]. Names: Hodges.'
    tags: [name:kennedy-john-f, name:hodges-luther-h]
  - id: cal.1960-12-04.vietnam
    when: Dec. 4
    date: '1960-12-04'
    thread: vietnam
    c: 'Durbrow, three weeks after the coup: the situation "highly dangerous to US interests." The Viet Cong gaining in the countryside; "widespread popular dissatisfaction" with Diệm''s government. Should Diệm not act, the task of "identifying and supporting alternate leadership."'
    n: '[FRUS 1958–60, I, doc. 257](https://history.state.gov/historicaldocuments/frus1958-60v01/d257). [[w.miller-misalliance]], 213. See [[cal.1960-10-14.vietnam]]. Names: Durbrow, Diệm.'
    src:
      c: ee9d6933
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v01/d257: all'
        - 'w.miller-misalliance 213: all'
        - 'via w.miller-misalliance 213 n.84: all'
    tags: [name:durbrow-elbridge, name:ngo-dinh-diem]
  - id: cal.1960-12-05.desegregation-public-places
    when: Dec. 5
    date: '1960-12-05'
    thread: desegregation-public-places
    also: [court, freedom-rides]
    c: '*Boynton v. Virginia*, [364 U.S. 454](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364454/usrep364454.pdf). An interstate bus passenger refused service in the white restaurant of the Trailways terminal at Richmond: the Interstate Commerce Act forbids the discrimination, his trespass conviction reversed. 7–2; Black for the Court, Whittaker and Clark dissenting.'
    n: 'Cases: K–J Cong. II.J.1. To check: [[w.barnes-journey-from-jim-crow]]; [[w.arsenault-freedom-riders]]; [[w.greenberg-crusaders-in-the-courts]].'
  - id: cal.1960-12-05.testing
    when: Dec. 5
    date: '1960-12-05'
    thread: testing
    c: The Geneva conference on stopping nuclear tests recesses, on the American proposal, to meet again in February under the new administration. Herter's proposal shown to Clifford beforehand.
    n: 'FRUS 1958–60, III, doc. [264](https://history.state.gov/historicaldocuments/frus1958-60v03/d264). [[w.watson-into-the-missile-age]], 729 (the recess, Dec. 5, to meet again Feb. 7). To check: [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.divine-blowing-on-the-wind]]; [[w.seaborg-kennedy-khrushchev-and-the]]; Department of State, *Geneva Conference on the Discontinuance of Nuclear Weapon Tests*, 114–21 (cited by [[w.watson-into-the-missile-age]], 729 n.213). Names: Herter, Clifford.'
    src:
      c: 70e86399
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d264: all'
        - 'w.watson-into-the-missile-age 729: A'
        - 'via w.watson-into-the-missile-age 729 n.213: A'
    tags: [name:herter-christian-a, name:clifford-clark]
  - id: cal.1960-12-06.transition-and-staff
    when: Dec. 6
    date: '1960-12-06'
    thread: transition-and-staff
    c: Eisenhower receives Kennedy at the White House, alone, then with Herter, Gates, Anderson, Persons and Clifford. The White House staff, the NSC, NATO, the balance of payments. Eisenhower advises against reorganizing before Kennedy knows the work.
    n: 'Joint Statement by the President and President-Elect Kennedy, [1960–61 Pub. Papers 872](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=924). FRUS 1958–60, III, doc. [128](https://history.state.gov/historicaldocuments/frus1958-60v03/d128); IV, doc. [62](https://history.state.gov/historicaldocuments/frus1958-60v04/d62) (Anderson''s record). Eisenhower''s account: [[w.eisenhower-white-house-years]], 712–716. [[w.schlesinger-thousand-days-1965]], 126. See [[cal.1960-11-09.transition-and-staff]]. Names: Eisenhower, Herter, Gates, Anderson, Persons, Kennedy, Clifford.'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f, name:herter-christian-a, name:gates-thomas-s-jr, name:anderson-robert-b, name:persons-wilton-b, name:clifford-clark]
  - id: cal.1960-12-07.cuba
    when: Dec. 7
    date: '1960-12-07'
    thread: cuba
    c: Eisenhower puts Willauer, under the Secretary of State, in charge of the Cuba program, overt and covert.
    n: 'FRUS 1958–60, VI, doc. [618](https://history.state.gov/historicaldocuments/frus1958-60v06/d618). See [[cal.1960-11-29.cuba]]. Names: Eisenhower, Willauer.'
    tags: [name:eisenhower-dwight-d, name:willauer-whiting]
  - id: cal.1960-12-07.transition-and-staff-cabinet
    when: Dec. 7
    date: '1960-12-07'
    thread: transition-and-staff-cabinet
    c: Udall to Interior. Check the date.
    n: '[[w.schlesinger-thousand-days-1965]], 130–31 (the choice; the day not given). See [[cal.1960-12-01.transition-and-staff]]. Names: Udall.'
    tags: [name:kennedy-john-f, name:udall-stewart-l]
  - id: cal.1960-12-08.laos
    when: Dec. 8–9
    date: '1960-12-08'
    thread: laos
    c: Kouprasith's coup in Vientiane, Dec. 8; Souvanna Phouma to Phnom Penh, Dec. 9. Soviet aircraft bring Kong Le howitzers.
    n: 'FRUS 1958–60, XVI, doc. [479](https://history.state.gov/historicaldocuments/frus1958-60v16/d479) (editorial note). See [[cal.1960-08-09.laos]]. Names: Kouprasith, Souvanna Phouma, Kong Le.'
    tags: [name:kouprasith-abhay, name:souvanna-phouma, name:kong-le, place:vientiane, place:phnom-penh]
  - id: cal.1960-12-08.middle-east
    when: Dec. 8
    date: '1960-12-08'
    thread: middle-east-dimona
    c: 'Dimona. Dulles to the NSC: Israel building in the Negev, with French help, a nuclear complex, probably with a reactor able to make weapons-grade plutonium.'
    n: 'FRUS 1958–60, XIII, doc. [177](https://history.state.gov/historicaldocuments/frus1958-60v13/d177). Made public: the London *Daily Express*, Dec. 16, and the *New York Times*, Dec. 19 (Check). To check: [[w.hersh-samson-option]]; [[w.cohen-israel-and-the-bomb]]. Names: Dulles.'
    tags: [name:dulles-allen-w]
  - id: cal.1960-12-08.cuba
    when: Dec. 8
    date: '1960-12-08'
    thread: cuba-bay-of-pigs
    c: 'The Special Group. Hawkins, for the CIA''s paramilitary staff, presents the new concept: a landing of 600–750 men with heavy firepower, after air strikes from Nicaragua; a lodgment held, to draw the dissidents and set off a rising. Some 60–80 men infiltrated first.'
    n: '[FRUS 1958–60, VI, doc. 621](https://history.state.gov/historicaldocuments/frus1958-60v06/d621); FRUS 1961–63, X, doc. [231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), pars. 10–11. Made public: *Operation Zapata* (1981); FRUS 1958–60, VI (1991). See [[cal.1960-11-04.cuba]]. Names: Hawkins.'
    tags: [name:hawkins-jack]
  - id: cal.1960-12-08.transition-and-staff
    when: Dec. 8
    date: '1960-12-08'
    thread: transition-and-staff-cabinet
    c: Rusk and Kennedy meet for the first time. Kennedy speaks of Rusk's *Foreign Affairs* article, "The President," and not of the post; Rusk leaves thinking it came to nothing.
    n: '[[w.schlesinger-thousand-days-1965]], 140–41. See [[cal.1960-12-01.transition-and-staff]]. Names: Rusk, Kennedy.'
    tags: [name:rusk-dean, name:kennedy-john-f]
  - id: cal.1960-12-09.middle-east-dimona
    when: Dec. 9
    date: '1960-12-09'
    thread: middle-east-dimona
    c: Herter questions Harman, Israel's ambassador, on Dimona.
    n: 'FRUS 1958–60, XIII, doc. [178](https://history.state.gov/historicaldocuments/frus1958-60v13/d178). See [[cal.1960-12-08.middle-east]]. Names: Herter, Harman.'
    tags: [name:herter-christian-a, name:harman-avraham]
  - id: cal.1960-12-09.cuba
    when: Dec. 9
    date: '1960-12-09'
    thread: cuba
    also: [immigration]
    c: Eisenhower thanks Cardinal Spellman for $10,000 toward the Cuban refugees in Miami; $1 million already allotted from the President's funds, Tracy Voorhees in charge.
    n: 'Letter to Cardinal Spellman Concerning Aid to Cuban Refugees, [1960–61 Pub. Papers 875](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=927). To check: [[w.garcia-havana-usa]]. Names: Eisenhower, Voorhees, Spellman.'
    tags: [name:eisenhower-dwight-d, name:spellman-francis, name:voorhees-tracy-s]
  - id: cal.1960-12-09.elections-1960-chicago
    when: Dec. 9
    date: '1960-12-09'
    thread: elections-1960
    also: [states-and-cities]
    c: Chicago. The recount of the State's Attorney's race, which Adamowski asked and the Republicans meant as a test of the presidential count, ends. A county judge had ordered twenty-five teams of counters and every race on the ballots counted. Errors of ten votes or more in Kennedy's favor in 3.1 percent of the precincts recounted, in Nixon's 2.6. Ward's election stands; Adamowski wins a second recount in 1961, his race alone.
    n: '[[w.kallina-courthouse-over-white-house]], 114–117. See [[cal.1960-11-08.governors-il]]; [[cal.1960-12-19.elections-1960]]. Names: Adamowski, Ward, Kennedy, Nixon.'
    tags: [state:il, city:chicago, name:adamowski-benjamin-s, name:ward-daniel-p, name:kennedy-john-f, name:nixon-richard-m, ok:result-form]
  - id: cal.1960-12-09.transition-and-staff
    when: Dec. 9
    date: '1960-12-09'
    thread: transition-and-staff-cabinet
    c: Kennedy offers Rusk the State Department, the day after their first meeting.
    n: '[[w.schlesinger-thousand-days-1965]], 141. See [[cal.1960-12-08.transition-and-staff]]. Names: Kennedy, Rusk.'
    tags: [name:kennedy-john-f, name:rusk-dean]
  - id: cal.1960-12-12.court
    when: Dec. 12
    date: '1960-12-12'
    thread: court
    c: '*Shelton v. Tucker*, [364 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364479/usrep364479.pdf). Arkansas''s act requiring every teacher in its schools and colleges to list every organization joined or supported in five years voided, 5–4: freedom of association. Stewart for the Court; Frankfurter and Harlan for the dissenters.'
    n: 'Cases: K–J Cong. II.J.1. To check: [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]].'
  - id: cal.1960-12-12.transition-and-staff-cabinet
    when: Dec. 12
    date: '1960-12-12'
    thread: transition-and-staff-cabinet
    c: Rusk to State, Stevenson to the UN, Bowles Under Secretary.
    n: '[[w.schlesinger-thousand-days-1965]], 138–41. See [[cal.1960-12-01.transition-and-staff]]. Names: Rusk, Stevenson, Bowles.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:stevenson-adlai-e, name:bowles-chester]
  - id: cal.1960-12-12.laos
    when: Dec. 12
    date: '1960-12-12'
    thread: laos
    c: The assembly, at Savannakhet, votes Souvanna Phouma out; the King gives power to Phoumi's committee, Boun Oum its head.
    n: 'FRUS 1958–60, XVI, docs. [484](https://history.state.gov/historicaldocuments/frus1958-60v16/d484), [485](https://history.state.gov/historicaldocuments/frus1958-60v16/d485). See [[cal.1960-08-09.laos]]. Names: Souvanna Phouma, Phoumi Nosavan, Boun Oum na Champassak.'
    tags: [name:souvanna-phouma, name:phoumi-nosavan, name:boun-oum-na-champassak, name:savang-vatthana, place:savannakhet]
  - id: cal.1960-12-13.transition-and-staff-cabinet
    when: Dec. 13
    date: '1960-12-13'
    thread: transition-and-staff-cabinet
    c: McNamara to Defense.
    n: '[[w.schlesinger-thousand-days-1965]], 131–33 (the approach to McNamara; the day not given). See [[cal.1960-12-01.transition-and-staff]]. Names: McNamara.'
    tags: [name:kennedy-john-f, name:mcnamara-robert-s]
  - id: cal.1960-12-13.laos
    when: Dec. 13–16
    date: '1960-12-13'
    thread: laos
    c: Phoumi's troops take Vientiane, the American embassy burned; Kong Le withdraws north.
    n: 'FRUS 1958–60, XVI, doc. [487](https://history.state.gov/historicaldocuments/frus1958-60v16/d487) (Eisenhower and Herter, Dec. 14). See [[cal.1960-08-09.laos]]. Names: Phoumi Nosavan, Kong Le.'
    tags: [name:phoumi-nosavan, name:kong-le, name:eisenhower-dwight-d, place:vientiane]
  - id: cal.1960-12-14.africa
    when: Dec. 14
    date: '1960-12-14'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'The General Assembly adopts the Declaration on the Granting of Independence to Colonial Countries and Peoples, 89–0. The United States abstains, with Britain, France, Belgium, Portugal, Spain, South Africa, Australia and the Dominican Republic: Eisenhower''s decision, Dec. 9, at Macmillan''s request, against Herter''s advice and the delegation''s.'
    n: '[G.A. Res. 1514 (XV)](https://undocs.org/en/A/RES/1514%28XV%29). FRUS 1958–60, II, docs. [255](https://history.state.gov/historicaldocuments/frus1958-60v02/d255), [256](https://history.state.gov/historicaldocuments/frus1958-60v02/d256), [257](https://history.state.gov/historicaldocuments/frus1958-60v02/d257). To check: [[w.mahoney-jfk]]. See [[cal.1960-03-21.africa]]. Names: Eisenhower, Herter, Macmillan.'
    tags: [name:eisenhower-dwight-d, name:macmillan-harold, name:herter-christian-a]
  - id: cal.1960-12-14.trade
    when: Dec. 14
    date: '1960-12-14'
    thread: trade
    also: [europe-and-the-alliance, european-community]
    c: 'Convention on the Organisation for Economic Co-operation and Development signed at Paris, [12 U.S.T. 1728](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-12-2/lltreaties-12-2.pdf#page=536), [888 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20888/volume-888-I-12736-English.pdf): the OEEC remade, with the United States and Canada members.'
    n: 'Senate consent, Mar. 16, 1961; ratified Mar. 23; in force Sept. 30, 1961. To check: [[w.winand-eisenhower-kennedy-and-the]]; [[w.kunz-butter-and-guns]]. See [[cal.1960-01-12.european-community]].'
  - id: cal.1960-12-15.transition-and-staff-cabinet
    when: Dec. 15
    date: '1960-12-15'
    thread: transition-and-staff-cabinet
    c: Freeman to Agriculture, Goldberg to Labor. Check the date.
    n: '[[w.schlesinger-thousand-days-1965]], 130–31, 143–44 (the choices; the day not given). See [[cal.1960-12-01.transition-and-staff]]. Names: Freeman, Goldberg.'
    tags: [name:kennedy-john-f, name:freeman-orville-l, name:goldberg-arthur-j]
  - id: cal.1960-12-15.transition-and-staff
    when: Dec. 15
    date: '1960-12-15'
    thread: transition-and-staff
    also: [robert-kennedy]
    c: 'Robert Kennedy at lunch with Schlesinger, the day before his own appointment is announced: the White House staff to be widened beyond the Senate and campaign men; Dutton recruited. Proposes Schlesinger as a Special Assistant, "a sort of roving reporter and trouble-shooter."'
    n: '[[w.schlesinger-thousand-days-1965]], 142–43. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-11-09.transition-and-staff]]. Names: Robert Kennedy, Schlesinger, Dutton.'
    tags: [name:kennedy-robert-f, name:schlesinger-arthur-m-jr, name:dutton-frederick-g]
  - id: cal.1960-12-16.cuba
    when: Dec. 16
    date: '1960-12-16'
    thread: cuba
    c: Eisenhower fixes Cuba's sugar quota for the first quarter of 1961, to the Sugar Act's expiry, at zero. Replacement sugar bought elsewhere, the Dominican Republic's share among it, as Congress required against his advice.
    n: 'Statement by the President Upon Issuing Proclamation Fixing the Cuban Sugar Quota at Zero, [1960–61 Pub. Papers 877](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=929); [Proclamation 3383](https://www.presidency.ucsb.edu/documents/proclamation-3383-determination-cuban-sugar-quota-supplement-proclamation-no-3355). See [[cal.1960-07-06.cuba-2]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-12-16.europe-and-the-alliance
    when: Dec. 16–18
    date: '1960-12-16'
    thread: europe-and-the-alliance
    c: NATO ministers at Paris. Herter offers five Polaris submarines to NATO by the end of 1963, and proposes a multilateral force of medium-range missiles, owned, financed and controlled in common, mixed-manned; the allies to buy about 100 missiles.
    n: 'FRUS 1958–60, VII, pt. 1, docs. [274](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d274) (NSC, Dec. 1), [276](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d276) (Herter''s statement). [[w.watson-into-the-missile-age]], 550, 560, 586. To check: [[w.trachtenberg-constructed-peace]]; [[w.steinbruner-cybernetic-theory-of-decision]]; [[w.winand-eisenhower-kennedy-and-the]]; the text of Herter''s statement, State''s Topol 846 to Paris, Dec. 9, 1960, OSD Hist. (cited by [[w.watson-into-the-missile-age]], 586 n.244). Names: Herter.'
    src:
      c: 225888fa
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v07p1/d274: all'
        - 'w.watson-into-the-missile-age 550, 560, 586: all'
        - 'via w.watson-into-the-missile-age 586 n.244: B-C'
    tags: [name:herter-christian-a]
