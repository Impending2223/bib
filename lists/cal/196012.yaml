    c: 'The enlarged Presidium on agriculture, stenographed, the republics'' leaders and Lysenko there. Khrushchev on his note: needs rising with wages, the economy to meet them; not to build communism on "moral factors" like the Chinese, "болтовня о коммунизме, а брюхо подтягивай" (talk of communism, and tighten your belly); irrigation and rice. In the notes: the Ukrainians first under fire, Poltava, Chernigov, Sumy; Georgia''s sheep; fraud in Ryazan; fewer museums and stadiums, no flowers for Moscow. Resolved: his proposals on farming and on reorganizing the Ministry of Agriculture approved; the republics to draft measures, Gosplan and Matskevich to sum them up.'
