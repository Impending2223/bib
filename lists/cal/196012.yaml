    n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 3, 1960. [[w.zhou-enlai-waijiao-huodong]], 295 (Dec. 3, 1960; 晚上, 毛泽东主席为胡志明主席举行的宴会); [[w.lengxi-shinian-lunzhan-1956-1966]], 438–442 (Wu''s account of the talks with the Vietnamese delegation, Hồ Chí Minh, Lê Duẩn and Hoàng Văn Hoan, on its way home from Moscow, early December: Mao thanks Hồ as peacemaker, peace and quarrels alternate, the principle of consultation to agreement the chief result, the gentleman''s agreement to stop mutual attacks; Hồ: no more cigarettes thrown, hand them round; Deng and Peng Zhen on the conference; Mao: not all the shot fired, Khrushchev afraid of Deng''s stick; of Hồ''s midnight call, Mao: not yet time, a day short; Zhou: the Center''s cable was drafted to give ground only when Khrushchev gave); [[w.deng-xiaoping-nianpu-1904]], III, 1603 (Dec. 3, 1960; 5:30 p.m.; Deng, with Zhou and Zhu De, at Mao''s talks with Hồ on the Moscow meeting); [[w.chen-yi-nianpu]], 847 (Dec. 3, 1960, evening; Chen Yi with Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen and others at Mao''s meeting and dinner for Hồ Chí Minh); [[w.peng-zhen-nianpu-1902]], IV, 82 (Dec. 3, 1960, 5:30 p.m.; Peng Zhen accompanies Mao, Zhou Enlai, Zhu De and others in meeting and dining Hồ Chí Minh and the Vietnamese delegation; a performance after); [[w.guan-vietnamese-communists-relations-with]], 170 (Hồ, Lê Duẩn, Nguyễn Chí Thanh and Trần Quang Huy with Mao in the evening, a cordial meeting; Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun, He Long, Luo Ruiqing, Hu Qiaomu and Liao Chengzhi there; the same evening a banquet for Hồ); [[w.zhu-de-nianpu-xinbian]], III, 1788–1789 (Dec. 3, 1960, evening; Zhu De 朱德, with Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Li Fuchun, He Long and others, at Mao Zedong''s 毛泽东 banquet for Hồ Chí Minh 胡志明 and the Vietnamese Party and government delegation, on their way home). Made public: 1993. To check: NCNA, 3 December 1960, SWB/FE/507/A3/1 (cited by [[w.guan-vietnamese-communist