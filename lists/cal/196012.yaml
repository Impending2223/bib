    date: '1960-12-31'
    thread: rules
    c: 'The Speaker''s office, a Saturday. Rayburn with McCormack, Bolling, Deschler, a few Texas congressmen and Albert weighs the Rules Committee: a restored twenty-one-day rule, three added members, or Colmer''s removal for campaigning in Mississippi against the party''s presidential ticket. Rayburn tells them Smith has refused the enlargement. He keeps his own mind to himself. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 238–39 (the day, "a Saturday, the last day of 1960"; those present; the three courses; Smith''s refusal, reported; Rayburn''s silence). See [[cal.1960-12-31.rules-2]]. Names: Rayburn, McCormack, Bolling, Colmer, Smith, Albert.'
    tags: [name:rayburn-sam, name:mccormack-john-w, name:bolling-richard, name:colmer-william-m, name:smith-howard-w, name:albert-carl, state:ms]
  - id: cal.1960-12-31.rules-2
    when: Dec. 31
    date: '1960-12-31'
    thread: rules
    c: Morning. Rayburn offers Smith the enlargement of the Rules Committee by three members, one Republican and two Democrats. Smith will have none of it. By Albert's account, from Rayburn's report that afternoon.
    n: '[[w.albert-little-giant-1990]], 238 ("just that morning"). Names: Rayburn, Smith, Albert.'
    tags: [name:rayburn-sam, name:smith-howard-w, name:albert-carl]
  - id: cal.1960-12.transition-and-staff-6
    when: Dec., mid-month
    date: 1960-12
    thread: transition-and-staff
    c: 'Washington, O''Brien''s office at the Democratic National Committee. Robert Kennedy: "Larry, the spot for you is Deputy Postmaster General," the number two post, since John Bailey "won''t stay on as national chairman forever." O''Brien: "I haven''t any interest whatsoever in that spot"; he can go back to Springfield. Robert Kennedy, annoyed, suggests that might not be a bad idea. By O''Brien''s account.'
    n: '[[w.obrien-no-final-victories]], 100. Check: the day (the work says "one day in mid-December"). Names: Robert Kennedy, O''Brien.'
    tags: [name:kennedy-robert-f, name:obrien-lawrence-f]
  - id: cal.1960-12.transition-and-staff-7
    when: Dec., Christmas
    date: 1960-12
    thread: transition-and-staff
    c: 'O''Brien named special assistant to the President for congressional relations and personnel. The President-elect to him: "Larry, I''ve decided congressional relations is the right role for you and the personnel slot seems to go with it." By O''Brien''s account.'
    n: '[[w.obrien-no-final-victories]], 101. Check: the day (the work says "over Christmas"). Names: O''Brien, Kennedy.'
    tags: [name:obrien-lawrence-f, name:kennedy-john-f]
