  - id: cal.1960-12-03.vietnam-hanoi
    when: Dec. 3
    date: '1960-12-03'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat to the Nam Bộ Executive Committee, cable no. 49/NB: some words of the manifesto changed on its advice; further changes to be proposed word by word, "for once out it cannot be corrected"; when will it be published, for Interzone V to do the same. The Front''s program still under review. Local front committees broad, their lists perhaps not public at first; the central committee''s members and their announcement later. The cadres sent in the first groups chiefly to help train cadres.'
    n: '*Điện của Ban Bí thư số 49/NB gửi Xứ uỷ Nam Bộ*. [[w.van-kien-dang-toan]], XXI, 1047–48. See [[cal.1960-11-24.vietnam-hanoi]]. Made public: 2002.'
    tags: [polity:drv]
  - id: cal.1960-12-04.vietnam
    when: Dec. 4
    date: '1960-12-04'
    time: 1960-12-04T06:00Z
    thread: vietnam
    c: 'Durbrow, three weeks after the coup: the situation "highly dangerous to US interests." The Viet Cong gaining in the countryside; "widespread popular dissatisfaction" with Diệm''s government. Should Diệm not act, the task of "identifying and supporting alternate leadership."'
    n: '[FRUS 1958–60, I, doc. 257](https://history.state.gov/historicaldocuments/frus1958-60v01/d257). [[w.miller-misalliance]], 213; [[w.moyar-triumph-forsaken]], 115; [[w.mann-grand-delusion]], 220 (Durbrow''s cable of Dec. 4: "we may well be forced, in the not too distant future, to undertake [the] difficult task of identifying and supporting alternate leadership"; he urges holding the 20,000 more troops Diệm wants until Diệm eases "his heavy-handed methods of operation"; not the Viet Cong or "widespread popular dissatisfaction"). See [[cal.1960-10-14.vietnam]]. Names: Durbrow, Diệm.'
    src:
