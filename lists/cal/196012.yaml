  - id: cal.1960-12.republican-party-3
    when: Dec.–Jan.
    date: 1960-12
    place: washington
    thread: republican-party
    c: 'Washington, a dinner given by Nixon and his wife, by Nixon''s account. James Byrnes and his wife come from South Carolina; Byrnes''s toast: "If the Vice President had won this election, I would not be here tonight." Afterward, to Nixon, on his own first defeat: "Only a man who has suffered a close defeat can possibly know how someone else feels."'
