  - id: cal.1960-12-01.congo
    when: Dec. 1–3
    date: '1960-12-01'
    thread: congo
    c: Lumumba caught by Mobutu's troops near the Sankuru, Dec. 1; flown back to Leopoldville, beaten before the cameras, held at Thysville from Dec. 3.
    n: 'FRUS 1958–60, XIV, docs. [273](https://history.state.gov/historicaldocuments/frus1958-60v14/d273) (Dulles to the NSC, Dec. 1), [276](https://history.state.gov/historicaldocuments/frus1958-60v14/d276) (Timberlake, Dec. 3). [[w.fursenko-khrushchevs-cold-war]], 321–22 (captured in sight of Ghanaian UN troops; New York keeps to neutrality); [[w.bissell-reflections-of-a-cold]], 145 (caught by Mobutu''s troops early in December, making for Stanleyville); [[w.sen-church-alleged-assassination-plots]], 14, 48–49 (captured by Mobutu''s troops "early in December" on the way to Stanleyville and held at Thysville; not Dec. 1, the Sankuru, or the flight back). Check: Fursenko and Naftali date the capture Dec. 2 (321). See [[cal.1960-08-18.congo-2]]. Names: Lumumba, Mobutu.'
    src:
      c: efe9d216
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v14/d273: all'
        - 'w.fursenko-khrushchevs-cold-war 321–22: A'
        - 'w.bissell-reflections-of-a-cold 145: A'
        - 'via w.bissell-reflections-of-a-cold 145 n.4a: A'
        - 'w.sen-church-alleged-assassination-plots 14, 48–49: ?'
    tags: [name:lumumba-patrice, name:mobutu-joseph-d, name:dulles-allen-w]
  - id: cal.1960-12-01.transition-and-staff-2
    when: Dec. 1
    date: '1960-12-01'
    time: 1960-12-01T17:00Z
    thread: transition-and-staff-cabinet
    c: Schlesinger with the President-elect at noon, his Senate office, then Georgetown, by Schlesinger's account. Hodges and Ribicoff settled; Udall and Goldberg nearly. Fulbright the likeliest for State. Kennedy asks after Stevenson for Attorney General; Blair sounds Stevenson out that night, who prefers the UN. Lovett to lunch.
    n: '[[w.schlesinger-thousand-days-1965]], 129–31, 135, 139; [[w.schlesinger-journals]], 94–97 (the journal of Dec. 1: Evelyn Lincoln''s appointment for noon in the Senate office, Georgetown after, Lovett to lunch; Kennedy''s talk of Freeman, Goldberg and Udall, Fulbright ("I judge ... Bill is currently ahead for State"), then "What about Adlai for Attorney General?"; Kennedy: "I think I''ll call [Blair] tonight"; not Hodges or Ribicoff, nor Stevenson''s preference for the UN). Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-12-01.transition-and-staff]]. Names: Schlesinger, Kennedy, Hodges, Ribicoff, Udall, Goldberg, Fulbright, Stevenson, Blair, Lovett.'
    src:
      c: 94b06e15
      rows:
        - 'w.schlesinger-thousand-days-1965 129–31: A-C, G'
        - 'w.schlesinger-thousand-days-1965 139: D-F'
        - 'w.schlesinger-journals 94–97: A, D, E, G'
    tags: [name:schlesinger-arthur-m-jr, name:kennedy-john-f, name:hodges-luther-h, name:ribicoff-abraham, name:udall-stewart-l, name:goldberg-arthur-j, name:fulbright-j-william, name:stevenson-adlai-e, name:blair-william-m-jr, name:lovett-robert-a]
