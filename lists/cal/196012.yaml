  - id: cal.1960-12-08.transition-and-staff-cabinet
    when: Dec. 8
    date: '1960-12-08'
    thread: transition-and-staff-cabinet
    c: 'Kennedy and McNamara, president of the Ford Motor Company, a Republican, meet for the first time. Kennedy offers him the Treasury or Defense. McNamara: he knows nothing of government; Kennedy: "I don''t know how to be president, either."'
    n: '[[w.reeves-president-kennedy]], 25. To check: Roswell Gilpatric, oral history, 63, Kennedy Library; Robert McNamara, oral history, 11, Kennedy Library (cited by [[w.reeves-president-kennedy]], 25). Check: the day, "six days" after *Time* of Dec. 2 by Reeves. Names: McNamara, Kennedy.'
