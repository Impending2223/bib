  - id: cal.1960-12-20.china-leadership
    when: Dec. 20
    date: '1960-12-20'
    thread: china-zhou-foreign
    also: [laos, china-foreign]
    c: 'Zhou Enlai with Chen Yi takes Sihanouk and his wife to Nanjing and Hangzhou.{1} On the train to Nanjing: China supports the United Nations, which has some use, but America commands the voting machine, its majority shrinking but still a majority; the Congo is the case, with states now withdrawing from the UN force and Lumumba having brought the UN in and been unable to get it out. So China wants the Laos question settled in the form of the Geneva Conference, not because China is outside the UN but because America can still manipulate it. Per the Chinese summary, from the interpreter''s recollection: Zhou tells Sihanouk that China''s statement of the evening before backs the DRV''s call for a new Geneva Conference; Sihanouk says Cambodia will first state that it will attend, and would have Thailand and South Vietnam invited; Zhou: then India and Burma too, and Canada and Poland if wider, Cambodia to propose it, and Cambodia''s Foreign Ministry to hand the statement to Saigon. Sihanouk says Cambodia would join the neutral states'' commission of inquiry on the Congo that Khrushchev proposes.{2}'
    n: '"[Summary of Talks between Prime Minister Zhou Enlai and Norodom Sihanouk while Driving to Nanjing on December 20th](https://digitalarchive.umd.edu/document/120871)" (Dec. 29, 1960), PRC FMA 106-00274-03, 10–11, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive. [[w.zhou-enlai-nianpu-1949]], II, 380 (Dec. 20, 1960); [[w.zhou-enlai-waijiao-huodong]], 296–97 (Dec. 20, 1960; 上午); [[w.chen-yi-nianpu]], 849 (Dec. 20, 1960, morning; Chen Yi with Zhou Enlai and Sihanouk leaves Peking for the south, welcomed by the local leaders passing Tianjin and Jinan); [[w.peng-zhen-nianpu-1902]], IV, 85 (Dec. 20, 1960, morning; Peng Zhen at the station to see Zhou off with Prince Sihanouk to the provinces). The record: "not reviewed, according to interpreter comrade QI Zonghua''s recollection" (10). Made public: 1993. Names: Zhou Enlai, Chen Yi, Sihanouk, Khrushchev.'
    src:
