  - id: cal.1960-12-05.china-leadership
    when: Dec. 5
    date: '1960-12-05'
    thread: china-zhou
    c: 'Zhou Enlai with Zhang Guohua, Yang Jingren and others on Tibet: land certificates to be issued; ownership after reform unchanged at least four years, mutual-aid groups only, no cooperatives, no second set of books, no hurry for communes; well-run cooperatives of former slaves not to be broken up; collective life slow and unforced, first individual then collective; cooperatives hurried by leaders against the masses to stop. Protect labor and raise output; give people time to settle; Han cadres to keep to policy, bad style taught, serious cases sent back inland.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 375 (Dec. 5, 1960). Made public: 1997. Names: Zhou Enlai, Zhang Guohua, Yang Jingren.'
