    c: 'Wofford to the President-elect, at his asking, a confidential memorandum of thirty pages on civil rights in 1961: no new bill but the Commission''s extension, an anti-poll-tax amendment and a change in the cloture rule; executive action, the housing order first; voting suits for a year before any voting bill; Louis Martin to the White House staff; Johnson to chair the equal employment committee, "the more of the load of civil rights that Johnson will carry, the better." "If the full power of the Federal Government can be brought to bear on this problem with intelligence and consistency, the racial bottleneck in our national life can be broken in one decade."'
    n: '[[w.wofford-of-kennedys-and-kings]], 130–31, 136–39. To check: Wofford to Kennedy, December 1960 (quoted by [[w.wofford-of-kennedys-and-kings]], 136–39). Check: the day. Names: Wofford, Kennedy, Johnson.'
