  - id: cal.1960-12.transition-and-staff-3
    when: Dec., last week
    date: 1960-12
    thread: transition-and-staff
    c: 'Fulbright and Kennedy at golf: a summit with Khrushchev in 1961; a body to reach the young of the developing nations; fewer troops in Europe, for the gold. Kennedy commits the government to buy Reynolds Aluminum''s 1961 output. Fulbright urges Ball for Under Secretary, Reischauer for Tokyo.'
    n: '[[w.woods-fulbright]], 259, 261. Check: the day, and whether at Palm Beach; Woods has them corresponding, talking and at golf the last week of December and the first of January, and Kennedy''s father telling Fulbright at Palm Beach of the liberals'', the NAACP''s and the Zionists'' protests. To check: "During Talks with President-Elect Kennedy Fulbright Hits on Arkansas Topics," *Northwest Arkansas Times*, Dec. 30, 1960; Marcy to Fulbright, Dec. 27, 1960, Series 48:7, Box 1:2, SPF (cited by [[w.woods-fulbright]], 261 nn.1, 3). See [[cal.1961-01.transition-and-staff]]. Names: Fulbright, Kennedy, Khrushchev, Ball, Reischauer.'
    src:
      c: 359222c1
      rows:
        - 'w.woods-fulbright 259, 261: all'
        - 'via x.1960-12-30.northwest-arkansas-times-fulbright: A-B'
        - 'via x.1960-12-27.marcy-to-fulbright: A'
    tags: [name:fulbright-j-william, name:kennedy-john-f, name:ball-george-w, name:reischauer-edwin-o]
  - id: cal.1960-12.defense-2
    when: Dec., late
    date: 1960-12
    thread: defense
    also: [transition-and-staff]
    c: 'After the late December budget and program review, the President-elect to McNamara: a list of questions (a supplemental defense budget; more for Polaris, Minuteman and Atlas; an air alert; airlift; a basic re-evaluation of strategy, bases abroad, the command and control of nuclear weapons). His first policy change: "Under no circumstances should we allow a predetermined arbitrary financial limit to establish either strategy or force levels."'
    n: '[[w.sorensen-kennedy]], 602–03 (the list and the instruction quoted). Check: the day, and the document (Sorensen gives no date beyond the December review). See [[cal.1960-12-21.transition-and-staff]]. Names: Kennedy, McNamara.'
    src:
      c: 6796c3b9
      rows:
        - 'w.sorensen-kennedy 602–03: all'
        - 'via x.1960-12.kennedy-to-mcnamara-defense-questions: all'
    tags: [name:kennedy-john-f, name:mcnamara-robert-s]
  - id: cal.1960-12-31.laos-2
    when: Dec. 31–Jan. 3
    date: '1960-12-31'
    thread: laos
    c: The Plain of Jars lost. The North Vietnamese from the east, Kong Le's paratroopers flown in by the Soviets from the west; the FAL at Xieng Khouangville, surprised, flees to Tha Thom and Paksane. Jan. 3, Phoumi's paratroopers dropped to restore it scatter. Vang Pao's Meo withdraw to the mountains in order.
    n: '[[w.anthony-war-in-northern-laos]], 39. Names: Kong Le, Phoumi Nosavan, Vang Pao.'
    src:
