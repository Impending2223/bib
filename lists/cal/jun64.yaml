entries:
  - id: cal.1964-06-01.vietnam
    when: June 1–2
    date: '1964-06-01'
    thread: vietnam
    also: [laos]
    c: 'Honolulu. Rusk, McNamara, Taylor and McCone with Lodge, Westmoreland, Felt and Sharp on Vietnam and Laos. A joint resolution of Congress and strikes on the North discussed, and the preparation each would need. Johnson, June 2: "bound by solemn commitments to help defend this area against Communist encroachment."'
    n: 'FRUS 1964–68, I, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v01/d187), [188](https://history.state.gov/historicaldocuments/frus1964-68v01/d188), [189](https://history.state.gov/historicaldocuments/frus1964-68v01/d189). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1056) (June 2, 1964). See [[cal.1964-05-24.vietnam]]. Names: Rusk, McNamara, Taylor, McCone, Lodge, Westmoreland, Felt, Sharp, Johnson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a, name:lodge-henry-cabot, name:westmoreland-william, name:felt-harry-d, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1964-06-01.court
    when: June 1
    date: '1964-06-01'
    thread: court
    also: [alabama, civil-rights-organizations]
    c: '*NAACP v. Alabama ex rel. Flowers*, [377 U.S. 288](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377288/usrep377288.pdf). The NAACP, barred from Alabama by a State court''s order of June 1, 1956, before the Court a fourth time. The judgment ousting it reversed; the Alabama Supreme Court to have the injunction vacated and the Association let qualify to do business. Harlan for the Court.'
    n: Opinion (K–J Cong. II.J.1). [[w.powe-warren-court-and-american]]; [[w.wilkins-standing-fast]].
  - id: cal.1964-06-01.antisubversion-wa
    when: June 1
    date: '1964-06-01'
    thread: antisubversion
    also: [court, students]
    c: '*Baggett v. Bullitt*, [377 U.S. 360](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377360/usrep377360.pdf): Washington''s oaths, the teachers'' of 1931 and the State employees'' of 1955 under its Subversive Activities Act, void for vagueness; brought by faculty, staff and students of the University of Washington. White for the Court, 7–2; Clark and Harlan dissent.'
    n: '[[w.powe-warren-court-and-american]].'
    tags: [state:wa]
  - id: cal.1964-06-01.middle-east
    when: June 1–2
    date: '1964-06-01'
    thread: middle-east
    c: 'Eshkol at the White House. Johnson: the United States is and will remain interested in Israel''s security. Tanks: Johnson to speak to Erhard. Joint statement, June 2.'
    n: '[Remarks of Welcome at the White House to Prime Minister Eshkol of Israel](https://www.presidency.ucsb.edu/documents/remarks-welcome-the-white-house-prime-minister-eshkol-israel); [Toasts of the President and Prime Minister Eshkol](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-prime-minister-eshkol) (June 1, 1964); [Joint Statement Following Discussions With the Prime Minister of Israel](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-israel) (June 2, 1964). FRUS 1964–68, XVIII, docs. [65](https://history.state.gov/historicaldocuments/frus1964-68v18/d65), [67](https://history.state.gov/historicaldocuments/frus1964-68v18/d67). [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]. Names: Eshkol, Erhard.'
    tags: [name:eshkol-levi, name:johnson-lyndon-b, name:erhard-ludwig]
  - id: cal.1964-06-02.elections-1964
    when: June 2
    date: '1964-06-02'
    thread: elections-1964
    also: [goldwater]
    c: 'Primaries in California and South Dakota. Republican: Goldwater in California; unpledged delegates in South Dakota. Democratic: unpledged delegates in California and South Dakota.'
    n: '[Cal. Secretary of State, *Statement of Vote, Consolidated Primary Election, June 2, 1964*, 4–7](https://archive.org/details/castatem196264cali/page/n123); [S.D. Secretary of State, *Official Election Returns for South Dakota, Primary Election, June 2, 1964*, "Presidential Delegates and Alternates"](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1964P.pdf#page=4). CQ Guide 6th (2010) 407–408. See [[cal.1964-03-10.elections-1964]]. Names: Goldwater.'
    tags: [primary:1964-06-02, name:goldwater-barry-m]
  - id: cal.1964-06-02.alabama
    when: June 2
    date: '1964-06-02'
    thread: alabama
    also: [elections-1964]
    c: 'Alabama''s second primary. The nine Democratic nominees for Representative on one statewide ballot, the eight highest to be the party''s nominees: Carl Elliott ninth, 316,775, 5,098 votes short. Connor nominated president of the Public Service Commission, 225,676 to 204,418. Aug. 19, the legislature, in special session, draws eight districts for November (Act No. 21).'
    n: '[*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), 524](https://archive.org/details/alabama-official-statistical-register-1967/page/n525)–[526](https://archive.org/details/alabama-official-statistical-register-1967/page/n527), [530](https://archive.org/details/alabama-official-statistical-register-1967/page/n531) (the nominees), [260](https://archive.org/details/alabama-official-statistical-register-1967/page/n261) (Act No. 21). Encyclopedia of Alabama, ["Carl Elliott"](https://encyclopediaofalabama.org/article/carl-elliott/). See [[cal.1964-05-05.alabama]]. Names: Elliott, Connor.'
    tags: [name:elliott-carl-a, name:connor-eugene]
  - id: cal.1964-06-02.governors-mt
    when: June 2
    date: '1964-06-02'
    thread: governors
    also: [elections-1964]
    c: 'Montana''s primary. Democratic, for governor: Renne, once president of Montana State College, 71,967, 55.9 percent; Kuchera 56,710, 44.1. Republican: Governor Babcock unopposed.'
    n: 'Votes: [Wikipedia, "1964 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1964_Montana_gubernatorial_election); Check: [Mont. *Report of the Official Canvass of the Vote Cast at the Primary Election, June 2, 1964*](https://archive.org/details/primaryofficial1964montrich). [[w.malone-montana]]. Names: Tim Babcock, Renne, Kuchera.'
    tags: [state:mt, name:renne-roland-r, name:kuchera-mike, name:babcock-tim-m]
  - id: cal.1964-06-02.elections-1964-ca
    when: June 2
    date: '1964-06-02'
    thread: elections-1964
    also: [states-and-cities]
    c: 'California''s Senate primaries. Democratic: Salinger, the President''s press secretary, 1,177,517, 44.3 percent; Cranston, State Controller, endorsed by the California Democratic Council, 1,037,748, 39.0; Engle, who withdrew Apr. 28, 119,967. Republican: Murphy 1,121,591, 54.1 percent of the three; Leland Kaiser 689,323.'
    n: 'Votes: [Cal. *Statement of Vote*, June 2, 1964, p. 8](https://archive.org/details/castatem196264cali/page/n127). [[w.hill-dancing-bear]]; [[w.schuparra-triumph-of-the-right]]. See [[cal.1964-06-02.elections-1964]]. Names: Salinger, Engle, Cranston, Kaiser, Murphy.'
    tags: [state:ca, name:salinger-pierre, name:cranston-alan, name:engle-clair, name:murphy-george, name:kaiser-leland]
  - id: cal.1964-06-02.governors-sd
    when: June 2
    date: '1964-06-02'
    thread: governors
    also: [elections-1964]
    c: 'South Dakota, governor; Governor Gubbrud not running. Republican primary: Boe 53.5 percent, Sigurd Anderson, governor 1951–55, 46.5. Democratic: Lindley 65.8, Tice 34.2.'
    n: '[*Official Election Returns by Counties, Primary Election, June 2, 1964*](https://sdsos.gov/elections-voting/assets/historicalelectiondata/1964P.pdf); figures from [Wikipedia, "1964 South Dakota gubernatorial election"](https://en.wikipedia.org/wiki/1964_South_Dakota_gubernatorial_election) (Check: the scan). [[w.peirce-great-plains-states-of]]. Names: Gubbrud, Boe, Sigurd Anderson, Lindley, Tice.'
    tags: [state:sd, name:gubbrud-archie, name:boe-nils-a, name:anderson-sigurd, name:lindley-john-f, name:tice-merton-b]
  - id: cal.1964-06-03.japan-and-korea
    when: June 3–July 28
    date: '1964-06-03'
    thread: japan-and-korea
    c: 'Seoul. Students in the streets against the settlement with Japan since Mar. 24; June 3, rioting. Park declares martial law in the capital; the U.N. commander, asked, releases two divisions. Berger: martial law no answer; Korean leaders want Kim Chong-p''il out. Kim gives up the party''s chairmanship and goes abroad. Martial law lifted July 28.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [6](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d6), [11](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d11), [13](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d13), [14](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d14), [15](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d16), [339](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d339). [[w.lee-troubled-peace]]; [[w.cha-alignment-despite-antagonism]]; [[w.park-chung-hee-era]]. See [[cal.1962-10-29.japan-and-korea]]. Names: Park, Kim Chong-p''il, Berger.'
    tags: [name:park-chung-hee, name:berger-samuel-d, name:kim-chong-pil]
  - id: cal.1964-06-05.europe-and-the-alliance
    when: June 5
    date: '1964-06-05'
    thread: europe-and-the-alliance
    also: [middle-east]
    c: 'Cyprus. Johnson to Inonu, Turkey preparing to intervene on the island: no action without consultation; "Adhesion to NATO, in its very essence, means that NATO countries will not wage war on each other"; American arms not to be used. Inonu puts off the intervention at the American request.'
    n: 'FRUS 1964–68, XVI, docs. [54](https://history.state.gov/historicaldocuments/frus1964-68v16/d54), [55](https://history.state.gov/historicaldocuments/frus1964-68v16/d55). [[w.ball-past-has-another-pattern]]; [[w.nicolet-united-states-policy-towards]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, İnönü.'
    tags: [name:johnson-lyndon-b, name:inonu-ismet]
  - id: cal.1964-06-05.middle-east
    when: June 5–8
    date: '1964-06-05'
    thread: middle-east
    c: 'The Shah in Washington, an informal visit: the exhibit "7000 Years of Iranian Art." With Johnson, June 5: Arab designs on Khuzistan, Iran''s defenses, Bandar Abbas as a base, OPEC "an instrument of Arab imperialism." Johnson and Rusk ask Jersey Standard''s and California Standard''s men at lunch to treat Iran fairly. Johnson''s toast: "a reformist 20th century monarch." June 6, Defense offers C-130s and tanks.'
    n: '[Toasts of the President and the Shah of Iran](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-the-shah-iran-3) (June 5, 1964). FRUS 1964–68, XXII, docs. [31](https://history.state.gov/historicaldocuments/frus1964-68v22/d31), [34](https://history.state.gov/historicaldocuments/frus1964-68v22/d34), [36](https://history.state.gov/historicaldocuments/frus1964-68v22/d36), [37](https://history.state.gov/historicaldocuments/frus1964-68v22/d37), [38](https://history.state.gov/historicaldocuments/frus1964-68v22/d38). [[w.bill-eagle-and-the-lion]]; [[w.afkhami-life-and-times-of]]; [[w.milani-shah]]; [[w.offiler-us-foreign-policy-and]]. See [[cal.1962-04-11.middle-east]]. Names: Johnson, Pahlavi, Rusk.'
    tags: [name:johnson-lyndon-b, name:pahlavi-mohammed-reza, name:rusk-dean]
  - id: cal.1964-06-06.laos
    when: June 6–9
    date: '1964-06-06'
    thread: laos
    c: Laos. Lieutenant Klusmann's Navy reconnaissance plane shot down over the Plain of Jars, June 6; a second plane, June 7. June 8, Johnson approves a strike on the antiaircraft guns, "with grave reservations"; Unger opposed from Vientiane. Eight F-100s attack them at Xieng Khouang, June 9.
    n: '[FRUS 1964–68, I, doc. 206](https://history.state.gov/historicaldocuments/frus1964-68v01/d206) (editorial note); [FRUS 1964–68, XXVIII, doc. 83](https://history.state.gov/historicaldocuments/frus1964-68v28/d83). See [[cal.1964-05-17.laos]]. Names: Johnson, Unger, Klusmann.'
    tags: [name:johnson-lyndon-b, name:unger-leonard, name:klusmann-charles-f]
  - id: cal.1964-06-06.elections-1964-tx
    when: June 6
    date: '1964-06-06'
    thread: elections-1964
    c: 'Texas Republican runoff for Senator: George Bush 49,751, 62.1 percent; Jack Cox 30,333.'
    n: '[Wikipedia, "1964 United States Senate election in Texas"](https://en.wikipedia.org/wiki/1964_United_States_Senate_election_in_Texas). See [[cal.1964-05-02.governors-tx]]. Names: Bush, Cox.'
    tags: [state:tx, name:bush-george-h-w, name:cox-jack]
  - id: cal.1964-06-07.opinion
    when: June 7
    date: '1964-06-07'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 22–27: mass demonstrations by Negroes will hurt the cause of racial equality, 74 percent; help it, 15. Whites 81 hurt; non-whites 55 help, 22 hurt.'
    n: '[[w.gallup-poll]], III, 1884.'
  - id: cal.1964-06-07.states-and-cities-us
    when: June 7–10
    date: '1964-06-07'
    thread: states-and-cities
    also: [civil-rights-bill, elections-1964]
    c: 'Governors'' Conference at Cleveland. Eisenhower speaks, June 8. June 9: civil rights in three workshops, on education, employment and public accommodations, reported to the full conference without a vote. Scranton, Rockefeller and Romney there; the Senate''s cloture vote on the civil rights bill June 10, the last day.'
    n: '[*Proceedings of the Governors'' Conference, 1964*, 6, 49–69](https://www.nga.org/wp-content/uploads/2021/03/1964NGAAnnualMeeting.pdf#page=22). [[w.white-making-of-the-president-1965]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1963-07-21.states-and-cities-us]]. Names: Eisenhower, Scranton, Rockefeller, Romney.'
    tags: [name:eisenhower-dwight-d, name:scranton-william-w, name:rockefeller-nelson, name:romney-george-w]
  - id: cal.1964-06-09.governors-in
    when: June 9–12
    date: '1964-06-09'
    thread: governors
    also: [elections-1964]
    c: 'Indiana''s conventions name the candidates for governor. Republican, June 9: Lieutenant Governor Ristine, who broke the Senate''s tie for the sales tax, 55.3 percent of the delegates'' votes on the first ballot, over five others, U.S. Representative Bray among them. Democratic, June 12: Roger Branigin, a lawyer of Lafayette, Ind., 65.6 percent; Marshall Kizer, minority leader of the State Senate, 26.9.'
    n: '[Wikipedia, "1964 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1964_Indiana_gubernatorial_election), from *America Votes 6* and CQ (Check). Nov. 3, Branigin over Ristine, 1,164,620 to 901,342, 56.2 percent. [[w.peirce-great-lakes-states-of]]. See [[cal.1963-03-12.state-and-city-finance-in]]; [[cal.1964-05-05.elections-1964]]. Names: Ristine, Branigin, Kizer, Bray.'
    tags: [state:in, name:ristine-richard-o, name:bray-william-g, name:branigin-roger-d, name:kizer-marshall-f]
  - id: cal.1964-06-10.civil-rights-bill
    when: June 10
    date: '1964-06-10'
    thread: civil-rights-bill
    c: 'Cloture on the civil rights bill, [71–29](https://voteview.com/rollcall/RS0880302), the first on a civil rights bill since Rule XXII''s adoption in 1917: Republicans 27–6, Democrats 44–23. Byrd had spoken through the night, 14 hours 13 minutes. Dirksen: "Stronger than all the armies is an idea whose time has come." June 9, Morton''s jury trial amendment, every title but voting, adopted, [51–48](https://voteview.com/rollcall/RS0880298).'
    n: '[110 Cong. Rec., Senate, June 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt10/pdf/GPO-CRECB-1964-pt10-6-2.pdf). [Cloture and Final Passage of the Civil Rights Act of 1964](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/cloture-and-final-passage-of-the-civil-rights-act-of-1964-essay.htm) (Senate Historical Office). [[w.mann-walls-of-jericho]]; [[w.finley-delaying-the-dream]]; [[w.macneil-dirksen]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd, Dirksen, Morton.'
    tags: [name:byrd-robert-c, name:dirksen-everett, name:morton-thruston-b]
  - id: cal.1964-06-10.opinion
    when: June 10
    date: '1964-06-10'
    thread: opinion
    also: [civil-rights-bill, elections-1964-polls]
    c: 'Gallup, May 22–27: of two candidates of one''s own party, alike but for civil rights, the one for civil rights, 60 percent; the one against, 25. Southern whites 31 for, 54 against; whites outside the South 65 and 19.'
    n: '[[w.gallup-poll]], III, 1884–85.'
  - id: cal.1964-06-11.robert-kennedy
    when: June 11
    date: '1964-06-11'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy to Johnson: "if you wished me to go to Viet Nam in any capacity I would be glad to do so." Johnson by telephone that evening thanks him and asks his help in choosing an ambassador; June 12, Kennedy proposes Terry Sanford. May 28, he had urged a group on Vietnam like the ExComm.'
    n: '[Johnson and Robert Kennedy, 6:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation-june-11), Tape WH6406.06, Citation #3699 (Miller Center); [June 12, 7:26 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-june-12-1964), Tape WH6406.08, Citation #3731 (Miller Center); [May 28, 11:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-may-28-1964), Tape WH6405.11, Citations #3539 and #3540 (Miller Center). Kennedy to Johnson, June 11, 1964, LBJ Library (Check the file). [[w.taking-charge-2001]]; [[w.shesol-mutual-contempt]]; [[w.schlesinger-robert-kennedy-and-his]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy, Johnson, Sanford.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:sanford-terry]
  - id: cal.1964-06-11.desegregation-public-places-fl
    when: June 11–18
    date: '1964-06-11'
    thread: desegregation-public-places
    also: [civil-rights-bill, king]
    c: 'St. Augustine. King arrested on the steps of the Monson Motor Lodge''s restaurant, June 11. June 18: seventeen rabbis arrested there; Negro and white demonstrators in its pool, the manager pours in what he says is muriatic acid. A grand jury asks SCLC to leave for thirty days; King and Hayling refuse.'
    n: 'King, [Draft, Answer to Presentment of Grand Jury](https://okra.stanford.edu/link/document640619-005), June 19, 1964 (King Papers Project). [[w.colburn-racial-change-and-community]]; [[w.garrow-bearing-the-cross]]; [[w.branch-pillar-of-fire]]. See [[cal.1964-03-31.desegregation-public-places-fl]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Martin Luther King, Hayling.'
    tags: [name:king-martin-luther-jr, name:hayling-robert-b, state:fl, city:st-augustine]
  - id: cal.1964-06-12.elections-1964
    when: June 12
    date: '1964-06-12'
    thread: elections-1964
    c: Scranton announces for the Republican nomination, at the Maryland Republican convention in Baltimore. Rockefeller withdraws for him, June 15. Check the date.
    n: '[[w.wolf-william-warren-scranton]]; [[w.white-making-of-the-president-1965]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-06-02.elections-1964]]. Names: Scranton, Rockefeller.'
    tags: [name:scranton-william-w, name:rockefeller-nelson]
  - id: cal.1964-06-12.africa
    when: June 12–18
    date: '1964-06-12'
    thread: africa
    c: 'Pretoria, June 12: Mandela and seven others of the Rivonia trial sentenced to life imprisonment. Security Council, June 18, Resolution 191, 8–0, Czechoslovakia, France and the Soviet Union abstaining: a group of experts on measures the Council might take; the United States for.'
    n: '[S.C. Res. 191](https://undocs.org/S/RES/191(1964)) (June 18, 1964). [[w.irwin-gordian-knot]]; [[w.noer-cold-war-and-black]]. See [[cal.1964-04-24.africa]]. Names: Mandela.'
    tags: [name:mandela-nelson]
  - id: cal.1964-06-12.europe-and-the-alliance
    when: June 12
    date: '1964-06-12'
    thread: europe-and-the-alliance
    also: [berlin-and-vienna]
    c: 'Erhard in Washington, with Schröder. Joint statement: the multilateral force "a significant addition" to the alliance''s strength, an agreement to be readied for signature by the end of the year; the Kennedy Round''s tariff cuts in the interest of all; more German aid to South Vietnam. The Soviet treaty with East Germany, signed the same day, does not touch Western rights in Berlin.'
    n: '[Joint Statement Following Discussions With Chancellor Erhard of Germany](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-chancellor-erhard-germany); [Toasts of the President and Chancellor Erhard](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-chancellor-erhard) (June 12, 1964). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1964-04-10.europe-and-the-alliance]]. Names: Erhard, Schröder, Johnson.'
    tags: [name:erhard-ludwig, name:schroder-gerhard, name:johnson-lyndon-b]
  - id: cal.1964-06-14.mississippi
    when: June 14–27
    date: '1964-06-14'
    thread: mississippi
    also: [students]
    c: 'Freedom Summer. Volunteers for the Mississippi Summer Project, most of them white Northern students, trained in two one-week sessions at the Western College for Women, Oxford, Ohio. COFO''s project, Moses directing: voter registration, Freedom Schools, the Freedom Democratic Party.'
    n: 'Vincent Harding, [Freedom Summer Orientation Briefing](https://www.crmvet.org/docs/harding.htm) (transcript, Oxford, Ohio). Wisconsin Historical Society: Freedom Summer collections (K–J Cong. II.L). [[w.mcadam-freedom-summer]]; [[w.carson-in-struggle]]; [[w.dittmer-local-people]]; [[w.payne-ive-got-the-light]]; [[w.branch-pillar-of-fire]]; [[w.watson-freedom-summer]]. See [[cal.1963-06-12.mississippi]]. Names: Moses.'
    tags: [name:moses-robert-p]
  - id: cal.1964-06-15.court
    when: June 15
    date: '1964-06-15'
    thread: court
    also: [states-and-cities, alabama]
    c: '*Reynolds v. Sims*, [377 U.S. 533](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377533/usrep377533.pdf). Alabama''s legislature, last apportioned on the 1900 census; the district court''s judgment affirmed. Both houses of a State legislature to be apportioned by population, districts "as nearly of equal population as is practicable." "Legislators represent people, not trees or acres." Warren for the Court; Harlan dissents. The same day, the apportionments of New York, Maryland, Virginia, Delaware and Colorado struck down; Colorado''s, approved by its voters in 1962, over Stewart''s and Clark''s dissents.'
    n: '*WMCA, Inc. v. Lomenzo*, [377 U.S. 633](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377633/usrep377633.pdf); *Maryland Committee for Fair Representation v. Tawes*, [377 U.S. 656](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377656/usrep377656.pdf); *Davis v. Mann*, [377 U.S. 678](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377678/usrep377678.pdf); *Roman v. Sincock*, [377 U.S. 695](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377695/usrep377695.pdf); *Lucas v. Forty-Fourth General Assembly*, [377 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377713/usrep377713.pdf). Opinions (Opp. II.H.1; K–J Cong. II.J.1). [[w.cortner-apportionment-cases]]; [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.dixon-democratic-representation]]; [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1962-03-26.court]]. Names: Warren.'
    tags: [name:warren-earl, state:co, state:md, state:de]
  - id: cal.1964-06-16.congo
    when: June 16–30
    date: '1964-06-16'
    thread: congo
    c: 'Congo. State confirms that American civilian pilots under contract to the Congolese government have flown combat sorties in Kivu. McCone to the Special Group, June 18: two of their T-28s helped stop a rebel attack at Kamanyola. Tshombe back from exile, June 26; the last UN troops leave June 30. Check the last.'
    n: '[FRUS 1964–68, XXIII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v23/d178) (editorial note). [[w.weissman-american-foreign-policy-in]]; [[w.namikas-battleground-africa]]. See [[cal.1963-01-14.congo]]. Names: McCone, Tshombe.'
    tags: [name:mccone-john-a, name:tshombe-moise]
  - id: cal.1964-06-18.vietnam
    when: June 18
    date: '1964-06-18'
    thread: vietnam
    c: Seaborn, Canada's new commissioner on the International Control Commission, sees Phạm Văn Đồng in Hanoi, carrying American views as Johnson and Pearson agreed May 28. Check the date.
    n: 'FRUS 1964–68, I, docs. [182](https://history.state.gov/historicaldocuments/frus1964-68v01/d182) (Johnson and Pearson, May 28), [222](https://history.state.gov/historicaldocuments/frus1964-68v01/d222) (Lodge on Seaborn''s report). [[w.thies-when-governments-collide]]; [[w.logevall-choosing-war]]. See [[cal.1964-06-01.vietnam]]. Names: Seaborn, Phạm Văn Đồng, Johnson, Pearson.'
    tags: [name:seaborn-j-blair, name:pham-van-dong, name:johnson-lyndon-b, name:pearson-lester-b]
  - id: cal.1964-06-18.desegregation-schools
    when: June 18
    date: '1964-06-18'
    thread: desegregation-schools
    also: [alabama]
    c: 'Fifth Circuit, on the Birmingham and Mobile school plans: desegregation to proceed "at a swifter pace," ten years after *Brown*. Birmingham, its 12th grade begun in 1963, to add the 10th, 11th and 1st grades in September 1964, then a grade a year at each level; Mobile to file a plan meeting the same minimum. Savannah and Brunswick, Ga., Bell writing: the finding below that Negro and white pupils'' differing test scores warrant separate schools reversed; Negro pupils who overlap white pupils in aptitude are segregated for the averages, "Therein is the discrimination." A grade a year over twelve years "no longer satisfactory." Savannah had opened its 12th grade, Sept. 1963.'
    n: '*Armstrong v. Board of Education of the City of Birmingham*, [333 F.2d 47](https://static.case.law/f2d/333/html/0047-01.html) (5th Cir. 1964); *Davis v. Board of School Commissioners of Mobile County*, [333 F.2d 53](https://static.case.law/f2d/333/html/0053-01.html) (5th Cir. 1964); *Stell v. Savannah-Chatham County Board of Education*, [333 F.2d 55](https://static.case.law/f2d/333/html/0055-01.html) (5th Cir. 1964). [[w.bass-unlikely-heroes]]. See [[cal.1963-09-09.alabama]]. Names: Bell.'
    tags: [name:bell-griffin-b]
  - id: cal.1964-06-19.civil-rights-bill
    when: June 19
    date: '1964-06-19'
    thread: civil-rights-bill
    also: [goldwater]
    c: 'Senate passes the civil rights bill, [73–27](https://voteview.com/rollcall/RS0880409): Republicans 27–6, Democrats 46–21; of the eleven Southern States'' Senators, Yarborough alone for. The Mansfield–Dirksen substitute adopted June 17, [76–18](https://voteview.com/rollcall/RS0880407); Gore''s motion to recommit refused, [25–74](https://voteview.com/rollcall/RS0880408). Goldwater, June 18: "no constitutional basis" for the public accommodations and employment titles. He votes no.'
    n: '[110 Cong. Rec., Senate, June 18, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-2-1.pdf); [June 19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-3-2.pdf). [Statement by the President Following Senate Passage of the Civil Rights Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-passage-the-civil-rights-bill) (June 19, 1964). [[w.perlstein-before-the-storm]]; [[w.goldberg-barry-goldwater]]. See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Yarborough, Gore, Mansfield, Dirksen, Goldwater, Johnson.'
    tags: [name:yarborough-ralph, name:gore-albert-sr, name:mansfield-mike, name:dirksen-everett, name:goldwater-barry-m, name:johnson-lyndon-b]
  - id: cal.1964-06-19.congress
    when: June 19
    date: '1964-06-19'
    thread: congress
    c: Edward Kennedy's chartered plane, taking him and Bayh from the vote to the Massachusetts Democratic convention at West Springfield, Mass., crashes in an orchard near Southampton, Mass. The pilot and Kennedy's aide Edward Moss killed; Bayh pulls Kennedy from the wreck. Kennedy's back broken; in the hospital for months.
    n: '[[w.clymer-edward-m-kennedy]]; [[w.kennedy-true-compass]]. Names: Edward M. Kennedy, Bayh.'
    tags: [name:kennedy-edward-m, name:bayh-birch, state:ma]
  - id: cal.1964-06-19.transportation
    when: June 19
    date: '1964-06-19'
    thread: transportation
    also: [cities-and-housing]
    c: Concord, Cal. Johnson, with Brown, at the ground-breaking for the Bay Area Rapid Transit test track. The mass transit bill passed by the Senate, before the House.
    n: '[Remarks in Concord, California, at the Groundbreaking for the San Francisco Bay Area Rapid Transit Test Track](https://www.presidency.ucsb.edu/documents/remarks-concord-california-the-groundbreaking-for-the-san-francisco-bay-area-rapid-transit) (June 19, 1964). See [[cal.1963-02-18.transportation]]. Names: Johnson, Brown.'
    tags: [name:johnson-lyndon-b, name:brown-edmund-g]
  - id: cal.1964-06-21.mississippi
    when: June 21
    date: '1964-06-21'
    thread: mississippi
    c: Chaney, Goodman and Schwerner, of CORE's Meridian project, missing in Neshoba County after a visit to the burned Mount Zion church at Longdale. Deputy Sheriff Price had held them in the Philadelphia jail; released after 10 p.m. June 23, their burned station wagon found near the Bogue Chitto; Johnson sees Goodman's and Schwerner's parents and sends Dulles to Mississippi. Check the last.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1054) (June 23, 1964). *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). [[w.taking-charge-2001]]; [[w.mars-witness-in-philadelphia]]; [[w.cagin-we-are-not-afraid]]; [[w.dittmer-local-people]]; [[w.gage-g-man]]. See [[cal.1964-06-14.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Johnson, Dulles.'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r, name:johnson-lyndon-b, name:dulles-allen-w]
  - id: cal.1964-06-21.opinion
    when: June 21
    date: '1964-06-21'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, June 4–9: Republicans'' choice for 1964: Lodge 26, Nixon 25, Goldwater 21, Rockefeller 10, Scranton 9, Romney 5; others, no preference 4. Independents: Lodge 26, Goldwater 19, Nixon 17, Rockefeller 14.'
    n: '[[w.gallup-poll]], III, 1888. Names: Nixon, Goldwater, Lodge, Rockefeller, Romney, Scranton.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-06-22.court
    when: June 22
    date: '1964-06-22'
    thread: court
    also: [desegregation-public-places]
    c: 'The Term''s last day. *Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf): sit-in demonstrators'' trespass convictions at a Baltimore restaurant vacated and remanded, Maryland and Baltimore having since forbidden such discrimination; Brennan for the Court. Black, Harlan and White would affirm; Douglas, Goldberg and Warren would reverse on the Constitution. *Escobedo v. Illinois*, [378 U.S. 478](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378478/usrep378478.pdf): a confession taken after the suspect was refused his lawyer excluded, 5–4. *Aptheker v. Secretary of State*, [378 U.S. 500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378500/usrep378500.pdf): passports for Communist Party members, 6–3.'
    n: Opinions, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf), [478](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378478/usrep378478.pdf), [500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378500/usrep378500.pdf). [[w.schmidt-sit-ins]]; [[w.powe-warren-court-and-american]]; [[w.schwartz-super-chief]]. See [[cal.1964-05-25.court]].
    tags: [state:md, city:baltimore]
  - id: cal.1964-06-22.europe-and-the-alliance
    when: June 22–25
    date: '1964-06-22'
    thread: europe-and-the-alliance
    also: [middle-east]
    c: Cyprus. Inonu at the White House, June 22–23; Papandreou, June 24–25, apart. With Inonu, talks "proceeding from the present binding effects of existing treaties"; with Papandreou, a solution "based upon the principles of democracy and justice."
    n: '[Joint Statement Following Discussions With the Prime Minister of Turkey](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-turkey) (June 23, 1964); [Joint Statement Following Discussions With the Prime Minister of Greece](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-greece) (June 25, 1964). FRUS 1964–68, XVI, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v16/d72), [73](https://history.state.gov/historicaldocuments/frus1964-68v16/d73), [74](https://history.state.gov/historicaldocuments/frus1964-68v16/d74), [75](https://history.state.gov/historicaldocuments/frus1964-68v16/d75). See [[cal.1964-06-05.europe-and-the-alliance]]. Names: Johnson, İnönü, Papandreou.'
    tags: [name:johnson-lyndon-b, name:inonu-ismet, name:papandreou-george]
  - id: cal.1964-06-22.legislatures-fl
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Swann v. Adams*, [378 U.S. 553](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378553/usrep378553.pdf), per curiam: the three-judge court''s approval of Florida''s apportionment reversed and remanded under *Reynolds v. Sims*. Harlan dissents.'
    n: Opinion. See [[cal.1963-02-01.legislatures-fl]]; [[cal.1964-06-15.court]].
    tags: [state:fl]
  - id: cal.1964-06-22.legislatures-il
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Germano v. Kerner*, [378 U.S. 560](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378560/usrep378560.pdf), per curiam: the district court''s judgment for the Illinois Senate''s apportionment, which gave area weight, reversed and remanded under *Reynolds v. Sims*.'
    n: 'See [[cal.1964-06-15.court]]; [[cal.1964-01-04.legislatures-il]]. Names: Kerner.'
    tags: [state:il, name:kerner-otto]
  - id: cal.1964-06-22.legislatures-mi
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    c: 'Michigan Supreme Court, after *Reynolds v. Sims*: the Austin–Kleiner plan, the Democratic commissioners'' districts of equal population, ordered for the legislature in place of the Republican Hannah–Brucker plan it had ordered May 26. The new constitution''s weight to area set aside. The primary moved from August to Sept. 1.'
    n: Bernard Apol, [*Legislative Reapportionment in Michigan*](https://annarborchronicle.com/wp-content/uploads/2011/02/Apol-history-of-Michigan-reapportionment.pdf) (Public Sector Consultants, n.d.) (the court's order, *In re Apportionment of State Legislature—1964*, [373 Mich. 250](https://static.case.law/mich/373/html/0250-01.html); the opinions of Mar. 5–May 26, [372 Mich. 418](https://static.case.law/mich/372/html/0418-01.html)). [[w.dixon-democratic-representation]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1964-06-15.court]]; [[cal.1962-07-18.legislatures-mi]].
    tags: [state:mi]
  - id: cal.1964-06-22.legislatures-oh
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Nolan v. Rhodes*, [378 U.S. 556](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378556/usrep378556.pdf), per curiam: the judgment upholding Ohio''s apportionment of its House, a member to each county however small, reversed and remanded under *Reynolds v. Sims*. The district court orders a new plan; the House first elected on it in November 1966.'
    n: '[Wikipedia, "Representative history of the Ohio House of Representatives"](https://en.wikipedia.org/wiki/Representative_history_of_the_Ohio_House_of_Representatives) (Check: the remand orders, S.D. Ohio, 1965). See [[cal.1964-06-15.court]]. Names: Rhodes.'
    tags: [state:oh, name:rhodes-james-a]
  - id: cal.1964-06-22.legislatures-ok
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Williams v. Moss*, [378 U.S. 558](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378558/usrep378558.pdf): the district court''s reapportionment of the Oklahoma Legislature affirmed on the merits, per curiam; remanded for proceedings consistent with *Reynolds v. Sims*.'
    n: Opinion. See [[cal.1963-07-17.legislatures-ok]]; [[cal.1964-06-15.court]].
    tags: [state:ok]
  - id: cal.1964-06-22.legislatures-wa
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Meyers v. Thigpen*, [378 U.S. 554](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378554/usrep378554.pdf), per curiam: the district court''s judgment against the apportionment of Washington''s legislature affirmed, on *Reynolds v. Sims*. Remanded for the relief; the district court lets the 1964 elections go forward in the old districts and orders the 1965 session to redistrict before any other business.'
    n: '[Wash. Legislature, Oral History Program, "Redistricting: 1964"](https://app.leg.wa.gov/oralhistory/redistricting2/1960s/1964/). [[w.dixon-democratic-representation]]. See [[cal.1963-01-14.legislatures-wa]]; [[cal.1964-06-15.court]].'
    tags: [state:wa]
  - id: cal.1964-06-22.legislatures-ct
    when: June 22
    date: '1964-06-22'
    thread: legislatures
    also: [court]
    c: '*Pinney v. Butterworth*, [378 U.S. 564](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378564/usrep378564.pdf): the three-judge court''s judgment that Connecticut''s apportionment of its General Assembly, the House by towns, violates the Equal Protection Clause, affirmed per curiam on *Reynolds v. Sims*; remanded for relief. Harlan dissents.'
    n: 'District court: *Butterworth v. Dempsey*, [229 F. Supp. 754](https://static.case.law/f-supp/229/html/0754-01.html) (D. Conn. 1964). [[w.horton-connecticut-state-constitution]]. See [[cal.1964-06-15.court]]. Names: Dempsey.'
    tags: [state:ct, name:dempsey-john-n]
  - id: cal.1964-06-23.vietnam
    when: June 23
    date: '1964-06-23'
    thread: vietnam
    also: [transition-and-staff]
    c: Lodge resigns as Ambassador to South Vietnam, for "entirely personal reasons." Taylor to succeed him, U. Alexis Johnson as his deputy; Wheeler for Taylor as Chairman of the Joint Chiefs. Westmoreland had taken over the command in Saigon from Harkins, June 20.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1054) (June 23, 1964); [Remarks Upon Presenting the Distinguished Service Medal to General Harkins](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-general-harkins) (June 24, 1964). [FRUS 1964–68, I, doc. 220](https://history.state.gov/historicaldocuments/frus1964-68v01/d220) (editorial note). [[w.taylor-swords-and-plowshares]]; [[w.johnson-right-hand-of-power]]; [[w.blair-lodge-in-vietnam]]; [[w.nichter-last-brahmin]]; [[w.westmoreland-soldier-reports]]. Names: Lodge, U. Alexis Johnson, Taylor, Wheeler, Westmoreland, Harkins, Johnson.'
    tags: [name:lodge-henry-cabot, name:taylor-maxwell, name:johnson-u-alexis, name:wheeler-earle, name:westmoreland-william, name:harkins-paul-d, name:johnson-lyndon-b]
  - id: cal.1964-06-23.mississippi
    when: June 23–24
    date: '1964-06-23'
    thread: mississippi
    c: 'Johnson and Eastland, 3:59 p.m., on the missing three: Eastland takes it for a publicity stunt; should the President call Paul Johnson? 4:25: Eastland, having called the governor, reports his doubts too and asks that an impartial observer be sent; Johnson tells him the burned car has been found. 8:21 p.m., Johnson and Paul Johnson. June 24, to Stennis: Dulles to go as an observer.'
    n: '[Johnson and Eastland, 3:59 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-june-23-1964), Tape WH6406.14, Citation #3836 (Miller Center); [4:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-june-23-1964-0), Tape WH6406.14, Citation #3845 (Miller Center); [Johnson and Paul Johnson, 8:21 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-paul-johnson-june-24-1964), Tape WH6406.16, Citation #3878 (Miller Center); [Johnson and Stennis, June 24, 5:32 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-stennis-june-24-1964), Tape WH6406.16, Citation #3892 (Miller Center). The catalogue''s words: "Eastland''s view of situation as publicity stunt." *Taking Charge* (K–J Adm. II.J). See [[cal.1964-06-21.mississippi]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson, Eastland, Stennis, Paul Johnson, Dulles.'
    tags: [name:johnson-lyndon-b, name:eastland-james-o, name:johnson-paul-b-jr, name:stennis-john-c, name:dulles-allen-w]
  - id: cal.1964-06-24.opinion
    when: June 24
    date: '1964-06-24'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, special survey of 1,671 Democratic county chairmen, their choice for Vice President: Humphrey 484, Robert Kennedy 255, Shriver 212, Stevenson 207, Fulbright 125, Brown 79, Wagner 75, Wallace 48, McCarthy 39; others 124. In the South: Stevenson 121, Fulbright 108, Humphrey 101.'
    n: '[[w.gallup-poll]], III, 1888–89. Names: Humphrey, Robert Kennedy, Shriver, Stevenson, Fulbright, McCarthy, Brown, Wagner, Wallace.'
    tags: [name:humphrey-hubert-h, name:kennedy-robert-f, name:shriver-r-sargent, name:stevenson-adlai-e, name:fulbright-j-william, name:brown-edmund-g, name:wagner-robert-f-jr, name:wallace-george-c, name:mccarthy-eugene-j]
  - id: cal.1964-06-25.cities-and-housing
    when: June 25
    date: '1964-06-25'
    thread: cities-and-housing
    also: [transportation]
    c: 'House passes the mass transit bill, [212–189](https://voteview.com/rollcall/RH0880178): grants to cities for transit systems, $375 million over three years. Protection for transit workers widened, [234–170](https://voteview.com/rollcall/RH0880176); recommittal refused, [190–214](https://voteview.com/rollcall/RH0880177). Senate agrees June 30, [47–36](https://voteview.com/rollcall/RS0880427).'
    n: '[110 Cong. Rec., House, June 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-7-1.pdf); [Senate, June 30](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-2-1.pdf). [[w.smerk-urban-transportation]]; [[w.gelfand-nation-of-cities]]. See [[cal.1963-04-04.program]].'
  - id: cal.1964-06-26.robert-kennedy
    when: June 26–July 1
    date: '1964-06-26'
    thread: robert-kennedy
    also: [europe-and-the-alliance]
    c: 'Robert Kennedy in West Berlin: the President John F. Kennedy Lecture at the Free University; a plaque unveiled in John-F.-Kennedy-Platz. June 27, Heidelberg. Then Poland. Leaving, July 1: "to facilitate the reconciliation of Eastern and Western Europe in association with the United States," the "bridges" of reconciliation Johnson had called for. July 2, by telephone with Johnson: Kennedy misquoted in *Newsweek*; Johnson on the press''s efforts to divide them.'
    n: '[The President John F. Kennedy Lecture, Free University of Berlin](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964b.pdf); [Remarks at the Unveiling of a Plaque in President John F. Kennedy Platz](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964c.pdf) (June 26, 1964); [Address at Heidelberg University](https://www.justice.gov/ag/rfkspeeches/1964/06-27-1964.pdf) (June 27, 1964); [Statement on Departure from Poland](https://www.justice.gov/ag/rfkspeeches/1964/07-01-1964.pdf) (July 1, 1964). [Johnson and Robert Kennedy, 11:19 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-2-1964), Tape WH6407.01, Citation #4117 (Miller Center), July 2. [[w.schlesinger-robert-kennedy-and-his]]. See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy, Johnson.'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1964-06-27.governors-nc
    when: June 27
    date: '1964-06-27'
    thread: governors
    also: [elections-1964]
    c: 'North Carolina, Democratic runoff for governor: Moore 480,431, 62.0 percent; Preyer 293,863.'
    n: 'Votes: [N.C. *Manual*, 1965, p. 278](https://archive.org/details/northcarolinaman1965nort/page/n295). See [[cal.1964-05-30.governors-nc]]. Names: Dan Moore, Preyer.'
    tags: [state:nc, name:moore-dan-k, name:preyer-lunsford-r]
  - id: cal.1964-06-28.black-nationalism
    when: June 28
    date: '1964-06-28'
    thread: black-nationalism
