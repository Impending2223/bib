# Cal. XLIX June 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIX
entries:
  - id: cal.1964-06-01.vietnam
    when: June 1–2
    date: '1964-06-01'
    thread: vietnam
    also: [laos]
    c: 'Honolulu. Rusk, McNamara, Taylor and McCone with Lodge, Westmoreland, Felt and Sharp on Vietnam and Laos. A joint resolution of Congress and strikes on the North discussed, and the preparation each would need. Johnson, June 2: "bound by solemn commitments to help defend this area against Communist encroachment."'
    n: 'FRUS 1964–68, I, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v01/d187), [188](https://history.state.gov/historicaldocuments/frus1964-68v01/d188), [189](https://history.state.gov/historicaldocuments/frus1964-68v01/d189). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1056) (June 2, 1964). See [[cal.1964-05-24.vietnam]]. Names: Rusk (K–J Adm. III.E); McNamara, Taylor (K–J Adm. III.F); McCone (K–J Adm. III.I); Lodge (Viet. III.C); Westmoreland, Felt, Sharp (Viet. III.D); Johnson (K–J Adm. III.D).'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:taylor-maxwell, name:mccone-john-a, name:lodge-henry-cabot, name:westmoreland-william, name:felt-harry-d, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1964-06-01.court
    when: June 1
    date: '1964-06-01'
    thread: court
    also: [alabama, civil-rights-organizations]
    c: '*NAACP v. Alabama ex rel. Flowers*, [377 U.S. 288](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377288/usrep377288.pdf). The NAACP, barred from Alabama by a State court''s order of June 1, 1956, before the Court a fourth time. The judgment ousting it reversed; the Alabama Supreme Court to have the injunction vacated and the Association let qualify to do business. Harlan for the Court.'
    n: 'Opinion (K–J Cong. II.J.1). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Wilkins, *Standing Fast* (K–J Cong. II.I.4). Names: Harlan (K–J Cong. III.G).'
    tags: [name:harlan-john-marshall]
  - id: cal.1964-06-02.elections-1964
    when: June 2
    date: '1964-06-02'
    thread: elections-1964
    also: [goldwater]
    c: 'Primaries in California and South Dakota. Republican: Goldwater in California; unpledged delegates in South Dakota. Democratic: unpledged delegates in California and South Dakota.'
    n: CQ Guide 6th (2010) 407–408. See [[cal.1964-03-10.elections-1964]].
    tags: [primary:1964-06-02, name:goldwater-barry-m]
  - id: cal.1964-06-02.alabama
    when: June 2
    date: '1964-06-02'
    thread: alabama
    also: [elections-1964]
    c: 'Alabama''s second primary. The nine Democratic nominees for Representative on one statewide ballot, the eight highest to be the party''s nominees: Carl Elliott ninth, 316,775, 5,098 votes short. Connor nominated president of the Public Service Commission, 225,676 to 204,418. Aug. 19, the legislature, in special session, draws eight districts for November (Act No. 21).'
    n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [524](https://archive.org/details/alabama-official-statistical-register-1967/page/n525)–[526](https://archive.org/details/alabama-official-statistical-register-1967/page/n527), [530](https://archive.org/details/alabama-official-statistical-register-1967/page/n531) (the nominees), [260](https://archive.org/details/alabama-official-statistical-register-1967/page/n261) (Act No. 21). Encyclopedia of Alabama, ["Carl Elliott"](https://encyclopediaofalabama.org/article/carl-elliott/). See [[cal.1964-05-05.alabama]]. Names: Connor (K–J Cong. III.K).'
    tags: [name:elliott-carl-a, name:connor-eugene]
  - id: cal.1964-06-05.europe-and-the-alliance
    when: June 5
    date: '1964-06-05'
    thread: europe-and-the-alliance
    c: 'Cyprus. Johnson to Inonu, Turkey preparing to intervene on the island: no action without consultation; "Adhesion to NATO, in its very essence, means that NATO countries will not wage war on each other"; American arms not to be used. Inonu puts off the intervention at the American request.'
    n: 'FRUS 1964–68, XVI, docs. [54](https://history.state.gov/historicaldocuments/frus1964-68v16/d54), [55](https://history.state.gov/historicaldocuments/frus1964-68v16/d55). Ball, *The Past Has Another Pattern* (K–J Adm. II.G.4). Claude Nicolet, *United States Policy Towards Cyprus, 1954–1974: Removing the Greek-Turkish Bone of Contention* (2001). See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:inonu-ismet]
  - id: cal.1964-06-06.laos
    when: June 6–9
    date: '1964-06-06'
    thread: laos
    c: Laos. Lieutenant Klusmann's Navy reconnaissance plane shot down over the Plain of Jars, June 6; a second plane, June 7. June 8, Johnson approves a strike on the antiaircraft guns, "with grave reservations"; Unger opposed from Vientiane. Eight F-100s attack them at Xieng Khouang, June 9.
    n: '[FRUS 1964–68, I, doc. 206](https://history.state.gov/historicaldocuments/frus1964-68v01/d206) (editorial note); [FRUS 1964–68, XXVIII, doc. 83](https://history.state.gov/historicaldocuments/frus1964-68v28/d83). See [[cal.1964-05-17.laos]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:unger-leonard]
  - id: cal.1964-06-07.opinion
    when: June 7
    date: '1964-06-07'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 22–27: mass demonstrations by Negroes will hurt the cause of racial equality, 74 percent; help it, 15. Whites 81 hurt; non-whites 55 help, 22 hurt.'
    n: '*The Gallup Poll*, III, 1884 (K–J Cong. II.E).'
  - id: cal.1964-06-10.civil-rights-bill
    when: June 10
    date: '1964-06-10'
    thread: civil-rights-bill
    c: 'Cloture on the civil rights bill, [71–29](https://voteview.com/rollcall/RS0880302), the first on a civil rights bill since Rule XXII''s adoption in 1917: Republicans 27–6, Democrats 44–23. Byrd had spoken through the night, 14 hours 13 minutes. Dirksen: "Stronger than all the armies is an idea whose time has come." June 9, Morton''s jury trial amendment, every title but voting, adopted, [51–48](https://voteview.com/rollcall/RS0880298).'
    n: '[110 Cong. Rec., Senate, June 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt10/pdf/GPO-CRECB-1964-pt10-6-2.pdf). [Cloture and Final Passage of the Civil Rights Act of 1964](https://www.senate.gov/legislative/landmark-legislation/civil-rights-act-of-1964/cloture-and-final-passage-of-the-civil-rights-act-of-1964-essay.htm) (Senate Historical Office). Mann, *The Walls of Jericho*; Finley, *Delaying the Dream* (K–J Cong. II.C). MacNeil, *Dirksen* (Opp. II.D). See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd (Cong. III.A); Dirksen (K–J Cong. III.A); Morton (Opp. III.B).'
    tags: [name:byrd-robert-c, name:dirksen-everett, name:morton-thruston-b]
  - id: cal.1964-06-10.opinion
    when: June 10
    date: '1964-06-10'
    thread: opinion
    also: [civil-rights-bill, elections-1964]
    c: 'Gallup, May 22–27: of two candidates of one''s own party, alike but for civil rights, the one for civil rights, 60 percent; the one against, 25. Southern whites 31 for, 54 against; whites outside the South 65 and 19.'
    n: '*The Gallup Poll*, III, 1884–85 (K–J Cong. II.E).'
  - id: cal.1964-06-11.robert-kennedy
    when: June 11
    date: '1964-06-11'
    thread: robert-kennedy
    also: [vietnam]
    c: 'Robert Kennedy to Johnson: "if you wished me to go to Viet Nam in any capacity I would be glad to do so." Johnson by telephone that evening thanks him and asks his help in choosing an ambassador; June 12, Kennedy proposes Terry Sanford. May 28, he had urged a group on Vietnam like the ExComm.'
    n: '[Johnson and Robert Kennedy, 6:11 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation-june-11), Tape WH6406.06, Citation #3699 (Miller Center); [June 12, 7:26 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-june-12-1964), Tape WH6406.08, Citation #3731 (Miller Center); [May 28, 11:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-may-28-1964), Tape WH6405.11, Citations #3539 and #3540 (Miller Center). Kennedy to Johnson, June 11, 1964, LBJ Library (Check the file). *Taking Charge* (K–J Adm. II.J). Shesol, *Mutual Contempt* (K–J Adm. II.A). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D); Sanford (K–J Cong. III.F).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:sanford-terry]
  - id: cal.1964-06-12.elections-1964
    when: June 12
    date: '1964-06-12'
    thread: elections-1964
    c: Scranton announces for the Republican nomination, at the Maryland Republican convention in Baltimore. Rockefeller withdraws for him, June 15. Check the date.
    n: 'Wolf, *William Warren Scranton* (Opp. II.C). White, *The Making of the President 1964* (Opp. II.E). Novak, *The Agony of the G.O.P. 1964*; Kabaservice, *Rule and Ruin* (Opp. II.A). See [[cal.1964-06-02.elections-1964]]. Names: Scranton, Rockefeller (Opp. III.H).'
    tags: [name:scranton-william-w, name:rockefeller-nelson]
  - id: cal.1964-06-14.mississippi
    when: June 14–27
    date: '1964-06-14'
    thread: mississippi
    also: [students]
    c: 'Freedom Summer. Volunteers for the Mississippi Summer Project, most of them white Northern students, trained in two one-week sessions at the Western College for Women, Oxford, Ohio. COFO''s project, Moses directing: voter registration, Freedom Schools, the Freedom Democratic Party.'
    n: 'Wisconsin Historical Society: Freedom Summer collections (K–J Cong. II.L). McAdam, *Freedom Summer*; Carson, *In Struggle*; Dittmer, *Local People*; Payne, *I''ve Got the Light of Freedom* (K–J Cong. II.F). Branch, *Pillar of Fire* (K–J Adm. II.C). Bruce Watson, *Freedom Summer: The Savage Season That Made Mississippi Burn and Made America a Democracy* (2010). See [[cal.1963-06-12.mississippi]]. Names: Moses (K–J Cong. III.H).'
    tags: [name:moses-robert-p]
  - id: cal.1964-06-15.court
    when: June 15
    date: '1964-06-15'
    thread: court
    also: [states-and-cities, alabama]
    c: '*Reynolds v. Sims*, [377 U.S. 533](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377533/usrep377533.pdf). Alabama''s legislature, last apportioned on the 1900 census; the district court''s judgment affirmed. Both houses of a State legislature to be apportioned by population, districts "as nearly of equal population as is practicable." "Legislators represent people, not trees or acres." Warren for the Court; Harlan dissents. The same day, the apportionments of New York, Maryland, Virginia, Delaware and Colorado struck down; Colorado''s, approved by its voters in 1962, over Stewart''s and Clark''s dissents.'
    n: '*WMCA, Inc. v. Lomenzo*, [377 U.S. 633](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377633/usrep377633.pdf); *Maryland Committee for Fair Representation v. Tawes*, [377 U.S. 656](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377656/usrep377656.pdf); *Davis v. Mann*, [377 U.S. 678](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377678/usrep377678.pdf); *Roman v. Sincock*, [377 U.S. 695](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377695/usrep377695.pdf); *Lucas v. Forty-Fourth General Assembly*, [377 U.S. 713](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377713/usrep377713.pdf). Opinions (Opp. II.H.1; K–J Cong. II.J.1). Cortner, *The Apportionment Cases*; Schwartz, *Super Chief*; Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). Dixon, *Democratic Representation*; Cox & Katz, *Elbridge Gerry''s Salamander* (Opp. II.F). See [[cal.1962-03-26.court]]. Names: Warren, Harlan, Stewart, Clark (K–J Cong. III.G).'
    tags: [name:warren-earl, name:harlan-john-marshall, name:stewart-potter, name:clark-tom-c]
  - id: cal.1964-06-16.congo
    when: June 16–30
    date: '1964-06-16'
    thread: congo
    c: 'Congo. State confirms that American civilian pilots under contract to the Congolese government have flown combat sorties in Kivu. McCone to the Special Group, June 18: two of their T-28s helped stop a rebel attack at Kamanyola. Tshombe back from exile, June 26; the last UN troops leave June 30. Check the last.'
    n: '[FRUS 1964–68, XXIII, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v23/d178) (editorial note). Weissman, *American Foreign Policy in the Congo*; Namikas, *Battleground Africa* (K–J Adm. II.D). See [[cal.1963-01-14.congo]]. Names: McCone (K–J Adm. III.I); Tshombe (K–J Adm. III.J).'
    tags: [name:mccone-john-a, name:tshombe-moise]
  - id: cal.1964-06-18.vietnam
    when: June 18
    date: '1964-06-18'
    thread: vietnam
    c: Seaborn, Canada's new commissioner on the International Control Commission, sees Phạm Văn Đồng in Hanoi, carrying American views as Johnson and Pearson agreed May 28. Check the date.
    n: 'FRUS 1964–68, I, docs. [182](https://history.state.gov/historicaldocuments/frus1964-68v01/d182) (Johnson and Pearson, May 28), [222](https://history.state.gov/historicaldocuments/frus1964-68v01/d222) (Lodge on Seaborn''s report). Thies, *When Governments Collide*; Logevall, *Choosing War* (Viet. II.F.16). See [[cal.1964-06-01.vietnam]]. Names: Seaborn (Viet. III.I); Phạm Văn Đồng (Viet. III.H); Johnson (K–J Adm. III.D).'
    tags: [name:seaborn-j-blair, name:pham-van-dong, name:johnson-lyndon-b, name:pearson-lester-b]
  - id: cal.1964-06-18.desegregation-schools
    when: June 18
    date: '1964-06-18'
    thread: desegregation-schools
    also: [alabama]
    c: 'Fifth Circuit, on the Birmingham and Mobile school plans: desegregation to proceed "at a swifter pace," ten years after *Brown*. Birmingham, its 12th grade begun in 1963, to add the 10th, 11th and 1st grades in September 1964, then a grade a year at each level; Mobile to file a plan meeting the same minimum. Savannah and Brunswick, Bell writing: the finding below that Negro and white pupils'' differing test scores warrant separate schools reversed; Negro pupils who overlap white pupils in aptitude are segregated for the averages, "Therein is the discrimination." A grade a year over twelve years "no longer satisfactory." Savannah had opened its 12th grade, Sept. 1963.'
    n: '*Armstrong v. Board of Education of the City of Birmingham*, [333 F.2d 47](https://static.case.law/f2d/333/html/0047-01.html) (5th Cir. 1964); *Davis v. Board of School Commissioners of Mobile County*, [333 F.2d 53](https://static.case.law/f2d/333/html/0053-01.html) (5th Cir. 1964); *Stell v. Savannah-Chatham County Board of Education*, [333 F.2d 55](https://static.case.law/f2d/333/html/0055-01.html) (5th Cir. 1964). Bass, *Unlikely Heroes* (K–J Cong. II.H). See [[cal.1963-09-09.alabama]].'
  - id: cal.1964-06-19.civil-rights-bill
    when: June 19
    date: '1964-06-19'
    thread: civil-rights-bill
    also: [goldwater]
    c: 'Senate passes the civil rights bill, [73–27](https://voteview.com/rollcall/RS0880409): Republicans 27–6, Democrats 46–21; of the eleven Southern States'' Senators, Yarborough alone for. The Mansfield–Dirksen substitute adopted June 17, [76–18](https://voteview.com/rollcall/RS0880407); Gore''s motion to recommit refused, [25–74](https://voteview.com/rollcall/RS0880408). Goldwater, June 18: "no constitutional basis" for the public accommodations and employment titles. He votes no.'
    n: '[110 Cong. Rec., Senate, June 18, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-2-1.pdf); [June 19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-3-2.pdf). [Statement by the President Following Senate Passage of the Civil Rights Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-passage-the-civil-rights-bill) (June 19, 1964). Perlstein, *Before the Storm*; Goldberg, *Barry Goldwater* (Opp. II.B). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Yarborough, Gore (K–J Cong. III.B); Mansfield, Dirksen (K–J Cong. III.A); Goldwater (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [name:yarborough-ralph, name:gore-albert-sr, name:mansfield-mike, name:dirksen-everett, name:goldwater-barry-m, name:johnson-lyndon-b]
  - id: cal.1964-06-19.congress
    when: June 19
    date: '1964-06-19'
    thread: congress
    c: Edward Kennedy's chartered plane, taking him and Bayh from the vote to the Massachusetts Democratic convention at West Springfield, crashes in an orchard near Southampton. The pilot and Kennedy's aide Edward Moss killed; Bayh pulls Kennedy from the wreck. Kennedy's back broken; in the hospital for months.
    n: 'Clymer, *Edward M. Kennedy*; Kennedy, *True Compass* (K–J Cong. II.I.1). Names: Edward M. Kennedy (K–J Cong. III.B); Bayh (Cong. III.B).'
    tags: [name:kennedy-edward-m, name:bayh-birch]
  - id: cal.1964-06-21.mississippi
    when: June 21
    date: '1964-06-21'
    thread: mississippi
    c: Chaney, Goodman and Schwerner, of CORE's Meridian project, missing in Neshoba County after a visit to the burned Mount Zion church at Longdale. Deputy Sheriff Price had held them in the Philadelphia jail; released after 10 p.m. June 23, their burned station wagon found near the Bogue Chitto; Johnson sees Goodman's and Schwerner's parents and sends Dulles to Mississippi. Check the last.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1054) (June 23, 1964). *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). *Taking Charge* (K–J Adm. II.J). Florence Mars, *Witness in Philadelphia* (1977). Seth Cagin & Philip Dray, *We Are Not Afraid: The Story of Goodman, Schwerner, and Chaney and the Civil Rights Campaign for Mississippi* (1988). Dittmer, *Local People* (K–J Cong. II.F). Gage, *G-Man* (K–J Adm. II.E). See [[cal.1964-06-14.mississippi]]. Names: Chaney, Goodman, Schwerner, Price (K–J Cong. III.K); Johnson (K–J Adm. III.D); Dulles (K–J Adm. III.I).'
    tags: [name:chaney-james-e, name:goodman-andrew, name:schwerner-michael, name:price-cecil-r, name:johnson-lyndon-b, name:dulles-allen-w]
  - id: cal.1964-06-21.opinion
    when: June 21
    date: '1964-06-21'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, June 4–9: Republicans'' choice for 1964: Lodge 26, Nixon 25, Goldwater 21, Rockefeller 10, Scranton 9, Romney 5; others, no preference 4. Independents: Lodge 26, Goldwater 19, Nixon 17, Rockefeller 14.'
    n: '*The Gallup Poll*, III, 1888 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w]
  - id: cal.1964-06-22.court
    when: June 22
    date: '1964-06-22'
    thread: court
    also: [desegregation-public-places]
    c: 'The Term''s last day. *Bell v. Maryland*, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf): sit-in demonstrators'' trespass convictions at a Baltimore restaurant vacated and remanded, Maryland and Baltimore having since forbidden such discrimination; Brennan for the Court. Black, Harlan and White would affirm; Douglas, Goldberg and Warren would reverse on the Constitution. *Escobedo v. Illinois*, [378 U.S. 478](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378478/usrep378478.pdf): a confession taken after the suspect was refused his lawyer excluded, 5–4. *Aptheker v. Secretary of State*, [378 U.S. 500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378500/usrep378500.pdf): passports for Communist Party members, 6–3.'
    n: 'Opinions, [378 U.S. 226](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378226/usrep378226.pdf), [478](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378478/usrep378478.pdf), [500](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378500/usrep378500.pdf). Schmidt, *The Sit-Ins*; Powe, *The Warren Court and American Politics*; Schwartz, *Super Chief* (K–J Cong. II.G). See [[cal.1964-05-25.court]]. Names: Brennan, Black, Harlan, White, Douglas, Goldberg, Warren (K–J Cong. III.G).'
    tags: [name:brennan-william-j-jr, name:black-hugo-l, name:harlan-john-marshall, name:white-byron-r, name:douglas-william-o, name:goldberg-arthur-j, name:warren-earl]
  - id: cal.1964-06-22.europe-and-the-alliance
    when: June 22–25
    date: '1964-06-22'
    thread: europe-and-the-alliance
    c: Cyprus. Inonu at the White House, June 22–23; Papandreou, June 24–25, apart. With Inonu, talks "proceeding from the present binding effects of existing treaties"; with Papandreou, a solution "based upon the principles of democracy and justice."
    n: '[Joint Statement Following Discussions With the Prime Minister of Turkey](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-turkey) (June 23, 1964); [Joint Statement Following Discussions With the Prime Minister of Greece](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-greece) (June 25, 1964). FRUS 1964–68, XVI, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v16/d72), [73](https://history.state.gov/historicaldocuments/frus1964-68v16/d73), [74](https://history.state.gov/historicaldocuments/frus1964-68v16/d74), [75](https://history.state.gov/historicaldocuments/frus1964-68v16/d75). See [[cal.1964-06-05.europe-and-the-alliance]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:inonu-ismet, name:papandreou-george]
  - id: cal.1964-06-23.vietnam
    when: June 23
    date: '1964-06-23'
    thread: vietnam
    also: [transition-and-staff]
    c: Lodge resigns as Ambassador to South Vietnam, for "entirely personal reasons." Taylor to succeed him, U. Alexis Johnson as his deputy; Wheeler for Taylor as Chairman of the Joint Chiefs. Westmoreland had taken over the command in Saigon from Harkins, June 20.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1054) (June 23, 1964); [Remarks Upon Presenting the Distinguished Service Medal to General Harkins](https://www.presidency.ucsb.edu/documents/remarks-upon-presenting-the-distinguished-service-medal-general-harkins) (June 24, 1964). [FRUS 1964–68, I, doc. 220](https://history.state.gov/historicaldocuments/frus1964-68v01/d220) (editorial note). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). Johnson, *The Right Hand of Power*; Blair, *Lodge in Vietnam*; Nichter, *The Last Brahmin* (Viet. II.H.1). Westmoreland, *A Soldier Reports* (Viet. II.H.2). Names: Lodge, U. Alexis Johnson (Viet. III.C); Taylor, Wheeler, Westmoreland, Harkins (K–J Adm. III.F); Johnson (K–J Adm. III.D).'
    tags: [name:lodge-henry-cabot, name:taylor-maxwell, name:johnson-u-alexis, name:wheeler-earle, name:westmoreland-william, name:harkins-paul-d, name:johnson-lyndon-b]
  - id: cal.1964-06-23.mississippi
    when: June 23–24
    date: '1964-06-23'
    thread: mississippi
    c: 'Johnson and Eastland, 3:59 p.m., on the missing three: Eastland takes it for a publicity stunt; should the President call Paul Johnson? 4:25: Eastland, having called the governor, reports his doubts too and asks that an impartial observer be sent; Johnson tells him the burned car has been found. 8:21 p.m., Johnson and Paul Johnson. June 24, to Stennis: Dulles to go as an observer.'
    n: '[Johnson and Eastland, 3:59 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-june-23-1964), Tape WH6406.14, Citation #3836 (Miller Center); [4:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-june-23-1964-0), Tape WH6406.14, Citation #3845 (Miller Center); [Johnson and Paul Johnson, 8:21 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-paul-johnson-june-24-1964), Tape WH6406.16, Citation #3878 (Miller Center); [Johnson and Stennis, June 24, 5:32 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-stennis-june-24-1964), Tape WH6406.16, Citation #3892 (Miller Center). The catalogue''s words: "Eastland''s view of situation as publicity stunt." *Taking Charge* (K–J Adm. II.J). See [[cal.1964-06-21.mississippi]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson (K–J Adm. III.D); Eastland, Stennis (K–J Cong. III.B); Paul Johnson (K–J Cong. III.F); Dulles (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:eastland-james-o, name:johnson-paul-b-jr, name:stennis-john-c, name:dulles-allen-w]
  - id: cal.1964-06-24.opinion
    when: June 24
    date: '1964-06-24'
    thread: opinion
    also: [elections-1964]
    c: 'Gallup, special survey of 1,671 Democratic county chairmen, their choice for Vice President: Humphrey 484, Robert Kennedy 255, Shriver 212, Stevenson 207, Fulbright 125, Brown 79, Wagner 75, Wallace 48, McCarthy 39; others 124. In the South: Stevenson 121, Fulbright 108, Humphrey 101.'
    n: '*The Gallup Poll*, III, 1888–89 (K–J Cong. II.E). Names: Humphrey (K–J Cong. III.A); Kennedy (K–J Adm. III.A); Shriver (K–J Adm. III.G); Stevenson (K–J Adm. III.E); Fulbright, McCarthy (K–J Cong. III.B); Brown, Wagner, Wallace (K–J Cong. III.F).'
    tags: [name:humphrey-hubert-h, name:kennedy-robert-f, name:shriver-r-sargent, name:stevenson-adlai-e, name:fulbright-j-william, name:brown-edmund-g, name:wagner-robert-f-jr, name:wallace-george-c, name:mccarthy-eugene-j]
  - id: cal.1964-06-25.cities-and-housing
    when: June 25
    date: '1964-06-25'
    thread: cities-and-housing
    c: 'House passes the mass transit bill, [212–189](https://voteview.com/rollcall/RH0880178): grants to cities for transit systems, $375 million over three years. Protection for transit workers widened, [234–170](https://voteview.com/rollcall/RH0880176); recommittal refused, [190–214](https://voteview.com/rollcall/RH0880177). Senate agrees June 30, [47–36](https://voteview.com/rollcall/RS0880427).'
    n: '[110 Cong. Rec., House, June 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-7-1.pdf); [Senate, June 30](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt12/pdf/GPO-CRECB-1964-pt12-2-1.pdf). Smerk, *Urban Transportation*; Gelfand, *A Nation of Cities* (K–J Cong. II.B). See [[cal.1963-04-04.program]].'
  - id: cal.1964-06-26.robert-kennedy
    when: June 26–July 1
    date: '1964-06-26'
    thread: robert-kennedy
    also: [europe-and-the-alliance]
    c: 'Robert Kennedy in West Berlin: the President John F. Kennedy Lecture at the Free University; a plaque unveiled in John-F.-Kennedy-Platz. June 27, Heidelberg. Then Poland. Leaving, July 1: "to facilitate the reconciliation of Eastern and Western Europe in association with the United States," the "bridges" of reconciliation Johnson had called for. July 2, by telephone with Johnson: Kennedy misquoted in *Newsweek*; Johnson on the press''s efforts to divide them.'
    n: '[The President John F. Kennedy Lecture, Free University of Berlin](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964b.pdf); [Remarks at the Unveiling of a Plaque in President John F. Kennedy Platz](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964c.pdf) (June 26, 1964); [Address at Heidelberg University](https://www.justice.gov/ag/rfkspeeches/1964/06-27-1964.pdf) (June 27, 1964); [Statement on Departure from Poland](https://www.justice.gov/ag/rfkspeeches/1964/07-01-1964.pdf) (July 1, 1964). [Johnson and Robert Kennedy, 11:19 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-july-2-1964), Tape WH6407.01, Citation #4117 (Miller Center), July 2. Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1964-06-28.black-nationalism
    when: June 28
    date: '1964-06-28'
    thread: black-nationalism
    c: 'Malcolm X founds the Organization of Afro-American Unity at the Audubon Ballroom, Washington Heights, on the model of the Organization of African Unity: secular, open to non-Muslims; self-defense, a case against the United States at the United Nations.'
    n: '[Speech at the Founding Rally of the Organization of Afro-American Unity](https://blackpast.org/african-american-history/1964-malcolm-x-s-speech-founding-rally-organization-afro-american-unity/) (June 28, 1964). See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X (K–J Cong. III.H).'
    tags: [name:malcolm-x]
  - id: cal.1964-06-28.opinion
    when: June 28
    date: '1964-06-28'
    thread: opinion
    also: [elections-1964, goldwater]
    c: 'Gallup, June 11–16: the convention''s choice between Goldwater and Scranton. Republicans: Scranton 55, Goldwater 34, undecided 11. Independents: Scranton 62, Goldwater 24.'
    n: '*The Gallup Poll*, III, 1890 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Scranton (Opp. III.H).'
    tags: [name:goldwater-barry-m, name:scranton-william-w]
  - id: cal.1964-06-30.states-and-cities
    when: June 30
    date: '1964-06-30'
    thread: states-and-cities
    also: [court]
    c: Atlanta. A three-judge court holds the Georgia House malapportioned. The November elections to go on as they are; a House apportioned by population to sit by January 1966; the 1965 House held to its regular 45-day session, reapportionment aside; the new State constitution the legislature has proposed kept off the ballot until then. Black refuses a stay, July 6. The constitution lapses unsubmitted.
    n: '*Fortson v. Toombs*, [379 U.S. 621](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379621/usrep379621.pdf) (1965): the order of June 30 at App. A. *Toombs v. Fortson*, [205 F. Supp. 248](https://static.case.law/f-supp/205/html/0248-01.html) (N.D. Ga. 1962). Ansolabehere & Snyder, *The End of Inequality*; Smith, *On Democracy''s Doorstep* (K–J Cong. II.H). See [[cal.1964-06-15.court]]. Names: Black (K–J Cong. III.G).'
    tags: [name:black-hugo-l]
