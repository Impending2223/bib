    c: 'McNamara with the Joint Chiefs after Biên Hòa, by Greene''s notes: Taylor twice fears "a major effort in South Vietnam might result in a war with Communist China." McNamara: "the President being born in Texas is inclined to take some action. He wants to move, but he wants to be God-damned sure of himself before he does so."'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 526. See [[cal.1964-11-01.vietnam]]. Check: Taylor was ambassador in Saigon; the note may name Wheeler. Names: McNamara, Greene, Taylor, Johnson.'
