# Cal. LX November 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LX
entries:
  - id: cal.1964-11-01.vietnam
    when: Nov. 1
    date: '1964-11-01'
    thread: vietnam
    c: 'Biên Hòa. The Viet Cong mortar the air base after midnight: 4 Americans killed, 30 wounded, 27 aircraft destroyed or damaged. Taylor asks a reprisal against an airfield in the North within 48 hours. Washington declines, Nov. 1–2, two days before the election; planning for wider action ordered.'
    n: 'FRUS 1964–68, I, docs. [393](https://history.state.gov/historicaldocuments/frus1964-68v01/d393), [396](https://history.state.gov/historicaldocuments/frus1964-68v01/d396), [399](https://history.state.gov/historicaldocuments/frus1964-68v01/d399), [400](https://history.state.gov/historicaldocuments/frus1964-68v01/d400). [[w.gibbons-u-s-government-and]], II, 363–364; [[w.vietnam-victory-in-vietnam]], 136; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 527; [[w.cosmas-joint-chiefs-of-staff-2012]], 149–150; [[w.marolda-united-states-navy-and]], 472. To check: [[w.pentagon-papers]]; [[w.logevall-choosing-war]]; [[w.kahin-intervention]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.kaiser-american-tragedy]]; [[w.moyar-triumph-forsaken]]; [[w.taylor-swords-and-plowshares]]; [[w.bird-color-of-truth]]. See [[cal.1964-08-02.vietnam]]. Names: Taylor. Check: *Victory in Vietnam* has the 80th Artillery Group''s mortars and recoilless rifles, the night of Oct. 31, destroy 59 aircraft and kill hundreds of American pilots and technicians (136).'
    tags: [name:taylor-maxwell, place:bien-hoa-air-base]
  - id: cal.1964-11-02.opinion
    when: Nov. 2
    date: '1964-11-02'
    thread: opinion
    also: [elections-1964-polls, goldwater]
    c: 'Gallup, final poll, Oct. 25–30: Johnson 64, Goldwater 29, undecided 7.'
    n: '[[w.gallup-poll]], III, 1907. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-11-02.peace-corps
    when: Nov. 2
    date: '1964-11-02'
    thread: peace-corps
    c: 'Statement on the fourth anniversary of Kennedy''s proposal: 10,000 volunteers in 46 countries; 110,000 Americans have applied. The Peace Corps to double in four years. The returning volunteers for the schools, business, State and city governments, the war on poverty and the Foreign Service.'
    n: Statement by the President on the Fourth Anniversary of the Peace Corps, [1963–64 Pub. Papers 1570](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=810) (Nov. 2, 1964). See [[cal.1960-11-02.peace-corps]].
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1964-11-02.middle-east
    when: Nov. 2
    date: '1964-11-02'
    thread: middle-east
    c: Saud deposed; Faisal, Prime Minister, proclaimed King.
    n: 'FRUS 1964–68, XXI, doc. [234](https://history.state.gov/historicaldocuments/frus1964-68v21/d234), n. Check: Washington''s message to Faisal. To check: [[w.hart-saudi-arabia-and-the]]; [[w.bronson-thicker-than-oil]]. See [[cal.1962-10-05.middle-east]]. Names: Saud ibn Abd al-Aziz Al Saud, Faisal ibn Abd al-Aziz Al Saud.'
    tags: [name:saud-ibn-abd-al-aziz-al-saud, name:faisal-ibn-abd-al-aziz-al-saud]
  - id: cal.1964-11-03.vietnam
    when: Nov. 3
    date: '1964-11-03'
    thread: vietnam
    c: 'William Bundy''s working group on Vietnam first meets: McNaughton, Mustin of the Joint Staff, the CIA. Three options: A, present lines; B, systematic military pressure on the North until American objectives are met; C, graduated pressure, then negotiation under threat of more. Its paper, Nov. 21; the principals take it up Nov. 24 and 27, Taylor back from Saigon for the second.'
    n: 'FRUS 1964–68, I, docs. [403](https://history.state.gov/historicaldocuments/frus1964-68v01/d403), [418](https://history.state.gov/historicaldocuments/frus1964-68v01/d418), [424](https://history.state.gov/historicaldocuments/frus1964-68v01/d424), [428](https://history.state.gov/historicaldocuments/frus1964-68v01/d428), [429](https://history.state.gov/historicaldocuments/frus1964-68v01/d429). [[w.gibbons-u-s-government-and]], II, 365–367; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 527; [[w.cosmas-joint-chiefs-of-staff-2012]], 156–163. See [[cal.1964-11-01.vietnam]]. Names: William Bundy, McNaughton, Taylor, Mustin.'
    tags: [name:bundy-william, name:mcnaughton-john-t, name:mustin-lloyd-m, name:taylor-maxwell]
  - id: cal.1964-11-03.elections-1964
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [goldwater]
    c: 'Election day. Johnson and Humphrey over Goldwater and Miller, 61.1 percent to 38.5; 486 electoral votes to 52. Goldwater carries Arizona and five States of the Deep South: Alabama, Georgia, Louisiana, Mississippi, South Carolina. The 89th Congress: House 295 D–140 R; Senate 68 D–32 R.'
    n: 'Radio and Television Remarks to the American People at the Close of Election Day, [1963–64 Pub. Papers 1585](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=825) (Nov. 4, 1964). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). To check: [[w.white-making-of-the-president-1965]]; [[w.cosman-five-states-for-goldwater]]; [[w.lamb-campaign-decision-making]]; [[w.national-election-of-1964]]; [[w.mann-daisy-petals-and-mushroom]]; [[w.kessel-goldwater-coalition]]; [[w.perlstein-before-the-storm]]; [[w.middendorf-glorious-disaster]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-07-15.elections-1964]]; [[cal.1964-08-26.elections-1964]]. Names: Johnson, Humphrey, Goldwater, Miller.'
    tags: [election:1964, name:johnson-lyndon-b, name:humphrey-hubert-h, name:goldwater-barry-m, name:miller-william-e]
  - id: cal.1964-11-03.elections-1964-2
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [states-and-cities, robert-kennedy]
    c: 'The Senate. Democrats take Republican seats in New York, Robert Kennedy over Keating; Maryland, Tydings over Beall; New Mexico, Montoya over Mechem. Murphy takes Salinger''s seat in California. Cannon holds Nevada over Laxalt by 48 votes; Yarborough Texas over Bush. Governors: Republicans gain Massachusetts (Volpe), Washington (Evans), Wisconsin, and lose Arizona and Utah; Romney re-elected; Kerner over Percy; Faubus over Winthrop Rockefeller.'
    n: 'The Senate: [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). To check: [[w.white-making-of-the-president-1965]]. See [[cal.1964-11-03.elections-1964]]. The governors: check against the States'' canvasses. Names: Robert Kennedy, Keating, Beall, Murphy, Percy, Tydings, Cannon, Yarborough, Montoya, Mechem, Laxalt, Volpe, Evans, Romney, Winthrop Rockefeller, Salinger, Bush, Kerner, Faubus.'
    tags: [name:kennedy-robert-f, name:keating-kenneth-b, name:tydings-joseph-d, name:beall-james-g, name:montoya-joseph-m, name:mechem-edwin-l, name:murphy-george, name:salinger-pierre, name:cannon-howard-w, name:laxalt-paul, name:yarborough-ralph, name:bush-george-h-w, name:volpe-john-a, name:evans-daniel-j, name:romney-george-w, name:kerner-otto, name:percy-charles-h, name:faubus-orval-e, name:rockefeller-winthrop]
  - id: cal.1964-11-03.cities-and-housing
    when: Nov. 3
    date: '1964-11-03'
    thread: cities-and-housing
    also: [states-and-cities]
    c: 'California. Proposition 14 carries, 4,526,460 to 2,395,747, 65.4 percent: a constitutional amendment securing an owner''s "absolute discretion" to sell or rent to whom he chooses, voiding the Rumford Fair Housing Act of 1963.'
    n: '[Cal. *Statement of Vote*, Nov. 3, 1964](https://archive.org/details/castatem196264cali). To check: [[w.hosang-racial-propositions]].'
    tags: [state:ca]
  - id: cal.1964-11-03.specials
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    c: Missouri 9th, special. Hungate (D) holds Clarence Cannon's seat, 62.5 to 37.5 over Schroeder (R); the same day, the full term. Swing 2.0 to D.
    n: '[*Official Manual, State of Missouri, 1965–1966*, 1276](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38182). Votes: CQ Guide 6th (2010) 1274. See [[cal.1961-04-04.states-and-cities]]. Names: Hungate, Cannon, Anthony Schroeder.'
    tags: [special:1964-11-03-h-MO-9, name:hungate-william-l, name:cannon-clarence, name:schroeder-anthony-c]
  - id: cal.1964-11-03.specials-2
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    c: Oregon 1st, special. Wyatt (R) holds Norblad's seat, 52.8 to 47.2 over Whipple (D); the same day, the full term. Swing 9.0 to D.
    n: '[Or. Secretary of State, *Official Abstract of Votes, General Election 1964*, 2](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411026/File/document#page=6). Votes: CQ Guide 6th (2010) 1275. See [[cal.1961-04-04.states-and-cities]]. Names: Wyatt, Norblad, Whipple.'
    tags: [special:1964-11-03-h-OR-1, name:wyatt-wendell, name:norblad-albin-w-jr, name:whipple-r-blaine]
  - id: cal.1964-11-03.specials-3
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    also: [south-carolina]
    c: South Carolina 5th, special. Gettys (D) holds the seat Hemphill left for the federal bench, 66.8 to 33.2 over Doster (R); the same day, the full term. Swing 27.2 to R.
    n: 'Votes: CQ Guide 6th (2010) 1275. See [[cal.1961-04-04.states-and-cities]]. Names: Gettys, Hemphill, Doster.'
    tags: [special:1964-11-03-h-SC-5, name:gettys-thomas-s, name:hemphill-robert-w, name:doster-robert-m]
  - id: cal.1964-11-03.robert-kennedy
    when: Nov. 3
    date: '1964-11-03'
    thread: robert-kennedy
    also: [elections-1964]
    c: 'Robert Kennedy elected Senator from New York, 3,823,749 to Keating''s 3,104,056, 53.5 percent. Johnson and Kennedy by telephone, 11:55 p.m.: Kennedy thanks him for his help; Johnson: nothing will divide them.'
    n: '[Johnson and Robert Kennedy, 11:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-november-4-1964), Conversation WH6411-02-6142 (Miller Center). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). [President''s Daily Diary, Nov. 3, 1964](https://catalog.archives.gov/id/192447), image 5 (LBJ Library; National Archives Catalog). [[w.schlesinger-robert-kennedy-and-his]], 667–76. To check: [[w.shesol-mutual-contempt]]. See [[cal.1964-08-25.elections-1964]]; [[cal.1964-11-03.elections-1964-2]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy, Keating, Johnson. Check: the Daily Diary gives a call from Kennedy at 11:52 p.m. (image 5).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:keating-kenneth-b]
  - id: cal.1964-11-03.alabama
    when: Nov. 3
    date: '1964-11-03'
    thread: alabama
    also: [elections-1964, electoral-college]
    c: 'Alabama. Goldwater 479,085, the unpledged Democratic electors 210,732; no electors for Johnson on the ballot. Republicans take five of the eight House seats: Edwards, Dickinson, Glenn Andrews, Buchanan, Martin. Grant, Roberts and Huddleston beaten; the open 1st and 7th lost as well.'
    n: '[*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965), 2. To check: [[w.cosman-five-states-for-goldwater]]; [[w.bartley-southern-politics-and-the]]. See [[cal.1964-06-02.alabama]]; [[cal.1964-11-03.elections-1964]]. Names: Goldwater, Johnson, Edwards, Dickinson, Andrews, Buchanan, Martin, Grant, Roberts, Huddleston.'
    tags: [name:goldwater-barry-m, name:johnson-lyndon-b, name:edwards-william-j, name:dickinson-william-l, name:andrews-arthur-g, name:buchanan-john-h-jr, name:martin-james-d, name:grant-george-m, name:roberts-kenneth-a, name:huddleston-george-jr]
  - id: cal.1964-11-03.elections-1964-3
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [georgia, mississippi]
    c: 'The House in Georgia and Mississippi. Georgia 3d: Callaway (R) over Garland Byrd, 45,145 to 33,733, for Forrester''s open seat, the State''s first Republican U.S. Representative since Reconstruction. Mississippi 4th: Prentiss Walker (R) over Winstead, 35,277 to 28,057, the State''s first of the century. In Louisiana, Boggs holds New Orleans over Treen (R), 77,009 to 62,881.'
    n: '[*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). To check: [[w.cosman-five-states-for-goldwater]]; [[w.bartley-southern-politics-and-the]]; [[w.lamis-two-party-south]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1964-11-03.elections-1964]]; Alabama''s five, [[cal.1964-11-03.alabama]]. Names: Callaway, Walker, Treen, Byrd, Forrester, Winstead, Boggs.'
    tags: [name:callaway-howard-h, name:forrester-elijah-l, name:walker-prentiss-l, name:winstead-william-a, name:boggs-hale, name:treen-david-c, name:byrd-garland]
  - id: cal.1964-11-03.governors
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: 'Twenty-five governors elected: Democrats 17, Republicans 8. Republicans took Massachusetts (Volpe), Washington (Evans) and Wisconsin; Democrats Arizona and Utah. Kerner (D) over Percy in Illinois; Romney (R) re-elected in Michigan. Governorships after the election: Democrats 33, Republicans 17.'
    n: '[Wikipedia, "1964 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1964_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). To check: [[w.sabato-goodbye-to-good-time]]. See [[cal.1964-11-03.elections-1964]]. Names: Kerner, Volpe, Evans, Romney, Percy.'
    tags: [governors:1964-11-03, name:volpe-john-a, name:evans-daniel-j, name:kerner-otto, name:percy-charles-h, name:romney-george-w]
  - id: cal.1964-11-03.legislatures-ny
    when: Nov. 3
    date: '1964-11-03'
    thread: state-legislatures
    also: [elections-1964, legislatures]
    c: 'New York. Democrats take both houses of the legislature, the first time since 1935 (Check): the Senate 33 to 25, the Assembly 88 to 62 (Check). Elected under the old apportionment for one year only, by the three-judge court''s order of the summer after *WMCA v. Lomenzo*.'
    n: '[Wikipedia, "175th New York State Legislature"](https://en.wikipedia.org/wiki/175th_New_York_State_Legislature) (the seats counted from its rolls). Check: the *Legislative Manual*, 1965. To check: [[w.lee-one-man-one-vote]]; [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]].'
    tags: [state:ny]
  - id: cal.1964-11-03.governors-il
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Illinois. Kerner (D) re-elected over Percy (R), 2,418,394 to 2,239,095, 51.9 percent; Johnson carries the State. Percy carries 59 counties to Kerner's 43.
    n: 'Votes: [Ill. *Official Vote*, 1964, p. 14](https://archive.org/details/officialvoteof1964illi/page/n19). See [[cal.1964-04-14.governors-il]]; [[cal.1964-11-03.elections-1964-2]]. Names: Kerner, Percy, Johnson.'
    tags: [state:il, name:kerner-otto, name:percy-charles-h, name:johnson-lyndon-b]
  - id: cal.1964-11-03.legislatures-il
    when: Nov. 3
    date: '1964-11-03'
    thread: legislatures
    also: [state-legislatures]
    c: 'Illinois. The House elected at large on the orange "bedsheet" ballot, 33 inches long: 236 candidates for 177 seats, each voter choosing up to 177. All 118 Democrats elected, and 59 Republicans: the House from Republican to Democratic, two to one. Stevenson III, son of the governor of 1949–53, first among the Democrats.'
    n: 'Returns: *Illinois Blue Book, 1965–1966* (Check the page). To check: [[w.mcdowell-orange-ballot-election]]. See [[cal.1963-07-01.legislatures-il]]. Names: Stevenson.'
    tags: [state:il, name:stevenson-adlai-e-iii]
  - id: cal.1964-11-03.governors-mi
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964, goldwater]
    c: Michigan. Romney (R) re-elected over Staebler (D), 1,764,355 to 1,381,442, 55.9 percent, Johnson carrying the State. Romney had refused to endorse Goldwater and kept off his platforms. The last two-year term.
    n: 'Votes: [Wikipedia, "1964 Michigan gubernatorial election"](https://en.wikipedia.org/wiki/1964_Michigan_gubernatorial_election), from the [*Michigan Manual 1965–1966*, pp. 454–455](https://babel.hathitrust.org/cgi/pt?id=mdp.39015071179256&view=1up&seq=522) (Check: not read here). To check: [[w.harris-romneys-way]]; [[w.mollenhoff-george-romney]]. See [[cal.1964-09-01.governors-mi]]; [[cal.1964-11-03.elections-1964-2]]. Names: Romney, Staebler, Johnson, Goldwater.'
    tags: [state:mi, name:romney-george-w, name:staebler-neil-o, name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-11-03.legislatures-mi
    when: Nov. 3
    date: '1964-11-03'
    thread: state-legislatures
    also: [legislatures]
    c: Michigan. The Democrats, on the Austin–Kleiner districts and Johnson's vote, take both houses of the legislature from the Republicans (Check the seats).
    n: 'Apol (see [[cal.1964-06-22.legislatures-mi]]). See [[cal.1964-06-22.legislatures-mi]]. Names: Johnson.'
    tags: [state:mi, name:johnson-lyndon-b]
  - id: cal.1964-11-03.state-constitutions-mi
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    c: Michigan. Proposal C, a referendum on the legislature's law against straight-ticket voting, the law rejected, 795,546 yes to 1,515,875 no.
    n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals), from the *Michigan Manual* (Check: the act and the canvass).'
    tags: [state:mi]
  - id: cal.1964-11-03.open-housing-akron
    when: Nov. 3
    date: '1964-11-03'
    thread: open-housing
    also: [state-constitutions]
    c: 'Akron. An amendment to the city charter, put on the ballot by petition, adopted: no ordinance on race, religion or ancestry in the sale, rental or financing of real property to take effect unless the voters approve it, and the fair housing ordinance passed by the council in July suspended. Check the vote.'
    n: Akron Ordinances Nos. 873-1964, 926-1964; Akron City Charter § 137. Struck down in *Hunter v. Erickson*, [393 U.S. 385](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393385/usrep393385.pdf) (1969). See [[cal.1964-11-03.cities-and-housing]].
    tags: [state:oh, city:akron]
  - id: cal.1964-11-03.state-constitutions-tx
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [welfare, health]
    c: Texas adopts three amendments. Vendor payments for medical care of the needy aged not on old-age assistance, with federal funds, State funds not to exceed what the federal match covers, 1,049,995 to 426,866. The transfer of up to 1 percent a year from the permanent to the available school fund ended; terms for laws on conservation districts.
    n: '[Tex. Legis. Ref. Library, Constitutional amendments, election of Nov. 3, 1964](https://lrl.texas.gov/legis/ConstAmends/results.cfm?electionDate=1964-11-03). To check: [[w.david-with-dignity]]; [[w.may-texas-state-constitution]]. See [[cal.1963-11-09.state-constitutions-tx]].'
    tags: [state:tx]
  - id: cal.1964-11-03.state-constitutions-ok
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    c: 'Oklahoma votes on seven State questions; all fail. A Court on the Judiciary to remove judges, 397,823 to 370,694, and a school levy of up to 15 mills, 417,638 to 405,612: majorities of those voting on them, short of a majority of all votes cast. By referendum petition, the act ending the governor''s power to fill vacancies for U.S. Senator and judges by appointment rejected, 310,358 to 458,037. Legislators'' per diem; school aid and school district bills.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 48–50](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=48). See [[cal.1964-05-26.state-constitutions-ok]]; [[cal.1963-01-06.states-and-cities-ok]].'
    tags: [state:ok]
  - id: cal.1964-11-03.governors-wa
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Washington. Evans (R) governor over Rosellini (D), 697,256 to 548,692, 55.8 percent, as Johnson carries the State.
    n: 'Votes: [Wikipedia, "1964 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1964_Washington_gubernatorial_election); Check: Wash. *Abstract of Votes, Presidential and State General Election, November 3, 1964*, 4. To check: [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. See [[cal.1964-09-15.governors-wa]]. Names: Evans, Rosellini, Johnson.'
    tags: [state:wa, name:evans-daniel-j, name:rosellini-albert-d, name:johnson-lyndon-b]
  - id: cal.1964-11-03.state-constitutions-or
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [crime-and-hijacking]
    c: 'Oregon. Measure 1, the legislature''s amendment of the constitution abolishing the death penalty: yes 455,654, no 302,105, 60.1 percent. The last execution, by gas, Aug. 20, 1962.'
    n: 'Votes: [Wikipedia, "List of Oregon ballot measures"](https://en.wikipedia.org/wiki/List_of_Oregon_ballot_measures); Check: [Or. *Official Abstract of Votes, General Election, November 3, 1964*](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411026/File/document). [Wikipedia, "Capital punishment in Oregon"](https://en.wikipedia.org/wiki/Capital_punishment_in_Oregon). To check: [[w.peirce-pacific-states-of-america]].'
    tags: [state:or]
  - id: cal.1964-11-03.governors-ut
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Utah. Rampton (D) governor over Melich (R), 226,956 to 171,300, 57.0 percent; the Republicans had held the office since 1949.
    n: 'Votes: [Utah, *Abstract of the Returns of the General Election*, Nov. 3, 1964](https://vote.utah.gov/wp-content/uploads/2023/09/1964Gen.pdf). To check: [[w.peirce-mountain-states-of-america]]. See [[cal.1964-08-11.governors-ut]]; [[cal.1964-11-03.elections-1964-2]]. Names: Rampton, Melich.'
    tags: [state:ut, name:rampton-calvin-l, name:melich-mitchell]
  - id: cal.1964-11-03.governors-az
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Arizona. Goddard (D) governor over Kleindienst (R), 252,098 to 221,404, 53.2 percent, as Goldwater carries his State.
    n: 'Votes: [Wikipedia, "1964 Arizona gubernatorial election"](https://en.wikipedia.org/wiki/1964_Arizona_gubernatorial_election); Check: [Ariz. *Official Canvass, General Election, November 3, 1964*](https://azmemory.azlibrary.gov/nodes/view/102659). To check: [[w.shermer-sunbelt-capitalism]]; [[w.peirce-mountain-states-of-america]]. See [[cal.1964-09-08.governors-az]]. Names: Kleindienst, Goddard, Goldwater.'
    tags: [state:az, name:goddard-samuel-p-jr, name:kleindienst-richard-g, name:goldwater-barry-m]
  - id: cal.1964-11-03.state-constitutions-md
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [desegregation-public-places]
    c: 'Maryland. The public accommodations act of 1964 approved at referendum, 342,715 to 301,505. Amendments ratified: annual 70-day sessions of the General Assembly, 333,094 to 191,148; more time for a county charter board; the Orphans'' Court of Montgomery County to the Circuit Court; notaries public.'
    n: '*Maryland Manual*, 1965–66, [pp. 482–84](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--482.html). To check: [[w.callcott-maryland-and-america-1940]]. See [[cal.1964-03-14.desegregation-public-places-md]].'
    tags: [state:md]
  - id: cal.1964-11-03.elections-1964-dc
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [states-and-cities, electoral-college]
    c: 'The District of Columbia votes for President for the first time, under the Twenty-third Amendment: Johnson 169,796, Goldwater 28,801; 85.5 percent. Three electoral votes.'
    n: '[*Statistics of the Presidential and Congressional Election of November 3, 1964*, 52](https://clerk.house.gov/member_info/electionInfo/1964election.pdf#page=53) (electoral votes). [Wikipedia, "1964 United States presidential election in the District of Columbia"](https://en.wikipedia.org/wiki/1964_United_States_presidential_election_in_the_District_of_Columbia); the Clerk''s *Statistics* print no vote for the District; check against the Board of Elections'' certificate (National Archives). To check: [[w.asch-chocolate-city]]; [[w.gillette-between-justice-and-beauty]]. See [[cal.1961-03-29.states-and-cities]]. Names: Johnson, Goldwater.'
    tags: [state:dc, city:washington, name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-11-03.state-constitutions-ca
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [press-and-broadcasting, elections-1964]
    c: 'California. Proposition 15, the "Free Television Act," an initiative against pay television: a charge for programs carried into the home contrary to public policy. Yes 4,515,013, no 2,286,775: 66.4 percent. The same day, Proposition 14, against the Rumford Act, carries.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 3, 1964, p. 26](https://archive.org/details/castatem196264cali/page/n174). Measure: [UC Law SF, California Ballot Propositions, 1964](https://repository.uclawsf.edu/ca_ballot_props/673/). See [[cal.1964-11-03.cities-and-housing]].'
    tags: [state:ca]
  - id: cal.1964-11-03.state-constitutions-ar
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [voting-rights]
    c: 'Arkansas''s voters adopt Amendment 51: the poll tax, its rolls the State''s only registration of voters, gives way as the condition of voting to a system of registration (Check: the vote). Faubus re-elected over Rockefeller the same day.'
    n: '[Ark. *Historical Report of the Secretary of State* (2018), p. 346](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=355). Check: the vote, Ark. Secretary of State. To check: [[w.johnson-arkansas-in-modern-america]]. See [[cal.1964-01-23.voting-rights]]; [[cal.1964-11-03.elections-1964-2]]. Names: Faubus, Winthrop Rockefeller.'
    tags: [state:ar, name:faubus-orval-e, name:rockefeller-winthrop]
  - id: cal.1964-11-03.governors-wi
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Wisconsin. Knowles (R) over Governor Reynolds (D), 856,779 to 837,901, 50.6 percent.
    n: 'Votes: [Wikipedia, "1964 Wisconsin gubernatorial election"](https://en.wikipedia.org/wiki/1964_Wisconsin_gubernatorial_election), from the *Wisconsin Blue Book 1966* (Check). See [[cal.1964-09-08.governors-wi]]; [[cal.1964-11-03.governors]]. Names: Knowles, John Reynolds.'
    tags: [state:wi, name:knowles-warren-p, name:reynolds-john-w-jr]
  - id: cal.1964-11-03.state-constitutions-mn
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: Minnesota's taconite amendment, "Taxation of Taconite and Other Metals," adopted, 1,272,590 to 204,133; 793,087, a majority of all who voted, needed. A second, removing obsolete provisions, adopted, 1,089,798 to 254,216.
    n: '[*Report of the State Canvassing Board, General Election, November 3, 1964*](https://www.lrl.mn.gov/docs/2023/Other/232070/1964.pdf). To check: [[w.peirce-great-plains-states-of]].'
    tags: [state:mn]
  - id: cal.1964-11-03.legislatures-us
    when: Nov. 3
    date: '1964-11-03'
    thread: state-legislatures
    also: [elections-1964, legislatures]
    c: 'The State legislatures. Democrats gain some 470 lower-house seats and 116 senate seats. They take both houses of Indiana, Iowa, Maine, Michigan, New York and Utah, and the lower houses of Alaska (tied before), Colorado, Illinois, Montana, North Dakota, Pennsylvania, Wisconsin and Wyoming; Republicans the Oregon House; the Nevada and Ohio senates tied. At the 1965 sessions Democrats control 32 legislatures, Republicans 7, ten divided or tied (25, 20 and 4 before). Seated on new apportionments, among others: the Iowa Senate, 50 seats to 59; the Michigan Senate, 34 to 38; the Oklahoma House, 120 to 99.'
    n: '[[w.klarner-state-partisan-balance-data]]: the sessions of 1964 and 1965 (Check against the *Book of the States*, 1964–65 and 1966–67). To check: [[w.baker-reapportionment-revolution]]; [[w.cox-elbridge-gerrys-salamander]]. See [[cal.1964-11-03.elections-1964]]; [[cal.1964-06-15.court]].'
    tags: [legislatures:1965, state:nd, state:pa, state:wi, state:co, state:il, state:mi, state:ny, state:ok, state:in, state:mt, state:wy, state:ak, state:nv, state:or, state:me, state:ia, state:oh, state:ut]
  - id: cal.1964-11-03.governors-ma
    when: Nov. 3
    date: '1964-11-03'
    thread: governors
    also: [elections-1964]
    c: Massachusetts. Volpe (R) back as governor over Bellotti (D), 1,176,462 to 1,153,416, 50.3 percent; Richardson (R) lieutenant governor. Brooke re-elected attorney general, 1,543,900, 67.2 percent. Johnson carries the State.
    n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 7](https://archive.org/details/electionstatisti1964mass/page/n12). See [[cal.1964-09-15.governors-ma]]; [[cal.1964-11-03.elections-1964-2]]; [[cal.1964-11-03.governors]]. Names: Volpe, Bellotti, Richardson, Brooke, Johnson.'
    tags: [state:ma, name:volpe-john-a, name:bellotti-francis-x, name:richardson-elliot-l, name:brooke-edward-w, name:johnson-lyndon-b]
  - id: cal.1964-11-03.state-constitutions-ma
    when: Nov. 3
    date: '1964-11-03'
    thread: state-constitutions
    also: [governors]
    c: 'Massachusetts, Question 1: four-year terms for the governor, lieutenant governor, secretary, treasurer, attorney general and auditor, from the election of 1966; councillors and legislators still two. Yes 1,391,922, no 450,367, blank 546,141.'
    n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 541](https://archive.org/details/electionstatisti1964mass/page/n546). Passed by the General Court in joint session, Mar. 29, 1961, 219–26, and May 8, 1963. To check: [[w.hogarty-massachusetts-politics-and-public]].'
    tags: [state:ma]
  - id: cal.1964-11-04.elections-1964
    when: Nov. 4
    date: '1964-11-04'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater concedes at Scottsdale, by telegram and before the press: the Republicans "the party of opposition when opposition is called for." More than 25 million voted for "a Republican philosophy"; his defeat in part the work of Republicans who would not work for the top of the ticket.'
    n: '[News Conference Conceding the Presidential Election in Scottsdale, Arizona](https://www.presidency.ucsb.edu/documents/news-conference-conceding-the-presidential-election-scottsdale-arizona) (Nov. 4, 1964). To check: [[w.goldwater-with-no-apologies]]. See [[cal.1964-11-03.elections-1964]]. Names: Goldwater.'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-11-04.middle-east
    when: Nov. 4
    date: '1964-11-04'
    thread: middle-east
    c: 'Tehran radio: Khomeini exiled, arrested at Qom and taken to Turkey.'
    n: 'FRUS 1964–68, XXII, docs. [55](https://history.state.gov/historicaldocuments/frus1964-68v22/d55), [56](https://history.state.gov/historicaldocuments/frus1964-68v22/d56). See [[cal.1964-10-13.middle-east]]. Names: Khomeini.'
    tags: [name:khomeini-ruhollah]
  - id: cal.1964-11-06.civil-rights-organizations
    when: Nov. 6–12
    date: '1964-11-06'
    thread: civil-rights-organizations
    also: [mississippi]
    c: 'Waveland, Miss. SNCC''s staff retreat after Atlantic City: some forty position papers on its program and structure. A strong executive in Atlanta or authority in the field projects: not settled. Forman proposes that the staff be the coordinating committee. Paper 24, unsigned, on women in SNCC. Check the dates.'
    n: 'SNCC, [Staff Retreat, minutes](https://www.crmvet.org/docs/6411_sncc_staff_min.pdf), Nov. 7, 1964; [SNCC Position Paper (Women in the Movement)](https://www.crmvet.org/docs/snccfem.htm) (Civil Rights Movement Archive). SNCC Digital Gateway, [SNCC''s Waveland Conference](https://snccdigital.org/events/snccs-waveland-conference/) (K–J Cong. II.L). [[w.dittmer-local-people]], 331–32. To check: [[w.carson-in-struggle]]; [[w.forman-making-of-black-revolutionaries]]; [[w.ransby-ella-baker-and-the]]; [[w.king-freedom-song]]; [[w.hogan-many-minds-one-heart]]. See [[cal.1964-08-25.mississippi]]. Names: Forman.'
    tags: [name:forman-james]
  - id: cal.1964-11-06.state-and-city-finance-md
    when: Nov. 6
    date: '1964-11-06'
    thread: state-and-city-finance
    c: Maryland. A one-day special session repeals the increase in the State income tax voted in March with the new school-aid formula.
    n: '*Maryland Manual*, 1965–66, [the special session of Nov. 6, 1964](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000172/html/am172--256.html). To check: [[w.callcott-maryland-and-america-1940]].'
    tags: [state:md]
  - id: cal.1964-11-09.japan-and-korea
    when: Nov. 9
    date: '1964-11-09'
    thread: japan
    c: Ikeda, ill, resigns; the Diet elects Satō Eisaku Prime Minister.
    n: '[FRUS 1964–68, XXIX, pt. 2, doc. 34](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d34), n. 2. To check: [[w.schaller-altered-states]]; [[w.welfield-empire-in-eclipse]]; [[w.sato-eisaku-nikki]]. See [[cal.1964-01-27.japan-and-korea]]. Names: Ikeda, Satō.'
    tags: [name:ikeda-hayato, name:sato-eisaku]
  - id: cal.1964-11-11.opinion
    when: Nov. 11
    date: '1964-11-11'
    thread: opinion
    c: 'Gallup, Oct. 16–21: with one party for liberals and one for conservatives, liberal 37 percent, conservative 34, undecided 29. The undecided asked to choose: liberal 51, conservative 49.'
    n: '[[w.gallup-poll]], III, 1907.'
  - id: cal.1964-11-12.japan-and-korea
    when: Nov. 12–14
    date: '1964-11-12'
    thread: japan
    c: 'The submarine *Sea Dragon* at Sasebo: the first call of an American nuclear-powered warship in Japan, agreed in August; protests small.'
    n: FRUS 1964–68, XXIX, pt. 2, docs. [31](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d31) (McNamara to Johnson, Oct. 24), [34](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d34). See [[cal.1964-11-09.japan-and-korea]].
  - id: cal.1964-11-13.opinion
    when: Nov. 13
    date: '1964-11-13'
    thread: opinion
    also: [civil-rights-bill]
    c: 'Gallup, Oct. 8–13: the Civil Rights Act enforced strictly from the beginning, 23 percent; a gradual, persuasive approach at first, 62; depends on the circumstances, 9.'
    n: '[[w.gallup-poll]], III, 1908.'
  - id: cal.1964-11-16.transition-and-staff
    when: Nov. 16
    date: '1964-11-16'
    thread: transition-and-staff
    also: [economy]
    c: Heller leaves the Council of Economic Advisers. Ackley sworn in as chairman, Okun as a member.
    n: 'Remarks at the Swearing In of Gardner Ackley as Chairman and Arthur Okun as Member of the Council of Economic Advisers, [1963–64 Pub. Papers 1593](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=833) (Nov. 16, 1964). To check: [[w.flash-economic-advice-and-presidential]]; [[w.president-and-the-council]]. Names: Heller, Ackley, Okun, Johnson.'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:ackley-gardner, name:okun-arthur-m]
  - id: cal.1964-11-18.civil-rights-the-executive
    when: Nov. 18
    date: '1964-11-18'
    thread: king
    also: [civil-rights-the-executive]
    c: Hoover, to a group of women reporters, calls King "the most notorious liar in the country." Nov. 21, the FBI mails King an anonymous letter with a tape. Dec. 1, King, Abernathy, and Andrew Young see Hoover at the Bureau.
    n: '[S. Rep. No. 94-755, Book III, 156–67 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=170) (K–J Adm. II.H.3). To check: [[w.garrow-fbi-and-martin-luther]]; [[w.branch-pillar-of-fire]]; [[w.gage-g-man]]; [[w.garrow-bearing-the-cross]]; [[w.deloach-hoovers-fbi]]. See [[cal.1963-10-10.king]]. Names: Hoover, Martin Luther King, Abernathy, Young.'
    tags: [name:hoover-j-edgar, name:king-martin-luther-jr, name:abernathy-ralph-david, name:young-andrew-j-jr]
  - id: cal.1964-11-18.opinion
    when: Nov. 18
    date: '1964-11-18'
    thread: opinion
    also: [vietnam, medicare]
    c: 'Gallup, Nov. 6–11: the problem Johnson should deal with now that he has won, in order of mention: the international situation, Vietnam specifically; medical care for the aged; civil rights; farm problems; unemployment.'
    n: '[[w.gallup-poll]], III, 1908. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-11-23.assassination
    when: Nov. 23
    date: '1964-11-23'
    thread: assassination
    c: 'The Warren Commission''s hearings and exhibits published, 26 volumes: the testimony of some 550 witnesses.'
    n: '*Hearings Before the President''s Commission on the Assassination of President Kennedy* (1964) ([govinfo](https://www.govinfo.gov/app/collection/gpo-warrencommissionhearings)). See [[cal.1963-11-29.assassination]]; [[cal.1964-09-24.assassination]].'
  - id: cal.1964-11-23.economy
    when: Nov. 23–25
    date: '1964-11-23'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling crisis: the Bank of England''s rate from 5 to 7 percent. The same day the Board (Martin) approves the discount rate from 3½ to 4 percent at five Reserve Banks, New York among them, effective Nov. 24, the rest by Nov. 30; Regulation Q ceilings to 4 percent on savings deposits, 4½ on time deposits of 90 days or more, 4 under. Nov. 25, $3 billion in credits for sterling from eleven countries and the BIS; the Federal Reserve''s swap line with the Bank of England up $250 million, to $750 million.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697328) (Nov. 23, 1964); [Federal Reserve and Treasury statement](https://fraser.stlouisfed.org/title/9237/item/697331) (Nov. 25, 1964). [*Federal Reserve Bulletin*, Dec. 1964](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1964-21360), pp. 1530–31. Federal Open Market Committee, minutes, [Nov. 24, 1964](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19641124.pdf). FRUS 1964–68, XII, docs. [233](https://history.state.gov/historicaldocuments/frus1964-68v12/d233), [234](https://history.state.gov/historicaldocuments/frus1964-68v12/d234) (Wilson and Johnson, Nov. 19). To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.coombs-arena-of-international-finance]]; [[w.solomon-international-monetary-system-1945]]; [[w.wilson-labour-government-1964-1970]]. See [[cal.1963-07-16.economy]]; [[cal.1964-10-15.europe-and-the-alliance]]. Names: Martin.'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1964-11-24.congo
    when: Nov. 24
    date: '1964-11-24'
    thread: congo
    c: Stanleyville. Belgian paratroopers, flown in American C-130s, drop on the airfield at dawn. The Simba rebels fire on their hostages in the street; Carlson, an American medical missionary, among the dead. Nov. 26, a second drop at Paulis.
    n: 'FRUS 1964–68, XXIII, docs. [354](https://history.state.gov/historicaldocuments/frus1964-68v23/d354), [365](https://history.state.gov/historicaldocuments/frus1964-68v23/d365). To check: [[w.weissman-american-foreign-policy-in]]; [[w.namikas-battleground-africa]]; [[w.odom-dragon-operations]]. See [[cal.1963-01-14.congo]]. Names: Carlson.'
    tags: [name:carlson-paul-e]
  - id: cal.1964-11-26.middle-east
    when: Nov. 26
    date: '1964-11-26'
    thread: middle-east
    also: [congo]
    c: 'Cairo, Thanksgiving Day. Several hundred African students attack the embassy, after the American and Belgian rescue at Stanleyville; the USIS library burned. Battle protests. Nov. 30, the Prime Minister: the UAR''s deep regret; it will negotiate compensation.'
    n: 'FRUS 1964–68, XVIII, docs. [110](https://history.state.gov/historicaldocuments/frus1964-68v18/d110), [111](https://history.state.gov/historicaldocuments/frus1964-68v18/d111). To check: [[w.burns-economic-aid-and-american]]; [[w.ferris-nassers-gamble]]. Names: Battle.'
    tags: [name:battle-lucius-d]
  - id: cal.1964-11-29.opinion
    when: Nov. 29
    date: '1964-11-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 6–11: the United States handling South Vietnam as well as could be expected, 35 percent; badly, 50. Republicans 67 badly; Democrats 49 as well as could be expected. What next: either get out or fight, 15; tougher, 10; military action 9; get out 9; sit down and talk 3.'
    n: '[[w.gallup-poll]], III, 1909.'
