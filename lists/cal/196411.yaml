  - id: cal.1964-11-01.vietnam
    when: Nov. 1
    date: '1964-11-01'
    thread: vietnam-operations
    c: 'Biên Hòa. The Viet Cong mortar the air base after midnight: 4 Americans killed, 30 wounded, 27 aircraft destroyed or damaged. Taylor asks a reprisal against an airfield in the North within 48 hours. Washington declines, Nov. 1–2, two days before the election; planning for wider action ordered.'
    n: 'FRUS 1964–68, I, docs. [393](https://history.state.gov/historicaldocuments/frus1964-68v01/d393), [396](https://history.state.gov/historicaldocuments/frus1964-68v01/d396), [399](https://history.state.gov/historicaldocuments/frus1964-68v01/d399), [400](https://history.state.gov/historicaldocuments/frus1964-68v01/d400). [[w.gibbons-u-s-government-and]], II, 363–64 (the raid: five killed, 76 wounded, 27 of 30 B-57s destroyed or damaged; Taylor and the Chiefs for reprisal; Johnson against, two days before the election); [[w.vietnam-victory-in-vietnam]], 136 (the shelling, the night of Oct. 31); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 526–27 (the attack; Taylor''s call; no reprisal; the working group, Nov. 2); [[w.cosmas-joint-chiefs-of-staff-2012]], 149–53 (all but the planning); [[w.marolda-united-states-navy-and]], 472–73 (the attack; Taylor, Westmoreland, Sharp and Moorer for reprisal; Washington''s hesitancy before the election); [[w.asselin-hanois-road-to-the]], 204 (the attack; Taylor''s reading of it); [[w.dallek-flawed-giant]], 240–41 (five killed, seventy-six wounded, 240); [[w.macv-command-history-1964]], 101–02, 192 (the attack, 4 Americans killed); [[w.westmoreland-soldier-reports]], 88, 111 (the attack; Westmoreland, with Taylor, for a reprisal; Washington against it two days before the election); [[w.rusk-as-i-saw-it-1990]], 447 (Rusk against retaliation); [[w.bird-color-of-truth]], 293 (the attack; Johnson''s working group); [[w.bernstein-guns-or-butter]], 338 (a hundred Viet Cong in black; Johnson, campaigning, declines; Bundy to set up the Working Group); [[w.futrell-united-states-air-force]], 253. Marolda, 472–73, gives 24 aircraft destroyed or damaged and 72 wounded (Cosmas, 149, 72 "wounded or injured"); Kaplan, 526, 72 wounded, 5 B-57s destroyed and 13 damaged, the sources varying (526 n.122); FRUS''s editors, the entry''s figures (doc. 393 n. 2). [[w.logevall-choosing-war]], 250, 255 (the shelling of Nov. 1, no retaliation, 250; the Working Group ordered the day before the election, 255); [[w.moyar-triumph-forsaken]], 330–31 (the attack, four killed, thirty wounded, twenty-seven aircraft; no reprisal with the election days off; Rusk to Taylor). [[w.ball-past-has-another-pattern]], 388 (four killed; Ball gives five B-57s destroyed; the working group). Check: Westmoreland gives two Americans and four Vietnamese killed and five B-57s destroyed (88). Check: Bird, 293, gives 72 wounded. Check: Bernstein, 338, gives six B-57s destroyed and twenty aircraft damaged, five Americans and two South Vietnamese killed, nearly a hundred injured. To check: [[w.pentagon-papers]]; [[w.kahin-intervention]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.kaiser-american-tragedy]]; [[w.taylor-swords-and-plowshares]]. See [[cal.1964-08-02.vietnam]]. Names: Taylor. Check: *Victory in Vietnam* has the 80th Artillery Group''s mortars and recoilless rifles, the night of Oct. 31, destroy 59 aircraft and kill hundreds of American pilots and technicians (136).'
