  - id: cal.1964-11-03.elections-1964
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [goldwater]
    c: 'Election day. Johnson and Humphrey over Goldwater and Miller, 43,126,959 to 27,175,770, 61.1 percent; 486 electoral votes to 52. Goldwater carries Arizona and five States of the Deep South: Alabama, Georgia, Louisiana, Mississippi, South Carolina. The 89th Congress: House 295 D–140 R; Senate 68 D–32 R.'
    n: 'Radio and Television Remarks to the American People at the Close of Election Day, [1963–64 Pub. Papers 1585](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=825) (Nov. 4, 1964). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). [[w.perlstein-before-the-storm]], 510–13 (Goldwater''s six States); [[w.white-making-of-the-president-1965]], 379 (the Network Election Service''s first total at 6 p.m., Johnson 77,572 to 74,139; at 7 p.m., 2 percent counted, a 273,000 plurality, 59.6 percent); [[w.goldberg-barry-goldwater]], 232–33 (NBC''s call of a landslide at 6:29 p.m.; 43 million to 27 million, 486 to 52; Maine 69, New Hampshire 64, Vermont 66 for Johnson; the Deep South and Arizona Goldwater''s; 94 percent of the Negro vote against him; two Senate seats lost, thirty-seven House, 541 legislative; twenty of the fifty-seven Republicans who endorsed him before the convention beaten); [[w.zelizer-fierce-urgency-of-now]], 159–60 (486 electoral votes to 52; 61 percent; the House 295–140, the Senate 68–32); [[w.bernstein-guns-or-butter]], 154–55 (43,126,218 to 27,174,898, 61 percent; 486 electoral votes to 52; the House 295 to 140, the Senate 68 to 32); [[w.novak-agony-of-the-g]], 5–6 (more than 61 percent for Johnson; forty-four of fifty States, 486 electoral votes to 52; Goldwater''s Alabama, Mississippi, Louisiana, South Carolina, Georgia and Arizona; forty House seats gained). The national figures: the Clerk''s State figures, added (Elections, 1964). [[w.young-two-suns-of-the]], 196–97 (the electoral votes; the six States; the House and the Senate). [[w.kabaservice-rule-and-ruin]], 121 (Goldwater''s six States). Check: Zelizer, 159, gives 43,129,484 to 27,178,188. Check: Bernstein, 154, gives 43,126,218 to 27,174,898. To check: [[w.cosman-five-states-for-goldwater]]; [[w.lamb-campaign-decision-making]]; [[w.national-election-of-1964]]; [[w.mann-daisy-petals-and-mushroom]]; [[w.kessel-goldwater-coalition]]; [[w.middendorf-glorious-disaster]]. See [[cal.1964-07-15.elections-1964]]; [[cal.1964-08-26.elections-1964]]. Names: Johnson, Humphrey, Goldwater, Miller. Check: Young, 196, gives 43,128,956 to 27,177,873 (CQ''s *Almanac* and APP).'
    src:
      c: 5cadd415
