  - id: cal.1964-11-01.king
    when: Nov. 1
    date: '1964-11-01'
    thread: king
    also: [elections-1964]
    c: 'Atlanta. Louis Martin brings King word of at least 1.4 million leaflets for a write-in vote for King for President. King, at a press conference, disavows them: a "venomous" plot to make Negroes waste their votes.'
    n: '[[w.branch-pillar-of-fire]], 521. Check: the leaflets'' buyers; Branch: "published reports (leading to one criminal indictment)" of Goldwater officials (521). To check: Poinsett, Walking with Presidents: Louis Martin and the Rise of Black Political Power (1997), 146-47 (cited by [[w.branch-pillar-of-fire]], 521); Baumgardner to Sullivan, Nov. 2, 1964, FK-511 (cited by [[w.branch-pillar-of-fire]], 521); Baltimore Sun, Nov. 3, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 521); Cosman, ed., Republican Politics: The 1964 Campaign and Its Aftermath for the Party, 33 (cited by [[w.branch-pillar-of-fire]], 521). Names: King.'
