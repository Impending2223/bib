  - id: cal.1964-11-03.vietnam
    when: Nov. 3
    date: '1964-11-03'
    thread: vietnam-air-war
    c: 'William Bundy''s working group on Vietnam first meets: McNaughton, Mustin of the Joint Staff, the CIA. Three options: A, present lines; B, systematic military pressure on the North until American objectives are met; C, graduated pressure, then negotiation under threat of more. Its paper, Nov. 21; the principals take it up Nov. 24 and 27, Taylor back from Saigon for the second.'
    n: 'FRUS 1964–68, I, docs. [403](https://history.state.gov/historicaldocuments/frus1964-68v01/d403), [418](https://history.state.gov/historicaldocuments/frus1964-68v01/d418), [424](https://history.state.gov/historicaldocuments/frus1964-68v01/d424), [428](https://history.state.gov/historicaldocuments/frus1964-68v01/d428), [429](https://history.state.gov/historicaldocuments/frus1964-68v01/d429). [[w.gibbons-u-s-government-and]], II, 365–74; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 527 (the group and its members; its paper; Taylor in Washington from Nov. 27); [[w.cosmas-joint-chiefs-of-staff-2012]], 156–163 (the group; the options; the paper); [[w.moyar-triumph-forsaken]], 340–41; [[w.mcnamara-in-retrospect]], ch. 6 at nn.15–16 (set up by the President Nov. 2; four weeks; the draft: no guarantee of a non-Communist South Vietnam short of a commitment that could bring "a Korean-scale ground action and possibly even the use of nuclear weapons"). [[w.ball-past-has-another-pattern]], 388 (the three options, the "Goldilocks Principle"; Option C); [[w.bernstein-guns-or-butter]], 338–41 (three weeks; McNaughton and William Bundy write the report; Ball''s "Goldilocks Principle," C the group''s choice). Check: McNamara has Johnson set up the working group on Nov. 2 (ch. 6). To check: the working group''s Option C, as printed in *The Pentagon Papers* (New York Times ed., 1971), 325 (cited by [[w.ball-past-has-another-pattern]], 388 n.6). See [[cal.1964-11-01.vietnam]]. Names: William Bundy, McNaughton, Taylor, Mustin. Check: Moyar, 340, gives the group two options, a "sharp blow" and "gradual escalation," and names William Bundy, McNaughton and Forrestal its leaders.'
