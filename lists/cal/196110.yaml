  - id: cal.1961-10-03.laos
    when: Oct. 3
    date: '1961-10-03'
    thread: laos
    also: [defense, berlin-and-vienna]
    c: 'Gilpatric, for McNamara, on the Chiefs'' plan: a crisis in Laos and Berlin at once; the air force for Southeast Asia and the nuclear strike capability; the Seventh Fleet''s absence from the rest of the Pacific; the continental reserve. "The President''s decision on the proposed plan may well hinge on the risks of getting into a serious two-front situation." The Chiefs: only intervention can stop the loss of Southeast Asia.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 251. See [[cal.1961-09-29.laos]]. Names: Gilpatric, McNamara.'
    src:
      c: a5a0fccc
      rows:
