  - id: cal.1961-10.indonesia
    when: Oct.
    date: 1961-10
    thread: indonesia
    c: 'LeMay, "deeply concerned" at the loss of influence in Indonesia. The Joint Chiefs to McNamara: Soviet military shipments $840 million against American aid of $61.6 million; a Communist Indonesia a "tremendous" asset to the bloc, a "chain reaction" possible; "a detailed and dynamic national plan." McNamara sends it to State.'
    n: '[[w.poole-joint-chiefs-of-staff]], 293. Names: LeMay, McNamara.'
