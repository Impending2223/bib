  - id: cal.1961-10.cuba
    when: Oct.
    date: 1961-10
    thread: cuba
    c: 'The Special Group asks for a contingency plan should Castro die, from whatever cause. The CIA''s Board of Estimates: his death "by assassination or by natural causes ... would almost certainly not prove fatal to the regime," and would probably strengthen the Communists'' position in Cuba.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 489; [[w.thomas-robert-kennedy]], 157 (the Special Group asks a "contingency plan in connection with the possible removal of Castro"; Taylor: "the President''s interest in the matter not be mentioned"); [[w.reeves-president-kennedy]], 265–66 (NSAM 100, Oct. 5; the Special Group''s "possible removal of Castro"; the CIA''s paper of Oct. 5 on his loss "by assassination or by natural causes"); [[w.sen-church-alleged-assassination-plots]], 136–37 (the CIA Board of National Estimates'' "The Situation and Prospects in Cuba," 9: Castro''s loss "by assassination or by natural causes, would have an unsettling effect, but would almost certainly not prove fatal to the regime," the Communist Party''s influence "significantly" increased; for A: NSAM 100 of Oct. 5, Parrott''s memorandum of Oct. 5 and the Special Group''s minutes of Oct. 6, a plan wanted "against the contingency that Castro would in some way or other be removed from the Cuban scene," not the Group''s request "from whatever cause"; see [[cal.1961-10-05.cuba]]). Check: Thomas dates the Special Group''s request Oct. 5 (157). Check: the days: [[w.sen-church-alleged-assassination-plots]], 136: NSAM 100 and Parrott''s memorandum, Oct. 5, 1961; the Special Group''s minutes, Oct. 6. To check: Church committee, *Alleged Assassination Plots Involving Foreign Leaders*, S. Rep. No. 94-465, 136–37 (1975) (cited by [[w.schlesinger-robert-kennedy-and-his]], 489 n.80). Check: the days of the request and of the reply. Names: Castro.'
