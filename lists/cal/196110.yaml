    short: the Twenty-Second Congress
  - id: cal.1961-10.vietnam
    when: Oct., early
    date: 1961-10
    at: before 1961-10-01
    thread: vietnam
    c: 'COSVN''s first plenum, enlarged: the strategic hamlets a danger to the revolution in the South; a "continuous offensive," political and armed, "limited offensives and uprisings" toward a general offensive and general uprising. Hanoi declines to go so far.'
    n: '[[w.asselin-hanois-road-to-the]], 110–13; [[w.nguyen-hanois-war]], 60 (the conference, early October); [[w.van-kien-dang-toan]], XXII, 656–730 (the resolution of "Hội nghị R lần thứ I (mở rộng)," undated: the general uprising the right road; partial uprisings spreading, 674, 681; the attack on the enemy kept continuous to the general uprising, 673; not the strategic hamlets); [[w.lich-su-khang-chien-chong-my]], III, 51 (the enlarged conference, COSVN''s first since its re-founding, Nguyễn Văn Linh presiding: political and armed struggle side by side, both basic, toward a general uprising); [[w.guan-vietnamese-communists-relations-with]], 203 ("the Nam Bo Central Committee," its enlarged conference: political struggle first, armed struggle raised to its level, the pace by region; a full-scale war to be avoided; in the plains both alike, in the cities the political, in the mountains the military first, to destroy the enemy and widen the bases; Laos an important strategic zone). Made public: an English translation, "Draft of COSVN Resolution 1," in the Douglas Pike Collection (Asselin, 111 n.139; Check when taken). To check: Ưng Văn Khiêm''s report to the National Assembly, Oct. 24, 1961, and the Assembly''s letter to the South, Vietnam National Archives Center 3 (cited by [[w.asselin-hanois-road-to-the]], 113 nn.145–46, for Hanoi''s caution); [[w.vietnam-1979]], II, 119–123 (cited by [[w.guan-vietnamese-communists-relations-with]], 203 n.97a); "Nghị quyết Hội nghị R (mở rộng), tháng 10/61," captured Party document, CDEC log no. 1706/KTTL/69 (Porter''s source) (cited by [[w.guan-vietnamese-communists-relations-with]], 203 n.97b). Check: Nguyen, 60, has the conference reaffirm Hanoi''s directives in a ten-point mission.'
