        - 'via w.anthony-war-in-northern-laos 63 n.9a: all'
        - 'via w.anthony-war-in-northern-laos 63 n.9b: all'
    tags: [name:brown-winthrop-g]
  - id: cal.1961-10-04.economy
    when: Oct. 4
    date: '1961-10-04'
    thread: economy
    c: 'The Committee of Under Secretaries on Foreign Economic Policy on the balance of payments, Ball presiding. Fowler: the program rests on the message of Feb. 6. Roosa on short-term capital movements under convertibility. Tobin: the balance will worsen as recovery draws in imports; the question is protecting the dollar from runs meanwhile, and later the supply of liquidity. Coppock: with devaluation, exchange controls and new import restrictions ruled out, the burden falls on exports and monetary restraint.'
    n: '[FRUS 1961–63, IX: Foreign Economic Policy, doc. 6](https://history.state.gov/historicaldocuments/frus1961-63v09/d6) (summary minutes; the Treasury paper, "The Balance of Payments and our Foreign Economic Policy," dated Sept. 29). Made public: FRUS 1961–63, IX (1995). See [[cal.1961-02-06.economy-gold]]. Names: Ball, Fowler, Roosa, Tobin.'
    src:
      c: fc798463
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v09/d6: all'
    tags: [name:ball-george-w, name:fowler-henry-h, name:roosa-robert-v, name:tobin-james]
