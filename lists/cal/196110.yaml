  - id: cal.1961-10-31.soviet-union
    when: Oct. 31
    date: '1961-10-31'
    place: moscow
    thread: soviet-union
    c: 'Twenty-Second Party Congress closes. The new Party Program adopted; Stalin''s body ordered out of the Lenin Mausoleum, removed that night. Through the Congress, Khrushchev''s attacks on Stalin''s crimes, the anti-party group and the Albanian leadership. State''s assessment to all posts, Nov. 8: Khrushchev''s primacy in the bloc reasserted; Albania a thinly veiled challenge to the Chinese.'
    n: 'FRUS 1961–63, V, doc. [127](https://history.state.gov/historicaldocuments/frus1961-63v05/d127). [[w.fursenko-khrushchevs-cold-war]], 410 (Stalin''s body out of the mausoleum, Oct. 30); [[w.friedman-shadow-cold-war]], 71, 87 (the new program: the national-liberation revolution does not end with political independence, which "will be shaky" without deep social and economic change; it blasts American "imperialism" and "neocolonialism" and the new American aid programs, naming Kennedy''s speech to Congress on loans; to surpass the United States economically by 1970, communism by 1980). To check: [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]; V. I. Pavlov and I. B. Red’ko, “Gosudarstvo Natsional’noĭ Demokratii i Perekhod k Nekapitalisticheskomu Razvitiiu,” Narody Azii i Afriki 1 (1963): 30, 30 (cited by [[w.friedman-shadow-cold-war]], 71 n.38); “Proekt Programmy KPSS i Nekotorye Problemy Natsional’no-Osvoboditel’nogo Dvizheniia Narodov Azii i Afriki,” Narody Azii i Afriki 5 (1961): 8, 8 (cited by [[w.friedman-shadow-cold-war]], 87 n.115). See [[cal.1961-10-17.berlin-and-vienna]]. Names: Khrushchev.'
    src:
      c: bf95cfc8
      rows:
