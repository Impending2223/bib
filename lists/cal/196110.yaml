  - id: cal.1961-10-19.china-leadership-4
    when: Oct. 19
    date: '1961-10-19'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi hears Li Xiannian and others on commerce. To use the state''s goods as a weapon to seek private convenience is not allowed, still less to take things through the "back door" and swap them at will; the commercial ranks and their cadres are to be strengthened; a city needs a commercial inspection organ, whose supervision is joined to the masses''. The free market in the villages is to be given up, but not left unmanaged: it breeds some capitalism, bourgeois elements and some rogues, even some underground factories; do not fear them, for what they make is what the people need, and shows our lack; having seen the gaps they go at it, and that makes up for our gaps.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 542–543 (Oct. 19, 1961). Made public: 1996. Names: Liu Shaoqi, Li Xiannian.'
    tags: [polity:prc, name:liu-shaoqi, name:li-xiannian, vis:only:prc]
