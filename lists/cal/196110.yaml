  - id: cal.1961-10-05.cuba-2
    when: Oct. 5
    date: '1961-10-05'
    thread: cuba
    c: 'Parrott, secretary of the Special Group, to the Deputy Assistant Secretary for Latin American Affairs: "what was wanted was a plan against the contingency that Castro would in some way or other be removed from the Cuban scene"; "the presence and positions of Raul (Castro) and Che Guevara must be taken into account." Taylor, by Parrott, preferred "the President''s interest in the matter not be mentioned." Parrott asks Barnes of the CIA for an up-to-date report on "what is going on and what is being planned."'
    n: '[[w.sen-church-alleged-assassination-plots]], 136 (Parrott, memorandum for the record, Oct. 5, 1961; Parrott, 1975: removal by means "short of being killed," 137). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum for the Record, Parrott, Oct. 5, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 136). See [[cal.1961-10-05.cuba]]. Names: Castro, Raúl Castro, Guevara, Taylor, Barnes.'
