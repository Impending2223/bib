    c: 'Chicago, a motel. F. Clifton White and some two dozen conservative Republicans, most from the Young Republicans, meet in secret on the nomination of 1964: the South and the Midwest enough, without New York and New England. Goldwater their man. Check the number. Among them, by Rusher''s account, Rusher, Ashbrook, Ned Cushing, and three South Carolinians, Shorey, Roger Milliken and Robert F. Chapman.'
