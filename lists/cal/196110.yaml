    when: Oct.
    date: 1961-10
    thread: japan
    c: 'State''s draft guidelines on Japan, "our principal ally in the Far East": de-emphasize security, no pressure to arm, Ryukyus control only as needed. The Joint Chiefs, with ISA: control of the Ryukyus "indispensable"; Japan to arm more; nuclear storage at American bases. The final guidelines, March 1962, take the first two.'
