    c: 'The Oval Office, the afternoon after the press conference, Bundy there. Kennedy to Goodwin: "You know, Dick, maybe we''d be better off if you were in the State Department, closer to the action." Then, brushing it aside: "Hell ... if Dick goes over there, we''ll never hear anything about Latin America."'
