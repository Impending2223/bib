  - id: cal.1961-10-03.immigration
    when: Oct. 3–4
    date: '1961-10-03'
    thread: immigration
    also: [farm]
    c: 'Mexican farm labor program extended two years, to Dec. 31, 1963, [75 Stat. 761](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg761.pdf). Kennedy signs "despite its shortcomings": the program hurts the wages, working conditions and jobs of domestic farm workers; the Secretary of Labor to use his authority to protect them. The Senate had adopted McCarthy''s minimum wage for the Mexican workers, Sept. 11, [42–40](https://voteview.com/rollcall/RS0870181); his motion to table the conference report refused, Sept. 21, [34–40](https://voteview.com/rollcall/RS0870199); the report agreed to, Sept. 23, [41–31](https://voteview.com/rollcall/RS0870202).'
    n: 'Statute (K–J Cong. II.J.2). Statement by the President Upon Signing Bill Governing Recruitment of Mexican Agricultural Workers, [1961 Pub. Papers 639](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=697) (Oct. 4, 1961). H.R. 2010, 87th Cong. To check: [[w.craig-bracero-program]]; [[w.calavita-inside-the-state]]. Names: McCarthy.'
    tags: [name:kennedy-john-f, name:mccarthy-eugene-j]
    short: the braceros extended
  - id: cal.1961-10-03.vietnam
    when: Oct. 3
    date: '1961-10-03'
    thread: vietnam
    c: 'William Bundy''s planning group at lunch: Rostow, Bissell, Amory, Nitze and others. Vietnam: on the present basis "we were doing badly," the outcome unfavorable without a major change; talking directly to the Soviets "pretty unanimously rejected"; going to the UN a real possibility. The talk helps set off Rostow''s proposal of SEATO forces.'
    n: '[FRUS 1961–63, I, doc. 144](https://history.state.gov/historicaldocuments/frus1961-63v01/d144) (Bundy''s memorandum, Oct. 5). Made public: FRUS 1961–63, I (1988). [[w.bissell-reflections-of-a-cold]], 150 (the lunches; the talks with the Soviets rejected). See [[cal.1961-01-28.vietnam]]. Names: William Bundy, Rostow, Bissell, Amory, Nitze.'
    src:
      c: accf0cc3
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d144: all'
        - 'w.bissell-reflections-of-a-cold 150: A, C'
        - 'via w.bissell-reflections-of-a-cold 150 n.11a: A, C'
    tags: [name:bundy-william, name:rostow-walt-w, name:bissell-richard-m-jr, name:amory-robert-jr, name:nitze-paul]
