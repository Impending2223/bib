    n: 'White House Statement Concerning Soviet Plans To Test a 50-Megaton Bomb, [1961 Pub. Papers 674](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=732). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164–65 (the speech; the deadline dropped); [[w.poole-joint-chiefs-of-staff]], 157 (the deadline dropped, to the Party Congress); [[w.schulimson-joint-chiefs-of-staff]], 120 (the deadline dropped); [[w.fursenko-khrushchevs-cold-war]], 399–400 ("the Western powers were showing some understanding of the situation"); [[w.macfarquhar-origins-of-the-cultural]], III, 126 (the attack on the Albanians); [[w.yang-shangkun-riji]], II, 78 (Oct. 17, 1961; the opening; Khrushchev''s report raises Albania and the anti-Party group; Yang: its edge turned not on imperialism but inward, "shameful and strange"); [[w.friedman-shadow-cold-war]], 77, 87 (the congress opens Oct. 17; the ruling parties of Guinea, Ghana and Mali send delegations, the first noncommunist parties ever invited; Khrushchev''s opening attacks on Stalin and Albania, unanticipated, make the other speakers rewrite theirs and lead to the removal of Stalin''s body); [[w.guan-vietnamese-communists-relations-with]], 206 (Oct. 17–31; Khrushchev denounces Albania as the bastion of Stalinism). [[w.rusk-as-i-saw-it-1990]], 226 (the deadline withdrawn). To check: [[w.taubman-khrushchev]]; [*New York Times*, Oct. 18, 1961](https://timesmachine.nytimes.com/timesmachine/1961/10/18/issue.html), and *Current Digest of the Soviet Press*, Nov. 8, 1961, 5 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 165 n.93); [*New York Times*, Oct. 18, 1961](https://timesmachine.nytimes.com/timesmachine/1961/10/18/issue.html), at 1 (cited by [[w.poole-joint-chiefs-of-staff]], 157 n.68); [[w.sino-soviet-dispute]], 46–56, 177–205 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 126 n.41a); the Moscow declaration of 1957, in [[w.sino-soviet-dispute]], 46–56 (cited by [[w.macfarquhar-origins-of-the-cultura