  - id: cal.1961-10-04.laos
    when: Oct. 4
    date: '1961-10-04'
    thread: laos
    c: 'Field Goal''s reconnaissance resumes, on the Pathet Lao''s holdings along Route 13 and Vang Vieng''s airfield: twenty-six flights in October, above forty thousand feet at Brown''s insistence. Fired on, the flights are barred from the Plain of Jars and Xieng Khouangville without his leave; all surveillance of the Plain suspended Nov. 6–10.'
    n: '[[w.anthony-war-in-northern-laos]], 63. To check: History, PACAF, July–Dec. 1961 (cited by [[w.anthony-war-in-northern-laos]], 63 n.9a); ACS/Ops, PACAF, memorandum, "Altitude Restrictions on Reconnaissance Flights over Laos," in the trip book of Jan. 5, 1962, of Col. Richard A. Yudkin (cited by [[w.anthony-war-in-northern-laos]], 63 n.9b). See [[cal.1961-04-24.laos]]. Names: Brown.'
    src:
      c: dd90e714
      rows:
