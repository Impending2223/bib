    c: 'The White House, dinner alone with Kennedy and Jacqueline Kennedy, Schlesinger and his wife, by Schlesinger''s journal. Kennedy on Germany: Adenauer a great man, greater than de Gaulle, and the other Germans seem to him terrible; "They act as if they had been our allies." On Eisenhower: "too stupid to know what was going on"; Truman''s appointments excellent "except in the National Committee, the regulatory agencies and the Department of Justice." On the Metropolitan Club: he could understand newspapermen who stayed in, not senators, naming Symington and Pell, who spoke on civil rights and went there for dinner.'
