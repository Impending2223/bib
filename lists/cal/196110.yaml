        - 'w.kaplan-mcnamara-ascendancy-1961-1965 271: all'
        - 'w.futrell-united-states-air-force 74: C'
    tags: [name:taylor-maxwell, name:rostow-walt-w, name:ngo-dinh-diem, name:nolting-frederick-e-jr, place:saigon, place:mekong-delta]
  - id: cal.1961-10-21.defense
    when: Oct. 21
    date: '1961-10-21'
    thread: defense
    c: Gilpatric to the Business Council at Hot Springs, Va. The American second strike at least equal to any Soviet first strike. The missile gap reversed.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 162, 302. To check: [[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]. See [[cal.1961-02-06.defense]]. Names: Gilpatric.'
    tags: [name:gilpatric-roswell-l]
  - id: cal.1961-10-22.berlin-and-vienna
    when: Oct. 22
    date: '1961-10-22'
    thread: berlin-and-vienna
    c: Lightner, senior American diplomat in Berlin, stopped at Checkpoint Charlie. Clay sends armed escorts.
    n: '[FRUS 1961–63, XIV, doc. 186](https://history.state.gov/historicaldocuments/frus1961-63v14/d186). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 165. To check: [[w.kempe-berlin-1961]]; [[w.smith-lucius-d-clay]]. Names: Lightner, Clay.'
    tags: [name:lightner-e-allan-jr, name:clay-lucius-d]
  - id: cal.1961-10-26.europe-and-the-alliance-turkey
    when: Oct. 26
    date: '1961-10-26'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: The commanders having pressed the parties (Gursel President, the verdicts not exploited, no amnesty), the Turkish Assembly elects Gursel President.
    n: 'FRUS 1961–63, XVI, docs. [371](https://history.state.gov/historicaldocuments/frus1961-63v16/d371) (Hare, Oct. 24), [372](https://history.state.gov/historicaldocuments/frus1961-63v16/d372). See [[cal.1960-05-27.europe-and-the-alliance]]. Names: Gursel.'
    tags: [name:gursel-cemal]
  - id: cal.1961-10-26.economy
    when: Oct. 26
    date: '1961-10-26'
    thread: economy
    c: 'Statement to Cabinet officers and agency heads: "a most careful and frugal policy" on commitments and spending under the 1962 budget. The deficit, the recession''s, much smaller than fiscal 1959''s $12.4 billion. A balanced budget for fiscal 1963, barring extraordinary and unforeseen defense needs.'
    n: Statement by the President to Cabinet Officers and Agency Heads on the 1962 and 1963 Budget Outlook, [1961 Pub. Papers 681](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=739) (Oct. 26, 1961). [[w.stein-fiscal-revolution-in-america]], 403–04. See [[cal.1961-07-25.berlin-and-vienna]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-10-27.berlin-and-vienna
    when: Oct. 27–28
    date: '1961-10-27'
    thread: berlin-and-vienna
    also: [robert-kennedy]
    c: Soviet and American tanks face each other at Checkpoint Charlie. Sixteen hours. The Soviets pull back first, after Robert Kennedy's word through Bolshakov.
    n: 'FRUS 1961–63, XIV, docs. [195](https://history.state.gov/historicaldocuments/frus1961-63v14/d195), [196](https://history.state.gov/historicaldocuments/frus1961-63v14/d196). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 165–166; [[w.poole-joint-chiefs-of-staff]], 157. Check. To check: [[w.kempe-berlin-1961]]; [[w.fursenko-one-hell-of-a]]; [[w.garthoff-berlin-1961]]. Names: Robert F. Kennedy, Bolshakov.'
    tags: [name:kennedy-robert-f, name:bolshakov-georgi]
  - id: cal.1961-10-27.mississippi
    when: Oct. 27
    date: '1961-10-27'
    thread: mississippi
    also: [voting-rights]
    c: '*United States v. Wood*. The Fifth Circuit, Rives writing, Cameron dissenting, on the Government''s suit of Sept. 20 under the Civil Rights Act of 1957: the denial of a temporary restraining order appealable; 28 U.S.C. § 2283 no bar to the United States; unless the State agrees to put off Hardy''s trial, the district court to restrain it until the hearing on a preliminary injunction.'
    n: '*United States v. Wood*, [295 F.2d 772](https://static.case.law/f2d/295/case-pdfs/0772-01.pdf) (5th Cir. 1961). [[w.dittmer-local-people]], 108. See [[cal.1961-09-07.mississippi]]. Names: Cameron, Rives, Hardy.'
    tags: [state:ms, name:cameron-ben-f, name:rives-richard-t, name:hardy-john]
  - id: cal.1961-10-29.opinion
    when: Oct. 29
    date: '1961-10-29'
    thread: opinion
    also: [defense]
    c: 'Gallup, Sept. 21–26: 7 percent have made plans or given serious thought to preparing their homes against a nuclear attack.'
    n: '[[w.gallup-poll]], III, 1741.'
  - id: cal.1961-10-29.europe-and-the-alliance-turkey
    when: Oct. 29
    date: '1961-10-29'
    thread: europe-and-the-alliance-turkey
    c: Kennedy's message to Gursel on his election.
    n: 'Message to President Gursel Following His Election Under the New Turkish Constitution, [1961 Pub. Papers 687](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=745) (Oct. 29, 1961). See [[cal.1961-10-26.europe-and-the-alliance-turkey]]. Names: Kennedy, Gursel.'
    tags: [name:kennedy-john-f, name:gursel-cemal]
  - id: cal.1961-10-30.testing
    when: Oct. 30
    date: '1961-10-30'
    thread: testing
    c: Soviet test of about fifty megatons over Novaya Zemlya. The largest ever.
    n: White House Statement Announcing the Explosion by the U.S.S.R. of a 50-Megaton Bomb, [1961 Pub. Papers 690](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=748). See [[cal.1961-09-01.testing]].
  - id: cal.1961-10-31.soviet-union
    when: Oct. 31
    date: '1961-10-31'
    thread: soviet-union
    c: 'Twenty-Second Party Congress closes. The new Party Program adopted; Stalin''s body ordered out of the Lenin Mausoleum, removed that night. Through the Congress, Khrushchev''s attacks on Stalin''s crimes, the anti-party group and the Albanian leadership. State''s assessment to all posts, Nov. 8: Khrushchev''s primacy in the bloc reasserted; Albania a thinly veiled challenge to the Chinese.'
    n: 'FRUS 1961–63, V, doc. [127](https://history.state.gov/historicaldocuments/frus1961-63v05/d127). To check: [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]. See [[cal.1961-10-17.berlin-and-vienna]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1961-10.vietnam
    when: Oct.
    date: 1961-10
    thread: vietnam
    c: 'COSVN''s first plenum, enlarged: the strategic hamlets a danger to the revolution in the South; a "continuous offensive," political and armed, "limited offensives and uprisings" toward a general offensive and general uprising. Hanoi declines to go so far.'
    n: '[[w.asselin-hanois-road-to-the]], 110–13; [[w.nguyen-hanois-war]], 60 (the conference, early October). Made public: an English translation, "Draft of COSVN Resolution 1," in the Douglas Pike Collection (Asselin, 111 n.139; Check when taken). Check: Nguyen, 60, has the conference reaffirm Hanoi''s directives in a ten-point mission.'
