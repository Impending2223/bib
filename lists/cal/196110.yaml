    c: 'During the Congress Zhou Enlai exchanges views with Hồ Chí Minh and Kim Il Sung, stressing three principles for relations among brother parties: unity in the struggle against the enemy and mutual support; no interference in brother parties'' internal affairs; keeping internal unity, with internal matters settled inside and not shown to the enemy.'
