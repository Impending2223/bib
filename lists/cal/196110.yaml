  - id: cal.1961-10-05.crime-and-hijacking-maheu
    when: Oct. 5
    date: '1961-10-05'
    thread: crime-and-hijacking-maheu
    also: [robert-kennedy]
    c: Robert Kennedy, by the Justice Department's records, asks the "status" of the Maheu wiretap case, the first time in four months. The same day the Special Group asks for a plan on Castro's "possible removal."
    n: '[[w.thomas-robert-kennedy]], 157; [[w.sen-church-alleged-assassination-plots]], 128–29 (a Justice Department file entry of Oct. 6, 1961: "Yesterday P.M. told me that A.G. had inquired as to status of this case and think Harold [Shapiro] got it taken care of OK"; no other activity in the case from September 1961 through January 1962; for B see Variant). To check: Senate Select Committee, *Alleged Assassination Plots Involving Foreign Leaders: An Interim Report* (1975), 128–36 (cited by [[w.thomas-robert-kennedy]], 157). See [[cal.1961-10.cuba]]. Names: Robert Kennedy, Maheu, Castro.'
