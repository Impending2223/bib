    c: The steelworkers' October wage step. Prices hold.
    n: See [[cal.1961-09-06.steel]].
  - id: cal.1961-10-01.defense
    when: Oct. 1
    date: '1961-10-01'
    thread: defense
    c: Defense Intelligence Agency activated.
    n: '[DoD Directive 5105.21](https://nsarchive.gwu.edu/sites/default/files/documents/4172203/Document-04-Department-of-Defense-Directive-5105.pdf) (Aug. 1, 1961). See [[cal.1961-02-06.defense]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1961-10-01.civil-rights-organizations
    when: Oct. 1
    date: '1961-10-01'
    thread: civil-rights-organizations
    c: Whitney Young takes office as executive director of the National Urban League, the board's unanimous choice to succeed Lester Granger.
    n: '*Jet*, [Feb. 9, 1961](https://books.google.com/books?id=NrEDAAAAMBAJ&pg=PA5), "Whitney Young Succeeds Urban League''s Granger." [[w.dickerson-militant-mediator]]. To check: [[w.weiss-whitney-m-young-jr]]. Names: Young, Granger.'
    tags: [name:young-whitney-m-jr, name:granger-lester-b]
  - id: cal.1961-10-03.states-and-cities
    when: Oct. 3
    date: '1961-10-03'
    thread: state-constitutions
    c: Michigan's constitutional convention opens at Lansing. Romney a vice president.
    n: '[Michigan Constitutional Convention 1961, *Official Record*, I, 105–114](https://archive.org/details/officialrecordvolume1/page/n106/mode/1up). To check: [[w.sturm-constitution-making-in-michigan]]. See [[cal.1961-04-03.states-and-cities]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi]
  - id: cal.1961-10-03.immigration
    when: Oct. 3–4
    date: '1961-10-03'
    thread: immigration
    also: [farm]
    c: 'Mexican farm labor program extended two years, to Dec. 31, 1963, [75 Stat. 761](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg761.pdf). Kennedy signs "despite its shortcomings": the program hurts the wages, working conditions and jobs of domestic farm workers; the Secretary of Labor to use his authority to protect them. The Senate had adopted McCarthy''s minimum wage for the Mexican workers, Sept. 11, [42–40](https://voteview.com/rollcall/RS0870181); his motion to table the conference report refused, Sept. 21, [34–40](https://voteview.com/rollcall/RS0870199); the report agreed to, Sept. 23, [41–31](https://voteview.com/rollcall/RS0870202).'
    n: 'Statute (K–J Cong. II.J.2). Statement by the President Upon Signing Bill Governing Recruitment of Mexican Agricultural Workers, [1961 Pub. Papers 639](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=697) (Oct. 4, 1961). H.R. 2010, 87th Cong. To check: [[w.craig-bracero-program]]; [[w.calavita-inside-the-state]]. Names: McCarthy.'
    tags: [name:kennedy-john-f, name:mccarthy-eugene-j]
  - id: cal.1961-10-04.opinion-5
    when: Oct. 4
    date: '1961-10-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Aug. 24–29: Kennedy 62, Nixon 38.'
    n: '[[w.gallup-poll]], III, 1737. Names: Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1961-10-04.electoral-college
    when: Oct. 4
    date: '1961-10-04'
    thread: electoral-college
    also: [amendments, states-and-cities]
    c: 'The Twenty-third Amendment put into law: the District of Columbia Election Act amended, signed, [75 Stat. 817](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg817.pdf). The District''s voters to choose its electors. A party whose nominee has won the Presidency since Jan. 1, 1950, names its electors through the organization its national committee recognizes. The candidates'' names on the ballot, not the electors''.'
    n: Letter to the President of the Senate and to the Speaker of the House Transmitting Bill Implementing the 23d Amendment to the Constitution, [1961 Pub. Papers 378](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=436) (May 16, 1961). H.R. 8444, 87th Cong. See [[cal.1961-03-29.states-and-cities]].
    tags: [name:kennedy-john-f, state:dc, city:washington]
  - id: cal.1961-10-04.mississippi
    when: Oct. 4
    date: '1961-10-04'
    thread: mississippi
    also: [students]
    c: McComb. More than 100 students of Burgland High School walk out when two of the bus station's sit-in protesters, Brenda Travis and Ike Lewis, are refused readmission; they march to city hall to pray on its steps. A crowd beats Bob Zellner of SNCC, the one white marcher. Police arrest 116 students, Moses and McDew with them; the 97 under eighteen released.
    n: '[[w.dittmer-local-people]], 107, 110–11. See [[cal.1961-08.mississippi]]. Names: Moses, McDew, Brenda Travis, Lewis, Zellner.'
    tags: [state:ms, name:moses-robert-p, name:mcdew-charles, name:travis-brenda, name:lewis-ike, name:zellner-bob]
  - id: cal.1961-10-05.middle-east-syria
    when: Oct. 5
    date: '1961-10-05'
    thread: middle-east-syria
    c: Nasser will not oppose Syria's seat at the UN. The UAR had asked the United States to withhold recognition.
    n: 'FRUS 1961–63, XVII, docs. [117](https://history.state.gov/historicaldocuments/frus1961-63v17/d117) (Rusk, Oct. 2), [124](https://history.state.gov/historicaldocuments/frus1961-63v17/d124) (Rusk to Kennedy, Oct. 7). See [[cal.1961-09-28.middle-east]]. Names: Nasser.'
    tags: [name:nasser-gamal-abdel]
  - id: cal.1961-10-06.berlin-and-vienna
    when: Oct. 6
    date: '1961-10-06'
    thread: berlin-and-vienna
    c: Gromyko at the White House. Berlin; no movement.
    n: '[FRUS 1961–63, XIV, doc. 170](https://history.state.gov/historicaldocuments/frus1961-63v14/d170). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gromyko.'
    tags: [name:gromyko-andrei]
  - id: cal.1961-10-06.africa
    when: Oct. 6
    date: '1961-10-06'
    thread: africa
    c: 'NSAM 102, the bases in Morocco: Kennedy approves the State–Defense recommendations. Be ready to withdraw the forces by the end of 1963, as committed, while seeking every chance to keep the use of the facilities after; no important military plans to rest on keeping them. NSAM 34, Apr. 5, had asked the questions.'
    n: 'FRUS 1961–63, XXI, docs. [113](https://history.state.gov/historicaldocuments/frus1961-63v21/d113) (NSAM 34), [123](https://history.state.gov/historicaldocuments/frus1961-63v21/d123) (NSAM 102), [124](https://history.state.gov/historicaldocuments/frus1961-63v21/d124). To check: [[w.muehlenbeck-betting-on-the-africans]].'
    tags: [name:kennedy-john-f]
  - id: cal.1961-10-08.goldwater
    when: Oct. 8
    date: '1961-10-08'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. F. Clifton White and some two dozen conservative Republicans, most from the Young Republicans, meet in secret on the nomination of 1964: the South and the Midwest enough, without New York and New England. Goldwater their man. Check the number.'
    n: 'Made public: [[w.white-making-of-the-president-1965]], at the latest. Check. [[w.perlstein-before-the-storm]], 177–79 (the meeting), 179–80 (the strategy, at the next meeting, in December). To check: [[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]; [[w.middendorf-glorious-disaster]]; [[w.goldberg-barry-goldwater]]; [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]. Names: White, Goldwater. Check: Perlstein, 178, gives twenty-six invited and twenty-two present; Goldwater''s name not spoken, 179.'
    tags: [name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1961-10-09.court
    when: Oct. 9
    date: '1961-10-09'
    thread: court
    also: [legislatures]
    c: '*Baker v. Carr* reargued. Cox for the United States as amicus.'
    n: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962). See [[cal.1961-04-19.court]]. Names: Cox.'
    tags: [name:cox-archibald, state:tn]
  - id: cal.1961-10-10.european-community
    when: Oct. 10
    date: '1961-10-10'
    thread: european-community
    c: 'Paris. Heath opens Britain''s negotiations with the Six''s ministers: Britain to become a "full, whole-hearted and active" member; arrangements asked for the Commonwealth, British agriculture and the EFTA.'
    n: 'FRUS 1961–63, XIII, docs. [22](https://history.state.gov/historicaldocuments/frus1961-63v13/d22) (circular, Nov. 3, quoting Heath), [23](https://history.state.gov/historicaldocuments/frus1961-63v13/d23) (Ball and the EFTA''s Secretary General, Nov. 6). To check: [[w.ludlow-dealing-with-britain]]; [[w.heath-course-of-my-life]]. See [[cal.1961-07-31.european-community]]. Names: Heath.'
    tags: [name:heath-edward-r-g]
  - id: cal.1961-10-10.middle-east-syria
    when: Oct. 10
    date: '1961-10-10'
    thread: middle-east-syria
    c: The United States recognizes the Syrian Arab Republic.
    n: '[[w.department-of-state-bulletin]], [Oct. 30, 1961, 715](https://archive.org/details/departmentofstat4561unit/page/715/mode/1up). See [[cal.1961-09-28.middle-east]].'
  - id: cal.1961-10-11.vietnam
    when: Oct. 11
    date: '1961-10-11'
    thread: vietnam
    c: NSC defers the Joint Chiefs' troop plan for Laos and Vietnam. Taylor to Saigon instead; announced at the press conference.
    n: '[NSAM No. 104](https://history.state.gov/historicaldocuments/frus1961-63v01/d162) (Oct. 13, 1961). FRUS 1961–63, I, doc. [162](https://history.state.gov/historicaldocuments/frus1961-63v01/d162). [[w.miller-misalliance]], 227–28; [[w.gibbons-u-s-government-and]], II, 66–71; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 270; [[w.schulimson-joint-chiefs-of-staff]], 212. To check: [[w.kaiser-american-tragedy]]; [[w.taylor-swords-and-plowshares]]. See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow.'
    tags: [name:taylor-maxwell, name:kennedy-john-f, name:rostow-walt-w]
  - id: cal.1961-10-13.peace-corps
    when: Oct. 13
    date: '1961-10-13'
    thread: peace-corps
    also: [africa]
    c: A volunteer's postcard from Ibadan, describing squalor, found and published. Protests at the university; she goes home. Check the date it was found.
    n: 'To check: [[w.hoffman-all-you-need-is]]. See [[cal.1961-03-01.peace-corps]].'
  - id: cal.1961-10-15.opinion
    when: Oct. 15
    date: '1961-10-15'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, Sept. 21–26: fight the way into Berlin if access is closed, 70 percent; not, 18. Satisfied with the government''s handling, 61; dissatisfied, 20.'
    n: '[[w.gallup-poll]], III, 1738.'
  - id: cal.1961-10-15.europe-and-the-alliance
    when: Oct. 15
    date: '1961-10-15'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: 'Turkey. Elections under the constitution approved July 9: the Republican People''s Party 36.7 percent, 173 seats; the Democrats'' heirs, the Justice and New Turkey parties, 34.8 percent and 158, 13.7 percent and 65.'
    n: 'FRUS 1961–63, XVI, doc. [367](https://history.state.gov/historicaldocuments/frus1961-63v16/d367) (editorial note: the constitution). See [[cal.1960-05-27.europe-and-the-alliance]].'
  - id: cal.1961-10-16.right-and-the-military
    when: Oct. 16
    date: '1961-10-16'
    thread: right-and-the-military
    c: Schwarz's Christian Anti-Communism Crusade fills the Hollywood Bowl, televised.
    n: 'To check: [[w.mcgirr-suburban-warriors]]; [[w.hendershot-whats-fair-on-the]]. See [[cal.1961-03.right-and-the-military]]. Names: Schwarz.'
    tags: [name:schwarz-fred]
  - id: cal.1961-10-16.middle-east-syria
    when: Oct. 16
    date: '1961-10-16'
    thread: middle-east-syria
    c: 'NSAM 105: what policy now toward Egypt and Syria; may Nasser''s loss turn him inward, to development and American aid?'
    n: 'FRUS 1961–63, XVII, docs. [128](https://history.state.gov/historicaldocuments/frus1961-63v17/d128), [229](https://history.state.gov/historicaldocuments/frus1961-63v17/d229) (Talbot, Mar. 30, 1962). See [[cal.1961-09-28.middle-east]]. Names: Nasser.'
    tags: [name:nasser-gamal-abdel, name:kennedy-john-f]
  - id: cal.1961-10-16.soviet-union
    when: Oct. 16
    date: '1961-10-16'
    thread: soviet-union
    also: [berlin-and-vienna, laos]
    c: 'Kennedy''s reply to Khrushchev''s private letter: a settlement in Laos would ease the way on Berlin; the attacks on South Vietnam from Laotian territory a grave threat.'
    n: 'FRUS 1961–63, VI, doc. [22](https://history.state.gov/historicaldocuments/frus1961-63v06/d22); V, doc. [125](https://history.state.gov/historicaldocuments/frus1961-63v05/d125). See [[cal.1961-09-29.soviet-union]]. Names: Kennedy, Khrushchev.'
    tags: [name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1961-10-16.king
    when: Oct. 16
    date: '1961-10-16'
    thread: king
    also: [civil-rights-the-executive]
    c: 'King with Robert Kennedy, then an hour with the President. He asks a "Second Emancipation Proclamation," an order declaring segregation illegal under the Fourteenth Amendment, and the housing order promised in the campaign. Kennedy: a written case for the proclamation welcome; Congress not ready for a bill or the housing order; the ICC''s order in force in two weeks. A tour of the family''s rooms with Mrs. Kennedy after.'
    n: '[[w.garrow-bearing-the-cross]], 169–70. To check: Wofford to O''Donnell, June 12 and Oct. 4, 1961, WHCF 358 (Kennedy Library), as Garrow cites them (659 n.40). Names: King, Robert F. Kennedy, Kennedy, Jacqueline Kennedy.'
    tags: [name:king-martin-luther-jr, name:kennedy-robert-f, name:kennedy-john-f, name:kennedy-jacqueline]
  - id: cal.1961-10-17.berlin-and-vienna
    when: Oct. 17
    date: '1961-10-17'
    thread: berlin-and-vienna
    also: [testing, soviet-union]
    c: Twenty-Second Party Congress opens. Khrushchev drops the year-end deadline for a German treaty; announces a fifty-megaton test.
    n: 'White House Statement Concerning Soviet Plans To Test a 50-Megaton Bomb, [1961 Pub. Papers 674](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=732). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 164; [[w.poole-joint-chiefs-of-staff]], 157 (the deadline dropped); [[w.schulimson-joint-chiefs-of-staff]], 120. To check: [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1961-10-17.european-community
    when: Oct. 17
    date: '1961-10-17'
    thread: european-community
    c: 'Ball to Bruce: the British seem not to take seriously the American view that the Commonwealth preferences must in the end go.'
    n: 'FRUS 1961–63, XIII, doc. [19](https://history.state.gov/historicaldocuments/frus1961-63v13/d19). See [[cal.1961-10-10.european-community]]. Names: Ball, Bruce.'
    tags: [name:ball-george-w, name:bruce-david-k-e]
  - id: cal.1961-10-18.vietnam
    when: Oct. 18
    date: '1961-10-18'
    thread: vietnam
    c: Taylor and Rostow in Saigon. Diệm declares a state of emergency. Mekong floods.
    n: '[FRUS 1961–63, I, doc. 174](https://history.state.gov/historicaldocuments/frus1961-63v01/d174). [[w.pentagon-papers]] (Gravel ed.), vol. 2. [[w.miller-misalliance]], 228; [[w.gibbons-u-s-government-and]], II, 72; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 271; [[w.futrell-united-states-air-force]], 74 (the floods). To check: [[w.newman-jfk-and-vietnam]]. See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow, Ngô Đình Diệm, Nolting.'
    src:
      c: 9669d4d3
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d174: all'
        - 'w.miller-misalliance 228: all'
