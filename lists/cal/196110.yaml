    c: 'Press conference. Kennedy, asked of the "criticism of our handling of inter-American affairs" caused by "advisers in the White House duplicating and sometimes overriding people in the State Department": "when things are noncontroversial, beautifully coordinated, and all the rest, it may be that there is not much going on. ... So we are attempting to do something about Latin America, and there is bound to be a ferment."'
