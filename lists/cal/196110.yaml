  - id: cal.1961-10-05.intelligence
    when: Oct. 5
    date: '1961-10-05'
    thread: intelligence
    also: [vietnam]
    c: 'Sherman Kent of the CIA sends Rostow an intelligence summary: the "Communist Bloc probably views the guerrilla and subversive campaigns in Laos and South Vietnam as two parts of a single broad political-military strategy, and of the two, considers South Vietnam as the more significant prize."'
    n: '[[w.preston-war-council]], 90. To check: CIA Special National Intelligence Estimate, Oct. 5, 1961, and Kent to Rostow, Oct. 5, 1961, NSF, Country File, Vietnam, box 194, Kennedy Library (cited by [[w.preston-war-council]], 90 n.43). Names: Rostow.'
