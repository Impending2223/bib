  - id: cal.1961-10-05.middle-east-syria
    when: Oct. 5
    date: '1961-10-05'
    thread: middle-east-syria
    c: Nasser will not oppose Syria's seat at the UN. The UAR had asked the United States to withhold recognition.
    n: 'FRUS 1961–63, XVII, docs. [117](https://history.state.gov/historicaldocuments/frus1961-63v17/d117) (Rusk, Oct. 2), [124](https://history.state.gov/historicaldocuments/frus1961-63v17/d124) (Rusk to Kennedy, Oct. 7). See [[cal.1961-09-28.middle-east]]. Names: Nasser.'
    tags: [name:nasser-gamal-abdel]
  - id: cal.1961-10-05.vietnam
    when: Oct. 5
    date: '1961-10-05'
    thread: vietnam
    also: [laos]
    c: 'Rostow to Kennedy: direct word to the Soviets that subversion in South Vietnam must stop; the case against Hanoi made public; American and allied troops on the South''s borders. "For us the gut issue as I see it is this: We are deeply committed in Viet-Nam; if the situation deteriorates, we will have to go in; the situation is, in fact, actively deteriorating; if we go in now, the costs human and otherwise are likely to be less than if we wait."'
    n: '[FRUS 1961–63, XXIV, doc. 195](https://history.state.gov/historicaldocuments/frus1961-63v24/d195). [[w.preston-war-council]], 87–88. Names: Rostow, Kennedy.'
