list: cal
section: VIII
entries:
  - id: cal.1960-07-05.state-constitutions-ok
    when: July 5
    date: '1960-07-05'
    thread: state-constitutions
    also: [electoral-college]
    c: Oklahoma, with the primary, votes on three amendments. Presidential electors may be nominated at party conventions, adopted, 220,575 to 172,219. Legislators' pay of $200 a month refused, 156,723 to 236,438. A county levy for health departments adopted, 201,218 to 193,497.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 16–17](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=16). [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]].'
    tags: [state:ok]
  - id: cal.1960-07-06.cuba-2
    when: July 6
    date: '1960-07-06'
    thread: cuba
    c: 'Sugar Act extended a year, [74 Stat. 330](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg330-2.pdf), the President given Cuba''s quota to fix. Eisenhower signs and proclaims the cut: 700,000 short tons, the rest of Cuba''s 1960 quota but 39,752. Havana''s Law 851 the same day: American property may be nationalized.'
    n: '[Statement by the President Upon Signing Bill and Proclamation Relating to the Cuban Sugar Quota](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-and-proclamation-relating-the-cuban-sugar-quota); [Proclamation 3355](https://www.presidency.ucsb.edu/documents/proclamation-3355-determination-cuban-sugar-quota), [25 Fed. Reg. 6414](https://www.govinfo.gov/app/details/FR-1960-07-08). Senate, July 2: the President''s resolution, [84–0](https://voteview.com/rollcall/RS0860384); July 3, the conference report, [32–24](https://voteview.com/rollcall/RS0860387). FRUS 1958–60, VI, docs. [543](https://history.state.gov/historicaldocuments/frus1958-60v06/d543), [544](https://history.state.gov/historicaldocuments/frus1958-60v06/d544) (the meeting with the President, July 6). [[w.paterson-contesting-castro]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.morley-imperial-state-and-revolution]]; [[w.schoultz-that-infernal-little-cuban]]; [[w.leogrande-back-channel-to-cuba]]; [[w.fursenko-one-hell-of-a]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-07-09.cuba
    when: July 9
    date: '1960-07-09'
    thread: cuba
    also: [soviet-union]
    c: 'Khrushchev, in Moscow: "Soviet artillerymen can support the Cuban people with their rocket fire" if the Pentagon intervenes. Eisenhower, at Newport, R.I.: the United States will not "permit the establishment of a regime dominated by international Communism in the Western Hemisphere."'
    n: '[Statement by the President Concerning Premier Khrushchev''s Announcement of Support for the Castro Regime in Cuba](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-premier-khrushchevs-announcement-support-for-the-castro). [FRUS 1958–60, VI, doc. 549](https://history.state.gov/historicaldocuments/frus1958-60v06/d549), quoting Khrushchev to the All-Russian Teachers'' Congress. See [[cal.1960-07-06.cuba-2]]. Names: Khrushchev, Eisenhower.'
    tags: [name:khrushchev-nikita-s, name:eisenhower-dwight-d]
  - id: cal.1960-07-11.congo
    when: July 11–14
    date: '1960-07-11'
    thread: congo
    c: 'Tshombe declares Katanga independent, July 11. The Congo''s cabinet asks for American troops, July 12; Eisenhower declines and points to the UN. Kasavubu and Lumumba appeal to the UN. Security Council, July 13–14: a UN force for the Congo, Belgium to withdraw its troops; 8–0, China, France, Britain abstaining.'
    n: '[S.C. Res. 143](https://docs.un.org/S/RES/143%281960%29). FRUS 1958–60, XIV, docs. [116](https://history.state.gov/historicaldocuments/frus1958-60v14/d116) (Timberlake on the request), [117](https://history.state.gov/historicaldocuments/frus1958-60v14/d117) (Eisenhower and Herter), [122](https://history.state.gov/historicaldocuments/frus1958-60v14/d122) (the instructions to Lodge). See [[cal.1960-06-30.congo]]. Names: Tshombe, Kasavubu, Lumumba, Eisenhower.'
    tags: [name:tshombe-moise, name:kasavubu-joseph, name:lumumba-patrice, name:eisenhower-dwight-d]
  - id: cal.1960-07-11.elections-1960
    when: July 11
    date: '1960-07-11'
    thread: elections-1960
    c: 'Democratic National Convention opens, Los Angeles, at the Memorial Sports Arena. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 404–405. See [[cal.1960-03-08.elections-1960]].
    tags: [primaries:1960-D]
  - id: cal.1960-07-11.latin-america
    when: July 11
    date: '1960-07-11'
    thread: latin-america
    c: 'Eisenhower, at Newport, R.I.: a new program for Latin America. Land, housing, schools, public health; funds to be asked of Congress; the plan to the economic conference at Bogotá in September.'
    n: '[The President''s News Conference at Newport, Rhode Island](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-newport-rhode-island) (July 11, 1960). [FRUS 1958–60, VI, doc. 550](https://history.state.gov/historicaldocuments/frus1958-60v06/d550), on its drafting. [[w.rabe-eisenhower-and-latin-america]]; [[w.taffet-foreign-aid-as-foreign]]; [[w.levinson-alliance-that-lost-its]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-07-11.soviet-union
    when: July 11–26
    date: '1960-07-11'
    thread: soviet-union
    c: 'Soviet note, July 11: an RB-47 shot down July 1 in Soviet airspace over the Barents Sea; two of its six crew alive and held, Captains Olmstead and McKone. American note, July 12: the plane never nearer than about 30 miles. Eisenhower agrees to the Council''s hearing, July 13. Security Council, July 26: the Soviet complaint rejected, 2–9; the American resolution for an inquiry, and an Italian one for the Red Cross, vetoed.'
    n: '[Statement by the President on the Downing of an RB-47 Plane by the U.S.S.R](https://www.presidency.ucsb.edu/documents/statement-the-president-the-downing-rb-47-plane-the-ussr) (July 13); [Telegram to Senator Mansfield](https://www.presidency.ucsb.edu/documents/telegram-senator-mansfield-welcoming-security-council-discussion-the-rb-47-plane-incident). FRUS 1958–60, X, pt. 1, docs. [157](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d157) (the notes, the Council), [158](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d158), [159](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d159), [161](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d161). [[w.beschloss-mayday]]; [[w.beschloss-crisis-years]], on the fliers'' release, Jan. 1961; [[w.taubman-khrushchev]]. Names: Eisenhower, Olmstead, McKone.'
    tags: [name:eisenhower-dwight-d, name:olmstead-freeman-b, name:mckone-john-r]
  - id: cal.1960-07-12.elections-1960
    when: July 12
    date: '1960-07-12'
    thread: elections-1960
    also: [medicare]
    c: Democratic platform adopted, the civil rights plank as written; the South's minority report refused. "The peaceful demonstrations for first-class citizenship" a signal. Medical care for the aged "as part of the time-tested Social Security insurance system." Growth at 5 percent a year.
    n: '[1960 Democratic Party Platform](https://www.presidency.ucsb.edu/documents/1960-democratic-party-platform). The convention: [[w.white-making-of-the-president]]; [[w.mailer-superman-comes-to-the]]; [[w.pietrusza-1960]]; [[w.rorabaugh-real-making-of-the]]; [[w.kallina-kennedy-v-nixon]]; [[w.donaldson-first-modern-campaign]]; [[w.casey-making-of-a-catholic]]; [[w.caro-passage-of-power]]; [[w.dallek-lone-star-rising]]; [[w.schlesinger-robert-kennedy-and-his]]; [[w.sorensen-kennedy]]; [[w.odonnell-johnny-we-hardly-knew]]. Check the minority report''s vote.'
  - id: cal.1960-07-13.elections-1960
    when: July 13
    date: '1960-07-13'
    thread: elections-1960
    c: 'Kennedy nominated on the first ballot, Wyoming''s votes putting him over: Kennedy 806, Johnson 409, Symington 86, Stevenson 79½. 761 needed.'
    n: 'See [[cal.1960-07-12.elections-1960]]. Names: Kennedy, Johnson, Symington, Stevenson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:stevenson-adlai-e, name:symington-william-s]
  - id: cal.1960-07-14.elections-1960
    when: July 14
    date: '1960-07-14'
    thread: elections-1960
    also: [robert-kennedy]
    c: Kennedy offers Johnson second place; Robert Kennedy to Johnson's suite that afternoon; the accounts of what he said differ. Johnson nominated by acclamation that night, the rules suspended over shouts from the galleries.
    n: '[[w.caro-passage-of-power]] and [[w.shesol-mutual-contempt]], on the accounts of the day; [[w.white-making-of-the-president]]. See [[cal.1960-07-12.elections-1960]]. Names: Kennedy, Johnson, Robert Kennedy.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:kennedy-robert-f]
  - id: cal.1960-07-14.immigration
    when: July 14
    date: '1960-07-14'
    thread: immigration
    c: 'Refugee resolution signed, [74 Stat. 504](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg504.pdf): the Attorney General may parole refugee-escapees, a fourth as many as other countries resettle. Either House may end the power by resolution; Eisenhower doubts that part constitutional.'
    n: '[Statement by the President Upon Signing Bill Providing for the Admission of Refugees](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-providing-for-the-admission-refugees). H.J. Res. 397, 86th Cong. [[w.loescher-calculated-kindness]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-07-14.japan-and-korea
    when: July 14–19
    date: '1960-07-14'
    thread: japan-and-korea
    c: Kishi stabbed at the Prime Minister's residence, July 14, the day the Liberal Democrats choose Ikeda to succeed him. Ikeda Prime Minister, July 19.
    n: '[Exchange of Messages Between the President and Prime Minister Ikeda of Japan](https://www.presidency.ucsb.edu/documents/exchange-messages-between-the-president-and-prime-minister-ikeda-japan) (Aug. 4). FRUS 1958–60, XVIII, docs. [192](https://history.state.gov/historicaldocuments/frus1958-60v18/d192), [193](https://history.state.gov/historicaldocuments/frus1958-60v18/d193). [[w.kapur-japan-at-the-crossroads]]. See [[cal.1960-01-19.japan-and-korea]]. Names: Kishi, Ikeda.'
    tags: [name:kishi-nobusuke, name:ikeda-hayato]
  - id: cal.1960-07-15.elections-1960
    when: July 15
    date: '1960-07-15'
    thread: elections-1960
    c: 'Kennedy accepts at the Memorial Coliseum: "the New Frontier of which I speak is not a set of promises—it is a set of challenges." On his religion: no "religious pressure or obligation." Johnson accepts the same evening.'
    n: '[Address Accepting the Democratic Nomination for President](https://www.presidency.ucsb.edu/documents/address-accepting-the-democratic-nomination-for-president-the-memorial-coliseum-los); [Address of Senator Lyndon B. Johnson Accepting the Democratic Party Nomination for the Vice Presidency](https://www.presidency.ucsb.edu/documents/address-senator-lyndon-b-johnson-accepting-the-democratic-party-nomination-for-the-vice). See [[cal.1960-07-12.elections-1960]]. Names: Kennedy, Johnson.'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b]
  - id: cal.1960-07-20.defense
    when: July 20
    date: '1960-07-20'
    thread: defense
    c: 'The *George Washington*, submerged off Cape Canaveral, Fla., fires two Polaris missiles: the first launched from under water. To the President: "Polaris—from out of the deep to target. Perfect."'
    n: '[Special Message to the Congress Upon Its Reconvening](https://www.presidency.ucsb.edu/documents/special-message-the-congress-upon-its-reconvening) (Aug. 8): five more submarines begun, a longer-range missile ordered. [[w.sapolsky-polaris-system-development]]; [[w.roman-eisenhower-and-the-missile]]; [[w.rosenberg-origins-of-overkill]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-07-20.economy
    when: July 20
    date: '1960-07-20'
    thread: economy
    c: 'Fiscal 1960 closes with a surplus of $1.1 billion: receipts $78.4 billion, expenditures $77.3 billion. Fiscal 1959''s deficit near $12.5 billion.'
    n: '[Statement by the President on the Budget Surplus for Fiscal Year 1960](https://www.presidency.ucsb.edu/documents/statement-the-president-the-budget-surplus-for-fiscal-year-1960). [[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]]; [[w.sundquist-politics-and-policy]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-07-22.elections-1960
    when: July 22–23
    date: '1960-07-22'
    thread: elections-1960
    also: [goldwater]
    c: 'Nixon flies to New York to see Rockefeller at his Fifth Avenue apartment, the night of July 22. Their statement, July 23, fourteen points: the platform''s civil rights and defense planks redrawn in Chicago. Goldwater: "the Munich of the Republican Party."'
    n: 'The convention: [[w.white-making-of-the-president]]; [[w.smith-on-his-own-terms]]; [[w.persico-imperial-rockefeller]]; [[w.kabaservice-rule-and-ruin]]; [[w.perlstein-before-the-storm]]; [[w.gifford-center-cannot-hold]]; [[w.pietrusza-1960]]; [[w.kallina-kennedy-v-nixon]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]; [[w.nixon-six-crises]]. Names: Nixon, Rockefeller, Goldwater.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1960-07-23.elections-1960
    when: July 23
    date: '1960-07-23'
    thread: elections-1960
    c: Dulles briefs Kennedy at Hyannis Port, on Eisenhower's offer of July 18 to both candidates of the Democratic ticket.
    n: '[Telegrams to Senators Kennedy and Johnson Offering Them Briefings by the Central Intelligence Agency](https://www.presidency.ucsb.edu/documents/telegrams-senators-kennedy-and-johnson-offering-them-briefings-the-central-intelligence) (July 18). [[w.helgerson-getting-to-know-the]]. Names: Dulles, Kennedy, Eisenhower.'
    tags: [name:dulles-allen-w, name:kennedy-john-f, name:eisenhower-dwight-d, name:johnson-lyndon-b]
  - id: cal.1960-07-25.elections-1960
    when: July 25
    date: '1960-07-25'
    thread: elections-1960
    c: 'Republican National Convention opens, Chicago, at the International Amphitheatre. The party''s primaries: map and returns below.'
    n: CQ Guide 6th (2010) 404–405. See [[cal.1960-03-08.elections-1960]].
    tags: [primaries:1960-R]
  - id: cal.1960-07-25.sit-ins
    when: July 25
    date: '1960-07-25'
    thread: sit-ins
    c: Greensboro's Woolworth's serves Negroes at its lunch counter, its own Negro employees the first.
    n: '[[w.chafe-civilities-and-civil-rights]]. See [[cal.1960-02-01.sit-ins]].'
  - id: cal.1960-07-26.elections-1960
    when: July 26–27
    date: '1960-07-26'
    thread: elections-1960
    also: [goldwater]
    c: 'Eisenhower addresses the convention, July 26. July 27, the platform adopted; Goldwater withdraws his name: "Let''s grow up, conservatives, if we want to take this party back." Nixon nominated, 1,321 to Goldwater''s 10.'
    n: '[Address at the Republican National Convention in Chicago](https://www.presidency.ucsb.edu/documents/address-the-republican-national-convention-chicago) (July 26); [Republican Party Platform of 1960](https://www.presidency.ucsb.edu/documents/republican-party-platform-1960). [[w.goldberg-barry-goldwater]]; [[w.goldwater-with-no-apologies]]. See [[cal.1960-07-22.elections-1960]]. Names: Eisenhower, Nixon, Goldwater.'
    tags: [name:eisenhower-dwight-d, name:goldwater-barry-m, name:nixon-richard-m]
  - id: cal.1960-07-26.state-constitutions-ok
    when: July 26
    date: '1960-07-26'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: Oklahoma, with the runoff primary, adopts two amendments. A State Industrial Finance Authority, with up to $10 million in bonds for loans to local development agencies, 128,850 to 101,875. A county library levy, 114,294 to 113,671.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 19](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=19). See [[cal.1960-07-05.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1960-07-26.governors-ar
    when: July 26
    date: '1960-07-26'
    thread: governors
    also: [elections-1960]
    c: 'Arkansas, Democratic primary for governor: Faubus, for a fourth term, 238,997, 58.7 percent; Joe Hardin 66,499, 16.3; Bruce Bennett 58,400, 14.4; two others. No runoff.'
    n: 'Votes: [Ark. *Historical Report of the Secretary of State* (2018), p. 411](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=420). [[w.reed-faubus]]; [[w.faubus-down-from-the-hills]]. Names: Faubus, Hardin, Bennett.'
    tags: [state:ar, name:faubus-orval-e, name:hardin-joe-c, name:bennett-bruce]
  - id: cal.1960-07-27.congo
    when: July 27–29
    date: '1960-07-27'
    thread: congo
    c: 'Lumumba in Washington, at Blair House. Herter and Dillon receive him, July 27: aid through the UN, not apart from it. The Belgian ambassador protests the welcome, July 28. Eisenhower at Newport, R.I.; no meeting.'
    n: 'FRUS 1958–60, XIV, docs. [152](https://history.state.gov/historicaldocuments/frus1958-60v14/d152) (Herter and Lumumba), [153](https://history.state.gov/historicaldocuments/frus1958-60v14/d153) (Scheyven). [[w.kalb-congo-cables]]. See [[cal.1960-06-30.congo]]. Names: Lumumba, Herter, Eisenhower, Dillon.'
    tags: [name:lumumba-patrice, name:herter-christian-a, name:dillon-c-douglas, name:eisenhower-dwight-d]
  - id: cal.1960-07-28.elections-1960
    when: July 28
    date: '1960-07-28'
    thread: elections-1960
    c: 'Lodge nominated for Vice President. Nixon accepts: he will "carry this campaign into every one of the fifty states."'
    n: '[Address Accepting the Presidential Nomination at the Republican National Convention in Chicago](https://www.presidency.ucsb.edu/documents/address-accepting-the-presidential-nomination-the-republican-national-convention-chicago). [[w.lodge-as-it-was]]; [[w.nichter-last-brahmin]]. See [[cal.1960-07-22.elections-1960]]. Names: Lodge, Nixon.'
    tags: [name:lodge-henry-cabot, name:nixon-richard-m]
