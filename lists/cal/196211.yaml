  - id: cal.1962-11-21.soviet-union-leadership
    when: Nov. 21
    date: '1962-11-21'
    place: moscow
    thread: soviet-union-leadership
    also: [missile-crisis-settlement]
    follows:
      - cal.1962-11-21.laos
    part_of: cal.1962-11-21.soviet-union-leadership-2
    c: 'The Presidium, the same session as Laos, by vote, approves Khrushchev''s message to Mikoyan in Havana: Kennedy kept his word, the quarantine lifted; the crisis to be taken as past, no invasion to be expected for years. Mikoyan free to leave, by New York, to see Kuznetsov, Zorin, U Thant, McCloy and Stevenson; a visit to Washington useful. "Кубинская операция ... принесла свои плоды" (the Cuban operation bore fruit): socialism in Cuba "легализовано" (legalized); "мы его только перевезли" (we only moved) the weapons.'
    n: 'P 68/II. [[w.prezidium-tsk-kpss-1954]], III, 399–403 (doc. 272.1 and the draft, Gromyko''s; for: Brezhnev, Voronov, Kirilenko, Kozlov, Kosygin, Podgorny, Polyansky, Suslov, Khrushchev, 399 n.г; the telegram sent Nov. 21, 399 n.е). Malin''s note of the session (I, 646), headed "пункт II" (item II), is on Laos: See [[cal.1962-11-21.laos]], [[cal.1962-11-16.soviet-union]]. After [[cal.1962-11-21.laos|Laos]], in the order of Malin''s notes: on one leaf, the instructions to the ambassador in Laos, then "Va. Об указаниях т. Микояну" (on the instructions to Mikoyan), Gromyko reading, "Утвердить текст указаний" (approve the text); the item numbers pencilled in later, the "Va" over an earlier number (I, 646–47 and nn.в, а). Made public: 2008. Names: Khrushchev, Mikoyan, Kennedy, Kuznetsov, Zorin, U Thant, McCloy, Stevenson.'
    tags: [name:khrushchev-nikita-s, name:mikoyan-anastas, name:kennedy-john-f, name:kuznetsov-vasily-v, name:zorin-valerian, name:u-thant, name:mccloy-john-j, name:stevenson-adlai-e, polity:ussr, polity:cuba, polity:us]
