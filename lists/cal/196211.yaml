    also: [south-asia, china-mao-foreign]
    c: Mao revises Zhou Enlai's draft letters on the Sino-Indian boundary to Sukarno (China is sending Vice-Foreign Minister Huang Zhen to Jakarta to exchange views, as Sukarno wished, and hopes he will move India to match the statement of Nov. 21 and bring talks) and to Ne Win, Chairman of Burma's Revolutionary Council (the draft by another hand).{1} In Ne Win's he changes "precious" to "useful" and the sharp "the dangerous situation" to "the former situation," "a turn" to "a relaxation"; unilateral action by China alone will not wholly prevent renewed fighting or make a good air for talks.{2}
