    c: 'Afternoon.{1} Mao Zedong reads in *Cankao ziliao* that India''s Prime Minister and President spoke on Nov. 18 of a peaceful settlement.{2} His note: "突然大谈和平解决。送总理阅。请外交部研究一下，印度领导人过去几天，是否有过十八日这种论调" (suddenly a great deal of talk of a peaceful settlement. To the Premier to read. The Foreign Ministry to look into whether India''s leaders talked this way in the days before the 18th).{3}'
    n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("同一天下午"); [[w.jian-zhou-enlai]], 482 (Nov. 18; the President, Radhakrishnan, alone; Chen''s translation: "Why suddenly talk so loudly about a peaceful settlement? Please read this. The Foreign Ministry should study whether other Indian leaders have made similar comments in the past several days"). [[w.jianguo-yilai-mao-zedong]], XVI, 435–436 (Nov. 19, 1962; part one, Mao''s note "To the Premier to read," the Foreign Ministry to study whether India''s leaders had talked so in the past few days, dated 4 p.m. the 19th, signed "Mao"; part two, beside Nehru''s National Defense Volunteers'' Day speech and Radhakrishnan''s: "suddenly talking big of a peaceful settlement"; beside the Cairo *al-Gumhuriya*''s call for an unconditional cease-fire: "the Soviet line, but the last paragraph means to warn Nehru"; printed from the manuscript; notes 1–3); [[w.mao-zedong-zhuan]], V, ch. 71 n.3 (Nov. 19: Mao sees in *Cankao ziliao* no. 5406 that India''s prime minister and president on Nov. 18 spoke for a peaceful settlement; his note "突然大谈和平解决" (suddenly they talk peace) for Zhou Enlai and the Foreign Ministry). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 71). Check: the Wengao dates the note 4 p.m. Nov. 19 (XVI, 435), against Chen''s Nov. 18. To check: Mao''s note on *Cankao ziliao*, no. 5406, manuscript, Nov. 19, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.3); [[w.zedong-mao-zedong-nianpu]], V, 169 (cited by [[w.jian-zhou-enlai]], 482 n.84); Xinhua, Cankao ziliao no. 5406, Nov. 19, 1962, with Nehru''s speech on National Defense Volunteers'' Day, Radhakrishnan''s speech, and al-Gumhuriya''s call for an unconditional Sino-Indian cease-fire (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 436 n.1); Mao Zedong 毛泽东, comment on *Cankao ziliao* 《参考资料》 no. 5406 (manuscript 手稿), Nov. 19, 1962: "suddenly a great deal of talk of a peaceful settlement" (cited by [[w.ma