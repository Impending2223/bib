  - id: cal.1962-11-06.elections-1962
    when: Nov. 6
    date: '1962-11-06'
    thread: elections-1962
    c: Midterms. Democrats lose a few House seats, gain in the Senate. Brown beats Nixon. Romney, Scranton, Rockefeller elected governor; Edward Kennedy, McGovern, Bayh to the Senate.
    n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). [[w.sorensen-kennedy]], 354 (the House and Senate results). See [[cal.1962-05-05.elections-1962]]. Names: Brown, Nixon, Romney, Scranton, Rockefeller, Edward M. Kennedy, McGovern, Bayh.'
