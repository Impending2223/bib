    c: 'Liu Shaoqi presides at the Politburo briefing and hears Li Fuchun and Li Xiannian on the national planning conference.{1} The spirit of the May conference is to go on being carried out; capital construction is still to come down where it can and the town population to go on being cut, or the Center will be put in a very passive position. Next year''s plan may be on the large side; not to be made big at once and then adjusted again. For two years great effort turned the situation; not to turn it again, which would not do, wasting time and bringing hardship to the people and loss to the state: better a tight, smaller plan now.{2}'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 566 (Nov. 27, 1962); [[w.yang-shangkun-riji]], II, 228 (Nov. 27, 1962; 3:30 to 6:30 p.m., Li Fuchun on the planning conference; Liu Shaoqi not named); [[w.deng-xiaoping-nianpu-1904]], III, 1734 (Nov. 27, 1962; Deng at the Politburo, Liu presiding; Li Fuchun and Li Xiannian on the national planning conference); [[w.zhu-de-nianpu-xinbian]], III, 1854 (Nov. 27, 1962; Zhu De 朱德 at the Politburo''s briefing 中共中央政治局汇报会, which hears Li Fuchun 李富春 and Li Xiannian 李先念 on the national planning conference). Made public: 1996. Names: Liu Shaoqi, Li Fuchun, Li Xiannian. Check: whether the same meeting as Zhou Enlai''s at the Secretariat, Nov. 26–27, hearing Li Fuchun and Li Xiannian ([[cal.1962-11-26.china-leadership]]).'
