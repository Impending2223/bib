    c: 'Midnight.{1} The Chinese government''s statement: India still refuses the three proposals of Oct. 24 and widens the clashes;{2} China will act first.{3} From midnight Nov. 22 its frontier forces cease fire along the whole border; from Dec. 1 they withdraw 20 kilometers behind the line of actual control of Nov. 7, 1959;{4} checkposts with some civil police on China''s side of the line.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 21, 1962 (and Nov. 22: the cease-fire at midnight). [[w.zhou-enlai-nianpu-1949]], II, 514 (Nov. 21, 1962: the statement at midnight, a cease-fire along the whole border from midnight Nov. 22 and a pullback of 20 kilometers behind the line of actual control from Dec. 1); [[w.lengxi-shinian-lunzhan-1956-1966]], 499 (Wu: India refusing, the Chinese government announces a unilateral cease-fire along the whole border from midnight, Nov. 22, and a withdrawal from Dec. 1 to the Chinese side of the line of actual control of Nov. 7, 1959, and 20 kilometers back from it); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 255 (Nov. 21, 1962; the Chinese government''s statement: from 00:00 on Nov. 22 the Chinese frontier troops cease fire on their own initiative along the whole boundary; from Dec. 1 they will withdraw 20 kilometers behind the line of actual control of Nov. 7, 1959 and set up checkposts on their own side of the line; the Foreign Ministry the same day sends the full text to the Indian and other countries'' embassies); [[w.macfarquhar-origins-of-the-cultural]], III, 311 (Beijing unilaterally proclaims a cease-fire and announces that its forces will soon start withdrawing from NEFA); [[w.yang-shangkun-riji]], II, 226–227 (Nov. 20, 1962; the Center announces on Nov. 20 a cease-fire along the whole Sino-Indian line from midnight; Nov. 21, the four news agencies carry the statement); [[w.jian-zhou-enlai]], 482 (Nov. 21: the troops to stop fighting from 12:00 a.m. Nov. 22 and from Dec. 1 to withdraw twenty kilometers behind the line of Nov. 7, 1959); [[w.zhu-de-nianpu-xinbian]], III, 1854 (Nov. 21, 1962; the government''s statement: the frontier forces to cease fire along the whole border from midnight of Nov. 22 and, from Dec. 1, to withdraw twenty kilometers behind the line of actual control). To check: the statement as printed in the *Renmin ribao*, Nov. 21, 1962; [[w.maxwell-indias-china-war]], 442–53 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 311 n.86a); [[w.palit-war-in-high-himalaya]], 88, 97 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 311 n.86b); [[w.galbraith-ambassadors-journal]], 378, 386–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 311 n.86c). See [[cal.1962-11-20.south-asia]].'
