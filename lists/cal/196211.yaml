    when: Nov. 2
    date: '1962-11-02'
    thread: china-zhou
    also: [china-agriculture]
    c: Zhou Enlai with the Ministry of Forestry on forestry, discussing the Central Committee's and State Council's draft decision to set up the Northeast general bureaus of forestry and of land reclamation. Cut by rule, cut and plant together, keep the green hills; no more free-handed destruction of nature; mechanization is the first question in the technical reform of forestry. On Nov. 18 he and Deng Xiaoping issue the two decisions.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 2, 1962). Made public: 1997. Names: Zhou Enlai, Deng Xiaoping.'
