  - id: cal.1962-11-06.governors
    when: Nov. 6
    date: '1962-11-06'
    thread: governors
    also: [elections-1962]
    c: 'Thirty-five governors elected: Democrats 21, Republicans 14; each party took seven States from the other. Brown (D) over Nixon in California; Rockefeller (R) re-elected in New York; Romney (R) over Governor Swainson in Michigan; Scranton (R) in Pennsylvania; Rhodes (R) over Governor DiSalle in Ohio; Bellmon (R), Oklahoma''s first Republican governor. Minnesota to a recount.'
    n: '[Wikipedia, "1962 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1962_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). To check: [[w.sabato-goodbye-to-good-time]]. See [[cal.1962-11-06.elections-1962]]. Names: Brown, Swainson, DiSalle, Nixon, Rockefeller, Romney, Scranton, Rhodes, Bellmon.'
    tags: [governors:1962-11-06, name:brown-edmund-g, name:nixon-richard-m, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:rhodes-james-a, name:bellmon-henry, name:swainson-john-b, name:disalle-michael-v]
  - id: cal.1962-11-06.alabama-al
    when: Nov. 6
    date: '1962-11-06'
    thread: alabama
    also: [elections-1962]
    c: 'Alabama. Hill (D) re-elected to the Senate over James D. Martin (R) of Gadsden, 201,937 to 195,134, 50.9 percent. Wallace elected governor without a Republican opponent. A constitutional amendment adopted, 138,211 to 32,212, 81.1 percent: a voter who moves within his county in the three months before an election may vote where he moved from.'
    n: '[*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963), 2. The amendment: *Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [783](https://archive.org/details/alabama-official-statistical-register-1963/page/n782) (Act No. 641, 1961). [[w.goldberg-barry-goldwater]], 166 (Martin, a "Goldwaterite," 49 percent, within 6,800 votes). To check: [[w.bartley-southern-politics-and-the]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]. See [[cal.1962-11-06.elections-1962]]. Names: Hill, Martin, Wallace.'
    src:
      c: a5bd877d
      rows:
        - 'https://clerk.house.gov/member_info/electionInfo/1962election.pdf: all'
        - 'https://archive.org/details/alabama-official-statistical-register-1963/page/n782: all'
        - 'w.goldberg-barry-goldwater 166: A'
    tags: [state:al, name:hill-lister, name:martin-james-d, name:wallace-george-c]
