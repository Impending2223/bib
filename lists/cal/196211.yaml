    thread: china-zhou
    c: 'Zhou Enlai at the Secretariat, Nov. 26 and 27, hearing Lu Dingyi, Li Fuchun and Li Xiannian.{1} Nov. 26, on the first Five-Year Plan''s education work: one should think coolly and not call it all few, slow, poor, costly and copied; some was, some was not; the whole plan is not to be denied.{2} On intellectuals: his report for the Center that most serve the working people is in line with the class view; Deng Xiaoping says the Premier''s report was approved by the Center.{3}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 26–27, 1962); [[w.macfarquhar-origins-of-the-cultural]], III, 280 (Lu Dingyi reports Mao''s view of the intellectuals'' class status, seemingly with approval; Zhou: he had stated Party policy; Deng backs him, tells Lu to get things straight, and says Mao agrees the propaganda conference''s proceedings are not to go out); [[w.yang-shangkun-riji]], II, 228 (Nov. 26, 1962; the Secretariat, 3:30 to 6 p.m., the report on the propaganda conference; Zhou Enlai not named); [[w.deng-xiaoping-nianpu-1904]], III, 1734 (Nov. 26, 1962; afternoon; Deng presides; Lu Dingyi on the national propaganda, culture and education conference. Deng: in the cadres'' rotation training, unity of thought is unity on the Center''s; democratic centralism, saying all one knows, always to be stressed; views within the organization lawful; the Party''s style for later generations; a good primary or middle-school teacher the equal of a professor, their pay and standing raised, tried first in Peking and Shanghai); [[w.peng-zhen-nianpu-1902]], IV, 228 (Nov. 26, 1962, afternoon; the Secretariat''s 342nd meeting; Peng Zhen there; Lu Dingyi on the national propaganda and culture conference; decided: the report on training cadres in rotation, revised, to the Center; city schools from two shifts to full days; on the intellectuals, inside and out, Zhou Enlai''s words in his government report of March 1962 to rule (the page''s note quotes them); Deng Xiaoping: democratic centralism, say all you know, to be stressed for ever; Peng Zhen: "只听一种意见，非常危险"). Continues 516. Made public: 1997. Check: the book dates the Secretariat meeting only "later in the year," after the Tenth Plenum (III, 280). To check: Informant B, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 280 n.107a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1007 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 280 n.108). Names: Zhou Enlai, Lu Dingyi, Li Fuchun, Li Xiannian, Deng Xiaoping.'
