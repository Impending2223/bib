    thread: china-bomb
    c: 'Mao Zedong approves Luo Ruiqing''s proposal of a special committee under the Center for the atomic industry: it is to tackle its work "by going all out in coordination."{1} The committee of fifteen, under Zhou Enlai: He Long, Li Fuchun, Wang Heshou, Zhang Aiping, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Liu Jie, Sun Zhiyuan, Duan Junyi and Gao Yang.{2} Mao: "Very good; do as proposed."{3}'
    n: '[[w.jian-zhou-enlai]], 515–16; [[w.zedong-mao-zedong-nianpu]], V, Nov. 3, 1962 (Mao on Luo Ruiqing''s report of Oct. 30: the first atomic bomb to be exploded in 1964, a special committee under the Center; "Very good; do it"). [[w.zhou-enlai-nianpu-1949]], II, 510 (Nov. 3, 1962: Mao on Luo Ruiqing''s proposal of Oct. 30 for a fifteen-man central committee to lead the atomic industry, with the Premier in charge and He Long, Li Fuchun, Wang Heshou, Zhang Aiping, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Liu Jie, Sun Zhiyuan, Duan Junyi and Gao Yang: "very good, do it; coordinate with all strength"); [[w.jianguo-yilai-mao-zedong]], XVI, 428–429 (Nov. 3, 1962; Mao''s note of Nov. 3: "Very good; do as proposed. Work together in great strength to do this well"; printed from the manuscript); [[w.deng-xiaoping-nianpu-1904]], III, 1731 (Nov. 3, 1962; Mao on Deng''s forwarding: "Very good, do so; this work to be done by great coordination"). Made public: Check (2013 at the latest). See [[cal.1962-10-30.china]]. Names: Mao Zedong, Luo Ruiqing, Zhou Enlai, He Long, Li Fuchun, Zhang Aiping, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Zhao Erlu, Liu Jie, Sun Zhiyuan, Duan Junyi, Gao Yang, Wang Heshou.'
