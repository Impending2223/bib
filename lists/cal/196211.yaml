    also: [south-asia, china-zhou-foreign]
    c: 'Zhou Enlai to the leaders of Asian and African states, by letter, on the Sino-Indian boundary: the course of the question;{1} the grave clash is wholly of the Indian government''s making; India seems to want no talks and to hold to force;{2} the two countries have no basic conflict of interest and no reason to fight over a border;{3} China has done all it could for three years and, not discouraged, will look for settlement and make conditions for a halt to the clash; it calls on the Afro-Asian states to do justice and promote direct talks.{4} Sent to 25 leaders, copies to the leaders of 83 countries.{5}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 512 (Nov. 15, 1962); [[w.zhou-enlai-waijiao-huodong]], 341 (Nov. 15, 1962); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 254 (Nov. 15, 1962; Zhou writes to the leaders of 25 Asian and African countries, restating China''s resolve to settle the boundary by peaceful means and calling on the Asian and African states to uphold justice and promote direct talks between the two sides; the letter says that in three years China has done all it could for a peaceful settlement while India, far from wishing to talk, has resolved to use force, and that today''s unfortunate situation is of the Indian government''s making; China is not discouraged and will go on looking for a way to reconciliation). Check: whether the letter was published at the time. To check: the letter. Names: Zhou Enlai.'
