  - id: cal.1962-11-05.south-asia
    when: Nov. 5
    date: '1962-11-05'
    thread: south-asia
    also: [soviet-union, china]
    c: '*Pravda* reverses the Soviet line on the border war, saying nothing of Peking''s claims: "It is necessary to cease fire and sit down at the round table of negotiations without setting any terms." The MiG-21s for India to be delivered after all, and 1.5 million tons of refined petroleum.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 497. To check: Seymour Topping, "Soviet Indicates a Return to Neutrality on India," New York Times, Nov. 6, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 497 n.24).'
