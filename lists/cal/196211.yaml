    c: 'Peking 北京. Peng Zhen 彭真 to the Peking committee''s enlarged meeting: agriculture the base not because the communes failed; the Soviet Union not through in 45 years, Eastern Europe in 16 or 17, China in 13; many people, little land, by its own strength; backs the meeting''s aims: the base of mechanization and electrification in about seven years, 400 jin of grain a mu on the plains, two billion jin of grain and a million fat pigs a year in the suburbs, 800 jin a head; aims are not adventurism; the Party allows errors and their correction; the "three don''ts" from Yan''an against seizing pigtails and wielding clubs; the label "bourgeois intellectual" much argued, the Party to win, unite and remold intellectuals into proletarian ones.'
