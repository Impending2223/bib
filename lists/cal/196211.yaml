  - id: cal.1962-11.soviet-union
    when: Nov., closing day
    date: 1962-11
    at: after 1962-11-21
    thread: soviet-union
    also: [china-leadership, comecon]
    c: At the Hungarian congress's closing reception, the Chinese delegation has its statement read out in Hungarian and hands round Hungarian and Russian texts.{1} It calls the use of one party's congress to attack another abnormal, to the grief of friends and joy of foes, and urges a conference of the brother parties.{2} Kádár tells the delegation he regrets the statement; it answers that the Hungarians abused China at the congress and now at the reception, and leaves.{3}
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 510 (the statement and Peking''s cable reached the delegation just after the congress''s morning session ended, before the evening reception; the delegation''s head said a few words, an interpreter read the whole in Hungarian, the texts handed out on the spot; Wu has it from the delegation that neither Hungarians nor Soviets expected this, and that the Soviet delegation had some one delegate, possibly long an exile at Moscow, speak abusively; Kádár came to the delegation to say he regretted the statement); [[w.macfarquhar-origins-of-the-cultural]], III, 320 (Wu has the statement translated into Russian and Hungarian and, on the pretext of saving time, has his interpreter read it in Hungarian; a Latin American communist is put up by the Russians to counter-attack; Kádár tells Wu he did not think the delegation could make such a speech; Wu says the delegation can stay no longer at the reception). Check: the book dates the closing reception Nov. 24 ([[cal.1962-11.soviet-union]] has ''closing day''). To check: [[w.xiuquan-huiyi-yu-huainian]], 349–52 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 320 n.119). Names: Kádár. Check: the day: the congress''s closing day, which Wu does not give.'
