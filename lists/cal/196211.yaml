    date: '1962-11-05'
    thread: europe-and-the-alliance
    also: [defense]
    c: 'McNamara sends his tentative recommendations on Skybolt to the Joint Chiefs. On Nitze''s memorandum: "I believe we should hold the message to Thorneycroft until we hear from the Chiefs," three weeks'' "consultation" before a "leak date" of about Dec. 10. The same day a message from Thorneycroft on British press reports that production is about to begin.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 380. To check: McNamara''s marginal notes on Nitze to McNamara, Nov. 3, 1962, SecDef Subject Decimal files, Acc 66A-3542 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 380 n.83). See [[cal.1962-11-03.europe-and-the-alliance]]. Names: McNamara, Nitze, Thorneycroft.'
