  - id: cal.1962-11-30.china-leadership
    when: Nov. 30
    date: '1962-11-30'
    time: 1962-11-30T05:30Z
    place: peking
    thread: china-mao-foreign
    also: [soviet-union, china-foreign]
    c: 'Juxiang Shuwu, 1:30 p.m.{1} Mao presides at the Standing Committee on four matters.{2} One: the Central Work Conference put off to about Jan. 15, 1963. Two: an NPC session in the first half of 1963 for plan and budget, another in the second half to elect; with it a third session of the Eighth Congress, its delegates from 1,200 to about 2,000, one a county. Three: the struggle against revisionism: at international meetings to which Yugoslavia is invited China will attend and not walk out, lest it lose its voice, as at the Italian party''s congress, which invited Yugoslavia and attacked China by name; *Peking Review* to become a theoretical journal for the world, in English, Spanish and French, on the International Liaison Department''s report; a digest to be edited in Peking and printed in Hong Kong. Four: the organization work conference (by Deng Xiaoping''s account to the Secretariat, Dec. 4: the Standing Committee agreed to register the Party''s members anew, on trial in 1963, in full in 1964).{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 30, 1962 (and nn. 119, 121; the Congress''s third session was never held). [[w.deng-xiaoping-nianpu-1904]], III, 1735 (Nov. 30, 1962; Deng at the Standing Committee, Mao presiding; decided, the Central Work Conference, the Fourth Session of the Second NPC in 1963, the struggle against revisionism abroad, and the re-registration of Party members). Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
    src:
      c: 06d2dabb
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Nov. 30, 1962: ?'
        - 'w.deng-xiaoping-nianpu-1904 III, 1735: 2'
    tags: [polity:prc, polity:yugoslavia, name:mao-zedong, vis:only:prc, polity:italy, name:deng-xiaoping]
