  - id: cal.1962-11-05.defense
    when: Nov. 5
    date: '1962-11-05'
    thread: defense
    c: 'McNamara''s recommendations for fiscal 1964–68: 80 B-58s and 630 B-52s, the last B-52Hs off the line in November; Minuteman 800 by June 1964, 950 by 1966, 1,300 by 1968; 41 Polaris boats. The Air Force''s proposals aim at a full first-strike capability, "almost certainly infeasible."'
    n: '[[w.poole-joint-chiefs-of-staff]], 44–45. Names: McNamara.'
    src:
      c: dc1712d4
      rows:
        - 'w.poole-joint-chiefs-of-staff 44–45: all'
