    c: 'Zhou Enlai to the National People''s Congress Standing Committee: Nehru unwilling to let go of "his vision of a great Indian empire";{1} "we needed to fight the war and to fight a big war, as a small war would not work"; the troops pulled back because "we fought the war for justice, not to change the status quo, which can only be changed through negotiation."{2} Zhu De 朱德 presides at the Standing Committee''s seventieth session, which hears and approves the report and names Ye Jizhuang 叶季壮, Minister of Foreign Trade, plenipotentiary to sign the Sino-Vietnamese treaty of commerce and navigation.{3} Yang Shangkun 杨尚昆 sits in, 3 to 6 p.m.{4}'
    n: '[[w.jian-zhou-enlai]], 484 (Chen''s translation; "People''s Congress leaders"); [[w.zhou-enlai-nianpu-1949]], II, 515 (Nov. 24, 1962: Zhou Enlai reports "On the Sino-Indian Boundary Question" to the 70th meeting of the Standing Committee of the Second NPC: the relation has had a friendly side from the first and a dark side; unity and struggle; four times China yielded but within limits; the tactic is of reason, advantage and restraint, giving ground and answering after the other strikes; to friends in the democratic parties who found the unilateral steps sudden, he says the three proposals of Oct. 24 and the steps of Nov. 21 do not run against national policy or the general line of foreign policy); [[w.yang-shangkun-riji]], II, 227 (Nov. 24, 1962; 3 to 6 p.m.; Yang Shangkun sits in); [[w.zhu-de-nianpu-xinbian]], III, 1854 (Nov. 24, 1962; Zhu De 朱德 presides at the seventieth session of the Second National People''s Congress Standing Committee 第二届全国人大常委会第七十次会议, which hears and approves Zhou Enlai''s 周恩来 report on the Sino-Indian boundary question 《关于中印边界问题》 and names Ye Jizhuang 叶季壮, Minister of Foreign Trade, plenipotentiary to sign the Sino-Vietnamese Treaty of Commerce and Navigation); [[w.zhu-de-nianpu-xinbian]], III, 1854; [[w.yang-shangkun-riji]], II, 227. Made public: Check. To check: Zhou''s speech at a meeting of the Standing Committee of the People''s Congress, Nov. 24, 1962, 1057-8-44, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 484 n.94a). Names: Zhou Enlai, Nehru, Zhu De, Ye Jizhuang, Yang Shangkun. Check: the day (Chen''s text dates none; his note dates the speech Nov. 24).'
