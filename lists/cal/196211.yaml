  - id: cal.1962-11-06.georgia-ga
    when: Nov. 6
    date: '1962-11-06'
    thread: georgia
    also: [legislatures, elections-1962, state-legislatures]
    c: 'Georgia Senate, the first election under the new apportionment. Leroy Johnson (D), an Atlanta lawyer, elected in the 38th district over a Negro Republican, 7,372 to 3,291, 69.1 percent: the first Negro in the Senate since 1874. Two Republicans elected. Carter, his special primary in the 14th voided by a court for fraud, elected on write-ins, 3,013 to 2,182, 58.0 percent.'
    n: '[Wikipedia, "1962 Georgia State Senate election"](https://en.wikipedia.org/wiki/1962_Georgia_State_Senate_election), from the *Atlanta Constitution*, Nov. 8, 1962, and the *Atlanta Journal*, Nov. 10, 1962. To check: [[w.carter-turning-point]]; [[w.tuck-beyond-atlanta]]; [[w.bartley-creation-of-modern-georgia]]. See [[cal.1962-09-27.georgia-ga]]. Names: Leroy Johnson, Carter.'
    tags: [name:johnson-leroy-r, name:carter-jimmy, state:ga, city:atlanta]
