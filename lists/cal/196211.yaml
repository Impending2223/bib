    n: '[[w.fursenko-khrushchevs-cold-war]], 496. To check: "Chinese Marchers Back Cuba" (Reuters) and "Chou Reaffirms Support of Cuba," New York Times, Nov. 4, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 496 n.12). Names: Zhou Enlai.'
