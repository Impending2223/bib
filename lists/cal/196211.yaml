  - id: cal.1962-11-12.china-leadership-2
    when: Nov. 12
    date: '1962-11-12'
    thread: china-liu
    also: [china-organization]
    c: 'Liu Shaoqi talks with the heads of the Central Committee''s Organization Department and the bureaus'' organization departments who are at the organization work conference, on building the ruling Party. The two chief questions are basic-level Party organizations and cadres. Organization work must be regularized; where no one manages the Party, the Party is not well managed and someone has to. Cadres are to be re-educated, chosen and appraised so that the ranks stay pure. More is asked of cadres than of Party members; among cadres, high and middle ones above all, there are bad ones, turned bad and decayed, whose influence differs from that of a few members at the base. People outside the Party fear that Party rule may corrupt it, a real problem Lenin raised too; if we do not notice it the Party may degenerate. Corrupt and fallen cadres are to be dealt with openly, reported to the whole Party and used for education; major cases that cannot be disposed of have someone holding them up, and fear not: most would support the handling. Do not cut off from the majority of Party members, cadres, workers and peasants; practice democratic centralism, criticism and self-criticism, one leader and a majority.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 565–566 (Nov. 12, 1962). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
