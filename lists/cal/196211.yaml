    when: Nov. 3
    date: '1962-11-03'
    thread: cuba
    also: [missile-crisis, soviet-union]
    c: 'Havana. Mikoyan''s first meeting with Castro: "What we are speaking of is not a broad inspection, but a verification of the sites known to the Americans due to aerial photography and which have been the locations of the strategic missile launchers." No permanent or general inspection.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 496. Check: the work dates the first meeting Nov. 3, the memorandum Nov. 4. To check: memorandum of conversation, Nov. 4, 1962, *CWIHP Bulletin*, no. 5 (Spring 1995) (cited by [[w.fursenko-khrushchevs-cold-war]], 496 n.16). See [[cal.1962-11-02.missile-crisis]]. Names: Mikoyan, Castro.'
    src:
      c: a8e720fc
      rows:
        - 'w.fursenko-khrushchevs-cold-war 496: all'
        - 'via x.2006.kcw-p496-mikoyan: all'
    tags: [name:mikoyan-anastas, name:castro-fidel]
  - id: cal.1962-11-03.china
    when: Nov. 3
    date: '1962-11-03'
    thread: china
    also: [cuba]
    c: Peking. The first of four days of marches on the Cuban Embassy, tens of thousands a day by Reuters' count, three hundred thousand by the official one; Zhou Enlai reaffirms support of Cuba.
    n: '[[w.fursenko-khrushchevs-cold-war]], 496. To check: "Chinese Marchers Back Cuba" (Reuters) and "Chou Reaffirms Support of Cuba," New York Times, Nov. 4, 1962 (cited by [[w.fursenko-khrushchevs-cold-war]], 496 n.12). Names: Zhou Enlai.'
