    thread: governors
    also: [elections-1962]
    c: New York. Rockefeller (R) re-elected governor over Morgenthau (D, Liberal), 3,081,587 to 2,552,418, 53.1 percent; Jaquith (Conservative) 141,877, 2.4 percent, enough for the party's line on the ballot. Javits (R) re-elected U.S. Senator over Donovan, 3,272,417 to 2,289,323, 57.4 percent; O'Doherty (Conservative) 116,151, 2.0 percent.
    n: 'Governor: [Wikipedia, "1962 New York state election"](https://en.wikipedia.org/wiki/1962_New_York_state_election), from the *New York Red Book*, 1963; Check: the *Legislative Manual*, 1963. Senate: [*Statistics of the Congressional Election of November 6, 1962*](https://clerk.house.gov/member_info/electionInfo/1962election.pdf) (Clerk of the House, 1963). [[w.goldberg-barry-goldwater]], 166 (Rockefeller behind the other Republicans on the State ticket, by a smaller margin than in 1958; the Conservative Party more than 142,000); [[w.smith-on-his-own-terms]], 384 (Rockefeller''s margin 529,000; within two hundred thousand of carrying the city; Jaquith 141,000; Javits by a million). See [[cal.1962-09-17.governors-ny]]; [[cal.1962-02.states-and-cities-ny]]. Names: Rockefeller, Morgenthau, Jaquith, O''Doherty, Javits, Donovan.'
