  - id: cal.1962-11-01.missile-crisis-settlement
    when: Nov. 1
    date: '1962-11-01'
    thread: missile-crisis-settlement
    c: 'Stevenson complains to Schlesinger: his report to the State Department of Wednesday night on U Thant''s conversations with Castro was in the newspapers by Thursday afternoon. Schlesinger tells Kennedy late in the afternoon; Kennedy learns from Manning that the report went out in 100 copies and the papers had it within two hours, and directs him to send each recipient a note, signed by Rusk, on the harm done. White House staff are now to report to Salinger each day the newsmen they have talked with. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 178. Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger, Thant, Castro, Kennedy, Manning, Rusk, Salinger.'
    tags: [name:stevenson-adlai-e, name:schlesinger-arthur-m-jr, name:u-thant, name:castro-fidel, name:kennedy-john-f, name:manning-robert-j, name:rusk-dean, name:salinger-pierre]
  - id: cal.1962-11-01.china-leadership
    when: Nov. 1
    date: '1962-11-01'
    thread: china-zhou
    c: 'Zhou Enlai to the national conference of cadres of the key coal mines: some trades will produce less next year, coal among them, but quality counts more; five goods: quality, lower cost, lower use, more kinds, higher productivity. He sums up the industry''s lessons since the Great Leap, criticizes high targets and blind command, takes the State Council''s main blame, and gives ten tasks. Intellectuals are not to be left in the cold.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 508 (Nov. 1, 1962). Continues 509. Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
