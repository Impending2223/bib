    when: Nov. 4
    date: '1962-11-04'
    thread: missile-crisis
    c: 'Khrushchev, on the list of offensive weapons Stevenson handed Kuznetsov: arms always called defensive put among them. Received Nov. 5.'
    n: 'FRUS 1961–63, VI, doc. [73](https://history.state.gov/historicaldocuments/frus1961-63v06/d73). [[w.fursenko-one-hell-of-a]], 298; [[w.fursenko-khrushchevs-cold-war]], 495 (the demand "can lead not to the betterment of our relations but, on the contrary, to their new aggravation"). See [[cal.1962-10-16.missile-crisis]]. Made public: *Problems of Communism*, special ed., Spring 1992. Names: Khrushchev, Stevenson, Kuznetsov.'
