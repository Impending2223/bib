    c: Birmingham votes to replace its three-man City Commission, Connor its Commissioner of Public Safety, with a mayor and a council of nine, under the Mayor-Council Act of 1955; the commission retained and a council-manager plan the other choices. Election of the mayor and council set for Mar. 5, 1963.
    n: '*Reid v. City of Birmingham*, [274 Ala. 629](https://static.case.law/ala/274/case-pdfs/0629-01.pdf), 150 So. 2d 735 (1963); *Connor v. State ex rel. Boutwell*, [275 Ala. 230](https://static.case.law/ala/275/case-pdfs/0230-01.pdf), 153 So. 2d 787 (1963). [[w.branch-parting-the-waters]], 674. Check: the vote. To check: [[w.eskew-but-for-birmingham]]; [[w.mcwhorter-carry-me-home]]; [[w.thornton-dividing-lines]]; [[w.nunnelley-bull-connor]]. Names: Connor.'
