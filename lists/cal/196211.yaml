    c: 'The Joint Chiefs'' estimate for the White House of an invasion of Cuba: 18,484 casualties, killed, missing and wounded, 4,462 the first day; no Soviet units nor tactical nuclear weapons assumed. The Atlantic command: estimates if the enemy uses tactical atomic weapons "cannot be meaningful."'
    n: '[[w.fursenko-one-hell-of-a]], 298–99. To check: Marine Corps summary, Nov. 1, 1962, Cuban Missile Crisis collection, National Security Archive (cited by [[w.fursenko-one-hell-of-a]], 298 n.36, 299 n.39). See [[cal.1962-10-28.missile-crisis]].'
