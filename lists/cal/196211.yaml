    c: 'Peking. Liu Shaoqi calls a meeting on the delegation''s cable from the Hungarian congress, asking how to answer. The congress soon to end, it has a statement drafted at once, to be given out before the closing, and a cable telling the delegation to seize the chance and make three points: the blame for the worsening of Sino-Soviet and Soviet–Albanian relations is the CPSU''s; the chorus against China is the CPSU''s staging; a conference of the brother parties is to be called to remove the differences.'
