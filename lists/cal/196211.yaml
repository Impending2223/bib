  - id: cal.1962-11-02.missile-crisis
    when: Nov. 2
    date: '1962-11-02'
    time: 1962-11-02T22:30Z
    thread: missile-crisis
    c: 'Kennedy reports the bases being dismantled. Mikoyan in Havana three weeks: inspection, the IL-28s.'
    n: 'Radio and Television Remarks on the Dismantling of Soviet Missile Bases in Cuba, [1962 Pub. Papers 821](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=881) (Nov. 2, 1962). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 215–17 (Mikoyan''s November visit; inspection; the IL-28s); [[w.fursenko-khrushchevs-cold-war]], 495 (Mikoyan to Havana Nov. 2; the same day Stevenson names the Il-28s); [[w.sorensen-kennedy]], 720 (the bases dismantled, the crates counted at sea; Mikoyan with Castro, a week of argument, ten days ignored). [[w.fursenko-one-hell-of-a]], 290–315 (Mikoyan''s mission). To check: [[w.mikoyan-anatomiya-karibskogo-krizisa]]; Senate Foreign Relations Committee, *Executive Sessions* (Historical Series), XV, Jan. 11, 1963, 15–16 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 215 n.86). See [[cal.1962-05-24.missile-crisis]]. Names: Mikoyan.'
