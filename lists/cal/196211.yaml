    date: '1962-11-12'
    place: peking
    thread: china-political-legal
    c: 'Peking 北京. Peng Zhen 彭真 to the national political and legal work conference: the courts, procuracy and police deal with contradictions with the enemy and among the people, chiefly dictatorship over the enemy, the two kept apart; counter-revolutionary cases fewer, but more within organs and enterprises, any present sabotage counter-revolution; leading cores of old cadres kept stable at county level and up; the three county heads of police, procuracy and court under the provincial committee; the three organs divided and checking one another, police to investigate and arrest, procuracy to approve arrest and prosecute, courts to try; each step by the lawful organ only, no other organ, the Party committees included, may do it, "搞了就违法"; no torture for confessions; the Party committees decide line, policy and the direction of blows, but do not interfere in single cases, and the procuracy acts independently.'
