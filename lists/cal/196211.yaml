    thread: china-zhou
    c: 'Zhou Enlai presides at the 119th plenary meeting of the State Council, after days of hearing the ministries'' joint reports, to check how each carries out the twelve measures of city work. On streamlining: in most large and medium cities the cutting is nearly done and the hard part is placing the people; those not placed must be taken in hand by the state, not pushed out; the ministries are to hold to it to the end.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 3, 1962). Continues 510. Made public: 1997. Names: Zhou Enlai.'
