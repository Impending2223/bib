  - id: cal.1962-11-01.china-leadership-3
    when: Nov. 1
    date: '1962-11-01'
    thread: china-zhou
    c: 'Zhou Enlai issues the Central Committee''s and State Council''s transmittal of the Ministry of the Interior''s report on adjusting the placement of college graduates put to wrong use. The comment: nearly a million graduates in the thirty years since 1949 are a treasure; those used outside their training after practice, or sent down too long, are to be fitted again to their strengths.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 509 (Nov. 1, 1962). Made public: 1997. To check: the comment as issued. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1962-11-01.china
    when: Nov. 1
    date: '1962-11-01'
    thread: china
    also: [cuba]
    c: 'Chen Yi replies by note to the Cuban embassy''s chargé d''affaires: China fully supports the five demands in Prime Minister Castro''s statement of Oct. 28. The editors'' note gives them: that the U.S. at once end its naval and economic blockade, its subversive and sabotage activities and its pirate attacks on Cuba, stop violating Cuba''s territory and airspace, and withdraw from the Guantánamo base and return it. Chen Yi stresses that Cuba''s fate is in the Cuban people''s hands, not in any other country''s, and that Cuba''s independence and sovereignty are not negotiable and its freedom and rights not to be traded.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 251 (Nov. 1, 1962); [[w.chen-yi-nianpu]], 940 (Nov. 1, 1962; Chen Yi''s reply to the chargé''s note of Oct. 26 on the blockade; Cuba''s fate is in the Cuban people''s hands, not in any other country''s). Names: Chen Yi, Castro. Check: the chargé is 雷希诺·佩罗斯·阿尔达玛 in the book; the Latin form is not recovered.'
    src:
      c: f900630e
      rows:
