    c: 'The Presidium, on Castro''s letter to U Thant and his order to fire on American planes.{1} Khrushchev: Castro''s position "just shouting and unreasonable";{2} "Either they will cooperate or we will recall our personnel."{3} Agreement to remove the Il-28s to go to Kennedy orally;{4} then held a few days, Mikoyan to offer Castro three plans of inspection.{5}'
