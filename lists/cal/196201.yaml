  - id: cal.1962-01-19.robert-kennedy
    when: Jan. 19
    date: '1962-01-19'
    thread: robert-kennedy
    also: [cuba]
    c: 'Mongoose. Robert Kennedy to its principals, in his office: a solution of the Cuban problem "the top priority in the United States Government—all else is secondary—no time, money, effort, or manpower is to be spared." The President, the day before: "the final chapter on Cuba has not been written." Lansdale''s thirty-two tasks to be done. Oct. 16, 2:30 p.m., he tells them of the President''s "general dissatisfaction" with Mongoose; he will meet them every morning at 9:30.'
    n: '[FRUS 1961–63, X, doc. 292](https://history.state.gov/historicaldocuments/frus1961-63v10/d292) (Helms to McCone), [doc. 293](https://history.state.gov/historicaldocuments/frus1961-63v10/d293) (Lansdale, Jan. 20); [FRUS 1961–63, XI, doc. 19](https://history.state.gov/historicaldocuments/frus1961-63v11/d19). [S. Rep. No. 94-465, 141 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=152) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 477 (Robert Kennedy''s words). See [[cal.1961-11-30.cuba]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy, Lansdale.'
