  - id: cal.1962-01-18.china-leadership-2
    when: Jan. 18
    date: '1962-01-18'
    thread: china-leadership
    c: 'Redrafting committee: Peng Zhen says the general line is easy to explain, the Great Leap Forward not; that in 1960 the agricultural disaster and the growth of the urban population were underestimated; that the eight-character program was empty talk for want of a directive, with no adjustment until the 1961 Lushan conference. Bo Yibo agrees the general line is the easier to defend. Liu Shaoqi closes the discussion: the Leap may still be named, but looked at in a new, historical way. Peng Zhen says the Center''s blame falls on the Secretariat and, if they deserve it, the Chairman, Liu Shaoqi and the other Standing Committee members; that Mao suggested a transition to communism in three to five years, and advocated universal mess-halls. Deng Xiaoping interrupts, citing Mao''s remark of Dec. 16 on the Secretariat''s report that no one is a sage and his shortcomings may be named. Peng adds that Mao should self-criticize for even a one percent error.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 155–58; [[w.yang-shangkun-riji]], II, 114 (Jan. 18, 1962; the drafting committee, 3 to 7 p.m., the words: 由3时开到7时; Song Renqiong, Ulanhu, Liu Lantao and Peng Zhen 彭真 speak; what they said not given); [[w.deng-xiaoping-nianpu-1904]], III, 1684–1685 (Jan. 18, 1962; Deng at the drafting committee: the fight against decentralism a question to the whole Party; those below see only their small worlds, not their fault; to be led by right thinking to the whole and the long aim); [[w.yang-jisheng-mubei]], II, 1112–1113 n.6 (Peng Zhen on Jan. 18: the Secretariat is first to answer for the errors, and the Chairman, Liu Shaoqi and the Standing Committee too if they should; the transition in three to five years and the mess halls were Mao''s approvals; Deng Xiaoping breaks in with Mao''s saying that the report makes him a sage and that no sage exists; Peng: Mao''s prestige is Everest or Taishan, and those who fear to criticize fall at once); [[w.jian-zhou-enlai]], 461–462 (Peng Zhen: Mao''s prestige like the Himalayas, his mistakes a few tons of earth, yet to be examined; Zhou at once: it is we, not the chairman, who should take responsibility); [[w.yang-jisheng-tiandi-fanfu]], I, 66 (Peng Zhen: the errors first the Secretariat''s; Mao not without error, the transition in three to five years and the mess halls his; his prestige "if not Everest, Mount Tai"; Deng Xiaoping''s interjection: Mao has said the report makes him a sage); [[w.peng-zhen-nianpu-1902]], IV, 168–169 (Jan. 18, 1962; Peng: the gains told fully, the errors thoroughly; "dispersionism" first the Center''s, its departments'' many kinds, then the localities''; not all bourgeois, as Peking''s processing for others (the page''s note: the Peking No. 1 Machine Tool Works'' work on others'' materials, wrongly called "bourgeois thinking" in the draft); 1960 a year of high targets, estimates, procurement and exports; the eight-character line of early 1961 without measures, a year late; the Secretariat first responsible; the errors of Chairman Mao, Shaoqi and the Standing Committee included where due; the three-to-five-year transition and the mess halls approved by Mao; Mao''s prestige if not Everest then Mount Tai, a few tons of earth taken away it is as high; not to examine even one percent, one thousandth, of his errors would leave a bad mark). Made public: 1997. To check: [[w.wenzao-guanyu-qiqian-ren-dahuide]], 2–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.84a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.84b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1026 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 156 n.85); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1026–27 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87c); [[w.macfarquhar-origins-of-the-cultural]], II, 130 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.87d); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.90a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 157 n.90b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.91a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.91b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.92); [[w.peng-zhen-zhuan]], III, 1063 (cited by [[w.jian-zhou-enlai]], 462 n.84b); [[w.wang-haiguang-shiguo-jing-weiqian]], 197 (cited by [[w.jian-zhou-enlai]], 462 n.85). Names: Peng Zhen, Bo Yibo, Liu Shaoqi