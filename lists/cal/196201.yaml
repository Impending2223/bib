    thread: china-leadership
    c: 'The Great Hall, 4 p.m. Mao''s long speech to the plenary, six parts: how the conference is run; democratic centralism; which classes to unite and which to oppress; knowledge of the objective world; the international communist movement; unity. Center: democracy in and out of the Party; no secret factions, but open dissent allowed and none to be punished; the mistakes of these years: the first account the center''s, and the center''s his first; then the provincial, prefectural and county committees in turn. On socialist construction: "we lack experience"; he told Montgomery it would take over a hundred years.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 30, 1962. [[w.zhou-enlai-nianpu-1949]], II, 454 (Jan. 30, 1962: Zhou Enlai attends the afternoon plenary); [[w.macfarquhar-origins-of-the-cultural]], III, 169–71 (Mao''s speech: his self-criticism, the "tigers", the Standing Committee, inexperience, Engels, class struggle); [[w.macfarquhar-maos-last-revolution]], 8 (Mao''s self-criticism); [[w.lengxi-shinian-lunzhan-1956-1966]], 488–489 (Mao on the Soviet relation: not necessarily Albania''s way; if the USSR breaks, China need not; it asks talks and proposes a conference of the 81 parties; break to be avoided or put off even for a bad appearance of none; no counter-articles now, let them curse; the Seven Thousand stand for 650 million people and fear no isolation; 90 percent of the world will in the end stand with China; the page opening the passage, 487, is missing from the scan); [[w.macfarquhar-origins-of-the-cultural]], III, 133–134 (Mao on the Soviet Union and isolation); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 548 (Jan. 30, 1962; Liu attends the conference''s plenary meeting at which Mao speaks: the democratic centralism of the Party must be strengthened; the understanding of the laws of socialist construction is to be deepened on the sum of experience positive and negative; Mao takes responsibility for the faults and errors of recent years); [[w.jianguo-yilai-mao-zedong]], XVI, 210–241 (Jan. 30, 1962; the speech as revised in Feb. 1966 and printed in *Renmin ribao*, July 1, 1978, not the oral text: six points, the way the conference is run, democratic centralism (211), classes to unite and to oppress (219), knowledge of the objective world (220), the international communist movement (228), unity (229); notes 1–31 give the wording of the version circulated Apr. 10, 1962, which differs); [[w.yang-shangkun-riji]], II, 118–119 (Jan. 30, 1962; 4 p.m., two hours; six questions by the diary: the conference''s method, democracy first, then centralism; democratic centralism; overcoming difficulties; knowing the world; Sino-Soviet relations and world revolution; uniting the great majority; its center democracy); [[w.deng-xiaoping-nianpu-1904]], III, 1687 (Jan. 30, 1962; afternoon; Deng at the plenary; Mao on democratic centralism and his self-criticism); [[w.mao-zedong-zhuan]], V, ch. 69 n.24 (Jan. 30, plenary: Mao''s speech on six questions, how the conference is run, democratic centralism, which classes to unite and which to oppress, knowledge of the objective world, the communist movement, unity; the most on democratic centralism; he criticizes himself for the speech of June 12, 1961 not being passed on). [[w.yang-jisheng-mubei]], II, 1116–1117 n.15 (the book puts Mao''s speech to the conference on the morning of Jan. 30; it does not take up the famine but democratic centralism, with no high centralism without high democracy, or Yugoslavia''s course); [[w.jian-zhou-enlai]], 461 (Mao: comrades to "unleash their anger"; for the Center''s mistakes he is directly or indirectly responsible; without democracy no centralization); [[w.yang-jisheng-tiandi-fanfu]], I, 70 (on democratic centralism: without broad people''s democracy the dictatorship cannot be firm; without high democracy no high centralism, and without high centralism no socialist economy); [[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 30, 1962, afternoon; Mao''s speech on democratic centralism and the laws of socialist construction, taking responsibility for the errors; Peng Zhen there). Made public: 1996. To check: Mao''s speech of Jan. 30, 1962, as printed in his *Selected Works*, if included, and the nianpu''s note on the revised record (Feb. 24, Mar. 10); [[w.schram-mao-tse-tung-unrehearsed]], 166–67 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 169 n.154); [[w.schram-mao-tse-tung-unrehearsed]], 167 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 169 n.155); [[w.schram-mao-tse-tung-unrehearsed]], 170–76, 173 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 170 n.159a); [[w.zedong-mao-zedong-zhuzuo-xuandu]], 2, 833 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 170 n.160a); [[w.schram-mao-tse-tung-unrehearsed]], 180 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 170 n.160b); [[w.macfarquhar-origins-of-the-cultural]], II, 164 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 170 n.160c); [[w.schram-mao-tse-tung-unrehearsed]], 168 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 171 n.162); Mao Zedong 毛泽东, speech at the enlarged Central Work Conference, Jan. 30, 1962; in [[w.mao-zedong-wenji]], VIII, 289–304 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.24); [[w.zhou-enlai-zhuan-1949]], 659 (cited by [[w.jian-zhou-enlai]], 461 n.81b); *Mao Zedong sixiang wansui* 《毛澤東思想萬歲》 (1961–1968), 17 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 70 n.70). See [[cal.1962-01-29.china-leadership]]. Names: Mao Zedong.'
