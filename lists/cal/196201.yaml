  - id: cal.1962-01-18.program
    when: Jan. 18
    date: '1962-01-18'
    place: washington
    thread: program
    c: 'The White House, dinner for Stravinsky. Marshall Field complains that all the good columnists are liberals; Kennedy: "Liberalism and conservatism ... are categories of the thirties, and they don''t apply anymore. Our problems today are mostly technical and require above all sophisticated thinking." The trouble with conservatives is that "most of their thinking is so naive"; the liberals'' "function ought to be to provide new ideas, and they don''t come up with any." By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 146; [[w.salinger-with-kennedy]], 207, 209 (the formal dinner for Stravinsky''s eightieth birthday; after most guests leave, Kennedy has Salinger play for Stravinsky, who walks out halfway; Bernstein stays; not Field or Kennedy''s words). Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger.'
    src:
      c: 02772efb
      rows:
        - 'w.schlesinger-journals 146: all'
        - 'w.salinger-with-kennedy 207, 209: A'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, city:washington]
  - id: cal.1962-01-18.soviet-union-2
    when: Jan. 18
    date: '1962-01-18'
    place: washington
    thread: soviet-union
    c: 'Evening, the Hay-Adams bar. Bolshakov to Salinger: Khrushchev agrees to a series of television exchanges with Kennedy; the invitation to Salinger and his family to visit Adzhubei in Moscow in April is official; the Kremlin would welcome Robert Kennedy, who plans a European tour that summer. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 208–09. See [[cal.1962-01-18.soviet-union]]. Names: Bolshakov, Salinger, Khrushchev, Kennedy, Robert Kennedy, Adzhubei.'
    tags: [name:salinger-pierre, name:bolshakov-georgi, name:khrushchev-nikita-s, name:kennedy-john-f, name:kennedy-robert-f, name:adzhubei-aleksei]
  - id: cal.1962-01-18.press-and-broadcasting
    when: Jan. 18
    date: '1962-01-18'
    thread: press-and-broadcasting
    c: 'Lunch at the Metropolitan Club. Reston to Salinger: Kennedy''s way of doing business is "much too informal"; Salinger should keep a White House diary of visitors, off-the-record talks and the disputes before major decisions. Salinger promises a general record of comings and goings. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 208. Names: Reston, Salinger, Kennedy.'
    tags: [name:salinger-pierre, name:reston-james, name:kennedy-john-f]
