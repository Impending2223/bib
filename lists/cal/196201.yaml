    c: 'The enlarged Central Work Conference (the "Seven Thousand Cadres" conference) opens in Peking, Mao presiding; over 7,000 leading cadres of the center, the regional bureaus, the provinces, prefectures, counties, major factories and the army. Its stated aim: sum up twelve years, especially four, strengthen unity, discipline and democratic centralism, and carry out the policy of adjusting the economy. It runs to Feb. 7.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 11, 1962. [[w.zhou-enlai-nianpu-1949]], II, 451 (Jan. 11–Feb. 7, 1962: Zhou Enlai attends); [[w.macfarquhar-maos-last-revolution]], 8 (January–February; some 7,000 cadres); [[w.macfarquhar-origins-of-the-cultural]], III, 137, 143–144 (the conference: the Seven Thousand Cadres; Liu''s first draft presented); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 545 (Jan. 11–Feb. 7, 1962; Liu attends the enlarged Central Work Conference, "the Seven Thousand Cadres Conference": 7,118 leading cadres of the Center, the bureaus, the provincial, prefectural and county committees, major plants and mines and the army; its aim to sum up experience, unify understanding, strengthen democratic centralism and carry out the policy of adjusting the national economy; Jan. 11–24 the Center''s draft report is given out for discussion and views, and the Center decides to set up a 21-man drafting committee under Liu); [[w.deng-xiaoping-nianpu-1904]], III, 1683 (Jan. 11–Feb. 7, 1962; the enlarged Central Work Conference (the Seven Thousand Cadres conference): twelve years, the last four above all, summed up; thought, unity, discipline, democratic centralism; first phase on Liu''s written report, the Center taking responsibility; from the afternoon of Jan. 29, at Mao''s call, a "venting" meeting of criticism and self-criticism; Mao''s speech Jan. 30; Deng''s Feb. 6; Zhou, Zhu De, Lin Biao and others also speak); [[w.mao-zedong-zhuan]], V, ch. 69 (Jan. 11 to Feb. 7, the enlarged Central Work Conference at Peking, called by the Center''s notice of Nov. 16, 1961, "the Seven Thousand Cadres"; the largest work conference the Party had held; the agenda opens with Liu Shaoqi''s written report; Mao agrees on Jan. 13 to lengthen the session). [[w.yang-jisheng-mubei]], II, 1174 (the enlarged Central work conference, the "Seven Thousand Cadres" conference, Jan. 11–Feb. 7, 1962, in Peking); [[w.yang-jisheng-mubei]], II, 1111 n.3 (the conference opens Jan. 11, with 7,118 attending; planned at four levels, it is widened at Mao''s suggestion to five by adding the county heads and those of equal rank in factories and mines); [[w.yang-jisheng-tiandi-fanfu]], II, 1142 (the Seven Thousand Cadres Conference, Jan. 11 to Feb. 7; the leaders divided on the famine''s lessons); [[w.chen-yi-nianpu]], 907 (Jan. 11–Feb. 7, 1962; Chen Yi attends); [[w.jian-zhou-enlai]], 461 (Jan. 11 to Feb. 7: the Seven Thousand Cadres Conference; Mao''s theme, opposition to separatism); [[w.yang-jisheng-tiandi-fanfu]], I, 65 (planned for four levels, five at Mao''s proposal, the county added; 7,118 attending; opens Jan. 11, the groups discussing Liu''s draft, first on "opposing dispersionism"); [[w.peng-zhen-nianpu-1902]], IV, 166–167 (Jan. 11–Feb. 7, 1962; Peng Zhen attends; 7,118 present from the regional bureaus, the central departments, the provincial, prefectural and county committees, key enterprises and the army (the "Seven Thousand"); Liu Shaoqi''s written report of Jan. 27, the Center taking responsibility; Mao speaks on the 30th; Liu, Lin Biao, Mao, Zhou, Zhu De, Deng and Chen Yun speak in plenary or in the provincial groups; Peng at the Secretariat, the drafting committee and the Zhejiang group); [[w.friedman-shadow-cold-war]], 92 (the 7,000-Cadres Conference, late December 1961 to early February 1962, a political defeat for Mao, who withdraws to Wuhan after it). Made public: 1995. To check: [[w.zhonggong-dangshi-dashi-nianbiao]], 277 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 137 n.2a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1014 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 137 n.2b); [[w.zhongguo-gongchan-dang-jianshi]], 315 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 137 n.3); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.jin-1949-1989-niande-zhongguo]], 399–413 (cited by [[w.macfarquhar-origins-of-the-cult