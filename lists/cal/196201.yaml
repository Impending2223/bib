    c: 'Mao 毛澤東, after Liu Ningyi 劉寧一, chairman of the All-China Federation of Trade Unions, has reported to him on the delegation to the Moscow disarmament congress, counts on his fingers: peace with the imperialists led by America, with the revisionists led by the Soviet Union, with the reactionaries of the countries led by India, "three peaces"; and less aid to wars of national liberation and revolutionary movements.'
    n: '[[w.yang-jisheng-mubei]], II, 1127 n.33; [[w.yang-jisheng-tiandi-fanfu]], I, 75 (Kang Sheng says everywhere that the delegation''s error came from Wang Jiaxiang''s letter and urges Liu Ningyi to complain to Mao; Mao on his fingers: peace with the imperialists, with the revisionists, with the reactionaries, less help to the liberation struggles, "three peaces and one less"). Kang Sheng 康生 had put it about that the delegation''s errors came from Wang Jiaxiang''s 王稼祥 letter, and urged Liu Ningyi to go to Mao (II, 1127). Made public: 2005. To check: Yan Mingfu 閻明復, "Cong wo qinli de jijian shi kan Kang Sheng" 《從我親歷的幾件事看康生》, *Yanhuang chunqiu* 2005 no. 5 (cited by [[w.yang-jisheng-mubei]], II, 1127 n.33). See [[cal.1962-02-27.china-leadership-2]], [[cal.1962-07.china-leadership-13]]. Check: the day. Names: Mao Zedong.'
