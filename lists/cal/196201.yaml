    thread: europe-and-the-alliance
    c: 'Luncheon, by Schlesinger''s account. Kennedy wonders aloud to Julian Amery, the British Minister of Aviation, whether Skybolt will ever work. Amery: the basis of British nuclear defense; anything happening to it could have far-reaching effects on Anglo-American relations. Kennedy: the United States doing everything possible to make it succeed. The Air Force takes Amery to Douglas Aircraft; he returns to London satisfied.'
