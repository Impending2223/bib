        - 'w.poole-joint-chiefs-of-staff 9, 41, 68, 220: all'
        - 'via w.poole-joint-chiefs-of-staff 9 n.21: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 90–91: A-C, E'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 91 n.65: A-C, E'
