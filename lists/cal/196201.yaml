    c: 'Redrafting committee: Chen Boda answers Peng Zhen: asks whether Mao must take responsibility for all that was messed up and whether his work is to be investigated; says the chief present problem is too little centralization. Peng Zhen replies that his aim was that no one, Mao included, be exempt from criticism.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 158; [[w.yang-shangkun-riji]], II, 114 (Jan. 19, 1962; the drafting committee, 3 to 7:30 p.m., the words: 3时到7时半; its discussion ends, Li Xiannian, Chen Yun, Zhou Enlai, Deng Xiaoping and Chen Boda speaking; minds broadly unified; the second draft to be discussed together from Jan. 20; what Chen Boda said not given); [[w.deng-xiaoping-nianpu-1904]], III, 1685 (Jan. 19, 1962; Deng at the drafting committee: the chief contradiction as subjectivism against dialectical materialism leads to no conclusion); [[w.yang-jisheng-mubei]], II, 1113 n.7–8 (after Peng Zhen, undated by the book: Zhou Enlai, that the cause is to be sought in themselves, the faults of the material they supplied theirs and not Mao''s, and that all must listen to the "helmsman," to the Center, and the Center to Chairman Mao; soon after, Chen Boda: is Mao to answer for the mess, his work to be examined? the root problem is that the Center cannot centralize; Peng Zhen explains that he meant it is wrong that all may be criticized but Mao); [[w.yang-jisheng-tiandi-fanfu]], I, 67 (Chen Boda after Zhou: are the messes to be laid on Mao? the root is that the Center cannot centralize; Peng Zhen: he meant that all but Mao may be criticized, and that is not good); [[w.peng-zhen-nianpu-1902]], IV, 169 (Jan. 19, 1962, afternoon; Chen Boda: Peng Zhen''s words on Mao "值得研究"; must Mao answer for all the mess? Peng at once: the impression must not be given that all may be criticized but Chairman Mao). Made public: 1997. To check: [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.93a); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.94); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 158 n.95). Names: Chen Boda, Peng Zhen, Mao Zedong.'
