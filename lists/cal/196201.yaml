  - id: cal.1962-01-02.health-ct
    when: Jan. 2
    date: '1962-01-02'
    thread: health
    also: [court]
    c: New Haven. Griswold and Buxton convicted in the Circuit Court as accessories, fined $100 each. Affirmed by its Appellate Division, Jan. 7, 1963, and by the Supreme Court of Errors, *State v. Griswold*, [151 Conn. 544](https://static.case.law/conn/151/case-pdfs/0544-01.pdf) (1964).
    n: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf), 480 (1965). See [[cal.1961-11-01.health-ct]]; [[cal.1965-06-07.court]]. Names: Griswold, Buxton.'
    tags: [state:ct, city:new-haven, name:griswold-estelle, name:buxton-c-lee]
  - id: cal.1962-01-03.vietnam
    when: Jan. 3
    date: '1962-01-03'
    thread: vietnam
    also: [defense]
    c: 'Palm Beach. Kennedy with the Joint Chiefs, Johnson, McNamara, Taylor, Harkins and Gilpatric. Harkins approved to command in Vietnam, without publicity for now. The President: no further military involvement; the numbers of American military personnel to be played down, their role "advice, training and support" and not combat. Defoliation to begin as a small experiment along one road.'
    n: '[FRUS 1961–63, II, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v02/d2) (Gilpatric''s memorandum for the record, drafted Jan. 9). [[w.moyar-triumph-forsaken]], 148 (the meeting; the numbers to be played down). [[w.selverstone-kennedy-withdrawal]], 56 (Kennedy with the Chiefs; the numbers played down; no combat). To check: [FRUS 1961–63, II, doc. 3](https://history.state.gov/historicaldocuments/frus1961-63v02/d3) (Gilpatric to Lemnitzer, Jan. 4: a cover story or public explanation for the reports; cited by [[w.moyar-triumph-forsaken]], 148 n.2). See [[cal.1961-11-22.vietnam]]. Names: Kennedy, Johnson, McNamara, Taylor, Harkins, Gilpatric.'
    src:
      c: ecc6c033
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d2: all'
        - 'w.moyar-triumph-forsaken 148: A, C'
        - 'via w.moyar-triumph-forsaken 148 n.1: A, C'
        - 'w.selverstone-kennedy-withdrawal 56: B, D-E'
        - 'via w.selverstone-kennedy-withdrawal 56 n.18: B, D-E'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:mcnamara-robert-s, name:taylor-maxwell, name:harkins-paul-d, name:gilpatric-roswell-l]
