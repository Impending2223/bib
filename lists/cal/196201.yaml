  - id: cal.1962-01-03.china-leadership
    when: Jan. 3
    date: '1962-01-03'
    place: peking
    thread: china-leadership
    also: [china, japan]
    c: 'Zhongnanhai, the Yinian Tang, evening. Mao receives Yasui Kaoru, head of the Japan Council against Atomic and Hydrogen Bombs; Liao Chengzhi and Liu Ningyi present. Mao: the socialist camp one side, the United States the other, the rest an "intermediate zone" of three kinds: states with colonies (Britain, France, Belgium, the Netherlands); states truly independent (Guinea, the UAR, Mali, Ghana); states independent in name. Britain and France imperialist, but at odds with the United States and so indirect allies of the peoples.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 3, 1962. [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 215–216 (Jan. 3, 1962; Mao receives Yasui Kaoru (安井郁); the United States bullies the Japanese, the Chinese, and most of the world''s people; beyond the socialist camp and the United States is an intermediate zone of states of differing kinds, which the American rulers want to swallow). Made public: 2001. Names: Mao Zedong, Yasui Kaoru, Liao Chengzhi.'
    src:
      c: b2d1f3e0
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Jan. 3, 1962: all'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 215–216: B, D'
    tags: [polity:prc, polity:japan, name:mao-zedong, vis:only:prc+japan]
  - id: cal.1962-01-03.china-leadership-2
    when: Jan. 3–6
    date: '1962-01-03'
    thread: china-leadership
    c: 'Zhou Enlai convenes the State Council''s reports on the 1962 economic plan, Jan. 3–6. Jan. 3: coal and timber output; a seven-man timber group set up under the State Economic Commission, on the coal group''s model. Jan. 4 and 6: streamlining; the eight sectors with the ministries to fix output quotas, workloads and staff by a deadline, and to hand down the first-half cuts. Jan. 5: the report on 1961 finance and credit and the aim of a balanced budget with a little currency withdrawn. Afterward he tells the Center the plan needs more adjustment.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 449 (Jan. 3–6, 1962); [[w.yang-shangkun-riji]], II, 108 (Jan. 6, 1962; 10 a.m. to 1 p.m., at Zhou Enlai''s, Xihuating 西花厅: the streamlining of organs; Yang Shangkun to lead the work, with Xi Zhongxun, Zhang Qilong and Ma Wenrui, first to survey, then to draw up rules for the enlarged work conference; note 3: the three). Made public: 1997. To check: the reports as printed. Names: Zhou Enlai.'
    src:
