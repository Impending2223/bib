  - id: cal.1962-01-11.china-leadership-4
    when: Jan. 11–25
    date: '1962-01-11'
    place: peking
    thread: china-leadership
    c: 'Seven Thousand Cadres Conference, Peking, group discussions of Liu Shaoqi''s written report: the Southwest and North China groups back Liu''s May 1961 finding that the catastrophe was mainly man-made (70 percent, "ren huo"); others hold natural calamities the chief cause. A minority asks whether the failures are errors of line, not of implementation; one speaker says the losses are no less than those of the third left line and need a clear reckoning; others say the three red banners are correct in principle but hard in practice; a Northwest group cadre names "blind leftist empiricism" the chief error. One speaker calls speed the soul (linghun) of the general line; another says "dislocation" (shitiao), not lack of coordination, is the word for Liu''s report; others ask why the first Five-Year Plan, with less experience, made fewer errors; one calls subjectivism the source of high targets, and says the conference succeeds only if the three red banners are aired.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 152–54. Made public: 1997. To check: [[w.gang-60-niandai-qianqi-dangnei]], 1–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 153 n.64); [[w.gang-60-niandai-qianqi-dangnei]], 2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 153 n.66a); [[w.gang-60-niandai-qianqi-dangnei]], 2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 153 n.67); [[w.gang-60-niandai-qianqi-dangnei]], 2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 153 n.68a); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 153 n.68b); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 154 n.70); [[w.macfarquhar-origins-of-the-cultural]], I, 111–14 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 154 n.73); [[w.gang-60-niandai-qianqi-dangnei]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 154 n.74a); Informant S, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 154 n.74b). Names: Liu Shaoqi. Check: the days; the book dates the discussions only from the conference''s opening to Jan. 25 and names none of the speakers.'
