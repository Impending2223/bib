  - id: cal.1962-01-28.china-leadership
    when: Jan. 28
    date: '1962-01-28'
    time: 1962-01-28T10:00Z
    place: peking
    thread: china-leadership
    also: [china, laos, vietnam-hanoi]
    c: 'Peking, Diaoyutai guesthouse, Building 18. Zhou Enlai meets and dines Souphanouvong, on his way home, and Hoàng Văn Hoan, special adviser to the Vietnamese delegation to the enlarged Geneva conference. He says the three princes'' Geneva communiqué has a positive side: it can be used as a weapon to expose Phoumi Nosavan''s constant breaking of promises; a coalition government on its basis would be good, and the struggle would go on within it; the main thing is to strengthen one''s own forces, and in the end the matter is settled by strength.'
    n: '[[w.zhou-enlai-waijiao-huodong]], 329 (Jan. 28, 1962; 晚6时); [[w.chen-yi-nianpu]], 909 (Jan. 28, 1962, evening; Zhou receives Souphanouvong and Hoàng Văn Hoan, Chen Yi present). Made public: 1993. Names: Zhou Enlai, Souphanouvong, Phoumi Nosavan.'
