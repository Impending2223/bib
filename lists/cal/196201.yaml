    c: 'Shanghai 上海. Chen Yun 陳雲 has Chen Guodong 陳國棟, Zhou Boping 周伯萍 and two others come to him and sends them to some provinces to see the countryside as it is: not under the Center''s name, with no provincial cadres beside them but guides, offering no views, only looking.'
