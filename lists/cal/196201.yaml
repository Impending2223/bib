  - id: cal.1962-01-02.vietnam
    when: Jan. 2–14
    date: '1962-01-02'
    thread: vietnam
    c: 'Transports of the 315th Air Division airlift the tactical air control system''s men and equipment into South Vietnam: the 5th Tactical Control Group at Tân Sơn Nhứt and Đà Nẵng, Vietnamese at Pleiku; communications circuits to Đà Nẵng, Biên Hòa, Pleiku. Feb. 15, five Air Force forward air controllers arrive.'
