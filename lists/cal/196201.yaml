  - id: cal.1962-01-29.soviet-union
    when: Jan. 29
    date: '1962-01-29'
    place: paris
    thread: soviet-union
    c: Paris, the Soviet Embassy, four hours. Salinger and Murrow agree with Kharlamov on a series of thirty-minute joint television programs, the first on March 18, at noon in Washington and 7 p.m. in Moscow, the theme "What Kind of World I Would Like to Live In." Salinger asks whether the Soviet Union would negotiate a "hot line"; Kharlamov will find out in Moscow. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 211–13 (each side to film its principal on March 9 or 10; the luncheon at the embassy after). Check: the day ("the next morning" after the cocktail party). Names: Salinger, Murrow, Kharlamov.'
    tags: [name:salinger-pierre, name:murrow-edward-r, name:kharlamov-mikhail-a]
  - id: cal.1962-01-29.china-leadership
    when: Jan. 29
    date: '1962-01-29'
    time: 1962-01-29T08:00Z
    place: peking
    thread: china-leadership
    c: 'The Great Hall, 4 p.m. Plenary session, Mao presiding. Lin Biao: the general line, the Great Leap and the communes are right; the difficulties arose because Mao''s instructions were not followed; China can overtake the United States in decades; on war: do not provoke, do not strike first, delay it, but fight an offensive defense, not a passive one. Mao: Lin''s speech very good, to be written up; then, after talk with the Standing Committee, proposes extending the conference for a "venting meeting" (出气会), to let men speak who have held back: no recording, no blows, no reprisals; democratic centralism not yet built in the Party.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 29, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 166–68 (Lin Biao''s speech); [[w.macfarquhar-origins-of-the-cultural]], III, 143–144 (Lin Biao; Mao opens the second stage); [[w.yang-shangkun-riji]], II, 118 (Jan. 29, 1962; 4 to 7 p.m., the plenary; Lin Biao speaks; Mao: all to "vent their anger" 出气, the conference extended some days, to close before the Spring Festival); [[w.deng-xiaoping-nianpu-1904]], III, 1686–1687 (Jan. 29, 1962; afternoon; Deng at the plenary; Lin Biao on Party and military work; Mao extends the meeting over the Spring Festival, a "venting" meeting); [[w.mao-zedong-zhuan]], V, ch. 69 nn.19, 21 (Jan. 29, plenary, Mao presiding: Lin Biao speaks, the difficulties in part from not following Mao''s instructions; Mao calls it very good and asks that it be written up in a week or two; Mao then announces that the session is lengthened, that all may let off steam, speak freely and say it all; democratic centralism not yet a fact). [[w.dikotter-maos-great-famine]], 336 n.3 (Lin Biao lauds the Great Leap as an unprecedented accomplishment: work went well when Mao''s thought was carried out and not interfered with); [[w.yang-jisheng-mubei]], II, 1115–1116 n.11–13 (on the afternoon of Jan. 29, after Mao has said ''vent by day, see plays at night, two dry meals and one thin'' and the conference is held on, Lin Biao speaks, with Mao presiding: the Three Red Banners right, the difficulties the result of not following Mao''s instructions; Mao says it is a very good speech on the Party''s line and military policy and asks for it to be collated in a week or half a month); [[w.jian-zhou-enlai]], 462 (Lin Biao hails Mao, the disaster from a "failure to follow Mao Thought"); [[w.yang-jisheng-tiandi-fanfu]], I, 68–69 (the afternoon of the 29th, told that the delegates have not had their say and still have "a bellyful of anger," Mao: "vent your anger by day, see an opera at night, two solid meals and one of gruel, and all are content," and the conference, set to close Jan. 30 or 31, goes on; Lin Biao: the difficulties came "precisely because" Mao''s instructions were not followed; Mao''s outstanding merit is that he is practical; Mao presiding, after: "a very good speech ... tidy it up; a week or half a month"); [[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 29, 1962, afternoon; Peng Zhen at the plenary, Mao presiding; Lin Biao: the difficulties came from not acting on Mao''s instructions, warnings and thought, work goes well when Mao''s thought is not interfered with; Mao: "a very good speech," to be put in order; Mao extends the conference over the Spring Festival for "venting" meetings, the prefectural and county cadres being afraid to speak of the provincial leaders). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 118) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 69), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.lin-biao-xuanji-untitled]], 129–40 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136a); [[w.jin-1949-1989-niande-zhongguo]], 410–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136c); [[w.yunsheng-maojiawan-jishi]], 210 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136d); [[w.qi-qian-ren-dahui]], 125–61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136e); [[w.lin-biao-xuanji-untitled]], 132 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.142a); [[w.qi-qian-ren-dahui]], 129–30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.142b); [[w.lin-biao-xuanji-untitled]], 129 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.143a); [[w.qi-qian-ren-dahui]], 126 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.143b); [[w.lin-biao-xuanji-untitled]], 132–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145a); [[w.qi-qian-ren-dahui]], 130–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145b); [[w.macfarquhar-origins-of-the-cultural]], II, 15–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145c); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148a); [[w.jin-1949-1989-niande-zhongguo]], 413 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148b); [[w.zhisui-private-life-of-chairman]], 387–88 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148c); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 59–60, 62–65 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1019 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 143 n.19); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); Lin Biao 林彪, speech at the enlarged Central Work Conference, Jan. 29, 1962; in [[w.jianguo-yilai-zhongyao-wenxian]], XV, 107–108 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.19); Record of the enlarged Central Work Conference 扩大的中央工作会议记录, Jan. 29, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.21); Lin Biao, speech of Jan. 29, 1962, Gansu Provincial Archives, 91-18-493, pp. 163–164 (cited by [[w.dikotter-maos-great-famine]], 336 n.3); [[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], 143–145 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 69 n.65). See