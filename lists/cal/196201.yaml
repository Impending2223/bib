  - id: cal.1962-01-02.defense
    when: Jan. 2
    date: '1962-01-02'
    thread: defense
    c: 'A conference of Kennedy, Johnson, Taylor, McNamara and Gilpatric settles the Army at 16 regular divisions. The program for fiscal 1963–67: three Marine division/wing teams, 15 attack and nine ASW carriers, 14 cruisers, some 250 destroyers, about 100 attack submarines; 21 tactical fighter wings.'
    n: '[[w.poole-joint-chiefs-of-staff]], 67–68. See [[cal.1961-12-01.defense]]. Names: Kennedy, Johnson, Taylor, McNamara, Gilpatric.'
    src:
      c: 176fa219
      rows:
        - 'w.poole-joint-chiefs-of-staff 67–68: all'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:taylor-maxwell, name:mcnamara-robert-s, name:gilpatric-roswell-l]
    time_range:
      - 1962-01-02T14:00Z
      - 1962-01-02T22:00Z
    time_band: workday daytime
    time_zone: America/New_York
    range_basis: kind
  - id: cal.1962-01-02.desegregation-schools
    when: Jan. 2
    date: '1962-01-02'
    thread: desegregation-schools
    c: 'Chicago. The first sit-in of the school controversy, at Burnside School, against the transfer of some thirty pupils to Gillespie, a Negro school, not to Perry, still white. For more than two weeks: teach-ins, parents and ministers arrested, the charges dismissed, the board picketed, talks with Willis; *Burroughs v. Board of Education* filed for damages and against schools kept for whites.'
    n: '[[w.anderson-confronting-the-color-line]], 89. To check: Burroughs v. Board of Education, U.S. District Court, Northern District of Illinois, Eastern Division, 62 C 206 (cited by [[w.anderson-confronting-the-color-line]], 89 n.43). Names: Willis.'
    src:
      c: d2f219fa
      rows:
        - 'w.anderson-confronting-the-color-line 89: all'
        - 'via w.anderson-confronting-the-color-line 89 n.43: all'
    tags: [name:willis-benjamin-c, state:il, city:chicago]
  - id: cal.1962-01-03.vietnam
    when: Jan. 3
    date: '1962-01-03'
    thread: vietnam
    also: [defense]
    c: 'Palm Beach. Kennedy with the Joint Chiefs, Johnson, McNamara, Taylor, Harkins and Gilpatric. Harkins approved to command in Vietnam, without publicity for now. The President: no further military involvement; the numbers of American military personnel to be played down, their role "advice, training and support" and not combat. Defoliation to begin as a small experiment along one road.'
    n: '[FRUS 1961–63, II, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v02/d2) (Gilpatric''s memorandum for the record, drafted Jan. 9). [[w.moyar-triumph-forsaken]], 148 (the meeting; the numbers to be played down); [[w.reeves-president-kennedy]], 283 (the defoliation plans approved Jan. 3; the first targets sixteen miles of Route 15). [[w.selverstone-kennedy-withdrawal]], 56 (Kennedy with the Chiefs; the numbers played down; no combat). To check: [FRUS 1961–63, II, doc. 3](https://history.state.gov/historicaldocuments/frus1961-63v02/d3) (Gilpatric to Lemnitzer, Jan. 4: a cover story or public explanation for the reports; cited by [[w.moyar-triumph-forsaken]], 148 n.2). See [[cal.1961-11-22.vietnam]]. Names: Kennedy, Johnson, McNamara, Taylor, Harkins, Gilpatric.'
    src:
      c: ecc6c033
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v02/d2: all'
        - 'w.moyar-triumph-forsaken 148: A, C'
        - 'via w.moyar-triumph-forsaken 148 n.1: A, C'
        - 'w.selverstone-kennedy-withdrawal 56: B, D-E'
        - 'via w.selverstone-kennedy-withdrawal 56 n.18: B, D-E'
        - 'w.reeves-president-kennedy 283: F'
    tags: [name:kennedy-john-f, name:johnson-lyndon-b, name:mcnamara-robert-s, name:taylor-maxwell, name:harkins-paul-d, name:gilpatric-roswell-l]
