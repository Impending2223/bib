    when: Jan. 28
    date: '1962-01-28'
    place: paris
    thread: soviet-union
    c: Paris, night, the cocktail party at Minister Cecil Lyon's. Salinger and Kharlamov, as agreed, say nothing of the television exchange; Kharlamov denies a Kremlin crisis and calls Molotov "a political cadaver." Baraduc of the French Foreign Office, who had tipped the press, eavesdrops, and quarrels with Kharlamov over the expulsions of correspondents. By Salinger's account.
    n: '[[w.salinger-with-kennedy]], 211. Check: the day. See [[cal.1962-01-28.soviet-union]]. Names: Lyon, Salinger, Kharlamov, Molotov, Baraduc.'
