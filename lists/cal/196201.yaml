    c: 'Craig, for the Defense Department and the Joint Chiefs on the Mongoose working group, to Lansdale: Operation Bounty, "a system of financial rewards, commensurate with position and stature, for killing or delivering alive known Communists," from $5,000 for an "informer" to $100,000 for "government officials"; a reward of "2¢" for Castro. Lansdale, 1975, "tabled" it: "I did not think that it was something that should be seriously undertaken or supported further."'
