    c: The White House, 10 p.m. Kennedy with Sorensen, Bundy and Schlesinger for a last review of the State of the Union text. Schlesinger finds the domestic section, which he had tried to give a philosophical coherence, "reduced again to a laundry list," and urges a paragraph to tie the program together and relate it to the New Frontier; Kennedy agrees. The foreign section and the peroration, to a little after 11. By Schlesinger's journal.
