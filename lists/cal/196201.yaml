    c: 'Deng Xiaoping 邓小平, at Mao Zedong''s 毛泽东 charge, calls Luo Ruiqing 罗瑞卿, Xu Shiyou 许世友, Chen Pixian 陈丕显, Jiang Weiqing 江渭清, Jiang Hua 江华 and others together on unified Party, government and army leadership of the Zhoushan 舟嵊 area: its local work to Zhejiang 浙江; a prefectural committee over five small counties, a strong one; the "three unifications", military, political and economic.'
