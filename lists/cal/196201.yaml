  - id: cal.1962-01-27.china-leadership-2
    when: Jan. 27
    date: '1962-01-27'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi, for the Central Committee, presents the written report to the enlarged Central Work Conference, formally issued to the participants. It analyzes the economy''s present state and the causes of the difficulties, sums up the lessons of socialist construction since 1958 and takes the Central Committee''s responsibility. The main faults and errors since 1958: plan targets for industry and agriculture too high and the capital construction line too long, so the national economy''s proportions, consumption and accumulation, fell badly out of balance; in the communes many places for a time blurred the line between collective and whole-people ownership, broke the rules of pay by work and exchange at equal value, and did the "communist wind" and other egalitarianism; many complete industrial systems set up everywhere and too much power sent down, so decentralism grew; the speed of farm growth overestimated and construction demanded too fast, so the town population grew wrongly large. The causes: the Party''s inexperience in building, and many leading comrades not modest and careful enough, against the Party''s tradition of seeking truth and the mass line, and in some degree weakening democratic centralism. The present difficulties are fairly serious and must be reckoned fully; adjustment begun in agriculture a year before is to go on for a time. The report is in his Selected Works.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 546–547 (Jan. 27, 1962). Made public: 1996. To check: [[w.shaoqi-liu-shaoqi-xuanji-selected]], the report to the enlarged Central Work Conference (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 547). Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
