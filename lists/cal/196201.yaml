    c: 'The President''s office, shortly before midnight. Kennedy to Salinger on Bolshakov''s messages: go ahead with the television exchanges; delay the answer on Moscow; decline Robert Kennedy''s invitation, "quietly and before the Russians announce it," since he should not be in the picture; he will have the Adzhubeis to lunch. By Salinger''s account.'
