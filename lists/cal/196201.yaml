  - id: cal.1962-01-03.defense
    when: Jan. 3
    date: '1962-01-03'
    thread: defense
    c: 'Palm Beach, the final budget review: Kennedy polls each of the Joint Chiefs. Smith, for LeMay: McNamara''s program would dangerously reduce American superiority after 1965; 100 more Minuteman in fiscal 1963, the B-70 developed in full. Decker: the Army "done well by," the 960,000 ceiling leaving little leeway. Anderson: "a better Navy." Lemnitzer: military assistance for fiscal 1963 shaved to $1.5 billion.'
    n: 'Memorandum for the record, [FRUS 1961–63, VIII: National Security Policy, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v08/d66) (Jan. 3, 1962). [[w.poole-joint-chiefs-of-staff]], 9, 41, 68, 220; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 90–91. Names: Kennedy, McNamara, LeMay, Decker, Anderson, Lemnitzer.'
