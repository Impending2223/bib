  - id: cal.1962-01-10.china-leadership
    when: Jan. 10
    date: '1962-01-10'
    time: 1962-01-10T02:00Z
    thread: china-leadership
    c: 'Mao on the draft report to the enlarged Central Work Conference, which Liu Shaoqi and Deng Xiaoping drafted: reads parts one and two (Jan. 9–10); at 10 a.m. tells Tian Jiaying, with word to Liu, Deng and Chen Boda, to put the report back three days, the delegates to discuss in groups meanwhile; then to Deng, Chen and Tian: the report''s center (against "dispersionism") stands, but it goes to the delegates now, for comment, before the Politburo takes it up. "You make me a sage in this report." The General Office sends out the draft the same day.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 9, 1962 (the entry for Jan. 9–10). [[w.macfarquhar-origins-of-the-cultural]], III, 142–143 (Mao on the draft report: to be issued to the conferees before the Politburo discusses it); [[w.jianguo-yilai-mao-zedong]], XVI, 197–201 (Jan. 10, 1962; Mao''s note of 10 a.m. on parts one and two of the draft: put the report back three days, the groups to discuss the rural accounting unit and Zhou''s report on the CPSU congress meanwhile; the General Office issues the draft that day, note 1); [[w.yang-shangkun-riji]], II, 110 (Jan. 10, 1962; noon, Chen Boda and Tian Jiaying to Yang Shangkun on the talk at Mao''s: the center stands; the report to the conference at once, three days in groups); [[w.mao-zedong-zhuan]], V, ch. 69 n.9 (Jan. 10, 10 a.m.: Mao has read the first two parts of Liu Shaoqi''s report: good, but not yet thought through, to be read a second time; the third part unread; then with Deng Xiaoping, Chen Boda and Tian Jiaying he holds that its center, against dispersionism, stands and must be held to, and has the draft printed for the delegates, three days of group discussion, comments invited). [[w.yang-jisheng-mubei]], II, 1111 n.2 (Liu sends the first draft on Jan. 8 and 9, the second draft''s first two parts at 11 p.m. on the 9th; Mao reads through the night and at 10 a.m. on the 10th proposes putting the report back three days, for talk on the rural basic accounting unit and other questions; he then changes his mind, leaves the third part unread, and has the report printed for three days'' group discussion before the Politburo takes it up); [[w.yang-jisheng-tiandi-fanfu]], I, 65 (Mao, up all night of the 9th, reads the first two parts; at 10 a.m. proposes putting the report back three days, then will not read part three: the report printed at once for the conference, three days in groups, revised on their views, then to the Politburo). Made public: 2013. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 110) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 69), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: the draft report (first draft), Jan. 10, 1962; [[w.schram-mao-tse-tung-unrehearsed]], 158–87 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 143 n.17a); [[w.zedong-mao-zedong-zhuzuo-xuandu]], xia, 814–38 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 143 n.17b); [[w.zhonggong-dangshi-jiaoxue-cankao-n-d]], 1–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 143 n.17c); Mao Zedong 毛泽东, comment to Tian Jiaying 田家英 with word to Liu Shaoqi, Deng Xiaoping and Chen Boda on the draft report (manuscript 手稿), Jan. 10, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.9). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Chen Boda, Tian Jiaying.'
