  - id: cal.1962-01.civil-rights-the-executive
    when: Jan.
    date: 1962-01
    thread: civil-rights-the-executive
    c: 'Wofford, back from six weeks arranging Peace Corps projects in Africa, to the President: ending discrimination at home will do more for relations with Africa than anything else, but "the greater problem of integration is our integration into this largely colored world." He asks leave to shift to "the big integration," and that Louis Martin come to the White House in his place, "for we are heading into stormier weather with Negro leadership in view of the rising disappointment over our current slower strategy."'
    n: '[[w.wofford-of-kennedys-and-kings]], 166. To check: Wofford to Kennedy, January 1962 (quoted by [[w.wofford-of-kennedys-and-kings]], 166). Check: the day. Names: Wofford, Kennedy.'
