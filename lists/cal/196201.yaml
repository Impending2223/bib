    c: 'Diaoyutai, Building 12, evening. Mao, with Liu Shaoqi, Deng Xiaoping, Chen Boda and Tian Jiaying, on the report: many objections to the first draft; proposes a drafting committee of the regional bureaus'' first secretaries and others, who are to settle the main contradiction first and may overturn the draft whole. The committee is formed that night, 21 men: Liu, Zhou Enlai, Deng, Chen Yun, Lin Biao, Peng Zhen, Li Fuchun, Li Xiannian, Ke Qingshi, Li Jingquan, Chen Boda, Bo Yibo, Tao Zhu, Ulanhu, Liu Lantao, Song Renqiong, Yang Shangkun, Wang Renzhong, Hu Sheng, Tian Jiaying, Wu Lengxi. It meets daily from Jan. 17 under Liu; second draft Jan. 24.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 16, 1962. [[w.yang-shangkun-riji]], II, 113 (Jan. 16, 1962; by Tian Jiaying''s word to Yang Shangkun: a drafting committee of 20, to settle the main contradiction first, then write); [[w.deng-xiaoping-nianpu-1904]], III, 1684 (Jan. 16, 1962; evening; Deng at Mao''s meeting on the report; at Mao''s proposal a drafting committee of twenty-one, the bureaus'' first secretaries and some central leaders, to settle first the chief contradiction); [[w.mao-zedong-zhuan]], V, ch. 69 nn.10, 12 (Jan. 16, evening, at Building 12, Diaoyutai: Liu Shaoqi, Deng Xiaoping, Chen Boda and Tian Jiaying with Mao; Mao takes no position, urges that all differing views be aired, and has a drafting committee set up, the bureaus'' first secretaries in it, twenty-one men, to settle the main contradiction first (Yang Shangkun''s diary, II, 112–113)). [[w.peng-zhen-nianpu-1902]], IV, 168 (Jan. 16, 1962; Mao: the conference first to settle the principal contradiction; a drafting committee of twenty-one under Liu Shaoqi: Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Bo Yibo, Chen Boda, Ke Qingshi, Song Renqiong, Ulanhu, Tao Zhu, Liu Lantao, Li Jingquan, Wang Renzhong and others). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 113) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 69). See [[cal.1962-01-11.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Yun, Lin Biao, Peng Zhen, Li Fuchun, Li Xiannian, Ke Qingshi, Li Jingquan, Chen Boda, Bo Yibo, Tao Zhu, Ulanhu, Liu Lantao, Song Renqiong, Yang Shangkun, Wang Renzhong, Hu Sheng, Tian Jiaying, Wu Lengxi.'
