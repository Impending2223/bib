  - id: cal.1962-01-12.vietnam-congress
    when: Jan. 12
    date: '1962-01-12'
    thread: vietnam-congress
    c: 'Nolting before Foreign Relations in executive session, asked whether the United States is at war in Vietnam: one adviser killed; "as of now" the advisers not in combat. Morse: "flag-draped coffins" would divide the country. Capehart: "Are we at war now in Vietnam?" Nolting: "I think the answer to that is no"; the campaign "long, drawn-out," "five years or more."'
    n: '[[w.gibbons-u-s-government-and]], II, 108, 110; [[w.mann-grand-delusion]], 254–56 (the advisers; Capehart; Morse''s dissent). To check: the Foreign Relations Committee''s executive session transcript, Jan. 12, 1962 (cited by [[w.gibbons-u-s-government-and]], II, 108 n.80; printed, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XIV, 31–65, cited by [[w.mann-grand-delusion]], 255 n.1, 256 n.4). Names: Nolting, Morse, Capehart.'
    src:
