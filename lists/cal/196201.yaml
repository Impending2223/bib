  - id: cal.1962-01-08.soviet-union
    when: Jan. 8
    date: '1962-01-08'
    thread: soviet-union
    also: [berlin-and-vienna]
    c: 'A rump Presidium, Mikoyan absent; Khrushchev to the leadership and the diplomats on the Berlin talks: "The enemy is strong . . . not weaker than we are"; Kennedy "lacks authority, moral or political"; "Eisenhower or Kennedy—[they are] the same shit." No deadline, but the pressure kept: "We should increase the pressure . . . be just like a meniscus. . . . If we don''t have a meniscus, we let the enemy live peacefully." A "final fight on the issue of West Berlin" inevitable; the GDR''s economy to be turned away from West Germany.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 5–6, 412–16; [[w.prezidium-tsk-kpss-1954]], I, 535–49 (Protocol 11 and the stenogram). Made public: the stenogram, some forty years later ([[w.fursenko-khrushchevs-cold-war]], 5). See [[cal.1962-01-02.berlin-and-vienna]]. Names: Khrushchev, Kennedy, Eisenhower, Mikoyan.'
    src:
      c: a48ade56
      rows:
        - 'w.fursenko-khrushchevs-cold-war 5–6, 412–16: all'
        - 'via w.fursenko-khrushchevs-cold-war 412 n.10: all'
        - 'w.prezidium-tsk-kpss-1954 I, 535–49: all'
        - 'via x.1962-01-08.presidium-protocol-11-stenogram: all'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:eisenhower-dwight-d, name:mikoyan-anastas]
