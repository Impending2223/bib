    c: 'The Bishan 壁山 county committee reports to the Sichuan 四川 provincial committee on disease prevention in 1961 and opinions on later work 《關於1961年防治疾病情況及今後工作意見的報告》. Deaths since 1959: 13,058 in 1959 (3.2 percent of the people), about 20,000 in 1960 (5.9 percent), 21,685 in 1961, of them 20,987 in the countryside, 6.2 percent of its people; 55,000 in the three years, 15 percent of the county. The provincial office prints it Jan. 11 for Secretaries Liao 廖 and Du 杜 and the Secretary-General.'
    n: '[[w.yang-jisheng-mubei]], I, 206. Made public: 2008. To check: Bishan County Committee, "Report on disease prevention in 1961 and opinions on later work," Jan. 2, 1962, Sichuan Provincial Committee incoming document no. [62]208, printed Jan. 11 for Liao, Du and the Secretary-General (cited by [[w.yang-jisheng-mubei]], I, 206 n.38).'
