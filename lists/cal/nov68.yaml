# Cal. CIX November 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CIX
entries:
  - id: cal.1968-11-01.vietnam
    when: Nov. 1
    date: '1968-11-01'
    thread: vietnam
    c: 'The Accelerated Pacification Campaign opens, to run to Jan. 31: about 1,000 contested hamlets to be brought under the Saigon government; the attack on the Viet Cong infrastructure, the Phoenix program, pressed. Abrams in command; Colby, Komers deputy, to head CORDS (Check the figure and the dates). Dec. 16, the CIA stations assessment of Phoenix: "encouraging progress," but no significant reduction yet in the Communists ability to carry on.'
    n: 'FRUS 1964–68, VII, doc. [256](https://history.state.gov/historicaldocuments/frus1964-68v07/d256). [[w.hunt-pacification]]; [[w.sorley-better-war]]; [[w.colby-lost-victory]]; [[w.andrade-ashes-to-ashes]]. Made public: FRUS 1964–68, VII (2003). Names: Abrams, Colby, Komer.'
    tags: [name:abrams-creighton, name:colby-william-e, name:komer-robert-w]
  - id: cal.1968-11-02.vietnam
    when: Nov. 2–6
    date: '1968-11-02'
    thread: vietnam
    c: 'Saigon. Thiệu to the National Assembly in joint session: his government will not go to the Paris meeting set for Nov. 6; it will talk with Hanoi, not with the NLF as a delegation of its own. Bunker, the same day: Saigon will not come to the substantive meetings until the procedures are agreed, and wants the NLF counted part of Hanois delegation; he urges the first meeting put off. Nov. 6, the meeting postponed indefinitely.'
    n: 'FRUS 1964–68, VII, docs. [180](https://history.state.gov/historicaldocuments/frus1964-68v07/d180), [182](https://history.state.gov/historicaldocuments/frus1964-68v07/d182), [199](https://history.state.gov/historicaldocuments/frus1964-68v07/d199). See [[cal.1968-05-13.vietnam]]. Names: Nguyễn Văn Thiệu, Bunker.'
    tags: [name:nguyen-van-thieu, name:bunker-ellsworth]
  - id: cal.1968-11-02.elections-1968
    when: Nov. 2–4
    date: '1968-11-02'
    thread: elections-1968
    also: [vietnam]
    c: 'Nov. 2, 9:18 p.m., Johnson telephones Dirksen, on Cliffords advice: Nixons people have told Saigon to hold out until after the election; "This is treason." Nov. 3, Smathers: Nixon fears Johnson will charge him with having "connived with John Tower and Anna Chennault." Nixon to Johnson from Los Angeles, after *Meet the Press*: any talk of sabotaging Saigons attitude has "absolutely no credibility, as far as I am concerned." Nov. 4, a question from the *Christian Science Monitor*: Johnson will confirm nothing; Rusk, Clifford and Rostow to meet on it.'
    n: '[Johnson and Dirksen, 9:18 p.m., Nov. 2](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-3-1968), Conversation WH6811-01-13706; [Johnson and Smathers, 1:25 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-smathers-november-3-1968), Conversation WH6811-02-13708-13709; [Johnson and Nixon, 1:54 p.m., Nov. 3](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-november-3-1968), Conversation WH6811-02-13710; [Johnson, Clifford, Rusk and Rostow, 12:27 p.m., Nov. 4](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-conference-call-clark-clifford-dean-rusk-walt), Conversation WH6811-03-13713-13714 (Miller Center). FRUS 1964–68, VII, docs. [181](https://history.state.gov/historicaldocuments/frus1964-68v07/d181), [186](https://history.state.gov/historicaldocuments/frus1964-68v07/d186), [187](https://history.state.gov/historicaldocuments/frus1964-68v07/d187), [192](https://history.state.gov/historicaldocuments/frus1964-68v07/d192). [[w.hughes-chasing-shadows]]; [[w.chennault-education-of-anna]]; [[w.diem-in-the-jaws-of]]; [[w.farrell-richard-nixon]]. See [[@chennault]]. Made public: FRUS 1964–68, VII (2003). Names: Johnson, Dirksen, Clifford, Nixon, Smathers, Tower, Chennault, Rusk, Rostow.'
    tags: [name:johnson-lyndon-b, name:dirksen-everett, name:clifford-clark, name:nixon-richard-m, name:smathers-george-a, name:tower-john-g, name:chennault-anna, name:rusk-dean, name:rostow-walt-w]
  - id: cal.1968-11-03.elections-1968
    when: Nov. 3
    date: '1968-11-03'
    thread: elections-1968
    c: 'Houston, the Astrodome. Johnson with Humphrey at a Democratic rally, two days before the election. That night, Johnsons remarks broadcast for the Democratic Victory Committee.'
    n: '[Remarks at the Astrodome in Houston at a Democratic Party Rally](https://www.presidency.ucsb.edu/documents/remarks-the-astrodome-houston-democratic-party-rally) (Nov. 3, 1968); [Remarks Broadcast on a Program Sponsored by the Democratic Victory Committee](https://www.presidency.ucsb.edu/documents/remarks-broadcast-program-sponsored-the-democratic-victory-committee) (Nov. 3, 1968). [[w.solberg-hubert-humphrey]]; [[w.white-making-of-the-president-1969]]. See [[cal.1968-08-26.elections-1968]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, state:tx, city:houston]
  - id: cal.1968-11-05.elections-1968
    when: Nov. 5
    date: '1968-11-05'
    thread: elections-1968
    c: 'Nixon elected: 31,783,783 votes, 43.4 percent; Humphrey 31,271,837, 42.7; Wallace (American Independent) 9,910,517, 13.5. Electoral votes as cast Dec. 16: Nixon 301, thirty-two States; Humphrey 191, thirteen States and the District; Wallace 46, Alabama, Arkansas, Georgia, Louisiana and Mississippi, and one North Carolina elector. Agnew Vice President. House 243 D–192 R, from 248–187 at the 90ths opening. Senate 58 D–42 R, Republicans up five: Goldwater in Arizona; Gurney in Florida; Mathias over Brewster in Maryland; Saxbe in Ohio; Bellmon over Monroney in Oklahoma; Packwood over Morse in Oregon, 50.2 percent; Schweiker over Clark in Pennsylvania. Democratic gains: Cranston in California, Hughes in Iowa. In New Yorks 12th, Shirley Chisholm (D) over Farmer: the first Negro woman elected to Congress.'
    n: '[*Statistics of the Presidential and Congressional Election of November 5, 1968*](https://clerk.house.gov/member_info/electionInfo/1968election.pdf) (Clerk of the House). [Telegram to President-Elect Richard M. Nixon](https://www.presidency.ucsb.edu/documents/telegram-president-elect-richard-m-nixon); [Telegram to Vice President Hubert H. Humphrey](https://www.presidency.ucsb.edu/documents/telegram-vice-president-hubert-h-humphrey) (Nov. 5, 1968, released Nov. 6). FRUS 1964–68, VII, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v07/d199). [[w.white-making-of-the-president-1969]]; [[w.chester-american-melodrama]]; [[w.witcover-year-the-dream-died]]; [[w.gould-1968]]; [[w.nelson-resilient-america]]; [[w.perlstein-nixonland-2008]]; [[w.carter-politics-of-rage-1995]]; [[w.solberg-hubert-humphrey]]; [[w.nixon-rn]]. See [[cal.1968-08-26.elections-1968]]. Names: Nixon, Humphrey, Wallace, Agnew, Goldwater, Gurney, Mathias, Brewster, Saxbe, Bellmon, Monroney, Packwood, Morse, Schweiker, Clark, Cranston, Hughes, Chisholm, Farmer.'
    tags: [election:1968, name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:agnew-spiro-t, name:goldwater-barry-m, name:gurney-edward-j, name:mathias-charles-mcc-jr, name:brewster-daniel-b, name:saxbe-william-b, name:bellmon-henry, name:monroney-almer-s, name:packwood-robert-w, name:morse-wayne, name:schweiker-richard-s, name:clark-joseph-s, name:cranston-alan, name:hughes-harold-e, name:chisholm-shirley, name:farmer-james, name:johnson-lyndon-b]
  - id: cal.1968-11-05.specials
    when: Nov. 5
    date: '1968-11-05'
    thread: specials
    c: 'Pennsylvania 20th, special, held with the general election. Gaydos (D) elected for the rest of the term of Holland (D), who died Aug. 9; the same day, the full term, 109,236 to 44,037 for the Republican.'
    n: 'Full term: [*Statistics of the Presidential and Congressional Election of November 5, 1968*](https://clerk.house.gov/member_info/electionInfo/1968election.pdf), 40; the Clerk prints the regular race only. Check: the specials returns (Pa. *Manual*). See [[@special-tx3]]. Names: Gaydos, Holland.'
    tags: [special:1968-11-05-h-PA-20, name:gaydos-joseph-m, name:holland-elmer-j, state:pa]
  - id: cal.1968-11-06.elections-1968
    when: Nov. 6
    date: '1968-11-06'
    thread: elections-1968
    c: 'Humphrey concedes at Minneapolis, his telegram to Nixon: "you will have my support in unifying and leading the nation." Nixon at the Waldorf-Astoria in New York: a teenagers sign at Deshler, Ohio, "Bring Us Together," "the great objective of this Administration at the outset."'
    n: '[Remarks Conceding the Presidential Election in Minneapolis, Minnesota](https://www.presidency.ucsb.edu/documents/remarks-conceding-the-presidential-election-minneapolis-minnesota) (Nov. 6, 1968); [Remarks in New York City Accepting Election as the 37th President of the United States](https://www.presidency.ucsb.edu/documents/remarks-new-york-city-accepting-election-the-37th-president-the-united-states) (Nov. 6, 1968). See [[cal.1968-11-05.elections-1968]]. Names: Humphrey, Nixon.'
    tags: [name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1968-11-06.students
    when: Nov. 6–Dec. 2
    date: '1968-11-06'
    thread: students
    c: 'San Francisco State College. The Black Students Union and the Third World Liberation Front strike on fifteen demands, a department of black studies and the admission of nonwhite applicants among them. Police on the campus; classes suspended (Check the dates). Nov. 26, the president resigns; the trustees name Hayakawa acting president. Dec. 2, the campus reopened; Hayakawa pulls the wires from the strikers sound truck.'
    n: '[[w.orrick-shut-it-down]]; [[w.rojas-from-black-power-to]]; [[w.cannon-governor-reagan]]. Names: Hayakawa.'
    tags: [name:hayakawa-s-i, state:ca, city:san-francisco]
  - id: cal.1968-11-08.africa
    when: Nov. 8
    date: '1968-11-08'
    thread: africa
    c: 'Nigeria. $2.5 million to the International Committee of the Red Cross for the victims of the civil war, beyond the $10 million in money, food and equipment already given and $4.3 million from American voluntary agencies. Johnson: the dispute "a Nigerian and an African problem—not an American one"; both parties asked to end the war.'
    n: '[Statement by the President Upon Authorizing Aid to Victims of the Civil War in Nigeria](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-authorizing-aid-victims-the-civil-war-nigeria) (Nov. 8, 1968). [[w.thompson-american-policy-and-african]]; [[w.stremlau-international-politics-of-the]]. See [[cal.1967-05-30.africa]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-11-08.elections-1968
    when: Nov. 8–13
    date: '1968-11-08'
    thread: elections-1968
    also: [vietnam]
    c: 'Nov. 8, Dirksen to Johnson: he has told Nixon that "they send some of the boys out to stiffen Thieus spine"; Nixon says he sent no one. Nixon to Johnson from Key Biscayne, Fla., that night. Nov. 10, the FBI to the NSC staff: Bùi Diễm has reported to Thiệu what Dirksen told him. Nov. 12, Johnson to DeLoach: check the calls from Agnews campaign plane at Albuquerque, Nov. 2. Nov. 13, DeLoach: five calls from one telephone on the plane, Agnews to Rusk among them, one to the Nixon–Agnew headquarters in Washington.'
    n: '[Johnson and Dirksen, 2:54 p.m., Nov. 8](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-everett-dirksen-november-8-1968), Conversation WH6811-03-13722; [Johnson and Nixon, 9:23 p.m., Nov. 8](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-nixon-and-telephone-operator-november), Conversation WH6811-04-13723-13724-13725; [Johnson and DeLoach, 8:30 p.m., Nov. 12](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cartha-deloach-and-office-conversation-1), Conversation WH6811-04-13730; [Johnson and DeLoach, 5:15 p.m., Nov. 13](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cartha-deloach-november-13-1968), Conversation WH6811-04-13733 (Miller Center). FRUS 1964–68, VII, docs. [205](https://history.state.gov/historicaldocuments/frus1964-68v07/d205), [207](https://history.state.gov/historicaldocuments/frus1964-68v07/d207), [209](https://history.state.gov/historicaldocuments/frus1964-68v07/d209), [212](https://history.state.gov/historicaldocuments/frus1964-68v07/d212). See [[cal.1968-11-02.elections-1968]]. Made public: FRUS 1964–68, VII (2003). Names: Dirksen, Johnson, Nixon, Bùi Diễm, Nguyễn Văn Thiệu, DeLoach, Agnew, Rusk.'
    tags: [name:dirksen-everett, name:johnson-lyndon-b, name:nixon-richard-m, name:bui-diem, name:nguyen-van-thieu, name:deloach-cartha, name:agnew-spiro-t, name:rusk-dean]
  - id: cal.1968-11-11.transition-and-staff
    when: Nov. 11–15
    date: '1968-11-11'
    thread: transition-and-staff
    c: 'Nixon at the White House: lunch with the Johnsons; in the Cabinet Room, Rusk, Clifford, Wheeler, Helms and Rostow brief him on Vietnam, the Middle East and Eastern Europe. Rusk asks for a man of Nixons next to his office. Nixon: Vietnam and other matters "cannot await decision and cannot afford a gap of 2 months." Nov. 15, Johnsons news conference: Robert Murphy, Nixons liaison and observer with the Secretary of State; "the decisions that will be made between now and January 20th will be made by this President."'
    n: '[Remarks to the Press With President-Elect Nixon Following Their Luncheon Meeting at the White House](https://www.presidency.ucsb.edu/documents/remarks-the-press-with-president-elect-nixon-following-their-luncheon-meeting-the-white) (Nov. 11, 1968); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1214) (Nov. 15, 1968). FRUS 1964–68, VII, doc. [211](https://history.state.gov/historicaldocuments/frus1964-68v07/d211). [[w.christian-president-steps-down]]; [[w.johnson-vantage-point]]; [[w.nixon-rn]]. Names: Nixon, Johnson, Rusk, Clifford, Wheeler, Helms, Rostow, Murphy.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:rusk-dean, name:clifford-clark, name:wheeler-earle, name:helms-richard, name:rostow-walt-w, name:murphy-robert-d]
  - id: cal.1968-11-12.court
    when: Nov. 12
    date: '1968-11-12'
    thread: court
    c: '*Epperson v. Arkansas*, [393 U.S. 97](https://tile.loc.gov/storage-services/service/ll/usrep/usrep393/usrep393097/usrep393097.pdf): Arkansass statute of 1928, forbidding the teaching in its schools that man descended from a lower order of animals, void under the First Amendment, on a Little Rock biology teachers suit. Fortas for the Court: the First Amendment "does not permit the State to require that teaching and learning must be tailored to the principles or prohibitions of any religious sect or dogma." Black, Harlan and Stewart concurring separately.'
    n: 'Opinion (K–J Cong. II.J.1). [[w.larson-trial-and-error]]; [[w.larson-summer-for-the-gods]]; [[w.powe-warren-court-and-american]]. Names: Fortas.'
    tags: [name:fortas-abe, state:ar]
  - id: cal.1968-11-12.vietnam
    when: Nov. 12
    date: '1968-11-12'
    thread: vietnam
    c: 'Cliffords news conference at the Pentagon: Saigon assented to each step of the October understanding, "as clear as two partners can have"; the President "absolutely right in not giving Saigon a veto on the plan."'
    n: 'FRUS 1964–68, VII, doc. [213](https://history.state.gov/historicaldocuments/frus1964-68v07/d213). [[w.clifford-counsel-to-the-president-2]]. See [[cal.1968-05-13.vietnam]]. Names: Clifford.'
    tags: [name:clifford-clark]
  - id: cal.1968-11-12.soviet-union
    when: Nov. 12
    date: '1968-11-12'
    thread: soviet-union
    also: [europe-and-the-alliance]
    c: 'Warsaw, the Polish partys Fifth Congress. Brezhnev: when forces hostile to socialism try to turn a socialist country toward capitalism, it is the concern of all the socialist countries; military aid to a fraternal country against such a threat, as in Czechoslovakia, an extraordinary step (Check the words).'
    n: '[[w.ouimet-rise-and-fall-of]]; [[w.valenta-soviet-intervention-in-czechoslovakia]]. See [[cal.1968-08-20.soviet-union]]. Names: Brezhnev.'
    tags: [name:brezhnev-leonid]
  - id: cal.1968-11-14.europe-and-the-alliance
    when: Nov. 14–16
    date: '1968-11-14'
    thread: europe-and-the-alliance
    also: [soviet-union]
    c: 'Brussels, the NATO ministers, a month early after Czechoslovakias invasion. The communiqué: any Soviet intervention directly or indirectly affecting the situation in Europe or the Mediterranean would "create an international crisis with grave consequences." The allies to spend more on their forces; France with the other fourteen on the political issues. Rusk reads a statement from Nixon on his commitment to NATO.'
    n: 'FRUS 1964–68, XIII, docs. [336](https://history.state.gov/historicaldocuments/frus1964-68v13/d336), [337](https://history.state.gov/historicaldocuments/frus1964-68v13/d337). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1214) (Nov. 15, 1968). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1968-08-20.soviet-union]]. Names: Rusk, Nixon.'
    tags: [name:rusk-dean, name:nixon-richard-m]
  - id: cal.1968-11-18.economy
    when: Nov. 18–24
    date: '1968-11-18'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'The franc and the mark. Nov. 18, Johnson to Kiesinger through Fowler: no unilateral French devaluation; the monetary authorities to act together. Bonn, Nov. 20–22, the Group of Ten: Schiller, Germany will not revalue; a border-tax adjustment of 4 percent on exports and imports instead. A standby credit of $2 billion for the franc, $500 million of it American; any devaluation of the franc not to exceed 11 percent. Nov. 23, de Gaulle keeps the francs parity. Nov. 24, Johnsons message: "ready to cooperate in any way we can."'
    n: 'FRUS 1964–68, VIII, docs. [208](https://history.state.gov/historicaldocuments/frus1964-68v08/d208), [216](https://history.state.gov/historicaldocuments/frus1964-68v08/d216), [219](https://history.state.gov/historicaldocuments/frus1964-68v08/d219), [221](https://history.state.gov/historicaldocuments/frus1964-68v08/d221). [Message to President de Gaulle Concerning His Decision To Maintain the Value of the Franc](https://www.presidency.ucsb.edu/documents/message-president-de-gaulle-concerning-his-decision-maintain-the-value-the-franc) (Nov. 24, 1968). [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]]; [[w.eichengreen-globalizing-capital]]. See [[cal.1967-11-18.economy]]. Made public: FRUS 1964–68, VIII (1998). Names: Johnson, Kiesinger, Fowler, Schiller, de Gaulle.'
    tags: [name:johnson-lyndon-b, name:kiesinger-kurt-georg, name:fowler-henry-h, name:schiller-karl, name:de-gaulle-charles]
  - id: cal.1968-11-20.jobs-and-wages
    when: Nov. 20–30
    date: '1968-11-20'
    thread: jobs-and-wages
    c: 'Farmington, W. Va. Explosions and fire in Consolidation Coals No. 9 mine: 78 men trapped below; none brought out. Nov. 30, the mine sealed. Johnson: his Occupational Health and Safety Act and Coal Mine Safety Act, sent to Congress this year, "will help, and they must be passed."'
    n: '[Statement by the President on the Mine Disaster at Mannington, West Virginia](https://www.presidency.ucsb.edu/documents/statement-the-president-the-mine-disaster-mannington-west-virginia) (Nov. 30, 1968). [[w.derickson-black-lung]]; [[w.armbrister-act-of-vengeance]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:wv]
  - id: cal.1968-11-25.soviet-union
    when: Nov. 25–Dec. 18
    date: '1968-11-25'
    thread: soviet-union
    also: [testing, transition-and-staff]
    c: 'The missile talks and a summit. Johnson to Nixon, the paper given Murphy Nov. 26: in "these nuclear matters" he "must take clear responsibility," keeping Nixons flexibility after Jan. 20. Nov. 26, Rusk: "it would be good for the President and Kosygin to meet." Nixons aide Ellsworth to Dobrynin: Nixon objects to a summit (Dobrynins account). Dec. 18, Moscows message to Nixon; Kissinger to Sedov of the Soviet embassy: whether Moscow accepts a summit before Jan. 20 a "crucial test" of its intentions; the new administration will not be "boxed in." No summit.'
    n: 'FRUS 1964–68, XIV, docs. [322](https://history.state.gov/historicaldocuments/frus1964-68v14/d322), [334](https://history.state.gov/historicaldocuments/frus1964-68v14/d334), [335](https://history.state.gov/historicaldocuments/frus1964-68v14/d335); FRUS 1964–68, VII, doc. [237](https://history.state.gov/historicaldocuments/frus1964-68v07/d237). [[w.garthoff-detente-and-confrontation]]; [[w.newhouse-cold-dawn]]; [[w.dobrynin-in-confidence]], 186–87; [[w.seaborg-stemming-the-tide]]. See [[cal.1967-03-02.soviet-union]]; [[cal.1968-08-20.soviet-union]]. Made public: FRUS 1964–68, XIV (2001). Names: Johnson, Nixon, Murphy, Rusk, Kosygin, Ellsworth, Dobrynin, Kissinger, Sedov.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:murphy-robert-d, name:rusk-dean, name:kosygin-aleksei, name:ellsworth-robert, name:dobrynin-anatoly, name:kissinger-henry-a, name:sedov-boris]
  - id: cal.1968-11-26.vietnam
    when: Nov. 26
    date: '1968-11-26'
    thread: vietnam
    c: 'Saigon will send a delegation to Paris; its statement and the American, agreed in advance with the troop-contributing countries, released Nov. 27 in Saigon. Johnson: "a new and hopeful phase in the negotiations," but "both hard bargaining and hard fighting in the days ahead." Rusk, at the White House: "The logjam is broken."'
    n: '[Statement by the President on the Decision by the Republic of Vietnam To Participate in the Peace Talks in Paris](https://www.presidency.ucsb.edu/documents/statement-the-president-the-decision-the-republic-vietnam-participate-the-peace-talks) (Nov. 26, 1968). FRUS 1964–68, VII, docs. [236](https://history.state.gov/historicaldocuments/frus1964-68v07/d236), [237](https://history.state.gov/historicaldocuments/frus1964-68v07/d237). See [[cal.1968-05-13.vietnam]]. Names: Johnson, Rusk.'
    tags: [name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1968-11-27.middle-east
    when: Nov. 27
    date: '1968-11-27'
    thread: middle-east
    c: 'Warnke to Rabin: the United States agrees to sell Israel fifty F-4 Phantoms, with related equipment and services, the annexes to be negotiated. Rabins letter of Nov. 22 had reaffirmed that Israel will not be the first power to introduce nuclear weapons into the Middle East, and that no American aircraft will carry them.'
    n: 'FRUS 1964–68, XX, docs. [332](https://history.state.gov/historicaldocuments/frus1964-68v20/d332), [333](https://history.state.gov/historicaldocuments/frus1964-68v20/d333). [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.rabin-pinkas-sherut]]. See [[cal.1968-01-07.middle-east]]. Made public: FRUS 1964–68, XX (2001). Names: Warnke, Rabin.'
    tags: [name:warnke-paul, name:rabin-yitzhak]
