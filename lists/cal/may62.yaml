  - id: cal.1962-05.mississippi-ms
    when: May
    date: 1962-05
    thread: mississippi
    also: [voting-rights]
    c: 'After the Fifth Circuit''s injunction of Apr. 10 against Forrest County''s registrar, the legislature''s registration laws: every blank of the application to be filled "properly and responsively" without help; the registrar not to tell a rejected applicant why; applicants'' names published in the newspapers, any voter to challenge an applicant''s moral character; race no longer marked in the poll books. Check the dates of passage.'
    n: 'Miss. Laws 1962, chs. 569–574, as listed in *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf) (1965), n.10. [[w.lawson-black-ballots]]; [[w.dittmer-local-people]]. The Government''s suit against them: [[cal.1964-03-06.voting-rights]].'
    tags: [state:ms, city:hattiesburg]
