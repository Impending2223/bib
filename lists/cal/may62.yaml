  - id: cal.1962-05-24.legislatures-md
    when: May 24–31
    date: '1962-05-24'
    thread: legislatures
    c: 'Maryland. On remand from the Court of Appeals, Apr. 25, the Anne Arundel County Circuit Court holds the apportionment of the House of Delegates a denial of equal protection to Baltimore, Montgomery and Prince George''s Counties, May 24. Special session, May 25–31: 19 seats added for the term from 1963, 123 to 142, seven for Baltimore County; a constitutional apportionment refused. July 23, the Court of Appeals upholds the Senate, one Senator a county.'
    n: '*Maryland Committee for Fair Representation v. Tawes*, 228 Md. 412 (1962); its history in [377 U.S. 656](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377656/usrep377656.pdf) (1964). *Maryland Manual*, 1963–64, [p. 240](https://msa.maryland.gov/megafile/msa/speccol/sc2900/sc2908/000001/000171/html/am171--240.html). [[w.cortner-apportionment-cases]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]].'
    tags: [state:md]
  - id: cal.1962-05-25.opinion
    when: May 25
    date: '1962-05-25'
    thread: opinion
    c: 'Gallup, May 3–8: 75 percent have heard of the White Citizens Councils'' plan to send unemployed Negroes North free. Outside the South, 9 favorable, 71 unfavorable; in the South, 44 favorable, 34 unfavorable.'
    n: '[[w.gallup-poll]], III, 1768.'
  - id: cal.1962-05-25.georgia-ga
    when: May 25
    date: '1962-05-25'
    thread: georgia
    also: [legislatures, court]
    c: '*Toombs v. Fortson*, Atlanta. A three-judge court, Tuttle writing, declares the General Assembly malapportioned, both houses by counties, not people. No injunction for now: the State to reconstitute the legislature before the January 1963 session, the court keeping the case.'
    n: '*Toombs v. Fortson*, [205 F. Supp. 248](https://static.case.law/f-supp/205/html/0248-01.html) (N.D. Ga. 1962). [[w.bartley-creation-of-modern-georgia]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-04-28.georgia-ga]]. Names: Tuttle (K–J Cong. III.G).'
    tags: [name:tuttle-elbert-p, state:ga]
