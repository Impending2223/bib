# Cal. XIX May 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIX
entries:
  - id: cal.1962-05-05.elections-1962
    when: May 5
    date: '1962-05-05'
    thread: elections-1962
    also: [right-and-the-military]
    c: Texas Democratic primary. Connally leads for governor; Walker last of six.
    n: 'Results: CQ Almanac 1962; *Congress and the Nation*, vol. 1 (K–J Cong. II.L). Knaggs, *Two-Party Texas* (K–J Cong. II.H). Names: Connally (K–J Cong. III.F); Walker (K–J Adm. III.F).'
  - id: cal.1962-05-06.laos
    when: May 6
    date: '1962-05-06'
    thread: laos
    c: Nam Tha falls to the Pathet Lao and North Vietnamese. Phoumi's garrison flees to the Mekong.
    n: 'Rust, *So Much to Lose* (K–J Adm. II.D). Castle, *At War in the Shadow of Vietnam* (Viet. II.F). See [[cal.1961-03-23.laos]]. Names: Phoumi Nosavan (Viet. III.I).'
  - id: cal.1962-05-09.voting-rights
    when: May 9–14
    date: '1962-05-09'
    thread: voting-rights
    also: [rules]
    c: Senate twice refuses cloture on the literacy-test bill. Dropped.
    n: 'Senate cloture table, 87th Cong. ([senate.gov](https://www.senate.gov/legislative/cloture/87.htm)). See [[cal.1962-03-27.voting-rights]]. Names: Mansfield (K–J Cong. III.A); Russell (K–J Cong. III.B).'
  - id: cal.1962-05-09.vietnam
    when: May 9–11
    date: '1962-05-09'
    thread: vietnam
    c: McNamara's first visit. "Every quantitative measurement we have shows that we're winning this war." Check the date and words.
    n: 'Shapley, *Promise and Power* (K–J Adm. II.G.4). See [[cal.1961-01-28.vietnam]]. Names: McNamara (Viet. III.A).'
  - id: cal.1962-05-15.laos
    when: May 15
    date: '1962-05-15'
    thread: laos
    c: Marines and Army units to Thailand, about five thousand.
    n: Statement by the President (May 15, 1962). Check the title. See [[cal.1961-03-23.laos]].
  - id: cal.1962-05-20.medicare
    when: May 20
    date: '1962-05-20'
    thread: medicare
    c: 'Madison Square Garden rally for Medicare, televised. May 21: the AMA''s Annis answers from the empty Garden.'
    n: Address in New York City at a Rally in Support of Health Care for the Aged (May 20, 1962). Marmor, *The Politics of Medicare*; Harris, *A Sacred Trust* (K–J Cong. II.B). See [[cal.1961-02-09.medicare]].
  - id: cal.1962-05-24.missile-crisis
    when: May 24
    date: '1962-05-24'
    thread: missile-crisis
    c: 'The Presidium approves Khrushchev''s plan: medium- and intermediate-range missiles to Cuba, in secret. Castro agrees at month''s end. Check the date.'
    n: '*Prezidium TsK KPSS* (K–J Adm. II.D). Fursenko & Naftali, *"One Hell of a Gamble"*; Dobbs, *One Minute to Midnight*; Stern, *Averting "The Final Failure"*; Allison, *Essence of Decision* (K–J Adm. II.D). Robert F. Kennedy, *Thirteen Days* (K–J Adm. II.G.1). Martin J. Sherwin, *Gambling with Armageddon: Nuclear Roulette from Hiroshima to the Cuban Missile Crisis* (2020). The tapes (K–J Adm. II.J). FRUS vols. 6, 10, 11. Names: Khrushchev, Castro (K–J Adm. III.J).'
  - id: cal.1962-05-24.space
    when: May 24
    date: '1962-05-24'
    thread: space
    c: Carpenter's *Aurora 7* lands 250 miles off target.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-05-28.economy
    when: May 28
    date: '1962-05-28'
    thread: economy
    c: The Dow's largest point drop since 1929, more than 5 percent. Recovered within days. Check the figures.
    n: Heath (K–J Adm. II.B). See [[cal.1961-01-05.economy]].
  - id: cal.1962-05-29.elections-1962
    when: May 29
    date: '1962-05-29'
    thread: elections-1962
    c: Wallace wins the Alabama runoff for governor over DeGraffenried.
    n: 'Carter, *The Politics of Rage* (K–J Cong. II.H). See [[cal.1962-05-05.elections-1962]]. Names: Wallace (K–J Cong. III.F).'
  - id: cal.1962-05.press-and-broadcasting
    when: May
    date: 1962-05
    thread: press-and-broadcasting
    c: The White House cancels its *New York Herald Tribune* subscriptions. Check the month.
    n: Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-01-25.press-and-broadcasting]].
