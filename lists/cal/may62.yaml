    n: Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-01-25.press-and-broadcasting]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-05-30.opinion
    when: May 30
    date: '1962-05-30'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, May 3–8: the Kennedy administration pushing integration too fast, 32 percent; not fast enough, 11; about right, 35. Southern whites 59 too fast; Negroes 31 not fast enough.'
    n: '*The Gallup Poll*, III, 1769 (K–J Cong. II.E).'
