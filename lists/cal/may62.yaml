    tags: [name:kennedy-john-f]
  - id: cal.1962-05-29.legislatures-tn
    when: May 29–June 22
    date: '1962-05-29'
    thread: legislatures
    c: 'Tennessee. Called by Ellington after *Baker v. Carr*, the General Assembly meets in extraordinary session May 29 and reapportions both houses, June 6, the first time since 1901; Ellington signs June 7. June 22, the three-judge court at Nashville: neither act apportions either house on the number of voters, and at least one must be; the August and November elections to go forward under them, the General Assembly so chosen to act by June 3, 1963.'
    n: '*Baker v. Carr*, [206 F. Supp. 341](https://static.case.law/f-supp/206/html/0341-01.html) (M.D. Tenn. 1962). [[w.graham-one-man-one-vote]]; [[w.smith-on-democracys-doorstep-2014]]; [[w.ansolabehere-end-of-inequality-2008]]. See [[cal.1962-03-26.court]].'
    tags: [state:tn, name:ellington-buford]
