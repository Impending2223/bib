  - id: cal.1962-05-01.alabama-al
    when: May 1
    date: '1962-05-01'
    thread: alabama
    also: [governors, elections-1962]
    c: 'Alabama''s Democratic primary for governor: Wallace 32.5 percent, DeGraffenried 25.2, Folsom 25.1, Attorney General MacDonald Gallion 12.6, Connor 3.6; Lieutenant Governor Boutwell, 862 votes. Runoff between Wallace and DeGraffenried. Hill renominated for the Senate, 73.7 percent, over two.'
    n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [736](https://archive.org/details/alabama-official-statistical-register-1963/page/n735)–[737](https://archive.org/details/alabama-official-statistical-register-1963/page/n736); Boutwell''s total, not printed there, from [Wikipedia, "1962 Alabama gubernatorial election"](https://en.wikipedia.org/wiki/1962_Alabama_gubernatorial_election) (Check). [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]; [[w.black-southern-governors-and-civil]]; [[w.bartley-southern-politics-and-the]]; [[w.bartley-southern-elections]]; [[w.peirce-deep-south-states-of]]. Names: Wallace (K–J Cong. III.F); DeGraffenried, Folsom, Gallion, Connor, Boutwell (K–J Cong. III.K); Hill (K–J Cong. III.B).'
    tags: [state:al, name:wallace-george-c, name:degraffenried-ryan, name:folsom-james-e, name:gallion-macdonald, name:connor-eugene, name:boutwell-albert, name:hill-lister]
