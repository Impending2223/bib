    when: May
    date: 1962-05
    thread: press-and-broadcasting
    c: The White House cancels its *New York Herald Tribune* subscriptions. Check the month.
    n: Salinger, *With Kennedy* (K–J Adm. II.G.2). See [[cal.1961-01-25.press-and-broadcasting]].
    tags: [name:kennedy-john-f]
