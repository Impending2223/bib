  - id: cal.1962-05-29.elections-1962
    when: May 29
    date: '1962-05-29'
    thread: alabama
    also: [governors, elections-1962, legislatures]
    c: 'Alabama''s runoff. Governor: Wallace 340,730, DeGraffenried 269,122; Wallace 55.9 percent. The State down from nine Representatives to eight, the legislature having drawn no new districts: the nine Democratic nominees, chosen May 1 by the old districts, on one statewide ballot, the lowest to drop out. Rains first, 548,349; Boykin of Mobile last, 380,679.'
    n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [763](https://archive.org/details/alabama-official-statistical-register-1963/page/n762)–[764](https://archive.org/details/alabama-official-statistical-register-1963/page/n763). See [[cal.1962-05-01.alabama-al]]. Names: Wallace (K–J Cong. III.F); DeGraffenried (K–J Cong. III.K).'
    tags: [name:wallace-george-c, name:degraffenried-ryan, state:al, city:mobile, name:rains-albert-m, name:boykin-frank-w]
