  - id: cal.1962-05-24.missile-crisis
    when: May 24
    date: '1962-05-24'
    thread: missile-crisis
    c: 'The Presidium approves Khrushchev''s plan: medium- and intermediate-range missiles to Cuba, in secret. Castro agrees at month''s end.'
    n: '[[w.prezidium-tsk-kpss-1954]]; [[w.fursenko-one-hell-of-a]]; [[w.dobbs-one-minute-to-midnight]]; [[w.stern-averting-the-final-failure]]; [[w.allison-essence-of-decision]]; [[w.kennedy-thirteen-days]]; [[w.sherwin-gambling-with-armageddon]]. The tapes (K–J Adm. II.J). FRUS vols. [6](https://history.state.gov/historicaldocuments/frus1961-63v06), [10](https://history.state.gov/historicaldocuments/frus1961-63v10), [11](https://history.state.gov/historicaldocuments/frus1961-63v11). Names: Khrushchev, Castro (K–J Adm. III.J).'
