  - id: cal.1962-05-09.vietnam
    when: May 9–11
    date: '1962-05-09'
    thread: vietnam
    c: 'McNamara''s first visit: the corps headquarters, Operation Sunrise, three strategic hamlets, the Civil Guard training center; Diệm; a last meeting with Harkins and Felt. Some 1,400 miles, the 17th parallel to the Delta.'
    n: '[FRUS 1961–63, II, doc. 187](https://history.state.gov/historicaldocuments/frus1961-63v02/d187), the Defense Department''s report of the visit. [[w.shapley-promise-and-power]]. See [[cal.1961-01-28.vietnam]]. Sheehan''s recollection, in print in 1988, off the record by his own account: "I caught him outside as he was getting into his car. I said that I was not quoting him, that the question was off the record because I wanted to know the truth"; McNamara: "Every quantitative measurement we have shows that we''re winning this war" (Sheehan, *A Bright Shining Lie*, 290, Viet. II.B.10); in 2009, "at the end of a press conference," "absolutely every indicator we have shows we''re winning the war" ([NPR, July 6, 2009](https://www.npr.org/transcripts/106318404)). No printing before 1988 found. Check [[w.halberstam-best-and-the-brightest]], and the *New York Times* of May 10–12, 1962. Names: McNamara (Viet. III.A); Diệm (K–J Adm. III.J); Harkins, Felt (Viet. III.D).'
    tags: [name:mcnamara-robert-s, name:ngo-dinh-diem, name:harkins-paul-d, name:felt-harry-d]
