entries:
  - id: cal.1966-10-02.opinion
    when: Oct. 2
    date: '1966-10-02'
    thread: opinion
    also: [defense]
    c: 'Gallup, Sept. 8–13: every able-bodied man of 18 required to serve a year in the armed forces: yes 69 percent, no 24.'
    n: '[[w.gallup-poll]], III, 2032.'
  - id: cal.1966-10-05.opinion
    when: Oct. 5
    date: '1966-10-05'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Aug. 18–23, on a scale from plus 5 to minus 5: highly favorable, plus 4 or 5, Nixon 22 percent, Romney 16. Republicans 40 and 24; independents 20 and 16; Democrats 12 and 10. Unable to rate: Nixon 4, Romney 25.'
    n: '[[w.gallup-poll]], III, 2032. Names: Nixon, Romney.'
    tags: [name:nixon-richard-m, name:romney-george-w]
  - id: cal.1966-10-05.africa
    when: Oct. 5
    date: '1966-10-05'
    thread: africa
    also: [foreign-aid]
    c: 'NSAM 356: Johnson approves in principle Korry''s report on development policy in Africa, with a larger part for the World Bank; State to have a program carrying out its other recommendations in effect by Dec. 1.'
    n: 'FRUS 1964–68, XXIV, docs. [215](https://history.state.gov/historicaldocuments/frus1964-68v24/d215), [221](https://history.state.gov/historicaldocuments/frus1964-68v24/d221) (NSAM 356). [[w.lyons-keeping-africa-off-the]]. Made public: FRUS 1964–68, XXIV (1999). See [[cal.1966-05-26.africa]]. Names: Korry.'
    tags: [name:johnson-lyndon-b, name:korry-edward-m]
  - id: cal.1966-10-06.school-aid
    when: Oct. 6–20
    date: '1966-10-06'
    thread: school-aid
    also: [desegregation-schools]
    c: 'Elementary and Secondary Education Amendments. House: an amendment holding the Commissioner of Education to the Civil Rights Act''s procedures before he withholds funds from a district, [220–116](https://voteview.com/rollcall/RH0890361) (Check its terms); recommittal, to cut $343 million, refused, [150–185](https://voteview.com/rollcall/RH0890362); passed, [237–97](https://voteview.com/rollcall/RH0890363). The Senate passed its bill the same day, [54–16](https://voteview.com/rollcall/RS0890477). The conference report through the House Oct. 20, [185–76](https://voteview.com/rollcall/RH0890388).'
    n: '[112 Cong. Rec., House, Oct. 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-2-2.pdf); [112 Cong. Rec., Senate, Oct. 6, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-2-1.pdf). [[w.graham-uncertain-triumph]]; [[w.orfield-reconstruction-of-southern-education]]. See [[cal.1965-01-12.school-aid]].'
  - id: cal.1966-10-07.europe-and-the-alliance
    when: Oct. 7
    date: '1966-10-07'
    thread: europe-and-the-alliance
    also: [soviet-union, european-community]
    c: 'Johnson to the National Conference of Editorial Writers, New York: from "the narrow concept of coexistence" to "peaceful engagement" with the East; the unification of Germany "in the context of a larger, peaceful, and prosperous Europe." Export controls eased on hundreds of nonstrategic items; the Export-Import Bank to guarantee commercial credits to Poland, Hungary, Bulgaria and Czechoslovakia; action asked on the consular convention with the Soviet Union. A "gradual and balanced revision in force levels on both sides" possible.'
    n: '[Remarks in New York City Before the National Conference of Editorial Writers](https://www.presidency.ucsb.edu/documents/remarks-new-york-city-before-the-national-conference-editorial-writers) (Oct. 7, 1966). [[w.schwartz-lyndon-johnson-and-europe]]; [[w.brands-wages-of-globalism]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-07.opinion
    when: Oct. 7
    date: '1966-10-07'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Sept. 8–13: the party more likely to keep the country out of World War III: Republican 27 percent, Democratic 24, no difference 30.'
    n: '[[w.gallup-poll]], III, 2032.'
  - id: cal.1966-10-09.opinion
    when: Oct. 9
    date: '1966-10-09'
    thread: opinion
    c: 'Gallup, Sept. 8–13: Communist China admitted to the UN: should 25 percent, should not 56; persons in *Who''s Who in America*, 64 and 32. Admission if it would improve relations: favor 55, oppose 30. If the UN votes to admit it, the United States to go along: should 53, should not 33. Britain, Peking admitted: the public 54 should, 21 not; persons in the British *Who''s Who*, 86 and 8.'
    n: '[[w.gallup-poll]], III, 2032–33.'
  - id: cal.1966-10-10.vietnam
    when: Oct. 10–15
    date: '1966-10-10'
    thread: vietnam
    c: 'McNamara in Vietnam, Oct. 10–13, Katzenbach with him. His memorandum to Johnson, Oct. 14: "no reasonable way to bring the war to an end soon"; pacification "a bad disappointment"; the bombing has not "significantly affected infiltration or cracked the morale of Hanoi." He recommends: American forces to level off at 470,000, 70,000 more in 1967; a barrier against infiltration near the 17th parallel; the bombing of the North held at its present 12,000 attack sorties a month; pacification pressed; to make peace gestures credible, consider stopping the bombing of all the North, or shifting it away from the zones of Hanoi and Haiphong. The Joint Chiefs dissent the same day. Oct. 15, McNamara and Wheeler with Johnson before the NSC meets on the Asian trip.'
    n: 'FRUS 1964–68, IV, docs. [268](https://history.state.gov/historicaldocuments/frus1964-68v04/d268), [269](https://history.state.gov/historicaldocuments/frus1964-68v04/d269), [272](https://history.state.gov/historicaldocuments/frus1964-68v04/d272). [Remarks at a Press Briefing Following the Return From Vietnam of Secretary McNamara and Under Secretary Katzenbach](https://www.presidency.ucsb.edu/documents/remarks-press-briefing-following-the-return-from-vietnam-secretary-mcnamara-and-under) (Oct. 14, 1966). Made public: [[w.pentagon-papers]], IV, 348–355 (1971). [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.gibbons-u-s-government-and]]; [[w.herring-lbj-and-vietnam]]. Names: McNamara, Wheeler, Katzenbach, Johnson.'
    tags: [name:mcnamara-robert-s, name:katzenbach-nicholas, name:wheeler-earle, name:johnson-lyndon-b]
  - id: cal.1966-10-10.soviet-union
    when: Oct. 10
    date: '1966-10-10'
    thread: soviet-union
    also: [testing, vietnam]
    c: 'Gromyko at the White House with Dobrynin, 5 to 6:41 p.m.; Rusk and Thompson with Johnson. Most of the talk is Vietnam. On a nonproliferation treaty Gromyko: the Soviet Union ready to sign "in two weeks" once a text is agreed; no nuclear weapons to the national control of non-nuclear powers, nor to any grouping that includes them. Johnson: by law no one but the President may decide to fire American nuclear weapons. Rusk and Gromyko had gone over treaty language in New York, Sept. 22–24.'
    n: 'FRUS 1964–68, XIV, doc. [178](https://history.state.gov/historicaldocuments/frus1964-68v14/d178); XI, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v11/d153), [157](https://history.state.gov/historicaldocuments/frus1964-68v11/d157); IV, doc. [264](https://history.state.gov/historicaldocuments/frus1964-68v04/d264). [[w.seaborg-stemming-the-tide]]; [[w.dobrynin-in-confidence]], 144–145; [[w.johnson-vantage-point]], 248–249. Names: Gromyko, Dobrynin, Rusk, Thompson, Johnson.'
    tags: [name:gromyko-andrei, name:dobrynin-anatoly, name:rusk-dean, name:thompson-llewellyn-e, name:johnson-lyndon-b]
  - id: cal.1966-10-11.welfare
    when: Oct. 11
    date: '1966-10-11'
    thread: welfare
    also: [poverty]
    c: 'Child Nutrition Act signed, [80 Stat. 885](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg885.pdf): a pilot program of school breakfasts, $7.5 million for fiscal 1967 and $10 million for 1968; food for children in preschool programs; aid for kitchen equipment to schools that cannot afford it; part of the States'' costs of running the programs.'
    n: '[Remarks at the Signing of the Child Nutrition Act of 1966](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-child-nutrition-act-1966) (Oct. 11, 1966). [[w.levine-school-lunch-politics]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-12.program
    when: Oct. 12–22
    date: '1966-10-12'
    thread: program
    also: [congress]
    c: 'Long''s Presidential Election Campaign Fund, a title of the Foreign Investors Tax Act, H.R. 13103: each taxpayer may direct $1 of his income tax to a fund paid out to the parties whose candidates had 15 million votes or more in the last presidential election. A motion to strike it lost in the Senate, [33–39](https://voteview.com/rollcall/RS0890484); the bill passed Oct. 13, [58–18](https://voteview.com/rollcall/RS0890489). The conference report: House, Oct. 20, [171–46](https://voteview.com/rollcall/RH0890392); Senate, Oct. 22, [31–22](https://voteview.com/rollcall/RS0890497), a motion to table it lost, [15–37](https://voteview.com/rollcall/RS0890496). Signed Nov. 13, [80 Stat. 1539](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg1539.pdf).'
    n: '[112 Cong. Rec., Senate, Oct. 12, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt19/pdf/GPO-CRECB-1966-pt19-7-2.pdf); [112 Cong. Rec., Senate, Oct. 22, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt21/pdf/GPO-CRECB-1966-pt21-3-1.pdf). [[w.mann-legacy-to-power]]. Names: Long.'
    tags: [name:long-russell-b, name:johnson-lyndon-b]
  - id: cal.1966-10-12.opinion
    when: Oct. 12
    date: '1966-10-12'
    thread: opinion
    also: [elections-1966, economy]
    c: 'Gallup, Oct. 2–7: the party to do the best job of keeping the country prosperous: Democratic 41 percent, Republican 24, no difference 19. To keep prices down: Republican 32, Democratic 25, no difference 26.'
    n: '[[w.gallup-poll]], III, 2033.'
  - id: cal.1966-10-14.cities-and-housing
    when: Oct. 14–20
    date: '1966-10-14'
    thread: cities-and-housing
    c: 'The Demonstration Cities and Metropolitan Development Act, S. 3708, through the House, [178–141](https://voteview.com/rollcall/RH0890371); recommittal refused, [149–175](https://voteview.com/rollcall/RH0890370). The conference report: Senate, Oct. 18, [38–22](https://voteview.com/rollcall/RS0890495); House, Oct. 20, [142–126](https://voteview.com/rollcall/RH0890385).'
    n: '[112 Cong. Rec., House, Oct. 14, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-2-2.pdf). See [[cal.1966-01-26.cities-and-housing]].'
  - id: cal.1966-10-14.opinion
    when: Oct. 14
    date: '1966-10-14'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Sept. 30–Oct. 6: the American offer of a step-by-step withdrawal of its troops under UN supervision if the North Vietnamese withdraw theirs: approve 52 percent; approve with minor reservations 22; oppose 16.'
    n: '[[w.gallup-poll]], III, 2033.'
  - id: cal.1966-10-15.transportation
    when: Oct. 15
    date: '1966-10-15'
    thread: transportation
    c: 'Department of Transportation Act signed, [80 Stat. 931](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg931.pdf): the twelfth executive department, bringing together, Johnson says, 31 agencies and bureaus. The Maritime Administration left out. The Senate passed it Sept. 29, [64–2](https://voteview.com/rollcall/RS0890462).'
    n: '[Remarks Upon Signing Bill Creating a Department of Transportation](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-bill-creating-department-transportation) (Oct. 15, 1966). [[w.davis-department-of-transportation]]. See [[cal.1966-03-02.transportation]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-15.conservation
    when: Oct. 15
    date: '1966-10-15'
    thread: conservation
    c: 'Seven conservation bills signed: Guadalupe Mountains National Park in Texas; Pictured Rocks National Lakeshore in Michigan; Bighorn Canyon National Recreation Area in Montana; Wolf Trap Farm Park in Virginia; more land for Point Reyes National Seashore; the Endangered Species Preservation Act, [80 Stat. 926](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg926.pdf), native species threatened with extinction to be listed, and land bought for them; the National Historic Preservation Act, [80 Stat. 915](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg915.pdf), a National Register of Historic Places, grants to the States, and an Advisory Council on Historic Preservation to comment on federal undertakings that touch a listed place.'
    n: '[Remarks at the Signing Ceremony for Seven Conservation Bills](https://www.presidency.ucsb.edu/documents/remarks-the-signing-ceremony-for-seven-conservation-bills) (Oct. 15, 1966). [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. See [[cal.1965-10-22.conservation]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-10-15.black-nationalism
    when: Oct. 15
    date: '1966-10-15'
    thread: black-nationalism
    also: [civil-rights-organizations]
    c: 'Oakland. Huey P. Newton and Bobby Seale found the Black Panther Party for Self-Defense. Its ten-point program, "What We Want, What We Believe": among its points, full employment, decent housing, exemption of all black men from military service, "an immediate end to police brutality," freedom for all black men held in prisons and jails.'
    n: '[[w.bloom-black-against-empire]]; [[w.newton-revolutionary-suicide]]; [[w.seale-seize-the-time]]; [[w.self-american-babylon]]; [[w.joseph-waiting-til-the-midnight]]. Names: Newton, Seale.'
    tags: [name:newton-huey-p, name:seale-bobby, state:ca, city:oakland]
  - id: cal.1966-10-16.opinion
    when: Oct. 16
    date: '1966-10-16'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, Oct. 1–6: the party one would like to see win the congressional district. Union members: Democratic 66 percent, Republican 34. Negroes: 82 and 18. Those 21 to 29: 56 and 44.'
    n: '[[w.gallup-poll]], III, 2033–34.'
  - id: cal.1966-10-17.vietnam
    when: Oct. 17–Nov. 2
    date: '1966-10-17'
    thread: vietnam
    also: [japan-and-korea]
    c: 'Johnson''s Asian trip. From Washington Oct. 17, by Honolulu and American Samoa; New Zealand, Oct. 19–20; Australia, Oct. 20–23, Canberra, Melbourne, Sydney, Brisbane; Manila from Oct. 23. The Manila conference, Oct. 24–25, at Marcos''s invitation: Holt of Australia, Park of Korea, Holyoake of New Zealand, Marcos, Thanom of Thailand, Thiệu and Kỳ of South Vietnam, Johnson. The communiqué: allied forces "shall be withdrawn, after close consultation, as the other side withdraws its forces to the North, ceases infiltration, and the level of violence thus subsides," and not later than six months after; South Vietnam to finish its constitution by March 1967 and to offer national reconciliation; a Declaration of Goals of Freedom. Oct. 26, Johnson with the troops at Cam Ranh Bay. Thailand, Oct. 27–30; Malaysia, Oct. 30–31; Korea, Oct. 31–Nov. 2. Back in Washington Nov. 2.'
    n: '[Remarks at Dulles International Airport on Departing for the Asian-Pacific Trip](https://www.presidency.ucsb.edu/documents/remarks-dulles-international-airport-departing-for-the-asian-pacific-trip) (Oct. 17, 1966); [Summary of the President''s Remarks at the Manila Summit Conference](https://www.presidency.ucsb.edu/documents/summary-the-presidents-remarks-the-manila-summit-conference) (Oct. 24, 1966); [Manila Summit Conference Documents](https://www.presidency.ucsb.edu/documents/manila-summit-conference-documents) (Oct. 25, 1966); [Remarks to Members of the Armed Forces at Cam Ranh Bay, Vietnam](https://www.presidency.ucsb.edu/documents/remarks-members-the-armed-forces-cam-ranh-bay-vietnam) (Oct. 26, 1966); [Remarks Recorded for Broadcast to the American People Following the Manila Conference](https://www.presidency.ucsb.edu/documents/remarks-recorded-for-broadcast-the-american-people-following-the-manila-conference) (Oct. 27, 1966); [Joint Statement Following Discussions With President Park of Korea](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-park-korea) (Nov. 2, 1966); [Remarks at Dulles International Airport Upon Returning From the Asian-Pacific Trip](https://www.presidency.ucsb.edu/documents/remarks-dulles-international-airport-upon-returning-from-the-asian-pacific-trip) (Nov. 2, 1966). FRUS 1964–68, IV, docs. [277](https://history.state.gov/historicaldocuments/frus1964-68v04/d277), [280](https://history.state.gov/historicaldocuments/frus1964-68v04/d280), [281](https://history.state.gov/historicaldocuments/frus1964-68v04/d281), [282](https://history.state.gov/historicaldocuments/frus1964-68v04/d282); XXIX, pt. 1, doc. [94](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d94). [[w.johnson-vantage-point]]; [[w.dallek-flawed-giant]]; [[w.gibbons-u-s-government-and]]; [[w.herring-lbj-and-vietnam]]; [[w.rostow-diffusion-of-power]]. Names: Johnson, Marcos, Holt, Park Chung Hee, Holyoake, Thanom Kittikachorn, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    tags: [name:johnson-lyndon-b, name:marcos-ferdinand-e, name:holt-harold-e, name:park-chung-hee, name:holyoake-keith, name:thanom-kittikachorn, name:nguyen-van-thieu, name:nguyen-cao-ky]
  - id: cal.1966-10-18.court
    when: Oct. 18–19
    date: '1966-10-18'
    thread: court
    also: [press-and-broadcasting]
    c: '*Time, Inc. v. Hill* reargued. Richard M. Nixon for James Hill, whose family''s night as hostages of escaped convicts in 1952 *Life* had described as the story of a play; Harold R. Medina, Jr., for Time. The question: may New York''s privacy statute make the press liable for a false report without proof that it knew the report false or reckless of the truth. First argued Apr. 27. The October Term opened Oct. 3.'
    n: '*Time, Inc. v. Hill*, [385 U.S. 374](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385374/usrep385374.pdf) (1967), decided Jan. 9, 1967. [[w.barbas-newsworthy]]; [[w.garment-crazy-rhythm]]; [[w.ambrose-nixon]]. Names: Nixon.'
    tags: [name:nixon-richard-m]
  - id: cal.1966-10-19.opinion
    when: Oct. 19
    date: '1966-10-19'
    thread: opinion
    also: [elections-1966, vietnam]
    c: 'Gallup, Oct. 1–6: the most important problem, in order of mention: the war in Vietnam; civil rights and racial strife; rising prices. The party better able to handle it: Democratic 53 percent, Republican 47.'
    n: '[[w.gallup-poll]], III, 2034.'
  - id: cal.1966-10-22.congress
    when: Oct. 22
    date: '1966-10-22'
    thread: congress
    c: 'The 89th Congress''s second session adjourns sine die, the Senate at 5:08 p.m., the House at 5:46. Oct. 15, in the East Room, McCormack''s report on the 89th to Johnson and the members: "fabulous." Oct. 19, the House had created a Select Committee on Standards and Conduct, [256–0](https://voteview.com/rollcall/RH0890384).'
    n: '[112 Cong. Rec., Senate, Oct. 22, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt21/pdf/GPO-CRECB-1966-pt21-3-1.pdf); [112 Cong. Rec., House, Oct. 22, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt21/pdf/GPO-CRECB-1966-pt21-3-2.pdf); [112 Cong. Rec., House, Oct. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-5-2.pdf). [Remarks on the Accomplishments of the 89th Congress](https://www.presidency.ucsb.edu/documents/remarks-the-accomplishments-the-89th-congress) (Oct. 15, 1966). [[w.zelizer-fierce-urgency-of-now]]; [[w.mackenzie-liberal-hour]]. See [[cal.1965-10-23.congress]]; [[cal.1966-01-10.congress]]. Names: McCormack, Johnson.'
    tags: [name:mccormack-john-w, name:johnson-lyndon-b]
  - id: cal.1966-10-25.middle-east
    when: Oct. 25–Nov. 4
    date: '1966-10-25'
    thread: middle-east
    c: 'Iran''s oil. The Shah to Meyer, Oct. 25: the consortium unresponsive; Iran denied a 17 percent increase while the Saudis'' liftings rise 26 percent. Nov. 3, State and the Foreign Office on a common front. Nov. 4, the five American members of the consortium to Hare and Solomon: Iran''s demands, oil at cost and proven fields given up, all unacceptable; Iran and the consortium "on collision course."'
    n: 'FRUS 1964–68, XXXIV, docs. [191](https://history.state.gov/historicaldocuments/frus1964-68v34/d191), [193](https://history.state.gov/historicaldocuments/frus1964-68v34/d193), [194](https://history.state.gov/historicaldocuments/frus1964-68v34/d194). [[w.sampson-seven-sisters]]; [[w.bill-eagle-and-the-lion]]; [[w.yergin-prize]]. See [[cal.1960-09-10.middle-east]]. Names: Pahlavi, Meyer, Hare.'
    tags: [name:pahlavi-mohammed-reza, name:meyer-armin-h, name:hare-raymond-a]
  - id: cal.1966-10-26.europe-and-the-alliance
    when: Oct. 26
    date: '1966-10-26'
    thread: europe-and-the-alliance
    c: The North Atlantic Council decides to move from Paris to Brussels. SHAPE to Casteau, Belgium; Allied Forces Central Europe to the Maastricht area, the Netherlands. Check the date of the decision.
    n: '[FRUS 1964–68, XIII, doc. 214](https://history.state.gov/historicaldocuments/frus1964-68v13/d214) (Leddy to Cleveland and Bohlen, Oct. 28). See [[cal.1966-06-06.europe-and-the-alliance]].'
  - id: cal.1966-10-27.africa
    when: Oct. 27
    date: '1966-10-27'
    thread: africa
    c: The General Assembly ends South Africa's mandate over South West Africa, Resolution 2145 (XXI), 114–2, Portugal and South Africa against, Britain, France and Malawi abstaining (Check); the United States for. The territory to come under the direct responsibility of the United Nations; an ad hoc committee to recommend how it is to be administered.
    n: '[G.A. Res. 2145 (XXI)](https://undocs.org/A/RES/2145(XXI)) (Oct. 27, 1966). *American Foreign Policy: Current Documents, 1966*, pp. 585–586. [[w.borstelmann-cold-war-and-the]]. See [[cal.1966-07-14.africa]].'
  - id: cal.1966-10-30.opinion
    when: Oct. 30
    date: '1966-10-30'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Sept. 30–Oct. 6: Johnson 51 percent, Nixon 34, Wallace as a third party''s candidate 7, undecided 8. South: Johnson 40, Nixon 34, Wallace 17. Southern whites 18 for Wallace; whites outside the South 2.'
    n: '[[w.gallup-poll]], III, 2034–35. Names: Nixon, Johnson, Wallace.'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:wallace-george-c]
