# Cal. XIII December 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XIII
entries:
  - id: cal.1960-12-01.transition-and-staff
    when: Dec. 1–17
    date: '1960-12-01'
    thread: transition-and-staff
    c: The cabinet named. Ribicoff to HEW, Dec. 1; Hodges to Commerce; Udall to Interior; Rusk to State, Dec. 12, Stevenson to the UN, Bowles Under Secretary; McNamara to Defense, Dec. 13; Freeman to Agriculture, Goldberg to Labor; Dillon to the Treasury and Robert Kennedy to Justice, Dec. 16; Day to the Post Office, the last. Williams to African affairs, Dec. 1.
    n: 'Check: the dates of Hodges, Udall, Freeman, Goldberg, Day. See [[cal.1960-11-09.transition-and-staff]]. [[w.halberstam-best-and-the-brightest]]; [[w.wofford-of-kennedys-and-kings]], on the search; [[w.schoenbaum-waging-war-and-peace]], on Rusk; [[w.shapley-promise-and-power]], on McNamara; [[w.bowles-promises-to-keep]]. Names: Kennedy (Viet. III.A); Robert Kennedy (K–J Adm. III.A); Rusk, Stevenson, Bowles, Williams (K–J Adm. III.E); McNamara (K–J Adm. III.F); Ribicoff, Hodges, Udall, Freeman, Goldberg, Day (K–J Adm. III.G); Dillon (K–J Adm. III.H).'
    tags: [name:kennedy-john-f, name:ribicoff-abraham, name:hodges-luther-h, name:udall-stewart-l, name:rusk-dean, name:stevenson-adlai-e, name:bowles-chester, name:mcnamara-robert-s, name:freeman-orville-l, name:goldberg-arthur-j, name:dillon-c-douglas, name:kennedy-robert-f, name:day-j-edward, name:williams-g-mennen]
  - id: cal.1960-12-05.desegregation-public-places
    when: Dec. 5
    date: '1960-12-05'
    thread: desegregation-public-places
    also: [court, freedom-rides]
    c: '*Boynton v. Virginia*, [364 U.S. 454](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364454/usrep364454.pdf). An interstate bus passenger refused service in the white restaurant of the Trailways terminal at Richmond: the Interstate Commerce Act forbids the discrimination, his trespass conviction reversed. 7–2; Black for the Court, Whittaker and Clark dissenting.'
    n: '[[w.barnes-journey-from-jim-crow]]; [[w.arsenault-freedom-riders]]; [[w.greenberg-crusaders-in-the-courts]]. Cases: K–J Cong. II.J.1.'
  - id: cal.1960-12-05.testing
    when: Dec. 5
    date: '1960-12-05'
    thread: testing
    c: The Geneva conference on stopping nuclear tests recesses, on the American proposal, to meet again in February under the new administration. Herter's proposal shown to Clifford beforehand.
    n: 'FRUS 1958–60, III, doc. [264](https://history.state.gov/historicaldocuments/frus1958-60v03/d264). [[w.jacobson-diplomats-scientists-and-politicians]]; [[w.divine-blowing-on-the-wind]]; [[w.seaborg-kennedy-khrushchev-and-the]]. Names: Herter (Opp. III.E); Clifford (Viet. III.A).'
    tags: [name:herter-christian-a, name:clifford-clark]
  - id: cal.1960-12-06.transition-and-staff
    when: Dec. 6
    date: '1960-12-06'
    thread: transition-and-staff
    c: Eisenhower receives Kennedy at the White House, alone, then with Herter, Gates, Anderson, Persons and Clifford. The White House staff, the NSC, NATO, the balance of payments. Eisenhower advises against reorganizing before Kennedy knows the work.
    n: '[Joint Statement by the President and President-Elect Kennedy](https://www.presidency.ucsb.edu/documents/joint-statement-the-president-and-president-elect-kennedy). FRUS 1958–60, III, doc. [128](https://history.state.gov/historicaldocuments/frus1958-60v03/d128); IV, doc. [62](https://history.state.gov/historicaldocuments/frus1958-60v04/d62) (Anderson''s record). Eisenhower''s account: [[w.eisenhower-white-house-years]], 712–716. See [[cal.1960-11-09.transition-and-staff]]. Names: Eisenhower, Herter, Gates, Anderson, Persons (Opp. III.E); Kennedy, Clifford (Viet. III.A).'
    tags: [name:eisenhower-dwight-d, name:kennedy-john-f, name:herter-christian-a, name:gates-thomas-s-jr, name:anderson-robert-b, name:persons-wilton-b, name:clifford-clark]
  - id: cal.1960-12-08.laos
    when: Dec. 8–16
    date: '1960-12-08'
    thread: laos
    c: Kouprasith's coup in Vientiane, Dec. 8; Souvanna Phouma to Phnom Penh, Dec. 9. Soviet aircraft bring Kong Le howitzers. The assembly, at Savannakhet, votes Souvanna out; the King gives power to Phoumi's committee, Dec. 12, Boun Oum its head. Phoumi's troops take the city, Dec. 13–16, the American embassy burned; Kong Le withdraws north.
    n: 'FRUS 1958–60, XVI, docs. [479](https://history.state.gov/historicaldocuments/frus1958-60v16/d479), [484](https://history.state.gov/historicaldocuments/frus1958-60v16/d484), [485](https://history.state.gov/historicaldocuments/frus1958-60v16/d485), [487](https://history.state.gov/historicaldocuments/frus1958-60v16/d487). See [[cal.1960-08-09.laos]]. Names: Kouprasith (Viet. III.I); Kong Le, Phoumi Nosavan, Souvanna Phouma, Boun Oum na Champassak (Viet. III.I).'
    tags: [name:kouprasith-abhay, name:souvanna-phouma, name:kong-le, name:phoumi-nosavan, name:boun-oum-na-champassak]
  - id: cal.1960-12-09.cuba
    when: Dec. 9
    date: '1960-12-09'
    thread: cuba
    also: [immigration]
    c: Eisenhower thanks Cardinal Spellman for $10,000 toward the Cuban refugees in Miami; $1 million already allotted from the President's funds, Tracy Voorhees in charge.
    n: '[Letter to Cardinal Spellman Concerning Aid to Cuban Refugees](https://www.presidency.ucsb.edu/documents/letter-cardinal-spellman-concerning-aid-cuban-refugees). [[w.garcia-havana-usa]]. Names: Eisenhower, Voorhees (Opp. III.E); Spellman (K–J Cong. III.K).'
    tags: [name:eisenhower-dwight-d, name:spellman-francis, name:voorhees-tracy-s]
  - id: cal.1960-12-09.elections-1960-chicago
    when: Dec. 9
    date: '1960-12-09'
    thread: elections-1960
    also: [states-and-cities]
    c: Chicago. The recount of the State's Attorney's race, which Adamowski asked and the Republicans meant as a test of the presidential count, ends. A county judge had ordered twenty-five teams of counters and every race on the ballots counted. Errors of ten votes or more in Kennedy's favor in 3.1 percent of the precincts recounted, in Nixon's 2.6. Ward's election stands; Adamowski wins a second recount in 1961, his race alone.
    n: '[[w.kallina-courthouse-over-white-house]], 114–117. See [[cal.1960-11-08.governors-il]]; [[cal.1960-12-19.elections-1960]]. Names: Adamowski (K–J Cong. III.F); Ward (K–J Cong. III.K); Kennedy (Viet. III.A); Nixon (Opp. III.E).'
    tags: [state:il, city:chicago, name:adamowski-benjamin-s, name:ward-daniel-p, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-12-12.court
    when: Dec. 12
    date: '1960-12-12'
    thread: court
    c: '*Shelton v. Tucker*, [364 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364479/usrep364479.pdf). Arkansas''s act requiring every teacher in its schools and colleges to list every organization joined or supported in five years voided, 5–4: freedom of association. Stewart for the Court; Frankfurter and Harlan for the dissenters.'
    n: '[[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]. Cases: K–J Cong. II.J.1.'
  - id: cal.1960-12-14.africa
    when: Dec. 14
    date: '1960-12-14'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'The General Assembly adopts the Declaration on the Granting of Independence to Colonial Countries and Peoples, 89–0. The United States abstains, with Britain, France, Belgium, Portugal, Spain, South Africa, Australia and the Dominican Republic: Eisenhower''s decision, Dec. 9, at Macmillan''s request, against Herter''s advice and the delegation''s.'
    n: '[G.A. Res. 1514 (XV)](https://undocs.org/en/A/RES/1514%28XV%29). FRUS 1958–60, II, docs. [255](https://history.state.gov/historicaldocuments/frus1958-60v02/d255), [256](https://history.state.gov/historicaldocuments/frus1958-60v02/d256), [257](https://history.state.gov/historicaldocuments/frus1958-60v02/d257). [[w.mahoney-jfk]]. See [[cal.1960-03-21.africa]]. Names: Eisenhower, Herter (Opp. III.E); Macmillan (K–J Adm. III.J).'
    tags: [name:eisenhower-dwight-d, name:macmillan-harold, name:herter-christian-a]
  - id: cal.1960-12-14.trade
    when: Dec. 14
    date: '1960-12-14'
    thread: trade
    also: [europe-and-the-alliance]
    c: 'Convention on the Organisation for Economic Co-operation and Development signed at Paris, [12 U.S.T. 1728](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-12-2/lltreaties-12-2.pdf#page=536), [888 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20888/volume-888-I-12736-English.pdf): the OEEC remade, with the United States and Canada members.'
    n: Senate consent, Mar. 16, 1961; ratified Mar. 23; in force Sept. 30, 1961. [[w.winand-eisenhower-kennedy-and-the]]; [[w.kunz-butter-and-guns]].
  - id: cal.1960-12-16.cuba
    when: Dec. 16
    date: '1960-12-16'
    thread: cuba
    c: Eisenhower fixes Cuba's sugar quota for the first quarter of 1961, to the Sugar Act's expiry, at zero. Replacement sugar bought elsewhere, the Dominican Republic's share among it, as Congress required against his advice.
    n: '[Statement by the President Upon Issuing Proclamation Fixing the Cuban Sugar Quota at Zero](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-issuing-proclamation-fixing-the-cuban-sugar-quota-zero); [Proclamation 3383](https://www.presidency.ucsb.edu/documents/proclamation-3383-determination-cuban-sugar-quota-supplement-proclamation-no-3355). See [[cal.1960-07-06.cuba-2]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-12-16.europe-and-the-alliance
    when: Dec. 16–18
    date: '1960-12-16'
    thread: europe-and-the-alliance
    c: NATO ministers at Paris. Herter offers five Polaris submarines to NATO by the end of 1963, and proposes a multilateral force of medium-range missiles, owned, financed and controlled in common, mixed-manned; the allies to buy about 100 missiles.
    n: 'FRUS 1958–60, VII, pt. 1, docs. [274](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d274) (NSC, Dec. 1), [276](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d276) (Herter''s statement). [[w.trachtenberg-constructed-peace]]; [[w.steinbruner-cybernetic-theory-of-decision]]; [[w.winand-eisenhower-kennedy-and-the]]. Names: Herter (Opp. III.E).'
    tags: [name:herter-christian-a]
  - id: cal.1960-12-16.robert-kennedy
    when: Dec. 16
    date: '1960-12-16'
    thread: robert-kennedy
    also: [transition-and-staff]
    c: The President-elect names his brother Attorney General, with Dillon to the Treasury. White to be Deputy Attorney General.
    n: '[[w.schlesinger-robert-kennedy-and-his]]; [[w.thomas-robert-kennedy]]; [[w.navasky-kennedy-justice]]; [[w.guthman-we-band-of-brothers]]; [[w.robert-kennedy-in-his]]. The cabinet: [[cal.1960-12-01.transition-and-staff]]. Names: Kennedy (Viet. III.A); Robert Kennedy (K–J Adm. III.A); Dillon (K–J Adm. III.H); White (K–J Adm. III.I).'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:dillon-c-douglas, name:white-byron-r]
  - id: cal.1960-12-19.elections-1960
    when: Dec. 19
    date: '1960-12-19'
    thread: elections-1960
    c: 'The electors vote in the State capitals. Kennedy 300, Nixon 219; Byrd 15: Mississippi''s eight unpledged electors, six of Alabama''s eleven, and one Oklahoma Republican, who gives Goldwater his vote for Vice President; Thurmond 14. Hawaii''s two slates both vote, its recount unfinished.'
    n: '[The 1960 certificates](https://www.archives.gov/electoral-college/1960) (National Archives). Illinois, the Chicago recount, and the Republicans'' challenges: [[w.kallina-courthouse-over-white-house]]. See [[cal.1960-11-08.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Byrd, Thurmond (K–J Cong. III.B); Goldwater (Opp. III.B).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:byrd-harry-f, name:goldwater-barry-m, name:thurmond-strom]
  - id: cal.1960-12-20.vietnam
    when: Dec. 20
    date: '1960-12-20'
    thread: vietnam
    c: The National Front for the Liberation of South Vietnam founded at a congress in Tây Ninh province, as the Lao Động party's congress in Hanoi resolved in September. Its manifesto and ten-point program against Diệm's government and the American presence.
    n: 'The manifesto and program: [[w.vietnam-and-america]]. Made public: Hanoi radio, Jan. 29, 1961 (Check). [[w.pike-viet-cong]]; [[w.thayer-war-by-other-means]]; [[w.brigham-guerrilla-diplomacy]]; [[w.tang-vietcong-memoir]]; [[w.elliott-vietnamese-war]]; [[w.race-war-comes-to-long]]. The war itself: Viet. II.B.'
  - id: cal.1960-12-22.railroads
    when: Dec. 22
    date: '1960-12-22'
    thread: railroads
    c: Eisenhower names the Presidential Railroad Commission's fifteen members; Secretary of Labor Mitchell chairman, at both sides' request.
    n: '[Statement by the President on Appointing the Presidential Railroad Commission](https://www.presidency.ucsb.edu/documents/statement-the-president-appointing-the-presidential-railroad-commission). See [[cal.1960-11-01.railroads]]. Names: Eisenhower, Mitchell (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:mitchell-james-p]
  - id: cal.1960-12-22.congress
    when: Dec. 22–27
    date: '1960-12-22'
    thread: congress
    also: [elections-1962]
    c: Kennedy resigns his Senate seat. Governor Furcolo appoints Benjamin A. Smith II, Kennedy's college roommate, Dec. 27.
    n: 'Kennedy''s letter of resignation, Dec. 22 (JFK Library, President''s Office Files; Check). [[w.clymer-edward-m-kennedy]]. Names: Kennedy (Viet. III.A); Benjamin Smith (K–J Cong. III.B); Furcolo (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:smith-benjamin-a-ii, name:furcolo-foster]
  - id: cal.1960-12-23.foreign-aid
    when: Dec. 23
    date: '1960-12-23'
    thread: foreign-aid
    c: 'Eisenhower forbids disclosure to Hardy''s House subcommittee of documents on aid to seven South American countries: NSC and OCB papers, his officers'' advice, frank exchanges with foreign officials. Dated Dec. 2, released Dec. 23.'
    n: '[The President''s Certification as to His Forbidding Disclosure to Congress of Certain Documents Relating to Aid to South American Countries](https://www.presidency.ucsb.edu/documents/the-presidents-certification-his-forbidding-disclosure-congress-certain-documents-relating). Check: the Mutual Security Act''s proviso cutting off funds for documents withheld without the President''s certification. [[w.rozell-executive-privilege]]; [[w.berger-executive-privilege]]; [[w.schlesinger-imperial-presidency]]. Names: Eisenhower (Opp. III.E); Hardy (K–J Cong. III.D).'
    tags: [name:eisenhower-dwight-d, name:hardy-porter-jr]
  - id: cal.1960-12-28.elections-1960
    when: Dec. 28–30
    date: '1960-12-28'
    thread: elections-1960
    c: 'Hawaii''s recount, ordered by Judge Jamieson, ends: Kennedy by 115 votes, where the first count gave Nixon 141. Jamieson declares the Kennedy electors appointed, Dec. 30.'
    n: 'See [[cal.1960-11-08.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E); Jamieson (K–J Cong. III.K).'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:jamieson-ronald-b]
  - id: cal.1960-12-31.laos
    when: Dec. 31
    date: '1960-12-31'
    thread: laos
    c: 'Eisenhower with his advisers on Laos: Pathet Lao and Kong Le columns converging on Xieng Khouang, the Soviet airlift going on. More must be known before overt action, but Laos is not to be let fall. The Seventh Fleet''s marines and the 503rd at Okinawa alerted; Boun Oum to be pressed to have the assembly invest him.'
    n: 'FRUS 1958–60, XVI, docs. [492](https://history.state.gov/historicaldocuments/frus1958-60v16/d492) (NSC, Dec. 20), [496](https://history.state.gov/historicaldocuments/frus1958-60v16/d496) (NSC, Dec. 29), [498](https://history.state.gov/historicaldocuments/frus1958-60v16/d498). See [[cal.1960-08-09.laos]]. Names: Eisenhower (Opp. III.E); Kong Le, Boun Oum na Champassak (Viet. III.I).'
    tags: [name:eisenhower-dwight-d, name:kong-le, name:boun-oum-na-champassak]
