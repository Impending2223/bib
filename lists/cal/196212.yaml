    c: 'Deng Xiaoping 邓小平, on the fifth draft of the *Renmin ribao* 人民日报 New Year''s editorial "Consolidate the great achievements, strive for new victories" 《巩固伟大成绩，争取新的胜利》, sent by Wu Lengxi 吴冷西: "For Comrade Shaoqi [Liu Shaoqi 刘少奇] to check, then back to Lengxi; the wording for Lengxi and the others to weigh." He adds a closing paragraph: the tasks hard, difficulties at every step, the country to be made a strong socialist state by self-reliance, more adverse currents abroad; the people, armed with Marxism-Leninism and Mao Zedong Thought, not daunted.'
