  - id: cal.1962-12-02.china
    when: Dec. 2
    date: '1962-12-02'
    thread: china
    also: [laos]
    c: 'Phoumi Nosavan, Deputy Prime Minister and Minister of Finance of the Royal Lao government, begins a visit to China at the head of a Lao government delegation (to Dec. 4). In the visit, the day not given, the two sides issue a joint press communique: they will strictly observe the Geneva agreements of 1962 and hope the states concerned will faithfully carry out their provisions and respect Laos''s independence and neutrality.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 258 (Dec. 2–4, 1962). Names: Phoumi Nosavan. Check: the book gives the visit''s span, Zhou''s reception of the delegation and the communique, no day for either.'
    src:
      c: a7140046
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 258: all'
    tags: [polity:prc, polity:laos, name:phoumi-nosavan]
  - id: cal.1962-12-03.japan-and-korea
    when: Dec. 3–5
    date: '1962-12-03'
    thread: japan
    c: 'Second meeting of the Joint Committee, Washington. Kennedy at lunch, Dec. 3: Japan''s growth "the most extraordinary, modern industrial miracle"; the two to work as partners against a Chinese domination of Asia. Rusk and Dillon to Ōhira, apart: Japanese purchases of American arms to offset the dollars spent on the bases.'
    n: 'Remarks at a Luncheon in Honor of a Japanese Trade Delegation, [1962 Pub. Papers 850](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=910) (Dec. 3, 1962). FRUS 1961–63, XXII, docs. [361](https://history.state.gov/historicaldocuments/frus1961-63v22/d361), [362](https://history.state.gov/historicaldocuments/frus1961-63v22/d362). See [[cal.1961-11-02.japan-and-korea]]. Names: Kennedy, Rusk, Dillon, Ōhira.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:dillon-c-douglas, name:ohira-masayoshi]
