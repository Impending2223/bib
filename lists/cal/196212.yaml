    c: 'Prague. The Czechoslovak Communist Party''s Twelfth Congress opens (to Dec. 8). Novotný''s report attacks Albania sharply and the CCP without naming it, supporting Albania being supporting their dogmatism, sectarianism and nationalism; Brezhnev, heading the CPSU delegation and speaking second, abuses Albania and attacks, unnamed, "those who call themselves Marxists." A few parties apart, the delegations then attack Albania and name the CCP: of sixty-odd foreign delegations, fifty-odd name Albania, twenty-odd of them the CCP.'
