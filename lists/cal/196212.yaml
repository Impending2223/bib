  - id: cal.1962-12-15.mississippi
    when: Dec. 15
    date: '1962-12-15'
    thread: mississippi
    also: [civil-rights-the-executive]
    c: 'Robert Kennedy to Hannah: the Civil Rights Commission''s hearings in Mississippi, already put off from October and December, to be put off again. If Barnett''s and Paul Johnson''s contempt case goes to a jury, "the claim will be made that the Civil Rights Commission is working with the Department of Justice publicly to prejudice the State of Mississippi and its officials in the minds of the jury." A report "could be prepared, without any need for public hearings in the state."'
