  - id: cal.1962-12-01.goldwater
    when: Dec. 1
    date: '1962-12-01'
    thread: goldwater
    c: 'Chicago, the evening before the meeting. White to those of his group arrived early: become a "draft Goldwater" movement, if Goldwater agrees. Taken up; they agree to come into the open on Mar. 15, 1963.'
    n: '[[w.bernstein-guns-or-butter]], 126. To check: [[w.white-suite-3505]] (cited by [[w.bernstein-guns-or-butter]], 126 n.3). Check: whether the date of Mar. 15 was set that evening or the next day. See [[cal.1962-12-02.goldwater]]. Names: White, Goldwater.'
