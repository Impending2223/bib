  - id: cal.1962-12-13.legislatures-us
    when: Dec. 13
    date: '1962-12-13'
    thread: legislatures
    also: [court]
    c: 'Advisory Commission on Intergovernmental Relations, *Apportionment of State Legislatures*, adopted: both houses of a State legislature to be apportioned strictly by population; where population is the only factor, districts within 10 percent of the average; the courts to leave the drawing of districts to the legislature or a board. Governors Smylie and Hollings and four others dissent: population "unless the people directly determine otherwise."'
    n: '[ACIR, *Apportionment of State Legislatures* (A-15, Dec. 1962)](https://library.unt.edu/gpo/ACIR/Reports/policy/a-15.pdf#page=81). To check: [[w.baker-reapportionment-revolution]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Smylie, Hollings.'
    tags: [name:smylie-robert-e, name:hollings-ernest-f]
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'Economic Club of New York. Cut rates for persons and business: "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget." Kennedy to Heller afterward, by telephone, by Heller''s account: "I gave them straight Keynes and Heller, and they loved it."'
    n: 'Address and Question and Answer Period at the Economic Club of New York, [1962 Pub. Papers 875](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=935) (Dec. 14, 1962). [[w.stein-fiscal-revolution-in-america]], 417, 419–21 (the speech and its reception; the call, 420); [[w.zelizer-taxing-america]], 198 (the speech). To check: [[w.heller-new-dimensions-of-political]], 35 (the call; cited by [[w.stein-fiscal-revolution-in-america]], 420 n.61). See [[cal.1961-01-05.economy]]. Names: Kennedy, Heller.'
