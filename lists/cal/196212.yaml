    c: New York. The Board of Estimate, after a hearing of six hours, sets aside Moses's Lower Manhattan Expressway, an elevated highway across Broome Street from the Holland Tunnel to the East River bridges; Jacobs among its opponents. Check the date (Dec. 6 or 11) and the vote. Moses brings back a revised plan in May 1963.
    n: '[*New York Times*, Dec. 4, 1962](https://www.nytimes.com/1962/12/04/archives/relocation-report-is-help-to-downtown-expressway-relocation-plan.html); [Dec. 7](https://www.nytimes.com/1962/12/07/archives/expressway-vote-delayed-by-city-final-decision-is-postponed-after.html); [Wikipedia, "Interstate 78 in New York"](https://en.wikipedia.org/wiki/Interstate_78_in_New_York). To check: [[w.flint-wrestling-with-moses]]; [[w.caro-power-broker]]; [[w.robert-moses-and-the]]; [[w.zipp-manhattan-projects]]. Names: Moses, Jacobs.'
    tags: [state:ny, city:nyc, name:jacobs-jane, name:moses-robert]
  - id: cal.1962-12.states-and-cities-us
    when: Dec.
    date: 1962-12
    thread: states-and-cities
    also: [court, legislatures, amendments]
    c: 'The Council of State Governments'' General Assembly of the States, at Chicago, recommends three amendments to the Constitution, to be sought by applications of the legislatures: an amendment proposed by two-thirds of the legislatures in identical texts to go to the States without action by Congress; the apportionment of State legislatures taken from the federal courts; a Court of the Union, the fifty State chief justices, to review the Supreme Court''s judgments. Check the place and days.'
    n: '"Amending the Constitution to Strengthen the States in the Federal System," 36 *State Government* 10 (1963) (Check). To check: [[w.black-proposed-amendment-of-article]]; [[w.kurland-court-of-the-union]]; [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1962-03-26.court]].'
  - id: cal.1962-12.oil
    when: Dec.
    date: 1962-12
    thread: oil
    c: 'The world''s crude oil output in 1962, as the Bureau of Mines first counted it: 24.3 million barrels a day. The United States 7.33, the Soviet Union 3.72, Venezuela 3.20, Kuwait 1.83, Saudi Arabia 1.52. Libya 0.18; the Trucial States (Abu Dhabi) in the table for the first time, 0.02.'
    n: Bureau of Mines, [*Minerals Yearbook 1962*, II, Table 89, pp. 506–507](https://archive.org/details/pub_usgov-minerals-yearbook_1962_2/page/n513) (1963). See [[cal.1960-12.oil]].
