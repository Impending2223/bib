  - id: cal.1962-12-02.china
    when: Dec. 2
    date: '1962-12-02'
    thread: china
    also: [laos]
    c: 'Phoumi Nosavan, Deputy Prime Minister and Minister of Finance of the Royal Lao government, begins a visit to China at the head of a Lao government delegation (to Dec. 4). In the visit, the day not given, the two sides issue a joint press communique: they will strictly observe the Geneva agreements of 1962 and hope the states concerned will faithfully carry out their provisions and respect Laos''s independence and neutrality.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 258 (Dec. 2–4, 1962); [[w.chen-yi-nianpu]], 945 (Dec. 2, 1962; Chen Yi welcomes Phoumi Nosavan at the airport in the afternoon, gives a banquet for him, his wife and the delegation in the evening and speaks on the peaceful settlement in Laos, and with Li Xiannian meets the delegation). Names: Phoumi Nosavan. Check: the book gives the visit''s span, Zhou''s reception of the delegation and the communique, no day for either.'
