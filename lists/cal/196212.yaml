    also: [china]
    c: 'The conference of six Asian states, Ceylon, Cambodia, Burma, Indonesia, the United Arab Republic and Ghana, proposed by Prime Minister Bandaranaike of Ceylon to help bring about a peaceful settlement of the Sino-Indian conflict, meets at Colombo, Dec. 10–12. Its proposals, as the book''s editors'' note gives them: the existing cease-fire is a good starting point. In the west China is asked to make the 20-kilometer withdrawal proposed in Zhou''s letters of Nov. 21 and 28, India to keep its present positions, and the vacated area to be a demilitarized zone under civilian posts of both sides. In the east the line of actual control recognized by the two governments may serve as the cease-fire line. The middle sector is to be settled by peaceful means. A positive response would not prejudice either side''s position on the final boundary.'
