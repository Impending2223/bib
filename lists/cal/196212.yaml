  - id: cal.1962-12-14.economy-2
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'The Committee for Economic Development, *Reducing Tax Rates for Production and Growth*, released the morning of the Economic Club speech: $11 billion off, $6 billion from Jan. 1, 1963, $5 billion more once fiscal 1964 spending is held at 1963''s; the corporate rate from 52 to 42 percent; no reforms to delay it.'
    n: '[[w.stein-fiscal-revolution-in-america]], 418–19, 430, 441. To check: Committee for Economic Development, Research and Policy Committee, *Reducing Tax Rates for Production and Growth* (Dec. 1962) (cited by [[w.stein-fiscal-revolution-in-america]], 418 n.58, 430 n.14). Check: Zelizer, 198, dates the committee''s statement Dec. 13. See [[cal.1962-08-13.economy]].'
