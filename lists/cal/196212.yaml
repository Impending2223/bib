    c: 'Junius Scales, the one Communist imprisoned under the Smith Act''s membership clause, out of prison, his sentence commuted, home on Christmas Eve. He had broken with the party in 1956 and would not name those he had known in it; Hoover against release; White and Katzenbach had advised against. Robert Kennedy, in 1964: "I had his sentence commuted. I never discussed it with the President."'
