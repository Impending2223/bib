    c: 'Zhou Enlai to delegates of seven national special conferences (metallurgy, water, fisheries, overseas Chinese farms, handicrafts, the Youth League, North China''s mountain areas), "Draw on experience and lessons, do well the Third Five-Year Plan." Lessons: high targets, blind command, no three-in-one, no timely summing up; the trades "run big" crowded out others; steel, water and coal took too much capital and supported farming too little. He takes the main blame for the Center, State Council and ministries. Tasks: agriculture the base and industry the leader, toward four modernizations; support farming effectively and lastingly; join present and long-range construction; respect science and technical men.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 520 (Dec. 24, 1962). Continues 521. Made public: 1997. Names: Zhou Enlai.'
