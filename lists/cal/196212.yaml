    place: moscow
    thread: soviet-union-leadership
    also: [missile-crisis, cuba]
    c: 'The Presidium, the first session after Mikoyan''s return. Khrushchev''s postmortem: "Cuba has been maintained as a center of the revolutionary movement"; "The United States was forced to acknowledge that we have our own interests in the Western Hemisphere"; "We are members of the World Club. They themselves got scared." On Kennedy''s request for the Soviet troops'' withdrawal, he and Malinovsky to look into it.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 506–07; [[w.prezidium-tsk-kpss-1954]], I, 663 (Protocol 71); [[w.prezidium-tsk-kpss-1954]], III, 407–09 (P 71/I: Mikoyan''s work approved; Khrushchev''s speech on his report, as A. K. Serov took it down by hand, 409 n.а: "мы помогли Кубе – сделали правильно. Мы заставили США признать наши интересы в Америке" (we helped Cuba, did right. We made the United States recognize our interests in America); "участником международного клуба" (a member of the international club); "Американцы сами испугались" (the Americans themselves took fright); no treaty with Cuba now). See [[cal.1962-11-29.missile-crisis]]. Names: Mikoyan, Khrushchev, Kennedy, Malinovsky.'
