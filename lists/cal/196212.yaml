  - id: cal.1962-12-26.vietnam
    when: Dec. 26
    date: '1962-12-26'
    thread: vietnam
    c: 'Mansfield reports to Kennedy at Palm Beach. The war not being won; more Americans make it an American war. Check the date. By Mansfield''s account, Kennedy: "You expect me to believe this? This isn''t what my people are telling me." By his account of 1969, he advised "a curb and then a withdrawal."'
    n: 'Mansfield''s report of Dec. 18, [FRUS vol. 2, doc. 330](https://history.state.gov/historicaldocuments/frus1961-63v02/d330). [[w.gibbons-u-s-government-and]], II, 132–33 (Palm Beach, Dec. 26, two hours on Lake Worth, by Mansfield''s oral history; the report''s words); [[w.bernstein-guns-or-butter]], 326 (Kennedy, to O''Donnell later: "I got angry with Mike for disagreeing with our policy so completely, and I got angry with myself because I felt myself agreeing with him"); [[w.schlesinger-robert-kennedy-and-his]], 710 (Mansfield, "in private," tells Kennedy he is wrong to keep on sending advisers; Kennedy, to O''Donnell: "I got angry with Mike for disagreeing with our policy so completely," "and I got angry with myself because I found myself agreeing with him"; no day, no place); [[w.odonnell-johnny-we-hardly-knew]], 15 (Mansfield, back from Southeast Asia at the President''s request, to Kennedy at Palm Beach: curb the reinforcements and withdraw; Kennedy to O''Donnell afterward: "I got angry with Mike for disagreeing with our policy so completely, and I got angry with myself because I found myself agreeing with him"; the day not given). [[w.selverstone-kennedy-withdrawal]], 96–97 (the report; Palm Beach, "the day after Christmas"). [[w.reeves-president-kennedy]], 442–44 (Mansfield''s report). [[w.mann-grand-delusion]], 273, 275–76 (Palm Beach, the cruise; Kennedy''s words and the advice, by Mansfield''s accounts). Made public: the report of Dec. 18, S. Doc. 93-11 (Apr. 1973). To check: Mansfield''s oral history, June 3, 1964, 24, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], II, 133 n.148); [[w.al-vietnam-and-southeast-asia]]; [[w.oberdorfer-senator-mansfield-2003]]; Mike Mansfield, oral history, 24, Kennedy Library (cited by [[w.reeves-president-kennedy]], 443); Mansfield to Joe McCarthy, Oct. 6, 1969, XIX, 587, Mansfield Papers (cited by [[w.mann-grand-delusion]], 276 n.17, for the advice). See [[cal.1961-01-28.vietnam]]. Names: Mansfield, Kennedy. Check: the date; Gibbons and Mann both give Dec. 26, by Mansfield''s accounts.'
