# Cal. XXXVII December 1962
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXXVII
entries:
  - id: cal.1962-12-01.missile-crisis
    when: Dec. 1
    date: '1962-12-01'
    thread: missile-crisis
    c: 'Kennedy calls Schlesinger in: Bartlett and Stewart Alsop''s piece on Cuba for the *Saturday Evening Post*, which Chalmers Roberts is to present in the *Washington Post* as an attack on Stevenson. "You had better warn Adlai that this is coming"; he never talked to Bartlett or any reporter about the crisis.'
    n: '[[w.schlesinger-thousand-days-1965]], 835, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-05-24.missile-crisis]]. Names: Kennedy, Schlesinger, Bartlett, Alsop, Roberts, Stevenson.'
    src:
      c: 0098943d
      rows:
        - 'w.schlesinger-thousand-days-1965 835: all'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:bartlett-charles, name:alsop-stewart, name:roberts-chalmers-m, name:stevenson-adlai-e]
  - id: cal.1962-12-02.goldwater
    when: Dec. 2
    date: '1962-12-02'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Check the number.'
    n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). [[w.perlstein-before-the-storm]], 186–88. To check: [[w.white-making-of-the-president-1965]]. See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White, Rockefeller, Goldwater. Check: Perlstein, 186–87, gives fifty-five, at the Essex Motel, Dec. 1–2.'
    tags: [name:white-f-clifton, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1962-12-03.japan-and-korea
    when: Dec. 3–5
    date: '1962-12-03'
    thread: japan
    c: 'Second meeting of the Joint Committee, Washington. Kennedy at lunch, Dec. 3: Japan''s growth "the most extraordinary, modern industrial miracle"; the two to work as partners against a Chinese domination of Asia. Rusk and Dillon to Ōhira, apart: Japanese purchases of American arms to offset the dollars spent on the bases.'
    n: 'Remarks at a Luncheon in Honor of a Japanese Trade Delegation, [1962 Pub. Papers 850](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=910) (Dec. 3, 1962). FRUS 1961–63, XXII, docs. [361](https://history.state.gov/historicaldocuments/frus1961-63v22/d361), [362](https://history.state.gov/historicaldocuments/frus1961-63v22/d362). See [[cal.1961-11-02.japan-and-korea]]. Names: Kennedy, Rusk, Dillon, Ōhira.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:dillon-c-douglas, name:ohira-masayoshi]
  - id: cal.1962-12-03.governors-mn-recount
    when: Dec. 3
    date: '1962-12-03'
    thread: governors-mn-recount
    c: Rolvaag asks a recount; three district judges named to try it.
    n: 'Iric Nathanson, ["Gubernatorial Election Recount, 1962"](https://www.mnopedia.org/event/gubernatorial-election-recount-1962), *MNopedia*. Check: the day the judges were named. See [[cal.1962-11-06.governors-mn]]. Names: Rolvaag.'
    tags: [state:mn, name:rolvaag-karl-f]
  - id: cal.1962-12-03.missile-crisis
    when: Dec. 3
    date: '1962-12-03'
    thread: missile-crisis
    c: 'Salinger''s statement at noon, approved by Stevenson: the President''s full confidence in him; nothing of the Executive Committee to be disclosed. Stevenson tells Schlesinger he will go if wanted; Kennedy to Schlesinger: "Of course I don''t want Stevenson to resign."'
    n: '[[w.schlesinger-thousand-days-1965]], 835–37. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-12.missile-crisis]]. Names: Salinger, Stevenson, Schlesinger, Kennedy.'
    src:
      c: d92ae335
      rows:
        - 'w.schlesinger-thousand-days-1965 836–37: all'
    tags: [name:salinger-pierre, name:stevenson-adlai-e, name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1962-12-05.middle-east-johnson-plan
    when: Dec. 5
    date: '1962-12-05'
    thread: middle-east-johnson-plan
    c: 'Rusk to Kennedy by telephone: Israel''s answer on the refugee proposals not adequate. Of three courses Kennedy chooses to go ahead on the American reading of the understanding with Israel. Talbot so tells Harman: Israel to consult before backing a direct-negotiations resolution; talks on a refugee settlement to resume without preconditions.'
    n: 'FRUS 1961–63, XVIII, doc. [110](https://history.state.gov/historicaldocuments/frus1961-63v18/d110) and n. 1. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Rusk, Kennedy, Talbot, Harman.'
    tags: [name:rusk-dean, name:kennedy-john-f, name:talbot-phillips, name:harman-avraham]
  - id: cal.1962-12-05.missile-crisis
    when: Dec. 5
    date: '1962-12-05'
    thread: missile-crisis
    c: 'Kennedy''s letter to Stevenson: his confidence; Stevenson''s work at the UN of "inestimable" importance. Drafted for Stevenson alone, with a passage on Bartlett; the passage cut and the letter given to the press, Kennedy editing it by telephone.'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 569](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d569). [[w.schlesinger-thousand-days-1965]], 837–38. See [[cal.1962-12-03.missile-crisis]]. Names: Kennedy, Stevenson, Bartlett. Check: the day the letter was released.'
    src:
      c: 3ce9e07e
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d569: all'
        - 'w.schlesinger-thousand-days-1965 838: all'
    tags: [name:kennedy-john-f, name:stevenson-adlai-e, name:bartlett-charles]
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: 'Sylvester, Pentagon spokesman, at the Sigma Delta Chi dinner in New York: "inherent in that government''s right, if necessary, to lie to save itself when it''s going up into a nuclear war." "Managed news."'
    n: 'His remarks, as taped by ABC and transcribed by the American Newspaper Publishers Association: [109 Cong. Rec., Senate, Jan. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-11-1.pdf), 899–903, at 902. His testimony of Mar. 12, 1963, quoted: [109 Cong. Rec., Senate, Mar. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-14-2.pdf), 4280–81. News Conference, [1963 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=206) (Feb. 7, 1963). To check: [[w.salinger-with-kennedy]]. See [[cal.1961-01-25.press-and-broadcasting]]. Names: Sylvester.'
    tags: [name:sylvester-arthur]
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Alsop and Bartlett, *Saturday Evening Post*, Dec. 8: Stevenson "wanted a Munich." Bartlett a Kennedy friend. Stevenson stays.'
    n: 'News Conference, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926) (Dec. 12, 1962). [[w.schlesinger-thousand-days-1965]], 835–38. To check: [[w.martin-adlai-stevenson-and-the]]. See [[cal.1962-05-24.missile-crisis]]. Names: Alsop, Bartlett, Stevenson.'
    src:
      c: 64c13ef7
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926: all'
        - 'w.schlesinger-thousand-days-1965 835–38: all'
    tags: [name:alsop-stewart, name:stevenson-adlai-e, name:kennedy-john-f, name:bartlett-charles]
  - id: cal.1962-12-06.vietnam
    when: Dec. 6
    date: '1962-12-06'
    thread: vietnam
    c: 'The Politburo on the South after two years of the "special war": the armed forces grown but out of balance and behind the enemy''s tactics. Combat units to be sent south quickly, main forces and specialty branches enlarged, the trail''s transport group reinforced.'
    n: '[[w.vietnam-victory-in-vietnam]], 113–15 (by its count, more than 40,000 men down the trail by the end of 1963). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1961-02-25.vietnam]].'
    src:
      c: 232d0980
      rows:
        - 'w.vietnam-victory-in-vietnam 113–15: A-B'
  - id: cal.1962-12-07.middle-east-johnson-plan
    when: Dec. 7
    date: '1962-12-07'
    thread: middle-east-johnson-plan
    c: 'The PCC''s twentieth progress report: Joseph Johnson''s second round in a paragraph; his plan not named. The Commission "intends to carry forward its initiative." Dec. 6, State had told the mission to the UN to join France and Turkey in asking Johnson to defer his own report.'
    n: '[A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), paras. 12–14; printed in [[w.current-documents-1962]], 757–760. FRUS 1961–63, XVIII, doc. [111](https://history.state.gov/historicaldocuments/frus1961-63v18/d111). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
    tags: [name:johnson-joseph-e]
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    also: [labor-disputes]
    c: 'New York newspaper strike begins: the Typographical Union strikes five dailies; four others shut down. 20,000 idle. 114 days.'
    n: Bureau of Labor Statistics, [*Analysis of Work Stoppages, 1962*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1381_1963.pdf), Bull. No. 1381 (1963), 3, 20. News Conference, [1963 Pub. Papers 92](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=150) (Jan. 24, 1963); News Conference, [1963 Pub. Papers 201](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=259) (Feb. 21, 1963). See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12-09.opinion-5
    when: Dec. 9
    date: '1962-12-09'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: choice for 1964: Rockefeller 41, Nixon 21, Romney 15, Goldwater 11, Dirksen 4, Scranton 3; others, no preference 5. Republicans, by second choices reallocated to four: Rockefeller 52, Goldwater 16, Romney 15, Scranton 5.'
    n: '[[w.gallup-poll]], III, 1793–94. Names: Rockefeller, Romney, Scranton, Nixon, Goldwater, Dirksen.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:dirksen-everett, name:scranton-william-w]
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
    c: McNamara in London tells Thorneycroft Skybolt will likely be cancelled.
    n: 'News Conference, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926) (Dec. 12, 1962). [FRUS 1961–63, XIII, doc. 401](https://history.state.gov/historicaldocuments/frus1961-63v13/d401). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 382–83; [[w.poole-joint-chiefs-of-staff]], 201. To check: [[w.neustadt-report-to-jfk]]; the aide-mémoire of Dec. 11, 1962, SecDef Subject Decimal files, and Rubel''s notes of the meeting, Neustadt Papers, JFK Library (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 383 n.92). Names: McNamara, Thorneycroft.'
    src:
      c: 21c97c90
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d401: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 382–83: all'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 383 n.92a: all'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 383 n.92b: all'
        - 'w.poole-joint-chiefs-of-staff 201: all'
        - 'via w.poole-joint-chiefs-of-staff 201 n.58: all'
    tags: [name:mcnamara-robert-s, name:thorneycroft-peter]
  - id: cal.1962-12-12.opinion-5
    when: Dec. 12
    date: '1962-12-12'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: the four, by region: Rockefeller 50 in the East, 44 in the Midwest, 42 in the South, 55 in the West. Goldwater 12 to 16.'
    n: '[[w.gallup-poll]], III, 1794–95. Names: Rockefeller, Romney, Scranton, Goldwater.'
    tags: [name:rockefeller-nelson, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w]
  - id: cal.1962-12-12.europe-and-the-alliance
    when: Dec. 12–13
    date: '1962-12-12'
    thread: europe-and-the-alliance
    also: [missile-crisis]
    c: 'The Jupiters. At Paris for NATO''s ministers, Rusk to the Turkish Foreign Minister, Dec. 12; McNamara to the Turkish and Italian defense ministers, Dec. 13: the Jupiters dismantled by Apr. 1, Polaris submarines in the Mediterranean in their place, each government to share in their targeting. McNamara''s letter, Jan. 5. Turkey accepts in principle, Jan. 27, with conditions: nuclear weapons for its F-100 squadrons first.'
    n: 'FRUS 1961–63, XVI, docs. [384](https://history.state.gov/historicaldocuments/frus1961-63v16/d384), [386](https://history.state.gov/historicaldocuments/frus1961-63v16/d386) (the letter), [390](https://history.state.gov/historicaldocuments/frus1961-63v16/d390), [394](https://history.state.gov/historicaldocuments/frus1961-63v16/d394). See [[cal.1961-04-06.europe-and-the-alliance]], [[cal.1962-10-27.missile-crisis]]. Names: Rusk, McNamara.'
    tags: [name:rusk-dean, name:mcnamara-robert-s]
  - id: cal.1962-12-12.mississippi
    when: Dec. 12
    date: '1962-12-12'
    thread: mississippi
    also: [desegregation-public-places]
    c: Jackson. John and Eldri Salter and four students of the North Jackson NAACP youth council picket Woolworth's on Capitol Street to open the youth council's boycott of the downtown stores; arrested. Mayor Thompson on television against the boycott.
    n: '[[w.dittmer-local-people]], 157–59. To check: [[w.salter-jackson-mississippi]]. Names: Salter, Thompson.'
    src:
      c: 5d7578fa
      rows:
        - 'w.dittmer-local-people 157–59: all'
    tags: [state:ms, city:jackson, name:salter-john, name:thompson-allen-c]
  - id: cal.1962-12-12.economy
    when: Dec. 12
    date: '1962-12-12'
    thread: economy
    c: 'Kennedy and Mills on the tax cut, 5:36 p.m., recorded. Mills, in *U.S. News & World Report* of Dec. 17: no cut from Jan. 1, 1963, nor one made without regard to the deficit; spending held, and reforms to offset part of the cut.'
    n: '[Meetings with Wilbur Mills on the Tax Cut Proposal and on Agricultural Subsidies](https://millercenter.org/the-presidency/secret-white-house-tapes/meetings-wilbur-mills-tax-cut-proposal-and-agricultural), Tape 67 (Miller Center). The President''s News Conference of December 12, 1962, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926): "I''m going to see Congressman Mills today." [[w.stein-fiscal-revolution-in-america]], 434; [[w.zelizer-taxing-america]], 198. See [[cal.1962-08-13.economy]]. Names: Kennedy, Mills.'
    tags: [name:kennedy-john-f, name:mills-wilbur-d]
  - id: cal.1962-12-13.legislatures-us
    when: Dec. 13
    date: '1962-12-13'
    thread: legislatures
    also: [court]
    c: 'Advisory Commission on Intergovernmental Relations, *Apportionment of State Legislatures*, adopted: both houses of a State legislature to be apportioned strictly by population; where population is the only factor, districts within 10 percent of the average; the courts to leave the drawing of districts to the legislature or a board. Governors Smylie and Hollings and four others dissent: population "unless the people directly determine otherwise."'
    n: '[ACIR, *Apportionment of State Legislatures* (A-15, Dec. 1962)](https://library.unt.edu/gpo/ACIR/Reports/policy/a-15.pdf#page=81). To check: [[w.baker-reapportionment-revolution]]; [[w.dixon-democratic-representation]]. See [[cal.1962-03-26.court]]. Names: Smylie, Hollings.'
    tags: [name:smylie-robert-e, name:hollings-ernest-f]
  - id: cal.1962-12-14.economy
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'Economic Club of New York. Cut rates for persons and business: "an economy hampered by restrictive tax rates will never produce enough revenue to balance the budget."'
    n: 'Address and Question and Answer Period at the Economic Club of New York, [1962 Pub. Papers 875](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=935) (Dec. 14, 1962). [[w.stein-fiscal-revolution-in-america]], 417, 419–21 (the speech and its reception); [[w.zelizer-taxing-america]], 198 (the speech). To check: [[w.heller-new-dimensions-of-political]]. See [[cal.1961-01-05.economy]]. Names: Heller.'
    tags: [name:kennedy-john-f, name:heller-walter-w]
  - id: cal.1962-12-14.space
    when: Dec. 14
    date: '1962-12-14'
    thread: space
    c: Mariner 2 passes Venus. First planetary flyby.
    n: See [[cal.1961-04-12.space]].
  - id: cal.1962-12-14.africa
    when: Dec. 14
    date: '1962-12-14'
    thread: africa
    c: 'NSAM 211: Kennedy asks for a strategy for Algeria, from emergency relief toward development, American aid supplementing France''s; a report by the end of January.'
    n: FRUS 1961–63, XXI, doc. [77](https://history.state.gov/historicaldocuments/frus1961-63v21/d77). See [[cal.1962-10-15.africa]].
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-14.economy-2
    when: Dec. 14
    date: '1962-12-14'
    thread: economy
    c: 'The Committee for Economic Development, *Reducing Tax Rates for Production and Growth*, released the morning of the Economic Club speech: $11 billion off, $6 billion from Jan. 1, 1963, $5 billion more once fiscal 1964 spending is held at 1963''s; the corporate rate from 52 to 42 percent; no reforms to delay it.'
    n: '[[w.stein-fiscal-revolution-in-america]], 418–19, 430, 441. Check: Zelizer, 198, dates the committee''s statement Dec. 13. See [[cal.1962-08-13.economy]].'
  - id: cal.1962-12-15.mississippi
    when: Dec. 15
    date: '1962-12-15'
    thread: mississippi
    also: [civil-rights-the-executive]
    c: 'Robert Kennedy to Hannah: the Civil Rights Commission''s hearings in Mississippi, already put off from October and December, to be put off again. If Barnett''s and Paul Johnson''s contempt case goes to a jury, "the claim will be made that the Civil Rights Commission is working with the Department of Justice publicly to prejudice the State of Mississippi and its officials in the minds of the jury." A report "could be prepared, without any need for public hearings in the state."'
    n: '[[w.dittmer-local-people]], 195 (the letter; Hannah''s reply, Jan. 2: "this decision is difficult for us"). To check: Robert Kennedy to Hannah, Dec. 15, 1962, and Hannah to Kennedy, Jan. 2, 1963, Marshall Papers, box 30, JFK Library (cited by [[w.dittmer-local-people]], 195 n.3). Names: Robert Kennedy, Hannah, Barnett, Paul Johnson.'
    src:
      c: 2590c272
      rows:
        - 'w.dittmer-local-people 195: all'
        - 'via w.dittmer-local-people 195 n.3a: all'
    tags: [name:kennedy-robert-f, name:hannah-john-a, name:barnett-ross-r, name:johnson-paul-b-jr, state:ms]
  - id: cal.1962-12-17.press-and-broadcasting
    when: Dec. 17
    date: '1962-12-17'
    thread: press-and-broadcasting
    c: '"After Two Years." An hour with three network correspondents.'
    n: 'Television and Radio Interview: "After Two Years—a Conversation with the President", [1962 Pub. Papers 889](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=949) (Dec. 17, 1962). See [[cal.1961-01-25.press-and-broadcasting]].'
    tags: [name:kennedy-john-f]
  - id: cal.1962-12-17.georgia-atlanta
    when: Dec. 17–18
    date: '1962-12-17'
    thread: georgia
    also: [open-housing]
    c: Atlanta. A Negro having bought a house in Peyton Forest, white homeowners ask for barricades across Peyton and Harlan Roads; the Board of Aldermen votes them, Allen signs, and they go up the next day. Jan. 7, the aldermen vote to keep them; Mar. 1, a Fulton Superior Court judge holds them unconstitutional.
    n: '[Order, *Googer v. City of Atlanta*, No. A-97679 (Fulton Super. Ct. Mar. 1, 1963)](https://ivanallen.iac.gatech.edu/mayoral-records/traditional/items/show/7304) (Ivan Allen Jr. Mayoral Records, Box 17, Folder 11). [Wikipedia, "Atlanta''s Berlin Wall"](https://en.wikipedia.org/wiki/Atlanta''s_Berlin_Wall); *Time*, Jan. 18, 1963, "The South: Divided City." [[w.kruse-white-flight]]. To check: [[w.allen-mayor]]; [[w.stone-regime-politics]]. Names: Allen.'
    tags: [name:allen-ivan-jr, state:ga, city:atlanta]
  - id: cal.1962-12-17.open-housing-co
    when: Dec. 17
    date: '1962-12-17'
    thread: open-housing
    also: [states-and-cities]
    c: '*Colorado Anti-Discrimination Commission v. Case*, [151 Colo. 235](https://static.case.law/colo/151/case-pdfs/0235-01.pdf): the Colorado Supreme Court, en banc, sustains the Fair Housing Act of 1959 under the police power; a refusal to sell compelled is no taking for private use. Its grant of power to order "such other action as in the judgment of the commission will effectuate the purposes of this article" struck, a delegation of legislative power, and the parts of the Commission''s order resting on it. Moore for the court; Hall dissenting.'
    n: '*Colorado Anti-Discrimination Commission v. Case*, [151 Colo. 235](https://static.case.law/colo/151/case-pdfs/0235-01.pdf), 380 P.2d 34 (1962). To check: [[w.peirce-mountain-states-of-america]].'
    tags: [state:co]
  - id: cal.1962-12-17.civil-rights-the-executive
    when: Dec. 17
    date: '1962-12-17'
    thread: civil-rights-the-executive
    also: [king, africa]
    c: 'The American Negro Leadership Conference on Africa at the White House: King, Randolph, Wilkins, Farmer, Whitney Young, Dorothy Height and Theodore Brown give Kennedy its resolutions. After, King alone with Kennedy on the bombing of Bethel Baptist Church in Birmingham and the administration''s stand. No promises: Congress would doom a civil rights bill.'
    n: '[[w.garrow-bearing-the-cross]], 224–25. Check: the day; Garrow cites the *Washington Post*, Dec. 18, 1962 (668 n.55). Names: King, Randolph, Wilkins, Farmer, Young, Kennedy.'
    tags: [name:king-martin-luther-jr, name:randolph-a-philip, name:wilkins-roy, name:farmer-james, name:young-whitney-m-jr, name:kennedy-john-f]
  - id: cal.1962-12-18.europe-and-the-alliance
    when: Dec. 18–21
    date: '1962-12-18'
    thread: europe-and-the-alliance
    c: Nassau. Polaris for Britain in place of Skybolt, assigned to a NATO force. The same offered de Gaulle.
