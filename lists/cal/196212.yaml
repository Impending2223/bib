    c: After four flights, 426 men out, Castro demands the $2,925,000 pledged for the wounded by 3 p.m. or the rest stay. Nolan and Williams call Robert Kennedy and Katzenbach early in the morning. Kennedy calls Cardinal Cushing, who pledges $1 million, and General Clay, who raises the other $1,925,000 and signs a personal note for it.
    n: '[[w.guthman-we-band-of-brothers]], 136; [[w.schlesinger-robert-kennedy-and-his]], 537 (half the remaining prisoners loaded, the Cubans hold the rest until the $2.9 million unpaid for the April release comes; Robert Kennedy turns to Cushing, who raises $1 million in a few hours from Latin American friends; Clay raises the rest on his personal note; not the flights, the hour, the figure $1,925,000 or the calls of Nolan and Williams); [[w.odonnell-johnny-we-hardly-knew]], 311–12 (Cushing''s account: Robert Kennedy telephones him, at the President''s suggestion, to ask for a million dollars before the day is over, to get the prisoners out before Christmas; he calls back in three hours with the money, to be delivered to the White House before six that night; Robert Kennedy had raised $1,900,000 with the help of General Clay; Castro''s demand for $2,900,000 "only a few days before the Christmas Eve deadline"; not Nolan and Williams''s calls, the flights, the hour or Katzenbach). To check: Richard Cardinal Cushing, recorded interview by Jean Stein, n.d., 3, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 537 n.16). See [[cal.1962-12-23.cuba]]. Names: Castro, Robert Kennedy, Katzenbach, Clay. Check: the day; Guthman: "It was Sunday" (Dec. 23), the money due at 3 p.m. "the next afternoon."'
