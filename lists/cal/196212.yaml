        - 'w.preston-war-council 66: all'
    tags: [name:bundy-mcgeorge, name:ball-george-w]
  - id: cal.1962-12-06.cuba
    when: Dec. 6
    date: '1962-12-06'
    thread: cuba
    c: The American Red Cross joins the ransom, to receive the goods and move them to Miami and Cuba. Industry told by Justice that firms meeting on costs, prices and shipping will not violate the antitrust laws; the Internal Revenue Service rules gifts deductible.
    n: '[[w.guthman-we-band-of-brothers]], 133–34. See [[cal.1962-11-24.cuba]]. Check: the day of Justice''s assurance and the Service''s ruling.'
    src:
      c: 78712efd
      rows:
        - 'w.guthman-we-band-of-brothers 133–34: all'
  - id: cal.1962-12-07.middle-east-johnson-plan
    when: Dec. 7
    date: '1962-12-07'
    thread: middle-east-johnson-plan
    c: 'The PCC''s twentieth progress report: Joseph Johnson''s second round in a paragraph; his plan not named. The Commission "intends to carry forward its initiative." Dec. 6, State had told the mission to the UN to join France and Turkey in asking Johnson to defer his own report.'
    n: '[A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), paras. 12–14; printed in [[w.current-documents-1962]], 757–760. FRUS 1961–63, XVIII, doc. [111](https://history.state.gov/historicaldocuments/frus1961-63v18/d111). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
    tags: [name:johnson-joseph-e]
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    also: [labor-disputes]
    c: 'New York newspaper strike begins: the Typographical Union strikes five dailies; four others shut down. 20,000 idle. 114 days.'
    n: Bureau of Labor Statistics, [*Analysis of Work Stoppages, 1962*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1381_1963.pdf), Bull. No. 1381 (1963), 3, 20. News Conference, [1963 Pub. Papers 92](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=150) (Jan. 24, 1963); News Conference, [1963 Pub. Papers 201](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=259) (Feb. 21, 1963). See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12-09.opinion-5
    when: Dec. 9
    date: '1962-12-09'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: choice for 1964: Rockefeller 41, Nixon 21, Romney 15, Goldwater 11, Dirksen 4, Scranton 3; others, no preference 5. Republicans, by second choices reallocated to four: Rockefeller 52, Goldwater 16, Romney 15, Scranton 5.'
    n: '[[w.gallup-poll]], III, 1793–94. Names: Rockefeller, Romney, Scranton, Nixon, Goldwater, Dirksen.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:dirksen-everett, name:scranton-william-w]
  - id: cal.1962-12-10.european-community
    when: Dec. 10
    date: '1962-12-10'
    thread: european-community
    c: 'Ball to Kennedy: the Brussels negotiations nearly at dead center, de Gaulle and Adenauer cool to British entry, the British treating them as "a commercial haggle." Hallstein, at lunch with Ball, ready to be a channel between the Commission and the British; Heath asks a confidential meeting with Ball in Paris in mid-January.'
    n: '[FRUS 1961–63, XIII, doc. 55](https://history.state.gov/historicaldocuments/frus1961-63v13/d55). The meeting: [[cal.1963-01-10.european-community-2]]. Names: Ball, Kennedy, de Gaulle, Adenauer, Hallstein, Heath.'
    src:
      c: 6a4a713d
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d55: all'
    tags: [name:ball-george-w, name:kennedy-john-f, name:de-gaulle-charles, name:adenauer-konrad, name:hallstein-walter, name:heath-edward-r-g]
  - id: cal.1962-12-10.europe-and-the-alliance
    when: Dec. 10
    date: '1962-12-10'
    thread: europe-and-the-alliance
    c: 'Evening. McNamara sends Ball the statement he means to make on landing in London: Skybolt has failed its flight tests. Ball by telephone, by his account: leave the tests out; he comes to consult, not to cancel, and must say nothing of substance before he sees the government.'
    n: '[[w.ball-past-has-another-pattern]], 263–64. See [[cal.1962-12-11.europe-and-the-alliance]]. Names: McNamara, Ball.'
    src:
      c: 84c56168
      rows:
