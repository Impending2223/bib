    date: '1962-12-03'
    thread: defense
    c: 'McNamara''s revised memoranda. Continental defense now "inadequate," not "negligible": the ten single-squadron bases dropped and the 19 interceptor squadrons kept, as the Chiefs asked; the Nike-Hercules still to the missile sites; a war game of the bomber threat. General purpose forces: no change in the force levels.'
