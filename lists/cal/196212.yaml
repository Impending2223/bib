entries:
  - id: cal.1962-12-01.missile-crisis
    when: Dec. 1
    date: '1962-12-01'
    thread: missile-crisis
    c: 'Kennedy calls Schlesinger in: Bartlett and Stewart Alsop''s piece on Cuba for the *Saturday Evening Post*, which Chalmers Roberts is to present in the *Washington Post* as an attack on Stevenson. "You had better warn Adlai that this is coming"; he never talked to Bartlett or any reporter about the crisis.'
    n: '[[w.schlesinger-thousand-days-1965]], 835, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-05-24.missile-crisis]]. Names: Kennedy, Schlesinger, Bartlett, Alsop, Roberts, Stevenson.'
    src:
      c: 0098943d
      rows:
        - 'w.schlesinger-thousand-days-1965 835: all'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:bartlett-charles, name:alsop-stewart, name:roberts-chalmers-m, name:stevenson-adlai-e]
  - id: cal.1962-12-02.goldwater
    when: Dec. 2
    date: '1962-12-02'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Check the number.'
    n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). [[w.perlstein-before-the-storm]], 186–88; [[w.young-two-suns-of-the]], 64 (the plan made public: Cronkite on the *CBS Evening News*, December 1962). To check: White to Rusher, Oct. 18, 1962 ("This meeting will determine"), William A. Rusher Papers, Library of Congress, box 155/5 (cited by [[w.perlstein-before-the-storm]], 186 n.3); The colored map of the Essex Motel meeting, F. Clifton White Papers, Cornell University, "White/Primaries, maps, etc." (cited by [[w.perlstein-before-the-storm]], 187 n.1a); "Secret Meet to Push Goldwater," San Francisco Examiner, Dec. 4, 1961 [as printed; 1962], A1 (cited by [[w.perlstein-before-the-storm]], 187 n.3a); "Goldwater ''64 Boom," New York Herald Tribune, Dec. 4, 1962 (cited by [[w.perlstein-before-the-storm]], 187 n.3b); [[w.white-making-of-the-president-1965]]. See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White, Rockefeller, Goldwater. Check: Perlstein, 186–87, gives fifty-five, at the Essex Motel, Dec. 1–2.'
    src:
      c: 1c9229f0
      rows:
        - 'https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052: all'
        - 'w.perlstein-before-the-storm 186–88: A-D'
        - 'via w.perlstein-before-the-storm 186 n.3: B'
        - 'via w.perlstein-before-the-storm 187 n.1a: B'
        - 'via w.perlstein-before-the-storm 187 n.1b: B'
        - 'via w.perlstein-before-the-storm 187 n.3a: C'
        - 'via w.perlstein-before-the-storm 187 n.3b: C'
        - 'w.young-two-suns-of-the 64: C'
    tags: [name:white-f-clifton, name:rockefeller-nelson, name:goldwater-barry-m]
  - id: cal.1962-12-03.japan-and-korea
    when: Dec. 3–5
    date: '1962-12-03'
    thread: japan
    c: 'Second meeting of the Joint Committee, Washington. Kennedy at lunch, Dec. 3: Japan''s growth "the most extraordinary, modern industrial miracle"; the two to work as partners against a Chinese domination of Asia. Rusk and Dillon to Ōhira, apart: Japanese purchases of American arms to offset the dollars spent on the bases.'
    n: 'Remarks at a Luncheon in Honor of a Japanese Trade Delegation, [1962 Pub. Papers 850](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=910) (Dec. 3, 1962). FRUS 1961–63, XXII, docs. [361](https://history.state.gov/historicaldocuments/frus1961-63v22/d361), [362](https://history.state.gov/historicaldocuments/frus1961-63v22/d362). See [[cal.1961-11-02.japan-and-korea]]. Names: Kennedy, Rusk, Dillon, Ōhira.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:dillon-c-douglas, name:ohira-masayoshi]
  - id: cal.1962-12-03.governors-mn-recount
    when: Dec. 3
    date: '1962-12-03'
    thread: governors-mn-recount
    c: Rolvaag asks a recount; three district judges named to try it.
    n: 'Iric Nathanson, ["Gubernatorial Election Recount, 1962"](https://www.mnopedia.org/event/gubernatorial-election-recount-1962), *MNopedia*. Check: the day the judges were named. See [[cal.1962-11-06.governors-mn]]. Names: Rolvaag.'
    tags: [state:mn, name:rolvaag-karl-f]
  - id: cal.1962-12-03.missile-crisis
    when: Dec. 3
    date: '1962-12-03'
    thread: missile-crisis
    c: 'Salinger''s statement at noon, approved by Stevenson: the President''s full confidence in him; nothing of the Executive Committee to be disclosed. Stevenson tells Schlesinger he will go if wanted; Kennedy to Schlesinger: "Of course I don''t want Stevenson to resign."'
    n: '[[w.schlesinger-thousand-days-1965]], 835–37. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-12.missile-crisis]]. Names: Salinger, Stevenson, Schlesinger, Kennedy.'
    src:
      c: d92ae335
      rows:
        - 'w.schlesinger-thousand-days-1965 836–37: all'
    tags: [name:salinger-pierre, name:stevenson-adlai-e, name:schlesinger-arthur-m-jr, name:kennedy-john-f]
  - id: cal.1962-12-05.middle-east-johnson-plan
    when: Dec. 5
    date: '1962-12-05'
    thread: middle-east-johnson-plan
    c: 'Rusk to Kennedy by telephone: Israel''s answer on the refugee proposals not adequate. Of three courses Kennedy chooses to go ahead on the American reading of the understanding with Israel. Talbot so tells Harman: Israel to consult before backing a direct-negotiations resolution; talks on a refugee settlement to resume without preconditions.'
    n: 'FRUS 1961–63, XVIII, doc. [110](https://history.state.gov/historicaldocuments/frus1961-63v18/d110) and n. 1. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Rusk, Kennedy, Talbot, Harman.'
    tags: [name:rusk-dean, name:kennedy-john-f, name:talbot-phillips, name:harman-avraham]
  - id: cal.1962-12-05.missile-crisis
    when: Dec. 5
    date: '1962-12-05'
    thread: missile-crisis
    c: 'Kennedy''s letter to Stevenson: his confidence; Stevenson''s work at the UN of "inestimable" importance. Drafted for Stevenson alone, with a passage on Bartlett; the passage cut and the letter given to the press, Kennedy editing it by telephone.'
    n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 569](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d569). [[w.schlesinger-thousand-days-1965]], 837–38. See [[cal.1962-12-03.missile-crisis]]. Names: Kennedy, Stevenson, Bartlett. Check: the day the letter was released.'
    src:
      c: 3ce9e07e
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d569: all'
        - 'w.schlesinger-thousand-days-1965 838: all'
    tags: [name:kennedy-john-f, name:stevenson-adlai-e, name:bartlett-charles]
  - id: cal.1962-12-05.economy
    when: Dec. 5
    date: '1962-12-05'
    thread: economy
    c: 'Mills to O''Brien: no cut effective before Jan. 1964; let the President not stress the cut in his speech to the Economic Club; with the economy improving, Congress''s reaction to an immediate cut would be "extremely adverse."'
    n: '[[w.zelizer-taxing-america]], 197. To check: O''Brien to Kennedy, Dec. 5, 1962, President''s Office Files, JFK Library (cited by [[w.zelizer-taxing-america]], 197 n.70). See [[cal.1962-12-14.economy]]. Names: Mills, O''Brien.'
    src:
      c: 3711ead9
      rows:
        - 'w.zelizer-taxing-america 197: all'
        - 'via w.zelizer-taxing-america 197 n.70: all'
    tags: [name:mills-wilbur-d, name:obrien-lawrence-f]
  - id: cal.1962-12-06.press-and-broadcasting
    when: Dec. 6
    date: '1962-12-06'
    thread: press-and-broadcasting
    c: 'Sylvester, Pentagon spokesman, at the Sigma Delta Chi dinner in New York: "inherent in that government''s right, if necessary, to lie to save itself when it''s going up into a nuclear war." "Managed news."'
    n: 'His remarks, as taped by ABC and transcribed by the American Newspaper Publishers Association: [109 Cong. Rec., Senate, Jan. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-11-1.pdf), 899–903, at 902. His testimony of Mar. 12, 1963, quoted: [109 Cong. Rec., Senate, Mar. 14, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt3/pdf/GPO-CRECB-1963-pt3-14-2.pdf), 4280–81. News Conference, [1963 Pub. Papers 148](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=206) (Feb. 7, 1963). To check: [[w.salinger-with-kennedy]]. See [[cal.1961-01-25.press-and-broadcasting]]. Names: Sylvester.'
    tags: [name:sylvester-arthur]
  - id: cal.1962-12.missile-crisis
    when: Dec.
    date: 1962-12
    thread: missile-crisis
    c: 'Alsop and Bartlett, *Saturday Evening Post*, Dec. 8: Stevenson "wanted a Munich." Bartlett a Kennedy friend. Stevenson stays.'
    n: 'News Conference, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926) (Dec. 12, 1962). [[w.schlesinger-thousand-days-1965]], 835–38. To check: [[w.martin-adlai-stevenson-and-the]]. See [[cal.1962-05-24.missile-crisis]]. Names: Alsop, Bartlett, Stevenson.'
    src:
