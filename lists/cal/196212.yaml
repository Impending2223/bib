        - 'w.schlesinger-thousand-days-1965 835–38: all'
    tags: [name:alsop-stewart, name:stevenson-adlai-e, name:kennedy-john-f, name:bartlett-charles]
  - id: cal.1962-12-06.vietnam
    when: Dec. 6
    date: '1962-12-06'
    thread: vietnam
    c: 'The Politburo on the South after two years of the "special war": the armed forces grown but out of balance and behind the enemy''s tactics. Combat units to be sent south quickly, main forces and specialty branches enlarged, the trail''s transport group reinforced.'
    n: '[[w.vietnam-victory-in-vietnam]], 113–15 (by its count, more than 40,000 men down the trail by the end of 1963); [[w.moyar-triumph-forsaken]], 182. Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1961-02-25.vietnam]].'
    src:
      c: 232d0980
      rows:
        - 'w.vietnam-victory-in-vietnam 113–15: A-B'
        - 'w.moyar-triumph-forsaken 182: A'
  - id: cal.1962-12-07.middle-east-johnson-plan
    when: Dec. 7
    date: '1962-12-07'
    thread: middle-east-johnson-plan
    c: 'The PCC''s twentieth progress report: Joseph Johnson''s second round in a paragraph; his plan not named. The Commission "intends to carry forward its initiative." Dec. 6, State had told the mission to the UN to join France and Turkey in asking Johnson to defer his own report.'
    n: '[A/5337](https://documents.un.org/doc/UNDOC/GEN/NL6/212/01/PDF/NL621201.PDF#page=4), paras. 12–14; printed in [[w.current-documents-1962]], 757–760. FRUS 1961–63, XVIII, doc. [111](https://history.state.gov/historicaldocuments/frus1961-63v18/d111). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
    tags: [name:johnson-joseph-e]
  - id: cal.1962-12-08.press-and-broadcasting
    when: Dec. 8
    date: '1962-12-08'
    thread: press-and-broadcasting
    also: [labor-disputes]
    c: 'New York newspaper strike begins: the Typographical Union strikes five dailies; four others shut down. 20,000 idle. 114 days.'
    n: Bureau of Labor Statistics, [*Analysis of Work Stoppages, 1962*](https://fraser.stlouisfed.org/files/docs/publications/bls/bls_1381_1963.pdf), Bull. No. 1381 (1963), 3, 20. News Conference, [1963 Pub. Papers 92](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=150) (Jan. 24, 1963); News Conference, [1963 Pub. Papers 201](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=259) (Feb. 21, 1963). See [[cal.1961-01-25.press-and-broadcasting]].
  - id: cal.1962-12-09.opinion-5
    when: Dec. 9
    date: '1962-12-09'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 16–21: choice for 1964: Rockefeller 41, Nixon 21, Romney 15, Goldwater 11, Dirksen 4, Scranton 3; others, no preference 5. Republicans, by second choices reallocated to four: Rockefeller 52, Goldwater 16, Romney 15, Scranton 5.'
    n: '[[w.gallup-poll]], III, 1793–94. Names: Rockefeller, Romney, Scranton, Nixon, Goldwater, Dirksen.'
    tags: [name:rockefeller-nelson, name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:dirksen-everett, name:scranton-william-w]
  - id: cal.1962-12-11.europe-and-the-alliance
    when: Dec. 11
    date: '1962-12-11'
    thread: europe-and-the-alliance
