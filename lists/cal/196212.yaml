  - id: cal.1962-12-02.goldwater
    when: Dec. 2
    date: '1962-12-02'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. White''s draft group meets in secret, some forty by the UPI''s count, many from the South: a Goldwater drive, and Rockefeller stopped. The meeting in the papers Dec. 3. Goldwater: he knew nothing of it. Check the number.'
    n: 'UPI, *University Daily Kansan*, Dec. 4, 1962 ([KU Libraries](https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052)). [[w.perlstein-before-the-storm]], 186–88; [[w.young-two-suns-of-the]], 64 (the plan made public: Cronkite on the *CBS Evening News*, December 1962); [[w.white-suite-3505]], 92–106 (the meeting, the Essex Inn, South Michigan Avenue, Dec. 2, fifty-five; the private session the night before, Goldwater chosen; the AP''s story, Dec. 3; Goldwater''s word to White by telephone, "I don''t know a thing about it," 103); [[w.white-making-of-the-president-1965]], 92 (fifty-five, the Essex Inn Motel; a prayer at the opening; the press''s "sinister" draft); [[w.goldberg-barry-goldwater]], 167–68 (less than a month after the elections; fifty-five members; White''s visits to twenty-eight States and contacts in fourteen more; $3.2 million to be raised before the convention; more than 655 votes on the first ballot from the South, West and Midwest; the draft to go public in March 1963 if Goldwater would "not ... disown" it); [[w.bernstein-guns-or-butter]], 126 (the Associated Press unmasks the meeting Dec. 3; CBS News on the scene that evening); [[w.novak-agony-of-the-g]], 127–28 (the Essex Motor Inn; *Advance*''s account: 701 votes counted; Bruce of Indiana dissenting; White: Goldwater will not run "until and unless he sees adequate financing"). [[w.kabaservice-rule-and-ruin]], 63 (White''s meeting at the Essex Motor Inn outside Chicago, early December; an informant of *Advance* there, who leaked its outline to the press). Check: Novak, 127, gives Dec. 1–2 and nearly one hundred present. See [[cal.1961-10-08.goldwater]]. Made public: UPI, Dec. 3, 1962. Names: White, Rockefeller, Goldwater. Check: Perlstein, 186–87, gives fifty-five, at the Essex Motel, Dec. 1–2. Check: White, 92, 110, gives fifty-five.'
    src:
      c: 1c9229f0
      rows:
        - 'https://digital.lib.ku.edu/islandora/object/ku-udk%3A12052: all'
