    c: 'Peking, morning. Liu Shaoqi presides at the Standing Committee on the delegation''s report from Prague. The congresses'' attacks on Albania and China are growing worse and the Czechoslovak is most abnormal. It decides on a special statement by the delegation, with instructions: hold to principle and struggle, answer after, leave room, never leave the congress; Deng Xiaoping has the writers draft both at once. It decides too to write commentaries answering the attacks in public, the Czechoslovak congress first, the attackers'' words to be printed beforehand, the CPSU and Khrushchev not yet named, as Mao has said more than once; Mao agrees by Yang Shangkun''s telephone call.'
