    tags: [state:ms, city:jackson, name:salter-john, name:thompson-allen-c]
  - id: cal.1962-12-12.economy
    when: Dec. 12
    date: '1962-12-12'
    thread: economy
    c: 'Kennedy and Mills on the tax cut, 5:36 p.m., recorded. Mills, in *U.S. News & World Report* of Dec. 17: no cut from Jan. 1, 1963, nor one made without regard to the deficit; spending held, and reforms to offset part of the cut.'
    n: '[Meetings with Wilbur Mills on the Tax Cut Proposal and on Agricultural Subsidies](https://millercenter.org/the-presidency/secret-white-house-tapes/meetings-wilbur-mills-tax-cut-proposal-and-agricultural), Tape 67 (Miller Center). The President''s News Conference of December 12, 1962, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926) ("I''m going to see Congressman Mills today"). [[w.stein-fiscal-revolution-in-america]], 434; [[w.zelizer-taxing-america]], 198. To check: "Why a Tax Cut Is Unlikely in ''63," *U.S. News & World Report*, Dec. 17, 1962, 42–45 (cited by [[w.stein-fiscal-revolution-in-america]], 434 n.27; [[w.zelizer-taxing-america]], 198 n.72). See [[cal.1962-08-13.economy]]. Names: Kennedy, Mills.'
    src:
