  - id: cal.1966-04-04.vietnam
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam
    c: 'McNaughton, "Some Thoughts About Vietnam": Cuba and Berlin came out well; in Vietnam none of the three conditions holds. "The situation in Vietnam is bad and not getting better"; the riots "reveal a rottenness in the fabric that may not be curable." Even with full deployments, "a continued stalemate at a higher level" in 1967; several divisions for years even if the war is won.'
    n: '[[w.gibbons-u-s-government-and]], IV, 291–92. To check: McNaughton, "Some Thoughts About Vietnam," Apr. 4, 1966, Department of State, Lot File 70 D 207 (cited by [[w.gibbons-u-s-government-and]], IV, 291 n.68). Names: McNaughton.'
    src:
      c: 6283b0e1
      rows:
        - 'w.gibbons-u-s-government-and IV, 291–92: all'
        - 'via w.gibbons-u-s-government-and IV, 291 n.68: all'
    tags: [name:mcnaughton-john-t]
  - id: cal.1966-04-05.vietnam-struggle
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam-struggle
    c: Three battalions of Vietnamese marines flown to the Đà Nẵng air base. Kỳ, who had called the city held by Communists (Check the day), satisfied it is not, back to Saigon.
    n: '[FRUS 1964–68, IV, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v04/d113). [[w.gibbons-u-s-government-and]], IV, 281–82 (the airlift; Kỳ to Đà Nẵng and back). Gibbons gives two battalions of marines on Apr. 5 (IV, 281) and two more, flown by the Vietnamese air force, the night of Apr. 8 (IV, 286); William Bundy''s memorandum of Apr. 5, three on the air base (doc. 113). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ.'
    src:
