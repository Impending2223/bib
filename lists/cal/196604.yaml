  - id: cal.1966-04-02.vietnam
    when: Apr. 2
    date: '1966-04-02'
    thread: vietnam-struggle
    c: 'At the White House, on the Struggle Movement: keep Kỳ if possible, a fallback ready; Lodge to press Trí Quang.'
    n: 'FRUS 1964–68, IV, docs. [108](https://history.state.gov/historicaldocuments/frus1964-68v04/d108), [109](https://history.state.gov/historicaldocuments/frus1964-68v04/d109). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 276–79. See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ, Thích Trí Quang, Lodge.'
