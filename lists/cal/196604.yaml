    c: 'Tashkent, the day after the earthquake. Brezhnev, there with Kosygin Apr. 26–28, hears Novikov, chairman of the government commission, and holds the meeting on the damage. His notes: some 10,800 families to be moved, tents registered, lump-sum payments watched; the homeless housed for two or three years at least; bricks from the whole country, a strong design bureau and a building industry, every republic and even cities to help, building cut elsewhere in Uzbekistan for now; a bold plan for the center.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 133–34 (№ 27, "Доклад тов. Новикова И.Т. в Ташкенте" (Comrade Novikov''s report in Tashkent); № 28, "Совещание в Ташкенте после землетрясения" (the meeting in Tashkent after the earthquake), Apr. 27), 170 nn.2–5 (the editors: the quake Apr. 26, 28 to 36 thousand buildings down, over 300,000 homeless; Brezhnev and Kosygin there Apr. 26–28; the commission set up by the Politburo Apr. 26; the resolution of June 14). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 122 (the secretaries'' record, Apr. 26–28: Brezhnev flies to Tashkent Apr. 26, 11:25 a.m.; Apr. 27, with Kosygin, he visits the stricken districts and the Golodnaya Steppe; Apr. 28 on to Krasnodar). Made public: 2016. Names: Brezhnev, Kosygin, Novikov.'
