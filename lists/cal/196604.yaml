    place: dacca
    thread: china-liu
    also: [south-asia, china-foreign]
    c: 'Liu Shaoqi talks with Ayub Khan at Dacca. On the international situation he says: in the twenty years since the Second World War most Asian and African states and a few Latin American ones have thrown off colonial rule and won independence; independence for them is a general trend of development that goes on and will not change direction. The Western colonial states will not willingly withdraw wholly from their spheres of power and still hope to keep their political and economic interests; in fact there is a struggle, of the oppressed peoples of Asia, Africa and Latin America and their leaders who want independence against the colonial states that want to keep their interests and privileges, and it will continue; a reverse current may come for a time, but the general trend is for them to free themselves wholly from imperialism and colonialism and win complete independence.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636 (Apr. 16, 1966); [[w.chen-yi-nianpu]], 1143 (Apr. 16, 1966, afternoon, the President''s House; Chen Yi present). Made public: 1996. Names: Liu Shaoqi, Ayub Khan.'
