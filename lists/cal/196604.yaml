  - id: cal.1966-04-01.china-leadership
    when: Apr. 1
    date: '1966-04-01'
    thread: china-zhou
    also: [china-agriculture]
    c: 'Zhou Enlai, in the second quake zone (Dongwang and Gengzhuangqiao communes in Ningjin, Matouli and Hejiazhai in Julu), inspects drought work and spring sowing and speaks at a mass meeting: production first, houses after; self-reliance, the state''s help secondary; record the costly lessons for later generations. He visits over 140 patients at Dongwang''s temporary hospital and reaches Xingtai at night.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-04-01.china-leadership-2
    when: Apr. 1
    date: '1966-04-01'
    place: gengzhuangqiao
    thread: china-zhou
    also: [china-propaganda]
    c: 'Zhou Enlai at Gengzhuangqiao, inspecting the Academy of Sciences'' earthquake team: prediction must be accurate and in time. To the University of Science and Technology''s seismology students: he hopes their generation will solve earthquake prediction. He orders Peking''s building designers brought to the site, to settle what houses will stand a quake.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 24 (Apr. 1, 1966, the item after). Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
