    place: washington
    thread: vietnam-struggle
    c: 'At the White House, on the Struggle Movement: keep Kỳ if possible, a fallback ready;{1} Lodge to press Trí Quang.{2} Johnson: perhaps "take a stand in Thailand."{3}'
    n: 'FRUS 1964–68, IV, docs. [108](https://history.state.gov/historicaldocuments/frus1964-68v04/d108), [109](https://history.state.gov/historicaldocuments/frus1964-68v04/d109). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 276–79; [[w.dallek-flawed-giant]], 360 (Apr. 2, advisers: "make every effort to keep Ky. But be ready to make terrible choice. Perhaps take a stand in Thailand—or take someone else other than Ky"; not Trí Quang); [[w.bird-color-of-truth]], 351 (the Thailand words). To check: [[w.prados-hidden-history-of-the]] (cited by [[w.bird-color-of-truth]], 351 n.4). See [[cal.1966-03-10.vietnam]]. Names: Johnson, Nguyễn Cao Kỳ, Thích Trí Quang, Lodge. Check: Bird''s sentence may give the words to Rostow, with William Bundy''s retort, "Walt, are you mad?"; doc. 109 lists neither as present.'
