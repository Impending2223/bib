  - id: cal.1966-04-16.china-leadership
    when: Apr. 16–24
    date: '1966-04-16'
    place: hangzhou
    thread: china-may-sixteenth
    also: [china-hai-rui, china-mao-cr]
    follows:
      - cal.1966-04-16.china-leadership-7
    c: 'Hangzhou.{1} Mao presides over an enlarged Standing Committee meeting, mainly to criticize Peng Zhen;{2} also to dissolve the Five-Man Group and set up a new Cultural Revolution Group.{3} Present: Liu Shaoqi (from Apr. 20, back from Pakistan, Afghanistan and Burma), Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Yi, Li Xiannian, Chen Boda, Kang Sheng, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Li Jingquan, Tao Zhu, Li Xuefeng, Liu Lantao, Song Renqiong, Wei Wenbo and Jiang Hua.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 16, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 28 (Apr. 16, 1966; Zhou at the meeting); [[w.macfarquhar-maos-last-revolution]], 33–34 (Apr. 16, Liu Shaoqi abroad: the Group of Five dissolved, a drafting group set up); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 636–637 (Apr. 20, 1966; Liu reaches Hangzhou and attends the enlarged meeting of the Politburo Standing Committee Mao presides over, which prepares for the enlarged Politburo meeting soon to be held in Peking); [[w.deng-xiaoping-nianpu-1904]], III, 1909 (Apr. 16–25, 1966; Deng at the enlarged Politburo Standing Committee meeting Mao holds at Hangzhou, which concentrates on criticizing Peng Zhen and also discusses revoking the ''February Outline'' and the Group of Five for the Cultural Revolution and setting up a Cultural Revolution Group again; it in the main adopts the draft ''Notice of the Central Committee'' 《中国共产党中央委员会通知》 (draft), several times revised by Mao, and the list of the Central Cultural Revolution Group, for the Politburo''s enlarged meeting about to be held at Peking); [[w.mao-zedong-zhuan]], VI, ch. 74 (Apr. 16 Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi 陈毅, Ye Jianying 叶剑英 and the heads of the Center bureaus come again to Hangzhou for the enlarged Standing Committee meeting Mao calls; Liu Shaoqi, on his journey to Pakistan, Afghanistan and Burma, reaches Hangzhou only on the 20th). [[w.yang-jisheng-tiandi-fanfu]], I, 125–127 (Apr. 16–24, Mao presides at Hangzhou over the enlarged Standing Committee meeting, mainly to criticize Peng Zhen and to discuss revoking the Outline; it takes up Peng''s errors, the revoking of the Outline, the dissolving of the Group and the setting up of a new cultural-revolution group; Mao: "I do not believe it is only Wu Han''s problem ... there are people in the court 朝裏有人, in every great region and every province and city"; the Feb. 3 paper "in a hurry"; on rectifying the left at Wuhan, "I do not agree"; Liu Shaoqi, back at Kunming 昆明 Apr. 19, is told by the General Office to come at once; the day he reaches Hangzhou not given); [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (at the Liuzhuang guesthouse; the February Outline revoked; the year printed "1996"); [[w.peng-zhen-nianpu-1902]], IV, 482–483 (Apr. 16–24, 1966; Peng Zhen there; the meeting centers on criticizing him, and on withdrawing the February Outline and the Five-Man Group and setting up a Cultural Revolution Group; Zhou Enlai, Deng Xiaoping, Chen Yi, Ye Jianying and the regional heads there, Liu Shaoqi from the 20th, back from abroad; seven papers exposing Peng and Lu Dingyi printed and sent to all members of the Peking committee; Mao: *Spark in the Reeds* allowed only three days in Peking, not a day more, "no needle can go in, no water be splashed in"; Deng: his working relations with Peng normal; Zhou: in Peking he finds whom he needs; Mao to Peng: criticism to help, not to be tense; Peng silent throughout; Peng examines himself: the outline wrong, his alone, not Liu''s, Zhou''s or Deng''s, who interjected that they shared it; "say I plot, I am not that kind of man"; Mao after: "do not be tense, we help you," "things can always be examined clear"); [[w.jian-zhou-enlai]], 539 (Mao "appeared at the meeting on April 23": Peng, backing Wu Han, has made the criticism hard; "revisionism has not only appeared in the cultural circles but has also emerged in the party, the government, and the military, which is a very big problem"; the conference links Peng, Luo Ruiqing, Lu Dingyi and Yang Shangkun as a "counterrevolutionary clique"); [[w.teiwes-tragedy-of-lin-biao]], 61 (the April Standing Committee meeting at Hangzhou, whose record of the absent Mao''s views shapes the May meeting); [[w.chen-yi-nianpu]], 1144 (Apr. 22–24, 1966; Chen Yi at the enlarged meeting of the Politburo Standing Committee at Hangzhou, which criticizes the "February Outline" 《二月提纲》 drawn up under Peng Zhen and adopts the revised draft of the "Notice" (the later May 16 Notice) Mao revised many times); [[w.pu-weihua-zalan-jiu-shijie]], 70–71 (the second Hangzhou meeting, "to lift the lid on Peng Zhen"; Liu Shaoqi, back at Kunming Apr. 19, called by the General Office, reaches Hangzhou Apr. 20 and presides, Zhou Enlai in fact chairing; decided, the Outline and the Five-Man Group withdrawn, a new Cultural Revolution Group set up); [[w.liu-jixian-ye-jianying-nianpu]], II, 936 (Apr. 17–25, 1966; Ye Jianying 叶剑英 at Mao''s enlarged Standing Committee at Hangzhou 杭州: Peng Zhen and the February Outline criticized; the Notice (the May 16 Notice) drafted under Chen Boda 陈伯达 and revised by Mao adopted in revised draft); [[w.zhu-de-nianpu-xinbian]], III, 1951 (Apr. 17–25, 1966; Mao Zedong 毛泽东 presides over the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议 at Hangzhou 杭州, with Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真, Ye Jianying 叶剑英 and others and the heads of the regional bureaus; Liu Shaoqi 刘少奇 and Chen Yi 陈毅, called by urgent cable, come from Kunming 昆明 on Apr. 20; Zhu De 朱德 is not told to attend; the meeting dissolves the Five-Man Group 文化革命五人小组 and its office and sets up a drafting group for the Cultural Revolution''s documents under the Politburo Standing Committee; Peng Zhen is wrongly criticized). Made public: 1996. Check: [[w.jian-zhou-enlai]], 539, puts Mao''s appearance and words at the meeting on Apr. 23; [[cal.1966-04-22.china-leadership]] and [[cal.1966-04-24.china-leadership]] have him speak Apr. 22 and preside Apr. 24. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 12 (cited by [[w.macfarquhar-maos-last-revolution]], 33 n.5); [[w.zedong-mao-zedong-nianpu]], V, 580 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 125 n.45); [[w.xianzhi-mao-zedong-zhuan-1949]], 1407–1408 (cited by [[w.jian-zhou-enlai]], 539 n.82a); [[w.zedong-mao-zedong-nianpu]], V, 580 (cited by [[w.jian-zhou-enlai]], 539 n.82b); [[w.nianyi-da-dongluande-niandai]], 9–16 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 267–268 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8b); [[w.ye-yonglie-chen-boda]], 261 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8c). Names: Mao Zedong, Peng Zhen, Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping, Chen Yi, Li Xiannian, Chen Boda, Kang Sheng, Nie Rongzhen, Ye Jianying, Xie Fuzhi, Xiao Hua, Li Jingquan, Tao Zhu, Li Xuefeng, Liu Lantao, Song Renqiong, Wei Wenbo, Jiang Hua.'
