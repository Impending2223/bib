    also: [vietnam-hanoi, china-foreign]
    c: 'Zhou Enlai and Deng Xiaoping receive and give a dinner for the Vietnam Workers'' Party delegation under Lê Duẩn, and exchange views on relations between the two parties.{1} In the talk (Zhou, Deng and Kang Sheng; Lê Duẩn and Nguyễn Duy Trinh), Deng: Mao told the Chinese they were too enthusiastic on Vietnam; with 130,000 Chinese in the country, does Vietnam suspect China of wanting control? If so, the military men will go home at once; and a Chinese ship kept four days off Hon Gai. Lê Duẩn: no concern about the men, Chinese aid the most direct, 500,000 not too many in a crisis; the two parties differ in judging the Soviets, whom Vietnam does not attack in public.{2}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 28 (Apr. 13, 1966); [[w.zhou-enlai-waijiao-huodong]], 492 (Apr. 13, 1966; Zhou and Deng Xiaoping receive and give a banquet for the Vietnam Workers'' Party delegation under First Secretary Lê Duẩn); [[w.77-conversations-between-chinese]], [91–96](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=89) (doc. 19; Beijing, Apr. 13, 1966, no hour: Deng on ''too much enthusiasm'', the northeast islands'' works and the coastal ones, 45 artillery sites near the Soviet missile positions, the Chinese ship at Hon Gai and Cam Pha; Lê Duẩn on the Soviets, reformists and the united front; 91 n.142, Kang Sheng; 92 n.143, Beidaihe; 93 n.144, Văn Tiến Dũng; the editors'' note 140 to doc. 18 has the delegation''s visit as Mar. 22–25). [[w.deng-xiaoping-nianpu-1904]], III, 1909 (Apr. 13, 1966; afternoon, 下午; Deng with Zhou Enlai meets the delegation of the Vietnam Workers'' Party Central Committee under Lê Duẩn 黎笋, its first secretary, exchanging views on the relations of the two parties and other matters); [[w.khoo-collateral-damage]], 34–35 (Zhou, Deng and Lê Duẩn, Apr. 13, 1966: Deng asks why Hanoi fears to displease the Soviets; Lê Duẩn: the main problem is how to judge the Soviet Union); [[w.friedman-shadow-cold-war]], 168 (Liu Shaoqi and Deng, meeting the Vietnamese on their way to and from the Twenty-third Congress: break with the CPSU, "a renegade from Marxism-Leninism"; Deng threatens to withdraw the Chinese troops; Lê Duẩn: "You are saying that the Soviets are selling out Vietnam, but we don''t say so"). Made public: 1993. To check: [[w.77-conversations-between-chinese]], 94 (cited by [[w.khoo-collateral-damage]], 35 n.180); Report of Soviet embassy PRC "On the Relations of the PRC to the Vietnam Question," June 2, 1966, AVPRF f.079 o.21 papka 55 d.29, 137 (cited by [[w.friedman-shadow-cold-war]], 168 n.89). Names: Zhou Enlai, Deng Xiaoping, Lê Duẩn, Kang Sheng, Nguyễn Duy Trinh, Mao Zedong.'
