    also: [china-army]
    c: 'The Center issues the army forum summary with its note (Mao, early April, on the Apr. 1 draft: "read, agree"): the summary rightly treats the basic questions of class struggle on the art front, for the army and for the whole front.{1} (The Center withdrew it May 3, 1979.){2}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, early Apr. 1966 (the entry "4月上旬", which gives the issue, Apr. 10) and note 22. [[w.macfarquhar-maos-last-revolution]], 30–31 (issued Apr. 10 as Zhongfa [1966] 211); [[w.jianguo-yilai-mao-zedong]], XVIII, 230, 234 (Apr. 1966; Mao''s note, "Read, agreed. Back to Peng Zhen," on Peng''s draft of the Center''s instruction forwarding the summary, sent Apr. 1; note 1: the Center forwarded the summary Apr. 10; withdrawn May 3, 1979, at the General Political Department''s request; not the wording of the Center''s note); [[w.macfarquhar-origins-of-the-cultural]], III, 451–52 (the summary: a sharp struggle in the arts, a black line since 1949, ten points for the General Political Department); [[w.mao-zedong-zhuan]], VI, ch. 74 (on Mao''s approval the Center transmits the forum summary Apr. 10, asking every committee to study it closely and carry it out). [[w.yang-jisheng-tiandi-fanfu]], I, 128 (Apr. 10, the summary issued as a Central Committee document, Zhongfa [66] no. 211 中發〔66〕211號, down to county and regiment level 縣團級); [[w.pu-weihua-zalan-jiu-shijie]], 47–48 (the comment as Liu Zhijian''s men drafted it Mar. 31, quoted, 47; issued Apr. 10 as Zhongfa (66) 211 中發(66)211號, to Party committees down to county and regiment level, 48); [[w.liu-jixian-ye-jianying-nianpu]], II, 935–936 (Apr. 10, 1966; the Center approves the summary of the forum on army literary and artistic work that Lin Biao 林彪 entrusted to Jiang Qing 江青: a "black line" opposed to Chairman Mao''s thought has held dictatorship over literature and art since 1949, to be wiped out); [[w.zhu-de-nianpu-xinbian]], III, 1950 (Apr. 10, 1966; the Center 中共中央 approves the "Summary of the forum on literature and art in the forces that Comrade Lin Biao entrusted Comrade Jiang Qing to hold" 《林彪同志委托江青同志召开的部队文艺工作座谈会纪要》, which says a black line against Chairman Mao''s thought has held sway over literature and art since 1949, and calls for a great socialist revolution on the cultural front to root it out). Made public: 2006. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: Summary of the Army Forum on Literature and Art Work called by Jiang Qing at the behest of Lin Biao (Zhongfa [1966] 211), in [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 604–610 (cited by [[w.macfarquhar-maos-last-revolution]], 31 n.69); Peng Zhen, submission to Mao Zedong of the draft Central Committee instruction forwarding the army forum summary, Apr. 1, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 234 n.1b); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 604–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 451 n.123); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 607 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 452 n.124); Summary of the forum on army literary and art work, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 610 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 452 n.125). Names: Mao Zedong, Jiang Qing, Lin Biao.'
