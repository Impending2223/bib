  - id: cal.1966-04-02.vietnam-struggle
    when: Apr. 2
    date: '1966-04-02'
    thread: vietnam-struggle
    c: 'Lodge, 3672: "firm decisions and necessary action can no longer wait": announce the program for a constitution and elections, restore order at Huế and Đà Nẵng with Vietnamese forces, arrest the movement''s leaders. If asked, fly the troops in; Americans otherwise out of it. A contingency plan if the government falls.'
    n: '[[w.gibbons-u-s-government-and]], IV, 277–78. To check: Saigon to Washington 3672, Apr. 2, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 277 n.36). Names: Lodge.'
    src:
      c: 9452f1ab
      rows:
        - 'w.gibbons-u-s-government-and IV, 277–78: all'
        - 'via w.gibbons-u-s-government-and IV, 277 n.36: all'
    tags: [name:lodge-henry-cabot]
  - id: cal.1966-04-02.vietnam-struggle-2
    when: Apr. 2
    date: '1966-04-02'
    thread: vietnam-struggle
    c: 'Rusk to Lodge, 2950, drafted himself after the lunch with Johnson: Trí Quang to be disabused of the idea that the United States is "stuck" with its commitment, a "satellite" whose men''s lives are at his disposal; "if the US is to persist in South Viet-Nam it must have something to support." Keep Thiệu and Kỳ; the President wants Lodge''s views on alternatives.'
    n: '[[w.gibbons-u-s-government-and]], IV, 278–79. To check: Washington to Saigon 2950, Apr. 2, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 278 n.39). See [[cal.1966-04-02.vietnam]]. Names: Rusk, Lodge, Thích Trí Quang, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Johnson.'
    src:
      c: 3e845f85
      rows:
        - 'w.gibbons-u-s-government-and IV, 278–79: all'
        - 'via w.gibbons-u-s-government-and IV, 278 n.39: all'
    tags: [name:rusk-dean, name:lodge-henry-cabot, name:thich-tri-quang, name:nguyen-van-thieu, name:nguyen-cao-ky, name:johnson-lyndon-b]
  - id: cal.1966-04-02.vietnam-struggle-3
    when: Apr. 2
    date: '1966-04-02'
    thread: vietnam-struggle
    c: 'State to Lodge, 2948, drafted by William Bundy, cleared by Rusk: Dương Văn Minh or Trần Văn Đôn might replace the I Corps commander.'
    n: '[[w.gibbons-u-s-government-and]], IV, 279. To check: Washington to Saigon 2948, Apr. 2, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 279 n.40). See [[cal.1966-04-02.vietnam]]. Names: William Bundy, Rusk, Lodge, Dương Văn Minh, Trần Văn Đôn.'
