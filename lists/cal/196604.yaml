    c: 'Message on civil rights.{1} The first federal law against discrimination in the sale and rental of housing, by owners, brokers, and lenders.{2} Federal crimes for violence against those exercising their rights: voting, schooling, housing, work, jury service, travel.{3} Juries in federal and State courts chosen without discrimination.{4} The Attorney General to sue against segregated schools and public facilities without waiting for a complaint. Enforcement power for the Equal Employment Opportunity Commission. 100 more FBI agents.{5}'
