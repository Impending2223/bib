  - id: cal.1966-04-05.china-leadership
    when: Apr. 5
    date: '1966-04-05'
    place: ci-county
    thread: china-zhou
    c: 'Zhou Enlai at Ci County, to officials of Hebei, Handan and the central departments, on what his inspection of the past days showed, repeating what he had said on the tour. The drive for wells has run hot: "active attitude, steady steps, voluntary, self-reliance", neither phrase to be dropped; no added burdens on the people; mechanization step by step; relief joined to production, loans to spur self-help, not dependence.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 25–26 (Apr. 5, 1966). The chronology: 就几天视察中发现的问题 ... 又讲了以上内容 (III, 25), the inspection of several days, not of the day. Made public: 2020. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-04-05.china-leadership-2
    when: Apr. 5
    date: '1966-04-05'
    place: yuecheng-reservoir
    thread: china-zhou
    also: [china-agriculture]
    follows:
      - cal.1966-04-05.china-leadership
    c: 'Zhou Enlai inspects the Yuecheng Reservoir. A reservoir serves flood control and irrigation together: in a dry year irrigation counts more; plan for all uses, farm and forest too; the water department to see it through. Told part of the main dam was built by dumping earth into water, he calls it unsafe, to be watched, and the method to be recorded in the project file: do not hide faults from later generations. On earthquakes: find their laws; prediction not yet solved anywhere; "why not we first?"'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 26 (Apr. 5, 1966, the item after). Made public: 2020. The order: after [[cal.1966-04-05.china-leadership]], the printed order alone ([[w.zhou-enlai-nianpu-1949-2020]], III, 25–26). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
  - id: cal.1966-04-05.china
    when: Apr. 5
    date: '1966-04-05'
    thread: china
    c: The Foreign Ministry spokesman, on orders, makes the 400th serious warning, on a U.S. warship's intrusion into waters east of the Min River mouth, Fujian. The statement says that since the first warning of Sept. 1958, U.S. warship and aircraft intrusions have grown each year more frequent, wider and graver, and threaten China's safety, Asia and world peace.
