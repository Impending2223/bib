    tags: [name:bundy-william, name:rusk-dean, name:lodge-henry-cabot, name:duong-van-minh, name:tran-van-don]
  - id: cal.1966-04-03.opinion
    when: Apr. 3
    date: '1966-04-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 3–8: overall feelings about Vietnam: a necessary evil 43 percent; the United States should get out 15; be more aggressive 12; fear of war 11; a wish for a quick end 10; too many lives lost 5.'
    n: '[[w.gallup-poll]], III, 1998–99.'
  - id: cal.1966-04-04.vietnam-struggle
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'Washington to Saigon: no American forces in Đà Nẵng or Huế or against dissident troops.'
    n: 'FRUS 1964–68, IV, docs. [110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110), [112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 279–81. See [[cal.1966-03-10.vietnam]].'
