  - id: cal.1966-04-22.china-leadership
    when: Apr. 22
    date: '1966-04-22'
    place: hangzhou
    thread: china-may-sixteenth
    also: [china-hai-rui, china-mao-cr]
    c: 'Hangzhou. Mao to the enlarged Standing Committee meeting: not Wu Han alone;{1} a struggle touching souls, with people "in the court" in the Center departments, bureaus and provinces, culture and propaganda offices, the Party and army above all.{2} The Feb. 3 Outline was hurried; at Wuhan he rejected the talk of dealing with the left.{3} "No breaking, no building": break, and give reasons.{4} Revisionism may come early or late in China;{5} it may come in the Party and army, not only in culture.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 22, 1966. [[w.macfarquhar-origins-of-the-cultural]], III, 458 (Mao calls the Standing Committee at Hangzhou to lay down the guidelines); [[w.deng-xiaoping-nianpu-1904]], III, 1910 (Apr. 22, 1966; afternoon, 下午; Deng at the enlarged Standing Committee meeting Mao presides over); [[w.mao-zedong-zhuan]], VI, ch. 74 nn.35, 36 (Apr. 22 Mao''s long speech: not Wu Han''s question alone; a struggle that touches souls, men ''in the court'' in the Center and in the regions, provinces and cities, the army too; ''on Feb. 3 it was hurry hurry'' with a group paper; at Wuhan ''on rectifying the left I did not agree''; revisionism in China: two possibilities, none or some, early or late; n.35, and n.36 for ''revisionism not only in the cultural world, the Party, government and army will breed it, and above all the Party and army'', Wang Renzhong''s diary of Apr. 29, the day of the remark not given). [[w.peng-zhen-nianpu-1902]], IV, 483 (Apr. 22, 1966; Mao: not only Wu Han''s case, a struggle touching souls, with people "at court," the culture bureaus, the propaganda departments; one or two criticized in each province and city, the army too; "court" not only the Center but regions, provinces, cities; the outline: "on Feb. 3 a Five-Man Group paper in haste, impatient; at Wuhan talk of rectifying the left, I did not agree"; the local committees "not understanding, not earnest, not effective"); [[w.pu-weihua-zalan-jiu-shijie]], 70 (the day not given: Peking''s air oppressive, he would rather live in Shanghai; not Wu Han alone, a struggle touching the soul; "people in the court", in the Center, the regions, provinces and cities, the army; revisionism not in culture alone but in Party, government and army, chiefly Party and army; schools and places each to criticize a few; no breaking, no building; the notice open to discussion, even its rejection); [[w.liu-jixian-ye-jianying-nianpu]], II, 936 (Apr. 22, 1966; Mao''s long speech to the meeting: a grave view of the situation, revisionism not only in culture but in the Party, government and army). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 458 n.155); Mao Zedong 毛泽东, speech at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议 (record 讲话记录), Apr. 22, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.35); Wang Renzhong 王任重, diary 日记, Apr. 29, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.36). Names: Mao Zedong, Wu Han.'
