  - id: cal.1966-04-09.china-leadership
    when: Apr. 9–12
    date: '1966-04-09'
    place: peking
    thread: china-may-sixteenth
    also: [china-hai-rui]
    c: 'The Secretariat meets under Deng Xiaoping, Zhou Enlai attending.{1} Kang Sheng conveys Mao''s criticism of the Five-Man Group''s Outline and criticizes Peng Zhen.{2} Decided: a Center notice withdrawing the Outline;{3} a document-drafting group for the cultural revolution, Chen Boda head, Jiang Qing and Liu Zhijian deputies, Kang Sheng adviser, members including Yin Da, Zhang Chunqiao, Chen Yading, Guan Feng, Qi Benyu, Wu Lengxi, Wang Li, Mu Xin and Yang Yongzhi.{4} Zhou, Deng and Peng Zhen report to Mao.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 9, 1966. [[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Apr. 9, 1966; Zhou at the Secretariat meeting); [[w.macfarquhar-maos-last-revolution]], 33 (Apr. 9–12; Kang Sheng and Chen Boda make the charges; a circular annulling the Outline proposed); [[w.macfarquhar-origins-of-the-cultural]], III, 458 (Kang Sheng and Chen Boda attack Peng Zhen; a condemnation of the outline to be drafted; the drafting group, later the Central Cultural Revolution Group); [[w.deng-xiaoping-nianpu-1904]], III, 1907–1908 (Apr. 9, 11 and 12, 1966; Deng presides at three Secretariat meetings, at which Kang Sheng, back from outside Peking, conveys Mao''s three talks of late March (footnote 2: Mar. 28–30, at Shanghai, with Kang Sheng, Jiang Qing, Zhang Chunqiao and others, criticizing the ''February Outline'' for confusing class lines and right and wrong and calling the Propaganda Department a ''palace of the King of Hell'' that the Peking Party committee and the Propaganda Department shelter bad people, naming Peng Zhen); Kang Sheng and Chen Boda criticize Peng Zhen''s so-called ''serious errors'' and Peng is forced to make a self-criticism; Zhou Enlai and Wu Lengxi attend; the meeting decides to draft in the Center''s name a notice thoroughly criticizing the errors of the ''February Outline'' and revoking it, and to form a drafting group for cultural revolution documents headed by Chen Boda, to report to Mao and the Standing Committee); [[w.mao-zedong-zhuan]], VI, ch. 74 n.34 (Apr. 9–12 Kang Sheng relays Mao''s talks at the Secretariat meeting; Peng Zhen is criticized, he and some others present make preliminary self-criticisms and ''agree to the Chairman''s criticism and instructions''; decided: a Center notice to criticize the group of five''s outline thoroughly and withdraw it, and a drafting group for cultural revolution documents, Chen Boda head, Jiang Qing and Liu Zhijian 刘志坚 deputies, Kang Sheng adviser, to go to Mao and the Standing Committee for approval; the report of Apr. 12, n.34). [[w.yang-jisheng-tiandi-fanfu]], I, 125 (Deng Xiaoping, recalled urgently from outside Peking 緊急從外地召回, presides, Zhou attending; Kang Sheng relays Mao''s instructions; Peng states that he never has opposed and never will oppose Chairman Mao; Kang Sheng and Chen Boda 陳伯達 criticize Peng''s errors; Zhou and Deng say his line is opposed to Mao Zedong Thought; the decisions: a notice thoroughly criticizing the Group''s outline and revoking it, and a document-drafting group, to be reported to Mao and the Standing Committee, later the Cultural Revolution Group; the group''s members not given); [[w.peng-zhen-nianpu-1902]], IV, 480 (Apr. 9, 11 and 12, 1966; Peng Zhen at the Secretariat, Zhou Enlai, Chen Boda and Wu Lengxi there; Kang Sheng relays Mao''s criticism of Peng and the outline in his three talks at the end of March; Kang, Chen Boda and others criticize Peng''s "grave errors," and Peng is made to examine himself; decided: a Center notice withdrawing the outline, drafted by Chen Boda; a drafting group under Chen Boda for documents on the cultural revolution, for Mao and the Standing Committee); [[w.jian-zhou-enlai]], 539 (from Apr. 9 the Secretariat, Deng in the chair, meets three days, Zhou attending though no member; Kang Sheng conveys Mao''s harsh criticism of Peng and the February Outlines, "in mid-April," so Chen, and Peng comes under fierce attack); [[w.dikotter-cultural-revolution]], 49 n.17 (Kang Sheng conveys Mao''s message to Zhou, who sides with the Chairman; Zhou and Deng accuse Peng of "contravening Mao Zedong Thought" and "opposing Chairman Mao"); [[w.pu-weihua-zalan-jiu-shijie]], 68–69 (Apr. 9 to 12, Peking: Kang Sheng conveys Mao''s talks of late March; Peng Zhen says he never has opposed, does not and will not oppose Chairman Mao; Kang goes through Peng''s conduct in the academic criticism, Chen Boda his line from the democratic revolution on; Zhou Enlai and Deng Xiaoping: Peng''s wrong line opposed to Mao''s thought, against Mao; decided, a Party notice withdrawing and criticizing the Outline, and a drafting group for the cultural revolution''s documents); [[w.pu-weihua-zalan-jiu-shijie]], 77 (by Kang Sheng''s account: the sessions of Apr. 9, 11 and 12; Peng Zhen asks to speak first, he never opposed the Chairman, shielded Deng Tuo, not Wu Han, his error "letting go"; then Kang against him, from September 1965 to March 1966; then Chen Boda on his past). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 12 (cited by [[w.macfarquhar-maos-last-revolution]], 33 n.5); [[w.jin-1949-1989-niande-zhongguo]], 623–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 458 n.154); Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and Peng Zhen 彭真, report to Mao Zedong 毛泽东 on the current academic criticism and other questions 《关于当前学术批判等问题给毛泽东的报告》, Apr. 12, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.34); *Yijiuliuwu nian jiuyue dao yijiuliuliu nian wuyue wenhua zhanxian shang liang tiao daolu douzheng dashiji* 《一九六五年九月到一九六六年五月文化战线上两条道路斗争大事记》 (annex to the Circular of May 16, 1966 「五一六通知」) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 125 n.44). Names: Deng Xiaoping, Zhou Enlai, Kang Sheng, Peng Zhen, Chen Boda, Jiang Qing, Liu Zhijian, Yin Da, Zhang Chunqiao, Chen Yading, Guan Feng, Qi Benyu, Wu Lengxi, Wang Li, Mu Xin, Yang Yongzhi.'
