    c: 'Gallup, Mar. 3–8: a candidate for Congress who says we should try harder for a compromise peace in Vietnam: more inclined to vote for him 67 percent, less 15. Republicans 65 more inclined; Democrats 69; independents 65.'
    n: '[[w.gallup-poll]], III, 1998.'
