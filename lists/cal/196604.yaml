    time: 1966-04-05T00:10Z
    place: washington
    thread: vietnam-struggle
    c: 'Johnson with Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy and Fortas, 7:10 to 8:35 p.m. Westmoreland sees "prospect of success in Danang"; Johnson, McNamara and Rusk do not. Johnson: "appeasement never wins";{1} "rather have someone we can control"; "Ky is gone, the last gasp";{2} "We need a Garcia-Godoy type—with an advisor by his side." McNamara: "We need a Bunker in Vietnam."{3}'
    n: '[FRUS 1964–68, IV, doc. 112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 279–81; [[w.dallek-flawed-giant]], 360 (the meeting two days later: Johnson "rather have someone we can control... than a communist takeover"; Taylor against "a Tri Quang government"; "Ky is gone, the last gasp. ... Let''s get a government we can appoint and support"; not the hours or who was present); [[w.valenti-very-human-president]], 248 (Valenti''s memorandum of 10:20 p.m. after "tonight''s meeting on Vietnam"; no hour or names). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-04-04.vietnam-struggle]]. Names: Johnson, Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy, Fortas, Westmoreland, Nguyễn Cao Kỳ.'
