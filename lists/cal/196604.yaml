    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 27 (Apr. 12, 1966); [[w.macfarquhar-maos-last-revolution]], 27 (the letter to Mao); [[w.deng-xiaoping-nianpu-1904]], III, 1908 (Apr. 12, 1966; Deng drafts the report he, Zhou Enlai and Peng Zhen send to Mao, then at Hangzhou, sending the ''Report on Comrade Luo Ruiqing''s errors'' and a draft of the Central Committee''s comment, and reporting the Secretariat''s decision on the ''February Outline''; with a letter: to report in person the three of them propose to go to the Chairman, with Jianying and Jinghua (Xiao Hua) for Luo''s problem, Boda and Kang Sheng for the academic criticism; they hope to go on the 15th, Lê Duẩn leaving Peking that day; after both are discussed Deng, Li Fuchun, Qiuli, Yibo and Gu Mu are to report on the Northwest trip, chiefly the Five-Year Plan; Mao replies on the 14th, asking Kang Sheng, Boda and other drafting-group members to go to Shanghai that day or the next to settle the document with the Shanghai comrades, then come to him the night of the 16th or morning of the 17th, the three of them to come on the 16th; he has some changes); [[w.mao-zedong-zhuan]], VI, ch. 74 n.34 (Zhou Enlai, Deng Xiaoping and Peng Zhen''s report to Mao of Apr. 12 on the current academic criticism and other questions, n.34). [[w.peng-zhen-nianpu-1902]], IV, 480 (Apr. 12, 1966; Peng Zhen joins Zhou and Deng (Deng writing) in reporting to Mao at Hangzhou the meeting, with Chen Boda''s draft notice withdrawing the outline and the report on Luo Ruiqing: Peng and the leaders there "have all made a first examination of this great error," "all agree with the Chairman''s criticism and instructions"; hearings asked on Luo, the third front and the Five-Year Plan); [[w.jian-zhou-enlai]], 539 (Zhou, with Deng and Peng Zhen, writes Mao reporting the decision to brand Luo as having "opposed Mao and Mao Thought," "forced Lin to step down," "managing his own independent kingdom"; Peng signs, though already "a Luo accomplice" to Mao); [[w.pu-weihua-zalan-jiu-shijie]], 38 (the letter quoted on Luo Ruiqing: the group meetings ended Apr. 8; the work group''s draft report put to those present, not voted; the report and a draft comment of the Center sent for Mao''s review, to be settled after Mao, the Standing Committee and Lin Biao read it). Made public: 2006. Check: MacFarquhar (27) has the letter tell Mao the struggle against Luo Ruiqing is concluded and a report on his errors drafted. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 74), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhongyang gongzuo xiaozu guanyu Luo Ruiqing cuowu wentide baogao, Apr. 30, 1966, translated in Chinese Law and Government, 4, nos. 3–4 (Fall–Winter 1971–72), 287–314 (cited by [[w.macfarquhar-maos-last-revolution]], 27 n.59); Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and Peng Zhen 彭真, report to Mao Zedong 毛泽东 on the current academic criticism and other questions 《关于当前学术批判等问题给毛泽东的报告》, Apr. 12, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.34); [[w.zhou-enlai-nianpu-1949]], III, 27 (cited by [[w.jian-zhou-enlai]], 539 n.80). See [[cal.1966-04-09.china-leadership]]. Names: Zhou Enlai, Deng Xiaoping, Peng Zhen, Mao Zedong, Li Fuchun, Yu Qiuli, Bo Yibo, Gu Mu.'
