    tags: [name:thich-tri-quang, name:nguyen-cao-ky, name:lodge-henry-cabot]
  - id: cal.1966-04-05.vietnam-struggle-3
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam-struggle
    c: 'William Bundy to Rusk: "the worst possible outcomes have been avoided, but ... Ky essentially capitulated" to the Buddhists and General Chuẩn; "we may save Thieu, but Ky looks pretty far gone." A reshuffled Directorate, Chiểu moving up, "would not be too bad."'
    n: '[FRUS 1964–68, IV, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v04/d113) (the covering note). [[w.gibbons-u-s-government-and]], IV, 282. Made public: FRUS 1964–68, IV (1998). Names: William Bundy, Rusk, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu.'
    src:
      c: a6b48d54
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d113: A'
        - 'w.gibbons-u-s-government-and IV, 282: all'
        - 'via w.gibbons-u-s-government-and IV, 282 n.47: all'
    tags: [name:bundy-william, name:rusk-dean, name:nguyen-cao-ky, name:nguyen-van-thieu]
  - id: cal.1966-04-05.vietnam
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam
    c: 'Rostow to Johnson: if the Vietnamese work out a civil constitution-drafting group, "Then will be the time to pour it on." Heavier attrition, the supply routes, oil and "precision target systems"; "It is not, Mr. President, that I''m bloody-minded or a hawk." Get the urban leaders "into a hall and around tables."'
    n: '[FRUS 1964–68, IV, doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v04/d115). [[w.gibbons-u-s-government-and]], IV, 282. Made public: FRUS 1964–68, IV (1998). Names: Rostow, Johnson.'
    src:
      c: c99e2d68
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d115: all'
        - 'w.gibbons-u-s-government-and IV, 282: all'
        - 'via w.gibbons-u-s-government-and IV, 282 n.48: all'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-04-05.vietnam-2
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam
    c: 'McNaughton''s "Possible ''Fall Back'' Plan": change the aim to forcing a compromise between Saigon and the Viet Cong; "we are on a losing wicket"; a private presidential decision to use the troubles in I Corps "as the vehicle for disengagement," in secrecy; an ultimatum, shape up or we ship out; re-educate opinion that the United States has "more than delivered the goods in blood and treasure."'
    n: '[[w.gibbons-u-s-government-and]], IV, 292–93. To check: McNaughton, "Possible ''Fall Back'' Plan," Apr. 5, 1966, Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 292 n.69). Check: the summary''s date (Gibbons: drafted Apr. 5, filed with the B-P draft of Apr. 15). Names: McNaughton.'
    src:
      c: dcae6693
      rows:
        - 'w.gibbons-u-s-government-and IV, 292–93: all'
        - 'via w.gibbons-u-s-government-and IV, 292 n.69b: all'
    tags: [name:mcnaughton-john-t]
