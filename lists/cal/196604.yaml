    c: 'JCS 1710-66: Westmoreland''s request of March, supported by the Joint Chiefs, to move American forces into a limited area of Cambodia to trap North Vietnamese troops, refused for "political sensitivity."'
    n: '[[w.gibbons-u-s-government-and]], IV, 359 n.18. See [[cal.1965-12-11.vietnam]]. Names: Westmoreland.'
