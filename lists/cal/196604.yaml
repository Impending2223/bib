    thread: china-liu
    also: [south-asia, china-foreign]
    c: Liu Shaoqi and his wife visit Dacca, Chen Yi and his wife with them, Apr. 15 to 17.{1} At the reception of the governor of East Pakistan, Abdul Monem Khan, Liu says the Chinese people firmly backed Pakistan's just struggle in the past and will go on backing its resistance if an aggressor attacks again. Beyond unity against aggression neither side has any special demand of the other; that is the base of the friendship and the surety of its growth.{2}
