    when: Apr. 4
    date: '1966-04-04'
    time: 1966-04-04T13:30Z
    thread: vietnam-struggle
    c: 'Valenti to Johnson, 8:30 a.m., on the Kỳ government: to preserve Kỳ without American force, name a date for national elections, say June 1; bring four or five Buddhist and Catholic leaders into the directorate; show Viet Cong agents as provocateurs behind the demonstrations; split the Buddhist leadership against Trí Quang; force by Kỳ not likely to work; restoring Thi "as a final, totally last resort." If Kỳ falls, wait and see what a new government brings.'
    n: '[[w.valenti-very-human-president]], 244–47 (Valenti''s account; the memorandum printed). See [[cal.1966-04-04.vietnam-struggle-3]]. Names: Valenti, Johnson, Nguyễn Cao Kỳ, Thích Trí Quang, Nguyễn Chánh Thi.'
    tags: [name:valenti-jack, name:johnson-lyndon-b, name:nguyen-cao-ky, name:thich-tri-quang, name:nguyen-chanh-thi]
  - id: cal.1966-04-04.vietnam-struggle-8
    when: Apr. 4
    date: '1966-04-04'
    time: 1966-04-05T03:20Z
    thread: vietnam-struggle
    c: 'Valenti to Johnson, 10:20 p.m., after "tonight''s meeting on Vietnam": "take the starch out of the demonstrations" by bringing Thi into the directorate again beside Thiệu, a Buddhist and a Catholic; "We have to sacrifice Ky," placated in the larger interests of a free Vietnam; take the initiative.'
    n: '[[w.valenti-very-human-president]], 248–49 (Valenti''s account; the memorandum printed). See [[cal.1966-04-04.vietnam-struggle-3]]. Names: Valenti, Johnson, Nguyễn Chánh Thi, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
    tags: [name:valenti-jack, name:johnson-lyndon-b, name:nguyen-chanh-thi, name:nguyen-van-thieu, name:nguyen-cao-ky]
