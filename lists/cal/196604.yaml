  - id: cal.1966-04-02.china-leadership
    when: Apr. 2
    date: '1966-04-02'
    place: handan
    thread: china-may-sixteenth
    also: [china-hai-rui, china-zhou-cr]
    c: 'Zhou Enlai to Mao and the Secretariat: Kang Sheng, back Mar. 31, brought Mao''s instructions;{1} with Peng Zhen and Kang he proposes a Secretariat meeting to raise the banner of proletarian cultural revolution and criticize reactionary academic thought in literature, history and philosophy, a Center notice to follow for Mao to see.{2} The Five-Man Group''s report sent Mao is wrong;{3} the group, enlarged with Shanghai and Peking people, to rewrite or discard it.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 2, 1966. [[w.macfarquhar-maos-last-revolution]], 32 (Kang Sheng''s report of Mar. 31; Zhou telephones Mao); [[w.yang-jisheng-tiandi-fanfu]], I, 124 (Zhou Enlai 周恩來 writes Mao from Handan 邯鄲 that he entirely agrees with Mao''s instructions, that the Group''s outline is wrong, and that he will call a Secretariat meeting to discuss them); [[w.peng-zhen-nianpu-1902]], IV, 478 (Apr. 2, 1966, evening; Zhou''s letter to Mao and the Secretariat: agreed with Peng Zhen and Kang Sheng, a Secretariat meeting to raise high the banner of the proletarian cultural revolution, criticize reactionary thought in literature, history and philosophy and expose those authorities'' bourgeois stand, a Center notice to be drafted for Mao; the Five-Man Group''s report wrong, an enlarged meeting of the group with Shanghai and Peking comrades to revise it thoroughly or rewrite it); [[w.jian-zhou-enlai]], 537 (on the evening of Apr. 2, two days on, Zhou busy with the Xingtai earthquake: "by consulting with Peng Zhen and Kang Sheng" he will "follow the chairman''s instructions and hold high the banner of proletarian cultural revolution"; "a question concerning the seizure of the leadership position in the cultural sphere"; the Group of Five''s report "is wrong," to be replaced by another Center notice for Mao''s approval); [[w.pu-weihua-zalan-jiu-shijie]], 68 (from Handan: he means to give himself to drought and relief in Hebei, back in Peking every ten days, Peng Zhen to call him back if need be; "fully agree with Chairman Mao''s instructions"; the Five-Man Group''s Outline wrong; a Secretariat meeting to discuss the instructions). Made public: 2006. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 10–11 (cited by [[w.macfarquhar-maos-last-revolution]], 32 n.3). Names: Zhou Enlai, Mao Zedong, Kang Sheng, Peng Zhen.'
    src:
