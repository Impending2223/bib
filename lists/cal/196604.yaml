  - id: cal.1966-04-05.vietnam-struggle-2
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam-struggle
    c: 'Night. The Buddhist leaders, Trí Quang excepted, with Kỳ at his house: a constitutional assembly within six months, Kỳ to stay through the transition; by Lodge''s report, "they have no confidence in anyone else."'
    n: '[[w.gibbons-u-s-government-and]], IV, 282. To check: Saigon to Washington 3761, Apr. 6, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 282 n.46). See [[cal.1966-04-05.vietnam-struggle]]. Names: Thích Trí Quang, Nguyễn Cao Kỳ, Lodge.'
