    tags: [name:mcnamara-robert-s]
  - id: cal.1966-04-04.vietnam-struggle-2
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'Lodge with Kỳ, 1 p.m., 3698: the Directorate''s resolutions of Apr. 3, a political convention and force at Đà Nẵng, the city declared held by the Communists; a National Political Congress to be formed. Kỳ asks American aircraft to lift the troops; Lodge approves.'
    n: '[FRUS 1964–68, IV, doc. 110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110). [[w.gibbons-u-s-government-and]], IV, 279. Made public: FRUS 1964–68, IV (1998). Names: Lodge, Nguyễn Cao Kỳ.'
