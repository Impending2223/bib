  - id: cal.1966-04-04.europe-and-the-alliance-france
    when: Apr. 4
    date: '1966-04-04'
    thread: europe-and-the-alliance-france
    c: 'State, 6 p.m.: Rusk, McNamara, Ball and Acheson on France and NATO. The reply to the French aide-mémoire of Mar. 29 approved: American facilities out of France as promptly as possible. The North Atlantic Council to leave Paris, NATO''s military headquarters with it. If Bonn insists that French troops stay only under the present arrangements, the United States to back it fully; if Bonn negotiates, to urge safeguards and transit and overflight rights in France for the allies.'
    n: '[FRUS 1964–68, XIII, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v13/d151). [[w.schwartz-lyndon-johnson-and-europe]], 107 (and McCloy''s instructions). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Rusk, McNamara, Ball, Acheson.'
    src:
      c: 688d6f17
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d151: all'
        - 'w.schwartz-lyndon-johnson-and-europe 107: A, D-E'
        - 'via w.schwartz-lyndon-johnson-and-europe 107 n.65: A, D-E'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:acheson-dean-g]
  - id: cal.1966-04-04.vietnam-force-levels
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-force-levels
    c: 'JCSM-218-66: the Joint Chiefs propose the added forces be deployed by July 1967 rather than the end of 1966. McNamara accepts.'
    n: '[[w.gibbons-u-s-government-and]], IV, 182. To check: JCSM-218-66, Apr. 4, 1966, so cited, without its file (cited by [[w.gibbons-u-s-government-and]], IV, 182 n.32). Check: the day McNamara accepted. See [[cal.1966-02-10.vietnam-force-levels]]. Names: McNamara.'
