      rows:
        - 'w.gibbons-u-s-government-and IV, 281: all'
        - 'via w.gibbons-u-s-government-and IV, 281 n.45: all'
    tags: [name:lodge-henry-cabot, name:thich-tri-quang, name:nguyen-chanh-thi, name:nguyen-cao-ky]
  - id: cal.1966-04-04.vietnam-struggle-5
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'Lodge, 3699, on the cables of Apr. 2: Trí Quang''s acts "totally consistent with Communist aims"; the movement in power "could lead Vietnam into unknown waters, not excluding French-backed neutralism and Hanoi take-over." If Kỳ goes, Phan Xuân Chiểu of the Directorate; or Minh or Đôn.'
    n: '[[w.gibbons-u-s-government-and]], IV, 279. Reply to: [[cal.1966-04-02.vietnam-struggle-2]]. To check: Saigon to Washington 3699, Apr. 4, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 279 n.41). Names: Lodge, Thích Trí Quang, Nguyễn Cao Kỳ, Dương Văn Minh, Trần Văn Đôn.'
