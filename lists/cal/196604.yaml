entries:
  - id: cal.1966-04-01.opinion
    when: Apr. 1
    date: '1966-04-01'
    thread: opinion
    also: [vietnam, elections-1966]
    c: 'Gallup, Mar. 3–8: a candidate for Congress who says we should try harder for a compromise peace in Vietnam: more inclined to vote for him 67 percent, less 15. Republicans 65 more inclined; Democrats 69; independents 65.'
    n: '[[w.gallup-poll]], III, 1998.'
  - id: cal.1966-04-02.vietnam
    when: Apr. 2
    date: '1966-04-02'
    thread: vietnam-struggle
    c: 'At the White House, on the Struggle Movement: keep Kỳ if possible, a fallback ready; Lodge to press Trí Quang.'
    n: 'FRUS 1964–68, IV, docs. [108](https://history.state.gov/historicaldocuments/frus1964-68v04/d108), [109](https://history.state.gov/historicaldocuments/frus1964-68v04/d109). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 276–79. See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ, Thích Trí Quang, Lodge.'
    tags: [name:nguyen-cao-ky, name:thich-tri-quang, name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1966-04-03.opinion
    when: Apr. 3
    date: '1966-04-03'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 3–8: overall feelings about Vietnam: a necessary evil 43 percent; the United States should get out 15; be more aggressive 12; fear of war 11; a wish for a quick end 10; too many lives lost 5.'
    n: '[[w.gallup-poll]], III, 1998–99.'
  - id: cal.1966-04-04.vietnam-struggle
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'Washington to Saigon: no American forces in Đà Nẵng or Huế or against dissident troops.'
    n: 'FRUS 1964–68, IV, docs. [110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110), [112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 279–81. See [[cal.1966-03-10.vietnam]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-04.europe-and-the-alliance-france
    when: Apr. 4
    date: '1966-04-04'
    thread: europe-and-the-alliance-france
    c: 'State, 6 p.m.: Rusk, McNamara, Ball and Acheson on France and NATO. The reply to the French aide-mémoire of Mar. 29 approved: American facilities out of France as promptly as possible. The North Atlantic Council to leave Paris, NATO''s military headquarters with it. If Bonn insists that French troops stay only under the present arrangements, the United States to back it fully; if Bonn negotiates, to urge safeguards and transit and overflight rights in France for the allies.'
    n: '[FRUS 1964–68, XIII, doc. 151](https://history.state.gov/historicaldocuments/frus1964-68v13/d151). [[w.schwartz-lyndon-johnson-and-europe]], 107 (and McCloy''s instructions). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Rusk, McNamara, Ball, Acheson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:acheson-dean-g]
  - id: cal.1966-04-05.vietnam-struggle
    when: Apr. 5
    date: '1966-04-05'
    thread: vietnam-struggle
    c: Three battalions of Vietnamese marines flown to the Đà Nẵng air base. Kỳ, who had called the city held by Communists (Check the day), satisfied it is not, back to Saigon.
    n: '[FRUS 1964–68, IV, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v04/d113). [[w.gibbons-u-s-government-and]], IV, 281–82 (the airlift; Kỳ to Đà Nẵng and back). Gibbons gives two battalions of marines on Apr. 5 (IV, 281) and two more, flown by the Vietnamese air force, the night of Apr. 8 (IV, 286); William Bundy''s memorandum of Apr. 5, three on the air base (doc. 113). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Cao Kỳ.'
    tags: [name:nguyen-cao-ky, place:da-nang-air-base, place:da-nang]
  - id: cal.1966-04-06.civil-rights-the-executive
    when: Apr. 6
    date: '1966-04-06'
    thread: civil-rights-the-executive
    c: 'Reorganization Plan 1 of 1966, the Community Relations Service to Justice: the Senate refuses to disapprove it, [32–42](https://voteview.com/rollcall/RS0890288).'
    n: 'Check: the Record''s page. See [[cal.1966-02-10.civil-rights-the-executive]].'
  - id: cal.1966-04-06.opinion
    when: Apr. 6
    date: '1966-04-06'
    thread: opinion
    also: [court]
    c: 'Gallup, Jan. 21–26: Supreme Court Justices and other federal judges chosen by the President from a list of candidates the American Bar Association approves: a good idea 61 percent, a poor idea 22.'
    n: '[[w.gallup-poll]], III, 1999.'
  - id: cal.1966-04-06.jobs-and-wages-farm-workers
    when: Apr. 6
    date: '1966-04-06'
    thread: jobs-and-wages-farm-workers
    c: Schenley agrees to recognize Chavez's union (Check).
    n: 'Check: the day. See [[cal.1966-03-16.jobs-and-wages-ca]]. Names: Chavez.'
    tags: [state:ca, name:chavez-cesar]
  - id: cal.1966-04-06.vietnam-struggle
    when: Apr. 6
    date: '1966-04-06'
    thread: vietnam-struggle
    c: The Saigon government accepts a constitutional convention within six months.
    n: '[FRUS 1964–68, IV, doc. 116](https://history.state.gov/historicaldocuments/frus1964-68v04/d116). [[w.gibbons-u-s-government-and]], IV, 283. See [[cal.1966-03-10.vietnam]].'
  - id: cal.1966-04-06.vietnam
    when: Apr. 6
    date: '1966-04-06'
    thread: vietnam
    also: [vietnam-struggle]
    c: 'Johnson with Humphrey, Rusk, McNamara, Rostow, William Bundy and others, fifty minutes, on Đà Nẵng. McNamara: the Struggle Movement may be too strong to throw off; "I don''t want to go to war against them." Rusk''s cable to Lodge that evening: Saigon right to seek an over-all political solution first; no American push for a showdown at Đà Nẵng.'
    n: 'FRUS 1964–68, IV, doc. [116](https://history.state.gov/historicaldocuments/frus1964-68v04/d116) (the cable). [[w.gibbons-u-s-government-and]], IV, 283–84 (the meeting, by Valenti''s notes). To check: Valenti''s notes of the meeting, Apr. 6, 1966 (LBJ Library, Meeting Notes File). See [[cal.1966-03-10.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Rostow, William Bundy, Lodge.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:bundy-william, name:lodge-henry-cabot]
  - id: cal.1966-04-08.medicare
    when: Apr. 8
    date: '1966-04-08'
    thread: medicare
    c: At San Antonio, Johnson signs the bill extending enrollment in Medicare's insurance for doctors' bills from Mar. 31 to May 31, [80 Stat. 99](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg99.pdf). Almost 17 million enrolled, he says; some 1.3 million over 65 not yet.
    n: 'Letter to the President of the Senate and to the Speaker of the House Requesting Extension of the Medicare Enrollment Deadline, [1966 Pub. Papers 394](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=470) (Mar. 31, 1966); Remarks in San Antonio at the Signing of the Medicare Extension Bill, [1966 Pub. Papers 404](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=480) (Apr. 8, 1966). To check: [[w.smith-health-care-divided]]; [[w.blumenthal-heart-of-power]]. See [[cal.1965-07-30.medicare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-09.africa
    when: Apr. 9
    date: '1966-04-09'
    thread: africa-rhodesia
    also: [europe-and-the-alliance]
    c: Rhodesia. The tanker *Joanna V* at Beira with oil for the pipeline to Rhodesia. Security Council, Resolution 221, 10–0, Bulgaria, France, Mali, the Soviet Union and Uruguay abstaining; the United States for. Portugal not to let oil through to Rhodesia; Britain authorized to stop, by force if need be, ships believed to carry oil for Rhodesia to Beira.
    n: '[S.C. Res. 221](https://undocs.org/S/RES/221(1966)) (Apr. 9, 1966). To check: [[w.deroche-black-white-and-chrome]]; [[w.watts-rhodesias-unilateral-declaration-of]]. See [[cal.1965-11-11.europe-and-the-alliance]].'
  - id: cal.1966-04-10.opinion
    when: Apr. 10
    date: '1966-04-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Mar. 24–29: Republicans'' best candidate for 1968: Nixon 27, Romney 14, Goldwater 13, Lodge 12, Dirksen 7, Scranton 6, Rockefeller 5, Reagan 4, Lindsay 2, Hatfield 1. Independents: Nixon 22, Lodge 14, Romney 14, Goldwater 10. Of five, Hatfield, Lindsay, Reagan, Romney and Scranton: Republicans, Romney 34, Scranton 17, Reagan 11, Lindsay 11, Hatfield 7; independents, Romney 28, Scranton 22, Lindsay 14, Reagan 7, Hatfield 3.'
    n: '[[w.gallup-poll]], III, 1999–2000. Names: Nixon, Romney, Scranton, Rockefeller, Goldwater, Hatfield, Lodge, Dirksen, Reagan, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:goldwater-barry-m, name:lodge-henry-cabot, name:dirksen-everett, name:scranton-william-w, name:rockefeller-nelson, name:reagan-ronald, name:lindsay-john-v, name:hatfield-mark-o]
  - id: cal.1966-04-10.jobs-and-wages-farm-workers
    when: Apr. 10
    date: '1966-04-10'
    thread: jobs-and-wages-farm-workers
    c: Easter. Chavez's march at the Capitol in Sacramento.
    n: '[*New York Times*, Apr. 11, 1966](https://timesmachine.nytimes.com/timesmachine/1966/04/11/issue.html). See [[cal.1966-03-16.jobs-and-wages-ca]]. Names: Chavez.'
    tags: [state:ca, name:chavez-cesar]
  - id: cal.1966-04-12.europe-and-the-alliance
    when: Apr. 12
    date: '1966-04-12'
    thread: europe-and-the-alliance-france
    c: 'The American aide-mémoire to France, shown to the other fourteen Apr. 7: France acts alone without asking the review Article 12 allows; with French forces in Germany out of Allied Command Europe July 1, the 1960 agreement on atomic weapons for their use lapses.'
    n: '[FRUS 1964–68, XIII, doc. 154](https://history.state.gov/historicaldocuments/frus1964-68v13/d154). [[w.current-documents-1966]], 328–330; [[w.drea-mcnamara-clifford-and-the-2011]], 377 (the American reply of Apr. 12). See [[cal.1966-03-07.europe-and-the-alliance]].'
    src:
      c: 28ef2cc8
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v13/d154: all'
        - 'w.current-documents-1966 328–330: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 377: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 377 n.9a: A'
  - id: cal.1966-04-12.vietnam
    when: Apr. 12
    date: '1966-04-12'
    thread: vietnam
    c: 'B-52s bomb North Vietnam for the first time: Route 15 on the North Vietnamese side of the Mụ Giạ Pass, the road into Laos. Thirty take off from Andersen, Guam; one turns back; twenty-nine bomb.'
    n: '[FRUS 1964–68, IV, doc. 121](https://history.state.gov/historicaldocuments/frus1964-68v04/d121). [[w.staaveren-gradual-failure]], 260; [[w.frankum-like-rolling-thunder]], 47; [[w.staaveren-u-s-air-force]], 136. To check: [[w.clodfelter-limits-of-air-power]]; [[w.thompson-to-hanoi-and-back]]; Hist, SAC, Jan-Jun 66, Vol I, p 126 (cited by [[w.staaveren-gradual-failure]], 260 n.38). See [[cal.1966-03-01.vietnam]]. Check: Frankum gives Apr. 11, and 585 tons of bombs.'
    src:
      c: 943edb04
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d121: all'
        - 'w.staaveren-gradual-failure 260: all'
        - 'w.staaveren-u-s-air-force 136: all'
        - 'w.frankum-like-rolling-thunder 47: all'
        - 'via w.staaveren-gradual-failure 260 n.38: all'
    tags: [place:mu-gia-pass]
  - id: cal.1966-04-12.legislatures-ne
    when: Apr. 12
    date: '1966-04-12'
    thread: legislatures
    c: Nebraska. The federal court sustains L.B. 925, the unicameral's apportionment of 1965, against voters of Douglas, Lancaster, Hall and Scotts Bluff counties.
    n: '*League of Nebraska Municipalities v. Marsh*, [253 F. Supp. 27](https://static.case.law/f-supp/253/case-pdfs/0027-01.pdf) (D. Neb. 1966). See [[cal.1965-05-12.legislatures-ne]].'
    tags: [state:ne]
  - id: cal.1966-04-12.vietnam-struggle
    when: Apr. 12–14
    date: '1966-04-12'
    thread: vietnam-struggle
    c: A National Political Congress at Saigon; Apr. 14, Thiệu decrees elections for a constituent assembly in three to five months.
    n: 'FRUS 1964–68, IV, doc. [122](https://history.state.gov/historicaldocuments/frus1964-68v04/d122) (State''s sitrep, Apr. 14: the decree); doc. [123](https://history.state.gov/historicaldocuments/frus1964-68v04/d123). [[w.gibbons-u-s-government-and]], IV, 294. Gibbons gives "within three to six months" (IV, 294). See [[cal.1966-03-10.vietnam]]. Names: Nguyễn Văn Thiệu.'
    src:
      c: 3c51aaca
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d122: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d123: all'
        - 'w.gibbons-u-s-government-and IV, 294: A'
    tags: [name:nguyen-van-thieu, place:saigon]
  - id: cal.1966-04-13.transportation
    when: Apr. 13
    date: '1966-04-13'
    thread: transportation
    c: 'Uniform Time Act signed, [80 Stat. 107](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg107.pdf): from Apr. 1, 1967, daylight saving time in every zone from the last Sunday in April to the last Sunday in October, unless a State by law keeps standard time throughout; places keeping daylight time in 1966 to use those dates. The Interstate Commerce Commission to enforce it and fix the zones. The House passed it Mar. 16, [292–93](https://voteview.com/rollcall/RH0890223); the conference report Mar. 30, [282–91](https://voteview.com/rollcall/RH0890229).'
    n: 'To check: [[w.downing-spring-forward]]; [[w.prerau-seize-the-daylight]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-13.middle-east
    when: Apr. 13
    date: '1966-04-13'
    thread: middle-east
    c: Iraq. Abdul Salam Arif killed in an air crash.
    n: '[*New York Times*, Apr. 14, 1966](https://timesmachine.nytimes.com/timesmachine/1966/04/14/issue.html). See [[cal.1963-11-18.middle-east]]. Names: Arif.'
    tags: [name:arif-abdul-salam-muhammad]
  - id: cal.1966-04-15.opinion
    when: Apr. 15
    date: '1966-04-15'
    thread: opinion
    also: [economy]
    c: 'Gallup, Feb. 10–15: one''s own federal income tax: too high 52 percent, about right 39, too low under 1.'
    n: '[[w.gallup-poll]], III, 2000.'
  - id: cal.1966-04-16.middle-east
    when: Apr. 16
    date: '1966-04-16'
    thread: middle-east
    c: Iraq. Abdul Rahman Aref, brother of Abdul Salam Arif, President. Johnson's congratulations.
    n: '[FRUS 1964–68, XXI, doc. 180](https://history.state.gov/historicaldocuments/frus1964-68v21/d180). Check: the message. See [[cal.1966-04-13.middle-east]]. Names: Aref, Arif, Johnson.'
    tags: [name:aref-abdul-rahman-muhammad, name:arif-abdul-salam-muhammad, name:johnson-lyndon-b]
  - id: cal.1966-04-17.opinion
    when: Apr. 17
    date: '1966-04-17'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 24–29, a peace plan: the UN to hold elections in North and South Vietnam on their governments and on unification; the United States to withdraw its soldiers from the mainland, the North Vietnamese theirs from the South; American ships and planes to stay offshore, ready to bomb the North. Favor 62 percent, oppose 18. Republicans 64, Democrats 63, independents 62. Grade school 52 favor, 38 no opinion.'
    n: '[[w.gallup-poll]], III, 2001.'
  - id: cal.1966-04-17.europe-and-the-alliance-france
    when: Apr. 17
    date: '1966-04-17'
    thread: europe-and-the-alliance-france
    c: 'Bonn. McCloy with Erhard, Schröder, von Hassel, Westrick and Carstens, an hour and a half, on the French troops in Germany. Erhard: a firm position toward de Gaulle, "if need be, hard"; the moment like Munich, 1938. McCloy: the President and Rusk will support any position the Federal Republic takes. Johnson had changed McCloy''s instructions, softer than State''s, on Bator''s telegram to the Ranch of Apr. 11.'
    n: '[FRUS 1964–68, XIII, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v13/d156). [[w.schwartz-lyndon-johnson-and-europe]], 107–08 (the instructions changed, by Bator''s papers). See [[cal.1966-04-04.europe-and-the-alliance-france]]. Names: McCloy, Erhard, Schröder, von Hassel, Westrick, Carstens, de Gaulle, Rusk, Bator, Johnson.'
    tags: [name:mccloy-john-j, name:erhard-ludwig, name:schroder-gerhard, name:von-hassel-kai-uwe, name:westrick-ludger, name:carstens-karl, name:de-gaulle-charles, name:rusk-dean, name:bator-francis-m, name:johnson-lyndon-b]
  - id: cal.1966-04-18.court
    when: Apr. 18
    date: '1966-04-18'
    thread: court
    c: '*Elfbrandt v. Russell*, [384 U.S. 11](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384011/usrep384011.pdf): Arizona''s loyalty oath for public employees, with perjury for knowing membership in the Communist Party, void; membership without the specific intent to further its unlawful aims may not be punished. Douglas for the Court, 5–4; White, Clark, Harlan, Stewart dissent.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1965-11-15.court]].'
  - id: cal.1966-04-18.vietnam-congress
    when: Apr. 18
    date: '1966-04-18'
    thread: vietnam-congress
    c: 'Mansfield in the Senate, on the "inner conflicts" in South Vietnam: a new effort to negotiate, perhaps a conference called by Japan, Burma or another Asian nation, in the region, among the United States, North Vietnam, China and "such elements in South Vietnam as may be essential." State, with the White House''s approval, welcomes it; the Saigon government to be South Vietnam''s sole official representative.'
    n: '[[w.gibbons-u-s-government-and]], IV, 304–05. To check: 112 Cong. Rec. 8223–25 (1966); *New York Times*, Apr. 20, 1966. Names: Mansfield.'
    tags: [name:mansfield-mike]
  - id: cal.1966-04-19.middle-east
    when: Apr. 19–22
    date: '1966-04-19'
    thread: middle-east
    also: [europe-and-the-alliance, cyprus]
    c: 'CENTO''s fourteenth Ministerial Council at Ankara, Apr. 20–21, Rusk for the United States. Apr. 19, Iran''s Foreign Minister to Rusk, at the Shah''s request: the purchase of arms. Apr. 22, Demirel and his Foreign Minister on Cyprus and Turkey''s aide-mémoire; Rusk: the United States shares the concern for the Turkish Cypriots.'
    n: '[FRUS 1964–68, XXI, doc. 12](https://history.state.gov/historicaldocuments/frus1964-68v21/d12) (editorial note: the council); [FRUS 1964–68, XXII, doc. 132](https://history.state.gov/historicaldocuments/frus1964-68v22/d132); [FRUS 1964–68, XVI, doc. 230](https://history.state.gov/historicaldocuments/frus1964-68v16/d230). See [[cal.1965-04-07.middle-east]]. Names: Rusk, Demirel, Pahlavi.'
    tags: [name:rusk-dean, name:demirel-suleyman, name:pahlavi-mohammed-reza]
  - id: cal.1966-04-19.india-and-china-food
    when: Apr. 19
    date: '1966-04-19'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: The joint resolution on food relief for India signed, [80 Stat. 131](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg131.pdf).
    n: Statement by the President Upon Signing Resolution Supporting U.S. Participation in Food Relief for India, [1966 Pub. Papers 425](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=501) (Apr. 19, 1966). See [[cal.1966-03-28.india-and-china]].
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-20.court
    when: Apr. 20
    date: '1966-04-20'
    thread: court
    also: [amendments, legislatures]
    c: 'Dirksen''s apportionment amendment, the second time: S.J. Res. 103, one house of a State legislature to be apportioned on population, geography, and political subdivisions. The Senate, [55–38](https://voteview.com/rollcall/RS0890289), seven short of two-thirds.'
    n: '[112 Cong. Rec., Senate, Apr. 20, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt7/pdf/GPO-CRECB-1966-pt7-2-2.pdf). The amendment (Opp. II.H.2). To check: [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]; [[w.dixon-democratic-representation]]. See [[cal.1965-08-04.court]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1966-04-20.opinion
    when: Apr. 20
    date: '1966-04-20'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Mar. 24–29: Johnson''s handling of Vietnam: approve 54 percent, disapprove 31.'
    n: '[[w.gallup-poll]], III, 2001. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-20.civil-rights-the-executive
    when: Apr. 20
    date: '1966-04-20'
    thread: civil-rights-the-executive
    c: 'Reorganization Plan 1 of 1966: the House refuses to disapprove it, [163–220](https://voteview.com/rollcall/RH0890240). The plan stands.'
    n: 'Check: the Record''s page. See [[cal.1966-02-10.civil-rights-the-executive]].'
  - id: cal.1966-04-21.vietnam
    when: Apr. 21
    date: '1966-04-21'
    thread: vietnam
    c: 'Fulbright at the Johns Hopkins School of Advanced International Studies, the first of three Christian A. Herter lectures: the "arrogance of power," great nations taking power for virtue; the United States showing the signs. The others Apr. 27 and 28 (Check). Published as *The Arrogance of Power*.'
    n: '[Cong. Rec., Senate, Apr. 25, 1966, 8869](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt7/pdf/GPO-CRECB-1966-pt7-4-2.pdf#page=20) (the first lecture). [[w.gibbons-u-s-government-and]], IV, 306–09. To check: [[w.fulbright-arrogance-of-power]]. See [[cal.1966-02-04.vietnam]]. Names: Fulbright.'
    tags: [name:fulbright-j-william]
  - id: cal.1966-04-22.opinion
    when: Apr. 22
    date: '1966-04-22'
    thread: opinion
    also: [china]
    c: 'Gallup, Mar. 24–29: Communist China admitted to the UN: should 25 percent, should not 55. If the UN votes to admit it, the United States to go along: should 49, should not 31. Admission if it would improve relations with the United States: yes 56, no 28.'
    n: '[[w.gallup-poll]], III, 2001–02.'
  - id: cal.1966-04-22.europe-and-the-alliance-france
    when: Apr. 22
    date: '1966-04-22'
    thread: europe-and-the-alliance-france
    c: 'Couve de Murville''s reply to Bohlen: the dates stand.'
    n: '[FRUS 1964–68, XIII, doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v13/d158). [[w.current-documents-1966]], 336 (Check). See [[cal.1966-03-07.europe-and-the-alliance]]. Names: Couve de Murville, Bohlen.'
    tags: [name:couve-de-murville-maurice, name:bohlen-charles-e]
  - id: cal.1966-04-22.europe-and-the-alliance
    when: Apr. 22
    date: '1966-04-22'
    thread: europe-and-the-alliance
    c: 'NSAM 345: recommendations for a larger part for the major allies in nuclear planning, a permanent body of restricted membership within NATO among the possibilities.'
    n: '[FRUS 1964–68, XIII, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v13/d159). See [[cal.1965-11-27.europe-and-the-alliance]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-24.vietnam
    when: Apr. 24
    date: '1966-04-24'
    thread: vietnam
    c: 'Rusk to Johnson, with the report of Ball''s working group on the basic choices: A, go on as now; B, go on, perhaps sending American troops more slowly and encouraging Saigon''s contacts with the Viet Cong; C, cut losses, on the premise of a collapse in Saigon. Rusk and McNamara against C; Rusk for A, and for probing the Viet Cong for divisions.'
    n: 'FRUS 1964–68, IV, doc. [126](https://history.state.gov/historicaldocuments/frus1964-68v04/d126). Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 289–300 (the working group''s papers and report). Gibbons dates the report and Rusk''s cover memorandum Apr. 25 (IV, 298); FRUS prints the memorandum dated Apr. 24, its attachment Apr. 25. To check: [[w.dileo-george-ball-vietnam-and]]; [[w.bill-george-ball]]; [[w.barrett-uncertain-warriors]]. See [[cal.1966-04-02.vietnam]]. Names: Rusk, McNamara, Ball, Johnson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1966-04-25.legislatures-hi
    when: Apr. 25
    date: '1966-04-25'
    thread: legislatures
    also: [court]
    c: '*Burns v. Richardson*, [384 U.S. 73](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384073/usrep384073.pdf): Hawaii''s interim apportionment, the Senate by registered voters, 19 of 25 senators to Oahu, with the House as it is, to stand for the 1966 elections. Multi-member districts not void unless shown to cancel out the votes of racial or political groups; registered voters a permissible measure here, where they approximate citizen population. Brennan for the Court; Harlan and Stewart concur.'
    n: 'To check: [[w.dixon-democratic-representation]]; [[w.coffman-island-edge-of-america]]. See [[cal.1964-06-15.court]]. Names: Burns.'
    tags: [state:hi, name:burns-john-a]
  - id: cal.1966-04-25.vietnam
    when: Apr. 25
    date: '1966-04-25'
    thread: vietnam
    c: 'Johnson with Humphrey, Rusk, McNamara, Ball, William Bundy, Rostow, Raborn, Helms, Komer and Moyers, eighteen minutes, on the working group''s report. By Rostow''s record: "We shall stay on course and explore with Lodge a cautious Track B."'
    n: '[[w.gibbons-u-s-government-and]], IV, 298, 300. To check: Rostow, Memorandum for the Record, Apr. 25, 1966 (LBJ Library, NSF Country File, Vietnam). See [[cal.1966-04-24.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Ball, William Bundy, Rostow, Raborn, Helms, Komer, Moyers, Lodge.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:bundy-william, name:rostow-walt-w, name:raborn-william-f-jr, name:helms-richard, name:komer-robert-w, name:moyers-bill, name:lodge-henry-cabot]
  - id: cal.1966-04-27.civil-rights-the-executive
    when: Apr. 27
    date: '1966-04-27'
    thread: civil-rights-the-executive
    also: [jobs-and-wages]
    c: 'The House passes the Equal Employment Opportunity Act of 1966, H.R. 10065, [300–93](https://voteview.com/rollcall/RH0890243): enforcement power for the Equal Employment Opportunity Commission, cease-and-desist orders, and wider coverage (Check).'
    n: 'To check: [[w.graham-civil-rights-era]]. See [[cal.1965-09-24.civil-rights-the-executive]].'
  - id: cal.1966-04-27.opinion
    when: Apr. 27
    date: '1966-04-27'
    thread: opinion
    also: [elections-1966, vietnam]
    c: 'Gallup, Mar. 24–29, Republicans: the best reasons Republican candidates for Congress can give this fall, by frequency of mention: Vietnam, by about half of those with an opinion; high taxes and prices; the Democratic Administration in general.'
    n: '[[w.gallup-poll]], III, 2002.'
  - id: cal.1966-04-27.women-ny
    when: Apr. 27
    date: '1966-04-27'
    thread: women
    also: [states-and-cities]
    c: 'New York. Rockefeller signs the Divorce Reform Law, the first change in the grounds since adultery alone was made one in 1787: to it are added cruelty, abandonment for two years, imprisonment for three, and two years apart under a decree or agreement of separation; conciliation first. In force Sept. 1, 1967. Check the day.'
    n: 'Check: *Laws of New York*, 1966. To check: [[w.jacob-silent-revolution]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1966-04-27.state-and-city-finance-nj
    when: Apr. 27
    date: '1966-04-27'
    thread: state-and-city-finance
    c: 'New Jersey''s first sales tax. Hughes signs the Sales and Use Tax Act, A. 700: 3 percent on retail sales and on storage and use, in force July 1966. His income tax had failed in the Senate (Check).'
    n: 'L. 1966, c. 30; N.J.S.A. 54:32B-1 ([legislative history](https://hdl.handle.net/10929.1/33180), New Jersey State Library). To check: [[w.salmore-new-jersey-politics-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Hughes.'
    tags: [state:nj, name:hughes-richard-j]
  - id: cal.1966-04-27.cities-and-housing
    when: Apr. 27
    date: '1966-04-27'
    thread: cities-and-housing
    c: Rent supplements. The Senate keeps the $12 million in the second supplemental appropriation, its committee's amendment striking it lost, [45–46](https://voteview.com/rollcall/RS0890293); $20 million refused, [18–69](https://voteview.com/rollcall/RS0890292); the bill passed, [72–12](https://voteview.com/rollcall/RS0890295).
    n: See [[cal.1966-03-29.cities-and-housing]].
  - id: cal.1966-04-28.open-housing
    when: Apr. 28
    date: '1966-04-28'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Message on civil rights. The first federal law against discrimination in the sale and rental of housing, by owners, brokers, and lenders. Federal crimes for violence against those exercising their rights: voting, schooling, housing, work, jury service, travel. Juries in federal and State courts chosen without discrimination. The Attorney General to sue against segregated schools and public facilities without waiting for a complaint. Enforcement power for the Equal Employment Opportunity Commission. 100 more FBI agents.'
    n: 'Special Message to the Congress Proposing Further Legislation To Strengthen Civil Rights, [1966 Pub. Papers 461](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=537) (Apr. 28, 1966). [[w.dallek-flawed-giant]], 325–26. To check: [[w.graham-civil-rights-era]]; [[w.kotz-judgment-days]]; [[w.bonastia-knocking-on-the-door]]; [[w.mackenzie-liberal-hour]]; [[w.zelizer-fierce-urgency-of-now]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-04-29.opinion
    when: Apr. 29
    date: '1966-04-29'
    thread: opinion
    also: [elections-1966, poverty]
    c: 'Gallup, Mar. 24–29, Democrats: the best reasons Democratic candidates for Congress can give this fall, by frequency of mention: the handling of Vietnam; the antipoverty program; the Democrats'' record.'
    n: '[[w.gallup-poll]], III, 2002.'
  - id: cal.1966-04.health-ny
    when: Apr.
    date: 1966-04
    thread: health
    also: [medicare, welfare]
    c: 'New York''s Medicaid law, under Title XIX of the Social Security Amendments of 1965: medical care for those on relief and for the medically indigent, a family of four with a net income up to $6,000. Rockefeller signs. Check the day and the figure.'
    n: 'Check: *Laws of New York*, 1966. To check: [[w.stevens-welfare-medicine-in-america]]; [[w.engel-poor-peoples-medicine]]; [[w.connery-rockefeller-of-new-york]]. See [[cal.1965-07-30.medicare]]. Names: Rockefeller.'
    tags: [state:ny, name:rockefeller-nelson]
  - id: cal.1966-04.jobs-and-wages-oakland
    when: Apr.
    date: 1966-04
    thread: jobs-and-wages
    also: [cities-and-housing]
    c: 'Oakland. Foley''s Economic Development Administration announces some $23 million for the city: public works at the port and the airport, the employers'' hiring of the unemployed, Negroes most of all, the condition. Check the day and the figure.'
    n: 'To check: [[w.pressman-implementation]]; [[w.bradford-oaklands-not-for-burning]]; [[w.self-american-babylon]]. See [[cal.1965-08-26.jobs-and-wages]]. Names: Foley.'
    tags: [state:ca, city:oakland, name:foley-eugene-p]
  - id: cal.1966-04.desegregation-schools-boston
    when: Apr.
    date: 1966-04
    thread: desegregation-schools
    also: [states-and-cities]
    c: Massachusetts. The State Board of Education finds the Boston School Committee's plan of December under the Racial Imbalance Act inadequate and withholds State aid. A revised plan rejected June 28. The Committee sues the Board Sept. 26, against the decision and the Act.
    n: '*School Committee of Boston v. Board of Education*, [352 Mass. 693](https://static.case.law/mass/352/case-pdfs/0693-01.pdf), 696 (1967). [Wikipedia, "Boston desegregation busing crisis"](https://en.wikipedia.org/wiki/Boston_desegregation_busing_crisis). Check the dates. To check: [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]. See [[cal.1965-08-18.desegregation-schools-ma]].'
    tags: [state:ma, city:boston]
