        - 'w.gibbons-u-s-government-and IV, 279: all'
        - 'via w.gibbons-u-s-government-and IV, 279 n.42: all'
    tags: [name:lodge-henry-cabot, name:nguyen-cao-ky]
  - id: cal.1966-04-04.vietnam-struggle-3
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'Johnson with Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy and Fortas, 7:10 to 8:35 p.m. Westmoreland sees "prospect of success in Danang"; Johnson, McNamara and Rusk do not. Johnson: "appeasement never wins"; "rather have someone we can control"; "Ky is gone, the last gasp"; "We need a Garcia-Godoy type—with an advisor by his side." McNamara: "We need a Bunker in Vietnam."'
    n: '[FRUS 1964–68, IV, doc. 112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 279–81. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-04-04.vietnam-struggle]]. Names: Johnson, Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy, Fortas, Westmoreland, Nguyễn Cao Kỳ.'
    src:
      c: 2ee377c9
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d112: all'
        - 'w.gibbons-u-s-government-and IV, 279–81: all'
        - 'via w.gibbons-u-s-government-and IV, 279 n.44: all'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:rusk-dean, name:mcnamara-robert-s, name:rostow-walt-w, name:taylor-maxwell, name:bundy-william, name:fortas-abe, name:westmoreland-william, name:nguyen-cao-ky]
  - id: cal.1966-04-04.vietnam-struggle-4
    when: Apr. 4
    date: '1966-04-04'
    thread: vietnam-struggle
    c: 'State to Lodge, 2966, the second cable approved at the meeting: a political answer "as quickly and peacefully as possible"; much more contact with the government and the opposition; Lodge or Negroponte to see Trí Quang; a "prompt solution" for Thi''s future. Kỳ''s successor from the Directorate, Chiểu for choice; "We are at a loss here to suggest any civilian."'
    n: '[[w.gibbons-u-s-government-and]], IV, 281. To check: Washington to Saigon 2964 and 2966, Apr. 4, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 281 n.45). See [[cal.1966-04-04.vietnam-struggle-3]]. Names: Lodge, Thích Trí Quang, Nguyễn Chánh Thi, Nguyễn Cao Kỳ.'
    src:
