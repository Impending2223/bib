    when: May 23–26
    date: '1960-05-23'
    thread: soviet-union
    c: Security Council on the Soviet complaint against the flights, Gromyko for the Soviet Union. Lodge shows the carved Great Seal taken from the ambassador's residence in Moscow, a listening device inside. The Soviet resolution rejected, 7–2, Ceylon and Tunisia abstaining.
    n: 'U.N. Security Council, *Official Records*, 15th year, 857th–860th meetings. Check the date of the vote. See [[cal.1960-05-01.soviet-union]]. Names: Gromyko (K–J Adm. III.J); Lodge (K–J Adm. III.E).'
    tags: [name:gromyko-andrei, name:lodge-henry-cabot]
