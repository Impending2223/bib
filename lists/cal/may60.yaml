  - id: cal.1960-05-26.school-aid
    when: May 26
    date: '1960-05-26'
    thread: school-aid
    c: 'House passes the school construction bill, H.R. 10128, [206–189](https://voteview.com/rollcall/RH0860140): grants, $325 million a year for four years. Powell''s amendment, aid only to schools open to all races, adopted, [218–181](https://voteview.com/rollcall/RH0860136).'
    n: 'See [[cal.1960-02-04.school-aid]]. Names: Powell (K–J Cong. III.D).'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1960-05-27.soviet-union
    when: May 27–June 2
    date: '1960-05-27'
    thread: soviet-union
    c: 'Foreign Relations Committee, in executive session, on the U-2 and the summit, Fulbright presiding: Herter, Dulles, Dryden of NASA, Dillon, Bohlen, Gates.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 155](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d155). *Events Incident to the Summit Conference: Hearings Before the Committee on Foreign Relations*, 86th Cong. (1960), the testimony the executive thought dangerous left out; the report, S. Rep. No. 1761, 86th Cong. (1960). Made public: the full hearings, Dulles''s testimony of May 31 among them, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XII (1982), 279–359. See [[cal.1960-05-01.soviet-union]]. Names: Fulbright (K–J Cong. III.B); Dulles (K–J Adm. III.I); Dillon (K–J Adm. III.H).'
    tags: [name:fulbright-j-william, name:herter-christian-a, name:dulles-allen-w, name:dryden-hugh-l, name:dillon-c-douglas, name:bohlen-charles-e, name:gates-thomas-s-jr]
