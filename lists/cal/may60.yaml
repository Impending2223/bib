    n: 'CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Smathers (K–J Cong. III.A); Nixon (Opp. III.E).'
    tags: [primary:1960-05-24, name:smathers-george-a, name:nixon-richard-m]
