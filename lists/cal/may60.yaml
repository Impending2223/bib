list: cal
section: VI
entries:
  - id: cal.1960-05-01.soviet-union
    when: May 1–3
    date: '1960-05-01'
    thread: soviet-union
    c: 'Powers''s U-2, out of Peshawar for Bodø, Norway, shot down near Sverdlovsk, 1,200 miles inside the Soviet Union. Powers parachutes; taken alive. May 3: NASA''s cover story, a weather plane down near Lake Van, Turkey.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147) (editorial note: Goodpaster''s memorandum of Apr. 25, one more flight allowed, before May 1; the statements of May 3–9); the NASA statement, *Department of State Bulletin*, May 23, 1960, 817. [[w.beschloss-mayday]]; [[w.wise-u-2-affair]]; [[w.powers-operation-overflight]]; [[w.pedlow-cia-and-the-u]]; [[w.bissell-reflections-of-a-cold]]; [[w.eisenhower-white-house-years]], 543–559; [[w.ambrose-eisenhower]]; [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]]; [[w.kistiakowsky-scientist-at-the-white]]; [[w.bohlen-witness-to-history-1929]]; [[w.macmillan-pointing-the-way-1959]]; [[w.taubman-khrushchev]]; [[w.fursenko-khrushchevs-cold-war]]. Made public: Khrushchev to the Supreme Soviet, May 5 (the plane) and May 7 (the pilot alive). Names: Powers (K–J Adm. III.I).'
    tags: [name:powers-francis-gary, name:eisenhower-dwight-d, name:goodpaster-andrew-j, name:bissell-richard-m-jr]
