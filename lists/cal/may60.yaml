    thread: soviet-union
    c: Eisenhower's report on Paris, radio and television. The flights stopped the week before the summit, not to be resumed. Aerial surveillance by the United Nations proposed, American planes offered.
    n: '[Radio and Television Report to the American People on the Events in Paris](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-events-paris) (May 25, 1960). [FRUS 1958–60, IX, doc. 194](https://history.state.gov/historicaldocuments/frus1958-60v09/d194) (Cabinet, May 26). See [[cal.1960-05-01.soviet-union]]. Names: Eisenhower (Opp. III.E).'
