    when: May 2
    date: '1960-05-02'
    thread: crime-and-hijacking
    also: [states-and-cities]
    c: Chessman executed in the gas chamber at San Quentin, his appeals refused.
    n: 'See [[cal.1960-02-19.crime-and-hijacking-ca]]. Names: Chessman (K–J Cong. III.K).'
    tags: [state:ca, name:chessman-caryl]
  - id: cal.1960-05-03.elections-1960
    when: May 3
    date: '1960-05-03'
    thread: elections-1960
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: unpledged delegates in the District; Nixon in Indiana and Ohio. Democratic: Humphrey in the District; Kennedy in Indiana; DiSalle in Ohio.'
    n: 'CQ Guide 6th (2010) 404. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey (K–J Adm. III.D); Kennedy (Viet. III.A); Nixon (Opp. III.E).'
    tags: [primary:1960-05-03, name:humphrey-hubert-h, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-05-03.program
    when: May 3
    date: '1960-05-03'
    thread: program
    c: Special message on the legislative program, two months left in the session. Mutual security; wheat; sugar, with authority to adjust quotas; the 4¼ percent ceiling on bonds lifted; a gasoline tax for the highways; immigration; school construction by debt service; medical care for the aged without compulsion; a moderate rise in the minimum wage; a balanced budget.
    n: '[Special Message to the Congress on the Legislative Program](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-legislative-program) (May 3, 1960). [[w.morgan-eisenhower-versus-the-spenders]]; [[w.sundquist-politics-and-policy]]; [[w.pach-presidency-of-dwight-d]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-03.alabama-al
    when: May 3
    date: '1960-05-03'
    thread: alabama
    also: [elections-1960]
    c: 'Alabama''s Democratic primary for presidential electors, eleven places, the electors to go on the November ballot as the party''s: a slate of unpledged electors against a slate loyal to the national ticket. One place filled outright, by an unpledged elector, 166,119 votes; the next, unpledged, 153,865; the first of the loyalists third, 150,550. Runoff for the other ten places May 31.'
    n: '*Alabama Official and Statistical Register, 1963* (Ala. Dept. of Archives and History), [637](https://archive.org/details/alabama-official-statistical-register-1963/page/n636). [[w.bartley-southern-politics-and-the]]; [[w.white-making-of-the-president]]. See [[cal.1960-11-08.elections-1960]].'
    tags: [state:al]
  - id: cal.1960-05-03.governors-fl
    when: May 3
    date: '1960-05-03'
    thread: governors
    also: [elections-1960]
    c: Florida's Democratic primary for governor. Bryant, a former State representative, 20.7 percent; Carlton, a State senator, 19.9; Burns, mayor of Jacksonville, 17.8; seven others. Runoff between Bryant and Carlton.
    n: 'Fla. Secretary of State, *Tabulation of Official Vote, Florida Primary Elections*, May 3 and May 24, 1960 ([archive.org](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1960)); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1960_Florida_gubernatorial_election) gives them (Check). [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.bartley-southern-elections]]; [[w.black-southern-governors-and-civil]]. Names: Burns (K–J Cong. III.F); Carlton (K–J Cong. III.K).'
    tags: [name:bryant-farris, name:carlton-doyle-e-jr, name:burns-w-haydon, state:fl]
  - id: cal.1960-05-05.soviet-union
    when: May 5–7
    date: '1960-05-05'
    thread: soviet-union
    c: 'Khrushchev to the Supreme Soviet: an American spy plane shot down deep inside the country. NASA and State keep to the weather plane. May 7: Khrushchev says the pilot is alive, shows the film, names Peshawar and Bodø. State concedes an intelligence flight, "probably," with "no authorization" from Washington.'
    n: '[FRUS 1958–60, X, pt. 1, doc. 147](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d147); the statements of May 5 and 7, *Department of State Bulletin*, May 23, 1960, 817–819; Khrushchev''s speeches, *Current Digest of the Soviet Press*, June 1 and June 8, 1960. See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev (K–J Adm. III.J).'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1960-05-06.voting-rights
    when: May 6
    date: '1960-05-06'
    thread: voting-rights
    c: Civil Rights Act of 1960 signed, [74 Stat. 86](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg86.pdf). Federal referees to register Negro voters where a court finds a pattern of discrimination; voting records kept two years; obstructing a court order by force a crime; the FBI to investigate bombings of schools and churches.
    n: '[Statement by the President Upon Signing the Civil Rights Act of 1960](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-civil-rights-act-1960) (May 6, 1960). See [[cal.1960-02-15.voting-rights]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-07.governors-tx
    when: May 7
    date: '1960-05-07'
    thread: governors
    also: [elections-1960]
    c: Texas Democratic primary. Governor Daniel renominated for a third term over Jack Cox, a former State representative, 59.5 percent to 40.5.
    n: '[Wikipedia, "1960 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1960_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the State Democratic Executive Committee''s canvass (Texas State Library and Archives). [[w.knaggs-two-party-texas]]; [[w.davidson-race-and-class-in]]; [[w.cunningham-cowboy-conservatism]]. Names: Daniel, Cox (K–J Cong. III.F).'
    tags: [state:tx, name:daniel-price, name:cox-jack]
  - id: cal.1960-05-09.soviet-union
    when: May 9–11
    date: '1960-05-09'
    thread: soviet-union
    c: 'Herter''s statement: the President''s directives, since the start of his administration, authorize gathering such information; specific missions not subject to his authorization. Herter and Dulles brief congressional leaders. May 11, the news conference: Eisenhower takes the program as his. Espionage "a distasteful but vital necessity."'
    n: '[FRUS 1958–60, X, pt. 1, doc. 149](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d149) (NSC, May 9). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-231) (May 11, 1960). See [[cal.1960-05-01.soviet-union]]. Names: Dulles (K–J Adm. III.I); Eisenhower (Opp. III.E).'
    tags: [name:herter-christian-a, name:dulles-allen-w, name:eisenhower-dwight-d]
  - id: cal.1960-05-10.elections-1960
    when: May 10
    date: '1960-05-10'
    thread: elections-1960
    c: 'Primaries in Nebraska and West Virginia. Republican: Nixon in Nebraska; unpledged delegates in West Virginia. Democratic: Kennedy in Nebraska and West Virginia.'
    n: 'CQ Guide 6th (2010) 404–405. See [[cal.1960-03-08.elections-1960]]. Names: Kennedy (Viet. III.A); Nixon (Opp. III.E).'
    tags: [primary:1960-05-10, name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-05-10.elections-1960-2
    when: May 10
    date: '1960-05-10'
    thread: elections-1960
    c: Humphrey, beaten by Kennedy in West Virginia, withdraws that night, at Charleston.
    n: '[[w.white-making-of-the-president]]; [[w.fleming-kennedy-vs-humphrey-west]]; [[w.humphrey-education-of-a-public-1976]]; [[w.solberg-hubert-humphrey]]; [[w.obrien-no-final-victories]]; [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.rorabaugh-real-making-of-the]]. Names: Humphrey (K–J Adm. III.D); Kennedy (Viet. III.A).'
    tags: [name:humphrey-hubert-h, name:kennedy-john-f]
  - id: cal.1960-05-10.sit-ins
    when: May 10
    date: '1960-05-10'
    thread: sit-ins
    c: Nashville. Six downtown stores serve Negroes at their lunch counters, by agreement with the merchants. Three months of sit-ins; the bombing of Looby's house, Apr. 19, and the march on City Hall.
    n: See [[cal.1960-02-01.sit-ins]].
  - id: cal.1960-05-10.governors-nm
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'New Mexico''s primary, for governor. Democratic: Governor Burroughs 66,541, 53.8 percent; Bursey 48,841, 39.5. Republican: Mechem, governor 1951–55 and 1957–59, 29,486, 76.0, over Robinson.'
    n: 'Votes: [Wikipedia, "1960 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Mexico_gubernatorial_election); Check: N.M. Secretary of State, *New Mexico Election Returns, 1911–1969*. [[w.peirce-mountain-states-of-america]]. Names: Burroughs (K–J Cong. III.F); Bursey, Robinson (K–J Cong. III.K).'
    tags: [state:nm, name:burroughs-john, name:bursey-joseph-a, name:mechem-edwin-l, name:robinson-paul-w]
  - id: cal.1960-05-10.governors-wv
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'West Virginia primaries for governor. Democratic: Barron, the attorney general, 51.0 percent; Hulett Smith 38.1; a third 10.9. Republican: Harold E. Neely 55.3, Revercomb, a former Senator, 44.7. Kennedy carries the presidential primary the same day.'
    n: '*West Virginia Blue Book*, 1960, [p. 732](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=741) (Barron 187,501, Smith 140,079, Orel J. Skeen 39,907), [p. 750](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1960.pdf#page=759) (Neely 102,618, Revercomb 83,028). [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Barron, Smith (K–J Cong. III.F); Neely, Revercomb (K–J Cong. III.K); Kennedy (Viet. III.A).'
    tags: [state:wv, name:barron-w-w, name:smith-hulett-c, name:neely-harold-e, name:revercomb-chapman, name:kennedy-john-f]
  - id: cal.1960-05-10.governors-ne
    when: May 10
    date: '1960-05-10'
    thread: governors
    also: [elections-1960]
    c: 'Nebraska, governor; the governor running for the Senate. Democratic primary: Morrison 48.0 percent, Conrad 41.6, three others 10.4. Republican: Cooper 37.7, Abel 24.1, Carpenter 15.8, four others 22.4.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1960*](https://govdocs.nebraska.gov/epubs/S1200/S001-1960prim_gen.pdf); Democratic figures from [Wikipedia, "1960 Nebraska gubernatorial election"](https://en.wikipedia.org/wiki/1960_Nebraska_gubernatorial_election). [[w.peirce-great-plains-states-of]]. Names: Morrison (K–J Cong. III.F); Conrad, Cooper, Abel, Carpenter (K–J Cong. III.K).'
    tags: [state:ne, name:morrison-frank-b, name:conrad-robert-b, name:cooper-john-r-sr, name:abel-hazel, name:carpenter-terry]
  - id: cal.1960-05-12.students
    when: May 12–14
    date: '1960-05-12'
    thread: students
    c: 'Un-American Activities subcommittee hearings at San Francisco City Hall, Willis presiding. Students, most from Berkeley, protest. May 13: police turn fire hoses on them in the rotunda and drag them down the marble stairs; dozens arrested. A larger crowd outside the next day.'
    n: 'Arrests: 64 or 68, by different accounts. Check. The committee''s film of the day, *Operation Abolition* (1960). [[w.goodman-committee]]; [[w.rorabaugh-berkeley-at-war]]; [[w.berkeley-in-the-sixties]].'
    tags: [name:willis-edwin-e]
  - id: cal.1960-05-13.jobs-and-wages
    when: May 13–24
    date: '1960-05-13'
    thread: jobs-and-wages
    c: 'Area redevelopment veto, the second: S. 722, Douglas''s bill, $251 million in loans and grants for depressed areas, passed by the House May 4, [202–184](https://voteview.com/rollcall/RH0860123), and taken by the Senate May 6, [45–32](https://voteview.com/rollcall/RS0860313). Eisenhower: aid where the trouble is temporary; machinery financed; a new agency. May 24: the Senate fails to override, [45–39](https://voteview.com/rollcall/RS0860318).'
    n: '[Veto of the Area Redevelopment Bill](https://www.presidency.ucsb.edu/documents/veto-the-area-redevelopment-bill) (May 13, 1960); [Letter to Governor Underwood of West Virginia](https://www.presidency.ucsb.edu/documents/letter-governor-underwood-west-virginia-further-federal-activities-aid-chronic-labor) (released June 12, 1960). [[w.levitan-federal-aid-to-depressed]]; [[w.sundquist-politics-and-policy]]; [[w.douglas-in-the-fullness-of]]; [[w.morgan-eisenhower-versus-the-spenders]]. Names: Douglas (K–J Cong. III.B); Eisenhower (Opp. III.E).'
    tags: [name:douglas-paul-h, name:eisenhower-dwight-d]
  - id: cal.1960-05-14.foreign-aid
    when: May 14
    date: '1960-05-14'
    thread: foreign-aid
    c: Mutual Security Act of 1960 signed, [74 Stat. 134](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg134.pdf). The authorization nearly all the President asked.
    n: '[Statement by the President Upon Signing the Mutual Security Act of 1960](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-the-mutual-security-act-1960) (released May 16, 1960). [[w.kaufman-trade-and-aid]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-05-15.soviet-union
    when: May 15–20
    date: '1960-05-15'
    thread: soviet-union
    c: 'Paris. Khrushchev to de Gaulle and Macmillan, May 15: no summit unless the United States condemns the flights, ends them, and punishes those responsible. That night, on Gates''s order, a test alert of American forces worldwide. May 16, the Élysée: Khrushchev reads his demands and withdraws Eisenhower''s invitation to the Soviet Union; Eisenhower: the flights suspended, not to be resumed. May 17: Khrushchev absent; the conference does not meet. May 20, East Berlin: Khrushchev puts the German treaty off until a new summit.'
    n: '[Statement by the President Concerning the Position Taken by Chairman Khrushchev](https://www.presidency.ucsb.edu/documents/statement-the-president-concerning-the-position-taken-chairman-khrushchev-the-opening-the) (May 16, 1960); [Joint Statement With President de Gaulle and Prime Minister Macmillan](https://www.presidency.ucsb.edu/documents/joint-statement-with-president-de-gaulle-and-prime-minister-macmillan-concerning-the) (May 17, 1960). FRUS 1958–60, IX, docs. [163](https://history.state.gov/historicaldocuments/frus1958-60v09/d163), [168](https://history.state.gov/historicaldocuments/frus1958-60v09/d168) (the meeting of May 16), [178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178), [192](https://history.state.gov/historicaldocuments/frus1958-60v09/d192); X, pt. 1, [doc. 153](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d153) (NSC, May 24: the "military test alert"). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev, de Gaulle, Macmillan (K–J Adm. III.J); Eisenhower (Opp. III.E).'
    tags: [name:khrushchev-nikita-s, name:de-gaulle-charles, name:macmillan-harold, name:gates-thomas-s-jr, name:eisenhower-dwight-d]
