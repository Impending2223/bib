  - id: cal.1969-04.china-leadership-25
    when: Apr., by the 7th
    date: 1969-04
    at: before 1969-04-07
    place: hebei
    thread: china-leadership
    c: 'As Hebei 河北 reports have it: more than 76,000 people incarcerated across the province as the authorities uncover enemy organizations. In Qiuxian county more than a thousand, about 1 percent of the population, locked up, forty houses in the main town taken over as jails, many accused of belonging to a "New Nationalist Party" run from Taipei; torture chambers across the county; hundreds of homes ransacked, floors torn up and walls pulled down; the head of the revolutionary committee: "Kill a batch, arrest a batch and handle a batch"; more than 700 hounded to their deaths, 1,316 crippled or maimed for life; half the people in abject poverty as farming is neglected.'
    n: '[[w.dikotter-cultural-revolution]], 187–188 n.11. Made public: 2016. To check: Hebei Provincial Archives, Apr. 7, 1969, 919-1-288, pp. 142–143 (cited by [[w.dikotter-cultural-revolution]], 188 n.11a); Report to Xie Fuzhi, 1969, Hebei Provincial Archives, 919-1-274 (cited by [[w.dikotter-cultural-revolution]], 188 n.11b).'
    src:
      c: 25864e7d
      rows:
        - 'w.dikotter-cultural-revolution 188: all'
        - 'via w.dikotter-cultural-revolution 188 n.11a: all'
        - 'via w.dikotter-cultural-revolution 188 n.11b: all'
