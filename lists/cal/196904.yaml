  - id: cal.1969-04-13.china-leadership
    when: Apr. 13
    date: '1969-04-13'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group, the Office Group and the Congress convenors on the next day''s speeches: Zhou Enlai, Chen Boda, Kang Sheng and Huang Yongsheng, then Wang Hongwen for the workers, Chen Yonggui for the peasants, Wei Fengying for women, Sun Yuguo for the army, Ji Dengkui for cadres; old comrades still sit in front; the Cultural Revolution brought both anarchy and killers who used it; the former are not the main thing.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 13, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 13, 1969; the meeting and Mao''s word on the old comrades); [[w.mao-zedong-zhuan]], VI, ch. 77 n.78 (Apr. 13, in a talk with the members of the Cultural Revolution Group''s liaison meeting, of the Military Commission''s Office Group and the group convenors: in this Cultural Revolution there is on the one side anarchism among the masses, a current of thought of knocking down everything and doubting everything, on the other side not a few use the chance to kill, burn and poison, armed fighting included, ''I think these have no bearing on the whole''; the book gives no hall, hour or the next day''s speakers, n.78). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 13, 1969), has Zhou asking Mao whether the old comrades still sit in front, and Wang Hongwen cutting in that he is not much inclined to elect them. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会, of the Military Commission''s Office Group 军委办事组 and the group convenors of the Ninth Congress (record 谈话记录), Apr. 13, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.78). Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wang Hongwen, Chen Yonggui, Wei Fengying, Sun Yuguo, Ji Dengkui.'
