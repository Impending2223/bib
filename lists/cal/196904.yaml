  - id: cal.1969-04.vietnam-hanoi-3
    when: Apr.
    date: 1969-04
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'From Region 6 southward the Liberation forces fight 934 actions: a Saigon force of two battalions, three American groups, a subsector headquarters and six pacification teams hurt; over 150 aircraft shot down or destroyed, 346 vehicles, 74 river craft sunk, by the history''s count. The 5th, 7th and 9th Divisions strike toward Route 13, Tây Ninh and Dầu Tiếng; the 5th, from Long Khánh and Định Quán, hits the Saigon 18th Division''s headquarters.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 113–14. Check: the days; the history gives the month and its own figures.'
    tags: [polity:drv, polity:us, ok:fields-place]
  - id: cal.1969-04.laos
