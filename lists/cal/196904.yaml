  - id: cal.1969-04-01.china-leadership-2
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai to Mao and Lin Biao, by letter: by Mao''s instruction the rostrum at the Ninth Congress''s opening is to hold Mao, Lin Biao, Zhou, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao and Yao Wenyuan, the last three perhaps not on it. He also lists the presidium''s front-row executive chairmen and gives a seating plan, among them Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen and Ye Jianying. The nianpu notes that at the opening Jiang, Zhang and Yao went on the rostrum.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, name:chen-boda, name:kang-sheng, name:dong-biwu, name:liu-bocheng, name:zhu-de, name:chen-yun, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, name:li-fuchun, name:chen-yi, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, vis:only:prc]
  - id: cal.1969-04-01.china-leadership-3
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    c: 'Lin Biao''s 林彪 report to the Ninth Congress of Apr. 1, after ''Chairman Mao has lately pointed out'', sets in bold type a passage of Mao''s 毛泽东, undated in the book: the proletariat is the greatest class in human history, the most powerful revolutionary class in ideas, politics and strength; it can and must unite the great majority around itself and isolate and strike the handful of enemies as far as possible.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 424 (Apr. 1, 1969). Made public: *Renmin ribao*, Apr. 28, 1969 (the report, n.1). Check: when Mao said it; the book dates it ''1969''. Names: Mao Zedong, Lin Biao.'
    src:
      c: e34604c2
      rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 424: all'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-04-01.china-leadership-4
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    c: 'Lin Biao''s 林彪 report to the Ninth Congress, after ''Chairman Mao has lately pointed out'', sets in bold type a saying of Mao''s 毛泽东, undated in the book: the question of world war has but two possibilities, that war gives rise to revolution, or that revolution prevents war.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 425 (Apr. 1, 1969). Made public: *Renmin ribao*, Apr. 28, 1969 (the report, n.1). Check: when Mao said it; the book dates it ''1969'' and gives his talk with Hill of Nov. 28, 1968 in n.1. See [[cal.1968-11-28.china-leadership]]. Names: Mao Zedong, Lin Biao.'
