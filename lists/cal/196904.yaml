    thread: china-leadership
    c: 'Mao 毛泽东, on the draft speech sent by Chen Boda 陈伯达 Apr. 12 for the Ninth Congress meeting of Apr. 14: ''What is said on p. 2 goes too far and should be struck; you can write some views of your own instead.'' The page calls Mao the invincible creative genius seen only once in history.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 426 (Apr. 12, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Chen Boda, draft of his speech for the Ninth Congress meeting of Apr. 14, 1969, sent to Mao Apr. 12: p. 2 calls the great teacher of the proletariat Chairman Mao, after over fifty years of struggle and the richest experience, an invincible creative genius seen only once in history (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 426 n.1). Names: Mao Zedong, Chen Boda.'
    src:
