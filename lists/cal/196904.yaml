  - id: cal.1969-04-22.soviet-union-leadership
    when: Apr. 22–26
    date: '1969-04-22'
    thread: soviet-union-leadership
    c: Moscow. The Council for Mutual Economic Assistance's session, Brezhnev heading the Soviet delegation. He meets the delegations of Czechoslovakia, Romania, Poland, Bulgaria and the GDR at Vnukovo, Apr. 22, and the heads of the delegations of Bulgaria, Czechoslovakia, the GDR, Hungary, Mongolia, Poland and Romania at the reception house Apr. 23, 9 a.m., and opens the session at 10; the session to Apr. 26; a reception Apr. 26, 2 to 4.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332–333 (Apr. 22–26). Names: Brezhnev.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:czechoslovakia, polity:hungary, polity:bulgaria, polity:mongolia]
  - id: cal.1969-04-24.soviet-union-leadership
    when: Apr. 24
    date: '1969-04-24'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with Husák, the Czechoslovak party''s new First Secretary, in Moscow for the Council''s session: Apr. 22, with Černík, Kosygin and Podgorny; Apr. 24, in Brezhnev''s office, 6 to 11 p.m.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332 (Apr. 22, 24). Names: Brezhnev, Husák. Check: Husák became First Secretary of the Czechoslovak party Apr. 17; the record names no one else present.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia, name:kosygin-aleksei, name:podgorny-nikolai-v]
