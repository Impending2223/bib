  - id: cal.1969-04-28.china-leadership
    when: Apr. 28
    date: '1969-04-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao presides over the First Plenum of the Ninth Central Committee, 4 p.m. It elects a Politburo of 21: Mao, Lin Biao, then in stroke order Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi; alternates Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing. Mao chairman, Lin vice-chairman; the Standing Committee Mao, Lin, Chen Boda, Zhou, Kang Sheng. In the first Politburo meeting Mao has the Military Commission named: chairman himself, vice-chairmen Lin, Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ye Jianying, the Office Group under Huang Yongsheng. Mao speaks to the plenum on unity, on continuing socialist revolution and "struggle, criticize, reform".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 28, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the plenum, the Standing Committee, the Military Commission, Mao''s speech); [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the Politburo''s size only); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 28, 1969; at the First Plenum of the Ninth Central Committee, the book says, the main members of Lin Biao''s and Jiang Qing''s group enter the Politburo and Lin Biao is elected Vice-Chairman of the Central Committee). Made public: 2013 (the Politburo meeting, Mao''s speech). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969), has Zhou propose at the Politburo''s first meeting, on Mao''s suggestion, that Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying stay vice-chairmen of the Military Commission, Wu Faxian deputy head of the Office Group, the lists announced by the Center May 27. Names: Mao Zedong, Lin Biao, Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing.'
    src:
      c: 6c84fdde
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 28, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 288: B, C'
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 661: A, B, D'
