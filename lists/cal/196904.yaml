  - id: cal.1969-04-11.china-leadership
    when: Apr. 11
    date: '1969-04-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, with the Congress secretariat and the group convenors: add to the political report on the democratic parties and the united front; the report and constitution to be passed in principle Apr. 14 and not published; the Central Committee list from below; old comrades to be elected (Zhu De, Chen Yun, Deng Zihui, Zhang Dingcheng, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi); no widening of the targets of attack.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 11, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 285–286 (Apr. 11, 1969; Zhou at the meeting); [[w.macfarquhar-maos-last-revolution]], 294 (Mao, over delegates'' doubts about electing "old rightists": "What''s wrong with having a few opponents in the party?"; to Zhang Guohua, first political commissar of the Chengdu Military Region: those who oppose you are not all bad people); [[w.macfarquhar-maos-last-revolution]], 294 (Mao names senior men in disgrace before the Cultural Revolution, Zhang Wentian and Wang Jiaxiang among them, and ten of the Eighth Central Committee he calls his "opposition," for a managed vote that elects them with modest numbers); [[w.mao-zedong-zhuan]], VI, ch. 77 n.77 (Apr. 11 Mao''s speech at the meeting of the Congress secretariat and the group convenors: shall the groups go on to the end or hold a plenary session; the plan is a plenary session in the middle to pass the report and the constitution, then the election and a last plenary to close; the Beijing group''s bulletin says one tendency hides another, in cleaning the class ranks there is the tendency to widen it, understandable since the Center ordered the cleaning, in history there are many such cases; the principal contradiction was set at the Second Plenum of the Seventh Committee as that of proletariat and bourgeoisie but not often said or said openly; so a Cultural Revolution again; call it great or not, let historians decide; touched the superstructure from the Center to factories, offices and schools; the army to be careful; at Nankou eight men made a case file and made the Party secretary a dog spy, handed to the masses to check he was a good man; case-makers'' material is not accurate; once shut up it is hard to let out, one must give a reason; leading comrades are to treat widening as a main matter; the list of the Central Committee to come from below, from the groups, then the large groups; he proposes electing the old comrades named; the book gives no hall or those present, n.77). Made public: 2013. Check: the book (294) gives Mao''s choice without a day; taken here as this meeting, which names the old comrades to be elected. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: "Mao zhuxi 69.4.11 jianghua," copy of a handwritten transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.54); [[w.zhou-enlai-nianpu-1949]], III, 291 (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.53a); [[w.zehou-zhonggong-jiuda-neimu-suoyi]], 48 (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.53b). Names: Mao Zedong, Zhu De, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi, Chen Yun, Deng Zihui, Zhang Dingcheng.'
