  - id: cal.1969-04-14.china-leadership
    when: Apr. 14
    date: '1969-04-14'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao at the Ninth Congress plenary, afternoon: it passes the political report and the Party constitution (the constitution drops members'' rights and writes Lin Biao in as Mao''s successor) and gives both to the secretariat for editing before publication. Mao in his speech praises the frontier troops at Zhenbao, with poor arms and brave, and says the "superstition" has been broken.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 286–287 (Apr. 14, 1969; the plenary); [[w.macfarquhar-maos-last-revolution]], 279 (the passage naming Lin Biao as Mao''s successor, kept at Mao''s and the Center''s insistence, appears unchanged in the constitution adopted); [[w.macfarquhar-maos-last-revolution]], 290 (Lin Biao''s report approved by a show of hands; no objection when Mao asks whether more changes may be made before publication); [[w.macfarquhar-maos-last-revolution]], 291–292 (the new constitution, little changed from the Twelfth Plenum''s draft, names Lin Biao Mao''s successor, is a quarter the length of the old, and restores Mao Zedong Thought as the Party''s theoretical basis); [[w.macfarquhar-maos-last-revolution]], 289 (Wang Hongwen pledges for the working class to "resolutely surpass" the economy''s targets once the congress is over); [[w.macfarquhar-maos-last-revolution]], 289 (Chen Yonggui, of Dazhai: the poor and lower-middle peasants will "make preparations for war and natural disasters"); [[w.macfarquhar-maos-last-revolution]], 289–291 (Zhou Enlai''s statement, prepared with Mao: Lin Biao the "glorious representative" who led insurgents to Jinggangshan after Nanchang, and Mao''s "universally recognized successor"); [[w.macfarquhar-maos-last-revolution]], 292 (Kang Sheng''s statement on the constitution: "to the point, not burdened with trivial detail"); [[w.mao-zedong-zhuan]], VI, ch. 77 n.79 (Apr. 14 the second plenary session of the Congress, Mao presiding, hears nine speakers, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wang Hongwen 王洪文, Chen Yonggui 陈永贵, Sun Yuguo 孙玉国, Wei Fengying 尉凤英 and Ji Dengkui 纪登奎; Sun, a front-line soldier from Zhenbao against the Soviet invaders, is applauded standing by Mao as he comes up and when he finishes, and Mao shakes his hand and says: ''tanks, armored cars, guns and planes we want all of them, but we depend chiefly on the courage of the infantry''; the session passes the political report and the revised Party constitution; the book gives no afternoon and does not say the papers went to the secretariat for editing, n.79). [[w.yang-jisheng-tiandi-fanfu]], II, 717 (Mao presides and asks that no slogans be shouted; the day''s three items: Lin Biao''s report, the constitution, and speeches); [[w.teiwes-tragedy-of-lin-biao]], 1, 109–110 (the constitution approved that day; Zhou''s speech, praising Lin extravagantly, uses two of the three adverbs, Mao''s development of the theory "with genius" and "creatively"; Lin''s humble impromptu remarks: Mao "always charts the course," we only follow); [[w.dikotter-cultural-revolution]], 207 n.4 (the new constitution: "Marxism-Leninism Mao Zedong Thought is the theoretical basis guiding the party''s thinking"). Made public: 2013 (Mao''s speech). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 286–287 (Apr. 14, 1969), has Zhou speak at the plenary: full support for Mao''s opening speech, Lin Biao''s report and the new constitution, Lin''s merits before and after 1949 and above all in the Cultural Revolution, and so the rightness of Lin as Mao''s successor. Check: the book (292) does not date Kang Sheng''s statement; the Mao chronology names him among the next day''s speakers ([[cal.1969-04-13.china-leadership]]). To check: the Congress''s records; the political report and constitution as adopted (cited by [[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969); [[w.jiuda-ziliao-huibian]], 12 (cited by [[w.macfarquhar-maos-last-revolution]], 290 n.32); [[w.jiaoxue-cankao]], II, 63 (cited by [[w.macfarquhar-maos-last-revolution]], 291 n.39); [[w.zhongguo-gongchandang-dangzhang-huibian]], 46, 146, 206 (cited by [[w.macfarquhar-maos-last-revolution]], 292 n.43); "Wang Hongwen tongzhi de fayan," Apr. 14, 1969, 2, copy of the official transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.19b); "Chen Yonggui tongzhi de fayan," Apr. 14, 1969, 2, copy of the official transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.19c); Zhou Enlai''s statement of Apr. 14, 1969, in [[w.schoenhals-new-texts]], 93–101 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.19d); Wang Nianyi, interview by Michael Schoenhals, Beijing, April 1992 (cited by [[w.macfarquhar-maos-last-revolution]], 290 n.33); Zhou Enlai''s statement of Apr. 14, 1969, in [[w.schoenhals-new-texts]], 95 (cited by [[w.macfarquhar-maos-last-revolution]], 291 n.34); Zhou Enlai''s statement of Apr. 14, 1969, in [[w.schoenhals-new-texts]], 98 (cited by [[w.macfarquhar-maos-last-revolution]], 291 n.35); Zhou Enlai''s statement of Apr. 14, 1969, in [[w.schoenhals-new-texts]], 100 (cited by [[w.macfarquhar-maos-last-revolution]], 291 n.37); [[w.schoenhals-new-texts]], 101–102 (cited by [[w.macfarquhar-maos-last-revolution]], 291 n.38); Kang Sheng''s statement on the constitution, in [[w.jiuda-ziliao-huibian]], 30 (cited by [[w.macfarquhar-maos-last-revolution]], 292 n.42); Mao Zedong 毛泽东, speech at the Ninth National Congress 中共九大 (record 讲话记录), Apr. 14, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.79). Names: Mao Zedong, Lin Biao. Check: the presidium secretariat''s press communique of the day (the report and constitution passed).'
