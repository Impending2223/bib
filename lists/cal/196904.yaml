    c: 'Mao 毛泽东, at 11 p.m., on the request of Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元 sending the fourth revised draft of the political report: to Lin Biao 林彪 to review; he thinks this revision better; he changes only a point on p. 24, ''the bad men found among cadres and intellectuals'' to ''the bad men or suspects found in the movement to clean up the class ranks'', in the policy of ''no killing and few arrests''; the newly set copy is held back to read; Lin is to return the paper to Zhang and Yao.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 405–406, 411 (Apr. 7, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Names: Mao Zedong, Lin Biao, Zhang Chunqiao, Yao Wenyuan.'
