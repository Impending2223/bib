entries:
  - id: cal.1969-04-01.china-leadership
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Ninth National Congress of the Chinese Communist Party opens in the Great Hall, Peking, Apr. 1–24: 1,512 delegates for 22 million members. Mao is elected chairman of the presidium, Lin Biao vice-chairman, Zhou Enlai secretary-general; the agenda: Lin''s political report, the constitution, election of a Central Committee. Mao presides and speaks: the people''s political histories now clear; he hopes for a united congress and then for greater victories.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 1–24, 1969; the book says the Ninth Congress of the Chinese Communist Party meets at Peking; Lin Biao''s political report affirms the "theory of continuing revolution under the dictatorship of the proletariat" as the guiding thought of socialist revolution and the theoretical basis of the "Cultural Revolution," and so legitimizes the Cultural Revolution''s wrong theory and practice; the congress elects a new central leadership into which many close friends and followers of Lin Biao and Jiang Qing enter the Central Committee). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
    src:
      c: 0623646f
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 1, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 284: A, B, D, E'
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 661: A'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai]
  - id: cal.1969-04-01.china-leadership-2
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai to Mao and Lin Biao, by letter: by Mao''s instruction the rostrum at the Ninth Congress''s opening is to hold Mao, Lin Biao, Zhou, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao and Yao Wenyuan, the last three perhaps not on it. He also lists the presidium''s front-row executive chairmen and gives a seating plan, among them Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen and Ye Jianying. The nianpu notes that at the opening Jiang, Zhang and Yao went on the rostrum.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao, Chen Boda, Kang Sheng, Dong Biwu, Liu Bocheng, Zhu De, Chen Yun, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Li Fuchun, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, name:chen-boda, name:kang-sheng, name:dong-biwu, name:liu-bocheng, name:zhu-de, name:chen-yun, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, name:li-fuchun, name:chen-yi, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, vis:only:prc]
