  - id: cal.1969-04-28.china-leadership
    when: Apr. 28
    date: '1969-04-28'
    time: 1969-04-28T08:00Z
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao presides over the First Plenum of the Ninth Central Committee, 4 p.m. It elects a Politburo of 21: Mao, Lin Biao, then in stroke order Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi; alternates Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing. Mao chairman, Lin vice-chairman; the Standing Committee Mao, Lin, Chen Boda, Zhou, Kang Sheng. In the first Politburo meeting Mao has the Military Commission named: chairman himself, vice-chairmen Lin, Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ye Jianying, the Office Group under Huang Yongsheng. Mao speaks to the plenum on unity, on continuing socialist revolution and "struggle, criticize, reform".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 28, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the plenum, the Standing Committee, the Military Commission, Mao''s speech); [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969; the Politburo''s size only); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 28, 1969; at the First Plenum of the Ninth Central Committee, the book says, the main members of Lin Biao''s and Jiang Qing''s group enter the Politburo and Lin Biao is elected Vice-Chairman of the Central Committee); [[w.jianguo-yilai-mao-zedong]], XIX, 433–439 (Apr. 28, 1969; Mao''s speech at the First Plenum of the Ninth Central Committee, printed from the Center''s document of May 9, 1969; he speaks of the Soviet revisionists'' attacks (''military-bureaucratic dictatorship''), that the socialist revolution goes on and that struggle, criticism and reform remain; that in a fairly large majority of factories the leadership is not in the hands of true Marxists or the workers; that cases like the Erqi works'' Kuomintang members are to be handled with distinctions; that war must be prepared in spirit, not to strike out but to let a big attack in; that Yang Dezhi and Wang Xiaoyu, and Xu Shiyou, Xie Fuzhi and others are not at enmity but in contradiction among the people); [[w.macfarquhar-maos-last-revolution]], 295, 298 (a Politburo of twenty-one and four alternates, about the size of the old; Xie Fuzhi made a full member); [[w.macfarquhar-maos-last-revolution]], 295 (Li Xiannian, re-elected, says he has erred and is not fit for the Politburo; Mao: "Here is a comrade who''s mended his ways"); [[w.macfarquhar-maos-last-revolution]], 296 (Mao on unity: "Always this faction, that faction"); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.81–84 (Apr. 28, under Mao''s chairmanship, the First Plenum of the Ninth Central Committee elects a Politburo of 25 members in all, Lin Biao''s and Jiang Qing''s groups'' leading members almost all among them, only 12 of the Eighth Politburo''s 30 (the three dead not counted) continuing; of 277 votes cast for Politburo members Mao, Lin Biao, Zhou Enlai and Kang Sheng have all, Chen Boda 275, Huang Yongsheng 274, Jiang Qing 270, Wu Faxian and Ye Qun more than Zhang Chunqiao and Yao Wenyuan, n.81; for the Standing Committee Mao, Lin, Zhou, Kang Sheng and Chen Boda are elected, Jiang Qing getting 150 votes, Huang Yongsheng 130 and the other nominees under 35, n.82; Mao continues chairman of the Central Committee, Lin vice-chairman; Mao speaks briefly: only the old words, unity, so as to win greater victory; the socialist revolution goes on, with things still undone, struggle, criticism and reform, and some years on perhaps another revolution; without the Cultural Revolution it would not do, the foundation is not firm, in a fairly large majority of factories leadership is not in the hands of true Marxists or of the workers; consolidate the dictatorship of the proletariat in every factory, village, office and school, one by one; and on the Zhenbao clash of Mar. 2 and after, n.83, ''prepare for war: we do not strike out, do not be provoked, if you invite me I will not go, but if you come I shall deal with you'', n.84; the same day the new Politburo passes the Military Commission''s list, Mao chairman, Lin Biao, Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying vice-chairmen, and the Office Group''s, Huang Yongsheng head and Wu Faxian deputy head, which takes the Commission''s daily work; the book gives no hour, no list of the Politburo''s names and no alternates). [[w.yang-jisheng-tiandi-fanfu]], I, 463–464 (at the first plenum of the Ninth Central Committee Mao names the Shandong question a contradiction among the people); [[w.yang-jisheng-tiandi-fanfu]], II, 596–597 (Mao at the plenum: in a fairly large majority of factories the leadership not in the hands of true Marxists and the workers; the February Seventh Works 二七廠, the Changxindian 長辛店 railway rolling-stock repair works, 8,000 workers, with families tens of thousands; under the Guomindang 9 district branches, 3 bodies of the Three People''s Principles Youth Corps, 8 special-agent bodies); [[w.yang-jisheng-tiandi-fanfu]], II, 726 (Mao chairman, Lin Biao sole vice-chairman; the Standing Committee Mao, Lin, Chen Boda, Zhou Enlai, Kang Sheng; the Politburo''s 21 named); [[w.yang-jisheng-tiandi-fanfu]], II, 735–736 (Mao at the plenum: the Soviet revisionists, TASS, Wang Ming''s material and *Kommunist* call China a "military-bureaucratic dictatorship"); [[w.teiwes-tragedy-of-lin-biao]], 104–105, 110, 128 (a middle-sized Politburo of twenty-one with Huang Yongsheng, Wu Faxian, Qiu Huizuo, Li Zuopeng and Ye Qun; the army 52 percent of the Politburo and 38 percent of the Central Committee; the Military Commission''s vice-chairmen Liu Bocheng, Chen Yi, Nie Rongzhen, Xu Xiangqian, Ye Jianying and Lin; Mao at the plenum: "The problem of the localities lies in the army, and the army''s problem lies in its work," and against harsh action, for unity); [[w.chen-yi-nianpu]], 1213 (Apr. 28, 1969; Chen Yi attends the First Plenum of the Ninth Central Committee at Peking; he and the old comrades Li Fuchun, Chen Yun, Xu Xiangqian, Nie Rongzhen and Tan Zhenlin are all left out of the Politburo; the Ninth Politburo''s first meeting adopts the lists of the Military Commission and its Office Group, Chen Yi a vice-chairman of the Commission); [[w.dikotter-cultural-revolution]], 207 n.3 (Mao: the country to be ready to "fight a great war, an early war, and even a nuclear war"); [[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Apr. 28, 1969; Ye Jianying 叶剑英 elected to the Politburo at the First Plenum of the Ninth Central Committee 中共九届一中全会); [[w.chen-yun-nianpu-xiuding]], III, 168–169 (Chen Yun attends the First Plenum of the Ninth Central Committee; Mao presides and speaks: most of those who led the factories were good people, but followed Liu Shaoqi''s line, material incentives, putting profit in command, not promoting proletarian politics, bonuses and the like; some things are not yet finished and must go on, struggle, criticism, transformation for one; the plenum elects Mao chairman, Lin Biao vice-chairman, Zhou Enlai, Chen Boda and Kang Sheng to the Politburo Standing Committee, and Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Ye Qun, Li Zuopeng, Qiu Huizuo, Xie Fuzhi and others to the Politburo; for the first time since 1931 Chen Yun is left out of the Politburo). Made public: 2013 (the Politburo meeting, Mao''s speech). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 28, 1969), has Zhou propose at the Politburo''s first meeting, on Mao''s suggestion, that Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying stay vice-chairmen of the Military Commission, Wu Faxian deputy head of the Office Group, the lists announced by the Center May 27. To check: Central Committee, document of May 9, 1969 sending out Mao''s speeches of Apr. 1 and Apr. 28 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 439 n.1); [[w.zhou-enlai-nianpu-1949]], III, 305 (cited by [[w.macfarquhar-maos-last-revolution]], 298 n.70); Mao Zedong, "4.28 jianghua," copy of a handwritten transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 295 n.61); Mao Zedong, "4.28 jianghua," copy of a handwritten transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 296 n.63); *Beitiming wei zhengzhiju weiyuan de jiushiwu ren mingdan* 《被提名为政治局委员的九十五人名单》 (original 原件), Apr. 28, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.81); *Beitiming wei zhengzhiju changwei de shiba ren mingdan* 《被提名为政治局常委的十八人名单》 (original 原件), Apr. 28, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.82); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 105 n.4); [[w.dang-zheng-jun-qun-lingdao-renminglu]], 13–14 (cited by [[w.teiwes-tragedy-of-lin-biao]], 110 n.13); [[w.kau-lin-piao-affair]], xxxii (cited by [[w.teiwes-tragedy-of-lin-biao]], 128 n.47a); [[w.teiwes-provincial-leadership-in-china]], 31 (cited by [[w.teiwes-tragedy-of-lin-biao]], 128 n.47b); [[w.ke-wenhua-dageming-zhongde-renmin]], 244 (cited by [[w.teiwes-tragedy-of-lin-biao]], 128 n.47c); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXVI, 336–337 (cited by [[w.teiwes-tragedy-of-lin-biao]], 129 n.49). Names: Mao Zedong, Lin Biao, Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing.'
