  - id: cal.1969-04-07.china-leadership
    when: Apr. 7
    date: '1969-04-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao sees Zhou Fuming, head of the Peking Erqi locomotive works: factories should make more, test more; no bonus awards, which divided the workers; the cleaning of class ranks sent men to the shops, half-day study classes. Xu Xiangqian is working at the plant and is not looked down on; Mao: he has merit. The same day Mao reads the fourth draft of the Congress''s political report: Lin Biao to read it; one change on p. 24 on "bad persons or suspects found in cleaning class ranks".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 7, 1969. Made public: 2013. Names: Mao Zedong, Xu Xiangqian, Lin Biao, Zhou Fuming.'
    tags: [polity:prc, name:mao-zedong, name:xu-xiangqian, name:lin-biao, vis:only:prc]
  - id: cal.1969-04-07.china-leadership-2
    when: Apr. 7
    date: '1969-04-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on repeated factional armed fights in south-central Shanxi, writes Chen Boda, Xie Fuzhi and Wen Yucheng: Liu Geping, Zhang Riqing and Xie Zhenhua, the Shanxi revolutionary committee''s heads attending the Ninth Congress, are to telephone home on the spot to find out the facts and each to settle what his side must settle, with Zheng Weishan and Li Xuefeng to keep on with it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 285 (Apr. 7, 1969). Made public: 2020. Names: Zhou Enlai, Chen Boda, Xie Fuzhi.'
    tags: [polity:prc, name:zhou-enlai, name:chen-boda, name:xie-fuzhi, vis:only:prc]
  - id: cal.1969-04-08.china-leadership
    when: Apr. 8
    date: '1969-04-08'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai to Mao and Lin Biao, by letter: tonight he plans to meet the presidium''s members and other delegates and speak of joining the study and propaganda of Mao Zedong Thought to revolutionary practice, seeking truth from facts, and correcting the boasting, formalism, extravagance and even revival of old ways that have appeared, done for their own needs; if this is not said during the Congress, nor what is advocated and opposed, delegates will take the style home to the harm of conveying the Congress. Mao: to be talked about.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 285 (Apr. 8, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
