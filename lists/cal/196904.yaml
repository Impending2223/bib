    also: [china]
    c: 'As the Anhui 安徽 count of April 1969 has it, by Yin Shusheng''s account of the province''s files: of the over 430,000 "bad people" cleansed out by the end of 1968, 188,225 held by the dictatorship organs of county level and above; 4,646 driven to suicide in custody, 1,074 beaten to death on the spot by the mass dictatorship''s men, 359 dead of their injuries.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 600. Made public: 2011. To check: 尹曙生:〈安徽文革「清隊」檔案揭秘〉,《炎黃春秋》2011年第1期 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 600 n.23). Check: the day.'
