  - id: cal.1969-04-15.china-leadership
    when: Apr. 15–18
    date: '1969-04-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Congress presidium''s secretariat on the election of the Ninth Central Committee: sends the draft rules to the presidium; Apr. 16 the presidium passes them. Apr. 16–18 Zhou''s reports of the delegations'' nominations (421 names by the 45 delegations, perhaps 450, against 60 old Central Committee and Group members, 62 revolutionary cadres, 190 PLA, 107 workers, peasants and intellectuals) are circled.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 15–18, 1969. [[w.mao-zedong-zhuan]], VI, ch. 77 (from Apr. 15 the delegates prepare and hold the preliminary vote for the election of the Central Committee: by the presidium''s Regulations on electing the Ninth Central Committee the 45 groups nominate, the presidium''s secretariat draws up one list of candidates, after consultation and a preliminary vote a list is drawn again and put to the presidium, which makes the formal list for the Congress; Lin Biao''s and Jiang Qing''s sides contest hard for candidates, so the consultation runs on and the vote and closing intended for Apr. 21 cannot be held; the book gives neither Mao''s meeting nor the count of nominations). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 77). Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
