    also: [vietnam-hanoi, vietnam, soviet-union]
    c: 'Zhou Enlai''s third talk with Phạm Hùng and Hoàng Văn Thái, Kang Sheng present, 12:30 p.m., on the international situation. Zhou: Nixon, stubborn in neocolonialism in South Vietnam, is helped by the Soviets, in the Middle East, with Syria and the Arab states, in Czechoslovakia and in drawing Mongolia into the Warsaw Pact. Kang Sheng: the 6,000 Vietnamese students in China would make ten combat units; the large battles the Chinese urged after Nguyễn Văn Linh''s report are not feasible, so hold to independence and self-reliance in a protracted war.'
    n: '[[w.zhou-enlai-waijiao-huodong]], 535 (Apr. 21, 1969; 12:30 p.m., the third talks, on the international situation and the U.S.–Soviet strategy for the world, the Vietnamese side to hold to independence and self-reliance); [[w.77-conversations-between-chinese]], [154–156](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=152) (doc. 40, headed Beijing, Apr. 12, 1969, Zhou''s and Kang Sheng''s comments to a COSVN delegation, no hour: Nixon''s neocolonialism; Mao''s words to Hồ that the U.S. troops will not leave until defeated; Hoàng Văn Thái on the weapons; the Soviet and U.S. six-point plans for the Middle East, Syria, Algeria and Morocco, Czechoslovakia, Mongolia; 154 n.215, COSVN); [[w.77-conversations-between-chinese]], [157](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=155) (doc. 41, the talk headed Apr. 21: Kang Sheng on the 6,000 students and trainees as ten combat units). Made public: 1993. Check: doc. 40 is headed Apr. 12, and Nguyen Vu Tung''s essay (57 n.87) cites it so; taken here as the talk of Apr. 21: no chronology the calendar holds has a talk on Apr. 12; the matter the chronology gives this talk, the international situation and self-reliance, is doc. 40''s; Zhou speaks of what Hoàng Văn Thái has said; and Kang Sheng''s proposal on the 6,000 students is in doc. 40 and in doc. 41 under Apr. 21. See [[cal.1969-04-20.china-leadership]]. Names: Zhou Enlai, Kang Sheng, Phạm Hùng, Hoàng Văn Thái, Nixon, Nguyễn Văn Linh.'
