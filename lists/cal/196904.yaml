    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: The Ninth Congress closes, 4–9:50 p.m., Lin Biao presiding, Mao present. The 1,510 delegates elect 170 members and 109 alternates to the Central Committee, of whom only 53 are of the Eighth. At 10 p.m. Mao meets Zhou Enlai and others in Hall 118.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 24, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 288 (Apr. 24, 1969); [[w.macfarquhar-maos-last-revolution]], 292–293 (the plenary, Lin Biao in the chair, elects 170 members and 109 alternates; of the 279, 53 carried over from the old Central Committee; the wives of Mao, Lin Biao, Zhou Enlai and Kang Sheng among the new; 99 PLA members, over 35 percent); [[w.macfarquhar-maos-last-revolution]], 293–294 (only Mao and Wang Baidan, an unknown steelworker of thirty-four from Harbin, get all 1,510 votes; Zhou 1,509 and Lin Biao 1,508, each crossing out his own name; Ye Qun crosses out Lin''s; Jiang Qing 1,502); [[w.macfarquhar-maos-last-revolution]], 294 (the old comrades'' votes: Zhu De 809, Chen Yun 815, Deng Zihui 827, Chen Yi 867, Ye Jianying 821, Xu Xiangqian 808, Nie Rongzhen 838, Li Fuchun 886, Li Xiannian 922; Zhang Dingcheng 1,099); [[w.macfarquhar-maos-last-revolution]], 294–295 (Liu Jieting elected a member with 1,435 votes, his wife Zhang Xiting an alternate with 1,400; Nie Yuanzi an alternate with 937); [[w.mao-zedong-zhuan]], VI, ch. 77 (the day after the meeting of Apr. 23 the Congress holds its third plenary session; by secret ballot with candidates equal in number to places it elects the Ninth Central Committee and then closes; the book gives neither the hours nor the number of delegates or votes nor the meeting with Zhou Enlai afterward). [[w.yang-jisheng-tiandi-fanfu]], II, 722–723, 725 (the afternoon, the third and last plenary session, for the vote; seven zones each with a box, and one on the platform; 1,510 present, 2 on leave; two ballots; Mao every vote, Lin Biao 1,508, Zhou Enlai 1,509, Jiang Qing 1,502; Zhu De 809, Chen Yun 815, Li Fuchun 886, Chen Yi 867, Xu Xiangqian 808, Nie Rongzhen 838, Ye Jianying 821, Deng Zihui 827, Li Xiannian 922, Zhang Dingcheng 1,099; 170 members and 109 alternates, 53 of them of the Eighth''s 167 living; at the close young delegates seize the leaders'' cups, pencils and papers); [[w.jian-zhou-enlai]], 594 (Mao elected to the Central Committee unanimously; Lin and Zhou each two votes short, likely their own and their wives''); [[w.chen-yi-nianpu]], 1213 (Apr. 1969; Chen Yi elected a member of the Central Committee); [[w.dikotter-cultural-revolution]], 207–208 n.5, 219 (the 1,500 delegates asked to elect a Central Committee from a list equal to the seats, each elected unless crossed out by more than half; over a third from the army, navy and air force; Jiang Qing and the wives of Kang Sheng, Lin Biao and Zhou Enlai among the members; among those elected Chen Yonggui of Dazhai, an illiterate villager in his white terrycloth turban); [[w.liu-jixian-ye-jianying-nianpu]], II, 982 (Ye Jianying 叶剑英 elected to the Ninth Central Committee); [[w.chen-yun-nianpu-xiuding]], III, 168 (the Congress elects a new Central Committee, of whose members fewer than a fifth were members or alternates of the Eighth; Chen Yun is still elected a member). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 287–288 (Apr. 24, 1969), has Zhou speak at the closing session. To check: [[w.jiuda-ziliao-huibian]], 44 (cited by [[w.macfarquhar-maos-last-revolution]], 293 n.48a); [[w.ke-wenhua-dageming-zhongde-renmin]], 111 (cited by [[w.macfarquhar-maos-last-revolution]], 293 n.48b); [[w.macfarquhar-succession-to-mao-and-1997]], 250 n.5 (cited by [[w.macfarquhar-maos-last-revolution]], 293 n.48c); [[w.zehou-zhonggong-jiuda-neimu-suoyi]], 49 (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.51a); [[w.meizhou-wenzhai]], no. 41 (Oct. 7, 1992) (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.51b); [[w.zhou-enlai-nianpu-1949]], III, 291 (cited by [[w.macfarquhar-maos-last-revolution]], 294 n.53a); [[w.yuanzi-nie-yuanzi-huiyilu]], 320–321, 331–336 (cited by [[w.macfarquhar-maos-last-revolution]], 295 n.58a); Wang Wenyao 王文耀 and Wang Baochun 王保春, *Wenge qianhou shiqi de Chen Boda* 《文革前後時期的陳伯達》 (Tiandi tushu, Hong Kong, 2014), 143–144 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 723 n.20); [[w.qiu-huizuo-huiyilu]], II, 646–647 (cited by [[w.jian-zhou-enlai]], 594 n.7). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
