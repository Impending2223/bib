  - id: cal.1969-04-03.china-leadership
    when: Apr. 3
    date: '1969-04-03'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: the General Staff Operations Department reports Soviet frontier guards shelling Zhenbao at dawn, with Zhou Enlai''s plan: leave the Soviet post''s calls unanswered, wait for several days'' shelling, then strike once hard and issue a protest. Mao: "all right".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 3, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 285 (Apr. 3, 1969; Zhou''s letter and Mao''s reply). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    src:
      c: 49deb98f
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 3, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 285: A, B'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-04.china
    when: Apr. 4
    date: '1969-04-04'
    thread: china
    also: [japan]
    c: The representatives of China's and Japan's memorandum-trade offices sign the communique of their talks at Beijing. Both sides reaffirm the three political principles and the inseparability of politics and economics, confirmed in 1968, as the principles to keep in relations and the political basis between the offices. China says the liberation of Taiwan is China's internal affair, and the Chinese people will liberate it; Japan agrees; Japan also states plainly that the PRC government is the sole legal government of the Chinese people, that Taiwan is an inseparable part of China, and that normal relations must rest on that and oppose every "two Chinas" plot. They agree the 1969 memorandum trade.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 212–213 (Apr. 4, 1969).'
    src:
      c: 15e6d7a3
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 212–213: all'
    tags: [polity:prc, polity:japan]
  - id: cal.1969-04-05.china-leadership
    when: Apr. 5
    date: '1969-04-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the Zhongnanhai clinic''s report on Tao Zhu''s illness, notes: he proposes to agree to send him to the 302 Hospital for secret treatment, for Mao to approve; he learned how serious Tao''s illness is only from the Guard Bureau''s report of Apr. 3, and, on asking, this report was sent.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 285 (Apr. 5, 1969). Made public: 2020. Names: Zhou Enlai, Tao Zhu, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:tao-zhu, name:mao-zedong, vis:only:prc]
