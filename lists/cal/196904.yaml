list: cal
section: CXIV
entries:
  - id: cal.1969-04-01.china-leadership
    when: Apr. 1
    date: '1969-04-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Ninth National Congress of the Chinese Communist Party opens in the Great Hall, Peking, Apr. 1–24: 1,512 delegates for 22 million members. Mao is elected chairman of the presidium, Lin Biao vice-chairman, Zhou Enlai secretary-general; the agenda: Lin''s political report, the constitution, election of a Central Committee. Mao presides and speaks: the people''s political histories now clear; he hopes for a united congress and then for greater victories.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai]
  - id: cal.1969-04-03.china-leadership
    when: Apr. 3
    date: '1969-04-03'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: the General Staff Operations Department reports Soviet frontier guards shelling Zhenbao at dawn, with Zhou Enlai''s plan: leave the Soviet post''s calls unanswered, wait for several days'' shelling, then strike once hard and issue a protest. Mao: "all right".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 3, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-07.china-leadership
    when: Apr. 7
    date: '1969-04-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao sees Zhou Fuming, head of the Peking Erqi locomotive works: factories should make more, test more; no bonus awards, which divided the workers; the cleaning of class ranks sent men to the shops, half-day study classes. Xu Xiangqian is working at the plant and is not looked down on; Mao: he has merit. The same day Mao reads the fourth draft of the Congress''s political report: Lin Biao to read it; one change on p. 24 on "bad persons or suspects found in cleaning class ranks".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 7, 1969. Made public: 2013. Names: Mao Zedong, Xu Xiangqian, Lin Biao, Zhou Fuming.'
    tags: [polity:prc, name:mao-zedong, name:xu-xiangqian, name:lin-biao, vis:only:prc]
  - id: cal.1969-04-11.china-leadership
    when: Apr. 11
    date: '1969-04-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, with the Congress secretariat and the group convenors: add to the political report on the democratic parties and the united front; the report and constitution to be passed in principle Apr. 14 and not published; the Central Committee list from below; old comrades to be elected (Zhu De, Chen Yun, Deng Zihui, Zhang Dingcheng, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi); no widening of the targets of attack.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 11, 1969. Made public: 2013. Names: Mao Zedong, Zhu De, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi, Chen Yun, Deng Zihui, Zhang Dingcheng.'
    tags: [polity:prc, name:mao-zedong, name:zhu-de, name:ye-jianying, name:xu-xiangqian, name:nie-rongzhen, name:li-fuchun, name:li-xiannian, name:chen-yi, vis:only:prc, name:chen-yun]
  - id: cal.1969-04-13.china-leadership
    when: Apr. 13
    date: '1969-04-13'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group, the Office Group and the Congress convenors on the next day''s speeches: Zhou Enlai, Chen Boda, Kang Sheng and Huang Yongsheng, then Wang Hongwen for the workers, Chen Yonggui for the peasants, Wei Fengying for women, Sun Yuguo for the army, Ji Dengkui for cadres; old comrades still sit in front; the Cultural Revolution brought both anarchy and killers who used it; the former are not the main thing.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 13, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wang Hongwen, Chen Yonggui, Wei Fengying, Sun Yuguo, Ji Dengkui.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:huang-yongsheng, vis:only:prc]
  - id: cal.1969-04-14.china-leadership
    when: Apr. 14
    date: '1969-04-14'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao at the Ninth Congress plenary, afternoon: it passes the political report and the Party constitution (the constitution drops members'' rights and writes Lin Biao in as Mao''s successor) and gives both to the secretariat for editing before publication. Mao in his speech praises the frontier troops at Zhenbao, with poor arms and brave, and says the "superstition" has been broken.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969. Made public: 2013 (Mao''s speech). To check: the Congress''s records; the political report and constitution as adopted (cited by [[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969). Names: Mao Zedong, Lin Biao. Check: the presidium secretariat''s press communique of the day (the report and constitution passed).'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, vis:only:prc@B]
  - id: cal.1969-04-15.china-leadership
    when: Apr. 15–18
    date: '1969-04-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Congress presidium''s secretariat on the election of the Ninth Central Committee: sends the draft rules to the presidium; Apr. 16 the presidium passes them. Apr. 16–18 Zhou''s reports of the delegations'' nominations (421 names by the 45 delegations, perhaps 450, against 60 old Central Committee and Group members, 62 revolutionary cadres, 190 PLA, 107 workers, peasants and intellectuals) are circled.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 15–18, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-22.soviet-union-leadership
    when: Apr. 22–26
    date: '1969-04-22'
    thread: soviet-union-leadership
    c: Moscow. The Council for Mutual Economic Assistance's session, Brezhnev heading the Soviet delegation. He meets the delegations of Czechoslovakia, Romania, Poland, Bulgaria and the GDR at Vnukovo, Apr. 22, and the heads of the delegations of Bulgaria, Czechoslovakia, the GDR, Hungary, Mongolia, Poland and Romania at the reception house Apr. 23, 9 a.m., and opens the session at 10; the session to Apr. 26; a reception Apr. 26, 2 to 4.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332–333 (Apr. 22–26). Names: Brezhnev.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:czechoslovakia, polity:hungary, polity:bulgaria, polity:mongolia]
  - id: cal.1969-04-22.china-leadership
    when: Apr. 22
    date: '1969-04-22'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, evening, Hall 118: with Zhou Enlai and others, the preliminary list of the Ninth Central Committee.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 22, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-23.china-leadership
    when: Apr. 23
    date: '1969-04-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao chairs the enlarged presidium of the Ninth Congress and speaks on the preliminary list of Central Committee members and alternates, which it adopts: many good not on it, not all on it good; the majority new, only 53 of the Eighth''s old members, under a fifth; workers and peasants raised in number, who must not leave production or the masses, or in a year they collapse.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-04-24.soviet-union-leadership
    when: Apr. 24
    date: '1969-04-24'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with Husák, the Czechoslovak party''s new First Secretary, in Moscow for the Council''s session: Apr. 22, with Černík, Kosygin and Podgorny; Apr. 24, in Brezhnev''s office, 6 to 11 p.m.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332 (Apr. 22, 24). Names: Brezhnev, Husák. Check: Husák became First Secretary of the Czechoslovak party Apr. 17; the record names no one else present.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia, name:kosygin-aleksei, name:podgorny-nikolai-v]
  - id: cal.1969-04-24.china-leadership
    when: Apr. 24
    date: '1969-04-24'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: The Ninth Congress closes, 4–9:50 p.m., Lin Biao presiding, Mao present. The 1,510 delegates elect 170 members and 109 alternates to the Central Committee, of whom only 53 are of the Eighth. At 10 p.m. Mao meets Zhou Enlai and others in Hall 118.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 24, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai]
  - id: cal.1969-04-25.soviet-union-leadership
    when: Apr. 25
    date: '1969-04-25'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Ceaușescu, head of the Romanian delegation to the Council's session, 8 to 10 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 332 (Apr. 25). Names: Brezhnev, Ceaușescu.'
    tags: [name:brezhnev-leonid, name:ceausescu-nicolae, polity:ussr, polity:romania]
  - id: cal.1969-04-26.china-leadership
    when: Apr. 26
    date: '1969-04-26'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, evening, with Zhou Enlai and others: the preparatory meeting of the First Plenum of the Ninth Central Committee to be held Apr. 27, naming candidates for the new Politburo and its Standing Committee by secret ballot; the seven briefing proofs (show delegations'' unhappiness that Cultural Revolution Group members did not get unanimous votes, while Wang Jiaxiang and Hu Yaobang got one each) not to be printed lest they press the Committee.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Wang Jiaxiang, Hu Yaobang.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-28.soviet-union-leadership
    when: Apr. 28
    date: '1969-04-28'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives the Korean delegation led by Pak Song-chol, 3 to 6 p.m., Rusakov and Gromyko taking part.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 333 (Apr. 28). Names: Brezhnev, Pak Song-chol, Rusakov, Gromyko.'
    tags: [name:brezhnev-leonid, name:gromyko-andrei, polity:ussr, polity:czechoslovakia, polity:dprk]
  - id: cal.1969-04-28.china-leadership
    when: Apr. 28
    date: '1969-04-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao presides over the First Plenum of the Ninth Central Committee, 4 p.m. It elects a Politburo of 21: Mao, Lin Biao, then in stroke order Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi; alternates Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing. Mao chairman, Lin vice-chairman; the Standing Committee Mao, Lin, Chen Boda, Zhou, Kang Sheng. In the first Politburo meeting Mao has the Military Commission named: chairman himself, vice-chairmen Lin, Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ye Jianying, the Office Group under Huang Yongsheng. Mao speaks to the plenum on unity, on continuing socialist revolution and "struggle, criticize, reform".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 28, 1969. Made public: 2013 (the Politburo meeting, Mao''s speech). Names: Mao Zedong, Lin Biao, Ye Qun, Ye Jianying, Liu Bocheng, Jiang Qing, Zhu De, Xu Shiyou, Chen Boda, Chen Xilian, Li Xiannian, Li Zuopeng, Wu Faxian, Zhang Chunqiao, Qiu Huizuo, Zhou Enlai, Yao Wenyuan, Kang Sheng, Huang Yongsheng, Dong Biwu, Xie Fuzhi, Chen Yi, Xu Xiangqian, Nie Rongzhen, Ji Dengkui, Li Xuefeng, Li Desheng, Wang Dongxing.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:ye-qun, name:ye-jianying, name:liu-bocheng, name:jiang-qing, name:zhu-de, name:xu-shiyou, name:chen-boda, name:chen-xilian, name:li-xiannian, name:li-zuopeng, name:wu-faxian, name:zhang-chunqiao, name:qiu-huizuo, name:zhou-enlai, name:yao-wenyuan, name:kang-sheng, name:huang-yongsheng, name:dong-biwu, name:xie-fuzhi, name:chen-yi, name:xu-xiangqian, name:nie-rongzhen, vis:only:prc@F-G]
