  - id: cal.1969-04-11.china-leadership
    when: Apr. 11
    date: '1969-04-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, with the Congress secretariat and the group convenors: add to the political report on the democratic parties and the united front; the report and constitution to be passed in principle Apr. 14 and not published; the Central Committee list from below; old comrades to be elected (Zhu De, Chen Yun, Deng Zihui, Zhang Dingcheng, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi); no widening of the targets of attack.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 11, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 285–286 (Apr. 11, 1969; Zhou at the meeting). Made public: 2013. Names: Mao Zedong, Zhu De, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Li Fuchun, Li Xiannian, Chen Yi, Chen Yun, Deng Zihui, Zhang Dingcheng.'
    src:
      c: ad7bc280
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 11, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 285–286: D, E'
    tags: [polity:prc, name:mao-zedong, name:zhu-de, name:ye-jianying, name:xu-xiangqian, name:nie-rongzhen, name:li-fuchun, name:li-xiannian, name:chen-yi, vis:only:prc, name:chen-yun]
  - id: cal.1969-04-12.china-leadership
    when: Apr. 12
    date: '1969-04-12'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai calls the military control commissions and production heads of the National Defense Industry Office and the Ministries of Metallurgy and the First, Third and Seventh Machine Building and sharply criticizes the repeated quality accidents in aircraft production that followed the abolition of reasonable rules: aircraft accidents hurt war preparation, aid abroad and safety; "you came from the Air Force, how can you be so careless of comrades'' lives?" Plant 410 abolished its inspection system, and they must be told at once to restore it, not "gradually"; unreasonable rules are to be changed and reasonable ones kept, abolishing all is not Mao Zedong Thought and not respect for science, and some who want to smash every system hold an ultra-left trend. The northwest, southwest and northeast are to be inspected. Over twenty years Mao''s red line has been the main thing and all is not to be denied, or industry could not have grown.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 12, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-04-13.china-leadership
    when: Apr. 13
    date: '1969-04-13'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group, the Office Group and the Congress convenors on the next day''s speeches: Zhou Enlai, Chen Boda, Kang Sheng and Huang Yongsheng, then Wang Hongwen for the workers, Chen Yonggui for the peasants, Wei Fengying for women, Sun Yuguo for the army, Ji Dengkui for cadres; old comrades still sit in front; the Cultural Revolution brought both anarchy and killers who used it; the former are not the main thing.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 13, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 13, 1969; the meeting and Mao''s word on the old comrades). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 286 (Apr. 13, 1969), has Zhou asking Mao whether the old comrades still sit in front, and Wang Hongwen cutting in that he is not much inclined to elect them. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wang Hongwen, Chen Yonggui, Wei Fengying, Sun Yuguo, Ji Dengkui.'
    src:
      c: b1c4c644
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 13, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 286: A, B'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:huang-yongsheng, vis:only:prc]
  - id: cal.1969-04-14.china-leadership
    when: Apr. 14
    date: '1969-04-14'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Mao at the Ninth Congress plenary, afternoon: it passes the political report and the Party constitution (the constitution drops members'' rights and writes Lin Biao in as Mao''s successor) and gives both to the secretariat for editing before publication. Mao in his speech praises the frontier troops at Zhenbao, with poor arms and brave, and says the "superstition" has been broken.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 286–287 (Apr. 14, 1969; the plenary). Made public: 2013 (Mao''s speech). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 286–287 (Apr. 14, 1969), has Zhou speak at the plenary: full support for Mao''s opening speech, Lin Biao''s report and the new constitution, Lin''s merits before and after 1949 and above all in the Cultural Revolution, and so the rightness of Lin as Mao''s successor. To check: the Congress''s records; the political report and constitution as adopted (cited by [[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969). Names: Mao Zedong, Lin Biao. Check: the presidium secretariat''s press communique of the day (the report and constitution passed).'
    src:
      c: f6878521
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Apr. 14, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 286–287: A'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, vis:only:prc@B]
  - id: cal.1969-04-15.china-leadership
    when: Apr. 15–18
    date: '1969-04-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Congress presidium''s secretariat on the election of the Ninth Central Committee: sends the draft rules to the presidium; Apr. 16 the presidium passes them. Apr. 16–18 Zhou''s reports of the delegations'' nominations (421 names by the 45 delegations, perhaps 450, against 60 old Central Committee and Group members, 62 revolutionary cadres, 190 PLA, 107 workers, peasants and intellectuals) are circled.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 15–18, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-04-15.china-leadership-2
    when: Apr. 15
    date: '1969-04-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai drafts the "Regulations (draft) on the Ninth Congress's election of the Ninth Central Committee", covering the provisional number of members, the range of candidates and the election procedure; Mao approves them. From Apr. 15 to 24 the Congress begins to sound out the new Central Committee.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 15, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-04-16.china-leadership
    when: Apr. 16
    date: '1969-04-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai presides over the enlarged presidium meeting of the Ninth Congress, explains the Regulations as Mao approved them and sets the schedule of election work. He also asks every province, municipality, region and unit to check how it has gone about spreading Mao Zedong Thought and to watch certain things: much that is formalism, and dancing and singing that has become unserious, without rhythm, only enthusiasm.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 16, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-04-20.china-leadership
    when: Apr. 20, 21
    date: '1969-04-20'
    thread: china-leadership
    also: [vietnam-hanoi, vietnam]
    c: 'Zhou Enlai talks with the Vietnamese guests Phạm Hùng and Hoàng Văn Thái: in any work at any time there are shortcomings, and what matters is to sum up experience and find the rules. On Apr. 21 he talks with them again on the international situation and stresses the policy of independence and self-reliance.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 20, 1969); [[w.zhou-enlai-waijiao-huodong]], 535 (Apr. 20–21, 1969; Apr. 20, 11:30 a.m. and 7 p.m., the talks with Vietnam''s Phạm Hùng and Hoàng Văn Thái (黄文泰) in the Great Hall of the People, the book giving no content; Apr. 21, 12:30 p.m., the third talks, on the international situation and the U.S.–Soviet strategy for the world, the Vietnamese side to hold to independence and self-reliance). Made public: 1993. Names: Zhou Enlai, Hoàng Văn Thái.'
    src:
