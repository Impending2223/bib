    c: 'The three-man group sends up its first list of Politburo members, 23 names: Mao Zedong, Lin Biao, Zhou Enlai, Dong Biwu, Zhu De, Liu Bocheng, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Li Zuopeng, Qiu Huizuo, Xu Shiyou, Chen Xilian, Wang Dongxing 汪東興, Ye Jianying, Xie Fuzhi, Li Xiannian, Li Xuefeng 李雪峰, Wang Xiaoyu 王效禹.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 728; [[w.teiwes-tragedy-of-lin-biao]], 13 (before the Congress Mao had said Jiang Qing should not be on the Politburo; the three-man group, not believing him serious, puts both Jiang Qing and Ye Qun on the list). Made public: 2016. To check: [[w.yunsheng-maojiawan-jishi]], 247–255 (cited by [[w.teiwes-tragedy-of-lin-biao]], 13 n.10a); [[w.weixun-wo-suo-zhidaode-ye]], 220–221 (cited by [[w.teiwes-tragedy-of-lin-biao]], 13 n.10b). Names: Mao Zedong, Lin Biao, Zhou Enlai, Dong Biwu, Zhu De, Liu Bocheng, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Huang Yongsheng, Wu Faxian, Li Zuopeng, Qiu Huizuo, Xu Shiyou, Chen Xilian, Ye Jianying, Xie Fuzhi, Li Xiannian.'
