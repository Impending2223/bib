  - id: cal.1969-04-09.china-leadership-2
    when: Apr. 9
    date: '1969-04-09'
    thread: china-leadership
    c: 'Mao 毛泽东, on the draft Constitution of the Party sent for review by Kang Sheng 康生 Apr. 9, 1969, five days before its adoption by the Ninth Congress: he adds three characters on p. 7, so that the clause reads ''a number of necessary lean organs are set up''; and he changes in the draft of Oct. 12, 1968 and of Apr. 9, 1969 the places printed in his type in the book.'
