  - id: cal.1969-04-23.china-leadership
    when: Apr. 23
    date: '1969-04-23'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao chairs the enlarged presidium of the Ninth Congress and speaks on the preliminary list of Central Committee members and alternates, which it adopts: many good not on it, not all on it good; the majority new, only 53 of the Eighth''s old members, under a fifth; workers and peasants raised in number, who must not leave production or the masses, or in a year they collapse.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 23, 1969; the meeting and the list). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 23, 1969), has Zhou speak at the meeting: old comrades who erred and mended slowly are to be treated by "criticize one, protect two, watch three", allowed to correct their errors and elected to the Central Committee. Names: Mao Zedong.'
    src:
