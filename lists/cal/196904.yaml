    c: 'The Politburo''s resolution no. 187-NQ/TW on the four great anniversaries of 1970: the Party''s 40th (Feb. 3), Lenin''s centenary (Apr. 22), Hồ Chí Minh''s 80th birthday (May 19) and the DRV''s 25th (Sept. 2). Aims: teaching Marxism–Leninism, the Party''s line and Hồ''s ethics; emulation in production and combat. A drive from mid-1969 to the end of 1970, begun in late June: the leaders'' articles, a book of Hồ''s pieces, a short 40-year Party history, two large exhibitions, a "class of 1970" of new members; the Secretariat to issue a directive on each day.'
