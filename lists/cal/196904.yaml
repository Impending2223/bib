    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 405–406, 411 (Apr. 7, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Names: Mao Zedong, Lin Biao, Zhang Chunqiao, Yao Wenyuan.'
