    c: 'Mao chairs the enlarged presidium of the Ninth Congress and speaks on the preliminary list of Central Committee members and alternates, which it adopts: many good not on it, not all on it good; the majority new, only 53 of the Eighth''s old members, under a fifth; workers and peasants raised in number, who must not leave production or the masses, or in a year they collapse.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 23, 1969; the meeting and the list); [[w.jianguo-yilai-mao-zedong]], XIX, 428 (Apr. 23, 1969; Mao''s words at the enlarged presidium on the grass-roots cadres newly elected to the Central Committee: ''Take care that they do not leave the masses, do not leave production, and also work''; printed from the *Renmin ribao* of Nov. 20, 1969, which quotes them in its editorial ''Keep the cadres taking part in collective productive labor''); [[w.macfarquhar-maos-last-revolution]], 293 (after complaints from PLA delegates of Hebei, Shanxi, Inner Mongolia, Peking and Tianjin, Mao: some provinces are more fully represented than others, but "we''re getting rid of Liu Shaoqi and his crowd"; not all those elected are ideal, and many good comrades are not); [[w.macfarquhar-maos-last-revolution]], 293 n.50 (Mao asks the group conveners whether the procedure was "fair" and, getting no answer, says it was "on the whole" fair); [[w.deng-xiaoping-nianpu-1904]], III, 1947 (Apr. 23, 1969; the nianpu: Mao, explaining the preliminary list to the enlarged presidium, says among other things that Deng Xiaoping and Liu Shaoqi must be told apart); [[w.mao-zedong-zhuan]], VI, ch. 77 n.80 (Apr. 23 Mao calls the members of the Cultural Revolution Group''s liaison meeting, of the Military Commission''s Office Group and the group convenors; five names are added, 279 in all, 170 members and 109 alternates, as the formal candidates; Mao: ''make it clear: many good ones are not on the list, those on it are not all good''; most are on the Committee for the first time, only 53 of the Eighth Congress''s old ones, the new over two hundred, not one in five; industrial workers and peasants are more, mind that they do not leave production, if they do they are like us; the book does not give that they would collapse in a year or that the enlarged presidium was in the chair, n.80). [[w.yang-jisheng-tiandi-fanfu]], II, 724 (Mao tells the delegates that the men are to be elected the next day). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 287 (Apr. 23, 1969), has Zhou speak at the meeting: old comrades who erred and mended slowly are to be treated by "criticize one, protect two, watch three", allowed to correct their errors and elected to the Central Committee. Check: the note (293 n.50) has this from the transcript of Mao''s reception of some delegates on the afternoon of Apr. 23; whether the same meeting. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.jiuda-ziliao-huibian]], 44 (cited by [[w.macfarquhar-maos-last-revolution]], 293 n.49); "Zhuxi 69.4.23 xiawu jiejian bufen daibiao," copy of a handwritten transcript in the Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 293 n.50b); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会, of the Military Commission''s Office Group 军委办事组 and the group convenors of the Ninth Congress (record 谈话记录), Apr. 23, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.80). Names: Mao Zedong.'
