  - id: cal.1969-04-01.china-leadership
    when: Apr. 1
    date: '1969-04-01'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Ninth National Congress of the Chinese Communist Party opens in the Great Hall, Peking, Apr. 1–24: 1,512 delegates for 22 million members. Mao is elected chairman of the presidium, Lin Biao vice-chairman, Zhou Enlai secretary-general; the agenda: Lin''s political report, the constitution, election of a Central Committee. Mao presides and speaks: the people''s political histories now clear; he hopes for a united congress and then for greater victories.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 1, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 284 (Apr. 1, 1969); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Apr. 1–24, 1969; the book says the Ninth Congress of the Chinese Communist Party meets at Peking; Lin Biao''s political report affirms the "theory of continuing revolution under the dictatorship of the proletariat" as the guiding thought of socialist revolution and the theoretical basis of the "Cultural Revolution," and so legitimizes the Cultural Revolution''s wrong theory and practice; the congress elects a new central leadership into which many close friends and followers of Lin Biao and Jiang Qing enter the Central Committee); [[w.jianguo-yilai-mao-zedong]], XIX, 416–423 (Apr. 1, 1969; Mao''s speech at the opening of the Ninth Congress, printed from the Center''s document, which the Center sent out May 9, 1969 with his speech of Apr. 28 at the First Plenum, for reading to the revolutionary committee members of factories, communes, schools and offices and army cadres of platoon level and above; he says of the first congress of 1921 that twelve delegates attended and that of them only he and Dong Biwu remain; he names Wang Jinmei, Deng Enming, Chen Tanqiu, He Shuheng and Li Hanjun as martyrs and Chen Gongbo, Zhou Fohai, Zhang Guotao and Liu Renjing as traitors, Li Da dead two years; and that of the Party''s early leaders Qu Qiubai, Li Lisan and Wang Ming erred, and that the political histories of Liu Shaoqi, Peng Zhen and Bo Yibo were unclear and are clear now); [[w.macfarquhar-maos-last-revolution]], 287 (1,512 delegates, Apr. 1–24, notionally for 22 million members, chosen by discussion, not election, some not Party members); [[w.macfarquhar-maos-last-revolution]], 287–288 (the oldest delegate Dong Biwu, eighty-three, a founder of the Party with Mao; the youngest a Red Guard of nineteen; 422 delegates, 28 percent, for the armed forces); [[w.macfarquhar-maos-last-revolution]], 288 (the congress not announced in advance; no foreign guests; reporters held back; the delegates kept incommunicado); [[w.macfarquhar-maos-last-revolution]], 285, 288 (Mao''s opening address: "a congress of unity and a congress of victory"; the job of the Cultural Revolution "not yet finished"); [[w.macfarquhar-maos-last-revolution]], 289 (Lin Biao, who had no part in the report and never read it through, though Mao asked him to, reads it on the opening day); [[w.deng-xiaoping-nianpu-1904]], III, 1947 (Apr. 1–24, 1969; the nianpu: Lin Biao gives the political report for the Central Committee; many of the Eighth Central Committee''s members, Politburo members and Standing Committee members, Deng Xiaoping among them, and a large body of former chief leaders of the provinces and central organs, are shut out of the Congress); [[w.mao-zedong-zhuan]], VI, ch. 77 n.75 (Apr. 1 the Ninth Congress opens in Peking under Mao''s chairmanship; Mao: ''I hope our congress will go well, will be a united congress, a victorious one''; after the Eighth Congress things are now pretty clear in political line, organizational line and thought, so a united congress and, on that ground, victory, and after it greater victory in the whole country; Lin Biao 林彪 then gives the Central Committee''s political report, in eight parts (the preparation of the Cultural Revolution; its course; doing struggle, criticism and reform well; its policies; the final victory of our revolution; the consolidation and building of the Party; relations of our country with foreign countries; the whole Party and people to unite for greater victory); the book dates the Congress Apr. 1–24, in two stages, Apr. 1–14 the report and the constitution, Apr. 15–24 the election, with three plenary sessions; no figure of delegates or members, n.75). Check: [[w.macfarquhar-maos-last-revolution]], 285, gives the words "not yet finished" as from one of Mao''s speeches at the congress; its note (285 n.3) cites the page (4) of the "Jiuda" ziliao huibian it cites (289 n.19) for the opening address. To check: Central Committee, document of May 9, 1969 sending out Mao Zedong''s speech at the opening of the Ninth Congress and his speech of Apr. 28 at the First Plenum of the Ninth Central Committee, to be read to the members of revolutionary committees of factories, communes, schools and offices and to army cadres of platoon level and above (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 417 n.1); [[w.zhou-enlai-nianpu-1949]], III, 284, 285, 288 (cited by [[w.macfarquhar-maos-last-revolution]], 287 n.13); [[w.nianyi-da-dongluande-niandai]], 320 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.14a); [[w.jiuda-ziliao-huibian]], 44 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.15); [[w.xuan-wenhua-dageming-jianshi]], 202–203 (cited by [[w.macfarquhar-maos-last-revolution]], 288 n.16); [[w.zedong-jianguo-yilai-mao-zedong]], XIII, 11–13 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.25); [[w.yunsheng-maojiawan-jishi]], 209–215 (cited by [[w.macfarquhar-maos-last-revolution]], 289 n.26); Mao Zedong 毛泽东, speech at the opening of the Ninth National Congress of the Chinese Communist Party 中共九大 (record 讲话记录), Apr. 1, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.75). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
