  - id: cal.1961-11-02.cuba
    when: Nov. 2
    date: '1961-11-02'
    thread: cuba
    c: 'Goodwin to the President and the Attorney General, "eyes only": a suggested organization for what became Mongoose, five "staff components," among them "intelligence collection," "guerrilla and underground" and "propaganda." "As for propaganda, I thought we might ask Tad Szulc to take a leave of absence from the *Times* and work on this one—although we should check with [USIA Director] Ed Murrow and Dick Bissell."'
    n: '[[w.sen-church-alleged-assassination-plots]], 138 n.2 (Memo, Goodwin to the President and the Attorney General, Nov. 2, 1961, 2). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memo, Goodwin to the President and the Attorney General, Nov. 2, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 138 n.2). See [[cal.1961-11-01.cuba]]. Names: Goodwin, Szulc, Murrow, Bissell.'
    tags: [name:goodwin-richard-n, name:szulc-tad, name:murrow-edward-r, name:bissell-richard-m-jr]
