  - id: cal.1961-11-06.china-leadership
    when: Nov. 6–10
    date: '1961-11-06'
    thread: china-leadership
    also: [farm]
    c: 'At the Center''s bureau first secretaries'' meeting, Nov. 6, 7, 8 and 10. On the 8th Zhou Enlai drafts "Some views on grain work": purchase, transfer and imports all risk falling short; Party committees at every level to push purchase and shipping, go on cutting town population and staff, tightly manage the free market, and aim at imports of 3 to 4 million tons next year, exporting first and selling at home after, with imports of grain before other goods. On the 10th the meeting takes up grain alone.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 441 (Nov. 6, 1961); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Nov. 6–10, 1961; Liu presides at the meeting of the first secretaries of the Central Committee''s bureaus on the system of the people''s communes, the market and grain); [[w.yang-shangkun-riji]], II, 87 (Nov. 6, 1961; the West Building, 3 to 6:30 p.m., Liu Shaoqi presiding: the Politburo, the Secretariat and the six regional bureaus'' secretaries on the team as the basis, the six bureaus reporting); [[w.deng-xiaoping-nianpu-1904]], III, 1669–1670 (Nov. 6, 7, 8 and 10, 1961; Deng at the bureaus'' first secretaries'' meeting, Liu presiding. Nov. 7: all regions favor accounting at the small team and full contracts for deliveries; the forms varied; the brigade''s role to be studied, the state cannot deal with 4.6 million teams without it; 86 billion jin a year to the state the minimum. Nov. 10: no bargaining over this year''s purchase; the fear of being an honest man; 82 billion jin for next year, no lower; agrees to Tao Zhu''s proposal to bring all prefectural secretaries to Peking). Made public: 1996. Names: Zhou Enlai.'
