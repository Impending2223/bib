  - id: cal.1961-11-30.latin-america
    when: Nov. 30
    date: '1961-11-30'
    thread: latin-america
    c: 'The Joint Chiefs'' answer to Kennedy''s question to Decker at Fort Bragg, what more the military could do in Latin America, to the President: Congress''s limits on military aid for internal security eased; the Latin military to an apolitical role; counterinsurgency, antisubversion and psychological warfare expanded; resentment from "certain power groups" expected.'
    n: '[[w.poole-joint-chiefs-of-staff]], 227–28. See [[cal.1961-10-12.defense]]. Names: Kennedy, Decker.'
