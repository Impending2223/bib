  - id: cal.1961-11.testing
    when: Nov., mid-month
    date: 1961-11
    thread: testing
    c: Kennedy sets up an NSC Committee on Atmospheric Testing Policy, Seaborg chairman, with Foster, Harold Brown, Wiesner and Bundy; tests only when needed and fallout minimized. It recommends 27 shots over three months from the spring; Kennedy approves, the announcement held to about Apr. 1.
