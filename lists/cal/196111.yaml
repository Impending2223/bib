    when: Nov. 4
    date: '1961-11-04'
    thread: specials
    c: 'Texas 20th, special. Henry B. González (D) over Goode (R), 52,696 to 42,511, 54.6 percent, for Kilday''s seat. The first Mexican American from Texas in the House. No swing: Kilday unopposed in 1960.'
    n: 'Votes: CQ Guide 6th (2010) 1266. See [[cal.1961-04-04.states-and-cities]]. Names: González, Goode.'
