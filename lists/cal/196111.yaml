  - id: cal.1961-11-04.cuba
    when: Nov. 4
    date: '1961-11-04'
    thread: cuba
    also: [robert-kennedy]
    c: 'Cabinet Room, 2 p.m., on Cuba: Robert Kennedy, McNamara, Nitze, Lansdale, U. Alexis Johnson, Goodwin, Bissell. By Robert Kennedy''s handwritten notes, McNamara lends him Lansdale, and he sets Lansdale to survey Cuba, "the problems & our assets." His idea: "to stir things up on island with espionage, sabotage, general disorder, run & operated by Cubans themselves."'
    n: 'Memorandum for the record, [FRUS 1961–63, X, doc. 272](https://history.state.gov/historicaldocuments/frus1961-63v10/d272) (the meeting); [FRUS 1961–63, X, doc. 270](https://history.state.gov/historicaldocuments/frus1961-63v10/d270) (the notes). [[w.schlesinger-robert-kennedy-and-his]], 476. [[w.reeves-president-kennedy]], 263–64 (the meeting; Lansdale lent). Check: FRUS''s editorial note sets the notes at the meeting of Nov. 3, Schlesinger at this one; they are dated Nov. 7 (cited by [[w.schlesinger-robert-kennedy-and-his]], 476 n.29). The program: [[cal.1961-11-30.cuba]]. Names: Robert Kennedy, McNamara, Nitze, Lansdale, Johnson, Goodwin, Bissell.'
    src:
