  - id: cal.1961-11-02.conservation
    when: Nov. 2
    date: '1961-11-02'
    thread: conservation
    c: 'Delaware River Basin Compact signed: the United States joins Delaware, New Jersey, New York and Pennsylvania in a commission over the basin''s water supply, pollution control, flood protection, watersheds, recreation, power and withdrawals. Udall the federal member. Congress consented Sept. 27, [75 Stat. 688](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg688.pdf); the House had refused to recommit, June 29, [92–257](https://voteview.com/rollcall/RH0870053).'
    n: 'Statute (K–J Cong. II.J.2). Remarks at the Signing of the Delaware River Basin Compact, [1961 Pub. Papers 692](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=750) (Nov. 2, 1961). See [[cal.1961-02-23.conservation]]. Names: Udall.'
    tags: [name:kennedy-john-f, name:udall-stewart-l]
  - id: cal.1961-11-02.vietnam
    when: Nov. 2
    date: '1961-11-02'
    thread: vietnam
    c: 'Mansfield to Kennedy: no combat troops to Vietnam. North Vietnamese first, then perhaps the Chinese; "a quicksand for us." More aid, the burden left to the South Vietnamese.'
    n: '[FRUS 1961–63, I, doc. 207](https://history.state.gov/historicaldocuments/frus1961-63v01/d207). [[w.gibbons-u-s-government-and]], II, 84–85. [[w.reeves-president-kennedy]], 255–56 (Mansfield''s "quicksand"). [[w.mann-grand-delusion]], 245–46. To check: [[w.olson-mansfield-and-vietnam]]. See [[cal.1961-01-28.vietnam]]. Names: Mansfield, Kennedy.'
