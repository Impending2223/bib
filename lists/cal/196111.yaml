  - id: cal.1961-11.transition-and-staff-2
    when: Nov., before the 17th
    date: 1961-11
    at: before 1961-11-17
    place: washington
    thread: transition-and-staff
    also: [latin-america]
    c: 'The South Lawn, a November afternoon, Kennedy leaving by helicopter for a weekend at his Virginia estate. He beckons Goodwin to the steps and says over the rotors: "You know, Dick, I think you''ll be more effective in the State Department. ... I''m going to announce it next week." Mounting the steps: "We''ll talk about it when I get back." The talk never took place.'
    n: '[[w.goodwin-remembering-america]], 210–11 (Goodwin''s account). Names: Kennedy, Goodwin. Check: the day; before the announcement of the State Department changes, Nov. 17 (212).'
