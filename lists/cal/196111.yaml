  - id: cal.1961-11-02.china-leadership-4
    when: Nov. 2
    date: '1961-11-02'
    thread: china-leadership
    c: 'Xu Shoushen 徐守身, in charge of political and legal work in Jilin 吉林, speaks at the provincial committee''s telephone conference on tidying the cities'' public order. The Central Public Security and Interior Ministries have just met on taking in wandering people and tidying order. The eight cities of Jilin are to act in November, to have results by year''s end and great results by the Spring Festival: stop the flow of people from the villages; hold the railways tight; take in every wanderer in the cities and along the lines, send home those who will go and settle others in the villages, and put to labor, study and handling those who will not go or give false origins; strengthen the household registration; stop the sale of tickets to outsiders at dance halls.'
    n: '[[w.yang-jisheng-mubei]], II, 1055–1056. Made public: 2008. To check: Xu Shoushen 徐守身, talk at the telephone conference on tidying the cities'' public order called by the Jilin Provincial Committee, Nov. 2, 1961, printed by the provincial committee general office Nov. 6, 1961 (cited by [[w.yang-jisheng-mubei]], II, 1056 n.62).'
