  - id: cal.1961-11-03.cuba
    when: Nov. 3
    date: '1961-11-03'
    time: 1961-11-03T17:00Z
    thread: cuba
    also: [robert-kennedy]
    c: 'Noon to 12:55, at the White House: the President authorizes a new program to undermine Castro''s government, by FRUS''s editorial note. Present, by the Appointment Book: Robert Kennedy; Ball, U. Alexis Johnson, Coerr and Hurwitch of State; Cabell, Bissell, Amory and King of the CIA; Bundy and Goodwin.'
    n: '[FRUS 1961–63, X, doc. 270](https://history.state.gov/historicaldocuments/frus1961-63v10/d270) (editorial note, from the President''s Appointment Book). The program: [[cal.1961-11-30.cuba]]. [[w.thomas-robert-kennedy]], 147–48 (Robert Kennedy''s note: "My idea is to stir things up on the island ..."; Lansdale ("the Ugly American") and Bissell among those listed); [[w.poole-joint-chiefs-of-staff]], 120 (Mongoose authorized Nov. 3: "stir things up ... with espionage, sabotage, general disorder, run and operated by Cubans themselves"); [[w.jones-bay-of-pigs]], 154 (the meeting of early November: the program approved; Robert Kennedy, Cabell, Bissell, King and Bundy among those present). Check: Jones (205 n.1), from the Appointment Book, has McNamara, Lansdale and Nitze there too. To check: Interview of Sam Halpern, Oct. 30, 1987, CIA Misc. Files, box 8, JFK-M-10 (F1); Interview of Helms, Jan. 30, 1998, ARRB (cited by [[w.jones-bay-of-pigs]], 154 n.1). Names: Kennedy, Robert Kennedy, Ball, Johnson, Cabell, Bissell, Bundy, Goodwin.'
