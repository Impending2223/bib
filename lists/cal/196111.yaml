  - id: cal.1961-11-22.middle-east-johnson-plan
    when: Nov. 22
    date: '1961-11-22'
    thread: middle-east-johnson-plan
    c: 'Joseph Johnson''s report, an addendum to the PCC''s nineteenth: no early settlement of the Palestine question; both sides willing, with reservation and skepticism, to consider a step-by-step process on the refugees; worth trying. The Arab delegations had objected to his historical section, Nov. 20–21; he cut it, and kept it cut against Israel''s protests. The PCC endorses his conclusions, not the history.'
    n: '[A/4921/Add.1](https://documents.un.org/doc/UNDOC/GEN/NL6/107/72/PDF/NL610772.PDF#page=17), paras. 49, 52–55. FRUS 1961–63, XVII, doc. [140](https://history.state.gov/historicaldocuments/frus1961-63v17/d140) (editorial note; the PCC''s transmittal, Nov. 24). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson.'
    tags: [name:johnson-joseph-e]
