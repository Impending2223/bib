  - id: cal.1961-11-07.states-and-cities
    when: Nov. 7
    date: '1961-11-07'
    thread: elections-1961
    also: [mayors, governors]
    c: 'Off-year elections. New York: Wagner re-elected mayor over Lefkowitz (R), 1,237,421 to 835,691, 51.0 percent; Gerosa, independent, 321,604, 13.3 percent. New Jersey: Hughes (D) governor over Mitchell, Eisenhower''s Labor Secretary, 1,084,194 to 1,049,274, 50.4 percent.'
    n: '[N.J. *Results of the General Election Held November 7th, 1961*, p. 3](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1961-general-election.pdf#page=3). Votes: [Wikipedia, "1961 New York City mayoral election"](https://en.wikipedia.org/wiki/1961_New_York_City_mayoral_election); Check: the Board of Elections'' canvass. See [[cal.1961-09-07.states-and-cities]]. Names: Wagner, Lefkowitz, Gerosa, Hughes, Mitchell, Eisenhower.'
    tags: [name:wagner-robert-f-jr, name:mitchell-james-p, name:eisenhower-dwight-d, name:hughes-richard-j, state:ny, city:nyc, state:nj, name:lefkowitz-louis-j, name:gerosa-lawrence-e]
