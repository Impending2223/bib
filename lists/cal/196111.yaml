    n: 'Memorandum from Taylor to the President (K–J Adm. II.H.3): [FRUS 1961–63, I, doc. 210](https://history.state.gov/historicaldocuments/frus1961-63v01/d210), the covering letter; [doc. 205](https://history.state.gov/historicaldocuments/frus1961-63v01/d205) (editorial note: the cables from Baguio, Nov. 1, a force of about 8,000); [doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v01/d191) (Taylor, Oct. 25: a task force for flood relief, to be phased "into other activities"). [[w.miller-misalliance]], 228–29 (six to eight thousand for the flood); [[w.gibbons-u-s-government-and]], II, 73–78 (the report; Americans "side by side" with the Vietnamese; 6,000–8,000 men under cover of the flood; not the helicopters); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 271–72 (the report; the helicopters; the task force); [[w.marolda-united-states-navy-and]], 127 (the report, Nov. 3); [[w.futrell-united-states-air-force]], 93 (the recommendations of Nov. 3; the advisers as partners); [[w.preston-war-council]], 92–93 (the report; its covering letter, mostly Rostow''s); [[w.mcnamara-in-retrospect]], ch. 2 at n.11 (the report: more advisers, equipment, small numbers of combat troops; "transition from advice to partnership"). [[w.logevall-choosing-war]], 26 (the report; an initial force of eight thousand); [[w.moyar-triumph-forsaken]], 136–37; [[w.taylor-swords-and-plowshares]], 241–45 (the report, written at Baguio, its summary cabled from there; the recommendations; the task force, by Defense''s estimate some 8,000); [[w.mann-grand-delusion]], 244–45 (Taylor presents the mission''s recommendations Nov. 3: joint planning, three new helicopter squadrons and light aircraft, "a radical increase" of U.S. trainers at every level, more special forces, and eight to ten thousand American soldiers thinly disguised as a flood relief force); [[w.lich-su-khang-chien-chong-my]], III, 19–22 (Nov. 3, the Taylor mission''s report, its proposals: administrative advisers; the intelligence net; a survey of the provinces; more arms and training for the Civil Guard and Self-Defense Corps; control of the coasts and rivers; MAAG reorganized and enlarged; a task force of 6,000 to 8,000). [[w.selverstone-kennedy-withdrawal]], 41 (the report; some 8,000 for flood relief). [[w.reeves-president-kennedy]], 255–57 (the report; the flood as pretext, six to eight thousand men). [[w.ball-past-has-another-pattern]], 365–66 (Taylor''s cables; the force; the risks "not impressive"). Check: Gibbons, II, 78, has the report submitted on Taylor''s return, Nov. 2. See [[cal.1961-01-28.vietnam]]. Names: Taylor.'
