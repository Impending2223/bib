  - id: cal.1961-11-03.cuba
    when: Nov. 3
    date: '1961-11-03'
    thread: cuba
    also: [robert-kennedy]
    c: 'Noon to 12:55, at the White House: the President authorizes a new program to undermine Castro''s government, by FRUS''s editorial note. Present, by the Appointment Book: Robert Kennedy; Ball, U. Alexis Johnson, Coerr and Hurwitch of State; Cabell, Bissell, Amory and King of the CIA; Bundy and Goodwin.'
    n: '[FRUS 1961–63, X, doc. 270](https://history.state.gov/historicaldocuments/frus1961-63v10/d270) (editorial note, from the President''s Appointment Book). The program: [[cal.1961-11-30.cuba]]. [[w.thomas-robert-kennedy]], 147–48 (Robert Kennedy''s note: "My idea is to stir things up on the island ..."; Lansdale ("the Ugly American") and Bissell among those listed); [[w.poole-joint-chiefs-of-staff]], 120 (Mongoose authorized Nov. 3: "stir things up ... with espionage, sabotage, general disorder, run and operated by Cubans themselves"). Names: Kennedy, Robert Kennedy, Ball, Johnson, Cabell, Bissell, Bundy, Goodwin.'
