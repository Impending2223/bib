  - id: cal.1961-11-02.berlin-and-vienna
    when: Nov. 2
    date: '1961-11-02'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: 'Khrushchev and Ulbricht, a bitter meeting. Khrushchev: the wall the victory, the West "already worn out" by Aug. 13; a blockade feared. $450 million in gold sold in London for the GDR to buy from West Germany: "this is an irrational policy." "[A] Peace Treaty would provide no political advantage. . . . It is [however] advantageous for the GDR." Ulbricht: "OK, then all is clear." Tighter civil controls only: "I am for order."'
    n: '[[w.fursenko-khrushchevs-cold-war]], 405–7 (the Soviet record; no East German one found). To check: Khrushchev and Ulbricht, Nov. 2, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 405 n.76). See [[cal.1961-10-30.berlin-and-vienna]]. Names: Khrushchev, Ulbricht.'
    src:
      c: 55f677f1
      rows:
        - 'w.fursenko-khrushchevs-cold-war 405–7: all'
        - 'via w.fursenko-khrushchevs-cold-war 405 n.76: all'
    tags: [name:khrushchev-nikita-s, name:ulbricht-walter]
  - id: cal.1961-11-03.vietnam
    when: Nov. 3
    date: '1961-11-03'
    thread: vietnam
    c: Taylor's report. Advisers down to the units; helicopters and aircraft with American crews; a flood-relief task force of about 8,000 men.
    n: 'Memorandum from Taylor to the President (K–J Adm. II.H.3): [FRUS 1961–63, I, doc. 210](https://history.state.gov/historicaldocuments/frus1961-63v01/d210), the covering letter; [doc. 205](https://history.state.gov/historicaldocuments/frus1961-63v01/d205) (editorial note: the cables from Baguio, Nov. 1, a force of about 8,000); [doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v01/d191) (Taylor, Oct. 25: a task force for flood relief, to be phased "into other activities"). [[w.miller-misalliance]], 228–29 (six to eight thousand for the flood); [[w.gibbons-u-s-government-and]], II, 73–78 (the report; Americans "side by side" with the Vietnamese; 6,000–8,000 men under cover of the flood; not the helicopters); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 271–72 (the report; the helicopters; the task force); [[w.marolda-united-states-navy-and]], 127 (the report, Nov. 3); [[w.futrell-united-states-air-force]], 93 (the recommendations of Nov. 3; the advisers as partners); [[w.preston-war-council]], 92–93 (the report; its covering letter, mostly Rostow''s); [[w.mcnamara-in-retrospect]], ch. 2 at n.11 (the report: more advisers, equipment, small numbers of combat troops; "transition from advice to partnership"). [[w.logevall-choosing-war]], 26 (the report; an initial force of eight thousand); [[w.moyar-triumph-forsaken]], 136–37; [[w.taylor-swords-and-plowshares]], 241–45 (the report, written at Baguio, its summary cabled from there; the recommendations; the task force, by Defense''s estimate some 8,000). [[w.selverstone-kennedy-withdrawal]], 41 (the report; some 8,000 for flood relief). [[w.reeves-president-kennedy]], 255–57 (the report; the flood as pretext, six to eight thousand men). [[w.ball-past-has-another-pattern]], 365–66 (Taylor''s cables; the force; the risks "not impressive"). Check: Gibbons, II, 78, has the report submitted on Taylor''s return, Nov. 2. See [[cal.1961-01-28.vietnam]]. Names: Taylor.'
