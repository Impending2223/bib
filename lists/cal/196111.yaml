    c: Liu Shaoqi 劉少奇, having read the first draft of the report for the five-level cadre conference, calls the drafting group and gives his comments. Say enough of the achievements and all of the faults. The faults of the past four years are to be set out without hedging, as strong medicine to make the cadres sweat. The Center bears the main responsibility, and the report must carry the Politburo's self-criticism. On decentralism, name the facts, which every province has. The errors are tied to excessive struggle within the Party, above all to the Lushan 廬山 conference's fight against the right only and not the "left," and to the widespread campaign against right deviation after it; the lack of democracy in the Party kept errors from being mended in time.
    n: '[[w.yang-jisheng-mubei]], II, 1110–1111; [[w.yang-jisheng-tiandi-fanfu]], I, 63 (Liu: the two sentences of Lushan, achievements told in full and shortcomings told through; the shortcomings of the four years to be laid out, "strong medicine for a grave illness"). Made public: 1996. To check: Wu Lengxi 吳冷西, "He Tian Jiaying gongshi de rizi" 《和田家英共事的日子》, Dangde wenxian 《黨的文獻》 1996 no. 5 (cited by [[w.yang-jisheng-mubei]], II, 1111 n.1). Names: Liu Shaoqi.'
