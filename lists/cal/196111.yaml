  - id: cal.1961-11-02.japan-and-korea
    when: Nov. 2–4
    date: '1961-11-02'
    thread: japan
    c: 'Hakone. First meeting of the Joint U.S.–Japan Committee on Trade and Economic Affairs, set up in June: Rusk, Udall, Freeman, Hodges, Goldberg with Ikeda''s ministers. No negotiations.'
    n: 'FRUS 1961–63, XXII, docs. [345](https://history.state.gov/historicaldocuments/frus1961-63v22/d345), [346](https://history.state.gov/historicaldocuments/frus1961-63v22/d346), [347](https://history.state.gov/historicaldocuments/frus1961-63v22/d347). To check: [[w.schaller-altered-states]]; [[w.maga-hands-across-the-sea]]; [[w.zeiler-american-trade-and-power]]. See [[cal.1961-06-20.transition-and-staff]]. Names: Rusk, Udall, Freeman, Hodges, Goldberg, Ikeda.'
