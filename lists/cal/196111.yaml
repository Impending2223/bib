    n: '[FRUS 1961–63, X, doc. 270](https://history.state.gov/historicaldocuments/frus1961-63v10/d270) (editorial note, from the President''s Appointment Book). The program: [[cal.1961-11-30.cuba]]. Names: Kennedy, Robert Kennedy, Ball, Johnson, Cabell, Bissell, Bundy, Goodwin.'
