    c: 'Chicago. Willis''s inventory of classrooms: 222 not in use, 143 of them to go to smaller classes, 65 to expected enrollment, 14 vacant. Mrs. Wendell Green and Pasnick, of the board: no plan to end double shifts. On Nov. 21, by Willis''s count, 15,232 of the city''s 22,374 pupils on double shift are in Districts 8, 16 and 20.'
