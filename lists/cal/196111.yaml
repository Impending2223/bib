    c: 'NSC, 10 a.m., on Rusk''s draft memorandum on South Vietnam. Kennedy fears being involved on two fronts at once; Vietnam not Korea, its issue obscure; he could make "a rather strong case against intervening in an area 10,000 miles away against 16,000 guerrillas with a native army of 200,000." McNamara: action would become clear if American forces went in, against the sources of Viet Cong power, those in North Vietnam among them. The contrast with Berlin "could even make leading Democrats wary."'
