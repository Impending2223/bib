    also: [court]
    c: 'New Haven. The Planned Parenthood League of Connecticut opens a center under Griswold, its executive director, and Buxton, of the Yale medical school, its medical director: advice and contraceptives for married persons, in defiance of the law of 1879.'
    n: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf), 480 (1965). To check: [[w.garrow-liberty-and-sexuality]]. See [[cal.1961-06-19.court]]. Names: Griswold, Buxton.'
