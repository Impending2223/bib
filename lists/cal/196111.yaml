  - id: cal.1961-11.africa
    when: Nov.
    date: 1961-11
    thread: africa
    c: 'State''s "New Africa" guidelines: Africa "probably the greatest open field of maneuver" in the cold war; "our greatest liability is our failure to live up to some of our ideals." The Joint Chiefs: "infused with an humility not in consonance with the dignity and stature" of the United States. The final guidelines unchanged.'
    n: '[[w.poole-joint-chiefs-of-staff]], 252–53.'
