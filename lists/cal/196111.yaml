  - id: cal.1961-11-03.vietnam
    when: Nov. 3
    date: '1961-11-03'
    thread: vietnam
    c: Taylor's report. Advisers down to the units; helicopters and aircraft with American crews; a flood-relief task force of about 8,000 men.
    n: 'Memorandum from Taylor to the President (K–J Adm. II.H.3): [FRUS 1961–63, I, doc. 210](https://history.state.gov/historicaldocuments/frus1961-63v01/d210), the covering letter; [doc. 205](https://history.state.gov/historicaldocuments/frus1961-63v01/d205) (editorial note: the cables from Baguio, Nov. 1, a force of about 8,000); [doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v01/d191) (Taylor, Oct. 25: a task force for flood relief, to be phased "into other activities"). [[w.miller-misalliance]], 228–29 (six to eight thousand for the flood); [[w.gibbons-u-s-government-and]], II, 73–78 (the report; Americans "side by side" with the Vietnamese; 6,000–8,000 men under cover of the flood; not the helicopters); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 271–72 (the report; the helicopters; the task force); [[w.marolda-united-states-navy-and]], 127 (the report, Nov. 3); [[w.futrell-united-states-air-force]], 93 (the recommendations of Nov. 3; the advisers as partners). [[w.logevall-choosing-war]], 26 (the report; an initial force of eight thousand); [[w.moyar-triumph-forsaken]], 136–37. [[w.selverstone-kennedy-withdrawal]], 41 (the report; some 8,000 for flood relief). [[w.reeves-president-kennedy]], 255–57 (the report; the flood as pretext, six to eight thousand men). To check: CINCPAC, Command History, 1961, pp. 188-89 (cited by [[w.marolda-united-states-navy-and]], 127 n.100a); msgs, CHMAAGVN 130825Z Oct 1961 (cited by [[w.marolda-united-states-navy-and]], 127 n.100b); AMEMB Saigon 260330Z (cited by [[w.marolda-united-states-navy-and]], 127 n.100c); Taylor''s paper, FRUS 1961–63, I, 479–81 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 272 n.41); Taylor''s private letter to the President, USVNR, book 11, 337–42 (cited by [[w.moyar-triumph-forsaken]], 137 n.58); Taylor to Kennedy, Oct. 25, 1961, *Pentagon Papers*, Gravel ed., II, 87–88 (cited by [[w.reeves-president-kennedy]], 255). Check: Gibbons, II, 78, has the report submitted on Taylor''s return, Nov. 2. See [[cal.1961-01-28.vietnam]]. Names: Taylor.'
