    c: 'Mao revises the 7th draft of the Central Committee''s reply to the CPSU Central Committee''s letter of Nov. 29, 1963; adds that the CPSU letter only called for an end to open polemics and proposed no concrete measure, and that China now offers concrete proposals. To Kang Sheng and Chen Boda: a few corrections, discuss in a meeting, reprint for tomorrow. Feb. 24: the 8th draft, small changes.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 23, 1964. [[w.jianguo-yilai-mao-zedong]], XVII, 202–204 (Feb. 23 and 24, 1964; note 1: the note to Kang Sheng and Chen Boda on the seventh draft, Feb. 23; the note to Kang Sheng on the eighth draft, 6:30 p.m. Feb. 24 (二月二十四日下午六时半), the additions chiefly in the fifth question, on stopping open polemics; the reply, dated Feb. 29, printed in *Renmin ribao* May 9); [[w.deng-xiaoping-nianpu-1904]], III, 1799 (Feb. 23, 1964; Deng reads the Central Committee''s reply to the CPSU letter of Nov. 29 (draft of Feb. 22): to Liu Shaoqi, ''I think this draft will do; I have made a few changes in wording; I propose a talk tomorrow (the 24th) afternoon at the Chairman''s, Peng back by then''; beside the sentence that all complete sets of equipment and general goods from the Soviet Union, loans included, were paid for in goods, gold and convertible currency, he writes that it should be added that what China imported from the Soviet Union cost far more than at world prices). Made public: 2013. Check: unit D, Mao''s note of 6:30 p.m. Feb. 24 on the eighth draft (XVII, 202), is an act of the next day; the Wengao prints it as a second document. To check: the Central Committee''s reply (dated Feb. 29, handed to the Soviet chargé Mar. 1, published May 9; named by [[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964). Names: Mao Zedong, Kang Sheng, Chen Boda.'
