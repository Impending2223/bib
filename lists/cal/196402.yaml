  - id: cal.1964-02-02.opinion
    when: Feb. 2
    date: '1964-02-02'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Jan. 2–7: a law giving all persons, Negro and white, the right to be served in hotels, restaurants, theaters, and the like, 61 percent for, 31 against. Whites outside the South 71 for; Southern whites 20 for, 72 against.'
    n: '[[w.gallup-poll]], III, 1863.'
  - id: cal.1964-02-03.assassination
    when: Feb. 3
    date: '1964-02-03'
    thread: assassination
    c: 'The Warren Commission takes its first testimony: Marina Oswald, the first witness. 552 witnesses in all, 94 heard by the members themselves; hearings closed unless a witness asked otherwise.'
    n: '[*Report of the President''s Commission on the Assassination of President Kennedy*, Foreword](https://www.archives.gov/research/jfk/warren-commission-report/foreword.html) (K–J Adm. II.H.3). *Hearings Before the President''s Commission on the Assassination of President Kennedy*, vol. I (1964). To check: [[w.willens-history-will-prove-us]]; [[w.mcknight-breach-of-trust]]; [[w.shenon-cruel-and-shocking-act]]. See [[cal.1963-11-29.assassination]]; [[cal.1963-12-05.assassination]]. Names: Marina Oswald, Warren.'
    tags: [name:oswald-marina, name:warren-earl]
  - id: cal.1964-02-03.desegregation-schools
    when: Feb. 3
    date: '1964-02-03'
    thread: desegregation-schools
    c: New York. A one-day boycott of the city's schools against their segregation, called by Galamison's Citywide Committee for Integrated Schools, backed by CORE and the NAACP. Some 464,000 pupils out, about 45 percent. Check the count.
    n: 'To check: [[w.taylor-knocking-at-our-own]]. Names: Galamison.'
    tags: [name:galamison-milton-a]
  - id: cal.1964-02-03.alabama
    when: Feb. 3
    date: '1964-02-03'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Tuskegee. On the State Board of Education's order, Wallace its president ex officio, Tuskegee High closed above the seventh grade; its twelve pupils, all Black, left to go back to Tuskegee Institute High. Judge Johnson orders them admitted to the white high schools at Shorter and Notasulga (Check the date).
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). To check: [[w.bass-taming-the-storm]]. See [[cal.1963-09-02.alabama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-frank-m-jr]
  - id: cal.1964-02-03.mayors-dallas
    when: Feb. 3
    date: '1964-02-03'
    thread: mayors
    c: Dallas. Mayor Cabell resigns to run for Congress against Representative Alger (R). Erik Jonsson, chairman of Texas Instruments, mayor for the rest of the term. Cabell, elected in 1961 over the Citizens Charter Association's candidate and re-elected in 1963, had been mayor on Nov. 22.
    n: 'Michael V. Hazel, ["Cabell, Earle,"](https://www.tshaonline.org/handbook/entries/cabell-earle) *Handbook of Texas Online*; Ann F. Westerlin, ["Jonsson, John Erik,"](https://www.tshaonline.org/handbook/entries/jonsson-john-erik) *Handbook of Texas Online*; [Wikipedia, "Earle Cabell"](https://en.wikipedia.org/wiki/Earle_Cabell) for the date. Check: the council''s minutes. To check: [[w.payne-big-d]]; [[w.fairbanks-for-the-city-as]]; [[w.bridges-morning-glories]]; [[w.phillips-white-metropolis]]; [[w.miller-nut-country]]; [[w.minutaglio-dallas-1963]]. See [[cal.1963-11-22.assassination]]. Names: Cabell, Jonsson, Alger.'
    tags: [state:tx, city:dallas, name:cabell-earle, name:alger-bruce-r, name:jonsson-j-erik]
  - id: cal.1964-02-03.vietnam
    when: Feb. 3
    date: '1964-02-03'
    thread: vietnam
    c: 'Johnson to John S. Knight of the *Miami Herald*, by telephone, 5:45 p.m.: three courses in Vietnam. Withdraw, "run and let the dominoes start falling over," and what was said of leaving China "would just be warming up"; "I see Nixon is raising hell about it today. Goldwater too." Neutralize, "totally impractical"; or go in.'
    n: '[Johnson and John Knight, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964), Conversation WH6402-03-1839 (Miller Center). [[w.johns-vietnams-second-front]], 48 (the conversation, from Beschloss''s transcript). [[w.selverstone-kennedy-withdrawal]], 218 (the courses; not Nixon and Goldwater). To check: [[w.taking-charge]], 213–14 (cited by [[w.johns-vietnams-second-front]], 48 n.18). See [[cal.1964-01-30.vietnam]]. Names: Johnson, Nixon, Goldwater.'
    src:
      c: 6366ff09
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964: A'
        - 'w.johns-vietnams-second-front 48: all'
        - 'w.selverstone-kennedy-withdrawal 218: B, D-E'
        - 'via w.selverstone-kennedy-withdrawal 218 n.67: D'
        - 'via w.selverstone-kennedy-withdrawal 218 n.75: B, E'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:goldwater-barry-m]
