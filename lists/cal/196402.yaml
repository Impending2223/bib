  - id: cal.1964-02.china-leadership-3
    when: Feb., after the 13th
    date: 1964-02
    at: after 1964-02-13
    place: hanoi
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Hanoi. A Chinese party delegation under Deng Xiaoping, Kang Sheng with him, comes in secret and meets the Vietnam Workers'' Party leaders under Lê Duẩn, Phạm Văn Đồng and Trường Chinh in three sessions; Wu Lengxi, recalled from Hongay, joins. Deng: China will give 2 billion yuan for a long-term plan to make Vietnam self-supporting in farming and light industry, with coal, the arms free as before. The Vietnamese welcome it and will work out a plan. On the draft Chinese reply to the CPSU letter of Nov. 29, brought in Vietnamese, they ask conditions for an end to the open polemic, a halt by all parties, and the Soviet–Chinese talks to succeed before any conference; Lê Duẩn and Trường Chinh ask a softer tone for Europe''s parties. Deng: China hopes for agreement before a conference and will try, but must prepare for a Soviet break; the tone can be eased, the principle stays. Hồ Chí Minh, absent from the talks, gives the dinner at the end. Deng then takes Wu back to Peking.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 666–670 (the Chinese delegation "secretly" at Hanoi; the 2 billion yuan; three sessions; the Vietnamese views on the reply, and Deng''s answer; Hồ''s dinner and thanks; the arms "without payment, unlike the Soviet arms aid for the Korean War, at half price"; Wu told to return with Deng at the end); [[w.yang-shangkun-riji]], II, 355 (Feb. 25, 1964; Deng and his party leave for Vietnam "today," Feb. 25; the talks not named); [[w.deng-xiaoping-nianpu-1904]], III, 1800–1801 (Feb. 25–28, 1964; Deng with Kang Sheng, Fang Yi 方毅 and Wu Lengxi goes to Hanoi for the Sino-Vietnamese party talks on the Central Committee''s reply to the CPSU letter of Nov. 29, 1963 and on economic aid to Vietnam; reaches Hanoi on the afternoon of the 25th; leaves on the 28th; the nianpu gives no sum of aid. Footnote 3: Fang Yi, then deputy director of the State Planning Commission, deputy director of the State Council''s Foreign Affairs Office, and head of the Foreign Economic Liaison Bureau). Made public: 1999. See [[cal.1964-02-09.china-leadership-2]]. Names: Deng Xiaoping, Kang Sheng, Lê Duẩn, Phạm Văn Đồng, Trường Chinh, Hồ Chí Minh. Check: the days, which Wu does not give: the party left Hanoi for Peking with Wu on Feb. 28 (675), and Mao''s notes of Feb. 23 have Kang Sheng in Peking ([[cal.1964-02-23.china-leadership]]).'
    src:
      c: fc30a066
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 666–670: all'
        - 'w.yang-shangkun-riji II, 355: ?'
        - 'w.deng-xiaoping-nianpu-1904 III, 1800–1801: B'
    tags: [polity:prc, name:deng-xiaoping, name:kang-sheng, name:le-duan, name:pham-van-dong, name:truong-chinh, name:ho-chi-minh, vis:only:prc+drv]
