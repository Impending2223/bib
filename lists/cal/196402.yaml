    n: 'White House Statement Declaring United States Determination To Guarantee the Security of the Naval Base at Guantanamo, [1963–64 Pub. Papers 273](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=357) (Feb. 7, 1964). [FRUS 1964–68, XXXII, doc. 229](https://history.state.gov/historicaldocuments/frus1964-68v32/d229). See [[cal.1964-02-02.cuba]]. Names: Johnson.'
