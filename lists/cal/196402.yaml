    n: '[Johnson and John Knight, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964), Conversation WH6402-03-1839 (Miller Center). [[w.johns-vietnams-second-front]], 48 (the conversation, from Beschloss''s transcript). [[w.selverstone-kennedy-withdrawal]], 218 (the courses; not Nixon and Goldwater). [[w.mann-grand-delusion]], 312 (the call; Nixon and Goldwater). To check: [[w.taking-charge]], 213–14 (cited by [[w.johns-vietnams-second-front]], 48 n.18). See [[cal.1964-01-30.vietnam]]. Names: Johnson, Nixon, Goldwater. Check: Mann has Nixon''s statement "the day before."'
