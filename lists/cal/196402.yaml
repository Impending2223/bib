  - id: cal.1964-02-03.assassination
    when: Feb. 3
    date: '1964-02-03'
    thread: assassination
    c: 'The Warren Commission takes its first testimony: Marina Oswald, the first witness. 552 witnesses in all, 94 heard by the members themselves; hearings closed unless a witness asked otherwise.'
    n: '[*Report of the President''s Commission on the Assassination of President Kennedy*, Foreword](https://www.archives.gov/research/jfk/warren-commission-report/foreword.html) (K–J Adm. II.H.3). *Hearings Before the President''s Commission on the Assassination of President Kennedy*, vol. I (1964). To check: [[w.willens-history-will-prove-us]]; [[w.mcknight-breach-of-trust]]; [[w.shenon-cruel-and-shocking-act]]. See [[cal.1963-11-29.assassination]]; [[cal.1963-12-05.assassination]]. Names: Marina Oswald, Warren.'
    tags: [name:oswald-marina, name:warren-earl]
