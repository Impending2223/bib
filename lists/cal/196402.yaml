  - id: cal.1964-02-07.elections-1964
    when: Feb. 7
    date: '1964-02-07'
    thread: elections-1964
    also: [economy]
    c: 'Johnson to Russell Long, 7:30 p.m., after the Senate passes the tax bill: "you did a wonderful job. Just 20 votes against it. Now, you go in that conference and get it sacked up. We''re losing $30 million a day." "I want to have a good year so I can get reelected."'
    n: '[[w.young-two-suns-of-the]], 116. To check: [Johnson and Long, 7:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-russell-long-february-8-1964), Conversation WH6402-09-1957 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment). See [[cal.1964-02-07.economy]]. Names: Johnson, Long.'
