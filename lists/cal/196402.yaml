    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). See [[cal.1964-02-03.alabama]].'
