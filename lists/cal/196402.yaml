  - id: cal.1964-02-29.china-leadership
    when: Feb. 29
    date: '1964-02-29'
    place: peking
    thread: china-leadership
    also: [korea-leadership, soviet-union]
    c: 'Mao, Beijing, Diaoyutai, no. 18, morning: receives Kim Il Sung again. If China turns revisionist, what would Korea do? (He has said so to Miyamoto Kenji, to Wilcox of New Zealand, to the Indonesians.) Against the new bourgeoisie, who steal and speculate and are few but able; the Soviet Union is full of them. The CPSU letter threatens "collective measures", "decisive blows": China is waiting. The seventh commentary took two months and 18 drafts; its title was found two weeks before publication.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 677–681 (the second talk with Kim Il Sung, Feb. 29, in building 18 of Diaoyutai; present with Kim: Pak Kum-chol, Kim Chang-man, Pak Yong-guk and four others of the Korean Politburo; with Mao: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Kang Sheng, Wu Xiuquan, Wu Lengxi and Yao Zhen; Deng on the Vietnam talks; Mao on the polemic, that China could not name the CPSU before its Open Letter of July 14 and now can; how to receive the Romanians; the reply to go before they arrive, the talks put to October, then September, then August and no earlier; the polemic paused while the Romanians are in Peking; Kim to stay to work on them while his delegation goes home); [[w.macfarquhar-origins-of-the-cultural]], III, 281 (Mao tells Kim that in the first half of 1962 some in the Party wanted to dissolve the collective economy in the countryside, with better relations with the Soviet Union and the United States their foreign program); [[w.deng-xiaoping-nianpu-1904]], III, 1801–1802 (Feb. 29, 1964; morning, 上午; Deng with Mao and Liu Shaoqi in talks with Kim Il Sung, chairman of the Korean Workers'' Party Central Committee; before the talks Deng briefs Kim on the Sino-Vietnamese party talks); [[w.mao-zedong-zhuan]], V, ch. 71 (Mao to Kim Il Sung: the seventh commentary took two months and 18 revisions, its title found two weeks before publication (n.31)). Made public: 1999. To check: [[w.jin-1949-1989-niande-zhongguo]], 577–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 281 n.113). Names: Mao Zedong, Kim Il Sung, Miyamoto Kenji, Wilcox.'
