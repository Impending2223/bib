    c: 'Deng Xiaoping 邓小平 reads the Foreign Ministry''s request report on the arrival in China of the French advance party for a mission, and the Chinese mission staff''s going to France. Comment: he has talked once with the Foreign Ministry comrades; (1) he agrees to tell the French that the chargé d''affaires and five others can reach Paris about Feb. 15; sending a chargé now is without danger and forces the French to make their attitude to Taiwan plain; if the French again play the ''two Chinas'' trick, it comes at most to a situation like Britain''s, no harm to China; (2) the Foreign Ministry to draw up quickly the chargé''s plan of activity for approval; (3) whether Mao should be talked to is for him to decide. Sent to Liu Shaoqi 刘少奇 and Peng Zhen 彭真 and then to Mao.'
