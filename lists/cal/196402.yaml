  - id: cal.1964-02-07.economy
    when: Feb. 7
    date: '1964-02-07'
    thread: economy
    c: 'Senate passes the tax bill, [77–21](https://voteview.com/rollcall/RS0880264): Democrats 56–11, Republicans 21–10. Long reported it for the Finance Committee Jan. 28. Ribicoff''s credit for college costs lost, [45–48](https://voteview.com/rollcall/RS0880242); cuts in the oil depletion allowance lost, [33–61](https://voteview.com/rollcall/RS0880254) and [35–57](https://voteview.com/rollcall/RS0880256).'
    n: '[110 Cong. Rec., Senate, Feb. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-8-1.pdf); [110 Cong. Rec., Senate, Jan. 28, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-14-2.pdf) (S. Rep. No. 88-830). Statement by the President Following Senate Committee Action on the Tax Bill, [1963–64 Pub. Papers 224](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=308) (Jan. 24, 1964); Statement by the President Following Senate Approval of the Tax Bill, [1963–64 Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=356) (Feb. 7, 1964). [[w.zelizer-taxing-america]], 204 (the bill through Finance and the Senate); [[w.stein-fiscal-revolution-in-america]], 453 (reported Jan. 28; passed Feb. 7). To check: [[w.mann-legacy-to-power]]; [[w.heinemann-harry-byrd-of-virginia]]. See [[cal.1963-09-25.economy]]; [[cal.1963-12-07.economy]]. Names: Long, Ribicoff.'
