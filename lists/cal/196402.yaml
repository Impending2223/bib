    n: '[[w.perlstein-before-the-storm]], 279. To check: "Scranton Pulls Out of Primary Race in NH," *Los Angeles Times*, Feb. 4, 1964 (cited by [[w.perlstein-before-the-storm]], 279 n.3). Names: Scranton.'
