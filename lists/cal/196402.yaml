    c: 'The Politburo in enlarged session, Liu Shaoqi presiding, afternoon: adopts the Central Committee''s reply to the CPSU letter of Nov. 29, 1963; five matters: the border, aid, Soviet experts, trade, the open polemic. Dated Feb. 29.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Feb. 29, 1964; Liu presides at the enlarged Politburo meeting, which adopts the Central Committee''s reply to the CPSU letter of Nov. 29, 1963); [[w.lengxi-shinian-lunzhan-1956-1966]], 681–687, 729 (the reply, "decided that evening" (681); five matters in Wu''s order: the border, aid, experts, trade, the open polemic; its four proposals (talks of the two parties and the others, a world conference prepared, Soviet–Chinese talks in Peking Oct. 10 to 15, 1964, a preparatory meeting of 17 parties); "signed Feb. 29, sent Mar. 1", not published, the Romanians coming in two days (687); received by the CPSU Mar. 1 (729); printed May 9 (774)); [[w.yang-shangkun-riji]], II, 356 (Feb. 29, 1964; 3:30 to 6 p.m.; Yang there; Liu not named); [[w.deng-xiaoping-nianpu-1904]], III, 1802 (Feb. 29, 1964; afternoon, 下午; Deng at the enlarged Politburo meeting Liu Shaoqi presides over, which discusses the draft reply to the CPSU; the Central Committee sends it out Mar. 1; it answers on the border, aid, Soviet experts, trade and the end of open polemic, and proposes ending open polemic, preparing a conference of all parties, continuing the Sino-Soviet party talks in Peking in October, and a conference of seventeen fraternal parties after them); [[w.peng-zhen-nianpu-1902]], IV, 321–322 (Feb. 29, 1964, afternoon; Peng Zhen at the enlarged Politburo, Liu Shaoqi presiding, which adopts the reply to the CPSU''s letter of Nov. 29, 1963: the border, aid, the Soviet experts, trade and a halt to open polemic; proposals on halting the polemic, preparing a meeting of the parties, the talks to go on in Peking in October and a meeting of seventeen parties after; delivered Mar. 1 (the page''s note: signed Feb. 29); on May 9 the *Renmin ribao* prints the seven letters exchanged since Nov. 29, 1963). Made public: 1996. Check: Wu (681) has the decision to send the reply taken the evening of Feb. 29, after the second talk with Kim Il Sung; he names no session of the Politburo. To check: the reply of Feb. 29, 1964 (named by [[w.zedong-mao-zedong-nianpu]], V, Feb. 29, 1964). Names: Liu Shaoqi. Check: the Soviet chargés name (the Chinese: Qierbakefu).'
