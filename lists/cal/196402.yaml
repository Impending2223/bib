  - id: cal.1964-02-13.china-leadership
    when: Feb. 13
    date: '1964-02-13'
    place: peking
    thread: china-leadership
    c: 'Mao, Beijing, the Hall of the People, Spring Festival: calls sixteen to a forum on education: Liu Shaoqi, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng, Guo Moruo, Lin Feng, Yang Xiufeng, Jiang Nanxiang, Zhang Jinfu, Lu Ping, Zhu Muzhi, Chen Shutong, Huang Yanpei, Xu Deheng, Zhang Shizhao. Mao: the old schooling ruins talent; courses can be cut by half, study shortened; exams are ambushes, to be replaced by open questions, books not always to be read; verbose scholasticism will perish. Learning to be joined with labor.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 13, 1964. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 589 (Feb. 13, 1964; Liu attends the education forum Mao calls on the Spring Festival, at which Mao proposes shortening schooling and changing the courses, methods of teaching and examinations); [[w.macfarquhar-origins-of-the-cultural]], III, 392 (Mao''s concern to shorten schooling and join it with work); [[w.jianguo-yilai-mao-zedong]], XVII, 194–196 (Feb. 13, 1964; an extract of the talk at the Spring Festival forum, printed from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), which Mao had checked before it came out (note 1); a three-sentence sample: schooling shortened, girls too to have half a year to a year of army life, open examination questions); [[w.deng-xiaoping-nianpu-1904]], III, 1797 (Feb. 13, 1964 (Spring Festival); Deng attends Mao''s forum on educational work); [[w.yang-jisheng-tiandi-fanfu]], II, 1072 (at the Spring Festival forum in the Great Hall Mao calls on all to learn from the PLA and from the Daqing oilfield of the Ministry of Petroleum); [[w.peng-zhen-nianpu-1902]], IV, 319 (Feb. 13, 1964; Peng Zhen, with Liu Shaoqi, Deng Xiaoping, Lu Dingyi, Kang Sheng, Guo Moruo, Lin Feng, Yang Xiufeng, Jiang Nanxiang, Zhang Jingfu, Lu Ping, Zhu Muzhi, Chen Shutong, Huang Yanpei, Xu Deheng, Zhang Shizhao and others, at Mao''s forum on education in the Great Hall of the People (the Spring Festival forum); Mao: schooling may be shortened, courses cut by half; trick questions in exams a way to treat enemies; too much Marxism undigested makes bookworms and dogmatists); [[w.dikotter-cultural-revolution]], 37 n.31 (Mao compares the examinations to the eight-legged essay; questions to be published in advance, answers with books; copying a good answer to count; dozing at tedious lectures praised; the text dates the remarks Feb. 13, 1963, its note Feb. 13, 1964). Made public: 1996. Check: the Wengao prints this talk from *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), which Mao checked before it came out ([[w.jianguo-yilai-mao-zedong]], XVII, 195 n.1); if that printing was open, it was made public in 1967, not 1996. To check: [[w.mao-zedong-sixiang-wan-1969]], 455–71, 526–31 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 392 n.71a). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng, Guo Moruo, Lin Feng, Yang Xiufeng, Jiang Nanxiang, Zhang Jinfu, Lu Ping, Zhu Muzhi, Chen Shutong, Huang Yanpei, Xu Deheng, Zhang Shizhao. Check: Whether the talk was circulated in the Party in 1964 (the chronology notes none).'
    src:
      c: a103f5c7
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Feb. 13, 1964: all'
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 589: A'
