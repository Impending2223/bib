    n: 'Joint Statement following Discussions With the Prime Minister of the United Kingdom, [1963–64 Pub. Papers 293](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=377) (Feb. 13, 1964). See [[cal.1964-01-12.africa]]. Names: Douglas-Home, Johnson.'
    tags: [name:douglas-home-alec, name:johnson-lyndon-b]
  - id: cal.1964-02-14.vietnam
    when: Feb. 14
    date: '1964-02-14'
    thread: vietnam
    c: 'NSAM 280: a committee under William Sullivan of State to manage policy in Vietnam, Forrestal for the White House.'
    n: '[NSAM No. 280](https://history.state.gov/historicaldocuments/frus1964-68v01/d46) (Feb. 14, 1964). [[w.gibbons-u-s-government-and]], II, 234. To check: [[w.pentagon-papers]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]. See [[cal.1964-01-30.vietnam]]. Names: Sullivan, Forrestal, Johnson.'
    tags: [name:johnson-lyndon-b, name:sullivan-william-h, name:forrestal-michael-v]
  - id: cal.1964-02-14.africa
    when: Feb. 14
    date: '1964-02-14'
    thread: africa
    c: 'Harriman, Williams and Mahoney to Johnson on Ghana: to leave the Volta project now would defeat the United States'' purposes; the program of pressure on Nkrumah reviewed.'
    n: 'FRUS 1964–68, XXIV, docs. [239](https://history.state.gov/historicaldocuments/frus1964-68v24/d239) (Rusk to Johnson, Feb. 13), [240](https://history.state.gov/historicaldocuments/frus1964-68v24/d240). Made public: FRUS 1964–68, XXIV (1999). See [[cal.1964-02-04.africa]]. Names: Harriman, Williams, Mahoney, Johnson, Nkrumah.'
    tags: [name:mahoney-william-p-jr, name:harriman-w-averell, name:williams-g-mennen, name:johnson-lyndon-b, name:nkrumah-kwame]
