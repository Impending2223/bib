  - id: cal.1964-02-03.alabama
    when: Feb. 3
    date: '1964-02-03'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Tuskegee. On the State Board of Education's order, Wallace its president ex officio, Tuskegee High closed above the seventh grade; its twelve pupils, all Black, left to go back to Tuskegee Institute High. Judge Johnson orders them admitted to the white high schools at Shorter and Notasulga (Check the date).
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). To check: [[w.bass-taming-the-storm]]. See [[cal.1963-09-02.alabama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-frank-m-jr]
