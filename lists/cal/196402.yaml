entries:
  - id: cal.1964-02-01.transition-and-staff
    when: Feb. 1
    date: '1964-02-01'
    thread: transition-and-staff
    also: [poverty, peace-corps]
    c: 'News conference. Shriver, back from a world trip, to organize the war on poverty as Special Assistant to the President, keeping the Peace Corps; a Cabinet committee to advise him. His letter of appointment, Feb. 12: he directs the departments in the program and speaks for it to Congress.'
    n: 'The President''s News Conference, [1963–64 Pub. Papers 254](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=338) (Feb. 1, 1964); Letter to Sargent Shriver on His Appointment To Direct the Program To Eliminate Poverty, [1963–64 Pub. Papers 291](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=375) (Feb. 12, 1964). [[w.dallek-flawed-giant]], 76–77. To check: [[w.gillette-launching-the-war-on]]; [[w.stossel-sarge]]. See [[cal.1964-01-08.program]]. The message: [[cal.1964-03-16.poverty]]. Names: Johnson, Shriver.'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1964-02-02.cuba
    when: Feb. 2
    date: '1964-02-02'
    thread: cuba
    c: Guantanamo. The Coast Guard takes four Cuban fishing boats inside American waters off the Dry Tortugas; the crews held at Key West asking to prosecute them.
    n: '[FRUS 1964–68, XXXII, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v32/d228) (editorial note). [[w.johnson-vantage-point]], 184–85. To check: [[w.leogrande-back-channel-to-cuba]]; [[w.bohning-castro-obsession]].'
    src:
      c: 50a8a2ca
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d228: all'
        - 'w.johnson-vantage-point 184–85: all'
  - id: cal.1964-02-02.opinion
    when: Feb. 2
    date: '1964-02-02'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, Jan. 2–7: a law giving all persons, Negro and white, the right to be served in hotels, restaurants, theaters, and the like, 61 percent for, 31 against. Whites outside the South 71 for; Southern whites 20 for, 72 against.'
    n: '[[w.gallup-poll]], III, 1863.'
  - id: cal.1964-02-03.assassination
    when: Feb. 3
    date: '1964-02-03'
    thread: assassination
    c: 'The Warren Commission takes its first testimony: Marina Oswald, the first witness. 552 witnesses in all, 94 heard by the members themselves; hearings closed unless a witness asked otherwise.'
    n: '[*Report of the President''s Commission on the Assassination of President Kennedy*, Foreword](https://www.archives.gov/research/jfk/warren-commission-report/foreword.html) (K–J Adm. II.H.3). *Hearings Before the President''s Commission on the Assassination of President Kennedy*, vol. I (1964). To check: [[w.willens-history-will-prove-us]]; [[w.mcknight-breach-of-trust]]; [[w.shenon-cruel-and-shocking-act]]. See [[cal.1963-11-29.assassination]]; [[cal.1963-12-05.assassination]]. Names: Marina Oswald, Warren.'
    tags: [name:oswald-marina, name:warren-earl]
  - id: cal.1964-02-03.desegregation-schools
    when: Feb. 3
    date: '1964-02-03'
    thread: desegregation-schools
    c: New York. A one-day boycott of the city's schools against their segregation, called by Galamison's Citywide Committee for Integrated Schools, backed by CORE and the NAACP. Some 464,000 pupils out, about 45 percent. Check the count.
    n: 'To check: [[w.taylor-knocking-at-our-own]]. Names: Galamison.'
    tags: [name:galamison-milton-a]
  - id: cal.1964-02-03.alabama
    when: Feb. 3
    date: '1964-02-03'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Tuskegee. On the State Board of Education's order, Wallace its president ex officio, Tuskegee High closed above the seventh grade; its twelve pupils, all Black, left to go back to Tuskegee Institute High. Judge Johnson orders them admitted to the white high schools at Shorter and Notasulga (Check the date).
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). To check: [[w.bass-taming-the-storm]]. See [[cal.1963-09-02.alabama]]. Names: Wallace, Johnson.'
    tags: [name:wallace-george-c, name:johnson-frank-m-jr]
  - id: cal.1964-02-03.mayors-dallas
    when: Feb. 3
    date: '1964-02-03'
    thread: mayors
    c: Dallas. Mayor Cabell resigns to run for Congress against Representative Alger (R). Erik Jonsson, chairman of Texas Instruments, mayor for the rest of the term. Cabell, elected in 1961 over the Citizens Charter Association's candidate and re-elected in 1963, had been mayor on Nov. 22.
    n: 'Michael V. Hazel, ["Cabell, Earle,"](https://www.tshaonline.org/handbook/entries/cabell-earle) *Handbook of Texas Online*; Ann F. Westerlin, ["Jonsson, John Erik,"](https://www.tshaonline.org/handbook/entries/jonsson-john-erik) *Handbook of Texas Online*; [Wikipedia, "Earle Cabell"](https://en.wikipedia.org/wiki/Earle_Cabell) for the date. Check: the council''s minutes. To check: [[w.payne-big-d]]; [[w.fairbanks-for-the-city-as]]; [[w.bridges-morning-glories]]; [[w.phillips-white-metropolis]]; [[w.miller-nut-country]]; [[w.minutaglio-dallas-1963]]. See [[cal.1963-11-22.assassination]]. Names: Cabell, Jonsson, Alger.'
    tags: [state:tx, city:dallas, name:cabell-earle, name:alger-bruce-r, name:jonsson-j-erik]
  - id: cal.1964-02-03.vietnam
    when: Feb. 3
    date: '1964-02-03'
    thread: vietnam
    c: 'Johnson to John S. Knight of the *Miami Herald*, by telephone, 5:45 p.m.: three courses in Vietnam. Withdraw, "run and let the dominoes start falling over," and what was said of leaving China "would just be warming up"; "I see Nixon is raising hell about it today. Goldwater too." Neutralize, "totally impractical"; or go in.'
    n: '[Johnson and John Knight, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964), Conversation WH6402-03-1839 (Miller Center). [[w.johns-vietnams-second-front]], 48 (the conversation, from Beschloss''s transcript). To check: [[w.taking-charge]], 213–14 (cited by [[w.johns-vietnams-second-front]], 48 n.18). See [[cal.1964-01-30.vietnam]]. Names: Johnson, Nixon, Goldwater.'
    src:
      c: 6366ff09
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964: A'
        - 'w.johns-vietnams-second-front 48: all'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:goldwater-barry-m]
  - id: cal.1964-02-04.africa
    when: Feb. 4
    date: '1964-02-04'
    thread: africa
    c: Accra. A crowd at the American embassy (Check the date); an embassy officer keeps it from the flag. Mahoney recalled; four Americans among six professors expelled from the University of Ghana.
    n: 'FRUS 1964–68, XXIV, docs. [235](https://history.state.gov/historicaldocuments/frus1964-68v24/d235) (Jan. 3), [237](https://history.state.gov/historicaldocuments/frus1964-68v24/d237) (Feb. 11). Made public: FRUS 1964–68, XXIV (1999). To check: [[w.gaines-american-africans-in-ghana]]; [[w.thompson-ghanas-foreign-policy-1957]]. See [[cal.1961-12-05.africa]]. Names: Mahoney.'
    tags: [name:mahoney-william-p-jr]
  - id: cal.1964-02-04.alabama-schools
    when: Feb. 4
    date: '1964-02-04'
    thread: alabama-schools
    also: [desegregation-schools]
    c: The State Board of Education "deplores the order of Judge Johnson" and directs tuition grants for Tuskegee High's white pupils.
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). See [[cal.1964-02-03.alabama]]. Names: Frank Johnson.'
    tags: [name:johnson-frank-m-jr]
  - id: cal.1964-02-05.program
    when: Feb. 5
    date: '1964-02-05'
    thread: program
    c: Consumer message. Truth in packaging and in lending; warning labels on drugs, cosmetics, and pressurized containers; inspection of all meat and poultry, intrastate too; no pesticide registered "under protest"; temporary cease-and-desist orders for the FTC. Peterson, Special Assistant for Consumer Affairs since Jan. 3, to lead.
    n: 'Special Message to the Congress on Consumer Interests, [1963–64 Pub. Papers 263](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=347) (Feb. 5, 1964); Statement by the President Upon Establishing the President''s Committee on Consumer Interests, [1963–64 Pub. Papers 108](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=192) (Jan. 3, 1964). To check: [[w.peterson-restless]]. See [[cal.1962-03-15.program]]. Names: Johnson, Peterson.'
    tags: [name:johnson-lyndon-b, name:peterson-esther]
  - id: cal.1964-02-05.africa
    when: Feb. 5
    date: '1964-02-05'
    thread: africa
    also: [europe-and-the-alliance]
    c: 'Johnson to Douglas-Home: what will Britain do to prevent a Communist takeover in Zanzibar? Neither government has recognized the regime.'
    n: '[FRUS 1964–68, XXIV, doc. 182](https://history.state.gov/historicaldocuments/frus1964-68v24/d182) (Feb. 7). Check: the message. See [[cal.1964-01-12.africa]]. Names: Johnson, Douglas-Home.'
    tags: [name:johnson-lyndon-b, name:douglas-home-alec]
  - id: cal.1964-02-05.alabama-schools
    when: Feb. 5
    date: '1964-02-05'
    thread: alabama-schools
    also: [desegregation-schools]
    c: Notasulga's mayor turns six of the Tuskegee pupils away under new town ordinances; the white pupils leave the Shorter and Notasulga schools.
    n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/case-pdfs/0743-01.pdf) (M.D. Ala. 1964) (the three-judge court''s findings, July 13). See [[cal.1964-02-03.alabama]].'
  - id: cal.1964-02-06.cuba
    when: Feb. 6
    date: '1964-02-06'
    thread: cuba
    c: Cuba cuts off the water of the Guantanamo base.
    n: '[FRUS 1964–68, XXXII, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v32/d228) (editorial note). [[w.johnson-vantage-point]], 185. See [[cal.1964-02-02.cuba]].'
    src:
