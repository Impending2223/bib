    c: 'Johnson to John S. Knight of the *Miami Herald*, by telephone, 5:45 p.m.: three courses in Vietnam. Withdraw, "run and let the dominoes start falling over," and what was said of leaving China "would just be warming up"; "I see Nixon is raising hell about it today. Goldwater too." Neutralize, "totally impractical"; or go in.'
    n: '[Johnson and John Knight, 5:45 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964), Conversation WH6402-03-1839 (Miller Center). [[w.johns-vietnams-second-front]], 48 (the conversation, from Beschloss''s transcript); [[w.taking-charge]], 213–214. [[w.selverstone-kennedy-withdrawal]], 218 (the courses; not Nixon and Goldwater). [[w.mann-grand-delusion]], 312 (the call; Nixon and Goldwater). See [[cal.1964-01-30.vietnam]]. Names: Johnson, Nixon, Goldwater. Check: Mann has Nixon''s statement "the day before."'
    src:
      c: 6366ff09
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-knight-february-3-1964: A'
