  - id: cal.1964-02-10.civil-rights-bill
    when: Feb. 10
    date: '1964-02-10'
    place: washington
    thread: civil-rights-bill
    c: 'House passes the civil rights bill, H.R. 7152, [290–130](https://voteview.com/rollcall/RH0880128): Democrats 152–96, Republicans 138–34; Southern Democrats 7–86. Nine days on the floor, Celler and McCulloch managing; "sex" in Title VII among the amendments adopted. To the Senate.'
    n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-10-2.pdf) (1964). Civil Rights Act of 1964 (K–J Cong. II.J.2). [[w.dallek-flawed-giant]], 116–17 (the passage, to the Senate; Dallek''s count, 290 to 110, is not the roll call''s); [[w.humphrey-education-of-a-public-1976]], 273 (the House''s passage, in February; the bill to the Senate); [[w.sundquist-politics-and-policy]], 266 (the vote, 290–130); [[w.mann-walls-of-jericho]], 389–90 (the vote, 290–130; nine days of debate; Celler and McCulloch); [[w.white-making-of-the-president-1965]], 174 (Feb. 10); [[w.kotz-judgment-days]], 110 (66 hours 37 minutes over nine days); [[w.zelizer-fierce-urgency-of-now]], 101 (290–130: Democrats 152–91, Republicans 136–35); [[w.bernstein-guns-or-butter]], 55–56 (290 to 130, 152 Democrats and 138 Republicans for; Feb. 10, 22 amendments defeated and four accepted, Colmer''s among them; to the Senate); [[w.whalen-longest-debate]], 118–23 (the vote: Democrats 152–96, eighty-six of them from the eleven States, Republicans 138–34; nine days; 124 amendments offered, 34 adopted); [[w.albert-little-giant-1990]], 286 (the House passes the bill, 290 to 130: 152 Democrats for, 4 outside the South and 11 in it, Republicans 138 to 34; "sex" added; not the day, the Democrats'' 96 against or the Southern Democrats'' 7 to 86); [[w.purdum-idea-whose-time-has-2014]], 198–201 (the ninth day; the vote, 290 to 130: 152 Democrats and 138 Republicans for, 96 and 34 against (86 Democrats from the Confederacy); the "sex" and atheist amendments; Celler and McCulloch; not the seven Southern Democrats); [[w.risen-bill-of-the-century]], 161–62 (Monday, Feb. 10, the House finishes the amendments and passes the bill 290 to 130; five of the sixty-seven church-targeted members against; Celler thanks McCulloch; not the parties'' counts, the days or the managers). [[w.caro-passage-of-power]], 558–60 (the bill to the floor and passed); [[w.branch-pillar-of-fire]], 233