  - id: cal.1964-02-01.transition-and-staff
    when: Feb. 1
    date: '1964-02-01'
    thread: transition-and-staff
    also: [poverty, peace-corps, vietnam-diplomacy]
    c: 'News conference. Shriver, back from a world trip, to organize the war on poverty as Special Assistant to the President, keeping the Peace Corps; a Cabinet committee to advise him. On Vietnam: neutralization of both Vietnams "would be considered sympathetically"; while the raids go on, "the operations should be stepped up there." "I see no sentiment favoring neutralization of South Viet-Nam alone." His letter of appointment, Feb. 12: he directs the departments in the program and speaks for it to Congress.'
    n: 'The President''s News Conference, [1963–64 Pub. Papers 254](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=338) (Feb. 1, 1964), item 10, at 257 (Vietnam); Letter to Sargent Shriver on His Appointment To Direct the Program To Eliminate Poverty, [1963–64 Pub. Papers 291](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=375) (Feb. 12, 1964). [[w.dallek-flawed-giant]], 76–77; [[w.branch-pillar-of-fire]], 225–26; [[w.bernstein-guns-or-butter]], 99 (special assistant "in the organization and administration of the war on poverty program"; "Mr. Shriver will continue to serve as Director of the Peace Corps"); [[w.mann-grand-delusion]], 311 (Vietnam). To check: [[w.gillette-launching-the-war-on]]; [[w.stossel-sarge]]; Sargent Shriver OH, Aug. 20, 1980, LBJ Library; Johnson and Shriver, Feb. 1, 1964, [1:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-sargent-shriver-february-1-1964), [2:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-sargent-shriver-february-1-1964-0), [6:28 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-sargent-shriver-february-1-1964-1), and [with Moyers](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-sargent-shriver-and-bill-moyers), Conversations WH6402-01-1804, 1807, 1809, WH6402-02-1815 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment) (cited by [[w.dallek-flawed-giant]], 76); LBJ phone call with Sargent Shriver, 1:02 p.m. Feb. 1, 1964, Cit. 1804, Audiotape WH6402.01, LBJ (cited by [[w.branch-pillar-of-fire]], 226); PDD, Feb. 1, 1964, LBJ (cited by [[w.branch-pillar-of-fire]], 226). See [[cal.1964-01-08.program]]; [[cal.1964-02-01.vietnam-congress]]. The message: [[cal.1964-03-16.poverty]]. Names: Johnson, Shriver.'
