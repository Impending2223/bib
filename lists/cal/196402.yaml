    n: 'Michael V. Hazel, ["Cabell, Earle,"](https://www.tshaonline.org/handbook/entries/cabell-earle) *Handbook of Texas Online*; Ann F. Westerlin, ["Jonsson, John Erik,"](https://www.tshaonline.org/handbook/entries/jonsson-john-erik) *Handbook of Texas Online*; [Wikipedia, "Earle Cabell"](https://en.wikipedia.org/wiki/Earle_Cabell) for the date. [[w.peirce-great-plains-states-of]], 346, 349 (Jonsson asked by the council to serve, February 1964). Check: the council''s minutes. To check: [[w.payne-big-d]]; [[w.fairbanks-for-the-city-as]]; [[w.bridges-morning-glories]]; [[w.phillips-white-metropolis]]; [[w.miller-nut-country]]; [[w.minutaglio-dallas-1963]]. See [[cal.1963-11-22.assassination]]. Names: Cabell, Jonsson, Alger.'
