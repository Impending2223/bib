    tags: [name:johnson-frank-m-jr]
  - id: cal.1964-02-15.europe-and-the-alliance-cyprus
    when: Feb. 15
    date: '1964-02-15'
    thread: cyprus
    c: Cyprus. Britain goes to the Security Council first.
    n: '[FRUS 1964–68, XVI, doc. 15](https://history.state.gov/historicaldocuments/frus1964-68v16/d15) (Feb. 18). See [[cal.1964-01-25.europe-and-the-alliance]].'
