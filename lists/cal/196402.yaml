    c: 'Mao presides in the evening over the Politburo Standing Committee on the line for talks with the Romanian Workers'' Party delegation due. Mao''s three points: no inch on ending open polemics, all parties that have attacked the Chinese party to retract; no criticism of Khrushchev in print while the talks last, then resumed; the reply to the CPSU to be sent before the delegation arrives, not during or after; and the line toward Romania one of friendship and cooperation, allowing for its position, to resist Khrushchev''s great-power chauvinism.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 28, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 675–677 (the evening of Feb. 28, the day Deng and Wu came back from Hanoi; Deng''s short account of the Vietnam talks, then the line for the Romanian delegation; the Standing Committee thinks it sent by Khrushchev and wanting to sound China out; Liu Shaoqi: Khrushchev bullies the weak and fears the strong; Mao sums up three points: no inch on the polemic, no articles criticizing Khrushchev while the talks last, the reply to the CPSU to go before the Romanians come, friendship with Romania); [[w.deng-xiaoping-nianpu-1904]], III, 1801 (Feb. 28, 1964; evening, 晚; Deng at the Politburo Standing Committee meeting Mao presides over; he reports on the Sino-Vietnamese party talks; the meeting also takes up the line for the talks with the coming Romanian Workers'' Party delegation). Made public: 1999. Names: Mao Zedong, Khrushchev.'
