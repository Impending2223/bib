      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d228: all'
        - 'w.johnson-vantage-point 185: A'
  - id: cal.1964-02-07.economy
    when: Feb. 7
    date: '1964-02-07'
    thread: economy
    c: 'Senate passes the tax bill, [77–21](https://voteview.com/rollcall/RS0880264): Democrats 56–11, Republicans 21–10. Long reported it for the Finance Committee Jan. 28. Ribicoff''s credit for college costs lost, [45–48](https://voteview.com/rollcall/RS0880242); cuts in the oil depletion allowance lost, [33–61](https://voteview.com/rollcall/RS0880254) and [35–57](https://voteview.com/rollcall/RS0880256).'
    n: '[110 Cong. Rec., Senate, Feb. 7, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-8-1.pdf); [110 Cong. Rec., Senate, Jan. 28, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-14-2.pdf) (S. Rep. No. 88-830). Statement by the President Following Senate Committee Action on the Tax Bill, [1963–64 Pub. Papers 224](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=308) (Jan. 24, 1964); Statement by the President Following Senate Approval of the Tax Bill, [1963–64 Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=356) (Feb. 7, 1964). [[w.zelizer-taxing-america]], 204 (the bill through Finance and the Senate); [[w.stein-fiscal-revolution-in-america]], 453 (reported Jan. 28; passed Feb. 7). To check: [[w.mann-legacy-to-power]]; [[w.heinemann-harry-byrd-of-virginia]]. See [[cal.1963-09-25.economy]]; [[cal.1963-12-07.economy]]. Names: Long, Ribicoff.'
    tags: [name:long-russell-b, name:ribicoff-abraham]
  - id: cal.1964-02-07.cuba
    when: Feb. 7
    date: '1964-02-07'
    thread: cuba
    c: 'White House statement: the Guantanamo base to be self-sufficient, water by ship and from the sea; Cuban workers cut.'
    n: 'White House Statement Declaring United States Determination To Guarantee the Security of the Naval Base at Guantanamo, [1963–64 Pub. Papers 273](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=357) (Feb. 7, 1964). [FRUS 1964–68, XXXII, doc. 229](https://history.state.gov/historicaldocuments/frus1964-68v32/d229). See [[cal.1964-02-02.cuba]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-07.economy-2
    when: Feb. 7
    date: '1964-02-07'
    thread: economy
    c: 'Johnson to Mills, 11:36 a.m., on the tax bill before the Senate''s vote: "If it gets behind civil rights, God knows when it will be there!" To O''Brien, 7:25 p.m.: each day''s delay costs the economy $30 million.'
    n: '[Johnson and Mills, 11:36 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-february-7-1964), Conversation WH6402-08-1921; [Johnson and O''Brien, 7:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-february-8-1964), Conversation WH6402-09-1955 (Miller Center). [[w.zelizer-taxing-america]], 204. See [[cal.1963-01-24.economy]]. Names: Johnson, Mills, O''Brien.'
    tags: [name:johnson-lyndon-b, name:mills-wilbur-d, name:obrien-lawrence-f]
  - id: cal.1964-02-08.women
    when: Feb. 8
    date: '1964-02-08'
    thread: women
    also: [civil-rights-bill]
    c: 'House, in Committee of the Whole on the civil rights bill: Smith of Virginia moves to add "sex" to Title VII''s ban on discrimination in employment. Celler opposes; Griffiths speaks for it and demands tellers. Adopted, 168–133.'
    n: '[110 Cong. Rec., House, Feb. 8, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-9-1.pdf). To check: [[w.harrison-on-account-of-sex]]; [[w.whalen-longest-debate]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1963-10-11.program]]; [[cal.1964-01-09.civil-rights-bill]]. Names: Smith, Celler, Griffiths.'
    tags: [name:smith-howard-w, name:celler-emanuel, name:griffiths-martha-w]
  - id: cal.1964-02-09.europe-and-the-alliance-cyprus
    when: Feb. 9–14
    date: '1964-02-09'
    thread: cyprus
    c: Ball to London, Athens, Ankara, and Nicosia. Makarios refuses a force from NATO countries.
    n: 'FRUS 1964–68, XVI, docs. [10](https://history.state.gov/historicaldocuments/frus1964-68v16/d10), [11](https://history.state.gov/historicaldocuments/frus1964-68v16/d11). See [[cal.1964-01-25.europe-and-the-alliance]]. Names: Ball, Makarios III.'
    tags: [name:ball-george-w, name:makarios-iii]
  - id: cal.1964-02-10.civil-rights-bill
    when: Feb. 10
    date: '1964-02-10'
    thread: civil-rights-bill
    c: 'House passes the civil rights bill, H.R. 7152, [290–130](https://voteview.com/rollcall/RH0880128): Democrats 152–96, Republicans 138–34; Southern Democrats 7–86. Nine days on the floor, Celler and McCulloch managing; "sex" in Title VII among the amendments adopted. To the Senate.'
    n: '[110 Cong. Rec., House, Feb. 10, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-10-2.pdf). Civil Rights Act of 1964 (K–J Cong. II.J.2). [[w.dallek-flawed-giant]], 116–17. [[w.caro-passage-of-power]], 558–60 (the bill to the floor and passed). To check: [[w.berman-bill-becomes-a-law]]; [[w.whalen-longest-debate]]; [[w.loevy-to-end-all-segregation]]; [[w.mann-walls-of-jericho]]; [[w.civil-rights-act-of]]; [[w.finley-delaying-the-dream]]; [[w.risen-bill-of-the-century]]; [[w.purdum-idea-whose-time-has-2014]]; [[w.rosenberg-kennedy-johnson-and-the]]; [[w.humphrey-education-of-a-public-1976]]; [[w.fite-richard-b-russell-jr]]; [[w.oberdorfer-senator-mansfield-2003]]; [[w.macneil-dirksen]]; [[w.hulsey-everett-dirksen-and-his]]. See [[cal.1963-10-29.civil-rights-bill]]; [[cal.1964-01-09.civil-rights-bill]]. Names: Celler, McCulloch.'
    tags: [name:celler-emanuel, name:mcculloch-william-m]
  - id: cal.1964-02-10.medicare
    when: Feb. 10
    date: '1964-02-10'
    thread: medicare
    also: [health]
    c: 'Health message. Hospital insurance for everyone 65 and over through Social Security: a quarter of one percent more from employers and from employees, the wage base from $4,800 to $5,200, about a dollar a month for the average worker; those outside Social Security covered from general funds. Hill-Burton extended five years.'
    n: 'Special Message to the Congress on the Nation''s Health, [1963–64 Pub. Papers 275](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=359) (Feb. 10, 1964). [[w.zelizer-taxing-america]], 221–30 (hospital insurance through Social Security, 1964). See [[cal.1963-02-21.medicare]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-02-11.school-aid
    when: Feb. 11
    date: '1964-02-11'
    thread: school-aid
    c: 'Library Services and Construction Act signed, [78 Stat. 11](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg11.pdf): aid to city libraries as well as rural, and grants for building. House passage Jan. 21, [254–107](https://voteview.com/rollcall/RH0880124), after Frelinghuysen''s amendment to strike the building and city aid lost, [179–183](https://voteview.com/rollcall/RH0880122).'
    n: 'Remarks Upon Signing Bill Amending the Library Services Act, [1963–64 Pub. Papers 285](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=369) (Feb. 11, 1964). [110 Cong. Rec., House, Jan. 21, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-10-1.pdf). To check: [[w.graham-uncertain-triumph]]. See [[cal.1963-12-18.school-aid]]. Names: Johnson, Frelinghuysen.'
    tags: [name:johnson-lyndon-b, name:frelinghuysen-peter-h-jr]
  - id: cal.1964-02-11.robert-kennedy
    when: Feb. 11
    date: '1964-02-11'
    thread: robert-kennedy
    also: [elections-1964]
    c: 'The Oval Office. Johnson tells Robert Kennedy to have Paul Corbin, of the National Committee, fired: he is organizing a write-in for Kennedy in New Hampshire. Kennedy refuses; by his account, Johnson: "President Kennedy isn''t President anymore."'
    n: '[[w.caro-passage-of-power]], 583–84. Names: Johnson, Robert Kennedy.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f]
  - id: cal.1964-02-12.opinion
    when: Feb. 12
    date: '1964-02-12'
    thread: opinion
    also: [latin-america]
    c: 'Gallup, Jan. 31–Feb. 5: 64 percent have followed the dispute with Panama over the Canal Zone. Of them: a firm policy, no concessions, 45 percent; firm, but better relations, 11; concessions (more rent, a new treaty, the Canal to Panama), 9; no opinion 23.'
    n: '[[w.gallup-poll]], III, 1864.'
  - id: cal.1964-02-12.open-housing-tacoma
    when: Feb. 12
    date: '1964-02-12'
    thread: open-housing
    also: [states-and-cities]
    c: Tacoma. An open housing ordinance put to the voters by petition refused, by about three to one. Check the figures.
    n: '[Wikipedia, "Seattle movement"](https://en.wikipedia.org/wiki/Seattle_movement); [Seattle Municipal Archives, "The Seattle Open Housing Campaign"](https://www.seattle.gov/cityarchives/exhibits-and-education/digital-document-libraries/the-seattle-open-housing-campaign). To check: [[w.taylor-forging-of-a-black]].'
    tags: [state:wa, city:tacoma]
