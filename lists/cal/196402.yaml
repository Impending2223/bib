  - id: cal.1964-02-07.cuba-2
    when: Feb. 7
    date: '1964-02-07'
    thread: cuba
    also: [robert-kennedy]
    c: 'The White House, 9 a.m., Rusk presiding, and with the President at 5 p.m., on the fishing boats and Guantánamo''s water. Mann for dismissing the base''s Cuban workers; Robert Kennedy strongly against: an overreaction, hurting loyal Cubans; McCone with him. By Robert Kennedy''s later account, Mann "sounded like Barry Goldwater making a speech at the Economic Club." The workers are dismissed.'
    n: 'Valenti''s notes, [FRUS 1964–68, XXXII, doc. 229](https://history.state.gov/historicaldocuments/frus1964-68v32/d229); FitzGerald''s record of the 5 p.m. meeting, [doc. 235](https://history.state.gov/historicaldocuments/frus1964-68v32/d235). [[w.schlesinger-robert-kennedy-and-his]], 636. To check: Robert Kennedy, oral history interview by John Bartlow Martin, May 14, 1964, I, 34–37, JFK Library; Schlesinger, journal, Mar. 11, 1964 (cited by [[w.schlesinger-robert-kennedy-and-his]], 636 n.76). Check: Schlesinger''s argument over the fishermen, with an adjournment, may be an earlier meeting. See [[cal.1964-02-06.cuba]]. Names: Rusk, Kennedy, Mann, Robert Kennedy, McCone, Goldwater.'
    src:
      c: 9ab20831
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d229: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d235: A-B'
