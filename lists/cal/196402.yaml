    c: 'Mansfield to Johnson after Khánh''s coup: likely "only the second in a series"; "an indecisive, bloody and costly military involvement"; "no real military alternative for us except an abject withdrawal" if not prepared to pour in men and money. No national interest to justify turning the war into "an American war"; hope of a settlement "rests very heavily on France."'
