    thread: poverty
    also: [transition-and-staff]
    c: 'Johnson to Shriver by telephone, by Shriver''s account: at 10 a.m., will he take the program; at 11, think about it; at 11:30, "Sarge, this is your President speaking. ... I''m going to announce you as the director of the war against poverty at the news conference at twelve o''clock."'
    n: '[[w.bernstein-guns-or-butter]], 99; [[w.taking-charge]], 202–5. Check: the news conference met at 3 p.m. (its note, [1963–64 Pub. Papers 254](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=338)), and the Miller Center''s catalogue times Johnson''s calls to Shriver that day 1:02 and 2:25 p.m. To check: Sargent Shriver, Oral History Interview, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 99 n.6). See [[cal.1964-02-01.transition-and-staff]]. Names: Johnson, Shriver.'
