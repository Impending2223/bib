    when: Feb. 3
    date: '1964-02-03'
    thread: desegregation-schools
    c: New York. A one-day boycott of the city's schools against their segregation, called by Galamison's Citywide Committee for Integrated Schools, backed by CORE and the NAACP. Some 464,000 pupils out, about 45 percent. Check the count.
    n: '[[w.branch-pillar-of-fire]], 242–43. To check: [[w.taylor-knocking-at-our-own]]; Reinhold Niebuhr to Will Scarlett, Feb. 3, 1964, Box 33, RN (cited by [[w.branch-pillar-of-fire]], 242). Names: Galamison.'
