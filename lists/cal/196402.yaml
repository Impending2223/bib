    c: 'Revenue Act of 1964 signed, [78 Stat. 19](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg19.pdf), Johnson on television: an $11.5 billion cut. Individual rates 14 to 70 percent, from 20 to 91, in two steps, 1964 and 1965; corporate 48, from 52; withholding 14 percent, from 18, in eight days. Conference report, House Feb. 25, [326–83](https://voteview.com/rollcall/RH0880131); Senate Feb. 26, [74–19](https://voteview.com/rollcall/RS0880267). The Treasury''s full-year estimate of the revenue lost: $11.5 billion, 1.60 percent of GDP, 9.0 percent of receipts.'
    n: 'Statute (K–J Cong. II.J.2). Radio and Television Remarks Upon Signing the Tax Bill, [1963–64 Pub. Papers 311](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=395) (Feb. 26, 1964). [110 Cong. Rec., House, Feb. 25, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-8-2.pdf); [110 Cong. Rec., Senate, Feb. 26, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-9-2.pdf). [[w.tempalski-revenue-effects-of-major]], Table 1, p. 15; [[w.zelizer-taxing-america]], 204–05 (the rates); [[w.stein-fiscal-revolution-in-america]], 452–53 (the signing); [[w.caro-passage-of-power]], 552–57 (the bill through Finance; not the signing). To check: [[w.michelmore-tax-and-spend]]. See [[cal.1963-01-24.economy]]; [[cal.1964-02-07.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, bill:revenue-1964]
