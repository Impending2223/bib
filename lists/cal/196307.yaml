  - id: cal.1963-07-02.march-on-washington
    when: July 2
    date: '1963-07-02'
    thread: march-on-washington
    also: [civil-rights-organizations]
    c: 'New York. The leaders on the march; the Council for United Civil Rights Leadership has $800,000 to divide. Rustin''s plan: jobs, a higher minimum wage and fair employment first, the bill second; 100,000 expected; $65,000. Wilkins blocks Rustin as director; Randolph named, and he names Rustin his deputy. The co-chairmen Randolph, King, Wilkins, Whitney Young, Farmer, Lewis. No sit-ins, no civil disobedience.'
    n: '[[w.garrow-bearing-the-cross]], 276–77; [[w.branch-parting-the-waters]], 847–48. Check: Branch, 847–48: the Roosevelt Hotel; Wilkins clears the room for chiefs only, "This one stays. This one goes," Rustin, Shuttlesworth, Forman, Norman Hill and Cleveland Robinson out; six remain; "Yes, Phil, you should lead it"; to Randolph of Rustin, "don''t expect me to do anything about it when the trouble starts.". To check: New York Times, July 2, 1963, 14; July 3, 1963, 10; Rustin to Farmer et al., "Proposed Plans . . .," July 2, 1963, Bayard Rustin Papers; CUCRL finance sheets, SNCC Papers, boxes 23 and 111, King Center; American Friends Service Committee, Community Relations Executive Committee, minutes, July 3, 1963, American Friends Service Committee Papers, Philadelphia (cited by [[w.garrow-bearing-the-cross]], 277 n.51). See [[cal.1963-03-23.march-on-washington]]. Names: Rustin, Wilkins, Randolph, King, Young, Farmer, Lewis.'
