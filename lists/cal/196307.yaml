entries:
  - id: cal.1963-07-01.civil-rights-bill
    when: July 1–2
    date: '1963-07-01'
    thread: civil-rights-bill
    also: [desegregation-public-places, robert-kennedy]
    c: Magnuson's Commerce Committee opens hearings on S. 1732, the public accommodations title. Robert Kennedy first.
    n: '*Civil Rights—Public Accommodations: Hearings on S. 1732 Before the S. Comm. on Commerce*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg21544p1), [pt. 2](https://www.govinfo.gov/app/details/CHRG-88shrg21544p2) (1963). To check: [[w.whalen-longest-debate]]; [[w.risen-bill-of-the-century]]. See [[cal.1963-06-11.civil-rights-bill]]. Names: Magnuson, Robert F. Kennedy.'
    tags: [name:kennedy-robert-f, name:magnuson-warren-g]
  - id: cal.1963-07-01.legislatures-il
    when: July 1
    date: '1963-07-01'
    thread: legislatures
    c: Illinois. Kerner vetoes the Republican legislature's map of the House's districts, "unfair." Under the amendment of 1954, a commission of five from each party to draw the map, appointed Aug. 14; it deadlocks. Failing a map, the House to be elected at large.
    n: '[Wikipedia, "1964 Illinois House of Representatives election"](https://en.wikipedia.org/wiki/1964_Illinois_House_of_Representatives_election), from the *Illinois Blue Book* and the press (Check: the veto message, *Journal of the House*, 1963). To check: [[w.mcdowell-orange-ballot-election]]; [[w.barnhart-kerner]]; [[w.politics-of-reapportionment]]. Names: Kerner.'
    tags: [state:il, name:kerner-otto]
  - id: cal.1963-07-01.middle-east-yemen
    when: July 1
    date: '1963-07-01'
    thread: middle-east-yemen
    c: 'Kennedy to Faisal: the air unit dispatched.'
    n: '[FRUS 1961–63, XVIII, doc. 286](https://history.state.gov/historicaldocuments/frus1961-63v18/d286). See [[cal.1963-06-13.middle-east]]. Names: Kennedy, Faisal ibn Abd al-Aziz Al Saud.'
    tags: [name:kennedy-john-f, name:faisal-ibn-abd-al-aziz-al-saud]
  - id: cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe
    when: July 1–2
    date: '1963-07-01'
    thread: europe-and-the-alliance-kennedy-in-europe
    c: Kennedy in Rome, with Segni, and at NATO's headquarters in Naples. Home July 2.
    n: 'Joint Statement Following Discussion With President Segni in Rome, [1963 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=611) (July 2, 1963); Remarks in Naples at NATO Headquarters, [1963 Pub. Papers 550](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=608) (July 2, 1963). See [[cal.1963-06-23.europe-and-the-alliance]]. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-02.march-on-washington
    when: July 2
    date: '1963-07-02'
    thread: march-on-washington
    also: [civil-rights-organizations]
    c: 'New York. The leaders on the march; the Council for United Civil Rights Leadership has $800,000 to divide. Rustin''s plan: jobs, a higher minimum wage and fair employment first, the bill second; 100,000 expected; $65,000. Wilkins blocks Rustin as director; Randolph named, and he names Rustin his deputy. The co-chairmen Randolph, King, Wilkins, Whitney Young, Farmer, Lewis. No sit-ins, no civil disobedience.'
    n: '[[w.garrow-bearing-the-cross]], 276–77. See [[cal.1963-03-23.march-on-washington]]. Names: Rustin, Wilkins, Randolph, King, Young, Farmer, Lewis.'
    tags: [name:rustin-bayard, name:wilkins-roy, name:randolph-a-philip, name:king-martin-luther-jr, name:young-whitney-m-jr, name:farmer-james, name:lewis-john, state:ny, city:nyc]
  - id: cal.1963-07-03.king
    when: July 3
    date: '1963-07-03'
    thread: king
    also: [civil-rights-the-executive]
    c: 'King to O''Dell, at Burke Marshall''s pressing after the *Birmingham News*''s story of June 30: his "temporary resignation" of November made permanent. Dora McDonald sends Robert Kennedy a copy the same day. Levison breaks off direct contact with King; Clarence Jones their go-between.'
    n: 'King to O''Dell, and McDonald to Robert Kennedy, July 3, 1963, as [[w.garrow-bearing-the-cross]], 275, 675 n.49, cites them. Names: King, O''Dell, Marshall, Robert F. Kennedy, Levison.'
    tags: [name:king-martin-luther-jr, name:odell-jack-h, name:marshall-burke, name:kennedy-robert-f, name:levison-stanley-d]
  - id: cal.1963-07-04.elections-1964
    when: July 4
    date: '1963-07-04'
    thread: elections-1964
    also: [goldwater]
    c: Draft Goldwater rally, National Guard Armory, Washington. Police count over 7,000. Tower the speaker; O'Donnell and White on the platform. Goldwater in Arizona.
    n: '[[w.perlstein-before-the-storm]], 222 (the rally, the crowd, White), 194 (Goldwater at Prescott each July 4). To check: [[w.white-suite-3505]]; [[w.novak-agony-of-the-g]]. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater, Tower, O''Donnell, White.'
    tags: [name:goldwater-barry-m, name:tower-john-g, name:odonnell-peter, name:white-f-clifton, ok:result-form]
  - id: cal.1963-07-04.middle-east
    when: July 4
    date: '1963-07-04'
    thread: middle-east-dimona
    c: 'Dimona. Ben Gurion resigned June 16; Eshkol Prime Minister June 26. Kennedy to Eshkol: visits as near as may be to international standards, one early this summer, another in June 1964, then every six months.'
    n: '[FRUS 1961–63, XVIII, doc. 289](https://history.state.gov/historicaldocuments/frus1961-63v18/d289). Made public: FRUS 1961–63, XVIII (1995). See [[cal.1963-05-18.middle-east]]. Names: Ben Gurion, Eshkol, Kennedy.'
    tags: [name:kennedy-john-f, name:ben-gurion-david, name:eshkol-levi]
  - id: cal.1963-07-07.vietnam
    when: July 7
    date: '1963-07-07'
    thread: vietnam
    c: 'Thích Tâm Châu, for the Intersect Committee for the Defense of Buddhism, writes the American ambassador: the police have bullied foreign reporters that morning; "a St. Barthelemy Night is not to be excluded"; Xá Lợi pagoda to be put under "a discreet protection of the U.S. forces now available in Saigon." Received July 8. Trueheart: word to go to Tâm Châu that the United States cannot meet the request.'
    n: '[FRUS 1961–63, III, doc. 213](https://history.state.gov/historicaldocuments/frus1961-63v03/d213) (Trueheart, July 9: the letter''s text). [[w.miller-misalliance]], 274 (the request, July 7; refused). See [[cal.1963-05-08.vietnam]]. Names: Tâm Châu, Trueheart.'
    src:
      c: 79af2577
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d213: all'
        - 'w.miller-misalliance 274: A, C, E'
        - 'via w.miller-misalliance 274 n.93: all'
    tags: [name:tam-chau, name:trueheart-william-c, place:saigon]
  - id: cal.1963-07-09.railroads
    when: July 9–10
    date: '1963-07-09'
    thread: railroads
    c: 'The carriers'' new work rules due at midnight July 10; the brotherhoods to strike. Kennedy asks both to put the dispute to Justice Goldberg for binding decision; the unions refuse. Rules and strike put off to July 29. A subcommittee of the Labor-Management Advisory Committee to report by July 22: Wirtz chairman, Hodges, Meany.'
    n: '[Statement by the President Urging Railroad Management and Union Leaders To Arbitrate Their Dispute](https://www.presidency.ucsb.edu/documents/statement-the-president-urging-railroad-management-and-union-leaders-arbitrate-their) (July 9, 1963). Radio and Television Statement Following Action To Postpone the Nationwide Railroad Strike, [1963 Pub. Papers 561](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=619) (July 10, 1963). CQ Almanac 1963 (K–J Cong. II.L). See [[cal.1963-04-03.railroads]]. Names: Goldberg, Wirtz, Hodges, Meany.'
    tags: [name:kennedy-john-f, name:goldberg-arthur-j, name:wirtz-w-willard, name:hodges-luther-h, name:meany-george]
  - id: cal.1963-07-10.opinion
    when: July 10
    date: '1963-07-10'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: a law giving Negroes the right to be served in hotels, restaurants, theaters, and the like, 49 percent for, 42 against. Whites outside the South 55 for; Southern whites 12 for, 82 against.'
    n: '[[w.gallup-poll]], III, 1827.'
  - id: cal.1963-07-11.desegregation-schools-okc
    when: July 11
    date: '1963-07-11'
    thread: desegregation-schools
    c: Oklahoma City. Judge Bohanon finds Robert Dowell's transfer to Northeast High School refused because of his race. The school board to stop its minority-to-majority transfers and to file within ninety days a plan to integrate pupils and teachers.
    n: '*Dowell v. School Board of Oklahoma City Public Schools*, [219 F. Supp. 427](https://static.case.law/f-supp/219/case-pdfs/0427-01.pdf) (W.D. Okla. 1963). To check: [[w.morgan-oklahoma-politics-and-policies]]. Names: Bohanon.'
    tags: [state:ok, city:oklahoma-city, name:bohanon-luther]
  - id: cal.1963-07-11.vietnam
    when: July 11
    date: '1963-07-11'
    thread: vietnam
    c: 'Nhu meets the generals at the Joint General Staff. By four of their reports: he asks their support, criticizes the government, promises "active" assignments; by one, he speaks of a "lightning" coup.'
    n: '[FRUS 1961–63, III, doc. 220](https://history.state.gov/historicaldocuments/frus1961-63v03/d220) (Rice to Rusk, July 15). [[w.miller-misalliance]], 286–87 (the meeting; a coup "lightning fast," before Lodge came). To check: CIA information reports TDCS DB-3/655,517, July 12, 1963, and TDCS DB-3/655,523, July 13, 1963, DDRS (cited by [[w.miller-misalliance]], 286 n.23). See [[cal.1963-05-08.vietnam]]. Names: Nhu.'
    src:
      c: 4e6272d3
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d220: all'
        - 'w.miller-misalliance 286–87: A, C'
        - 'via w.miller-misalliance 286 n.23a: all'
        - 'via w.miller-misalliance 286 n.23b: A, C'
        - 'via w.miller-misalliance 286 n.23c: A, C'
    tags: [name:ngo-dinh-nhu, place:saigon]
  - id: cal.1963-07-12.civil-rights-bill
    when: July 12
    date: '1963-07-12'
    thread: civil-rights-bill
    also: [desegregation-public-places]
    c: Barnett before the Commerce Committee, against S. 1732.
    n: '*Civil Rights—Public Accommodations: Hearings on S. 1732 Before the S. Comm. on Commerce*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg21544p1), [pt. 2](https://www.govinfo.gov/app/details/CHRG-88shrg21544p2) (1963). See [[cal.1963-07-01.civil-rights-bill]]. Names: Barnett.'
    tags: [name:barnett-ross-r]
  - id: cal.1963-07-14.elections-1964
    when: July 14
    date: '1963-07-14'
    thread: elections-1964
    c: 'Rockefeller''s statement against the "radical right": the Young Republicans'' convention at San Francisco in June won by "tactics of totalitarianism"; the party would "destroy itself" on the strategy "seriously proposed" for 1964. Check the wording.'
    n: 'To check: [[w.smith-on-his-own-terms]]; [[w.kabaservice-rule-and-ruin]]; [[w.novak-agony-of-the-g]]. See [[cal.1963-04-08.elections-1964]]. Names: Nelson Rockefeller.'
    tags: [name:rockefeller-nelson]
  - id: cal.1963-07-14.opinion
    when: July 14
    date: '1963-07-14'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill]
    c: 'Gallup, June 21–26: the Kennedy administration pushing integration too fast, 41 percent; not fast enough, 14; about right, 31. Southern whites, 77 too fast.'
    n: '[[w.gallup-poll]], III, 1828. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-15.testing
    when: July 15
    date: '1963-07-15'
    thread: testing
    c: 'Moscow talks open: Harriman, Hailsham, Gromyko. Khrushchev at the first session withdraws his offer of inspections and tables a ban in three environments, with a non-aggression pact.'
    n: 'FRUS 1961–63, VII, docs. [319](https://history.state.gov/historicaldocuments/frus1961-63v07/d319) (Harriman''s instructions, July 10), [325](https://history.state.gov/historicaldocuments/frus1961-63v07/d325). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 346–47 (Harriman''s mission, from July 15; Khrushchev''s terms in the month before). To check: [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.oliver-kennedy-macmillan-and-the]]; [[w.abramson-spanning-the-century]]. See [[cal.1963-06-10.testing]]. Names: Harriman, Hailsham, Khrushchev, Gromyko.'
    src:
      c: 12e0c871
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d319: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 346–47: A-B'
    tags: [name:harriman-w-averell, name:hailsham-quinton-m-h, name:gromyko-andrei, name:khrushchev-nikita-s]
  - id: cal.1963-07-15.africa
    when: July 15–16
    date: '1963-07-15'
    thread: africa
    also: [peace-corps]
    c: 'Nyerere, President of Tanganyika, at the White House: the Addis Ababa conference, and an East African federation. The Peace Corps to send 80 teachers to Tanganyika in November.'
    n: 'Remarks of Welcome at the White House to President Nyerere of Tanganyika, [1963 Pub. Papers 561](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=619) (July 15, 1963); Joint Statement Following Discussions With President Nverere of Tanganyika, [1963 Pub. Papers 565](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=623) (July 16, 1963). To check: [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1963-05-22.africa]]. Names: Nyerere.'
    tags: [name:nyerere-julius-k, name:kennedy-john-f]
  - id: cal.1963-07-15.civil-rights-bill
    when: July 15
    date: '1963-07-15'
    thread: civil-rights-bill
    also: [desegregation-public-places]
    c: Wallace before the Commerce Committee, against S. 1732.
    n: '*Civil Rights—Public Accommodations: Hearings on S. 1732 Before the S. Comm. on Commerce*, 88th Cong., [pt. 1](https://www.govinfo.gov/app/details/CHRG-88shrg21544p1), [pt. 2](https://www.govinfo.gov/app/details/CHRG-88shrg21544p2) (1963). See [[cal.1963-07-01.civil-rights-bill]]. Names: Wallace.'
    tags: [name:wallace-george-c]
  - id: cal.1963-07-15.mississippi
    when: July 15
    date: '1963-07-15'
    thread: mississippi
    also: [voting-rights]
    c: '*United States v. Lynd*. The Fifth Circuit, Brown, Wisdom and Bell: the district court erred in denying the Government a preliminary injunction against Theron Lynd, Forrest County''s registrar; reversed and remanded for trial, the circuit''s own injunction of Apr. 10, 1962, to stand until the district court disposes of the case. The contempt proceedings against Lynd under submission.'
    n: '*United States v. Lynd*, [321 F.2d 26](https://static.case.law/f2d/321/case-pdfs/0026-01.pdf) (5th Cir. 1963); the injunction: [301 F.2d 818](https://static.case.law/f2d/301/case-pdfs/0818-01.pdf) (5th Cir. 1962). [[w.dittmer-local-people]], 179–80, 184 (180: the injunction of 1962; 184: the judgment of July 15). To check: *United States v. Theron Lynd*: Judgment and Order of Civil Contempt, July 15, 1963, SNCC Papers, reel 38; *New York Times*, July 16, 1963 (cited by [[w.dittmer-local-people]], 184 n.29). See [[cal.1962-05.mississippi-ms]]. Check: Dittmer, 184, has the court find Lynd in civil contempt the same day and give him ten days to register forty-three Negroes he had refused. Names: Brown, Wisdom, Bell, Lynd.'
    src:
      c: 7187c0c8
      rows:
        - 'https://static.case.law/f2d/321/case-pdfs/0026-01.pdf: all'
        - 'https://static.case.law/f2d/301/case-pdfs/0818-01.pdf: all'
        - 'w.dittmer-local-people 180: D'
        - 'w.dittmer-local-people 184: C-D'
        - 'via w.dittmer-local-people 184 n.29b: C-D'
    tags: [state:ms, city:hattiesburg, name:brown-john-r, name:wisdom-john-minor, name:bell-griffin-b, name:lynd-theron-c]
  - id: cal.1963-07-16.economy
    when: July 16–17
    date: '1963-07-16'
    thread: economy
    c: The Board (Martin) approves the discount rate from 3 to 3½ percent at seven Reserve Banks, New York among them, effective July 17; the other five by July 26. The Regulation Q ceiling on time deposits of 90 days to a year raised to 4 percent, from 2½ and 3½. The first change in the rate since 1960; the stated aim, to check short-term capital outflows.
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697242) (July 16, 1963). [*Federal Reserve Bulletin*, Sept. 1963](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/september-1963-21345), pp. 1264–65. To check: [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.coombs-arena-of-international-finance]]. See [[cal.1961-02-20.economy]]. Names: Martin.'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1963-07-17.civil-rights-bill
    when: July 17
    date: '1963-07-17'
    thread: civil-rights-bill
    c: News conference. The March on Washington "a peaceful assembly calling for a redress of grievances," not "a march on the Capital." Warns against demonstrations "which could lead to bloodshed." Wants the tax and civil rights bills both this year.
    n: The President's News Conference, [1963 Pub. Papers 566](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=624) (July 17, 1963). See [[cal.1963-06-11.civil-rights-bill]].
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-17.opinion
    when: July 17
    date: '1963-07-17'
    thread: opinion
    also: [desegregation-public-places]
    c: 'Gallup, June 21–26: mass demonstrations by Negroes will hurt their cause, 60 percent; help it, 27. Race relations in the next six months, worse 63, better 21.'
    n: '[[w.gallup-poll]], III, 1828.'
  - id: cal.1963-07-17.legislatures-ok
    when: July 17
    date: '1963-07-17'
    thread: legislatures
    c: The three-judge court reapportions the Oklahoma Legislature itself, by "Model C" of the University of Oklahoma's Bureau of Government Research, for elections through 1972 unless the Legislature so elected acts. The Legislature's 1963 act and resolution held no remedy.
    n: '*Moss v. Burkhart*, [220 F. Supp. 149](https://static.case.law/f-supp/220/case-pdfs/0149-01.pdf) (W.D. Okla. 1963). See [[cal.1962-06-19.legislatures-ok]].'
    tags: [state:ok]
  - id: cal.1963-07-17.state-constitutions-nd
    when: July 17
    date: '1963-07-17'
    thread: state-constitutions
    also: [state-and-city-finance, cities-and-housing]
    c: North Dakota, special election on five laws referred to the people; all disapproved. A graduated income tax, 19,021 to 108,575, 14.9 percent; an adjusted income tax, 19,219 to 108,057, 15.1 percent; withholding of income taxes, 25,673 to 101,100, 20.3 percent; a tax levy for further urban renewal projects, 23,399 to 98,553, 19.2 percent; limits on school district levies, 24,859 to 98,328, 20.2 percent.
    n: '[*Statement of the Findings of the State Board of Canvassers, Special Election Held July 17, 1963*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1963-07-17-special.pdf). To check: [[w.peirce-great-plains-states-of]].'
    tags: [state:nd]
  - id: cal.1963-07-18.economy
    when: July 18
    date: '1963-07-18'
    thread: economy
    c: Balance of payments message. An interest equalization tax on Americans' purchases of foreign securities, 2.75 to 15 percent, from that day through 1965. A $500 million IMF standby. Federal spending abroad to fall about $1 billion by 1965. The Fed has raised the discount rate from 3 to 3½ percent.
    n: 'Special Message to the Congress on Balance of Payments, [1963 Pub. Papers 574](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=632) (July 18, 1963). To check: [[w.gavin-gold-dollars-and-power]]; [[w.roosa-dollar-and-world-liquidity]]; [[w.solomon-international-monetary-system-1945]]; [[w.coombs-arena-of-international-finance]]; [[w.meltzer-history-of-the-federal]]; [[w.eichengreen-globalizing-capital]]; [[w.kunz-butter-and-guns]]. See [[cal.1961-01-05.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-18.latin-america
    when: July 18
    date: '1963-07-18'
    thread: latin-america
    c: Chamizal settled with Mexico, the 1911 arbitral award given effect. Convention, [15 U.S.T. 21](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-15-1/lltreaties-15-1.pdf#page=29), [505 U.N.T.S. 185](https://treaties.un.org/doc/Publication/UNTS/Volume%20505/volume-505-I-7374-English.pdf), signed in Mexico City, Aug. 29.
    n: 'Statement by the President on the Solution of the Chamizal Border Dispute With Mexico, [1963 Pub. Papers 584](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=642) (July 18, 1963). Convention for the Solution of the Problem of the Chamizal (K–J Cong. II.J.2). To check: [[w.liss-century-of-disagreement]]; [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1962-06-29.latin-america]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-18.poverty-nc
    when: July 18
    date: '1963-07-18'
    thread: poverty
    c: 'The North Carolina Fund incorporated by Sanford and others: a private nonprofit corporation, for five years, for experiments against poverty in education, health, job training, housing and community development, and for racial equality. The Ford Foundation commits $7 million.'
    n: '[*Messages, Addresses, and Public Papers of Terry Sanford, Governor of North Carolina, 1961–1965* (1966), 601](https://archive.org/details/messagesaddresse00sanf/page/601/mode/1up). [[w.korstad-to-right-these-wrongs]], 82. To check: [[w.covington-terry-sanford]]. Names: Sanford.'
    tags: [state:nc, name:sanford-terry]
  - id: cal.1963-07-18.civil-rights-the-executive
    when: July 18
    date: '1963-07-18'
    thread: civil-rights-the-executive
    c: 'The equal employment committee''s eighth meeting, Johnson presiding. Robert Kennedy questions Webb on NASA''s equal employment staff, "one and a half men" in Washington: "I don''t think I am able to get the answers, to tell you the truth."'
    n: 'Committee on Equal Employment Opportunity, Transcript of Eighth Meeting, July 18, 1963, 33–38, Johnson Papers (LBJ Library) (Check the file). [[w.caro-passage-of-power]], 263–64 (the meeting, Johnson presiding; Kennedy''s questions and words to Webb; not the meeting''s number or "one and a half men"). See [[cal.1963-05-29.civil-rights-the-executive]]. Check: [[w.schlesinger-robert-kennedy-and-his]], 335–36, puts the meeting "twenty days" after May 29; his note gives July 18. Names: Robert Kennedy, Webb, Johnson. Check: the meeting''s number and "one and a half men".'
    src:
      c: 55e11ed4
      rows:
        - 'w.caro-passage-of-power 263: A'
        - 'w.caro-passage-of-power 264: B'
    tags: [name:kennedy-robert-f, name:webb-james-e, name:johnson-lyndon-b]
  - id: cal.1963-07-18.open-housing-ca
    when: July 18
    date: '1963-07-18'
    thread: open-housing
    c: California. Brown signs the Rumford Fair Housing Act, [Cal. Stats. 1963, ch. 1853](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1963/63Vol2_Chapters.pdf#page=1322). Filed with the Secretary of State July 19.
    n: 'The chapter''s head, 3823: approved July 18, filed July 19. See [[cal.1963-06-21.open-housing-ca]]. Names: Brown.'
    tags: [state:ca, name:brown-edmund-g]
