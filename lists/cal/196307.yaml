  - id: cal.1963-07-02.testing
    when: July 2
    date: '1963-07-02'
    thread: testing
    c: 'Khrushchev in East Berlin: the Soviet Union willing to conclude an agreement banning tests in the atmosphere, outer space and under water; "the question of inspection no longer arises." Ball to Kennedy: "a three-environment ban with no moratorium on underground tests"; the question whether a NATO–Warsaw Pact non-aggression treaty goes with it.'
    n: '[[w.reeves-president-kennedy]], 540–41; [[w.rusk-as-i-saw-it-1990]], 256 (the speech); [[w.sorensen-kennedy]], 736 (Khrushchev''s speech); [[w.fursenko-khrushchevs-cold-war]], 526; [[w.poole-joint-chiefs-of-staff]], 103. [[w.ball-past-has-another-pattern]], 200 (at Andrews, Ball''s memorandum). Check: the speech''s text, none released by the Soviets that day. Names: Khrushchev, Ball, Kennedy.'
    src:
      c: 800421ae
      rows:
