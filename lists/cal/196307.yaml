  - id: cal.1963-07-01.legislatures-il
    when: July 1
    date: '1963-07-01'
    thread: legislatures
    c: Illinois. Kerner vetoes the Republican legislature's map of the House's districts, "unfair." Under the amendment of 1954, a commission of five from each party to draw the map, appointed Aug. 14; it deadlocks. Failing a map, the House to be elected at large.
    n: '[Wikipedia, "1964 Illinois House of Representatives election"](https://en.wikipedia.org/wiki/1964_Illinois_House_of_Representatives_election), from the *Illinois Blue Book* and the press (Check: the veto message, *Journal of the House*, 1963). To check: [[w.mcdowell-orange-ballot-election]]; [[w.barnhart-kerner]]; [[w.politics-of-reapportionment]]. Names: Kerner.'
    tags: [state:il, name:kerner-otto]
    short: Kerner's veto
