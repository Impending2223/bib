    when: July 19
    date: '1963-07-19'
    thread: opinion
    also: [desegregation-schools, desegregation-public-places]
    c: 'Gallup, June 21–26, in the South: whites and Negroes will one day share schools, restaurants, and public accommodations, 83 percent; within five years, 49. Peacefully, 21; with some strife, 42; with a great deal, 30.'
    n: '[[w.gallup-poll]], III, 1829.'
  - id: cal.1963-07-21.opinion
    when: July 21
    date: '1963-07-21'
    thread: opinion
    c: 'Gallup, June 21–26: Negroes here have as good a chance as whites at any job they are qualified for, 43 percent; not as good, 48.'
    n: '[[w.gallup-poll]], III, 1829.'
  - id: cal.1963-07-21.states-and-cities-us
    when: July 21–24
    date: '1963-07-21'
    thread: states-and-cities
    also: [civil-rights-bill]
    c: 'Governors'' Conference at Miami Beach. July 22: Hatfield''s appeal against a five-minute limit on the civil rights discussion and a bar on motions, lost 14–34, Rockefeller seconding. The Executive Committee''s rule of unanimity for resolutions replaced, on Sawyer''s motion, by none: the Resolutions Committee abolished, 33–16; Hatfield''s two-thirds rule with closure falls with it. July 23, civil rights discussed without a vote.'
    n: '[*Proceedings of the Governors'' Conference, 1963*, 11–28](https://www.nga.org/wp-content/uploads/2026/03/1963_Annual_Meeting-compressed.pdf#page=30). See [[cal.1962-07-03.states-and-cities-us]]. Names: Hatfield, Nelson Rockefeller, Sawyer.'
    tags: [name:hatfield-mark-o, name:rockefeller-nelson, name:sawyer-grant]
  - id: cal.1963-07-22.railroads
    when: July 22
    date: '1963-07-22'
    thread: railroads
    c: Message on the dispute. Disputed rules to the ICC for two years; no strike or lockout over them. Not compulsory arbitration, he says. Commerce committees hold hearings, July 23–Aug. 2; the deadline moved to Aug. 29.
    n: 'Special Message to the Congress on the Railroad Rules Dispute, [1963 Pub. Papers 586](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=644) (July 22, 1963). *Railroad Work Rules Dispute: Hearings on S.J. Res. 102 Before the S. Comm. on Commerce*, 88th Cong. (1963); *Railroad Work Rules Dispute: Hearings on H.J. Res. 565 Before the H. Comm. on Interstate and Foreign Commerce*, 88th Cong. (1963). See [[cal.1963-07-09.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-07-23.program
    when: July 23
    date: '1963-07-23'
    thread: immigration
    c: Immigration message. National-origins quotas cut a fifth a year, gone in five. Visas by skill and family, first come first served. The Asia-Pacific triangle repealed.
    n: 'Letter to the President of the Senate and to the Speaker of the House on Revision of the Immigration Laws, [1963 Pub. Papers 594](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=652) (July 23, 1963). Immigration and Nationality Act Amendments (K–J Cong. II.J.2). To check: [[w.yang-one-mighty-and-irresistible]]; [[w.reimers-still-the-golden-door]]; [[w.tichenor-dividing-lines]]; [[w.ngai-impossible-subjects]]; [[w.zolberg-nation-by-design]].'
    tags: [name:kennedy-john-f]
