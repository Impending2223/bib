    when: July 2
    date: '1963-07-02'
    thread: civil-rights-organizations
    also: [civil-rights-bill]
    c: 'New York, the Roosevelt Hotel, the NAACP''s host: several hundred from the Leadership Conference on Civil Rights, seventy-four organizations, on lobbying for H.R. 7152. Wanted besides: an FEPC with enforceable orders, the Attorney General''s power to intervene, all public accommodations, small stores too. A Washington office in space Reuther offers; Aronson its manager; Rauh, Biemiller, Conway, Fauntroy and Clarence Mitchell to lobby.'
    n: '[[w.whalen-longest-debate]], 14–15, 228. To check: the meeting''s memorandum, NAACP Papers, Library of Congress; Joseph L. Rauh, unpublished manuscript, 6–8 (cited by [[w.whalen-longest-debate]], 246). Names: Reuther, Rauh, Biemiller, Conway, Clarence Mitchell.'
