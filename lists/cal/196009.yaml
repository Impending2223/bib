    c: 'Mao 毛泽东 on Tan Zhenlin''s 谭震林 report of Sept. 23 on agriculture in Shanxi 山西, Hebei 河北, Henan 河南, Shandong 山东 and Liaoning 辽宁: the Secretariat to discuss it seriously; if it is workable, to be sent down; the South to let the North have tractors and other heavy implements first, or the problem cannot be solved. Sent to Li Fuchun 李富春 to handle. Tan''s report: of 493.64 million mu, 37 percent plowed by animals, 8.1 percent by machines; nearly 40 percent of the tractors and pumps of Shanxi, Hebei, Shandong and Henan idle; a request for 100,000 standard tractors in two years.'
