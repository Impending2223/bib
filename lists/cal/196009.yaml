    thread: governors
    also: [elections-1960]
    c: 'Minnesota, governor. DFL primary: Governor Freeman over one other, 264,571 to 33,452, 88.8 percent. Republican: Andersen, a former State Senator, unopposed.'
    n: '[*Report of the State Canvassing Board, Primary Election, September 13, 1960*](https://www.lrl.mn.gov/docs/2023/Other/232069/1960.pdf). Votes: [Wikipedia, "1960 Minnesota gubernatorial election"](https://en.wikipedia.org/wiki/1960_Minnesota_gubernatorial_election). To check: [[w.andersen-mans-reach]]; [[w.peirce-great-plains-states-of]]. Names: Freeman, Andersen.'
