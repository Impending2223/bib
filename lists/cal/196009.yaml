  - id: cal.1960-09.cuba
    when: Sept.
    date: 1960-09
    place: nyc
    thread: cuba
    c: 'At the Plaza Hotel in New York, Robert Maheu introduces John Rosselli to the chief of the CIA Office of Security''s support division: the Agency wants Castro killed, through men with gambling interests in Havana. Bissell had asked Sheffield Edwards in August to find someone. The meeting Sept. 14, by the Inspector General''s report of 1967; during Castro''s stay at the UN, Sept. 18–28, by Rosselli.'
    n: '[S. Rep. No. 94-465, 74–76 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85). Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975; in part, Drew Pearson and Jack Anderson''s column, Mar. 7, 1967 (the day: [FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315), editorial note; Check: Anderson''s part). [[w.jones-bay-of-pigs]], 21, 23–24 (21: Bissell to Edwards, August; 23–24: the meeting at the Plaza, while Castro was at the UN); [[w.schlesinger-robert-kennedy-and-his]], 482–83 (the CIA commissioned Maheu to "put out the contract" on Castro, assassination presented to him as "a necessary ingredient" of the invasion plan; Maheu brought in Rosselli, Rosselli Giancana, Giancana Trafficante; the case officers'' contacts made before Dulles was told; not the Plaza Hotel, Edwards or the day). To check: [[w.thomas-very-best-men]]; [[w.bohning-castro-obsession]]; [[w.hersh-dark-side-of-camelot]]; [[w.wyden-bay-of-pigs]]; Osborn to the Director of Central Intelligence, Nov. 9, 1970, in the CIA''s "Family Jewels," May 16, 1973, 44 (cited by [[w.jones-bay-of-pigs]], 21 n.29); Rosselli, testimony, June 24, 1975, 9, 59, Church Committee (cited by [[w.jones-bay-of-pigs]], 24 n.37). Names: Maheu, Rosselli, Bissell, Edwards, Castro.'
    src:
      c: fad59ba1
      rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85: all'
        - 'w.jones-bay-of-pigs 21: B'
        - 'w.jones-bay-of-pigs 23–24: A, D'
        - 'via w.jones-bay-of-pigs 21 n.29a: B'
        - 'via w.jones-bay-of-pigs 21 n.29b: B'
        - 'via w.jones-bay-of-pigs 24 n.37a: A, D'
        - 'via w.jones-bay-of-pigs 24 n.37b: A, D'
        - 'w.schlesinger-robert-kennedy-and-his 482–83: ?'
    tags: [name:maheu-robert-a, name:rosselli-john, name:bissell-richard-m-jr, name:edwards-sheffield, name:castro-fidel]
  - id: cal.1960-09-01.congress
    when: Sept. 1
    date: '1960-09-01'
    place: washington
    thread: congress
    c: 86th Congress adjourns sine die, ending the session Johnson and Rayburn reconvened Aug. 8, after the conventions. No agreement in conference on the minimum wage; no school or housing bill out of the House Rules Committee; medical care for the aged through Social Security refused. Kerr–Mills and the Latin American fund passed.
    n: 'H. Con. Res. 745, [74 Stat. B12](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf). [[w.sundquist-politics-and-policy]], 307, 513 n.6 (Kerr–Mills passed and Medicare through Social Security refused, 307; no conference on the minimum wage, no school or housing bill from Rules, 513 n.6); [[w.white-making-of-the-president]], 249, 251 (the session; Kennedy''s measures dead in the House); [[w.mcpherson-political-education]], 179 (aid to schools and medical care for the aged, "the major initiatives in the Democratic platform, ... put to an early test and failed ignominiously"). To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]. Names: Johnson, Rayburn, Kerr, Mills.'
    src:
      c: 3d428fae
      rows:
        - 'https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf: all'
        - 'w.sundquist-politics-and-policy 307: D-E'
        - 'w.sundquist-politics-and-policy 513 n.6: B-C'
        - 'w.white-making-of-the-president 249, 251: A, D'
        - 'w.mcpherson-political-education 179: C-D'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, appropriations:86-2, name:kerr-robert-s, name:mills-wilbur-d]
