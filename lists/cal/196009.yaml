    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow. Second session. Kozlov speaks first: the Reply is grave and cannot be accepted; the differences are the Chinese Party''s doing; since Bucharest it has attacked parties without naming them, as in *Renmin ribao*, a *Guizhou ribao* article and *Hongqi*''s "Emancipate the mind"; why does it raise old differences and set the Soviets against Poland and Hungary; the Twentieth Congress and Stalin; let China take up the substance: the era, war and peace, disarmament, coexistence. Deng and Peng Zhen answer point by point: do not quibble, face the facts, an error is an error. Andropov and Pospelov break in; Suslov, red in the face, joins them. Deng proposes to adjourn, the Chinese to reply systematically.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 360–362 (the second meeting, the 19th); [[w.yang-shangkun-riji]], I, 551–552 (Sept. 19, 1960; from 2 p.m. Moscow time: Kozlov first; after a break, 4:30, Deng; Peng Zhen on Bucharest as Khrushchev''s organized surprise attack; Suslov: Bucharest was called because of the trade-union council in Peking, and the Chinese evade the questions of substance; ends 6:45); [[w.deng-xiaoping-nianpu-1904]], III, 1576 (Sept. 19, 1960; afternoon; Deng after Kozlov: who fabricates is easily checked, black cannot be called white; facts the premise; the steps since Bucharest a worry; Kozlov''s answer unconvincing); [[w.peng-zhen-nianpu-1902]], IV, 60 (Sept. 19, 1960, 2 p.m.; Peng Zhen at the second session; after Kozlov, Deng rebuts; then Peng, from his own experience, shows Bucharest a surprise attack and encirclement planned by Khrushchev). Made public: 1999. See [[cal.1960-09-17.soviet-union]]. Names: Kozlov, Deng Xiaoping, Peng Zhen, Andropov, Suslov. Check: the account is the Chinese delegation''s.'
