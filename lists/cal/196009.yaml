  - id: cal.1960-09-01.china-leadership-3
    when: Sept. 1
    date: '1960-09-01'
    time: 1960-08-31T17:00Z
    thread: china-leadership
    c: 'Mao 毛泽东, 1 a.m., to Yang Shangkun 杨尚昆: forward the Heilongjiang 黑龙江 Party committee''s report of Aug. 29 on conveying the Beidaihe 北戴河 meeting to the Central bureaus, the Party committees of provinces, cities and regions, and the Center''s ministries, commissions and Party groups, for reference; not to Xinjiang 新疆 and Heilongjiang. The report: a provincial work conference from Aug. 20; the class roots of revisionism; the revolution''s center moved to Asia, Africa and Latin America and its guiding center to China; three leading groups to convey seven documents to county secretaries and above in early September.'
    n: '[[w.jianguo-yilai-mao-zedong]], XV, 327–328 (Sept. 1, 1960; Mao''s note of 1 a.m., Sept. 1; printed from the manuscript). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Heilongjiang Provincial Party Committee, report of Aug. 29, 1960 to the Center and Mao Zedong on conveying the Beidaihe meeting (provincial work conference from Aug. 20) (cited by [[w.jianguo-yilai-mao-zedong]], XV, 327 n.1). Names: Mao Zedong, Yang Shangkun.'
    src:
