  - id: cal.1960-09-13.governors-ma
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Massachusetts primary. Democratic, for governor: Ward, Secretary of the Commonwealth, over Peabody, 180,848 to 152,762, 30.2 percent; Attorney General Kelly 98,107, 16.4 percent; four others. Furcolo, the governor, runs for the Senate. Volpe unopposed for the Republican nomination after the party''s convention.'
