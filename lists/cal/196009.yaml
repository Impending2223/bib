    c: Deng Xiaoping and Peng Zhen hand Chervonenko the Central Committee's Reply to the CPSU's notice, and tell him a delegation leaves for Moscow Sept. 15.
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Sept. 10, 1960, and note 114. [[w.lengxi-shinian-lunzhan-1956-1966]], 353–355 (the Reply: it answers the notice''s contradictions and its misstatements of China''s views; the 1957 memorandum, in which China had set down its reservations to the Moscow Declaration, is attached as an annex so that all brother parties see it; the Reply answers the claims that revolution can come by peaceful coexistence, that China is against negotiating, and Khrushchev''s abuse at Bucharest; "head" does not mean father party); [[w.yang-shangkun-riji]], I, 543 (Sept. 12, 1960; 10 a.m.; Deng, Peng Zhen and Yang receive the Soviet Ambassador); [[w.deng-xiaoping-nianpu-1904]], III, 1573 (Sept. 12, 1960; morning; the Reply also answers the CPSU''s letter of Aug. 13; the time of the delegation''s going given. Deng: Marxist–Leninists not afraid of argument; all questions to be put plainly; three judges of the two parties, the masses, the parties, history); [[w.mao-zedong-zhuan]], V, ch. 66 n.49 (Sept. 12, Deng Xiaoping and Peng Zhen give Chervonenko the Reply, and say the delegation leaves Sept. 15; the book gives the Reply''s five points (n.49)). [[w.peng-zhen-nianpu-1902]], IV, 56–57 (Sept. 12, 1960; Peng Zhen, with Deng Xiaoping and Yang Shangkun, meets Chervonenko and hands him the Reply; the delegation to leave for Moscow Oct. 15; the page''s note: the Reply answers five points (the surprise attack at Bucharest; differences of ideology carried into state relations, the aid agreements torn up and the experts withdrawn; Khrushchev''s partiality to India; his praise of Eisenhower; his "yellow peril" to Adenauer)). Made public: 1999. To check: Central Committee of the CCP 中共中央, Reply 《答复书》 to the CPSU Central Committee''s notice 《通知书》 of June 21, 1960, handed to Chervonenko Sept. 12, 1960 (the book summarizes its five points, n.49) (cited by [[w.mao-zedong-zhuan]], V, ch. 66 n.49). Names: Deng Xiaoping, Peng Zhen, Chervonenko.'
