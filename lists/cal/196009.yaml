  - id: cal.1960-09.vietnam-diplomacy
    when: Sept., end
    date: 1960-09
    at: before 1960-09-21
    place: phnom-penh
    thread: vietnam-diplomacy
    c: 'Phnom Penh, a room at the railway station. The Khmer People''s Revolutionary Party''s second congress, called on Hanoi''s orders: renamed the Workers'' Party of Kampuchea, its existence still secret. Pol Pot''s group for a more militant struggle against imperialism and Sihanouk; the senior leaders, for political struggle within Sihanouk''s regime, prevail. Son Ngoc Minh, still in Hanoi, named in absentia to the Central Committee (Tou Samouth secretary; Saloth Sar, Nuon Chea, Keo Meas, Sao Phim, Ieng Sary).'
    n: '[[w.guan-vietnamese-communists-relations-with]], 163. Made public: Pol Pot''s speech of Sept. 27, 1977 (Phnom Penh Home Service, Sept. 28, 1977). To check: [[w.kiernan-how-pol-pot-came]], 189–193, 367 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38a); [[w.chandler-tragedy-of-cambodian-history]], 112–115, 205 n.33 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38b); Central Intelligence Agency, "Communism and Cambodia," undated, probably 1971, 29 (cited by Chandler) (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38c); [[w.chandler-brother-number-one]], 61–62 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38d); Pol Pot''s speech at Phnom Penh for the seventeenth anniversary of the Communist Party of Kampuchea, Sept. 27, 1977, Phnom Penh Home Service, Sept. 28, 1977, SWB/FE/5629/C2/1-9 and SWB/FE/5631/C2/1-6 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38e); [[w.affairs-black-paper]], 24–25 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38f); Pol Pot''s press conference in Peking, NCNA, Oct. 3, 1977, SWB/FE/5631/A3-6 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38g); Tô Quyền, "The Kampuchean People''s Revolutionary Party, the Vanguard of the Working Class and People of Kampuchea," Tạp chí Cộng sản no. 11, Nov. 1983, 51–67 (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.38h). Names: Sihanouk, Ieng Sary.'
    src:
      rows:
        - 'via x.1977-09-27.pol-pot-speech-cpk-seventeenth-anniversary: ?'
    tags: [polity:cambodia, polity:drv, name:norodom-sihanouk, name:ieng-sary, vis:only:drv]
