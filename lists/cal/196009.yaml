    c: 'Khrushchev to New York aboard the *Baltic*, Sept. 19, for the UN General Assembly, his movements held to Manhattan. Castro, in New York since the 18th, moves to the Hotel Theresa in Harlem; Khrushchev calls on him there, Sept. 20. The Assembly''s fifteenth session opens Sept. 20 and admits fourteen new members: thirteen African States and Cyprus.'
    n: 'FRUS 1958–60, II, docs. [153](https://history.state.gov/historicaldocuments/frus1958-60v02/d153), [165](https://history.state.gov/historicaldocuments/frus1958-60v02/d165) (Manhattan), [177](https://history.state.gov/historicaldocuments/frus1958-60v02/d177). Statement by the President Concerning the Attendance of Chiefs of State and Heads of Government at the U.N. General Assembly, [1960–61 Pub. Papers 702](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=754) (Sept. 17, 1960). [[w.fursenko-one-hell-of-a]], 60 (the meeting); [[w.fursenko-khrushchevs-cold-war]], 318–19 (the *Baltika* in New York Harbor, Sept. 19; no invitation from Eisenhower; Khrushchev and Castro''s first meeting). Check: Fursenko and Naftali have Castro keep Khrushchev waiting an hour on the steps of the Soviet consulate (60). To check: [[w.gosse-where-the-boys-are]] (on Castro in Harlem); [[w.taubman-khrushchev]]; [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.urquhart-hammarskjold]]. Names: Khrushchev, Castro.'
