    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow. Third session. Deng replies in full to Suslov and Kozlov, on two matters: friend and foe, and relations among brother parties. Since the Korean War, he says, the CPSU has turned friend and foe round (the Congo, Algeria, Hungary); after the TASS statement it praised the reactionaries and attacked brother parties; Khrushchev praised Eisenhower and called China "Trotskyite" and "neither war nor peace." The CPSU is a "father party": he lists the joint fleet, the long-wave station, the experts withdrawn and contracts torn up, the ban on *Youhao* in the USSR, the border quarrels the Soviets would stir, Khrushchev''s abuse of China and Mao at the Warsaw Treaty dinner. China will make good its losses by self-reliance, asks no compensation and will repay its debt. No Soviet answer; Suslov reddens. Deng hopes the USSR will sit down and talk. The Soviet side had a joint statement drafted and does not table it.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 362–363 (the third meeting, the 20th); [[w.yang-shangkun-riji]], I, 552–553 (Sept. 20, 1960; 2 to 5:45 p.m., Deng speaking throughout: on the experts, "the Chinese people are resolved to swallow this loss"; Ponomarev snapping pencils); [[w.deng-xiaoping-nianpu-1904]], III, 1577 (Sept. 20, 1960; afternoon; Deng: since Tass''s statement of last September Khrushchev has led the attack on China, at its height at Bucharest, while praising Eisenhower; China treated as son, not brother; the Chinese party will never accept a father-and-son relation; no majority rule among brother parties; the two parties and countries can only unite; the loss of the experts and the agreements to be swallowed and made good by China''s own labor); [[w.zhang-sino-soviet-economic-cooperation]], 214–215 (Deng Xiaoping to "a high-ranking Soviet delegation in September," no day given: the CCP will never accept father-and-son relations between parties; the Chinese people will make up the losses of the recall with their own hands); [[w.peng-zhen-nianpu-1902]], IV, 60 (Sept. 20, 1960, 2 p.m.; Peng Zhen at the third session; Deng on the Soviet side''s want of equality, the experts'' recall and the agreements torn up, a loss the Chinese will make good by their own hands; in a break the Chinese propose leaving on the evening of the 21st or 22nd). Made public: 1998 ([[w.zhang-sino-soviet-economic-cooperation]], 214–215). To check: [[w.bianjibu-dangdai-zhongguo-waijiao]], 118 (cited by [[w.zhang-sino-soviet-economic-cooperation]], 215 n.96). See [[cal.1960-09-17.soviet-union]]. Names: Deng Xiaoping, Suslov, Khrushchev. Check: the account is the Chinese delegation''s; the list of Deng''s charges is Wu''s.'
