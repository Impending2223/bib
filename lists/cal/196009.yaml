  - id: cal.1960-09-01.civil-rights-the-executive
    when: Sept. 1
    date: '1960-09-01'
    thread: civil-rights-the-executive
    also: [civil-rights-bill]
    c: Kennedy and twenty-three Democratic Senators pledge a civil rights bill early in the next session. Discrimination in federal housing programs the President could end by executive order, "by a stroke of his pen." Kennedy asks Clark and Celler to draft the bill on the platform's lines.
    n: '[Statement by Senator Kennedy on Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-kennedy-civil-rights-legislation); [Press Conference of Senator John F. Kennedy, Caucus Room, Senate Office Building](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-caucus-room-senate-office-building-washington-dc) (Sept. 1, 1960). [[w.mann-walls-of-jericho]], 300–301 (Clark and Celler asked to draft the bill); [[w.wofford-of-kennedys-and-kings]], 59 (Wofford''s draft, changed at Kennedy''s word for Russell and at Clark''s, some half dozen times over ten days; signed by Kennedy and most Northern and Western Democratic Senators; McCarthy: "What have the Kennedys ever done for me?"); [[w.communications-freedom-of-communications-part]], 68–78 (the joint statement with twenty-three Senators, pledging a bill early in the next session; "a stroke of his pen," 69; the separate statement asking Clark and Celler to draft it, 70; the press conference, 5:15 p.m., 70–78). Check: Wofford has the statement released "just before the showdown on the bills," the Republicans'' civil rights bills in the August session (59). To check: [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]. Names: Kennedy, Clark, Celler.'
