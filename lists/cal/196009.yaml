  - id: cal.1960-09-01.elections-1960
    when: Sept. 1
    date: '1960-09-01'
    thread: elections-1960-nixon
    also: [republican-party]
    c: 'Klein announces American Nationalities for Nixon-Lodge: John Richardson Jr. and McKeldin, once Maryland''s governor, its cochairmen; Horace Henderson, from the State Department, its director. Its aim, by its first weekly report: to hold the party''s strength and better Eisenhower''s gains among the East and South European and Latin American groups, "twenty to forty percent of the population of the key industrial states."'
    n: '[[w.gifford-center-cannot-hold]], 177, 182. To check: American Nationalities for Nixon-Lodge, Confidential Weekly Progress Report no. 1, Sept. 3, 1960, Series 320, Box 37, "ANNL," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 182 n.40). Names: Klein, Richardson, McKeldin, Henderson, Eisenhower. Check: the day; Gifford gives a press conference of Sept. 1 and cites no source for it.'
