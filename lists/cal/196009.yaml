    c: 'The Việt Bắc Zone Committee''s Standing Committee: resolution no. 49-VP/KU, a plan to strengthen and enlarge the Party through the end of 1960, in the drive for agricultural cooperation and the completion of the democratic reform. Rural branches 76 percent of the zone''s, rural members 74 percent; 4,897 new members taken in, 364 of them of the minorities. Every village with no member to take in at least three; recruits sought among cooperative members, the minorities, women and youth.'
