  - id: cal.1960-09-06.soviet-union
    when: Sept. 6
    date: '1960-09-06'
    place: moscow
    thread: soviet-union
    also: [intelligence]
    c: 'Moscow, the House of Journalists. Bernon F. Mitchell and William H. Martin, mathematicians in the cryptology department of the National Security Agency, appear at a news conference of the Soviet Foreign Ministry''s Press Department, Kharlamov, its chief, beside them. They say they left the United States and took Soviet citizenship because they opposed its intelligence methods, which they feared would lead to war, above all the reconnaissance flights over the Soviet Union and other Communist countries. They read statements: the United States knowingly makes false and deceptive statements; it paid a code clerk in an ally''s embassy in Washington for information. A high NSA official told Martin, they say, that the C-130 shot down over Soviet Armenia in September 1958 carried equipment for receiving the signals of Soviet radar, on a penetration mission. They would not give the date of their arrival or say how they came.'
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 10, 11 ("War Threat Seen," "Two Code Clerks Defect to Soviet," by Osgood Caruthers; "Text of Statements Read in Moscow by Former U. S. Security Agency Workers," at 10; "Soviet Assertion on Plane Backed," page not shown: the news conference, the statements, the C-130 account, their refusal on arrival; Martin disappeared with Mitchell after a vacation from June 24, reported Aug. 1). [[w.martin-moscow-press-conference]], 1–2, 4–5, 8–9 (the place, 1; their reasons, the airspace flights, the "practice of lying about such violations" and the intercepts of allies'' messages, 2; the C-130 and the high NSA official''s word to Martin, 4–5; the citizenship, 8; the code clerk of an ally, 2, 8, at 9 "the Turkish Embassy"; not Kharlamov, the Foreign Ministry''s Press Department, the "cryptology department," or the refusal on arrival). Names: Kharlamov.'
    src:
      c: cddca716
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html: all'
        - 'w.martin-moscow-press-conference 1–2, 4–5, 8–9: A, C, D, E, F'
    tags: [name:kharlamov-mikhail-a]
