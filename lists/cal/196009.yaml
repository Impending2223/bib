  - id: cal.1960-09-01.congress
    when: Sept. 1
    date: '1960-09-01'
    thread: congress
    c: 86th Congress adjourns sine die, ending the session Johnson and Rayburn reconvened Aug. 8, after the conventions. No agreement in conference on the minimum wage; no school or housing bill out of the House Rules Committee; medical care for the aged through Social Security refused. Kerr–Mills and the Latin American fund passed.
    n: 'H. Con. Res. 745, [74 Stat. B12](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf). [[w.sundquist-politics-and-policy]], 307, 513 n.6 (Kerr–Mills passed and Medicare through Social Security refused, 307; no conference on the minimum wage, no school or housing bill from Rules, 513 n.6); [[w.white-making-of-the-president]], 249, 251 (the session; Kennedy''s measures dead in the House); [[w.mcpherson-political-education]], 179 (aid to schools and medical care for the aged, "the major initiatives in the Democratic platform, ... put to an early test and failed ignominiously"). To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]. Names: Johnson, Rayburn, Kerr, Mills.'
    src:
      c: 3d428fae
      rows:
        - 'https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf: all'
        - 'w.sundquist-politics-and-policy 307: D-E'
