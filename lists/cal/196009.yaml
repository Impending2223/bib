    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Utah''s primary, for governor. Republican: Governor Clyde over Gunderson, 50,592 to 37,002, 57.8 percent. Democratic: Barlocker over Huggins, 74,424 to 31,045, 70.6 percent.'
    n: 'Votes: [Wikipedia, "1960 Utah gubernatorial election"](https://en.wikipedia.org/wiki/1960_Utah_gubernatorial_election); Check: Utah, *Abstract of the Returns of the Primary Election*, Sept. 13, 1960 (Utah State Archives). To check: [[w.peirce-mountain-states-of-america]]. Names: Clyde, Gunderson, Barlocker, Huggins.'
