  - id: cal.1960-09-12.latin-america
    when: Sept. 12
    date: '1960-09-12'
    thread: latin-america
    also: [elections-1960-kennedy]
    c: 'Goodwin, on a bus in west Texas, finishes a draft on Kennedy''s Latin American policy for the Alamo, San Antonio, that afternoon. "Alianza" from the title of a New Mexico society''s magazine left on the seat; by telephone Karl Meyer of the *Washington Post* reports: "Ernesto [Betancourt] says there''s no problem. But he thinks it should be an alliance for something." Goodwin takes "progreso" and writes "Alianza para progreso." Kennedy, told by his throat specialist to save his voice, reads the draft and writes on his pad: "Let''s not waste this one. The ministers is the big one for today."'
    n: '[[w.goodwin-remembering-america]], 108–9 (Goodwin''s account; the day by the Houston ministers "that night"; the phrase first proclaimed at Tampa, Oct. 18, 109). See [[cal.1960-09-12.elections-1960-kennedy-4]]. Names: Goodwin, Kennedy.'
