    thread: china-leadership
    also: [africa]
    c: 'Peking 北京. A report of the city''s state college on its African students: they cut class, will not stand for the teacher, complain of the food, the dormitories, the showers, their allowance and their separation from the European students at Peking University, and strike until their demands are met. Told that socialist China cannot produce racial discrimination; Chinese students to be friendly, before the African guests of Oct. 1.'
