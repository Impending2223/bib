    c: 'Los Angeles, a hotel room, before the evening''s speech at the Shrine Temple. Kennedy asks O''Donnell about the Houston ministers'' invitation. Robert Kennedy, the advance man Tim May, Johnson and Rayburn are against it. O''Donnell: "I think it would be a mistake. If you have to meet the religious issue, Houston is not the place to do it." Kennedy, after shaving: "Tell them I''m going to do it. This is as good a time as any to get it over with. I''ve got to face it sooner or later."'
    n: '[[w.odonnell-johnny-we-hardly-knew]], 231–33 (O''Donnell''s and Powers''s account). Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: Kennedy, O''Donnell, Robert Kennedy, Johnson, Rayburn. Check: the day (the book has the decision on the day the train trip ended at Bakersfield and Kennedy flew to Los Angeles, "a week" before the Houston meeting).'
