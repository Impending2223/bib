  - id: cal.1960-09-05.congo
    when: Sept. 5
    date: '1960-09-05'
    thread: congo
    c: Kasavubu dismisses Lumumba and names Ileo; Lumumba, on the radio, dismisses Kasavubu. The UN closes the airports and the radio station.
    n: 'FRUS 1964–68, XXIII, doc. [15](https://history.state.gov/historicaldocuments/frus1964-68v23/d15) (the station). See [[cal.1960-06-30.congo]]. Names: Kasavubu, Lumumba, Ileo.'
    tags: [name:kasavubu-joseph, name:lumumba-patrice, name:ileo-joseph]
  - id: cal.1960-09-05.latin-america
    when: Sept. 5–6
    date: '1960-09-05'
    thread: latin-america
    c: 'The OAS Committee of 21 at Bogotá. Dillon, Sept. 6, offers an inter-American program for social development: land, housing, schools, health.'
    n: 'FRUS 1958–60, V, microfiche supp., docs. [ETA–48](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d48), [ETA–49](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d49) (instructions, Sept. 2). Dillon''s statement: [[w.department-of-state-bulletin]], [Oct. 3, 1960, 533](https://archive.org/details/departmentofstat4360unit/page/533/mode/1up). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.taffet-foreign-aid-as-foreign]]; [[w.levinson-alliance-that-lost-its]]; [[w.rabe-most-dangerous-area-in]]. Names: Dillon.'
    tags: [name:dillon-c-douglas]
  - id: cal.1960-09-05.elections-1960
    when: Sept. 5
    date: '1960-09-05'
    thread: elections-1960
    c: 'Detroit, Cadillac Square, Labor Day. Kennedy departs from his text: "The new frontier is not what I promise I am going to do for you. The new frontier is what I ask you to do for our country."'
    n: '[[w.schlesinger-thousand-days-1965]], 4 (the footnote). To check: Speech of Senator John F. Kennedy, Cadillac Square, Detroit, MI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cadillac-square-detroit-mi) (the text as released). See [[cal.1960-07-15.elections-1960]]. Names: Kennedy.'
    src:
      c: 60eb7f50
      rows:
        - 'w.schlesinger-thousand-days-1965 4: all'
    tags: [name:kennedy-john-f]
  - id: cal.1960-09-07.congo
    when: Sept. 7
    date: '1960-09-07'
    thread: congo
    c: The CIA station meets Colonel Mobutu, and pays him. The NSC on the Congo.
    n: 'FRUS 1958–60, XIV, doc. [199](https://history.state.gov/historicaldocuments/frus1958-60v14/d199) (NSC). FRUS 1964–68, XXIII, doc. [19](https://history.state.gov/historicaldocuments/frus1964-68v23/d19) (the station and Mobutu). Made public: FRUS 1964–68, XXIII (2013). See [[cal.1960-06-30.congo]]. Names: Mobutu.'
    tags: [name:mobutu-joseph-d]
  - id: cal.1960-09-08.space
    when: Sept. 8
    date: '1960-09-08'
    thread: space
    c: Eisenhower dedicates the George C. Marshall Space Flight Center at Huntsville, NASA's from July 1; von Braun's Army rocket team its staff, von Braun director.
    n: 'Remarks at the Dedication of the George C. Marshall Space Flight Center, Huntsville, Alabama, [1960–61 Pub. Papers 689](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=741) (Sept. 8, 1960). To check: [[w.dunar-power-to-explore]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]. Names: Eisenhower, von Braun.'
    tags: [name:eisenhower-dwight-d, name:von-braun-wernher]
  - id: cal.1960-09-08.berlin-and-vienna
    when: Sept. 8
    date: '1960-09-08'
    thread: berlin-and-vienna
    c: East Germany requires West Germans to obtain permits to enter East Berlin, and stops honoring West German passports held by West Berliners.
    n: '[[w.department-of-state-bulletin]], [Sept. 26, 1960, 473–74](https://archive.org/details/departmentofstat431960unit/page/473/mode/1up) (the American statement at Bonn, Sept. 3, on the East German "Decree on Entry into the Capital of the German Democratic Republic (Democratic Berlin) by Citizens of the Federal Republic" of Aug. 30; the Department''s statement of Sept. 9 against "the East German order"); [FRUS 1958–60, IX: Berlin Crisis, 1959–1960; Germany; Austria, doc. 214](https://history.state.gov/historicaldocuments/frus1958-60v09/d214) (Dulles to the NSC, Sept. 21: restrictions on West Germans'' travel to East Berlin). Check: the day; the records read give a decree of Aug. 30, not the permits of Sept. 8, and nothing of the passports. To check: [[w.harrison-driving-the-soviets-up]]; [[w.eisenhower-white-house-years]].'
  - id: cal.1960-09-08.latin-america
    when: Sept. 8
    date: '1960-09-08'
    thread: latin-america
    c: 'The Latin American aid act signed, [74 Stat. 869](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg869.pdf): $500 million for the Bogotá program; $100 million for Chile''s earthquake.'
    n: 'See [[cal.1960-09-05.latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-09-10.laos
    when: Sept. 10
    date: '1960-09-10'
    thread: laos
    c: At Savannakhet, Prince Boun Oum and General Phoumi Nosavan proclaim a "revolution" against Souvanna Phouma's government. State regrets the split among the non-Communists, disclaims intervention, and warns "outside powers."
    n: 'FRUS 1958–60, XVI, docs. [391](https://history.state.gov/historicaldocuments/frus1958-60v16/d391) (Vientiane''s 502: Phoumi on the revolution to be announced at noon in Boun Oum''s name), [392](https://history.state.gov/historicaldocuments/frus1958-60v16/d392), [396](https://history.state.gov/historicaldocuments/frus1958-60v16/d396) (NSC, Sept. 15). [[w.department-of-state-bulletin]], [Sept. 26, 1960, 499](https://archive.org/details/departmentofstat431960unit/page/499/mode/1up). [[w.watson-into-the-missile-age]], 651 (Boun Oum''s proclamation, Sept. 10). To check: Vientiane''s telegram 501, Sept. 10, 1960, OSD Hist., and the *New York Times*, Sept. 12, 1960 (cited by [[w.watson-into-the-missile-age]], 651 n.133). See [[cal.1960-08-09.laos]]. Names: Boun Oum na Champassak, Phoumi Nosavan, Souvanna Phouma.'
    src:
      c: a16e6422
      rows:
        - 'w.department-of-state-bulletin [Sept. 26, 1960, 499]: B'
        - 'https://history.state.gov/historicaldocuments/frus1958-60v16/d391: A'
        - 'w.watson-into-the-missile-age 651: A'
        - 'via w.watson-into-the-missile-age 651 n.133a: A'
        - 'via w.watson-into-the-missile-age 651 n.133b: A'
    tags: [name:boun-oum-na-champassak, name:phoumi-nosavan, name:souvanna-phouma, name:herter-christian-a, place:savannakhet]
  - id: cal.1960-09-10.middle-east
    when: Sept. 10–14
    date: '1960-09-10'
    thread: middle-east
    also: [oil]
    c: 'Baghdad. Iraq, Iran, Kuwait, Saudi Arabia and Venezuela, after the companies'' cuts in posted prices, found the Organization of the Petroleum Exporting Countries, Sept. 14: prices to be restored, then kept stable.'
    n: '[FRUS 1958–60, XII, doc. 90](https://history.state.gov/historicaldocuments/frus1958-60v12/d90) (Baghdad, Sept. 15). To check: [[w.sampson-seven-sisters]]; [[w.skeet-opec]]; [[w.yergin-prize]]; [[w.garavini-rise-and-fall-of]].'
  - id: cal.1960-09-10.conservative-movement
    when: Sept. 10–11
    date: '1960-09-10'
    thread: conservative-movement
    c: 'Sharon, Conn., Great Elm, the Buckleys'' estate. Almost a hundred young conservatives, called from Liebman''s office, found Young Americans for Freedom. Its statement: the individual''s "God-given free will"; "victory over, rather than co-existence with" Communism; a motion to strike God lost, 44–40.'
    n: '[[w.perlstein-before-the-storm]], 105–106. To check: [[w.andrew-other-side-of-the]], 55 (cited by [[w.perlstein-before-the-storm]], 105 n.1, for the call). Names: Buckley.'
    src:
      c: 68a2e1b2
      rows:
        - 'w.perlstein-before-the-storm 105–106: all'
    tags: [name:buckley-william-f-jr]
  - id: cal.1960-09-12.elections-1960
    when: Sept. 12
    date: '1960-09-12'
    thread: elections-1960
    c: 'Houston. Kennedy to the Greater Houston Ministerial Association at the Rice Hotel, and its questions: "I believe in an America where the separation of church and state is absolute." Sept. 7: Norman Vincent Peale and Protestant clergy, meeting in Washington as the National Conference of Citizens for Religious Freedom, had asked whether a Catholic President could be free of his church.'
    n: '[Speech of Senator John F. Kennedy, Greater Houston Ministerial Association, Rice Hotel](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-greater-houston-ministerial-association-rice-hotel-houston); [Question and Answer Period](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-ministerial-association) (Sept. 12, 1960). [[w.kallina-kennedy-v-nixon]], 104–06 (the appearance and its staging; the Peale statement, 105). To check: [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.white-making-of-the-president]]; New York Herald Tribune, Sept. 8, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 105 n.19). Names: Kennedy, Peale.'
    src:
      c: acb68b42
      rows:
        - 'https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-greater-houston-ministerial-association-rice-hotel-houston: all'
        - 'https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-ministerial-association: all'
