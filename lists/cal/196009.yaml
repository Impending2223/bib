    when: Sept. 19
    date: '1960-09-19'
    thread: elections-1960-nixon
    also: [republican-party]
    c: 'Washington. American Nationalities for Nixon-Lodge in conference, over two hundred leaders. Nixon to them in the morning at the Washington Hotel: "This is not a master race in the sense that the dictators have used," the Americans come "from all the nations of the world"; then to Wilkes-Barre, Pa., and Scranton. Eisenhower receives them at the White House: "All of us are Americans"; a firm national policy in days "unusually troublous." Mitchell with them. Their conclusions: an agency of the next administration to work with the nationality groups; Nixon and Lodge endorsed.'
    n: 'Remarks to Members of the American Nationalities for Nixon-Lodge, [1960–61 Pub. Papers 704](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=756) (Sept. 19, 1960) (Eisenhower); [Remarks by Vice President Richard Nixon at the Meeting of the American Nationalities Committee for Nixon-Lodge](https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-nixon-the-meeting-the-american-nationalities-committee-for-nixon-lodge) (Nixon). [[w.gifford-center-cannot-hold]], 183–86. To check: The Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960 (1961), 174–75, U.S. Government Printing Office, printed (cited by [[w.gifford-center-cannot-hold]], 184 n.44); The Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960 (1961), 175–78, U.S. Government Printing Office, printed (cited by [[w.gifford-center-cannot-hold]], 184 n.45); "Conference Conclusions," Sept. 19, 1960, Series 320, Box 37, "ANNL," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 186 n.48). See [[cal.1960-09-01.elections-1960]]. Names: Nixon, Eisenhower, Mitchell, Lodge.'
