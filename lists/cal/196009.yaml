        - 'w.kallina-kennedy-v-nixon 105: C'
        - 'via w.kallina-kennedy-v-nixon 105 n.19: C'
    tags: [name:kennedy-john-f, name:peale-norman-vincent]
  - id: cal.1960-09-12.elections-1960-2
    when: Sept. 12
    date: '1960-09-12'
    thread: elections-1960
    c: Nixon, out of Walter Reed Sept. 9 after twelve days with an infected knee, opens his campaign with Eisenhower at Friendship Airport, Baltimore; then Indianapolis, Dallas and San Francisco the same day. His pledge from Chicago, to campaign in all fifty States.
    n: 'Remarks at the Opening of the Republican Campaign, Friendship International Airport Near Baltimore, [1960–61 Pub. Papers 694](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=746) (Eisenhower); [Excerpts of Remarks by the Vice President at Friendship Airport](https://www.presidency.ucsb.edu/documents/excerpts-remarks-the-vice-president-friendship-airport-baltimore-md) (Sept. 12, 1960). To check: [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]. Names: Nixon, Eisenhower.'
    tags: [name:nixon-richard-m, name:eisenhower-dwight-d]
  - id: cal.1960-09-12.oil
    when: Sept. 12–16
    date: '1960-09-12'
    thread: oil
    also: [middle-east]
    c: 'Esso Export restores up to 4 cents a barrel of its Middle East cuts, to the other companies'' postings: Arabian light at Ras Tanura $1.80, Iranian at Bandar Mashur $1.78, Iraq''s at Fao $1.72, Kuwait $1.59, Qatar $1.95.'
    n: '[*The Oil and Gas Journal*, Sept. 19, 1960, 81](https://archive.org/details/sim_oil-gas-journal_1960-09-19_58_38/page/n88) ("last week"). Check: the day. See [[cal.1960-08-09.oil]].'
  - id: cal.1960-09-13.medicare
    when: Sept. 13
    date: '1960-09-13'
    thread: medicare
    c: 'Social Security Amendments of 1960 signed, [74 Stat. 924](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg924.pdf). Kerr–Mills: federal grants to the States for medical care of the aged poor, at the States'' option. Disability benefits no longer limited to workers fifty and over.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1960-03-31.medicare]]. Names: Eisenhower, Kerr, Mills.'
    tags: [name:eisenhower-dwight-d, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-09-13.governors-wa
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Washington''s blanket primary, for governor: Andrews (R), the lieutenant governor, over Governor Rosellini (D), 263,897 to 244,579, 37.4 percent; Newman Clark (R) 144,440, 20.5 percent. Andrews and Rosellini nominated.'
    n: 'Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) (the Secretary''s database, 1898–2006, "1960 Primary"), and [Wikipedia, "1960 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1960_Washington_gubernatorial_election), alike; Check: Wash. *Official Abstract of Votes, State Primary, September 13, 1960*, 9. To check: [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. Names: Rosellini, Andrews, Newman Clark.'
    tags: [state:wa, name:andrews-lloyd-j, name:rosellini-albert-d, name:clark-newman-h]
