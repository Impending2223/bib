    when: Sept. 6
    date: '1960-09-06'
    place: washington
    thread: intelligence
    also: [antisubversion]
    c: Washington. Eisenhower, through James C. Hagerty, his press secretary, calls Mitchell and Martin, the NSA defectors who denounced the United States in Moscow, "self-confessed traitors."
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the characterization "came through" Hagerty). See [[cal.1960-09-06.soviet-union]]. Names: Eisenhower, Hagerty.'
    tags: [name:eisenhower-dwight-d, name:hagerty-james-c]
  - id: cal.1960-09-06.intelligence-2
    when: Sept. 6
    date: '1960-09-06'
    thread: intelligence
    also: [antisubversion]
    c: 'The Defense Department, in two statements on the NSA defectors in Moscow. The first: their statements "about alleged activities of the United States Government, in relation to its allies and other governments of the free world," are "completely false" and "can only serve the Communist objective of sowing distrust among free nations." The second: the Soviet Union is "making every effort to exploit the two turncoats Martin and Mitchell, who have become tools of Soviet propaganda"; the two are "one mentally sick and both obviously confused." It does not say which is ill. A spokesman confirms the department holds a letter the two left in a safe-deposit box at a bank in Laurel, Md., obtained after they fled by way of Mexico City and Havana in mid-June.'
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the two statements, the words; the Navy''s reply on Soviet ships near Havana and the department''s comment on the C-130 not entered). [[w.martin-moscow-press-conference]], 1 (Martin: the statement left "at the end of June" in safety deposit box 174 at the State Bank of Laurel, Md.; not the department''s holding it). Check: the date of leaving: Martin says they left the United States "at the end of June" ([[w.martin-moscow-press-conference]], 1); Lansdale''s memorandum of Aug. 1 has them leave Washington June 25 and reach Havana July 1 (see [[cal.1960-06-25.intelligence]], [[cal.1960-07-01.intelligence]]). See [[cal.1960-09-06.soviet-union]].'
    src:
      c: 5bfee7f2
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html: all'
        - 'w.martin-moscow-press-conference 1: ?'
    tags: [state:md, city:laurel]
  - id: cal.1960-09-06.antisubversion
    when: Sept. 6
    date: '1960-09-06'
    thread: antisubversion
    also: [intelligence]
    c: 'Walter, chairman of the House Un-American Activities Committee: the committee will begin closed hearings Sept. 16 on the NSA defectors, possibly with Gates, Secretary of Defense, the first witness. The inquiry will stress hiring practices in the National Security Agency and all Government agencies; many persons once dropped as "security risks" have managed to regain their jobs.'
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 13 ("President Calls Pair Traitorous," by Jack Raymond: the announcement; the *Times* adds that the committee''s effort to subpoena personnel officials and records had failed, it was understood because the process server could not enter NSA headquarters at Fort Meade, Md., on a day it does not give). See [[cal.1960-09-06.soviet-union]]. Names: Walter, Gates.'
    tags: [name:walter-francis-e, name:gates-thomas-s-jr]
