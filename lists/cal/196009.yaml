    c: 'Zhongnanhai, Mao''s house by the pool. The Politburo Standing Committee (Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping; Peng Zhen attending) on the draft Reply of the Central Committee to the CPSU''s notice of Bucharest. Its five points: the ambush at Bucharest; the quarrel carried to the states, every aid agreement torn up and the experts withdrawn; Khrushchev for India on the border; his praise of Eisenhower; his "yellow peril" to Adenauer.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Sept. 7, 1960, and note 114. [[w.zhou-enlai-nianpu-1949]], II, 348, Sept. 7, 1960 (Zhou present). [[w.lengxi-shinian-lunzhan-1956-1966]], 352–353 (the Reply in twelve parts, five chief matters (the surprise attack at Bucharest; the extension to state relations and the experts'' withdrawal; Khrushchev on India; on Eisenhower; the "yellow peril" to Adenauer); the writers drafting from Beidaihe, Deng directing, Hu Qiaomu, Lu Dingyi and Kang Sheng chiefly; the Reply to go before the two parties'' talks, as the Standing Committee decided at several meetings in Peking after Beidaihe); [[w.lengxi-shinian-lunzhan-1956-1966]], 355–357 (the Reply''s five proposals: Marxism–Leninism and the 1957 declarations the basis of unity; relations equal and comradely; disputes settled by calm discussion, not by vote; no word or act to harm the parties'' unity; the November conference to be prepared by consultation; the Standing Committee on Sept. 7, at Mao''s, all stressed these, finished the Reply at the meeting, and the experts'' group had it translated); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 493 (Sept. 7, 1960; Liu attends the Standing Committee meeting, which discusses the reply to the CPSU Central Committee''s notice of June 21; the reply goes Sept. 10 with five proposals for settling the differences and reaching unity); [[w.deng-xiaoping-nianpu-1904]], III, 1572 (Sept. 7, 1960; afternoon; Deng at Mao''s Standing Committee on revising and settling the Reply); [[w.mao-zedong-zhuan]], V, ch. 66 (Sept. 7, Mao with Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and Peng Zhen on the draft Reply; changes made after it). [[w.peng-zhen-nianpu-1902]], IV, 56 (Sept. 7, 1960, afternoon; Peng Zhen sits in at Mao''s Standing Committee on revising the Reply); [[w.zhu-de-nianpu-xinbian]], III, 1782 (Sept. 7, 1960, afternoon; Zhu De 朱德 at the Politburo Standing Committee 中共中央政治局常委 meeting Mao Zedong 毛泽东 calls, on the answer to the CPSU Central Committee''s notification). Made public: 1996. To check: Notice of the CPSU Central Committee to the CPC Central Committee, June 21, 1960, distributed by the CPSU delegation at Bucharest (cited by [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 493 n.1). Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Khrushchev, Eisenhower, Adenauer.'
