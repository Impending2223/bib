    c: 'The Yinian Tang, evening. The enlarged Standing Committee hears Deng Xiaoping, back that afternoon, on the talks of the two parties at Moscow, Sept. 17–22 (Peng Zhen his deputy). Mao: unity still, but on Marxism–Leninism; the CPSU used to being "father party"; argued, not settled; at the world conference seek agreement, not fear a split: hold to principle and to unity, fight resolutely, leave room.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Sept. 23, 1960, and note 115. [[w.zhou-enlai-nianpu-1949]], II, 350, Sept. 23, 1960 (Zhou present at the evening meeting). [[w.lengxi-shinian-lunzhan-1956-1966]], 364–365 (the report; Mao''s talk after it: both parties still to unite, a Marxist-Leninist agreement the only basis; the Soviets used to scold brother parties as a father his son; this time both spoke, argued, settled nothing; at Bucharest the aim to isolate China failed, for China did not yield and other parties did not approve; the line: unity, struggle, no break; Liu and Zhou agree the delegation fought well); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 494 (Sept. 23, 1960; Liu attends the meeting Mao convenes, which hears Deng Xiaoping on the Sino-Soviet party talks); [[w.yang-shangkun-riji]], I, 546, 555 (Sept. 23, 1960; 8 p.m. to midnight, at Mao''s); [[w.deng-xiaoping-nianpu-1904]], III, 1578 (Sept. 23, 1960; 8:30 p.m. to 12:15 a.m.; Deng reports the talks to Mao''s enlarged Standing Committee); [[w.mao-zedong-zhuan]], V, ch. 66 n.50 (Sept. 23, the delegation back in the afternoon; that evening it reports to the Standing Committee; Mao in Wu Lengxi''s account (n.50): unity needed on both sides, agreement on a Marxist-Leninist base, the CPSU used to the "father party" way; the talks of benefit). [[w.peng-zhen-nianpu-1902]], IV, 61 (Sept. 23, 1960, 8:30 p.m. to 12:15 a.m., the Yinian Tang; Peng Zhen, with Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yi, Li Fuchun, Kang Sheng, Yang Shangkun and others; Mao: "坚持原则，坚持团结，坚持斗争，留有余地"); [[w.zhu-de-nianpu-xinbian]], III, 1783 (Sept. 23, 1960, evening; Zhu De 朱德 at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议 Mao Zedong 毛泽东 presides, hearing Deng Xiaoping 邓小平 on the talks of the two parties). Made public: 1996. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yi, Li Fuchun, Kang Sheng, Yang Shangkun.'
