    c: 'At the national propaganda conference, Zhou Enlai on the fourth volume of Mao''s *Selected Works*, to appear Sept. 30: the *Selected Works* a record of this historical stage''s great victory; study it by tying it to practice, turning anger at the world''s right-deviationism into strength, hard work, self-reliance, unity and principle, in the fight for grain and steel; learn Mao''s foresight, deliberation and long planning. He proposes keeping traces of decisive battles of the War of Liberation, with exhibitions to teach later generations, which is worth more than renovating old residences.'
