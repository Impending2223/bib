    c: 'After the first debate, the Caroline to Painesville, Ohio. Kennedy, with a beer and a bowl of tomato soup, goes over his answers and Nixon''s: "We''ll need something better on education." Goodwin: "We''ve got it won now." Kennedy: "It was all right."'
    n: '[[w.goodwin-remembering-america]], 115–16 (Goodwin''s account; for Hellriegel''s Inn and a breakfast speech). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Nixon, Goodwin.'
