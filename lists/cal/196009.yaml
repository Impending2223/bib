entries:
  - id: cal.1960-09.cuba
    when: Sept.
    date: 1960-09
    thread: cuba
    c: 'At the Plaza Hotel in New York, Robert Maheu introduces John Rosselli to the chief of the CIA Office of Security''s support division: the Agency wants Castro killed, through men with gambling interests in Havana. Bissell had asked Sheffield Edwards in August to find someone. The meeting Sept. 14, by the Inspector General''s report of 1967; during Castro''s stay at the UN, Sept. 18–28, by Rosselli.'
    n: '[S. Rep. No. 94-465, 74–76 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85). Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975; in part, Drew Pearson and Jack Anderson''s column, Mar. 7, 1967 (Check). To check: [[w.thomas-very-best-men]]; [[w.bohning-castro-obsession]]; [[w.hersh-dark-side-of-camelot]]; [[w.wyden-bay-of-pigs]]. Names: Maheu, Rosselli, Bissell, Edwards, Castro.'
    tags: [name:maheu-robert-a, name:rosselli-john, name:bissell-richard-m-jr, name:edwards-sheffield, name:castro-fidel]
  - id: cal.1960-09-01.congress
    when: Sept. 1
    date: '1960-09-01'
    thread: congress
    c: 86th Congress adjourns sine die, ending the session Johnson and Rayburn reconvened Aug. 8, after the conventions. No agreement in conference on the minimum wage; no school or housing bill out of the House Rules Committee; medical care for the aged through Social Security refused. Kerr–Mills and the Latin American fund passed.
    n: 'H. Con. Res. 745, [74 Stat. B12](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf). To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.sundquist-politics-and-policy]]. Names: Johnson, Rayburn, Kerr, Mills.'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, appropriations:86-2, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-09-01.civil-rights-the-executive
    when: Sept. 1
    date: '1960-09-01'
    thread: civil-rights-the-executive
    also: [civil-rights-bill]
    c: Kennedy and twenty-three Democratic Senators pledge a civil rights bill early in the next session. Discrimination in federal housing programs the President could end by executive order, "by a stroke of his pen." Kennedy asks Clark and Celler to draft the bill on the platform's lines.
    n: '[Statement by Senator Kennedy on Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-kennedy-civil-rights-legislation); [Press Conference of Senator John F. Kennedy, Caucus Room, Senate Office Building](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-caucus-room-senate-office-building-washington-dc) (Sept. 1, 1960). To check: [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.wofford-of-kennedys-and-kings]]. Names: Kennedy, Clark, Celler.'
    tags: [name:kennedy-john-f, name:clark-joseph-s, name:celler-emanuel]
  - id: cal.1960-09-05.vietnam
    when: Sept. 5–10
    date: '1960-09-05'
    thread: vietnam
    c: Third Congress of the Vietnam Workers' Party, Hanoi. Its resolution sets two tasks, socialism in the North and the liberation of the South. Lê Duẩn First Secretary; Hồ Chí Minh chairman.
    n: 'FRUS 1958–60, I, docs. [186](https://history.state.gov/historicaldocuments/frus1958-60v01/d186) (Durbrow, Aug. 25, on the congress to come), [260](https://history.state.gov/historicaldocuments/frus1958-60v01/d260) (State''s intelligence bureau, Dec. 7, citing its resolutions). [[w.vietnam-victory-in-vietnam]], 73–74 (the Congress; its two tasks); [[w.futrell-united-states-air-force]], 56 (the party''s call of Sept. 10 for a front in the South); [[w.nguyen-hanois-war]], 51–53; [[w.asselin-hanois-road-to-the]], 83–87 (all but the days and Hồ Chí Minh''s chair). To check: [[w.duiker-communist-road-to-power]]; [[w.elliott-vietnamese-war]]; [[w.kahin-intervention]]; Cong Rec, May 9, 1968, p 12617 (cited by [[w.futrell-united-states-air-force]], 56 n.31a); MACV hist monograph, Military Assistance to the Republic of South Vietnam, pp 9-11 (cited by [[w.futrell-united-states-air-force]], 56 n.31b); the political report to the Third Congress, September 1960 (cited by [[w.vietnam-victory-in-vietnam]], 74 n.1); the French delegation at Hanoi to the Foreign Ministry, Sept. 22, 1960, Archives diplomatiques (cited by [[w.asselin-hanois-road-to-the]], 83 n.65); the British consulate general at Hanoi to the Foreign Office, Sept. 26, 1960, FO 371/152747 (cited by [[w.asselin-hanois-road-to-the]], 85 n.87, for the North first); *Third National Congress of the Viet Nam Workers'' Party: Documents*, I, 222 (cited by [[w.asselin-hanois-road-to-the]], 86 n.88, for the two tasks); Lê Duẩn''s political report to the congress, Sept. 5, 1960, *Văn kiện Đảng toàn tập*, 21:495–656 (cited by [[w.nguyen-hanois-war]], 52 n.4, for the two tasks). Names: Lê Duẩn, Hồ Chí Minh.'
