  - id: cal.1960-09-02.elections-1960
    when: Sept. 2–3
    date: '1960-09-02'
    thread: elections-1960-kennedy
    c: 'Kennedy, free of the Senate, opens his campaign, by chartered jet from Friendship Airport, Baltimore, Friday afternoon: Presque Isle, Maine; Bangor, Maine; Portland, Maine; then Manchester, N.H. San Francisco by Saturday noon; Anchorage and Palmer, Alaska, Saturday night; then, after four hours'' sleep, to Detroit.'
    n: 'Remarks of Senator John F. Kennedy, Presque Isle, Maine, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally); Speech of Senator John F. Kennedy, Bangor, Maine, Fair Grounds, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-bangor-maine-fair-grounds); Speech of Senator John F. Kennedy, Portland, Maine, Portland Stadium, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-portland-maine-portland-stadium); Remarks of Senator John F. Kennedy, Manchester, NH, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-manchester-nh-airport-rally) (Sept. 2, 1960); Remarks of Senator John F. Kennedy, San Francisco, CA, International Airport, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-san-francisco-ca-international-airport); Speech of Senator John F. Kennedy, the Edgewater, Anchorage, AK, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-the-edgewater-anchorage-ak); Speech of Senator John F. Kennedy, Fairgrounds, Palmer, Alaska, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-fairgrounds-palmer-alaska) (Sept. 3, 1960). [[w.white-making-of-the-president]], 251–52; [[w.communications-freedom-of-communications-part]], 78–104 (Sept. 2: Manchester, N.H., 78, and Presque Isle, Maine, 80, airport rallies, Bangor, 82, Portland Stadium, 91; Sept. 3: San Francisco airport, 95, Palmer, 100, The Edgewater, Anchorage, 101; not the jet, Baltimore, the hours or the order of Sept. 2); [[w.communications-freedom-of-communications-part]], 109 (Kennedy at the Detroit airport, Sept. 4: "Friday night we campaigned in Portland, Maine, Saturday at noon we went to San Francisco, Saturday night we went to Alaska"; not the four hours'' sleep). Check: the order of the Sept. 2 stops; [[w.communications-freedom-of-communications-part]] has Kennedy at Manchester, N.H., "it is proper to start here in New Hampshire" (79), at Presque Isle "on this first day" (80–81), and at Portland, Maine, in the evening: "We have traveled from Presque Isle, and we are going to speak tonight and go to Washington" (83). See [[cal.1960-07.elections-1960-4]]. Names: Kennedy.'
