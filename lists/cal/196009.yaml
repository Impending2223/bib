    c: 'A Defense Department statement corrects its denial of Sept. 7: "one of the men, Mitchell, in his employment interview, stated that in his teens he had engaged in certain abnormal sexual practices."'
    n: '[[w.huac-security-practices-nsa]], 3 (the denial of Sept. 7; the "corrective public statement" of Sept. 12, as quoted). Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 2 (the lie-detector check at Mitchell''s employment, which "revealed that Mitchell had some sexual aberration prior to age 20"). See [[cal.1960-09-07.intelligence-2]].'
