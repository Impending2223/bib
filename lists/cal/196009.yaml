    c: 'El Paso, Tex., the airport, late at night, more than twenty thousand at the plane, to the amazement of Rayburn, who is with them. Johnson boards with newspaper clippings of what a Kennedy advance man, whom the authors call "Pete Reynolds," told El Paso reporters: "Kennedy is more popular down here than Johnson, and he needs us in Texas more than we need him." Kennedy hands the clippings to O''Donnell, who tells the man to take the next plane out. Johnson talks of him to O''Donnell until five in the morning; at breakfast: "I was too busy thinking about that feller you brought down here from Boston."'
