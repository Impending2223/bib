  - id: cal.1960-09-01.congress
    when: Sept. 1
    date: '1960-09-01'
    thread: congress
    c: 86th Congress adjourns sine die, ending the session Johnson and Rayburn reconvened Aug. 8, after the conventions. No agreement in conference on the minimum wage; no school or housing bill out of the House Rules Committee; medical care for the aged through Social Security refused. Kerr–Mills and the Latin American fund passed.
    n: 'H. Con. Res. 745, [74 Stat. B12](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf). [[w.sundquist-politics-and-policy]], 307, 513 n.6 (Kerr–Mills passed and Medicare through Social Security refused, 307; no conference on the minimum wage, no school or housing bill from Rules, 513 n.6); [[w.white-making-of-the-president]], 249, 251 (the session; Kennedy''s measures dead in the House). To check: [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]. Names: Johnson, Rayburn, Kerr, Mills.'
    src:
      c: 3d428fae
      rows:
        - 'https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf: all'
        - 'w.sundquist-politics-and-policy 307: D-E'
        - 'w.sundquist-politics-and-policy 513 n.6: B-C'
        - 'w.white-making-of-the-president 249, 251: A, D'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, appropriations:86-2, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-09-01.civil-rights-the-executive
    when: Sept. 1
    date: '1960-09-01'
    thread: civil-rights-the-executive
    also: [civil-rights-bill]
    c: Kennedy and twenty-three Democratic Senators pledge a civil rights bill early in the next session. Discrimination in federal housing programs the President could end by executive order, "by a stroke of his pen." Kennedy asks Clark and Celler to draft the bill on the platform's lines.
    n: '[Statement by Senator Kennedy on Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-kennedy-civil-rights-legislation); [Press Conference of Senator John F. Kennedy, Caucus Room, Senate Office Building](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-caucus-room-senate-office-building-washington-dc) (Sept. 1, 1960). [[w.mann-walls-of-jericho]], 300–301 (Clark and Celler asked to draft the bill). To check: [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.wofford-of-kennedys-and-kings]]. Names: Kennedy, Clark, Celler.'
