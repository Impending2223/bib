    c: 'Eisenhower to Lord Home: he wishes Lumumba "would fall into a river full of crocodiles." The same day Tweedy cables Devlin, chief of station at Leopoldville: a man to arrive about Sept. 27, "Joe from Paris."'
    n: 'FRUS 1958–60, XIV, doc. [221](https://history.state.gov/historicaldocuments/frus1958-60v14/d221). FRUS 1964–68, XXIII, doc. [24](https://history.state.gov/historicaldocuments/frus1964-68v23/d24). [S. Rep. No. 94-465, 21–25 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=32), where Devlin is "Victor Hedgman." [[w.devlin-chief-of-station-congo]]. [[w.sen-church-alleged-assassination-plots]], 23 (the cable of Sept. 19, signed by Bissell and Tweedy, to the "Station Officer" (Devlin), not called chief of station: "Joe" to arrive "approx 27 Sept," "Joe from Paris"; not Eisenhower and Lord Home). See [[cal.1960-08-18.congo-2]]. Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975. Names: Eisenhower, Douglas-Home, Lumumba, Tweedy, Devlin.'
