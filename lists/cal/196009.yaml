# Cal. X September 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: X
entries:
  - id: cal.1960-09.cuba
    when: Sept.
    date: 1960-09
    thread: cuba
    c: 'At the Plaza Hotel in New York, Robert Maheu introduces John Rosselli to the chief of the CIA Office of Security''s support division: the Agency wants Castro killed, through men with gambling interests in Havana. Bissell had asked Sheffield Edwards in August to find someone. The meeting Sept. 14, by the Inspector General''s report of 1967; during Castro''s stay at the UN, Sept. 18–28, by Rosselli.'
    n: '[S. Rep. No. 94-465, 74–76 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85). [[w.thomas-very-best-men]]; [[w.bohning-castro-obsession]]; [[w.hersh-dark-side-of-camelot]]; [[w.wyden-bay-of-pigs]]. Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975; in part, Drew Pearson and Jack Anderson''s column, Mar. 7, 1967 (Check). Names: Maheu, Rosselli, Bissell, Edwards, Castro.'
    tags: [name:maheu-robert-a, name:rosselli-john, name:bissell-richard-m-jr, name:edwards-sheffield, name:castro-fidel]
  - id: cal.1960-09-01.congress
    when: Sept. 1
    date: '1960-09-01'
    thread: congress
    c: 86th Congress adjourns sine die, ending the session Johnson and Rayburn reconvened Aug. 8, after the conventions. No agreement in conference on the minimum wage; no school or housing bill out of the House Rules Committee; medical care for the aged through Social Security refused. Kerr–Mills and the Latin American fund passed.
    n: 'H. Con. Res. 745, [74 Stat. B12](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-PgB12.pdf). [[w.caro-master-of-the-senate]]; [[w.dallek-lone-star-rising]]; [[w.sundquist-politics-and-policy]]. Names: Johnson, Rayburn, Kerr, Mills.'
    tags: [name:johnson-lyndon-b, name:rayburn-sam, appropriations:86-2, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-09-01.civil-rights-the-executive
    when: Sept. 1
    date: '1960-09-01'
    thread: civil-rights-the-executive
    also: [civil-rights-bill]
    c: Kennedy and twenty-three Democratic Senators pledge a civil rights bill early in the next session. Discrimination in federal housing programs the President could end by executive order, "by a stroke of his pen." Kennedy asks Clark and Celler to draft the bill on the platform's lines.
    n: '[Statement by Senator Kennedy on Civil Rights Legislation](https://www.presidency.ucsb.edu/documents/statement-senator-kennedy-civil-rights-legislation); [Press Conference of Senator John F. Kennedy, Caucus Room, Senate Office Building](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-caucus-room-senate-office-building-washington-dc) (Sept. 1, 1960). [[w.brauer-john-f-kennedy-and]]; [[w.stern-calculating-visions]]; [[w.bryant-bystander]]; [[w.wofford-of-kennedys-and-kings]]. Names: Kennedy, Clark, Celler.'
    tags: [name:kennedy-john-f, name:clark-joseph-s, name:celler-emanuel]
  - id: cal.1960-09-05.vietnam
    when: Sept. 5–10
    date: '1960-09-05'
    thread: vietnam
    c: Third Congress of the Vietnam Workers' Party, Hanoi. Its resolution sets two tasks, socialism in the North and the liberation of the South. Lê Duẩn First Secretary; Hồ Chí Minh chairman.
    n: 'FRUS 1958–60, I, docs. [186](https://history.state.gov/historicaldocuments/frus1958-60v01/d186) (Durbrow, Aug. 25, on the congress to come), [260](https://history.state.gov/historicaldocuments/frus1958-60v01/d260) (State''s intelligence bureau, Dec. 7, citing its resolutions). [[w.asselin-hanois-road-to-the]]; [[w.nguyen-hanois-war]]; [[w.duiker-communist-road-to-power]]; [[w.elliott-vietnamese-war]]; [[w.kahin-intervention]]; [[w.vietnam-victory-in-vietnam]], 73–74. Names: Lê Duẩn, Hồ Chí Minh.'
    tags: [name:le-duan, name:ho-chi-minh, place:hanoi]
  - id: cal.1960-09-05.congo
    when: Sept. 5
    date: '1960-09-05'
    thread: congo
    c: Kasavubu dismisses Lumumba and names Ileo; Lumumba, on the radio, dismisses Kasavubu. The UN closes the airports and the radio station.
    n: 'FRUS 1964–68, XXIII, doc. [15](https://history.state.gov/historicaldocuments/frus1964-68v23/d15) (the station). See [[cal.1960-06-30.congo]]. Names: Kasavubu, Lumumba, Ileo.'
    tags: [name:kasavubu-joseph, name:lumumba-patrice, name:ileo-joseph]
  - id: cal.1960-09-05.latin-america
    when: Sept. 5–6
    date: '1960-09-05'
    thread: latin-america
    c: 'The OAS Committee of 21 at Bogotá. Dillon, Sept. 6, offers an inter-American program for social development: land, housing, schools, health.'
    n: 'FRUS 1958–60, V, microfiche supp., docs. [ETA–48](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d48), [ETA–49](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d49) (instructions, Sept. 2). Dillon''s statement: [[w.department-of-state-bulletin]], [Oct. 3, 1960, 533](https://archive.org/details/departmentofstat4360unit/page/533/mode/1up). [[w.rabe-eisenhower-and-latin-america]]; [[w.taffet-foreign-aid-as-foreign]]; [[w.levinson-alliance-that-lost-its]]; [[w.rabe-most-dangerous-area-in]]. Names: Dillon.'
    tags: [name:dillon-c-douglas]
  - id: cal.1960-09-07.congo
    when: Sept. 7
    date: '1960-09-07'
    thread: congo
    c: The CIA station meets Colonel Mobutu, and pays him. The NSC on the Congo.
    n: 'FRUS 1958–60, XIV, doc. [199](https://history.state.gov/historicaldocuments/frus1958-60v14/d199) (NSC). FRUS 1964–68, XXIII, doc. [19](https://history.state.gov/historicaldocuments/frus1964-68v23/d19) (the station and Mobutu). Made public: FRUS 1964–68, XXIII (2013). See [[cal.1960-06-30.congo]]. Names: Mobutu.'
    tags: [name:mobutu-joseph-d]
  - id: cal.1960-09-08.space
    when: Sept. 8
    date: '1960-09-08'
    thread: space
    c: Eisenhower dedicates the George C. Marshall Space Flight Center at Huntsville, NASA's from July 1; von Braun's Army rocket team its staff, von Braun director.
    n: 'Remarks at the Dedication of the George C. Marshall Space Flight Center, Huntsville, Alabama, [1960–61 Pub. Papers 689](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=741) (Sept. 8, 1960). [[w.dunar-power-to-explore]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.divine-sputnik-challenge]]. Names: Eisenhower, von Braun.'
    tags: [name:eisenhower-dwight-d, name:von-braun-wernher]
  - id: cal.1960-09-08.berlin-and-vienna
    when: Sept. 8
    date: '1960-09-08'
    thread: berlin-and-vienna
    c: East Germany requires West Germans to obtain permits to enter East Berlin, and stops honoring West German passports held by West Berliners.
    n: 'Check: the record. [[w.harrison-driving-the-soviets-up]]; [[w.eisenhower-white-house-years]].'
  - id: cal.1960-09-08.latin-america
    when: Sept. 8
    date: '1960-09-08'
    thread: latin-america
    c: 'The Latin American aid act signed, [74 Stat. 869](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg869.pdf): $500 million for the Bogotá program; $100 million for Chile''s earthquake.'
    n: 'See [[cal.1960-09-05.latin-america]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-09-10.laos
    when: Sept. 10
    date: '1960-09-10'
    thread: laos
    c: At Savannakhet, Prince Boun Oum and General Phoumi Nosavan proclaim a "revolution" against Souvanna Phouma's government. State regrets the split among the non-Communists, disclaims intervention, and warns "outside powers."
    n: 'FRUS 1958–60, XVI, docs. [392](https://history.state.gov/historicaldocuments/frus1958-60v16/d392), [396](https://history.state.gov/historicaldocuments/frus1958-60v16/d396) (NSC, Sept. 15). [[w.department-of-state-bulletin]], [Sept. 26, 1960, 499](https://archive.org/details/departmentofstat431960unit/page/499/mode/1up). See [[cal.1960-08-09.laos]]. Names: Boun Oum na Champassak, Phoumi Nosavan, Souvanna Phouma.'
    tags: [name:boun-oum-na-champassak, name:phoumi-nosavan, name:souvanna-phouma, name:herter-christian-a, place:savannakhet]
  - id: cal.1960-09-10.middle-east
    when: Sept. 10–14
    date: '1960-09-10'
    thread: middle-east
    also: [oil]
    c: 'Baghdad. Iraq, Iran, Kuwait, Saudi Arabia and Venezuela, after the companies'' cuts in posted prices, found the Organization of the Petroleum Exporting Countries, Sept. 14: prices to be restored, then kept stable.'
    n: '[FRUS 1958–60, XII, doc. 90](https://history.state.gov/historicaldocuments/frus1958-60v12/d90) (Baghdad, Sept. 15). [[w.sampson-seven-sisters]]; [[w.skeet-opec]]; [[w.yergin-prize]]; [[w.garavini-rise-and-fall-of]].'
  - id: cal.1960-09-12.elections-1960
    when: Sept. 12
    date: '1960-09-12'
    thread: elections-1960
    c: 'Houston. Kennedy to the Greater Houston Ministerial Association at the Rice Hotel, and its questions: "I believe in an America where the separation of church and state is absolute." Sept. 7: Norman Vincent Peale and Protestant clergy, meeting in Washington as the National Conference of Citizens for Religious Freedom, had asked whether a Catholic President could be free of his church.'
    n: '[Speech of Senator John F. Kennedy, Greater Houston Ministerial Association, Rice Hotel](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-greater-houston-ministerial-association-rice-hotel-houston); [Question and Answer Period](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-ministerial-association) (Sept. 12, 1960). [[w.casey-making-of-a-catholic]]; [[w.carty-catholic-in-the-white]]; [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]. Names: Kennedy, Peale.'
    tags: [name:kennedy-john-f, name:peale-norman-vincent]
  - id: cal.1960-09-12.elections-1960-2
    when: Sept. 12
    date: '1960-09-12'
    thread: elections-1960
    c: Nixon, out of Walter Reed Sept. 9 after twelve days with an infected knee, opens his campaign with Eisenhower at Friendship Airport, Baltimore; then Indianapolis, Dallas and San Francisco the same day. His pledge from Chicago, to campaign in all fifty States.
    n: 'Remarks at the Opening of the Republican Campaign, Friendship International Airport Near Baltimore, [1960–61 Pub. Papers 694](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=746) (Eisenhower); [Excerpts of Remarks by the Vice President at Friendship Airport](https://www.presidency.ucsb.edu/documents/excerpts-remarks-the-vice-president-friendship-airport-baltimore-md) (Sept. 12, 1960). [[w.nixon-six-crises]]; [[w.gellman-president-and-the-apprentice]]; [[w.frank-ike-and-dick]]. Names: Nixon, Eisenhower.'
    tags: [name:nixon-richard-m, name:eisenhower-dwight-d]
  - id: cal.1960-09-12.oil
    when: Sept. 12–16
    date: '1960-09-12'
    thread: oil
    also: [middle-east]
    c: 'Esso Export restores up to 4 cents a barrel of its Middle East cuts, to the other companies'' postings: Arabian light at Ras Tanura $1.80, Iranian at Bandar Mashur $1.78, Iraq''s at Fao $1.72, Kuwait $1.59, Qatar $1.95.'
    n: '[*The Oil and Gas Journal*, Sept. 19, 1960, 81](https://archive.org/details/sim_oil-gas-journal_1960-09-19_58_38/page/n88) ("last week"). Check: the day. See [[cal.1960-08-09.oil]].'
  - id: cal.1960-09-13.medicare
    when: Sept. 13
    date: '1960-09-13'
    thread: medicare
    c: 'Social Security Amendments of 1960 signed, [74 Stat. 924](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg924.pdf). Kerr–Mills: federal grants to the States for medical care of the aged poor, at the States'' option. Disability benefits no longer limited to workers fifty and over.'
    n: 'Statute (K–J Cong. II.J.2). See [[cal.1960-03-31.medicare]]. Names: Eisenhower, Kerr, Mills.'
    tags: [name:eisenhower-dwight-d, name:kerr-robert-s, name:mills-wilbur-d]
  - id: cal.1960-09-13.governors-wa
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Washington''s blanket primary, for governor: Andrews (R), the lieutenant governor, 263,897, 37.4 percent; Governor Rosellini (D) 244,579, 34.6; Newman Clark (R) 144,440, 20.5. Andrews and Rosellini nominated.'
    n: 'Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) (the Secretary''s database, 1898–2006, "1960 Primary"), and [Wikipedia, "1960 Washington gubernatorial election"](https://en.wikipedia.org/wiki/1960_Washington_gubernatorial_election), alike; Check: Wash. *Official Abstract of Votes, State Primary, September 13, 1960*, 9. [[w.schwantes-pacific-northwest]]; [[w.peirce-pacific-states-of-america]]. Names: Rosellini, Andrews, Newman Clark.'
    tags: [state:wa, name:andrews-lloyd-j, name:rosellini-albert-d, name:clark-newman-h]
  - id: cal.1960-09-13.governors-ut
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Utah''s primary, for governor. Republican: Governor Clyde 50,592, 57.8 percent, over Gunderson, 37,002. Democratic: Barlocker 74,424, 70.6, over Huggins.'
    n: 'Votes: [Wikipedia, "1960 Utah gubernatorial election"](https://en.wikipedia.org/wiki/1960_Utah_gubernatorial_election); Check: Utah, *Abstract of the Returns of the Primary Election*, Sept. 13, 1960 (Utah State Archives). [[w.peirce-mountain-states-of-america]]. Names: Clyde, Gunderson, Barlocker, Huggins.'
    tags: [state:ut, name:clyde-george-d, name:gunderson-lamont-b, name:barlocker-william-a, name:huggins-ira-a]
  - id: cal.1960-09-13.governors-mn
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Minnesota, governor. DFL primary: Governor Freeman 88.8 percent, one other 11.2. Republican: Andersen, a former State Senator, unopposed.'
    n: '[*Report of the State Canvassing Board, Primary Election, September 13, 1960*](https://www.lrl.mn.gov/docs/2023/Other/232069/1960.pdf). [[w.andersen-mans-reach]]; [[w.peirce-great-plains-states-of]]. Names: Freeman, Andersen.'
    tags: [state:mn, name:freeman-orville-l, name:andersen-elmer-l]
  - id: cal.1960-09-13.governors-ma
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: 'Massachusetts primary. Democratic, for governor: Ward, Secretary of the Commonwealth, 180,848, 30.2 percent; Peabody 152,762, 25.5; Attorney General Kelly 16.4; four others. Furcolo, the governor, runs for the Senate. Volpe unopposed for the Republican nomination after the party''s convention.'
    n: '[Mass. *Election Statistics*, 1960 (P.D. 43), p. 159](https://archive.org/details/electionstatisti19591960mass/page/n226). [Wikipedia, "1960 Massachusetts gubernatorial election"](https://en.wikipedia.org/wiki/1960_Massachusetts_gubernatorial_election). [[w.litt-political-cultures-of-massachusetts]]; [[w.peirce-megastates-of-america]]. Names: Ward, Peabody, Francis E. Kelly, Furcolo, Volpe.'
    tags: [state:ma, name:ward-joseph-d, name:peabody-endicott, name:kelly-francis-e, name:furcolo-foster, name:volpe-john-a]
  - id: cal.1960-09-13.governors-nh
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: New Hampshire's Republican primary for governor. Powell, the governor, 49,119, 49.9 percent; Gregg, governor 1953–55, 48,108. Boutin the Democrat.
    n: '[N.H. *Manual for the General Court*, no. 37 (1961), p. 436](https://archive.org/details/manualforgeneral37newh/page/n471). [Wikipedia, "1960 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Hampshire_gubernatorial_election). [[w.peirce-new-england-states]]. Names: Powell, Gregg, Boutin.'
    tags: [state:nh, name:powell-wesley, name:gregg-hugh, name:boutin-bernard-l]
  - id: cal.1960-09-13.governors-vt
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: Vermont's Republican primary for governor, Stafford not running. Keyser, Speaker of the Vermont House, 17,491, 29.6 percent; Babcock 28.4; Crispe 25.2; Simpson 16.8. Keyser elected in November over Niquette (D), 56.4.
    n: '[Vt. Secretary of State, "Primary Election Results, 1960"](https://web.archive.org/web/20160304051924/https://www.sec.state.vt.us/media/62965/p1960.pdf); [Wikipedia, "1960 Vermont gubernatorial election"](https://en.wikipedia.org/wiki/1960_Vermont_gubernatorial_election). Check against the *Legislative Directory*, 1961. [[w.hand-star-that-set]]. Names: Stafford, Keyser, Robert S. Babcock, Crispe, Simpson, Niquette.'
    tags: [state:vt, name:stafford-robert-t, name:keyser-f-ray-jr, name:babcock-robert-s, name:crispe-a-luke, name:simpson-w-arthur, name:niquette-russell-f]
  - id: cal.1960-09-13.latin-america
    when: Sept. 13
    date: '1960-09-13'
    thread: latin-america
    c: The Act of Bogotá signed by all present but Cuba; the Dominican Republic absent. Check the date.
    n: 'The Act: [[w.department-of-state-bulletin]], [Oct. 3, 1960, 537](https://archive.org/details/departmentofstat4360unit/page/537/mode/1up). FRUS 1958–60, V, doc. [41](https://history.state.gov/historicaldocuments/frus1958-60v05/d41) (editorial note); microfiche supp., doc. [ETA–55](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d55). See [[cal.1960-09-05.latin-america]].'
  - id: cal.1960-09-14.congo
    when: Sept. 14
    date: '1960-09-14'
    thread: congo
    c: Mobutu "neutralizes" Kasavubu, Lumumba and the parliament to the year's end and orders the Soviet and Czechoslovak embassies out.
    n: 'FRUS 1958–60, XIV, docs. [215](https://history.state.gov/historicaldocuments/frus1958-60v14/d215), [216](https://history.state.gov/historicaldocuments/frus1958-60v14/d216) (NSC, Sept. 15). See [[cal.1960-06-30.congo]]. Names: Mobutu, Kasavubu, Lumumba.'
    tags: [name:mobutu-joseph-d, name:kasavubu-joseph, name:lumumba-patrice]
  - id: cal.1960-09-16.japan-and-korea
    when: Sept. 16
    date: '1960-09-16'
    thread: japan
    c: 'Eisenhower to Ikeda: the postponed visit understood; he hopes to come "at some future time."'
    n: 'Exchange of Letters Between the President and Prime Minister Ikeda of Japan, [1960–61 Pub. Papers 699](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=751) (Sept. 16, 1960). See [[cal.1960-01-19.japan-and-korea]]. Names: Eisenhower, Ikeda.'
    tags: [name:eisenhower-dwight-d, name:ikeda-hayato]
  - id: cal.1960-09-19.soviet-union
    when: Sept. 19–20
    date: '1960-09-19'
    thread: soviet-union-un
    also: [cuba]
    c: 'Khrushchev to New York aboard the *Baltic*, Sept. 19, for the UN General Assembly, his movements held to Manhattan. Castro, in New York since the 18th, moves to the Hotel Theresa in Harlem; Khrushchev calls on him there, Sept. 20. The Assembly''s fifteenth session opens Sept. 20 and admits fourteen new members: thirteen African States and Cyprus.'
    n: 'FRUS 1958–60, II, docs. [153](https://history.state.gov/historicaldocuments/frus1958-60v02/d153), [165](https://history.state.gov/historicaldocuments/frus1958-60v02/d165) (Manhattan), [177](https://history.state.gov/historicaldocuments/frus1958-60v02/d177). Statement by the President Concerning the Attendance of Chiefs of State and Heads of Government at the U.N. General Assembly, [1960–61 Pub. Papers 702](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=754) (Sept. 17, 1960). [[w.taubman-khrushchev]]; [[w.fursenko-khrushchevs-cold-war]]; [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.urquhart-hammarskjold]]; [[w.gosse-where-the-boys-are]], on Castro in Harlem; [[w.fursenko-one-hell-of-a]]. Names: Khrushchev, Castro.'
    tags: [name:khrushchev-nikita-s, name:castro-fidel]
  - id: cal.1960-09-19.congo
    when: Sept. 19
    date: '1960-09-19'
    thread: congo-lumumba
    c: 'Eisenhower to Lord Home: he wishes Lumumba "would fall into a river full of crocodiles." The same day Tweedy cables Devlin, chief of station at Leopoldville: a man to arrive about Sept. 27, "Joe from Paris."'
    n: 'FRUS 1958–60, XIV, doc. [221](https://history.state.gov/historicaldocuments/frus1958-60v14/d221). FRUS 1964–68, XXIII, doc. [24](https://history.state.gov/historicaldocuments/frus1964-68v23/d24). [S. Rep. No. 94-465, 21–25 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=32), where Devlin is "Victor Hedgman." [[w.devlin-chief-of-station-congo]]. See [[cal.1960-08-18.congo-2]]. Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975. Names: Eisenhower, Douglas-Home, Lumumba, Tweedy, Devlin.'
    tags: [name:eisenhower-dwight-d, name:lumumba-patrice, name:tweedy-bronson, name:devlin-lawrence-r, name:douglas-home-alec]
  - id: cal.1960-09-20.state-constitutions-ok
    when: Sept. 20
    date: '1960-09-20'
    thread: state-constitutions
    also: [legislatures]
    c: Oklahoma, special election; three initiatives refused. Apportionment of the Legislature by a commission of the Attorney General, Treasurer and Secretary of State, with forty-eight Senate districts of near-equal population, 189,348 to 347,180. A constitutional State Highway Commission, 186,176 to 351,774; county roads to the State at each county's choice, 183,173 to 353,446.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 20–21](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=20). [[w.dixon-democratic-representation]]. See [[cal.1960-07-05.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1960-09-21.middle-east
    when: Sept. 21
    date: '1960-09-21'
    thread: middle-east
    c: 'The NSC on OPEC. Eisenhower: anyone could break it up "by offering five cents more per barrel for the oil of one of the countries." Dulles: the five hold 80 percent of the world''s reserves.'
    n: '[FRUS 1958–60, IV, doc. 309](https://history.state.gov/historicaldocuments/frus1958-60v04/d309). See [[cal.1960-09-10.middle-east]]. Names: Eisenhower, Dulles.'
    tags: [name:eisenhower-dwight-d, name:dulles-allen-w]
  - id: cal.1960-09-22.soviet-union
    when: Sept. 22
    date: '1960-09-22'
    thread: soviet-union-un
    also: [congo]
    c: Eisenhower to the General Assembly. A program for Africa through the UN; support for Hammarskjöld and the UN in the Congo; no weapons of mass destruction in orbit; an end to producing fissionable material for weapons. Food for Peace through the UN.
    n: 'Address Before the 15th General Assembly of the United Nations, New York City, [1960–61 Pub. Papers 707](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=759) (Sept. 22, 1960). FRUS 1958–60, II, doc. [180](https://history.state.gov/historicaldocuments/frus1958-60v02/d180). See [[cal.1960-09-19.soviet-union]]. Names: Eisenhower, Hammarskjöld.'
    tags: [name:eisenhower-dwight-d, name:hammarskjold-dag]
  - id: cal.1960-09-23.soviet-union
    when: Sept. 23
    date: '1960-09-23'
    thread: soviet-union-un
    also: [congo]
    c: 'Khrushchev to the Assembly: abolish the Secretary-General for a three-man executive, West, East and neutral; a declaration ending colonial rule. Wadsworth answers that afternoon.'
    n: 'FRUS 1958–60, II, docs. [183](https://history.state.gov/historicaldocuments/frus1958-60v02/d183), [185](https://history.state.gov/historicaldocuments/frus1958-60v02/d185). See [[cal.1960-09-19.soviet-union]]. Names: Khrushchev, Wadsworth.'
    tags: [name:khrushchev-nikita-s, name:wadsworth-james-j]
  - id: cal.1960-09-26.soviet-union-un
    when: Sept. 26
    date: '1960-09-26'
    thread: soviet-union-un
    also: [congo, cuba]
    c: Hammarskjöld replies to Khrushchev, Soviet delegates pounding their desks. Castro speaks four and a half hours.
    n: 'U.N. doc. A/PV.871 (Hammarskjöld). FRUS 1958–60, II, doc. [189](https://history.state.gov/historicaldocuments/frus1958-60v02/d189). See [[cal.1960-09-19.soviet-union]]. Names: Hammarskjöld, Khrushchev, Castro.'
    tags: [name:hammarskjold-dag, name:khrushchev-nikita-s, name:castro-fidel]
  - id: cal.1960-09-26.congo-lumumba
    when: Sept. 26
    date: '1960-09-26'
    thread: congo-lumumba
    c: Sidney Gottlieb of the CIA at Leopoldville with poisons for Lumumba. Lumumba, under UN guard and ringed by Mobutu's troops, is not reached.
    n: 'FRUS 1964–68, XXIII, docs. [28](https://history.state.gov/historicaldocuments/frus1964-68v23/d28), [30](https://history.state.gov/historicaldocuments/frus1964-68v23/d30). [S. Rep. No. 94-465, 21–25 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=32), where Gottlieb is "Joseph Scheider." Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-08-18.congo-2]]. Names: Gottlieb, Lumumba, Mobutu.'
    tags: [name:gottlieb-sidney, name:lumumba-patrice, name:mobutu-joseph-d]
  - id: cal.1960-09-26.elections-1960
    when: Sept. 26
    date: '1960-09-26'
    thread: elections-1960
    c: First of four Kennedy–Nixon debates. Chicago, at WBBM (CBS); Howard K. Smith moderating; domestic policy. Opening statements of eight minutes, questions from four reporters. Section 315's equal-time rule suspended for the two nominees by joint resolution, Aug. 24.
    n: '[Presidential Debate in Chicago](https://www.presidency.ucsb.edu/documents/presidential-debate-chicago) (Sept. 26, 1960). The joint resolution: Pub. L. 86-677, [74 Stat. 554](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg554-3.pdf). [[w.great-debates]]; [[w.schroeder-presidential-debates]]; [[w.druckman-power-of-television-images]], the radio and television audiences; [[w.watson-expanding-vista]]; [[w.white-making-of-the-president]]; [[w.kallina-kennedy-v-nixon]]; [[w.donaldson-first-modern-campaign]]; [[w.rorabaugh-real-making-of-the]]; [[w.matthews-kennedy-and-nixon]]; [[w.nixon-six-crises]]. Names: Kennedy, Nixon, Howard K. Smith.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:smith-howard-k]
  - id: cal.1960-09-26.middle-east
    when: Sept. 26
    date: '1960-09-26'
    thread: middle-east
    c: 'Eisenhower and Nasser at the Waldorf Towers, New York, during the General Assembly. Eisenhower: aid best given through the UN; Khrushchev''s attack on it "wholly unwarranted." Nasser: thanks for 1956; the UN has not carried out its resolutions on Israel; in the Congo it must not hinder the legal government.'
    n: 'FRUS 1958–60, XIII, doc. [264](https://history.state.gov/historicaldocuments/frus1958-60v13/d264). [[w.stephens-nasser]]; [[w.burns-economic-aid-and-american]]; [[w.little-american-orientalism]]. See [[cal.1960-09-22.soviet-union]]. Names: Eisenhower, Nasser, Khrushchev.'
    tags: [name:eisenhower-dwight-d, name:nasser-gamal-abdel, name:khrushchev-nikita-s]
  - id: cal.1960-09-27.japan-and-korea
    when: Sept. 27
    date: '1960-09-27'
    thread: japan
    c: State dinner at the White House for Crown Prince Akihito and Princess Michiko.
    n: 'Toasts of the President and the Crown Prince of Japan, [1960–61 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=785) (Sept. 27, 1960). See [[cal.1960-09-16.japan-and-korea]]. Names: Akihito.'
    tags: [name:eisenhower-dwight-d, name:akihito]
  - id: cal.1960-09-28.governors-ri
    when: Sept. 28
    date: '1960-09-28'
    thread: governors
    also: [elections-1960]
    c: Rhode Island's Democratic primary for governor. Notte, the lieutenant governor, 73,607, 56.3 percent; Cote 57,200.
    n: '[R.I. Board of Elections, *Official Count*, 1960, p. 12](https://elections.ri.gov/sites/g/files/xkgbur756/files/publications/Election_Publications/Countbooks/1960-Count-Book.pdf#page=12). [[w.moakley-rhode-island-politics-and]]. Names: Notte, Cote.'
    tags: [state:ri, name:notte-john-a-jr, name:cote-armand-h]
  - id: cal.1960-09-29.soviet-union
    when: Sept. 29
    date: '1960-09-29'
    thread: soviet-union-un
    c: Nkrumah, Nehru, Nasser, Sukarno and Tito, by letter, ask Eisenhower and Khrushchev to meet. Khrushchev shouts down Macmillan's speech.
    n: 'FRUS 1958–60, II, docs. [197](https://history.state.gov/historicaldocuments/frus1958-60v02/d197) (the letter), [198](https://history.state.gov/historicaldocuments/frus1958-60v02/d198). [[w.macmillan-pointing-the-way-1959]], 275–79. See [[cal.1960-09-19.soviet-union]]. Names: Nkrumah, Nehru, Nasser, Sukarno, Tito, Eisenhower, Khrushchev, Macmillan.'
    tags: [name:nkrumah-kwame, name:nehru-jawaharlal, name:nasser-gamal-abdel, name:sukarno, name:tito-josip-broz, name:eisenhower-dwight-d, name:khrushchev-nikita-s, name:macmillan-harold]
  - id: cal.1960-09-30.berlin-and-vienna
    when: Sept. 30
    date: '1960-09-30'
    thread: berlin-and-vienna
    c: Bonn, pressed by Washington, gives notice ending the interzonal trade agreement on Dec. 31.
    n: FRUS 1958–60, IX, docs. [211](https://history.state.gov/historicaldocuments/frus1958-60v09/d211) (Kohler, Sept. 14, on trade as the sanction), [214](https://history.state.gov/historicaldocuments/frus1958-60v09/d214) (NSC, Sept. 21), [226](https://history.state.gov/historicaldocuments/frus1958-60v09/d226), [229](https://history.state.gov/historicaldocuments/frus1958-60v09/d229) (NSC, Oct. 6). See [[cal.1960-09-08.berlin-and-vienna]].
