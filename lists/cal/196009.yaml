    c: 'The Qinzheng Hall. Mao and Liu Shaoqi receive Ferhat Abbas, Prime Minister of the Algerian Provisional Government; Zhu De, Zhou Enlai, Dong Biwu, He Long, Chen Yi present. China supports the war; the referendum and French withdrawal right; United Nations troops to be called in with care: the Congo''s lesson, "invited in, it does not leave." Mao''s points, in writing: a long war; a narrow blow, 5 to 10 percent; prisoners taught and sent back.'
