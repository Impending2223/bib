    also: [cities-and-housing]
    c: 'Salem, Oreg. Kennedy''s statement on timber and housing: Republican failure on national forests and homebuilding; "a fresh and imaginative program."'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 24 ("Kennedy Pledges ''Fight for Peace''": Salem, a state fair crowd of more than 8,000; a better housing program, which would increase the demand for lumber; not the statement on timber or the national forests). [[w.communications-freedom-of-communications-part]], 149–150. See [[cal.1960-09-06.elections-1960]]. Names: Kennedy.'
    src:
      c: 2df7ef3d
      rows:
        - 'w.communications-freedom-of-communications-part 149–150: all'
        - 'https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html: ?'
    tags: [name:kennedy-john-f, state:or]
  - id: cal.1960-09-07.elections-1960-kennedy-3
    when: Sept. 7
    date: '1960-09-07'
    place: portland
    thread: elections-1960-kennedy
    c: 'Portland, Oreg., the Multnomah Hotel, a dinner speech with Mrs. Neuberger and Jackson present, and questions from the floor: the minimum wage lost in conference, labor and management.'
    n: '[[w.communications-freedom-of-communications-part]], 150–158. See [[cal.1960-09-06.elections-1960]]. Names: Kennedy, Neuberger, Jackson.'
    tags: [name:kennedy-john-f, name:neuberger-maurine-b, name:jackson-henry-m, state:or]
  - id: cal.1960-09-07.elections-1960-kennedy-7
    when: Sept. 7
    date: '1960-09-07'
    thread: elections-1960-kennedy
    c: 'As the *Times* reports it: Byrd of Virginia has not endorsed the Democratic ticket; neither of Georgia''s Senators, Russell or Talmadge, has spoken for Kennedy.'
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 35 ("Democrats Face a Setback in South, Survey Indicates," by Claude Sitton, "Democrats Face Trouble in South": "Byrd Is Silent," the failure of Byrd "to endorse the Democratic ticket"; "Lack of Endorsements," Russell and Talmadge). Names: Byrd, Russell, Talmadge, Kennedy.'
    tags: [name:byrd-harry-f, name:russell-richard-b, name:talmadge-herman-e, name:kennedy-john-f, state:va, state:ga]
  - id: cal.1960-09-07.elections-1960-kennedy-8
    when: Sept. 7
    date: '1960-09-07'
    place: nyc
    thread: elections-1960-kennedy
    c: 'The *Times* prints Claude Sitton''s report of two weeks of interviews in the South. William C. Battle, director of the Democratic Presidential campaign in Virginia: "There''s no doubt about it—we''re at our low point now." Hollings, Governor of South Carolina, forecasts an "uphill battle" for Kennedy there; Hodges, Governor of North Carolina: "I think [the race] is a little too close." Collins, Governor of Florida, and James Milligan, the party chairman, say Florida will be lost unless the State''s Democratic officeholders join a unified campaign. The Republicans claim the lead in Texas.'
    n: '[*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 35 ("Democrats Face a Setback in South, Survey Indicates," by Claude Sitton, Atlanta, Sept. 6: the interviews, over two weeks, undated; the words). See [[cal.1960-09-07.elections-1960-kennedy-7]]. Names: Sitton, Hollings, Hodges, Collins, Kennedy, Battle.'
    tags: [name:sitton-claude, name:hollings-ernest-f, name:hodges-luther-h, name:collins-leroy, name:kennedy-john-f, state:va, state:sc, state:nc, state:fl, state:tx, name:battle-william-c]
  - id: cal.1960-09-07.press-and-broadcasting
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: press-and-broadcasting
    c: Eisenhower's news conference, the Executive Office Building, 10:30 to 11:01 a.m.; 243 present.
    n: 'The President''s News Conference of September 7, 1960, [1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729) (677–86; the note, 686: the hour and the count). [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 5, 11, 16 (E. W. Kenworthy, "Eisenhower Bids Soviet Stop Aid to Congo Forces," at 1, 5; Felix Belair Jr., "Religion as Issue Denounced Again by White House," at 1, 16; Jack Raymond, "President Urges Security Review," at 1, 11; the transcript, at 16). Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
    time_range:
      - 1960-09-07T14:30Z
      - 1960-09-07T15:01Z
    time_zone: America/New_York
  - id: cal.1960-09-07.south-asia
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: south-asia
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'The opening statement: the Indus waters settled between Pakistan and India, "one bright spot"; thanks to Ayub, Nehru, Black of the World Bank and his deputy, Iliff. Asked of Kashmir: "it might have some effect."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 677–78. Names: Eisenhower, Ayub, Nehru, Black.'
    tags: [name:eisenhower-dwight-d, name:ayub-khan-mohammad, name:nehru-jawaharlal, name:black-eugene-r]
  - id: cal.1960-09-07.elections-1960-religion
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: elections-1960-religion
    also: [elections-1960-nixon]
    follows:
      - cal.1960-09-07.south-asia
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'Religion: he and Nixon agreed long ago never to raise or mention "the religious issue"; "I not only don''t believe in voicing prejudice, I want to assure you I feel none. And I am sure that Mr. Nixon feels exactly the same."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 678. [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 16 (Belair, question 2: "voicing prejudice—I want"). See [[cal.1960-09-05.elections-1960-religion]]. Names: Eisenhower, Nixon.'
    tags: [name:eisenhower-dwight-d, name:nixon-richard-m]
  - id: cal.1960-09-07.congo-2
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: congo
    also: [soviet-union]
    follows:
      - cal.1960-09-07.elections-1960-religion
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'The Congo, a statement he reads: the United States "deplores the unilateral action of the Soviet Union in supplying aircraft and other equipment for military purposes to the Congo, thereby aggravating an already serious situation which finds Africans killing other Africans"; he urges the Soviet Union "to desist from its unilateral activities" and to support "the practice of collective effort through the United Nations." He adds: the United States will support the United Nations in what it finds necessary "within the limits of the Charter."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 679–80. [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 5 (Kenworthy, question 3). See [[cal.1960-09-05.congo-2]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d, polity:ussr, polity:us]
  - id: cal.1960-09-07.elections-1960-3
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: elections-1960
    follows:
      - cal.1960-09-07.congo-2
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'His part in the campaign: after seven and a half years directing the executive department, "it would be odd if I simply became a sphinx."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 680. [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 16 (Belair, question 5). Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-09-07.intelligence-4
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: intelligence
    follows:
      - cal.1960-09-07.elections-1960-3
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'The NSA defectors: "we must be always on the alert, very alert"; "we must go through our entire procedures to see if there is any one way we could better it."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 683. [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 11 (Raymond, question 11). See [[cal.1960-09-06.intelligence]]. Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-09-07.congo-10
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: congo
    also: [soviet-union]
    follows:
      - cal.1960-09-07.intelligence-4
    part_of: cal.1960-09-07.press-and-broadcasting
    c: No evidence "as of now" that Soviet military crews fly the planes or that the cargoes carry weapons; ten planes inspected at Athens at the Soviet request carried cargo "for peaceful uses."
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 683–84 (the answer corrected on Hagerty''s word to "Russian military crews"). [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 5 (Kenworthy, question 12). Names: Eisenhower, Hagerty.'
    tags: [name:eisenhower-dwight-d, name:hagerty-james-c, polity:ussr]
  - id: cal.1960-09-07.congress
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: congress
    follows:
      - cal.1960-09-07.congo-10
    part_of: cal.1960-09-07.press-and-broadcasting
    c: 'The session''s failures, laid to him by the Democrats: "apparently this other—this other party then is making me responsible for splitting theirs"; the record should cause "some disappointment, if not dismay, throughout the American Nation."'
    n: '[1960–61 Pub. Papers 677](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=729), at 684–85. [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 16 (Belair, question 17: "throughout the nation"). Names: Eisenhower.'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-09-07.elections-1960-religion-2
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: elections-1960-religion
    c: Washington. The board of trustees of Protestants and Other Americans United for Separation of Church and State calls for "calm analysis and sober speech about the religious issue." It praises Kennedy for declaring Government financial aid to parochial schools unconstitutional and for opposing an ambassador to the Vatican; it is skeptical of his "equivocal" position on birth control and troubled about his stand on "the official boycott of public schools" in his church's canon law.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 25 (the board of trustees'' statement, "Earlier," as summarized at 1 and printed at 25 under "Protestant Groups'' Statements," "By the P.O.A.U."). See [[cal.1960-09-07.elections-1960]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, polity:vatican]
  - id: cal.1960-09-07.elections-1960-kennedy-4
    when: Sept. 7
    date: '1960-09-07'
    place: portland
    thread: elections-1960-kennedy
    c: 'Portland, Oreg., the Civic Auditorium. Kennedy''s speech, prepared for delivery: diplomatic policies that teeter "on the brink of war," no solid plans for disarmament, a philosophy of "swapping threats and insults with the Russians." He calls for rebuilt defenses, a revamp of education and research, and renewed leadership for peace.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 24 ("Kennedy Says U.S. Must Regain Lead in ''Fight for Peace''"). To check: Speech of Senator John F. Kennedy, Civic Auditorium, Portland, OR, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-civic-auditorium-portland-or) (Sept. 7, 1960). See [[cal.1960-09-06.elections-1960]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:or, city:portland, polity:ussr]
  - id: cal.1960-09-07.elections-1960-kennedy-5
    when: Sept. 7
    date: '1960-09-07'
    place: eugene
    thread: elections-1960-kennedy
    also: [school-aid]
    c: 'Eugene, Oreg., Courthouse Square. Kennedy, to a crowd of more than 5,000: emergency action on education, a massive construction program for public schools and colleges, Federal aid to raise teachers'' salaries, a scholarship program and more support of basic research; he rejects Federal control and Federal replacement of local effort.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 24 ("Kennedy Pledges ''Fight for Peace''"). To check: Remarks of Senator John F. Kennedy, Eugene, OR, Courthouse Square, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-eugene-or-courthouse-square) (Sept. 7, 1960). See [[cal.1960-09-06.elections-1960]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:or, city:eugene]
  - id: cal.1960-09-07.elections-1960-2
    when: Sept. 7
    date: '1960-09-07'
    place: chicago
    thread: elections-1960
    also: [democratic-party]
    c: Chicago, the Medinah Temple, the Illinois Democratic convention, a crowd of some 5,000. Stevenson says he is "proud to campaign now with all my heart and strength across the country" for Kennedy. His prepared speech assailed "regional-minded Democrats" as allies of Eisenhower and the Republican "old Guard wing"; he omitted the passage but said afterward that he stood by it. The price of a Republican President with a Congress "bound to be Democratic" is "a continual stalemate"; he finds it hard to follow the reasoning that a "new liberal Nixon is disengaging from the old conservative Eisenhower."
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Stevenson Assails Democrats Who Aided G.O.P. in Congress"). Names: Stevenson, Kennedy, Eisenhower, Nixon.'
    tags: [name:stevenson-adlai-e, name:kennedy-john-f, name:eisenhower-dwight-d, name:nixon-richard-m, state:il, city:chicago]
  - id: cal.1960-09-07.elections-1960-kennedy-6
    when: Sept. 7
    date: '1960-09-07'
    place: atlanta
    thread: elections-1960-kennedy
    also: [elections-1960-religion]
    c: 'Atlanta. Robert F. Kennedy, directing Kennedy''s campaign, at a news conference after arriving for a strategy meeting with southeastern Democrats: Kennedy faces an uphill struggle in six Southern States and Kentucky because of the religious issue; he names Virginia, the Carolinas, Florida, Tennessee and Texas as "problem" States but sees "a chance in every one of them." Kennedy''s Roman Catholic faith is "the major problem." Governors Almond of Virginia, Hodges of North Carolina and Vandiver of Georgia, the host, are present; Almond and Hodges agree that the issue could decide the election in their States. Gore attends as a consultant.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Kennedy Faces Southern Battle Over Religion, Brother Reports": the planning session to meet the next day at the Dinkler Plaza Hotel). Names: Robert Kennedy, Kennedy, Hodges, Vandiver, Gore.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f, name:hodges-luther-h, name:vandiver-s-ernest-jr, name:gore-albert-sr, state:ga, city:atlanta, state:va, state:nc, state:sc, state:fl, state:tn, state:tx, state:ky]
  - id: cal.1960-09-07.elections-1960-religion-3
    when: Sept. 7
    date: '1960-09-07'
    place: atlanta
    thread: elections-1960-religion
    c: 'Atlanta. Ben Fortson, Georgia''s Secretary of State, charges that Republicans are responsible for "floods of anti-Catholic literature" entering Georgia and other Southern States, a tactic to hurt Kennedy: "the same sort of campaign used by Hoover forces against Al Smith in 1928." He says officials of other Southern States have also seen an "influx" of it.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Georgian Scores G.O.P.," AP). Names: Kennedy.'
    tags: [name:kennedy-john-f, state:ga, city:atlanta]
  - id: cal.1960-09-07.labor
    when: Sept. 7
    date: '1960-09-07'
    place: st-louis
    thread: labor
    also: [elections-1960-nixon]
    c: 'St. Louis. Meany, to 1,500 delegates at the Machinists'' quadrennial convention: get out the vote for the Democratic party. Unless the Democratic approach is adopted, "every economic barometer shows there is a recession coming and it is coming this winter." The Republican party''s philosophy is reflected most accurately in the "conservative, anti-labor" views of Goldwater; he speaks several times of "the candidate of Mr. Goldwater," meaning Nixon, the *Times* says.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Meany Bids Labor Vote for Kennedy"). See [[cal.1960-09-05.labor]]. Names: Meany, Goldwater, Nixon, Kennedy.'
    tags: [name:meany-george, name:goldwater-barry-m, name:nixon-richard-m, name:kennedy-john-f, state:mo, city:st-louis]
  - id: cal.1960-09-07.labor-8
    when: Sept. 7
    date: '1960-09-07'
    place: st-louis
    thread: labor
    also: [elections-1960-nixon]
    c: St. Louis. Albert J. Hayes, president of the Machinists, announces to the convention, to scattered boos, that Nixon will address it on its closing day, Sept. 15, and Kennedy on Sept. 14.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Meany Bids Labor Vote for Kennedy"). See [[cal.1960-09-07.labor]]. Names: Nixon, Kennedy.'
    tags: [name:nixon-richard-m, name:kennedy-john-f, state:mo, city:st-louis]
  - id: cal.1960-09-07.labor-2
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: labor
    c: Washington. The U.S. Court of Appeals denies the Teamsters' motion to prevent District Judge F. Dickinson Letts from installing Terence McShane, a former FBI agent, as chairman of the union's board of monitors. It sends the matter back to Letts, who had agreed to reconsider filling the post in light of "considerable" new material. Hoffa's lawyers had sought to reverse the appointment; Godfrey P. Schmidt, attorney for insurgent teamsters, had nominated McShane.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Hoffa.'
    tags: [name:hoffa-james-r]
  - id: cal.1960-09-07.labor-3
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: labor
    also: [elections-1960-kennedy]
    c: 'Washington, the Court of Appeals hearing. Robert Silagi, an attorney for anti-Schmidt insurgents, presents affidavits from two New York teamsters of Local 808, Steve Milone and John McManus: they met Robert F. Kennedy, McShane and Walter Sheridan in Kennedy''s Park Avenue apartment on May 17, and Kennedy and McShane tried to browbeat them into withdrawing their support from the monitor Lawrence Smith and backing McShane as his replacement; Kennedy contended that Smith was accepting money from the Teamsters. Smith and Hoffa deny it.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). See [[cal.1960-09-07.labor-2]]. Names: Robert Kennedy, Sheridan, Hoffa.'
    tags: [name:kennedy-robert-f, name:sheridan-walter, name:hoffa-james-r, city:new-york]
  - id: cal.1960-09-07.labor-4
    when: Sept. 7
    date: '1960-09-07'
    thread: labor
    also: [elections-1960-kennedy]
    c: 'Robert F. Kennedy, by telephone, on the affidavits: "this is obviously an attempt by Mr. Hoffa to try to hurt Senator Kennedy."'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Robert Kennedy, Hoffa, Kennedy.'
    tags: [name:kennedy-robert-f, name:hoffa-james-r, name:kennedy-john-f]
  - id: cal.1960-09-07.labor-5
    when: Sept. 7
    date: '1960-09-07'
    thread: labor
    also: [elections-1960-kennedy]
    c: 'Hoffa, to reporters after the hearing: "to say the least, it was indiscreet to hold the [alleged] meeting in the Kennedy apartment, which is shared by Jack, Joe and Bobby boy, in an attempt to use the same Hitler Gestapo tactics Bobby used on the McClellan committee."'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Hoffa Is Balked on Ouster Move"). Names: Hoffa, Robert Kennedy, Kennedy.'
    tags: [name:hoffa-james-r, name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1960-09-07.labor-6
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: labor
    c: Washington. Hoffa says the executive board approved the appointment of Anthony Provenzano, president of the New Jersey Joint Council and head of Hoboken's Local 560, as thirteenth international vice president, to fill the vacancy left by John Conlin's death; Provenzano takes the oath. At the Senate hearings he was charged with accepting payments from employers with Teamsters contracts in exchange for guaranteed labor peace.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Teamsters Name Aide," AP). Names: Hoffa.'
    tags: [name:hoffa-james-r, state:nj]
  - id: cal.1960-09-07.labor-7
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: labor
    c: Washington. Labor Department investigators interrupt a meeting of the Teamsters' international executive board to serve a subpoena for the financial records of the union's St. Louis Joint Council No. 13. Hoffa, relating it to reporters, accuses the Department and Secretary Mitchell of persecuting the teamsters; the subpoena, he says, is an effort to get evidence for the Justice Department's prosecution of Harold J. Gibbons, administrative vice president and his chief aide, indicted for using St. Louis teamsters' funds for political purposes.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Writ for Teamsters," AP: the incident as Hoffa related it). Names: Hoffa, Mitchell, Gibbons.'
    tags: [name:hoffa-james-r, name:mitchell-james-p, state:mo, name:gibbons-harold-j]
  - id: cal.1960-09-07.congo-3
    when: Sept. 7
    date: '1960-09-07'
    place: leopoldville
    thread: congo
    c: Léopoldville. The lower house votes 60 to 19 to "invalidate" both Kasavubu's dismissal of Lumumba and Lumumba's of Kasavubu; the motion declares the statements of both "null and nonexistent." Ninety-one of the 137 members are present at the beginning of the debate; most of the Opposition stay away. Lumumba, after a two-hour address attacking the UN, "imperialists" and "plotters" around Kasavubu, asks only that the chamber appoint a commission to study the situation, and joins the majority. In a speech to the house he denies he is a Communist.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 2 ("Leopoldville''s Parliament Rejects Ousters"; Lumumba''s denial from "Kasavubu Soldiers Arrive," AP). See [[cal.1960-09-05.congo]]. Names: Lumumba, Kasavubu.'
    tags: [name:lumumba-patrice, name:kasavubu-joseph]
  - id: cal.1960-09-07.congo-4
    when: Sept. 7
    date: '1960-09-07'
    place: leopoldville
    thread: congo
    c: Léopoldville. The Senate rejects the Government's invitation to meet the lower house in joint session. Under the "fundamental law" only a joint session can endorse the dismissal of the Premier. It is to meet again the next day.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 2 ("Leopoldville''s Parliament Rejects Ousters"). See [[cal.1960-09-05.congo]].'
  - id: cal.1960-09-07.congo-5
    when: Sept. 7
    date: '1960-09-07'
    place: leopoldville
    thread: congo
    c: Léopoldville, the lower house. Albert Delvaux, a minister in Lumumba's Cabinet, comes in and takes a seat away from the Government benches; asked by the Speaker why, he answers, "because I'm under arrest." He says the Army arrested him that morning and took him to a military camp because he countersigned Kasavubu's decree relieving Lumumba; he does not say how he escaped.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 2 ("Deputies Reject Congo Dismissals"). See [[cal.1960-09-07.congo-3]]. Names: Lumumba, Kasavubu.'
    tags: [name:lumumba-patrice, name:kasavubu-joseph]
  - id: cal.1960-09-07.congo-9
    when: Sept. 7
    date: '1960-09-07'
    place: leopoldville
    thread: congo
    c: Léopoldville. Military policemen call at the hotel of Justin Bomboko, the Foreign Minister, who countersigned Kasavubu's decree, a few moments before he returns that morning. He leaves his limousine and drives off in a private car; he is reported that night at Kasavubu's residence, guarded by United Nations forces.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 2 ("Deputies Reject Congo Dismissals"). See [[cal.1960-09-07.congo-5]]. Names: Kasavubu.'
    tags: [name:kasavubu-joseph]
  - id: cal.1960-09-07.congo-6
    when: Sept. 7
    date: '1960-09-07'
    place: elisabethville
    thread: congo
    c: 'Elisabethville. A plane from Brussels lands nine tons of ammunition, the fourth shipment to arrive recently. Belgian sources: it was in the "supply pipeline" before the Congo''s independence, destined for the Public Force.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Belgium Airlifts Arms to Katanga"). See [[cal.1960-09-05.congo]].'
    tags: [polity:belgium]
  - id: cal.1960-09-07.congo-7
    when: Sept. 7
    date: '1960-09-07'
    place: elisabethville
    thread: congo
    c: 'Elisabethville. Tshombe sends messages to important African leaders charging that Lumumba''s troops have killed hundreds of people in the Kasai city of Bakwanga: "genocide."'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Belgium Airlifts Arms to Katanga"). See [[cal.1960-09-05.congo]]. Names: Tshombe, Lumumba.'
    tags: [name:tshombe-moise, name:lumumba-patrice]
  - id: cal.1960-09-07.congo-8
    when: Sept. 7
    date: '1960-09-07'
    place: accra
    thread: congo
    also: [africa]
    c: Accra. Nkrumah, in a broadcast to the nation, urges independent African States to help the Security Council prevent the great powers from intervening in the Congo; there is a "real danger that the Congo will not be allowed to settle its own affairs." He says nothing of Lumumba's request for immediate military assistance.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Ghana Bids Africans Help U.N. in Congo"). See [[cal.1960-09-05.congo]]. Names: Nkrumah, Lumumba.'
    tags: [name:nkrumah-kwame, name:lumumba-patrice, polity:ghana]
  - id: cal.1960-09-07.latin-america
    when: Sept. 7
    date: '1960-09-07'
    place: bogota
    thread: latin-america
    also: [cuba]
    c: 'Bogotá, the second plenary session of the inter-American economic conference. Cuba''s Economy Minister, Regino Boti, in a fifty-minute speech, denounces Eisenhower''s $500,000,000 social-improvement plan as an instrument "to silence the militant hope awakened in the people of Latin America by the Cuban revolution." He calls for "forced loans" from U.S. companies, says Cuba will rule out direct private investment, attacks the IMF and the World Bank, and announces a "black book" on seized U.S. companies. Against Dillon''s statement of the day before on the fall in U.S. investment: the reason is "the permanent lack of interest by the United States in the economic development of Latin America." A U.S. delegation spokesman says there will be no official reply.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 14 ("Cuba Scores U.S. on Latin Aid Plan," by Juan de Onís). See [[cal.1960-09-06.latin-america-2]]. Names: Eisenhower, Dillon.'
    tags: [name:eisenhower-dwight-d, name:dillon-c-douglas, polity:cuba, polity:us]
  - id: cal.1960-09-07.berlin-and-vienna
    when: Sept. 7
    date: '1960-09-07'
    place: vienna
    thread: berlin-and-vienna
    also: [soviet-union-un]
    c: 'Vienna. As the *Times* reports it: a source "who in the past has been knowledgeable about Soviet foreign policy" says the Soviet Government plans drastic measures in Germany if the West rejects Khrushchev''s disarmament proposals at the UN: a total blockade of Berlin, and a separate peace treaty with East Germany.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Soviet U.N. Plan Linked to Berlin," by M. S. Handler, Vienna, Sept. 7: the source''s statements, as the *Times* reports them; the motive "could not be determined"). Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s, polity:ussr, polity:gdr]
  - id: cal.1960-09-07.latin-america-2
    when: Sept. 7
    date: '1960-09-07'
    place: miami
    thread: latin-america
    c: 'Miami. Counsel for Marcos Pérez Jiménez, Venezuela''s ousted dictator, asks Judge William C. Mathes, U.S. District Court, to dismiss the extradition proceedings: all his acts in office were in performance of his duties as head of the Government. The Venezuelan Government, which charges embezzlement and murder, opposes; argument is to continue the next day. His chief counsel, David W. Walters, predicts a trial of at least three months, with 200 witnesses, if the charges are not thrown out.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html) ("Venezuelan Asks Dismissal of Case"). Names: Pérez Jiménez.'
    tags: [state:fl, city:miami, name:perez-jimenez-marcos]
  - id: cal.1960-09-07.intelligence
    when: Sept. 7
    date: '1960-09-07'
    thread: intelligence
    also: [congress]
    c: Vinson, chairman of the House Armed Services Committee, orders a "complete investigation" of the intelligence agencies after the NSA defections, emphasizing the methods of recruiting, screening and clearing personnel. A special subcommittee, Kilday chairman, with Hardy and Arends, has gathered considerable preliminary data.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 11 ("President Urges Security Review," by Jack Raymond). See [[cal.1960-09-06.antisubversion]]. Names: Vinson, Hardy, Arends. Check: the day: the *Times* of Sept. 8 gives no day for the order.'
    tags: [name:vinson-carl, name:hardy-porter-jr, name:arends-leslie-c]
  - id: cal.1960-09-07.antisubversion
    when: Sept. 7
    date: '1960-09-07'
    thread: antisubversion
    also: [intelligence]
    c: The House Un-American Activities Committee delivers a subpoena to Maurice H. Klein, personnel chief of the National Security Agency, for a closed hearing Sept. 16 in its previously announced investigation of the NSA defections.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"; the committee "finally succeeded in delivering" the subpoena). See [[cal.1960-09-06.antisubversion]]. Check: the day: the *Times* of Sept. 8 gives no day for the delivery.'
  - id: cal.1960-09-07.antisubversion-2
    when: Sept. 7
    date: '1960-09-07'
    thread: antisubversion
    also: [intelligence]
    c: Walter, chairman of the House Un-American Activities Committee, complains that the President is refusing to cooperate in one phase of its investigations. He says he asked on Jan. 15 that agencies make available the names of persons who regained Government employment after being dropped as security risks, perhaps up to 1,000; the President replied Feb. 19 and Apr. 19, citing the separation of powers, that it would not be in the national interest for the executive to make the names available to the legislative body.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"). See [[cal.1960-09-06.antisubversion]]. Names: Walter. Check: the day: the *Times* of Sept. 8 gives no day for the complaint.'
    tags: [name:walter-francis-e, name:eisenhower-dwight-d]
  - id: cal.1960-09-07.intelligence-2
    when: Sept. 7
    date: '1960-09-07'
    thread: intelligence
    c: A Defense Department spokesman says a security review affecting the Department is already under way, not limited to Bernon F. Mitchell and William H. Martin, the former NSA employees who denounced the United States at Moscow the day before. Responding to published reports that the FBI had such information about one of them, he says nothing in the personal records of either indicates homosexuality or any form of sexual perversion.
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 11 ("President Urges Security Review"). [[w.huac-security-practices-nsa]], 3 (the department''s denial of Sept. 7, "in the face of reports to the contrary," that the records of either man "indicated homosexuality or other sex abnormality"; not the spokesman, the FBI or the security review). See [[cal.1960-09-06.intelligence-2]].'
    src:
      c: d4ce54bc
      rows:
        - 'https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html: all'
        - 'w.huac-security-practices-nsa 3: ?'
  - id: cal.1960-09-07.intelligence-3
    when: Sept. 7
    date: '1960-09-07'
    place: flushing-oh
    thread: intelligence
    also: [congress]
    c: 'Wayne L. Hays, Democrat of Ohio, by telephone at Flushing, Ohio, says he may have been the member of Congress to whom Mitchell and Martin came last spring: two young men who said the United States was sending spy planes over Russia and identified themselves as Central Intelligence Agency men, as he remembered. Their pictures and names do not stir his recollection; he says he reported it to the Foreign Affairs Committee.'
    n: '[*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 11 ("President Urges Security Review"). Check: the date: the Moscow statement has the two see a Congressman in February 1959, one who had publicly questioned the State Department''s concealing the facts of the C-130 ([[w.martin-moscow-press-conference]], 5); Hays says "last spring.". See [[cal.1960-09-06.soviet-union]]. Names: Hays.'
    tags: [name:hays-wayne-l, state:oh]
  - id: cal.1960-09-07.antisubversion-3
    when: Sept. 7
    date: '1960-09-07'
    place: washington
    thread: antisubversion
    c: 'The House Un-American Activities Committee authorizes a formal investigation and hearings on the National Security Agency, the day after the Moscow press conference. Its stated purposes: tighter security laws on unauthorized disclosure of defense information and on loss of nationality; the law on suspending civilian employees in the interest of national security; procedures for investigative clearance before Government employment, to keep out subversives and security risks; legislative oversight.'
    n: '[[w.huac-security-practices-nsa]], 1, 3 (the authorization of Sept. 7; the four purposes, with H.R. 2232, referred to the committee Jan. 12, 1959; Sec. 349 of the Immigration and Nationality Act; H.R. 1989, introduced by the chairman Jan. 9, 1959; the Act of Aug. 26, 1950). [[w.durant-congress-and-countersubversion-in]], 77 (the committee launches the investigation Sept. 7; 13 months, 2,000 hours of staff work, 16 executive-session hearings, 34 witnesses). See [[cal.1960-09-06.antisubversion]], [[cal.1960-09-07.antisubversion]]. Check: who ordered the inquiry: [[w.nsa-60-years-of-defending]], 30, has "President Eisenhower" order an investigation of the incident, a "13-month study"; the report and Durant have the committee''s own inquiry, 13 months.'
  - id: cal.1960-09-07.china-leadership
