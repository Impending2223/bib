  - id: cal.1960-09-13.governors-nh
    when: Sept. 13
    date: '1960-09-13'
    thread: governors
    also: [elections-1960]
    c: New Hampshire's Republican primary for governor. Powell, the governor, over Gregg, governor 1953–55, 49,119 to 48,108, 49.9 percent, a 1,011-vote margin. Boutin the Democrat.
    n: '[N.H. *Manual for the General Court*, no. 37 (1961), p. 436](https://archive.org/details/manualforgeneral37newh/page/n471). [Wikipedia, "1960 New Hampshire gubernatorial election"](https://en.wikipedia.org/wiki/1960_New_Hampshire_gubernatorial_election). To check: [[w.peirce-new-england-states]]. Names: Powell, Gregg, Boutin.'
