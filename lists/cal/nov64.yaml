# Cal. LIV November 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LIV
entries:
  - id: cal.1964-11-01.vietnam
    when: Nov. 1
    date: '1964-11-01'
    thread: vietnam
    c: 'Biên Hòa. The Viet Cong mortar the air base after midnight: 4 Americans killed, 30 wounded, 27 aircraft destroyed or damaged. Taylor asks a reprisal against an airfield in the North within 48 hours. Washington declines, Nov. 1–2, two days before the election; planning for wider action ordered.'
    n: 'FRUS 1964–68, I, docs. [393](https://history.state.gov/historicaldocuments/frus1964-68v01/d393), [396](https://history.state.gov/historicaldocuments/frus1964-68v01/d396), [399](https://history.state.gov/historicaldocuments/frus1964-68v01/d399), [400](https://history.state.gov/historicaldocuments/frus1964-68v01/d400). *The Pentagon Papers* (K–J Adm. II.H.3). Logevall, *Choosing War*; Kahin, *Intervention*; Gibbons, *The U.S. Government and the Vietnam War* (K–J Adm. II.D). Berman, *Planning a Tragedy*; VanDeMark, *Into the Quagmire*; McMaster, *Dereliction of Duty*; Preston, *The War Council*; Goldstein, *Lessons in Disaster* (Viet. II.C.3). Kaiser, *American Tragedy* (Viet. II.B.8). Moyar, *Triumph Forsaken* (Viet. II.B.7). Taylor, *Swords and Plowshares*; Bird, *The Color of Truth* (Viet. II.H.1). See [[cal.1964-08-02.vietnam]]. Names: Taylor (Viet. III.A).'
    tags: [name:taylor-maxwell]
  - id: cal.1964-11-02.opinion
    when: Nov. 2
    date: '1964-11-02'
    thread: opinion
    also: [elections-1964, goldwater]
    c: 'Gallup, final poll, Oct. 25–30: Johnson 64, Goldwater 29, undecided 7.'
    n: '*The Gallup Poll*, III, 1907 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D); Goldwater (Opp. III.B).'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1964-11-03.vietnam
    when: Nov. 3
    date: '1964-11-03'
    thread: vietnam
    c: 'William Bundy''s working group on Vietnam first meets: McNaughton, Mustin of the Joint Staff, the CIA. Three options: A, present lines; B, systematic military pressure on the North until American objectives are met; C, graduated pressure, then negotiation under threat of more. Its paper, Nov. 21; the principals take it up Nov. 24 and 27, Taylor back from Saigon for the second.'
    n: 'FRUS 1964–68, I, docs. [403](https://history.state.gov/historicaldocuments/frus1964-68v01/d403), [418](https://history.state.gov/historicaldocuments/frus1964-68v01/d418), [424](https://history.state.gov/historicaldocuments/frus1964-68v01/d424), [428](https://history.state.gov/historicaldocuments/frus1964-68v01/d428), [429](https://history.state.gov/historicaldocuments/frus1964-68v01/d429). See [[cal.1964-11-01.vietnam]]. Names: William Bundy, McNaughton, Taylor (Viet. III.A).'
    tags: [name:bundy-william, name:mcnaughton-john-t, name:mustin-lloyd-m, name:taylor-maxwell]
  - id: cal.1964-11-03.elections-1964
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [goldwater]
    c: 'Election day. Johnson and Humphrey over Goldwater and Miller, 61.1 percent to 38.5; 486 electoral votes to 52. Goldwater carries Arizona and five States of the Deep South: Alabama, Georgia, Louisiana, Mississippi, South Carolina. The 89th Congress: House 295 D–140 R; Senate 68 D–32 R.'
    n: '[Radio and Television Remarks to the American People at the Close of Election Day](https://www.presidency.ucsb.edu/documents/radio-and-television-remarks-the-american-people-the-close-election-day) (Nov. 4, 1964). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). White, *The Making of the President 1964*; Cosman, *Five States for Goldwater*; Lamb & Smith, *Campaign Decision-Making* (Opp. II.E). *The National Election of 1964*; Mann, *Daisy Petals and Mushroom Clouds* (K–J Cong. II.E). Kessel, *The Goldwater Coalition*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). Novak, *The Agony of the G.O.P. 1964*; Kabaservice, *Rule and Ruin* (Opp. II.A). See [[cal.1964-07-15.elections-1964]]; [[cal.1964-08-26.elections-1964]]. Names: Johnson, Humphrey (K–J Adm. III.D); Goldwater (Opp. III.B); Miller (Opp. III.E).'
    tags: [election:1964, name:johnson-lyndon-b, name:humphrey-hubert-h, name:goldwater-barry-m, name:miller-william-e]
  - id: cal.1964-11-03.elections-1964-2
    when: Nov. 3
    date: '1964-11-03'
    thread: elections-1964
    also: [states-and-cities, robert-kennedy]
    c: 'The Senate. Democrats take Republican seats in New York, Robert Kennedy over Keating; Maryland, Tydings over Beall; New Mexico, Montoya over Mechem. Murphy takes Salinger''s seat in California. Cannon holds Nevada over Laxalt by 48 votes; Yarborough Texas over Bush. Governors: Republicans gain Massachusetts (Volpe), Washington (Evans), Wisconsin, and lose Arizona and Utah; Romney re-elected; Kerner over Percy; Faubus over Winthrop Rockefeller.'
    n: 'The Senate: [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). See [[cal.1964-11-03.elections-1964]]. The governors: check against the States'' canvasses. White, *The Making of the President 1964* (Opp. II.E). Names: Robert Kennedy (K–J Adm. III.A); Keating, Murphy, Percy (Opp. III.B); Montoya (Wg. III.F); Salinger (K–J Adm. III.B); Laxalt, Volpe, Evans, Romney, Winthrop Rockefeller (Opp. III.H); Yarborough (K–J Cong. III.B); Bush (Opp. III.D); Kerner, Faubus (K–J Cong. III.F).'
    tags: [name:kennedy-robert-f, name:keating-kenneth-b, name:tydings-joseph-d, name:beall-james-g, name:montoya-joseph-m, name:mechem-edwin-l, name:murphy-george, name:salinger-pierre, name:cannon-howard-w, name:laxalt-paul, name:yarborough-ralph, name:bush-george-h-w, name:volpe-john-a, name:evans-daniel-j, name:romney-george-w, name:kerner-otto, name:percy-charles-h, name:faubus-orval-e, name:rockefeller-winthrop]
  - id: cal.1964-11-03.cities-and-housing
    when: Nov. 3
    date: '1964-11-03'
    thread: cities-and-housing
    also: [states-and-cities]
    c: 'California. Proposition 14 carries, 4,526,460 to 2,395,747, 65.4 percent: a constitutional amendment securing an owner''s "absolute discretion" to sell or rent to whom he chooses, voiding the Rumford Fair Housing Act of 1963.'
    n: '[Cal. *Statement of Vote*, Nov. 3, 1964](https://archive.org/details/castatem196264cali). HoSang, *Racial Propositions* (K–J Cong. II.H).'
  - id: cal.1964-11-03.specials
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    c: Missouri 9th, special. Hungate (D) holds Clarence Cannon's seat, 62.5 to 37.5 over Schroeder (R); the same day, the full term. Swing 2.0 to D.
    n: 'Votes: CQ Guide 6th (2010) 1274. See [[cal.1961-04-04.states-and-cities]]. Names: Cannon (K–J Cong. III.D); Schroeder (K–J Cong. III.K).'
    tags: [special:1964-11-03-h-MO-9, name:hungate-william-l, name:cannon-clarence, name:schroeder-anthony-c]
  - id: cal.1964-11-03.specials-2
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    c: Oregon 1st, special. Wyatt (R) holds Norblad's seat, 52.8 to 47.2 over Whipple (D); the same day, the full term. Swing 9.0 to D.
    n: 'Votes: CQ Guide 6th (2010) 1275. See [[cal.1961-04-04.states-and-cities]]. Names: Whipple (K–J Cong. III.K).'
    tags: [special:1964-11-03-h-OR-1, name:wyatt-wendell, name:norblad-albin-w-jr, name:whipple-r-blaine]
  - id: cal.1964-11-03.specials-3
    when: Nov. 3
    date: '1964-11-03'
    thread: specials
    c: South Carolina 5th, special. Gettys (D) holds the seat Hemphill left for the federal bench, 66.8 to 33.2 over Doster (R); the same day, the full term. Swing 27.2 to R.
    n: 'Votes: CQ Guide 6th (2010) 1275. See [[cal.1961-04-04.states-and-cities]]. Names: Doster (K–J Cong. III.K).'
    tags: [special:1964-11-03-h-SC-5, name:gettys-thomas-s, name:hemphill-robert-w, name:doster-robert-m]
  - id: cal.1964-11-03.robert-kennedy
    when: Nov. 3
    date: '1964-11-03'
    thread: robert-kennedy
    also: [elections-1964]
    c: 'Robert Kennedy elected Senator from New York, 3,823,749 to Keating''s 3,104,056, 53.5 percent. Johnson and Kennedy by telephone, 11:55 p.m.: Kennedy thanks him for his help; Johnson: nothing will divide them.'
    n: '[Johnson and Robert Kennedy, 11:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-november-4-1964), Conversation WH6411-02-6142 (Miller Center). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-08-25.elections-1964]]; [[cal.1964-11-03.elections-1964-2]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Keating (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:keating-kenneth-b]
  - id: cal.1964-11-04.elections-1964
    when: Nov. 4
    date: '1964-11-04'
    thread: elections-1964
    also: [goldwater]
    c: 'Goldwater concedes at Scottsdale, by telegram and before the press: the Republicans "the party of opposition when opposition is called for." More than 25 million voted for "a Republican philosophy"; his defeat in part the work of Republicans who would not work for the top of the ticket.'
    n: '[News Conference Conceding the Presidential Election in Scottsdale, Arizona](https://www.presidency.ucsb.edu/documents/news-conference-conceding-the-presidential-election-scottsdale-arizona) (Nov. 4, 1964). Goldwater, *With No Apologies* (Opp. II.G.1). See [[cal.1964-11-03.elections-1964]]. Names: Goldwater (Opp. III.B).'
    tags: [name:goldwater-barry-m]
  - id: cal.1964-11-06.civil-rights-organizations
    when: Nov. 6–12
    date: '1964-11-06'
    thread: civil-rights-organizations
    c: 'Waveland, Mississippi. SNCC''s staff retreat after Atlantic City: some forty position papers on its program and structure. A strong executive in Atlanta or authority in the field projects: not settled. Forman proposes that the staff be the coordinating committee. Paper 24, unsigned, on women in SNCC. Check the dates.'
    n: 'SNCC Digital Gateway, [SNCC''s Waveland Conference](https://snccdigital.org/events/snccs-waveland-conference/) (K–J Cong. II.L). Carson, *In Struggle* (K–J Cong. II.F). Forman, *The Making of Black Revolutionaries*; Ransby, *Ella Baker and the Black Freedom Movement* (K–J Cong. II.I.4). Mary King, *Freedom Song: A Personal Story of the 1960s Civil Rights Movement* (William Morrow, 1987). Wesley C. Hogan, *Many Minds, One Heart: SNCC''s Dream for a New America* (University of North Carolina Press, 2007). See [[cal.1964-08-25.mississippi]]. Names: Forman (K–J Cong. III.H).'
    tags: [name:forman-james]
  - id: cal.1964-11-11.opinion
    when: Nov. 11
    date: '1964-11-11'
    thread: opinion
    c: 'Gallup, Oct. 16–21: with one party for liberals and one for conservatives, liberal 37 percent, conservative 34, undecided 29. The undecided asked to choose: liberal 51, conservative 49.'
    n: '*The Gallup Poll*, III, 1907 (K–J Cong. II.E).'
  - id: cal.1964-11-13.opinion
    when: Nov. 13
    date: '1964-11-13'
    thread: opinion
    also: [civil-rights-bill]
    c: 'Gallup, Oct. 8–13: the Civil Rights Act enforced strictly from the beginning, 23 percent; a gradual, persuasive approach at first, 62; depends on the circumstances, 9.'
    n: '*The Gallup Poll*, III, 1908 (K–J Cong. II.E).'
  - id: cal.1964-11-16.transition-and-staff
    when: Nov. 16
    date: '1964-11-16'
    thread: transition-and-staff
    also: [economy]
    c: Heller leaves the Council of Economic Advisers. Ackley sworn in as chairman, Okun as a member.
    n: '[Remarks at the Swearing In of Gardner Ackley as Chairman and Arthur Okun as Member of the Council of Economic Advisers](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-gardner-ackley-chairman-and-arthur-okun-member-the-council-economic) (Nov. 16, 1964). Flash, *Economic Advice and Presidential Leadership*; *The President and the Council of Economic Advisers* (K–J Adm. II.B). Names: Heller, Ackley, Okun (K–J Adm. III.H).'
    tags: [name:johnson-lyndon-b, name:heller-walter-w, name:ackley-gardner, name:okun-arthur-m]
  - id: cal.1964-11-18.civil-rights-the-executive
    when: Nov. 18
    date: '1964-11-18'
    thread: king
    also: [civil-rights-the-executive]
    c: Hoover, to a group of women reporters, calls King "the most notorious liar in the country." Nov. 21, the FBI mails King an anonymous letter with a tape. Dec. 1, King, Abernathy, and Andrew Young see Hoover at the Bureau.
    n: 'S. Rep. No. 94-755 (K–J Adm. II.H.3), Book III. Garrow, *The FBI and Martin Luther King, Jr.*; Branch, *Pillar of Fire* (K–J Adm. II.C). Gage, *G-Man* (K–J Adm. II.E). Garrow, *Bearing the Cross* (K–J Cong. II.F). DeLoach, *Hoover''s FBI* (K–J Adm. II.G.6). See [[cal.1963-10-10.king]]. Names: Hoover (K–J Adm. III.I); King, Abernathy (K–J Cong. III.H).'
    tags: [name:hoover-j-edgar, name:king-martin-luther-jr, name:abernathy-ralph-david, name:young-andrew-j-jr]
  - id: cal.1964-11-18.opinion
    when: Nov. 18
    date: '1964-11-18'
    thread: opinion
    also: [vietnam, medicare]
    c: 'Gallup, Nov. 6–11: the problem Johnson should deal with now that he has won, in order of mention: the international situation, Vietnam specifically; medical care for the aged; civil rights; farm problems; unemployment.'
    n: '*The Gallup Poll*, III, 1908 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-11-23.assassination
    when: Nov. 23
    date: '1964-11-23'
    thread: assassination
    c: 'The Warren Commission''s hearings and exhibits published, 26 volumes: the testimony of some 550 witnesses.'
    n: '*Hearings Before the President''s Commission on the Assassination of President Kennedy* (1964) ([govinfo](https://www.govinfo.gov/app/collection/gpo-warrencommissionhearings)). See [[cal.1963-11-29.assassination]]; [[cal.1964-09-24.assassination]].'
  - id: cal.1964-11-23.economy
    when: Nov. 23–25
    date: '1964-11-23'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Sterling crisis: the Bank of England''s rate from 5 to 7 percent. The same day the Board (Martin) approves the discount rate from 3½ to 4 percent at five Reserve Banks, New York among them, effective Nov. 24, the rest by Nov. 30; Regulation Q ceilings to 4 percent on savings deposits, 4½ on time deposits of 90 days or more, 4 under. Nov. 25, $3 billion in credits for sterling from eleven countries and the BIS; the Federal Reserve''s swap line with the Bank of England up $250 million, to $750 million.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697328) (Nov. 23, 1964); [Federal Reserve and Treasury statement](https://fraser.stlouisfed.org/title/9237/item/697331) (Nov. 25, 1964). [*Federal Reserve Bulletin*, Dec. 1964](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1964-21360), pp. 1530–31. Federal Open Market Committee, minutes, [Nov. 24, 1964](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19641124.pdf). FRUS 1964–68, XII, docs. [233](https://history.state.gov/historicaldocuments/frus1964-68v12/d233), [234](https://history.state.gov/historicaldocuments/frus1964-68v12/d234) (Wilson and Johnson, Nov. 19). Meltzer, *A History of the Federal Reserve*; Bremner, *Chairman of the Fed*; Coombs, *The Arena of International Finance*; Solomon, *The International Monetary System, 1945–1976* (K–J Adm. II.B). Wilson, *The Labour Government, 1964–1970* (K–J Adm. II.G.7). See [[cal.1963-07-16.economy]]; [[cal.1964-10-15.europe-and-the-alliance]]. Names: Martin (K–J Adm. III.H).'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1964-11-24.congo
    when: Nov. 24
    date: '1964-11-24'
    thread: congo
    c: Stanleyville. Belgian paratroopers, flown in American C-130s, drop on the airfield at dawn. The Simba rebels fire on their hostages in the street; Carlson, an American medical missionary, among the dead. Nov. 26, a second drop at Paulis.
    n: 'FRUS 1964–68, XXIII, docs. [354](https://history.state.gov/historicaldocuments/frus1964-68v23/d354), [365](https://history.state.gov/historicaldocuments/frus1964-68v23/d365). Weissman, *American Foreign Policy in the Congo*; Namikas, *Battleground Africa* (K–J Adm. II.D). Thomas P. Odom, *Dragon Operations: Hostage Rescues in the Congo, 1964–1965* (1988). See [[cal.1963-01-14.congo]]. Names: Carlson (K–J Cong. III.K).'
    tags: [name:carlson-paul-e]
  - id: cal.1964-11-29.opinion
    when: Nov. 29
    date: '1964-11-29'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Nov. 6–11: the United States handling South Vietnam as well as could be expected, 35 percent; badly, 50. Republicans 67 badly; Democrats 49 as well as could be expected. What next: either get out or fight, 15; tougher, 10; military action 9; get out 9; sit down and talk 3.'
    n: '*The Gallup Poll*, III, 1909 (K–J Cong. II.E).'
