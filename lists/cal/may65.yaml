# Cal. LX May 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LX
entries:
  - id: cal.1965-05-02.latin-america
    when: May 2
    date: '1965-05-02'
    thread: latin-america
    c: Report to the nation on the Dominican Republic, after meeting the congressional leaders. The revolt "taken over" by "a band of Communist conspirators." "The American nations cannot, must not, and will not permit the establishment of another Communist government in the Western Hemisphere." Two battalions, 2,000 men, ordered that morning; 4,500 more that evening.
    n: '[Radio and Television Report to the American People on the Situation in the Dominican Republic](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-situation-the-dominican-republic) (May 2, 1965); [Statement by the President Upon Sending Additional Forces to the Dominican Republic](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-sending-additional-forces-the-dominican-republic) (May 1, 1965). FRUS 1964–68, XXXII, docs. [51](https://history.state.gov/historicaldocuments/frus1964-68v32/d51), [52](https://history.state.gov/historicaldocuments/frus1964-68v32/d52). See [[cal.1965-04-28.latin-america]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-03.court
    when: May 3
    date: '1965-05-03'
    thread: court
    also: [cuba]
    c: '*Zemel v. Rusk*, [381 U.S. 1](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381001/usrep381001.pdf): the Secretary of State may refuse to validate passports for travel to Cuba under the Passport Act of 1926. Warren for the Court, 6–3; Black, Douglas, and Goldberg dissenting.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-12-14.court]]. Names: Warren, Black, Douglas, Goldberg (K–J Cong. III.G).'
    tags: [name:warren-earl, name:black-hugo-l, name:douglas-william-o, name:goldberg-arthur-j]
  - id: cal.1965-05-04.vietnam
    when: May 4–7
    date: '1965-05-04'
    thread: vietnam
    also: [defense]
    c: '$700 million for Vietnam asked, May 4: "This is not a routine appropriation." An "overwhelming vote" asked as "proof of national unity." House, May 5, [408–7](https://voteview.com/rollcall/RH0890047); Senate, May 6, [88–3](https://voteview.com/rollcall/RS0890050), Gruening, Morse, and Nelson against. Signed May 7, [79 Stat. 109](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg109-2.pdf): "We will not be defeated. We will not grow tired."'
    n: '[Special Message to the Congress Requesting Additional Appropriations for Military Needs in Viet-Nam](https://www.presidency.ucsb.edu/documents/special-message-the-congress-requesting-additional-appropriations-for-military-needs-viet) (May 4, 1965); [Remarks to Committee Members on the Need for Additional Appropriations for Military Purposes in Viet-Nam and the Dominican Republic](https://www.presidency.ucsb.edu/documents/remarks-committee-members-the-need-for-additional-appropriations-for-military-purposes) (May 4, 1965); [Remarks Upon Signing Resolution Appropriating Funds for Military Requirements in Viet-Nam](https://www.presidency.ucsb.edu/documents/remarks-upon-signing-resolution-appropriating-funds-for-military-requirements-viet-nam) (May 7, 1965). [111 Cong. Rec., House, May 5, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-2.pdf); [111 Cong. Rec., Senate, May 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf) (the Record: 88–3; Voteview counts Gruening, announced, a yea). Gibbons, *The U.S. Government and the Vietnam War* (K–J Adm. II.D). Mann, *A Grand Delusion* (K–J Cong. II.D). See [[cal.1965-03-08.vietnam]]. Names: Gruening, Morse (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:gruening-ernest, name:morse-wayne, name:nelson-gaylord-a]
  - id: cal.1965-05-05.vietnam
    when: May 5–7
    date: '1965-05-05'
    thread: vietnam
    c: The 173d Airborne Brigade, from Okinawa, the first Army ground combat unit in Vietnam, flown in to Biên Hòa. May 7, Marines land at Chu Lai to build an airfield. Check the dates.
    n: 'FRUS 1964–68, II, docs. [280](https://history.state.gov/historicaldocuments/frus1964-68v02/d280) (the deployments ordered, Apr. 30), [284](https://history.state.gov/historicaldocuments/frus1964-68v02/d284), [290](https://history.state.gov/historicaldocuments/frus1964-68v02/d290). Carland, *Combat Operations: Stemming the Tide* (Viet. II.I.3). See [[cal.1965-03-08.vietnam]].'
  - id: cal.1965-05-06.latin-america
    when: May 6
    date: '1965-05-06'
    thread: latin-america
    c: 'OAS foreign ministers, after midnight, vote the inter-American force the United States asked: 14–5, Chile, Ecuador, Mexico, Peru, and Uruguay against, Venezuela abstaining. Two-thirds needed. The Act of Santo Domingo, the cease-fire, signed May 5. May 7, Imbert''s Government of National Reconstruction formed against Caamaño''s "Constitutional Government."'
    n: '[FRUS 1964–68, XXXII, doc. 58](https://history.state.gov/historicaldocuments/frus1964-68v32/d58) (its note prints 15–5; a CIA situation report, 14–5: check), [doc. 59](https://history.state.gov/historicaldocuments/frus1964-68v32/d59). See [[cal.1965-04-28.latin-america]].'
    tags: [name:imbert-barrera-antonio, name:caamano-deno-francisco]
  - id: cal.1965-05-06.robert-kennedy
    when: May 6
    date: '1965-05-06'
    thread: robert-kennedy
    also: [vietnam, latin-america]
    c: 'Robert Kennedy votes for the $700 million for Vietnam, on the understanding Stennis gave the day before: "It is not a blank check." Three courses open in Vietnam. On the Dominican Republic the same day: the object "not to drive the genuine democrats in the Dominican revolution into association with the Communists."'
    n: '[111 Cong. Rec. 9760–62 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf#page=33). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1965-05-04.vietnam]]; [[cal.1965-04-28.latin-america]]. Names: Robert Kennedy (K–J Adm. III.A); Stennis (K–J Cong. III.B).'
    tags: [name:kennedy-robert-f, name:stennis-john-c]
  - id: cal.1965-05-07.alabama
    when: May 7
    date: '1965-05-07'
    thread: alabama
    also: [voting-rights]
    c: 'Hayneville, Lowndes County. Wilkins, Klansman, tried for the murder of Viola Liuzzo; the FBI''s informer in the car testifies that he fired the shots. Mistrial: the jury 10–2 to convict. Check the date and the split.'
    n: 'May, *The Informant* (K–J Cong. II.F). See [[cal.1965-03-07.voting-rights]]. Names: Wilkins, Liuzzo (K–J Cong. III.K).'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola]
  - id: cal.1965-05-07.opinion
    when: May 7
    date: '1965-05-07'
    thread: opinion
    also: [students]
    c: 'Gallup, special survey of students at 97 four-year colleges: continue the draft, or depend on volunteers. Men: continue 61 percent, volunteers 37. Women: 76 and 20.'
    n: '*The Gallup Poll*, III, 1938–39 (K–J Cong. II.E).'
  - id: cal.1965-05-08.transition-and-staff
    when: May 8
    date: '1965-05-08'
    thread: transition-and-staff
    c: 'Executive Order 11222, standards of ethical conduct for the executive branch: officials appointed by the President and reporting to him to file statements of their financial interests; gifts, entertainment, and favors limited.'
    n: '[Exec. Order No. 11,222](https://www.presidency.ucsb.edu/documents/executive-order-11222-prescribing-standards-ethical-conduct-for-government-officers-and), [30 Fed. Reg. 6469](https://www.govinfo.gov/app/details/FR-1965-05-11); [Statement by the President Upon Issuing Order Prescribing Standards of Ethical Conduct for Government Officers and Employees](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-issuing-order-prescribing-standards-ethical-conduct-for) (May 9, 1965). See [[cal.1965-01-20.transition-and-staff]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-09.opinion
    when: May 9
    date: '1965-05-09'
    thread: opinion
    c: 'Gallup, Apr. 2–7: the domestic problems the Government should attend to most, three chosen from ten: public education 45 percent; crime 41; killer diseases 37; unemployment 35; poor areas 32; racial discrimination 29; housing and slums 21; highway safety 18; pollution of air and water 17; beautifying America 3.'
    n: '*The Gallup Poll*, III, 1939 (K–J Cong. II.E).'
  - id: cal.1965-05-11.voting-rights
    when: May 11
    date: '1965-05-11'
    thread: voting-rights
    c: 'Senate, on the Mansfield–Dirksen substitute for the voting rights bill: Edward Kennedy''s amendment to ban the poll tax in State and local elections refused, [45–49](https://voteview.com/rollcall/RS0890052). May 19, a declaration that the tax abridges the right to vote, the Attorney General to sue, taken, [69–20](https://voteview.com/rollcall/RS0890060).'
    n: '[111 Cong. Rec., Senate, May 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt8/pdf/GPO-CRECB-1965-pt8-1-1.pdf); [May 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt8/pdf/GPO-CRECB-1965-pt8-7-2.pdf). See [[cal.1965-03-15.voting-rights]]. Names: Kennedy (K–J Cong. III.B); Mansfield, Dirksen (K–J Cong. III.A).'
    tags: [name:kennedy-edward-m, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-05-12.vietnam
    when: May 12–18
    date: '1965-05-12'
    thread: vietnam
    c: 'The first bombing pause (MAYFLOWER): no attacks on the North from noon, Washington time, May 12. Rusk tells Dobrynin, May 11. In Moscow the North Vietnamese ambassador will not receive Kohler; the message left with an embassy employee. Gromyko calls the American message to Dobrynin "insulting." Rolling Thunder resumes May 18.'
    n: 'FRUS 1964–68, II, docs. [293](https://history.state.gov/historicaldocuments/frus1964-68v02/d293), [294](https://history.state.gov/historicaldocuments/frus1964-68v02/d294), [298](https://history.state.gov/historicaldocuments/frus1964-68v02/d298), [304](https://history.state.gov/historicaldocuments/frus1964-68v02/d304), [305](https://history.state.gov/historicaldocuments/frus1964-68v02/d305). [Address to Members of the Association of American Editorial Cartoonists: The Challenge of Human Need in Viet-Nam](https://www.presidency.ucsb.edu/documents/address-members-the-association-american-editorial-cartoonists-the-challenge-human-need) (May 13, 1965). Herring, *The Secret Diplomacy of the Vietnam War* (Viet. II.I.3). Thies, *When Governments Collide*; *The Search for Peace in Vietnam* (Viet. II.F.16). Logevall, *Choosing War* (K–J Adm. II.D). See [[cal.1965-03-02.vietnam]]. Names: Rusk (Viet. III.A); Dobrynin, Gromyko (K–J Adm. III.J); Kohler (K–J Adm. III.E).'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:dobrynin-anatoly, name:kohler-foy-d, name:gromyko-andrei]
  - id: cal.1965-05-12.opinion
    when: May 12
    date: '1965-05-12'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, Apr. 2–7: the Johnson Administration pushing integration too fast, 45 percent; not fast enough, 14; about right, 32. Southern whites 70 too fast; whites outside the South 41.'
    n: '*The Gallup Poll*, III, 1939 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-15.students
    when: May 15
    date: '1965-05-15'
    thread: students
    also: [vietnam]
    c: The National Teach-In on Vietnam, Sheraton-Park Hotel, Washington, by the Inter-University Committee for Debate on Foreign Policy; carried by telephone to some 100 campuses. Bundy, to have spoken for the administration, sent to the Dominican Republic; his statement read. Check the count.
    n: 'Louis Menashe & Ronald Radosh, *Teach-ins: U.S.A.: Reports, Opinions, Documents* (1967). Wells, *The War Within* (K–J Cong. II.F). DeBenedetti, *An American Ordeal*; Zaroulis & Sullivan, *Who Spoke Up?* (Viet. II.G.1). Bird, *The Color of Truth* (Viet. II.H.1). See [[cal.1964-12-02.states-and-cities]]. Names: Bundy (Viet. III.A).'
    tags: [name:bundy-mcgeorge]
  - id: cal.1965-05-15.latin-america
    when: May 15–26
    date: '1965-05-15'
    thread: latin-america
    c: 'Bundy''s mission. Bundy, Vance, and Fortas see Bosch in Puerto Rico, May 15: a government under Antonio Guzmán, Bosch''s agriculture minister, "Constitution sí, communism no." Bundy and Vance in Santo Domingo from May 16; Mann and Vaughn with Imbert''s generals. Imbert''s offensive takes the rebels'' northern zone; a truce from May 21. Check. No agreement on Guzmán; Bundy home May 26.'
    n: 'FRUS 1964–68, XXXII, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v32/d72), [74](https://history.state.gov/historicaldocuments/frus1964-68v32/d74), [89](https://history.state.gov/historicaldocuments/frus1964-68v32/d89), [95](https://history.state.gov/historicaldocuments/frus1964-68v32/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v32/d97). [Further Statement by the President on the OAS Mission to the Dominican Republic](https://www.presidency.ucsb.edu/documents/further-statement-the-president-the-oas-mission-the-dominican-republic) (May 15, 1965). Bird, *The Color of Truth* (Viet. II.H.1). Murphy, *Fortas* (K–J Cong. II.G). See [[cal.1965-04-28.latin-america]]. Names: Bundy (K–J Adm. III.E); Vance (K–J Adm. III.F); Fortas (K–J Cong. III.G); Bosch (K–J Adm. III.J).'
    tags: [name:bundy-mcgeorge, name:vance-cyrus, name:fortas-abe, name:bosch-juan, name:guzman-fernandez-silvestre-antonio, name:mann-thomas-c, name:vaughn-jack-h, name:imbert-barrera-antonio]
  - id: cal.1965-05-16.opinion
    when: May 16
    date: '1965-05-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 23–28: what to do next in Vietnam: withdraw 13 percent; negotiate 12; continue 13; step up 8; go all out 15; others, no opinion 39. Handling South Vietnam as well as could be expected, 52; badly, 27. Should have become involved, 52; not, 26. The bombing of North Vietnam: stop 21, continue 59.'
    n: '*The Gallup Poll*, III, 1939–40 (K–J Cong. II.E).'
  - id: cal.1965-05-17.economy
    when: May 17
    date: '1965-05-17'
    thread: economy
    c: 'Excise tax message: $3.5 billion off in two equal stages, July 1, 1965, and Jan. 1, 1966, $464 million more by 1969. To go: the retail taxes on furs, jewelry, luggage, toilet articles; the telephone tax, by 1969. The automobile tax from 10 percent to 7. User charges on highways and waterways up. Announced May 15.'
    n: '[Special Message to the Congress Recommending Reduction of Excise Taxes and Increases in User Charges](https://www.presidency.ucsb.edu/documents/special-message-the-congress-recommending-reduction-excise-taxes-and-increases-user) (May 17, 1965); [Remarks Upon Announcing Plans To Recommend a Reduction in Excise Taxes](https://www.presidency.ucsb.edu/documents/remarks-upon-announcing-plans-recommend-reduction-excise-taxes) (May 15, 1965). Zelizer, *Taxing America* (K–J Cong. II.B). Stein, *The Fiscal Revolution in America*; Okun, *The Political Economy of Prosperity* (K–J Adm. II.B). See [[cal.1964-11-23.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-18.jobs-and-wages
    when: May 18
    date: '1965-05-18'
    thread: jobs-and-wages
    c: 'Labor message. Repeal of Section 14(b) of the Taft–Hartley Act, which lets States ban the union shop. Minimum wage and overtime coverage for 4½ million more workers; double time for excessive overtime. A permanent federal program of extended unemployment benefits. No new minimum rate: the question "when and by how much."'
    n: '[Special Message to the Congress on Labor](https://www.presidency.ucsb.edu/documents/special-message-the-congress-labor) (May 18, 1965). Repeal of section 14(b) (K–J Cong. II.J.2). Boyle, *The UAW and the Heyday of American Liberalism* (K–J Cong. II.F). See [[cal.1965-01-04.program]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-05-18.poverty
    when: May 18
    date: '1965-05-18'
    thread: poverty
    c: 'Head Start. In the Rose Garden with Shriver: some 2,000 child development centers to open this summer, for perhaps half a million children; preschool, medical and dental care.'
    n: '[Remarks on Project Head Start](https://www.presidency.ucsb.edu/documents/remarks-project-head-start) (May 18, 1965); [The President''s Statement to the Cabinet on Project Head Start](https://www.presidency.ucsb.edu/documents/the-presidents-statement-the-cabinet-project-head-start) (June 19, 1965). Gillette, *Launching the War on Poverty* (K–J Adm. II.B). Stossel, *Sarge* (K–J Adm. II.G.5). See [[cal.1964-12-12.poverty]]. Names: Shriver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1965-05-21.students
    when: May 21–22
    date: '1965-05-21'
    thread: students
    also: [vietnam]
    c: 'Vietnam Day, Berkeley: some 35 hours of speeches against the war on the campus. The Vietnam Day Committee formed. Check the crowd.'
    n: Rorabaugh, *Berkeley at War* (K–J Cong. II.F). Wells, *The War Within* (K–J Cong. II.F). See [[cal.1965-05-15.students]].
  - id: cal.1965-05-23.opinion
    when: May 23
    date: '1965-05-23'
    thread: opinion
    also: [desegregation-schools]
    c: 'Gallup, Apr. 23–28: white parents who would object to a school where a few of the children are colored: outside the South 7 percent, South 37; where half are, 28 and 68; where more than half are, 52 and 78.'
    n: '*The Gallup Poll*, III, 1940–41 (K–J Cong. II.E).'
  - id: cal.1965-05-24.court
    when: May 24
    date: '1965-05-24'
    thread: court
    c: '*Lamont v. Postmaster General*, [381 U.S. 301](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381301/usrep381301.pdf): the 1962 act holding foreign "communist political propaganda" in the mails until the addressee asks for it void under the First Amendment. Douglas for the Court, 8–0; White not sitting.'
    n: 'Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-12-14.court]]. Names: Douglas, White (K–J Cong. III.G).'
    tags: [name:douglas-william-o, name:white-byron-r]
  - id: cal.1965-05-24.conservation
    when: May 24–26
    date: '1965-05-24'
    thread: conservation
    c: 'White House Conference on Natural Beauty, Laurance Rockefeller chairman. May 26, four highway beauty bills sent up: billboards and junkyards within 1,000 feet of Interstate and primary highways controlled, as a condition of federal highway aid; landscaping; scenic roads.'
    n: '[Remarks to the Delegates to the White House Conference on Natural Beauty](https://www.presidency.ucsb.edu/documents/remarks-the-delegates-the-white-house-conference-natural-beauty) (May 25, 1965); [Letter to the President of the Senate and to the Speaker of the House Transmitting Bills To Improve Highway Beauty](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-transmitting-bills-improve) (May 26, 1965). Lewis L. Gould, *Lady Bird Johnson and the Environment* (1988). Lady Bird Johnson, *A White House Diary* (K–J Adm. II.G.3). Smith, *Stewart L. Udall* (K–J Adm. II.B). See [[cal.1964-09-03.conservation]].'
    tags: [name:johnson-lyndon-b, name:rockefeller-laurance-s]
  - id: cal.1965-05-25.foreign-aid
    when: May 25
    date: '1965-05-25'
    thread: foreign-aid
    c: House passes the foreign aid authorization, H.R. 7750, [249–148](https://voteview.com/rollcall/RH0890056); recommittal refused, [178–219](https://voteview.com/rollcall/RH0890055). The Senate passes it June 14, [68–20](https://voteview.com/rollcall/RS0890109), with $89 million more for Southeast Asia, asked June 1 and added June 7, [42–26](https://voteview.com/rollcall/RS0890087).
    n: '[111 Cong. Rec., House, May 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-1-2.pdf); [111 Cong. Rec., Senate, June 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-4-2.pdf). [Special Message to the Congress on the Need for Additional Foreign Aid Funds for Southeast Asia](https://www.presidency.ucsb.edu/documents/special-message-the-congress-the-need-for-additional-foreign-aid-funds-for-southeast-asia) (June 1, 1965). Ruttan, *United States Development Assistance Policy* (K–J Adm. II.D). See [[cal.1964-10-07.foreign-aid]].'
  - id: cal.1965-05-25.voting-rights
    when: May 25–26
    date: '1965-05-25'
    thread: voting-rights
    c: Senate invokes cloture on the voting rights bill, [70–30](https://voteview.com/rollcall/RS0890067). May 26, the Mansfield–Dirksen substitute adopted, [78–18](https://voteview.com/rollcall/RS0890077); the bill passed, [77–19](https://voteview.com/rollcall/RS0890078).
    n: '[111 Cong. Rec., Senate, May 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-1-1.pdf); [May 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt9/pdf/GPO-CRECB-1965-pt9-2-2.pdf). [Statement by the President Following Passage by the Senate of the Voting Rights Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-senate-the-voting-rights-bill) (May 26, 1965). Voting Rights Act of 1965 (K–J Cong. II.J.2). See [[cal.1965-05-11.voting-rights]]. Names: Mansfield, Dirksen (K–J Cong. III.A).'
    tags: [name:mansfield-mike, name:dirksen-everett, name:johnson-lyndon-b]
