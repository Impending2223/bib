    c: 'Deng Xiaoping 邓小平, with Peng Zhen 彭真, holds talks with Hoàng Văn Hoan 黄文欢, member of the Vietnam Workers'' Party Politburo 政治局 and vice-chairman of the Standing Committee of the National Assembly. Deng: the situation may well grow into a fairly large local war, so not Vietnam only but the Chinese too must free their thinking; all possibilities are to be estimated and preparations seized on every side; if war comes the Chinese are well placed, both sides'' commanders being ready and used to war; with solid preparation the Americans may fight only in the South and bomb the North; with thought freed and every contingency prepared they will sleep well, but if they fear smashing the pots and jars they will not sleep.'
