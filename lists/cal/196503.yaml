    also: [soviet-union, vietnam]
    c: 'Kennan before the House Subcommittee on the Far East and the Pacific, its hearings on the Sino-Soviet conflict: Vietnam "a classic example of the sort of situation we ought to avoid," not vital; the United States "will find it easier to deal with the Chinese in the long run ... if the Russians remain in a reasonably close and intimate relationship with the West"; local regimes left alone would develop "Titoist tendencies"; but the United States cannot "afford simply to get out."'
