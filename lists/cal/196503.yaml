  - id: cal.1965-03-18.china-leadership
    when: Mar. 18
    date: '1965-03-18'
    thread: china-leadership
    c: 'Zhou chairs the first meeting of the standing committee of the Fourth CPPCC National Committee. Gathering "cultural and historical materials", fifty-one issues so far, was his proposal: keep it true and practical; let one''s generation write what happened, favorable and unfavorable, in two parts, to teach the young. Truth is not easy: in government, two men tell the same event differently; go to first-hand material; to the masses'' views, first do not pour cold water, second be practical. Says he will not be chairman of the next CPPCC, so as not to hinder it with his work; for health, leaders should not hold too many posts.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 718 (Mar. 18, 1965). Names: Zhou Enlai.'
