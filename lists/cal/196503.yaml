  - id: cal.1965-03-01.china-leadership
    when: Mar. 1
    date: '1965-03-01'
    place: hanoi
    thread: china-leadership
    also: [vietnam-hanoi, soviet-union]
    c: Zhou leads the Chinese Communist Party delegation (Peng Zhen, Yang Chengwu, Wu Lengxi among them) to Hanoi for talks with the Workers' Party delegation under Hồ Chí Minh (Lê Duẩn, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp among them). The new CPSU leadership should not be judged by one look but several; after these months it is clear it carries out Khrushchevism, which cannot change basically.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 1, 1965); [[w.zhou-enlai-waijiao-huodong]], 438 (Mar. 1, 1965; 2:30 p.m., the Xihu villa (西湖别墅), Hanoi; the talks of the Chinese Party delegation with the Vietnam Workers'' Party delegation under Hồ Chí Minh; the book names Peng Zhen and Yang Chengwu for the Chinese side, and for the Vietnamese Lê Duẩn, Phạm Văn Đồng, Phạm Hùng and Võ Nguyên Giáp); [[w.zhou-enlai-waijiao-huodong]], 438 (Mar. 1, 1965; 7:30 p.m., Xihu villa, Hanoi; Zhou, with Peng Zhen, talks with Hồ Chí Minh and Lê Duẩn; the book has Zhou saying that after Khrushchev''s fall China hoped for change in the new Soviet leaders, proposed going together to congratulate them and see, and was greatly disappointed; they must be watched longer, and after these months it is clear that what they carry out is Khrushchevism, which cannot basically change); [[w.77-conversations-between-chinese]], [75–76](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=73) (doc. 4; Hanoi, Mar. 1, 1965, no hour: Zhou on the new Soviet leaders as carrying out Khrushchevism; Kosygin''s proposal of a joint socialist statement for Vietnam, which Zhou answered with separate statements; Soviet missile battalions, two MiG-21s and a 45-plane airlift to be watched; the editors, 75 n.120, list the Chinese present, Zhou, Peng Zhen, Yang Chengwu, Wu Lengxi, and the Vietnamese, Hồ, Lê Duẩn, Phạm Văn Đồng, Võ Nguyên Giáp, Phạm Hùng). [[w.peng-zhen-nianpu-1902]], IV, 402 (Mar. 1, 1965; Peng Zhen in Zhou Enlai''s delegation, with Yang Chengwu, Wu Lengxi and others, at Hanoi in talks with Hồ Chí Minh''s delegation, Lê Duẩn, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp and others; Zhou: the new Soviet leaders, watched these months, carry out Khrushchevism, unchangeable; the delegation back to Peking on the 2nd); [[w.khoo-collateral-damage]], 33 (Zhou to Hồ Chí Minh, Mar. 1: the new Soviet leaders follow nothing but Khrushchevism; beware their airlift and military instructors; relations between China and Vietnam may turn from good to bad). Made public: 1993. To check: [[w.77-conversations-between-chinese]], 78 (cited by [[w.khoo-collateral-damage]], 33 n.173). Names: Zhou Enlai, Peng Zhen, Yang Chengwu, Wu Lengxi, Hồ Chí Minh, Lê Duẩn, Phạm Văn Đồng, Phạm Hùng, Võ Nguyên Giáp.'
