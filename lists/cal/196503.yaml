    c: 'Xi''an 西安. Wang Zhao 王昭 reports on Qinghai 青海 (Yang Shangkun''s 杨尚昆 notes): 8,040 cadres in most of Huangzhong 湟中 county, some 270,000 people, since late October; over 60 percent of the poor and lower-middle peasants in the association; the economic cleanup nearly done, 90 percent of cadres cleared or freed; grain recovered 9.66 million jin, 6.1 million returned; cash 3.52 million yuan, 1.94 million returned; over a hundred guns; 130 group cases; the movement to end in late May. In the county''s 377 units, about 26 percent not in "our" hands; Party members to be purged perhaps 25 percent; branch secretaries 60 percent unfit; the democratic revolution''s lessons to be made up, a ninth of the area (160,000 people) never had land reform; Ma Bufang''s 马步芳 800 cadres, two executed; a few with blood debts to be executed late in the movement.'
