    c: 'Zhou receives Carol of the French weekly *Le Nouvel Observateur* and Ribud of the Paris photo agency Grand Images. China''s class struggle is marked by teaching the people to be alert, stronger and surer than legal means; the people are taught, and those of exploiter origin told they can be remolded if they serve the country; standards for Party members or progressives cannot be asked of them; left, middle and right always exist, and contradiction and struggle drive society on, even under communism. Asked whether he favors de Gaulle''s five-power conference on the U.N.: many things should be settled by all states sitting together, large and small equal; no five-power monopoly.'
