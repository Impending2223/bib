    thread: voting-rights
    c: 'The voting bill sent to Congress. Celler introduces it, H.R. 6400; Mar. 18, Mansfield for himself, Dirksen, and 64 others, S. 1564. Where a literacy or like test was used and fewer than half of those of voting age were registered on Nov. 1, 1964, or voted that November, tests suspended and federal examiners to list voters. Mar. 18, the Senate sends it to Judiciary with orders to report by Apr. 9, [67–13](https://voteview.com/rollcall/RS0890032). Stennis: "a pitiful thing"; Eastland: "opposed to every word and every line in the bill."'
    n: 'Letter to the President of the Senate Proposing Legislation To Eliminate Barriers to the Right To Vote, [1965 Pub. Papers 292](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=368) (Mar. 17, 1965). [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-8-2.pdf) (1965); [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf) (1965) (the bill, 5402–03). Voting Rights Act of 1965 (K–J Cong. II.J.2). [111 Cong. Rec. 5388–90](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf#page=3) (1965) (Mar. 18, 1965) (Stennis; Eastland). [[w.branch-at-canaans-edge]], 124 (the Senate''s instruction); [[w.mann-walls-of-jericho]], 467 (the referral; Stennis and Eastland); [[w.kotz-judgment-days]], 317 (Celler''s subcommittee, Mar. 17; Mar. 18 in the Senate, to be reported by Apr. 9); [[w.kotz-judgment-days]], 317 (sixty-six sponsors; the Judiciary Committee to report by Apr. 9, twelve Southerners and Margaret Chase Smith against; Mansfield: no Easter recess unless it passes by Apr. 15); [[w.bernstein-guns-or-butter]], 236–37 (sections 2–9; Eastland: a deadline "unheard of"). Check: Bernstein, 237, gives the vote to instruct the committee as 63 to 13. To check: [[w.katzenbach-some-of-it-was]]. See [[cal.1965-03-15.voting-rights]]. Names: Celler, Mansfield, Dirksen. Check: the pages.'
