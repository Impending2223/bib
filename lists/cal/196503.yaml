  - id: cal.1965-03-02.cities-and-housing
    when: Mar. 2
    date: '1965-03-02'
    thread: cities-and-housing
    c: 'Message on the cities: a Department of Housing and Urban Development; rent supplements, the government to pay part of the rent of low- and moderate-income families in privately built housing, more than 500,000 homes in four years; matching grants for community facilities, $100 million for fiscal 1966; aid to buy land ahead of growth.'
    n: 'Special Message to the Congress on the Nation''s Cities, [1965 Pub. Papers 231](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=307) (Mar. 2, 1965). To check: [[w.gelfand-nation-of-cities]]; [[w.sundquist-politics-and-policy]]. See [[cal.1962-01-24.program]]; [[cal.1964-09-02.cities-and-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-02.medicare
    when: Mar. 2
    date: '1965-03-02'
    thread: medicare
    c: 'Ways and Means in executive session on H.R. 1. Before it the administration''s hospital insurance, the AMA''s Eldercare, Byrnes''s Bettercare. Mills, in the afternoon, to Cohen: "Maybe it would be a good idea if we put all three of these bills together. You go back and work this out overnight." The three-layer cake.'
    n: 'Daily Digest, [111 Cong. Rec. D81](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=79) (Mar. 2, 1965). [[w.zelizer-taxing-america]], 239–42. To check: [[w.harris-sacred-trust]], 187–88. See [[cal.1965-01-07.medicare]]. Names: Mills, Byrnes, Cohen.'
    tags: [name:mills-wilbur-d, name:byrnes-john-w, name:cohen-wilbur-j]
  - id: cal.1965-03-02.war-opposition
    when: Mar. 2
    date: '1965-03-02'
    thread: war-opposition
    also: [king]
    c: 'Washington, Howard University. King on racism, poverty and violence, and for a negotiated settlement in Vietnam: "The war in Vietnam is accomplishing nothing." His first word against the war in public.'
    n: '[[w.garrow-bearing-the-cross]], 394. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-03-03.economy
    when: Mar. 3
    date: '1965-03-03'
    thread: economy
    c: 'Act ending the gold reserve against Federal Reserve deposits signed, [79 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg5.pdf): the Reserve Banks'' 25 percent in gold certificates against their deposits repealed; the 25 percent against Federal Reserve notes kept. The House passed it Feb. 9, the Senate Feb. 18.'
    n: 'H.R. 3818, 89th Cong. To check: [[w.solomon-international-monetary-system-1945]]. See [[cal.1965-02-09.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-04.transportation
    when: Mar. 4
    date: '1965-03-04'
    thread: transportation
    c: 'High-speed ground transportation bill sent to Congress: research and demonstrations by Commerce, rail above all, first in the Washington–Boston corridor, where travel is to rise 150 to 200 percent from 1960 to 1980.'
    n: 'Letter to the President of the Senate and to the Speaker of the House on High-Speed Interurban Ground Transportation, [1965 Pub. Papers 248](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=324) (Mar. 4, 1965). To check: [[w.pell-megalopolis-unbound]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-05.opinion
    when: Mar. 5
    date: '1965-03-05'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Jan. 28–Feb. 2: pay in the Neighborhood Youth Corps set by each community, 54 percent; the federal minimum of $1.25 required, 38. The pay for part-time work: $1.00 or less, 41; more, 46. South 54 for $1.00 or less.'
    n: '[[w.gallup-poll]], III, 1927–28.'
  - id: cal.1965-03-05.voting-rights
    when: Mar. 5
    date: '1965-03-05'
    thread: voting-rights
    also: [king]
    c: 'King with Johnson, seventy-five minutes. Johnson: a statute, not a constitutional amendment, to ease registration; Dirksen''s support promised. King to see Katzenbach on the bill''s terms.'
    n: '[[w.garrow-bearing-the-cross]], 395. See [[cal.1965-02-09.voting-rights]]. Names: King, Johnson, Dirksen, Katzenbach.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, name:dirksen-everett, name:katzenbach-nicholas]
  - id: cal.1965-03-07.voting-rights
    when: Mar. 7
    date: '1965-03-07'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. Some 650 set out from Brown Chapel to walk to Montgomery, Hosea Williams and John Lewis at the head. Beyond the Edmund Pettus Bridge, Lingo's state troopers, on a plan known to Wallace, and Sheriff Clark's mounted possemen break them up with clubs, tear gas, and nausea gas; 75 to 80 injured, Lewis's skull fractured. On television that night.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 104–05 (M.D. Ala. 1965) (the court''s findings). Film (K–J Cong. II.K). [[w.garrow-bearing-the-cross]], 395–99 (all but Lewis''s skull); [[w.dallek-flawed-giant]], 214–15. To check: [[w.garrow-protest-at-selma]]; [[w.lawson-black-ballots]]; [[w.may-bending-toward-justice]]; [[w.branch-at-canaans-edge]]; [[w.kotz-judgment-days]]; [[w.fairclough-to-redeem-the-soul]]; [[w.carson-in-struggle]]; [[w.carter-politics-of-rage-1995]]; [[w.lewis-walking-with-the-wind]]; [[w.reaching-for-glory]]. See [[cal.1965-01-02.voting-rights]]; [[cal.1965-02-18.voting-rights]]. Check: Garrow, 397, gives some six hundred. Names: Williams, Lingo, Clark, Lewis, Wallace. Check: Dallek gives 600 marchers, seventeen hospitalized and forty treated (215).'
    tags: [name:williams-hosea, name:lewis-john, name:lingo-albert-j, name:wallace-george-c, name:clark-james-g-jr]
  - id: cal.1965-03-07.opinion
    when: Mar. 7
    date: '1965-03-07'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Jan. 28–Feb. 2: the Federal Government to pay more of the public schools'' costs, 49 percent; the States and localities as now, 42. The money to public schools only, 41; to Catholic and other private schools as well, 51.'
    n: '[[w.gallup-poll]], III, 1928.'
  - id: cal.1965-03-08.vietnam
    when: Mar. 8
    date: '1965-03-08'
    thread: vietnam
    c: Two battalion landing teams of Marines come ashore at Đà Nẵng, the first American ground combat units in Vietnam; the mayor and General Thi, the corps commander, greet them. A third battalion and a helicopter squadron by Mar. 12. Their mission the security of the air base.
    n: '[FRUS 1964–68, II, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v02/d188). [[w.gibbons-u-s-government-and]], III, 124–125; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 532 (the landing; the third team in four days; the air base); [[w.marolda-united-states-navy-and]], 526–30 (the mission; the landing, Mar. 8; the second battalion by air; the helicopters, Mar. 9). To check: [[w.shulimson-u-s-marines-in]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.logevall-choosing-war]]; [[w.kahin-intervention]]; [[w.berman-lyndon-johnsons-war]]; [[w.herring-lbj-and-vietnam]]; [[w.kaiser-american-tragedy]]; [[w.taylor-swords-and-plowshares]]; [[w.westmoreland-soldier-reports]]. See [[cal.1965-02-22.vietnam]]. Names: Nguyễn Chánh Thi.'
    src:
      c: 8eeea390
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d188: all'
        - 'w.gibbons-u-s-government-and III, 124–125: all'
        - 'w.marolda-united-states-navy-and 526–30: A, C-D'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 532: A, C-D'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 532 n.155: A, C'
    tags: [name:nguyen-chanh-thi, place:da-nang]
  - id: cal.1965-03-08.court
    when: Mar. 8
    date: '1965-03-08'
    thread: court
    also: [voting-rights]
    c: '*Louisiana v. United States*, [380 U.S. 145](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380145/usrep380145.pdf): Louisiana''s test requiring an applicant to interpret any section of the State or Federal Constitution to the registrar''s satisfaction struck down. *United States v. Mississippi*, [380 U.S. 128](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380128/usrep380128.pdf): the Government''s suit against the State''s registration laws reinstated. Black for the Court in both. *Swain v. Alabama*, [380 U.S. 202](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380202/usrep380202.pdf): a prosecutor''s peremptory strikes of every Negro on one jury panel no proof of discrimination, 6–3.'
    n: 'To check: [[w.powe-warren-court-and-american]]; [[w.landsberg-enforcing-civil-rights]]. See [[cal.1964-12-14.court]]; [[cal.1964-03-06.voting-rights]].'
  - id: cal.1965-03-08.court-2
    when: Mar. 8
    date: '1965-03-08'
    thread: court
    also: [defense]
    c: '*United States v. Seeger*, [380 U.S. 163](https://tile.loc.gov/storage-services/service/ll/usrep/usrep380/usrep380163/usrep380163.pdf): the draft law''s exemption for objectors by "religious training and belief" covers "a sincere and meaningful belief" that occupies in its holder''s life "a place parallel to that filled by the God" of those plainly exempt. Clark for the Court, without dissent.'
    n: 'To check: [[w.baskir-chance-and-circumstance]]. See [[cal.1965-03-08.court]]. Names: Clark.'
    tags: [name:clark-tom-c]
  - id: cal.1965-03-08.crime-and-hijacking
    when: Mar. 8
    date: '1965-03-08'
    thread: crime-and-hijacking
    c: 'Message on crime: "a malignant enemy in America''s midst." A President''s Commission on Law Enforcement and Administration of Justice; a Law Enforcement Assistance Act, grants through the Attorney General for new methods in police, courts, and corrections; mail-order sales of guns to individuals stopped, interstate shipment only among licensed dealers. "Lee Oswald sent for and received a rifle through the United States mail."'
    n: 'Special Message to the Congress on Law Enforcement and the Administration of Justice, [1965 Pub. Papers 263](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=339) (Mar. 8, 1965). To check: [[w.flamm-law-and-order]]; [[w.justice-challenge-of-crime-in]]. See [[cal.1961-09-13.crime-and-hijacking]]. Names: Oswald.'
    tags: [name:johnson-lyndon-b, name:oswald-lee-harvey]
  - id: cal.1965-03-09.voting-rights
    when: Mar. 9
    date: '1965-03-09'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma, the second march. Judge Johnson bars any march until a hearing. King leads some 2,500 to the bridge, kneels with them at the troopers' line, and turns back, as Collins had arranged with Clark and Lingo. That night whites club James Reeb, a Unitarian minister from Boston; he dies in Birmingham Mar. 11.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 103 (M.D. Ala. 1965) (the order of Mar. 9). Statement by the President on the Situation in Selma, Alabama, [1965 Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=348) (Mar. 9, 1965): "deploring the brutality." Check the number. [[w.garrow-bearing-the-cross]], 401–05. See [[cal.1965-03-07.voting-rights]]. Check: Garrow, 403, gives two thousand marchers. Names: Frank Johnson, King, Collins, Clark, Lingo, Reeb.'
    tags: [name:johnson-frank-m-jr, name:king-martin-luther-jr, name:collins-leroy, name:clark-james-g-jr, name:lingo-albert-j, name:reeb-james-j, name:johnson-lyndon-b]
  - id: cal.1965-03-09.jobs-and-wages
    when: Mar. 9
    date: '1965-03-09'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Appalachian Regional Development Act signed, [79 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg5-2.pdf): an Appalachian Regional Commission; $840 million for 2,350 miles of development highways and 1,000 of access roads, to 1971; $252.4 million to June 1967 for health centers, land, timber, mines, water, and vocational schools. The House had passed the Senate''s bill Mar. 3, [257–165](https://voteview.com/rollcall/RH0890015); recommittal refused, [100–323](https://voteview.com/rollcall/RH0890014).'
    n: 'Remarks Upon Signing the Appalachia Bill, [1965 Pub. Papers 271](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=347) (Mar. 9, 1965): "The dole is dead. The pork barrel is gone." [111 Cong. Rec., House, Mar. 3, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-10-1.pdf). To check: [[w.eller-uneven-ground]]; [[w.caudill-night-comes-to-the]]. See [[cal.1965-02-01.jobs-and-wages]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-09.congress
    when: Mar. 9
    date: '1965-03-09'
    thread: congress
    c: Senate sets up a Joint Committee on the Organization of the Congress, six members from each House, three of each party, [88–0](https://voteview.com/rollcall/RS0890027); an amendment to let it recommend on rules and procedure refused, [29–58](https://voteview.com/rollcall/RS0890026). Monroney manages it. The House agrees Mar. 11 by unanimous consent, on Madden's request.
    n: 'S. Con. Res. 2, 89th Cong. [111 Cong. Rec., Senate, Mar. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-3-2.pdf); [111 Cong. Rec., House, Mar. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-5-1.pdf). To check: [[w.zelizer-on-capitol-hill]]; [[w.schickler-disjointed-pluralism]]. See [[cal.1965-01-04.congress]]. Names: Monroney, Madden.'
    tags: [name:monroney-almer-s, name:madden-ray-j]
  - id: cal.1965-03-09.mayors-st-louis
    when: Mar. 9
    date: '1965-03-09'
    thread: mayors
    also: [elections-1965]
    c: 'St. Louis, Democratic primary for mayor: Cervantes, a former president of the Board of Aldermen, over Mayor Tucker, seeking a fourth term, 83,698 to 68,379, 54.6 percent; one other 1,087, 0.7 percent.'
    n: 'City of St. Louis, ["Raymond R. Tucker"](https://www.stlouis-mo.gov/government/about/history/mayors/mayor.cfm?id=987) and ["Alfonso J. Cervantes"](https://www.stlouis-mo.gov/government/about/history/mayors/mayor.cfm?id=988); votes, [Wikipedia, "Alfonso J. Cervantes"](https://en.wikipedia.org/wiki/Alfonso_J._Cervantes) (Check: the Board of Election Commissioners). To check: [[w.gordon-mapping-decline]]. Names: Cervantes, Tucker.'
    tags: [state:mo, city:st-louis, name:cervantes-alfonso-j, name:tucker-raymond-r]
  - id: cal.1965-03-10.middle-east
    when: Mar. 10
    date: '1965-03-10'
    thread: middle-east
    c: 'Memorandum of understanding with Israel, signed: Israel will not be the first to introduce nuclear weapons into the Arab-Israel area; the United States may sell Jordan arms to keep out Soviet arms, Hussein''s armor to stay east of the Jordan; it will sell Israel as many tanks of the same quality, complete the 150 M48s if Germany does not, and see that Israel can buy combat aircraft.'
    n: 'FRUS 1964–68, XVIII, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v18/d184), [185](https://history.state.gov/historicaldocuments/frus1964-68v18/d185) (the memorandum), [189](https://history.state.gov/historicaldocuments/frus1964-68v18/d189) (Eshkol to Johnson, Mar. 12). Made public: FRUS 1964–68, XVIII (2000). See [[cal.1965-02-25.middle-east]]. Names: Harriman, Komer, Hussein ibn Talal.'
    tags: [name:harriman-w-averell, name:komer-robert-w, name:hussein-ibn-talal]
  - id: cal.1965-03-12.opinion
    when: Mar. 12
    date: '1965-03-12'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 19–24: continue present efforts in South Vietnam, 66 percent; pull out, 19. A bigger war: likely 44, not 43. A conference called by Johnson with the leaders of Southeast Asia and China: yes 81, no 11.'
    n: '[[w.gallup-poll]], III, 1929. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-13.voting-rights
    when: Mar. 13
    date: '1965-03-13'
    thread: voting-rights-selma
    also: [alabama]
    c: 'Wallace at the White House, on his telegram of the night before. Johnson asks him to declare for universal suffrage, to permit peaceful assembly, and to call a biracial meeting. News conference in the Rose Garden after: "What happened in Selma was an American tragedy"; the voting bill to go to Congress Monday; if State officials will not register citizens, federal officials will.'
    n: 'The President''s News Conference, [1965 Pub. Papers 274](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=350) (Mar. 13, 1965). [President''s Daily Diary, Mar. 13, 1965](https://catalog.archives.gov/id/192452), images 1, 2, 3 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]], 407–08; [[w.dallek-flawed-giant]], 216–17. To check: [[w.carter-politics-of-rage-1995]]; [[w.kotz-judgment-days]]. See [[cal.1965-03-07.voting-rights]]. Names: Wallace.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b]
  - id: cal.1965-03-14.voting-rights
    when: Mar. 14
    date: '1965-03-14'
    thread: voting-rights
    c: 'Johnson telephones King to ask him to the address to Congress the next night. King declines: Reeb''s memorial service in Selma.'
    n: '[[w.garrow-bearing-the-cross]], 408. Check: a recording. See [[cal.1965-03-07.voting-rights]]. Names: Johnson, King, Reeb.'
    tags: [name:johnson-lyndon-b, name:king-martin-luther-jr, name:reeb-james-j]
  - id: cal.1965-03-15.voting-rights
    when: Mar. 15
    date: '1965-03-15'
    thread: voting-rights
    c: 'Johnson to a joint session, at night, on television: "The American Promise." "So it was last week in Selma, Alabama." A voting bill to strike down the restrictions used to deny Negroes the vote, in all elections; "their cause must be our cause too. ... And we shall overcome." A written message the same day.'
    n: 'Special Message to the Congress: The American Promise, [1965 Pub. Papers 281](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=357) (Mar. 15, 1965); Special Message to the Congress on the Right To Vote, [1965 Pub. Papers 287](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=363) (Mar. 15, 1965). [111 Cong. Rec., House, Mar. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-6-2.pdf). Recording (K–J Adm. II.I). [President''s Daily Diary, Mar. 15, 1965](https://catalog.archives.gov/id/192454), images 5, 6 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]], 408–09. See [[cal.1965-03-07.voting-rights]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-16.vietnam
    when: Mar. 16
    date: '1965-03-16'
    thread: vietnam
    c: 'The White House, 1 p.m.: Johnson with Rusk, McNamara and McGeorge Bundy. Bundy''s agenda: four more weeks of Rolling Thunder, Barrel Roll, the Army Chief of Staff''s twenty-one points, ground forces. Johnson asks for "more ideas and more horsepower and more imagination"; every able-bodied South Vietnamese man under forty in the army.'
    n: '[FRUS 1964–68, II, doc. 200](https://history.state.gov/historicaldocuments/frus1964-68v02/d200) (the agenda). [[w.dallek-flawed-giant]], 256 (from Bundy''s notes of the meeting). Made public: FRUS 1964–68, II (1996). See [[cal.1965-02-13.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge]
  - id: cal.1965-03-17.voting-rights
    when: Mar. 17
    date: '1965-03-17'
    thread: voting-rights
    c: The voting bill sent to Congress. Celler introduces it, H.R. 6400; Mar. 18, Mansfield for himself, Dirksen, and 64 others, S. 1564. Where a literacy or like test was used and fewer than half of those of voting age were registered on Nov. 1, 1964, or voted that November, tests suspended and federal examiners to list voters. Mar. 18, the Senate sends it to Judiciary with orders to report by Apr. 9, [67–13](https://voteview.com/rollcall/RS0890032).
    n: 'Letter to the President of the Senate Proposing Legislation To Eliminate Barriers to the Right To Vote, [1965 Pub. Papers 292](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=368) (Mar. 17, 1965). [111 Cong. Rec., House, Mar. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-8-2.pdf); [111 Cong. Rec., Senate, Mar. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf) (the bill, 5402–03). Voting Rights Act of 1965 (K–J Cong. II.J.2). To check: [[w.katzenbach-some-of-it-was]]. See [[cal.1965-03-15.voting-rights]]. Names: Celler, Mansfield, Dirksen.'
    tags: [name:johnson-lyndon-b, name:celler-emanuel, name:mansfield-mike, name:dirksen-everett]
  - id: cal.1965-03-17.alabama
    when: Mar. 17
    date: '1965-03-17'
    thread: voting-rights-selma
    also: [alabama]
    c: 'Judge Johnson permits the march to Montgomery on U.S. 80, on the plaintiffs'' plan: no limit on numbers on the four-lane road, 300 on the two-lane stretch; Wallace, Lingo, and Clark enjoined from interfering. "The extent of the right to assemble, demonstrate and march peaceably ... should be commensurate with the enormity of the wrongs."'
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 106–09 (M.D. Ala. 1965). Opinion (K–J Cong. II.J.1). To check: [[w.bass-taming-the-storm]]. See [[cal.1965-03-09.voting-rights]]. Names: Frank Johnson, Wallace, Lingo, Clark.'
    tags: [name:johnson-frank-m-jr, name:wallace-george-c, name:lingo-albert-j, name:clark-james-g-jr]
  - id: cal.1965-03-17.court
    when: Mar. 17
    date: '1965-03-17'
    thread: court
    also: [congress]
    c: House refuses the Justices $3,000 more a year, [178–202](https://voteview.com/rollcall/RH0890020), the rule having carried, [202–183](https://voteview.com/rollcall/RH0890019). The pay act of 1964 had raised Members' and other federal judges' salaries $7,500, the Justices' $4,500, to $39,500; the Chief Justice $40,000.
    n: 'H.R. 5374, 89th Cong. [111 Cong. Rec., House, Mar. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-8-2.pdf). To check: [[w.powe-warren-court-and-american]]. See [[cal.1965-03-08.court]].'
  - id: cal.1965-03-18.transition-and-staff
    when: Mar. 18
    date: '1965-03-18'
    thread: transition-and-staff
    also: [economy]
    c: Dillon to leave the Treasury; Fowler, Under Secretary 1961–64, named to succeed him. Confirmed Mar. 25 without a roll call; sworn Apr. 1.
    n: 'Remarks to the Press Upon Announcing the Nomination of Henry H. Fowler as Secretary of the Treasury, [1965 Pub. Papers 295](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=371) (Mar. 18, 1965); Letter Accepting Resignation of Douglas Dillon as Secretary of the Treasury, [1965 Pub. Papers 347](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=423) (Mar. 31, 1965); Remarks at the Swearing In of Henry H. Fowler as Secretary of the Treasury, [1965 Pub. Papers 362](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=438) (Apr. 1, 1965). [111 Cong. Rec., Senate, Mar. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt5/pdf/GPO-CRECB-1965-pt5-2-1.pdf). See [[cal.1965-01-20.transition-and-staff]]. Names: Dillon, Fowler.'
    tags: [name:johnson-lyndon-b, name:dillon-c-douglas, name:fowler-henry-h]
  - id: cal.1965-03-18.crime-and-hijacking-wv
    when: Mar. 18
    date: '1965-03-18'
    thread: crime-and-hijacking
    c: 'West Virginia abolishes capital punishment. Smith approves H.B. 517, passed Mar. 12: no one convicted, before or after, to be executed; life imprisonment for first-degree murder, kidnapping and rape, without parole unless the jury recommends mercy.'
    n: '[Enrolled Committee Substitute for H.B. 517](https://code.wvlegislature.gov/signed_bills/1965/1965-RS-HB517-SUB%20ENR_signed.pdf), approved Mar. 18, 1965; [W. Va. Code § 61-11-2](https://code.wvlegislature.gov/61-11-2/). *West Virginia Blue Book*, 1965, [p. 307](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1965.pdf#page=317). To check: [[w.banner-death-penalty]]; [[w.williams-west-virginia]]. Names: Smith.'
    tags: [state:wv, name:smith-hulett-c]
  - id: cal.1965-03-18.european-community
    when: Mar. 18
    date: '1965-03-18'
    thread: european-community
    c: 'Hallstein at the White House. Joint statement: Johnson for European unity; congratulations on the Six''s decision to merge the executives of the three Communities; the Kennedy Round to free trade "in both industry and agriculture."'
    n: 'Joint Statement Following a Meeting With the President of the Commission of the European Economic Community, [1965 Pub. Papers 295](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=371) (Mar. 18, 1965). See [[cal.1962-04-09.european-community]]. Names: Hallstein, Johnson.'
    tags: [name:hallstein-walter, name:johnson-lyndon-b]
  - id: cal.1965-03-20.alabama
    when: Mar. 20
    date: '1965-03-20'
    thread: voting-rights-selma
    also: [alabama]
    c: 'Wallace, Mar. 18: the State needs 6,171 men to guard the march and has some 450; he asks for federal civil officers. Johnson that night: Wallace has 10,000 Guardsmen. Mar. 19, Wallace and the legislature: Alabama cannot bear the cost. Mar. 20, 1:30 a.m., from Johnson City, Tex., Proclamation 3645 and Executive Order 11207: the Alabama Guard called into federal service, the Secretary of Defense to use the armed forces as needed; Ramsey Clark to Alabama.'
    n: 'Statement by the President in Response to a Telegram From the Governor of Alabama, [1965 Pub. Papers 296](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=372) (Mar. 18, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 299](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=375) (Mar. 20, 1965). Proclamation 3645, [30 Fed. Reg. 3739](https://www.govinfo.gov/app/details/FR-1965-03-23); Exec. Order 11207, [30 Fed. Reg. 3743](https://www.govinfo.gov/app/details/FR-1965-03-23). See [[cal.1965-03-17.alabama]]. Names: Wallace, Ramsey Clark.'
    tags: [name:wallace-george-c, name:johnson-lyndon-b, name:clark-ramsey]
  - id: cal.1965-03-20.laos
    when: Mar. 20
    date: '1965-03-20'
    thread: laos
    also: [vietnam]
    c: 'State to Sullivan: Steel Tiger, a separate program of American air operations against the routes of infiltration through the panhandle, to begin Apr. 3 at greater intensity than the present; Barrel Roll, also from Apr. 3, to answer the Lao government''s needs in the north.'
    n: '[FRUS 1964–68, XXVIII, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v28/d174) (Deptel 809, 5:04 p.m.). [[w.staaveren-u-s-air-force]], 56 (the President''s go-ahead, Mar. 20, by Van Staaveren''s account). To check: msg, JCS to CINCPAC, 200019Z Mar 65 (cited by [[w.staaveren-u-s-air-force]], 56 n.9, for the go-ahead). Bibliography: [[cal.1965-04-03.laos]]. Names: Sullivan.'
    src:
      c: fe9f267e
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d174: all'
        - 'w.staaveren-u-s-air-force 56: A'
        - 'via w.staaveren-u-s-air-force 56 n.9: A'
    tags: [name:sullivan-william-h]
  - id: cal.1965-03-21.voting-rights
    when: Mar. 21–25
    date: '1965-03-21'
    thread: voting-rights-selma
    also: [alabama, king]
    c: 'Selma to Montgomery. King leads some 3,200 out of Selma under the federalized Guard, Army troops, marshals, and the FBI; 300 through Lowndes County; thousands join for the last miles. Mar. 25, some 25,000 at the Capitol in Montgomery. King: "How long? Not long."'
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 108–09 (M.D. Ala. 1965) (the plan). Check the counts. [[w.garrow-bearing-the-cross]], 410–13. See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-20.alabama]]. Names: King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1965-03-23.space
    when: Mar. 23
    date: '1965-03-23'
    thread: space
    c: 'Gemini 3: Grissom and Young, three orbits in under five hours, the first American crew of two. They fire the thrusters to change their orbit, the first crew to do so. Five days after Voskhod 2, from which a Soviet cosmonaut stepped out into space.'
    n: 'Message of Congratulations Following the Orbital Flight of Russian Spaceship Voskhod 2, [1965 Pub. Papers 299](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=375) (Mar. 19, 1965); Statement by the President on the Flight of Gemini 3, [1965 Pub. Papers 310](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=386); Telephone Conversation With Gus Grissom and John Young Following the Orbital Flight of Gemini 3, [1965 Pub. Papers 309](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=385) (Mar. 23, 1965). To check: [[w.hacker-on-the-shoulders-of]]; [[w.mcdougall-heavens-and-the-earth]]; [[w.siddiqi-challenge-to-apollo]]. See [[cal.1964-07-31.space]]. Names: Grissom, Young.'
    tags: [name:grissom-virgil-i, name:young-john-w, name:johnson-lyndon-b]
  - id: cal.1965-03-23.medicare
    when: Mar. 23
    date: '1965-03-23'
    thread: medicare
    also: [welfare]
    c: 'Ways and Means votes out Mills''s bill, H.R. 6675: hospital insurance under Social Security, up to 60 days an illness, with nursing home care, from a payroll tax; insurance for doctors'' bills, voluntary, $3 a month; Kerr-Mills enlarged for the needy of all ages; cash benefits up 7 percent.'
    n: 'Statement by the President Following Committee Action on the Medicare Bill, [1965 Pub. Papers 311](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=387) (Mar. 23, 1965); Remarks to the Press Following a Meeting With Congressional Leaders To Discuss Medical Care Legislation, [1965 Pub. Papers 327](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=403) (Mar. 26, 1965). [[w.zelizer-taxing-america]], 245–48, 251. To check: [[w.marmor-politics-of-medicare]]; [[w.david-with-dignity]]. See [[cal.1965-01-07.medicare]]. Names: Mills.'
    tags: [name:mills-wilbur-d, name:johnson-lyndon-b]
  - id: cal.1965-03-24.students
    when: Mar. 24–25
    date: '1965-03-24'
    thread: students
    also: [vietnam]
    c: 'Ann Arbor. The first teach-in on the war, at the University of Michigan: faculty and students, some 3,000, in lectures, debates, and seminars from evening to morning. Faculty had first planned a one-day strike against the war. Columbia, Mar. 26; teach-ins at some 35 more campuses within a week. Check the counts.'
    n: '[[w.gibbons-u-s-government-and]], III, 270–271. To check: [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]; [[w.heineman-campus-wars]].'
  - id: cal.1965-03-24.opinion
    when: Mar. 24
    date: '1965-03-24'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Feb. 19–24: Republicans'' choice to lead the party: Nixon 36, Lodge 16, Romney 14, Goldwater 11, Scranton 8, Rockefeller 4, Taft 4, Percy 2, Hatfield 2. Independents: Nixon 29, Lodge 18, Romney 14, Goldwater 10, Scranton 7, Rockefeller 7.'
    n: '[[w.gallup-poll]], III, 1930. Names: Lodge, Nixon, Goldwater, Percy, Hatfield, Romney, Scranton, Rockefeller, Taft.'
    tags: [name:nixon-richard-m, name:lodge-henry-cabot, name:romney-george-w, name:goldwater-barry-m, name:scranton-william-w, name:rockefeller-nelson, name:taft-robert-jr, name:percy-charles-h, name:hatfield-mark-o]
  - id: cal.1965-03-24.vietnam
    when: Mar. 24
    date: '1965-03-24'
    thread: vietnam
    c: 'Mansfield to Johnson, a letter: policy running opposite to all his memoranda. Ground forces held at two or three points on the sea, Saigon and Đà Nẵng; the Geneva conference reconvened, a cease-fire its one condition. He expects no answer.'
    n: '[FRUS 1964–68, II, doc. 215](https://history.state.gov/historicaldocuments/frus1964-68v02/d215). [[w.gibbons-u-s-government-and]], III, 205–208. See [[cal.1965-03-08.vietnam]]. Names: Mansfield, Johnson.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1965-03-24.state-and-city-finance-id
    when: Mar. 24
    date: '1965-03-24'
    thread: state-and-city-finance
    c: 'Idaho''s sales tax. Smylie approves H.B. 222, the Idaho Sales Tax Act: 3 percent on retail sales, and a use tax, collected from July 1, 1965; the income tax''s rates changed and the corporations'' deduction of the federal tax ended, for 1965.'
    n: '1965 Idaho Sess. Laws, ch. 195, [408](https://legislature.idaho.gov/wp-content/uploads/sessionlaws/sessionlaws_1965.pdf#page=441), § 19 (the rate), § 43 (the emergency and the dates); "Approved March 24, 1965," [437](https://legislature.idaho.gov/wp-content/uploads/sessionlaws/sessionlaws_1965.pdf#page=470). Names: Smylie.'
    tags: [state:id, name:smylie-robert-e]
  - id: cal.1965-03-25.jobs-and-wages
    when: Mar. 25
    date: '1965-03-25'
    thread: jobs-and-wages
    also: [poverty]
    c: Message on area and regional development, for depressed areas of some 27 million people. The Area Redevelopment Administration's work to an Economic Development Administrator in Commerce; grants for public facilities, half the cost; multi-county development districts; regional planning commissions on the Appalachian model.
    n: 'Special Message to the Congress on Area and Regional Economic Development, [1965 Pub. Papers 320](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=396) (Mar. 25, 1965). To check: [[w.sundquist-politics-and-policy]]. See [[cal.1965-03-09.jobs-and-wages]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-25.alabama
    when: Mar. 25
    date: '1965-03-25'
    thread: alabama
    also: [voting-rights]
    c: Viola Liuzzo of Detroit, a white volunteer driving marchers back to Selma, shot dead from a passing car on U.S. 80 in Lowndes County. The young Negro marcher with her survives.
    n: 'Televised Remarks Announcing the Arrest of Members of the Ku Klux Klan, [1965 Pub. Papers 332](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=408) (Mar. 26, 1965). To check: [[w.may-informant]]; [[w.stanton-from-selma-to-sorrow]]. See [[cal.1965-03-21.voting-rights]]. Names: Liuzzo.'
    tags: [name:liuzzo-viola]
  - id: cal.1965-03-26.civil-rights-the-executive
    when: Mar. 26
    date: '1965-03-26'
    thread: civil-rights-the-executive
    also: [alabama]
    c: 'Johnson on television from the East Room, Hoover beside him: four Klansmen arrested in Birmingham for Liuzzo''s death, on a federal conspiracy charge; one of them the FBI''s informant. "Get out of the Ku Klux Klan now." Katzenbach to draft legislation against the Klan; Congress invited to investigate. Apr. 14, the House gives the Un-American Activities Committee $50,000 for an inquiry into the Klan, [313–44](https://voteview.com/rollcall/RH0890038).'
    n: 'Televised Remarks Announcing the Arrest of Members of the Ku Klux Klan, [1965 Pub. Papers 332](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=408) (Mar. 26, 1965). H. Res. 310, 89th Cong.; [111 Cong. Rec., House, Apr. 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-6-1.pdf). To check: [[w.goodman-committee]]. See [[cal.1965-03-25.alabama]]. Names: Hoover, Katzenbach, Liuzzo.'
    tags: [name:johnson-lyndon-b, name:hoover-j-edgar, name:katzenbach-nicholas, name:liuzzo-viola]
  - id: cal.1965-03-26.school-aid
    when: Mar. 26
    date: '1965-03-26'
    thread: school-aid
    c: House passes the Elementary and Secondary Education bill, H.R. 2362, [263–153](https://voteview.com/rollcall/RH0890026); recommittal lost, [149–267](https://voteview.com/rollcall/RH0890025).
    n: '[111 Cong. Rec., House, Mar. 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt5/pdf/GPO-CRECB-1965-pt5-3-1.pdf). Statement by the President Following House Action on the Education Bill, [1965 Pub. Papers 335](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=411) (Mar. 27, 1965). To check: [[w.eidenberg-act-of-congress]]. See [[cal.1965-01-12.school-aid]]. Names: Perkins, Powell.'
    tags: [name:perkins-carl-d, name:powell-adam-clayton-jr]
  - id: cal.1965-03-28.vietnam
    when: Mar. 28
    date: '1965-03-28'
    thread: vietnam
    c: 'Resolution of the Eleventh Plenum, after the Central Military Party Committee''s session of February: the North''s economy to a war footing, the standing army enlarged quickly, all the military aid to be had from the socialist countries sought; the South to keep the offensive and destroy the Saigon army''s regulars even as American troops arrive.'
    n: '[[w.vietnam-victory-in-vietnam]], 143–44, 155, 462 nn.1, 5; [[w.nguyen-hanois-war]], 75–76 (the plenum in March; the attacks to increase). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1963-12.vietnam]]. Check: Nguyen calls the March meeting the Eleventh Plenum (75) and a special session of the Tenth, Mar. 25–27 (76).'
  - id: cal.1965-03-30.vietnam
    when: Mar. 30
    date: '1965-03-30'
    thread: vietnam
    c: 'A car bomb outside the American embassy in Saigon: 2 Americans and 20 Vietnamese killed, nearly 200 wounded; U. Alexis Johnson, the chargé, cut. Apr. 1, Johnson asks $1 million for a new chancery; the House votes it Apr. 5, [378–0](https://voteview.com/rollcall/RH0890031).'
    n: '[FRUS 1964–68, II, doc. 221](https://history.state.gov/historicaldocuments/frus1964-68v02/d221). Statement by the President on the Bombing of the U.S. Embassy in Saigon, [1965 Pub. Papers 347](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=423) (Mar. 30, 1965). [[w.gibbons-u-s-government-and]], III, 196. To check: [[w.johnson-right-hand-of-power]]. See [[cal.1965-03-08.vietnam]]. Names: U. Alexis Johnson.'
    tags: [name:johnson-u-alexis, name:johnson-lyndon-b, place:saigon]
