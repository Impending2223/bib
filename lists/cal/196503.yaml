    date: '1965-03-29'
    thread: vietnam-force-levels
    c: 'McNamara, Taylor and the Joint Chiefs: defended enclaves on the coast, decided tentatively, forces to move inland once a logistic base is sure. Taylor: the plan''s two American divisions and one Korean "seemed high"; Quát not persuaded more troops needed; limits in the country''s "absorptive capacity" and in logistics. McNamara for the deployment, so conditioned, the Korean division for "domestic reaction"; Rolling Thunder to be stepped up; the aerial mining of Haiphong to be looked at again, perhaps "4 to 12 weeks out ahead."'
    n: '[[w.marolda-united-states-navy-and]], 532 (the enclaves); [[w.drea-mcnamara-clifford-and-the-2011]], 27 (Taylor to McNamara and the Chiefs: the three-division plan excessive; McNamara agrees, but for large reinforcements "as rapidly as possible" if need be); [[w.drea-mcnamara-clifford-and-the-2011]], 58 (Taylor for the gradual bombing; McNamara: mining Haiphong "politically feasible" in 4 to 12 weeks, the two bridges to China at about 12). [[w.gibbons-u-s-government-and]], III, 195 (the rest, from the report of the meeting). To check: Washington to Saigon 2131, Mar. 30, 1965 (Taylor to U. Alexis Johnson), NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 195 n.161). Names: McNamara, Taylor.'
