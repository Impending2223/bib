    c: 'Ways and Means in executive session on H.R. 1. Before it the administration''s hospital insurance, the AMA''s Eldercare, Byrnes''s Bettercare. Mills, in the afternoon, to Cohen: "Maybe it would be a good idea if we put all three of these bills together. You go back and work this out overnight." The three-layer cake.'
    n: 'Daily Digest, [111 Cong. Rec. D81](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=79) (Mar. 2, 1965). [[w.zelizer-taxing-america]], 239–42; [[w.zelizer-fierce-urgency-of-now]], 194–96 ("Maybe it would be a good idea if we put all three of these bills together"; the "three-layer-cake"); [[w.bernstein-guns-or-butter]], 171 (about 3 p.m.; Mills to Byrnes: "You know, John, I like that idea of yours"); [[w.dallek-flawed-giant]], 208 (the closed session, the afternoon of Mar. 2; Mills''s "three-layer cake"). To check: [[w.harris-sacred-trust]], 187–88; John Manley''s personal notes, Mar. 2, 1965, Manley Papers, LBJ Library; Cohen to O''Brien, Mar. 5, 1965, Cohen Papers; Mills, interview with Lewis E. Weeks, Aug. 13, 1980, Hospital Administration Oral History Collection, American Hospital Association; Myers, interview with Peter Corning, Mar. 8, 1967, Columbia Oral History (cited by [[w.zelizer-taxing-america]], 240–41 nn.124, 127–28); John Manley Interview Collection (JMIC), in Zelizer''s possession; also LBJ Library (cited by [[w.zelizer-taxing-america]], 240 n.124); Cohen to Johnson, March 2, 1965, WHCF, Legislation, box 75, file: LE/IS 1 3/1/65-5/31/65 (2 of 2), LBJ Library; [[w.johnson-vantage-point]], 215–16 (cited by [[w.dallek-flawed-giant]], 208 n.66). See [[cal.1965-01-07.medicare]]. Names: Mills, Byrnes, Cohen.'
