    c: 'Mao presides over the Politburo Standing Committee, Fujian Hall, afternoon, revising the People''s Daily and Red Flag article on the Moscow splitting meeting (the CPSU''s "consultative meeting" of Mar. 1–5 and its communiqué of Mar. 10). Beforehand he had read it, changed "small meeting" in the title to "meeting", and added that the Soviet leaders took over slogans and the U.S. took over Khrushchev''s: peaceful coexistence, competition, transition, détente, disarmament, two powers ruling the world, joint aid to India, joint help to reactionaries, joint use of the UN, joint anti-China.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 11, 1965. [[w.jianguo-yilai-mao-zedong]], XVIII, 29–33 (Mar. 11, 1965; Mao''s note of Mar. 11 to Kang Sheng, a few revisions to the article, to be considered for use; the title changed from "On the small meeting" to "On the Moscow splitting meeting"; the passage that the new leaders took over Khrushchev''s slogans and that U.S. imperialism took them over in turn, in his additions; the article printed Mar. 23; the volume does not say the Standing Committee met); [[w.deng-xiaoping-nianpu-1904]], III, 1850 (Mar. 11, 1965; afternoon, 下午; Deng at the Politburo Standing Committee meeting Mao presides over, on the CPSU''s meeting of communist and workers'' parties held at Moscow Mar. 1–5 and the plan to comment on it in the name of the editorial departments of the Renmin ribao and the Hongqi); [[w.peng-zhen-nianpu-1902]], IV, 405 (Mar. 11, 1965, afternoon; Peng Zhen sits in at Mao''s Standing Committee on the first draft of the editorial departments'' article on the Moscow splitting meeting: from Mar. 1 to 5 the new Soviet leaders held a "consultative meeting" of nineteen, only sixteen attending, the Albanian, Vietnamese, Indonesian, Chinese, Korean, Romanian and Japanese parties refusing; the article to expose a splitting meeting for a Khrushchev line without Khrushchev); [[w.khoo-collateral-damage]], 22 (Mao''s careful editing of the press statements against the Soviet conference, by documents printed in 1996; not the day). Made public: 2013. The article public: People''s Daily and Red Flag, Mar. 23, 1965, as "Comment on the March Moscow Meeting" (Check the date). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XI, 346–350, 394–395 (cited by [[w.khoo-collateral-damage]], 22 n.78a); [[w.xie-yixian-zhongguo-dangdai-waijiaoshi]], 241–242 (cited by [[w.khoo-collateral-damage]], 22 n.78b). Names: Mao Zedong, Khrushchev.'
