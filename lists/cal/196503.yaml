    thread: china-leadership
    c: 'The Secretariat: no more attacks on "capitalist roaders" at Peking University.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 428; [[w.deng-xiaoping-nianpu-1904]], III, 1849 (Mar. 3, 1965; afternoon, 下午; Deng presides at the Secretariat on the socialist education movement in cultural and educational departments; says the earlier work is to be affirmed for its gains and its faults pointed out; the weekly seven hours'' criticism of Feng Ding 冯定 (footnote 1: then professor of philosophy at Peking University) is to be stopped at once; the movement is to turn to carrying out teaching and rousing the staff''s drive; one cannot argue by class origin alone, Youth League members are to help those of bad origin serve socialism; the meeting also decides to set up the State Capital Construction Commission); [[w.peng-zhen-nianpu-1902]], IV, 403 (Mar. 3, 1965, afternoon; the Secretariat''s 393rd meeting; Peng Zhen there; half a year of socialist education in culture, education and thought; a State Capital Construction Commission set up; Peng Zhen: the Five-Man Group last September for the great questions, not class origin alone; the criticism in the arts of great effect, some leading figures criticized in theory; but men now hardly dare write articles or plays, Xinhua''s head office some days only four or five pieces, a warning; Guo Moruo, Wu Han and Fan Wenlan uneasy, basically good, always with us politically; national criticism by name only with the Center''s approval, some to be protected; scholarly errors open to discussion, beware those who climb by attacking others; works basically good enough, faults talked over in small meetings; criticism comradely, not one blow to make one''s name; cadres judged by their whole history; work teams to study first, not declare a place rotten; the "four clean-ups" dig capitalism''s roots but the Party basically good); [[w.dikotter-cultural-revolution]], 47 n.12 ("two months later," March 1965: Deng Xiaoping takes Peng Zhen''s side, condemning the Peking University work team for having gone too far; Kang Sheng criticized in all but name; more than sixty cadres accused of "anti-party" activities rehabilitated). Made public: 1983. To check: [[w.ba-zai-qincheng-meng]], 26–30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 428 n.154a); [[w.zhonghua-renmin-gongheguo-jiaoyu]], 370 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 428 n.154b); [[w.ping-reassessing-the-starting-point]], 71–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 428 n.154c); Informant U, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 428 n.154d). Check: Made public; whether [[w.zhonghua-renmin-gongheguo-jiaoyu]] (1983), the earliest of the note''s works, prints this act; else 1993 ([[w.ba-zai-qincheng-meng]]) (III, 428 n.154).'
