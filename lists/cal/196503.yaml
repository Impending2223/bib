    when: Mar. 7
    date: '1965-03-07'
    thread: opinion
    also: [school-aid]
    c: 'Gallup, Jan. 28–Feb. 2: the Federal Government to pay more of the public schools'' costs, 49 percent; the States and localities as now, 42. The money to public schools only, 41; to Catholic and other private schools as well, 51.'
    n: '[[w.gallup-poll]], III, 1928.'
  - id: cal.1965-03-08.vietnam
    when: Mar. 8
    date: '1965-03-08'
    thread: vietnam
    c: Two battalion landing teams of Marines come ashore at Đà Nẵng, the first American ground combat units in Vietnam; the mayor and General Thi, the corps commander, greet them. A third battalion and a helicopter squadron by Mar. 12. Their mission the security of the air base.
    n: '[FRUS 1964–68, II, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v02/d188). [[w.gibbons-u-s-government-and]], III, 124 (the landing, Mar. 8–9, 3,500 Marines; the base''s security); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 532 (the landing; the third team in four days; the air base); [[w.marolda-united-states-navy-and]], 526–30 (the mission; the landing, Mar. 8; the second battalion by air; the helicopters, Mar. 9). [[w.logevall-choosing-war]], 362–63 (the first American ground troops; the air base''s guard). To check: [[w.shulimson-u-s-marines-in]]; [[w.berman-planning-a-tragedy]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.kahin-intervention]]; [[w.berman-lyndon-johnsons-war]]; [[w.kaiser-american-tragedy]]; [[w.taylor-swords-and-plowshares]]; [[w.westmoreland-soldier-reports]]. See [[cal.1965-02-22.vietnam]]. Names: Nguyễn Chánh Thi.'
