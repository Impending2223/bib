    c: 'Selma to Montgomery. King leads some 3,200 out of Selma under the federalized Guard, Army troops, marshals, and the FBI; 300 through Lowndes County; thousands join for the last miles. Mar. 25, some 25,000 at the Capitol in Montgomery. King: "How long? Not long."'
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 108–09 (M.D. Ala. 1965) (the plan). Check the counts. [[w.garrow-bearing-the-cross]], 410–13; [[w.branch-at-canaans-edge]], 140–70 (not the counts at Selma and at the Capitol); [[w.mann-walls-of-jericho]], 467–68 (the march out of Selma under the federal troops; the Capitol); [[w.branch-pillar-of-fire]], 611 (Heschel on the march beside King: "I felt like I was praying with my feet"); [[w.zelizer-fierce-urgency-of-now]], 215; [[w.kotz-judgment-days]], 320–22 (3,200; Cager Lee, Jimmie Lee Jackson''s grandfather, in the first row; 1,800 Guardsmen, Army helicopters, Ramsey Clark by radio; 300 a day on the two-lane stretch through Lowndes County; seven miles the first day, the night at David Hall''s farm); [[w.bernstein-guns-or-butter]], 233–34 (the Army''s counts; 25,000 at the capitol); [[w.young-easy-burden]], 362–66; [[w.wofford-of-kennedys-and-kings]], 186–89 (the Guard federalized and regular troops under the President''s order; the march past the bridge; the 300 for Lowndes County; not the count). Check: Kotz gives more than thirty thousand on Mar. 25 (323). Check: Bernstein, 233, gives the Army''s count of 392 marchers leaving Selma, some 45 white. Check: Young, 363, counts thirty-five hundred at the start. To check: Int. Susannah Heschel, Nov. 15, 1990; Int. Sylvia Heschel, Feb. 4, 1991 (cited by [[w.branch-pillar-of-fire]], 611). See [[cal.1965-03-07.voting-rights]]; [[cal.1965-03-20.alabama]]. Check: Branch gives some three thousand leaving Selma (142), 308 through Lowndes County by the FBI''s count (146), and the FBI''s head count of some 12,000 leaving St. Jude on Mar. 25, more joining on the way (161). Names: King.'
