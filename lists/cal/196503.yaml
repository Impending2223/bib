    place: washington
    thread: voting-rights-selma
    also: [alabama]
    c: 'Johnson in his office with Moyers, Katzenbach, Ramsey Clark, Burke Marshall and Ellington of the Office of Emergency Preparedness, Vance consulted, on troops for the march: an "adequate" level, "if you haven''t enough you will wish you had"; "I want professionals there, not drugstore cowboys." Vance: a military police battalion near Selma, another near Birmingham, the Alabama Guard federalized, General Henry V. Graham to command. Katzenbach: the Governor must say he cannot keep order. Ellington telephones Wallace, who agrees to ask for federal help.'
    n: '[[w.bernstein-guns-or-butter]], 231–32 (by Valenti''s notes); [[w.goodwin-remembering-america]], 339–40 (the Oval Office, Mar. 18: "I want you to call Wallace ... tell him to ask for assistance. But make sure you put in enough troops ... I want professionals there, not drugstore cowboys"; Ellington places the call, Wallace to call back in six minutes; Johnson talks with him briefly; not those present, Vance''s plan, or Wallace''s agreement). To check: Valenti''s Notes, Meeting in the President''s Office, Mar. 18, 1965, Legislative Background, Voting Rights Act of 1965, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 232 n.5). Check: Bernstein''s text gives "late Tuesday afternoon" (Mar. 16); the note cites the notes of Mar. 18. See [[cal.1965-03-07.voting-rights]]. Names: Johnson, Moyers, Katzenbach, Ramsey Clark, Burke Marshall, Ellington, Vance, Wallace.'
