  - id: cal.1965-03-07.voting-rights
    when: Mar. 7
    date: '1965-03-07'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma. Some 650 set out from Brown Chapel to walk to Montgomery, Hosea Williams and John Lewis at the head. Beyond the Edmund Pettus Bridge, Lingo's state troopers, on a plan known to Wallace, and Sheriff Clark's mounted possemen break them up with clubs, tear gas, and nausea gas; 75 to 80 injured, Lewis's skull fractured. On television that night.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 104–05 (M.D. Ala. 1965) (the court''s findings). Film (K–J Cong. II.K). [[w.garrow-bearing-the-cross]], 395–99 (all but Lewis''s skull); [[w.dallek-flawed-giant]], 214–15. To check: [[w.garrow-protest-at-selma]]; [[w.lawson-black-ballots]]; [[w.may-bending-toward-justice]]; [[w.branch-at-canaans-edge]]; [[w.kotz-judgment-days]]; [[w.fairclough-to-redeem-the-soul]]; [[w.carson-in-struggle]]; [[w.carter-politics-of-rage-1995]]; [[w.lewis-walking-with-the-wind]]; [[w.reaching-for-glory]]; King, "Statement . . .," Mar. 7, 1965, King Papers, King Center; Selma Times-Journal, Mar. 8, 1965, 1 (cited by [[w.garrow-bearing-the-cross]], 397 n.40); New York Times, Mar. 8, 1965, 1; Washington Post, Mar. 8, 1965, A1; Cloud testimony, Mar. 16, 1965, trial transcript, 18, Williams v Wallace, M.D. Ala., trial record, Middle District of Alabama (cited by [[w.garrow-bearing-the-cross]], 399 n.41). See [[cal.1965-01-02.voting-rights]]; [[cal.1965-02-18.voting-rights]]. Check: Garrow, 397, gives some six hundred. Names: Williams, Lingo, Clark, Lewis, Wallace. Check: Dallek gives 600 marchers, seventeen hospitalized and forty treated (215).'
