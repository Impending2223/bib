  - id: cal.1965-03-19.china-leadership-5
    when: Mar. 19
    date: '1965-03-19'
    thread: china-leadership
    also: [china, middle-east]
    c: 'Liu Shaoqi receives a Syrian friendly delegation to China headed by its Foreign Minister. On the exchange of experience between the two countries he says: China has positive and negative experience, and in talking with them it must give the negative, the errors it has committed; some Chinese comrades will not tell foreign friends their faults and the backward things, which is wrong; they should treat foreign friends sincerely, tell both achievements and mistakes, and arrange visits to advanced and to backward units. On the basis of policy-making he says: policy is decided by the will of the great majority; a party or government must have the support of the great majority to be firm; a policy is judged good or bad, right or wrong, by whether it meets the greatest interest of the great majority; what serves the people''s greatest interest is done, what harms it is not. Within the people there are differing views, some for temporary interest and not long-term, some for the few and not the many, some for local interest and not the whole; these are not to be met with force but with persuasion, saying it as often as needed; the central question is to win the hearts of the great majority and develop and organize their enthusiasm to build socialism.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 616 (Mar. 19, 1965). Made public: 1996. Names: Liu Shaoqi. Check: the Foreign Minister''s name, read from 哈桑·穆维德; the Latin form is not settled.'
    tags: [polity:prc, polity:syria, name:liu-shaoqi, vis:only:prc+syria@B-K]
  - id: cal.1965-03-19.china-leadership-6
    when: Mar. 19
    date: '1965-03-19'
    place: wuhan
    thread: china-leadership
    also: [soviet-union]
    c: 'Wuchang, the East Lake villa. Mao, at his call, meets foreign experts and Asian parties'' delegates brought from Peking by the Liaison Department: Epstein, Frank Coe, Sol Adler. Three questions: is the article on the Moscow meeting needed, is it dangerous, what is wrong in it. Epstein: needed, the March meeting wants an answer and many have illusions about the new CPSU leaders; some guests fear it too sharp, others say the illusions are the reason. Mao: sharp words may be softened, the tone stays; no loud campaign yet, only what the new leaders have done. The guests would have more on unity; Mao has Zhao Yimin, who came with them, take this back to Peking.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17–19, 1965 (Mar. 19: Adler would stress unity and the anti-imperialist, anti-U.S. camp; Mao: both worth noting). [[w.lengxi-shinian-lunzhan-1956-1966]], 923–926 (Mar. 19; Coe''s "horse meat sold as steak" for "hanging a sheep''s head, selling dog meat"; Zhao Yimin, deputy head of the Liaison Department). Made public: 1999. See [[cal.1965-03-17.china-leadership]]. Names: Mao Zedong.'
