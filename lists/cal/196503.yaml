  - id: cal.1965-03-01.vietnam-congress
    when: Mar. 1
    date: '1965-03-01'
    thread: vietnam-congress
    c: 'Senate. Proxmire: "I wholeheartedly support the President''s policy"; Javits commends him. Harris (D-Okla.) joins him: "unless we are willing, now, to take the risks involved ... in drawing the line in South Vietnam, we shall have to draw it somewhere. I, for one, would like to see it drawn in South Vietnam, rather than in Thailand, in Malaysia, in the Philippines, in Hawaii, or in San Francisco and Seattle."'
    n: '[111 Cong. Rec. 3778, 3783](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf) (1965) (Senate, Mar. 1, 1965). [[w.moyar-triumph-forsaken]], 355 n.23, 487 (Harris). To check: Congressional Record, vol. 111, 3783 (cited by [[w.moyar-triumph-forsaken]], 355 n.23). Names: Proxmire, Javits, Harris.'
    src:
      c: cd6c8015
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf: all'
        - 'w.moyar-triumph-forsaken 355, 487: B'
        - 'via w.moyar-triumph-forsaken 355 n.23b: B'
    tags: [name:proxmire-william, name:javits-jacob-k, name:harris-fred-r]
  - id: cal.1965-03-01.school-aid
    when: Mar. 1
    date: '1965-03-01'
    time: 1965-03-01T22:40Z
    thread: school-aid
    c: 'Johnson to the National Conference on Educational Legislation at the White House, 6:10 p.m.: the bill "can be improved"; the first train from Fredericksburg: "they will never get her started, and if they do they will never get her stopped."'
    n: 'Remarks Before the National Conference on Educational Legislation, [1965 Pub. Papers 226](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=302) (Mar. 1, 1965). [[w.mcpherson-political-education]], 249–50 (the remarks, mostly extemporaneous; to send the educators to the Capitol to lobby); [[w.white-making-of-the-president-1965]], 399–400 (his teacher, to come to the inauguration; the old fights, wet or dry). See [[cal.1965-01-12.school-aid]]. Names: Johnson. Check: the Public Papers give 5:40 p.m. (1965 Pub. Papers 226, its note).'
    src:
      c: 093c381f
      rows:
