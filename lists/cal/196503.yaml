  - id: cal.1965-03-17.voting-rights
    when: Mar. 17
    date: '1965-03-17'
    thread: voting-rights
    c: 'The voting bill sent to Congress. Celler introduces it, H.R. 6400; Mar. 18, Mansfield for himself, Dirksen, and 64 others, S. 1564. Where a literacy or like test was used and fewer than half of those of voting age were registered on Nov. 1, 1964, or voted that November, tests suspended and federal examiners to list voters. Mar. 18, the Senate sends it to Judiciary with orders to report by Apr. 9, [67–13](https://voteview.com/rollcall/RS0890032). Stennis: "a pitiful thing"; Eastland: "opposed to every word and every line in the bill."'
