    place: moscow
    thread: soviet-union-leadership
    c: The plenum of the Central Committee on agriculture. Brezhnev, without naming Khrushchev, attacks the "great shortcomings and mistakes" in the management of agriculture. Farms to be paid enough to cover costs and pay wages; decisions on profitability, not "subjectivism"; more tractors and repair shops, the harvest in twenty days. No more charlatans, campaigns or coercion. Prices of consumer goods in the country to match the cities'. In closing, Mar. 26, he warns that the line on aligning farmers' and workers' living standards must be explained with care.
    n: '[[w.schattenberg-brezhnev]], 211–12 (the speech, nn.68–74), 212 (the closing words, n.75). [[w.khoo-collateral-damage]], 25 (the joint communiqué of Feb. 10 approved by the Central Committee on Mar. 26, taken by the Soviets as a serious military commitment to Hanoi). To check: RGANI, f. 2, op. 1, d. 780 (stenogram of the first and second sessions, Mar. 24, 1965), l. 6–54; d. 782 (fifth session), l. 75 f.; d. 785 (fifth session, Mar. 26, 1965), l. 110 (cited by [[w.schattenberg-brezhnev]], 211–12 nn.68–75, 175 n.29); [[w.pike-vietnam-and-the-soviet]], 77–78 (cited by [[w.khoo-collateral-damage]], 25 n.101). Names: Brezhnev, Khrushchev.'
