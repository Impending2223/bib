    also: [soviet-union]
    c: 'The *Renmin ribao* and *Hongqi* editorial departments print "Comment on the March Moscow Meeting," in four sections: a splitting meeting, patched together; what the new CPSU leaders have done, "three false, three true"; replies on the polemic, on "factional activity," on the conference; unite on the road of Marxism-Leninism and revolution. Five conditions for unity: declare all orders for splitting meetings wrong and illegal; admit Khrushchevism, great-power chauvinism and splitting wrong; admit the line and program of the 20th and 22nd Congresses wrong; admit the attacks on China, Albania, Japan and other parties wrong; promise not to repeat them. A conference needs at least twice the preparation, the "four or five years" now longer.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 927–931 (Mar. 23; the four sections; the five conditions, which Mao had kept out of the replies of July 28 and Aug. 30, 1964, as near an ultimatum, 931; the plate, 932; the meeting a dividing line, the relation "ruptured and not broken," 931). See [[cal.1965-03-11.china-leadership]].'
    src:
