  - id: cal.1965-03-01.legislatures-ks
    when: Mar. 1
    date: '1965-03-01'
    thread: legislatures
    c: 'Kansas Supreme Court, *Harris v. Anderson*: the House''s apportionment, one member to every county under the State constitution, void after *Reynolds v. Sims*; the legislature to reapportion before 1966. Three justices dissent.'
    n: '*Harris v. Anderson*, [194 Kan. 302](https://static.case.law/kan/194/case-pdfs/0302-01.pdf), 400 P.2d 25 (1965). *Long v. Avery*, [251 F. Supp. 541](https://static.case.law/f-supp/251/case-pdfs/0541-01.pdf) (D. Kan. 1965). See [[cal.1963-12-05.legislatures-ks]]; [[cal.1964-06-15.court]].'
    tags: [state:ks]
  - id: cal.1965-03-01.vietnam-congress
    when: Mar. 1
    date: '1965-03-01'
    thread: vietnam-congress
    c: 'Senate. Proxmire: "I wholeheartedly support the President''s policy"; Javits commends him. Harris (D-Okla.) joins him: "unless we are willing, now, to take the risks involved ... in drawing the line in South Vietnam, we shall have to draw it somewhere. I, for one, would like to see it drawn in South Vietnam, rather than in Thailand, in Malaysia, in the Philippines, in Hawaii, or in San Francisco and Seattle."'
    n: '[111 Cong. Rec. 3778, 3783](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf) (Senate, Mar. 1, 1965). [[w.moyar-triumph-forsaken]], 355 n.23, 487 (Harris). To check: Congressional Record, vol. 111, 3783 (cited by [[w.moyar-triumph-forsaken]], 355 n.23). Names: Proxmire, Javits, Harris.'
    src:
      c: cd6c8015
      rows:
