  - id: cal.1965-03-06.vietnam-2
    when: Mar. 6
    date: '1965-03-06'
    place: saigon
    thread: vietnam-macv
    c: 'Westmoreland to Wheeler, MAC 1190, answering his question of Mar. 4: the Viet Cong hold the initiative throughout the South; the security situation in I and II Corps "steadily deteriorating since mid-1964," Bình Định near a critical point. The forecast for six months, on present courses: the government''s forces driven into isolated strongholds; by Westmoreland''s quotation of his evaluation, "a series of islands of strength clustered around district and province capitals," and a Viet Cong takeover probably within a year.'
    n: '[FRUS 1964–68, II, doc. 182](https://history.state.gov/historicaldocuments/frus1964-68v02/d182). [[w.westmoreland-soldier-reports]], 122 (the forecast); [[w.macv-command-history-1965]], 37–38 (Westmoreland''s answer to the JCS: the Viet Cong hold the initiative; in six months the South''s forces clustered about the cities, "end the war" groups; his recommendations: all available tactical air, coastal surveillance, a MEB to Đà Nẵng). Check: that the evaluation Westmoreland quotes, of early March, is this message (FRUS prints it in part). Names: Westmoreland, Wheeler.'
