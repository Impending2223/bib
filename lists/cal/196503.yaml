  - id: cal.1965-03-02.vietnam
    when: Mar. 2
    date: '1965-03-02'
    time: 1965-03-02T07:47Z
    thread: vietnam
    c: 'Rolling Thunder begins: 104 American and 19 South Vietnamese aircraft against the Xóm Bàng ammunition depot, just north of the demilitarized zone, and the Quảng Khê naval base. Six American aircraft lost, five pilots rescued; no announcement in Washington or Saigon. The same day General Harold K. Johnson, the Army''s chief of staff, ordered to Saigon to find what more can be done in the South: "no limitation on funds, equipment or personnel."'
    n: 'FRUS 1964–68, II, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v02/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v02/d176), [178](https://history.state.gov/historicaldocuments/frus1964-68v02/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v02/d179). [[w.staaveren-gradual-failure]], 84 (the targets; the losses); [[w.gibbons-u-s-government-and]], III, 115 (the first strikes, Mar. 2, set for Feb. 26); [[w.frankum-like-rolling-thunder]], 21 (the first strike, Xóm Bàng and Quảng Khê; no announcement); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 531 (the first strike; the losses); [[w.cosmas-joint-chiefs-of-staff-2012]], 241 (General Johnson''s mission); [[w.marolda-united-states-navy-and]], 505 (the targets; the losses); [[w.branch-at-canaans-edge]], 23–24 (the American aircraft and the six lost; no announcement); [[w.westmoreland-soldier-reports]], 118 (the campaign begins Mar. 2); [[w.mcnamara-in-retrospect]], ch. 7 at n.8 ("over 100 aircraft" against an ammunition depot; no announcement). [[w.bernstein-guns-or-butter]], 345 (Rolling Thunder in March); [[w.cosmas-joint-chiefs-of-staff-2012]], 227 (the strike on schedule; one VNAF plane and five Air Force jets lost); [[w.drea-mcnamara-clifford-and-the-2011]], 23 (the first strikes Mar. 2, after four cancellations; the same day, Johnson directs the group under General Johnson to Saigon); [[w.drea-mcnamara-clifford-and-the-2011]], 57 (Rolling Thunder 5, two targets, six aircraft lost); [[w.taylor-swords-and-plowshares]], 337 (the start, Mar. 2; an ammunition depot and a naval base north of the 17th parallel); [[w.zaroulis-who-spoke-up]], 36 (Mar. 2, Operation Rolling Thunder goes into effect; sustained bombing, unlike Flaming Dart I and II); [[w.mann-grand-delusion]], 408 (Mar. 2: 104 U.S. Air Force B-57s, F-100s and F-105s with 19 South Vietnamese Skyraiders against the Xóm Bàng ammunition depot and the Quảng Khê naval base; six U.S. planes downed; no public announcement in Washington); [[w.lich-su-khang-chien-chong-my]], III, 406–07 (Mar. 2: 164 aircraft at 2:47 p.m. against the naval base on the Gianh River; seven aircraft, A4s and F8s, shot down); [[w.khoo-collateral-damage]], 25 (Rolling Thunder begins, Mar. 2). Check: Taylor gives 160 American and South Vietnamese planes ([[w.taylor-swords-and-plowshares]], 337). Check: the clock: the history''s 2:47 p.m. for the raid on the Gianh River base (III, 406), taken as Hanoi''s. To check: [[w.thompson-rolling-thunder]]; [[w.clodfelter-limits-of-air-power]]; Msg, JCS to CINCPAC, 011840Z Mar 65 (cited by [[w.staaveren-gradual-failure]], 84 n.45); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, May 64–5 Apr 65, Vol I, pp 4-1 to 4-2 (cited by [[w.staaveren-gradual-failure]], 84 n.46a); Project CHECO, Rolling Thunder, p 22 (cited by [[w.staaveren-gradual-failure]], 84 n.46b); Msg, COMUSMACV to CINCPAC, JCS, 041120Z Mar 65 (cited by [[w.staaveren-gradual-failure]], 84 n.48a); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, 26 Mar 65, Vol I, pp 4-1 to 4-2 (cited by [[w.staaveren-gradual-failure]], 84 n.48b); Rolling Thunder: Personal Notebook on Significant Events, by Gen John P. McConnell, CSAF, item 33 (cited by [[w.staaveren-gradual-failure]], 84 n.48c); [[w.karnow-vietnam]], 414–416 (cited by [[w.khoo-collateral-damage]], 25 n.100). See [[cal.1965-02-07.vietnam]]; [[cal.1965-02-13.vietnam]]. Frankum, 21, gives 160 aircraft, the 104 American among them, and six damaged; FRUS''s editors, 104 American and 19 South Vietnamese (doc. 175). Names: Harold K. Johnson. Check: Kaplan gives five American and one South Vietnamese aircraft lost (531). Check: Marolda, 505, gives one South Vietnamese and five Air Force planes shot down, three pilots rescued. Check: Van Staaveren, 84, gives five Air Force aircraft lost, three F-105s and two F-100s, and all airmen but one rescued; and, 85, officials in Saigon giving the strike''s purpose.'
