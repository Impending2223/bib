        - 'via w.moyar-triumph-forsaken 355 n.23b: B'
    tags: [name:proxmire-william, name:javits-jacob-k, name:harris-fred-r]
  - id: cal.1965-03-01.school-aid
    when: Mar. 1
    date: '1965-03-01'
    thread: school-aid
    c: 'Johnson to the National Conference on Educational Legislation at the White House, 6:10 p.m.: the bill "can be improved"; the first train from Fredericksburg: "they will never get her started, and if they do they will never get her stopped."'
    n: 'Remarks Before the National Conference on Educational Legislation, [1965 Pub. Papers 226](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=302) (Mar. 1, 1965). [[w.mcpherson-political-education]], 249–50 (the remarks, mostly extemporaneous; to send the educators to the Capitol to lobby). See [[cal.1965-01-12.school-aid]]. Names: Johnson.'
