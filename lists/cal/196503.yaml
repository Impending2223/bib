    c: 'Kansas Supreme Court, *Harris v. Anderson*: the House''s apportionment, one member to every county under the State constitution, void after *Reynolds v. Sims*; the legislature to reapportion before 1966. Three justices dissent.'
    n: '*Harris v. Anderson*, [194 Kan. 302](https://static.case.law/kan/194/case-pdfs/0302-01.pdf), 400 P.2d 25 (1965). *Long v. Avery*, [251 F. Supp. 541](https://static.case.law/f-supp/251/case-pdfs/0541-01.pdf) (D. Kan. 1965). [[w.peirce-great-plains-states-of]], 237 (Harris''s second suit, 1965; the court for him on the one-member-a-county rule). See [[cal.1963-12-05.legislatures-ks]]; [[cal.1964-06-15.court]].'
