    c: 'Zhou flies from Tirana to Algiers; first talk with Ben Bella in the afternoon. The Vietnam question is wholly the U.S.''s mess: by the Geneva Agreements of 1954 France was to leave and North and South to unite peacefully two years later; the American invasion stopped it.'
    n: '"[Cable from the Chinese Delegation in Algeria to the Foreign Ministry, ''Main Points of Conversation with Ben Bella ''](https://digitalarchive.umd.edu/document/165404)" (Mar. 30, 1965), PRC FMA 203-00651-03, 99–101, trans. Stephen Mercado, Wilson Center Digital Archive (Foreign Ministry telegram received, extra urgent, from the Algeria desk, incoming (65) Mao No. 60; the delegation''s cable is dated Mar. 31, with authority to issue Apr. 1, and reports the conversation of the afternoon of Mar. 30. Ben Bella on Africa since the second non-aligned conference: American escalation in the Congo, Algeria''s 12,000 to 13,000 arms sent through Sudan, Algeria''s need of Soviet and Chinese aid, a new accord with France to replace Evian, due in May, and the Asian-African Conference still set for June 29. It says Zhou spoke on Southeast Asia, explained the Vietnam issue, exposed the "peace talks" plot and set out China''s position on the United Nations). [[w.zhou-enlai-nianpu-1949]], II, 722 (Mar. 30, 1965); [[w.zhou-enlai-waijiao-huodong]], 444 (Mar. 30, 1965; morning, by special plane from Tirana, Hoxha, Shehu and Lleshi seeing him off; 11:50 a.m., arrival at Algiers, welcomed by Ben Bella; 3:30 p.m., Jolie Villa (约丽别墅), the first talks; the book also has Zhou on an "unconditional ceasefire" as a demand that the North stop aiding the South); [[w.zhonghua-renmin-gongheguo-waijiao]], 16 (Mar. 30–31, 1965; Zhou''s visit to Algeria; talks with Ben Bella); [[w.77-conversations-between-chinese]], [76](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=74) (doc. 5; Algiers, Mar. 30, 1965, no hour: Zhou to Ben Bella on the American invasion hindering the unification Geneva set for two years after 1954, and the ''unconditional cease-fire'' as a demand that the South stop its armed struggle and the North its support). [[w.friedman-shadow-cold-war]], 138 (Zhou''s visit of March: he presses Ben Bella to drop his call for peace talks in Vietnam and back the DRV and the NLF, with some success, by the embassy''s report of May 11, 1965). Made public: 1993. To check: PRC embassy Algeria to MFA, May 11, 1965, CFMA doc. 109-03645-02, 5–6 (cited by [[w.friedman-shadow-cold-war]], 138 n.177). Names: Zhou Enlai, Ben Bella.'
