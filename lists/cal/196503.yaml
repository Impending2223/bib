  - id: cal.1965-03-01.soviet-union
    when: Mar. 1–5
    date: '1965-03-01'
    place: moscow
    thread: soviet-union
    also: [china-leadership]
    c: 'Moscow. The CPSU holds what it now calls a "consultative meeting" of the communist and workers'' parties, Mar. 1 to 5. Present: 16 parties'' delegates and observers, split-offs from Brazil and Australia, and the Dange group of the Indian party, 19 in all. Seven parties refuse: Albania, Vietnam, Indonesia, China, Korea, Romania, Japan, five of them governing parties.'
    n: '"[Transcript of Conversations Between the Romanian Delegation Led by First Secretary of the C.C. of the R.W.P., Nicolae Ceausescu, and the Chinese Delegation, Led by Premier of the Council of State of the Chinese P.R., Zhou Enlai](https://digitalarchive.umd.edu/document/122552)" (Mar. 25, 1965), Document 252 in Romulus Ioan Budura, Politica independenţă a României şi relaţiile Româno-Chineze, 1954–1975: Documente, Bucharest, The National Archives, 2008 and Relaţiile Româno-Chineze, 1880–1974: Documente, Bucharest, Romanian Foreign Ministry and The National Archives, 2005, p. 690–714; ANR, fond C.C. al P.C.R. – Secţia Cancelarie, dosar nr. 39/1965, f. 53–86, Wilson Center Digital Archive. Ceaușescu to Zhou: Romania had given its position on the meeting in a letter to the parties, that it did not serve the movement''s unity. [[w.lengxi-shinian-lunzhan-1956-1966]], 921–922 (Mar. 1–5; "16 parties'' delegates and observers," the 19 "units"; the seven refusals); [[w.yang-shangkun-riji]], II, 516–517 (Mar. 1, 1965; Moscow''s "consultative meeting" 协商会议 opens that day, said to last three days, with a communiqué and an appeal for unity; the editors'' note: Mar. 1 to 5, the "appeal of the seventeen countries" after it); [[w.friedman-shadow-cold-war]], 126 (nineteen parties at the "consultative meeting," March 1965, in place of the editorial commission; the Romanian, British and Italian parties hesitant; the Vietnamese and Koreans refuse; a statement calling for "active support of liberation movements"; Suslov reports it to the plenum of Mar. 26); [[w.khoo-collateral-damage]], 26 (the consultative meeting of Mar. 1, nineteen parties, opposed by the Chinese; the Vietnamese not attending). To check: Speech of Suslov at Communist Party plenum, March 26, 1965, RGANI f.2 o.1 d.782, 89 (cited by [[w.friedman-shadow-cold-war]], 126 n.107); [[w.zagoria-vietnam-triangle]], 140 (cited by [[w.khoo-collateral-damage]], 26 n.109).'
