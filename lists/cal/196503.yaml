    c: 'Johnson to Katzenbach by telephone, after Joseph Alsop and James Reston complained to him of being tapped: "have I ever asked you or suggested to you that you tap a line?" Taps "brought to an irreducible minimum, and only in the gravest cases"; "I''m against wiretapping, period." Katzenbach: he authorizes every FBI tap, King''s "the furthest out"; the FBI''s microphones, planted by trespass, he learned of only lately, and will bring under the same approval.'
