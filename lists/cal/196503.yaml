    short: Powell's absence
  - id: cal.1965-03-01.school-aid-3
    when: Mar. 1
    date: '1965-03-01'
    thread: school-aid
    c: 'Monday morning. Edith Green, back from Florida, before Education and Labor: "for a delay of several weeks," by O''Brien. She works with the Republicans on a substitute; tells Protestant leaders the bill would "put Catholic priests in the public schools."'
    n: '[[w.bernstein-guns-or-butter]], 195–96; [[w.graham-uncertain-triumph]], 242 n.56. Check: the days of her meetings. Check: O''Brien''s memorandum of Mar. 8, as Graham quotes it (242 n.56): "on Monday in caucus and Tuesday in committee.". To check: O''Brien to Johnson, Mar. 8, 1965, EX LE/FA 2, container 38, LBJ Library (cited by [[w.graham-uncertain-triumph]], 242 n.56c). See [[cal.1965-02-26.school-aid]]. Names: Green, O''Brien.'
    src:
