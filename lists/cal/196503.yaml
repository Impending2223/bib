  - id: cal.1965-03-15.voting-rights-11
    when: Mar. 15
    date: '1965-03-15'
    place: washington
    thread: voting-rights
    c: 'The mansion, Johnson''s bedroom, at his waking. Asked how Goodwin is coming with the address to Congress, Valenti says he assigned it, at Sunday''s meeting, to Busby. Johnson: "The hell you did. Don''t you know a liberal Jew has his hand on the pulse of America? And you assign the most important speech of my life to a Texas public relations man? Get Dick to do it. And now!" By Moyers''s account to Goodwin that evening.'
    n: '[[w.goodwin-remembering-america]], 326–27 (Goodwin''s account). See [[cal.1965-03-14.voting-rights-2]]. Names: Johnson, Valenti, Goodwin, Busby, Moyers.'
    tags: [name:johnson-lyndon-b, name:valenti-jack, name:goodwin-richard-n, name:busby-horace, name:moyers-bill]
  - id: cal.1965-03-15.voting-rights-12
    when: Mar. 15
    date: '1965-03-15'
    place: washington
    thread: voting-rights
    c: 'The White House, 9:30 a.m. Valenti, waiting at Goodwin''s office door: "Good morning, Dick, the president''s speaking to Congress tonight. ... He needs a speech from you right away." "We''ll need it by the middle of the afternoon to put it on the TelePrompTers." Goodwin writes undisturbed, each page carried to the President as it is typed; the last page done at 6 p.m., "almost eight hours." Too late for the TelePrompTers: the address is read from a typed text.'
    n: '[[w.goodwin-remembering-america]], 325–30 (Goodwin''s account). See [[cal.1965-03-15.voting-rights-11]]. Names: Valenti, Goodwin, Johnson.'
    tags: [name:valenti-jack, name:goodwin-richard-n, name:johnson-lyndon-b]
    time_range:
      - 1965-03-15T14:30Z
      - 1965-03-15T23:00Z
    time_zone: America/New_York
  - id: cal.1965-03-15.voting-rights-13
    when: Mar. 15
    date: '1965-03-15'
    time: 1965-03-15T20:00Z
    time_approx: true
    thread: voting-rights
    c: 'About 3 p.m. Johnson to Goodwin by telephone, his one call of the day: "You remember, Dick, that one of my first jobs after college was teaching young Mexican-Americans down in Cotulla. I told you about it down at the ranch. I thought you might want to put in a reference to that." Goodwin: "Yes, Mr. President." Johnson: "I just wanted to remind you."'
    n: '[[w.goodwin-remembering-america]], 329 (Goodwin''s account). See [[cal.1965-03-15.voting-rights-12]]. Names: Johnson, Goodwin.'
    tags: [name:johnson-lyndon-b, name:goodwin-richard-n]
  - id: cal.1965-03-15.voting-rights-14
    when: Mar. 15
    date: '1965-03-15'
    thread: voting-rights
    c: 'The limousine back from the Capitol after the address. Johnson: "Well, Jack, how did I do?" Valenti, from a notebook: "The total delivery time was forty-five minutes, twenty seconds. You spoke for thirty-six minutes and forty seconds, and applause took eight minutes and forty seconds. Your rate of delivery was 96.35 words per minute, and there were thirty-six interruptions for applause." Goodwin: "Thirty-seven, Jack, I counted thirty-seven interruptions"; at the President''s glare at Valenti, "Just kidding."'
    n: '[[w.goodwin-remembering-america]], 336–37 (Goodwin''s account). See [[cal.1965-03-15.voting-rights]]. Names: Johnson, Valenti, Goodwin.'
    tags: [name:johnson-lyndon-b, name:valenti-jack, name:goodwin-richard-n]
