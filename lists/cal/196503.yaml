  - id: cal.1965-03-03.economy
    when: Mar. 3
    date: '1965-03-03'
    thread: economy
    c: 'Act ending the gold reserve against Federal Reserve deposits signed, [79 Stat. 5](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg5.pdf): the Reserve Banks'' 25 percent in gold certificates against their deposits repealed; the 25 percent against Federal Reserve notes kept. The House passed it Feb. 9, the Senate Feb. 18.'
    n: 'H.R. 3818, 89th Cong. To check: [[w.solomon-international-monetary-system-1945]]. See [[cal.1965-02-09.economy]].'
    tags: [name:johnson-lyndon-b]
