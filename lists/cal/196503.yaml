    c: 'King, from Atlanta, about noon: if Sunday''s marchers are stopped they will "lie down in the road" and seek federal relief. Wallace, at a news conference at four: "There will be no march between Selma and Montgomery"; Lingo to "take whatever steps necessary." Smitherman: "Negroes should not be permitted to make this senseless march."'
