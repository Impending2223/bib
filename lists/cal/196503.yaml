    also: [south-asia]
    c: 'Zhou, with Liu Shaoqi, has talks with President Ayub Khan, visiting Mar. 2–9. Mar. 5: in the two countries'' Third Plan periods China will keep giving aid beyond the $60 million given, interest-free, repayment indefinitely extendable, some surely free, a gift without conditions; an international duty, a new principle: no exploiting or robbing others. Mar. 5, Building 18, Diaoyutai guesthouse, when Ayub speaks of Pakistan''s lack of an industrial base: China had none either, Chiang leaving some tens of thousands of tons of steel and a hundred thousand tons of oil, almost no machine-building, and the Soviet Union taking away what Japan built in the Northeast. China thanks the Soviet Union for 165 projects under Stalin, paid for with interest, and Khrushchev too, who wrecked all the agreements in 1960 and so forced China to do everything itself.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 715 (Mar. 2–5, 1965); [[w.zhou-enlai-waijiao-huodong]], 439 (Mar. 4, 1965; afternoon; Zhou and Liu Shaoqi continue the talks with Ayub Khan; the book gives no content); [[w.zhou-enlai-waijiao-huodong]], 439 (Mar. 5, 1965; 9:30 a.m., Building 18, Diaoyutai guesthouse); [[w.zhou-enlai-waijiao-huodong]], 438 (Mar. 2, 1965; evening; Zhou and Liu Shaoqi meet President Ayub Khan); [[w.zhou-enlai-waijiao-huodong]], 438 (Mar. 3, 1965; afternoon; Zhou and Liu Shaoqi return President Ayub Khan''s call at the guesthouse and hold talks); [[w.zhonghua-renmin-gongheguo-waijiao]], 11 (Mar. 2–9, 1965; Ayub Khan''s visit, Mar. 2–9; Liu and Zhou hold talks); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 615 (Mar. 2, 3 and 4, 1965; Liu receives Mohammad Ayub Khan, President of Pakistan, and Foreign Minister Zulfikar Ali Bhutto, Mar. 2, and holds talks with them Mar. 3 and 4); [[w.macfarquhar-origins-of-the-cultural]], III, 374 (Ayub Khan in Beijing, Mar. 2–9, 1965, makes remarks about Vietnam; the book has Johnson postpone his visit to Washington on that account); [[w.peng-zhen-nianpu-1902]], IV, 402 (Mar. 2, 1965, evening; Peng Zhen accompanies Liu Shaoqi in meeting President Ayub Khan of Pakistan); [[w.chen-yi-nianpu]], 1087 (Mar. 3, 1965, afternoon; Liu Shaoqi returns Ayub Khan''s call at the guesthouse and holds talks, Chen Yi taking part). Made public: 1993. To check: [[w.mcmahon-cold-war-on-the]], 318–24 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.175a); [[w.barnds-india-pakistan-and-the]], 196–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.175b); [[w.goodwin-remembering-america]], 394–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.175c); [[w.gauhar-ayub-khan]], 289–91 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 374 n.175d). Names: Zhou Enlai, Liu Shaoqi, Ayub Khan, Chiang Kai-shek, Stalin, Khrushchev.'
