    also: [soviet-union]
    c: 'Rusk before the House Subcommittee on the Far East and the Pacific: little talk with the Soviet leaders about the Chinese; he is "quite convinced" that "the Russians as Russians are concerned about the prospect of living next to a billion Chinese armed with nuclear weapons"; China must be forced the way the Russians have gone. In a passage then deleted: "If I were a Communist, I would be a Peiping Communist."'
