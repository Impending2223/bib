  - id: cal.1965-03-29.vietnam-diplomacy
    when: Mar. 29
    date: '1965-03-29'
    thread: vietnam-diplomacy
    c: 'Valenti to Johnson, "Lower Mekong Basin": the project of Cambodia, Laos, Thailand and South Vietnam since 1957, under the UN Economic Commission for Asia and the Far East; more than $14 million spent; the American share less than four days of military aid in South Vietnam; the North Vietnamese and Chinese have raised no objection; "the one focus to which all the nations, including the North Vietnamese could be drawn." Johnson writes at the top: "Get this to Goodwin this a.m." Goodwin is drafting the Johns Hopkins speech.'
    n: '[[w.valenti-very-human-president]], 214–18 (Valenti''s account; the memorandum printed; within the hour, he says, Johnson questioned him, within another telephoned Rusk, McNamara and Eugene Black, and "before the day was ended" had the Mekong in the speech, given Apr. 7). Names: Valenti, Johnson, Goodwin.'
