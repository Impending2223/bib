        - 'via w.staaveren-gradual-failure 84 n.46b: A'
        - 'via w.staaveren-gradual-failure 84 n.48a: B'
        - 'via w.staaveren-gradual-failure 84 n.48b: B'
        - 'via w.staaveren-gradual-failure 84 n.48c: B'
