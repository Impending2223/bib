  - id: cal.1965-03-02.vietnam-2
    when: Mar. 2
    date: '1965-03-02'
    thread: vietnam
    c: 'Breakfast at the White House, 8:25 a.m., Johnson with McNamara, Rusk, Vance and General Harold K. Johnson. To the general, by Halberstam''s account: "You generals have all been educated at the taxpayers'' expense, and you''re not giving me any ideas and any solutions for this damn little pissant country"; "I want some solutions. I want some answers."'
    n: '[FRUS 1964–68, II, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v02/d178), n. 2 (the breakfast, from the Daily Diary). [[w.mann-grand-delusion]], 416 (the words; the day). [[w.westmoreland-soldier-reports]], 125 (the breakfast in the family quarters; by Westmoreland''s account, Johnson to the general in the elevator after it: "You get things bubbling, General"). Check: whether the words were said at the breakfast; FRUS has found no other record of the meeting. To check: [[w.halberstam-best-and-the-brightest]], 564 (cited by [[w.mann-grand-delusion]], 416 n.1). See [[cal.1965-03-02.vietnam]]. Names: McNamara, Rusk, Vance, Harold K. Johnson, Halberstam.'
    src:
