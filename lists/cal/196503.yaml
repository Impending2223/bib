  - id: cal.1965-03-01.vietnam-congress
    when: Mar. 1
    date: '1965-03-01'
    place: washington
    thread: vietnam-congress
    c: 'Senate. Proxmire: "I wholeheartedly support the President''s policy"; Javits commends him. Harris (D-Okla.) joins him: "unless we are willing, now, to take the risks involved ... in drawing the line in South Vietnam, we shall have to draw it somewhere. I, for one, would like to see it drawn in South Vietnam, rather than in Thailand, in Malaysia, in the Philippines, in Hawaii, or in San Francisco and Seattle." Mansfield on the white paper: it "helps to make clear why this Nation has been compelled to take steps which it has taken in recent weeks." Morse, yielded two minutes by Proxmire: the white paper "Swiss cheese with holes in it."'
    n: '[111 Cong. Rec. 3775–76, 3778, 3783](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf) (1965) (Senate, Mar. 1, 1965). [[w.moyar-triumph-forsaken]], 355 n.23, 487 (Harris); [[w.logevall-choosing-war]], 358–59 (Mansfield''s endorsement; Morse''s "Swiss cheese"; no day; Logevall quotes Mansfield "why this nation has been compelled to take the steps it has in recent weeks"). The Senate sat from noon to 4:08 p.m.: [Daily Digest, D74](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=72). To check: Congressional Record, vol. 111, 3783 (cited by [[w.moyar-triumph-forsaken]], 355 n.23). Names: Proxmire, Javits, Harris, Mansfield, Morse.'
    src:
      c: cd6c8015
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf: all'
        - 'w.moyar-triumph-forsaken 355, 487: B'
        - 'via w.moyar-triumph-forsaken 355 n.23b: B'
    tags: [name:proxmire-william, name:javits-jacob-k, name:harris-fred-r]
