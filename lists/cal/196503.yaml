    c: 'Johnson to a joint session, at night, on television: "The American Promise." "So it was last week in Selma, Alabama." A voting bill to strike down the restrictions used to deny Negroes the vote, in all elections; "their cause must be our cause too. ... And we shall overcome." A written message the same day.'
    n: 'Special Message to the Congress: The American Promise, [1965 Pub. Papers 281](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=357) (Mar. 15, 1965); Special Message to the Congress on the Right To Vote, [1965 Pub. Papers 287](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=363) (Mar. 15, 1965). [111 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-6-2.pdf) (1965). Recording (K–J Adm. II.I). [President''s Daily Diary, Mar. 15, 1965](https://catalog.archives.gov/id/192454), images 5, 6 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]], 408–09; [[w.branch-at-canaans-edge]], 101, 104, 110–15; [[w.sundquist-politics-and-policy]], 273–74; [[w.mann-walls-of-jericho]], 460–63 (the address); [[w.califano-triumph-and-tragedy-of]], 56 ("And we shall overcome"; a Southern member beside McPherson: "Goddamn!"); [[w.kotz-judgment-days]], 307 ("What happened in Selma was an American tragedy"); [[w.zelizer-fierce-urgency-of-now]], 213–14 (9 p.m.; thirty-nine ovations; "And, we shall overcome"); [[w.kotz-judgment-days]], 308–13 (through the northwest gate at 8:30 p.m.; a television audience of 70 million; "There is only an American problem"; "And — we — shall — overcome!"; Cotulla; forty interruptions for applause); [[w.bernstein-guns-or-butter]], 235–36 (Goodwin''s draft; Valenti feeding Johnson a page at a time by 6:00; an audience of 70 million; forty-two minutes, by Lady Bird Johnson''s diary); [[w.young-easy-burden]], 361–62; [[w.humphrey-education-of-a-public-1976]], 493–94 n.1 (the address urged by Humphrey; Johnson: "We shall overcome"); [[w.wofford-of-kennedys-and-kings]], 185–86 (the evening of March 15; "this time, on this issue, there must be no delay"; "So it was last week in Selma, Alabama"; "Their cause must be our cause, too ... And we shall—overcome!"; the first special domestic message in person since Truman in 1946, at night to be seen on television; King in Selma at Reeb''s memorial); [[w.johnson-white-house-diary]], 252–54 (the address to Congress at 9 p.m., forty-two minutes, two rising ovations in it; the teleprompter not ready, her copy ending two thirds of the way; the Cotulla close; "open your polling places to all your people"; J. Edgar Hoover and four clergymen in her gallery; not the title). See [[cal.1965-03-07.voting-rights]]. Names: Johnson. Check: the page.'
