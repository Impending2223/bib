    n: '"[Cable from the Chinese Embassy in the Soviet Union to the Ministry of Foreign Affairs, ''Chinese Students Intending to Participate in the Demonstrations Organized by the Vietnamese Students''](https://digitalarchive.umd.edu/document/119953)" (Mar. 3, 1965), PRC FMA 109-03984-02, 1–2, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive (the students say they reported it "to the Soviet central authorities this morning"; they will march the next day whether the Soviets agree or not). The cable: [[cal.1965-03-03.china]]. Check: the year the Archive posted the document.'
