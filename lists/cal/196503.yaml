  - id: cal.1965-03-09.voting-rights
    when: Mar. 9
    date: '1965-03-09'
    thread: voting-rights-selma
    also: [alabama, king]
    c: Selma, the second march. Judge Johnson bars any march until a hearing. King leads some 2,500 to the bridge, kneels with them at the troopers' line, and turns back, as Collins had arranged with Clark and Lingo. That night whites club James Reeb, a Unitarian minister from Boston; he dies in Birmingham Mar. 11.
    n: '*Williams v. Wallace*, [240 F. Supp. 100](https://static.case.law/f-supp/240/case-pdfs/0100-01.pdf), 103 (M.D. Ala. 1965) (the order of Mar. 9). Statement by the President on the Situation in Selma, Alabama, [1965 Pub. Papers 272](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=348) (Mar. 9, 1965): "deploring the brutality." Check the number. [[w.garrow-bearing-the-cross]], 401–05. To check: Louis Martin to Marvin Watson, Mar. 8, 1965, White House Central Files, Ex HU/ST1, box 24, Johnson Library; New York Times, Mar. 9, 1965, 1; Washington Post, Mar. 9, 1965, A1 (cited by [[w.garrow-bearing-the-cross]], 401 n.42); FBI file 44-12831-520, Mar. 9, 1965; Lingo testimony, Mar. 13, 1965, trial transcript, 96-100, Williams v Wallace, M.D. Ala., trial record, Middle District of Alabama (cited by [[w.garrow-bearing-the-cross]], 403 n.44); New York Times, Mar. 10, 1965, 1, 22; Washington Post, Mar. 10, 1965, A1; King testimony, Mar. 11, 1965, trial transcript, 50-52, 67-70, 98, Williams v Wallace, M.D. Ala., trial record, Middle District of Alabama (cited by [[w.garrow-bearing-the-cross]], 404 n.45); New York Times, Mar. 10, 1965, 23; Mar. 11, 1965, 1; Humphrey to Johnson, Mar. 10, 1965, Marvin Watson Papers, box 31, Johnson Library (cited by [[w.garrow-bearing-the-cross]], 405 n.47). See [[cal.1965-03-07.voting-rights]]. Check: Garrow, 403, gives two thousand marchers. Names: Frank Johnson, King, Collins, Clark, Lingo, Reeb.'
