    thread: school-aid
    c: 'Johnson to Powell by telephone, 9:32 p.m., Powell having left the school bill for the Bahamas after a quarrel with the House leaders: "Adam, what the hell has been happening in your committee? ... What the hell! Are you blackmailing me?"'
    n: '[[w.kotz-judgment-days]], 280. To check: [Johnson, Powell and Valenti, 9:32 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-adam-clayton-powell-and-jack-valenti-march-1), Conversation WH6503-01-7007 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 280 n.2). Check: the day ("just" before King''s visit of Mar. 5). Names: Johnson, Powell.'
