    c: 'The Secretariat, under Liu Shaoqi, on literature and the arts. Deng Xiaoping: since the mistaken leftist criticism nobody dares write; Xinhua gets few manuscripts; the stage shows only fighting; the films are no good.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 444; [[w.deng-xiaoping-nianpu-1904]], III, 1849 (Mar. 2, 1965; afternoon, 下午; Deng presides at the Secretariat, which hears Lu Dingyi on the socialist education movement in the literary and art circles; Deng: now no one dares write; Xinhua gets only two manuscripts a day; the stage shows only soldiers and battles; this is banned and that is banned; the ''revolutionaries'' want to make a name by criticizing others and climb on others'' shoulders; it is to be stopped quickly; work teams used to seek out poor peasants only, leaving cadres no way out, but under the Twenty-three Articles 80 percent of cadres'' drive is aroused; the three months'' going to the countryside by the cultural world is not to be done so mechanically); [[w.pu-weihua-zalan-jiu-shijie]], 5 (March 1965, no day: to stop the overheated criticism of the arts; the minutes find the criticism since 1964 overdone and call for a halt). Made public: 1991 ([[w.huaxuan-zhongguo-gongchan-dang-huiyi]]). To check: [[w.huaxuan-zhongguo-gongchan-dang-huiyi]], 512 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 444 n.89); [[w.zhongguo-gongchandang-lishi-dashiji]], 270 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 5 n.10). Names: Liu Shaoqi, Deng Xiaoping.'
