        - 'w.white-making-of-the-president-1965 399–400: ?'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-03-01.voting-rights
    when: Mar. 1
    date: '1965-03-01'
    thread: voting-rights
    c: 'Katzenbach to Moyers and Lee White, answering Busby: abuse by the registrars is forbidden already, and the cases are delayed and evaded; no remedy that would "leave control of voting machinery in state hands." "While I agree with Mr. Busby that the political consequences of the proposed message are serious, I see no alternative."'
    n: '[[w.branch-at-canaans-edge]], 15–16. To check: Katzenbach to Moyers and White, Mar. 1, 1965, Moyers Papers, box 6, LBJ Library (cited by [[w.branch-at-canaans-edge]], 16). See [[cal.1965-02-27.voting-rights]]. Names: Katzenbach, Moyers, Lee White, Busby.'
    src:
      c: dbac9bc4
      rows:
        - 'w.branch-at-canaans-edge 15–16: all'
        - 'via w.branch-at-canaans-edge 16 n.leave-control-of: all'
    tags: [name:katzenbach-nicholas, name:moyers-bill, name:white-lee-c, name:busby-horace]
  - id: cal.1965-03-01.vietnam-air-war
    when: Mar. 1
    date: '1965-03-01'
    time: 1965-03-01T15:46Z
    thread: vietnam-air-war
    also: [press-and-broadcasting]
    c: 'Johnson and McNamara by telephone, 10:46 a.m. McNamara cleared to "go ahead tonight" with the first strike of the sustained bombing, put off by weather. Johnson, on the *New York Times*''s story of the plans that morning: "Am I wrong in saying that this appears to be almost traitorous?" "Somebody ought to be removed, Bob."'
    n: '[Johnson and McNamara, 10:46 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-march-1-1965), Conversation WH6503-01-7002 (Miller Center). [[w.branch-at-canaans-edge]], 17 (the words). To check: Robert Kleiman, "U.S. Said to Plan Limited Air War as Lever on Hanoi," [*New York Times*, Mar. 1, 1965](https://timesmachine.nytimes.com/timesmachine/1965/03/01/issue.html), 1 (cited by [[w.branch-at-canaans-edge]], 17). See [[cal.1965-03-02.vietnam]]. Names: Johnson, McNamara.'
    src:
      c: 04ef90cd
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-march-1-1965: A'
        - 'w.branch-at-canaans-edge 17: all'
        - 'via w.branch-at-canaans-edge 17 n.am-i-wrong: all'
        - 'via w.branch-at-canaans-edge 17 n.president-transfixed-by: B'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - id: cal.1965-03-01.voting-rights-selma
    when: Mar. 1
    date: '1965-03-01'
    thread: voting-rights-selma
    also: [alabama, king]
    c: 'A registration day. Selma: King leads some 300 to the Dallas County courthouse in the rain; Clark keeps them outside; 266 complete applications, twice the record. Camden, Wilcox County: ten of some 200 in line allowed to apply. Hayneville, Lowndes County: Golson, a registrar, turns King away; that morning some 37 of the county''s Negroes, at the courthouse to register, were told to sign a pad and come back in two weeks.'
    n: '[[w.branch-at-canaans-edge]], 17–22. To check: [*New York Times*, Mar. 2, 1965](https://timesmachine.nytimes.com/timesmachine/1965/03/02/issue.html), 1, 10, 19 (cited by [[w.branch-at-canaans-edge]], 19, 21–22). See [[cal.1965-01-02.voting-rights]]. Names: Martin Luther King, Clark.'
    src:
      c: 1a52cf91
      rows:
        - 'w.branch-at-canaans-edge 17–22: all'
        - 'via w.branch-at-canaans-edge 19 n.in-the-name: B-C'
        - 'via w.branch-at-canaans-edge 18 n.who-is-that: E'
    tags: [name:king-martin-luther-jr, name:clark-james-g-jr]
  - id: cal.1965-03-01.vietnam
    when: Mar. 1
    date: '1965-03-01'
    thread: vietnam
    c: 'Cooper to Bundy, back from a trip: "What is needed now is more walking and less running. Perhaps a bit of just plain sitting would be useful." Quát steadier than his predecessor; the Buddhists for negotiations and withdrawal; a "peace" group active in Saigon and the northern provinces.'
    n: '[FRUS 1964–68, II, doc. 173](https://history.state.gov/historicaldocuments/frus1964-68v02/d173). [[w.preston-war-council]], 187. Names: Chester Cooper, Bundy, Phan Huy Quát.'
