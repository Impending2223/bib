    also: [soviet-union, vietnam]
    c: 'Zagoria before the House Subcommittee on the Far East and the Pacific: the United States "a silent, if largely unwitting, participant" in the dispute, the three powers a "triangle"; "the most significant consequence of the American bombing of North Vietnam ... the widening of the Sino-Soviet split"; a settlement the Soviets'' "only way out"; end the war on terms acceptable to both and "help substitute Soviet for Chinese influence in Hanoi."'
