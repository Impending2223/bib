entries:
  - id: cal.1965-03-01.legislatures-ks
    when: Mar. 1
    date: '1965-03-01'
    thread: legislatures
    c: 'Kansas Supreme Court, *Harris v. Anderson*: the House''s apportionment, one member to every county under the State constitution, void after *Reynolds v. Sims*; the legislature to reapportion before 1966. Three justices dissent.'
    n: '*Harris v. Anderson*, [194 Kan. 302](https://static.case.law/kan/194/case-pdfs/0302-01.pdf), 400 P.2d 25 (1965). *Long v. Avery*, [251 F. Supp. 541](https://static.case.law/f-supp/251/case-pdfs/0541-01.pdf) (D. Kan. 1965). See [[cal.1963-12-05.legislatures-ks]]; [[cal.1964-06-15.court]].'
    tags: [state:ks]
  - id: cal.1965-03-02.vietnam
    when: Mar. 2
    date: '1965-03-02'
    thread: vietnam
    c: 'Rolling Thunder begins: 104 American and 19 South Vietnamese aircraft against the Xóm Bàng ammunition depot, just north of the demilitarized zone, and the Quảng Khê naval base. Six American aircraft lost, five pilots rescued; no announcement in Washington or Saigon. The same day General Harold K. Johnson, the Army''s chief of staff, ordered to Saigon to find what more can be done in the South: "no limitation on funds, equipment or personnel."'
    n: 'FRUS 1964–68, II, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v02/d175), [176](https://history.state.gov/historicaldocuments/frus1964-68v02/d176), [178](https://history.state.gov/historicaldocuments/frus1964-68v02/d178), [179](https://history.state.gov/historicaldocuments/frus1964-68v02/d179). [[w.staaveren-gradual-failure]], 84 (the targets; the losses); [[w.gibbons-u-s-government-and]], III, 115; [[w.frankum-like-rolling-thunder]], 21–22 (the first strike); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 531 (the first strike; the losses); [[w.cosmas-joint-chiefs-of-staff-2012]], 241 (General Johnson''s mission); [[w.marolda-united-states-navy-and]], 505 (the targets; the losses). To check: [[w.thompson-rolling-thunder]]; [[w.clodfelter-limits-of-air-power]]; Msg, JCS to CINCPAC, 011840Z Mar 65 (cited by [[w.staaveren-gradual-failure]], 84 n.45); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, May 64-5 Apr 65, Vol I, pp 4-1 to 4-2 (cited by [[w.staaveren-gradual-failure]], 84 n.46a); Project CHECO, Rolling Thunder, p 22 (cited by [[w.staaveren-gradual-failure]], 84 n.46b); Msg, COMUSMACV to CINCPAC, JCS, 041120Z Mar 65 (cited by [[w.staaveren-gradual-failure]], 84 n.48a); Hq USAF rpt, Analysis of Air Operations, Southeast Asia, 26 Mar 65, Vol I, pp 4-1 to 4-2 (cited by [[w.staaveren-gradual-failure]], 84 n.48b); Rolling Thunder: Personal Notebook on Significant Events, by Gen John P. McConnell, CSAF, item 33 (cited by [[w.staaveren-gradual-failure]], 84 n.48c). See [[cal.1965-02-07.vietnam]]; [[cal.1965-02-13.vietnam]]. Frankum, 21, gives 160 aircraft, the 104 American among them, and six damaged; FRUS''s editors, 104 American and 19 South Vietnamese (doc. 175). Names: Harold K. Johnson. Check: Kaplan gives five American and one South Vietnamese aircraft lost (531). Check: Marolda, 505, gives one South Vietnamese and five Air Force planes shot down, three pilots rescued. Check: Van Staaveren, 84, gives five Air Force aircraft lost, three F-105s and two F-100s, and all airmen but one rescued; and, 85, officials in Saigon giving the strike''s purpose.'
    src:
      c: 197303ad
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d175: all'
