  - id: cal.1964-05-28.china-leadership-2
    when: May 28
    date: '1964-05-28'
    thread: china-leadership
    c: 'Zhou attends the Secretariat meeting, which further discusses the guiding principle of the Third Five-Year Plan. Speaks: China''s economic growth is uneven and will grow more so without attention to location; this year''s capital construction is to be re-ranked; plan methods should draw on experience, not the Soviet way.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 645 (May 28, 1964); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 592 (May 28, 1964; Liu presides at the meeting, which this book gives as of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, on the guideline of the Third Five-Year Plan; he warns that the wish of every department to do more will lengthen the capital-construction line again, and asks the industrial departments to hold capital construction in check); [[w.deng-xiaoping-nianpu-1904]], III, 1813–1814 (May 28, 1964; Deng at the meeting Liu Shaoqi presides over of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, on the guideline for the Third Five-Year Plan; Deng says that construction needs a long-range plan as well as a five-year one, however rough; that the State Planning Commission has put forward the order agriculture, light industry, heavy industry, food, clothing and goods, and the two ''fists'', basic industry to be balanced by them; that Mao later added the ''backside''; ''two fists and a backside'' is the whole line of construction; planning must weigh the first, second and third lines, the investment of agriculture, defense and culture and education must be cut a little to raise that for basic industry and the third line; Panzhihua is to be built by a ''war of annihilation'', the railway first, an oxygen steelmaking set bought; patents are worth buying but not enough, as with vinylon; equipment must be bought too, up to 60 or 70 percent of a set, the rest made at home); [[w.jian-zhou-enlai]], 489 (Zhou, the next day: the third front central in the five years, but the first and second fronts not to be ignored). Made public: 1996. Check: Liu''s chronology (II, 592) gives the meeting as one of the Politburo Standing Committee, the Secretariat and the regional bureaus'' first secretaries, Liu presiding. Check: whether the meeting Liu Shaoqi presides over in the nianpu ([[w.deng-xiaoping-nianpu-1904]], III, 1813) is the Secretariat''s session of Zhou Enlai''s chronology. To check: [[w.zhou-enlai-zhuan-1949]], II, 812–813 (cited by [[w.jian-zhou-enlai]], 489 n.116a); [[w.zedong-mao-zedong-nianpu]], V, 355 (cited by [[w.jian-zhou-enlai]], 489 n.116b). Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
