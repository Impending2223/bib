        - 'via w.perlstein-before-the-storm 337 n.1b: C'
    tags: [name:kuchel-thomas-h, name:rockefeller-nelson, name:goldwater-barry-m, state:ca]
  - id: cal.1964-05-04.trade
    when: May 4
    date: '1964-05-04'
    thread: trade
    also: [european-community]
    c: The Kennedy Round opens at Geneva, the GATT's Trade Negotiations Committee meeting at ministerial level in the Palais des Nations. A linear cut of 50 percent in industrial tariffs the working hypothesis, exceptions to a bare minimum; agriculture's rules still to come. Herter for the United States, his instructions approved by Johnson Apr. 30. Check the terms.
    n: '[FRUS 1964–68, VIII, doc. 236](https://history.state.gov/historicaldocuments/frus1964-68v08/d236) (Herter to Johnson, Apr. 29). To check: [[w.preeg-traders-and-diplomats]]; [[w.evans-kennedy-round-in-american]]. See [[cal.1962-10-11.trade]]. Names: Herter, Johnson.'
    tags: [name:herter-christian-a, name:johnson-lyndon-b]
  - id: cal.1964-05-05.elections-1964
    when: May 5
    date: '1964-05-05'
    thread: elections-1964
    c: 'Primaries in the District of Columbia, Indiana and Ohio. Republican: Goldwater in Indiana; Rhodes in Ohio. Democratic: unpledged delegates in the District; Welsh in Indiana; Porter in Ohio.'
    n: 'CQ Guide 6th (2010) 407. [[w.young-two-suns-of-the]], 117–18 (Indiana: Welsh against Wallace). See [[cal.1964-03-10.elections-1964]]. Names: Goldwater, Rhodes, Welsh, Albert Porter. Check: Young, 118, gives Wallace 30 percent in Indiana.'
    src:
      c: 04d70220
      rows:
        - '"CQ Guide 6th (2010)": all'
        - 'w.young-two-suns-of-the 117–18: E'
    tags: [primary:1964-05-05, name:rhodes-james-a, name:goldwater-barry-m, name:welsh-matthew-e, name:porter-albert-s]
  - id: cal.1964-05-05.alabama
    when: May 5
    date: '1964-05-05'
    thread: alabama
    also: [elections-1964, electoral-college, legislatures]
    c: 'Alabama''s Democratic primary. Ten unpledged electors nominated over a slate pledged to the national ticket: Place No. 1, Lieutenant Governor Allen over the pledged candidate, 516,612 to 84,721, 85.9 percent. Representatives by the nine old districts, for eight seats: Carl Elliott over Bevill in the 7th; Roberts over Amelia Boynton of Selma in the 4th, 47,360 to 4,753, 90.9 percent. Connor elected national committeeman, 282,703 of 525,395, 53.8 percent.'
    n: '[*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), 489](https://archive.org/details/alabama-official-statistical-register-1967/page/n490) (Representatives), [499](https://archive.org/details/alabama-official-statistical-register-1967/page/n500)–[501](https://archive.org/details/alabama-official-statistical-register-1967/page/n502) (national committeeman, electors). Check: the runner-up''s count. To check: [[w.cosman-five-states-for-goldwater]]; [[w.bartley-southern-politics-and-the]]; [[w.carter-politics-of-rage-1995]]. Names: Boynton, Connor, James Allen, Elliott, Bevill, Roberts.'
    tags: [name:allen-james-b, name:elliott-carl-a, name:bevill-tom, name:boynton-amelia-platts, name:roberts-kenneth-a, name:connor-eugene, state:al, state:al]
  - id: cal.1964-05-05.governors-fl
    when: May 5
    date: '1964-05-05'
    thread: governors
    also: [elections-1964]
    c: Florida's Democratic primary for governor. Burns, mayor of Jacksonville, over High, mayor of Miami, 312,453 to 207,280, 27.5 percent; Kelly, a State senator, 205,078, 18.1 percent; three others. Runoff between Burns and High. High for the civil rights bill's public accommodations title.
    n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1964, 5](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1964/page/n6); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1964_Florida_gubernatorial_election) gives them, from *The Florida Handbook, 1965–1966*, 365. To check: [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.bartley-southern-elections]]. Names: W. Haydon Burns, High, Scott Kelly.'
    tags: [name:burns-w-haydon, name:high-robert-king, name:kelly-scott, state:fl, city:jacksonville, city:miami]
  - id: cal.1964-05-05.elections-1964-ok
    when: May 5
    date: '1964-05-05'
    thread: elections-1964
    also: [specials]
    c: 'Oklahoma primaries for the rest of Kerr''s term. Democratic: U.S. Senator Edmondson over State Senator Fred Harris, 215,455 to 190,868, 36.4 percent; Raymond Gary 170,869, 28.8 percent; runoff. Republican: Bud Wilkinson, lately the University of Oklahoma''s football coach, over two others, 100,544 to 26,381, 79.2 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 41–42](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=41). To check: [[w.harris-potomac-fever]]; [[w.peirce-great-plains-states-of]]. See [[cal.1963-01-06.states-and-cities-ok]]. Names: Edmondson, Gary, Harris, Wilkinson, Kerr.'
    tags: [state:ok, name:edmondson-james-h, name:harris-fred-r, name:gary-raymond, name:wilkinson-charles-b, name:kerr-robert-s]
  - id: cal.1964-05-05.state-constitutions-ok
    when: May 5
    date: '1964-05-05'
    thread: state-constitutions
    also: [jobs-and-wages, voting-rights]
    c: Oklahoma, with the primary. A right-to-work amendment by initiative, no union membership or dues a condition of employment, refused, 352,267 to 376,555, 48.3 percent. Residence to vote cut to six months in the State, two in the county, twenty days in the precinct, adopted, 401,998 to 240,299, 62.6 percent. Legislators' pay by law refused, 183,382 to 443,971, 29.2 percent.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 43](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=43). To check: [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. See [[cal.1963-12-03.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1964-05-06.civil-rights-bill
    when: May 6
    date: '1964-05-06'
    thread: civil-rights-bill
    c: Senate, on jury trials in criminal contempt cases under the civil rights bill. Morton's amendment, a jury in every such case, fails on a tie, [45–45](https://voteview.com/rollcall/RS0880291); reconsidered, it fails again, [45–46](https://voteview.com/rollcall/RS0880294). Cooper's narrower amendment refused, [19–74](https://voteview.com/rollcall/RS0880295).
    n: '[110 Cong. Rec., Senate, May 6, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-3-1.pdf). To check: [[w.whalen-longest-debate]]; [[w.mann-walls-of-jericho]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Morton, Cooper.'
    tags: [name:morton-thruston-b, name:cooper-john-sherman]
  - id: cal.1964-05-07.poverty
    when: May 7–8
    date: '1964-05-07'
    thread: poverty
    c: 'Poverty tour. Cumberland, Md.; Athens, Ohio, at Ohio University: "we will build the Great Society"; Knoxville; Rocky Mount, N.C., from a tenant farmer''s house. May 8, Gainesville, Ga., and the Georgia legislature at Atlanta: "no one of us is fully free until all of us are fully free."'
    n: 'Remarks at Fort Hill High School Stadium, Cumberland, Maryland, [1963–64 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=709); Remarks in Athens at Ohio University, [1963–64 Pub. Papers 630](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=714); Remarks at the Coliseum, Knoxville, Tennessee, [1963–64 Pub. Papers 634](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=718); Remarks in the City Hall, Rocky Mount, North Carolina, [1963–64 Pub. Papers 638](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=722) (May 7, 1964); Remarks in Franklin D. Roosevelt Square, Gainesville, Georgia, [1963–64 Pub. Papers 652](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=736); Remarks in Atlanta at a Breakfast of the Georgia Legislature, [1963–64 Pub. Papers 645](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=729) (May 8, 1964). See [[cal.1964-03-16.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-05-08.transition-and-staff
    when: May 8
    date: '1964-05-08'
    thread: transition-and-staff
    c: E.O. 11154 exempts Hoover, 70 on Jan. 1, 1965, from compulsory retirement "for an indefinite period of time." Signed for his fortieth anniversary as Director, in the Rose Garden.
    n: '[Exec. Order No. 11,154](https://www.presidency.ucsb.edu/documents/executive-order-11154-exemption-j-edgar-hoover-from-compulsory-retirement-for-age), [29 Fed. Reg. 6233](https://www.govinfo.gov/app/details/FR-1964-05-12) (1964). Remarks Honoring J. Edgar Hoover on His 40th Anniversary as Director, Federal Bureau of Investigation, [1963–64 Pub. Papers 654](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=738) (May 8, 1964). [[w.dallek-flawed-giant]], 126. To check: [[w.gage-g-man]]; [[w.weiner-enemies]]. Names: Hoover, Johnson.'
    src:
      c: 411efd6a
      rows:
        - 'https://www.presidency.ucsb.edu/documents/executive-order-11154-exemption-j-edgar-hoover-from-compulsory-retirement-for-age: A'
