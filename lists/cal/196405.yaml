  - id: cal.1964-05-01.civil-rights-bill-2
    when: May 1
    date: '1964-05-01'
    place: washington
    thread: civil-rights-bill
    c: Mansfield and Dirksen, on the floor, get Russell's agreement to a vote May 6 on the jury trial amendment. Morton's perfecting amendment to Talmadge's made the pending business.{1} Dirksen invites Senators and Justice's lawyers to his office for Tuesday.{2}
    n: '[[w.whalen-longest-debate]], 173; [[w.risen-bill-of-the-century]], 212 (May 1, Russell, worn down on Thurmond''s absolutists, will allow a vote in five days; Morton''s perfecting amendment limiting Talmadge''s to civil rights cases; Dirksen that afternoon calls the supporters and staffs to his office to say he will negotiate); [[w.purdum-idea-whose-time-has-2014]], 272 (Friday, May 1: Morton calls up his jury trial perfecting amendment and Cooper''s, which take precedence over the Mansfield-Dirksen one; Russell drops his objection to amendments and agrees with Mansfield and Dirksen that voting begin Wednesday, May 6). The Senate sat from 10 a.m. (its order of Apr. 27) to 6:12 p.m.: [Daily Digest, D188](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=186), [D199](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=197). Check: Risen, 212, has Dirksen call the bill''s supporters and staffs to his office "that afternoon" (May 1) and say he will begin negotiations; the entry has the invitation for Tuesday, May 5. To check: 110 Cong. Rec. 9816 (May 1, 1964); *Washington Post*, May 2, 1964, at A1 (cited by [[w.whalen-longest-debate]], 263). Names: Mansfield, Dirksen, Russell, Morton, Talmadge.'
    src:
      c: 4bf8091e
      rows:
        - 'w.whalen-longest-debate 173: 1, 2'
        - 'w.risen-bill-of-the-century 212: ?'
        - 'w.purdum-idea-whose-time-has-2014 272: 1'
    tags: [name:mansfield-mike, name:dirksen-everett, name:russell-richard-b, name:morton-thruston-b, name:talmadge-herman-e]
    time_range:
      - 1964-05-01T14:00Z
      - 1964-05-01T22:12Z
    time_zone: America/New_York
