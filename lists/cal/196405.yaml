    also: [china]
    c: 'Mao presides over the Politburo Standing Committee, the Juxiang Shuwu: two things not enough attended to, the third front and basic industry.{1} First line the coast, second line the Baotou to Lanzhou belt, third the southwest;{2} resolved to build the Panzhihua iron mine, even with the leaders'' salaries. In the atomic age no rear is no safety; Beijing flooded, Panzhihua remains. Luo Ruiqing raises the General Staff''s worry that the Miyun and Guanting reservoirs'' spillways are too small.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 27, 1964; [[w.lengxi-shinian-lunzhan-1956-1966]], 777–778 (the Standing Committee at Mao''s residence: the Third Plan to rest on the third-line defense base, the first line the coast and border, the second the Peking–Canton railway belt, the third Yunnan, Guizhou, Sichuan, Shaanxi, Gansu, Ningxia, Qinghai; to improve conventional arms and press nuclear weapons and missiles; Wu gives the day, May 27); [[w.macfarquhar-origins-of-the-cultural]], III, 369 (Mao proposes the three fronts, the coastal provinces the first, the inland the second, the deep interior the third); [[w.deng-xiaoping-nianpu-1904]], III, 1813 (May 27, 1964; Deng at the Politburo Standing Committee meeting Mao presides over, on building the third line); [[w.mao-zedong-zhuan]], VI, ch. 73 (May 27 Mao holds an enlarged Standing Committee on the Third Front: two things not enough attended to, the Third Front and basic industry (n.28)). [[w.jian-zhou-enlai]], 489 (May 27, Mao: a strategic rear in the nuclear age; the industrial layout in a first, second and third front); [[w.dikotter-cultural-revolution]], 218 n.34 (the Third Front, the main economic policy of the Cultural Revolution: about 1,800 factories in the hinterland); [[w.zhu-de-nianpu-xinbian]], III, 1909 (May 27, 1964, afternoon; Zhu De 朱德 at the meeting at Mao Zedong''s 毛泽东). Made public: 1999. To check: Liu Shaoqi''s account of Mao''s talk of May 27, in the meeting of May 28 (named by [[w.zedong-mao-zedong-nianpu]], V, May 27, 1964, note); [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 514 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 369 n.132a); [[w.fangming-san-xian-jianshe-shuping]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 369 n.134a); [[w.naughton-industrial-policy-during-the]], 153–81 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 369 n.134b); Meeting of the bureaus'' heads on planning problems 各中央局负责人谈计划问题的会议, record 记录, May 28, 1964 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.28a); Mao Zedong 毛泽东, interjections on hearing Yu Qiuli 余秋里 on the long-term plan at the enlarged Politburo Standing Committee 中共中央政治局常委扩大会议 (record 插话记录), Jan. 23, 1965 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.28c); [[w.naughton-third-front]], 378–382 (cited by [[w.dikotter-cultural-revolution]], 218 n.34a); [[w.white-policies-of-chaos]], 184 (cited by [[w.dikotter-cultural-revolution]], 218 n.34b). Names: Mao Zedong, Luo Ruiqing.'
