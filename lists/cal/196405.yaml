    c: 'Johnson to McGeorge Bundy, by telephone, 11:24 a.m.: "it looks like to me that we''re getting into another Korea"; "I don''t think it''s worth fighting for and I don''t think we can get out."{1} "What in the hell is Vietnam worth to me?"{2} Bundy on Lippmann: a "diplomatic structure" within which South Vietnam goes under Hanoi''s control.{3} Mansfield''s memorandum of May 26, read that morning, "just milquetoast as it can be. He''s got no spine at all."{4} Bundy: "It''s an awful mess."{5} Bundy: "I''ve got an extremely good memorandum from Forrestal";{6} ready "to move a little bit, mainly the Vietnamese."{7}'
