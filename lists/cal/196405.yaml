    c: 'Lady Bird Johnson''s memorandum to Johnson on running, written by hand on a stenographer''s notebook at his asking.{1} If he gets out: their motives questioned; "You let us down";{2} she dreads seeing him "semi-idle, frustrated." If not: criticism, bad decisions, perhaps an earlier death.{3} "My Conclusions: Stay in."{4}'
