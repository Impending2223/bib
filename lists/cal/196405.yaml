  - id: cal.1964-05-02.civil-rights-bill
    when: May 2
    date: '1964-05-02'
    thread: civil-rights-bill
    c: 'Johnson to Humphrey by telephone, 2:14 p.m., after the *Times* reports the dressing-down: with his liberal name, Humphrey "can get by with repealing the goddamn bill"; Johnson, a Southerner, would be accused of selling out if he "changed a comma." "The only bill that I am going to sign is one that you and the attorney general recommend in writing."'
    n: '[[w.kotz-judgment-days]], 140. To check: Johnson and Humphrey, May 2, 1964, 2:14 p.m., Tape WH6405.01, PNO 23, LBJ Library (cited by [[w.kotz-judgment-days]], 140 n.87). See [[cal.1964-04-30.civil-rights-bill]]. Names: Johnson, Humphrey.'
