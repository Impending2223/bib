    place: breathitt-county
    thread: poverty
    c: 'Warshoal Branch, Breathitt County, Ky. Mrs. Johnson walks almost a mile up the creek to the three-room house of Arthur Robertson, his wife and seven children: a $700 federal grant for materials, siding, insulation, a well; three-fifths of an acre cleared for tobacco with the Agriculture Department''s help; a part-time job on the Unemployed Parents program. Mrs. Robertson: "It don''t hurt to dream!"'
    n: '[[w.johnson-white-house-diary]], 141–42, 144 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
    tags: [name:johnson-lady-bird]
  - id: cal.1964-05-21.poverty-3
    when: May 21
    date: '1964-05-21'
    place: breathitt-county
    thread: poverty
    c: 'Lick Branch School, Breathitt County. Mrs. Johnson lunches with the 25 children of the one-room school, a hot lunch for ten cents; presents a flag that flew over the Capitol and a set of encyclopedias; throws the switch on the school''s first electric lights. Marie Turner, the county superintendent: a teacher hardly ever stays longer than a year; a meal a day lifts the children.'
    n: '[[w.johnson-white-house-diary]], 142–44 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
    tags: [name:johnson-lady-bird]
