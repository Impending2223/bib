  - id: cal.1964-05-27.vietnam
    when: May 27
    date: '1964-05-27'
    thread: vietnam
    c: 'Johnson and Russell, by telephone, 10:55 a.m., on Vietnam and the Republicans. Russell: "It''s the only issue they got." Lodge replaced? "He''d be back home campaigning against us on this issue, every day," Johnson answers. Russell: "It''s the damn worst mess I ever saw"; Vietnam "isn''t important a damn bit with all those new missile systems." Johnson: "Mansfield, he just wants to pull up and get out"; "they''d impeach a President, though, that would run out, wouldn''t they?" Russell: Church "just wished to God we could get out of there."'
    n: '[Johnson and Russell, 10:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-may-27-1964), Conversation WH6405-10-3519 (Miller Center). [[w.johns-vietnams-second-front]], 56–57 (the conversation, from the Johnson Library''s transcript); [[w.moyar-triumph-forsaken]], 293 (Johnson on Lodge: "He''d be home campaigning against us on this issue every day"). [[w.mann-grand-delusion]], 328–30 (the words, from Beschloss''s transcript); [[w.branch-pillar-of-fire]], 308–10. To check: the transcript, Johnson Library (cited by [[w.johns-vietnams-second-front]], 56 n.52); [FRUS 1964–68, XXVII, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v27/d52) (telephone conversation, May 27, 1964; cited by [[w.moyar-triumph-forsaken]], 293 n.31); [[w.taking-charge]], 363–73 (cited by [[w.mann-grand-delusion]], 329 n.25, 330 n.27). See [[cal.1964-05-24.vietnam]]. Names: Johnson, Russell, Lodge, Mansfield, Church.'
