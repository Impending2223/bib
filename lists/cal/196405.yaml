    c: 'Mao, on his train at Nanjing, Bengbu, Jinan and Tianjin: hears the State Planning Commission''s leading group (Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Chen Boda) on preliminary ideas for the Third Five-Year Plan. Mao: population 800 million by 1970; industry to serve agriculture;{1} two fists, farming and defense industry, and a backside, basic industry;{2} plan small and complete;{3} keep Jiuquan and Panzhihua;{4} leave margins, no full-up revenue;{5} learn from Dazhai;{6} for class and conduct, conduct counts.{7} May 13: the standards of a good socialist education.{8}'
