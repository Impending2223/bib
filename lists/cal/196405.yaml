    c: 'Johnson and Russell, by telephone, 10:55 a.m., on Vietnam and the Republicans.{1} Russell: "It''s the only issue they got."{2} Lodge replaced? "He''d be back home campaigning against us on this issue, every day," Johnson answers.{3} Russell: "It''s the damn worst mess I ever saw"; Vietnam "isn''t important a damn bit with all those new missile systems."{4} Johnson: "Mansfield, he just wants to pull up and get out"; "they''d impeach a President, though, that would run out, wouldn''t they?" Russell: Church "just wished to God we could get out of there."{5}'
