    c: 'The Central Work Conference opens, Beijing (to June 17): farm plans in the Third Plan period, rural work and the socialist education movement, the preliminary ideas for the Third Plan, political work in industry and communications, finance and trade.{1} It discusses Mao''s four items: the third front, socialist revolution and preventing revisionism, military strategy, successors;{2} and Liu Shaoqi''s two labor systems and two education systems.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 15, 1964 ("5月15日一6月17日"); [[w.zhou-enlai-nianpu-1949]], II, 643 (May 15–June 17, 1964: Zhou attends the Central Work Conference in Beijing: farm planning and rural work, the Third Five-Year Plan, political work, opposing and preventing revisionism, training successors, the two labor and two education systems; Mao on the strategic layout of the first, second and third lines); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 590–591 (May 15–June 17, 1964; Liu attends the Central Work Conference, which takes up farm planning and rural work, the Third Five-Year Plan (1966–70) and political work, and also the guard against revisionism, the training of successors, and the two labor systems and two education systems); [[w.macfarquhar-origins-of-the-cultural]], III, 369 (at a central work conference in May and June 1964 Mao proposes putting the country on a war footing in three fronts); [[w.yang-shangkun-riji]], II, 376 (May 15, 1964; opens "today"; two days for reading the papers, the formal sessions from Monday); [[w.deng-xiaoping-nianpu-1904]], III, 1812 (May 15–June 17, 1964; Deng attends the Central Work Conference in Peking, on the agricultural plan for the Third Five-Year Plan period, current rural work and the socialist education movement, the first ideas for the Third Plan, political work in all systems and finance and trade work; on May 18 at the plenary he explains the arrangement of the agenda; on the afternoon of June 17 he gives the summing-up. Before the conference Mao says agriculture and national defense are the ''fist'', basic industry the ''backside''; during it he proposes the first, second and third lines and the building of the third line; the conference holds that a third of the grass-roots leadership is not in the Party''s hands); [[w.mao-zedong-zhuan]], V, ch. 71 (May 15–June 17 Mao presides at Peking over the Central Work Conference: the Third Five-Year Plan centred on war preparedness, and the rural Four Cleans). [[w.peng-zhen-nianpu-1902]], IV, 333 (May 15–June 17, 1964; Peng Zhen at the Central Work Conference in Peking: farm plans and rural work, socialist education, the first ideas of the Third Five-Year Plan (1966–70), political work in the systems, industry and communications above all, and finance and trade; also the third line, against revisionism, successors, the two systems of labor and of education; before it Mao: agriculture and defense the fist, basic industry the backside, which must sit firm; in it Mao, on the danger of a new world war, without a rear none in the atomic age, the country divided into first, second and third lines, the third line to be built; on socialist education, a third of the base''s power not in our hands, the masses to be roused and the "four uncleans''" patrons above traced; Mao fears revisionism in the Center and raises the training of successors; the directive and draft regulations of the poor and lower-middle peasants'' associations discussed); [[w.zhu-de-nianpu-xinbian]], III, 1908 (May 15–June 17, 1964; Zhu De 朱德 attends the Central Work Conference 中共中央工作会议 at Peking 北京, which takes up farm plans and rural work, the Third Five-Year Plan 第三个五年计划, political work, finance and trade, guarding against revisionism, training successors, and the two systems of labor and of education); [[w.chen-yun-nianpu-xiuding]], III, 146 (May 15–June 17: on the preliminary ideas for the Third Five-Year Plan (1966–70), farm plans, the rural socialist education movement and against revisionism; Mao: planning learned from the Soviets, steel first, to be changed, farming the base and industry the lead, grain and cotton first, then fertilizer and steel; the country in first, second and third lines, the third line to be built; a third of the basic levels'' leadership not in true Communists'' hands; Chen Yun absent, ill). Made public: 1996. To check: the conference''s records and documents (not named by [[w.zedong-mao-zedong-nianpu]], V, May 15, 1964); [[w.jiaoyanshi-zhongguo-gongchan-dang-qishi]], 514 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 369 n.132a). Names: Mao Zedong, Liu Shaoqi.'
