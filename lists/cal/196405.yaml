    c: 'Dirksen''s office, the third day.{1} Dirksen objects to "massive resistance" as the offense in Title II.{2} The afternoon''s staff meeting: Flynn of Dirksen''s staff proposes "pattern or practice."{3} Marshall, by telephone: "Jump at it, Charlie. That''s marvelous."{4} Kuchel proposes cloture May 22;{5} Humphrey: not before June.{6}'
    n: '[[w.whalen-longest-debate]], 177; [[w.risen-bill-of-the-century]], 217 (the day after Morton''s vote: Dirksen''s objection to "massive resistance" in Title II; after lunch Flynn proposes "pattern or practice"; Ferris to Katzenbach and Marshall at Justice; Marshall: "Jump at it, Charlie"); [[w.purdum-idea-whose-time-has-2014]], 280–82 (Thursday, May 7, the morning session: Dirksen on how to define discrimination punishable under Title II, Neal Kennedy for an offense self-evident as a speed limit is, the Justice lawyers wanting authority to enjoin all the businesses of an area; that afternoon, staff only, Teasdale of Mansfield''s staff suggests "pattern or practice," Neal Kennedy and the Republicans like it, Ferris telephones Burke Marshall, who thinks it "sounded great"; the phrase put into Titles II and VII, employment discrimination to be "willful"; that evening Kuchel to Humphrey on a cloture vote in a couple of weeks, Humphrey "pretty discouraged," floating it "to keep the civil rights groups in line," no action "before the first week in June" (Kuchel to Horn; the note: Horn''s log, 168)). Check: Purdum, 281, has Ken Teasdale of Mansfield''s staff suggest "pattern or practice" at the afternoon meeting of staff, the Dirksen lawyers liking it; the entry has Flynn of Dirksen''s staff propose it. To check: Horn, Periodic Log, May 7–8, 1964 (cited by [[w.whalen-longest-debate]], 264). See [[cal.1964-05-05.civil-rights-bill]]. Names: Dirksen, Burke Marshall, Kuchel, Humphrey, Flynn.'
