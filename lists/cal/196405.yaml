  - id: cal.1964-05-13.foreign-aid
    when: May 13
    date: '1964-05-13'
    thread: foreign-aid
    c: 'House passes the IDA bill, S. 2214: $312 million over three years, the American share of new resources for the International Development Association. Recommittal refused, [132–247](https://voteview.com/rollcall/RH0880159). The House had recommitted its own bill Feb. 26, [208–189](https://voteview.com/rollcall/RH0880132). Signed May 26, [78 Stat. 200](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg200.pdf).'
    n: 'Statement by the President following House Action on the International Development Association Bill, [1963–64 Pub. Papers 690](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=774) (May 13, 1964); Remarks Upon Signing the International Development Association Bill, [1963–64 Pub. Papers 711](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=795) (May 26, 1964). [110 Cong. Rec., House, May 13, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-8-1.pdf). To check: [[w.johnson-congress-and-the-cold]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
