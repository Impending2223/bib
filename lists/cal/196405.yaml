    c: Florida's Democratic primary for governor. Burns, mayor of Jacksonville, over High, mayor of Miami, 312,453 to 207,280, 27.5 percent; Kelly, a State senator, 205,078, 18.1 percent; three others. Runoff between Burns and High. High for the civil rights bill's public accommodations title.
    n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1964, 5](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1964/page/n6); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1964_Florida_gubernatorial_election) gives them, from *The Florida Handbook, 1965–1966*, 365. To check: [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.bartley-southern-elections]]. Names: W. Haydon Burns, High, Scott Kelly.'
    tags: [name:burns-w-haydon, name:high-robert-king, name:kelly-scott, state:fl, city:jacksonville, city:miami]
