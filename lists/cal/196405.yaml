  - id: cal.1964-05-02.governors-tx
    when: May 2
    date: '1964-05-02'
    thread: governors
    also: [elections-1964]
    c: 'Texas primaries. Democratic, for governor: Connally over Don Yarborough, 1,125,884 to 471,411, 69.1 percent. For Senator: U.S. Senator Yarborough over Gordon McLendon, a radio broadcaster, 904,811 to 672,573, 57.4 percent. Republican, for Senator: George Bush over Jack Cox, 62,985 to 45,561, 44.1 percent; runoff.'
    n: '[Wikipedia, "1964 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1964_Texas_gubernatorial_election) and [Wikipedia, "1964 United States Senate election in Texas"](https://en.wikipedia.org/wiki/1964_United_States_Senate_election_in_Texas), from the *Texas Almanac* and Our Campaigns; Check: the parties'' canvasses. To check: [[w.cox-ralph-w-yarborough-the]]; [[w.reston-lone-star]]; [[w.knaggs-two-party-texas]]; [[w.krochmal-blue-texas]]. See [[cal.1964-05-02.elections-1964]]. Names: Connally, Don Yarborough, Cox, Ralph Yarborough, McLendon, Bush.'
    tags: [state:tx, name:connally-john, name:yarborough-don, name:yarborough-ralph, name:mclendon-gordon, name:bush-george-h-w, name:cox-jack]
  - id: cal.1964-05-02.elections-1964-state-conventions
    when: May 2
    date: '1964-05-02'
    thread: elections-1964-state-conventions
    also: [georgia]
    c: 'Georgia''s Republican State convention pledges its 4 delegates at large to Goldwater: with the district conventions'' 18 of Mar. 21, 22 of the State''s 24. The Associated Press''s count after it, as the Times printed it May 4: Goldwater 209; uncommitted 143; Scranton 63; Lodge 43; others 55; Rockefeller none.'
    n: '"4 More Delegates Vow Support to Goldwater," [*Atlanta Journal*, May 3, 1964](https://www.newspapers.com/image/970588398); for Mar. 21, "9 Districts Give Delegates to Barry," [*Atlanta Journal*, Mar. 22, 1964](https://www.newspapers.com/image/970586821); the count, [*New York Times*, May 4, 1964](https://timesmachine.nytimes.com/timesmachine/1964/05/04/issue.html). The figures: [Wikipedia, "1964 Republican Party presidential primaries"](https://en.wikipedia.org/wiki/1964_Republican_Party_presidential_primaries), its table of the primaries and conventions, read Oct. 22, 2026; the count, its narrative, citing the Times. To check: [[w.cosman-five-states-for-goldwater]]. See [[cal.1964-02-29.elections-1964-state-conventions]]. Names: Goldwater, Scranton, Lodge, Rockefeller. Check: the papers and the Times''s page (by subscription; not read here).'
    tags: [state:ga, name:goldwater-barry-m, name:scranton-william-w, name:lodge-henry-cabot, name:rockefeller-nelson]
  - id: cal.1964-05-03.elections-1964
    when: May 3
    date: '1964-05-03'
    thread: elections-1964
    also: [conservative-movement]
    c: 'Bakersfield, Cal., the first convention of the United Republicans of California. Kuchel, Rockefeller''s chairman in the State, called a "left-wing extremist." Goldwater''s keynote: "I am not afraid of what any Republican would do to this country."'
    n: '[[w.perlstein-before-the-storm]], 335, 337. To check: *New York Times*, May 3, 1964; press release with the speech''s excerpts, Free Society Association Papers, Hoover Institution (cited by [[w.perlstein-before-the-storm]], 337 n.1). Names: Kuchel, Rockefeller, Goldwater.'
