    n: '[[w.zhou-enlai-waijiao-huodong]], 404 (May 1, 1964; 下午4时); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 334–335 (May 1, 1964; Zhou receives the Mexican foreign trade bank senior official Hernández, the Mexican trade delegation and the executive chairman of the Mexico–China Friendship Association, Torres, and his wife; Zhou says he admires Mexico''s holding high the banner of racial equality and respect for other countries'' sovereignty; we oppose imperialism not by race but by oppressors and oppressed; there are more yellow people than white, but that does not mean yellow people oppose white; most white people are oppressed; Latin America is bullied by the U.S.; we unite the ninety percent and more who are oppressed and bullied against the very few oppressors, whose representative and leader is U.S. imperialism). Names: Zhou Enlai.'
