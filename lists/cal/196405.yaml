    n: '[110 Cong. Rec., Senate, May 14, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt8/pdf/GPO-CRECB-1964-pt8-9-1.pdf). See [[cal.1963-10-07.baker]]. Names: Williams, Mansfield.'
