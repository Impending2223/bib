    when: May 12
    date: '1964-05-12'
    thread: governors
    also: [elections-1964]
    c: 'West Virginia primaries for governor. Democratic: Hulett Smith, the former State chairman, over the nearest of three others, 186,273 to 85,527, 53.3 percent; the Speaker of the House of Delegates 47,845, 13.7 percent. Republican: Underwood, governor 1957–61, over two others, 152,573 to 17,439, 89.7 percent.'
    n: '*West Virginia Blue Book*, 1964, [p. 467](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=477) (Smith 186,273, Bonn Brown 85,527, Julius W. Singleton 47,845, Harold G. Cutright 30,119), [p. 493](https://www.wvlegislature.gov/legisdocs/publications/bluebook/WVS_Bluebook_1964.pdf#page=503) (Underwood 152,573, Harry H. Cupp 11,325, Freda P. Cavendish 6,114). To check: [[w.williams-west-virginia]]; [[w.peirce-border-south-states]]. Names: Smith, Underwood.'
    tags: [state:wv, name:smith-hulett-c, name:underwood-cecil-h]
