    c: 'Negotiations begin in Dirksen''s office: Mansfield, Humphrey, Robert Kennedy, Katzenbach, Magnuson, Kuchel, Hickenlooper, Aiken. Dirksen brings some seventy amendments, most of them technical; he would limit the Attorney General''s suits to a "pattern or practice" and give State agencies thirty days first. To reporters: "I''m trying to unscrew the inscrutable."'
    n: '[[w.mann-walls-of-jericho]], 417–18; [[w.zelizer-fierce-urgency-of-now]], 119–20 (the talks begin in Dirksen''s office; the morning group, Katzenbach and Marshall for Justice). To check: [[w.whalen-longest-debate]], 174; Time, May 15, 1964; The Reporter, July 16, 1964 (cited by [[w.mann-walls-of-jericho]], 417). See [[cal.1964-04-29.civil-rights-bill]]. Names: Dirksen, Mansfield, Humphrey, Robert Kennedy, Katzenbach, Magnuson, Kuchel, Hickenlooper, Aiken.'
