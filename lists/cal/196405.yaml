  - id: cal.1964-05-07.civil-rights-bill-5
    when: May 7
    date: '1964-05-07'
    thread: civil-rights-bill
    c: 'The bipartisan floor leaders'' group, morning. Humphrey: the Mansfield-Dirksen jury trial amendment must get a bigger vote than Morton''s; "If we can produce sixty-four votes, we are okay. But if we only secure forty-nine votes, then we have had it." Rauh: the Leadership Conference still against dealing directly with Dirksen. Mitchell demands the text of Dirksen''s amendments; Katzenbach: there is none, it is being rewritten; Mitchell: the talks should be called off. Humphrey: "It is not pleasant for Tommy Kuchel and myself to have it appear that Dirksen is writing the ticket. I want the bill passed"; no title eliminated, none emasculated; "I''d rather have no bill than the shell of a bill"; the Conference should be out getting votes.'
    n: '[[w.purdum-idea-whose-time-has-2014]], 279 (the votes, Rauh, the ticket, the Conference to get votes; not Mitchell or Katzenbach); [[w.risen-bill-of-the-century]], 216–17 (Mitchell, Katzenbach, the ticket, no bill rather than a shell; not the votes or Rauh; "the next day" after Morton''s vote of May 6). To check: Horn, log, 161, EMDP (cited by [[w.purdum-idea-whose-time-has-2014]], 363); notes for May 11, 1964, by Raymond Wolfinger, box 23, Filvaroff and Wolfinger Papers; Horn log, May 7, 10:45 (cited by [[w.risen-bill-of-the-century]], 216–17 nn.80–81). See [[cal.1964-05-06.civil-rights-bill]]. Names: Humphrey, Rauh, Mitchell, Katzenbach, Kuchel, Dirksen.'
