    when: May 13
    date: '1964-05-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Apr. 24–29: the Democratic convention''s choice between Johnson and Wallace: Johnson 84, Wallace 9, undecided 7. Southern Democrats: Johnson 74, Wallace 21. Democrats outside the South: Johnson 94, Wallace 3.'
    n: '[[w.gallup-poll]], III, 1879–80. Names: Johnson, Wallace.'
    tags: [name:johnson-lyndon-b, name:wallace-george-c]
