    thread: china-leadership
    also: [soviet-union]
    c: 'The Chinese Central Committee gives the CPSU its reply to the letter of Mar. 7.{1} A stop to the open polemic needs agreement: China has not finished answering the Open Letter of July 14, and has not begun on the two thousand texts since; the CPSU''s plenum, Feb. 15 and 16 by this letter, made its "decisive rebuff" three weeks before its call for a stop. The Soviet–Chinese talks, the CPSU''s May and China''s October, are both too early: best in the first half of 1965, to be put off again if either side finds it not ripe. A preparatory meeting of 17, not 26, parties; the world conference, not this autumn.{2} No party may call it against the rule of consultation, and one that did would bear the blame for a split.{3} Preparation may take four or five years or longer. The Chinese letters since Nov. 1963 and the CPSU''s are to be printed in full, and the CPSU asked to do the same.{4}'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 772–774 (May 7; the reply''s points in Wu''s order; the call to print the letters, and the six others with it); [[w.mao-zedong-zhuan]], V, ch. 71 (May 7 the reply: no giving up the right of public answer until the Open Letter is answered; two-party talks better in the first half of next year; against calling a conference unilaterally; Mao added the second and third points). Made public: the *Renmin ribao*, May 9, 1964 (774–775). See [[cal.1964-05-03.china-leadership-2]], [[cal.1964-03-07.soviet-union]]. Check: the plenum days (Feb. 15 and 16 here, Feb. 14 to 15 at 763 in Wu); the hour and the person who handed it.'
