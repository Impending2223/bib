  - id: cal.1964-05-14.china-leadership-2
    when: May 14
    date: '1964-05-14'
    time: 1964-05-14T08:00Z
    place: peking
    thread: china-leadership
    also: [japan, china]
    c: 'Zhou receives the Liberal Democratic Party members Kitamura Tokutarō, Kawasaki Hideji, Matsumoto Shun''ichi and Tokuda Yokichirō.{1} First: bring far-sighted, strong entrepreneurs to China to talk apart from trade, about Japanese enterprise''s future, through them and Matsumura and Okazaki. Second: agreement is reached on trading Liao Chengzhi and Takasaki offices, to be done soon; the Japanese government should act, not be passive. Third: contact between the two governments'' diplomats, from unofficial to official, from private to open, is agreeable.{2} On American policy in three stages since 1949: now ready to accept Peking''s representation but keeping Taiwan out, "two Chinas", which Chiang opposes too;{3} Britain''s Butler in Tokyo said Taiwan''s status undetermined, an international question, and Britain would join a conference on it; the *People''s Daily* answered in an editorial.{4}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 642–43 (May 14, 1964); [[w.zhou-enlai-waijiao-huodong]], 405–06 (May 14, 1964; 下午4时, 中南海西花厅); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 337–338 (May 14, 1964; Zhou receives the well-known Liberal Democratic Party men Kitamura Tokutarō and Kawasaki Hideji and others and says that U.S. policy toward China had three stages: the first, when the Yangtze was nearly crossed and China nearly freed in 1950, the U.S. was ready to recognize new China on condition that it stay neutral between the U.S. and the Soviet Union; the second, the Korean war, when the U.S. turned its face and sent the Seventh Fleet to Taiwan; the third, now, with France''s recognition, the U.S. policy of hostility to China can no longer be kept up and it is ready to recognize the People''s Republic but to exclude Taiwan and make it an independent political unit, "one China, one Taiwan", which is in fact "two Chinas", opposed not only by the Chinese people but by Chiang Kai-shek). Names: Zhou Enlai, Liao Chengzhi, Okazaki, Matsumura Kenzō, Butler.'
