    when: Mar. 12
    date: '1964-03-12'
    thread: succession
    c: Tatoi, the royal summer palace. Burial of King Paul in the family cemetery; Queen Juliana asks Labouisse to introduce the chiefs of state, among them the prince of Cambodia (whose countrymen had stoned the American Embassy the day before), the Crown Prince of Ethiopia, Couve de Murville and the Jordanian foreign minister. Constantine receives the folded standard from the coffin and gives it to the Queen; three shots; Mrs. Johnson and Truman bow at the grave. Lunch at the palace near 4 p.m.
    n: '[[w.johnson-white-house-diary]], 91–94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse, Couve de Murville, Constantine.'
