  - id: cal.1964-03-31.latin-america
    when: Mar. 31–Apr. 2
    date: '1964-03-31'
    thread: latin-america
    c: 'Brazil. Gordon, Mar. 28: Goulart "definitely engaged on campaign to seize dictatorial power." Mar. 31, the army rises against him in Minas Gerais; Washington orders Brother Sam, a carrier task force and tankers, and readies arms for airlift. Apr. 1, Goulart leaves Rio; resistance ends but at Porto Alegre. That night the Congress declares the presidency vacant; Mazzilli, president of the Chamber, sworn. Apr. 2, Johnson''s "warmest good wishes." The Congress elects Castelo Branco, Apr. 11.'
    n: 'FRUS 1964–68, XXXI, docs. [187](https://history.state.gov/historicaldocuments/frus1964-68v31/d187), [195](https://history.state.gov/historicaldocuments/frus1964-68v31/d195), [198](https://history.state.gov/historicaldocuments/frus1964-68v31/d198), [206](https://history.state.gov/historicaldocuments/frus1964-68v31/d206). Message to the New President of Brazil, [1963–64 Pub. Papers 433](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=517) (Apr. 2, 1964). To check: [[w.parker-brazil-and-the-quiet]]; [[w.leacock-requiem-for-revolution]]; [[w.rabe-most-dangerous-area-in]]; [[w.rabe-killing-zone]]. See [[cal.1962-04-03.latin-america]]. Names: Gordon, Goulart, Mazzilli, Castello Branco, Johnson.'
    tags: [name:gordon-lincoln, name:goulart-joao, name:mazzilli-pascoal-ranieri, name:johnson-lyndon-b, name:castello-branco-humberto-de-alencar]
