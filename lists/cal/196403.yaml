  - id: cal.1964-03-04.vietnam-2
    when: Mar. 4
    date: '1964-03-04'
    thread: vietnam
    also: [elections-1964]
    c: 'Johnson with the Joint Chiefs. Taylor, the Chiefs with him: the campaign in the South intensified, and "a progressive program of selective air and naval attacks against North Vietnam"; Chinese intervention unlikely. Johnson, by Taylor''s record, accepts the need to punish Hanoi but points to the political difficulties: he "does not want to lose South Vietnam before next November nor does he want to get the country into war." Khánh to be made "our boy"; Mansfield''s plan for neutralization to be examined.'
    n: '[FRUS 1964–68, I, doc. 70](https://history.state.gov/historicaldocuments/frus1964-68v01/d70) (Taylor''s memorandum of conversation). [[w.moyar-triumph-forsaken]], 305 (the Chiefs'' recommendations; Johnson''s reasons, the election among them); [[w.taylor-swords-and-plowshares]], 309 (a few days before Mar. 8; Taylor''s two parts; the Chiefs: carry it out whatever the cost; not before the November elections; no more coups). [[w.mann-grand-delusion]], 315 (Johnson''s reasons, by Taylor''s record). To check: Greene, meeting notes, Mar. 4, 1964, Greene Papers, Marine Corps Historical Division (cited by [[w.moyar-triumph-forsaken]], 305 n.87); Clifton, memorandum for the record, Mar. 4, 1964, DDRS, 1999, 91 (the same). See [[cal.1964-03-02.vietnam]]. Names: Johnson, Taylor, Nguyễn Khánh, Mansfield.'
