    when: Mar. 6
    date: '1964-03-06'
    thread: elections-1964
    also: [alabama]
    c: 'Wallace at Madison: he files in Wisconsin''s Democratic presidential primary, his slate of sixty delegates against the favorite-son slate of the State''s governor.'
    n: '[Photograph](https://wisconsinhistory.org/Records/Image/IM116625) by Richard Sroda, Mar. 6, 1964, and its caption (Wisconsin Historical Society). To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. Names: Wallace.'
