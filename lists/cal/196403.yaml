  - id: cal.1964-03-01.civil-rights-bill
    when: Mar. 1
    date: '1964-03-01'
    thread: civil-rights-bill
    also: [georgia]
    c: 'Russell on *Face the Nation*: "we are just about to come to a state where it will be necessary for us to fight this bill to the bitter end." In Georgia "an increase in sentiment" for civil rights: "My people are not immune from brainwashing." The National Council of Churches'' support "more at the top than it is throughout the church."'
    n: '[[w.mann-walls-of-jericho]], 399–401, 413; [[w.whalen-longest-debate]], 139, 165 (the program; other words: no compromise likely, and "There never has been as effective [a] lobby maintained in the city of Washington"); [[w.purdum-idea-whose-time-has-2014]], 228–29 (Russell on Face the Nation, Mar. 1: Johnson could not accept a loss; not the words quoted here); [[w.risen-bill-of-the-century]], 182–83 (the next day, Russell on *Face the Nation*: Johnson will throw everything into it; not the entry''s passages); [[w.purdum-idea-whose-time-has-2014]], 265 (Russell: "My people are not immune from brainwashing"; Purdum has the program *Meet the Press*; not the other words). To check: Face the Nation, CBS, Mar. 1, 1964 (cited by [[w.mann-walls-of-jericho]], 399, 401, 413). See [[cal.1964-02-26.civil-rights-bill]]. Names: Russell.'
