    c: 'Valenti, having asked Goodwin for a speech for a Democratic party gathering, hears the draft the next day: it is "just the sort of thing he wanted for LBJ." "LBJ''s way of speaking is a lot closer to Roosevelt than to Kennedy. Kennedy''s stuff might have been fine for him, but not for Johnson." He will recommend that the president bring Goodwin to the White House, and take the speech up "in its pristine form."'
    n: '[[w.goodwin-remembering-america]], 253 (Goodwin''s account). Check: the day; the day after Valenti asked for the speech, "Within a day or two" of the statement of Mar. 21 (253). Names: Valenti, Goodwin, Johnson, Kennedy.'
