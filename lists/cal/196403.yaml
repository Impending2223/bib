  - id: cal.1964-03-17.latin-america-panama
    when: Mar. 17
    date: '1964-03-17'
    thread: latin-america-panama
    c: 'The Oval Office. Johnson, coming out as Goodwin stands in the West Wing corridor during Shriver''s Peace Corps meeting in the fish room: "Tell me, Dick, what do you think we should do about this Panama thing?" Goodwin: "Tell them they''re a great country, our allies in the fight for freedom, that they''ve fought beside us in war and been our friends in peace, that we''re grateful, glad to have them as friends, anxious to keep a small misunderstanding from damaging such a valuable relationship." Johnson: "Can you write me a statement?" "Send it over to Jack Valenti. He''ll make sure it gets right to me." Goodwin finishes it by early evening; Valenti sends a messenger for it.'
    n: '[[w.goodwin-remembering-america]], 250–52 (Goodwin''s account). Check: the day; "Around March 17" (250). Names: Johnson, Goodwin, Shriver, Valenti.'
