  - id: cal.1964-03-06.voting-rights
    when: Mar. 6
    date: '1964-03-06'
    thread: voting-rights
    also: [mississippi, court]
    c: 'Jackson. A three-judge court dismisses the Government''s suit against Mississippi''s registration laws: the test of 1955, that an applicant read, write and interpret any section of the State constitution; the "good moral character" requirement of 1960; the statutes of 1962. The State not a proper defendant; the laws valid on their face. Cameron writing, with Cox; Brown dissents, Mar. 23.'
    n: '*United States v. Mississippi*, [229 F. Supp. 925](https://static.case.law/f-supp/229/case-pdfs/0925-01.pdf) (S.D. Miss. 1964). Reversed: [[cal.1965-03-08.court]]. To check: [[w.lawson-black-ballots]]; [[w.landsberg-enforcing-civil-rights]]; [[w.bass-unlikely-heroes]]. Names: Cameron, Cox, Brown.'
    src:
      c: 3550d0de
      rows:
        - 'https://static.case.law/f-supp/229/case-pdfs/0925-01.pdf: all'
    tags: [name:cameron-ben-f, name:cox-w-harold, name:brown-john-r]
  - id: cal.1964-03-06.states-and-cities-san-francisco
    when: Mar. 6–7
    date: '1964-03-06'
    thread: states-and-cities
    also: [jobs-and-wages]
    c: San Francisco. The Ad Hoc Committee to End Discrimination pickets the Sheraton-Palace Hotel over the hotels' hiring of Negroes and sits in at its doors; 167 arrested in the night, Savio among them. Mar. 7, in Shelley's office, the Hotel Owners Association signs an agreement for 33 hotels.
    n: 'Jo Freeman, ["Freedom Now! to Free Speech"](https://www.foundsf.org/index.php?title=Freedom_Now!_to_Free_Speech:_How_the_1963-64_Bay_Area_Civil_Rights_Demonstrations_Paved_the_Way_to_Campus_Protest) (FoundSF), from the *San Francisco Chronicle*, Mar. 7–10, 1964, which revised the count to 171. To check: [[w.crowe-prophets-of-rage]]; [[w.brilliant-color-of-america-has]]; [[w.cohen-freedoms-orator]]. Names: Savio, Shelley.'
    tags: [state:ca, city:san-francisco, name:savio-mario, name:shelley-john-f]
