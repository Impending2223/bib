  - id: cal.1964-03-04.europe-and-the-alliance
    when: Mar. 4
    date: '1964-03-04'
    thread: cyprus
    c: 'Cyprus. The Security Council, unanimous, recommends a UN peacekeeping force and a mediator; Greek and Turkish Cypriots fighting since December. Johnson: "a major step toward peace." Mar. 12, NSAM 286: American airlift, free, for the troops of contributors who cannot carry their own. The same day Turkey warns Makarios it will move if the attacks on Turkish Cypriots go on.'
    n: '[S.C. Res. 186](https://docs.un.org/S/RES/186%281964%29) (Mar. 4, 1964). Statement by the President following Adoption of the Security Council Resolution on Cyprus, [1963–64 Pub. Papers 332](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=416) (Mar. 4, 1964). FRUS 1964–68, XVI, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v16/d21), [25](https://history.state.gov/historicaldocuments/frus1964-68v16/d25), [26](https://history.state.gov/historicaldocuments/frus1964-68v16/d26). [[w.ball-past-has-another-pattern]], 348–49 (the resolution; Turkey''s threat, the Swedes and the Canadians). See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, Makarios III. Check: Ball gives the resolution as of Mar. 5 and Turkey''s announcement as of Mar. 13.'
