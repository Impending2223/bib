  - id: cal.1964-03.transition-and-staff-2
    when: Mar.
    date: 1964-03
    thread: transition-and-staff
    c: 'Pennsylvania Avenue, midmorning. Bundy, whom Goodwin has not talked with in almost a year, hails him: "We really miss you at the White House, Dick. We could really use someone of your abilities." That afternoon the offer is made and accepted; Goodwin''s responsibilities are to be almost exclusively domestic.'
    n: '[[w.goodwin-remembering-america]], 254 (Goodwin''s account). Check: the day; the morning after the talk with Robert Kennedy. Names: Bundy, Goodwin.'
    tags: [name:bundy-mcgeorge, name:goodwin-richard-n]
  - id: cal.1964-03.transition-and-staff-3
    when: Mar.
    date: 1964-03
    thread: transition-and-staff
    also: [program]
    c: 'The mansion, a morning. Johnson, in the bathroom off his bedroom, to Goodwin: "I wanted you to work for me. Some folks around here, some of your Kennedy friends, were against it. ... Look, Dick, I need you. I need you more than Kennedy ever did. And you need me." "I''m going to pass all those bills you cared about." "You''re going to be my voice, my alter ego, like Harry Hopkins." "I''m going to get my War on Poverty. ... But no compromises on civil rights. I''m not going to bend an inch, this year or next. Those civil rightsers are going to have to wear sneakers to keep up with me."'
    n: '[[w.goodwin-remembering-america]], 256–58 (Goodwin''s account). Check: the day; "one morning in late March 1964" (256). Names: Johnson, Goodwin, Kennedy.'
    tags: [name:johnson-lyndon-b, name:goodwin-richard-n, name:kennedy-john-f]
