  - id: cal.1964-03-02.vietnam
    when: Mar. 2
    date: '1964-03-02'
    time: 1964-03-03T01:50Z
    thread: vietnam
    c: 'Johnson telephones Fulbright, evening. He reads four courses: withdraw; neutralize; Marines "a la Goldwater"; go on training and supplying. Fulbright for the fourth. Johnson: "The only thing I know to do is more of the same and do it more efficiently." Fulbright: "That''s exactly what I''d arrive at under the circumstances."'
    n: '[Johnson and Fulbright, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964), Conversations WH6403-02-2320, [2321](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964-0) (Miller Center). [[w.gibbons-u-s-government-and]], II, 222–23 (not the hour); [[w.mann-grand-delusion]], 315 (the last words); [[w.woods-j-william-fulbright-vietnam]], 67; [[w.woods-fulbright]], 343–44; [[w.taking-charge]], 264; [[w.goodwin-remembering-america]], 353–55 (Fulbright in his Senate office: his praise, "Any hope?"; Johnson''s four alternatives, read, Goodwin judges, from a memorandum: withdraw, neutralize "a la Mansfield and de Gaulle," the Marines "against the source of these aggressions," training and logistic support; Fulbright: "that''s exactly what I''d arrive at under these circumstances"; Johnson: "if we''re losing, we''ve got to decide whether to send them in or whether to come out and let the dominoes fall"; not the hour, "a la Goldwater," or "more of the same"). Made public: [[w.kearns-lyndon-johnson-and-the]], 196–197 (1976), in part. Check: [[w.taking-charge]], 264, prints "The only thing I know to do is do more of the same and do it more efficiently"; the hour, 8:50 p.m. See [[cal.1964-02-19.vietnam]]. Names: Johnson, Fulbright, Goldwater.'
    src:
