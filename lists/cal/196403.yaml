  - id: cal.1964-03-09.jobs-and-wages
    when: Mar. 9
    date: '1964-03-09'
    thread: jobs-and-wages
    c: Manpower Report. Unemployment in 1963, 4.2 million in the average week, 5.7 percent of the labor force; 2.6 million more working part time for want of full-time work. A national commission on automation and technological progress proposed.
    n: 'Annual Message to the Congress: The Manpower Report of the President, [1963–64 Pub. Papers 347](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=431) (Mar. 9, 1964); Letter to the President of the Senate and to the Speaker of the House Proposing a National Commission on Automation and Technological Progress, [1963–64 Pub. Papers 357](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=441) (Mar. 9, 1964). See [[cal.1962-03-15.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-03-09.medicare
    when: Mar. 9
    date: '1964-03-09'
    thread: medicare
    c: 'Johnson to Celebrezze, 12:30 p.m.: stop the leaks. An AP story, HEW its source, told of his private talk urging Mills to come to terms with Cohen; such stories will "run Mills off." Celebrezze, back from two days with Mills at Little Rock: "a fine gentleman."'
    n: '[Johnson and Celebrezze, 12:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-anthony-celebrezze-march-9-1964), Conversation WH6403-05-2409 (Miller Center). [[w.zelizer-taxing-america]], 222–23. See [[cal.1964-02-10.medicare]]. Names: Johnson, Celebrezze, Mills, Cohen.'
    tags: [name:johnson-lyndon-b, name:celebrezze-anthony-j, name:mills-wilbur-d, name:cohen-wilbur-j]
