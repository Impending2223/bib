    c: 'Justice Goldberg, telephoned by Salinger, is aghast: a Virginia voter can hardly run for the Senate from California. A half hour later, after a clerk looks into it, he calls back: Salinger is eligible, but if the case reaches the Supreme Court Goldberg must disqualify himself. By Salinger''s account.'
