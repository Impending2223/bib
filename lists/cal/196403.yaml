    c: 'Secretary of State Frank Jordan refuses to put Salinger on the ballot: not ninety days a member of the California Democratic Party. Goldstein and Kopp ask the State Supreme Court for a writ of mandamus, arguing the Democratic Party is national, and produce his Virginia party records. On the eighth day the court rules he complied "substantially" and orders the name placed on the ballot. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 350–51. Check: the day (the book gives "the eighth day" after the filing), and whether the refusal and the ruling are two entries.'
    tags: [name:salinger-pierre]
