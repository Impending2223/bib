    c: 'Athens, 8:45 a.m. Mrs. Johnson and Truman land, met by Prince Michael and the Grand Mistress of the Court; anthems, troops reviewed, to the Athens Hilton. Prince Michael says his grandfather was aide-de-camp to Grant; Truman: "on the wrong side." With Ambassador Labouisse they sign the guest book at the Palace.'
