    c: 'McNamara''s report: some 40 percent of the countryside under Viet Cong control or predominant influence. Full support for Khánh; his forces up by at least 50,000. No overt action against the North now; readiness to strike across the borders on 72 hours'' notice, and to begin "graduated overt military pressure" on 30 days''.'
    n: '[FRUS 1964–68, I, doc. 84](https://history.state.gov/historicaldocuments/frus1964-68v01/d84). [[w.gibbons-u-s-government-and]], II, 238–40 (the report''s recommendations; not the 40 percent); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 507–09; [[w.cosmas-joint-chiefs-of-staff-2012]], 33–36 (the support for Khánh; no overt action now; the 72 hours and 30 days); [[w.mcnamara-in-retrospect]], ch. 4 at n.24 (the government weakened since the coup; Khánh''s appeal neither wide nor deep; withdrawal and neutralization rejected). [[w.logevall-choosing-war]], 128 (McNamara''s report at the White House, Mar. 16: full support for Khánh, no bombing of the North for now; not the forty percent, the 50,000 or the notice periods). See [[cal.1964-03-08.vietnam]]. Names: McNamara, Nguyễn Khánh.'
    src:
