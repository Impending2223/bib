  - id: cal.1964-03-10.state-and-city-finance-nh
    when: Mar. 10–12
    date: '1964-03-10'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'New Hampshire''s sweepstakes, approved by the General Court in 1963 and signed by King, the first State lottery of the century. Town meeting day, Mar. 10, the cities and towns vote on local option: twelve towns of 224 and one ward of Concord, N.H., against. Tickets on sale Mar. 12, mostly in the State liquor stores; the winners drawn by races at Rockingham Park.'
    n: '[*Laws of the State of New Hampshire, 1963*, ch. 52, 48–50](https://archive.org/details/lawsofstateofnew1963newh/page/48/mode/1up) (approved Apr. 30, 1963). [Wikipedia, "New Hampshire Lottery"](https://en.wikipedia.org/wiki/New_Hampshire_Lottery); *Portsmouth Herald*, Mar. 17, 1964, p. 16. To check: [[w.peirce-new-england-states]]. See [[cal.1964-03-10.elections-1964]]. Names: King.'
    tags: [state:nh, name:king-john-w]
