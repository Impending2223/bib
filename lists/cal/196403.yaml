    when: Mar. 10
    date: '1964-03-10'
    thread: open-housing
    also: [states-and-cities]
    c: Seattle. Ordinance 92497, against discrimination in the sale, rental and financing of housing, passed by the council 7–2 on Nov. 27, 1963 and referred to the voters, refused, 54,448 to 115,627, 32.0 percent.
    n: '[Seattle Municipal Archives, "The Seattle Open Housing Campaign"](https://www.seattle.gov/cityarchives/exhibits-and-education/digital-document-libraries/the-seattle-open-housing-campaign). [Wikipedia, "Seattle movement"](https://en.wikipedia.org/wiki/Seattle_movement). To check: [[w.taylor-forging-of-a-black]]. See [[cal.1964-02-12.open-housing-tacoma]].'
