  - id: cal.1964-03-02.vietnam
    when: Mar. 2
    date: '1964-03-02'
    thread: vietnam
    c: 'Johnson telephones Fulbright, evening. He reads four courses: withdraw; neutralize; Marines "a la Goldwater"; go on training and supplying. Fulbright for the fourth. Johnson: "The only thing I know to do is more of the same and do it more efficiently." Fulbright: "That''s exactly what I''d arrive at under the circumstances."'
    n: '[Johnson and Fulbright, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964), Conversations WH6403-02-2320, [2321](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964-0) (Miller Center). [[w.gibbons-u-s-government-and]], II, 222–23 (not the hour); [[w.mann-grand-delusion]], 315 (the last words); [[w.woods-j-william-fulbright-vietnam]], 67; [[w.woods-fulbright]], 343–44. Made public: [[w.kearns-lyndon-johnson-and-the]], 196–197 (1976), in part. To check: [[w.taking-charge]], 263–64 (cited by [[w.mann-grand-delusion]], 315 n.41). See [[cal.1964-02-19.vietnam]]. Names: Johnson, Fulbright, Goldwater.'
