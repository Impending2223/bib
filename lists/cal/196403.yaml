    thread: specials
    c: Tennessee 2d, special. Irene Baker (R) to her husband's seat over Yarbrough (D), 40,708 to 31,763, 55.5 percent; Howard Baker died Jan. 7. Swing 14.4 to D. Not a candidate in November.
    n: 'Votes: CQ Guide 6th (2010) 1275. Check: Tenn. Secretary of State, returns. [110 Cong. Rec., House, Mar. 19, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt5/pdf/GPO-CRECB-1964-pt5-1-2.pdf) (Baker sworn). See [[cal.1961-04-04.states-and-cities]]. Names: Irene Baker, Howard Baker.'
