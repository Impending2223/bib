    c: 'Morse in the Senate: "We should never have gone in. We should never have stayed in. We should get out." No land war in Asia with American ground forces. If the casualty lists grow until the people "start crying ''Murder,'' no administration will stand." Ellender: "we should never have gone in there and ... we should get out."'
