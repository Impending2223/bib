    n: '[110 Cong. Rec., House, Mar. 12, 1964](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-7-2.pdf). Letter to the Speaker Urging House Action on Federal Pay Legislation, [1963–64 Pub. Papers 386](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=470) (Mar. 17, 1964). To check: [[w.congress-and-the-nation]]. Names: Johnson.'
