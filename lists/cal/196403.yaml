  - id: cal.1964-03-11.cyprus-2
    when: Mar. 11
    date: '1964-03-11'
    thread: cyprus
    c: Athens, 4:30 p.m. Mrs. Andreas Papandreou, the Prime Minister's American daughter-in-law, and Mrs. Costopoulos, the Foreign Minister's wife, take Mrs. Johnson to a Byzantine monastery and to a hill facing the Parthenon, where the three are photographed. Mrs. Papandreou speaks of her husband's interest in industrializing Greece, on Israel's example.
    n: '[[w.johnson-white-house-diary]], 85–86 (Lady Bird Johnson''s account; at lunch Mrs. Labouisse, the Ambassador''s wife, had told her of George Papandreou''s election and of Andreas Papandreou''s giving up his American citizenship to serve in his father''s government). Names: Lady Bird Johnson, Andreas Papandreou.'
    tags: [name:johnson-lady-bird, name:papandreou-andreas]
  - id: cal.1964-03-11.cyprus-3
    when: Mar. 11
    date: '1964-03-11'
    thread: cyprus
    c: 'The Royal Palace, Athens, 9 p.m. Informal supper for the funeral delegations; two of each delegation invited, Mrs. Johnson and Truman for the United States. Queen Frederika receives Mrs. Johnson alone. Present: Kings and Queens of Denmark, Sweden, Norway, Belgium, the Netherlands, Prince Philip, Prince Rainier, exiled and pretender kings, German princes of the Queen''s family. Makarios of Cyprus the center of all eyes; the Queen speaks with him in a corner for a long time, and "everyone was mentally clocking the minutes."'
    n: '[[w.johnson-white-house-diary]], 86–89 (Lady Bird Johnson''s account; Truman left early). Names: Lady Bird Johnson, Truman, Frederika, Makarios.'
    tags: [name:johnson-lady-bird, name:truman-harry-s, name:makarios-iii]
