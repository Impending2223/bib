    c: 'Johnson inspects the Ohio Valley flood damage by Air Force One, leaving Andrews, Md., 1:23 p.m. Aboard: Edwin Weisl and Samuel Newhouse, the publisher, asked to lunch; Representatives and Senators; Secretary Freeman. Pittsburgh: Mayor Barr; the governors of West Virginia, Ohio, Kentucky, Indiana and Illinois (Barron, Rhodes, Breathitt, Welsh, Kerner) come aboard. Flight over the flooded land. Cincinnati: Johnson speaks briefly at the airport; Missouri''s Governor Dalton joins. At the White House a little after 7 p.m. Johnson asks Newhouse to stay the night; he goes home. By Valenti''s account.'
    n: 'Remarks Upon Arrival in Cincinnati After Aerial Inspection of the Ohio River Basin Flood, [1963–64 Pub. Papers 359](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=443) (Mar. 13, 1964) (at the Greater Cincinnati Airport). [[w.valenti-very-human-president]], 166–68 (Valenti''s account; he dates it Friday, Mar. 13). To check: the President''s Daily Diary, Mar. 13, 1964. Names: Johnson, Weisl, Freeman, Barr, Barron, Rhodes, Breathitt, Welsh, Kerner, Dalton, Valenti.'
