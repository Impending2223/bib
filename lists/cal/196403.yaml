  - id: cal.1964-03-02.vietnam
    when: Mar. 2
    date: '1964-03-02'
    thread: vietnam
    c: 'Johnson telephones Fulbright, evening. He reads four courses: withdraw; neutralize; Marines "a la Goldwater"; go on training and supplying. Fulbright for the fourth.'
    n: '[Johnson and Fulbright, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964), Conversations WH6403-02-2320, [2321](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964-0) (Miller Center). [[w.gibbons-u-s-government-and]], II, 222–223. Made public: [[w.kearns-lyndon-johnson-and-the]], 196–197 (1976), in part. See [[cal.1964-02-19.vietnam]]. Names: Johnson, Fulbright, Goldwater.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:goldwater-barry-m]
  - id: cal.1964-03-03.governors-la
    when: Mar. 3
    date: '1964-03-03'
    thread: governors
    also: [elections-1963]
    c: 'Louisiana, general election for governor: McKeithen (D) over Lyons (R), a Shreveport oilman, 469,589 to 297,753, 60.7 percent; a States'' Rights candidate 6,048, 0.8 percent.'
    n: '[Wikipedia](https://en.wikipedia.org/wiki/1964_Louisiana_gubernatorial_election). Check: La. Secretary of State, *General Election Returns, March 3, 1964* (HathiTrust, search only). Votes: the article''s table; the shares computed from them (it prints 37.50 and 1.78 for the two others). To check: [[w.black-rise-of-southern-republicans]]. See [[cal.1964-01-11.governors-la]]; [[cal.1961-12-19.specials]]. Names: McKeithen, Lyons.'
    tags: [name:mckeithen-john-j, name:lyons-charlton-h-sr, state:la]
  - id: cal.1964-03-04.crime-and-hijacking
    when: Mar. 4
    date: '1964-03-04'
    thread: crime-and-hijacking
    also: [robert-kennedy]
    c: 'Chattanooga. A federal jury convicts Hoffa, with three others, of tampering with the jury at his 1962 Nashville trial. Sentenced Mar. 12: eight years and $10,000. The government''s witness a Teamsters official in Hoffa''s company at Nashville.'
    n: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf) (1966) (affirmed; the informer''s testimony admitted). [[w.schlesinger-robert-kennedy-and-his]], 280–81. To check: [[w.navasky-kennedy-justice]]; [[w.goldfarb-perfect-villains-imperfect-heroes]]; [[w.sloane-hoffa]]; [[w.kennedy-enemy-within]]. See [[cal.1961-09-13.crime-and-hijacking]]. Names: Hoffa.'
    tags: [name:hoffa-james-r, name:kennedy-robert-f]
  - id: cal.1964-03-04.europe-and-the-alliance
    when: Mar. 4
    date: '1964-03-04'
    thread: cyprus
    c: 'Cyprus. The Security Council, unanimous, recommends a UN peacekeeping force and a mediator; Greek and Turkish Cypriots fighting since December. Johnson: "a major step toward peace." Mar. 12, NSAM 286: American airlift, free, for the troops of contributors who cannot carry their own. The same day Turkey warns Makarios it will move if the attacks on Turkish Cypriots go on.'
    n: '[S.C. Res. 186](https://docs.un.org/S/RES/186%281964%29) (Mar. 4, 1964). Statement by the President following Adoption of the Security Council Resolution on Cyprus, [1963–64 Pub. Papers 332](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=416) (Mar. 4, 1964). FRUS 1964–68, XVI, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v16/d21), [25](https://history.state.gov/historicaldocuments/frus1964-68v16/d25), [26](https://history.state.gov/historicaldocuments/frus1964-68v16/d26). To check: [[w.ball-past-has-another-pattern]]. See [[cal.1963-12-21.europe-and-the-alliance]]. Names: Johnson, Makarios III.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:makarios-iii]
  - id: cal.1964-03-04.opinion
    when: Mar. 4
    date: '1964-03-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Jan. 30–Feb. 4: the party to keep the country prosperous: Democratic 48 percent, Republican 20, no difference 21. To keep the country out of World War III: Democratic 34, Republican 21, no difference 31.'
    n: '[[w.gallup-poll]], III, 1868.'
  - id: cal.1964-03-04.vietnam
    when: Mar. 4
    date: '1964-03-04'
    thread: vietnam
    c: 'Morse in the Senate: "We should never have gone in. We should never have stayed in. We should get out." No land war in Asia with American ground forces.'
    n: '[110 Cong. Rec. 4357–59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-1-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 223–224. See [[cal.1964-02-19.vietnam]]. Names: Morse.'
    tags: [name:morse-wayne]
