    when: Mar. 5
    date: '1964-03-05'
    thread: desegregation-public-places
    c: 'Frankfort, Ky. Some 10,000 march on the Capitol for a State public accommodations bill; King, Abernathy and Jackie Robinson speak (Check: the date). The bill dies in committee.'
    n: 'Check: the *Courier-Journal*, Mar. 6, 1964. To check: [[w.harrison-new-history-of-kentucky]]; [[w.kmeyer-civil-rights-in-the]]. See [[cal.1963-06-26.desegregation-public-places-ky]]. Names: Martin Luther King, Abernathy, Jackie Robinson.'
    tags: [state:ky, name:king-martin-luther-jr, name:abernathy-ralph-david, name:robinson-jackie]
