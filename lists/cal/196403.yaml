  - id: cal.1964-03-10.mayors-seattle
    when: Mar. 10
    date: '1964-03-10'
    thread: mayors
    also: [elections-1964]
    c: Seattle. Braman, a city councilman and an opponent of the open housing ordinance, elected mayor over Lieutenant Governor Cherberg, who favored it, 95,699 to 83,205, 53.5 percent.
    n: '[David Wilma, "Voters elect James d''Orma Braman as mayor of the City of Seattle on March 10, 1964"](https://www.historylink.org/File/2829) (HistoryLink, essay 2829); Check: Seattle City Clerk, the returns. To check: [[w.taylor-forging-of-a-black]]. See [[cal.1964-03-10.open-housing-seattle]]. Names: Braman, Cherberg.'
