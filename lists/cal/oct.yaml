    when: Oct. 18
    date: '1961-10-18'
    thread: vietnam
    c: Taylor and Rostow in Saigon. Diệm declares a state of emergency. Mekong floods.
    n: '[FRUS 1961–63, I, doc. 174](https://history.state.gov/historicaldocuments/frus1961-63v01/d174). [[w.pentagon-papers]] (Gravel ed.), vol. 2. [[w.newman-jfk-and-vietnam]]. See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow (Viet. III.A); Ngô Đình Diệm (Viet. III.G); Nolting (Viet. III.C).'
    tags: [name:taylor-maxwell, name:rostow-walt-w, name:ngo-dinh-diem]
