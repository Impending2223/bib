    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. F. Clifton White and some two dozen conservative Republicans, most from the Young Republicans, meet in secret on the nomination of 1964: the South and the Midwest enough, without New York and New England. Goldwater their man. Check the number.'
    n: '[[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]; [[w.perlstein-before-the-storm]]; [[w.middendorf-glorious-disaster]]; [[w.goldberg-barry-goldwater]]; [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]. Made public: [[w.white-making-of-the-president-1965]], at the latest. Check. Names: White (Opp. III.F); Goldwater (Opp. III.B).'
    tags: [name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1961-10-09.court
    when: Oct. 9
    date: '1961-10-09'
    thread: court
    c: '*Baker v. Carr* reargued. Cox for the United States as amicus.'
    n: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962). See [[cal.1961-04-19.court]]. Names: Cox (K–J Cong. III.G).'
