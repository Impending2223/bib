    n: '[White House Statement Concerning Soviet Plans To Test a 50-Megaton Bomb](https://www.presidency.ucsb.edu/documents/white-house-statement-concerning-soviet-plans-test-50-megaton-bomb). [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. Names: Khrushchev (K–J Adm. III.J).'
