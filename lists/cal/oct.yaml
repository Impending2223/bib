    n: 'FRUS 1961–63, XIV, docs. [195](https://history.state.gov/historicaldocuments/frus1961-63v14/d195), [196](https://history.state.gov/historicaldocuments/frus1961-63v14/d196). [[w.kempe-berlin-1961]]; [[w.fursenko-one-hell-of-a]]; [[w.garthoff-berlin-1961]]. Check. Names: Robert F. Kennedy (K–J Adm. III.A); Bolshakov (K–J Adm. III.J).'
