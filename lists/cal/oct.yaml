  - id: cal.1961-10-03.immigration
    when: Oct. 3–4
    date: '1961-10-03'
    thread: immigration
    also: [farm]
    c: 'Mexican farm labor program extended two years, to Dec. 31, 1963, [75 Stat. 761](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg761.pdf). Kennedy signs "despite its shortcomings": the program hurts the wages, working conditions and jobs of domestic farm workers; the Secretary of Labor to use his authority to protect them. The Senate had adopted McCarthy''s minimum wage for the Mexican workers, Sept. 11, [42–40](https://voteview.com/rollcall/RS0870181); his motion to table the conference report refused, Sept. 21, [34–40](https://voteview.com/rollcall/RS0870199); the report agreed to, Sept. 23, [41–31](https://voteview.com/rollcall/RS0870202).'
    n: 'Statute (K–J Cong. II.J.2). [Statement by the President Upon Signing Bill Governing Recruitment of Mexican Agricultural Workers](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-signing-bill-governing-recruitment-mexican-agricultural) (Oct. 4, 1961). H.R. 2010, 87th Cong. [[w.craig-bracero-program]]; [[w.calavita-inside-the-state]]. Names: McCarthy.'
    tags: [name:kennedy-john-f, name:mccarthy-eugene-j]
  - id: cal.1961-10-04.opinion-5
    when: Oct. 4
    date: '1961-10-04'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Aug. 24–29: Kennedy 62, Nixon 38.'
    n: '[[w.gallup-poll]], III, 1737. Names: Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1961-10-06.berlin-and-vienna
    when: Oct. 6
    date: '1961-10-06'
    thread: berlin-and-vienna
    c: Gromyko at the White House. Berlin; no movement.
    n: '[FRUS 1961–63, XIV, doc. 170](https://history.state.gov/historicaldocuments/frus1961-63v14/d170). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gromyko.'
    tags: [name:gromyko-andrei]
  - id: cal.1961-10-06.africa
    when: Oct. 6
    date: '1961-10-06'
    thread: africa
    c: 'NSAM 102, the bases in Morocco: Kennedy approves the State–Defense recommendations. Be ready to withdraw the forces by the end of 1963, as committed, while seeking every chance to keep the use of the facilities after; no important military plans to rest on keeping them. NSAM 34, Apr. 5, had asked the questions.'
    n: FRUS 1961–63, XXI, docs. [113](https://history.state.gov/historicaldocuments/frus1961-63v21/d113) (NSAM 34), [123](https://history.state.gov/historicaldocuments/frus1961-63v21/d123) (NSAM 102), [124](https://history.state.gov/historicaldocuments/frus1961-63v21/d124). [[w.muehlenbeck-betting-on-the-africans]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-10-08.goldwater
    when: Oct. 8
    date: '1961-10-08'
    thread: goldwater
    also: [elections-1964]
    c: 'Chicago, a motel. F. Clifton White and some two dozen conservative Republicans, most from the Young Republicans, meet in secret on the nomination of 1964: the South and the Midwest enough, without New York and New England. Goldwater their man. Check the number.'
    n: '[[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]; [[w.perlstein-before-the-storm]]; [[w.middendorf-glorious-disaster]]; [[w.goldberg-barry-goldwater]]; [[w.novak-agony-of-the-g]]; [[w.white-making-of-the-president-1965]]. Made public: [[w.white-making-of-the-president-1965]], at the latest. Check. Names: White, Goldwater.'
    tags: [name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1961-10-09.court
    when: Oct. 9
    date: '1961-10-09'
    thread: court
    c: '*Baker v. Carr* reargued. Cox for the United States as amicus.'
    n: '*Baker v. Carr*, [369 U.S. 186](https://tile.loc.gov/storage-services/service/ll/usrep/usrep369/usrep369186/usrep369186.pdf) (1962). See [[cal.1961-04-19.court]]. Names: Cox.'
    tags: [name:cox-archibald]
  - id: cal.1961-10-10.european-community
    when: Oct. 10–17
    date: '1961-10-10'
    thread: european-community
    c: 'Paris. Heath opens Britain''s negotiations with the Six''s ministers: Britain to become a "full, whole-hearted and active" member; arrangements asked for the Commonwealth, British agriculture and the EFTA. Oct. 17, Ball to Bruce: the British seem not to take seriously the American view that the preferences must in the end go.'
    n: 'FRUS 1961–63, XIII, docs. [19](https://history.state.gov/historicaldocuments/frus1961-63v13/d19) (Ball to Bruce), [22](https://history.state.gov/historicaldocuments/frus1961-63v13/d22) (circular, Nov. 3, quoting Heath), [23](https://history.state.gov/historicaldocuments/frus1961-63v13/d23) (Ball and the EFTA''s Secretary General, Nov. 6). [[w.ludlow-dealing-with-britain]]; [[w.heath-course-of-my-life]]. See [[cal.1961-07-31.european-community]]. Names: Heath, Ball, Bruce.'
    tags: [name:heath-edward-r-g, name:ball-george-w, name:bruce-david-k-e]
  - id: cal.1961-10-11.vietnam
    when: Oct. 11
    date: '1961-10-11'
    thread: vietnam
    c: NSC defers the Joint Chiefs' troop plan for Laos and Vietnam. Taylor to Saigon instead; announced at the press conference.
    n: '[NSAM No. 104](https://history.state.gov/historicaldocuments/frus1961-63v01/d162) (Oct. 13, 1961). FRUS 1961–63, I, doc. [162](https://history.state.gov/historicaldocuments/frus1961-63v01/d162). [[w.kaiser-american-tragedy]]; [[w.taylor-swords-and-plowshares]]. See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow.'
    tags: [name:taylor-maxwell, name:kennedy-john-f, name:rostow-walt-w]
  - id: cal.1961-10-13.peace-corps
    when: Oct. 13
    date: '1961-10-13'
    thread: peace-corps
    also: [africa]
    c: A volunteer's postcard from Ibadan, describing squalor, found and published. Protests at the university; she goes home. Check the date it was found.
    n: '[[w.hoffman-all-you-need-is]]. See [[cal.1961-03-01.peace-corps]].'
  - id: cal.1961-10-15.opinion
    when: Oct. 15
    date: '1961-10-15'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, Sept. 21–26: fight the way into Berlin if access is closed, 70 percent; not, 18. Satisfied with the government''s handling, 61; dissatisfied, 20.'
    n: '[[w.gallup-poll]], III, 1738.'
  - id: cal.1961-10-15.europe-and-the-alliance
    when: Oct. 15–Nov. 20
    date: '1961-10-15'
    thread: europe-and-the-alliance
    also: [middle-east]
    c: 'Turkey. Elections under the constitution approved July 9: the Republican People''s Party 36.7 percent, 173 seats; the Democrats'' heirs, the Justice and New Turkey parties, 34.8 percent and 158, 13.7 percent and 65. The commanders press the parties: Gursel President, the verdicts not exploited, no amnesty. Oct. 26, Gursel elected President; Kennedy''s message, Oct. 29. Nov. 20, Inonu Prime Minister of a coalition with the Justice Party.'
    n: 'FRUS 1961–63, XVI, docs. [367](https://history.state.gov/historicaldocuments/frus1961-63v16/d367) (editorial note: the constitution), [371](https://history.state.gov/historicaldocuments/frus1961-63v16/d371), [372](https://history.state.gov/historicaldocuments/frus1961-63v16/d372). [Message to President Gursel Following His Election Under the New Turkish Constitution](https://www.presidency.ucsb.edu/documents/message-president-gursel-following-his-election-under-the-new-turkish-constitution) (Oct. 29, 1961). See [[cal.1960-05-27.europe-and-the-alliance]]. Names: Gursel, İnönü, Kennedy.'
    tags: [name:gursel-cemal, name:inonu-ismet, name:kennedy-john-f]
  - id: cal.1961-10-16.right-and-the-military
    when: Oct. 16
    date: '1961-10-16'
    thread: right-and-the-military
    c: Schwarz's Christian Anti-Communism Crusade fills the Hollywood Bowl, televised.
    n: '[[w.mcgirr-suburban-warriors]]; [[w.hendershot-whats-fair-on-the]]. See [[cal.1961-03.right-and-the-military]]. Names: Schwarz.'
    tags: [name:schwarz-fred]
  - id: cal.1961-10-17.berlin-and-vienna
    when: Oct. 17
    date: '1961-10-17'
    thread: berlin-and-vienna
    also: [testing, soviet-union]
    c: Twenty-Second Party Congress opens. Khrushchev drops the year-end deadline for a German treaty; announces a fifty-megaton test.
    n: '[White House Statement Concerning Soviet Plans To Test a 50-Megaton Bomb](https://www.presidency.ucsb.edu/documents/white-house-statement-concerning-soviet-plans-test-50-megaton-bomb). [[w.fursenko-khrushchevs-cold-war]]; [[w.taubman-khrushchev]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
  - id: cal.1961-10-18.vietnam
    when: Oct. 18
    date: '1961-10-18'
    thread: vietnam
    c: Taylor and Rostow in Saigon. Diệm declares a state of emergency. Mekong floods.
    n: '[FRUS 1961–63, I, doc. 174](https://history.state.gov/historicaldocuments/frus1961-63v01/d174). [[w.pentagon-papers]] (Gravel ed.), vol. 2. [[w.newman-jfk-and-vietnam]]. See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow, Ngô Đình Diệm, Nolting.'
    tags: [name:taylor-maxwell, name:rostow-walt-w, name:ngo-dinh-diem, name:nolting-frederick-e-jr]
  - id: cal.1961-10-21.defense
    when: Oct. 21
    date: '1961-10-21'
    thread: defense
    c: Gilpatric to the Business Council at Hot Springs, Va. The American second strike at least equal to any Soviet first strike. The missile gap reversed.
    n: '[[w.ball-politics-and-force-levels]]; [[w.kaplan-wizards-of-armageddon]]. See [[cal.1961-02-06.defense]]. Names: Gilpatric.'
    tags: [name:gilpatric-roswell-l]
  - id: cal.1961-10-22.berlin-and-vienna
    when: Oct. 22
    date: '1961-10-22'
    thread: berlin-and-vienna
    c: Lightner, senior American diplomat in Berlin, stopped at Checkpoint Charlie. Clay sends armed escorts.
    n: '[FRUS 1961–63, XIV, doc. 186](https://history.state.gov/historicaldocuments/frus1961-63v14/d186). [[w.kempe-berlin-1961]]; [[w.smith-lucius-d-clay]]. Names: Lightner, Clay.'
    tags: [name:lightner-e-allan-jr, name:clay-lucius-d]
  - id: cal.1961-10-27.berlin-and-vienna
    when: Oct. 27–28
    date: '1961-10-27'
    thread: berlin-and-vienna
    also: [robert-kennedy]
    c: Soviet and American tanks face each other at Checkpoint Charlie. Sixteen hours. The Soviets pull back first, after Robert Kennedy's word through Bolshakov.
    n: 'FRUS 1961–63, XIV, docs. [195](https://history.state.gov/historicaldocuments/frus1961-63v14/d195), [196](https://history.state.gov/historicaldocuments/frus1961-63v14/d196). [[w.kempe-berlin-1961]]; [[w.fursenko-one-hell-of-a]]; [[w.garthoff-berlin-1961]]. Check. Names: Robert F. Kennedy, Bolshakov.'
    tags: [name:kennedy-robert-f, name:bolshakov-georgi]
  - id: cal.1961-10-29.opinion
    when: Oct. 29
    date: '1961-10-29'
    thread: opinion
    also: [defense]
    c: 'Gallup, Sept. 21–26: 7 percent have made plans or given serious thought to preparing their homes against a nuclear attack.'
    n: '[[w.gallup-poll]], III, 1741.'
  - id: cal.1961-10-30.testing
    when: Oct. 30
    date: '1961-10-30'
    thread: testing
    c: Soviet test of about fifty megatons over Novaya Zemlya. The largest ever.
    n: '[White House Statement Announcing the Explosion by the U.S.S.R. of a 50-Megaton Bomb](https://www.presidency.ucsb.edu/documents/white-house-statement-announcing-the-explosion-the-ussr-50-megaton-bomb). See [[cal.1961-09-01.testing]].'
  - id: cal.1961-10-31.soviet-union
    when: Oct. 31
    date: '1961-10-31'
    thread: soviet-union
    c: 'Twenty-Second Party Congress closes. The new Party Program adopted; Stalin''s body ordered out of the Lenin Mausoleum, removed that night. Through the Congress, Khrushchev''s attacks on Stalin''s crimes, the anti-party group and the Albanian leadership. State''s assessment to all posts, Nov. 8: Khrushchev''s primacy in the bloc reasserted; Albania a thinly veiled challenge to the Chinese.'
    n: 'FRUS 1961–63, V, doc. [127](https://history.state.gov/historicaldocuments/frus1961-63v05/d127). [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]. See [[cal.1961-10-17.berlin-and-vienna]]. Names: Khrushchev.'
    tags: [name:khrushchev-nikita-s]
