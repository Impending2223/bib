# Cal. XII October 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XII
entries:
  - id: cal.1961-10-01.steel
    when: Oct. 1
    date: '1961-10-01'
    thread: steel
    c: The steelworkers' contract step takes effect. The companies hold prices.
    n: See [[cal.1961-09-06.steel]]. The increase they put off comes in April.
  - id: cal.1961-10-01.defense
    when: Oct. 1
    date: '1961-10-01'
    thread: defense
    c: The Defense Intelligence Agency begins work, McNamara's merger of the services' intelligence estimates. Established by directive in August.
    n: See [[cal.1961-02-06.defense]]. Check the dates.
  - id: cal.1961-10-03.states-and-cities
    when: Oct. 3
    date: '1961-10-03'
    thread: states-and-cities
    c: Michigan's constitutional convention opens in Lansing. Romney a vice president of it. Check the date.
    n: 'Sturm (see [[cal.1961-04-03.states-and-cities]]). Names: Romney (Opp. III.H).'
  - id: cal.1961-10-06.berlin-and-vienna
    when: Oct. 6
    date: '1961-10-06'
    thread: berlin-and-vienna
    c: Gromyko at the White House. Two hours on Berlin; neither side moves.
    n: 'FRUS vol. 14. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gromyko (K–J Adm. III.J).'
  - id: cal.1961-10-09.court
    when: Oct. 9
    date: '1961-10-09'
    thread: court
    c: '*Baker v. Carr* reargued. Solicitor General Cox for the United States, as friend of the court, against malapportionment.'
    n: See [[cal.1961-04-19.court]].
  - id: cal.1961-10-11.vietnam
    when: Oct. 11
    date: '1961-10-11'
    thread: vietnam
    c: The NSC puts off the Joint Chiefs' plan for troops in Laos and Vietnam and sends Taylor to Saigon instead. Kennedy announces the mission at his press conference.
    n: 'NSAM No. 104 (Oct. 13, 1961). Check. FRUS vol. 1. Kaiser, *American Tragedy* (Viet. II.B). Taylor, *Swords and Plowshares* (Viet. II.H.1). Names: Taylor, Rostow (Viet. III.A).'
  - id: cal.1961-10-13.peace-corps
    when: Oct. 13
    date: '1961-10-13'
    thread: peace-corps
    c: A volunteer's postcard home from Nigeria, describing squalor in Ibadan, is found and published. Student protests; she leaves the country. Check the date.
    n: See [[cal.1961-03-01.peace-corps]]. Hoffman, *All You Need Is Love* (K–J Adm. II.D).
  - id: cal.1961-10-16.right-and-the-military
    when: Oct. 16
    date: '1961-10-16'
    thread: right-and-the-military
    c: '"Hollywood''s Answer to Communism": Fred Schwarz''s Christian Anti-Communism Crusade fills the Hollywood Bowl, on local television. Check the date.'
    n: McGirr, *Suburban Warriors*; Hendershot, *What's Fair on the Air?* (Opp. II.B). See [[cal.1961-03.right-and-the-military]].
  - id: cal.1961-10-17.berlin-and-vienna
    when: Oct. 17
    date: '1961-10-17'
    thread: berlin-and-vienna
    also: [testing]
    c: Khrushchev opens the Twenty-Second Party Congress. The year's-end deadline for a German treaty dropped; a fifty-megaton test announced.
    n: 'Fursenko & Naftali, *Khrushchev''s Cold War* (K–J Adm. II.D). William Taubman, *Khrushchev: The Man and His Era* (2003).'
  - id: cal.1961-10-18.vietnam
    when: Oct. 18
    date: '1961-10-18'
    thread: vietnam
    c: Taylor and Rostow arrive in Saigon. Diem proclaims a state of emergency. The Mekong floods suggest the cover Taylor will propose for combat troops.
    n: 'The Pentagon Papers (Gravel ed.), vol. 2 (K–J Adm. II.H.3). Newman, *JFK and Vietnam* (Viet. II.B). Names: Ngo Dinh Diem (Viet. III.G); Nolting (Viet. III.C).'
  - id: cal.1961-10-21.defense
    when: Oct. 21
    date: '1961-10-21'
    thread: defense
    c: Gilpatric at Hot Springs, Virginia, to the Business Council. The American second strike is at least as large as any Soviet first strike. The missile gap reversed, in public, for Moscow's benefit.
    n: 'Ball, *Politics and Force Levels*; Kaplan, *Wizards of Armageddon* (K–J Adm. II.D). Names: Gilpatric (K–J Adm. III.F).'
  - id: cal.1961-10-22.berlin-and-vienna
    when: Oct. 22
    date: '1961-10-22'
    thread: berlin-and-vienna
    c: E. Allan Lightner, the senior American diplomat in Berlin, stopped at Checkpoint Charlie on his way to the theater in East Berlin. Clay sends armed escorts through and the probes continue.
    n: Kempe, *Berlin 1961* (K–J Adm. II.D). Smith, *Lucius D. Clay* (see [[cal.1961-08-19.berlin-and-vienna]]).
  - id: cal.1961-10-27.berlin-and-vienna
    when: Oct. 27–28
    date: '1961-10-27'
    thread: berlin-and-vienna
    c: Soviet and American tanks face each other at Checkpoint Charlie for sixteen hours. The Soviets pull back first in the morning, after Robert Kennedy's message through Bolshakov.
    n: 'Kempe; Fursenko & Naftali, *"One Hell of a Gamble"* (K–J Adm. II.D). Raymond L. Garthoff, *Berlin 1961: The Record Corrected*, 84 Foreign Pol''y 142 (1991). Check. Names: Bolshakov (K–J Adm. III.J).'
  - id: cal.1961-10-30.testing
    when: Oct. 30
    date: '1961-10-30'
    thread: testing
    c: The Soviet Union explodes a device of some fifty megatons over Novaya Zemlya, the largest ever.
    n: See [[cal.1961-09-01.testing]].
