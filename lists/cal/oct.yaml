# Cal. XII October 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XII
entries:
  - id: cal.1961-10-01.steel
    when: Oct. 1
    date: '1961-10-01'
    thread: steel
    c: The steelworkers' October wage step. Prices hold.
    n: See [[cal.1961-09-06.steel]].
  - id: cal.1961-10-01.defense
    when: Oct. 1
    date: '1961-10-01'
    thread: defense
    c: Defense Intelligence Agency activated. Check the date.
    n: 'See [[cal.1961-02-06.defense]]. Names: McNamara (K–J Adm. III.F).'
  - id: cal.1961-10-03.states-and-cities
    when: Oct. 3
    date: '1961-10-03'
    thread: states-and-cities
    c: Michigan's constitutional convention opens at Lansing. Romney a vice president. Check the date.
    n: 'Sturm (see [[cal.1961-04-03.states-and-cities]]). Names: Romney (Opp. III.H).'
  - id: cal.1961-10-06.berlin-and-vienna
    when: Oct. 6
    date: '1961-10-06'
    thread: berlin-and-vienna
    c: Gromyko at the White House. Berlin; no movement.
    n: 'FRUS vol. 14. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Gromyko (K–J Adm. III.J).'
  - id: cal.1961-10-09.court
    when: Oct. 9
    date: '1961-10-09'
    thread: court
    c: '*Baker v. Carr* reargued. Cox for the United States as amicus.'
    n: 'See [[cal.1961-04-19.court]]. Names: Cox (K–J Cong. III.G).'
  - id: cal.1961-10-11.vietnam
    when: Oct. 11
    date: '1961-10-11'
    thread: vietnam
    c: NSC defers the Joint Chiefs' troop plan for Laos and Vietnam. Taylor to Saigon instead; announced at the press conference.
    n: 'NSAM No. 104 (Oct. 13, 1961). Check. FRUS vol. 1. Kaiser, *American Tragedy* (Viet. II.B.8). Taylor, *Swords and Plowshares* (Viet. II.H.1). See [[cal.1961-01-28.vietnam]]. Names: Taylor, Rostow (Viet. III.A).'
  - id: cal.1961-10-13.peace-corps
    when: Oct. 13
    date: '1961-10-13'
    thread: peace-corps
    c: A volunteer's postcard from Ibadan, describing squalor, found and published. Protests at the university; she goes home. Check the date.
    n: Hoffman, *All You Need Is Love* (K–J Adm. II.D). See [[cal.1961-03-01.peace-corps]].
  - id: cal.1961-10-16.right-and-the-military
    when: Oct. 16
    date: '1961-10-16'
    thread: right-and-the-military
    c: Schwarz's Christian Anti-Communism Crusade fills the Hollywood Bowl, televised. Check the date.
    n: McGirr, *Suburban Warriors*; Hendershot, *What's Fair on the Air?* (Opp. II.B). See [[cal.1961-03.right-and-the-military]].
  - id: cal.1961-10-17.berlin-and-vienna
    when: Oct. 17
    date: '1961-10-17'
    thread: berlin-and-vienna
    also: [testing]
    c: Twenty-Second Party Congress opens. Khrushchev drops the year-end deadline for a German treaty; announces a fifty-megaton test.
    n: 'Fursenko & Naftali, *Khrushchev''s Cold War* (K–J Adm. II.D). William Taubman, *Khrushchev: The Man and His Era* (2003). Names: Khrushchev (K–J Adm. III.J).'
  - id: cal.1961-10-18.vietnam
    when: Oct. 18
    date: '1961-10-18'
    thread: vietnam
    c: Taylor and Rostow in Saigon. Diem declares a state of emergency. Mekong floods.
    n: 'The Pentagon Papers (Gravel ed.), vol. 2 (K–J Adm. II.H.3). Newman, *JFK and Vietnam* (Viet. II.B.8). See [[cal.1961-01-28.vietnam]]. Names: Ngo Dinh Diem (Viet. III.G); Nolting (Viet. III.C).'
  - id: cal.1961-10-21.defense
    when: Oct. 21
    date: '1961-10-21'
    thread: defense
    c: Gilpatric to the Business Council at Hot Springs. The American second strike at least equal to any Soviet first strike. The missile gap reversed.
    n: 'Ball, *Politics and Force Levels*; Kaplan, *Wizards of Armageddon* (K–J Adm. II.D). See [[cal.1961-02-06.defense]]. Names: Gilpatric (K–J Adm. III.F).'
  - id: cal.1961-10-22.berlin-and-vienna
    when: Oct. 22
    date: '1961-10-22'
    thread: berlin-and-vienna
    c: Lightner, senior American diplomat in Berlin, stopped at Checkpoint Charlie. Clay sends armed escorts.
    n: Kempe, *Berlin 1961* (K–J Adm. II.D). Smith, *Lucius D. Clay* (see [[cal.1961-08-19.berlin-and-vienna]]).
  - id: cal.1961-10-27.berlin-and-vienna
    when: Oct. 27–28
    date: '1961-10-27'
    thread: berlin-and-vienna
    c: Soviet and American tanks face each other at Checkpoint Charlie. Sixteen hours. The Soviets pull back first, after Robert Kennedy's word through Bolshakov.
    n: 'Kempe; Fursenko & Naftali, *"One Hell of a Gamble"* (K–J Adm. II.D). Raymond L. Garthoff, *Berlin 1961: The Record Corrected*, 84 Foreign Pol''y 142 (1991). Check. Names: Robert F. Kennedy (K–J Adm. III.A); Bolshakov (K–J Adm. III.J).'
  - id: cal.1961-10-30.testing
    when: Oct. 30
    date: '1961-10-30'
    thread: testing
    c: Soviet test of about fifty megatons over Novaya Zemlya. The largest ever.
    n: See [[cal.1961-09-01.testing]].
