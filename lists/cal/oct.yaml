  - id: cal.1961-10-03.states-and-cities
    when: Oct. 3
    date: '1961-10-03'
    thread: state-constitutions
    c: Michigan's constitutional convention opens at Lansing. Romney a vice president.
    n: '[Michigan Constitutional Convention 1961, *Official Record*, I, 105–114](https://archive.org/details/officialrecordvolume1/page/n106/mode/1up). [[w.sturm-constitution-making-in-michigan]]. See [[cal.1961-04-03.states-and-cities]]. Names: Romney.'
