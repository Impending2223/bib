    n: '[FRUS 1961–63, XIV, doc. 186](https://history.state.gov/historicaldocuments/frus1961-63v14/d186). [[w.kempe-berlin-1961]]; [[w.smith-lucius-d-clay]]. Names: Lightner, Clay (K–J Adm. III.E).'
    tags: [name:lightner-e-allan-jr, name:clay-lucius-d]
