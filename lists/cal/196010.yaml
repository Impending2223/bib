    n: '[FRUS 1958–60, IX, doc. 261](https://history.state.gov/historicaldocuments/frus1958-60v09/d261). [[w.gavin-gold-dollars-and-power]], 46. Reply: [[cal.1960-10-20.economy-2]]. Names: Eisenhower, Adenauer, Anderson, Dillon.'
