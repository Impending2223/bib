    thread: soviet-union-un
    also: [congo]
    c: Hammarskjöld to the Assembly, answering Khrushchev's second attack. He will stay at his post.
    n: 'FRUS 1958–60, II, doc. [204](https://history.state.gov/historicaldocuments/frus1958-60v02/d204) (editorial note). Check: the record of the meeting. See [[cal.1960-09-19.soviet-union]]. Names: Hammarskjöld, Khrushchev.'
