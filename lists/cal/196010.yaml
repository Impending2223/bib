    n: '[[w.kruse-white-flight]], on the Atlanta sit-ins; [[w.schlesinger-robert-kennedy-and-his]], 216 (the arrest at a department store; DeKalb County). [[w.garrow-bearing-the-cross]], 143–48. To check: [[w.branch-parting-the-waters]]; [[w.levingston-kennedy-and-king]]; [[w.wofford-of-kennedys-and-kings]]; [[w.king-daddy-king]]; [[w.bryant-bystander]]; [[w.stern-calculating-visions]]; [[w.brauer-john-f-kennedy-and]]; [[w.thomas-robert-kennedy]]; [[w.white-making-of-the-president]]. Check: Garrow, 144–45, has the truce Saturday, Oct. 22, and the students freed Sunday, Oct. 23. Names: Martin Luther King, Hartsfield.'
