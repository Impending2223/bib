  - id: cal.1960-10-14.vietnam
    when: Oct. 14
    date: '1960-10-14'
    thread: vietnam
    c: 'Durbrow reads Diệm a paper of suggestions, cleared by State Oct. 7: send his brother Nhu and Trần Kim Tuyến abroad; bring opposition men into the cabinet; let the Assembly investigate officials. Diệm: most of it his own ideas, but the Viet Cong make it hard. The same call: MAAG to train the Civil Guard.'
    n: 'FRUS 1958–60, I, docs. [197](https://history.state.gov/historicaldocuments/frus1958-60v01/d197) (Durbrow''s proposal, Sept. 16), [202](https://history.state.gov/historicaldocuments/frus1958-60v01/d202), [203](https://history.state.gov/historicaldocuments/frus1958-60v01/d203), [204](https://history.state.gov/historicaldocuments/frus1958-60v01/d204), [205](https://history.state.gov/historicaldocuments/frus1958-60v01/d205) (the paper). [[w.miller-misalliance]], 212 (the démarche of Oct. 14: the Nhus and Tuyến abroad, opposition men in the cabinet). Made public: [[w.def-u-s-viet-rels]], Book 10, 1311–16, 1323–24 (1971). [[w.gibbons-u-s-government-and]], I, 341–42. To check: [[w.anderson-trapped-by-success]]; [[w.jacobs-cold-war-mandarin]]; [[w.catton-diems-final-failure]]; [[w.spector-united-states-army-in]]. Names: Durbrow, Diệm, Nhu, Trần Kim Tuyến.'
