entries:
  - id: cal.1960-10-01.elections-1960
    when: Oct. 1
    date: '1960-10-01'
    thread: elections-1960-kennedy
    c: Hyannis Port, Kennedy's last day of rest, by White's account. Five hours with Robert and Joseph Kennedy, Sorensen, O'Donnell, O'Brien, Salinger, Harris, Bailey and Clifford, now in charge of the planning for after the election. The first debate has cancelled Nixon's edge of experience; an Eisenhower rescue to be expected, and ignored; the Republican label to be fixed on Nixon, heir to McKinley, Harding, Hoover, Landon and Dewey. The last three weeks to the Northeast and its suburbs; California two days; Oklahoma added.
    n: '[[w.white-making-of-the-president]], 320–21, 326 (the day of rest); [[w.odonnell-johnny-we-hardly-knew]], 243–44 (the planning meeting at the compound on "that first Saturday in October" for the last month; the plan agreed again at "our October first meeting": Kennedy in the Midwest and the Northeast, the South left to Johnson, two days in California; Eisenhower, when he came in, to be met with courtesy and Nixon pictured as calling for his help; Kennedy apprehensive of Eisenhower''s help; the authors name O''Donnell and Powers present, not the others). Check: the day; [[w.communications-freedom-of-communications-part]], 416–33, prints Kennedy''s remarks at Chicago (City Hall, Lake Meadow, the Polish-American Congress) and at the Minneapolis bean feed, all dated Oct. 1, and nothing for Sept. 30. See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Robert Kennedy, Joseph Kennedy, Sorensen, O''Donnell, O''Brien, Salinger, Harris, Clifford, Nixon, Eisenhower.'
    src:
      c: 96d512f1
      rows:
        - 'w.white-making-of-the-president 320–21: B-H'
        - 'w.white-making-of-the-president 326: A'
        - 'w.odonnell-johnny-we-hardly-knew 243–44: ?'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:kennedy-joseph-p, name:sorensen-theodore-c, name:odonnell-kenneth-p, name:obrien-lawrence-f, name:salinger-pierre, name:harris-louis, name:clifford-clark, name:nixon-richard-m, name:eisenhower-dwight-d]
