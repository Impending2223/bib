  - id: cal.1960-10-19.elections-1960-kennedy
    when: Oct. 19
    date: '1960-10-19'
    thread: elections-1960-kennedy
    also: [cuba]
    c: 'The evening. Goodwin writes a statement on Cuba for Kennedy and shows it to Sorensen and Salinger: an answer to Nixon on Kennedy''s "softness." Kennedy gone to bed; they release it without his seeing it, by Schlesinger''s account the only time in the campaign. Kennedy later: he would have changed "fighters for freedom" to "forces of freedom."'
    n: '[[w.schlesinger-thousand-days-1965]], 72–73; [[w.goodwin-remembering-america]], 124–26 (Kennedy, "en route to New York," asks for "a real blast for Nixon"; that evening Goodwin types the statement in the staff room of the Biltmore; telephones Kennedy at the Carlyle, asleep; none has "the heart to wake" him; "the only public statement by the candidate in the entire campaign that he had not personally reviewed"; Kennedy later: "It was the words ''freedom fighters'' ... that''s what caused the problem"; not Sorensen or Salinger by name, "softness," or the change of words). The statement: [[cal.1960-10-20.cuba]]. Names: Goodwin, Kennedy, Sorensen, Salinger, Nixon.'
    src:
