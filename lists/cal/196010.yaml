    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    also: [labor]
    c: 'New York, Union Square, the Amalgamated Clothing Workers'' rally. Kennedy with Potofsky, Lehman, Vanden Heuvel, Levitt and Mayor Wagner, quoting Roosevelt at Franklin Field in 1936: "Governments can err, Presidents do make mistakes."'
    n: 'Remarks of Senator John F. Kennedy, Union Square, New York, NY, Amalgamated Clothing Workers Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-union-square-new-york-ny-amalgamated-clothing-workers-rally) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 770–72. Names: Kennedy, Vanden Heuvel, Levitt, Wagner.'
