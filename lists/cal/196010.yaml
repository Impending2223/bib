    c: 'The Yinian Tang. Mao receives Edgar Snow, at dinner; Gong Peng, Rewi Alley and George Hatem present. China too little studies America: the Academy should have an institute on it. Quemoy and Matsu in Kennedy''s and Nixon''s debates: China lets Chiang hold them, will not cut his supplies, might even send some; it wants the whole of Taiwan, the Pescadores, Quemoy and Matsu; perhaps two more spans of eleven years. A visit to America, perhaps at ninety-seven.'
