    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    also: [farm]
    c: 'Wichita, Kans., Lawrence Stadium. Kennedy with Gov. Docking, for Theis for the Senate: Nixon''s headquarters count Kansas among its "sure" States. On farm policy, Benson''s, and Nixon''s support price tied to the market price; Nixon''s claim in New Jersey that food prices would rise 25 percent, against 2 cents of the wheat in a loaf of bread.'
    n: 'Remarks of Senator John F. Kennedy, Lawrence Stadium, Wichita, KS, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-lawrence-stadium-wichita-ks) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 697–99. Names: Kennedy, Docking, Nixon, Benson.'
