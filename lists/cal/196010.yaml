  - id: cal.1960-10-23.elections-1960-kennedy
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-kennedy
    also: [cuba]
    c: 'Kennedy, by telephone from Wisconsin, asks Schlesinger, leaving Boston for Chicago, to call Reston and Lippmann: by "support from our Government" he meant moral and psychological support, not military, within the OAS. Reston, on Nixon''s train, not reached. Lippmann: the Kennedy people are trying to play the issue both ways and deserve to be called on it.'
    n: '[[w.schlesinger-thousand-days-1965]], 73 (Schlesinger''s account); [[w.schlesinger-journals]], 91 (Kennedy had been trying to call Schlesinger from Madison, Wisconsin, as he was leaving for Chicago; Schlesinger called back; Kennedy wanted Reston and Lippmann told that by support he meant moral and psychological support, not political or military, within the OAS; Reston not reached (on the Nixon train); Lippmann the next day not impressed, thinking "the Kennedy people had been trying to play the issue both ways and deserved to be called on it"; not the words "support from our Government"). See [[cal.1960-10-20.cuba]]. Names: Kennedy, Schlesinger, Reston, Lippmann, Nixon.'
    src:
      c: f28b583e
      rows:
        - 'w.schlesinger-thousand-days-1965 73: all'
        - 'w.schlesinger-journals 91: B, C'
    tags: [name:kennedy-john-f, name:schlesinger-arthur-m-jr, name:reston-james, name:lippmann-walter, name:nixon-richard-m]
  - id: cal.1960-10-23.elections-1960-kennedy-2
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-kennedy
    c: 'Green Bay, Wis., morning, before the Packers game. Kennedy with Gov. Nelson, Lt. Gov. Nash and Attorney General Reynolds: "I don''t mind running against Mr. Nixon, but I have good enough sense not to run against the Green Bay Packers." Fifteen million substandard homes; average social security check "less than $78 a month."'
    n: 'Remarks of Senator John F. Kennedy, Green Bay, WI, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-green-bay-wi) (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 708–11. Names: Kennedy, Nelson, Reynolds, Nixon, Nash.'
    tags: [name:kennedy-john-f, name:nelson-gaylord-a, name:reynolds-john-w-jr, name:nixon-richard-m, name:nash-philleo, state:wi]
  - id: cal.1960-10-23.elections-1960-kennedy-3
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-kennedy
    also: [civil-rights-the-executive, latin-america]
    c: 'Madison, Wis., University of Wisconsin Fieldhouse. Kennedy with Kastenmeier, Gov. Nelson and Proxmire: which Nixon is he running against, the Republican of Arizona or the man who says "party labels don''t mean anything." Repeats the first debate''s Negro and white children; the United States "14th country" in radio broadcasts to Africa; 26 Negroes in a foreign service of 6,000.'
    n: 'Speech of Senator John F. Kennedy, Fieldhouse, University of Wisconsin, Madison, WI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-fieldhouse-university-wisconsin-madison-wi) (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 712–16. Names: Kennedy, Kastenmeier, Nelson, Proxmire, Nixon.'
    tags: [name:kennedy-john-f, name:kastenmeier-robert-w, name:nelson-gaylord-a, name:proxmire-william, name:nixon-richard-m, state:wi, city:madison]
  - id: cal.1960-10-23.elections-1960-kennedy-4
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-kennedy
    also: [farm]
    c: 'La Crosse, Wis., airport. Kennedy with Gov. Nelson and Proxmire, for Norman Clapp for Congress: "I have spent more time in the Third District than any candidate for the Presidency since George Washington." Farm productivity up 6 percent a year, demand 3; Nixon''s New Jersey claim of a 25 percent rise in food prices; the farmer''s 2 cents of a loaf.'
    n: 'Remarks of Senator John F. Kennedy, La Crosse, WI, Airport, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-la-crosse-wi-airport) (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 717–20. Names: Kennedy, Nelson, Proxmire, Nixon, Clapp.'
    tags: [name:kennedy-john-f, name:nelson-gaylord-a, name:proxmire-william, name:nixon-richard-m, name:clapp-norman-m, state:wi]
  - id: cal.1960-10-23.elections-1960-kennedy-5
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-kennedy
    also: [cuba]
    c: 'Milwaukee, evening. Kennedy with Gov. Nelson, Lt. Gov. Nash, Zablocki and Reuss: "Here in Wisconsin this campaign began last winter, and I think it ought to end right here"; the State''s motto "Forward." Asked about Castro, he says the chance was lost in 1957 when the United States did not press Batista for free elections.'
    n: 'Speech of Senator John F. Kennedy, Milwaukee, WI, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-milwaukee-wi) (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 721–25. Names: Kennedy, Nelson, Zablocki, Reuss, Nash, Castro.'
    tags: [name:kennedy-john-f, name:nelson-gaylord-a, name:zablocki-clement-j, name:reuss-henry-s, name:nash-philleo, name:castro-fidel, state:wi, city:milwaukee]
  - id: cal.1960-10-23.elections-1960-debates
    when: Oct. 23
    date: '1960-10-23'
    thread: elections-1960-debates
    also: [elections-1960-kennedy, cuba]
    c: 'Kennedy by telegram to Nixon, in reply to Nixon''s of the day: "glad you have finally accepted my challenge" to a fifth debate; he objects to Nixon''s limit to Cuba, "to limit the subject of the fifth to one country would be to subvert the purpose of such a debate." He instructs Leonard Reinsch to meet Nixon''s staff on the details.'
    n: 'Text of a Telegram To Vice President Richard M. Nixon from Senator John F. Kennedy on Fifth Debate, [APP](https://www.presidency.ucsb.edu/documents/text-telegram-vice-president-richard-m-nixon-from-senator-john-f-kennedy-fifth-debate) (Oct. 23, 1960). Text of a Telegram To Vice President Richard M. Nixon from Senator John F. Kennedy on Fifth Debate, [APP](https://www.presidency.ucsb.edu/documents/text-telegram-vice-president-richard-m-nixon-from-senator-john-f-kennedy-fifth-debate) (Oct. 23, 1960). [[w.communications-freedom-of-communications-part]], 726. Names: Kennedy, Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m]
  - id: cal.1960-10-23.china-leadership
    when: Oct. 23
    date: '1960-10-23'
    thread: china-leadership
    c: 'Diaoyutai, Building 18, evening. Mao''s meeting on farming with the first secretaries of North and Central-South China, called at 2:30 that morning: the peasants'' lives, against the "communist wind"; Chen Zhengren on Shandong''s grave state. Liu Shaoqi, Zhou Enlai, Li Fuchun, Li Xiannian, Tan Zhenlin, Tao Zhu and others present.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 23, 1960. Made public: 2013. Names: Mao Zedong, Chen Zhengren, Liu Shaoqi, Zhou Enlai, Li Fuchun, Li Xiannian, Tan Zhenlin, Liao Luyan, Tao Zhu, Wang Renzhong, Wu Zhipu.'
    tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:li-fuchun, name:li-xiannian, name:tan-zhenlin, name:tao-zhu, vis:only:prc]
