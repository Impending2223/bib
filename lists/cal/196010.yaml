    c: 'Pottsville, Pa., morning. Kennedy with Gov. Lawrence and Sen. Clark: the depressed areas bill, passed and vetoed by Eisenhower; Lawrence, Mass., had 30 percent unemployment for four years. He asks Nixon to come to Pottsville and run on "You''ve never had it so good."'
    n: 'Remarks of Senator John F. Kennedy, Pottsville, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-pottsville-pa) (Oct. 28, 1960). [[w.communications-freedom-of-communications-part]], 790–92. Names: Kennedy, Lawrence, Clark, Nixon, Eisenhower.'
