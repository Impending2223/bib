    c: 'New York, Madison Square Garden. Kennedy to the Brotherhood of Electrical Workers, Mayor Wagner present: economic growth for the year''s first nine months "minus 0.3 percent"; "25,000 new jobs a week" to be found for ten years; 90 percent of Republicans against social security in 1935 and against the 25-cent minimum wage. Nixon "stands in this century where McKinley stood and Harding and Coolidge and Landon and Dewey."'
