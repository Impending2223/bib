  - id: cal.1960-10-11.conservative-movement
    when: Oct. 11
    date: '1960-10-11'
    thread: conservative-movement
    also: [elections-1960]
    c: 'Buckley settles *National Review*''s course: no endorsement of Nixon and no call to abstain. Burnham had argued, Oct. 9, that conservatives must be for Nixon against the forces behind Kennedy; Rusher, Oct. 10, for working outside the parties. Buckley to Burnham: conservatives gain by keeping their distance, and no one can be for Nixon with reservations, "I don''t think the system permits this."'
    n: '[[w.gifford-center-cannot-hold]], 120–22. To check: Burnham to Buckley, inter-office memorandum, Oct. 9, 1960, William F. Buckley Jr. Papers, MS 576, Correspondence, 1960, Box 10, Yale University (cited by [[w.gifford-center-cannot-hold]], 122 n.82); Rusher to Buckley, inter-office memorandum, Oct. 10, 1960, William F. Buckley Jr. Papers, MS 576, Yale University (cited by [[w.gifford-center-cannot-hold]], 122 n.83); Buckley to Burnham, inter-office memorandum, Oct. 11, 1960, William F. Buckley Jr. Papers, MS 576, Yale University (cited by [[w.gifford-center-cannot-hold]], 122 n.84). Names: Buckley, Nixon, Kennedy, Rusher.'
