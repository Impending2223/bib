    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    also: [immigration]
    c: 'Brooklyn, the Banner Democratic Club, 12th District, a monsignor present. Kennedy: the district "was the first district to endorse me"; the McCarran-Walter Act lets in 50,000 Englishmen and 570 Italians; Nixon "voted for that bill and voted to override Truman''s veto," he "voted against it and voted to sustain the veto."'
    n: 'Remarks of Senator John F. Kennedy, Banner Democratic Club, 12th District, Brooklyn, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-banner-democratic-club-12th-district-brooklyn-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 779–80. Names: Kennedy, Nixon, Truman.'
