    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'Rock Island, Ill. Kennedy''s excerpts: not the missile gap or the economic gap but "the ''Nixon gap,'' the difference between Mr. Nixon''s campaign promises and his actual record." Nixon''s farm promises against his votes: six times in three years against Democratic soil conservation appropriations.'
    n: 'Excerpts of Remarks by Senator John F. Kennedy at Rock Island, IL, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-rock-island-il) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 741–44. Names: Kennedy, Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, state:il]
  - id: cal.1960-10-24.soviet-union-leadership
    when: Oct. 24
    date: '1960-10-24'
    thread: soviet-union-leadership
    also: [space]
    c: 'Baikonur. A rocket explodes on the pad: 126 dead, Nedelin, the commander, among them. Brezhnev heads the commission of inquiry and goes to the site at once; on his return he reports to Khrushchev an unforeseen accident, a tragic chain of events, and advises that no one be held responsible and rocket building go on.'
    n: '[[w.schattenberg-brezhnev]], 152 (nn.286–89). To check: B. Chertok, *Raketen und Menschen*, 380, 382; S. Khrushchev, *Geburt einer Supermacht*, 364–65 (cited by [[w.schattenberg-brezhnev]], 152 nn.286–89). Made public: 2021 at the latest. Made public: 2021 at the latest. Names: Nedelin, Brezhnev, Khrushchev. Check: the days of Brezhnev''s trip and report.'
    tags: [name:brezhnev-leonid, name:khrushchev-nikita-s, polity:ussr, vis:only:ussr]
