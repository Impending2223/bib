    when: Oct. 24
    date: '1960-10-24'
    thread: china-leadership
    also: [soviet-union]
    c: 'The Yinian Tang, 8 p.m. Mao''s meeting of the Standing Committee, the Secretariat and the first secretaries of North and Central-South China, with Chen Yi and Chen Boda, hears Deng Xiaoping and Peng Zhen, back that afternoon, on the drafting commission of twenty-six parties at Moscow, Oct. 1–22: the Soviet draft the basis; argued; most agreed, some points still open.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 24, 1960, and note 131. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Peng Zhen, Chen Yi, Chen Boda.'
