    n: '[Text of a Telegram Sent to Hon. Stanley Mosk, Attorney General for the State of California, by Senator John F. Kennedy](https://www.presidency.ucsb.edu/documents/text-telegram-sent-hon-stanley-mosk-attorney-general-for-the-state-california-senator-john) (Oct. 6, 1960). [[w.communications-freedom-of-communications-part]], 516–517. Names: Kennedy, Mosk.'
