  - id: cal.1960-10-21.soviet-union-leadership
    when: Oct. 21
    date: '1960-10-21'
    thread: soviet-union-leadership
    c: 'The Presidium, Khrushchev in the chair, on calling a plenum on agriculture: the year''s results and 1961. In the notes: last year''s pledges not met; perhaps new cadres, the old aging; the Agricultural Academy does nothing; weeds on the virgin lands, herbicides or clean fallow, "иначе дело придет к краху" (otherwise it will end in collapse). Resolved: a commission under Matskevich to prepare the plenum, a report from each republic; Kosygin''s group on the grain balance; the Secretariat to set the date.'
    n: 'Protocol 307, item I. [[w.prezidium-tsk-kpss-1954]], I, 446–47 (Malin''s notes), 1080 nn.1–2 (the plenum first set for Dec. 13, then Jan. 10, 1961); III, 133–34 (P 307/I). Made public: 2003. Names: Khrushchev, Matskevich, Kosygin.'
    tags: [name:khrushchev-nikita-s, name:kosygin-aleksei, polity:ussr, name:matskevich-vladimir-v]
