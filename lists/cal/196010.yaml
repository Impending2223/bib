  - id: cal.1960-10-06.cuba
    when: Oct. 6
    date: '1960-10-06'
    thread: cuba
    also: [elections-1960-kennedy, latin-america]
    c: 'Cincinnati, the Democratic dinner. Kennedy''s speech on Cuba, "the most glaring failure of American foreign policy today": the Castro revolution''s promises broken, a Communist satellite 90 miles from the coast. He cites the testimony of Ambassadors Gardner and Smith that their warnings were ignored, and finds the administration''s errors fourfold, among them arms to Batista and the end of Spanish-language Voice of America broadcasts. "For the present, Cuba is gone"; he has "no basic disagreement with the President''s policies of recent months," would work through the OAS, and would defend Guantanamo "under all circumstances."'
    n: '[Speech of Senator John F. Kennedy, Cincinnati, Ohio, Democratic Dinner](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cincinnati-ohio-democratic-dinner) (Oct. 6, 1960). [[w.communications-freedom-of-communications-part]], 510–516. Names: Kennedy, Castro, Batista, Gardner, Smith.'
    tags: [name:kennedy-john-f, name:castro-fidel, name:batista-y-zaldivar-fulgencio, name:smith-earl-e-t, name:gardner-arthur, state:oh, city:cincinnati]
