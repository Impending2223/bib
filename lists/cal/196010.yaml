-kennedy-v-nixon]], 153–55. [[w.nixon-six-crises]], 362 (Robert Kennedy''s call to the judge). Check: Thomas, from Vandiver''s account, has Robert Kennedy call Mitchell at his brother''s instruction, through Vandiver, probably from a telephone booth in New York (102–03); Robert Kennedy''s own account of 1964, at Vandiver''s suggestion (103 n.). Check: the days. [[w.goodwin-remembering-america]], 121–22, has King arrested Oct. 19, "taken immediately to court" and sentenced to four months at hard labor; Kennedy''s call to Coretta King "the morning after King''s imprisonment," at his brother''s suggestion, as he began to prepare for the fourth debate (Oct. 21); and King released "that day.". See [[cal.1960-10-19.king]]. Check: Nixon gives the sentence as of Oct. 26 (*Six Crises*, 362). Names: Martin Luther King, Kennedy, Coretta Scott King, Martin Luther King Sr., Robert Kennedy, Wofford, Shriver, Oscar Mitchell. Check: Kallina, 153, has Mitchell sentence King on Monday, Oct. 24; the call to Mrs. King Shriver''s and Louis Martin''s idea, Shriver placing it. By Kallina''s account, after Vandiver''s (154), Kennedy first called Vandiver, who arranged through Robert Russell and George Stewart that Mitchell would free King on Robert Kennedy''s call.'
