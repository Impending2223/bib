  - id: cal.1960-10-03.elections-1960
    when: Oct. 3–6
    date: '1960-10-03'
    thread: elections-1960-nixon
    c: 'Nixon''s swing continued: Richmond, Va., and Charlotte, Oct. 3; New Jersey, Hackensack, N.J., West Orange, N.J., Elizabeth, Newark, N.J., Plainfield, N.J., and Paterson, Oct. 4; Philadelphia and New York, Oct. 5; Nashville and Cleveland, Oct. 6.'
    n: 'Partial Transcript of Remarks by the Vice President, Capitol Square, Richmond, VA, [APP](https://www.presidency.ucsb.edu/documents/partial-transcript-remarks-the-vice-president-capitol-square-richmond-va); Partial Transcript of Speech by the Vice President, Coliseum, Charlotte, NC, [APP](https://www.presidency.ucsb.edu/documents/partial-transcript-speech-the-vice-president-coliseum-charlotte-nc); Partial Transcript of Speech by the Vice President, Armory, West Orange, NJ, [APP](https://www.presidency.ucsb.edu/documents/partial-transcript-speech-the-vice-president-armory-west-orange-nj); Excerpts of Remarks by the Vice President, War Memorial Square, Nashville, TN, [APP](https://www.presidency.ucsb.edu/documents/excerpts-remarks-the-vice-president-war-memorial-square-nashville-tn). [[w.nixon-six-crises]], 342–43. See [[cal.1960-09-28.elections-1960]]. Names: Nixon. Check: the places, from APP''s list.'
    src:
      c: 4604a357
      rows:
