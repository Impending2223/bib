  - id: cal.1960-10-01.elections-1960
    when: Oct. 1
    date: '1960-10-01'
    thread: elections-1960-kennedy
    c: Hyannis Port, Kennedy's last day of rest, by White's account. Five hours with Robert and Joseph Kennedy, Sorensen, O'Donnell, O'Brien, Salinger, Harris, Bailey and Clifford, now in charge of the planning for after the election. The first debate has cancelled Nixon's edge of experience; an Eisenhower rescue to be expected, and ignored; the Republican label to be fixed on Nixon, heir to McKinley, Harding, Hoover, Landon and Dewey. The last three weeks to the Northeast and its suburbs; California two days; Oklahoma added.
    n: '[[w.white-making-of-the-president]], 320–21, 326 (the day of rest). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Robert Kennedy, Joseph Kennedy, Sorensen, O''Donnell, O''Brien, Salinger, Harris, Clifford, Nixon, Eisenhower.'
    src:
      c: 96d512f1
      rows:
        - 'w.white-making-of-the-president 320–21: B-H'
        - 'w.white-making-of-the-president 326: A'
    tags: [name:kennedy-john-f, name:kennedy-robert-f, name:kennedy-joseph-p, name:sorensen-theodore-c, name:odonnell-kenneth-p, name:obrien-lawrence-f, name:salinger-pierre, name:harris-louis, name:clifford-clark, name:nixon-richard-m, name:eisenhower-dwight-d]
