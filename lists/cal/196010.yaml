    thread: elections-1960-kennedy
    c: 'Hazleton, Pa. Kennedy with Gov. Lawrence, Sen. Clark and Rep. Flood: homes 30 percent fewer than a year ago, steel mills at 50 percent "and that affects the job of every miner."'
    n: 'Remarks of Senator John F. Kennedy, Hazleton, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-hazleton-pa) (Oct. 28, 1960). [[w.communications-freedom-of-communications-part]], 792–94. Names: Kennedy, Lawrence, Clark, Flood.'
