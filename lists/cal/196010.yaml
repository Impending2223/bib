    c: 'Kennedy to Mrs. Emma Guffey Miller, chairman of the National Woman''s Party, on the equal rights amendment: "The platform has my full support." He will interpret the Democratic platform to bring about, "through concrete actions including the adoption of the equal rights for women amendment, the full equality for women."'
    n: 'Letter to Mrs. Emma Guffey Miller, Chairman of the National Woman''s Party, [APP](https://www.presidency.ucsb.edu/documents/letter-mrs-emma-guffey-miller-chairman-the-national-womans-party) (Oct. 21, 1960). [[w.communications-freedom-of-communications-part]], 689. Names: Kennedy.'
