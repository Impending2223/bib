  - id: cal.1960-10-03.latin-america-dominican-republic
    when: Oct. 3
    date: '1960-10-03'
    thread: latin-america-dominican-republic
    c: 'A CIA memorandum, "Plans of the Dominican Internal Opposition and Dominican Desk for Overthrow of the Trujillo Government": plans "which appear feasible and which might be carried out ∗ ∗ ∗ covertly by CIA with a minimal risk of exposure." About 300 rifles and pistols, ammunition and grenades to a cache 14 miles east of Ciudad Trujillo; a remote-control detonating device "which could be planted by the dissidents in such manner as to eliminate certain key Trujillo henchmen."'
    n: '[[w.sen-church-alleged-assassination-plots]], 196 (the memorandum, dated Oct. 3). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, Oct. 3, 1960, "Plans of the Dominican Internal Opposition and Dominican Desk for Overthrow of the Trujillo Government" (cited by [[w.sen-church-alleged-assassination-plots]], 196). See [[cal.1960-09-08.latin-america-dominican-republic]]. Names: Trujillo.'
    tags: [name:trujillo-rafael]
  - id: cal.1960-10-03.elections-1960-kennedy
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'Alton, Ill., the town square. Kennedy, with Kerner, Douglas and Price, on the last Lincoln-Douglas debate held there: "A house divided against itself" and the world "half slave and half free." Nixon, he says, stands where McKinley, Harding, Coolidge, Hoover, Dewey and Landon stood.'
    n: '[Remarks of Senator John F. Kennedy, Alton, IL, Town Square](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-alton-il-town-square) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 451–452. Names: Kennedy, Kerner, Douglas, Price, Nixon, Dewey.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, name:dewey-thomas-e, name:price-charles-m, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-2
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'Granite City, Ill., an auto rally. Kennedy, with Price, Douglas and Symington: the lowest rate of economic growth last year of any major industrialized society; steel mills at 50 percent of capacity; unemployment higher than in any month since 1945 except in the recessions of 1949, 1954 and 1958.'
    n: '[Remarks of Senator John F. Kennedy, Granite City, IL, Auto Rally](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-granite-city-il-auto-rally) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 452–453. Names: Kennedy, Douglas, Price, Symington.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:symington-william-s, name:price-charles-m, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-3
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'East St. Louis, Ill., an auto rally at 15th and Broadway. Kennedy, with Douglas, Kerner and Price: the President sets the goals in housing, the minimum wage, Social Security and equal rights.'
    n: '[Remarks of Senator John F. Kennedy, Auto Rally, 15th and Broadway, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-auto-rally-15th-and-broadway-east-st-louis-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 453–454. Names: Kennedy, Douglas, Price, Kerner.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:kerner-otto, name:price-charles-m, state:il, city:east-st-louis]
  - id: cal.1960-10-03.farm
    when: Oct. 3
    date: '1960-10-03'
    thread: farm
    also: [elections-1960-kennedy]
    c: 'East St. Louis, the National Stockyards. Kennedy, with Douglas, Kerner and Price: International Harvester and John Deere plants closed that day; farm income down "almost 20 to 25 percent" in a few years.'
    n: '[Remarks of Senator John F. Kennedy, National Stockyards, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-national-stockyards-east-st-louis-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 454–455. Names: Kennedy, Douglas, Price, Kerner.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:kerner-otto, name:price-charles-m, state:il, city:east-st-louis]
  - id: cal.1960-10-03.elections-1960-kennedy-4
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'East St. Louis, the main intersection, from the roof of a car. Kennedy, with Kerner, Price and Douglas: the $1.25 minimum wage, housing vetoes, medical care for the aged, equal opportunity; Nixon''s slogan, "You never had it so good."'
    n: '[Remarks of Senator John F. Kennedy, Main Intersection, East St. Louis, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-main-intersection-east-st-louis-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 455–456. Names: Kennedy, Kerner, Douglas, Price, Nixon.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, name:price-charles-m, state:il, city:east-st-louis]
  - id: cal.1960-10-03.elections-1960-kennedy-5
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: Belleville, Ill., Augustine's Restaurant, a lunch stop. Kennedy, with Douglas and Price, presents Maurer, of his PT boat crew (first seen in 17 years), and Mr. and Mrs. Zinser, parents of another crewman; the choice, he says, is "between standing still and moving forward."
    n: '[Remarks of Senator John F. Kennedy, Augustine''s Restaurant, Belleville, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-augustines-restaurant-belleville-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 456–457. Names: Kennedy, Douglas, Price.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:price-charles-m, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-6
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'Belleville, Ill. (the report prints "Belleview"), in front of the Republican headquarters. Kennedy, with Kerner, Douglas and Price: the overriding issue is "how we can maintain our freedom"; the world judging, from Sputnik on, that the Soviet Union is moving ahead.'
    n: '[Remarks of Senator John F. Kennedy, Belleville, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-belleville-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 457–459. Names: Kennedy, Kerner, Douglas, Price.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:price-charles-m, state:il, polity:ussr]
  - id: cal.1960-10-03.elections-1960-kennedy-7
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    also: [economy]
    c: 'Carbondale, Ill., the Southern Illinois University stadium. Kennedy, with Gray, Douglas and Kerner: nearly 5 million out of work and nearly 3 million on part time; in 1959 "our economic growth was about one-third that of the Soviet Union and one-half that of Germany, Italy, and France."'
    n: '[Speech of Senator John F. Kennedy, Southern Illinois University Stadium, Carbondale, IL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-southern-illinois-university-stadium-carbondale-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 459–462. Names: Kennedy, Gray, Douglas, Kerner.'
    tags: [name:kennedy-john-f, name:gray-kenneth-j, name:douglas-paul-h, name:kerner-otto, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-8
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    also: [economy]
    c: 'Marion, Ill., the Marion County court house. Kennedy, with Douglas, Gray and Kerner: the area redevelopment bill vetoed twice, "this bill will become law next year"; $9 billion of food stored; steel mills at half capacity, 100,000 steelworkers out of work.'
    n: '[Remarks of Senator John F. Kennedy, Marion County Court House, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-marion-county-court-house-marion-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 462–464. Names: Kennedy, Douglas, Gray, Kerner.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:gray-kenneth-j, name:kerner-otto, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-9
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'Marion, Ill., the Veterans'' Hospital. Kennedy, with Gray, Powell, Douglas and Kerner, recalls his years on the Senate Veterans'' Committee: hospitals like this one "must continue to grow."'
    n: '[Remarks of Senator John F. Kennedy, Veteran''s Hospital, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-veterans-hospital-marion-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 464. Names: Kennedy, Gray, Douglas, Kerner.'
    tags: [name:kennedy-john-f, name:gray-kenneth-j, name:douglas-paul-h, name:kerner-otto, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-10
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    c: 'Marion, Ill., the airport. Kennedy, with Gray, Powell, Douglas and Kerner: Nixon "last Thursday night in Boston" called him "another Truman"; he called Nixon another Dewey. It is "about the 14th speech I have made today," and Springfield is next, on statewide television at 9 o''clock.'
    n: '[Remarks of Senator John F. Kennedy, Airport, Marion, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-airport-marion-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 464–465. Names: Kennedy, Gray, Douglas, Kerner, Nixon, Truman, Dewey.'
    tags: [name:kennedy-john-f, name:gray-kenneth-j, name:douglas-paul-h, name:kerner-otto, name:nixon-richard-m, name:truman-harry-s, name:dewey-thomas-e, state:il]
  - id: cal.1960-10-03.farm-2
    when: Oct. 3
    date: '1960-10-03'
    thread: farm
    also: [elections-1960-kennedy]
    c: 'Harrisburg, Ill. Kennedy, with Kerner, Douglas, Gray and Powell: "another Truman" and "another Dewey" again; $9 billion of surplus food stored while over 4 million look to the Government for surplus food; the administration''s policy of a steady drop of support prices.'
    n: '[Remarks of Senator John F. Kennedy, Harrisburg, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-harrisburg-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 465–467. Names: Kennedy, Kerner, Douglas, Gray, Truman, Dewey.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:gray-kenneth-j, name:truman-harry-s, name:dewey-thomas-e, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-11
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    also: [jobs-and-wages, medicare]
    c: 'Venice, Ill. Kennedy, with Kerner, Douglas and Price, on Nixon''s "parties don''t make much difference": the Republicans voted almost unanimously against the 25-cent minimum wage in 1935 and against $1.25 in 1960, and 95 to 1 in the House against the Social Security bill in 1935.'
    n: '[Remarks of Senator John F. Kennedy, Venice, IL](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-venice-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 467–469. Names: Kennedy, Kerner, Douglas, Price, Nixon.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, name:price-charles-m, state:il]
  - id: cal.1960-10-03.elections-1960-kennedy-12
    when: Oct. 3
    date: '1960-10-03'
    thread: elections-1960-kennedy
    also: [elections-1960-religion, cuba, labor]
    c: 'Springfield, Ill., the Armory, with Kerner, Douglas and Mack. Kennedy: "I trust it will be 1948 all over again"; Nixon, who called him "just another Truman," is "another Dewey." In the questions: his religion would not interfere with his duty under the Constitution, and a President who allowed improper interference "would be subject to impeachment"; Hoffa should be removed from the Teamsters "by either Government action or by the work of its members"; Castro will likely stay "for some time." It is, he says, "the 15th speech we made today."'
    n: '[Speech of Senator John F. Kennedy, Armory, Springfield, IL](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-armory-springfield-il) (Oct. 3, 1960); [Question and Answer Period Following Speech of Senator John F. Kennedy, Armory, Springfield, IL](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-armory-springfield-il) (Oct. 3, 1960). [[w.communications-freedom-of-communications-part]], 469–76 (the speech, 469–73; the questions, 473–76). Names: Kennedy, Kerner, Douglas, Mack, Nixon, Truman, Castro, Dewey, Hoffa.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, name:truman-harry-s, name:castro-fidel, name:dewey-thomas-e, name:mack-peter-f-jr, name:hoffa-james-r, state:il, city:springfield]
  - id: cal.1960-10-04.elections-1960-kennedy
    when: Oct. 4
    date: '1960-10-04'
    thread: elections-1960-kennedy
    c: 'Evansville, Ind., with Welsh, Hartke and Denton. Kennedy: the choice on Nov. 8 resembles 1932 and 1912; "I am not impressed by those who say they can stand up to Khrushchev when Mr. Castro has successfully defied them from 90 miles away."'
    n: '[Remarks of Senator John F. Kennedy, Evansville, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-evansville) (Oct. 4, 1960). [[w.communications-freedom-of-communications-part]], 476–478. Names: Kennedy, Welsh, Hartke, Denton, Khrushchev, Castro.'
    tags: [name:kennedy-john-f, name:welsh-matthew-e, name:hartke-rupert-v, name:khrushchev-nikita-s, name:castro-fidel, name:denton-winfield-k, state:in]
  - id: cal.1960-10-04.elections-1960-kennedy-2
    when: Oct. 4
    date: '1960-10-04'
    thread: elections-1960-kennedy
    also: [soviet-union-u2, cuba]
    c: 'Indianapolis, WTTV, a telecast with Welsh and a panel of Knap (Indianapolis Times), Carroll (South Bend Tribune) and Cadow (UPI). Kennedy: "we are behind in Indiana." Eisenhower showed "good judgment" in refusing a meeting with Khrushchev; he never recommended an apology for the U-2 flight, only an expression of "regrets." On Castro: why was he "permitted to seize control?" He defends the $1.25 minimum wage and says he would have taken the Republicans'' $1.15.'
    n: '[Remarks of Senator John F. Kennedy, Telecast, Wttv, Indianapolis, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-telecast-wttv-indianapolis) (Oct. 4, 1960). [[w.communications-freedom-of-communications-part]], 478–487. Names: Kennedy, Welsh, Eisenhower, Khrushchev, Castro.'
    tags: [name:kennedy-john-f, name:welsh-matthew-e, name:eisenhower-dwight-d, name:khrushchev-nikita-s, name:castro-fidel, state:in, city:indianapolis]
  - id: cal.1960-10-04.elections-1960-kennedy-3
    when: Oct. 4
    date: '1960-10-04'
    thread: elections-1960-kennedy
    c: 'Indianapolis, the Coliseum, with Welsh, Hartke, Schricker, Madden and Barr. Kennedy on Nixon''s "party labels don''t matter": "leap-year progressivism"; Nixon in Boston called him "another Truman," and he answered "another Dewey." The Republicans would not have nominated Wilson, Roosevelt or Truman.'
    n: '[Speech of Senator John F. Kennedy, Auditorium (Coliseum), Indianapolis, IN](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-auditorium-coliseum-indianapolis) (Oct. 4, 1960). [[w.communications-freedom-of-communications-part]], 487–492. Names: Kennedy, Welsh, Hartke, Madden, Barr, Nixon, Truman, Dewey.'
    tags: [name:kennedy-john-f, name:welsh-matthew-e, name:hartke-rupert-v, name:madden-ray-j, name:barr-joseph-w, name:nixon-richard-m, name:truman-harry-s, name:dewey-thomas-e, state:in, city:indianapolis]
  - id: cal.1960-10-04.china-leadership
    when: Oct. 4
    date: '1960-10-04'
    thread: china-leadership
    also: [soviet-union]
    c: 'The Yinian Tang, evening. Mao''s meeting (Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Li Fuchun, Chen Boda) on the CPSU''s draft statement for the parties'' conference, sent from Moscow by the delegation at the drafting commission. The Center''s instruction, received at Moscow (Yang Shangkun''s diary): its errors to be rebutted with force, then a counter-draft.'
    n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 4, 1960, and note 119. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Li Fuchun, Chen Boda, Yang Shangkun, Deng Xiaoping.'
    tags: [polity:prc, name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, name:zhu-de, name:lin-biao, name:li-fuchun, name:chen-boda, name:deng-xiaoping, vis:only:prc]
