    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    c: 'Brooklyn, the Eastern Parkway Arena. Kennedy with Lehman, Mayor Wagner, Celler, Farley, Prendergast and Levitt: a brief speech; what Roosevelt, Wilson and Truman "tried to do, the Republican Party stood against."'
    n: '[[w.communications-freedom-of-communications-part]], 780–82. APP prints only the advance release text of this speech. Names: Kennedy, Wagner, Celler, Levitt, Truman.'
    tags: [name:kennedy-john-f, name:wagner-robert-f-jr, name:celler-emanuel, name:levitt-arthur, name:truman-harry-s, state:ny, city:nyc]
  - id: cal.1960-10-27.elections-1960-kennedy-9
    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    c: 'Queens, Sunnyside Gardens, late. Kennedy with Wagner and Farley: "after 24 years, it is time Queens went Democratic in a presidential election." He leaves for Bethlehem, Pa., closing with a line he gives to Frost, "I will hitch my wagon to a mule."'
    n: 'Speech of Senator John F. Kennedy, Sunnyside Gardens, Queens, NY, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-sunnyside-gardens-queens-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 782–84. Names: Kennedy, Wagner, Frost.'
