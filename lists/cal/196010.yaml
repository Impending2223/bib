  - id: cal.1960-10-22.elections-1960-kennedy
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    c: 'Crestwood, Mo., the shopping center, morning. Kennedy, Symington and Long on the platform: Nixon called him "just another Truman"; "I said I regarded that as a compliment because he was just another Dewey." The balance of power may shift in ten years if "other Cubas in Latin America" follow; Missouri "a key State."'
    n: 'Remarks of Senator John F. Kennedy, Crestwood Shopping Center, Crestwood, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-crestwood-shopping-center-crestwood-mo) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 689–91. Names: Kennedy, Symington, Long, Nixon, Truman.'
    tags: [name:kennedy-john-f, name:symington-william-s, name:long-edward-v, name:nixon-richard-m, name:truman-harry-s, state:mo]
  - id: cal.1960-10-22.elections-1960-kennedy-2
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    also: [elections-1960-debates]
    c: 'Jennings, Mo., Northland Shopping Center. Kennedy reads Eisenhower''s words of Nov. 23, 1953, "meet anyone face to face with whom you disagree," and asks Nixon to accept a fifth debate: "There are 18 days until the election." He names Dalton for governor, Eagleton for attorney general, Long for the Senate.'
    n: 'Remarks of Senator John F. Kennedy, Northland Shopping Center, Jennings, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-northland-shopping-center-jennings-mo) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 691–93. Names: Kennedy, Eisenhower, Nixon, Dalton, Eagleton, Long.'
    tags: [name:kennedy-john-f, name:eisenhower-dwight-d, name:nixon-richard-m, name:dalton-john-m, name:eagleton-thomas-f, name:long-edward-v, state:mo]
  - id: cal.1960-10-22.elections-1960-kennedy-3
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    c: 'St. Louis, the Park Plaza Motel, a Democratic breakfast. Kennedy with Symington, Long and Dalton: no more days off, "for the next 17 days"; Missouri "really is key," his campaign "trying to put together 260-odd votes." He calls it "the smallest breakfast meeting I have spoken to since I became a candidate."'
    n: 'Remarks of Senator John F. Kennedy, Democratic Breakfast, Park Plaza Motel, St. Louis, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-democratic-breakfast-park-plaza-motel-st-louis-mo) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 694. Names: Kennedy, Symington, Long, Dalton.'
    tags: [name:kennedy-john-f, name:symington-william-s, name:long-edward-v, name:dalton-john-m, state:mo, city:st-louis]
  - id: cal.1960-10-22.elections-1960-kennedy-4
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    c: 'Joplin, Mo., airport rally. Kennedy with Symington, Long, Dalton and Eagleton: "a choice between the comfortable and the concerned." He is handed a miner''s hat a size too small; steel mills "50 percent," farm income down over 25 percent in eight years.'
    n: 'Remarks of Senator John F. Kennedy, Joplin, MO, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-joplin-mo-airport-rally) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 695–97. Names: Kennedy, Symington, Long, Dalton, Eagleton.'
    tags: [name:kennedy-john-f, name:symington-william-s, name:long-edward-v, name:dalton-john-m, name:eagleton-thomas-f, state:mo]
