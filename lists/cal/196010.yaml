    n: '[Presidential Debate in Washington, DC](https://www.presidency.ucsb.edu/documents/presidential-debate-washington-dc) (Oct. 7, 1960). [[w.kallina-kennedy-v-nixon]], 126–27 (Quemoy and Matsu); [[w.nixon-rn]], 219–20 (the debate in Washington; Quemoy and Matsu). To check: New York Herald Tribune, Oct. 17, 1960 (cited by [[w.kallina-kennedy-v-nixon]], 127 n.26). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Nixon, Frank McGee.'
