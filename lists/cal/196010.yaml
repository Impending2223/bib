  - id: cal.1960-10-03.south-carolina
    when: Oct. 3
    date: '1960-10-03'
    thread: south-carolina
    also: [elections-1960-nixon]
    c: 'Shorey, the State Republican chairman, to Bassett of the national committee: Nixon''s missed visit to be rescheduled; "South Carolina Democrats for Nixon and Lodge" not cooperating with the party, the ongoing organization.'
    n: '[[w.gifford-center-cannot-hold]], 161 (quoting it). To check: Shorey to James Bassett, Oct. 3, 1960, Series 320, Box 693, "Shorey," Nixon Papers, NALN (cited by [[w.gifford-center-cannot-hold]], 161 n.69). Names: Nixon.'
    src:
      c: 54e43c4d
      rows:
        - 'w.gifford-center-cannot-hold 161: all'
