  - id: cal.1960-10-24.elections-1960-kennedy
    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'Rockford, Ill., the Coronado Theater rally. Kennedy with Kerner and Douglas: "only in Rockford do we have rallies at 1 o''clock in the morning and 9 o''clock in the morning." Goldwater got Nixon in a room in Arizona and told him he is a Republican; Truman''s sign, "The Buck Stops Here."'
    n: 'Remarks of Senator John F. Kennedy, Rockford, IL, Coronado Theater Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-rockford-il-coronado-theater-rally) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 727–31. Names: Kennedy, Kerner, Douglas, Nixon, Goldwater, Truman.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, name:goldwater-barry-m, name:truman-harry-s, state:il]
  - id: cal.1960-10-24.elections-1960-kennedy-2
    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'Champaign-Urbana, Ill., the University of Illinois campus. Kennedy with Kerner and Douglas, to students: on Nixon, that aid to Latin America in 1955 "might not have" meant a Castro; the television debates against the Lincoln-Douglas debates, "What''s Our Line" on Friday nights.'
    n: 'Remarks of Senator John F. Kennedy, University of Illinois Campus, Champaign-Urbana, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-university-illinois-campus-champaign-urbana-il) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 731–34. Names: Kennedy, Kerner, Douglas, Nixon.'
    tags: [name:kennedy-john-f, name:kerner-otto, name:douglas-paul-h, name:nixon-richard-m, state:il]
  - id: cal.1960-10-24.elections-1960-kennedy-3
    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'Peoria, Ill., the courthouse rally, noon. Kennedy with Douglas and Kerner: Nixon runs on "We''ve never had it so good"; 4.5 million out of work, steel mills at 50 percent, farm income down 25 percent. He ends with the story of Colonel Davenport''s call for candles.'
    n: 'Remarks of Senator John F. Kennedy, Courthouse Rally, Peoria, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-courthouse-rally-peoria-il) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 734–37. Names: Kennedy, Douglas, Kerner, Nixon.'
    tags: [name:kennedy-john-f, name:douglas-paul-h, name:kerner-otto, name:nixon-richard-m, state:il]
  - id: cal.1960-10-24.elections-1960-kennedy-4
    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'East Peoria, Ill., the Caterpillar plant, a street rally. Kennedy, briefly: "the Caterpillar lays off 4,000 in the fall of 1960"; 4.5 million out of work, steel mills at 50 percent.'
    n: 'Remarks of Senator John F. Kennedy, Street Rally, Caterpillar Plant, East Peoria, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-street-rally-caterpillar-plant-east-peoria-il) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 737. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:il]
  - id: cal.1960-10-24.elections-1960-kennedy-5
    when: Oct. 24
    date: '1960-10-24'
    thread: elections-1960-kennedy
    c: 'Moline, Ill., the New Fieldhouse. Kennedy with Kerner, Douglas and Iowa''s Democratic candidate for governor: "a contest between the comfortable and the concerned." Khrushchev''s power rests on the Communist system''s productivity; Nixon insists he will carry Illinois.'
    n: 'Remarks of Senator John F. Kennedy, New Fieldhouse, Moline, IL, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-fieldhouse-moline-il) (Oct. 24, 1960). [[w.communications-freedom-of-communications-part]], 737–41. Names: Kennedy, Kerner, Douglas, Nixon, Khrushchev.'
