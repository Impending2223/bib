  - id: cal.1960-10-06.elections-1960-2
    when: Oct. 6
    date: '1960-10-06'
    thread: elections-1960-debates
    c: 'Cleveland, after Nixon''s speech at the Public Hall, the evening before the second debate. Louis Seltzer of the *Cleveland Press*: the speech one of his best; ignore the talk of a New Nixon and an Old; "Take the offensive from the first, with the gloves off." In the speech: the American people "do not want, they must not have, a compulsory health insurance plan forced down their throats."'
    n: 'Partial Transcript of Speech by the Vice President, Public Hall, Cleveland, OH, [APP](https://www.presidency.ucsb.edu/documents/partial-transcript-speech-the-vice-president-public-hall-cleveland-oh) (Oct. 6, 1960). [[w.nixon-six-crises]], 343 (by Nixon''s account). [[w.sundquist-politics-and-policy]], 308 (the speech on health insurance). To check: *The Speeches of Vice President Richard M. Nixon, Presidential Campaign of 1960*, S. Rept. 994, 87th Cong., 1st sess. (1961), pt. 2, 477–78 (cited by [[w.sundquist-politics-and-policy]], 308 n.59). See [[cal.1960-10-03.elections-1960]]. Names: Nixon.'
