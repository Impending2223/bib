    n: 'Remarks of Senator John F. Kennedy, Temple University, Philadelphia, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-temple-university-philadelphia-pa) (Oct. 31, 1960). [[w.communications-freedom-of-communications-part]], 829–31. Names: Kennedy, Dilworth, Green, Nixon, Eisenhower.'
    tags: [name:kennedy-john-f, name:dilworth-richardson, name:green-william-j-jr, name:nixon-richard-m, name:eisenhower-dwight-d, state:pa, city:philadelphia]
  - id: cal.1960-10-31.elections-1960-kennedy-4
    when: Oct. 31
    date: '1960-10-31'
    thread: elections-1960-kennedy
    c: 'Philadelphia, the Citizens for Kennedy rally. Kennedy with Mayor Dilworth and Rep. Green: the differences are "twofold," Nixon finding present growth "highly satisfactory." He cites the 25,000 new jobs a week to be found.'
    n: 'Remarks of Senator John F. Kennedy, Citizens for Kennedy Rally, Philadelphia, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-citizens-for-kennedy-rally-philadelphia-pa) (Oct. 31, 1960). [[w.communications-freedom-of-communications-part]], 831. Names: Kennedy, Dilworth, Green, Nixon.'
    tags: [name:kennedy-john-f, name:dilworth-richardson, name:green-william-j-jr, name:nixon-richard-m, state:pa, city:philadelphia]
  - id: cal.1960-10-31.elections-1960-kennedy-5
    when: Oct. 31
    date: '1960-10-31'
    thread: elections-1960-kennedy
    also: [middle-east]
    c: 'Philadelphia, the Bonds for Israel dinner (the speech calls it a luncheon). Kennedy, with Mayor Dilworth and Rep. Green: "As a bondholder in Israel myself"; the Middle East: Israel gave up the gains of 1956 on the understanding that the United Nations resolutions on free transit of the canal would be carried out; the policy "not a party matter."'
    n: 'Remarks of Senator John F. Kennedy, Bonds for Israel Dinner, Philadelphia, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-bonds-for-israel-dinner-philadelphia-pa) (Oct. 31, 1960). [[w.communications-freedom-of-communications-part]], 831–33. Names: Kennedy, Dilworth, Green.'
    tags: [name:kennedy-john-f, name:dilworth-richardson, name:green-william-j-jr, state:pa, city:philadelphia]
  - id: cal.1960-10-31.elections-1960-kennedy-6
    when: Oct. 31
    date: '1960-10-31'
    thread: elections-1960-kennedy
    c: 'Philadelphia, Reyburn Plaza, evening. Kennedy with Mayor Dilworth, Sen. Clark and Rep. Green: seven days left; after the Republican convention Nixon had two alternatives; "the best of years or the worst of years."'
    n: 'Remarks of Senator John F. Kennedy, Reyburn Plaza, Philadelphia, PA, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-reyburn-plaza-philadelphia-pa) (Oct. 31, 1960). [[w.communications-freedom-of-communications-part]], 833–35. Names: Kennedy, Dilworth, Clark, Green, Nixon.'
    tags: [name:kennedy-john-f, name:dilworth-richardson, name:clark-joseph-s, name:green-william-j-jr, name:nixon-richard-m, state:pa, city:philadelphia]
  - id: cal.1960-10-31.elections-1960-kennedy-7
    when: Oct. 31
    date: '1960-10-31'
    thread: elections-1960-kennedy
    c: 'Philadelphia, Convention Hall. Kennedy, the text prepared and the remarks as given: "There is one week left in this campaign"; "America is going to start moving again." Nixon "says this talk is irresponsible"; "I do not downgrade America." Food rots in storage while a hungry world watches.'
    n: 'Speech by Senator John F. Kennedy, Convention Hall, Philadelphia, PA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-convention-hall-philadelphia-pa) (Oct. 31, 1960). [[w.communications-freedom-of-communications-part]], 835–40 (the text prepared for delivery, 835–38, and the remarks as given, 838–40). Names: Kennedy, Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, state:pa, city:philadelphia]
  - id: cal.1960-10.elections-1960-kennedy
    when: Oct.
    date: 1960-10
    thread: elections-1960-kennedy
    also: [cuba]
    c: 'The Caroline, the night after Nixon''s answer to the Cuba statement. Kennedy, pointing to Goodwin and Sorensen: "If I win this thing, I won it; but if I lose it, you guys lost it."'
    n: '[[w.goodwin-remembering-america]], 126 (Goodwin''s account: "There was no other reproach"). See [[cal.1960-10-20.cuba]]. Names: Kennedy, Goodwin, Sorensen. Check: the day; "The next night" (126).'
    tags: [name:kennedy-john-f, name:goodwin-richard-n, name:sorensen-theodore-c]
