  - id: cal.1960-10-05.elections-1960-kennedy
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    c: 'Pendleton, Ind. A brief stop. Kennedy: over 4 million out of work, corn at 92 to 95 cents, steel mills at 50 percent of capacity; Indiana "has not gone Democratic in any Presidential election" since 1936.'
    n: '[Remarks of Senator John F. Kennedy, Pendleton, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-pendleton) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 492–493. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:in]
  - id: cal.1960-10-05.elections-1960-kennedy-2
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    c: 'Muncie, Ind., with Welsh and Hartke. Kennedy: Nixon "said the other night in Boston that I was another Truman"; the issue is a party that calls the $1.25 minimum wage and medical care for the aged tied to Social Security "too extreme."'
    n: '[Remarks of Senator John F. Kennedy, Muncie, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-muncie) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 493–495. Names: Kennedy, Welsh, Hartke, Nixon, Truman.'
    tags: [name:kennedy-john-f, name:welsh-matthew-e, name:hartke-rupert-v, name:nixon-richard-m, name:truman-harry-s, state:in]
  - id: cal.1960-10-05.elections-1960-kennedy-3
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    c: 'Muncie, Ind., the Muncie Gear Works. Kennedy: Nixon "another Truman," "he was another Dewey, and he is"; a Republican President and a Democratic Congress "fighting over the next 4 years" with no legislation.'
    n: '[Remarks of Senator John F. Kennedy, Muncie Gear Works, Muncie, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-muncie-gear-works-muncie) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 495. Names: Kennedy, Nixon, Truman, Dewey.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:truman-harry-s, name:dewey-thomas-e, state:in]
  - id: cal.1960-10-05.elections-1960-kennedy-4
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    c: 'Anderson, Ind., with Roush and Welsh. Kennedy: it has been 24 years since Indiana voted Democratic in a national election; the world will not exist "half slave and half free."'
    n: '[Remarks of Senator John F. Kennedy, Anderson, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-anderson) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 495–497. Names: Kennedy, Roush, Welsh.'
    tags: [name:kennedy-john-f, name:welsh-matthew-e, name:roush-john-e, state:in]
  - id: cal.1960-10-05.elections-1960-kennedy-5
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    also: [farm]
    c: 'Terre Haute, Ind., the courthouse, with Hartke, Welsh and Wampler. Kennedy: corn at 93 or 94 cents, $1.50 eight years before; under Nixon''s plan, tying the support price to the market price, it would fall lower.'
    n: '[Remarks of Senator John F. Kennedy, Courthouse, Terre Haute, IN](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-courthouse-terre-haute) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 497–499. Names: Kennedy, Hartke, Welsh, Nixon.'
    tags: [name:kennedy-john-f, name:hartke-rupert-v, name:welsh-matthew-e, name:nixon-richard-m, state:in]
  - id: cal.1960-10-05.elections-1960-kennedy-6
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    also: [desegregation-schools]
    c: 'Louisville, Ky., Jefferson Square. Kennedy, with Burke and Keen Johnson: Nixon "stood in this very same spot and claimed Thomas Jefferson as a Republican." He salutes Louisville, which in 1956, "carrying out the Supreme Court decision," set an example.'
    n: '[Remarks of Senator John F. Kennedy, Jefferson Square, Louisville, KY](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-jefferson-square-louisville-ky) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 499–503. Names: Kennedy, Burke, Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:burke-frank-w, state:ky, city:louisville]
  - id: cal.1960-10-05.elections-1960-kennedy-7
    when: Oct. 5
    date: '1960-10-05'
    thread: elections-1960-kennedy
    also: [elections-1960-religion, farm, jobs-and-wages]
    c: 'Louisville, the Fair Grounds. Kennedy''s speech, printed in excerpts, on the interdependence of the economy; steel at 50 percent of capacity. In the questions: eastern Kentucky unemployment, with the area redevelopment bill and defense manpower policy No. 4 to steer defense contracts to surplus-labor areas; his religion would not interfere, "the answer is ''No.''"; support prices tied to 90 percent of the three-year average market price, which he opposes; Federal aid to education to run through the States.'
    n: '[Excerpts from the Speech of Senator John F. Kennedy, Fair Grounds, Louisville, KY](https://www.presidency.ucsb.edu/documents/excerpts-from-the-speech-senator-john-f-kennedy-fair-grounds-louisville-ky) (Oct. 5, 1960); [Question and Answer Period Following Speech of Senator John F. Kennedy, Fair Grounds, Louisville, KY](https://www.presidency.ucsb.edu/documents/question-and-answer-period-following-speech-senator-john-f-kennedy-fair-grounds-louisville) (Oct. 5, 1960). [[w.communications-freedom-of-communications-part]], 503–08 (the speech, 503–06; the questions, 506–08). Names: Kennedy.'
    tags: [name:kennedy-john-f, state:ky, city:louisville]
  - id: cal.1960-10-06.elections-1960
    when: Oct. 6
    date: '1960-10-06'
    thread: elections-1960-kennedy
    c: 'Johnson, through Reedy: the Republican administration''s record "dangerously close to the evils of Reconstruction times." Does Nixon favor "the bayonets and paratroopers in Little Rock," and would he deny the "ancient Anglo-Saxon right of the jury trial" to white Southerners accused under the civil rights laws?'
    n: '[[w.kallina-kennedy-v-nixon]], 147–48. To check: "Kennedy and Nixon on Civil Rights: Some Comparisons," Senate Political Files, LBJ Library; George Reedy, statement on Nixon, Oct. 6, 1960, Senate Political Files, LBJ Library (cited by [[w.kallina-kennedy-v-nixon]], 148 n.35). Names: Johnson, Reedy, Nixon.'
    src:
      c: 26b13597
      rows:
