    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    c: 'Kansas City, Kans., by the reports heading, the Shawnee Mission East High School ("Shaunee"). Kennedy for Representative George''s reelection and Theis for the Senate: with 65 Democrats and 35 Republicans in the Senate, "mathematically" the Democrats control it whatever the races.'
    n: 'Remarks of Senator John F. Kennedy, Shaunee Mission East High School, Kansas City, KS, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-shaunee-mission-east-high-school-kansas-city-ks) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 699–702. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:ks]
  - id: cal.1960-10-22.elections-1960-kennedy-7
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    c: Grand View, Mo., the Truman Shopping Center. Kennedy, with Randall, Long and Dalton, repeats the "Dewey" answer to Nixon's "just another Truman"; Truman remembered for Greece and Turkey, NATO and the Marshall plan. Farmers "average in pay about 60 cents an hour"; Benson "has helped liquidate the American farmer, and Mr. Nixon's program will continue it."
    n: 'Remarks of Senator John F. Kennedy, Truman Shopping Center, Grand View, MO, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-truman-shopping-center-grand-view-mo) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 702–04. Names: Kennedy, Nixon, Truman, Benson, Long, Dalton, Randall.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, name:truman-harry-s, name:benson-ezra-taft, name:long-edward-v, name:dalton-john-m, name:randall-clarence-b, state:mo]
  - id: cal.1960-10-22.elections-1960-kennedy-8
    when: Oct. 22
    date: '1960-10-22'
    thread: elections-1960-kennedy
    also: [elections-1960-debates]
    c: 'Kansas City, Mo., the Auditorium, Truman on the platform, with Symington, Long, Dalton, Eagleton, Bolling and Randall. Kennedy on Nixon''s line in the fourth debate: "Our prestige abroad is not what we say it is, but what it is." He asks Nixon, who "would have no objection," to have the State Department''s overseas polls, wanted by Fulbright, made public.'
    n: 'Speech of Senator John F. Kennedy, Auditorium, Kansas City, MO, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-auditorium-kansas-city-mo) (Oct. 22, 1960). [[w.communications-freedom-of-communications-part]], 704–07. Names: Kennedy, Truman, Symington, Long, Dalton, Eagleton, Bolling, Randall, Nixon, Fulbright.'
    tags: [name:kennedy-john-f, name:truman-harry-s, name:symington-william-s, name:long-edward-v, name:dalton-john-m, name:eagleton-thomas-f, name:bolling-richard, name:randall-clarence-b, name:nixon-richard-m, name:fulbright-j-william, state:mo, city:kansas-city]
