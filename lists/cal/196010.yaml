  - id: cal.1960-10-27.elections-1960-kennedy-3
    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    also: [labor]
    c: 'New York, the Trade Union Council of the Liberal Party. Kennedy with Dubinsky, Alex Rose, Lehman, Vanden Heuvel and Mayor Wagner: prestige is not "popularity," it is whether Latin America, Africa and Asia will "follow our example"; he cites the day''s New York Times poll in England and France.'
    n: 'Remarks of Senator John F. Kennedy, Trade Union Council of Liberal Party, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-trade-union-council-liberal-party-new-york-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 772–74. Names: Kennedy, Vanden Heuvel, Wagner.'
    tags: [name:kennedy-john-f, name:vanden-heuvel-william-j, name:wagner-robert-f-jr, state:ny, city:nyc]
  - id: cal.1960-10-27.elections-1960-kennedy-4
    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    c: 'New York, the Stuyvesant Town rally. Kennedy with Farbstein and Vanden Heuvel: growth "minus 0.3 percent" in nine months, steel at 50 percent, new homes 30 percent fewer; 200,000 more homes a year needed.'
    n: 'Remarks of Senator John F. Kennedy, Stuyvesant Town Rally, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-stuyvesant-town-rally-new-york-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 774–76. Names: Kennedy, Farbstein, Vanden Heuvel.'
    tags: [name:kennedy-john-f, name:farbstein-leonard, name:vanden-heuvel-william-j, state:ny, city:nyc]
  - id: cal.1960-10-27.elections-1960-kennedy-5
    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    c: 'New York, New York University, Washington Square. Kennedy to students, over Nixon sign holders: Nixon runs on "Experience Counts"; three recessions in eight years, 4.5 million out of work, 3 million part time. He asks how many will serve abroad as doctors, engineers, teachers and nurses.'
    n: 'Remarks of Senator John F. Kennedy, New York University, Washington Square, New York, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-new-york-university-washington-square-new-york-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 776–79. Names: Kennedy, Nixon.'
    tags: [name:kennedy-john-f, name:nixon-richard-m, state:ny, city:nyc]
  - id: cal.1960-10-27.elections-1960-kennedy-6
    when: Oct. 27
    date: '1960-10-27'
    thread: elections-1960-kennedy
    c: 'Brooklyn, Bay Parkway and 86th Street. Kennedy: "I stand here tonight where Franklin Roosevelt stood"; "The next President of the United States will carry New York." Asks the crowd where to eat.'
    n: 'Remarks of Senator John F. Kennedy, Bay Parkway & 86th Street, Brooklyn, NY, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-bay-parkway-86th-street-brooklyn-ny) (Oct. 27, 1960). [[w.communications-freedom-of-communications-part]], 779. Names: Kennedy.'
    tags: [name:kennedy-john-f, state:ny, city:nyc]
