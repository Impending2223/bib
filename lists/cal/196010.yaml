    when: Oct. 24–28
    date: '1960-10-24'
    thread: elections-1960-nixon
    c: 'Nixon''s whistle-stop train. Pennsylvania, Oct. 24: Harrisburg, Pa., Lewistown, Pa., Huntingdon, Pa., Altoona, Pa., Johnstown, Pa., Greensburg, Pa., Pittsburgh at the Syria Mosque. Ohio, Oct. 25–26: Marietta, Ohio, Athens, Ohio, Chillicothe, Ohio, Cincinnati; Parkersburg, W. Va.; Lima, Ohio, Marion, Ohio, Middletown, Ohio, Dayton, 20,000 in the rain at midday, Columbus, Ohio, Toledo. Michigan, Oct. 27: Ann Arbor, Mich., Jackson, Mich., Battle Creek, Mich., Kalamazoo, Grand Rapids, Muskegon, Mich., eggs and tomatoes thrown at him. Illinois, Oct. 28: Danville, Ill., Mattoon, Ill., Centralia, Ill., to Carbondale, Ill., and the plane again.'
