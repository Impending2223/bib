  - id: cal.1969-02-01.china-leadership-2
    when: Feb. 1
    date: '1969-02-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting on preparations for the Ninth Congress; afterward he drafts and sends Mao and Lin Biao the draft agenda of the liaison meeting''s preparations: the date delegates gather in Peking and the order of the meeting, a draft for review and approval of the delegates, the revised draft Party constitution, an outline of the 1969 national economic plan (draft), an outline for discussion of the situation and policy, the central organs after the Congress, and the line of propaganda on it. Mao: issue it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-02-02.china-leadership
    when: Feb. 2
    date: '1969-02-02'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing send an agenda for preparing the Ninth Congress (arrival of delegates, approval of delegates, views on the draft constitution, the economic plan, the situation, the central organs after the Congress, propaganda) and a notice to delegates, and ask that Mao and Lin Biao meet the Group in a day or two. Mao: talk in a day or two; the other paper issued.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 2, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969; the draft agenda and Mao''s reply); [[w.jianguo-yilai-mao-zedong]], XIX, 396–397 (Feb. 2, 1969; Mao''s note ''To be talked over in a day or two; the other paper to be issued as it is'' on the report of Feb. 2 of Zhou, Chen Boda, Kang Sheng and Jiang Qing, sending the draft agenda of the Group''s liaison meeting for preparing the Ninth Congress and the draft notice of the Center and the Group on the preparation, which asks the provinces, cities and regions to gather at their revolutionary committees the comrades nominated as delegates); [[w.mao-zedong-zhuan]], VI, ch. 77 (Feb. 2 Zhou Enlai sends Mao the draft notice of the Center and the Cultural Revolution Group on preparing for the Ninth Congress, covering the way delegates are chosen, the revision of the constitution, the 1969 economic plan, the situation and policy at home and abroad, the central organs and the Congress''s propaganda line; Mao writes the same day, ''issue as it stands''; the book does not name the other signers or give the agenda as in the entry). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing, report of Feb. 2, 1969 to Mao Zedong sending the draft agenda of the Cultural Revolution Group''s liaison meeting for preparing the Ninth Congress and the draft notice of the Center and the Group on preparing it (Guanyu Jiu Da zhunbei gongzuo de tongzhi (caogao) 关于九大准备工作的通知(草稿)), and asking Mao and Lin Biao to call the whole liaison meeting in a day or two to hear the preparations (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 396 n.1). Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
    src:
