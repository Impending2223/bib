  - id: cal.1969-02-06.china
    when: Feb. 6
    date: '1969-02-06'
    thread: china
    also: [europe-and-the-alliance]
    c: The spokesman of the Foreign Ministry's information department states that Liao Hequan, formerly chargé d'affaires and second secretary of China's office in the Netherlands, was, after being induced by the Dutch government to defect on Jan. 24, taken to the U.S. by the CIA on Feb. 4. China calls it a grave anti-Chinese incident wilfully made by the U.S. and Dutch governments in collusion, and states that they must hand Liao back to China.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 209 (Feb. 6, 1969). Check: the name, from the Chinese 廖和权.'
    src:
