    c: American B-52s are ordered to strike Base Area 353 in Cambodia, the Parrot's Beak and the Fishhook, where Abrams believes the Central Office for South Vietnam sits; Nixon agrees to Abrams's proposal. The history quotes Washington's view, that an air war in Cambodia could be kept secret, from Joseph Amter.
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 247–48 and n. 1. To check: Joseph A. Amter, *Lời phán quyết về Việt Nam* (Quân đội nhân dân, 1985), 274, 175 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 248 n. 1). Names: Nixon, Abrams. Check: the day; the history says "giữa tháng 2-1969" and the strikes follow the early spring offensive.'
