entries:
  - id: cal.1969-02-01.china-leadership
    when: Feb. 1
    date: '1969-02-01'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai presides over the farewell ceremony for Li Zongren.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969). See [[cal.1969-01-31.china-leadership]]. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1969-02-01.china-leadership-2
    when: Feb. 1
    date: '1969-02-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the Cultural Revolution Group''s liaison meeting on preparations for the Ninth Congress; afterward he drafts and sends Mao and Lin Biao the draft agenda of the liaison meeting''s preparations: the date delegates gather in Peking and the order of the meeting, a draft for review and approval of the delegates, the revised draft Party constitution, an outline of the 1969 national economic plan (draft), an outline for discussion of the situation and policy, the central organs after the Congress, and the line of propaganda on it. Mao: issue it.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-02-02.china-leadership
    when: Feb. 2
    date: '1969-02-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing send an agenda for preparing the Ninth Congress (arrival of delegates, approval of delegates, views on the draft constitution, the economic plan, the situation, the central organs after the Congress, propaganda) and a notice to delegates, and ask that Mao and Lin Biao meet the Group in a day or two. Mao: talk in a day or two; the other paper issued.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 2, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 1, 1969; the draft agenda and Mao''s reply). Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
    src:
      c: 97fd7470
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Feb. 2, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 273: A, C'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, vis:only:prc]
  - id: cal.1969-02-02.china-leadership-2
    when: Feb. 2
    date: '1969-02-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Mao and Lin Biao proposing that within a day or two they call all the liaison meeting''s members to a meeting on preparations for the Ninth Congress: once the Zhejiang talks end, the liaison meeting turns to the Congress''s preparations.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 273 (Feb. 2, 1969). Made public: 2020. See [[cal.1969-02-02.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-02-04.soviet-union-leadership-2
    when: Feb. 4
    date: '1969-02-04'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with Erban, chairman of the Czechoslovak National Front, whose delegation is in the USSR Feb. 2–4. His points for the talk: the relations of the two parties good, and others wanting to set them at odds; the post-January course juggled by the right; open struggle, no halting halfway, the anti-socialist forces well organized; the opposition''s aims, a congress, elections to the National Assembly, the unions, workers'' councils taking industry out of the party''s reach, attacks on the security organs; the National Front''s part, and Erban''s, praised.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 348–49 (№ 82, Brezhnev''s points for the talk, Feb. 4), 434 nn.1–3 (the editors: the National Front delegation under Erban, the Politburo''s decision of Jan. 19; the talk Feb. 4). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 313 (the secretaries'' record, Feb. 4: Brezhnev, in from Barvikha, receives Erban in his office at the Central Committee, 3 to 6:35 p.m.). Made public: 2016. To check: the Czechoslovak record; the points are Brezhnev''s, not what was said. Names: Erban, Brezhnev.'
    src:
      c: '10551408'
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 313: ?'
    tags: [polity:ussr, polity:czechoslovakia, name:brezhnev-leonid, vis:only:ussr+czechoslovakia]
  - id: cal.1969-02-05.china-leadership
    when: Feb. 5
    date: '1969-02-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai sends Mao the list of the Eighth Central Committee''s members and alternates attending the Twelfth Plenum who have and have not been proposed as delegates to the Ninth Congress, noting that he meant to report it in talk but the meeting is put off, so he sends first the written paper agreed at the liaison meeting, for Mao to think over beforehand. Mao: Chen Qihan, a deputy president of the Supreme People''s Court, seems to be worth considering.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 5, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
  - id: cal.1969-02-07.soviet-union-leadership
    when: Feb. 7–10
    date: '1969-02-07'
    thread: soviet-union-leadership
    c: Zavidovo, Moscow. Kádár, met by Brezhnev at the Kiev station the evening before. Brezhnev leaves for Zavidovo Feb. 7 at noon for the negotiations with him; Feb. 10, 1 to 3 p.m., the lunch for Kádár at the Lenin Hills reception house; sees him off at the Kiev station, 3:15 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 314 (Feb. 6–10). Names: Brezhnev, Kádár.'
    tags: [name:brezhnev-leonid, name:kadar-janos, polity:ussr, polity:hungary]
  - id: cal.1969-02-07.china-leadership
    when: Feb. 7
    date: '1969-02-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group: study the course of the "three supports, two militaries" since Feb. 1967, and what has changed since propaganda teams went into schools, factories and offices; no "activists'' congresses" and no side-taking; students started the movement, then turned to civil war and no longer listened; in Wuhan in 1967 they had lost the main direction.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 7, 1969; the meeting at Mao''s, Lin Biao and the liaison meeting present). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 7, 1969), has Lin Biao and all the liaison meeting''s members at the meeting, and Zhou say he would also speak at the Ninth Congress on the Third Five-Year Plan, that the government''s organs are to be readied for cuts, that Zhu Guangya and Qian Xuesen have done well as delegates, and that the July 3 and July 24 notices had a great effect; Mao: a great invention, a notice makes opinion, Huang Yongsheng and the Premier talked this one out. Names: Mao Zedong.'
    src:
      c: 4a090484
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Feb. 7, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 274: A'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-02-09.china-leadership
    when: Feb. 9
    date: '1969-02-09'
    thread: china-leadership
    also: [africa, china]
    c: 'Zhou Enlai receives Guinea''s ambassador, Camara Kiko: an armed force counts not in numbers but in loyalty to the people and the nation, firmly under patriots'' leadership, so as to defend national independence. China has feeling for Africa, which shared its past experience.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, polity:guinea, name:zhou-enlai, vis:only:prc+guinea]
  - id: cal.1969-02-09.china-leadership-2
    when: Feb. 9
    date: '1969-02-09'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai convenes the military control group of the defense industry, the National Defense Science and Technology Commission, the National Defense Industry Office and the military control commissions and heads of the Second to Seventh Ministries of Machine Building on defense production, with instructions on its plans and layout. Anti-aircraft weapons are to be pressed hard and caught up in two or three years, a plan made and building hurried; of AA gun radar and directors he repeats that the electronics industry is most backward, radio plants must cooperate with outside plants, shutting oneself off stops progress, and a socialist enterprise monopolizing or blockading is wrong. Research may and should be joined to production. On imported machines: take care not to be cheated, test them at the port of entry and, if they fail, deal with the sellers there; do not buy what can be made at home.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274–275 (Feb. 9, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-02-11.vietnam-hanoi
    when: Feb. 11
    date: '1969-02-11'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Politburo''s cable to Phạm Hùng: agreed with COSVN on pushing the cities'' struggle for peace and the forming of a third force, between the patriots and Washington''s extreme agents; the Alliance need not call openly for talks with the middle strata on a peace cabinet. For study: talks between the Front and the Alliance on a provisional coalition government, at a low level its program and a campaign for it, at a high level its proclamation, with ministers, once the socialist countries'' recognition is sounded. Sihanouk to be invited to the North; the ambassador, Nguyễn Thương, called home.'
    n: '*Điện của Bộ Chính trị, ngày 11 tháng 2 năm 1969, Về đấu tranh ở đô thị* (the title the editors''), to "Anh Bảy Cường" (Phạm Hùng, the editors'' note). [[w.van-kien-dang-toan]], XXX, 19–21. Made public: 2004. Names: Phạm Hùng, Sihanouk, Nguyễn Thương.'
    tags: [polity:drv, polity:us, polity:cambodia, vis:only:drv, name:norodom-sihanouk]
  - id: cal.1969-02-11.china-leadership
    when: Feb. 11
    date: '1969-02-11'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the second defense industry meeting: production is to be pressed of rifles, machine guns, anti-aircraft guns, ground-to-air missiles, aircraft, submarines and anti-tank weapons, since war rests mainly on conventional arms, though advanced and conventional arms must go together; of advanced weapons China is to beat the enemy by quality, with numbers not too large, or they become a burden. Hearing the shipbuilding report he says the shipbuilding industry is not matched up, steel plate output to be considered, and the quality of the 10,000-ton ships already built watched.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 11, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-02-12.vietnam-hanoi
    when: Feb. 12
    date: '1969-02-12'
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the twenty-third congress of the Danish Communist Party: greetings; the Danish party''s fight against the monopolies, NATO and West German revanchism; thanks for its support of Vietnam.'
    n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 2 năm 1969, gửi Đại hội lần thứ XXIII Đảng Cộng sản Đan Mạch* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, vis:only:drv+denmark]
  - id: cal.1969-02-14.vietnam-hanoi
    when: Feb. 14
    date: '1969-02-14'
    thread: vietnam-hanoi
    c: 'The Secretariat''s directive no. 169-CT/TW on education in 1968–70: five million at school, from kindergarten to general and adult schooling; nearly a million children without the second level, tens of thousands illiterate in the mountains and Catholic areas, quality weak, teachers short and overworked. Quality first, the second level the core, the South''s needs served, the teachers trained, the curricula and textbooks revised.'
    n: '*Chỉ thị của Ban Bí thư số 169-CT/TW, ngày 14 tháng 2 năm 1969, Về công tác giáo dục trong ba năm 1968-1970*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 21–33. Made public: 2004. See [[cal.1968-08-08.vietnam-hanoi]].'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-02-16.china-leadership
    when: Feb. 16–Mar. 24
    date: '1969-02-16'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: The national planning forum meets in Peking. Prepared on Zhou Enlai's instruction of Dec. 12 by a new plan-drafting group of military representatives, old cadres and rebels, it takes up the 1969 economic plan, direction and tasks, the year's output targets and the scale of capital construction. From January Zhou repeatedly called the responsible people to plan it, revised the State Council's notice convening it, read its bulletins in detail and often talked with those in charge. Learning that the Ministry of Materials had not, as he ordered, recovered 5,000 tons of aluminium set aside for Mao badges, he asks why, saying that spreading Mao Zedong Thought must be effective, that the badges grow ever bigger and the Chairman does not approve; the ministry sends out a notice that night to recover it.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 16, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-02-17.soviet-union-leadership
    when: Feb. 17
    date: '1969-02-17'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Ulbricht, 10 to 12:45, and lunches with him at the reception house, 1 to 2; sees him off at Vnukovo, 3 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 316 (Feb. 17). Names: Brezhnev, Ulbricht.'
    tags: [name:brezhnev-leonid, name:ulbricht-walter, polity:ussr, polity:gdr]
  - id: cal.1969-02-18.china-leadership
    when: Feb. 18
    date: '1969-02-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the suggestion of the Lanzhou Military Region and the Water and Power Ministry''s military control commission to import some electrical equipment and conductors for the 330-kilovolt Liujiaxia to Guanzhong extra-high-voltage line, writes Yu Qiuli: mobilizing the potential of Shanghai and Harbin should do it; to be discussed at the national planning conference.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-02-19.china-leadership
    when: Feb. 19
    date: '1969-02-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: approves the old men''s visits to factories for investigation; Group members to go down as well; reform in many fields, nobody knows how to do socialism; on Chen Yi''s report of people jailed in factories: only murder, arson, poison are crimes, a few reactionary slogans are not.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 275–276 (Feb. 19, 1969; the meeting and its attendants). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 19, 1969), has Mao at this meeting asking Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying to study international questions. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
    src:
      c: e2be717a
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Feb. 19, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 275–276: A'
    tags: [polity:prc, name:mao-zedong, name:chen-yi, name:li-fuchun, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, vis:only:prc]
  - id: cal.1969-02-25.soviet-union-leadership
    when: Feb. 25
    date: '1969-02-25'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'The Politburo, by the editors probably on Chervonenko''s report on Czechoslovakia. Brezhnev''s notes: the Czechoslovak editions, to be halted or not; the "Black Book"; a letter to the Czechoslovak party''s Executive Committee, on the party''s leading role and normalization; support for the internationalist cadres; a meeting on the model of Čierna nad Tisou, or of the six parties; a marshal to go at Svoboda''s request. By the editors neither meeting was held.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 359–60 (№ 85, Brezhnev''s notes, Feb. 25), 438–39 nn.51–62 (the editors: the meeting question, the six parties, not held). Made public: 2016. To check: the protocol of Feb. 25, and the date, which the book gives from the notes'' own heading. Names: Chervonenko, Brezhnev, Svoboda.'
    tags: [polity:ussr, polity:czechoslovakia, name:brezhnev-leonid, name:chervonenko-stepan-v, name:svoboda-ludvik, vis:only:ussr]
  - id: cal.1969-02-28.china-leadership
    when: Feb. 28
    date: '1969-02-28'
    thread: china-leadership
    also: [africa]
    c: Mao receives the Guinean government delegation under Enfa Mara Keita (minister of trade, transport, posts and telecommunications), Hall 118, evening; Zhou Enlai and Li Xiannian present. Young states, young officers; China's cadres too old; its experience good in part, not all to be copied.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 28, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 28, 1969; Zhou at the talks, then with Mao). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Xiannian, Keita. Check: the minister''s name, "Enfa Mara Keita" in the Chinese. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
    src:
      c: edd889a4
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Feb. 28, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 276: A, B'
    tags: [polity:prc, polity:guinea, name:mao-zedong, name:zhou-enlai, name:li-xiannian, vis:only:prc+guinea@C-E]
  - id: cal.1969-02-28.china-leadership-2
    when: Feb. 28
    date: '1969-02-28'
    thread: china-leadership
    also: [europe-and-the-alliance, china]
    c: 'Zhou Enlai receives Sweden''s ambassador (the nianpu''s Peiteli): China opposes the United Nations as a tool of great-power politics; the lesson of the Second World War is that every nation should be liberated and all states, large and small, equal, but power politics is worse than before the war, and the so-called socialist countries have joined in.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 28, 1969). Made public: 2020. Names: Zhou Enlai. Check: the ambassador''s name.'
    tags: [polity:prc, polity:sweden, name:zhou-enlai, vis:only:prc+sweden]
  - id: cal.1969-02-28.china-leadership-3
    when: Feb. 28
    date: '1969-02-28'
    thread: china-leadership
    also: [africa, middle-east, china]
    c: 'Zhou Enlai receives the Guinean government delegation under Enfa Mara Keita, minister of trade, transport, posts and telecommunications. If Indochina is the first powder keg, the Middle East is the second; the Paris talks, in Vietnam above all, will bring no result unless war decides, what is not won on the battlefield being unwinnable at the table, the more so with aggressor on one side and victim on the other. On economic aid: China favors only aid to build and develop the national economy; its aid is directed to help them reach self-reliance by degrees, and does not touch their sovereignty; true mutual aid among friends on this basis is dependable. In the evening he accompanies Mao in receiving the Guinean guests.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 28, 1969). Made public: 2020. See [[cal.1969-02-28.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, polity:guinea, name:zhou-enlai, name:mao-zedong, vis:only:prc+guinea]
