    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Camp Êsépic, Bình Thuận. Main force and local guerrillas raid the base: a battalion of the American 101st Airborne badly hurt, two artillery companies, 13 aircraft destroyed. The history calls it the spring phase''s best action on the far southern coast of Trung Bộ.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 105. See [[cal.1969-02-22.vietnam-hanoi]]. Check: the day; the history gives the phase, Feb. 23–Mar. 31, and the camp''s name as printed.'
    tags: [polity:drv, polity:us]
  - id: cal.1969-02.vietnam-hanoi-4
    when: Feb., after the 22nd
    date: 1969-02
    at: after 1969-02-22
    place: plei-can
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Central Highlands. After beating Bình Tây 48 to 50, the three forces attack the line west of Kon Tum: the bases at Plây Cần and Kleng and Đức Cơ in Gia Lai. Under artillery, main force, local forces and guerrillas fight hand to hand for hills and valleys against American air and artillery. Sappers strike deep at the rear of the 1st Brigade, 4th Division at Tân Phú and Buôn Ma Thuột.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 104–5. See [[cal.1969-02-22.vietnam-hanoi]]. Check: the days; the history says "những tháng đầu năm 1969" and so places the fighting before the summer phase.'
