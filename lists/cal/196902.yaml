    tags: [polity:prc, polity:netherlands, polity:us]
  - id: cal.1969-02-07.soviet-union-leadership
    when: Feb. 7–10
    date: '1969-02-07'
    time: 1969-02-07T09:00Z
    place: zavidovo
    thread: soviet-union-leadership
    c: Zavidovo, Moscow. Kádár, met by Brezhnev at the Kiev station the evening before. Brezhnev leaves for Zavidovo Feb. 7 at noon for the negotiations with him; Feb. 10, 1 to 3 p.m., the lunch for Kádár at the Lenin Hills reception house; sees him off at the Kiev station, 3:15 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 314 (Feb. 6–10). Names: Brezhnev, Kádár.'
    tags: [name:brezhnev-leonid, name:kadar-janos, polity:ussr, polity:hungary]
  - id: cal.1969-02-07.china-leadership
    when: Feb. 7
    date: '1969-02-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group: study the course of the "three supports, two militaries" since Feb. 1967, and what has changed since propaganda teams went into schools, factories and offices; no "activists'' congresses" and no side-taking; students started the movement, then turned to civil war and no longer listened; in Wuhan in 1967 they had lost the main direction.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 7, 1969; the meeting at Mao''s, Lin Biao and the liaison meeting present); [[w.mao-zedong-zhuan]], VI, ch. 77 n.64 (Feb. 7, in a talk with the members of the Cultural Revolution Group''s liaison meeting, Mao on drafting the Congress report: when the first draft is out there is a way, it is only to overturn it all and write again; let a few do it, Chen Boda 陈伯达 at the head, with Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元, Lin Biao 林彪 in command; the meeting can be held once the text is written; he does not approve talk of ''milestones'' (Marxism''s third milestone); the same meeting discusses the figures of the third five-year plan; the report to be handed in by Feb. 20 and the Congress to open Mar. 15; the book does not put the day or the hour of the ''three supports'' discussion of the entry, n.64). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 7, 1969), has Lin Biao and all the liaison meeting''s members at the meeting, and Zhou say he would also speak at the Ninth Congress on the Third Five-Year Plan, that the government''s organs are to be readied for cuts, that Zhu Guangya and Qian Xuesen have done well as delegates, and that the July 3 and July 24 notices had a great effect; Mao: a great invention, a notice makes opinion, Huang Yongsheng and the Premier talked this one out. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 (record 谈话记录), Feb. 7, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.64). Names: Mao Zedong.'
