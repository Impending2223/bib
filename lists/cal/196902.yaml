    c: 'Zhou Enlai receives Guinea''s ambassador, Camara Kiko: an armed force counts not in numbers but in loyalty to the people and the nation, firmly under patriots'' leadership, so as to defend national independence. China has feeling for Africa, which shared its past experience.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 9, 1969); [[w.zhou-enlai-waijiao-huodong]], 533 (Feb. 9, 1969; 11:30 p.m., Fujian Hall, Great Hall of the People; Guinea''s ambassador (the book names him 卡马拉·塞古)). Made public: 1993. Names: Zhou Enlai.'
