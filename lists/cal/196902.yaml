    time: 1969-02-28T10:20Z
    place: peking
    thread: china-leadership
    also: [europe-and-the-alliance, china]
    c: 'Zhou Enlai receives Sweden''s ambassador (the nianpu''s Peiteli): China opposes the United Nations as a tool of great-power politics; the lesson of the Second World War is that every nation should be liberated and all states, large and small, equal, but power politics is worse than before the war, and the so-called socialist countries have joined in.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 28, 1969); [[w.zhou-enlai-waijiao-huodong]], 533 (Feb. 28, 1969; 6:20 p.m., Xinjiang Hall, Great Hall of the People; Sweden''s ambassador (the book gives 佩特里); the book has Zhou saying China cannot consider the question of entering the U.N., for the U.S. and the Soviet Union, bent on mastering the world, use it first, and China opposes the U.N. as a tool of great-power politics); [[w.zhonghua-renmin-gongheguo-waijiao]], 210 (Feb. 28, 1969; Zhou to Sweden''s ambassador: a question of China''s U.N. seat cannot be considered; the U.S. and USSR use the U.N. to rule the world, and China opposes it as a tool of great-power politics). Made public: 1993. Names: Zhou Enlai. Check: the ambassador''s name.'
    src:
      c: '79698241'
      rows:
        - 'w.zhou-enlai-nianpu-1949-2020 III, 276: ?'
        - 'w.zhou-enlai-waijiao-huodong 533: A-B'
        - 'w.zhonghua-renmin-gongheguo-waijiao 210: A'
    tags: [polity:prc, polity:sweden, name:zhou-enlai, vis:only:prc+sweden]
    time_zone: Asia/Shanghai
  - id: cal.1969-02-28.china-leadership-3
    when: Feb. 28
    date: '1969-02-28'
    time: 1969-02-28T11:15Z
    place: peking
    thread: china-leadership
    also: [africa, middle-east, china]
    c: 'Zhou Enlai receives the Guinean government delegation under Enfa Mara Keita, minister of trade, transport, posts and telecommunications. If Indochina is the first powder keg, the Middle East is the second; the Paris talks, in Vietnam above all, will bring no result unless war decides, what is not won on the battlefield being unwinnable at the table, the more so with aggressor on one side and victim on the other. On economic aid: China favors only aid to build and develop the national economy; its aid is directed to help them reach self-reliance by degrees, and does not touch their sovereignty; true mutual aid among friends on this basis is dependable. In the evening he accompanies Mao in receiving the Guinean guests.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 28, 1969); [[w.zhou-enlai-waijiao-huodong]], 533 (Feb. 28, 1969; 7:15 p.m., Fujian Hall, Great Hall of the People; the Guinean government delegation led by the minister of trade, transport and posts and telecommunications (the book gives 恩法马拉·凯塔)). Made public: 1993. See [[cal.1969-02-28.china-leadership]]. Names: Zhou Enlai, Mao Zedong.'
    src:
