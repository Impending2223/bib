  - id: cal.1969-02-18.china-leadership
    when: Feb. 18
    date: '1969-02-18'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on the suggestion of the Lanzhou Military Region and the Water and Power Ministry''s military control commission to import some electrical equipment and conductors for the 330-kilovolt Liujiaxia to Guanzhong extra-high-voltage line, writes Yu Qiuli: mobilizing the potential of Shanghai and Harbin should do it; to be discussed at the national planning conference.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 275 (Feb. 18, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-02-19.china-leadership
    when: Feb. 19
    date: '1969-02-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: approves the old men''s visits to factories for investigation; Group members to go down as well; reform in many fields, nobody knows how to do socialism; on Chen Yi''s report of people jailed in factories: only murder, arson, poison are crimes, a few reactionary slogans are not.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 275–276 (Feb. 19, 1969; the meeting and its attendants); [[w.macfarquhar-maos-last-revolution]], 315 (Mao appoints Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying, marshals and vice premiers, to meet as a group to study international relations; Zhou implied it was Mao''s idea); [[w.mao-zedong-zhuan]], VI, ch. 77 nn.59, 65 (Feb. 19, in a talk with the members of the Cultural Revolution Group''s liaison meeting and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen and Ye Jianying: you old marshals look into international questions, Chen Yi in command, with Xu, Nie and Ye; to Li Fuchun and the others, the five-year plan has two years to run, are you working on it?; in many fields there must be reform, how to do socialism we do not understand; go down and look about, come early and go home late, or take your bedding and stay a week or so; give attention to investigation at home, collect materials and give opinions, n.59; to Chen Boda: your report is nearly written? is Feb. 20 for handing it in likely?; you three are to see Lin Biao together, n.65; the book gives no hall or hour). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 276 (Feb. 19, 1969), has Mao at this meeting asking Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying to study international questions. Check: [[w.macfarquhar-maos-last-revolution]], 315 n.34, reports Gao Wenqian''s suggestion that Zhou put the group to Mao, to keep the marshals occupied. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 77), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: [[w.zhou-enlai-nianpu-1949]], III, 301 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.34a); [[w.wenqian-wannian-zhou-enlai]], 407 (cited by [[w.macfarquhar-maos-last-revolution]], 315 n.34b); Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会 and Chen Yi 陈毅 and others (record 谈话记录), Feb. 19, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.59). Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
    src:
