entries:
  - id: cal.1969-02-02.china-leadership
    when: Feb. 2
    date: '1969-02-02'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing send an agenda for preparing the Ninth Congress (arrival of delegates, approval of delegates, views on the draft constitution, the economic plan, the situation, the central organs after the Congress, propaganda) and a notice to delegates, and ask that Mao and Lin Biao meet the Group in a day or two. Mao: talk in a day or two; the other paper issued.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 2, 1969. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:jiang-qing, vis:only:prc]
  - id: cal.1969-02-04.soviet-union-leadership-2
    when: Feb. 4
    date: '1969-02-04'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'Moscow. Brezhnev with Erban, chairman of the Czechoslovak National Front, whose delegation is in the USSR Feb. 2–4. His points for the talk: the relations of the two parties good, and others wanting to set them at odds; the post-January course juggled by the right; open struggle, no halting halfway, the anti-socialist forces well organized; the opposition''s aims, a congress, elections to the National Assembly, the unions, workers'' councils taking industry out of the party''s reach, attacks on the security organs; the National Front''s part, and Erban''s, praised.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 348–49 (№ 82, Brezhnev''s points for the talk, Feb. 4), 434 nn.1–3 (the editors: the National Front delegation under Erban, the Politburo''s decision of Jan. 19; the talk Feb. 4). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 313 (the secretaries'' record, Feb. 4: Brezhnev, in from Barvikha, receives Erban in his office at the Central Committee, 3 to 6:35 p.m.). Made public: 2016. To check: the Czechoslovak record; the points are Brezhnev''s, not what was said. Names: Erban, Brezhnev.'
    src:
      c: '10551408'
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 313: ?'
    tags: [polity:ussr, polity:czechoslovakia, name:brezhnev-leonid, vis:only:ussr+czechoslovakia]
  - id: cal.1969-02-07.soviet-union-leadership
    when: Feb. 7–10
    date: '1969-02-07'
    thread: soviet-union-leadership
    c: Zavidovo, Moscow. Kádár, met by Brezhnev at the Kiev station the evening before. Brezhnev leaves for Zavidovo Feb. 7 at noon for the negotiations with him; Feb. 10, 1 to 3 p.m., the lunch for Kádár at the Lenin Hills reception house; sees him off at the Kiev station, 3:15 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 314 (Feb. 6–10). Names: Brezhnev, Kádár.'
    tags: [name:brezhnev-leonid, name:kadar-janos, polity:ussr, polity:hungary]
  - id: cal.1969-02-07.china-leadership
    when: Feb. 7
    date: '1969-02-07'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group: study the course of the "three supports, two militaries" since Feb. 1967, and what has changed since propaganda teams went into schools, factories and offices; no "activists'' congresses" and no side-taking; students started the movement, then turned to civil war and no longer listened; in Wuhan in 1967 they had lost the main direction.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1969. Made public: 2013. Names: Mao Zedong.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-02-11.vietnam-hanoi
    when: Feb. 11
    date: '1969-02-11'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Politburo''s cable to Phạm Hùng: agreed with COSVN on pushing the cities'' struggle for peace and the forming of a third force, between the patriots and Washington''s extreme agents; the Alliance need not call openly for talks with the middle strata on a peace cabinet. For study: talks between the Front and the Alliance on a provisional coalition government, at a low level its program and a campaign for it, at a high level its proclamation, with ministers, once the socialist countries'' recognition is sounded. Sihanouk to be invited to the North; the ambassador, Nguyễn Thương, called home.'
    n: '*Điện của Bộ Chính trị, ngày 11 tháng 2 năm 1969, Về đấu tranh ở đô thị* (the title the editors''), to "Anh Bảy Cường" (Phạm Hùng, the editors'' note). [[w.van-kien-dang-toan]], XXX, 19–21. Made public: 2004. Names: Phạm Hùng, Sihanouk, Nguyễn Thương.'
    tags: [polity:drv, polity:us, polity:cambodia, vis:only:drv, name:norodom-sihanouk]
  - id: cal.1969-02-12.vietnam-hanoi
    when: Feb. 12
    date: '1969-02-12'
    thread: vietnam-hanoi
    c: 'The Central Committee''s letter to the twenty-third congress of the Danish Communist Party: greetings; the Danish party''s fight against the monopolies, NATO and West German revanchism; thanks for its support of Vietnam.'
    n: '*Thư của Ban Chấp hành Trung ương Đảng Lao động Việt Nam, ngày 12 tháng 2 năm 1969, gửi Đại hội lần thứ XXIII Đảng Cộng sản Đan Mạch* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004. Check: where the congress met and whether the greeting was read there; whether *Nhân Dân* printed it at the time; the volume prints it from the Party archive, signed by the Central Committee.'
    tags: [polity:drv, vis:only:drv+denmark]
  - id: cal.1969-02-14.vietnam-hanoi
    when: Feb. 14
    date: '1969-02-14'
    thread: vietnam-hanoi
    c: 'The Secretariat''s directive no. 169-CT/TW on education in 1968–70: five million at school, from kindergarten to general and adult schooling; nearly a million children without the second level, tens of thousands illiterate in the mountains and Catholic areas, quality weak, teachers short and overworked. Quality first, the second level the core, the South''s needs served, the teachers trained, the curricula and textbooks revised.'
    n: '*Chỉ thị của Ban Bí thư số 169-CT/TW, ngày 14 tháng 2 năm 1969, Về công tác giáo dục trong ba năm 1968-1970*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 21–33. Made public: 2004. See [[cal.1968-08-08.vietnam-hanoi]].'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-02-17.soviet-union-leadership
    when: Feb. 17
    date: '1969-02-17'
    thread: soviet-union-leadership
    c: Moscow. Brezhnev receives Ulbricht, 10 to 12:45, and lunches with him at the reception house, 1 to 2; sees him off at Vnukovo, 3 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 316 (Feb. 17). Names: Brezhnev, Ulbricht.'
    tags: [name:brezhnev-leonid, name:ulbricht-walter, polity:ussr, polity:gdr]
  - id: cal.1969-02-19.china-leadership
    when: Feb. 19
    date: '1969-02-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: approves the old men''s visits to factories for investigation; Group members to go down as well; reform in many fields, nobody knows how to do socialism; on Chen Yi''s report of people jailed in factories: only murder, arson, poison are crimes, a few reactionary slogans are not.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1969. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
    tags: [polity:prc, name:mao-zedong, name:chen-yi, name:li-fuchun, name:li-xiannian, name:xu-xiangqian, name:nie-rongzhen, name:ye-jianying, vis:only:prc]
  - id: cal.1969-02-25.soviet-union-leadership
    when: Feb. 25
    date: '1969-02-25'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: 'The Politburo, by the editors probably on Chervonenko''s report on Czechoslovakia. Brezhnev''s notes: the Czechoslovak editions, to be halted or not; the "Black Book"; a letter to the Czechoslovak party''s Executive Committee, on the party''s leading role and normalization; support for the internationalist cadres; a meeting on the model of Čierna nad Tisou, or of the six parties; a marshal to go at Svoboda''s request. By the editors neither meeting was held.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 359–60 (№ 85, Brezhnev''s notes, Feb. 25), 438–39 nn.51–62 (the editors: the meeting question, the six parties, not held). Made public: 2016. To check: the protocol of Feb. 25, and the date, which the book gives from the notes'' own heading. Names: Chervonenko, Brezhnev, Svoboda.'
    tags: [polity:ussr, polity:czechoslovakia, name:brezhnev-leonid, name:chervonenko-stepan-v, name:svoboda-ludvik, vis:only:ussr]
  - id: cal.1969-02-28.china-leadership
    when: Feb. 28
    date: '1969-02-28'
    thread: china-leadership
    also: [africa]
    c: Mao receives the Guinean government delegation under Enfa Mara Keita (minister of trade, transport, posts and telecommunications), Hall 118, evening; Zhou Enlai and Li Xiannian present. Young states, young officers; China's cadres too old; its experience good in part, not all to be copied.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 28, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Xiannian, Keita. Check: the minister''s name, "Enfa Mara Keita" in the Chinese. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
    tags: [polity:prc, polity:guinea, name:mao-zedong, name:zhou-enlai, name:li-xiannian, vis:only:prc+guinea@C-E]
