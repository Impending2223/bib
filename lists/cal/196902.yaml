    place: my-tho
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Mỹ Tho and Đồng Tâm. At night Regiment 1, with Artillery Battalion 309F, raids the town and the base: dozens of Saigon and American troops out of action, 12 aircraft and six guns destroyed or damaged, by the history''s count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 111. See [[cal.1969-02-22.vietnam-hanoi]]. The words: "đêm 22-2-1969" (the night of Feb. 22, 1969). Check: the regiment''s region; the history says Regiment 1 of the delta forces and does not number it.'
