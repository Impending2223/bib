  - id: cal.1969-02-19.china
    when: Feb. 19
    date: '1969-02-19'
    thread: china
    c: The spokesman of the Foreign Ministry's information department states that the U.S. government, ignoring China's strong protest of Feb. 6 and refusing its stern demand, and colluding with the Chiang clique, plans to send Liao Hequan on to Taiwan, to make a further anti-Chinese incident. China therefore holds it plainly unfit, amid this anti-Chinese air made by the U.S. government, to hold the 135th ambassadorial talks as set, on Feb. 20.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 209 (Feb. 19, 1969).'
    src:
      c: dcbf91f8
      rows:
