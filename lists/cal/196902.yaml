  - id: cal.1969-02-23.vietnam-hanoi
    when: Feb. 23
    date: '1969-02-23'
    place: da-nang
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Region V, the spring phase, to Mar. 31. The three forces hit the American strategic depots at An Đồn, Đà Nẵng, Đèo Son and Miếu Lỗ near Quy Nhơn, and Cam Ranh, and the command posts of the III Marine Amphibious Force, the 23d (Americal) Division and the 11th, 196th and 198th Brigades. The 2d Division draws American mobile forces out to An Hòa, Quảng Đà, Tiên Phước, Quảng Nam, and west of Tư Nghĩa and Đức Phổ, Quảng Ngãi. By the history''s count thousands of the enemy out of action, hundreds of aircraft and vehicles destroyed. AFP, Mar. 14, quotes Lt. Gen. Hoàng Xuân Lãm: the fighting around Đà Nẵng shows the Viet Cong infrastructure intact.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 103–5. See [[cal.1969-02-22.vietnam-hanoi]]. Names: Hoàng Xuân Lãm. Check: the first day, which the history gives as the spring phase''s opening, the night of Feb. 22–23; the figures.'
    tags: [polity:drv, polity:us, name:hoang-xuan-lam]
  - id: cal.1969-02-24.vietnam-hanoi
    when: Feb. 24
    date: '1969-02-24'
    place: binh-phu-ben-tre
    thread: vietnam-hanoi
    c: 'Bình Phú, on the edge of Bến Tre town. At night a sapper company of the Bến Tre provincial command, with an inside agent, raids the base of the 2d Battalion, 10th Regiment, Saigon army: 120 out of action, by the history''s count. Another company destroys five American 105 mm guns at Đồng Cò and Chợ Giữa. The secret cells then lead villagers of the town''s edge to rise and break some strategic hamlets.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 111. See [[cal.1969-02-22.vietnam-hanoi]]. The words: "Đêm 24-2-1969" (the night of Feb. 24, 1969).'
