  - id: cal.1969-02-05.china-leadership
    when: Feb. 5
    date: '1969-02-05'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai sends Mao the list of the Eighth Central Committee''s members and alternates attending the Twelfth Plenum who have and have not been proposed as delegates to the Ninth Congress, noting that he meant to report it in talk but the meeting is put off, so he sends first the written paper agreed at the liaison meeting, for Mao to think over beforehand. Mao: Chen Qihan, a deputy president of the Supreme People''s Court, seems to be worth considering.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 274 (Feb. 5, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 398 (Feb. 1969; Mao''s note ''Chen Qihan 陈奇涵 seems worth considering'' on Zhou''s report of Feb. 5 and the liaison meeting''s list of those of the Eighth Central Committee and alternates who attended the Twelfth Plenum, proposed or not proposed as delegates; Chen Qihan, an alternate member and deputy president of the Supreme People''s Court, was chosen a delegate and at the Congress a member of the Central Committee); [[w.mao-zedong-zhuan]], VI, ch. 77 n.72 (Mao''s comment on Zhou Enlai''s report of Feb. 5, 1969: ''Comrade Chen Qihan 陈奇涵 seems to be worth considering''; the manuscript dated Feb. 1969; the book names no list, n.72). Made public: 2020. To check: Zhou Enlai, report of Feb. 5, 1969 to Mao Zedong, sending the written paper of the Cultural Revolution Group''s liaison meeting on the members and alternate members of the Eighth Central Committee who attended the Twelfth Plenum and were or were not nominated as delegates to the Ninth Congress (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 398 n.1); Mao Zedong 毛泽东, comment on Zhou Enlai''s 周恩来 report of Feb. 5, 1969 (manuscript 手稿), Feb. 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.72). Names: Zhou Enlai, Mao Zedong.'
