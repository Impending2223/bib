    thread: china-leadership
    c: 'Mao reads the draft of July 16, "The Situation of the Great Proletarian Cultural Revolution and Some Questions of Party Policy" (Chen Boda): "Good." The work group (the drafters) to meet once or twice, then the Politburo, with the bureaus and Shanghai and Peking, for two or three days, then it may be published in the Central Committee''s name, best Aug. 1. His changes: the Revolution aims at "revolutionizing men''s thought"; "guide to action" for "highest instruction"; "will win a great victory." He revises it many times more.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 21, 1966; [[w.jianguo-yilai-mao-zedong]], XVIII, 292–295 (July 21, 1966; Mao''s note to Chen Boda, July 21, on the draft of July 16 (twenty-three articles, nineteen pages); printed from the manuscript; note 3 gives his changes on pp. 18–19); [[w.mao-zedong-zhuan]], VI, ch. 75 n.26 (Mao''s revision of the draft Decision, July 21 by the note, n.26: the proletarian cultural revolution is to make men''s thinking revolutionary and so make all work more, faster, better and cheaper; the words ''grasp revolution, promote production'' were added to the Sixteen Points at his wish). [[w.pu-weihua-zalan-jiu-shijie]], 186, 186 n.4 (early in July Mao had the Cultural Revolution Group draft a document, the Twenty-three Points; his note on the twenty-second draft: good; the work group to meet once or twice, then the bureaus'' meeting two or three days; publish in the Central Committee''s name, best Aug. 1; so no plenum was yet planned). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75). To check: *Wuchan jieji wenhua da geming de xingshi he dang de ruogan fangzhen wenti* (the draft of July 16; the later "Sixteen Points"); Draft "The Situation of the Great Proletarian Cultural Revolution and Some Questions of Party Policy" (twenty-three articles, nineteen pages), July 16, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 293 n.1a); Mao Zedong 毛泽东, revision of the draft of the Central Committee''s Decision on the Great Proletarian Cultural Revolution 《关于无产阶级文化大革命的决定》 (manuscript 手稿), July 21, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.26); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 80 (1998) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 186 n.4). Names: Mao Zedong, Chen Boda.'
