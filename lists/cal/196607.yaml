    c: 'Stoessel to Thompson on Sullivan''s proposal: "a non-starter"; the Soviets would take on North Vietnam "with enthusiasm and alacrity" for nothing; East Germany in the UN would betray the Germans, Europe already suspecting the United States would "sell European security interests for a solution to our problems in the Far East."'
    n: '[[w.gibbons-u-s-government-and]], IV, 390. To check: Stoessel to Thompson, "Ambassador Sullivan''s Proposal for an Asian Peace Offensive," July 1, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 390 n.9). See [[cal.1966-06-29.vietnam-4]]. Names: Stoessel, Thompson, Sullivan.'
