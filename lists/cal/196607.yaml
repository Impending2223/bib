  - id: cal.1966-07-01.civil-rights-organizations-2
    when: July 1
    date: '1966-07-01'
    thread: civil-rights-organizations
    also: [open-housing]
    c: 'Carmichael for SNCC, a press statement on the civil rights bill of 1966 as the House Judiciary Committee reported it: "a fraudulent bunch of words," "hypocrisy which attempts to delude the black people of America." Sent to King July 4.'
    n: '[[w.branch-at-canaans-edge]], 533. To check: Carmichael press statement of July 1, 1966, A/K P3£25. "The Civil Rights Act of 1966 as reported by the House Judiciary Committee is totally useless and totally unnecessary," it began. "If passed, it will function both as a fraudulent bunch of words to convince black people of this country that Congress has taken action to deal with their problems, and as a smokescreen to obscure President Johnson''s failure to enforce earlier civil rights legislation." (cited by [[w.branch-at-canaans-edge]], 533); Carmichael to MLK, July 4, 1966, attaching the July | press statement, A/KP3f25 (cited by [[w.branch-at-canaans-edge]], 533). Names: Carmichael, King.'
    src:
      c: 6be80bb3
      rows:
        - 'w.branch-at-canaans-edge 533: all'
        - 'via x.1966-07-01.carmichael-press-statement-of-july-1: all'
        - 'via x.1966-07-04.carmichael-to-mlk-july-4-1966: all'
    tags: [name:carmichael-stokely, name:king-martin-luther-jr]
  - id: cal.1966-07-01.vietnam-congress-2
    when: July 1
    date: '1966-07-01'
    thread: vietnam-congress-foreign-relations
    follows:
      - cal.1966-07-01.vietnam-congress
    c: 'Fulbright in the Senate against the strikes on Hanoi and Haiphong of June 29–30: a long step toward "ultimate war."'
    n: '[[w.woods-j-william-fulbright-vietnam]], 134; [[w.woods-fulbright]], 427. After Marcy''s memorandum urging the speech, by Gibbons''s account. Check: the day and the place. The Senate adjourned June 30 until July 11 ([112 Cong. Rec. 14,897](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt11/pdf/GPO-CRECB-1966-pt11-7-1.pdf) (1966)), so no Senate speech of July 1; the Record of June 30 shows no such speech by Fulbright; the *Arkansas Gazette* of July 1 reports it. The speech may be of June 30 or outside the chamber. To check: "Fulbright Fears New Raids Step to ''Ultimate War,''" *Arkansas Gazette*, July 1, 1966 (cited by [[w.woods-j-william-fulbright-vietnam]], 134 n.34). See [[cal.1966-07-01.vietnam-congress]]. Names: Fulbright.'
    src:
