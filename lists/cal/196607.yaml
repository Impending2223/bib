  - id: cal.1966-07-01.europe-and-the-alliance
    when: July 1
    date: '1966-07-01'
    thread: europe-and-the-alliance-france
    c: 'French forces leave NATO''s integrated commands. The French forces in Germany stay, their terms unsettled: July 19, de Leusse for France in the Council refuses the Fourteen''s paper of assumptions on them; by July 29 the mission to NATO reports the talks deadlocked.'
    n: FRUS 1964–68, XIII, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v13/d184), [187](https://history.state.gov/historicaldocuments/frus1964-68v13/d187), [190](https://history.state.gov/historicaldocuments/frus1964-68v13/d190). See [[cal.1966-03-07.europe-and-the-alliance]].
