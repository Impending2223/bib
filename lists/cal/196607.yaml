  - id: cal.1966-07-08.china-leadership
    when: July 8
    date: '1966-07-08'
    place: wuhan
    thread: china-leadership
    c: 'Mao to Jiang Qing, from Wuhan. Great disorder brings great order; again in seven or eight years. A friend''s talk on coups (Lin Biao''s of May 18) makes him uneasy: he never believed his few little books had such power; "forced onto Liangshan," he agrees against his will, the first time in a life; there is some tiger in him and some monkey; his aim is to overthrow the right across Party and country, and to sweep the ghosts again in seven or eight years; he is a Zhong Kui of the 1960s.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1966; July 11–12, 1966, and note 47 (shown to Zhou Enlai and Wang Renzhong). [[w.macfarquhar-maos-last-revolution]], 52 (Mao to his wife: great disorder under heaven for great order); [[w.jianguo-yilai-mao-zedong]], XVIII, 283–287 (July 8, 1966; Mao''s letter of July 8, printed from the revised copy: her letter of June 29 received; she had better stay in Shanghai as Wei Wenbo 魏文伯 and Chen Pixian 陈丕显 advise; since leaving Hangzhou June 15 he lived ten-odd days in a cave in the west (the Dishuidong 滴水洞, Shaoshan) and came to Wuhan June 28; two receptions of foreign guests this month; note 8: Lin Biao''s speech of May 18 on coups, forwarded by the Center Sept. 22; note 13: printed in May 1972 as a document of the meeting reporting on the criticism of Lin Biao and rectification, parts printed in *Renmin ribao* Oct. 1, 1972, Sept. 2, 1973 and Mar. 1, 1975); [[w.macfarquhar-origins-of-the-cultural]], III, 459 (Mao, in a letter to Jiang Qing, has reservations about Lin Biao''s talk of coups); [[w.mao-zedong-zhuan]], VI, ch. 74 n.52 (July 8, the letter shown to Zhou Enlai and Wang Renzhong, then at Wuhan, taken by Zhou to Jiang Qing at Shanghai, and its contents told to Lin Biao at Dalian at Mao''s request; the passages: great disorder to great order, again in seven or eight years; a friend''s talk the Chairman cannot accept, he never believed his small books had such power, ''forced onto Liangshan'', agreeing against his will, the first time in his life on a major question; the aim to overthrow the right in the whole Party and country and to sweep away ox-demons again in seven or eight years; a Zhong Kui 钟馗 of the 1960s; the ''friend'' is Lin Biao, his speech of May 18, n.52). [[w.teiwes-tragedy-of-lin-biao]], 58, 62–63, 100 (Mao''s letter to Jiang Qing, in disquiet at his "friend''s" speech: it touches coups only briefly and dwells on the claims of his genius and supernatural powers); [[w.pu-weihua-zalan-jiu-shijie]], 172–173 (at Wuhan; the text at length; the letter "kept wholly secret" at the time). Made public: 1972 (Check: the Center circulated the letter in the Party in 1972, after Lin Biao''s fall; the nianpu gives no date). Check: the Wengao (XVIII, 286 n.13) has the letter printed in May 1972 as a document of the meeting on the criticism of Lin Biao and rectification (internal), and parts of it first in *Renmin ribao*, Oct. 1, 1972. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII (the letter); [[w.wenhua-dageming-yanjiu-ziliao]], I, 55 (cited by [[w.macfarquhar-maos-last-revolution]], 52 n.1); Jiang Qing, letter to Mao Zedong of June 29, 1966 (answered by his letter of July 8) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 283); Lin Biao, speech on coups to the enlarged Politburo meeting, Peking, May 18, 1966 (forwarded by the Center Sept. 22, 1966) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.8); Mao Zedong, letter to Jiang Qing of July 8, 1966, printed as a document of the meeting reporting on the criticism of Lin Biao and rectification, May 1972 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.13a); Renmin ribao, Oct. 1, 1972 (and Sept. 2, 1973, Mar. 1, 1975), printing parts of Mao''s letter to Jiang Qing of July 8, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.13b); Mao Zedong, letter to Jiang Qing, in [[w.wenhua-dageming-yanjiu-ziliao]], shang, 55–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.160a); Mao Zedong 毛泽东, letter to Jiang Qing 江青, July 8, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.52); [[w.kau-lin-piao-affair]], 119–120 (cited by [[w.teiwes-tragedy-of-lin-biao]], 63 n.13); 劉林元, 〈決戰前的憂慮和不安心態的坦露——毛澤東1966年7月8日給江青的信解讀〉, 《南京社會科學:經濟哲學版》, 1995, no. 11, 24–31 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 174 n.123). Names: Mao Zedong, Jiang Qing, Lin Biao.'
