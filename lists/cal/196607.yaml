  - id: cal.1966-07-13.china-leadership-5
    when: July 13
    date: '1966-07-13'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi presides at an enlarged meeting of the Politburo Standing Committee, which hears the Youth League''s Central Committee on the "Preliminary Plan for the Cultural Revolution in Peking''s Middle Schools," and instructs on the aims, requirements and policy. (1) Education here comes down from the bourgeois education; so not all with bourgeois educational thought are to be criticized, only a few representatives, while most are to be educated, and a proletarian educational line set up. (2) Party and League organizational life is to be built up and perfected and the leading role of the Party branch and the helping role of the League branch restored; this is a separate item; the organizations are not to be put aside but watched in the movement for whether they can lead, and tempered; building, rectifying and perfecting them is to be a task. (3) Clear up the economy: with politics, organization and thought clear, take the chance to clear the economy too. Junior middle schools are to finish the first stage by the end of August or September, to open classes in October; senior middle schools in September or October.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 644–645 (July 13, 1966); [[w.macfarquhar-maos-last-revolution]], 75 (Liu''s instructions to the Youth League on the middle schools: Party and League branches to be revived and strengthened; the movement over in August or September in the lower middle schools, September or October in the higher). Made public: 1996. Names: Liu Shaoqi.'
