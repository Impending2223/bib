    n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1966; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645 (July 18, 1966; Mao returns to Peking from Wuhan); [[w.macfarquhar-maos-last-revolution]], 82 (Mao returns two days after the swim; citing security concerns he does not go to Zhongnanhai); [[w.macfarquhar-maos-last-revolution]], 82 (the first day back Mao is briefed by Kang Sheng and Chen Boda, who give him material on the Cultural Revolution at Peking University, Tsinghua, Peking Normal University and China People''s University); [[w.macfarquhar-origins-of-the-cultural]], III, 461 (back in Peking by July 18, Mao hears Kang Sheng, Chen Boda and others through the night); [[w.deng-xiaoping-nianpu-1904]], III, 1924 (July 18, 1966; Mao back in Peking from outside; having read the Cultural Revolution Group''s materials on the work teams he shows his dissatisfaction with the state of the ''cultural revolution'' under Liu Shaoqi''s and Deng''s direction); [[w.mao-zedong-zhuan]], VI, ch. 74 (July 18 Mao returns to Peking after more than half a year away; hears reports one after another, reads the bulletins of Peking University, Tsinghua and other universities, and finds the movement in Peking cold and the students held down). [[w.yang-jisheng-tiandi-fanfu]], I, 153, 171, 175 (Mao left Peking in October 1965 and returned only on July 18, 1966, staying away from the May meeting too; Yang writes on I, 175 that he came back to Peking from Shanghai); [[w.yang-jisheng-tiandi-fanfu]], II, 1144; [[w.teiwes-tragedy-of-lin-biao]], 63 (Mao, who watched from Hunan the "fifty days" of clashes on the campuses, returns to Peking in late July and declares that the work teams wrongly suppressed the students); [[w.chen-yi-nianpu]], 1157 (July 18, 1966; Mao back in Peking from Wuhan; on July 25, to the regional bureaus'' secretaries and the Cultural Revolution Group, the work teams "play a bad role"; on July 29 Li Xuefeng reads the Peking committee''s decision of July 28 withdrawing the work teams); [[w.pu-weihua-zalan-jiu-shijie]], 140 (mid-July, Mao comes back to Peking from outside; he finds the Red Guards, the Monkey Kings he had called for months before, and at once affirms and firmly backs them); [[w.chen-yun-nianpu-xiuding]], III, 153–154 (mid-July, Mao back in Peking sharply charges the work teams with "a bad role, obstructing the movement"); [[w.zhu-de-nianpu-xinbian]], III, 1955 (July 18, 1966; Mao Zedong 毛泽东 returns to Peking 北京 from Wuhan 武汉); [[w.pu-weihua-zalan-jiu-shijie]], 174 (from Wuhan; hears Jiang Qing, Kang Sheng, Chen Boda and others; reads the materials of the work groups at Peking University, Peking Normal, Tsinghua and People''s University; displeased, but says nothing yet on the work groups). Made public: 1991. To check: [[w.xin-jiehou-changyi]], 146 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.68); [[w.xin-guanyu-gongzuozu-cunfei-wenti]], 643 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.70a); [[w.yanchi-tao-zhu-zai-wenhua]], 99 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.70b); [[w.harding-chinese-state-in-crisis-1991]], 134–137 (cited by [[w.teiwes-tragedy-of-lin-biao]], 63 n.16). Names: Mao Zedong.'
