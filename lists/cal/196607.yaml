    thread: vietnam-congress-foreign-relations
    c: 'Marcy to Fulbright, after Johnson''s "I want to see the alternatives" and Russell''s like words, June 30: make the speech; with the Princeton study, "a pretty credible showing of initiative and search for alternatives." "Since the hawks say ''put up or shut up,'' maybe you ought to ''put up.''"'
    n: '[[w.gibbons-u-s-government-and]], IV, 348. To check: Marcy to Fulbright, July 1, 1966, National Archives, RG 46, Papers of the Committee on Foreign Relations, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], IV, 348 n.107). See [[cal.1966-06-18.vietnam-congress]]. Names: Marcy, Fulbright, Johnson, Russell.'
