    c: Ma Shijiang 马石江, vice-president of the Youth League's central school 中央团校, which sent the work groups to Haidian's 海淀 sixty-six middle schools, has a letter to the Center 中共中央 drafted on the beatings Wang Li's 王力 dismissal of Zhou Jie 周杰 set off, and sends beaten work group members to complain of Wang Li at the Center's General Office 中共中央办公厅, the State Council 国务院 and the North China Bureau 华北局.
