  - id: cal.1966-07-29.china-leadership
    when: July 29
    date: '1966-07-29'
    place: peking
    thread: china-leadership
    c: 'Peking, Great Hall. The Peking committee''s meeting of college and middle-school activists: Li Xuefeng reads the committee''s decision on withdrawing the work groups; Liu Shaoqi and Deng Xiaoping take responsibility for sending them; Zhou Enlai conveys Mao''s three tasks for the schools (fight, criticize, reform). Mao meets all the delegates at the close. The recording goes to the provinces, and the work groups are withdrawn there.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 29, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 42–43 (July 29, 1966; Zhou''s speech after Dengs: the movement went from early heat to a cooler middle for two reasons, the leaders misjudgment of the situation and fear of disorder, and the hasty decision to send work groups everywhere; most work-group members are good, old revolutionaries meeting new problems; the three tasks; the school Cultural Revolution''s bodies after the withdrawal; Liu Shaoqi speaks after him); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646–647 (July 29, 1966; Liu speaks at the Peking committee''s meeting of activists of the colleges and middle schools and takes responsibility on behalf of the Center for the work-group question: sending work groups was the Center''s decision and the Center''s consent; it is now found the form does not fit the present needs of the cultural revolution, and the Center has decided to withdraw them; he suggests that in the movement the few be protected, those with different views who are in the minority, for debate between them is needed; ox-ghosts and snake-spirits are to be handled by wall posters, great airing and great debate, and a debate meeting is not to become a struggle meeting (Zhou Enlai had just said so); the majority of today may be the minority of tomorrow; on how to carry out the proletarian cultural revolution he says he does not know, that he is not sure the Party Center''s other workers know, and that the revolution is chiefly to be learned among the masses of teachers, students and workers; "we can now only learn from you and listen to your views," and the announcement at the meeting is that all work groups are withdrawn); [[w.macfarquhar-maos-last-revolution]], 84–85 (a rally of some 10,000 college and middle-school teachers and students; Li Xuefeng reads the committee''s decision; Deng, Zhou and Liu speak, in that order; Liu: "I don''t know either"; Mao comes on stage at the end and ignores Liu and Deng; tapes are played on campuses all over Peking and the work teams are withdrawn everywhere); [[w.deng-xiaoping-nianpu-1904]], III, 1926 (July 29, 1966; Deng speaks, for the Central Committee 中央, at the meeting of ten thousand teachers and students, activists of the ''cultural revolution'' in Peking''s 北京 colleges and middle schools, which the Peking municipal committee holds in the Great Hall of the People 人民大会堂; there Li Xuefeng 李雪峰, on Mao''s instruction, announces in the Central Committee''s name the withdrawal of the work teams from the schools, and Zhou Enlai 周恩来 and Liu Shaoqi 刘少奇 make self-criticisms and take responsibility for sending the teams. Deng: it must be said that after the new Peking Party committee was set up the teams were sent in its name on the Center''s view; the Center''s way of dealing with this new problem was fairly hasty; some comrades say old revolutionaries meet new problems, and so it is; the comrades in the Center and in the municipal committee have no experience of such an unprecedented movement and did not give the teams concrete support in some respects; most of the team members wished subjectively to do well, but leadership did not help them enough, and they had not learned to use Mao''s mass line and democratic centralism and made this or that error, most errors being of thinking and working method, some responsibility falling on those above; all good team comrades are to take an active attitude and accept the masses'' criticism with an open mind); [[w.mao-zedong-zhuan]], VI, ch. 74 (July 29 at the Great Hall of the People 人民大会堂, Peking, the meeting of cultural-revolution activists among teachers and students of the colleges and middle schools: Li Xuefeng reads the Municipal Committee''s decision, withdrawing the teams; Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others speak and take the responsibility for sending them, ''old revolutionaries meeting new problems''; at the close Mao meets all the delegates, showing his approval; the recording of the meeting is sent to the provinces and cities, which withdraw their teams one after another). [[w.yang-jisheng-tiandi-fanfu]], I, 216–217 (the evening of July 29 7月29日晚, Great Hall of the People: the meeting of activists of the colleges and universities; Li Xuefeng for the Peking committee declares the withdrawal of the work groups; Deng Xiaoping, Zhou Enlai and Liu Shaoqi speak; Liu: how to make a proletarian cultural revolution, "you do not know, and I honestly do not either; I think the others in the Center do not"; sending work groups was decided by the Center and the Center agreed, the form no longer suits and the Center decides to pull them out, and if the students will not let them go, they may criticize; of the Tsinghua teacher''s slogan, "support the Center, oppose Mao," "beat him," a protective detention; no one announces Liu''s end, Mao comes out from behind and, to everyone''s surprise, stands on the rostrum waving, the hall in an uproar; Zhou leads the singing of 《大海航行靠舵手》); [[w.yang-jisheng-tiandi-fanfu]], II, 1144 (evening, the Peking committee''s rally of activists of the colleges and middle schools; all labelled rightists by the work groups rehabilitated); [[w.jian-zhou-enlai]], 548 (the Peking committee''s rally of college and middle-school activists in the Great Hall; Zhou conveys Mao''s three tasks, "To struggle, to criticize, and to transform"; as a "veteran revolutionary" he has "encountered new problems"; Liu and Deng the same); [[w.zhu-de-nianpu-xinbian]], III, 1955 (July 29, 1966; Zhu De 朱德 at the Peking new municipal committee''s 中共北京新市委 meeting of the activists of the Cultural Revolution among the teachers and students of the capital''s colleges and middle schools (the "meeting of ten thousand" 万人大会), which announces the withdrawal of the work teams 工作组; Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平 and others speak and take the blame for sending them, "old revolutionaries meeting a new problem"); [[w.pu-weihua-zalan-jiu-shijie]], 181–183, 182 n.131 (Li Xuefeng: the new committee asked for the work groups; sending them proved unsuitable and obstructed the movement; the masses rightly dismissed Zhang Chengxian, Sun Youyu, Zhou Jie; Guo Yingqiu removed as the committee''s secretary for culture and education; Deng, "for the Center": the Center agreed to sending the groups; Zhou: the groups were sent in haste; Liu: how to make the cultural revolution "I do not know either"; classes stopped for half a year; at the close Mao comes from backstage to receive all the delegates; afterward the recordings of the four speeches are played in the big cities and the work groups withdrawn across the country). To check: Xinhua''s report, July 30; [[w.pipan-ziliao]], III, 702 (cited by [[w.macfarquhar-maos-last-revolution]], 85 n.88); [[w.zhisui-private-life-of-chairman]], 469–470 (cited by [[w.macfarquhar-maos-last-revolution]], 85 n.90); Mao Mao 毛毛, *Wode fuqin Deng Xiaoping "wenge" suiyue* 《我的父親鄧小平「文革」歲月》 (Zhongyang wenxian chubanshe 中央文獻出版社, 2000), 23 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 217 n.85); [[w.zhou-enlai-nianpu-1949]], III, 41–42 (cited by [[w.jian-zhou-enlai]], 548 n.21); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646–647; [[w.deng-xiaoping-nianpu-1904]], III, 1926 (cited by [[w.jian-zhou-enlai]], 548 n.22a, n.22b); the speeches of Li Xuefeng, Deng Xiaoping, Zhou Enlai and Liu Shaoqi (July 29, 1966), in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 182 n.131). Names: Li Xuefeng, Liu Shaoqi, Deng Xiaoping, Zhou Enlai, Mao Zedong.'
