    date: 1966-07
    at: after 1966-07-18
    thread: china-leadership
    c: Mao Zedong 毛澤東 has Tao Zhu 陶鑄, Wang Renzhong 王任重 and Zhang Pinghua 張平化 revise the draft Decision on the cultural revolution. Tao Zhu consults Zhou Enlai 周恩來, and they strike out "black gang" and "black line" and add words of limit.
