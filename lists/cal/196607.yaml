  - id: cal.1966-07.vietnam-hanoi-2
    when: July, early
    date: 1966-07
    at: before 1966-07-01
    thread: vietnam-hanoi
    also: [china-leadership]
    c: 'The Vietnam Workers'' Party''s greetings on the forty-fifth anniversary of the Chinese Communist Party: from Central Committee to Central Committee, unsigned; the year before Hồ Chí Minh, Lê Duẩn and Phạm Văn Đồng had initialed them, to their counterparts. The Soviet embassy: a reaction to Chinese "blackmail."'
    n: '[[w.khoo-collateral-damage]], 35. To check: Report of the first secretary of the Soviet embassy in Hanoi, July 9, 1966, doc. no. 21, printed in [[w.luthi-twenty-four-soviet-bloc]], 393–394 (cited by [[w.khoo-collateral-damage]], 35 nn.182a, 183a); [[w.luthi-twenty-four-soviet-bloc]], 393 (cited by [[w.khoo-collateral-damage]], 35 n.182b); [[w.luthi-twenty-four-soviet-bloc]], 393–394 (cited by [[w.khoo-collateral-damage]], 35 n.183b). Check: the day. Names: Hồ Chí Minh, Lê Duẩn, Phạm Văn Đồng.'
