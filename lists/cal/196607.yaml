  - id: cal.1966-07-01.medicare
    when: July 1
    date: '1966-07-01'
    thread: medicare
    also: [health, civil-rights-the-executive]
    c: 'Medicare in effect: hospital insurance for those 65 and over, and the voluntary plan for doctors'' bills. A hospital paid only if certified by HEW as complying with Title VI of the Civil Rights Act. Johnson''s telegram of thanks to the American Hospital Association, read by Moyers at San Antonio.'
    n: 'Telegram to the Director, American Hospital Association, on Preparations for Medicare, [1966 Pub. Papers 697](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=71) (July 1, 1966). [[w.bernstein-guns-or-butter]], 180–81 (Cohen: "perhaps the biggest single governmental operation since D-Day"). To check: [[w.smith-health-care-divided]]. See [[cal.1965-07-30.medicare]]. Names: Moyers, Johnson.'
    src:
      c: e19bceff
      rows:
