  - id: cal.1966-07.china-leadership-22
    when: July
    date: 1966-07
    place: wuhan
    thread: china-leadership
    c: Wuhan 武漢. Under the Hubei committee's line of catching rightists, factories, offices, schools and hospitals "drag out" their "Three-Family Villages"; tens of thousands are held in the units' own jails; parades, raids, dunce caps; many drown themselves in the river.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 466.'
    src:
      c: 6ebfade0
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 466: all'
    tags: [polity:prc]
