    c: 'Zhou Enlai, at 4 a.m., writes Liu Shaoqi and Deng Xiaoping: on last night''s talk, after thought and more papers, the differences come from the reading of the situation and of the problem, not other causes; better not to talk of them. In Peking sending work groups was general and necessary, but each groups case is special and needs a local inquiry; working relations must be settled and fixed, or work is hard. He went this morning to the Foreign Languages Institute to read the wall posters.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 40–41 (July 24, 1966); [[w.macfarquhar-maos-last-revolution]], 83 (the letter, in part: the differences come from one''s estimate of the situation; in Peking sending work teams had common and necessary elements; this morning he goes to the Foreign Languages Academy to read big-character posters); [[w.jian-zhou-enlai]], 548 (the letter: the differences with the chairman "have mainly been caused by different evaluations and understandings of the current situation"; he had shared their "general understanding" that "there was the need" for the teams; "every work team has had its specific experience"; "it is necessary to investigate and concretely analyze each case"). Made public: 1997. To check: [[w.zhou-enlai-nianpu-1949]], III, 41–42 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.77). Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
