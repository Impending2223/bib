    tags: [polity:drv, polity:prc, name:ho-chi-minh, name:le-duan, name:pham-van-dong]
  - id: cal.1966-07.china-leadership-24
    when: July, mid
    date: 1966-07
    at: before 1966-07-11
    thread: china-leadership
    c: In the Politburo the dispute over the work teams sharpens, Liu Shaoqi 刘少奇, Deng Xiaoping 邓小平 and others on one side, Chen Boda 陈伯达, head of the Central Cultural Revolution Group, and Kang Sheng 康生, its adviser, on the other, on whether the movement keeps the Party's leadership; at an evening meeting both sides pound the table. Chen Yi 陈毅 backs the work teams and rebuts Chen Boda, who calls the work team Chen Yi sent to the Committee for Cultural Relations with Foreign Countries the worst in the country.
    n: '[[w.chen-yi-nianpu]], 1157. Made public: 1995. Names: Chen Yi, Liu Shaoqi, Deng Xiaoping, Chen Boda, Kang Sheng.'
    tags: [polity:prc, name:chen-yi, name:liu-shaoqi, name:deng-xiaoping, name:chen-boda, name:kang-sheng, ok:fields-place, ok:fields-time, vis:only:prc]
  - id: cal.1966-07.china-leadership-25
    when: July, late
    date: 1966-07
    at: before 1966-07-21
    thread: china-leadership
    c: Wall posters in the Foreign Ministry against Chen Yi 陈毅 charge that at an enlarged meeting of the ministry's Party group in June he "viciously attacked" Mao's launching of the Cultural Revolution as "the emperor deciding alone" (乾纲独断).
    n: '[[w.chen-yi-nianpu]], 1158–1159. Ji Pengfei''s 姬鹏飞 later account, as the nianpu gives it, calls the charge the rebels'' fabrication. Names: Chen Yi, Mao Zedong.'
    tags: [polity:prc, name:chen-yi, name:mao-zedong, ok:fields-place]
