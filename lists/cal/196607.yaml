    c: 'Mao approves Liu Shaoqi''s and Deng Xiaoping''s draft notice (June 30): industry, communications and construction units not to start the Cultural Revolution all at once; the stress on culture, education and Party and government organs; factories and the rest follow the Four Cleanups and the Twenty-three Articles together with the movement. "Agreed; send it down quickly." The Center and State Council issue it that day.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 2, 1966; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 643–644 (June 30 and July 2, 1966; Liu and Deng Xiaoping send Mao a letter with a draft notice on how industry, communications and capital-construction units are to carry out the cultural revolution: the movement is spreading, the Center and provinces must lead it with great force, and if factories, mines and construction units rise at once the leadership cannot cope; the plan results of industry, communications and construction have lately been poor, steel, steel products and coal output beginning to fall, quality falling, accidents rising, and the capital-construction task for the first half-year only 35.6 percent done against 40 planned; after discussion in Peking the deployment of the cultural revolution is to stress the culture and education departments and the Party and government organs, while industrial, communications, construction, commercial and hospital units go on with the "four clean-ups" and the "Twenty-three Articles" joined to the cultural revolution (Shanghai is doing so in an enterprise of 400,000 workers, with Liu''s reply of agreement), to be spread later; Mao writes on July 2 that he agrees and the notice should be issued quickly, and it goes out that day, saying the work is to be done by stages, by plan, under work teams sent from above); [[w.macfarquhar-maos-last-revolution]], 76–77 (Liu and Deng''s letter of June 30; Mao''s reply of July 2, agreeing); [[w.jianguo-yilai-mao-zedong]], XVIII, 281–282 (July 2, 1966; Mao''s note to Liu Shaoqi and Deng Xiaoping: their letter and notice of June 30 received and read; agreed, the notice to go down quickly; printed from the manuscript; note 2: steel, rolled steel and coal output falling, quality worse, accidents more; the Center issued the notice July 2). Made public: 1996. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 69 (cited by [[w.macfarquhar-maos-last-revolution]], 77 n.48); Liu Shaoqi and Deng Xiaoping, letter to Mao Zedong of June 30, 1966 on the Cultural Revolution in industry, communications and construction (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 281 n.2a); Central Committee and State Council, draft notice on how industrial and communications enterprises and construction units are to carry out the Cultural Revolution, June 30, 1966 (issued July 2) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 282 n.2b). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
