  - id: cal.1966-07-01.civil-rights-organizations-2
    when: July 1
    date: '1966-07-01'
    thread: civil-rights-organizations
    also: [open-housing]
    c: 'Carmichael for SNCC, a press statement on the civil rights bill of 1966 as the House Judiciary Committee reported it: "a fraudulent bunch of words," "hypocrisy which attempts to delude the black people of America." Sent to King July 4.'
    n: '[[w.branch-at-canaans-edge]], 533. To check: Carmichael press statement of July 1, 1966, A/K P3£25. "The Civil Rights Act of 1966 as reported by the House Judiciary Committee is totally useless and totally unnecessary," it began. "If passed, it will function both as a fraudulent bunch of words to convince black people of this country that Congress has taken action to deal with their problems, and as a smokescreen to obscure President Johnson''s failure to enforce earlier civil rights legislation." (cited by [[w.branch-at-canaans-edge]], 533); Carmichael to MLK, July 4, 1966, attaching the July | press statement, A/KP3f25 (cited by [[w.branch-at-canaans-edge]], 533). Names: Carmichael, King.'
    src:
      c: 6be80bb3
      rows:
