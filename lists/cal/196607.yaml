  - id: cal.1966-07-22.china-leadership-7
    when: July 22
    date: '1966-07-22'
    thread: china-leadership
    also: [china]
    c: 'Liu Shaoqi presides at an enlarged meeting of the Politburo Standing Committee, which takes up the "Preliminary Plan for the Cultural Revolution in Peking''s Institutions of Higher Learning" and instructs on the movement in the colleges: (1) the direction of the struggle, the main direction being the power-holders; (2) the way, civil and not armed struggle, with preparation first, no battle unprepared or unsure; (3) ranks, whose thought is first to be unified; (4) no "putting on caps" and no limiting others'' freedom. On the work groups: most are good and are to be helped and corrected, some should not be driven off, others should. There are now three directions of struggle in the schools, against the power-holders, against the work group and against the masses and students, and all three exist; schools differ and are not to adopt Peking University''s way. He suggests that Peking set up cultural revolution committees by class, department and school and hold a delegates'' conference, and the middle schools a conference of teacher and student delegates.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 645–646 (July 22, 1966); [[w.macfarquhar-maos-last-revolution]], 83 (July 22: the meeting agrees on keeping strict control over the Cultural Revolution in the institutions of higher learning); [[w.deng-xiaoping-nianpu-1904]], III, 1924–1925 (July 22, 1966; Deng with Liu Shaoqi presides at the enlarged Standing Committee meeting, which discusses the ''Preliminary plan for the cultural revolution in Peking''s universities and colleges''; when the work teams are disputed Deng and Liu hold to the view that ''most work teams are good''); [[w.pu-weihua-zalan-jiu-shijie]], 175 (the enlarged Standing Committee on the Peking colleges'' preliminary plan; Chen Boda again proposes ending the work groups and most oppose; Deng: "some schools without a work team may not do"; Liu: most work groups are good; Ye Jianying and Liu Zhijian, for the army, oppose withdrawing them). Made public: 1991. To check: [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 272 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.76b). Names: Liu Shaoqi.'
