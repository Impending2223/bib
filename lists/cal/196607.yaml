    c: 'Peking, the Great Hall. Mao listens to the whole rally from behind a curtain with his doctor. When Zhou and Deng explain what has happened as "old revolutionaries encountering new problems," he snorts: "What old revolutionaries? Old counterrevolutionaries is more like it."'
