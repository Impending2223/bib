    date: 1966-07
    at: before 1966-07-07
    thread: china-leadership
    c: Mao 毛泽东 himself settles the report Jiang Weiqing 江渭清 drafted for the Nanjing 南京 rally, which Wei Wenbo 魏文伯 of the East China Bureau 华东局 dared not settle and sent on to Peking 北京.
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 96 (Jiang Weiqing''s account, quoted). Made public: 1996 ([[w.jiang-weiqing-qishi-nian-zhengcheng]]). To check: [[w.jiang-weiqing-qishi-nian-zhengcheng]], 517–519 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 96 n.25). See [[cal.1966-07.china-leadership-27]]. Names: Mao Zedong.'
