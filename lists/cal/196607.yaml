    place: chongqing
    thread: china-leadership
    c: Chongqing 重慶. Ren Baige 任白戈, named in the *Hongqi* note, falls at once; Lu Dadong 魯大東, a secretary of the city committee's secretariat, acts as first secretary.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 489; [[w.pu-weihua-zalan-jiu-shijie]], 101 (soon after, Ren Baige leaves his post "on leave for examination"). See [[cal.1966-07-01.china-leadership-8]].'
