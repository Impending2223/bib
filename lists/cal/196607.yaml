    n: '[[w.zedong-mao-zedong-nianpu]], V, July 24, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24–25, 1966; Zhou at Mao''s meeting of the Standing Committee and the Cultural Revolution Group, where Mao criticizes the work groups and decides to withdraw them; the next day Mao again to the regional bureau secretaries and the Group); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646 (July 24 and 25, 1966; Mao, talking with the regional bureaus'' secretaries and the members of the Cultural Revolution Group, sharply criticizes the work groups: they block the mass movement, and to block the revolution is to help the counter-revolutionaries and the black gang; they have made much trouble, and what is wanted of them?); [[w.macfarquhar-maos-last-revolution]], 83–84 (Mao to groups of Party leaders, in the first meeting at his Diaoyutai residence, with Mu Xin present: the work teams must be withdrawn, "let the teachers and students themselves continue"; "nobody stood up to him"). Made public: 1991. Check: MacFarquhar (83 n.80) has four successive meetings: on July 24 Liu Shaoqi''s report meeting and a meeting with the Standing Committee and the Cultural Revolution Group, on July 25 one with the regional bureau leaders and the Group, on July 26 one with the entire Group. To check: [[w.zheng-liu-shaoqide-zuihou-suiyue]], 68 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 272 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80b); [[w.zhonghua-renmin-gongheguo-fengyun]], I, 1059 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80d); [[w.xin-guanyu-gongzuozu-cunfei-wenti]], 642–645 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.81); [[w.mao-zedong-sixiang-wan]], 165 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.82); [[w.yanchi-tao-zhu-zai-wenhua]], 100 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.83). Names: Mao Zedong.'
