    c: 'Mao to Jiang Qing, from Wuhan. Great disorder brings great order; again in seven or eight years. A friend''s talk on coups (Lin Biao''s of May 18) makes him uneasy: he never believed his few little books had such power; "forced onto Liangshan," he agrees against his will, the first time in a life; there is some tiger in him and some monkey; his aim is to overthrow the right across Party and country, and to sweep the ghosts again in seven or eight years; he is a Zhong Kui of the 1960s.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1966; July 11–12, 1966, and note 47 (shown to Zhou Enlai and Wang Renzhong). [[w.macfarquhar-maos-last-revolution]], 52 (Mao to his wife: great disorder under heaven for great order); [[w.jianguo-yilai-mao-zedong]], XVIII, 283–287 (July 8, 1966; Mao''s letter of July 8, printed from the revised copy: her letter of June 29 received; she had better stay in Shanghai as Wei Wenbo 魏文伯 and Chen Pixian 陈丕显 advise; since leaving Hangzhou June 15 he lived ten-odd days in a cave in the west (the Dishuidong 滴水洞, Shaoshan) and came to Wuhan June 28; two receptions of foreign guests this month; note 8: Lin Biao''s speech of May 18 on coups, forwarded by the Center Sept. 22; note 13: printed in May 1972 as a document of the meeting reporting on the criticism of Lin Biao and rectification, parts printed in *Renmin ribao* Oct. 1, 1972, Sept. 2, 1973 and Mar. 1, 1975); [[w.macfarquhar-origins-of-the-cultural]], III, 459 (Mao, in a letter to Jiang Qing, has reservations about Lin Biao''s talk of coups). Made public: 1972 (Check: the Center circulated the letter in the Party in 1972, after Lin Biao''s fall; the nianpu gives no date). Check: the Wengao (XVIII, 286 n.13) has the letter printed in May 1972 as a document of the meeting on the criticism of Lin Biao and rectification (internal), and parts of it first in *Renmin ribao*, Oct. 1, 1972. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII (the letter); [[w.wenhua-dageming-yanjiu-ziliao]], I, 55 (cited by [[w.macfarquhar-maos-last-revolution]], 52 n.1); Jiang Qing, letter to Mao Zedong of June 29, 1966 (answered by his letter of July 8) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 283); Lin Biao, speech on coups to the enlarged Politburo meeting, Peking, May 18, 1966 (forwarded by the Center Sept. 22, 1966) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.8); Mao Zedong, letter to Jiang Qing of July 8, 1966, printed as a document of the meeting reporting on the criticism of Lin Biao and rectification, May 1972 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.13a); Renmin ribao, Oct. 1, 1972 (and Sept. 2, 1973, Mar. 1, 1975), printing parts of Mao''s letter to Jiang Qing of July 8, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 286 n.13b); Mao Zedong, letter to Jiang Qing, in [[w.wenhua-da-geming-yanjiu]], shang, 55–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.160a). Names: Mao Zedong, Jiang Qing, Lin Biao.'
