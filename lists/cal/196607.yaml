    date: 1966-07
    at: after 1966-07-14
    place: peking
    thread: china-leadership
    c: 'the Tsinghua middle school 清华附中, Peking 北京. The work group and the Red Guards at odds: the group would first strike the very few ox-demons and snake-spirits, the Red Guards sweep away all of them and all old thought; the group would unite over 95 percent of cadres and masses, the Red Guards call it impossible; the group holds that the Party leads through it, the Red Guards set up the absolute authority of Mao Zedong Thought 毛泽东思想, which the group calls "no leadership by the work group, a Red Guard dictatorship."'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 170. See [[cal.1966-06.china-leadership-58]].'
