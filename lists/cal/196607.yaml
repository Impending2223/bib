    thread: china-leadership
    c: 'Wuhan University 武汉大学. The work group brings peasants of Lingling 零陵 county and students of the university into the house of Li Da 李达 to besiege him. Li: his family were small landlords who let out land, twelve or thirteen mu for five people: "landlords? a strange thing!"'
