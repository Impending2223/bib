  - id: cal.1966-07-29.china-leadership
    when: July 29
    date: '1966-07-29'
    place: peking
    thread: china-leadership
    c: 'Peking, Great Hall. The Peking committee''s meeting of college and middle-school activists: Li Xuefeng reads the committee''s decision on withdrawing the work groups; Liu Shaoqi and Deng Xiaoping take responsibility for sending them; Zhou Enlai conveys Mao''s three tasks for the schools (fight, criticize, reform). Mao meets all the delegates at the close. The recording goes to the provinces, and the work groups are withdrawn there.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 29, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 42–43 (July 29, 1966; Zhou''s speech after Dengs: the movement went from early heat to a cooler middle for two reasons, the leaders misjudgment of the situation and fear of disorder, and the hasty decision to send work groups everywhere; most work-group members are good, old revolutionaries meeting new problems; the three tasks; the school Cultural Revolution''s bodies after the withdrawal; Liu Shaoqi speaks after him); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646–647 (July 29, 1966; Liu speaks at the Peking committee''s meeting of activists of the colleges and middle schools and takes responsibility on behalf of the Center for the work-group question: sending work groups was the Center''s decision and the Center''s consent; it is now found the form does not fit the present needs of the cultural revolution, and the Center has decided to withdraw them; he suggests that in the movement the few be protected, those with different views who are in the minority, for debate between them is needed; ox-ghosts and snake-spirits are to be handled by wall posters, great airing and great debate, and a debate meeting is not to become a struggle meeting (Zhou Enlai had just said so); the majority of today may be the minority of tomorrow; on how to carry out the proletarian cultural revolution he says he does not know, that he is not sure the Party Center''s other workers know, and that the revolution is chiefly to be learned among the masses of teachers, students and workers; "we can now only learn from you and listen to your views," and the announcement at the meeting is that all work groups are withdrawn); [[w.macfarquhar-maos-last-revolution]], 84–85 (a rally of some 10,000 college and middle-school teachers and students; Li Xuefeng reads the committee''s decision; Deng, Zhou and Liu speak, in that order; Liu: "I don''t know either"; Mao comes on stage at the end and ignores Liu and Deng; tapes are played on campuses all over Peking and the work teams are withdrawn everywhere). To check: Xinhua''s report, July 30; [[w.pipan-ziliao]], III, 702 (cited by [[w.macfarquhar-maos-last-revolution]], 85 n.88); [[w.zhisui-private-life-of-chairman]], 469–470 (cited by [[w.macfarquhar-maos-last-revolution]], 85 n.90). Names: Li Xuefeng, Liu Shaoqi, Deng Xiaoping, Zhou Enlai, Mao Zedong.'
