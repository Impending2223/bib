# Cal. LXXXI July 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXI
entries:
  - id: cal.1966-07-01.medicare
    when: July 1
    date: '1966-07-01'
    thread: medicare
    also: [health, civil-rights-the-executive]
    c: 'Medicare in effect: hospital insurance for those 65 and over, and the voluntary plan for doctors'' bills. A hospital paid only if certified by HEW as complying with Title VI of the Civil Rights Act. Johnson''s telegram of thanks to the American Hospital Association, read by Moyers at San Antonio.'
    n: 'Telegram to the Director, American Hospital Association, on Preparations for Medicare, [1966 Pub. Papers 697](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=71) (July 1, 1966). [[w.smith-health-care-divided]]. See [[cal.1965-07-30.medicare]]. Names: Moyers, Johnson.'
    tags: [name:johnson-lyndon-b, name:moyers-bill]
  - id: cal.1966-07-01.europe-and-the-alliance
    when: July 1
    date: '1966-07-01'
    thread: europe-and-the-alliance-france
    c: 'French forces leave NATO''s integrated commands. The French forces in Germany stay, their terms unsettled: July 19, de Leusse for France in the Council refuses the Fourteen''s paper of assumptions on them; by July 29 the mission to NATO reports the talks deadlocked.'
    n: FRUS 1964–68, XIII, docs. [184](https://history.state.gov/historicaldocuments/frus1964-68v13/d184), [187](https://history.state.gov/historicaldocuments/frus1964-68v13/d187), [190](https://history.state.gov/historicaldocuments/frus1964-68v13/d190). See [[cal.1966-03-07.europe-and-the-alliance]].
  - id: cal.1966-07-01.civil-rights-organizations
    when: July 1–4
    date: '1966-07-01'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: 'CORE''s convention, Baltimore: "black power" taken up; self-defense held no contradiction of nonviolence.'
    n: 'Check: the convention''s resolutions. [[w.meier-core]]; [[w.joseph-waiting-til-the-midnight]]. See [[cal.1966-06-06.mississippi]].'
  - id: cal.1966-07-01.opinion
    when: July 1
    date: '1966-07-01'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, May 19–24: the death penalty for persons convicted of murder: for 42 percent, against 47. Men 47 for; women 38.'
    n: '[[w.gallup-poll]], III, 2016.'
  - id: cal.1966-07-02.defense
    when: July 2
    date: '1966-07-02'
    thread: defense
    also: [vietnam]
    c: 'Executive order: a National Advisory Commission on Selective Service, twenty members, Burke Marshall chairman; McCone, Shoup, and Reedy among them. Classification, deferments, exemptions, the local boards, and "other systems of national service" to be studied; the report by about Jan. 1, 1967.'
    n: '[Executive Order 11289—National Advisory Commission on Selective Service](https://www.presidency.ucsb.edu/documents/executive-order-11289-national-advisory-commission-selective-service) (July 2, 1966); Statement by the President Upon Establishing a Commission To Study the Draft and Other Systems of National Service, [1966 Pub. Papers 698](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=72) (July 2, 1966). [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]. Names: Marshall, McCone, Reedy, Shoup.'
    tags: [name:johnson-lyndon-b, name:marshall-burke, name:mccone-john-a, name:shoup-david-m, name:reedy-george-e]
  - id: cal.1966-07-02.states-and-cities-omaha
    when: July 2–7
    date: '1966-07-02'
    thread: states-and-cities
    c: Omaha. Negro youths at the Safeway and Skaggs lot at 24th and Lake, the night of July 2; rocks at a police car, windows broken and fires on North 24th Street through the holiday weekend; a boy of fifteen shot in the leg by police. July 5, after 12:30 a.m., the police ask for the Guard; Mayor Sorensen keeps police and 128 Guardsmen on alert until Thursday. He meets a hundred young men at the North Side YMCA.
    n: '[[w.howard-then-the-burnings-began]], 82–85. Names: Sorensen.'
    tags: [state:ne, city:omaha, name:sorensen-a-v]
  - id: cal.1966-07-03.opinion
    when: July 3
    date: '1966-07-03'
    thread: opinion
    also: [defense, vietnam]
    c: 'Gallup, June 16–21: all young men to give two years'' service, in the armed forces or in nonmilitary work here or abroad such as the Peace Corps: favor 72 percent, oppose 21. A son''s service, if so: armed forces 47, nonmilitary 28. The present draft fair, 43; unfair, 38. May 19–24: the draft replaced by a yearly lottery among the fit men of 18 and 19: a good idea 32, a poor idea 53.'
    n: '[[w.gallup-poll]], III, 2016–17.'
  - id: cal.1966-07-04.press-and-broadcasting
    when: July 4
    date: '1966-07-04'
    thread: press-and-broadcasting
    c: 'Freedom of Information Act signed, [80 Stat. 250](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg250.pdf), the statement released at San Antonio. The agencies'' records open to any person on request, nine classes exempt; a refusal reviewable in the district courts; in force July 4, 1967. Moss''s bill in the House, Long''s in the Senate; the House passed S. 1160 June 20, [306–0](https://voteview.com/rollcall/RH0890277). Johnson: the bill "in no way impairs the President''s power under our Constitution to provide for confidentiality when the national interest so requires."'
    n: 'Statement by the President Upon Signing the "Freedom of Information Act.", [1966 Pub. Papers 699](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=73) (July 4, 1966). Statute (K–J Cong. II.J.2). [[w.schudson-rise-of-the-right]]. Names: Moss, Long, Johnson.'
    tags: [name:johnson-lyndon-b, name:moss-john-e, name:long-edward-v]
  - id: cal.1966-07-04.jobs-and-wages-tx
    when: July 4
    date: '1966-07-04'
    thread: jobs-and-wages-farm-workers
    also: [states-and-cities]
    c: Texas farm workers' march. Melon pickers on strike in Starr County since June 1, for $1.25 an hour, set out from Rio Grande City, Tex., for Austin.
    n: Richard Bailey, ["Starr County Strike,"](https://www.tshaonline.org/handbook/entries/starr-county-strike) *Handbook of Texas Online*. [[w.krochmal-blue-texas]]; [[w.montejano-anglos-and-mexicans-in]]; [[w.behnken-fighting-their-own-battles]]. See [[cal.1966-05-26.jobs-and-wages]].
    tags: [state:tx]
  - id: cal.1966-07-05.succession-us
    when: July 5
    date: '1966-07-05'
    thread: succession
    also: [amendments]
    c: Louisiana ratifies the Twenty-fifth Amendment, the thirty-first State; Virginia and Mississippi in March. No other State acts in 1966; seven more needed. Tennessee next, Jan. 12, 1967; Nevada the thirty-eighth, Feb. 10.
    n: House Manual (116th Cong.), [119](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg119.htm); [CONAN (2017), Amend. XXV n.17](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=20). [[w.feerick-twenty-fifth-amendment]]. See [[cal.1965-07-06.succession]].
    tags: [state:la, state:va, state:ms]
  - id: cal.1966-07-05.japan-and-korea
    when: July 5–7
    date: '1966-07-05'
    thread: japan
    c: 'Fifth meeting of the Joint Committee, Kyoto; Rusk in Japan July 4–7. Shiina to Rusk, July 7: Okinawa''s security first, but more self-government for the islands; the Bonin islanders'' return home. Rusk and Satō, Tokyo, the same day. Check the dates.'
    n: 'FRUS 1964–68, XXIX, pt. 2, docs. [72](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d72), [73](https://history.state.gov/historicaldocuments/frus1964-68v29p2/d73); [FRUS 1964–68, XXIX, pt. 1, doc. 368](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d368). See [[cal.1964-01-27.japan-and-korea]]. Names: Rusk, Shiina, Satō.'
    tags: [name:rusk-dean, name:shiina-etsusaburo, name:sato-eisaku]
  - id: cal.1966-07-05.civil-rights-organizations
    when: July 5
    date: '1966-07-05'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: 'The NAACP''s convention opens at Los Angeles; Wilkins against "black power." Johnson, at the Ranch: "We are not interested in black power and we are not interested in white power. But we are interested in American democratic power, with a small ''d.''"'
    n: 'The President''s News Conference at the LBJ Ranch, [1966 Pub. Papers 702](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=76) (July 5, 1966). [[w.wilkins-standing-fast]]. See [[cal.1966-07-01.civil-rights-organizations]]. Names: Wilkins, Johnson.'
    tags: [name:wilkins-roy, name:johnson-lyndon-b]
  - id: cal.1966-07-06.vietnam
    when: July 6
    date: '1966-07-06'
    thread: vietnam-prisoners
    c: Hanoi parades captured American airmen through its streets, some fifty (Check); trials as war criminals spoken of.
    n: '[*New York Times*, July 7, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/07/issue.html). [[w.rochester-honor-bound]].'
    tags: [place:hanoi]
  - id: cal.1966-07-06.opinion
    when: July 6
    date: '1966-07-06'
    thread: opinion
    also: [students, defense]
    c: 'Gallup, special survey of male college students: students deferred from the draft: yes 82 percent, no 14. If students are drafted, by grades 78, by lot 16.'
    n: '[[w.gallup-poll]], III, 2017.'
  - id: cal.1966-07-06.civil-rights-organizations
    when: July 6
    date: '1966-07-06'
    thread: civil-rights-organizations
    also: [black-nationalism]
    c: 'Humphrey to the NAACP: racism to be rejected whether it comes "from a throat that is white or one that is black" (Check the words).'
    n: 'Check: the text. See [[cal.1966-07-01.civil-rights-organizations]]. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1966-07-07.vietnam-us
    when: July 7
    date: '1966-07-07'
    thread: vietnam
    also: [states-and-cities]
    c: 'National Governors'' Conference at Los Angeles, July 4–7; Humphrey speaks July 6. July 7: Sawyer''s resolution, agreed by Democratic and Republican governors, affirms the conference''s "resolute support of our global commitments"; Hughes of New Jersey adds "including our support of the military defense of South Vietnam against aggression." Hatfield''s amendment, support of the servicemen alone, seconded by Romney, lost by voice. Adopted, 49–1; the one, Hatfield (Check).'
    n: '[*Proceedings of the National Governors'' Conference, 1966*, 135–146](https://www.nga.org/wp-content/uploads/2021/03/1966NGAAnnualMeeting.pdf#page=150). See [[cal.1966-03-12.vietnam-us]]. Names: Humphrey, Sawyer, Hughes, Hatfield, Romney.'
    tags: [name:humphrey-hubert-h, name:sawyer-grant, name:hughes-richard-j, name:hatfield-mark-o, name:romney-george-w]
  - id: cal.1966-07-08.jobs-and-wages
    when: July 8
    date: '1966-07-08'
    thread: jobs-and-wages-airlines
    also: [economy]
    c: The International Association of Machinists strikes Eastern, National, Northwest, Trans World, and United, on the terms of the emergency board (Morse, Ginsburg, Neustadt) reported June 7, which the carriers had accepted.
    n: 'Statement by the President on the Breakdown of Negotiations in the Airlines Strike, [1966 Pub. Papers 712](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=86) (July 7, 1966). [[w.sheahan-wage-price-guideposts]]; [[w.exhortation-and-controls]]. Names: Morse, Ginsburg, Neustadt.'
    tags: [name:johnson-lyndon-b, name:morse-wayne, name:ginsburg-david, name:neustadt-richard-e]
  - id: cal.1966-07-08.opinion
    when: July 8
    date: '1966-07-08'
    thread: opinion
    also: [europe-and-the-alliance]
    c: 'Gallup, June 16–21: France a dependable ally of the United States: yes 16 percent, no 56. College-educated 66 no.'
    n: '[[w.gallup-poll]], III, 2017–18. See [[cal.1966-03-07.europe-and-the-alliance]].'
  - id: cal.1966-07-09.japan-and-korea
    when: July 9
    date: '1966-07-09'
    thread: korea
    c: 'Seoul. Rusk and Brown sign the Status of Forces Agreement with Korea, [17 U.S.T. 1677](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-17-2/lltreaties-17-2.pdf#page=279): Korea''s courts have primary jurisdiction over American servicemen, waived case by case. Promised in 1953; negotiated since 1962. In force Feb. 9, 1967.'
    n: '[FRUS 1961–63, XXII, doc. 262](https://history.state.gov/historicaldocuments/frus1961-63v22/d262); FRUS 1964–68, XXIX, pt. 1, docs. [21](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d21), [88](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d88). [[w.macdonald-u-s-korean-relations]]; [[w.lee-troubled-peace]]. See [[cal.1966-07-05.japan-and-korea]]. Names: Rusk, Brown.'
    tags: [name:rusk-dean, name:brown-winthrop-g]
  - id: cal.1966-07-10.open-housing
    when: July 10–11
    date: '1966-07-10'
    thread: open-housing
    also: [king, states-and-cities]
    c: 'Chicago. "Freedom Sunday": King at Soldier Field, some 35,000 by UPI''s count (Check), then a march to City Hall, where he tapes the Chicago Freedom Movement''s demands to the door: listings and mortgages without regard to race; a citizens'' board for complaints against the police; low-cost housing scattered over the city; and more. July 11, King and Raby with Daley at City Hall; no agreement.'
    n: '[Demands of the Chicago Freedom Movement](https://www.crmvet.org/docs/66chi.htm) (July 10, 1966); King, [Address at rally at Soldier Field](https://okra.stanford.edu/link/document660710-000) (King Papers Project). [[w.ralph-northern-protest]]; [[w.anderson-confronting-the-color-line]]; [[w.chicago-1966]]; [[w.chicago-freedom-movement]]; [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]; [[w.cohen-american-pharaoh]]. Names: King, Daley, Raby.'
    tags: [name:king-martin-luther-jr, name:daley-richard-j, name:raby-albert, state:il, city:chicago]
  - id: cal.1966-07-10.opinion
    when: July 10
    date: '1966-07-10'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 16–21: the convention''s choice between Romney and Nixon: Romney 45 percent, Nixon 43. Republicans: Nixon 55, Romney 40. Independents: Nixon 44, Romney 43. Democrats: Romney 50, Nixon 36. The best candidate of five: Republicans, Romney 38, Scranton 20, Reagan 17, Lindsay 6, Hatfield 5; independents, Romney 30, Scranton 19, Reagan 15, Lindsay 7, Hatfield 6.'
    n: '[[w.gallup-poll]], III, 2018. Names: Romney, Scranton, Nixon, Reagan, Lindsay, Hatfield.'
    tags: [name:romney-george-w, name:nixon-richard-m, name:scranton-william-w, name:reagan-ronald, name:lindsay-john-v, name:hatfield-mark-o]
  - id: cal.1966-07-11.crime-and-hijacking-nyc
    when: July 11
    date: '1966-07-11'
    thread: crime-and-hijacking
    also: [states-and-cities]
    c: 'New York. Lindsay''s civilian review board named: four civilians chosen by Lindsay, three police officers by Leary, the commissioner he brought from Philadelphia in February. The Patrolmen''s Benevolent Association, Cassese its president, petitions for a referendum to abolish it.'
    n: '[Wikipedia, "Howard R. Leary"](https://en.wikipedia.org/wiki/Howard_R._Leary); ["New York City Civilian Complaint Review Board"](https://en.wikipedia.org/wiki/New_York_City_Civilian_Complaint_Review_Board). [[w.cannato-ungovernable-city]]; [[w.black-people-and-the-police]]; [[w.flamm-law-and-order]]. See [[cal.1965-11-02.states-and-cities]]. Names: Lindsay, Leary, Cassese.'
    tags: [state:ny, city:nyc, name:lindsay-john-v, name:leary-howard-r, name:cassese-john]
  - id: cal.1966-07-12.open-housing
    when: July 12–15
    date: '1966-07-12'
    thread: open-housing
    also: [states-and-cities]
    c: Rioting on Chicago's West Side, begun when police shut off a fire hydrant opened against the heat (Check the occasion). Two dead by stray bullets, a girl of fourteen among them; more than 30 hurt; hundreds arrested. Kerner sends the National Guard at Daley's request; on the streets July 15.
    n: '[*New York Times*, July 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/13/issue.html). See [[cal.1966-07-10.open-housing]]. Names: Kerner, Daley.'
    tags: [name:kerner-otto, name:daley-richard-j, state:il, city:chicago]
  - id: cal.1966-07-12.india-and-china
    when: July 12
    date: '1966-07-12'
    thread: china
    c: Johnson to the American Alumni Council, from the White House theater, his flight to White Sulphur Springs, W. Va., grounded by weather. Four "essentials" for peace in Asia, the fourth "reconciliation between nations that now call themselves enemies." "A peaceful mainland China is central to a peaceful Asia"; no lasting peace "as long as the 700 million people of mainland China are isolated by their rulers from the outside world." A passport cleared that day for an American businessman to go to China.
    n: 'Remarks to the American Alumni Council: United States Asian Policy, [1966 Pub. Papers 718](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=92) (July 12, 1966). [[w.goh-constructing-the-u-s]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-12.elections-1966
    when: July 12
    date: '1966-07-12'
    thread: elections-1966
    c: 'Virginia''s Democratic primaries. Spong, a State senator, defeats Robertson, a Senator since 1946, 216,885 to 216,274. Harry F. Byrd Jr., appointed to his father''s seat, holds it for the two years left against Boothe, 221,221 to 212,996. Howard W. Smith, chairman of Rules, loses the Eighth District to Rawlings. July 20, Johnson: "I don''t attach any particular significance to the defeat of a Member of the House or the Senate."'
    n: 'Votes: CQ Guide 6th (2010) 1546–47. The President''s News Conference, [1966 Pub. Papers 744](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=118) (July 20, 1966). [[w.wilkinson-harry-byrd-and-the]]; [[w.heinemann-harry-byrd-of-virginia]]; [[w.dierenfield-keeper-of-the-rules]]. Names: Spong, Robertson, Byrd, Smith, Boothe, Rawlings, Johnson.'
    tags: [name:spong-william-b-jr, name:robertson-absalom-w, name:byrd-harry-f-jr, name:smith-howard-w, name:johnson-lyndon-b, name:boothe-armistead-l, name:rawlings-george-c-jr]
  - id: cal.1966-07-13.opinion
    when: July 13
    date: '1966-07-13'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, June 16–21: the party more likely to keep the country out of World War III: Republican 30 percent, Democratic 22, no difference 29. To keep it prosperous: Democratic 38, Republican 26, no difference 21.'
    n: '[[w.gallup-poll]], III, 2018–19.'
  - id: cal.1966-07-13.amendments
    when: July 13–14
    date: '1966-07-13'
    thread: amendments
    also: [congress]
    c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Bayh''s, on a four-year House term: S.J. Res. 72, 126, 128 and 132 and a House resolution. Neither Judiciary Committee reports a resolution; neither House votes.'
    n: '*Four-Year Term for Representatives: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 89th Cong., 2d sess. (1966) ([Monthly Catalog](https://mocat.library.unt.edu/catalog/871-12417); Y 4.J 89/2:R 29/4; Check: a digitized copy, and the House resolution, H.J. Res. 394 or 391). [Congressional Research Service, *Proposals to Change the House Term of Office to Four Years*](https://www.everycrsreport.com/reports/RS21574.html) (2003). See [[cal.1966-01-20.amendments]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1966-07-13.middle-east-iran-arms
    when: July 13
    date: '1966-07-13'
    thread: middle-east-iran-arms
    c: 'Humphrey to Johnson: unless something changes, "the Shah is going to buy a package of Soviet arms."'
    n: '[FRUS 1964–68, XXII, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v22/d155). See [[cal.1966-06-29.middle-east]]. Names: Humphrey, Johnson, Pahlavi.'
    tags: [name:humphrey-hubert-h, name:johnson-lyndon-b, name:pahlavi-mohammed-reza]
  - id: cal.1966-07-14.defense
    when: July 14
    date: '1966-07-14'
    thread: defense
    c: 'Senate. S. Res. 283, reported by Foreign Relations: a Committee on Intelligence Operations to watch the CIA, its members drawn from Foreign Relations, Armed Services, and Appropriations (Check). Russell''s point of order, that it go first to Armed Services, sustained, [61–28](https://voteview.com/rollcall/RS0890353).'
    n: '[[w.smist-congress-oversees-the-united]]; [[w.woods-fulbright]]; [[w.fite-richard-b-russell-jr]]. Names: Russell.'
    tags: [name:russell-richard-b]
  - id: cal.1966-07-14.africa
    when: July 14
    date: '1966-07-14'
    thread: africa
    c: 'South West Africa. The NSC: Ball expects the World Court to rule against South Africa; avoid economic sanctions. Johnson asks for a task force on the question.'
    n: 'FRUS 1964–68, XXIV, docs. [621](https://history.state.gov/historicaldocuments/frus1964-68v24/d621), [622](https://history.state.gov/historicaldocuments/frus1964-68v24/d622). [[w.irwin-gordian-knot]]; [[w.borstelmann-cold-war-and-the]]. Made public: FRUS 1964–68, XXIV (1999). See [[cal.1964-04-24.africa]]. Names: Ball, Johnson.'
    tags: [name:ball-george-w, name:johnson-lyndon-b]
  - id: cal.1966-07-15.vietnam-prisoners
    when: July 15
    date: '1966-07-15'
    thread: vietnam-prisoners
    c: Senators critical of the war, eighteen or nineteen (Check), appeal to Hanoi against reprisals on the prisoners.
    n: 'Check: the appeal and its signers. See [[cal.1966-07-06.vietnam]].'
  - id: cal.1966-07-16.states-and-cities-los-angeles
    when: July 16
    date: '1966-07-16'
    thread: states-and-cities
    also: [crime-and-hijacking]
    c: Los Angeles. Parker, chief of police since 1950, dies.
    n: '[[w.felker-kantor-policing-los-angeles]]; [[w.domanick-to-protect-and-to]]. See [[cal.1965-08-11.states-and-cities]]. Names: Parker.'
    tags: [state:ca, city:los-angeles, name:parker-william-h]
  - id: cal.1966-07-17.opinion
    when: July 17
    date: '1966-07-17'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, June 16–21: Johnson 48 percent, Romney 44; Johnson 51, Nixon 40. Midwest: Romney 51, Johnson 40; Nixon 47, Johnson 45. West: Romney 45, Johnson 43.'
    n: '[[w.gallup-poll]], III, 2019–20. Names: Johnson, Romney, Nixon.'
    tags: [name:johnson-lyndon-b, name:romney-george-w, name:nixon-richard-m]
  - id: cal.1966-07-18.states-and-cities
    when: July 18–23
    date: '1966-07-18'
    thread: states-and-cities
    c: Cleveland. Rioting in Hough, July 18–23, begun at a bar at East 79th Street and Hough Avenue. Four dead, some 50 hurt, 275 arrested. Rhodes sends the National Guard at Locher's request, some 1,700 men in the city by July 20.
    n: '[[w.stradling-where-the-river-burned]]; [[w.moore-carl-b-stokes-and]]. See [[cal.1965-08-11.states-and-cities]]. Names: Rhodes, Locher.'
    tags: [name:rhodes-james-a, name:locher-ralph-s, state:oh, city:cleveland]
  - id: cal.1966-07-18.space
    when: July 18–21
    date: '1966-07-18'
    thread: space
    c: 'Gemini 10: Young and Collins. Docked with their Agena target, they fire its engine and climb to some 475 miles, higher than any men before; then meet the Agena left by Gemini 8, and Collins goes out to it. Down in the Atlantic July 21.'
    n: '[NASA, Manned Spacecraft Center, *Gemini Program Mission Report: Gemini X*, MSC-G-R-66-7 (1966)](https://ntrs.nasa.gov/api/citations/19750067644/downloads/19750067644.pdf). [[w.hacker-on-the-shoulders-of]]; [[w.collins-carrying-the-fire]]. See [[cal.1965-12-15.space]]. Names: Young, Michael Collins.'
    tags: [name:young-john-w, name:collins-michael]
  - id: cal.1966-07-18.africa
    when: July 18
    date: '1966-07-18'
    thread: africa
    c: 'The World Court rejects the claims of Ethiopia and Liberia against South Africa over South West Africa, 8–7, the President''s casting vote deciding: no legal right or interest in the subject of the claims (Check).'
    n: '*South West Africa Cases (Ethiopia v. South Africa; Liberia v. South Africa)*, [1966 I.C.J. 6](https://www.icj-cij.org/case/46) (July 18, 1966). See [[cal.1966-07-14.africa]].'
    tags: [ok:section-ref]
  - id: cal.1966-07-19.economy
    when: July 19
    date: '1966-07-19'
    thread: economy
    c: 'News conference, after meetings with the bipartisan leaders, July 18, and the appropriations chairmen, July 19. Congress''s add-ons to the budget may reach $5 to $6 billion, near $120 billion without a Vietnam supplemental. Three courses for an economy "heating up": wage and price controls, which "few, if any, recommend"; cuts in nondefense spending; or a deficit or a tax bill. The deficit for fiscal 1966, $2.3 billion.'
    n: 'The President''s News Conference, [1966 Pub. Papers 735](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=109) (July 19, 1966). [[w.bernstein-guns-or-butter]]; [[w.helsing-johnsons-war-johnsons-great]]; [[w.collins-more]]; [[w.okun-political-economy-of-prosperity]]; [[w.president-and-the-council]]. See [[cal.1965-12-05.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-20.opinion
    when: July 20
    date: '1966-07-20'
    thread: opinion
    also: [civil-rights-the-executive]
    c: 'Gallup, June 16–21: the Administration pushing integration too fast, 46 percent; not fast enough, 7; about right, 34. Southern whites 62 too fast; whites outside the South 44.'
    n: '[[w.gallup-poll]], III, 2020.'
  - id: cal.1966-07-20.electoral-college
    when: July 20
    date: '1966-07-20'
    thread: electoral-college
    also: [court]
    c: 'Delaware moves in the Supreme Court for leave to sue New York, every other State and the District, No. 28, Original: the general ticket, all of a State''s electoral votes to the candidate of its plurality, void under due process and equal protection. A constitutional amendment the "ultimate correction," the motion says, but none likely unless the Court "open the door."'
    n: 'Motion for Leave to File Complaint, Complaint and Brief, *Delaware v. New York*, No. 28, Orig. (U.S. filed July 20, 1966) ([Supreme Court](https://www.supremecourt.gov/pdfs/recordsandbriefs/1000202793/1000202793_001.pdf)); printed in *Election of the President* hearings, [807–08](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=817). [[w.peirce-peoples-president]]; [[w.longley-politics-of-electoral-college]].'
    tags: [state:de, state:ny]
  - id: cal.1966-07-20.middle-east-iran-arms
    when: July 20
    date: '1966-07-20'
    thread: middle-east-iran-arms
    c: 'Johnson''s letter to the Shah, on Iran''s defense requirements: "Candor between friends is essential."'
    n: '[FRUS 1964–68, XXII, doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v22/d158). See [[cal.1966-06-29.middle-east]]. Names: Johnson, Pahlavi.'
    tags: [name:johnson-lyndon-b, name:pahlavi-mohammed-reza]
  - id: cal.1966-07-20.vietnam-prisoners
    when: July 20
    date: '1966-07-20'
    thread: vietnam-prisoners
    c: 'News conference. Johnson: the airmen "are not war criminals and should not be treated as such"; the United States ready for a conference under the International Committee of the Red Cross on applying the Geneva Conventions of 1949 in Vietnam.'
    n: 'The President''s News Conference, [1966 Pub. Papers 744](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=118) (July 20, 1966). FRUS 1964–68, IV, docs. [182](https://history.state.gov/historicaldocuments/frus1964-68v04/d182), [199](https://history.state.gov/historicaldocuments/frus1964-68v04/d199). See [[cal.1966-07-06.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-20.states-and-cities
    when: July 20
    date: '1966-07-20'
    thread: states-and-cities
    also: [open-housing]
    c: 'News conference. Johnson, asked of "black power" and the disturbances in Chicago and Cleveland: "I am very concerned about the conditions that exist in many of the large cities"; equality to be had "under the law."'
    n: 'The President''s News Conference, [1966 Pub. Papers 744](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=118) (July 20, 1966). See [[cal.1966-07-12.open-housing]]; [[cal.1966-07-18.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:il, city:chicago, state:oh, city:cleveland]
  - id: cal.1966-07-22.vietnam
    when: July 22
    date: '1966-07-22'
    thread: vietnam
    c: The demilitarized zone. North Vietnam's 324th Division found south of the 17th parallel, come through the zone; Saigon protests to the ICC, July 21. Air strikes in the zone on both sides of the line, and artillery into its southern half, authorized "only against clearly defined military activity." The Marines' Operation Hastings below the zone (Check its dates).
    n: '[FRUS 1964–68, IV, doc. 184](https://history.state.gov/historicaldocuments/frus1964-68v04/d184). [[w.shulimson-u-s-marines-in-1982]].'
    tags: [place:dmz, place:operation-hastings]
  - id: cal.1966-07-22.opinion
    when: July 22
    date: '1966-07-22'
    thread: opinion
    also: [students, elections-1968-polls]
    c: 'Gallup, special survey of students at 60 colleges and universities: the Republican with the greatest appeal: Romney 35 percent, Nixon 17, Scranton 17, Goldwater 8, Lindsay 8, Rockefeller 8, Lodge 5; about four in ten named none. The students: Democrats 35, Republicans 26, independents 39; the nation, 48, 26, 26.'
    n: '[[w.gallup-poll]], III, 2020. Names: Romney, Scranton, Rockefeller, Nixon, Goldwater, Lindsay, Lodge.'
    tags: [name:romney-george-w, name:nixon-richard-m, name:scranton-william-w, name:goldwater-barry-m, name:lindsay-john-v, name:rockefeller-nelson, name:lodge-henry-cabot]
  - id: cal.1966-07-22.mississippi-ms
    when: July 22
    date: '1966-07-22'
    thread: mississippi
    also: [legislatures, court]
    c: '*Connor v. Johnson*. A three-judge court, Coleman and Cox among the three, on a suit of Negro voters and the Freedom Democrats: the apportionment of 1962–63 void under the equal protection clause. The legislature to reapportion itself by Dec. 1 for the elections of 1967, or the court will. The legislature has passed a congressional redistricting.'
    n: '*Connor v. Johnson*, [256 F. Supp. 962](https://static.case.law/f-supp/256/case-pdfs/0962-01.pdf) (S.D. Miss. 1966). [[w.parker-black-votes-count]]; [[w.davidson-quiet-revolution-in-the]]. See [[cal.1963-02-05.mississippi-ms]]; [[cal.1964-06-15.court]].'
    tags: [state:ms]
  - id: cal.1966-07-24.opinion
    when: July 24
    date: '1966-07-24'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, July 8–13: Johnson''s handling of Vietnam: approve 49 percent, disapprove 35.'
    n: '[[w.gallup-poll]], III, 2021. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-07-26.elections-1966
    when: July 26
    date: '1966-07-26'
    thread: elections-1966
    also: [governors]
    c: 'Arkansas, governor; Faubus not running. Democratic primary: Jim Johnson first, Holt second. Rockefeller the Republican nominee, over 96 percent in his primary.'
    n: 'Ark., [*Historical Report of the Secretary of State* (2018), 412–413](https://www.sos.arkansas.gov/uploads/education/2018_Historical_Report.pdf#page=421). [[w.urwin-agenda-for-reform]]. Names: Faubus, Winthrop Rockefeller, James Johnson, Frank Holt.'
    tags: [name:faubus-orval-e, name:rockefeller-winthrop, name:johnson-james-d, state:ar, name:holt-frank]
  - id: cal.1966-07-27.opinion
    when: July 27
    date: '1966-07-27'
    thread: opinion
    also: [court, crime-and-hijacking]
    c: 'Gallup, July 8–13, of those who had followed it, about four in ten: the Supreme Court''s ruling that a suspect be told on arrest of his right to remain silent and to have a lawyer, paid by the State if he cannot pay: good 24 percent, bad 46. South 60 bad; East 32 good.'
    n: '[[w.gallup-poll]], III, 2021–22.'
  - id: cal.1966-07-28.india-and-china-cultural-revolution
    when: July 28
    date: '1966-07-28'
    thread: india-and-china-cultural-revolution
    c: 'Rostow to Johnson: "the crisis inside Communist China" may prove "the most significant event now taking place on the world scene."'
    n: '[FRUS 1964–68, XXX, doc. 172](https://history.state.gov/historicaldocuments/frus1964-68v30/d172). [[w.macfarquhar-maos-last-revolution]]; [[w.goh-constructing-the-u-s]]. Names: Rostow, Johnson.'
    tags: [name:rostow-walt-w, name:johnson-lyndon-b]
  - id: cal.1966-07-29.europe-and-the-alliance
    when: July 29
    date: '1966-07-29'
    thread: europe-and-the-alliance
    also: [economy]
    c: 'Sterling. Heavy losses in July, $200 million on July 15 alone. July 20, Wilson to the Commons: a six-month freeze on wages and prices, some £500 million in cuts, overseas spending among them; no devaluation. July 29, Wilson at the White House. Johnson''s toast: "a man of mettle." Their talks on the pound and on liquidity; American help, if any, to be multilateral.'
    n: 'Toasts of the President and Prime Minister Wilson of Great Britain, [1966 Pub. Papers 790](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=164) (July 29, 1966). FRUS 1964–68, XII, docs. [262](https://history.state.gov/historicaldocuments/frus1964-68v12/d262), [264](https://history.state.gov/historicaldocuments/frus1964-68v12/d264), [265](https://history.state.gov/historicaldocuments/frus1964-68v12/d265); VIII, doc. [102](https://history.state.gov/historicaldocuments/frus1964-68v08/d102). [[w.wilson-labour-government-1964-1970]]; [[w.kunz-butter-and-guns]]; [[w.schwartz-lyndon-johnson-and-europe]]. Names: Wilson, Johnson.'
    tags: [name:wilson-harold, name:johnson-lyndon-b]
  - id: cal.1966-07-29.opinion
    when: July 29
    date: '1966-07-29'
    thread: opinion
    also: [open-housing]
    c: 'Gallup, June 16–21, whites: would move if colored people came to live next door: yes, definitely 13 percent; might 21; no 66. If they came in great numbers: definitely 39; might 31; no 30.'
    n: '[[w.gallup-poll]], III, 2022.'
  - id: cal.1966-07.state-and-city-finance-nyc
    when: July
    date: 1966-07
    thread: state-and-city-finance
    c: 'Albany, N.Y. The legislature, before it adjourns July 6, lets New York City tax its residents'' incomes, and commuters'' earnings at a lower rate: Lindsay''s tax program, cut down. Check the dates, the rates and the city''s local law.'
    n: '[*New York Times*, July 7, 1966](https://www.nytimes.com/1966/07/07/archives/windup-in-albany-leaves-300-bills-leaders-evaluate-session-along.html). [[w.cannato-ungovernable-city]]; [[w.morris-cost-of-good-intentions]]; [[w.shefter-political-crisis-fiscal-crisis]]. See [[cal.1965-06-23.state-and-city-finance-nyc]]. Names: Lindsay.'
    tags: [state:ny, city:nyc, name:lindsay-john-v]
  - id: cal.1966-07-29.africa
    when: July 29
    date: '1966-07-29'
    thread: africa
    c: Nigeria. Northern officers mutiny in the west; Ironsi killed. Gowon, chief of staff of the army, head of the military government.
    n: 'FRUS 1964–68, XXIV, doc. [364](https://history.state.gov/historicaldocuments/frus1964-68v24/d364). See [[cal.1966-01-15.africa]]. Names: Ironsi, Gowon.'
    tags: [name:ironsi-johnson-aguiyi, name:gowon-yakubu]
  - id: cal.1966-07-29.jobs-and-wages-airlines
    when: July 29
    date: '1966-07-29'
    thread: jobs-and-wages-airlines
    also: [economy]
    c: '9:52 p.m., Johnson on television with Siemiller, the machinists'' president, and the airlines'' negotiator: an agreement "essentially within the general framework" of the board, some 72 cents an hour over three years; "this settlement ... will not be inflationary."'
    n: 'Remarks on Announcing an Agreement in the Airline Strike, [1966 Pub. Papers 792](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=166) (July 29, 1966). See [[cal.1966-07-08.jobs-and-wages]]. Names: Johnson, Siemiller.'
    tags: [name:johnson-lyndon-b, name:siemiller-p-l]
  - id: cal.1966-07-30.vietnam
    when: July 30
    date: '1966-07-30'
    thread: vietnam
    c: Ground operations in the southern half of the demilitarized zone authorized, when in contact.
    n: 'Check: the authorization. See [[cal.1966-07-22.vietnam]].'
  - id: cal.1966-07-31.jobs-and-wages-airlines
    when: July 31
    date: '1966-07-31'
    thread: jobs-and-wages-airlines
    c: The machinists reject the airline agreement.
    n: 'Remarks on Announcing an Agreement in the Airline Strike, [1966 Pub. Papers 792](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=166) (July 29, 1966), its note. See [[cal.1966-07-08.jobs-and-wages]].'
