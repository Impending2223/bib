    c: Mao swims the Yangtze at Wuhan, from the Dakoutou at Wuchang down past the Wuhan Iron and Steel Company, some thirty li in a little over an hour. The river wide, deep and swift, he says as he swims, good for body and will.
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 16, 1966; [[w.macfarquhar-maos-last-revolution]], 81–82 (some 5,000 take part in Wuhan''s eleventh annual cross-Yangtze swimming competition; Wang Renzhong and six guards of the Hubei First Independent Division in the water; an hour and five minutes, ten miles; Mao''s remark to a woman swimmer); [[w.jianguo-yilai-mao-zedong]], XVIII, 291 (July 16, 1966; his words as he swam, the morning of July 16, printed from *Renmin ribao*, July 25, 1966; note 1: one hour and five minutes, nearly 15 km); [[w.macfarquhar-origins-of-the-cultural]], III, 461 & n.4 (Mao swims the Yangtze at Wuhan; the note: 15 km in just over an hour); [[w.mao-zedong-zhuan]], VI, ch. 74 n.53 (July 16 at Wuhan, after the display crossing of the Yangtze by 5,000 for the Afro-Asian writers'' meeting, Mao swims with Wang Renzhong, a little over an hour before he boards the boat, body and spirit very good, n.53). [[w.jian-zhou-enlai]], 546–547 (Mao swims in the Yangtze July 16, the tenth anniversary of his swim of 1956, tens of thousands along the river; "strolling in the backyard"); [[w.dikotter-cultural-revolution]], 66 n.1 (an hour downstream, "with ruddy cheeks"; broadcast all over the country; parades; 8,000 swim at the Summer Palace). Made public: July 25, 1966 (Xinhua). Check: MacFarquhar (86, 82 n.67) has the People''s Daily report the swim on July 26; the nianpu entry here has Xinhua''s report of July 25. Check: the Wengao (XVIII, 291) prints Mao''s words from the *Renmin ribao* of July 25, 1966. To check: [[w.hubei-zhengfa-dashiji-1838]], 112–113 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.65a); [[w.chinese-politics]], I, 250–255 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.65b); "Quarterly Chronicle and Documentation," China Quarterly, no. 28 (October–December 1966), 149–152 (cited by [[w.macfarquhar-maos-last-revolution]], 82 n.66); Cankao xiaoxi (Reference News), July 26, 1966 (cited by [[w.macfarquhar-maos-last-revolution]]