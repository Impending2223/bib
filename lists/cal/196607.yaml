    also: [china]
    c: Peking. A "report-back meeting" convened in the name of the Standing Committee takes up the work teams. Liu Shaoqi says the teams need to be given some education, and those that are no good must be overhauled and sorted out. A draft policy document says that of the work teams entering Peking's 312 middle schools only a quarter have succeeded in "exercising strong leadership." Deng Xiaoping proposes that first the students be organized and the power-holders weeded out, and then the work teams, big and small, can be withdrawn.
