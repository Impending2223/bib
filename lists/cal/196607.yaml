    thread: civil-disorders
    also: [states-and-cities, open-housing]
    c: Rioting on Chicago's West Side, begun when police shut off a fire hydrant opened against the heat (Check the occasion). Two dead by stray bullets, a girl of fourteen among them; more than 30 hurt; hundreds arrested. Kerner sends the National Guard at Daley's request; on the streets July 15.
    n: '[*New York Times*, July 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/13/issue.html). [[w.branch-at-canaans-edge]], 502–4 (Roosevelt and Throop; King and Mahalia Jackson free six youths at the 12th District; Daley blames King''s staff, July 15; King, Raby and Cody at City Hall; portable pools, the hydrants refitted; 4,000 Guardsmen; two dead, eighty badly hurt, some five hundred arrested); [[w.kotz-judgment-days]], 365 (King: "I told Mayor Daley something like this would happen"); [[w.bernstein-guns-or-butter]], 397 (Roosevelt Road and Throop Street; 10 injured, 24 arrested); [[w.young-easy-burden]], 409–10; [[w.ralph-northern-protest]], 109–12; [[w.anderson-confronting-the-color-line]], 210–14 (the hydrants at Roosevelt Road and Throop Street; 533 arrested in all; Daley asks the Guard); [[w.cohen-american-pharaoh]], 387–91; [[w.white-making-of-the-president-1969]], 201 (Chicago, July 1966, two killed; not the hydrant, the hurt, the arrests or the Guard). Check: Young, 410, gives 2 dead, 56 injured and 282 arrested in two days. Check: Ralph has the rioting begin near Roosevelt and Throop when the police shut off a hydrant youths had opened, an ice cream truck stuck there (109); over eighty injured, more than four hundred arrested (112). Check: Cohen and Taylor give more than eighty hurt and more than five hundred arrested (391), the Guard asked of Kerner by the morning of July 15 (389). To check: SC, *July 23–24* (n.d.), 2 (cited by [[w.branch-at-canaans-edge]], 502); [*New York Times*, July 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/13/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 502); [[w.king-beyond-vietnam]], 285ff (cited by [[w.branch-at-canaans-edge]], 502); MLK transcript, "West Side Riots," July 12, 1966, A/KS; Bernard O. Brown, "WSO and the Riot on the Near West Side," WSCP papers, box 4, CHS (cited by [[w.ralph-northern-protest]], 110 n.49); *Chicago Tribune*, July 13, 1966, at 1, 6 (cited by [[w.ralph-northern-protest]], 110 n.51); *Chicago Tribune*, July 15, 1966, at 1, 4 (cited by [[w.ralph-northern-protest]], 111 n.54); *Chicago Sun-Times*, July 17, 1966, at 4 (cited by [[w.ralph-northern-protest]], 112 n.58); Brown, Ideology and Community Action, pp. 52–53; *Chicago Sun-Times*, 17 July 1966 (cited by [[w.anderson-confronting-the-color-line]], 211 n.9); *Chicago Tribune*, July 16, 1966, at 1 (cited by [[w.anderson-confronting-the-color-line]], 213 n.18); *Chicago Tribune*, 16 July 1966; *Chicago Sun-Times*, 27 July 1966 (cited by [[w.anderson-confronting-the-color-line]], 214 n.21). "I think seven were originally arrested, and all of them were beaten. I went to the jail. This was in the jail. We went to the jail. They said to me as I talked with some of the groups that were very angry at that time, that if Icould bring the fellows who had been arrested to them, that they would go home and end the disturbance. I said well if you wait right here, I''ll go on down to the police station . . . and there we talked with the commander and were able to get them out on their own recognizance and took them back to the scene, I mean to the church." (cited by [[w.branch-at-canaans-edge]], 502); MLK transcript, "I Need Victories," July 12, 1966, A/KS (cited by [[w.branch-at-canaans-edge]], 503); "Armed Negroes Fight the Police in Chicago Riots," [*New York Times*, July 15, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/15/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 503); Chicago LHM dated July 19, 1966, press summary, FSC-NR, p. 4 (cited by [[w.branch-at-canaans-edge]], 503); *Jet*, July 28, 1966, at 6–13 (cited by [[w.branch-at-canaans-edge]], 503); *Chicago Tribune*, July 16, 1966, at 1 (cited by [[w.branch-at-canaans-edge]], 503); Reynolds, *Jesse Jackson* (1975), 58 (cited by [[w.branch-at-canaans-edge]], 503); "Troops Restoring Order in Chicago Negro Ghetto (cited by [[w.branch-at-canaans-edge]], 504); 2 Dead, 57 Hurt in Rioting," [*New York Times*, July 16, 1966](https://timesmachine.nytimes.com/timesmachine/1966/07/16/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 504); Joe Califano to LBJ, 3:00 p.m., July 15, 1966, and Joe Califano to LBJ, 6:15 p.m., July 15, 1966, EX HU, Box 26, LBJ. "John Doar is in Chicago, as well as Roger Wilkins," Califano advised in the second memo. "I have talked to the various Cabinet Officers involved and told them that Katzenbach would be coordinating the Government''s efforts." (cited by [[w.branch-at-canaans-edge]], 504). See [[cal.1966-07-10.open-housing]]. Names: Kerner, Daley.'
