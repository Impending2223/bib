  - id: cal.1966-07-24.china-leadership
    when: July 24
    date: '1966-07-24'
    place: peking
    thread: china-leadership
    c: 'Diaoyutai Building 12. Mao to the Cultural Revolution Group: no work groups; at most observers, who investigate and do not give orders. Withdraw the groups, suspend the "black gang"; left students and teachers to form revolutionary committees and run it themselves. "Fight and reform": fight the Party people on the capitalist road and the academic authorities. The *Renmin ribao*, the Propaganda and Culture departments and the Peking committee were not in our hands; some comrades fear the masses.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, July 24, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 41 (July 24–25, 1966; Zhou at Mao''s meeting of the Standing Committee and the Cultural Revolution Group, where Mao criticizes the work groups and decides to withdraw them; the next day Mao again to the regional bureau secretaries and the Group); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 646 (July 24 and 25, 1966; Mao, talking with the regional bureaus'' secretaries and the members of the Cultural Revolution Group, sharply criticizes the work groups: they block the mass movement, and to block the revolution is to help the counter-revolutionaries and the black gang; they have made much trouble, and what is wanted of them?); [[w.macfarquhar-maos-last-revolution]], 83–84 (Mao to groups of Party leaders, in the first meeting at his Diaoyutai residence, with Mu Xin present: the work teams must be withdrawn, "let the teachers and students themselves continue"; "nobody stood up to him"); [[w.mao-zedong-zhuan]], VI, ch. 74 n.55 (July 24, at a talk mainly with members of the Central Cultural Revolution Group: no work teams, perhaps observers to look into things and not give orders; withdraw them, suspend the ''black gang''; leftist students and teachers form revolutionary committees and run it themselves; fight and reform, fight those in power in the Party on the capitalist road and the academic authorities; the *Renmin ribao*, the Propaganda Department, the Culture Ministry and the Peking Municipal Committee were not in our hands; some comrades fear the masses, n.55; the place not given). [[w.jian-zhou-enlai]], 547 (the next day, at a Cultural Revolution Group meeting: "all work teams should be recalled"); [[w.dikotter-cultural-revolution]], 67 n.6 (Mao, in white pyjamas, on the ground floor of his Diaoyutai residence, scolds the leaders for fearing the masses and suppressing the students, and demands the work teams be dismissed); [[w.pu-weihua-zalan-jiu-shijie]], 176, 176 n.125 (Mao convenes the Standing Committee and the Cultural Revolution Group; no work groups, at most observers who investigate and give no orders; the *Renmin ribao*, the Propaganda and Culture departments and the Peking committee not in our hands; some comrades fear the masses; Mu Xin puts the meeting in the afternoon at Diaoyutai Building 12 (176 n.125)). Made public: 1991. Check: MacFarquhar (83 n.80) has four successive meetings: on July 24 Liu Shaoqi''s report meeting and a meeting with the Standing Committee and the Cultural Revolution Group, on July 25 one with the regional bureau leaders and the Group, on July 26 one with the entire Group. To check: [[w.zheng-liu-shaoqide-zuihou-suiyue]], 68 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 272 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80b); [[w.zhonghua-renmin-gongheguo-fengyun]], I, 1059 (cited by [[w.macfarquhar-maos-last-revolution]], 83 n.80d); [[w.xin-guanyu-gongzuozu-cunfei-wenti]], 642–645 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.81); [[w.mao-zedong-sixiang-wan]], 165 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.82); [[w.yanchi-tao-zhu-zai-wenhua]], 100 (cited by [[w.macfarquhar-maos-last-revolution]], 84 n.83); Mao Zedong 毛泽东, talk with members of the Central Cultural Revolution Group 中央文革小组 and others (record 谈话记录), July 24, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.55); [[w.qi-benyu-huiyilu]], 447 (cited by [[w.jian-zhou-enlai]], 547 n.17b); 穆欣, 〈關於工作組存廢問題〉, in [[w.huishou-wenge-2-vols]], II, 638 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 176 n.125). Names: Mao Zedong.'
