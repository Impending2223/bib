    c: Liu Shaoqi 劉少奇 and Deng Xiaoping 鄧小平 draw up a plan to put middle-school cadres and teachers through "intensive training" 集訓, so as to end the middle-school movement and reopen school as soon as possible.
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 206–207. Made public: 1967. To check: Xin Beida gongshe 02621 zhidui diaochazu 新北大公社02621支隊調查組, 《清算鄧小平在幹部、教師問題上「打擊一大片,保護一小撮」的資產階級反動路線》 (Apr. 1967) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 207 n.49). Names: Liu Shaoqi, Deng Xiaoping. Check: only the Red Guard exposures of 1967 give it; Yang (I, 205) leaves Deng''s talks on the school unsettled until the archives open.'
