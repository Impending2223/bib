  - id: cal.1966-07.china-leadership-27
    when: July, before the 7th
    date: 1966-07
    at: before 1966-07-07
    thread: china-leadership
    c: 'Mao 毛泽东 has Wei Wenbo 魏文伯 of the East China Bureau 华东局 telephone Jiang Weiqing 江渭清, first secretary of Jiangsu 江苏, uneasy at the movement: do not fear the masses rising to "make revolution"; go further in setting them free; draft a report for the rally.'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 95–96. Made public: 1996 ([[w.jiang-weiqing-qishi-nian-zhengcheng]]). To check: [[w.jiang-weiqing-qishi-nian-zhengcheng]], 517–519 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 96 n.25). Names: Mao Zedong.'
    src:
