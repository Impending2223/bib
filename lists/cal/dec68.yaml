# Cal. CX December 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: CX
entries:
  - id: cal.1968-12-01.civil-disorders
    when: Dec. 1
    date: '1968-12-01'
    thread: civil-disorders
    also: [elections-1968, war-opposition]
    c: 'The Walker report, *Rights in Conflict*, made public by the National Commission on the Causes and Prevention of Violence: the violence in Chicago''s streets and parks in the conventions week, Aug. 25–29, "what can only be called a police riot," provoked in part by demonstrators. Walker, a Chicago lawyer, director of the commission''s Chicago study team.'
    n: '[[w.rights-in-conflict|full]]. [[w.farber-chicago-68]]; [[w.cohen-american-pharaoh]]. See [[cal.1968-08-22.elections-1968]]. Names: Walker.'
    tags: [name:walker-daniel, state:il, city:chicago]
  - id: cal.1968-12-02.transition-and-staff
    when: Dec. 2
    date: '1968-12-02'
    thread: transition-and-staff
    c: New York, the Pierre. Nixon names Kissinger, of Harvard, Rockefeller's adviser on foreign policy, his assistant for national security affairs. Harriman sees Nixon and Kissinger the same day (Check).
    n: 'FRUS 1964–68, VII, doc. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), n. 2. [[w.kissinger-white-house-years]]; [[w.isaacson-kissinger]]; [[w.ferguson-kissinger-1923-1968]]; [[w.hersh-price-of-power]]; [[w.dallek-nixon-and-kissinger]]. Names: Nixon, Kissinger, Rockefeller, Harriman.'
    tags: [name:nixon-richard-m, name:kissinger-henry-a, name:rockefeller-nelson, name:harriman-w-averell]
  - id: cal.1968-12-02.students-san-francisco
    when: Dec. 2–3
    date: '1968-12-02'
    thread: students
    c: 'San Francisco State, reopened by Hayakawa under a "state of emergency" declared Nov. 30. Dec. 2: he climbs a strikers'' sound truck and pulls out its wires. Dec. 3, "Bloody Tuesday": 9 injured, 31 arrested; black community leaders on the campus for the students'' demands.'
    n: '[[w.orrick-shut-it-down]], 58–61. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
    tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
  - id: cal.1968-12-03.vietnam
    when: Dec. 3–Jan. 7
    date: '1968-12-03'
    thread: vietnam
    c: 'Paris, the shape of the table. Dec. 3, Clifford at the Tuesday lunch: "Saigon appears to be stalling until after January 20"; Kỳ not in Paris until the 9th; a date to be set for the talks. Saigon''s delegation, Phạm Đăng Lâm at its head, Kỳ over it, wants two sides; Hanoi and the NLF four parties. Jan. 6, Clifford to his staff: nine table shapes, each divided in two, put to Hanoi for Saigon and refused; Hanoi offers an unmarked round table. Jan. 7, the Tuesday lunch: Rusk, no progress; Clifford, the offer one the parties can accept.'
    n: 'FRUS 1964–68, VII, docs. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), [248](https://history.state.gov/historicaldocuments/frus1964-68v07/d248), [274](https://history.state.gov/historicaldocuments/frus1964-68v07/d274), [275](https://history.state.gov/historicaldocuments/frus1964-68v07/d275). [[w.herring-secret-diplomacy-of-the]]; [[w.nguyen-hanois-war]]; [[w.diem-in-the-jaws-of]]; [[w.clifford-counsel-to-the-president-2]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-05-13.vietnam]]. Made public: FRUS 1964–68, VII (2003). Names: Clifford, Nguyễn Cao Kỳ, Phạm Đăng Lâm, Rusk.'
    tags: [name:clifford-clark, name:nguyen-cao-ky, name:pham-dang-lam, name:rusk-dean]
  - id: cal.1968-12-10.state-and-city-finance-ok
    when: Dec. 10
    date: '1968-12-10'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Oklahoma, special election: $99,808,000 in bonds for buildings at the colleges, the mental hospitals and other institutions, the cigarette tax pledged, 133,313 to 39,251.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-18](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=18) (State Question 463). [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1968-08-27.state-constitutions-ok]]. Names: Bartlett.'
    tags: [state:ok, name:bartlett-dewey-f]
  - id: cal.1968-12-11.transition-and-staff
    when: Dec. 11–12
    date: '1968-12-11'
    thread: transition-and-staff
    c: 'Washington, the Shoreham. Nixon presents his Cabinet on television: Rogers, State; David Kennedy, Treasury; Laird, Defense; Mitchell, Attorney General; Blount, Postmaster General; Hickel, Interior; Hardin, Agriculture; Stans, Commerce; Shultz, Labor; Finch, Health, Education, and Welfare; Romney, Housing and Urban Development; Volpe, Transportation. Dec. 12, Nixon alone with Johnson in the Oval Office, 5:35 to 7:25 p.m.; no record found.'
    n: 'FRUS 1964–68, XIV, doc. [331](https://history.state.gov/historicaldocuments/frus1964-68v14/d331). [[w.evans-nixon-in-the-white]]; [[w.small-presidency-of-richard-nixon]]; [[w.nathan-plot-that-failed]]; [[w.reeves-president-nixon]]; [[w.safire-before-the-fall]]. See [[cal.1968-11-11.transition-and-staff]]. Names: Nixon, Rogers, Kennedy, Laird, Mitchell, Blount, Hickel, Hardin, Stans, Shultz, Finch, Romney, Volpe, Johnson.'
    tags: [name:nixon-richard-m, name:rogers-william-p, name:kennedy-david-m, name:laird-melvin-r, name:mitchell-john-n, name:blount-winton-m, name:hickel-walter-j, name:hardin-clifford-m, name:stans-maurice-h, name:shultz-george-p, name:finch-robert-h, name:romney-george-w, name:volpe-john-a, name:johnson-lyndon-b]
  - id: cal.1968-12-11.congress
    when: Dec. 11–24
    date: '1968-12-11'
    thread: congress
    c: 'Bartlett (D) of Alaska dies in Cleveland after heart surgery. Dec. 24, Governor Hickel, named Secretary of the Interior, appoints Ted Stevens (R), an Anchorage lawyer, majority leader of the State House: the Senate 57 D–43 R at the 91sts opening.'
    n: '[Statement by the President on the Death of Senator E. L. Bartlett of Alaska](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-senator-e-l-bartlett-alaska) (Dec. 12, 1968). [[w.naske-alaska]]. Names: Bartlett, Hickel, Stevens.'
    tags: [name:bartlett-edward-l, name:hickel-walter-j, name:stevens-ted-f, state:ak]
  - id: cal.1968-12-11.opinion
    when: Dec. 11
    date: '1968-12-11'
    thread: opinion
    also: [elections-1968]
    c: 'Gallup, Nov. 9–14, the 44 million who did not vote, by reason: registered but not interested or not liking the candidates, 15 million; could have registered and did not, 10 million; sick or disabled, 7 million; kept out by residence requirements, 5 million; away from home, 3 million; could not leave their jobs, 3 million; no absentee ballot, 1 million. Voters who meant at some time to vote for another candidate, 26 percent. Split their tickets 54, voted straight 46.'
    n: '[[w.gallup-poll]], III, 2171–72.'
  - id: cal.1968-12-13.latin-america
    when: Dec. 13
    date: '1968-12-13'
    thread: latin-america
    c: El Paso. Johnson and Díaz Ordaz open the Rio Grande's new channel, completing the Chamizal boundary change.
    n: '[Remarks in El Paso at the Inauguration of the New River Channel Completing the Chamizal Boundary Change](https://www.presidency.ucsb.edu/documents/remarks-el-paso-the-inauguration-the-new-river-channel-completing-the-chamizal-boundary) (Dec. 13, 1968); [Toasts of the President and President Diaz Ordaz at the Luncheon in El Paso Following the Chamizal Ceremony](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-president-diaz-ordaz-the-luncheon-el-paso-following-the-chamizal) (Dec. 13, 1968). [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1967-10-26.latin-america]]. Names: Johnson, Díaz Ordaz.'
    tags: [name:johnson-lyndon-b, name:diaz-ordaz-gustavo, state:tx]
  - id: cal.1968-12-13.latin-america-2
    when: Dec. 13–25
    date: '1968-12-13'
    thread: latin-america
    c: 'Brazil. Costa e Silva decrees the Fifth Institutional Act: the President may recess Congress, the State assemblies and the municipal councils, intervene in the States without constitutional restraint, suspend any citizens political rights for ten years, revoke mandates; no date of expiry. Congress recessed. State to the embassy, Dec. 17: the regime has "stripped itself of any disguise as military dictatorship."'
    n: 'FRUS 1964–68, XXXI, docs. [236](https://history.state.gov/historicaldocuments/frus1964-68v31/d236), [237](https://history.state.gov/historicaldocuments/frus1964-68v31/d237), [241](https://history.state.gov/historicaldocuments/frus1964-68v31/d241). [[w.skidmore-politics-of-military-rule]]; [[w.green-we-cannot-remain-silent]]; [[w.leacock-requiem-for-revolution]]. See [[cal.1964-03-31.latin-america]]. Made public: FRUS 1964–68, XXXI (2004). Names: Costa e Silva.'
    tags: [name:costa-e-silva-arturo-da]
  - id: cal.1968-12-15.opinion
    when: Dec. 15
    date: '1968-12-15'
    thread: opinion
    also: [transition-and-staff]
    c: 'Gallup, Dec. 5–10: the kind of President Nixon will make: great 6 percent, good 51, fair 34, poor 6. Nixon''s supporters: great 11, good 67. Humphrey''s: great 1, good 35, fair 46, poor 12. Wallace''s: 7, 38, 44 and 8.'
    n: '[[w.gallup-poll]], III, 2172. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-12-16.electoral-college
    when: Dec. 16
    date: '1968-12-16'
    thread: electoral-college
    also: [elections-1968]
    c: 'The electors meet in the States: Nixon 301, Humphrey 191, Wallace 46. In North Carolina, Bailey of Rocky Mount, N.C., on the Nixon slate, votes for Wallace; the other twelve for Nixon. In Michigan, Ferency, a Humphrey elector, refuses to vote for Humphrey; the others name a replacement.'
    n: 'The Associated Press, Dec. 17, 1968, in [115 Cong. Rec. 154](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-1.pdf#page=10) (1969). See [[cal.1968-11-05.elections-1968]]. Names: Nixon, Humphrey, Wallace, Bailey, Ferency.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:bailey-lloyd-w, name:ferency-zolton, state:nc, state:mi]
  - id: cal.1968-12-18.opinion
    when: Dec. 18
    date: '1968-12-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Dec. 5–10: military supplies kept going to South Vietnam, and the South Vietnamese left to take over the fighting and to make all the decisions about peace and dealings with the Viet Cong: agree 46 percent, disagree 44. The war will end in 1969: 35; will not be settled, 54. The Paris peace talks making headway: yes 26, no 64.'
    n: '[[w.gallup-poll]], III, 2172–73. See [[cal.1968-05-13.vietnam]].'
  - id: cal.1968-12-19.economy
    when: Dec. 19
    date: '1968-12-19'
    thread: economy
    c: 'Johnson: on present estimates, a small surplus in fiscal 1969, not the deficit of $5 billion estimated in the summer review; spending held to $184.4 billion, revenues above projections. He hopes to send a January budget that continues it.'
    n: '[Statement by the President Forecasting a Budget Surplus in Fiscal Year 1969](https://www.presidency.ucsb.edu/documents/statement-the-president-forecasting-budget-surplus-fiscal-year-1969) (Dec. 19, 1968). [[w.bernstein-guns-or-butter]]; [[w.zelizer-taxing-america]]. See [[cal.1967-01-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-12-19.vietnam
    when: Dec. 19
    date: '1968-12-19'
    thread: vietnam
    c: 'Sihanouk agrees to release twelve Americans: eleven from an Army landing craft, LCU 1577, held since it entered Cambodian waters July 17, and a helicopter crewman held since Nov. 28 (Check the day of release).'
    n: '[Statement by the Press Secretary on the Release of 12 Americans Detained in Cambodia](https://www.presidency.ucsb.edu/documents/statement-the-press-secretary-the-release-12-americans-detained-cambodia) (Dec. 19, 1968). [[w.clymer-troubled-relations]]. See [[cal.1968-01-08.vietnam]]. Names: Sihanouk.'
    tags: [name:norodom-sihanouk]
  - id: cal.1968-12-20.jobs-and-wages
    when: Dec. 20
    date: '1968-12-20'
    thread: jobs-and-wages
    also: [trade]
    c: 'The International Longshoremen''s Association strikes every East and Gulf Coast port: the 80-day cooling-off period of the Taft-Hartley Act, invoked Oct. 1, ends. Johnson: "There is no remaining statutory authority"; the acts emergency procedures used seven times in the industry, six times followed by strikes; the strike of 1964–65 cost almost a billion dollars in exports.'
    n: '[Statement by the President on the Failure of Taft-Hartley Procedures in the Longshoremen''s Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-the-failure-taft-hartley-procedures-the-longshoremens-strike) (Dec. 20, 1968). See [[cal.1965-02-10.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-12-20.transition-and-staff
    when: Dec. 20–21
    date: '1968-12-20'
    thread: transition-and-staff
    c: Fowler leaves the Treasury, Dec. 20, his resignation accepted Nov. 8. Barr, the Under Secretary, Secretary by recess appointment, Dec. 21; nominated and confirmed Jan. 9.
    n: '[Letter Accepting Resignation of Henry H. Fowler as Secretary of the Treasury](https://www.presidency.ucsb.edu/documents/letter-accepting-resignation-henry-h-fowler-secretary-the-treasury) (Nov. 8, 1968). See [[cal.1965-03-18.transition-and-staff]]. Names: Fowler, Barr.'
    tags: [name:fowler-henry-h, name:barr-joseph-w, name:johnson-lyndon-b]
  - id: cal.1968-12-21.space
    when: Dec. 21–27
    date: '1968-12-21'
    thread: space
    c: 'Apollo 8, the first Saturn V with a crew: Borman, Lovell and Anders, launched from Cape Kennedy, Fla. Dec. 24, in orbit around the moon, ten revolutions; on Christmas Eve, on television, they read from Genesis. Dec. 27, down in the Pacific. Johnson by telephone: "You have made us very proud to be alive at this particular moment in history."'
    n: '[Message to the Apollo 8 Astronauts at the Beginning of Their Flight to the Moon](https://www.presidency.ucsb.edu/documents/message-the-apollo-8-astronauts-the-beginning-their-flight-the-moon) (Dec. 21, 1968); [Remarks by Telephone to the Apollo 8 Crew Members Following Their Return From the Moon](https://www.presidency.ucsb.edu/documents/remarks-telephone-the-apollo-8-crew-members-following-their-return-from-the-moon) (Dec. 27, 1968). [[w.zimmerman-genesis]]; [[w.poole-earthrise]]; [[w.chaikin-man-on-the-moon]]; [[w.murray-apollo]]; [[w.brooks-chariots-for-apollo]]. See [[cal.1967-11-09.space]]. Names: Borman, Lovell, Anders, Johnson.'
    tags: [name:borman-frank, name:lovell-james-a-jr, name:anders-william-a, name:johnson-lyndon-b, state:fl]
  - id: cal.1968-12-22.japan-and-korea
    when: Dec. 22–23
    date: '1968-12-22'
    thread: japan-and-korea
    c: 'Panmunjom, Dec. 23, 9 a.m. Woodward reads into the record a statement repudiating the North Korean document, then signs it: espionage admitted, an apology, a promise not to intrude again; the "pre-repudiated apology" Pak accepted in principle Dec. 17. At 11:30 a.m. the 82 men of the *Pueblo*s crew, Bucher among them, cross the Bridge of No Return, with the body of the seaman killed in the seizure. Johnson, Dec. 22 in Washington: "a long 11 months of totally unjustified detention."'
    n: '[Statement by the President on the Release of the Crew of the U.S.S. Pueblo](https://www.presidency.ucsb.edu/documents/statement-the-president-the-release-the-crew-the-uss-pueblo) (Dec. 22, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [324](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d324), [327](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d327), [331](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d331). [[w.lerner-pueblo-incident]]; [[w.cheevers-act-of-war]]; [[w.armbrister-matter-of-accountability]]; [[w.bucher-bucher-my-story]]. See [[cal.1968-01-23.japan-and-korea]]. Made public: FRUS 1964–68, XXIX, pt. 1 (2000). Names: Woodward, Pak, Bucher, Johnson.'
    tags: [name:woodward-gilbert-h, name:pak-chung-kuk, name:bucher-lloyd-m, name:johnson-lyndon-b]
  - id: cal.1968-12-26.middle-east
    when: Dec. 26–31
    date: '1968-12-26'
    thread: middle-east
    c: 'Dec. 26, two men of the Popular Front for the Liberation of Palestine attack an El Al airliner at the airport of Athens, Greece; one passenger killed. Dec. 28, Israeli commandos by helicopter at Beirut''s airport destroy thirteen Lebanese aircraft. Rusk''s protest to the Israeli embassy: the Lebanese government not known to be involved at Athens. Dec. 31, the Security Council, unanimous, condemns Israel: Resolution 262.'
    n: 'FRUS 1964–68, XX, docs. [367](https://history.state.gov/historicaldocuments/frus1964-68v20/d367), [369](https://history.state.gov/historicaldocuments/frus1964-68v20/d369). [S.C. Res. 262 (1968)](https://undocs.org/en/S/RES/262%281968%29). [[w.spiegel-other-arab-israeli-conflict]]; [[w.quandt-peace-process]]; [[w.little-american-orientalism]]. See [[cal.1968-11-27.middle-east]]. Names: Rusk.'
    tags: [name:rusk-dean]
  - id: cal.1968-12-27.transition-and-staff
    when: Dec. 27–Jan. 20
    date: '1968-12-27'
    thread: transition-and-staff
    also: [intelligence]
    c: 'Kissinger to Nixon, a new NSC system, worked out with Goodpaster: the Council the principal forum for decisions; an NSC Review Group under the President''s assistant to examine every paper first; interdepartmental groups beneath it; the State Departments Senior Interdepartmental Group to go (Check). Approved at Key Biscayne, Fla. Jan. 9, Laird objects; Richardson proposes changes for State. Jan. 13, Nixon: "my firm and definite decision." NSDM 1 and 2, Jan. 20.'
    n: 'FRUS 1969–76, II, docs. [1](https://history.state.gov/historicaldocuments/frus1969-76v02/d1), [3](https://history.state.gov/historicaldocuments/frus1969-76v02/d3), [6](https://history.state.gov/historicaldocuments/frus1969-76v02/d6), [8](https://history.state.gov/historicaldocuments/frus1969-76v02/d8), [10](https://history.state.gov/historicaldocuments/frus1969-76v02/d10), [11](https://history.state.gov/historicaldocuments/frus1969-76v02/d11). [[w.kissinger-white-house-years]]; [[w.destler-presidents-bureaucrats-and-foreign]]; [[w.rothkopf-running-the-world]]; [[w.dallek-nixon-and-kissinger]]. See [[cal.1968-12-02.transition-and-staff]]. Made public: FRUS 1969–76, II (2006). Names: Kissinger, Nixon, Goodpaster, Laird, Richardson.'
    tags: [name:kissinger-henry-a, name:nixon-richard-m, name:goodpaster-andrew-j, name:laird-melvin-r, name:richardson-elliot-l]
  - id: cal.1968-12-29.opinion
    when: Dec. 29
    date: '1968-12-29'
    thread: opinion
    c: 'Gallup, Dec. 5–10: the man most admired, in order of mention: Eisenhower, Johnson, Edward Kennedy, Billy Graham, Nixon, Humphrey, Wallace, Pope Paul VI, Truman, McCarthy.'
    n: '[[w.gallup-poll]], III, 2174–75. Names: Eisenhower, Johnson, Kennedy, Graham, Nixon, Humphrey, Wallace, Paul VI, Truman, McCarthy.'
    tags: [name:eisenhower-dwight-d, name:johnson-lyndon-b, name:kennedy-edward-m, name:graham-billy, name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:paul-vi, name:truman-harry-s, name:mccarthy-eugene-j]
  - id: cal.1968-12-31.economy
    when: Dec. 31–Jan. 17
    date: '1968-12-31'
    thread: economy
    c: 'Johnson to Congress: the Treasury staffs studies and proposals for tax reform, asked for by Dec. 31 in the Revenue and Expenditure Control Act, not examined by him; left to the administration that takes office. Jan. 17, Barr to the Joint Economic Committee: 155 taxpayers with incomes over $200,000, 21 of them over $1 million, paid no federal income tax in 1967; a "taxpayers revolt" ahead (Check the figures and the words).'
    n: '[Letter to the President of the Senate and to the Speaker of the House on the Tax Reform Proposals](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-the-tax-reform-proposals) (Dec. 31, 1968). Check: *The 1969 Economic Report of the President: Hearings Before the Joint Economic Committee*, 91st Cong., 1st Sess., pt. 1. [[w.zelizer-taxing-america]]; [[w.witte-politics-and-development-of]]. Names: Johnson, Barr.'
    tags: [name:johnson-lyndon-b, name:barr-joseph-w]
  - id: cal.1968-12.states-and-cities-us
    when: Dec.
    date: 1968-12
    thread: states-and-cities
    also: [elections-1968]
    c: The Republican Governors Association elects Reagan chairman, in place of Chafee, beaten for re-election in November.
    n: '[Wikipedia, "Governorship of Ronald Reagan"](https://en.wikipedia.org/wiki/Governorship_of_Ronald_Reagan). [[w.sparacino-democratic-and-republican-governors]]; [[w.cannon-governor-reagan]]. Names: Reagan, Chafee. Check: the meeting, its place and day.'
    tags: [name:reagan-ronald, name:chafee-john-h, state:ca]
  - id: cal.1968-12.court-us
    when: Dec.
    date: 1968-12
    thread: court
    also: [states-and-cities, legislatures, amendments]
    c: 'Dirksen''s convention on apportionment, at the year''s end: no legislature applies in 1968; the count stays at 32, of the 34 needed, by the Article V Library''s list.'
    n: '[Article V Library, applications on apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0). See [[cal.1967-12.court-us]]. Names: Dirksen.'
    tags: [name:dirksen-everett]
  - id: cal.1968-12.states-and-cities-nm
    when: Dec.
    date: 1968-12
    thread: states-and-cities
    c: 'Albuquerque. Tijerina, defending himself, acquitted by a State district court jury of the charges of the courthouse raid of June 5, 1967, on which he was tried (Check: the day, the counts).'
    n: '[Wikipedia, "Reies Tijerina"](https://en.wikipedia.org/wiki/Reies_Tijerina). See [[cal.1967-06-05.states-and-cities-nm]]. Names: Tijerina.'
    tags: [state:nm, name:tijerina-reies-lopez]
