    date: '1964-12-01'
    thread: civil-rights-the-executive
    also: [king]
    c: 'DeLoach to Andrew Young, before the meeting, by DeLoach''s bulletin: useless to ask a "peace meeting" while the "crusade of defamation" goes on. Hoover had agreed to see King, Katzenbach urging, through Judge Carey of Chicago.'
