    n: 'Statement by the President Upon Approving Civil Rights Regulations Covering the Programs of Federal Departments and Agencies, [1963–64 Pub. Papers 1638](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=878) (Dec. 4, 1964). [29 Fed. Reg. 16273](https://www.govinfo.gov/app/details/FR-1964-12-04). To check: [[w.graham-civil-rights-era]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson.'
