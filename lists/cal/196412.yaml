  - id: cal.1964-12-01.mississippi
    when: Dec. 1-3
    date: '1964-12-01'
    thread: mississippi
    also: [civil-rights-the-executive]
    c: 'Jackson, the governor''s mansion. Sullivan and Roy Moore of the FBI with State officials on State or federal charges in Neshoba County. The attorney general''s ten impediments; Governor Paul Johnson: Hoover''s word, by King, "indicated that King was calling the shots." Katzenbach and Marshall decide on federal warrants.'
    n: '[[w.branch-pillar-of-fire]], 535. To check: Rosen to Belmont, Dec. 1, 1964, FMB-1413 (cited by [[w.branch-pillar-of-fire]], 535); Rosen to Belmont, Dec. 2, 1964, FMB-1414 (cited by [[w.branch-pillar-of-fire]], 535); SAC, Jackson, to Director, Dec. 3, 1964, FMB-1420 (cited by [[w.branch-pillar-of-fire]], 535); William H. Johnson, Jr., to Erle Johnston, Jr., Dec. 4, 1967, MSSC (cited by [[w.branch-pillar-of-fire]], 535); Int. Joseph Sullivan, Feb. 3, 1991 (cited by [[w.branch-pillar-of-fire]], 535); Rosen to Belmont, Dec. 4, 1964, FMB-1427 (cited by [[w.branch-pillar-of-fire]], 535); Whitehead, Attack on Terror (1970), 197-202 (cited by [[w.branch-pillar-of-fire]], 535). See [[cal.1964-06-21.mississippi]]. Names: Paul Johnson, Katzenbach, Marshall, King, Hoover.'
