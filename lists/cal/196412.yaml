  - id: cal.1964-12-28.china-leadership
    when: Dec. 28
    date: '1964-12-28'
    place: peking
    thread: china-four-cleanups
    also: [china-mao]
    c: 'Mao presides over the Central Work Conference, Hebei Hall, afternoon, after Luo Ruiqing, Chen Yi and Xie Fuzhi speak: the nature of the movement;{1} he takes the third of three formulations, the main contradiction that between socialism and capitalism;{2} the target, those in power in the Party taking the capitalist road.{3} And article 16, the work style: more democracy; "what frightens people has less reason".{4} Tells them to read the Party constitution, the 8th Congress documents, pp. 100–104, and the Constitution''s article 85.{5} Mao, holding the Party and state constitutions: as member and citizen he may speak;{6} one told him not to come, another did not want him to speak.{7} The conference, due to close that day, goes on after New Year.{8} Liu Shaoqi, Peng Zhen and Zhu De attend.{9} He asks: "Am I a party member? Am I a citizen?"{10} By Yang Jisheng''s account Deng Xiaoping 邓小平, taking it for a routine briefing, had told Mao he need not attend; by Chen Boda''s 陈伯达 later account to his son, Liu had cut in on Mao''s speech the day before and talked on.{11}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 28, 1964. [[w.macfarquhar-maos-last-revolution]], 13 (the Party card and the constitution); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 611 (Dec. 28, 1964; Liu attends the national work conference, at which Luo Ruiqing, Chen Yi and Xie Fuzhi speak; Mao, speaking, criticizes the formulations of the nature of the movement as a contradiction between the "four clean-ups" and the "four unclean," a crossing of contradictions inside and outside the Party, a crossing of enemy and people''s contradictions; its nature is the contradiction between socialism and capitalism and its main point the rectifying of those in power in the Party who take the capitalist road); [[w.macfarquhar-origins-of-the-cultural]], III, 424–25 (at the end of a long monologue on the movement''s nature Mao brandishes the state and Party constitutions: as citizen and member he may speak; one colleague would keep him from the meeting, another from speaking); [[w.macfarquhar-origins-of-the-cultural]], III, 431 (by Mao''s account to Snow of Dec. 1970, Liu Shaoqi opposed the "capitalist roader" formulation at the conference; by Hu Qiaomu''s, he spoke only of overlapping contradictions); [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 28, afternoon, the Hebei Hall of the Great Hall: Mao presides, Luo Ruiqing, Chen Yi and Xie Fuzhi speak; on article 1 the third formulation, socialism against capitalism, and article 16, democracy and fear; he tells them to read the Party constitution and the Eighth Congress papers, pp. 100–104 (n.38)). [[w.yang-jisheng-mubei]], II, 1146 n.69 (at the conference on the four cleans Mao comes into a meeting Deng Xiaoping chairs, the state Constitution 憲法 in one hand and the Party Constitution 黨章 in the other: one does not let him attend a meeting, one does not let him speak, why take away the rights the two give him? Deng had told him beforehand he need not attend, being unwell; in Chen Boda''s account to his son Chen Xiaonong, Liu Shaoqi had broken in on Mao''s speech at the meeting on the 23 Articles the day before and gone on speaking; the book dates the scene Jan. 28, 1965); [[w.yang-jisheng-tiandi-fanfu]], I, 91 (Mao reads the constitution and the Party constitution on free speech; Deng Xiaoping had told him he need not come; Chen Boda''s later account to his son: Liu interrupted Mao and talked on); [[w.peng-zhen-nianpu-1902]], IV, 382 (Dec. 28, 1964; Peng Zhen at the work conference''s plenary, Mao presiding, on its minutes; after Luo Ruiqing, Chen Yi and Xie Fuzhi speak, Mao criticizes calling the movement''s nature the contradiction of "four cleans" and "four uncleans," or a crossing of contradictions inside and outside the Party and of enemy and people: its name socialist education, its stress "整党内那些走资本主义道路的当权派"); [[w.jian-zhou-enlai]], 519 (two days after the banquet, "at a Politburo meeting," so Chen: Mao brings the PRC constitution and the Party charter; "Am I a party member? Am I a citizen?"; barred from one meeting and not invited to speak at another; the movement to "expose those capitalist roaders in power"; Liu and Deng at a loss for words); [[w.dikotter-cultural-revolution]], 25–26 n.36 (Deng having suggested Mao need not attend, Mao brandishes the Party and state constitutions and reads out his right to speak; "One person told me not to attend the meeting, and another didn''t want me to speak"; outside the room: "Somebody is shitting on my head"); [[w.pu-weihua-zalan-jiu-shijie]], 24 (at a Politburo meeting Mao, holding the Party constitution and the state constitution, raps Liu Shaoqi and Deng Xiaoping); [[w.zhu-de-nianpu-xinbian]], III, 1925–1926 (Dec. 28, 1964, afternoon; Zhu De 朱德 attends the Central Work Conference 中央工作会议; Mao Zedong 毛泽东 criticizes the minutes'' formulas of the movement''s nature (the "four clean" against the "four unclean," the crossing of contradictions inside and outside the Party, of the enemy''s and the people''s), holds it the contradiction of socialism and capitalism, its point to rectify those in power in the Party taking the capitalist road; the conference, due to close that day, goes on after New Year); [[w.teiwes-tragedy-of-lin-biao]], 202–203 (Mao''s claims at the conference, undated there, that Deng tried to keep him from it and Liu would not let him speak); [[w.teiwes-tragedy-of-lin-biao]], 202–203 (Mao''s claims at the conference, undated there, that Deng tried to keep him from it and Liu would not let him speak); [[w.jian-zhou-enlai]], 519; [[w.yang-jisheng-tiandi-fanfu]], I, 91. Made public: 1996. Check: MacFarquhar (13), at a top-level conference "by the end of 1964", undated: Mao challenges Liu Shaoqi''s handling of the Socialist Education Movement, accuses Liu and Deng Xiaoping of trying to keep him from speaking by leaving him out, and produces his Party card and a copy of the constitution to show his right to be there and be heard. Check: [[w.yang-jisheng-mubei]], II, 1146, dates the scene with the two constitutions Jan. 28, 1965, "still at this meeting" on the four cleans, a fortnight after the conference (Dec. 15 to Jan. 14, [[cal.1964-12-15.china-leadership]]) closed, and has Deng Xiaoping chair the meeting. To check: [[w.jin-1949-1989-niande-zhongguo]], 604 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.136a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1131 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.136b); [[w.zhisui-private-life-of-chairman]], 411–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.136c); Mao Zedong, speech of Dec. 28, 1964, to the work conference, in [[w.tse-tung-miscellany-of-mao-tse]], 2, 429–32 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.136d); [[w.snow-long-revolution]], 17 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 431 n.1a); [[w.thomas-season-of-high-adventure]], 312–15 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 431 n.1b); [[w.zhonggong-dangshi-renwuzhuan]], 48, 1