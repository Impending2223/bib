  - id: cal.1964-12-21.china-leadership
    when: Dec. 21–22
    date: '1964-12-21'
    place: peking
    thread: china-models
    also: [china-four-cleanups, china-zhou, china-political-legal, china-economy]
    c: 'Zhou, at the first session of the Third National People''s Congress (Dec. 21–Jan. 4), gives the Government Work Report on two successive days.{1} Three parts. First, the economy''s gains and tasks: the readjustment basically done, farm and industry on the rise, the economy turned and about to enter a new period; in 1965 finish the unfinished readjustment and prepare the Third Five-Year Plan from 1966; the main task is to build in a not too long period a socialist power with modern agriculture, industry, defense, science and technology, catching up with and passing the world''s best;{2} two steps from the Third Plan: first a whole independent industrial and economic system, then modernization of all four to put China in front.{3} "We cannot take the old path of other countries'' technical growth, crawling after them; we must break rules and use advanced technique."{4} Second, socialist revolution and the people''s democratic united front: classes and class struggle remain; the socialist education movement in town and country is the chief content of the revolution now; revolution on the ideological and cultural front is one of its great sides; offices and cadres to be revolutionized and learn from the army; against the "five too-manys": offices, staff, forms, papers, meetings. Third, the international situation and foreign work.{5} Dec. 21, the afternoon, the opening: Peng Zhen 彭真 among the executive chairmen, with Mao, Liu Shaoqi, Zhu De 朱德, Zhou Enlai, Song Qingling 宋庆龄, Deng Xiaoping 邓小平, Kang Sheng 康生 and Guo Moruo 郭沫若.{6}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 695–96 (Dec. 21–22, 1964); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 610 (Dec. 21, 1964–Jan. 4, 1965; Liu attends the First Session of the Third NPC, which adopts the government work report and the work reports of the NPC Standing Committee, the Supreme People''s Court and the Supreme People''s Procuratorate); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 376–377 (Dec. 22, 1964; Zhou gives the Government Work Report at the first session of the Third National People''s Congress; on foreign policy he says China will go on carrying out its line, struggling with the peoples of the world firmly against U.S. imperialism and its running dogs, for new victories in the struggle for world peace, national liberation, people''s democracy and socialism; on the Sino-Indian boundary, China too strives to get India to settle through peaceful negotiation; Zhou denounces the U.S. for long occupying Taiwan, blocking the restoration of China''s lawful rights in the United Nations and plotting "two Chinas" or "one China, one Taiwan"; the People''s Republic is the only legal government representing the whole Chinese people, no other person or group may represent China or a part of its territory in any name or hold its seat in the United Nations; unless the United Nations drives out the Chiang Kai-shek clique''s representatives and fully restores China''s lawful rights, China will have nothing to do with it); [[w.jianguo-yilai-mao-zedong]], XVII, 472–476 (Dec. 13, 1964; the sentence is Mao''s addition to the fourth draft); [[w.deng-xiaoping-nianpu-1904]], III, 1840 (Dec. 21, 1964–Jan. 4, 1965; Deng attends the First Session of the Third National People''s Congress; Zhou Enlai gives the Government Work Report on the afternoons of the 21st and 22nd); [[w.yang-jisheng-tiandi-fanfu]], II, 1073, 1075 (Zhou''s government work report: Daqing''s experience, and the call "industry learn from Daqing, agriculture from Dazhai, the nation from the PLA"; Dazhai an advanced model of self-reliant rural building by the commune''s collective strength; Yang dates the report Jan. 4, 1965 at II, 1073, December 1964 at II, 1075); [[w.peng-zhen-nianpu-1902]], IV, 380–381 (Dec. 21, 1964, afternoon; Peng Zhen at the opening of the third NPC''s first session, an executive chairman with Mao, Liu Shaoqi, Zhu De, Zhou Enlai, Soong Ching-ling, Deng Xiaoping, Kang Sheng, Guo Moruo and others; Zhou''s Government Work Report; on the 22nd at the plenary for its rest: in a not too long time a strong socialist country with modern agriculture, industry, defense and science and technology, catching up with and passing the world''s advanced levels); [[w.chen-yi-nianpu]], 1074–1075 (Dec. 21, 1964–Jan. 4, 1965, the Great Hall of the People; Chen Yi at the session; Zhou''s report first raises the four modernizations; Liu Shaoqi elected Chairman, Zhou named Premier, and Chen Yi named Vice-Premier and Foreign Minister and Vice-Chairman of the National Defense Council); [[w.jian-zhou-enlai]], 520 (the report''s highlight, "in not too long a historical period," China "a socialist power, with modern agriculture, modern industry, modern national defense, and modern science and technology"; Mao, reviewing the speech, adds the paragraph: not to repeat other countries'' old path of technical growth, creeping behind; break the norms; "This is what we have called the ''Great Leap Forward''"); [[w.zhu-de-nianpu-xinbian]], III, 1925 (Dec. 21–Jan. 4, 1965; Zhu De 朱德 attends the first session of the Third National People''s Congress 第三届全国人民代表大会第一次会议 at Peking 北京 and presides over its opening; Zhou Enlai''s 周恩来 *Report on the Work of the Government* 《政府工作报告》 announces that within a not too long historical period China will be built into a strong socialist country with modern agriculture, industry, national defense and science and technology, in two steps; Dec. 22, Zhu De hears the rest of the report); [[w.chen-yun-nianpu-xiuding]], III, 147–148 (Zhou''s Government Work Report: the task of adjusting the economy basically done; from the Third Five-Year Plan two steps, an independent, fairly complete industrial and economic system, then the four modernizations); [[w.peng-zhen-nianpu-1902]], IV, 380–381. To check: [[w.zhou-enlai-jingji-wenxuan]], 563 (cited by [[w.jian-zhou-enlai]], 520 n.9); [[w.mao-zedong-wenji]], VIII, 325, 341 (cited by [[w.jian-zhou-enlai]], 520 n.10). Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Peng Zhen, Zhu De, Song Qingling, Deng Xiaoping, Kang Sheng, Guo Moruo.'
