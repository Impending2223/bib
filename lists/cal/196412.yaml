  - id: cal.1964-12-01.king
    when: Dec. 1
    date: '1964-12-01'
    thread: king
    c: 'King and Hoover meet, 3:30 p.m., Abernathy, Andrew Young and Fauntroy with King, DeLoach with Hoover. Mostly Hoover on the Bureau''s record in the South; nothing of King''s private life. DeLoach: "more or less of a love feast"; Young: "a mutual admiration society."'
    n: '[S. Rep. No. 94-755, Book III, 163–68 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=177) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 365; [[w.kotz-judgment-days]], 232 (Hoover''s office, Dec. 1; King and Abernathy praise the FBI''s work; no word of the accusations); [[w.branch-pillar-of-fire]], 534-35; [[w.bernstein-guns-or-butter]], 217 (King with Abernathy, Andrew Young and Fauntroy, DeLoach beside Hoover; "wholly ceremonial"). Check: Bernstein, 217, puts the meeting "at the end of November.". To check: Howell, "An Interview with Andrew Young," *Christianity and Crisis*, Feb. 16, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]], 365 n.105b); [[w.garrow-fbi-and-martin-luther]], 129-30 (cited by [[w.branch-pillar-of-fire]], 534); [[w.garrow-bearing-the-cross]], 362-64 (cited by [[w.branch-pillar-of-fire]], 534); [[w.deloach-hoovers-fbi]], 208-11 (cited by [[w.branch-pillar-of-fire]], 534); [[w.young-easy-burden]], 318-19 (cited by [[w.branch-pillar-of-fire]], 534); Lewis, King, 256-57 (cited by [[w.branch-pillar-of-fire]], 534); Int. Andrew Young, Oct. 26, 1991 (cited by [[w.branch-pillar-of-fire]], 534); Int. Cartha DeLoach, June 1, 1984 (cited by [[w.branch-pillar-of-fire]], 534); Drew Pearson, "Meeting with Hoover Amazes King," WP, Dec. 5, 1964 (cited by [[w.branch-pillar-of-fire]], 535). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: Martin Luther King, Hoover, Abernathy, Andrew Young, DeLoach.'
