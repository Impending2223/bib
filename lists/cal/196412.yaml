  - id: cal.1964-12-01.vietnam
    when: Dec. 1–3
    date: '1964-12-01'
    time: 1964-12-01T16:30Z
    place: washington
    thread: vietnam-air-war
    c: 'Taylor and the principals with Johnson.{1} A first phase approved for thirty days: armed reconnaissance and air strikes against the infiltration routes in Laos, reprisals for any major attack.{2} A second phase, direct military pressure on the North, "after the GVN has shown itself firmly in control."{3} Johnson: tell a few members, "Give good and bad"; Rusk to see Fulbright, Hickenlooper, Saltonstall and Russell, and in the House Mahon, perhaps Ford.{4} Taylor''s instructions, Dec. 3.{5}'
    n: 'FRUS 1964–68, I, docs. [432](https://history.state.gov/historicaldocuments/frus1964-68v01/d432), [433](https://history.state.gov/historicaldocuments/frus1964-68v01/d433), [434](https://history.state.gov/historicaldocuments/frus1964-68v01/d434), [435](https://history.state.gov/historicaldocuments/frus1964-68v01/d435); [FRUS 1964–68, XXVIII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v28/d148). [[w.gibbons-u-s-government-and]], II, 374–76, 379; [[w.cosmas-joint-chiefs-of-staff-2012]], 180–182, 189; [[w.dallek-flawed-giant]], 241–42; [[w.moyar-triumph-forsaken]], 341–42; [[w.macv-command-history-1964]], 162 (Taylor''s talks in Washington, Dec. 1, a phased program); [[w.mcnamara-in-retrospect]], ch. 6 at nn.17–18 (Humphrey present; the options; Johnson: "I am hesitant to sock my neighbor if my fever is 104 degrees"; Taylor: "I doubt that Hanoi will slap back"). [[w.ball-past-has-another-pattern]], 388–89 (the first phase approved, the second conditioned on Saigon''s reforms); [[w.branch-pillar-of-fire]], 543; [[w.taylor-swords-and-plowshares]], 326–27 (Taylor''s report at the end of November; authority to plan action against the North with the allies, no commitment to carry it out); [[w.logevall-choosing-war]], 268–70 (Taylor and the principals with Johnson, Dec. 1: phase one, armed reconnaissance strikes on the infiltration routes in Laos and reprisals for a Vietcong "spectacular"; Johnson, "The plans you''ve got now ... [are] all right"; not the thirty days as phase one''s term). Check: Logevall, 269–70, puts phase two after thirty days of phase one, if Saigon''s effectiveness had bettered "to an acceptable degree," then waived; at the meeting Johnson: "Johnson City boys," "Why not say, This is it?," to Wheeler, "then I''ll be talking to you, General," and dependents to be removed from Saigon. The time is the first day''s. To check: [[w.pentagon-papers]], II, 422. See [[cal.1964-11-01.vietnam]]. Names: Taylor, Johnson, Rusk, Fulbright, Hickenlooper, Saltonstall, Russell, Mahon, Ford. Check: Moyar, 341, dates Johnson''s decision Nov. 29, quoting him from the notes of the meeting of Dec. 1.'
