    tags: [name:rainey-lawrence-a, name:price-cecil-r, name:chaney-james-e, name:goodman-andrew, name:schwerner-michael]
  - id: cal.1964-12-04.congress
    when: Dec. 4
    date: '1964-12-04'
    thread: congress
    also: [mississippi]
    c: 'The Freedom Democrats'' contests, under the contested-elections statute: Hamer serves notice on Whitten (2d), Annie Devine on Prentiss Walker (4th), Victoria Gray on Colmer (5th). Their grounds: Negroes kept from the vote and from the ballot. A resolution to come Jan. 4, that none of the five Mississippians be sworn until the contests are decided.'
    n: 'SNCC, [Fact Sheet on the Congressional Challenge](https://www.crmvet.org/docs/641200_sncc_congchall_fact.pdf) (Dec. 1964). 2 U.S.C. §§ 201–226 (1964). [[w.dittmer-local-people]], 338. To check: [[w.payne-ive-got-the-light]]; [[w.mills-this-little-light-of]]. See [[cal.1964-08-25.mississippi]]. Names: Hamer, Devine, Victoria Gray, Whitten, Colmer, Walker.'
