  - id: cal.1964-12-01.vietnam
    when: Dec. 1–3
    date: '1964-12-01'
    thread: vietnam
    c: 'Taylor and the principals with Johnson. A first phase approved for thirty days: armed reconnaissance and air strikes against the infiltration routes in Laos, reprisals for any major attack. A second phase, direct military pressure on the North, "after the GVN has shown itself firmly in control." Taylor''s instructions, Dec. 3.'
    n: 'FRUS 1964–68, I, docs. [432](https://history.state.gov/historicaldocuments/frus1964-68v01/d432), [433](https://history.state.gov/historicaldocuments/frus1964-68v01/d433), [434](https://history.state.gov/historicaldocuments/frus1964-68v01/d434), [435](https://history.state.gov/historicaldocuments/frus1964-68v01/d435); [FRUS 1964–68, XXVIII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v28/d148). [[w.gibbons-u-s-government-and]], II, 374–76, 379; [[w.cosmas-joint-chiefs-of-staff-2012]], 180–182, 189; [[w.dallek-flawed-giant]], 241–42; [[w.moyar-triumph-forsaken]], 341–42; [[w.macv-command-history-1964]], 162 (Taylor''s talks in Washington, Dec. 1, a phased program). [[w.ball-past-has-another-pattern]], 388–89 (the first phase approved, the second conditioned on Saigon''s reforms). See [[cal.1964-11-01.vietnam]]. Names: Taylor, Johnson. Check: Moyar, 341, dates Johnson''s decision Nov. 29, quoting him from the notes of the meeting of Dec. 1.'
