    also: [vietnam, china-foreign, china-economy]
    c: 'Zhou receives Edgar Snow.{1} China''s adjustment of these years aimed not only at quantity but variety and quality, balancing output, variety and quality of industrial goods; the task is basically done, the economy turned and will grow anew; still backward by need, and a modern state will take long. China is very complex: "after fifteen years of economic construction I as premier have not learned it." The laws of growth are complex; some known, more not; some right, some wrong in fifteen years; one needs both kinds of experience. "Catch up with Britain" is no longer a central question; chasing output in a few products does not modernize industry, the level of industry and technique matters. China–U.S. relations: first, agreement on peaceful coexistence by the five principles; second, all U.S. armed forces out of Taiwan and the Strait; then the rest is easier. On Southeast Asia: it is tied to all Indochina; if the U.S. misbehaves there China cannot stand by.{2}'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 693–94 (Dec. 16, 1964); [[w.zhou-enlai-waijiao-huodong]], 431 (Dec. 16, 1964; 晚8时, 中南海西花厅, 接见斯诺). Made public: 1993. Names: Zhou Enlai, Snow.'
