  - id: cal.1964-12-01.civil-rights-the-executive-3
    when: Dec. 1
    date: '1964-12-01'
    thread: civil-rights-the-executive
    also: [king]
    c: 'The day of his meeting with King, Hoover sends the White House a thirteen-page report, "Communism and the Negro Movement—A Current Analysis," the dossier of October 1963 brought up to date, with new pages on King''s private life: King "an unprincipled, opportunistic individual"; "a security problem to this nation." Hoover''s letter: "Your advice is requested as to whether we should disseminate this document to responsible figures in the executive branch of government."'
    n: '[[w.kotz-judgment-days]], 233–34. To check: Hoover to Johnson, Dec. 1, 1964, and "Communism and the Negro Movement—A Current Analysis," NLJ-086, Stegall Files, LBJ Library; S. Rep. No. 94-755, Book III (1976), 146–52 (cited by [[w.kotz-judgment-days]], 234 n.15). See [[cal.1964-12-01.king]]. Names: Hoover, Martin Luther King.'
    src:
      c: 6de40302
      rows:
        - 'w.kotz-judgment-days 233–34: all'
        - 'via x.1964-12-01.hoover-to-johnson-communism-and-the-negro-movement: all'
    tags: [name:hoover-j-edgar, name:king-martin-luther-jr]
  - id: cal.1964-12-01.press-and-broadcasting
    when: Dec. 1
    date: '1964-12-01'
    thread: press-and-broadcasting
    also: [king]
    c: FBI headquarters, during the Hoover–King meeting. An FBI official shows James McCartney of the *Chicago Daily News*, waiting outside Hoover's office, a picture of King leaving a motel with a white woman, and offers "the whole story" of his private life, the Bureau not to be named. McCartney declines.
    n: '[[w.kotz-judgment-days]], 239. To check: *The Quill*, Feb. 1976, 12–18 (cited by [[w.kotz-judgment-days]], 239 n.27). See [[cal.1964-12-01.king]]. Names: Martin Luther King.'
