  - id: cal.1964-12-06.china-leadership
    when: Dec. 6–18
    date: '1964-12-06'
    thread: china-zhou
    c: 'Zhou attends the State Council''s Yellow River control conference on Dec. 6, 7, 12–14 and 18. At the close Dec. 18: resolve to rebuild the Sanmenxia works and begin, or silt is harder; too soon to say whether the plans were wholly right or wrong; all views may be stated; old China could not tame the river, we shall find its laws step by step. Whatever the view, none to be self-satisfied; study more data, go to the site. Rebuild on no great scale; the aim is a river that serves production, water and soil together, up, middle and down stream. Divide the work; keep the whole in view. Experts to find contradictions and resolve them; heat of mind sees one side; the lessons of these years must be taken to heart.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 691 (Dec. 6–18, 1964). Made public: 1997. Names: Zhou Enlai.'
    tags: [name:zhou-enlai, polity:prc, vis:only:prc]
