  - id: cal.1964-12-10.laos
    when: Dec. 10
    date: '1964-12-10'
    thread: laos
    also: [vietnam]
    c: 'Vientiane. Sullivan with Souvanna Phouma: American armed reconnaissance over Routes 7, 8 and 12 agreed, "if we see anything moving on the road, either day or night, attack it"; nothing said in public, any plane lost to be one on reconnaissance at the government''s request. Barrel Roll, the program of Dec. 1; Dec. 19, a two-week program submitted, signaling "by design" no intensification.'
    n: '[FRUS 1964–68, XXVIII, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v28/d150); [doc. 153](https://history.state.gov/historicaldocuments/frus1964-68v28/d153) (Dec. 19); [FRUS 1964–68, I, doc. 456](https://history.state.gov/historicaldocuments/frus1964-68v01/d456) (Dec. 21). [[w.frankum-like-rolling-thunder]], 116–17 (Barrel Roll begun in December, two missions a week); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 257 (Souvanna''s assent, Dec. 10); [[w.staaveren-u-s-air-force]], 44 (Souvanna''s consent, Dec. 10, no publicity; Barrel Roll). To check: JCS to CINCPAC, 112144Z Dec 64 (cited by [[w.staaveren-u-s-air-force]], 44 n.37b); CINCPAC to COMUSMACV, 120612Z Dec 64 (cited by [[w.staaveren-u-s-air-force]], 44 n.37c); JCSM-1041-64, Dec 11, 1964 (cited by [[w.staaveren-u-s-air-force]], 44 n.37d); MR, subj: Meeting of National Security Council Principals, Dec 12, 1964 (cited by [[w.staaveren-u-s-air-force]], 44 n.37e); *Washington Post*, Dec. 24, 1964 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 257 n.109). See [[cal.1964-12-01.vietnam]]. Names: Sullivan, Souvanna Phouma.'
