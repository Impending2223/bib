  - id: cal.1964-12-07.europe-and-the-alliance
    when: Dec. 7–9
    date: '1964-12-07'
    thread: europe-and-the-alliance
    c: 'Wilson in Washington, with Gordon Walker and Healey. The British propose an Atlantic Nuclear Force in place of the MLF: their strategic bombers, less some, and four Polaris submarines; mixed manning to be tried. No decision. Dec. 17, NSAM 322: no American official to press for a binding agreement; no agreement against France.'
    n: 'Joint Statement Following Discussions With the Prime Minister of Great Britain, [1963–64 Pub. Papers 1649](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=889) (Dec. 8, 1964). FRUS 1964–68, XIII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v13/d58), [59](https://history.state.gov/historicaldocuments/frus1964-68v13/d59), [61](https://history.state.gov/historicaldocuments/frus1964-68v13/d61); doc. [62](https://history.state.gov/historicaldocuments/frus1964-68v13/d62) (Bundy to Bruce, Dec. 9: discussion, not decision); [NSAM No. 322](https://history.state.gov/historicaldocuments/frus1964-68v13/d65) (Dec. 17, 1964). [[w.poole-joint-chiefs-of-staff]], 206–207 (the visit; no decision; NSAM 322); [[w.schwartz-lyndon-johnson-and-europe]], 43–45, 69 (the talks; the Atlantic Nuclear Force). [[w.gavin-gold-dollars-and-power]], 131–32 (sterling at the talks). To check: [[w.priest-kennedy-johnson-and-nato]]; "Wilson Visit and the MLF," memorandum of conversation, Dec. 6, 1964, Neustadt Papers, LBJ Library; note for the record, Dec. 7, 1964, PREM 13/103, and record of meeting, Dec. 7, 1964, PREM 13/252, Public Record Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 44–45 nn.157, 159; 69 n.96); Bruce diary, Dec. 6, 1964, and Bundy to Johnson, Dec. 6, 1964, FRUS 1964–68, XIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v13/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v13/d57) (cited by [[w.schwartz-lyndon-johnson-and-europe]], 44 n.156). See [[cal.1963-01-24.europe-and-the-alliance]]. See [[cal.1964-06-12.europe-and-the-alliance]]. Names: Wilson, Gordon Walker, Healey, Johnson.'
    src:
      c: b4a55b67
