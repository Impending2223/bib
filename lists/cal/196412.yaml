  - id: cal.1964-12-27.china-leadership
    when: Dec. 27
    date: '1964-12-27'
    place: peking
    thread: china-four-cleanups
    also: [china-mao]
    c: 'Mao presides over the Central Work Conference, Hebei Hall, afternoon, on its minutes, the 17 points.{1} Chen Boda: the main contradiction, the four-cleans and the socialism-capitalism contradiction.{2} Mao: the Party has at least two factions, a socialist and a capitalist;{3} and, Beijing has two "independent kingdoms", not the municipal committee.{4} Orders the text issued as "the discussion minutes of the national work conference called by the Politburo", dated Dec. 27; Dec. 28 issued (Central Committee [64] no. 811).{5} Dec. 31: the Central''s General Office stops it, to be destroyed.{6} Zhu De 朱德, Chen Boda, Dong Biwu 董必武, Lu Dingyi 陆定一 and Saifuddin 赛福鼎 speak on how to carry on the socialist education movement. Peng Zhen 彭真 attends.{7}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 27, 1964. [[w.macfarquhar-maos-last-revolution]], 13 (a CC directive on the movement''s next stages rescinded); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 611 (Dec. 27, 1964; Liu attends the national work conference, at which Zhu De, Chen Boda, Dong Biwu, Lu Dingyi and Sai Fuding speak on how to carry on the socialist-education movement); [[w.macfarquhar-origins-of-the-cultural]], III, 424–25 (Chen Boda derides the formulations of the four cleans and of the overlapping contradictions; Mao: at least two factions in the Party, socialist and capitalist; Mao again approves the document, a seventeenth clause added; Dec. 28, Peng Zhen authorizes its printing and distribution as central document No. 811; Dec. 31, with Liu''s agreement, the General Office cancels it); [[w.jianguo-yilai-mao-zedong]], XVII, 482–486 (Dec. 27, 1964; note 1: the seventeenth point added; the title made "rural"; Mao''s "issue" (照发) dated Dec. 27; issued as Zhongfa [64] 811 Dec. 28; the General Office''s notice of Dec. 31 stopping it); [[w.deng-xiaoping-nianpu-1904]], III, 1840 (Dec. 27 and 28, 1964; Deng attends the plenary of the Central Work Conference on both afternoons); [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 27, afternoon, the Hebei Hall of the Great Hall: Mao presides; Zhu De, Chen Boda, Dong Biwu, Lu Dingyi speak; the text of 17 articles issued Dec. 28; Dec. 31 the Center''s General Office stops its circulation and orders it destroyed). [[w.yang-jisheng-tiandi-fanfu]], I, 90–91 (Mao: "this Party has at least two factions, a socialist one and a capitalist one"; to Dong Biwu: two independent kingdoms in Peking, "guess"); [[w.peng-zhen-nianpu-1902]], IV, 381–382 (Dec. 27, 1964; Peng Zhen at the work conference''s plenary, Mao presiding, hearing Zhu De, Chen Boda, Dong Biwu, Lu Dingyi and Saifuddin on socialist education; during Chen Boda''s speech Mao: our Party has at least two factions, a socialist and a capitalist; during Dong Biwu''s: in Peking, "I don''t mean the Peking committee," there are two independent kingdoms, "你们去猜"); [[w.dikotter-cultural-revolution]], 25 n.35 (two factions, a socialist and a capitalist; "In Beijing, and I don''t mean the Beijing party committee, there are two independent kingdoms"); [[w.pu-weihua-zalan-jiu-shijie]], 6 (December 1964, no day: two "independent kingdoms" in Peking, the Secretariat under Deng Xiaoping and the State Planning Commission under Li Fuchun); [[w.zhu-de-nianpu-xinbian]], III, 1925 (Dec. 27, 1964; Zhu De 朱德 attends the Central Work Conference 中央工作会议); [[w.teiwes-tragedy-of-lin-biao]], 203 (the two "independent kingdoms in Beijing," Deng''s Secretariat and Li Fuchun''s Planning Commission); [[w.peng-zhen-nianpu-1902]], IV, 381–382. Made public: 1996. Check: MacFarquhar (13) does not date the rescinding, nor name the directive. Check: the number of the directive of Dec. 31; the book has No. 814, the Wengao No. 815 (III, 425 n.142). Check: units F–G, the issue of Dec. 28 and the General Office''s notice of Dec. 31 (XVII, 485 n.1), are acts of other days. See [[cal.1964-12-15.china-leadership]]. To check: the document "Some Problems Now Raised in the Rural Socialist Education Movement" (Central Committee [64] 811, stopped Dec. 31, 1964; named by [[w.zedong-mao-zedong-nianpu]], V, Dec. 15, 1964); [[w.tse-tung-miscellany-of-mao-tse]], 2, 427 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.134a); [[w.jin-1949-1989-niande-zhongguo]], 603 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.134b); the seventeen articles, the work conference''s minutes of Dec. 27, 1964, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 280, 283–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.135b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1128 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.139); the Center''s directive No. 814 of Dec. 31, 1964, cancelling No. 811, in [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1131–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 425 n.142c); Central Committee, Zhongfa [64] 811, Dec. 28, 1964, issuing the minutes (seventeen points) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 485 n.1b); Central Committee General Office, notice of Dec. 31, 1964 stopping the issue of Zhongfa [64] 811, to be destroyed (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 485 n.1c); [[w.xianzhi-mao-zedong-zhuan-1949]], 1373 (cited by [[w.dikotter-cultural-revolution]], 25 n.35); [[w.zhongguo-gongchandang-lishi-dashiji]], 269 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 6 n.12). Names: Mao Zedong, Chen Boda, Zhu De, Dong Biwu, Lu Dingyi, Saifuddin, Peng Zhen.'
