    when: Dec. 3
    date: '1964-12-03'
    thread: states-and-cities
    c: New York. J. Raymond Jones, a Harlem district leader, elected leader of the New York County Democrats, Tammany, the first Negro to hold it (Check).
    n: '[Wikipedia, "J. Raymond Jones"](https://en.wikipedia.org/wiki/J._Raymond_Jones). To check: [[w.walter-harlem-fox]]. See [[cal.1961-01.states-and-cities-nyc]]. Names: J. Raymond Jones.'
