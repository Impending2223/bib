        - 'via w.zelizer-taxing-america 231 n.79b: all'
        - 'via w.zelizer-taxing-america 231 n.79c: all'
    tags: [name:mills-wilbur-d]
  - id: cal.1964-12-03.civil-rights-bill
    when: Dec. 3–4
    date: '1964-12-03'
    thread: civil-rights-bill
    also: [civil-rights-the-executive]
    c: 'Johnson approves the first regulations under Title VI: no discrimination by race, color, or national origin in programs aided by Interior, Agriculture, Labor, HEW, the Housing and Home Finance Agency, GSA, and the Science Foundation. Published Dec. 4; the other agencies to follow.'
    n: 'Statement by the President Upon Approving Civil Rights Regulations Covering the Programs of Federal Departments and Agencies, [1963–64 Pub. Papers 1638](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=878) (Dec. 4, 1964). [29 Fed. Reg. 16273](https://www.govinfo.gov/app/details/FR-1964-12-04). To check: [[w.graham-civil-rights-era]]. See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-12-03.states-and-cities-nyc
    when: Dec. 3
    date: '1964-12-03'
    thread: states-and-cities
    c: New York. J. Raymond Jones, a Harlem district leader, elected leader of the New York County Democrats, Tammany, the first Negro to hold it (Check).
    n: '[Wikipedia, "J. Raymond Jones"](https://en.wikipedia.org/wiki/J._Raymond_Jones). To check: [[w.walter-harlem-fox]]. See [[cal.1961-01.states-and-cities-nyc]]. Names: J. Raymond Jones.'
    tags: [state:ny, city:nyc, name:jones-j-raymond]
  - id: cal.1964-12-03.farm
    when: Dec. 3
    date: '1964-12-03'
    thread: farm
    also: [mississippi]
    c: The community elections of the Agricultural Stabilization and Conservation Service, which choose the county committees that add to farmers' cotton allotments. COFO runs Negro farmers in twelve Mississippi counties; its poll watchers put out, Negro voters harassed, CORE workers beaten and arrested in Madison County. Five Negroes lead in their communities; none reaches a county committee.
    n: '[[w.dittmer-local-people]], 333–35 (the elections; no county committee). Freeman''s order of new elections in several communities, and the Negro farmers'' boycott of them: Dittmer, 334–35. To check: COFO News, "The Cotton Vote in Mississippi," Dec. 11, 1964, Hillegas Collection (cited by [[w.dittmer-local-people]], 334 n.43).'
    src:
      c: 03ef5582
      rows:
        - 'w.dittmer-local-people 333–35: A, E'
        - 'via w.dittmer-local-people 334 n.43: A, E'
    tags: [state:ms]
  - id: cal.1964-12-03.vietnam-congress
    when: Dec. 3
    date: '1964-12-03'
    thread: vietnam-congress
    c: 'Taylor before Foreign Relations in executive session: action against the North needed at some point, no disagreement "in the councils I have attended," but not with Saigon so weak. Fulbright would not back an attack on the North just because the government fell.'
    n: '[[w.gibbons-u-s-government-and]], II, 376–77. To check: the executive session transcript, Dec. 3, 1964 (cited by [[w.gibbons-u-s-government-and]], II, 376 n.101). See [[cal.1964-12-01.vietnam]]. Names: Taylor, Fulbright.'
    src:
      c: 6e78f5c8
      rows:
        - 'w.gibbons-u-s-government-and II, 376–77: all'
        - 'via w.gibbons-u-s-government-and II, 376 n.101: all'
    tags: [name:taylor-maxwell, name:fulbright-j-william]
  - id: cal.1964-12-04.mississippi
    when: Dec. 4
    date: '1964-12-04'
    thread: mississippi
    c: 'The FBI arrests 19 men, Sheriff Rainey and Deputy Price of Neshoba County among them, for conspiracy against the rights of Chaney, Goodman, and Schwerner. Dec. 10, the U.S. commissioner at Meridian dismisses the charges: the confession they rest on hearsay. A federal grand jury indicts 18, Jan. 15, 1965. Check the count and the date.'
    n: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966) (K–J Adm. II.H.1). See [[cal.1964-06-21.mississippi]]. Names: Rainey, Price, Chaney, Goodman, Schwerner.'
    src:
      c: 3f178c4e
      rows:
        - 'https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf: all'
    tags: [name:rainey-lawrence-a, name:price-cecil-r, name:chaney-james-e, name:goodman-andrew, name:schwerner-michael]
  - id: cal.1964-12-04.congress
    when: Dec. 4
    date: '1964-12-04'
    thread: congress
    also: [mississippi]
    c: 'The Freedom Democrats'' contests, under the contested-elections statute: Hamer serves notice on Whitten (2d), Annie Devine on Prentiss Walker (4th), Victoria Gray on Colmer (5th). Their grounds: Negroes kept from the vote and from the ballot. A resolution to come Jan. 4, that none of the five Mississippians be sworn until the contests are decided.'
    n: 'SNCC, [Fact Sheet on the Congressional Challenge](https://www.crmvet.org/docs/641200_sncc_congchall_fact.pdf) (Dec. 1964). 2 U.S.C. §§ 201–226 (1964). [[w.dittmer-local-people]], 338. To check: [[w.payne-ive-got-the-light]]; [[w.mills-this-little-light-of]]. See [[cal.1964-08-25.mississippi]]. Names: Hamer, Devine, Victoria Gray, Whitten, Colmer, Walker.'
    src:
      c: 3dc57334
      rows:
        - 'https://www.crmvet.org/docs/641200_sncc_congchall_fact.pdf: all'
        - 'w.dittmer-local-people 338: A-B'
    tags: [name:hamer-fannie-lou, name:whitten-jamie-l, name:devine-annie, name:walker-prentiss-l, name:gray-victoria-jackson, name:colmer-william-m]
  - id: cal.1964-12-04.legislatures-mn
    when: Dec. 4
    date: '1964-12-04'
    thread: legislatures
    c: Minnesota. A three-judge federal court, Circuit Judge Blackmun writing, holds the legislative districts of 1959 unconstitutional, on a suit of voters of the four Twin Cities counties; the 1965 legislature to reapportion.
    n: '*Honsey v. Donovan*, [236 F. Supp. 8](https://static.case.law/f-supp/236/case-pdfs/0008-01.pdf) (D. Minn. 1964). Paul Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993), *MNopedia*. To check: [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Blackmun.'
    tags: [state:mn, name:blackmun-harry-a]
  - id: cal.1964-12-04.elections-1964-us
    when: Dec. 4–5
    date: '1964-12-04'
    thread: elections-1964
    also: [states-and-cities, republican-party]
    c: 'Republican governors and governors-elect at Denver. Smylie, chairman of their association, opens: "We are a defeated party with a defeated leadership." A statement on the party''s leadership, for "a policy of inclusion"; Rockefeller, Romney and Scranton say Burch should be replaced; Smylie presses hardest for a declaration. Morton and Bob Wilson, the campaign committees'' chairmen, counsel against removing Burch; Nixon, by telephone to governors there, the same. Check. Percy: repudiate those who "waved our party banner in 1964 only as a means to promote hate and bigotry." Gavin of North Carolina: "never again" the Southern strategy.'
    n: '*Michigan Daily*, Dec. 9, 1964 (AP) (Check against the press). [[w.hess-republican-establishment]], 1, 40–41, 221, 340 (Smylie''s words; the statement''s words; Rockefeller, Romney and Scranton; Morton, Wilson and Nixon; Percy; Gavin). To check: [[w.sparacino-democratic-and-republican-governors]]; [[w.kabaservice-rule-and-ruin]]. See [[cal.1964-11-03.elections-1964-2]]. Names: Rockefeller, Romney, Scranton, Burch, Smylie, Morton, Wilson, Nixon, Percy, Gavin.'
    src:
      c: c8c7d70c
      rows:
        - '"*Michigan Daily*": A, C-E'
        - 'w.hess-republican-establishment 1: A-B'
        - 'w.hess-republican-establishment 40–41: A, C-D, F-G'
        - 'w.hess-republican-establishment 221: I'
        - 'w.hess-republican-establishment 340: J'
    tags: [name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:burch-dean, name:smylie-robert-e, name:morton-thruston-b, name:wilson-bob, name:nixon-richard-m, name:percy-charles-h, name:gavin-robert-l]
  - id: cal.1964-12-06.opinion
    when: Dec. 6
    date: '1964-12-06'
    thread: opinion
    c: 'Gallup, Nov. 6–11: the policy Johnson should follow: more to the left, with labor and liberal groups, 23 percent; more to the right, with business and conservative groups, 19; the middle, 44. The policy he will follow: left 35, right 11, middle 33.'
    n: '[[w.gallup-poll]], III, 1910. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-12-07.europe-and-the-alliance
    when: Dec. 7–9
    date: '1964-12-07'
    thread: europe-and-the-alliance
    c: 'Wilson in Washington, with Gordon Walker and Healey. The British propose an Atlantic Nuclear Force in place of the MLF: their strategic bombers, less some, and four Polaris submarines; mixed manning to be tried. No decision. Dec. 17, NSAM 322: no American official to press for a binding agreement; no agreement against France.'
    n: 'Joint Statement Following Discussions With the Prime Minister of Great Britain, [1963–64 Pub. Papers 1649](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=889) (Dec. 8, 1964). FRUS 1964–68, XIII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v13/d58), [59](https://history.state.gov/historicaldocuments/frus1964-68v13/d59), [61](https://history.state.gov/historicaldocuments/frus1964-68v13/d61); doc. [62](https://history.state.gov/historicaldocuments/frus1964-68v13/d62) (Bundy to Bruce, Dec. 9: discussion, not decision); [NSAM No. 322](https://history.state.gov/historicaldocuments/frus1964-68v13/d65) (Dec. 17, 1964). [[w.poole-joint-chiefs-of-staff]], 206–207 (the visit; no decision; NSAM 322); [[w.schwartz-lyndon-johnson-and-europe]], 43–45, 69 (the talks; the Atlantic Nuclear Force). To check: [[w.priest-kennedy-johnson-and-nato]]; "Wilson Visit and the MLF," memorandum of conversation, Dec. 6, 1964, Neustadt Papers, LBJ Library; note for the record, Dec. 7, 1964, PREM 13/103, and record of meeting, Dec. 7, 1964, PREM 13/252, Public Record Office (cited by [[w.schwartz-lyndon-johnson-and-europe]], 44–45 nn.157, 159; 69 n.96); Bruce diary, Dec. 6, 1964, and Bundy to Johnson, Dec. 6, 1964, FRUS 1964–68, XIII, docs. [56](https://history.state.gov/historicaldocuments/frus1964-68v13/d56), [57](https://history.state.gov/historicaldocuments/frus1964-68v13/d57) (cited by [[w.schwartz-lyndon-johnson-and-europe]], 44 n.156). See [[cal.1963-01-24.europe-and-the-alliance]]. See [[cal.1964-06-12.europe-and-the-alliance]]. Names: Wilson, Gordon Walker, Healey, Johnson.'
