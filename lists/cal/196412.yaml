  - id: cal.1964-12-04.mississippi
    when: Dec. 4
    date: '1964-12-04'
    thread: mississippi
    c: 'The FBI arrests 19 men, Sheriff Rainey and Deputy Price of Neshoba County among them, for conspiracy against the rights of Chaney, Goodman, and Schwerner. Dec. 10, the U.S. commissioner at Meridian dismisses the charges: the confession they rest on hearsay. A federal grand jury indicts 18, Jan. 15, 1965. Check the count and the date.'
    n: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966) (K–J Adm. II.H.1). See [[cal.1964-06-21.mississippi]]. Names: Rainey, Price, Chaney, Goodman, Schwerner.'
