    c: 'Mao presides over an enlarged Politburo Standing Committee, Hebei Hall, afternoon, on the main contradiction in the countryside;{1} 31 present.{2} Liu: Tao Zhu says it is between the better-off peasant stratum and the poor and lower-middle peasants.{3} Mao: the landlords and rich peasants are the backstage bosses, the cadres of the four uncleans the men in power;{4} the center is these brigade and team cadres;{5} mobilize the masses to rectify the Party, the branch, the commune committee;{6} do not say "stratum"; landlords and rich peasants not above 7 or 8 percent of households, about 10 percent of people;{7} "a leftist tide" feared if 20 percent.{8} Liu declines to chair and speaks first. Mao: 20 percent of 700 million would be 140 million. Deng: the target in the end a few percent. Liu: the main contradiction is between the four cleans and the four uncleans; Tao Zhu agrees; Mao: "not subject to man''s will."{9} By Wang Guangmei''s and Liu Yuan''s account, Liu asks who in the Coal or Metallurgy ministry is a capitalist roader in power; Mao: "Zhang Linzhi is!"{10} Bo Yibo: rectify the department''s Party group, the factory''s secretary and director first; Li Xiannian: else the poor and lower-middle peasants are rectified in the end.{11} Peng Zhen attends.{12}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 20, 1964. [[w.zhou-enlai-nianpu-1949]], II, 695 (Dec. 20, 1964: Zhou attends the enlarged Politburo Standing Committee, which discusses rural socialist education, the chief contradiction in the countryside, the content of the "four cleanups", the nature of the "four uncleans", the proportion to strike; until early January 1965 he attends the enlarged Standing Committee''s meetings more than once, on drafts on the movement); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 610 (Dec. 20, 1964; Liu attends the enlarged meeting of the Politburo Standing Committee, which takes up further the problems raised in the movement across the country); [[w.macfarquhar-origins-of-the-cultural]], III, 419–22 (the discussion of Dec. 20, perhaps a Standing Committee meeting: Liu arrives after Mao and is told to speak first; the main contradiction; Mao''s 20 percent, some 140 million, and a ceiling of 10 percent of families labeled; going easy on embezzlers; the Party members among the unclean cadres; Bo Yibo and Li Xiannian: strike the power holders first); [[w.deng-xiaoping-nianpu-1904]], III, 1840 (Dec. 20, 1964; afternoon, 下午; Deng at the enlarged Politburo Standing Committee meeting Mao presides over, chiefly on the main contradiction in the countryside at present); [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 20, afternoon, the Hebei Hall of the Great Hall: the enlarged Standing Committee; Mao asks Liu to chair, Liu declines and speaks first; Liu raises Tao Zhu''s "stratum"; Mao: the landlords and rich peasants are the backstage bosses, the cadres of the four uncleans the holders of power; the center the brigade and team cadres; the Party to be rectified; no "stratum"; households not above 7–8 percent, persons not above 10 (n.35)). [[w.yang-jisheng-mubei]], II, 1144–1145 n.67 (Liu: the main contradiction is between the four cleans and the four uncleans, the nature of it the people''s and the enemy''s interwoven; Mao: the landlords and rich peasants are the backstage bosses, the four-unclean cadres the men in power, the urgent thing the cadres, to rouse the masses to rectify the Party; Liu: each contradiction is to be met by its facts, not all raised to the enemy''s; Mao: this is a socialist education movement, not a "four cleans, four uncleans" movement, the point being to rectify the Party''s men in power taking the capitalist road; Liu asks which ministry''s head is such a one, coal or metallurgy; Mao: Zhang Linzhi 張霖之 is; the book takes the scene from Wang Guangmei''s and Liu Yuan''s book); [[w.yang-jisheng-tiandi-fanfu]], I, 89–90 (the Hebei Hall, afternoon; Liu: the main contradiction between the four cleans and the four uncleans, contradictions among the people and with the enemy interlocked; Mao: the four-unclean cadres are the power-holders; "Zhang Linzhi is one!"; Mao''s "shoot the horse first"); [[w.peng-zhen-nianpu-1902]], IV, 380 (Dec. 20, 1964, afternoon; Peng Zhen at Mao''s enlarged Standing Committee on the chief contradiction in the villages); [[w.jian-zhou-enlai]], 518 (at "another meeting of top leaders in late December," Liu asks whether the essence of the contradictions is a mixture of those among the people and those between us and the enemy; Mao: "anticapitalist in essence"; the day not given, the note citing the Mao chronology, V, 452–453); [[w.mao-zedong-zhuan]], VI, ch. 73 at n.35. [[w.yang-jisheng-tiandi-fanfu]], I, 89; [[w.mao-zedong-zhuan]], VI, ch. 73 at n.35 (a minister named, not by name). [[w.macfarquhar-origins-of-the-cultural]], III, 421; [[w.peng-zhen-nianpu-1902]], IV, 380. Made public: 1996. To check: [[w.zhonghua-renmin-gongheguo-fengyun]], 1, 962 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.107); [[w.tse-tung-miscellany-of-mao-tse]], 2, 409 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.108a); [[w.mao-zedong-xuexi-wenxuan]], 3, 58 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.108b); [[w.mao-zedong-sixiang-wan-1969]], 578–96 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.109a); the discussion of Dec. 20, 1964, on the socialist education movement, in [[w.mao-zedong-sixiang-wan-1969]], 578–96 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.109d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1128 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.110); [[w.huaxuan-zhongguo-gongchan-dang-huiyi]], 509 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.111a); [[w.quanxing-mao-zedong-wanniande-lilun]], 308 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 419 n.111c); Enlarged Politburo Standing Committee 中共中央政治局常委扩大会议, record 记录, Dec. 20, 1964 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.35); Wang Guangmei 王光美, Liu Yuan 劉源 et al., *Ni suo bu zhidao de Liu Shaoqi* 《你所不知道的劉少奇》 (Henan renmin chubanshe, 2000), 115–118 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 90 n.120); [[w.lin-xiaobo-wenge-de-yuyan]], 171 (cited by [[w.jian-zhou-enlai]], 518 n.2b). Names: Mao Zedong, Liu Shaoqi, Tao Zhu, Deng Xiaoping, Zhang Linzhi, Bo Yibo, Li Xiannian, Peng Zhen.'
