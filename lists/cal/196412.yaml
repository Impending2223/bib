  - id: cal.1964-12-26.china-leadership-2
    when: Dec. 26
    date: '1964-12-26'
    place: peking
    thread: china-models
    also: [china-mao]
    c: 'Peking, the Great Hall of the People.{1} Mao''s seventy-first birthday: a banquet for central and regional leaders, some ministers, scientists, labor models.{2} At Mao''s table the scientists and labor models, Chen Yonggui of Dazhai among them;{3} the Standing Committee at another.{4} Mao: the movement''s formulations not Marxist; "independent kingdoms" at the center; the Party may yet produce revisionism.{5}'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 423–24; [[w.mao-zedong-zhuan]], VI, ch. 73 (Dec. 26 Mao''s 71st birthday: that evening 当晚 he gives a dinner at the Great Hall, Old Peking Room, from his royalties, the guests chosen by him; he asks the labor model Chen Yonggui, Xing Yanzi, Dong Jiageng; Bo Yibo''s account of the seating (n.36, n.37)). The book reads the formulations as Liu''s and the kingdoms as Deng''s Secretariat and Li Fuchun''s Planning Commission (III, 423). [[w.yang-jisheng-mubei]], II, 1145–1146 n.68 (a few tables paid for from his royalties; the dinner, the children not invited as they have done no work for the revolution; Mao criticizes the formulations of the socialist education movement, "four cleans, four uncleans, the crossing of contradictions in and outside the Party," as not Marxist, charges some central organs with "independent kingdoms," and speaks of the danger of revisionism in the Party); [[w.yang-jisheng-tiandi-fanfu]], I, 90 (Hall 118, at his own expense; Mao stern: some "cock their tails"; "I have not squatted at a point and have no right to speak, yet I will speak"; the "four cleans and four uncleans" non-Marxist; an "independent kingdom" in the Center); [[w.jian-zhou-enlai]], 519 (Jiang Qing arranges the banquet on Mao''s behalf, on his list of three dozen; Qian Xuesheng, Chen Yonggui, Dong Jiageng and Xing Yanzi at Mao''s table, Liu, Deng and Zhou at the other two; Mao: "We should not just eat but should also talk"; the contradictions inside and outside the Party "not Marxism"; "the danger of revisionism emerging within the party," and "dead silence"); [[w.dikotter-cultural-revolution]], 25 n.34 (Mao harps on revisionism and attacks "independent kingdoms" at the center; the atmosphere glacial); [[w.dikotter-cultural-revolution]], 219 (on Mao''s birthday Chen Yonggui invited to share a meal with Mao in Peking, where the slogan "In Agriculture, Learn from Dazhai" is launched). Made public: 1993. To check: [[w.zhisui-private-life-of-chairman]] (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.130a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1131 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131a); [[w.yao-san-ci-danan-buside]], 235–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 423 n.131b); [[w.qitai-dazhai-hongqide-shengqi-yu]], 35–69 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 424 n.133a); Mao Zedong 毛泽东, talk with Xing Yanzi 邢燕子, Dong Jiageng 董加耕, Chen Yonggui 陈永贵 and others, Dec. 26, 1964 (key points 谈话要点) (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.36); [[w.yibo-ruogan-zhongda-juece-yu-1997]], II, 1166–1167 (cited by [[w.mao-zedong-zhuan]], VI, ch. 73 n.37); [[w.zeng-zhi-yige-geming-de-yingcunzhe]], 433 (cited by [[w.jian-zhou-enlai]], 519 n.3); [[w.xianzhi-mao-zedong-zhuan-1949]], 1371–1372 (cited by [[w.jian-zhou-enlai]], 519 n.4a); [[w.zedong-mao-zedong-nianpu]], V, 456 (cited by [[w.jian-zhou-enlai]], 519 n.4b). Names: Mao Zedong, Chen Yonggui. Check: the guests at Mao''s table; Huang Yao adds Peng Zhen, Luo Ruiqing, Yu Qiuli and Zeng Zhi (III, 423 n.131).'
