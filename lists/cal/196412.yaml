  - id: cal.1964-12-09.health
    when: Dec. 9
    date: '1964-12-09'
    thread: health
    c: 'The Commission on Heart Disease, Cancer and Stroke reports, DeBakey chairman: a national program against the three diseases, seven deaths in ten, through regional centers of research, teaching, and care.'
    n: 'Remarks Upon Receiving Report of the President''s Commission on Heart Disease, Cancer and Stroke, [1963–64 Pub. Papers 1650](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=890) (Dec. 9, 1964). To check: [[w.disease-national-program-to-conquer]]. Names: DeBakey, Johnson.'
