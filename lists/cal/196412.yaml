  - id: cal.1964-12-03.farm
    when: Dec. 3
    date: '1964-12-03'
    thread: farm
    also: [mississippi]
    c: The community elections of the Agricultural Stabilization and Conservation Service, which choose the county committees that add to farmers' cotton allotments. COFO runs Negro farmers in twelve Mississippi counties; its poll watchers put out, Negro voters harassed, CORE workers beaten and arrested in Madison County. Five Negroes lead in their communities; none reaches a county committee.
    n: '[[w.dittmer-local-people]], 333–35 (the elections; no county committee). Freeman''s order of new elections in several communities, and the Negro farmers'' boycott of them: Dittmer, 334–35. To check: COFO News, "The Cotton Vote in Mississippi," Dec. 11, 1964, Hillegas Collection (cited by [[w.dittmer-local-people]], 334 n.43).'
    src:
      c: 03ef5582
      rows:
        - 'w.dittmer-local-people 333–35: A, E'
        - 'via w.dittmer-local-people 334 n.43: A, E'
    tags: [state:ms]
  - id: cal.1964-12-03.vietnam-congress
    when: Dec. 3
    date: '1964-12-03'
    thread: vietnam-congress
    c: 'Taylor before Foreign Relations in executive session: action against the North needed at some point, no disagreement "in the councils I have attended," but not with Saigon so weak. Fulbright would not back an attack on the North just because the government fell. Hickenlooper: "we are going down the same road the French did." Church on the "growing speculation that we are about to underwrite attacks on North Vietnam." Fulbright: "This is a hell of a problem. I don''t think it is worth a war."'
    n: '[[w.gibbons-u-s-government-and]], II, 376–77. [[w.mann-grand-delusion]], 382–83. To check: the executive session transcript, Dec. 3, 1964 (cited by [[w.gibbons-u-s-government-and]], II, 376 n.101). See [[cal.1964-12-01.vietnam]]. Names: Taylor, Fulbright, Hickenlooper, Church.'
    src:
      c: f3dffa92
      rows:
