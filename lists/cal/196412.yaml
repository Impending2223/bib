  - id: cal.1964-12-24.vietnam
    when: Dec. 24
    date: '1964-12-24'
    time: 1964-12-24T10:00Z
    place: saigon
    thread: vietnam-operations
    c: 'A bomb in the Brink Hotel, an American officers'' quarters in Saigon, 6 p.m.: 2 killed, 50 hurt.{1} Taylor asks a reprisal;{2} refused.{3} Johnson to Taylor, Dec. 30: "I have never felt that this war will be won from the air";{4} more Rangers, Special Forces, and Marines instead.{5}'
    n: 'FRUS 1964–68, I, doc. [465](https://history.state.gov/historicaldocuments/frus1964-68v01/d465) (the cable on Hương and Taylor; for the bomb only, its n. 5: 6 p.m., 2 killed, 50 injured); doc. [477](https://history.state.gov/historicaldocuments/frus1964-68v01/d477) (Johnson to Taylor, CAP 64375, Dec. 30); docs. [468](https://history.state.gov/historicaldocuments/frus1964-68v01/d468), [472](https://history.state.gov/historicaldocuments/frus1964-68v01/d472) (Taylor, Dec. 25 and 28); [475](https://history.state.gov/historicaldocuments/frus1964-68v01/d475) (the refusal, Dec. 29). [[w.gibbons-u-s-government-and]], II, 382–83, III, 25 (two killed, 38 Americans and 13 Vietnamese hurt; the reprisal urged and refused; Johnson''s message of Dec. 30); [[w.vietnam-victory-in-vietnam]], 136 (the Brink Hotel among the sappers'' targets); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 528–29; [[w.cosmas-joint-chiefs-of-staff-2012]], 195–98; [[w.macv-command-history-1964]], 20, 106 (the bombing, Dec. 24); [[w.westmoreland-soldier-reports]], 89, 113 (the bomb; Taylor and Westmoreland for a reprisal; Washington''s refusal; Johnson''s cable to Taylor, for Rangers and Special Forces rather than bombing); [[w.rusk-as-i-saw-it-1990]], 447 (Rusk against retaliation); [[w.mcnamara-in-retrospect]], ch. 6 at n.20 (CAP 64375: "Every time I get a military recommendation it calls for large-scale bombing"; "appropriate military strength on the ground"). [[w.ball-past-has-another-pattern]], 392 (the bomb; Johnson''s reluctance at Christmas); [[w.taylor-swords-and-plowshares]], 332–33 (the Brink bombing; Taylor''s cable for a strike; Washington''s refusal, the dependents; American ground forces suggested); [[w.logevall-choosing-war]], 293–94 (the bomb at the Brinks officers'' billet on Christmas Eve, two killed, fifty injured; Taylor''s recommendation of a reprisal rejected; not the hour); [[w.logevall-choosing-war]], 298–99 (Johnson''s memorandum to Taylor, drafted at the Ranch and dated Dec. 30: "I have never felt that this war will be won from the air"; a larger use of Rangers, Special Forces and Marines); [[w.macv-command-history-1964]], 193 (the chronology dates it Dec. 25: "Brink BOQ bombed; 2 (US) killed, 108 (US and VN) wounded"; not the hour, Taylor or the reprisal); [[w.albert-little-giant-1990]], 297 ("At Christmas" a Saigon hotel housing military and civilian personnel bombed, "killing several"; not the hotel''s name, the hour, the count, Taylor or the reply); [[w.lich-su-khang-chien-chong-my]], III, 382–83 (the charge, 100 kilograms in a Nash car, driven in by Nguyễn Thanh Xuân, as a Saigon major, and Nguyễn Hóa). Check: Westmoreland gives two killed, a Navy officer and a civilian, and more than a hundred wounded, sixty-six of them Americans (89). See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-20.vietnam]]. Check: the hurt. Taylor (doc. 468) gives two dead among some 66 casualties; Cosmas, 195, 63 American servicemen and civilians injured, with an Australian officer and 43 Vietnamese. Names: Taylor, Johnson. Check: Kaplan gives 2 Americans killed and 66 Americans and Vietnamese wounded (528). Check: the History''s chronology, 193, dates it Dec. 25: 2 Americans killed, 108 Americans and Vietnamese wounded. Check: Ball (392) gives two killed, fifty-eight wounded.'
