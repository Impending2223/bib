  - id: cal.1964-12-04.legislatures-mn
    when: Dec. 4
    date: '1964-12-04'
    thread: legislatures
    c: Minnesota. A three-judge federal court, Circuit Judge Blackmun writing, holds the legislative districts of 1959 unconstitutional, on a suit of voters of the four Twin Cities counties; the 1965 legislature to reapportion.
    n: '*Honsey v. Donovan*, [236 F. Supp. 8](https://static.case.law/f-supp/236/case-pdfs/0008-01.pdf) (D. Minn. 1964). Paul Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993), *MNopedia*. To check: [[w.dixon-democratic-representation]]. See [[cal.1964-06-15.court]]. Names: Blackmun.'
    tags: [state:mn, name:blackmun-harry-a]
  - id: cal.1964-12-04.elections-1964-us
    when: Dec. 4–5
    date: '1964-12-04'
    thread: elections-1964
    also: [states-and-cities, republican-party]
    c: 'Republican governors and governors-elect at Denver. Smylie, chairman of their association, opens: "We are a defeated party with a defeated leadership." A statement on the party''s leadership, for "a policy of inclusion"; Rockefeller, Romney and Scranton say Burch should be replaced; Smylie presses hardest for a declaration. Morton and Bob Wilson, the campaign committees'' chairmen, counsel against removing Burch; Nixon, by telephone to governors there, the same. Check. Percy: repudiate those who "waved our party banner in 1964 only as a means to promote hate and bigotry." Gavin of North Carolina: "never again" the Southern strategy.'
    n: '*Michigan Daily*, Dec. 9, 1964 (AP) (Check against the press). [[w.hess-republican-establishment]], 1, 40–41, 221, 340 (Smylie''s words; the statement''s words; Rockefeller, Romney and Scranton; Morton, Wilson and Nixon; Percy; Gavin). [[w.kabaservice-rule-and-ruin]], 129 (the meeting at Denver; the statement, against "any narrow, exclusive political clique," implying Burch should go). To check: [[w.sparacino-democratic-and-republican-governors]]; Proposals by the Republican Governors Association, Dec. 3–5, 1964, William W. Scranton Papers, Pennsylvania State Archives, II-74:17 (cited by [[w.kabaservice-rule-and-ruin]], 129 n.34). See [[cal.1964-11-03.elections-1964-2]]. Names: Rockefeller, Romney, Scranton, Burch, Smylie, Morton, Wilson, Nixon, Percy, Gavin.'
    src:
