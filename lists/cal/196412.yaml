    c: 'Deng Xiaoping 邓小平 reads the report Zheng Tianxiang 郑天翔 and Jia Tingsan 贾庭三 forward through Peng Zhen 彭真, on the pilot work of the urban socialist education movement in Peking 北京.{1} Peng Zhen revises it and sends it to Mao, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德, Deng Xiaoping and others, with a note: Zheng and Jia squatted three months at two factories and know five more; the seven, thought first-class, all in a serious state; the report "well worth reading." The report: perhaps more than a third of the leadership of Peking''s main industrial, transport and building enterprises not in our hands; in last year''s five-antis the revolutionary forces overrated, the enemy underrated, a right error.{2}'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1839–1840 (Dec. 18, 1964); [[w.peng-zhen-nianpu-1902]], IV, 379–380 (Dec. 18, 1964; Peng Zhen revises and sends Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and others Zheng Tianxiang''s and Jia Tingsan''s report on the trials of urban socialist education in Peking, from three months at two factories and ties with five more: "这七个厂原来都被认为是一类厂，现在一摸，情况都很严重"; "这份报告很值得看"; the report: not a third but perhaps more of the main industrial, transport and building enterprises'' leadership not in our hands; in last year''s "five antis" we overrated the revolutionary forces, underrated the enemy, a right error); [[w.peng-zhen-nianpu-1902]], IV, 379–380. The words: 阅 (III, 1839–1840). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Peng Zhen, Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De.'
