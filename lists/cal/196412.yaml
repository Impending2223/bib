    follows:
      - cal.1964-12-20.vietnam
    c: 'Saigon, the embassy, 12:09 to 1:25 p.m. Taylor, with U. Alexis Johnson and Generals Throckmorton, Moore and Rowland, reproves Kỳ, Thiệu, Thi and Cang for the arrests and the dissolution of the High National Council: the Americans "tired of coups."'
    n: 'Taylor to the Department, Saigon, Dec. 20, 5 p.m., [FRUS 1964–68, I, doc. 451](https://history.state.gov/historicaldocuments/frus1964-68v01/d451) ("Immediately upon our return from seeing Huong," the meeting with Kỳ, Thiệu, Thi and Cang, Generals Throckmorton, Moore and Rowland with them; "very forcefully expressed my disappointment"; n.4, the meeting "from 12:09 to 1:25"). [[w.gibbons-u-s-government-and]], II, 381–82 (Taylor, with U. Alexis Johnson, calls the "Young Turks" together; the mission''s record of the opening: "we Americans were tired of coups"); [[w.branch-pillar-of-fire]], 545 ("I told you all clearly at General Westmoreland''s dinner that we Americans were tired of coups"); [[w.westmoreland-soldier-reports]], 94 (Taylor and Alexis Johnson to Thiệu, Thi, Kỳ and Cang: "Do you understand English?"); [[w.taylor-swords-and-plowshares]], 329–30 (Thiệu, Kỳ, Thi and Cang sent to Taylor and Johnson; his "rude tirade," as they later called it); [[w.logevall-choosing-war]], 293 (Taylor hauls four of the generals into the embassy: "Now you have made a real mess"); [[w.mcnamara-in-retrospect]], ch. 6 at nn.18–19 ("You people have broken a lot of dishes, and now we have to see how we can straighten out this mess"). To check: [[w.pentagon-papers]], II, 345–48 (cited by [[w.branch-pillar-of-fire]], 545); Saigon to State, the meeting with the generals, [[w.pentagon-papers]], II, 346 (cited by [[w.gibbons-u-s-government-and]], II, 381 n.106). The order: after [[cal.1964-12-20.vietnam]], the action of the night (doc. 451: the generals had told Hương at 2 a.m.). See [[cal.1964-12-20.vietnam]]. Names: Taylor, U. Alexis Johnson, Throckmorton, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Nguyễn Chánh Thi.'
    tags: [name:taylor-maxwell, name:johnson-u-alexis, name:throckmorton-john-l, name:nguyen-cao-ky, name:nguyen-van-thieu, name:nguyen-chanh-thi, place:saigon]
    time_range:
      - 1964-12-20T04:09Z
