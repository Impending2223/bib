    tags: [name:king-martin-luther-jr]
  - id: cal.1964-12-01.laos
    when: Dec. 1–4
    date: '1964-12-01'
    thread: laos
    c: Phou Kout. T-28s on the mountain Dec. 1 and 2; five neutralist battalions take the objective at its base; Dec. 3 they climb the east slope and take a peak near the summit, then stop. Dec. 4 the North Vietnamese and Pathet Lao counterattack and drive them off the peak.
    n: '[[w.anthony-war-in-northern-laos]], 143–44. To check: AmEmb Vientiane to SECSTATE, 828, Dec. 2, 1964 (cited by [[w.anthony-war-in-northern-laos]], 143 n.33a); AmEmb Vientiane to SECSTATE, 835, Dec. 3, 1964 (cited by [[w.anthony-war-in-northern-laos]], 143 n.33b); ARMA Vientiane to DA, 061050Z Dec. 64 (cited by [[w.anthony-war-in-northern-laos]], 143 n.33c). See [[cal.1964-08-18.laos-2]].'
