  - id: cal.1964-12-09.vietnam
    when: Dec. 9
    date: '1964-12-09'
    thread: vietnam
    c: 'Mansfield to Johnson: "further and further out on the sagging limb." No action beyond South Vietnam''s borders; a Saigon government to speak for "peaceful unification." Otherwise years of involvement, to be spelled out to the nation.'
    n: 'Johnson''s reply, Dec. 17: [FRUS 1964–68, I, doc. 449](https://history.state.gov/historicaldocuments/frus1964-68v01/d449). [[w.gibbons-u-s-government-and]], II, 377–79, III, 23. To check: the memorandum, NSF, Name File, Mansfield, LBJ Library, printed in Gareth Porter, ed., *Vietnam: A History in Documents* (1981), II, 333–35 (cited by [[w.gibbons-u-s-government-and]], II, 377 n.102). See [[cal.1964-12-01.vietnam]]. Names: Mansfield, Johnson.'
