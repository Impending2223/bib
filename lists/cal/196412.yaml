  - id: cal.1964-12-02.states-and-cities
    when: Dec. 2–3
    date: '1964-12-02'
    thread: students
    also: [states-and-cities]
    c: Berkeley. Savio on the steps of Sproul Hall; the Free Speech Movement occupies the building. On Brown's order the police arrest nearly 800 in the morning.
    n: 'Savio, Sproul Hall steps, Berkeley (K–J Cong. II.K). See [[cal.1964-10-01.students]]. Names: Savio, Brown.'
    tags: [name:savio-mario, name:brown-edmund-g]
  - id: cal.1964-12-02.medicare
    when: Dec. 2
    date: '1964-12-02'
    thread: medicare
    c: 'Mills, to the Downtown Little Rock Lions Club: he could support a payroll tax for health benefits "just as I have supported a payroll tax for cash benefits."'
    n: '[[w.zelizer-taxing-america]], 231. To check: "Remarks of Congressman Wilbur D. Mills before the Downtown Little Rock Lions Club," Dec. 2, 1964, Mills Papers; Marjorie Hunter, "New Payroll Tax Urged for Hospital Care of Aged," *New York Times*, Jan. 3, 1965; "Mills Says He Could Support Tax For Health Care, Doubts Adequacy," *Arkansas Gazette*, Dec. 3, 1964 (cited by [[w.zelizer-taxing-america]], 231 n.79). See [[cal.1964-09-02.medicare]]. Names: Mills.'
