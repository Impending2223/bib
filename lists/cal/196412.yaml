  - id: cal.1964-12.republican-party-congress-2
    when: Dec.
    date: 1964-12
    thread: republican-party-congress
    c: 'The House Republican Conference meets, at Curtis''s call, Rumsfeld with him, before the session''s end, on what has made the Republicans weak even as an opposition. Halleck unmoved: he was in the House in 1936, when the Republicans were 88. The Young Turks'' revolt against him begins: their man first Laird, whom the Wednesday Group refuses for his work on the platform at San Francisco; then Ford, with Rumsfeld, Curtis and Goodell managing.'
    n: '[[w.kabaservice-rule-and-ruin]], 131–32. Check the day. To check: Rowland Evans and Robert Novak, "The December Caucus," *Washington Post*, Nov. 20, 1964, A17 (cited by [[w.kabaservice-rule-and-ruin]], 131 n.46). See [[cal.1965-01-04.congress-2]]. Names: Curtis, Rumsfeld, Halleck, Laird, Ford, Goodell.'
