    c: 'The Presidium on Khrushchev''s keep, amending its decision of Oct. 22.{1} Brezhnev''s note of his asks: his household staff kept at pay, a larger canteen allowance, no removal from the house until a flat is found.{2} The Presidium''s answer: a pension of 500 rubles, the Kremlin canteen, the Fourth Chief Directorate''s care for him and his wife only, a dacha on the Istra for the one at Semenovskoe, a flat in town, a Volga.{3}'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 62 (№ 9, "Хрущев Н.С. Просит" (Khrushchev asks) and "Хрущеву"), 73–74 nn.124–128 (the editors: the Presidium''s decision of Dec. 15 amends that of Oct. 22; the pension 500 rubles, in old and new money; the dacha on the Istra; the Fourth Chief Directorate for him and his wife). [[w.khrushchev-1964-stenogrammy]], 437–38 (doc. 41, P 181/X; RGANI, f. 3, op. 18, d. 307, ll. 3–4); [[w.khrushchev-1964-stenogrammy]], 470–71 n.98 (the editors'' note). Made public: 2016. Names: Khrushchev, Brezhnev.'
    src:
