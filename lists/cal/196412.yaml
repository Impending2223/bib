    when: Dec. 1
    date: '1964-12-01'
    thread: school-aid
    c: 'Celebrezze to Moyers, forty pages: Keppel''s brief and a draft education message, after talks with the NEA, the NCWC, the ACE, the land-grant association and the AFT. Three courses: general aid for public schools only, which brings "rigorous" Catholic opposition; general aid for public and private schools, a "radical shift of policy"; or aid for poor children in public and private schools through the impacted-areas law: "It is not easy to oppose a combination of the existing impacted areas program and an added program for the poor."'
