        - 'via w.kabaservice-rule-and-ruin 136 n.70: B'
        - 'via w.kabaservice-rule-and-ruin 136 n.71: C-D'
        - 'via w.kabaservice-rule-and-ruin 136 n.72: E-G'
    tags: [name:reagan-ronald, name:lodge-john, name:bush-george-h-w]
  - id: cal.1964-12-01.republican-party
    when: Dec. 1
    date: '1964-12-01'
    thread: republican-party
    also: [states-and-cities]
    c: 'The Ripon Society, "The Republican Governors'' Association: The Case for a Third Force": the governors, free of the conservatives on the National Committee, to take a direct part in the party''s affairs and its legislation. Scranton to Andersen, Nov. 6, had urged it: the governors "the only body in which we have a majority."'
    n: '[[w.kabaservice-rule-and-ruin]], 129. To check: Ripon Society, "The Republican Governors'' Association: The Case for a Third Force," Dec. 1, 1964, Ripon Society Papers, Cornell University, 3:187 (cited by [[w.kabaservice-rule-and-ruin]], 129 n.31); Scranton to Elmer Andersen, Nov. 6, 1964, William W. Scranton Papers, Pennsylvania State Archives, II-74:18 (cited by [[w.kabaservice-rule-and-ruin]], 129 n.30). See [[cal.1964-12-04.elections-1964-us]]. Names: Scranton, Andersen.'
