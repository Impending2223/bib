  - id: cal.1964-12-28.vietnam-operations
    when: Dec. 28
    date: '1964-12-28'
    place: binh-gia
    thread: vietnam-operations
    c: 'Bình Giã, Phước Tuy Province, some thirty miles southeast of Saigon.{1} Two Viet Cong main-force regiments, with local units and guerrillas, seize the Catholic village and stay to fight the troops sent to retake it.{2} In engagements to Jan. 3: a battalion of South Vietnamese marines and one of rangers destroyed;{3} almost 200 government troops and 5 American advisers killed;{4} more than 300 weapons taken; 2 helicopters shot down.{5}'
    n: '[FRUS 1964–68, II, doc. 6](https://history.state.gov/historicaldocuments/frus1964-68v02/d6) (Wheeler''s account to the principals, Jan. 5, 1965). [[w.cosmas-united-states-army-in]], 194; [[w.vietnam-victory-in-vietnam]], 139–41, 461 nn.29–30 (the campaign; the hamlet taken, Dec. 27; the 33d Ranger and 4th Marine Battalions destroyed); [[w.futrell-united-states-air-force]], 260 (the rangers and the marines committed); [[w.moyar-triumph-forsaken]], 337–38; [[w.cosmas-joint-chiefs-of-staff-2012]], 202 (two main-force regiments; the attack of Dec. 27; to Jan. 3 almost 200 government troops and 5 advisers killed, two helicopters down, more than 300 weapons taken); [[w.futrell-united-states-air-force]], 260 (the North Vietnamese regiments'' raid on Bình Giã the night of Dec. 27; A-1s answering requests on the afternoon of Dec. 30; a C-47 and an AC-47 for night illumination); [[w.logevall-choosing-war]], 302–03 (Bình Giã, Phước Tuy, Dec. 28 and after: nearly two hundred killed, with five American advisers); [[w.lich-su-khang-chien-chong-my]], III, 379–86 (the Bình Giã campaign, Dec. 2, 1964–Jan. 3, 1965, of the Eastern Nam Bộ forces: Bà Rịa''s Company 445 against the hamlet the night of Dec. 2; its second phase from the night of Dec. 27). [[w.westmoreland-soldier-reports]], 104 (the two regiments as the Viet Cong''s 9th Division; the ranger and marine battalions virtually destroyed). Check: FRUS''s editors date the battle Dec. 28–Jan. 4 (II, doc. 14, n. 5). Check: *Victory in Vietnam* gives the campaign as Dec. 2–Jan. 3: the 33d Ranger Battalion destroyed Dec. 28, six helicopters shot down; the 4th Marine Battalion Dec. 30–31, an American captain among eight prisoners; in all 1,755 killed, 293 captured, 56 aircraft shot down or damaged (139–41, 461 n.30). Check: Futrell, 260, has two North Vietnamese regiments raid the hamlet the night of Dec. 27, and three helicopters lost to ground fire on the 29th. Check: Westmoreland dates the attack Dec. 27 and its end New Year''s Day (104). Check: Logevall, 302–03, has Bình Giã about forty miles southeast of Saigon, the Vietcong occupying it eight hours after the attack of Dec. 28, four helicopters shot down (three on the 29th, one on the 30th), and a marine battalion ambushed Dec. 31. To check: Saigon 2079, 2080, 2099 to State, 060532Z, 071155Z, 091050Z Jan 65 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 202 n.6).'
