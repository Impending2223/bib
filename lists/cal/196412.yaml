  - id: cal.1964-12-01.conservative-movement
    when: Dec. 1
    date: '1964-12-01'
    thread: conservative-movement
    also: [elections-1964]
    c: '*National Review*''s issue on the election. Meyer: nothing in the campaign showed anything wrong in the conservative position, but conservatives can no longer openly seek to repeal the New Deal. Burnham: the movement "not ready in 1964, in program or in leadership, to run the country"; the candidacy "premature." In its forum Reagan again against the "traitors"; John Davis Lodge against Goldwater''s men "unconciliatory" toward other Republicans; George Bush: "welcome all who want to be Republicans."'
    n: '[[w.kabaservice-rule-and-ruin]], 135–36. To check: Frank S. Meyer, "What Next for Conservatism?," *National Review*, Dec. 1, 1964, 1057 (cited by [[w.kabaservice-rule-and-ruin]], 136 n.70); James Burnham, "Must Conservatives Be Republicans?," *National Review*, Dec. 1, 1964, 1052 (cited by [[w.kabaservice-rule-and-ruin]], 136 n.71); "The Republican Party and the Conservative Movement," *National Review*, Dec. 1, 1964, 1053–55 (cited by [[w.kabaservice-rule-and-ruin]], 136 n.72). Names: Reagan, Lodge, Bush.'
    src:
      c: c301e26d
      rows:
