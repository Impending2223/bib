  - id: cal.1964-12-01.king
    when: Dec. 1
    date: '1964-12-01'
    thread: king
    c: 'King and Hoover meet, 3:30 p.m., Abernathy, Andrew Young and Fauntroy with King, DeLoach with Hoover. Mostly Hoover on the Bureau''s record in the South; nothing of King''s private life. DeLoach: "more or less of a love feast"; Young: "a mutual admiration society."'
    n: '[S. Rep. No. 94-755, Book III, 163–68 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=177) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 365. To check: Howell, "An Interview with Andrew Young," *Christianity and Crisis*, Feb. 16, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]], 365 n.105b). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: Martin Luther King, Hoover, Abernathy, Andrew Young, DeLoach.'
    src:
