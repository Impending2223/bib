    c: 'Liu Shaoqi receives the UAR industrial and economic delegation headed by Aziz Sidqi, Deputy Prime Minister.{1} On China''s foreign aid he says: China is not yet rich, is backward in economy and its capacity to aid is not great; within what it can it helps, and the help is sincere. It must be useful to them and let the aided Asian and African states stand on their own, not make them depend on China; they are to depend neither on China nor on European states and take the road of economic independence.{2}'
