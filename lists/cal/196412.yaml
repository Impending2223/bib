    n: '[[w.logevall-choosing-war]], 280 ("Upon his return from Paris"). To check: Ronald Steel, *Walter Lippmann and the American Century*, 555–56; Lippmann''s column, *Washington Post*, Dec. 22, 1964 (cited by [[w.logevall-choosing-war]], 280 n.50). See [[cal.1964-12.europe-and-the-alliance-france]]. Names: Lippmann, Johnson. Check: the day; Logevall places the Paris talk in mid December and the summons on his return.'
