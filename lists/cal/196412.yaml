  - id: cal.1964-12-01.king
    when: Dec. 1
    date: '1964-12-01'
    time: 1964-12-01T20:30Z
    thread: king
    follows:
      - cal.1964-12-01.civil-rights-the-executive-2
    c: 'King and Hoover meet, 3:30 p.m., Abernathy, Andrew Young and Fauntroy with King, DeLoach with Hoover.{1} Mostly Hoover on the Bureau''s record in the South;{2} nothing of King''s private life.{3} DeLoach: "more or less of a love feast"; Young: "a mutual admiration society."{4}'
    n: '[S. Rep. No. 94-755, Book III, 163–68 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=177) (K–J Adm. II.H.3). [[w.schlesinger-robert-kennedy-and-his]], 365; [[w.kotz-judgment-days]], 232 (Hoover''s office, Dec. 1; King and Abernathy praise the FBI''s work; no word of the accusations); [[w.branch-pillar-of-fire]], 534–35; [[w.bernstein-guns-or-butter]], 217 (King with Abernathy, Andrew Young and Fauntroy, DeLoach beside Hoover; "wholly ceremonial"); [[w.young-easy-burden]], 318–19 (Fauntroy and Young with King and Abernathy; Hoover fifty minutes of the hour on the Bureau; nothing of sex); [[w.garrow-bearing-the-cross]], 362–63. Check: Bernstein, 217, puts the meeting "at the end of November.". After DeLoach''s word to Young, before the meeting: [[cal.1964-12-01.civil-rights-the-executive-2]]. Check: Book III, 166, has Abernathy recall that Hoover "gave King a lecture" as a man of the cloth, and DeLoach that Hoover told King to be careful of "his personal conduct"; Young, there, that neither Hoover''s criticism of King nor the rumors came up. The Committee does not print "a mutual admiration society.". Check: Book III, 166, has Abernathy recall that Hoover "gave King a lecture" that he should "behave himself," and DeLoach''s memorandum calls the meeting "more or less of a love feast"; by DeLoach''s account (164–65) King spoke most, of the FBI''s work and of communism in the movement. To check: Howell, "An Interview with Andrew Young," *Christianity and Crisis*, Feb. 16, 1976 (cited by [[w.schlesinger-robert-kennedy-and-his]], 365 n.105b); [[w.garrow-fbi-and-martin-luther]], 129–30 (cited by [[w.branch-pillar-of-fire]], 534); [[w.deloach-hoovers-fbi]], 208–11 (cited by [[w.branch-pillar-of-fire]], 534); Lewis, King, 256–57 (cited by [[w.branch-pillar-of-fire]], 534); Int; DeLoach to Mohr, Dec. 1 and 2, 1964, FBI file 100-106670-570, 634; Hoover to Johnson, Dec. 2, 1964, FBI file 100-106670-607; [*New York Times*, Dec. 2, 1964](https://timesmachine.nytimes.com/timesmachine/1964/12/02/issue.html), at 1; *Washington Post*, Dec. 2, 1964, at A1 (cited by [[w.garrow-bearing-the-cross]], 363 n.7). Andrew Young, Oct. 26, 1991 (cited by [[w.branch-pillar-of-fire]], 534); Int. Cartha DeLoach, June 1, 1984 (cited by [[w.branch-pillar-of-fire]], 534); Drew Pearson, "Meeting with Hoover Amazes King," *Washington Post*, Dec. 5, 1964 (cited by [[w.branch-pillar-of-fire]], 535). Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: Martin Luther King, Hoover, Abernathy, Andrew Young, DeLoach.'
