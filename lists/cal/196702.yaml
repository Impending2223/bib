lermo-in-his-own-right]], 40–43 (Manac''h, Feb. 1, Dean of the embassy present; the *Newsweek* story; the meeting, 4:34 p.m., an hour and fifteen minutes, Kennedy, Katzenbach, Johnson and Rostow, by the Daily Diary; the leak, by Mankiewicz''s account; Kennedy to the press after). [[w.mann-grand-delusion]], 524–26. To check: [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]; Frank Mankiewicz, oral history interview by L. J. Hackman, Aug. 12, 1969, 6, 70–75, RFK Oral History Program; Peter Edelman, oral history interview by L. J. Hackman, July 15, 1969, 65–70 (cited by [[w.schlesinger-robert-kennedy-and-his]], 769 n.51); Robert Kennedy, memorandum of conversation with Manac''h, Jan. 31, 1967, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 766 n.38); Paris to Washington 11650, Feb. 2, 1967, State Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 551 n.80); Katzenbach''s interview with Herring, Dec. 7, 1988; Rostow''s oral history, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 114 n.88); *Washington Post*, Feb. 7, 10, 1967 (cited by [[w.herring-lbj-and-vietnam]], 114 n.89); White House Daily Diary, Feb. 6, 1967, LBJ Library (cited by [[w.palermo-in-his-own-right]], 42 n.51); partial transcript of Kennedy''s press conference in the West Lobby, Feb. 6, 1967, WHFN, LBJ Library (cited by [[w.palermo-in-his-own-right]], 43 n.61); John Gunther Dean to Joseph Dolan, Feb. 2, 1967, RFK Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 41 n.43); "Kennedy Sees President (cited by [[w.branch-at-canaans-edge]], 572); Denies Bringing ''Feelers,'' " NYT, Feb. 7, 1967, p. 1 (cited by [[w.branch-at-canaans-edge]], 572); [[w.schlesinger-thousand-days-1965]], 825–28 (cited by [[w.branch-at-canaans-edge]], 572); Thomas, Robert Kennedy, pp. ASP =33} (cited by [[w.branch-at-canaans-edge]], 572); Nicholas Katzenbach oral history by Paige E. Mulhollan, Nov. 23, 1968, pp. 27–29, LBJ (cited by [[w.branch-at-canaans