  - id: cal.1967-02-17.vietnam-air-war
    when: Feb. 17
    date: '1967-02-17'
    thread: vietnam-air-war
    also: [vietnam-force-levels]
    c: 'Wheeler to Sharp and Westmoreland, backchannel, JCS 1284-67, after a talk with McNamara: "highest authority" more receptive to more military pressure, swayed by the North''s logistic buildup during the Tet standdown, Hồ''s "hardnosed" reply and other events. He and McNamara to see the President on "a broadening of the target system in North Vietnam" and a faster pace in the South. McNamara asks whether Westmoreland engages the enemy "as speedily and with as much force as is prudent"; Wheeler asks Harold Johnson to look at more combat battalions beyond those approved.'
    n: '[[w.gibbons-u-s-government-and]], IV, 558–59. To check: Wheeler to Sharp and Westmoreland, JCS 1284-67, Feb. 17, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 558 n.2). See [[cal.1967-02-17.vietnam]]. Names: Wheeler, Sharp, Westmoreland, McNamara, Harold Johnson.'
