  - id: cal.1967-02-08.vietnam
    when: Feb. 8
    date: '1967-02-08'
    time: 1967-02-07T22:00Z
    place: moscow
    thread: vietnam-sunflower
    c: 'Moscow, 1 a.m.: Guthrie hands Lê Trang Johnson''s letter to Hồ Chí Minh: he will stop the bombing of the North and stop adding to American forces in the South "as soon as I am assured that infiltration into South Viet-Nam by land and by sea has stopped"; direct talks in Moscow, Burma or elsewhere. Lê Trang: it shows an "absence of goodwill." Washington, the NSC: Wheeler, a promise to talk not enough to stop the bombing; McNamara, it could stop for "a symmetrical de-escalation." Johnson''s reply to Paul VI''s appeal of Feb. 7: no cut in military action unless the other side does likewise. Johnson to the NSC: "Hanoi is trying to force us to give up the bombing of North Vietnam. We will keep on until we get something from the North Vietnamese."'
    n: '[FRUS 1964–68, V, doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v05/d40); [doc. 42](https://history.state.gov/historicaldocuments/frus1964-68v05/d42); [doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v05/d43). The President''s Reply to a Message From Pope Paul VI on Vietnam, [1967 Pub. Papers 162](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=230) (Feb. 8, 1967). [[w.herring-lbj-and-vietnam]], 108–09 (the letter, delivered Feb. 8, the bombing to stop only once infiltration "had stopped"; the NSC of that day: Rusk, Hanoi might think the United States panicking; Johnson, "We will keep on until we get something from the North Vietnamese"); [[w.gibbons-u-s-government-and]], IV, 510, 558 (the NSC, 10:32 to 11:08 a.m.: Rusk, no "serious response" to any probe; he and Johnson, the Communists think the United States is "panicking"); [[w.gibbons-u-s-government-and]], IV, 512 (the letter, delivered by Guthrie Feb. 8; its text); [[w.drea-mcnamara-clifford-and-the-2011]], 204 (Johnson to Hồ: the bombing stopped once Hanoi quits its infiltration); [[w.schlesinger-robert-kennedy-and-his]], 767 and n. (Johnson''s letter to Hồ Chí Minh "dispatched ... on February 8," "drafted and redrafted February 2–8," demanding that the North stop reinforcing its troops in the South as a condition of the cessation of the bombing (Kraslow and Loory, *The Secret Search for Peace in Vietnam*, 206); not the delivery in Moscow). [[w.rusk-as-i-saw-it-1990]], 469 (the letter); [[w.dallek-flawed-giant]], 446–47 (Johnson''s letter to Hồ (assurances on infiltration; then an end to the bombing and to added forces); the NSC of Feb. 8, Rusk on "dozens of probes," Johnson: "Hanoi is trying to force us to give up the bombing of North Vietnam. We will keep on until we get something from the North Vietnamese"; not the delivery in Moscow, the hour or the others). Made public: Hanoi''s release of the letters, Mar. 21, 1967. [[w.mann-grand-delusion]], 529 (Johnson to the NSC). See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang, Hồ Chí Minh, Wheeler, McNamara, Paul VI, Johnson.'
    src:
