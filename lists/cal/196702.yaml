    also: [press-and-broadcasting]
    c: 'Joseph Alsop to Robert Kennedy, as an "affectionate, admiring, and deeply concerned uncle": stay out of protests that could turn victory into stalemate; "Anyone who is in any degree implicated in the latter result will never be forgiven."'
    n: '[[w.branch-at-canaans-edge]], 572. To check: Alsop to "Bobby," Feb. 1, 1967, RFK/Senate Correspondence, Personal File, Box 1, JFK. Alsop''s letter summarized: "All this is merely intended to lead up to the observation that, for practical reasons, you really must give more weight to the support of what people call the ''establishment'' than I think you do." (cited by [[w.branch-at-canaans-edge]], 572); Joe Alsop, "The Biggest News," WP, Feb. 1, 1967, and "An End in Sight," WP, Feb. 3, 1967, columns attached to ibid (cited by [[w.branch-at-canaans-edge]], 572). Names: Joseph Alsop, Robert Kennedy.'
