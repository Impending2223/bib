  - id: cal.1967-02-19.china-leadership
    when: Feb. 19
    date: '1967-02-19'
    thread: china-leadership
    c: Morning. Mao presides over a Politburo meeting, Zhou Enlai, Li Fuchun, Ye Jianying, Li Xiannian, Kang Sheng, Xie Fuzhi and Ye Qun (for Lin Biao) present. He severely criticizes the speeches of Tan Zhenlin, Chen Yi and Xu Xiangqian of Feb. 16. The meeting makes Tan, Chen and Xu "ask leave and examine themselves." From Feb. 25 to Mar. 18, at Mao's view, seven "Politburo life meetings" at Huairen Hall criticize them and Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen; Jiang Qing and others call it a "bourgeois restoration countercurrent." The Politburo then stops meeting; the Center Cultural Revolution Group's liaison meetings replace Zhou's Standing Committee liaison meeting.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 127 (Feb. 19, 1967; Zhou at the Politburo meeting; Zhou also makes self-criticism at the "life meetings" of Feb. 25 to Mar. 18; the Politburo stops meeting and the Cultural Revolution Group in effect takes its place; the liaison meeting Zhou led, with the vice-premiers and others, is replaced by the Cultural Revolution Group''s, which Wu Faxian and others join); [[w.macfarquhar-maos-last-revolution]], 195–196 (Mao calls the meeting "In the early hours of February 19"; it lasts until daybreak; his words for the Group and against Chen Yi; Zhou''s self-criticism; who is to work on Chen Yi, Tan Zhenlin and Xu Xiangqian); [[w.macfarquhar-maos-last-revolution]], 196 (seven criticism meetings, Feb. 25 to Mar. 18, chaired by Zhou Enlai, the Group''s members joining); [[w.mao-zedong-zhuan]], VI, ch. 76 (before dawn on the 19th Mao calls a meeting and in a rage says ''I go at once, Lin Biao too; reorganize the Cultural Revolution Group and let them run it, Chen Yi as head, Tan Zhenlin and Xu Xiangqian deputy heads''; Zhou Enlai urges him not to be so angry and makes a self-criticism; it is decided to hold meetings of criticism, ''life meetings'', of the three, who stop work and examine themselves; from Feb. 25 to Mar. 18 seven Politburo ''life meetings'' criticize Chen Yi, Tan Zhenlin, Xu Xiangqian and also Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen, Jiang Qing and others attacking them fiercely as a ''bourgeois restoration countercurrent'', called after the ''February countercurrent''; then the Politburo stops meeting, the Cultural Revolution Group''s liaison meeting in effect taking its place). [[w.yang-jisheng-tiandi-fanfu]], I, 391–392 (before dawn of Feb. 19 Mao calls a meeting: Zhou, Ye Qun for Lin Biao, Kang Sheng, Li Fuchun, Ye Jianying, Li Xiannian, Xie Fuzhi, of the Group only Kang Sheng, who takes notes; Mao in a great rage: "I leave at once, Lin Biao too! Chen Boda, Jiang Qing shot! Kang Sheng banished"; let Chen Yi lead the Group, Tan Zhenlin and Xu Xiangqian his deputies, bring back Wang Ming and Zhang Guotao, invite America and the Soviet Union too; the Politburo to meet on it, if need be for two months; the Group''s errors one, two or three percent, 97 right; Zhou makes self-criticism; "life meetings" decided for Chen Yi, Tan Zhenlin and Xu Xiangqian, the three to "ask leave and examine themselves"; Kang Sheng afterward: never in all his years seen the Chairman so angry); [[w.jian-zhou-enlai]], 569–570 (Mao in "thunderous anger": the meeting a "huge matter," its complainers "big troublemakers"; "only 1, 2, or 3 percent of what CCRR has done is incorrect, and 97 percent is correct. I will firmly oppose whoever opposes them"; Zhou takes the blame; Mao orders meetings, "if one month is not enough, it will be extended to two months"); [[w.teiwes-tragedy-of-lin-biao]], 76, 78 (Mao''s meeting, Ye Qun attending for Lin, who begs off ill; the furious Mao lambasts the marshals and Vice Premiers and demands they step aside and examine themselves; the Politburo suspended as a policy body; Mao: "whoever opposes the CRG will meet my resolute opposition"); [[w.dikotter-cultural-revolution]], 137–138 n.21 (the meeting "in the early hours of 19 February": the meetings that attacked the Group aimed at him and Lin Biao; to Ye Qun: "you tell Lin Biao that he is not safe either"; the Group''s errors "no more than two or three per cent"; he and Lin Biao would go to the mountains for a guerrilla war; "Arrest and execute Chen Boda and Jiang Qing, send Kang Sheng into exile. I, too, will step down!"); [[w.liu-jixian-ye-jianying-nianpu]], II, 960 (Feb. 19, 1967; before dawn 凌晨; Mao calls Zhou Enlai, Ye Qun 叶群 for Lin Biao, Kang Sheng, Li Fuchun, Ye Jianying 叶剑英, Li Xiannian and Xie Fuzhi; the Group''s errors one, two or three percent; to make a great uproar in the Huairen Hall is to want a capitalist restoration, Liu and Deng back in power; an enlarged Politburo to criticize the old comrades). Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 216 (cited by [[w.macfarquhar-maos-last-revolution]], 195 n.72a, 196 n.73); [[w.zhou-enlai-nianpu-1949]], III, 129 (cited by [[w.macfarquhar-maos-last-revolution]], 195 n.72b); [[w.li-wang-li-fansi-lu]], II, 983 (cited by [[w.macfarquhar-maos-last-revolution]], 196 n.74); [[w.li-insiders-account-of-the]], 53 (cited by [[w.macfarquhar-maos-last-revolution]], 196 n.75); [[w.wenqian-wannian-zhou-enlai]], 26th printing (2004), 206 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 392 n.17); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E10–15 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35a); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 21–22, 1984 (FBIS, Nov. 6, 1984, K22–24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35b); [[w.baocun-tan-zhenlin-wai-zhuan]], 128 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35c); [[w.yunsheng-maojiawan-jishi]], 95–96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41a); [[w.wen-feng-shentanxia-de-lin-biao]], 106 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41b); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E14 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41c); [[w.xianzhi-mao-zedong-zhuan-1949]], 1482–1483 (cited by [[w.dikotter-cultural-revolution]], 138 n.21a); [[w.pu-weihua-zalan-jiu-shijie]], 452–453 (cited by [[w.dikotter-cultural-revolution]], 138 n.21b); Gao Wenqian, *Zhou Enlai: The Last Perfect Revolutionary* (2007), 160 (cited by [[w.dikotter-cultural-revolution]], 138 n.21c). Names: Mao Zedong, Zhou Enlai, Li Fuchun, Ye Jianying, Li Xiannian, Kang Sheng, Xie Fuzhi, Ye Qun, Lin Biao, Tan Zhenlin, Chen Yi, Xu Xiangqian, Nie Rongzhen, Jiang Qing.'
