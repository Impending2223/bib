    c: 'Zhou Enlai twice, with Ye Jianying, Nie Rongzhen, Xu Xiangqian and Xiao Hua, talks with Zhang Guohua and Chen Mingyi on Tibet. The rebels hold the regional Party committees and people''s councils power but work is paralyzed: keep the Military Commission''s eight orders, guard the Region''s command and the arsenals absolutely, and allow no rebels to storm in and seize power or arms.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 8, 1967); [[w.liu-jixian-ye-jianying-nianpu]], II, 958 (Feb. 8, 1967; Ye Jianying 叶剑英 at Zhou''s two meetings with Zhang Guohua 张国华 and Chen Mingyi 陈明义 of the Tibet 西藏 region and military region). Made public: 2020. Names: Zhou Enlai, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Xiao Hua, Zhang Guohua, Chen Mingyi.'
