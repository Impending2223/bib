    c: 'Rostow to Johnson before the afternoon''s meeting, three strategies against the North: A, "Interdicting or Narrowing the Top of the Funnel," mining the harbors and bombing the rail line to China, "the most effective military course" at the risk of a Soviet or Chinese reaction; B, "Hammering the middle of the Funnel," eight power plants, 82 percent of the North''s remaining capacity, the cement and steel plants, the Hanoi-Haiphong area; C, "Narrowing the broad Bottom of the Funnel," mining two river mouths, naval gunfire, more Shining Brass. Not a "maximum campaign against the North, convulsively, right now": the power plants next, "thoroughly" but at a "deliberate pace."'
