  - id: cal.1967-02-03.china-leadership
    when: Feb. 3
    date: '1967-02-03'
    place: peking
    thread: china-leadership
    c: 'Great Hall, room 118. Mao receives Hysni Kapo and Beqir Balluku of the Albanian Party of Labor, Zhou Enlai, Kang Sheng, Ye Jianying, Yang Chengwu, Xiao Hua and Wang Shusheng present. In the Party the struggle has not been public: at the Seven Thousand Cadres Conference he said revisionism would overthrow us; in five years only single cases and single men were taken up; no form had been found to expose our dark side openly, from below. The attack on Wu Han began in Peking''s absence, a team in Shanghai under Yao Wenyuan; he read the article first alone.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 3, 1967, and note 25. [[w.zhou-enlai-nianpu-1949-2020]], III, 120 (Feb. 3, 1967; Zhou with Mao at the meeting with Hysni Kapo and Beqir Balluku of Albania); [[w.zhou-enlai-waijiao-huodong]], 508 (Feb. 4, 1967; afternoon; Zhou accompanies Mao in receiving Kapo and Balluku); [[w.zhonghua-renmin-gongheguo-waijiao]], 143 (Feb. 3, 1967; Mao receives Balluku and the delegation members; the delegation''s visit, Jan. 10–Feb. 10); [[w.jianguo-yilai-mao-zedong]], XVIII, 459 (Feb. 3, 1967; the passage printed from *Renmin ribao*, Apr. 28, 1969, as quoted in Lin Biao''s report to the Ninth Congress (given Apr. 1, adopted Apr. 14, 1969)); [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.68, 441 n.71 (Mao to the Albanians: he was in the plan from the start; Jiang Qing would not show the draft to Zhou or Kang Sheng); [[w.mao-zedong-zhuan]], VI, ch. 76 nn.11, 12 (Feb. 3 Mao''s talk with Hysni Kapo and Beqir Balluku: for many years the struggle in the Party was not open; at the conference of 7,000 in Jan. 1962 he said revisionism would overthrow us and if we did not take care China would become a fascist dictatorship in several years to several decades; in the five years 1962 to 1966 only some single questions and single persons were taken up; no form had been found to expose our dark side openly, as a whole, from below; the decisive battle not yet finished, Feb., Mar. and Apr. the time of decision, solving all may take to next Feb., Mar., Apr. or longer; only by rousing the masses is there a way; the kinds of men in the Party who show themselves: old cadres of the democratic revolution, those who joined after liberation, men taken over from the Kuomintang, sons of the bourgeoisie, landlords and rich peasants; the anarchism now abroad, ''doubt everything, overthrow everything, it ends on oneself'', n.11, n.12). [[w.yang-jisheng-tiandi-fanfu]], II, 699 (Mao: "I do not know what ''formalities'' they went through; now it is found: for the Kuomintang, against the Communist Party"); [[w.yang-jisheng-mubei]], II, 1115 n.10 (Mao to Balluku: the struggle in the Party not made public for years; at the Seven Thousand Cadres Conference of 1962 he said revisionism would overthrow us; the speech then unpublished); [[w.yang-jisheng-tiandi-fanfu]], I, 68 (Mao to Kapo: at the Seven Thousand Cadres Conference he said revisionism would overthrow us within years or decades; the speech not then published; Zhang Suhua finds no such words in the original record of his speech); [[w.pu-weihua-zalan-jiu-shijie]], 12 (Mao''s words: at first he did not know, Jiang Qing''s people did it; they could not organize it in Peking and went to Shanghai; the article given him to read alone, not Zhou Enlai or Kang Sheng, lest Liu Shaoqi, Deng Xiaoping, Peng Zhen and Lu Dingyi, against its publication, see it); [[w.pu-weihua-zalan-jiu-shijie]], 83 (Mao to Kapo and Balluku: when the Peking committee''s reorganization was announced two garrison divisions were added, so that you and we can go about). Made public: 1993. To check: [[w.yanjiushi-guanyu-jianguo-yilai-dangde]], 373 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.68b); Mao Zedong, conversation with Albanians, Feb. 3, 1967, in [[w.zedong-xuexi-ziliao-materials-of]], 287–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.68d); Mao Zedong, conversation with Albanians, Feb. 3, 1967, in [[w.zedong-xuexi-ziliao-materials-of]], 288 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 441 n.71c); Mao Zedong 毛泽东, talk with Hysni Kapo 卡博 and Beqir Balluku 巴卢库 (record 谈话记录), Feb. 3, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.11); Mao Zedong 毛泽东, talk with Hysni Kapo 卡博 and Beqir Balluku 巴卢库 (record 谈话记录), Feb. 3, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.12); Mao Zedong 毛澤東, 〈和卡博、巴廬庫同志的談話〉, Feb. 3, 1967, *Mao Zedong sixiang wansui* 《毛澤東思想萬歲》 (1967–1968), pt. 3, 88 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 68 n.63a); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1397 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 12 n.21). Names: Mao Zedong, Hysni Kapo, Beqir Balluku, Zhou Enlai, Kang Sheng, Ye Jianying, Yang Chengwu, Xiao Hua, Wang Shusheng, Wu Han, Yao Wenyuan. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
