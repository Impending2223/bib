  - id: cal.1967-02-11.china-leadership-3
    when: Feb. 11
    date: '1967-02-11'
    place: peking
    thread: china-leadership
    c: 'Zhou Enlai chairs the Center''s liaison meeting at Huairen Hall. Ye Jianying and Xu Xiangqian and others confront face to face the Cultural Revolution Group''s throwing the Party and the army into confusion. Ye to Chen Boda: "you have thrown the Party into confusion, the government, the factories and villages, and still not enough, you must throw the army too; what do you want? Can there be revolution without the Party''s leadership? Without the army?" Xu, thumping the table: the army is the pillar of the dictatorship of the proletariat; shall men like Kuai Dafu command it?'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 123 (Feb. 11, 1967, the item after); [[w.macfarquhar-maos-last-revolution]], 191–192 (on the agenda "grasping revolution and promoting production"; of the Group only Chen Boda, Kang Sheng and Wang Li present; Kang Sheng defends Chen; Ye Jianying on the Shanghai Commune; Chen Boda abashed; Zhou ends the meeting; Chen Yi''s whispered praise of Ye); [[w.deng-xiaoping-nianpu-1904]], III, 1936 (Feb. 11 and 16, 1967; the nianpu: Tan Zhenlin, Chen Yi, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen and others speak in turn at the Center''s head-bumping meetings, criticizing sharply the many wrong ways of the Central Cultural Revolution Group; before that several leaders of the Military Commission quarrelled sharply on the army''s stability with Jiang Qing, Chen Boda and Kang Sheng at the enlarged Commission meeting of Jan. 19; their resistance is slandered as the ''February countercurrent'' and suppressed; after it the Cultural Revolution Group in the main takes over the Politburo''s function, and the Center''s head-bumping meeting that Zhou Enlai had presided over is replaced by the Group''s); [[w.yang-jisheng-tiandi-fanfu]], I, 388 (Zhou presides at Huairen Hall 懷仁堂; Ye Jianying to Kang Sheng, Chen Boda and Zhang Chunqiao: you have thrown the Party, the government, the factories and the villages into confusion and now would the army; renaming Shanghai''s power the "Shanghai Commune" without the Politburo; Xu Xiangqian bangs the table, the army the pillar of the dictatorship; Nie Rongzhen on the arrests of the United Action members, children struggled to bring down their fathers); [[w.jian-zhou-enlai]], 568 (Ye Jianying, pointing at Jiang: "You have caused chaos in the party, in the government, and in factories and the countryside! Now, you even try to bring chaos to the military"; the Shanghai Commune started "without going through the Politburo"; Xu Xiangqian: "The army is a pillar of the revolution; do you still want it? If not, I will quit!"; Zhou calm, neither joining nor stopping them); [[w.chen-yi-nianpu]], 1184 (Feb. 11, 1967, afternoon, Huairen Hall 怀仁堂; Chen Yi with Tan Zhenlin, Ye Jianying, Li Fuchun, Li Xiannian, Xu Xiangqian and Nie Rongzhen strongly objects to the wrong ways of the Cultural Revolution); [[w.dikotter-cultural-revolution]], 136 n.19 (at a meeting of the central leadership the day after, Ye Jianying lays into Chen Boda: "You have made a mess of the government, a mess of the party ..."; Xu Xiangqian bangs the table: "For people like Kuai Dafu to lead the army?"); [[w.liu-jixian-ye-jianying-nianpu]], II, 959–960 (Feb. 11, 1967; Huairen Hall 怀仁堂, Zhongnanhai 中南海; Ye Jianying 叶剑英 with Xu Xiangqian 徐向前, Nie Rongzhen 聂荣臻 and others against the Cultural Revolution Group 中央文革; to Chen Boda 陈伯达 and Zhang Chunqiao 张春桥: you have thrown the Party, the government, the factories and villages into confusion, and must throw the army too; the Shanghai seizure renamed the Shanghai Commune without the Politburo''s discussion; to Chen Boda, in mockery: we do not read books or papers, nor know the Paris Commune''s principles; explain them). Made public: 1988. To check: [[w.xuan-wenhua-dageming-jianshi]], 148 (cited by [[w.macfarquhar-maos-last-revolution]], 191 n.51); [[w.nianyi-da-dongluande-niandai]], 208 (cited by [[w.macfarquhar-maos-last-revolution]], 192 n.53, n.54); Zhonggong zhongyang dangshi yanjiushi 中共中央黨史研究室, *Zhongguo gongchandang lishi* 《中國共產黨歷史》, vol. 2 (1949–1978) (Zhonggong dangshi chubanshe 中共黨史出版社, 2011), 788 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 388 n.6); [[w.fan-shuo-ye-jianying-zhuan]], 586–587 (cited by [[w.jian-zhou-enlai]], 568 n.10a); [[w.pu-weihua-zalan-jiu-shijie]], 449–450 (cited by [[w.jian-zhou-enlai]], 568 n.11a); [[w.xu-xiangqian-zhuan]], 532 (cited by [[w.jian-zhou-enlai]], 568 n.11b); [[w.liu-wusheng-wenge-zhong-de-zhou-enlai]], 192 (cited by [[w.jian-zhou-enlai]], 568 n.12); Wang Guangyu, *Qingshi nanyin* (2011), 121 (cited by [[w.dikotter-cultural-revolution]], 136 n.19). Names: Zhou Enlai, Ye Jianying, Xu Xiangqian, Chen Boda, Kuai Dafu.'
