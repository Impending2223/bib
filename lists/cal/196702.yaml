  - id: cal.1967-02-12.china-leadership
    when: Feb. 12
    date: '1967-02-12'
    thread: china-leadership
    c: 'Mao to Zhang Chunqiao, Wang Li, Yao Wenyuan and Qi Benyu: since the Group''s founding it has never once asked him to preside; since June it stood in for the Secretariat, another "independent kingdom"; it dismisses the Standing Committee. Cultural revolution one or two years, then a halt. Now "bring down all" is in the air; to bring down all cadres is anarchism; the doubt of everything is anarchism; to "perfect the proletarian dictatorship" is wrong. On the Shanghai "People''s Commune" kept from the press: as the Peking one too; calling all "communes" would mean a change of national name and form; Paris, had it won, might have turned bourgeois; the Soviets turned.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 12, 1967. [[w.macfarquhar-maos-last-revolution]], 168 (Zhang and Yao back from Shanghai; Mao on a commune''s name, recognition and ambassadors; Shanghai to become a revolutionary committee; the commune too weak against counterrevolution); [[w.macfarquhar-maos-last-revolution]], 192 (Zhang Chunqiao and Yao Wenyuan, back from Shanghai at Mao''s call, taken from the airport to his residence and told to change the name "Shanghai Commune"); [[w.mao-zedong-zhuan]], VI, ch. 76 n.28 (Feb. 12 Mao''s talk with Zhang Chunqiao, Wang Li, Yao Wenyuan and Qi Benyu, n.28: since the Group was set up it has never once proposed that he preside at a meeting; since last June it has stood in for the Secretariat, also an independent kingdom, denouncing others'' independent kingdoms while acting alone and denying the Standing Committee exists; the cultural revolution, one or two years, must pause; now there is a wind of ''overthrow everything''; to overthrow all cadres, how can that be; to doubt everything and overthrow everything is anarchism; workers and students raised up and given power, with no experience, change in a few months, very unstable; of the Shanghai commune founded under Zhang and Yao and hailed in the *Wenhui bao*: if it is published all places will be called people''s communes and what of the Party, government and army, ''all in charge''?). [[w.yang-jisheng-tiandi-fanfu]], I, 360 (on Feb. 12 Mao has Zhang Chunqiao and Yao Wenyuan called back from Shanghai to Peking, Wang Li meeting them at the airport and taking them to Mao''s swimming pool; Mao approves the Shanghai work but says Peking had considered a Peking commune and then thought the matter reached too far, to the whole state system, the revision of the constitution, and above all foreign recognition: "change the Shanghai commune back; better call it a revolutionary committee"); [[w.jian-zhou-enlai]], 565 (Mao''s later explanation: published, "communes will appear everywhere. Then, do we still need the party, the government, or the military?"; the state''s name would have to change to "The People''s Commune of China"; the name to be dropped, "better to call it a revolutionary committee"; not the day); [[w.dikotter-cultural-revolution]], 132 n.12 (Mao, "a few weeks later": if every province, city and region were called a people''s commune, the country would have to become the People''s Commune of China; where would the party be placed? "There must be a party somehow!"). Made public: 1974. To check: Mao Zedong''s remarks to Zhang Chunqiao and Yao Wenyuan on the Shanghai people''s commune, Feb. 12, 1967, in [[w.schram-mao-tse-tung-unrehearsed]], 278 (cited by [[w.macfarquhar-maos-last-revolution]], 168 n.68); [[w.li-xianchang-lishi]], 30 (cited by [[w.macfarquhar-maos-last-revolution]], 192 n.55); Mao Zedong 毛泽东, talk with Zhang Chunqiao 张春桥, Wang Li 王力, Yao Wenyuan 姚文元 and Qi Benyu 戚本禹 (record 谈话记录), Feb. 12, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.28); [[w.li-wang-li-fansi-lu]], the Beixing ed. as Yang cites it (2011, 2nd ed., 236) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 360 n.66); [[w.macfarquhar-maos-last-revolution]], 170–171 (cited by [[w.jian-zhou-enlai]], 565 n.91b); Yiching Wu, *The Cultural Revolution at the Margins* (2014), 129–130 (cited by [[w.dikotter-cultural-revolution]], 132 n.12). Names: Mao Zedong, Zhang Chunqiao, Wang Li, Yao Wenyuan, Qi Benyu.'
    src:
