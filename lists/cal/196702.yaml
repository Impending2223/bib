    c: 'Mao reads the draft items on Guizhou''s "revolutionary committee": "revolutionary committee" the right name, to be used in all four papers; printed over two days, three the first, one the second. The papers of Feb. 22 and 23 print "the Guizhou Revolutionary Committee," not "the Mao Zedong Thought Guizhou Revolutionary Committee."'
