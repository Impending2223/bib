  - id: cal.1967-02-16.china-leadership-9
    when: Feb. 16
    date: '1967-02-16'
    time: 1967-02-16T13:00Z
    time_approx: true
    place: peking
    thread: china-leadership
    c: 'In the conference room of the West Building of Zhongnanhai 中南海, Peking 北京, Chen Yi 陈毅 receives representatives of the students come home from abroad and speaks for over two hours: do not climb up on others'' shoulders or dye your cap red with others'' blood; posting Liu Shaoqi''s 刘少奇 "hundred crimes" at Wangfujing leaks secrets; Zhu De 朱德 a warlord, He Long 贺龙 a bandit?; if only eleven in the great Party are clean, he does not want to be clean; a Communist who does not dare speak out now is not worth a copper; the Cultural Revolution''s after-effects will last ten or twenty years; power will not be handed to careerists and double-dealers.'
    n: '[[w.chen-yi-nianpu]], 1186–1187; [[w.pu-weihua-zalan-jiu-shijie]], 90 n.17 (Chen Yi to the students home from abroad: Zhu De eighty-one, "Zhu-Mao" in history; to call him a warlord is to burn the bridge after crossing it). The words: 晚上9时许 (1186–1187). Made public: 1995. Names: Chen Yi, Liu Shaoqi, Zhu De, He Long.'
    tags: [polity:prc, name:chen-yi, name:liu-shaoqi, name:zhu-de, name:he-long, vis:only:prc]
