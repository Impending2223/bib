    when: Feb. 6
    date: '1967-02-06'
    thread: vietnam
    c: 'Taylor to Johnson: lacking "a very outstanding civilian," Westmoreland as Ambassador, "the pros outweigh the cons"; Ambassador and commander in chief both, with a military deputy for the forces, a civilian for the rest, a third for the Mission.'
    n: 'Taylor to Johnson, Feb. 6, [FRUS 1964–68, V: Vietnam, 1967, doc. 37](https://history.state.gov/historicaldocuments/frus1964-68v05/d37). [[w.gibbons-u-s-government-and]], IV, 576. See [[cal.1967-01-31.vietnam]]. Names: Taylor, Johnson, Westmoreland.'
