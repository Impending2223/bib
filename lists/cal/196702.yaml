  - id: cal.1967-02-19.china-leadership-2
    when: Feb. 19
    date: '1967-02-19'
    thread: china-leadership
    c: 'Mao reads Tan Zhenlin''s letter of Feb. 17 to Lin Biao, which Lin sends on (Tan: Jiang Qing and the others enjoy knocking down old cadres, the Group will not do as successors; he is resolved to rebel and ready to die, but will not kill himself nor betray the country). Lin''s note: Tan''s thought has sunk to this, past all hope. Mao: "Seen. To Zhou; return to Lin."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. [[w.macfarquhar-maos-last-revolution]], 195 (Lin Biao sends Tan Zhenlin''s letter on to Mao, remarking that Tan''s thinking has sunk to a new low); [[w.mao-zedong-zhuan]], VI, ch. 76 n.31 (Tan Zhenlin''s letter to Lin Biao of Feb. 17, n.31: Jiang Qing and the others are interested in beating the old cadres, seize on one fault and beat to death; whether they can govern or succeed I doubt; ''I have resolved, prepared to sacrifice; I will not kill myself nor betray the country, but will not let them go on so recklessly; I am set to rebel''; Lin Biao sends it to Mao with a letter that Tan''s thinking has sunk ''to such a state'', wholly unexpected; Mao marks it ''read''). [[w.yang-jisheng-tiandi-fanfu]], I, 391 (Lin Biao sends Tan Zhenlin''s letter to Mao with a note: Tan''s thought has sunk to such muddle and degeneracy, wholly unforeseen; Mao writes "read"); [[w.teiwes-tragedy-of-lin-biao]], 78 (only on the 19th, after the meeting, does Lin forward the letter, with a comment of amazement at the degraded state of Tan''s mind). Made public: 1988. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 294 (cited by [[w.macfarquhar-maos-last-revolution]], 195 n.70); Tan Zhenlin 谭震林, letter to Lin Biao 林彪 (original 原件), Feb. 17, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.31); [[w.yunsheng-maojiawan-jishi]], 95–96 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41a); [[w.wen-feng-shentanxia-de-lin-biao]], 106 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41b); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E14 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.41c). Names: Mao Zedong, Tan Zhenlin, Lin Biao, Jiang Qing, Zhou Enlai.'
