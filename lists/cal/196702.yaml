    c: 'Mao, on "Whom did the Peking Political-Legal Commune support at Xiaozhan 小站, Tianjin?" in the Group''s *Kuaibao* 快报 no. 1332 of Feb. 25 (a team of it backed cadres removed in the Four Cleanups in seizing a brigade''s seal), which Chen Boda 陈伯达 sent Feb. 27 as an example of capitalist restoration: "From top to bottom, at every level, there is this phenomenon of counter-revolutionary restoration; it deserves attention."'
