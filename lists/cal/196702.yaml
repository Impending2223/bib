    c: 'Johnson with McNamara, Wheeler, Taylor and Rostow, 12:25 to 2:04 p.m., no one from State. Wheeler for bombing the steel and cement plants and the North''s power grid, 138,000 kilowatts: pressure on the economy and on Hanoi''s will, no major direct military effect. Johnson wants courses of action for Feb. 22.'
    n: 'FRUS 1964–68, V, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84). [[w.gibbons-u-s-government-and]], IV, 558–60 (the hour; Wheeler''s cables to Sharp and Westmoreland, JCS 1284-67, Feb. 17, and of Feb. 18: "a new sense of urgency in the atmosphere"); [[w.cosmas-joint-chiefs-of-staff]], 18 (Wheeler for striking the power net, "even to the point of destroying the entire system"); [[w.drea-mcnamara-clifford-and-the-2011]], 135 (recommendations in five days; "operating on borrowed time"); [[w.dallek-flawed-giant]], 458–59 (Feb. 17, Wheeler presents the case for more bombing, McNamara on its limits; Johnson asks for "all the alternatives . . . with respect to accelerating the effort in the North"; not the attendees, the hours, the targets or Feb. 22). To check: Wheeler to Sharp and Westmoreland, JCS 1337-67, Feb. 18, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 560 n.7). Made public: FRUS 1964–68, V (2002). Names: Johnson, McNamara, Wheeler, Taylor, Rostow.'
