  - id: cal.1967-02-06.china-leadership
    when: Feb. 6
    date: '1967-02-06'
    thread: china-leadership
    c: 'Mao calls Zhou Enlai, Chen Boda, Ye Jianying, Jiang Qing and others on seizing power. A city''s seizure needs the three-in-one: delegates of the masses, the army and the revolutionary cadres; without it no recognition. The army does not seize power; whoever seizes should be arrested. To Chen Boda and Jiang Qing: this "business of yours" must take criticism; you lack political, worker-peasant and army experience; Tao Zhu was settled in two or three hours without me, Lin Biao or the Premier, reported afterward; Boda does not consult; "you will fall sooner or later." He orders the Shanghai "People''s Commune" kept out of the press: with every province a commune the nation would be "the Chinese People''s Commune," with no Center and no State Council.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 6, 1967. [[w.jian-zhou-enlai]], 567–568 (Mao, before Zhou and the Group, reproaches Jiang Qing: "You should be criticized. You have no political experience ... If you try to knock down all the veteran cadres, you yourself will be brought down sooner or later"); [[w.liu-jixian-ye-jianying-nianpu]], II, 958 (Feb. 6, 1967; afternoon; Ye Jianying 叶剑英 at the enlarged Standing Committee at Mao''s, hearing his instructions on the takeover of the Tianjin 天津 and Peking 北京 public security bureaus, some central departments, and some provinces'' and cities'' seizures of power). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Ye Jianying, Jiang Qing, Tao Zhu, Lin Biao.'
    tags: [name:mao-zedong, name:zhou-enlai, name:chen-boda, name:ye-jianying, name:jiang-qing, name:tao-zhu, name:lin-biao, polity:prc, vis:only:prc]
