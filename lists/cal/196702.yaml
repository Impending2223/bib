# Cal. LXXXVIII February 1967
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXVIII
entries:
  - id: cal.1967-02-01.war-opposition
    when: Feb. 1
    date: '1967-02-01'
    thread: war-opposition
    c: 'Seven leaders of Clergy and Laymen Concerned About Vietnam, after some 2,000 of its members march at the White House, Jan. 31, see Rostow: negotiations will come in time; the administration "under terrific pressure from people who want to go militarily further."'
    n: '[[w.gibbons-u-s-government-and]], IV, 554. To check: *New York Times*, Feb. 1 and 2, 1967. Names: Rostow.'
    tags: [name:rostow-walt-w]
  - id: cal.1967-02-02.india-and-china
    when: Feb. 2
    date: '1967-02-02'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: Message on food for India. India's need this year, 10 million tons of grain, about $725 million; 2.3 million tons already in the pipeline. The rest, 5.7 million tons, to be met through the World Bank's India Aid Consortium; the United States to give up to 3 million tons more if other countries match it. $25 million in food for CARE and the voluntary agencies in Bihar and Uttar Pradesh.
    n: 'Special Message to the Congress on Food for India and on Other Steps To Be Taken in an International War on Hunger, [1967 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=189) (Feb. 2, 1967). See [[cal.1966-11-10.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-02.vietnam-sunflower
    when: Feb. 2
    date: '1967-02-02'
    thread: vietnam-sunflower
    c: 'Moscow. Guthrie gives Lê Trang the American reply of Jan. 31: direct and private talks on any subject either side raises.'
    n: 'FRUS 1964–68, V, docs. [32](https://history.state.gov/historicaldocuments/frus1964-68v05/d32), [33](https://history.state.gov/historicaldocuments/frus1964-68v05/d33). See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang.'
    tags: [name:guthrie-john-c, name:le-trang]
  - id: cal.1967-02-02.vietnam
    when: Feb. 2
    date: '1967-02-02'
    thread: vietnam
    also: [soviet-union-consular]
    c: 'News conference. Vietnam: nothing showing "any seriousness" on the other side''s part; for a halt in the bombing, "Just almost any step." Johnson for the consular convention.'
    n: 'The President''s News Conference, [1967 Pub. Papers 128](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=196) (Feb. 2, 1967). [[w.gibbons-u-s-government-and]], IV, 509. See [[cal.1967-01-04.vietnam]]; [[cal.1967-01-20.soviet-union]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-02.vietnam-congress
    when: Feb. 2
    date: '1967-02-02'
    thread: vietnam-congress
    c: 'Salisbury before the Foreign Relations Committee in public session: the bombing has not cut infiltration nor moved Hanoi to talk; the war at a "turning point" toward a settlement or a dangerous escalation. Fulbright, Mansfield, Morse, Gore, Clark, Pell and McCarthy on one side of the questioning; Sparkman, Lausche and Symington on the other.'
    n: 'Daily Digest, [113 Cong. Rec. D36](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=34). [[w.gibbons-u-s-government-and]], IV, 501. To check: Senate Comm. on Foreign Relations, *Harrison E. Salisbury''s Trip to North Vietnam: Hearing*, 90th Cong., 1st Sess. (1967). See [[cal.1967-01-13.vietnam]]. Names: Salisbury, Fulbright, Mansfield, Morse, Gore, Clark, Pell, McCarthy, Sparkman, Lausche, Symington.'
    tags: [name:salisbury-harrison-e, name:fulbright-j-william, name:mansfield-mike, name:morse-wayne, name:gore-albert-sr, name:clark-joseph-s, name:pell-claiborne-d, name:mccarthy-eugene-j, name:sparkman-john, name:lausche-frank-j, name:symington-william-s]
  - id: cal.1967-02-05.opinion
    when: Feb. 5
    date: '1967-02-05'
    thread: opinion
    also: [congress]
    c: 'Gallup, Jan. 26–31: have heard of the inquiry whether Powell should keep his seat, 88 percent. Of them: should keep it 20, should not 63. Negroes 2 to 1 that he should. Misuse of Government funds by congressmen fairly common: yes 60, no 21.'
    n: '[[w.gallup-poll]], III, 2048. Names: Powell.'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1967-02-06.crime-and-hijacking
    when: Feb. 6
    date: '1967-02-06'
    thread: crime-and-hijacking
    c: 'Message on crime. A Safe Streets and Crime Control Act: planning grants to States, cities and metropolitan bodies up to 90 percent, grants for programs up to 60 percent; an Office of Law Enforcement and Criminal Justice Assistance in the Justice Department; $50 million for fiscal 1968. Controls on the sale of firearms; a Right of Privacy Act against wiretapping and eavesdropping, but for national security; aid against juvenile delinquency and narcotics.'
    n: 'Special Message to the Congress on Crime in America, [1967 Pub. Papers 134](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=202) (Feb. 6, 1967). To check: [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1967-01-10.program]]; [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-06.robert-kennedy
    when: Feb. 6
    date: '1967-02-06'
    thread: robert-kennedy
    also: [vietnam]
    c: '*Newsweek* reports that Robert Kennedy, back from Europe, brought a peace signal from Hanoi: in Paris, Feb. 1, Manac''h of the French Foreign Ministry had told him what Hanoi would take as the condition of talks (Check the day). Feb. 6, Kennedy with Johnson in the White House, Katzenbach and Rostow present (Check): Johnson, the leak was Kennedy''s; Kennedy, it was State''s. Kennedy to the press after: he brought home no peace feelers.'
    n: 'Rostow to Johnson on the *Newsweek* report, Feb. 6: FRUS 1964–68, V, doc. [38](https://history.state.gov/historicaldocuments/frus1964-68v05/d38). [[w.schlesinger-robert-kennedy-and-his]], 764–69; [[w.dallek-flawed-giant]], 447 (the meeting of Feb. 6). [[w.gibbons-u-s-government-and]], IV, 551–52 (the meeting, 4:34 to 5:52 p.m., Katzenbach and Rostow present, by Schlesinger''s account). To check: [[w.shesol-mutual-contempt]]; [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]. See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy, Manac''h, Katzenbach, Rostow, Johnson.'
    tags: [name:kennedy-robert-f, name:manach-etienne-m, name:katzenbach-nicholas, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1967-02-06.vietnam
    when: Feb. 6
    date: '1967-02-06'
    thread: vietnam-sunflower
    also: [soviet-union, europe-and-the-alliance]
    c: 'Sunflower Plus. Kosygin in London, Feb. 6–13. Wilson presses on him the "Phase A–Phase B" formula, given the British in November: the bombing stops first, then both sides stop adding to their forces. Tet truce, Feb. 8–12; no bombing of the North.'
    n: 'FRUS 1964–68, V, doc. [41](https://history.state.gov/historicaldocuments/frus1964-68v05/d41). [[w.drea-mcnamara-clifford-and-the-2011]], 203; [[w.gibbons-u-s-government-and]], IV, 511–18. To check: [[w.ellis-britain-america-and-the]]; [[w.colman-lost-crusader]]. See [[cal.1967-01-04.vietnam]]. Made public: the exchanges with Wilson, [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). Names: Kosygin, Wilson.'
    tags: [name:kosygin-aleksei, name:wilson-harold]
  - id: cal.1967-02-06.vietnam-2
    when: Feb. 6
    date: '1967-02-06'
    thread: vietnam
    c: 'Taylor to Johnson: lacking "a very outstanding civilian," Westmoreland as Ambassador, "the pros outweigh the cons"; Ambassador and commander in chief both, with a military deputy for the forces, a civilian for the rest, a third for the Mission.'
    n: '[[w.gibbons-u-s-government-and]], IV, 576. To check: Taylor to Johnson, Feb. 6, 1967 (LBJ Library). See [[cal.1967-01-31.vietnam]]. Names: Taylor, Johnson, Westmoreland.'
    tags: [name:taylor-maxwell, name:johnson-lyndon-b, name:westmoreland-william]
  - id: cal.1967-02-06.vietnam-support
    when: Feb. 6
    date: '1967-02-06'
    thread: vietnam-support
    c: 'Roche to O''Brien, Rostow copied: assume the war unsettled by the 1968 election; the "Korean whipsaw," the war party three days a week, the party of appeasement the other three. State "simply incompetent" at informing the administration''s friends; a small office in the White House under Harold Kaplan: the Vietnam Information Group.'
    n: '[[w.gibbons-u-s-government-and]], IV, 603. To check: Roche to O''Brien, Feb. 6, 1967 (LBJ Library, NSF Name File, Roche Memos). Names: Roche, O''Brien, Rostow.'
    tags: [name:roche-john-p, name:obrien-lawrence-f, name:rostow-walt-w]
  - id: cal.1967-02-07.soviet-union-consular
    when: Feb. 7
    date: '1967-02-07'
    thread: soviet-union-consular
    c: 'Helms with Russell and Dirksen on the consular convention: the Intelligence Board, the Joint Chiefs and McNamara for it.'
    n: 'FRUS 1964–68, XIV, doc. [199](https://history.state.gov/historicaldocuments/frus1964-68v14/d199) (Feb. 9). Made public: FRUS 1964–68, XIV (2001). See [[cal.1967-01-20.soviet-union]]. Names: Helms, Russell, Dirksen, McNamara.'
    tags: [name:helms-richard, name:russell-richard-b, name:dirksen-everett, name:mcnamara-robert-s]
  - id: cal.1967-02-08.vietnam
    when: Feb. 8
    date: '1967-02-08'
    thread: vietnam-sunflower
    c: 'Moscow, 1 a.m.: Guthrie hands Lê Trang Johnson''s letter to Hồ Chí Minh: he will stop the bombing of the North and stop adding to American forces in the South "as soon as I am assured that infiltration into South Viet-Nam by land and by sea has stopped"; direct talks in Moscow, Burma or elsewhere. Lê Trang: it shows an "absence of goodwill." Washington, the NSC: Wheeler, a promise to talk not enough to stop the bombing; McNamara, it could stop for "a symmetrical de-escalation." Johnson''s reply to Paul VI''s appeal of Feb. 7: no cut in military action unless the other side does likewise.'
    n: 'FRUS 1964–68, V, docs. [40](https://history.state.gov/historicaldocuments/frus1964-68v05/d40), [42](https://history.state.gov/historicaldocuments/frus1964-68v05/d42), [43](https://history.state.gov/historicaldocuments/frus1964-68v05/d43). The President''s Reply to a Message From Pope Paul VI on Vietnam, [1967 Pub. Papers 162](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=230) (Feb. 8, 1967). Made public: Hanoi''s release of the letters, Mar. 21, 1967. See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang, Hồ Chí Minh, Wheeler, McNamara, Paul VI, Johnson.'
    tags: [name:guthrie-john-c, name:le-trang, name:ho-chi-minh, name:wheeler-earle, name:mcnamara-robert-s, name:paul-vi, name:johnson-lyndon-b]
  - id: cal.1967-02-08.congress
    when: Feb. 8
    date: '1967-02-08'
    thread: congress-powell
    c: 'Powell before the select committee, Celler its chairman: he answers only on his age, citizenship and residence.'
    n: '*In re Adam Clayton Powell: Hearings before the Select Committee Pursuant to H. Res. 1*, 90th Cong., 1st sess. (1967) (Check: the title and a copy). See [[cal.1967-01-10.congress]]. Names: Powell, Celler.'
    tags: [name:powell-adam-clayton-jr, name:celler-emanuel]
  - id: cal.1967-02-08.economy
    when: Feb. 8
    date: '1967-02-08'
    thread: economy-debt-limit
    c: 'The debt limit, H.R. 4573: to $336 billion. House: the closed rule, [223–183](https://voteview.com/rollcall/RH0900006); recommittal to bring under the ceiling the $3 billion of participation certificates sold this fiscal year, refused, [155–261](https://voteview.com/rollcall/RH0900007); passed, [215–199](https://voteview.com/rollcall/RH0900008), the limit temporary.'
    n: '[113 Cong. Rec., House, Feb. 8, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt3/pdf/GPO-CRECB-1967-pt3-1-2.pdf). Opinion: [42 Op. Att''y Gen. 341](https://archive.org/details/op-atty-gen/042/page/n365/mode/1up) (1967), Clark, Acting Attorney General, to the Secretary of the Treasury, Feb. 3: FNMA''s participation certificates not counted against the debt limit; they sell interests in assets, not borrowing. To check: [[w.congress-and-the-nation-1969]]. See [[cal.1967-01-24.economy]].'
  - id: cal.1967-02-08.poverty
    when: Feb. 8
    date: '1967-02-08'
    thread: poverty
    also: [welfare, school-aid]
    c: 'Message on children and youth, twelve points: Head Start "Follow Through" in the early grades, and Head Start for younger children; a pilot lunch program for preschool children; child and parent centers in the poorest areas; social security up for 3 million children; aid against mental retardation; a pilot program of dental care; grants against juvenile delinquency.'
    n: 'Special Message to the Congress Recommending a 12-Point Program for America''s Children and Youth, [1967 Pub. Papers 150](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=218) (Feb. 8, 1967). To check: [[w.zigler-head-start]]. See [[cal.1966-11-08.poverty]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-08.opinion
    when: Feb. 8
    date: '1967-02-08'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Jan. 7–12: U Thant''s plan, the United States to end the bombing of the North, reduce its military activity, and talk with the Viet Cong as well as Hanoi: accept 40 percent, reject 41. The United States and its allies losing ground 10, standing still 41, making progress 31.'
    n: '[[w.gallup-poll]], III, 2048. Names: U Thant.'
    tags: [name:u-thant]
  - id: cal.1967-02-08.robert-kennedy
    when: Feb. 8
    date: '1967-02-08'
    thread: robert-kennedy
    also: [china]
    c: 'Chicago, the University of Chicago''s conference on China (Check). Robert Kennedy: Vietnam''s communism "a native growth, with its own revolutionary traditions and dynamism," not Chinese-inspired; a China policy in "conscious and open recognition that we live in the same world."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 769–70. Check: the text. See [[cal.1967-02-06.robert-kennedy]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f]
  - id: cal.1967-02-09.foreign-aid
    when: Feb. 9
    date: '1967-02-09'
    thread: foreign-aid
    c: 'Foreign aid message: slightly over $3.1 billion under the Foreign Assistance Act for fiscal 1968, some $2.5 billion of it economic, almost $600 million military. More than $1 billion for agriculture, education and health. $200 million for the Asian Development Bank''s special funds, over several years, on the Black mission''s advice. Latin America $624 million; the Near East and South Asia $758 million.'
    n: 'Special Message to the Congress on Foreign Aid, [1967 Pub. Papers 164](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=232) (Feb. 9, 1967). To check: [[w.ruttan-united-states-development-assistance]]. See [[cal.1966-09-19.foreign-aid]]. Names: Johnson, Black.'
    tags: [name:johnson-lyndon-b, name:black-eugene-r]
  - id: cal.1967-02-10.succession
    when: Feb. 10
    date: '1967-02-10'
    thread: succession
    also: [amendments]
    c: 'Twenty-fifth Amendment ratified: Minnesota and Nevada, the 37th and 38th States.'
    n: 'Certified Feb. 23: Remarks at Ceremony Marking the Ratification of the Presidential Inability (25th) Amendment to the Constitution, [1967 Pub. Papers 217](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=285) (Feb. 23, 1967). To check: [[w.feerick-twenty-fifth-amendment]]. See [[cal.1965-07-06.succession]]; [[cal.1966-07-05.succession-us]]. Check: the States'' records of ratification.'
  - id: cal.1967-02-10.vietnam-sunflower
    when: Feb. 10
    date: '1967-02-10'
    thread: vietnam-sunflower
    c: 'Washington''s text, to go to Kosygin in London: the bombing to stop when the United States is assured that infiltration "has stopped."'
    n: 'FRUS 1964–68, V, doc. [51](https://history.state.gov/historicaldocuments/frus1964-68v05/d51). See [[cal.1967-02-06.vietnam]]. Names: Kosygin.'
    tags: [name:kosygin-aleksei]
  - id: cal.1967-02-11.students-ca
    when: Feb. 11
    date: '1967-02-11'
    thread: students
    also: [state-and-city-finance]
    c: 'Sacramento. Students and faculty march on the Capitol against tuition and the cuts. Reagan to them from the west steps: no Regent to campaign for him; the people "have some right to a voice in the principles and basic philosophy" of the education they pay for.'
    n: '[Governor Ronald Reagan''s Remarks to Marchers on the West Steps of the Capitol](https://www.reaganlibrary.gov/archives/speech/february-11-1967-governor-ronald-reagans-remarks-marchers-west-steps-capitol) (Reagan Library). See [[cal.1967-01-17.students-ca]]; [[cal.1967-01-20.students]]. Names: Reagan. Check: the marchers'' number.'
    tags: [state:ca, name:reagan-ronald]
  - id: cal.1967-02-11.vietnam
    when: Feb. 11
    date: '1967-02-11'
    thread: vietnam
    c: 'Katzenbach to Johnson: Westmoreland as Ambassador "unwise"; no serious objection if he first resigned from the Army and no outstanding civilian were found, but more valuable as commander.'
    n: '[[w.gibbons-u-s-government-and]], IV, 576–77. To check: Katzenbach to Johnson, Feb. 11, 1967 (LBJ Library). See [[cal.1967-01-31.vietnam]]. Names: Katzenbach, Johnson, Westmoreland.'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b, name:westmoreland-william]
  - id: cal.1967-02-12.opinion
    when: Feb. 12
    date: '1967-02-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Jan. 26–31: Republicans'' choice for 1968: Nixon 39 percent, Romney 28, Rockefeller 11, Reagan 7, Percy 6, Hatfield 3, Lindsay 2; no preference 4. Independents: Nixon 30, Romney 28, Rockefeller 15, Reagan 9. Of the two: Romney 45, Nixon 41. Republicans, Nixon 52, Romney 40; Democrats, Romney 50, Nixon 34.'
    n: '[[w.gallup-poll]], III, 2048–49. Names: Nixon, Romney, Rockefeller, Reagan, Percy, Hatfield, Lindsay.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:rockefeller-nelson, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v]
  - id: cal.1967-02-12.vietnam-sunflower
    when: Feb. 12
    date: '1967-02-12'
    thread: vietnam-sunflower
    c: 'Johnson to Wilson: no bombing if Hanoi gives that assurance by 10 a.m. London time Feb. 13. Extended six hours. No reply.'
    n: 'FRUS 1964–68, V, docs. [64](https://history.state.gov/historicaldocuments/frus1964-68v05/d64), [70](https://history.state.gov/historicaldocuments/frus1964-68v05/d70), [74](https://history.state.gov/historicaldocuments/frus1964-68v05/d74). See [[cal.1967-02-06.vietnam]]. Names: Wilson, Johnson.'
    tags: [name:wilson-harold, name:johnson-lyndon-b]
  - id: cal.1967-02-13.vietnam-sunflower
    when: Feb. 13
    date: '1967-02-13'
    thread: vietnam-sunflower
    also: [europe-and-the-alliance]
    c: 'Bombing of the North resumed. Christian reads Johnson''s statement: Hanoi used the truces for "major resupply efforts." Wilson to the Commons: a settlement "could have been very near."'
    n: 'FRUS 1964–68, V, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v05/d76), [80](https://history.state.gov/historicaldocuments/frus1964-68v05/d80). Statement by the President on the Resumption of Bombing in North Vietnam, [1967 Pub. Papers 178](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=246) (Feb. 13, 1967). See [[cal.1967-02-06.vietnam]]. Names: Christian, Wilson, Johnson.'
    tags: [name:christian-george, name:wilson-harold, name:johnson-lyndon-b]
  - id: cal.1967-02-13.intelligence
    when: Feb. 13–15
    date: '1967-02-13'
    thread: intelligence
    also: [students]
    c: The National Student Association's officers confirm that the CIA has paid for its international program since the early 1950s, ahead of *Ramparts*'s March issue (Check the day). Feb. 14, *Ramparts*'s advertisements in the *Times* and the *Post*, and stories on the front page of both; Feb. 15, reports of CIA money through foundations to other youth groups abroad. Feb. 15, Johnson names Katzenbach, Gardner and Helms to review the CIA's relations with private voluntary organizations working abroad.
    n: 'FRUS 1964–68, XXXIII, doc. [260](https://history.state.gov/historicaldocuments/frus1964-68v33/d260); X, doc. [171](https://history.state.gov/historicaldocuments/frus1964-68v10/d171). To check: [[w.paget-patriotic-betrayal]]; [[w.wilford-mighty-wurlitzer]]. Names: Katzenbach, Gardner, Helms, Johnson.'
    tags: [name:katzenbach-nicholas, name:gardner-john-w, name:helms-richard, name:johnson-lyndon-b]
  - id: cal.1967-02-13.electoral-college
    when: Feb. 13
    date: '1967-02-13'
    thread: electoral-college
    c: 'The American Bar Association''s House of Delegates approves the report of its Commission on Electoral College Reform, *Electing the President*, dated January: the President by direct, nationwide popular vote; a plurality of at least 40 percent to win; failing it, a national runoff between the two highest. Fifteen members, appointed February 1966; Storey of Dallas chairman; Governors Bellmon and Kerner, Keating and Walter Reuther among them.'
    n: '*Electing the President: A Report of the Commission on Electoral College Reform* (1967), printed in *Election of the President* hearings, [715–21](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=725); the members, [316–17](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=326). See [[cal.1967-01-11.electoral-college]]. Names: Storey, Bellmon, Kerner, Keating, Walter Reuther.'
    tags: [name:storey-robert-g, name:bellmon-henry, name:kerner-otto, name:keating-kenneth-b, name:reuther-walter, ok:result-form]
  - id: cal.1967-02-13.vietnam
    when: Feb. 13
    date: '1967-02-13'
    thread: vietnam-sunflower
    c: 'Johnson with Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor and Wheeler, 8:29 to 10:45 a.m., on Bruce''s plea for more time before the bombing resumes. Humphrey for it; Wheeler: "a political decision"; McNamara alone against: should Hanoi send a "moderated no ... and we haven''t bombed, we''re in a hell of a fix." Johnson grants three hours more.'
    n: '[[w.gibbons-u-s-government-and]], IV, 517–18. To check: Tom Johnson''s notes of the meeting, Feb. 13, 1967 (LBJ Library). See [[cal.1967-02-06.vietnam]]. Names: Johnson, Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor, Wheeler, Bruce.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:mcnamara-robert-s, name:katzenbach-nicholas, name:vance-cyrus, name:rostow-walt-w, name:bundy-william, name:kohler-foy-d, name:taylor-maxwell, name:wheeler-earle, name:bruce-david-k-e]
  - id: cal.1967-02-14.congress-powell
    when: Feb. 14
    date: '1967-02-14'
    thread: congress-powell
    c: 'Powell''s counsel before the select committee, Powell absent: the standing qualifications the sole test; no punishment before a member is seated.'
    n: 'Check: the hearings'' pages. See [[cal.1967-02-08.congress]]. Names: Powell.'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1967-02-14.states-and-cities-ar
    when: Feb. 14
    date: '1967-02-14'
    thread: states-and-cities
    also: [press-and-broadcasting]
    c: 'Arkansas. Winthrop Rockefeller, inaugurated Jan. 10, the first Republican governor since Reconstruction, signs the Freedom of Information Act: public records open to any citizen, meetings of public bodies open.'
    n: 'Ark. Acts 1967, No. 93 (Ark. Code Ann. § 25-19-101 et seq.). [Encyclopedia of Arkansas, "Arkansas Freedom of Information Act"](https://encyclopediaofarkansas.net/entries/arkansas-freedom-of-information-act-4599/). To check: [[w.urwin-agenda-for-reform]]; [[w.ward-arkansas-rockefeller]]. See [[cal.1966-11-08.governors-ar]]. Names: Winthrop Rockefeller.'
    tags: [state:ar, name:rockefeller-winthrop]
  - id: cal.1967-02-14.opinion
    when: Feb. 14
    date: '1967-02-14'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Jan. 26–31: Romney 50 percent, Johnson 42, undecided 8. East: Johnson 48, Romney 44. South: Romney 50, Johnson 45. West: Romney 56, Johnson 39.'
    n: '[[w.gallup-poll]], III, 2049. Names: Romney, Johnson.'
    tags: [name:romney-george-w, name:johnson-lyndon-b]
  - id: cal.1967-02-15.vietnam
    when: Feb. 15
    date: '1967-02-15'
    thread: vietnam-sunflower
    c: 'Moscow. Lê Trang gives Guthrie Hồ Chí Minh''s reply, received, it says, Feb. 10: the United States must stop the bombing "definitively and unconditionally," withdraw its troops and its allies'', recognize the National Liberation Front; talks only after the bombing and all other acts of war against the North stop unconditionally. Lê Trang: he can no longer meet American representatives in Moscow.'
    n: 'FRUS 1964–68, V, docs. [81](https://history.state.gov/historicaldocuments/frus1964-68v05/d81), [82](https://history.state.gov/historicaldocuments/frus1964-68v05/d82). Made public: Hanoi''s release of the letters, Mar. 21, 1967. See [[cal.1967-01-04.vietnam]]; [[cal.1967-02-08.vietnam]]. Names: Lê Trang, Guthrie, Hồ Chí Minh.'
    tags: [name:le-trang, name:guthrie-john-c, name:ho-chi-minh]
  - id: cal.1967-02-15.open-housing
    when: Feb. 15
    date: '1967-02-15'
    thread: open-housing
    c: 'Message on equal justice, the civil rights program of 1967. Discrimination in housing outlawed by stages: at once, housing under the order of 1962; in 1968, dwellings sold or rented by others than their occupants and buildings for five or more families; all housing in 1969. Crimes of violence against those exercising named rights made federal, with civil suits for the victims. Discrimination in choosing federal and State juries barred, the Attorney General to sue. The Equal Employment Opportunity Commission to issue enforceable cease-and-desist orders. The Civil Rights Commission extended five years.'
    n: 'Special Message to the Congress on Equal Justice, [1967 Pub. Papers 184](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=252) (Feb. 15, 1967). To check: [[w.graham-civil-rights-era]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1966-09-14.open-housing]]; [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-16.consumers
    when: Feb. 16
    date: '1967-02-16'
    thread: consumers
    c: 'Message "To Protect the American Consumer." A Truth-in-Lending Act: the cost of credit stated as a yearly percentage rate. An Interstate Land Sales Full Disclosure Act; a Welfare and Pension Plan Protection Act; mutual funds'' charges regulated. Safety of medical devices; meat inspection''s gaps closed; hazardous household products; fire safety; electric power failures; natural gas pipelines.'
    n: 'Special Message to the Congress "To Protect the American Consumer", [1967 Pub. Papers 196](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=264) (Feb. 16, 1967). To check: [[w.nadel-politics-of-consumer-protection]]. See [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-17.assassination
    when: Feb. 17
    date: '1967-02-17'
    thread: assassination-garrison
    c: New Orleans. The *States-Item* reports that Garrison, the district attorney, is investigating the assassination.
    n: 'To check: [[w.epstein-counterplot]]; [[w.kirkwood-american-grotesque]]; [[w.lambert-false-witness]]. See [[cal.1967-01-03.assassination]]. Check: the *States-Item*''s page. Names: Garrison.'
    tags: [name:garrison-jim]
  - id: cal.1967-02-17.vietnam
    when: Feb. 17
    date: '1967-02-17'
    thread: vietnam
    also: [vietnam-air-war]
    c: 'Johnson with McNamara, Wheeler, Taylor and Rostow, 12:25 to 2:04 p.m., no one from State. Wheeler for bombing the steel and cement plants and the North''s power grid, 138,000 kilowatts: pressure on the economy and on Hanoi''s will, no major direct military effect. Johnson wants courses of action for Feb. 22.'
    n: 'FRUS 1964–68, V, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84). [[w.gibbons-u-s-government-and]], IV, 558–60 (the hour; Wheeler''s cables to Sharp and Westmoreland, JCS 1284-67, Feb. 17, and of Feb. 18: "a new sense of urgency in the atmosphere"). Made public: FRUS 1964–68, V (2002). Names: Johnson, McNamara, Wheeler, Taylor, Rostow.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:wheeler-earle, name:taylor-maxwell, name:rostow-walt-w]
  - id: cal.1967-02-18.crime-and-hijacking
    when: Feb. 18
    date: '1967-02-18'
    thread: crime-and-hijacking
    c: '*The Challenge of Crime in a Free Society*, the report of the President''s Commission on Law Enforcement and Administration of Justice, Katzenbach chairman: more than 200 recommendations, on police, courts, corrections, juvenile delinquency, organized crime, narcotics and firearms (Check the count). Its last words: "America can control crime if it will."'
    n: 'Statement by the President Concerning the Report of the President''s Commission on Law Enforcement and Administration of Justice, [1967 Pub. Papers 208](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=276) (Feb. 18, 1967). To check: [[w.justice-challenge-of-crime-in]]; [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1965-07-23.crime-and-hijacking]]. Names: Katzenbach.'
    tags: [name:katzenbach-nicholas, name:johnson-lyndon-b]
  - id: cal.1967-02-20.students
    when: Feb. 20
    date: '1967-02-20'
    thread: students
    also: [war-opposition]
    c: Stanford, Cal. Some 100 of 1,700 students walk out of Humphrey's speech after an all-night teach-in; some 300 rush his car as he leaves, "Shame, shame."
    n: '[[w.gibbons-u-s-government-and]], IV, 555. To check: *Washington Post*, Feb. 21, 1967. Names: Humphrey.'
    tags: [name:humphrey-hubert-h, state:ca]
  - id: cal.1967-02-20.vietnam-congress
    when: Feb. 20
    date: '1967-02-20'
    thread: vietnam-congress
    c: 'Commager before the Foreign Relations Committee, "Changing American Attitudes Toward Foreign Policy": the war a mistake, supported by neither the SEATO Treaty nor the Tonkin Gulf resolution; turn it over to the United Nations. Of the intellectuals: no war "where the hostility was so deep or so widespread."'
    n: 'Daily Digest, [113 Cong. Rec. D57](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=55). [[w.gibbons-u-s-government-and]], IV, 582–83. To check: Senate Comm. on Foreign Relations, *Changing American Attitudes Toward Foreign Policy: Hearing*, 90th Cong., 1st Sess. (1967), 3–18, 47–48. See [[cal.1967-01-30.vietnam-congress]].'
  - id: cal.1967-02-20.vietnam-supplemental
    when: Feb. 20
    date: '1967-02-20'
    thread: vietnam-supplemental
    also: [vietnam-congress]
    c: 'McNamara before the House Appropriations subcommittees on the supplemental. Minshall: the "''we are the aggressors'' sentiment" a ripple two or three years ago, "Now it is becoming a big swell." Andrews: "fast getting to be a ''Dove.''" McNamara: two minorities, out and win faster, both lacking patience. Laird, on his letter to Johnson of Feb. 9: the Viet Cong could fight on without the North.'
    n: '[[w.gibbons-u-s-government-and]], IV, 596–97. To check: House Comm. on Appropriations, *Supplemental Defense Appropriations for 1967: Hearings*, 90th Cong., 1st Sess. (1967), 40–48, 60–62, 67, 113–14. Check: Gibbons puts the hearings in the last week of February and the exchange on Feb. 20. Names: McNamara, Minshall, Andrews, Laird, Johnson.'
    tags: [name:mcnamara-robert-s, name:minshall-william-e-jr, name:andrews-george-w, name:laird-melvin-r, name:johnson-lyndon-b]
  - id: cal.1967-02-21.economy-debt-limit
    when: Feb. 21
    date: '1967-02-21'
    thread: economy-debt-limit
    c: Senate passes the debt limit, H.R. 4573, the limit permanent, [54–23](https://voteview.com/rollcall/RS0900019).
    n: 'Check: the Record''s page. See [[cal.1967-02-08.economy]].'
  - id: cal.1967-02-21.vietnam-congress
    when: Feb. 21
    date: '1967-02-21'
    thread: vietnam-congress
    c: 'Gavin before the Foreign Relations Committee, "Conflicts Between United States Capabilities and Foreign Commitments," the last of the series: "What is now needed is a political solution"; against the bombing of the North; talks with Hồ and the NLF for a neutral, non-Communist Vietnam on the Laos model of 1962. "I am afraid that our society is going to be torn apart."'
    n: 'Daily Digest, [113 Cong. Rec. D59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=57). [[w.gibbons-u-s-government-and]], IV, 583–84. To check: Senate Comm. on Foreign Relations, *Conflicts Between United States Capabilities and Foreign Commitments: Hearing*, 90th Cong., 1st Sess. (1967), 3–4, 25–27. See [[cal.1967-01-30.vietnam-congress]]. Names: Gavin.'
    tags: [name:gavin-james-m]
  - id: cal.1967-02-22.vietnam
    when: Feb. 22
    date: '1967-02-22'
    thread: vietnam-operations
    c: 'Junction City, in War Zone C, Tây Ninh Province, toward the Cambodian border, begins: the 1st and 25th Infantry Divisions and other units, against the Viet Cong''s headquarters for the South. A battalion of the 173rd Airborne Brigade parachutes in, the first American combat jump of the war (Check).'
    n: '[[w.vietnam-victory-in-vietnam]], 197–99, 465 nn.30–32. To check: [[w.rogers-cedar-falls-junction-city]]. See [[cal.1967-01-08.vietnam]]. Check: *Victory in Vietnam* gives the attackers as 45,000 men, 11,000 vehicles and 600 aircraft; their losses 14,000 men, 112 guns, 775 tanks and armored vehicles, and 160 aircraft; the defenders'' dead 280 (198–99, 465 n.32).'
    tags: [place:junction-city, place:war-zone-c]
  - id: cal.1967-02-22.vietnam-2
    when: Feb. 22
    date: '1967-02-22'
    thread: vietnam
    c: 'Johnson with McNamara, Eugene Rostow, Taylor and Wheeler, 1:15 to 3:25 p.m.; no notes found. On the Joint Chiefs'' three programs, by Walt Rostow''s notations and Wheeler''s cable the next day: Rolling Thunder 54, the steel plant and the power plant at Thái Nguyên and the power plants at Việt Trì, Bắc Giang and Hòn Gai added; inland waterways and estuaries south of the 20th parallel mined; naval gunfire at shipping and shore targets to the 20th; artillery from the South into the DMZ, the North and Laos; Shining Brass widened; Popeye, the seeding of clouds over the trail, approved. Not announced.'
    n: 'FRUS 1964–68, V, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84), [88](https://history.state.gov/historicaldocuments/frus1964-68v05/d88). [[w.gibbons-u-s-government-and]], IV, 562–68 (the decisions: Walt Rostow''s notations on his agenda and Wheeler''s cable to Sharp and Westmoreland, JCS 1422-67, Feb. 23); [[w.drea-mcnamara-clifford-and-the-2011]], 135. To check: [[w.berman-lyndon-johnsons-war]]. See [[cal.1967-02-06.vietnam]]. Check: Drea, 135, has Rusk at the meeting; FRUS 1964–68, V, doc. 88, n. 2, from the Daily Diary, lists Eugene Rostow, not Rusk. Names: McNamara, Eugene Rostow, Taylor, Wheeler, Johnson, Walt Rostow.'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rostow-eugene, name:taylor-maxwell, name:wheeler-earle, name:rostow-walt-w]
  - id: cal.1967-02-22.assassination-garrison
    when: Feb. 22
    date: '1967-02-22'
    thread: assassination-garrison
    c: 'New Orleans. Ferrie, whom Garrison has questioned, found dead in his apartment; the coroner: natural causes (Check).'
    n: 'Check: the coroner''s report. See [[cal.1967-02-17.assassination]]. Names: Garrison, Ferrie.'
    tags: [name:garrison-jim, name:ferrie-david-w]
  - id: cal.1967-02-22.opinion
    when: Feb. 22
    date: '1967-02-22'
    thread: opinion
    also: [draft, health]
    c: 'Gallup, Jan. 7–12: young women drafted for medical service, as young men are for war service, against a shortage of 500,000 nurses, aides and helpers: approve 34 percent, disapprove 58. Those 21 to 29: 27 and 70.'
    n: '[[w.gallup-poll]], III, 2051–52.'
  - id: cal.1967-02-23.congress-powell
    when: Feb. 23
    date: '1967-02-23'
    thread: congress-powell
    c: 'The select committee''s report: Powell meets the qualifications; he asserted an unwarranted privilege and immunity from the processes of New York''s courts, diverted House funds to himself and others, and made false reports on foreign currency. To be seated, censured, fined $40,000, and stripped of seniority.'
    n: 'H.R. Rep. No. 27, 90th Cong., 1st Sess., 31–33 (1967), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 490–92 (1969) (K–J Cong. II.J.1). See [[cal.1967-02-08.congress]]. Names: Powell.'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1967-02-23.economy-debt-limit
    when: Feb. 23
    date: '1967-02-23'
    thread: economy-debt-limit
    c: The debt limit. The House's temporary limit kept in conference; the Senate agrees, [39–31](https://voteview.com/rollcall/RS0900020).
    n: '[113 Cong. Rec., Senate, Feb. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-1-1.pdf). See [[cal.1967-02-08.economy]].'
  - id: cal.1967-02-23.succession
    when: Feb. 23
    date: '1967-02-23'
    thread: succession
    also: [amendments]
    c: The Administrator of General Services certifies the Twenty-fifth Amendment, [32 Fed. Reg. 3287](https://www.govinfo.gov/content/pkg/FR-1967-02-25/pdf/FR-1967-02-25.pdf#page=4), [81 Stat. 983](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg983.pdf). Johnson in the East Room with Bayh and Celler, who brought it through Congress.
    n: 'Remarks at Ceremony Marking the Ratification of the Presidential Inability (25th) Amendment to the Constitution, [1967 Pub. Papers 217](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=285) (Feb. 23, 1967). See [[cal.1967-02-10.succession]]. Names: Knott, Bayh, Celler, Johnson.'
    tags: [name:johnson-lyndon-b, name:knott-lawson-b-jr, name:bayh-birch, name:celler-emanuel]
  - id: cal.1967-02-23.vietnam-supplemental
    when: Feb. 23
    date: '1967-02-23'
    thread: vietnam-supplemental
    also: [vietnam-congress]
    c: 'The Senate takes up the supplemental authorization. Clark''s amendment, Morse with him, a "Statement of Congressional Policy": no funds of this or any act for operations in or over the North, or for more than 500,000 men in the South, without a declaration of war. His second: support for the forces, a negotiated settlement, the Geneva agreement of 1954 and its conference reconvened.'
    n: '[113 Cong. Rec., Senate, Feb. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-1-1.pdf), 4295–96 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 587–88. The vote: [[cal.1967-03-01.vietnam]]. Names: Joseph Clark, Morse.'
    tags: [name:clark-joseph-s, name:morse-wayne]
  - id: cal.1967-02-24.vietnam-congress
    when: Feb. 24
    date: '1967-02-24'
    thread: vietnam-congress
    c: 'Marcy to Fulbright: to keep "the initiative of influence," invite witnesses who disagree, McCone, McGeorge Bundy, LeMay, Shoup; a committee trip to Tokyo, Hong Kong, Saigon and Bangkok; a declaration of the minimum terms of a settlement, his draft attached, the bombing to cease. None done; instead four coffees for interested Senators at the committee''s offices.'
    n: '[[w.gibbons-u-s-government-and]], IV, 584–85 (and Fulbright''s account of the coffees, CRS interview, Feb. 18, 1983). To check: Marcy to Fulbright, Feb. 24, 1967 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, McCone, McGeorge Bundy, LeMay, Shoup.'
    tags: [name:marcy-carl, name:fulbright-j-william, name:mccone-john-a, name:bundy-mcgeorge, name:lemay-curtis-e, name:shoup-david-m]
  - id: cal.1967-02-25.war-opposition
    when: Feb. 25
    date: '1967-02-25'
    thread: war-opposition
    also: [king]
    c: 'Beverly Hills, Cal. King, at a symposium of *The Nation* with Hatfield, McCarthy and Gruening: "The Casualties of the War in Vietnam," his first address given wholly to the war (Check the place and the sponsor).'
    n: '[[w.garrow-bearing-the-cross]], 542, 545. To check: [[w.branch-at-canaans-edge]]; [[w.debenedetti-american-ordeal]]; [[w.wells-war-within]]; [[w.small-johnson-nixon-and-the]]. Check: Garrow, 542, 545, has *The Nation*''s forum in Los Angeles and McGovern a fourth senator. Names: Martin Luther King, Hatfield, McCarthy, Gruening.'
    tags: [name:king-martin-luther-jr, name:hatfield-mark-o, name:mccarthy-eugene-j, name:gruening-ernest]
  - id: cal.1967-02-25.transportation
    when: Feb. 25
    date: '1967-02-25'
    thread: transportation
    c: 'Clark, Acting Attorney General, to Boyd: the President may impound federal-aid highway funds apportioned to the States until the Secretary approves a project. Appropriations permit spending, not compel it; the States have no right to the funds before approval.'
    n: '[42 Op. Att''y Gen. 347](https://archive.org/details/op-atty-gen/042/page/n371/mode/1up) (1967). To check: [[w.fisher-presidential-spending-power]]. See [[cal.1966-11-29.economy]]. Names: Clark, Boyd.'
    tags: [name:clark-ramsey, name:boyd-alan-s]
  - id: cal.1967-02-26.opinion
    when: Feb. 26
    date: '1967-02-26'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Feb. 16–21: the bombing of North Vietnam: continue 67 percent, stop 24. The United States made a mistake in sending troops: yes 32, no 52.'
    n: '[[w.gallup-poll]], III, 2052.'
  - id: cal.1967-02-27.defense
    when: Feb. 27–28
    date: '1967-02-27'
    thread: defense-abm
    also: [soviet-union]
    c: 'Kosygin''s reply on the strategic arms, given Thompson by Gromyko Feb. 28: ready to continue the exchange of views; offensive and defensive missiles to be taken together; a meeting of representatives not excluded; better conditions if Vietnam were settled. Gromyko''s oral statement: the present balance no "stability" to preserve.'
    n: 'FRUS 1964–68, XI, docs. [185](https://history.state.gov/historicaldocuments/frus1964-68v11/d185), [186](https://history.state.gov/historicaldocuments/frus1964-68v11/d186), [187](https://history.state.gov/historicaldocuments/frus1964-68v11/d187). Made public: FRUS 1964–68, XI (1997). See [[cal.1967-01-04.defense]]. Names: Kosygin, Thompson, Gromyko.'
    tags: [name:kosygin-aleksei, name:thompson-llewellyn-e, name:gromyko-andrei]
  - id: cal.1967-02-27.vietnam
    when: Feb. 27
    date: '1967-02-27'
    thread: vietnam
    c: 'News conference. Reported from Saigon over the weekend: naval gunfire against the North''s coast, mines in its rivers, long-range artillery fire into the North. Johnson: activity "that we would not say has been normal through the past weeks"; no recognition of a failure of diplomacy, "None whatever."'
    n: 'The President''s News Conference, [1967 Pub. Papers 219](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=287) (Feb. 27, 1967). [[w.gibbons-u-s-government-and]], IV, 568. See [[cal.1967-02-22.vietnam-2]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-27.amendments
    when: Feb. 27
    date: '1967-02-27'
    thread: amendments
    also: [states-and-cities]
    c: 'Special message on the Nation''s Capital. An amendment asked: one Representative for the District, and such more in the House and the Senate as Congress provides. Until then a nonvoting Delegate, by statute. "They are taxed without representation."'
    n: 'Special Message to the Congress: The Nation''s Capital, [1967 Pub. Papers 226](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=294) (Feb. 27, 1967). To check: [[w.asch-chocolate-city]]; [[w.kyvig-explicit-and-authentic-acts]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-02-27.vietnam-2
    when: Feb. 27
    date: '1967-02-27'
    thread: vietnam
    c: 'McGeorge Bundy to Johnson, "personal," McNamara having pressed him: Bunker for Saigon, "the precise combination of strength and sensitivity that Saigon now needs." He cannot campaign for the post himself this time: a breach of faith with the Ford Foundation''s trustees.'
    n: '[[w.gibbons-u-s-government-and]], IV, 577. To check: Bundy to Johnson, Feb. 27, 1967 (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-01-31.vietnam]]. Names: McGeorge Bundy, Johnson, McNamara, Bunker.'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:mcnamara-robert-s, name:bunker-ellsworth]
  - id: cal.1967-02-28.court
    when: Feb. 28
    date: '1967-02-28'
    thread: court
    also: [transition-and-staff]
    c: Johnson names Ramsey Clark, acting since October, Attorney General. Justice Tom Clark, his father, says he will retire from the Court to avoid any appearance of a conflict.
    n: 'The President''s Remarks to the Press Upon Announcing His Intention To Nominate Ramsey Clark as Attorney General, [1967 Pub. Papers 258](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=326) (Feb. 28, 1967). [[w.dallek-flawed-giant]], 406, 438. To check: [[w.kalman-abe-fortas]]. See [[cal.1966-09-21.transition-and-staff]]. Names: Ramsey Clark, Tom Clark, Johnson.'
    tags: [name:johnson-lyndon-b, name:clark-ramsey, name:clark-tom-c]
  - id: cal.1967-02-28.mayors-chicago
    when: Feb. 28
    date: '1967-02-28'
    thread: mayors
    also: [elections-1967]
    c: 'Chicago primaries for mayor. Democratic: Daley renominated for a fourth term, some 420,000 votes (Check). Republican: John Waner, an air-conditioning contractor and the 23rd Ward''s committeeman, over Doyle, 145,122 to 10,504, 82.5 percent; one other; write-ins 14,644, 8.3 percent.'
    n: 'Votes: [Wikipedia, "1967 Chicago mayoral election"](https://en.wikipedia.org/wiki/1967_Chicago_mayoral_election). Check: the Board of Election Commissioners'' canvass. To check: [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]. See [[cal.1963-04-02.mayors-chicago]]. Names: Daley, Waner.'
    tags: [state:il, city:chicago, name:daley-richard-j, name:waner-john-l]
  - id: cal.1967-02.mississippi
    when: Feb.
    date: 1967-02
    thread: mississippi
    c: Natchez. Wharlest Jackson, just promoted to a job at his plant held before only by whites, killed by a bomb in his car.
    n: '[[w.dittmer-local-people]], 417. Check: the day. See [[cal.1965-08-27.mississippi]]. Names: Wharlest Jackson.'
    tags: [state:ms, name:jackson-wharlest]
  - id: cal.1967-02-28.vietnam-supplemental
    when: Feb. 28
    date: '1967-02-28'
    thread: vietnam-supplemental
    also: [vietnam-congress]
    c: 'The Senate on Clark''s amendment. Russell against: a declaration of war might widen it; repeal the Tonkin Gulf resolution if Congress wants its authority; of 1964, "Personally, at that time I did not contemplate anything of this magnitude"; "strongly opposed to any invasion of North Vietnam." Fulbright: repeal "impractical." Cooper: Congress cannot direct the war. Mansfield offers his substitute, Clark''s second amendment revised.'
    n: '[113 Cong. Rec., Senate, Feb. 28, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-4-1.pdf), 4717–66 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 588–89. See [[cal.1967-02-23.vietnam-supplemental]]. Names: Joseph Clark, Russell, Fulbright, Cooper, Mansfield.'
