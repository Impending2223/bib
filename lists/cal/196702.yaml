  - id: cal.1967-02-28.vietnam-elections
    when: Feb. 28
    date: '1967-02-28'
    thread: vietnam-elections
    c: 'Komer to Johnson, back from Vietnam: Lodge, Westmoreland, Porter and all the Mission''s senior officials "believe that Ky would be at least marginally better than Thieu," and that the winner will come from the military; only Porter and Lansdale strongly favor a civilian government. Porter: the generals "have it too good to want the war to end." Habib: a civilian regime would fear to negotiate lest it bring a coup.'
    n: '[[w.gibbons-u-s-government-and]], IV, 766–67. To check: Komer to Johnson, report on his trip to Vietnam, Feb. 28, 1967, NSF Files of Robert W. Komer, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 766 n.6). Names: Komer, Johnson, Lodge, Westmoreland, Porter, Kỳ, Thiệu, Lansdale, Habib.'
