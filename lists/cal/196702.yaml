    thread: war-opposition
    c: 'Seven leaders of Clergy and Laymen Concerned About Vietnam, after some 2,000 of its members march at the White House, Jan. 31, see Rostow: negotiations will come in time; the administration "under terrific pressure from people who want to go militarily further."'
    n: '[[w.gibbons-u-s-government-and]], IV, 554; [[w.branch-at-canaans-edge]], 577–78 (some two thousand religious leaders; McCarthy on just war; Heschel: "some are guilty but all are responsible"; the delegation with McNamara, Coffin their spokesman). To check: *New York Times*, [Feb. 1](https://timesmachine.nytimes.com/timesmachine/1967/02/01/issue.html) and [Feb. 2, 1967](https://timesmachine.nytimes.com/timesmachine/1967/02/02/issue.html) (cited by [[w.gibbons-u-s-government-and]], IV, 554 nn.89–90); Int. Robert McAfee Brown, July 1, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 577); Friedland, *Lift Up Your Voice Likea Trumpet* (1998), 177–81 (cited by [[w.branch-at-canaans-edge]], 578); Int. Richard Fernandez, Jan. 10, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 578); draft address by Eugene J. McCarthy, Feb. 1, 1967, Series 3, Box 8, CALCAV, SCPC, Background documents on the CALCAV mobilization include minutes of the Sept. 27, 1966, executive committee meeting, Series 1, Box 1, CALCAV, SCPC (cited by [[w.branch-at-canaans-edge]], 578); Richard Fernandez memo of Oct. 4, 1966, Series 3, Box oy GAie= CAV, SCPC (cited by [[w.branch-at-canaans-edge]], 578); Richard Fernandez memo of Dec. 21, 1966, Series 2, Box 2, CALCAV, SCLC: 250 Catholic bishops: Robert McAfee Brown, "An Open Letter to the U.S. Bishops," *Commonweal*, Feb. 17, 1967 (cited by [[w.branch-at-canaans-edge]], 578); [[w.hall-because-of-their-faith]], 33–38 (cited by [[w.branch-at-canaans-edge]], 578); Coffin, *Once to Every Man* (1977), 224–29 (cited by [[w.branch-at-canaans-edge]], 578); Int. John Bennett, Sept. 15, 1990 (Branch) (cited by [[w.branch-at-canaans-edge]], 578); Int. William S. Coffin, July 16, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 578); Int. Robert McAfee Brown, July 17, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 578). Names: Rostow.'
