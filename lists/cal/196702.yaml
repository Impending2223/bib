  - id: cal.1967-02-09.china-leadership
    when: Feb. 9
    date: '1967-02-09'
    thread: china-leadership
    c: 'Mao twice reads and revises the Military Commission''s draft rule that the army, supporting the proletarian left''s seizures of power, is not to fire at will. Morning: some changes; much support now goes to the right, not the left, and they are on the defensive; several instructions to be written from the experience, quickly. Afternoon, to Lin Biao: changed more; to be passed at the party-government-army meeting under Zhou first. He adds article five (even a counter-revolutionary body''s masses are mostly good; bad men few) and article six (stand firm; though tens of thousands demonstrate, surround, beat, seize, insult, no matter; fear is the great error).'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 9, 1967. [[w.jianguo-yilai-mao-zedong]], XVIII, 463–465 (Feb. 9, 1967; Mao''s notes, the morning and the afternoon of Feb. 9, on Lin Biao''s draft of Feb. 7, four articles; his articles five and six and the retitling to the "truly" revolutionary left, printed from his revised copy; issued Feb. 10; note 3: Ye Jianying to Lin Biao, Feb. 11, article three read out only and the paper sent as five). Made public: 2013. To check: Ye Jianying, letter to Lin Biao of Feb. 11, 1967 on issuing the rules against firing at will as five articles, article three read at the meeting only (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 465 n.3). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
