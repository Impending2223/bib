    c: 'Johnson with Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor and Wheeler, 8:29 to 10:45 a.m., on Bruce''s plea for more time before the bombing resumes. Humphrey for it; Wheeler: "a political decision"; McNamara alone against: should Hanoi send a "moderated no ... and we haven''t bombed, we''re in a hell of a fix." Johnson grants three hours more.'
    n: 'Editorial Note, [FRUS 1964–68, V: Vietnam, 1967, doc. 76](https://history.state.gov/historicaldocuments/frus1964-68v05/d76) (the meeting, its hours and those present, by the Daily Diary; Humphrey and Wheeler, by Tom Johnson''s notes). [[w.gibbons-u-s-government-and]], IV, 517–18. To check: Tom Johnson''s notes of the meeting, Feb. 13, 1967, LBJ Library, in full (cited by [[w.gibbons-u-s-government-and]], IV, 517 n.107). Check: the notes as FRUS prints them have Johnson "Add another 7 hours on bombing," the bombing to start at 7 p.m.; McNamara''s words are not in them. See [[cal.1967-02-06.vietnam]]. Names: Johnson, Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor, Wheeler, Bruce.'
    src:
