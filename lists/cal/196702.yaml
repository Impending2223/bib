  - id: cal.1967-02-01.students
    when: Feb. 1
    date: '1967-02-01'
    thread: students
    also: [war-opposition]
    c: 'Rusk, off the record, with 38 of the student leaders whose open letter of December, at Lowenstein''s urging, warned of young men choosing jail over the war. Wechsler, *New York Post*, Feb. 2: many "emerged as vigorous dissenters." Gregory Craig of Harvard: "nearly everyone came out more militant."'
    n: '[[w.zaroulis-who-spoke-up]], 124–25. Check: [[cal.1967-01-31.war-opposition]] has forty of them with Rusk, Jan. 31. Names: Rusk, Lowenstein.'
