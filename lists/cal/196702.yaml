    c: 'Johnson with McNamara, Eugene Rostow, Taylor and Wheeler, 1:15 to 3:25 p.m.; no notes found. On the Joint Chiefs'' three programs, by Walt Rostow''s notations and Wheeler''s cable the next day: Rolling Thunder 54, the steel plant and the power plant at Thái Nguyên and the power plants at Việt Trì, Bắc Giang and Hòn Gai added; inland waterways and estuaries south of the 20th parallel mined; naval gunfire at shipping and shore targets to the 20th; artillery from the South into the DMZ, the North and Laos; Shining Brass widened; Popeye, the seeding of clouds over the trail, approved. Not announced.'
    n: 'FRUS 1964–68, V, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84), [88](https://history.state.gov/historicaldocuments/frus1964-68v05/d88). [[w.gibbons-u-s-government-and]], IV, 562–68 (the hour, not those present; no notes; the decisions: Walt Rostow''s notations on his agenda and Wheeler''s cable to Sharp and Westmoreland, JCS 1422-67, Feb. 23; not announced); [[w.drea-mcnamara-clifford-and-the-2011]], 135 (the meeting on the Joint Chiefs'' three programs; operations in Laos approved); [[w.drea-mcnamara-clifford-and-the-2011]], 205 (the power plants and mining of waterways south of the 20th parallel presented as continuation); [[w.dallek-flawed-giant]], 459 (Feb. 22, Johnson agrees to expanded actions in the North, the South and against the Laos routes: mining of inland waterways and estuaries, naval gunfire, artillery across the DMZ; not the attendees, the hours or the particular targets). Check: [[w.dallek-flawed-giant]], 459, has "Fifty-four additional targets were to be struck in the North"; here Rolling Thunder 54, five targets added (C). To check: Wheeler to Sharp and Westmoreland, JCS 1422-67, Feb. 22, 1967, Gibbons Papers, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 135 n.69); Rostow''s agenda for the lunch, with his notations, NSF, Files of Walt W. Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 562 n.11, 566 n.13); the same cable, dated Feb. 23, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 566 n.13). See [[cal.1967-02-06.vietnam]]. Drea, 135, has Rusk at the meeting; FRUS 1964–68, V, doc. 88, n. 2, from the Daily Diary, lists Eugene Rostow, not Rusk. Check: Gibbons gives Rusk, McNamara, Wheeler and Taylor, Bromley Smith and Christian also present (IV, 562). Names: McNamara, Eugene Rostow, Taylor, Wheeler, Johnson, Walt Rostow.'
