  - id: cal.1967-02-11.china-leadership
    when: Feb. 11
    date: '1967-02-11'
    thread: china-leadership
    c: 'Mao twice reads the Military Commission''s draft rules on the Cultural Revolution in organs above army level, drafted at his proposal: Lin Biao''s of Feb. 10, "do it; follow the changes made at last night''s meeting"; Zhou''s of the night of the 10th, "to the Premier, issue." Seven articles: study and carry out the eight-article order of Jan. 28; the "four bigs" by stages; none for army units below, naval bases, the Peking garrison and special units; no link-ups with them.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 11, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 122 (Feb. 10, 1967; the provisions adopted at Zhou''s liaison meeting and sent to Mao and Lin Biao; Mao on the 11th: issue as is); [[w.jianguo-yilai-mao-zedong]], XVIII, 468–471 (Feb. 11, 1967; Mao''s notes on Ye Jianying''s draft of Feb. 9, which Lin sent Feb. 10, and, at twelve o''clock (十二时), Feb. 11, "To the Premier, issue," on the text the liaison meeting revised the night of Feb. 10, issued that day; a third note, "Do so," on the supplementary rules Lin sent Feb. 25, issued Feb. 27); [[w.macfarquhar-maos-last-revolution]], 201 (the Military Commission''s seven-point regulations, issued Feb. 11, which Chen Zaidao read as leave to dissolve rebel bodies in the army); [[w.yang-jisheng-tiandi-fanfu]], I, 423–424 (among the 17 documents of the Military Commission''s enlarged meeting: the Commission''s rules on the Cultural Revolution in the leading organs above the army level, issued Feb. 11); [[w.liu-jixian-ye-jianying-nianpu]], II, 959 (Feb. 11, 1967; the Several Provisions, approved by Mao, issued). Made public: 1988. To check: Ye Jianying, draft rules on the Cultural Revolution in leading organs above army level, sent to Lin Biao Feb. 9, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 469 n.1); Military Affairs Commission regulations, Feb. 11, 1967, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 290–291 (cited by [[w.macfarquhar-maos-last-revolution]], 201 n.14). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
