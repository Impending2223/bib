  - id: cal.1967-02-19.china-leadership-3
    when: Feb. 19
    date: '1967-02-19'
    thread: china-leadership
    c: 'Lin Biao sends Mao the Peking garrison''s two reports on the military training trials at Peking University, Tsinghua and three other colleges and two middle schools, and asks whether they may go to the whole country. Mao: both to go out at once; colleges, middle schools and the upper primary classes to train twenty days a year, four hours a day, classes cut by as much; the middle-aged and young of the Party, government, army and mass organs twenty days a year. On Mar. 23, on Chen Boda''s and Wang Li''s request to print them: not to be published.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. [[w.jianguo-yilai-mao-zedong]], XVIII, 483–484 (Feb. 19, 1967; Mao''s notes of Feb. 19, on Lin''s sending of the garrison''s reports of Feb. 18, and Mar. 23, on Chen Boda''s and Wang Li''s report of Mar. 4 (Fu Chongbi 傅崇碧 wanted them printed): not to be published, the provinces'' experience now beyond Peking''s, his note no longer fitting; printed from the manuscripts); [[w.mao-zedong-zhuan]], VI, ch. 76 n.24 (Feb. 19 Mao writes on the Peking Garrison''s two summary reports on the short military training trials at five colleges and two middle schools, including Peking University and Tsinghua: ''colleges, middle schools and the upper primary grades to be trained once a year, twenty days each time''; the summary report on the five colleges is dated Feb. 18; the trials began Jan. 20, n.24; the book does not give four hours a day, the question to the whole country or Lin Biao''s sending). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Chen Boda and Wang Li, report to Mao Zedong of Mar. 4, 1967 on publishing the Peking garrison''s military-training reports (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 484 n.1); Peking Garrison Command 北京卫戍区, ''Summary report on the short-term military and political training trials at five colleges of Peking'' 《北京五所高等院校短期军政训练试点的总结报告》, Feb. 18, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.24). Names: Mao Zedong, Lin Biao, Chen Boda, Wang Li.'
