    c: 'Sunflower Plus. Kosygin in London, Feb. 6–13. Wilson presses on him the "Phase A–Phase B" formula, given the British in November: the bombing stops first, then both sides stop adding to their forces. Tet truce, Feb. 8–12; no bombing of the North.'
    n: 'FRUS 1964–68, V, doc. [41](https://history.state.gov/historicaldocuments/frus1964-68v05/d41). [[w.drea-mcnamara-clifford-and-the-2011]], 203 (Sunflower; Kosygin in London; Phase A–Phase B; the Tet holidays, Feb. 8–12); [[w.gibbons-u-s-government-and]], IV, 511–18; [[w.dobrynin-in-confidence]], 160 (Kosygin in London; Johnson''s proposal to Hồ Chí Minh passed through Moscow); [[w.mcnamara-in-retrospect]], ch. 9 at n.16 (Kosygin in London from Feb. 6, the Tet pause begun; Trinh''s statement). [[w.schlesinger-robert-kennedy-and-his]], 769 (Kosygin''s assurance to Wilson in London "in the second week of February" that unconditional cessation of the bombing would bring negotiations; on Feb. 13 Wilson and Ambassador David Bruce urge Washington to continue the brief bombing pause over Tet; not the Phase A–Phase B formula or the truce''s days). To check: [[w.ellis-britain-america-and-the]]; [[w.colman-lost-crusader]]. See [[cal.1967-01-04.vietnam]]. Made public: the exchanges with Wilson, [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). Names: Kosygin, Wilson.'
