    n: 'Daily Digest, [113 Cong. Rec. D36](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=34). [[w.gibbons-u-s-government-and]], IV, 501. To check: Senate Comm. on Foreign Relations, *Harrison E. Salisbury''s Trip to North Vietnam: Hearing*, 90th Cong., 1st Sess. (1967) (cited by [[w.gibbons-u-s-government-and]], IV, 501 n.65). See [[cal.1967-01-13.vietnam]]. Names: Salisbury, Fulbright, Mansfield, Morse, Gore, Clark, Pell, McCarthy, Sparkman, Lausche, Symington.'
