  - id: cal.1967-02-18.china-leadership
    when: Feb. 18
    date: '1967-02-18'
    thread: china-leadership
    c: 'Mao reads Zhou Enlai''s draft *Hongqi* editorial "Cadres Must Be Treated Rightly." Zhou: it should be discussed at the party-government-army-culture liaison meeting, and the passage on the revolutionary cadres joining the masses should explain the three-in-one in the localities and inside organs. Mao: agreed; discuss, write in the three-in-one; hereafter all important editorials the same. He strikes the last three slogans (long live the Cultural Revolution; long live Mao''s line; long live the great teacher, leader, commander, helmsman). On Feb. 22 he reads the revised text: "issue."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 18, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 126 (Feb. 18, 1967; Zhou reads the draft *Hongqi* editorial "Cadres Must Be Treated Rightly", which holds the great majority of cadres good and calls refusal of class analysis of power-holders, and doubt and overthrow of all, an anarchist trend; he notes that it is very important and timely and proposes it be discussed at the Party-government-army-Group liaison meeting before it appears; Mao agrees and asks the three-in-one be written in; printed Mar. 1); [[w.jianguo-yilai-mao-zedong]], XVIII, 480–482 (Feb. 18, 1967; Mao''s note, 8 p.m. Feb. 18, on the draft Chen Boda sent Feb. 17 and Zhou forwarded, and "Issue as is" on the revision of Feb. 22 by Chen, Guan Feng and Wang Li; he also made "some cadres" "many cadres" who may join the provisional organs; the revision added two paragraphs on the three-in-one; printed in *Renmin ribao* Feb. 23 and *Hongqi* no. 4, Mar. 1); [[w.macfarquhar-maos-last-revolution]], 195 ("early in the evening" Mao approves the draft: "I agree with your viewpoint"). Made public: 2006. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 12 (1998). To check: Zhou Enlai, note to Mao Zedong of Feb. 18, 1967 forwarding the Hongqi editorial draft "Cadres must be treated rightly" (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 481 n.3); Mao Zedong''s comment on the draft, in [[w.zedong-jianguo-yilai-mao-zedong]], XII, 233–234 (cited by [[w.macfarquhar-maos-last-revolution]], 195 n.71a). Names: Mao Zedong, Zhou Enlai.'
    src:
      c: ff721020
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Feb. 18, 1967: all'
