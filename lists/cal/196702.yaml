  - id: cal.1967-02-19.china-leadership-5
    when: Feb. 19
    date: '1967-02-19'
    thread: china-leadership
    c: 'Mao reads Zhou Enlai''s draft of the Center''s letter to the poor and lower-middle peasants and cadres of the communes: rouse all for spring plowing at once; hold a three-level cadre meeting and a team members'' meeting. For Lin Biao to read, then to Wang Dongxing to issue. Sent Feb. 22.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 128 (Feb. 20, 1967; Zhou reviews the Center''s Letter to the Poor and Lower-Middle Peasants and Cadres of the People''s Communes: most commune cadres good; those who erred to make good in spring plowing; he proposes at once a three-level cadre meeting of commune, brigade and team to arrange spring work; he sends it to Wang Dongxing for Mao, who writes "do as proposed"); [[w.macfarquhar-maos-last-revolution]], 173–174 (peasants exhorted to "work to seize victory in the spring cultivation"; power-seizures in production brigades and teams declared undesirable); [[w.jianguo-yilai-mao-zedong]], XVIII, 487–488 (Feb. 20, 1967; Mao''s note, 11 a.m. Feb. 20, "Lin Biao to read, then back to Wang Dongxing to do so," on the letter Zhou and others sent that day; printed from the manuscript). Made public: 2013. Check: Zhou''s chronology gives his review of the letter, and Mao''s "do as proposed", under Feb. 20. Check: the book (173–174) gives no day. To check: [[w.1966-1967-ccp-documents-of-the]], 329–333, 347–350 (cited by [[w.macfarquhar-maos-last-revolution]], 174 n.22); Central Committee, letter to the poor and lower-middle peasants and the cadres of the rural people''s communes, Feb. 20, 1967 (draft sent by Zhou Enlai and others that day), to be read out and posted in the villages (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 487 n.1). Names: Mao Zedong, Zhou Enlai, Lin Biao, Wang Dongxing.'
