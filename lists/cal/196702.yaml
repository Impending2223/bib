    c: 'Peking, Zhongnanhai 中南海. That night Mao suddenly calls Ye Qun 葉群 to his quarters: "Ye Qun, I am ready to take you and Lin Biao south"; Chen Yi, Tan Zhenlin, Li Fuchun, Xu Xiangqian, Nie Rongzhen, Ye Jianying and Li Xiannian oppose the Cultural Revolution and no longer follow him; if the army will not follow, he will raise another and go up Jinggangshan 井岡山 again. Ye Qun: Lin Biao will follow the Chairman to death. Mao: Lin Biao''s health is poor; from now she is to attend the Standing Committee and the Group''s liaison meetings for him and report to him.'
