    c: 'Mao reads a letter of Jan. 29 from Wang Renzhong''s wife, Xiao Huina: he is dying, seized and held, no one knows where; she asks for treatment. Mao: to Lin and Zhou, for the Group: the Red Guards to be persuaded to let him see a doctor, and to call him only as his illness allows. On Feb. 3 the Center telegraphs the Hubei committee and Wuhan Military Region to that effect.'
