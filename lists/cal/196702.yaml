  - id: cal.1967-02-16.china-leadership
    when: Feb. 16
    date: '1967-02-16'
    place: peking
    thread: china-leadership
    c: 'Peking, Huairen Hall, afternoon. At the Center''s liaison meeting, Zhou Enlai chairing, on "grasping revolution, promoting production," Tan Zhenlin, Chen Yi, Ye Jianying, Xu Xiangqian, Li Xiannian, Yu Qiuli and others attack the present way of the Cultural Revolution. Tan, asked why Chen Pixian may not come to Peking: Zhang Chunqiao says they will ask the masses; Tan: the masses, always the masses; where is the Party''s leadership? The old cadres are being broken one by one, the cruelest struggle in the Party''s history. He rises to leave; Zhou calls him back; Chen Yi: do not go; fight them; those who rise are revisionists. This is later called the "February Countercurrent."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 16, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967; Zhou chairs at Huairen Hall; the meeting was to take up grasping revolution and promoting production in the State Council''s branches; Tan Zhenlin, Chen Yi, Ye Jianying, Li Xiannian and Yu Qiuli lose their temper at the Cultural Revolution Group''s Jiang Qing, Chen Boda and Kang Sheng for confusing Party and army and persecuting old cadres; Tan to Zhang Chunqiao: "you want to knock the old cadres down one by one; I will fight to the end, though they cut off my head, jail me and expel me from the Party"; Tan starts to leave and Zhou calls him back; Zhou asks Chen Boda why the *Hongqi* editorial of issue 13 was not shown to the Standing Committee); [[w.macfarquhar-maos-last-revolution]], 192–194 (the recriminations start before Zhou opens the meeting; Tan Zhenlin on the masses, the old cadres and the children of high cadres, against Jiang Qing, and on leaving; Xie Fuzhi; Chen Yi on Liu, Deng and Peng Zhen in Yan''an and on Stalin and Khrushchev; Zhou''s reply; three hours; "At seven o''clock" Zhou ends it); [[w.mao-zedong-zhuan]], VI, ch. 76 n.29 (Feb. 16 at the meeting of the Standing Committee''s liaison group chaired by Zhou Enlai, intended for ''grasping revolution, promoting production'', Tan Zhenlin asks Zhang Chunqiao why the Shanghai first secretary Chen Pixian may not come to Peking, Zhang: we shall go back and consult the masses; Tan: ''what masses, always the masses, where is the Party''s leadership? from morning to night the masses free themselves, teach themselves, make revolution themselves, what is this? it is metaphysics; your aim is to clear out the old cadres, one by one; this is the cruelest struggle in the Party''s history''; he rises to leave, Zhou calls him back; Chen Yi: ''do not go, fight them; when these fellows come to power it is they who do revisionism'', and of the Yan''an rectification those who praised Mao Thought most were the ones who struck; Li Xiannian: it began with the *Hongqi* editorial no. 13, the two-line struggle among the masses on that scale, the link-ups, all the old cadres knocked out, n.29; later called the ''February countercurrent''). [[w.yang-jisheng-tiandi-fanfu]], I, 388–390 (Zhou presides at Huairen Hall 懷仁堂; present Tan Zhenlin, Chen Yi, Li Xiannian, Ye Jianying, Li Fuchun, Xu Xiangqian, Nie Rongzhen, Xie Fuzhi, Chen Boda, Kang Sheng, Yu Qiuli, Zhang Chunqiao, Wang Li, Yao Wenyuan; before the agenda, "grasping revolution, promoting production," Tan asks Zhang why Chen Pixian may not come to Peking; Tan on the old cadres beaten down, "I have wept three times," rises to leave and Zhou calls him back; Chen Yi: "worse than Wang Ming," on Yan''an; Li Xiannian: "a nationwide forced confession," the *Hongqi* editorial of issue 13 the start; Zhou asks Chen Boda and Kang Sheng why it was not shown them; the quarrel lasts to 7 p.m.; Zhou rings Mao in the course of it and Mao sends Wang Dongxing to listen); [[w.yang-jisheng-tiandi-fanfu]], II, 1145 ("mid-February," Zhou presiding; Tan Zhenlin, Chen Yi and Ye Jianying among the critics: the "February adverse current"); [[w.jian-zhou-enlai]], 568–569 (all the Group but Jiang, the marshals and veterans, on "making revolution and promoting production"; Tan Zhenlin against Zhang Chunqiao: "the struggles now are the most ruthless in our party''s history ... I will struggle to the end"; Zhou bids him stay as he rises to leave; Chen Yi: "Do not leave! Stay and struggle against them!"; the Yan''an purges; Zhou''s one rebuttal, of Chen Boda on the *Hongqi* essay; Zhou telephones Mao several times); [[w.chen-yi-nianpu]], 1184–1185 (Feb. 16, 1967, afternoon, Huairen Hall; when Tan Zhenlin, having told Zhang Chunqiao this was the cruelest struggle in the Party''s history, takes his briefcase to leave, Chen Yi calls him back: stay and fight; if these men come up they will make revisionism; Stalin handed over to Khrushchev; and, at Kang Sheng, the Yan''an "rescue movement" wronged many; do not forget that lesson); [[w.friedman-shadow-cold-war]], 152 (Chen Yi with other Politburo members against the Red Guards'' excesses; Jiang Qing appeals to Mao, who has enlarged Politburo meetings under Zhou condemn the "February Adverse Current"); [[w.dikotter-cultural-revolution]], 136 n.19 (five days later, at a second session, Tan Zhenlin to Zhang Chunqiao: "What masses? ... Your aim is to purge the old cadres"; Chen Yi on Liu, Deng and Peng Zhen as Mao''s keenest supporters at Yan''an, and Khrushchev''s embrace of Stalin; Zhou says little, and pounds the table to make Tan return to the meeting); [[w.liu-jixian-ye-jianying-nianpu]], II, 960 (Feb. 16, 1967; Ye Jianying 叶剑英 with Tan Zhenlin 谭震林, Chen Yi 陈毅, Li Xiannian 李先念, Nie Rongzhen 聂荣臻, Yu Qiuli 余秋里 and others against the Cultural Revolution''s wrong ways and the Group''s persecution of old cadres). Made public: 1969. Check: the book (197) has Li Xiannian challenge Xie Fuzhi "during the February Countercurrent confrontation" on calling teenagers counterrevolutionaries; which of the meetings of Feb. 11 and 16. Check: Tan Zhenlin''s words on following Mao forty-one years are not in the minutes; Zhou cited them in his Twelfth Plenum speech (193 n.60). To check: [[w.li-insiders-account-of-the]], 44 (cited by [[w.macfarquhar-maos-last-revolution]], 192 n.56a); [[w.li-wang-li-fansi-lu]], II, 977 (cited by [[w.macfarquhar-maos-last-revolution]], 192 n.56b); [[w.zhou-enlai-nianpu-1949]], III, 126–127 (cited by [[w.macfarquhar-maos-last-revolution]], 192 n.56c); [[w.wenge-shinian-ziliao-xuanbian]], I, 183–185 (cited by [[w.macfarquhar-maos-last-revolution]], 193 nn.57–59, 61; 194 nn.62–63); [[w.debate-between-the-blood]] (cited by [[w.macfarquhar-maos-last-revolution]], 193 n.58b); Zhou Enlai''s speech to the Twelfth Plenum, October 1968, in [[w.zai-zhonggong-ba-jie]], 35 (cited by [[w.macfarquhar-maos-last-revolution]], 193 n.60); "Meeting in Huairen Hall on February 16" (cited by [[w.macfarquhar-maos-last-revolution]], 194 n.66); Zhang Chunqiao 张春桥, Yao Wenyuan 姚文元 and Wang Li 王力, record of the Huairen Hall meeting 《二月十六日怀仁堂会议》, Feb. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.29); [[w.wenqian-wannian-zhou-enlai]], 26th printing (2004), 201, 203 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 390 n.8); [[w.nianyi-da-dongluande-niandai]], 209–211 (cited by [[w.jian-zhou-enlai]], 569 n.14a); [[w.li-wang-li-fansi-lu]], 977–978 (cited by [[w.jian-zhou-enlai]], 569 n.14b); [[w.qi-benyu-huiyilu]], II, 576–577 (cited by [[w.jian-zhou-enlai]], 569 n.14c); [[w.zhou-enlai-nianpu-1949]], III, 127 (cited by [[w.jian-zhou-enlai]], 569 n.14d); [[w.zhou-enlai-zhuan-1949]], 956 (cited by [[w.jian-zhou-enlai]], 569 n.15b); [[w.pu-weihua-zalan-jiu-shijie]], 449–450 (cited by [[w.jian-zhou-enlai]], 569 n.16); Wang Guangyu, *Qingshi nanyin* (2011), 121 (cited by [[w.dikotter-cultural-revolution]], 136 n.19). Names: Zhou Enlai, Tan Zhenlin, Chen Yi, Ye Jianying, Xu Xiangqian, Li Xiannian, Yu Qiuli, Chen Pixian, Zhang Chunqiao. Check: Made public: 1969 is the year of [[w.zai-zhonggong-ba-jie]], which prints Zhou Enlai''s Twelfth Plenum speech citing Tan Zhenlin''s words at the meeting (193 n.60); if it circulated internally, 1981 ([[w.wenge-shinian-ziliao-xuanbian]], the minutes, 193 nn.57–63), and if that too, 1994 ([[w.li-insiders-account-of-the]]).'
