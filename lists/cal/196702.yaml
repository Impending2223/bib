    c: '*Newsweek* reports that Robert Kennedy, back from Europe, brought a peace signal from Hanoi: in Paris, Feb. 1, Manac''h of the French Foreign Ministry had told him what Hanoi would take as the condition of talks (Check the day). Feb. 6, Kennedy with Johnson in the White House, Katzenbach and Rostow present: Johnson, the leak was Kennedy''s; Kennedy, it was State''s. Kennedy to the press after: he brought home no peace feelers.'
    n: 'Rostow to Johnson on the *Newsweek* report, Feb. 6: FRUS 1964–68, V, doc. [38](https://history.state.gov/historicaldocuments/frus1964-68v05/d38). [[w.schlesinger-robert-kennedy-and-his]], 766–69 (the cable''s story; the meeting, by Mankiewicz''s and Edelman''s recollections of Kennedy''s account); [[w.dallek-flawed-giant]], 447–48 (Manac''h and *Newsweek*; the meeting of Feb. 6, Katzenbach and Rostow present; Kennedy to the press; by Dallek, Johnson thought a Kennedy man in the administration the leaker); [[w.shesol-mutual-contempt]], 367 (Kennedy to the press after: "I did not bring home"); [[w.branch-at-canaans-edge]], 572 ("It''s not my State Department, goddam it! It''s your State Department!"; Katzenbach: "a perfectly ridiculous episode"); [[w.shesol-mutual-contempt]], 363–67 (Manac''h, Feb. 1, Dean translating, Dean''s cable that night, "Confidential" only; Weintal of *Newsweek* given it at State; Feb. 6: Kennedy calls Watson, lunches with Katzenbach; the meeting at 4 p.m., an hour and twenty minutes: "It''s not my State Department, goddamnit"; "I''ll destroy you and every one of your dove friends"; "You''ll be dead politically in six months"); [[w.thomas-robert-kennedy]], 332–33 (Manac''h in Paris; Kennedy home three days later to the leak to *Newsweek*; Feb. 6, summoned to the Oval Office at 4 p.m.: Johnson accuses him of the leak, Kennedy says it came from State; "It''s not my State Department, God damn it. It''s your State Department"; Kennedy: "I don''t have to take that from you"; to Newfield, Johnson "very abusive"); [[w.dallek-flawed-giant]], 447–48 (Feb. 6, the Oval Office: Kennedy, the leak "from your State Department"; Johnson: "It''s not my State Department, goddamnit. It''s your State Department"; "I''ll destroy you and every one of your dove friends in six months"; Kennedy to tell reporters he brought home no peace feeler; *Newsweek*''s "significant peace signal"; not the day of the Paris talk). [[w.gibbons-u-s-government-and]], IV, 551–52 (*Newsweek*''s report, not its day; the meeting, 4:34 to 5:52 p.m., Katzenbach and Rostow present, by Schlesinger''s account); [[w.herring-lbj-and-vietnam]], 113–14 (Dean''s cable from Paris; the leak to *Newsweek* and the *Times*''s story of Feb. 6; the meeting, "It''s not my State Department, God damn it," by Katzenbach''s recollection; Kennedy to say he brought home no feelers); [[w.palermo-in-his-own-right]], 40–43 (Manac''h, Feb. 1, Dean of the embassy present; the *Newsweek* story; the meeting, 4:34 p.m., an hour and fifteen minutes, Kennedy, Katzenbach, Johnson and Rostow, by the Daily Diary; the leak, by Mankiewicz''s account; Kennedy to the press after). [[w.mann-grand-delusion]], 524–26. To check: [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]; Frank Mankiewicz, oral history interview by L. J. Hackman, Aug. 12, 1969, 6, 70–75, RFK Oral History Program; Peter Edelman, oral history interview by L. J. Hackman, July 15, 1969, 65–70 (cited by [[w.schlesinger-robert-kennedy-and-his]], 769 n.51); Robert Kennedy, memorandum of conversation with Manac''h, Jan. 31, 1967, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 766 n.38); Paris to Washington 11650, Feb. 2, 1967, State Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 551 n.80); Katzenbach''s interview with Herring, Dec. 7, 1988; Rostow''s oral history, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 114 n.88); *Washington Post*, Feb. 7, 10, 1967 (cited by [[w.herring-lbj-and-vietnam]], 114 n.89); White House Daily Diary, Feb. 6, 1967, LBJ Library (cited by [[w.palermo-in-his-own-right]], 42 n.51); partial transcript of Kennedy''s press conference in the West Lobby, Feb. 6, 1967, WHFN, LBJ Library (cited by [[w.palermo-in-his-own-right]], 43 n.61); John Gunther Dean to Joseph Dolan, Feb. 2, 1967, RFK Papers, JFK Library (cited by [[w.palermo-in-his-own-right]], 41 n.43); "Kennedy Sees President (cited by [[w.branch-at-canaans-edge]], 572); Denies Bringing ''Feelers,'' " [*New York Times*, Feb. 7, 1967](https://timesmachine.nytimes.com/timesmachine/1967/02/07/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 572); [[w.schlesinger-thousand-days-1965]], 825–28 (cited by [[w.branch-at-canaans-edge]], 572); Thomas, Robert Kennedy, pp. ASP =33} (cited by [[w.branch-at-canaans-edge]], 572); Nicholas Katzenbach oral history by Paige E. Mulhollan, Nov. 23, 1968, pp. 27–29, LBJ (cited by [[w.branch-at-canaans-edge]], 572); Allard Lowenstein oral history by Larry J. Hackman, April 23, 1969, pp. 55–56, JFK (cited by [[w.branch-at-canaans-edge]], 572); Nicholas Katzenbach oral history by Paige E. Mulhollan, Nov. 12, 1968, pp. 34–37, LB] (cited by [[w.branch-at-canaans-edge]], 572); Katzenbach oral history by Larry J. Hackman, Oct. 8, 1969, p. 48ff, JFK (cited by [[w.branch-at-canaans-edge]], 572); Int. Nicholas Katzenbach, June 14, 1991 (Branch) (cited by [[w.branch-at-canaans-edge]], 572). See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy, Manac''h, Katzenbach, Rostow, Johnson. Check: Schlesinger''s note dates Kennedy''s memorandum of the Manac''h talk Jan. 31 (766 n.38).'
