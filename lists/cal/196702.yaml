    c: 'While the two sides face each other at the *Qinghai ribao* 青海日報, the Qinghai Military District telegraphs the Military Commission that "8.18" beats people in the paper, some to death, holds guns and ammunition and shouts counter-revolutionary slogans: about ten telegrams. Lin Biao 林彪, by his secretary Zhang Yunsheng 張云生, shows nothing and says nothing.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 397–398. Made public: 1988. To check: [[w.yunsheng-maojiawan-jishi]], 91 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 398 n.27). Names: Lin Biao.'
    src:
