  - id: cal.1967-02-16.china-leadership-3
    when: Feb. 16
    date: '1967-02-16'
    place: peking
    thread: china-leadership
    c: 'Zhang Chunqiao, Yao Wenyuan and Wang Li with Jiang Qing, after the Huairen Hall meeting, draw up a "record" and report to Mao, Zhang adding that Zhou has objected to the *Hongqi* editorial of issue 13 not being sent to him for review. Mao: the Party constitution does not require that editorials go through the Standing Committee. He tells Zhang to talk with Zhou: the Cultural Revolution Group is to be treated as a secretariat, and major Party and state questions put first to it for discussion.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 124 (Feb. 16, 1967, the item after); [[w.macfarquhar-maos-last-revolution]], 194–195 (Zhang Chunqiao, Wang Li and Yao Wenyuan compare notes and report to Jiang Qing at villa No. 11, Diaoyutai; Mao receives the three between ten and midnight in the Beijing Room of the Great Hall); [[w.mao-zedong-zhuan]], VI, ch. 76 n.30 (after the meeting Zhang Chunqiao, Yao Wenyuan and Wang Li go to Jiang Qing, who says to report to the Chairman at once; they report that evening; Wang Li''s account, n.30: Mao smiling until Chen Yi''s remark on the Yan''an rectification, then his face set; when Zhang says the Premier objects that the *Hongqi* editorial no. 13 was not sent to him, Mao: the Party constitution has no such article, editorials of the Party''s papers and journals must be examined by the Standing Committee; the report was short). [[w.yang-jisheng-tiandi-fanfu]], I, 390 (Zhang Chunqiao, Wang Li and Yao Wenyuan tell Jiang Qing, and about 10 p.m. the three go to Mao; Mao laughs at the first of it and stops laughing at Chen Yi''s words; Zhang adds Zhou''s complaint that the *Hongqi* issue 13 editorial was not sent him; Mao: the Party constitution does not require editorials to go to the Standing Committee; Zhang to talk with Zhou: the Group to be treated as the Secretariat, great questions to go to it first); [[w.teiwes-tragedy-of-lin-biao]], 76 (the radicals'' record of the marshals'' words, allegedly distorted, angers Mao); [[w.chen-yi-nianpu]], 1184 (Feb. 16, 1967; Zhang Chunqiao, Yao Wenyuan and Wang Li 王力 secretly put together the "record of the Huairen Hall meeting of Feb. 16" and, after plotting with Jiang Qing, report it to Mao); [[w.liu-jixian-ye-jianying-nianpu]], II, 960 (after the meeting of Feb. 16, 1967, Zhang Chunqiao 张春桥, Yao Wenyuan 姚文元 and Wang Li 王力 secretly draw up its record and, with Jiang Qing 江青, report to Mao). Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], I, 242; II, 980–981 (cited by [[w.macfarquhar-maos-last-revolution]], 195 n.67); Interview 访问 with Wang Li 王力, Aug. 12, 1983 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.30); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E10–15 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35a); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 21–22, 1984 (FBIS, Nov. 6, 1984, K22–24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35b); [[w.baocun-tan-zhenlin-wai-zhuan]], 128 (cited by [[w.teiwes-tragedy-of-lin-biao]], 76 n.35c). See [[cal.1967-02-16.china-leadership]]. Names: Zhou Enlai, Zhang Chunqiao, Yao Wenyuan, Wang Li, Jiang Qing, Mao Zedong.'
