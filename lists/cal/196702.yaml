    n: '[[w.gibbons-u-s-government-and]], IV, 559. To check: Sharp to Wheeler, CINCPAC 170820Z, Feb. 17, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 559 n.4); Westmoreland to Sharp and Wheeler, MAC 1658, Feb. 17, 1967, Westmoreland Papers, Message Files, CMH (cited by [[w.gibbons-u-s-government-and]], IV, 559 n.5). Names: Sharp, Westmoreland, Wheeler.'
