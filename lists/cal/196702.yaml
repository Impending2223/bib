    when: Feb. 1
    date: '1967-02-01'
    thread: war-opposition
    c: 'Seven leaders of Clergy and Laymen Concerned About Vietnam, after some 2,000 of its members march at the White House, Jan. 31, see Rostow: negotiations will come in time; the administration "under terrific pressure from people who want to go militarily further."'
    n: '[[w.gibbons-u-s-government-and]], IV, 554. To check: *New York Times*, Feb. 1 and 2, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 554 nn.89–90). Names: Rostow.'
