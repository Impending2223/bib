  - id: cal.1967-02-05.opinion
    when: Feb. 5
    date: '1967-02-05'
    thread: opinion
    also: [congress]
    c: 'Gallup, Jan. 26–31: have heard of the inquiry whether Powell should keep his seat, 88 percent. Of them: should keep it 20, should not 63. Negroes 2 to 1 that he should. Misuse of Government funds by congressmen fairly common: yes 60, no 21.'
    n: '[[w.gallup-poll]], III, 2048. Names: Powell.'
    tags: [name:powell-adam-clayton-jr]
  - id: cal.1967-02-06.crime-and-hijacking
    when: Feb. 6
    date: '1967-02-06'
    thread: crime-and-hijacking
    c: 'Message on crime. A Safe Streets and Crime Control Act: planning grants to States, cities and metropolitan bodies up to 90 percent, grants for programs up to 60 percent; an Office of Law Enforcement and Criminal Justice Assistance in the Justice Department; $50 million for fiscal 1968. Controls on the sale of firearms; a Right of Privacy Act against wiretapping and eavesdropping, but for national security; aid against juvenile delinquency and narcotics.'
    n: 'Special Message to the Congress on Crime in America, [1967 Pub. Papers 134](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=202) (Feb. 6, 1967). To check: [[w.flamm-law-and-order]]; [[w.hinton-from-the-war-on]]. See [[cal.1967-01-10.program]]; [[cal.1965-03-08.crime-and-hijacking]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-06.robert-kennedy
    when: Feb. 6
    date: '1967-02-06'
    thread: robert-kennedy
    also: [vietnam]
    c: '*Newsweek* reports that Robert Kennedy, back from Europe, brought a peace signal from Hanoi: in Paris, Feb. 1, Manac''h of the French Foreign Ministry had told him what Hanoi would take as the condition of talks (Check the day). Feb. 6, Kennedy with Johnson in the White House, Katzenbach and Rostow present: Johnson, the leak was Kennedy''s; Kennedy, it was State''s. Kennedy to the press after: he brought home no peace feelers.'
    n: 'Rostow to Johnson on the *Newsweek* report, Feb. 6: FRUS 1964–68, V, doc. [38](https://history.state.gov/historicaldocuments/frus1964-68v05/d38). [[w.schlesinger-robert-kennedy-and-his]], 766–69 (the cable''s story; the meeting, by Mankiewicz''s and Edelman''s recollections of Kennedy''s account); [[w.dallek-flawed-giant]], 447–48 (Manac''h and *Newsweek*; the meeting of Feb. 6, Katzenbach and Rostow present; Kennedy to the press; by Dallek, Johnson thought a Kennedy man in the administration the leaker). [[w.gibbons-u-s-government-and]], IV, 551–52 (*Newsweek*''s report, not its day; the meeting, 4:34 to 5:52 p.m., Katzenbach and Rostow present, by Schlesinger''s account). To check: [[w.shesol-mutual-contempt]]; [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]; Frank Mankiewicz, oral history interview by L. J. Hackman, Aug. 12, 1969, 6, 70–75, RFK Oral History Program; Peter Edelman, oral history interview by L. J. Hackman, July 15, 1969, 65–70 (cited by [[w.schlesinger-robert-kennedy-and-his]], 769 n.51); Robert Kennedy, memorandum of conversation with Manac''h, Jan. 31, 1967, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 766 n.38); Paris to Washington 11650, Feb. 2, 1967, State Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 551 n.80). See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy, Manac''h, Katzenbach, Rostow, Johnson. Check: Schlesinger''s note dates Kennedy''s memorandum of the Manac''h talk Jan. 31 (766 n.38).'
    src:
      c: 67a6b0cb
      rows:
        - 'w.gibbons-u-s-government-and IV, 551: A'
        - 'w.gibbons-u-s-government-and IV, 552: B-D'
        - 'via w.gibbons-u-s-government-and IV, 551 n.80: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d38: A'
        - 'w.dallek-flawed-giant 447–48: A-D'
        - 'w.schlesinger-robert-kennedy-and-his 766–69: A-D'
        - 'via w.schlesinger-robert-kennedy-and-his 769 n.51: B-D'
        - 'via w.schlesinger-robert-kennedy-and-his 766 n.38: A'
    tags: [name:kennedy-robert-f, name:manach-etienne-m, name:katzenbach-nicholas, name:johnson-lyndon-b, name:rostow-walt-w]
  - id: cal.1967-02-06.vietnam
    when: Feb. 6
    date: '1967-02-06'
    thread: vietnam-sunflower
    also: [soviet-union, europe-and-the-alliance]
    c: 'Sunflower Plus. Kosygin in London, Feb. 6–13. Wilson presses on him the "Phase A–Phase B" formula, given the British in November: the bombing stops first, then both sides stop adding to their forces. Tet truce, Feb. 8–12; no bombing of the North.'
    n: 'FRUS 1964–68, V, doc. [41](https://history.state.gov/historicaldocuments/frus1964-68v05/d41). [[w.drea-mcnamara-clifford-and-the-2011]], 203 (Sunflower; Kosygin in London; Phase A–Phase B; the Tet holidays, Feb. 8–12); [[w.gibbons-u-s-government-and]], IV, 511–18. To check: [[w.ellis-britain-america-and-the]]; [[w.colman-lost-crusader]]. See [[cal.1967-01-04.vietnam]]. Made public: the exchanges with Wilson, [[w.herring-secret-diplomacy-of-the]] (1983); FRUS 1964–68, V (2002). Names: Kosygin, Wilson.'
    src:
      c: 056bbacd
      rows:
