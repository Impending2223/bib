  - id: cal.1967-02-13.intelligence
    when: Feb. 13–15
    date: '1967-02-13'
    thread: intelligence
    also: [students]
    c: The National Student Association's officers confirm that the CIA has paid for its international program since the early 1950s, ahead of *Ramparts*'s March issue (Check the day). Feb. 14, *Ramparts*'s advertisements in the *Times* and the *Post*, and stories on the front page of both; Feb. 15, reports of CIA money through foundations to other youth groups abroad. Feb. 15, Johnson names Katzenbach, Gardner and Helms to review the CIA's relations with private voluntary organizations working abroad.
    n: 'FRUS 1964–68, XXXIII, doc. [260](https://history.state.gov/historicaldocuments/frus1964-68v33/d260); X, doc. [171](https://history.state.gov/historicaldocuments/frus1964-68v10/d171). To check: [[w.paget-patriotic-betrayal]]; [[w.wilford-mighty-wurlitzer]]. Names: Katzenbach, Gardner, Helms, Johnson.'
