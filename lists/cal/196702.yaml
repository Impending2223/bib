    c: 'Mao approves Zhou Enlai''s report of the night of Feb. 27 on Guangdong: the Center''s liaison meeting resolves that Guangdong be put under military control at once and prepare a three-in-one revolutionary committee; Huang Yongsheng head, Chen De deputy, to run the province and help the provincial committee''s self-criticism. Yunnan, much the same, to be put under control first. "Agreed."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 28, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 129 (Feb. 27, 1967; Zhou''s report of that night on Guangdong); [[w.jianguo-yilai-mao-zedong]], XVIII, 491–492 (Feb. 28, 1967; Mao''s note to Zhou, one o''clock (一时), Feb. 28, "Agreed to do so," on Zhou''s report of Feb. 27 (a day''s talk with Huang Yongsheng, Chen Yu, Zhao Ziyang, Chen De, Ou Mengjue and others); printed from the manuscript); [[w.mao-zedong-zhuan]], VI, ch. 76 (Feb. 27, because Guangdong''s provincial first secretary has of his own accord ''yielded power'' to the rebels, Zhou Enlai writes to Mao proposing military control of Guangdong and of Yunnan, in like confusion, and Mao approves; Mar. 10 the Center decides on military control of Jiangsu, the factions there not able to unite; the book does not give the liaison meeting''s resolution, the heads or the preparation of a three-in-one committee). Made public: 2013. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], VI, ch. 76), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if the 1997 edition of the Zhou chronology ([[w.zhou-enlai-nianpu-1949]]), cited here, prints it. To check: Zhou Enlai, report to Mao Zedong of Feb. 27, 1967 on Guangdong (military control; a three-in-one revolutionary committee to be prepared; Yunnan likewise) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 492 n.1b). Names: Mao Zedong, Zhou Enlai, Huang Yongsheng, Chen De.'
