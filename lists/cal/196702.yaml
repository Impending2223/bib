  - id: cal.1967-02-23.china-leadership-4
    when: Feb. 23
    date: '1967-02-23'
    time: 1967-02-23T06:00Z
    place: xining
    thread: china-leadership
    also: [china]
    c: At Xining soldiers fire on the "August 18" rebels in and around the premises of the Qinghai Daily, which the PLA had been sent to put under military control. By an official estimate the masses suffer 169 dead and 178 wounded, the armed forces 4 dead and 26 wounded.
    n: '[[w.macfarquhar-maos-last-revolution]], 179–180; [[w.yang-jisheng-tiandi-fanfu]], I, 398–399 (at 8 a.m. martial law over Xining; the garrison command orders "8.18" banned and its leaders arrested; thirteen companies of the District''s independent division and regiment surround the paper and cut its communications and the roads to Lanzhou and the Hexi corridor; Zhao Yongfu commands from a nearby hotel, machine guns on the heights; at 11:10 a.m. the troops shoot up the 8.18 loudspeakers; at 2 p.m. flares from the hotel and the bridge behind the paper, and in some ten minutes hundreds fall: 347 masses dead and wounded, 169 dead, 178 wounded; a woman of the paper''s staff, warned the night before by an acquaintance in the District''s political department, hears the firing begin about 10 a.m.); [[w.dikotter-cultural-revolution]], 134–135 n.17 (after weeks of skirmishes the deputy commander sends his troops against the organization holding the main newspaper; loudspeakers shot down, then a barrage killing the defenders of the entrance; flamethrowers ready, the rebels unarmed; the building taken in under twenty minutes; more than a hundred killed, a seven-year-old girl among them; a mass grave). Check: the hour: Yang (I, 398) has the flares and the firing at 2 p.m. (下午2時), the eyewitness he quotes (I, 399) the firing about 10 a.m. (上午10點鐘光景). To check: [[w.chunming-wenge-shiqi-guaishi-guaiyu]], 273 (cited by [[w.macfarquhar-maos-last-revolution]], 179 n.59); [[w.nianyi-da-dongluande-niandai]], 204 (cited by [[w.macfarquhar-maos-last-revolution]], 179 n.61); [[w.zhongguo-gongchandang-qinghai-sheng]], 124 (cited by [[w.macfarquhar-maos-last-revolution]], 180 n.62); Yu Ruxin 余汝信, 〈「趙永夫事件」淺析——冼恒漢回憶錄補正〉 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 399 n.28); Ding Shu, "L''Événement du 23 février au Qinghai," in Song Yongyi, *Les Massacres de la Révolution Culturelle* (2009), 67–88 (cited by [[w.dikotter-cultural-revolution]], 135 n.17a); Liu Guokai, *A Brief Analysis of the Cultural Revolution* (1987), 61 (cited by [[w.dikotter-cultural-revolution]], 135 n.17b). Check: two accounts of how the shooting began. A PLA historian (1988): the occupants beat and looted and shot at the soldiers, who counterattacked. The Qinghai party history (1995): soldiers were thrown over the wall, a weapon went off by accident, the shots were taken for the rebels'', and no order to shoot was given (179–180).'
    src:
