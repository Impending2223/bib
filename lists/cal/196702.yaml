  - id: cal.1967-02-07.china-leadership
    when: Feb. 7
    date: '1967-02-07'
    thread: china-leadership
    c: 'Mao reads the Tibet Military Region committee''s telegram of Feb. 6: Tibetan rebels want Zhang Guohua brought down and call the Region''s committee "royalist"; they ask the Center to state a view soon. Mao to Lin, Zhou, Ye, Nie and Xu: find out whether Zhang Guohua, Zhou Renshan, Wang Qimei and others are good or bad and wire him in a day or two; a statement to be made; some matters are settled too slowly, Xinjiang to be settled quickly; some great matters too fast, without the Standing Committee''s leisure. On Feb. 12 the Military Commission replies: Zhang is on Mao''s line.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 121 (Feb. 7, 1967; Mao''s note to Lin Biao, Zhou, Ye Jianying, Nie Rongzhen and Xu Xiangqian: some questions handled too slowly, Xinjiang to be settled sooner, some great ones too fast); [[w.macfarquhar-maos-last-revolution]], 177 (Zhang Guohua, first secretary and military region commander in Tibet, gains from Mao''s wish to postpone the movement in military regions bordering enemy territory); [[w.jianguo-yilai-mao-zedong]], XVIII, 460–462 (Feb. 7, 1967; Mao''s note of Feb. 7 to Lin Biao, Zhou Enlai, Ye Jianying, Nie Rongzhen and Xu Xiangqian, with its postscript, and "Done, filed," Feb. 8; printed from the manuscript; note 1: the Cultural Revolution Group''s telegram of Feb. 24 to the Lhasa rebels backed the Commission''s; note 4: on Feb. 7 and 8 Zhou, Nie, Ye and Xu decided on military control in Xinjiang and the Production and Construction Corps); [[w.liu-jixian-ye-jianying-nianpu]], II, 958 (Feb. 7, 1967; Mao''s comment on a paper to Lin Biao 林彪, Zhou Enlai 周恩来, Ye Jianying 叶剑英, Nie Rongzhen 聂荣臻 and Xu Xiangqian 徐向前: some matters handled too slowly, Xinjiang 新疆 to be settled quickly; some great matters too fast, without the Standing Committee''s unhurried discussion). Made public: 2013. Check: the book (177 n.40) cites Mao wengao XII, 218–219, with no day; whether this telegram. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 218–219 (cited by [[w.macfarquhar-maos-last-revolution]], 177 n.40); Tibet Military Region Party committee, telegram to the Center, the Military Commission and the Cultural Revolution Group of Feb. 6, 1967 on the rebels'' attack on Zhang Guohua (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 461 n.1a). Names: Mao Zedong, Lin Biao, Zhou Enlai, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Zhang Guohua, Zhou Renshan, Wang Qimei.'
