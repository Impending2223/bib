    c: Zhou Enlai, before dawn, receives the finance-and-trade rebels and orders on the spot the arrest of Du Xiangguang, who seized the Finance Ministry's business power. Finance power cannot be seized; seizures the Center has not recognized do not count. The Finance and Commerce ministries' Party groups are restored under Li Xiannian, Wu Bo and Yao Yilin. Parading leaders in tall hats is "cruel struggle, merciless blows".
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 125 (Feb. 17, 1967); [[w.macfarquhar-maos-last-revolution]], 158–159 (2 a.m. to dawn; the rebels want Vice Minister Du Xiangguang in the three-in-one combination; Zhou refuses and has him taken away). Made public: 2020. To check: Transcript of Zhou Enlai''s meeting with Ministry of Finance rebels, Feb. 17, 1967, as produced and circulated by the Ministry of Food, p. 1, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 159 n.17). Names: Zhou Enlai, Du Xiangguang, Li Xiannian, Wu Bo, Yao Yilin.'
    tags: [name:zhou-enlai, name:li-xiannian, polity:prc, vis:only:prc]
