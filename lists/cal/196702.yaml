    c: 'Wanxian 萬縣, Sichuan. The loudspeaker teams of the Wanxian Military Subdistrict 萬縣軍分區 declare the "Main Force Army" 主力軍 counter-revolutionary and the "Red Flag" 赤旗 its accomplice, and martial law in some quarters. Students, then cadres and townspeople, march in protest. Soldiers burst into the Main Force Army''s quarters at the Zhenyuan Tang 真元堂, a former church, and fire, killing 5; as more try to reach the bodies an officer orders fire again: 18 more killed, and one more in the street, 24 dead. The rebels carry 18 bodies through the city: the "Feb. 22" suppression.'
