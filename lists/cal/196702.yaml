  - id: cal.1967-02-02.india-and-china
    when: Feb. 2
    date: '1967-02-02'
    thread: india-and-china-food
    also: [foreign-aid, farm]
    c: Message on food for India. India's need this year, 10 million tons of grain, about $725 million; 2.3 million tons already in the pipeline. The rest, 5.7 million tons, to be met through the World Bank's India Aid Consortium; the United States to give up to 3 million tons more if other countries match it. $25 million in food for CARE and the voluntary agencies in Bihar and Uttar Pradesh.
    n: 'Special Message to the Congress on Food for India and on Other Steps To Be Taken in an International War on Hunger, [1967 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=189) (Feb. 2, 1967). See [[cal.1966-11-10.india-and-china]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-02-02.vietnam-sunflower
    when: Feb. 2
    date: '1967-02-02'
    thread: vietnam-sunflower
    c: 'Moscow. Guthrie gives Lê Trang the American reply of Jan. 31: direct and private talks on any subject either side raises.'
    n: 'FRUS 1964–68, V, docs. [32](https://history.state.gov/historicaldocuments/frus1964-68v05/d32), [33](https://history.state.gov/historicaldocuments/frus1964-68v05/d33). See [[cal.1967-01-04.vietnam]]. Names: Guthrie, Lê Trang.'
    tags: [name:guthrie-john-c, name:le-trang]
  - id: cal.1967-02-02.vietnam
    when: Feb. 2
    date: '1967-02-02'
    thread: vietnam
    also: [soviet-union-consular]
    c: 'News conference. Vietnam: nothing showing "any seriousness" on the other side''s part; for a halt in the bombing, "Just almost any step." Johnson for the consular convention.'
    n: 'The President''s News Conference, [1967 Pub. Papers 128](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=196) (Feb. 2, 1967). [[w.gibbons-u-s-government-and]], IV, 509 (not the consular convention). See [[cal.1967-01-04.vietnam]]; [[cal.1967-01-20.soviet-union]]. Names: Johnson.'
