    when: Feb. 8
    date: '1967-02-08'
    thread: robert-kennedy
    also: [china]
    c: 'Chicago, the University of Chicago''s conference on China (Check). Robert Kennedy: Vietnam''s communism "a native growth, with its own revolutionary traditions and dynamism," not Chinese-inspired; a China policy in "conscious and open recognition that we live in the same world."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 769–70 (Chicago; the words; not the conference). Check: the text. To check: *New York Times*, Feb. 9, 1967 (cited by [[w.schlesinger-robert-kennedy-and-his]], 770 n.56). See [[cal.1967-02-06.robert-kennedy]]. Names: Robert Kennedy.'
    src:
      c: 8718317a
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 769–70: A, B-C'
    tags: [name:kennedy-robert-f]
  - id: cal.1967-02-09.foreign-aid
    when: Feb. 9
    date: '1967-02-09'
    thread: foreign-aid
    c: 'Foreign aid message: slightly over $3.1 billion under the Foreign Assistance Act for fiscal 1968, some $2.5 billion of it economic, almost $600 million military. More than $1 billion for agriculture, education and health. $200 million for the Asian Development Bank''s special funds, over several years, on the Black mission''s advice. Latin America $624 million; the Near East and South Asia $758 million.'
    n: 'Special Message to the Congress on Foreign Aid, [1967 Pub. Papers 164](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=232) (Feb. 9, 1967). To check: [[w.ruttan-united-states-development-assistance]]. See [[cal.1966-09-19.foreign-aid]]. Names: Johnson, Black.'
    tags: [name:johnson-lyndon-b, name:black-eugene-r]
  - id: cal.1967-02-10.succession
    when: Feb. 10
    date: '1967-02-10'
    thread: succession
    also: [amendments]
    c: 'Twenty-fifth Amendment ratified: Minnesota and Nevada, the 37th and 38th States.'
    n: 'Certified Feb. 23: Remarks at Ceremony Marking the Ratification of the Presidential Inability (25th) Amendment to the Constitution, [1967 Pub. Papers 217](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=285) (Feb. 23, 1967). To check: [[w.feerick-twenty-fifth-amendment]]. See [[cal.1965-07-06.succession]]; [[cal.1966-07-05.succession-us]]. Check: the States'' records of ratification.'
