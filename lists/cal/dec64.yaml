# Cal. LV December 1964
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LV
entries:
  - id: cal.1964-12-01.vietnam
    when: Dec. 1–3
    date: '1964-12-01'
    thread: vietnam
    c: 'Taylor and the principals with Johnson. A first phase approved for thirty days: armed reconnaissance and air strikes against the infiltration routes in Laos, reprisals for any major attack. A second phase, direct military pressure on the North, "after the GVN has shown itself firmly in control." Taylor''s instructions, Dec. 3.'
    n: 'FRUS 1964–68, I, docs. [432](https://history.state.gov/historicaldocuments/frus1964-68v01/d432), [433](https://history.state.gov/historicaldocuments/frus1964-68v01/d433), [434](https://history.state.gov/historicaldocuments/frus1964-68v01/d434), [435](https://history.state.gov/historicaldocuments/frus1964-68v01/d435); [FRUS 1964–68, XXVIII, doc. 148](https://history.state.gov/historicaldocuments/frus1964-68v28/d148). See [[cal.1964-11-01.vietnam]]. Names: Taylor (Viet. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:taylor-maxwell]
  - id: cal.1964-12-02.states-and-cities
    when: Dec. 2–8
    date: '1964-12-02'
    thread: students
    also: [states-and-cities]
    c: 'Berkeley. Savio on the steps of Sproul Hall; the Free Speech Movement occupies the building. On Brown''s order the police arrest nearly 800 in the morning. Dec. 8, the Academic Senate, 824–115: the content of speech or advocacy not to be restricted by the University.'
    n: '[Resolution of the Academic Senate, Berkeley Division](https://www.fsm-a.org/stacks/ACSenate.html) (Dec. 8, 1964). Savio, Sproul Hall steps, Berkeley (K–J Cong. II.K). See [[cal.1964-10-01.students]]. Names: Savio (K–J Cong. III.H); Brown (K–J Cong. III.F).'
    tags: [name:savio-mario, name:brown-edmund-g]
  - id: cal.1964-12-03.civil-rights-bill
    when: Dec. 3–4
    date: '1964-12-03'
    thread: civil-rights-bill
    also: [civil-rights-the-executive]
    c: 'Johnson approves the first regulations under Title VI: no discrimination by race, color, or national origin in programs aided by Interior, Agriculture, Labor, HEW, the Housing and Home Finance Agency, GSA, and the Science Foundation. Published Dec. 4; the other agencies to follow.'
    n: '[Statement by the President Upon Approving Civil Rights Regulations Covering the Programs of Federal Departments and Agencies](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-approving-civil-rights-regulations-covering-the-programs) (Dec. 4, 1964). [29 Fed. Reg. 16273](https://www.govinfo.gov/app/details/FR-1964-12-04). Graham, *The Civil Rights Era* (K–J Adm. II.C). See [[cal.1964-07-02.civil-rights-bill]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-12-04.mississippi
    when: Dec. 4
    date: '1964-12-04'
    thread: mississippi
    c: 'The FBI arrests 19 men, Sheriff Rainey and Deputy Price of Neshoba County among them, for conspiracy against the rights of Chaney, Goodman, and Schwerner. Dec. 10, the U.S. commissioner at Meridian dismisses the charges: the confession they rest on hearsay. A federal grand jury indicts 18, Jan. 15, 1965. Check the count and the date.'
    n: '*United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966) (K–J Adm. II.H.1). Dittmer, *Local People* (K–J Cong. II.F). See [[cal.1964-06-21.mississippi]]. Names: Rainey, Price, Chaney, Goodman, Schwerner (K–J Cong. III.K).'
    tags: [name:rainey-lawrence-a, name:price-cecil-r, name:chaney-james-e, name:goodman-andrew, name:schwerner-michael]
  - id: cal.1964-12-06.opinion
    when: Dec. 6
    date: '1964-12-06'
    thread: opinion
    c: 'Gallup, Nov. 6–11: the policy Johnson should follow: more to the left, with labor and liberal groups, 23 percent; more to the right, with business and conservative groups, 19; the middle, 44. The policy he will follow: left 35, right 11, middle 33.'
    n: '*The Gallup Poll*, III, 1910 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-12-07.europe-and-the-alliance
    when: Dec. 7–9
    date: '1964-12-07'
    thread: europe-and-the-alliance
    c: 'Wilson in Washington, with Gordon Walker and Healey. The British propose an Atlantic Nuclear Force in place of the MLF: their strategic bombers, less some, and four Polaris submarines; mixed manning to be tried. No decision. Dec. 17, NSAM 322: no American official to press for a binding agreement; no agreement against France.'
    n: '[Joint Statement Following Discussions With the Prime Minister of Great Britain](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-the-prime-minister-great-britain-0) (Dec. 8, 1964). FRUS 1964–68, XIII, docs. [58](https://history.state.gov/historicaldocuments/frus1964-68v13/d58), [59](https://history.state.gov/historicaldocuments/frus1964-68v13/d59), [61](https://history.state.gov/historicaldocuments/frus1964-68v13/d61); [NSAM No. 322](https://history.state.gov/historicaldocuments/frus1964-68v13/d65) (Dec. 17, 1964). Schwartz, *Lyndon Johnson and Europe*; Priest, *Kennedy, Johnson and NATO* (K–J Adm. II.D). See [[cal.1963-01-24.europe-and-the-alliance]]. Names: Wilson (K–J Adm. III.J); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:wilson-harold, name:gordon-walker-patrick-c, name:healey-denis-w]
  - id: cal.1964-12-09.health
    when: Dec. 9
    date: '1964-12-09'
    thread: health
    c: 'The Commission on Heart Disease, Cancer and Stroke reports, DeBakey chairman: a national program against the three diseases, seven deaths in ten, through regional centers of research, teaching, and care.'
    n: '[Remarks Upon Receiving Report of the President''s Commission on Heart Disease, Cancer and Stroke](https://www.presidency.ucsb.edu/documents/remarks-upon-receiving-report-the-presidents-commission-heart-disease-cancer-and-stroke) (Dec. 9, 1964). President''s Commission on Heart Disease, Cancer and Stroke, *A National Program to Conquer Heart Disease, Cancer and Stroke* (1964). Names: DeBakey (K–J Cong. III.K).'
    tags: [name:johnson-lyndon-b, name:debakey-michael-e]
  - id: cal.1964-12-10.voting-rights
    when: Dec. 10–18
    date: '1964-12-10'
    thread: king
    also: [voting-rights, civil-rights-the-executive]
    c: King receives the Nobel Peace Prize at Oslo, from Gunnar Jahn, the committee's chairman. Dec. 18, at the White House, he asks Johnson for a voting rights bill; Johnson does not promise one for the coming session. Check the date and the reply.
    n: '[Acceptance speech](https://www.nobelprize.org/prizes/peace/1964/king/acceptance-speech/) (Dec. 10, 1964). Kotz, *Judgment Days* (K–J Adm. II.C). See [[cal.1964-10-14.king]], [[cal.1964-11-18.civil-rights-the-executive]]. Names: King (K–J Cong. III.H); Johnson (K–J Adm. III.D).'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b]
  - id: cal.1964-12-12.poverty
    when: Dec. 12
    date: '1964-12-12'
    thread: poverty
    c: 'The first VISTA volunteers at the White House, Shriver presenting them: 3,500 to be in the field the first year.'
    n: '[Remarks to Members of VISTA - "Volunteers in Service to America."](https://www.presidency.ucsb.edu/documents/remarks-members-vista-volunteers-service-america) (Dec. 12, 1964). Gillette, *Launching the War on Poverty* (K–J Adm. II.B). Stossel, *Sarge* (K–J Adm. II.G.5). See [[cal.1964-08-20.poverty]]. Names: Shriver (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:shriver-r-sargent]
  - id: cal.1964-12-14.court
    when: Dec. 14
    date: '1964-12-14'
    thread: court
    also: [civil-rights-bill, desegregation-public-places]
    c: '*Heart of Atlanta Motel v. United States*, [379 U.S. 241](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379241/usrep379241.pdf), and *Katzenbach v. McClung*, [379 U.S. 294](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379294/usrep379294.pdf): Title II upheld under the commerce power, for a motel serving travelers and for Ollie''s Barbecue in Birmingham. Clark for a unanimous Court. *Hamm v. City of Rock Hill*, [379 U.S. 306](https://tile.loc.gov/storage-services/service/ll/usrep/usrep379/usrep379306/usrep379306.pdf): sit-in convictions abated by the Act, 5–4.'
    n: 'Opinions (K–J Cong. II.J.1). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-07-02.civil-rights-bill]]. Names: Clark (K–J Cong. III.G).'
    tags: [name:clark-tom-c]
  - id: cal.1964-12-16.transition-and-staff
    when: Dec. 16
    date: '1964-12-16'
    thread: transition-and-staff
    c: Hodges resigns as Secretary of Commerce. Connor, president of Merck, named in his place; sworn in Jan. 18.
    n: '[Remarks at a Televised Ceremony Marking the Change in Leadership at the Department of Commerce](https://www.presidency.ucsb.edu/documents/remarks-televised-ceremony-marking-the-change-leadership-the-department-commerce) (Dec. 16, 1964); [Remarks at the Swearing In of John T. Connor as Secretary of Commerce](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-john-t-connor-secretary-commerce) (Jan. 18, 1965). See [[cal.1961-01-20.transition-and-staff]]. Names: Hodges, Connor (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:hodges-luther-h, name:connor-john-t]
  - id: cal.1964-12-16.opinion
    when: Dec. 16
    date: '1964-12-16'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Nov. 20–25: more often to blame if a person is poor: lack of effort 30 percent, circumstances 31, both 34. Goldwater voters 42 effort; Johnson voters 28. Incomes of $7,000 and over 42 effort; under $3,000, 18.'
    n: '*The Gallup Poll*, III, 1910–11 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Johnson (K–J Adm. III.D).'
    tags: [name:goldwater-barry-m, name:johnson-lyndon-b]
  - id: cal.1964-12-18.latin-america
    when: Dec. 18
    date: '1964-12-18'
    thread: latin-america
    c: 'Panama. Johnson: a sea-level canal to be planned with Panama and the other governments concerned, four routes in view; and an entirely new treaty for the present canal, in place of the treaty of 1903.'
    n: '[Remarks on the Decision To Build a Sea Level Canal and To Negotiate a New Treaty With Panama](https://www.presidency.ucsb.edu/documents/remarks-the-decision-build-sea-level-canal-and-negotiate-new-treaty-with-panama) (Dec. 18, 1964). FRUS 1964–68, XXXI, docs. [420](https://history.state.gov/historicaldocuments/frus1964-68v31/d420), [421](https://history.state.gov/historicaldocuments/frus1964-68v31/d421). Walter LaFeber, *The Panama Canal: The Crisis in Historical Perspective* (1978). See [[cal.1964-01-09.latin-america]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1964-12-20.vietnam
    when: Dec. 20–25
    date: '1964-12-20'
    thread: vietnam
    c: Saigon. Khanh and the young generals, Ky and Thieu among them, dissolve the High National Council and arrest some of its members. Taylor reproves the generals; they move to have him declared persona non grata, Khanh forwarding their complaint to Huong. Washington backs Taylor.
    n: 'FRUS 1964–68, I, docs. [451](https://history.state.gov/historicaldocuments/frus1964-68v01/d451), [453](https://history.state.gov/historicaldocuments/frus1964-68v01/d453), [454](https://history.state.gov/historicaldocuments/frus1964-68v01/d454), [457](https://history.state.gov/historicaldocuments/frus1964-68v01/d457), [464](https://history.state.gov/historicaldocuments/frus1964-68v01/d464), [465](https://history.state.gov/historicaldocuments/frus1964-68v01/d465), [467](https://history.state.gov/historicaldocuments/frus1964-68v01/d467). Shaplen, *The Lost Revolution*; Ahern, *The CIA and the Generals*; Topmiller, *The Lotus Unleashed*; Vinh The Lam, *The History of South Vietnam* (Viet. II.E.5). Nguyen Cao Ky, *Twenty Years and Twenty Days*; Nguyen Cao Ky, *Buddha''s Child* (Viet. II.H.3). Taylor, *Swords and Plowshares* (Viet. II.H.1). See [[cal.1964-11-01.vietnam]]. Names: Khanh, Ky, Thieu, Huong (Viet. III.G); Taylor (Viet. III.A).'
    tags: [name:nguyen-khanh, name:nguyen-cao-ky, name:nguyen-van-thieu, name:tran-van-huong, name:taylor-maxwell]
  - id: cal.1964-12-24.vietnam
    when: Dec. 24
    date: '1964-12-24'
    thread: vietnam
    c: 'A bomb in the Brink Hotel, an American officers'' quarters in Saigon, 6 p.m.: 2 killed, 50 hurt. Taylor asks a reprisal; refused. Johnson to Taylor, Dec. 30: "I have never felt that this war will be won from the air"; more Rangers, Special Forces, and Marines instead.'
    n: 'FRUS 1964–68, I, docs. [465](https://history.state.gov/historicaldocuments/frus1964-68v01/d465), [477](https://history.state.gov/historicaldocuments/frus1964-68v01/d477). See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-20.vietnam]]. Names: Taylor (Viet. III.A); Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:taylor-maxwell]
  - id: cal.1964-12-29.congress
    when: Dec. 29
    date: '1964-12-29'
    thread: congress
    c: Humphrey resigns from the Senate. Rolvaag appoints Mondale, Minnesota's attorney general, Dec. 30. Salinger resigns, Dec. 31; Murphy, elected for the next term, appointed to the seat, Jan. 1, for the seniority.
    n: '[111 Cong. Rec., Senate, Jan. 4, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-1-1.pdf). Mondale, *The Good Fight* (1968 list II.C.2). Names: Humphrey (K–J Cong. III.A); Mondale (Cong. III.B); Salinger (K–J Adm. III.B); Murphy (Opp. III.B).'
    tags: [name:humphrey-hubert-h, name:rolvaag-karl-f, name:mondale-walter-f, name:salinger-pierre, name:murphy-george]
