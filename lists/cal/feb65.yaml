    when: Feb.
    date: 1965-02
    thread: states-and-cities
    also: [crime-and-hijacking]
    c: 'Iowa abolishes the death penalty: the Senate''s vote 35–20; Hughes signs.'
    n: '[*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 110. *Des Moines Register*, Feb. 19, 1965 (Check: the House''s vote and the day of signing). [Wikipedia, "Capital punishment in Iowa"](https://en.wikipedia.org/wiki/Capital_punishment_in_Iowa). [[w.hughes-man-from-ida-grove]]. Names: Hughes.'
