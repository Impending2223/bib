# Cal. LXIII February 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXIII
entries:
  - id: cal.1965-02-01.voting-rights
    when: Feb. 1–9
    date: '1965-02-01'
    thread: voting-rights
    also: [alabama, king]
    c: 'Selma. King and Abernathy arrested with some 250 marching to the courthouse; they refuse bond. At Marion, in Perry County, some 700 arrested the same day. Feb. 4, Johnson: "all Americans should be indignant when one American is denied the right to vote"; Judge Thomas suspends the registrars'' literacy test and orders at least 100 applications taken each registration day. Feb. 5, King, from the Selma jail, in the *New York Times*: "there are more Negroes in jail with me than there are on the voting rolls." Feb. 9, King sees Humphrey and Katzenbach, then Johnson, at the White House. Check the counts and the meeting of Feb. 9.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1035) (Feb. 4, 1965). [[w.garrow-protest-at-selma]]; [[w.garrow-bearing-the-cross]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]; [[cal.1965-01-22.voting-rights]]. Names: King, Abernathy, Johnson, Humphrey, Thomas, Katzenbach.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david, name:johnson-lyndon-b, name:thomas-daniel-h, name:humphrey-hubert-h, name:katzenbach-nicholas]
  - id: cal.1965-02-01.congress
    when: Feb. 1
    date: '1965-02-01'
    thread: congress
    also: [south-carolina]
    c: Watson of South Carolina, stripped of his seniority by the Democratic caucus, leaves the House on its adjournment. His letter of Jan. 13 to the Governor had made the resignation effective when a special election was called; none was, and on Jan. 27 he resigned as of Feb. 1.
    n: '[111 Cong. Rec., House, Jan. 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-1-1.pdf). See [[cal.1965-01-02.congress]]. Names: Watson.'
    tags: [name:watson-albert-w]
  - id: cal.1965-02-01.jobs-and-wages
    when: Feb. 1
    date: '1965-02-01'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Senate passes the Appalachian Regional Development Act, S. 3, [62–22](https://voteview.com/rollcall/RS0890007): $840 million for a development highway system; $252.4 million through June 1967 for the other programs; a regional commission of a federal cochairman and a member from each State.'
    n: '[111 Cong. Rec., Senate, Feb. 1, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-3-2.pdf). [[w.eller-uneven-ground]]. See [[cal.1964-09-25.jobs-and-wages]].'
  - id: cal.1965-02-02.states-and-cities
    when: Feb. 2
    date: '1965-02-02'
    thread: states-and-cities
    c: 'Special message on home rule for the District of Columbia. A charter bill: an elected local government and an elected delegate in the House. Congress keeps its power to legislate for the District and to repeal the council''s acts; the President an absolute veto.'
    n: '[Special Message to the Congress on Home Rule for the District of Columbia](https://www.presidency.ucsb.edu/documents/special-message-the-congress-home-rule-for-the-district-columbia) (Feb. 2, 1965). See [[cal.1961-03-29.states-and-cities]].'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1965-02-04.farm
    when: Feb. 4
    date: '1965-02-04'
    thread: farm
    c: Agriculture message. Price and income supports kept; a commission to examine the whole of farm policy; a long-term land use program; rural housing loans. "Parity of opportunity" for rural America, where 46 percent of the families with incomes under $3,000 live.
    n: '[Special Message to the Congress on Agriculture](https://www.presidency.ucsb.edu/documents/special-message-the-congress-agriculture-8) (Feb. 4, 1965); [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1035) (Feb. 4, 1965). [[w.cochrane-american-farm-policy-1948]]. See [[cal.1964-08-31.farm]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-05.civil-rights-the-executive
    when: Feb. 5
    date: '1965-02-05'
    thread: civil-rights-the-executive
    c: 'Executive Order 11197: a President''s Council on Equal Opportunity, Humphrey chairman, the heads of the departments and agencies with civil rights duties its members. It is to coordinate their work under the Civil Rights Acts of 1957 and 1964, as Humphrey had recommended. Jan. 26, Humphrey had been named chairman of the Peace Corps'' National Advisory Council.'
    n: '[Executive Order 11197—Establishing the President''s Council on Equal Opportunity](https://www.presidency.ucsb.edu/documents/executive-order-11197-establishing-the-presidents-council-equal-opportunity) (Feb. 5, 1965), [30 Fed. Reg. 1721](https://www.govinfo.gov/app/details/FR-1965-02-09); [Letter to the Vice President Upon Establishing the President''s Council on Equal Opportunity](https://www.presidency.ucsb.edu/documents/letter-the-vice-president-upon-establishing-the-presidents-council-equal-opportunity) (Feb. 6, 1965); [Letter to the Vice President Asking Him To Serve as Chairman, National Advisory Council of the Peace Corps](https://www.presidency.ucsb.edu/documents/letter-the-vice-president-asking-him-serve-chairman-national-advisory-council-the-peace) (Jan. 26, 1965). [[w.graham-civil-rights-era]]; [[w.solberg-hubert-humphrey]]. See [[cal.1964-12-03.civil-rights-bill]]. Names: Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-02-06.soviet-union
    when: Feb. 6–11
    date: '1965-02-06'
    thread: soviet-union
    also: [vietnam]
    c: 'Kosygin in Hanoi, from Feb. 6; the attack at Pleiku and the first reprisal strikes while he is there. A destroyer patrol in the Gulf of Tonkin had been called off for the visit. A Soviet government statement promises "further measures to safeguard the security and strengthen the defensive capability" of the North. Feb. 9, a crowd of some 1,500, Asian students most of them, attacks the American Embassy in Moscow; Feb. 10, Johnson: the police protection "wholly inadequate."'
    n: 'FRUS 1964–68, II, docs. [82](https://history.state.gov/historicaldocuments/frus1964-68v02/d82), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [111](https://history.state.gov/historicaldocuments/frus1964-68v02/d111); FRUS 1964–68, XIV, docs. [91](https://history.state.gov/historicaldocuments/frus1964-68v14/d91), [92](https://history.state.gov/historicaldocuments/frus1964-68v14/d92), [93](https://history.state.gov/historicaldocuments/frus1964-68v14/d93). [White House Statement on the Attack on the U.S. Embassy in Moscow](https://www.presidency.ucsb.edu/documents/white-house-statement-the-attack-the-us-embassy-moscow) (Feb. 10, 1965). [[w.gaiduk-soviet-union-and-the]]; [[w.zhai-china-and-the-vietnam]]; [[w.dobrynin-in-confidence]]. See [[cal.1964-10-15.soviet-union]]. Names: Kosygin, Johnson.'
    tags: [name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1965-02-07.vietnam
    when: Feb. 7–8
    date: '1965-02-07'
    thread: vietnam
    c: 'Pleiku. Before dawn the Viet Cong attack the American advisers'' compound and the Camp Holloway airfield: 7 Americans killed, 109 wounded, by the first count; aircraft destroyed. McGeorge Bundy, in Saigon since Feb. 4, and Taylor recommend reprisal; the NSC, meeting the evening of Feb. 6 in Washington, approves. Flaming Dart: of four army barracks in southern North Vietnam, Navy planes from the carriers hit Đồng Hới, the others weathered in; Feb. 8, South Vietnamese planes, with American cover, strike Chấp Lễ. Johnson orders American dependents home. Check the final count.'
    n: '[Statement by the President Upon Ordering Withdrawal of American Dependents From South Viet-Nam](https://www.presidency.ucsb.edu/documents/statement-the-president-upon-ordering-withdrawal-american-dependents-from-south-viet-nam) (Feb. 7, 1965). FRUS 1964–68, II, docs. [76](https://history.state.gov/historicaldocuments/frus1964-68v02/d76), [77](https://history.state.gov/historicaldocuments/frus1964-68v02/d77), [78](https://history.state.gov/historicaldocuments/frus1964-68v02/d78), [79](https://history.state.gov/historicaldocuments/frus1964-68v02/d79), [80](https://history.state.gov/historicaldocuments/frus1964-68v02/d80), [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87). [[w.pentagon-papers]]; [[w.logevall-choosing-war]]; [[w.kahin-intervention]]; [[w.gibbons-u-s-government-and]]; [[w.berman-planning-a-tragedy]]; [[w.khong-analogies-at-war]]; [[w.vandemark-into-the-quagmire-1995]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.preston-war-council]]; [[w.goldstein-lessons-in-disaster]]; [[w.gardner-pay-any-price]]; [[w.kaiser-american-tragedy]]; [[w.moyar-triumph-forsaken]]; [[w.thompson-rolling-thunder]]; [[w.clodfelter-limits-of-air-power]]; [[w.staaveren-gradual-failure]]; [[w.pribbenow-rolling-thunder-and-linebacker]]; [[w.nguyen-hanois-war]]; [[w.johnson-vantage-point]]; [[w.mcnamara-in-retrospect]]; [[w.taylor-swords-and-plowshares]]; [[w.cooper-lost-crusade]]; [[w.bird-color-of-truth]]; [[w.westmoreland-soldier-reports]]. See [[cal.1964-11-01.vietnam]]; [[cal.1964-12-24.vietnam]]; [[cal.1965-01-27.vietnam]]. Names: McGeorge Bundy, Taylor, Johnson.'
    tags: [name:bundy-mcgeorge, name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1965-02-07.vietnam-2
    when: Feb. 7–8
    date: '1965-02-07'
    thread: vietnam
    c: 'McGeorge Bundy''s report to Johnson, written on the flight home: without new American action "defeat appears inevitable," within "the next year or so." Its annex, "A Policy of Sustained Reprisal": air and naval action against the North, justified by "the whole Viet Cong campaign of violence and terror in the South"; its odds "somewhere between 25% and 75%," worth it even if it fails. Feb. 8, Johnson to Taylor: the December plan for continuing action against the North to be carried out.'
    n: 'FRUS 1964–68, II, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v02/d84), [91](https://history.state.gov/historicaldocuments/frus1964-68v02/d91). [[w.pentagon-papers]]. See [[cal.1965-02-07.vietnam]]. Names: McGeorge Bundy, Taylor, Johnson.'
    tags: [name:bundy-mcgeorge, name:taylor-maxwell, name:johnson-lyndon-b]
  - id: cal.1965-02-07.opinion
    when: Feb. 7
    date: '1965-02-07'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Jan. 7–12: a police permit required to buy a gun: favor 73 percent, oppose 23. A gun in the home: 48.'
    n: '[[w.gallup-poll]], III, 1922–23.'
  - id: cal.1965-02-08.conservation
    when: Feb. 8
    date: '1965-02-08'
    thread: conservation
    c: Special message on natural beauty. Billboards and junkyards along the highways to be controlled; landscaping on federal-aid roads; a national system of wild rivers, and one of trails; the Potomac a model; a Redwood National Park studied; the Land and Water Conservation Fund fully funded. Water quality standards; talks with industry on automobile exhaust. A White House Conference on Natural Beauty, Laurance Rockefeller chairman.
    n: '[Special Message to the Congress on Conservation and Restoration of Natural Beauty](https://www.presidency.ucsb.edu/documents/special-message-the-congress-conservation-and-restoration-natural-beauty) (Feb. 8, 1965). [[w.gould-lady-bird-johnson-and]]. See [[cal.1964-09-03.conservation]]; [[cal.1965-01-28.conservation]]. Names: Laurance Rockefeller.'
    tags: [name:johnson-lyndon-b, name:rockefeller-laurance-s]
  - id: cal.1965-02-09.economy
    when: Feb. 9–18
    date: '1965-02-09'
    thread: economy
    c: House passes the bill to end the 25 percent gold certificate reserve against Federal Reserve deposits, H.R. 3818, [300–82](https://voteview.com/rollcall/RH0890008); the reserve against notes kept. Senate, Feb. 18, [74–7](https://voteview.com/rollcall/RS0890016).
    n: '[111 Cong. Rec., House, Feb. 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-8-2.pdf); [111 Cong. Rec., Senate, Feb. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt3-2-2.pdf). [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1965-01-28.economy]].'
  - id: cal.1965-02-10.vietnam
    when: Feb. 10–11
    date: '1965-02-10'
    thread: vietnam
    c: 'Qui Nhơn. A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed. Humphrey, Ball and Thompson ask that reprisal wait until Kosygin has left the area; McNamara and most of the others for striking at once. Flaming Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized zone; American and South Vietnamese planes, the barracks at Chấp Lễ.'
    n: 'FRUS 1964–68, II, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106). See [[cal.1965-02-07.vietnam]]. Names: Humphrey, Ball, McNamara, Thompson, Kosygin.'
    tags: [name:humphrey-hubert-h, name:ball-george-w, name:thompson-llewellyn-e, name:mcnamara-robert-s, name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1965-02-10.economy
    when: Feb. 10–18
    date: '1965-02-10'
    thread: economy
    also: [trade]
    c: 'Balance of payments message: the 1964 deficit $3 billion. Executive Order 11198 puts the interest equalization tax on bank loans abroad of a year or more; the tax to be extended two years and to cover other lenders'' credit. Voluntary restraint on lending and investing abroad, the Federal Reserve to enlist the banks, Commerce and the Treasury the corporations. Returning tourists'' duty-free allowance to $50. Feb. 18, Johnson asks the business and banking leaders at the White House for their help.'
    n: '[Special Message to the Congress on International Balance of Payments](https://www.presidency.ucsb.edu/documents/special-message-the-congress-international-balance-payments) (Feb. 10, 1965); [Executive Order 11198—Imposition of Interest Equalization Tax on Certain Commercial Bank Loans](https://www.presidency.ucsb.edu/documents/executive-order-11198-imposition-interest-equalization-tax-certain-commercial-bank-loans) (Feb. 10, 1965), [30 Fed. Reg. 1929](https://www.govinfo.gov/app/details/FR-1965-02-11); [Remarks to Business and Banking Leaders on the Balance of Payments Problem](https://www.presidency.ucsb.edu/documents/remarks-business-and-banking-leaders-the-balance-payments-problem) (Feb. 18, 1965). [[w.solomon-international-monetary-system-1945]]; [[w.gavin-gold-dollars-and-power]]. See [[cal.1963-07-18.economy]]; [[cal.1964-09-02.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-10.jobs-and-wages
    when: Feb. 10–12
    date: '1965-02-10'
    thread: jobs-and-wages
    c: 'The longshoremen''s strike. The ILA has struck every Atlantic and Gulf port since Jan. 11. Johnson: the strike "totally unjustified" in the North Atlantic and East Gulf ports, where agreement has been reached; Wirtz, Connor and Senator Morse to recommend terms for the South Atlantic and West Gulf. Feb. 12, the employers accept the recommendations; nearly all the major ports to reopen the next morning.'
    n: '[Statement by the President on the Longshoremen''s Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-the-longshoremens-strike-2) (Feb. 10, 1965); [Statement by the President Announcing Progress in the Longshoremen''s Strike](https://www.presidency.ucsb.edu/documents/statement-the-president-announcing-progress-the-longshoremens-strike) (Feb. 12, 1965). [[w.jensen-strife-on-the-waterfront]]. Names: Johnson, Wirtz, Connor, Morse.'
    tags: [name:johnson-lyndon-b, name:wirtz-w-willard, name:connor-john-t, name:morse-wayne]
  - id: cal.1965-02-13.vietnam
    when: Feb. 13–20
    date: '1965-02-13'
    thread: vietnam
    c: 'Johnson approves "a program of measured and limited air action," with Saigon, against military targets in the North below the 19th parallel, "until further notice": once or twice a week, two or three targets a day. With it, the case against Hanoi to the Security Council and a readiness for "talks." Feb. 15, Khánh and Oánh accept the program. Rolling Thunder I, set for Feb. 20, put off by the attempted coup in Saigon.'
    n: 'FRUS 1964–68, II, docs. [113](https://history.state.gov/historicaldocuments/frus1964-68v02/d113), [115](https://history.state.gov/historicaldocuments/frus1964-68v02/d115), [119](https://history.state.gov/historicaldocuments/frus1964-68v02/d119), [150](https://history.state.gov/historicaldocuments/frus1964-68v02/d150). See [[cal.1965-02-07.vietnam]]. Names: Johnson, Nguyễn Khánh, Nguyễn Xuân Oánh.'
    tags: [name:johnson-lyndon-b, name:nguyen-khanh, name:nguyen-xuan-oanh]
  - id: cal.1965-02-13.transition-and-staff
    when: Feb. 13
    date: '1965-02-13'
    thread: transition-and-staff
    c: Katzenbach sworn as Attorney General, Ramsey Clark as Deputy, at the White House. The Senate confirmed both Feb. 10 without a roll call. Katzenbach had been acting since September.
    n: '[Remarks at the Swearing In of Nicholas deB. Katzenbach as Attorney General and Ramsey Clark as Deputy Attorney General](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-nicholas-deb-katzenbach-attorney-general-and-ramsey-clark-deputy) (Feb. 13, 1965). [111 Cong. Rec., Senate, Feb. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt2-9-2.pdf). [[w.katzenbach-some-of-it-was]]. See [[cal.1964-09-03.transition-and-staff]]. Names: Katzenbach, Clark.'
    tags: [name:katzenbach-nicholas, name:clark-ramsey, name:johnson-lyndon-b]
  - id: cal.1965-02-16.vietnam
    when: Feb. 16–25
    date: '1965-02-16'
    thread: vietnam
    c: Saigon. The Armed Forces Council names Quát Prime Minister, Feb. 16; Sửu stays Chief of State. Feb. 19, General Phát and Colonel Thảo move against Khánh, tanks in the city; the coup collapses by the next morning. The Council then votes Khánh out as commander in chief, Feb. 20–21. Named ambassador at large, he leaves the country, Feb. 25. Check the day.
    n: 'FRUS 1964–68, II, docs. [123](https://history.state.gov/historicaldocuments/frus1964-68v02/d123), [141](https://history.state.gov/historicaldocuments/frus1964-68v02/d141), [148](https://history.state.gov/historicaldocuments/frus1964-68v02/d148), [152](https://history.state.gov/historicaldocuments/frus1964-68v02/d152), [154](https://history.state.gov/historicaldocuments/frus1964-68v02/d154). [[w.shaplen-lost-revolution]]; [[w.ahern-cia-and-the-generals]]; [[w.topmiller-lotus-unleashed]]. See [[cal.1964-12-20.vietnam]]; [[cal.1965-01-27.vietnam]]. Names: Phan Huy Quát, Phan Khắc Sửu, Lâm Văn Phát, Phạm Ngọc Thảo, Nguyễn Khánh.'
    tags: [name:phan-huy-quat, name:phan-khac-suu, name:lam-van-phat, name:pham-ngoc-thao, name:nguyen-khanh]
  - id: cal.1965-02-16.opinion
    when: Feb. 16
    date: '1965-02-16'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey, no field dates printed: have heard of the recent developments in Vietnam, 91 percent. Of them, the action taken by the United States in the last few days: approve 67, disapprove 15. Continue present efforts in South Vietnam, 64; pull out, 18. Continue at the risk of nuclear war, 31; not, 21.'
    n: '[[w.gallup-poll]], III, 1925.'
  - id: cal.1965-02-17.vietnam
    when: Feb. 17
    date: '1965-02-17'
    thread: vietnam
    c: 'Johnson to the National Industrial Conference Board: "We seek no wider war," but "our continuing actions will be those which are justified and those that are made necessary by the continuing aggression of others." Humphrey''s memorandum to Johnson, the same day: 1965 "the year of minimum political risk"; the administration better placed to "cut losses" than any this century; the opposition "more Democratic than Republican." Humphrey kept from the Vietnam councils for a time after. Check.'
    n: '[Remarks to the National Industrial Conference Board](https://www.presidency.ucsb.edu/documents/remarks-the-national-industrial-conference-board) (Feb. 17, 1965). [FRUS 1964–68, II, doc. 134](https://history.state.gov/historicaldocuments/frus1964-68v02/d134). [[w.humphrey-education-of-a-public-1976]]; [[w.solberg-hubert-humphrey]]; [[w.johns-price-of-loyalty]]. See [[cal.1965-02-07.vietnam]]. Names: Johnson, Humphrey.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
  - id: cal.1965-02-17.poverty
    when: Feb. 17
    date: '1965-02-17'
    thread: poverty
    c: 'Letter to Congress on the war on poverty: the Economic Opportunity Act''s programs extended two years; $1.5 billion for fiscal 1966; the college work-study program to the Office of Education.'
    n: '[Letter to the President of the Senate and to the Speaker of the House on Stepping Up the War on Poverty](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-stepping-the-war-poverty) (Feb. 17, 1965). [[w.gillette-launching-the-war-on]]. See [[cal.1964-12-12.poverty]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-17.opinion
    when: Feb. 17
    date: '1965-02-17'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, special survey: Vietnam likely to lead to a bigger war, 45 percent; not, 44. The United States handling South Vietnam as well as could be expected, 62; badly, 22. A UN army to deal with Southeast Asia and Vietnam: approve 60, disapprove 20.'
    n: '[[w.gallup-poll]], III, 1925.'
  - id: cal.1965-02-17.japan-and-korea
    when: Feb. 17–20
    date: '1965-02-17'
    thread: japan-and-korea
    c: 'Shiina, Japan''s Foreign Minister, in Seoul. The Basic Relations Treaty initialed, Feb. 20: embassies at once.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [357](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d357), [358](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d358). See [[cal.1964-06-03.japan-and-korea]]. Names: Shiina.'
    tags: [name:shiina-etsusaburo]
  - id: cal.1965-02-18.voting-rights
    when: Feb. 18
    date: '1965-02-18'
    thread: voting-rights
    also: [alabama]
    c: Marion, Perry County. A night march of some 500 from Zion Methodist Church toward the jail, where an SCLC worker is held; the street lights go out, and state troopers and local police beat the marchers back. A trooper shoots Jimmie Lee Jackson, 26, in a café where he had gone with his mother and grandfather. He dies at Selma, Feb. 26. Check.
    n: '[[w.garrow-protest-at-selma]]; [[w.may-bending-toward-justice]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]. See [[cal.1965-01-02.voting-rights]]; [[cal.1965-02-01.voting-rights]]. Names: Jackson.'
    tags: [name:jackson-jimmie-lee]
  - id: cal.1965-02-19.succession
    when: Feb. 19
    date: '1965-02-19'
    thread: succession
    c: Senate passes S.J. Res. 1, the amendment on presidential inability and vice-presidential vacancies, [72–0](https://voteview.com/rollcall/RS0890018). The President may declare his own inability; the Vice President, with a majority of the Cabinet, may declare it; a disagreement goes to Congress, two-thirds of both Houses to keep the Vice President acting. A vacant Vice Presidency filled by the President's nominee, confirmed by a majority of both Houses.
    n: '[111 Cong. Rec., Senate, Feb. 19, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-1965/pdf/GPO-CRECB-1965-pt3-3-1.pdf) (Voteview counts 61 yeas; the Record, 72). See [[cal.1964-09-28.succession]]; [[cal.1965-01-28.succession]]. Names: Bayh.'
    tags: [name:bayh-birch]
  - id: cal.1965-02-21.states-and-cities
    when: Feb. 21
    date: '1965-02-21'
    thread: black-nationalism
    also: [states-and-cities]
    c: Malcolm X shot dead at the Audubon Ballroom, Washington Heights, as he begins to address his Organization of Afro-American Unity, some 400 present. Talmadge Hayer, of the Nation of Islam, seized at the scene. Malcolm X's house in East Elmhurst, which the Nation had sued to reclaim, burned the night of Feb. 14. Hayer and two others convicted, Mar. 1966; the other two exonerated, Nov. 2021.
    n: 'See [[cal.1963-12-01.black-nationalism]]. Names: Malcolm X, Hayer.'
    tags: [name:malcolm-x, name:hayer-talmadge]
  - id: cal.1965-02-21.opinion
    when: Feb. 21
    date: '1965-02-21'
    thread: opinion
    c: 'Gallup, Jan. 28–Feb. 2: liked best about Johnson: personality, character, 17 percent; experience, ability, 17; the war on poverty 8; cares for the working man 6; Medicare 6; civil rights 5; continuing Kennedy''s policies 5. Liked least: too much a politician 7; dull 7; civil rights 7; foreign policy 4; spending 4.'
    n: '[[w.gallup-poll]], III, 1925–26. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-02-22.vietnam
    when: Feb. 22–26
    date: '1965-02-22'
    thread: vietnam
    c: Westmoreland asks for Marines to guard the air base at Đà Nẵng. Taylor, Feb. 22, would accept one battalion landing team, but warns that once the policy against ground combat forces is breached "it will be very difficult to hold line." Feb. 24, American jets from Biên Hòa and Đà Nẵng strike the Viet Cong in the pass between An Khê and Pleiku. Feb. 26, Johnson, with Rusk, Ball and McNamara, approves two battalion landing teams and a helicopter squadron for Đà Nẵng, their mission the airfield's security; Quát's consent to be sought.
    n: 'FRUS 1964–68, II, docs. [153](https://history.state.gov/historicaldocuments/frus1964-68v02/d153), [155](https://history.state.gov/historicaldocuments/frus1964-68v02/d155), [157](https://history.state.gov/historicaldocuments/frus1964-68v02/d157), [168](https://history.state.gov/historicaldocuments/frus1964-68v02/d168), [170](https://history.state.gov/historicaldocuments/frus1964-68v02/d170). [[w.shulimson-u-s-marines-in]]. See [[cal.1965-02-07.vietnam]]. Names: Westmoreland, Taylor, Rusk, Ball, McNamara, Johnson, Phan Huy Quát.'
    tags: [name:westmoreland-william, name:taylor-maxwell, name:johnson-lyndon-b, name:rusk-dean, name:ball-george-w, name:mcnamara-robert-s, name:phan-huy-quat]
  - id: cal.1965-02-23.states-and-cities-nyc
    when: Feb. 23
    date: '1965-02-23'
    thread: states-and-cities
    c: New York. Constance Baker Motley, of the NAACP Legal Defense Fund, a State Senator since Feb. 4, 1964, chosen Manhattan's borough president by the borough's members of the City Council, the first woman in the office (Check). Elected to a full term in November.
    n: '[Wikipedia, "Constance Baker Motley"](https://en.wikipedia.org/wiki/Constance_Baker_Motley). [[w.motley-equal-justice-under-law]]; [[w.biondi-to-stand-and-fight]]. See [[cal.1964-12-03.states-and-cities-nyc]]. Names: Motley.'
    tags: [state:ny, city:nyc, name:motley-constance-baker]
  - id: cal.1965-02-25.middle-east
    when: Feb. 25–Mar. 10
    date: '1965-02-25'
    thread: middle-east
    c: 'Harriman and Komer in Israel, sent by Johnson, on arms for Jordan. Memorandum of understanding, signed Mar. 10: Israel will not be the first to introduce nuclear weapons into the Arab-Israel area; the United States may sell Jordan arms to keep out Soviet arms, Hussein''s armor to stay east of the Jordan; it will sell Israel as many tanks of the same quality, complete the 150 M48s if Germany does not, and see that Israel can buy combat aircraft.'
    n: 'FRUS 1964–68, XVIII, docs. [157](https://history.state.gov/historicaldocuments/frus1964-68v18/d157), [184](https://history.state.gov/historicaldocuments/frus1964-68v18/d184), [185](https://history.state.gov/historicaldocuments/frus1964-68v18/d185) (the memorandum), [189](https://history.state.gov/historicaldocuments/frus1964-68v18/d189). [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.little-puppet-in-search-of]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.shlaim-lion-of-jordan]]. Made public: FRUS 1964–68, XVIII (2000) (Check). See [[cal.1964-06-01.middle-east]]. Names: Harriman, Komer, Hussein ibn Talal.'
    tags: [name:harriman-w-averell, name:komer-robert-w, name:johnson-lyndon-b, name:hussein-ibn-talal]
  - id: cal.1965-02-27.vietnam
    when: Feb. 27
    date: '1965-02-27'
    thread: vietnam
    c: 'State Department white paper, *Aggression from the North*: Hanoi supplies the key men, the arms, and the direction and control of the war in the South. Stevenson sends it to the president of the Security Council.'
    n: '[FRUS 1964–68, II, doc. 171](https://history.state.gov/historicaldocuments/frus1964-68v02/d171). [[w.state-aggression-from-the-north]]. See [[cal.1965-02-07.vietnam]]. Names: Stevenson.'
    tags: [name:stevenson-adlai-e]
