  - id: cal.1968-12-03.vietnam
    when: Dec. 3
    date: '1968-12-03'
    time: 1968-12-03T18:29Z
    thread: vietnam-paris
    c: 'Paris, the shape of the table. Clifford at the Tuesday lunch: "Saigon appears to be stalling until after January 20"; Kỳ not in Paris until the 9th; a date to be set for the talks. Saigon''s delegation, Phạm Đăng Lâm at its head, Kỳ over it, wants two sides; Hanoi and the NLF four parties. Johnson: "We have listened to dovish advisers"; by Clifford''s account, he should not have made the speech of Oct. 31.'
    n: 'FRUS 1964–68, VII, docs. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), [248](https://history.state.gov/historicaldocuments/frus1964-68v07/d248). [[w.drea-mcnamara-clifford-and-the-2011]], 200 (the dispute over the table); [[w.nguyen-hanois-war]], 129 (the dispute over the table). [[w.clifford-counsel-to-the-president-2]], 600, 604 (Johnson''s remark, in a footnote on 600 at the lunch; the dispute over the table, nine arrangements looked at in one meeting). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.diem-in-the-jaws-of]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-09-07.vietnam]]. Made public: FRUS 1964–68, VII (2003). Names: Clifford, Nguyễn Cao Kỳ, Phạm Đăng Lâm.'
    src:
      c: e18dee48
      rows:
        - 'w.drea-mcnamara-clifford-and-the-2011 200: A'
        - 'w.nguyen-hanois-war 129: A'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d244: A-G'
        - 'w.clifford-counsel-to-the-president-2 600, 604: A, H'
    tags: [name:clifford-clark, name:nguyen-cao-ky, name:pham-dang-lam]
    short: the shape of the table
