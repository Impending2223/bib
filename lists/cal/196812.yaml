    date: '1968-12-02'
    thread: transition-and-staff
    c: 'Franklin Lincoln, Nixon''s transition chief, to Clifford by telephone, the evening, by Clifford''s account: Nixon, advised to keep Clifford at Defense, and having weighed it, cannot keep a man of the administration he attacked.'
    n: '[[w.clifford-counsel-to-the-president-2]], 602. Names: Lincoln, Nixon, Clifford.'
