    c: 'Late 1968. Dean Cowen of the University of Georgia''s law school asks Rusk to join the faculty as professor of international law; Rusk accepts. The regents, polled by telephone, unanimous for him. Roy Harris, a regent and chairman of Wallace''s campaign in Georgia, objects: by Rusk''s account, over his daughter''s marriage to a Negro. Harris calls a special meeting; the regents override him.'
    n: '[[w.rusk-as-i-saw-it-1990]], 605; 596 (Harris: "We don''t want the university to be a haven for broken down politicians"; Maddox opposed, Richard Rusk''s narrative). Check: the days; the book dates only the approach, "late in 1968." Names: Rusk, Wallace.'
