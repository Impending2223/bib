    c: 'Kissinger to Nixon, a new NSC system, worked out with Goodpaster: the Council the principal forum for decisions; an NSC Review Group under the President''s assistant to examine every paper first; interdepartmental groups beneath it; the State Department''s Senior Interdepartmental Group to go (Check). Approved at Key Biscayne, Fla. (Check the day).'
