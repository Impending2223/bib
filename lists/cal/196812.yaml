    thread: oil
    c: 'The world''s crude oil output in 1968, as the Bureau of Mines first counted it: 38.5 million barrels a day. The United States 9.10, the Soviet Union 6.15, Venezuela 3.60, Iran 2.84, Saudi Arabia 2.83, Libya 2.59. Nigeria 0.14.'
    n: Bureau of Mines, [*Minerals Yearbook 1968*, I–II, Table 60, p. 920](https://archive.org/details/pub_usgov-minerals-yearbook_1968_12/page/n927) (1969). See [[cal.1960-12.oil]].
