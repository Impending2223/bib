  - id: cal.1968-12-11.transition-and-staff
    when: Dec. 11–12
    date: '1968-12-11'
    thread: transition-and-staff
    c: 'Washington, the Shoreham. Nixon presents his Cabinet on television: Rogers, State; David Kennedy, Treasury; Laird, Defense; Mitchell, Attorney General; Blount, Postmaster General; Hickel, Interior; Hardin, Agriculture; Stans, Commerce; Shultz, Labor; Finch, Health, Education, and Welfare; Romney, Housing and Urban Development; Volpe, Transportation. Dec. 12, Nixon alone with Johnson in the Oval Office, 5:35 to 7:25 p.m.; no record found.'
    n: 'FRUS 1964–68, XIV, doc. [331](https://history.state.gov/historicaldocuments/frus1964-68v14/d331). Opinion: [42 Op. Att''y Gen. 381](https://archive.org/details/op-atty-gen/042/page/n405/mode/1up) (1969), Clark to Laird, Jan. 3, 1969: the Ineligibility Clause no bar to his appointment while a pay raise for the office is proposed and not yet final. [[w.chester-american-melodrama]], 778. To check: [[w.evans-nixon-in-the-white]]; [[w.small-presidency-of-richard-nixon]]; [[w.nathan-plot-that-failed]]; [[w.reeves-president-nixon]]; [[w.safire-before-the-fall]]. See [[cal.1968-11-11.transition-and-staff]]. Names: Nixon, Rogers, Kennedy, Laird, Mitchell, Blount, Hickel, Hardin, Stans, Shultz, Finch, Romney, Volpe, Johnson. Check: Chester, 778, gives Dec. 12 for the television presentation.'
