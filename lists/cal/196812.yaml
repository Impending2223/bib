entries:
  - id: cal.1968-12-01.civil-disorders
    when: Dec. 1
    date: '1968-12-01'
    thread: civil-disorders
    also: [elections-1968, war-opposition]
    c: 'The Walker report, *Rights in Conflict*, made public by the National Commission on the Causes and Prevention of Violence: the violence in Chicago''s streets and parks in the conventions week, Aug. 25–29, "what can only be called a police riot," provoked in part by demonstrators. Walker, a Chicago lawyer, director of the commission''s Chicago study team.'
    n: 'To check: [[w.rights-in-conflict|full]]; [[w.farber-chicago-68]]; [[w.cohen-american-pharaoh]]. See [[cal.1968-08-22.elections-1968]]. Names: Walker.'
    tags: [name:walker-daniel, state:il, city:chicago]
  - id: cal.1968-12-02.transition-and-staff
    when: Dec. 2
    date: '1968-12-02'
    thread: transition-and-staff
    c: New York, the Pierre. Nixon names Kissinger, of Harvard, Rockefeller's adviser on foreign policy, his assistant for national security affairs. Harriman sees Nixon and Kissinger the same day (Check).
    n: 'FRUS 1964–68, VII, doc. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), n. 2. To check: [[w.kissinger-white-house-years]]; [[w.isaacson-kissinger]]; [[w.ferguson-kissinger-1923-1968]]; [[w.hersh-price-of-power]]; [[w.dallek-nixon-and-kissinger]]. Names: Nixon, Kissinger, Rockefeller, Harriman.'
    tags: [name:nixon-richard-m, name:kissinger-henry-a, name:rockefeller-nelson, name:harriman-w-averell]
  - id: cal.1968-12-02.students-san-francisco
    when: Dec. 2–3
    date: '1968-12-02'
    thread: students-sf-state
    c: 'San Francisco State, reopened by Hayakawa under a "state of emergency" declared Nov. 30. Dec. 2: he climbs a strikers'' sound truck and pulls out its wires. Dec. 3, "Bloody Tuesday": 9 injured, 31 arrested; black community leaders on the campus for the students'' demands.'
    n: '[[w.orrick-shut-it-down]], 58–61. See [[cal.1968-11-06.students]]. Names: Hayakawa.'
    tags: [state:ca, city:san-francisco, name:hayakawa-s-i]
  - id: cal.1968-12-03.vietnam
    when: Dec. 3
    date: '1968-12-03'
    thread: vietnam-paris
    c: 'Paris, the shape of the table. Clifford at the Tuesday lunch: "Saigon appears to be stalling until after January 20"; Kỳ not in Paris until the 9th; a date to be set for the talks. Saigon''s delegation, Phạm Đăng Lâm at its head, Kỳ over it, wants two sides; Hanoi and the NLF four parties.'
    n: 'FRUS 1964–68, VII, docs. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), [248](https://history.state.gov/historicaldocuments/frus1964-68v07/d248). [[w.drea-mcnamara-clifford-and-the-2011]], 200 (the dispute over the table); [[w.nguyen-hanois-war]], 129 (the dispute over the table). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.diem-in-the-jaws-of]]; [[w.clifford-counsel-to-the-president-2]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-09-07.vietnam]]. Made public: FRUS 1964–68, VII (2003). Names: Clifford, Nguyễn Cao Kỳ, Phạm Đăng Lâm.'
    src:
      c: 69a9d26a
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d244: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 200: A'
        - 'w.nguyen-hanois-war 129: A'
    tags: [name:clifford-clark, name:nguyen-cao-ky, name:pham-dang-lam]
  - id: cal.1968-12-03.economy
    when: Dec. 3
    date: '1968-12-03'
    thread: economy
    c: 'Mills to the Tax Foundation: chronic deficits push prices up, price the country out of world markets and shake confidence in the dollar; the government''s borrowing drives interest rates up.'
    n: '[[w.zelizer-taxing-america]], 262–63. To check: Mills, "Some International and Domestic Aspects of Tax and Expenditure Policy: Remarks to the Tax Foundation," Dec. 3, 1968, Mills Papers (cited by [[w.zelizer-taxing-america]], 263 n.31). See [[cal.1968-06-28.economy-surcharge]]. Names: Mills.'
    src:
      c: 2f0c03ce
      rows:
        - 'w.zelizer-taxing-america 262–63: all'
        - 'via w.zelizer-taxing-america 263 n.31: all'
    tags: [name:mills-wilbur-d]
  - id: cal.1968-12-04.transition-and-staff
    when: Dec. 4
    date: '1968-12-04'
    thread: transition-and-staff
    c: 'Cabinet meeting. Johnson''s opening statement: not to bind the next administration in major programs without overriding necessity; no fundamental changes, major reorganizations or new policies forced on it; each officer to review what remains in his department.'
    n: '[[w.johnson-vantage-point]], 557 (the statement, printed). Made public: [[w.johnson-vantage-point]], 557 (1971). See [[cal.1968-09-11.transition-and-staff]]. Names: Johnson.'
    src:
      c: 3be08120
      rows:
        - 'w.johnson-vantage-point 557: all'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-12-09.vietnam-operations
    when: Dec. 9
    date: '1968-12-09'
    thread: vietnam-operations
    c: Meade River ends, 6 p.m. The Marines report 1,023 of the enemy dead, 123 prisoners, 6 ralliers; their own losses 108 dead, 510 wounded.
    n: '[[w.shulimson-u-s-marines-in-1997]], 436. See [[cal.1968-11-20.vietnam-operations]].'
    tags: [place:operation-meade-river]
  - id: cal.1968-12-10.state-and-city-finance-ok
    when: Dec. 10
    date: '1968-12-10'
    thread: state-and-city-finance
    also: [state-constitutions]
    c: 'Oklahoma, special election: $99,808,000 in bonds for buildings at the colleges, the mental hospitals and other institutions, the cigarette tax pledged, 133,313 to 39,251, 77.3 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1968–1974*, C-18](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1968-1974-results.pdf#page=18) (State Question 463). To check: [[w.morgan-oklahoma-politics-and-policies]]. See [[cal.1968-08-27.state-constitutions-ok]]. Names: Bartlett.'
    tags: [state:ok, name:bartlett-dewey-f]
  - id: cal.1968-12-11.transition-and-staff
    when: Dec. 11–12
    date: '1968-12-11'
    thread: transition-and-staff
    c: 'Washington, the Shoreham. Nixon presents his Cabinet on television: Rogers, State; David Kennedy, Treasury; Laird, Defense; Mitchell, Attorney General; Blount, Postmaster General; Hickel, Interior; Hardin, Agriculture; Stans, Commerce; Shultz, Labor; Finch, Health, Education, and Welfare; Romney, Housing and Urban Development; Volpe, Transportation. Dec. 12, Nixon alone with Johnson in the Oval Office, 5:35 to 7:25 p.m.; no record found.'
    n: 'FRUS 1964–68, XIV, doc. [331](https://history.state.gov/historicaldocuments/frus1964-68v14/d331). Opinion: [42 Op. Att''y Gen. 381](https://archive.org/details/op-atty-gen/042/page/n405/mode/1up) (1969), Clark to Laird, Jan. 3, 1969: the Ineligibility Clause no bar to his appointment while a pay raise for the office is proposed and not yet final. To check: [[w.evans-nixon-in-the-white]]; [[w.small-presidency-of-richard-nixon]]; [[w.nathan-plot-that-failed]]; [[w.reeves-president-nixon]]; [[w.safire-before-the-fall]]. See [[cal.1968-11-11.transition-and-staff]]. Names: Nixon, Rogers, Kennedy, Laird, Mitchell, Blount, Hickel, Hardin, Stans, Shultz, Finch, Romney, Volpe, Johnson.'
    tags: [name:nixon-richard-m, name:rogers-william-p, name:kennedy-david-m, name:laird-melvin-r, name:mitchell-john-n, name:blount-winton-m, name:hickel-walter-j, name:hardin-clifford-m, name:stans-maurice-h, name:shultz-george-p, name:finch-robert-h, name:romney-george-w, name:volpe-john-a, name:johnson-lyndon-b]
  - id: cal.1968-12-11.congress
    when: Dec. 11
    date: '1968-12-11'
    thread: congress
    c: Bartlett (D) of Alaska dies in Cleveland after heart surgery.
    n: 'Statement by the President on the Death of Senator E. L. Bartlett of Alaska, [1968–69 Pub. Papers 1183](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=493) (Dec. 12, 1968). To check: [[w.naske-alaska]]. Names: Bartlett.'
    tags: [name:bartlett-edward-l, state:ak]
  - id: cal.1968-12-11.opinion
    when: Dec. 11
    date: '1968-12-11'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 9–14, the 44 million who did not vote, by reason: registered but not interested or not liking the candidates, 15 million; could have registered and did not, 10 million; sick or disabled, 7 million; kept out by residence requirements, 5 million; away from home, 3 million; could not leave their jobs, 3 million; no absentee ballot, 1 million. Voters who meant at some time to vote for another candidate, 26 percent. Split their tickets 54, voted straight 46.'
    n: '[[w.gallup-poll]], III, 2171–72.'
  - id: cal.1968-12-12.transition-and-staff
    when: Dec. 12
    date: '1968-12-12'
    thread: transition-and-staff
    c: 'Evening. The Nixon family with the Johnsons in the Executive Mansion; Johnson''s Cabinet receives Nixon''s at the State Department; the two staffs in the White House mess. In the Oval Office, by Nixon''s account, Johnson on Nixon''s plan to revive the NSC: "the leaks can kill you"; Hoover "a pillar of strength in a city of weak men."'
    n: '[[w.johnson-vantage-point]], 558–59, by Johnson''s account; [[w.nixon-rn]], 357–58 (Johnson and Nixon in the Oval Office). See [[cal.1968-09-11.transition-and-staff]]. Names: Nixon, Johnson, Hoover.'
    src:
      c: 44aba54d
      rows:
        - 'w.johnson-vantage-point 558–59: A-D'
        - 'w.nixon-rn 357–58: E, F'
    tags: [name:nixon-richard-m, name:johnson-lyndon-b, name:hoover-j-edgar]
  - id: cal.1968-12-13.latin-america
    when: Dec. 13
    date: '1968-12-13'
    thread: latin-america
    c: El Paso. Johnson and Díaz Ordaz open the Rio Grande's new channel, completing the Chamizal boundary change.
    n: 'Remarks in El Paso at the Inauguration of the New River Channel Completing the Chamizal Boundary Change, [1968–69 Pub. Papers 1186](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=496) (Dec. 13, 1968); Toasts of the President and President Diaz Ordaz at the Luncheon in El Paso Following the Chamizal Ceremony, [1968–69 Pub. Papers 1189](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=499) (Dec. 13, 1968). To check: [[w.lamborn-statecraft-domestic-politics-and]]. See [[cal.1967-10-26.latin-america]]. Names: Johnson, Díaz Ordaz.'
    tags: [name:johnson-lyndon-b, name:diaz-ordaz-gustavo, state:tx]
  - id: cal.1968-12-13.latin-america-2
    when: Dec. 13
    date: '1968-12-13'
    thread: latin-america
    c: 'Brazil. Costa e Silva decrees the Fifth Institutional Act: the President may recess Congress, the State assemblies and the municipal councils, intervene in the States without constitutional restraint, suspend any citizen''s political rights for ten years, revoke mandates; no date of expiry. Congress recessed.'
    n: 'FRUS 1964–68, XXXI, doc. [236](https://history.state.gov/historicaldocuments/frus1964-68v31/d236). To check: [[w.skidmore-politics-of-military-rule]]; [[w.green-we-cannot-remain-silent]]; [[w.leacock-requiem-for-revolution]]. See [[cal.1964-03-31.latin-america]]. Made public: FRUS 1964–68, XXXI (2004). Names: Costa e Silva.'
    tags: [name:costa-e-silva-arturo-da]
  - id: cal.1968-12-15.opinion
    when: Dec. 15
    date: '1968-12-15'
    thread: opinion
    also: [transition-and-staff]
    c: 'Gallup, Dec. 5–10: the kind of President Nixon will make: great 6 percent, good 51, fair 34, poor 6. Nixon''s supporters: great 11, good 67. Humphrey''s: great 1, good 35, fair 46, poor 12. Wallace''s: 7, 38, 44 and 8.'
    n: '[[w.gallup-poll]], III, 2172. Names: Nixon, Humphrey, Wallace.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c]
  - id: cal.1968-12-16.electoral-college
    when: Dec. 16
    date: '1968-12-16'
    thread: electoral-college
    also: [elections-1968]
    c: 'The electors meet in the States: Nixon 301, Humphrey 191, Wallace 46. In North Carolina, Bailey of Rocky Mount, N.C., on the Nixon slate, votes for Wallace; the other twelve for Nixon. In Michigan, Ferency, a Humphrey elector, refuses to vote for Humphrey; the others name a replacement.'
    n: 'The Associated Press, Dec. 17, 1968, in [115 Cong. Rec. 154](https://www.govinfo.gov/content/pkg/GPO-CRECB-1969-pt1/pdf/GPO-CRECB-1969-pt1-2-1.pdf#page=10) (1969). See [[cal.1968-11-05.elections-1968]]. Names: Nixon, Humphrey, Wallace, Bailey, Ferency.'
    tags: [name:nixon-richard-m, name:humphrey-hubert-h, name:wallace-george-c, name:bailey-lloyd-w, name:ferency-zolton, state:nc, state:mi]
  - id: cal.1968-12-17.latin-america
    when: Dec. 17
    date: '1968-12-17'
    thread: latin-america
    c: 'State to the embassy in Brazil: the regime has "stripped itself of any disguise as military dictatorship."'
    n: FRUS 1964–68, XXXI, docs. [237](https://history.state.gov/historicaldocuments/frus1964-68v31/d237), [241](https://history.state.gov/historicaldocuments/frus1964-68v31/d241) (Dec. 25). See [[cal.1968-12-13.latin-america-2]].
  - id: cal.1968-12-18.opinion
    when: Dec. 18
    date: '1968-12-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Dec. 5–10: military supplies kept going to South Vietnam, and the South Vietnamese left to take over the fighting and to make all the decisions about peace and dealings with the Viet Cong: agree 46 percent, disagree 44. The war will end in 1969: 35; will not be settled, 54. The Paris peace talks making headway: yes 26, no 64.'
    n: '[[w.gallup-poll]], III, 2172–73. See [[cal.1968-05-13.vietnam]].'
  - id: cal.1968-12-18.testing-missile-talks
    when: Dec. 18
    date: '1968-12-18'
    thread: testing-missile-talks
    also: [soviet-union, transition-and-staff]
    c: 'Moscow''s message to Nixon. Kissinger to Sedov of the Soviet embassy: whether Moscow accepts a summit before Jan. 20 a "crucial test" of its intentions; the new administration will not be "boxed in." No summit.'
    n: 'FRUS 1964–68, XIV, docs. [334](https://history.state.gov/historicaldocuments/frus1964-68v14/d334), [335](https://history.state.gov/historicaldocuments/frus1964-68v14/d335). [[w.nixon-rn]], 346 (Kissinger and a Soviet diplomat, mid-December: no summit before the inauguration). Made public: FRUS 1964–68, XIV (2001). See [[cal.1968-11-25.soviet-union]]. Names: Nixon, Kissinger, Sedov. Check: Nixon calls him a Soviet diplomat at the UN (346).'
    src:
      c: aa9c5b9b
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v14/d334: all'
        - 'w.nixon-rn 346: B, D'
    tags: [name:nixon-richard-m, name:kissinger-henry-a, name:sedov-boris]
  - id: cal.1968-12-19.economy
    when: Dec. 19
    date: '1968-12-19'
    thread: economy
    c: 'Johnson: on present estimates, a small surplus in fiscal 1969, not the deficit of $5 billion estimated in the summer review; spending held to $184.4 billion, revenues above projections. He hopes to send a January budget that continues it.'
    n: 'Statement by the President Forecasting a Budget Surplus in Fiscal Year 1969, [1968–69 Pub. Papers 1206](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=516) (Dec. 19, 1968). To check: [[w.bernstein-guns-or-butter]]. See [[cal.1967-01-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-12-19.vietnam
    when: Dec. 19
    date: '1968-12-19'
    thread: vietnam
    c: 'Sihanouk agrees to release twelve Americans: eleven from an Army landing craft, LCU 1577, held since it entered Cambodian waters July 17, and a helicopter crewman held since Nov. 28 (Check the day of release).'
    n: 'Statement by the Press Secretary on the Release of 12 Americans Detained in Cambodia, [1968–69 Pub. Papers 1207](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=517) (Dec. 19, 1968). To check: [[w.clymer-troubled-relations]]. See [[cal.1968-01-08.vietnam]]. Names: Sihanouk.'
    tags: [name:norodom-sihanouk]
  - id: cal.1968-12-20.jobs-and-wages
    when: Dec. 20
    date: '1968-12-20'
    thread: labor-disputes
    also: [trade]
    c: 'The International Longshoremen''s Association strikes every East and Gulf Coast port: the 80-day cooling-off period of the Taft-Hartley Act, invoked Oct. 1, ends. Johnson: "There is no remaining statutory authority"; the acts emergency procedures used seven times in the industry, six times followed by strikes; the strike of 1964–65 cost almost a billion dollars in exports.'
    n: 'Statement by the President on the Failure of Taft-Hartley Procedures in the Longshoremen''s Strike, [1968–69 Pub. Papers 1208](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=518) (Dec. 20, 1968). See [[cal.1965-02-10.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-12-20.transition-and-staff
    when: Dec. 20–21
    date: '1968-12-20'
    thread: transition-and-staff
    c: Fowler leaves the Treasury, Dec. 20, his resignation accepted Nov. 8. Barr, the Under Secretary, Secretary by recess appointment, Dec. 21; nominated and confirmed Jan. 9.
    n: 'Letter Accepting Resignation of Henry H. Fowler as Secretary of the Treasury, [1968–69 Pub. Papers 1116](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=426) (Nov. 8, 1968). See [[cal.1965-03-18.transition-and-staff]]. Names: Fowler, Barr.'
    tags: [name:fowler-henry-h, name:barr-joseph-w, name:johnson-lyndon-b]
  - id: cal.1968-12-20.vietnam-paris
    when: Dec. 20
    date: '1968-12-20'
    thread: vietnam-paris
    also: [transition-and-staff]
    c: 'Kissinger to Nixon: by a back channel he has assured Hanoi the new administration is ready to "undertake serious talks ... based on the self-respect and sense of honor of all parties."'
    n: '[[w.johns-vietnams-second-front]], 244; [[w.nixon-rn]], 349 (Nixon''s first message, through Sainteny, in conciliatory terms; mid-December). To check: Kissinger to Nixon, Dec. 20, 1968, HAK Office Files, box 2/3, NSC Files, Nixon Presidential Materials (cited by [[w.johns-vietnams-second-front]], 244 n.24). See [[cal.1968-12-02.transition-and-staff]]. Names: Kissinger, Nixon.'
    src:
      c: 4e88a600
      rows:
        - 'w.johns-vietnams-second-front 244: all'
        - 'via w.johns-vietnams-second-front 244 n.24: all'
        - 'w.nixon-rn 349: A'
    tags: [name:kissinger-henry-a, name:nixon-richard-m]
  - id: cal.1968-12-21.space
    when: Dec. 21
    date: '1968-12-21'
    thread: space-apollo
    c: 'Apollo 8, the first Saturn V with a crew: Borman, Lovell and Anders, launched from Cape Kennedy, Fla.'
    n: 'Message to the Apollo 8 Astronauts at the Beginning of Their Flight to the Moon, [1968–69 Pub. Papers 1208](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=518) (Dec. 21, 1968). To check: [[w.zimmerman-genesis]]; [[w.poole-earthrise]]; [[w.chaikin-man-on-the-moon]]; [[w.murray-apollo]]; [[w.brooks-chariots-for-apollo]]. See [[cal.1968-10-11.space]]. Names: Borman, Lovell, Anders, Johnson.'
    tags: [name:borman-frank, name:lovell-james-a-jr, name:anders-william-a, name:johnson-lyndon-b, state:fl]
  - id: cal.1968-12-22.japan-and-korea
    when: Dec. 22–23
    date: '1968-12-22'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, Dec. 23, 9 a.m. Woodward reads into the record a statement repudiating the North Korean document, then signs it: espionage admitted, an apology, a promise not to intrude again; the "pre-repudiated apology" Pak accepted in principle Dec. 17. At 11:30 a.m. the 82 men of the *Pueblo*s crew, Bucher among them, cross the Bridge of No Return, with the body of the seaman killed in the seizure. Johnson, Dec. 22 in Washington: "a long 11 months of totally unjustified detention."'
    n: 'Statement by the President on the Release of the Crew of the U.S.S. Pueblo, [1968–69 Pub. Papers 1210](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=520) (Dec. 22, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [324](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d324), [327](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d327), [331](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d331). [[w.longley-lbjs-1968]], 51–53 (Leonard''s proposal, by way of Katzenbach; Woodward; the release). To check: [[w.lerner-pueblo-incident]]; [[w.cheevers-act-of-war]]; [[w.armbrister-matter-of-accountability]]; [[w.bucher-bucher-my-story]]. See [[cal.1968-01-23.japan-and-korea]]. Made public: FRUS 1964–68, XXIX, pt. 1 (2000). Names: Woodward, Pak, Bucher, Johnson.'
    src:
      c: d37d70d0
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=520: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v29p1/d324: all'
        - 'w.longley-lbjs-1968 51–53: B-D'
    tags: [name:woodward-gilbert-h, name:pak-chung-kuk, name:bucher-lloyd-m, name:johnson-lyndon-b]
  - id: cal.1968-12-24.congress
    when: Dec. 24
    date: '1968-12-24'
    thread: congress
    c: 'Governor Hickel of Alaska, named Secretary of the Interior, appoints Ted Stevens (R), an Anchorage lawyer, majority leader of the State House, to Bartlett''s seat: the Senate 57 D–43 R at the 91st''s opening.'
    n: '*Biographical Directory of the United States Congress, 1774–2005*, H. Doc. 108-222, [1975](https://www.govinfo.gov/content/pkg/GPO-CDOC-108hdoc222/pdf/GPO-CDOC-108hdoc222-4-19.pdf#page=122) (2005) (Stevens appointed Dec. 24, 1968, a Republican, to the vacancy of Bartlett''s death; majority leader of the State House). See [[cal.1968-12-11.congress]]. Names: Hickel, Stevens, Bartlett.'
    src:
      c: b1d465dc
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CDOC-108hdoc222/pdf/GPO-CDOC-108hdoc222-4-19.pdf#page=122: A'
    tags: [name:hickel-walter-j, name:stevens-ted-f, name:bartlett-edward-l, state:ak]
  - id: cal.1968-12-24.space-apollo
    when: Dec. 24
    date: '1968-12-24'
    thread: space-apollo
    c: Apollo 8 in orbit around the moon, ten revolutions; on Christmas Eve, on television, Borman, Lovell and Anders read from Genesis.
    n: 'NASA, Manned Spacecraft Center, *Apollo 8 Mission Report*, MSC-PA-R-69-1, [1-1](https://ntrs.nasa.gov/api/citations/19700033031/downloads/19700033031.pdf#page=7) (1969) (ten revolutions in lunar orbit; the television). See [[cal.1968-12-21.space]]. Names: Borman, Lovell, Anders. Check: the reading from Genesis, in the air-to-ground transcript.'
    src:
      c: 394ea659
      rows:
        - 'https://ntrs.nasa.gov/api/citations/19700033031/downloads/19700033031.pdf#page=7: A'
