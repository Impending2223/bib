  - id: cal.1962-06-30.state-and-city-finance-us
    when: June 30
    date: '1962-06-30'
    thread: state-and-city-finance
    c: Fiscal 1962 closes in forty-seven States. The fifty State governments' taxes for the year $20.6 billion, $111.17 a head; federal aid $7.1 billion; long-term debt $21.6 billion (Census). By Census's columns, first revenue from general sales taxes in Texas and Wisconsin, an individual income tax in New Jersey (Check the tax).
