    thread: middle-east
    c: 'Two Kurds, for Mulla Mustafa Barzani, in revolt against Baghdad since September 1961, at the State Department: American "moral support" for the Kurds, and no hostility if their case comes before the UN. The Department: the United States cannot take sides; the Kurds must reach their own agreement with the Iraqi government.'
    n: 'FRUS 1961–63, XVII, docs. [262](https://history.state.gov/historicaldocuments/frus1961-63v17/d262), [305](https://history.state.gov/historicaldocuments/frus1961-63v17/d305). [[w.mcdowall-modern-history-of-the]]; [[w.gibson-sold-out]]. Names: Barzani.'
