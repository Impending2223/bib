    also: [china, south-asia]
    c: 'Zhou Enlai receives Cambodia''s Prime Minister, Prince Penn Nouth, at Shenyang and flies with him to Dalian. In the plane, on construction: with the right direction and line, the methods are still to be groped for; countries differ, so do their ways to independence and to building; building takes longer than revolution. On the Sino-Indian border: China''s stand is clear, to keep the status quo and settle by talks, and to stop border patrols; China has settled with Burma and Nepal by talks and now starts with Pakistan; why not India. Talks again at Dalian.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 4, 1962); [[w.zhou-enlai-waijiao-huodong]], 331 (June 4, 1962; 上午, 沈阳; 在飞往大连途中); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 1–14, 1962, the visit; the talks at Dalian: Zhou meets Penn Nouth at Luda and says that all favor settling the South Vietnam and Laos questions by peaceful negotiation, since China, the Soviet Union and the Southeast Asian states, above all Cambodia and Burma, so favor, and Britain and France to some degree; on the Sino-Indian boundary, that it cannot be settled by talks because India means to use the border question to please the Western countries and win aid). Made public: 1993. Names: Zhou Enlai, Penn Nouth.'
