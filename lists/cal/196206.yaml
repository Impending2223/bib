    thread: immigration
    c: 'Migration and Refugee Assistance Act signed, [76 Stat. 121](https://www.govinfo.gov/content/pkg/STATUTE-76/pdf/STATUTE-76-Pg121.pdf): the refugee programs on one footing, for refugees under the UN High Commissioner, refugees the President designates, and refugees in the United States. Asked for July 21, 1961. Kennedy thanks Fulbright and Walter.'
    n: 'Statute (K–J Cong. II.J.2). Statement by the President Upon Signing the Migration and Refugee Assistance Act, [1962 Pub. Papers 518](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=578) (June 28, 1962); Letter to the President of the Senate and to the Speaker of the House Proposing Reorganization and Reenactment of Refugee Aid Legislation, [1961 Pub. Papers 526](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=584) (July 21, 1961). To check: [[w.bon-tempo-americans-at-the-gate]]. See [[cal.1961-01-27.immigration]]. Names: Fulbright, Walter.'
    tags: [name:kennedy-john-f, name:fulbright-j-william, name:walter-francis-e]
