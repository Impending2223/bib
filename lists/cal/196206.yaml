  - id: cal.1962-06-02.china-leadership
    when: June 2
    date: '1962-06-02'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai at Shenyang with the central ministers who came with him on the present situation. Given the world situation and Chiang Kai-shek's active preparation to "counterattack the mainland" and possibly to start a local war, he stresses again the "reorganize the army, prepare for war" put forward in February; afterward he calls the Northeast Bureau's leaders several times on the international and domestic situation.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 2, 1962). Made public: 1997. Names: Zhou Enlai, Chiang Kai-shek.'
    tags: [polity:prc, name:zhou-enlai, name:chiang-kai-shek, vis:only:prc]
  - id: cal.1962-06-02.china
    when: June 2
    date: '1962-06-02'
    thread: china
    also: [south-asia]
    c: 'The Foreign Ministry sends a second note to the Indian embassy, flatly rejecting the Indian government''s reply of May 14 on responsibility for the areas it has invaded. China has always held that the boundary question should be settled by negotiation and peaceful means, but will never yield to a threat of force. It restates its protests and demands of Apr. 30 and May 28: India must stop the military provocations and withdraw its posts and troops from inside Chinese territory.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 230 (June 2, 1962). Check: the book calls it the Ministry''s note ''again'' (再次); whether the note of May 14 is India''s reply to China''s of Apr. 30, as the text implies.'
    src:
      c: 8290ae5d
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 230: all'
    tags: [polity:prc, polity:india]
  - id: cal.1962-06-03.robert-kennedy
    when: June 3
    date: '1962-06-03'
    thread: robert-kennedy
    also: [soviet-union, defense]
    c: 'Sunday at Hickory Hill, Robert Kennedy and Bolshakov, by Bolshakov''s report: is anyone in the Soviet leadership for "a decisive clash with the United States"? Among the Pentagon''s generals, yes, there are such people; the Joint Chiefs have told the President the United States is ahead and "in extremis it would be possible to probe the forces of the Soviet Union"; the President has rejected them.'
    n: '[[w.fursenko-one-hell-of-a]], 184–85; [[w.dobrynin-in-confidence]], 66–67 (the President "cannot do it" on West Berlin; the military''s confidential report; not McNamara; by Dobrynin''s account); [[w.thomas-robert-kennedy]], 206 ("is there anyone in the Soviet leadership who advocates a decisive clash"; the Chiefs'' report: "probe the forces of the Soviet Union"). To check: Dobrynin to the Foreign Ministry, "On the Meeting between Bolshakov and RFK," June 4, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 184 n.1, 185 n.5, n.6). See [[cal.1962-03-02.robert-kennedy]]. Names: Robert Kennedy, Bolshakov.'
    src:
      c: e38d2d9a
      rows:
