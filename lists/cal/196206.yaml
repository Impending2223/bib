    when: June 2
    date: '1962-06-02'
    place: shenyang
    thread: china-leadership
    also: [china]
    c: Zhou Enlai at Shenyang with the central ministers who came with him on the present situation. Given the world situation and Chiang Kai-shek's active preparation to "counterattack the mainland" and possibly to start a local war, he stresses again the "reorganize the army, prepare for war" put forward in February; afterward he calls the Northeast Bureau's leaders several times on the international and domestic situation.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 481 (June 2, 1962). Made public: 1997. Names: Zhou Enlai, Chiang Kai-shek.'
