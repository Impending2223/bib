    c: 'Hangzhou, afternoon. Mao hears Yang Chengwu and Xu Shiyou on the possibility that Chiang Kai-shek''s forces venture against the southeast coast, on the preparations, and on the Politburo''s enlarged meeting of June 6. He agrees wholly with the dispositions of the army, navy and air force: the enemy at most 150,000; eight divisions into Fujian, one more for eastern Zhejiang; the general reserve not yet to move; the arms industry to be built up on this occasion, and the research on advanced weapons to go on.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, June 8, 1962; [[w.mao-zedong-zhuan]], V, ch. 70 n.15 (June 8, afternoon, at Hangzhou: Mao hears Yang Chengwu and Xu Shiyou on Chiang Kai-shek''s possible venture against the southeast coast and the Politburo discussion of June 6; he is satisfied, agrees with the Center''s and the military commission''s measures, and puts the enemy at 150,000 at most). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). Check: the *Mao zedong zhuan* puts the hearing June 8, afternoon, in its text, and dates the record of Mao''s instructions June 3, 1962 (V, ch. 70 n.15). To check: Record of Mao Zedong''s 毛泽东 instructions on hearing Yang Chengwu 杨成武 and Xu Shiyou 许世友, dated June 3, 1962 (指示记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 70 n.15). Names: Mao Zedong, Xu Shiyou, Yang Chengwu.'
