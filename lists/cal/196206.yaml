  - id: cal.1962-06.china-leadership
    when: June 6–7
    date: '1962-06-06'
    place: longsheng
    thread: china-leadership
    c: 'Tao Zhu and Wang Renzhong inspect Longsheng xian, Guangxi, for two days; they condemn independent operation in principle, sort the team systems into five types, and lay down four criteria for collective agriculture: collective ownership of the principal means of production, unified production plans, collective labor, unified distribution of income.'
    n: '[[w.macfarquhar-origins-of-the-cultural]], III, 222–23; [[w.jianguo-yilai-mao-zedong]], XVI, 316–318 (note 2 to Mao''s note of July 22, 1962, from the record of the forum on consolidating the production teams'' collective economy held by Tao Zhu 陶铸 and Wang Renzhong 王任重 at Longsheng 龙胜, Guangxi 广西, June 6–7: of the county''s teams about 60 to 70 percent basically collective, 20 to 30 percent basically individual, about 10 percent wholly so, not the 60 to 70 percent once thought to have gone it alone; five forms of management; four tests of a collective economy; voluntariness and example, no forcible "correction" of individual households); [[w.yang-jisheng-mubei]], II, 830 (June 6–7, 1962: Tao Zhu and Wang Renzhong, secretaries of the Central-South Bureau, hear reports at Longsheng county, Guilin prefecture, and hold a symposium; their record finds most cadres and masses for the socialist road, and the estimate of 60 or even 70 percent of teams gone it alone too high, the lines being unclear). Made public: 1997. Check: the Wengao (XVI, 316 n.2) dates the forum June 6–7; the entry may take those days by edit. To check: [[w.nongye-jitihua-zhongyao-wenjian]], 591–92 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 222 n.67); [[w.nongye-jitihua-zhongyao-wenjian]], 593 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 223 n.68); Record of the forum on consolidating the production teams'' collective economy held by Tao Zhu and Wang Renzhong at Longsheng, Guangxi, June 6–7, 1962 (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 316 n.2a). Names: Tao Zhu. Check: the days.'
