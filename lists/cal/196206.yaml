    tags: [polity:prc, vis:only:prc, ok:fields-place]
  - id: cal.1962-06-01.china-leadership-6
    when: June 1
    date: '1962-06-01'
    place: canton
    thread: china-leadership
    c: Over 10,000 people have gathered outside the Canton 廣州 railway station, where the number of tickets bought to Pinghu 平湖, the last station that needs no border pass, has been 22 times the usual since mid-May. The crowd, waiting to buy tickets, begins to stir. Rumors say that Hong Kong gives three days' holiday for the Queen's birthday and opens the border.
    n: '[[w.yang-jisheng-mubei]], I, 426, 429. Made public: 2005. To check: Sources of the section on the flight to Hong Kong: the online article 《魚米之鄉的大逃亡》 and 《揭秘43年前逃港風潮 驚動周恩來總理》, http://www.cec.cn, Dec. 26, 2005 (cited by [[w.yang-jisheng-mubei]], I, 426 n.22).'
