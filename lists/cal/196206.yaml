    when: June 4
    date: '1962-06-04'
    thread: economy
    c: 'Dillon to the New York Financial Writers Association: the tax reform for January will bring "a top-to-bottom reduction in the rates of income tax," offset by a broader base "in whole or in part."'
    n: '[[w.stein-fiscal-revolution-in-america]], 409. Check: the Record prints the address, 108 Cong. Rec. 10299 (Stein, 509 n.46). See [[cal.1962-05-28.economy]]. Names: Dillon.'
