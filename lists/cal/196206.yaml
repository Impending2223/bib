    n: '[[w.jianguo-yilai-mao-zedong]], XVI, 297 (June 3, 1962; dated 7 a.m. June 3; printed from the manuscript; notes 1–2). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Names: Mao Zedong, Shao Hua, Mao Anqing. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
