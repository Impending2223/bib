    c: 'Mansfield''s commencement address at Michigan State, East Lansing, Mich.: "events appear to be moving in Southeast Asia toward a point of critical decision." The SEATO allies unwilling or unable to bear the burdens. South Vietnam "more, rather than less, dependent" on American aid after years of it. The interests in Southeast Asia "limited," the policy of "minimum involvement" turned "about 180°" to "very deep involvement and enormous cost"; at worst "a possible conflict of indefinite depth and duration." Inserted in the Record June 11.'
