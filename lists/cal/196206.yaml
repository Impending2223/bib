    thread: economy
    c: News conference. For the next Congress, effective Jan. 1, 1963, "an across-the-board reduction in personal and corporate income tax rates which will not be wholly offset by other reforms—in other words, a net tax reduction." Standby authority to cut taxes asked again.
    n: The President's News Conference of June 7, 1962, [1962 Pub. Papers 456](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=516). [[w.stein-fiscal-revolution-in-america]], 407–10. See [[cal.1962-05-28.economy]].
