  - id: cal.1962-06-01.china-leadership-5
    when: June 1
    date: '1962-06-01'
    thread: china-leadership
    c: 'The organization department of the Bao''an 寶安 county committee reports urgently to the Guangdong 廣東 provincial committee that a great wave of flight has appeared: not only rural Party and Youth League members but those in town offices are going out in numbers; the flight is fast and fierce; minds are confused from village to town; peasants have no heart for production and some town factories have stopped. To May 31 the county''s total fled is 11,547, 316 from offices and 11,231 from the villages; at Shatoujiao 沙頭角 commune at the peak, May 13 to 17, an average of 96 a day go to Hong Kong.'
    n: '[[w.yang-jisheng-mubei]], I, 426, 428. Made public: 2005. To check: Sources of the section on the flight to Hong Kong: the online article 《魚米之鄉的大逃亡》 and 《揭秘43年前逃港風潮 驚動周恩來總理》, http://www.cec.cn, Dec. 26, 2005 (cited by [[w.yang-jisheng-mubei]], I, 426 n.22).'
    src:
      c: 08dbbf6f
      rows:
