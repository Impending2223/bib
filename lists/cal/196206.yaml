    date: '1962-06-26'
    thread: china
    also: [soviet-union]
    c: Ji Pengfei, Vice-Minister of Foreign Affairs, receives the Soviet ambassador, Chervonenko, and hands him China's reply to the Soviet government's aide-memoire of June 7 and the ambassador's oral supplement of June 11. The Soviet government, it says, avoids the question of its responsibility to deal with the Chinese residents who crossed into Soviet territory by the customary practice, and instead makes groundless charges. China cannot agree. It hopes the Soviet government will take effective measures and cooperate to restore normal conditions on the border.
