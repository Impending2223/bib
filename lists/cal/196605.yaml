    c: 'Deng Xiaoping 邓小平 reads the draft Central Committee 中央 "Explanation of the errors of Comrade Lu Dingyi 陆定一 and Comrade Yang Shangkun 杨尚昆" 《关于陆定一同志和杨尚昆同志错误问题的说明》 and sends it to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Zhu De 朱德, Lin Biao 林彪 and Chen Boda 陈伯达 for reading, and separately to Mao Zedong 毛泽东 for his instruction (footnote 3: the explanation the Central Committee issued May 24 charges Lu with ''opposing Mao Zedong Thought'', ''attacking Comrade Lin Biao'' and ''making opinion for a capitalist restoration'', his wife Yan Weibing with being a ''counter-revolutionary at present'', and Yang with ''installing a hidden listening device'', ''stealing the Party''s secrets'' and an ''extremely abnormal relationship with Luo Ruiqing 罗瑞卿 and others''; Lu was rehabilitated June 8, 1979 and Yang and the General Office Oct. 23, 1980).{1}'
