    c: 'Zhou Enlai at the first full meeting of the Capital Work Group, Ye Jianying presiding, which settles its tasks, organization and work, and the moving in of two army divisions.{1} Zhou: the capital''s garrison work is to be firm and steady, not hurried; the counter-revolutionaries are few, the army reliable.{2} If troops must move urgently when Zhou is away, Deng Xiaoping may be asked.{3}'
