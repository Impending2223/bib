    n: '[[w.pu-weihua-zalan-jiu-shijie]], 127. Made public: 2001 (Yin Hongbiao). To check: Yin Hongbiao 印紅標, 〈全國「第一張馬列主義大字報」是怎樣出籠的〉, in [[w.zhongguo-gongchandang-zhongda-shishi]], IV, 1949–1956 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 127 n.70); Xiang Luo 向洛 and Meng Jin 孟金, 〈全國「第一張大字報」出籠真相〉, *Zhonggong dangshi ziliao* 《中共黨史資料》, no. 83 (2002), 113–127 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 128 n.71c); Nie Yuanzi 聶元梓, 〈「第一張馬列主義大字報」的由來〉, *Wangshi* 《往事》, no. 4, Nov. 17, 2004 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 128 n.71d). See [[cal.1966-05.china-leadership-39]]. Names: Nie Yuanzi, Lu Ping.'
    src:
