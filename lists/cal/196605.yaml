    also: [china-luo-ruiqing]
    c: 'The enlarged Politburo meeting decides: Peng Zhen, Lu Dingyi and Luo Ruiqing out of the Secretariat, Yang Shangkun out as alternate;{1} Peng out as first secretary and mayor of Peking, Lu as head of the Propaganda Department; Tao Zhu to the Secretariat as standing secretary and Propaganda head;{2} Ye Jianying to the Secretariat and as secretary-general of the Military Commission;{3} Li Xuefeng first secretary at Peking; a plenum to confirm.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 23, 1966; [[w.macfarquhar-maos-last-revolution]], 38 (the four dismissed May 23); [[w.macfarquhar-origins-of-the-cultural]], III, 460 (the four out of the Secretariat; Tao Zhu to the Secretariat and propaganda, Ye Jianying to the military side); [[w.deng-xiaoping-nianpu-1904]], III, 1914–1915 (May 23, 1966; morning, 上午; Deng at the Politburo''s enlarged meeting, which adopts the ''Decision of the enlarged meeting of the Politburo'': (1) Peng Zhen, Lu Dingyi and Luo Ruiqing suspended as secretaries of the Secretariat and Yang Shangkun as alternate secretary, to be confirmed later by a plenum; (2) Peng removed as first secretary of the Peking municipal committee and mayor, Lu as head of the Propaganda Department; (3) Tao Zhu 陶铸 transferred to be standing secretary of the Secretariat and head of the Propaganda Department, Ye Jianying 叶剑英 as secretary of the Secretariat and secretary-general of the Military Commission, their posts to be confirmed later by a plenum; (4) Li Xuefeng also first secretary of the Peking municipal committee); [[w.mao-zedong-zhuan]], VI, ch. 74 (May 23 the meeting stops the Secretariat posts of Peng Zhen, Lu Dingyi, Luo Ruiqing and Yang Shangkun; removes Peng as first secretary and mayor at Peking and Lu as head of the Propaganda Department; appoints Tao Zhu standing secretary of the Secretariat and head of the Propaganda Department and Ye Jianying secretary of the Secretariat and secretary-general of the Military Commission, their Secretariat posts to be confirmed later by a plenum; Li Xuefeng first secretary at Peking). [[w.yang-jisheng-tiandi-fanfu]], I, 153 (May 23: the Politburo, by a unanimous vote, formally removes Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun from all their posts); [[w.yang-jisheng-tiandi-fanfu]], I, 416 (with the removal of Peng, Lu, Luo and Yang the enlarged Politburo meeting moves Ye Jianying to the Secretariat as a secretary and makes him secretary-general of the Military Commission (dated by Yang 1965, May 23)); [[w.peng-zhen-nianpu-1902]], IV, 486 (May 23, 1966, morning; the enlarged Politburo decides: Peng Zhen, Lu Dingyi and Luo Ruiqing suspended as secretaries of the Secretariat, Yang Shangkun as alternate, for the plenum to confirm; Peng removed as first secretary of the Peking committee and mayor, Lu as head of the Propaganda Department; Tao Zhu 陶铸 standing secretary of the Secretariat and head of the Propaganda Department, Ye Jianying secretary and secretary-general of the Military Commission, for the plenum to confirm; Li Xuefeng also Peking''s first secretary); [[w.teiwes-tragedy-of-lin-biao]], 64 (Ye Jianying, already prominent in the investigation of Luo, raised to the Secretariat and made the Military Commission''s secretary-general in May); [[w.dikotter-cultural-revolution]], 50 n.20 (the four dismissed; Zhou: their fall a "victory for Mao Zedong Thought," Mao "a genius leader just like Lenin"); [[w.pu-weihua-zalan-jiu-shijie]], 91–92 (adopted unanimously; its text quoted; to county committees and regiments); [[w.liu-jixian-ye-jianying-nianpu]], II, 937 (May 23, 1966; by the enlarged Politburo Ye Jianying 叶剑英 is added to the Secretariat 中央书记处 and made secretary-general of the Military Commission 中央军委秘书长). Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.lishi-zai-zheli-chensi]], 3, 1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.164); [[w.nianyi-da-dongluande-niandai]], 19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.165a); [[w.klein-biographic-dictionary-of-chinese]], 2, 106 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.165b); [[w.wenhua-dageming-yanjiu-ziliao]], I, 24 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 92 n.22). Names: Peng Zhen, Lu Dingyi, Luo Ruiqing, Yang Shangkun, Tao Zhu, Ye Jianying, Li Xuefeng.'
