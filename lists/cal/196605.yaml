  - id: cal.1966-05.china-leadership-32
    when: May, before the 28th
    date: 1966-05
    at: before 1966-05-28
    thread: china-may-sixteenth
    c: For the Cultural Revolution Group 中央文革小组 to be set up under the Politburo's Standing Committee, the Center asks its Party, government and army organs and the regional bureaus for nominees, chiefly from the leaders of propaganda and culture. The central organs name Chen Boda 陈伯达, Kang Sheng 康生, Jiang Qing 江青, Wang Li 王力, Guan Feng 关锋, Qi Benyu 戚本禹, Mu Xin 穆欣 and Yin Da 尹达; the army, Liu Zhijian 刘志坚 and Xie Tangzhong 谢镗忠; the Central-South Bureau 中南局, Wang Renzhong 王任重; the East China Bureau 华东局, Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元, its first choice Yang Yongzhi 杨永直 changed to Yao on Jiang Qing's and Zhang's strong urging.
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 116–117 and n.50. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: [[w.nianyi-da-dongluande-niandai]], 24 (Liu Zhijian and Xie Tangzhong named by Ye Jianying) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 117 n.49a); Wang Li 王力, *Wang Li fansilu* 《王力反思錄》, II, 599 (Liu and Xie named by Lin Biao) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 117 n.49b). Names: Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu, Mu Xin, Yin Da, Liu Zhijian, Xie Tangzhong, Wang Renzhong, Yang Yongzhi. Check: who named Liu Zhijian and Xie Tangzhong: Ye Jianying (Wang Nianyi) or Lin Biao (Wang Li).'
    src:
      c: e231adbf
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 116–117 and n.50: all'
    tags: [polity:prc, vis:only:prc, name:chen-boda, name:kang-sheng, name:jiang-qing, name:zhang-chunqiao, name:yao-wenyuan, ok:fields-place, name:guan-feng, name:liu-zhijian, name:mu-xin, name:qi-benyu, name:wang-li, name:wang-renzhong, name:xie-tangzhong, name:yang-yongzhi, name:yin-da]
