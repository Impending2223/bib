# Cal. LXXIX May 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXIX
entries:
  - id: cal.1966-05-02.vietnam-congress
    when: May 2
    date: '1966-05-02'
    thread: vietnam-congress
    c: 'Russell, interviewed: a survey of what the people of South Vietnam''s cities think; if most are anti-American, "we should withdraw now." "I don''t buy this so-called ''domino'' theory."'
    n: '[[w.gibbons-u-s-government-and]], IV, 303. To check: *U.S. News & World Report*, May 2, 1966. Check: Gibbons has the interview in late April, in the issue of May 2. Names: Russell.'
    tags: [name:russell-richard-b]
  - id: cal.1966-05-03.elections-1966
    when: May 3
    date: '1966-05-03'
    thread: elections-1966
    also: [voting-rights, alabama, governors]
    c: Alabama's Democratic primary, the first since the Voting Rights Act. Lurleen Wallace, standing for her husband, barred from a second term, wins outright over Attorney General Richmond Flowers, 480,841 to 172,386, 54.1 percent; Carl Elliott, Patterson and Folsom behind. In Dallas County, Ala., Sheriff Clark loses the nomination to Wilson Baker, public safety director of Selma, Ala. (Check). In Lowndes County, Ala., the Lowndes County Freedom Organization, its emblem a black panther, holds its own nominating meeting (Check).
    n: 'Votes: Wikipedia, "1966 Alabama gubernatorial election"; [Ala. *Official and Statistical Register*, 1967, 557–559](https://archive.org/details/alabama-official-statistical-register-1967/page/n558). The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). To check: [[w.carter-politics-of-rage-1995]]; [[w.jeffries-bloody-lowndes]]. Names: George Wallace, Patterson, Lurleen Wallace, Richmond Flowers, James Clark, Folsom, Wilson Baker, Elliott.'
    tags: [name:wallace-george-c, name:elliott-carl-a, name:patterson-john, name:clark-james-g-jr, name:wallace-lurleen-b, name:flowers-richmond-m, name:folsom-james-e, name:baker-wilson, state:al]
  - id: cal.1966-05-03.governors-fl
    when: May 3
    date: '1966-05-03'
    thread: governors
    also: [elections-1966]
    c: 'Florida''s Democratic primary for governor. Governor Burns, elected in 1964 to a two-year term, over High, mayor of Miami, 372,451 to 338,281, 35.4 percent; Kelly 331,580, 31.5 percent. Runoff between Burns and High. Republican: Kirk, the 1964 nominee for the Senate, over one other, 100,838 to 23,953, 80.8 percent.'
    n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, May 3 and May 24, 1966, 10](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1966/page/n11) (Democratic), [38](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1966/page/n39) (Republican); the figures as [Wikipedia](https://en.wikipedia.org/wiki/1966_Florida_gubernatorial_election) gives them, from *America Votes 7*. To check: [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.kallina-claude-kirk-and-the]]. See [[cal.1964-05-26.governors-fl]]. Names: Burns, High, Scott Kelly, Kirk.'
    tags: [name:burns-w-haydon, name:high-robert-king, name:kelly-scott, name:kirk-claude-r-jr, state:fl]
  - id: cal.1966-05-03.governors-oh
    when: May 3
    date: '1966-05-03'
    thread: governors
    also: [elections-1966]
    c: 'Ohio, primaries for governor. Democratic: Frazier Reams Jr., a State senator, over a Cleveland attorney, 326,419 to 231,406, 58.5 percent. Republican: Rhodes renominated over one other, 577,827 to 73,428, 88.7 percent.'
    n: 'Votes: [Wikipedia, "1966 Ohio gubernatorial election"](https://en.wikipedia.org/wiki/1966_Ohio_gubernatorial_election), from the Secretary of State''s official results (Check: [*Ohio Election Statistics*, 1965–1970](https://catalog.hathitrust.org/Record/000546832)). Nov. 8, Rhodes re-elected over Reams, 62.2 percent. To check: [[w.diemer-james-a-rhodes-ohio]]. See [[cal.1962-11-06.governors-oh]]. Names: Reams, Rhodes.'
    tags: [state:oh, name:reams-frazier-jr, name:rhodes-james-a]
  - id: cal.1966-05-03.governors-ok
    when: May 3
    date: '1966-05-03'
    thread: governors
    also: [elections-1966]
    c: 'Oklahoma primaries for governor. Democratic: Raymond Gary over Preston Moore, 160,825 to 104,081, 31.5 percent; David Hall, the Tulsa County district attorney, 94,309, 18.5 percent; runoff between Gary and Moore. Republican: State Senator Dewey Bartlett over Happy Camp, 46,053 to 45,185, 48.9 percent, an 868-vote margin; runoff, the party''s first for governor.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 55](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=55); [p. 59](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=59). [Wikipedia, "1966 Oklahoma gubernatorial election"](https://en.wikipedia.org/wiki/1966_Oklahoma_gubernatorial_election) for the first runoff. Shares as the Board prints them, cut, not rounded. To check: [[w.morgan-oklahoma-politics-and-policies]]; [[w.peirce-great-plains-states-of]]. See [[cal.1962-05-01.governors-ok]]. Names: Gary, Moore, Hall, Bartlett, Camp.'
    tags: [state:ok, name:gary-raymond, name:moore-preston-j, name:hall-david, name:bartlett-dewey-f, name:camp-john-n]
  - id: cal.1966-05-03.state-constitutions-ok
    when: May 3
    date: '1966-05-03'
    thread: state-constitutions
    also: [desegregation-schools]
    c: Oklahoma, with the primary, adopts five amendments. The constitution's command of separate schools for white and colored children repealed, 327,927 to 166,941, 66.3 percent. Elected officials convicted of a felony suspended, and justices made impeachable, 395,295 to 90,253, 81.4 percent. A Court on the Judiciary to remove judges, 328,012 to 128,207, 71.9 percent. New residents to vote for President, 347,440 to 120,455, 74.3 percent. Governors limited to two terms in succession, 300,954 to 183,850, 62.1 percent.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 60–61](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=60). The amendment, State Question 436: [enrolled H.J.R. 515 (1965), 1–2](https://www.sos.ok.gov/documents/questions/436.pdf), Okla. Const. art. VI, § 4: "No person shall be elected Governor more than two times in succession"; its § 3, "This law shall take effect after the general election to be held in 1966." The provision it replaced, art. VI, § 4 (1907): the governor "shall not be eligible immediately to succeed" himself, [[w.thorpe-federal-and-state-constitutions]], [VII, 4288–4289](https://archive.org/details/federalstatecons07thor/page/4288/mode/1up). See [[cal.1964-11-03.state-constitutions-ok]]; [[cal.1965-01-21.states-and-cities-ok]].'
    tags: [state:ok]
  - id: cal.1966-05-03.governors-nm
    when: May 3
    date: '1966-05-03'
    thread: governors
    also: [elections-1966]
    c: 'New Mexico''s primary, for governor. Democratic: Lusk, once a State senator, over Burroughs, governor 1959–61, 85,211 to 57,143, 59.9 percent. Republican: Cargo, a State representative, over Hawley, 17,836 to 16,588, 51.8 percent.'
    n: 'Votes: [Wikipedia, "1966 New Mexico gubernatorial election"](https://en.wikipedia.org/wiki/1966_New_Mexico_gubernatorial_election); Check: N.M. Secretary of State, *New Mexico Election Returns, 1911–1969*. To check: [[w.peirce-mountain-states-of-america]]. Names: Burroughs, Cargo, Lusk, Hawley.'
    tags: [state:nm, name:lusk-gene, name:burroughs-john, name:cargo-david-f, name:hawley-clifford-j]
  - id: cal.1966-05-06.opinion
    when: May 6
    date: '1966-05-06'
    thread: opinion
    also: [poverty]
    c: 'Gallup, Mar. 24–29: have heard or read of the antipoverty program, 80 percent. Of them, a program in their area: yes 27, no 37, don''t know 36; of those saying yes, about a third call the money well spent, a third poorly. The program nationwide: favorable 48, unfavorable 31.'
    n: '[[w.gallup-poll]], III, 2003–04. The survey printed 724-K (Feb. 10–15), the field dates Mar. 24–29 (726-K). Check.'
  - id: cal.1966-05-07.space
    when: May 7
    date: '1966-05-07'
    thread: space
    c: 'Johnson, from the Ranch, asks for a treaty on the moon and other celestial bodies: free for exploration and use by all; no claim of sovereignty; no weapons of mass destruction stationed there, no weapons tests or maneuvers; astronauts to help one another. Goldberg to seek discussions at the UN. June 18, asked of the Soviet Union''s interest: "We have made our proposal. We are very hopeful that our proposal and theirs can be carefully considered."'
    n: 'Statement by the President on the Need for a Treaty Governing Exploration of Celestial Bodies, [1966 Pub. Papers 487](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=563) (May 7, 1966); The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701) (June 18, 1966). To check: [[w.mcdougall-heavens-and-the-earth]]. Names: Goldberg, Johnson.'
    tags: [name:johnson-lyndon-b, name:goldberg-arthur-j]
  - id: cal.1966-05-07.governors-tx
    when: May 7
    date: '1966-05-07'
    thread: governors
    also: [elections-1966]
    c: Texas Democratic primary. Governor Connally renominated for a third term over Stanley Woods, 932,641 to 291,651, 74.3 percent.
    n: '[Wikipedia, "1966 Texas gubernatorial election"](https://en.wikipedia.org/wiki/1966_Texas_gubernatorial_election), from the *Texas Almanac*; Check: the party''s canvass. To check: [[w.reston-lone-star]]; [[w.cunningham-cowboy-conservatism]]. See [[cal.1964-05-02.governors-tx]]. Names: Connally, Woods.'
    tags: [state:tx, name:connally-john, name:woods-stanley-c]
  - id: cal.1966-05-09.robert-kennedy
    when: May 9–10
    date: '1966-05-09'
    thread: robert-kennedy
    also: [latin-america]
    c: 'Robert Kennedy in the Senate, two days, on the Alliance for Progress, "Symbol and Substance": reform a condition of aid; aid not withheld for an American company''s sake; "Batista, not Castro, was the major cause of communism in Latin America."'
    n: '112 Cong. Rec. [10090](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt8/pdf/GPO-CRECB-1966-pt8-4-2.pdf#page=37) (May 9), [10187](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt8/pdf/GPO-CRECB-1966-pt8-5-1.pdf#page=67) (May 10) (1966). Check the pages each day runs to. [[w.schlesinger-robert-kennedy-and-his]], 700. See [[cal.1965-11-10.robert-kennedy]]. Names: Robert Kennedy, Castro.'
    tags: [name:kennedy-robert-f, name:castro-fidel]
  - id: cal.1966-05-09.vietnam-congress
    when: May 9
    date: '1966-05-09'
    thread: vietnam-congress
    c: 'Fulbright to Johnson, after Johnson''s allusion at a diplomatic reception: never has he spoken or thought of Johnson "in connection with arrogance"; his theme the arrogance of power of the great nations; "my opposing the views of some of your advisors ... can be of help to you."'
    n: '[[w.gibbons-u-s-government-and]], IV, 309. To check: Fulbright to Johnson, May 9, 1966 (University of Arkansas, Fulbright Papers, series 2). See [[cal.1966-04-21.vietnam]]. Names: Fulbright, Johnson.'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1966-05-10.open-housing-ca
    when: May 10
    date: '1966-05-10'
    thread: open-housing
    also: [court]
    c: '*Mulkey v. Reitman*, [64 Cal. 2d 529](https://static.case.law/cal-2d/64/case-pdfs/0529-01.pdf): the California Supreme Court holds Proposition 14, Art. I, § 26 of the State Constitution, void under the Fourteenth Amendment, the State having made itself a party to discrimination; a Negro couple''s suit under the Unruh Civil Rights Act against a landlord in Santa Ana to go forward (Check the place). Peek for the court, with four; White, sitting for Mosk, dissents.'
    n: '*Mulkey v. Reitman*, [64 Cal. 2d 529](https://static.case.law/cal-2d/64/case-pdfs/0529-01.pdf) (1966). To check: [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]. See [[cal.1964-11-03.cities-and-housing]].'
    tags: [state:ca]
  - id: cal.1966-05-10.governors-ne
    when: May 10
    date: '1966-05-10'
    thread: governors
    also: [elections-1966]
    c: 'Nebraska, governor; Morrison running for the Senate. Republican primary: Tiemann, a former mayor of Wausa, over Val Peterson, governor 1947–53, 78,338 to 63,589, 43.3 percent; Hagemeister 25,574, 14.1 percent; two others 13,478, 7.4 percent. Democratic: Lieutenant Governor Sorensen over Burbach, 65,051 to 35,439, 56.8 percent; others 14,052, 12.3 percent.'
    n: '[*Official Report of the Board of State Canvassers of the State of Nebraska, 1966*](https://govdocs.nebraska.gov/epubs/S1200/S001-1966prim_gen.pdf). Votes: [Wikipedia, "1966 Nebraska gubernatorial election"](https://en.wikipedia.org/wiki/1966_Nebraska_gubernatorial_election), from the Board''s report. To check: [[w.peirce-great-plains-states-of]]. Names: Sorensen, Burbach, Morrison, Tiemann, Peterson.'
    tags: [state:ne, name:tiemann-norbert-t, name:peterson-val, name:sorensen-philip-c, name:burbach-julius-w, name:morrison-frank-b]
  - id: cal.1966-05-10.vietnam
    when: May 10
    date: '1966-05-10'
    thread: vietnam
    c: 'The 557th NSC, Lodge home for consultation. Lodge: the Saigon government "almost paralyzed"; "evolution rather than stability." Rusk: a broad-based constituent assembly needed; to make Saigon act "we may have to go so far as to use the threat to get out of Vietnam." Johnson: "We are committed and we will not be deterred." No word to the press.'
    n: 'FRUS 1964–68, IV, doc. [135](https://history.state.gov/historicaldocuments/frus1964-68v04/d135). [[w.gibbons-u-s-government-and]], IV, 302–03. Names: Lodge, Rusk, Johnson.'
    tags: [name:lodge-henry-cabot, name:rusk-dean, name:johnson-lyndon-b]
  - id: cal.1966-05-10.vietnam-congress
    when: May 10
    date: '1966-05-10'
    thread: vietnam-congress
    c: 'London. Church with Wilson, in private: little to be done until Hồ Chí Minh sees he can neither drive the Americans out nor defeat them; talks among the Vietnamese; failing them, more American strength until the Viet Cong are suppressed, a protectorate preferable to a wider war.'
    n: '[[w.gibbons-u-s-government-and]], IV, 305. To check: London to Washington 5440, May 17, 1966 (State, Central File, Pol 27 Viet S), from Lowenstein''s memorandum of the talk. Names: Church, Wilson, Hồ Chí Minh.'
    tags: [name:church-frank, name:wilson-harold, name:ho-chi-minh]
  - id: cal.1966-05-09.legislatures-mn
    when: May 11
    date: '1966-05-11'
    thread: legislatures
    c: 'Minnesota. Rolvaag vetoes S.F. 2, the special session''s reapportionment bill: "it does not provide a fair and adequate system of legislative districting."'
    n: '[Message of Governor Karl F. Rolvaag Vetoing Senate File 2, Extra Session, 1966 Legislature](https://www.leg.mn.gov/archive/vetoes/1966_sp1veto_SF2.pdf) (May 11, 1966); Minn. Legis. Ref. Library, [Bills Vetoed, 1966](https://www.lrl.mn.gov/vetoes/vetodetails.aspx?year=1966). Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993). Check: the session''s call (it met Apr. 25: the message). See [[cal.1966-01-14.legislatures-mn]]. Names: Rolvaag.'
    tags: [state:mn, name:rolvaag-karl-f]
  - id: cal.1966-05-11.vietnam
    when: May 11
    date: '1966-05-11'
    thread: vietnam
    c: 'Johnson on the war''s critics, at the Woodrow Wilson School, Princeton, N.J.: "The exercise of power in this century has meant for all of us in the United States not arrogance but agony."'
    n: 'Remarks at the Woodrow Wilson School for Public and International Affairs, Princeton University, [1966 Pub. Papers 493](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=569) (May 11, 1966). [[w.gibbons-u-s-government-and]], IV, 309. See [[cal.1966-02-04.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-05-11.opinion
    when: May 11
    date: '1966-05-11'
    thread: opinion
    also: [economy, vietnam]
    c: 'Gallup, Apr. 14–19: have heard of the suggestion from Washington of higher income taxes, 68 percent. Of them, an increase now: favor 16, oppose 76.'
    n: '[[w.gallup-poll]], III, 2005.'
  - id: cal.1966-05-11.opinion-2
    when: May 11
    date: '1966-05-11'
    thread: opinion
    also: [economy, vietnam]
    c: 'Gallup, Apr. 14–19: prices and wages frozen for as long as the war in Vietnam lasts: a good idea 42 percent, a poor idea 44.'
    n: '[[w.gallup-poll]], III, 2005.'
  - id: cal.1966-05-12.vietnam-congress
    when: May 12
    date: '1966-05-12'
    thread: vietnam-congress
    c: Lodge before the Foreign Relations Committee in executive session on the political situation in South Vietnam and the military operations.
    n: '[[w.gibbons-u-s-government-and]], IV, 303 (the meeting "generally very friendly"). To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 725–68 (1993). See [[cal.1966-05-10.vietnam]]. Names: Lodge.'
    tags: [name:lodge-henry-cabot]
  - id: cal.1966-05-12.vietnam-congress-2
    when: May 12
    date: '1966-05-12'
    thread: vietnam-congress
    c: 'Johnson at the Democrats'' congressional dinner in the National Guard Armory, Fulbright present: "so many of my very old friends as well as some members of the Foreign Relations Committee"; "You can say one thing about those hearings, although I don''t think this is the place to say it."'
    n: 'Remarks at a Congressional Dinner Held in the National Guard Armory, [1966 Pub. Papers 502](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=578) (May 12, 1966). [[w.gibbons-u-s-government-and]], IV, 309–10. See [[cal.1966-05-09.vietnam-congress]]. Names: Johnson, Fulbright.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william]
  - id: cal.1966-05-13.cities-and-housing
    when: May 13
    date: '1966-05-13'
    thread: cities-and-housing
    also: [school-aid]
    c: 'Second Supplemental Appropriation Act signed, [80 Stat. 141](https://www.govinfo.gov/content/pkg/STATUTE-80/pdf/STATUTE-80-Pg141.pdf): the first money for rent supplements, contracts up to $12 million a year, only where a city has a workable program or its officials approve; $9.5 million for the Teacher Corps, each local program to have its State''s approval. June 18, Weaver sets aside over $600,000 for the first projects, over 1,000 units.'
    n: 'Remarks on Signing Supplemental Appropriations Bills Providing Funds for the National Teacher Corps and the Rent Supplement Program, [1966 Pub. Papers 506](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=582) (May 13, 1966); The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701) (June 18, 1966). See [[cal.1965-10-14.cities-and-housing]]; [[cal.1965-11-08.school-aid]]. Names: Weaver.'
    tags: [name:johnson-lyndon-b, name:weaver-robert-c]
  - id: cal.1966-05-13.opinion
    when: May 13
    date: '1966-05-13'
    thread: opinion
    also: [economy]
    c: 'Gallup, Mar. 3–8: prices in the next six months: up 81 percent, down 3, the same 13. The party more likely to keep prices down: Republican 26, Democratic 24, no difference 35. Independents: Republican 23, Democratic 17, no difference 42.'
    n: '[[w.gallup-poll]], III, 2005.'
  - id: cal.1966-05-13.vietnam-congress
    when: May 13
    date: '1966-05-13'
    thread: vietnam-congress
    c: 'McPherson to Johnson on the Armory speech: "harsh, uncompromising, over-militant"; "trying to beat Fulbright''s ears down." The questions about Vietnam "cannot be shouted out of existence." By McPherson''s later account, a freeze-out of several days, and the "Nervous Nellies" of May 17 aimed at him and Fulbright.'
    n: 'FRUS 1964–68, IV, doc. [136](https://history.state.gov/historicaldocuments/frus1964-68v04/d136). [[w.gibbons-u-s-government-and]], IV, 310–11 (and McPherson''s account, CRS interview, Feb. 28, 1979). See [[cal.1966-05-12.vietnam-congress-2]]. Names: McPherson, Johnson, Fulbright.'
    tags: [name:mcpherson-harry, name:johnson-lyndon-b, name:fulbright-j-william]
  - id: cal.1966-05-14.students
    when: May 14
    date: '1966-05-14'
    thread: students
    also: [defense]
    c: 'The Selective Service College Qualification Test, first of three sittings (May 21, June 3): local boards to weigh its score and class standing in deferring students. At the University of Chicago students hold the administration building, May 11–16 (Check), against the university''s giving class rank to the boards.'
    n: '[[w.gibbons-u-s-government-and]], IV, 341 (the protests at the test centers, May 14; the occupations at Chicago, City College and Wisconsin). To check: [[w.flynn-draft-1940-1973]]; [[w.baskir-chance-and-circumstance]]; [[w.sale-sds]].'
    tags: [name:hershey-lewis-b]
  - id: cal.1966-05-15.vietnam
    when: May 15–16
    date: '1966-05-15'
    thread: vietnam-struggle
    c: 'Đà Nẵng. Kỳ moves without telling the embassy: marine and airborne battalions under Cao Văn Viên, flown from Saigon, take the city hall, the radio station and the I Corps headquarters at dawn, May 15; the Struggle forces fall back into the pagodas. Rusk to Porter: "insane bickering." May 16, Đính replaced at I Corps by Huỳnh Văn Cao.'
    n: '[FRUS 1964–68, IV, doc. 138](https://history.state.gov/historicaldocuments/frus1964-68v04/d138). Made public, the telegram: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 315–18. See [[cal.1966-03-10.vietnam]]; [[cal.1966-04-02.vietnam]]. Names: Nguyễn Cao Kỳ, Cao Văn Viên, Tôn Thất Đính, Huỳnh Văn Cao, Rusk, Porter.'
    tags: [name:nguyen-cao-ky, name:cao-van-vien, name:ton-that-dinh, name:huynh-van-cao, name:rusk-dean, name:porter-william-j, place:da-nang]
  - id: cal.1966-05-15.opinion
    when: May 15
    date: '1966-05-15'
    thread: opinion
    also: [transportation]
    c: 'Gallup, Apr. 14–19: the chief reason for auto accidents: careless drivers 60 percent; speeding 31; drinking 21; young drivers 5; faulty cars 3; cars too high-powered 2. Higher safety standards for future cars set by the Federal Government 12, by the industry 29, by both 55.'
    n: '[[w.gallup-poll]], III, 2005–06.'
  - id: cal.1966-05-16.civil-rights-organizations
    when: May 16
    date: '1966-05-16'
    thread: civil-rights-organizations
    c: SNCC's staff, meeting at Kingston Springs, Tenn., re-elects Lewis chairman, then, after Worth Long challenges the vote, elects Carmichael in his place. Ruby Doris Smith Robinson succeeds Forman as executive secretary. Check the dates.
    n: 'SNCC, [press release](https://www.crmvet.org/docs/pr/660516_sncc_pr_stokely.pdf), May 16, 1966. To check: [[w.carson-in-struggle]]; [[w.joseph-stokely]]; [[w.carmichael-ready-for-revolution]]; [[w.lewis-walking-with-the-wind]]. See [[cal.1966-01-06.students]]. Names: Lewis, Carmichael, Forman, Robinson, Long.'
    tags: [name:lewis-john, name:carmichael-stokely, name:forman-james, name:robinson-ruby-doris-smith, name:long-worth]
  - id: cal.1966-05-17.testing
    when: May 17
    date: '1966-05-17'
    thread: testing
    c: 'China''s third nuclear test, May 9, a device with thermonuclear material (Check). May 17, the Senate adopts Pastore''s resolution, S. Res. 179, [84–0](https://voteview.com/rollcall/RS0890300): the President''s efforts toward agreements against the spread of nuclear weapons commended and supported.'
    n: 'To check: [[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]. See [[cal.1964-10-16.testing]]; [[cal.1965-01-21.testing]]. Names: Pastore.'
    tags: [name:pastore-john-o]
  - id: cal.1966-05-17.governors-pa
    when: May 17
    date: '1966-05-17'
    thread: governors
    also: [elections-1966]
    c: 'Pennsylvania primaries for governor. Democratic: Shapp, an electronics manufacturer spending his own money, over Casey, the organization''s candidate, 543,057 to 493,866, 48.6 percent. Republican: Shafer, the lieutenant governor, over Stassen, 835,768 to 172,150, 78.0 percent.'
    n: '[Wikipedia, "1966 Pennsylvania gubernatorial election"](https://en.wikipedia.org/wiki/1966_Pennsylvania_gubernatorial_election) (Shapp 543,057, Casey 493,866; Shafer 835,768, Stassen 172,150); check against the *Pennsylvania Manual*, vol. 98 (1967). To check: [[w.beers-pennsylvania-politics-today-and]]; [[w.peirce-mid-atlantic-states-of]]. Names: Shafer, Stassen, Shapp, Casey.'
    tags: [state:pa, name:shapp-milton-j, name:casey-robert-p, name:shafer-raymond-p, name:stassen-harold-e]
  - id: cal.1966-05-17.vietnam
    when: May 17
    date: '1966-05-17'
    thread: vietnam
    c: 'Johnson at a Democratic dinner in Chicago: "There will be some ''Nervous Nellies'' and some who will become frustrated and bothered and break ranks under the strain."'
    n: 'Remarks at a Democratic Party Dinner in Chicago, [1966 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=589) (May 17, 1966). [[w.gibbons-u-s-government-and]], IV, 310–11 (and McPherson''s account of it, 1979). See [[cal.1966-05-11.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-05-17.vietnam-struggle
    when: May 17
    date: '1966-05-17'
    thread: vietnam-struggle
    c: Huế. An American door gunner kills an ARVN lieutenant firing on Huỳnh Văn Cao's helicopter.
    n: '[*New York Times*, May 18, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/18/issue.html). See [[cal.1966-03-10.vietnam]]. Names: Huỳnh Văn Cao.'
    tags: [name:huynh-van-cao, place:hue]
  - id: cal.1966-05-18.defense
    when: May 18
    date: '1966-05-18'
    thread: defense
    c: 'McNamara to the American Society of Newspaper Editors at Montreal: in the modernizing nations "security is development"; past a point a nation buys no more security with more arms; the United States no mandate to police the world. Proposes that every young American give two years to the country, in the services or in other work (Check the wording).'
    n: '[Cong. Rec., Senate, May 19, 1966, 11039–11042](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-1-1.pdf#page=59). [[w.drea-mcnamara-clifford-and-the-2011]], 272 (the speech at Montreal, May 18). To check: [[w.mcnamara-essence-of-security]]; [[w.shapley-promise-and-power]]. Names: McNamara.'
    src:
      c: 664ce278
      rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-1-1.pdf#page=59: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 272: A'
        - 'via w.drea-mcnamara-clifford-and-the-2011 272 n.38b: A'
    tags: [name:mcnamara-robert-s]
  - id: cal.1966-05-18.opinion
    when: May 18
    date: '1966-05-18'
    thread: opinion
    also: [congress, amendments, electoral-college]
    c: 'Gallup, Jan. 21–26: a constitutional amendment to abolish the Electoral College and elect the President by the national popular vote: approve 63 percent, disapprove 20.'
    n: '[[w.gallup-poll]], III, 2006.'
  - id: cal.1966-05-19.europe-and-the-alliance-france
    when: May 19
    date: '1966-05-19'
    thread: europe-and-the-alliance-france
    c: 'The Cabinet Room, 6 p.m.: Johnson with Rusk, McNamara, Ball, Acheson, Bruce, Moyers, Bator and Rostow. A letter to Wilson approved in principle: not to be too exacting with the Germans, nor to freeze the nuclear sharing question. On Acheson''s draft aide-mémoire to France, Johnson wants nothing in writing and attacks officials who have assailed de Gaulle; Acheson, by Bruce''s diary, furious.'
    n: 'FRUS 1964–68, XIII, docs. [166](https://history.state.gov/historicaldocuments/frus1964-68v13/d166) (Bruce''s diary), [168](https://history.state.gov/historicaldocuments/frus1964-68v13/d168) (the letter, May 20). Made public: FRUS 1964–68, XIII (1995). [[w.schwartz-lyndon-johnson-and-europe]], 109–10. See [[cal.1966-04-04.europe-and-the-alliance-france]]. Names: Rusk, McNamara, Ball, Acheson, Bruce, Moyers, Bator, Rostow, Wilson, de Gaulle, Johnson.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:ball-george-w, name:acheson-dean-g, name:bruce-david-k-e, name:moyers-bill, name:bator-francis-m, name:rostow-walt-w, name:wilson-harold, name:de-gaulle-charles]
  - id: cal.1966-05-20.opinion
    when: May 20
    date: '1966-05-20'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 5–10: Johnson''s handling of Vietnam: approve 47 percent, disapprove 35. Democrats 57 approve; independents 46; Republicans 35.'
    n: '[[w.gallup-poll]], III, 2006–07. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-05-24.legislatures-mn
    when: May 20
    date: '1966-05-20'
    thread: legislatures
    c: 'Minnesota. Rolvaag approves S.F. 6, the special session''s third reapportionment bill: 67 legislative districts, 67 senators, 135 representatives.'
    n: '[Minn. Laws 1966, Ex. Sess., ch. 1](https://www.revisor.mn.gov/laws/1966/1/Session+Law/Chapter/1/pdf/), §§ 1–2; "Approved May 20, 1966," [36](https://www.revisor.mn.gov/laws/1966/1/Session+Law/Chapter/1/pdf/#page=24). Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993), gives May 24. See [[cal.1966-01-14.legislatures-mn]]. Names: Rolvaag.'
    tags: [state:mn, name:rolvaag-karl-f]
  - id: cal.1966-05-20.vietnam-congress
    when: May 20
    date: '1966-05-20'
    thread: vietnam-congress
    c: 'Marcy to Fulbright: get Mansfield and Russell to arrange a private meeting of a few senior Senators of both parties with the President, to urge "a radical shift" toward less involvement: a speech "more in sorrow than in anger," American forces withdrawn to designated areas for up to two years, then out. "This may seem pretty wild."'
    n: '[[w.gibbons-u-s-government-and]], IV, 324–25. To check: Marcy to Fulbright, May 20, 1966; Marcy to Hartke, May 22 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, Mansfield, Russell.'
    tags: [name:marcy-carl, name:fulbright-j-william, name:mansfield-mike, name:russell-richard-b]
  - id: cal.1966-05-21.mississippi-ms
    when: May 21
    date: '1966-05-21'
    thread: mississippi
    also: [states-and-cities]
    c: 'Paul Johnson signs the Local Option Alcoholic Beverage Control Law: statewide prohibition ends; each county to vote wet or dry. Feb. 4, a raid on the Jackson Country Club. Check the date.'
    n: 'Mississippi Department of Archives and History, [newsfilm, the signing](https://da.mdah.ms.gov/series/newsfilm/detail/528833) (dated May 21, 1966). Check: Miss. Laws 1966. To check: [[w.peirce-deep-south-states-of]]. Names: Paul Johnson.'
    tags: [state:ms, city:jackson, name:johnson-paul-b-jr]
  - id: cal.1966-05-21.vietnam-struggle
    when: May 21–23
    date: '1966-05-21'
    thread: vietnam-struggle
    c: 'Đà Nẵng. Fighting at the pagodas, government planes overhead, Walt''s marines between; by May 23 the city is the government''s (Check). Moyers to Rusk, May 21: the President "deeply disturbed." Johnson, at his news conference the same day: "We are watching the situation in Vietnam very closely."'
    n: 'FRUS 1964–68, IV, docs. [143](https://history.state.gov/historicaldocuments/frus1964-68v04/d143), [144](https://history.state.gov/historicaldocuments/frus1964-68v04/d144), [145](https://history.state.gov/historicaldocuments/frus1964-68v04/d145). The President''s News Conference, [1966 Pub. Papers 531](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=607) (May 21, 1966). Made public, Moyers''s call: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 321–23. See [[cal.1966-03-10.vietnam]]. Names: Walt, Moyers, Rusk, Johnson.'
    tags: [name:walt-lewis-w, name:moyers-bill, name:rusk-dean, name:johnson-lyndon-b, place:da-nang]
  - id: cal.1966-05-21.vietnam
    when: May 21
    date: '1966-05-21'
    thread: vietnam
    c: 'Johnson and Fortas by telephone on Vietnam. Fortas''s handwritten memorandum after: "We''ve got to make a commitment to success"; go on the offensive in the propaganda war; if Kỳ succeeds at Đà Nẵng, a statement that the United States will not let South Vietnam be "a monument to freedom''s defeat."'
    n: '[[w.gibbons-u-s-government-and]], IV, 322 n.27. To check: Fortas''s memorandum, undated (LBJ Library, NSF Country File, Vietnam, Box 99). Check: the memorandum is filed with Sept.–Oct. 1967; Gibbons dates it by the call of May 21, 1966, and its reference to Đà Nẵng; Berman (*Lyndon Johnson''s War*, 87) and Kalman (*Abe Fortas*, 248) date it Oct. 14, 1967. Names: Johnson, Fortas, Nguyễn Cao Kỳ.'
    tags: [name:johnson-lyndon-b, name:fortas-abe, name:nguyen-cao-ky]
  - id: cal.1966-05-22.opinion
    when: May 22
    date: '1966-05-22'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Apr. 14–19: if the South Vietnamese start fighting among themselves on a big scale: continue to help them 28 percent, withdraw 54; college-educated 40 and 45. If the South Vietnamese government stops fighting: the United States to go on with the war alone 16, withdraw 72. The South Vietnamese able to establish a stable government: yes 32, no 48.'
    n: '[[w.gallup-poll]], III, 2007–09. See [[cal.1966-03-10.vietnam]].'
  - id: cal.1966-05-23.vietnam-congress
    when: May 23
    date: '1966-05-23'
    thread: vietnam-congress
    c: 'Rusk at State with the Senate''s leaders, Long, Kuchel, Russell, Saltonstall, Fulbright, Hickenlooper, Hayden and Milton Young, then the House''s, McCormack, Albert, Ford, Arends, Mahon, Bow, Morgan, Bolton, Rivers and Bates: Đà Nẵng in hand, a settlement possible at Huế. In both, deep concern at the South Vietnamese quarrel; Bates: the people "progressively more restive," and more will want to pull out. Fulbright to reporters: not encouraged.'
    n: '[[w.gibbons-u-s-government-and]], IV, 323–24. To check: Memorandum "For the President''s Evening Reading," May 23, 1966 (State, Lot File 74 D 164); *New York Times*, May 24, 1966. Names: Rusk, Russell Long, Kuchel, Russell, Saltonstall, Fulbright, Hickenlooper, Hayden, Milton Young, McCormack, Albert, Ford, Arends, Mahon, Bow, Morgan, Bolton, Rivers, Bates.'
    tags: [name:rusk-dean, name:long-russell-b, name:kuchel-thomas-h, name:russell-richard-b, name:saltonstall-leverett, name:fulbright-j-william, name:hickenlooper-bourke-b, name:hayden-carl, name:young-milton-r, name:mccormack-john-w, name:albert-carl, name:ford-gerald-r, name:arends-leslie-c, name:mahon-george-h, name:bow-frank-t, name:morgan-thomas-e, name:bolton-frances-p, name:rivers-l-mendel, name:bates-william-h]
  - id: cal.1966-05-24.elections-1966
    when: May 24
    date: '1966-05-24'
    thread: elections-1966
    also: [vietnam, governors]
    c: 'Oregon''s primary, for Maurine Neuberger''s Senate seat. Democratic: U.S. Representative Robert Duncan, for the war, over Howard Morgan, once of the Federal Power Commission, against it, with Morse and Edith Green behind him, 161,189 to 89,174, 62.2 percent. Republican: Governor Hatfield, a critic of the war, over Huss, 174,280 to 31,368, 75.2 percent.'
    n: 'Votes: Wikipedia, "1966 United States Senate election in Oregon"; Check: Oregon, *Official Abstract of Votes*, Primary Election, May 24, 1966. [*New York Times*, May 25, 1966](https://timesmachine.nytimes.com/timesmachine/1966/05/25/issue.html). To check: [[w.drukman-wayne-morse]]; [[w.hatfield-not-quite-so-simple]]. Names: Hatfield, Morse, Neuberger, Green, Duncan, Morgan.'
    tags: [name:neuberger-maurine-b, name:duncan-robert-b, name:morgan-howard, name:morse-wayne, name:green-edith, name:hatfield-mark-o]
  - id: cal.1966-05-24.governors-fl
    when: May 24
    date: '1966-05-24'
    thread: governors
    also: [elections-1966]
    c: 'Florida''s Democratic runoff for governor: High over Governor Burns, 596,471 to 509,271, 53.9 percent. Burns does not endorse him.'
    n: '[Fla. *Tabulation of Official Vote, Florida Primary Elections*, 1966, 43](https://archive.org/details/TabulationofofficialvoteFloridaprimaryelections1966/page/n44). Votes: [Wikipedia, "1966 Florida gubernatorial election"](https://en.wikipedia.org/wiki/1966_Florida_gubernatorial_election). See [[cal.1966-05-03.governors-fl]]. Names: Burns, High.'
    tags: [name:burns-w-haydon, name:high-robert-king, state:fl]
  - id: cal.1966-05-24.governors-ok
    when: May 24
    date: '1966-05-24'
    thread: governors
    also: [elections-1966]
    c: 'Oklahoma runoffs for governor. Democratic: Preston Moore over Gary, 228,625 to 196,835, 53.7 percent. Republican: Bartlett over Camp, 49,916 to 38,043, 56.7 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 62](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=62); [p. 64](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=64). See [[cal.1966-05-03.governors-ok]]. Names: Moore, Gary, Bartlett, Camp.'
    tags: [state:ok, name:moore-preston-j, name:gary-raymond, name:bartlett-dewey-f, name:camp-john-n]
  - id: cal.1966-05-24.state-constitutions-ok
    when: May 24
    date: '1966-05-24'
    thread: state-constitutions
    also: [state-legislatures]
    c: 'Oklahoma, with the runoffs, adopts two amendments: annual sessions of the Legislature, ninety legislative days each, 208,894 to 199,240, 51.2 percent; area vocational school districts with a five-mill levy, 214,698 to 206,458, 51.0 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 65](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=65). See [[cal.1966-05-03.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1966-05-24.governors-or
    when: May 24
    date: '1966-05-24'
    thread: governors
    also: [elections-1966]
    c: 'Oregon''s primary, for governor, Hatfield running for the Senate. Republican: McCall, the secretary of state, over one other, 215,959 to 20,286, 91.4 percent. Democratic: Straub, the State treasurer, over Musa, 182,697 to 41,610, 72.5 percent.'
    n: 'Votes: [Wikipedia, "1966 Oregon gubernatorial election"](https://en.wikipedia.org/wiki/1966_Oregon_gubernatorial_election); Check: [Or. *Official Abstract of Votes, Primary Election, 1966*, 4](https://records.sos.state.or.us/ORSOSWebDrawer/Record/8411029/File/document). To check: [[w.walth-fire-at-edens-gate]]. See [[cal.1966-05-24.elections-1966]]. Names: McCall, Straub, Musa, Hatfield.'
    tags: [state:or, name:mccall-tom, name:straub-robert-w, name:musa-ben, name:hatfield-mark-o]
  - id: cal.1966-05-24.vietnam-congress
    when: May 24
    date: '1966-05-24'
    thread: vietnam-congress
    also: [foreign-aid]
    c: 'The Foreign Relations Committee, in executive session on the foreign aid bill, adopts Church''s amendment in the words State supplied: no assistance under the act to be construed "as creating a new commitment or as affecting any existing commitment" to use the armed forces for any foreign country. Rusk had asked Johnson; Johnson: "I would try to keep any amendment out—if not I''d try a modified amendment."'
    n: '[[w.gibbons-u-s-government-and]], IV, 414–15. To check: the committee''s transcript, May 24 and 26, 1966, unpublished; S. Rep. No. 89-1359, 7; Rostow to Johnson, May 13, 1966, with Meeker''s memorandum (LBJ Library, NSF Memos to the President—Walt Rostow). Check: Gibbons gives the amendment as enacted "creating" and Meeker''s language "enacting" (IV, 414, 415 n.108). Names: Church, Rusk, Johnson, Meeker.'
    tags: [name:church-frank, name:rusk-dean, name:johnson-lyndon-b, name:meeker-leonard-c]
  - id: cal.1966-05-25.opinion
    when: May 25
    date: '1966-05-25'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Apr. 14–19: Johnson 54 percent, Nixon 36, undecided 10.'
    n: '[[w.gallup-poll]], III, 2009. Names: Johnson, Nixon.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m]
  - id: cal.1966-05-26.vietnam
    when: May 26
    date: '1966-05-26'
    thread: vietnam-struggle
    c: Huế. After the funeral of the lieutenant killed May 17, a crowd burns the USIS library.
    n: '[FRUS 1964–68, IV, doc. 146](https://history.state.gov/historicaldocuments/frus1964-68v04/d146). [[w.gibbons-u-s-government-and]], IV, 325. See [[cal.1966-03-10.vietnam]]; [[cal.1966-05-15.vietnam]].'
    tags: [place:hue]
  - id: cal.1966-05-26.jobs-and-wages
    when: May 26
    date: '1966-05-26'
    thread: jobs-and-wages
    c: 'House passes the Fair Labor Standards Amendments, H.R. 13712, [303–93](https://voteview.com/rollcall/RH0890261): the minimum wage to rise by steps to $1.60 an hour; coverage extended to millions more, farm workers among them (Check). An amendment to narrow the coverage of retail enterprises by their sales lost, [195–200](https://voteview.com/rollcall/RH0890258).'
    n: 'To check: [[w.nordlund-quest-for-a-living]].'
  - id: cal.1966-05-26.africa
    when: May 26
    date: '1966-05-26'
    thread: africa
    c: 'Johnson at a White House reception for the third anniversary of the Organization of African Unity, his first speech on Africa: "self-determination and an orderly transition to majority rule"; against "the narrow-minded, outmoded policy which in some parts of Africa permits the few to rule at the expense of the many"; support for Britain and the UN "to restore legitimate government in Rhodesia." Offers for regional development: universities, communications, transport, the African Development Bank.'
    n: 'Remarks at a Reception Marking the Third Anniversary of the Organization of African Unity, [1966 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=632) (May 26, 1966). FRUS 1964–68, XXIV, docs. [210](https://history.state.gov/historicaldocuments/frus1964-68v24/d210), [211](https://history.state.gov/historicaldocuments/frus1964-68v24/d211). To check: [[w.lyons-keeping-africa-off-the]]; [[w.noer-cold-war-and-black]]; [[w.deroche-black-white-and-chrome]]. See [[cal.1963-05-22.africa]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-05-27.opinion
    when: May 27
    date: '1966-05-27'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, May 5–10: the most important problem: Vietnam 45 percent; the cost of living 16; civil rights 9; threat of war 8; world communism 5; lack of religion, immorality 5. The party better able to handle it: Democratic 29, Republican 22, no difference 37.'
    n: '[[w.gallup-poll]], III, 2009.'
  - id: cal.1966-05-27.vietnam-congress
    when: May 27
    date: '1966-05-27'
    thread: vietnam-congress
    c: 'Johnson''s reply to Fulbright, drafted by Moyers: the analogy that counts, aggressive powers left free to use force against smaller states; "I must take the responsibility for deciding the policy—not my ''advisers.''" And: their differences of policy have not "erased the friendship we have shared so long."'
    n: '[[w.gibbons-u-s-government-and]], IV, 311–12. To check: Johnson to Fulbright, May 27, 1966 (LBJ Library, NSF Memos to the President—Walt Rostow). See [[cal.1966-05-09.vietnam-congress]]. Names: Johnson, Fulbright, Moyers.'
    tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:moyers-bill]
  - id: cal.1966-05-28.vietnam
    when: May 28
    date: '1966-05-28'
    thread: vietnam
    c: 'McNamara with Harriman, by Harriman''s notes: he hopes for a settlement and sees no value in escalation; North Vietnamese troops out and American troops out, an expanded ICC to watch; the bombing stopped if infiltration stops; the South Vietnamese to decide their future "even if it meant a coalition government with the Viet Cong."'
    n: 'FRUS 1964–68, IV, doc. [148](https://history.state.gov/historicaldocuments/frus1964-68v04/d148) (Harriman, May 30). [[w.gibbons-u-s-government-and]], IV, 328. Made public: FRUS 1964–68, IV (1998). Names: McNamara, Harriman.'
    tags: [name:mcnamara-robert-s, name:harriman-w-averell]
  - id: cal.1966-05-29.opinion
    when: May 29
    date: '1966-05-29'
    thread: opinion
    also: [elections-1966]
    c: 'Gallup, May 19–24: the party one would like to see win the congressional district: Democratic 53 percent, Republican 47. South 68 and 32; outside the South 50 and 50.'
    n: '[[w.gallup-poll]], III, 2009.'
  - id: cal.1966-05-29.vietnam-struggle
    when: May 29–30
    date: '1966-05-29'
    thread: vietnam-struggle
    c: 'Self-immolations, a nun at Huế on May 29 the first (Check), others in the days after. Lodge, May 30: a "cynical campaign of hunger strikes, letters in blood and suicide."'
    n: 'Lodge''s words: his telegram 5124 from Saigon, May 30, quoted in FRUS 1964–68, IV, doc. [150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150), n. 3. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-03-10.vietnam]]. Names: Lodge.'
    tags: [name:lodge-henry-cabot, place:hue]
