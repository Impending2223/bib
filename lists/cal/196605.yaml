    thread: china-four-cleanups
    also: [china-mao, china-army]
    c: 'Mao to Lin Biao, on the General Logistics Department''s report of May 6 on army farming (4 to 5 billion catties of grain in three to five years): a very good plan.{1} The army should be a big school, in peace and in a third world war, learning politics, military affairs and culture, farming, running small factories, doing mass work, joining the Four Cleanups;{2} the "May 7 directive."{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1966; [[w.macfarquhar-maos-last-revolution]], 105 (Mao''s letter of May 7 to Lin Biao: there must be a revolution in education, the rule of bourgeois intellectuals over the schools no longer to be tolerated; some students at first want to make their schools military-Communist institutions like the Resistance University); [[w.macfarquhar-maos-last-revolution]], 160 (Mao writes Lin Biao that the PLA is a great school combining politics, military affairs and culture with agricultural and industrial production); [[w.jianguo-yilai-mao-zedong]], XVIII, 261–264 (May 7, 1966; Mao''s letter to Lin Biao, May 7, printed from a Center document (the manuscript held); it goes on to workers, peasants and students: students to study mainly, and also industry, farming and military affairs, and criticize the bourgeoisie; schooling to be shortened, education revolutionized, the bourgeois intellectuals'' rule of the schools not to continue; note 2: the report''s 4 to 5 billion catties of grain in three to five years, a year''s army grain for some 7 to 8 million men); [[w.mao-zedong-zhuan]], VI, ch. 74 nn.39, 40 (Mao''s comment, the day by the note, on a report of the General Logistics Department sent by Lin Biao: the army is to be a great school learning politics, military affairs and culture, and joining in the cultural revolution against the bourgeoisie; the other trades, the Party and government organs too, are to criticize the bourgeoisie; the school system to be shortened, education made revolutionary; the *Renmin ribao* publishes its main points in an editorial, n.40; later called the ''May 7 directive'' 《五七指示》). [[w.yang-jisheng-tiandi-fanfu]], I, 176–178 (the letter in full, May 7; the 5.7 directive 五七指示, Mao''s picture of the new man; the *Renmin ribao* editorial of Aug. 1, 〈全國都應成為毛澤東思想的大學校〉, publishes its main contents); [[w.jian-zhou-enlai]], 539–540 (the "May Seventh Instruction": the army''s farming begun on Zhou''s instructions with Lin''s support; every organization a "big school," to "learn politics, military affairs, and culture, and engage in agricultural production," with its own small workshops; the army to "take part in mass work, factory work, and rural socialist education" and "the revolutionary struggle against capitalist culture"); [[w.teiwes-tragedy-of-lin-biao]], 58, 60 (Mao''s directive answers a report of Qiu Huizuo''s Logistics Department on the army''s farm sideline production, which Lin passed to Mao for approval); [[w.dikotter-cultural-revolution]], 59–60 n.18 (the army to be a great school: military and educational, agricultural, industrial and civilian work; the letter widely distributed in the following weeks); [[w.dikotter-cultural-revolution]], 202–203 n.35 (Mao writes to Lin Biao extolling the Yan''an model: people to learn other skills and contribute to production); [[w.pu-weihua-zalan-jiu-shijie]], 106–107 (the General Logistics Department''s report of the army''s farming in five points, 4 to 5 billion catties of grain in three to five years, a year''s rations for 7 or 8 million; Mao''s letter to Lin Biao: the army a big school, learning politics, military affairs and culture, farming, small factories, mass work, the Four Cleanups, criticizing the bourgeoisie; workers, peasants, students, commerce and the Party and government offices likewise; later called the "May 7 directive"; the Wengao, XII, 53–54 (107 n.35)). Made public: Aug. 1, 1966 (the *Renmin ribao* editorial of that day paraphrased it); the text, Check. Check: the entry''s c does not hold the letter''s passage on education that MacFarquhar quotes (105). To check: the General Logistics Department''s report of May 6, 1966, *Guanyu jinyibu gaohao bu dui nongfu ye shengchan de baogao*; XXX, interview by Michael Schoenhals, Cambridge, Mass., April 8, 1992 (cited by [[w.macfarquhar-maos-last-revolution]], 105 n.14a); [[w.schram-mao-tse-tung-unrehearsed]], 260 (cited by [[w.macfarquhar-maos-last-revolution]], 105 n.14b); General Logistics Department, report to the Military Commission "On further improving the army''s farm and sideline production," May 2, 1966 (sent to Mao by Lin Biao May 6) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 263 n.2); Mao Zedong 毛泽东, comment on the General Logistics Department''s 总后勤部 report on further improving the army''s farm and sideline production 《关于进一步搞好部队农副业生产的报告》 (manuscript 手稿), May 7, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.39); *Renmin ribao* 《人民日报》, Aug. 1, 1966 (the editorial "The whole country should be a great school of Mao Zedong Thought" 《全国都应该成为毛泽东思想的大学校》) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.40); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 53–54 (cited by [[w.jian-zhou-enlai]], 540 n.83); [[w.ke-wenhua-dageming-zhongde-renmin]], 386 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.7a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 268–269 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.7b); [[w.chen-mao-papers]], 103–105 (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.7c); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 60 n.7d). Names: Mao Zedong, Lin Biao.'
