  - id: cal.1966-05-28.china-leadership
    when: May 28
    date: '1966-05-28'
    thread: china-may-sixteenth
    also: [china-mao-cr]
    c: 'Mao approves the list of the Center Cultural Revolution Group agreed by the standing members in Peking: head Chen Boda;{1} adviser Kang Sheng; deputy heads Jiang Qing, Wang Renzhong, Liu Zhijian and Zhang Chunqiao;{2} members Xie Tangzhong, Yin Da, Wang Li, Guan Feng, Qi Benyu, Mu Xin and Yao Wenyuan.{3} The Center sends it to county and regiment Party committees the same day.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 28, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 33 (May 28, 1966; the Center''s notice setting up the Central Cultural Revolution Group: Chen Boda head, Kang Sheng adviser, Jiang Qing, Wang Renzhong, Liu Zhijian and Zhang Chunqiao deputies, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan and others members); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 28, 1966; the Central Committee issues its notice setting up the Cultural Revolution Group of the Central Committee, with Chen Boda head, Kang Sheng adviser and Jiang Qing and others deputy heads); [[w.macfarquhar-maos-last-revolution]], 99 (Zhongfa [1966] 281, May 28: the Group''s existence and its leading members'' names first revealed to an inner-party audience); [[w.deng-xiaoping-nianpu-1904]], III, 1915–1916 (May 28, 1966; the Central Committee issues its notice setting up the Central Cultural Revolution Group 中央文化革命小组 under the Politburo Standing Committee: head Chen Boda, adviser Kang Sheng, deputy heads Jiang Qing, Wang Renzhong and Liu Zhijian and others (the names run on in the nianpu)); [[w.yang-jisheng-tiandi-fanfu]], I, 175 (May 28, the Cultural Revolution Group 中央文革小組 formally set up; Mao appoints Chen Boda head, Kang Sheng adviser, Jiang Qing, Wang Renzhong, Liu Zhijian 劉志堅 and Zhang Chunqiao deputy heads, Xie Tangzhong 謝鏜忠, Yin Da, Wang Li, Guan Feng, Qi Benyu, Mu Xin and Yao Wenyuan 姚文元 members; Guo Yingqiu 郭影秋, Yang Zhilin 楊植林, Zheng Jiqiao 鄭季翹, Liu Wenzhen 劉文珍 and Zhang Pinghua 張平化 for a time also members; under the Standing Committee); [[w.yang-jisheng-tiandi-fanfu]], II, 1143; [[w.peng-zhen-nianpu-1902]], IV, 487 (May 28, 1966; the Center''s notice re-forming the Central Cultural Revolution Group: Chen Boda head, Kang Sheng adviser, Jiang Qing, Wang Renzhong, Liu Zhijian and Zhang Chunqiao deputies, Guan Feng, Qi Benyu and Yao Wenyuan members; on Aug. 30 the Center names Jiang Qing, first deputy, acting head during Chen''s sick leave or absence; the group in time supplants the Politburo and Secretariat); [[w.dikotter-cultural-revolution]], 56 n.9, n.10 (the Group of Five dissolved; the Cultural Revolution Group under Chen Boda, with Jiang Qing, Kang Sheng, Yao Wenyuan, Zhang Chunqiao; two buildings, then four more, at the Diaoyutai guesthouse); [[w.liu-jixian-ye-jianying-nianpu]], II, 937–938 (May 28, 1966; the Center''s notice setting up the Central Cultural Revolution Group 中央文化革命小组: Chen Boda 陈伯达 head, Kang Sheng 康生 adviser, Jiang Qing 江青, Wang Renzhong 王任重, Liu Zhijian 刘志坚 and Zhang Chunqiao 张春桥 deputies, Wang Li 王力, Guan Feng 关锋, Qi Benyu 戚本禹, Yao Wenyuan 姚文元 and others members; it came by degrees to take the place of the Politburo and the Secretariat); [[w.pu-weihua-zalan-jiu-shijie]], 117 (May 28: the Center''s "Notice on the list of the Central Cultural Revolution Group" 〈關於中央文化革命小組名單的通知〉, in full; the four members from North China, the Northeast, the Northwest and the Southwest to be named later; the text in the *"Wenhua dageming" yanjiu ziliao*, I, 26 (117 n.52)); [[w.chen-yun-nianpu-xiuding]], III, 153 (the Center''s notice setting up the Central Cultural Revolution Group: Chen Boda head, Kang Sheng adviser, Jiang Qing, Zhang Chunqiao and others deputies, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan and others members; it came to replace the Politburo and the Secretariat); [[w.zhu-de-nianpu-xinbian]], III, 1953 (May 28, 1966; the Center''s 中共中央 notice on the list of the Central Cultural Revolution Group 《关于中央文化革命小组名单的通知》, set up under the Politburo Standing Committee 中央政治局常委: Chen Boda 陈伯达 head, Kang Sheng 康生 adviser, Jiang Qing 江青, Zhang Chunqiao 张春桥 and others deputy heads, Wang Li 王力, Guan Feng 关锋, Qi Benyu 戚本禹, Yao Wenyuan 姚文元 and others members). Made public: 1988. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 26 (cited by [[w.macfarquhar-maos-last-revolution]], 99 n.67); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 33 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 175 n.43a); Wang Guangyu, *Qingshi nanyin: Zuihou yici jiaodai* (2011), 34–35 (cited by [[w.dikotter-cultural-revolution]], 56 n.10). Names: Mao Zedong, Chen Boda, Kang Sheng, Jiang Qing, Wang Renzhong, Liu Zhijian, Zhang Chunqiao, Xie Tangzhong, Yin Da, Wang Li, Guan Feng, Qi Benyu, Mu Xin, Yao Wenyuan.'
