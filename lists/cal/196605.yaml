    c: 'Liu Shaoqi speaks at the enlarged Politburo meeting on studying Mao Zedong Thought and the meaning of carrying out the cultural revolution, and makes a self-criticism. Of understanding the cultural revolution he says: on this question we were muddled in the past, did not understand well, were not earnest and were not effective, himself included; in this recent period he has read little of the material on it, fell ill once and went abroad once, missed much of the material and could not keep up.'
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 26, 1966); [[w.pu-weihua-zalan-jiu-shijie]], 93 (the morning of May 26: on Mao''s view he criticizes Peng Zhen, and Chen Yun''s fixing of output by household of 1962; of the socialist education, the weight of cadres'' errors somewhat overrated; since Yan Weibing''s letters the Chairman has spoken of coups; at the Seven Thousand Cadres Conference the faults of the Great Leap were overstated; Tian Jiaying too was for household contracting). Made public: 1996. See [[cal.1966-05-04.china-leadership]]. Names: Liu Shaoqi, Mao Zedong.'
