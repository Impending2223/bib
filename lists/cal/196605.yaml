    thread: china-may-sixteenth
    also: [china-propaganda]
    c: 'Peking University 北京大学. Several teachers of the philosophy department, after many talks, find that the report of Song Shuo 宋硕, deputy head of the Peking committee''s university department, lately conveyed by Lu Ping 陆平 and Peng Peiyun 彭佩云 (in truth the North China Bureau''s 华北局 instruction: the schools'' Party organs to lead, stand to their posts, keep discipline), suppresses the movement, and decide to write a poster, starting from Song''s report, against Lu and Peng. Nie Yuanzi 聂元梓, secretary of the department''s general branch, joins their talks and agrees.'
    n: '[[w.pu-weihua-zalan-jiu-shijie]], 127. Made public: 2001 (Yin Hongbiao). To check: Yin Hongbiao 印紅標, 〈全國「第一張馬列主義大字報」是怎樣出籠的〉, in [[w.zhongguo-gongchandang-zhongda-shishi]], IV, 1949–1956 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 127 n.70). See [[cal.1966-05-14.china-leadership-3]]. Names: Song Shuo, Lu Ping, Peng Peiyun, Nie Yuanzi.'
    src:
      c: dd16f783
      rows:
        - 'w.pu-weihua-zalan-jiu-shijie 127: all'
    tags: [polity:prc, vis:only:prc, name:lu-ping, name:nie-yuanzi, name:peng-peiyun, name:song-shuo]
