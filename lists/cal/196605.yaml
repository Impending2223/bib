  - id: cal.1966-05-03.elections-1966
    when: May 3
    date: '1966-05-03'
    thread: elections-1966
    also: [voting-rights, alabama, governors]
    c: Alabama's Democratic primary, the first since the Voting Rights Act. Lurleen Wallace, standing for her husband, barred from a second term, wins outright over Attorney General Richmond Flowers, 480,841 to 172,386, 54.1 percent; Carl Elliott, Patterson and Folsom behind. In Dallas County, Ala., Sheriff Clark loses the nomination to Wilson Baker, public safety director of Selma, Ala. (Check). In Lowndes County, Ala., the Lowndes County Freedom Organization, its emblem a black panther, holds its own nominating meeting (Check).
    n: 'Votes: Wikipedia, "1966 Alabama gubernatorial election"; [Ala. *Official and Statistical Register*, 1967, 557–559](https://archive.org/details/alabama-official-statistical-register-1967/page/n558). The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). [[w.branch-at-canaans-edge]], 462–65 (Doar with five hundred observers in Dallas County, turnout over 17,000; King: "white Alabamians are desperately grasping for a way to return to the old days"; Carmichael: "Nonviolence is irrelevant"; Baker''s margin held after weeks over six precincts'' boxes). To check: [[w.carter-politics-of-rage-1995]]; [[w.jeffries-bloody-lowndes]]; John Doar, "The Work of the Civil Rights Division in Enforcing Voting Rights," speech at the U.S. Department ofJustice, ca. 1989, courtesy of John Doar (cited by [[w.branch-at-canaans-edge]], 462); Montgomery Advertiser, May 4, 1966, pole (cited by [[w.branch-at-canaans-edge]], 464); New York Times, May 5, 1966, p. 35 (cited by [[w.branch-at-canaans-edge]], 464); Jet, May 19, 1966, pp. 14–17 (cited by [[w.branch-at-canaans-edge]], 464); New York Times, May 5, 1966, p. 46 (cited by [[w.branch-at-canaans-edge]], 464); Carmichael interview for The Militant by John Benson, May 3, 1966, reprinted in The Black Panther Party, a Merit Publishers pamphlet, June 1966, pp. 24–29 (cited by [[w.branch-at-canaans-edge]], 464); Montgomery Advertiser, May 6, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 465); Jet, May 26, 1966, p. 8 (cited by [[w.branch-at-canaans-edge]], 465); John Doar, "The Work of the Civil Rights Division in Enforcing Voting Rights," speech at the U.S. Department of Justice, ca. 1989, courtesy of John Doar. In his remarks, Doar described the end of the contested vote count as follows: "The result in the six boxes: Baker, 1,412, Clark, 92, enough votes to determine the result of the election. However the Dallas County Democratic Executive Committee immediately rejected all the votes in the six boxes. This was done by a majority of the forty men on the self-perpetuating, lily-white Democratic Executive Committee. The [Civil Rights] Division was determined that the black citizens of Dallas County not be disillusioned with their first experience in actual participation in a local election. ... From that time until the federal court decided the contest twenty days later, federal observers guarded the boxes." (cited by [[w.branch-at-canaans-edge]], 465). Names: George Wallace, Patterson, Lurleen Wallace, Richmond Flowers, James Clark, Folsom, Wilson Baker, Elliott.'
    src:
      c: 789531b8
      rows:
        - 'https://archive.org/details/alabama-official-statistical-register-1967/page/n558: all'
        - 'https://archive.org/details/federalstatecons01thor/page/197/mode/1up: all'
        - 'w.branch-at-canaans-edge 462–65: A-B, D, F'
        - 'via x.1989.john-doar-the-work-of-the: A-B, D, F'
        - 'via x.1966-05-04.montgomery-advertiser-may-4-1966-pole: A-B, D, F'
        - 'via x.1966-05-05.new-york-times-may-5-1966: A-B, D, F'
        - 'via x.1966-05-19.jet-may-19-1966-pp-14: A-B, D, F'
        - 'via x.1966-05-05.new-york-times-may-5-1966-2: A-B, D, F'
        - 'via x.1966-05-03.carmichael-interview-for-the-militant-by: A-B, D, F'
        - 'via x.1966-05-06.montgomery-advertiser-may-6-1966-p: A-B, D, F'
        - 'via x.1966-05-26.jet-may-26-1966-p-8: A-B, D, F'
        - 'via x.1989.john-doar-the-work-of-the-2: A-B, D, F'
    tags: [name:wallace-george-c, name:elliott-carl-a, name:patterson-john, name:clark-james-g-jr, name:wallace-lurleen-b, name:flowers-richmond-m, name:folsom-james-e, name:baker-wilson, state:al]
    short: Lurleen Wallace nominated
  - id: cal.1966-05-03.governors-fl
    when: May 3
    date: '1966-05-03'
