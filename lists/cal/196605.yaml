    n: '[[w.zedong-mao-zedong-nianpu]], V, May 4, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 29–30 (May 4–26, 1966; Zhou attends from the 16th; the Circular of May 16 and Lin Biao''s speech of May 18); [[w.macfarquhar-maos-last-revolution]], 36–37 (close to eighty present); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637–638 (May 4–26, 1966; Liu presides at the enlarged Politburo meeting; before it Mao, in turn, had criticized the errors of Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun and drawn up the Central Committee''s notice meant to launch the Cultural Revolution, later called the "May 16 Notification"; during the meeting Mao is not in Peking, and Kang Sheng reports to him; by Mao''s view the meeting stops and revokes the posts of Peng, Luo, Lu and Yang and adopts the Notification, which announces the withdrawal of the February Outline and of the former Cultural Revolution Group of Five); [[w.macfarquhar-origins-of-the-cultural]], III, 458–59 (eighty present, all working in the capital; Mao in Hangzhou; Liu Shaoqi presides); [[w.deng-xiaoping-nianpu-1904]], III, 1912–1913 (May 4–26, 1966; the Politburo''s enlarged meeting is held at Peking, Liu Shaoqi presiding, following Mao''s plan made at the Hangzhou meeting of April; Kang Sheng, Chen Boda, Zhang Chunqiao 张春桥 and others first ''introduce the situation'' and expose and criticize the ''errors'' of Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; on the 16th it adopts the Notice of the Central Committee, revised by Mao, later called the ''May 16 Notice''; the nianpu: Deng and Zhou, accompanying foreign guests on tours outside Peking, did not attend the meeting''s early sessions); [[w.mao-zedong-zhuan]], VI, ch. 74 (May 4–26 at Peking the Politburo meets in enlarged session under Liu Shaoqi to criticize Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; on May 23 it stops their posts in the Secretariat and removes Peng and Lu from the others). [[w.yang-jisheng-tiandi-fanfu]], I, 158 (May 4–26, 23 days, in Peking; 76 attend: the Politburo''s members and alternates, department heads, and the document-drafting group''s eight, Zhang Chunqiao 張春橋, Guan Feng 關鋒, Qi Benyu 戚本禹 and others; Liu presides, Mao, far away, does not attend; Liu, Zhou and Ye Jianying take turns in the chair); [[w.peng-zhen-nianpu-1902]], IV, 484 (May 4–26, 1966; the enlarged Politburo at Peking under Liu Shaoqi, Mao at Hangzhou, Kang Sheng reporting to him; in a very abnormal air it criticizes Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; the first plenary session under Liu on the afternoon of the 11th); [[w.jian-zhou-enlai]], 540 (enlarged Politburo meetings chaired by Liu; Mao absent but in control); [[w.teiwes-tragedy-of-lin-biao]], 61 (by May 6 Peng Zhen''s and Lu Dingyi''s opposition to the revolutionary line in culture exposed, and Peng, Lu, Luo Ruiqing and Yang Shangkun labelled anti-Party, anti-socialist, anti-Mao Zedong Thought; in its early stages Kang Sheng, Zhang Chunqiao and Chen Boda convey Mao''s opinions); [[w.chen-yi-nianpu]], 1147 (May 4–26, 1966; Chen Yi at the enlarged meeting of the Politburo at Peking, which on May 16 adopts the Central Committee''s Notice (the May 16 Notice 《五·一六通知》)); [[w.pu-weihua-zalan-jiu-shijie]], 74 (May 4 to 26, Peking; Mao away, the meeting run on the Hangzhou meeting''s plan and his directions on its agenda and papers; to give the Cultural Revolution legal standing; Liu Shaoqi presiding, Kang Sheng reporting to Mao; Politburo members and alternates, heads of departments and the drafting group, the regional and provincial heads hardly any; the first three days a briefing forum, chiefly Kang Sheng, Zhang Chunqiao and Chen Boda); [[w.liu-jixian-ye-jianying-nianpu]], II, 937 (May 4–26, 1966; Ye Jianying 叶剑英 at the enlarged Politburo in Peking 北京); [[w.chen-yun-nianpu-xiuding]], III, 152–153 (May 4–26, Liu Shaoqi presiding: Kang Sheng relays Mao''s views on criticizing Peng Zhen and Lu Dingyi and dissolving the Propaganda Department and the Peking committee; Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun wrongly denounced; the Standing Committee sets up a special committee on their "anti-Party clique"; Zhu De criticized for doubting that Mao''s thought is the summit of Marxism-Leninism; on the last day Liu Shaoqi criticizes himself; the meeting marks the Cultural Revolution''s launch; Chen Yun absent, ill); [[w.zhu-de-nianpu-xinbian]], III, 1952–1953 (May 4–26, 1966; Zhu De 朱德 at the enlarged Politburo meeting 中共中央政治局扩大会议 in Peking 北京, which wrongly criticizes the so-called "anti-Party group of Peng Zhen 彭真, Luo Ruiqing 罗瑞卿, Lu Dingyi 陆定一 and Yang Shangkun 杨尚昆"; on Mao Zedong''s 毛泽东 advice it suspends Peng Zhen, Luo Ruiqing and Lu Dingyi as secretaries of the Secretariat 中共中央书记处, removes Peng Zhen as first secretary of the Peking committee and mayor and Lu Dingyi as head of the Propaganda Department 中宣部, suspends Yang Shangkun as alternate secretary, dissolves the Five-Man Group 文化革命五人小组 and sets up the Cultural Revolution Group 文化革命小组 (later the Central Cultural Revolution Group 中央文革小组) under the Politburo Standing Committee 中央政治局常委); [[w.peng-dehuai-nianpu]], 795 (May 4–26, 1966: the enlarged Politburo meeting at Peking 北京; its explanation of the decision of the enlarged meeting, May 24, touching Peng Dehuai 彭德怀: the "Peng Dehuai anti-Party clique" exposed and criticized early in 1960); [[w.yang-jisheng-tiandi-fanfu]], I, 159; [[w.chen-yi-nianpu]], 1147; [[w.zhou-enlai-nianpu-1949-2020]], III, 30. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). To check: the Politburo meeting''s minutes and reports of May 4–26, 1966 (not printed in the nianpu); note 29 gives the rehabilitations (Peng, Feb. 17, 1979; Luo, May 20, 1980; Lu, June 8, 1979; Yang, Oct. 23, 1980); [[w.wenhua-dageming-yanjiu-ziliao]], I, 25 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.18); [[w.yonglie-chen-boda-qiren]], 222–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 458 n.156a); [[w.qian-qiu-gong-zui]], 17–18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 458 n.156b); [[w.nianyi-da-dongluande-niandai]], 10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.157). Names: Liu Shaoqi, Mao Zedong, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun, Zhang Chunqiao, Zhou Enlai, Ye Jianying, Kang Sheng, Chen Boda, Zhu De, Deng Xiaoping, Chen Yun, Guan Feng, Qi Benyu, Chen Yi.'
