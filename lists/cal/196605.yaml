  - id: cal.1966-05-21.china-leadership-2
    when: May 21
    date: '1966-05-21'
    place: peking
    thread: china-may-sixteenth
    also: [china-zhou-cr]
    c: 'Zhou Enlai at the enlarged Politburo meeting, on three questions: preventing a counter-revolutionary coup;{1} leaders and masses;{2} keeping one''s integrity in later years.{3} Zhou: Yang Shangkun cannot compare with the other three, cannot make weather of his own, only "held on to legs," Liu''s and Deng''s; Lu Dingyi found through the "husband-and-wife shop," his wife writing anonymous letters for six years; the "Four Families" have taken many positions, and uncovering them is a victory of the "bamboo-shoot-stripping policy." Lin Biao interjects: either they strip us or we strip them.{4} On keeping integrity in later years he makes loyalty to Mao the test: disloyalty in later years "wipes out all at a stroke."{5} No verdict is final at the coffin or after cremation: Qu Qiubai a traitor, his "Superfluous Words"; Li Xiucheng a traitor; Qu to be moved out of Babaoshan and Li''s Loyal King''s palace at Suzhou pulled down.{6}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 21, 1966); [[w.macfarquhar-maos-last-revolution]], 37–38, 41 (Zhou''s remarks of May 21); [[w.macfarquhar-origins-of-the-cultural]], III, 459–60 (Zhou: the four took the capitalist road; their exposure a victory for Mao Zedong Thought); [[w.yang-jisheng-tiandi-fanfu]], I, 132, 149, 152 (the same speech, May 21: Yang Shangkun cannot compare with the three others, he cannot make a weather of his own and only held on to legs 抱了腿, namely Liu''s and Deng''s; Lu Dingyi was found in the husband-and-wife shop 夫妻老婆店, their common ground against putting politics first and against Mao Zedong Thought; his wife wrote anonymous letters six years, more of them when politics was put first; the "Four Families" 四大家族 have taken many positions, uncovering them is a victory of the "bamboo-shoot-stripping policy" 剝筍政策, to be celebrated; after the Gao Gang and Peng-Huang-Zhang-Zhou affairs this is the third; Lin Biao interjects: either they strip us or we strip them); [[w.yang-jisheng-tiandi-fanfu]], I, 159, 169 (Zhou treats loyalty to Mao as keeping one''s integrity in later years 晚節 ("integrity not kept is cancelled at a stroke"); on coups Zhou takes up Lin''s point of sixty-one coups in Asia, Africa and Latin America and names three preventions: revisionism in power, a revisionist coup, a revisionist military coup; revisionism''s coup rests on pen and gun, which Peng, Luo, Lu and Yang took one by one); [[w.yang-jisheng-tiandi-fanfu]], II, 695, 697 (on keeping one''s integrity in later years: Qu Qiubai a traitor, Li Xiucheng a traitor; he proposes moving Qu out of Babaoshan and destroying Li''s palace at Suzhou); [[w.jian-zhou-enlai]], 541–542 (Zhou endorses Lin on preventing a "reactionary coup d''état"; "revisionism will come into being on both the central and local levels," not to be let "take over our control of power"; on "keeping one''s political integrity in his senior years": "We must follow Chairman Mao. Chairman Mao is our leader today, and he will remain our leader one hundred years later"; one disloyal in later years undoes all past merit, "Even after one''s coffin is sealed ... one will still be doomed"); [[w.pu-weihua-zalan-jiu-shijie]], 60 n.79 (Zhou Enlai, as Bu quotes him: the Outline of Feb. 7, Mao caught it within five days; asked of the localities at last year''s work conference whether they would rebel if revisionism appeared at the Center; the "four great families" have taken many of our positions; the passage not in the *Wenku*''s text of the speech, from another version circulated in the Cultural Revolution); [[w.pu-weihua-zalan-jiu-shijie]], 85 (Zhou Enlai: fully agrees with Lin Biao''s speech; revisionism bound to rise, at the Center and in the localities; Peng, Luo, Lu and Yang took our positions one by one, the pen and the gun; to prevent revisionists in power, their subversion and their military coup); [[w.yang-jisheng-tiandi-fanfu]], I, 132, 149, 152; [[w.yang-jisheng-tiandi-fanfu]], I, 159; [[w.yang-jisheng-tiandi-fanfu]], II, 695, 697. Made public: [[w.schoenhals-ccp-central-case-examination]], 5–6 (1995). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 21 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966, in [[w.ziliao-xuanbian]], 10–11 (a Red Guard compilation of central leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 41 n.40); Zhou Enlai, speech of May 21, 1966, in [[w.gaoju-mao-zedong-sixiang]], 19–23 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163b). Check: MacFarquhar (37–38, 41) has Zhou call the four purged the "four big families" and their removal a time bomb removed, and say the movement will target the center, the inside of the Party and the higher levels. To check: [[w.gaoju-mao-zedong-sixiang]], 21 (cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966, in [[w.ziliao-xuanbian]], 10–11 (cited by [[w.macfarquhar-maos-last-revolution]], 41 n.40); [[w.schoenhals-ccp-central-case-examination]], 5–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163a); Zhou Enlai, speech of May 21, 1966, in [[w.gaoju-mao-zedong-sixiang]], 19–23 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163b); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 149 n.51); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 159 n.4); Zhou''s speech at a Politburo enlarged meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 542 n.90); Zhou Enlai 周恩來, speech at the enlarged Politburo meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] and another version circulated in the Cultural Revolution (cited by [[w.pu-weihua-zalan-jiu-shijie]], 60 n.79); Zhou Enlai 周恩來, speech at the enlarged Politburo meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (2002) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 85 n.12). Names: Zhou Enlai, Yang Shangkun, Lu Dingyi, Lin Biao, Qu Qiubai, Mao Zedong.'
