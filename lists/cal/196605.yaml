  - id: cal.1966-05-01.vietnam-air-war
    when: May 1
    date: '1966-05-01'
    thread: vietnam-air-war
    c: 'Gate Guard begins in route package 1, an "integrated interdiction" on Tiger Hound''s pattern: O-1 forward air controllers, ABCCCs and flare ships; "gates" by day, trucks by night. Ended for losses and bypassed gates; Tally Ho succeeds it July 20.'
    n: '[[w.staaveren-gradual-failure]], 253–54. See [[cal.1966-04-01.vietnam-air-war]].'
    src:
      c: c8031287
      rows:
