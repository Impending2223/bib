    also: [china-luo-ruiqing, china-liu]
    c: 'Peking. The Hebei Hall 河北廳 of the Great Hall of the People. Liu Shaoqi 劉少奇 presides; Zhu De 朱德 makes his self-criticism: twice before, after the Gao Gang affair and after Peng Dehuai''s 彭德懷, then of Jinggangshan in the 1920s and the Fourth Red Army''s seventh congress. Zhang Dingcheng 張鼎丞, Lin Biao 林彪, Chen Yi 陳毅 and Zhou Enlai 周恩來 speak in turn. Lin: at the Shanghai meeting after Luo Ruiqing''s 羅瑞卿 case Zhu said that "peak" could not be said of Mao Zedong Thought. Chen Yi, at length: are you out to stage a coup, to have the yellow robe put on you? Zhu: he has neither the strength nor the nerve; he is eighty and must be helped up a slope. Bo Yibo 薄一波: he is always speaking of orchids, the ones out of favor grow them. Zhou: Zhu''s part against Zhang Guotao came from others'' push; he is unreliable, a time bomb in the Standing Committee, to be asked to write out what he says.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 172–173; [[w.pu-weihua-zalan-jiu-shijie]], 89–91 (Zhu De ordered to examine himself May 23, his opposing that Mao Zedong Thought is the peak of Marxism-Leninism among the charges; his two errors at Jinggangshan and the Fourth Red Army''s seventh congress; Chen Yi''s harsh criticism; Lin: Zhu ambitious, never a commander-in-chief a day; Chen Yi: a coup? Zhu: neither the strength nor the nerve, he is eighty; Zhou takes blame on himself, the Ningdu meeting, the Nanchang rising); [[w.zhu-de-nianpu-xinbian]], III, 1953 ("in the days after" May 12, 1966, the day not given; at the meeting Lin Biao 林彪, Kang Sheng 康生 and others attack Zhu De 朱德, making his objection to calling Mao Zedong Thought the summit of Marxism-Leninism into "using Marxism against Chairman Mao," and calling him "ambitious," "wanting the yellow robe put on him," "a time bomb in the Party"). Made public: 2016. To check: Qi Benyu 戚本禹, 〈回憶江青同志〉 (his account that Liu told the questioners that the "Khrushchev" of the Notice was Zhu De) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 172 n.37); the record of the enlarged Politburo''s criticism of Zhu De, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.pu-weihua-zalan-jiu-shijie]], 91 n.19). Names: Liu Shaoqi, Zhu De, Peng Dehuai, Lin Biao, Chen Yi, Zhou Enlai, Luo Ruiqing, Bo Yibo, Mao Zedong, Zhang Dingcheng, Zhang Guotao.'
