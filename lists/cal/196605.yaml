  - id: cal.1966-05-27.china-leadership
    when: May 27
    date: '1966-05-27'
    place: peking
    thread: china-zhou-foreign
    also: [testing, china-foreign, china-nuclear-diplomacy]
    c: Zhou Enlai receives a Chilean parliamentary delegation under the second vice-president of the Chamber (Xiboli Kalousi, 席博里·卡洛斯).{1} Small countries often do great things; China as a large one takes care to do no injustice nor meddle in others' affairs. China's tests are for defence and world peace; China will never use nuclear weapons first, and wants all banned and destroyed. The U.S.–Soviet non-proliferation treaty aims at China and at isolating it.{2} At home output has risen but is small beside need; keep the economy in proportion; big cities strain supply and traffic.{3}
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 32–33 (May 27, 1966); [[w.zhou-enlai-waijiao-huodong]], 495 (May 27, 1966; afternoon, Beijing Hall, Great Hall of the People; the book names the delegation''s head 席博里·卡洛斯; the nuclear-test and treaty remarks are in the book at the same place); [[w.zhonghua-renmin-gongheguo-waijiao]], 105 (May 27, 1966; the Chilean delegation under the Chamber''s second vice-president: small states do big things; China, a big state, watches not to do wrong or interfere). Made public: 1993. Names: Zhou Enlai.'
