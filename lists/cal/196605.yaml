    c: 'Hanoi. The first restricted meeting: Bodnăraş and Niculescu-Mizil with Phạm Văn Đồng, Nguyễn Duy Trinh and Lê Thanh Nghị. Đồng, having consulted several Political Bureau members, agrees to the Romanian proposal on condition that both the Soviet and the Chinese parties join, and asks for close exchange of information; Bodnăraş: the RCP stayed away from the March meeting and faults the Polish letter to Peking. Romania offers to equip a battalion, Ionita to settle it with Võ Nguyên Giáp after lunch.'
    n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. Note of First Restricted Meeting on 9 May 1966. Đồng: the adherence of both ''is necessary''. Bodnăraş on Zhou Enlai''s visit to Romania: agreed for mid-May, then proposed for May 24. See [[cal.1966-05-09.vietnam-hanoi]]. Names: Bodnăraş, Phạm Văn Đồng, Nguyễn Duy Trinh, Võ Nguyên Giáp, Lê Thanh Nghị. Check: the year the document was first printed or posted; the Archive page gives none.'
