    c: 'The 557th NSC, Lodge home for consultation.{1} Lodge: the Saigon government "almost paralyzed"; "evolution rather than stability." Rusk: a broad-based constituent assembly needed; to make Saigon act "we may have to go so far as to use the threat to get out of Vietnam."{2} Johnson: "We are committed and we will not be deterred."{3} No word to the press.{4}'
