  - id: cal.1966-05-16.china-leadership
    when: May 16
    date: '1966-05-16'
    place: peking
    thread: china-may-sixteenth
    also: [china-mao-cr]
    c: 'Peking.{1} The enlarged Politburo meeting adopts the Center''s notice (the May 16 Circular), drafted by Chen Boda and others, revised by Mao: it withdraws the Five-Man Group''s Outline, dissolves the group and its office and sets up a Cultural Revolution Group under the Standing Committee.{2} It is printed in the *Renmin ribao* May 17, 1967.{3} The morning''s plenary, Liu Shaoqi presiding;{4} Deng Xiaoping and Peng Zhen there.{5} Adopted unanimously.{6} Its passages added by Mao: representatives of the bourgeoisie in the Party, government, army and cultural circles, counter-revolutionary revisionists, will seize power when the time is ripe;{7} "people like Khrushchev" still sleeping beside us.{8} By Qi Benyu''s account, Liu asks first the Politburo members to vote, none against, then those sitting at the back to show their attitude; they too raise their hands, not to be counted.{9}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 4–26, 1966 (the entry "5月4日—26日") and note 25. [[w.macfarquhar-maos-last-revolution]], 39–40 (Zhongfa [1966] 267; approved by show of hands); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 637–638 (May 1966; the chronology gives the Notification as adopted by the meeting, many of its important passages added by Mao: to hold high the banner of the proletarian cultural revolution, expose the "academic authorities," seize the leadership of those fields, and criticize the bourgeois representatives who have sneaked into the Party, government, army and cultural circles, whom it calls counter-revolutionary revisionists who will seize power when the time is ripe, some seen through, some not, some trusted and groomed as successors, "like Khrushchev"); [[w.deng-xiaoping-nianpu-1904]], III, 1914 (May 16, 1966; morning, 上午; Deng at the plenary of the Politburo''s enlarged meeting Liu Shaoqi presides over, which hears the groups'' discussion and revision of the draft ''Notice of the Central Committee''; the meeting adopts it that day); [[w.mao-zedong-zhuan]], VI, ch. 74 n.37 (the enlarged Politburo meeting adopts the Circular as revised many times by Mao; it withdraws the outline, dissolves the group of five and its office, and sets up a cultural revolution group under the Standing Committee; Mao''s two added passages, on the bourgeois representatives in the Party, government, army and cultural circles and on persons like Khrushchev ''sleeping by our side''). [[w.yang-jisheng-tiandi-fanfu]], I, 159–162 (the Politburo''s enlarged meeting adopts the Center''s Notice 〈通知〉 unanimously, Liu presiding; Qi Benyu sees the hands go up, Liu asks first the Politburo members and then those seated at the back to show their attitude, the latter not counted; the drafting group set up Apr. 16 by Jiang Qing''s list, Chen Boda head, Kang Sheng, Jiang Qing, Zhang Chunqiao, Wu Lengxi 吳冷西, Wang Li 王力, Yin Da 尹達, Chen Yading 陳亞丁, Guan Feng, Qi Benyu, Mu Xin 穆欣, in fact under Jiang Qing, Zhang secretary-general, at the rear building of the Jinjiang Hotel 錦江飯店; in March Mao at Hangzhou, hearing Kang Sheng and Zhao Yimin 趙毅敏 with Wei Wenbo 魏文伯 and Jiang Qing on the international movement, overturned the Center''s opinion on the CPSU''s 23rd Congress and abused the Outline; Wang Li''s one-sentence draft withdrawing the Outline refused by Mao; Mao''s mid-April remarks at Hangzhou, taken down by Wang Renzhong 王任重, are the Notice''s base; Mao adds long passages, and in the printed text his own are in bold; Chen Boda and Kang Sheng hold that not a word may be changed); [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (passed unanimously); [[w.peng-zhen-nianpu-1902]], IV, 485–486 (May 16, 1966, morning; the second plenary session under Liu Shaoqi; Peng Zhen there; the posts of Peng, Luo Ruiqing, Lu Dingyi and Yang Shangkun suspended and withdrawn; the notice proposed by the Secretariat in mid-April, drafted by Chen Boda''s group, worked over by Chen and Kang Sheng with Jiang Qing at Shanghai before the meeting, rewritten and added to by Mao: "representatives of the bourgeoisie" in Party, government, army and culture, "people like Khrushchev ... sleeping beside us" (the editors'' note: the 1981 resolution calls it, with the Ninth Congress report, the "programmatic document" of the Cultural Revolution)); [[w.jian-zhou-enlai]], 541 (the "May Sixteenth Notice," revised and edited by Mao; his paragraph: the representatives of the bourgeoisie who have sneaked into the Party, government, army and cultural circles, "a bunch of counterrevolutionary revisionists," will seize power when ripe; "People like Khrushchev are still nestling beside us"); [[w.teiwes-tragedy-of-lin-biao]], 61 (the circular approved, holding a passage Mao inserted on the danger of a coup); [[w.friedman-shadow-cold-war]], 153 (the circular, against the "moderation" of the movement so far, from which the "May 16th elements" take their name); [[w.dikotter-cultural-revolution]], 55 n.6 (the notice circulated within the Party: Peng Zhen made the capital a citadel of revisionism; representatives of the bourgeoisie in the Party, government, army and culture; "persons like Khrushchev ... still nestling beside us"); [[w.chang-friends-and-enemies]], 276 (the Cultural Revolution breaks out in May 1966; no day given); [[w.pu-weihua-zalan-jiu-shijie]], 79–80 (the morning of May 16, Liu Shaoqi presiding; revised seven times by Mao, its weighty passages in his hand; the Outline made "behind Kang Sheng"; the Five-Man Group and its office dissolved, a new Cultural Revolution Group under the Standing Committee; "persons like Khrushchev ... sleeping beside us" quoted); [[w.liu-jixian-ye-jianying-nianpu]], II, 937 (May 16, 1966; the meeting adopts the Central Committee''s Notice 《中国共产党中央委员会通知》: the Five-Man Group''s outline of Feb. 12 revoked, the Group and its office abolished, a new Cultural Revolution Group set up under the Standing Committee); [[w.chen-yun-nianpu-xiuding]], III, 152–153 (the notice drafted under Chen Boda and revised several times by Mao: the February Outline withdrawn, the Cultural Revolution Group set up anew under the Standing Committee; the leadership of scholarship, education, art and the press not in proletarian hands; bourgeois representatives in the Center and the provinces who would seize power, some trusted as our successors, "people like Khrushchev ... sleeping beside us"); [[w.zhu-de-nianpu-xinbian]], III, 1952 (May 16, 1966; the enlarged Politburo meeting 中共中央政治局扩大会议 adopts the Central Committee''s Notice 《中国共产党中央委员会通知》 (the "May 16 Notice" 五一六通知)); [[w.peng-dehuai-nianpu]], 795 (May 16, 1966: the meeting adopts the Center''s notice 《通知》, the "May 16 Notice" 五一六通知: the February Outline 二月提纲 does not mention the gravity of the struggle; they forbade touching the crux in criticizing Wu Han 吴晗, the dismissal of the Right opportunists at Lushan 庐山 in 1959); [[w.pu-weihua-zalan-jiu-shijie]], 229 (the passage "no construction without destruction ... put destruction first, and construction is in it" 破字当头,立也就在其中了, written by Mao when revising the Notice, later the ground of the "great criticism" and the four olds); [[w.yang-jisheng-tiandi-fanfu]], I, 162. Made public: May 17, 1967 (*Renmin ribao*). Check: MacFarquhar (40) has the Notification put to the vote and approved unanimously by a show of hands, Liu Shaoqi announcing that all present could vote. To check: *Zhongguo gongchandang zhongyang weiyuanhui tongzhi* (中国共产党中央委员会通知), May 16, 1966; [[w.huishou-wenge-2-vols]], II, 611 (cited by [[w.macfarquhar-maos-last-revolution]], 40 n.37); Central Committee of the CCP 中共中央, Circular 《中国共产党中央委员会通知》 (the "May 16 Circular" 「五一六通知」), May 16, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.37); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 214 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 160 n.6); Li Xuefeng 李雪峰, 〈我所知道的文革發動內情〉, in Zhang Hua et al., eds., *Huishou wenge* 《回首「文革」》 (Zhonggong dangshi chubanshe 中共黨史出版社), 595 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 160 n.7a); Chen Xiaonong 陳曉農, *Chen Boda zuihou koushu huiyi* 《陳伯達最后口述回憶》 (Dongfang chubanshe 東方出版社, 2010), 286–287 (the note prints the author as 程曉農 and the title as 《曾撥打最后口述會議》) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 160 n.7b); Yu Ruxin 余汝信, *Yu Qi Benyu mianduimian* 《與戚本禹面對面》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 162 n.9); CCP CC Notice, May 16, 1966, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 1–4 (cited by [[w.jian-zhou-enlai]], 541 n.88); [[w.nianyi-da-dongluande-niandai]], 9–16 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8a); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 267–268 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8b); [[w.ye-yonglie-chen-boda]], 261 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.8c); [[w.wenhua-dageming-yanjiu-ziliao]], I, 1–4 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 80 n.4). Names: Chen Boda, Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Qi Benyu.'
