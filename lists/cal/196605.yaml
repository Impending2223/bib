  - id: cal.1966-05-05.china-leadership
    when: May 5
    date: '1966-05-05'
    place: shanghai
    thread: china-mao-foreign
    also: [china-foreign, comecon]
    follows:
      - cal.1966-05-05.china-leadership-2
      - cal.1966-05-05.china-leadership-6
    c: 'Shanghai.{1} Mao receives the Albanian party and government delegation under Mehmet Shehu, and dines with it, Zhou Enlai, Lin Biao, Deng Xiaoping and Wu Xiuquan present.{2} He speaks of his death and of revisionism: Marx''s and Engels''s party was taken from them by their heirs, the USSR''s by Khrushchev; for China two possibilities, revisionism taking Peking, or a part of the leadership splitting. "We are at dusk," so he means to clear out bourgeois restoration while he has breath.{3} By Pu Weihua''s account Mao speaks too of the "peeling of bamboo shoots": from 1921 to 1966, forty-five years, scores of Central Committee members cast out, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Zhang Wentian, Gao Gang, Rao Shushi, Peng Dehuai, Luo Ruiqing, Peng Zhen and others, and some still beside us not found out.{4}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 5, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 30 (May 5, 1966; Zhou with Shehu at Mao''s reception that afternoon); [[w.zhonghua-renmin-gongheguo-waijiao]], 99 (Apr. 26–May 11, 1966; Shehu''s visit, Apr. 26–May 11; Mao receives the delegation; Liu and Zhou talks, complete agreement); [[w.macfarquhar-origins-of-the-cultural]], III, 461 (his one public appearance between November and July, a photograph with a visiting Albanian leader in May); [[w.deng-xiaoping-nianpu-1904]], III, 1913 (May 5, 1966; afternoon, 下午; Deng with Zhou Enlai and Lin Biao accompanies Mao in meeting Shehu''s party; Mao stresses opposition to revisionism and prevention of a capitalist restoration; he introduces Deng to the guests as one who understands military affairs: ''you see how small he is, but it was he who commanded the taking of Nanjing'', two field armies, nearly a million troops; then Shanghai, Zhejiang, Hangzhou, Jiangxi, Fujian, and the Second Field Army westward to Sichuan, Yunnan, Guizhou, nearly a hundred million people); [[w.mao-zedong-zhuan]], VI, ch. 74 n.38 (Mao''s talk with the Albanian party and government delegation under Shehu, no place given: he may be called by Marx before long; Marx''s and Engels''s heirs took their party from them, as Khrushchev took Lenin''s; for China two possibilities, the first that revisionism takes Peking, the second a part divides; ''we are at dusk'', so he would put the bourgeois restoration right while he still has breath). [[w.pu-weihua-zalan-jiu-shijie]], 72 n.91 (the "peeling of bamboo shoots": two possibilities, a counter-revolutionary dictatorship and restoration, or peeling layer by layer, the bad cut away; from 1921 to 1966, forty-six years, scores of Central Committee members cast out, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Zhang Wentian, Gao Gang, Rao Shushi, Peng Dehuai, Luo Ruiqing, Peng Zhen and others, and some still beside us not found out); [[w.pu-weihua-zalan-jiu-shijie]], 73–74 (Mao''s words quoted: Marx and Engels did not foresee their party taken by their heirs, nor Lenin Khrushchev; who knows the day revisionism takes Peking, those who back us now may turn; a second possibility, a partial split; "we are at dusk", so while he has breath he will deal with bourgeois restoration); [[w.pu-weihua-zalan-jiu-shijie]], 72 n.91. Made public: 2002. To check: Mao Zedong 毛泽东, talk with the Albanian party and government delegation 阿尔巴尼亚党政代表团 under Mehmet Shehu 谢胡 (record 谈话记录), May 5, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.38); Mao Zedong 毛泽东, talk with the Albanian party and government delegation under Mehmet Shehu, May 5, 1966 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 72 n.91); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1410 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 74 n.1). After [[cal.1966-05-05.china-leadership-2|the delegation''s flight to Shanghai with Zhou]], at noon ([[w.zhou-enlai-waijiao-huodong]], 493), and [[cal.1966-05-05.china-leadership-6|Deng''s journey there from Peking]]: the reception is in the afternoon, Zhou and Deng present (the Zhou and Deng nianpu, above). Names: Mao Zedong, Mehmet Shehu, Zhou Enlai, Lin Biao, Deng Xiaoping, Wu Xiuquan, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Zhang Wentian, Peng Dehuai, Luo Ruiqing, Peng Zhen. Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
