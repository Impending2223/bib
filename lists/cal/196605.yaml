    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 15, 1966); [[w.yang-jisheng-tiandi-fanfu]], I, 170 (May 15, on Mao''s instruction to defend the capital 保衛首都, Zhou Enlai and Ye Jianying together submit a report to Mao and the Standing Committee proposing a Capital Work Group 首都工作組, Ye Jianying head, Yang Chengwu and Xie Fuzhi 謝富治 deputy heads, answering to the Standing Committee and so to Zhou, its powers independent of the old organs; the members and the weight of troops not given); [[w.jian-zhou-enlai]], 540–541 (May 15, Zhou reports to Mao the Capital Work Group under Marshal Ye Jianying, for "security in the capital area"); [[w.liu-jixian-ye-jianying-nianpu]], II, 937 (May 15, 1966; Ye Jianying 叶剑英 and Zhou Enlai 周恩来 report jointly to Mao and the Standing Committee on the guard of the capital: a Capital Work Group 首都工作组, Ye its head, Yang Chengwu 杨成武 and Xie Fuzhi 谢富治 deputies, with Liu Zhijian 刘志坚, Li Xuefeng 李雪峰, Wang Dongxing 汪东兴, Zhou Rongxin 周荣鑫, Zheng Weishan 郑维山, Fu Chongbi 傅崇碧, Wan Li 万里 and Su Qianyi 苏谦益, answering to the Standing Committee); [[w.pu-weihua-zalan-jiu-shijie]], 113–114 (May 15, on Mao''s instruction: the Capital Work Group, Ye Jianying (vice-chairman and secretary-general of the Military Commission) head, Yang Chengwu (acting chief of staff) and Xie Fuzhi (vice-premier, minister of public security) deputies, with Liu Zhijian, Li Xuefeng, Wang Dongxing, Zhou Rongxin, Zheng Weishan, Fu Chongbi, Wan Li and Su Qianyi, answering directly to the Standing Committee). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 31–32, as [[w.yang-jisheng-tiandi-fanfu]], I, 170 n.30 cites it). To check: [[w.zhou-enlai-nianpu-1949]], III, 31–32 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 170 n.30). Names: Zhou Enlai, Ye Jianying, Mao Zedong, Yang Chengwu, Xie Fuzhi, Liu Zhijian, Li Xuefeng, Wang Dongxing, Zhou Rongxin, Zheng Weishan, Fu Chongbi, Wan Li, Su Qianyi.'
