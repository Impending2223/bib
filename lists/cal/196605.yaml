    also: [china-army]
    c: 'Zhou Enlai consults Yang Chengwu and the Peking Military Region on moving troops to strengthen the guard of the capital, and reports in writing to Mao: the 189th Division of the 63rd Army, at Shijiazhuang, and the 193rd Division of the 65th Army, at Zhangjiakou, to come to Peking for garrison duty, Fu Chongbi garrison commander. When they arrive, the guard of the key offices in Peking and of the broadcast and propaganda organs is to be re-ordered. Mao reads it and writes: do as proposed.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 18, 1966); [[w.pu-weihua-zalan-jiu-shijie]], 114 (May 18: Zhou''s consultation with Yang Chengwu and the Peking Military Region and his written report; the 189th and 193rd divisions, Fu Chongbi commander; Mao, "do as proposed"; the *Zhou Enlai nianpu*, III, 31–32, by its note; the 193rd never came, the 24th Army''s 70th mechanized division instead). Made public: 1997 ([[w.zhou-enlai-nianpu-1949]], III, 31–32, cited by [[w.pu-weihua-zalan-jiu-shijie]], 114 n.46). To check: [[w.zhou-enlai-nianpu-1949]], III, 31–32 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 114 n.46). See [[cal.1966-05-18.china-leadership-2]]. Names: Zhou Enlai, Yang Chengwu, Mao Zedong, Fu Chongbi.'
    tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc, name:fu-chongbi, name:yang-chengwu]
