    also: [china-propaganda]
    c: 'At Kang Sheng''s and Cao Yiou''s prompting, seven of Peking University''s philosophy department under Nie Yuanzi put up a wall poster attacking the university''s Party committee and the Peking committee.{1} Zhou Enlai that night sends officials of the North China Bureau, the Foreign Affairs Office and the Ministry of Higher Education to rebuke Nie for going against the Center''s plans and to restate the rule keeping inside and outside apart.{2} The poster, "What are Song Shuo, Lu Ping and Peng Peiyun doing in the cultural revolution?", goes up at 2 p.m. on the east wall of the big dining hall; Song deputy head of the Peking committee''s university department, Lu the university''s Party secretary and president, Peng its deputy Party secretary. Among the seven Zhao Zhengyi and Yang Keming. It calls for wiping out "all ox-demons and snake-spirits, all Khrushchev-style counter-revolutionary revisionists."{3} Among those Zhou sends Zhang Yan, deputy director of the State Council''s Foreign Affairs Office. At midnight, on Chen Boda''s instructions, Li Xuefeng, Peking''s new first secretary, speaks at the university to 800 Party and League members: struggle in order.{4}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31–32 (May 25, 1966); [[w.macfarquhar-maos-last-revolution]], 55–57 (the poster; Zhang Yan sent; Li Xuefeng at the university at midnight); [[w.macfarquhar-origins-of-the-cultural]], III, 461 (Cao Yiou, Kang Sheng''s wife, persuades Peking University teachers to put up the poster); [[w.deng-xiaoping-nianpu-1904]], III, 1915 (May 25, 1966; the nianpu: at Kang Sheng''s and Cao Yiou''s 曹轶欧 (footnote 2: Kang''s wife, then director of the Central Committee''s theory group''s office) prompting, seven of Peking University''s philosophy department under Nie Yuanzi 聂元梓 post the big-character poster ''What are Song Shuo, Lu Ping and Peng Peiyun really doing in the cultural revolution?'' (footnote 3: Song, then deputy head of the Peking committee''s university department; Lu, Party secretary and president of the university; Peng, its deputy Party secretary), charging the university committee with deliberately opposing the movement, with the spear pointed at the Peking municipal committee); [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (backed by Mao); [[w.peng-zhen-nianpu-1902]], IV, 487 (May 25, 1966; Nie Yuanzi 聂元梓, Party secretary of Peking University''s philosophy department, and six others, at Kang Sheng''s prompting, put up "What are Song Shuo, Lu Ping and Peng Peiyun doing in the cultural revolution?", charging the university''s committee and the Peking committee with revisionism; Kang sends the draft to Mao at Hangzhou); [[w.dikotter-cultural-revolution]], 57 n.12 (Nie, nudged by Kang Sheng, who sent his wife to the campus, puts up her poster: the university under the bourgeoisie, its leaders "a bunch of Khrushchev-type revisionist elements"; thousands of posters the next day); [[w.pu-weihua-zalan-jiu-shijie]], 125–126 (May 25, 2 p.m., on the east wall of the big dining hall: the poster "What are Song Shuo, Lu Ping and Peng Peiyun doing in the Cultural Revolution?", signed by Nie Yuanzi and six others of the philosophy department; Nie of the university''s Party committee and secretary of the department''s general branch, Zhao Zhengyi its deputy secretary, the five others Party members and teachers, Yang Keming lately moved to the Academy of Sciences'' institute of electrical engineering; at odds with the university''s committee since the late Socialist Education movement); [[w.pu-weihua-zalan-jiu-shijie]], 129 (the day the poster goes up, Jiang Nanxiang 蒋南翔, Minister of Higher Education and secretary and president of Tsinghua University, Zhang Yan 张彦, deputy director of the State Council''s Foreign Affairs Office, and Li Xuefeng 李雪峰, first secretary of the North China Bureau, already chosen as first secretary of the new Peking committee, come one after another to the university and restate the Center''s line: posters to keep Party and state discipline, inside and outside apart, the movement under leadership; who sent them not given); [[w.pu-weihua-zalan-jiu-shijie]], 125–26; [[w.macfarquhar-maos-last-revolution]], 57. Made public: 1988 ([[w.nianyi-da-dongluande-niandai]]). Check: MacFarquhar (56) has the poster put up at 2 p.m. on the east wall of the main canteen; its third draft was done in the early hours and signed that morning. Check: interviews of 1994 with Nie Yuanzi and others throw doubt on Cao Yiou''s central part (III, 461 n.1). To check: [[w.xin-quanguo-di-yi-zhang]], 168 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.17); Nie Yuanzi, interview by Michael Schoenhals, Beijing, July 17, 1994 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.19); [[w.hongbiao-wengede-di-yi-zhang]], 37–45 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.20a); [[w.wenhua-dageming-yanjiu-ziliao]], I, 32–36 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.20b); [[w.zhongguo-gongchandang-zuzhishi-ziliao]], XV, 168 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.20c); "What Are Song Shuo, Lu Ping, and Peng Peiyun Up to in the Cultural Revolution?" (Beida big-character poster, May 25, 1966), in [[w.wenhua-dageming-yanjiu-ziliao]], I, 30–31 (cited by [[w.macfarquhar-maos-last-revolution]], 56 n.22); Nie Yuanzi, interview by Michael Schoenhals, Beijing, July 17, 1994 (cited by [[w.macfarquhar-maos-last-revolution]], 57 n.26); [[w.nianyi-da-dongluande-niandai]], 18 (cited by [[w.macfarquhar-maos-last-revolution]], 57 n.27a); [[w.wuchanjieji-wenhua-dageming-ziliao]], 667 (cited by [[w.macfarquhar-maos-last-revolution]], 57 n.27b); [[w.phathanothai-dragons-pearl]], 221 (cited by [[w.macfarquhar-maos-last-revolution]], 57 n.27c); Michael Schoenhals, interviews of 1994 with Nie Yuanzi and others (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 461 n.1b). Names: Zhou Enlai, Nie Yuanzi, Kang Sheng, Cao Yiou, Song Shuo, Lu Ping, Peng Peiyun, Yang Keming, Zhang Yan, Li Xuefeng, Chen Boda.'
