  - id: cal.1966-05-28.china-leadership-2
    when: May 28
    date: '1966-05-28'
    thread: china-zhou
    c: 'Zhou Enlai receives delegates to the Xingtai earthquake science conference: the richest in over a dozen years. Do not stop at phenomena; seismic stations and staff are far too few, and quality is needed as well as number; the State Science Commission and Nie Rongzhen to carry on, as oil has shone so earthquakes should; two "threes": leaders, experts and masses, and research with teaching and production. Analyze first-hand data, find contradictions, no cliques; dare to think, speak, act, argue and make revolution.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 33 (May 28, 1966). Made public: 2020. Names: Zhou Enlai, Nie Rongzhen.'
    tags: [name:zhou-enlai, name:nie-rongzhen, polity:prc, vis:only:prc]
