    c: 'Peking.{20} The enlarged Politburo meeting, Liu Shaoqi presiding;{21} Mao absent.{13} On the line of the Hangzhou meeting of April it criticizes Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun for errors and ends their posts.{14} 76 attend: the Politburo''s members and alternates, department heads and the drafting group, Zhang Chunqiao, Guan Feng and Qi Benyu among them;{15} Liu, Zhou Enlai and Ye Jianying take turns in the chair.{11} Kang Sheng, Chen Boda and Zhang Chunqiao open with three days'' briefing;{5} Kang reports to Mao.{16} Zhu De criticized for doubting that Mao''s thought is the summit of Marxism-Leninism.{17} On the last day Liu criticizes himself.{8} Zhou and Deng Xiaoping, with foreign guests outside Peking, miss the early sessions;{18} Chen Yun absent, ill.{19} Chen Yi attends.{22} Zhou Enlai attends from the 16th.{23}'
