  - id: cal.1966-05-29.china-leadership
    when: May 29
    date: '1966-05-29'
    place: peking
    thread: china-may-sixteenth
    also: [china-liu, china-zhou-cr, china-propaganda]
    c: 'Peking.{1} Liu Shaoqi, Zhou Enlai and Deng Xiaoping decide: Chen Boda to lead a temporary work group into the *Renmin ribao*, Zhang Chengxian one into Peking University.{2} Their letter of May 30 to Mao: "agreed."{3} Chen enters the *Renmin ribao* May 31 and reorganizes its leadership.{4} The work group is to hold the daily layout and direct Xinhua and the broadcast stations on foreign news, its members to enter May 31, with Wu Lengxi and the other deputy editors-in-chief keeping their posts for the time. Mao writes on the letter that night "agreed to this."{5} The work group''s members are Mu Xin, Qian Dixian, Shang Like, Zhu Yuepeng and Yang Ding, with Lu Ying and Shao Yihua from Shanghai later.{6}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 29, 1966; [[w.zhou-enlai-nianpu-1949-2020]], III, 34 (May 29, 1966; Zhou telephones Mao at Hangzhou for approval; May 30 letter, May 31 entry); [[w.macfarquhar-maos-last-revolution]], 64–65 (Zhou telephones Mao; the work team for Peking University); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638–639 (May 30, 1966; Liu, Zhou Enlai and Deng Xiaoping draft and send Mao a joint letter asking instructions: they are meeting that day and propose a temporary work group under Chen Boda''s direct leadership to enter the newspaper office (the *Renmin ribao*), to hold the daily layout and direct Xinhua and the broadcast stations on foreign news, its members to enter May 31, with Wu Lengxi and the other deputy editors-in-chief keeping their posts for the time; Mao writes on it that night "agreed to this"); [[w.jianguo-yilai-mao-zedong]], XVIII, 270 (May 30, 1966; Mao''s note "Agreed to do so," 11 p.m. May 30, on the letter of Liu Shaoqi, Zhou Enlai and Deng Xiaoping of that day (the paper''s standing fallen in two months; a temporary work group under Chen Boda to hold the daily layout and guide Xinhua''s and the radio''s foreign news, its men to enter May 31; the list of its members appended)); [[w.deng-xiaoping-nianpu-1904]], III, 1916 (May 29, 1966; Deng with Liu Shaoqi, Zhou Enlai and others at the ''head-bumping'' meeting (碰头会) that decides that Chen Boda lead a work team into the Renmin ribao and Zhang Chengxian 张承先 (footnote 3: then secretary of the Hebei Party committee''s Secretariat) one into Peking University; Zhou at once telephones the two proposals to Mao at Hangzhou, who agrees; on the 30th at 7 p.m. Deng with Liu and Zhou writes Mao on the arrangement and at 11 p.m. Mao approves; on the 31st Chen''s team enters the paper and reorganizes its leadership, on June 1 Zhang''s enters the university); [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (work groups to the *Renmin ribao* and Peking University); [[w.jian-zhou-enlai]], 545 ("Only a few days before" June 1 Zhou, Liu and Deng discuss Peking University and decide to send a work team to "direct the movement," Mao endorsing it); [[w.pu-weihua-zalan-jiu-shijie]], 150–151 (May 29, Liu Shaoqi, Zhou Enlai and Deng Xiaoping, meeting, decide to send Chen Boda, just named head of the Central Cultural Revolution Group, with a work group to the *Renmin ribao*, and Zhang Chengxian 张承先, former secretary of the Hebei committee''s Secretariat, then being moved to deputy minister of higher education (150 n.94), with one to Peking University; Zhou at once telephones Mao at Hangzhou and gets his consent; their joint letter of May 30, quoted: the paper''s standing fallen, a temporary work group under Chen Boda to hold the daily pages and guide Xinhua''s and the radio''s foreign news, entering May 31; the list of its members: Mu Xin 穆欣, Qian Dixian 钱抵千, Shang Like 尚力科, Zhu Yuepeng 朱悦鹏, Yang Ding 杨丁, with Lu Ying 鲁瑛 and Shao Yihua 邵以华 from Shanghai later; Mao writes on it "agree to do so"; Chen Boda and the others enter the paper that evening; the Wengao, XII, 61 (151 n.95)); [[w.zhu-de-nianpu-xinbian]], III, 1953 (May 31, 1966; with Mao Zedong''s 毛泽东 consent Chen Boda 陈伯达 leads a work team 工作组 to take over the *Renmin ribao* 《人民日报》); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638–639; [[w.pu-weihua-zalan-jiu-shijie]], 150. Made public: 1996. To check: [[w.zhou-enlai-nianpu-1949]], III, 34 (cited by [[w.macfarquhar-maos-last-revolution]], 64 n.66); [[w.zhou-enlai-nianpu-1949]], III, 34 (cited by [[w.macfarquhar-maos-last-revolution]], 64 n.67); [[w.zhou-enlai-nianpu-1949]], III, 34 (cited by [[w.macfarquhar-maos-last-revolution]], 65 n.70); Liu Shaoqi, Zhou Enlai and Deng Xiaoping, letter to Mao Zedong of May 30, 1966 proposing a temporary work group under Chen Boda for the Renmin ribao (with the list of its members in Peking) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 270 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 61 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 151 n.95). Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Chen Boda, Zhang Chengxian, Mao Zedong, Wu Lengxi, Mu Xin.'
