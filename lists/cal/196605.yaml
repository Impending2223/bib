    when: May 3
    date: '1966-05-03'
    thread: china-united-front
    c: 'Chen Yi, at the cocktail party of the National Committee of the CPPCC for visiting overseas Chinese, compatriots of Hong Kong and Macao and the peoples'' delegations: the whole country, with confidence, is building the homeland by self-reliance, and no force can stop it. The time when the Chinese could not hold up their heads before foreigners is gone for good. To Western opinion that China is "isolated" and its foreign policy has "failed": China''s policy is right, it has not failed, it has more friends each day; as foreign minister he has no sense of isolation.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 101 (May 3, 1966); [[w.chen-yi-nianpu]], 1147 (May 3, 1966, afternoon; the CPPCC''s cocktail party for more than 800 overseas Chinese and Hong Kong and Macao compatriots come for May Day and fifteen minority nationalities'' visiting groups; Chen Yi speaks in welcome; China''s foreign policy right; whether China is isolated is judged from the standpoint of the world''s peoples). Names: Chen Yi.'
