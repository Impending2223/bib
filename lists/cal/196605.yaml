    c: 'The Foreign Ministry spokesman''s statement on the open claim of Soviet Defense Minister Malinovsky, on Apr. 21, that China obstructs the transit of Soviet supplies for Vietnam. China, the statement says, has never done so: all the military supplies Vietnam asked for and the Soviet Union shipped were forwarded first, quickly and free; Malinovsky''s speech was ill-meant, to sow discord between China and Vietnam and wreck their peoples'' anti-U.S. unity.'
