  - id: cal.1966-05-18.china-leadership
    when: May 18
    date: '1966-05-18'
    place: peking
    thread: china-may-sixteenth
    also: [china-luo-ruiqing]
    c: 'Peking.{1} Lin Biao, at the enlarged Politburo meeting, makes a long speech on coups: they are now the fashion, they follow a dynasty''s founding after ten, twenty, fifty years;{2} a counter-revolutionary coup may come;{3} whoever opposes Mao, the whole Party and country to strike him down.{4} The Center circulates it Sept. 22.{5} Deng Xiaoping and Peng Zhen there.{6} Lin: Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun plotting a coup;{7} Mao has moved troops, the radio stations guarded;{8} Mao''s every sentence the truth, "one sentence worth ten thousand."{9} Zhou Enlai: "I entirely agree with comrade Lin''s words."{10} Lin: "the other comrades of the Standing Committee asked me to speak first," meaning Zhou Enlai, by Qi Benyu''s later account to Yu Ruxin.{11}'
    n: '[[w.zedong-mao-zedong-nianpu]], V, May 18, 1966; [[w.macfarquhar-maos-last-revolution]], 38–39 (Lin Biao''s speech to the plenary session); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (May 18, 1966; Lin Biao speaks at the meeting; the book says he praised Mao''s "personal genius" and spread rumors that some inside the Center want to seize power and overturn it, to create a climate of terror); [[w.macfarquhar-origins-of-the-cultural]], III, 459 (Lin Biao, in a plenary session, accuses Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun of plotting a coup); [[w.deng-xiaoping-nianpu-1904]], III, 1914 (May 18, 1966; morning, 上午; Deng at the Politburo''s enlarged meeting, at which Lin Biao makes a long speech chiefly on the question of coups); [[w.mao-zedong-zhuan]], VI, ch. 74 (Lin Biao''s speech at the meeting: a counterrevolutionary coup may come, men to be killed, power seized; whoever opposes Mao, the whole Party to destroy him and the whole country to attack him). [[w.yang-jisheng-tiandi-fanfu]], I, 152–153 (in the speech of May 18 Lin Biao fixes the nature of Peng, Lu, Luo and Yang; on coups he says Mao has moved troops and generals and the army and public-security systems have been put in place); [[w.yang-jisheng-tiandi-fanfu]], I, 159, 168 (Lin Biao: "a counter-revolutionary coup may happen"; the rule of dynasties losing power ten, twenty, thirty, fifty years after a founding; the Mao family; Qi Benyu tells Yu Ruxin that Zhou Enlai had Lin speak first, Lin saying "the other members of the Standing Committee asked me to speak first"); [[w.yang-jisheng-tiandi-fanfu]], I, 52–53 (Lin Biao''s words: Mao''s word "every sentence the truth, one sentence worth ten thousand"; whoever opposes him "the whole Party shall punish, the whole nation shall attack"); [[w.peng-zhen-nianpu-1902]], IV, 486 (May 18, 1966; Peng Zhen there; Lin Biao attacks Peng, Luo Ruiqing, Lu Dingyi and Yang Shangkun, speaks at length of palace coups, says some in the Center would make a coup; "every sentence of Chairman Mao''s is truth, one worth ten thousand of ours"); [[w.jian-zhou-enlai]], 541 (Lin on the danger of a "reactionary coup d''état"; "one word of Mao''s counts for ten thousand words of others"; "whoever opposes Mao will be put to death by the whole party and cursed by the whole country"); [[w.teiwes-tragedy-of-lin-biao]], 60–63 (the speech, with "the smell of gunpowder," on coups in Asia, Africa and Latin America and in Chinese dynasties, applied to Peng, Luo, Lu and Yang; Lin "ha[d] not thought much about this problem," but Mao, sleepless, had called in comrades on preventing coups and posted men at the radio stations, the army and public security; Lin not alone in drafting it: by the *Renmin ribao* of May 18, 1978, Zhang Chunqiao worked on the coup formula, which the authors doubt, 62 n.10; Mao approves its circulation within the Party); [[w.dikotter-cultural-revolution]], 50 n.20 (Lin reads out the accusation, prepared by Kang Sheng on Mao''s orders: "a bunch of bastards" who want to kill us; "Isn''t Chairman Mao a genius?"; Zhou: "I entirely agree with comrade Lin''s words"); [[w.pu-weihua-zalan-jiu-shijie]], 82–87 (the morning of May 18, the "coup classic": Mao these months watching against a counter-revolutionary coup, men and troops moved, radio stations guarded; Peng, Luo, Lu and Yang linked; Mao''s genius; whoever opposes him, the whole Party and country to strike him down; the Center forwards it Sept. 22, 1966, its notice quoted, 86–87); [[w.chen-yun-nianpu-xiuding]], III, 153 (Lin Biao''s long speech: Peng Zhen, Luo Ruiqing, Lu Dingyi and others plotted a coup and subversion; Mao''s genius; "whoever opposes him the whole Party will punish, the whole country attack"); [[w.zhu-de-nianpu-xinbian]], III, 1952 (May 18, 1966; Lin Biao 林彪 speaks at the meeting, pressing the cult of Mao Zedong''s person and, gathering cases ancient and modern, Chinese and foreign, making up the lie that some are plotting a coup); [[w.yang-jisheng-tiandi-fanfu]], I, 162 n.10. Made public: [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638 (1996). Circulated within the Party, Sept. 22, 1966. Check: Teiwes, 62 n.10, cites the *Renmin ribao* of May 18, 1978, that Zhang Chunqiao worked on the coup formula and gathered the speech''s material, and doubts it. To check: [[w.ziliao-xuanbian]], 4, 6 (cited by [[w.macfarquhar-maos-last-revolution]], 39 n.31a); [[w.chen-boda-yigao]], 93 (cited by [[w.macfarquhar-maos-last-revolution]], 39 n.31b); Lin Biao, speech on coups, May 18, 1966, in [[w.mao-zhuxide-qin-mi]], 116–32 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.159a); [[w.nianyi-da-dongluande-niandai]], 16–18 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.159b); Lin Biao, speech on coups to the enlarged Politburo meeting, Peking, May 18, 1966 (forwarded by the Center Sept. 22, 1966) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 152 n.t1); Lin Biao, speech on coups to the enlarged Politburo meeting, Peking, May 18, 1966 (forwarded by the Center Sept. 22, 1966) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 159 n.3); Yu Ruxin 余汝信, *Yu Qi Benyu mianduimian* 《與戚本禹面對面》 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 162 n.10); Lin Biao 林彪, 〈在中央政治局擴大會議上的講話〉, May 18, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 52 n.22); Lin''s speech at a Politburo enlarged meeting, May 18, 1966, in [[w.wenhua-dageming-yanjiu-ziliao]], I, 16–23 (cited by [[w.jian-zhou-enlai]], 541 n.89); [[w.kau-lin-piao-affair]], 328–333 (cited by [[w.teiwes-tragedy-of-lin-biao]], 61 n.9); Shen Tao-sheng, "The ''Gang of Four'' and Lin Piao," *Renmin ribao*, May 18, 1978, translated in FBIS, May 24, 1978, E3 (cited by [[w.teiwes-tragedy-of-lin-biao]], 62 n.10); [[w.kau-lin-piao-affair]], 328, 329, 332 (cited by [[w.teiwes-tragedy-of-lin-biao]], 62 n.11a); [[w.jin-1949-1989-niande-zhongguo]], 635 (cited by [[w.teiwes-tragedy-of-lin-biao]], 62 n.11b); [[w.kau-lin-piao-affair]], 328 (cited by [[w.teiwes-tragedy-of-lin-biao]], 62 n.12a); [[w.nianyi-da-dongluande-niandai]], 17 (cited by [[w.teiwes-tragedy-of-lin-biao]], 63 n.15); "Lin Biao zai Zhongyang zhengzhiju kuodahui de jianghua quanwen he Qiu Shike de pizhu" (Lin Biao''s speech at the enlarged Politburo meeting and Qiu Shike''s annotations), May 18, 1966 (cited by [[w.dikotter-cultural-revolution]], 50 n.20a); Qinghai bayiba geming zaofanpai lianhe weiyuanhui, ed., *Ziliao xuanbian: Zhongyang shouzhang jianghua zhuanji*, Dec. 5, 1967, as quoted in Song Yongyi, "Wenge Zhou Enlai: Yige bei yangaile de xingxiang," unpublished paper, Mar. 1999 (cited by [[w.dikotter-cultural-revolution]], 50 n.20b–c); [[w.wenhua-dageming-yanjiu-ziliao]], I, 22–23 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 85 n.11); [[w.wenhua-dageming-yanjiu-ziliao]], I, 125 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 87 n.15). Names: Lin Biao, Mao Zedong, Deng Xiaoping, Peng Zhen, Luo Ruiqing, Lu Dingyi, Zhou Enlai, Yang Shangkun. Check: [[w.kau-lin-piao-affair]] may print it earlier (1975).'
