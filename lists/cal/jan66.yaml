entries:
  - id: cal.1966-01-01.jobs-and-wages
    when: Jan. 1–13
    date: '1966-01-01'
    thread: jobs-and-wages
    also: [states-and-cities]
    c: 'New York. Lindsay sworn as mayor; the Transport Workers Union strikes the subways and buses the same morning. Quill, its president, defies an injunction under the Condon-Wadlin Act: "The judge can drop dead in his black robes." Jailed Jan. 4 with other leaders; moved to Bellevue, ill. Settled Jan. 13, on the mediators'' terms: some $60 million (Check).'
    n: 'Cannato, *The Ungovernable City* (Opp. II.C). Joshua B. Freeman, *In Transit: The Transport Workers Union in New York City, 1933–1966* (1989). See [[cal.1965-11-02.states-and-cities]]. Names: Lindsay (Opp. III.D); Quill (K–J Cong. III.K).'
    tags: [name:lindsay-john-v, name:quill-michael-j]
  - id: cal.1966-01-03.vietnam
    when: Jan. 3–5
    date: '1966-01-03'
    thread: vietnam
    c: 'The fourteen points, Rusk''s paper of Dec. 27, given to the press by Humphrey on his return and released by the State Department: the Geneva agreements of 1954 and 1962 "an adequate basis for peace"; a conference, or "unconditional discussions," welcome; Hanoi''s four points open to discussion; no American bases; no troops kept "after peace is assured"; the Viet Cong''s representation no "insurmountable problem"; the bombing could stop "as a step toward peace." Jan. 4, Goldberg''s letter to U Thant. Jan. 5, Humphrey reports his trip to the NSC.'
    n: 'FRUS 1964–68, III, doc. [247](https://history.state.gov/historicaldocuments/frus1964-68v03/d247); IV, docs. [2](https://history.state.gov/historicaldocuments/frus1964-68v04/d2), [3](https://history.state.gov/historicaldocuments/frus1964-68v04/d3), [7](https://history.state.gov/historicaldocuments/frus1964-68v04/d7). *American Foreign Policy: Current Documents, 1966*, pp. 740–746. See [[cal.1965-12-24.vietnam]]; [[cal.1965-12-28.vietnam]]. Names: Rusk (Viet. III.A); Humphrey (K–J Adm. III.D); Goldberg (K–J Adm. III.E); U Thant (K–J Adm. III.J).'
    tags: [name:rusk-dean, name:humphrey-hubert-h, name:goldberg-arthur-j, name:u-thant]
  - id: cal.1966-01-04.states-and-cities
    when: Jan. 4
    date: '1966-01-04'
    thread: states-and-cities
    c: Reagan announces for governor of California, on television. Check the date.
    n: 'Dallek, *The Right Moment* (Opp. II.E). Names: Reagan (Opp. III.H).'
    tags: [name:reagan-ronald]
  - id: cal.1966-01-06.students
    when: Jan. 6–10
    date: '1966-01-06'
    thread: students
    also: [vietnam, states-and-cities]
    c: 'SNCC against the war: the government "deceptive in its claims of concern for freedom of the Vietnamese people"; the murder of Samuel Younge at Tuskegee "no different than the murder of peasants in Viet Nam"; support for men "unwilling to respond to a military draft." Bond, its communications director, elected to the Georgia House in June, endorses it. Jan. 10, the House refuses him his seat, 184–12.'
    n: '*Bond v. Floyd*, [385 U.S. 116](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385116/usrep385116.pdf) (1966), which gives the statement and the vote (K–J Cong. II.J.1). Carson, *In Struggle* (K–J Cong. II.F). See [[cal.1965-11-27.students]]. Names: Bond (K–J Cong. III.K).'
    tags: [name:bond-julian]
  - id: cal.1966-01-10.india-and-china
    when: Jan. 10
    date: '1966-01-10'
    thread: india-and-china
    c: 'Tashkent. Shastri and Ayub Khan, Kosygin their host since Jan. 4, sign a declaration: forces back to the positions held before Aug. 5, 1965, by Feb. 25; relations restored. Shastri dies at Tashkent within hours. Johnson: "a grievous blow to the hopes of mankind for peace and progress."'
    n: '[Statement by the President on the Death of Prime Minister Shastri of India](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-prime-minister-shastri-india) (Jan. 10, 1966). FRUS 1964–68, XXV, docs. [275](https://history.state.gov/historicaldocuments/frus1964-68v25/d275), [279](https://history.state.gov/historicaldocuments/frus1964-68v25/d279). Check the declaration''s terms against its text. See [[cal.1965-12-14.india-and-china]]. Names: Kosygin (K–J Adm. III.J).'
    tags: [name:shastri-lal-bahadur, name:ayub-khan-mohammad, name:kosygin-aleksei, name:johnson-lyndon-b]
  - id: cal.1966-01-10.congress
    when: Jan. 10
    date: '1966-01-10'
    thread: congress
    c: '89th Congress, second session, meets. House: 385 answer the call; Clarence J. Brown Jr. and Rees sworn; Lindsay''s resignation, from Dec. 30, laid before it. Senate: Harry F. Byrd Jr. sworn in his father''s seat. A joint session set for Jan. 12, 9 p.m., for the State of the Union.'
    n: '[112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf); [112 Cong. Rec., Senate, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-1.pdf). See [[cal.1965-01-04.congress]]; [[cal.1965-11-02.specials]]; [[cal.1965-11-10.congress]]; [[cal.1965-12-15.specials]]. Names: Lindsay (Opp. III.D).'
    tags: [name:brown-clarence-j-jr, name:rees-thomas-m, name:lindsay-john-v, name:byrd-harry-f-jr]
