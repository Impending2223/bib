    also: [women]
    c: 'The White House, Lady Bird Johnson''s Women Doers'' Luncheon on crime in the streets. Eartha Kitt, a guest, to the President''s wife: the young rebel in the streets against the war and the draft (Check the words).'
    n: '[[w.johnson-white-house-diary]], Jan. 18, 1968. [[w.califano-triumph-and-tragedy-of]], 258 (some fifty guests in the family dining room; Kitt: "The best of this country rebel in the street . . . take pot . . . get high . . . don''t want to go to school because they''re going to . . . be snatched off from their mothers to be shot in Vietnam"; Mrs. Johnson: the war "doesn''t give us a free ticket not to try to work for better things"); [[w.kotz-judgment-days]], 383–84 (Lady Bird Johnson: "that still does not give us a free ticket not to try to work for better things"; King praises Kitt); [[w.bernstein-guns-or-butter]], 472 ("You are a mother, too"; Mrs. Johnson''s diary); [[w.debenedetti-american-ordeal]], 207 (three days after the Rankin Brigade; the FBI had cleared her); [[w.barrett-uncertain-warriors]], 119 (Kitt''s challenge to Mrs. Johnson at a meeting of prominent women on crime; no day); [[w.johnson-white-house-diary]], 620–24 (Jan. 18: the luncheon from "a quarter of one" to "about five minutes of four"; speakers Margaret Moore of Indianapolis, Martha Coe, a VISTA worker in Atlanta, and Katherine Peden of the Advisory Commission on Civil Disorders; Johnson comes in, calls for support of the police, says the place to start is the home; leaving, Kitt asks "what do you do about delinquent parents" and Johnson answers that the Social Security bill allots millions for day-care centers; Kitt on welfare "four dollars," taxes, and "Boys I know across the nation feel it doesn''t pay to be a good guy. They figure with a record they don''t have to go off to Vietnam"; "You are a mother, too ... No wonder the kids rebel and take pot," her finger pointed at Mrs. Johnson, as "the papers later reported"; Mrs. Hughes of New Jersey in defense of the war; Bennetta Washington; Mrs. Johnson''s reply, "Because there is a war on ... that still doesn''t give us a free ticket not to try to work for better things"; she finds she was pale, voice trembling slightly, no tears). Made public: the CIA''s file on Kitt, [*New York Times*, Jan. 3, 1975](https://timesmachine.nytimes.com/timesmachine/1975/01/03/issue.html) (Check). Check: the words: Barrett, 119, has Kitt: "Boys I know across the nation feel it doesn''t pay to be a good guy. ... We send the best of this country off to be shot and maimed. ... No wonder the kids rebel and take pot.". Names: Lady Bird Johnson, Kitt.'
