  - id: cal.1968.china-leadership-7
    when: 1968–69
    date: '1968'
    thread: china-leadership
    c: 'Mao 毛泽东 gives, over 1968 and 1969, four instructions on the Xuzhou 徐州 area of northern Jiangsu 江苏, where the revolutionary great alliance would not come about: the two Xuzhou factions are both revolutionary mass organizations and are to form a great alliance; Xuzhou has turned over several times and cannot turn over again; one faction does not work, two do; one faction holding power will not do, the union of two will; explain the policy, and most people can accept it.'
