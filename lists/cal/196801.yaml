  - id: cal.1968-01-01.economy
    when: Jan. 1
    date: '1968-01-01'
    thread: economy
    also: [trade]
    c: 'The LBJ Ranch. Johnson''s program on the balance of payments, the deficit to be cut by $3 billion in 1968 (Check the total). Executive Order 11387, under the banking laws: a mandatory program on direct investment abroad, administered by Commerce, at least $1 billion; new direct investment in continental Western Europe stopped. The Federal Reserve to tighten its restraint on lending abroad by banks and financial institutions, $500 million. Americans asked to defer for two years all nonessential travel outside the Western Hemisphere; legislation to be sought. Talks abroad on the border taxes and export rebates. The same day: Ackley to be ambassador to Italy.'
    n: 'Statement by the President Outlining a Program of Action To Deal With the Balance of Payments Problem, [1968–69 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=86); [Executive Order 11387](https://www.presidency.ucsb.edu/documents/executive-order-11387-governing-certain-capital-transfers-abroad); The President''s News Conference at the LBJ Ranch, [1968–69 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=79) (Jan. 1, 1968). Opinion: [42 Op. Att''y Gen. 363](https://archive.org/details/op-atty-gen/042/page/n387/mode/1up) (1968), Clark to the Secretary of Commerce, Feb. 3, 1968: Executive Order 11387 valid under section 5(b) of the Trading With the Enemy Act, the emergency of Dec. 16, 1950, continuing. FRUS 1964–68, VIII, docs. [161](https://history.state.gov/historicaldocuments/frus1964-68v08/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v08/d164), [174](https://history.state.gov/historicaldocuments/frus1964-68v08/d174). [[w.schwartz-lyndon-johnson-and-europe]], 195–97; [[w.califano-triumph-and-tragedy-of]], 247 (the morning''s announcement, the markets closed; Califano''s background briefing in the hangar, Johnson pacing); [[w.meltzer-history-of-the-federal]], 533 n.70 (the program, mandatory and voluntary controls on capital movements). [[w.gavin-gold-dollars-and-power]], 4, 177–78 (the program; the controls; travel and trade left to Congress and talks abroad). To check: [[w.kunz-butter-and-guns]]; [[w.solomon-international-monetary-system-1945]]; "The 1968 Balance of Payments Program," NSF History, Box 54, LBJ Library (cited by [[w.schwartz-lyndon-johnson-and-europe]], 197 n.58). See [[cal.1967-11-18.economy]]. Names: Ackley, Johnson.'
