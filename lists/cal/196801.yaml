    time: 1968-01-25T13:30Z
    thread: japan-and-korea-pueblo
    c: 'Breakfast on the *Pueblo*, 8:30 a.m.: Rusk, McNamara, Goldberg, Rostow. Goldberg: going to the Security Council "will give us time." Rostow: the seizure justifies "equivalent reprisal"; Johnson: "Walt, I do not want to win the argument and lose the sale." Johnson''s steps: Congress to be brought in ("see if the Fulbrights represent this country"), Russell''s judgment sought, a letter to Kosygin.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [223](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d223). [[w.longley-lbjs-1968]], 39–40, 42–43 (the breakfast; Longley''s notes 24 and 27, for Russell and the time gained, cite it as doc. 213, 514–19); [[w.drea-mcnamara-clifford-and-the-2011]], 488 (n.15: the breakfast meeting; McNamara has detailed information on moving 303 aircraft to the Korean area, diverting 10,000 tons of bombs bound for South Vietnam and calling up 332 reserve aircraft; Johnson, questioning, concurs and approves a second carrier, the Kitty Hawk; not the hour, Goldberg, Rostow or the words quoted). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Rusk, McNamara, Goldberg, Rostow, Fulbright, Russell, Kosygin, Johnson.'
