    date: '1968-01-24'
    thread: opinion
    also: [economy, vietnam, poverty]
    c: 'Gallup, two releases. Jan. 4–9: prices and wages frozen at their present level as long as the Vietnam war lasts: a good idea 46 percent, a poor idea 43, no opinion 11. Dec. 7–12, 1967: the smallest amount a family of four needs each week to get along in this community, the median: $102. The family''s food, including milk, each week, median: $29.'
    n: '[[w.gallup-poll]], III, 2103.'
  - id: cal.1968-01-24.japan-and-korea-pueblo-2
    when: Jan. 24
    date: '1968-01-24'
    thread: japan-and-korea-pueblo
    c: 'The National Security Council, 1 p.m., on the *Pueblo*. McNamara: the seizure planned, the Soviets told of it in advance; the North Koreans "have no intention of returning the men or the ship." Wheeler: the ship''s "SOS"; no aircraft sent, the dark coming on and the defenses at Wonsan. McNamara, for Moorer: less than 1 percent chance of error in the ship''s position, 15½ to 17½ miles from shore. Rostow: Bucher''s confession "appears to have been written by the Soviets." Johnson: tell Fulbright, "so that he will be more responsible about his statements."'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [218](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d218). [[w.longley-lbjs-1968]], 35–38 (the meeting; Longley cites it as doc. 213). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: McNamara, Wheeler, Moorer, Rostow, Bucher, Fulbright, Johnson.'
