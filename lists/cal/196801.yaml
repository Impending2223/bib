  - id: cal.1968-01-06.china-leadership
    when: Jan. 6
    date: '1968-01-06'
    place: peking
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads Yao Wenyuan''s drafts of the Xinhua report and the *Renmin ribao* and *Jiefangjun bao* editorial on the founding of Jiangxi''s revolutionary committee. Strikes from both the slogan that each of his sentences is truth, one worth ten thousand; notes that a few improper phrases are out. Both printed Jan. 7.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 6, 1968. [[w.jianguo-yilai-mao-zedong]], XIX, 210–211 (Jan. 6, 1968; Mao''s note of 3 p.m. Jan. 6 ''Back to Yao Wenyuan: both usable; struck some improper sentences''; he also strikes ''step by step'' in the editorial). Made public: 2013. To check: Yao Wenyuan, drafts of the Xinhua report on the founding of the Jiangxi Revolutionary Committee and of the Renmin ribao and Jiefangjun bao editorial ''The Jinggangshan red flag flies for ten thousand generations'' (Jinggangshan hongqi piao wandai 井冈山红旗飘万代), sent to Mao Jan. 6, 1968; printed Jan. 7 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 210 n.1). Names: Mao Zedong, Yao Wenyuan.'
    src:
      c: 251137f6
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Jan. 6, 1968: all'
        - 'w.jianguo-yilai-mao-zedong XIX, 210–211: A-D'
        - 'via w.jianguo-yilai-mao-zedong XIX, 210 n.1: all'
    tags: [polity:prc, name:mao-zedong, name:yao-wenyuan, vis:only:prc]
  - id: cal.1968-01-06.vietnam-saigon
    when: Jan. 6
    date: '1968-01-06'
    place: saigon
    thread: vietnam-saigon
    also: [vietnam-diplomacy]
    c: 'Saigon. Thiệu, asked whether he objects to the United States talking alone with Hanoi if it stops the bombing and Hanoi answers in kind: South Vietnam would welcome "any movement or any informal talks from any government to bring peace," but "negotiations should be the main task between the Saigon Government and the Hanoi Government"; of a softening in Hanoi, "Everyone is waiting for a more clarifying position."'
