  - id: cal.1968-01-11.europe-and-the-alliance
    when: Jan. 11
    date: '1968-01-11'
    thread: europe-and-the-alliance
    c: 'Brown, the Foreign Secretary, to Rusk, 9:30 a.m.: after devaluation, British cuts of £1 billion; no bases on the Asian mainland after Mar. 31, 1971, and the Persian Gulf left by then. Rusk "profoundly dismayed." Johnson to Wilson the same day: "deep dismay"; the steps "tantamount to British withdrawal from world affairs."'
    n: 'Memorandum of conversation, [FRUS 1964–68, XII, doc. 288](https://history.state.gov/historicaldocuments/frus1964-68v12/d288); Johnson to Wilson, [doc. 289](https://history.state.gov/historicaldocuments/frus1964-68v12/d289). [[w.schwartz-lyndon-johnson-and-europe]], 199 (Rusk and Brown). Made public: FRUS 1964–68, XII (2001). Names: Rusk, Johnson, Wilson.'
    src:
      c: 39e74f0e
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d288: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d289: C'
        - 'w.schwartz-lyndon-johnson-and-europe 199: A-B'
        - 'via w.schwartz-lyndon-johnson-and-europe 199 n.66: A-B'
    tags: [name:rusk-dean, name:johnson-lyndon-b, name:wilson-harold]
  - id: cal.1968-01-13.vietnam-khe-sanh
    when: Jan. 13
    date: '1968-01-13'
    thread: vietnam-khe-sanh
    c: 'Wheeler to McNamara: against both a preemptive offensive into Laos and a withdrawal from Khe Sanh.'
    n: 'FRUS 1964–68, VI, doc. [12](https://history.state.gov/historicaldocuments/frus1964-68v06/d12). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-08.vietnam-2]]. Names: Wheeler, McNamara.'
    tags: [name:wheeler-earle, name:mcnamara-robert-s]
