  - id: cal.1968-01-01.china-leadership
    when: Jan. 1
    date: '1968-01-01'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'The Renmin ribao, Hongqi and Jiefangjun bao print the New Year editorial "Greet the all-round victory of the Great Proletarian Cultural Revolution": the year''s tasks are to seize victory ideologically, politically, economically and organizationally; bourgeois and petty-bourgeois factionalism to be overthrown.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 1, 1968); [[w.mao-zedong-zhuan]], VI, ch. 77 n.1 (the *Renmin ribao*, *Hongqi* and *Jiefangjun bao* New Year editorial, approved by Mao for publication: the first Great Proletarian Cultural Revolution in human history won a decisive victory in 1967; the struggle for the all-round victory has begun; the book does not give the editorial''s title or its list of the year''s tasks, n.1). To check: *Renmin ribao* 《人民日报》, Jan. 1, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.1). Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai]
  - id: cal.1968-01-01.china-leadership-2
    when: Jan. 1, 3, 10
    date: '1968-01-01'
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai receives the delegates to the Hong Kong and Macao conference. On the summer of 1967: the domestic press''s propaganda on Hong Kong in June to September was faulty, its slogans near those used at home, the Red Guards'' slogans carried over into reports on Hong Kong.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 207 (Jan. 1, 1968). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1968-01-02.welfare
    when: Jan. 2
    date: '1968-01-02'
    place: lbj-ranch
    thread: welfare
    also: [health]
    c: 'The LBJ Ranch. Social Security Amendments signed, [81 Stat. 821](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg821.pdf): benefits up at least 13 percent from March, for 24 million; the minimum from $44 to $55 a month; a retired couple''s maximum from $207 to $234, in time $323; earnings to $140 a month without loss of benefits; disabled widows covered. Johnson: the work incentive program, day care and family planning adopted; in place of other proposals Congress "substituted certain severe restrictions." A Commission on Income Maintenance Programs, Heineman its chairman.'
    n: 'Statement by the President Upon Signing the Social Security Amendments and Upon Appointing a Commission To Study the Nation''s Welfare Programs, [1968–69 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=92) (Jan. 2, 1968). Statute (K–J Cong. II.J.2). [[w.bernstein-guns-or-butter]], 437 (no ceremony; the statement issued in San Antonio, as the Papers'' note has it; Meany and Reuther had urged him not to sign). See [[cal.1967-11-22.welfare]]. Names: Heineman, Johnson.'
    src:
      c: 9a87281b
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=92: all'
        - 'https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg821.pdf: B'
        - 'w.bernstein-guns-or-butter 437: B, H-I'
    tags: [name:johnson-lyndon-b, name:heineman-ben-w]
    short: the Social Security Amendments signed at the Ranch
