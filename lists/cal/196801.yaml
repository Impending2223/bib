  - id: cal.1968-01-30.republican-party-congress
    when: Jan. 30
    date: '1968-01-30'
    thread: republican-party-congress
    also: [japan-and-korea-pueblo, vietnam-tet]
    c: 'Dirksen and Ford with Johnson on the *Pueblo*, late in the day. Ford presses on the mistakes made: "If I had known what was on that vessel I might have blown it out of the water myself"; "your attitude is one of excuse rather than how to prevent it from happening again." Johnson: "I think the mistake was made by the North Koreans"; "When you send out a spy he sometimes does not come back." From 6:04 to 7:55 p.m., the attack on the embassy in Saigon under way, Johnson reading out the messages from the Situation Room as they come up.'
    n: '[[w.longley-lbjs-1968]], 44–45. [[w.barrett-uncertain-warriors]], 113 (the hours; the messages read out). To check: Notes of the President''s Meeting with Senator Dirksen and Congressman Ford, Jan. 30, 1968, Tom Johnson''s Notes of Meetings, Box 2, LBJ Library (cited by [[w.longley-lbjs-1968]], 45 n.33); the same notes (cited by [[w.barrett-uncertain-warriors]], 113 n.15). See [[cal.1968-01-23.japan-and-korea]]. Names: Dirksen, Ford, Johnson.'
