  - id: cal.1968-01-17.elections-1968-johnson
    when: Jan. 17
    date: '1968-01-17'
    thread: elections-1968-johnson
    c: 'The White House, about noon. George Christian brings Johnson the draft he had asked of him, from what Johnson had told him, announcing that he will not run: "a good statement, very well said." Mrs. Johnson''s own draft, which Johnson had asked her for, "seemed feeble"; she brings out the statement she wrote in August 1964 before Atlantic City, and Christian reads it. The announcement is not to be in the text of the State of the Union Message; if made, it would come at the end: "And now I want to speak to you about a personal matter . . ."'
    n: '[[w.johnson-white-house-diary]], 616 (Lady Bird Johnson''s account). See [[cal.1968-01-17.elections-1968]]. Made public: 1970. Names: Johnson, Christian, Lady Bird Johnson.'
    tags: [name:johnson-lyndon-b, name:christian-george, name:johnson-lady-bird]
  - id: cal.1968-01-17.elections-1968-johnson-2
    when: Jan. 17
    date: '1968-01-17'
    thread: elections-1968-johnson
    c: 'The White House, about 6:30 p.m. Mrs. Johnson brings Johnson Christian''s draft statement that he will not run, to "get it back into Lyndon''s pocket." Johnson, in the door between the Oval Office and his small one, the Congressional leaders waiting in the Fish Room: "Well, what do you think? What shall I do?" She: Luci hopes he will not run; Lynda hopes he will, her husband going to war; "Me—I don''t know. ... I can''t tell you what to do." Johnson hands her a letter from John Connally recommending that he go with the statement that night, because he "would never have a bigger audience," before a live audience rather than on television or in the papers, to take the decision out of "a political context."'
    n: '[[w.johnson-white-house-diary]], 617–18 (Lady Bird Johnson''s account). The letter is in Mrs. Johnson''s paraphrase; that Connally meant the State of the Union was "a noble time" is her reading. Her advice of before, to run "in the same state of mind of a man who is becoming a monk" or to announce, she did not repeat: "it was not the place to say it again." See [[cal.1968-01-17.elections-1968-johnson]]. Made public: 1970. Names: Johnson, Lady Bird Johnson, Christian, Connally.'
    tags: [name:johnson-lyndon-b, name:johnson-lady-bird, name:christian-george, name:connally-john]
  - id: cal.1968-01-17.conservation
    when: Jan. 17
    date: '1968-01-17'
    thread: conservation
    c: 'The White House, the Red Room. First meeting of 1968 of the Beautification Committee, two hours, Mrs. Johnson presiding, Walter Washington present. Mrs. Merriweather Post has sent a check for street trees; Stewart Udall reports on Lawrence Halprin''s suggestions for Washington, "all costing money." Discussed: Arbor Day, to widen contributions to those who can give five dollars; one more trash pickup a week, "if the budget could bear it," and more trash containers; the schools, Buchanan above all.'
    n: '[[w.johnson-white-house-diary]], 616–17 (Lady Bird Johnson''s account). The members present are not listed. The call at Buchanan School before it: [[cal.1968-01-17.conservation-2]]. Names: Lady Bird Johnson, Walter Washington, Udall.'
    tags: [name:johnson-lady-bird, name:washington-walter-e, name:udall-stewart-l, city:washington]
