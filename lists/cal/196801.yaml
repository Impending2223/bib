  - id: cal.1968-01-25.robert-kennedy-campaign-decision
    when: Jan. 25
    date: '1968-01-25'
    place: nyc
    thread: robert-kennedy-campaign-decision
    c: 'New York, dinner at the Caravelle with Ethel Kennedy, the Benno Schmidts and Schlesinger, the day Johnson calls up 14,000 reserves after the *Pueblo*. Robert Kennedy: his brother "the strongest opponent" of his running; "if I run I will go a long way toward proving everything that everybody who doesn''t like me has said about me." Ethel and Schlesinger for running, Schmidt against. To Schmidt, driving back: "I''m convinced that what you say is right." By Schmidt''s and Schlesinger''s accounts.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 839–40; [[w.schlesinger-journals]], 275–76 (dinner at La Caravelle with Ethel Kennedy and Schlesinger and his wife; his brother Ted "the strongest opponent of his moving"; Ethel for it; not the Schmidts, the quotation, Schlesinger''s stand at the table or the *Pueblo* reserves). To check: Benno Schmidt, interview by Roberta Greene, 33–36; Schlesinger, journal, Jan. 25, 1968, Schlesinger Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 840 n.76b) (cited by [[w.schlesinger-robert-kennedy-and-his]], 840 n.76). Names: Robert Kennedy, Schlesinger, Edward Kennedy.'
    src:
      c: 700bfcb0
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 839–40: all'
        - 'via w.schlesinger-robert-kennedy-and-his 840 n.76b: all'
        - 'w.schlesinger-journals 275–76: B'
    tags: [name:kennedy-robert-f, name:schlesinger-arthur-m-jr, name:kennedy-edward-m]
  - id: cal.1968-01-25.japan-and-korea-pueblo-4
    when: Jan. 25
    date: '1968-01-25'
    thread: japan-and-korea-pueblo
    c: 'McNamara, after the morning meeting, to his senior military and civilian staffs: the aim the return of the crew; "Excessive military pressure" might lessen its chances. No "overt action" yet to reinforce Korea and Japan; warning orders to designated Air Force and Navy units; the Kitty Hawk to move to Korea; nothing out of Southeast Asia or Europe without written approval from him or Nitze.'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.15; Drea also has McNamara defer the Chiefs'' request for 8,500 more men for the Eighth Army, its day not given, the memoranda of Jan. 29 and Feb. 1 among the note''s sources). To check: Nitze notes, Jan. 25, 1968, Nitze Papers, LC; JCSM-53-68 for SecDef, Jan. 25, 1968 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 489 n.15). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Nitze.'
    tags: [name:mcnamara-robert-s, name:nitze-paul]
  - id: cal.1968-01-25.japan-and-korea-pueblo-8
    when: Jan. 25
    date: '1968-01-25'
    thread: japan-and-korea-pueblo
    c: 'Wheeler to CINCPAC: Johnson''s wish to avoid the appearance of an ultimatum to Pyongyang or Moscow; he must take into account the divisions at home over Vietnam.'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 489 ("later that day"; n.15). See [[cal.1968-01-25.japan-and-korea-pueblo-4]]. Names: Wheeler, Johnson.'
    tags: [name:wheeler-earle, name:johnson-lyndon-b]
  - id: cal.1968-01-25.japan-and-korea-pueblo-5
    when: Jan. 25
    date: '1968-01-25'
    place: washington
    thread: japan-and-korea-pueblo
    c: 'White House working lunch. McNamara: authority for the President to summon as many as 150,000 reservists; no gaps in U.S. forces, against the charge of using the crisis "to plug up all the loopholes . . . in our current military posture." He cannot answer Johnson on the purpose of the deployments. Johnson approves 15 B-52s to Okinawa and 11 to Guam, disavowing any intent to use them against North Korea; Goldberg to ask for an urgent meeting of the Security Council. Clifford: caution on mobilization.'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [225](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d225) (Tom Johnson''s notes of the luncheon). [[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.16; Goldberg and the Council, "on the same busy day," n.18 citing the luncheon at 513). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea-pueblo]]. Names: McNamara, Johnson, Goldberg, Clifford.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:goldberg-arthur-j, name:clifford-clark]
  - id: cal.1968-01-25.japan-and-korea-pueblo-6
    when: Jan. 25
    date: '1968-01-25'
    place: washington
    thread: japan-and-korea-pueblo
    c: 'The Thursday night meeting on the Pueblo, 6:30 to 7:45 p.m. Wheeler: the aircraft deployments first for defense, second for reprisal attacks on North Korea if so decided. McNamara: needed to give air support to the Banner. Johnson spaces the movement of aircraft to South Korea over eight days and approves the mobilization of 28 Air Force and Navy reserve units, 14,787 men and 372 aircraft. Clifford: approaches through the UN and Kosygin with the start of a "quiet build up."'
    n: 'FRUS 1964–68, XXIX, pt. 1, doc. [226](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d226) (Tom Johnson''s notes; the hour; Clifford''s "quiet build up," 518). [[w.drea-mcnamara-clifford-and-the-2011]], 489 (n.17). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-25.japan-and-korea]]. Names: Wheeler, McNamara, Johnson, Clifford, Kosygin.'
    tags: [name:wheeler-earle, name:mcnamara-robert-s, name:johnson-lyndon-b, name:clifford-clark, name:kosygin-aleksei]
    time_range:
      - 1968-01-25T23:30Z
      - 1968-01-26T00:45Z
    time_zone: America/New_York
  - id: cal.1968-01-25.white-house
    when: Jan. 25
    date: '1968-01-25'
    place: washington
    thread: white-house
    c: 'The White House. The first big dinner of 1968, honoring the Vice President, the Speaker and the Chief Justice, 190 guests, the day of the call-up of the Reservists and the attack at Khe Sanh. As the Johnsons enter the State Dining Room "the room burst into spontaneous applause"; in the line a guest murmurs, "We are praying for you." Johnson''s toast: there have been times when "check and balance really meant ''stop and freeze''," then people want progress. Humphrey, without notes, to "a man who is firm and resolute, strong and kind, and governs with compassion." McCormack and Warren (his theme "unity in perilous times") also toast. As Fortas and Alexander Schneider play Mozart on borrowed violins, Johnson to Meany: "Do you reckon Abe has a Union card?"'
    n: '[[w.johnson-white-house-diary]], 625–27 (Lady Bird Johnson''s account). Johnson''s toast as Mrs. Johnson paraphrases it; the Speaker''s toast and Warren''s theme as she reports them. To check: the toasts, if in the Public Papers. Names: Johnson, Humphrey, McCormack, Warren, Fortas, Meany.'
    tags: [name:johnson-lyndon-b, name:humphrey-hubert-h, name:mccormack-john-w, name:warren-earl, name:fortas-abe, name:meany-george, city:washington]
