    c: 'Northeastern Tây Ninh. Elements of the 5th Viet Cong Division attack the 3d Brigade, 25th Division, on Yellowstone: 401 of the enemy killed. The worst of 23 major violations of the New Year truce, Dec. 31–Jan. 2, by MACV''s count.'
