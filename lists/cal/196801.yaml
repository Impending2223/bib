    when: Jan. 14
    date: '1968-01-14'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, Dec. 7–12, 1967, a hawk or a dove on Vietnam: Johnson, hawk 66 percent, dove 18. Nixon 46 and 26. Reagan 39 and 27. Wallace 37 and 20. Rockefeller 28 and 30. Robert Kennedy 25 and 54. Romney 21 and 39. McCarthy 11 and 52.'
    n: '[[w.gallup-poll]], III, 2101. Names: Johnson, Nixon, Reagan, Wallace, Rockefeller, Kennedy, Romney, McCarthy.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:reagan-ronald, name:wallace-george-c, name:rockefeller-nelson, name:kennedy-robert-f, name:romney-george-w, name:mccarthy-eugene-j]
  - id: cal.1968-01-14.elections-1968
    when: Jan. 14
    date: '1968-01-14'
    thread: elections-1968
    c: 'Sunday. Johnson in bed at the White House, by Busby''s account: the draft of the State of the Union "too long, too dull, too flat"; he will close the address by announcing that he will not run, and dictates the close ("let us continue"). Busby: "we''ll have to think about this."'
    n: '[[w.longley-lbjs-1968]], 17–19 (Busby''s account). To check: [[w.busby-thirty-first-of-march]], 173, 180 (cited by [[w.longley-lbjs-1968]], 17, 19 nn.19, 22). See [[cal.1967-10-03.vietnam]]. Names: Johnson, Busby.'
    src:
      c: dc0595bf
      rows:
        - 'w.longley-lbjs-1968 17–19: all'
    tags: [name:johnson-lyndon-b, name:busby-horace]
