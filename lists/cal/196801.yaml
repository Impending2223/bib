    n: 'The President''s Address to the Nation: The Situation With North Korea, [1968–69 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=155) (Jan. 26, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d228), [229](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d229). [[w.drea-mcnamara-clifford-and-the-2011]], 489–90 (Johnson directs Goldberg Jan. 25 to ask for an urgent meeting of the Security Council; the Council convenes the next day, Jan. 26, two days of debate; not the address). See [[cal.1968-01-23.japan-and-korea]]. Names: Johnson, Goldberg.'
