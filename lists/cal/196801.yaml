    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai at the Central Case Group, on the line for trying cases: forced confession is a wrong line; "kill none, arrest few" still holds; do not trust confessions, weigh evidence and corroboration; hold those who erred to strict account yet keep unity; leniency for confession, severity for resistance; win them to confess of themselves, not under compulsion.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 210 (Jan. 17, 1968). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
