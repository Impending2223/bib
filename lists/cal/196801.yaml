  - id: cal.1968-01-21.vietnam
    when: Jan. 21–22
    date: '1968-01-21'
    thread: vietnam-khe-sanh
    c: 'Before dawn, Jan. 21, North Vietnamese troops attack Hill 861 and shell the combat base; its main ammunition dump blown up. The siege of the 26th Marines, some 6,000 men with the South Vietnamese rangers (Check), by elements of at least two North Vietnamese divisions. McNamara to Johnson, Jan. 22: "the long-expected attack on Khe Sanh" begun; Westmoreland "fully prepared." Niagara, the bombing around the base, about 40 B-52 and 500 tactical sorties a day.'
    n: '[Johnson and McNamara, 8:27 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-january-22-1968), Jan. 22, Conversation WH6801-01-12608 (Miller Center). FRUS 1964–68, VI, doc. [22](https://history.state.gov/historicaldocuments/frus1964-68v06/d22). [[w.frankum-like-rolling-thunder]], 70–71 (the siege from the third week of January; Niagara); [[w.vietnam-victory-in-vietnam]], 215–17, 222–23, 229–30, 467 n.20 (the Route 9 front opened, the night of Jan. 20; the siege of the 26th Marines and the rangers, from Feb. 10; the bombing); [[w.cosmas-joint-chiefs-of-staff]], 142 (the attack; the dump; the defenders; Niagara); [[w.branch-at-canaans-edge]], 676 (the siege''s first artillery); [[w.schlight-united-states-air-force]], 280 (Niagara''s bombing from Jan. 22, as many as three hundred targets a day within a week); [[w.zaroulis-who-spoke-up]], 151 (six thousand Marines under attack from Jan. 21); [[w.berman-lyndon-johnsons-war]], 140 (rockets and mortars before dawn, Jan. 21; 6,000 Marines; 15,000 to 20,000 North Vietnamese; Niagara). [[w.westmoreland-soldier-reports]], 317, 339 (the attacks on Hills 861 and 881 South that night; the defenders, about 6,000; two North Vietnamese divisions and part of a third). Made public: FRUS 1964–68, VI (2002). To check: [[w.prados-valley-of-decision]]; [[w.pisor-end-of-the-line]]; [[w.hammel-khe-sanh]]; [[w.shulimson-u-s-marines-in-1997]]; [[w.al-chien-dich-tien-cong]]; [[w.braestrup-big-story]], 256–67 (cited by [[w.branch-at-canaans-edge]], 676); [[w.dallek-flawed-giant]], 502–3 (cited by [[w.branch-at-canaans-edge]], 676); [[w.langguth-our-vietnam]], 478–79 (cited by [[w.branch-at-canaans-edge]], 676); "5,000 Men Massed at Khesanh by U.S.," [*New York Times*, Jan. 24, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/24/issue.html), pee (cited by [[w.branch-at-canaans-edge]], 676). See [[cal.1968-01-08.vietnam-2]]. Names: McNamara, Westmoreland, Johnson. Check: Cosmas, 142, gives about 5,700 Marines and 500 South Vietnamese Rangers after the reinforcements, against an estimated 20,000–25,000 North Vietnamese. Check: *Victory in Vietnam* opens the Route 9 front the night of Jan. 20, to draw American forces from the cities; the siege from Feb. 10; for the 170 days, 17,000 of the enemy put out of action, 13,000 Americans among them, and 480 aircraft (216–17, 222, 230).'
