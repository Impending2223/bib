  - id: cal.1968-01-21.defense
    when: Jan. 21
    date: '1968-01-21'
    thread: defense-thule
    also: [europe-and-the-alliance]
    c: 'Greenland. A Strategic Air Command B-52 from Plattsburgh Air Force Base, N.Y., afire, crashes on the ice of North Star Bay, 7½ miles from Thule Air Base; six of seven crewmen saved. The conventional explosives of its four hydrogen bombs go off, scattering radioactive debris over the ice; no nuclear explosion. Denmark''s policy: no nuclear weapons in Greenland.'
    n: 'FRUS 1964–68, XII, doc. [1](https://history.state.gov/historicaldocuments/frus1964-68v12/d1). [[w.sagan-limits-of-safety]], 156–203; [[w.drea-mcnamara-clifford-and-the-2011]], 483–85 (the crash on the ice of North Star Bay, four hydrogen bombs aboard; the weapons destroyed and the area contaminated, no nuclear explosion; Denmark''s policy). To check: [[w.greenland-during-the-cold-war]]. See [[cal.1966-01-17.defense]].'
    src:
      c: 305533a6
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v12/d1: all'
