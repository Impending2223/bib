    c: 'The night of Jan. 30–31, in the Tet truce, the general offensive: Saigon, sappers inside the embassy''s grounds until morning (Check the hours), Tân Sơn Nhứt, the palace, the radio station; Huế, most of it taken, the Citadel with it; thirty-six province capitals and five of the six autonomous cities attacked. McNamara to Johnson: the enemy has "more power than some credit them with." Westmoreland, Feb. 1: 189 Americans killed, 4,320 of the enemy.'
    n: '[Johnson and McNamara, 7:24 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-2), Jan. 31, Conversation WH6801-02-12617 (Miller Center). [FRUS 1964–68, VI, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v06/d43); [doc. 72](https://history.state.gov/historicaldocuments/frus1964-68v06/d72). [[w.westmoreland-soldier-reports]], 323–25, 328–29 (the night; Westmoreland at the embassy at about 8:30 a.m., and his press conference there: no Viet Cong inside the chancery; the attacks across the country; Huế); [[w.branch-at-canaans-edge]], 681 (the embassy compound; thirty-six of forty-four provincial capitals); [[w.macv-command-history-1968]], 129 (the night of Jan. 30–31; five of the six autonomous cities); [[w.zelizer-fierce-urgency-of-now]], 284; [[w.bernstein-guns-or-butter]], 474–75 (39 of 44 provincial capitals, 5 of 6 autonomous cities, at least 71 of 245 district towns; nineteen commandos at the embassy, five Americans killed; Huế''s Citadel); [[w.schlight-united-states-air-force]], 305 (55 percent of the South Vietnamese air force on leave when the offensive struck); [[w.zaroulis-who-spoke-up]], 150–51 (the night of Jan. 30–31: the embassy overrun, retaken the next day; thirty-six cities attacked); [[w.longley-lbjs-1968]], 56 (McNamara by telephone, 7:24 a.m.: "they have more power than some credit them with"); [[w.dallek-flawed-giant]], 503 (the attacks of Jan. 30–31: thirty-six provincial capitals, five of the six largest cities, almost a third of the district centers; in Saigon the embassy compound, Tân Sơn Nhứt, the palace, the Joint General Staff; most of Huế and the Citadel taken, held twenty-six days; not the hours, the radio station, D or E). Check: MACV''s History gives 27 of the 44 province capitals, five of the six autonomous cities, 58 of 245 district towns and more than 50 hamlets attacked, Jan. 30–31; 32,000 of the enemy killed and 5,800 detained, Jan. 29–Feb. 11, of 68,000 committed (129, 131). Check: Bernstein, 474, gives 39 of the 44 provincial capitals. To check: [[w.karnow-vietnam]], 536–39 (cited by [[w.branch-at-canaans-edge]], 681); [[w.braestrup-big-story]], 116–18 (cited by [[w.branch-at-canaans-edge]], 681); Charles Mohr, "U.S. Aide in Embassy Villa Kills Guerilla with Pistol," [*New York Times*, Jan. 31, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/31/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 681); [[w.appy-patriots]], 291 (cited by [[w.branch-at-canaans-edge]], 681); [[w.oberdorfer-tet]], 2–33, 116–34 (cited by [[w.branch-at-canaans-edge]], 681); [[w.langguth-our-vietnam]], 468–71 (cited by [[w.branch-at-canaans-edge]], 681); CIA memorandum, "Vietnam— Operation Shock," Feb. 2, 1968, in ibid., p. 98 (cited by [[w.branch-at-canaans-edge]], 681); William J. Jorden to Walt Rostow, "Situation in Vietnam," Feb, 3, 1968, in ibid., p. 111 (cited by [[w.branch-at-canaans-edge]], 681). See [[cal.1968-01-30.vietnam]]. Names: McNamara, Westmoreland, Johnson. Check: *Victory in Vietnam*: Huế opened by rockets at 2:33 a.m., Jan. 31; the embassy''s attackers seventeen men of the 11th Commando Team, military police landed on the roof at 9 a.m. (218, 220).'
