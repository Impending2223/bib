  - id: cal.1968-01-31.vietnam-tet-2
    when: Jan. 31
    date: '1968-01-31'
    thread: vietnam-tet
    also: [japan-and-korea-pueblo]
    c: 'Breakfast with the congressional leaders on defense, 8:40 a.m.: Stennis, Margaret Chase Smith, Hayden, Milton Young, Mahon, Bow, Bates. Johnson: "A desperate attack is being launched against us in Vietnam"; the North Koreans and Vietnam "a coordinated challenge"; "I ask you to measure your statements before you make them"; "We may have to extend enlistments. We may have to have 100 million dollars for Korea. We may need further call-ups." Helms: the incursions along the DMZ and the *Pueblo* connected, to divert attention from Vietnam.'
    n: 'FRUS 1964–68, VI, doc. [39](https://history.state.gov/historicaldocuments/frus1964-68v06/d39). [[w.longley-lbjs-1968]], 45, 57–58 (the breakfast). Made public: FRUS 1964–68, VI (2002). Check: Longley names Rivers at the breakfast (45, 57); FRUS''s list of those present does not. See [[cal.1968-01-30.vietnam]]. Names: Stennis, Margaret Chase Smith, Hayden, Milton Young, Mahon, Bow, Bates, Helms, Johnson.'
