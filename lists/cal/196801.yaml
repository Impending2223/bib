  - id: cal.1968-01-02.school-aid
    when: Jan. 2
    date: '1968-01-02'
    thread: school-aid
    c: 'The LBJ Ranch. Elementary and Secondary Education Amendments signed, [81 Stat. 783](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg783.pdf): the act extended two years; Title VII, the Bilingual Education Act, for children "whose first language is not English"; dropout prevention; programs for handicapped children. The conference report through the House, [286–73](https://voteview.com/rollcall/RH0900244), and the Senate, [63–3](https://voteview.com/rollcall/RS0900315), Dec. 15.'
    n: 'Statement by the President Upon Signing the Elementary and Secondary Education Amendments of 1967, [1968–69 Pub. Papers 15](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=93) (Jan. 2, 1968). Statute (K–J Cong. II.J.2). [[w.graham-uncertain-triumph]], 159 (the conference of Dec. 15; through fiscal 1970; the handicapped, dropouts, bilingual education; P.L. 90-247). To check: [[w.bailey-esea]]. See [[cal.1965-01-12.school-aid]]. Names: Johnson.'
