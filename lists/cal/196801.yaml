    c: 'National Educational Television''s program on the State of the Union, after the Message: the panelists Edwin Reischauer and Daniel Patrick Moynihan, to Mrs. Johnson "support from an unexpected quarter"; "the most amusing remarks" by William Buckley; Bill Moyers; Arthur Schlesinger, "so bitter I found him funny"; the new Mayor of Cleveland, Carl Stokes, "reasonable and articulate and mostly fair." She and about fifteen guests watch it in her bedroom at the White House: "we won more than we lost."'
