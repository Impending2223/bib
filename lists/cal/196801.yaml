  - id: cal.1968-01-05.economy
    when: Jan. 5
    date: '1968-01-05'
    thread: economy
    c: 'Walt Rostow to Johnson at the Ranch, by telegram, received 8:12 p.m.: the reactions to the program. The gold pool sold nothing Jan. 4. Belgium fears the cut in American investment; the Commission sympathetic, no commitment; the Dutch cooperative. Australia asks special treatment: capital inflow not below 1966''s, exemption from the 5 percent cut in lending, loans floated here free of the interest equalization tax; restrictions might make its part in Vietnam harder. Norway asks to be counted among the countries dependent on American capital.'
