  - id: cal.1968-01-21.japan-and-korea
    when: Jan. 21
    date: '1968-01-21'
    thread: japan-and-korea-blue-house
    c: Seoul, the night of Jan. 21. Thirty-one North Korean commandos, sent to kill Park, stopped by police within a few hundred yards of the Blue House; police and civilians killed in the fighting (Check the dead); one raider captured.
    n: 'Editorial Note, [FRUS 1964–68, XXIX, pt. 1: Korea, doc. 144](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d144) (the night of Jan. 21; some thirty raiders, sent to kill Park; South Korean civilians and police killed). To check: [[w.bolger-scenes-from-an-unfinished]]; [[w.oberdorfer-two-koreas]]; [[w.cha-alignment-despite-antagonism]]; [[w.lerner-pueblo-incident]]. See [[cal.1967-11-14.japan-and-korea]]. Names: Park. Check: FRUS, doc. 144, has at least two raiders captured and at least five killed.'
    src:
      c: 67656b10
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v29p1/d144: A-C'
    tags: [name:park-chung-hee]
  - id: cal.1968-01-21.opinion
    when: Jan. 21
    date: '1968-01-21'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Jan. 4–9, two releases. Republicans'' choice for 1968: Nixon 42 percent, Rockefeller 27, Romney 12, Reagan 8, Percy 5, Hatfield 2, Lindsay 1, Gavin 1; no preference 2. Independents: Nixon 27, Rockefeller 27, Reagan 14, Romney 13, Percy 7. Johnson 51, Nixon 39, undecided 10. Johnson 46, Rockefeller 40, undecided 14. Johnson 55, Romney 31. Johnson 55, Reagan 33.'
    n: '[[w.gallup-poll]], III, 2102–03. Names: Nixon, Rockefeller, Romney, Reagan, Percy, Hatfield, Lindsay, Gavin, Johnson.'
    tags: [name:nixon-richard-m, name:rockefeller-nelson, name:romney-george-w, name:reagan-ronald, name:percy-charles-h, name:hatfield-mark-o, name:lindsay-john-v, name:gavin-james-m, name:johnson-lyndon-b]
  - id: cal.1968-01-23.japan-and-korea
    when: Jan. 23
    date: '1968-01-23'
    thread: japan-and-korea-pueblo
    c: 'The *Pueblo*, a Navy intelligence ship, Commander Bucher, taken by North Korean patrol boats off Wonsan and brought into port; 83 aboard, one killed. McNamara, at Johnson''s Tuesday lunch: the ship was in international waters, more than fifteen miles out. Moscow, asked to help: it had nothing to do with the incident. The *Enterprise* ordered toward Korea.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [212](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d212), [213](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d213), [214](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d214); [217](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d217); [225](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d225) (the 83 men; the meetings of Jan. 24–25, as Poole cites them, 241 n.59). [[w.poole-joint-chiefs-of-staff-2012]], 237–38, 241 (the seizure; the *Enterprise*); [[w.drea-mcnamara-clifford-and-the-2011]], 487 (the seizure off Wonsan, in international waters; the Soviets asked). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). To check: [[w.lerner-pueblo-incident]]; [[w.armbrister-matter-of-accountability]]; [[w.cheevers-act-of-war]]; [[w.bucher-bucher-my-story]]. See [[cal.1968-01-21.japan-and-korea]]. Names: Bucher, McNamara, Johnson.'
    src:
