  - id: cal.1968-01-03.japan
    when: Jan. 3
    date: '1968-01-03'
    thread: japan
    also: [economy]
    c: 'Tokyo. Eugene Rostow with Satō, two and a half hours, on the payments program. Satō: he admires the President''s "courage and candor"; the President has cut neither security spending nor aid. At Rostow''s request the Cabinet''s secretary general tells the press Japan will cooperate to keep the world monetary system stable. Rostow: a border tax, if proposed, of 2 to 2.5 percent; he asks assurance that Japan will take no step in the field. Miki: Japan''s reaction to a border tax to be taken up at the Cabinets'' joint subcommittee, Honolulu, Jan. 25.'
    n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 169](https://history.state.gov/historicaldocuments/frus1964-68v08/d169) (Rostow''s telegram, 1145Z). Made public: FRUS 1964–68, VIII (1998). To check: the memorandum of the conversation, 15 pages, and those with other Japanese officials, Jan. 2–4, Department of State, Conference Files, Lot 69 D 182, CF 270 (cited by FRUS 1964–68, VIII, doc. 169, n.2). See [[cal.1968-01-01.economy]]. Names: Eugene Rostow, Satō, Miki.'
    src:
      c: 369f98e7
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v08/d169: all'
    tags: [name:rostow-eugene, name:sato-eisaku, name:miki-takeo]
