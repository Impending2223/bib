  - id: cal.1968-01-31.vietnam-tet
    when: Jan. 31–Feb. 1
    date: '1968-01-31'
    thread: vietnam-tet
    c: 'The night of Jan. 30–31, in the Tet truce, the general offensive: Saigon, sappers inside the embassy''s grounds until morning (Check the hours), Tân Sơn Nhứt, the palace, the radio station; Huế, most of it taken, the Citadel with it; thirty-six province capitals and five of the six autonomous cities attacked. McNamara to Johnson: the enemy has "more power than some credit them with." Westmoreland, Feb. 1: 189 Americans killed, 4,320 of the enemy.'
    n: '[Johnson and McNamara, 7:24 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-2), Jan. 31, Conversation WH6801-02-12617 (Miller Center). FRUS 1964–68, VI, docs. [43](https://history.state.gov/historicaldocuments/frus1964-68v06/d43), [72](https://history.state.gov/historicaldocuments/frus1964-68v06/d72). See [[cal.1968-01-30.vietnam]]. Names: McNamara, Westmoreland, Johnson. Check: *Victory in Vietnam*: Huế opened by rockets at 2:33 a.m., Jan. 31; the embassy''s attackers seventeen men of the 11th Commando Team, military police landed on the roof at 9 a.m. (218, 220).'
    tags: [name:mcnamara-robert-s, name:westmoreland-william, name:johnson-lyndon-b, place:saigon, place:tan-son-nhut, place:hue]
