    c: 'Message on manpower, "To Earn a Living: The Right of Every American": $2.1 billion for fiscal 1969. JOBS, Job Opportunities in the Business Sector: government and industry to train and hire the hard-core unemployed of the fifty largest cities, $350 million, 100,000 at work by June 1969, 500,000 by June 1971. A National Alliance of Businessmen to enlist the employers, Henry Ford II its chairman. The Concentrated Employment Program enlarged.'
