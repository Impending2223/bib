    thread: japan-and-korea-pueblo
    c: 'The *Pueblo*, a Navy intelligence ship, Commander Bucher, taken by North Korean patrol boats off Wonsan and brought into port; 83 aboard, one killed. McNamara, at Johnson''s Tuesday lunch: the ship was in international waters, more than fifteen miles out. Moscow, asked to help: it had nothing to do with the incident. The *Enterprise* ordered toward Korea.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [212](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d212), [213](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d213), [214](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d214); [217](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d217); [225](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d225) (the 83 men; the meetings of Jan. 24–25, as Poole cites them, 241 n.59). [[w.poole-joint-chiefs-of-staff-2012]], 237–38, 241 (the seizure; the *Enterprise*); [[w.drea-mcnamara-clifford-and-the-2011]], 487 (the seizure off Wonsan, in international waters; the Soviets asked); [[w.califano-triumph-and-tragedy-of]], 257 (the Pueblo and its crew taken); [[w.bernstein-guns-or-butter]], 473 (two subchasers and four torpedo boats; one seaman killed, three wounded; the crew held at Wonsan, 82 captives); [[w.poole-joint-chiefs-of-staff-2012]], 237; [[w.berman-lyndon-johnsons-war]], 144 (Bucher; the crew of 83; into Wonsan); [[w.nixon-rn]], 298 (North Korea''s seizure of the *Pueblo*, in January); [[w.zaroulis-who-spoke-up]], 150 (Jan. 23: the *Pueblo* captured off North Korea; Bucher and eighty-two men prisoners; North Korea says the twelve-mile limit was violated); [[w.dallek-flawed-giant]], 514 (the seizure of the Pueblo, an intelligence ship, by the North Koreans, three and a half miles beyond territorial waters in the Sea of Japan, one fatality; the White House sees it tied to Tet; not the commander, the port or the 83). [[w.longley-lbjs-1968]], 32–34 (the Tuesday lunch; Moscow''s answer). [[w.rusk-as-i-saw-it-1990]], 391 (the seizure). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). To check: [[w.lerner-pueblo-incident]]; [[w.armbrister-matter-of-accountability]]; [[w.cheevers-act-of-war]]; [[w.bucher-bucher-my-story]]. See [[cal.1968-01-21.japan-and-korea]]. Names: Bucher, McNamara, Johnson.'
