# Cal. XCIX January 1968
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XCIX
entries:
  - id: cal.1968-01-01.economy
    when: Jan. 1
    date: '1968-01-01'
    thread: economy
    also: [trade]
    c: 'The LBJ Ranch. Johnson''s program on the balance of payments, the deficit to be cut by $3 billion in 1968 (Check the total). Executive Order 11387, under the banking laws: a mandatory program on direct investment abroad, administered by Commerce, at least $1 billion; new direct investment in continental Western Europe stopped. The Federal Reserve to tighten its restraint on lending abroad by banks and financial institutions, $500 million. Americans asked to defer for two years all nonessential travel outside the Western Hemisphere; legislation to be sought. Talks abroad on the border taxes and export rebates. The same day: Ackley to be ambassador to Italy.'
    n: 'Statement by the President Outlining a Program of Action To Deal With the Balance of Payments Problem, [1968–69 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=86); [Executive Order 11387](https://www.presidency.ucsb.edu/documents/executive-order-11387-governing-certain-capital-transfers-abroad); The President''s News Conference at the LBJ Ranch, [1968–69 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=79) (Jan. 1, 1968). Opinion: [42 Op. Att''y Gen. 363](https://archive.org/details/op-atty-gen/042/page/n387/mode/1up) (1968), Clark to the Secretary of Commerce, Feb. 3, 1968: Executive Order 11387 valid under section 5(b) of the Trading With the Enemy Act, the emergency of Dec. 16, 1950, continuing. FRUS 1964–68, VIII, docs. [161](https://history.state.gov/historicaldocuments/frus1964-68v08/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v08/d164), [174](https://history.state.gov/historicaldocuments/frus1964-68v08/d174). [[w.schwartz-lyndon-johnson-and-europe]], 195–97. To check: [[w.gavin-gold-dollars-and-power]]; [[w.kunz-butter-and-guns]]; [[w.solomon-international-monetary-system-1945]]. See [[cal.1967-11-18.economy]]. Names: Ackley, Johnson.'
    tags: [name:johnson-lyndon-b, name:ackley-gardner]
  - id: cal.1968-01-02.welfare
    when: Jan. 2
    date: '1968-01-02'
    thread: welfare
    also: [health]
    c: 'The LBJ Ranch. Social Security Amendments signed, [81 Stat. 821](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg821.pdf): benefits up at least 13 percent from March, for 24 million; the minimum from $44 to $55 a month; a retired couple''s maximum from $207 to $234, in time $323; earnings to $140 a month without loss of benefits; disabled widows covered. Johnson: the work incentive program, day care and family planning adopted; in place of other proposals Congress "substituted certain severe restrictions." A Commission on Income Maintenance Programs, Heineman its chairman.'
    n: 'Statement by the President Upon Signing the Social Security Amendments and Upon Appointing a Commission To Study the Nation''s Welfare Programs, [1968–69 Pub. Papers 14](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=92) (Jan. 2, 1968). Statute (K–J Cong. II.J.2). See [[cal.1967-11-22.welfare]]. Names: Heineman, Johnson.'
    tags: [name:johnson-lyndon-b, name:heineman-ben-w]
  - id: cal.1968-01-02.school-aid
    when: Jan. 2
    date: '1968-01-02'
    thread: school-aid
    c: 'The LBJ Ranch. Elementary and Secondary Education Amendments signed, [81 Stat. 783](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg783.pdf): the act extended two years; Title VII, the Bilingual Education Act, for children "whose first language is not English"; dropout prevention; programs for handicapped children. The conference report through the House, [286–73](https://voteview.com/rollcall/RH0900244), and the Senate, [63–3](https://voteview.com/rollcall/RS0900315), Dec. 15.'
    n: 'Statement by the President Upon Signing the Elementary and Secondary Education Amendments of 1967, [1968–69 Pub. Papers 15](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=93) (Jan. 2, 1968). Statute (K–J Cong. II.J.2). To check: [[w.graham-uncertain-triumph]]; [[w.bailey-esea]]. See [[cal.1965-01-12.school-aid]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-03.elections-1968
    when: Jan. 3
    date: '1968-01-03'
    thread: elections-1968
    c: Concord, N.H. McCarthy will enter the New Hampshire primary, Mar. 12 (Check the place).
    n: 'See [[cal.1967-11-30.elections-1968]]. Names: McCarthy.'
    tags: [name:mccarthy-eugene-j, state:nh]
  - id: cal.1968-01-03.opinion
    when: Jan. 3
    date: '1968-01-03'
    thread: opinion
    also: [vietnam, jobs-and-wages]
    c: 'Gallup, Dec. 7–12, 1967: Johnson''s handling of Vietnam: approve 39 percent, disapprove 49; union families 47 and 43. The United States made a mistake in sending troops: yes 45, no 46. 1968 a year of strikes and industrial disputes 64, of industrial peace 27.'
    n: '[[w.gallup-poll]], III, 2099. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-03.vietnam
    when: Jan. 3
    date: '1968-01-03'
    thread: vietnam
    c: 'Mai Văn Bộ in Paris to Westinghouse Broadcasting: talks at once if the bombing stops (Check). Restrikes near Hanoi held off, for the Cambodian and Romanian channels.'
    n: 'FRUS 1964–68, VI, docs. [3](https://history.state.gov/historicaldocuments/frus1964-68v06/d3), [4](https://history.state.gov/historicaldocuments/frus1964-68v06/d4). See [[cal.1967-12-29.vietnam]]. Names: Mai Văn Bộ.'
    tags: [name:mai-van-bo, name:johnson-lyndon-b]
  - id: cal.1968-01-05.war-opposition
    when: Jan. 5
    date: '1968-01-05'
    thread: war-opposition
    also: [draft]
    c: 'Boston. A federal grand jury indicts Spock, Coffin, Goodman, Ferber and Raskin: conspiracy to counsel, aid and abet registrants to refuse service and evade the draft, and to hinder its administration. The "Call to Resist Illegitimate Authority"; the draft cards turned in at the Justice Department, Oct. 20.'
    n: '*United States v. Spock*, [416 F.2d 165](https://static.case.law/f2d/416/case-pdfs/0165-01.pdf) (1st Cir. 1969), the appeal. To check: [[w.mitford-trial-of-dr-spock]]; [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]. See [[cal.1967-12-04.war-opposition]]. Names: Spock, Coffin, Goodman, Ferber, Raskin.'
    tags: [name:spock-benjamin, name:coffin-william-sloane-jr, name:goodman-mitchell, name:ferber-michael, name:raskin-marcus, state:ma, city:boston]
  - id: cal.1968-01-05.vietnam-packers
    when: Jan. 5
    date: '1968-01-05'
    thread: vietnam-packers
    c: Packers. Harriman with Macovescu, back from Hanoi, four hours.
    n: 'FRUS 1964–68, VI, doc. [5](https://history.state.gov/historicaldocuments/frus1964-68v06/d5). See [[cal.1967-11-21.vietnam]]. Names: Harriman, Macovescu.'
    tags: [name:harriman-w-averell, name:macovescu-gheorghe]
  - id: cal.1968-01-07.middle-east
    when: Jan. 7–8
    date: '1968-01-07'
    thread: middle-east
    c: 'Eshkol at the LBJ Ranch, with Rusk, McNamara and Wheeler. He asks for Phantoms: "There is no substitute." Johnson: no commitment to deliver them; McNamara to say by when a decision must be made to deliver them in January 1970, and crews to be trained against it; the Skyhawks'' delivery discussed. Joint statement, Jan. 8: Israel''s defense capability under "active and sympathetic examination and review"; support for Jarring''s mission under Resolution 242.'
    n: 'Joint Statement Following Discussions With Prime Minister Eshkol of Israel, [1968–69 Pub. Papers 20](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=98) (Jan. 8, 1968). FRUS 1964–68, XX, docs. [39](https://history.state.gov/historicaldocuments/frus1964-68v20/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v20/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v20/d41). [[w.poole-joint-chiefs-of-staff-2012]], 181–182 (the talks). To check: [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.quandt-peace-process]]. See [[cal.1967-11-22.middle-east]]. Names: Eshkol, Rusk, McNamara, Wheeler, Jarring, Johnson.'
    src:
      c: 538e36a1
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=98: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v20/d39: all'
        - 'w.poole-joint-chiefs-of-staff-2012 181–182: A-E'
        - 'via w.poole-joint-chiefs-of-staff-2012 182 n.79: A-E'
    tags: [name:eshkol-levi, name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:jarring-gunnar-v]
  - id: cal.1968-01-07.opinion
    when: Jan. 7
    date: '1968-01-07'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Dec. 7–12, 1967: Johnson 39 percent, Nixon 30, McCarthy as a "peace candidate" 12, Wallace as a third party''s 11, undecided 8. Democrats: Johnson 62, McCarthy 12, Wallace 11, Nixon 9. South: Johnson 31, Wallace 29, Nixon 28, McCarthy 7. Johnson and Nixon alone: Johnson 46, Nixon 41, undecided 13.'
    n: '[[w.gallup-poll]], III, 2099–2100. Names: Johnson, Nixon, McCarthy, Wallace.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:mccarthy-eugene-j, name:wallace-george-c]
  - id: cal.1968-01-08.vietnam
    when: Jan. 8–12
    date: '1968-01-08'
    thread: vietnam
    c: Bowles in Phnom Penh. Joint communiqué, Jan. 12. Sihanouk asks the ICC, in writing, for a stronger commission with mobile teams; asks the United States for what it knows of Viet Cong and North Vietnamese units on Cambodian soil, his troops to move them off; wishes to restore relations. Cambodia had broken them in May 1965.
    n: 'FRUS 1964–68, XXVII, docs. [226](https://history.state.gov/historicaldocuments/frus1964-68v27/d226), [228](https://history.state.gov/historicaldocuments/frus1964-68v27/d228), [229](https://history.state.gov/historicaldocuments/frus1964-68v27/d229). To check: [[w.bowles-promises-to-keep]]; [[w.clymer-troubled-relations]]. Names: Bowles, Sihanouk.'
    tags: [name:bowles-chester, name:norodom-sihanouk, place:phnom-penh]
  - id: cal.1968-01-08.vietnam-2
    when: Jan. 8
    date: '1968-01-08'
    thread: vietnam-khe-sanh
    c: 'Carver to Helms, "The Enemy Threat to Khe Sanh": elements of four North Vietnamese divisions moved into the area; the enemy''s aim at least to force the base''s abandonment, at most to draw and tie down American reinforcements.'
    n: 'Carver''s memorandum, Jan. 8, cited in a note to FRUS 1964–68, VI, doc. [12](https://history.state.gov/historicaldocuments/frus1964-68v06/d12). Made public: FRUS 1964–68, VI (2002). To check: [[w.prados-valley-of-decision]]; [[w.pisor-end-of-the-line]]. See [[cal.1967-12-19.vietnam-2]]. Names: Carver, Helms.'
    tags: [name:carver-george-a-jr, name:helms-richard]
  - id: cal.1968-01-10.state-constitutions-md
    when: Jan. 10
    date: '1968-01-10'
    thread: state-constitutions
    c: Maryland's constitutional convention adjourns, its constitution to go to the voters May 14 (Check the vote on adoption).
    n: '[Archives of Maryland, "Constitutional Convention, 1967–1968"](https://www.msa.maryland.gov/msa/speccol/sc2600/sc2685/html/conv1967.html). See [[cal.1967-09-12.state-constitutions-md]].'
    tags: [state:md]
  - id: cal.1968-01-10.opinion
    when: Jan. 10
    date: '1968-01-10'
    thread: opinion
    c: 'Gallup, Dec. 7–12, 1967: the man most admired, in order of mention: Eisenhower, Johnson, Billy Graham, Robert Kennedy, Pope Paul VI, Dirksen, Nixon, Wallace, Reagan, Truman.'
    n: '[[w.gallup-poll]], III, 2100–01. Names: Eisenhower, Johnson, Graham, Kennedy, Paul VI, Dirksen, Nixon, Wallace, Reagan, Truman.'
    tags: [name:eisenhower-dwight-d, name:johnson-lyndon-b, name:graham-billy, name:kennedy-robert-f, name:paul-vi, name:dirksen-everett, name:nixon-richard-m, name:wallace-george-c, name:reagan-ronald, name:truman-harry-s]
  - id: cal.1968-01-13.vietnam-khe-sanh
    when: Jan. 13
    date: '1968-01-13'
    thread: vietnam-khe-sanh
    c: 'Wheeler to McNamara: against both a preemptive offensive into Laos and a withdrawal from Khe Sanh.'
    n: 'FRUS 1964–68, VI, doc. [12](https://history.state.gov/historicaldocuments/frus1964-68v06/d12). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-08.vietnam-2]]. Names: Wheeler, McNamara.'
    tags: [name:wheeler-earle, name:mcnamara-robert-s]
  - id: cal.1968-01-14.opinion
    when: Jan. 14
    date: '1968-01-14'
    thread: opinion
    also: [vietnam, elections-1968-polls]
    c: 'Gallup, Dec. 7–12, 1967, a hawk or a dove on Vietnam: Johnson, hawk 66 percent, dove 18. Nixon 46 and 26. Reagan 39 and 27. Wallace 37 and 20. Rockefeller 28 and 30. Robert Kennedy 25 and 54. Romney 21 and 39. McCarthy 11 and 52.'
    n: '[[w.gallup-poll]], III, 2101. Names: Johnson, Nixon, Reagan, Wallace, Rockefeller, Kennedy, Romney, McCarthy.'
    tags: [name:johnson-lyndon-b, name:nixon-richard-m, name:reagan-ronald, name:wallace-george-c, name:rockefeller-nelson, name:kennedy-robert-f, name:romney-george-w, name:mccarthy-eugene-j]
  - id: cal.1968-01-15.congress
    when: Jan. 15
    date: '1968-01-15'
    thread: congress
    c: The 90th Congress's second session opens. The State of the Union set for Jan. 17.
    n: '[114 Cong. Rec., Senate, Jan. 15, 1968](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt1/pdf/GPO-CRECB-1968-pt1-1-1.pdf); [House](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt1/pdf/GPO-CRECB-1968-pt1-1-2.pdf). See [[cal.1967-12-15.congress]].'
  - id: cal.1968-01-15.war-opposition
    when: Jan. 15
    date: '1968-01-15'
    thread: war-opposition
    also: [women]
    c: 'The Jeannette Rankin Brigade: some 5,000 women march from Union Station toward the Capitol on the session''s opening day; Rankin, 87, the first woman in Congress, who voted against war in 1917 and 1941, carries a petition to the Speaker (Check the numbers).'
    n: 'To check: [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Rankin.'
    tags: [name:rankin-jeannette, city:washington]
  - id: cal.1968-01-15.desegregation-schools-boston
    when: Jan. 15
    date: '1968-01-15'
    thread: desegregation-schools
    also: [court]
    c: The Supreme Court dismisses the Boston School Committee's appeal from the Supreme Judicial Court "for want of a substantial federal question." The Racial Imbalance Act stands.
    n: '*School Committee of Boston v. Board of Education*, [389 U.S. 572](https://tile.loc.gov/storage-services/service/ll/usrep/usrep389/usrep389572/usrep389572.pdf) (1968) (per curiam). See [[cal.1967-06-09.desegregation-schools-boston]].'
    tags: [state:ma, city:boston]
  - id: cal.1968-01-15.vietnam-tet
    when: Jan. 15
    date: '1968-01-15'
    thread: vietnam-tet
    c: 'The day for the general offensive set: the night of Jan. 30–31, the eve of Tet. The commands in the South given a little more than two weeks.'
    n: '[[w.nguyen-hanois-war]], 108. See [[cal.1968-01.vietnam-tet]].'
  - id: cal.1968-01-16.europe-and-the-alliance
    when: Jan. 16
    date: '1968-01-16'
    thread: europe-and-the-alliance
    also: [middle-east, economy]
    c: 'London. Wilson to the Commons, the cuts after devaluation: British forces out of the Far East and the Persian Gulf by the end of 1971, no bases outside Europe and the Mediterranean but in the remaining dependencies; the F-111 order cancelled. Johnson to Wilson, Jan. 11, on Rusk''s report of the plan: "tantamount to British withdrawal from world affairs." Wilson to Johnson, Jan. 15: the sacrifices at home "pointless without drastic retrenchment abroad."'
    n: '[H.C. Deb., Jan. 16, 1968, vol. 756, cols. 1577–1620](https://api.parliament.uk/historic-hansard/commons/1968/jan/16/public-expenditure). FRUS 1964–68, XII, docs. [289](https://history.state.gov/historicaldocuments/frus1964-68v12/d289), [291](https://history.state.gov/historicaldocuments/frus1964-68v12/d291). To check: [[w.dockrill-britains-retreat-from-east]]; [[w.wilson-labour-government-1964-1970]]; [[w.pimlott-harold-wilson]]. See [[cal.1967-11-18.economy]]. Names: Wilson, Johnson, Rusk.'
    tags: [name:wilson-harold, name:johnson-lyndon-b, name:rusk-dean]
  - id: cal.1968-01-16.antisubversion
    when: Jan. 16
    date: '1968-01-16'
    thread: antisubversion
    also: [court]
    c: '*Schneider v. Smith*, [390 U.S. 17](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390017/usrep390017.pdf): the Magnuson Act gives the President no authority to screen merchant seamen by their beliefs and associations; the Coast Guard may not refuse to validate the papers of an engineer who would not answer its questions on his memberships and his political philosophy. Douglas for the Court; White, with Harlan, concurring in the result; Marshall took no part.'
    n: 'To check: [[w.powe-warren-court-and-american]]. See [[cal.1967-12-13.antisubversion]].'
  - id: cal.1968-01-16.king-poor-peoples
    when: Jan. 16
    date: '1968-01-16'
    thread: king-poor-peoples
    c: 'Atlanta, Ebenezer, SCLC''s staff retreat. King to the press: the campaign to open in early April; "jobs or income"; the demands in March, a negative income tax or a guaranteed annual income still to be chosen; blocking traffic "a last resort."'
    n: '[[w.garrow-bearing-the-cross]], 592–93. To check: King, "Press Conference," Jan. 16, 1968 (King Papers), as Garrow cites it (717 n.20). See [[cal.1967-12-04.king]]. Names: King.'
    tags: [name:king-martin-luther-jr, state:ga, city:atlanta]
  - id: cal.1968-01-17.program
    when: Jan. 17
    date: '1968-01-17'
    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9:05 p.m. "Our country is challenged, at home and abroad." Asked: a $2.1 billion manpower program, 500,000 of the hard-core unemployed in private jobs within three years; model cities at the full $1 billion authorized; a ten-year campaign for 6 million housing units for low- and middle-income families, 300,000 begun next year; a child health program, prenatal care through the first year; truth in lending and the other consumer bills, a consumer counsel in the Justice Department; the Safe Streets Act, $100 million, and a gun control law; a Drug Control Act; the civil rights bills, fair housing among them; the surcharge, "about a penny out of each dollar''s income"; the gold reserves freed. The 1969 budget on the new basis: about $186 billion spent, $178 billion received. Vietnam: "America will persevere"; talks to follow the San Antonio formula. The nonproliferation treaty to the Senate this year.'
    n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=103) (Jan. 17, 1968). [[w.johnson-vantage-point]], 380 (Vietnam in the address); [[w.dallek-flawed-giant]], 513–17. To check: [[w.zelizer-fierce-urgency-of-now]]; [[w.bernstein-guns-or-butter]]; [[w.califano-triumph-and-tragedy-of]]. See [[cal.1967-01-10.program]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
    short: State of the Union
    to:
      - testing-npt
      - jobs-and-wages
      - open-housing
      - economy
      - school-aid
      - consumers
      - crime-and-hijacking
      - foreign-aid
      - cities-and-housing
      - farm
      - health
  - id: cal.1968-01-17.elections-1968
    when: Jan. 17
    date: '1968-01-17'
    thread: elections-1968
    c: 'Johnson goes to the Capitol for the State of the Union without the statement withdrawing from the race, Christian''s, from Busby''s draft: "I have prayerfully concluded that I will not be a candidate for reelection." He would not have read it, he writes; Christian told to keep it up to date.'
    n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=103) (Jan. 17, 1968) (the address). [[w.johnson-vantage-point]], 429–30. See [[cal.1967-10-03.vietnam]]. Names: Johnson, Christian, Busby.'
    src:
      c: cd3658c1
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=103: A'
        - 'w.johnson-vantage-point 429–30: all'
    tags: [name:johnson-lyndon-b, name:christian-george, name:busby-horace]
  - id: cal.1968-01-18.testing
    when: Jan. 18
    date: '1968-01-18'
    thread: testing-npt
    c: 'Geneva. The United States and the Soviet Union, the Eighteen-Nation Disarmament Committee''s co-chairmen, table a complete draft of the nonproliferation treaty, Article III on safeguards agreed. Johnson: the text to the General Assembly in the spring; he hopes to send it to the Senate this year.'
    n: 'Statement by the President on the Nuclear Nonproliferation Treaty To Be Presented to the Eighteen-Nation Disarmament Committee, [1968–69 Pub. Papers 36](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=114) (Jan. 18, 1968). See [[cal.1967-08-24.testing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-18.war-opposition
    when: Jan. 18
    date: '1968-01-18'
    thread: war-opposition
    also: [women]
    c: 'The White House, Lady Bird Johnson''s Women Doers'' Luncheon on crime in the streets. Eartha Kitt, a guest, to the President''s wife: the young rebel in the streets against the war and the draft (Check the words).'
    n: '[[w.johnson-white-house-diary]], Jan. 18, 1968. Made public: the CIA''s file on Kitt, *New York Times*, Jan. 3, 1975 (Check). Names: Lady Bird Johnson, Kitt.'
    tags: [name:johnson-lady-bird, name:kitt-eartha, city:washington]
  - id: cal.1968-01-19.defense
    when: Jan. 19
    date: '1968-01-19'
    thread: defense-clifford
    also: [transition-and-staff]
    c: 'News conference: McNamara to leave by Mar. 1, for the World Bank; Clifford to succeed him.'
    n: 'The President''s News Conference, [1968–69 Pub. Papers 38](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=116) (Jan. 19, 1968). [[w.drea-mcnamara-clifford-and-the-2011]], 185 (Clifford''s selection). To check: [[w.clifford-counsel-to-the-president-2]]; [[w.acacia-clark-clifford]]. See [[cal.1967-11-29.defense]]. Names: McNamara, Clifford, Johnson.'
    src:
      c: 88741c52
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=116: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 185: B'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:clifford-clark]
  - id: cal.1968-01-21.vietnam
    when: Jan. 21–22
    date: '1968-01-21'
    thread: vietnam-khe-sanh
    c: 'Before dawn, Jan. 21, North Vietnamese troops attack Hill 861 and shell the combat base; its main ammunition dump blown up. The siege of the 26th Marines, some 6,000 men with the South Vietnamese rangers (Check), by elements of at least two North Vietnamese divisions. McNamara to Johnson, Jan. 22: "the long-expected attack on Khe Sanh" begun; Westmoreland "fully prepared." Niagara, the bombing around the base, about 40 B-52 and 500 tactical sorties a day.'
    n: '[Johnson and McNamara, 8:27 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-january-22-1968), Jan. 22, Conversation WH6801-01-12608 (Miller Center). FRUS 1964–68, VI, doc. [22](https://history.state.gov/historicaldocuments/frus1964-68v06/d22). [[w.frankum-like-rolling-thunder]], 70–72; [[w.vietnam-victory-in-vietnam]], 215–17, 222–23, 229–30, 467 n.20; [[w.cosmas-joint-chiefs-of-staff]], 142 (the attack; the dump; the defenders; Niagara). Made public: FRUS 1964–68, VI (2002). To check: [[w.prados-valley-of-decision]]; [[w.pisor-end-of-the-line]]; [[w.hammel-khe-sanh]]; [[w.shulimson-u-s-marines-in-1997]]; [[w.al-chien-dich-tien-cong]]; [[w.westmoreland-soldier-reports]]. See [[cal.1968-01-08.vietnam-2]]. Names: McNamara, Westmoreland, Johnson. Check: Cosmas, 142, gives about 5,700 Marines and 500 South Vietnamese Rangers after the reinforcements, against an estimated 20,000–25,000 North Vietnamese. Check: *Victory in Vietnam* opens the Route 9 front the night of Jan. 20, to draw American forces from the cities; the siege from Feb. 10; for the 170 days, 17,000 of the enemy put out of action, 13,000 Americans among them, and 480 aircraft (216–17, 222, 230).'
    src:
      c: 8507c865
      rows:
