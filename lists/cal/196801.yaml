  - id: cal.1968-01-02.economy
    when: Jan. 2–6
    date: '1968-01-02'
    thread: economy
    also: [europe-and-the-alliance]
    c: 'Katzenbach, Deming and Roth in Europe on the program of Jan. 1: London, Jan. 2, Jenkins; Bonn; the Swiss officials and bankers, Jan. 3; the Commission at Brussels, Rey, Jan. 3–4; the Belgians and the Dutch, Jan. 4; Rome, Jan. 5, Fanfani; Paris, Debré and American businessmen; Chequers, Jan. 6, Wilson. Leaving Rome, Katzenbach answers Fanfani, who has tied the deficit to Vietnam: the deficit would be there without the war. Trezise in Scandinavia and Luxembourg.'
    n: '[FRUS 1964–68, VIII: International Monetary and Trade Policy, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v08/d174) (the report; Bonn, Brussels and The Hague; Paris, Debré and the businessmen; Trezise; its notes: the Swiss, Jan. 3, Wilson); [doc. 172](https://history.state.gov/historicaldocuments/frus1964-68v08/d172) (the Belgians, the Commission and Rey, the Dutch, Fanfani and the answer at the airport; its notes: Jan. 3–5); [FRUS 1964–68, XII: Western Europe, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v12/d286) (Chequers, Jan. 6; Jenkins "last Tuesday," Jan. 2; its note: the Community''s capitals and Switzerland, Jan. 2–6); [FRUS 1964–68, XIII: Western Europe Region, doc. 284](https://history.state.gov/historicaldocuments/frus1964-68v13/d284), n.2 (Bonn, reported Jan. 3). [[w.gavin-gold-dollars-and-power]], 178 (officials sent to Europe, Japan and Canada to explain the program). Made public: FRUS 1964–68, VIII (1998). Check: the days in Bonn and Paris; where the Swiss were seen (reported from Brussels). To check: Katzenbach''s country-by-country summary, sent to Mills, Jan. 16, 1968, Department of State, Central Files, ORG 7 U (cited by FRUS 1964–68, VIII, doc. 174, n.1). See [[cal.1968-01-01.economy]]. Names: Katzenbach, Deming, Roth, Jenkins, Rey, Fanfani, Debré, Wilson, Trezise.'
