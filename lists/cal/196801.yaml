    date: '1968-01-22'
    place: washington
    thread: economy-surcharge
    c: 'Ways and Means resumes and closes its public hearings on the surcharge: Fowler, Schultze, Martin and Ackley, both days. Mills unmoved: the inflation cost-push, not demand-pull; little sign of cuts in spending. Byrnes agrees.'
