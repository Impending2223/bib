    thread: program
    also: [vietnam]
    c: 'State of the Union, to a joint session, 9:05 p.m. "Our country is challenged, at home and abroad." Asked: a $2.1 billion manpower program, 500,000 of the hard-core unemployed in private jobs within three years; model cities at the full $1 billion authorized; a ten-year campaign for 6 million housing units for low- and middle-income families, 300,000 begun next year; a child health program, prenatal care through the first year; truth in lending and the other consumer bills, a consumer counsel in the Justice Department; the Safe Streets Act, $100 million, and a gun control law; a Drug Control Act; the civil rights bills, fair housing among them; the surcharge, "about a penny out of each dollar''s income"; the gold reserves freed. The 1969 budget on the new basis: about $186 billion spent, $178 billion received. Vietnam: "America will persevere"; talks to follow the San Antonio formula. The nonproliferation treaty to the Senate this year.'
    n: 'Annual Message to the Congress on the State of the Union, [1968–69 Pub. Papers 25](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=103) (Jan. 17, 1968). [[w.johnson-vantage-point]], 380 (Vietnam in the address); [[w.dallek-flawed-giant]], 513–17 (the address; the Safe Streets Act; the surcharge); [[w.califano-triumph-and-tragedy-of]], 255–57 (under 4,000 words asked, 4,070 delivered; the Cabinet one an hour in Califano''s office from 9 a.m. the day before; Rayburn''s "very warm welcome"; no clapping for the tax or civil rights; "a really true ceasefire"); [[w.branch-at-canaans-edge]], 674 ("Why then this restlessness?"); [[w.kotz-judgment-days]], 380; [[w.schwartz-lyndon-johnson-and-europe]], 198 (the State of the Union address of Jan. 17, 1968, calling for legislation lifting the gold cover; not the hour, the other requests or the quotations); [[w.mann-grand-delusion]], 570 (the State of the Union, the evening of Jan. 17: "The enemy has been defeated in battle after battle"; the South Vietnamese under the government''s protection up "by more than a million since January of last year"; not the hour, the program asked or "America will persevere"); [[w.dallek-flawed-giant]], 502 (Jan. 17, the State of the Union: the enemy''s hope that "America''s will to persevere can be broken. Well—he is wrong. America will persevere"; readiness to halt the bombing and talk; not the domestic program or the hour); [[w.johnson-white-house-diary]], 618–20 (Jan. 17: her guests, the Medal of Honor man Specialist Lawrence Joel, a VISTA worker, a Teacher Corps teacher and a Job Corps youth; Johnson received "a thundering applause which lasted three minutes"; the speech "forty-nine minutes," "about fifty applauses," the loudest for "The American people have had enough of rising crime and lawlessness"; a late insertion on highway beautification; the teleprompter failed and he interpolated; in the Speaker''s office "no rush forward" from the Cabinet or the leaders; Jan. 18, the Eastern metropolitan papers "largely negative or unenthusiastic"; not the hour of 9:05). [[w.longley-lbjs-1968]], 23–28 (the address; the manpower program, housing, Safe Streets and guns, the surcharge, Vietnam). To check: Johnson, *AWhite House Diary* (1970), 616–29 (cited by [[w.branch-at-canaans-edge]], 674); [*New York Times*, Jan. 18, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/18/issue.html), at 1, 16, 17 (cited by [[w.branch-at-canaans-edge]], 674); [*New York Times*, Jan. 19, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/19/issue.html), at 46 (cited by [[w.branch-at-canaans-edge]], 674); [[w.garrow-bearing-the-cross]], 594 (cited by [[w.branch-at-canaans-edge]], 674); " "Red Ink'' to Flood Government''s Books?," *U.S. News & World Report*, May 29, 1967, at 31 (cited by [[w.branch-at-canaans-edge]], 675); [*New York Times*, Jan. 30, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/30/issue.html), at 1, 16 (cited by [[w.branch-at-canaans-edge]], 675); Califano to LBJ, Dec. 4, 1967, Box 31, WES, LBJ (cited by [[w.branch-at-canaans-edge]], 675); Califano to LBJ on budget message from Sargent Shriver, Jan. 9, 1968, Box 98, WE9, LBJ (cited by [[w.branch-at-canaans-edge]], 675). See [[cal.1967-01-10.program]]. Names: Johnson.'
