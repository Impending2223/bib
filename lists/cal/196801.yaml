  - id: cal.1968-01-04.elections-1968-johnson
    when: Jan. 4
    date: '1968-01-04'
    thread: elections-1968-johnson
    c: 'LBJ Ranch, after dinner. Johnson, Mrs. Johnson and John and Nellie Connally talk nearly three hours in his bedroom on whether he should run. Connally: "You ought to run only if you look forward to being President again"; "You also ought not to run just to keep somebody else from being President." Nellie Connally: after a decision not to run, "an ephemeral period" of sadness, then "a great wave of relief." Johnson says he feels older and more tired than ten years ago. Announcing at the end of the State of the Union Message is raised: it "would negate the whole message." Connally: "The only way to answer all of those arguments is to die in office." Mrs. Johnson sees "no hint" that Connally will reconsider and run again for Governor.'
    n: '[[w.johnson-white-house-diary]], 611–12 (Lady Bird Johnson''s account). Made public: 1970. Names: Johnson, Connally, Lady Bird Johnson.'
