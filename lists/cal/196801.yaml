  - id: cal.1968-01-23.jobs-and-wages
    when: Jan. 23
    date: '1968-01-23'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Message on manpower, "To Earn a Living: The Right of Every American": $2.1 billion for fiscal 1969. JOBS, Job Opportunities in the Business Sector: government and industry to train and hire the hard-core unemployed of the fifty largest cities, $350 million, 100,000 at work by June 1969, 500,000 by June 1971. A National Alliance of Businessmen to enlist the employers, Henry Ford II its chairman. The Concentrated Employment Program enlarged.'
    n: 'Special Message to the Congress: "To Earn a Living: The Right of Every American", [1968–69 Pub. Papers 46](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=124) (Jan. 23, 1968). [[w.califano-triumph-and-tragedy-of]], 224 (the message, "To Earn a Living: The Right of Every American"; the Alliance to be announced with it). To check: [[w.davies-from-opportunity-to-entitlement]]. See [[cal.1968-01-17.program]]. Names: Henry Ford II, Johnson.'
    tags: [name:johnson-lyndon-b, name:ford-henry-ii]
    short: the manpower message, JOBS
