  - id: cal.1968-01-23.jobs-and-wages
    when: Jan. 23
    date: '1968-01-23'
    thread: jobs-and-wages
    also: [poverty]
    c: 'Message on manpower, "To Earn a Living: The Right of Every American": $2.1 billion for fiscal 1969. JOBS, Job Opportunities in the Business Sector: government and industry to train and hire the hard-core unemployed of the fifty largest cities, $350 million, 100,000 at work by June 1969, 500,000 by June 1971. A National Alliance of Businessmen to enlist the employers, Henry Ford II its chairman. The Concentrated Employment Program enlarged.'
    n: 'Special Message to the Congress: "To Earn a Living: The Right of Every American", [1968–69 Pub. Papers 46](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=124) (Jan. 23, 1968). To check: [[w.davies-from-opportunity-to-entitlement]]; [[w.zelizer-fierce-urgency-of-now]]. See [[cal.1968-01-17.program]]. Names: Henry Ford II, Johnson.'
    tags: [name:johnson-lyndon-b, name:ford-henry-ii]
  - id: cal.1968-01-24.japan-and-korea-blue-house
    when: Jan. 24
    date: '1968-01-24'
    thread: japan-and-korea-blue-house
    c: 'Bonesteel: some 2,400 men in the North''s special units, two years in training. Porter to Park, on Rusk''s instructions: no reprisals. Park: the North should have been asked for an assurance against more raids.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [145](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d145), [146](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d146). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-21.japan-and-korea]]. Names: Bonesteel, Porter, Park, Rusk.'
    tags: [name:park-chung-hee, name:bonesteel-charles-h-iii, name:porter-william-j, name:rusk-dean]
  - id: cal.1968-01-24.japan-and-korea-pueblo
    when: Jan. 24
    date: '1968-01-24'
    thread: japan-and-korea-pueblo
    c: 'Panmunjom, the Military Armistice Commission: Rear Admiral Smith asks for the *Pueblo*, the crew and an apology.'
    n: 'FRUS 1964–68, XXIX, pt. 1, docs. [217](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d217), [220](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d220). Made public: FRUS 1964–68, XXIX, pt. 1 (2000). See [[cal.1968-01-23.japan-and-korea]]. Names: Smith.'
    tags: [name:smith-john-v]
  - id: cal.1968-01-24.open-housing
    when: Jan. 24
    date: '1968-01-24'
    thread: open-housing
    also: [civil-rights-the-executive]
    c: 'Message on civil rights. Asked again: federal penalties for force and threats against those exercising their civil rights, the bill the House passed in August; cease-and-desist powers for the Equal Employment Opportunity Commission; random selection of federal juries from the voter lists, the Senate''s bill, before the House; discrimination barred in choosing State juries; fair housing in three stages, at last all housing, HUD to enforce it and the Attorney General to sue against patterns of discrimination.'
    n: 'Special Message to the Congress on Civil Rights, [1968–69 Pub. Papers 55](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=133) (Jan. 24, 1968). [[w.dallek-flawed-giant]], 517 (the message; fair housing). To check: [[w.graham-civil-rights-era]]; [[w.kotz-judgment-days]]. See [[cal.1968-01-17.program]]; [[cal.1967-08-16.open-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-24.opinion
    when: Jan. 24
    date: '1968-01-24'
    thread: opinion
    also: [economy, vietnam, poverty]
    c: 'Gallup, two releases. Jan. 4–9: prices and wages frozen at their present level as long as the Vietnam war lasts: a good idea 46 percent, a poor idea 43, no opinion 11. Dec. 7–12, 1967: the smallest amount a family of four needs each week to get along in this community, the median: $102. The family''s food, including milk, each week, median: $29.'
    n: '[[w.gallup-poll]], III, 2103.'
  - id: cal.1968-01-25.transition-and-staff
    when: Jan. 25
    date: '1968-01-25'
    thread: transition-and-staff
    c: Gardner resigns as Secretary of Health, Education, and Welfare, from Mar. 1, after two and a half years.
    n: 'Letter Accepting Resignation of John W. Gardner as Secretary of Health, Education, and Welfare, [1968–69 Pub. Papers 67](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=145) (Jan. 25, 1968). To check: [[w.califano-triumph-and-tragedy-of]]. Names: Gardner, Johnson.'
    tags: [name:gardner-john-w, name:johnson-lyndon-b]
  - id: cal.1968-01-25.japan-and-korea
    when: Jan. 25
    date: '1968-01-25'
    thread: japan-and-korea-pueblo
    c: 'Executive Order 11392: units of the Naval Reserve, the Air Force Reserve and the Air National Guard to active duty for up to 24 months, some 14,600 men (Check).'
    n: '[Executive Order 11392](https://www.presidency.ucsb.edu/documents/executive-order-11392-ordering-certain-units-the-ready-reserve-the-naval-reserve-air-force) (Jan. 25, 1968). See [[cal.1968-01-23.japan-and-korea]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-25.defense-clifford
    when: Jan. 25
    date: '1968-01-25'
    thread: defense-clifford
    also: [vietnam]
    c: 'Clifford before Senate Armed Services on his nomination: no halt in the bombing now; under the San Antonio formula Hanoi would go on sending "the normal amount of goods, munitions, and men" south during talks, but must "not take advantage" of the halt.'
    n: 'FRUS 1964–68, VI, doc. [27](https://history.state.gov/historicaldocuments/frus1964-68v06/d27). *Nomination of Clark M. Clifford: Hearing before the Senate Committee on Armed Services*, 90th Cong., 2d sess. (1968) (Check: the title and a copy). See [[cal.1968-01-19.defense]]. Names: Clifford.'
    tags: [name:clifford-clark]
  - id: cal.1968-01-26.japan-and-korea-pueblo
    when: Jan. 26
    date: '1968-01-26'
    thread: japan-and-korea-pueblo
    c: '3:58 p.m., Johnson''s address from the Fish Room: the raid on Seoul and the *Pueblo*; the question before the Security Council; "precautionary measures," no reduction of the forces in Vietnam. The Security Council meets on the American complaint, Goldberg for the United States (Check the day).'
    n: 'The President''s Address to the Nation: The Situation With North Korea, [1968–69 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=155) (Jan. 26, 1968). FRUS 1964–68, XXIX, pt. 1, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d228), [229](https://history.state.gov/historicaldocuments/frus1964-68v29p1/d229). See [[cal.1968-01-23.japan-and-korea]]. Names: Johnson, Goldberg.'
    tags: [name:johnson-lyndon-b, name:goldberg-arthur-j]
  - id: cal.1968-01-27.civil-disorders
    when: Jan. 27
    date: '1968-01-27'
    thread: civil-disorders
    also: [cities-and-housing]
    c: 'The National Advisory Panel on Insurance in Riot-Affected Areas, Governor Hughes of New Jersey its chairman, reports, *Meeting the Insurance Crisis of Our Cities*: the industry, the States and the federal government to share the risk of insuring property in the cities'' riot areas; plans in each State for fair access to insurance, a federal reinsurance corporation behind them (Check). HUD to draft the federal legislation.'
    n: 'Statement by the President Upon Releasing Report of the President''s National Advisory Panel on Insurance in Riot-Affected Areas, [1968–69 Pub. Papers 77](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=155) (Jan. 27, 1968). See [[cal.1967-07-27.civil-disorders]]. Names: Hughes, Johnson.'
    tags: [name:hughes-richard-j, name:johnson-lyndon-b]
  - id: cal.1968-01-27.defense-thule
    when: Jan. 27
    date: '1968-01-27'
    thread: defense-thule
    also: [europe-and-the-alliance]
    c: 'Leddy to Ronne: in 1957 the United States had told Prime Minister Hansen of its need to store weapons at Thule.'
    n: 'FRUS 1964–68, XII, doc. [4](https://history.state.gov/historicaldocuments/frus1964-68v12/d4). Made public: FRUS 1964–68, XII (2001); the 1957 exchange, in Denmark, 1995 (Check). See [[cal.1968-01-21.defense]]. Names: Leddy, Ronne, Hansen.'
    tags: [name:leddy-john-m, name:ronne-torben, name:hansen-hans-c-s]
  - id: cal.1968-01-27.jobs-and-wages
    when: Jan. 27
    date: '1968-01-27'
    thread: jobs-and-wages
    c: 'Johnson at lunch with the leaders of the National Alliance of Businessmen, 1:25 to 3:45 p.m.: the *Pueblo*, the economic indicators, the budget, Vietnam.'
    n: 'Talking Points of the President at a Luncheon for the National Alliance of Businessmen, [1968–69 Pub. Papers 78](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=156) (Jan. 27, 1968). FRUS 1964–68, VI, doc. [29](https://history.state.gov/historicaldocuments/frus1964-68v06/d29). See [[cal.1968-01-23.jobs-and-wages]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-29.vietnam-khe-sanh
    when: Jan. 29
    date: '1968-01-29'
    thread: vietnam-khe-sanh
    c: 'The Joint Chiefs to Johnson, in writing, at his request: Westmoreland "can hold Khe Sanh and we should hold Khe Sanh"; they concur.'
    n: 'FRUS 1964–68, VI, docs. [30](https://history.state.gov/historicaldocuments/frus1964-68v06/d30), [35](https://history.state.gov/historicaldocuments/frus1964-68v06/d35) (Johnson to the Democratic leaders, Jan. 30). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-01-21.vietnam]]. Names: Westmoreland, Wheeler, Johnson.'
    tags: [name:wheeler-earle, name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1968-01-29.economy
    when: Jan. 29
    date: '1968-01-29'
    thread: economy
    also: [vietnam]
    c: 'Budget for fiscal 1969, the first on the unified basis the Commission on Budget Concepts proposed, the trust funds included: outlays $186.1 billion, $3.3 billion of it net lending; revenues $178.1 billion with the 10 percent surcharge, from Jan. 1 for corporations and Apr. 1 for individuals, the excises extended and corporate payments speeded; deficit $8.0 billion, against $19.8 billion in 1968. Vietnam about $25 billion a year. The same day Zwick sworn in as Budget Director, Schultze''s successor.'
    n: 'Annual Budget Message to the Congress, Fiscal Year 1969, [1968–69 Pub. Papers 83](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=161) (Jan. 29, 1968); Remarks at the Swearing In of Charles Zwick as Director, Bureau of the Budget, [1968–69 Pub. Papers 80](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=158) (Jan. 29, 1968). [[w.zelizer-taxing-america]], 262 (the unified budget). To check: [[w.bernstein-guns-or-butter]]. See [[cal.1967-11-29.economy]]. Names: Zwick, Schultze, Johnson.'
    tags: [name:johnson-lyndon-b, name:zwick-charles-j, name:schultze-charles-l, budget:1969]
  - id: cal.1968-01-29.court
    when: Jan. 29
    date: '1968-01-29'
    thread: court
    also: [crime-and-hijacking]
    c: '*Marchetti v. United States*, [390 U.S. 39](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390039/usrep390039.pdf), and *Grosso v. United States*, [390 U.S. 62](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390062/usrep390062.pdf): the privilege against self-incrimination a full defense to prosecution under the federal wagering tax laws, whose registration and payment would incriminate a man whose wagering is a crime; *Kahriger* (1953) and *Lewis* (1955) overruled. Harlan for the Court; Warren dissenting. *Haynes v. United States*, [390 U.S. 85](https://tile.loc.gov/storage-services/service/ll/usrep/usrep390/usrep390085/usrep390085.pdf): the same for the National Firearms Act''s registration of weapons.'
    n: 'To check: [[w.powe-warren-court-and-american]].'
  - id: cal.1968-01-29.oil
    when: Jan. 29
    date: '1968-01-29'
    thread: oil
    c: 'Johnson, Proclamation 3823: 1967''s import licenses left unused in the Middle East crisis good in 1968 (crude, through 1969); allocations for refiners exporting products and petrochemicals; District V under Puerto Rico''s rule on shipments; oil from tar sands counted as crude. No White House release.'
    n: '[Proclamation 3823](https://www.presidency.ucsb.edu/documents/proclamation-3823-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [33 Fed. Reg. 1171](https://www.govinfo.gov/app/details/FR-1968-01-30). See [[cal.1967-11-09.oil]]; [[cal.1967-06-06.oil]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1968-01-30.robert-kennedy
    when: Jan. 30
    date: '1968-01-30'
    thread: robert-kennedy
    also: [elections-1968]
    c: 'Washington, a breakfast with reporters at the National Press Club: Robert Kennedy will not oppose Johnson for the nomination "under any foreseeable circumstances."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 839–41. To check: [[w.thomas-robert-kennedy]]; [[w.shesol-mutual-contempt]]; [[w.witcover-85-days]]. Names: Robert Kennedy, Johnson. Check: Schlesinger, 840, prints "under any conceivable circumstances."'
    tags: [name:kennedy-robert-f, name:johnson-lyndon-b]
  - id: cal.1968-01-30.vietnam
    when: Jan. 30
    date: '1968-01-30'
    thread: vietnam-tet
    c: 'The Tet offensive opens. Before dawn, attacks in I and II Corps: Đà Nẵng, Kon Tum, Pleiku, Nha Trang, Ban Mê Thuột.'
    n: 'FRUS 1964–68, VI, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v06/d34), [36](https://history.state.gov/historicaldocuments/frus1964-68v06/d36), [37](https://history.state.gov/historicaldocuments/frus1964-68v06/d37). [[w.vietnam-victory-in-vietnam]], 217, 466 n.15 (the attack put off a night by a cable of Jan. 29; Quảng Đà, Phú Yên, Bình Định and Khánh Hòa, not told, attacked as first planned); [[w.cosmas-joint-chiefs-of-staff]], 145 (the early attacks in southern I Corps and parts of II Corps); [[w.drea-mcnamara-clifford-and-the-2011]], 180 (the attacks in I and II Corps, reported at the lunch of Jan. 30); [[w.staaveren-u-s-air-force]], 292 (the offensive opened Jan. 30); [[w.nguyen-hanois-war]], 108 (some central provinces a day early); [[w.johnson-vantage-point]], 382 (the opening, Jan. 30, in the northern and central provinces). To check: [[w.oberdorfer-tet]]; [[w.wirtz-tet-offensive]]; [[w.schmitz-tet-offensive]]; [[w.willbanks-tet-offensive]]; [[w.villard-1968-tet-offensive-battles]]; [[w.ford-tet-1968]]; [[w.tet-offensive]]; [[w.tra-tet]]; [[w.lung-general-offensives-of-1968]]; [[w.shulimson-u-s-marines-in-1997]]; [[w.bowden-hue-1968]]; [[w.nolan-battle-for-hue]]; [[w.smith-siege-at-hue]]; [[w.ca-mourning-headband-for-hue]]; [[w.braestrup-big-story]]; [[w.hallin-uncensored-war-the-media]]; [[w.hammond-public-affairs]]; [[w.arnett-live-from-the-battlefield]]; [[w.schandler-unmaking-of-a-president]]; [[w.clifford-counsel-to-the-president-2]]; [[w.hoopes-limits-of-intervention]]; [[w.isaacson-wise-men]]; [[w.mcpherson-political-education]]; [[w.spector-after-tet]]. See [[cal.1967-12-19.vietnam-2]].'
