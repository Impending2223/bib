    date: '1968-01-04'
    place: austin
    thread: economy
    c: 'Austin office. Johnson on staff talks with Shriver, Schultze and Charles Zwick, at the season of the budget. Mrs. Johnson: "The budget must be slashed, and saying ''No'' is an exhausting, draining business." She expects Zwick to take Schultze''s place at the Budget Bureau.'
