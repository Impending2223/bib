# Cal. XXX April 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXX
entries:
  - id: cal.1963-04-02.foreign-aid
    when: Apr. 2
    date: '1963-04-02'
    thread: foreign-aid
    c: Aid message. $4.5 billion asked, down from the budget's $4.9 billion, after the Clay Committee's report. More lending for Latin America; self-help the test.
    n: '[Special Message to the Congress on Free World Defense and Assistance Programs](https://www.presidency.ucsb.edu/documents/special-message-the-congress-free-world-defense-and-assistance-programs) (Apr. 2, 1963). Latham (K–J Adm. II.D). See [[cal.1961-03-22.foreign-aid]]. Names: Clay (K–J Adm. III.E).'
    tags: [name:kennedy-john-f, name:clay-lucius-d]
  - id: cal.1963-04-03.alabama
    when: Apr. 3
    date: '1963-04-03'
    thread: alabama
    c: 'Birmingham. King''s SCLC and Shuttlesworth''s movement open Project C: sit-ins at downtown lunch counters. The day before, Boutwell beat Connor in the runoff for mayor; Connor and the old commission refuse to leave office.'
    n: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (1967). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). McWhorter, *Carry Me Home*; Garrow, *Bearing the Cross* (K–J Cong. II.F). Branch, *Parting the Waters*; Brauer, *Second Reconstruction* (K–J Adm. II.C). King, *Why We Can''t Wait*; Manis, *A Fire You Can''t Put Out* (K–J Cong. II.I.4). Glenn T. Eskew, *But for Birmingham: The Local and National Movements in the Civil Rights Struggle* (1997). Names: King, Shuttlesworth (K–J Cong. III.H); Connor, Boutwell (K–J Cong. III.K).'
    tags: [name:king-martin-luther-jr, name:shuttlesworth-fred, name:connor-eugene, name:boutwell-albert]
  - id: cal.1963-04-03.railroads
    when: Apr. 3
    date: '1963-04-03'
    thread: railroads
    c: 'Executive order: an emergency board on the work-rules dispute between the railroads and the five operating brotherhoods. The carriers'' new rules, firemen off diesels, held off while it sits.'
    n: '[Exec. Order No. 11,101](https://www.presidency.ucsb.edu/documents/executive-order-11101-creating-emergency-board-investigate-disputes-between-the-carriers) (Apr. 3, 1963). See [[cal.1963-03-04.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-04.program
    when: Apr. 4
    date: '1963-04-04'
    thread: program
    c: Senate passes the mass transit bill, [52–41](https://voteview.com/rollcall/RS0880021). Grants to cities for transit systems, cut from $500 million to $375 million.
    n: 'Gelfand, *A Nation of Cities* (K–J Cong. II.B). See [[cal.1962-01-11.program]].'
  - id: cal.1963-04-08.elections-1964
    when: Apr. 8
    date: '1963-04-08'
    thread: elections-1964
    c: National Draft Goldwater Committee announced. O'Donnell, the Texas Republican chairman, at its head; White its director. Goldwater does not endorse it. Check the date.
    n: 'White, *Suite 3505*; Perlstein, *Before the Storm*; Goldberg, *Barry Goldwater* (Opp. II.B). Novak, *The Agony of the G.O.P. 1964*; Kabaservice, *Rule and Ruin* (Opp. II.A). White, *The Making of the President 1964* (K–J Cong. II.E). Names: O''Donnell, White (Opp. III.F); Goldwater (Opp. III.B).'
    tags: [name:odonnell-peter, name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1963-04-09.program
    when: Apr. 9
    date: '1963-04-09'
    thread: program
    c: Senate passes the wilderness bill, [73–12](https://voteview.com/rollcall/RS0880025).
    n: 'Wilderness Act (K–J Cong. II.J.2). Harvey, *Wilderness Forever* (K–J Cong. II.B). See [[cal.1962-01-11.program]].'
  - id: cal.1963-04-10.program
    when: Apr. 10
    date: '1963-04-10'
    thread: program
    c: Senate passes the Youth Employment Act, [50–34](https://voteview.com/rollcall/RS0880033). A Youth Conservation Corps and hometown youth work. Same day, a National Service Corps proposed, for volunteers at home.
    n: '[Letter to the President of the Senate and to the Speaker of the House Proposing the Establishment of a National Service Corps](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-proposing-the-establishment) (Apr. 10, 1963). Sundquist, *Politics and Policy* (K–J Cong. II.B). See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-10.defense
    when: Apr. 10
    date: '1963-04-10'
    thread: defense
    c: Nuclear submarine *Thresher* lost on a test dive east of Cape Cod. 129 aboard.
    n: '[Exec. Order No. 11,104](https://www.presidency.ucsb.edu/documents/executive-order-11104-uss-thresher) (Apr. 12, 1963). Norman Polmar, *The Death of the USS Thresher* (1964).'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-11.steel
    when: Apr. 11
    date: '1963-04-11'
    thread: steel
    c: 'Wheeling Steel raises prices on some products, Apr. 9. Statement: no across-the-board increase; "selected price adjustments, up or down," not incompatible with stability. U.S. Steel and others follow with selective increases.'
    n: '[Statement by the President on the Need for Price and Wage Stability in the Steel Industry](https://www.presidency.ucsb.edu/documents/statement-the-president-the-need-for-price-and-wage-stability-the-steel-industry) (Apr. 11, 1963). Sheahan, *The Wage-Price Guideposts*; Heath, *Kennedy and the Business Community* (K–J Adm. II.B). See [[cal.1962-04-10.steel]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-12.alabama
    when: Apr. 12–20
    date: '1963-04-12'
    thread: alabama
    c: 'Good Friday. King and Abernathy march against a state court injunction of Apr. 10; jailed. Apr. 15: Kennedy calls Coretta King. Apr. 16: the "Letter from Birmingham Jail," to eight white clergymen. Released on bond, Apr. 20.'
    n: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (1967) (the contempt convictions upheld, 5–4). King, *Why We Can''t Wait* (K–J Cong. II.I.4). See [[cal.1963-04-03.alabama]]. Names: King, Abernathy (K–J Cong. III.H); Coretta King (K–J Cong. III.K).'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david, name:king-coretta-scott, name:kennedy-john-f]
  - id: cal.1963-04-19.mississippi
    when: Apr. 19
    date: '1963-04-19'
    thread: mississippi
    c: 'Letter to Hannah on the Civil Rights Commission''s interim report on Mississippi (Apr. 16), which asked that federal funds be withheld from a State that defies the Constitution. Kennedy: the Executive has little discretion to withhold, and the cut would fall on Negroes too.'
    n: '[Letter to the Chairman in Response to a Report on Mississippi by the Civil Rights Commission](https://www.presidency.ucsb.edu/documents/letter-the-chairman-response-report-mississippi-the-civil-rights-commission) (Apr. 19, 1963). Brauer, *Second Reconstruction* (K–J Adm. II.C). Dittmer, *Local People* (K–J Cong. II.F). See [[cal.1962-10-01.mississippi]].'
    tags: [name:kennedy-john-f, name:hannah-john-a]
  - id: cal.1963-04-20.laos
    when: Apr. 20
    date: '1963-04-20'
    thread: laos
    c: 'NSC on Laos. The Pathet Lao, two to one, press Kong Le''s neutralists on the Plain of Jars; Quinim, the foreign minister, assassinated Apr. 1. Support for Souvanna; Harriman to London, Paris, and Moscow.'
    n: 'FRUS 1961–63, XXIV, docs. [459](https://history.state.gov/historicaldocuments/frus1961-63v24/d459), [461](https://history.state.gov/historicaldocuments/frus1961-63v24/d461). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-162) (Apr. 24, 1963). Rust, *So Much to Lose* (K–J Adm. II.D). Stevenson, *The End of Nowhere* (Viet. II.E.4). Hilsman, *To Move a Nation*; Abramson, *Spanning the Century* (K–J Adm. II.G.4). See [[cal.1962-07-23.laos]]. Names: Kong Le, Souvanna Phouma (Viet. III.I); Harriman (K–J Adm. III.E).'
    tags: [name:kong-le, name:quinim-pholsena, name:souvanna-phouma, name:harriman-w-averell, name:kennedy-john-f]
  - id: cal.1963-04-23.alabama
    when: Apr. 23
    date: '1963-04-23'
    thread: alabama
    c: William Moore, a Baltimore postman walking alone to Mississippi with a letter for Barnett, shot dead on the highway near Attalla.
    n: 'Branch, *Parting the Waters* (K–J Adm. II.C). Names: Moore (K–J Cong. III.K); Barnett (K–J Cong. III.F).'
    tags: [name:moore-william-l, name:barnett-ross-r]
  - id: cal.1963-04-24.testing
    when: Apr. 24
    date: '1963-04-24'
    thread: testing
    c: 'Kohler and Trevelyan give Khrushchev the Kennedy–Macmillan letters: senior emissaries to Moscow to talk a test ban. Khrushchev: nothing new; three inspections stand.'
    n: 'FRUS 1961–63, VII, docs. [274](https://history.state.gov/historicaldocuments/frus1961-63v07/d274), [276](https://history.state.gov/historicaldocuments/frus1961-63v07/d276), [280](https://history.state.gov/historicaldocuments/frus1961-63v07/d280). See [[cal.1963-06-10.testing]]. Names: Kohler (K–J Adm. III.E); Khrushchev, Macmillan (K–J Adm. III.J).'
    tags: [name:kohler-foy-d, name:trevelyan-humphrey, name:khrushchev-nikita-s, name:macmillan-harold, name:kennedy-john-f]
  - id: cal.1963-04-25.economy
    when: Apr. 25
    date: '1963-04-25'
    thread: economy
    c: Business Committee for Tax Reduction in 1963 at the White House. Rate cuts with control of spending; not all of the President's reforms.
    n: '[Statement by the President Following a Meeting With the Business Committee for Tax Reduction in 1963](https://www.presidency.ucsb.edu/documents/statement-the-president-following-meeting-with-the-business-committee-for-tax-reduction) (Apr. 25, 1963). Rowen, *The Free Enterprisers* (K–J Adm. II.B). See [[cal.1963-01-24.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-25.program
    when: Apr. 25
    date: '1963-04-25'
    thread: program
    c: House passes the feed grain bill, [208–195](https://voteview.com/rollcall/RH0880017). Voluntary acreage diversion for 1964–65.
    n: 'See [[cal.1962-09-27.program]]. Names: Freeman (K–J Adm. III.G).'
  - id: cal.1963-04-25.confirmations
    when: Apr. 25
    date: '1963-04-25'
    thread: confirmations
    also: [space]
    c: Fourteen incorporators of the Communications Satellite Corporation confirmed. Morse's point of order, that the Senate could not confirm the incorporators of a private company, rejected; [75–15](https://voteview.com/rollcall/RS0880038). Check the question put.
    n: '[109 Cong. Rec., Senate, Apr. 25, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt6/pdf/GPO-CRECB-1963-pt6-1-1.pdf). See [[cal.1962-08-14.rules]]; [[cal.1961-03-07.confirmations]]. Names: Morse (K–J Cong. III.B).'
    tags: ['name:morse-wayne']
  - id: cal.1963-04-26.laos
    when: Apr. 26
    date: '1963-04-26'
    thread: laos
    c: 'Harriman with Khrushchev in Moscow, Kennedy''s letter in hand. Khrushchev: the Geneva accords stand; Moscow has little hold in Laos.'
    n: '[FRUS 1961–63, XXIV, doc. 466](https://history.state.gov/historicaldocuments/frus1961-63v24/d466). See [[cal.1963-04-20.laos]]. Names: Harriman, Kohler (K–J Adm. III.E); Khrushchev (K–J Adm. III.J).'
    tags: [name:harriman-w-averell, name:khrushchev-nikita-s, name:kohler-foy-d, name:kennedy-john-f]
