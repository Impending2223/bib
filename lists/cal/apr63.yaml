# Cal. XLI April 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLI
entries:
  - id: cal.1963-04-01.state-constitutions-mi
    when: Apr. 1
    date: '1963-04-01'
    thread: state-constitutions
    c: 'Michigan''s new constitution ratified, 810,860 to 803,436, 50.2 percent. In force Jan. 1, 1964: the Civil Rights Commission among its creations.'
    n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals) (Check: the Board of State Canvassers'' certification, and the recount). [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]; [[w.harris-romneys-way]]. See [[cal.1962-08-01.state-constitutions-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1963-04-01.middle-east
    when: Apr. 1–3
    date: '1963-04-01'
    thread: middle-east-yemen
    c: 'Yemen. Bunker with Nasser in Cairo: the UAR to begin withdrawing within 15 days of the suspension of Saudi aid to the royalists.'
    n: 'FRUS 1961–63, XVIII, docs. [203](https://history.state.gov/historicaldocuments/frus1961-63v18/d203) (Bunker''s instructions, Mar. 30), [205](https://history.state.gov/historicaldocuments/frus1961-63v18/d205). See [[cal.1963-03-01.middle-east]]. Names: Bunker, Nasser.'
    tags: [name:bunker-ellsworth, name:nasser-gamal-abdel]
  - id: cal.1963-04-02.foreign-aid
    when: Apr. 2
    date: '1963-04-02'
    thread: foreign-aid
    c: Aid message. $4.5 billion asked, down from the budget's $4.9 billion, after the Clay Committee's report. More lending for Latin America; self-help the test.
    n: '[Special Message to the Congress on Free World Defense and Assistance Programs](https://www.presidency.ucsb.edu/documents/special-message-the-congress-free-world-defense-and-assistance-programs) (Apr. 2, 1963). [[w.latham-modernization-as-ideology]]. See [[cal.1961-03-22.foreign-aid]]. Names: Clay.'
    tags: [name:kennedy-john-f, name:clay-lucius-d]
  - id: cal.1963-04-02.alabama-birmingham
    when: Apr. 2
    date: '1963-04-02'
    thread: alabama-birmingham
    also: [mayors, elections-1963]
    c: Birmingham runoff. Boutwell elected mayor over Connor by 7,982 votes (Check). The mayor and council take their oaths Apr. 15; the three commissioners, Connor among them, hold to their offices, claiming terms to Oct. 1, 1965. Two governments.
    n: '*Connor v. State ex rel. Boutwell*, [275 Ala. 230](https://static.case.law/ala/275/case-pdfs/0230-01.pdf), 153 So. 2d 787 (1963). [Martin Luther King, Jr., Research and Education Institute, "Boutwell, Albert"](https://kinginstitute.stanford.edu/boutwell-albert). See [[cal.1963-03-05.alabama-birmingham]]; [[cal.1963-04-03.alabama]]. Names: Boutwell, Connor.'
    tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene]
  - id: cal.1963-04-02.mayors-chicago
    when: Apr. 2
    date: '1963-04-02'
    thread: mayors
    also: [elections-1963]
    c: 'Chicago. Daley (D) re-elected to a third term over Adamowski (R), Cook County''s State''s Attorney 1957–60, 679,497 to 540,705, 55.7 percent. The primaries Feb. 26: Daley unopposed; Adamowski 90.5 percent. Adamowski''s charge: "we do not have one party-rule, we have one-man rule."'
    n: 'Votes: [Wikipedia, "1963 Chicago mayoral election"](https://en.wikipedia.org/wiki/1963_Chicago_mayoral_election), from the Board of Election Commissioners'' table of mayoral returns (Check: the Board''s canvass). [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]; [[w.peirce-megastates-of-america]]. Names: Daley, Adamowski.'
    tags: [state:il, city:chicago, name:daley-richard-j, name:adamowski-benjamin-s]
  - id: cal.1963-04-02.states-and-cities-tx
    when: Apr. 2
    date: '1963-04-02'
    thread: states-and-cities
    also: [voting-rights]
    c: Crystal City, Tex. Five Mexican American candidates, backed by PASO and the Teamsters at the Del Monte cannery, take all five city council seats, 795 to 864 votes each; the other slate 664 to 754. Of 1,681 poll taxes paid in the town, 1,139 by Mexican Americans. The council makes Juan Cornejo, the Teamsters' representative, mayor.
    n: 'Larry Goodwyn, "Los Cinco Candidatos," [*Texas Observer*, Apr. 18, 1963, pp. 3, 8](https://issues.texasobserver.org/pdf/ustxtxb_obs_1963_04_18_issue.pdf); Teresa Palomo Acosta, ["Crystal City Revolts,"](https://www.tshaonline.org/handbook/entries/crystal-city-revolts) *Handbook of Texas Online*. Check: the date and the city''s canvass. [[w.shockley-chicano-revolt-in-a]]; [[w.montejano-anglos-and-mexicans-in]]; [[w.behnken-fighting-their-own-battles]]; [[w.krochmal-blue-texas]]. Names: Cornejo.'
    tags: [state:tx, name:cornejo-juan]
  - id: cal.1963-04-02.mayors-los-angeles
    when: Apr. 2
    date: '1963-04-02'
    thread: mayors
    also: [elections-1963]
    c: 'Los Angeles City Council, 10th district: Bradley over the appointed incumbent, two elections, for the unexpired term, 17,760 to 10,540, 62.8 percent, and for the full term, 17,552 to 10,400. Sworn Apr. 15, the first Negro elected to the council.'
    n: 'Votes: [Wikipedia, "Tom Bradley (mayor)"](https://en.wikipedia.org/wiki/Tom_Bradley_(mayor)); Check: the City Clerk''s canvass. [[w.sonenshein-politics-in-black-and]]; [[w.sides-l-a-city-limits]]. Names: Bradley.'
    tags: [state:ca, city:los-angeles, name:bradley-tom]
  - id: cal.1963-04-02.open-housing-berkeley
    when: Apr. 2
    date: '1963-04-02'
    thread: open-housing
    also: [state-constitutions]
    c: Berkeley. The city's fair housing ordinance, passed by the council, repealed by the voters at referendum. Check the council's date and the vote.
    n: '[[w.hosang-racial-propositions]]; [[w.rorabaugh-berkeley-at-war]]; [[w.brilliant-color-of-america-has]].'
    tags: [state:ca, city:berkeley]
  - id: cal.1963-04-03.alabama
    when: Apr. 3
    date: '1963-04-03'
    thread: alabama-birmingham
    also: [desegregation-public-places, king]
    c: 'Birmingham. King''s SCLC and Shuttlesworth''s movement open Project C: sit-ins at downtown lunch counters. The day before, Boutwell beat Connor in the runoff for mayor; Connor and the old commission refuse to leave office.'
    n: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (1967). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-164) (May 8, 1963). [[w.mcwhorter-carry-me-home]]; [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.eskew-but-for-birmingham]]; [[w.branch-parting-the-waters]]; [[w.brauer-john-f-kennedy-and]]; [[w.bryant-bystander]]; [[w.levingston-kennedy-and-king]]; [[w.rosenberg-kennedy-johnson-and-the]], "Protest in Birmingham"; [[w.king-why-we-cant-wait]]; [[w.manis-fire-you-cant-put]]; [[w.young-easy-burden]]; [[w.nunnelley-bull-connor]]. See [[cal.1963-04-02.alabama-birmingham]]. Names: Martin Luther King, Shuttlesworth, Connor, Boutwell.'
    tags: [name:king-martin-luther-jr, name:shuttlesworth-fred, name:connor-eugene, name:boutwell-albert]
  - id: cal.1963-04-03.railroads
    when: Apr. 3
    date: '1963-04-03'
    thread: railroads
    c: 'Executive order: an emergency board on the work-rules dispute between the railroads and the five operating brotherhoods. The carriers'' new rules, firemen off diesels, held off while it sits.'
    n: '[Exec. Order No. 11,101](https://www.presidency.ucsb.edu/documents/executive-order-11101-creating-emergency-board-investigate-disputes-between-the-carriers) (Apr. 3, 1963). See [[cal.1963-03-04.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-03.opinion
    when: Apr. 3
    date: '1963-04-03'
    thread: opinion
    c: 'Gallup, Mar. 8–13: the most important problem, Cuba and Castro, 24 percent; other international problems, 39; unemployment, 11; racial problems, 4. The Democrats better able to handle it, 36; the Republicans, 17.'
    n: '[[w.gallup-poll]], III, 1812.'
  - id: cal.1963-04-04.program
    when: Apr. 4
    date: '1963-04-04'
    thread: cities-and-housing
    also: [transportation]
    c: Senate passes the mass transit bill, [52–41](https://voteview.com/rollcall/RS0880021). Grants to cities for transit systems, cut from $500 million to $375 million.
    n: '[[w.smerk-urban-transportation]]; [[w.gelfand-nation-of-cities]]. See [[cal.1962-01-11.program]]. See [[cal.1963-02-18.transportation]].'
  - id: cal.1963-04-04.mississippi
    when: Apr. 4
    date: '1963-04-04'
    thread: mississippi
    also: [voting-rights]
    c: Greenwood. The request for a restraining order dropped; the SNCC workers freed. Check the terms.
    n: '[Justice Department memorandum](https://www.crmvet.org/docs/630408_rfk_memo.pdf) (Apr. 8, 1963). See [[cal.1963-03-27.mississippi]].'
  - id: cal.1963-04-05.middle-east-yemen
    when: Apr. 5–9
    date: '1963-04-05'
    thread: middle-east-yemen
    c: 'Yemen. Bunker with Faisal: the disengagement agreement. Saudi aid to the royalists suspended; a demilitarized zone 20 kilometers each side of the border, with impartial observers.'
    n: 'FRUS 1961–63, XVIII, docs. [209](https://history.state.gov/historicaldocuments/frus1961-63v18/d209), [211](https://history.state.gov/historicaldocuments/frus1961-63v18/d211) (editorial note). See [[cal.1963-03-01.middle-east]]. Names: Bunker, Faisal ibn Abd al-Aziz Al Saud.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud]
  - id: cal.1963-04-08.elections-1964
    when: Apr. 8
    date: '1963-04-08'
    thread: elections-1964
    also: [goldwater]
    c: National Draft Goldwater Committee announced. O'Donnell, the Texas Republican chairman, at its head; White its director. Goldwater does not endorse it. Check the date.
    n: '[[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]; [[w.goldberg-barry-goldwater]]; [[w.brennan-turning-right-in-the]]; [[w.edwards-goldwater]]; [[w.perlstein-before-the-storm]]; [[w.middendorf-glorious-disaster]]; [[w.goldwater-with-no-apologies]]; [[w.goldwater-goldwater]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]; [[w.white-making-of-the-president-1965]]. Names: O''Donnell, White, Goldwater.'
    tags: [name:odonnell-peter, name:white-f-clifton, name:goldwater-barry-m]
  - id: cal.1963-04-08.japan-and-korea
    when: Apr. 8
    date: '1963-04-08'
    thread: japan-and-korea-civilian-rule
    c: Park puts off the referendum to September.
    n: '[FRUS 1961–63, XXII, doc. 300](https://history.state.gov/historicaldocuments/frus1961-63v22/d300). See [[cal.1963-02-18.japan-and-korea]]. Names: Park.'
    tags: [name:park-chung-hee]
  - id: cal.1963-04-09.program
    when: Apr. 9
    date: '1963-04-09'
    thread: conservation
    c: Senate passes the wilderness bill, [73–12](https://voteview.com/rollcall/RS0880025).
    n: Wilderness Act (K–J Cong. II.J.2). [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]. See [[cal.1962-01-11.program]]. See [[cal.1961-09-06.conservation]].
  - id: cal.1963-04-09.middle-east
    when: Apr. 9
    date: '1963-04-09'
    thread: middle-east
    c: Iraq. Harriman approves selling the new regime 40 light tanks and 12 tank transporters; the Near East bureau against asking a settlement with the Kurds in return.
    n: 'Check: the record. [[w.matthews-kennedy-administration-counterinsurgency-and]]; [[w.gibson-sold-out]]. See [[cal.1963-02-08.middle-east]]. Names: Harriman.'
    tags: [name:harriman-w-averell]
  - id: cal.1963-04-10.program
    when: Apr. 10
    date: '1963-04-10'
    thread: jobs-and-wages
    c: Senate passes the Youth Employment Act, [50–34](https://voteview.com/rollcall/RS0880033). A Youth Conservation Corps and hometown youth work. Same day, a National Service Corps proposed, for volunteers at home.
    n: '[Letter to the President of the Senate and to the Speaker of the House Proposing the Establishment of a National Service Corps](https://www.presidency.ucsb.edu/documents/letter-the-president-the-senate-and-the-speaker-the-house-proposing-the-establishment) (Apr. 10, 1963). [[w.sundquist-politics-and-policy]]. See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-10.defense
    when: Apr. 10
    date: '1963-04-10'
    thread: defense
    c: Nuclear submarine *Thresher* lost on a test dive east of Cape Cod, Mass. 129 aboard.
    n: '[Exec. Order No. 11,104](https://www.presidency.ucsb.edu/documents/executive-order-11104-uss-thresher) (Apr. 12, 1963). *Loss of the U.S.S. "Thresher": Hearings Before the Joint Comm. on Atomic Energy* (K–J Cong. II.J.3). [[w.polmar-death-of-the-thresher]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-10.peace-corps
    when: Apr. 10
    date: '1963-04-10'
    thread: peace-corps
    c: 'Executive Order 11103: a volunteer who has served a full term, about two years, may be appointed to the competitive service on passing an examination, within a year of leaving the Peace Corps, three years if in military service or study. A memorandum asks the agencies to recruit them.'
    n: '[Exec. Order No. 11,103](https://www.presidency.ucsb.edu/documents/executive-order-11103-providing-for-the-appointment-former-peace-corps-volunteers-the); [Memorandum on Recruitment of Former Peace Corps Volunteers for Career Government Services](https://www.presidency.ucsb.edu/documents/memorandum-recruitment-former-peace-corps-volunteers-for-career-government-services) (Apr. 10, 1963). [[w.hoffman-all-you-need-is]]; [[w.rice-bold-experiment]]; [[w.fischer-making-them-like-us]]; [[w.meisler-when-the-world-calls]]. See [[cal.1961-09-22.peace-corps]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-11.steel
    when: Apr. 11
    date: '1963-04-11'
    thread: steel
    c: 'Wheeling Steel raises prices on some products, Apr. 9. Statement: no across-the-board increase; "selected price adjustments, up or down," not incompatible with stability. U.S. Steel and others follow with selective increases.'
    n: '[Statement by the President on the Need for Price and Wage Stability in the Steel Industry](https://www.presidency.ucsb.edu/documents/statement-the-president-the-need-for-price-and-wage-stability-the-steel-industry) (Apr. 11, 1963). [[w.sheahan-wage-price-guideposts]]; [[w.heath-john-f-kennedy-and]]. See [[cal.1962-04-10.steel]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-12.alabama
    when: Apr. 12
    date: '1963-04-12'
    thread: alabama-birmingham
    also: [king]
    c: Birmingham, Good Friday. King and Abernathy march against a state court injunction of Apr. 10; jailed. Released on bond, Apr. 20.
    n: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (1967) (the contempt convictions upheld, 5–4). [[w.bass-blessed-are-the-peacemakers]]. See [[cal.1963-04-03.alabama]]. Names: Martin Luther King, Abernathy.'
    tags: [name:king-martin-luther-jr, name:abernathy-ralph-david]
  - id: cal.1963-04-15.alabama-birmingham
    when: Apr. 15
    date: '1963-04-15'
    thread: alabama-birmingham
    also: [king]
    c: Kennedy calls Coretta King, her husband in the Birmingham jail.
    n: 'Check: the record of the call. See [[cal.1963-04-12.alabama]]. Names: Kennedy, Coretta King, Martin Luther King.'
    tags: [name:kennedy-john-f, name:king-coretta-scott, name:king-martin-luther-jr]
  - id: cal.1963-04-16.alabama-birmingham
    when: Apr. 16
    date: '1963-04-16'
    thread: alabama-birmingham
    also: [king]
    c: King's "Letter from Birmingham Jail," to eight white clergymen.
    n: '[[w.king-why-we-cant-wait]]; [[w.rieder-gospel-of-freedom]]. See [[cal.1963-04-12.alabama]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1963-04-18.middle-east
    when: Apr. 18
    date: '1963-04-18'
    thread: middle-east
    c: 'The arms policy for Iraq: no heavy or sophisticated weapons in quantity; small arms, transport and "non-shooting" materiel; cash sales.'
    n: '[FRUS 1961–63, XVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1961-63v18/d216). See [[cal.1963-04-09.middle-east]].'
  - id: cal.1963-04-19.mississippi
    when: Apr. 19
    date: '1963-04-19'
    thread: mississippi
    c: 'Letter to Hannah on the Civil Rights Commission''s interim report on Mississippi (Apr. 16), which asked that federal funds be withheld from a State that defies the Constitution. Kennedy: the Executive has little discretion to withhold, and the cut would fall on Negroes too.'
    n: '[Letter to the Chairman in Response to a Report on Mississippi by the Civil Rights Commission](https://www.presidency.ucsb.edu/documents/letter-the-chairman-response-report-mississippi-the-civil-rights-commission) (Apr. 19, 1963). [[w.brauer-john-f-kennedy-and]]; [[w.dulles-civil-rights-commission-1957]]; [[w.dittmer-local-people]]. See [[cal.1962-10-01.mississippi]]. Names: Hannah.'
    tags: [name:kennedy-john-f, name:hannah-john-a]
  - id: cal.1963-04-20.laos
    when: Apr. 20
    date: '1963-04-20'
    thread: laos
    c: NSC on Laos. The Pathet Lao, two to one, press Kong Le's neutralists on the Plain of Jars; Quinim, the foreign minister, assassinated Apr. 1. Support for Souvanna; Harriman to London, Paris, and Moscow.
    n: 'FRUS 1961–63, XXIV, docs. [459](https://history.state.gov/historicaldocuments/frus1961-63v24/d459), [461](https://history.state.gov/historicaldocuments/frus1961-63v24/d461). [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-162) (Apr. 24, 1963). [[w.rust-so-much-to-lose]]; [[w.dommen-conflict-in-laos]]; [[w.stevenson-end-of-nowhere]]; [[w.jacobs-universe-unraveling]]; [[w.hilsman-to-move-a-nation]]; [[w.abramson-spanning-the-century]]. See [[cal.1962-07-23.laos]]. Names: Kong Le, Quinim Pholsena, Souvanna Phouma, Harriman.'
    tags: [name:kong-le, name:quinim-pholsena, name:souvanna-phouma, name:harriman-w-averell, name:kennedy-john-f]
  - id: cal.1963-04-23.alabama
    when: Apr. 23
    date: '1963-04-23'
    thread: alabama
    c: William Moore, a Baltimore postman walking alone to Mississippi with a letter for Barnett, shot dead on the highway near Attalla, Ala.
    n: '[News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-162) (Apr. 24, 1963). [[w.branch-parting-the-waters]]; [[w.stanton-freedom-walk]]. Names: William Moore, Barnett.'
    tags: [name:moore-william-l, name:barnett-ross-r]
  - id: cal.1963-04-24.testing
    when: Apr. 24
    date: '1963-04-24'
    thread: testing
    c: 'Kohler and Trevelyan give Khrushchev the Kennedy–Macmillan letter of Apr. 15: the West down from some twenty inspections a year to seven, against the Soviets'' three; very senior representatives offered for talks in Moscow. Khrushchev: nothing new; he may go back to none.'
    n: 'Kennedy to Khrushchev, Apr. 11, [FRUS 1961–63, VII, doc. 274](https://history.state.gov/historicaldocuments/frus1961-63v07/d274); the joint letter, [doc. 276](https://history.state.gov/historicaldocuments/frus1961-63v07/d276); Kohler''s report, [doc. 280](https://history.state.gov/historicaldocuments/frus1961-63v07/d280). [[w.cousins-improbable-triumvirate]]; [[w.oliver-kennedy-macmillan-and-the]]. Reply: [[cal.1963-05-08.testing]]. See [[cal.1962-12-19.testing]]. Names: Kohler, Trevelyan, Khrushchev, Macmillan.'
    tags: [name:kohler-foy-d, name:trevelyan-humphrey, name:khrushchev-nikita-s, name:macmillan-harold, name:kennedy-john-f]
  - id: cal.1963-04-25.economy
    when: Apr. 25
    date: '1963-04-25'
    thread: economy
    c: Business Committee for Tax Reduction in 1963 at the White House. Rate cuts with control of spending; not all of the President's reforms.
    n: '[Statement by the President Following a Meeting With the Business Committee for Tax Reduction in 1963](https://www.presidency.ucsb.edu/documents/statement-the-president-following-meeting-with-the-business-committee-for-tax-reduction) (Apr. 25, 1963). [[w.rowen-free-enterprisers]]; [[w.mcquaid-big-business-and-presidential]]. See [[cal.1963-01-24.economy]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-25.program
    when: Apr. 25
    date: '1963-04-25'
    thread: farm
    c: House passes the feed grain bill, [208–195](https://voteview.com/rollcall/RH0880017). Voluntary acreage diversion for 1964–65.
    n: '[[w.hadwiger-pressures-and-protests]]; [[w.hansen-gaining-access]]; [[w.cochrane-american-farm-policy-1948]]. See [[cal.1962-09-27.program]]. Names: Freeman.'
    tags: [name:freeman-orville-l]
  - id: cal.1963-04-25.confirmations
    when: Apr. 25
    date: '1963-04-25'
    thread: confirmations
    also: [space]
    c: Fourteen incorporators of the Communications Satellite Corporation confirmed. Morse's point of order, that the Senate could not confirm the incorporators of a private company, rejected; [75–15](https://voteview.com/rollcall/RS0880038). Check the question put.
    n: '[109 Cong. Rec., Senate, Apr. 25, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt6/pdf/GPO-CRECB-1963-pt6-1-1.pdf). [[w.galloway-politics-and-technology-of]]. See [[cal.1962-08-14.rules]]; [[cal.1961-03-07.confirmations]]. Names: Morse.'
    tags: [name:morse-wayne]
  - id: cal.1963-04-26.laos
    when: Apr. 26
    date: '1963-04-26'
    thread: laos
    c: 'Harriman with Khrushchev in Moscow, Kennedy''s letter in hand. Khrushchev: the Geneva accords stand; Moscow has little hold in Laos.'
    n: '[FRUS 1961–63, XXIV, doc. 466](https://history.state.gov/historicaldocuments/frus1961-63v24/d466). See [[cal.1963-04-20.laos]]. Names: Harriman, Kohler, Khrushchev.'
    tags: [name:harriman-w-averell, name:khrushchev-nikita-s, name:kohler-foy-d, name:kennedy-john-f]
  - id: cal.1963-04-27.middle-east
    when: Apr. 27
    date: '1963-04-27'
    thread: middle-east
    c: 'Jordan, after the Cairo charter of Apr. 17 for a federation of Egypt, Syria and Iraq. Kennedy with Ball, McNamara, Feldman and Bundy: what to do if a coup in Jordan brings Israel onto the West Bank; how to get 500 Americans out. Ball to Harman: Nasser warned that any move on Jordan is of very serious concern.'
