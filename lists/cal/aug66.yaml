# Cal. LXXXI August 1966
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXXXI
entries:
  - id: cal.1966-08-01.crime-and-hijacking
    when: Aug. 1–2
    date: '1966-08-01'
    thread: crime-and-hijacking
    c: 'Austin. Charles Whitman, a student and former Marine, having killed his wife and his mother in the night, fires from the University of Texas tower for about an hour and a half: 14 killed, some 30 wounded, before police kill him. Aug. 2, Johnson: Congress to pass the gun bill, Dodd''s S. 1592, reported by the Senate Judiciary Committee Mar. 22, "before further loss of life that might be prevented by its passage."'
    n: '[Statement by the President on the Need for Firearms Control Legislation](https://www.presidency.ucsb.edu/documents/statement-the-president-the-need-for-firearms-control-legislation) (Aug. 2, 1966); [Telegram to the Chancellor of the University of Texas Following the Mass Shooting on the University Campus](https://www.presidency.ucsb.edu/documents/telegram-the-chancellor-the-university-texas-following-the-mass-shooting-the-university) (Aug. 2, 1966). [[w.lavergne-sniper-in-the-tower]]; [[w.zimring-firearms-and-federal-law]]. See [[cal.1965-03-08.crime-and-hijacking]]. Names: Dodd (K–J Cong. III.B).'
    tags: [name:johnson-lyndon-b, name:dodd-thomas-j]
  - id: cal.1966-08-02.elections-1966
    when: Aug. 2
    date: '1966-08-02'
    thread: elections-1966
    c: 'Michigan, Democratic Senate primary: Williams, governor 1949–61, lately Assistant Secretary of State for African Affairs, defeats Cavanagh, mayor of Detroit, 437,438 to 290,465. Griffin, appointed in May to Patrick McNamara''s seat, the Republican.'
    n: 'Votes: Wikipedia, from Our Campaigns (Check: *Michigan Manual 1967–1968*, pp. 409–412). [[w.noer-soapy]]. Names: Cavanagh (K–J Cong. III.F); Griffin (Opp. III.B).'
    tags: [name:williams-g-mennen, name:cavanagh-jerome-p, name:griffin-robert-p, name:mcnamara-patrick-v]
  - id: cal.1966-08-02.vietnam
    when: Aug. 2
    date: '1966-08-02'
    thread: vietnam
    c: 'Harriman, charged by Johnson in July with the search for a settlement, holds the first of the weekly meetings of his "Negotiations Committee," with U. Alexis Johnson, Thompson, and Unger: secret talks between Saigon and the NLF to be explored, with an amnesty; more intelligence on the Front''s leaders. The same day Kissinger, back from Vietnam, tells Harriman the Viet Cong''s political organization is untouched and pacification has made little progress.'
    n: 'FRUS 1964–68, IV, docs. [196](https://history.state.gov/historicaldocuments/frus1964-68v04/d196), [197](https://history.state.gov/historicaldocuments/frus1964-68v04/d197). [[w.herring-secret-diplomacy-of-the]]; [[w.abramson-spanning-the-century]]. Names: Harriman, Thompson (K–J Adm. III.E); U. Alexis Johnson (Viet. III.C); Kissinger (Opp. III.G).'
    tags: [name:harriman-w-averell, name:johnson-u-alexis, name:thompson-llewellyn-e, name:unger-leonard, name:kissinger-henry-a]
  - id: cal.1966-08-04.jobs-and-wages
    when: Aug. 4–19
    date: '1966-08-04'
    thread: jobs-and-wages
    c: 'Senate passes S.J. Res. 186, on the airline strike, [54–33](https://voteview.com/rollcall/RS0890383); Aug. 3, an amendment for compulsory arbitration if the 180 days the resolution allows for negotiation run out refused, [6–81](https://voteview.com/rollcall/RS0890380). Aug. 9, Johnson: the increases "could not be kept within 3.2"; the leadership recommended 4.3, and the union rejected it. Aug. 19, the members ratify a three-year contract with a cost-of-living clause; the strike ends.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1170) (Aug. 9, 1966); [Remarks on Announcing an Agreement in the Airline Strike](https://www.presidency.ucsb.edu/documents/remarks-announcing-agreement-the-airline-strike) (July 29, 1966), its note. See [[cal.1966-07-08.jobs-and-wages]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-08-04.steel
    when: Aug. 4–9
    date: '1966-08-04'
    thread: steel
    also: [economy]
    c: 'Inland Steel raises prices on major products; four more companies follow. Ackley had wired twelve producers to act only after talking with the Government. His statement: the companies'' action "can only be characterized as irresponsible." Aug. 9, Johnson: some $50 million a year more for the companies after taxes; "We urged them to reconsider that decision, but we have not been effective."'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1170) (Aug. 9, 1966), which prints Ackley''s statement of Aug. 4. [[w.sheahan-wage-price-guideposts]]; [[w.exhortation-and-controls]]. See [[cal.1965-12-31.steel]]. Names: Ackley (K–J Adm. III.H).'
    tags: [name:ackley-gardner, name:johnson-lyndon-b]
  - id: cal.1966-08-04.india-and-china
    when: Aug. 4–11
    date: '1966-08-04'
    thread: india-and-china
    c: 'NSC on Indonesia, Aug. 4. Johnson recalls the Council''s decision of a year before to cut off most aid. Rusk: the reversal of Indonesia''s course "abrupt"; its debts to be rescheduled. Aug. 11, at Djakarta, Malik and Razak sign the Bangkok accord: Indonesia''s confrontation of Malaysia ended, "hostile acts" to cease; diplomatic relations, by secret letters, after elections in Sabah and Sarawak.'
    n: 'FRUS 1964–68, XXVI, docs. [217](https://history.state.gov/historicaldocuments/frus1964-68v26/d217), [218](https://history.state.gov/historicaldocuments/frus1964-68v26/d218). [[w.simpson-economists-with-guns]]. See [[cal.1965-10-01.india-and-china]]. Names: Rusk (K–J Adm. III.E).'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:malik-adam, name:razak-tun-abdul]
  - id: cal.1966-08-04.elections-1966
    when: Aug. 4
    date: '1966-08-04'
    thread: elections-1966
    c: 'Tennessee, Democratic Senate primary: Clement, the governor, defeats Bass, 384,322 to 366,079; Bass had won the last two years of Kefauver''s term in 1964. Howard H. Baker Jr. the Republican nominee, 112,617 to 36,043.'
    n: 'Votes: CQ Guide 6th (2010) 1540. [[w.greene-lead-me-on]]. Names: Kefauver (K–J Cong. III.B); Baker (Cong. III.C).'
    tags: [name:bass-ross, name:baker-howard-h-jr, name:kefauver-estes]
  - id: cal.1966-08-05.open-housing
    when: Aug. 5
    date: '1966-08-05'
    thread: open-housing
    also: [king]
    c: 'Chicago. The marches into the white neighborhoods of the Southwest Side, from late July. Aug. 5, Marquette Park: King struck on the head by a rock; bottles and bricks thrown at the marchers. King: "I have seen many demonstrations in the south but I have never seen anything so hostile and so hateful as I''ve seen here today."'
    n: '"Dr. King Is Felled by Rock," *Chicago Tribune*, Aug. 6, 1966. See [[cal.1966-07-10.open-housing]]. Names: King (K–J Cong. III.H).'
    tags: [name:king-martin-luther-jr]
  - id: cal.1966-08-08.india-and-china
    when: Aug. 8–18
    date: '1966-08-08'
    thread: india-and-china
    c: 'Peking. The Central Committee''s plenum, Aug. 1–12, adopts the Sixteen Points on the Great Proletarian Cultural Revolution, Aug. 8; Lin Biao second to Mao. Aug. 18, Mao reviews the Red Guards at Tiananmen. Rostow to Johnson, July 28: "the crisis inside Communist China" may prove "the most significant event now taking place on the world scene."'
    n: '[FRUS 1964–68, XXX, doc. 172](https://history.state.gov/historicaldocuments/frus1964-68v30/d172). [[w.macfarquhar-maos-last-revolution]]; [[w.goh-constructing-the-u-s]]. Names: Mao (Adm. III.J); Rostow (K–J Adm. III.E).'
    tags: [name:mao-zedong, name:lin-biao, name:rostow-walt-w]
  - id: cal.1966-08-09.open-housing
    when: Aug. 9
    date: '1966-08-09'
    thread: open-housing
    c: 'House passes the civil rights bill, H.R. 14765, [259–157](https://voteview.com/rollcall/RH0890293). Title IV, fair housing, kept: recommittal to strike it lost, [190–222](https://voteview.com/rollcall/RH0890292); a broker may follow an exempt owner''s written instruction to discriminate, [237–176](https://voteview.com/rollcall/RH0890289). Added: a federal crime to travel or use the mails to incite a riot, [389–25](https://voteview.com/rollcall/RH0890290); suits to desegregate schools only on a written complaint, [214–201](https://voteview.com/rollcall/RH0890291). The rule taken July 25, [200–180](https://voteview.com/rollcall/RH0890288). Aug. 10, Johnson: the House "has barred bigotry in all new housing and in apartment houses"; the provision "not as comprehensive as that we proposed and sought."'
    n: '[Statement by the President Following House Approval of the Civil Rights Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-house-approval-the-civil-rights-bill) (Aug. 10, 1966). See [[cal.1966-04-28.open-housing]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1966-08-10.space
    when: Aug. 10–23
    date: '1966-08-10'
    thread: space
    c: 'Lunar Orbiter 1 launched, Aug. 10; in orbit about the moon Aug. 14, the first American craft there. Photographs of possible landing sites for Apollo. Aug. 23, the first picture of the earth from the moon.'
    n: '[[w.byers-destination-moon]].'
  - id: cal.1966-08-13.vietnam
    when: Aug. 13–14
    date: '1966-08-13'
    thread: vietnam
    c: 'Westmoreland, from Honolulu, at the Ranch; he and Johnson talk until early morning. Johnson to the press, Aug. 14: a Communist military takeover in South Vietnam "no longer just improbable ... it is impossible"; "there will be no quick victory, but the world must know that we will not quit." Westmoreland takes questions.'
    n: '[Remarks to the Press at the LBJ Ranch Following a Report on Vietnam by General Westmoreland](https://www.presidency.ucsb.edu/documents/remarks-the-press-the-lbj-ranch-following-report-vietnam-general-westmoreland) (Aug. 14, 1966). [[w.westmoreland-soldier-reports]]. Names: Westmoreland (K–J Adm. III.F).'
    tags: [name:westmoreland-william, name:johnson-lyndon-b]
  - id: cal.1966-08-16.students
    when: Aug. 16–19
    date: '1966-08-16'
    thread: students
    also: [vietnam]
    c: 'House Un-American Activities Committee, hearings on Pool''s bill, H.R. 12047, and others: aid to an enemy in an undeclared war punishable by $20,000, twenty years, or both. Witnesses from the Progressive Labor Party and the Berkeley Vietnam Day Committee. Kinoy, counsel to witnesses, carried from the room by marshals (Check the day); Rubin in the uniform of a soldier of the Revolution. Arrests in the hall and outside (Check).'
    n: 'House Committee on Un-American Activities, *Hearings on Bills to Make Punishable Assistance to Enemies of U.S. in Time of Undeclared War*, 89th Cong., 2d Sess. (Aug. 16–23, 1966) (Check the title). [[w.goodman-committee]]; [[w.wells-war-within]].'
    tags: [name:pool-joe-r]
  - id: cal.1966-08-17.transportation
    when: Aug. 17–31
    date: '1966-08-17'
    thread: transportation
    c: 'House passes the National Traffic and Motor Vehicle Safety Act, H.R. 13228, [371–0](https://voteview.com/rollcall/RH0890304): federal safety standards for new cars; an advisory council named by the President, not the Secretary of Commerce, refused, [168–205](https://voteview.com/rollcall/RH0890303). Aug. 18, the Highway Safety Act, H.R. 13290, [318–3](https://voteview.com/rollcall/RH0890306): grants for the States'' safety programs. Aug. 31, the conference reports, [365–0](https://voteview.com/rollcall/RH0890320) and [360–3](https://voteview.com/rollcall/RH0890321). The Senate had passed S. 3005 June 24, [76–0](https://voteview.com/rollcall/RS0890335).'
    n: '[[w.mashaw-struggle-for-auto-safety]]; [[w.nader-unsafe-at-any-speed]]. See [[cal.1966-03-02.transportation]].'
  - id: cal.1966-08-17.defense
    when: Aug. 17–18
    date: '1966-08-17'
    thread: defense
    also: [vietnam]
    c: 'Senate, the defense appropriation. The Russell–Saltonstall amendment: the President may order to active duty, for up to 24 months, a member of the Ready Reserve who has served on active duty only for training, [66–21](https://voteview.com/rollcall/RS0890417); a wider call, by units, refused, [26–62](https://voteview.com/rollcall/RS0890416). Aug. 18, the bill passes, [86–0](https://voteview.com/rollcall/RS0890422).'
    n: '[[w.fite-richard-b-russell-jr]]; [[w.flynn-draft-1940-1973]]. Names: Russell (K–J Cong. III.B); Saltonstall (Opp. III.A).'
    tags: [name:russell-richard-b, name:saltonstall-leverett]
  - id: cal.1966-08-19.cities-and-housing
    when: Aug. 19
    date: '1966-08-19'
    thread: cities-and-housing
    c: 'Senate passes the demonstration cities bill, S. 3708, [53–22](https://voteview.com/rollcall/RS0890425); an amendment to strike all its money but $24 million for planning lost, [26–55](https://voteview.com/rollcall/RS0890423). Muskie the bill''s manager. July 27, Johnson on the subcommittee''s report: "good news for the future of our cities."'
    n: '[Statement by the President Following Senate Committee Action on the Demonstration Cities Bill](https://www.presidency.ucsb.edu/documents/statement-the-president-following-senate-committee-action-the-demonstration-cities-bill) (July 27, 1966). See [[cal.1966-01-26.cities-and-housing]]. Names: Muskie (K–J Cong. III.B).'
    tags: [name:muskie-edmund-s, name:johnson-lyndon-b]
  - id: cal.1966-08-25.civil-rights-the-executive
    when: Aug. 25
    date: '1966-08-25'
    thread: civil-rights-the-executive
    c: 'Randolph and Heineman bring the report of the White House Conference "To Fulfill These Rights," held June 1–2, to the Cabinet. Johnson: "an agenda for debate and action for years to come." McPherson and Clifford Alexander to chair a committee of officials, its interim report within 30 days. Copies to every governor, and through Humphrey to the mayors of more than 500 cities.'
    n: '[Statement by the President in Response to Final Report of White House Conference "To Fulfill These Rights."](https://www.presidency.ucsb.edu/documents/statement-the-president-response-final-report-white-house-conference-fulfill-these-rights) (Aug. 25, 1966); [Remarks to the Press Following a Cabinet Meeting on Foreign and Military Policy](https://www.presidency.ucsb.edu/documents/remarks-the-press-following-cabinet-meeting-foreign-and-military-policy) (Aug. 25, 1966). [[w.graham-civil-rights-era]]. See [[cal.1965-11-16.civil-rights-the-executive]]. Names: Randolph (K–J Cong. III.H); McPherson (K–J Adm. III.C); Humphrey (K–J Adm. III.D).'
    tags: [name:randolph-a-philip, name:mcpherson-harry, name:alexander-clifford-l-jr, name:humphrey-hubert-h, name:johnson-lyndon-b]
  - id: cal.1966-08-26.open-housing
    when: Aug. 26
    date: '1966-08-26'
    thread: open-housing
    also: [king, states-and-cities]
    c: 'Chicago. The summit, from Aug. 17: Daley and the city, the Real Estate Board, the Housing Authority, churches, business, and labor with the Freedom Movement; Aug. 26, an agreement at the Palmer House. The Commission on Human Relations to enforce the city''s fair-housing ordinance; the Real Estate Board to drop its opposition to open occupancy (Check the terms); public housing scattered and low; mortgages without regard to race. The marches suspended, the one into Cicero called off. King: "the first step in a 1,000-mile journey."'
    n: '[[w.chicago-1966]], which prints the agreement (Check). See [[cal.1966-07-10.open-housing]]. Names: King (K–J Cong. III.H); Daley (K–J Cong. III.F).'
    tags: [name:king-martin-luther-jr, name:daley-richard-j]
  - id: cal.1966-08-26.jobs-and-wages
    when: Aug. 26
    date: '1966-08-26'
    thread: jobs-and-wages
    c: 'Senate passes the Fair Labor Standards Amendments, H.R. 13712, [57–17](https://voteview.com/rollcall/RS0890438): the minimum wage to $1.40 Feb. 1, 1967, $1.60 a year later; coverage to farm workers and others not covered before (Check the classes). Keeping $1.40 two years lost, Aug. 25, [40–42](https://voteview.com/rollcall/RS0890427); the newly covered farm workers kept in, [37–51](https://voteview.com/rollcall/RS0890429). The House passed its bill May 26, [303–93](https://voteview.com/rollcall/RH0890261).'
    n: '[[w.nordlund-quest-for-a-living]].'
  - id: cal.1966-08-28.economy
    when: Aug. 28–29
    date: '1966-08-28'
    thread: economy
    c: 'Truman, from Kansas City, Aug. 28: "A drastic increase in interest rates has been imposed on the American economy"; a "serious depression" possible; of the Federal Reserve: "Is it being so administered now? Is it in the true sense a Federal system?" Johnson, Aug. 29: concerned at the rise, but "I cannot agree ... that our economy is in danger of recession or depression"; tight money "symptoms of strength, not weakness"; "better ways to restrain inflationary pressures" to be found than high interest rates.'
    n: '[Statement by the President in Response to President Truman''s Statement on the Effect of Rising Interest Rates](https://www.presidency.ucsb.edu/documents/statement-the-president-response-president-trumans-statement-the-effect-rising-interest) (Aug. 29, 1966), with Truman''s statement. [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]. See [[cal.1965-12-05.economy]]; [[cal.1966-07-19.economy]].'
    tags: [name:truman-harry-s, name:johnson-lyndon-b]
  - id: cal.1966-08-30.transportation
    when: Aug. 30
    date: '1966-08-30'
    thread: transportation
    c: 'House passes the Department of Transportation bill, H.R. 15963, [336–42](https://voteview.com/rollcall/RH0890318). The Maritime Administration left out, [261–117](https://voteview.com/rollcall/RH0890316); air accident investigation kept in, recommittal lost, [143–238](https://voteview.com/rollcall/RH0890317).'
    n: 'See [[cal.1966-03-02.transportation]].'
