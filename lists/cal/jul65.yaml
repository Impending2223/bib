# Cal. LXII July 1965
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: LXII
entries:
  - id: cal.1965-07-01.vietnam
    when: July 1
    date: '1965-07-01'
    thread: vietnam
    c: 'Four papers for Johnson. McNamara: the Viet Cong winning; American and third-country forces to 44 battalions, some 100,000 reservists called up, a quarantine of the North by mining its harbors. Ball, "A Compromise Solution": hold at the 72,000 men announced, open talks, cut losses. William Bundy, a "middle way": 18 battalions, about 85,000 men, for two months. Rusk: Hanoi must not take the South by force.'
    n: 'FRUS 1964–68, III, docs. [38](https://history.state.gov/historicaldocuments/frus1964-68v03/d38), [39](https://history.state.gov/historicaldocuments/frus1964-68v03/d39), [40](https://history.state.gov/historicaldocuments/frus1964-68v03/d40), [41](https://history.state.gov/historicaldocuments/frus1964-68v03/d41), [42](https://history.state.gov/historicaldocuments/frus1964-68v03/d42). See [[cal.1965-06-07.vietnam]]. Also McMaster, *Dereliction of Duty*; Preston, *The War Council*; Goldstein, *Lessons in Disaster* (Viet. II.C.3). Berman, *Lyndon Johnson''s War* (Viet. II.C.1). Gibbons, *The U.S. Government and the Vietnam War* (K–J Adm. II.D). McNamara, *In Retrospect*; Ball, *The Past Has Another Pattern*; Clifford, *Counsel to the President* (K–J Adm. II.G.4). Johnson, *The Vantage Point*; *Reaching for Glory* (K–J Adm. II.G.3). Names: McNamara (K–J Adm. III.F); Ball, William Bundy, Rusk (K–J Adm. III.E).'
    tags: [name:mcnamara-robert-s, name:ball-george-w, name:bundy-william, name:rusk-dean, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - id: cal.1965-07-06.succession
    when: July 6
    date: '1965-07-06'
    thread: succession
    c: Senate adopts the conference report on Bayh's amendment on presidential disability and a vacancy in the Vice Presidency, S.J. Res. 1, [68–5](https://voteview.com/rollcall/RS0890139); the House had agreed June 30 by a two-thirds division, without a roll call. To the States, [79 Stat. 1327](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg1327.pdf). Nebraska ratifies first, July 12.
    n: '[111 Cong. Rec., Senate, July 6, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-10-1.pdf); [111 Cong. Rec., House, June 30, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-7-1.pdf). John D. Feerick, *The Twenty-Fifth Amendment: Its Complete History and Earliest Applications* (1976). See [[cal.1964-09-28.succession]]. Names: Bayh (Cong. III.B).'
    tags: [name:bayh-birch]
  - id: cal.1965-07-08.vietnam
    when: July 8
    date: '1965-07-08'
    thread: vietnam
    also: [transition-and-staff]
    c: Taylor resigns as Ambassador to South Vietnam, his year done; letter of July 7. Lodge to go back in his place. July 9, at a news conference, Johnson denies any difference of policy behind the change.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1037) (July 9, 1965). Taylor, *Swords and Plowshares* (K–J Adm. II.G.4). See [[cal.1964-06-23.vietnam]]; [[cal.1965-07-01.vietnam]]. Names: Taylor (K–J Adm. III.F); Lodge (K–J Adm. III.E).'
    tags: [name:taylor-maxwell, name:lodge-henry-cabot, name:johnson-lyndon-b]
  - id: cal.1965-07-09.medicare
    when: July 9
    date: '1965-07-09'
    thread: medicare
    also: [welfare]
    c: Senate passes the Social Security amendments, H.R. 6675, hospital and medical insurance for the aged, [68–21](https://voteview.com/rollcall/RS0890151). An amendment to strike both, [26–64](https://voteview.com/rollcall/RS0890145); Prouty's, $35 a month in Social Security for all 72 and over not otherwise covered, tabled, [55–36](https://voteview.com/rollcall/RS0890144). To conference.
    n: '[111 Cong. Rec., Senate, July 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-3-1.pdf). [Statement by the President Following Passage of the Medicare Bill by the Senate](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-medicare-bill-the-senate) (July 9, 1965). See [[cal.1965-01-07.medicare]]. Names: Prouty (Opp. III.B).'
    tags: [name:prouty-winston-l, name:johnson-lyndon-b]
  - id: cal.1965-07-09.voting-rights
    when: July 9
    date: '1965-07-09'
    thread: voting-rights
    c: House passes the voting rights bill, H.R. 6400, [333–85](https://voteview.com/rollcall/RH0890087), with a ban on the poll tax in State elections. The Republican substitute of Ford and McCulloch, H.R. 7896, lost on a motion to recommit, [171–248](https://voteview.com/rollcall/RH0890086). July 10, Johnson's statement names the House Republican leadership as having tried to weaken the bill.
    n: '[111 Cong. Rec., House, July 9, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-3-2.pdf). [Statement by the President Following Passage of the Voting Rights Bill by the House of Representatives](https://www.presidency.ucsb.edu/documents/statement-the-president-following-passage-the-voting-rights-bill-the-house-representatives) (July 10, 1965). See [[cal.1965-03-15.voting-rights]]. Names: Ford (K–J Cong. III.C); McCulloch (K–J Cong. III.E); Celler (K–J Cong. III.D).'
    tags: [name:ford-gerald-r, name:mcculloch-william-m, name:celler-emanuel, name:johnson-lyndon-b]
  - id: cal.1965-07-13.court
    when: July 13
    date: '1965-07-13'
    thread: court
    also: [civil-rights-the-executive]
    c: News conference. Thurgood Marshall, of the Second Circuit, named Solicitor General, the 33d; he leaves the bench. Cox goes back to Massachusetts. Confirmed Aug. 11, without a roll call; sworn Aug. 24.
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1036) (July 13, 1965); [Remarks at the Swearing In of Judge Thurgood Marshall as Solicitor General](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-judge-thurgood-marshall-solicitor-general) (Aug. 24, 1965). [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). Williams, *Thurgood Marshall* (K–J Cong. II.G). Names: Marshall, Cox (K–J Cong. III.G).'
    tags: [name:johnson-lyndon-b, name:marshall-thurgood, name:cox-archibald]
  - id: cal.1965-07-14.transition-and-staff
    when: July 14
    date: '1965-07-14'
    thread: transition-and-staff
    c: Stevenson dies in London, of a heart attack in the street. July 20, Goldberg named from the Court to the United Nations; sworn July 26.
    n: '[Statement by the President on the Death of Adlai Stevenson](https://www.presidency.ucsb.edu/documents/statement-the-president-the-death-adlai-stevenson) (July 14, 1965); [Executive Order 11233—Adlai E. Stevenson](https://www.presidency.ucsb.edu/documents/executive-order-11233-adlai-e-stevenson) (July 14, 1965); [Remarks Upon Announcing the Nomination of Arthur J. Goldberg as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-upon-announcing-the-nomination-arthur-j-goldberg-us-representative-the-united) (July 20, 1965); [Remarks at the Swearing In of Arthur J. Goldberg as U.S. Representative to the United Nations](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-arthur-j-goldberg-us-representative-the-united-nations) (July 26, 1965). Martin, *Adlai Stevenson and the World*; Stebenne, *Arthur J. Goldberg* (K–J Adm. II.G.5). Murphy, *Fortas* (K–J Cong. II.G). Names: Stevenson, Goldberg (K–J Adm. III.E).'
    tags: [name:stevenson-adlai-e, name:goldberg-arthur-j, name:johnson-lyndon-b]
  - id: cal.1965-07-14.welfare
    when: July 14
    date: '1965-07-14'
    thread: welfare
    c: 'Older Americans Act signed, [79 Stat. 218](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg218.pdf): an Administration on Aging in HEW; grants to the States for community planning and services for the aged, research, and training. The Fogarty–McNamara bill; the House passed it Mar. 31, [396–1](https://voteview.com/rollcall/RH0890027).'
    n: '[Remarks at the Signing of the Older Americans Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-older-americans-act) (July 14, 1965). Sundquist, *Politics and Policy* (K–J Cong. II.B).'
    tags: [name:johnson-lyndon-b, name:fogarty-john-e, name:mcnamara-patrick-v]
  - id: cal.1965-07-18.opinion
    when: July 18
    date: '1965-07-18'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, June 24–29: those approving the Administration''s handling of Vietnam: Johnson knows the situation 40 percent; contain communism 24; we are committed 14. Those disapproving: none of our business 23; be more aggressive 18; too many boys killed 18. If South Vietnam stops fighting: the United States to go on alone 19, withdraw 65.'
    n: '*The Gallup Poll*, III, 1951 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-20.vietnam
    when: July 20
    date: '1965-07-20'
    thread: vietnam
    c: 'McNamara, back from Saigon with Lodge and Wheeler, to Johnson: American battalions from 15 to 34 by October, about 175,000 men, perhaps 100,000 more early in 1966; some 235,000 reservists and guardsmen called up; the regular forces up 375,000; a supplemental appropriation. Taylor, Lodge, Westmoreland, Sharp, and Wheeler concur in the military recommendations.'
    n: '[FRUS 1964–68, III, doc. 67](https://history.state.gov/historicaldocuments/frus1964-68v03/d67). See [[cal.1965-07-01.vietnam]]. Names: McNamara, Wheeler (K–J Adm. III.F); Lodge (K–J Adm. III.E); Westmoreland, Sharp, Taylor (K–J Adm. III.F).'
    tags: [name:mcnamara-robert-s, name:lodge-henry-cabot, name:wheeler-earle, name:taylor-maxwell, name:westmoreland-william, name:sharp-u-s-grant, name:johnson-lyndon-b]
  - id: cal.1965-07-21.vietnam
    when: July 21–27
    date: '1965-07-21'
    thread: vietnam
    c: 'Johnson''s week of meetings on the McNamara report. July 21, the principals, Ball arguing for a compromise; July 22, the Joint Chiefs and service secretaries, then Clifford, McCloy, and Dean; July 24, an F-4C, the first plane lost to a SAM; July 25, Camp David, Clifford against more troops. July 27, strikes on the SAM sites. July 27, the NSC: troops to Vietnam, no reserves called, no emergency declared, money asked later. That evening, the congressional leaders; Mansfield reads a statement of his doubts.'
    n: 'FRUS 1964–68, III, docs. [71](https://history.state.gov/historicaldocuments/frus1964-68v03/d71), [76](https://history.state.gov/historicaldocuments/frus1964-68v03/d76), [78](https://history.state.gov/historicaldocuments/frus1964-68v03/d78), [85](https://history.state.gov/historicaldocuments/frus1964-68v03/d85), [87](https://history.state.gov/historicaldocuments/frus1964-68v03/d87), [90](https://history.state.gov/historicaldocuments/frus1964-68v03/d90), [93](https://history.state.gov/historicaldocuments/frus1964-68v03/d93), [94](https://history.state.gov/historicaldocuments/frus1964-68v03/d94), [96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). See [[cal.1965-07-01.vietnam]]. Names: Ball (K–J Adm. III.E); Clifford (Viet. III.A); Mansfield (K–J Cong. III.A).'
    tags: [name:johnson-lyndon-b, name:ball-george-w, name:clifford-clark, name:mccloy-john-j, name:dean-arthur-h, name:mansfield-mike, name:mcnamara-robert-s, name:rusk-dean, name:wheeler-earle, name:bundy-mcgeorge]
  - id: cal.1965-07-23.economy
    when: July 23
    date: '1965-07-23'
    thread: economy
    c: Coinage Act signed, [79 Stat. 254](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg254.pdf). No silver in new dimes and quarters, clad copper-nickel on copper; the half dollar 40 percent silver. The silver dollar unchanged. The House passed it July 14, [255–154](https://voteview.com/rollcall/RH0890092), 40 percent silver in dimes and quarters refused, [187–218](https://voteview.com/rollcall/RH0890091).
    n: '[Remarks at the Signing of the Coinage Act](https://www.presidency.ucsb.edu/documents/remarks-the-signing-the-coinage-act) (July 23, 1965). [111 Cong. Rec., House, July 14, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-6-2.pdf). See [[cal.1965-06-03.economy]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-23.crime-and-hijacking
    when: July 23
    date: '1965-07-23'
    thread: crime-and-hijacking
    c: 'Executive order: a President''s Commission on Law Enforcement and Administration of Justice, a final report within eighteen months. July 26, Katzenbach its chairman, eighteen members named.'
    n: '[Executive Order 11236—Establishing the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/executive-order-11236-establishing-the-presidents-commission-law-enforcement-and) (July 23, 1965), [30 Fed. Reg. 9349](https://www.govinfo.gov/app/details/FR-1965-07-27); [Statement by the President on Establishing the President''s Commission on Law Enforcement and Administration of Justice](https://www.presidency.ucsb.edu/documents/statement-the-president-establishing-the-presidents-commission-law-enforcement-and) (July 26, 1965). *The Challenge of Crime in a Free Society* (K–J Cong. II.J.3). Flamm, *Law and Order* (K–J Cong. II.F). Names: Katzenbach (K–J Adm. III.I).'
    tags: [name:johnson-lyndon-b, name:katzenbach-nicholas]
  - id: cal.1965-07-25.opinion
    when: July 25
    date: '1965-07-25'
    thread: opinion
    also: [immigration]
    c: 'Gallup, June 24–29: in admitting immigrants, very important: occupational skills 71 percent; relatives who are citizens 55; country of birth 33. Immigration kept at its present level 39, decreased 33, increased 8. Admit those who escape communism, 64. Admission by skills instead of the quotas: favor 51, oppose 32.'
    n: '*The Gallup Poll*, III, 1952–53 (K–J Cong. II.E).'
  - id: cal.1965-07-26.confirmations
    when: July 26
    date: '1965-07-26'
    thread: confirmations
    also: [court]
    c: Senate confirms J. P. Coleman, governor of Mississippi 1956–60, to the Fifth Circuit, [76–8](https://voteview.com/rollcall/RS0890173).
    n: '[111 Cong. Rec., Senate, July 26, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-6-2.pdf). Bass, *Unlikely Heroes* (K–J Cong. II.H). Names: Coleman (K–J Cong. III.K).'
    tags: [name:coleman-j-p]
  - id: cal.1965-07-27.health
    when: July 27
    date: '1965-07-27'
    thread: health
    c: 'Federal Cigarette Labeling and Advertising Act signed, without ceremony, [79 Stat. 282](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg282.pdf). On every pack from Jan. 1, 1966, "Caution: Cigarette Smoking May Be Hazardous to Your Health." No other statement required on packs, and none in advertising, by any agency or State; the advertising clause to July 1, 1969. Conference report, House, July 13, [286–103](https://voteview.com/rollcall/RH0890090).'
    n: '[111 Cong. Rec., House, July 13, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-5-1.pdf). See [[cal.1965-06-16.health]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-07-27.transition-and-staff
    when: July 27
    date: '1965-07-27'
    thread: transition-and-staff
    also: [school-aid]
    c: Celebrezze to the Sixth Circuit. Gardner, president of the Carnegie Corporation, a Republican, to be Secretary of Health, Education, and Welfare; sworn Aug. 18.
    n: '[Remarks on Announcing the Nominations of Anthony J. Celebrezze as Judge, U.S. Court of Appeals, Sixth Circuit, and John W. Gardner as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/remarks-announcing-the-nominations-anthony-j-celebrezze-judge-us-court-appeals-sixth) (July 27, 1965); [Remarks at the Swearing In of Dr. John W. Gardner as Secretary of Health, Education, and Welfare](https://www.presidency.ucsb.edu/documents/remarks-the-swearing-dr-john-w-gardner-secretary-health-education-and-welfare) (Aug. 18, 1965). See [[cal.1965-01-20.transition-and-staff]]. Names: Celebrezze, Gardner (K–J Adm. III.G).'
    tags: [name:johnson-lyndon-b, name:celebrezze-anthony-j, name:gardner-john-w]
  - id: cal.1965-07-28.vietnam
    when: July 28
    date: '1965-07-28'
    thread: vietnam
    c: 'News conference, the East Room, midday: "Why are we in Viet-Nam?" The Air Mobile Division and other forces ordered, from 75,000 men to 125,000 "almost immediately"; more later as asked. The monthly draft call from 17,000 to 35,000. Reserves not called now. Goldberg to carry a letter to U Thant.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1038) (July 28, 1965). [FRUS 1964–68, III, doc. 97](https://history.state.gov/historicaldocuments/frus1964-68v03/d97). See [[cal.1965-07-01.vietnam]]; [[cal.1965-07-21.vietnam]]. Names: Goldberg (K–J Adm. III.E); U Thant (K–J Adm. III.J).'
    tags: [name:johnson-lyndon-b, name:goldberg-arthur-j, name:u-thant, name:westmoreland-william]
  - id: cal.1965-07-28.court
    when: July 28
    date: '1965-07-28'
    thread: court
    c: 'The same news conference: Fortas named to Goldberg''s seat, "the job has sought the man." Hearing Aug. 5; confirmed Aug. 11, without a roll call.'
    n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1038) (July 28, 1965). [111 Cong. Rec., Senate, Aug. 11, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-2-2.pdf). Murphy, *Fortas* (K–J Cong. II.G). See [[cal.1965-07-14.transition-and-staff]]. Names: Fortas, Goldberg (K–J Cong. III.G).'
    tags: [name:johnson-lyndon-b, name:fortas-abe, name:goldberg-arthur-j]
  - id: cal.1965-07-28.jobs-and-wages
    when: July 28
    date: '1965-07-28'
    thread: jobs-and-wages
    c: House passes H.R. 77, repealing section 14(b) of the Taft-Hartley Act, the States' right-to-work laws, [221–203](https://voteview.com/rollcall/RH0890101); recommittal lost, [200–223](https://voteview.com/rollcall/RH0890100). The rule taken July 26, [248–171](https://voteview.com/rollcall/RH0890096). To the Senate.
    n: '[111 Cong. Rec., House, July 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-1-2.pdf). Repeal of section 14(b) (K–J Cong. II.J.2). Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B).'
  - id: cal.1965-07-30.medicare
    when: July 30
    date: '1965-07-30'
    thread: medicare
    also: [welfare, health]
    c: Social Security Amendments of 1965 signed at the Truman Library, Independence, Truman beside him, [79 Stat. 286](https://www.govinfo.gov/content/pkg/STATUTE-79/pdf/STATUTE-79-Pg286.pdf). Hospital insurance for those over 65 under Social Security, up to 90 days for each illness; a voluntary plan for doctors' fees, $3 a month matched by the Government; Medicaid, grants to the States for the medically needy. Benefits up 7 percent. Conference report, House, July 27, [307–116](https://voteview.com/rollcall/RH0890097); Senate, July 28, [70–24](https://voteview.com/rollcall/RS0890174).
    n: '[Remarks With President Truman at the Signing in Independence of the Medicare Bill](https://www.presidency.ucsb.edu/documents/remarks-with-president-truman-the-signing-independence-the-medicare-bill) (July 30, 1965). [111 Cong. Rec., House, July 27, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-7-2.pdf); [111 Cong. Rec., Senate, July 28, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-1-1.pdf). Statute (K–J Cong. II.J.2). Harris, *A Sacred Trust*; Corning, *The Evolution of Medicare*; Marmor, *The Politics of Medicare*; David, *With Dignity*; Zelizer, *Taxing America*; Zelizer, *The Fierce Urgency of Now* (K–J Cong. II.B). Blumenthal & Morone, *The Heart of Power* (K–J Adm. II.B). Berkowitz, *Mr. Social Security* (K–J Adm. II.G.5). See [[cal.1965-01-07.medicare]]; [[cal.1965-07-09.medicare]]. Names: Johnson (K–J Adm. III.D).'
    tags: [name:johnson-lyndon-b, name:truman-harry-s]
