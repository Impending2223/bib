      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 487–488: all'
    tags: [polity:prc, vis:only:prc, name:zhou-enlai, name:chen-boda, name:kang-sheng, name:mao-zedong, name:li-lisan, name:li-zaihan]
