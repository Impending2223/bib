    place: kaifeng
    thread: china-leadership
    also: [china]
    c: Kaifeng. Liu Shaoqi is in critical condition a second time.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Oct. 31, 1969). Made public: 1996. See [[cal.1969-10-24.china-leadership-2]]. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
