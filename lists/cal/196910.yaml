  - id: cal.1969-10-20.china-leadership-8
    when: Oct. 20
    date: '1969-10-20'
    place:
      - peking
      - nanchang
    thread: china-border-war
    c: 'Chen Yun 陈云 and Wang Zhen 王震 leave together in one official railway car for Nanchang 南昌, Jiangxi 江西. Before leaving he has his staff pack Marx and Engels''s *Collected Works* 《马克思恩格斯全集》 and *Selected Works* 《马克思恩格斯选集》, *Capital* 《资本论》, Lenin''s *Collected Works* 《列宁全集》 and *Selected Works* 《列宁选集》, Stalin''s *Collected Works* 《斯大林全集》, Mao''s *Selected Works* 《毛泽东选集》, Lu Xun''s *Complete Works* 《鲁迅全集》 and others, two iron trunks and a wooden box, to go on reading in Jiangxi. None of his family goes with him: his wife Yu Ruomu 于若木 is at the Academy of Sciences'' 中国科学院 May Seventh cadre school at Hengdong 衡东, Hunan 湖南; of their five children one is at a May Seventh school, one at university awaiting assignment, one teaching at a village school outside Peking 北京, one assigned to the army in Tibet 西藏, one a worker in a Peking factory.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 171. See [[cal.1969-10-17.china-leadership]]. Made public: 2015. Names: Chen Yun, Wang Zhen, Lu Xun.'
    tags: [polity:prc, name:chen-yun, vis:only:prc, name:lu-xun, name:wang-zhen]
