    when: Oct. 20
    date: '1969-10-20'
    thread: china-leadership
    also: [soviet-union, china]
    c: Zhou Enlai, during the Sino-Soviet boundary talks that open in Peking Oct. 20, repeatedly gives concrete instructions on the Chinese side's line, tactics and methods, and reports major questions to Mao at once for approval.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 20, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
