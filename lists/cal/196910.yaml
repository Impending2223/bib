    c: 'Mao, Peking: approves Zhou Enlai''s reply to Kosygin''s letter of Sept. 26 and the fifteenth draft of the government statement.{1} The reply restates the five interim measures, to be taken up first once talks open, and names Qiao Guanhua head of China''s delegation.{2}'
