  - id: cal.1969-10-17.china-leadership
    when: Oct. 17
    date: '1969-10-17'
    place: peking
    thread: china-zhou-foreign
    also: [india-and-china-cultural-revolution, soviet-union, china-foreign]
    c: 'Zhou Enlai and the Politburo''s members tell the old comrades in Peking, in groups, of the decision by Mao and the Center that they leave the capital for war readiness about Oct. 20, each to a place Mao names: Dong Biwu, Zhu De and Ye Jianying to Guangdong;{1} Chen Yun, Deng Xiaoping and Wang Zhen to Jiangxi;{2} Chen Yi to Shijiazhuang;{3} Nie Rongzhen to Handan;{4} Xu Xiangqian to Kaifeng.{5}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17, 1969; the evening talks with the old comrades); [[w.macfarquhar-maos-last-revolution]], 318 (Mao decides himself where each is to be sent); [[w.macfarquhar-maos-last-revolution]], 318 (the old colleagues often treated with contempt by the provincial authorities; Ye Jianying''s ten months away from the capital); [[w.deng-xiaoping-nianpu-1904]], III, 1948 (Oct. 17, 1969; the nianpu: Zhou Enlai and the Politburo''s members talk in groups with some old cadres in Peking and pass on the decision of Mao and the Center to disperse them, on a war footing, to other places on Oct. 20 or after; Mao names Dong Biwu, Zhu De and Ye Jianying for Guangdong, Chen Yun, Deng Xiaoping and Wang Zhen for Jiangxi, Chen Yi for Shijiazhuang, Nie Rongzhen for Handan and Xu Xiangqian for Kaifeng); [[w.yang-jisheng-tiandi-fanfu]], II, 738 (the decision taken that day by Zhou and the Politburo on Mao''s and the Center''s judgment, the old comrades to leave on Oct. 20 or soon after; Zhou names each one''s place); [[w.teiwes-tragedy-of-lin-biao]], 113 (Zhou, helped by Mao''s chief bodyguard Wang Dongxing, in charge of moving the leaders, Mao and Lin too, Deng Xiaoping and Chen Yun among them; by an authoritative oral source Mao, displeased with the old marshals'' gossiping by telephone, glad to see them scattered; Nie first thought the order came from Mao); [[w.jian-zhou-enlai]], 624 (Zhou''s evacuation plan: Mao to Wuhan, Lin to Suzhou, the four marshals to different places, their discussions ended; not the day); [[w.chen-yi-nianpu]], 1214 (Oct. 17, 1969, evening, after the athletes'' display; Chen Yi and the other old comrades, called to the rest room, are told the Center''s decision: to guard against a Soviet surprise attack, all the old comrades in Peking to be dispersed for war readiness before Oct. 20, Dong Biwu, Zhu De and Ye Jianying to Guangdong, Chen Yun and Wang Zhen to Jiangxi, Chen Yi to Kaifeng, Nie Rongzhen to Handan, Hebei, Xu Xiangqian to Shijiazhuang); [[w.dikotter-cultural-revolution]], 209 n.8 (only Zhou Enlai stays, moving into an underground command centre in the suburbs with the General Staff); [[w.liu-jixian-ye-jianying-nianpu]], II, 985–986 (Oct. 17, 1969; after the display Ye Jianying 叶剑英 with Dong Biwu, Zhu De, Chen Yun, Chen Yi, Deng Zihui 邓子恢, Li Fuchun, Zhang Dingcheng 张鼎丞 and others at the meeting Zhou calls in the gymnasium''s rest room; Zhou announces Mao''s and the Center''s decision on war-readiness evacuation, some old comrades to leave Peking on the 20th or a little later, Mao naming each one''s place, Zhou to telephone the arrangements, the General Office to ready special planes or trains: Dong Biwu, Zhu De and Ye Jianying to Guangdong 广东, Chen Yun and Wang Zhen 王震 to Jiangxi 江西, Chen Yi to Kaifeng 开封 in Henan, Nie Rongzhen to Zhengzhou 郑州, Xu Xiangqian to Shijiazhuang 石家庄; later changed: Ye to Hunan 湖南, Chen Yi to Shijiazhuang, Xu to Kaifeng, Nie to Handan 邯郸 in Hebei); [[w.chen-yun-nianpu-xiuding]], III, 170–171 (after the display Chen Yun, with Dong Biwu, Zhu De, Ye Jianying, Chen Yi, Deng Zihui, Li Fuchun, Zhang Dingcheng and others, at the meeting Zhou calls in the Gymnasium; Zhou announces Mao''s and the Center''s decision on dispersal for war readiness: "The Chairman, by the present situation, has decided that some comrades disperse from Peking to other places before or a little after the 20th, and has named each one''s place; I will see to the arrangements in each place by telephone, and the Center''s General Office will ready special planes or trains"; Dong Biwu, Zhu De and Ye Jianying to Guangdong, Chen Yun, Deng Xiaoping and Wang Zhen to Jiangxi, Chen Yi to Shijiazhuang, Nie Rongzhen to Handan, Xu Xiangqian to Kaifeng); [[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969; after the display Zhu De 朱德, with Dong Biwu 董必武, Chen Yun 陈云, Ye Jianying 叶剑英, Chen Yi 陈毅, Deng Zihui 邓子恢, Li Fuchun 李富春, Zhang Dingcheng 张鼎丞 and others, at the meeting Zhou Enlai 周恩来 calls in the gymnasium; Zhou announces the decision of Mao Zedong 毛泽东 and the Center 中共中央 on dispersal for war readiness: on the present situation the Chairman has decided that some comrades leave Peking 北京 for other places by or soon after the 20th, each to the place he names; Zhou to arrange their settling by telephone, the General Office 中央办公厅 to ready special planes or trains). Made public: 1995 ([[w.chen-yi-nianpu]], 1214). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17, 1969), has Zhou saying that Mao fixed each one''s place, that he would phone each place''s arrangements and the Central General Office would ready special planes or trains; afterward he repeatedly told those leaving to take their wives, their Peking residences being kept. To check: [[w.zhou-enlai-nianpu-1949]], III, 329 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.45); [[w.tingdong-wo-pei-ye-shuai]], 53–57 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.47); [[w.su-caiqing-wenhua-dageming-shishi-bianwu]], 79 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21a); [[w.yunsheng-maojiawan-jishi]], 106 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21b); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 320, 322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21c); Nie Rongzhen, "Several questions concerning Lin Biao," *Xinhua ribao* (Nanjing), Oct. 18–26, 1984, parts of his memoirs serialized, translated in FBIS, Nov. 5–7, 1984, Oct. 25, 1984 (FBIS, Nov. 7, 1984, K24) (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21d); [[w.nianyi-da-dongluande-niandai]], 362 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21e); [[w.ke-wenhua-dageming-zhongde-renmin]], 125, 252 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21f); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21g); [[w.chen-yi-zhuan]], 615 (cited by [[w.teiwes-tragedy-of-lin-biao]], 113 n.21h); [[w.li-genqing-before-and-after-lin-biaos-urgent]], 47 (cited by [[w.jian-zhou-enlai]], 624 n.43a); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (cited by [[w.jian-zhou-enlai]], 624 n.43b). See [[cal.1969-10-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Dong Biwu, Zhu De, Ye Jianying, Chen Yun, Deng Xiaoping, Wang Zhen, Chen Yi, Nie Rongzhen, Xu Xiangqian.'
