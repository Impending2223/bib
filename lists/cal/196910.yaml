    c: 'Zhou Enlai revises the draft reply of the Cultural Revolution Group and the State Council to the Shanxi revolutionary committee on the excavation of the Eastern Zhou slave-sacrifice tombs at Houma, adding to "agree only to clear the site, take all the material and make models of one or two representative tombs, with no need to preserve them on the spot": "it may also be considered, if the ground allows, to keep one or two representative slave-sacrifice tomb sites unchanged, for vivid class education." The Shanxi committee had asked on Aug. 25, from the site of Plant 502 at Houma.'
