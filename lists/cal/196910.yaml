    also: [china-hai-rui]
    c: Wu Han 吴晗, historian, former vice-mayor of Peking, author of *Hai Rui baguan* 海瑞罢官, dies, "persecuted to death" (the Wengao's words).
    n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 252 (Oct. 1969; note 1, a gloss on the May 16 Circular; the Peking committee rehabilitated him, with the Center''s approval, in Mar. 1979). Names: Wu Han. Check: the day and place, and when his death was made known.'
    src:
