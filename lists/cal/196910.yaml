    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1949 (Oct. 21, 1969). The words: 致信汪东兴 (III, 1949). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Mao Zedong, Lin Biao, Zhou Enlai, Wang Dongxing.'
