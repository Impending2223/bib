    c: '*Renmin ribao* 人民日报 prints the "Communique on the coming Sino-Soviet boundary talks of the governments of China and the Soviet Union" (Guanyu Zhong Su liangguo zhengfu jijiang juxing Zhong Su bianjie tanpan de gongbao 关于中苏两国政府即将举行中苏边界谈判的公报): by agreement of the two governments, talks at the level of deputy foreign ministers open in Peking Oct. 20.'
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 475 n.1 (Oct. 19, 1969). To check: *Renmin ribao*, Oct. 19, 1969, the communique (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 475 n.1b). See [[cal.1969-10-18.china-leadership-2]].'
