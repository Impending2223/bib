    when: Oct. 22
    date: '1969-10-22'
    thread: china-organization
    c: 'The Central Case Examination Group 中央专案审查小组 discusses the disposal of the prisoners: nine (so printed; eight are named) to be held and reformed by labor 关押、劳动改造, Peng Dehuai 彭德怀, Huang Kecheng 黄克诚, Liu Zhen 刘震, Li Jukui 李聚奎, Wu Zili 吴自立, Wang Ping 王平, Rao Zhengxi 饶正锡 and Li Rui 李锐; two to be handed to their units, Tang Dihua 唐棣华 and Pu Anxiu 浦安修.'
