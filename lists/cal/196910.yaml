  - id: cal.1969-10-20.china-leadership
    when: Oct. 20
    date: '1969-10-20'
    place: peking
    thread: china-border-war
    also: [soviet-union]
    c: The Sino-Soviet boundary talks open in Peking, Qiao Guanhua and V. V. Kuznetsov heading the delegations.{1} The Soviet side refuses to discuss the interim measures agreed Sept. 11 and denies any "disputed areas" on the boundary; the two sides far apart.{2}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 20, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 18–20, 1969; the communique and the talks'' opening); [[w.zhonghua-renmin-gongheguo-waijiao]], 230 (Oct. 20, 1969; the opening, at Beijing, of the vice-foreign-minister-level Sino-Soviet boundary talks, by the two governments'' agreement); [[w.macfarquhar-maos-last-revolution]], 317, 320 (Mao fears a Soviet surprise attack at the opening of the talks, with the Chinese guard down; the Soviet delegation comes and goes after fruitless talks); [[w.khoo-collateral-damage]], 60 (the border talks open in Peking, Oct. 20); [[w.jian-zhou-enlai]], 624 (the Soviet delegation arrives and the border talks begin as scheduled; the false alarm recognized); [[w.dikotter-cultural-revolution]], 209 n.8 (the Soviet delegation''s arrival: "On 20 October, nothing happened"). Made public: 2002. To check: [[w.barnouin-chinese-foreign-policy-during]], 95 (cited by [[w.macfarquhar-maos-last-revolution]], 317 n.42); [[w.galenovich-rossia-i-kitai-v]], 148–179 (cited by [[w.macfarquhar-maos-last-revolution]], 320 n.59a). Names: Qiao Guanhua, Kuznetsov. Check: the communique of Oct. 19 announcing the talks (*Renmin ribao*, Oct. 19).'
