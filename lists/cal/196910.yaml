  - id: cal.1969-10-23.china-leadership
    when: Oct. 23
    date: '1969-10-23'
    place: peking
    thread: china-zhou-foreign
    also: [latin-america-dominican-republic, china-foreign]
    c: 'Zhou Enlai receives Juan Bosch, former president of the Dominican Republic and former leader of its Revolutionary Party, and Aristy, a leader of the Dominican "Movement of April 24": revolution always goes through successes and failures;{1} failure is the mother of success; people must go through some failures to advance, and experience of both success and failure is complete experience. Bosch says that passing through Moscow from Paris on a Soviet plane they saw Soviet society to be a class society; Zhou calls it a great discovery, which many so-called Marxist-Leninists will not admit.{2}'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 23, 1969); [[w.zhou-enlai-waijiao-huodong]], 545 (Oct. 21, 1969; Fujian Hall, Great Hall of the People; the book names the April 24 leader 阿里斯蒂德); [[w.zhonghua-renmin-gongheguo-waijiao]], 230 (Oct. 21, 1969; Bosch and Héctor Aristy; the chronology''s day Oct. 21). Made public: 1993. Names: Zhou Enlai, Juan Bosch. Check: Aristy''s given name.'
