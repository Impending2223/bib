  - id: cal.1969-10.china-leadership-6
    when: Oct., mid
    date: 1969-10
    at: before 1969-10-11
    thread: china-border-war
    c: 'Deng Xiaoping 邓小平, at home, sees Wang Dongxing and Wang Liang''en 王良恩 (footnote: then a deputy director of the Central Committee''s 中央 General Office) and learns of the Center''s decision that some old cadres be dispersed on a war footing; he and Zhuo Lin are to go to a Jiangxi factory to work and be tempered. He asks Wang Dongxing to let him take his stepmother Xia Bogen along, to write to Wang from Jiangxi if need be, and to have wooden boxes made to carry his books. The General Office approves; Deng''s eldest daughter Deng Lin 邓林, sent down two years to Xuanhua in Hebei, is allowed back to help pack. Zhuo Lin visits Pufang at the General Hospital.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1948 (Oct. 1969). The words: 10月中旬 (III, 1948). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Wang Dongxing, Zhuo Lin.'
    src:
      c: 9b3c2ff5
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1948: all'
    tags: [polity:prc, name:deng-xiaoping, vis:only:prc, name:wang-dongxing, name:zhuo-lin]
  - id: cal.1969-10.china-leadership-7
    when: Oct., late
    date: 1969-10
    at: before 1969-10-21
    thread: china-economy
    c: 'Soon after the house is arranged, Deng Xiaoping 邓小平 sees Cheng Shiqing 程世清 and Chen Changfeng 陈昌奉 (footnote: Cheng, then chairman of the Jiangxi revolutionary committee and political commissar of the Military District; Chen, head of an independent division of the District and of the committee''s security group), who visit separately. He is ruled: apart from labour at the works he may not go out at will, not even from the small courtyard; his children''s visits need first the Jiangxi revolutionary committee''s consent.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Oct. 1969). The nianpu gives no day. Made public: 2009 (the nianpu). Names: Deng Xiaoping, Cheng Shiqing, Chen Changfeng.'
    src:
      c: 9e8d5321
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1950: all'
    tags: [polity:prc, name:deng-xiaoping, vis:only:prc, name:chen-changfeng, name:cheng-shiqing]
  - id: cal.1969-10.vietnam-hanoi
    when: Oct., late
    date: 1969-10
    at: before 1969-10-21
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'The Liberation forces open the winter–spring offensive of 1969–70: to strike hard and draw the enemy out, destroy part of his forces, loosen the defenses around Saigon, help the guerrillas against pacification and push the cities'' struggle. In eastern Nam Bộ the 5th, 7th and 9th Divisions, with the 320th Regiment from the Highlands: blows northeast and southwest of Saigon, to draw the enemy out to Bình Long and Tây Ninh.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 137–38.'
    tags: [polity:drv, place:saigon, province:binh-long, province:tay-ninh, ok:fields-place]
