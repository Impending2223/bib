list: cal
section: CXX
entries:
  - id: cal.1969-10-01.china-leadership
    when: Oct. 1
    date: '1969-10-01'
    thread: china-leadership
    also: [korea-leadership]
    c: Peking, Tiananmen, 10 a.m. Mao with Lin Biao, Zhou Enlai and others at the rally for the PRC's twentieth anniversary; reviews the parade. In the rest room with Lin he receives Choe Yong-gon of the Korean Workers' Party. Sino-Korean friendship; on Moscow, we do not want a war, we need not abuse Soviet revisionism daily; their daily abuse failed; the split pleases the US; the border has been quiet for a dozen days. He also meets Phạm Văn Đồng, Nouhak Phoumsavanh of the Lao People's Party, Albania's Toska, Italy's Dinucci, Sweden's Bylin and Ceylon's Shanmugathasan.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1969. Made public: 2013 (the talk with Choe). Names: Mao Zedong, Lin Biao, Zhou Enlai, Phạm Văn Đồng, Choe Yong-gon, Nouhak Phoumsavanh, Toska, Dinucci, Bylin, Shanmugathasan.'
    tags: [polity:prc, polity:dprk, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:pham-van-dong, vis:only:prc+dprk@E-I]
  - id: cal.1969-10-02.soviet-union-leadership
    when: Oct. 2
    date: '1969-10-02'
    thread: soviet-union-leadership
    c: 'Moscow. The second day of the talks of the Soviet and Polish party-government delegations, Brezhnev, Kosygin and others with Gomułka and Cyrankiewicz (Oct. 1–3). Brezhnev''s notes of Gomułka: what the Poles heard from the Soviet side the day before was "a great shock to us"; the prices of vodka and beer raised; no butter, only margarine.'
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 430 (№ 95, "Заметки... в ходе выступления В. Гомулки на второй день переговоров" (notes during Gomułka''s speech on the second day of the talks), Oct. 2), 450 n.256 (the editors: the Polish delegation in Moscow Oct. 1–3 by the Politburo''s decision of Sept. 30; Kirilenko, Baibakov, Lesechko, Ilichev and Aristov added to the Soviet side). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 363 (the secretaries'' record, Oct. 1–3: Brezhnev meets the Polish party-government delegation at Vnukovo Oct. 1; negotiates in the Kremlin from 3 p.m., and at 1 at the Poles'' residence; Oct. 2, after the Politburo, 9 to 10:50, with the Soviet delegation, 11 to 1; the dinner, 6 to 8:30; sees them off Oct. 3, 10 a.m.). Made public: 2016. To check: the Polish record; what the shock was. Names: Gomułka, Cyrankiewicz, Brezhnev.'
    src:
      c: daccc21b
      rows:
        - 'w.brezhnev-rabochie-i-dnevnikovye II, 363: ?'
    tags: [polity:ussr, polity:poland, name:brezhnev-leonid, name:gomu-ka-w-adys-aw, name:cyrankiewicz-jozef, name:kosygin-aleksei, vis:only:ussr+poland]
  - id: cal.1969-10-03.soviet-union-leadership
    when: Oct. 3–8
    date: '1969-10-03'
    thread: soviet-union-leadership
    also: [berlin-and-vienna]
    c: Berlin. Brezhnev leads the party-government delegation to the twentieth anniversary of the German Democratic Republic, leaving Moscow by train Oct. 3, 8 p.m.; in Berlin Oct. 5, 12:20 p.m.; speaks at the solemn session Oct. 6; leaves Oct. 8, 10 p.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 363–364 (Oct. 3–8). Names: Brezhnev.'
    tags: [name:brezhnev-leonid, polity:ussr, polity:gdr]
  - id: cal.1969-10-03.china-leadership
    when: Oct. 3
    date: '1969-10-03'
    thread: china-leadership
    also: [soviet-union]
    c: Mao, Hall 118, afternoon, calls Zhou Enlai and others to discuss the boundary talks with the Soviet Union.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 3, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-06.china-leadership
    when: Oct. 6
    date: '1969-10-06'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: approves Zhou Enlai''s reply to Kosygin''s letter of Sept. 26 and the fifteenth draft of the government statement. The reply restates the five interim measures, to be taken up first once talks open, and names Qiao Guanhua head of China''s delegation.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 6, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin, Qiao Guanhua.'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:zhou-enlai, name:kosygin-aleksei, name:qiao-guanhua, vis:only:prc+ussr]
  - id: cal.1969-10-07.china-leadership
    when: Oct. 7
    date: '1969-10-07'
    thread: china-leadership
    also: [soviet-union]
    c: 'The Chinese government''s statement, handed to the Soviet side the same day: China''s stand on the boundary restated; the Soviet side charged with new bloodshed on the border and with calling China the aggressor. Printed Oct. 8 in *Renmin ribao*.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 6, 1969. See [[cal.1969-10-06.china-leadership]]. To check: the statement (*Renmin ribao*, Oct. 8, 1969).'
    tags: [polity:prc, polity:ussr]
  - id: cal.1969-10-13.soviet-union-leadership
    when: Oct. 13
    date: '1969-10-13'
    thread: soviet-union-leadership
    also: [europe-and-the-alliance]
    c: Moscow. Brezhnev receives Schumann, Foreign Minister of France, 6 to 7:32 p.m., Gromyko and Zorin present.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 365 (Oct. 13). Names: Brezhnev, Gromyko, Schumann, Zorin.'
    tags: [name:brezhnev-leonid, name:gromyko-andrei, name:schumann-maurice, name:zorin-valentin-a, polity:ussr, polity:fr]
  - id: cal.1969-10-14.soviet-union-leadership
    when: Oct. 14
    date: '1969-10-14'
    thread: soviet-union-leadership
    also: [vietnam]
    c: Moscow. Brezhnev negotiates with the North Vietnamese party-government delegation led by Phạm Văn Đồng in the Kremlin, 10 to 1, Kosygin, Kirilenko, Baibakov, Gromyko, Patolichev and Rusakov taking part.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 365 (Oct. 14). Names: Brezhnev, Phạm Văn Đồng, Kosygin, Kirilenko, Baibakov, Gromyko, Patolichev, Rusakov.'
    tags: [name:brezhnev-leonid, name:pham-van-dong, name:kosygin-aleksei, name:kirilenko-andrei-p, name:gromyko-andrei, name:baibakov-nikolai-k, polity:ussr, polity:drv, name:patolichev-nikolai-s]
  - id: cal.1969-10-14.china-leadership
    when: Oct. 14
    date: '1969-10-14'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: Mao, 6 p.m., Hall 118, with Zhou Enlai and others; the Politburo meets at 8:30. He circles the request of Zhou, Chen Boda and Kang Sheng for a special case group of seven (Yang Chengwu, Yu Lijin, Fu Chongbi, Xiao Hua, Wang Li, Guan Feng, Qi Benyu). Mao leaves Peking by train.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Yang Chengwu, Yu Lijin, Fu Chongbi, Xiao Hua, Wang Li, Guan Feng, Qi Benyu.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-boda, name:kang-sheng, vis:only:prc]
  - id: cal.1969-10-15.china-leadership
    when: Oct. 15
    date: '1969-10-15'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, evening, on his train at Wuchang, hears Hubei''s Zeng Siyu and Liu Feng: not yet fit to form a provincial committee, the organs smaller than the old committee''s layers; clean class ranks not by arrests at one blow, struggle, criticize and reform unit by unit; Zhao Xiu and the other old committee cadres freed was good; speed the Jianghan oilfield, the Jiaozuo–Zhicheng railway, coal drilling; the army must prepare to fight.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 15, 1969. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Zhao Xiu.'
    tags: [polity:prc, name:mao-zedong, vis:only:prc]
  - id: cal.1969-10-17.china-leadership
    when: Oct. 17
    date: '1969-10-17'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: 'Zhou Enlai and the Politburo''s members tell the old comrades in Peking, in groups, of the decision by Mao and the Center that they leave the capital for war readiness about Oct. 20, each to a place Mao names: Dong Biwu, Zhu De and Ye Jianying to Guangdong; Chen Yun, Deng Xiaoping and Wang Zhen to Jiangxi; Chen Yi to Shijiazhuang; Nie Rongzhen to Handan; Xu Xiangqian to Kaifeng.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1969. Made public: 2013. See [[cal.1969-10-14.china-leadership]]. Names: Zhou Enlai, Mao Zedong, Dong Biwu, Zhu De, Ye Jianying, Chen Yun, Deng Xiaoping, Wang Zhen, Chen Yi, Nie Rongzhen, Xu Xiangqian.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:dong-biwu, name:zhu-de, name:ye-jianying, name:chen-yun, name:deng-xiaoping, name:chen-yi, name:nie-rongzhen, name:xu-xiangqian, vis:only:prc]
  - id: cal.1969-10-18.china-leadership
    when: Oct. 18
    date: '1969-10-18'
    thread: china-leadership
    also: [soviet-union]
    c: 'Lin Biao, convalescing at Suzhou, dictates without Mao''s approval an emergency order to raise war readiness and guard against surprise attack: a command staff to take wartime posts at once. His secretary telephones it to Huang Yongsheng, chief of staff, in Peking; that night Huang and others issue it to the whole army as "Vice-Chairman Lin''s instruction (the first order)" and the army goes on alert.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. Made public: 2013. Names: Lin Biao, Huang Yongsheng, Mao Zedong.'
    tags: [polity:prc, name:lin-biao, name:huang-yongsheng, name:mao-zedong, vis:only:prc]
  - id: cal.1969-10-18.china-leadership-2
    when: Oct. 18
    date: '1969-10-18'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: Zhou Enlai''s report: the day before, with Mao''s assent, he proposed a communique that Sino-Soviet boundary talks will be held; that night the Soviet chargé gave another text that widened the scope; China will tell him Oct. 18 afternoon that its draft follows the scope confirmed by Kosygin and it will publish its own. Mao: agreed. Printed Oct. 19 in *Renmin ribao*.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. See [[cal.1969-10-18.china-leadership]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
    tags: [polity:prc, polity:ussr, name:mao-zedong, name:zhou-enlai, name:kosygin-aleksei, vis:only:prc+ussr]
  - id: cal.1969-10-19.china-leadership
    when: Oct. 19
    date: '1969-10-19'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, soviet-union]
    c: Mao reads the telephone record of Lin Biao's emergency instruction of Oct. 18, circulated urgently by Zhou Enlai; tells Wang Dongxing to burn it, and burns the copy himself.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. Made public: 2013. See [[cal.1969-10-18.china-leadership]]. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Dongxing.'
    tags: [polity:prc, name:mao-zedong, name:lin-biao, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-20.soviet-union-leadership
    when: Oct. 20–21
    date: '1969-10-20'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Husák and the Czechoslovak party-state delegation. Brezhnev, the Politburo's members and candidates and the secretaries meet them at Vnukovo Oct. 20, 4 p.m.; dinner in the Granovitaya Palata, 6; negotiations in the Kremlin Oct. 21, 10 to 1; a reception at the Czechoslovak embassy, 4 to 6.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 366 (Oct. 20–21). Names: Brezhnev, Husák.'
    tags: [name:brezhnev-leonid, name:husak-gustav, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-10-20.china-leadership
    when: Oct. 20
    date: '1969-10-20'
    thread: china-leadership
    also: [soviet-union]
    c: The Sino-Soviet boundary talks open in Peking, Qiao Guanhua and V. V. Kuznetsov heading the delegations. The Soviet side refuses to discuss the interim measures agreed Sept. 11 and denies any "disputed areas" on the boundary; the two sides far apart.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 20, 1969. Made public: 2013. Names: Qiao Guanhua, Kuznetsov. Check: the communique of Oct. 19 announcing the talks (*Renmin ribao*, Oct. 19).'
    tags: [polity:prc, polity:ussr, name:qiao-guanhua, name:kuznetsov-vasily-v, vis:only:prc+ussr@B-C]
  - id: cal.1969-10-26.china-leadership
    when: Oct. 26
    date: '1969-10-26'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: reads the Chinese delegation''s speech for the fourth plenary meeting of the boundary talks. Zhou Enlai: the Soviet side showed stubbornness in the third session Oct. 23 and in the heads'' meeting Oct. 24, and a rebuttal is wanted. Mao: read; "keep attacking, persistently".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-27.soviet-union-leadership
    when: Oct. 27–28
    date: '1969-10-27'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev negotiates with the Czechoslovak delegation led by Husák in the Kremlin, 9 on; speaks at the Soviet–Czechoslovak friendship rally at the Palace of Congresses, 3 to 8; Oct. 28 he, Kosygin and Podgorny see the delegation off at Vnukovo, 10 a.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 367 (Oct. 27–28). Names: Brezhnev, Husák, Kosygin, Podgorny.'
    tags: [name:brezhnev-leonid, name:husak-gustav, name:kosygin-aleksei, name:podgorny-nikolai-v, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-10-31.china-leadership
    when: Oct. 31
    date: '1969-10-31'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads the records of the boundary talks of Oct. 27 and 29; and Zhou Enlai''s report on the Politburo''s hearing on Sichuan: since the Ninth Congress an "against restoration" movement there like those of Shandong, Guizhou and Hubei, aimed at the army, the workers'' representatives placed over the revolutionary committee, factionalism and armed fighting; the Center must take it up; call Sichuan''s Party, government and army chiefs to Peking, bring unity, then widen. Mao: agreed.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
