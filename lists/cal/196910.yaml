    thread: china-border-war
    c: Zhu De 朱德, with Zhang Yunyi 张云逸, Chen Qihan 陈奇涵 and others, lands by one plane at Guangzhou's Baiyun airport 广州白云机场. The chief men of the Guangzhou Military Region 广州军区 do not let them into the city; after a short rest at the airport they are taken straight to Conghua 从化.
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1970. Made public: 2016. See [[cal.1969-10-17.china-leadership]]. Names: Zhu De, Zhang Yunyi.'
    tags: [polity:prc, name:zhu-de, vis:only:prc, name:zhang-yunyi]
