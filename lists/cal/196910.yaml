    place: peking
    thread: china-foreign
    also: [soviet-union]
    c: A "frontal command" headed by Chief of Staff Huang Yongsheng, with Wu Faxian, Li Zuopeng and Qiu Huizuo, Lin Biao's vice chiefs of staff, moves into an underground shelter in Peking's western suburbs.
