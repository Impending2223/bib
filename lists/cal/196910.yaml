    c: Lin Biao 林彪, back in Peking from Zhangjiakou, charged by Mao Zedong 毛澤東, holds a Politburo meeting on the trend of Sino-Soviet relations and the means against a Soviet surprise attack.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 737; [[w.teiwes-tragedy-of-lin-biao]], 133 (on his inspection of Zhangjiakou in the fall Lin, asked by perplexed generals how to balance politics and training: "At present doing a good job of war preparations is the greatest politics"). Made public: 2016. To check: [[w.yunsheng-maojiawan-jishi]], 313–314 (cited by [[w.teiwes-tragedy-of-lin-biao]], 133 n.57). Names: Lin Biao, Mao Zedong. Check: the day (after the flight of Oct. 5).'
