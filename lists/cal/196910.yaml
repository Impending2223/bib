    c: 'Zhou Enlai, on a paper reporting serious embezzlement and theft at three accounting shops in Peking''s Dongcheng district, writes Xie Fuzhi and Wu De: "it only reports and offers no measure; reading it makes one anxious!" The paper says that since the cleaning of ranks 25 have confessed to embezzlement, 53 are suspected, 13.3 percent of the staff, and nearly 20,000 yuan has been confessed.'
