  - id: cal.1969-10-26.china-leadership-4
    when: Oct. 26
    date: '1969-10-26'
    thread: china-organization
    also: [china-army, india-and-china-cultural-revolution]
    c: 'The Center issues document (69) 71: Li Zaihan 李再含, power in hand after the seizure, has sunk into bourgeois factionalism, double-dealing, an "independent kingdom," against the Center and suppressing the masses; Lan Yinong 藍亦農, deputy commissar of the Kunming Military Region, made first commissar of the Guizhou Military District; Zhang Rongsen 張榮森, commander of the 43rd Army, deputy head of the Guizhou core group, leading all the troops'' support of the left.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 488. Made public: 2014. Names: Li Zaihan.'
    src:
      c: b17a5382
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 488: all'
