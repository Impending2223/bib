    when: Oct., early
    date: 1969-10
    at: before 1969-10-01
    thread: china-foreign
    c: Lin Biao 林彪, believing the Soviet delegation due on Oct. 20 may be cover for a full-scale attack, makes a secret inspection of the route it will take, telling no one but Mao 毛泽东.
    n: '[[w.teiwes-tragedy-of-lin-biao]], 112 ("immediately thereafter," after his order of Sept. 30). Made public: 1988 ([[w.yunsheng-maojiawan-jishi]]). To check: [[w.yunsheng-maojiawan-jishi]], 106, 308 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20a); [[w.nianyi-da-dongluande-niandai]], 362 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20b); [[w.ke-wenhua-dageming-zhongde-renmin]], 125–126 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20c); [[w.su-caiqing-wenhua-dageming-shishi-bianwu]], 79 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20d); [[w.wen-feng-shentanxia-de-lin-biao]], 245 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20e); [[w.macfarquhar-succession-to-mao-and]], 322 (cited by [[w.teiwes-tragedy-of-lin-biao]], 112 n.20f). See [[cal.1969-09-30.china-leadership-7]]. Names: Lin Biao, Mao Zedong. Check: whether this is Lin''s flight over Zhangjiakou of [[cal.1969-10-05.china-leadership]] or his inspection of bases in Shanxi and Hebei, [[cal.1969-10.china-leadership-4]].'
