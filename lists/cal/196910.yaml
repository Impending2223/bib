  - id: cal.1969-10-18.china-leadership-9
    when: Oct. 18
    date: '1969-10-18'
    thread: china-border-war
    c: 'Zhu De 朱德, of Lin Biao''s 林彪 "Order No. 1" 第一个号令, to his wife Kang Keqing 康克清: "The drinker''s mind is not on the wine." There is no sign of war now; a war does not start from nothing; before it come many signs; it is not children fighting; no such signs are to be seen now.'
    n: '[[w.zhu-de-nianpu-xinbian]], III, 1970. Made public: 2016. See [[cal.1969-10-18.china-leadership]]. Names: Zhu De, Lin Biao, Kang Keqing.'
