    date: '1969-10-24'
    place: kaifeng
    thread: china-leadership
    also: [china]
    c: Kaifeng. Liu Shaoqi's illness grows worse after his arrival; he is in critical condition.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Oct. 24, 1969). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, name:liu-shaoqi, vis:only:prc]
  - id: cal.1969-10-24.china-leadership-3
    when: Oct. 24
    date: '1969-10-24'
    place: nanchang
    thread: china-leadership
    c: Staff of the case group, with Jiangxi officials, pick for Deng Xiaoping's 邓小平 family the former residence of the principal of the Nanchang Army Infantry School of the Foochow Military Region 福州军区南昌陆军步兵学校, at Wangchenggang 望城岗 in Xinjian county 新建县 on the outskirts of Nanchang, and, nearby, the Xinjian County Tractor Repair Works 新建县拖拉机修配厂 as the place where Deng and his wife are to labour.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Oct. 24, 1969). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
    src:
      c: 315024ef
      rows:
        - 'w.deng-xiaoping-nianpu-1904 III, 1950: all'
    tags: [polity:prc, name:deng-xiaoping, vis:only:prc]
  - id: cal.1969-10-25.china-leadership
    when: Oct. 25
    date: '1969-10-25'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai adds to the draft Center notice on devolving the colleges, where it deals with their handing over: "be conscientious and responsible, protect school buildings, teaching equipment, scientific instruments, books and files, affiliated factories and all state property; fight resolutely those who destroy, embezzle or steal the schools'' public goods, and punish severely any such crimes found"; and "the leadership of the colleges under the National Defense Science and Technology Commission is fixed separately." On Oct. 26 the Center issues the notice: colleges of State Council departments in Peking stay under them, those elsewhere pass to the local province, municipality or region, those run with factories to the factories; all of the Ministry of Education''s go to the provinces, municipalities and regions where they are.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-25.china
    when: Oct. 25
    date: '1969-10-25'
    thread: china
    also: [vietnam-hanoi]
    c: 'The communique on the two premiers'' talks, Zhou and Phạm Văn Đồng: the U.S. war of aggression condemned; the one way to settle the Vietnam question is for the U.S. to stop it and for U.S. and vassal troops to leave the South unconditionally; China restates its support and aid to the end.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 224 (Oct. 25, 1969). See [[cal.1969-10-21.china-leadership]]. Names: Zhou Enlai, Phạm Văn Đồng.'
    src:
      c: df190cbd
      rows:
        - 'w.zhonghua-renmin-gongheguo-waijiao 224: all'
    tags: [polity:prc, polity:drv, name:zhou-enlai, name:pham-van-dong]
  - id: cal.1969-10-25.vietnam-hanoi
    when: Oct. 25
    date: '1969-10-25'
    place: plain-of-jars
    thread: vietnam-hanoi
    also: [laos]
    c: 'Laos. Vietnamese and Lao forces open Campaign 139, the counteroffensive for the Plain of Jars and Xieng Khouang, Vang Pao''s Kou Kiet having taken the plain by September: its first phase, to build up the position, through the rains and the bombing. On the Vietnamese side the 312th and 316th Divisions, two battalions of the 866th Regiment, the 16th Artillery and the 45th Engineer Regiments, a tank company and the 20th, 25A and 25B Sapper Battalions; on the Lao, ten infantry battalions and others. Vũ Lập commander, Huỳnh Đắc Hương political commissar. The campaign runs to Apr. 25, 1970: 6,668 of the enemy put out of action and the plain retaken, by its count.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 241–46. Names: Vang Pao, Vũ Lập, Huỳnh Đắc Hương.'
    tags: [polity:drv, polity:laos, polity:pathet-lao, place:plain-of-jars, place:xieng-khouang, name:vang-pao, name:huynh-dac-huong, name:vu-lap]
  - id: cal.1969-10-25.china-leadership-2
    when: Oct. 25
    date: '1969-10-25'
    place: peking
    thread: china-leadership
    c: 'Peng Dehuai 彭德怀 to the sentry 哨兵: class struggle alone will not do, there must be scientific experiment too; this thing (his watch), if not wound to run, will rust. He reads the paper aloud and hums.'
    n: '[[w.peng-dehuai-nianpu]], 826. Made public: 1998. Names: Peng Dehuai.'
    tags: [polity:prc, vis:only:prc, name:peng-dehuai]
  - id: cal.1969-10-26.china-leadership
    when: Oct. 26
    date: '1969-10-26'
    thread: china-border-war
    also: [soviet-union, china-mao-foreign]
    c: 'Mao, Peking: reads the Chinese delegation''s speech for the fourth plenary meeting of the boundary talks. Zhou Enlai: the Soviet side showed stubbornness in the third session Oct. 23 and in the heads'' meeting Oct. 24, and a rebuttal is wanted. Mao: read; "keep attacking, persistently".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-26.china-leadership-2
