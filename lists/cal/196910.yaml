    c: Lin Biao flies to Suzhou, as part of the leaders' evacuation from Peking.{1}
    n: '[[w.macfarquhar-maos-last-revolution]], 318; [[w.mao-zedong-zhuan]], VI, ch. 78 (two days after Mao''s Oct. 15 arrival, that is Oct. 17, Lin Biao is ''evacuated'' on the pretext of ''emergency war readiness'' to Suzhou, Jiangsu, the leaders in Peking and many cadres being scattered out of the capital by the Center''s notice; the book gives Oct. 17, not Oct. 16). [[w.yang-jisheng-tiandi-fanfu]], II, 737–738 (Lin Biao to Suzhou on the 16th, "evacuated" there two days by Oct. 17); [[w.teiwes-tragedy-of-lin-biao]], 113–114 (Lin leaves for Suzhou in the evacuation of the senior leaders). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 78). To check: [[w.yunsheng-maojiawan-jishi]], 316–319 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23a); [[w.wen-feng-shentanxia-de-lin-biao]], 248 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23c). Names: Lin Biao. Check: the book names no source; its note (318 n.48) is a remark on the sources'' reticence.'
