    c: Chen Yi 陈毅 at the display by China's best athletes given by the Peking Revolutionary Committee 北京市革命委员会 in the newly completed Capital Gymnasium 首都体育馆, in Peking's 北京 western suburbs.{1}
    n: '[[w.chen-yi-nianpu]], 1213–1214; [[w.liu-jixian-ye-jianying-nianpu]], II, 985 (Oct. 17, 1969; afternoon; Ye Jianying 叶剑英 at the athletes'' display in the Capital Gymnasium 首都体育馆, arranged by the Center''s General Office); [[w.chen-yun-nianpu-xiuding]], III, 170 (afternoon: Chen Yun, by the arrangement of the Center''s General Office, watches the athletes'' display at the Capital Gymnasium); [[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969, afternoon; Zhu De 朱德, as the Center''s General Office 中共中央办公厅 arranges, at the sports display at the Capital Gymnasium 首都体育馆). The words: 晚上 (1213–1214). Names: Chen Yi.'
