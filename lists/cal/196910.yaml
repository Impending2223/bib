  - id: cal.1969-10-18.china-leadership-2
    when: Oct. 18
    date: '1969-10-18'
    thread: china-border-war
    also: [soviet-union, china-mao-foreign]
    c: 'Mao, Peking: Zhou Enlai''s report: the day before, with Mao''s assent, he proposed a communique that Sino-Soviet boundary talks will be held; that night the Soviet chargé gave another text that widened the scope; China will tell him Oct. 18 afternoon that its draft follows the scope confirmed by Kosygin and it will publish its own.{1} Mao: agreed.{2}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 18, 1969; the communique approved); [[w.jianguo-yilai-mao-zedong]], XIX, 475 (Oct. 18, 1969; Mao''s "Agreed" on Zhou Enlai''s request of Oct. 18; the editors name the Soviet chargé d''affaires Tulizaweijin 吐里扎维金; the communiqué printed Oct. 19 gives the talks at the level of deputy foreign ministers, in Peking from Oct. 20; the book gives no place). To check: Zhou Enlai, request of Oct. 18, 1969 on publishing the communiqué on the Sino-Soviet boundary talks (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 475 n.1a). See [[cal.1969-10-18.china-leadership]]. The communique printed: [[cal.1969-10-19.china-leadership-4]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
    src:
      c: 41a59a0a
      rows:
