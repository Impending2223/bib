  - id: cal.1969-10-17.china-leadership-3
    when: Oct. 17
    date: '1969-10-17'
    thread: china-leadership
    c: 'Ye Qun 葉群, before Lin Biao''s 林彪 six points go to Huang Yongsheng 黃永勝, has a secretary add a line: the six points have been sent through Wang Dongxing 汪東興 to Mao Zedong 毛澤東; should he have other instructions, his are to prevail.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 737; [[w.teiwes-tragedy-of-lin-biao]], 114 (Zhang Yunsheng suggests to Ye Qun that Mao''s confirmation be sought; Ye, and then Lin, agree, musing that in the revolutionary war Lin often acted first on tactics and reported to Mao later). Made public: 2008. To check: *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008), 767 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 737 n.63); [[w.yunsheng-maojiawan-jishi]], 316–319 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23a); [[w.wen-feng-shentanxia-de-lin-biao]], 248 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23c). Names: Ye Qun, Lin Biao, Huang Yongsheng, Mao Zedong. Check: the day; the Mao chronology dates Lin Biao''s instruction Oct. 18, the Zhou chronology Oct. 17–18.'
