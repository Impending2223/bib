  - id: cal.1969-10-18.china-leadership
    when: Oct. 18
    date: '1969-10-18'
    time: 1969-10-18T09:00Z
    place: suzhou
    thread: china-foreign
    also: [soviet-union]
    c: 'Lin Biao, convalescing at Suzhou, dictates without Mao''s approval an emergency order to raise war readiness and guard against surprise attack: a command staff to take wartime posts at once.{1} His secretary telephones it to Huang Yongsheng, chief of staff, in Peking;{2} that night Huang and others issue it to the whole army as "Vice-Chairman Lin''s instruction (the first order)" and the army goes on alert.{3}'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17–18, 1969; Lin''s instruction and its issue as order no. 1); [[w.macfarquhar-maos-last-revolution]], 318 (Lin Biao''s six-point emergency directive, "On Strengthening Defenses and Guarding against an Enemy Surprise Attack": the forces on red alert, weapons production, anti-tank above all, speeded, commanders to their combat posts, a close watch on the Sino-Soviet border); [[w.macfarquhar-maos-last-revolution]], 318 (the evening of Oct. 18 Huang Yongsheng issues it to the eleven military regions, the navy, the air force and the Peking Garrison as "Vice Chairman Lin''s First Verbal Order"; by one informant''s recollection it was received by telephone in a frontier region at 9:44 p.m.); [[w.macfarquhar-maos-last-revolution]], 317 (Mao''s fear of a Soviet surprise attack at the start of the border talks spurs Lin Biao to emergency measures, by authoritative Chinese histories); [[w.mao-zedong-zhuan]], VI, ch. 78 n.21 (Oct. 18, a Saturday, Lin Biao, just arrived at Suzhou, sends to Huang Yongsheng, chief of the General Staff and head of the Military Commission''s Office Group in Peking, an urgent instruction on strengthening war readiness and guarding against surprise attack: at once organize a lean command group and take wartime command posts, leaders on duty at every level; issued by the Office Group as ''Vice-Chairman Lin''s instruction (the first order)'', it goes by telephone that night to the fighting forces and the whole army at once enters a state of emergency; the book says Lin acted without Mao''s approval, n.21). [[w.yang-jisheng-tiandi-fanfu]], II, 737–738 (Lin Biao, two days at Suzhou, to Huang Yongsheng on Oct. 17; Huang has the deputy chief of staff Yan Zhongchuan 閻仲川 note it for relay to the troops); [[w.yang-jisheng-tiandi-fanfu]], II, 738 (under the "first order" 95 divisions, some 940,000 men, 4,100 aircraft, many tanks and guns and 600 ships dispersed and hidden); [[w.khoo-collateral-damage]], 59 (at 1700 hours, from Suzhou, Lin''s "Urgent Directive regarding Strengthening Combat Readiness to Prevent an Enemy''s Surprise Attack," six points, sent to Huang Yongsheng and passed to Yan Zhongchuan at the advanced command post; the Second Artillery on full alert); [[w.teiwes-tragedy-of-lin-biao]], 114 (after arriving Lin gives oral instructions to disperse units and camouflage vital equipment; Zhang Yunsheng relays them by telephone to Huang Yongsheng, who issues them the next day as "Number One War Order of Vice Commander Lin," one of four orders on war preparations that day; Lin rather casual about it, by Zhang); [[w.jian-zhou-enlai]], 596–597 (at Suzhou on Oct. 18 Lin, without telling Mao, dictates an "urgent instruction" on guarding against a sudden attack; his secretary telephones it to Huang, who has it relayed to the whole army; Yan Zhongchuan, the vice chief of staff on duty that evening, titles it "Vice Chairman Lin''s Order Number One," "for the sake of convenience"); [[w.jian-zhou-enlai]], 624 (the same evening Huang relays the directive, "Vice Chairman Lin''s Order Number One," to the commands nationwide, sending them into war readiness); [[w.friedman-shadow-cold-war]], 177 (by October most of the leadership evacuated from Peking, the whole PLA on alert); [[w.dikotter-cultural-revolution]], 209 n.8 (Lin Biao''s "Number One Order" from a bunker in Suzhou puts all units on high alert; a million soldiers, 4,000 planes and 600 ships move to their positions); [[w.liu-jixian-ye-jianying-nianpu]], II, 985 (Lin Biao''s "Emergency directive on strengthening war readiness and preventing surprise attack by the enemy" 《关于加强战备，防止敌人突然袭击的紧急指示》, by this book of Oct. 17, 1969; on the 18th Huang Yongsheng 黄永胜 and others issue it as "Vice-Chairman Lin''s Order No. 1"; the whole army on emergency alert; about then, by Mao''s view and the Center''s plan, some Party and state leaders in Peking, many organs and cadres'' families "evacuated for war readiness"); [[w.chen-yun-nianpu-xiuding]], III, 170 (Oct. 18: Lin Biao, without Mao''s approval, dictates an instruction putting the whole army on emergency war readiness; that evening Huang Yongsheng and others issue it formally to the whole army as "Vice-Chairman Lin''s instruction (the first order)"); [[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 17, 1969; Lin Biao 林彪 issues an "urgent instruction" putting the whole army on emergency war readiness; on the 18th Huang Yongsheng 黄永胜, chief of the General Staff 总参谋长, and others send it down formally as "Vice-Chairman Lin''s Order No. 1" 林副主席第一个号令). Made public: 1989 ([[w.ke-wenhua-dageming-zhongde-renmin]], 124, cited by [[w.macfarquhar-maos-last-revolution]], 318 n.50a). Check: whether [[w.ke-wenhua-dageming-zhongde-renmin]] (1989) was printed for internal circulation; if so, the year is 1997 ([[w.dongxing-mao-zedong-yu-lin]], 15, cited by [[w.macfarquhar-maos-last-revolution]], 318 n.49b). Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17–18, 1969), dates Lin Biao''s "emergency instruction on strengthening war preparation and guarding against a surprise attack" Oct. 17 and its issue by Huang Yongsheng and others as "Vice-Chairman Lin''s order no. 1" Oct. 18; it adds that, about this time, on Mao''s view and the Center''s plan, some Party and state leaders in Peking and many organs'' cadres'' families were "evacuated" to places outside. To check: [[w.history-of-the-chinese]], 348 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.49a); [[w.dongxing-mao-zedong-yu-lin]], 15 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.49b); Zheng Qian, "60 niandai mo Zhongguo beizhan miwen", in [[w.gongheguo-zhongda-shijian-he]], 641 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.49c); [[w.xianzhi-mao-zedong-zhuan-1949]], II, 1564 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.51); [[w.ke-wenhua-dageming-zhongde-renmin]], 124 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.50a); [[w.yunsheng-maojiawan-jishi]], 319 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.50b); the recollection of informant P (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.50c); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 325 (cited by [[w.macfarquhar-maos-last-revolution]], 317 n.43b); *Di yi ge haoling* 《第一个号令》 (Vice-Chairman Lin''s instruction, the first order 林副主席指示（第一个号令）), Oct. 18, 1969 (cited by [[w.mao-zedong-zhuan]], VI, ch. 78 n.21); *Wu Faxian huiyilu* 《吳法憲回憶錄》 (Beixing chubanshe 北星出版社, Hong Kong, 2008), 767 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 737 n.63); [[w.lewis-imagined-enemies]], 62 (cited by [[w.khoo-collateral-damage]], 59 n.116); [[w.li-genqing-before-and-after-lin-biaos-urgent]], 47 (cited by [[w.jian-zhou-enlai]], 596 n.19a); [[w.zhang-yunsheng-wenge-qijian-wo-gei-lin-biao]], 568 (cited by [[w.jian-zhou-enlai]], 596 n.19b); [[w.zhang-songjia-yan-zhongchuan-and-order-number]], 50 (cited by [[w.jian-zhou-enlai]], 597 n.20); [[w.jisen-cultural-revolution-in-the]], 94–95 (cited by [[w.friedman-shadow-cold-war]], 177 n.139). Names: Lin Biao, Huang Yongsheng, Mao Zedong.'
