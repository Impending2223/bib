  - id: cal.1969-10-19.china-leadership
    when: Oct. 19
    date: '1969-10-19'
    place: wuhan
    thread: china-mao-foreign
    also: [india-and-china-cultural-revolution, soviet-union]
    c: Mao reads the telephone record of Lin Biao's emergency instruction of Oct. 18, circulated urgently by Zhou Enlai;{1} tells Wang Dongxing to burn it, and burns the copy himself.{2}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. [[w.macfarquhar-maos-last-revolution]], 318 (by Wang Dongxing''s account: Lin Biao sends the order through Zhou for approval; Zhou forwards it to Wang without comment; Wang takes it to Mao Oct. 19; Mao cries "Burn it!" and burns it; Wang saves the covering letter); [[w.mao-zedong-zhuan]], VI, ch. 78 n.22 (the day after the order Lin Biao reports it to Mao by the telephone record, circulated urgently, the first time since the founding of the People''s Republic that this has happened; at Wuchang Wang Dongxing 汪东兴 takes the paper to Mao, who, displeased, says ''burn it'' and lights it himself with a match; Wang asks him to keep the envelope, which bears the circulation number, and he does; that evening Zhou Enlai telephones Wang to ask whether Mao has seen the urgent telephone notice, and is told Mao burned it, n.22; the book does not say Zhou circulated it). [[w.yang-jisheng-tiandi-fanfu]], II, 738 (at Wuchang: "burn it!"; Mao strikes the match himself; Wang Dongxing keeps the envelope); [[w.teiwes-tragedy-of-lin-biao]], 114 (Mao''s "Burn it," which Ye Qun claimed was "Very good, burn it"; senior historians read it as nothing much, carry on); [[w.jian-zhou-enlai]], 597 (Zhou, receiving the transcript after it has gone out, reports it to Mao; Wang Dongxing hands it to Mao, who cries "Set it on fire!" and burns it himself, Wang saving the envelope; that evening Zhou telephones Wang and is told "He burned it to ashes"); [[w.dikotter-cultural-revolution]], 242–243 n.3 (the order soon rescinded, someone in the chain of command having jumped the gun without clearing it with Mao, who is furious at being sidestepped). Made public: 1997 ([[w.dongxing-mao-zedong-yu-lin]], 14–15, cited by [[w.macfarquhar-maos-last-revolution]], 318 n.53). Check: the note (319 n.57) reports a hint in one source that Mao may not have been angry at all. To check: [[w.wenqian-wannian-zhou-enlai]], 280 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.52); [[w.dongxing-mao-zedong-yu-lin]], 14–15 (cited by [[w.macfarquhar-maos-last-revolution]], 318 n.53); [[w.ke-wenhua-dageming-zhongde-renmin]], 124 (cited by [[w.macfarquhar-maos-last-revolution]], 319 n.57); [[w.yunsheng-maojiawan-jishi]], 316–319 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23a); [[w.wen-feng-shentanxia-de-lin-biao]], 248 (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23b); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 114 n.23c); [[w.wang-dongxing-mao-zedong-yu-lin-biao-2010]], 14–15 (cited by [[w.jian-zhou-enlai]], 597 n.21); [[w.wang-dongxing-mao-zedong-yu-lin-biao-2010]], 15 (cited by [[w.jian-zhou-enlai]], 597 n.22); [[w.zhisui-private-life-of-chairman]], 518 (cited by [[w.dikotter-cultural-revolution]], 243 n.3). See [[cal.1969-10-18.china-leadership]]. Names: Mao Zedong, Lin Biao, Zhou Enlai, Wang Dongxing. Check: the book''s note on the burning (318 n.52) is [[w.wenqian-wannian-zhou-enlai]], 280 (2003); Wang Dongxing''s book is cited for his reading of the order (318 n.53) and for its text (318 n.49b); if it does not print the burning, the year is 2003.'
