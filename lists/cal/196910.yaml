    c: 'Lin Biao, convalescing at Suzhou, dictates without Mao''s approval an emergency order to raise war readiness and guard against surprise attack: a command staff to take wartime posts at once. His secretary telephones it to Huang Yongsheng, chief of staff, in Peking; that night Huang and others issue it to the whole army as "Vice-Chairman Lin''s instruction (the first order)" and the army goes on alert.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17–18, 1969; Lin''s instruction and its issue as order no. 1). Made public: 2013. Check: [[w.zhou-enlai-nianpu-1949-2020]], III, 322 (Oct. 17–18, 1969), dates Lin Biao''s "emergency instruction on strengthening war preparation and guarding against a surprise attack" Oct. 17 and its issue by Huang Yongsheng and others as "Vice-Chairman Lin''s order no. 1" Oct. 18; it adds that, about this time, on Mao''s view and the Center''s plan, some Party and state leaders in Peking and many organs'' cadres'' families were "evacuated" to places outside. Names: Lin Biao, Huang Yongsheng, Mao Zedong.'
    src:
      c: 1f4256f0
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 18, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 322: A, C'
    tags: [polity:prc, name:lin-biao, name:huang-yongsheng, name:mao-zedong, vis:only:prc]
