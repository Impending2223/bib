  - id: cal.1969-10-27.soviet-union-leadership
    when: Oct. 27–28
    date: '1969-10-27'
    time: 1969-10-27T06:00Z
    place: moscow
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev negotiates with the Czechoslovak delegation led by Husák in the Kremlin, 9 on; speaks at the Soviet–Czechoslovak friendship rally at the Palace of Congresses, 3 to 8; Oct. 28 he, Kosygin and Podgorny see the delegation off at Vnukovo, 10 a.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 367 (Oct. 27–28). Names: Brezhnev, Husák, Kosygin, Podgorny.'
    tags: [name:brezhnev-leonid, name:husak-gustav, name:kosygin-aleksei, name:podgorny-nikolai-v, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-10-28.china-leadership
    when: Oct. 28
    date: '1969-10-28'
    thread: china-economy
    also: [india-and-china-cultural-revolution, economy]
    c: 'The State Council forwards the report of the military control commission of the First Ministry of Machine Building on speeding up the Second Automobile Plant: it is a key Third Front project, all sides are to cooperate closely and assure that the plant produces military cross-country vehicles in batches by 1972 as scheduled. The nianpu notes that Zhou fixed its site at Shiyan, Hubei; construction began in 1969, and in 1975 the first model, a 2.5-ton cross-country vehicle, went into production.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-28.china-leadership-2
    when: Oct. 28
    date: '1969-10-28'
    place: nanchang
    thread: china-economy
    c: 'Nanchang 南昌, the Binjiang Guesthouse 滨江招待所. Chen Yun 陈云 receives Cheng Shiqing 程世清, chairman of the Jiangxi Revolutionary Committee 江西省革命委员会, come to see him. Cheng faults Chen Yun''s past running of the economy, badly done and too slow: Jiangxi means to make sixty or seventy thousand motor vehicles a year and to deliver ten billion jin of grain a year to the state.'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 171–172. The words: 下午 (171–172). Made public: 2015. Names: Chen Yun, Cheng Shiqing.'
    gloss:
      title: Estimates
      text:
        - 'Chen Yun''s own figures, given at a Politburo meeting in 1979 as the nianpu reports them: the country then made sixty or seventy thousand motor vehicles a year; Jiangxi had long delivered only 1.5 billion jin of grain a year to the state; the country imported 10.7 billion jin of grain a year; Jiangxi''s whole crop was 19.7 billion jin of paddy, 13.3 billion of rice; had it covered the nation''s imports, as Cheng Shiqing 程世清 wanted, its people would have been left 9 billion jin of paddy ([[w.chen-yun-nianpu-xiuding]], III, 171–172).'
    tags: [polity:prc, name:chen-yun, vis:only:prc, name:cheng-shiqing]
    time_range:
      - 1969-10-28T04:00Z
      - 1969-10-28T10:00Z
    time_band: afternoon
    time_zone: Asia/Shanghai
  - id: cal.1969-10-29.china-leadership
    when: Oct. 29
    date: '1969-10-29'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai attends the Politburo meeting and hears the report on Sichuan's problem.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324–325 (Oct. 29, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-29.vietnam-hanoi
    when: Oct. 29
    date: '1969-10-29'
    place: ka-te
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'Quảng Đức. At dawn the Central Highlands Front''s artillery opens the Bu Prăng–Đức Lập campaign on Ka Te, Hill 936, the 66th Regiment closing round it. Its object the defense line of more than 80 kilometers along Route 14 by the Cambodian border: 11 battalions, three of the American 4th Division and eight of the Saigon 23d Division''s 45th and 53d Regiments. The Front''s force the 66th and 28th Infantry Regiments, the 20th and 37th Sapper Battalions, the 394th Infantry Battalion, the 40th Artillery Regiment and the forces of Region 10 and Quảng Đức. Ka Te taken Nov. 2, Bu Prăng Nov. 30; the campaign ends Dec. 5.'
    n: '[[w.lich-su-khang-chien-chong-my]], VI, 149–52. The history adds (VI, 152 and n. 1): Task Forces 220 and 53 and a mixed infantry and ranger task force put out of action, 103 aircraft (mostly helicopters), 87 vehicles (24 armored), 29 guns and mortars and 35 depots destroyed or damaged, by its count. To check: Viện Lịch sử quân sự Việt Nam, *Tóm tắt các chiến dịch trong kháng chiến chống Mỹ, cứu nước (1954–1975)* (Quân đội nhân dân, 2001), 256 (cited by [[w.lich-su-khang-chien-chong-my]], VI, 152 n.).'
    tags: [polity:drv, province:quang-duc]
    time_range:
      - 1969-10-28T21:00Z
      - 1969-10-29T00:00Z
    time_band: early morning
    time_zone: Asia/Ho_Chi_Minh
    range_basis: record
  - id: cal.1969-10-29.china-leadership-2
    when: Oct. 29
    date: '1969-10-29'
    place: peking
    thread: china-class-ranks
    c: 'Peking. Xie Fuzhi 謝富治, at the Ministries of Education and Culture and the Academy''s department: the "May 16" counter-revolutionary clique, aimed at Mao, Lin Biao, their headquarters and the army, and at the revolutionary committees, is a most vicious enemy; "go at it boldly, rouse the masses," cleanse the class ranks thoroughly.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 562. Made public: 2016. Names: Xie Fuzhi, Lin Biao, Mao Zedong.'
    src:
      c: a905dbf8
      rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 562: all'
    tags: [polity:prc, vis:only:prc, name:xie-fuzhi, name:lin-biao, name:mao-zedong]
  - id: cal.1969-10-30.vietnam-hanoi
    when: Oct. 30
    date: '1969-10-30'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'COSVN''s Standing Committee, resolution no. 14-NQNT, on pressing guerrilla war in the general offensive and uprising: its strategic place, its present state and urgent tasks, the forms of its organization and action.'
    n: '*Nghị quyết của Thường vụ Trung ương Cục số 14-NQNT, ngày 30 tháng 10 năm 1969, Về việc đẩy mạnh chiến tranh du kích trong tổng công kích, tổng khởi nghĩa* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-10-30.china-leadership
    when: Oct. 30
    date: '1969-10-30'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Mao and Lin Biao on the Politburo meeting: "at present the Center cannot but take up the Sichuan problem"; since the Ninth Congress Sichuan has raised an "against restoration" movement of a nature like Shandong''s, Guizhou''s and Hubei''s; its aim too is at the army and the Workers'' Congress too wants to rise above the revolutionary committee, but Sichuan has Sichuan''s features, all shown in factionalism and armed fights. It is now needful first to call Sichuan''s responsible Party, government and army men "to Peking to confer", to reach unity on the principle of Mao Zedong Thought, and then widen the conference. Mao approves on Oct. 31.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325 (Oct. 30, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-10-30.china-leadership-2
    when: Oct. 30
    date: '1969-10-30'
    place: shijiazhuang
    thread: china-political-legal
    c: Shijiazhuang 石家莊 prefecture. By Oct. 30, 1969, 104,643 "traitors," "spies," "capitalist-roaders," active counterrevolutionaries and persons with "grave political-historical problems" dug out, 24,252 of them put under dictatorship as enemies.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 602–603. To check: 中共石家莊市委黨史研究室《石家莊文化大革命大事記(1966年5月-1978年12月)》,1997年3月,轉引自宋永毅等《中國文化大革命文庫》,2006年,第2版 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 603 n.38).'
    src:
      c: 1b38c1a2
      rows:
        - 'w.yang-jisheng-tiandi-fanfu II, 602-603: all'
        - 'via w.yang-jisheng-tiandi-fanfu II, 603 n.38: all'
    tags: [polity:prc]
  - id: cal.1969-10-31.china-leadership
    when: Oct. 31
    date: '1969-10-31'
    thread: china-border-war
    also: [india-and-china-cultural-revolution, china-mao-foreign]
    c: 'Mao, Peking: reads the records of the boundary talks of Oct. 27 and 29; and Zhou Enlai''s report on the Politburo''s hearing on Sichuan: since the Ninth Congress an "against restoration" movement there like those of Shandong, Guizhou and Hubei, aimed at the army, the workers'' representatives placed over the revolutionary committee, factionalism and armed fighting; the Center must take it up; call Sichuan''s Party, government and army chiefs to Peking, bring unity, then widen. Mao: agreed.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10.china-leadership
    when: Oct., before the 20th
    date: 1969-10
    at: before 1969-10-20
    thread: china-zhou
    also: [india-and-china-cultural-revolution, china-army]
    c: Zhou Enlai tells Wang Liangen to pass to the heads of the Guangzhou Military Region and the Guangdong revolutionary committee that Dong Biwu, Zhu De, Li Fuchun, Zhang Yunyi and Zhang Dingcheng, about to go to Guangzhou, are to be settled properly, with their living and medical care looked after; he then calls the responsible people elsewhere to look after Liu Bocheng, Ye Jianying, Deng Zihui, Chen Qihan, Xu Haidong and Zhang Wentian, settled in Guangdong, Hubei and Hunan.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 1969); [[w.liu-jixian-ye-jianying-nianpu]], II, 986 (before Ye Jianying 叶剑英 leaves Peking, Oct. 20, 1969, Zhou telephones the Hunan provincial committee 湖南省委 to look after his life well). Made public: 2020. Names: Zhou Enlai, Dong Biwu, Zhu De, Li Fuchun, Liu Bocheng, Ye Jianying, Zhang Yunyi, Zhang Dingcheng, Deng Zihui, Xu Haidong, Zhang Wentian.'
    tags: [polity:prc, name:zhou-enlai, name:dong-biwu, name:zhu-de, name:li-fuchun, name:liu-bocheng, name:ye-jianying, vis:only:prc, name:deng-zihui, name:xu-haidong, name:zhang-dingcheng, name:zhang-wentian, name:zhang-yunyi]
  - id: cal.1969-10-31.china-leadership-2
    when: Oct. 31
    date: '1969-10-31'
    thread: china-zhou
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai, on a paper reporting serious embezzlement and theft at three accounting shops in Peking''s Dongcheng district, writes Xie Fuzhi and Wu De: "it only reports and offers no measure; reading it makes one anxious!" The paper says that since the cleaning of ranks 25 have confessed to embezzlement, 53 are suspected, 13.3 percent of the staff, and nearly 20,000 yuan has been confessed.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325 (Oct. 31, 1969). Made public: 2020. Names: Zhou Enlai, Xie Fuzhi, Wu De.'
    tags: [polity:prc, name:zhou-enlai, name:xie-fuzhi, vis:only:prc, name:wu-de]
