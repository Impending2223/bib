    thread: china-border-war
    also: [china-zhou-foreign]
    c: Zhou Enlai instructs Xinhua that the reactions of all countries to the Sino-Soviet boundary talks are to reach the central leaders promptly; many reactions are to be gathered, fast, sent several times a day, with analysis and synthesis, and special collections may be issued.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 323 (Oct. 20, 1969). Made public: 2020. Names: Zhou Enlai.'
