  - id: cal.1969-10-01.china-leadership-2
    when: Oct. 1
    date: '1969-10-01'
    thread: china-zhou
    also: [china-propaganda, china-bomb]
    c: Zhou Enlai calls heads of the State Science and Technology Commission, the Academy of Sciences, the Ministry of Posts and Telecommunications, Xinhua and the Central Broadcasting Bureau on the radio time signal. When someone mentions that the stations play "The East Is Red" and a Mao quotation before the signal, he says it is imposing on others, on the world's people and on Mao himself, putting China on the defensive; to impose on people is suicide and harms Mao Zedong Thought. As the standard clock in use is not advanced enough, he calls for resolve to make an advanced one and press research on the ammonia atomic clock and better atomic clocks, to throw away the foreign crutches and catch up with the world's best.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Oct. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
