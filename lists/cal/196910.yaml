    place: peking
    thread: china-zhou-foreign
    also: [soviet-union, china-foreign]
    c: Zhou Enlai drives to the advance command post under the Baiwang Shan, in Peking's Western Hills, and takes charge of the crisis.
    n: '[[w.khoo-collateral-damage]], 59–60. Made public: 2006 ([[w.lewis-imagined-enemies]], 69). To check: [[w.lewis-imagined-enemies]], 69 (cited by [[w.khoo-collateral-damage]], 60 n.123). Names: Zhou Enlai.'
    tags: [polity:prc, vis:only:prc, name:zhou-enlai]
  - id: cal.1969-10-20.china-leadership-5
    when: Oct. 20
    date: '1969-10-20'
    place: shijiazhuang
    thread: china-leadership
    c: Chen Yi 陈毅, with his wife Zhang Qian 张茜, reaches Shijiazhuang 石家庄 by train, to work at the Ministry of Railways' Shijiazhuang Rolling Stock Works 铁道部石家庄车辆厂, half the day at labor and half at study.
    n: '[[w.chen-yi-nianpu]], 1214. The nianpu''s note (1214 n.1) dates the move from the Center''s deadline and from Zhang Qian''s letter of Dec. 22, 1970 (a year and a day at Shijiazhuang, back in Peking on Oct. 21, 1970), and calls an unnamed article''s departure of Oct. 21, put off a day for Chen Yi''s books with Zhou Enlai''s approval, probably wrong. Made public: 1995. To check: Zhang Qian 张茜, letter to 少艾 and 重坤 《张茜致少艾、重坤信》, Dec. 22, 1970 (cited by [[w.chen-yi-nianpu]], 1214 n.1). Names: Chen Yi, Zhang Qian.'
    tags: [polity:prc, name:chen-yi, vis:only:prc, name:zhang-qian]
