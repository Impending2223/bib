  - id: cal.1969-10.china-leadership-14
    when: Oct., after the 17th
    date: 1969-10
    at: after 1969-10-17
    thread: china-center
    c: 'Xu Xiangqian 徐向前 asks the Center 中央 to change his and Chen Yi''s 陈毅 places of dispersal: Shijiazhuang 石家庄 has better medical care than Kaifeng 开封 and is nearer Peking 北京, and he is in better health than Chen Yi. The Center soon agrees.'
    n: '[[w.chen-yi-nianpu]], 1214. Made public: 1995. Names: Xu Xiangqian, Chen Yi.'
    tags: [polity:prc, name:chen-yi, name:xu-xiangqian, ok:fields-place, vis:only:prc]
  - id: cal.1969-10.china-leadership-15
    when: Oct.–Nov.
    date: 1969-10
    at: after 1969-10-20
    place: shijiazhuang
    thread: china-economy
    c: 'Shijiazhuang 石家庄, the rolling stock works. Chen Yi 陈毅, after seeing the works'' history exhibition, calls 刘一身, one of its drafters, a "scholar" 秀才; to Liu''s demurral, that he went to work after primary school: a primary-school graduate is a small intellectual, and the Communist Party was founded by intellectuals joining Marxism-Leninism to the workers'' movement. Later, hearing his staff jibe at "stinking intellectuals" 臭知识分子: socialism cannot be built without intellectuals, and China has too few of them, not too many.'
    n: '[[w.chen-yi-nianpu]], 1214. Made public: 1995. Names: Chen Yi.'
    tags: [polity:prc, name:chen-yi, vis:only:prc]
  - id: cal.1969-10.china-leadership-17
    when: Oct., after the 20th
    date: 1969-10
    at: after 1969-10-20
    thread: china-army
    c: 'Lin Biao''s 林彪 people pass word down the army: Ye Jianying 叶剑英 is the "February adverse current''s" 二月逆流 chief, an "old rightist," to be kept at a distance. Some heads of the Guangzhou Military Region 广州军区 and the Hunan Military District 湖南省军区 treat him coldly, and he meets many difficulties in daily life. Li Yuan 黎原 and Li Zhenjun 李振军, heads of an army stationed in Hunan 湖南, its security section''s Zhao Fuhe 赵福和, the guard platoon leader Hu Jiahu 胡家虎, and Zhao Yunhong 赵云宏, head of the First Military Medical University 第一军医大学 then at Changsha 长沙, look after him as they can, through his difficulties of daily life and illness.'
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 986. Made public: 2007. Names: Lin Biao, Ye Jianying, Li Yuan.'
    tags: [polity:prc, name:lin-biao, name:ye-jianying, vis:only:prc, ok:fields-place, name:li-yuan]
  - id: cal.1969-10.china-leadership-18
    when: Oct., late, to Dec., mid-
    date: 1969-10
    at: before 1969-10-21
    place: changsha
    thread: china-economy
    also: [china-propaganda]
    c: 'Ye Jianying 叶剑英 investigates at the Changsha 长沙 Shuguang electron tube plant 曙光电子管厂 and some basic units, on production and the workers'' lives, and on Hunan''s 湖南 broadcasting, noting in his work book: in 1960 the province''s 89 counties and cities had 6 city people''s radio stations, 765 commune broadcasting stations, over 4,000 km of broadcasting lines, 180,000 loudspeakers; in 1961 five of the six city stations and every commune station cut, 100,000 of the 180,000 speakers smashed, the 4,000 km of lines wrecked; no better by 1969, nearly 80 percent of the communes and production teams without a broadcasting station or wired broadcasting.'
    n: '[[w.liu-jixian-ye-jianying-nianpu]], II, 986. Made public: 2007. Names: Ye Jianying.'
    tags: [polity:prc, name:ye-jianying, vis:only:prc]
  - id: cal.1969-10.china-leadership-16
    when: Oct., before the 18th
    date: 1969-10
    at: before 1969-10-18
    thread: china-mao
    c: 'Mao Zedong 毛泽东 to Wang Dongxing 汪东兴, head of the Center''s General Office 中共中央办公厅: "Put Chen Yun 陈云, Wang Zhen 王震 and the others along the lines of communication, so they can come and go easily. If war comes, when I need them I cannot do without these people. These people can still be used; I still want them."'
    n: '[[w.chen-yun-nianpu-xiuding]], III, 171. Made public: 2015. Names: Mao Zedong, Chen Yun, Wang Dongxing, Wang Zhen.'
    tags: [polity:prc, name:mao-zedong, name:chen-yun, vis:only:prc, name:wang-dongxing, name:wang-zhen]
