    when: Oct. 26
    date: '1969-10-26'
    thread: china-leadership
    also: [china]
    c: Deng Xiaoping 邓小平, Zhuo Lin and Xia Bogen leave the Binjiang Guesthouse and reach the house at Wangchenggang in Xinjian county, where they settle.
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1950 (Oct. 26, 1969). The words: 下午 (III, 1950). Made public: 2009 (the nianpu). Names: Deng Xiaoping, Zhuo Lin.'
