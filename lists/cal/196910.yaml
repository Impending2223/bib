  - id: cal.1969-10.china-leadership-10
    when: Oct.
    date: 1969-10
    thread: china-army
    c: Lin Liguo 林立果 is made deputy director of the Air Force headquarters' office and deputy head of the Air Force's operations department; Zhou Yuchi 周宇馳 and Liu Shiying 劉世英 are made deputy directors of the office with him, Wang Fei 王飛 already deputy chief of staff and director of the office.
    n: '[[w.yang-jisheng-tiandi-fanfu]], II, 752; [[w.teiwes-tragedy-of-lin-biao]], 14 (Lin Liguo deputy head of the air force''s combat department, at twenty-four, with an alleged but not real authority to decide all air force matters; by Zhang Yunsheng, Ye Qun ordered that Lin not be told; by Lin Doudou, Lin knew nothing of it). Made public: 2016. To check: [[w.yunsheng-maojiawan-jishi]], 328 (cited by [[w.teiwes-tragedy-of-lin-biao]], 14 n.14a); [[w.xiao-xiao-lin-doudou-jingbao]], 23 (cited by [[w.teiwes-tragedy-of-lin-biao]], 14 n.14b); [[w.weixun-wo-suo-zhidaode-ye]], 172 (cited by [[w.teiwes-tragedy-of-lin-biao]], 14 n.14c); [[w.nianyi-da-dongluande-niandai]], 378 (cited by [[w.teiwes-tragedy-of-lin-biao]], 14 n.14d); [[w.barnouin-ten-years-of-turbulence]], 216 (cited by [[w.teiwes-tragedy-of-lin-biao]], 14 n.14e).'
