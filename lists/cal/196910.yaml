  - id: cal.1969-10-01.china-leadership
    when: Oct. 1
    date: '1969-10-01'
    thread: china-leadership
    also: [korea-leadership]
    c: Peking, Tiananmen, 10 a.m. Mao with Lin Biao, Zhou Enlai and others at the rally for the PRC's twentieth anniversary; reviews the parade. In the rest room with Lin he receives Choe Yong-gon of the Korean Workers' Party. Sino-Korean friendship; on Moscow, we do not want a war, we need not abuse Soviet revisionism daily; their daily abuse failed; the split pleases the US; the border has been quiet for a dozen days. He also meets Phạm Văn Đồng, Nouhak Phoumsavanh of the Lao People's Party, Albania's Toska, Italy's Dinucci, Sweden's Bylin and Ceylon's Shanmugathasan.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 318–319 (Oct. 1, 1969; Mao, Lin Biao and Zhou at the parade and Mao''s reception of Choe Yong-gon). Made public: 2013 (the talk with Choe). Names: Mao Zedong, Lin Biao, Zhou Enlai, Phạm Văn Đồng, Choe Yong-gon, Nouhak Phoumsavanh, Toska, Dinucci, Bylin, Shanmugathasan.'
    src:
      c: a74b3493
      rows:
        - 'w.zedong-mao-zedong-nianpu VI, Oct. 1, 1969: all'
        - 'w.zhou-enlai-nianpu-1949-2020 III, 318–319: B, D'
    tags: [polity:prc, polity:dprk, name:mao-zedong, name:lin-biao, name:zhou-enlai, name:pham-van-dong, vis:only:prc+dprk@E-I]
  - id: cal.1969-10-01.china-leadership-2
    when: Oct. 1
    date: '1969-10-01'
    thread: china-leadership
    also: [china]
    c: Zhou Enlai calls heads of the State Science and Technology Commission, the Academy of Sciences, the Ministry of Posts and Telecommunications, Xinhua and the Central Broadcasting Bureau on the radio time signal. When someone mentions that the stations play "The East Is Red" and a Mao quotation before the signal, he says it is imposing on others, on the world's people and on Mao himself, putting China on the defensive; to impose on people is suicide and harms Mao Zedong Thought. As the standard clock in use is not advanced enough, he calls for resolve to make an advanced one and press research on the ammonia atomic clock and better atomic clocks, to throw away the foreign crutches and catch up with the world's best.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 318 (Oct. 1, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
