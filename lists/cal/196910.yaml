    at: before 1969-10-01
    thread: china-border-war
    also: [china-army]
    c: Two emergency dispersals (jinji shusan 紧急疏散) in the army's war preparation, around National Day, after the instructions relayed at the September conference.
    n: '[[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1 ("around National Day", 国庆节前后; from the Office Group''s summary of Dec. 31, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Military Commission Office Group, "Summary of the all-army war preparation conference", Dec. 31, 1969 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 484 n.1). See [[cal.1969-09.china-leadership-4]]. Check: the days, and who ordered them; the note gives neither. Check: whether either is the dispersal of mid-October (Lin Biao''s order: [[cal.1969-10-18.china-leadership]]). Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
