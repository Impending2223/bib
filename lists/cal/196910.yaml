    thread: china-economy
    c: On the night of Oct. 17 Liu Shaoqi, gravely ill, is carried on a stretcher onto a plane and flown to Kaifeng, Henan, where he is secretly held at the old site of the "Tonghe Yuyinhao" bank inside the compound of the Kaifeng revolutionary committee.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 661 (Oct. 17, 1969); [[w.macfarquhar-maos-last-revolution]], 277–278 (evacuated with other leaders in a war scare and flown to Kaifeng, where his guards do not know who he is). Made public: 1996. To check: [[w.dittmer-death-and-transfiguration]], 459–460 (cited by [[w.macfarquhar-maos-last-revolution]], 278 n.18). See [[cal.1969-10-17.china-leadership]]. Names: Liu Shaoqi.'
