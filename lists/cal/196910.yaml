  - id: cal.1969-10-01.china-leadership
    when: Oct. 1
    date: '1969-10-01'
    time: 1969-10-01T02:00Z
    place: peking
    thread: china-mao-foreign
    also: [korea-leadership, china-zhou-foreign, china-foreign]
    c: Peking, Tiananmen, 10 a.m.{1} Mao with Lin Biao, Zhou Enlai and others at the rally for the PRC's twentieth anniversary;{2} reviews the parade.{3} In the rest room with Lin he receives Choe Yong-gon of the Korean Workers' Party.{4} Sino-Korean friendship; on Moscow, we do not want a war, we need not abuse Soviet revisionism daily; their daily abuse failed; the split pleases the US; the border has been quiet for a dozen days.{5} He also meets Phạm Văn Đồng, Nouhak Phoumsavanh of the Lao People's Party, Albania's Toska, Italy's Dinucci, Sweden's Bylin and Ceylon's Shanmugathasan.{6}
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1969. [[w.zhou-enlai-nianpu-1949-2020]], III, 318–319 (Oct. 1, 1969; Mao, Lin Biao and Zhou at the parade and Mao''s reception of Choe Yong-gon); [[w.zhonghua-renmin-gongheguo-waijiao]], 227 (Sept. 30–Oct. 1, 1969; Choe Yong Gon, who came for the 20th anniversary; on Oct. 1 Mao receives him in friendly talk: the U.S. and Japan close, with South Korea and Taiwan; their target is China; the two states must draw close); [[w.mao-zedong-zhuan]], VI, ch. 78 n.20 (Oct. 1, the twentieth anniversary, Mao, just back in Peking from out of town, appears as usual on the Tiananmen rostrum and reviews the mass parade; the joint editorial of the two papers and the journal and Lin Biao''s speech to the capital''s army and people end with Mao''s added slogan 22, the editorial calling on the army and people to guard against surprise attack, hold their posts and be ready, n.20; the book gives no hour and no list of those present). [[w.jian-zhou-enlai]], 623–624 (Mao, with Zhou, meets Choe atop the Gate of Heavenly Peace: relations "like one between lips and teeth"; Mao: the Americans'' main target is China, "our two countries must be united"; Kim Il-sung invited "either publicly or secretly"; "we may dispatch Premier Zhou to visit Korea"); [[w.chen-yi-nianpu]], 1213 (Oct. 1, 1969; Chen Yi on the Tiananmen rostrum at the rally for the PRC''s 20th anniversary); [[w.liu-jixian-ye-jianying-nianpu]], II, 984 (Oct. 1, 1969; morning; Ye Jianying 叶剑英 on the Tiananmen 天安门 rostrum at the celebration of the twentieth anniversary); [[w.chen-yun-nianpu-xiuding]], III, 170 (Chen Yun at the capital''s army and people''s rally at Tiananmen for the twentieth anniversary); [[w.zhu-de-nianpu-xinbian]], III, 1970 (Oct. 1, 1969; Zhu De 朱德 at the capital''s rally in Tiananmen Square 天安门广场 for the twentieth anniversary of the People''s Republic, reviewing the parade). Made public: 2013 (the talk with Choe). To check: Mao''s conversation with Choi Yonggun [Choe Yong-gon], October 1, 1969, Chinese Central Archive (CCA) (cited by [[w.jian-zhou-enlai]], 624 n.39). Names: Mao Zedong, Lin Biao, Zhou Enlai, Phạm Văn Đồng, Choe Yong-gon, Nouhak Phoumsavanh, Toska, Dinucci, Bylin, Shanmugathasan.'
