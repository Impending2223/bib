  - id: cal.1969-10-24.vietnam-hanoi
    when: Oct. 24
    date: '1969-10-24'
    thread: vietnam-hanoi
    also: [vietnam]
    c: 'The Secretariat''s cable no. 00 to COSVN, Region V and Trị–Thiên: on the Moratorium of Oct. 15 millions of Americans in 1,200 towns, some legislators, governors and mayors among them, demanded that Nixon bring all the troops home; some American civilians and soldiers in Vietnam joined. The cities of the South not ready for it; for the new round in mid-November, a broad movement in Saigon–Chợ Lớn, of students, workers and Buddhists, and of the Thiệu–Kỳ–Khiêm opposition such as Trần Ngọc Liễng, demanding that Nixon withdraw at once and all.'
    n: '*Điện của Ban Bí thư số 00, ngày 24 tháng 10 năm 1969, Về việc phát động phong trào đấu tranh chính trị rộng lớn ở miền Nam* (the title the editors''), signed Lê Văn Lương. [[w.van-kien-dang-toan]], XXX, 339–41. Made public: 2004. Names: Nixon, Thiệu, Kỳ, Khiêm, Trần Ngọc Liễng.'
    tags: [polity:drv, polity:us, polity:rvn, vis:only:drv, name:nixon-richard-m, name:nguyen-van-thieu, name:nguyen-cao-ky, name:tran-thien-khiem]
  - id: cal.1969-10-24.vietnam-hanoi-2
    when: Oct. 24–25
    date: '1969-10-24'
    thread: vietnam-hanoi
    c: 'The Secretariat with the Standing Committee of the Council of Ministers, the State Planning Commission and Hanoi''s leaders on the cities in 1970, a year after the bombing ended: Hanoi, Haiphong, Nam Định and the Quảng Ninh industrial zone first. Enterprises regrouped where best for production, crafts restored; two tasks, an eight-hour day of real productivity and the life of workers, cadres and townspeople eased; indirect staff cut.'
    n: '*Thông báo số 12-TB, ngày 29 tháng 10 năm 1969, Về Hội nghị Ban Bí thư bàn vấn đề giải quyết đời sống ở thành phố trong năm 1970* (the meeting of Oct. 24–25), signed by Trần Xuân Bách, chief of the Central Office. [[w.van-kien-dang-toan]], XXX, 342–49. Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-10-24.china-leadership
    when: Oct. 24
    date: '1969-10-24'
    thread: china-leadership
    also: [defense, india-and-china-cultural-revolution]
    c: Zhou Enlai presides over the Politburo meeting, which discusses and revises the Center's and the Military Commission's emergency instruction on strengthening secrecy.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 24, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-25.china-leadership
    when: Oct. 25
    date: '1969-10-25'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai adds to the draft Center notice on devolving the colleges, where it deals with their handing over: "be conscientious and responsible, protect school buildings, teaching equipment, scientific instruments, books and files, affiliated factories and all state property; fight resolutely those who destroy, embezzle or steal the schools'' public goods, and punish severely any such crimes found"; and "the leadership of the colleges under the National Defense Science and Technology Commission is fixed separately." On Oct. 26 the Center issues the notice: colleges of State Council departments in Peking stay under them, those elsewhere pass to the local province, municipality or region, those run with factories to the factories; all of the Ministry of Education''s go to the provinces, municipalities and regions where they are.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 25, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-26.china-leadership
    when: Oct. 26
    date: '1969-10-26'
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao, Peking: reads the Chinese delegation''s speech for the fourth plenary meeting of the boundary talks. Zhou Enlai: the Soviet side showed stubbornness in the third session Oct. 23 and in the heads'' meeting Oct. 24, and a rebuttal is wanted. Mao: read; "keep attacking, persistently".'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-26.china-leadership-2
    when: Oct. 26
    date: '1969-10-26'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: Zhou Enlai visits Hoàng Văn Hoan at the PLA General Hospital.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 26, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, polity:drv, name:zhou-enlai, vis:only:prc+drv]
  - id: cal.1969-10-27.soviet-union-leadership
    when: Oct. 27–28
    date: '1969-10-27'
    thread: soviet-union-leadership
    also: [soviet-union-czechoslovakia]
    c: Moscow. Brezhnev negotiates with the Czechoslovak delegation led by Husák in the Kremlin, 9 on; speaks at the Soviet–Czechoslovak friendship rally at the Palace of Congresses, 3 to 8; Oct. 28 he, Kosygin and Podgorny see the delegation off at Vnukovo, 10 a.m.
    n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 367 (Oct. 27–28). Names: Brezhnev, Husák, Kosygin, Podgorny.'
    tags: [name:brezhnev-leonid, name:husak-gustav, name:kosygin-aleksei, name:podgorny-nikolai-v, polity:ussr, polity:czechoslovakia]
  - id: cal.1969-10-28.china-leadership
    when: Oct. 28
    date: '1969-10-28'
    thread: china-leadership
    also: [india-and-china-cultural-revolution, economy]
    c: 'The State Council forwards the report of the military control commission of the First Ministry of Machine Building on speeding up the Second Automobile Plant: it is a key Third Front project, all sides are to cooperate closely and assure that the plant produces military cross-country vehicles in batches by 1972 as scheduled. The nianpu notes that Zhou fixed its site at Shiyan, Hubei; construction began in 1969, and in 1975 the first model, a 2.5-ton cross-country vehicle, went into production.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324 (Oct. 28, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-29.china-leadership
    when: Oct. 29
    date: '1969-10-29'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: Zhou Enlai attends the Politburo meeting and hears the report on Sichuan's problem.
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 324–325 (Oct. 29, 1969). Made public: 2020. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10-30.vietnam-hanoi
    when: Oct. 30
    date: '1969-10-30'
    thread: vietnam-hanoi
    also: [vietnam-operations]
    c: 'COSVN''s Standing Committee, resolution no. 14-NQNT, on pressing guerrilla war in the general offensive and uprising: its strategic place, its present state and urgent tasks, the forms of its organization and action.'
    n: '*Nghị quyết của Thường vụ Trung ương Cục số 14-NQNT, ngày 30 tháng 10 năm 1969, Về việc đẩy mạnh chiến tranh du kích trong tổng công kích, tổng khởi nghĩa* (the appendix). [[w.van-kien-dang-toan]], XXX, appendix (the copy''s pages unnumbered). Made public: 2004.'
    tags: [polity:drv, vis:only:drv]
  - id: cal.1969-10-30.china-leadership
    when: Oct. 30
    date: '1969-10-30'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Zhou Enlai writes Mao and Lin Biao on the Politburo meeting: "at present the Center cannot but take up the Sichuan problem"; since the Ninth Congress Sichuan has raised an "against restoration" movement of a nature like Shandong''s, Guizhou''s and Hubei''s; its aim too is at the army and the Workers'' Congress too wants to rise above the revolutionary committee, but Sichuan has Sichuan''s features, all shown in factionalism and armed fights. It is now needful first to call Sichuan''s responsible Party, government and army men "to Peking to confer", to reach unity on the principle of Mao Zedong Thought, and then widen the conference. Mao approves on Oct. 31.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 325 (Oct. 30, 1969). Made public: 2020. Names: Zhou Enlai, Mao Zedong, Lin Biao.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, name:lin-biao, vis:only:prc]
  - id: cal.1969-10-31.china-leadership
    when: Oct. 31
    date: '1969-10-31'
    thread: china-leadership
    also: [india-and-china-cultural-revolution]
    c: 'Mao, Peking: reads the records of the boundary talks of Oct. 27 and 29; and Zhou Enlai''s report on the Politburo''s hearing on Sichuan: since the Ninth Congress an "against restoration" movement there like those of Shandong, Guizhou and Hubei, aimed at the army, the workers'' representatives placed over the revolutionary committee, factionalism and armed fighting; the Center must take it up; call Sichuan''s Party, government and army chiefs to Peking, bring unity, then widen. Mao: agreed.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, vis:only:prc]
  - id: cal.1969-10.china-leadership
    when: Oct., before the 20th
    date: 1969-10
    at: before 1969-10-20
    thread: china-leadership
