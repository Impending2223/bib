  - id: cal.1969-10-19.china-leadership-5
    when: Oct. 19
    date: '1969-10-19'
    place: peking
    thread: china-center
    c: 'Peking. Before dawn the Central leaders receive the Guizhou report team and sharply criticize Li Zaihan 李再含. Zhou Enlai 周恩來: the core group "opposes Chairman Mao and the Center, double-dealing; Li Zaihan is the example"; "the Center has to some extent lost confidence in you"; one speech of his did away with 18 county revolutionary committees, "even Li Lisan did not dare so much." Chen Boda and Kang Sheng also criticize him.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 487–488. The words: 10月19日凌晨 (I, 487). Made public: 2014. Names: Zhou Enlai, Chen Boda, Kang Sheng, Mao Zedong, Li Zaihan, Li Lisan. Check: the year: the page prints "年10月19日" between Sept. 24 and Oct. 26, 1969.'
    src:
