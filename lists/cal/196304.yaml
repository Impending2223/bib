  - id: cal.1963-04-03.soviet-union
    when: Apr. 3
    date: '1963-04-03'
    thread: soviet-union
    also: [robert-kennedy, testing]
    c: '3:30 p.m. Dobrynin hands Robert Kennedy a talking paper of some twenty-five pages, in fact from Khrushchev to the President: no more than two or three inspection sites; the United States run by capitalists; more Soviet troops gone from Cuba than the press reports. Kennedy returns it, "so insulting and rude"; such messages to go through the State Department, "not through me."'
    n: 'Robert Kennedy to the President, Apr. 3, [FRUS 1961–63, VI, doc. 94](https://history.state.gov/historicaldocuments/frus1961-63v06/d94); the message, [doc. 93](https://history.state.gov/historicaldocuments/frus1961-63v06/d93). [[w.schlesinger-robert-kennedy-and-his]], 596. Names: Dobrynin, Robert Kennedy, Khrushchev, Kennedy.'
    src:
      c: 8b6ff867
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d94: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v06/d93: A'
        - 'w.schlesinger-robert-kennedy-and-his 596: B'
        - 'via w.schlesinger-robert-kennedy-and-his 596 n.48: all'
    tags: [name:dobrynin-anatoly, name:kennedy-robert-f, name:khrushchev-nikita-s, name:kennedy-john-f]
