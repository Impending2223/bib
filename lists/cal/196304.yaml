    n: '[[w.perlstein-before-the-storm]], 192–94. To check: Transcript, O''Donnell''s press conference, Apr. 8, 1963, F. Clifton White Papers, Cornell University, box 18 (cited by [[w.perlstein-before-the-storm]], 192 n.4); Kitchel to Kellar, Apr. 8, 1963, Denison Kitchel Papers, Hoover Institution, box 2/Kellar (cited by [[w.perlstein-before-the-storm]], 193 n.3); [[w.white-suite-3505]]; [[w.rusher-rise-of-the-right]]; [[w.goldberg-barry-goldwater]]; [[w.brennan-turning-right-in-the]]; [[w.edwards-goldwater]]; [[w.middendorf-glorious-disaster]]; [[w.goldwater-with-no-apologies]]; [[w.goldwater-goldwater]]; [[w.novak-agony-of-the-g]]; [[w.kabaservice-rule-and-ruin]]; [[w.white-making-of-the-president-1965]]. Names: O''Donnell, White, Goldwater.'
