    n: '[[w.dittmer-local-people]], 155; [[w.branch-pillar-of-fire]], 71–72. Check: Branch, 722–24, has Doar tell the prisoners Apr. 3 that he will ask Judge Clayton the next day to vacate their convictions, stop the harassment and protect the registrants; the marshals take them in chains that evening; the city gives way in negotiations the morning of Apr. 4, the suit set aside for their release, and the United States to pay Leflore County''s costs of distributing the surplus food (Burke Marshall to the President, Apr. 8, 1963). To check: Wiley Branton, "Field Report," Apr. 7, 1963, VEP Papers, reel 175 (cited by [[w.dittmer-local-people]], 155 n.30). See [[cal.1963-03-30.mississippi]]. Names: Doar. Check: Branch, 71–73, has Doar visit the prisoners in the jail Apr. 3 and the charges dropped and the prisoners freed without bail Apr. 4, Kennedy and Marshall trading the (b) suit for their release.'
