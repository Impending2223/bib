    tags: [name:stennis-john-c, name:eastland-james-o, state:ms]
  - id: cal.1963-04-03.alabama
    when: Apr. 3
    date: '1963-04-03'
    thread: alabama-birmingham
    also: [desegregation-public-places, king]
    c: 'Birmingham. King''s SCLC and Shuttlesworth''s movement open Project C: sit-ins at downtown lunch counters. The day before, Boutwell beat Connor in the runoff for mayor; Connor and the old commission refuse to leave office.'
    n: '*Walker v. City of Birmingham*, [388 U.S. 307](https://tile.loc.gov/storage-services/service/ll/usrep/usrep388/usrep388307/usrep388307.pdf) (1967). The President''s News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430) (May 8, 1963). [[w.rosenberg-kennedy-johnson-and-the]], "Protest in Birmingham"; [[w.schlesinger-robert-kennedy-and-his]], 328–30 (the campaign, early in April; not Project C, the day or the runoff). [[w.garrow-bearing-the-cross]], 236–38. To check: [[w.mcwhorter-carry-me-home]]; [[w.fairclough-to-redeem-the-soul]]; [[w.eskew-but-for-birmingham]]; [[w.branch-parting-the-waters]]; [[w.brauer-john-f-kennedy-and]]; [[w.bryant-bystander]]; [[w.levingston-kennedy-and-king]]; [[w.king-why-we-cant-wait]]; [[w.manis-fire-you-cant-put]]; [[w.young-easy-burden]]; [[w.nunnelley-bull-connor]]. See [[cal.1963-04-02.alabama-birmingham]]. Names: Martin Luther King, Shuttlesworth, Connor, Boutwell.'
    src:
