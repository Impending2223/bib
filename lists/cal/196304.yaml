  - id: cal.1963-04-10.peace-corps
    when: Apr. 10
    date: '1963-04-10'
    thread: peace-corps
    c: 'Executive Order 11103: a volunteer who has served a full term, about two years, may be appointed to the competitive service on passing an examination, within a year of leaving the Peace Corps, three years if in military service or study. A memorandum asks the agencies to recruit them.'
    n: '[Exec. Order No. 11,103](https://www.presidency.ucsb.edu/documents/executive-order-11103-providing-for-the-appointment-former-peace-corps-volunteers-the); Memorandum on Recruitment of Former Peace Corps Volunteers for Career Government Services, [1963 Pub. Papers 320](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=378) (Apr. 10, 1963). To check: [[w.hoffman-all-you-need-is]]; [[w.rice-bold-experiment]]; [[w.fischer-making-them-like-us]]; [[w.meisler-when-the-world-calls]]. See [[cal.1961-09-22.peace-corps]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-11.steel
    when: Apr. 11
    date: '1963-04-11'
    thread: steel
    c: 'Wheeling Steel raises prices on some products, Apr. 9. Statement: no across-the-board increase; "selected price adjustments, up or down," not incompatible with stability. U.S. Steel and others follow with selective increases.'
    n: 'Statement by the President on the Need for Price and Wage Stability in the Steel Industry, [1963 Pub. Papers 321](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=379) (Apr. 11, 1963). To check: [[w.sheahan-wage-price-guideposts]]; [[w.heath-john-f-kennedy-and]]. See [[cal.1962-04-10.steel]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-12.alabama
    when: Apr. 12
    date: '1963-04-12'
    thread: alabama-birmingham
    also: [king]
    c: Birmingham, Good Friday. King and Abernathy march against a state court injunction of Apr. 10; jailed. Released on bond, Apr. 20.
