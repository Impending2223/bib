    when: Apr. 4
    date: '1963-04-04'
    thread: cities-and-housing
    also: [transportation]
    c: Senate passes the mass transit bill, [52–41](https://voteview.com/rollcall/RS0880021). Grants to cities for transit systems, cut from $500 million to $375 million.
    n: 'To check: [[w.smerk-urban-transportation]]; [[w.gelfand-nation-of-cities]]. See [[cal.1962-01-11.program]]. See [[cal.1963-02-18.transportation]].'
