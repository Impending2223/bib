    c: Birmingham runoff. Boutwell elected mayor over Connor, a 7,982-vote margin (Check). The mayor and council take their oaths Apr. 15; the three commissioners, Connor among them, hold to their offices, claiming terms to Oct. 1, 1965. Two governments.
