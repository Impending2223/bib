    c: 'Anglo-American talks on strategy. Taylor: the British want "a poor man''s forward strategy." Mountbatten recalls Kennedy''s remark that NATO could cut ten divisions but for Berlin. McNamara and Taylor put the enemy at 60 divisions in thirty days, the British at 91 in ten and 50 more by D+30. Studies agreed of tactical nuclear weapons, 30 days'' supply, no MRBMs or reserve divisions.'
