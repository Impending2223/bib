  - id: cal.1963-04-02.mayors-chicago
    when: Apr. 2
    date: '1963-04-02'
    thread: mayors
    also: [elections-1963]
    c: 'Chicago. Daley (D) re-elected to a third term over Adamowski (R), Cook County''s State''s Attorney 1957–60, 679,497 to 540,705, 55.7 percent. The primaries Feb. 26: Daley unopposed; Adamowski over two others, 174,742 to 18,268, 90.5 percent. Adamowski''s charge: "we do not have one party-rule, we have one-man rule."'
    n: 'Votes: [Wikipedia, "1963 Chicago mayoral election"](https://en.wikipedia.org/wiki/1963_Chicago_mayoral_election), from the Board of Election Commissioners'' table of mayoral returns (Check: the Board''s canvass). To check: [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]; [[w.peirce-megastates-of-america]]. Names: Daley, Adamowski.'
    tags: [state:il, city:chicago, name:daley-richard-j, name:adamowski-benjamin-s]
    short: Daley over Adamowski
  - id: cal.1963-04-02.states-and-cities-tx
    when: Apr. 2
    date: '1963-04-02'
    thread: states-and-cities
    also: [voting-rights]
    c: Crystal City, Tex. Five Mexican American candidates, backed by PASO and the Teamsters at the Del Monte cannery, take all five city council seats, 795 to 864 votes each; the other slate 664 to 754. Of 1,681 poll taxes paid in the town, 1,139 by Mexican Americans. The council makes Juan Cornejo, the Teamsters' representative, mayor.
    n: 'Larry Goodwyn, "Los Cinco Candidatos," [*Texas Observer*, Apr. 18, 1963, pp. 3, 8](https://issues.texasobserver.org/pdf/ustxtxb_obs_1963_04_18_issue.pdf); Teresa Palomo Acosta, ["Crystal City Revolts,"](https://www.tshaonline.org/handbook/entries/crystal-city-revolts) *Handbook of Texas Online*. Check: the date and the city''s canvass. To check: [[w.shockley-chicano-revolt-in-a]]; [[w.montejano-anglos-and-mexicans-in]]; [[w.behnken-fighting-their-own-battles]]; [[w.krochmal-blue-texas]]. Names: Cornejo.'
    tags: [state:tx, name:cornejo-juan]
    short: Crystal City
