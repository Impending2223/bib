  - id: cal.1963-04-04.vietnam
    when: Apr. 4
    date: '1963-04-04'
    thread: vietnam
    c: 'Nolting with Diệm, three and a half hours, the evening, on the joint counterinsurgency fund. Diệm will not accept it as proposed: Americans at the lower levels, by their number and zeal, give the impression of an American "protectorate." Nolting: "courteous but immovable."'
    n: '[FRUS 1961–63, III, doc. 81](https://history.state.gov/historicaldocuments/frus1961-63v03/d81) (Nolting, Apr. 5). [[w.miller-misalliance]], 254–55 (the fund; the provincial committees; Diệm unmoved). Names: Nolting, Diệm.'
    src:
      c: c0d85198
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d81: all'
        - 'w.miller-misalliance 254–55: A-B'
        - 'via w.miller-misalliance 255 n.28c: all'
    tags: [name:nolting-frederick-e-jr, name:ngo-dinh-diem, place:saigon]
  - id: cal.1963-04-05.middle-east-yemen
    when: Apr. 5–9
    date: '1963-04-05'
    thread: middle-east-yemen
    c: 'Yemen. Bunker with Faisal: the disengagement agreement. Saudi aid to the royalists suspended; a demilitarized zone 20 kilometers each side of the border, with impartial observers.'
    n: 'FRUS 1961–63, XVIII, docs. [209](https://history.state.gov/historicaldocuments/frus1961-63v18/d209), [211](https://history.state.gov/historicaldocuments/frus1961-63v18/d211) (editorial note). See [[cal.1963-03-01.middle-east]]. Names: Bunker, Faisal ibn Abd al-Aziz Al Saud.'
    tags: [name:bunker-ellsworth, name:faisal-ibn-abd-al-aziz-al-saud]
