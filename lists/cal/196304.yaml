    c: 'Kennedy asks the Defense Department to compare American and allied preparedness. OSD''s draft: Seventh Army alone fully equipped, 90 to 120 days of supply against the allies'' 15 to 30; urge the allies or cut Seventh Army to their level. Taylor: that would "abandon virtue because it is forced to live among sinners." The Chiefs'' revision: keep American forces as they are.'
    n: '[[w.poole-joint-chiefs-of-staff]], 208–09. Names: Kennedy, Taylor.'
