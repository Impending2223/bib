    n: '[Justice Department memorandum](https://www.crmvet.org/docs/630408_rfk_memo.pdf) (Apr. 8, 1963). [[w.dittmer-local-people]], 155–56. To check: Wiley Branton, "Field Report," Apr. 7, 1963, VEP Papers, reel 175 (cited by [[w.dittmer-local-people]], 155 n.30). See [[cal.1963-03-27.mississippi]]. Check: the terms; Dittmer, 155–56: the eight released and their sentences stayed until a hearing in late October; the city to let Negroes take the test; the county''s surplus food resumed, the Department of Agriculture paying its costs.'
