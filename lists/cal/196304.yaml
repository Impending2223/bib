    tags: [name:king-martin-luther-jr, name:shuttlesworth-fred, name:connor-eugene, name:boutwell-albert]
  - id: cal.1963-04-03.railroads
    when: Apr. 3
    date: '1963-04-03'
    thread: railroads
    c: 'Executive order: an emergency board on the work-rules dispute between the railroads and the five operating brotherhoods. The carriers'' new rules, firemen off diesels, held off while it sits.'
    n: '[Exec. Order No. 11,101](https://www.presidency.ucsb.edu/documents/executive-order-11101-creating-emergency-board-investigate-disputes-between-the-carriers) (Apr. 3, 1963). See [[cal.1963-03-04.railroads]].'
    tags: [name:kennedy-john-f]
  - id: cal.1963-04-03.opinion
    when: Apr. 3
    date: '1963-04-03'
    thread: opinion
    c: 'Gallup, Mar. 8–13: the most important problem, Cuba and Castro, 24 percent; other international problems, 39; unemployment, 11; racial problems, 4. The Democrats better able to handle it, 36; the Republicans, 17.'
    n: '[[w.gallup-poll]], III, 1812. Names: Fidel Castro.'
    tags: [name:castro-fidel]
  - id: cal.1963-04-03.mississippi
    when: Apr. 3
    date: '1963-04-03'
    thread: mississippi
    c: 'John Doar agrees with Greenwood''s officials: the eight SNCC workers to be released, their sentences stayed until a full hearing in late October; the Department to withdraw its application for a preliminary injunction. Doar tells Wiley Branton at 6:30 the next morning.'
    n: '[[w.dittmer-local-people]], 155. To check: Wiley Branton, "Field Report," Apr. 7, 1963, VEP Papers, reel 175 (cited by [[w.dittmer-local-people]], 155 n.30). See [[cal.1963-03-30.mississippi]]. Names: Doar.'
    src:
      c: 79d0683e
      rows:
        - 'w.dittmer-local-people 155: all'
        - 'via w.dittmer-local-people 155 n.30: all'
    tags: [name:doar-john, state:ms]
