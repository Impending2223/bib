  - id: cal.1963-04-08.japan-and-korea
    when: Apr. 8
    date: '1963-04-08'
    thread: japan-and-korea-civilian-rule
    c: Park puts off the referendum to September.
    n: '[FRUS 1961–63, XXII, doc. 300](https://history.state.gov/historicaldocuments/frus1961-63v22/d300). See [[cal.1963-02-18.japan-and-korea]]. Names: Park.'
    tags: [name:park-chung-hee]
  - id: cal.1963-04-09.program
    when: Apr. 9
    date: '1963-04-09'
    thread: conservation
    c: Senate passes the wilderness bill, [73–12](https://voteview.com/rollcall/RS0880025).
    n: 'Wilderness Act (K–J Cong. II.J.2). To check: [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]. See [[cal.1962-01-11.program]]. See [[cal.1961-09-06.conservation]].'
  - id: cal.1963-04-09.middle-east
    when: Apr. 9
    date: '1963-04-09'
    thread: middle-east
    c: Iraq. Harriman approves selling the new regime 40 light tanks and 12 tank transporters; the Near East bureau against asking a settlement with the Kurds in return.
    n: '[FRUS 1961–63, XVIII: Near East, 1962–1963, doc. 216](https://history.state.gov/historicaldocuments/frus1961-63v18/d216) n.1 (Talbot to Harriman, Apr. 5; Stoltzfus to Harriman, against a settlement with the Kurds as the price; Harriman''s approval, Apr. 9). To check: [[w.matthews-kennedy-administration-counterinsurgency-and]]; [[w.gibson-sold-out]]. See [[cal.1963-02-08.middle-east]]. Names: Harriman.'
    tags: [name:harriman-w-averell]
  - id: cal.1963-04-10.program
    when: Apr. 10
    date: '1963-04-10'
    thread: jobs-and-wages
    c: Senate passes the Youth Employment Act, [50–34](https://voteview.com/rollcall/RS0880033). A Youth Conservation Corps and hometown youth work. Same day, a National Service Corps proposed, for volunteers at home.
    n: 'Letter to the President of the Senate and to the Speaker of the House Proposing the Establishment of a National Service Corps, [1963 Pub. Papers 320](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=378) (Apr. 10, 1963). To check: [[w.sundquist-politics-and-policy]]. See [[cal.1962-01-11.program]].'
    tags: [name:kennedy-john-f]
