entries:
  - id: cal.1963-04-01.state-constitutions-mi
    when: Apr. 1
    date: '1963-04-01'
    thread: state-constitutions
    c: 'Michigan''s new constitution ratified, 810,860 to 803,436, 50.2 percent. In force Jan. 1, 1964: the Civil Rights Commission among its creations.'
    n: 'Votes: [Wikipedia, "List of Michigan ballot proposals"](https://en.wikipedia.org/wiki/List_of_Michigan_ballot_proposals) (Check: the Board of State Canvassers'' certification, and the recount). To check: [[w.sturm-constitution-making-in-michigan]]; [[w.fine-expanding-the-frontiers-of]]; [[w.harris-romneys-way]]. See [[cal.1962-08-01.state-constitutions-mi]]. Names: Romney.'
    tags: [state:mi, name:romney-george-w]
  - id: cal.1963-04-01.middle-east
    when: Apr. 1–3
    date: '1963-04-01'
    thread: middle-east-yemen
    c: 'Yemen. Bunker with Nasser in Cairo: the UAR to begin withdrawing within 15 days of the suspension of Saudi aid to the royalists.'
    n: 'FRUS 1961–63, XVIII, docs. [203](https://history.state.gov/historicaldocuments/frus1961-63v18/d203) (Bunker''s instructions, Mar. 30), [205](https://history.state.gov/historicaldocuments/frus1961-63v18/d205). See [[cal.1963-03-01.middle-east]]. Names: Bunker, Nasser.'
    tags: [name:bunker-ellsworth, name:nasser-gamal-abdel]
  - id: cal.1963-04-02.foreign-aid
    when: Apr. 2
    date: '1963-04-02'
    thread: foreign-aid
    c: Aid message. $4.5 billion asked, down from the budget's $4.9 billion, after the Clay Committee's report. More lending for Latin America; self-help the test.
    n: 'Special Message to the Congress on Free World Defense and Assistance Programs, [1963 Pub. Papers 294](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=352) (Apr. 2, 1963). To check: [[w.latham-modernization-as-ideology]]. See [[cal.1961-03-22.foreign-aid]]. Names: Clay.'
    tags: [name:kennedy-john-f, name:clay-lucius-d]
  - id: cal.1963-04-02.alabama-birmingham
    when: Apr. 2
    date: '1963-04-02'
    thread: alabama-birmingham
    also: [mayors, elections-1963]
    c: Birmingham runoff. Boutwell elected mayor over Connor, a 7,982-vote margin (Check). The mayor and council take their oaths Apr. 15; the three commissioners, Connor among them, hold to their offices, claiming terms to Oct. 1, 1965. Two governments.
    n: '*Connor v. State ex rel. Boutwell*, [275 Ala. 230](https://static.case.law/ala/275/case-pdfs/0230-01.pdf), 153 So. 2d 787 (1963). [Martin Luther King, Jr., Research and Education Institute, "Boutwell, Albert"](https://kinginstitute.stanford.edu/boutwell-albert). Check: the count and the percentage. See [[cal.1963-03-05.alabama-birmingham]]; [[cal.1963-04-03.alabama]]. Names: Boutwell, Connor.'
    tags: [state:al, city:birmingham, name:boutwell-albert, name:connor-eugene]
  - id: cal.1963-04-02.mayors-chicago
    when: Apr. 2
    date: '1963-04-02'
    thread: mayors
    also: [elections-1963]
    c: 'Chicago. Daley (D) re-elected to a third term over Adamowski (R), Cook County''s State''s Attorney 1957–60, 679,497 to 540,705, 55.7 percent. The primaries Feb. 26: Daley unopposed; Adamowski over two others, 174,742 to 18,268, 90.5 percent. Adamowski''s charge: "we do not have one party-rule, we have one-man rule."'
    n: 'Votes: [Wikipedia, "1963 Chicago mayoral election"](https://en.wikipedia.org/wiki/1963_Chicago_mayoral_election), from the Board of Election Commissioners'' table of mayoral returns (Check: the Board''s canvass). To check: [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]; [[w.peirce-megastates-of-america]]. Names: Daley, Adamowski.'
    tags: [state:il, city:chicago, name:daley-richard-j, name:adamowski-benjamin-s]
  - id: cal.1963-04-02.states-and-cities-tx
    when: Apr. 2
    date: '1963-04-02'
    thread: states-and-cities
    also: [voting-rights]
    c: Crystal City, Tex. Five Mexican American candidates, backed by PASO and the Teamsters at the Del Monte cannery, take all five city council seats, 795 to 864 votes each; the other slate 664 to 754. Of 1,681 poll taxes paid in the town, 1,139 by Mexican Americans. The council makes Juan Cornejo, the Teamsters' representative, mayor.
    n: 'Larry Goodwyn, "Los Cinco Candidatos," [*Texas Observer*, Apr. 18, 1963, pp. 3, 8](https://issues.texasobserver.org/pdf/ustxtxb_obs_1963_04_18_issue.pdf); Teresa Palomo Acosta, ["Crystal City Revolts,"](https://www.tshaonline.org/handbook/entries/crystal-city-revolts) *Handbook of Texas Online*. Check: the date and the city''s canvass. To check: [[w.shockley-chicano-revolt-in-a]]; [[w.montejano-anglos-and-mexicans-in]]; [[w.behnken-fighting-their-own-battles]]; [[w.krochmal-blue-texas]]. Names: Cornejo.'
    tags: [state:tx, name:cornejo-juan]
  - id: cal.1963-04-02.mayors-los-angeles
    when: Apr. 2
    date: '1963-04-02'
    thread: mayors
    also: [elections-1963]
    c: 'Los Angeles City Council, 10th district: Bradley over the appointed incumbent, two elections, for the unexpired term, 17,760 to 10,540, 62.8 percent, and for the full term, 17,552 to 10,400, 62.8 percent. Sworn Apr. 15, the first Negro elected to the council.'
    n: 'Votes: [Wikipedia, "Tom Bradley (mayor)"](https://en.wikipedia.org/wiki/Tom_Bradley_(mayor)); Check: the City Clerk''s canvass. To check: [[w.sonenshein-politics-in-black-and]]; [[w.sides-l-a-city-limits]]. Names: Bradley.'
    tags: [state:ca, city:los-angeles, name:bradley-tom]
  - id: cal.1963-04-02.open-housing-berkeley
    when: Apr. 2
    date: '1963-04-02'
    thread: open-housing
    also: [state-constitutions]
    c: Berkeley. The city's fair housing ordinance, passed by the council, repealed by the voters at referendum. Check the council's date and the vote.
    n: 'To check: [[w.hosang-racial-propositions]]; [[w.rorabaugh-berkeley-at-war]]; [[w.brilliant-color-of-america-has]].'
    tags: [state:ca, city:berkeley]
  - id: cal.1963-04-02.mississippi
    when: Apr. 2
    date: '1963-04-02'
    thread: mississippi
    also: [congress]
    c: 'Stennis on the Senate floor against the Justice Department''s suit at Greenwood: "professional troublemakers have organized one of the most bitter hate campaigns ever devised in this country." Eastland with him; both ask that the suit be dropped.'
    n: '[[w.dittmer-local-people]], 154. To check: 109 Cong. Rec. 5094–96 (1963) (cited by [[w.dittmer-local-people]], 154 n.28). See [[cal.1963-03-30.mississippi]]. Names: Stennis, Eastland.'
