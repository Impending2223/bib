    when: Apr. 3
    date: '1963-04-03'
    thread: cuba
    c: 'At a meeting on Cuba, Bundy: no sabotage operations under way, the Special Group having decided such activity "not worth the effort expended on it."'
    n: '[S. Rep. No. 94-465, 173 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=184) n.1 (the Memorandum of Meeting on Cuba, Apr. 3). [[w.schlesinger-robert-kennedy-and-his]], 540. See [[cal.1963-01-08.cuba]]. Names: Bundy.'
