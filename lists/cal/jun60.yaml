# Cal. VII June 1960
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: VII
entries:
  - id: cal.1960-06-02.economy
    when: June 2–9
    date: '1960-06-02'
    thread: economy
    c: 'The Federal Reserve eases. June 2: the discount rate cut from 4 to 3½ percent at Philadelphia and San Francisco, Martin''s Board approving; eight more Reserve Banks, June 9. Three-month bills at 2.29 percent, June 13.'
    n: 'Federal Open Market Committee, [minutes, June 14, 1960](https://www.federalreserve.gov/monetarypolicy/files/fomchistmin19600614.pdf). [[w.meltzer-history-of-the-federal]]; [[w.bremner-chairman-of-the-fed]]; [[w.friedman-monetary-history-of-the]]; [[w.stein-fiscal-revolution-in-america]]. Names: Martin (K–J Adm. III.H).'
    tags: [name:martin-william-mcchesney-jr]
  - id: cal.1960-06-06.governors-ia
    when: June 6
    date: '1960-06-06'
    thread: governors
    also: [elections-1960]
    c: 'Iowa, governor; Loveless running for the Senate. Republican primary: Erbe, the attorney general, 36.3 percent, Schroeder 33.5, Nicholas 30.2. Democratic: Lieutenant Governor McManus 61.7, Hughes, of the Commerce Commission, 38.3.'
    n: '[*Summary of Official Canvass of Votes Cast in Iowa Primary Election, June 6, 1960*](https://sos.iowa.gov/elections/pdf/results/60s/1960primcanv.pdf); figures for Schroeder, Nicholas and Hughes from [Wikipedia, "1960 Iowa gubernatorial election"](https://en.wikipedia.org/wiki/1960_Iowa_gubernatorial_election) (the canvass''s scan illegible there). [[w.larew-party-reborn]]; [[w.hughes-man-from-ida-grove]]. Names: Erbe (K–J Cong. III.F); Hughes (K–J Cong. III.F); Schroeder, Nicholas, McManus (K–J Cong. III.K).'
    tags: [state:ia, name:erbe-norman-a, name:schroeder-jack, name:nicholas-william-h, name:mcmanus-edward-j, name:hughes-harold-e, name:loveless-herschel-c]
  - id: cal.1960-06-07.elections-1960
    when: June 7
    date: '1960-06-07'
    thread: elections-1960
    c: 'Primaries in California and South Dakota. Republican: Nixon in California; unpledged delegates in South Dakota. Democratic: Brown in California; Humphrey in South Dakota.'
    n: 'CQ Guide 6th (2010) 405. See [[cal.1960-03-08.elections-1960]]. Names: Humphrey (K–J Adm. III.D); Nixon (Opp. III.E).'
    tags: [primary:1960-06-07, name:brown-edmund-g, name:humphrey-hubert-h, name:nixon-richard-m]
  - id: cal.1960-06-07.mississippi-ms
    when: June 7
    date: '1960-06-07'
    thread: mississippi
    also: [state-constitutions, jobs-and-wages]
    c: 'Special election: Mississippi ratifies a right-to-work amendment, Section 198-A: no one to be denied work for membership or nonmembership in a union. Proposed by the legislature Apr. 28 by two-thirds of each house.'
    n: '*Barnes v. Ladner*, 241 Miss. 606, [131 So. 2d 458](https://static.case.law/miss/241/html/0606-01.html) (1961). Check: the vote.'
    tags: [state:ms]
  - id: cal.1960-06-07.governors-mt
    when: June 7
    date: '1960-06-07'
    thread: governors
    also: [elections-1960]
    c: 'Montana''s primary, for governor. Republican: Nutter, once the Republican State chairman, 33,099, 50.4 percent; D''Ewart, once Representative, 32,538. Democratic: Cannon 44,690, 34.9; Toole 40,537, 31.6; Kuchera 33,216, 25.9.'
    n: 'Votes: [Wikipedia, "1960 Montana gubernatorial election"](https://en.wikipedia.org/wiki/1960_Montana_gubernatorial_election); Check: [Mont. *Report of the Official Canvass of the Vote Cast at the Primary Election, June 7, 1960*](https://archive.org/details/primaryofficial1960montrich). [[w.malone-montana]]; [[w.peirce-mountain-states-of-america]]. Names: Nutter (K–J Cong. III.F); Cannon, Toole, Kuchera (K–J Cong. III.K).'
    tags: [state:mt, name:nutter-donald-g, name:dewart-wesley-a, name:cannon-paul, name:toole-jack, name:kuchera-mike]
  - id: cal.1960-06-08.elections-1960
    when: June 8
    date: '1960-06-08'
    thread: elections-1960
    c: 'Rockefeller, in a statement: those taking control of the Republican Party have not made clear where it is heading. A program of his own, defense first; Nixon asked to state his.'
    n: 'Check the wording against the text (*New York Times*, June 9, 1960). [[w.smith-on-his-own-terms]]; [[w.persico-imperial-rockefeller]]; [[w.kabaservice-rule-and-ruin]]; [[w.gellman-president-and-the-apprentice]]; [[w.white-making-of-the-president]]. Names: Rockefeller (Opp. III.H); Nixon (Opp. III.E).'
    tags: [name:rockefeller-nelson, name:nixon-richard-m]
  - id: cal.1960-06-10.japan-and-korea
    when: June 10
    date: '1960-06-10'
    thread: japan-and-korea
    c: Hagerty, at Haneda to prepare the President's visit, rides into Tokyo with MacArthur. Demonstrators stop the car and beat on it; a Marine helicopter lifts them out.
    n: FRUS 1958–60, XVIII, docs. [173](https://history.state.gov/historicaldocuments/frus1958-60v18/d173) (MacArthur to Goodpaster), [176](https://history.state.gov/historicaldocuments/frus1958-60v18/d176). See [[cal.1960-01-19.japan-and-korea]].
    tags: [name:hagerty-james-c, name:macarthur-douglas-ii]
  - id: cal.1960-06-12.japan-and-korea
    when: June 12–27
    date: '1960-06-12'
    thread: japan-and-korea
    c: 'Eisenhower to the Far East, by way of Anchorage. Manila, June 14–16: Garcia; the Philippine Congress. Taipei, June 18–19: Chiang; Quemoy shelled during the visit. Okinawa, June 19: demonstrators for reversion. Seoul, June 19–20: Prime Minister Huh Chung; the National Assembly. Honolulu, and home June 26. June 27, radio and television: the disorders in Tokyo "Communist-inspired."'
    n: '[Statement by the President Recorded Before Leaving for the Far East](https://www.presidency.ucsb.edu/documents/statement-the-president-recorded-before-leaving-for-the-far-east) (June 12, 1960); joint statements with [Garcia](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-garcia) (June 16), [Chiang](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-president-chiang-kai-shek) (June 19), [Huh Chung](https://www.presidency.ucsb.edu/documents/joint-statement-following-discussions-with-prime-minister-huh-chung) (June 20); [Radio and Television Report to the American People on the Trip to the Far East](https://www.presidency.ucsb.edu/documents/radio-and-television-report-the-american-people-the-trip-the-far-east) (June 27, 1960). FRUS 1958–60, XIX, docs. [336](https://history.state.gov/historicaldocuments/frus1958-60v19/d336), [337](https://history.state.gov/historicaldocuments/frus1958-60v19/d337) (Taipei); XVIII, [doc. 323](https://history.state.gov/historicaldocuments/frus1958-60v18/d323) (Seoul). [[w.eisenhower-white-house-years]]; [[w.ambrose-eisenhower]]; [[w.packard-protest-in-tokyo]]; [[w.schaller-altered-states]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d, name:garcia-carlos-p, name:chiang-kai-shek, name:huh-chung]
  - id: cal.1960-06-14.elections-1960
    when: June 14
    date: '1960-06-14'
    thread: elections-1960
    also: [soviet-union]
    c: 'Kennedy in the Senate, after Paris: the failure lies in long-range planning, not in the U-2 or its timing. A program by points: the deterrent, forces for limited war, NATO, aid to the poorer nations, Latin America, the Middle East, Africa.'
    n: '[Remarks of Senator John F. Kennedy in the Senate](https://www.jfklibrary.org/archives/other-resources/john-f-kennedy-speeches/united-states-senate-u-2-incident-19600614) (June 14, 1960), reprinted in [[w.strategy-of-peace]]. [[w.preble-john-f-kennedy-and]]; [[w.dallek-unfinished-life]]. Names: Kennedy (Viet. III.A).'
    tags: [name:kennedy-john-f]
  - id: cal.1960-06-14.states-and-cities
    when: June 14–16
    date: '1960-06-14'
    thread: states-and-cities
    c: 'Twenty-third Amendment through Congress. The House passes Judiciary''s text, June 14, by voice. June 16: the Senate puts it into S.J. Res. 39 and adopts it, by voice. Electors for the District, no more than the least populous State''s. The Senate''s poll-tax ban and emergency appointments to the House dropped.'
    n: '[S.J. Res. 39, 74 Stat. 1057](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg1057.pdf) (1960). H.J. Res. 757, 86th Cong. See [[cal.1960-02-02.states-and-cities]].'
  - id: cal.1960-06-15.japan-and-korea
    when: June 15–16
    date: '1960-06-15'
    thread: japan-and-korea
    c: 'Tokyo. Zengakuren students force their way into the Diet''s grounds; a woman student, Kanba Michiko, killed, some 600 hurt. June 16: Kishi''s cabinet asks that the President''s visit be put off. Eisenhower, in Manila, agrees.'
    n: 'FRUS 1958–60, XVIII, docs. [181](https://history.state.gov/historicaldocuments/frus1958-60v18/d181), [182](https://history.state.gov/historicaldocuments/frus1958-60v18/d182), [183](https://history.state.gov/historicaldocuments/frus1958-60v18/d183), [184](https://history.state.gov/historicaldocuments/frus1958-60v18/d184) (Eisenhower to Kishi). See [[cal.1960-01-19.japan-and-korea]]. Names: Kanba (K–J Cong. III.K).'
    tags: [name:kishi-nobusuke, name:eisenhower-dwight-d, name:kanba-michiko]
  - id: cal.1960-06-20.court
    when: June 20
    date: '1960-06-20'
    thread: court
    c: '*Hannah v. Larche*, [363 U.S. 420](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363420/usrep363420.pdf): the Civil Rights Commission may hear complaints against Louisiana registrars without naming the complainants or allowing cross-examination. *Flemming v. Nestor*, [363 U.S. 603](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363603/usrep363603.pdf): Congress may end the Social Security benefits of an alien deported for past Communist membership, 5–4. The Steelworkers trilogy, [363 U.S. 564](https://tile.loc.gov/storage-services/service/ll/usrep/usrep363/usrep363564/usrep363564.pdf): the courts to send grievances under labor contracts to arbitration.'
    n: 'The Court''s 1960 decisions: [[w.schwartz-super-chief]]; [[w.powe-warren-court-and-american]]. On *Hannah*: [[w.dulles-civil-rights-commission-1957]].'
  - id: cal.1960-06-22.japan-and-korea
    when: June 22–23
    date: '1960-06-22'
    thread: japan-and-korea
    c: 'Senate consents to the security treaty with Japan, [11 U.S.T. 1632](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=340), [373 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20373/v373.pdf#page=195), [90–2](https://voteview.com/rollcall/RS0860367). In Japan the Diet''s approval complete June 19, the upper house not having voted. June 23: ratifications exchanged in Tokyo, the treaty in force; Kishi announces he will resign.'
    n: Senate Exec. E, 86th Cong., 2d Sess. [FRUS 1958–60, XVIII, doc. 190](https://history.state.gov/historicaldocuments/frus1958-60v18/d190) (MacArthur, June 24). See [[cal.1960-01-19.japan-and-korea]].
    tags: [name:kishi-nobusuke]
  - id: cal.1960-06-22.school-aid
    when: June 22
    date: '1960-06-22'
    thread: school-aid
    c: 'Rules, Smith''s committee, refuses 7–5 to send the school bill to conference: the four Republicans and three Southern Democrats. School aid dead for the session.'
    n: 'See [[cal.1960-02-04.school-aid]]. Names: Smith (K–J Cong. III.D).'
    tags: [name:smith-howard-w]
  - id: cal.1960-06-23.medicare
    when: June 23
    date: '1960-06-23'
    thread: medicare
    c: 'House passes the Social Security amendments, H.R. 12580, [381–23](https://voteview.com/rollcall/RH0860150). Mills''s plan: federal grants to the States for medical care of the needy aged; no insurance under Social Security.'
    n: 'See [[cal.1960-03-31.medicare]]. Names: Mills (K–J Cong. III.D).'
    tags: [name:mills-wilbur-d]
  - id: cal.1960-06-23.states-and-cities-us
    when: June 23
    date: '1960-06-23'
    thread: states-and-cities
    c: Hawaii's legislature ratifies the Twenty-third Amendment, the first State, a week after Congress proposed it. Massachusetts second, Aug. 22.
    n: House Manual (116th Cong.), [116](https://www.govinfo.gov/content/pkg/HMAN-116/html/HMAN-116-pg116.htm); [CONAN (2017), Amend. XXIII n.15](https://www.govinfo.gov/content/pkg/GPO-CONAN-2017/pdf/GPO-CONAN-2017-7.pdf#page=18). See [[cal.1960-06-14.states-and-cities]].
    tags: [state:hi, state:ma]
  - id: cal.1960-06-24.latin-america
    when: June 24
    date: '1960-06-24'
    thread: latin-america
    c: Caracas. A car bomb burns Betancourt and kills the head of his military household. Venezuela charges Trujillo's government.
    n: '[[w.rabe-eisenhower-and-latin-america]]; [[w.crassweller-trujillo]]; [[w.diederich-trujillo]]. Names: Trujillo (K–J Adm. III.J).'
    tags: [name:betancourt-romulo, name:trujillo-rafael]
  - id: cal.1960-06-25.specials
    when: June 25
    date: '1960-06-25'
    thread: specials
    c: North Carolina 12th, special. Roy A. Taylor (D) to Hall's seat, 98.6 percent.
    n: 'Shares: Wikipedia. See [[cal.1960-03-08.specials]].'
    tags: [special:1960-06-25-h-NC-12, name:taylor-roy-a]
  - id: cal.1960-06-25.governors-nc
    when: June 25
    date: '1960-06-25'
    thread: governors
    also: [elections-1960]
    c: 'North Carolina, Democratic runoff for governor: Sanford 352,133, 56.1 percent; Lake 275,905.'
    n: 'Votes: [N.C. *Manual*, 1961, p. 242](https://archive.org/details/northcarolinaman1961nort/page/n255). See [[cal.1960-05-28.governors-nc]]. Names: Sanford (K–J Cong. III.F); Lake (K–J Cong. III.K).'
    tags: [state:nc, name:sanford-terry, name:lake-i-beverly]
  - id: cal.1960-06-27.court
    when: June 27
    date: '1960-06-27'
    thread: court
    c: '*Elkins v. United States*, [364 U.S. 206](https://tile.loc.gov/storage-services/service/ll/usrep/usrep364/usrep364206/usrep364206.pdf): evidence state officers seize unlawfully not admissible in a federal court, 5–4. The "silver platter" ends.'
    n: See [[cal.1960-06-20.court]].
  - id: cal.1960-06-27.testing
    when: June 27
    date: '1960-06-27'
    thread: testing
    c: Geneva. The five Communist delegations walk out of the Ten-Nation Disarmament Committee before the American plan is tabled.
    n: '[FRUS 1958–60, III, microfiche supp., doc. 587](https://history.state.gov/historicaldocuments/frus1958-60v03mSupp/d587) (the delegation''s report). [[w.divine-eisenhower-and-the-cold]]; [[w.hitchcock-age-of-eisenhower]].'
  - id: cal.1960-06-27.states-and-cities-us
    when: June 27–29
    date: '1960-06-27'
    thread: states-and-cities
    also: [medicare]
    c: 'Governors'' Conference at Glacier National Park, Mont. Eisenhower''s recorded message, June 27. June 29: a resolution for health insurance for the aged "financed principally through" Social Security, adopted 30–13; Rockefeller and Brown for, Hollings against.'
    n: '[Remarks Recorded for the Governors Conference at Glacier National Park, Montana](https://www.presidency.ucsb.edu/documents/remarks-recorded-for-the-governors-conference-glacier-national-park-montana) (June 27, 1960). [*Proceedings of the Governors'' Conference, 1960*, 156–157](https://www.nga.org/wp-content/uploads/2026/03/1960_Annual_Meeting-compressed.pdf#page=171). [[w.david-with-dignity]]. See [[cal.1960-06-23.medicare]]. Names: Eisenhower (Opp. III.E); Rockefeller (Opp. III.H); Brown (K–J Cong. III.F).'
    tags: [name:eisenhower-dwight-d, name:rockefeller-nelson, name:brown-edmund-g, name:hollings-ernest-f]
  - id: cal.1960-06-28.specials
    when: June 28
    date: '1960-06-28'
    thread: specials
    c: North Dakota, Senate, special, for Langer's seat. Burdick (D) over Governor John E. Davis (R), 104,593 to 103,475.
    n: See [[cal.1960-03-08.specials]].
    tags: [special:1960-06-28-s-ND-1, name:burdick-quentin-n, name:davis-john-e]
  - id: cal.1960-06-28.governors-nd
    when: June 28
    date: '1960-06-28'
    thread: governors
    also: [elections-1960]
    c: 'North Dakota, governor. Republican primary: Lieutenant Governor Dahl 77.6 percent, one other 22.4. Guy the Democratic nominee unopposed.'
    n: '[*Official Abstract of Votes Cast at the Primary Election Held June 28, 1960*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06028-primary.pdf). [[w.peirce-great-plains-states-of]]. Names: Guy (K–J Cong. III.F); Dahl (K–J Cong. III.K).'
    tags: [state:nd, name:dahl-clarence-p, name:guy-william-l]
  - id: cal.1960-06-28.state-constitutions-nd
    when: June 28
    date: '1960-06-28'
    thread: state-constitutions
    also: [legislatures]
    c: North Dakota, with the primary, approves an amendment reapportioning the House, 84,002 to 66,529; also a Department of Labor, 82,114 to 79,112, and the State's mineral rights reserved in school lands sold, 84,348 to 72,088.
    n: '[*Official Abstract of Votes Cast at the Primary Election Held June 28, 1960*](https://www.sos.nd.gov/sites/default/files/documents/elections/election-results-pdfs/1960-06028-primary.pdf), statement of the Board of Canvassers. [[w.peirce-great-plains-states-of]].'
    tags: [state:nd]
  - id: cal.1960-06-29.cuba
    when: June 29
    date: '1960-06-29'
    thread: cuba
    c: Cuba seizes Texaco's refinery at Santiago. It would not refine Soviet crude; nor would Esso's or Shell's, on Washington's advice.
    n: 'FRUS 1958–60, VI, docs. [527](https://history.state.gov/historicaldocuments/frus1958-60v06/d527) (the companies at State, June 7), [532](https://history.state.gov/historicaldocuments/frus1958-60v06/d532) (special NSC meeting, June 22), [536](https://history.state.gov/historicaldocuments/frus1958-60v06/d536) (economic pressures, June 27), [537](https://history.state.gov/historicaldocuments/frus1958-60v06/d537) (Dillon to the President, June 27). Check: the advice, and whose. [[w.paterson-contesting-castro]]; [[w.bonsal-cuba-castro-and-the]]; [[w.rabe-eisenhower-and-latin-america]]; [[w.fursenko-one-hell-of-a]].'
  - id: cal.1960-06-30.congo
    when: June 30
    date: '1960-06-30'
    thread: congo
    c: 'The Congo independent, at Léopoldville. Kasavubu President, Lumumba Prime Minister. King Baudouin praises the work of Leopold II; Lumumba answers with the colonial humiliations. Murphy heads the American delegation: an embassy, 300 scholarships. Tshombe has told the consul Katanga will secede; Washington tells him to keep to the Congo.'
    n: '[Message to President Kasavubu](https://www.presidency.ucsb.edu/documents/message-president-kasavubu-the-occasion-the-independence-the-republic-the-congo) (June 30, 1960). FRUS 1958–60, XIV, docs. [103](https://history.state.gov/historicaldocuments/frus1958-60v14/d103) (to Tshombe, June 23), [105](https://history.state.gov/historicaldocuments/frus1958-60v14/d105), [106](https://history.state.gov/historicaldocuments/frus1958-60v14/d106). [[w.kalb-congo-cables]]; [[w.namikas-battleground-africa]]; [[w.weissman-american-foreign-policy-in]]; [[w.hoskyns-congo-since-independence]]; [[w.mahoney-jfk]]; [[w.devlin-chief-of-station-congo]]; [[w.witte-de-moord-op-lumumba]]; [[w.gerard-death-in-the-congo]]. Names: Lumumba, Tshombe (K–J Adm. III.J); Baudouin (K–J Cong. III.K).'
    tags: [name:lumumba-patrice, name:kasavubu-joseph, name:tshombe-moise, name:murphy-robert-d, name:eisenhower-dwight-d, name:baudouin]
  - id: cal.1960-06-30.jobs-and-wages
    when: June 30
    date: '1960-06-30'
    thread: jobs-and-wages
    c: 'House passes a minimum wage bill, H.R. 12677, [341–72](https://voteview.com/rollcall/RH0860163), after taking Kitchin''s narrower substitute, [211–203](https://voteview.com/rollcall/RH0860162): $1.15 an hour for those covered; interstate retail chains brought in at $1, without overtime.'
    n: '[[w.sundquist-politics-and-policy]].'
    tags: [name:kitchin-alvin-p]
  - id: cal.1960-06-30.jobs-and-wages-2
    when: June 30–July 1
    date: '1960-06-30'
    thread: jobs-and-wages
    c: 'Veto of the federal pay raise, H.R. 9883: "indefensible by any light"; three-quarters of a billion dollars a year. Overridden July 1: House [345–69](https://voteview.com/rollcall/RH0860165), Senate [74–24](https://voteview.com/rollcall/RS0860382).'
    n: '[Veto of a Bill To Increase the Salaries of Federal Employees](https://www.presidency.ucsb.edu/documents/veto-bill-increase-the-salaries-federal-employees) (June 30, 1960). [[w.morgan-eisenhower-versus-the-spenders]]. Names: Eisenhower (Opp. III.E).'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-06-30.economy
    when: June 30
    date: '1960-06-30'
    thread: economy
    c: 'Public Debt and Tax Rate Extension Act signed, [74 Stat. 290](https://www.govinfo.gov/content/pkg/STATUTE-74/pdf/STATUTE-74-Pg290.pdf): the debt limit raised $8 billion for fiscal 1961; the corporate rate and the excises extended a year.'
    n: '[[w.morgan-eisenhower-versus-the-spenders]]; [[w.stein-fiscal-revolution-in-america]].'
    tags: [name:eisenhower-dwight-d]
  - id: cal.1960-06.mississippi-ms
    when: June
    date: 1960-06
    thread: mississippi
    also: [antisubversion]
    c: The State Sovereignty Commission, Barnett its chairman, votes $20,000 to the Citizens' Council Forum and monthly grants to the Council; by December 1964, $193,500 of State money.
    n: 'Mississippi Department of Archives and History, [Sovereignty Commission Online, "Agency History"](https://da.mdah.ms.gov/sovcom/scagencycasehistory). Made public: the Commission''s files, unsealed by order of the federal district court, Mar. 17, 1998. [[w.katagiri-mississippi-state-sovereignty-commission]]; [[w.mcmillen-citizens-council]]; [[w.johnston-mississippis-defiant-years-1953]]. Names: Barnett (K–J Cong. III.F).'
    tags: [state:ms, name:barnett-ross-r]
