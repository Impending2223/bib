    also: [china, india-and-china-cultural-revolution]
    c: 'Mao, Hangzhou, with Chen Boda, Hu Sheng, Tian Jiaying, Ai Siqi and Guan Feng on prefaces to Marx, Engels and Lenin''s classics, the "philosophy, hard to do". Of *Hai Rui*: Qi Benyu''s article good, read three times, fault no name; Yao Wenyuan''s good, named, shook drama, history and philosophy, but missed the point, the "dismissal": the Jiajing emperor dismissed Hai Rui, in 1959 we dismissed Peng Dehuai, who is a Hai Rui. Of the *Qing gong mishi* film: not patriotic, but national betrayal. One basic law only: contradiction.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 21, 1965. [[w.macfarquhar-maos-last-revolution]], 29 (Qi Benyu''s article read three times); [[w.jianguo-yilai-mao-zedong]], XVIII, 185–186 (Dec. 21, 1965; note 1: the talk of Dec. 21 at Hangzhou with Chen Boda, Hu Sheng, Tian Jiaying, Ai Siqi and Guan Feng, of which the Wengao prints the part on school education, from *Mao zhuxi lun jiaoyu geming*, Renmin Chubanshe, Dec. 1967); [[w.macfarquhar-origins-of-the-cultural]], III, 440–41, 453 (Mao to Chen Boda, Tian Jiaying, Hu Sheng, Guan Feng and Ai Siqi: the play''s point is dismissal; Peng Dehuai is Hai Rui); [[w.mao-zedong-zhuan]], VI, ch. 74 (Dec. 21 at Hangzhou with Chen Boda, Hu Sheng, Tian Jiaying, Ai Siqi and Guan Feng on Marxist theory, philosophy and education; Mao on Qi Benyu''s article (good, read thrice, unnamed) and Yao Wenyuan''s (good, names, shook the stage, history and philosophy, but not the heart of it, the dismissal) (n.24)). [[w.yang-jisheng-tiandi-fanfu]], I, 119 (Mao: *Qinggong mishi* not patriotic but traitorous; Qi Benyu''s article very good, read three times, but naming no one; Yao''s good but missing the vital point, the "dismissal": Jiajing dismissed Hai Rui, in 1959 we dismissed Peng Dehuai; Peng Dehuai is a "Hai Rui"); [[w.peng-zhen-nianpu-1902]], IV, 455–456 (Dec. 21, 1965; Hangzhou; Mao to Chen Boda, Hu Sheng, Tian Jiaying, Ai Siqi 艾思奇 and Guan Feng 关锋 (of the *Hongqi* editorial board, the editors'' note): Qi Benyu''s article failed to name names; Yao Wenyuan named Wu Han and shook drama, history and philosophy but missed the vital point, the dismissal: the Jiajing emperor dismissed Hai Rui, we dismissed Peng Dehuai in 1959; Peng Dehuai too is Hai Rui); [[w.jian-zhou-enlai]], 530 (Mao at Hangzhou: "the crux of ''Hai Rui Dismissed from Office'' was the question of dismissal. Emperor Jiajing dismissed Hai Rui, and in 1959 we dismissed Peng Dehuai. Peng Dehuai is Hai Rui"). Made public: 1984 ([[w.mengbi-zhongguo-gongchan-dang-liushi]]). Check: the remarks on education were printed earlier, in *Mao zhuxi lun jiaoyu geming* (Renmin Chubanshe, Dec. 1967), the Wengao''s source for them ([[w.jianguo-yilai-mao-zedong]], XVIII, 186 n.1); the entry gives 2006 for the talk. Check: the 2006 above is the entry''s former year; Made public now rests on [[w.mengbi-zhongguo-gongchan-dang-liushi]] (1984). Check: the book has the Hangzhou talks on Dec. 21–22 (III, 453). To check: [[w.xin-ban-guangming-ribao-shinian]], 245–247 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.64); [[w.jin-1949-1989-niande-zhongguo]], 613 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 440 n.70); [[w.xinli-xunshi-dajiang-nanbeide-mao]], 436 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 453 n.129); [[w.mengbi-zhongguo-gongchan-dang-liushi]], 561 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 453 n.130a); Mao Zedong 毛泽东, talk with Chen Boda 陈伯达, Hu Sheng 胡绳, Tian Jiaying 田家英, Ai Siqi 艾思奇 and Guan Feng 关锋, Dec. 21, 1965 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.24). Names: Mao Zedong, Chen Boda, Peng Dehuai, Hu Sheng, Tian Jiaying, Ai Siqi, Guan Feng, Qi Benyu, Yao Wenyuan.'
