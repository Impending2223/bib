    c: 'Valenti to Johnson, 7:15 p.m., Top Secret, Eyes Only, after the meeting with Ball, Bundy and Moyers: he sides with Ball for the pause. "We are in quicksand"; bombing only hardens Hanoi; a pause gives the Russians room (Thompson: relief in Moscow); fighting in the South goes on; the bombing can be resumed; the Republicans and hard-liners will urge a Haiphong blockade. Johnson questions him over an hour on how firm he is.'
