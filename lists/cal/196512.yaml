    n: '[[w.staaveren-gradual-failure]], 211. To check: [*New York Times*, Dec. 2, 1965](https://timesmachine.nytimes.com/timesmachine/1965/12/02/issue.html) (cited by [[w.staaveren-gradual-failure]], 211 n.20). See [[cal.1965-09-10.vietnam-air-war-2]].'
