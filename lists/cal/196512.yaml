        - 'w.branch-at-canaans-edge 390–91: A-E'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola, name:johnson-frank-m-jr]
  - id: cal.1965-12-03.mississippi
    when: Dec. 3
    date: '1965-12-03'
    thread: mississippi
    c: 'Natchez. Mayor John Nosser announces the agreement made Nov. 29 by Charles Evers and the NAACP''s committee with the city and twenty-three merchants: six Negro policemen, the city''s facilities and its schools desegregated, a Negro on the school board, Negro clerks in the twenty-three stores. The boycott ended.'
    n: '[[w.dittmer-local-people]], 360–61; [[w.branch-at-canaans-edge]], 350 (the agreement). To check: [*New York Times*, Dec. 4, 1965](https://timesmachine.nytimes.com/timesmachine/1965/12/04/issue.html) (cited by [[w.dittmer-local-people]], 361 n.52). See [[cal.1965-08-27.mississippi]]. Names: Charles Evers, Nosser.'
    src:
