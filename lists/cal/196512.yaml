  - id: cal.1965-12-20.vietnam-operations
    when: Dec. 20
    date: '1965-12-20'
    thread: vietnam-operations
    c: 'Harvest Moon ends, the allied forces back in their enclaves; the Marine battalions out of the area the day before. Counted: 407 of the enemy killed, 33 captured, 95 individual and 13 crew-served weapons. Marines: 45 killed, 218 wounded. South Vietnamese: 90 killed, 91 missing, 141 wounded.'
    n: '[[w.shulimson-u-s-marines-in]], 109. See [[cal.1965-12-08.vietnam-operations]].'
    tags: [province:quang-tin]
