    c: 'Deng Xiaoping 邓小平 calls the persons concerned to a meeting and hears Yu Qiuli 余秋里 and others on the development of the iron and steel industry in the Southwest. Deng: industry still takes steel as the key link; by the end of the Third Plan steel in the Southwest and Northwest should reach 5 million tons, with another 5 million from the second line, so that war would not matter; raising the quality of all industry needs a base of quantity; the Kunming 昆明 works can hand over ordinary machine-tool output and concentrate on precision tools; in the Third Plan power stations must be built with steel output and users'' needs in mind, not many scattered points.'
