    also: [china]
    c: 'Deng Xiaoping 邓小平 meets Sanmugathasan 桑穆加塔桑, member of the Politburo 政治局 and secretary of the Secretariat 书记处 of the Ceylon Communist Party''s Central Committee 中央. Deng: to make a party mature and tied to the masses is not easy; the Chinese party, founded in 1921, became mature only at the Seventh Congress of 1945, after twenty-four years; as to the central leadership, the Zunyi Conference of Jan. 1935 set up the leadership with Mao at its core and it matured, which took thirteen years; maturity is first of ideas, Mao Zedong 毛泽东 Thought joining Marxism–Leninism to the concrete practice of the Chinese revolution, grasped by cadres and members; politically, after Zunyi, though there were wrong lines in the party Mao always overcame them by the right line; in the war the party grew from 30,000 to over 1.2 million, the army from 30,000 to a million, the liberated areas to over 100 million people; organizationally, the principle of high democracy joined with high centralism; the key question of a country''s revolution is the party; a small party with fighting power is far better than a large one without.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1888–1889 (Dec. 27, 1965). The words: 下午 (III, 1888–1889). Made public: 1989, in part ([[w.xiaoping-deng-xiaoping-wenxuan-1938]], as the second part of "Build a mature, fighting party" 《建设一个成熟的有战斗力的党》); in full 2009 (the nianpu). To check: [[w.xiaoping-deng-xiaoping-wenxuan-1938]] ("Build a mature, fighting party"). Names: Deng Xiaoping, Mao Zedong.'
