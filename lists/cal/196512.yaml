  - id: cal.1965-12.china-leadership-8
    when: Dec., early
    date: 1965-12
    at: before 1965-12-01
    place: kunming
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping 邓小平 hears the leaders of the Secretariat 书记处 of the Yunnan provincial Party committee. Deng: the frontier farms of Yunnan have only 100,000 people, too few; farms are to join labor and arms, army and division above, production teams below; their people come from demobilized soldiers of the Kunming 昆明 forces, from other provinces, from drawing in local villages, and from drawing in local minority activists, the last two voluntary; the farm must take the lead and help locally, being at once production team, fighting team and propaganda team, and bring up local production, culture and health; first it must have its own food, then other things; cash crops are of great value; Yunnan now produces only 300 tons of rubber a year, it must reach 50,000 tons; farms need not be publicly owned but may be collective, with team accounting and work points, so the state saves expense.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1885 (Dec. 1965). The words: 12月初 (III, 1885). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: the place: the nianpu gives the hearing without a place; the tour had reached Kunming on Dec. 3.'
