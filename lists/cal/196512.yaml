  - id: cal.1965-12-28.china
    when: Dec. 28
    date: '1965-12-28'
    thread: china
    also: [laos]
    c: The Foreign Ministry's statement condemns the U.S. war threat against Cambodia. By authorizing U.S. forces in South Vietnam to go into Cambodia in "pursuit", the statement says, the U.S. is signalling that it will carry the Vietnam war to Cambodia. Cambodia and Prince Sihanouk have declared they will answer any attack with their own military means and have asked the Soviet Union and Britain, co-chairmen of the 1954 Geneva Conference, and its participants to state their stand. China firmly backs Cambodia's stand and demand, and if the U.S. attacks Cambodia the Chinese people will give full support to its anti-U.S. struggle.
    n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 75–76 (Dec. 28, 1965).'
