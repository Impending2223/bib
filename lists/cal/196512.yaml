  - id: cal.1965-12-27.economy
    when: Dec. 27
    date: '1965-12-27'
    thread: economy
    also: [vietnam]
    c: 'Schultze to Johnson, "1967 Budgetary and Fiscal Policy": put $10 billion for the war in the fiscal 1967 budget, not the $16 to $18 billion expected, on the assumption that it ends by June 30, 1967; then, if the fighting goes on, $6 to $8 billion more in a supplemental in May or June, with an income tax increase of about $5 billion tied to it and not to the Great Society. Ackley the same day: a "significant tax increase" needed, though tactically perhaps only later in the year.'
    n: '[[w.gibbons-u-s-government-and]], IV, 215–17. To check: [[w.bernstein-guns-or-butter]]; Schultze to Johnson, Dec. 27, 1965 (LBJ Library, C.F. FI4); Ackley to Johnson, Dec. 17, 1965 (LBJ Library, Ex/FI4), and Dec. 27, 1965 (LBJ Library, C.F. FI4) (cited by [[w.gibbons-u-s-government-and]], IV, 215 n.5). Check: whether Schultze''s memorandum states the assumption; Gibbons gives it as the budget''s (IV, 217, 222), and Ackley''s words without saying which memorandum holds them. Names: Schultze, Johnson, Ackley.'
