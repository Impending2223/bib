  - id: cal.1965-12-01.china-leadership
    when: Dec. 1
    date: '1965-12-01'
    place: hangzhou
    thread: china-leadership
    also: [china]
    c: Lin Biao sends Ye Qun to Mao at Hangzhou with his letter of Nov. 30 and ten items of material against Luo Ruiqing.
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 1, 1965. [[w.macfarquhar-maos-last-revolution]], 22–23 (Ye Qun carries the dossier and Lin''s cover note); [[w.macfarquhar-origins-of-the-cultural]], III, 449 (Lin Biao sends Ye Qun to Hangzhou to make his charges against Luo Ruiqing; she spends some seven hours alone with Mao); [[w.mao-zedong-zhuan]], VI, ch. 74 (Nov. 30 Lin Biao sends Ye Qun by special plane to Hangzhou with his letter and eleven items of material against Luo Ruiqing; she reports to Mao alone for several hours; Mao''s comment of Dec. 2 on the Lanzhou army report (n.20)). [[w.jian-zhou-enlai]], 531 (Ye Qun flies to Hangzhou "the same day" as Lin''s letter, Nov. 30, for a "briefing" of five hours). Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]). To check: [[w.yao-san-ci-da-nan]], 276 (cited by [[w.macfarquhar-maos-last-revolution]], 23 n.37); [[w.nianyi-da-dongluande-niandai-revised]], 85–86 (cited by [[w.macfarquhar-maos-last-revolution]], 23 n.39); [[w.jin-1949-1989-niande-zhongguo]], 632–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 449 n.112a); [[w.zhisui-private-life-of-chairman]], 435–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 449 n.112b); [[w.yao-san-ci-danan-buside]], 282 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 449 n.112c); Mao Zedong 毛泽东, comment on the Lanzhou Military Region Party committee''s 兰州军区党委 report on putting politics first in the emergency war preparation of the 55th Division (manuscript 手稿), Dec. 2, 1965 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.20); [[w.zhang-yaoci-huiyi-mao-zedong]], 30–31 (cited by [[w.jian-zhou-enlai]], 531 n.53). Names: Lin Biao, Ye Qun, Luo Ruiqing, Mao Zedong.'
    src:
      c: e1fff4fe
      rows:
        - 'w.zedong-mao-zedong-nianpu V, Dec. 1, 1965: all'
        - 'w.macfarquhar-maos-last-revolution 22–23: A'
        - 'w.macfarquhar-origins-of-the-cultural III, 449: A'
        - 'via w.macfarquhar-origins-of-the-cultural III, 449 n.112a: A'
        - 'via w.macfarquhar-origins-of-the-cultural III, 449 n.112b: A'
        - 'via w.macfarquhar-origins-of-the-cultural III, 449 n.112c: A'
        - 'w.mao-zedong-zhuan VI, ch. 74: ?'
        - 'w.jian-zhou-enlai 531: ?'
    tags: [name:lin-biao, name:ye-qun, name:luo-ruiqing, name:mao-zedong, polity:prc, vis:only:prc]
