    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 14, 1965. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 630 (Dec. 15, 1965; Liu writes to Mao proposing to issue "On the Ten Major Relationships": he has read it again and thinks it speaks well on some basic problems and still guides present work; he suggests it be issued as an internal document to the Party committees of counties and regiments and above for study, to which Mao agreed when Liu saw him the day before, and asks Mao to look at it once more and hand it to Deng Xiaoping and Peng Zhen; with Mao''s consent it is issued Dec. 27); [[w.jianguo-yilai-mao-zedong]], XVIII, 183–184 (Dec. 18, 1965; Mao''s note of Dec. 18 to Deng Xiaoping and Peng Zhen: handle it as Shaoqi suggests; "I read it and am not quite satisfied; send it down to ask opinions, to help later revision; put this in the Center''s comment"; note 1: Liu''s letter of Dec. 15 proposes it as an internal paper to Party committees of counties and regiments and up, Mao having agreed the day before; note 3: the Center''s comment of Dec. 27 sends it down for opinions). Made public: 1996. To check: "On the Ten Great Relationships" (named by [[w.zedong-mao-zedong-nianpu]], V, Dec. 14, 1965); Liu Shaoqi, letter to Mao Zedong of Dec. 15, 1965 proposing to issue "On the Ten Great Relationships" (April 1956) as an internal paper to Party committees of counties and regiments and above (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 183 n.1); Central Committee, comment of Dec. 27, 1965 issuing Mao''s "On the Ten Great Relationships" to Party committees of counties and regiments and above, for opinions toward later revision (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 184 n.3). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
