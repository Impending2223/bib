    date: 1965-12
    thread: vietnam
    c: 'The year''s American dead in Southeast Asia, by the Defense Department''s file: 1,928, 1,486 of hostile causes; 2,335 since 1961. As printed in 1967: 1,369 battle deaths. Forces in South Vietnam, Dec. 31: 184,300.'
    n: '[NARA, Defense Casualty Analysis System, Vietnam Conflict Extract Data File, as of Apr. 29, 2008](https://catalog.archives.gov/id/2240992); [*Statistical Abstract of the United States, 1967*](https://www.census.gov/library/publications/1967/compendia/statab/88ed.html), table 372, p. 264; [*Selected Manpower Statistics*, FY-74](https://archive.org/details/DTIC_ADA043053), p. 63. See [[cal.1964-12.vietnam]].'
    tags: [wardead:1965]
  - id: cal.1965-12.oil
    when: Dec.
    date: 1965-12
    thread: oil
    c: 'The world''s crude oil output in 1965, as the Bureau of Mines first counted it: 30.3 million barrels a day. The United States 7.80, the Soviet Union 4.89, Venezuela 3.47, Kuwait 2.17, Saudi Arabia 2.02. Libya 1.22.'
    n: Bureau of Mines, [*Minerals Yearbook 1965*, II, Table 74, pp. 454–455](https://archive.org/details/pub_usgov-minerals-yearbook_1965_2/page/n529) (1967). See [[cal.1960-12.oil]].
