  - id: cal.1965-12-01.china-leadership-4
    when: Dec. 1
    date: '1965-12-01'
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping 邓小平 goes by car to Dukou 渡口 (Panzhihua 攀枝花), inspecting a zinc mine on the way; at Dukou he inspects the Lanjian iron mine and the Nongnongping plant site. On behalf of the Central Committee 中央 he approves the plan for building the Panzhihua iron and steel base. Hearing Xu Chi 徐驰 and An Yiwen 安以文 of the city''s leaders he says: the alliance of coal and steel has coal at its center; Panzhihua is a place specially favored; to build a plant at Nongnongping is wholly ideal.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1884–1885 (Dec. 1, 1965). The words: 上午 (III, 1884–1885). Made public: 2009 (the nianpu). Names: Deng Xiaoping.'
    src:
      c: 583b6a04
      rows:
