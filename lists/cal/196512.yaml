  - id: cal.1965-12-24.vietnam
    when: Dec. 24–25
    date: '1965-12-24'
    thread: vietnam-pause
    c: 'The Christmas truce, announced by Saigon and Washington Dec. 23: 6 p.m. Dec. 24 to midnight Dec. 25, Saigon time. No bombing of the North; B-52 strikes halted; the truce to end only on renewed Viet Cong attack.'
