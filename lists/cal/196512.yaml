    also: [states-and-cities, legislatures, electoral-college]
    c: 'The year''s applications to Congress for a convention on the apportionment of State legislatures: twenty-three legislatures, fourteen for the first time, Alabama, Arizona, Florida, Georgia, Kentucky, Louisiana, Maryland, Minnesota, Mississippi, Nebraska, New Hampshire, North Carolina, Tennessee and Utah. Twenty-seven States since 1963; thirty-four needed. On the electoral college, Nebraska and Oklahoma; on tax sharing, Illinois and Ohio.'
    n: 'Tennessee''s application (H.J.R. 34, adopted Feb. 23, 1965), laid before the Senate Jan. 14, 1966: [112 Cong. Rec. 199–200](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-4-1.pdf#page=9). As the Article V Library lists them: [apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0), [presidential electors](http://article5library.org/analyze.php?topic=Presidential+electors&res=1&gen=0&ylimit=0), [revenue sharing](http://article5library.org/analyze.php?topic=Revenue+sharing&res=1&gen=0&ylimit=0) (Check each against the Record; Georgia''s in its session laws only). To check: [[w.bonfield-dirksen-amendment-and-the]]. See [[cal.1964-12.amendments]]; [[cal.1965-08-04.court]]; [[cal.1965-08-02.state-and-city-finance-us]].'
    src:
      c: 25726aef
      rows:
        - 'http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0: all'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-4-1.pdf#page=9: A'
    tags: [state:al, state:az, state:fl, state:ga, state:ky, state:la, state:md, state:mn, state:ms, state:ne, state:nh, state:nc, state:tn, state:ut, state:ok, state:il, state:oh]
  - id: cal.1965-12.vietnam
