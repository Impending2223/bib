  - id: cal.1965-12-02.vietnam-air-war
    when: Dec. 2
    date: '1965-12-02'
    thread: vietnam-air-war
    c: 'The CIA''s Board of National Estimates, the second of two assessments McNamara asked: heavier bombing alone will neither make Hanoi quit nor stop infiltration; Hanoi ready for a long war. The first, late November: oil strikes "a conspicuous change in the ground rules," likely not to alter Hanoi''s policy, many civilian casualties.'
    n: '[[w.drea-mcnamara-clifford-and-the-2011]], 69–70. Names: McNamara.'
