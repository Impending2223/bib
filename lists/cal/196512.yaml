  - id: cal.1965-12-08.vietnam-operations
    when: Dec. 8–9
    date: '1965-12-08'
    thread: vietnam-operations
    c: Harvest Moon, the Marines' and the South Vietnamese 2d Division's operation in the Quế Sơn valley against the 1st Viet Cong Regiment. The 11th Ranger Battalion ambushed on the Thăng Bình–Hiệp Đức road, the afternoon of Dec. 8; the 5th Regiment's command group and 1st Battalion overrun the next morning, the regimental commander killed. Marines of Task Force Delta landed by helicopter from 10 a.m., Dec. 9, behind the enemy.
    n: '[[w.shulimson-u-s-marines-in]], 98–104; [[w.vietnam-victory-in-vietnam]], 160 (the 5th Regimental Task Force beaten off at Đồng Dương).'
