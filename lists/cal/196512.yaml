    when: Dec. 5
    date: '1965-12-05'
    thread: robert-kennedy
    also: [latin-america]
    c: 'Robert Kennedy on *Meet the Press*, back from South America: the impression there that "business determines the internal policy of the United States"; to associate only with the forces "against subversion and against Communism" self-defeating, "catastrophic."'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 699–700. To check: *Meet the Press*, Dec. 5, 1965 (cited by [[w.schlesinger-robert-kennedy-and-his]], 700 n.44). See [[cal.1965-11-10.robert-kennedy]]. Names: Robert Kennedy.'
