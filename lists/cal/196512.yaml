      rows:
        - 'w.gibbons-u-s-government-and IV, 216: all'
        - 'via w.gibbons-u-s-government-and IV, 216 n.9: all'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:mcnamara-robert-s]
  - id: cal.1965-12-03.vietnam-pause
    when: Dec. 3
    date: '1965-12-03'
    thread: vietnam-pause
    also: [vietnam-force-levels]
    c: 'Two meetings, Rusk, McNamara, McGeorge Bundy, Ball, William Bundy, U. Alexis Johnson, Vance in the afternoon. Johnson, by Bundy, wants a full package: Phase II, a pause, diplomacy, Congress consulted, perhaps a resolution. McNamara: "Do we want a war with China?"; "You can''t stop 200 tons [of infiltrated supplies] a day by bombing." Bundy to Johnson: deployments of some 15,000 a month accepted for planning, as "undramatic as possible"; "The open question is the pause."'
    n: '[FRUS 1964–68, III, doc. 214](https://history.state.gov/historicaldocuments/frus1964-68v03/d214) (Bundy''s telegram). [[w.gibbons-u-s-government-and]], IV, 116–17 (the meetings, by Bundy''s notes). To check: McGeorge Bundy, notes of the meeting of Dec. 3, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.12). Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-02.vietnam-pause]]. Check: Rusk''s Appointment Book gives the meetings 12:30 to about 3 p.m. and 6:03 to 7:52 p.m., William Bundy at neither (FRUS 1964–68, III, doc. 214 n.2). Check: Gibbons cites the 200 tons to the memorandum to the Ranch (IV, 117 n.14, "Ibid."); FRUS''s text of it does not have it. Names: Rusk, McNamara, McGeorge Bundy, Ball, William Bundy, U. Alexis Johnson, Vance, Johnson.'
    src:
      c: cfde2d51
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d214: E-F'
        - 'w.gibbons-u-s-government-and IV, 116–17: all'
        - 'via w.gibbons-u-s-government-and IV, 116 n.12: A-C'
        - 'via w.gibbons-u-s-government-and IV, 116 n.13: A'
        - 'via w.gibbons-u-s-government-and IV, 117 n.14: D'
        - 'via w.gibbons-u-s-government-and IV, 117 n.15: E-F'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:ball-george-w, name:bundy-william, name:johnson-u-alexis, name:vance-cyrus, name:johnson-lyndon-b]
