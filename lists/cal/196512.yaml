  - id: cal.1965-12-05.china-leadership-8
    when: Dec. 5
    date: '1965-12-05'
    time: 1965-12-05T09:30Z
    place: peking
    thread: china-leadership
    also: [vietnam-hanoi, vietnam, laos]
    c: Zhou Enlai, with Xie Fuzhi, Fang Yi, Han Nianlong and Li Qiang present, tells Lê Thanh Nghị, per the Chinese record, that after McNamara's trip to Saigon he expects the U.S. to build up in the South, to 220,000 men by year's end and 300,000 by mid-1966, then to cut the Ho Chi Minh Trail in Laos, patrol the coast, bomb three lines of communication and then Haiphong and Hanoi, blockade the Gulf of Tonkin and close the Cambodian border, with half a year of preparation. He asks that supply of the South come first, the Trail, the sea route and China's rail lines be kept open, Laos and Cambodia be given more weight, and the Soviet Union be asked to risk shipping; he tells of Kaysone's holding off, pending his Central Committee, on Soviet proposals for a five-party conference and a TASS correspondent. Lê says the Politburo is discussing the same and a record will go to Hanoi next day.
    n: '"[Record of Premier Zhou Enlai''s Conversation with Vietnamese Deputy Prime Minister Le Thanh Nghi](https://digitalarchive.umd.edu/document/176595)" (Dec. 5, 1965), PRC FMA 106-01484-01, trans. Stephen Mercado, Wilson Center Digital Archive. The words: "5:30 – 7:00 p.m." (the record); the talk is the second of the week, Zhou speaking of "last time" and "Wednesday". See [[cal.1965-11-29.china-leadership]]; [[cal.1965-12-04.china-leadership]]. Names: Zhou Enlai, Xie Fuzhi, McNamara, Kaysone. Check: the year the Archive posted it.'
