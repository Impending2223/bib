  - id: cal.1965-12-02.vietnam-pause-2
    when: Dec. 2
    date: '1965-12-02'
    time: 1965-12-02T18:15Z
    thread: vietnam-pause
    c: 'Johnson and McNamara by telephone, recorded, Johnson at the Ranch. McNamara: since Saigon "more and more convinced that we ought definitely to think of some action other than military action as the only program"; raise the budgets and the deployments to meet Westmoreland, but "if we do that by itself, it''s suicide."'
    n: '[[w.mcnamara-in-retrospect]], ch. 8 at n.24 (Tape 6512.01, PNO 5). [[w.drea-mcnamara-clifford-and-the-2011]], 66 ("further and further escalation, higher and higher risks"). To check: [Conversation with Robert McNamara, Dec. 2, 1965, 12:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-december-2-1965), Conversation WH6512-01-9305 (Miller Center). Check: McNamara has the call "on the afternoon"; the catalogue gives 12:15 p.m. See [[cal.1965-11-30.vietnam]]. Names: Johnson, McNamara, Westmoreland.'
    src:
      c: 09a432d6
      rows:
        - 'w.mcnamara-in-retrospect ch. 8 at n.24: ?'
        - 'via x.1965-12-02.johnson-and-mcnamara-recording-12-15-p-m: all'
        - 'w.drea-mcnamara-clifford-and-the-2011 66: B'
    tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:westmoreland-william]
