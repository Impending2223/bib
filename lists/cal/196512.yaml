    n: '[[w.branch-at-canaans-edge]], 438–39. To check: Life with Lyndon in the Great Society, Vol. 1, No. 44, Dec. 2, 1965, JMP (cited by [[w.branch-at-canaans-edge]], 438); Jack O''Dell to Jack Minnis, Dec. 8, 1965, JMP (cited by [[w.branch-at-canaans-edge]], 438). Names: Johnson.'
