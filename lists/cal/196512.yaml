    tags: [name:goldberg-arthur-j, name:johnson-lyndon-b, name:rusk-dean, name:ball-george-w]
  - id: cal.1965-12-05.economy
    when: Dec. 5–6
    date: '1965-12-05'
    thread: economy
    c: 'The Federal Reserve announces, Sunday, Dec. 5: the discount rate at New York and Chicago from 4 to 4½ percent, effective Dec. 6; the ceiling on time deposits of 30 days or more to 5½ percent. The Board acted Friday, Dec. 3, 4–3, Robertson, Mitchell, and Maisel dissenting. Johnson, from Austin, the same day: the Board "an independent agency"; he regrets an action taken "before January when we will have before us the full facts on next year''s budget, Viet-Nam costs." Dec. 6, the Quadriad at the Ranch, Martin with Fowler and Ackley. The other ten Reserve Banks follow, Dec. 8–13; the banks'' prime rate to 5 percent from Dec. 6. Dec. 13, the Board before the Joint Economic Committee.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697401) (Dec. 5, 1965). [*Federal Reserve Bulletin*, Dec. 1965](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1965-21372), pp. 1667–68, 1751; Jan. 1966, p. 53. Statement by the President on the Raising of the Discount Rate by the Federal Reserve Board, [1965 Pub. Papers 1137](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=611) (Dec. 5, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 1138](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=612) (Dec. 6, 1965). To check: [[w.kettl-leadership-at-the-fed]]; [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1964-11-23.economy]]. Names: Robertson, Mitchell, Maisel, Martin, Fowler, Ackley, Johnson.'
    tags: [name:martin-william-mcchesney-jr, name:robertson-j-l, name:mitchell-george-w, name:maisel-sherman-j, name:johnson-lyndon-b, name:fowler-henry-h, name:ackley-gardner]
  - id: cal.1965-12-05.opinion
    when: Dec. 5
    date: '1965-12-05'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 18–23: Republicans'' best candidate for 1968: Nixon 34, Goldwater 13, Lodge 12, Romney 11, Scranton 5, Dirksen 5, Rockefeller 4, Lindsay 4. Independents: Nixon 17, Lodge 15, Goldwater 12, Romney 11, Lindsay 9, Scranton 9.'
    n: '[[w.gallup-poll]], III, 1974. Names: Lodge, Dirksen, Nixon, Goldwater, Lindsay, Romney, Scranton, Rockefeller.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:romney-george-w, name:scranton-william-w, name:dirksen-everett, name:rockefeller-nelson, name:lindsay-john-v]
