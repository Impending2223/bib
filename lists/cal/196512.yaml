        - 'via x.1965-12-08.jack-odell-to-jack-minnis-dec: all'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-12-02.laos
    when: Dec. 2–5
    date: '1965-12-02'
    thread: laos
    c: Sixteen F-105s on Phou Kout, Dec. 2 and the two days after. The neutralists will not move; Dec. 5 Souvanna Phouma goes to Muong Soui to stir them, and asks Swank for three more days of sixteen F-105 strikes.
    n: '[[w.anthony-war-in-northern-laos]], 186. To check: JCS to Dir/NSA, 021218Z Dec. 65 (cited by [[w.anthony-war-in-northern-laos]], 186 n.59a); AIRA Vientiane to COMUSMACV, 061310Z Dec. 65 (cited by [[w.anthony-war-in-northern-laos]], 186 n.59b). See [[cal.1965-11-16.laos]]. Names: Souvanna Phouma, Swank.'
