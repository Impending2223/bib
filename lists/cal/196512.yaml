    c: 'The Christmas truce, announced by Saigon and Washington Dec. 23: 6 p.m. Dec. 24 to midnight Dec. 25, Saigon time. No bombing of the North; B-52 strikes halted; the truce to end only on renewed Viet Cong attack.'
    n: '[FRUS 1964–68, III, doc. 242](https://history.state.gov/historicaldocuments/frus1964-68v03/d242) (editorial note). [[w.frankum-like-rolling-thunder]], 33–34 (the bombing of the North stopped from Dec. 24); [[w.drea-mcnamara-clifford-and-the-2011]], 66 (the 30-hour truce from 6 p.m. Dec. 24; Vance''s order of Dec. 24 against renewed operations); [[w.cosmas-joint-chiefs-of-staff-2012]], 391–94 (the hours; the orders; the extension); [[w.staaveren-u-s-air-force]], 102–03 (the halt from 6 p.m. Dec. 24, thirty hours; the bombing halt); [[w.johnson-vantage-point]], 237 (the thirty-hour truce, the bombing of the North halted); [[w.dallek-flawed-giant]], 343–46 (the making of the pause; the thirty-hour truce, air and ground action suspended, 344); [[w.gibbons-u-s-government-and]], IV, 113–70, 125 (the pause and its making; the truce announced, 125); [[w.herring-lbj-and-vietnam]], 100 (a brief holiday truce, agreed before Johnson left for the Ranch); [[w.mcnamara-in-retrospect]], ch. 8 (the thirty-hour ceasefire from Christmas Eve, the bombing of the North halted). [[w.berman-lyndon-johnsons-war]], 12 (the pause, 37 days, pressed by McNamara); [[w.zaroulis-who-spoke-up]], 66 (a thirty-hour truce including a pause in the bombing of the North; the page has the Administration announce it on Christmas Day); [[w.mann-grand-delusion]], 476 (6 p.m. Dec. 24: Johnson halts the bombing; U.S. forces not to fire except in self-defense until midnight the next day; Mann has the pause run on into January; not the announcement of Dec. 23, Saigon time, the B-52s or the Viet Cong clause). Check: McNamara has the White House and Saigon announce the ceasefire Dec. 22 (ch. 8). The time is the first day''s. To check: [[w.herring-secret-diplomacy-of-the]]; [[w.thies-when-governments-collide]]; [[w.search-for-peace-in]]; [[w.cooper-lost-crusade]]; JCS 9332 to CINCPAC (from the Deputy Secretary of Defense), Dec. 25, 1965, SecDef Subject Decimal files, Acc 70A-1265 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 66 n.55); William Bundy''s manuscript history, chap. 33, 31–32, 35–38, LBJ Library (cited by [[w.dallek-flawed-giant]], 344). See [[cal.1965-05-12.vietnam]]; [[cal.1965-11-28.vietnam]]; [[cal.1965-12-17.vietnam]]. Check: Dallek (344) and Gibbons (IV, 125) have the truce announced Dec. 22; FRUS''s editorial note and Cosmas (393) give that day''s instruction to announce it in Saigon.'
