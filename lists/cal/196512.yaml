        - 'via w.schlesinger-robert-kennedy-and-his 700 n.44: all'
    tags: [name:kennedy-robert-f]
  - id: cal.1965-12-06.laos
    when: Dec. 6
    date: '1965-12-06'
    thread: laos
    also: [vietnam]
    c: 'Tiger Hound: the eastern Laotian panhandle, from the 17th parallel to Cambodia, taken from Steel Tiger at Westmoreland''s request for MACV''s 2d Air Division. Armed reconnaissance on the roads without prior approval; American forward air controllers in O-1s; a C-130 command post with Lao officers aboard. Villages struck only with the embassy''s approval. Check the day.'
    n: '[FRUS 1964–68, XXVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v28/d216) (Sullivan, Jan. 3, 1966: "established at my suggestion"); [doc. 203](https://history.state.gov/historicaldocuments/frus1964-68v28/d203) (Nov. 8). [[w.frankum-like-rolling-thunder]], 118–20 (the operation, Dec. 6; the roads without prior approval; the forward air controllers; the villages); [[w.staaveren-u-s-air-force]], 100–101 (the forward air controllers; the C-130 with Lao officers; the first missions Dec. 5, the spraying from Dec. 6). See [[cal.1965-04-03.laos]]. Names: Westmoreland, Sullivan. Check: Frankum, 118, has Sullivan strongly against the division. Check: Staaveren, 100, has the first Tiger Hound missions flown Dec. 5.'
    src:
      c: 6083e247
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d216: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d203: all'
