  - id: cal.1965-12-17.vietnam
    when: Dec. 17–21
    date: '1965-12-17'
    time: 1965-12-17T14:41Z
    thread: vietnam-pause
    c: 'Johnson''s meetings of Dec. 17, 18, and 21 on a pause in the bombing: Rusk and McNamara for, Wheeler and Westmoreland against. Dec. 17, 9:41 to 11:04 a.m., with McGeorge Bundy and Ball, Valenti taking notes. Johnson: "I''m willing to take any gamble on stopping the bombing if I think I''ve got some hope of something happening." McNamara: "We will increase bombing. It is inevitable," and perhaps "a cease-fire in place." Bundy, of a cease-fire: "Not now. It takes time." Ball: the bombing hardens Hanoi and drives it toward China. Johnson: the Chiefs "go through the roof when we mention this pause"; "the weakest chink in our armor is public opinion." A pause suggested, Dec. 22 to Jan. 22.'
    n: 'FRUS 1964–68, III, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v03/d231) (Valenti''s notes of Dec. 17), [235](https://history.state.gov/historicaldocuments/frus1964-68v03/d235), [238](https://history.state.gov/historicaldocuments/frus1964-68v03/d238). [[w.johnson-vantage-point]], 235–37 (the meeting of Dec. 18); [[w.drea-mcnamara-clifford-and-the-2011]], 66 (the morning meeting, no Chief there; "the Chiefs go through the roof"; late afternoon, Johnson with Wheeler on the scenario. Dec. 18, the truce extended several days; Wheeler leaves for the Far East). Bibliography: [[cal.1965-12-24.vietnam]]. [[w.gibbons-u-s-government-and]], IV, 120–25; [[w.herring-lbj-and-vietnam]], 42, 96, 99–100 (the meetings: Johnson, "the Chiefs go through the roof when we mention this pause"; McNamara, "we decide what we want and impose it on them"; Rusk and Bundy won over; Dec. 18, "Publicity seekers and amateurs cannot have a hand in our affairs"). Made public: FRUS 1964–68, III (1996). [[w.preston-war-council]], 225 (Bundy against McNamara''s cease-fire, "Not now. It takes time"; "I''m more optimistic," "Our military is hurting them"). Names: Johnson, Rusk, McNamara, Wheeler, Westmoreland, McGeorge Bundy, Ball, Valenti.'
