    when: Dec. 21
    date: '1965-12-21'
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball and U. Alexis Johnson, 12:25 to 1 p.m.: a pause "more a sign of weakness than anything else"; "I want more evidence from the Russians before I override Taylor and Wheeler." Rusk for a month''s pause announced in advance; Bundy for announcing only the thirty-hour cease-fire. No agreement. Johnson to Texas.'
    n: '[FRUS 1964–68, III, doc. 238](https://history.state.gov/historicaldocuments/frus1964-68v03/d238) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 124–25. Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-18.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Taylor, Wheeler.'
