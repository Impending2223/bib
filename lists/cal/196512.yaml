  - id: cal.1965-12-18.vietnam-pause
    when: Dec. 18
    date: '1965-12-18'
    time: 1965-12-18T17:35Z
    place: washington
    thread: vietnam-pause
    c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Fortas and Clifford, 12:35 to 2:19 and 3:10 to 5:10 p.m. Johnson, after Wheeler: the military "say a month''s pause would undo all we''ve done"; McNamara: "That''s baloney." Rusk: one chance in twenty of a settlement, and he would take it. McNamara: a military solution "one out of three or one in two"; "We have been too optimistic." Fortas and Clifford against. By Valenti''s account, Johnson: "We''ll take the pause."'
    n: '[FRUS 1964–68, III, doc. 235](https://history.state.gov/historicaldocuments/frus1964-68v03/d235) (Valenti''s notes). [[w.johnson-vantage-point]], 235–37; [[w.mcnamara-in-retrospect]], ch. 8 at n.26. [[w.gibbons-u-s-government-and]], IV, 121–23; [[w.berman-lyndon-johnsons-war]], 12 (Johnson: "Then, no matter what we do in the military field there is no sure victory?" McNamara: "That''s right. We have been too optimistic."); [[w.drea-mcnamara-clifford-and-the-2011]], 66 (four and a half hours, the civilians alone; the 30-hour Christmas truce extended several days); [[w.schlesinger-robert-kennedy-and-his]], 734 ("On December 18, Johnson, still skeptical, decided to give it a try"; McNamara had argued for a bombing pause since early November; the Joint Chiefs, Lodge, Westmoreland, Clifford and Fortas opposed it; Ball for it; Rusk and Bundy "dropped their earlier opposition"; the pause begins with a Christmas truce and runs through January 1966); [[w.dallek-flawed-giant]], 344 (the meeting of the next day: a pause contained "serious military risks"; McNamara: "We have been too optimistic"; Fortas and Clifford speak against a pause; Johnson: "We''ll take the pause"; not the hours or who else was present); [[w.valenti-very-human-president]], 228–40 (Dec. 18, 12:35 p.m., the Cabinet Room: Johnson, Rusk, McNamara, Bundy, Ball, Alexis Johnson, Fortas, Clifford and Valenti; Rusk, "one chance in ten or twenty ... One chance in twenty"; McNamara, "That''s baloney," "one out of three or one in two," "We have been too optimistic"; Clifford''s seven objections; Fortas''s doubts of the effect, not clearly against; Johnson to McNamara: "We''ll take the pause"). Made public: FRUS 1964–68, III (1996). [[w.clifford-counsel-to-the-president-2]], 434–36 (the meeting; McNamara''s "one out of three or one out of two"; Clifford against the pause; Johnson''s note to him). See [[cal.1965-12-17.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Fortas, Clifford, Wheeler, Valenti. Check: Clifford, 436, has Johnson deciding "the next day, in a much shorter meeting," on a pause of unspecified length; FRUS prints no meeting of Dec. 19.'
