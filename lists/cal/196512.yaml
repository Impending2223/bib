    c: 'The third strike on the Uong Bi plant: thirty-five Navy aircraft hit the Haiphong bridge, closing it for a time, then the plant, some twenty-five tons and three Bullpups; most of it destroyed, the North''s generating loss some 47,000 kilowatts, 27 percent. Antiaircraft fire downs two A-4s and an RA-5; at the bridge, SAMs an A-6A and an RA-5. Five aircraft lost in all on the plant.'
