  - id: cal.1965-12-05.economy
    when: Dec. 5–6
    date: '1965-12-05'
    thread: economy
    c: 'The Federal Reserve announces, Sunday, Dec. 5: the discount rate at New York and Chicago from 4 to 4½ percent, effective Dec. 6; the ceiling on time deposits of 30 days or more to 5½ percent. The Board acted Friday, Dec. 3, 4–3, Robertson, Mitchell, and Maisel dissenting. Johnson, from Austin, the same day: the Board "an independent agency"; he regrets an action taken "before January when we will have before us the full facts on next year''s budget, Viet-Nam costs." Dec. 6, the Quadriad at the Ranch, Martin with Fowler and Ackley. The other ten Reserve Banks follow, Dec. 8–13; the banks'' prime rate to 5 percent from Dec. 6. Dec. 13, the Board before the Joint Economic Committee.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697401) (Dec. 5, 1965). [*Federal Reserve Bulletin*, Dec. 1965](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1965-21372), pp. 1667–68, 1751; Jan. 1966, p. 53. Statement by the President on the Raising of the Discount Rate by the Federal Reserve Board, [1965 Pub. Papers 1137](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=611) (Dec. 5, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 1138](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=612) (Dec. 6, 1965). [[w.califano-triumph-and-tragedy-of]], 108–09 (the White House''s word, Nov. 30, of a Quadriad "in the very near future"; the Board, 4 to 3, Dec. 3; Johnson "particularly regretted"; his calls from the Ranch, "How can I run the country"; Proxmire and Patman; the Ranch, Dec. 6, Califano there, "superficially amicable"); [[w.bernstein-guns-or-butter]], 364–65 (the vote of Dec. 3, 4 to 3; "an independent agency"); [[w.dallek-flawed-giant]], 303 (the Federal Reserve''s raising of the discount rate from 4 to 4.5 percent; Johnson publicly objects: better if the Fed had waited until the budget estimates in January). To check: [[w.kettl-leadership-at-the-fed]]; [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1964-11-23.economy]]. Names: Robertson, Mitchell, Maisel, Martin, Fowler, Ackley, Johnson.'
    src:
      c: c0e93aec
      rows:
        - 'https://fraser.stlouisfed.org/title/9237/item/697401: all'
        - 'https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1965-21372: all'
