  - id: cal.1965-12-01.opinion
    when: Dec. 1
    date: '1965-12-01'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: the most important problem: Vietnam 37 percent; civil rights 17; threat of war 12; world communism 7; prestige abroad 6; cost of living 6.'
    n: '[[w.gallup-poll]], III, 1973–74.'
  - id: cal.1965-12-02.states-and-cities-los-angeles
    when: Dec. 2
    date: '1965-12-02'
    thread: states-and-cities
    c: 'The Governor''s Commission on the Los Angeles Riots, McCone chairman, reports: *Violence in the City—An End or a Beginning?*, 101 pages. Unemployment, the schools, and the conditions of life in Watts the causes. Check its recommendations: jobs, preschool, the police.'
    n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). To check: [[w.fogelson-white-on-black]]; [[w.horne-fire-this-time]]; [[w.sides-l-a-city-limits]]; [[w.bauman-race-and-the-war]]. See [[cal.1965-08-26.states-and-cities]]. Names: McCone.'
    tags: [state:ca, city:los-angeles, name:mccone-john-a, name:brown-edmund-g]
  - id: cal.1965-12-02.vietnam-pause
    when: Dec. 2
    date: '1965-12-02'
    thread: vietnam-pause
    also: [vietnam-force-levels]
    c: 'McNamara to McGeorge Bundy: more than military increases; "some form of political action:—a pause, or a ceasefire, or action by the United Nations." Bundy to Johnson in Texas, 8:34 p.m.: Westmoreland''s deployments accepted for planning; the December decisions to prove "we have done everything that we could to move toward peace."'
    n: '[FRUS 1964–68, III, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v03/d213) (Bundy''s telegram). [[w.gibbons-u-s-government-and]], IV, 116 (McNamara''s words, by Bundy''s notes). To check: McGeorge Bundy, notes, Dec. 2, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.11). Made public: FRUS 1964–68, III (1996). Names: McNamara, McGeorge Bundy, Johnson, Westmoreland.'
    src:
      c: acf040ee
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d213: C-D'
        - 'w.gibbons-u-s-government-and IV, 116: A-B'
        - 'via w.gibbons-u-s-government-and IV, 116 n.11: A-B'
    tags: [name:mcnamara-robert-s, name:bundy-mcgeorge, name:johnson-lyndon-b, name:westmoreland-william]
  - id: cal.1965-12-02.vietnam
    when: Dec. 2
    date: '1965-12-02'
    thread: vietnam
    c: 'Lansdale to Lodge, "Role of S.L.O.": the Vietnamese ask his help; the Mission resents the role; his office without a defined mission. Many Americans think his task is to direct the pacification program "with no other resources than my wits and a title." Lodge in the margin: "My job."'
    n: '[[w.gibbons-u-s-government-and]], IV, 183–84. To check: Lansdale to Lodge, "Role of S.L.O.," Dec. 2, 1965, Lodge Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 183 n.34). Names: Lansdale, Lodge.'
    src:
      c: 77ab90fe
      rows:
        - 'w.gibbons-u-s-government-and IV, 183–84: all'
        - 'via w.gibbons-u-s-government-and IV, 183 n.34: all'
    tags: [name:lansdale-edward-g, name:lodge-henry-cabot]
  - id: cal.1965-12-03.alabama
    when: Dec. 3
    date: '1965-12-03'
    thread: alabama
    also: [civil-rights-the-executive]
    c: Montgomery. A federal jury, all white, convicts Wilkins and two other Klansmen from the car from which Viola Liuzzo was shot of conspiracy against the rights of citizens, 18 U.S.C. § 241; each sentenced to ten years, the maximum. Judge Johnson presiding (Check). Wilkins twice tried for murder in Lowndes County without conviction.
    n: '*Wilkins v. United States*, [376 F.2d 552](https://static.case.law/f2d/376/case-pdfs/0552-01.pdf) (5th Cir. 1967) (affirmed). To check: [[w.may-informant]]. See [[cal.1965-03-25.alabama]]; [[cal.1965-05-07.alabama]]. Names: Wilkins, Liuzzo, Johnson.'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola, name:johnson-frank-m-jr]
  - id: cal.1965-12-03.mississippi
    when: Dec. 3
    date: '1965-12-03'
    thread: mississippi
    c: 'Natchez. Mayor John Nosser announces the agreement made Nov. 29 by Charles Evers and the NAACP''s committee with the city and twenty-three merchants: six Negro policemen, the city''s facilities and its schools desegregated, a Negro on the school board, Negro clerks in the twenty-three stores. The boycott ended.'
    n: '[[w.dittmer-local-people]], 360–61. To check: *New York Times*, Dec. 4, 1965 (cited by [[w.dittmer-local-people]], 361 n.52). See [[cal.1965-08-27.mississippi]]. Names: Charles Evers, Nosser.'
    src:
      c: 5ac8afcc
      rows:
        - 'w.dittmer-local-people 360–61: all'
        - 'via w.dittmer-local-people 361 n.52: B-C'
    tags: [state:ms, name:evers-charles, name:nosser-john]
  - id: cal.1965-12-03.economy
    when: Dec. 3
    date: '1965-12-03'
    thread: economy
    also: [vietnam]
    c: 'Johnson to McGeorge Bundy, on McNamara''s estimate of the war''s cost in fiscal 1967, $15 to $17 billion: "My 70 young congressmen can''t take it." "I''d much rather go for a 10 Billion supplemental."'
    n: '[[w.gibbons-u-s-government-and]], IV, 216. To check: McGeorge Bundy''s notes, Dec. 3, 1965 (LBJ Library, Papers of McGeorge Bundy); [Johnson and McGeorge Bundy, 9:31 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-december-3-1965), Conversations WH6512-01-9306, 9307, 9308 (Miller Center), not heard. Names: Johnson, McGeorge Bundy, McNamara.'
    src:
      c: 20ff40e1
      rows:
        - 'w.gibbons-u-s-government-and IV, 216: all'
        - 'via w.gibbons-u-s-government-and IV, 216 n.9: all'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:mcnamara-robert-s]
  - id: cal.1965-12-03.vietnam-pause
    when: Dec. 3
    date: '1965-12-03'
    thread: vietnam-pause
    also: [vietnam-force-levels]
    c: 'Two meetings, Rusk, McNamara, McGeorge Bundy, Ball, William Bundy, U. Alexis Johnson, Vance in the afternoon. Johnson, by Bundy, wants a full package: Phase II, a pause, diplomacy, Congress consulted, perhaps a resolution. McNamara: "Do we want a war with China?"; "You can''t stop 200 tons [of infiltrated supplies] a day by bombing." Bundy to Johnson: deployments of some 15,000 a month accepted for planning, as "undramatic as possible"; "The open question is the pause."'
    n: '[FRUS 1964–68, III, doc. 214](https://history.state.gov/historicaldocuments/frus1964-68v03/d214) (Bundy''s telegram). [[w.gibbons-u-s-government-and]], IV, 116–17 (the meetings, by Bundy''s notes). To check: McGeorge Bundy, notes of the meeting of Dec. 3, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.12). Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-02.vietnam-pause]]. Check: Rusk''s Appointment Book gives the meetings 12:30 to about 3 p.m. and 6:03 to 7:52 p.m., William Bundy at neither (FRUS 1964–68, III, doc. 214 n.2). Check: Gibbons cites the 200 tons to the memorandum to the Ranch (IV, 117 n.14, "Ibid."); FRUS''s text of it does not have it. Names: Rusk, McNamara, McGeorge Bundy, Ball, William Bundy, U. Alexis Johnson, Vance, Johnson.'
    src:
      c: cfde2d51
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d214: E-F'
        - 'w.gibbons-u-s-government-and IV, 116–17: all'
        - 'via w.gibbons-u-s-government-and IV, 116 n.12: A-C'
        - 'via w.gibbons-u-s-government-and IV, 116 n.13: A'
        - 'via w.gibbons-u-s-government-and IV, 117 n.14: D'
        - 'via w.gibbons-u-s-government-and IV, 117 n.15: E-F'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:ball-george-w, name:bundy-william, name:johnson-u-alexis, name:vance-cyrus, name:johnson-lyndon-b]
  - id: cal.1965-12-03.vietnam
    when: Dec. 3
    date: '1965-12-03'
    thread: vietnam
    c: 'Unger for William Bundy, "Political Implications of U.S. Military Action to Seal off the Narrow Southern Neck of North Vietnam": a line at the 20th parallel, by air and sea; China would "have to move militarily ... with massive forces," the Russians come in; to be avoided unless "we are prepared for a war with Communist China (and the USSR?)."'
    n: '[[w.gibbons-u-s-government-and]], IV, 194–95 n.76. To check: Unger, "Political Implications of U.S. Military Action to Seal off the Narrow Southern Neck of North Vietnam in Order to Stop the Flow of Men and Materiel into South Vietnam," Dec. 3, 1965, Department of State, Lot File 85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]], IV, 194 n.76). Names: Unger, William Bundy.'
    src:
      c: 5c026d57
      rows:
        - 'w.gibbons-u-s-government-and IV, 194–95: all'
        - 'via w.gibbons-u-s-government-and IV, 194 n.76: all'
    tags: [name:unger-leonard, name:bundy-william]
  - id: cal.1965-12-04.vietnam-pause
    when: Dec. 4
    date: '1965-12-04'
    thread: vietnam-pause
    c: 'McGeorge Bundy to Johnson: a "favorable consensus" this morning for a pause, Rusk, McNamara, Vance, Ball, McNaughton, the Bundys and Thompson; "the best single way of keeping it clear that Johnson is for peace, while Ho is for war." By William Bundy''s notes, should Hanoi agree to negotiate, the pause "virtually compelled" to go on.'
    n: '[FRUS 1964–68, III, doc. 215](https://history.state.gov/historicaldocuments/frus1964-68v03/d215). [[w.gibbons-u-s-government-and]], IV, 117–18 (the meeting, by William Bundy''s notes, 117). To check: William Bundy, notes of the meeting of Dec. 4, 1965, in William Bundy''s possession (William Bundy MS, ch. 33, pp. 20–21) (cited by [[w.gibbons-u-s-government-and]], IV, 117 n.16). Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-03.vietnam-pause]]. Names: McGeorge Bundy, Johnson, Rusk, McNamara, Vance, Ball, McNaughton, William Bundy, Thompson, Hồ Chí Minh.'
    src:
      c: f1dd33dd
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d215: A-B'
        - 'w.gibbons-u-s-government-and IV, 117: C'
        - 'via w.gibbons-u-s-government-and IV, 117 n.16: C'
        - 'via w.gibbons-u-s-government-and IV, 118 n.18b: A-B'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:vance-cyrus, name:ball-george-w, name:mcnaughton-john-t, name:bundy-william, name:thompson-llewellyn-e, name:ho-chi-minh]
  - id: cal.1965-12-04.vietnam-pause-2
    when: Dec. 4
    date: '1965-12-04'
    thread: vietnam-pause
    c: 'Goldberg to Johnson, after a long talk with Rusk and Ball: "I strongly favor an early pause in the bombing," perhaps three or four weeks, with a new show of willingness to negotiate; it would carry world opinion.'
    n: '[FRUS 1964–68, III, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v03/d216). [[w.gibbons-u-s-government-and]], IV, 118 n.18. Made public: FRUS 1964–68, III (1996). Names: Goldberg, Johnson, Rusk, Ball.'
