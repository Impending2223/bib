entries:
  - id: cal.1965-12-01.opinion
    when: Dec. 1
    date: '1965-12-01'
    thread: opinion
    also: [vietnam]
    c: 'Gallup, Oct. 29–Nov. 2: the most important problem: Vietnam 37 percent; civil rights 17; threat of war 12; world communism 7; prestige abroad 6; cost of living 6.'
    n: '[[w.gallup-poll]], III, 1973–74.'
  - id: cal.1965-12-02.states-and-cities-los-angeles
    when: Dec. 2
    date: '1965-12-02'
    thread: states-and-cities
    c: 'The Governor''s Commission on the Los Angeles Riots, McCone chairman, reports: *Violence in the City—An End or a Beginning?*, 101 pages. Unemployment, the schools, and the conditions of life in Watts the causes. Check its recommendations: jobs, preschool, the police.'
    n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). To check: [[w.fogelson-white-on-black]]; [[w.horne-fire-this-time]]; [[w.sides-l-a-city-limits]]; [[w.bauman-race-and-the-war]]. See [[cal.1965-08-26.states-and-cities]]. Names: McCone.'
    tags: [state:ca, city:los-angeles, name:mccone-john-a, name:brown-edmund-g]
  - id: cal.1965-12-03.alabama
    when: Dec. 3
    date: '1965-12-03'
    thread: alabama
    also: [civil-rights-the-executive]
    c: Montgomery. A federal jury, all white, convicts Wilkins and two other Klansmen from the car from which Viola Liuzzo was shot of conspiracy against the rights of citizens, 18 U.S.C. § 241; each sentenced to ten years, the maximum. Judge Johnson presiding (Check). Wilkins twice tried for murder in Lowndes County without conviction.
    n: '*Wilkins v. United States*, [376 F.2d 552](https://static.case.law/f2d/376/case-pdfs/0552-01.pdf) (5th Cir. 1967) (affirmed). To check: [[w.may-informant]]. See [[cal.1965-03-25.alabama]]; [[cal.1965-05-07.alabama]]. Names: Wilkins, Liuzzo, Johnson.'
    tags: [name:wilkins-collie-leroy-jr, name:liuzzo-viola, name:johnson-frank-m-jr]
  - id: cal.1965-12-03.mississippi
    when: Dec. 3
    date: '1965-12-03'
    thread: mississippi
    c: 'Natchez. Mayor John Nosser announces the agreement made Nov. 29 by Charles Evers and the NAACP''s committee with the city and twenty-three merchants: six Negro policemen, the city''s facilities and its schools desegregated, a Negro on the school board, Negro clerks in the twenty-three stores. The boycott ended.'
    n: '[[w.dittmer-local-people]], 360–61. To check: *New York Times*, Dec. 4, 1965 (cited by [[w.dittmer-local-people]], 361 n.52). See [[cal.1965-08-27.mississippi]]. Names: Charles Evers, Nosser.'
    src:
      c: 5ac8afcc
      rows:
        - 'w.dittmer-local-people 360–61: all'
        - 'via w.dittmer-local-people 361 n.52: B-C'
    tags: [state:ms, name:evers-charles, name:nosser-john]
  - id: cal.1965-12-03.economy
    when: Dec. 3
    date: '1965-12-03'
    thread: economy
    also: [vietnam]
    c: 'Johnson to McGeorge Bundy, on McNamara''s estimate of the war''s cost in fiscal 1967, $15 to $17 billion: "My 70 young congressmen can''t take it." "I''d much rather go for a 10 Billion supplemental."'
    n: '[[w.gibbons-u-s-government-and]], IV, 216. To check: McGeorge Bundy''s notes, Dec. 3, 1965 (LBJ Library, Papers of McGeorge Bundy); [Johnson and McGeorge Bundy, 9:31 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-december-3-1965), Conversations WH6512-01-9306, 9307, 9308 (Miller Center), not heard. Names: Johnson, McGeorge Bundy, McNamara.'
    tags: [name:johnson-lyndon-b, name:bundy-mcgeorge, name:mcnamara-robert-s]
  - id: cal.1965-12-05.economy
    when: Dec. 5–6
    date: '1965-12-05'
    thread: economy
    c: 'The Federal Reserve announces, Sunday, Dec. 5: the discount rate at New York and Chicago from 4 to 4½ percent, effective Dec. 6; the ceiling on time deposits of 30 days or more to 5½ percent. The Board acted Friday, Dec. 3, 4–3, Robertson, Mitchell, and Maisel dissenting. Johnson, from Austin, the same day: the Board "an independent agency"; he regrets an action taken "before January when we will have before us the full facts on next year''s budget, Viet-Nam costs." Dec. 6, the Quadriad at the Ranch, Martin with Fowler and Ackley. The other ten Reserve Banks follow, Dec. 8–13; the banks'' prime rate to 5 percent from Dec. 6. Dec. 13, the Board before the Joint Economic Committee.'
    n: '[Board press release](https://fraser.stlouisfed.org/title/9237/item/697401) (Dec. 5, 1965). [*Federal Reserve Bulletin*, Dec. 1965](https://fraser.stlouisfed.org/title/federal-reserve-bulletin-62/december-1965-21372), pp. 1667–68, 1751; Jan. 1966, p. 53. Statement by the President on the Raising of the Discount Rate by the Federal Reserve Board, [1965 Pub. Papers 1137](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=611) (Dec. 5, 1965); The President''s News Conference at the LBJ Ranch, [1965 Pub. Papers 1138](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=612) (Dec. 6, 1965). To check: [[w.kettl-leadership-at-the-fed]]; [[w.bremner-chairman-of-the-fed]]; [[w.meltzer-history-of-the-federal]]; [[w.helsing-johnsons-war-johnsons-great]]. See [[cal.1964-11-23.economy]]. Names: Robertson, Mitchell, Maisel, Martin, Fowler, Ackley, Johnson.'
    tags: [name:martin-william-mcchesney-jr, name:robertson-j-l, name:mitchell-george-w, name:maisel-sherman-j, name:johnson-lyndon-b, name:fowler-henry-h, name:ackley-gardner]
  - id: cal.1965-12-05.opinion
    when: Dec. 5
    date: '1965-12-05'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 18–23: Republicans'' best candidate for 1968: Nixon 34, Goldwater 13, Lodge 12, Romney 11, Scranton 5, Dirksen 5, Rockefeller 4, Lindsay 4. Independents: Nixon 17, Lodge 15, Goldwater 12, Romney 11, Lindsay 9, Scranton 9.'
    n: '[[w.gallup-poll]], III, 1974. Names: Lodge, Dirksen, Nixon, Goldwater, Lindsay, Romney, Scranton, Rockefeller.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:romney-george-w, name:scranton-william-w, name:dirksen-everett, name:rockefeller-nelson, name:lindsay-john-v]
  - id: cal.1965-12-06.laos
    when: Dec. 6
    date: '1965-12-06'
    thread: laos
    also: [vietnam]
    c: 'Tiger Hound: the eastern Laotian panhandle, from the 17th parallel to Cambodia, taken from Steel Tiger at Westmoreland''s request for MACV''s 2d Air Division. Armed reconnaissance on the roads without prior approval; American forward air controllers in O-1s; a C-130 command post with Lao officers aboard. Villages struck only with the embassy''s approval. Check the day.'
    n: '[FRUS 1964–68, XXVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v28/d216) (Sullivan, Jan. 3, 1966: "established at my suggestion"); [doc. 203](https://history.state.gov/historicaldocuments/frus1964-68v28/d203) (Nov. 8). [[w.frankum-like-rolling-thunder]], 118–20 (the operation, Dec. 6; the roads without prior approval; the forward air controllers; the villages); [[w.staaveren-u-s-air-force]], 100–101 (the forward air controllers; the C-130 with Lao officers; the first missions Dec. 5, the spraying from Dec. 6). See [[cal.1965-04-03.laos]]. Names: Westmoreland, Sullivan. Check: Frankum, 118, has Sullivan strongly against the division. Check: Staaveren, 100, has the first Tiger Hound missions flown Dec. 5.'
    src:
      c: 6083e247
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d216: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v28/d203: all'
        - 'w.frankum-like-rolling-thunder 118–20: A-C, E'
        - 'w.staaveren-u-s-air-force 100–101: C-D, F'
    tags: [name:sullivan-william-h, name:westmoreland-william]
  - id: cal.1965-12-07.vietnam
    when: Dec. 7
    date: '1965-12-07'
    thread: vietnam
    c: McNamara's report of Nov. 30, revised.
    n: '[FRUS 1964–68, III, doc. 222](https://history.state.gov/historicaldocuments/frus1964-68v03/d222). [[w.gibbons-u-s-government-and]], IV, 108–109. See [[cal.1965-11-28.vietnam]]. Names: McNamara, Johnson.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1965-12-07.vietnam-pause-2
    when: Dec. 7
    date: '1965-12-07'
    thread: vietnam-pause
    c: 'The LBJ Ranch: Rusk, McNamara and McGeorge Bundy with Johnson on McNamara''s report and a pause in the bombing. Johnson: "I don''t want to take off till I know I can get back." By his account he asks twice whether the bombing could be resumed if Hanoi did nothing; they assure him it could. By McGeorge Bundy''s notes: "I don''t see any light down that barrel"; "If I have to decide this morning, full steam ahead." McNamara would not have proposed a pause "if he didn''t think we could manipulate it all." Mansfield, Dirksen, Robert Kennedy and Russell to be seen "before we go overboard."'
    n: '[FRUS 1964–68, III, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v03/d223). [[w.johnson-vantage-point]], 235. Bibliography: [[cal.1965-12-24.vietnam]]. [[w.gibbons-u-s-government-and]], IV, 118–19 (Bundy''s notes). Names: Rusk, McNamara, McGeorge Bundy, Johnson, Mansfield, Dirksen, Robert Kennedy, Russell.'
    src:
      c: 27fa65be
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d223: all'
        - 'w.johnson-vantage-point 235: A, C-D'
        - 'w.gibbons-u-s-government-and IV, 118–19: ?'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:johnson-lyndon-b, ok:thread-first, name:mansfield-mike, name:dirksen-everett, name:kennedy-robert-f, name:russell-richard-b]
  - id: cal.1965-12-08.vietnam-operations
    when: Dec. 8–9
    date: '1965-12-08'
    thread: vietnam-operations
    c: Harvest Moon, the Marines' and the South Vietnamese 2d Division's operation in the Quế Sơn valley against the 1st Viet Cong Regiment. The 11th Ranger Battalion ambushed on the Thăng Bình–Hiệp Đức road, the afternoon of Dec. 8; the 5th Regiment's command group and 1st Battalion overrun the next morning, the regimental commander killed. Marines of Task Force Delta landed by helicopter from 10 a.m., Dec. 9, behind the enemy.
    n: '[[w.shulimson-u-s-marines-in]], 98–104; [[w.vietnam-victory-in-vietnam]], 160 (the 5th Regimental Task Force beaten off at Đồng Dương).'
    src:
      c: 1aea261a
      rows:
        - 'w.shulimson-u-s-marines-in 98–104: all'
        - 'w.vietnam-victory-in-vietnam 160: A, C'
    tags: [province:quang-tin]
  - id: cal.1965-12-09.open-housing-wi
    when: Dec. 9
    date: '1965-12-09'
    thread: open-housing
    c: 'Wisconsin''s open housing law signed by Knowles: no discrimination by race, color, religion or national origin in the sale, rental or lease of housing as a business; one-family homes lived in by their owners, and owner-occupied buildings of four units or fewer, exempt. The fair employment division becomes the equal opportunities division. Laws of 1965, ch. 439 (Assembly Bill 852); published Dec. 18.'
    n: '[Laws of 1965, ch. 439](https://docs.legis.wisconsin.gov/1965/related/acts/439.pdf). Date of signing: Milwaukee Public Library, ["200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches) (Check). To check: [[w.jones-selma-of-the-north]]. Names: Knowles.'
    tags: [state:wi, name:knowles-warren-p]
  - id: cal.1965-12-09.vietnam-congress
    when: Dec. 9
    date: '1965-12-09'
    thread: vietnam-congress
    also: [vietnam-pause]
    c: 'McGeorge Bundy to Johnson on the soundings of Congress, McNamara''s calls among them: Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford and Arends. Nearly all for a pause, then more force, bombing included, if needed to "win," and a resolution of support; the war not understood at home. Mansfield, cabled in Asia: against the bombing, doubtful of a pause meant as a prelude to escalation; better a cease-fire of about a month.'
    n: '[FRUS 1964–68, III, doc. 226](https://history.state.gov/historicaldocuments/frus1964-68v03/d226) (Bundy to Johnson, Dec. 9, with McNamara''s memorandum of his calls; Rusk''s talks with Sparkman, Church and Javits). [[w.gibbons-u-s-government-and]], IV, 119–20 and n.22 (the resolution drafted Dec. 6). To check: Washington to Hong Kong 762, Dec. 9, and Manila to Washington 1132, Dec. 10 (State, Central File, Pol 27 Viet S). See [[cal.1965-12-07.vietnam-pause-2]]. Names: McGeorge Bundy, Johnson, McNamara, Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford, Arends, Mansfield.'
    src:
      c: a4159b49
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d226: A-C'
        - 'w.gibbons-u-s-government-and IV, 119–20 and n.22: all'
    tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:mcnamara-robert-s, name:sparkman-john, name:church-frank, name:pastore-john-o, name:monroney-almer-s, name:magnuson-warren-g, name:ervin-sam-j-jr, name:kennedy-robert-f, name:saltonstall-leverett, name:kuchel-thomas-h, name:javits-jacob-k, name:mccormack-john-w, name:hebert-felix-e, name:ford-gerald-r, name:arends-leslie-c, name:mansfield-mike]
  - id: cal.1965-12-10.oil
    when: Dec. 10
    date: '1965-12-10'
    thread: oil
    c: 'Johnson, Proclamation 3693, from Jan. 1: foreign oil into foreign-trade zones only under license; petrochemical plants admitted to allocations; Puerto Rico allocations for plants adding employment, its shipments to the mainland above 1965''s counted under the ceiling.'
    n: '[Proclamation 3693](https://www.presidency.ucsb.edu/documents/proclamation-3693-modifying-proclamation-3279-adjusting-imports-petroleum-and-petroleum), [30 Fed. Reg. 15459](https://www.govinfo.gov/app/details/FR-1965-12-16). See [[cal.1963-06-10.oil]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1965-12-12.opinion
    when: Dec. 12
    date: '1965-12-12'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Nov. 18–23: Vice President Humphrey wants to be President, 72 percent. Will win the nomination: yes 26, no 56. Would like to see him President: yes 23, no 58. Liked best: an eloquent speaker 7; least: avoids issues 7.'
    n: '[[w.gallup-poll]], III, 1975–76. Names: Humphrey.'
    tags: [name:humphrey-hubert-h]
  - id: cal.1965-12-13.vietnam
    when: Dec. 13
    date: '1965-12-13'
    thread: vietnam
    also: [republican-party]
    c: The Republican Coordinating Committee's paper on the war. The aim "not the unconditional surrender of North Vietnam, but unconditional freedom for the people of South Vietnam"; a "growing danger" of "an endless Korean-type jungle war"; first, "a Kennedy-type quarantine on North Vietnam"; "the maximum use of American conventional air and sea power against significant military targets."
    n: '[[w.hess-republican-establishment]], 52. Check: the words against the paper''s text (the copy read is damaged at the gutter). See [[cal.1965-01-22.republican-party]].'
    src:
      c: b67fd4ef
      rows:
        - 'w.hess-republican-establishment 52: all'
  - id: cal.1965-12-14.india-and-china
    when: Dec. 14–15
    date: '1965-12-14'
    thread: india-and-china-kashmir
    c: 'Ayub Khan in Washington. Joint statement: the United States regards "the preservation of the independence and integrity of Pakistan" as "vital to world peace"; both for the Security Council''s resolutions of Sept. 20, Sept. 27, and Nov. 5.'
    n: 'Remarks of Welcome to President Ayub Khan of Pakistan on the South Lawn at the White House, [1965 Pub. Papers 1152](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=626) (Dec. 14, 1965); Joint Statement Following Discussions With the President of Pakistan, [1965 Pub. Papers 1156](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=630) (Dec. 15, 1965). FRUS 1964–68, XXV, docs. [263](https://history.state.gov/historicaldocuments/frus1964-68v25/d263), [265](https://history.state.gov/historicaldocuments/frus1964-68v25/d265), [267](https://history.state.gov/historicaldocuments/frus1964-68v25/d267). See [[cal.1965-08-05.india-and-china]]. Names: Ayub Khan, Johnson.'
    tags: [name:ayub-khan-mohammad, name:johnson-lyndon-b]
  - id: cal.1965-12-14.state-constitutions-ok
    when: Dec. 14
    date: '1965-12-14'
    thread: state-constitutions
    also: [state-and-city-finance]
    c: 'Oklahoma, special election: $54.75 million in debt for State institutions'' buildings, retired from the cigarette tax, general revenue and bonds on the State''s credit, adopted, 101,340 to 31,116, 76.5 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 54](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=54). See [[cal.1965-04-27.state-and-city-finance-ok]].'
    tags: [state:ok]
  - id: cal.1965-12-14.state-constitutions-ct
    when: Dec. 14
    date: '1965-12-14'
    thread: state-constitutions
    also: [legislatures]
    c: Connecticut ratifies its new constitution, the first since 1818, 178,432 to 84,129, 68.0 percent; 20.2 percent of the registered voting. The second proposal, no taking of property for public use unless necessary, fails, 117,494 to 139,701, 45.7 percent. Dempsey proclaims it Dec. 30.
    n: '[Conn. *Register and Manual*, 1966, p. 665](https://archive.org/details/register66conn/page/n668); p. 44. See [[cal.1965-07-01.state-constitutions-ct]]. Names: Dempsey.'
    tags: [state:ct, name:dempsey-john-n]
  - id: cal.1965-12-15.space
    when: Dec. 15
    date: '1965-12-15'
    thread: space
    c: 'Gemini 6: Schirra and Stafford, launched after an abort on the pad Dec. 12, meet Gemini 7 in orbit and fly in company some five hours, the first rendezvous of two manned spacecraft. Gemini 6 down Dec. 16. Gemini 7, Borman and Lovell, up since Dec. 4, down Dec. 18 after 14 days, the longest flight yet.'
    n: 'Statement by the President on the Flight of Gemini 7, [1965 Pub. Papers 1135](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=609) (Dec. 4, 1965); Statement by the President on the Delayed Takeoff of Gemini 6, [1965 Pub. Papers 1151](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=625) (Dec. 12, 1965); Telegram to the Administrator, NASA, Following the Meeting in Space of Gemini 6 and Gemini 7, [1965 Pub. Papers 1156](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=630) (Dec. 15, 1965); Letters to the Gemini 6 and Gemini 7 Astronauts After the Successful Completion of Their Mission, [1965 Pub. Papers 1159](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=633) (Dec. 18, 1965). To check: [[w.hacker-on-the-shoulders-of]]; [[w.mcdougall-heavens-and-the-earth]]. See [[cal.1965-03-23.space]]; [[cal.1965-08-21.space]]. Names: Schirra, Stafford, Borman, Lovell, Webb.'
    tags: [name:schirra-walter-m-jr, name:stafford-thomas-p, name:borman-frank, name:lovell-james-a-jr, name:webb-james-e, name:johnson-lyndon-b]
  - id: cal.1965-12-15.specials
    when: Dec. 15
    date: '1965-12-15'
    thread: specials
    c: 'California 26th, special. Rees (D), a State senator, takes the seat James Roosevelt left Sept. 30 for the UN Economic and Social Council. First round, Nov. 23: Rees over Horwin (D), 21,481 to 19,612, 35.3 percent; Marshall (R) 16,088, 26.4 percent. Runoff: Rees over Marshall, 40,430 to 27,579, 59.4 percent. Swing 10.9 to R. Sworn Jan. 10, 1966.'
    n: 'Votes: [Cal. *Statement of Vote*, Nov. 8, 1966, p. 5](https://archive.org/details/californiastate196668cali/page/n50). [112 Cong. Rec., House, Jan. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-1-2.pdf) (Rees sworn). Roosevelt''s resignation: BD 1835. See [[cal.1961-04-04.states-and-cities]]. Names: Rees, Roosevelt, Horwin, Marshall.'
    tags: [special:1965-12-15-h-CA-26, name:rees-thomas-m, name:roosevelt-james, name:marshall-edward-m, name:horwin-leonard]
  - id: cal.1965-12-15.opinion
    when: Dec. 15
    date: '1965-12-15'
    thread: opinion
    also: [court]
    c: 'Gallup, Nov. 18–23: the Supreme Court''s ruling that Communists cannot be required to register: approve 27 percent, disapprove 58. College-educated 38 approve.'
    n: '[[w.gallup-poll]], III, 1976. See [[cal.1965-11-15.court]].'
  - id: cal.1965-12-15.vietnam
    when: Dec. 15
    date: '1965-12-15'
    thread: vietnam
    c: The Uông Bí thermal power plant, north of Haiphong, struck, some 15 percent of the North's generating capacity; Lodge told Dec. 8 of State's approval of a strike on "an isolated electric power plant." Restruck over five days; the boiler house destroyed.
    n: 'FRUS 1964–68, III, docs. [221](https://history.state.gov/historicaldocuments/frus1964-68v03/d221), n. 4 (the approval), [239](https://history.state.gov/historicaldocuments/frus1964-68v03/d239), n. 2 (Dec. 21). [[w.frankum-like-rolling-thunder]], 33 (the strike, mid-December; 15 percent; five days of restrikes; the boiler house); [[w.staaveren-gradual-failure]], 203–04 (the strike, Dec. 15; 15 percent; the Navy''s restrikes, Dec. 19 and 22). To check: Msg, JCS to CINCPAC, 090002 Dec 65 (cited by [[w.staaveren-gradual-failure]], 203 n.9a); memo, Lt Gen F. Carroll, Dir DIA to SECDEF, 21 Jan 66, subj: An Appraisal of Bombing in NVN (cited by [[w.staaveren-gradual-failure]], 203 n.9b); New York Times, Dec 16, 65 (cited by [[w.staaveren-gradual-failure]], 203 n.9c); PACAF DI rpt, Effects of Air Ops, SEA, 23 Dec 65, p 13 (cited by [[w.staaveren-gradual-failure]], 204 n.11a); PACAF rpt, Sum of Air Ops, SEA, Vol XIII, pp 2-2 and 2-4 and 2-A-1, 2-A-21, and 2-A-22 (cited by [[w.staaveren-gradual-failure]], 204 n.11b); msg, CINCPAC to JCS, 140147Z Dec 65 (cited by [[w.staaveren-gradual-failure]], 204 n.11c); msg, JCS to CINCPAC, 16 Dec 65 (cited by [[w.staaveren-gradual-failure]], 204 n.11d); New York Times, Dec 16, 65, Dec 21, 65, Dec 24, 65 (cited by [[w.staaveren-gradual-failure]], 204 n.11e); Washington Post, Dec 17, 65 (cited by [[w.staaveren-gradual-failure]], 204 n.11f). See [[cal.1965-03-02.vietnam]]. Names: Lodge.'
