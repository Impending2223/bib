    c: 'Peking 北京. Peng Zhen 彭真 holds a forum of the NPC and Standing Committee vice-chairmen, the CPPCC vice-chairmen, the chairmen of the Democratic National Construction Association and the Federation of Industry and Commerce, and the secretaries-general: the second session of the Third NPC and the CPPCC''s second session put off to the first half of 1966, the year''s line, readiness for war and plan still to be settled; the capitalists'' fixed interest, Mao 毛泽东, Liu Shaoqi 刘少奇 and Zhou Enlai 周恩来 inclined, before leaving Peking, to extend it two or three years for the several hundred thousand of them; the labor insurance rules copied from the Soviet Union, 20 million temporary workers of 36 million wage earners not fully covered, to be reformed; the socialist education aimed at the very few in the Party taking the capitalist road, never to turn to those outside; the children of landlords, rich peasants and businessmen judged by conduct.'
    n: '[[w.peng-zhen-nianpu-1902]], IV, 453–454. The words: 下午 (IV, 453–454). Made public: 2012. Names: Peng Zhen, Zhou Enlai, Liu Shaoqi, Mao Zedong.'
