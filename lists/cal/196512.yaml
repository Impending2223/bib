  - id: cal.1965-12-08.vietnam-pause
    when: Dec. 8
    date: '1965-12-08'
    thread: vietnam-pause
    also: [soviet-union]
    c: 'Rusk and Thompson with Dobrynin: what would Moscow do if the bombing stopped? Stopping it "would create a better atmosphere"; no undertaking, but the Soviet Union "would not try to influence North Vietnam while they were being bombed."'
    n: '[[w.gibbons-u-s-government-and]], IV, 115 n.9. See [[cal.1965-11-24.vietnam-pause]]. Names: Rusk, Thompson, Dobrynin.'
