    c: 'Bushmaster II, the Michelin plantation: the enemy attacks American and South Vietnamese troops, Westmoreland calls for B-52s and asks Arc Light''s channels decentralized as for Silver Bayonet. Approved.'
    n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 348. See [[cal.1965-06-18.vietnam]]. Names: Westmoreland.'
