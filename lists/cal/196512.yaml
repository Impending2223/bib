  - id: cal.1965-12-02.states-and-cities-los-angeles
    when: Dec. 2
    date: '1965-12-02'
    thread: civil-disorders-watts
    also: [states-and-cities]
    c: 'The Governor''s Commission on the Los Angeles Riots, McCone chairman, reports: *Violence in the City—An End or a Beginning?*, 101 pages. Unemployment, the schools, and the conditions of life in Watts the causes. Check its recommendations: jobs, preschool, the police.'
    n: 'Governor''s Commission on the Los Angeles Riots, [*Violence in the City—An End or a Beginning?*](https://archive.org/details/ViolenceInCity) (1965). [[w.branch-at-canaans-edge]], 397–99; [[w.bernstein-guns-or-butter]], 388 ("no reliable evidence of outside leadership or pre-established plans for the rioting"). To check: [[w.fogelson-white-on-black]]; [[w.horne-fire-this-time]]; [[w.sides-l-a-city-limits]]; [[w.bauman-race-and-the-war]]. See [[cal.1965-08-26.states-and-cities]]. Names: McCone.'
    src:
      c: f5085b4f
      rows:
        - 'https://archive.org/details/ViolenceInCity: all'
        - 'w.branch-at-canaans-edge 397–99: A-C'
        - 'w.bernstein-guns-or-butter 388: A'
    tags: [state:ca, city:los-angeles, name:mccone-john-a, name:brown-edmund-g]
  - id: cal.1965-12-02.vietnam-pause
    when: Dec. 2
    date: '1965-12-02'
    time: 1965-12-03T01:34Z
    thread: vietnam-pause
    also: [vietnam-force-levels]
    c: 'McNamara to McGeorge Bundy: more than military increases; "some form of political action:—a pause, or a ceasefire, or action by the United Nations." Bundy to Johnson in Texas, 8:34 p.m.: Westmoreland''s deployments accepted for planning; the December decisions to prove "we have done everything that we could to move toward peace."'
    n: '[FRUS 1964–68, III, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v03/d213) (Bundy''s telegram). [[w.gibbons-u-s-government-and]], IV, 116 (McNamara''s words, by Bundy''s notes). [[w.preston-war-council]], 223–24 (Bundy''s telegram: he, Moyers and Califano for a pause; "a solid base for the chosen level of later military action"). To check: McGeorge Bundy, notes, Dec. 2, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.11). Made public: FRUS 1964–68, III (1996). Names: McNamara, McGeorge Bundy, Johnson, Westmoreland.'
    src:
      c: acf040ee
      rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d213: C-D'
        - 'w.gibbons-u-s-government-and IV, 116: A-B'
        - 'via w.gibbons-u-s-government-and IV, 116 n.11: A-B'
        - 'w.preston-war-council 223–24: C'
        - 'via w.preston-war-council 224 n.36a: C'
    tags: [name:mcnamara-robert-s, name:bundy-mcgeorge, name:johnson-lyndon-b, name:westmoreland-william]
  - id: cal.1965-12-02.vietnam
    when: Dec. 2
    date: '1965-12-02'
    thread: vietnam-pacification
    c: 'Lansdale to Lodge, "Role of S.L.O.": the Vietnamese ask his help; the Mission resents the role; his office without a defined mission. Many Americans think his task is to direct the pacification program "with no other resources than my wits and a title." Lodge in the margin: "My job."'
    n: '[[w.gibbons-u-s-government-and]], IV, 183–84. To check: Lansdale to Lodge, "Role of S.L.O.," Dec. 2, 1965, Lodge Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 183 n.34). Names: Lansdale, Lodge.'
