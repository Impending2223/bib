  - id: cal.1965-12-28.china-leadership
    when: Dec. 28
    date: '1965-12-28'
    thread: china-leadership
    also: [china]
    c: 'Deng Xiaoping 邓小平 meets Hill 希尔, chairman of the Communist Party of Australia (Marxist–Leninist), and Russell (罗素), a member of its leading body. Deng: the Chinese are doing two things, building and preparing for war, joined; in industry they now know fairly well how to do it, and can make the most precise machines, though not enough of them; ''a heart for the motherland, eyes on the world'' is now the whole party''s slogan; on party building: a party with fighting power, whose organization joins the highest democracy with the highest centralism; without high centralism no fighting power; as Lenin said, a party of the strictest organization and discipline, of iron discipline, and of high combativeness; such a party, though few, can make right strategy and tactics.'
    n: '[[w.deng-xiaoping-nianpu-1904]], III, 1889 (Dec. 28, 1965). The words: 下午 (III, 1889). Made public: 2009 (the nianpu). Names: Deng Xiaoping. Check: Russell''s given name (the nianpu: 弗·罗素).'
