    c: 'Erhard in Washington, with Schroeder and von Hassel. Joint statement, Dec. 21: the Federal Republic and other partners without nuclear weapons to have "an appropriate part in nuclear defense"; Germany wants no national control; alliance arrangements "would not constitute proliferation." The offset, German purchases of American arms against American military spending in Germany, to be "fully executed and continued." German support in Vietnam.'
    n: 'Toasts of the President and Chancellor Ludwig Erhard of Germany, [1965 Pub. Papers 1161](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=635) (Dec. 20, 1965); Joint Statement Following Discussions With Chancellor Erhard, [1965 Pub. Papers 1165](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=639) (Dec. 21, 1965). FRUS 1964–68, XV, docs. [138](https://history.state.gov/historicaldocuments/frus1964-68v15/d138), [139](https://history.state.gov/historicaldocuments/frus1964-68v15/d139), [140](https://history.state.gov/historicaldocuments/frus1964-68v15/d140), [141](https://history.state.gov/historicaldocuments/frus1964-68v15/d141), [142](https://history.state.gov/historicaldocuments/frus1964-68v15/d142), [143](https://history.state.gov/historicaldocuments/frus1964-68v15/d143); XIII, docs. [119](https://history.state.gov/historicaldocuments/frus1964-68v13/d119), [120](https://history.state.gov/historicaldocuments/frus1964-68v13/d120). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 419 (the visit; the joint statement, the MLF let go); [[w.schwartz-lyndon-johnson-and-europe]], 88–90, 112 (the offset; Vietnam; the nuclear proposals). [[w.gavin-gold-dollars-and-power]], 140 (the offset). To check: [Johnson and McNamara, 9:12 a.m., Dec. 20](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-december-20-1965), Conversation WH6512-03-9326 (Miller Center); McGhee to Leddy, Jan. 13, 1966, RG 59, National Archives; the German record, *AAPD 1965*, III, doc. 469 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 89 nn.178, 180; 90 n.182). Check: McGhee''s minute dates the meeting upstairs after the dinner Dec. 19 (Schwartz, 89 n.180). See [[cal.1964-12-07.europe-and-the-alliance]]. Names: Erhard, Schröder, von Hassel, Johnson.'
