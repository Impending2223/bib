  - id: cal.1965-12-07.vietnam-pause-2
    when: Dec. 7
    date: '1965-12-07'
    time: 1965-12-07T16:25Z
    place: lbj-ranch
    thread: vietnam-pause
    c: 'The LBJ Ranch: Rusk, McNamara and McGeorge Bundy with Johnson on McNamara''s report and a pause in the bombing. Johnson: "I don''t want to take off till I know I can get back." By his account he asks twice whether the bombing could be resumed if Hanoi did nothing; they assure him it could. By McGeorge Bundy''s notes: "I don''t see any light down that barrel"; "If I have to decide this morning, full steam ahead." McNamara would not have proposed a pause "if he didn''t think we could manipulate it all." Mansfield, Dirksen, Robert Kennedy and Russell to be seen "before we go overboard." Johnson: "I think we''ll be spending more time defending ourselves from hawks than from doves"; "We''re spending too much time with crybabies."'
    n: '[FRUS 1964–68, III, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v03/d223). [[w.johnson-vantage-point]], 235; [[w.mcnamara-in-retrospect]], ch. 8 at n.25 (Rusk, Bundy and McNamara to Texas; Johnson: "We''re getting deeper and deeper in. I bogged my car down"). [[w.mann-grand-delusion]], 470 (the hawks and the "crybabies"); [[w.dallek-flawed-giant]], 343 (the meeting with advisers at his ranch on Dec. 7: "We mustn''t take off into the wild blue yonder"; he asks whether there is evidence the Communists are "getting ready for a peace offer," Rusk and McNamara think not; not who was present). Bibliography: [[cal.1965-12-24.vietnam]]. [[w.gibbons-u-s-government-and]], IV, 118–19 (Bundy''s notes). Names: Rusk, McNamara, McGeorge Bundy, Johnson, Mansfield, Dirksen, Robert Kennedy, Russell.'
