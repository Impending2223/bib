  - id: cal.1961-09-01.china-leadership-4
    when: Sept. 1
    date: '1961-09-01'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Mao Zedong, Liu Shaoqi, Zhu De and Zhou Enlai cable Hồ Chí Minh, Trường Chinh and Phạm Văn Đồng on the 16th anniversary of the DRV: the first five-year plan; the Geneva agreements of 1954 not carried out for American obstruction; China''s full support of the Vietnamese people against American aggression and the southern "traitor clique''s reign of terror"; Phạm Văn Đồng''s recent visit.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVI, 95–97 (Sept. 1, 1961). Names: Mao Zedong, Liu Shaoqi, Zhu De, Zhou Enlai, Hồ Chí Minh, Trường Chinh, Phạm Văn Đồng.'
