  - id: cal.1961-09-23.china-leadership-5
    when: Sept. 23
    date: '1961-09-23'
    thread: china-leadership
    also: [china]
    c: 'Mao Zedong, speaking to Xiong Xianghui, deputy director of the Foreign Ministry''s general office, and Pu Shouchang, secretary in the Premier''s office, who are looking after Montgomery''s visit: the Eighth Congress''s Party constitution has a clause for an honorary chairman "if need be," and Mao would be it; the vice-chairmen are six, and Liu Shaoqi first among them, in effect first vice-chairman, who runs the first line of work; Liu is no Malenkov. Two years before, the chairman of the republic changed his surname, from Mao to Liu, as the National People''s Congress chose; before, two chairmen were both Mao, now one Mao and one Liu, and in time both Liu. If Marx does not invite him, he will be the honorary chairman.'
