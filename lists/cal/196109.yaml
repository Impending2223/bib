    thread: vietnam
    c: 'The Politburo and the Central Military Party Committee approve the General Staff''s plan for the South, 1961–63: besides recruits there, 30,000 to 40,000 men trained in the North to be sent down; Group 559, the trail''s transport group, grown to 2,000–3,000.'
