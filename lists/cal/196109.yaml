    when: Sept. 20
    date: '1961-09-20'
    place: peking
    thread: china-leadership
    also: [soviet-union]
    c: 'Peking. Liu Shaoqi calls a small meeting on the CPSU''s Twenty-second Congress, Mao away. Liu: the draft Programme is aimed at China and at Albania, neither named. The delegation is to follow Mao''s line from the end of the Lushan conference: hold to principle and to unity, oppose attacks on Albania, strike back if China is attacked. Three points. (1) The Programme''s plan to build communism only to be spoken to, in empty words, no substance, the Programme itself not named. (2) Mao and Liu not to go, Zhou Enlai to head the delegation and stay only a week, not till the close, for home affairs, the seven-year plan to go to the Central Work Conference and the National People''s Congress. (3) If the CPSU proposes a conference of brother parties, resist: without Albania, as at the Warsaw summit, it would be a split meeting. Reported to Mao, who agrees; Zhou begins to form the delegation, Peng Zhen and Kang Sheng among its members.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 468–469 ("a small meeting called by Liu Shaoqi on Sept. 20"). Made public: 1999. See [[cal.1961-09-15.china-leadership]]. Names: Liu Shaoqi, Mao Zedong, Zhou Enlai, Peng Zhen, Kang Sheng. Check: whether this is the Politburo meeting of that day in [[cal.1961-09-20.china-leadership]], whose matters differ; Wu names a small meeting.'
