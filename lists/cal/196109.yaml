  - id: cal.1961-09-02.press-and-broadcasting
    when: Sept. 2
    date: '1961-09-02'
    place: hyannis-port
    thread: press-and-broadcasting
    c: 'Hyannis Port. Kennedy''s interview with James Reston of the *New York Times*; walking on the beach after, asked what kind of world he would like to help make: "I haven''t had time to think about that yet."'
    n: '[[w.reeves-president-kennedy]], 225. To check: James Reston, interview by Reeves (cited by [[w.reeves-president-kennedy]], 225). Check: the day; Reeves: "That weekend." Names: Kennedy, Reston.'
