  - id: cal.1961-09-15.china-leadership
    when: Sept. 15
    date: '1961-09-15'
    place: lushan
    thread: china-leadership
    c: 'Lushan. The enlarged Standing Committee, Mao presiding: on the "four highs" (targets, estimates, procurement, allotments), ownership and distribution "no breach of faith with the people"; retreated "to the valley floor," now to climb steadily.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1961. [[w.zhou-enlai-nianpu-1949]], II, 431, Sept. 15, 1961 (Zhou at the Standing Committee on Sept. 1, 4, 5 and 15 (the day among them)). [[w.lengxi-shinian-lunzhan-1956-1966]], 459–467 (the afternoon of Sept. 15, at Mao''s residence, the Standing Committee on the CPSU''s draft Programme, Lu Dingyi, Wang Jiaxiang, Liu Ningyi, Zhang Hanfu, Peng Zhen, Yang Shangkun and Wu present, Deng Xiaoping, there for the first half, gone to lead a delegation to Korea; Mao: Old Mrs. Wang''s foot-bindings, long and foul, no head or tail, no conclusion today; Lu Dingyi: two-faced, behind the 1957 Declaration and the 1960 Statement, errors struck out at Moscow put back, no class struggle, reformism, humanism, the "state" and "party of the whole people" a dropping of the dictatorship of the proletariat, abroad level with Kennedy, "first inside, then outside"; Mao in interjections: two years'' struggle did not hold Khrushchev; a high-salaried stratum, a new bourgeoisie; self-reliance learned from Lenin and Stalin; mend the fortress, prepare for a fight at the Twenty-second Congress, publish the Programme once adopted and answer it, the 1957 and 1960 documents as weapons, lengthen the thaw, a "self-defense counterattack" if attacked; Liu: the line since the Twentieth Congress made systematic, "three peaces and two wholes"). Made public: 1997. Check: the matters: Wu (459–467) has the Standing Committee at Mao''s residence that afternoon on the CPSU''s draft Programme; whether one session or two. Names: Mao Zedong, Peng Zhen.'
