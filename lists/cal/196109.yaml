    c: Oklahoma, special election. An amendment directing the State Election Board to apportion the House by a fixed formula after each census refused, 26,407 to 88,779, 22.9 percent. Trial in any county where a crime may have been committed adopted, 91,909 to 23,750, 79.5 percent.
