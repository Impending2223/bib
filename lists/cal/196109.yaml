    c: 'McNamara puts to the Joint Chiefs, mornings, four Guard divisions mobilized and one regular division to Europe. The Chiefs at the Pentagon: two divisions for Norstad "if and when he wants them," two Guard divisions called Oct. 1; Wheeler telephones it to the White House. There, LeMay, Acting Chairman: Lemnitzer and Decker for as many as six divisions to Europe, the others against any move now. Kennedy approves calling two Guard divisions.'
