    n: 'Votes: [Wikipedia, "1961 New York City mayoral election"](https://en.wikipedia.org/wiki/1961_New_York_City_mayoral_election); Check: the Board of Elections'' canvass. To check: [[w.wilson-amateur-democrat]]; [[w.moscow-last-of-the-big]]. Names: Wagner, Levitt, DeSapio.'
