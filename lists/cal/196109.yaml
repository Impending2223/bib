  - id: cal.1961-09-05.china
    when: Sept. 5
    date: '1961-09-05'
    thread: china
    also: [testing]
    c: 'Kennedy with Rusk, Stevenson, Cleveland, Bundy, Sorensen and Schlesinger on his address to the General Assembly. On resuming tests: "They had spit in our eye three times." Stevenson may tell delegations a "two China" study is not excluded; Peking kept out at least a year: "Whatever is required is OK by me."'
    n: '[[w.schlesinger-thousand-days-1965]], 482–83. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-08-05.china]]. Names: Kennedy, Rusk, Stevenson, Cleveland, Bundy, Sorensen, Schlesinger.'
