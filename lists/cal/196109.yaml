  - id: cal.1961-09-01.berlin-and-vienna-2
    when: Sept. 1
    date: '1961-09-01'
    thread: berlin-and-vienna
    c: 'Kennedy changes the instructions of Aug. 31 on the air corridors: Washington, not the field commanders, to decide on fighter escorts; unescorted transports to "make every effort to continue on course to destination despite harassment." Lemnitzer: the "clean cut" decisions vitiated.'
    n: '[[w.poole-joint-chiefs-of-staff]], 150. See [[cal.1961-08-31.berlin-and-vienna]]. Names: Kennedy, Lemnitzer.'
