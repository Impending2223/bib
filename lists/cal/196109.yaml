  - id: cal.1961-09-01.defense
    when: Sept. 1
    date: '1961-09-01'
    thread: defense
    c: 'McNamara directs the Air Force and the Navy to develop one aircraft, the TFX, for the Air Force''s offensive mission and the Navy''s defensive one: his rulings on weight, length, the Navy''s radar and carrier landings; changes to the Air Force model held to a minimum.'
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 468. See [[cal.1962-11-24.defense]]. Names: McNamara.'
