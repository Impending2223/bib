  - id: cal.1961-09-01.china-leadership
    when: Sept. 1
    date: '1961-09-01'
    place: lushan
    thread: china-leadership
    c: 'Lushan. Mao''s meeting of the regional first secretaries. Zhou Enlai: coal 500 million and steel 15 million tons for the two years. Mao: not pessimistic, a refilling, like the Red Army''s after the Long March, its 20,000 grown to 1.2 million. Chen Yun''s small meetings by industry to bring out the questions: agreed.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yun.'
    tags: [polity:prc, name:mao-zedong, name:zhou-enlai, name:chen-yun, vis:only:prc]
  - id: cal.1961-09-01.china-leadership-3
    when: Sept. 1, 4, 5, 15
    date: '1961-09-01'
    thread: china-leadership
    also: [economy]
    c: 'Zhou Enlai at the Standing Committee on Sept. 1, 4, 5 and 15: he proposes how to carry out the adjustment: retreat enough and leave room; adjust the key points, fight battles of annihilation; balance the whole and arrange the whole; centralize and unify, manage by levels. Mao and others approve.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 431 (Sept. 1, 1961); [[w.deng-xiaoping-nianpu-1904]], III, 1657 (Sept. 4, 1961; Deng at Mao''s Standing Committee). Made public: 1997. Names: Zhou Enlai, Mao Zedong.'
    tags: [polity:prc, name:zhou-enlai, name:mao-zedong, vis:only:prc]
