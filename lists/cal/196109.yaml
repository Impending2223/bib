    thread: cuba
    also: [soviet-union]
    c: 'Castro to Khrushchev, the covert attacks increased: more military aid; Sergio del Valle, the army''s chief of staff, to Moscow to negotiate it. The list: eight divisions of surface-to-air missiles, 360 SA-2s, 412 tanks, 100 transports, 282 Zenith cannon.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 396 and n.40; [[w.fursenko-one-hell-of-a]], 139 (the letter, five pages). To check: Castro to Khrushchev, Sept. 4, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 396 n.39). Names: Castro, Khrushchev.'
