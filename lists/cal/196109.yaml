# Cal. XXII September 1961
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XXII
entries:
  - id: cal.1961-09-01.testing
    when: Sept. 1
    date: '1961-09-01'
    thread: testing
    c: The Soviet Union ends the three-year moratorium with an atmospheric test. The Belgrade nonaligned conference opens the same day.
    n: '[[w.seaborg-kennedy-khrushchev-and-the]]. [FRUS vol. 7](https://history.state.gov/historicaldocuments/frus1961-63v07). Names: Wiesner.'
    tags: [name:wiesner-jerome-b]
  - id: cal.1961-09-03.economy
    when: Sept. 3
    date: '1961-09-03'
    thread: economy
    c: 'The 1961 minimum wage takes effect: $1.15 an hour, $1.25 from 1963. Newly covered retail and service workers start at $1.00.'
    n: '[75 Stat. 65](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg65.pdf) (1961). Statement by the President on the Increase in the Minimum Wage, [1961 Pub. Papers 587](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645). See [[cal.1961-03-24.program]] (Program) and [[cal.1961-05-05.space]] (Space).'
  - id: cal.1961-09-04.foreign-aid
    when: Sept. 4
    date: '1961-09-04'
    thread: foreign-aid
    c: Foreign Assistance Act signed, [75 Stat. 424](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg424-2.pdf). AID created; Congress denies the Treasury borrowing, granting long-term authorizations instead.
    n: Statute (K–J Cong. II.J.2). See [[cal.1961-03-22.foreign-aid]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-05.testing
    when: Sept. 5
    date: '1961-09-05'
    thread: testing
    c: Kennedy orders U.S. testing resumed, underground and in the laboratory.
    n: Statement by the President on Ordering Resumption of Underground Nuclear Tests, [1961 Pub. Papers 589](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=647) (Sept. 5, 1961). See [[cal.1961-09-01.testing]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-05.crime-and-hijacking
    when: Sept. 5
    date: '1961-09-05'
    thread: crime-and-hijacking
    c: Aircraft piracy made a federal crime, [75 Stat. 466](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg466.pdf).
    n: See [[cal.1961-05-01.crime-and-hijacking]].
  - id: cal.1961-09-06.steel
    when: Sept. 6
    date: '1961-09-06'
    thread: steel
    c: Kennedy writes the heads of twelve steel companies asking them to hold prices when the October wage step comes.
    n: 'Letter to Leaders of the Steel Industry on the Need for Price Stability, [1961 Pub. Papers 592](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=650). [[w.mcconnell-steel-and-the-presidency]]; [[w.rowen-free-enterprisers]]; [[w.heath-john-f-kennedy-and]]. Names: Goldberg, Heller.'
    tags: [name:kennedy-john-f, name:goldberg-arthur-j, name:heller-walter-w]
  - id: cal.1961-09-06.opinion
    when: Sept. 6
    date: '1961-09-06'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, Aug. 24–29: 90 percent have heard of the Berlin situation. Satisfied with the government''s handling, 66; dissatisfied, 21.'
    n: '[[w.gallup-poll]], III, 1734.'
  - id: cal.1961-09-06.desegregation-schools-dallas
    when: Sept. 6
    date: '1961-09-06'
    thread: desegregation-schools
    c: Dallas. Eighteen Black children enter first grade in formerly white schools, under the school board's stair-step plan, a grade a year, ordered by the Fifth Circuit. The NAACP protests the district's procedures for their entry.
    n: 'Statement by the President on the Peaceful Integration of Schools in the South and Southwest, [1961 Pub. Papers 591](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=649). *Boson v. Rippy*, [285 F.2d 43](https://static.case.law/f2d/285/case-pdfs/0043-01.pdf), 45–47 (5th Cir. 1960). Southern Methodist University, Underwood Law Library, ["Desegregating Dallas Schools: Background"](https://web.archive.org/web/20080101052239/http://library.law.smu.edu/disd/background.shtm) (archived). Check: the order and the count. [[w.linden-desegregating-schools-in-dallas]]; [[w.phillips-white-metropolis]]; [[w.payne-big-d]]. See [[cal.1960-08-03.desegregation-schools-houston]].'
    tags: [state:tx, city:dallas]
  - id: cal.1961-09-06.conservation
    when: Sept. 6
    date: '1961-09-06'
    thread: conservation
    c: 'Senate passes the wilderness bill, S. 174, Anderson''s, [78–8](https://voteview.com/rollcall/RS0870175): a National Wilderness Preservation System. Refused: a motion to recommit, Sept. 5, [32–41](https://voteview.com/rollcall/RS0870172); Congress''s approval by concurrent resolution before primitive areas and wildlife preserves enter the system, [32–53](https://voteview.com/rollcall/RS0870173); exceptions by the Secretaries, not the President, [35–51](https://voteview.com/rollcall/RS0870174).'
    n: 'Wilderness Act (K–J Cong. II.J.2). [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]; [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]]. Names: Anderson.'
    tags: [name:anderson-clinton-p]
  - id: cal.1961-09-07.states-and-cities
    when: Sept. 7
    date: '1961-09-07'
    thread: mayors
    also: [elections-1961]
    c: New York primary. Mayor Wagner, running against Tammany, beats Levitt, 456,016 to 292,726, 60.9 percent; DeSapio loses his own district leadership to the reformers.
    n: 'Votes: [Wikipedia, "1961 New York City mayoral election"](https://en.wikipedia.org/wiki/1961_New_York_City_mayoral_election); Check: the Board of Elections'' canvass. [[w.wilson-amateur-democrat]]; [[w.moscow-last-of-the-big]]. Names: Wagner, Levitt, DeSapio.'
    tags: [name:wagner-robert-f-jr, name:levitt-arthur, name:desapio-carmine, state:ny, city:nyc]
  - id: cal.1961-09-07.mississippi
    when: Sept. 7
    date: '1961-09-07'
    thread: mississippi
    also: [voting-rights]
    c: Tylertown, Walthall County. The registrar, John Q. Wood, strikes John Hardy of SNCC on the head with a pistol when Hardy brings two Negroes to register; the sheriff arrests Hardy. No Negro tries to register in the county after.
    n: '*United States v. Wood*, [295 F.2d 772](https://static.case.law/f2d/295/case-pdfs/0772-01.pdf), 775 (5th Cir. 1961), from the Government''s affidavits. [[w.dittmer-local-people]], 108. See [[cal.1961-08.mississippi]].'
    tags: [state:ms]
  - id: cal.1961-09-12.states-and-cities
    when: Sept. 12
    date: '1961-09-12'
    thread: state-constitutions
    c: Michigan elects its convention delegates. Romney among them.
    n: '[Michigan Constitutional Convention 1961, *Official Record*, I, 107–108](https://archive.org/details/officialrecordvolume1/page/n108/mode/1up) (the Secretary of State''s certified list of delegates elect). See [[cal.1961-04-03.states-and-cities]]. Names: Romney.'
    tags: [name:romney-george-w, state:mi]
  - id: cal.1961-09-12.state-constitutions-ok
    when: Sept. 12
    date: '1961-09-12'
    thread: state-constitutions
    also: [legislatures]
    c: Oklahoma, special election. An amendment directing the State Election Board to apportion the House by a fixed formula after each census refused, 26,407 to 88,779. Trial in any county where a crime may have been committed adopted, 91,909 to 23,750.
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 25](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=25). See [[cal.1960-09-20.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1961-09-12.africa
    when: Sept. 12–13
    date: '1961-09-12'
    thread: africa
    also: [berlin-and-vienna]
    c: 'Keita of Mali and Sukarno at Andrews, Md., with the Belgrade conference''s message to Kennedy and Khrushchev. Kennedy''s reply, Sept. 13: careful consideration; negotiation without preparation risks failure; none under threat; on Berlin the United States will honor its commitments.'
    n: 'Remarks of Welcome to President Sukarno of Indonesia and President Keita of Mali at Andrews Air Force Base, [1961 Pub. Papers 597](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=655) (Sept. 12, 1961); Statement by the President Following the Visit of President Sukarno and President Keita, [1961 Pub. Papers 601](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=659); Letter to the Presidents of Indonesia and Mali Concerning the Message and Declaration of the Belgrade Conference, [1961 Pub. Papers 602](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=660) (Sept. 13, 1961, released Sept. 14). [[w.rakove-kennedy-johnson-and-the]]; [[w.muehlenbeck-betting-on-the-africans]]. See [[cal.1961-09-01.testing]]. Names: Keita, Sukarno, Khrushchev.'
    tags: [name:keita-modibo, name:sukarno, name:kennedy-john-f, name:khrushchev-nikita-s]
  - id: cal.1961-09-13.crime-and-hijacking
    when: Sept. 13
    date: '1961-09-13'
    thread: crime-and-hijacking
    also: [robert-kennedy]
    c: 'Robert Kennedy''s organized-crime bills signed: the Wire Act, [75 Stat. 491](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg491.pdf), the Travel Act, [75 Stat. 498](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg498-2.pdf), and the wagering-paraphernalia act, [75 Stat. 492](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg492-2.pdf).'
    n: '[[w.goldfarb-perfect-villains-imperfect-heroes]]; [[w.navasky-kennedy-justice]]. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-09-13.opinion
    when: Sept. 13
    date: '1961-09-13'
    thread: opinion
    also: [defense]
    c: 'Gallup, Aug. 24–29: own chances of living through an all-out nuclear war, very good 9 percent, even 40, poor 43.'
    n: '[[w.gallup-poll]], III, 1734.'
  - id: cal.1961-09-13.georgia-atlanta
    when: Sept. 13
    date: '1961-09-13'
    thread: georgia
    also: [mayors, elections-1961]
    c: Atlanta's primary for mayor, Hartsfield retiring. Allen, lately president of the Chamber of Commerce, 37,398; Maddox, a restaurant owner and segregationist, 21,091; three others 41,355. Runoff between Allen and Maddox.
    n: '*Atlanta Constitution*, Sept. 14, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-09-14_94_76)). [[w.allen-mayor]]; [[w.kruse-white-flight]]; [[w.stone-regime-politics]]; [[w.short-everything-is-pickrick]]. Names: Allen, Maddox, Hartsfield.'
    tags: [name:allen-ivan-jr, name:maddox-lester, name:hartsfield-william-b, state:ga, city:atlanta]
  - id: cal.1961-09-15.testing
    when: Sept. 15
    date: '1961-09-15'
    thread: testing
    c: First U.S. underground test of the series in Nevada.
    n: '[U.S. Department of Energy, *United States Nuclear Tests, July 1945 through September 1992*, DOE/NV-209, rev. 16 (2015), 16–17](https://www.osti.gov/servlets/purl/1351809#page=36); [FRUS 1961–63, VII, doc. 74](https://history.state.gov/historicaldocuments/frus1961-63v07/d74). See [[cal.1961-09-01.testing]].'
  - id: cal.1961-09-15.opinion
    when: Sept. 15
    date: '1961-09-15'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, Aug. 24–29: if East Germany closes the roads and air access to Berlin, fight the way in, 64 percent; not, 19.'
    n: '[[w.gallup-poll]], III, 1735.'
  - id: cal.1961-09-15.europe-and-the-alliance
    when: Sept. 15–17
    date: '1961-09-15'
    thread: europe-and-the-alliance-turkey
    also: [middle-east]
    c: 'Turkey. The Yassiada court''s verdicts on the Democratic Party''s leaders: fifteen sentenced to death. Sept. 15, Kennedy''s concern, through Rusk and Hare: the executions to be postponed. The Foreign Minister to Hare: "absolutely nothing further" to be done. Eleven sentences commuted; the old President spared for his age. Menderes''s Foreign and Finance Ministers hanged, Sept. 16; Menderes, Sept. 17.'
    n: '[FRUS 1961–63, XVI, doc. 370](https://history.state.gov/historicaldocuments/frus1961-63v16/d370). See [[cal.1960-05-27.europe-and-the-alliance]]. Names: Menderes, Gursel, Rusk, Hare, Kennedy.'
    tags: [name:kennedy-john-f, name:rusk-dean, name:hare-raymond-a, name:menderes-adnan, name:gursel-cemal]
  - id: cal.1961-09-17.vietnam
    when: Sept. 17–18
    date: '1961-09-17'
    thread: vietnam
    c: Phước Thành. Viet Cong battalions take the capital of the new province, on the edge of War Zone D, the night of Sept. 17–18, and hold it some hours; the province chief and his assistant executed in the market place. The first provincial capital taken.
    n: '[FRUS 1961–63, I, doc. 135](https://history.state.gov/historicaldocuments/frus1961-63v01/d135) (Nolting, Sept. 20). [[w.vietnam-victory-in-vietnam]], 85 (the 500th Battalion of Military Region 7, with district local forces; the town held three days; 600 weapons taken). Check: the capital''s name, and the three days of Hanoi''s account against the embassy''s hours.'
  - id: cal.1961-09-18.congo
    when: Sept. 18
    date: '1961-09-18'
    thread: congo
    c: Hammarskjöld killed in a crash near Ndola on his way to meet Tshombe.
    n: 'Statement by the President on the Death of Dag Hammarskjold, [1961 Pub. Papers 605](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=663). [FRUS 1961–63, XX, doc. 118](https://history.state.gov/historicaldocuments/frus1961-63v20/d118). See [[cal.1961-02-13.congo]]. The UN inquiries of 2015–24 reopened the cause. Names: Hammarskjöld, Tshombe.'
    tags: [name:hammarskjold-dag, name:tshombe-moise]
  - id: cal.1961-09-18.vietnam
    when: Sept. 18
    date: '1961-09-18'
    thread: vietnam
    c: Shortly after midnight. About three Viet Cong battalions take Phước Vĩnh, capital of Phước Thành province, and hold it for hours; the province chief and his assistant executed in the market place. The first provincial capital taken.
    n: FRUS 1961–63, I, docs. [135](https://history.state.gov/historicaldocuments/frus1961-63v01/d135) (Nolting, Sept. 20), [138](https://history.state.gov/historicaldocuments/frus1961-63v01/d138). [[w.miller-misalliance]], 227. See [[cal.1961-01-28.vietnam]].
    tags: [province:binh-duong]
  - id: cal.1961-09-19.rules
    when: Sept. 19
    date: '1961-09-19'
    thread: rules
    c: Senate refuses cloture on the motion to take up the Rule XXII change, [37–43](https://voteview.com/rollcall/RS0870193). The filibuster rule stands for the session.
    n: 'S. Rep. No. 87-870 (1961). Senate cloture table, 87th Cong. ([senate.gov](https://www.senate.gov/legislative/cloture/87.htm)). See [[cal.1961-01-11.rules]]. Names: Mansfield, Russell.'
    tags: [name:mansfield-mike, name:russell-richard-b]
  - id: cal.1961-09-19.space
    when: Sept. 19
    date: '1961-09-19'
    thread: space
    c: NASA names Houston for the Manned Spacecraft Center. Albert Thomas held NASA's appropriations.
    n: '[NASA, *Aeronautical and Astronautical Events of 1961*, H. Comm. on Science and Astronautics, 87th Cong. (Comm. Print 1962), 47–48](https://www.govinfo.gov/content/pkg/GOVPUB-Y4_SCI2-PURL-gpo157844/pdf/GOVPUB-Y4_SCI2-PURL-gpo157844.pdf#page=52). [[w.lambright-powering-apollo]]. Names: Thomas.'
    tags: [name:thomas-albert]
  - id: cal.1961-09-19.berlin-and-vienna
    when: Sept. 19
    date: '1961-09-19'
    thread: berlin-and-vienna
    c: Clay arrives in Berlin.
    n: '[[w.smith-lucius-d-clay]]. The tank confrontation at Checkpoint Charlie comes [[cal.1961-10-27.berlin-and-vienna]]. Names: Clay.'
    tags: [name:clay-lucius-d]
  - id: cal.1961-09-21.program
    when: Sept. 21
    date: '1961-09-21'
    thread: program
    c: 'Mutual Educational and Cultural Exchange Act signed, [75 Stat. 527](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg527.pdf): the Fulbright–Hays Act.'
    n: '[[w.woods-fulbright]]. See [[cal.1961-01-30.program]]. Names: Fulbright, Hays.'
    tags: [name:fulbright-j-william, name:hays-wayne-l, name:kennedy-john-f]
  - id: cal.1961-09-21.defense-soviet-forces
    when: Sept. 21
    date: '1961-09-21'
    thread: defense-soviet-forces
    c: NIE 11-8/1-61, Strength and Deployment of Soviet Long Range Ballistic Missile Forces. 10–25 launchers able to fire ICBMs at the United States, few more in the months ahead; 75–125 by mid-1963. 350–450 medium and intermediate launchers in 1962–63. Air Force intelligence, not printed in the text, about 50 now, 250 by mid-1963.
    n: '[FRUS 1961–63, VIII, doc. 45](https://history.state.gov/historicaldocuments/frus1961-63v08/d45). See [[cal.1960-02-09.defense-soviet-forces]]. Made public: FRUS 1961–63, VIII (1996).'
    tags: [name:dulles-allen-w]
  - id: cal.1961-09-22.peace-corps
    when: Sept. 22
    date: '1961-09-22'
    thread: peace-corps
    also: [robert-kennedy]
    c: Peace Corps Act signed, [75 Stat. 612](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg612.pdf). Juvenile delinquency act signed the same day, [75 Stat. 572](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg572.pdf), Robert Kennedy's committee behind it.
    n: 'Statutes (K–J Cong. II.J.2). [[w.lemann-promised-land]], on the delinquency program as seed of community action. Names: Robert Kennedy.'
    tags: [name:kennedy-robert-f, name:kennedy-john-f]
  - id: cal.1961-09-22.freedom-rides
    when: Sept. 22
    date: '1961-09-22'
    thread: freedom-rides
    also: [desegregation-public-places]
    c: The ICC orders segregation signs out of interstate terminals from Nov. 1.
    n: '[Interstate Commerce Commission, No. MC-C-3358, 26 Fed. Reg. 9166](https://www.govinfo.gov/app/details/FR-1961-09-29) (Sept. 29, 1961). See [[cal.1961-05-04.freedom-rides]]; [[cal.1961-05-29.freedom-rides]]. [[w.arsenault-freedom-riders]].'
  - id: cal.1961-09-22.georgia-atlanta
    when: Sept. 22
    date: '1961-09-22'
    thread: georgia
    also: [mayors, elections-1961]
    c: 'Atlanta''s runoff for mayor: Allen 64,313, Maddox 36,091; Allen 64.1 percent.'
    n: '*Atlanta Constitution*, Sept. 23, 1961 ([archive.org](https://archive.org/details/per_atlanta-constitution_1961-09-23_94_84)). See [[cal.1961-09-13.georgia-atlanta]]. Names: Allen, Maddox.'
    tags: [name:allen-ivan-jr, name:maddox-lester, state:ga, city:atlanta]
  - id: cal.1961-09-22.middle-east
    when: Sept. 22
    date: '1961-09-22'
    thread: middle-east-kuwait
    c: Diplomatic relations with Kuwait, at its request of Sept. 5. The consulate made an embassy, under a chargé d'affaires; no ambassador named.
    n: FRUS 1961–63, XVII, doc. [106](https://history.state.gov/historicaldocuments/frus1961-63v17/d106) (editorial note). See [[cal.1961-06-25.middle-east]].
  - id: cal.1961-09-23.civil-rights-the-executive
    when: Sept. 23
    date: '1961-09-23'
    thread: civil-rights-the-executive
    c: Thurgood Marshall nominated to the Second Circuit; recess-appointed in October. Eastland's subcommittee holds the confirmation for a year.
    n: '[Cong. Rec., Senate, Sept. 23, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt16/pdf/GPO-CRECB-1961-pt16-2-2.pdf). [[w.williams-thurgood-marshall]]; [[w.navasky-kennedy-justice]]. Names: Marshall, Eastland.'
    tags: [name:marshall-thurgood, name:eastland-james-o]
  - id: cal.1961-09-24.opinion
    when: Sept. 24
    date: '1961-09-24'
    thread: opinion
    c: 'Gallup, Aug. 24–29: would vote for a well-qualified Catholic nominated for President by their party, 82 percent; would not, 13.'
    n: '[[w.gallup-poll]], III, 1735.'
  - id: cal.1961-09-25.europe-and-the-alliance-cyprus
    when: Sept. 25
    date: '1961-09-25'
    thread: cyprus
    c: 'NSAM 98 on Cyprus: a more active American role, to contain and reduce Communist strength; Britain, Greece and Turkey to be urged to do more.'
    n: '[NSAM No. 98](https://history.state.gov/historicaldocuments/frus1961-63v16/d250) (Sept. 25, 1961). [FRUS 1961–63, XVI, doc. 249](https://history.state.gov/historicaldocuments/frus1961-63v16/d249) (Battle, Sept. 7). See [[cal.1961-08-23.europe-and-the-alliance]]. Names: Kennedy.'
    tags: [name:kennedy-john-f, name:bundy-mcgeorge]
  - id: cal.1961-09-25.testing
    when: Sept. 25
    date: '1961-09-25'
    thread: testing
    c: Address to the UN General Assembly a week after Hammarskjöld's death. Against the troika; for disarmament; the sword of Damocles.
    n: 'Address in New York City Before the General Assembly of the United Nations, [1961 Pub. Papers 618](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=676) (Sept. 25, 1961). Recording (K–J Adm. II.I). Names: Hammarskjöld.'
    tags: [name:kennedy-john-f, name:hammarskjold-dag]
  - id: cal.1961-09-25.mississippi
    when: Sept. 25
    date: '1961-09-25'
    thread: mississippi
    c: Herbert Lee, a farmer working with Moses, shot dead at the Liberty cotton gin by state representative E.H. Hurst. A coroner's jury finds self-defense.
    n: 'A. L. Hopkins, [report to the Sovereignty Commission, Sept. 29, 1961](https://da.mdah.ms.gov/sovcom/document/images/png/cd03/023393), SCR ID 2-60-0-24-1-1-1, 1: "Monday morning, September 25, 1961," Hurst and Lee at "Westbrook''s gin at Osyka"; the coroner''s jury cleared Hurst; a preliminary hearing at Liberty, Sept. 26, ruled self-defense. Robert Moses, [Report Concerning the Louis Allen Case](https://www.wisconsinhistory.org/record/multi/W01DRZ7) (SNCC, 1964, after Jan. 31), 1: "murdered on September 30, 1961." Civil Rights Division, [Notice to Close File, Louis Allen](https://www.justice.gov/crt/case-document/file/1194136/dl) (May 19, 2015), 3, from the FBI''s files: Sept. 25 (printed "1964"). The literature: Sept. 25. [[w.carson-in-struggle]]; [[w.branch-parting-the-waters]]; [[w.dittmer-local-people]], 109; [[w.payne-ive-got-the-light]]. Check: the gin''s place (Hopkins: Osyka); the coroner''s inquest. See [[cal.1961-08.mississippi]]. Names: Lee, Moses, Hurst.'
    tags: [name:moses-robert-p, name:lee-herbert, name:hurst-e-h]
  - id: cal.1961-09-26.testing
    when: Sept. 26
    date: '1961-09-26'
    thread: testing
    c: Arms Control and Disarmament Act signed, [75 Stat. 631](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg631.pdf). ACDA created; William C. Foster director.
    n: 'Statute (K–J Cong. II.J.2). [[w.seaborg-kennedy-khrushchev-and-the]]; [[w.clarke-politics-of-arms-control]]. Names: Foster.'
    tags: [name:foster-william-c, name:kennedy-john-f]
  - id: cal.1961-09-26.immigration
    when: Sept. 26
    date: '1961-09-26'
    thread: immigration
    c: 'Immigration and Nationality Act amended, [75 Stat. 650](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg650.pdf): eligible orphans adopted by citizens admitted outside the quotas; one procedure for court review of deportation orders, by petition within six months; quotas revised as colonies become independent; relatives of citizens and residents admissible despite tuberculosis. The House had passed the review bill, H.R. 187, July 10, [304–59](https://voteview.com/rollcall/RH0870054).'
    n: Statute (K–J Cong. II.J.2). S. 2237, 87th Cong. [[w.reimers-still-the-golden-door]]; [[w.tichenor-dividing-lines]]. See [[cal.1960-03-17.immigration]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-26.middle-east-johnson-plan
    when: Sept. 26
    date: '1961-09-26'
    thread: middle-east-johnson-plan
    c: New York. Joseph Johnson, back from Beirut, Amman, Cairo and Israel, Sept. 1–17, reports orally to the PCC; and to Rusk, at the mission to the UN.
    n: 'FRUS 1961–63, XVII, doc. [112](https://history.state.gov/historicaldocuments/frus1961-63v17/d112), nn. 1–2. See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Rusk.'
    tags: [name:johnson-joseph-e, name:rusk-dean]
  - id: cal.1961-09-27.transition-and-staff
    when: Sept. 27
    date: '1961-09-27'
    thread: transition-and-staff
    c: John McCone named to succeed Dulles at the CIA. First session of the 87th Congress adjourns.
    n: 'Remarks in Newport Upon Announcing the Appointment of John McCone as Director of the Central Intelligence Agency, [1961 Pub. Papers 631](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=689). [Cong. Rec., Senate, Sept. 26, 1961](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt16/pdf/GPO-CRECB-1961-pt16-4-1.pdf). [[w.robarge-john-mccone-as-director]]; [[w.grose-gentleman-spy]]. The session''s record: CQ Almanac 1961; [[w.sundquist-politics-and-policy]] (K–J Cong. II.B). Names: McCone, Dulles.'
    tags: [name:mccone-john-a, name:dulles-allen-w, name:kennedy-john-f, appropriations:87-1]
  - id: cal.1961-09-27.opinion
    when: Sept. 27
    date: '1961-09-27'
    thread: opinion
    c: 'Gallup, Aug. 24–29: would vote for a well-qualified Jew nominated by their party, 68 percent; not, 23. For a Negro, 50; not, 41.'
    n: '[[w.gallup-poll]], III, 1736.'
  - id: cal.1961-09-28.middle-east
    when: Sept. 28
    date: '1961-09-28'
    thread: middle-east-syria
    c: Syria. Army units revolt at Damascus and take Syria out of the United Arab Republic.
    n: FRUS 1961–63, XVII, doc. [109](https://history.state.gov/historicaldocuments/frus1961-63v17/d109). [[w.kerr-arab-cold-war]]; [[w.little-new-frontier-on-the]]; [[w.seale-asad-of-syria]]; [[w.gerges-superpowers-and-the-middle]].
  - id: cal.1961-09-29.open-housing-wa
    when: Sept. 29
    date: '1961-09-29'
    thread: open-housing
    also: [states-and-cities]
    c: '*O''Meara v. Washington State Board Against Discrimination*, [58 Wash. 2d 793](https://static.case.law/wash-2d/58/case-pdfs/0793-01.pdf): the Washington Supreme Court, 5–4, holds void the legislature''s amendment of 1957 bringing publicly assisted housing under the Law Against Discrimination. A class drawn by a public loan on the home arbitrary: equal protection denied under the Fourteenth Amendment, a special privilege under Art. I, § 12. Foster for the court; Mallery, with Ott, concurring, private property taken for private use; Rosellini for the four in dissent.'
    n: '*O''Meara v. Washington State Board Against Discrimination*, [58 Wash. 2d 793](https://static.case.law/wash-2d/58/case-pdfs/0793-01.pdf), 365 P.2d 1 (1961). [[w.taylor-forging-of-a-black]].'
    tags: [state:wa]
  - id: cal.1961-09.legislatures-ca
    when: Sept.
    date: 1961-09
    thread: state-legislatures
    c: California. Unruh, Assemblyman from Los Angeles County, elected Speaker of the Assembly. Check the day.
    n: '[[w.boyarsky-big-daddy]]; [[w.cannon-ronnie-and-jesse]]. Names: Unruh.'
    tags: [state:ca, name:unruh-jesse-m]
  - id: cal.1961-09-29.soviet-union
    when: Sept. 29–30
    date: '1961-09-29'
    thread: soviet-union
    also: [berlin-and-vienna]
    c: 'Khrushchev''s first private letter to Kennedy, dated Sept. 29, handed by Bolshakov to Salinger at the Carlyle Hotel, New York, Sept. 30. Berlin and Germany: a special emissary to Moscow, or Thompson, to discuss them.'
    n: 'FRUS 1961–63, VI, doc. [21](https://history.state.gov/historicaldocuments/frus1961-63v06/d21); V, doc. [120](https://history.state.gov/historicaldocuments/frus1961-63v05/d120). [[w.salinger-with-kennedy]], 198; [[w.fursenko-khrushchevs-cold-war]]; [[w.beschloss-crisis-years]]. See [[cal.1961-05-09.berlin-and-vienna]]. Names: Khrushchev, Bolshakov, Salinger, Thompson.'
    tags: [name:khrushchev-nikita-s, name:kennedy-john-f, name:bolshakov-georgi, name:salinger-pierre, name:thompson-llewellyn-e]
  - id: cal.1961-09.oil
    when: Sept.
    date: 1961-09
    thread: oil
    c: 'Libya. First crude oil exports: Esso''s 108-mile, 30-inch line from the Zelten field to its terminal at Marsa el-Brega in operation. Oil first found June 1959. Brega inaugurated Oct. 25.'
    n: Bureau of Mines, *Minerals Yearbook 1963*, IV, 975, 981 ([archive.org](https://archive.org/details/pub_usgov-minerals-yearbook_1963_4)). [[w.yergin-prize]].
  - id: cal.1961-09-29.middle-east-johnson-plan
    when: Sept. 29
    date: '1961-09-29'
    thread: middle-east-johnson-plan
    c: 'Joseph Johnson to Cleveland and Talbot. The Arabs insist on repatriation first; Israel on a change in Arab attitudes. Ben Gurion the "roughest" talk. A hard core of refugees for at least fifteen years; UNRWA or its like needed. His "hunch": Israel might take up to 10,000 a year for two or three years if the Arabs moved too. The refugees to be given a meaningful choice.'
    n: 'FRUS 1961–63, XVII, doc. [112](https://history.state.gov/historicaldocuments/frus1961-63v17/d112). See [[cal.1961-08-21.middle-east-johnson-plan]]. Names: Johnson, Cleveland, Talbot, Ben Gurion.'
    tags: [name:johnson-joseph-e, name:cleveland-j-harlan, name:talbot-phillips, name:ben-gurion-david]
  - id: cal.1961-09.vietnam
    when: Sept.
    date: 1961-09
    thread: vietnam
    c: 'The Politburo and the Central Military Party Committee approve the General Staff''s plan for the South, 1961–63: besides recruits there, 30,000 to 40,000 men trained in the North to be sent down; Group 559, the trail''s transport group, grown to 2,000–3,000.'
    n: '[[w.vietnam-victory-in-vietnam]], 80, 456 n.26 (sent down the trail in 1961, 7,664 men). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1961-02-25.vietnam]].'
  - id: cal.1961-09-30.vietnam
    when: Sept. 30
    date: '1961-09-30'
    thread: vietnam
    c: 'Diệm, in the evening, to Felt, McGarr, and Nolting: a bilateral defense treaty with the United States, "like the one with Taiwan." His fear: Laos, infiltration, SEATO held back by Britain and France.'
    n: '[FRUS 1961–63, I, doc. 142](https://history.state.gov/historicaldocuments/frus1961-63v01/d142) (Nolting, Oct. 1). [[w.miller-misalliance]], 227. See [[cal.1961-01-28.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 649–50 (1971). Names: Diệm, Felt, McGarr, Nolting.'
    tags: [name:ngo-dinh-diem, name:felt-harry-d, name:mcgarr-lionel-c, name:nolting-frederick-e-jr]
