  - id: cal.1961-09-02.testing
    when: Sept. 2
    date: '1961-09-02'
    thread: testing
    c: 'Rusk calls a meeting on taking the Soviet resumption of tests to the UN: Cleveland, Bohlen, Dean, McCloy and Schlesinger. Dean, McCloy and Bohlen argue against: nothing gained, and freedom of action restricted. McCloy to Cleveland on world opinion: "I don''t believe in world opinion. The only thing that matters is power." He believes the Russians "have been cheating us all along." Bohlen disputes him. Rusk proposes a meeting with the President on Tuesday. By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 134. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-09-01.testing]]. Names: Rusk, Cleveland, Dean, McCloy, Schlesinger, Bohlen. Check: the day; the page has the meeting "the next morning" after the talk with Kennedy of Friday, Sept. 1.'
    tags: [name:rusk-dean, name:cleveland-j-harlan, name:dean-arthur-h, name:mccloy-john-j, name:schlesinger-arthur-m-jr, name:bohlen-charles-e]
  - id: cal.1961-09-02.china-leadership
    when: Sept. 2
    date: '1961-09-02'
    thread: china-leadership
    also: [vietnam-hanoi]
    c: 'Chen Yi, at the reception given by Trần Tử Bình, the Vietnamese ambassador, for Vietnam''s national day: he stresses China''s firm backing for the Soviet statement on nuclear tests. The socialist countries, for the sake of world peace, must firmly take every possible measure to strengthen their defense.'
    n: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 203 (Sept. 2, 1961). Names: Chen Yi.'
