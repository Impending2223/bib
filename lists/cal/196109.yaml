    tags: [name:thompson-llewellyn-e, name:rusk-dean, name:gromyko-andrei, name:khrushchev-nikita-s]
  - id: cal.1961-09-04.foreign-aid
    when: Sept. 4
    date: '1961-09-04'
    thread: foreign-aid
    c: Foreign Assistance Act signed, [75 Stat. 424](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg424-2.pdf). AID created; Congress denies the Treasury borrowing, granting long-term authorizations instead.
    n: Statute (K–J Cong. II.J.2). See [[cal.1961-03-22.foreign-aid]].
    tags: [name:kennedy-john-f]
  - id: cal.1961-09-04.berlin-and-vienna
    when: Sept. 4
    date: '1961-09-04'
    thread: berlin-and-vienna
    c: 'The White House. The President lays out a program for negotiating on Berlin: the legal dispute to the World Court; the United Nations to West Berlin; the autobahn under the UN; a UN plebiscite in Berlin; a nonaggression pact between NATO and the Warsaw Pact. Perhaps for his address to the General Assembly. Stevenson: all excellent but moving the UN. Kennedy: "I don''t think enough of the UN not to be prepared to trade it for a nuclear war." By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 430–31. To check: Schlesinger''s journal, Sept. 5, 1961 (cited by [[w.schlesinger-robert-kennedy-and-his]], 431 n.61). See [[cal.1961-08-21.berlin-and-vienna]]. Names: Kennedy, Stevenson, Schlesinger.'
    src:
      c: 55ba2000
      rows:
        - 'w.schlesinger-robert-kennedy-and-his 430–31: all'
        - 'via w.schlesinger-robert-kennedy-and-his 431 n.61: all'
    tags: [name:kennedy-john-f, name:stevenson-adlai-e, name:schlesinger-arthur-m-jr]
  - id: cal.1961-09-04.cuba
    when: Sept. 4
    date: '1961-09-04'
    thread: cuba
    also: [soviet-union]
    c: 'Castro to Khrushchev, the covert attacks increased: more military aid; Sergio del Valle, the army''s chief of staff, to Moscow to negotiate it. The list: eight divisions of surface-to-air missiles, 360 SA-2s, 412 tanks, 100 transports, 282 Zenith cannon.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 396 and n.40. To check: Castro to Khrushchev, Sept. 4, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 396 n.39). Names: Castro, Khrushchev.'
    src:
      c: 151a7a52
      rows:
        - 'w.fursenko-khrushchevs-cold-war 396 and n.40: all'
        - 'via w.fursenko-khrushchevs-cold-war 396 n.39: A'
    tags: [name:castro-fidel, name:khrushchev-nikita-s]
