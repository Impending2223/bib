      c: ee7fc72b
      rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645: all'
        - 'w.sorensen-kennedy 620: all'
    tags: [name:kennedy-john-f, name:macmillan-harold, name:khrushchev-nikita-s]
  - id: cal.1961-09-03.berlin-and-vienna
    when: Sept. 3
    date: '1961-09-03'
    thread: berlin-and-vienna
    also: [soviet-union]
    c: State instructs Thompson to propose talks between Rusk and Gromyko at the UN. Thompson, outside Moscow, takes some days to reach Khrushchev; by mid-September Khrushchev approves talks from Sept. 21.
    n: '[[w.fursenko-khrushchevs-cold-war]], 391–92. To check: Rusk to Thompson, Sept. 3, 1961; Thompson to Rusk, Sept. 7, 1961, FRUS 1961–63, XIV, 388–89, 394–95 (cited by [[w.fursenko-khrushchevs-cold-war]], 391 nn.16–17). See [[cal.1961-09-21.berlin-and-vienna]]. Names: Thompson, Rusk, Gromyko, Khrushchev.'
