  - id: cal.1961-09-02.berlin-and-vienna
    when: Sept. 2
    date: '1961-09-02'
    thread: berlin-and-vienna
    c: Early evening. The Joint Chiefs recommend to the White House that Norstad, not Washington, decide on fighter protection in the air corridors; Taylor agrees; the orders issued at once. Norstad asks leave to retaliate against anti-aircraft sites; Rusk will not act alone, without the allies.
    n: '[[w.poole-joint-chiefs-of-staff]], 150. See [[cal.1961-09-01.berlin-and-vienna-2]]. Names: Norstad, Taylor, Rusk.'
