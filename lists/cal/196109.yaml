  - id: cal.1961-09-01.berlin-and-vienna-3
    when: Sept. 1
    date: '1961-09-01'
    thread: berlin-and-vienna
    c: 'Kennedy authorizes more aircraft to Europe after the Soviet announcement of testing. LeMay agrees with Norstad at Paris: twenty B-47s to Spain, freeing three F-100 squadrons for non-nuclear missions; four F-100 squadrons to France and Germany, as a training exercise.'
    n: '[[w.poole-joint-chiefs-of-staff]], 150–51. Names: Kennedy, LeMay, Norstad.'
