    date: '1961-09-20'
    place: washington
    thread: program
    c: 'The White House, dinner with Joseph and Susan Mary Alsop, Schlesinger and his wife, by Schlesinger''s journal. Kennedy on the business community: he understands FDR''s attitude, and wishes there were no Cold War, so that he could debate the future of America with businessmen. On the Metropolitan Club, whose Board has reprimanded George Lodge for bringing George Weaver, a Negro, to lunch: Robert Kennedy, Lodge, Bartlett and others have resigned; he does not see how anyone could remain. On Berlin: the American people have no conception what a nuclear war is like.'
    n: '[[w.schlesinger-journals]], 136–37. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-09-19.robert-kennedy]]. Names: Kennedy, Alsop, Schlesinger, Robert Kennedy, Lodge, Weaver, Bartlett.'
