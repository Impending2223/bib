  - id: cal.1961-09-18.china-leadership
    when: Sept. 18
    date: '1961-09-18'
    place: nanchang
    thread: china-leadership
    also: [farm]
    c: 'At Nanchang Zhou Enlai, with Governor Shao Shiping, inspects city works and tells the provincial committee to lift the economy, farming above all, to save, and care for the masses'' living. To the Communist Labor University: serve the villages and the poor and lower-middle peasants. At the Aug. 1 Uprising museum: stress Mao Zedong Thought and Jinggangshan, and the part of Zhu De, He Long, Ye Ting and Liu Bocheng. At dinner he asks Jiangxi for 300 million jin more grain for export, harder than it sounds but possible, as its rations are higher and it has reserves.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 432 (Sept. 18, 1961). Made public: 1997. Names: Zhou Enlai.'
    tags: [polity:prc, name:zhou-enlai, vis:only:prc]
  - id: cal.1961-09-18.china-leadership-2
    when: Sept. 18
    date: '1961-09-18'
    thread: china-leadership
    also: [china]
    c: Liu Shaoqi receives the credentials of Sweden's new ambassador (切尔·厄贝尔 in the chronology). China wants better relations with Sweden's people and government, and with those of every country; Sweden was lucky not to be drawn into the two world wars, China was and has had civil wars for decades; China is a large country but a backward one, and needs a peaceful international environment for decades or centuries.
    n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 539 (Sept. 18, 1961). Made public: 1996. Names: Liu Shaoqi.'
    tags: [polity:prc, polity:sweden, vis:only:prc+sweden@B-D, name:liu-shaoqi]
