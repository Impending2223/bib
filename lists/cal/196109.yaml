  - id: cal.1961-09-05.press-and-broadcasting
    when: Sept. 5
    date: '1961-09-05'
    thread: press-and-broadcasting
    also: [berlin-and-vienna, soviet-union]
    c: 'Moscow. Khrushchev with Sulzberger of the *New York Times*, five hours, invited by Yuri Zhukov''s cable of Aug. 26. Material for front-page articles, and a note for Kennedy alone: "some sort of informal contact . . . to find a means of settling the crisis without damaging the prestige of the United States"; agreement "in principle with the peace treaty and a free city." Sulzberger mails it Sept. 10.'
    n: '[[w.fursenko-khrushchevs-cold-war]], 388, 390. To check: Sulzberger, *The Last of the Giants* (1970), 786, 801–2 (cited by [[w.fursenko-khrushchevs-cold-war]], 388 n.1, 390 n.12). See [[cal.1961-08-29.berlin-and-vienna]]. Names: Khrushchev, Sulzberger, Kennedy.'
