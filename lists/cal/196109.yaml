  - id: cal.1961-09-01.testing
    when: Sept. 1
    date: '1961-09-01'
    thread: testing
    c: The Soviet Union ends the three-year moratorium with an atmospheric test. The Belgrade nonaligned conference opens the same day.
    n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 331–32; [[w.schlesinger-journals]], 132–33 (Friday, Sept. 1: McCloy, Dean, Bundy and Schlesinger with Kennedy at 11, the statement for Dean to issue written by Schlesinger; at 3 Bundy''s call that a Soviet test seems to have taken place; two statements brought to Kennedy at the Mansion, in a bathrobe: McCloy for announcing resumption, Murrow and Schlesinger against; he "was not inclined to announce our resumption at this point but did not know how much longer he could refrain"; later he decides against the Security Council: "It would look hypocritical"). [FRUS vol. 7](https://history.state.gov/historicaldocuments/frus1961-63v07). [[w.schlesinger-thousand-days-1965]], 459–60. [[w.rusk-as-i-saw-it-1990]], 253–54 (the moratorium broken). To check: [[w.seaborg-kennedy-khrushchev-and-the]]. Names: Wiesner. Check: Rusk dates the Soviet series August 1961 (253–54).'
    src:
      c: faf630f2
      rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 331: A'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 332: B'
