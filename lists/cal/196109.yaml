  - id: cal.1961-09-03.economy
    when: Sept. 3
    date: '1961-09-03'
    thread: economy
    c: 'The 1961 minimum wage takes effect: $1.15 an hour, $1.25 from 1963. Newly covered retail and service workers start at $1.00.'
    n: '[75 Stat. 65](https://www.govinfo.gov/content/pkg/STATUTE-75/pdf/STATUTE-75-Pg65.pdf) (1961). Statement by the President on the Increase in the Minimum Wage, [1961 Pub. Papers 587](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645). See [[cal.1961-03-24.program]] (Program) and [[cal.1961-05-05.space]] (Space).'
  - id: cal.1961-09-03.testing
    when: Sept. 3
    date: '1961-09-03'
    thread: testing
    c: Hyannis Port, Mass. Kennedy and Macmillan, by joint statement, propose to Khrushchev that the three governments agree, effective at once, to no tests in the atmosphere; existing means of detection enough; representatives to meet at Geneva by Sept. 9.
    n: 'Joint Statement With Prime Minister Macmillan Proposing a Three-Power Agreement To End Atmospheric Nuclear Tests, [1961 Pub. Papers 587](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=645) (Sept. 3, 1961). [[w.sorensen-kennedy]], 620. See [[cal.1961-08-30.testing]]. Names: Kennedy, Macmillan, Khrushchev.'
