  - id: cal.1961-09-06.opinion
    when: Sept. 6
    date: '1961-09-06'
    thread: opinion
    also: [berlin-and-vienna]
    c: 'Gallup, Aug. 24–29: 90 percent have heard of the Berlin situation. Satisfied with the government''s handling, 66; dissatisfied, 21.'
    n: '[[w.gallup-poll]], III, 1734.'
  - id: cal.1961-09-06.desegregation-schools-dallas
    when: Sept. 6
    date: '1961-09-06'
    thread: desegregation-schools
    c: Dallas. Eighteen Black children enter first grade in formerly white schools, under the school board's stair-step plan, a grade a year, ordered by the Fifth Circuit. The NAACP protests the district's procedures for their entry.
    n: 'Statement by the President on the Peaceful Integration of Schools in the South and Southwest, [1961 Pub. Papers 591](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=649). *Boson v. Rippy*, [285 F.2d 43](https://static.case.law/f2d/285/case-pdfs/0043-01.pdf), 45–47 (5th Cir. 1960). Southern Methodist University, Underwood Law Library, ["Desegregating Dallas Schools: Background"](https://web.archive.org/web/20080101052239/http://library.law.smu.edu/disd/background.shtm) (archived). Check: the order and the count. To check: [[w.linden-desegregating-schools-in-dallas]]; [[w.phillips-white-metropolis]]; [[w.payne-big-d]]. See [[cal.1960-08-03.desegregation-schools-houston]].'
    tags: [state:tx, city:dallas]
  - id: cal.1961-09-06.conservation
    when: Sept. 6
    date: '1961-09-06'
    thread: conservation
    c: 'Senate passes the wilderness bill, S. 174, Anderson''s, [78–8](https://voteview.com/rollcall/RS0870175): a National Wilderness Preservation System. Refused: a motion to recommit, Sept. 5, [32–41](https://voteview.com/rollcall/RS0870172); Congress''s approval by concurrent resolution before primitive areas and wildlife preserves enter the system, [32–53](https://voteview.com/rollcall/RS0870173); exceptions by the Secretaries, not the President, [35–51](https://voteview.com/rollcall/RS0870174).'
    n: 'Wilderness Act (K–J Cong. II.J.2). [[w.sundquist-politics-and-policy]], 358–59 (Anderson''s bill; the vote; Allott''s amendment beaten, 53–32). To check: [[w.harvey-wilderness-forever]]; [[w.allin-politics-of-wilderness-preservation]]; [[w.nash-wilderness-and-the-american]]; [[w.smith-john-kennedy-stewart-udall]]. See [[cal.1961-02-23.conservation]]. Names: Anderson.'
