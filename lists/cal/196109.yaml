    date: '1961-09-18'
    thread: china
    also: [congo]
    c: 'The Chinese government decides to withdraw its embassy in the Republic of the Congo (Stanleyville) and to suspend diplomatic relations. A Foreign Ministry spokesman''s statement: the legitimate Congolese government under Deputy Premier Gizenga has announced its end, and the Leopoldville government keeps so-called diplomatic relations with Taiwan, so relations between the two countries must be suspended for a time. The Chinese people will always back the Congolese people in defending national independence and state unity and in their just struggle against imperialism and colonialism.'
