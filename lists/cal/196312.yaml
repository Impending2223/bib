    c: Seven FBI officials on King, nine hours at headquarters, two of them agents from Atlanta; Sullivan in the chair; Nichols one of the two. How to gather evidence of his private life, to expose him as "an immoral opportunist" and a "clerical fraud." Sullivan proposes microphones in his hotel rooms. The taps on his home and office in place since November.
    n: '[S. Rep. No. 94-755, Book III, 133 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=147) (the conference of Dec. 23, 1963, nine hours, at headquarters: Sullivan, Baumgardner, three other headquarters officials, two agents of the Atlanta office; the twenty-one proposals). [[w.garrow-bearing-the-cross]], 310 (a "mid-December conference"; the evidence of his private life, "an immoral opportunist" and "clerical fraud"; Sullivan''s microphones; the taps since November); [[w.branch-pillar-of-fire]], 195–97 (Monday, Dec. 23, seven officials in Baumgardner''s office, all day; Nichols one of the two Atlanta agents; the agenda; the plans for microphones in his hotel rooms; Sullivan''s report, "an immoral opportunist"; not "clerical fraud"); [[w.kotz-judgment-days]], 83–84 (Dec. 23, 1963, seven officials, nine hours at headquarters, Sullivan in the chair; field agents from Atlanta, not their number; "clerical fraud" and "an immoral opportunist," by Sullivan''s report); [[w.schlesinger-robert-kennedy-and-his]], 363 (the nine-hour session of Dec. 23, 1963); [[w.branch-parting-the-waters]], 919 (Sullivan''s nine-hour "war council," Nichols among those summoned; no day). Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). To check: "Questions to Be Explored at Conference 12/23/63 re Communist Influence in Racial Matters," House Select Committee on Assassinations, *Hearings*, vol. 6, 159–61 (cited by [[w.kotz-judgment-days]], 83 n.75); Sullivan to Belmont, Dec. 24, 1963, FBI file 100-3-116-684; Director to Attorney General, Jan. 17, 1964, FBI file 100-3-116 (cited by [[w.garrow-bearing-the-cross]], 310 n.19); Baumgardner to Sullivan, Dec. 19, 1963, FK-NR, Sullivan to Belmont, December 24, 1963, FK-NR (cited by [[w.branch-pillar-of-fire]], 195). See [[cal.1963-10-10.king]], [[cal.1963-12-19.king]]. Names: Sullivan, King.'
