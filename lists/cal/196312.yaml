  - id: cal.1963-12-14.china-leadership-5
    when: Dec. 14
    date: '1963-12-14'
    thread: china-leadership
    c: 'Mao to Liu Shaoqi, Deng Xiaoping and Peng Zhen, on an item in the General Office''s *Qunzhong fanying* no. 83: a political commissar, instructor or propagandist for each production team, a young literate who does not leave production, to take up political and ideological work among several hundred million villagers; in city industry, commerce and neighborhoods, political departments and offices and instructors from top to bottom on the army''s model. The Secretariat to take it up, then the Standing Committee.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVII, 144–145 (Dec. 14, 1963); [[w.peng-zhen-nianpu-1902]], IV, 307–308 (Dec. 14, 1963; Mao''s comment to Liu Shaoqi, Deng Xiaoping and Peng Zhen on a Heilongjiang propaganda cadre''s letter in *Qunzhong fanying* no. 83 proposing political commissars in production teams: perhaps a political commissar, instructor or propagandist in each team, a schooled man not off production; in industry, commerce and the streets political departments, offices and instructors as in the army; for the Secretariat, then the Standing Committee). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Qunzhong fanying no. 83, Dec. 13, 1963: "Political and ideological work in the villages needs strengthening," from a letter of Nov. 1963 by Fu Jinsheng, propaganda department of the Beian county committee, Heilongjiang (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 145 n.2). Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
