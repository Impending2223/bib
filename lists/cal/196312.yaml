    c: 'Zhou Enlai flies by way of Rangoon and Karachi to Cairo. At the airport his written statement: this is his first visit to the UAR and to the African continent; he salutes all the newly independent African states and peoples and all the peoples now in struggle. Chen Yi, who attended Kenya''s independence celebrations, reaches Cairo from Nairobi to go with him.'
    n: '[[w.zhou-enlai-nianpu-1949]], II, 600 (Dec. 14, 1963); [[w.zhou-enlai-waijiao-huodong]], 377–78 (Dec. 14, 1963; 上午, 路过卡拉奇时巴基斯坦外交秘书阿齐兹·艾哈迈德等到机场迎送; 到达开罗, 萨布里主席代表纳赛尔总统到机场迎接); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 308 (Dec. 10, 1963; Chen Yi, Vice-Premier and Foreign Minister, takes part in the Kenyan independence celebrations on the Chinese government''s behalf and calls on Prime Minister Jomo Kenyatta; the book''s day is Dec. 10, two days before the independence day of Dec. 12); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 308–309 (Dec. 14–21, 1963; Zhou visits the UAR officially at the invitation of President Nasser and Ali Sabri, Chairman of the Executive Council; he holds several talks with Nasser on Sino-UAR relations and matters of common concern); [[w.macfarquhar-origins-of-the-cultural]], III, 359 (Zhou and Chen Yi with several dozen aides on a ten-nation tour of Africa, mid-December 1963 to early February 1964); [[w.yang-shangkun-riji]], II, 334 (Dec. 14, 1963; Zhou''s party at Cairo at 5 p.m., by Rangoon and Karachi); [[w.chen-yi-nianpu]], 999 (Dec. 14, 1963, morning; Chen Yi at the airport welcomes Zhou at Cairo); [[w.friedman-shadow-cold-war]], 117 (the tour of Zhou Enlai and Chen Yi, late 1963 and early 1964: the UAR, Algeria, Morocco, Tunisia, Ghana, Mali, Guinea, Sudan, Ethiopia and Somalia; Kenya, Tanganyika and Zanzibar dropped after the mutiny in Tanganyika and the revolution in Zanzibar; to explain China''s side of the split and promote a second Bandung without the USSR; Zhou''s first trip to Africa); [[w.chang-friends-and-enemies]], 261 (Zhou Enlai and Chen Yi tour Africa in January 1964 to confirm friendly ties with Tunisia, Ghana, Mali, Guinea, Ethiopia and Somalia; soon after, fourteen African nations recognize Peking, fifteen left with Taipei). Continues 601. To check: [[w.adie-chou-en-lai-on]], 174–94 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 359 n.75). Names: Zhou Enlai, Chen Yi.'
