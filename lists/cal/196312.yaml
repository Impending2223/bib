    c: 'Mao to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua on industrial ministries learning from the army: proposals to set up political departments and instructors from the ministry down to the mine and works, with the "Four Firsts" and the "Three-Eight" style; he proposes to send several batches of good army cadres to do political work in industry, a batch a year, as in the Ministry of Petroleum: "it cannot be done otherwise."'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 16, 1963. [[w.jianguo-yilai-mao-zedong]], XVII, 147–149 (Dec. 16, 1963; Mao''s letter of Dec. 16 to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua with Bo Yibo''s letter of Dec. 15; the four sources of political cadres he proposes; the envelope''s instruction that Liu, Deng, Peng, Bo Yibo, Li Xiannian and Tan Zhenlin read it before it went on); [[w.macfarquhar-origins-of-the-cultural]], III, 437 (Mao''s note of Dec. 16, 1963 to Lin Biao and other senior officers, after Bo Yibo''s report that the ministries were following Daqing in learning from the PLA); [[w.mao-zedong-zhuan]], VI, ch. 72 (Dec. 16 Mao writes to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua that industry should learn from the army and set up political departments; he proposes batches of army cadres for it (n.28)). [[w.peng-zhen-nianpu-1902]], IV, 308 (Dec. 16, 1963; Peng Zhen, with Liu Shaoqi, Deng Xiaoping, Bo Yibo, Li Xiannian, Tan Zhenlin and others, receives Mao''s letter to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua on industry learning from the PLA: thought of for years, now time to apply it, with the oil ministry''s great results; cadres from the army, short courses in its divisions and regiments, the political academy, its political work rules adapted; on the 19th he has it printed for the Politburo and Secretariat); [[w.pu-weihua-zalan-jiu-shijie]], 31 (Mao''s letter to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua, quoted: without it the industrial departments'' millions of cadres and workers cannot be roused; the army''s work much advanced since Lin''s "four firsts" and "three-eight style"). Made public: 1993 ([[w.yibo-ruogan-zhongda-juece-yu-1991-93]]). To check: Bo Yibo to Mao Zedong, letter of Dec. 15, 1963, on the industrial ministries'' learning from the Liberation Army and the Petroleum Ministry''s political work (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 149 n.4); Mao Zedong to Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing and Xiao Hua, Dec. 16, 1963, in [[w.zedong-jianguo-yilai-mao-zedong]], 10, 454–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 437 n.48a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1150–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 437 n.48b); Mao Zedong 毛泽东, letter to Lin Biao 林彪, He Long 贺龙, Nie Rongzhen 聂荣臻, Luo Ruiqing 罗瑞卿 and Xiao Hua 萧华 (manuscript 手稿), Dec. 16, 1963 (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.28); [[w.zedong-jianguo-yilai-mao-zedong]], X, 454–455 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 31 n.51). Names: Mao Zedong, Lin Biao, He Long, Nie Rongzhen, Luo Ruiqing, Xiao Hua.'
