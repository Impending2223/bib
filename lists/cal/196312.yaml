  - id: cal.1963-12-13.robert-kennedy-2
    when: Dec. 13
    date: '1963-12-13'
    place: washington
    thread: robert-kennedy
    also: [democratic-party, transition-and-staff]
    c: 'Late afternoon, Robert Kennedy with Goodwin and Schlesinger at Justice, Harriman distressed by Mann''s coming appointment for Latin America: "Our power will last for just eleven months. ... After November 5th we''ll all be dead." The hundred men devoted to the purposes "must all stay in close touch"; "collective action." Of Johnson: "He knows all about politics and nothing about human beings." By Schlesinger''s journal.'
    n: '[[w.schlesinger-robert-kennedy-and-his]], 630–31; [[w.schlesinger-journals]], 214–15 (late afternoon, Goodwin and Schlesinger with Robert Kennedy: "The important thing for us to do now is to stick together. Our power will last for just eleven months. It will disappear the day of the election"; "There are a hundred men scattered through the government who are devoted to the purposes"; "He knows all about politics and nothing about human beings"; Schlesinger "more and more persuaded that he should go for the vice presidency"; the page has no Harriman or Mann and not "After November 5th we''ll all be dead"); [[w.goodwin-remembering-america]], 246–47 (Goodwin''s account: Schlesinger and Goodwin in the Attorney General''s office over Mann''s appointment; Robert Kennedy, pouring bourbon, takes a call: "He''s dead. Let him be dead"; Harriman''s words to him "last night": "I didn''t come down here to work for George Ball or Dean Rusk; I came to work for John Kennedy"; "We''re important to Johnson. I''m the most important because my name happens to be Kennedy. But we''re all important, if we act together"; "I''ve lost a brother, but that''s not what''s important"; of a Lubell column, Johnson: "Well, he''s already got the Negroes"; not the hour, the hundred men or the journal''s words); [[w.thomas-robert-kennedy]], 289 (no day, mid-December: "stay in close touch"). Check: the day and the words. [[w.goodwin-remembering-america]], 246–47, has Schlesinger and Goodwin call on Robert Kennedy on Monday, Dec. 16, 1963, after Mann''s appointment was announced (Dec. 14), and Robert Kennedy: "Remember after November fifth [the presidential election] we''re all done.". To check: Schlesinger, journal, Dec. 13, 1963 (cited by [[w.schlesinger-robert-kennedy-and-his]], 631 n.51–52); Goodwin, "The Structure Itself Must Change," *Rolling Stone*, June 6, 1974. Names: Robert Kennedy, Goodwin, Schlesinger, Harriman, Mann, Johnson.'
