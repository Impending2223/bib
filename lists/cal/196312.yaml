    when: Dec. 7
    date: '1963-12-07'
    thread: vietnam
    c: Mansfield to Johnson, with copies of his memoranda to Kennedy. The war perhaps not to be won in the South alone. A truce; a "diplomatic offensive," France the key; Cambodia "the principal prototype" of a peace in Southeast Asia.
    n: '[FRUS 1961–63, IV, doc. 355](https://history.state.gov/historicaldocuments/frus1961-63v04/d355). [[w.gibbons-u-s-government-and]], II, 215; III, 4; [[w.caro-passage-of-power]], 533 (the memorandum; its argument in part). See [[cal.1963-11-24.vietnam]]. Names: Mansfield, Johnson, Kennedy.'
