  - id: cal.1963-12.china-leadership-2
    when: Dec., early
    date: 1963-12
    at: before 1963-12-01
    thread: china-leadership
    also: [soviet-union]
    c: 'Mao presides at the Standing Committee on the CPSU letter of Nov. 29. China is in no haste to answer, the Open Letter of July 14, the Soviet articles and the resolutions of 42 parties being still unanswered; the writing goes on. The letter''s offers: trade is business; the five-year plan, likewise; the border, they wish to sound China out; experts, "we are not fools". The offices concerned to study them, no hurry. The next article, on peaceful coexistence, to say the five principles are China''s own, set Lenin''s coexistence against Khrushchev''s, and show that Khrushchev has bent Lenin.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 655–656 (Mao "at a Standing Committee called in early December", after the letter of Nov. 29; his remarks on trade, the plan, the border and experts; the article''s line); [[w.mao-zedong-zhuan]], V, ch. 71 (Mao to the Standing Committee: no haste to answer, the commentaries are not finished; trade, the plan, the border and experts are the CPSU''s own business; the next article on peaceful coexistence to say the five principles are China''s own, set Lenin''s coexistence beside Khrushchev''s, and quote Dulles; the day not given (n.30)). Made public: 1999. To check: [[w.lengxi-shinian-lunzhan-1956-1966]], 655–656 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.30). See [[cal.1963-12-03.china-leadership]]. Names: Mao Zedong, Khrushchev. Check: the day, and whether this is the session at which Mao heard the letter of Nov. 29 (Dec. 3); Wu names neither.'
    src:
      c: f2852bd8
      rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 655–656: all'
        - 'w.mao-zedong-zhuan V, ch. 71: D-G'
    tags: [polity:prc, name:mao-zedong, name:khrushchev-nikita-s, vis:only:prc]
