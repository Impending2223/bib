  - id: cal.1963-12-01.black-nationalism
    when: Dec. 1
    date: '1963-12-01'
    thread: black-nationalism
    also: [assassination]
    c: 'Malcolm X, speaking for Elijah Muhammad at the Manhattan Center, asked about Kennedy''s murder: "chickens coming home to roost." Muhammad had told his ministers to say nothing of it. Check: the hall.'
    n: '[[w.branch-pillar-of-fire]], 184. To check: [[w.x-autobiography-of-malcolm-x]]; [[w.marable-malcolm-x]]; [[w.goldman-death-and-life-of]]; [[w.payne-dead-are-arising]]; Malcolm X, The Autobiography, p. 300, comments of Yusuf Shah (Captain Joseph) on "Malcolm X: Make It Plain," PBS documentary, The American Experience, 1994 (cited by [[w.branch-pillar-of-fire]], 184). Names: Malcolm X, Muhammad.'
    src:
      c: 925f063d
      rows:
        - 'w.branch-pillar-of-fire 184: A-B'
        - 'via w.branch-pillar-of-fire 184 n.elijah-muhammad-sent-out: A-B'
    tags: [name:malcolm-x, name:muhammad-elijah, name:kennedy-john-f]
    short: the "chickens" remark and the suspension
  - id: cal.1963-12-01.transition-and-staff
    when: Dec. 1
    date: '1963-12-01'
    thread: transition-and-staff
    c: 'Sunday. Johnson, back from St. Mark''s with McPherson, in the Oval Office: Rowe, estranged since the 1960 campaign, comes in; Johnson apologizes, asks his support and counsel: "Damn it, can''t you be content to be the first man the thirty-sixth President of the United States has apologized to?" By McPherson''s account.'
    n: '[[w.mcpherson-political-education]], 215–16; [[w.kotz-judgment-days]], 29–30 ("his second Sunday in the White House"; the apology); [[w.bernstein-guns-or-butter]], 21 (the breach with Rowe repaired, an apology). Check: the day; McPherson, "the following week" after Sunday, Nov. 24. To check: R; o; w; e; ,; ; O; r; a; l; H; i; s; t; y; I; n; v; 2; 9; L; B; J; b; (; c; d; [; -; g; u; ]; 1; ). Names: Johnson, McPherson, Rowe.'
    src:
