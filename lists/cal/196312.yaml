    tags: [name:johnson-lyndon-b, name:bolling-richard, name:young-whitney-m-jr]
    short: the discharge petition
  - id: cal.1963-12-02.vietnam-congress
    when: Dec. 2
    date: '1963-12-02'
    time: 1963-12-03T00:01Z
    thread: vietnam-congress
    c: 'Fulbright to Johnson, by telephone, evening: a settlement by negotiation, through a reconvened Geneva conference. By Mann''s account: "I don''t think I would do anything"; Vietnam "a hell of a situation," "I''ll be goddamned if I don''t think it''s hopeless"; "You don''t want to send a whole lot more men in there, I don''t think."'
    n: '[[w.logevall-choosing-war]], 82 (the call; Fulbright''s counsel); [[w.taking-charge]], 86–88. [[w.mann-grand-delusion]], 306 (Fulbright''s words). To check: [Johnson and Fulbright, 7:01 p.m.](https://prde.upress.virginia.edu/conversations/9020029), Tape K6312.02, PNO 9 (PRDE only). Check: when the recording was opened. Names: Fulbright, Johnson.'
    src:
      c: e48baa36
      rows:
        - 'w.logevall-choosing-war 82: A'
        - 'w.mann-grand-delusion 306: B-D'
        - 'w.taking-charge 86–88: B-D'
        - 'via x.1963-12-02.johnson-j-william-fulbright-telephone-1901: B-D'
    tags: [name:fulbright-j-william, name:johnson-lyndon-b]
  - id: cal.1963-12-02.vietnam-force-levels
    when: Dec. 2
    date: '1963-12-02'
    thread: vietnam-force-levels
    c: 'Harkins announces: about 300 American military out of South Vietnam Dec. 3, 700 more in the next two or three weeks, 1,000 by the end of 1963. "The training of Vietnamese personnel has progressed to the point where the withdrawal of some US forces is possible."'
    n: '[FRUS 1961–63, IV, doc. 339](https://history.state.gov/historicaldocuments/frus1961-63v04/d339) (editorial note, the statement''s text). [[w.selverstone-kennedy-withdrawal]], 209–10 (the first 300; the thousand largely ordinary rotation, the Americans in Vietnam no fewer). See [[cal.1963-11-26.vietnam]]. Names: Harkins.'
