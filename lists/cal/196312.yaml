# Cal. XLIX December 1963
# Entries in display order. See CLAUDE.md for the fields. Run ./bib check after editing.
list: cal
section: XLIX
entries:
  - id: cal.1963-12-01.black-nationalism
    when: Dec. 1
    date: '1963-12-01'
    thread: black-nationalism
    also: [assassination]
    c: 'Malcolm X, speaking for Elijah Muhammad at the Manhattan Center, asked about Kennedy''s murder: "chickens coming home to roost." Muhammad had told his ministers to say nothing of it. Check: the hall.'
    n: 'To check: [[w.x-autobiography-of-malcolm-x]]; [[w.marable-malcolm-x]]; [[w.goldman-death-and-life-of]]; [[w.payne-dead-are-arising]]. Names: Malcolm X, Muhammad.'
    tags: [name:malcolm-x, name:muhammad-elijah, name:kennedy-john-f]
  - id: cal.1963-12-02.africa
    when: Dec. 2
    date: '1963-12-02'
    thread: africa
    c: 'The last Air Force contingents leave Sidi Slimane and Ben Guerir. Hassan to the American ambassador: dismay at the state in which Ben Guerir was left.'
    n: '[FRUS 1961–63, XXI, doc. 157](https://history.state.gov/historicaldocuments/frus1961-63v21/d157) (editorial note). See [[cal.1961-10-06.africa]], [[cal.1963-03-27.africa]]. Names: Hassan II.'
    tags: [name:hassan-ii]
  - id: cal.1963-12-02.civil-rights-bill
    when: Dec. 2
    date: '1963-12-02'
    thread: civil-rights-bill
    c: 'Johnson to Bolling, evening, in confidence: the discharge petition "has got to go." Bolling counts about 160 Democrats, the Republicans "up in the air." Johnson: a vote against signing a vote against civil rights. Whitney Young with Johnson the same day.'
    n: '[Johnson and Bolling, 6:56 p.m.](https://prde.upress.virginia.edu/conversations/9020028), Tape K6312.02, PNO 8 (PRDE only). [[w.caro-passage-of-power]], 487–88, 490. Names: Johnson, Bolling, Whitney Young.'
    tags: [name:johnson-lyndon-b, name:bolling-richard, name:young-whitney-m-jr]
  - id: cal.1963-12-03.state-constitutions-ok
    when: Dec. 3
    date: '1963-12-03'
    thread: state-constitutions
    c: 'Oklahoma, special election. $7 million in debt for the University of Oklahoma Medical Center adopted, 152,940 to 56,137, 73.2 percent. Refused: four-year terms for county officers, 64,042 to 142,057, 31.1 percent, and for county judges; four-year terms for State representatives and six for senators, 43,907 to 160,649, 21.5 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 39–40](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=39). See [[cal.1962-05-22.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1963-12-03.legislatures-ia
    when: Dec. 3
    date: '1963-12-03'
    thread: legislatures
    also: [state-constitutions]
    c: 'Iowa rejects the Shaff plan at a special election, 190,424 to 272,382, 41.1 percent: a Senate of 58 by population, a House of 99, one to a county. The federal court, May 3, had held the apportionment of 1904 and 1928 invidiously discriminatory and let the election go ahead; Judge McManus would have enjoined it. Jan. 14, 1964, the court orders a special session to reapportion before the 1964 elections.'
    n: '*Davis v. Synhorst*, [217 F. Supp. 492](https://static.case.law/f-supp/217/case-pdfs/0492-01.pdf) (S.D. Iowa 1963); [225 F. Supp. 689](https://static.case.law/f-supp/225/case-pdfs/0689-01.pdf) (S.D. Iowa 1964). [*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 113–115. To check: [[w.dixon-democratic-representation]]; [[w.larew-party-reborn]]. See [[cal.1962-03-26.court]]. Names: McManus.'
    tags: [state:ia, name:mcmanus-edward-j]
  - id: cal.1963-12-03.king
    when: Dec. 3
    date: '1963-12-03'
    thread: king
    also: [civil-rights-the-executive]
    c: 'King with Johnson and Lee White, forty-five minutes: Johnson for the civil rights bill and for Negro registration; no word of the Communist charges. King: "very fruitful."'
    n: '[Johnson and David McDonald, King joining, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only). [[w.garrow-bearing-the-cross]], 308; [[w.caro-passage-of-power]], 490 (shown the list of Republicans not yet on the petition). Names: King, Johnson, White.'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, name:white-lee-c]
  - id: cal.1963-12-03.foreign-aid
    when: Dec. 3
    date: '1963-12-03'
    thread: foreign-aid
    c: 'Leadership breakfast. Johnson on the tax cut: "We have been a year in doing it. [We] can''t expect better results in a week." Civil rights before the committee since May, no hearings before next year. The leaders offer a cotton bill; Johnson will not "launch my administration with a Cotton Bill."'
    n: '[[w.dallek-flawed-giant]], 70 (from the notes of the breakfast, Diary Backup, LBJ Library); [[w.caro-passage-of-power]], 492–93 (the breakfast, Meany present; the petition). See [[cal.1963-11-15.foreign-aid]]. Names: Johnson. Check: Dallek''s text gives Dec. 5, his note the breakfast of Dec. 3 (70 n.36).'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-03.civil-rights-bill
    when: Dec. 3
    date: '1963-12-03'
    thread: civil-rights-bill
    c: 'Meany rides in with Johnson from The Elms and sits in on the leaders'' breakfast; labor''s "full support." Johnson for the petition: "All you are asking is a hearing"; as many Democrats as can be had, the Republicans to match them. Albert''s count, 165 or 150; Johnson asks one by the whips. Albert Thomas brings six Texans.'
    n: '[Johnson and Carl Albert, 5:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-3-1963), Tape K6312.03 (Miller Center); [Johnson and David McDonald, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only). [[w.caro-passage-of-power]], 492–94. See [[cal.1963-12-03.foreign-aid]]. Names: Meany, Johnson, Albert, Boggs, Albert Thomas, McCormack.'
    tags: [name:meany-george, name:johnson-lyndon-b, name:albert-carl, name:boggs-hale, name:thomas-albert, name:mccormack-john-w]
  - id: cal.1963-12-04.africa
    when: Dec. 4
    date: '1963-12-04'
    thread: africa
    c: 'Security Council, Resolution 182, unanimous: South Africa called on again; all states to observe the arms embargo of Aug. 7; the Secretary-General to name a group of experts.'
    n: '[S.C. Res. 182](https://undocs.org/S/RES/182(1963)) (Dec. 4, 1963). See [[cal.1963-08-02.africa]].'
  - id: cal.1963-12-04.european-community
    when: Dec. 4
    date: '1963-12-04'
    thread: european-community
    also: [trade]
    c: 'Proclamation 3564: duties raised on potato starch, dextrine, brandy valued over $9 a gallon, and trucks of $1,000 or more, from Jan. 7, 1964, against the Community''s restrictions on American poultry. The GATT''s panel, Nov. 21, put the trade lost at $26 million; the United States had claimed $40 million, the Community $16 million.'
    n: '[Proclamation 3564—Proclamation Increasing Rates of Duty on Specified Articles](https://www.presidency.ucsb.edu/documents/proclamation-3564-proclamation-increasing-rates-duty-specified-articles) (Dec. 4, 1963). FRUS 1961–63, IX, docs. [260](https://history.state.gov/historicaldocuments/frus1961-63v09/d260) (Magnuson, Jackson and Engle, Feb. 20), [267](https://history.state.gov/historicaldocuments/frus1961-63v09/d267) (Ball''s reply), [292](https://history.state.gov/historicaldocuments/frus1961-63v09/d292) (the panel). To check: [[w.talbot-chicken-war]]; [[w.zeiler-american-trade-and-power]]; [[w.coppolaro-making-of-a-world]]. See [[cal.1962-01-14.european-community]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-04.black-nationalism
    when: Dec. 4
    date: '1963-12-04'
    thread: black-nationalism
    c: Muhammad suspends Malcolm X from speaking for ninety days.
    n: 'Check: the record. See [[cal.1963-12-01.black-nationalism]]. Names: Muhammad, Malcolm X.'
    tags: [name:muhammad-elijah, name:malcolm-x]
  - id: cal.1963-12-04.civil-rights-bill
    when: Dec. 4
    date: '1963-12-04'
    thread: civil-rights-bill
    c: 'The House Republican conference against the petition, McCulloch and Ford speaking. Johnson to the Business Council and the AFL-CIO''s Executive Council: "the party of Lincoln." That evening Clarence Brown, Rules'' ranking Republican, to Smith: something has to be done.'
    n: 'Remarks to Members of the Business Council, [1963–64 Pub. Papers 22](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=106) (Dec. 4, 1963); Remarks at a Meeting With the AFL-CIO Executive Council, [1963–64 Pub. Papers 20](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=104) (Dec. 4, 1963). [[w.caro-passage-of-power]], 494–97. Names: McCulloch, Ford, Johnson, Clarence Brown, Smith.'
    tags: [name:mcculloch-william-m, name:ford-gerald-r, name:johnson-lyndon-b, name:brown-clarence-j, name:smith-howard-w]
  - id: cal.1963-12-05.assassination
    when: Dec. 5
    date: '1963-12-05'
    thread: assassination
    c: The Warren Commission's first meeting, at the National Archives. The FBI's summary report to it, Dec. 9. Rankin its general counsel.
    n: '[Warren Commission, executive session transcript, Dec. 5, 1963](https://aarclibrary.org/publib/jfk/wc/wcexec/wcex1205/html/WCEX1205_0001a.htm) (AARC). National Archives: JFK Assassination Records Collection (K–J Adm. II.K). See [[cal.1963-11-29.assassination]]. Names: Warren, Rankin.'
    tags: [name:warren-earl, name:rankin-j-lee]
  - id: cal.1963-12-05.legislatures-ks
    when: Dec. 5
    date: '1963-12-05'
    thread: legislatures
    c: 'Kansas Supreme Court, *Harris v. Shanahan*: the Senate apportionment of 1963 (Senate Bill 440) and the House''s of 1961 void. It had withheld judgment Jan. 31 to give the 1963 legislature its chance. Governor Anderson calls a special session, which passes new apportionments, Senate Bill 2 and House Bill 2; the court holds them valid, Mar. 30, 1964.'
    n: '*Harris v. Shanahan*, [191 Kan. 1](https://static.case.law/kan/191/case-pdfs/0001-01.pdf), 378 P.2d 157 (1963); [192 Kan. 183](https://static.case.law/kan/192/case-pdfs/0183-01.pdf), 387 P.2d 771 (1963); [192 Kan. 629](https://static.case.law/kan/192/case-pdfs/0629-01.pdf), 390 P.2d 772 (1964). To check: [[w.dixon-democratic-representation]]; [[w.socolofsky-kansas-governors]]. See [[cal.1962-03-26.court]]. Names: Anderson.'
    tags: [state:ks, name:anderson-john-jr]
  - id: cal.1963-12-05.civil-rights-bill
    when: Dec. 5
    date: '1963-12-05'
    thread: civil-rights-bill
    c: 'Smith''s statement: hearings on the bill "reasonably soon" in January. Brown: early January, seven to ten days, twelve at most; Halleck: the five Republicans on Rules to vote it out, the House to pass it by the end of January.'
    n: '[[w.caro-passage-of-power]], 496–97. Check: the statement''s text. Names: Smith, Clarence Brown, Halleck.'
    tags: [name:smith-howard-w, name:brown-clarence-j, name:halleck-charles-a]
  - id: cal.1963-12-05.economy
    when: Dec. 5
    date: '1963-12-05'
    thread: economy
    c: 'Byrd to lunch in the small office off the Oval Office, asked by telephone Dec. 4, Valenti present. Byrd''s terms: the budget under $100 billion, in writing, seen by him and Williams, before the tax bill leaves Finance. To reporters: "what I''ve been asking for all along."'
    n: '[Johnson and Byrd, Dec. 4, 4:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-december-4-1963), Tape K6312.03, PNO 19 (Miller Center) (the invitation). [[w.caro-passage-of-power]], 475–77 (Valenti''s accounts and Byrd''s to reporters). See [[cal.1963-11-25.economy]]. Names: Byrd, Johnson, Valenti, Williams.'
    tags: [name:byrd-harry-f, name:johnson-lyndon-b, name:valenti-jack, name:williams-john-j]
  - id: cal.1963-12-06.opinion
    when: Dec. 6
    date: '1963-12-06'
    thread: opinion
    also: [assassination]
    c: 'Gallup, Nov. 22–27: the man who shot Kennedy acted on his own, 29 percent; some group or element also responsible, 52; uncertain, 19.'
    n: '[[w.gallup-poll]], III, 1854.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-12-07.economy
    when: Dec. 7
    date: '1963-12-07'
    thread: economy
    also: [succession]
    c: Johnson's first news conference. The tax bill to take effect Jan. 1 whenever passed; Byrd agrees, at lunch. The 1965 budget to start from $98.8 billion and $3.5 billion of built-in increases. McNamara to cut 25,000 civilian jobs.
    n: 'The President''s First News Conference, [1963–64 Pub. Papers 34](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=118) (Dec. 7, 1963). [[w.caro-passage-of-power]], 475–78 (Byrd''s terms at the lunch of Dec. 5; McNamara''s cuts, Dec. 7); [[w.zelizer-taxing-america]], 202–03 (the budget held down for the tax bill); [[w.stein-fiscal-revolution-in-america]], 451–53 (Byrd: a lower budget, the cut from Jan. 1). To check: [[w.heinemann-harry-byrd-of-virginia]]; [[w.taking-charge]]. See [[cal.1963-01-24.economy]]; [[cal.1963-09-25.economy]]. Names: Johnson, Byrd, McNamara. Check: Caro has Byrd holding to his terms at the lunch, the budget under $100 billion, in writing, shown to Williams (476–77); he does not give the Jan. 1 date.'
    tags: [name:johnson-lyndon-b, name:byrd-harry-f, name:mcnamara-robert-s]
  - id: cal.1963-12-07.governors-la
    when: Dec. 7
    date: '1963-12-07'
    thread: governors
    also: [elections-1963]
    c: Louisiana's Democratic primary for governor. Morrison, lately Ambassador to the OAS, over McKeithen, a public service commissioner, 299,702 to 157,304, 33.1 percent; U.S. Representative Gillis Long 137,778, 15.2 percent; Kennon, governor 1952–56, 127,870, 14.1 percent; six others. Runoff between Morrison and McKeithen.
    n: 'The figures as [Wikipedia](https://en.wikipedia.org/wiki/1964_Louisiana_gubernatorial_election) gives them. Check: La. Secretary of State, *Primary Election Returns*, 1963–64 (HathiTrust, search only). To check: [[w.fairclough-race-and-democracy]]; [[w.bartley-southern-elections]]. Names: deLesseps Morrison, Kennon, McKeithen, Long.'
    tags: [name:morrison-delesseps-s, name:mckeithen-john-j, name:long-gillis-w, name:kennon-robert-f, state:la]
  - id: cal.1963-12-07.vietnam
    when: Dec. 7
    date: '1963-12-07'
    thread: vietnam
    c: Mansfield to Johnson, with copies of his memoranda to Kennedy. The war perhaps not to be won in the South alone. A truce; a "diplomatic offensive," France the key; Cambodia "the principal prototype" of a peace in Southeast Asia.
    n: '[FRUS 1961–63, IV, doc. 355](https://history.state.gov/historicaldocuments/frus1961-63v04/d355). [[w.gibbons-u-s-government-and]], II, 215; III, 4; [[w.caro-passage-of-power]], 533. See [[cal.1963-11-24.vietnam]]. Names: Mansfield, Johnson, Kennedy.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1963-12-08.opinion
    when: Dec. 8
    date: '1963-12-08'
    thread: opinion
    also: [economy]
    c: 'Gallup, Oct. 11–16: the Kennedy administration''s record on spending, of those with an opinion, 35 percent favorable, 65 unfavorable; 23 had none.'
    n: '[[w.gallup-poll]], III, 1854. Names: Kennedy.'
    tags: [name:kennedy-john-f]
  - id: cal.1963-12-09.civil-rights-bill
    when: Dec. 9
    date: '1963-12-09'
    thread: civil-rights-bill
    c: Celler's petition to discharge the civil rights bill from Smith's Rules Committee opens for signatures; 218 needed. Dec. 11, the House adjourns rather than take up Calendar Wednesday, [214–166](https://voteview.com/rollcall/RH0880106). Dec. 18, Smith promises hearings Jan. 9.
    n: '[109 Cong. Rec., House, Dec. 9, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt18/pdf/GPO-CRECB-1963-pt18-5-2.pdf). [Discharge Petition to Move the Civil Rights Bill Out of the Rules Committee](https://www.archives.gov/legislative/features/civil-rights-1964/discharge-petition.html) (National Archives). [[w.caro-passage-of-power]], 484–98. To check: [[w.whalen-longest-debate]]; [[w.risen-bill-of-the-century]]; [[w.dierenfield-keeper-of-the-rules]]. See [[cal.1963-10-29.civil-rights-bill]]. Names: Celler, Smith.'
    tags: [name:celler-emanuel, name:smith-howard-w]
  - id: cal.1963-12-09.transportation
    when: Dec. 9
    date: '1963-12-09'
    thread: transportation
    c: House sends the Washington rapid transit bill, H.R. 8929, back to committee, [278–76](https://voteview.com/rollcall/RH0880101).
    n: See [[cal.1963-05-27.transportation]].
  - id: cal.1963-12-10.alabama-al
    when: Dec. 10
    date: '1963-12-10'
    thread: alabama
    also: [state-constitutions, voting-rights, state-and-city-finance]
    c: 'Constitutional amendment election. The voter qualification amendment refused, 30,819 to 81,693, 27.4 percent: an applicant of good character, to read and write any article of the federal Constitution, answer a written application and pass a sealed examination set and graded by a State board, its level no lower than the armed forces'' entrance test, and swear he never belonged to a group advocating overthrow of the government. A State corporate income tax to 5 percent, adopted, 73,083 to 43,050, 62.9 percent.'
    n: '[*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), 663](https://archive.org/details/alabama-official-statistical-register-1967/page/n664)–[665](https://archive.org/details/alabama-official-statistical-register-1967/page/n666) (Act No. 417, Regular Session, 1963; Act No. 91, Second Special Session, 1963). To check: [[w.lawson-black-ballots]]; [[w.carter-politics-of-rage-1995]].'
    tags: [state:al]
  - id: cal.1963-12-11.opinion
    when: Dec. 11
    date: '1963-12-11'
    thread: opinion
    also: [desegregation-public-places, civil-rights-bill, succession]
    c: 'Gallup, Nov. 22–27: under the new President, integration pushed faster, 16 percent; not so fast, 29; about the same, 43.'
    n: '[[w.gallup-poll]], III, 1854.'
  - id: cal.1963-12-12.economy
    when: Dec. 12
    date: '1963-12-12'
    thread: economy
    c: 'Finance has taken up Long''s oil amendment, the Treasury''s letter supporting it. Johnson to Dillon: "I thought you had an agreement that you''d be against every amendment"; every Democrat on the committee at every meeting, against every one. If the tax bill gets behind civil rights, "it''s Good night, Grace."'
    n: '[Johnson and Dillon, 4:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-douglas-dillon-december-12-1963), Tape K6312.08, PNO 6 (Miller Center). [[w.caro-passage-of-power]], 481–82. See [[cal.1963-12-05.economy]]. Names: Long, Johnson, Dillon.'
    tags: [name:long-russell-b, name:johnson-lyndon-b, name:dillon-c-douglas]
  - id: cal.1963-12-13.opinion-5
    when: Dec. 13
    date: '1963-12-13'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 5–10: Democrats'' choice for 1964: Johnson 68, Robert Kennedy 16, Stevenson 5, Humphrey 2, Brown 2, Symington 1, Fulbright 1; others, no preference 5. Independents: Johnson 66, Robert Kennedy 11.'
    n: '[[w.gallup-poll]], III, 1854. Names: Johnson, Robert Kennedy, Stevenson, Humphrey, Brown, Symington, Fulbright.'
    tags: [name:johnson-lyndon-b, name:kennedy-robert-f, name:stevenson-adlai-e, name:humphrey-hubert-h, name:brown-edmund-g, name:symington-william-s, name:fulbright-j-william]
  - id: cal.1963-12-13.peace-corps
    when: Dec. 13
    date: '1963-12-13'
    thread: peace-corps
    c: 'Peace Corps Act amendments signed, [77 Stat. 359](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg359-2.pdf): $102 million for fiscal 1964. Kennedy had asked $108 million, July 4.'
    n: Statute (K–J Cong. II.J.2). Letter to the President of the Senate and to the Speaker of the House Transmitting Bill To Strengthen the Peace Corps, [1963 Pub. Papers 555](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=613) (July 4, 1963). See [[cal.1963-04-10.peace-corps]].
    tags: [name:johnson-lyndon-b, name:kennedy-john-f]
  - id: cal.1963-12-13.economy
    when: Dec. 13
    date: '1963-12-13'
    thread: economy
    c: 'Johnson to Byrd: "I''m working on my budget every night"; "You can tell your grandchildren you were the senator who finally got a President to cut his budget"; the amendments voted before the recess. Byrd, "tired of this talking": "Right."'
    n: '[Johnson and Byrd, 11:33 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-december-13-1963), Tape K6312.08, PNO 14 (Miller Center). [[w.caro-passage-of-power]], 482–83. See [[cal.1963-12-05.economy]]. Names: Johnson, Byrd.'
    tags: [name:johnson-lyndon-b, name:byrd-harry-f]
  - id: cal.1963-12-15.opinion-5
    when: Dec. 15
    date: '1963-12-15'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 5–10: Republicans'' choice for 1964: Nixon 29, Goldwater 27, Lodge 16, Rockefeller 13, Romney 7, Scranton 2, Margaret Chase Smith 2; no preference 4. Independents: Rockefeller 22, Goldwater 21, Nixon 20, Lodge 18.'
    n: '[[w.gallup-poll]], III, 1854–55. Names: Nixon, Goldwater, Lodge, Nelson Rockefeller, Romney, Scranton, Smith.'
    tags: [name:nixon-richard-m, name:goldwater-barry-m, name:lodge-henry-cabot, name:rockefeller-nelson, name:romney-george-w, name:scranton-william-w, name:smith-margaret-chase]
  - id: cal.1963-12-16.school-aid
    when: Dec. 16
    date: '1963-12-16'
    thread: school-aid
    c: 'Higher Education Facilities Act signed, [77 Stat. 363](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg363-2.pdf), the Morse–Green bill: $1.195 billion over three years in grants and loans for academic buildings at public and private colleges, church colleges included. Conference report, House Nov. 6, [258–92](https://voteview.com/rollcall/RH0880085); Senate Dec. 10, [54–27](https://voteview.com/rollcall/RS0880211). Johnson: "the Education Congress of 1963."'
    n: 'Remarks Upon Signing the Higher Education Facilities Act, [1963–64 Pub. Papers 57](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=141) (Dec. 16, 1963). To check: [[w.graham-uncertain-triumph]]. See [[cal.1963-01-29.school-aid]]; [[cal.1963-08-06.school-aid]]. Names: Morse, Green, Johnson.'
    tags: [name:johnson-lyndon-b, name:morse-wayne, name:green-edith]
  - id: cal.1963-12-16.foreign-aid
    when: Dec. 16
    date: '1963-12-16'
    thread: foreign-aid
    c: 'Foreign Assistance Act of 1963 signed, [77 Stat. 379](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg379.pdf). Conference report, House Dec. 9, [195–164](https://voteview.com/rollcall/RH0880100); Senate Dec. 13, [61–26](https://voteview.com/rollcall/RS0880213). Johnson: "a dangerous reduction in funds."'
    n: 'Statement by the President Upon Signing the Foreign Assistance Act, [1963–64 Pub. Papers 58](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=142) (Dec. 16, 1963). See [[cal.1963-11-15.foreign-aid]]. See [[cal.1963-11-07.middle-east]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-16.africa
    when: Dec. 16
    date: '1963-12-16'
    thread: africa
    c: Nouasseur handed over to Morocco, with no American ceremony. The bases closed.
    n: '[FRUS 1961–63, XXI, doc. 157](https://history.state.gov/historicaldocuments/frus1961-63v21/d157) (editorial note). See [[cal.1963-12-02.africa]].'
  - id: cal.1963-12-17.program
    when: Dec. 17
    date: '1963-12-17'
    thread: conservation
    c: Clean Air Act signed, [77 Stat. 392](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg392.pdf). Grants to State and local control agencies; federal research; federal suits to abate pollution that crosses State lines. Conference report, House Dec. 10, [273–109](https://voteview.com/rollcall/RH0880104).
    n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing the Clean Air Act, [1963–64 Pub. Papers 60](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=144) (Dec. 17, 1963). To check: [[w.dewey-dont-breathe-the-air]]; [[w.krier-pollution-and-policy]]; [[w.jones-clean-air]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-17.latin-america
    when: Dec. 17
    date: '1963-12-17'
    thread: latin-america
    c: 'Senate approves the Chamizal convention, [15 U.S.T. 21](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-15-1/lltreaties-15-1.pdf#page=29), [505 U.N.T.S. 185](https://treaties.un.org/doc/Publication/UNTS/Volume%20505/volume-505-I-7374-English.pdf), [79–1](https://voteview.com/rollcall/RS0880216): the Chamizal tract at El Paso to Mexico, the Rio Grande''s channel moved. Johnson signs the ratification Dec. 20.'
    n: 'Remarks Upon Signing the Ratification of the Chamizal Convention, [1963–64 Pub. Papers 74](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=158) (Dec. 20, 1963). Convention for the Solution of the Problem of the Chamizal (K–J Cong. II.J.2). See [[cal.1963-07-18.latin-america]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-17.opinion-5
    when: Dec. 17
    date: '1963-12-17'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 12–17, released Jan. 10, 1964: Johnson 66, Lodge 23, undecided and other 11; Johnson 74, Rockefeller 17, undecided and other 9.'
    n: '[[w.gallup-poll]], III, 1858. Names: Johnson, Lodge, Nelson Rockefeller.'
    tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:rockefeller-nelson]
  - id: cal.1963-12-17.succession
    when: Dec. 17
    date: '1963-12-17'
    thread: succession
    c: 'Johnson to the UN General Assembly: "the assassin''s bullet which took his life did not alter his Nation''s purpose"; a world "safe for diversity, and free from hostility."'
    n: 'Address Before the General Assembly of the United Nations, [1963–64 Pub. Papers 61](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=145) (Dec. 17, 1963). [[w.johnson-vantage-point]], 23. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-18.school-aid
    when: Dec. 18
    date: '1963-12-18'
    thread: school-aid
    c: Vocational Education Act signed, [77 Stat. 403](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg403.pdf); the National Defense Education Act and aid to impacted areas extended. Conference report, House Dec. 12, [301–65](https://voteview.com/rollcall/RH0880109); Senate Dec. 13, [82–4](https://voteview.com/rollcall/RS0880214).
    n: 'Remarks Upon Signing the Vocational Education Bill, [1963–64 Pub. Papers 64](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=148) (Dec. 18, 1963). To check: [[w.graham-uncertain-triumph]]. See [[cal.1963-01-29.school-aid]]; [[cal.1963-08-06.school-aid]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-18.opinion-5
    when: Dec. 18
    date: '1963-12-18'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Nov. 22–27, the South: Johnson 78, Goldwater 19, undecided, others 3.'
    n: '[[w.gallup-poll]], III, 1855. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1963-12-20.opinion-5
    when: Dec. 20
    date: '1963-12-20'
    thread: opinion
    also: [elections-1964-polls]
    c: 'Gallup, Dec. 12–17, Catholics: Johnson 91, Goldwater 6, undecided, others 3.'
    n: '[[w.gallup-poll]], III, 1855. Names: Johnson, Goldwater.'
    tags: [name:johnson-lyndon-b, name:goldwater-barry-m]
  - id: cal.1963-12-20.poverty
    when: Dec. 20
    date: '1963-12-20'
    thread: poverty
    c: 'Cabinet officers and their staffs on the poverty program, Sorensen at the head of the table: a dispute over who would run the projects. Demonstration projects in a few cities from $500 million found in existing programs.'
    n: '[[w.caro-passage-of-power]], 540 (Capron''s account). See [[cal.1963-11-19.poverty]]. Names: Sorensen.'
    tags: [name:sorensen-theodore-c]
  - id: cal.1963-12-21.vietnam
    when: Dec. 21
    date: '1963-12-21'
    thread: vietnam
    c: 'McNamara to Johnson after two days in Saigon: "The situation is very disturbing." Unless reversed in two or three months, neutralization at best, more likely a Communist-controlled state. The Minh government "indecisive and drifting."'
    n: '[FRUS 1961–63, IV, doc. 374](https://history.state.gov/historicaldocuments/frus1961-63v04/d374). [[w.gibbons-u-s-government-and]], II, 211–212; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 500; [[w.dallek-flawed-giant]], 101. [[w.caro-passage-of-power]], 532–35. To check: [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.logevall-choosing-war]]; [[w.mcmaster-dereliction-of-duty-1997]]; [[w.ahern-cia-and-the-generals]]; [[w.lam-history-of-south-vietnam-2021]]. See [[cal.1963-11-01.vietnam]]. Names: McNamara, Johnson, Dương Văn Minh.'
    tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:duong-van-minh, place:saigon]
  - id: cal.1963-12-21.specials
    when: Dec. 21
    date: '1963-12-21'
    thread: specials
    c: Texas 10th, special runoff. Pickle (D) over Dobbs (R), 27,228 to 16,052, 62.9 percent, for the seat of Thornberry, of the Rules Committee, now a district judge; Johnson's old district. Swing 0.4 to R.
    n: '[109 Cong. Rec., House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf) (Pickle sworn). Votes: CQ Guide 6th (2010) 1271; CQ dates the first round by year only. Check the date of the first round. To check: [[w.pickle-jake]]. See [[cal.1961-04-04.states-and-cities]]. Names: Pickle, Jim Dobbs, Thornberry, Johnson.'
    tags: [special:1963-12-21-h-TX-10, name:pickle-james-j, name:dobbs-jim, name:thornberry-william-h, name:johnson-lyndon-b]
  - id: cal.1963-12-21.europe-and-the-alliance
    when: Dec. 21–22
    date: '1963-12-21'
    thread: cyprus
    c: Cyprus. Greek Cypriot police and Turkish Cypriots clash in Nicosia, Dec. 21; five dead, the fighting spreads. Dec. 22, the American ambassador and the British acting High Commissioner to Makarios and Kutchuk.
    n: '[FRUS 1961–63, XVI, doc. 301](https://history.state.gov/historicaldocuments/frus1961-63v16/d301). See [[cal.1963-10-17.europe-and-the-alliance]]. Names: Makarios III, Kutchuk.'
    tags: [name:makarios-iii, name:kutchuk-fazil]
  - id: cal.1963-12-23.foreign-aid
    when: Dec. 23
    date: '1963-12-23'
    thread: foreign-aid
    c: The White House, a Christmas party for the House, the absent Democrats called back for the aid appropriation. Johnson, on a chair in the State Dining Room, asks for the bill without Mundt's amendment; a committee promised to make aid cheaper. Halleck courted.
    n: '[[w.dallek-flawed-giant]], 70–71; [[w.caro-passage-of-power]], 501–02. To check: [[w.johnson-vantage-point]]. See [[cal.1963-11-15.foreign-aid]]. Names: Johnson, Mundt, Halleck.'
    tags: [name:johnson-lyndon-b, name:mundt-karl-e, name:halleck-charles-a]
  - id: cal.1963-12-23.civil-rights-bill
    when: Dec. 23
    date: '1963-12-23'
    thread: civil-rights-bill
    c: '10:30 p.m., still in the Oval Office, Johnson to Wilkins by telephone: a Negro secretary to be hired, Gerri Whittington; names for the Civil Rights Commission; the State of the Union; a Mexican-American for the staff. Wilkins: "We need you."'
    n: '[Johnson and Wilkins, 10:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-roy-wilkins-december-24-1963), Tape K6312.17, PNO 3 (Miller Center). [[w.caro-passage-of-power]], 491. See [[cal.1963-11-29.civil-rights-bill]]. Names: Johnson, Wilkins.'
    tags: [name:johnson-lyndon-b, name:wilkins-roy]
  - id: cal.1963-12-24.foreign-aid
    when: Dec. 24
    date: '1963-12-24'
    thread: foreign-aid
    also: [trade, succession]
    c: 'The House, in at 7 a.m. on Christmas Eve, adopts Passman''s amendment to the aid appropriation, [189–158](https://voteview.com/rollcall/RH0880119): the President may allow Export-Import Bank guarantees on credit to Communist countries in the national interest. The wheat credit kept. Senate agrees Dec. 30, [56–14](https://voteview.com/rollcall/RS0880229). About $3 billion, against $4.5 billion asked. Signed Jan. 6, [77 Stat. 857](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg857.pdf).'
    n: '[109 Cong. Rec. House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf). Statement by the President on the Proposed Reduction in Foreign Aid Funds, [1963–64 Pub. Papers 55](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=139) (Dec. 14, 1963). [[w.caro-passage-of-power]], 501–02. See [[cal.1963-11-15.foreign-aid]]; [[cal.1963-10-09.trade]]. Names: Passman.'
    tags: [name:passman-otto-e, name:johnson-lyndon-b]
  - id: cal.1963-12-24.europe-and-the-alliance-cyprus
    when: Dec. 24
    date: '1963-12-24'
    thread: cyprus
    c: Cyprus. The guarantor powers' joint appeal.
    n: FRUS 1961–63, XVI, docs. [303](https://history.state.gov/historicaldocuments/frus1961-63v16/d303), [304](https://history.state.gov/historicaldocuments/frus1961-63v16/d304). See [[cal.1963-10-17.europe-and-the-alliance]].
  - id: cal.1963-12-25.europe-and-the-alliance-cyprus
    when: Dec. 25
    date: '1963-12-25'
    thread: cyprus
    c: 'Cyprus. Turkey to NATO''s Council: its NATO forces may go to the island. Britain proposes intervention under its command, Makarios consenting.'
    n: 'FRUS 1961–63, XVI, docs. [305](https://history.state.gov/historicaldocuments/frus1961-63v16/d305), [306](https://history.state.gov/historicaldocuments/frus1961-63v16/d306). See [[cal.1963-10-17.europe-and-the-alliance]]. Names: Makarios III.'
    tags: [name:makarios-iii]
  - id: cal.1963-12-25.press-and-broadcasting
    when: Dec. 25
    date: '1963-12-25'
    thread: press-and-broadcasting
    c: 'From the Ranch, Johnson to Valenti on the merger of Houston''s National Bank of Commerce, held up by the Federal Reserve and the Antitrust Division; Jones, its president, publishes the *Houston Chronicle*: no approval "unless they give me their lung as long as I''m in public life." Jones to the Ranch Dec. 27, quietly.'
    n: '[Johnson and Valenti, 1:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-jack-valenti-december-25-1963), Tape K6312.21, PNO 1 (Miller Center); [Johnson and Jones, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-johnny-jones-december-25-1963), Tape K6312.18, PNO 15 (Miller Center). [[w.caro-passage-of-power]], 523–24. Check: which call Caro quotes. Names: Johnson, Valenti.'
    tags: [name:johnson-lyndon-b, name:valenti-jack]
  - id: cal.1963-12-26.europe-and-the-alliance-cyprus
    when: Dec. 26
    date: '1963-12-26'
    thread: cyprus
    c: 'Cyprus. Johnson to Gursel, Makarios and Kutchuk: "I will not presume to judge the root causes."'
    n: 'Messages to the President of Turkey and to the President and Vice President of Cyprus, [1963–64 Pub. Papers 85](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=169) (Dec. 26, 1963). See [[cal.1963-10-17.europe-and-the-alliance]]. Names: Johnson, Gursel, Makarios III, Kutchuk.'
    tags: [name:johnson-lyndon-b, name:gursel-cemal, name:makarios-iii, name:kutchuk-fazil]
  - id: cal.1963-12-27.succession
    when: Dec. 27
    date: '1963-12-27'
    thread: succession
    also: [economy]
    c: 'News conference at the Ranch. The 1965 budget: requests cut $731 million and 10,000 jobs after three days with the Cabinet. Sent Jan. 21, 1964: $97.9 billion.'
    n: '[The President''s News Conference at the LBJ Ranch](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-the-lbj-ranch-0) (Dec. 27, 1963). The 1965 estimate: [*Economic Report*, Jan. 1964](https://www.govinfo.gov/app/details/SERIALSET-12658_00_00-002-0278-0000), Table C-56. [[w.zelizer-taxing-america]], 202–03 ($97.9 billion); [[w.stein-fiscal-revolution-in-america]], 453 ($97.9 billion); [[w.caro-passage-of-power]], 512–13, 517 (the budget work at the Ranch; not the figures). To check: [[w.morgan-deficit-government]]. See [[cal.1963-12-07.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-27.press-and-broadcasting
    when: Dec. 27
    date: '1963-12-27'
    thread: press-and-broadcasting
    c: 'Jones of the *Chronicle* at the Ranch with Gus Wortham, Albert Thomas in George Brown''s place: "Whenever you need anything call on us." Not enough, Johnson tells Wortham after: a letter.'
    n: '[[w.caro-passage-of-power]], 524–25 (Johnson''s account to Brown, Jan. 2). See [[cal.1963-12-25.press-and-broadcasting]]. Names: Albert Thomas, Johnson.'
    tags: [name:thomas-albert, name:johnson-lyndon-b]
  - id: cal.1963-12-28.europe-and-the-alliance
    when: Dec. 28–29
    date: '1963-12-28'
    thread: europe-and-the-alliance
    c: Erhard at the LBJ Ranch. Six American divisions to stay in Germany; no arrangement to perpetuate a divided Germany; the multilateral force "a new means of strengthening Western defense."
    n: 'Joint Statement Following Discussions With Chancellor Erhard, [1963–64 Pub. Papers 99](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=183) (Dec. 29, 1963). [[w.schwartz-lyndon-johnson-and-europe]], 22–23, 65 (the talks; the six divisions). See [[cal.1963-01-14.europe-and-the-alliance]]. Names: Erhard.'
    tags: [name:erhard-ludwig, name:johnson-lyndon-b]
  - id: cal.1963-12-28.europe-and-the-alliance-cyprus
    when: Dec. 28
    date: '1963-12-28'
    thread: cyprus
    c: Cyprus asks for the Security Council.
    n: FRUS 1961–63, XVI, docs. [307](https://history.state.gov/historicaldocuments/frus1961-63v16/d307), [308](https://history.state.gov/historicaldocuments/frus1961-63v16/d308). See [[cal.1963-10-17.europe-and-the-alliance]].
  - id: cal.1963-12-29.poverty
    when: Dec. 29–Jan. 3
    date: '1963-12-29'
    thread: poverty
    c: Heller and Gordon at the Ranch. Johnson doubles the poverty money to a billion dollars, half of it new; not demonstrations in a few cities but a program "big and bold" enough to pass. Community action kept.
    n: '[[w.caro-passage-of-power]], 540–44 (Heller''s account; Johnson''s memoir). See [[cal.1963-11-19.poverty]]. Names: Heller, Gordon, Johnson.'
    tags: [name:heller-walter-w, name:gordon-kermit, name:johnson-lyndon-b]
  - id: cal.1963-12-30.congress
    when: Dec. 30
    date: '1963-12-30'
    thread: congress
    c: 'First session of the 88th Congress adjourns, 2:51 p.m. Passed: the test ban, equal pay, mental health, clean air, higher and vocational education. Left: the tax bill in Finance, civil rights in Rules, Medicare.'
    n: '[109 Cong. Rec., House, Dec. 30, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-12-1.pdf). CQ Almanac 1963. To check: [[w.burns-deadlock-of-democracy]]; [[w.sundquist-politics-and-policy]]; [[w.zelizer-fierce-urgency-of-now]]; [[w.congress-and-the-nation]] (K–J Cong. II.L). See [[cal.1962-10-13.congress]].'
    tags: [appropriations:88-1]
  - id: cal.1963-12.robert-kennedy
    when: Dec.
    date: 1963-12
    thread: robert-kennedy
    also: [soviet-union]
    c: 'William Walton, painter and friend of the Kennedys, in Moscow on a cultural visit put off by the assassination, sees Bolshakov at Robert Kennedy''s request. By Bolshakov''s report, the message: Robert Kennedy and Mrs. Kennedy believed there had been a conspiracy in the President''s death; Robert Kennedy shared his brother''s approach to the Soviet Union. Check the date.'
    n: 'To check: [[w.fursenko-one-hell-of-a]]. See [[cal.1961-05-09.berlin-and-vienna]]. Made public: Fursenko & Naftali (1997). Names: Walton, Bolshakov, Robert Kennedy, Jacqueline Kennedy.'
    tags: [name:kennedy-robert-f, name:walton-william, name:bolshakov-georgi, name:kennedy-jacqueline]
  - id: cal.1963-12.states-and-cities-us
    when: Dec.
    date: 1963-12
    thread: states-and-cities
    also: [court, legislatures, amendments]
    c: 'The year''s applications to Congress for the Council of State Governments'' amendments. Apportionment: twelve legislatures, Arkansas, Idaho, Kansas, Missouri, Montana, Nevada, Oklahoma, South Carolina, South Dakota, Texas, Washington and Wyoming. Article V: eleven. The Court of the Union: five, Alabama, Arkansas, Florida, South Carolina and Wyoming. Thirty-four needed for a convention.'
    n: 'The applications in 109 Cong. Rec. (1963), as the Article V Library lists them: [apportionment](http://article5library.org/analyze.php?topic=Apportionment&res=1&gen=0&ylimit=0), [Article V](http://article5library.org/analyze.php?topic=Revision+of+Article+V&res=1&gen=0&ylimit=0), [Court of the Union](http://article5library.org/analyze.php?topic=Establish+Court+of+the+Union&res=1&gen=0&ylimit=0) (Check each against the Record). To check: [[w.black-proposed-amendment-of-article]]; [[w.kurland-court-of-the-union]]. See [[cal.1962-12.states-and-cities-us]]; [[cal.1963-07-26.opinion]].'
    tags: [state:sc, state:sd, state:wa, state:ar, state:mo, state:ok, state:al, state:fl, state:mt, state:wy, state:ks, state:nv, state:id, state:tx]
  - id: cal.1963-12.oil
    when: Dec.
    date: 1963-12
    thread: oil
    c: 'The world''s crude oil output in 1963, as the Bureau of Mines first counted it: 26.1 million barrels a day. The United States 7.54, the Soviet Union 4.12, Venezuela 3.25, Kuwait 1.93, Saudi Arabia 1.63. Libya 0.46.'
    n: Bureau of Mines, [*Minerals Yearbook 1963*, II, Table 88, pp. 520–521](https://archive.org/details/pub_usgov-minerals-yearbook_1963_2/page/n527) (1964). See [[cal.1960-12.oil]].
    tags: [oilworld:1963]
  - id: cal.1963-12.vietnam
    when: Dec.
    date: 1963-12
    thread: vietnam
    c: The Ninth Plenum of the Lao Động Central Committee. Armed struggle the direct deciding factor in the South; a decisive victory sought in a relatively short time; the main forces there to be built up, the North to supply them; preparation against a "limited war." The army in the North brought toward 300,000 by the end of 1964; whole regiments to go south.
    n: 'Washington''s reading of Hanoi''s statements after it: [FRUS 1964–68, I, doc. 48](https://history.state.gov/historicaldocuments/frus1964-68v01/d48) (State''s intelligence bureau, Feb. 15, 1964). [[w.vietnam-victory-in-vietnam]], 124–26, 460 n.10; [[w.asselin-hanois-road-to-the]], 162–68; [[w.nguyen-hanois-war]], 63–68. Made public: the plenum''s communiqué on the world situation, Jan. 20, 1964, the resolution on the South kept secret (Asselin, 164; Nguyen, 66); Lê Duẩn''s speech at the plenum, *Học Tập*, February 1964 (Nguyen, 66); the history''s Hanoi edition, 1988 (Check: an earlier printing). Check: Asselin, 162 n.139, has the plenum open Nov. 22, the day not certain, and still sitting Dec. 25 (163); Nguyen, 64, 66, has it in December.'
  - id: cal.1963-12.mississippi
    when: Dec.
    date: 1963-12
    thread: mississippi
    c: Oxford. A federal jury of white men acquits the Montgomery County sheriff, Earl Patridge, the Winona police chief, Thomas J. Herod, Jr., highway patrolman John L. Basinger and two others, charged by the Justice Department with conspiring to deprive the Winona prisoners of their rights.
    n: '[[w.dittmer-local-people]], 173. Check: the day. See [[cal.1963-06-09.mississippi]]. Names: Patridge, Herod, Basinger.'
    tags: [state:ms, name:patridge-earl, name:herod-thomas-j-jr, name:basinger-john-l]
  - id: cal.1963-12.king
    when: Dec.
    date: 1963-12
    thread: king
    c: 'A conference of FBI officials on King: how to gather evidence of his private life, to expose him as "an immoral opportunist" and a "clerical fraud." Sullivan proposes microphones in his hotel rooms. The taps on his home and office in place since November.'
    n: '[[w.garrow-bearing-the-cross]], 310. Check: the day; Garrow cites Sullivan to Belmont, Dec. 24, 1963 (680 n.19). See [[cal.1963-10-10.king]]. Made public: Check; Garrow had the FBI''s files under the Freedom of Information Act ([[w.garrow-bearing-the-cross]], 627). Names: Sullivan, King.'
    tags: [name:sullivan-william-c, name:king-martin-luther-jr]
  - id: cal.1963-12-30.program
    when: Dec. 30
    date: '1963-12-30'
    thread: program
    also: [poverty]
    c: 'Sorensen''s first draft of the State of the Union, at the Lewis Ranch: "This Administration hereby declares unconditional war on poverty in America."'
    n: '[[w.caro-passage-of-power]], 544–45. See [[cal.1963-01-14.program]]. Names: Sorensen.'
    tags: [name:sorensen-theodore-c]
