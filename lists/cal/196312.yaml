    also: [soviet-union]
    c: 'Peking. In the revision of the seventh commentary, first meant to be on relations among brother parties, Mao tells the drafting group to begin from dialectics: all things divide in two; the movement has grown by parting and joining, from the First International to the Third; Khrushchev is the greatest splitter; a party splits first in thought, and revisionism is splittism; parties large and small are equal and independent.'
    n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 662–663 (the drafting group on the seventh commentary "in December and January", its title and structure changed several times; Mao''s remarks "in the course of revision", undated; the group, under Deng Xiaoping, followed them; eighteen revisions in all, more than for any earlier piece); [[w.mao-zedong-zhuan]], V, ch. 71 (the seventh commentary: two months and 18 revisions, its title found two weeks before publication (Mao to Kim Il Sung, Feb. 29, 1964); Wu Lengxi: first meant for relations among brother parties, title and structure changed often, hard to write). Made public: 1999. To check: Mao Zedong 毛泽东, talk with Kim Il Sung 金日成, Feb. 29, 1964 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.31); [[w.lengxi-shinian-lunzhan-1956-1966]], 662 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.32). See [[cal.1963-12.china-leadership-2]]. Names: Mao Zedong, Khrushchev. Check: the day of Mao''s instruction, in December or January; Wu gives only "in the course of revision".'
    src:
      c: 8583c357
      rows:
