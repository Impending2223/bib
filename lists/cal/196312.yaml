  - id: cal.1963-12-12.china-leadership-2
    when: Dec. 12
    date: '1963-12-12'
    thread: china-leadership
    c: 'Mao on the Propaganda Department''s *Wenyi qingkuang huibao* of Dec. 9, to Peng Zhen and Liu Ren: every art form, drama, ballads, music, painting, dance, film, poetry and literature, has many problems; in many, socialist reform has had little effect, and "dead men" still rule; the gains in film, new verse, folk song, painting and fiction not to be underrated, but drama and the like in worse trouble.'
    n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 12, 1963 ("同日"). [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 588 n.1 (Jan. 3, 1964, footnote; the footnote quotes Mao''s comment of Dec. 12, 1963 on the paper of the Propaganda Department''s literature and art office); [[w.jianguo-yilai-mao-zedong]], XVII, 129–130 (Dec. 12, 1963; Mao''s note of Dec. 12 to Peng Zhen and Liu Ren on the Propaganda Department''s *Wenyi qingkuang huibao* of Dec. 9, and the added line that many Communists eagerly promote feudal and capitalist art and not socialist art; the item Mao had in view was the article on Ke Qingshi''s work on ballad-singing (note 3)); [[w.macfarquhar-origins-of-the-cultural]], III, 385 (Mao comments on the Dec. 9 issue''s report "Comrade Ke Qingshi grasps folk art work" and sends it to Peng Zhen and Liu Ren; the comment later circulated as his directive on literature and art of Dec. 12); [[w.mao-zedong-zhuan]], VI, ch. 72 (Dec. 12 the comment on the arts: many forms, much in them, little remade, "dead men" still rule (n.20)). [[w.yang-jisheng-tiandi-fanfu]], I, 100 ("many departments still ruled by the dead"; "is it not absurd" that Communists promote feudal and capitalist art); [[w.peng-zhen-nianpu-1902]], IV, 305 (Dec. 12, 1963; Peng Zhen receives Mao''s comment, to him and Liu Ren, on "Comrade Ke Qingshi takes up quyi" in *Wenyi qingkuang huibao*: in drama, quyi, music, fine arts, dance, film, poetry and literature many problems, socialist transformation of little effect, many departments still ruled by "dead men"; drama''s problems the greater; the arts, part of the superstructure, still a great problem though the base has changed; begin by inquiry; "许多共产党人热心提倡封建主义和资本主义的艺术，却不热心社会主义的艺术，岂非咄咄怪事"); [[w.dikotter-cultural-revolution]], 38 n.34a ("dead people are still in control"). Made public: 1996. To check: Wenyi qingkuang huibao, Central Propaganda Department literature and art office, Dec. 9, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 130 n.1); "Comrade Ke Qingshi takes up the work of quyi," Wenyi qingkuang huibao, Dec. 9, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 130 n.3); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1220–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 385 n.32); [[w.current-background]], 41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 385 n.33b); Mao Zedong, comment of Dec. 12, 1963, in [[w.zedong-jianguo-yilai-mao-zedong]], 10, 436–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 385 n.33c); Mao Zedong 毛泽东, comment to Peng Zhen 彭真 and Liu Ren 刘仁 on the arts (manuscript 手稿), Dec. 12, 1963 (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.20). Names: Mao Zedong, Peng Zhen, Liu Ren.'
