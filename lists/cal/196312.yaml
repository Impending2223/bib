  - id: cal.1963-12-23.elections-1964-vice-presidency
    when: Dec. 23
    date: '1963-12-23'
    thread: elections-1964-vice-presidency
    c: 'Robert Kennedy to Schlesinger, in their talks of the past days, on bargaining with Johnson: the Kennedys'' power rests on their relation to the big-city machines, Daley, Green, Buckley, Crotty; Johnson will have to consult them about the Vice Presidency, and they will have some say on the Secretary of State of the next cabinet. "I will be perfectly willing to ask President Johnson what his plans are for the State Department before we decide the role we are going to play in the campaign." A nominal role or a real one: "It may make a difference, for example, whether Jackie appears with Johnson at the last big rally, or whether she goes to Europe in the autumn for her health." By Schlesinger''s journal.'
    n: '[[w.schlesinger-journals]], 217. Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Schlesinger, Johnson, Daley, Green, Buckley, Jacqueline Kennedy. Check: the day; the entry is headed Dec. 23 and speaks of "several talks."'
    tags: [name:kennedy-robert-f, name:schlesinger-arthur-m-jr, name:johnson-lyndon-b, name:daley-richard-j, name:green-william-j-jr, name:buckley-charles-a, name:kennedy-jacqueline]
  - id: cal.1963-12-23.foreign-aid-4
    when: Dec. 23
    date: '1963-12-23'
    place: washington
    thread: foreign-aid
    c: 'The Oval Office, the night. Johnson, McCormack and Albert telephone for one more vote to make a quorum of the Rules Committee to send the aid conference report to the floor; most members cannot be found. About 2 a.m. Albert reaches Colmer at a Mississippi hospital, where his wife is ill: "Bill, we need you, your party needs you, and President Johnson needs you. We all need you to give us a quorum." Colmer flies through a blizzard to Washington. By Albert''s account.'
    n: '[[w.albert-little-giant-1990]], 283. See [[cal.1963-12-23.foreign-aid]]. Names: Johnson, McCormack, Albert, Colmer.'
    tags: [name:johnson-lyndon-b, name:mccormack-john-w, name:albert-carl, name:colmer-william-m, state:ms]
  - id: cal.1963-12-23.soviet-union-leadership
    when: Dec. 23
    date: '1963-12-23'
    place: moscow
    thread: soviet-union-leadership
    also: [cuba]
    part_of: cal.1963-12-23.soviet-union-leadership-2
    c: 'The Presidium, the same session as the schools. The December plenum''s decisions on chemistry: Khrushchev asks Gosplan, the chemists and industry for an inventory of the plants in fertilizers, herbicides, fibers and plastics against the world''s level, and for the plants to be bought abroad chosen, not taken as offered; his report''s fertilizer a third "simple," ballast; a chemical industry on Sakhalin''s oil and gas, for trade with Japan, and a plant in northern Kirghizia. Tasks to be assigned, letters by branch to the party organizations, the VSNKh not to be supplanted. The delegation to Cuba for the revolution''s fifth anniversary, under Podgorny: its trip to be announced by radio Dec. 23 and in the press Dec. 24, "Почему раньше не опубликовали?" (why was it not published before?); the greeting to repeat Cuba''s position on the base at Guantánamo and its four or five conditions; gifts, Castro''s apart.'
    n: 'Protocol 126, items I and XI. [[w.prezidium-tsk-kpss-1954]], I, 781–82 (doc. 304, Malin''s notes), 783–802 (doc. 305, the stenogram on chemistry: the inventory and the ballast, 783–84; Kirghizia and Sakhalin, 785; Cuba and Algeria not stenographed, 816); III, 622–29 (P 126/I and Malin''s own jottings for it, P 126/XI and the departments'' note, P 126/XII on the gifts). See [[cal.1963-12-23.soviet-union]], [[cal.1963-12-04.cuba]]. Made public: 2003. Names: Khrushchev, Podgorny, Castro.'
    tags: [name:podgorny-nikolai-v, name:castro-fidel, polity:ussr, polity:cuba, polity:us, name:khrushchev-nikita-s]
