    when: Dec. 7
    date: '1963-12-07'
    thread: governors
    also: [elections-1963]
    c: Louisiana's Democratic primary for governor. Morrison, lately Ambassador to the OAS, over McKeithen, a public service commissioner, 299,702 to 157,304, 33.1 percent; U.S. Representative Gillis Long 137,778, 15.2 percent; Kennon, governor 1952–56, 127,870, 14.1 percent; six others. Runoff between Morrison and McKeithen.
