iumph-forsaken]], 287 n.58). Made public: the plenum''s communiqué on the world situation, Jan. 20, 1964, the resolution on the South kept secret (Asselin, 164; Nguyen, 66); Lê Duẩn''s speech at the plenum, *Học Tập*, February 1964 (Nguyen, 66); the history''s Hanoi edition, 1988 (Check: an earlier printing). Check: Asselin, 162 n.139, has the plenum open Nov. 22, the day not certain, and still sitting Dec. 25 (163); Nguyen, 64, 66, has it in December. Check: the volume''s editors have the plenum sit Nov. 22–Dec. 7 ([[w.van-kien-dang-toan]], XXIV, 5).'
