    c: 'Chapman, "The State of the Republican Party," for Rockefeller''s office: "you moderates will be cruelly disillusioned if you think that just because a Goldwater candidacy is absurd it won''t happen." Eisenhower and others "have failed to see the extent of the right wing takeover since 1960"; the moderates compromise with the conservatives in making up the delegations, and "will discover too late that they should have fought things out ahead of time."'
    n: '[[w.kabaservice-rule-and-ruin]], 70. To check: Bruce K. Chapman, "The State of the Republican Party," Dec. 2, 1963, George L. Hinman Papers, Rockefeller Archive Center, IV-J2-1–9:46 (cited by [[w.kabaservice-rule-and-ruin]], 70 n.153). Names: Goldwater, Eisenhower, Rockefeller.'
