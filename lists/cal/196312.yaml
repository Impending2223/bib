    tags: [name:moyers-bill, name:schlesinger-arthur-m-jr, name:mann-thomas-c, name:kennedy-robert-f, name:johnson-lyndon-b, city:washington]
  - id: cal.1963-12-05.transition-and-staff-2
    when: Dec. 5
