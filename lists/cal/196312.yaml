    c: 'Washington. A high official of the Soviet Embassy asks Salinger to lunch the same day: Khrushchev, who knows and trusts him, wants his estimate of the new President. Salinger: Johnson is as interested in peace as Kennedy was. The official says Khrushchev wept at Kennedy''s death. By Salinger''s account.'
    n: '[[w.salinger-with-kennedy]], 335. Check: the day and month ("shortly after the death of President Kennedy"). Names: Salinger, Khrushchev, Johnson, Kennedy.'
    tags: [name:salinger-pierre, name:khrushchev-nikita-s, name:johnson-lyndon-b, name:kennedy-john-f]
