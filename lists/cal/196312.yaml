  - id: cal.1963-12-04.africa
    when: Dec. 4
    date: '1963-12-04'
    thread: africa
    c: 'Security Council, Resolution 182, unanimous: South Africa called on again; all states to observe the arms embargo of Aug. 7; the Secretary-General to name a group of experts.'
    n: '[S.C. Res. 182](https://undocs.org/S/RES/182(1963)) (Dec. 4, 1963). See [[cal.1963-08-02.africa]].'
  - id: cal.1963-12-04.european-community
    when: Dec. 4
    date: '1963-12-04'
    thread: european-community
    also: [trade]
    c: 'Proclamation 3564: duties raised on potato starch, dextrine, brandy valued over $9 a gallon, and trucks of $1,000 or more, from Jan. 7, 1964, against the Community''s restrictions on American poultry. The GATT''s panel, Nov. 21, put the trade lost at $26 million; the United States had claimed $40 million, the Community $16 million.'
    n: '[Proclamation 3564—Proclamation Increasing Rates of Duty on Specified Articles](https://www.presidency.ucsb.edu/documents/proclamation-3564-proclamation-increasing-rates-duty-specified-articles) (Dec. 4, 1963). FRUS 1961–63, IX, docs. [260](https://history.state.gov/historicaldocuments/frus1961-63v09/d260) (Magnuson, Jackson and Engle, Feb. 20), [267](https://history.state.gov/historicaldocuments/frus1961-63v09/d267) (Ball''s reply), [292](https://history.state.gov/historicaldocuments/frus1961-63v09/d292) (the panel). To check: [[w.talbot-chicken-war]]; [[w.zeiler-american-trade-and-power]]; [[w.coppolaro-making-of-a-world]]. See [[cal.1962-01-14.european-community]].'
    tags: [name:johnson-lyndon-b]
  - id: cal.1963-12-04.black-nationalism
    when: Dec. 4
    date: '1963-12-04'
    thread: black-nationalism
    c: Muhammad suspends Malcolm X from speaking for ninety days.
    n: 'Check: the record. See [[cal.1963-12-01.black-nationalism]]. Names: Muhammad, Malcolm X.'
    tags: [name:muhammad-elijah, name:malcolm-x]
