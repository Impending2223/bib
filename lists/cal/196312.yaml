  - id: cal.1963-12-01.black-nationalism
    when: Dec. 1
    date: '1963-12-01'
    thread: black-nationalism
    also: [assassination]
    c: 'Malcolm X, speaking for Elijah Muhammad at the Manhattan Center, asked about Kennedy''s murder: "chickens coming home to roost." Muhammad had told his ministers to say nothing of it. Check: the hall.'
    n: 'To check: [[w.x-autobiography-of-malcolm-x]]; [[w.marable-malcolm-x]]; [[w.goldman-death-and-life-of]]; [[w.payne-dead-are-arising]]. Names: Malcolm X, Muhammad.'
    tags: [name:malcolm-x, name:muhammad-elijah, name:kennedy-john-f]
  - id: cal.1963-12-02.africa
    when: Dec. 2
    date: '1963-12-02'
    thread: africa
    c: 'The last Air Force contingents leave Sidi Slimane and Ben Guerir. Hassan to the American ambassador: dismay at the state in which Ben Guerir was left.'
    n: '[FRUS 1961–63, XXI, doc. 157](https://history.state.gov/historicaldocuments/frus1961-63v21/d157) (editorial note). See [[cal.1961-10-06.africa]], [[cal.1963-03-27.africa]]. Names: Hassan II.'
    tags: [name:hassan-ii]
  - id: cal.1963-12-02.civil-rights-bill
    when: Dec. 2
    date: '1963-12-02'
    thread: civil-rights-bill
    c: 'Johnson to Bolling, evening, in confidence: the discharge petition: "I think it''s got to go." Bolling counts about 160 Democrats, the Republicans "up in the air." Johnson: a vote against signing a vote against civil rights. Whitney Young with Johnson the same day.'
    n: '[Johnson and Bolling, 6:56 p.m.](https://prde.upress.virginia.edu/conversations/9020028), Tape K6312.02, PNO 8 (PRDE only). [[w.caro-passage-of-power]], 487–88, 490. Names: Johnson, Bolling, Whitney Young.'
    src:
      c: f62b6848
      rows:
        - 'https://prde.upress.virginia.edu/conversations/9020028: A-C'
        - 'w.caro-passage-of-power 487–88: all'
        - 'via w.caro-passage-of-power 487 n.telephoning-bolling: A-C'
    tags: [name:johnson-lyndon-b, name:bolling-richard, name:young-whitney-m-jr]
  - id: cal.1963-12-03.state-constitutions-ok
    when: Dec. 3
    date: '1963-12-03'
    thread: state-constitutions
    c: 'Oklahoma, special election. $7 million in debt for the University of Oklahoma Medical Center adopted, 152,940 to 56,137, 73.2 percent. Refused: four-year terms for county officers, 64,042 to 142,057, 31.1 percent, and for county judges; four-year terms for State representatives and six for senators, 43,907 to 160,649, 21.5 percent.'
    n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 39–40](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=39). See [[cal.1962-05-22.state-constitutions-ok]].'
    tags: [state:ok]
  - id: cal.1963-12-03.legislatures-ia
    when: Dec. 3
    date: '1963-12-03'
    thread: legislatures
    also: [state-constitutions]
    c: 'Iowa rejects the Shaff plan at a special election, 190,424 to 272,382, 41.1 percent: a Senate of 58 by population, a House of 99, one to a county. The federal court, May 3, had held the apportionment of 1904 and 1928 invidiously discriminatory and let the election go ahead; Judge McManus would have enjoined it. Jan. 14, 1964, the court orders a special session to reapportion before the 1964 elections.'
    n: '*Davis v. Synhorst*, [217 F. Supp. 492](https://static.case.law/f-supp/217/case-pdfs/0492-01.pdf) (S.D. Iowa 1963); [225 F. Supp. 689](https://static.case.law/f-supp/225/case-pdfs/0689-01.pdf) (S.D. Iowa 1964). [*Iowa Official Register, 1965–1966*](https://publications.iowa.gov/41452/1/Iowa%20Official%20Register%201965-1966.pdf), 113–115. To check: [[w.dixon-democratic-representation]]; [[w.larew-party-reborn]]. See [[cal.1962-03-26.court]]. Names: McManus.'
    tags: [state:ia, name:mcmanus-edward-j]
  - id: cal.1963-12-03.king
    when: Dec. 3
    date: '1963-12-03'
    thread: king
    also: [civil-rights-the-executive]
    c: 'King with Johnson and Lee White, forty-five minutes: Johnson for the civil rights bill and for Negro registration; no word of the Communist charges. King: "very fruitful."'
    n: '[Johnson and David McDonald, King joining, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only). [[w.garrow-bearing-the-cross]], 308; [[w.caro-passage-of-power]], 490 (shown the list of Republicans not yet on the petition). Names: King, Johnson, White.'
    src:
      c: 3688b851
      rows:
        - 'https://prde.upress.virginia.edu/conversations/9020036: all'
        - 'w.garrow-bearing-the-cross 308: all'
        - 'w.caro-passage-of-power 490: A'
    tags: [name:king-martin-luther-jr, name:johnson-lyndon-b, name:white-lee-c]
  - id: cal.1963-12-03.civil-rights-bill
    when: Dec. 3
    date: '1963-12-03'
    thread: civil-rights-bill
    also: [foreign-aid]
    c: 'The leaders'' breakfast, Meany in with Johnson from The Elms; labor''s "full support." The tax cut: "We have been a year in doing it. [We] can''t expect better results in a week." Civil rights before the committee since May, no hearings before next year; Johnson for the petition: "All you are asking is a hearing"; as many Democrats as can be had, the Republicans to match them. Albert''s count, 165 or 150; Johnson asks one by the whips. Albert Thomas brings six Texans. The leaders offer a cotton bill; Johnson will not "launch my administration with a Cotton Bill."'
    n: 'The breakfast, the petition and the counts: [Johnson and Carl Albert, 5:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-3-1963), Tape K6312.03 (Miller Center); [Johnson and David McDonald, 12:10 p.m.](https://prde.upress.virginia.edu/conversations/9020036), Tape K6312.02, PNO 18 (PRDE only); [[w.caro-passage-of-power]], 492–94. [[w.dallek-flawed-giant]], 70 (the tax cut, the committee and the cotton bill, from the notes of the breakfast, Diary Backup, LBJ Library). To check: "Notes on the First Congressional Leadership Breakfast," Dec. 3, 1963, Diary Backup, LBJ Library; [Johnson and Carl Albert, 3:00 p.m.](https://prde.upress.virginia.edu/conversations/9020038), Tape K6312.03, PNO 1 (PRDE only; the call Caro cites for the whips'' poll); [Johnson and Thornberry, 3:22 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-homer-thornberry-december-3-1963), Tape K6312.03 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment) (cited by [[w.caro-passage-of-power]], 492–94). See [[cal.1963-11-15.foreign-aid]]. Names: Meany, Johnson, Albert, Boggs, Albert Thomas, McCormack. Check: Dallek''s text gives Dec. 5, his note the breakfast of Dec. 3 (70 n.36).'
    src:
      c: b4467413
      rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-3-1963: A-B, D-I'
