  - id: cal.1963-12-23.soviet-union-leadership-3
    when: Dec. 23
    date: '1963-12-23'
    place: moscow
    thread: soviet-union-leadership
    also: [africa]
    follows:
      - cal.1963-12-23.soviet-union-leadership
    part_of: cal.1963-12-23.soviet-union-leadership-2
    c: 'The Presidium on the sale of arms to Somalia, stenographed. Khrushchev: the talk with Prime Minister Shermarke misjudged; he wants more arms, to turn against the Emperor of Ethiopia and Kenya. "Зачем им 120 танков, к тому же бесплатно?" (why do they need 120 tanks, and free?). The matter to be held back and the position reviewed, someone perhaps sent to talk to him; Soviet arms not to set African states against one another; a flexible line, not to push Somalia away.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 802 (the stenogram, "Вопрос по Сомали"; the heading the protocol''s, I, 1157 n.19, which prints "П 176/VII" for the file of P 126; no decision printed, in I or in III''s P 126, 622–29); I, 1157 nn.20–23 (the editors: Shermarke in the USSR in July 1963; Kenya independent Dec. 12, 1963; the Somali–Ethiopian border fighting of Feb. 1964, Khrushchev''s message to Shermarke and the Emperor, Feb. 10, 1964). See [[cal.1963-10-01.africa]]. Made public: 2003. Names: Khrushchev, Shermarke.'
    tags: [name:khrushchev-nikita-s, name:abdirascid-ali-shermarke, polity:ussr, vis:only:ussr]
  - id: cal.1963-12-23.soviet-union-leadership-4
    when: Dec. 23
    date: '1963-12-23'
    place: moscow
    thread: soviet-union-leadership
    follows:
      - cal.1963-12-23.soviet-union
    part_of: cal.1963-12-23.soviet-union-leadership-2
    c: 'The Presidium on calling the plenum on agriculture, stenographed. Brezhnev reads the draft decision. Khrushchev: the report to put first the managers'' skill in getting the most from the land, with science, not the plan''s fulfillment; the RSFSR Bureau and the republics'' central committees, in their co-reports, each to show its level of preparation; the growth of farm output added to the draft. He would have Volovchenko take a group of agrochemists and soil scientists to the GDR''s agricultural academy and farms, for fertilizer and mechanization: "немцы под боком" (the Germans are next door). Next, Cuba and Algeria, not stenographed.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 815–16 (the stenogram, Brezhnev reading the draft; the rest not stenographed); I, 1158 n.40 (the editors: the enlarged plenum on intensifying agriculture met Feb. 10–15, 1964); III, 625 (Malin''s jottings for the session, item V, the plenum''s preparation), 1045 n.5. See [[cal.1963-12-23.soviet-union-leadership]]. Made public: 2003. Names: Brezhnev, Khrushchev, Volovchenko.'
    tags: [name:khrushchev-nikita-s, name:brezhnev-leonid, polity:ussr, polity:gdr, vis:only:ussr]
