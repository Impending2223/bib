    n: 'The President''s First News Conference, [1963–64 Pub. Papers 34](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=118) (Dec. 7, 1963). [[w.caro-passage-of-power]], 475–78 (Byrd''s terms at the lunch of Dec. 5; McNamara''s cuts, Dec. 7); [[w.zelizer-taxing-america]], 202–03 (the budget held down for the tax bill); [[w.stein-fiscal-revolution-in-america]], 451–53 (Byrd: a lower budget, the cut from Jan. 1). Caro has Byrd holding to his terms at the lunch, the budget under $100 billion, in writing, shown to Williams (476–77); he does not give the Jan. 1 date. To check: [[w.heinemann-harry-byrd-of-virginia]]; [[w.taking-charge]]; New York Times, Dec. 8, 1963 (cited by [[w.caro-passage-of-power]], 478). See [[cal.1963-01-24.economy]]; [[cal.1963-09-25.economy]]. Names: Johnson, Byrd, McNamara.'
