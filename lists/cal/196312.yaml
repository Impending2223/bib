  - id: cal.1963-12-02.program
    when: Dec. 2
    date: '1963-12-02'
    thread: program
    c: 'The Cabinet Room, late afternoon. Johnson presents the Enrico Fermi Award to Oppenheimer, the citation signed by Kennedy before his death, with the $50,000 to Mrs. Oppenheimer. Present: the senior Democrats of the Atomic Energy Committee, Teller, Smyth; the ranking Republicans absent, "reportedly" by choice. Johnson, handing the check to Mrs. Oppenheimer: "The wives usually get hold of the money." Oppenheimer: "it has taken some charity and some courage for you to make this award today."'
    n: '[[w.johnson-white-house-diary]], 12–13 (Lady Bird Johnson''s account; she was present). To check: the Public Papers, remarks at the presentation, Dec. 2, 1963. Names: Johnson, Lady Bird Johnson, Oppenheimer, Kennedy, Teller.'
    tags: [name:johnson-lyndon-b, name:johnson-lady-bird, name:oppenheimer-j-robert, name:kennedy-john-f, name:teller-edward]
  - id: cal.1963-12-02.succession-2
