  - id: cal.1963-12-13.vietnam-2
    when: Dec. 13
    date: '1963-12-13'
    thread: vietnam
    c: 'Johnson to Forrestal: "Don''t you think that the situation in Vietnam is more hopeless today than it has ever been before." By Forrestal''s account to Schlesinger, Dec. 15, who reads it as a sign Johnson holds to his earlier views: silent in the formal discussions of Vietnam, he once told Forrestal privately, as Vice President, that he believed in the unconditional support of Diệm and that "you fellows in the White House" were making a great mistake in trying to disengage from him.'
