    c: 'Johnson to Katharine Graham of the *Washington Post* by telephone, on the discharge petition: "If we could ever get that signed, that would practically break [the Southerners''] backs in the Senate." Kennedy "tried since May on civil rights and he hasn''t been successful, so they better not be too quick to judge it."'
    n: '[[w.mann-walls-of-jericho]], 388–89; [[w.kotz-judgment-days]], 40 (the call, Dec. 2, for the *Post*''s editorial support of the petition; Kotz quotes other lines); [[w.zelizer-fierce-urgency-of-now]], 90 (Johnson asks the *Post* to treat the delay as obstruction; a member who will not sign "anti-civil rights"); [[w.taking-charge]], 81–85; [[w.sorensen-counselor]], 384 (Katharine Graham to Johnson on a recorded call the Monday after the speech: Sorensen did not look well, "He is very hurt," and she does not forgive him for asking her to leave a funeral planning meeting on the day of the assassination; Johnson: "I''ve done as much as I can and have any pride and self-respect left"; not the discharge petition). To check: [Johnson and Katharine Graham, 11:10 a.m.](https://prde.upress.virginia.edu/conversations/9020017), Tape K6312.01, PNO 19 (PRDE only), not heard; the transcript, Records of the JFK Assassination, Box 85, National Archives (cited by [[w.mann-walls-of-jericho]], 388). See [[cal.1963-11-29.civil-rights-bill]]. Names: Johnson, Katharine Graham, Kennedy.'
