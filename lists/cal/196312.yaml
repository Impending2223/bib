    c: Erhard at the LBJ Ranch. Six American divisions to stay in Germany, "as long as they are needed"; the offset, German purchases of American arms against the forces' dollar spending, to continue; no arrangement to perpetuate a divided Germany; the multilateral force "a new means of strengthening Western defense."
    n: 'Joint Statement Following Discussions With Chancellor Erhard, [1963–64 Pub. Papers 99](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=183) (Dec. 29, 1963). [FRUS 1961–63, XV, doc. 253](https://history.state.gov/historicaldocuments/frus1961-63v15/d253) (the talks, Dec. 28, 3:15 p.m.: East-West relations). [[w.schwartz-lyndon-johnson-and-europe]], 22–23, 65 (the talks; the six divisions); [[w.caro-passage-of-power]], 506–07 (the state visit of Dec. 28: Erhard met at Bergstrom, by helicopter to the ranch; Johnson and Erhard with only the interpreters present, Rusk and Schroeder with the staffs in the next room; the talk in a meadow; not the terms). [[w.gavin-gold-dollars-and-power]], 113, 139–40 (the divisions; the offset). To check: German record of the talks, *Akten zur Auswärtigen Politik der Bundesrepublik Deutschland 1963*, III, docs. 486, 490 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 23 n.57, 65 n.77); *Time*, Jan. 10, 1964, at 23 (cited by [[w.schwartz-lyndon-johnson-and-europe]], 22 n.55). See [[cal.1963-01-14.europe-and-the-alliance]]. Check: Gavin, 113, 140, quotes the communiqué: the offset of "great value to both governments," to be "fully executed and continued"; those are the words of the joint statement of Dec. 21, 1965; that of Dec. 29, 1963: "It was agreed that this arrangement should continue." Names: Erhard.'
