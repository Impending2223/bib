    n: '[[w.caro-passage-of-power]], 496–97. To check: Richmond Times-Dispatch, Dec. 5, 1963; New York Times, Dec. 5, 1963; New York Times, Dec. 6, 1963 (cited by [[w.caro-passage-of-power]], 497). Check: the statement''s text. Names: Smith, Clarence Brown, Halleck.'
