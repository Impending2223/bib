    thread: china-leadership
    c: 'Mao to Ke Qingshi and Chen Pixian on an item in the General Office''s *Qunzhong fanying* no. 84: the matter must be solved, they must be got into work; even if not at once, relief money to keep them until work is found. How many unemployed has Shanghai, some hundreds of thousands? Report, with their views. To Liu Shaoqi, Deng Xiaoping and Peng Zhen: he has written the lines to Ke and Chen on no. 84; if usable, to be sealed and sent by Yang Shangkun; a great matter worth attention. The item: letters seeking work from Shanghai, most from retrenched workers, then youths not placed in school or work.'
    n: '[[w.jianguo-yilai-mao-zedong]], XVII, 131–132 (Dec. 13, 1963); [[w.peng-zhen-nianpu-1902]], IV, 306–307 (Dec. 13, 1963; Peng Zhen sends Mao''s comment on *Qunzhong fanying* no. 84 ("Many in Shanghai urgently ask for a way to live") to Zheng Tianxiang and Wan Li, and tells Liu Ren and Wan Li to heed the question in Peking and act by it; on the 21st he sends Jia Xingwu''s report on Peking''s unemployed to the General Office''s secretariat). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 10 (1996). To check: Qunzhong fanying no. 84, Dec. 12, 1963, General Office secretariat: "Many people in Shanghai urgently ask to be given a livelihood" (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 132 n.2). Names: Mao Zedong, Ke Qingshi, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Yang Shangkun.'
