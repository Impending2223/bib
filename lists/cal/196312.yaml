    also: [trade, succession]
    c: 'The House, in at 7 a.m. on Christmas Eve, adopts Passman''s amendment to the aid appropriation, [189–158](https://voteview.com/rollcall/RH0880119): the President may allow Export-Import Bank guarantees on credit to Communist countries in the national interest. The wheat credit kept. Senate agrees Dec. 30, [56–14](https://voteview.com/rollcall/RS0880229). About $3 billion, against $4.5 billion asked. Signed Jan. 6, [77 Stat. 857](https://www.govinfo.gov/content/pkg/STATUTE-77/pdf/STATUTE-77-Pg857.pdf).'
    n: 'The House rose at 9:12 a.m.: [Daily Digest, D635](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=633). [109 Cong. Rec. House, Dec. 24, 1963](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt19/pdf/GPO-CRECB-1963-pt19-10-2.pdf). Statement by the President on the Proposed Reduction in Foreign Aid Funds, [1963–64 Pub. Papers 55](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=139) (Dec. 14, 1963). [[w.caro-passage-of-power]], 501–02; [[w.whalen-longest-debate]], 89; [[w.johnson-white-house-diary]], 19 (the House met early and passed the foreign aid bill, which released the Johnsons; not the amendment or the vote). See [[cal.1963-11-15.foreign-aid]]; [[cal.1963-10-09.trade]]. Names: Passman.'
