    c: Zhou Enlai gives a television interview to the British writer Greene on China's view of war and peace. China loves peace, opposes aggressive war and wants peaceful coexistence with all states, the United States included, on the five principles; but peace must be won, by uniting peace-loving forces against imperialist aggression. Self-reliance is to use one's own people's labor and resources and trade on equality and mutual benefit; it is not self-sufficiency or a closed door.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 599 (Dec. 5, 1963); [[w.zhou-enlai-waijiao-huodong]], 377 (Dec. 5, 1963; 中南海紫光阁, 与英国作家格林电视谈话); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 307–308 (Dec. 5, 1963; Zhou gives a television interview to the British writer Greene (格林): China is ready to realize peaceful coexistence with all countries, the U.S. included, on the five principles; self-reliance means developing one''s economy by one''s own people''s labor and wisdom and the resources of the country and trading with other countries on equality and mutual benefit, not autarky or a closed door; no country can make all it needs, but one that does not make what it can make has nothing to exchange; loans must be repaid, and no country can live on borrowing forever). Check: the writer''s given name and whether he is Graham Greene. Names: Zhou Enlai.'
