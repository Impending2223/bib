    date: '1963-12-05'
    thread: elections-1964
    also: [robert-kennedy, democratic-party]
    c: Robert Kennedy asks Schlesinger about seeking the Vice Presidency; Dolan has told him of support from Michigan's national committeewoman and Senator Dodd. Schlesinger against; Kennedy does not like a job "based on the premise of waiting around for someone to die." By Schlesinger's journal.
