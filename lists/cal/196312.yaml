    thread: civil-rights-bill
    also: [republican-party-congress]
    c: 'The House Republican conference against the petition, McCulloch and Ford speaking. Johnson to the Business Council and the AFL-CIO''s Executive Council: "the party of Lincoln." That evening Clarence Brown, Rules'' ranking Republican, to Smith: something has to be done.'
    n: 'Remarks to Members of the Business Council, [1963–64 Pub. Papers 22](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=106) (Dec. 4, 1963); Remarks at a Meeting With the AFL-CIO Executive Council, [1963–64 Pub. Papers 20](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=104) (Dec. 4, 1963). [[w.caro-passage-of-power]], 494–97. To check: [Johnson and Albert, 6:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-carl-albert-december-4-1963-0), Tape K6312.03 (Miller Center; not heard here: millercenter.org fails TLS verification from this environment) (cited by [[w.caro-passage-of-power]], 495). Names: McCulloch, Ford, Johnson, Clarence Brown, Smith.'
