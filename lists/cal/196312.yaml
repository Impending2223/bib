  - id: cal.1963-12-05.economy
    when: Dec. 5
    date: '1963-12-05'
    thread: economy
    c: 'Byrd to lunch in the small office off the Oval Office, asked by telephone Dec. 4, Valenti present. Byrd''s terms: the budget under $100 billion, in writing, seen by him and Williams, before the tax bill leaves Finance. To reporters: "what I''ve been asking for all along."'
