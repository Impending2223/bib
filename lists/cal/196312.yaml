    c: 'The Peking committee of the Party 中共北京市委 reports to the Center and the North China Bureau 华北局 on the suburbs'' farming: despite spring drought and the great rains of early August a third good harvest, grain about a tenth up, cotton area 19 percent and output some 40 percent up, pigs 26.4 percent up, past 1957; the best supply of vegetables for years; grain purchase 96.6 percent done, cotton 199 percent; the reasons: cadres laboring under socialist education, water works, machines and power better run, more fertilizer, over 400 new graduates, 796 trial projects with central institutes and colleges; the gaps between districts, sidelines, machines poorly used, slow extension, leaders seldom in the villages, conceit.'
