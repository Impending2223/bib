    also: [middle-east, china]
    c: Zhou Enlai, at Nasser's request, sets out in the talks Sino-American relations and other matters. America's holding of Taiwan is an international question, since America seized Chinese territory; the Chinese people and Chiang Kai-shek are another, an internal one; they must not be mixed; America makes it one question to split Taiwan off and make "two Chinas," the center of China's struggle in the United Nations.
    n: '[[w.zhou-enlai-nianpu-1949]], II, 602 (Dec. 19, 1963); [[w.zhou-enlai-waijiao-huodong]], 379 (Dec. 19, 1963; 下午5时30分, 开罗库巴宫, 第三次会谈); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 309–310 (Dec. 19, 1963; at the third talk with Nasser Zhou says on Taiwan: the Cairo declaration promised that Japan would return the territories seized from China since 1894; after Japan''s surrender the Chiang Kai-shek government sent men in 1945 to take over Taiwan and made a man governor; if it were not Chinese, Chiang could not now hold it; Truman once declared Taiwan Chinese, but in the Korean war the U.S. made it its protectorate; the civil war between the Chinese people and Chiang is not ended, the way to end it being China''s own matter; the U.S. holding of Taiwan is an international question and must not be mixed with it; the China question cannot be discussed with the German and Korean questions, which are the result of the Second World War); [[w.jian-zhou-enlai]], 500 (Cairo, three meetings with Nasser: support for the Arabs; Washington to blame; "forced to be anti-American"; India; a ten-year interest-free loan of 335 million Swiss francs); [[w.chen-yi-nianpu]], 1000 (Dec. 19, 1963, evening; Chen Yi in Zhou''s third talks with Nasser). Continues 603. Made public: 1993. To check: [[w.renmin-ribao]], Dec. 16, 1963 (cited by [[w.jian-zhou-enlai]], 500 n.32); Zhou''s one-on-one meeting with Nasser, December 20, 1963 (cited by [[w.jian-zhou-enlai]], 500 n.33a); Zhou''s third meeting with Nasser, December 19, 1963 (cited by [[w.jian-zhou-enlai]], 500 n.33b). Names: Zhou Enlai, Nasser, Chiang Kai-shek.'
