  - id: cal.1963-12-05.assassination
    when: Dec. 5
    date: '1963-12-05'
    thread: assassination
    c: The Warren Commission's first meeting, at the National Archives. The FBI's summary report to it, Dec. 9. Rankin its general counsel.
    n: '[Warren Commission, executive session transcript, Dec. 5, 1963](https://aarclibrary.org/publib/jfk/wc/wcexec/wcex1205/html/WCEX1205_0001a.htm) (AARC). National Archives: JFK Assassination Records Collection (K–J Adm. II.K). See [[cal.1963-11-29.assassination]]. Names: Warren, Rankin.'
    tags: [name:warren-earl, name:rankin-j-lee]
  - id: cal.1963-12-05.legislatures-ks
    when: Dec. 5
    date: '1963-12-05'
    thread: legislatures
    c: 'Kansas Supreme Court, *Harris v. Shanahan*: the Senate apportionment of 1963 (Senate Bill 440) and the House''s of 1961 void. It had withheld judgment Jan. 31 to give the 1963 legislature its chance. Governor Anderson calls a special session, which passes new apportionments, Senate Bill 2 and House Bill 2; the court holds them valid, Mar. 30, 1964.'
    n: '*Harris v. Shanahan*, [191 Kan. 1](https://static.case.law/kan/191/case-pdfs/0001-01.pdf), 378 P.2d 157 (1963); [192 Kan. 183](https://static.case.law/kan/192/case-pdfs/0183-01.pdf), 387 P.2d 771 (1963); [192 Kan. 629](https://static.case.law/kan/192/case-pdfs/0629-01.pdf), 390 P.2d 772 (1964). To check: [[w.dixon-democratic-representation]]; [[w.socolofsky-kansas-governors]]. See [[cal.1962-03-26.court]]. Names: Anderson.'
    tags: [state:ks, name:anderson-john-jr]
  - id: cal.1963-12-05.civil-rights-bill
    when: Dec. 5
    date: '1963-12-05'
    thread: civil-rights-bill
