  - id: cal.1963-12-01.poverty
    when: Dec. 1
    date: '1963-12-01'
    thread: poverty
    c: 'The Elms, Sunday supper. Johnson with Elizabeth Wickenden and Arthur Goldschmidt, friends from the New Deal: "I feel a moral obligation to carry on the things that Kennedy proposed, but I have to have issues I can take on as my own. I have to get reelected in a year." Poverty perhaps his issue.'
    n: '[[w.kotz-judgment-days]], 27 (Kotz spells her Wickendon). To check: [[w.lemann-promised-land]], 142; Arthur Goldschmidt and Elizabeth Wickenden, oral history, tape 2, LBJ Library (cited by [[w.kotz-judgment-days]], 27 n.34). Check: the day; Kotz gives a Sunday supper at The Elms after Heller''s visit of Nov. 23, no date (Johnson at The Elms to Dec. 7: Nov. 24 or Dec. 1). See [[cal.1963-11-23.poverty-2]]. Names: Johnson, Goldschmidt, Kennedy.'
    src:
      c: 1c4e5e2c
      rows:
        - 'w.kotz-judgment-days 27: all'
        - 'via w.kotz-judgment-days 27 n.34b: all'
    tags: [name:johnson-lyndon-b, name:goldschmidt-arthur-e, name:kennedy-john-f]
    time_range:
      - 1963-12-01T22:00Z
      - 1963-12-02T05:00Z
    time_zone: America/New_York
    range_basis: record
