    when: Dec. 23
    date: '1963-12-23'
    place: moscow
    thread: soviet-union-leadership
    c: 'The Presidium in session, Protocol 126, Khrushchev presiding. Present: Brezhnev, Voronov, Kirilenko, Kosygin, Mikoyan, Podgorny, Polyansky, Shvernik, Efremov; the secretaries Andropov, Demichev, Ilyichev, Polyakov, Ponomarev, Rudakov, Titov, Shelepin.'
    n: '[[w.prezidium-tsk-kpss-1954]], I, 781–819 (Protocol 126, Malin''s notes, 781–83; the stenogram, 783–819); I, 1155 n.1 (those present); III, 622–33 (P 126); III, 1045 n.1 (those present). Names: Khrushchev, Brezhnev, Voronov, Kirilenko, Kosygin, Mikoyan, Podgorny, Polyansky, Shvernik, Andropov, Demichev, Ponomarev, Shelepin.'
    tags: [name:khrushchev-nikita-s, name:brezhnev-leonid, name:voronov-gennady-i, name:kirilenko-andrei-p, name:kosygin-aleksei, name:mikoyan-anastas, name:podgorny-nikolai-v, name:polyansky-dmitri-s, name:shvernik-nikolai-m, name:andropov-yuriy-vladimirovich, name:demichev-pyotr-n, name:ponomarev-boris-n, name:shelepin-aleksandr-n]
