    c: 'Sullivan to Belmont, a memorandum on the conference: six decisions. The fifth: "We will, at the proper time when it can be done without embarrassment to the Bureau, expose King as an immoral opportunist who is not a sincere person but is exploiting the racial situation for personal gain."'
    n: '[S. Rep. No. 94-755, Book III, 133–34 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=147) (Sullivan to Belmont, Dec. 24, 1963: his account of the conference and its six decisions, quoted; the fifth without "immoral"). [[w.branch-parting-the-waters]], 919 (the six-point plan of the "nine-hour war council," the fifth point''s words in part, the pledges to proceed "without embarrassment to the Bureau"; the memorandum by its note); [[w.branch-pillar-of-fire]], 196–97 (Sullivan''s report on the meeting: "embarrassment to the Bureau" five times; the fifth decision''s words); [[w.kotz-judgment-days]], 83–84 (Sullivan''s "two-and-a-half-page report to Hoover": "extreme embarrassment to the Bureau" five times; "an immoral opportunist who is not a sincere person but is exploiting the racial situation for personal gain"); [[w.schlesinger-robert-kennedy-and-his]], 363 (the nine-hour session of Dec. 23, 1963, and a plan; the words it quotes for the plan, "a fraud, demagogue and scoundrel," "to take him off his pedestal," are Sullivan''s memorandum of Jan. 8, 1964, by the Church committee''s report, Book III, 136). To check: Sullivan to Belmont, Dec. 24, 1963, FBI file 100-3-116, serial 684 (cited by [[w.branch-parting-the-waters]], 919 n.2); Sullivan to Belmont, Dec. 24, 1963, FK-NR (cited by [[w.branch-pillar-of-fire]], 196, 197). See [[cal.1963-11-20.king]], [[cal.1963-12.king]]. Names: Sullivan, Belmont, Martin Luther King. Check: the Church committee''s report prints the fifth decision "expose King as an opportunist who is not a sincere person" (Book III, 134), without "immoral.".'
