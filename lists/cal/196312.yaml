  - id: cal.1963-12-02.civil-rights-bill
    when: Dec. 2
    date: '1963-12-02'
    time: 1963-12-02T23:56Z
    thread: civil-rights-bill
    c: 'Johnson to Bolling, evening, in confidence: the discharge petition: "I think it''s got to go." Bolling counts about 160 Democrats, the Republicans "up in the air." Johnson: a vote against signing a vote against civil rights. Whitney Young with Johnson the same day.'
    n: '[Johnson and Bolling, 6:56 p.m.](https://prde.upress.virginia.edu/conversations/9020028), Tape K6312.02, PNO 8 (PRDE only). [[w.caro-passage-of-power]], 487–88, 490; [[w.branch-pillar-of-fire]], 180; [[w.purdum-idea-whose-time-has-2014]], 164 (the call to Bolling on Monday, Dec. 2: the discharge petition "the only lever"; not the count of 160 nor Young). To check: Dictabelt of telephone conversation between LBJ and Rep. Richard Bolling, 6:50 p.m., Dec. 2, 1963 (cited by [[w.branch-pillar-of-fire]], 180). Names: Johnson, Bolling, Whitney Young.'
