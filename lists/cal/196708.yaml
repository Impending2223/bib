  - id: cal.1967-08-09.states-and-cities
    when: Aug. 9
    date: '1967-08-09'
    thread: states-and-cities
    also: [cities-and-housing]
    c: 'The District of Columbia. The House refuses to disapprove Reorganization Plan No. 3 of 1967, [160–244](https://voteview.com/rollcall/RH0900108): the three commissioners give way to a Commissioner, an Assistant Commissioner and a Council of nine, all appointed by the President.'
    n: 'Letter to the Speaker of the House Urging Support of the Reorganization Plan for the District of Columbia, [1967 Pub. Papers 754](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=146) (Aug. 8, 1967); Statement by the President Following Action in the House of Representatives on the Reorganization Plan for the District of Columbia, [1967 Pub. Papers 757](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=149) (Aug. 9, 1967). To check: [[w.gillette-between-justice-and-beauty]]; [[w.jaffe-dream-city]]. See [[cal.1966-02-21.states-and-cities-dc]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
