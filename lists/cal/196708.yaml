    n: 'Check: the record. See [[cal.1967-08-17.vietnam]]. Names: Marcovich, Aubrac.'
    tags: [name:marcovich-hebert, name:aubrac-raymond]
  - id: cal.1967-08-22.vietnam-pennsylvania
    when: Aug. 22
    date: '1967-08-22'
    thread: vietnam-pennsylvania
    c: 'McNamara to Harriman: after the elections, tie the bombing to negotiations.'
    n: 'FRUS 1964–68, V, docs. [292](https://history.state.gov/historicaldocuments/frus1964-68v05/d292), [293](https://history.state.gov/historicaldocuments/frus1964-68v05/d293). See [[cal.1967-08-17.vietnam]]. Names: McNamara, Harriman.'
    tags: [name:mcnamara-robert-s, name:harriman-w-averell]
  - id: cal.1967-08-22.middle-east
    when: Aug. 22–24
    date: '1967-08-22'
    thread: middle-east
    c: 'The Shah in Washington. Two private talks with Johnson; Rusk; Humphrey; the Senate Foreign Relations Committee. Arms: no firm promises while Congress acts on the credit sales; jet training in the United States for 60 Iranian pilots, 75 if needed. The joint statement, Aug. 23: a study of Iran''s water resources; a settlement in Vietnam on the basis of the Geneva Agreements of 1954.'
    n: 'Joint Statement Following Discussions With the Shah of Iran, [1967 Pub. Papers 806](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=198) (Aug. 23, 1967). FRUS 1964–68, XXII, docs. [218](https://history.state.gov/historicaldocuments/frus1964-68v22/d218), [233](https://history.state.gov/historicaldocuments/frus1964-68v22/d233), [236](https://history.state.gov/historicaldocuments/frus1964-68v22/d236), [237](https://history.state.gov/historicaldocuments/frus1964-68v22/d237). Made public: FRUS 1964–68, XXII (1999). [[w.bill-eagle-and-the-lion]]; [[w.mcglinchey-us-arms-policies-towards]]; [[w.offiler-us-foreign-policy-and]]. See [[cal.1966-06-29.middle-east]]. Names: Pahlavi, Johnson, Rusk, Humphrey.'
    tags: [name:pahlavi-mohammed-reza, name:johnson-lyndon-b, name:rusk-dean, name:humphrey-hubert-h, name:nitze-paul]
  - id: cal.1967-08-23.opinion
    when: Aug. 23
    date: '1967-08-23'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 3–8: Republicans'' choice for 1968: Nixon 33 percent, Romney 26, Reagan 15, Rockefeller 12, Percy 6, Lindsay 3, Hatfield 2. Independents: Nixon 22, Romney 19, Rockefeller 18, Reagan 14, Percy 9, Lindsay 6, Hatfield 3.'
    n: '[[w.gallup-poll]], III, 2077. Names: Nixon, Romney, Reagan, Rockefeller, Percy, Lindsay, Hatfield.'
    tags: [name:nixon-richard-m, name:romney-george-w, name:reagan-ronald, name:rockefeller-nelson, name:percy-charles-h, name:lindsay-john-v, name:hatfield-mark-o]
  - id: cal.1967-08-23.vietnam-elections
    when: Aug. 23–25
    date: '1967-08-23'
    thread: vietnam-elections
    c: 'Johnson asks Bliss and Guy, among others, to go to South Vietnam as observers of the election.'
    n: '[Johnson and Bliss](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-ray-bliss-august-23-1967), Aug. 23, Conversation WH6708-01-12104; [Johnson, Guy and Watson](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-guy-and-marvin-watson-august-25-1967), Aug. 25, Conversation WH6708-01-12106 (Miller Center). See [[cal.1967-08-16.vietnam]]. Names: Bliss, Guy, Johnson.'
    tags: [name:bliss-ray-c, name:guy-william-l, name:johnson-lyndon-b]
  - id: cal.1967-08-23.electoral-college
    when: Aug. 23
    date: '1967-08-23'
    thread: electoral-college
    c: 'The election hearings'' last day. The subcommittee reports no resolution in the 90th Congress.'
    n: '*Election of the President* hearings, [677–86](https://www.govinfo.gov/content/pkg/CHRG-89shrg90902/pdf/CHRG-89shrg90902.pdf#page=687); History of Bills, 1967, [S.J. Res. 2](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt28/pdf/GPO-CRECB-1967-pt28-2.pdf#page=79). See [[cal.1967-07-12.electoral-college]].'
  - id: cal.1967-08-24.testing
    when: Aug. 24
    date: '1967-08-24'
    thread: testing
    also: [soviet-union]
    c: 'Geneva. The United States and the Soviet Union, co-chairmen of the Eighteen-Nation Disarmament Committee, table identical drafts of a treaty on the nonproliferation of nuclear weapons; Article III, on safeguards, left blank. Foster for the United States. Johnson: "the final and most critical stage."'
    n: 'Statement by the President on the Eighteen-Nation Disarmament Committee''s Draft Treaty on Nuclear Nonproliferation, [1967 Pub. Papers 807](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=199) (Aug. 24, 1967). FRUS 1964–68, XI, doc. [201](https://history.state.gov/historicaldocuments/frus1964-68v11/d201). [[w.seaborg-stemming-the-tide]]; [[w.brands-rethinking-nonproliferation]]. See [[cal.1966-10-10.soviet-union]]. Names: Foster, Johnson.'
    tags: [name:foster-william-c, name:johnson-lyndon-b]
  - id: cal.1967-08-24.vietnam-air-war
    when: Aug. 24
    date: '1967-08-24'
    thread: vietnam-air-war
    c: 'Phúc Yên airfield: the Chiefs for, McNamara and Nitze against; Johnson "inclined to hit it"; Rusk doubtful.'
    n: 'FRUS 1964–68, V, doc. [294](https://history.state.gov/historicaldocuments/frus1964-68v05/d294). See [[cal.1967-08-11.vietnam]]. Names: McNamara, Nitze, Johnson, Rusk.'
    tags: [name:mcnamara-robert-s, name:nitze-paul, name:johnson-lyndon-b, name:rusk-dean, name:wheeler-earle, name:mcconnell-john-p]
  - id: cal.1967-08-24.states-and-cities
    when: Aug. 24
    date: '1967-08-24'
    thread: states-and-cities
    c: 'The District of Columbia. Johnson to Lindsay: he regrets Lindsay''s having told the press whom he would appoint.'
    n: '[Johnson and Lindsay, 10:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-lindsay-august-24-1967), Conversation WH6708-01-12105 (Miller Center). See [[cal.1967-08-09.states-and-cities]]. Names: Johnson, Lindsay.'
    tags: [name:johnson-lyndon-b, name:lindsay-john-v, state:dc, city:washington]
  - id: cal.1967-08-25.black-nationalism
    when: Aug. 25
    date: '1967-08-25'
    thread: black-nationalism
    also: [king, civil-rights-organizations]
    c: 'Hoover''s FBI opens a counterintelligence program against "black nationalist, hate-type organizations": a letter to twenty-three field offices, to "expose, disrupt, misdirect, discredit, or otherwise neutralize" them, their leaders and members. Named: SNCC, SCLC, the Revolutionary Action Movement, the Deacons for Defense and Justice, CORE, the Nation of Islam; Carmichael, Brown, Elijah Muhammad, Maxwell Stanford.'
    n: 'Memorandum, FBI Headquarters to the field offices, Aug. 25, 1967, as quoted in [S. Rep. No. 94-755, Book III, 20 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=24). Made public: the Church Committee, *Supplementary Detailed Staff Reports on Intelligence Activities and the Rights of Americans*, Book III (1976). [[w.oreilly-racial-matters-the-fbis]]; [[w.garrow-fbi-and-martin-luther]]. Names: Hoover, Carmichael, Brown, Elijah Muhammad.'
    tags: [name:hoover-j-edgar, name:carmichael-stokely, name:brown-h-rap, name:muhammad-elijah]
  - id: cal.1967-08-25.vietnam-air-war
    when: Aug. 25
    date: '1967-08-25'
    thread: vietnam-air-war
    also: [congress]
    c: 'McNamara to the Stennis subcommittee: the enemy''s operations in the South cannot be stopped by bombing, "short, that is, of the virtual annihilation of North Vietnam and its people"; of the targets the Chiefs had proposed, 57 not yet authorized, and of little consequence (Check the words and the figure).'
    n: '*Air War Against North Vietnam* hearings, pt. 4 (Check the part and pages). See [[cal.1967-08-09.vietnam]]. Names: McNamara, Stennis.'
    tags: [name:mcnamara-robert-s, name:stennis-john-c]
  - id: cal.1967-08-25.foreign-aid
    when: Aug. 25
    date: '1967-08-25'
    thread: foreign-aid
    c: 'The House strikes the section allowing the Export-Import Bank to finance arms sales, [236–157](https://voteview.com/rollcall/RH0900119), cuts technical assistance $23 million, [234–163](https://voteview.com/rollcall/RH0900120), and passes H.R. 12048, the foreign aid authorization, [202–194](https://voteview.com/rollcall/RH0900121).'
    n: 'Check: the Record''s page. See [[cal.1967-08-15.foreign-aid]].'
  - id: cal.1967-08-25.vietnam-pennsylvania
    when: Aug. 25
    date: '1967-08-25'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Marcovich and Aubrac ask Mai Văn Bộ to send the message on, with word that the bombing would be restricted for ten days (Check).'
    n: 'Check: the record. See [[cal.1967-08-17.vietnam]]. Names: Marcovich, Aubrac, Mai Văn Bộ.'
    tags: [name:marcovich-hebert, name:aubrac-raymond, name:mai-van-bo]
  - id: cal.1967-08-26.economy
    when: Aug. 26
    date: '1967-08-26'
    thread: economy
    also: [trade]
    c: 'London: the ministers and central bankers of the Group of Ten agree on the outline of a new reserve asset, special drawing rights at the International Monetary Fund, for the Fund''s meeting at Rio de Janeiro in September.'
    n: 'FRUS 1964–68, VIII, doc. [141](https://history.state.gov/historicaldocuments/frus1964-68v08/d141) (editorial note). [[w.gavin-gold-dollars-and-power]]; [[w.solomon-international-monetary-system-1945]].'
  - id: cal.1967-08-27.opinion
    when: Aug. 27
    date: '1967-08-27'
    thread: opinion
    also: [crime-and-hijacking]
    c: 'Gallup, Aug. 3–8: a law requiring a police permit to buy a gun: favor 73 percent, oppose 23. Whites 73, Negroes 70 in favor.'
    n: '[[w.gallup-poll]], III, 2077.'
  - id: cal.1967-08-28.economy
    when: Aug. 28
    date: '1967-08-28'
    thread: economy
    also: [trade]
    c: 'Johnson with Fowler, Martin, Deming and Ackley on special drawing rights: "the greatest forward step in world financial cooperation in the 20 years since the creation of the International Monetary Fund itself."'
    n: 'Remarks at a News Briefing Following the Announcement of the Creation of a New International Monetary Reserve Asset, [1967 Pub. Papers 810](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=202) (Aug. 28, 1967). See [[cal.1967-08-26.economy]]. Names: Fowler, Martin, Deming, Ackley, Johnson.'
    tags: [name:fowler-henry-h, name:martin-william-mcchesney-jr, name:deming-frederick-l, name:ackley-gardner, name:johnson-lyndon-b]
  - id: cal.1967-08-28.cities-and-housing
    when: Aug. 28
    date: '1967-08-28'
    thread: cities-and-housing
    also: [poverty]
    c: 'The Senate Appropriations Committee: rent supplements, the $40 million asked; model cities, $537 million. Johnson: pass "the $7 billion in vitally needed city programs."'
    n: 'Statement by the President Following Senate Committee Action on the Model Cities and Rent Supplement Programs, [1967 Pub. Papers 809](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=201) (Aug. 28, 1967). See [[cal.1967-08-16.cities-and-housing]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:magnuson-warren-g]
  - id: cal.1967-08-28.open-housing-milwaukee
    when: Aug. 28
    date: '1967-08-28'
    thread: open-housing
    also: [states-and-cities]
    c: Milwaukee. The NAACP Youth Council, Groppi its adviser, close to 200, marches across the 16th Street Viaduct to the South Side for Vel Phillips's open housing ordinance, which the Common Council has refused four times; a crowd of thousands throws bricks, rocks and bottles. Again Aug. 29, to Kosciuszko Park. Maier forbids night marches for thirty days (Check the day). The marches go on, nightly.
    n: '[March on Milwaukee (University of Wisconsin–Milwaukee Libraries), "Open Housing"](https://uwm.edu/marchonmilwaukee/keyterms/open-housing/); *Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download) (AP). [[w.jones-selma-of-the-north]]. See [[cal.1965-12-09.open-housing-wi]]; [[cal.1966-08.desegregation-public-places-milwaukee]]. Names: Groppi, Phillips, Maier.'
    tags: [state:wi, city:milwaukee, name:groppi-james, name:phillips-vel, name:maier-henry-w]
  - id: cal.1967-08-29.mississippi-ms
    when: Aug. 29
    date: '1967-08-29'
    thread: mississippi
    also: [governors, elections-1967]
    c: 'Mississippi''s Democratic runoff for governor: Williams 371,815, 54.5 percent; Winter 310,527.'
    n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: the date, and MDAH Series 0107. See [[cal.1967-08-08.mississippi-ms]]. Names: Williams, Winter.'
    tags: [state:ms, name:williams-john-b, name:winter-william-f]
  - id: cal.1967-08-30.court
    when: Aug. 30
    date: '1967-08-30'
    thread: court
    also: [confirmations]
    c: The Senate confirms Thurgood Marshall to the Supreme Court, [69–11](https://voteview.com/rollcall/RS0900176), the first Negro on the Court.
    n: '[Johnson and Cecilia Marshall](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-cecilia-marshall-august-31-1967), Aug. 31, Conversation WH6708-01-12107 (Miller Center). See [[cal.1967-06-13.court]]. Names: Marshall.'
    tags: [name:marshall-thurgood]
  - id: cal.1967-08-30.mayors-miami
    when: Aug. 30–31
    date: '1967-08-30'
    thread: mayors
    c: Miami. Mayor High, in office since 1957, the Democratic nominee for governor in 1966, dies at 43. Aug. 31, Commissioner Stephen P. Clark succeeds him.
    n: '[Wikipedia, "Robert King High"](https://en.wikipedia.org/wiki/Robert_King_High); [Wikipedia, "Stephen P. Clark"](https://en.wikipedia.org/wiki/Stephen_P._Clark). Check: the City Commission''s minutes. [[w.colburn-floridas-gubernatorial-politics-in]]; [[w.dunn-black-miami-in-the]]. See [[cal.1966-11-08.governors-fl]]. Names: High, Stephen Clark.'
    tags: [state:fl, city:miami, name:high-robert-king, name:clark-stephen-p]
  - id: cal.1967-08-30.opinion
    when: Aug. 30
    date: '1967-08-30'
    thread: opinion
    also: [civil-disorders, crime-and-hijacking]
    c: 'Gallup, Aug. 3–8: respect for the police in one''s area: a great deal 77 percent, some 17, hardly any 4. Any police brutality in this area: yes 6, no 81.'
    n: '[[w.gallup-poll]], III, 2077.'
  - id: cal.1967-08-31.vietnam-air-war
    when: Aug. 31
    date: '1967-08-31'
    thread: vietnam-air-war
    also: [congress]
    c: 'The Stennis subcommittee''s report: for the military''s view, against the restrictions (Check).'
    n: 'Check: the report''s title and pages. See [[cal.1967-08-09.vietnam]]. Names: Stennis.'
    tags: [name:stennis-john-c]
  - id: cal.1967-08-31.vietnam-pennsylvania
    when: Aug. 31
    date: '1967-08-31'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Hanoi again refuses Marcovich and Aubrac visas.'
    n: 'Check: the record. See [[cal.1967-08-17.vietnam]]. Names: Marcovich, Aubrac.'
    tags: [name:marcovich-hebert, name:aubrac-raymond]
  - id: cal.1967-08-31.congo
    when: Aug. 31
    date: '1967-08-31'
    thread: congo
    c: 'Rostow to Johnson: Rusk, McNamara and Helms for five CIA-paid pilots to fly Mobutu''s T-28s for three months.'
    n: 'FRUS 1964–68, XXIII, doc. [544](https://history.state.gov/historicaldocuments/frus1964-68v23/d544). See [[cal.1967-07-05.congo]]. Names: Rostow, Johnson, Rusk, McNamara, Helms, Mobutu.'
