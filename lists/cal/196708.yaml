  - id: cal.1967-08-25.china-leadership-3
    when: Aug. 25
    date: '1967-08-25'
    time: 1967-08-24T17:00Z
    place: peking
    thread: china-leadership
    also: [china]
    c: 'Zhou Enlai talks at 1 a.m. with Yang Chengwu, back from Shanghai: on the provinces, Wang Li''s Aug. 7 speech inciting the rebels to seize the Foreign Ministry, the burning of the British office and the siege of Zhongnanhai to seize Liu Shaoqi. "How can this go on? I fear a chain reaction. Two things must not be shaken: the Center''s leadership and the PLA''s prestige." He sends Yang to Shanghai to report to Mao with Wang Li''s Aug. 7 speech.'
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 178 (Aug. 25, 1967); [[w.macfarquhar-maos-last-revolution]], 229 (before dawn, alone; Yang just flown in from Shanghai; Zhou sees no choice but to ask the Chairman to decide; Yang flies back at once); [[w.mao-zedong-zhuan]], VI, ch. 76 n.67 (Aug. 25 at 1 a.m. Zhou Enlai sees Yang Chengwu alone, just come to Peking from Mao at Shanghai, gives him his view of the recent run of events, in particular Wang Li''s ''Aug. 7 speech'', hands him a record of it to take to Mao at once, and speaks of ''seizing the handful in the army'' in the *Hongqi* editorial drafted under Guan Feng; ''how can this go on? I fear a chain reaction; two things cannot be shaken, the Center''s leadership and the army''s prestige''; the book then gives Zhou''s later words to foreign guests on the extreme-left current of 1967, n.67; it does not give the details of the entry''s A or that Zhou sends Yang to Shanghai). [[w.yang-jisheng-tiandi-fanfu]], I, 544 (at 1 a.m. Zhou sees Yang Chengwu, Mao''s liaison, alone: the situation out of control; Wang Li''s Aug. 7 talk; the seizure of the Foreign Ministry; the British office burned; "the Center''s leadership must not be shaken, nor the army''s prestige"; Yang to fly with the Aug. 7 talk to Mao in Shanghai); [[w.jian-zhou-enlai]], 582 (early on Aug. 25, alone: Wang Li''s speech at the Foreign Ministry for seizing power, the siege of Zhongnanhai, the fire at the British office, "digging out capitalist roaders within the military"; "My biggest concern is the chain reaction"; Zhou gives Yang a copy of the Aug. 7 speech for Mao). Made public: 2020. To check: [[w.li-lishi-jiang-xuangao-wo]], 21 (cited by [[w.macfarquhar-maos-last-revolution]], 229 n.35); [[w.zhou-enlai-waijiao-wenxuan]], 483 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.67); [[w.wenqian-wannian-zhou-enlai]], 26th printing (2004), 241 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 544 n.75); [[w.zhou-enlai-nianpu-1949]], III, 182 (cited by [[w.jian-zhou-enlai]], 582 n.67a); [[w.zhou-enlai-zhuan-1949]], 967 (cited by [[w.jian-zhou-enlai]], 582 n.67b); [[w.zishen-yang-chengwu-nianpu-chronological]], 455 (cited by [[w.jian-zhou-enlai]], 582 n.67c). See [[cal.1967-08-25.china-leadership-2]]. Names: Zhou Enlai, Yang Chengwu, Wang Li, Liu Shaoqi, Mao Zedong.'
