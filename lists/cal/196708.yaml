    c: 'The Vietnam Information Group, housed in the White House, Kaplan its director: the agencies'' representatives, weekly with Rostow and Christian, a "quick reaction team" to "strike a positive note." Kaplan at its first meeting: "discretion," the press having called it a "miniature Office of War Information."'
    n: '[[w.herring-lbj-and-vietnam]], 143 (the group, its tasks and its first meeting). To check: Rostow to Johnson, Aug. 15, 1967, NSF Name File, box 7; Christian to Johnson, Aug. 22, 1967, Aides Files, Panzer, box 427; Kaplan to Rostow, two memoranda, Oct. 9, 1967, NSF Country File, Vietnam, box 99, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 143 n.118). See [[cal.1967-02-06.vietnam-support]]. Names: Kaplan, Rostow, Christian.'
