  - id: cal.1967-08-08.vietnam-congress
    when: Aug. 8
    date: '1967-08-08'
    thread: vietnam-congress
    c: 'Ford in the House: "grave misgivings ... about the way the war in Vietnam is going"; not more men, but let the military bomb, shell from the sea and quarantine Haiphong. To the press before: "a break with Administration policy."'
    n: '[113 Cong. Rec. 21897 ff.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt16/pdf/GPO-CRECB-1967-pt16-6-2.pdf#page=98) (House, Aug. 8, 1967). [[w.gibbons-u-s-government-and]], IV, 800. To check: *New York Times*, Aug. 9, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 800 n.2). Names: Ford.'
