    c: 'Afternoon, Hongqiao guesthouse. Mao hears Yang Chengwu on the Group''s meeting of Aug. 25. On Wang Li''s Aug. 7 talk: he could not have said such things, nor told Wang to run the Foreign Ministry. Who is to handle propaganda and foreign affairs: the first way better, Yao Wenyuan to take over, in time. The Foreign Ministry cadres'' files to be looked at and kept: "they have perhaps done it." Zhou is not well: sleep more, no long meetings. On those who would bring down the Heilongjiang revolutionary committee: "no."'
