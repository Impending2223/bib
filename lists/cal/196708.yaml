  - id: cal.1967-08-01.civil-disorders
    when: Aug. 1
    date: '1967-08-01'
    thread: civil-disorders
    c: 'McPherson to Christian: "we look awfully programmatic and legalistic"; quit "beating up on Congress" over the rat bill unless the President goes before a joint session; "rewarding" the rioters "a hollow issue." A visit to Newark with Governor Hughes. Shown to the President; no answer known.'
    n: '[[w.mcpherson-political-education]], 360–61 (the memorandum, quoted); [[w.schlesinger-robert-kennedy-and-his]], 797 (McPherson thought the President''s presentation "legalistic"; no point in criticizing everyone else, "especially Congress," "unless and until we are willing to go before them in joint session and state the case for America''s cities" (n.95: McPherson, *A Political Education*, 359–61); not the day, Christian, the rat bill or Newark). Names: McPherson, Christian, Richard Hughes.'
