    thread: china-leadership
    c: 'Wang Li receives the Foreign Ministry''s rebels: why may not Red Guards do diplomacy? Why not shake the Ministry''s Party committee? Tearing down Chen Yi, the direction right, why not; they have not yet the power, and with some they would have swagger. In mid-August the Ministry''s rebels storm the Ministry and declare its committee''s power seized.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 7, 1967. Made public: 2013. Names: Wang Li, Chen Yi.'
