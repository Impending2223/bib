  - id: cal.1967-08-08.mississippi-ms
    when: Aug. 8
    date: '1967-08-08'
    thread: mississippi
    also: [governors, elections-1967]
    c: Mississippi's Democratic primary for governor, the first since the Voting Rights Act. William Winter, the State treasurer, over U.S. Representative John Bell Williams, stripped of his seniority by the House Democrats in 1965 for backing Goldwater, 222,001 to 197,778, 32.5 percent; Swan 124,361, 18.2 percent; Barnett, governor 1960–64, 76,053, 11.1 percent; Waller, the Hinds County district attorney, 60,090, 8.8 percent; two others. Runoff between Winter and Williams.
    n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: Miss. Secretary of State, Election Returns (MDAH Series 0107). [[w.dittmer-local-people]], 417 (Winter and Williams to the runoff; no figures). To check: [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Winter, Williams, Swan, Barnett, Waller, Goldwater.'
