  - id: cal.1967-08-25.china-leadership
    when: Aug. 25
    date: '1967-08-25'
    thread: china-leadership
    c: 'Mao reads the Center, State Council, Military Commission and Group''s "Call to Hold Up the Army and Cherish the People": "very good, issue." A mass movement of supporting the army and cherishing the people; new compacts; trust and rely on the masses, the army and most cadres; the army firmly backs the revolutionary left and the Red Guards; the people help the "three supports, two armies" work; open mass self-criticism on both sides.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 147 (Aug. 25, 1967; Mao''s note ''Very good; issue as it is'' on the Center''s call issued Aug. 25); [[w.teiwes-tragedy-of-lin-biao]], 87 (on Aug. 25 a notice launches a "Support the army and love the people" movement, the sign that the army will be used to restore order; Zhou Enlai''s call for action before it, for him uncharacteristically strong). Made public: 2013. To check: Central Committee, State Council, Military Commission and Cultural Revolution Group, Call to hold up the army and cherish the people (Guanyu zhankai yong jun ai min yundong de haozhao 关于展开拥军爱民运动的号召), Aug. 25, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 147 n.1); [[w.nianyi-da-dongluande-niandai]], 266–268, 271 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65a); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E16 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65b); [[w.lee-politics-of-the-chinese]], 252–254 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65c). Names: Mao Zedong.'
