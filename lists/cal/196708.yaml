  - id: cal.1967-08-02.civil-disorders
    when: Aug. 2
    date: '1967-08-02'
    thread: civil-disorders
    c: 'The Cabinet on the riots. Clark: few Negroes in them, restraint, no conspiracy; Humphrey: "fifty-two cities potentially about to explode"; Gardner disputes his figures; Rusk on Carmichael and Rap Brown, some legal way to "take care of them"; Fowler: "It is incredible to think you can''t make a case"; Goldberg: "solutions do not come from nightsticks." Johnson after: "If I had ever known that he didn''t measure up to his daddy, I''d never have made him Attorney General."'
    n: '[[w.califano-triumph-and-tragedy-of]], 221–22. Names: Ramsey Clark, Humphrey, Gardner, Rusk, Carmichael, Fowler, Goldberg, Johnson.'
    src:
      c: 63db8744
      rows:
