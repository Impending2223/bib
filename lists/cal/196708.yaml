  - id: cal.1967-08-04.china-leadership
    when: Aug. 4
    date: '1967-08-04'
    thread: china-leadership
    c: 'Mao revises the draft Center "Some Decisions on the Hunan Question," and Aug. 7 agrees the revision. In the passage that the Group''s "Feb. 4 instruction" on the Hunan Military District''s report of "Xiangjiang Storm" "had a fault," he writes "was in error," and adds: from this learn; why send the Feb. 4 instruction in haste on one side''s word, unknown? So the Center is chiefly responsible. Four articles: the Hunan Military District''s self-criticism good; the district to be reorganized and a Hunan preparatory group started; the bodies to unite under it. Noon, the Hongqiao guesthouse, Shanghai, with Yang Chengwu, Zhang Chunqiao and Wang Dongxing, hearing Yu Lijin on Wuhan: the Feb. 4 instruction was wrong; the Center chiefly to blame, else the region would not submit; it put the region in the front line; "Xiangjiang Storm" was dissolved by the Group and the liaison meeting, unknown to him and to Lin Biao, but he takes the blame.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 4, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 136–137 (Aug. 4, 1967; Mao''s notes of Aug. 4 (''changed a little, the rest all good'') and 6 p.m. Aug. 7 (''read, agreed'') on the two drafts, and his changes to the passage on the Group''s Feb. 4 instruction; the Center issued the decision Aug. 10); [[w.macfarquhar-maos-last-revolution]], 215 (Aug. 7: Mao approves a Central Document speaking well of a "revolutionary armed force of mass character" in Hunan under the provincial preparatory group). Made public: 2013. Check: whether the Central Document Mao approved on Aug. 7 (215 n.67) is the Hunan decisions revised here. To check: Central Committee, Several decisions on the Hunan problem (Guanyu Hunan wenti de ruogan jueding 关于湖南问题的若干决定), four articles, drafts sent to Mao Aug. 4 and Aug. 7, issued Aug. 10, 1967: the Hunan Military District Party committee''s self-criticism good; the district to be reorganized and a preparatory group for a revolutionary committee started; the ''Agreement on stopping armed fights at once'' signed by Hunan''s two delegations at Peking to be carried out (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 137 n.1a); Hunan Military District Party Committee, self-criticism report on the errors made in the work of supporting the Left (Guanyu zhi zuo gongzuo zhong suo fan cuowu de jiancha baogao 关于支左工作中所犯错误的检查报告), 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 137 n.1b); Agreement on stopping armed fights at once (Guanyu lijike jianjue zhizhi wudou xieyi 关于立即坚决制止武斗协议), signed by the two delegations from Hunan to the Peking talks, 1967 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 137 n.1c); the Central Document of Aug. 7, 1967, in [[w.wuchanjieji-wenhua-dageming-wenjian]], I, 429 (cited by [[w.macfarquhar-maos-last-revolution]], 215 n.67). Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Wang Dongxing, Yu Lijin, Lin Biao.'
