  - id: cal.1967-08-09.china-leadership
    when: Aug. 9
    date: '1967-08-09'
    thread: china-leadership
    c: Zhou Enlai goes to Lin Biao's meeting, where Lin says this Cultural Revolution is "truly of the smallest cost and the greatest victory"; many Party and government organs are now paralyzed, outwardly in great disorder, but the disorder is "needed and normal"; "if it is to collapse, let it collapse".
    n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 174 (Aug. 9, 1967); [[w.macfarquhar-maos-last-revolution]], 215 (Lin Biao, to a closed meeting of central leaders and senior officers: arm the left and give arms to the leftist masses, as Mao instructs); [[w.teiwes-tragedy-of-lin-biao]], 86–87 (Lin''s talk to the leaders of the great military regions, notably the new Wuhan leaders Zeng Siyu and Liu Feng: party and government cadres who reform are welcome, all who can be saved to be saved; yet rebels may seize conservative leaders, are to teach erring army cadres, and attacks on military regions are no test of left and right; report everything to the Center: "The Premier and Comrades Chen Boda, Kang Sheng and Jiang Qing are working day and night"). Made public: 2020. Check: the book (215) dates Lin''s words "two days later" than Aug. 7; its note (215 n.68) cites his remarks on hearing Zeng Siyu and Liu Feng report. To check: Lin Biao, "Tingqu Zeng Siyu, Liu Feng tongzhi huibao shide chahua yiji ting huibao houde zhishi," mimeographed transcript, 1, Fairbank Center Library (cited by [[w.macfarquhar-maos-last-revolution]], 215 n.68); [[w.kau-lin-piao-affair]], 432, 435–437, 439, 441 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.63a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 595–597 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.63b). Names: Zhou Enlai, Lin Biao.'
