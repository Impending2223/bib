    c: 'Zhou Enlai, before dawn, receives the two factions of Guangxi come to Peking and severely criticizes the seizing of military supplies for Vietnam and factional armed fights: stop the "civil war" at once, seal and hand in arms, keep the railways open. Look how the civil war has gone: the railways fought over section by section are worse than the old warlord wars, and cannot be borne; attacking railways and taking field-army guns is nothing of the Cultural Revolution; the slogan "drag out the handful in the army" turns the spearhead.'
