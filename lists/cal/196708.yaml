    c: 'The Preparedness Investigating Subcommittee of Senate Armed Services, Stennis chairman, opens its hearings on the air war against the North, to Aug. 29. Sharp first, then Wheeler, the service chiefs and the air commanders: fewer limits on targets.'
    n: 'Daily Digest, [113 Cong. Rec. D403](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=401). *Air War Against North Vietnam: Hearings Before the Preparedness Investigating Subcommittee of the Senate Committee on Armed Services*, 90th Cong., 1st Sess., pts. 1–5 (1967) (Check). [[w.pentagon-papers]], IV; [[w.drea-mcnamara-clifford-and-the-2011]], 213, 215–16 (the hearings prepared; Sharp first; the chiefs, Sharp and Momyer for a wider air war); [[w.gibbons-u-s-government-and]], IV, 743–45; [[w.cosmas-joint-chiefs-of-staff]], 70–72; [[w.herring-lbj-and-vietnam]], 55, 57 (the hearings, announced in late June; the military''s two weeks first; Aug. 9 their first day). To check: [[w.clodfelter-limits-of-air-power]]; [[w.thompson-to-hanoi-and-back]]; [[w.sharp-strategy-for-defeat]]; [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; Wheeler to Westmoreland, Aug. 10, 1967, Backchannel Message File, Westmoreland/CBS Litigation Records, RG 407 (cited by [[w.herring-lbj-and-vietnam]], 55 n.118). See [[cal.1967-04-18.vietnam]]. Names: Stennis, Sharp, Wheeler.'
