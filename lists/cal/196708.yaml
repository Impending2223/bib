  - id: cal.1967-08-03.crime-and-hijacking
    when: Aug. 3
    date: '1967-08-03'
    thread: crime-and-hijacking
    c: 'New York, the Eastern shuttle, about 5 p.m.: the Secret Service takes Lady Bird Johnson off the plane at the runway after an anonymous call to Eastern Airlines that a bomb is on "the 5 o''clock shuttle." The other passengers get off too. She is airborne on another plane a little past 6 and reaches Washington at 7:30.'
    n: '[[w.johnson-white-house-diary]], 551–52. Names: Lady Bird Johnson.'
    tags: [name:johnson-lady-bird, city:nyc]
  - id: cal.1967-08-03.china-leadership
    when: Aug. 3
    date: '1967-08-03'
    thread: china-leadership
    c: 'Afternoon, Shanghai. Mao hears Yang Chengwu, back from Peking, relay what Lin Biao, Zhou Enlai and the Group need instruction on. On the staffing of the Wuhan, Shenyang, Jiangxi and Henan commands and some field and air units: the Cultural Revolution is good for knowing cadres; cadres are mostly good; "one pull, three beat down" is not reasonable; the courts and police have good men. Staff, rear-service, navy and air corps to send investigation teams of seven or eight to Hunan, Jiangxi, Anhui; Anhui the key; call them to Peking.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 3, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Lin Biao, Zhou Enlai.'
    tags: [name:mao-zedong, name:lin-biao, name:zhou-enlai, polity:prc, vis:only:prc]
