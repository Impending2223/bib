    c: 'Aboard the Sequoia, Johnson on how decisions are made, to columnists'' complaints that he is slow: "The important thing is not to get problems off your desk—it''s to make a decision that my grandchild and yours can live with." He has asked experienced men, George Ball one, to be "devil''s advocate" and give "a picture of all the bad things that could flow from a certain course of action."'
    n: '[[w.johnson-white-house-diary]], 554 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson, Ball.'
