  - id: cal.1967-08-16.china-leadership
    when: Aug. 16
    date: '1967-08-16'
    thread: china-leadership
    c: 'Shanghai. Mao receives the Albanian experts (Mo Yixiu and Mu Xi in the nianpu), who have come to translate, proof and publish *Quotations from Chairman Mao* in Albanian, Yao Wenyuan present. I do not know the use of the *Quotations*; time will tell. He said long ago to make *Marx*, *Engels*, *Lenin* and *Stalin Quotations*; no one took it up; take it up. The Chinese experience is limited; for other countries to consult. Of cadres: in seventeen years some have ceased to be Marxists, are content and do not advance; some do ill; some are good; teach the first, oust the second; most are good.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 16, 1967. Made public: 2013. Names: Mao Zedong, Yao Wenyuan. Check: the experts'' names in Albanian (the nianpu''s 莫依修 and 穆希). Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
    tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, polity:albania, vis:only:prc+albania@C-N]
