  - id: cal.1967-08-03.economy
    when: Aug. 3
    date: '1967-08-03'
    thread: economy-surcharge
    also: [vietnam]
    c: 'Special message on the budget and the economy. Fiscal 1968: spending up to $8.5 billion over January''s $135 billion, revenues $7 billion under; without a tax increase and control of spending the deficit "could exceed $28 billion." A surcharge of 10 percent on income taxes, corporate from July 1, 1967, individual from Oct. 1, to June 30, 1969, or as long as the war''s costs require; $6.3 billion in fiscal 1968. January''s proposal had been 6 percent. Corporate payments speeded; the excises on automobiles and telephones held. At least 45,000 more men to Vietnam this fiscal year. A news conference on the message the same day.'
    n: 'Special Message to the Congress: The State of the Budget and the Economy, [1967 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=125) (Aug. 3, 1967); The President''s News Conference on the Tax Message, [1967 Pub. Papers 740](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=132) (Aug. 3, 1967). [Johnson and Fowler, 9:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-july-26-1967), July 26, Conversation WH6707-01-12006 (Miller Center). [[w.zelizer-taxing-america]], 258 (the 10 percent surcharge); [[w.gibbons-u-s-government-and]], IV, 756, 758 (the message and the 10 percent; the 45,000 men). To check: William Forti to Laurence Woodworth, Aug. 4, 1967, National Archives, RG 128, Box 465, File: Economic (cited by [[w.zelizer-taxing-america]], 258 n.13); Joseph Barr to Lyndon Johnson, Aug. 11, 1967, National Archives, RG 56, Office of Tax Policy, Box 68, File: Tax Increase (cited by [[w.zelizer-taxing-america]], 258 n.13). See [[cal.1967-01-10.economy]]. Names: Johnson.'
