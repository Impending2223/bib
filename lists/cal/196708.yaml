  - id: cal.1967-08-01.program
    when: Aug. 1
    date: '1967-08-01'
    thread: program
    c: Morning, in Lady Bird Johnson's "Board of Directors Room," a session on the LBJ Library with Max Brooks, Gordon Bunshaft, Horace Busby, Arthur Drexler and Dorothy Territo, at President Grant's Cabinet table.
    n: '[[w.johnson-white-house-diary]], 550. Names: Lady Bird Johnson, Busby.'
    tags: [name:johnson-lady-bird, name:busby-horace]
  - id: cal.1967-08-01.china-leadership
    when: Aug. 1
    date: '1967-08-01'
    thread: china-leadership
    c: '*Hongqi* prints the editorial "The Proletariat Must Firmly Hold the Gun" for the army''s 40th anniversary, drafted under Guan Feng: it calls to expose the Party''s handful on the capitalist road in the army too and "fight them down and fight them stinking": "the great direction of the struggle."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 1, 1967. Names: Guan Feng.'
    tags: [polity:prc]
