    c: 'Liu Shaoqi writes to Mao and the Central Committee to state his political attitude further: when he sees it said that his aim is to "oppose the Party," "oppose socialism," "oppose Chairman Mao," "oppose Mao Zedong Thought," "restore capitalism in China" and "plot to usurp the Party''s power," he cannot accept it, for he has never thought so, and what he thought was the opposite; he has no faction in the Party and no illegal organizational activity inside it. The letter formally asks Mao and the Party Center to relieve him of all his posts in and outside the Party.'
