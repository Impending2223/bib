    place: shanghai
    thread: china-leadership
    c: 'Shanghai Diesel Engine Plant 上海柴油機廠. In the morning Geng Jinzhang 耿金章, a standing member of the Shanghai revolutionary committee and a head of the Workers'' General HQ, leads the "writing attack, armed defence" 文攻武衛 forces of the Workers'' General HQ and other bodies to crush the opposing "Shanghai Diesel Joint Command" 上柴聯司: he surrounds the plant by land and water, cuts off water and power, and breaks in with a 25-ton crawler crane in front.'
    n: '[[w.yang-jisheng-tiandi-fanfu]], I, 355; [[w.yang-jisheng-tiandi-fanfu]], I, 540 (Wang Hongwen''s Workers'' General Headquarters sends over 100,000 with clubs, spears and wooden guns, trucks, loaders and fire engines against the "Shanghai Diesel Engine Plant Revolutionary Rebel Joint Command"); [[w.jian-zhou-enlai]], 577 (Shanghai''s mainstream "revolutionary organizations," backed by Zhang Chunqiao and Yao Wenyuan, send hundreds of thousands of workers against the United Headquarters; by the day''s end it surrenders, and the citywide alliance behind it collapses). The words: 早上 (I, 355). Made public: 2009. To check: Jin Chunming 金春明, *Dabiandong niandai de tansuo* 《大變動年代的探索》 (Zhongguo shehui kexue chubanshe, 2009), 117–118 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 355 n.52); Xu Jingxian 徐景賢, *Xu Jingxian zuihou huiyi* 《徐景賢最後回憶》 (2013), 223–224 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 540 n.66); [[w.jingxian-shinian-yimeng]], 276 (cited by [[w.jian-zhou-enlai]], 577 n.49).'
