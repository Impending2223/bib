  - id: cal.1967-08-25.china-leadership-2
    when: Aug. 25–26
    date: '1967-08-25'
    time: 1967-08-25T01:00Z
    place: shanghai
    thread: china-leadership
    c: 'Shanghai. Mao twice hears Yang Chengwu, sent back by Zhou Enlai: Wang Li''s Aug. 7 talk to incite seizure of the Foreign Ministry; Guan Feng''s draft of the Aug. 1 *Hongqi* editorial urging "pull out the handful in the army." Mao: Wang Li''s talk is "a great, great, great poisonous weed"; Wang, Guan and Qi Benyu wreck the Cultural Revolution, not good men; "report to the Premier only; arrest them; Zhou to handle." On Qi: a serious error, to be criticized, a time limit, see whether he mends. On the 26th noon Yang returns and tells Zhou; Wang Li and Guan Feng are then isolated for examination; Qi Benyu in Jan. 1968.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1967. [[w.macfarquhar-maos-last-revolution]], 229–230 (Mao, after two or three hours'' sleep, sends for Yang first thing: Wang, Guan and Qi to be arrested, only the premier told, the premier in charge; before Yang leaves, Qi to be spared for now); [[w.macfarquhar-maos-last-revolution]], 230–231 (Mao''s comment on the transcript of Wang Li''s Aug. 7 remarks: "big, big, big poisonous weed"); [[w.mao-zedong-zhuan]], VI, ch. 76 n.68 (Aug. 25 at 1 a.m. Zhou Enlai sees Yang Chengwu, just come from Shanghai, and gives him the record of Wang Li''s talk of Aug. 7, to take at once to Mao, and speaks of the *Hongqi* editorial drafted by Guan Feng that calls for ''pulling out the handful in the army''; Yang flies that morning to Shanghai; Mao, smoking, hears him in silence and says go and rest, I shall think; next morning: ''Wang, Guan and Qi are wreckers of the cultural revolution, not good men; you report to the Premier alone, have them seized, the Premier to be responsible for handling it''; read over: ''then go back and have the Premier act at once''; he adds, ''Qi is to be left for now, to make a self-criticism, to win one over''; at noon on the 26th Yang is back at Peking and reports to Zhou alone, n.68). [[w.yang-jisheng-tiandi-fanfu]], I, 544–545 (on the morning of Aug. 26 Yang conveys Zhou''s views; Mao: Wang Li and Guan Feng wreck the Cultural Revolution, not good men; report to the Premier alone, have them seized, out of the Group; Qi Benyu to wait and see; on Wang''s Aug. 7 talk: "a great, great, great poisonous weed"); [[w.jian-zhou-enlai]], 582–583 (Yang flies back to Shanghai and at nine in the morning conveys Zhou''s report; at 9:00 a.m. on Aug. 26 Mao summons him: Wang Li, Guan Feng and Qi Benyu "not good people," Wang and Guan to be arrested at once, Qi on probation; Yang to fly back and report to Zhou directly; the time is the first day''s); [[w.friedman-shadow-cold-war]], 153 (Wang Li soon arrested after Zhou''s personal appeal to Mao; the tide turns against the Group''s radicals after the burning of the British office and Wuhan); [[w.chen-yi-nianpu]], 1195 (late August 1967; Zhou sends Mao the record of Wang Li''s Aug. 7 talk; Mao writes on it "a great, great, great poisonous weed"; soon Wang Li, Guan Feng 关锋 and Qi Benyu 戚本禹 are arrested and the Foreign Ministry begins the movement to "criticize the ultra-left and seize the bad men"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: [[w.zishen-zhanjiang-yu-tongshuai]], 373–376 (cited by [[w.macfarquhar-maos-last-revolution]], 230 n.36); [[w.zhou-enlai-nianpu-1949]], III, 183 (cited by [[w.macfarquhar-maos-last-revolution]], 231 n.41); Yang Chengwu 杨成武, account of Mao''s decision on Wang Li, Guan Feng and Qi Benyu, Aug. 1967, in [[w.zhang-zishen-yang-chengwu-jiangjun-fangtanlu]], 43–45 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.68); [[w.zhou-enlai-zhuan-1949]], 1926 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 545 n.76); [[w.zishen-yang-chengwu-nianpu-chronological]], 455 (cited by [[w.jian-zhou-enlai]], 582 n.68); [[w.zishen-yang-chengwu-nianpu-chronological]], 455 (cited by [[w.jian-zhou-enlai]], 583 n.70a); [[w.jisen-cultural-revolution-in-the]], 214–26 (cited by [[w.friedman-shadow-cold-war]], 153 n.20). Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Wang Li, Guan Feng, Qi Benyu.'
