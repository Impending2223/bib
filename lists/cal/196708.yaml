    c: 'By Perry''s account, Wheeler gathers the Joint Chiefs in his office after McNamara''s testimony, no aides, no notes, and proposes they resign together at a press conference in the morning; Harold Johnson the most for it. Aug. 26, Wheeler: "We can''t do it. It''s mutiny." He asks a seat at the Tuesday lunch.'
    n: '[[w.gibbons-u-s-government-and]], IV, 751–52; [[w.herring-lbj-and-vietnam]], 56 (Perry''s story: the resignation agreed, then reversed in the morning, "It''s mutiny"; denied by the two members living); [[w.bernstein-guns-or-butter]], 357 (the Chiefs agree that night to resign the next morning at a press conference; Wheeler calls it off); [[w.dallek-flawed-giant]], 478 (after McNamara''s testimony the Joint Chiefs, enraged, consider a mass resignation; not Perry''s account, Harold Johnson or Aug. 26). Check: Perry''s the only account Gibbons gives; Herring gives Perry''s source as an unnamed "former JCS flag rank officer," and Greene''s and Moorer''s denials (198 n.120). To check: [[w.perry-four-stars]], 162–64, 169 (cited by Gibbons, IV, 751). See [[cal.1967-08-25.vietnam-air-war]]. Names: Wheeler, Harold K. Johnson, McNamara, Moorer, McConnell.'
