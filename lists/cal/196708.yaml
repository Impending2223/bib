  - id: cal.1967-08-10.economy-surcharge
    when: Aug. 10
    date: '1967-08-10'
    thread: economy-surcharge
    c: 'Johnson with fourteen business leaders, Dillon, Henry Ford II, Gates, Kappel, David Rockefeller and Weinberg among them: a deficit of $29 to $30 billion, a quarter to be met by the tax, a quarter by cuts, half by borrowing. Kappel: "you can''t do anything else." All for it by a show of hands; a committee to follow.'
    n: '[[w.gibbons-u-s-government-and]], IV, 757–58. To check: Christian''s notes of the meeting, dated Aug. 15, 1967, Meetings Notes File, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 757 n.131). See [[cal.1967-08-03.economy]]. Names: Johnson, Dillon, Henry Ford II, Gates, Kappel, David Rockefeller.'
    src:
      c: a1b87035
