  - id: cal.1967-08-22.china-leadership
    when: Aug. 22
    date: '1967-08-22'
    place: peking
    thread: china-leadership
    c: 'Zhou Enlai tells Guangzhou''s two delegations in Peking: do not say again "the handful in the army"; it was an error of the propaganda organs after the July 20 incident, and Mao criticized it.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 22, 1967; Zhou before dawn receives Canton''s two delegations in Peking: seizing the army''s arms and its aid-to-Vietnam supplies shows no sense of the enemy, "simply ignorant"; do not do what pains friends and pleases foes; do not go on with "the handful in the army", wrongly put out by the propaganda organs after the July 20 incident, which Mao criticized; to demand army power is wrong; the two sides agree on the spot to stop seizures, return the army''s arms, stop all armed fighting and the hitting, smashing, looting, searching and seizing). Made public: 2013. Names: Zhou Enlai, Mao Zedong.'
    tags: [name:zhou-enlai, name:mao-zedong, polity:prc, vis:only:prc]
  - id: cal.1967-08-22.china-leadership-2
    when: Aug. 22
    date: '1967-08-22'
    place: peking
    thread: china-leadership
    c: Night. Foreign-affairs rebels and some Red Guard bodies in Peking storm and burn the British chargé's office.
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 177 (Aug. 23, 1967; Zhou, before dawn after the burning of the British chargés office on the night of the 22nd by Peking Red Guards and rebels, receives the foreign-affairs rebels and sharply criticizes the burning and the seizure of the Foreign Ministry: "you have no regard for the Center, anarchism"; the telegrams to foreign countries in the name of the supervision group are wholly unlawful and void; foreign affairs power is Mao''s and the Party Center''s, given to the State Council; "between the Cultural Revolution Group and me you have no gap to drive into"; after the July 20 incident the tide is abnormal and the whole estimate wrong, "the country on the eve of counter-revolutionary restoration" and "taking power by arms" are not so; he talks the same day in turn with the Ministry''s station, the Foreign Languages Institute and the Foreign Affairs Office and Foreign Ministry heads); [[w.macfarquhar-maos-last-revolution]], 225–226 (Hopson''s account: the ultimatum expires; a crowd at nightfall, 10,000 by the official Chinese report; the attack at 10:30 p.m.; the staff out by the emergency exit about 11:10 p.m. and beaten; the office a total loss); [[w.macfarquhar-maos-last-revolution]], 229 (the spearhead radicals of the Institute of Foreign Languages and other Red Guard bodies); [[w.mao-zedong-zhuan]], VI, ch. 76 (Aug. 22, at night, rebels of the foreign-affairs sector and some Red Guard bodies of Peking storm and burn the British chargé''s office, the gravest foreign-related breach of law since the founding of the People''s Republic, by the book; the book puts it after Wang Li''s incitement of the Foreign Ministry''s rebels to seize its power). [[w.yang-jisheng-tiandi-fanfu]], II, 1097 (the 48 hours past, students and workers break in, wreck and burn the office; staff made to bow before Mao''s portrait; Donald Hopson beaten; the staff flee to the Indian and Finnish embassies; Tsinghua''s "Apr. 14" faction there, Jiang Nanfeng 蔣南峰 its leader); [[w.teiwes-tragedy-of-lin-biao]], 87 (the burning of the British mission on Aug. 22, in a month of turmoil at the Foreign Ministry, the last straw for Mao); [[w.jian-zhou-enlai]], 581 (after the deadline of Aug. 22 passes, the crowds round the British office break in and set it on fire); [[w.friedman-shadow-cold-war]], 153 (the burning, from the dispute over Hong Kong''s workers, shows things have gone too far); [[w.chen-yi-nianpu]], 1195 (Aug. 22, 1967; the rebels'' burning of the British chargé d''affaires'' office). To check: the day''s Xinhua and British accounts; Hopson to Brown, "The Burning of the British Office in Peking," Sept. 8, 1967, FCO 21/34, PRO (cited by [[w.macfarquhar-maos-last-revolution]], 226 n.19a); [[w.cradock-experiences-of-china]], 58–71 (cited by [[w.macfarquhar-maos-last-revolution]], 226 n.19b); [[w.barnouin-chinese-foreign-policy-during]], 26–27 (cited by [[w.macfarquhar-maos-last-revolution]], 229 n.33a); Tyler, *New York Times*, Apr. 10, 1996 (cited by [[w.macfarquhar-maos-last-revolution]], 229 n.33b); Yang Rongjia 楊榮甲, *Gongheguo waijiaobu mixin* 《共和國外交部秘辛》 (Dashan wenhua chubanshe, Hong Kong, 2011), 146 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 1097 n.19); [[w.nianyi-da-dongluande-niandai]], 266–268, 271 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65a); Xi Chen, "A great struggle to defend Party principles: revealing the true nature of a major political incident, the ''February countercurrent''," *Renmin ribao*, Feb. 26, 1979, translated in FBIS, Feb. 28, 1979, E16 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65b); [[w.lee-politics-of-the-chinese]], 252–254 (cited by [[w.teiwes-tragedy-of-lin-biao]], 87 n.65c); Mr. Hopson to Mr. Brown, "The Burning of the British Office in Peking," confidential, Sept. 8, 1967, FC1/14, FCO 21/34, UKNA (cited by [[w.jian-zhou-enlai]], 581 n.64).'
