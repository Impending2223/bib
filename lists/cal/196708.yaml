    c: 'Mao three times reads and revises the article by Yao Wenyuan and his Shanghai writing group, "The Ugly Soul of a Revisionist: On the Reactionary Essence of *Ideals, Sentiments, Spiritual Life* and *Thought, Feeling, Style*" (Tao Zhu''s two books of 1962 and 1964); "very good; publish in Peking"; "three articles against Liu in two or three months." He retitles it "On Two Books of Tao Zhu." Where it speaks of the "Peking May 16 Red Guard Regiment," he adds that it dares not show itself, hiding underground in Peking for months, and sticks leaflets by night; the masses will find out who it is. He cuts the paragraph that "working-people intellectuals" is nonsense.'
