    c: 'Tuesday lunch, 1:25 to 2:50 p.m., Johnson with McNamara, Katzenbach for Rusk, Rostow, Christian, Califano. The Chiefs ask the Hanoi power plant again, the Doumer bridge, ten targets in the Chinese buffer zone. Johnson: "it doesn''t look as though we have escalated enough to win"; all but lifting the zones around Hanoi and Haiphong approved, the bridge if Katzenbach agrees. "We have got to do something to win." On Kissinger''s report of Marcovich and Aubrac''s talks in Hanoi, McNamara: "the most interesting message on the matter of negotiations which we have ever had"; Johnson: no slowing of the bombing until the facts are clearer.'
    n: '[[w.gibbons-u-s-government-and]], IV, 741–42, 778; [[w.mcnamara-in-retrospect]], ch. 10 at n.26 (McNamara: Kissinger''s cable "the most interesting message on the matter of negotiations"). [[w.barrett-uncertain-warriors]], 105 (Rostow and McNamara at the Tuesday lunch on the bombing''s effect on infiltration, Rostow up to 50 percent impeded, McNamara 1 percent, by Tom Johnson''s notes); [[w.dallek-flawed-giant]], 477, 480 (Aug. 8: "It doesn''t look as though we have escalated enough to win"; "We have got to do something to win"; McNamara on the news of the Frenchmen''s visit to Hanoi, "the most interesting message on the matter of negotiations which we have ever had"; Johnson sees no need to slow the bombing until the facts are clearer; not the hours, attendees, targets or Kissinger). Check: [[w.dallek-flawed-giant]], 477, has Rusk at the meeting, questioning the escalation with McNamara. To check: Tom Johnson''s notes of the lunch, Aug. 8, 1967, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 741 n.85, 778 n.48); Tom Johnson''s notes, Aug. 8, 1967, box 3, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 105 n.171a). See [[cal.1967-07-21.vietnam]]. Names: Johnson, McNamara, Katzenbach, Rusk, Rostow, Christian, Califano, Kissinger, Marcovich, Aubrac.'
