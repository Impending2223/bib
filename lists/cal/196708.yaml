  - id: cal.1967-08-25.china-leadership
    when: Aug. 25
    date: '1967-08-25'
    thread: china-leadership
    c: 'Mao reads the Center, State Council, Military Commission and Group''s "Call to Hold Up the Army and Cherish the People": "very good, issue." A mass movement of supporting the army and cherishing the people; new compacts; trust and rely on the masses, the army and most cadres; the army firmly backs the revolutionary left and the Red Guards; the people help the "three supports, two armies" work; open mass self-criticism on both sides.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1967. Made public: 2013. Names: Mao Zedong.'
