    c: 'McNamara to Wheeler: the forces of JCSM 416-67 approved for planning, within a ceiling of 525,000 men in South Vietnam. Program 4, 484,472; added in fiscal 1968, 47,296; civilianization, 6,768 less. Five more destroyers for gunfire support; a battleship under study.'
