    c: 'McNamara to the Stennis subcommittee: the enemy''s operations in the South cannot be stopped by bombing, "short, that is, of the virtual annihilation of North Vietnam and its people"; of the targets the Chiefs had proposed, 57 not yet authorized, and of little consequence (Check the words and the figure).'
    n: 'Daily Digest, [113 Cong. Rec. D445](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=443). *Air War Against North Vietnam* hearings, pt. 4 (Check the part and pages). [[w.gibbons-u-s-government-and]], IV, 750–51 (the testimony, *Air War Against North Vietnam*, pt. 4, 273–373; not the 57 targets); [[w.herring-lbj-and-vietnam]], 56 (all day before the subcommittee; no bombing could stop the flow south; "You cannot win the war on the cheap by bombing"); [[w.mcnamara-in-retrospect]], ch. 10 at nn.13–18 (the objectives of the bombing; the limits of the air war; Cannon''s questions). [[w.mann-grand-delusion]], 555–56 (Thurmond: "a statement of no-win"); [[w.berman-lyndon-johnsons-war]], 72 (only a handful of the Chiefs'' fixed targets not authorized; the bombing no substitute for success in the South; it could not break the North''s will; Thurmond: McNamara placating the Communists); [[w.bernstein-guns-or-butter]], 357 (seven hours, in public); [[w.staaveren-u-s-air-force]], 247 (McNamara: of the ten to twenty percent of those sent south who failed to arrive, some two percent victims of air attacks); [[w.zaroulis-who-spoke-up]], 144 (August, the Senate Preparedness Investigations Subcommittee, closed; "no reason to believe that North Vietnam can be bombed to the negotiating table"; the day not given); [[w.clifford-counsel-to-the-president-2]], 456 (McNamara''s grilling before the Senate Armed Services Committee in August, unable to make a strong case for continued bombing; not the day, the words or the figures); [[w.schlesinger-robert-kennedy-and-his]], 823 ("In August," without clearing his testimony with the White House, McNamara tells "the Senate Military Affairs Committee" (the entry: the Stennis subcommittee) that it was militarily pointless to keep on bombing the North; Johnson angry, by Maj. Gen. Robert Ginsburgh: "He decided to back the Joint Chiefs and ease McNamara out"; no day or figure); [[w.dallek-flawed-giant]], 478 (McNamara tells the subcommittee Aug. 25 that bombing by itself would not bring Hanoi to the peace table; the Chiefs enraged; not the words of A or the 57 targets). To check: John M. Shaw, "The August 1967 Stennis Subcommittee Hearings on the Air War over North Vietnam," unpublished paper; Rostow to Johnson, Aug. 9, 1967, NSF Memos to the President, Rostow, LBJ Library (cited by [[w.herring-lbj-and-vietnam]], 56 n.119). See [[cal.1967-08-09.vietnam]]. Names: McNamara, Stennis.'
