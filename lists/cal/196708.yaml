    c: 'Mao revises the draft Center "Some Decisions on the Hunan Question," and Aug. 7 agrees the revision. In the passage that the Group''s "Feb. 4 instruction" on the Hunan Military District''s report of "Xiangjiang Storm" "had a fault," he writes "was in error," and adds: from this learn; why send the Feb. 4 instruction in haste on one side''s word, unknown? So the Center is chiefly responsible. Four articles: the Hunan Military District''s self-criticism good; the district to be reorganized and a Hunan preparatory group started; the bodies to unite under it. Noon, the Hongqiao guesthouse, Shanghai, with Yang Chengwu, Zhang Chunqiao and Wang Dongxing, hearing Yu Lijin on Wuhan: the Feb. 4 instruction was wrong; the Center chiefly to blame, else the region would not submit; it put the region in the front line; "Xiangjiang Storm" was dissolved by the Group and the liaison meeting, unknown to him and to Lin Biao, but he takes the blame.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 4, 1967. Made public: 2013. Names: Mao Zedong, Yang Chengwu, Zhang Chunqiao, Wang Dongxing, Yu Lijin, Lin Biao.'
    tags: [name:mao-zedong, polity:prc, vis:only:prc, name:zhang-chunqiao, name:lin-biao]
