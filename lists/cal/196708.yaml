  - id: cal.1967-08-02.vietnam
    when: Aug. 2
    date: '1967-08-02'
    thread: vietnam-support
    c: 'Westmoreland to Wheeler, Harold K. Johnson and Sharp, on public support: "we must make haste carefully in order to avoid charges that the military establishment is conducting an organized propaganda campaign"; the impression of stalemate false, "Every indicator belies either stalemate or loss of initiative"; "While we work on the nerve ends here we hope that careful attention will be paid to the roots there."'
