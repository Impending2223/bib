  - id: cal.1967-08-01.vietnam-pennsylvania
    when: Aug. 1
    date: '1967-08-01'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Kissinger''s report on Marcovich''s and Aubrac''s talks in Hanoi.'
    n: 'FRUS 1964–68, V, doc. [263](https://history.state.gov/historicaldocuments/frus1964-68v05/d263) (editorial note). See [[cal.1967-07-21.vietnam]]. Names: Kissinger, Marcovich, Aubrac.'
    tags: [name:kissinger-henry-a, name:marcovich-hebert, name:aubrac-raymond]
  - id: cal.1967-08-02.opinion
    when: Aug. 2
    date: '1967-08-02'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, July 13–18: Johnson 51 percent, Reagan 39, undecided 10. Democrats: Johnson 76, Reagan 14. Independents: 44 and 44.'
    n: '[[w.gallup-poll]], III, 2074. Names: Johnson, Reagan. Check: the book prints Republicans Johnson 74, Reagan 19, undecided 7.'
    tags: [name:johnson-lyndon-b, name:reagan-ronald]
  - id: cal.1967-08-03.economy
    when: Aug. 3
    date: '1967-08-03'
    thread: economy-surcharge
    also: [vietnam]
    c: 'Special message on the budget and the economy. Fiscal 1968: spending up to $8.5 billion over January''s $135 billion, revenues $7 billion under; without a tax increase and control of spending the deficit "could exceed $28 billion." A surcharge of 10 percent on income taxes, corporate from July 1, 1967, individual from Oct. 1, to June 30, 1969, or as long as the war''s costs require; $6.3 billion in fiscal 1968. January''s proposal had been 6 percent. Corporate payments speeded; the excises on automobiles and telephones held. At least 45,000 more men to Vietnam this fiscal year. A news conference on the message the same day.'
    n: 'Special Message to the Congress: The State of the Budget and the Economy, [1967 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=125) (Aug. 3, 1967); The President''s News Conference on the Tax Message, [1967 Pub. Papers 740](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=132) (Aug. 3, 1967). [Johnson and Fowler, 9:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-july-26-1967), July 26, Conversation WH6707-01-12006 (Miller Center). See [[cal.1967-01-10.economy]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, name:fowler-henry-h]
  - id: cal.1967-08-03.vietnam-pennsylvania
    when: Aug. 3
    date: '1967-08-03'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. State''s negotiations committee in Harriman''s office: of "considerable potential significance"; Kissinger and Cooper to see the Frenchmen in Paris.'
    n: 'FRUS 1964–68, V, doc. [267](https://history.state.gov/historicaldocuments/frus1964-68v05/d267). See [[cal.1967-07-21.vietnam]]. Names: Harriman, Kissinger, Cooper.'
    tags: [name:harriman-w-averell, name:kissinger-henry-a, name:cooper-chester-l]
  - id: cal.1967-08-03.civil-disorders-detroit
    when: Aug. 3
    date: '1967-08-03'
    thread: civil-disorders-detroit
    c: 'Detroit. Vance and Throckmorton report to Johnson.'
    n: 'Remarks to the Press After a Meeting With Cyrus Vance and General Throckmorton on the Situation in Detroit, [1967 Pub. Papers 746](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=138) (Aug. 3, 1967). See [[cal.1967-07-23.civil-disorders]]. Names: Vance, Throckmorton, Johnson.'
    tags: [name:vance-cyrus, name:throckmorton-john-l, name:johnson-lyndon-b, state:mi, city:detroit]
  - id: cal.1967-08-05.vietnam
    when: Aug. 5
    date: '1967-08-05'
    thread: vietnam
    c: 'Clifford and Taylor report to Johnson, Ball, Rusk and Nitze present: the allies agree on the conduct of the war; none will promise troops at once; South Vietnam to add 65,000 men and draft at 18.'
    n: 'FRUS 1964–68, V, doc. [270](https://history.state.gov/historicaldocuments/frus1964-68v05/d270); XXVII, doc. [27](https://history.state.gov/historicaldocuments/frus1964-68v27/d27). Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-14.vietnam]]. Names: Clifford, Taylor, Johnson, Ball, Rusk, Nitze.'
    tags: [name:clifford-clark, name:taylor-maxwell, name:johnson-lyndon-b, name:ball-george-w, name:rusk-dean, name:nitze-paul]
  - id: cal.1967-08-05.congo
    when: Aug. 5
    date: '1967-08-05'
    thread: congo
    c: 'Mobutu''s radio attacks the United States; McBride protests.'
    n: 'FRUS 1964–68, XXIII, doc. [531](https://history.state.gov/historicaldocuments/frus1964-68v23/d531). See [[cal.1967-07-05.congo]]. Names: Mobutu, McBride.'
    tags: [name:mobutu-joseph-d, name:mcbride-robert-h]
  - id: cal.1967-08-06.opinion
    when: Aug. 6
    date: '1967-08-06'
    thread: opinion
    c: 'Gallup, July 13–18: that the United States try to make the United Nations a success, very important 79 percent, fairly important 10, not so important 6. The United States to give up its membership: should 10, should not 85.'
    n: '[[w.gallup-poll]], III, 2074–75.'
  - id: cal.1967-08-08.crime-and-hijacking
    when: Aug. 8
    date: '1967-08-08'
    thread: crime-and-hijacking
    c: 'The House passes H.R. 5037, the Law Enforcement and Criminal Justice Assistance Act, [378–23](https://voteview.com/rollcall/RH0900107), after adopting Cahill''s amendment, [256–147](https://voteview.com/rollcall/RH0900106): the grants to go in blocks to the States, to be passed on to local agencies, not from the Attorney General to the cities.'
    n: '[[w.harris-fear-of-crime]]; [[w.flamm-law-and-order]]. Names: Cahill.'
    tags: [name:cahill-william-t]
  - id: cal.1967-08-08.mississippi-ms
    when: Aug. 8
    date: '1967-08-08'
    thread: mississippi
    also: [governors, elections-1967]
    c: Mississippi's Democratic primary for governor, the first since the Voting Rights Act. William Winter, the State treasurer, 222,001, 32.5 percent; U.S. Representative John Bell Williams, stripped of his seniority by the House Democrats in 1965 for backing Goldwater, 197,778, 28.9; Swan 124,361, 18.2; Barnett, governor 1960–64, 76,053, 11.1; Waller, the Hinds County district attorney, 60,090, 8.8; two others. Runoff between Winter and Williams.
    n: 'Votes: [Wikipedia, "1967 Mississippi gubernatorial election"](https://en.wikipedia.org/wiki/1967_Mississippi_gubernatorial_election), from Our Campaigns; Check: Miss. Secretary of State, Election Returns (MDAH Series 0107). [[w.crespino-in-search-of-another]]; [[w.bass-transformation-of-southern-politics-1976]]; [[w.peirce-deep-south-states-of]]; [[w.black-rise-of-southern-republicans]]. See [[cal.1963-11-05.mississippi-ms]]. Names: Winter, Williams, Swan, Barnett, Waller, Goldwater.'
    tags: [state:ms, name:winter-william-f, name:williams-john-b, name:swan-jimmy, name:barnett-ross-r, name:waller-william-l, name:goldwater-barry-m]
  - id: cal.1967-08-09.states-and-cities
    when: Aug. 9
    date: '1967-08-09'
    thread: states-and-cities
    also: [cities-and-housing]
    c: 'The District of Columbia. The House refuses to disapprove Reorganization Plan No. 3 of 1967, [160–244](https://voteview.com/rollcall/RH0900108): the three commissioners give way to a Commissioner, an Assistant Commissioner and a Council of nine, all appointed by the President.'
    n: 'Letter to the Speaker of the House Urging Support of the Reorganization Plan for the District of Columbia, [1967 Pub. Papers 754](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=146) (Aug. 8, 1967); Statement by the President Following Action in the House of Representatives on the Reorganization Plan for the District of Columbia, [1967 Pub. Papers 757](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=149) (Aug. 9, 1967). [[w.gillette-between-justice-and-beauty]]; [[w.jaffe-dream-city]]. See [[cal.1966-02-21.states-and-cities-dc]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-08-09.vietnam
    when: Aug. 9
    date: '1967-08-09'
    thread: vietnam-air-war
    also: [defense, congress]
    c: 'The Preparedness Investigating Subcommittee of Senate Armed Services, Stennis chairman, opens its hearings on the air war against the North, to Aug. 29. Sharp first, then Wheeler, the service chiefs and the air commanders: fewer limits on targets.'
    n: '*Air War Against North Vietnam: Hearings Before the Preparedness Investigating Subcommittee of the Senate Committee on Armed Services*, 90th Cong., 1st Sess., pts. 1–5 (1967) (Check). [[w.pentagon-papers]], IV; [[w.clodfelter-limits-of-air-power]]; [[w.thompson-to-hanoi-and-back]]; [[w.sharp-strategy-for-defeat]]; [[w.mcnamara-in-retrospect]]; [[w.shapley-promise-and-power]]; [[w.drea-mcnamara-clifford-and-the-2011]]; [[w.gibbons-u-s-government-and]], IV. See [[cal.1967-04-18.vietnam]]. Names: Stennis, Sharp, Wheeler.'
    tags: [name:stennis-john-c, name:sharp-u-s-grant, name:wheeler-earle]
  - id: cal.1967-08-09.opinion
    when: Aug. 9
    date: '1967-08-09'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, July 13–18: the Republicans'' chance of winning the presidency in 1968: good 53 percent, not very good 31. Republicans 71 good; Democrats 38 good, 44 not very good; independents 59 good. The reasons for good, in order of mention: dissatisfaction with Johnson and his Administration; with his handling of Vietnam; "time for a change."'
    n: '[[w.gallup-poll]], III, 2075. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-08-11.civil-disorders
    when: Aug. 11
    date: '1967-08-11'
    thread: civil-disorders
    also: [crime-and-hijacking]
    c: The Senate, [59–0](https://voteview.com/rollcall/RS0900153), gives its Government Operations Committee authority to study riots, crime and lawlessness; its Permanent Subcommittee on Investigations, McClellan chairman, to do it (Check). An amendment to add the economic and social causes of the disorders refused, [26–36](https://voteview.com/rollcall/RS0900152).
    n: '[[w.flamm-law-and-order]]. See [[cal.1967-07-27.civil-disorders]]. Names: McClellan.'
    tags: [name:mcclellan-john-l]
  - id: cal.1967-08-11.vietnam
    when: Aug. 11–12
    date: '1967-08-11'
    thread: vietnam-air-war
    c: 'Hanoi''s Long Biên bridge bombed, among new targets near Hanoi and Haiphong and in the buffer zone along the Chinese border.'
    n: 'FRUS 1964–68, V, doc. [298](https://history.state.gov/historicaldocuments/frus1964-68v05/d298) (Helms, Aug. 29). Made public: FRUS 1964–68, V (2002). [[w.clodfelter-limits-of-air-power]]; [[w.thompson-to-hanoi-and-back]]; [[w.herring-lbj-and-vietnam]]; [[w.gardner-pay-any-price]]. See [[cal.1967-08-09.vietnam]]; [[cal.1967-04-18.vietnam]].'
    tags: [name:helms-richard, place:long-bien-bridge, place:hanoi]
  - id: cal.1967-08-11.states-and-cities
    when: Aug. 11
    date: '1967-08-11'
    thread: states-and-cities
    c: 'The District of Columbia. Johnson asks the District''s organizations and citizens for names for the new Council by Aug. 21.'
    n: 'Statement by the President on the New Government of the District of Columbia, [1967 Pub. Papers 758](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=150) (Aug. 11, 1967). See [[cal.1967-08-09.states-and-cities]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-08-14.press-and-broadcasting
    when: Aug. 14
    date: '1967-08-14'
    thread: press-and-broadcasting
    also: [space]
    c: Special message on communications policy. A single global system of commercial satellites, open to all nations; INTELSAT continued after its interim agreement ends in 1969, with a ceiling on any one nation's vote; help to poor nations for ground stations; a domestic satellite system only if compatible with the global one. A task force of officials, Eugene Rostow chairman, to study the whole of communications policy and report within a year (Check the chairman).
    n: 'Special Message to the Congress on Communications Policy, [1967 Pub. Papers 763](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=155) (Aug. 14, 1967). [[w.galloway-politics-and-technology-of]]. Names: Rostow.'
    tags: [name:johnson-lyndon-b, name:rostow-eugene]
  - id: cal.1967-08-14.vietnam-program-5
    when: Aug. 14
    date: '1967-08-14'
    thread: vietnam-program-5
    also: [defense]
    c: 'McNamara''s formal approval of Program 5: 47,296 men more, to an authorized strength of 525,000.'
    n: 'Made public: [[w.pentagon-papers]], IV (1971) (Check the page). See [[cal.1967-07-07.vietnam]]. Names: McNamara.'
    tags: [name:mcnamara-robert-s]
  - id: cal.1967-08-15.foreign-aid
    when: Aug. 15
    date: '1967-08-15'
    thread: foreign-aid
    c: 'Senate, the foreign aid authorization: Jackson''s amendment restoring the authorities for credit sales of arms refused, [43–50](https://voteview.com/rollcall/RS0900154).'
    n: 'Check: the Record''s page. [[w.ruttan-united-states-development-assistance]]. See [[cal.1966-09-19.foreign-aid]]. Names: Jackson.'
    tags: [name:jackson-henry-m]
  - id: cal.1967-08-15.europe-and-the-alliance
    when: Aug. 15–16
    date: '1967-08-15'
    thread: europe-and-the-alliance
    c: 'Kiesinger, with Brandt, at the White House. Aug. 16, Johnson to Kiesinger, on a reported cut in the Bundeswehr: let him tell the press no decision has been made, and none will be without his cabinet, the United States and NATO. The joint statement: NATO to be strengthened; a relaxation of tensions the way to end the division of Europe and of Germany; no one-sided weakening of the West; a plan for new monetary reserves at the IMF''s meeting in Rio de Janeiro in September.'
    n: 'Joint Statement Following Discussions With Chancellor Kiesinger of Germany, [1967 Pub. Papers 778](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=170) (Aug. 16, 1967). FRUS 1964–68, XV, docs. [222](https://history.state.gov/historicaldocuments/frus1964-68v15/d222), [225](https://history.state.gov/historicaldocuments/frus1964-68v15/d225), [228](https://history.state.gov/historicaldocuments/frus1964-68v15/d228). Made public: FRUS 1964–68, XV (1999). [[w.schwartz-lyndon-johnson-and-europe]]. See [[cal.1966-12-01.europe-and-the-alliance]]. Names: Kiesinger, Brandt, Johnson.'
    tags: [name:kiesinger-kurt-georg, name:brandt-willy, name:johnson-lyndon-b]
  - id: cal.1967-08-15.middle-east
    when: Aug. 15
    date: '1967-08-15'
    thread: middle-east
    c: 'Rusk and McNamara to Johnson: the freeze on arms shipments to the Near East since the war, broken only by $3 million of cash sales in early August, to be relaxed for Israel and the moderate Arab states, Congress''s reaction to be sounded first. Johnson checks neither approve nor disapprove.'
    n: 'FRUS 1964–68, XIX, doc. [419](https://history.state.gov/historicaldocuments/frus1964-68v19/d419). Made public: FRUS 1964–68, XIX (2004). [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.quandt-peace-process]]. Names: Rusk, McNamara, Johnson.'
    tags: [name:rusk-dean, name:mcnamara-robert-s, name:johnson-lyndon-b]
  - id: cal.1967-08-16.open-housing
    when: Aug. 16
    date: '1967-08-16'
    thread: open-housing
    c: 'The House passes H.R. 2516, [327–93](https://voteview.com/rollcall/RH0900113): federal penalties for interfering, by force and for reasons of race, with persons voting, at school, in jobs, on juries, in public accommodations and in other protected activities. The rule had passed the day before, [330–77](https://voteview.com/rollcall/RH0900112).'
    n: See [[cal.1967-02-15.open-housing]].
  - id: cal.1967-08-16.king
    when: Aug. 16
    date: '1967-08-16'
    thread: king
    also: [civil-rights-organizations, poverty]
    c: 'Atlanta, SCLC''s tenth annual convention. King''s address, "Where Do We Go From Here?": a program to "drive the nation to a guaranteed annual income"; "power without love is reckless and abusive, and love without power is sentimental and anemic"; the movement "must address itself to the question of restructuring the whole of American society."'
    n: '[Where Do We Go From Here?](https://kinginstitute.stanford.edu/where-do-we-go-here) (Aug. 16, 1967) (King Institute, Stanford). [[w.garrow-bearing-the-cross]]; [[w.fairclough-to-redeem-the-soul]]; [[w.branch-at-canaans-edge]]. Names: Martin Luther King.'
    tags: [name:king-martin-luther-jr]
  - id: cal.1967-08-16.cities-and-housing
    when: Aug. 16
    date: '1967-08-16'
    thread: cities-and-housing
    also: [poverty]
    c: 'Johnson to Mansfield: the programs for the cities before Congress. Model cities: $662 million asked for fiscal 1968, the House''s $237 million to be restored in full.'
    n: 'Letter to the Senate Majority Leader Urging Enactment and Funding of Programs for the Cities, [1967 Pub. Papers 782](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=174) (Aug. 16, 1967). [[w.haar-between-the-idea-and]]. See [[cal.1966-01-26.cities-and-housing]]. Names: Mansfield, Johnson.'
    tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - id: cal.1967-08-16.vietnam
    when: Aug. 16
    date: '1967-08-16'
    thread: vietnam-elections
    c: 'South Vietnam''s presidential election, set for Sept. 3. Johnson''s letter to Nguyễn Văn Thiệu and Nguyễn Cao Kỳ: "fairness and equity to all the candidates"; no wish to "interfere with or dictate the choice." Observers to be invited from labor, business, the press and other bodies. Bunker had asked for covert money for the Thiệu–Kỳ ticket and for Trần Văn Hương''s; Washington refuses money, approves covert advice and support.'
    n: 'FRUS 1964–68, V, docs. [281](https://history.state.gov/historicaldocuments/frus1964-68v05/d281) (editorial note), [284](https://history.state.gov/historicaldocuments/frus1964-68v05/d284). Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-17.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Bunker, Trần Văn Hương.'
    tags: [name:johnson-lyndon-b, name:nguyen-van-thieu, name:nguyen-cao-ky, name:bunker-ellsworth, name:tran-van-huong, name:helms-richard]
  - id: cal.1967-08-16.vietnam-air-war
    when: Aug. 16
    date: '1967-08-16'
    thread: vietnam-air-war
    c: 'Johnson: "destroy all we can without involving China and Russia" before Sept. 1; not Haiphong''s harbor, not Hanoi''s civilians, care in the buffer zone. Rusk: "what do you ask a man to die for."'
    n: 'FRUS 1964–68, V, doc. [283](https://history.state.gov/historicaldocuments/frus1964-68v05/d283). Made public: FRUS 1964–68, V (2002). See [[cal.1967-08-11.vietnam]]. Names: Johnson, Rusk.'
    tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle]
  - id: cal.1967-08-16.opinion
    when: Aug. 16
    date: '1967-08-16'
    thread: opinion
    also: [open-housing, civil-disorders]
    c: 'Gallup, Aug. 3–8: would move if colored people came to live next door: yes, definitely 12 percent; might 23; no 65. If they came in great numbers: definitely 40, might 31, no 29. Attitudes toward Negroes changed in the last several months, 32 percent, nearly all with less regard or respect.'
    n: '[[w.gallup-poll]], III, 2076.'
  - id: cal.1967-08-17.welfare
    when: Aug. 17
    date: '1967-08-17'
    thread: welfare
    c: 'The House passes the Social Security Amendments, H.R. 12080, [415–3](https://voteview.com/rollcall/RH0900114): benefits up 12½ percent; a ceiling on the federal share of aid to dependent children whose fathers are absent; adults on the rolls to be referred to work or training (Check the terms).'
    n: '[[w.derthick-policymaking-for-social-security]]; [[w.berkowitz-mr-social-security]]; [[w.zelizer-taxing-america]].'
  - id: cal.1967-08-17.foreign-aid
    when: Aug. 17
    date: '1967-08-17'
    thread: foreign-aid
    c: 'The Senate passes the foreign aid authorization, S. 1872, [60–26](https://voteview.com/rollcall/RS0900168). Refused: a joint committee to reassess foreign policy and aid, [23–65](https://voteview.com/rollcall/RS0900165). The Development Loan Fund cut $100 million, [48–43](https://voteview.com/rollcall/RS0900162) (Check the days).'
    n: 'Check: the Record''s page. See [[cal.1967-08-15.foreign-aid]].'
  - id: cal.1967-08-17.vietnam
    when: Aug. 17–18
    date: '1967-08-17'
    thread: vietnam-pennsylvania
    c: 'Pennsylvania. Paris: Kissinger gives Marcovich and Aubrac the American message for Phạm Văn Đồng, dictated, McNamara says, by himself: the United States willing to stop the bombing of the North "if this will lead promptly to productive discussions," assuming the North "would not take advantage of the bombing cessation or limitation." For "if" they ask "with the understanding that"; State agrees.'
    n: 'FRUS 1964–68, V, docs. [277](https://history.state.gov/historicaldocuments/frus1964-68v05/d277), [286](https://history.state.gov/historicaldocuments/frus1964-68v05/d286) (editorial note). Made public: [[w.herring-secret-diplomacy-of-the]], 726–733 (1983); FRUS 1964–68, V (2002). See [[cal.1967-07-21.vietnam]]. Names: Kissinger, Marcovich, Aubrac, Phạm Văn Đồng, McNamara.'
    tags: [name:kissinger-henry-a, name:marcovich-hebert, name:aubrac-raymond, name:pham-van-dong, name:mcnamara-robert-s, name:cooper-chester-l]
  - id: cal.1967-08-17.cities-and-housing
    when: Aug. 17
    date: '1967-08-17'
    thread: cities-and-housing
    c: 'Johnson to Weaver: a pilot program of public housing built and managed by private firms, on the President''s Committee on Urban Housing''s report.'
    n: 'Memorandum to Secretary Weaver on the Need for a Pilot Program To Stimulate Private Enterprise in Low-Income Housing, [1967 Pub. Papers 784](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=176) (Aug. 17, 1967). See [[cal.1967-08-16.cities-and-housing]]. Names: Weaver, Johnson.'
    tags: [name:weaver-robert-c, name:johnson-lyndon-b]
  - id: cal.1967-08-17.vietnam-commitments
    when: Aug. 17
    date: '1967-08-17'
    thread: vietnam-commitments
    also: [congress, elections-1968]
    c: 'Foreign Relations'' hearings on S. Res. 151, from Aug. 16. Katzenbach: the Tonkin Gulf resolution and the SEATO treaty authority enough; a declaration of war "outmoded" (Check the words). McCarthy, leaving the hearing: "There is no limit to what he says the President could do" (Check the words).'
    n: '*U.S. Commitments to Foreign Powers: Hearings Before the Senate Committee on Foreign Relations on S. Res. 151*, 90th Cong., 1st Sess. (1967) (Check the pages). [[w.katzenbach-some-of-it-was]]; [[w.sandbrook-eugene-mccarthy]]; [[w.mccarthy-year-of-the-people]]. See [[cal.1967-07-31.vietnam]]. Names: Katzenbach, McCarthy.'
    tags: [name:katzenbach-nicholas, name:mccarthy-eugene-j]
  - id: cal.1967-08-17.amendments
    when: Aug. 17
    date: '1967-08-17'
    thread: amendments
    also: [court, congress]
    c: 'Ervin introduces S. 2307, the Federal Constitutional Convention Act: procedures for a convention called on the applications of two-thirds of the legislatures under Article V. "With the sudden realization that 32 State legislatures already have called for a new Federal constitutional convention," talk of "a runaway convention." The bill''s answers: how long an application stands, whether it may be rescinded, the convention''s apportionment and its voting, ratification.'
    n: '[113 Cong. Rec. 23004–06](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt17/pdf/GPO-CRECB-1967-pt17-6-1.pdf#page=56) (1967). [[w.bonfield-dirksen-amendment-and-the]]; [[w.campbell-senator-sam-ervin-last]]; [[w.kyvig-explicit-and-authentic-acts]]. See [[cal.1966-12.court-us]]. Names: Ervin.'
    tags: [name:ervin-sam-j-jr]
  - id: cal.1967-08-18.vietnam-commitments
    when: Aug. 18
    date: '1967-08-18'
    thread: vietnam-commitments
    c: 'News conference, on the Tonkin Gulf resolution: "we did not think the resolution was necessary to do what we did and what we are doing. But we thought it was desirable"; Congress may withdraw it by a resolution of its own.'
    n: 'The President''s News Conference, [1967 Pub. Papers 788](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=180) (Aug. 18, 1967), item 10. See [[cal.1967-07-31.vietnam]]. Names: Johnson.'
    tags: [name:johnson-lyndon-b]
  - id: cal.1967-08-18.vietnam-air-war
    when: Aug. 18
    date: '1967-08-18'
    thread: vietnam-air-war
    c: 'The Hanoi thermal power plant approved as a target; a depot at the city''s northern edge put off.'
    n: 'FRUS 1964–68, V, doc. [287](https://history.state.gov/historicaldocuments/frus1964-68v05/d287). See [[cal.1967-08-11.vietnam]].'
  - id: cal.1967-08-18.states-and-cities
    when: Aug. 18
    date: '1967-08-18'
    thread: states-and-cities
    c: 'The District of Columbia. Johnson asks McKeldin, former mayor of Baltimore, to be Commissioner.'
    n: '[Johnson and McKeldin, 11:02 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-theodore-mckeldin-august-18-1967), Conversation WH6708-01-12101 (Miller Center). See [[cal.1967-08-09.states-and-cities]]. Names: McKeldin, Johnson.'
    tags: [name:mckeldin-theodore-r, name:johnson-lyndon-b, state:dc, city:washington]
  - id: cal.1967-08-19.congo
    when: Aug. 19
    date: '1967-08-19'
    thread: congo
    c: 'An evacuation of the mercenaries through Rwanda nearly agreed; lost by Aug. 25 (Check).'
    n: 'FRUS 1964–68, XXIII, doc. [540](https://history.state.gov/historicaldocuments/frus1964-68v23/d540). See [[cal.1967-07-05.congo]].'
  - id: cal.1967-08-20.opinion
    when: Aug. 20
    date: '1967-08-20'
    thread: opinion
    also: [elections-1968-polls]
    c: 'Gallup, Aug. 3–8: Romney 49 percent, Johnson 41, undecided 10. Johnson 47, Nixon 45, undecided 8; South, Nixon 45, Johnson 43.'
    n: '[[w.gallup-poll]], III, 2076–77. Names: Romney, Johnson, Nixon.'
    tags: [name:romney-george-w, name:johnson-lyndon-b, name:nixon-richard-m]
