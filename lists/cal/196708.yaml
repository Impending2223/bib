  - id: cal.1967-08-01.china-leadership
    when: Aug. 1
    date: '1967-08-01'
    thread: china-leadership
    c: '*Hongqi* prints the editorial "The Proletariat Must Firmly Hold the Gun" for the army''s 40th anniversary, drafted under Guan Feng: it calls to expose the Party''s handful on the capitalist road in the army too and "fight them down and fight them stinking": "the great direction of the struggle."'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 1, 1967. [[w.zhou-enlai-nianpu-1949-2020]], III, 171 (Aug. 1, 1967; the *Hongqi* editorial "The Proletariat Must Firmly Grasp the Gun", drafted under Guan Feng and passed by Chen Boda: to expose, defeat and discredit the small handful of power-holders on the capitalist road in the army, "the main direction of struggle"); [[w.macfarquhar-maos-last-revolution]], 231 (drafted by Lin Jie, revised by Guan Feng, passed by Chen Boda; not sent to Zhou Enlai or Kang Sheng before printing, nor read by Jiang Qing); [[w.mao-zedong-zhuan]], VI, ch. 76 n.62 (Aug. 1 the *Hongqi* editorial for the army''s fortieth anniversary, ''The proletariat must firmly hold the gun'' 《无产阶级必须牢牢掌握枪杆子》: ''not long ago a handful in the Party and the army in the Wuhan area taking the capitalist road joined up to suppress the proletarian revolutionaries''; ''a criticism of the handful in the Party and the army most deeply taking the capitalist road is now rising nationwide, this is the great direction of the struggle'', n.62, the issue given as *Hongqi* 1967, no. 12; the book does not give ''fight them stinking''). [[w.yang-jisheng-tiandi-fanfu]], I, 544 (the *Hongqi* no. 12 article 〈無產階級必須牢牢掌握槍桿子〉: expose and bring down the handful of capitalist-roaders in the army, "the general direction now"; drafted by Lin Jie 林傑 of the editorial board, revised by Guan Feng, signed off by Chen Boda; Mao condemns it: "give me back my Great Wall"); [[w.teiwes-tragedy-of-lin-biao]], 84 (the editorial drafted by Lin Jie, read by Wang Li and Guan Feng, approved by Chen Boda: "Drag out the small handful in the army," the proletariat to "seize control of the gun"). To check: [[w.li-wang-li-fansi-lu]], II, 1015 (cited by [[w.macfarquhar-maos-last-revolution]], 231 n.42a); [[w.zhou-enlai-nianpu-1949]], III, 175 (cited by [[w.macfarquhar-maos-last-revolution]], 231 n.42b); *Dongtai bao*, no. 111, Aug. 26, 1967 (cited by [[w.macfarquhar-maos-last-revolution]], 231 n.42c); *Hongqi* 《红旗》 1967, no. 12 (the editorial ''The proletariat must firmly hold the gun'') (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.62); [[w.nianyi-da-dongluande-niandai]], 267 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 544 n.73). Names: Guan Feng.'
    tags: [polity:prc]
