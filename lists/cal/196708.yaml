  - id: cal.1967-08-16.china-leadership
    when: Aug. 16
    date: '1967-08-16'
    place: shanghai
    thread: china-leadership
    c: 'Shanghai. Mao receives the Albanian experts (Mo Yixiu and Mu Xi in the nianpu), who have come to translate, proof and publish *Quotations from Chairman Mao* in Albanian, Yao Wenyuan present. I do not know the use of the *Quotations*; time will tell. He said long ago to make *Marx*, *Engels*, *Lenin* and *Stalin Quotations*; no one took it up; take it up. The Chinese experience is limited; for other countries to consult. Of cadres: in seventeen years some have ceased to be Marxists, are content and do not advance; some do ill; some are good; teach the first, oust the second; most are good.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 16, 1967. [[w.mao-zedong-zhuan]], VI, ch. 76 n.63 (Aug. 16 Mao''s talk with two Albanian experts, n.63: the movement is meant to last three years, the first to rouse, the second basically to win, the third to clear up; ''Kapo and Balluku came in January and February, I wanted them to stay to April, I said Feb., Mar. and Apr. would show an outline; now with Apr. to July and Aug. it is to be lengthened, three years from last June''; ''some places still to be disorderly for a time, disorder is good; if there were no great disorder the contradictions could not come out''; ''the cadres brought down are few''). [[w.mao-zedong-zhuan]], VI, ch. 77 n.48 (Aug. 1967 (the day by the note, Aug. 16, a record of Mao''s talk with two Albanian experts, Vanjel Moisiu 万捷尔·莫依修 and Miftar Muzhi 缪非特·穆希 in the book''s rendering) on Liu Shaoqi: his case is not simple, not only a matter of right-leaning thought; he was arrested at least four times in the Kuomintang areas; there is now testimony that he gave himself up to the enemy, so his keeping traitors out of prison in the North China Bureau in 1936 was no accident; none of this is among the entry''s units, n.48). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Mao Zedong 毛泽东, talk with two Albanian experts 阿尔巴尼亚专家 (record 谈话记录), Aug. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.63). Names: Mao Zedong, Yao Wenyuan. Check: the experts'' names in Albanian (the nianpu''s 莫依修 and 穆希). Check: the reception as reported at the time (Xinhua; *Renmin ribao*, the next day).'
    tags: [name:mao-zedong, name:yao-wenyuan, polity:prc, polity:albania, vis:only:prc+albania@C-N]
