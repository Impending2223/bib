    thread: china-leadership
    c: 'Xie Fuzhi, to the whole Ministry of Public Security: smash the old political, ideological, theoretical and organizational stuff utterly; break the old machine. After it, courts, procuratorates and police offices are stormed and their files seized over the country.'
