    when: Aug. 20, 28; Sept. 5
    date: '1967-08-20'
    place: shanghai
    thread: china-leadership
    c: 'Mao three times reads and revises the article by Yao Wenyuan and his Shanghai writing group, "The Ugly Soul of a Revisionist: On the Reactionary Essence of *Ideals, Sentiments, Spiritual Life* and *Thought, Feeling, Style*" (Tao Zhu''s two books of 1962 and 1964); "very good; publish in Peking"; "three articles against Liu in two or three months." He retitles it "On Two Books of Tao Zhu." Where it speaks of the "Peking May 16 Red Guard Regiment," he adds that it dares not show itself, hiding underground in Peking for months, and sticks leaflets by night; the masses will find out who it is. He cuts the paragraph that "working-people intellectuals" is nonsense.'
    n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 20, 1967. [[w.jianguo-yilai-mao-zedong]], XIX, 143–146 (Aug. 20, 1967; Mao''s notes of Aug. 20, 8 a.m. Aug. 28 and Sept. 5, his added paragraph of Aug. 28 and his marginal notes on the draft of Sept. 3; he was in Shanghai; the drafts are of Aug. 17, Aug. 26 and Sept. 3; the paragraph cut was cut on Zhang Chunqiao''s advice). Made public: 2013. To check: Yao Wenyuan 姚文元 and his Shanghai writing group, drafts of the article ''The ugly soul of a revisionist: on the reactionary essence of Ideals, Sentiments, Spiritual Life and Thought, Feeling, Style'' (later ''On two books of Tao Zhu''), sent to Mao for review Aug. 17, Aug. 26 and Sept. 3, 1967; printed in the Renmin ribao Sept. 8 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 145 n.1); Zhang Chunqiao, message of Sept. 3, 1967 to Mao Zedong through Yang Chengwu, who was with Mao at Shanghai: Yao''s article''s criticism of the formula ''working-people intellectuals'' touches the dispute of the Premier with Lu Dingyi; perhaps leave it out (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 146 n.6). Names: Mao Zedong, Yao Wenyuan, Tao Zhu, Liu Shaoqi.'
