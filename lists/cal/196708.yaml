    thread: state-and-city-finance
    c: 'At the family dinner table, to Luci Johnson Nugent, who favors a sales tax in Austin, Johnson: "in a sales tax everything you wear or eat is taxed"; "A sales tax really helps the rich people at the expense of the poor people."'
    n: '[[w.johnson-white-house-diary]], 557 (Mrs. Johnson''s account, in the entry of Aug. 16: "Sunday night" of Luci''s and Pat''s visit, Joe Batson at the table; they came back from Nassau with him on Sunday, Aug. 13, and dined with the Johnsons, 554–55). Made public: 1970. Names: Johnson, Lady Bird Johnson. Check: the day: the visit began on Sunday, July 30, 548.'
