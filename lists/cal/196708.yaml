  - id: cal.1967-08-02.economy-surcharge
    when: Aug. 2
    date: '1967-08-02'
    thread: economy-surcharge
    c: 'The tax message''s final draft, worked over with Mills, by Johnson''s account. Mills had objected to a passage that seemed to promise more spending; the final text: "we must move with determination to assure that those for whom these programs were begun are not robbed by the inflation that would accompany an unacceptable deficit."'
    n: '[[w.johnson-vantage-point]], 446–47. See [[cal.1967-08-03.economy]]. Names: Mills, Johnson.'
    src:
      rows:
        - 'w.johnson-vantage-point 446–47: all'
      c: 88b96a63
    tags: [name:mills-wilbur-d, name:johnson-lyndon-b]
  - id: cal.1967-08-03.economy
    when: Aug. 3
    date: '1967-08-03'
    thread: economy-surcharge
    also: [vietnam]
    c: 'Special message on the budget and the economy. Fiscal 1968: spending up to $8.5 billion over January''s $135 billion, revenues $7 billion under; without a tax increase and control of spending the deficit "could exceed $28 billion." A surcharge of 10 percent on income taxes, corporate from July 1, 1967, individual from Oct. 1, to June 30, 1969, or as long as the war''s costs require; $6.3 billion in fiscal 1968. January''s proposal had been 6 percent. Corporate payments speeded; the excises on automobiles and telephones held. At least 45,000 more men to Vietnam this fiscal year. A news conference on the message the same day.'
    n: 'Special Message to the Congress: The State of the Budget and the Economy, [1967 Pub. Papers 733](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=125) (Aug. 3, 1967); The President''s News Conference on the Tax Message, [1967 Pub. Papers 740](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=132) (Aug. 3, 1967). [Johnson and Fowler, 9:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-july-26-1967), July 26, Conversation WH6707-01-12006 (Miller Center). [[w.zelizer-taxing-america]], 258 (the 10 percent surcharge); [[w.gibbons-u-s-government-and]], IV, 756, 758 (the message and the 10 percent; the 45,000 men); [[w.califano-triumph-and-tragedy-of]], 244 (the "clear and present dangers" of a deficit over $28 billion); [[w.branch-at-canaans-edge]], 634 (the 10 percent surcharge; 55,000 more men, a ceiling of 525,000); [[w.zelizer-fierce-urgency-of-now]], 279 (a 10 percent surcharge, $2 billion in cuts; $6.3 billion, $7.4 billion with the excises); [[w.bernstein-guns-or-butter]], 369 (the deficit could exceed $28 billion; 10 percent, from July 1 and Oct. 1); [[w.berman-lyndon-johnsons-war]], 60 (the request renewed, 10 percent; Mills for cuts of the same size; no bill reported in 1967); [[w.drea-mcnamara-clifford-and-the-2011]], 173 (the special budget message: 43,000 more troops for Vietnam); [[w.zaroulis-who-spoke-up]], 120–21 (Aug. 3: a 10 percent surcharge on personal and corporate taxes; 45,000 to 50,000 more troops, to 486,000 by December; the deficit "unsafe and unmanageable"). To check: William Forti to Laurence Woodworth, Aug. 4, 1967, National Archives, RG 128, Box 465, File: Economic (cited by [[w.zelizer-taxing-america]], 258 n.13); Joseph Barr to Lyndon Johnson, Aug. 11, 1967, National Archives, RG 56, Office of Tax Policy, Box 68, File: Tax Increase (cited by [[w.zelizer-taxing-america]], 258 n.13). See [[cal.1967-01-10.economy]]. Names: Johnson.'
