  - id: cal.1967-08-07.vietnam-congress
    when: Aug. 7
    date: '1967-08-07'
    thread: vietnam-congress
    c: 'Mansfield in the Senate, against escalation "in which the enemy can match and outmatch us": stop the bombing of the North but for the supply lines at the 17th parallel, as Cooper proposed; finish the barrier below the DMZ; revive the Security Council resolution of January 1966. Cooper with him.'
    n: '[113 Cong. Rec. 21636–38](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt16/pdf/GPO-CRECB-1967-pt16-5-2.pdf#page=53) (Senate, Aug. 7, 1967). [[w.gibbons-u-s-government-and]], IV, 758. To check: McNamara''s and Rostow''s suggested answers for Johnson, Aug. 7, 1967, WHCF, ND 19/CO 312, and NSF, Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 758 n.133). See [[cal.1967-05-15.vietnam-congress]]. Names: Mansfield, Cooper.'
